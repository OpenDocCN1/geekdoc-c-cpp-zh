  md: '# # Appendix C

    C23 Differences


    As of this writing, C23 is the latest version of C. This appendix lists its differences
    from C17, the previous version of C. Because of C23''s newness, many existing
    programs are written in older versions of C. If you need to maintain such programs
    and can''t switch to compiling with a C23 compiler, alternatives for C23 features
    are given when possible.


    # ## C.1 Aggregate Initialization


    Prior to C23, array (§6.2) structure (§10.3), and union (§11.2), collectively
    aggregates, that were initialized via the = { } syntax could not have the {} empty.
    At a minimum, you had to do {0}, i.e., include a zero, that you can still do.


    # ## C.2 aligns and alignof


    Prior to C23, aligns was named _Aligns (§2.2 #7, p.29) and alignof (§3.17) was
    named _Alignof. There was also the stdalign.h header that did:


    ```

    #define aligns _Aligns

    #define alignof _Alignof

    ```


    so you could use the lower-case names if you wanted to. Both _Aligns and _Alignof
    are still supported and likely will continue to be for many years.'
  merge: -1
  pgno: 381
- img_proc: true
  md: '# C.3 Attributes


    Prior to C23, attribute syntax (§4.9) was either implementation defined or had
    specific keywords:


    ```

    __attribute__((attribute-list)) clang and gcc

    __declspec(attribute-list) Microsoft C

    ```


    The implementation defined syntax for their respective compilers will likely be
    supported indefinitely.


    # C.4 auto


    Prior to C23, auto could be used only as a storage class (§4.3.1). Objects had
    to be declared of a specific type. Use of auto to deduce the type automatically
    was not supported. However, both clang and gcc offer __auto_type as an extension.†


    # C.5 Binary Literals


    C23 adopted binary literals from C++. Previously, only decimal, octal, and hexadecimal
    integer literals (§2.5) were supported. This includes the standard library functions
    strtol, strtol, and strtoull (§12.4.2) not supporting either the 0b or 0x prefix.
    As an alternative, you can use a wrapper around these functions accept either
    prefix. A wrapper for strtol is shown in listing C.1.


    # C.6 bool


    Originally, C didn''t have any Boolean type; int was used instead. C99 added one,
    but it was called _bool (§2.2 #7,p.29), so you may see that in older code. However,
    the false and true keywords were not added; you still had to use zero or non-zero,
    relatively. C99 also added the stdbool.h standard header that did:


    ```

    #define bool Bool

    #define false 0

    #define true 1

    ```


    > Referring to a Type with __auto_type. Free Software Foundation, GNU C Language
    Manual, §20.4, 1988–2025.

    https://www.gnu.org/software/c-intro-and-ref/manual/html_node/Auto-Type.html'
  merge: -1
  pgno: 382
