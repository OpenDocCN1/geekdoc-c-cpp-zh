  md: "# # Chapter 21\nrestrict\n\nAmong other things, C99 added the restrict keyword\
    \ as a way for a programmer to specify that a pointer is the only pointer to a\
    \ given object in a scope, and consequently, give the compiler a \"hint\" that\
    \ it may perform additional optimizations when accessing the object via that pointer.\n\
    \n# ## 21.1 The Problem\n\nTo illustrate the problem that restrict solves, consider\
    \ the function in listing 21.1.\n\n```\nvoid update_ptrs( int *p, int *q, int\
    \ const *v ) {\n    *p += *v;\n    *q += *v;\n}\n```\n\n**Listing 21.1:** will\
    \ generate x86-64 assembly for like:\n\n```\n1 mov eax, [rdx]   ; tmp = *v\n2\
    \ add [rdi], eax   ; *p += tmp\n3 mov eax, [rdx]   ; tmp = *v\n4 add [rsi], eax\
    \   ; *q += tmp\n```\n\nYou might wonder why it generates line 3 since it seems\
    \ redundant with line 1. The problem is the compiler can't know you didn't do\
    \ something like this:\n\n```\nint x = 1, v = 2;\nupdate_ptrs(&v, &x, &v); //\
    \ x = 5, v = 4\n```\n\nIn update_ptrs, p and v would alias the same int, the compiler\
    \ has to play it safe and ensure that the value of *v changes between reads, hence\
    \ the additional instruction."
  merge: -1
  pgno: 318
- img_proc: true
  md: "In general, pointers in C confound optimization since the compiler can't know\
    \ whether two pointers alias each other. In performance critical code, eliding\
    \ memory reads could be a huge win if the compiler could do it.\n\n# 21.2 The\
    \ Solution\n\nTo solve the aforementioned problem, restrict was added to C to\
    \ allow you to specify that a given pointer is the only pointer to an object in\
    \ the pointer's scope, i.e., no other pointer in the same scope aliases it.\n\n\
    To use restrict, insert between * and the pointer's name in a declaration (like\
    \ a const pointer, §17). An update_ptrs rewritten to use restrict is shown in\
    \ 21.2.\n\n```\nvoid update_ptrs_v2( int *p, int *q ) {\n    int const *restrict\
    \ v;\n    *p += *v;\n    *q += *v;\n}\n```\n\nListing 21.2: Function to update\
    \ pointers, version 2, with restrict\n\n(Read from-to-left, e.g., v is a restricted\
    \ pointer to a constant int.) By adding restrict, the compiler can now generate\
    \ assembly like:\n\n```\nmov eax, [rdx]   tmp = *v\nadd [rdi], eax   *p += tmp\n\
    add [rsi], eax   *q += tmp\n```\n\nThe compiler was able to elide the previous\
    \ line 3 of the additional mov instruction. Perhaps the best-known example where\
    \ restrict is used is the standard function memcpy (§B.2).\n\n```\nvoid* memcpy(\
    \ void *restrict dst,\nconst *restrict src, size_t n );\n```\n\nIt's the fastest\
    \ to copy memory if the src and dst addresses do not overlap. The slightly slower\
    \ memmove (§B.2) exists for use when the addresses overlap.\n\n# 21.3 Pitfalls\n\
    \nMisuse of restrict results in undefined behavior (§15), for example, by passing\
    \ pointers that alias each other to update_ptrs_v2 or memcpy. In some cases, the\
    \ compiler can warn you, but not in all cases, so't rely on the compiler to catch\
    \ misuses."
  merge: -1
  pgno: 319
- img_proc: true
  md: "# 21.4 When (and When Not) to Use restrict\n\nNote that restrict is for a given\
    \ scope. Assigning one restricted pointer to another in the same scope results\
    \ in undefined behavior:\n\n```\nvoid f( int *restrict d, int *restrict s ) {\n\
    \    int *restrict p = s; // undefined behavior\n```\n\nHowever, you can assign\
    \ a restricted pointer to an unrestricted pointer just fine:\n\n```\nvoid f( int\
    \ *restrict d, int *restrict s ) {\n    int *p = s; // OK\n```\n\nEven though\
    \ p is unrestricted, the compiler can still perform the same optimizations. It's\
    \ also OK to assign a restricted pointer in an inner scope to another in an outer\
    \ scope (but not the other around):\n\n```\nvoid f( int *restrict d, int *restrict\
    \ s ) {\n    int *restrict p = s; // inner scope\n    // ...\n    s = p; // undefined\
    \ behavior\n}\n```\n\n# 21.4 When (and When Not) to Use restrict\n\nYou should\
    \ definitely profile your code ($18.9) and perhaps even look at the generated\
    \ assembly code to see if using restrict actually makes a significant performance\
    \ gain to justify the potential pitfalls. Diagnosing bugs caused by misuse of\
    \ restrict is very hard to do.\n\nSecond, if use of restrict is confined to a\
    \ function where the memory access via restricted pointers was allocated by you,\
    \ it's safer. For example:\n\n```\nvoid safe( unsigned n ) {\n    n += n % 2 !=\
    \ 0; // make even by rounding up\n    unsigned *const array = malloc(n * sizeof(unsigned));\n\
    \    unsigned *restrict half_lst = array;\n    unsigned *restrict half_2nd = array\
    \ + n/2;\n    // ...\n    free(array);\n}\n```\n\nthe code above could order the\
    \ first and second halves of array safely because they don't overlap (assuming\
    \ you never access half_lst[n/2] or beyond).\n\nThird, if restrict is used in\
    \ a function's parameters, then it's potentially less safe. For example, contrast\
    \ safe with update_ptrs_v2 where the caller controls the pointers. For all you\
    \ know, the caller got wrong and passed pointers aliases."
  merge: -1
  pgno: 320
- img_proc: true
  md: "# 21.5 Miscellaneous\n\nOnly pointers to objects (or void) can be qualified\
    \ with restrict:\n\n```\nrestrict int x;           // can't restrict non-pointer\n\
    int restrict *pi;        // can't restrict non-pointer\nint (*restrict pf)();\
    \      // can't restrict pointer to function\n```\n\nYou can use restrict for\
    \ structure members as shown in listing 21.3.\n\n```\nstruct node {\n    void\
    \ *restrict data;\n    struct node *restrict left, *restrict right;\n};\n```\n\
    \nListing 21.3: restrict with structure members\n\nThat says data will be the\
    \ only pointer to that data and left and will never point to the same node. Using\
    \ restrict for structure members is very uncommon.\n\n+   C++ adopted restrict\
    \ from C. Why not? The answer is fairly long and complicated, but the short version\
    \ is that:\n* restrict can be a source of hard-to-find bugs that the C++ committee\
    \ didn't want to adopt from C.\n* C++'s increased use of pointers, e.g., this\
    \ making restrict safely even harder.\n\nHowever, many C++ compilers offer __restrict__\
    \ as an extension.¹\n\n# 21.6 Epilogue\n\nHere are some key points about some\
    \ advice for restrict:\n\n+   * restrict exists to tell the compiler that a pointer\
    \ is the only pointer to an object in a scope so it can generate more efficient\
    \ code.\n* restrict is syntactically a qualifier like Atomic, const, and volatile.\n\
    * Unlike the other qualifiers, restrict can be used for pointers.\n* In limited\
    \ cases, using restrict can lead to performance gains.\n* Diagnosing bugs caused\
    \ by misuse of restrict is very hard to do.\n* Before even considering restrict,\
    \ profile your code first (§18.9).\n\nUse wisely.\n\n> ¹Restricting Pointer Aliasing,\
    \ Free Software Foundation, Using the GNU Compiler Collection, §7.2. 1988–2025.\
    \ https://gcc.gnu.org/linedocs/gcc/Restricted-Pointers.html"
  merge: -1
