  md: '# 8.7.5 Concatenation


    The second preprocessor operator is (confusingly, again) ## that concatenates
    or

    pastes its two arguments:


    ```

    #define PASTE(A,B)   A ## B

    PASTE(x, y) // results in: xy

    ```


    Specifically, ## between two parameter name concatenates the set of tokens com-\prising
    the corresponding arguments for these parameters. Additionally, there can

    be multiple ## in a row:


    ```

    #define PASTE3(A,B,C)   A ## B ## C

    ```


    Arguments can be omitted resulting in empty arguments. For example:


    ```

    PASTE(,) // (nothing)

    PASTE(x,) // x

    PASTE(,y) // y

    ```


    This is even true for one argument:


    ```

    STRINGIFY() // "

    ```


    # 8.7.6 and ## Pitfalls


    Curious (and often annoying) thing about arguments for # or ## is that

    ither expands its arguments even when they''re themselves macros. For example,

    the previous definition of PASTE can be insufficient:


    ```

    PASTE(var_, __LINE__) // results in: var__LINE__

    ```


    What you want is a result like var_1941, that is the prefix var_ followed by the

    Current line number.(Such names are typically used to help ensure unique names).
    The

    problem is that, while PASTE expands B into the argument LINE,

    if the argument itself is a macro that ordinarily would expand (in this case,
    to the

    Current line number), it won''t be expanded.


    To fix it (as with many other problems in software) requires an extra level of

    irection:'
