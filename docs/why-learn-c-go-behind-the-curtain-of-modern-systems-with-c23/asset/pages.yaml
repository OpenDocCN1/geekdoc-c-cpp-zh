  md: '+   • Deciding whether to use _Atomic instead of a mutex is a choice between
    a possible performance gain and simpler and relatively safer code. Like many other
    things in computer science, it''s a trade-off. But it''s your trade-off to make
    for your circumstances rather than be stuck with whatever trade-offs the implement
    makes when programming in a language that provides data structures built-in or
    part of its standard library.


    +   • Your algorithm matters more than the choice between _Atomic and a mutex.


    +   • Thread-safety in general and using _Atomic with memory barriers specifically
    is very hard to get right, even for experts.


    +   • Before using _Atomic,profile your code (§18.9) to see if it''s spending
    too much time either locking or waiting for locks.


    +   • Be aware of the ABA Problem. Versioned pointers are a technique to solve
    it.


    +   • Be aware of false sharing.


    Use wisely.


