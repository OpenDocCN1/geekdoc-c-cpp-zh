    files in the same directory; larger programs further divide files into directories
    by “subsystem,” where each subsystem focuses on one aspect of the program. For
    example, a compiler might be broken down into subsystems like lexer, parser, symtable,
    codegen, optimizer, and util.


    # 13.9 Build Tools


    Unlike modern languages, C has no official build beyond the compiler and linker,
    specifically tools for building sets of files comprising any non-trivial C program.
    You could easily do something like:


    ```

    $ cc -o ad *.c                                     # works, but inefficient

    ```


    that would compile all the .c files and link them into an executable named ad,
    but that would recompile all files needlessly every time you recompiled. If you
    change files, you ideally want to recompile those files and *only* other files
    that depend on (`#include`, $8.6) the ones you changed.


    The oldest tool is Make. To use it, you create a Makefile containing both of dependencies
    (which files depend on other files) and list of commands needed to build files
    when the file on which they have changed (a later time-stamp), e.g., by build
    a .o file from a .c file.


