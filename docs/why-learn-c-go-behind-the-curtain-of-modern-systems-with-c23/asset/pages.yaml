  md: "```\nchar const *const COLORS[] = {\n  \"black\", \"white\", \"blue\", \"green\"\
    , \"red\"\n};\n```\n\nAn array of strings could be declared as a true two-dimensional\
    \ array:\n\n```\nchar const COLORS_2D[1][6] = {\n  \"black\", \"white\", \"blue\"\
    , \"green\", \"red\"\n};\n```\n\nbut it's inconvenient because, although the compiler\
