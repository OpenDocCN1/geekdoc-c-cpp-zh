  md: '# Part I the core of the C23 standard of C:


    +   1. A Tour of C: Gives “tour” of C’s major features to give you a feel for
    the language including main, I/O, arrays, strings, functions, memory organization,
    pointers, dynamic memory management, and structures.


    +   2. Comments, Names, and Types: Covers comments, names, scope, built-in types,
    typedef, signed integer overflow, choosing an appropriate integer type, and type
    conversions.


    +   3. Operators: Covers C’s arithmetic, plus and minus, increment, decrease,
    relational, logical, conditional, bitwise, assignment, function call, array indexing,
    address, dereference, member access, casting, comma, sizeof, and alignof operators.


    +   4. Declarations: Covers the C declaration syntax, multiple declarations, auto,
    storage classes, constexpr, type, and attributes.


    +   5. Statements: Covers C’s statements of expression, compound, if-else, while,
    do-while, for, break, continue, switch, return, goto, and empty.


    +   6. Arrays and Pointers: Covers array declaration, initialization, indexing,
    multidimensional arrays, void pointers, pointers to pointers, arrays and pointers,
    arrays vs. pointers, pointers to function, multidimensional arrays vs. compound
    literals, and variable length arrays.


    +   7. Enumerations: Covers enumerations, declaration, name collisions, their
    implicit conversion, and values.


    +   8. Preprocessor: Covers the C preprocessor, its language, compilation phases,
    object-like macros, predefined macros, conditional compilation, file inclusion,
    function-like-macros, X macros, and gives some useful macros.


    +   9. Functions: Covers function declarations, definitions, parameters, array
    parameters, return values, error handling, main, static functions, static local
    variables, and inline and variadic functions.


    +   10. Structures: Covers structure definitions, initialization, compound literals,
    padding, flexible array members, and bit fields.


    +   11. Unions: Covers union definitions, initialization, compound literals, type
    punishing, and restricted class hierarchies.


    +   12. Input, Output, and Files: Covers output, printf, files, directories, input,
    scanf, environment variables, and other related functions.


    +   13. Program Organization: Covers guards, opaque types, sufficient headers,
    cooperating with C++, program initialization and clean-up, how to organize program
    source files, and build tools.


    +   14. Multithreading: Covers creating, joining, and detaching threads, “atomic,”
    mutex, thread variables, thread_local, and thread-specific storage.'
