  md: '# 3.14 Casting Operator


    As first shown in listing 1.4 (p.10), an expression of the form:


    ```

    (type)expr

    ```


    is a cast that converts the value of expr to type. There are several cases for
    casting:


    +   1. To suppress a warning when converting a value of some type to a smaller
    type, e.g., int to char (as in listing 1.4, p.10, line 14).

    2. To suppress a warning when converting a signed value to an unsigned type, e.g:

    ```size_t pos = (size_t)-1; // typical sentinel value```

    Using size_t assigning a negative value to it will necessarily change its signedness.
    A compiler may warn you about this unless you use a cast. (In two''s complement
    math, -1 will the largest possible value for size_t.)

    3. Converting an integer to a floating-point type so an expression is evaluated
    using floating-point math. For example, assuming x and y are integer types, in:

    ```double c = (double)x / y;```

    if the (double) were not then the / "coerces" x to double so then the / operator
    will automatically convert y to double ($13.2 #2, p.43) and / will instead perform
    floating-point division. (It doesn''t matter if you cast instead: the result would
    be the same.)

    4. Either to truncate or round a floating-point value to an integer type. For
    example:

    ```int round_half_up( double d ) {

    return (int)(d + .5);

    }```

    d d rounded (for a particular definition of round) to the nearest integer.

    5. To discard the value of an expression by casting to void (§3.14.1).

    6. To cast away const (§3.14.2).

    7. To cast the underlying bits of a value to a type via a pointer (§3.14.3).


    When using a cast, you''re telling the compiler that you know what you''re doing,
    don''t warn you (which means you really had better know you''re doing).'
