  md: '# Chapter 3

    Operators


    C has a plethora of operators as shown in table 3.1. Operators are listed in precedence
    order from highest to lowest separated by horizontal lines. Operators in the same
    cell have the same precedence. An operator in a given cell will be bound more
    tightly to its operands than any operator in cell below it. For example, *++ is
    treated as (*++) and not (*++)++ (post-increment, $3.4) is higher than * (dereference,
    $3.12). Despite the large number of precedence levels, the precedence of operators
    in expressions is generally what you''d expect (with the unfortunate exception
    of the bitwise operators, $3.8).


    # 3.1 Associativity vs. Evaluation Order


    Associativity has only to how expressions are parsed, for example:


    ```

    s = a - b + c;               // left-to-right; as if: (a - b) + c

    x = y = z;               // right-to-left; as if: x = (y = z)

    ```


    Left-to or right-to-left associativity is not the same as left-to-right or right-to-left
    evaluation. In C, the order of evaluation is generally unspecified. For example:


    ```

    s = f() - g() + h();       // parsed as: (f() - g()) + h()

    ```


    Even the value of f() - g() will be calculated, then the value of h() added, the
    order in which the functions themselves are unspecified, e.g., h() could be called
    first. The values could be calculated like:


    ```

    h_val = h();

    g_val = g();

    f_val = f();

    s = f_val - g_val + h_val;

    ```'
