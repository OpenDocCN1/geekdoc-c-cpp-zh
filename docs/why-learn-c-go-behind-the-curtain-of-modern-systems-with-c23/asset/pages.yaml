  md: "# C.19 typeof and typeof_unqual\n\nPrior to C23, typeof and typeof_unqual are\
    \ not supported. However, clang, gcc, and Microsoft C, offer typeof (or __type__)\
    \ as an extension.† Unfortunately, they do not offer an extension for typeof_unqual.\n\
    \n# C.20 __VA_OPT_\n\nPrior to C23, the __VA_OPT__ preprocessor macro ($8.7.3)\
    \ was not supported, but many compilers compiled it as an extension. As an alternative,\
    \ clang, gcc, and Microsoft C, support a non-standard extension‡ to the preprocessor's\
    \ ## concatenation operator ($8.7.5), for example:\n\n```\n#define INTERNAL_ERROR(FORMAT,\
    \ ...) \\\\\nfatal_error(EXIT_INTERNAL, \\\n    \"%s:%d: internal error: \" FORMAT,\
    \ \\\n    FILE__, __LINE__, __VA_ARGS__)\n```\n\nWhen ## is placed between a comma\
    \ and __VA_ARGS__, the comma is deleted if __VA_ARGS__ expands into nothing, hence\
    \ this equivalence:\n\n| Extension | Standard |\n|---|---|\n| ##__VA_ARGS__ |\
    \ __VA_OPT__(,) __VA_ARGS__ |\n\nNote that ##__VA_ARGS__ works only in the specific\
    \ case of the token before the ## being a comma, hence __VA_OPT__ is more general.\n\
    \n# C.21 Variadic Functions\n\nPrior to C23, variadic functions ($9.11) required\
    \ at least one non-variadic parameter, for example:\n\n```\nint printf(char const\
    \ *format, ...);\n```\n\nand you had to supply that parameter as a second argument\
    \ to va_start:\n\n```\nva_start(args, format);\n```\n\n> †Referring to a Type\
    \ with typeof, Free Software Foundation, Using the GNU Compiler Collection, $6.7,\
    \ 1988–2025. https://gcc.gnu.org/onlinedocs/gcc/Typeof.html\n\n> ‡Variadic Macros,\
    \ Free Software Foundation, The C Preprocessor, $3.6, 1987–2025, https://gcc.gnu.org/onlinedocs/cpp/Variadic-Macros.html"
