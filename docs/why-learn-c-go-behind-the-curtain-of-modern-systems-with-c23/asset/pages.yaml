  md: '# 3.8 Bitwise Operators


    C provides a shorthand via the "?:" conditional (aka, ternary) operator:


    ```

    cond-expr ? true-expr : false-expr

    ```


    For example:


    ```

    max = i > j ? i : j;                // maximum of i, j

    ```


    Specifically, *cond-expr* is evaluated first: if true (non-zero), then (and only
    then) is *true-expr* evaluated and that is the result; otherwise, then (and only
    then) is *false-expr* evaluated and that is the result. C guarantees left-to-right
    evaluation. In particular, for an expression like:


    ```

    r = x > y ? ++i : f();

    ```


    i will be incremented only if i > x and f() called only if not (the same as if
    if-else used):


    The type of *cond-expr* may be integer ($2.5), floating-point ($2.5.6, $2.5.7,
    $2.8), enumeration ($7), or pointer ($6.7) type.


    Note that an expression using ?: can be used anywhere, even inside another?: For
    example:


    ```

    r = i < j ? -1 : i > j ? 1 : 0;

    ```


    sets r to -1 if i < j, 1 if i > j, or 0 if i == j. Even though the precedence
    and associativity of ?: yield the correct result here, these expressions are clearer
    if you insert ():


    ```

    r = i < j ? -1 : (i > j ? 1 : 0);      // same, but clearer

    ```


    There can be cases where the precedence is *not* what you might expect, for example:


    ```

    r = x + add_dx ? dx : 0;      // means: (x + add_dx) ? dx : 0

    ```


    While the intent is to add x and only if add_dx is true, the reality is that because
    + has a higher precedence than ?, the result is dx if the sum of x and add_dx
    is true (non-zero). (A good compiler will warn you about the precedence here.)
    In such cases, () are necessary.


