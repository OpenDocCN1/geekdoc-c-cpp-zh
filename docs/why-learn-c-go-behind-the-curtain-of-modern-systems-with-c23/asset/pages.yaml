  md: "# 20.4 longjmp\n\n# 20.3 volatile Variables\n\nAny local variables to the function\
    \ in which setjmp is called that are modified between the calls to setjmp and\
    \ longjmp must be declared volatile (§22). For example:\n\n```\nint volatile count\
    \ = 0;\nif ( setjmp( env ) == 0 ) {\n    ++count;\n}\n```\n\nWhy? One of the things\
    \ setjmp does is to save the values of all the CPU registers. If a local variable\
    \ is put into a register by the compiler, then if longjmp is called and setjmp\
    \ returns the second time, it restores the values of the registers. For the above\
    \ example, if count were not declared volatile, then:\n\n+   - The initial value\
    \ of count (in a register) is 0.\n- setjmp saves this value.\n- The code then\
    \ does ++count setting value to 1.\n- If longjmp is called, setjmp returns the\
    \ second time restoring the values of all registers including the register used\
    \ by count whose value is 0.\n\nThe use of volatile prevents the compiler from\
    \ storing the value of a variable in a register (among other things), hence it’s\
    \ stored in the local stack frame instead and so is unaffected by register restoration.\n\
    \n# 20.4 longjmp Details\n\nCalling longjmp returns to the function that called\
    \ setjmp. That function must still be on the stack. For example, you can’t “wrap”\
    \ calls to setjmp as shown in listing 20.2.\n\n```\nint wrap_setjmp(jmp_buf env\
    \ ) { // don't wrap setjmp\n    if ( setjmp(env ) == 0 )\n        return 0;\n\
    \    return 1;\n}\n\nvoid read_file(char const *path ) {\n    if ( wrap_setjmp(env\
    \ ) == 0 ) {\n        //..\n\n```\n\n> Listing 20.2: Don't wrap setjmp\n\nThe\
    \ reason you can’t is because longjmp jumps back to the setjmp — but in this case,\
    \ that was inside wrap_setjmp that has already returned. This results in undefined\
    \ behavior (§15)."
  merge: -1
  pgno: 315
- img_proc: true
  md: "The second argument to longjmp can be any non-zero value you want. It becomes\
    \ the second return value of setjmp. For example, you can use it for error codes\
    \ in listing 20.3.\n\n```\nconstexpr unsigned EX_FILE_IO_ERROR = 0x01001\nconstexpr\
    \ unsigned EX_FILE_NOT_FOUND = 0x01002;\n```\n\n```\nvoid read_file(char const\
    \ *path ) {\n    switch ( setjmp( env ) ) {\n        case 0:\n            read_file(\
    \ path );\n            break;\n        case EX_FILE_IO_ERROR:\n            //\
    \ ...\n            break;\n        case EX_FILE_NOT_FOUND:\n            // ...\n\
    \            break;\n    }\n}\n```\n\n# **Listing 20.3:** Using error codes with\
    \ setjmp\n\nIncidentally, you can't meanfully pass 0 as the second argument to\
    \ longjmp: if you do, it will be silently changed to 1.\nLastly, variable length\
    \ arrays (§64.14) must not be used at when using longjmp. If there are VLAs anywhere\
    \ in the call stack between the longjmp and the setjmp, those will likely cause\
    \ a memory leak (§18.6.7).\n\n# 20.5 Exceptions in C?\n\nNow that you know how\
    \ setjmp and longjmp work, you might be wondering whether they can be used to\
    \ implement exceptions in C. The answer can be best up as:\n\n> Ooh ... Short\
    \ answer: yes, with an if; long answer: no, with a but.\n— Rev. Timothy Lovejoy,\
    \ Jr.†\n\nFor a more detailed answer, see §27.\n\n# 20.6 Epilogue\n\nHere are\
    \ some key points about and some advice for setjmp and longjmp:\n\n†Harry Shearer\
    \ (Rev. Timothy Lovejoy, Jr.), “Hurricane Neddy,” The Simpsons, 8(8), Matt Groening\
    \ (creator), Gracie Films, Dec. 29, 1996."
