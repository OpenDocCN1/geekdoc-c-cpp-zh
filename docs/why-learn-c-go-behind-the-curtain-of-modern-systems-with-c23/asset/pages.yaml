  md: '# # Chapter 4

    Declarations


    ![](img/3351c1095f7fa1e1a549dc9b17ad7247_81_0.png)


    > > “I''m still uncertain about the language declaration syntax, where in declarations,
    syntax is used that mimics the use of the variables being declared. It is one
    of the things that draws strong criticism, but it has a certain logic to it.”

    — Dennis Ritchie


    > > “I consider the C declaration syntax an experiment that was failed.”

    — Bjarne Stroustrup


    We''ve seen many examples of declarations of constants and variables already,
    this chapter fills in the details. (Function declarations are deferred until §9).


    +   - As designing a programming language, you generally need to design a syntax
    for declaring things (variables, constants, functions, etc.). The advantage of
    a separate syntax is that it''s usually clear; the (slight) disadvantage is that
    a separate syntax doesn''t tell you how to use the thing being declared. For example,
    to declare api as an array of pointers to integer in Pascal:


    ```

    api: array[0..4] = ^integer;

    ```


    That reads left-to-right and is crystal clear; but to *use* the variable in an
    expression, you wrote something like:


    ```

    api[0]^ := 42;

    ```


    Notice that:


    +   - In the declaration, api and ^ are not adjacent (whereas in they use).

    - In the declaration, ^ is prefix (whereas in use it''s postfix).


    The epigraph suggests, Ritchie took a different approach. To declare anything
    in C, you write the name of what you are declaring as if it were used in an expression
    (part of the main syntax for the language) to yield a value of the base type that
    you prepend to the whole thing — the type of the “expression.” Hence, the equivalent
    declaration of api in C is:


    ```

    int *api[4]; // array of pointer to integer

    ```


    That does not read left-to-right (nor right-to-left). Instead, api used in an
    expression like *api[] yields a value of an int (the type on the left). A bit
    strange string, as Ritchie noted, have a certain logic to it.


    © Paul J. Lucas 2025

    P. J. Lucas, Why Learn C, https://doi.org/10.1007/979-8-8688-1597-3_4


