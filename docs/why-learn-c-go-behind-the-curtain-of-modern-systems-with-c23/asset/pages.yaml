  md: '# Preface


    +   Learning C: teaches the C23 standard of C, includes many additional notes
    on C''s history and philosophy, and also includes best-practices I''ve learned
    over my thirty-five year career.


    +   Selected Topics: explains several additional advanced or obscure parts of
    C that I''ve found not to be explained well, if at all.


    +   Extended Examples: gives detailed examples with full source code of how features
    in other languages might be implemented including discussion of the tradeoffs
    involved so you can understand what''s really going on behind the curtain in whatever
    language you program in.


    Additionally, there''s an appendix that lists differences between C23 and C17,
    the previous version of C.


    # Notes to the Reader


    This book is intended for professional programmers, computer science students,
    or serious hobbyists who want to learn C or get up-to-date on C23.


    Consequently, this book assumes familiarity with programming language concepts
    such as variables, loops, functions, arrays, classes, objects, etc. Though no
    knowledge of any particular language is assumed, a few concepts from C++ are alluded
    to (not surprisingly).


    This book also assumes familiarity with algorithm characterization in "big O"
    terms of n, the size of the input, the most common of which are:


    ```

    O(1) Constant time: same amount of time regardless of n.

    O(lg n) Logarithmic time: base-2 logarithm (lg n) time, e.g., lg 10000 ≈ 13.

    O(n) Linear time: proportional to n.

    ```


    This book''s content is presented as follows:


    +   - Concepts that are essential for learning C are presented normally like this.

    - Commentary, explanations for why something is the way it is, historical context,
    and personal opinion, i.e., things not essential for learning C, but less interesting
    (hopefully), are presented as inline notes that are indented and bracketed by
    little squares.

    - Like this.

    - Unless otherwise noted, cross references like §X, §X.Y, or §X.YZ, refer to chapter
    or appendix X, section X.Y, or subsection X.YZ, respectively, of this book.

    - Footnotes† are used for references to other sources.


