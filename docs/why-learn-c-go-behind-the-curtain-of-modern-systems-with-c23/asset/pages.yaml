  md: '# Chapter 17

    __Atomic


    ![](img/3351c1095f7fa1e1a549dc9b17ad7247_262_0.png)


    C has the _Atomic keyword that has two forms:


    ```

    _Atomic int ai;      // Atomic qualifier.

    _Atomic(type) // Atomic specifier.

    ```


    The qualifier form can be included in a declaration of any type (except arrays
    and functions) and may be used like any other qualifier of const ($4.5),volatile
    ($22), or restrict ($21). Listing 17.1 shows some example declarations.


    ```

    _Atomic int ai;      // atomic int

    int _Atomic ia;       // same


    int _Atomic *pai;      // pointer to atomic int

    int *_Atomic api;      // pointer to normal int

    int **Atomic apai; // pointer to atomic int


    int _Atomic const *pcai; // pointer to const atomic int

    //

    ```


    +   Listing 17.1: Example _Atomic declarations


    The specifier form is for compatibility with C++23 that defines the following
    macro in the std::h header:


    ```

    #if __cplusplus >= 202302 // C++23 or later

    # define _Atomic(T) std::atomic<T>

    #endif

    ```


    In either form, an _Atomic variable is “atomic” in meanings #1 and #2 ($14.3),
    specifically the increment and decrement operators ($3.4) as well as the assignment
    operators ($3.9) that T will work on an object of type _Atomic T except to do
    atomically. Other differences are the size, alignment, or both for _Atomic T may
    be different than for.


    © Paul J. Lucas 2025

    P. J. Lucas, Why We Learn C, https://doi.org/10.1007/979-8-8688-1597-3_17'
