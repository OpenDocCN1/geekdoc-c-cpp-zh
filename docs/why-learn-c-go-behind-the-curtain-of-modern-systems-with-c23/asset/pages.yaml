    (collectively, the standard-floating types). Decimal-floating types are supported
    only if the __STDC_IEC_60559_FP macro is predefined (§8.4).


    Decimal-floating types are better for calculations involving money (dollars, euros,
    pounds, etc.) because they''re not subject to the same rounding errors as the
    standard-floating types are. The standard-floating types are still better for
    general floating-point calculations.


    Literals for the decimal-floating types are the same as for the standard-floating
    types except instead have the suffixes df or DF for _Decimal32, dd or DD for _Decimal64,
    and dl or DL for _Decimal128.


