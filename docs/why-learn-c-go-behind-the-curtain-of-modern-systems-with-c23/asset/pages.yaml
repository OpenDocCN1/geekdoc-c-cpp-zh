    \nThe while statement is the simplest of the looping statements and is of the\
    \ form:\n\n```\nwhile ( expr )\nstatement\n```\n\nAs long as expr remains true,\
    \ it executes statement statement repeatedly. As with if, if statement needs to\
    \ be multiple statements, they're enclosed between {}.\nTo write an \"infinite\
    \ loop.\n make expr be true:\n\n```\nwhile ( true )\n// or, idiomatically: while\
    \ (1)\nstatement\n```\n\nInfinite loops can be broken out of via break ($5.7),\
    \ return ($5.9), goto ($5.10), or longjmp ($20.4).\n\n# 5.5 do-while\n\nThe do-while\
    \ statement is a variation on while and is of the form:\n\n```\ndo {\nbody\nwhile\
    \ ( expr );\n```\n\nUnlike,do-while evaluates its condition at the end of the\
    \ loop and is always executes its body at least once. As first shown in listing\
    \ 1.3 (p. 7), it's occasionally useful, though in practice used much less than\
    \ either while or for.\nUnlike either while or for, do-while is invariably used\
    \ with } even when there is only a single statement (otherwise the while looks\
    \ like an ordinary one). It's also considered good style to put the while on the\
    \ same line as the } so the while looks like the end of a do-while loop rather\
    \ than the start of a while loop."
