  md: "# Chapter 1 A Tour of C\n\nTo begin, the first chapter gives you a “tour” of\
    \ C's major features to give you a feel for the language including the main function,\
    \ I/O, arrays, strings, functions, memory organization, pointers, const, dynamic\
    \ memory management, and structures.\n\n# 1.1 A First Program\n\nThe canonical\
    \ first program shown in any programming language is “hello, world,” a simple\
    \ program that prints that phrase. In C, it's:\n\n```\n#include <stdio.h>\n\n\
    int main() {\n    printf(\"hello, world\\n\");\n}\n```\n\n+   - The “hello, world”\
    \ program was written by Kernighan as part of A Tutorial Introduction to the Language\
    \ B.¹ (As you might guess, B is a precursor to C B never gained widespread use.\
    \ When K&R was written, “hello, world” was the first C program. Since it's the\
    \ canonical first program shown for any programming language.\n\nC program source\
    \ files conventionally have a “.c” extension, assuming this program is in a file\
    \ hello.c, it must be compiled (converted from source code into an executable)\
    \ with a C compiler. On most Unix systems, the C compiler is named “cc” (short\
    \ for “C compiler”). To compile a program, at a shell prompt ($), cc follow by\
    \ the name of the source file to compile:\n\n> ¹A Tutorial Introduction to the\
    \ Language B, Brian W. Kernighan, Bell Laboratories Computing Technical Report,\
    \ #8, Murray Hill, New Jersey, Jan. 1973."
