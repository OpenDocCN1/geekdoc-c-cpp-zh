  md: "# 17.9 Epilogue\n\n```\nstruct lf_islist {\n    struct lf_islist *_Atomic head,\
    \ *_Atomic tail;\n};\n```\n\nAssume that your code has one thread pushing items\
    \ onto the tail of the list (repeatedly updating tail) and a second thread popping\
    \ items from the head of the list (repeatedly updating head). With lf_islist defined\
    \ as it is, head and tail will very likely reside on the same cache line. This\
    \ means updating one will invalidate the entire cache line adding otherwise unnecessary\
    \ contention for the other. This is known as false sharing.\n\nTo eliminate false\
    \ sharing, you want head and tail to reside on different cache lines so that one\
    \ doesn't affect the other. You can achieve this by aligning (§4.8) as shown in\
    \ listing 17.12.\n\n```\n#if defined(__arch64__) || defined(__powerpc__)\nconstexpr\
    \ unsigned CACHE_LINE_SIZE = 128;\n#elif // other CPU architectures\n// ...\n\
    #else\nconstexpr unsigned CACHE_LINE_SIZE = 64;\n#endif\n\nstruct lf_islist {\n\
    \    alignas(CACHE_LINE_SIZE) struct lf_islist *_Atomic head,\n    *_Atomic tail;\n\
    };\n```\n\n> Listing 17.12: Using alignas to eliminate false sharing\n\n+   -\
    \ Lines 1–7 define CACHE_LINE_SIZE in bytes using conditional compilation (§8.5)\
    \ based on object-macros defined for the CPU by the compiler. Aside from a few\
    \ exceptions, the cache line size for modern CPUs is 64 bytes so that it's a reasonable\
    \ default to align on line 6 if none of the #ifs match.\n- Lines 10–11 use alignas\
    \ to align both head and tail to be on cache-line size boundaries by intentionally\
    \ introducing padding (§10.5). This wastes a little bit of memory, but ensures\
    \ that head and tail reside on different cache lines and eliminates false sharing\
    \ between them.\n\n# 17.9 Epilogue\n\nHere are some key points and some advice\
    \ for _Atomic:\n\n+   - _Atomic is syntactically a qualifier like const, volatile,\
    \ and restrict.\n- For pointers, the pointer, the object pointed to, or both,\
    \ can be _Atomic.\n- In some cases, _Atomic can be used as an alternative to a\
