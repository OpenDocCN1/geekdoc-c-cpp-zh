    \ instead of having one pointer per function, you can have one pointer to a table\
    \ of functions as shown in listing 26.3.\n\n```\nstruct token_fn_tbl {\n    void\
    \ (*print_int)(long);\n    void (*print_float)(double);\n    void (*print_char)(char);\n\
    \    void (*print_str)(char const*);\n};\\n\nstruct token {\n    // ...\n    struct\
    \ token_fn_tbl const *fn_tbl;\n};\n\nstatic struct token_fn_tbl const FN_TABLE_DEFAULT\
    \ = {\n    &print_int, &print_float, &print_char, &print_str\n};\n\nvoid print_token(struct\
    \ token const *t ) {\n    switch (t->kind) {\n        case TOKEN_INT:\n      \
    \      t->fn_tbl->print_int(t->i);\n            break;\n        case TOKEN_FLOAT:\n\
    \            t->fn_tbl->print_float(t->f);\n            break;\n        case TOKEN_CHAR:\n\
    \            t->fn_tbl->print_char(t->c);\n            break;\n        case TOKEN_STR:\n\
    \            t->fn_tbl->print_str(t->s);\n            break;\n    }\n}\n```\n\n\
    **Listing 26.3:** Dynamic dispatch, version 3, using a function table\n\nNotice\
    \ that all tokens share a single default function table. To change the tokens,\
    \ create a different token_tbl instance with its pointers to printing different\
    \ functions and change fn_tbl to point only to those tokens to print differently.\
