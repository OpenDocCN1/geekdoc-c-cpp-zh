  md: '# 13.3 Self Sufficient Headers


    Before continuing, what it means for a header file to be self-sufficient needs
    to be defined:


    For example, a trivial program like:


    ```

    #include "color.h"

    int main() { }

    ```


    will compile without errors only if color.h is self-sufficient.


    # 13.3.1 Including Headers in a Header


    Typically, a header file will need to include other header files because the declarations
    make use of other declarations in those other header files. Within a header file:


    For example, color.h has its includes like:


    ```

    #include "config.h" // Good: include local headers ...

    #include "util.h"

    #include <stdio.h> // ... before standard headers.

    // ...

    ```


    Why not local headers first? This helps ensure that every header file is self-sufficient.
    For example, if you put standard headers first like:


    ```

    #include <stdio.h> // Bad: include of standard headers ...

    #include "util.h" // ... before local headers.

    ```


    then it''s possible for declarations in util.h to use declarations in stdio.h
    by "accident" without util.h itself including stdio.h. This will continue indefinitely,
    but if at some point you no longer need stdio.h and delete it #include, then you''ll
    get "undeclared" errors in util.h. Up until this time, you''ll never noticed that
    util.h isn''t self-sufficient. Once you notice, it''s easily fixed, but it''s
    better to avoid the problem in the first place by always including local headers
    before standard headers.'
