  md: '# # Chapter 18

    Debugging


    Inevitably, you''re going to have to debug your program. The top two ways to do
    so are to:


    +   - Temporarily add statements to print values of interest.

    - Use a debugger gdb† or lldb‡ (on Unix systems) or the one that''s bundled with
    IDE.


    The first is relatively straightforward; the second requires that you learn some
    debug commands or application. There are times, however, when neither method works.
    Frankly, there are other tools available. In §18.8, a case study for a bizarre
    bug and how it was diagnosed and fixed is presented.


    # ## 18.1 Printing Values


    When adding statements to print values of interest, you should print to standard
    error rather than standard output because standard error is generally unbuffered
    meaning all output is printed immediately after being buffered before whereas
    standard output is generally buffered. If debugging a crash and you''re printing
    to standard output, it''s possible that your program will crash before values
    of interest are printed.


    Additionally, if your program prints both standard output and standard error,
    the output can become unsynchronized through the difference in buffering. If available
    on your system, the dbuf command can change the buffering of standard output for
    your program by running:


    ```

    $ dbuf -o0 command

    ```


    > †https://www.sourceware.org/gdb/

    ‡https://lld.llvm.org/'
