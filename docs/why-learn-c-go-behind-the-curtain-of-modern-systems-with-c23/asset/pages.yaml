  md: '# 4.3 Storage Classes


    The advantages of auto are:


    +   * You don''t have to try figure out the type of an initializing expression.

    * If that ever changes, you don''t have to update the type of all variables initialized
    from an expression of that type.

    * For pointers, preserves the "const-ness" of the pointed-to type. For example,
    if pc is of char* and pce is of const*, then:


    ```

    auto p1 = pc;          // char *p1 = pc;

    auto p2 = pcc;          // char const *p2 = pcc;

    ```


    +   * It''s useful for writing type-generic macros ($8.7).

    * It''s useful with _Generic($19).


    However, auto should not be used when a variable is being initialized by a literal.


    ```

    auto count = 0;       // int need ou for unsigned

    auto c = ''?'';          // char literals are int

    ```


    In C:


    +   * Unordered integer literals are type of int, so if you want a type other
    than int, you need to use a suffix ($2.5.4) such as u for unsigned.

    * Oddly, character literals are of type int and not char as you might expect.


    Hence, use explicit types when initializing from a literal.


    # 4.3 Storage Classes


    In C, there are the concepts of duration and linkage of an object or function.
    A duration denotes when and for how long an object exists. There are three durations:


    +   1. **Automatic**: objects exist only within blocks. Objects declared within
    a block exist only within that block, that is they come into existence upon their
    declaration and cease to exist at the end of the block ({ }). For example, from
    listing 1.5 (p.12):


    ```

    unsigned putubin( unsigned n ) {

    // ...

    unsigned digits = 0;

    ```


    both function parameters (such as n) and local variables (such as digits) have
    automatic duration. (Even though n is declared before the {, it''s "injected"
    into the subsequent block scope).


    +   2. **Static**: objects exist for the entire duration of the program ($9.9).

    3. **Thread**: objects exist so as long as their thread does ($14.7).'
