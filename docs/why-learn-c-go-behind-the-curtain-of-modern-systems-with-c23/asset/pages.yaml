    \ literal on line 4 is limited to line 4.\n\n```\nvoid f(int const *a) {\n   \
    \ int *p;\n    if (a == nullptr) {\n        p = (int[]) { 0 }; // [int[] exists\
    \ only on this line\n    }\n    int n = p[0]; // undefined behavior\n//\n```\n\
    \n**Listing 6.6:** Compound literal lifetime\n\nOutside of scope, p becomes a\
    \ dangling pointer (a pointer to an object that no longer exists), any attempt\
    \ at access, such as on line 6, results in undefined behavior ($\\{15\\}$).\n\n\
    The *(type*) of a compound literal may optionally include a storage class ($\\\
    $4.3$), but only one of constexpr ($\\$4.4$),register ($\\$4.3$),static ($\\$4.3$),or\
    \ thread_local ($\\$14.7$). To fix the lifetime in 6.6, you can either remove\
    \ the { } on lines 3 and 5 (the scope of the compound literal will be the entire\
    \ function) or include static like:\n\n```\np = (static int[]) { 0 }; // [int[]\
    \ exists forever\n```\n\nThe caveat of using static is that the compound literal\
    \ can then be initialized only with constants or literals at compile-time as opposed\
    \ to arbitrary values at run-time.\n\n# 6.12 Multidimensional Arrays vs. Pointers\n\
    \nGiven these two declarations:\n\n```\ndouble a2d[3][2]; // array 3 x 2 of double\n\
    double *ap[3]; // array 3 of pointer to double\n```\n\nThe variable a2d is in\
    \ memory as shown in figure 6.1, if it has 6 values comprising a true two-dimensional\
