  md: "# Chapter 12\nInput, Output, and Files\n\n![](img/3351c1095f7fa1e1a549dc9b17ad7247_194_0.png)\n\
    \nAs mentioned in §1.1, C has no built-in input/output (I/O) facilities. Instead,\
    \ they're provided by C's standard library. Returns via the standard FILE type\
    \ and functions that have a FILE* as a parameter.\n\nAs mentioned in the preface,\
    \ POSIX extends the C standard library with additional functions. Such functions\
    \ are tagged with “[POSIX]” in this chapter.\n\n# 12.1 Output\n\nProgram output\
    \ goes to standard output by default. On Unix systems, standard output goes to\
    \ a terminal's display by default. The global variable stdout declared in stdio.h\
    \ is the pre-opened FILE for standard output. Also declared are functions for\
    \ printing output:\n\n```\nint fprintf(FILE *file, char const *fmt, ...)\nPrints\
    \ formatted (§12.1.1) to file. Returns the number of characters printed on success\
    \ or a negative value on failure.\nint putc(char c, FILE *file)\nPrints character\
    \ c to file. Returns c on success or EOF on error.\nint puts(char const *s, FILE\
    \ *file)\nPrints string s to file. Returns a non-negative integer on success or\
    \ EOF on failure.\nint put(char c, FILE *file)\nMacro version of fputc. Returns\
    \ c on success or EOF on error.\n putchar(char c)\nEquivalent to put(c, stdout).\n\
    int puts(char const *s)\nEquivalent to printf(\"%s\\n\", s). Returns a non-negative\
    \ integer on success or EOF on failure.\n```\n\n© Paul J. Lucas 2025\nP. J. Lucas,\
    \ Why Learn C, https://doi.org/10.1007/979-8-8688-1597-3_12"
