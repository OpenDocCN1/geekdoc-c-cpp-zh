  md: '# 17.2 Atomic Functions


    e.g., int.Functions that are not named with _explicit use the memory-order-seq-cst
    memory order ($17.3.1); functions with _explicit use the given memory-order. (Memory
    orders are covered in the next section; volatile is covered in $22. The volatile
    is part of the functions'' signatures only so they will work with volatile variables.
    You can safely ignore it here.)


    ```

    T atomic_load(A const volatile *pv);

    T atomic_load_explicit(A const volatile *pv, memory_order m);

    Atomically loads and returns the value of *pv.

    void atomic_store(A volatile *pv, T new);

    T atomic_store_explicit(A volatile *pv, T new, memory_order m);

    Atomically stores into *pv.

    T atomic_exchange(A volatile *pv, T new);

    T atomic_exchange_explicit(A volatile *pv, T new, memory_order m);

    Atomically stores into *pv and returns its old value.

    T atomic_fetch_add(A volatile *pv, T arg);

    T atomic_fetch_add_explicit(A volatile *pv, T arg, memory_order m);

    Atomically adds arg to *pv and returns its old value.

    T atomic_fetch_sub(A volatile *pv, T arg);

    T atomic_fetch_sub_explicit(A volatile *pv, T arg, memory_order m);

    Atomically subtracts arg from *pv and returns its old value.

    T atomic_fetch_and(A volatile *pv, T arg);

    T atomic_fetch_and_explicit(A volatile *pv, T arg, memory_order m);

    Atomically bitwise-ands arg with *pv and returns its old value.

    T atomic_fetch_or(A volatile *pv, T arg);

    T atomic_fetch_or_explicit(A volatile *pv, T arg, memory_order m);

    Atomically bitwise-ors arg with *pv and returns its old value.

    T atomic_fetch_xor(A volatile *pv, T arg);

    T atomic_fetch_xor_explicit(A volatile *pv, T arg, memory_order m);

    Atomically bitwise-exclusive-ors arg with *pv and returns its old value.

    ```


    Functions that are not named with _explicit are equivalent to their operator counterparts,
    e.g.:


    ```

    atomic_fetch_add(& v, 1 ); // equivalent to: v++

    ```


    except the old value of v is returned instead of the new value.'
