  md: 'Even though this function may have been called via an interface, it received
    a pointer (not interface) into t. If the function calls PrintInt t to print the
    integer portion of the floating-point number, it would call Token''s version of
    PrintInt, not the dynamic dispatch, since only interfaces can do dynamic dispatch.
    Hence, polymorphism in Go is "shallow" in that it "decays" from an interface call
    level down to a pointer and no further.


    In C++, t would point to the token that contains a vptr from which dynamic dispatch
    can be done again. Hence, polymorphism in C++ is "deep" in that it can go any
    number of call levels down from a pointer.


    # 26.4 Epilogue


    As stated at the outset of this chapter, C doesn''t support dynamic dispatch directly,
    but you can implement it in the style of any programming language that supports
    it — you just have to be explicit about it. Here are some key points about dynamic
    dispatch as illustrated in this chapter:


    +   * Regardless of technique, pointers to function are as needed.

    * Use of function tables (structures with pointers to function members) are used
    in many languages.

    * Intrusive virtual function pointers increase an object''s size, but allow deep
    polymorphism. They also often require inheritance.

    * Fat pointers don''t require inheritance, but only allow shallow polymorphism.


    Like many other things in computer science, there are always trade-offs.'
