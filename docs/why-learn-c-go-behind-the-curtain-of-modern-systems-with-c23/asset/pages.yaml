  md: '# 4.3 Storage Classes


    +   1. Adopted auto into C to be a storage class static (§4.3.3).

    2. int the default type (meaning if a type was omitted in a declaration, it was
    intended to be int).


    Hence, the above declaration means the same thing in C as it does in B.

    Since it requires typing one fewer character than typing auto, being explicit
    about it eventually became common. (C99, int stopped being the default). Hence
    there was no reason to specify auto explicitly in new code and its use faded away.

    Eventually, C++11 repurposed auto to mean "automatically deduced" where the type
    of the variable being declared is deduced based on the type of its initializer.
    As of C23, the repurposed auto of C++ adopted into C (more or less, but mostly
    less). In C++, the original of auto was dropped, but kept in C presumably out
    of an abundance of caution for compatibility.


    # 4.3.2 extern


    The extern storage class declares the name of an object that has external linkage
    defined elsewhere in the current scope. It''s used in programs that have more
    than one .c file (§13). From the previous example where is_testing is defined
    in scope in some .c file (§2.4, p.30), a declaration like:


    ```

    extern bool is_testing;

    ```


    in another .c file allows it to be used as well. For any object, there can be
    any number of extern declarations, but only one definition (without extern).

    You may encounter code that declares functions extern like:


    ```

    extern char* mstrcat( char const *s1, char const *s2 );

    ```


    For non-inline functions (§9.10), external linkage is the default, so extern is
    redundant.


    # 4.3.3 static


    The static storage class makes a file-scope (§2.4) object or function (§9.8) have
    internal linkage. For example, a variable declared at file scope in a .c file
    like:


    ```

    static unsigned obj_count;

    ```'
