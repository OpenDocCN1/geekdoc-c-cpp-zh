  md: '236 15 Undefined Behavior


    +   - **Unspecified behavior:** Like implementation defined, except it need not
    be documented.


    +   - **Undefined behavior:** *Anything at all can happen.* The program may execute
    incorrectly (either crash or silently generate incorrect results), or it may fortuitously
    do exactly what the programmer intended.


    An example of unspecified behavior is:


    ```

    new_offset = ftell( f ) + fread( buf, 1, n, f );

    ```


    +   - This is unspecified behavior because, as mentioned in §3.1, the order in
    which the operands of + are evaluated (left, right; or right, then left) is not
    specified by the C standard.


    While implementation defined and unspecified behaviors are bad, at least they’re
    consistent for the same expression (using the same platform, compiler, and compiler
    options). Undefined behavior is *worse* in:


    +   - Different runs of the same executable produce different results


    +   - The same run of an executable can produce different results at different
    times!


    C lists hundreds of things that result in undefined behavior. Examples of the
    common ones, which most have been mentioned in this book, include:


    +   - Signed integer overflow and underflow (§2.11).


    +   - Object is referred to outside of its lifetime.


    +   - Dereferencing a pointer to an object that no longer exists (§6.11.1).


    +   - Reading from an uninitializied object (§18.6.8).


    +   - Addition and subtraction beyond the end of an array of unrelated arrays.


    +   - Indexing beyond the end of an array (§18.6.1).


    +   - Modifying a const object (§34.4.2).


    +   - Data races (§14).


    +   - Anything explicitly listed as one of defined behavior, implementation defined
    behavior, or unspecified behavior is undefined behavior!


    # 15.1 Implications and Example


    What are the implications of undefined behavior? The compiler is allowed to assume
    undefined behavior *never* happens, hence all programs are valid. This allows
    the compiler to generate very efficient code, especially in tight loops. (This
    is the only good thing about undefined behavior.)'
