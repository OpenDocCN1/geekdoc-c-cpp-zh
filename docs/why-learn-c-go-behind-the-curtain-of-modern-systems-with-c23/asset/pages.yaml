    ![](img/3351c1095f7fa1e1a549dc9b17ad7247_108_0.png)


    Fig. 6.2: Pointer to one past array element is OK


    # 6.8 Arrays vs. Pointers


    Even though arrays and pointers work similarly, they are entirely different things.
    Given these two declarations:


    ```

    char const amsg[] = "hello";nchar const *pmsg = "hello";

    ```


    they are in memory as shown in figure 6.3. amsg is an array.


    ![](img/3351c1095f7fa1e1a549dc9b17ad7247_108_1.png)


    Fig. 6.3: Array vs. pointer


    In memory, only the characters comprising "hello" exist. The total memory used
    is 6 bytes. When needed in an expression, the compiler uses the array''s first
    element, but it doesn''t exist as a separate pointer object.


    In contrast, pmsg is a pointer that points to the characters comprising "hello"
    somewhere in memory. Assuming 64-bit pointers, the total memory used is 6 bytes
    for the string plus 8 bytes for the pointer for a total of 14 bytes. Another difference
    is that pmsg can be reassigned to point elsewhere whereas amsg can not.


    # 6.9 Arrays of Pointers


    Of course it''s possible to have arrays of pointers, for example an array of pointers
    to char (strings):'
