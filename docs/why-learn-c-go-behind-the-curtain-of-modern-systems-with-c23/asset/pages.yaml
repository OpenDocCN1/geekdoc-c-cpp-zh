  md: "# 1.8 Dynamic Memory\n\nin a buffer overflow that is a source of many bugs\
    \ (§18.6.2). The C compiler will not warn you when the program is compiled nor\
    \ the C runtime alert when a buffer overflow occurs except perhaps via a core\
    \ dump (§18.4) — if you're lucky.\n\n+   - Line 7 calls the standard function\
    \ fact that prints the string and a newline.\n\nFortunately, there is a better\
    \ way. But first, a digestion on memory kinds.\nin any running program (written\
    \ in any language), there are three broad kinds of memory:\n\n+   - **Global,\
    \ aka, static memory**: holds all of program’s global variables. Its size is determined\
    \ by the compiler and is fixed.\n\n+   - **Stack memory**: holds all of a function’s\
    \ local variables on a “stack” while the function is executing. Its size is determined\
    \ by the compiler based on the number of local variables, the size of the stack\
    \ grows as functions are called and shrinks as they return.\n\n+   - **Heap, aka,\
    \ dynamic memory**: holds for as long as you want for on a “heap” independent\
    \ of allocating memory. Its size is determined by you. However, in addition to\
    \ allocating memory, in C, you **must** free it explicitly.\n\nRather than how\
    \ big to make an array, you can **dynamically allocate** how much you need and\
    \ make a pointer to it. This can be done to concatenate strings with no chance\
    \ of a buffer overflow. In 1.13, we define a function mstrcat (a dynamic memory\
    \ version of strcat) to do exactly that.\n\n```\n#include <stdio.h>\n#include\
    \ <stdlib.h> // for malloc & free\n#include <string.h>\n\nchar* mstrcat(char const\
    \ *s1, char const *s2) {\n    size_t s1_len = strlen(s1);\n    char *s2 = malloc(s1_len\
    \ + strlen(s2) + 1);\n    strcpy(s2, s1);\n    strcat(s2 + s1_len, s2);\n    return\
    \ s2;\n}\n\n main() {\n    char *msg = mstrcat(\"hello\", \" world\");\n    puts(msg);\n\
    \    free(msg);\n}\n```\n\n> Listing 1.13: mstrcat takes two strings (pointers\
    \ to constant arrays of char) and returns a new null-terminated\n\n+   - Line\
    \ 6 calls the standard function strlen (§B.2) that gets the length of s1 and assigns\
    \ it it to s1_len since we'll need it twice."
