  md: '# Array


    # 9.4.3 Variable Length Array Syntax for Parameters


    You can use VLA (§6.14) syntax for parameters:


    ```

    void print_csi(size_t n, int const vals[n]);

    ```


    That is, the size of "array" is given by an integer parameter that precedes it.
    Note that vals is still a pointer. Despite having the size information at run-time,
    sizeof(vals) will still return the size of the pointer. Hence, this "feature"
    serves only to document to programmers that n is the presumed size of the "array."


    # 9.4.4 Multidimensional Array Syntax for Parameters


    Array syntax can also be used for parameters for multidimensional arrays (§6.4):


    ```

    void f(int a[10][20]); // int (*a)[20];

    ```


    The quirk which the compiler rewrites array syntax for a function parameter as
    a pointer happens only for the first (left-most) dimension; the remaining dimension(s)
    keep their "array-ness". Hence, a is a pointer to a real array of 20 ints. Note
    the parentheses in the comment are necessary: without them, it would be an array
    of 20 pointers to int.


    Pointers to array often not occur in C programs since the name of an array "decays"
    into its first element (§6.7). In most cases, that''s good enough even though
    the size information is lost. But a pointer to an array retains the array''s size
    as part of the type, so assignments between pointers to arrays of different size
    are warned about:


    ```

    int (*p3)[3]; // pointer to array 3 of int

    int (*p5)[5]; // pointer to array 5 of int

    p5 = p3; // warning: incompatible pointers

    ```


    In particular, given:


    ```

    int a[10];

    int *pi = a; // pointer to int (via decay)

    int (*pa)[10] = &a; // pointer to int 10 of int

    ```


    both pi and pa to the same location in memory, &a[0]), but a "pointer to array"
    is an entirely different thing from a pointer that results from array decay. For
    pi, the compiler "forgets" the size of the array to which it points; for pa, it
    "remembers" the size.


    The reason pointers to array are used not so much because it''s clunky to access
    array elements since you have to dereference the pointer first:'
