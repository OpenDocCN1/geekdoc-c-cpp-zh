  md: '# 10 Inline Functions


    +   - Arguments with side effects,e.g.,MAXI (n++, 8),can have multiple side effects.

    - There''s no type-checking of the arguments at definition.

    - Errors are often verbose and hard to read.


    Additionally, a macro can modify its arguments (often it is not what you want).
    Inline functions have none of these problems yet can yield the same performance
    benefit. Use inline functions instead of function-like macros whenever possible.


    # 9.10.2 Only a Hint


    As mentioned, specifying inline is only a "hint" to the compiler that the program
    overall might benefit in performance from the function being inlined. The compiler
    is free to ignore the hint. Why? Because there are cases when it''s not a good
    idea or impossible. A function is either inlined or typically not inlined when
    any of the following is:


    +   - The function is "too big.\n- You call the function via a pointer-to-function
    ($6.10).

    - The function is recursive.\n- The function has a loop.


    There may be other reasons. It''s all dependent on the function, its arguments,
    the compiler, and whatever options are given to it.


    If the compiler either can''t or chooses not to inline a function, it does not
    warn you that it hasn''t done so (by default). Some compilers, e.g., gcc, have
    a -Winline option that will warn you and give you the reason why a function wasn''t
    inlined.


    Specifying inline is similar to specifying register ($4.3.4) — they''re both hints.


    # 9.10.3 When (and When Not) to Inline


    For most functions, the bulk of the cost of executing the function is in the function''s
    body, not in the function-call mechanism. Hence, in order for a function to be
    a good candidate for inlining, it generally has to be:


    +   - Small enough so that the cost of the function-call mechanism dominates.\n-
    Used in places where performance actually matters, e.g., in tight loops.'
