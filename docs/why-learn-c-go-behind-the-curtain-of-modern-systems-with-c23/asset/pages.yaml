  md: "# 8.7 Function-Like Macros\n\n```\n#define PASTE_HELPER(A,B)   A ## B\n#define\
    \ PASTE(A,B)         PASTE_HELPER(A,B)\n\nPASTE(var_, LINE__)      // var_1941\n\
    ```\n\nThis fixes the problem because LINE__ will be expanded by PASTE (because\
    \ it's not an argument of ##) and then the result of that expansion (the current\
    \ line number, here, 1941) will be passed to PASTE_HELPER that simply concatenate\
    \ it as-is. The same indirect fix should also be used with STRINGIFY:\n\n```\n\
    #define STRINGIFY_HELPER(X)  #X\n#define STRINGIFY(X)      STRINGIFY_HELPER(X)\n\
    ```\n\n+   Why the preprocessor work this way, i.e., why do we and ## not expand\
    \ arguments as macros? Because if did expand them, then it would be impossible\
    \ to quote or parse arguments as-is. For example, consider a macro that defines\
    \ the C language version where LINE__ starts being supported:\n\n```\n#define\
    \ LANG_LINE__      199409L\n```\n\nand a function lang_is that checks whether\
    \ the current language is equal or later than its argument:\n\n```\nif ( lang_is(\
    \ LANG LINE__ ) )\n    // ...\n```\n\nRather than having to type both lang and\
    \ LANG which is redundant, you define a convenience macro like:\n\n```\n#define\
    \ LANG_IS(X)      lang_is( LANG_ ## X )\n```\n\nand can now instead:\n\n```\n\
    if ( LANG_IS( LINE__ ) )\n    //\n```\n\nIn this case, you want LANG_IS to paste\
    \ LANG_ and LINE__ together to get LANG_LINE__ which is exactly what happens.\
    \ If ## expanded its arguments, you'd instead get something like LANG_1941 which\
    \ is not what you want in this case."
