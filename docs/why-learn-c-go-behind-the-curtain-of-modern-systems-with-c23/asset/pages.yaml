  md: '# 9 Functions


    +   * Parameters: The list of types of objects function requires when called.
    (These are also known as formal parameters.)


    +   * Arguments: Values copied into a function''s parameters when called. (These
    are also known as actual parameters.)


    Hence:


    ```

    void swapi( int *pa, int *pb); // pa, pb: parameters

    swapi(&x, &y);         // &x, &y: arguments

    ```


    As explained in §1.6, in C, all arguments are passed by value, that they are copied
    into their respective parameters. If you want to change the value of the original
    (not copy), the parameter needs to be a pointer.


    In definitions, names for unused parameters may be omitted. Why would you have
    a function with a parameter that you don''t use? In some cases, a function''s
    signature needs to conform to a specific API.


    In older code, you may see declarations and definitions like:


    ```

    pid_t getpid( void );               // means: zero parameters

    ```


    where void is not declaring an unnamed parameter of type void (since void objects
    do not exist), but instead is declaring that the function has zero parameters
    (§C.13).


    # 9.3 No Overloading


    Unlike C++, functions in C cannot be overloaded, that is have more than one function
    with the same name, but different signatures.


    +   * This is why many similar functions in the C standard library have similar
    names, but with additional letters tacked on, e.g., sqrtf and sqrtl in addition
    to sqrt. (But see §19).


    # 9.4 "Array" Parameters


    Array syntax can be used to declare function parameters. For example, a declaration
    for a function that prints an array of n integers as comma-separated values might
    be:


    ```

    void print_csi( size_t n, int const vals[] ) };

    ```


    Since it can be called with an array of any size, vals is declared with [] and
    no size; hence the need for n that gives the size.'
