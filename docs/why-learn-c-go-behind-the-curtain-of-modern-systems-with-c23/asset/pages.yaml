    \ through the fn_tbl pointer. Like many others in computer science, it's a trade-off.\n\
    \nFunction tables are the C++, C#, Java, and Swift implement dynamic dispatch.\
    \ In C++ specifically, a class object would have its fn_tbl named vptr (\"virtual\
    \ pointer\"), and point to an instance of a token vtbl (\"vee table\", short for\
    \ \"virtual function table\") but otherwise would be the same. A C++ member function\
    \ call like:"
