  md: "# 6.14 Variable Arrays\n\nUsually, all arrays have to be declared be of a fixed\
    \ length (known at compile time). A variable array (\"VLA\" for short) can be\
    \ declared to be of a variable length (not known until run-time). For example,\
    \ a function that prints a histogram for an array of integers is shown in listing\
    \ 6.8.\n\n```\nc\\void print_hist( unsigned nvals,\n    unsigned buckets, char\
    \ marker) {\n    unsigned hist[buckets + 1] = {};\n    for (unsigned i = 0; i\
    \ < nvals; i++)\n        if (vals[i] <= buckets)\n            ++hist[vals[i]];\n\
    \    }\n    for (unsigned b = 0; b < buckets; b++) {\n        if (int h = hist[\
    \ b ]);\n            continue;\n        printf(\"%3u:\n```\n\nListing 6.8: Using\
    \ a VLA to print a histogram\n\nThe parameter nvals is the size of the array vals\
    \ containing the values, buckets is the number of \"buckets\" the values should\
    \ hold, and marker is the character to print for the histogram. For example, to\
    \ print a histogram of 25 student grades in the range 0-100 using '+'.\n\n```\n\
    print_hist( 25, grades, 100, '+'); );\n```\n\nLine 33 declares hist as a VLA by\
    \ using buckets + 1 (a value not known until run-time) for its size rather than\
    \ a constant expression.\n\nWhile VLAs work and seem convenient, one serious caveat\
    \ of VLAs is that, if the length is too long, it will silently overflow the stack\
    \ resulting in undefined behavior (§15). Additionally, unlike malloc returning\
    \ nullptr upon failure, there's no way to detect when a VLA overflows the stack,\
    \ if the size can be \"too big.\" your code has to guard against:\n\n```\nconst\
    \ unsigned HIST_BUCKETS_MAX = 1024;\n// ...\nif ( buckets > HIST_BUCKETS_MAX )\n\
    \    // ... do something else ...\n```\n\nIf you know that HIST_BUCKETS_MAX is\
    \ the maximum safe size, you might as well declare hist to be of that size and\
    \ not use a VLA.\nIncidentally, you could do size optimization as shown in listing\
    \ 6.9."
