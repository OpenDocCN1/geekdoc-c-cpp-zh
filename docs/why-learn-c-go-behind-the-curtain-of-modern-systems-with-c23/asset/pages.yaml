    %[width][size]specifier

    ```


    Each specification results in fetching zero or one subsequent pointer arguments
    to store the converted values. The type of each pointer argument must correspond
    with the type given by its associated conversion specifier. (Some compilers will
    warn you the two disagree.)


    The components comprising a conversion specification are:


    +   - **width**: A digit specifying the maximum field width.


    +   - **size**: The size of the argument (the same, similar to §2.5.1) and precedes
    a specifier. The following size modifiers are valid for specifiers shown and expect
    an argument of the given type:


    | bDinouxX | aAeEfFgG | cs |

    |---|---||

    | * | short* | |

    | h | char* | |

    | hh | | _Decimal32* | |

    | D | | _Decimal164* | |

    | DD | | _Decimal128* | |

    | j | intmax_t* | | |

    | l | long* | double* | wchar_t* |

    | 11 | long long | | |

    | L | | long double* | |

    | t | ptrdiff_t* | | |

    | wN | intN_t* | | |

    | z | size_t* | | |


    The * causes the conversion to happen just the same, but the converted value is
