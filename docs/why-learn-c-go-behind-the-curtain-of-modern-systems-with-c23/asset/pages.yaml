  md: '# # Chapter 6

    Arrays and Pointers


    As first shown in listing 1.3 (p.7), an array is a contiguous set of objects in
    memory of the same type, e.g., array of char or array of int. As first described
    in §1.6, a pointer is an object that contains the memory address of some other
    object. Not described previously is the curious relationship between arrays and
    pointers in C that is unlike most other languages.


    # ## 6.1 Array Declaration


    An array is declared by appending $[n]$ where $n$ is a constant positive integer
    expression whose value is the size (number of elements) of the array. As first
    shown in listing 1.3 (p.7):


    ```

    char buf[BUF_SIZE];

    ```


    declares an array BUF_SIZE of char. In C, array elements are always 0 through
    $n-1$.


    # ## 6.2 Array Initialization


    As first shown in listing 1.4 (p.10), an array can be initialized to all zeros
    or equivalent via the $ = \{ };


    ```

    char str_buf[STRING_MIN] = { };

    ```


    Arrays can also be initialized with values. The following declarations are equivalent:


    ```

    char msg1[6] = { ''h'', ''e'', ''l'', ''l'', ''o'', ''\0'' };

    char msg2[6] = { ''h'', ''e'', ''l'', ''l'', ''o'', ''\0'' };

    char msg3[6] = "hello";

    ```'
  merge: -1
