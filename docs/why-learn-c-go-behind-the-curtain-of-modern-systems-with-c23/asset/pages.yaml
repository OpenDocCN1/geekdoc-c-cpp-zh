  md: "# 17.3.3 memory_order_acquire and memory_order_release\n\nAcquire and release\
    \ memory orders are safer than relaxed and are typically used in pairs:\n\n+ \
    \  - Release (used with _store) is used to “publish” information: no memory accesses\
    \ are reordered after.\n- Acquire (used with _load) is used to “subscribe” to\
    \ information: no memory accesses are reordered before.\n\nFor example, given\
    \ the islist declarations:\n\n```\nstruct islist *work_list; // listing 10.9,\
    \ p. 163\nbool _Atomic work_avail;\n```\n\na producer thread can prepare work\
    \ by doing, say:\n\n```\nwork_list = islist_push(work_list, sizeof(char*));\n\
    *(char**)islist_peek(work_list) = path;\natomic_store_explicit(&work_avail, true,\
    \ memory_order_release);\n```\n\nThe shared data (work_list) neither needs to\
    \ be _Atomic nor by a mutex. This is particularly useful for data that can be\
    \ made _Atomic and for functions that retired to use a mutex. You can also preserve\
    \ any amount of data, then “publish” all of it simultaneously. What the “no memory\
    \ accesses” means is that no memory accesses done before the release in your code\
    \ can be reordered after it by the hardware, i.e., you won’t signal that data\
    \ is ready before it actually is.\n\nMeanwhile, a consumer thread can wait for\
    \ and receive work by doing:\n\n```\nwhile ( atomic_load_explicit(&work_avail,\
    \ memory_order_acquire) );\n    // wait\nchar *const path = *(char**)islist_peek(work_list);\n\
    ```\n\nis, the consumer thread repeatedly checks work_avail until it becomes true.\
    \ What the “no memory accesses can be reordered before” means that no memory accesses\
    \ done after the acquire in your code can be reordered before by the hardware\
    \ i.e., you won’t access data before it’s ready.\n\nYes, what the consumer is\
    \ doing another instance of a spin lock first mentioned in §14.5. Spin locks are\
    \ useful when the lock is continuous and the waits are — shorter than the time\
    \ it would take to lock and unlock a mutex."
