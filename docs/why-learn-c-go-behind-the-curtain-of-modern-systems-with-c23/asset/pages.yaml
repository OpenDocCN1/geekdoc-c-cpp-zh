  md: "# 300 20 setjmp and longjmp\n\n```\n#include <setjmp.h>\n#include <stdio.h>\n\
    #include <stdlib.h>               // for exit()\nstatic jmp_buf env;\nvoid read_file(char\
    \ const *path ) {\n  FILE *f = fopen(path, \"r\");\n  if (f == nullptr) {\n  \
    \  longjmp(env, 1);               // // \"throw\"\n  }\n}\nvoid load_config()\
    \ {\n  //...\n  read_file(\".config\");\n  //...\n}\nint main() {\n  if (setjmp(env)\
    \ == 0) { // \"try\"\n    load_config();\n  } else {\n    // // \"catch\"\n  \
    \  fprintf(stderr, \"error loading configuration\\n\");\n    exit(EXIT_FAILURE);\n\
    \  }\n}\n```\n\nListing 20.1: setjmp and longjmp example\n\n# 20.2 setjmp Restrictions\n\
    \nCalls to setjmp must be done only in one of the following ways:\n\n(void)opt\
    \ setjmp(env)\ncontrol-flow-keyword 1opt setjmp(env) relop-expropr)\n\n+   1.\
    \ A plain call to setjmp (optionally cast to void) or;\n2. For control-flow-keyword,\
    \ one of, if, switch, or while followed by:\n\n+   a. An optional 1; followed\
    \ by:\nb. The call to setjmp constant followed by:\nc. An optional relational\
    \ operator and an integer constant expression.\n\nAdditionally, the call to setjmp\
    \ must constitute the entire controlling expression of the for, if, switch, or\
    \ while which means you can't use && or ||.\n\nAdditionally, you may not save\
    \ the return value from setjmp:\n\n```\nint sj = setjmp(env ); // not not allowed\n\
    ```\n\nCalling setjmp in any other way results in undefined behavior(§15)."
