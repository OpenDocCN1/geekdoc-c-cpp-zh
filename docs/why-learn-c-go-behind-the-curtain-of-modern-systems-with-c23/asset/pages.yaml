  md: "# # Chapter 16\nAssertions\n\n![](img/3351c1095f7fa1e1a549dc9b17ad7247_256_0.png)\n\
    \nThe assert macro, part of the C standard library defined in assert.h, has been\
    \ around since the early days of C as a mechanism to aid in writing less buggy\
    \ code. It allows you to “assert” that some condition *must* be true in order\
    \ to continue. If not, the program will print an error message (including the\
    \ assertion that was violated and the source file and line of the assert), calls\
    \ the standard function abort that terminates the program, and typically provides\
    \ a core dump (§18.4) as a debugging aid. Conditions include preconditions, postconditions,\
    \ and invariants for implementing design by contract.\n\n# ## 16.1 Sample Implementation\n\
    \nTo demassert, a basic implementation is shown in listing 16.1.\n\n```\n #ifndef\
    \ NDEBUG\n # define assert(EXPR) ? ( \\\n    (EXPR) (void)0 : ( \\\n    printf(\"\
    %s:%d failed assertion '%s\\n\", \\\n        __FILE__, __LINE__, EXPR) \\\n  \
    \  ), abort(0);\n #else\n # define assert(EXPR) ((void)0)\n #endif /* NDEBUG *\
    \ */\n```\n\n**Listing 16.1:** Sample assert implementation\n\n+   * The first\
    \ thing to notice on line 1 is that assert is defined only if the macro NDEBUG\
    \ is not defined. The consequence is if you include assert.h and nothing else,\
    \ assertions will be enabled, that they will actually assert what you are asserting."
