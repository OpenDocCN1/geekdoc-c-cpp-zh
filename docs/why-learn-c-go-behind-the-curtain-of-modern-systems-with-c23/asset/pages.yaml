    18 Debugging


    ```

    char *s = "hello, world";

    *s = ''H''; // undefined behavior

    ```


    The-Writestrings command-line option changes the type of string literals to char
    const* so assigning a string literal to a variable of type char* will generate
    a warning.


    Generally, there are no other consequences, but it affects the type deduced for
    the controlling expression of _Generic (§19.1) for string literals. This is one
    reason why the definition of the IS_C_STR_EXPR macro (p.292) has both char* and
    char const.


    -Zero-as-null-pointer-constant

    Warn if used as the null pointer instead of nullptr (§C.15).


    # 18.7.2 Disabling Warnings


    Even though enabling warnings is a good idea, occasionally you might need to disable
    a particular warning for a block of code because you want to do something despite
    the warning. For example, as mentioned for the -format-nonliteral warning, the
    format for printf and its variants should always be a string literal. One exception
    is wrapping the function with another variadic function (9.12). In such a case,
    you want to parse the format argument as if verbatim.


    Using pragmas (§8.16), you can disable a warning for a block of code, then re-enable
    it afterwards. However, you want to re-enable it only if it was enabled in the
    first place. Both clang and gcc maintain a set of enabled warnings. Using additional
    pragmas, you can "push" the current set onto an internal stack, disable a warning
    for a block of code, pop the stack to restore the previous set of enabled warnings
    shown in listing 18.5.


