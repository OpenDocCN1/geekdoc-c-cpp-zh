  md: "# 5.3 if-else\n\nThe basic version of the if statement is:\n\n```\nif ( expr\
    \ )\n    statement\n```\n\nIt executes statement only if expr is true. Reminder:\
    \ in C, any non-zero value is considered true (§2.5.2).\n\n+   - Idiomatic C tends\
    \ to rely on this. For example, if count is an int you'll often see code like:\n\
    \n```\nif ( count )           // means: if ( count != 0 )\n    // ...\n```\n\n\
    Personally, I find that unclear since it looks like count could be bool. (Did\
    \ we count anything? Was a count performed? Hence, you have to find the declaration\
    \ for count to see if it's really bool. Being explicit with it!= 0 here makes\
    \ it clearer that count is much more likely a numeric type.\n\nIf statement needs\
    \ to be multiple statements, they're enclosed between {}. The full version of\
    \ the if statement adds an optional else clause:\n\n```\nif ( expr )\n    if-true-statement\n\
    else\n    if-false-statement\n```\n\nNote that an else associates with the most\
    \ recent if. For example, in:\n\n```\nif ( expr1 )\n    if ( expr2 )\n       \
    \ // ...\nelse\n    // ... // indentation belies reality\n```\n\n```\nif ( expr1\
    \ ) {\n    if ( expr2 )\n        // ...\n}\nelse\n    { } make indentation match\
    \ reality\n    // ...\n```\n\nIf either the if or else uses {}, it's widely considered\
    \ good style to make both use {}, i.e., omit { } only when there is an if having\
    \ a single statement and no else, or both the if and else have single statements."
