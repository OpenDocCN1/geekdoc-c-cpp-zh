    \ operator (§§3.2) by $m$, the\nsize of the array, to get the actual index $i$\
    \ into $B$, here are the steps:\n\n> †The FNV Non-Cryptographic Hash Algorithm,\
    \ Glenn Fowler, London Niall, and Kiem-Phong\nVo, Comments to IEEE POSIX P103.2\
    \ Committee, Sep. 1991.\n‡The FNV Non-Cryptographic Hash Algorithm, Glenn Fowler,\
    \ London Niall, Kiem-Phong Vo,\nand Donald Eastlake, Engineering Task Force, Oct.\
    \ 10, 2024.\nhttps://datatacker.ietf.org/doc/html/draft-eastlake-fnv-29"
