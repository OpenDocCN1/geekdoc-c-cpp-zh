  md: '# Chapter 19

    _Generic


    C has the _Generic keyword that enables compile-time selection of an expression
    based on the type of its argument. The motivation is the ability for library authors
    to provide a veneer of C++ function overloading in C.


    +   - Personally, I think _Generic is too, generic of a name. It should have been
    called something like _Typeswitch.


    # 19.1 Motivating Example


    The motivating example is the ability of the standard C library, e.g., math.h,
    to provide specialized functions for different floating point types ($2.5.6) yet
    only a single function in the API. For example, math.h provides these three functions:


    ```

    double      sqrt( double );      // square root of double

    float         sqrtf( float );     // ... of float

    long double sqrtl( long double ); // ... of long double

    ```


    While you can certainly use those functions as they are, it would be nice if you
    could always simple sqrt and the compiler select the right function automatically
    based on the type of its argument:


    ```

    double d;

    float f;

    long double l1;

    ```


    ```

    double      rv_d = sqrt( d );     // calls sqrt()

    float         rv_f = sqrtf( f );     // calls sqrtf()

    long double rv_l = sqrtl( l );   // calls sqrtl()

    ```


    To make this work in C++, simply overload the functions; to make this work in
    C, the math library defines a macro using _Generic as shown in listing 19.1.'
