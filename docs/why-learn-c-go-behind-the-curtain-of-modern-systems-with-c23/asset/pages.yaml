    \ defined. In many cases, you don't care; but if you do, you can specify a fixed\
    \ type explicitly by following the name of the enumeration by a : and the underlying\
    \ type such as:\n\n```\nenum color : unsigned char {\n// ...\n```\n\nThis is useful\
