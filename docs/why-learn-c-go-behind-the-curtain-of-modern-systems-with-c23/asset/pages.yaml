  md: '# struct tm* localtime_r(time_t const *t, struct tm *tm)


    Converts *t to a tm structure representing its local time. Returns tm. (See also
    gtime, gtime_r, localtime.)


    # time_t mktime(struct tm *tm)


    Returns the time since epoch (§2.9) of *tm representing local time on success
    or -1 on failure.


    # size_t strftime(char *restrict buf, size_t buf_size, char const *restrict format,
    struct tm const *restrict tm)


    Similar to printf (§12.1.1), uses a format string that is composed of zero or
    more directives where a directive is:


    +   * A sequence of ordinary characters (not containing %) that are copied betatim
    to the output.

    * A sequence of characters containing one or more conversion specifications starting
    with % of the form %specifier where the specifiers are shown in table B.1.


    Returns the number of characters written to buf (not including the terminating
    null character) or zero if buf_size is too small to accommodate the string.


    # time_t time(time_t *t)


    Returns the current time since epoch (§2.9). If t is not nullptr, then also stores
    the time in *t.


    # int timespec_get(struct timespec *ts, int base)


    Puts the current time relative to base into *ts. Returns base on success or zero
    on failure. The members of the timespec structure are shown in listing B.2. The
    only value for base''s defined is TIME_UTC.'
