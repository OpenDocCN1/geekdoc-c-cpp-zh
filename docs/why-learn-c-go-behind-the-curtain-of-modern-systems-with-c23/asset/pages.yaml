  md: '# Chapter 5 Statements


    C code is fundamentally a series of statements where each generally performs some
    action. Many statements control the “flow” of execution of a program by conditionally
    executing some statements and not others, looping, or unconditionally jumping
    to other statements. While we’ve seen most statement types already, this chapter
    will give the details of the complete set.


    # 5.1 Expression Statement


    An expression statement is any expression followed by a semicolon. As mentioned
    in §3.9, y = 0 is an expression that assigns 0 to y, but is still an expression
    having the value of zero that can be used anywhere an expression can be. Appending
    a semicolon makes it a statement.


    # 5.2 Compound Statement


    A compound statement (aka, block) is of the form:


    ```

    { statement* }

    ```


    that is, zero or more statements enclosed between { }. It can be used anywhere
    a single statement can be and can nest.'
