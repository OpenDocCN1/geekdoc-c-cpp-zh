    # 14.4.3 Recursive Mutexes


    By default, mutexes initialized with either mtx_plain or mtx_timed are not recursive
    — meaning if a thread locks it''s already locked, the thread will deadlock. A
    recursive mutex is one that allows it to be locked more than once by the same
    thread. To create a recursive mutex, bitwise-or mtx_recursive into the second
    argument of mtx_init:


    ```

    mtx_init (&m, mtx_plain | mtx_recursive);

    ```


    While recursive mutexes may sound like a good idea even to the point where you''re
    wondering why mutexes aren''t recursive by default, it''s:


    > The biggest of all the problems with recursive mutexes is that they encourage
    you to completely lose track of your locking scheme and scope. This is deadly.
    Evil. It''s the "thread eater." You hold locks for the absolutely shortest possible
    time. Period. Always. If you''re calling something with a lock held simply because
    you don''t know it''s held, or because you don''t know whether the callee needs
    the mutex, then you''re holding it too long. You''re aiming a shotgun at your
    application and pulling the trigger. You presumably started using threads to get
    concurrency; but you''ve prevented concurrency."


