- img_proc: true
  md: '```

    #define sqrt(N) \

    _Generic ( N), \

    float : sqrtf, \

    long double : sqrtl, \

    default : sqrt \

    )( (N) )

    ```


    The \_Generic keyword is part of the C language proper, not part of the preprocessor
    ($8). However, the only way you can practically use _Generic is via a function-like
    macro ($8.7). For the above example, the ( N ) at the end is calling whichever
    function _Generic selected and passing N as its argument.


    +   - It takes a controlling expression followed by an association list of one
    or more type/expression pairs.

    - If the (not the value) of the controlling expression matches a particular type
    (before the :) in the association list, then the result of _Generic expression
    is for that type (after the :).

    - There can be at most one occurrence of any particular type. (Remember that a
    typedef ($2.6) is an alias, not a distinct type.)

    - Optionally, one "type" may instead be default that will match only if no other
    type does.

    - Expressions are not evaluated; only their type is considered. Hence, _Generic
    is strictly compile-time and has zero-run overhead.


    Additionally, when comparing types:


    +   - Top-level _atomic ($17), const ($4.5), restrict ($21), and volatile ($22)
    qualifiers will match int.

    - Array-to-pointer ($6.7) and function-to-pointer conversions happen as usual.
    For example, an array s[8] decays to char* and a function like free becomes (*)(void*)(pointer
    to function void*).

    - However, no other conversions occur, including the arithmetic conversions. For
    example, short is not promoted to int.


    _Generic saves its motivating example (though in a clunky manner), but it turns
    out that it''s quite powerful and is capable of solving many other problems.


    # 19.2 A printf Example


    When using printf, it''s sometimes difficult to remember the correct format specifier
    for particular types. Using _Generic, we can write macros as shown in listing
    19.2. With those, we can now write this:'
