    \ Fat Pointers\n\nAs an alternative to intrusive vptrs, languages like Go and\
    \ Rust use “fat pointers” as shown in 26.5 where is a fat pointer.\n\n+   - In\
    \ Go, fat pointers are used to implement “interfaces,” hence the “i” in token.\
    \ In Rust, fat pointers are used to implement “traits” that are essentially the\
    \ same. In this section, the Go terminology is used.\n\nA fat pointer is simply\
    \ a structure that contains two pointers:\n\n+   1. A pointer to the object's\
    \ function table, i.e., a vptr, that's the same as it was before except that it\
    \ moved from the object to the fat pointer.\n2. A pointer to the object."
