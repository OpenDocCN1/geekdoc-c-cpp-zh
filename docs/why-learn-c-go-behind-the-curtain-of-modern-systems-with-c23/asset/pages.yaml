    }\n```\n\n**Listing 23.4:** string_take\n\n#  23.2 strbuf: A String Buffer Type\n\
    \nThe string structure and associated functions presented in §23.1 are reasonable\
    \ for production-quality use when managing the storage and ocasion-appending strings.\n\
    \nAnother common use of strings is to append repeatedly while reading from a file\
    \ or socket. For such a case, calling realloc for every append is inefficient.\
    \ Its better to give strings additional capacity to grow into a “buffer”. Many\
    \ languages provide such functionality. For example, C++ has std::ost, Go has\
    \ strings.Builder, Java has StringBuilder, and Python has io.String.\n\nTo implement\
    \ a string buffer in C, a capacity needs to be stored in addition to a length\
    \ as shown in 23.5.\n\n```\nstruct strbuf {\n    char *contents; // pointer to\
    \ actual contents\n    size_t len; // length (not including null at end)\n   \
    \ size_t cap; // capacity\n}\n```\n\n**Listing 23.5:** strbuf, version 1\n\nWhile\
    \ it is easy to add cap, it's not the most efficient in terms of storage. Assuming\
    \ 8-byte pointers and size_t, sizeof(strbuf) would likely be 32 bytes, not 24,\
    \ due to padding (§10.5).\n\nOne possible fix for is to use uint32_t rather than\
    \ size_t so both len and cap fit into 8 bytes making sizeof(strbuf) 16 bytes.\
    \ It is very unlikely that you'll be dealing with strings in excess of 4,294,967,294\
    \ (2³²–1) characters. The updated strbuf declaration is shown in 23.6.\n\n```\n\
    struct strbuf {\n    char *contents; // pointer to actual contents\n    uint32_t\
    \ len; // length (not including null at end)\n    uint32_t cap; // capacity\n\
    };\n```\n\n**Listing 23.6:** strbuf, version 2, using uint32_t"
