    # 17.6 The "ABA Problem"


    Suppose thread 1 performs the following steps:


    +   1. Read a memory location: the value is “A”.

    2. Do some work.

    3. Read the same memory location again: the value is still “A”.

    4. Compare the original and recent values: they’re equal.

    5. Conclusion: nothing has changed.


    The problem is suppose thread 2 performs the following steps while thread 1 is
    doing its step 2:


    +   1. Write “B” to the same memory location.

    2. Do some work.

    3. Write “A” to the same memory location.


    By the time thread 1 does its step 3, it reads “A” and believes nothing has changed
    — even though it has. You might ask:


    > If the value of “A” is the same, why does it matter?


    The answer is: sometimes it doesn’t — but sometimes it does. This is known as
    the ABA Problem.


