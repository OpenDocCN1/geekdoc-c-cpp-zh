  md: "# 1.2 Copying Input to Output\n\nOn the one hand, not having to memorize and\
    \ obey a rigid set of formatting rules is nice; the other, insufferable debates\
    \ raged for decades about which is the “one true style.” This book uses my style.\
    \ \n\nC has no built-in input (I/O) facilities (§12). Instead, they’re provided\
    \ by C’s standard library. The statement:\n\n```\nprintf(\"hello, world\\n\");\n\
    ```\n\ncalls a function named printf (for \"printf formatted,\" §12.1.1) from\
    \ the standard library passing “hello, world\\n” as an argument.\n\nA sequence\
    \ of characters with double quotes is known as one of character string, string\
    \ literal, or simply string. The sequence \\n is C’s notation for representing\
    \ the newline character, when printed, presents subsequent output on the left\
    \ edge of the line.\n\nThe:\n\n```\n#include <stdio.h>\n```\n\nsays to include\
    \ the text (§8.6) of the file stdio.h (part of the C standard library) that declares\
    \ functions for performing I/O such as printf. There are two types of C program\
    \ source files:\n\n+   - .c files contain definitions of functions (and other\
    \ things)\n- .h files (known as header files or simply headers) contain declarations\
    \ of functions (and other things) providing the API for the corresponding .c file.\
    \ The C standard library has a few dozen headers (§A), but you can also create\
    \ your own.\n\nYou might be wondering:\n\nIf main returns an int, where is it?\n\
    \nNormally, every function declared as returning int (or any type) must return\
    \ a value. But main is special (§9.7.2) in that if no return value is given, it’s\
    \ equivalent to returning zero (success).\n\n# 1.2 Copying Input to Output\n\n\
    The next program in listing 1.1 will simply copy its input to its output verbatim\
    \ by reading them, one character at a time. This program shows a number of new\
    \ things about C:\n\n+   - Comments (§2.1) can be specified either /* and */ that\
