  md: "# Chapter 22\nvolatile\n\nC has the volatile keyword that's a qualifier (§4.5)\
    \ just like _Atomic (§17), const\n($4.5), and restrict (§21). As with const, volatile\
    \ can be written to the right\nor \"east\" of the base type (§1.7):\n\n```\nvolatile\
    \ int x;          // \"west\" volatile\nvolatile int y;          // \"east\" volatile\n\
    ```\n\nIn some code, there are uses of the volatile keyword that are simply wrong.\n\
    \ unfortunate situation is perpetuated by many articles on the Internet whose\
    \ ex-\nplanations of volatile are also simply wrong. So here, hopefully once and\
    \ for all,\nis what volatile in C actually (and) only does.\n\n+   - Everything\
    \ described in this chapter applies equally to C++ that also has\nthe volatile\
    \ keyword.\n\nThere are only three legitimate uses of volatile in C:\n\n+   1.\
    \ To tell the compiler that objects qualified with it either be modified or caused\n\
    side effects in ways unknown to the compiler; therefore, not to optimize away\n\
    accesses to such objects reorder their accesses with respect to other opera-\n\
    tions have visible effects.\n2. For use in a signal handler.\n3. For use with\
    \ setjmp($20).\n\nThat's it. Any other use of volatile is innocuous, inefficient,\
    \ or simply wrong.\n\n# 22.1 Optimization Suppression\n\nThe C23 standard §6.7.3\
    \ says the following about the first use of volatile:\n\nAn object that has a\
    \ volatile-qualified type may be modified in ways un-\nknown to the implementation\
    \ or have other unknown side effects."
