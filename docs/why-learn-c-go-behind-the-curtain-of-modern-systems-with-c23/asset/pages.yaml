    18 Debugging


    If stdbuf isn''t available on your system, you can add the following line of code
    in your main function before you print anything that makes standard output unbuffered:


    ```

    setvbuf( stdout, NULLptr, _IONBF, 0 );

    ```


    # 18.2 Debug Information


    Debug information consists of the names of functions and variables, and a mapping
    from assembly language instructions back to their corresponding C source files
    and line. While names are meaningful and line number mappings are useful to programmers,
    they are unnecessary for compiled programs. All that''s needed is addresses of
    functions to call or variables to access. Consequently, when a C compiler generates
    an executable, it doesn''t contain any debug information by default.


    To use a debugger, having debug information is extremely helpful. Both clang and
    gcc accept the -g command-line option to generate debug information in the executable.
    For Microsoft C, the option is /DEBUG. The caveat is that your program will be
    bigger on disk and in memory (but usually not programmatically so).


    # 18.3 Optimization


    A compiler typically does not perform a simple translation from C statements to
    sets of assembly language instructions. It also performs many kinds of optimization
    resulting in assembly code that can be very different from what you might expect
    a direct translation from C statements to be, or in a different order, or eliminated
    completely (“optimized out”). This can confound using a debugger to step through
    the execution of a program because the assembly instructions don''t cleanly map
    back to C statements.


    Both clang and gcc accept the -O0 (“oh zero”) command-line option to set the optimization
    level to zero, i.e., no optimization. For Microsoft C, the option is /Od (“oh
    dee”). Therefore before debugging, it’s much better if you recompile your program
    with optimization disabled. The caveat is that your program will typically run
    slower.


    # 18.4 Core Dumps


    A core dump is a file containing a snapshot of memory of a program when execution
    caused a serious error. A core dump useful contains the entire stack frames of
    your program including both local variables and heap memory. Core dump files can
    be'
