  md: '# 25.1 Hash Tables


    $k \rightarrow h(k) \rightarrow \& m \rightarrow i \rightarrow B[i] \rightarrow
    (k, v)$


    Choosing any value for $m$ increases collisions. When a collision occurs, you
    have to compare $k$ against every other key that also hashed to $B[i]$. Hence,
    it''s a trade-off between using a larger $m$ (more memory, fewer collisions) vs
    a smaller $m$ (less memory, more collisions). If you know $n$, the expected number
    of entries, say 2000, and you can live with that, say at most 3 comparisons per
    key due to collisions, then $m=[2000/3] = 667$. However, it''s better for $m$
    to be both a prime number and as far from a power of 2 as possible; hence a better
    $m$ for 2000 entries would be 769.


    +   - Similarly, explaining why this is the case if $m$ is not prime and the set
    of keys are not uniformly distributed, $h(k) \& m$ produces more collisions at
    $i$ where it''s a factor of $m$. If $m = 2^k$, then the lower $k$ bits of $h(k)$
    are discarded.


    When inserting a key and a collision occurs ($B[i]$ is not empty), what do you
    do? There are generally two approaches:


    +   1. **Opening**: There are a few kinds including linear probing where you can
    scan forward at $B[i]+1, B[i]+2, ...$, in general, $B[j]$ for $j$ in $[i+1..m-1]$
    looking for an entry $B[j]$. When you find one, put the key and value there. The
    advantages of linear probing include:


    +   - Good cache performance since the entries are directly in the array and there
    in the same cache line (§$10.6$)


    The disadvantages of linear probing include:


    +   - The hash table can become full by filling every element of $B$.

    - Deleting entries involves either marking them with a special "deleted" value
    (but this decreases performance as more entries are deleted) or moving entries
    to replace deleted ones.


    +   2. **Chaining**: Every $B[i]$ is a linked list of all the keys that have collided
    and their values. The advantages of chaining:


    +   - The hash table can never become full since new entries can always be inserted
    into the linked lists (but see the first disadvantage).

    - Deleting entries involves only updating a few pointers.


    The disadvantages of chaining: Even though the hash table can become full (in
    the sense that it''s impossible to add more entries), its performance degrades
    from $O(1)$ to $O(n)$ as the length of the linked lists increases. However, you
    can "grow",


    +   - Growing a hash table is time-consuming. In time-sensitive applications,
    you may not be able to afford it. (OK for compilers; for user interfaces.)'
