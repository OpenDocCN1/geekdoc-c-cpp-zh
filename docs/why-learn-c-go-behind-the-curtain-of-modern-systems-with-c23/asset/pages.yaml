    [POSIX] Opens buf of size as a FILE. The buf pointer can point to an

    existing buffer of size or nullptr in which case a buffer of size bytes

    will be automatically allocated initially and deallocated when the file is

    closed. Returns a non-null FILE* on success or nullptr on error. The mode

    is from table 12.2 (p.186).

    ```


    Even though mode can be for writing, the capacity of buf is fixed at size.

    Consequently, fmemopen is useful only for reading. This is useful if you need

    to use an API that uses FILE*, but want to use memory indent, perhaps

    a string read from either the terminal or socket.


    ```

    FILE* open_memstream(char **buf, size_t *psize)

    [POSIX] Opens *buf for writing only. The buffer is all allocated and

    grows atomically. A null character is maintained at the end of the buffer.

    This byte is not included in the value written to *psize. A non-null

    FILE* on success or nullptr on error. After closing the file, the buffer must

