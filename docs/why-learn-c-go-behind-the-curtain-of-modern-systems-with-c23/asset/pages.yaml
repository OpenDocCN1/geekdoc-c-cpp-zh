  md: '# 13.3 Self Sufficient Headers


    # 13.3.2 Include Everything Necessary


    Within a header file:


    +   - You must include every other header it needs to be self-sufficient.


    Never force users of your header to include some other header(s) before yours
    in order to compile without errors.


    > BSD-derived operating systems have historically tended to violate this guideline.
    The rationale for doing so is that it''s an alternate way to help maximize compilation
    speed. It does this by forcing you to be a “human include guard."


    ```

    #include <sys/types.h>

    #include <pwd.h>      // needs <sys/types.h>

    #include <unistd.h>    // needs <sys/types.h> too

    ```


    Rather than pwd.h and unistd.h each including sys/types.h, both rely on you to
    include yourself.


    How does it help? It eliminates the step where the preprocessor has to open types,
    read the file, encounter the include guard, and omit the rest of the contents
    if the guard has been seen before (as would be the case for unistd.h).


    While it does, the price is that it forces users to remember to include files
    manually which can lead to unnecessary includes that slow down compilation. For
    example, if at some point you removed the includes for pwd.h and unistd.h, that
    might result in types.h no longer being needed, but you might forget to remove
    it.


    Like many other things in computer science, it’s a trade-off. BSD-derived systems
    have been moving away from this practice and making headers self-sufficient.


