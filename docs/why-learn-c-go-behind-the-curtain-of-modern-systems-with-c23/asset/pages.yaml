  md: '# Multithreading


    While CPU performance was increasing rapidly, memory performance lagged.

    By early as the late 1980s, processor performance was already an order

    of magnitude faster than memory. In order not to have overall performance

    constrained by memory, CPU designers had to employ mitigation tactics of:


    +   - Memory caching.

    - Instruction parallelism.

    - Speculative execution.

    - Multiple CPUs/cores.


    All of these tactics are done entirely by the hardware. You as the program-

    er have no way to know or really influence what''s going behind

    the curtain. Additionally, compiler implementers also employ their own mit-

    igation tactics of:


    +   - Constant folding.

    - Copy elision.

    - Statement hoisting.

    - Instruction scheduling.

    - Loop unfolding.

    - ... and many more.


    The compiler is free to do any optimization so long as it makes change

    to the observable behavior of your program.

    As long as your program has only a single thread, you can remain bliss-

    aware of the hardware or compiler threads being employed.

    But once you have multiple threads, you must become acutely aware of

    what''s going on behind the curtain.


    Because different threads are typically running different functions, each may
    take

    a different amount of time and to reach the "finish line" in an order that''s
    different

    an expected or in different runs of the same program. This is known as a

    race condition that results in undefined behavior (§15).


    Unlike processes, all threads share the same memory space. While efficient, one

    serious pitfall is that data race, a kind of race condition, can occur when multiple

