    +   - Line 18 sets the original head to be head->next effectively popping the\
    \ head off the list.\n\n+   - Line 19 copies a pointer to the old head's data.\n\
    \n+   - Line 20 frees the old head slist structure.\n\n+   - Line 21 returns the\
    \ old head's data."
