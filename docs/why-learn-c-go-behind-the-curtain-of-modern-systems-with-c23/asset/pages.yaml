    +   - A sequence of ordinary characters (not containing %) that are read and matched
    verbatim (e.g., spaces, tabs, and newlines) will match any amount of whitespace,
    including none, from the input.


    +   - A sequence of characters containing one or more conversion specifications
    starting with % of the form:


