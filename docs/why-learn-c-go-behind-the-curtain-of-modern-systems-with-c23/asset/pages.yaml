  md: "# 18.6 Common Bugs\n\n# 18.6.3 Double Free\n\nA free bug is when you free memory\
    \ via a pointer, then attempt to free the same memory again. This typically happens\
    \ because either:\n\n+   1. You call free on the same pointer more than once,\
    \ e.g., an error occurred, so your error-path code freed an object, but then your\
    \ normal-path code also freed the same object.\n   As an alternative, after freeing\
    \ an object, you can set your pointer to nullptr. Calling free on a nullptr is\
    \ guaranteed to do nothing.\n2. You have two or more owning pointers to an object\
    \ and free was called on more than one. (An owning pointer is a pointer that decided\
    \ \"owns\" the object to which it points. Before disposing of such a pointer,\
    \ you must free the owned object.) For any object, there should only ever be at\
    \ most one owning pointer (or use a shared pointer like in 17.3, p.251).\n\n#\
    \ 18.6.4 Null Pointer Dereference\n\nA null dereference is simply an attempt to\
    \ dereference a pointer whose value is nullptr. So as why it's null when you're\
    \ assuming it shouldn't be, there can be any number of reasons ranging from setting\
    \ it to a null-value or resetting it to a null value. Generally, it's one of the\
    \ simplest bugs to diagnose and fix (except when it isn't — see 18.8).\n\n# 18.6.5\
    \ Off-by-One\n\nThe array bounds error ($18.6.1) is a particular case of the more\
    \ general off-by-one error when a calculated value is either one less or one more\
    \ than it should be. Such miscalculations often occur when dealing with strings\
    \ or buffers. For example, recall the malloc function from listing 1.13 (p.21)\
    \ that contains the line:\n\n```\nchar *const s12 = malloc( s1_len + strlen( s2\
    \ ) + 1 );\n```\n\nA common mistake is to forget the +1 for the terminating null\
    \ character.\n\n# 18.6.6 Use After Free\n\nA use-after-free bug is when you free\
    \ a pointer to an object, then attempt to dereference the pointer to the (now\
    \ non-existent) object."
