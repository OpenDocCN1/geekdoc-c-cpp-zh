  md: '# C.16 static_assert


    Originally, C didn''t have static_assert ($16.5). C11 added it, but it was called
    _Static_assert ($2.2 #7,p.29), so you may see that in older code. Alternatively,
    C11 also added the following to the assert.h standard header:


    ```

    #define static_assert(EXPR, MSG) \

    _Static_assert( EXPR, MSG )

    ```


    Prior to C11, you could do something like:


    ```

    #define static_assert(EXPR, MSG) \

    typef int static_assert[(EXPR) ? 1 : ((void)(MSG), -1]

    ```


    If EXPR evaluated to fail, then it would attempt to declare an array type with
    a negative size that''s illegal and you''d get an error message like:


    ```

    error: ''static_assert'' declared as an array with a \

    negative size

    ```


    that might also include MSG. When the error is a nonsequitur, at least the macro
    would fulfill its purpose of not compiling your program.


    # C.17 Storage Classes for Compound Literals


    Prior to C23, storage classes ($4.3) for compound literals ($6.11, $10.4) are
    not suped. Unfortunately, there is no pre-C23 alternative.


    # C.18 thread_local


    Originally, C didn''t have thread_local ($14.7). C11 added it, but it was called
    _Thread_local ($2.2 #7,p.29), so you may see that in older code. Alternatively,
    C11 also added the following to the threads.h standard header:


    ```

    #define thread_local             __Thread_local

    ```'
  merge: -1
  pgno: 387
