  md: '# Preface


    As described in K&R, C is a general-purpose programming language with a simple
    syntax. Part of C’s philosophy¹ includes things like:


    +   **Trust the programmer.**

    Means that the compiler assumes you know what you’re doing (even when you don’t).
    Sometimes, it leads to a core dump. (If you don’t know what that is, you will.)

    n**Make it fast, even if it’s not guaranteed to be portable.**

    C prioritizes generating efficient code. By many benchmarks, a program written
    in C runs faster than equivalent programs written in other languages. One of the
    ways C achieves this is leaving many means of language implementation defined
    meaning that each compiler generates code for what works best (is fastest) for
    a particular CPU. Examples include the number of bits comprising an integer and
    whether characters are signed or unsigned. Consequently, it can be too easy to
    write non-portable code. That is, it may work perfectly on your machine, but if
    compiled and run on another machine, it may fail in surprising ways.


    Despite these things, there are best practices for avoiding bugs and writing portable
    C code.


    > > “C is quirky, flawed, and an enormous success.”

    > Dennis M. Ritchie


    Indeed, despite its quirks and flaws, the fact that you’re considering C over
    half century after its creation should demonstrate its success.


    # Acknowledgments


    I would like to thank Andrew Brown, Dana Florescu, Mark Musante, Vishal Patel,
    and especially Simon Tatham for their thoughtful comments, gentle criticisms,
    and helpful suggestions on drafts of this book.


    Now, let’s begin.


    April 2025


    Paul J. Lucas


    ¹Rationale for International Standard—Programming Languages—C, Revision 5.10,
    April, 2003,

    https://www.open-std.org/jtc1/ac22/wg14/www/C99RationaleV5.10.pdf'
