  md: 'xviii


    Preface


    +   4. Embedded systems are largely developed in C (or C++, but with restrictions).
    If you ever meant to work on embedded systems, you''ll likely know C.


    +   5. C has influenced more languages than any other (except ALGOL). If, in addition
    to programming, you also have an interest in programming languages in general
    or from a historical perspective, you should know C.


    I''m not suggesting that you should learn C intending to it as your programming
    language not that you should implement your next big project in C. Programming
    languages are tools and the best tool should always be used for a given job. If
    you need to do any of the things listed in reasons 2–4 above, C will likely be
    the best tool for the job.


    # Wouldn''t learning C++ be good enough?

    I already know C. Isn''t that good enough?


    Since C++ has supplanted C in many cases, both of those are fair questions. The
    answer to both is “No.” A couple of reasons:


    +   1. Even though C++ is based on C, their similarities are superficial. Aside
    sharing some keywords, basic syntax, and toolchain, they are very different languages.
    The ways in which you get done in C is necessarily different from C++ due to C''s
    minimal features.


    +   2. From the perspective of learning how features are implemented behind the
    curtain, C++ is already too high-level since the language has modern features
    and its standard library contains several data structures and many algorithms.


    # Why this book?


    If all that has convinced you that C is still worth learning, the last question
    is “Why this book?” Considering that The C Programming Language† (by Brian Kernighan
    and Dennis Ritchie, C''s creator, known as “K&R”) is the classic book for learning
    C, too is a fair question.


    The second (and last) of K&R was published in 1988 based on the draft of the first
    ANSI standard of C (C89). C has evolved (slowly) since with the C95, C99, C11,
    and C23 standards. This book covers them all.


    This book is split into three parts:


    > †The C Programming Language, Brian W. Kernighan and Dennis M. Ritchie, AT&T
    Bell Laboratories, Prentice-Hall, Englewood Cliffs, New Jersey, 1978 (1st ed.),
    1988 (2nd ed.).'
