  md: "# 26.1 Pointers to Function\n\nRather than having additional token members\
    \ storing printing options, you can instead store pointers to function ($6.10)\
    \ and delegate printing to them as shown in listing 26.2.\n\n```\nstruct token\
    \ {\n  // ...\n  void (*print_int) ( long);\n  void (*print_float) ( double);\n\
    \  void (*print_char) ( char);\n  void (*print_str) ( char const);\n};\n\nvoid\
    \ token_print(struct token const *t) {\n  switch (t->kind) {\n    case TOKEN_INT:\
    \ t->print_int ( t->i ); break;\n    case TOKEN_FLOAT: t->print_float ( t->f );\
    \ break;\n    case TOKEN_CHAR: t->print_char ( t->c ); break;\n    case TOKEN_STR:\
    \ t->print_str ( t->s ); break;\n  }\n}\n```\n\n**Listing 26.2:** Dynamic dispatch,\
    \ version 2, using pointers to function\n\nWhen a token is created, its pointers\
    \ would be set to point to a default set of printing functions. To change the\
    \ tokens print, you simply change one or more of the pointers to different printing\
    \ functions. To print using the pointers we can rewrite token_print as also shown.\n\
    \nAs a reminder for $6.10, if you know C++, then a statement like:\n\n```\nt->print_float(\
    \ t->f ); // not C++; shorthand for ...\n```\n\nmight like a C++ member function\
    \ call, but it's really C and a shorthand for calling a pointer to function:\n\
    \n```\n(t->print_float)( t->f ); // ... this\n```\n\n+   Even though I commented\
    \ in $6.10 that I personally prefer using the explicit (...*) form, when implementing\
    \ dynamic dispatch like this, the short-form seems more natural. ☐\n\nWhile having\
    \ one pointer per function is very flexible, it takes 32 bytes for the pointers\
    \ (assuming 64-bit pointers), and that triples the total size of token."
