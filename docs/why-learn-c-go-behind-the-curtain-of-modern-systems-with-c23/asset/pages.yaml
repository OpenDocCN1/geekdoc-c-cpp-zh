    # 14.2 Detaching Threads


    By default, every thread created must be joined. Failure to join threads will
    result in a “thread leak.” Eventually, resources for creating new threads will
    be exhausted. Alternatively, a thread can be detached when it terminates, its
    resources will be cleaned-up automatically. A thread can be detached by doing:


    ```

    thrd_detach( thread );

    ```


    on any time after its creation (typically, shortly after) by either the creating
    thread (as above) or the thread it created by doing:


    ```

    thrd_detach( thrd_current() );

    ```


    Once a thread has been detached, it can''t be joined. Detaching threads has the
    following caveats:


    +   - It’s impossible to get the return value of a thread’s start function.

    - It’s harder to know when the thread has terminated.'
