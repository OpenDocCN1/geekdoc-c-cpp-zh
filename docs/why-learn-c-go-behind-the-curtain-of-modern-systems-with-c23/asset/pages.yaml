    # 18.6.8 Uninitialized Variable


    As mentioned in §1.3, attempting to read from an uninitialized variable results
    in

    deefined behavior (§15). One way to avoid this would always be to initialize vari-

    ables declared “just in case”. The pitfall is that doing so can cause a different

    hug? How consider the code in listing 18.4.


    ```

    int x_min = 0, x_max = 0;

    int y_min = 0, y_max = 0;

    //

    x_min = MIN(x1, x2);

    y_min = MIN(y1, y2);

    x_max = MAX(x1, x2);

    x_max = MAX(x_min, y_min, x_max, y_max);

    draw_rect(x_min, y_min, x_max, y_max);

    ```


    > Listing 18.4: Initializing “just in case” pitfall


    This code will compile without warning despite the bug.(Did you notice it?) The

    hug is the x_max on line 7 is a typo: it should be y_max. It goes unnoticed because

    the compiler has no way to know it''s a type. Because as far as the compiler is
    concerned,\he code is “fine” as you left all of x_min,

    x_max_max, y_min, and y_max uninitialized in their declarations, the compiler
    could have

    warned you with the -Uninitialized command-line option (§18.7.1).


    ```

    rect.c:8:34: warning: ''y_max'' uninitialized when used here

    8 draw_rect(x_min, y_min, x_max, y_max);

    ----

    ```


    And you have realized you made a typo. In this case, the better solution would

    have been to declare and assign the variables together on the same lines, but
    there are

