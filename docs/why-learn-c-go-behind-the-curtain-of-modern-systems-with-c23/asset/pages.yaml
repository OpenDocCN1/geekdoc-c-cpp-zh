  md: '# 6.13 Dynamically Allocating 2D Arrays


    ```

    double **const a2d = (double**)

    alloc2d(sizeof(double), alignof(double), 3, 2);

    a2d[0] = 3.14; // [i][j] syntax works

    free(a2d);

    ```


    The (double**) cast (S3.14.3) is necessary, unlike void* that implicit-casts to
    any pointer, void* does.


    +   * To ensure elements[0][0] is suitably aligned, line 3 calculates the size
    of the pointers rounded up to align bytes it includes any necessary padding using
    the rup2 function from line 3.2 (P.51).

    * Line 6 allocates rows that is a pointer to the entire chunk of memory containing
    both the array of pointers and the array of elements.

    * Line 7 sets elements to point to the first element that the address rows ptr_size
    that includes any necessary padding. The (char*) cast is necessary because arithmetic
    can''t done on void pointers because void objects don''t exist, have no base.

    * Line 8-9 sets rows to point to the zeroth of each row (the arrows in figure
    6.4).


    Not does this one only call to malloc, but also only one call to free. Had the
    array of elements allocated separately from the array of pointers, another free2d
    would have been necessary to free here.


    Another caveat is that, unlike a statically allocated 2D array, a dynamically
    allocated 2D array uses additional memory for the row pointers. Whenever possible
    for an array with dimensions i × j, make i ≤ j so you get the most elements per
    pointer. On the other hand, it''s possible to write a variant of alloc2d that
    allocates only elements for row i. This will use memory for (n+1)/2 elements plus
    n pointers. For a triangular matrix where n ≥4, this yields a memory savings.


    If the cost of the additional row pointers is too much for your circumstances,
    you can eliminate them, but have to sacrifice the syntax and your own accessor
    function that the compiler does before the curtain, something like:


    ```

    void* a2d_ij( void *a2d, size_t esize, size_t c,

    size_t i, size_t j ) {

    return & ((char*)a2d)[i * c + j) * esize);

    }

    ```


    then use it:


    ```

    double *const a2d = malloc(sizeof(double) * 3 * 2);

    *(double*)a2d_ij(a2d, sizeof(double), 2, i, j ) = 3.14;

    ```


    But that''s pretty ugly. Like many other things in computer science, it''s a trade-off.'
