  md: '# 4.9 noreturn


    The noreturn attribute should be used to mark functions that never return. For
    example, the standard function exit ($9.7.2) terminates a program as if it returned
    from main. It''s declared as:


    ```

    [[noreturn]] void exit(int status);

    ```


    The reasons for marking a function noreturn include:


    +   * It allows the compiler to warn that code following a call to such a function
    will never be executed. (For clang and gce, you need to specify the -Wreachable-code
    command-line option).

    * It documents to programmers that it doesn''t return.


    A function marked noreturn:


    +   * Must have a return type of void.

    * Must actually return. If it does, the result is undefined behavior (§15).


    # 4.10 Epilogue


    Here are some key points about and some advice for declarations:


    +   * Multiple things may be declared in the same declarations. When doing so,
    re-member that the * for pointers binds to the name, not the type.

    * Use auto when declaring a variable that you are initializing in its declaration
    from an expression (but not a literal).

    * Use extern to share global variables among multiple .c files.

    * Use static to declare objects that are “private” to a file.

    * Don''t use register.

    * Use constexpr to declare constants.

    * Use const to mark objects immutable.

    * Use attributes whenever possible.'
