  md: '# # Chapter 8 Preprocessor


    ![](img/3351c1095f7fa1e1a549dc9b17ad7247_129_0.png)


    One of C’s quirks is that it has a separate *preprocessor* that''s called by the
    C compiler to “preprocess” source files before compiling them — hence the name.


    +   * The reason C has a preprocessor unlike other languages is that it seemed
    like a good idea at the time at Bell Labs due to the use of preprocessors in general
    such as m4 and the Troff suite of processors.


    Modern compilers have the preprocessor integrated, though there are often options
    to control it specifically as if it were still a separate program. For clang and
    gcc at least, the -E option causes a file to be preprocessed that can often be
    illuminating as what the preprocessor is doing. For Microsoft C, the option is
    /E.


    # ## 8.1 Compilation Phases


    Compilation happens in a number of *phases*, the first of which are relevant to
    preprocessing:


    +   1. Every escaped newline (\ immediately followed by a newline) is deleted
    by splicing the lines together.

    2. The sequence of individual characters comprising the text of a source file
    are coalesced into a sequence of *tokens*. For example, the sequence of characters
    ++i (two adjacent plus-plus followed by the letter i) are coalesced into the sequence
    of tokens plus-plus followed by the *identifier* i.

    3. Preprocessing directives (#8.2) are performed and macros (#8.3, #8.7) are expanded.
    All preprocessing directives are then deleted.

    4. Escaped character sequences are converted to the characters they represent,
    e.g., \n becomes a newline.

    5. Adjacent string literals are concatenated, e.g., “A” “B” becomes “AB”.'
  merge: -1
  pgno: 129
- img_proc: true
  md: '# 8.2 Language


    The preprocessor has its own mini-language that is very different from C:


    +   - A *directive* in the preprocessor corresponds to a statement in C. Directives
    are line-based and begin with # (that must be the first on a line) and end with
    an end-of-line (on Unix systems, the newline character) — unless escaped via \
    in which case a directive ends with the first unescaped newline.

    - Following the # may zero or more whitespace characters followed by a directive
    name, all the following are equivalent:

    ```

    #ifndef DEBUG

    #   ifndef DEBUG

    #     ifndef DEBUG

    ```

    - Some people, myself included, prefer the style that the # is always in the first
    column to make preprocessor lines stand out.


    +   - Other than the set of tokens that comprise C (identifiers, operators, punctuation,
    literals, comments), the preprocessor knows very little about C. In particular,
    it knows nothing about scope (§2.4).


    # 8.3 Object-Like Macros


    Object-like macros are the simplest: they replace a macro name with zero or more
    tokens comprising its replacement list where the name occurs (except within string
    literals).


    To define an object-like macro, use the #define directive followed by the name
    of the macro followed by the set of tokens it should be replaced by. For example:


    ```

    #define WS "\n\t\r\f\v"

    ```


    defines ws macro that will be replaced by the given string literal ws subsequently
    in the source file.


    Most compilers also allow you to define a macro via an option. For clang and gcc,
    the -d command-line option can be used to define a macro having an optional value
    as an argument of the form name[=value]. For Microsoft C, the option is /. If
    value is omitted, it defaults to 1. For example:


    ```

    $ cc -DEBUG hello.c          # as if: -DEBUG=1

    $ cc -DMSG="hello, world"  # shell needs ''...''

    ```


    +   - Originally, C didn''t have either enumerations (§7) or constexpr (§4.4),
    so object-like macros were the only way to give constants.'
