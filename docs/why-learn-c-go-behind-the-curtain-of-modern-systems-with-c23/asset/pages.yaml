  md: "# 1.9 Structures\n\nWhereas an array is many objects of one type, a structure\
    \ ($10) is one object of (potentially) many types. Suppose you want to create\
    \ a proper string object that can grow automatically. You can declare a structure\
    \ using struct followed by its name:\n\n```\nstruct string {\n    char *contents;\
    \      // pointer to actual contents\n    size_t len;          // length (not\
    \ including null at end)\n};\n```\n\nThis structure has two members: the first\
    \ for a pointer to the characters comprising the contents and the second for the\
    \ length.\n\nYou can declare a variable of a structure type and optionally initialize\
    \ it using {} where the order of the values corresponds to the order that the\
    \ members were declared ($10.3):\n\n```\nstruct string str = { \"hello\", 5 };\n\
    ```\n\nAlternatively, you can use designated initializers ($10.3), that use the\
    \ member names preceded by . (dot) and followed by =\n\n```\nstruct string str\
    \ = { .contents = \"hello\", .len = 5 };\n```\n\nDesignated initializers can be\
    \ given in any order. To access a member, use a . (member-access operator, $3.13)\
    \ followed by the name of the member:\n\n```\nputs( str.contents );\n```\n\nTo\
    \ access a member via pointer:\n\n```\nstruct string *pstr = &str;\nputs( (*pstr)->contents\
    \ );\n```\n\nYou need the ( ) since has higher precedence ($3) than *. Unfortunately,\
    \ C provides a -> (pointer-member-access aka, \"arrow\") variant of the dereference\
    \ operator that’s shorthand:\n\n```\nputs( pstr->contents ); // same as: (*pstr).contents\n\
    ```\n\nHowever, we don’t want to manipulate the members manually; we want to write\
    \ functions that manipulate the members on our behalf. One function is to put\
    \ (append) a string as shown in listing 1.14.\n\n+   The standard function realloc\
    \ is similar to but unlike malloc that realloc takes an existing pointer and reallocates\
    \ the pointed-memory to make it have the new length and returns a new pointer.\
    \ (If the original pointer is null, then realloc allocates fresh memory.)"
