  md: '# Chapter 15

    Undefined Behavior


    ![](img/3351c1095f7fa1e1a549dc9b17ad7247_250_0.png)


    Prior to the first C standard in 1989, there were two “flavors” of C:


    +   - **Unportable C**: a step up from assembly language used to program operating
    systems using any technique that worked for the particular hardware.

    - **Semi-portable C**: use of #ideff (§8.5) made many programs “semi-portable”
    that they compile and run on all the hardware and operating systems considered.


    C’s popularity grew, it was becoming clear that a standard was needed. While K&R
    was the definitive description of C for over a decade, it was insufficiently precise
    to be a standard. It had to specify precisely what happens in every circumstance
    for every aspect of a language.


    However, by the mid-1980s, there were many unportable and semi-portable programs
    that worked. The problem was that doing X on computer 1 with compiler 1 yielded
    R1 whereas doing X on computer 2 with compiler 2 yielded R2 and their respective
    programs relied on these results. A standard would have to maintain that only
    one of result R1 or R2 was correct. Updated standard-forming compilers would break
    many programs.


    To not do this, the concepts of implementation definition, unspecified behavior,
    and undefined behavior were invented as part of the standard to serve as “escape
    hatches” to allow many working programs to continue work with standard-conforming
    compilers. While this may not seem completely satisfying, definitively stating
    that X is one implementation of defined, unspecified, or undefined is an improvement
    over stating nothing at all X.


    The differences between the three somewhat related “bad” behaviors in C are explained
    in the comp.lang.c FAQ, question 11.33:


    +   - **Implementation defined**: the implementation must pick some behavior,
    it must be consistent, and it must be documented.


    †comp.lang.c Frequently Asked Questions, Steve Summit, Jan, 1995,

    https://c-faq.com/ansi/undef.html


    Paul Lucas 2025

    P. J. Lucas, Why We Learn C, https://doi.org/10.1007/979-8-8688-1597-3_15'
