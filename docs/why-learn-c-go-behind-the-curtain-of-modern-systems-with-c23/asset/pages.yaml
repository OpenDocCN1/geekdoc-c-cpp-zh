  md: '# 4.9 Attributes


    # 4.9.3 maybe_unused


    The compiler can warn you when one of a variable, static function ($9.8), or label
    ($5.10) is unused. For clang and gcc, you need to specify the -unused command-line
    option.) Normally, this is a good thing, but sometimes you might want to keep
    unused variables or functions in case you''re currently unsure whether you need
    them. The maybe_unused attribute can be used to make unused variables or functions
    that the compiler won''t warn you.


    ```

    [[maybe_unused]]

    static bool dag_has_cycle(struct dag_node *node);

    ```


    For another example, see $16.6 (p.245).


    # 4.9.4 nodiscard


    Some in the standard library return values that aren''t needed most of the time.
    For example, strpy ($B.2) is declared as:


    ```

    char* strcpy(char *dst, char const *src); // returns dst

    ```


    It returns dst which isn''t necessarily needed since you already have it. For
    functions, it''s OK to simply discard the return value. The compiler will never
    warn you for doing so.


    Other functions, however, return values that are needed and therefore should not
    be discarded. Such functions can be marked with nodiscard. If the return value
    of such a function is discarded, the compiler will warn you. For example, from
    listing 1.13 (p.21), the function mstrat should be marked nodiscard because it
    returns a pointer to newly allocated memory that, if discarded, would be a memory
    leak:


    ```

    [[nodiscard]]

    char* mstrat(char const *s1, char const *s2);

    ```


    +   Admitted, having to sprinkle [nodiscard] the default over all your programs
    is both tedious and verbose. Ideally, nodiscard would be the default and you''d
    have to officially declare a function as, say, {[okiscard]} to discard its return
    value without warning. Unfortunately, C didn''t originally have nodiscard (or
    attributes at all) so you can''t simply add an olddiscard attribute and make all
    other declarations nodiscard by default without causing warnings for every C program
    in existence. Hence, adding nodiscard to C was much less disruptive and better
    than not adding it.'
