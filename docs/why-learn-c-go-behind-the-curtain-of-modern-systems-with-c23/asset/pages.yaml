  md: "This typically means memory-mapped I/O, that is particular memory addresses\
    \ are mapped to specialized hardware or functions, so that reading from such an\
    \ address actually reads a current value from such hardware (say, some kind of\
    \ sensor) or writing to an address actually causes a change in hardware (say,\
    \ sends a value over an old-fashioned modem).\n\nFor example, consider the code\
    \ in listing 22.1 which sends all characters of a C string that is mapped to the\
    \ address 0x1000:\n\n```\nchar *const MODEM = (char*)0x1000; // memory-mapped\n\
    \nvoid modem_send_s(char const *s ) {\n    while (* s)\n        *MODEM = *s++;\n\
    }\n```\n\n# Listing 22.1: modem_send\n\nWriting a character to *MODEM sends that\
    \ character. The problem is that a compiler might be clever and optimize that\
    \ code to be:\n\n```\nwhile (*s++) // compiler-optimized version\n;\n*MODEM =\
    \ s[-1];\n```\n\nUnder ordinary circumstances, it would be within its rights to\
    \ do so (if MODEM was a pointer to ordinary memory, only the last write matters).\
    \ But in the memory-mapped I/O case, it would be wrong (the compiler doesn't know\
    \ that address 0x100 is special).\n\nThe C23 standard continues:\n\n> Therefore\
    \ any expression referring to such an object shall be evaluated strictly according\
    \ to the rules of the abstract machine ...\n\n> That means no reads from writes\
    \ to such an object will be optimized away instructions reordered by the compiler\
    \ even if it normally would do.\nThe way to tell the compiler not to optimize\
    \ accesses to an object is by qualifying it with volatile:\n\n```\nchar volatile\
    \ *const MODEM = (char*)0x1000;\n```\n\n(Read from right-to-left: MODEM is a constant\
    \ pointer to a volatile character).\n\n# 22.2 Signal Handling\n\nThe C23 standard\
    \ §7.14.1.j95 says the following about the second use of volatile:"
