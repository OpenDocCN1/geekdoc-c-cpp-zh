    4 Declarations


    While such declarations may not seem that bad, once they like const (§4.5) and
    function prototypes

    (\9.1) were added to C (neither of which existed in the original version of

    C) — declarations famously harder to read which is the reason behind

    Bjarne''s.


    # 4.1 Multiple Declarations


    In C, multiple things can be declared in the same declaration, so long as they
    have

    the base type. For example:


    ```

    char c, *s, buf[4]; *fgets(char*, int, FILE*);

    ```


    declares c char. s pointer to char, buf as array 4 of char, and fgets

    function pointer to char.


    +   You may encounter code that puts the * adjacent to the type in pointer

    declarations:


    ```

    char* s; // as opposed to: char *s

    ```


    While such declarations work since the C compiler doesn''t care about

    whitespace, the * still “binds” to the name, not the type. Hence:


    ```

    char s, t; // s is pointer to char; t is char char

    ```


    declares s to be char* and t to be char likely not what you meant.


    # 4.2 auto


    When initializing a variable in its declaration from an expression, ordinarily

    have to know what the type of the expression is in order to know what type to
    declare

    the variable as. For example, from listing 1.14 (p.24):


    ```

    size_t const new_len = str->len + strlen( s );

    ```


    you have to know the type of str->len and strlen are size_t in order to

    know what type to declare new_len as. The thing is the compiler already knows

    what type that is. It would be nice to say “declare new_len as whatever

    type expression is.” That''s precisely what auto does, so you can instead do:


    ```

    auto const new_len = str->len + strlen( s );

    ```'
