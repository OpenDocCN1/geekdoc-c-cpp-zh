    \ longest string plus the terminating null character yourself (in this case, 6).\n\
    \nThe difference for COLORS_2D is, in this case, \"blue\" would waste 1 and \"\
    red\" would waste 2, since the total space is always 30 bytes. On the other hand,\
    \ while COLORS would require exactly 27 bytes for the strings, it would also require\
    \ 40 bytes for the pointers (assuming 64-bit pointers) for a total of 67 bytes.\n\
    \nThat said, unless space is a premium (as it might be in embedded applications),\
    \ using an array of pointers to strings is simply more convenient.\n\n# 6.10 Pointers\
    \ to Function\n\nIn addition to pointing to an object, a pointer can also point\
    \ to a function because the compiled code for functions is in memory like objects.\
    \ Just as pointers to objects are typed, e.g., pointer to int, pointers to functions\
    \ are also typed, e.g., pointer to function taking two pointers as parameters\
    \ and returning an int. For example, the standard function qsort sorts an array\
    \ is declared as:\n\n```\nvoid qsort( void *array, size_t n, size_t esize,\n \
    \ (*cmp_fn)( void const *, void const *) );\n```\n\nwhere array points to the\
    \ array of any type be sorted, and cmp_fn is a pointer to the function to perform\
    \ comparisons of two elements i and j returning an int < 0, 0, or > 0 if array[i]\
    \ is <, =, or > array[j], respectively. (Note: text corrected)\n\nBy using both\
    \ void* and a pointer to function, qsort implements only the algorithm and has\
    \ element comparisons (which are independent of the algorithm) to the pointed-to\
    \ function. Hence, a pointer to function is like an interface in either Go or\
    \ Java or an abstract class in C++ having a single method - but without the interface\
    \ or class envelope.\n\nFor the declaration of cmp_fn itself, the () are necessary\
    \ because it would be a function returning a pointer to int without them. As noted\
    \ in §4, declarations in C can get infamiously complicated."
