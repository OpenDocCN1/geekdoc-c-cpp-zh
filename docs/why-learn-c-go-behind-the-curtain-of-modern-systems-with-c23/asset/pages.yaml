  md: "# 6.4 Multidimensional Arrays\n\nConceptually, think of a 2D matrix as an array\
    \ of arrays. In C, all the elements are allocated contiguously such that a2d[i][0]\
    \ and a2d[i][1] are adjacent in memory for a given row i (row-major order) as\
    \ shown in figure 6.1.\n\n```\n[0][0][0][1][1][0][1][1][2][0][2][1]\n```\n\nFig.\
    \ 6.1: Memory layout of a 3 × 2 array\n\nBehind the curtain, memory is (always)\
    \ one-dimensional as defined in §1.5. To implement the syntactic sugar of two-dimensional\
    \ arrays, the compiler actually does:\n\n```\ndouble *const ald = &a2d[0];\na2d[i][j]\
    \ = ;\\n// really: ald[i * 2 + j]\n```\n\nThat is, to access a2d[i][j], the compiler\
    \ multiplies i by the row size 2 adds j and uses that if we were the index into\
    \ a one-dimensional array.\nMidimensional arrays can be initialized to one-dimensional\
    \ arrays as shown in figure 6.1, lines 4–16.\n\n```\n#include <math.h> // for\
    \ sqrt()\n#include <stdio.h>\n\nconstexpr double PLANT_AU[][2] = {\n{ 0.31, 0.47\
    \ }, // Mercury\n{ 0.72, 0.73 }, // Venus\n{ 0.98, 1.02 }, // Earth\n{ 1.38, 1.67\
    \ }, // Mars\n{ 4.95, 5.45 }, // Jupiter\n{ 9.01, 10.07 }, // Saturn\n{ 18.28,\
    \ 20.09 }, // Uranus\n{ 29.80, 30.32 }, // Neptune\n}\n\nd orbital_period(unsigned\
    \ p) {\nauto const a = (PLANT_AU[p][0] + PLANT_AU[p][1]) / 2;\nreturn sqrt(a *\
    \ a);\n}\n\nint main() {\nfor (unsigned p = 0; p < 8; ++p) {\n  auto const period\
