  md: '# 18.6 Common Bugs


    There are types of bugs that happen more frequently than others. Some have already
    been discussed: data races ($14), thread leaks ($14.2), and undefined behavior
    ($15). In this section, additional bugs are likely to encounter be presented.


    # 18.6.1 Array Bounds


    As mentioned in $6.3, accessing an element of an array outside its bounds results
    in undefined behavior ($15). If you''re lucky, you''ll get a segmentation fault
    ($18.5) followed by a core dump ($18.4); if you''re unlucky, your program may
    appear to work correctly — some of the time.


    For example, given the code shown in listing 18.1, the use of <= rather than <
    when iterating through rv is invariably wrong.


    ```

    bool rv = false;

    char buf[1024];


    for ( unsigned i = 0; i <= 1024; ++i ) // should be <

    buf[i] = /* ... */;

    // ... may return random value

    return rv;

    ```


    +   Listing 18.1: Array bounds violation


    In this case, when i is 1024, assigning a value to buf[i] may overwrite rv if
    its stored in memory immediately after buf in the function''s stack frame.(The
    order of local variables are laid out in implementation defined.) The value of
    rv may become true if buf[1024] is odd and false if even. The function would appear
    to return truly randomly.


    # 18.6.2 Buffer Overflow


    A buffer overflow is kind of array bounds violation, but is usually caused different-,
    typically by calling a function that writes beyond the end of a buffer rather
    than doing so explicitly via an array index. Standard functions that can do this
    far easily call scanf ($12.4), strcpy ($8.2), and strcpy because they don''t have
    the capacity of the buffer as a parameter.


    In production-quality programs, scanf with strings shouldn''t be used; the non-standard
    but common functions strlat and strlpy should be used instead of streat and strcpy,
    respectively. Even safer functions like memcpy ($B.2) can cause a buffer overflow
    if you get the capacity of the buffer wrong. Whenever using a buffer, always know
    its capacity.'
