  md: '# 6.7 Arrays and Pointers


    There are a couple of quirky features of C when it comes to arrays and pointers:


    +   1. The name of an array in an expression "decays" into a pointer to its first
    element.

    For example:


    ```

    int a[3];

    int *p = a;      // as if: p = &a[0];

    ```


    +   2. The a[i] syntax is syntactic sugar for *(a+i). The compiler multiplies
    i × sizeof(int), then adds to a (address of its first element) to yield the address
    of the ith, then dereferences that address. This means that [] has no bounds checking
    (§18.6.1).


    +   3. Equivalently for any pointer *p can be written as p[0] which is the same
    as *(p+0). This means arithmetic can be done on pointers. More generally, *(p+i)
    is the element at the memory address p plus the offset of i × sizeof(type), which
    is the same as p[i]. This equivalence allows a one-dimensional array to be dynamically
    allocated and have the [] syntax work:


    ```

    int const *p = malloc( 3 * sizeof(int));

    // ...

    p[i] = 42;      // as if: *(p + i) = 42

    ```


    While the syntactic sugar and equivalences are often convenient, the convenience
    comes at a price, specifically:


    +   * There is no way to tell if a pointer points to a single object or multiple
    objects.

    * Since the name of an array decays into a pointer in expressions, there is no
    way to tell how many elements an array has (unless its declaration is in scope
    in which case you can use the size operator, §3.16).


    Both of these means it''s too easy to attempt to access an object beyond either
    a pointer points to or the number of elements in an array resulting in undefined
    behavior (§18.6.1), sometimes with serious consequences.


    As a special case, it''s perfectly OK for a pointer to point to one past the last
    element of array. For example:


    ```

    int buf[4];

    int const *end = buf + 4; // one past last element is OK

    ```


    it''s OK to have end point past the last element of buf as shown in figure 6.2
    for comparing against that enables code like this to be written:


    ```

    for ( int *p = buf; p < end; ++p )

    ```


    Of course, dereferencing such pointer still results in undefined behavior.'
