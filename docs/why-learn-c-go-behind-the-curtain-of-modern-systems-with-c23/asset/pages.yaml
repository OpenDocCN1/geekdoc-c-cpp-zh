  md: '# 17.3 Memory Barriers


    Atomic (by any meaning) is not enough to ensure thread-safety because the order
    of memory operations does not necessarily match the order of statements in a program.
    Why not? Because the hardware, the compiler, or both, may reorder memory operations
    to improve performance. Not making a change to the observable behavior (§14) applies
    only from the perspective of a single thread.


    Memory barriers (aka, "memory fences") help ensure thread-safety by selectively
    prohibiting reordering of memory operations across some synchronization point
    among threads. C provides the memory_order_enumeration containing six memory order
    values explained in the following sections.


    The sometimes confusing thing about memory barriers is they''re about controlling
    the order of operations relative to each other, not the operations themselves.


    # 17.3.1 memory_order_seq_cst


    Sequential consistency is the safest memory order which is why it''s the default.
    It''s also the least performant because it establishes a global constraint (bottleneck)
    of memory ordering across all threads. In specific cases, the constraint can be
    relaxed to make the code more performant.


    Writing thread-safe code even with ordinary mutexes is hard to get right, even
    for experts. Writing thread-safe code using atomics with memory orders other than
    sequential consistency is even harder! Before considering them, you should:


    +   - Remember using efficient algorithms matters more than locking technique.
    For example, an $n \log(n)$ algorithm with slower mutexes will still be likely
    more performant than an $n^2$ algorithm using _Atomic.

    - Profile your code (§18.9) to see if it''s spending too much time locking or
    waiting for locks. (Remember: results are CPU-dependent!)

    - Only if locking and waiting for those locks takes a significant percentage of
    time, then consider the following techniques.


    Bugs caused by improper use of memory ordering are hard to reproduce and hard
    to debug.'
  merge: -1
