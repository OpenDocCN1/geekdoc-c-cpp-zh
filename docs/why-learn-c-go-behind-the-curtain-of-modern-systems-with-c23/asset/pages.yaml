  md: '# Memory Barriers


    # 17.3.2 memory_order_relaxed


    Relaxed is the most basic and least safe memory order in that it does not guarantee
    operation order or synchronization, but still guarantees modification order. For
    example, given the following code running in a single thread where x = y = 0 to
    start:


    ```

    int r = y;           // r = 0

    x = r;               // x = 0

    int s = x;           // s = 0

    y = 4;               // y = 4

    ```


    then r = s = 0 and y = 4 — no surprises. However, doing the same thing in two
    threads using relaxed:


    ```

    // thread 1

    r = atomic_load_explicit(&y, memory_order_relaxed); // 1A

    atomic_store_explicit(&x, r, memory_order_relaxed); // 1B

    // thread 2

    s = atomic_load_explicit(&x, memory_order_relaxed); // 2A

    atomic_store_explicit(&y, r, memory_order_relaxed); // 2B

    ```


    can result y when r = x = s = 4, even though the statement order in thread 1 is
    1A, 1B, and in thread 2 is 2A, 2B, it''s possible that the memory order in 2B,
    1A, 1B, 2A. What good? For independent variables, eliminating the global constraint
    (bottleneck) of memory ordering improves performance. A practical use for relaxed
    is incrementing reference counts.


    Suppose we want to implement a reference-counted object such that when the last
    pointer to the object goes, the object is automatically freed. Types for this
    are shown in listing 17.3.


    ```

    1 struct shrd_obj;

    2 typedef void (*shrd_free_fn)(struct shrd_obj*);

    3

    4 struct shrd_obj {

    5 size_t _Atomic ref_cnt;

    6 shrd_free_fn      free_fn;

    7 alignas(max_align) char data[];

    8 };

    ```


    Listing 17.3: Shared object types


    +   * Line 1 simply forward-declares shrd_obj so that it can be declared shrd_free_fn
    on line 2, a function to call free the object when the reference count gets decremented
    to zero.

    * Lines 4-8 declare shrd_obj that contains ref_cnt, and data as a flexible array
    member (§10.6) for the object as count, free_fn, and as done for in listing 10.9
    (p.163).


    To create a new shrd_obj, the function shrd_new is shown in listing 17.4.'
