    Standard Functions


    This appendix lists various standard functions, their signatures, and brief descriptions,
    by header that you are most likely to use in your programs. For full descriptions,
    see their respective manual pages either on your system or online.

    The standard C library has the concept of a *locale*, that is a set of cultural
    conventions used either to classify or format data like numbers, dates, times,
    and currency. The default locale is the "C" (aka, "POSIX") locale. Many functions
    in the standard library are locale-sensitive.


    # ## B.1 ctype.h


    These functions take int rather than char to allow the value of EOF as an argument
    (§1.2). They return int rather than bool since they pre-date the addition of a
    Boolean type to C (§6). As always, zero means false and non-zero means true.


    ```

    int isnum(int c)

    Returns non-zero only if c is either an alphabetic or numeric character in the
    current locale. (See also isalpha, isdigit, isxdigit.)nint isalpha(int c)

    Returns non-zero only if c is an alphabetic character in the current locale. (See
    also isnum.)nint isblank(int c)

    Returns non-zero only if c is a blank character in the current locale. The default
    locale, only space and tab are considered blank characters. (See also isspace.)

    intiscrl(int c)

    Returns non-zero only if c is a control character, that is either in the range
    ''\x00''-''\x1F'' or ''\x7F''.

    ```'
