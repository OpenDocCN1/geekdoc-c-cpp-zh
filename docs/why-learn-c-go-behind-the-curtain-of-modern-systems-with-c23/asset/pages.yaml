    \ previous value plus one as shown in listing 7.1.\n\n```\nenum color {\n    COLOR_NONE\
    \      = -1,\n    COLOR_BLACK      = 0,\n    COLOR_WHITE      = 1,\n    COLOR_BLUE,\
    \      // value is 2 ...\n    COLOR_GREEN,     // ... 3\n    COLOR_RED,      \
    \ // ... 4\n};\n```\n\nListing 7.1: Enumeration with explicit values\n\nThat said,\
    \ you should not specify values unless: \"externally imposed\" (§7.5.1) or otherwise\
    \ have meaning; or:\n\n+   * You need to \"serialize\" the values (§7.5.2) either\
