  md: "# 9.7.2 Return Value and Exit Status\n\nAs mentioned in §1.1, main must return\
    \ int (§2.5.4) whose value indicates the status, either the success or failure,\
    \ of the program. By convention, zero means \"success\" and any non-zero value\
    \ means \"failure\" where the value is a code for the type of failure. For a special\
    \ case, returning a value from main is optional. If omitted, it's equivalent to\
    \ returning zero (success).\n\nWhen main returns, it calls the standard function\
    \ exit that terminates the program. Alternatively, you can call yourself at any\
    \ time. For this reason a program's return value is also known as its exit status.\n\
    \nExcept for zero, there are no other standard values for exit codes. However,\
    \ the standard defines EXIT_SUCCESS as a synonym for EXIT_FAILURE for any failure,\
    \ though its specific value is implementation defined. Some programs search for\
    \ them (like grep(1)) return 1 meaning they ran successfully, but there were no\
    \ matches.\n\n+   - BSD-derived systems use the sysits.h header that defines 15\
    \ or more values for various errors. Unfortunately, it's not standard, choosing\
    \ an appropriate exit value can be non-obvious, and their use has been deprecated\
    \ in programs since 2020.\n\nFor your own programs, you can use any values you\
    \ like. A minimal approach is to simply return 0 or EXIT_FAILURE for any error.\
    \ If you want to use specific values for specific errors, you can use an enumeration\
    \ ($7) as shown in 9.5. Even though exit status is an int, values should be constrained\
    \ to the range -128–127.\n\n```\nenum {\n    EXIT_USAGE = 1, // command-line usage\
    \ error\n    EXIT_CONFIG, // configuration file error\n    EXIT_NOFILE, // no\
    \ such file\n    EXIT_DATAERR, // invalid data\n    EXIT_IO, // i/o error\n  \
    \  EXIT_NOPERM, // insufficient permission\n    EXIT_INTERNAL, // internal error\
    \ (bug)\n    //...\n};\n```\n\n**Listing 9.5:** Possible exit status codes for\
    \ your program\n\n# 9.8 Static Functions\n\nA function declared static gives it\
    \ internal linkage (§4.3), that is to be \"private\" to the .c file it's defined\
    \ in. Within a .c file, static functions are used as private \"helper\" functions\
    \ to other functions. For example, if print_msi is public function, we could have\
    \ still print_cs as a helper function for print_msi"
