  md: '# 8.5.2 __has_c_attribute


    The preprocessor has a __has_c_attribute built-in function that returns true only
    if the given attribute ($4.9) is supported by the compiler. For example:


    ```

    #if __has_c_attribute( gnu::hot )

    # define ATTRIBUTE_HOT [[gnu::hot]]

    #else

    # define ATTRIBUTE_HOT /* nothing */

    #endif

    ```


    # 8.5.3 __has_include


    The preprocessor has a __has_include built-in function that returns true only
    if the given header exists. For example:


    ```

    #if __has_include( <readline/readline.h> )

    # define WITH_READLINE true

    #endif

    ```


    # 8.6 File Inclusion


    The preprocessor has the #include directive in two forms:


    +   #include <path> Includes path relative to a set of pre-defined system paths.

    #include "path" Includes path relative to the current directory.


    The include includes the path verbatim into the current file then preprocessed
    recursively. Invariably, files included have a .h extension and are known as header
    files or simply headers. They contain macro, type, variable,and function declarations
    comprising an API.


    +   - The <> form looks for the requested file from one of set of pre-defined
    paths (the include path) and is largely used to include files from the C standard
    library or third-party libraries.

    - The "" looks for the requested file starting relative to the current directory
    first, then the include path, and is used to include files from your program.


    There are compiler-specific ways to augment the include path. On Unix this is
    done via the -Ipath command-line option of the compiler. For Microsoft C, the
    option is /I.'
