  md: "# C.14 noreturn\n\nPrior to C23, the noreturn attribute ($4.9.5) was _Noreturn\
    \ ($2.2 #7, p.29), and didn't use the [] syntax. Instead, _Noreturn was used by\
    \ it:\n\n```\n_Noreturn void fatal_error( int status,\n            char const\
    \ *format, ... );\n```\n\n_Noreturn is still supported and likely will continue\
    \ to be for many years.\n\n# C.15 nullptr\n\nPrior to C23, nullptr is NULL. While\
    \ NULL is still supported and likely will continue indefinitely, if you want to\
    \ use nullptr, but be able to compile with a C17 or earlier compiler, you can\
    \ do the following:\n\n```\n#if _STDC_VERSION < 202311L && defined nullptr\n \
    \   #include <stddef.h> // for definition of NULL\n    #define nullptr\n#endif\n\
    ```\n\n+   * nullptr is just a macro, typically:\n\n```\n#define NULL ((void*)0)\
    \ // one possible definition\n```\n\nHowever, some platforms define it differently:\n\
    \n```\n#define NULL 0 // alternative definition\n#define NULL 0L // ... or this\n\
    ```\n\nIn C, the integer literal 0 is such that it can implicitly convert to a\
    \ pointer — that happens to be the value used to represent the nullptr. (No other\
    \ integer literal implicitly converts to a pointer.) At the time of C's creation,\
    \ 0 and NULL seemed simple and convenient.\n\nHowever, both 0 and NULL (regardless\
    \ of how it's defined) cause problems in certain cases. For example, if NULL is\
    \ defined as 0, then passing NULL as a variadic function such as vstr_any from\
    \ list-9.9 (p.150) that expects a pointer will result in undefined behavior (§15)\
    \ if sizeof(int) is not the same as sizeof(void*) on the platform. For this and\
    \ other cases why nullptr was (finally) added to C,¹\n\n> Introduce the nullptr\
    \ constant, Jens Gustave and Jean Heyed Mencide, ISO/IEC JTC1/SC22/WG14: Programming\
    \ Language — C, N3042, July 22, 2022.\nhttps://www.open-std.org/jtc1/sc22/wg14/www/docs/n3042.htm"
