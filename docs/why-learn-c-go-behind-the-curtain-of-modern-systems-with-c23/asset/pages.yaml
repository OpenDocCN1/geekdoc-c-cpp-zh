  md: '# 2.2 Names


    # 2.2 Names


    The names of variables, constants, functions, and everything else (collectively,
    *identifiers*) have a few rules. An identifier:


    +   - Must start with a letter, underscore, or Unicode character from the XID_start†
    class.

    - May continue with letters, underscores, digits, or Unicode characters from the
    XID_continue class.

    - Can be of any length.

    - Considers upper case and lower case letters as distinct.

    - Must not be the same as a C keyword.

    - Must not begin with an underscore if it has *external linkage* (§4.3).

    - Must not begin with an underscore followed by a capital letter or another underscore.


    > > To avoid C the problem that every new keyword has the potential to break existing
    programs because some may already use the same identifier. To minimize this possibility,
    the committee decided that new keywords would generally start with this possibility,
    an underscore followed by a capital letter (e.g., `_Bool`, §C.6), at least for
    a transition period to allow people time to update their programs. Such keywords
    may look odd, but it''s better than breaking programs. Names that begin with double
    underscore are reserved for use by the implementation.


    +   - If compatibility with C++ is desired (§13.4), must not contain a double-underscore
    anywhere.


    Generally, the names of most things are in lower case, except the names of constants
    (§4.4), enumeration constants (§7), and macros (§8.3, §8.7) are all in upper case;
    underscores separate words.


    > > This is another topic of insufferable debates that have raged for decades
    about which is the “one true style” for naming things. This book largely uses
    K&R’s style.'
