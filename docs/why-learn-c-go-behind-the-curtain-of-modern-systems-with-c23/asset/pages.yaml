  md: "# C.13 K&R-Style Function Declarations and Definitions\n\ndeclared strncpy($B.2)\
    \ as a function returning char* without saying anything about parameters, if any,\
    \ required. You simply had to know by reading the documentation or source code\
    \ and get it. If you didn't, the compiler wouldn't warn you and your program would\
    \ likely crash.\n\n+   - Originally\n\nThe name \"lint\" itself comes from catching\
    \ dubious constructs in your programs is similar to how a lint trap in a clothes\
    \ dryer catches fibers that shed from clothing.\n\nFunction definitions weren't\
    \ much better:\n\n```\nchar* strncpy( dst, src, n ) // K&R function definition\n\
    \ char*dst, *src;\n{\n  // ...\n}\n```\n\nOnly parameter names were listed between\
    \ (); their declarations were given separately between the ) and (. Additionally,\
    \ if a parameter was of type int, its declaration was optional until it was the\
    \ default.\n\nFunction prototypes were adopted from C++ in C89 with one addition:\n\
    \n```\nvoid f(); // K&R: no parameter information\nvoid g( void ); // C89: zero\
    \ parameters\n```\n\nThat is, with only () it was a K&R-style declaration in that\
    \ no parameter information is given; but a function declaration (or definition)\
    \ with (void) explicitly means the function takes zero parameters. If you want\
    \ to write code that means the same thing in versions of C prior to C23, use (void)\
    \ for function declarations and definitions that have zero parameters.\n\n+  \
    \ - For inter-language compatibility, C++ also adopted (void) to mean zero parameters\
    \ even though () has always meant in C++.\n\nPrior to C23, K&R-style function\
    \ declarations and definitions were still legal to remain backwards compatible.\
    \ Finally, 34 years after function prototypes were adopted into C, the C committee\
    \ removed the ability to define and functions in K&R style.\n\n> †Lint, a C Program\
    \ Checker, Stephen C. Johnson, Computer Science Technical Report, 78, Bell Laboratories,\
    \ Murray Hill, New Jersey, July 6, 1978."
