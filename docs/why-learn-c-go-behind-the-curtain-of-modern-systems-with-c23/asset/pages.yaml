  md: "# 2.12 Choosing an Appropriate Integer Type\n\nAssuming 32-bit integers, max\
    \ = 2^{32-1} - 1 = 2147483647, hence min = -2147483648. The absolute value of\
    \ min = 2147483648, that one’s greater than max which means can’t be represented\
    \ by int. There is no perfect solution for this, but what you can do is avoid\
    \ the undefined behavior:\n\n```\nint abs( int n ) {\n    return n < 0 ? - (unsigned)n\
    \ : // no UB\n}\n```\n\nCasting (§3.3) to unsigned integer eliminates the undefined\
    \ behavior before overflow (and underflow) for unsigned is well-defined, specifically\
    \ a value will “wrap around,” i.e., max + 1 = 0 and 0 - 1 = max.\n\nUnary — can\
    \ be applied to unsigned types (§3.3). In the case of INT_MAX, abs returns -2147483648.\
    \ Since it’s negative, it’s obviously wrong (again, there is no perfect solution),\
    \ but at least avoids the undefined behavior.\n\n# 2.12 Choosing an Appropriate\
    \ Integer Type\n\nWhen Ritchie created C, he made int the default type. The size\
    \ (number of bits) of an int was deliberately not specified. Standard, all that\
    \ was guaranteed when C was a bit of space, a minimum size. The rationale was\
    \ that the size of int should be the “natural” (most efficient) size for an integer\
    \ on a given CPU.\n\nIf you needed smaller signed integers and wanted to save\
    \ a bit of space, Ritchie gave us short; or, if you needed bigger integers, he\
    \ gave us long. (C99 gave us bigger integers with long long.) If you only needed\
    \ unsigned integers, you could include unsigned in a declaration. C99 also gave\
    \ us specific-size signed type aliases (e.g., int32_t) and unsigned type aliases\
    \ (e.g., uint32_t).\n\nHowever in programming, negative integers (thus requiring\
    \ a signed integer type) aren most of the time. The length of strings, count of\
    \ objects, size of files, etc.—are all unsigned. Specific-size type aliases are\
    \ even less than signed integers.\n\nA lot of C code uses integer types improperly.\
    \ Such code can convey undersized or misleading information to programmers (including\
    \ yourself in several months’ time). It’s best to choose the right integer type\
    \ for the purpose. Here are guidelines for choosing an integer type:\n\n+   *\
    \ When representing a count of bytes in memory, use the size_t standard type alias\
    \ (§2.9). This type is used by the C standard libraries, e.g., by memcpy, strlen,\
    \ etc. (§B.2), so there’s plenty of precedent.\n* When representing either the\
    \ size or a position within a file on disk, use the off_t POSIX type alias (if\
    \ available)."
