    \ 5.10 goto\n\nThe goto statement is of the form:\n\n```\ngoto label;\n// ...\n\
    label: statement\n```\n\nwhere label is an identifier followed by a : preceding\
    \ a statement. A goto unconditionally goes to the statement with the given label\
    \ (that may be either before or after the goto). A goto is useful in a few situations:\n\
    \n+   - When going to error-handling code as shown in listing 1.3 (p.27).\n- When\
    \ similarly going to shared cleanup code.\n- When inside a nested loop, to break\
    \ out of all loops.\n- To break out of a loop within a switch as shown in listing\
    \ 5.3.\n\n```\nfor ( int i = 0; i < n; ++i ) {\n  switch ( s[i] ) {\n    // ...\n\
    \    case '?':\n      goto done; // break out of \"switch\" and \"for\"\n  }\n\
    done:\n;\n```\n\n**Listing 5.3:** goto out of a loop from within switch\n\nA few\
    \ notes about labels:\n\n+   - Labels are local to functions, so labels with the\
