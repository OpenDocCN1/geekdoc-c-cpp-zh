  md: "# 12.1 Output\n\n# 12.1.1 Formatted Printing\n\nThe standard function printf\
    \ and related functions all use a format string that is composed of zero or more\
    \ directives where a directive is either:\n\n+   - A sequence of ordinary characters\
    \ (not containing %) that are copied verbatim to the output.\n- A sequence of\
    \ characters containing one or more conversion specifications starting with %\
    \ of the form:\n\n```\n%[flags][width].[precision][size]specifier\n```\n\nEach\
    \ specification results in fetching two or more subsequent arguments. The type\
    \ of each argument (after default conversions, §9.11.1) must correspond with the\
    \ type given by its associated conversion specifier. Some compilers will you (§18.7)\
    \ if the two disagree.\n\nThe components comprising a conversion specification\
    \ are:\n\n+   - flags: Zero or more of:\n    - # Print in “alternate form.”\n\
    \    - Left-pad with 0.\n    - Left-align.\n    - (space) Space before positive\
    \ number.\n    - + Insert thousands separators for diu ur or integer part for\
    \ FF.\n\n+   - width: A digit string specifying the minimum width. If the converted\
    \ value has fewer characters, it will be padded with spaces (or if the 0 flag\
    \ was given) on the left (or right if the flag was given) to fill the field width.\n\
    - precision: A . (decimal point) followed by an optional digit string. If omitted,\
    \ precision is taken as zero.) For the following specifiers, precision means:\n\
    \n```\nbBdiouxx Minimum number of digits to print.\naAeEfffFF Number of digits\
    \ to print after the decimal point.\ngG Maximum number of significant digits.\n\
    s Maximum number of characters to be printed.\n```\n\n+   - size: The size of\
    \ the argument (similar to §2.5.1) and precedes a specifier in table 12.1 (p.\
    \ 183). The following modifiers are valid for the specifiers shown and expect\
    \ an argument of the given type:"
