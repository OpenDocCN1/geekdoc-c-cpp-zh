    \ array:\n\n```\n#define ARRAY_SIZE(ARRAY) \\\n    (sizeof(ARRAY) / sizeof(ARRAY[0]))\n\
    ```\n\nUnlike C macro, when defining a function-macro, the ( that follows the\
    \ macro’s name must be adjacent, i.e., not have any whitespace between them. (If\
    \ there is whitespace between them, then it's an object-like macro where the first\
    \ character of the replacement list is).\n\n# 8.7.1 Parameters\n\nMacro parameters,\
    \ when used within the replacement list, invariably should be enclosed within\
    \ parentheses. Additionally, if the replacement list is an expression, all of\
    \ it should be enclosed within parentheses as well. For example:\n\n```\n#define\
    \ MAX(X,Y) ( X ) > ( Y ) ? ( X ) : ( Y )\n```\n\nWhy? Because substitution can\
    \ result in undesired operator precedence (§3). Suppose MAX were instead defined\
    \ like:\n\n```\n#define BAD_MAX(X,Y) X > Y ? X : Y\n```\n\nthen called like:\n\
    \n```\nint max = BAD_MAX( n & 0xFF, 8 );\n```\n\nThe problem is the precedence\
    \ of the operators >, &, ?, :, so it would be as if:\n\n```\nint max = n & ((0xFF\
    \ > 8) ? n & 0xFF : 8);\n```\n\nthat very likely isn’t what you want.\n\n# 8.7.2\
    \ Arguments\n\nA macro argument can be any sequence of tokens, not only identifiers\
    \ (like n) or valid expressions (like ++i), for example:"
