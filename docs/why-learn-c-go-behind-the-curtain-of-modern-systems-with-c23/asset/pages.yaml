    \ listing 10.9.\n\n```\nstruct islist {\n    struct islist *next;\n    alignas(max_align_t)\
    \ char data[];\n};\n```\n\n**Listing 10.9:** Intrusive singly linked list structure\n\
    \nTypically, with a flexible array member serves as a \"header\" for a larger\
    \ region of memory, perhaps containing a binary file read from disk. It's usually\
    \ up to your code to remember how big the array is. (This can, of course, be stored\
    \ in a member that precedes the array in the structure).\n\nIn this case, unlike\
    \ the list structure shown in listing 6.2 (p. 86), the user-supplied data is stored\
    \ with the list node rather than as a pointer to it (hence intrusive). The alignas(4.8)\
    \ max_align_t (§2.9) is necessary to ensure that whatever data is stored is properly\
    \ aligned.\n\nGenerally, intrusive data structures have the following advantages:\n\
    \n+   - No separate memory allocation for the data is needed.\n- No extra space\
    \ is needed for the pointer to the data.\n- Accessing the data is faster since\
    \ it's most likely on the same cache line as the node itself.\n\n> When data is\
    \ read from memory, it's actually read into cache memory first under the reasonable\
    \ assumption that data accessed once will be accessed again shortly. Additionally,\
    \ rather than reading only a single byte, an entire chunk — a cache line — of\
    \ memory is read that contains not only the sought after byte, but the surrounding\
    \ bytes as well as the reasonable assumption that nearby data will likely be accessed\
    \ shortly. (This is why arrays are faster than linked lists and intrusive data\
    \ structures are faster than pointers to data.) The size of cache lines varies\
    \ by CPU, but are typically of 32, 64, or 128 bytes.\n\nIntrusive data structures\
    \ also have the following disadvantages:\n\n+   - If you already have a pointer\
    \ to the data, inserting it requires that the data be copied in, not simply copying\
