    # 14.3 “Atomic”


    When doing multithreaded programming, you''ll hear the term *atomic* used. What,
    exactly, is meant by “atomic” anyway? There are three related, distinct, means-


    +   1. A value operation (read or write) completes with no possible intervening
    oper-ation by another thread, writing simple-byte-values on any CPU, or 16- or
    32-bit values on a 32-bit CPU, or 64-bit values on a 64-bit CPU.

    2. An updated value is visible to every CPU.

    3. Multiple value operations complete with no possible intervening operation by
    another thread, e.g., updating A and B *together* (“transactional”).


    "Atomic” always means #1; it usually means #2; or all three.


    # 14.3.1 A Bad Example


    Consider the code in listing 14.2 where the main thread creates another. Both
    threads run so long as `shutdown` remains false. To shut, the main thread sets
    `shutdown` to `true`. In response, while loops will exit and the main thread will
    join the other thread. Unfortunately, the code is wrong.


    +   - More unfortunately, I’ve seen such code in production.


    It’s because shutdown is shared among threads improperly. Some programmers mistakenly
    think this along the lines of:


    > It''s only a *bool*, a single byte, *of course* it’s thread-safe because you
    can''t read or write *half* a byte, so it must be atomic.


    The problem is that, while that’s actually true, it’s insufficient. A *bool* is
    atomic *only* by meaning #1; it’s not atomic by meaning #2. That is, just because
    a *bool* is updated by one thread does *not* mean updated value is *visible* to
    other threads (running on other CPUs).'
