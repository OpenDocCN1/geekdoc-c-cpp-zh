  md: '# 22.5 Wrong Uses


    In C, volatile:


    +   * Is *not* a synonym for _Atomic ($\$17).

    * Does *not* use memory barriers ($\$17.3).

    * Therefore, does *not* guarantee thread-safety.

    * Limits *only* what optimizations the compiler may do ($\$14).

    * Does *not* limit what the CPU can do ($\$14).


    In particular, the hardware is still free to do things like memory caching, instruction
    parallelization, and speculative execution.


    # 22.6 Epilogue


    Here are some key points about some advice for volatile:


    +   * volatile is used *only* for memory-mapped I/O, signal handlers, or with
    setjmp.

    * Unless you''re doing one of those things, do *not* use volatile.

    * volatile is syntactically a qualifier like _Atomic, const, and restrict.

    * For pointers, the pointer, the object pointed to, or both, can be volatile.'
