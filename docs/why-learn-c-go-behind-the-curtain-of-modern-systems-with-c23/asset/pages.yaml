  md: '# 9.4.5 Multidimensional VLA Parameters


    Multidimensional array syntax for parameters can be used for VLAs. For example,
    a declaration for a function that prints a matrix of m × n integers as rows of
    comma-separated values might be:


    ```

    void print_mcsi( size_t m, size_t n, int vals[m][n] );

    ```


    The compiler writes only the first dimension as a pointer, so the above really
    is:


    ```

    void print_mcsi( size_t m, size_t n,

    int const (*vals)[n] );

    ```


    hence vais is a pointer to a VLA of n ints. In this case, the VLA is actually
    a useful feature since n allows the compiler to know the length of each row of
    the array. Additionally, sizeof (the first one) once again becomes a run-time
    operator:


    ```

    size_t size = sizeof *vals / sizeof ** // size = n

    ```


    Unlike VLAs in general, VLAs used for function parameters are safe since the actual
    arrays passed to the function are (and often) normal arrays:


    ```

    int matrix[10][20] = { /* ... */ };

    print_mcsi( 10, 20, matrix );

    ```


    There’s no VLA being created at run-time here, so it can not overflow the stack.
    When declaring (as opposed to defining) functions, C allows you to omit the parameter
    names; however, if you do that, there’s no name to the size of a VLA; but C has
    a special syntax for this case:


    ```

    void print_mcsi( size_t m, size_t n, int const[][][] ); // err

    void print_mcsi( size_t m, size_t n, int const[*][* ); // OK

    ```


    That is, use * to denote a VLA of an unnamed size. Since the first dimension is
    always converted to a pointer, the * is needed only starting with the second dimension:


    ```

    void print_mcsi( size_t m, size_t n, int const[][][] ); // same

    ```


    Hence, you never need * when using single dimension array syntax.'
