  md: '# 84


    # 6 Arrays and Pointers


    The array1 is initialized with explicit values. If the number of values is less
    than the size of the array, the remaining elements are initialized to zero or
    equivalent. If the number of explicit values equals the size of the array that
    you want, you can omit the size as done for array2 and the compiler will count
    the elements for you. A special case, arrays of char can be initialized with string
    literals as was done for array3.


    Alternatively, you can use designated initializers, that is use a non-negative,
    integer index surrounded by [i] and followed by ] to initialize specific values:


    ```

    int a[9] = { [3] = 1, [4] = 2, [5] = 3 };

    ```


    The array has elements 3, 4, and 5 initialized to 1, 2, and 3, respectively, and
    the remaining elements are initialized to zero. Designated initializers can be
    given in any order.


    # 6.3 Array Indexing


    As first shown in listing 1.4 (p.10), an array element is accessed by appending
    [i] (\$3.11) where i is an integer expression that specifies the offset of the
    desired element.


    Unlike many other languages, C doesn''t bounds checking, meaning it doesn''t check
    at run-time if i is within the "bounds" 0 to n-1 where n is the declared size
    of the array. Accessing an element outside its bounds results in undefined behavior
    (\$15).


    +   Not doing bounds checking is an instance of the compiler assuming you know
    what you''re doing. Bounds violations can be a source of bugs (\$18.6.1).


    +   Why not do bounds checking? It takes time, especially in loops. Not doing
    bounds checking is another way C achieves its speed. In cases where you know the
    bounds are correct, why checking?


    # 6.4 Multidimensional Arrays


    Like other programming languages, C supports multidimensional arrays (aka, matrices).
    Unlike some other languages, C uses one pair of [] per dimension. For example,
    to declare a 3 x 2 array of:


    ```

    double a2d[3][2]; // not: a2d[3,2]

    ```'
