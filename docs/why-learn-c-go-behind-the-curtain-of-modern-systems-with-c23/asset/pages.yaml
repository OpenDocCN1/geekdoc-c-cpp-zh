  md: "# 17.3.4 memory_order_consume\n\nConsume is a special case of acquire that\
    \ allows operations to dependency-ordered that can be more performant on weakly-ordered\
    \ CPUs.\n\n+   - A weakly-ordered CPU (a weak memory model) is one where one core\
    \ can see changes in memory in a different order than another core wrote them\
    \ as is happens via relaxed($17.3.2). Weakly-ordered CPUs include those from Apple\
    \ (e.g., A and M Series), ARM (e.g., Neoverse Series), and IBM (e.g., PowerPC);\
    \ but not Intel (e.g., x86).\nWeakly-ordered CPUs are simpler to design, implement,\
    \ use less power (for mobile applications), and allow for a higher degree of parallelism\
    \ (performance) because independent memory operations are uncontrolled by a trained\
    \ order. The caveat is the burden of ensuring memory operations are correct shifts\
    \ to the programmer.\n\nIn contrast, a strongly-ordered CPU (a strong memory model)\
    \ is one where every core sees changes in memory in the same order than another\
    \ core wrote them. Strongly-ordered CPUs include those from Intel (e.g., x86).\
    \ The advantage (for programmers) is that the burden of ensuring memory operations\
    \ shifts to the CPU designer.\n\nFrom the previous example:\n\n```\nstruct islist\
    \ *work_list; // listing 10.9, p. 163\nbool _Atomic work_avail;\n```\n\nThere's\
    \ no actual dependency between work_list and work_avail other than what's in our\
    \ minds — the compiler has no way to know. To create an actual dependency that\
    \ the compiler can use to keep things in dependency order, we can use the following\
    \ declaration for work_avail instead:\n\n```\nstruct islist *_Atomic work_avail;\n\
    ```\n\nUsing that, a producer can prepare work by doing:\n\n```\nwork_list = islist_push(work_list,\
    \ sizeof(char*));\n*(char**)islist_peek(work_list) = path;\natomic_store_explicit(&work_avail,\
    \ work_list, memory_order_release);\n```\n\nand a consumer can wait for and receive\
    \ work by doing:\n\n```\nwhile (!atomic_load_explicit(&work_avail, memory_order_consume\
    \ ))\n  // wait\nchar *const path = *(char**)islist_peek(work_avail);\n```"
