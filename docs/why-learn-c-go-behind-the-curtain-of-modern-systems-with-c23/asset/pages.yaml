    explained well elsewhere, if at all:


    +   15. **Undefined Behavior:** Covers what undefined behavior is, why it exists,
    and how optimization can make it worse.


    +   16. **Assertions:** Covers the assert macro for writing bug-free programs,
    a sample implementation, assertions vs. errors and exceptions, use in production
    code, adding a message, and `static_assert`.


    +   17. **Atomic:** Covers the `_Atomic` keyword as an alternative to a mutex,
    atomic library functions, memory barriers, compare-and-swap, lock-free operations,
    the “ABA Problem,” versioned pointers, and false sharing.


    +   18. **Debugging:** Covers debugging programs, printing values, how optimization
    affects debugging, core dumps, signals, common bugs, warnings, profiling, and
    a case study of a particularly bizarre bug and how it was fixed.


    +   19. **Generic:** Covers the `_Generic` keyword, its motivation, using it to
    do const overloading, static if, and implement type traits.


    +   20. **setjmp and longjmp:** Covers the `setjmp` and `longjmp` standard functions
    for doing non-local gotos and their relationship to volatile variables.


    +   21. **restrict:** Covers the `restrict` keyword, the problem it solves, pitfalls
    and when to use it.


    +   22. **volatile:** Covers the `volatile` keyword, optimization suppression,
    signal handling, use with `setjmp`, and wrong uses.'
