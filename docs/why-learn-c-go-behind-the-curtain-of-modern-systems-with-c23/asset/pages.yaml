    # # 8.18 Epilogue


    Here are some key points about and advice for the preprocessor:


    +   - The preprocessor "preprocesses" source files before they’re compiled.


    +   - A directive is to the preprocessor that a statement is C.


    +   - Directives are line-based and begin with # and end with an end-of-line unless
    escaped by a \


    +   - The #define directive is used to define either object-like or function-like
    macros.


    +   - The preprocessor pre-defines several object-like macros that reflect the
    current compilation environment including macros for the current file, line, whether
    the compiler is C or C++, and whether language features are supported.


    +   - The #if and related directives can be used to compile conditionally based
    on the compiler, operating system, CPU architecture, whether certain features
    are enabled or features are available, and many others.


    +   - #include directive is used for file inclusion.


    +   - Function-like macros can have parameters, are similar to C functions, and
    are useful to do things like reduce boilerplate code or hide ugly implementation
    details.


    +   - Function-like macros can also take a variable number of arguments.


    +   - The preprocessor has the operators of # (stringification) and ## (concatenation).'
