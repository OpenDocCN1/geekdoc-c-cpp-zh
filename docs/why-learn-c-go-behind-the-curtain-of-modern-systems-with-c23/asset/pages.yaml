  md: '# 14.9 Epilogue


    Here are some key points about and some advice for multithreading:


    +   - Always join every thread you create. Don''t detach threads.

    - Even single-byte types like bool are not atomic in the sense that matters.

    - Even simple operations like increment or decrement are not atomic in any sense.
    The compiler may generate several assembly language instructions for even a trivial
    C statement that, together, are not atomic.

    - Do not think for one second that volatile has anything to do with thread-safety.

    - To make accessing variables thread-safe, use mutexes.

    - Always lock a mutex for the shortest time possible.

    - To avoid a deadlock, don''t lock more than one mutex at a time on the thread.
    But if you must, always lock them in the same order and unlock them in the reverse
    order.

    - If available, do not use recursive mutexes.

    - Use condition variables to communicate among threads.

    - Always use a while when checking a condition.

    - If you need to do something exactly once, use call_once.

    - If you need to have different data per thread, use thread_local. If you need
    that data automatically cleaned-up, use thread-specific storage.


    # Exercises


    +   1. Write a function:


    int mtx_unlockall( size_t n, mtx_t *mtx[n] );


    that''s the opposite of mtx_unlockall from listing 14.6 (p. 225), i.e., it unlocks
    all the mutexes in the mtx array and returns thrd_success only if all mutexes
    were unlocked successfully or thrd_error if one or more mutexes could not be unlocked.

    2. mtx_timedlock requires an absolute time, write a function:


    int mtx_durtimedlock( mtx_t *mtx,

    struct timespec const *duration );


    takes a duration and returns the same values as mtx_timedlock.'
