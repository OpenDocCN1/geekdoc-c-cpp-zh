    may use any of C''s operators (#) except case (#3.14). It can''t reference C types,
    constants, variables, or functions. If const-expr references object-like macro
    that has not been defined, it is as if it were defined to 0.


    In addition to #if and #else, there are few variants as shown in table 8.2.


    # Table 8.2: Preprocessor #if and #else directive variants


    | This ... | Is as if ... |

    | --- | --- |

    | #ifname | #if defined name |

    | #ifndef name | #if !defined name |

    | #elif | #else |

    | #elifdef | #else #ifdef |

    | #endif | #else #endif |


    The reason variants exist is because you can''t actually put multiple directives
    on the same line (but you could easily put them on the next line). The #elif variants
    don''t offer any additional functionality; they only make a bit more concise.
