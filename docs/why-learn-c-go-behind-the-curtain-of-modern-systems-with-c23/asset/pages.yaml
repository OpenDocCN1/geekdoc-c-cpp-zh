  md: "# 5.6 for\n\nAs first shown in listing 1.5 (p.12), the for statement is a generalization\
    \ of a while statement and is of the form:\n\n```\nfor ( init-expr_optr; cond-expr_optr;\
    \ next-expr_optr )\n  statement\n```\n\nwhere:\n\n+   1. The init-expr performs\
    \ any initialization once before the loop. Optionally, it can also declare the\
    \ variables it's initializing. The scope of such variables are limited to the\
    \ loop's body.\n2. The cond-expr is the same as in a while statement.\n3. The\
    \ next-expr performs any steps necessary to go to the next iteration of the loop.\
    \ It is performed after the last statement in the loop body or a continue (§5.7\
    \ statement.\n\nA for statement is roughly equivalent to:\n\n```\ninit-expr;\n\
    while ( cond-expr ) {\n  statement\n  next-expr;\n}}\n```\n\nbut concise. All\
    \ expressions are optional, but the ; must remain. If cond-expr is omitted, it's\
    \ equivalent to true, hence the following is another idiomatic way to write an\
    \ infinite loop:\n\n```\nfor (;); // infinite loop\n  statement\n```\n\n# 5.7\
    \ break and continue\n\nThe break statement simply breaks out of any loop or switch\
    \ (§5.8) statement, for example:\n\n```\nfor (;); {\n  //...\n  if ( cond-expr\
    \ )\n    break;\n}\n```\n\nAs first shown in listing 1.4 (p.10), the continue\
    \ statement jumps back to the start of a loop. It's equivalent to a goto (§5.10)\
    \ to a label at the end of the loop:"
