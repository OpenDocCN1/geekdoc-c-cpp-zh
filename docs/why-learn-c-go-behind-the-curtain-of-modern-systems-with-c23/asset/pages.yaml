    They may be applied to integer($2.5) or enumeration($7) types.

    The & operator is used to "mask off" bits (force them to 0) or find the conjunction

    of two sets of bits (a bit in the result will be 1 only if the corresponding bit
    in both

    operands is 1). For example, to ensure c is 7-bit ASCII, we can mask off all the

    lower 7 bits:


    ```

    lower_7 = c & 0b0111111; // ensure 7-bit ASCII

    ```


    The | operator is used to force 1 or find the disjunction of two sets of bitsn(a
    bit in the result will be 1 only if the corresponding operand is 1).

    Unlike the && and | logical operators($3.6) that short-circuit evaluation, both

    operands of & and | are always evaluated, but in an unspecified order. Additionally,

    the precedence of & and | is unfortunately too low, specifically lower than ==
    =

    !. This means that (!) are invariably fixed. For example, from listing 1.5 (p.12):


    ```

