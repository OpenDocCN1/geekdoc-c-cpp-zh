  md: "# Chapter 26\nDynamic Dispatch\n\nDynamic dispatch means to select which function\
    \ is called at run-time based on the type of some object (aka, polymorphism).\
    \ It’s one of the defining traits of object-oriented programming. Different languages\
    \ that support dynamic dispatch, such as C++, C#, Go, Java, Python, Smalltalk,\
    \ Rust, and Swift, implement it differently, each with its own trade-offs. C doesn’t\
    \ support dynamic dispatch directly, but you can implement it in the style of\
    \ any programming language that supports it.\n\nRecall the token structure from\
    \ listing 11.1 (p.171). A simple example would be to have a function that prints\
    \ a token’s value no matter what type it is as shown in listing 26.1.\n\n```\n\
    void token_print(struct token *t) {\n    switch (t->kind) {\n        case TOKEN_INT:\
    \ printf(\"%ld\", t->i); break;\n        case TOKEN_FLOAT: printf(\"%lf\", t->f);\
    \ break;\n        case TOKEN_CHAR: printf(\"%c\", t->c); break;\n        case\
    \ TOKEN_STR: printf(\"%s\", t->s); break;\n    }\n}\n```\n\n**Listing 26.1:**\
    \ Simple dynamic dispatch\n\nWhile that is dynamic, it’s fairly restrictive. Why\
    \ Suppose you want the option to print tokens in different ways, e.g., integers\
    \ in hexadecimal or binary, or with separators; floating-point numbers in exponent\
    \ form. You could add members to token to store all those options and make token_print\
    \ take them all into account when printing. The caveats are that all tokens would\
    \ have additional data when only some need it and that printing options are restricted\
    \ to what you thought of in advance."
