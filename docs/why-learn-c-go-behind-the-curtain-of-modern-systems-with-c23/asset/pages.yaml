    The & | bitwise operators are confusingly similar to the && and | log-operators.
    In B (the grandparent of C), the & and | operators performed

    both logical and bitwise operations depending on context. Ritchie believed

    this "overloading" was difficult to explain and use, so he introduced && and

    || for the logical operators.


