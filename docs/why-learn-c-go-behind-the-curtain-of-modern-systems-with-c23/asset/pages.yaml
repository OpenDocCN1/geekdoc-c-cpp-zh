    # Table 12.1: printf conversion specifiers


    +   aA double Floating-point in the form [-]0x.h*pd where there is one digit before
    the decimal point and precision digits after. The exponent is a + - followed by
    a decimal number for an exponent of 2. For a, uses 0x, A-F, and p instead. Also
    note 1.


    +   bB unsigned For b, unsigned integer. If the flag is specified, it is prepended.
    For b, uses 0b instead.


    +   c int Signed decimal integer where precision (if any) specifies the minimum
    number of digits to print. If the converted value has fewer digits, it''s padded
    on the left with zeros.


    +   eE double Floating-point in the form [-]d.dE where there is one digit before
    the decimal point and precision digits after it. For E, uses E for the exponent
    that always contains at least two digits. Also note 1.


    +   ff double Floating-point in the form [-]d.d* where precision specifies the
    number of digits after the decimal point. Also note 1.


    +   gG double Similar to o or f (g) or r or F (G). E is used if the exponent conversion
    is -4 or ≥. Trailing zeros are removed from the fraction of the result. A decimal
    point is printed only if at least one digit. The precision specifies the number
    of significant digits. If omitted, digits are set to 0; if i, it''s treated as
    1.


    +   n int* The number of characters written so far is stored into the int* (or
    pointer type size) being pointed to by the argument.


    +   o unsigned Unsigned integer. If # flag is specified, increases precision by
    1 to force a leading zero to be printed.


    +   p void* Pointer as a hexadecimal integer as if %#x or %#1lx were given.


    +   s char* String.


    +   u unsigned Unsigned decimal.


    +   x unsigned For unsigned hexadecimal using a-f. If the # flag is specified,
    0x is prepended. For x, uses 0x and A-F instead.


    +   % Literal %.


    # 12.2 Files


    While reading standard input and writing to standard output is sufficient for
    many smaller programs, larger programs often need to read from multiple or write
    to specified names on disk.


    +   A filesystem (FS) is the way bytes are organize files and directories on a
    "storage device.\ Storage devices include spinning hard disks (HDDs), solid-state
    disks (SSDs), RAM disks, DVDs, and (going way back) floppy disks. Typically, "disk"
    is used to mean any of them.'
