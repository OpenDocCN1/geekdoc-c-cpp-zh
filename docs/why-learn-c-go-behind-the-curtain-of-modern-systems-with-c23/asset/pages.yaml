  md: '# # Chapter 25

    Maps


    ![](img/3351c1095f7fa1e1a549dc9b17ad7247_345_0.png)


    A map is a data structure that “maps” keys to values, that is, given a key, you
    can find its associated value, if one exists. A map has two primary operations:
    *insert* and *find*; it may also have a third operation of *delete*. Operations
    in general have both average and worst-case running times as a function of the
    number of elements in a map, n, given in “big O” notation.


    While there are many uses of and choices for implementation, one way to decide
    on an implementation is whether iterating over the keys is:


    +   - **Ordered**: Keys are iterated in sorted order. Items must be lessthan-comparable.
    This kind of map is typically implemented using a balanced binary tree that ensures
    the path to the root leaf is approximately the same length. The operations *insert*,
    *find*, and *delete* all run in $O(\log n)$ time in the average and worst cases.
    C++ has map; Java has TreeMap; Rust has BTreeMap.


    +   - **Unordered**: Keys are iterated in an arbitrary order. Items must be hashable
    and at least equality-comparable. This kind of map is typically implemented using
    a hash table, *hash map*, for which the *insert*, *find*, and *delete* all run
    in $O(1)$ time in the average case and $O(n)$ time in the worst case. C++ has
    unordered_map; Go has map; Java and Rust have HashMap; Python has dict.


    Hence, if you don''t need to iterate keys at all or if you don''t care about the
    iteration order, an unordered map is the better choice — provided you can hash
    and equality-compare keys, and choose a good hash function (§25.1).


    Unlike most modern languages, C has no standard map, if you want one, you have
    to implement it yourself. In this chapter, we''ll use a hash table to implement
    a map.'
