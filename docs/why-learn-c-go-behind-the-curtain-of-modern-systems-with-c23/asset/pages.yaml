  md: "# 9.4 \"Array\" Parameters\n\nAnother quirky feature of C is that the use of\
    \ [] for function parameters is just syntactic sugar the compiler rewrites such\
    \ parameters as pointers. It's as if you declared the function as:\n\n```\nvoid\
    \ print_csi( size_t n, int const *vals); // reality\n```\n\nIn fact, you can do\
    \ so explicitly with no meaning. Hence, despite appearances, array parameters\
    \ do not exist in C.\n\n+   Array syntax for parameters in C is a \"living fossil\"\
    \ of how pointers are declared in New B (the parent of C).\n\nAs mentioned in\
    \ 6.7, the name of an array in an expression \"decays\" into a pointer to its\
    \ first element. This happens for function arguments just the same.\nIn the definition\
    \ of print_csi shown in listing 9.1, every array syntax of [] or pointer syntax\
    \ of * can be used regardless of which was used in the declaration. This works\
    \ because, as also mentioned in 6.7, the a[i] syntax is syntactic sugar for *(a+i).\n\
    \n```\nvoid print_csi( size_t n, int const *vals ) {\n  if ( n == 0)\n    return;\n\
    \  printf(\"%d\", vals[0]);\n  for ( size_t i = 1; i < n; ++i )\n    printf(\"\
