    # 13.2 Opaque Types


    As an alternative to putting structure definitions in headers, you can put only
    declarations; the definitions are put into .c files. For example, instead of defining
    thenentire string structure, you only declare that string is a structure:


    ```

    struct string;                // "string" is a struct (no details)

    ```


    This is known as an opaque type (aka, incomplete type). C allows pointers to such
    structures exactly the same as pointers to defined since all pointers are the
    same size (on modern computers). The advantages of opaque types include:


    +   + Prevents programmers from “cheating” by accessing members they shouldn’t,
    i.e., undocumented members or members defined as private. If programmers cheat,
    making changes to members can break programs.

    + Adding or removing members does not require that any dependent code be recompiled
    providing binary compatibility. This is especially important for libraries since
    it allows updated versions to be “drop-in” replacements for older versions.

    + That means fewer dependencies between files that translates into both fewer
    and faster recompilations.


    The disadvantages of opaque types include:


    +   - All objects of an opaque type in user code must be dynamically allocated
    and deallocated that is less efficient than objects on the stack.

    - Doing anything with an opaque type requires non-inline functions that are slower
    than either simply accessing members directly or using inline functions (§9.10).'
