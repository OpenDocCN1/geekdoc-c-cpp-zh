  md: '# 10 Structures


    ```

    bool const old_const = fmt->cif_const;

    fmt->cif_const = true;

    // ...

    fmt->cif_const = old_const;

    ```


    The compiler would generate assembly instructions that includes shifts and a mask
    (S3.8) necessary to extract the bit for cif_const as if the code were (assuming
    a big-endian CPU):


    ```

    bool const old_const = (fmt->cif_const >> 3) & 1;

    // ...

    fmt->cif_const |= old_const << 3;

    ```


    For example, if *fmt were 0b01001''1000, setting old_const would require a shift
    to yield 0b00001 and a mask to yield 0b00000. Hence, the compiler would generate
    code that does what you would have done manually using bit-flags for enumerations.
    In this particular case, copying the entire structure would generate fewer assembly
    instructions because copying a by-is doesn''t require shifts or masks:


    ```

    struct c_int_fmt old_fmt = *fmt;

    // ...

    *fmt = old_fmt;

    ```


    A few notes about bit-fields:


    +   - The type must be one of bool, unsigned int, signed int, int, _BitInt(n),
    or unsigned _BitInt(n).

    - Plain int when used for a bit-field does not imply signed as it normally does.
    Instead, it''s implementation defined whether it''s signed or unsigned like char.

    - The number of bits specified must be ≤ the number of bits comprising the type.

    - The endianness (S3.14.3) of the bits is implementation defined.

    - Whether bit-fields may straddle a word boundary is implementation defined.

    - Accessing more than one bit-field of the same structure concurrently in a multi-threaded
    program results in a data race (§15).

    - If the member name is omitted, the bits are used for padding. If the number
    of bits is 0, it means the next bit-field member will start at a word boundary.


    The other use for bit-fields is when you have to conform to a memory layout for
    specific hardware or a protocol. For example, listing 10.12 shows the layout for
    the R6000 CPU physical page number structure. Line 3 shows an example of a padding
    bit-field.'
