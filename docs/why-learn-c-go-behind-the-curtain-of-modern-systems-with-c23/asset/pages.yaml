    # 16.6 Epilogue


    Here are some key points about and some advice for assertions:


    +   - Use assert to check for invalid conditions and abort your program in a controlled
    way.

    - Ensure that assertions do not cause side-effects:


    ```

    assert( --count > 0 ); // No!

    ```


    Why not? Because assertions are disabled, the statement doesn''t happen at all.
    In some cases, you might need to add to a variable to assert on:


    ```

    bool colors_ok = colors_parse();

    assert( colors_ok );

    ```


    Doing so, however, can cause "unused variable" warnings when assertions are added.
    To fix this, add the maybe_unused attribute ($4.9.3):


    ```

    [[unused]] bool colors_ok = colors_parse();

    assert( colors_ok );

    ```


    +   - Do not assert to validate input from a human (e.g., via keyboard), machine
    (e.g., via socket) or file — even trusted humans, machines, or files. Your program
    should not crash because a human made a typo or you received or read corrupted
    or unexpected input.


    +   - In assertion conditions, you should use && 0 && n < N_MAX to join unrelated
    expressions:


    ```

    assert( n > 0 && n < N_MAX ); // OK

    assert( n > 0 && p != nullptr ); // Meh

    ```'
