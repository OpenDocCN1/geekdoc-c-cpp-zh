  md: '# # Chapter 13

    Program Organization


    For all but the most trivial programs, a typical C program is composed of several
    source (.c) files and header (.h) files. For example, the source files of ad¹
    are:


    ```

    ad.c color.h match.c options.h unicode.c util.h

    ad.h dump.c match.h pjl_config.h unicode.h

    color.c dump_c.c options.c reverse.c util.c

    ```


    Often, .c and .h files come in pairs where the .c implements functionality and
    the .h provides the “public” API for using it. All the functions comprising a
    program are spread among files with each pair specializing in some particular
    aspect of the program. One or more pairs roughly approximates a “module” in other
    languages. For example, color.c contains the definitions of functions for printing
    text in color to a terminal and its corresponding color.h contains their declarations
    so that other files may #include it to use those functions.


    # ## 13.1 Include Guards


    Compared to a proper module facility, #include (§8.6) is rather simple because
    it includes the full text of a header file as-is. In C, it’s an error to declare
    enumerations (§7), structures (§10), or unions (§11) more than once, even if the
    declarations are identical. Given that, you get “redefinition errors” when a header
    containing a declaration is included more than once. For example, color.h contains
    the declaration:


    ```

    enum color_when { // ...

    ```


