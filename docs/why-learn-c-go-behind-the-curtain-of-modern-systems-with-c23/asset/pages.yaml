    3 Operators


    # 3.17 alignof Operator


    The alignof operator is of the form:


    ```

    alignof(type) Gets alignment of type size_t ($2.9).

    ```


    It returns the minimum alignment for type in bytes as a value of type size_t ($2.9).
    Unlike other operators, alignof is a compile-time operator, that is, the compiler
    evaluates it at compile-time.


    Many CPU architectures require objects to be aligned in memory based on their
    type such that their address must be evenly divisible by their size. For example,
    an int on an x86–64 CPU is 32 bits (4 bytes) which means it can reside only at
    memory addresses divisible by 4. (For an example, see $6.13.)


    # 3.18 Epilogue


    Here are some key points and about operators for advisors:


    +   - The = is assignment and the == is equal-to.

    - The && is logical-and and the & is bitwise-and.

    - The || is logical-or and the | is bitwise-or.

    - Be mindful of operator precedence and associativity. When doubt, insert ( ).

    - Associativity is not the same as evaluation order.

    - The only operators are guaranteed to have their operands evaluated in left-to-right
    order are &&, || (conditional), and ,; for all others, the order is unspecified,
    so don''t rely on it.

    - Only && and || "short circuit" (do not necessarily evaluate both operands).

    - The precedence of & | is too low so () are invariably necessary.

    - When casting, make sure you know you are doing because the compiler assumes
    you do.

    - When casting away const, make sure the object isn''t really constant.

    - When casting pointers among very different types, endianness might matter.


