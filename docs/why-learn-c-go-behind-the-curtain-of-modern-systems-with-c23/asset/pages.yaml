  md: '# Chapter 20

    setjmp and longjmp


    Unlike C++, C#, Java, or Python, C doesn''t have exceptions. However, C has two
    functions, setjmp and longjmp, that can be used together to return through more
    than one level of the call stack, typically as an error-handling mechanism there''s
    no other way for a deeply nested function to stop and return an error.


    # 20.1 Basics


    Let''s jump (no pun intended) right in with an example given in listing 20.1.


    +   - Line 1 includes the setjmp.h standard header needed to use setjmp and longjmp.

    - Line 5 declares a global instance of jmp_buf that will be shared between the
    functions that call setjmp and longjmp.

    - In main, line 21 calls setjmp that saves a copy of the current "execution context"
    into env and returns 0 that mean "proceed normally."

    - Line 22 declares load_config that then calls read_file.

    - Now in read_file line 9, we were unable to open the file so we call longjmp
    on line 10 passing env as the first argument. The second argument can be any int
    value. It''s used to communicate a code of some kind, typically an error code.

    - The program execution "jumps" back to the exact point where the setjmp was on
    line 21 "returning" a second time with the value passed to longjmp, in this case
    1. Note that control has returned from read_file directly to main bypassing load_config.

    - Since 1 is not 0, execution transfers to the else on line 23.


    That''s it. While that doesn''t seem complicated, the devil, as ever, is in the
    details.'
  merge: -1
