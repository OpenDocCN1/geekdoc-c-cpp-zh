  md: '# Variadic Functions


    +   Notwithstanding the VA_ARGS_COUNT macro, there is no standard way to know
    how many arguments were given. (Attempting to access more arguments than were
    given in undefined behavior(§15); accessing fewer is OK.)


    +   There is no way to require that any argument of a specific type is not any
    way to require that all the arguments are of the same type.


    +   There is no way to know for certain what the type of any argument actually
    is.


    +   Because there is no type information, only default argument conversions occur:

    - signed char, unsigned char, short, and unsigned short are promoted to either
    int or unsigned int as appropriate.

    - float is promoted to double.

    - An array "decays" into a pointer to its first element (§6.7).

    - A function name is converted to a pointer to that function (§6.10).


    +   The ... must be last.


    +   When iterating over arguments via va_arg, the given type must match the actual
    type. If it doesn not, the result is undefined behavior.


    Hence, the two problems when implementing a variadic function are:


    +   1. Knowing the number of arguments or when to stop iterating over them.

    2. Knowing their types.


    The vsum implementation "solves" the first problem by using an explicit parameter
    to specify how many arguments follow. However, if you were to (without the VA_ARGS_COUNT
    macro):


    ```

    int r = vsum(3, 1, 2);      // said 3, but only 2

    ```


    that is specify that there are 3 arguments that follow are fewer, the result would
    be undefined behavior. Even if you use the VA_ARGS_COUNT macro, vsum can only
    assume the provided arguments are of type int. If you were to:


    ```

    int r = vsum(1, 2, 7, 5);      // double, not int

    ```


    provide a value of type double (or any other type) where int is expected, the
    result would be undefined behavior.


    The vstr_is_any function "solves" the first problem by using a sentinel so it
    doesn''t care how many arguments there are. But similar to vsum, it can only assume
    the provided arguments are strings and that the last argument is nullptr. If either
    of those are false, the result would be undefined behavior.


    The standard printf function (§12.1.1) "solves" both problems by using the required
    argument as the format for what to print: each % within the format is a conversion
    specification and has a one-to-one correspondence with an argument. For example,
    given:


    ```

    printf("x=%d, y=%d\n", x, y);

    ```'
