    void foo(int);   // _Z3fooi

    ```


    The prefix "z" marks the start of a mangled name followed by the length of the
    function''s name followed by the name by an encoding of its parameter types, "v"
    for void and "i" for int.


    Since C doesn''t support function overloading (§9.3), mangling isn''t necessary.
    A foo() in C is simpel. For a C++ compiler to be able to compile and link C code,
    there needs to be a way to turn off mangling while compiling declarations in header
    files (since the compiler doesn''t know they''re "C" and not C++ declarations).
    That''s what extern "C" does.


    In C++, "C" and "C++" are the only standard language linkages (though you never
    need to use "C++" explicitly since that the default). Additional language linkages
    are implementation defined. For example, IBM''s XL C/C++ compiler supports "COBOL",
    "FORTRAN", and "PLI".


    Since extern "C" is C only, such declarations will be seen only when compiling
    with a C++ compiler. The preprocessor can be used to check whether cplusplus (§8.4)
    is defined and declare EXTERN_C macro appropriately as shown in listing 13.4.
    The EXTERN_C macro can then be used on a declaration-by-declaration basis.


    ```

    #ifdef cplusplus

    #define extern "C" // compiling with C++

    #else

    #define EXTERN_C nothing // compiling with C

    #endif /* __cplusplus */

    EXTERN_C void string_puts(struct string *str, char const *s);

    EXTERN_C string_cleanup(struct string *str);

    ```


    Listing 13.4: Using extern "C" via macro


    Alternatively, and more commonly because it''s simpler, the preprocessor can be
    used to "wrap" the entire contents of a header file with extern "C" {...} as shown
