  md: 'that is the keyword union optionally followed by a tag name followed by a set

    zero or more members optionally followed by declarations of the union. As with

    structures (§10), members are in their own namespace specific to their union,
    so

    different unions can have members with the same name. Additionally, the names
    of

    unions are put into a tags namespace (§2.3). To refer to a union name, it must
    be

    preceded by union. If you forget to include it, you''ll get an error:


    ```

    value v; // error: must use "union" tag

    ```


    Alternatively, you can use typedef (§2.6) to "inject" a tag name into the surrounding

    scope so you no longer need to use union:


    ```

    typedef union value value; // inject value into scope

    value v; // no "union" needed now

    ```


    As a second alternative, you can typedef a union declaration directly:


    ```

    typedef union { // or: typedef union value {

    long i;

    double f;

    char c;

    char *s;

    } value;

    ```


    # 11.2 Initialization


    Since all members of a union have the same offset, their order mostly doesn''t
    matter

    except that the first member is the one that is initialized when an initializer
    list is

    used so the value must be the same type:


    ```

    union value v = { 1941 }; // as if: v.i = 1941

    ```


    Alternatively, you can use a designated initializer to specify a member:


    ```

    union value v = { .c = ''a'' };

    ```


    # 11.3 Union Compound Literals


    Similar to compound literals for structures (§10.4), a compound literal of a union

    is a literal or designated initializer for a member enclosed by {} (type)

    specifies the type of the union. A compound literal for a union allows you to

    specify a union “inline” and even take its address.


    The lifetime and storage classes for union compound literals are the same as

    for structure compound literals (§6.11.1).'
