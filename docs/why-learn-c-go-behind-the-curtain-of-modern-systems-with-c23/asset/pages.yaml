  md: "6.6 Pointers to Pointers\n\n# 6.6 Pointers to Pointers\n\nSince pointers are\
    \ objects like any other, pointers can also point to pointers, e.g., pointer to\
    \ pointer to int or int**. There can be any number of *, but the number of pointer\
    \ levels rarely exceeds two in practice.\n\nSimilar to the swap function in listing\
    \ 1.7 (p.17), you can use a pointer to a pointer parameter to change the value\
    \ of a pointer itself. For example, listing 6.3 implements the operations \"push,\"\
    \ \"peek,\" and \"pop\" for an slist.\n\n```\n[[nodiscard]] struct slist* slist_push(struct\
    \ slist *head,\n    void *data) {\n    struct slist *const new_head =\n    malloc(sizeof(struct\
    \ slist));\n    new_head->next = head;\n    new_head->data = data;\n    return\
    \ new_head;\n}\n\n[[nodiscard]] void* slist_peek(struct slist *head) {\n    return\
    \ head != nullptr ? head->data : nullptr;\n}\n\n[[nodiscard]] void* slist_pop(struct\
    \ slist **head) {\n    auto const head = *head;\n    if (head == nullptr)\n  \
    \      return nullptr;\n    auto const data = head->next;\n    *head = head->data;\n\
    \    free(head);\n    return data;\n}\n```\n\n**Listing 6.3:** Singly linked list\
    \ functions slist_push and slist_peek are straightforward; slist_pop needs explanation:\n\
    \n+   - Line 14 declares ahead as a pointer to an slist*, the current head of\
