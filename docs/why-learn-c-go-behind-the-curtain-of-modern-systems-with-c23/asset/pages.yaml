  md: '# 4.4 constexpr


    As a reminder, constexpr to give names to things that otherwise would be magic
    values. The rules for constexpr are simple:


    +   - It must be initialized in its declaration.

    - The expression it''s initialized with must be a constant expression calculated
    at compile-time involving only literals, enumeration values (§7.5), file-scope
    constant values, or constexpr values.

    - It can be used everywhere a literal can be.


    # 4.5 const


    As a reminder, use const to mark an object immutable after initialization. The
    rules for const are more complicated than for constexpr:


    +   - Like constexpr, it must be initialized in its declaration.

    - Unlike constexpr, the expression it''s initialized with can be any expression
    calculated at run-time, but only within a function; at file scope, the expression
    must be a constant expression.

    - It can not be used where a constexpr can, specifically not either as a case
    value for a switch statement (§5.8) nor a dimension of an array (§6.1).


    const is what''s known as a qualifier because it "qualifies" other type, e.g.,
    not only int, but a constant int. C also has _Atomic (§17), restrict (§21), and
    volatile (§22) qualifiers.


    The term cv-qualified is a shorthand for const and/or volatile qualified; the
    term cvr-qualified is a shorthand for const, and/or volatile, and/or restrict
    qualified.


    # 4.6 typeof


    Similar to auto (§4.2), C also has typeof that has two forms:


    ```

    typeof(expr)

    type(type)

    ```


    For the first form, expr is not evaluated. Like sizeof is a compile-time operator.
    It standards the long-long gcc extension.† For example:


    > †Referring to a Type with typeof, Free Software Foundation. Using the GNU Compiler
    Collection, §6.7, 1988–2025, https://gcc.gnu.org/linedocs/gcc/typeof.html'
