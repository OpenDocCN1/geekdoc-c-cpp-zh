    # 8.7.3 Variable Numbers of Arguments


    Function-like macros can take a variable number of arguments (including zero).
    Such a macro is known as variadic. To declare such a macro, the last (or only)
    parameter is ... (an ellipsis). For example, a fatal_error variadic function ($9.11)
    prints an error message formatted in a printf-like way and exits with a status
    code, you might want to use an INTERNAL_ERROR() macro that includes the file and
    line when the error came as shown in listing 8.1.


    ```

    #define INTERNAL_ERROR( FORMAT, ... ) \

    fatal_error( EXIT_INTERNAL, \

    \t%s:%d: internal error: "%s", \

    \t__FILE__, __LINE__, __VA_ARGS__ )

    ```


    Listing 8.1: Variadic INTERNAL_ERROR macro, version 1


    The __VA_ARGS__ expands into everything that was passed for the second (in this
    case) and subsequent arguments (if any) and the commas that separate them. You
    may have noticed a problem with INTERNAL_ERROR, specifically this line:


    ```

    __FILE__, __LINE__, __VA_ARGS__ )

    ```


    What the macro was called like:


    ```

    INTERNAL_ERROR( "oops" );

    ```


    passing zero additional arguments? Then __VA_ARGS__ would expand into nothing
    and the , after __LINE__ would cause a syntax error since C functions don''t accept
    blank arguments. What''s needed is to include the , in the expansion only if __VA_ARGS__
    is not empty. That''s precisely __VA_OPT__ does. You can rewrite the macro using
    it as shown in listing 8.2. Tokens to include in the expansion are enclosed with
    () immediately following __VA_OPT__.'
