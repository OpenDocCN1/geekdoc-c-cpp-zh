  md: '# 4.9 Attributes


    An attribute is an optional piece of additional information attached to most anything
    in C: a type, variable, statement, or function using the [[attribute-list]] syntax
    where attribute-list is a comma-separated list of attributes. In addition to the
    standard attributes given in the following sections, compiler vendors may offer
    their own attributes prefixed by prefix::e.g., gnu:


    An attribute can be declared anywhere and either before or after a declaration.
    What it applies to depends on where it''s declared: example:


    ```

    [[may_unused]] int a, b; // applies to both

    int x, y [[may_unused]], z; // applies only to ''y''

    ```


    # 4.9.1 deprecated


    The deprecated attribute has two forms:


    +   - [[deprecated]] Marks a name deprecated and warns used.

    - [[deprecated("reason")]] Same, but includes reason in warnings.


    Making a name with deprecated causes the compiler to print a warning whenever
    the name is used. For the second form, reason is included in the warning. The
    attribute allows you to provide a transition period while updating an API. For
    example, given a declaration like:


    ```

    [[deprecated("use_getoken")]]

    char* get_token();

    ```


    and a use like:


    ```

    char *token = get_token();

    ```


    would generate a warning like:


    ```

    parser.c:42:13: warning: ''get_token'' is deprecated:

    use get_utoken

    ```


    # 4.9.2 fallthrough


    This attribute is used only with the switch statement (§5.8). For an explanation
    and example, see listing 5.2 (p.78).'
