  md: '# 2.14 Epilogue


    +   1. If both operands are floating-point types, their common type is the larger
    type.

    2. Otherwise, if one operand is a floating-point type, the other is converted
    to it.

    3. Otherwise, both operands are integer types. For each operand, integer promotion
    is first performed:


    +   - An operand of char, short, bit-field (§10.7), all either signed or unsigned
    enumeration (§7), is promoted to int if int can represent all the values of the
    original type or unsigned int if not.


    +   4. Then, if types are the same, that is the common type.

    5. Otherwise, if their signedness is equal, but their sizes are not, the smaller
    type is converted to the larger type.


    +   6. Otherwise, the operands have different signedness. If the signed type has
    a rank (table 2.7) less than or equal to the rank of the unsigned type, the operand
    with the signed type is converted to the unsigned type.


    # Table 2.7: Integer ranks, high to low


    | long long int unsigned long int |

    | 5 int unsigned long int |

    | 4 int unsigned int |

    | 3 short unsigned short int |

    | 2 signed char unsigned char char |

    | 1 bool |


    +   7. Otherwise, the unsigned type has a rank less than that of the signed type.
    If the signed type can represent all the value of the unsigned type, the operand
    with the unsigned type is converted to the signed type.

    8. Otherwise, both operands are converted to the unsigned version of the signed
    operand''s type.


    Despite the list of rules, the upshot is that, generally, C does “the right thing.”
    For every-day use, the rules can be simplified as:


    +   - Integer types are converted to floating-point types when necessary.

    - Smaller types are converted to larger types when necessary.


    assuming you enable at least number-related warnings (§18.7.1).


