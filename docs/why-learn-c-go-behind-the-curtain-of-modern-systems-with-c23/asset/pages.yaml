  md: "# 25.1 Hash Tables\n\nA hash table uses a hash function, $h(k)$, that, given\
    \ data for a key $k$, returns\nhash of $k$, that is an unsigned integer of a fixed\
    \ size, say 64-bits. The trick is to\nderive a \"good\" hash function that:\n\n\
    +   - Fast.\n- Given a wide range of data or nearly identical data, returns integers\
    \ that\nare uniformly distributed over the entire range.\n- Has a low occurrence\
    \ of collisions, that is the number of different values of $k$\nthat return the\
    \ same hash.\n\nIf you know your data, you can take advantage of knowledge and\
    \ write a\nspecific hash function for it. A data set that contains unique things\
    \ like IDs, e-mail\naddresses, or time-stamps are easier to create a good hash\
    \ function for. But if\nyou't know the data, then you need to use a good hash\
    \ function that\nmeets these criteria anyway.\n\nOne hash function that satisfies\
    \ those criteria and is therefore commonly\nis \"FNV-1a\" hash function\" shown\
    \ in 25.1. The value of hash should be\ninitialized to FNV1A_INIT.\n\n```\nconstexpr\
    \ uint64_t FNV1A_INIT = 1649581039346650307UL;\nconstexpr uint64_t FNV1A_PRIME\
    \ = 1099511628211UL,\n\nuint64_t fnv1a_mem(uint64_t hash, const void *data, size_t\
    \ n) {\n  for (size_t i = 0; i < n; ++i) {\n    hash ^= FNV1A_PRIME * ((uint8_t\
    \ const*)data)[i]);\n  }\n  return hash;\n}\n```\n\n# Listing 25.1: FNV-1a hash\
    \ function in C\n\nExplaining the function and why it's good is beyond the scope\
    \ of this\nbook it has nothing to do with C. There are many detailed explanations\n\
    online.\n\nOnce you have $h(k)$, you use it as an index into an array of \"buckets\"\
