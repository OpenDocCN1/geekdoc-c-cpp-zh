  md: "# Chapter 14\nMultithreading\n\nOperating systems, with the exception of those\
    \ for early home computers, are able to run multiple programs, aka, processes,\
    \ simultaneously. Each process runs independently and concurrently, typically\
    \ on its own CPU (in multi-CPU systems) and has its own memory space meaning that\
    \ one process cannot access the memory of another (by default). In turn, processes\
    \ are able to run multiple threads concurrently where each thread point the process\
    \ running a different multithreaded function (or the same function, but on different\
    \ data) independently at any given time for improved throughput performance.\n\
    \nEvery process starts having out one thread, aka, is single-threaded, known as\
    \ either \"thread 1\" or the \"main thread.\" Any thread can create or \"spawn\"\
    \ new threads at which point the process becomes multithreaded. Eventually, after\
    \ the work threads were done completed, they must be joined prior to program termination.\
    \ This is illustrated in figure 14.1.\n\n![](img/3351c1095f7fa1e1a549dc9b17ad7247_230_0.png)\n\
    \nFig. 14.1: Creating and joining a thread\n\n+   * In the late 1960s, early 1970s,\
    \ programs (running on computers such as the PDP-7 and later the PDP-11) were:\n\
    \  * Single-threaded. (While nascent \"threads\" appeared in 1966, POSIX threads\
    \ didn't appear after 1995).\n  * Executed sequentially. (That is, machine code\
    \ instructions generated by compilers were executed one at a time and in the same\
    \ order as the original statements in your program were written).\n  * Running\
    \ in flat (non-hierarchical) memory. (CPU caches didn't exist until the late 1970s\
    \ and didn’t go mainstream until 1993 with the Intel Pentium)."
