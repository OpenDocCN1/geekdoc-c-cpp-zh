  md: "# # Chapter 10\nStructures\n\n![](img/3351c1095f7fa1e1a549dc9b17ad7247_173_0.png)\n\
    \nA structure is one object of (potentially) many types whose data is related\
    \ such as a string's contents and length as shown in §1.9.\n\nThe closest analog\
    \ in other languages would be a class except a structure has all members \"public,\"\
    \ no \"constructors\" (automatic initialization), no \"destructors\" (automatic\
    \ cleanup), and no \"methods.\" You can write such functions, but you have to\
    \ be explicit about calling them.\n\n# ## 10.1 Definition\n\nFormally, a structure\
    \ definition is of the form:\n\n```\nstruct tag_opt {\n    members_opt\n} declarations_opt;\n\
    ```\n\nthat is the keyword struct followed by a tag followed by a set of zero\
    \ or more members optionally followed by declarations of the structure. Members\
    \ are in their own namespace specific to their structure, so different structures\
    \ can have members with the same name.\n\n+   - You may eventually notice that\
    \ many structures in the C standard library are named that they are prefixed by\
    \ a common abbreviation. For example, all the members of the tm structure (listing\
    \ B.1, p.367) are prefixed by \"tm_\",\n\nYou might think this was a simple idiosyncrasy\
    \ of the original Unix authors. It turns out that early C compilers had only a\
    \ single, global symbol table, so they added prefixes to members to avoid name\
    \ collisions. Once C compilers improved, this style faded away.\n\nHowever, the\
    \ style persists in a few places, e.g., the Solaris' internal style still reminds\
    \ you to style this to day, even in new code:"
