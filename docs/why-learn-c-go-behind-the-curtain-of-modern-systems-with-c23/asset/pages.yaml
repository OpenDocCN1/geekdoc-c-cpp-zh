  md: '# Chapter 9

    Functions


    As stated in §1.4, except for the most trivial, programs in C are composed of
    multiple functions that allow a large, complicated program compiler needs only
    the types) to be decomposed into smaller, simpler mini-programs.


    # 9.1 Declarations vs. Definitions


    A function *declaration* is done via a *prototype*, that is a function''s name
    and *signature*, that is its parameter types (if any), and return type (void),
    but without a body. For example, from listing 13.6 (p.212), these are function
    declarations:


    ```

    void string_puts(struct string *str, char const *s);

    void string_cleanup(struct string *str);

    ```


    The function *string_puts* has a signature of struct string*, char const* for
    its parameters and void instead of a return type. Parameter names are neither
    part of a signature (the compiler needs only the types), but are sometimes included
    anyway for documentation in listing 2.1 (p.28). Functions that have exactly the
    same parameters and return type have the same signature. A function must be at
    least declared before another function can use it. Function declarations are often
    put into .h files


    A function *definition* repeats its declaration, but also includes its body. Function
    definitions are put into .c files (mostly; see §9.10).


    # 9.2 Parameters


    Before discussing function parameters, the term *parameter* and *argument* need
    proper definitions since those are often (wrongly) used interchangeably:'
