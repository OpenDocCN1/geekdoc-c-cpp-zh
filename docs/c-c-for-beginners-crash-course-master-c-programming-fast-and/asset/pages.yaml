  md: "# C# destructors\n\nA destructor is a special function in a class that is used\
    \ very rarely to usually release unmanaged resources before exiting the class.\
    \ The destructor has several limitations on how it can be used:\n\n+   - It cannot\
    \ be inherited.\n+   - It cannot be overloaded.\n+   - There can only be one destructor\
    \ in any given class.\n+   - The destructor cannot be directly called by the programmer;\
    \ it is instead called by the Garbage Collector.\n\nDestructor has the same name\
    \ as its class and is prefixed with ~ symbol which is represented by a tilde.\n\
    \n# Example of Destructors\n\n```\nExample 21:\n\nusing System;\nnamespace destruct\n\
    {\n    class Calculate\n    {\n        int number1,number2,sum;\n        Calculate()\n\
    \        {\n            number1=15;\n            number2=4;\n        }\n     \
    \   public void Addition()\n        {\n            sum=number1+number2;\n    \
    \    }\n        public void Show()\n        {\n            Console.WriteLine(\"\
    The total is:{0}\",sum);\n        }\n\n        // Destructor is defined here and\
    \ is called when the class\n        // goes out of scope.\n        ~Calculate()\n\
    \        {\n            Console.WriteLine(\"Destructor invoked\");\n        }\n\
    \    }\n```"
