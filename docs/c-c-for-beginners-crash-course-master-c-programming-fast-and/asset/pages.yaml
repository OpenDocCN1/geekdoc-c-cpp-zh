  md: '# 3.2 Data Types in C#


    Data types are used to store the data in a specific type. There are several built
    in data types that are used by the programmers for declaring data.


    Every data type has a limited set of options it can be, these limited number of
    options are called the **data range** for the data type. Listed below are the
    different data types present and the data range that they can be:


    +   - **bool:** Used to represent the Boolean value. The values that can be assigned
    are true or false.

    +   - **byte:** 8 – bit unsigned integer. The range of value for a byte data type
    is from 0 to 255

    +   - **char:** 16 – bit Unicode character. The range of values is from U +0000
    to U + ffff

    +   - **double:** 64 – bit double precision floating point type. The range of
    values is from (+/-) 5.0 x 10-324 to (+/-) 1.7 x 10308

    +   - **decimal:** 128 bit precise decimal values with significant digits. The
    range of values is from (-7.9 x 1028 to 7.9 x 1028) / 100 to 28

    +   - **float:** 32 bit single precision floating point. The range of values is
    from -3.4 x 1038 to + 3.4 x 1038

    +   - **int:** 32 – bit signed integer type. It has range of values from -2,147,483,648
    to 2,147,483,647

    +   - **long:** 64 – bit signed integer type. It has range of values from -923,372,036,854,775,808
    to 9,223,372,036,854,775,807

    +   - **sbyte:** 8 – bit signed integer type. It has range of values from -128
    to 127

    +   - **short:** 16 – bit signed integer type. It has range of values from -32,768
    to 32,767

    +   - **uint:** 32 – bit unsigned integer type. It has range of values from 0
    to 4,294,967,295

    +   - **ulong:** 64 – bit unsigned integer type. It has range of values from 0
    to'
