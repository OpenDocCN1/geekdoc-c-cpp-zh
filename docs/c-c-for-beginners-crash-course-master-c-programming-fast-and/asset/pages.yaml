  md: "# 7.1 While loop\n\nA while loop consists of a conditional expression that\
    \ must be matched before the logical statements inside the while loop can be executed.\
    \ If a statement matches the expression then it will run the code inside the loop\
    \ and then return back to the conditional expression to re-check whether the statement\
    \ still matches the expression. If it matches again then the loop will execute\
    \ again otherwise it will skip the loop completely.\n\nLet us visit the syntax\
    \ of a while loop.\n\n# Syntax:\n\n```\nwhile (expression)\n{\n    statements;\n\
    }\n```\n\n# Flow Diagram\n\n![](img/c133ae999967b1fbceab3bccc1cb1d4f_55_0.png)"
