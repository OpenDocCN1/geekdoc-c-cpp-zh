- pgno: 33
  md: '# 5.3 Relational operators


    The relational operators are used for **relational operations** and **type comparisons**.


    | Operator | Description | Example |

    |---|---|---|

    | `==` | It checks if values of the operands are equal or not. | If x=10, y=20,
    (x==y) is not true |

    | `!=` | If the values of the two operands are not equal then condition is true
    | If x=11, y=12, (x!=y) is true |

    | `>` | If the left operand is greater than right, condition is true | If x=13,
    y=17, (x>y) is not true |

    | `<` | If the right operand is greater than left, condition is true | If x>10,
    y=15, (x<y) is true |

    | `>=` | If the value of the left operand is greater or equal to right, condition
    is true | If x=5, y=3, (x>=y) is true |

    | `<=` | If the value of the left operand is less or equal to right, condition
    is true | If x=10, y=4, (x<=y) is not true |'
