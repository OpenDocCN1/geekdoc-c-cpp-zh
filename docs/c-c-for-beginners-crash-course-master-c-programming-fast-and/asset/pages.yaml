    switch(Expression)\n{\n    case ConstantExpression1:\n        statements;\n  \
    \  break;\n    case ConstantExpression2:\n        statements;\n    break;\n  \
    \  ....\n    case ConstantExpression_n:\n        statements;\n    break;\n   \
    \ default:\n        statements;\n    break;\n}\n```\n\nThe rules added in the\
    \ switch statement are:\n\n+   - Expression in a switch statement must be an integer\
    \ or of a class type.\n+   - A user can add any number of case statements in a\
    \ switch statement.\n+   - The **ConstantExpression** must be of the data type\
    \ similar to the expression in the switch.\n+   - When the Expression matches\
    \ the ConstantExpression, the code inside that **case** will be executed and will\
    \ hit the **break** keyword which will force the execution out of the **switch\
    \ statement**."
