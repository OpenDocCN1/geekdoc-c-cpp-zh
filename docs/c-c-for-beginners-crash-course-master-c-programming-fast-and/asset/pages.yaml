- pgno: 34
  md: '# 5.4 Logical operators


    Logical operators are used for evaluating an expression and return a **Boolean**
    value.


    | Operator | Description | Example |

    |---|---|---|

    | `&&` | Logical AND operator. If both the expressions are true, result is true
    | X has Boolean value as true and Y has Boolean value false, (A&&B) is false |

    | `!` | Logical NOT operator. If the expression is false, returns true | X has
    Boolean value true, !(X) = false |

    | `||` | Logical OR operator. If either of the expression is true, result is true
    | X has Boolean value true, Y has Boolean value false, (X\|Y) is true |

    | `^` | If either of the expression is true, returns true. It returns false if
    both the expressions are true or false | X has Boolean value true, Y has value
    false, (X^Y) is true |'
