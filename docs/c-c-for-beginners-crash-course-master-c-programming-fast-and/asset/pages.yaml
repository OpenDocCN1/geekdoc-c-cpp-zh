  md: '# 5.6 Assignment operators


    Assignment operators are used for performing arithmetic operations on the operands.
    The resultant value is assigned to any one of them.


    | Operator | Description | Example |

    |---|---|---|

    | = | Assigns value from right side operands to the left side operand | z=x+y
    assigns value of x+y to z |

    | += | Add AND assignment operator. Adds the right operand to the left operand
    and the result is assigned to left operand | x+=y is similar to x=x+y |

    | -= | Subtract AND assignment operator. Subtracts the right operand from the
    left. | x-=y is similar to x=x-y |

    | *= | Multiply AND assignment operator. Multiplies right operand with the left
    | x*=y is similar to x=x*y |

    | /= | Divide AND assignment operator. Divides left operand with the right | x/=y
    is similar to x=x/y |

    | %= | Modulus AND assignment operator. It takes the modulus of both the operands
    | x%=y is similar to x=x%y |

    | <<= | Left shift AND assignment operator | a<<=2 is similar to a=a<<2 |

    | >>= | Right shift AND assignment operator | a>>=2 is similar to a=a>>2 |

    | &= | Bitwise AND assignment operator | a&=3 is similar to a=a&3 |

    | ^= | Bitwise exclusive OR assignment operator | a^=4 is similar to a=a^4 |

    | \|= | Bitwise inclusive OR assignment operator | a\|=5 is similar to a=a \|
    5 |'
