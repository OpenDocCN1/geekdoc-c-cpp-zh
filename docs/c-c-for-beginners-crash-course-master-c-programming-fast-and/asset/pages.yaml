- pgno: 138
  md: '# 14.1 Thread in C#


    A thread defines a control flow. Thread is a basic unit to which the operating
    system allocates a thread. The execution of a thread is independent within a program.


    A single process is executed using one thread. Such process is known as single
    – threaded process. Only one task can be performed at a time. The user has to
    wait for the task to complete before executing new task.


    For executing more than one thread at a time, multiple threads are created. The
    process creating two or more threads is known as multithreading.'
  merge: -1
  img_proc: true
- pgno: 139
  md: '# 14.2 Life cycle of a thread


    The life cycle of a thread starts when the object of **System.Threading.Thread**
    class is created. The life ends as soon as the task is completed. There are various
    states in the life cycle of a thread.


    +   - **Unstarted State:** When the instance of the **Thread** class is created,
    the thread enters in unstarted state.


    +   - **Ready State:** The thread is in this state till the program calls the
    **Start()** method.


    +   - **Not Runnable State:** A thread is not in the runnable state if:


    +     1. **Waiting:** The **Wait()** method is called to make the thread for a
    specified condition

    +     2. **Blocked:** The thread is blocked by an I/O operation

    +     3. **Sleeping:** The **Sleep()** method is called to put the thread in sleeping
    mode.


    +   - **Dead State:** Once the thread completes its execution or aborted, it is
    placed in a dead state'
  merge: -1
