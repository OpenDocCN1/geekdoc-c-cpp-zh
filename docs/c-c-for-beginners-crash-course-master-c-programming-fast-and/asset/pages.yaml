  md: '# 10.2 Properties and methods of string class


    # Properties of string class


    +   - **Chars:** Gets the **Char** object at specific position in the **String**
    object

    +   - **Length:** Gets the **number of characters** in the String object


    # Methods of string class


    +   - **public bool Equals(string value)**

    +     Checks whether the current String object and the specified object have same
    value

    +   - **public string Insert(int startIndex, string value)**

    +     Returns a new string in which the specified one is inserted at a specific
    index position

    +   - **public string Replace(char oldchar, string newValue)**

    +     All the occurrences of a specific character in the string object are replaced
    with Unicode character and a new string is returned.

    +   - **public int LastIndexOf(string value)**

    +     The zero based index position of the last occurrence of the Unicode character
    in the string object is returned

    +   - **public string Trim()**

    +     All leading and trailing white space characters from the object are returned.

    +   - **public static Compare(string str1, string str2, bool IgnoreCase)**

    +     Compares the two strings and an integer value stating the relative position
    in sort order

    +   - **public static string Concat(string str1, string str2)**

    +     Concatenates the two string objects

    +   - **public string[] Split (char[] separator, int count)**

    +     A string array containing the substrings in the current string object is
    returned. It is delimited by the elements of a specific Unicode character array.
    The number of substrings returned is specified by the int parameter.

    +   - **public bool Contains(string value)**

    +     Returns value stating the specified string object occurs in the string

    +   - **public static string Copy(string str)**

    +     Creates a new String object with the same value as the specified string

    +   - **public string ToUpper()**

    +     Copy of the string converted into uppercase is returned

    +   - **public int IndexOf(string value)**'
