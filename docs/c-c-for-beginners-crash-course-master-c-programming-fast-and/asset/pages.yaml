- pgno: 118
  md: "# 12.2 Base and derived classes\n\nThe structure of inheritance can be summed\
    \ up in a few ways, for this example we have three classes **A, B** and **C**.\
    \ The class **B** is derived from the class **A**. The class **C** is derived\
    \ from class **B**. So what does this mean?\n\nIf we symbolize the relationship\
    \ of these classes then we could show it like this:\n\nClass A → Class B → Class\
    \ C\n\n+   - Since class **B** is derived from class **A**, we say that class\
    \ **A** is the parent of class **B**. We can also say that class **B** is the\
    \ child of class **A**.\n+   - Since class **C** is derived from class **B**,\
    \ we say that class **B** is the parent of class **C**. We can also say that class\
    \ **C** is the child of class **B**.\n+   - Since class **C** is derived from\
    \ class **B**, which in turn is derived from class **A**, we say that class **A**\
    \ is the grandparent of class **C**. We can also say that class **C** is the grandchild\
    \ of class **A**.\n+   - In this instance since class A does not inherit from\
    \ other classes, this class would be called the **base class**. Class **B** and\
    \ class **C** would be declared as derived classes.\n\nIn this instance we have\
    \ used the metaphor of parent and child to represent the relationship between\
    \ the different classes but you will also encounter other metaphors such as super\
    \ class (base class) and sub classes (derived classes) that describe the same\
    \ relations.\n\nThe following is the way we would declare these relationships\
    \ in code:\n\n```\n```cpp\n<access – specifier> class <base_class>\n{\n    …..\
    \ \n}\nclass <derived_class> : <base_class>\n{\n    ….. \n}\n```\n```"
