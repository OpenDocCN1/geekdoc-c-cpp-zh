- pgno: 52
  md: 'are reasons that this is so frustrating, reasons nestled in how humans actually
    pay attention to two things at once. William James was one of the first to start
    looking at how we divide our attentions, and he figured that we were able to split
    them. "Everyone knows what attention is," wrote James. "It implies withdrawal
    from some things in order to deal effectively with others..."<sup>30</sup> By
    his reasoning, we would give some attention to the insatiable talker and some
    to the book. The idea that attention could be split was the dominant thought on
    the issue for half a century. As it turns out, however, splitting attention doesn''t
    work so well in the brain. The real inner workings of human attention are a major
    piece of the anatomy of both fun immersion and game addiction.


    We need to be paying attention to something for it to make sense. When we multi-task,
    we''re balancing our attention between two or more things. We aren''t actually
    "splitting" our attention, but rather we''re *attention switching*: we are *quickly*
    switching the bulk of our focus from one thing to another. Some scientists have
    shown that we have a much harder time recalling things that we experienced while
    multi-tasking. When we multi-task, we store things in a part of the brain that''s
    less effective at memory and more tailored to instinct. When we focus on one thing
    at a time, more of what we experience is processed in the comparatively advanced
    prefrontal cortex, which deals with some of the other higher brain functions that
    we''ve discussed, particularly with image and language.<sup>31</sup>


    When more pointed research on attention began in the 1950''s, it first focused
    on whether air traffic controllers would be able to hear two messages spoken at
    the same time. Experimenters played a different message in each ear. During the
    experiment, the listeners could understand the message coming into one ear, but
    recalled almost nothing about what was going into the other ear, besides the fact
    that there were sounds. The listeners'' comprehension was so bad that they couldn''t
    even tell when the words were being played backwards or when the messages were
    being spoken in another language! When the same messages were played with a delay
    of two to six seconds between each message, however, listeners were actually able
    to switch their attention back and forth, comprehending both.<sup>32</sup>


    It turns out that our brains aren''t just good at switching between conversations;
    they''re also pretty good at figuring out what somebody is going to say next,
    especially since speech patterns in some languages and for'
