  md: '# Three


    # # WHY THEY PLAY


    > > A boat can float in water, but it can sink in it also. — Chinese proverb,
    also from Legend of the Drunken Master


    Games are carefully crafted to be exciting, satisfying and rewarding; the word
    that''s more like to throw around is *fun*. Once immersion takes hold, a player''s
    experience of a game becomes far more natural. They aren''t slapping on a keyboard
    so much as looking into the secondary world for an experience. They act and react.
    Much of what keeps them inside only happens on the inside, once immersion into
    the experience is more automatic than not. Today, when that same immersion is
    directed at older media, the conclusion of addiction isn''t normally jumped to;
    books, movies and plays are more seen as a part of human life worth keeping.


    It''s been some time since burning the books, crushing the film canisters and
    executing the playwrights was a big priority for society in general. Though games
    seem the vogue moral panic, when a full-fledged experience is available at a gamer''s
    beck and call, they sometimes aren''t seeking entertainment so much as another
    place, another part of their lives. To understand why someone would abandon reality
    and give preference to that place, we have to understand what that place offers
    above and beyond reality. It can be a confusing prospect when a space that we
    enter, a place for experiencing, is bandied about as entertainment. A family might
    travel to a theme park, but it''s rare to find one who spends six hours of every
    day inside. Oftentimes the people, places, sights and sounds in secondary worlds
    invite us to forge real, meaningful relations with other living people, sometimes
