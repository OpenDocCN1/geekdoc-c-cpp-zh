  md: 'topic in and of itself, it''s enough to say that it''s closely related to the
    point of a game. Following are the major kinds of gameplay that you''re likely
    to see.


    First-person shooter games, or FPS games, let people walk around and shoot things.
    FPS is one of the oldest and best-established game genres out there. As the name
    implies, these games follow a first-person perspective. What you see on the screen
    is meant to represent what you might see as you walk down a hallway, up a flight
    of stairs, or through a crowded city street. This has been popular for a long
    time in part because as computer technology improves, these games are able to
    make the worlds more and more realistic. New FPS games almost always try to improve
    the visual realism or the physics, though they nearly always have one thing: shooting.
    Whether it''s firing crossbows, lasers, poisonous bile, or a golden gun, these
    games very often come down to reflexes and hand-eye coordination. In these games
    you can be a medieval warrior, a Jedi, a biochemist in a hazard suit, aliens,
    World War II soldiers, or really anything that fires a projectile weapon.


    Role-playing games (RPGs) allow gamers to take on roles. Most popular RPGs allow
    players to select between different races, professions, and their hero archetypes.
    Players may choose to become Jedi, medieval warriors, or smooth-talking gunslingers.
    Video-game RPGs came originally from the old paper-and-dice role-play games, like
    Dungeons and Dragons. Quite a few of the blockbuster video-game RPGs coming out
    today feature entire worlds, often three-dimensional and filled to the brim with
    unique creatures and characters. This genre has been growing so rapidly lately
    that many people consider RPGs to be surpassing bestselling novels in terms of
    story and character development.


    World of Warcraft is a unique type of RPG, because it takes place in an MMO world.
    What''s impressive about Warcraft is that it earns its publisher, Blizzard Entertainment,
    over a billion dollars annually. If we come back to our "three Ps," MMORPG just
    combines the way people are handled (MMO) and the point of their experience inside
    the game (RPG). While most MMOs made up to this point have been role-playing games
    to some extent, many have also borrowed liberally from the FPS and real-time strategy
    (RTS) genres. Many new types of MMO worlds are likely forthcoming. In World of
    Warcraft, characters choose to be any number'
  merge: -1
  img_proc: true
- pgno: 182
  md: 'of fantasy creatures, such as elves, dwarves, trolls, or orcs. They then perform
    tasks and socialize with others inside the world in order to grow the power of
    their characters. Only a handful of the RPGs out there are also massively multiplayer,
    primarily because blockbuster MMO games cost tens of millions of dollars to produce.


    Real-time strategy (often called RTS) and turn-based strategy games usually test
    a person''s ability to micromanage the economic and managerial aspects of combat
    (though often other things, like trade and diplomacy). In real time, everything
    is happening at once. Players use their reflexes and knowledge of the game in
    order to build the right thing at the right time. Turn-based strategy games are
    like checkers or chess. One player thinks about her move and takes a turn, then
    the other player does the same. In these strategy video games, players are almost
    always presented with a kind of bird''s-eye view of a battlefield or playing field.
    In many games, players will collect resources, using them to construct buildings
    and military units that allow them to win. For example, maybe they have to build
    an army, thousands of military units, so that they can storm an enemy castle.
    On the other hand, maybe they only need to get a single spy unit close enough
    to the castle so that they can set off a thermonuclear warhead.


    There are popular racing games, sports games, simulators, narrative games, and
    games that are focused on simple or complex puzzles. Racing games are pretty self-explanatory;
    in them you pilot some kind of vehicle and have any number of reasons for driving
    fast. Sports games usually feature big names in athletics, old and new. These
    games let you play as certain teams and certain players. Narrative games revolve
    around a story of some kind. Games that focus only on a narrative are somewhat
    rare; however many of the highest-selling games in other genres bring in (or try
    to bring in) varied levels of storytelling.


    Some games stick to just one of the above kinds of gameplay, and some mix the
    above types. For an example of mixing, a game may combine first-person shooter
    with racing elements, as is done in the newer Grand Theft Auto games. A game may
    stick to one point, but then add “mini-games,” small games built into the larger
    game. These can be a simple game of Battleship or a complicated racing game with
    realistic physics. While these categories cover the games that you’re most likely
    to see, new'
  merge: -1
  img_proc: true
- pgno: 183
  md: 'games are coming out all the time. As the technology in games improves, we''re
    likely to see new and interesting takes on graphics, platforms, and players. As
    the creativity in the games industry expands, we''re likely to see entirely new
    points to entirely new games. And since the game industry is only going to grow,
    you can count on an ever-increasing number of new ways to play.


    # Let''s See If You Get It Now


    I''ll just mention a few games that you might have heard of and break them down
    in terms that we''ve talked about. Doesn''t be embarrassed if you''re still having
    a hard time classifying games. It takes most gamers years to learn about their
    small but important differences. Most players usually learn by playing.


    If you ever have trouble trying to break down a game, just remember that every
    game has three simple pieces to it: the platform where its played, how it deals
    with people, and the point of what you actually do when you''re inside. Let''s
    take a single-player RPG, or role-playing game, on the PC platform. All you have
    to do is break down the statement. First, it''s single-player. That''s easy, one
    person is playing it. Check. Second, it''s a role-playing game. You''re taking
    on a role, generally a fantasy or science fiction role. Check. Finally, it''s
    being played on a PC, or personal computer. Check. If this stuff is new to you,
    then there''s absolutely no problem with feeling a little bit lost here. It takes
    most gamers months or years to learn about all of the different genres within
    gaming. As for single-player RPGs for PC, what we just broke down, there are some
    really popular ones. Some examples might be the Baldur''s Gate series, the Fallout
    series, Elder Scrolls IV: Oblivion, or Neverwinter Nights.


    Let''s try breaking down some popular FPS games that you might have heard of.
    Counter Strike and Battle 2 are very popular multi-player online FPS games that
    are usually played on the PC. As long as we''re remembering the three Ps, we''re
    going to have an easy time breaking these down. What platform are we using? A
    personal computer. How do you interact with real people? It''s a multiplayer online
    game, which means that a few players are meeting up online. Somebody playing Counter
    Strike or'
  merge: -1
  img_proc: true
- pgno: 184
  md: 'Battlefield 2 might be playing with one other person online, or dozens of people.
    It all depends on the player''s preferences and what''s available online for them.
    Finally, what''s the point of the game? These are first-person shooters. The point
    in both Counter Strike and Battlefield 2 is to fight using modern-day weaponry.
    In Counter Strike, players can choose to play either as terrorists or counter-terrorists,
    whereas Battlefield 2 takes this a step further. Players can choose to be U.S.
    Marines, People''s Liberation Army, or Middle East Coalition forces.


    Another game that most gamers are familiar with is Civilization, a turn-based
    strategy that''s normally single-player and found on the PC. In Civilization,
    you create an entire, well, civilization from the ground up. You build cities,
    grow culture, build world wonders, and generally try your best to keep your people
    happy, healthy, and safe. Other civilizations are also out there, building up
    their forces, and everyone is trying to win the game in some fashion. It''s turn-based
    strategy, which means that you take one turn, and then the other civilizations
    take their turns, a lot like chess. While some of the later versions of Civilization
    allow for multiplayer online gaming, each turn takes a really long time. Usually
    it''s a single-player game. It''s also a game that can take a really, really long
    time to beat.


    Where''s the platform, people, and the point come together, we get games. But
    it''s important to remember that while asking these three questions can help you
    to get to the heart of any game, the three Ps aren''t the same as actually playing.
    They tell you what a game is — where you''re playing, who you''re playing with,
    and what you''re doing. In reality, every game is different. The three Ps will
    tell you what that look for, but they can''t tell you when a game is going to
    have kittens that shoot jets of flame out of their eyes. They also won''t tell
    you about the unique culture that''s been developing around games, on and offline.'
  merge: -1
  img_proc: true
- pgno: 185
  md: '# APPENDIX C. COMMONLY USED INTERNET AND GAMER SLANG


    What are gamers really talking about? Many of these common gamer sayings are acronyms,
    while many are simply expressions. Some of these expressions were created “from
    scratch” by gamers, though most are words that are simply taken from the English
    language and modified.


    # “Ding!”


    Literal Meaning: “I just gained a level.” Usage: (1) Ding is most often excitedly
    used after one has gained in a level. (2) It can be used in order to reference
    anyone’s level gain, or very infrequently as an indication that one has gained
    in some type of power.


    # Gank (Expression)


    Usage: (1) To kill another player in an unexpected, unfair, or unevenly matched
    fight. Ganking is only dubiously moral. While many players will condemn certain
    types of ganking, they may themselves freely engage in other types of ganking.
    In some games, being ganked can cause a player to lose hours, sometimes days,
    of effort put into a character. (2) Ganking is related to what is called “corpse
    camping,” the act of “setting up camp” near a player’s dead body. The ganker proceeds
    to kill them repeatedly, oftentimes causing a player to accrue death penalties.


    Variations: ganked, gankzors, ganker'
  merge: -1
  img_proc: true
- pgno: 186
  md: '# **Grind** (Expression)


    Literal Meaning: “Complete repetitive tasks.”

    Usage: (1) Players will often refer to grinds as long streaks of performing some
    repetitive task, for instance crafting med kits, mining space ore, or killing
    boars. (2) Grinds are often contrasted with quests or story-lines. Whereas in
    many games players can follow some plot or story-line, however detached, grinding
    infers advancing one’s character by simply killing the same enemies or performing
    the same tasks over and over again.


    # **IMO** (Acronym)


    Literal Meaning: “In my opinion.”

    Usage: (1) IMO is often used alongside another statement and sometimes just literally
    means that statement is that player’s opinion. “IMO going left might be better,
    because their archers won’t be able to get us.” (2) IMO is more often used in
    order to add emphasis to an obvious statement, or in an attempt at humor and/or
    irony. “Don’t kill us all like an idiot IMO.”

    Variations: IMHO (“In my humble opinion”).


    # **IRL** (Acronym)


    Literal Meaning: “In real life.”

    Usage: (1) Players use IRL in order to refer to theirs or another player’s non-game
    life. (2) IRL is also commonly used to refer to the state of affairs in the non-digital
    world.

    Variations: RL, out of game


    # **L2P** (Acronym)


    Literal Meaning: “Learn to play.”

    Usage: (1) L2P is most commonly an insult, indicating that another player lacks
    fundamental gaming “skills,” and is very similar in its usage to the expression
    “noob.” (2) L2P can be used ironically, in order to compliment a player’s mastery
    over a given game. This usage is very rare as L2P is almost always used derisively.
    (3) The “play” in “learn to play” can be swapped out for any number of other activities,
    for instance “Learn to heal.” These types of changes are often made in retort,
    coming from the player who has just been insulted.

    Variants: Lrn2play'
  merge: -1
  img_proc: true
- pgno: 187
  md: '# lewt (Expression)


    Usage: (1) Most commonly, "lewt," or "phat lewt" refers to highly desirable artifact,
    weapons, or items within a game.


    Variants: phat lewt, gear


    # LOL (Acronym)


    Literal Meaning: "Laugh out loud."


    Usage: (1) A situation is humorous or otherwise ironic. (2) Used derisively when
    laughing at another person or player.


    Variants: lawl, lolerskates, lolerbagel


    # lootwhore (Expression, Expletive)


    Usage: (1) Not to be confused with "lewt," or the treasure itself, "loot" most
    often means the act of taking the treasure. Since some treasure is highly valuable
    and requires a large team effort which can span many days, a great deal of thought
    and planning can go into who gets what treasure. A "lootwhore," then, commonly
    refers to someone who has taken more of the treasure than what others feel they
    deserve.


    # Main and Alt (Expressions)


    Literal Meaning: Main character and alternate character, respectively.


    Usage: (1) A player''s main character is commonly referred to as their "main,"
    whereas their "alt" will often be a secondary character. (2) Players with more
    than one alternate character may refer to these characters as his or her "alts."


    Variations: alts, twink (see below), twinks


    # MOB (Acronym)


    Literal Meaning: "Mobile Object."


    Usage: (1) MOBs refer to the many friendly and unfriendly computer-controlled
    monsters within a game. A mob can be a monster, a character, or really any kind
    of creature within an MMO game which is not being controlled by a real human being.


    # Nerf (Expression)


    Literal Meaning: "Weakened."


    Usage: (1) When one remarks that a certain part of the game has been "Nerfed,"
    in effect they are saying that it has been heavily weakened. Weapons, armor, and
    other items are often nerfed when a number'
  merge: -1
  img_proc: true
- pgno: 188
  md: 'of other players complain that they are “OP,” or “overpowered.” Nerfs to characters
    themselves (for instance to “rogues,” “jedi,” or “healers”) tend to cause the
    most drama and dissent amongst players. (2) “Nerf” or “nerf!” is a common expression
    used when one player feels that they are at an extreme and unfair disadvantage
    against certain other types of players. “Nerf warlocks.”

    Variations: nerfed, gimp, gimped


    # **Ninja (Expression)**


    Literal Meaning: “Ninja.”

    Usage: (1) A ninja is similar to a loothore, in that both are seen as taking something
    which, in the opinion of others, was not theirs to take. Ninja differs in that
    the theft was generally not expected by others, whereas loothore indicates a longstanding
    reputation of taking many items. (2) Ninja can be used as a verb, indicating the
    act of taking. “John is planning to ninja your sword, you had better kick him
    from the group.”

    Variations: Ninjaing, ninjad


    # **Noob (Expression)**


    Literal Meaning: “New player.”

    Usage: (1) Used to refer to a new or inexperienced player. “After being killed
    by the level 1 rabbit, Bill started to freely admit to being a noob.” (2) Used
    very frequently as an insult, suggesting that a player is no more effective than
    somebody who has just started playing.

    Variations: newb, nub, noobie, “to be noobed”


    # **OMG (Acronym)**


    Literal Meaning: “Oh my God.”

    Usage: (1) OMG is similar to WTF, in that it can be used in order to indicate
    one feels that another player is in the wrong, inexperienced or making a mistake.
    It contrasts with WTF in that OMG isn’t normally directly derogatory. That is,
    it can be a prelude to constructive criticism.

    Variations: Oh em gee, zomg, omgwtf, omgwtfbbq


    # **OP (Acronym)**


    Literal Meaning: “Overpowered.”

    Usage: (1) Players most often refer to certain playable characters, weapons, armor
    or items as overpowered when they give clear, overwhelming, and/or unfair advantages.'
  merge: -1
  img_proc: true
- pgno: 189
  md: '**orly** (Expression)

    Literal Meaning: “Oh really?”

    Usage: (1) Originally used in association with a photograph of a snowy owl with
    the text “o rly,” this phrase is used in order to portray a sense of disbelief.
    It is commonly answered with “ya rly.”


    **Pwn** (Expression)

    Literal Meaning: “Own.”

    Usage: (1) Used to indicate that one player has beaten another by a very large
    margin. “Joe’s rogue just pwned Frank’s warlock.” (2) A situation is very agreeable,
    awesome, or preferable. “Joe’s computer is so pwn.” (3) Often, “pwned” or “pwnt”
    is used as a statement after one player has beaten another player.

    Variants: lolwned, pwnage, ownage, own, ownt, wtfpwn


    **ROFL** (Acronym)

    Literal Meaning: “Roll on the floor laughing.”

    Usage: (1) ROFL is similar to LOL, in that it can be used in a number of ironic
    and derisive situations. ROFL is, however, generally more often used in an earnest
    appreciation of another player’s statements or humor.

    Variants: rofcopter


    **RP** (Acronym)

    Literal Meaning: “Role playing.”

    Usage: Roleplaying is when a gamer, MMO or not, decides to put themselves in the
    place of one of the characters that they play. In MMO games, “RPERS,” or people
    with an “RP FETISH,” are often looked on as humorous by other players. RPers and
    non-RPers will often have large in-game weddings, host events with different themes,
    and generally take on roles. To call someone an RPer can be a fun-loving and friendly
    crack.


    **Run** (Expression)

    Literal Meaning: “Complete.”

    Usage: (1) To run is to complete a particular task, complete all of the tasks
    within a dungeon, or otherwise pursue an objective. “Come on, Phil. Everyone wants
    to run the new Wasteland area!” (2) Running or runs can also indicate that one
    has completing tasks or objectives'
  merge: -1
  img_proc: true
- pgno: 190
  md: 'multiple times in quick succession. Groups will often perform one objective
    multiple times, often for many hours, sometimes day after day and week after week.
    “Man, these Banshee Caverns runs are getting arduous!”


    +   Variations: Runs, running, instance runs, dungeon Run


    # Twink (Expression)


    Literal Meaning: Powerful alternate character.


    Usage: (1) Whereas “alt” can often just refer to an alternate character, a twink
    often represents an alternate character that has been invested in heavily. Twinks
    will often own gear that most other players would never be able to afford and
    are generally only made by players who already have very committed or rich main
    characters, or “mains.”


    +   Variations: twinked out, twinked, twinkie


    # w00t (Expression)


    Literal Meaning: “Yay.”


    Usage: (1) Woot is a common expression of happiness, elation, or joy. It is most
    commonly used after completing a task or challenge.


    +   Variants: woot, wewt


    # WTF (Acronym, Expletive)


    Literal Meaning: “What the fuck?”


    Usage: (1) The speaker may be indicating that another player is in the wrong.
    In this case, the other player may be inexperienced, making a mistake, intentionally
    causing harm to other players, or they may suspect that player of cheating. (2)
    The speaker may be indicating a sense of wonder, bewilderment, or surprise.


    +   Variants: WTFBBQ'
  merge: -1
  img_proc: true
- pgno: 191
  md: '# APPENDIX D.

    SEEKING HELP IN

    AN UNFAMILIAR WORLD


    People seek out a therapist when they are hurt, suffering, or unhappy. Something
    isn''t working right in their lives, and most often someone has suggested they
    seek some kind of help for it. They often have no clue what''s really wrong or
    what to do about it. There may be an identifiable problem, but sometimes they
    are experiencing unpleasant feelings or behavior that seems destructive and unexplained.


    For people who have never consulted a therapist before, the process may seem dark
    and mysterious. There''s always that image of the goateed old guy with the German
    accent, cigar, and couch. Fortunately, the process has changed in the 100 years
    since Dr. Freud got the ball rolling with this thing about trying to understand
    ourselves.


    Most people don''t know where to start the process, or what kind of specific help
    to seek. It isn''t really all that complicated and we can explain the basics here.
    There are several types of mental health professionals who help people with personal
    and relationship problems. Marriage and family therapists practice individual
    counseling, as do licensed clinical social workers and licensed professional counselors.
    There are clinical psychologists in private practice, who provide a variety of
    services, including psychological testing. Psychiatrists are medical doctors who
    generally specialize in treating mental illness with medication, although some
    also provide psychotherapy.


    While there are various schools or approaches to therapy, and differences in philosophy,
    there are many basic commonalities. In general ther-'
  merge: -1
  img_proc: true
- pgno: 192
  md: 'apists try to help people understand themselves, solve problems, improve their
    relationships with others, make use of their potential, and feel better. Therapists
    try to understand what their client''s goals are and use a variety of methods
    and techniques to help them make the changes that will improve their lives. Therapists
    believe that it is possible for their clients to improve their lives.


    The element that is common among successful therapists of all types is that the
    therapist works to have an empathetic understanding of each client that they see.
    They are *interested* in the client, *accepting*, and *understanding*. To put
    it simply, they *care*, and they do their best to listen attentively and experience
    the inner life of each person they work with. Empathy is not related to intellectual
    brilliance but has a lot to do with the personality of the therapist.


    Sometimes people say, “I tried therapy and it didn’t work.” This may mean that
    they had an unrealistic expectation that the therapist would use some magic wand
    to take away their problems, or it’s possible that the person they were seeing
    was just not a good fit for them. Therapy is not a quick fix, but a process of
    learning how to work problems out — and the “work” is done by the client. The
    therapist provides guidance and possible ways to make this happen.


    It’s important to feel comfortable with a therapist. The quality of the relationship
    between the therapist and client is perhaps the most important factor in how successful
    the therapy would be. With that in mind, you should see that in considering therapy,
    you are making the choice with whom you work. You should speak with at least three
    persons over the phone before making any decision regarding which you might want
    to meet with, and ask questions about how they work with people like yourself,
    if they understand the kinds of problems you are dealing with, and any other questions
    that occur to you. Remember — you want to feel comfortable! You don’t have to
    grab the first name you see in the phone book.


    Ask friends, your primary care doctor, school counselor, or your local community
    mental health clinic for referrals of reputable people. Lots of therapists have
    their own websites which might give you a sense of what the person is like. If
    you don’t have health insurance that covers the cost, you may need to find someone
    who has a sliding fee scale or a non-profit counseling center. Don’t be shy —
    ask around.'
  merge: -1
  img_proc: true
- pgno: 193
  md: 'So is it important that the therapist be a specialist in gaming addiction?
    It would be nice, as that would give them a clearer understanding right off the
    bat what you are struggling with. Unfortunately we still don''t have an abundance
    of therapists who are experienced with MMOs, so it may be hard to find someone
    with specific expertise in this area. However, many therapists do have training
    in many different kinds of behavioral addictions. That''s close enough. This is
    something you should ask about in an initial phone call, and if that individual
    doesn''t really understand the problem they may be able to refer you to someone
    they know who does. You should also mention if you are looking for someone who
    is experienced with any other specific areas of concern or needs, like relationship,
    academic, or parent/child problems.


    Trust your instincts. It''s most important that you work with someone you feel
    comfortable talking to. Even if they don''t understand a lot about gaming initially,
    you can explain it to them. A therapist with empathy and insight will be very
    invested in helping you and will be motivated to learn more about that specific
    area you are struggling with.'
  merge: -1
  img_proc: true
