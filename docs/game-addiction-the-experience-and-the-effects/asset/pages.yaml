  md: '# APPENDIX B.

    LEARNING THE LINGO


    Let''s talk about how gamers and professionals actually talk about the real games
    on the market today. This is a key part of really understanding what a game is
    — whether we want to separate one game from another or just have intelligent conversations
    about them. For instance, which games let you play with thousands of other people
    from across the globe, which ones do you play with a few other people in your
    living room, and which ones are you playing all on your lonesome? To help us out
    here, we''ve created a unique method for separating the different kinds of games
    that are being played today. Whether you''re a hardcore gamer, a seasoned game
    designer, or completely bewildered, this chapter is going to show you a quick
    and easy way to understand every game ever made. More importantly, you''ll be
    able to correctly name most major games. We''re going to use three basic pieces
    of a game: the platform, people and point of a game. Don''t worry if those three
    magical Ps don''t jump out at you just yet. These Ps use the game industry''s
    established buzzwords for classifying different games, but arrange and explain
    them in a straightforward way.


    Take any game, and ask these three questions:


    **Question one: On what platform do you play it?**


    Platform is a relatively well-known gaming term, and it refers to the kind of
    machine that you''re using to play a game. There are a few different types of
    game machines, or platforms. Before we even break into what happens inside the
    game, we have to look at where it''s played, because the platform is going to
    exert a substantial influence over how you play'
  merge: -1
  img_proc: true
- pgno: 178
  md: '# APPENDIX B


    and what''s possible. For a few quick examples, gamers might play games on a personal
    computer (PC), on a PSP (PlayStation Portable), or on a Nintendo Wii (pronounced
    “wee”). The two most popular kinds of platforms are PCs and consoles, which we’ll
    explain below. There are also mobile platforms, stuff like a gameboy, PSP, or
    a game on your cellphone or Palm Pilot. We’ll explain those too.


    PC, as was mentioned above, just stands for a personal computer, the ones with
    a monitor and a mouse. They come in a few flavors, and people normally separate
    them based on the operating system that’s been installed, usually Macintosh, Windows
    or Linux. Some hardcore or professional gamers take a lot of pride in building
    their computers or laptops from scratch or hand-picking the different modifications
    or pieces of hardware used. As a result, it isn’t uncommon to see computers with
    extremely detailed metal work, colored lights, and even glass windows, allowing
    you to peer inside the computer. PCs can be used for most types of games.


    Consoles are the game systems that most often attach to your television and are
    then played with some kind of controller. The three most popular consoles come
    from Microsoft, Nintendo, and Sony. Microsoft produces the X-Box line, which includes
    the X-Box and the X-Box 360. Nintendo was responsible for a lot of the popularity
    enjoyed by consoles, and many people will remember their “Nintendo Entertainment
    System.” Most recently they’ve been manufacturing the GameCube and the Wii. Sony
    has been manufacturing the PlayStation line, which includes PlayStation 1, 2,
    and 3.


    As opposed to PC hardware, which is constantly being upgraded, console systems
    are released one at a time. Consoles are generational, which means that there
    are usually big upgrades every few years. Different console makers compete strongly
    against one another. This was especially the case most recently, when Nintendo’s
    Wii, Sony’s PS3 and Microsoft’s X-Box 360 all released products that were groundbreaking
    in some respect.


    Mobile platforms usually aren’t anywhere near as sophisticated as their PC or
    console counterparts. While this is especially true for games that you might play
    on a cell phone, handheld game systems like the Nintendo DS have worked hard to
    change this image. Some of the handheld systems are now even able to play movies
    from mini DVDs. And yet cell phones have their advantages. The GPS tracking features
    have made cell'
