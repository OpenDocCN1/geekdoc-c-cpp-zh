    Other countries clearly see the benefits of doing what they can to preserve culture
    and power through video games. The Chinese government has invested the U.S. equivalent
    of hundreds of millions of dollars to present classical Chinese works of literature
    as online games.7 While some countries see the need and have the capital to invest
