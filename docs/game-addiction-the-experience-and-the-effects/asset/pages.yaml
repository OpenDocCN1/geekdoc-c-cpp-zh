- pgno: 28
  md: 'began the tricky business of regulating online spaces, having for instance
    made it illegal to profit from something called botting. Try asking your local
    lawmakers for their stances on botting. Because these emergent types of cases
    can set a precedent for other countries, the legal cases and rulings in Korea
    could have a major influence on how we come to regulate a technology that crosses
    borders constantly.


    Korea has also been on the forefront of tackling game addiction, which currently
    has its Ministry of Health in a state of emergency. They estimate that anywhere
    between two and three million youth in Korea are addicted, and have actually created
    government funded boot camps for re-training the very young. The New York Times
    recently researched these facilities, which have four times as many parents volunteering
    their mid-dle-school aged children than there are spaces for them. There are instant
    help hotlines available for people to call for counseling, and Korea has also
    created the first fully unique diagnostic for detecting addiction, completely
    tailored to their culture. Unlike the first diagnostics and checklists to come
    out in the USA, discussed later, the Korean K-Scale is reported to reflect the
    actual problem far better. Overall, Korea gives us some great examples of how
    specific pieces of culture can lead gamers to play in certain ways.


    Though culture''s actual influence tends to be more subtle, there are a few other
    powerful things occurring worldwide that serve as unique examples. One of the
    most striking occurs when children, most especially boys, “fail to launch.” That
    is to say that more often, and for a variety of reasons, children are living with
    their parents long after they’ve completed a basic high school education. These
    young adults, not seeking education, employment or training, NEET for short, are
    sometimes considered at risk for withdrawing from society. This isn’t always a
    cause of concern in some countries, Italy, for instance. Parents have historically
    expected children, even young married couples, to live at home for some time,
    though they tend to do so while working and carrying on a full life. In many cases
    worldwide, these young people are closing themselves away, sometimes living for
    decades in seclusion.


    The most notorious case comes from the Hikikomori of Japan, where there’s a growing
    stigma of young people who live primarily on their parents’ income. This issue
    is actually fairly complex, having economic, social,'
  merge: -1
  img_proc: true
- pgno: 29
  md: 'and psychological components unique to Japanese culture. While it''s plain
    to see that a Hikikomori living at home would have greater access to something
    like games, we should see it as just one more example to how unique cultures open
    up unique windows to play. These different motivators don''t usually tie directly
    into addiction; they don''t uniquely cause the gaming problem, but rather provide
    us with reasons, ways and means to play.


    In many ways, beyond just gaming, technology is changing what it means to live,
    love and have fun in a global information age. Some of the namecalling and finger-pointing
    in game addiction is just a continued failure to understand technological innovation.
    In other cases, addictions can be fueled by a failing to understand gaming and
    the ways culture can push someone to excess play. These problems are new; they''re
    emergent in ways, cultural or not, that haven''t been given enough credit.


    There''s usually a lot happening when the secret ingredients, interactivity and
    connectivity, take over someone''s life. It''s not just C''thun''s evil gaze,
    or the banter that we get with our living companions behind the screen. The digital
    living room gives us more than just tangible goals. From how these goals are structured,
    to how our physical bodies get yanked in, the gaming experience pulls on most
    gamers for reasons that few can put their fingers on. On the one hand, some of
    the magic comes from not being able to see the man behind the curtain. On the
    other, the proverbial wizard behind everything isn''t going to pop out and force
    you to take care of your life. Sometimes he''ll let the show drag on for a very
    long time.


    It shouldn''t be entirely surprising when games fall out of balance, especially
    when powerful reasons to play are combined with the almost undeniable feeling
    that what gamers are experiencing is real. A gamer''s brain and body are getting
    an overflow of mixed messages: real-feeling experiences mix with legitimate reasons
    to play, making problems hard to perceive or accept. The danger is that where
    a gamer sees only fun, friends and good times, their real lives could be collapsing
    around them. If things in reality do implode, then often this leaves them with
    a distracting alternative: a powerfully satisfying though semi-real world. But
    will games lure in and lock in every last one of us?'
