    We can say with surety that violent behavior never results from a single cause.
    Rather it results from a combination of risk factors which include inherited tendencies,
    or nature, versus things like childhood trauma and the quality of home life, or
    nurture (or a lack thereof). This makes every kid different, processing real violence
    and violent media in unique ways. While these factors are different for everyone,
    there are some basic problems that should signal violent media as something to
    avoid.


    What this means in English is that being “exposed” to video gaming isn’t a silver
