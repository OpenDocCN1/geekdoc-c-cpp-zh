    Maressa Orzack, Ph.D., is an assistant clinical professor at Harvard Medical School
    who founded a hospital-based treatment program for computer addiction. She has
    stated that game designers carefully orchestrate principles of behavior psychology
    within games in order to create addiction. Dr. Orzack identifies the process of
    character progression and the in-game reward system as one aspect of operant conditioning,
    intentionally being structured into games. Stating that forty percent of MMORPG
    players show signs of addiction, she goes so far as to state, “The MMORPG is an
    addictive drug that needs to be regulated.” Orzack should be able to recognize
    operant conditioning when she sees it; during her years of early training she
    worked with the groundbreaking behavioral psychologist B.F. Skinner, the originator
    of the formal theory of operant conditioning in the 1950s and 1960s.32 The tenets
    of operant conditioning are simple. Gamers can easily recognize them in games,
    where they’re referred to as the dings, the little rewards that we get. Skinner
    viewed human motivation and resulting behavior as a very simple system of reinforcement,
    extinction, and punishment. A reinforcer is easily understood as a reward one
    gets for a desired behavior. A punishment is something designed to stop a specific
    behavior. Extinction is when a behavior is ignored — neither rewarded nor punished
    — and eventually stops on its own. Obviously, behaviors which result in rewards
    occur most frequently.


    Skinner developed his theory by experiments conducted with what is now called
    the Skinner Box. A rat or pigeon confined in a box would be rewarded with food
    pellets for pressing the lever a certain number of times and in certain patterns.
    By using different patterns of reinforcement, Skinner was able to get the rat
    to press the lever almost continuously. The principles of the Skinner Box have
    been creatively adapted by game developers who understand the ding principle and
    have taught us that there are certain ways to arrange goals which make it far
    more likely that video game players will keep coming back. Rewards are given in
    video games on a near continuous basis, through the gaining of experience points
    (xp) which allow for your character to level regularly. At first, most games hand
    out these first rewards like some grandparents give out cookies and candy. It’s
    a lot of sweets and they’re usually pretty good. In the game, every'
