  md: 'As it happens, in the last few years we''ve observed some interesting things
    about the brain''s ability to pick up these new senses. Some technologies help
    blind people to see using only pinpricks on their tongues. Some similar technologies
    have displayed visual images by placing pads on a person''s back. Some senses
    have even been created — those which no human being has known to have. When technology
    creates ways for us to see or experience something new, how often do we want to
    give that up? Craving access to technology like the internet, telephones, even
    games, might be tied to the brain''s desire to keep in contact with the senses
    we learn.


    From studying people who''ve lost limbs, we know that their minds have the capacity
    to "feel" their presence. We call this phantom limb pain. Many people desperately
    want these pieces of themselves back, even long after they''re gone. By wearing
    a buzzing belt, a British man''s sense of touch allowed him to automatically detect
    magnetic north. There''s space in our brains for many different kinds of senses,
    often all that we really lack is the physical hardware. But what happens when
    that hardware is taken away? "For six weird weeks in the fall of 2004, Udo Wächter
    had an unerring sense of direction.... [He wore] a wide beige belt lined with
    13 vibrating pads — the same weight-and-gear modules that make a cell phone judder.
    On the outside of the belt were a power supply and a sensor that detected Earth''s
    magnetic field. Whichever buzzer was pointing north would go off. Constantly."23


    The man wearing the compass belt truly loved it. He felt more confident, began
    realizing new ways that he could improve his life, even had dreams that incorporated
    the buzzing. The attachment caused his mind to rewire other senses, like touch,
    so that they could incorporate this new direction-sense. After the experiment
    ended and he relinquished the device, he was enormously upset, frequently getting
    lost in cities, even reporting "phantom buzzing" on a par with the phantom limb
    pain experienced by amputees. Other users who lost use of the belt reported feeling
    dizzy, disoriented, and a sensation that the world had become less predictable.


    Was removing the belt tantamount to taking away a newly grown limb? More importantly,
    what does the mind lose when such a limb is taken away? What kinds of effects
    could that have on human psychology as we know it?'
