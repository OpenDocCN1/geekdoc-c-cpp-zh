  md: 'easier when you, at the very least, understand the basics of these three self-skills.
    These are a simplified way to conceptualize self-regulation. They largely develop
    in childhood, though they can be remediably developed by adults who are adequately
    motivated. These three skills work together to fuel someone’s ability to stay
    emotionally balanced and mentally healthy; they’re the foundation for functioning,
    and problems in any one area can cause a domino effect.


    People who are self-aware are conscious at all times of what they are feeling
    with their *emotions*, sensing in their *bodies*, and thinking in their *minds*.
    They can say fairly objectively whether they’re doing things that are going to
    cause problems. Self-aware people recognize not only what is happening in the
    physical environment they are in, but also what is happening in the emotional
    environment of others around them. For all that, awareness is just about the present,
    what’s happening in the here and now. Though it may sound like self-awareness
    is something that just happens for most people naturally, in reality many people
    are not very good at understanding their own emotions, how they think, and the
    state of their bodies. Unfortunately, not understanding yourself tends to mean
    that you’ll also have a hard time understanding others.


    Self-awareness is a skill that to a large extent is developed in childhood, when
    we start to associate words with our different feelings, like angry, happy, or
    discombobulated. Have you ever noticed that children and teens say that they’re
    “bored” a lot? A large part of this is that it takes them time to discover and
    associate better words with other feelings, if they ever really learn them at
    all. If we’re tuned in to our own feelings as well as to what we’re thinking,
    then this opens the door to a better understanding of why we do what we do. We
    might know that gaming for six hours got us pumped, but we might also know that
    it made us feel uncomfortable emotions.


    Not all people develop enough self-awareness, because parents who aren’t themselves
    self-aware can’t help their kids to develop in that way. This results in people
    who walk through life in a state of partial awareness. They often experience unpleasant
    emotions and then do things to cope that aren’t ultimately all that constructive.
    They often make choices that don’t work out well, never quite knowing why.


    Let’s say that we’re walking around in a chronic state of mild depres-'
