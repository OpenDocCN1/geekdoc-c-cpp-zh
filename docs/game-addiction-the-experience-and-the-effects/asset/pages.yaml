  md: '# AFTERWORD


    at the time). We initially played MMOs together, then I set out on my own. For
    over two years I embodied various avatars, most commonly as Evanon, an elf in
    fantasy MMOs. I played a lot. Sometimes I played too much. I don’t know that I
    crossed a line into something that could be described as addiction, but I certainly
    came to understand how easy it can be. I did meet many other people in the games
    I played who were having serious problems because of excessive and out-of-control
    playing. I discussed their concerns at length with them.


    As a middle-aged psychotherapist who also happened to be an elf, I know I attempted
    to maintain a certain observational view while playing. I really wanted to know
    the people behind their avatars, learn about their real lives, why they played,
    and what they found so compelling about the gaming process. I met people my own
    age, some older, and as in every life, most seemed to be going through some kind
    of real-life struggle that they’d chat about once I got to know them.


    Even through avatars, people seem to strive for positive human connections. In
    many ways intimacy comes more quickly when it’s anonymous and partly based on
    fantasy. It’s also a human need to long for adventures, and they can certainly
    be more compelling in an immersive game. When I say “The most beautiful places
    I’ve ever visited on vacation were in virtual worlds,” I’m only partly joking.
    I hope that this book stimulates curiosity, as we’ve done our best to be observers
    as well as participants in virtual worlds and to recount our own and others’ experiences.


    As much as I can say I’ve loved gaming, I have to admit there’s the flip side
    of that coin. When I’ve seen gaming contribute to others’ emotional and real-life
    relationship deterioration, I’ve felt that there is something terribly wrong with
    the process. When I see people manipulated by game mechanics which work beneath
    the level of their conscious awareness to keep them hooked into some nonsensical
    task hour after hour, I’m angry. The more I know about the brain and the developing
    mind, the more concerned I am about the future.


    Game developers create the worlds in which people live, and in that way, they
    have close to god-like powers. What kind of worlds will such powerful people choose
    to create, and what are the explicit as well as implicit messages about humanity,
    the way we co-exist in the world, the kind of persons we become? Each virtual
    world comes with its own culture,'
