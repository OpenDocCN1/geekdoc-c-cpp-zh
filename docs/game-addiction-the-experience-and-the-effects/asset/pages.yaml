  md: 'separates fun from this kind of escapism. If a good game can pull us in, does
    a responsible game then help us to get back out again?


    A major part of the challenge being called “game addiction” has nothing to do
    with addiction. It has to do with the fact that our puny human brains have a difficult
    time being in two places at once. Going between these primary and the secondary
    realities can be perplexing. Even before we talk about addiction, whether in neurochemistry,
    psychology, or any other area, we’ve got to acknowledge that the gaming experience
    alone can exert a forceful pull, even with the simple tradition of immersion.


    More than anything, secondary worlds challenge us. On the one hand, they aren’t
    just letting gamers play as heroes and villains. Games are capable of connecting
    the world’s living rooms. We can taste the glory of being a hero, the pain of
    the villain, all in worlds that lack the finality of reality. Sometimes it’s this
    experience of playing the hero that gives a gamer far more inspiration than any
    piece of literature or film could ever hope to deliver.


    Though immersion into a game is a prerequisite to addiction, the opposite isn’t
    always true. Even though video games are only a few decades old, they’ve already
    woven themselves deeply into our reality. Right this second, people are playing
    online with good friends and lovers. Sometimes they also play with people who
    make their lives more difficult. Gamers play with people from all around the world,
    and the choices that they are making right now could have major implications for
    the technologies everybody will be seeing in just five or ten years. Video games
    are just pictures on a screen, but they have far-reaching effects which most people
    just don’t grasp yet. Games are compelling. A lot of that comes down to how our
    physical bodies make sense of the illusions that they see on the screen. They
    seem real. Sometimes, they actually are.'
