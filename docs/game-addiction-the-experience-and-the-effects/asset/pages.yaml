  md: 'be an issue. The technology that puts people''s faces onto a television in
    real time, which you could loosely call “telepresence,” will almost definitely
    be a standard home appliance before long.² Today’s gamers have to wrap their minds
    around the idea of presence right now. Games pull the curtains of a window, one
    which lets you and your friend look inside the same illusionary world together.
    Each of you then plays the puppeteer, controlling the detailed and intricate movements
    that go into the business of dragon-slaying. Or spaceship construction. When just
    anyone is given the ability to look in, puppets or not, some everyday folks will
    have problems with balance.


    As far as artistic expression goes, game design is still a long way from mature.
    We’ve done a lot of really neat things, but even games that look radically different
    will often use tired concepts that date back at least to D&D (for instance, “hit
    points” and “random damage”). The storytelling isn’t much better. Plot in most
    games rarely attempts to go beyond “You are a gun-toting space marine. Kill everything.”
    We have games that let players control gun-toting space marines from a first-person
