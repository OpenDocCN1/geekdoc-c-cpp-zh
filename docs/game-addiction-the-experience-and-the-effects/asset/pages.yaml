  md: 'adventures — from swords and sorcery to spycraft and murder mystery. Early
    gamers would then take their heroes into these adventures, rolling dice in order
    to make things like combat, or how much treasure they''d get. We eventually called
    these paper and dice games: gamers wrote down their hero''s (or villain''s) details
    on pieces of paper and most owned impressive inventories of dice. It became ever
    more fun and easy to enter these different situations, we arrived at the notorious
    Dungeons & Dragons (D&D) franchise, which survives to this day. D&D''s creators,
    Gary Gygax and Dave Arneson, both became proponents and icons for the gamer culture.
    In his book *Master of the Game*, Gygax wrote that the only valid purpose of gaming
    was to provide entertainment.¹⁶ In the days of D&D, these strategic systems were
    so well refined that many of today''s most advanced video games have changed them
    little. Some game developers abide fanatically by the actual Dungeons & Dragons
    rules.


    In many ways games like D&D got people envisioning designs, but computers made
    this adventuring all the more easy. Computing power gave the game designers the
    blank slate that they needed for testing innovative ways to have these experiences.
    From Pong to Mario, every big advance in processing invited a new game designer
    to step in and wow us. Nowadays, with incredible computers and a massive backlog
    of old games, the game designers have innumerable tricks that they can use to
    make a game fulfilling. Where the designers once had to shape their imaginations
    to work around the technology, the technology has advanced to the point where
    it could work around imagination. Designers can re-create paper and dice systems
    or make shopping cart drag-racing games. Even though many contemporary game designers
    just replicate the game designs and themes that sell best, there''s an incredible
    creative potential out there. The game that''s been designed to be enjoyable is
    the first big advancement, or ingredient, that we refer to when we say “game”
    or “play.” It''s the experimental element, a technology that has enormous potential.


    The second secret ingredient comes from a video game''s social element. Games
    connect people. Gary Gygax wrote that without that connection, our experience
    of a game suffers: “...Its drama is less intense, its dangers abstract, its triumphs
    shallow.” So imaginative minds took video games online. As early as the 1970s,
