    In his visits to the local zoo, famous thinker Gregory Bateson observed that monkeys
    seemed to know the difference between “play fighting” and the real thing. While
    playing, dogs, monkeys and humans don’t just nip, bite or punch, respectively.
    They also have an extra kind of language, subtle little hints that basically also
    say “we’re not fighting.” It’s what he calls metacommunication.25 Though a big
    word, this is an easy concept. Metacommunication really means that two or more
    people are sending each other small cues. These cues just hint at the bigger picture.
    So a man might be fighting with somebody, but sometimes he’s also making other
    gestures that show his sparring partner that it’s “just a game.” Alternatively,
