    After precious few other events, I was staring into that game again, taking cantina
    dancers on intergalactic shopping sprees, outdoing all but a handful of other
    merchant-barons, and battling Jedi with my regular, non-Jedi character.


    For twelve hours at a time I wasn’t consciously aware of the part of me drinking
    coffee by the pint, eating little, and losing weight at a steep pace. The pull
    to play almost seemed to come from outside myself; my eyes in no way transfixed
    on a simple computer monitor. Rather my attention went between collecting lightsaber
    crystals, obtaining art and artifacts for my business, and sauntering from battle
    to battle, never really taking time away from mortal danger.


    And then my attention was focused on the 23-inch, fifty-pound computer monitor
    that sat on a hardwood floor, surrounded by detritus. It was the first and last
