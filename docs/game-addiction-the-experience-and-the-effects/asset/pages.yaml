    Neuroscientist Joseph LeDoux is famous for his paraphrased quote, “The neurons
    that fire together, wire together.”25 When we do two things in tandem, especially
    when we do them a lot, connections can be forged deep within the brain.


    Kids arrive in the world with amazing potential to make synaptic connections between
    different types of neurons. As a child continues to perform certain activities,
