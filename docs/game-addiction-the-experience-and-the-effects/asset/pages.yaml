    our attention between the traffic and the talker. When the road gets particularly
    perilous, we''re more likely to tune out the conversation so that we can avoid
    danger. We switch. The talking goes to the more automatic, the "autopilot." If
    we find out that our friend''s father just passed away, we''re more likely to
    tune out the road, giving sympathy to our friend. We switch back. The driving
    goes to the "autopilot." In that sympathy example, driving becomes a lot more
    dangerous because we''re most likely relying only on our instinctual visual sense
    in order to pilot the vehicle. No matter how great and mighty someone''s talking-while-driving
    skills may be, there will always be risk. Ironically, if we want to pay attention
