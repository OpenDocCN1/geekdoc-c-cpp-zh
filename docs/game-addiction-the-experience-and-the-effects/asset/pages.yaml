    gaming websites so as to complete quests and find items, learning the English
    language so as to better cooperate in-game, or aiming technical skills at improving
    the computer and game interface, games are effective teachers because those skills
    are the gatekeepers to uncharacteristically high rewards. Claiming the ability
    to forge games into a silver bullet of knowledge seems the aim of a corporate
    alchemist. As Jane Healy says, “Children still desperately need our human presence:
    as parents, teachers, loving models and mentors.... The simple fact is that children
    crave their parents’ love and attention far more than anything else.” We all start
    with certain basics, but we’re all always learning. When a child is left to wire
