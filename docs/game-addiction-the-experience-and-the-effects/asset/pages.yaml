- pgno: 26
  md: 'Some whole countries already revolve around cell phones, using them as credit
    cards and book readers. Many of the bestselling books in Japan are downloaded
    and read on mobile phones.22 No matter the country and no matter what we mean
    by “game,” most people are looking to be entertained — which has until now been
    looked on as legitimate.


    With gamers around the globe, one of the most interesting things to look at is
    how, and whether, they play socially. There’s some question over the real level
    of connectivity between gamers who only know each other online. For players meeting
    in reality as well as online, especially in Asia, the cybercafe’s become a kind
    of Mecca.


    Though she’s always been around video games, Canadian researcher Florence Chee
    says she “never thought they would be anywhere near a career.” The more that Chee
    saw gaming problems represented in the media, the more that she felt they were
    building up a kind of “myth of the addicted gamer.” The word addiction was being
    bandied around in a way that she remembers as “all too cavalier for my liking.”
    As she continued with her own research into games, however, she was inspired by
    the nuanced research produced by academics like T.L. Taylor and Ted Castronova.


    She explains, “What they really did well was drive home the many facets of gaming
    in cultural and economic terms, lending insight to what was an obscure world rife
    with superstition and folklore such as ‘One click and you’re addicted.’”


    That lead Florence to her own research, during which she remembers coming across
    stories of South Korean gamers and their reported notoriety for gaming addiction.
    Eager to know if the sensationalism was warranted, she took intensive language
    courses and saved for four months of field research.


    Influences from our local cultures, according to Chee, are impossible to remove
    from the parts of our lives we spend in games. She emphasizes this by bringing
    up the writings of Clifford Geertz. “He asserts that beyond the brush strokes
    and the technical understanding of the form of art, one must understand the cultural
    context from which it emerges. An example he uses is that it is impossible to
    understand Arabic poetry (in Morocco) without understanding the Qur’an. That said,
    play is a part of culture, and the way people play is inextricable from their
    everyday life.”'
