  md: 'During infancy, toddlerhood, and the preschool years, roughly from birth until
    age four, children are growing brains in ways that allow them to become aware
    of themselves as human beings.⁴⁹ They’re learning to understand and control their
    bodies. They think concretely and learn experientially. We’re talking the basic
    basics, like the perils of gravity. By emotionally bonding with and learning to
    trust caregivers, they’re building the *fundamental* foundations of emotional
    development. Learning through their sensory systems, like eyes, ears, and touch,
    is *critical*.⁵⁰ Kids need lots of physical contact, movement, and the opportunity
    to explore the world with their bodies. They initially communicate by crying,
    a period of glee for parents everywhere. Later, they gradually progress through
    phases of rudimentary language development. They are driven to manipulate objects
    around them, stacking things, dropping things, pushing over vases, and tasting
    what the cat made.


    All this activity is categorized as *play*. It’s unstructured, spontaneous, and
    driven by the child’s need to learn. As trendsetting Italian educator Maria Montessori
    said, “Play is the child’s work.”⁵¹


    During their early years kids are not able to play *with* other children. They
    don’t have skills for interaction and aren’t aware that the other person has needs
    and feelings too. Jarod hits Justin over the head when he wants the toys Justin
    has been playing with. Jarod screams and bites Justin. This is entirely normal.
    Social play doesn’t develop until the upper preschool years. Around that time
    kids begin to develop the awareness (through synapses and neural pathways) that
    allows them to play cooperatively with other kids.


    Morally, young kids see themselves as the center of the world. They don’t have
    an internal sense of right or wrong. If they did, then they wouldn’t make noise
    during an opening night showing of anticipated movies like *A Knight’s Tale*.
    What they do learn is that certain behaviors—like hitting baby sister—will result
    in punishment. During these years kids learn primarily by physical exploration
    of their world and through imitation of those around them. In short, kids learn
    through play.


    Good preschool education, either at home or in a formal setting, should allow
    a wide array of toys for manipulation that allow for the natural development of
    skills that are necessary precursors for the development of reading, math, and
    getting along with others.⁵² Young kids aren’t'
