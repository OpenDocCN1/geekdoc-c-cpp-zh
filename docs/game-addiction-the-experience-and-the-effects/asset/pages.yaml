    Is staying on the move the key to enjoying games more generally? With all of the
    different games out there, players can take what they''ve learned in one game,
    put it to use in the next, and enjoy the thrill of putting those puzzle pieces
    together. There''s a satisfaction in entering games, learning how they work, and
    understanding what it is that you''re learned.


    But this game learning isn''t the same thing as picking up French, Russian, or
    particle physics. Well-designed games don''t pull people in with book learning;
    instead, what they''re doing is making it fun and exciting to learn the adventure
    of your choice.


    This is easy learning, idealized learning, usually with happy endings. In seeking
    fun, we pick up skills incidentally. We may learn to navigate a new type of interface,
    learn tidbits about ancient Chinese art, but more for the pleasure than to obtain
    skills. The problem here is that by creating easily learned and ultra-satisfying
    realities, we may be creating bad standards for when our actual bodies need to
    learn primary world lessons. If we get used to real-feeling worlds which are ever
    easy to master and satisfying to be in, worlds where we get to choose when and
    where we get what we want, then does this make painstaking and difficult real-world
    learning even less attractive? If it''s a choice between learning that Russian,
