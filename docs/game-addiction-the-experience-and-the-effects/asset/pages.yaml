    So far we''ve just talked about the platform where you play your game and who
    you''re playing with. Also important are what you do inside a game and how you
    do it. A lot of game makers thrive by making new and innovative kinds of experiences,
    and many games mix and match from the following types. For now, we''re going to
    refer to this "point of the game," or what you do and how you do it, as gameplay.
    While gameplay is a complex'
