    called a complete immersion into a secondary world enchantment, saying that while
    not a dream, enchantment allowed one to wholly enter into “a dream that another
    mind is weaving.”⁶


    There is also something magical, almost sacramental, about when someone is able
    to create one of these worlds. When one creates a world that another living human
