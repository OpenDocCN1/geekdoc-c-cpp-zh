  md: 'Purely from a biological standpoint, the processing of words is less immediate
    and less instinctive than seeing.¹² Humans process sight very quickly, and language
    is often divorced from other senses. During regular experience, when we’re off
    in the real world doing our thing, certain kinds of sensations get sent to different
    parts of our brains, what one Harvard professor, Steven Pinker, has called modules.
    In his book *How the Mind Works*, Pinker notes that the sections in our brain
    where we process sight and language are necessarily separate.¹³ Text is largely
    interpreted in the relatively advanced prefrontal cortex. While this is an area
    in the brain responsible for higher thought, it isn’t the part of the brain that’s
    going to let us have visceral, emotional and automatic responses.


    Many prominent neuroscientists agree. Antonio Damasio, considered to be one of
    the world’s leading experts on the human brain, has said that language processing
    necessarily happens separate from processes like sight.⁴ When speaking with a
    friend, you might see their facial expressions, hear their words and also understand
    the deeper meanings of what they’re saying. Things flow naturally. However as
    Keith Kenneay, a scholar in visual communications put it, “In effect, it is a
    trick of timing.” The brain puts those sensations together for us.⁵


    Whatever the brain does, it tends to do a good job. On a practical level, speech,
    image, and imagination work together without much fuss. Sitting down to read we
    can “see” what’s happening in a book. In the magic of media experience, people,
    places, sights and even smells can feel so real as to be utterly convincing. Your
    mind can almost leave your reality in order to enter one created with a paper
