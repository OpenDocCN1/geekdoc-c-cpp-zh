  md: 'getting big teams of people designing 3-D games, graphical systems that let
    up to a dozen or so people play cooperatively or competitively.


    Then designers started to experiment with huge, virtual online worlds. Today these
    are known as massively multiplayer online games, MMOs or MMORPGs for short. The
    story at the start of this section dealt with the MMO World of Warcraft. When
    thousands of people could come online and play together, these worlds really became
    a different kind of game. They were persistent, online most all of the time. Unlike
    a book, a flight of fancy that paints pictures in your head only so long as you
    read, these games had become a kind of place.18 Like a 24-hour diner, you could
    stop by and have a sandwich, but the place doesn''t open up or close down on anyone''s
    schedule.


    These persistent online places didn''t have to be particularly well-designed;
    some were and are just big social spaces. Today these are worlds like Second Life
    or There.com; in the days of MUD games they were spaces like LambdaMOO. People
    in purely social worlds may not log on expecting the latest graphics, or the most
    thrilling of game design. If they did, they''d probably come back to reality a
    little bit disappointed. We label these worlds "games" because they combine a
    persistent world with the 3-D visual graphics developed over the last decade,
    but there''s a difference. Just having a persistent 3-D community isn''t the same
    thing as having a pre-designed and satisfying game. You can walk and talk in most
    of these worlds, but they''re a different technology: much more like a living
    room, a social experience rather than a kind of game system.


    Other persistent worlds combine connectivity with game design. Mixing these two
    secret ingredients creates something strong. Once the designer makes our experiences
    inside a persistent world more game-like, more about the fun of playing, we start
    to see a space less about using these technologies to create an online living
    room. Instead, the other people are there to make the game seem more important.
    The Digital Leveling Room, consists of games like Ultima Online, Everquest, Star
    Wars Galaxies, Final Fantasy XI, and World of Warcraft that provide a social world
    that is also designed to make character progression rewarding. As gamers get the
    social status, skill levels, and swords that they need to play the game well,
    they''re rewarded with increasing gratification and satisfaction. These games
    provide the best of both worlds—that feeling of'
