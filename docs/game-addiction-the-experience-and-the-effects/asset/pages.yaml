  md: '# # PREFACE

    by Neils Clark


    I stared transfixed. A six-hundred-dollar computer monitor sat on a dingy hardwood
    floor, and I knew that I had been hunched over it for the better part of that
    day, most of the week, and all that summer. I was playing one video game twenty
    hours a day, and it seemed normal up until that night. There was probably an hour
    of silent staring. I left for graduate school the next week, without a computer
    and unable to shake that night''s feeling of shock.


    My name is Neils, and even though I''ll tell you a little bit about the people
    I''ve murdered, the woman I married, and the millions that I''ve made in video
    games, this book isn''t strictly about any one person''s story. This book was
    born out of an attempt to make sense of gaming addictions through research. As
    it matured, it became clear that tens, if not hundreds, of millions of people
    around the world were killing, working, marrying, and feeding on video games.
    Their stories, in many cases told through their eyes, are used to augment and
    clarify the game-effects research accumulating across fields that rarely attempt
    communication, let alone collaboration.


    Right now there''s really no way to know whether video games, television, or even
    the world''s massive entertainment culture will be a force for positive or negative
    change. What we do know is that things are changing. An eleven-year-old Vietnamese
    boy strangled an 81-year-old woman for the equivalent of five U.S. dollars, then
    buried her under a thin layer of sand in front of his house. Questioned by police,
    he said that he needed the money for items in a video game. This coin has two
    sides. An eight-year-old Norwegian boy saved his younger sister''s life by putting
    his own life at risk, threatening an attacking moose and then feigning death once'
  merge: -1
  img_proc: true
- pgno: 10
  md: '# PREFACE


    it began attacking him. Questioned later, he said that he learned those skills
    in a video game.


    For me, starting to play too much didn''t have much to do with the usual explanations;
    my excuses weren''t attributable to some manic imbalance, nor a childhood that
    was too psychologically traumatic to mention. My childhood was charmed. Though
    I can''t say for certain where problems with gaming started, I do remember one
    summer when I was about nine. My friend down the street, Jason, had a brand new
    Super Nintendo. I remember greeting him at the door, sitting down to play for
    a few hours and then refusing to get up when everyone left to play with water
    guns. Something about Mario seduced me—God only knows what. The thing that I do
    remember is Jason''s father coming home. I remember the hot stinging of embarrassment
    when he asked why I wasn''t playing with his son. I don''t remember my reply—but
    I do remember what he did: Nothing.


    This book is neither pro-games nor anti-games. Above all it''s about how we experience
    games and what they really mean to us. What''s happening can''t be solved by just
    loving or hating the technologies surrounding the worlds online. We have to understand
    them and, as much as possible, enter this next generation with more personal responsibility
    in using them and more professional understanding in making them. What''s drawn
    a few types of people of my generation into games — is already pulling almost
    the entirety of the coming generation into the offspring of games. We can''t take
    back any of these technologies and addiction is just one blip on the radar of
    how they will change our world. But for better or for worse?


    I don''t think that gamers are bad, because I don''t think that I am bad. Gamers
    have experiences the likes of which very few people in our history have been afforded,
    wherein they can play the parts of good, evil, or morally grey characters. The
    theatre is digital, but the other puppeteers still bleed when their hearts and
    minds are cut too deeply. Gamers have had incredible experiences; they could do
    incredible things.


    In his book on "the virtual worlds exodus," Ted Castronova was surprised by the
    crew of the starship Enterprise, in the famous television show Star Trek: Next
    Generation, only used the holodeck every so often. If you''re not familiar with
    the holodeck, it was the ultimate video game: it was photorealistic, all of the
    senses were stimulated, and it could recreate any'
