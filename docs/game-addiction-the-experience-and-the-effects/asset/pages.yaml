  md: '# APPENDIX A.

    HELPFUL ACTIVITIES DURING

    THE PROCESS OF CHANGE


    If you''re in *precontemplation* you are probably not reading this section of
    the book. In your mind it doesn''t apply to you. So let''s move on for those who
    are in contemplation.


    If you are reading this section and feeling curious, you might start by writing
    out what your life goals are, as specifically as you can. Start with where you''d
    like to be in a year, then in five years. Would you like to have a different job,
    finish school, or be in a relationship? Would you like to live in a different
    place, have a savings account, or have traveled? Write it all down. You''re only
    thinking about it, after all.


    In *contemplation*, it''s helpful to add up the total hours you have spent gaming
    —*during your entire life*. Turn that into days, then into weeks, then into months
    —maybe years. Notice how you feel about that. Make a list of other things you
    could have done with that time, things that would have helped you achieve some
    of the goals you''ve listed above.


    Pay attention to your emotions. Write down what you notice. How might you be using
    gaming to deal with feelings? Do you play to relax, to get away from problems
    in your life, to feel a sense of being competent, to achieve, or to be "the best"?
    Emotions and needs motivate all behavior, but this is generally happening out
    of our awareness. It''s helpful to talk to others who are supportive and to read
    forums online like "WoW Detox." By hearing others'' stories you will find things
    that click with your experience. Communicate with others about what you are learning.'
  merge: -1
  img_proc: true
- pgno: 176
  md: 'Write out the pros and cons of gaming that you see apply specifically to you.
    The goal here is to increase awareness and to realize that you have choices.


    In preparation, you have decided you are going to change. You may know you need
    to quit, or at least get out of MMOs. It’s helpful to make a list of things you
    used to do that you’ve given up, and decide which activities would feel good to
    pick up again. You are starting to realize how you’ve been using gaming to meet
    internal needs, and you need to plan for what you are going to do in the future
    to get these needs met. You are continuing to seek out social support for making
    the change and talking to others who are supportive. If you are socially isolated,
    consider talking to a therapist. If you can’t do that, spend time in support groups
    online daily. Reach out to others in places such as www.gamerwidows.com. It’s
    hard for most people to make the jump to action on their own.


    In action, it’s important that you have a plan for your time each day that includes
    specific positive activities. How much time can you spend getting out of the house
    with friends? Write it down each day. Plan one thing each day to make yourself
    feel competent and in control. Plan one thing each day that helps you relax. Plan
    one thing each day that helps you move toward the life goals you set for yourself
    in the contemplation stage. Distract yourself when the urge to game is there.
    Watch a movie, experiment with cooking, get outside in nature. Read a book that
    captures your imagination. Keep writing down your feelings and thoughts, and talk
    to supportive friends. Learn to be open. Expand your mind and move your body.
    Plan one new activity a week, something you’ve never done before. Stay away from
    the computer. Make a list of things that might set off the urge to go back and
    binge in a game.


    In maintenance, be alert. Follow the path you have created. Observe yourself.
    Keep doing what needs to be done. Watch for warning signs, and if you notice them,
    make specific plans for what other behavior you are going to do. Put your experience
    into words, talk to others, write it down. Name what you feel (“bored, tense,
    angry, lonely, self-critical” etc.) and do one thing that will help each feeling
    you are having.'
