- pgno: 25
  md: 'stepping inside a lasting and populated space, but also heavy helpings of an
    entertaining game. It’s like that 24-hour cafe from earlier, only it specializes
    in serving hot bliss. And this is a pretty cool way to advance the living room.
    Today’s gamers enter the space, have a powerful experience, and their accomplishments
    last. What’s more, those accomplishments are waiting patiently for gamers when
    they start their next gaming session, sometimes along with the other living people
    that they’ve been playing with. The digital living room is something new, a game
    which arguably causes the most problems for balancing reality and illusion.


    As the look and feel of gaming changes, especially in the next few years, we’re
    going to see some major changes in where gamers can play and how they do it. In
    the past they used chunky little controllers and bulky computers. Now computers
    are smaller, faster and in many more places; the face and physicality of gaming
    is already starting to change. There are dancing pads which, in games like Dance
    Dance Revolution, make an entire game out of our footwork. The Nintendo Wii lets
    us swing a controller in order to simulate tennis, bowling and fishing. The Wii
    Fit adds a lot of the functionality you’d expect from dance pads. The next generation
    of games and gaming systems won’t just connect us to friends around the world.
    More games are going to involve getting up and off of the couch.


    And maybe even out of the house. In countries around the world, people interact
    and play in more places than just their living rooms; tomorrow’s “living room”
    might stretch across many different kinds of places. In Singapore, for instance,
    there’s an entire industry that seems to be built around the concept of getting
    out of the house. Gamers convene at 24-hour shopping malls, 24-hour gaming cafes,
    but rarely, it seems, at home. In Seoul, the biggest city in South Korea, it’s
    hard to find a single city block that doesn’t have at least one PC room. Especially
    with denizens of the younger generation, these places are often packed full of
    people looking to talk with friends, play games, or to escape a cold and rainy
    night, even after every other social space has closed.


    While for many the living room has been a place of passively sucking down television,
    gaming will keep increasing our options. It already has for many, cutting across
    cultures in startling ways. For cultures that revolve around getting out of the
    house, gaming will follow the people.'
