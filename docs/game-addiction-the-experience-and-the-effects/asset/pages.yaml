  md: 'While plain old offline games might just pull you in with the immersions we’ve
    already talked about, games that take players online raise the bar. They added
    to all of this a level of realism that regular gamers can’t; they put you into
    a world that is, for lack of better words, really real. It’s a strange thing,
    but sharing this space with other real people takes it beyond just illusion. It
    really can be like walking into a 24-hour diner in the primary world. What happens
    to the mind when it gets ordered around by a boss and a wife in one world, and
    rabbits and trolls in another? What about when the boss is actually playing the
    rabbit and the spouse is playing the troll? Components of the primary and secondary
    worlds are being mixed, confusing the senses.


    Consider the thoughts of Gregory Bateson, the older scholar whom we brought up
    earlier. He wrote, “A man experiences the full intensity of subjective terror
    when a spear is flung at him out of the 3D screen or when he falls headlong from
    some peak created in his own mind in the intensity of a nightmare. At the moment
    of terror there was no questioning of ‘reality,’ but still there was no spear
    in the movie house and no cliff in the bedroom.”35


    The spear is still illusion, but what happens when five other people saw the same
    illusion? It’s a hard question to answer: when an illusion is shared, is it really
    still fake, a facade? If that spear hits you, and causes some headaches for a
    group of other gamers that you’re with within the game, then are you still just
    playing a game?


    The digital living room, simple secondary worlds that allow these kinds of social
