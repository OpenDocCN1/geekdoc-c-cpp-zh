- pgno: 180
  md: 'Multiplayer online games are often just single-player or multiplayer games
    that can be played by a few people over the internet. PC games like StarCraft
    and console games like Halo are both made to be played online. Oftentimes a single-player
    game like Halo will be attached to multiplayer games. These can teach players
    the background story, get them familiar with the nuances of the game, or simply
