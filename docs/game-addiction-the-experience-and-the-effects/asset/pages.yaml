  md: 'Immersion doesn''t necessarily have to mean that we''re becoming the character
    that we play. How much does somebody become their favorite television show host
    or comic book character? What immersion means (in adult humans with healthy brains,
    anyway) is that we see visual experience for what it is. If we''re playing Halo,
    then we have an experience of actively shooting aliens. We live the action. If
    we watch a television action hero shoot some people, then that becomes a passive
    experience of just watching. Both can keep us watching, can immerse us purely
    through visuals. When you watch enough of one show, or read enough of a comic
    book, it can change how you react, your understanding of different situations.
    You might and might not approach them as a wiser person.29 Experiencing something
    firsthand, as with a game, is no different. You don''t become the hero or villain
    from your story, but you have been in their shoes nonetheless.


    But notice that, whether the experience changes us or not, the chief concern is
