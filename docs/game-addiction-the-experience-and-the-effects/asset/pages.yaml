  md: '# No Escape


    “It took me a long time to learn how to move around,” says Dr. Angeline Khoo,
    recounting her first time in an MMORPG. “It seems so silly now.” When I first
    met Dr. Khoo, she struck me as the kind of university professor who makes college
    worth the tuition. With a desire to go beyond just the “games are evil” mentality
    of the late nineties, she stepped outside her comfort zone. She took the time
    to play.


    Khoo first got into games “without having any intention of staying too long,”
    but, she recalls, “I got hooked! I am still very much in the game.” Though Angeline
    has spent the past 18 years teaching at Singapore’s National Institute of Education,
    one can get the feeling that getting into these games was no easier for her than
    it would have been for my own mom. Though in the game, dark corners and oversized
    spiders frightened her at first, Khoo faced her fears, ultimately using her experiences
    in-game to make serious contributions to the research available. More importantly,
    she has proven that sophisticated games aren’t out of reach for everyday folks.
    Having played them, she sees a bright future for games. At the same time she’s
    become more acutely aware of the challenges.


    “The game world can be both exciting and a warm social environment, but because
    it is so it can become hard to leave it for a more stressful and mundane world
    outside,” says Dr. Khoo. “Hence, excessive play and time management is a challenge—for
    most, if not all players.”


    But does this mean that we have to discount video games altogether? Is it bad
    that this up-and-coming living room invests and involves us in empathy for total
    strangers? Dr. Khoo doesn’t think so. With a grin, she recounts trading turkey
    recipes, mentoring young gamers, and learning more about people from across the
    globe, most especially through quirky cultural exchanges.


    “Recently, I learned about what people do on Thanksgiving,” she says. In having
    these unique cultural moments, games bring us together. Khoo, who is of Chinese
    ancestry, remembers discovering surprising cultural similarities. “I would cook
    and freeze food for my husband when I have to go overseas—I found that one of
    my guildmate’s wives does same thing for him—and he’s in Tennessee.”


    In the end, what strikes me about Dr. Khoo is how deeply she’s been'
