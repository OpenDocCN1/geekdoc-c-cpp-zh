  md: '# # AFTERWORD


    # by P. Shavaun Scott


    There''s tremendous irony in the fact that I spent so many years trying to get
    my sons to turn off their computer games, then became a digital elf myself after
    they''d grown up. I really liked being an elf. Sometimes I miss it, particularly
    on a stressful day when that stack of real-life bills are nagging at me to pay
    them or I find myself looking at a calendar filled with appointments and meetings
    for the day, none which look like very much fun.


    I regret that I didn''t stick my toes into the virtual world sooner, for if I
    had I would have learned a lot more about the reasons people game and the ways
    games can be addictive. I believe I might have become closer to my sons in their
    later adolescent years, and in that process we might have found ways we could
    do more things together apart from screen-based activities. But since we weren''t
    close enough at that point, they bonded with their avatars and did all their traveling
    in the virtual world. I worked.


    When they were younger kids with their console games, and then teens in the early
    days of MMOs, I was one of those typically busy single parents who couldn''t imagine
    that I would find anything “interesting” in a virtual world. It wasn’t until that
    fateful Thanksgiving when they were in their 20s and refusing to come to the table
    to eat, chorusing the familiar “We can’t right now,” that I finally got what that
    meant. I delayed the turkey and sat down between their adjacent computers and
    watched. I was entranced.


    I wanted to do what they did, and more. They were eager to include me, now that
    I wanted to be included (I also think they needed a healer'
