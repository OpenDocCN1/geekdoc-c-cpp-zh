    a player spends his time, but they don’t provide the whole story. Gaming provides
    new motivations, the likes of which have few counterparts in the psychology of
    traditional experience.


    As “real illusions,” these gaming experiences are a chimera. They are the mixture
    of an experience that looks and feels like reality, yet is designed to present
    to the player the sensation that they are more. To get some perspective on why
    this is so powerful, it’s necessary to step inside the way-back machine.


    In the 1600s, French philosopher René Descartes noted that the human body wasn’t
    always quite so powerful in its abilities as the mind could be in its ambitions.
    He distinguished between the human body, which he saw as an imperfect machine
    in many ways and, the perfect soul.[21] When a gamer peers into the worlds inside
    his computer, the characters he’s put in control of are, in ways, “more perfect.”
    The gamer is afforded new kinds of skills and abilities, the likes of which can
    empower a gamer on levels that may flit just beneath their conscious awareness.
    Cheating death, jumping great distances, going warp speed, we could fill this
    entire book with examples of gaming abilities not possible for your average contemporary
    human. As repetitive as the book might get, should it be filled with such examples,
    it would only scratch the surface.


    It’s not just that in games we can select the experience we most want; games don’t
    *just* provide agency or the appropriation of gaming skills. Some of a game’s
    pull comes from the nature of the heightened experience. Games provide what might
    best be called a Cartesian chimera. On the one hand, the texture of a good gaming
    experience, the persistence and continuity discussed heretofore, works with a
    gamer’s relative skill at immersion to keep his mind and body from realizing that
    what he’s seeing is illusory on some level.[22] On many levels, it’s no illusion.
    This texture allows an actual form of empowered being. Simply being exposed to
    “more perfect” versions of ourselves, the pure experience of imaginative immersions,
    can be deeply fulfilling. Our minds are set free to explore and exercise heightened
    abilities and senses in a space that still looks and feels real. What happens
    inside seems like any other experience in life, yet provides more intense ability.'
