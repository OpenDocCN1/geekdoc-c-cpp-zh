    It is possible that, at least in some ways, gamers are having more than everyday
    experience? Not only do games trick our senses and immerse us with their texture,
    experiences inside good games are presumably designed to be better on some level
    or another. We enter that other place of entertainment, the theme park, because
    a roller coaster gives us something not normally available during the daily grind.
    The in-game play, the in-game shopping, the in-game sex, if it can be put together
    in a way that’s somehow more pleasing, we might assume that designers will try
    to meet that mark.


    If even the physical experience of play can hold human attention for too long,
    then what kind of power would a world hold if the events which transpired inside
    were always more exciting or meaningful? Most gamers don’t have the first clue
    about how their bodies take in a game; how games immerse them in the experience.
    With physical immersion already acting as a kind of glue, a gamer’s own tangible
    likes and dislikes in gaming, like plot, characters, and gameplay, can bring about
    an invisible undertow. Though most players have an easy time pinning down things
    in a game that excite them, the most powerful motivators often sit just outside
    conscious perception. Even the most seasoned among the ranks of gamers might be
    caught unawares. In an odd way, one such situation seemed to exploit for longtime
    gamer and blogger Dave Yeager.


    # You Can Always Get What You Want


    “I used to joke that I was Jack Thompson for a day,” he muses. For Dave to be
    compared to Mr. Thomson, the outspoken paragon of ignorant and misdirected views
    on gaming, is a badge of honor for those with a sense of irony. Before tens of
    thousands of angry gamers stormed Dave’s blog, Soul Kerfuffle, he recalls his
    thoughts on addiction before any of the madness. “As a gaming geek, I was firmly
    on the side of gaming addiction being total nonsense. Somewhere between skeptical
    and dismissive.” At the same time, he hadn’t seen his friend Andy in awhile.'
