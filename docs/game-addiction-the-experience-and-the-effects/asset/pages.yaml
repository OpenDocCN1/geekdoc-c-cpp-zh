  md: '# Preface (by Neils Clark)


    scenario imaginable. In a simple room, real-feeling and convincing events could
    be re-created. With the ability to enter their favorite experiences as much as
    they wanted, whenever they wanted, Castrovina uses economic theories to say that
    there''s no reason for the crew to have been anywhere *but* the holodeck. Since
    we already have this technology in today''s games, he says, real life will have
    to compensate by becoming more satisfying— otherwise nobody is going to spend
    time running the real-life starship. People won''t engage in society as we know
    it, because it "won''t be for them." Wrong. I''ve played with the people who can''t
    leave today''s Holodeck, and it''s rarely a happy scene. I''ve seen a friend—a
    doctor—give up one of the world''s most prestigious residencies only to move into
    one of California''s most run-down suburbs. I''ve smelled people who left their
    dormitory rooms to buy Husky burgers, but not to attend their final exams or to
    relieve themselves. Some of my best friends in real life started out as my favorite
    rivals in video games. I''ve met some gamers who will leave profoundly positive
    marks on this world, but I''ve seen many more who are consumed by the game and
    then matriculated into the establishment. They don''t demand that life become
    more exciting, that it better suit their needs. They lose themselves, accepting
    the rank and file when they were just months from saving lives as doctors and
    establishing themselves as professionals. And that''s without a holodeck. That''s
    today.


    The crew of the starship *Enterprise* uses the holodeck responsibly because they
    understand how it works. They know the risks, and they know how to balance reality
    with entertainment. That knowledge is not free. It is a hard-won understanding
    that most regular video game players don''t have yet— just like we don''t have
    phasers, warp speed or anything else from the *Star Trek* universe. We''re just
    not there. Most people today don''t understand that video games are here to inspire
    us to make a better reality. They use today''s entertainment to replace reality,
    rather than to feel its cool uncertainty or feel its subtle antagonists. Great
    entertainment can keep us collected and happy in a world where every day is more
    complex than the day before, but without understanding it beforehand we risk losing
    ourselves. This isn''t so much the case with traditional media like books or television.
    This is a risk inherent to video games, one that''s only going to grow alongside
    more sophisticated entertainment. We should definitely take hints from virtual
    worlds, if those systems show us how to'
