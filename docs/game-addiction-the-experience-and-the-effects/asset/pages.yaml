  md: '# The Right to Play


    > “The right to play belongs to everyone.” — Kofi Annan, then Secretary-General
    to the United Nations.


    Kids need play to grow up into healthy adults.⁶⁵ Two-year-olds play with blocks.
    Ten-year-olds play baseball. Kids and their parents play MMO games Second Life
    or World of Warcraft. Eighty-year-olds play brain games on their handheld Nintendos.
    Everybody seems to be playing, but is every kind of play the same? When two six-year-olds
    spend an entire Saturday playing in the back yard, is that really the same as
    spending the same amount of time playing in a virtual world? While it seems obvious
    that video games aren’t always the same as traditional play and that some games
    definitely aren’t for younger kids, can video games give kids the essential play
    that they need to grow?


    Children’s play, even in the very recent past, usually meant some kind of physical
    play, actively exploring the world with the body and the senses. Kids don’t need
    to be directed on how to play; in a supportive environment, they imaginatively
    turn anything into a toy. They create stories in their heads; cardboard boxes
    become castles and sticks become horses. Play in early childhood is critically
    important and should never be looked at as a waste of time. This is the process
    which allows an infant to gradually develop into an adult, and it’s what educator
    Maria Montessori ultimately meant when she said “Play is the child’s work.” This
    is why the United Nations has declared that play is an essential human right.
    But what about video games? Are they the same play that is being defended by many
    of the world’s most influential minds?


    David Elkind believes that “screen play” has completely different qualities from
    “real play.” Besides the obvious fact that you’re not moving around much when
    you’re sitting at the computer, why isn’t “screen play” really the same thing
    as “real play”? According to Elkind, kids are losing out on self-generated play.⁶⁶
    When a kid says to herself, “This stick is a pony,” the stick becomes a pony and
    she plays around with it. When kids have an unstructured environment, then they
    naturally and spontaneously play.


    Unstructured and spontaneous self-generated play, letting our imag-'
  merge: -1
  img_proc: true
- pgno: 147
  md: 'inations run wild, is what grows our bodies and integrates them with our thinking.⁶⁷
    The static and unchanging environments in most games just don’t provide that.
    The games present children with imagery that they can’t change in the same way
    that they change their world during make-believe. When children see the video
    game’s chicken, it’s just a chicken. In reality the chicken can be transformed
    into a troll —all in the mind of a child. Elkind, among others, sees this shift
    as something that could add to poor health and damaged intellectual and social-emotional
    development. Kids, he says, simply need unstructured and spontaneous play to grow
    up to be healthy people.


    In real life, our imaginations start by turning sticks into ponies, and this is
    really just the staging ground for even more imagination. Little girls will have
    tea parties, play house or maraud the high seas as pirates. Young guys will play
    with snap-together building blocks, pretend to be comic-book action figures, and
    will sometimes also get sucked into playing house. Eventually girls and boys play
    video games. While these can take us into stories with more depth, we’ll have
    a very hard time understanding the game, or playing healthily, without first being
    able to flex our imagination muscles. Self-directed play happens without rules,
    without limitations, and in the real world. It helps us to develop our ability
    to reason and to be able to later perceive the difference between reality and
    fiction.


    But we also cannot gloss over how sedentary today’s games are and the long hours
    that some gamers sit. Many games fail at giving kids the physical activity that’s
    necessary to develop sensory integration. If kids only ever sit down for their
    play, then they aren’t going to learn the basics of receiving and making sense
    of their surroundings. They’ll learn to operate inside worlds that require key
    clicks for walking, and not the one where we’ve got highly developed muscles for
    walking. If kids sit too much, then they’re not getting the bare minimum of physical
    activity for their brains to work right.


    But games are changing, especially when it comes to how much players get to be
    creative and how much they get to move around. For now the games that we have
