  md: 'simple matter of one or two mischievous puzzle pieces, then we wouldn’t need
    a book to tell us about game addiction. You’d just have to take those problem
    pieces out.


    There are a lot of things that take games beyond other forms of entertainment,
    but we should start with the two most basic. First, games aren’t as passive as
    other media. Second, they connect us to other living people.¹¹ Games are more
    advanced than even most gamers would probably realize. Gaming technologies have
    been perfected for years, giving gamers the ability to interact and socialize
    on an extremely advanced level. Technologies for interaction and connection worked
    to set the foundations for the gaming experience that we’ve got today. These two
    secret ingredients will get us started on why this word “game” no longer really
    does justice to what’s happening in today’s digital living room.


    Whether you want to call it interactivity, agency, autonomy or anything else,
    the most painfully obvious advancement is that games have taken us past passively
    watching television and reading books. You can watch a car chase on television,
    but it’s kind of different when you’re the one going 150 MPH and outrunning the
    cops in your red Ferrari. With games we’re in the driver’s seat.¹² That level
    of control changes things, making them look and feel different to the brain. The
    physical experience that gamers have comes close to matching what they get through
    reality.¹³


    Games like chess, mah-jong, and dice gambling have been around for generations,
    and there’s a reason that they’re more fun to play than to watch. Being able to
    control the action places our minds into an arena where we can experiment and
    learn without some of the finality that we would get in real-world situations.¹⁴
    Many scholars have argued that playing games is a huge survival advantage for
    the humans and animals that play.¹⁵ Stories on a television screen can inform
    us, but short of reality, a game is what teaches. Being able to see what happens
    when we make those dangerous choices, being able to then make our own spontaneous
    choices has made history’s games inviting, exciting, and lasting. Playing might
    just be in our DNA.


    Our science for creating better-quality games, or game design, has seen some major
    advances in the last hundred years; most notably in the 1950s. When those wily
    nerds started making complicated systems for play-fighting, they challenged young
    people to envision imaginative'
