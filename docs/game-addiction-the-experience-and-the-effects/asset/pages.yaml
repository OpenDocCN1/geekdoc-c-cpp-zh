  md: '# # One


    # # THE DIGITAL LIVING ROOM


    Whether your best friends live in Sydney, Mumbai or just a few miles away, get
    ready for a cheap face-to-face conversation, from the comfort of your own living
    room. With a few clicks of the remote, you and your global friends might opt for
    chit-chat, conversation over a game of cards, a good movie, or your favorite shows.
    However far-fetched that might seem, it’s happening in video games right now.
    Instead of normal leisure, gamers and their good friends are slaying dragons and
    battling aliens. Hundreds of thousands of people are playing inside the digital
    living room right this second. On a whim they can play and connect with friends
    from around the world, in ways that seem like science fiction to many.


    You’re not going insane; this is still a book about game addiction. This book
    is not a sensational rant about how deranged players are sucking on convenient
    heroin dispensers. Nor is it the opposite, a selectively blind eye to what games
    are and how they encourage some obscene levels of play. Current research says
    a few things about what drives people into their illusionary environs, be they
    books, games or anything else. This so-called digital living room is where our
    story begins.


    If you cracked open this book because someone you know could be playing too much,
    then the first thing to know is that you are not alone. Game addiction, spurred
    by any of the causes discussed herein, likely affects a few million internationally
    — very probably more.


    The second thing to know is that gaming technology is about to be part of everybody’s
    entertainment, everybody’s lives. Game makers are working hard to make games simple,
    straightforward, and meaningful for everyone. These new gadgets won’t just be
    for people with the arcane knowledge of technological mysticism; they’ll be for
    everyone.


    The third and final thing you should know is that these new enter-'
  merge: -1
  img_proc: true
- pgno: 16
  md: 'tainment technologies aren''t automatically addictive. Addiction is a nice,
    simple word, but the hooks drawing people into contemporary media are complex.
    Human beings being get tripped up because video games provide draws that most
    people don''t yet know how to balance. Society has barely been exposed to them,
    let alone their propensity for pulling the rug out from under a person. This precarious
    situation isn''t a cause to be angry or frightened. It''s just a call to quickly
    understand a beast that is quickly manifesting itself.


    Over two decades ago, Michael Crichton wrote, “There are plenty of places left
    in the world where one can live a nineteenth-century life, an eighteenth-century
    life, or even a tenth-century life—but few people rush to live in them.” Things
    like games and computers aren’t evil by nature. They’re a new part of our world:
    the state of the art for art. Games are “addicting” people without recognizable
    susceptibilities because this fixation on taking in media plays to many new susceptibilities.


    There are a lot of tangible reasons to read books, listen to radio, watch television
    and so on. Some reasons are more subtle; many are just outside of one’s usual
    perception. Some have everything to do with human perception. Imagine that your
    favorite story could go on forever. Then, imagine that you are the main character.
    Now imagine that you can choose between thousands of these stories; in essence
    that you can pick a never-ending story that’s right for you. This is what sophisticated
    games are: a place where we, you and me, control the story and plot for ourselves.
    What we’ve got in video games can absolutely be a problem, but addiction doesn’t
    appear out of thin air. Balancing these different realities is an altogether new
    skill, one that too many of today’s gamers have learned the hard way. Some might
    never learn.


    When today’s players lose their sense of balance and perspective, there’s almost
    never one single culprit. Rather, they experience a perfect storm; the game and
    the gamer each come to the table with a mass of factors that can help or hinder
    healthy playing. In the gamer, physiological addiction can originate from the
    chemical and psychological reactions to playing specific games. These vary dramatically
    between different players. Serious mental or physical problems can also make an
    imbalance more likely. The gamer aside, there are as many legitimate reasons to
    play games as there are people, and the gaming experience looks at how games go
    about'
  merge: -1
  img_proc: true
- pgno: 17
  md: 'stoking the fires in different gamers. Physical and cognitive immersion can
    naturally keep players “within” games longer than they had anticipated. For specific
    people, certain games can be more powerful than others; designers work hard to
    make them compelling, satisfying, fun even. They’re so much fun, at times, that
    gamers can play to the point where they’re making real problems for themselves.
    These problems, ironically, often spur players to want games all the more.


    This is why understanding game addiction is important for everybody: as legitimate
    as it may be for an individual to embargo games for themselves, media has an effect
    on everyone. The presence or absence of any one person in any one reality changes
    things. There are wholly new elements to society being introduced by advanced
    games. A great many of these can be better understood through exploring the excesses
    being called game addiction. Understanding how gaming alters the senses, what
    drives it and its broad effects on life, online or off, isn’t just for the academics
    or the mental health professionals. It’s useful for any person consuming any type
    of media.


    # ## A Perfect Storm


    > > “For me, playing computer games is almost meditative ... I don’t think of
    bills, work or stressful things,” says Max. “I might not answer my phone in time,
    but I do respond to my child crying.”


    Meet Norwegian gamer Max Meyer. At 28 he balances work, school, his wife, newborn
    child, and video games. Like most gamers in today’s digital living room, Max takes
    his commitments to other players seriously. He doesn’t let gaming come before
    real life, but he loves everyone second that he gets to spend playing with his
    friends online. For some gamers, that sense of balance is a hard-won skill.


    > > “I ended up playing about 10 hours a day on average,” he says, remembering
    the back-and-forth needed to stay competitive in MMORPGs. “Suffice it to say,
    this took a heavy toll on my university performance that semester.”


    This is a pattern that all too many gamers can relate to. Games give us more reasons
    than ever to love entertainment, and so finding the right'
  merge: -1
  img_proc: true
- pgno: 18
  md: 'balance is a challenge. Max is lucky; while he will probably always love games,
    his sense of responsibility (and his wife) will help him to keep all of these
    worlds in perspective. “The important change for me is that I have to quit playing
    all day, every day,” he says, though he worries about the next time he’ll feel
    the pressure to keep up. “Still, I have my wife to catch me if things get out
    of hand.”


    Some gamers are neither that lucky nor that mature; they can lose their grip when
    these two realities start to compete with one another. Ultimately it takes two
    to tango — this addiction takes a gamer and a game. Every person is different,
    and we’ve all got unique strengths and susceptibilities. When unique people play
    unique games, the result is always a unique experience. No one factor is going
    to instantaneously create an addict. Rather, the game experience hits everyone
    as a perfect storm; many small things combine, creating a force that can be unstoppable.
    The storm’s high seas and gusts are the many draws to gaming. The ship is the
    person playing, along with his or her many unique susceptibilities. Gamers who
    sail flimsy boats into treacherous waters will too often sink. At the same time,
    even “unsinkable” ships go under when they underestimate the sea, venturing without
    charts, without knowledge of the tides and without advance warning on foul weather.
    Many players don’t have the effective restraint or support structure of players
    like Max Meyer. Without understanding themselves and their entertainment, they
    risk losing themselves in the perfect storm.


    From relatively new ways to understand brain scanning and brain chemistry, to
    the decades of research in fields like psychology and media, we can track a number
    of characteristics that make games as alluring as they are. We can also identify
    what they are not. Video games aren’t a silver bullet, one whose harsh waters
    rope in any soul. Games combine many different technologies which we have already
    researched. For example, we know that human eyes are particularly bad at telling
    the difference between real images and images presented on a television set.?
    When the show is over, our brains can tell us that the anchors for the evening
    news weren’t speaking to us directly. However, our brains aren’t always tuned
    into that during the experience.³


    Our brains can get caught up in the moment. If nothing interrupts an exciting
    image, then we may not be able to put the image in context'
  merge: -1
  img_proc: true
- pgno: 19
  md: 'until after the excitement has passed.⁴ When we’re caught up in watching a
    car chase on our favorite show, our adrenaline might pump as though we were watching
    a real speeding car. If our favorite character crashes that car and dies, then
    we might feel the drama as though a real person had died — at least, so long as
    the television is turned on.


    But television doesn’t usually addict us; at best a television watcher might get
    grumpy if they get caught in traffic and miss a show. So why is traffic torture
    for some gamers? There’s more than one story out there of hasty gamers who lose
    control of their vehicles and flip them over or collide.⁵ One of my favorites
    involves two hours of sleep, a brand-spanking-new BMW and no loss of life. When
    the events inside a game have you running on little or no sleep, rushing home
    for more and putting other people at risk, then something is wrong. But it’s a
    level of responsibility that we could be seeing more and more. When a player gets
    to this point they’ve graduated beyond the level of liking a game for its colorful
    characters and stunning chase scenes.


    One part of gaming addiction does have to do with a new and improved living room,
    but the other part has to do with neuroscience and psychology. Game addiction
    is a process where the gamer and the game work together, changing the brain over
    a long process of small steps.⁶ Some oversimplified examples might involve a gamer
    who had a particularly bad day, or somebody whose particular brain can get a lot
    of excitement from gaming. In both cases they’re more likely to play. In neither
    case will gaming be good or bad in and of itself? Certain pieces of physiology
    can have a persuasive influence in how people play, and certain skills help them
    to stay balanced and emotionally healthy.⁷ Games can even help us to stay emotionally
    healthy, but gamers need to understand how to balance their play.⁸ With those
    skills, gamers are far less likely to gorge themselves and start a cycle of constantly
    increasing play.


    With a gaming experience that appears to offer so much to satisfy physical and
    mental needs, that cycle can all-too-frequently spiral out of control.¹⁰ Gamers
    with predispositions and susceptibilities have a hard time controlling their play,
    and too much gaming, no matter how rewarding it feels at the time, can open the
    door for more and bigger problems. Ultimately, our way of telling that someone
    has a problem isn’t that they magically qualify for the label “addict”; it’s when
    they’re having serious'
  merge: -1
  img_proc: true
- pgno: 20
  md: 'real-world problems. A major part of staying healthy is the ability to live
    a functional, balanced life and to maintain a healthy mind, strong physical body,
    and positive relationships.


    This is the primary way in which mental health professionals identify and define
    “addiction”—when a single behavior starts to transform business-as-usual into
    out-of-service. If somebody isn’t eating, isn’t going to work, and they’ve been
    so hooked to the computer that they’ve let the cat die, then these might just
    be signs that the game is interfering with their lives. If the cat really is dead,
    then it’s safe to say that this process of addiction is well on its way.


    Game addiction is usually no one thing, but rather a spellbinding firestorm; a
    satisfying game bombards a gamer’s psyche with those elements it’s always seeking,
    as well as those it never knew existed. The human eye can have a hard time looking
    away from some things. The more that a player disregards reality, the greater
    the storm’s power to enthrall.


    This whole process has humble roots in older forms of entertainment, despite the
    fact that they tend not to inspire such spectacular devotion. While there are
    insatiable bookworms and 40-year-old sci-fi junkies in mom and dad’s basement,
    things like books and television rarely make it impossible for someone to hold
    down a job, or to leave the house for more than a couple of hours. Games spice
    up media in complex ways, but the new flavors can be introduced in two major enticements.


