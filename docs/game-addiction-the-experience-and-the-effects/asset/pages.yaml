    “...We may cause woods to spring with silver leaves and rams to wear fleeces of
    gold, and put hot fire into the belly of the cold worm. But in such “fantasy,”
    as it is called, new form is made; Faerie begins; Man becomes a sub-creator.”
    Regardless of your spiritual'
