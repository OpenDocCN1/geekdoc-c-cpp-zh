    was that cultural products, like film, weren’t being created by denizens, but
    rather for the sole purposes of “economic profitability and social control.” These
    early scholars were right to be concerned. Even thoughtful, culturally diverse
    and artistic cinema and literature influence local cultures throughout the world.


    The trouble with “addiction” is not only that it can hold attention to the point
    that local culture degrades, or even that it engraves the invitation for cultural
    hegemony to influence a person’s whole life; secondary worlds are designed and
    executed to make money. Even worlds that invite participation and cultural production
    by their denizens, even worlds that are free to play, and especially worlds that
    weave in gameplay. Small worlds, large worlds, single-player games, console games,
    flash games, student-made games, hobbyist games: game development is a business.
    The many early voices in criticizing the “mass production of culture,” or culture
    as a commodity, ring very true today. “Something has been planned for every-one,”
    wrote two theorists, “so that nobody can escape from it.” Industrializing culture,
    mass-producing experience, and thereby creating the same “product” for everyone
    can kill the singularly effective power that locally grown humans possess in defending
    their heritage from the behemoth cultural molds — like video games. As American
    and South Korean games, in particular, spread like a digital wildfire over the
    face of the industrialized world, it seems appropriate to wrap up by asking what
