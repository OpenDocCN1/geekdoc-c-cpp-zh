    the other. Less than a week after, I flew to Hawaii and to graduate school. Without
    a computer.


    All games are, more or less, human: another place to experience something. You
    can get the exciting, fluffy, and triumphant emotions. You can also get the spiteful,
    dramatic, and vengeful, especially where other living people are involved. Even
    though you can’t smell, touch, or smile in the presence of the game’s programmed
    characters, or even another real person in the world, what’s striking is the power
    of the emotions you can have regardless. The presence of other people in the game
    does, without a doubt, make everything inside a secondary world more pertinent.


    How, then, do we begin to explain the strength of a game’s initial pull? Immersion
