- pgno: 27
  md: 'How different peoples live has far-reaching effects on how they play. One key
    example of this with game addiction is the line between work and leisure. “...The
    average South Korean works 2,390 hours each year, which is 34 percent more hours
    than the average in the United States.” Contrasting America’s more distinct notions
    of work and leisure, she notes that “the two categories seemed much more fluid
    in Korea.”


    In South Korea, at least 54 percent of the population, or 25 million people, play
    online games.23 That’s, as with any country, culture has a deep effect not simply
    on any one sensational issue, but rather on how people play and what that means
    to them.


    One major piece of the South Korean gamer culture is their unique cybercafé, the
    PC Baang—otherwise called a “PC Room” or a “PC Barn.” In a recent conference panel,
    noted Korean judge Unggi Yoon spoke candidly about the emergence of the PC Baang.24
    During the Asian economic crisis, many laid-off workers began creating and populating
    these PC Baangs, creating a cheap and accessible kind of social space. Older games,
    most especially StarCraft, first released in 1998, and both Lineage I and II,
    developed as prominent games alongside the Baang. The games and Baangs also grew
    alongside Korean notions on what group cohesion and skill meant in relation to
    games. As stated by Judge Yoon, “The purpose of Lineage was not to kill, but to
    be loyal.”25


    In her fieldwork, Florence Chee noted that players continually mentioned something
    called Wang-tta, a concept which seemed to apply both to individual gamers and
    the larger groups inside the Baang; if a gamer’s skills began to slip, or if they
    rejected gaming altogether, then they could be mocked and bullied, even ostracized.
    I have observed similar sentiments in other Southeast Asian countries, most notably
    in Malaysia and Singapore; there were reports that a lack of skill could spark
    real fistfights. To the person in the fistfight, often what’s happening is taken
    for granted. Some of these gamers might not really see why a notion like Wang-tta
    stands out, but as the saying goes, a fish probably doesn’t know that he’s in
    water. Situations like this show why culture is key.


    Korea might not just be an interesting case study, though. Being on the cutting
    edge of digital society, South Korean citizens may be chief innovators behind
    the cultural mores, laws, features and overall direction in which gaming takes
    the whole of the world. South Korea has already'
