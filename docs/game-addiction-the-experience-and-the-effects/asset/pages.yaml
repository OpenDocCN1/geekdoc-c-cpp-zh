- pgno: 12
  md: 'make life better. What we can''t do is give up on the world that we already
    have.


    At least 126 million people in the U.S. are playing video games, and the American
    Medical Association has reported estimates that 10 to 15 percent of Americans
    are addicted. That''s 12.6 to 18.9 million people in the U.S. alone, and these
    numbers pale in comparison to the millions of parents, spouses, game developers,
    educators, and therapists who share many of the concerns.


    They also pale compared to other countries. The Korean federal government recently
    released a statement estimating that at least 2.2 million young gamers are addicted
    and that the affliction is pandemic. The Chinese government expects far more,
    old and young, as they have over 140 million broadband connections. The Singaporean
    parliament was in a state of panic in late 2007. This isn''t something that the
    world can solve by burying its collective head in the sand.


    One of the most venerated media theorists of all time, Marshall McLuhan, once
    said, “There can only be disaster arising from unawareness of the causalities
    and effects inherent in our technologies.” Obviously, it’s high time we understand
    his casualties and effects. Whether we like it or not, games have become a part
    of our world. At some point in the near future, most everyday people aren’t going
    to “play” because it’s fun, or because they want to. It won’t even be addiction.
    These games are about to hit the mainstream, becoming a serious meeting-place
    for regular people around the world. In certain countries, and in certain generations,
    they already are.


    This book has attempted, as much as possible, to take a multidisciplinary approach.
    Where Shavau’s research as a psychotherapist has brought her to study varied approaches
    to the treatment of gaming pathologies in children and adults, I have similarly
    taken a broad approach to understanding the many rich draws to worlds online.
    Together we’ve worked to reconcile the divide between clinicians and academics,
    using accepted and respected research in neuroscience, media studies, developmental
    psychology, anthropology, behavioral psychology, communication, interpersonal
    neurobiology, literary theory, and many of the other fields where the groundwork
    for understanding games is being laid. The aim of this book is to serve as an
    intermediary between academics from these'
  merge: -1
  img_proc: true
- pgno: 13
  md: '# Preface (by Neils Clark)


    varied disciplines and professional venues; the tone has been kept as practical
    and straightforward as possible. Case studies, anecdote, and personal example
    are applied too for further clarify relationships between issues traditionally
    deemed too prohibitively complex for out-discipline research.


    The first three chapters provide the basic background on the nature of gaming,
    how gamers play, and why gamers play. This background is absolutely necessary
    to more fully grasp how and why addiction can grab certain players. Chapter One,
    “The Digital Living Room,” explores the fundamental growth of games and addiction,
    explaining why their underlying technologies will soon be available to most regular
    media consumers. Chapter Two, “Media Experience and Real Illusion,” examines the
    history of various media, with special attention to how things like literature
    and film physically massage the senses. Chapter Three, “Why They Play,” looks
    at various ways of explaining basic player motivations.


    The last three chapters expand on knowledge of why gaming experiences are complex,
    showing how addiction can develop. Chapter Four, “Anatomy of a Game Addiction,”
    takes major elements utilized in the contemporary treatment and understanding
    of addictions, using them to shed more light on excesses observed among gamers.
    Chapter Five, “Games Are Not Babysitters,” explains how children are unique in
    the ways they integrate the gaming experience. Chapter Six, “The Road Ahead,”
    steps back, connecting some of the book’s main concepts in order to lightly survey
    other possible effects of game technologies.


    This book, like many, was only possible through the help of many, many people.
