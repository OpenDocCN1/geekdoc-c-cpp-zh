- pgno: 173
  md: '# Afterword (by P. Shavaun Scott)


    rhythm, and social mores. When one spends time there, these cultures, rhythms,
    and values become integrated into the internal structure of the mind — without
    a player realizing it.


    But people can choose to play, and choose to stop when they want to ... can''t
    they?


    I think most of us really like the concept of choice. It''s a nice idea, comforting
    in fact. It offers the illusion of control. It''s often stated that people have
    choices about what games they play, and parents have choices about monitoring
    what their kids are doing. If everyone makes good choices, we have nothing to
    worry about, right?


    It''s not that simple.


    If we look at how the brain actually works, we will see that much neural processing
    occurs outside conscious awareness (Siegel, 1999). Our emotional limbic system
    often makes decisions with very little contribution from the logical cortex. When
    emotional impulses rule our decision-making, our thinking brain struggles to catch
    up, often making up "good excuses" to justify the decision in the process. This
    is one reason why people do so many things that appear irrational and self-destructive.
    It''s an important piece to understand when we''re trying to understand why people
    play games and why many play too much.


    People are not rational creatures, and some are far less so than others. It''s
    my hope that games can move in the direction of encouraging complex thought and
    creativity, and move away from "dings," "grinds" and "raids." It''s also my hope
    that as the gaming demographic reflects an increasingly older population, those
    "S Skills" continue to develop in accordance, and that as these gamers become
    parents they raise children with those same abilities. Self-awareness, self-monitoring,
    and self-corrections are markers of a mature mind, which as we''ve discussed,
    does not necessarily correlate with chronological age.


    Living with healthy awareness means making decisions about what is good for our
    minds, bodies, and relationships with others, not just at this immediate moment,
    but for the long term. Whatever gaming we do, let''s do it with health in mind.


    I hope that one of these days my sons and I find ourselves on an adventure in
    a beautiful place — in the real world. I know that''s asking a lot.'
