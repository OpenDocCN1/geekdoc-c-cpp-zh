  md: 'affected by the people playing online. She sums it up simply, “I’ve made a
    lot of friends whom I have come to care a lot for.”


    No matter whom you talk to or where in the world they come from, bonds are being
    formed in today’s digital living room. New people are learning to act and interact
    inside, while newer living rooms and leveling rooms are being made easier to understand.
    It’s happening right now, as you read these very words. Some players aren’t going
    to want to leave these screens. It’s not that everyone is going to transform on
    the full moon and begin hungering for these online coffee shops and digital diners.
    As popular media technologies start to change, some of these game worlds could
    easily become the next step in popular services like digital cable; by and large
    current consumers will pay their money and upgrade. Entering the digital living
    room should be as simple as sitting in your real one.


    Technologies that have been around all along are already changing for us. These
    changes are giving us more say in what we read, watch and listen to; the alchemists
    behind the scenes and screens are designing those choices to be fun, and in some
    cases to connect us with one another. It’s happening right now, and people have,
    by and large, been eating it up. The secret ingredients are hard to resist. We
    aren’t playing with improved television, digital books or online games because
    they’re addictive, at least not yet. Everyday people play along because they’re
    getting more of the entertainment that they want.


    This new breed of entertainment is also profitable to the point of absurdity.
    Blizzard Entertainment, developer of the popular American MMO World of Warcraft,
    generates annual revenues exceeding one billion U.S. dollars from the single game.
    Warcraft has over eleven million active players and was probably the key motivator
    behind an 18.9 billion-dollar merger between parent company Vivendi and Activision.
    It’s hard to imagine one game being worth all that. As of our writing, the makers
    of Asia’s most popular online world MapleStory have boasted that over fifty million
    people have active accounts. Tens, if not hundreds of millions of real human beings
    actively play inside these places. There’s too much money to be made for developers
    not to aggressively expand into newer markets. If you haven’t gotten into gaming
    yet, then it probably won’t be long before all of the fun, interactivity, and
    connectedness of these worlds eases on into your life.'
