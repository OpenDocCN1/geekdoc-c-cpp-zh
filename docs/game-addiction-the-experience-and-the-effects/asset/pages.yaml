- pgno: 179
  md: 'games unique, often requiring real people to drive all over real-world cities,
    looking for clues. And now that mobile phones are growing in sophistication, becoming
    their own miniature tablet PCs, or the recent advances of the iPhone, we''re very
    likely going to see huge leaps in the gaming technologies offered on mobile platforms.


    # Question two: How do you interact with real people?


    Nowadays it isn''t always easy to tell if somebody is playing with other people.
    Somebody sitting alone at a desk might be going it alone, or he could be playing
    with or against dozens, even hundreds of other players. Even more interesting,
    players could be inside a massive online world. There could be thousands of other
    people inside this world, yet our solitary gamer may nevertheless be playing all
    on his lonesome. Even so, while most gamers are alone in the sense that they''re
    the only person sitting at the computer, these games are often used for old friends
    trying to reconnect, new friends separated by an ocean, and friends who might
    never have met without the game.


    If somebody isn''t playing with any other living and breathing humans, and he
    isn''t inside a world with has other people, then he is playing a single-player
    game. If you''ve never really played a game before, then it might be hard to tell
    whether it''s a single-player game. If nothing else, the lack of an internet connection
    is usually a sure sign that it''s single-player. This may not help as an indicator,
    however, as most PCs in most homes are wired. They''re connected to the internet.
    While consoles and mobile platforms weren''t traditionally wired, that''s rapidly
    changing.


    Multiplayer games aren''t necessarily played over the internet; we''re going to
    talk about those multiplayer online games after this. Multiplayer games just require
    that people are playing together. Consoles are usually the most popular platform
    for multiplayer games, since more people can physically fit in front of a television
    than a computer screen. There are exceptions, however, and some popular multiplayer
    games run on a single computer. One example is the trivia game You Don''t Know
    Jack, where players all use a keyboard in order to "buzz in," and occasionally
    players will be prompted to type in their answers. A real-world arcade game is
    another platform where you might see multiplayer games. Some examples of popular
    multiplayer games are Smash Bros., Halo 1 and 2, and Mortal Kombat.'
