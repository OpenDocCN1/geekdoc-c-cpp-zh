  md: 'denigrate the potency either of media experience or cultural beauty. If games
    continue to grow in popularity, then creating culturally sound and culturally
    representative video games will not merely affect Earth''s denizens in our generation.
    It is entirely possible that the games being created right now will have a lasting
    if not permanent effect on our own children. The most popular stories from games
    may well be the legends that they pass down to our grandchildren, for their gaming
    enjoyment.


    Underestimation. Whether of their utilities, costs, good or evil, underestimation
    is the largest mistake possible when considering the effects of games. We can
    call them games, secondary worlds, synthetic worlds, media experience, half-real,
    real illusion, terrible, or fun. But it is paramount that we examine what those
    words, and their underlying assumptions, mean.


    Addiction is one word with many faces. When applied to games, it lumps together
    draws which are fundamentally different. Using it betrays our ignorance. Though
    nobody will stop calling games addictive overnight, it helps to acknowledge the
    diversity of the things we mean by it. People applying the word addiction should
    consider it an interim term. Though it may never fall out of fashion, it should.
    If media-effects education ever does become a reality, then the specific draws
    of a game should be cited: various types of immersion, different motivations,
    as well as greater awareness to factors related to dependency, as with gaming
    binges and life functioning. If any such new, more specific words do ever catch
    on, they''ll do so on their own schedule.


    It should be abundantly clear that excess is just one of many unique pathologies
    and possibilities in today''s media experience. These reflect the unique pathologies
    and possibilities in reality, though they grow new characteristics amid new environments.
    Secondary worlds make comment on things like the influence of consumerist society
    and how humans treat one another. They show us what we create when imagination
    is one of the only limitations to experience. They take us away from our lives,
    while concurrently connecting us to a way of being with possibly just as much
    fullness. They are complex.'
