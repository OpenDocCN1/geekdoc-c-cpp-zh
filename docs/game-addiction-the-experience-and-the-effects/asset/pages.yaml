    Shawnda remembers the first visit. “I introduced him to Slurpees,” she says, “He
    almost died of heat stroke in the desert’s 115-degree heat!”


    After marrying in 2006 and spending a month getting to know each other as husband
    and wife, Shawnda remembers thinking, “Obviously, one of us has to move.” These
    days Shawnda and her daughter are loving everything about Holland, from the landscapes
    and language to the bicycles and the food. “Finally getting to be together and
    live together was a huge relief.”


    Though she says that there’s “no substitute for actually being able to see him,”
    she’s still impressed by the ability that the game world had to bring a feeling
    of togetherness. “It’s odd how ‘playing’ together in a game can make you forget
    that you’re 6000 miles away.”


    There’s an immersive quality that you really only get once a game gives you something,
    or someone, to fall in love with. Alternatively, finding something in games worth
    screaming about pulls you into other elements. In secondary worlds, some people
    embrace the dark and angry elements of their personalities, while others relish
    their ability to treat others fairly, give charitably, and love. And this all
    happens between real, living human beings. Your actions in secondary worlds affect
    flesh-and-blood people who also fundamentally reside in the primary, real world.
    Even if you don’t think that games are real in any other sense, in some online
    spaces we face off with real people, spend our real time and money, experiencing
    media that walks the line between reality and illusion.


    This realistic immersion can make it very difficult to avoid getting pulled into
    this world, because in many ways it transforms these spaces into a part of the
    real world. These worlds don’t just immerse you with images of bloodthirsty space
    dragons; they immerse you real, live humans that play with you. In so doing, in
    letting you share that illusion, they make it all the more difficult to disbelieve.


    “It was much pleasanter at home,” cried Alice. “When one wasn’t always growing
    larger and smaller, and being ordered about by mice and rabbits,” Alice, in Lewis
    Carroll’s well-known story Alice in Wonderland, chased the white rabbit into a
    very real-feeling illusion. Games mix a similar level of reality and illusion;
    that’s part of their allure. The high point of any story is when you realize that
