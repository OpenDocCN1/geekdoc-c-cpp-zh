    exactly what they want, when they want it. For many that''s an easy pill to swallow.
    But as long as we''re talking about pills, let''s make one point abundantly clear:
    games are not drugs.¹ Cute names like “WarCrack” and “EverCrack” might be funny,
    but drugs (crack included) all work in specific ways.² Heroin mimics our body''s
    natural opiates, meaning almost instantaneous and intense feelings of sedation
    and satisfaction.³ Alcohol goes to work in a few different parts of the brain,
    slowing transmitters called GABA and flooding parts of the brain with glutamate.⁴
    All of these real drugs, from meth and morphine to cocaine and ecstasy, affect
    brain chemistry after they''ve been ingested, injected or otherwise introduced
    into the system. Games aren''t injecting substances into a gamer''s fingers whenever
    they type. Players could do drugs while they play, which would change things,
    but games aren''t drugs in and of themselves.


