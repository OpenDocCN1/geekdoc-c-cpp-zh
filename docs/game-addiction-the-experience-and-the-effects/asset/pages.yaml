  md: 'So what, besides luck, can explain the people who seem to get away with not
    giving a road or a game their full attention? Perhaps that we’re visual creatures,
    that our brains have a massive archive of very basic images, that having these
    tuned into our brain’s reflex centers keeps us turning the steering wheel well
    enough. If we’re used to a particular highway, or a particular type of game, or
    rather if we have enough muscle memory and visual experience, then it may be possible
