    could also avoid the red bananas, maybe even destroy them. Whether by making crazy
    gestures at the red banana, or calmly saying, “Hello my tribe, eating this banana
    will kill you,” capturing our own experience via some media technology, even language,
    is allowing others to experience something outside of themselves. They didn’t
    watch Ooki die, but now they understand that our ancestor did. More importantly,
