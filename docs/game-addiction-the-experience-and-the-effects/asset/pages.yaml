  md: '# # THE ROAD AHEAD


    Each previous chapter has had the job of bringing together bits of knowledge which
    deal with the problems and pathologies in gaming, especially gaming to the point
    of “addiction,” or dependency. In so doing the chapters have worked to answer
    a lot of “How?” questions. How is it that games have grown so quickly? How do
    they grapple the imaginations, attention, minds, and bodies of human beings? How
    do they addict? How do children fare?


    Some of the people we brought in were relatively old. Socrates, J.R.R. Tolkien,
    Marshall McLuhan, some had been looking at the effect of media on our minds since
    specific media were young. Many of the people brought in have ideas that are newer
    and fresher. From people like Norman Doidge and Jane Healy to Nick Yee and Florence
    Chee, they apply a perspective to media experiences that helps our thinking to
    become more crisp. Having brought these ideas together, it seems possible that
    games provide draws that are rarely discussed without too much sensationalism
    or too little real information.


    Addiction, though it’s worked as our sherpa, our guide through some problems and
    possibilities in secondary worlds, isn’t the only issue that should give us pause.
    Having explored how addiction is fueled by immersion, player motivations, and
    child development, among other things, it’s important to mix these together. From
    this vantage point, it may be possible to draw larger themes from the research.
    This chapter points to some of the related questions on the effect games might
    have on individuals, society and our world.'
