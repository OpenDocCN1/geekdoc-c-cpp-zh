    frames, whether they sit around the edges of a mirror or a monitor, something
    magical is happening. Yet in neither a shooting game nor in the television show
    will there be a healthy human brain utterly and instantly become the persona inside
    the secondary world.


    Though players might enter and exit a game as their own complex selves. what more
