- raw:
  - '[PAGE 0]


    # C#


    # For Babies


    Written by Khalid Abuhakmeh and Maarten Balliauw

    Illustrated by Arina Kovrizhkina


    ![](img/09191ed26e24d83f9d7b181200c7deb5_0_0.png)'
  - '[PAGE 1]


    # # Aa


    # A is for Abstract


    Abstract tells you that you’ve yet to implement a thing. Like having a bowl without
    cereal.


    ![](img/09191ed26e24d83f9d7b181200c7deb5_1_0.png)'
  - '[PAGE 2]


    # Bb


    # B is for Boolean


    Booleans can be either true or false. Ponies existing is true, while unicorns
    are real is false.


    ![](img/09191ed26e24d83f9d7b181200c7deb5_2_0.png)'
  - '[PAGE 3]


    Cc


    C is for Class


    A class is a container for important information, just like your backpack.


    ![](img/09191ed26e24d83f9d7b181200c7deb5_3_0.png)'
  - '[PAGE 4]


    ![](img/09191ed26e24d83f9d7b181200c7deb5_4_0.png)


    # D is for .NET


    .NET is where C# lives, along with VB.NET and F#. A big happy family.


    ![](img/09191ed26e24d83f9d7b181200c7deb5_4_1.png)'
  - '[PAGE 5]


    ![](img/09191ed26e24d83f9d7b181200c7deb5_5_0.png)


    # E is for Enum


    An enum is a set of values, just like the colors in a rainbow. Red, Orange, Yellow,
    Green, Blue, Indigo, and Violet.


    ![](img/09191ed26e24d83f9d7b181200c7deb5_5_1.png)


    ![](img/09191ed26e24d83f9d7b181200c7deb5_5_2.png)


    RAINBOW


    ![](img/09191ed26e24d83f9d7b181200c7deb5_5_3.png)


    ![](img/09191ed26e24d83f9d7b181200c7deb5_5_4.png)


    ![](img/09191ed26e24d83f9d7b181200c7deb5_5_5.png)


    ![](img/09191ed26e24d83f9d7b181200c7deb5_5_6.png)


    ![](img/09191ed26e24d83f9d7b181200c7deb5_5_7.png)


    ![](img/09191ed26e24d83f9d7b181200c7deb5_5_8.png)'
  - '[PAGE 6]


    ![](img/09191ed26e24d83f9d7b181200c7deb5_6_0.png)


    # F is for Foreach


    Foreach loops help us repeat things\nin order, like counting our fingers\none
    at a time.


    ![](img/09191ed26e24d83f9d7b181200c7deb5_6_1.png)'
  - '[PAGE 7]


    # Gg


    # G is for Goto


    Goto transfers control to a statement marked by a label, just like kicking the
    ball to a friend.


    ![](img/09191ed26e24d83f9d7b181200c7deb5_7_0.png)'
  - '[PAGE 8]


    <!-- no content -->'
  - '[PAGE 9]


    # Ii


    # I is for Interface


    Interfaces are like little agreements, just like when you agree to brush your
    teeth.


    ![](img/09191ed26e24d83f9d7b181200c7deb5_9_0.png)'
  - '[PAGE 10]


    # Jj


    # J is for Join


    We can join words together by

    calling string.Join ("I","♥","You").

    What does that say?


    ![](img/09191ed26e24d83f9d7b181200c7deb5_10_0.png)'
  - '[PAGE 11]


    # Kk


    # K is for Keyword


    C# has special words that you can use to make programs happy. They''re like the
    please and thank you of programming.


    Thank you


    Please


    ![](img/09191ed26e24d83f9d7b181200c7deb5_11_0.png)'
  - '[PAGE 12]


    # L is for Lock


    Lock makes sure you''re the only one playing with a toy, just like your favorite
    teddy bear.


    ![](img/09191ed26e24d83f9d7b181200c7deb5_12_0.png)'
  - '[PAGE 13]


    # # Mm


    # ## M is for Method


    A method calls to something special, just like when you call for your blanky.


    ![](img/09191ed26e24d83f9d7b181200c7deb5_13_0.png)'
  - '[PAGE 14]


    # Nn


    # N is for Null


    Null is nothing, like your empty toy box when all your toys are scattered on the
    floor.


    ![](img/09191ed26e24d83f9d7b181200c7deb5_14_0.png)


    ![](img/09191ed26e24d83f9d7b181200c7deb5_14_1.png)


    ![](img/09191ed26e24d83f9d7b181200c7deb5_14_2.png)


    ![](img/09191ed26e24d83f9d7b181200c7deb5_14_3.png)'
  - '[PAGE 15]


    # Oo


    # O is for Operator


    Operators help you add, subtract, multiply, and divide, just like adding more
    candies to your pockets.


    ![](img/09191ed26e24d83f9d7b181200c7deb5_15_0.png)'
  - '[PAGE 16]


    <!-- no content -->'
  - '[PAGE 17]


    # Qq


    # Q is for Queue


    A queue is a special container that accesses information in order, just like the
    cars in your favorite toy train. Choo Choo!


    ![](img/09191ed26e24d83f9d7b181200c7deb5_17_0.png)'
  - '[PAGE 18]


    # Rr


    # R is for Return


    Return allows you to send something back, like the peas mommy wants you to eat.
    Ewww...


    ![](img/09191ed26e24d83f9d7b181200c7deb5_18_0.png)'
  - '[PAGE 19]


    # Ss


    # S is for String


    Strings are for words, letting us express ourselves and communicate with others.
    What’s that you said?


    ![](img/09191ed26e24d83f9d7b181200c7deb5_19_0.png)'
  - '[PAGE 20]


    # Tt


    # T is for Types


    All types are different and special, just like fruit, with bananas, apples, oranges,
    and mangoes.


    ![](img/09191ed26e24d83f9d7b181200c7deb5_20_0.png)'
  - '[PAGE 21]


    # Uu


    # U is for Using


    Using lets us clean up after ourselves, like after eating a big messy bowl of
    spaghetti.


    ![](img/09191ed26e24d83f9d7b181200c7deb5_21_0.png)'
  - '[PAGE 22]


    # Vv


    # V is for Variable


    Variables let us put things in them, like putting the cat in a box. Meooooooow!


    ![](img/09191ed26e24d83f9d7b181200c7deb5_22_0.png)'
  - '[PAGE 23]


    # Ww


    # W is for While


    While loops will go until we tell them to stop, we wouldn’t want to eat ice cream
    forever…

    or would we?


    ![](img/09191ed26e24d83f9d7b181200c7deb5_23_0.png)'
  - '[PAGE 24]


    ![](img/09191ed26e24d83f9d7b181200c7deb5_24_0.png)


    # X is for XOR


    XOR (exclusive or) uses a caret symbol that allows us to create complex expressions,
    and bunnies love them too!


    ![](img/09191ed26e24d83f9d7b181200c7deb5_24_1.png)'
  - '[PAGE 25]


    # # Yy


    # ## Y is for Yield


    Yield lets us pause and come back,

    like pausing our favorite TV show

    and watching it later.


    ![](img/09191ed26e24d83f9d7b181200c7deb5_25_0.png)'
  - '[PAGE 26]


    # Zz


    # Z is for Zip


    LINQ’s Zip lets us combine two collections into one result. Like two big hugs
    to make you happy!


    ![](img/09191ed26e24d83f9d7b181200c7deb5_26_0.png)'
  - '[PAGE 27]


    When you grow up, you can use these fantastic tools for .NET development. Visit
    jb.gg/babies to learn more.


    ![](img/09191ed26e24d83f9d7b181200c7deb5_27_0.png)'
  md: "\n## C# For Babies\n\nWritten by Khalid Abuhakmeh and Maarten Balliauw  \n\
    Illustrated by Arina Kovrizhkina\n\n![](img/09191ed26e24d83f9d7b181200c7deb5_0_0.png)\n\
    \n## Aa\n\n### A is for Abstract\n\nAbstract tells you that you’ve yet to implement\
    \ a thing. Like having a bowl without cereal.\n\n![](img/09191ed26e24d83f9d7b181200c7deb5_1_0.png)\n\
    \n## Bb\n\n### B is for Boolean\n\nBooleans can be either true or false. Ponies\
    \ existing is true, while unicorns are real is false.\n\n![](img/09191ed26e24d83f9d7b181200c7deb5_2_0.png)\n\
    \n## Cc\n\n### C is for Class\n\nA class is a container for important information,\
    \ just like your backpack.\n\n![](img/09191ed26e24d83f9d7b181200c7deb5_3_0.png)\n\
    \n## Dd\n\n![](img/09191ed26e24d83f9d7b181200c7deb5_4_0.png)\n\n### D is for .NET\n\
    \n.NET is where C# lives, along with VB.NET and F#. A big happy family.\n\n![](img/09191ed26e24d83f9d7b181200c7deb5_4_1.png)\n\
    \n## Ee\n\n![](img/09191ed26e24d83f9d7b181200c7deb5_5_0.png)\n\n### E is for Enum\n\
    \nAn enum is a set of values, just like the colors in a rainbow. Red, Orange,\
    \ Yellow, Green, Blue, Indigo, and Violet.\n\n![](img/09191ed26e24d83f9d7b181200c7deb5_5_1.png)\n\
    \n![](img/09191ed26e24d83f9d7b181200c7deb5_5_2.png)\n\nRAINBOW\n\n![](img/09191ed26e24d83f9d7b181200c7deb5_5_3.png)\n\
    \n![](img/09191ed26e24d83f9d7b181200c7deb5_5_4.png)\n\n![](img/09191ed26e24d83f9d7b181200c7deb5_5_5.png)\n\
    \n![](img/09191ed26e24d83f9d7b181200c7deb5_5_6.png)\n\n![](img/09191ed26e24d83f9d7b181200c7deb5_5_7.png)\n\
    \n![](img/09191ed26e24d83f9d7b181200c7deb5_5_8.png)\n\n## Ff\n\n![](img/09191ed26e24d83f9d7b181200c7deb5_6_0.png)\n\
    \n### F is for Foreach\n\nForeach loops help us repeat things in order, like counting\
    \ our fingers one at a time.\n\n![](img/09191ed26e24d83f9d7b181200c7deb5_6_1.png)\n\
    \n## Gg\n\n### G is for Goto\n\nGoto transfers control to a statement marked by\
    \ a label, just like kicking the ball to a friend.\n\n![](img/09191ed26e24d83f9d7b181200c7deb5_7_0.png)\n\
    \n## Ii\n\n### I is for Interface\n\nInterfaces are like little agreements, just\
    \ like when you agree to brush your teeth.\n\n![](img/09191ed26e24d83f9d7b181200c7deb5_9_0.png)\n\
    \n## Jj\n\n### J is for Join\n\nWe can join words together by calling `string.Join(\"\
    I\",\"♥\",\"You\")`. What does that say?\n\n![](img/09191ed26e24d83f9d7b181200c7deb5_10_0.png)\n\
    \n## Kk\n\n### K is for Keyword\n\nC# has special words that you can use to make\
    \ programs happy. They're like the please and thank you of programming.\n\nThank\
