    \n### L is for Lock\n\nLock makes sure you're the only one playing with a toy,\
    \ just like your favorite teddy bear.\n\n![](img/09191ed26e24d83f9d7b181200c7deb5_12_0.png)\n\
    \n## Mm\n\n### M is for Method\n\nA method calls to something special, just like\
    \ when you call for your blanky.\n\n![](img/09191ed26e24d83f9d7b181200c7deb5_13_0.png)\n\
    \n## Nn\n\n### N is for Null\n\nNull is nothing, like your empty toy box when\
    \ all your toys are scattered on the floor.\n\n![](img/09191ed26e24d83f9d7b181200c7deb5_14_0.png)\n\
    \n![](img/09191ed26e24d83f9d7b181200c7deb5_14_1.png)\n\n![](img/09191ed26e24d83f9d7b181200c7deb5_14_2.png)\n\
    \n![](img/09191ed26e24d83f9d7b181200c7deb5_14_3.png)\n\n## Oo\n\n### O is for\
    \ Operator\n\nOperators help you add, subtract, multiply, and divide, just like\
    \ adding more candies to your pockets.\n\n![](img/09191ed26e24d83f9d7b181200c7deb5_15_0.png)\n\
    \n## Qq\n\n### Q is for Queue\n\nA queue is a special container that accesses\
    \ information in order, just like the cars in your favorite toy train. Choo Choo!\n\
    \n![](img/09191ed26e24d83f9d7b181200c7deb5_17_0.png)\n\n## Rr\n\n### R is for\
    \ Return\n\nReturn allows you to send something back, like the peas mommy wants\
    \ you to eat. Ewww...\n\n![](img/09191ed26e24d83f9d7b181200c7deb5_18_0.png)\n\n\
    ## Ss\n\n### S is for String\n\nStrings are for words, letting us express ourselves\
    \ and communicate with others. What’s that you said?\n\n![](img/09191ed26e24d83f9d7b181200c7deb5_19_0.png)\n\
    \n## Tt\n\n### T is for Types\n\nAll types are different and special, just like\
    \ fruit, with bananas, apples, oranges, and mangoes.\n\n![](img/09191ed26e24d83f9d7b181200c7deb5_20_0.png)\n\
    \n## Uu\n\n### U is for Using\n\nUsing lets us clean up after ourselves, like\
