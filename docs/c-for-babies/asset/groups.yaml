    \n## Vv\n\n### V is for Variable\n\nVariables let us put things in them, like\
    \ putting the cat in a box. Meooooooow!\n\n![](img/09191ed26e24d83f9d7b181200c7deb5_22_0.png)\n\
    \n## Ww\n\n### W is for While\n\nWhile loops will go until we tell them to stop,\
    \ we wouldn’t want to eat ice cream forever… or would we?\n\n![](img/09191ed26e24d83f9d7b181200c7deb5_23_0.png)\n\
    \n## Xx\n\n![](img/09191ed26e24d83f9d7b181200c7deb5_24_0.png)\n\n### X is for\
    \ XOR\n\nXOR (exclusive or) uses a caret symbol that allows us to create complex\
    \ expressions, and bunnies love them too!\n\n![](img/09191ed26e24d83f9d7b181200c7deb5_24_1.png)\n\
    \n## Yy\n\n### Y is for Yield\n\nYield lets us pause and come back, like pausing\
    \ our favorite TV show and watching it later.\n\n![](img/09191ed26e24d83f9d7b181200c7deb5_25_0.png)\n\
    \n## Zz\n\n### Z is for Zip\n\nLINQ’s Zip lets us combine two collections into\
