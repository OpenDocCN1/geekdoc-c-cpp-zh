  \n## 3.6 与预定义函数的操作\n\n### 3.6.1 数学函数\n\n头文件 `math.h` 包含了表 3.1 总结的数学函数和常量。实数 `x`\
  \ 的舍入可以通过 `ceil(x+0.5)` 实现（忽略 4.5 的舍入规则）。\n\n| 函数/常量 | 说明 |\n| :--- | :--- |\n|\
  \ `sqrt(x)` | 平方 (`x > 0`) |\n| `exp(x)` | $e^x$ |\n| `log(x)` | 自然对数 (`x > 0`)\
  \ |\n| `pow(x,y)` | 幂 ($x^y$ 如果 $y$ 不是整数) |\n| `fabs(x)` | $x$ 的绝对值 |\n| `fmod(x,y)`\
  \ | $x/y$ 的实数余数 (`y = 0`) |\n| `ceil(x)` | 向上取整 |\n| `floor(x)` | 向下取整 |\n| `sin(x)`,\
  \ `cos(x)`, `tan(x)` | 三角函数 |\n| `asin(x)`, `acos(x)` | 反三角函数 ($x$ 在 [-1, 1] 之间)\
  \ |\n| `atan(x)` | 反三角函数 |\n| `M_E` | 欧拉数 $e$ |\n| `M_PI` | $\\pi$ |\n\n表 3.1: 数学函数\n\
  ![](img/image00904.jpeg) 允许程序员负责参数范围。`math.h` 中的函数存储在特殊的数学库中，因此编译和链接命令必须考虑该库 `m`，即：\n\
  \n```\ng++ 361.cc -lm\n```\n\n### 3.6.2 字符串函数\n\n![](img/image00906.jpeg) 头文件 `string.h`\
