  \n## 9.2 通过文件进行输入输出\n\n## 9.2 通过文件进行输入输出\n\n![](img/image01202.jpeg)![](img/image00844.jpeg)![](img/image01203.jpeg)通过文件和终端的输入输出可以结合使用。\n\
  \n## 9.3 切换输入/输出\n\n![](img/image00844.jpeg)![](img/image01204.jpeg)有时需要在需要在文件 IO\
  \ 和终端 IO 之间进行切换。遗憾的是，在这种情况下，你必须对 `istream` 和 `ostream` 类型进行操作。\n\n![](img/image01205.gif)\n\
  \n![](img/image01206.jpeg)\n\n![](img/image01207.jpeg)![](img/image00844.jpeg)![](img/image00844.jpeg)![](img/image01208.jpeg)在示例中可以找到使用命令行参数切换输入输出的所有方便方法。\n\
  \n# 输出格式化\n\n输出和流（`<<`）可以高度格式化。这里给出少量格式化的示例，更多请参阅文献。\n\n![](img/image01209.jpeg)我们使用这些变量\
  \ `double da = 1.0/3.0`, `db = 21./2`, `dc = 1234.56789;`\n\n![](img/image01210.jpeg)标准输出：\n\
  \n```cpp\ncout << da << endl << db << endl << dc << endl << endl;\n```\n\n![](img/image01211.jpeg)输出中的有效位数（此处为\
  \ 12）：\n\n```cpp\ncout.precision(12); cout << ...;\n```\n\n![](img/image01212.jpeg)固定的小数位数（此处为\
  \ 6）：\n```cpp\ncout.precision(6); cout.setf(ios::fixed, ios::floatfield); cout <<\
  \ ...;\n```\n\n![](img/image01213.jpeg)科学计数法输出：\n```cpp\ncout.setf(ios::scientific,\
  \ ios::floatfield); cout << ...;\n```\n\n![](img/image01214.jpeg)标准版输出：\n```cpp\n\
  cout.setf(0, ios::floatfield); cout << ...;\n```\n\n![](img/image01215.jpeg)对齐 G（右对齐）通配符（16\
  \ 个字符）：\n```cpp\ncout.setf(ios::right, ios::adjustfield); cout.width(16);\ncout\
  \ << da << endl;\ncout.width(16); cout << db << endl;\ncout.width(16); cout << dc\
  \ << endl;\n```\n\n107\n\n108 第 10 章 输出格式化\n\n使用标准操器的通用解决方案见 [Str00, § 1.4.6.2,\
  \ pp.679]。\n\n![](img/image01216.jpeg)整数的十六进制输出：\n```cpp\ncout.setf(ios::hex, ios::basefield);\
  \ cout << \"127 = \" << 127 << endl;\n```\n\n# 技巧与窍门\n\n## 11.1 预处理器命令\n\n我们已经知道预处理器\n\
  \n```cpp\n#include <math.h>\n```\n\n![](img/image01217.jpeg)![](img/image01218.jpeg)在适当的位置插入\
  \ `math.h` 的内容。同样，源代码的某些部分根据依赖关系包含或忽略。\n\n```cpp\n#ifdef MY_DEBUG\ncout << \"In\
  \ debug\";\n#endif\n\n#ifndef MY_DEBUG\n#define MY_DEBUG\n#endif\n```\n\n![](img/image01219.jpeg)在示例中可以找到使用命令行参数切换输入输出的所有方便方法。\n\
  \n```cpp\n#ifdef MY_DEBUG\ncout << \"PI = \" << M_PI << endl;\n#else\n#endif\n```\n\
  \n```cpp\n#ifndef MY_DEBUG\n#define M_PI 3.14159\n#endif\n```\n\n系数 `a_k` 和值 `xk`\
  \ 在文件 `Ex121.cc` 中。函数值通过两种数学等的方式计算。变体 1 使用 `pow()` 函数，而变体 2 通过连续相法计算 `xk` 的值。\n\n\
  不同的运行时行为可以通过时间测量来证明，并通过逐步激活编译器优化选项来改进，例如：\n\n```bash\ng++ Ex121.cc\ng++ -O Ex121.cc\n\
  g++ -O3 Ex121.cc\n```\n\n通过以下方式启动程序：\n```bash\na.out < input.1121\n```\n\n## 11.2\
  \ 程序中的计时\n\n![](img/image01221.jpeg)到 `time.h` 文件 `ostream` 提供某些程序部分的时间。\n\n![](img/image01222.jpeg)\n\
  \n\n\n[content]\n\n编译器开关 `-pg` 为程序中的留了一些额外功能，以便在程序运行后可以使用 `gprof` 分析其运行时行为。最后一条命令（也可以是编辑器）将在屏幕上显示此分析的重定向输出。\n\
  \n## 11.4 调试\n\n通常需要逐步跟踪程序流，并在必要时为了控制目的输出变量值等内容。接下来：\n\n```cpp\ncout << \"AA\" <<\
  \ variable << endl;\n...\ncout << \"BB\" << variable << endl;\n...\n```\n\n通常可以使用专业的调试工具。这里再次展示了一个演示了在\
  \ LINUX 下运行的（免费的）程序。\n\n```bash\nLINUX> g++ -g Ex1121.cc\nLINUX> ddd a.out &\n```\n\
  \n各种调试器的处理方式差异很大。使用 `ddd` 调试器时，可以通过 `set args < input.1121` 指定输入文件，并使用 `run` 启动测试运行，程序会在之前设置的断点处停止。在那里，可以使用源代码逐步跟踪程序。\n\
