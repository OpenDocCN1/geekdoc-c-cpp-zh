  \n![](img/image00848.jpeg)\n\n# 第 2 章：简单数据类型\n\n## 2.1 变量\n\n### 2.1.1 变量定义\n\n\
  每个有意义的程序都会以某种形式数据。这些数据存储在变量中。\n\ni) 变量是数据存储空间的符号表示（标识符/名称）。\nii) 它由类型和存储类描述。\niii)\
  \ 变量的内容（即内存空间中的数据）在程序执行期间会发生。\n\n变量声明的通用形式：\n\n```\n[< storage class >] <type> <identifier1>\
  \ [, identifier2] ;\n```\n\n| 类型 | 内存（字节 (g++)） | 内容 |\n| :--- | :--- | :--- |\n\
  | ![](img/image00849.jpeg) | | |\n| ![](img/image00850.jpeg) | | |\n| char | 1 |\
  \ 字符符号 'H', 'e', 'n' |\n| boolean | 1 | 布尔型变量 false, true [仅限 C++] |\n| ![](img/image00851.jpeg)!(Images/image00852.jpeg)\
  \ | 4 | -32768 到 32767 |\n| short [int] | 2 | 整数 -32768 到 32767 |\n| long [int]\
  \ | 4 | -32768 到 32767 |\n| float | 4 | 浮点数 1.1, -1.56e-32 |\n| double | 8 | 1.1,\
  \ -1.56e-32, 5.68e+287 |\n| ![](img/image00851.jpeg)!(Images/image00854.jpeg) |\
  \ unsigned [int] | 4 | 常用数字 0 到 32767 |\n| ![](img/image00855.jpeg) | long long\
  \ [int] | 8 | 整数 -2³¹ 到 2³¹ |\n| long double | 12 | 浮点数 5.68e+287, 5.68e+420 |\n\
  \n备注：\n- 字符数据恰好存储一个 ASCII 或特殊字符。\n- ![](img/image00856.jpeg)!(Images/image00857.jpeg)整数组类型（`int`）的内存需求可能取决于编译器和操作系统（16/32\
  \ 位）。因此，建议阅读相关的编译器指令，或使用 `sizeof` 运算符通过 `sizeof( <type> )` 或 `sizeof( <variable>\
  \ )` 确定所需的实际字节数。参见以下示例：\n\n![](img/image00858.jpeg)\n\n![](img/image00859.jpeg)我们通常使用基本类型\
  \ `int` 用于适当的整数子范围，使用 `unsigned int` 用于常用数字。`unsigned` 标记也可以用于其他整数类型。\n\n### 2.1.2\
  \ 变量的命名\n\n![](img/image00860.jpeg)!(Images/image00861.jpeg)!(Images/image00862.jpeg)变量名以字母或下划线开头，后续字符也可以是数字。名称中不允许使用空格和运算符字符\
  \ `()`，变量名也不允许是 C++ 语法的关键字（参见附录）。\n\n![](img/image00840.jpeg)!(Images/image00863.jpeg)!(Images/image00840.jpeg)!(Images/image00864.jpeg)C/C++\
  \ 是区分大小敏感的，即 `totalHosen` 和 `toteHosen` 是不同的标识符！\n\n![](img/image00865.jpeg)根据原始\
  \ C 标准，变量标识符的前 8 个字符是有效的，即 `a2345678A` 和 `a2345678B` 不再被视为不同的标识符。编译器现在认为更多字符是有效的（C99\
  \ 标准：63 个字符）。\n\n## 2.2 常量\n\n大多数程序（包括 `HelloWorld.cc`）在程序过程中都会使用不可改变的值，所谓的常量。\n\
  \n### 2.2.1 整数常量\n\n十进制常量（基 10）：\n- `100 // int; 100`\n- `512L // long; 512`\n-\
  \ `128053 // long; 128053`\n\n八进制常量（基 8）：\n- `020 // int; 16`\n- `01000L // long;\
  \ 512`\n- `0177 // int; 127`\n\n十六进制常量（基 16）：\n- `0x5 // int; 5`\n- `0x200 // long;\
  \ 512`\n- `0xffff // int; 65535`\n\n### 2.2.2 浮点常量\n\n浮点常量总是被解释为 `double`。例如：\n\n\
  | 常量 | 值 |\n| :--- | :--- |\n| 10E | 10000 |\n| 1. | 1 |\n| .78 | 0.78 |\n| 2e-3\
  \ | 0.002 |\n| -3.25 | -3.25 |\n\n### 2.2.3 字符常量\n\n字符常量包含：\n\n| 字符 | 描述 |\n| :---\
  \ | :--- |\n| 'a' | 字符 |\n| ' ' | 空格 |\n| '_' | 下划线 |\n| '\\n' | 换行 |\n\n### 2.2.4\
  \ 字符串常量\n\n字符串常量：\n\n| 字符串 | 描述 |\n| :--- | :--- |\n| \"Hello World\" | 字符串 |\n\
  | \"\" | 空字符串 |\n\n### 2.2.5 宏常量\n\n在预处理器中，`define` 替换标识符：\n\n```\n#define N 5\n\
  ```\n\n### 2.2.6 使用 `const` 声明常量\n\n在代码中使用 `const` 标记，例如：\n\n```\nconst int N =\
  \ 5;\n```\n\n# 第 3 章：表达式、运算符与函数\n\n- 表达式由操作数和运算符组成。\n- 变量、常量或表达式。\n- 运算符对操作数执行操作。\n\
  \n## 3.1 赋值运算符\n\n赋值运算符 `<operand_A> = <operand_B>` 将右操作数赋值给左操作数，后者必须是变量。\n\n例如，在语句序列中：\n\
  \n```\nx = 0\ny = x + 4\n```\n`x` 的值为 0，`y` 的值为 4。其中 `x+4` 是一个由操作数 `x`, `4` 和运算符\
  \ `+` 组成的表达式。`x = 0` 和 `y = x + 4` 都是表达式。首先分号 `;` 将这些表达式转换为语句。\n\n也可以多次赋值：\n\n```cpp\n\
  x = 1\nx = 2\n```\n\n## 3.2 算术运算符\n\n### 3.2.1 一元运算符\n\n一元运算符只有一个操作数。\n\n| 运算符 |\
  \ 描述 | 示例 |\n| :--- | :--- | :--- |\n| - | 取反 | -a |\n\n### 3.2.2 二元运算符\n\n二元运算符有两个操作数。操作的结果取决于运算符。\n\
  \n| 运算符 | 描述 | 示例 |\n| :--- | :--- | :--- |\n| `+` | 加法 | `b + a` |\n| `-` | 减法\
  \ | `b - a` |\n| `*` | 乘法 | `b * a` |\n| `/` | 除法（整数） | `b/a` |\n| `%` | 整数除法的余数\
  \ | `b % a` |\n\n整数整数计算的是除法的整数部分，即 `8 / 3` 返回结果 `2`。然而，如果结果是 `2.666666`，则必须将至少一个运算符转换为浮点数，如示例所示。\n\
  \n### 3.3 比较运算符 15\n\n\n\n\n\n![](img/image00879.jpeg)!(Images/image00880.jpeg)\
  \ 关于优先级规则，如果文献证明你过时了，运算符的顺序可能会出错。“先点计算后减法计算”的规则在 C/C++ 中同样适用。类似于学校里的圆括号表达式 `(<expression>)`\
  \ 先计算。\n\n## 3.3 比较运算符\n\n比较运算符是二元运算符。结果值始终是一个整数值，其中 `FALSE` 返回 `0`，`TRUE` 返回非零。\n\
  \n|  | 说明 | 示例 |\n| :--- | :--- | :--- |\n| `>` | 大于 | `b > a` |\n| `>=` | 大于等于\
  \ | `b >= 3.14` |\n| `<` | 小于 | `a < b / 3` |\n| `<=` 小于等于 | `b * a <= c` |\n| `==`\
  \ | 等于（浮点数请注意！） | `a == b` |\n| `!=` | 不等于（浮点数请注意！） | `a != 3.14` |\n\n![](img/image00881.jpeg)\n\
  \n一种典型的错误发生在使用 `=` 而不是相等运算符 `==` 测试相等性时。这里写的是赋值运算符 `=`。编译器接受这两种源代码（取决于编译器），如果代码是错误的，可能会发出警告。\n\
  \n![](img/image00882.jpeg)\n\n在错误的代码中触发了未知的副作用，测试中变量 `i` 没有正确的写法，因此我们使用 `i = i`。即下文所示，正确的代码没有副作用的。\n\
  \n![](img/image00883.jpeg)\n\n## 3.4 逻辑运算符\n\n## 3.4 逻辑运算符\n\n现在将 `!` 和 `&&` 视为逻辑运算符：\n\
  \n| 运算符 | 说明 | 示例 |\n| :--- | :--- | :--- |\n| `!` | 逻辑非 | `!(3>4)` // `TRUE` |\n\
  \n### 二元逻辑运算符：\n\n| 运算符 | 说明 | 示例 |\n| :--- | :--- | :--- |\n| `&&` | 逻辑与 | `(3>4)\
  \ && (3<=4)` // `FALSE` |\n| `||` | 逻辑或 | `(3>4) || (3<=4)` // `TRUE` |\n\n![](img/image00884.jpeg)\
  \ 逻辑与和逻辑或的真值表在代数中已知（否则请参见文献）。\n\n![](img/image00885.jpeg)\n\n## 3.5 位运算符\n\n位是最小的信息单位，恰好有两种可能的状态：\n\
  \n![](img/image00886.jpeg) 位设置：\n```\n≡ (0)\n≡ (1)\n```\n![](img/image00887.jpeg)\
  \  真\n\n![](img/image00888.jpeg)!(Images/image00889.jpeg) 一个字节由 8 位组成，因此一个 `short\
  \ int` 数字的长度为 16 位。位操作中的运算符通常出现在整数表达式中。\n\n### 3.5.1 一元位运算符\n\n![](img/image00890.jpeg)\n\
  | 运算符 | 说明 | 示例 |\n| :--- | :--- | :--- |\n| `~` | 二进制补码，操作数的按位取反 | `~k` |\n\n###\
  \ 3.5.2 二元位运算符\n\n![](img/image00891.jpeg)\n| 运算符 | 说明 | 示例 |\n| :--- | :--- | :---\
  \ |\n| `&` | 按位与操作数 | `k & l` |\n| `\\|` | 按位或 | `k \\| l` |\n| `^` | 按位异或 | `k\
  \ ^ l` |\n| `<<` | 将 `<op1>` 向左移 `<op2>` 位 | `op1 << op2` |\n| `>>` | 将 `<op1>`\
  \ 向右移 `<op2>` 位 | `op1 >> op2` |\n\n```\nk << 2 // = k*4\nk >> 2 // = k/4\n```\n\
  \n| 真值表: x | y | x & y | x \\| y | x ^ y |\n| :--- | :--- | :--- | :--- | :--- |\n\
  | 0 | 0 | 0 | 0 | 0 |\n| 0 | L | 0 | L | L |\n| L | 0 | 0 | L | L |\n| L | L | L\
  \ | L | 0 |\n\n![](img/image00892.jpeg) 这些运算符在以下示例中演示：\n\n```\nl = 5; // 0..000101\
  \ = 5\nk = 6; // 0..000110 = 6\n```\n![](img/image00893.jpeg) 位操作在测试一个整数是偶数还是奇数时非常有用。最低位可以配合整数区分奇偶数（参见上述代码中数字\
