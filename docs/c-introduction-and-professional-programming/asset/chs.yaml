  \ longinternalmat_nr); void SetSKZ(constintskz_nr);\n\n    // 不操作 students 数据的方法\n\
  \    const long int& GetMatrikel() const;\n\n    const int& GetSKZ() const; const\
  \ char* GetFirstName() const; const char* GetName() const;\n};\n```\n\n\n\n\n![](img/image01190.jpeg)![](img/image01191.jpeg);\n\
