  \n- 块末尾的右括号 `}` 后面不需要加分号。\n- 块可以用来替代语句。\n- 块之间可以相互嵌套。\n\n![](img/image00920.jpeg)![](img/image00921.jpeg)在块中声明的变量在该块内可见，即该变量在块外部不存在（局部性）。相反，可以访问上级块的变量。\n\
  \n![](img/image00922.jpeg)\n\n## 4.3 分支\n\n分支（也称为备选）的标准形式为：\n\n```c++\nif ( <logical\
