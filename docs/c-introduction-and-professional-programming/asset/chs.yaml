  \ = 2` 也是如此。然而，这里没有找到（平凡的）解 `x0 = 0`，因为输入了 `a = 0`。当 `a = 0`, `b = 1` 或 `a = 1`,\
  \ `b = 0.1` (`x0 := 0 [a, b]`) 时，程序运行一段时间后因段错误终止，因为递归没有停止，在某一点为函数调用预留的内存（栈）不再足够。\n\
