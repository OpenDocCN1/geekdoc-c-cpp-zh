  \n## 8.6 数据封装\n\n![](img/image01187.jpeg)`students` 中的数据被分类为 `public`，这意味着任何人都可以访问这些数据，如\
  \ `mike.pfirstname`。为了保护数据免受意外访问，我们将数据封装到类中，仅提供访问方法。相关的分类是由 `private` 逻辑指定的。因此，修改\
  \ `students` 类的声明部分在\n\n![](img/image01189.jpeg)\n\n```\n//students2.hh\n#include\
  \ <iostream.h>\n\nclass students\n{\n// students 中的数据现在是私有的！！\nprivate:\n    long\
