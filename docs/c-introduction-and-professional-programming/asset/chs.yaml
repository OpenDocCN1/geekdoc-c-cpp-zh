  \n## 7.8 示例：二分法\n\n第 39 页的示例是关于在区间 $(a,b)$ 内确定 $f(x) := \\sin(x)$ 的零点，其中 $a = 0$\
  \ 且 $b = 1$。只要 $f(a) > 0 > f(b)$，该问题（对于连续函数）就可以使用二分法求解。二分算法本质上由以下区间 $[a, b]$ 的步骤组成：\n\
  \n(i) $c := (a + b)/2$\n(ii) 如果 $|f(c)|$ 足够接近 0\n(iii) 如果 $f(c) > 0$\n    Bisect(c,\
  \ b)\n(iv) 否则\n    Bisect(a, c)\n\n这种递归结构图给出了 `Bisect()` 函数的定义，带参数调用：\n\n```\nx0\
  \ = Bisect(a, b, 1e-6);\n```\n\n这是第 1 版本的程序。\n\n\n\n\n\n![](img/image01159.jpeg)![](img/image01160.jpeg)我们的程序可以顺利地运行\
