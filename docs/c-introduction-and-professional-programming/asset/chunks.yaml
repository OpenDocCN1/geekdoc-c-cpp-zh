    # 第 3 章：表达式、运算符与函数


    - 表达式由操作数和运算符组成。

    - 变量、常量或表达式。

    - 运算符对操作数执行操作。


    ## 3.1 赋值运算符


    赋值运算符 `<operand_A> = <operand_B>` 将右操作数赋值给左操作数，后者必须是变量。


    例如，在语句序列中：


    ```

    x = 0

    y = x + 4

    ```

    `x` 的值为 0，`y` 的值为 4。其中 `x+4` 是一个由操作数 `x`, `4` 和运算符 `+` 组成的表达式。`x = 0` 和 `y = x
    + 4` 都是表达式。首先分号 `;` 将这些表达式转换为语句。


    也可以多次赋值：


    ```cpp

    x = 1

    x = 2

    ```


    ## 3.2 算术运算符


    ### 3.2.1 一元运算符


    一元运算符只有一个操作数。


    | 运算符 | 描述 | 示例 |

    | :--- | :--- | :--- |

    | - | 取反 | -a |


    ### 3.2.2 二元运算符


    二元运算符有两个操作数。操作的结果取决于运算符。


    | 运算符 | 描述 | 示例 |

    | :--- | :--- | :--- |

    | `+` | 加法 | `b + a` |

    | `-` | 减法 | `b - a` |

    | `*` | 乘法 | `b * a` |

    | `/` | 除法（整数） | `b/a` |

    | `%` | 整数除法的余数 | `b % a` |


    整数整数计算的是除法的整数部分，即 `8 / 3` 返回结果 `2`。然而，如果结果是 `2.666666`，则必须将至少一个运算符转换为浮点数，如示例所示。


