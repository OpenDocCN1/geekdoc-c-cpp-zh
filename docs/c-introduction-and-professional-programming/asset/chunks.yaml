    \n```\nLINUX> ar r libstud.a student.o\n```\n\n归档选项（这里是 `r`）随编译器的不同而异。(Images/image01132.jpeg)!(Images/image01133.jpeg)\
    \ 从当前目录编译并带上库链接主程序：\n\n```\nLINUX> g++ Ex752.cc -L. -lstud\n```\n\n不使用库编译和链接程序所需的步骤如下：\n\
    \n```\ng++ -c student.cc\n```\n\n---\n\n```\ng++ -c Ex752.cc\nstudent.o\n```\n\
    \n---\n\n![](img/image01135.jpeg) 另一种方式也是模块化的：(Images/image01136.jpeg)\n\n```\n\
    Ex752.cc, student.cc\ng++ Ex752.cc student.cc\n```\n\n使用 `libstud.a` 库时，过程如下：(Images/image01137.jpeg)\n\
    \n```\nstudent.cc\ng++ -c student.cc\ng++ -c student.o\n```\n\na-b 且例如。--> `libstud.a`\
    \ (Images/image01138.jpeg)\n\n```\ng++ Ex752.o\n```\n\n![](img/image01139.jpeg)\n\
    ```\nEx752.cc\nEx752.o\n```\n-L. -lstud 我们已经可以使用现有的库，例如：(Images/image01140.jpeg)\n\
    \n```\nEx752.cc, libstud.a\ng++ Ex752.cc -L. -lstud\na.out\n```\n\n### 7.6 主程序\n\
    \n到为止用于主程序的语法：\n\n```cpp\nmain()\n{\n    ...\n}\n```\n\n始终被编译器使用，因为没有指定类型 `int`\
    \ 的函数默认返回 `0`，表示主程序处理无。程序处理可以在任何时间停止，也可以在函数中使用指令 `exit(<int_value>)`。此时 `<int_value>`\
    \ 是程序的返回值，可以用于诊断。(Images/image01141.jpeg)上述程序在 `n < 0` 时立即中断并返回错误代码 `1`。`exit`\
    \ 语句也可以用于 `fun()`。与其他函数一样，主程序也可以带参数调用，但参数列表（更准确说是参数类型）规定如下：\n\n```cpp\nint main(int\
