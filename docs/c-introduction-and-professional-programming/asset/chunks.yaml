    so that the runtime behavior can be analyzed by gprof after the program run. The
    last command (can also be an editor) displays the redirected output of this analysis
    on the screen.


    ## 11.4 debugging


    It is often necessary to follow the program flow step by step and, if necessary,
    to have variable values ​​etc. output for control purposes. Next


    enrightalways working, but annoyingend,method


    ...


    cout << "AA" << variable << endl;


    ...


    cout << "BB" << variable << endl;


    ...


    areOften professional debugging tools are availableavailable.  Here is one again(free)
    program under LINUX presented.


    LINUX> g++ -g Ex1121.cc


    LINUX> ddd a.out &


    The handling of the various debuggers differs greatly. With the ddd debugger,
    the input file can be specified with set args < input.1121 and the test run is
    started with run, which is stopped at previously set break points. There, the
    program can be followed step by step using the source code.


