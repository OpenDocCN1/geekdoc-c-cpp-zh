    \ argv[argc-1]` 调用程序时的参数作为字符串\n*   `argc` 始终 $\\ge 1$，程序名始终\n\nImages/image01142.jpeg)!(Images/image01143.jpeg)\
    \ `atoi(char*)`（等于 ASCII 到 int）转换为整数，并在 `stdlib.h` 中声明。通过 `atoi(char*)` 让自己接受一个浮点数作为参数。编译链接后，可以启动程序\
    \ `a.out`：\n\n```\nLINUX> a.out\n```\n\n或\n\n```\nLINUX> a.out 5\n```\n\n在一种情况下，从键盘读取\
    \ `n` 的值；在另一种情况下，从命令行获取并赋值值 5。关于命令行参数传递的优雅且真实的 C++ 解决方案可以在 [Str, pp.126] 中找到。\n\
    \n### 7.7 递归函数\n\nC/C++ 中的函数可以递归调用。示例要实现的幂：\n\n```\nxk = x * xk-1\n```\n $x \\\
    in, k \\in$ 也可以是 $k = 0$。\n\n![](img/image01145.jpeg)!(Images/image01146.jpeg)!(Images/image01147.jpeg)\n\
    \n### 7.8 示例：二分法\n\n第 39 页的示例是关于在区间 $(a,b)$ 内确定 $f(x) := \\sin(x)$ 的零点，其中 $a =\
    \ 0$ 且 $b = 1$。只要 $f(a) > 0 > f(b)$，该问题（对于连续函数）就可以使用二分法求解。二分算法本质上由以下区间 $[a, b]$\
    \ 的步骤组成：\n\n(i) $c := (a + b)/2$\n(ii) 如果 $|f(c)|$ 足够接近 0\n(iii) 如果 $f(c) > 0$\n\
    \    Bisect(c, b)\n(iv) 否则\n    Bisect(a, c)\n\n这种递归结构图给出了 `Bisect()` 函数的定义，带参数调用：\n\
    \n```\nx0 = Bisect(a, b, 1e-6);\n```\n\n这是第 1 版本的程序。\n\n"
