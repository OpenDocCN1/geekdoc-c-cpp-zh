  trans: "\n非拒绝循环（non-rejecting cycle）是指不预先固定执行次数，其终止测试在循环执行后进行。因此，非拒绝循环至少执行一次循环内部的指令。\n\
    \n通用形式为\n\n```markdown\nof the \n\n<statement>\n\nwhile (<logical expression>)\
    \ ;\n```\n\n![](img/image00976.gif) 结构图 (Structogram):\n\n![](img/image00977.jpeg)\
    \ \n\n**示例：** 从键盘读取字符，直到输入 `x` 为止。\n\n![](img/image00978.jpeg)\n\n考虑一个更有挑战性的例子，即从\
    \ `sin(x) = x/2` 中确定 `x \\in (0, π)` 的根。对于这个问题，你需要考虑等效零问题：确定以下函数的零点 `x0 \\in (0,\
    \ π)`\n\n![](img/image00979.jpeg)\n函数 `f(x) := sin(x)x/2 = 0` 。\n\n**分析法：** 没有实际的解。\n\
    \n**图形法：** 绘制函数 `f(x)` 并手动缩小（减半）低分辨率区间。重复此过程，直到 `x0` 可以被足够精确地确定，即达到预定的位数。\n\n\
    ![](img/image00980.jpeg) ![](img/image00981.jpeg) `f(x) =sin(x)-x/20.25`\n\n![](img/image00982.jpeg)\
    \ 0.2\n0\n–0.2\n0.3\n0.2\n0.2\n0.15\n–0.4\n0.1\n–0.6\n–0.8\n0.1\n0.05\n-1\n02\n\
    –1.202\n–1.4\n–0.05\n–1.6\n\n**数值法：** 上述图形过程可以应用于纯数值计算。具有计算机经验的并可以使用正确的 MAPLE\
    \ - \n\n![](img/image00983.jpeg) ![](img/image00984.jpeg) ![](img/image00985.jpeg)\
    \ 调用 `ffsolve(sin(x)=x/2,x=0.1..3)` 返回近似结果 `x0 = 1.895494267` 。我们正在开发一个程序，通过二分法确定区间\
    \ `[a, b]` 内 `f (x) := sin(x) x/2` 的零点，为了简化，假设 `f(a) > 0` 且 `f(b) < 0`。区间的中点标记为\
    \ `c := (a + b)/2`。然后我们如下所示：\n\n```markdown\nx0 \\in [c, b] if f (c) > 0\n```\n\
    \n![](img/image00986.jpeg) ![](img/image00987.jpeg) \n```markdown\n{x0 \\in [a,\
    \ c] iff f(c) < 0\n```\n\n![](img/image00988.jpeg) 通过重新定义区间边界 `a` 和 `b`，可以将零搜索缩小到更小的（减半的）区间。我们使用非拒绝循环演示其实现。\n\
    \n**结构图：**\n\n![](img/image00989.gif)\n\n上述二分法也可以通过拒绝循环（rejecting cycle）来实现。\n\
    \n![](img/image00990.gif)\n\n![](img/image00991.jpeg)\n\n由于浮点数的精度有限，中止测试 `f(c)\
    \ = 0` 通常会导致程序无限循环。因此，使用给定精度 `0 < ε < 1` 的中断测试如 `|f(c)| < ε` 更好。\n\n![](img/image00992.jpeg)\
    \ 例如：在冷却循环 `(for)` 后面至少执行一次循环直到结束，以及通过不同的结束 `(while)`，这与非拒绝循环 `(do while)` 是等价的。这些等价的示例可以在\
    \ 4.8 的正确应用中使用。如果冷却循环中始终结果为 `FALSE`（即在循环中没有执行循环体），那么在不同的结束循环中，之前之后是等价的。然而如果结束循环不再等价，那么在这种情况下循环也会被处理一次。参见示例文件\
    \ `Loops.cc`。\n\n## 4.7 多路选择 (switch 语句)\n\n额外的选择功能允许个人根据特定变量的值做出反应。\n\n```markdown\n\
    switch (<expression>)\n{\n    case <const_expression_1>:\n        <statement_1>\
    \ [break;]\n    ...\n    case <const_expression_n> :\n        <statement_n> [break;]\n\
    \    default:\n        <statement_default;\n}\n```\n\n![](img/image00994.jpeg)\
    \ ![](img/image00995.jpeg) **示例：** 输出整数输入 `{1, 2, 3}`。\n\n上面的 `switch` 语句也可以用于多路分支（由于这个），但在\
    \ `switch` 语句中，各个分支是显式的，并且通过 `break;` 语句离开。如果没有 `break;`，\n\n## 4.8 无条件控制转移\n\n\
    无条件的控制转移允许你跳转到程序的其他部分。使用 `goto` 语句来实现此，但通常不建议使用。\n"
