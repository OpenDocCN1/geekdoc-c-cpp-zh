    | `fabs(x)` | $x$ 的绝对值 |

    | `fmod(x,y)` | $x/y$ 的实数余数 (`y = 0`) |

    | `ceil(x)` | 向上取整 |

    | `floor(x)` | 向下取整 |

    | `sin(x)`, `cos(x)`, `tan(x)` | 三角函数 |

    | `asin(x)`, `acos(x)` | 反三角函数 ($x$ 在 [-1, 1] 之间) |

    | `atan(x)` | 反三角函数 |

    | `M_E` | 欧拉数 $e$ |

