  trans: "\n![](img/image00918.gif)\n\n![](img/image00919.jpeg)在 C 语言中，声明部分必须紧随块的开头。在\
    \ C++ 中，你可以允许代码块存在多个部分，它们必须位于变量名相应的首次使用之前。然而，为了程序的清晰性，不应过度利用这一特性。\n\n- 块末尾的右括号\
    \ `}` 后面不需要加分号。\n- 块可以用来替代语句。\n- 块之间可以相互嵌套。\n\n![](img/image00920.jpeg)![](img/image00921.jpeg)在块中声明的变量在该块内可见，即该变量在块外部不存在（局部性）。相反，可以访问上级块的变量。\n\
    \n![](img/image00922.jpeg)\n\n## 4.3 分支\n\n分支（也称为备选）的标准形式为：\n\n```c++\nif ( <logical\
    \ expression> )\n    <statement_A> \nelse\n    <statement_B>\n```\n\n例如，每次选择都会依次应用。`else`\
    \ 分支可以被忽略（简单备选）。\n\n结构图：\n\n![](img/image00923.gif)\n\n正如常见的情况一样，具体问题可以通过多种方式进行编程。\n\
    \n![](img/image00924.jpeg)示例：我们考虑海维德函数（Heaviside function）的计算：\n\n```c++\ny(x)\
    \ = 1 if x ≥ 0\n     = 0 if x < 0\n```\n\n![](img/image00925.jpeg)并给出四种实现变体。\n\
    \n![](img/image00926.jpeg)\n\n选项 A：简单备选\n\n![](img/image00927.jpeg)\n\n变体 b：双分支\n\
    \n![](img/image00928.jpeg)\n\n变体 c：带有阻塞的双备选\n\n![](img/image00929.jpeg)\n\n变体\
    \ d：决策运算符。\n\n在双分支中，如果每个分支只对同一个变量进行一次赋值（如版本 b 和 c 所示），可以使用决策运算符：\n\n```c++\n<logical\
    \ expression> ? <expression A> : <expression B>\n```\n\n![](img/image00840.jpeg)![](img/image00840.jpeg)示例：另一个示例是符号函数（signum\
    \ function）的计算：\n\n![](img/image00931.jpeg)\n```c++\ny(x) = 1 if x > 0\n     =\
    \ 0 if x = 0\n     = -1 if x < 0\n```\n\n![](img/image00932.gif)![](img/image00933.jpeg)我们提供了几种实现变体。结构图：\n\
    \n我们考虑两种实现变体，框架程序与第 28 页上的框架程序相同。\n\n![](img/image00934.jpeg)选项 A：备选嵌套\n\n变体 b：else\
    \ 分支现在使用一个 if-else 语句，变体 a 可以稍微修改。\n\n![](img/image00935.jpeg)\n\n通常情况下，这种多路径决策可以写作：\n\
    \n```c++\nif ( <logical expression_1> )\n    <statement_1>\nelse if ( <logical\
    \ expression_2> )\n    <instruction_2>\n    ...\nelse if ( <logical expression_(n-1)>\
    \ )\n    <statement_(n-1)> \nelse\n    <statement_n>\n```\n\n其中 `else` 分支是可选的。\n\
    \n![](img/image00936.jpeg)示例：确定输入的两个数的最小值和最大值。\n\n结构图：\n\n![](img/image00937.gif)\n\
    \n![](img/image00938.jpeg)\n\n![](img/image00939.jpeg)示例：确定输入的三个数中的最小值。结构图：\n\n\
    ![](img/image00940.gif)\n\n![](img/image00941.jpeg)\n\n## 4.4 计数循环 (for 循环)\n\n\
    计数循环代表预先确定的循环次数，在运行循环之前进行测试。其通用形式为：\n\n```c++\nfor (<expression_1>; <expression_2>;\
    \ <expression_3>)\n    <statement>\n```\n\n最好的示例是将计数循环作为允许的输入。\n\n![](img/image00942.jpeg)示例：计算\
    \ 计算前 5 个自然数的和。\n\n![](img/image00943.jpeg)在上面的程序示例中，`i` 是循环的运行变量，初始化为 `i = 1`\
    \ (`<expression_1>`)，通过 `i = i+1` (`<expression_3>`) 继续。测试 `i <= n` (`<expression_2>`)\
    \ 关于循环容量的上限。在循环内部，`sum = sum + i;`（语句）是循环的实际计算步骤。求和变量 `sum` 必须在进入循环之前初始化。\n\n\
    该求和循环的紧凑版本（正确但非常难以读）为：\n\n```c++\nfor (sum = 0, i = 1; i <= n; sum += i, i++)\n\
    ```\n\n语句结束符 `;` 与表达式列表中的分隔符 `,` 之间进行了区分。这些列表从左到右处理。\n\n![](img/image00944.jpeg)`<expression_2>`\
    \ 始终是一个逻辑表达式，`<expression_3>` 是操作运行变量的算术表达式，例如：\n\n```c++\ni++\nj = d-2; d +=\
    \ 2\nx = x+h // float 类型\nk = 2*k // 翻倍\nl = l/4 // 四分之一 - 注意整数\n```\n\n结构图：\n\
    \n![](img/image00945.gif)\n\n控制变量可以是简单变量，例如 `int` 或 `double`。\n\n![](img/image00946.jpeg)\n\
    \n![](img/image00844.jpeg)![](img/image00947.jpeg)![](img/image00948.jpeg)在使用浮点数\
    \ (`float`, `double`) 作为变量时要小心。由于内部数字表示，正确的终止测试可能不容易实现。\n\n结构图：\n\n![](img/image00949.gif)示例：这是一个双倍和。\n\
    \n![](img/image00950.jpeg)n![](img/image00951.jpeg)\n```c++\nsum = 1\ni = 2\n\
    k = 1\n```\n\n![](img/image00952.jpeg)\n```c++\nk = 1\ni = 1\n```\n\n![](img/image00953.jpeg)![](img/image00954.jpeg)求和变量\
    \ `sum` 必须在进入循环之前初始化。\n\n![](img/image00955.jpeg)后续示例说明了浮点数的问题以及关于它们的一些提示。\n\n\
    ![](img/image00956.jpeg)示例：区间 `[0, 1` 的离散节点输出。\n\n## 4.6 非拒绝循环 (do-while 循环)\n"
