- fmt: "\n# Chapter 1 The first program\n\n## 1.1 What is a program?\n\nActually,\
    \ everyone already knows programs, but one often understands different contents\
    \ by them:\n* party manifesto ↔ ideas\n* theater program ↔ scheduling\n* music\
    \ score ↔ strict sequence of instructions\n* Windows program ↔ interactive action\
    \ with the computer\n\nSoftware includes all four aspects in the above list. A\
    \ typical exercise is to comply the following:\n\n### What should I do?\n\nidea\
    \ on paper. (What should the computer do?)\nFormulate idea in a programming language.\
    \ Draft. (How can the computer realize the idea?)\nEdit source text/source file.\
    \ (What expressions I use?)\nCompile and link file. (translation into processor\
    \ language)\n\nStructogram:\nprogram code\nTest program with different data sets.\n\
    \n1. The learning process in programming typically proceeds from the bottom up\
    \ in the previous overview.\n2. software = program + code + ideas.\n\nRemarks:\
    \ I meant that completely differently.\n\n## 1.2 THE “HELLO WORLD” PROGRAM IN\
    \ C\n\nidea: The simplest program that only writes a message on the screen.\n\
    source code (`HelloWorld.c`):\n\n```c\n/* Start, end of comment */\npredefined\
    \ functions/Variables/constants\nint main() {\n    printf(\"Hello, World!\\n\"\
    );\n    return 0;\n}\n```\n\ninput and compile, execute program:\n0. Turn on computer,\
    \ log in.\n\nLog in:\n1. Open terminal or file manager and change to the working\
    \ directory.\n`LINUX> cd progs`\n2. Enter source text in the source file, editor\
    \ of your choice.\n`LINUX> edit HelloWorld.c`\n`LINUX> emacs HelloWorld.c`\n3.\
    \ Compile source file.\n`LINUX> gcc HelloWorld.c`\n4. execute program.\n`LINUX>\
    \ a.out` or `LINUX> ./a.out` or `WIN> ./a.exe`\n\nRemarks: Generated program with\
    \ the default name `a.out`. Cases, e.g., `myprog`, should be called:\n`LINUX>\
    \ gcc -o myprog HelloWorld.c`\n`LINUX> myprog`\n\nUse the concrete command line\
    \ to compile before considering the compiler.\n\n## 1.3 The “Hello World” program\
    \ in C++\n\nIdea and structogram as in section 1.2 source code (`HelloWorld.cc`):\n\
    \n```cpp\n#include <iostream>\n/* comment to line */\nint main() {\n    std::cout\
    \ << \"Hello, World!\" << std::endl;\n    return 0;\n}\n```\n\npredefined classes\
    \ and methods\nBeginning of the main program\nsimple instruction\nblock statements\n\
    \ncompile, execute program:\n0. as in 1.2.\n2. Edit source file.\n`LINUX> edit\
    \ HelloWorld.cc`\n3. Compile source file.\n`LINUX> g++ HelloWorld.cc`\n4. execute\
    \ program. `LINUX> a.out` or `LINUX> ./a.out` or `WIN> ./a.exe`\n\nRemarks: Source\
    \ code of `HelloWorld.c` can also be written in C++ and replaced with:\n`LINUX>\
    \ g++ HelloWorld.c`\n\nHowever, the source text line `#include <stdio.h>` is then\
    \ absolutely necessary.\n* C instructions are a subset of the C++ instructions.\n\
    * The C comment `/**/` can also be used in C++.\n* The C++ comment `//` belongs\
    \ to the syntax of C++ and should therefore not be used in C programs. Otherwise\
    \ there is a portability problem, ie not every C compiler can compile the source\
    \ code.\n\nProgramming tip: Give (nearly) always right means one equals since\
    \ one idea aims computer program to realize.\n==> Find your own programming style\
    \ (and improve it).\n\n## 1.4 INTERNAL DETAILS WHEN PROGRAMMING\n\n## 1.4 Internal\
    \ details when programming\n\nEasy change each call to compile:\n`LINUX> g++ -v\
    \ HelloWorld.cc`\n\nGenerated a longer screen output showing several stages of\
    \ compiling indicates. Here are some tips on how to look at each phase to better\
    \ understand the process:\n\na) Preprocessing:\nheader files (`*.hh` and `*.h`)\
    \ are added to the source file (+ macro definitions, conditional compilation).\n\
    `LINUX> g++ -E HelloWorld.cc > HelloWorld.ii`\nThe addition `> HelloWorld.ii`\
    \ directs the screen output to the `HelloWorld.ii` file. This `HelloWorld.ii`\
    \ file can be viewed with an editor and is a long C++ source code file.\n\nb)\
    \ substitute in assembly code:\nHere a source text file in the (processor-specific)\
    \ programming language generated.\n`LINUX> g++ -S HelloWorld.cc`\nThe resulting\
    \ `HelloWorld.s` file can be viewed with the editor.\n\nc) Generate object code:\n\
    Now a file is created which contains the direct control commands, ie numbers,\
    \ for the processor.\n`LINUX> g++ -c HelloWorld.cc`\nThe file `HelloWorld.o` can\
    \ no longer be viewed in the normal text editor, but with\n`LINUX> hex HelloWorld.o`\n\
    \nd) links:\nbind all object files and necessary libraries for execution merge\
    \ program `a.out`.\n`LINUX> g++ HelloWorld.o`\n\n## 1.5 designations in the lecture\n\
    \nCommands in a command line under LINUX:\n`LINUX> g++ [-o myprog] filename.cc`\n\
    \nThe square brackets `[ ]` mark optional parts in commands or definitions. Each\
    \ file name consists of the available base name (file name) and the suffix (`.cc`)\
    \ which identifies the file type.\n\n• Some file types after the suffix: SuffixFileType\n\
    * Cc source file\n* `.H` header file (also C++), source file with predefined program\
    \ modules\n* `.cc[.cpp]` C++ source code file\n* `.hh[.hpp]` C++-Header file\n\
    * `.O` object file\n\nA statement `how<type>` means that this placeholder must\
    \ be replaced by an expression of the appropriate type.\n\n# 8 The data type class\n\
    \n## 8.1 Class declaration data and methods\n## 8.2 The constructors\n## 8.3 The\
    \ Destroyer\n## 8.4 The assignment operator\n## 8.5 The print operator\n## 8.6\
    \ data encapsulation\n\n# 9 File input and output\n\n## 9.1 Copy files\n## 9.2\
    \ Data input and output via file\n## 9.3 Switching input/output\n\n# 10 output\
    \ formatting\n\n# 11 tips and tricks\n\n## 11.1 Processor command\n## 11.2 timing\
    \ in the program\n## 11.3 profiling\n## 11.4 debugging\n\n# 7.8 egg n big bigger\
    \ s Example: bisection 86\n"
