  trans: "\n\n![](img/image01159.jpeg)![](img/image01160.jpeg)我们的程序可以顺利地运行 `f(x) =\
    \ sin(x) x/2`，并根据输入参数 `a = 1` 和 `b = 2` 得正确解 `x0 = 1.89549`，`a = 0` 和 `b = 2`\
    \ 也是如此。然而，这里没有找到（平凡的）解 `x0 = 0`，因为输入了 `a = 0`。当 `a = 0`, `b = 1` 或 `a = 1`, `b\
    \ = 0.1` (`x0 := 0 [a, b]`) 时，程序运行一段时间后因段错误终止，因为递归没有停止，在某一点为函数调用预留的内存（栈）不再足够。\n\
    \n![](img/image01161.jpeg)现在我们采取保护保护程序，例如能够找到存在的 `x0 = 0` 以及 `[0, 1]`？关于函数值 `f(a)`\
    \ 和 `f(b)`（假设 `a < b`）可能出现哪些情况？\n\n(i) `f (a)>0 > f(b)`（即 `f(a) > 0` 且 `f(b) <\
    \ 0`），例如 `a = 1`, `b = 2`\n\n==⇒ `Bisect3()` 中的标准情况。\n\n(ii) `f(a) > 0` 和 `f(b)\
    \ > 0`，分别 `a = 0.5`, `b = 1.5`\n\n![](img/image01162.jpeg)`f(a) < 0` 和 `f (b)\
    \ < 0`，例如 `a=1`, `b= 0.5`\n\n![](img/image01163.jpeg)可能都不为零。\n\n（区间内可能存在零，我们用二分法找不到它们！）\n\
    \n![](img/image01164.jpeg)(iii)`f (a) = 0` 或 `f (b) = 0`，更好的是 `|f (a)| < ε` 等。\n\
    \n==⇒ `a` 或 `b` 是零点，`a` 和 `b` 都是零点。\n\n(iv) `f(a) < 0 < f(b)`，例如 `a = −1`, `b\
    \ = 0.1`\n\n交换 `a` 和 `b`==⇒ 情况 (i)。\n\n(v) `a =b`==⇒ 包含在 (ii) 和 (iii) 中。\n\n`b\
    \ < a`==⇒ 进入 (i) 或 (iv)。\n\n![](img/image01165.jpeg)这种分类导致了下面的结构图和第 4 版本。\n\n\
    结构图 (Structogram):\n\n![](img/image01166.gif)\n\n![](img/image01167.jpeg)![](img/image01168.jpeg)最后我们在程序中定义了更多函数\
    \ `h(x) = 3 ex`, `t(x) = 1 x2`，询问用户使用哪种数学函数进行根，并计算区间内的根。这种选择可以通过 `switch` 语句轻松实现，并引导产生第\
    \ 5 版本。\n\n![](img/image01169.jpeg)注释：三个函数 `Bisect[1-3]()` 的参数列表不同。因此，所有三个函数都可以以\
    \ `Bisect()` 的名称使用，因为它们的签名不同，编译器确切知道应该使用哪个 `Bisect()` 函数。\n\n# 第 8 章：数据类型类 (class)\n\
    \n![](img/image01170.jpeg)![](img/image01171.jpeg)学生 2 6.4 节包含了动态数据结构，通过这些结构必须特殊地实现对应变量的初始化和复制（另见\
    \ 7.5.2）。C++ 类概念的众多优势之一是，带有动态组件的数据结构可以像简单数据类型一样在主程序中处理。当然，这需要一些准备工作。\n\n![](img/image01172.jpeg)`class`\
    \ 是带有关联方法（函数）的数据类型，将在结构体中创建并以类似的方式使用。类的方法始终可以访问类的数据。\n\n![](img/image01173.jpeg)![](img/image01174.jpeg)从结构体\
    \ `Student2` 我们推导出一个类 `Students`。我们将类的所有声明保存在头文件 `studenten.hh` 中，将所有定义保存在 `studenten.cc`\
    \ 中。在 `studs.hh` 和 `studs.cc` 文件中可以关于指针初始化的修改变体。\n\n![](img/image01175.jpeg)\n\
    \n![](img/image01176.jpeg)\n\n## 8.1 类声明数据和方法\n\n![](img/image01177.jpeg)这是 `Students`\
    \ 类的声明，包含了绝对必要的方法。让我们按照给顺序查看它们。\n\n## 8.2 构造函数\n\n构造函数用于类数据的初始初始化。通常，一个类应该至少包含以下构造函数：\n\
    \n- 默认构造函数的定义（无参数）\n\n8.2 构造函数\n\n![](img/image01178.jpeg)`::` 表示作用域运算符。默认构造函数在主程序中使用，以便所有数据已初始化。\n\
    \n- 参数构造函数\n\n![](img/image01179.jpeg)通过参数构造函数，创建并初始化 `Students` 变量：`Students(\"\
    arni\", \"Schwarz\")`。\n\n- 拷贝构造函数\n\n![](img/image01180.jpeg)拷贝构造函数允许创建同类的变量：`Students(arni)`。\n\
    \n## 8.3 析构函数\n\n![](img/image01181.jpeg)每个类都有析构函数，在离开块时自动调用。析构函数的主要任务是释放动态内存。\n\
    \n## 8.4 赋值运算符\n\n![](img/image01182.jpeg)构造函数总是访问未初始化的数据。为了给已初始化的变量赋值，必须定义赋值运算符：`robbi\
    \ = arni`。\n\n## 8.5 打印运算符\n\n![](img/image01183.jpeg)`friend` 标识符允许 `ostream`\
    \ 类定义新方法。其定义如下：\n\n```\nostream & operator<<(ostream & s, const students & orig)\n\
    ```\n\n![](img/image01184.jpeg)输出用法：\n\n```\ncout << robbi << endl;\n```\n\n![](img/image01185.jpeg)我们使用\
    \ 6.4 中的示例 `Ex43-correct.cc`（或 `Ex752.cc`）更容易编写和扩展。命令行：\n\n```\nLINUX> g++ Ex851.cc\
    \ students.cc\n```\n\n生成了可执行程序。\n\n## 8.6 数据封装\n\n![](img/image01187.jpeg)`students`\
    \ 中的数据被分类为 `public`，这意味着任何人都可以访问这些数据，如 `mike.pfirstname`。为了保护数据免受意外访问，我们将数据封装到类中，仅提供访问方法。相关的分类是由\
    \ `private` 逻辑指定的。因此，修改 `students` 类的声明部分在\n\n![](img/image01189.jpeg)\n\n```\n\
    //students2.hh\n#include <iostream.h>\n\nclass students\n{\n// students 中的数据现在是私有的！！\n\
    private:\n    long int register;\n    int skz;\n    char *pname, *pfirstname;\n\
    \n// students 中的方法\npublic:\n    //构造函数、析构函数、访问运算符\n    ...\n\n    // 输出运算符\n\
    \    friend ostream & operator<<(ostream & s, const students & orig);\n\n    //访问私有数据的方法\n\
    \    // 操作数据的方法\n    void SetFirstName(const char firstname[]);\n\n    void SetName(const\
    \ char name[]);\n\n    void SetMatrikel(const longinternalmat_nr); void SetSKZ(constintskz_nr);\n\
    \n    // 不操作 students 数据的方法\n    const long int& GetMatrikel() const;\n\n    const\
    \ int& GetSKZ() const; const char* GetFirstName() const; const char* GetName()\
    \ const;\n};\n```\n\n"
