    ![](img/image00879.jpeg)!(Images/image00880.jpeg) 关于优先级规则，如果文献证明你过时了，运算符的顺序可能会出错。“先点计算后减法计算”的规则在
    C/C++ 中同样适用。类似于学校里的圆括号表达式 `(<expression>)` 先计算。


    ## 3.3 比较运算符


    比较运算符是二元运算符。结果值始终是一个整数值，其中 `FALSE` 返回 `0`，`TRUE` 返回非零。


    |  | 说明 | 示例 |

    | :--- | :--- | :--- |

    | `>` | 大于 | `b > a` |

    | `>=` | 大于等于 | `b >= 3.14` |

    | `<` | 小于 | `a < b / 3` |

    | `<=` 小于等于 | `b * a <= c` |

    | `==` | 等于（浮点数请注意！） | `a == b` |

    | `!=` | 不等于（浮点数请注意！） | `a != 3.14` |


    ![](img/image00881.jpeg)


    一种典型的错误发生在使用 `=` 而不是相等运算符 `==` 测试相等性时。这里写的是赋值运算符 `=`。编译器接受这两种源代码（取决于编译器），如果代码是错误的，可能会发出警告。


    ![](img/image00882.jpeg)


    在错误的代码中触发了未知的副作用，测试中变量 `i` 没有正确的写法，因此我们使用 `i = i`。即下文所示，正确的代码没有副作用的。


    ![](img/image00883.jpeg)


    ## 3.4 逻辑运算符


    ### 3.4 逻辑运算符


    现在将 `!` 和 `&&` 视为逻辑运算符：


    | 运算符 | 说明 | 示例 |

    | :--- | :--- | :--- |

    | `!` | 逻辑非 | `!(3>4)` // `TRUE` |


    #### 二元逻辑运算符：


    | 运算符 | 说明 | 示例 |

    | :--- | :--- | :--- |

    | `&&` | 逻辑与 | `(3>4) && (3<=4)` // `FALSE` |

    | `||` | 逻辑或 | `(3>4) || (3<=4)` // `TRUE` |


    ![](img/image00884.jpeg) 逻辑与和逻辑或的真值表在代数中已知（否则请参见文献）。


    ![](img/image00885.jpeg)


    ## 3.5 位运算符


    位是最小的信息单位，恰好有两种可能的状态：


    ![](img/image00886.jpeg) 位设置：

    ```

    ≡ (0)

    ≡ (1)

    ```

    ![](img/image00887.jpeg)  真


    ![](img/image00888.jpeg)!(Images/image00889.jpeg) 一个字节由 8 位组成，因此一个 `short int`
    数字的长度为 16 位。位操作中的运算符通常出现在整数表达式中。


    ### 3.5.1 一元位运算符


    ![](img/image00890.jpeg)

    | 运算符 | 说明 | 示例 |

    | :--- | :--- | :--- |

    | `~` | 二进制补码，操作数的按位取反 | `~k` |


    ### 3.5.2 二元位运算符


    ![](img/image00891.jpeg)

    | 运算符 | 说明 | 示例 |

    | :--- | :--- | :--- |

    | `&` | 按位与操作数 | `k & l` |

    | `\|` | 按位或 | `k \| l` |

    | `^` | 按位异或 | `k ^ l` |

    | `<<` | 将 `<op1>` 向左移 `<op2>` 位 | `op1 << op2` |

    | `>>` | 将 `<op1>` 向右移 `<op2>` 位 | `op1 >> op2` |


    ```

    k << 2 // = k*4

    k >> 2 // = k/4

    ```


    | 真值表: x | y | x & y | x \| y | x ^ y |

    | :--- | :--- | :--- | :--- | :--- |

    | 0 | 0 | 0 | 0 | 0 |

    | 0 | L | 0 | L | L |

    | L | 0 | 0 | L | L |

    | L | L | L | L | 0 |


    ![](img/image00892.jpeg) 这些运算符在以下示例中演示：


    ```

    l = 5; // 0..000101 = 5

    k = 6; // 0..000110 = 6

    ```

