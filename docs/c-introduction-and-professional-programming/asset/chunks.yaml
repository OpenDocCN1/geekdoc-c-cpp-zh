    # Chapter 2: Simple data types


    ## 2.1 variable


    ### 2.1.1 variable definition


    Every meaningful program processes data in some form. This data is saved in variables.


    i) A variable is a symbolic representation (identifier/name) of storage space
    of data.

    ii) It is described by type and storage class.

    iii) The contents of the variables, ie the data in the memory space, change during
    program execution.


    General form of variable declaration:


    ```

    [< storage class >] <type> <identifier1> [, identifier2] ;

    ```


    | Type | Memory (bytes (g++) | Content |

    | :--- | :--- | :--- |

    | ![](Images/image00849.jpeg) | | |

    | ![](Images/image00850.jpeg) | | |

    | char | 1 | Character sign ''H'', ''e'', ''n'' |

    | boolean | 1 | boolean variable false, true [C++ only] |

    | ![](Images/image00851.jpeg)!(Images/image00852.jpeg) | 4 | -32768 to 32767 |

    | short [int] | 2 | whole Numbers -32768 to 32767 |

    | long [int] | 4 | -32768 to 32767 |

    | float | 4 | Floating point numbers 1.1, -1.56e-32 |

    | double | 8 | 1.1, -1.56e-32, 5.68e+287 |

    | ![](Images/image00851.jpeg)!(Images/image00854.jpeg) | unsigned [int] | 4 |
    common numbers 0 to 32767 |

    | ![](Images/image00855.jpeg) | long long [int] | 8 | whole Numbers -231 to 231
    |

    | long double | 12 | Floating point numbers 5.68e+287, 5.68e+420 |


    Remarks:

    - Character data stores exactly one ASCII or special character.

    - ![](Images/image00856.jpeg)!(Images/image00857.jpeg)The memory requirement of
    types of the integer group (`int`) can depend on the compiler and the operating
    system (16/32 bit). It is therefore advisable to read the relevant compiler instructions
    or to determine the actual number of bytes required with the `sizeof` operator
    using `sizeof( <type> )` or `sizeof( <variable> )`. See also the following example:


    ![](Images/image00858.jpeg)


    ![](Images/image00859.jpeg)We are usually the base type `int` for the appropriate
    subrange of integers and `unsigned int` for the common numbers. The marking `unsigned`
    can also be used with other integer types.


    ### 2.1.2 Designation of variables


    ![](Images/image00860.jpeg)!(Images/image00861.jpeg)!(Images/image00862.jpeg)Variable
    names start with letters or underscores, the following characters can also be
    numbers. The use of spaces and operator characters `()` in names is not permitted,
    nor are variable names allowed to be keywords of the C++ syntax (see Ref.).


    ![](Images/image00840.jpeg)!(Images/image00863.jpeg)!(Images/image00840.jpeg)!(Images/image00864.jpeg)C/C++
    is case sensitive, ie, `totalHosen` and `toteHosen` are different identifiers!


    ![](Images/image00865.jpeg)According to the original C standard, the first 8 characters
    of a variable identifier are significant, ie `a2345678A` and `a2345678B` would
    no longer be perceived as different identifiers. Compilers now see more characters
    as significant (C99 standard: 63 characters).


    ## 2.2 constants


    Most programs, including `HelloWorld.cc`, use unchangeable values, so-called constants,
    during the course of the program.


    ### 2.2.1 integer constants


    Decimal constants (base10):

    - `100 // int; 100`

    - `512L // long; 512`

    - `128053 // long; 128053`


    octal constants (Base 8):

    - `020 // int; 16`

    - `01000L // long; 512`

    - `0177 // int; 127`


    Hexadecimal constants (base16):

    - `0x15 // int; 21`

    - `0x200 // int; 512`

    - `0xffff // long; 131071`


    ### 2.2.2 floating point constants


    Floating point constants are always interpreted as `double`. Some examples following:


    | Constant | Value |

    | :--- | :--- |

    | `1E+10` | 1000000000 |

    | `1.` | 1 |

    | `.78` | 0.78 |

    | `0.78` | 0.78 |

    | `-2e-3` | -0.002 |

    | `-3.25` | -3.25 |


    ### 2.2.3 character constants (character constants)


    The character constant contains the character between the two:

    - `''a''`, `''A''`, `''1''` // ASCII character

    - `'' ''` // spaces

    - `''_''` // underscore

    - `''\\` // backslash character

    - `''\n''` // new line

    - `''\0''` // Null character


    ### 2.2.4 string constants (string constants)


    The string includes the characters between the two:

    - `"Hello World\n"`

    - `""` // empty string

    - `"A"` // String "A"


    ![](Images/image00866.jpeg)!(Images/image00867.jpeg)Each character string is automatically
    terminated with the (character) `''\0''`. `"A"` consists of the characters `''A''`
    and `''\0''` and thus 2 bytes for storage.


    ### 2.2.5 Symbolic Constants (Macros)


    If one of the constants used in the previous sections is required more than once,
    a symbolic name is assigned to this constant, eg:


    ```

    #define NL ''\n''

    #define N 5

    #define HELLO "Hello World\n"

    ```

    or in general

    ```

    #define <identifier> <constant>

    ```

    Remarks:

    ![](Images/image00869.jpeg)The preprocessor replaces every occurrence of `<identifier>`
    in the rest of the source code with `<constant>`, ie:

    ```

    cout << HELLO;

    cout << "Hello World\n";

    ```

    usually no lower-case letters are used in these identifiers because, for example,
    `MAX` is then immediately recognizable as a symbolic constant.


    ### 2.2.6 Constant with variable names


    ![](Images/image00871.jpeg)variable declaration with the ending `const` is marked,
    this variable can only be initialized in the declaration part and never again,
    ie it acts as a constant.


    difference:

    `#define N 5` uses no disk space since `N` in all source code is replaced by `5`.

    `const int N = 5;` Variable `N` is saved, the program works with it here.


    # Chapter 3: Expressions, Operators and mathematical functions


    - Expressions consist of operands and operators.

    - Variables, constants or expressions again.

    - Operators perform actions with operands.


    ## 3.1 assignment operator


    The assignment operator `<operand_A> = <operand_B>` assigns the value of the right
    operand to the left operand, which must be a variable.


    For example, in the result of the statement sequence:

    ![](Images/image00873.jpeg)

    the value of `x` is 0 and the value of `y` is 4. where `x, y, 0, x+4` operands,
    where the latter is also an expression consisting of the operands `x`, 4` and
    the operator `+`. Both `x = 0` and `y = x + 4` are expressions. First the trailing
    semicolon `;` converts these expressions into statements to be executed!


    ![](Images/image00874.jpeg)Also multiple assignments occur. The following three
    assignments are equivalent:

    ![](Images/image00875.jpeg)


    ## 3.2 arithmetic operators


    ### 3.2.1 Unary operators


    Unary operators kick only one operand.


    ![](Images/image00876.jpeg)

    | operator | Description | Example |

    | :--- | :--- | :--- |

    | - | negation | -a |


    ### 3.2.2 Binary operators


    At a binary operator two operands occur. The result type of the operation depends
    on the operators away.


    | operator | description | example |

    | :--- | :--- | :--- |

    | `+` | addition | `b + a` |

    | `-` | subtraction | `b - a` |

    | `*` | multiplication | `b * a` |

    | `/` | Division (! with integer values !) | `b/a` |

    | `%` | remainder in integer division | `b % a` |


    ![](Images/image00877.jpeg)!(Images/image00878.jpeg)Dividing integers calculates
    the integer part of the division, ie `8 / 3` returns `2` as the result. However,
    if the result is `2.666666`, at least one of the operators must be converted to
    a floating-point number, as can be seen in the example.


