    ## 3.4.1. 产量削减与停井


    Foss 等人 (2018) 提出了每日产量优化（DPO）概念，生产工程师的目标是尽可能有效地优化系统。他们讨论了如何通过调整节流阀的控制输入来使用仿真，并探讨了使用静态模型与动态模型的局限性，以解决这些问题。


    许多重要问题可以通过使用稳态模型来解决，而另一些问题（特别是与页岩气相关的问题）具有不同的特征。该领域的研究认为，每日产量优化问题非常适合数学规划。


    Foss 等人 (2018) 提出了一种基于代理储层模型的用于储层管理的广义直接优化规划（GDOP）框架。在每一步中都会重复求解移动边界优化策略。另一方面，当储层产量可以忽略时，则对每个时间步提出了一个静态模型。使用分段线性近似将混合非线性规划（MINLP）转换为混合整数线性规划（MILP）。从仿真分析来看，静态优化框架在大多数开发案例中都是足够的，特别是对于海上水井的生产。重要的例外是气井和薄油带。Hulse
    等人 (2020) 建议，当优化规模快于底层储层动力学时，静态模型是适用的。通过一个带有用于油井生产和气注作业阀的油井平台插图说明了静态模型的局限性。静态实践可以根据需求的变化得到有效解决。然而，当地表条件频繁或突然变化时（可能是由于处理能力降低），人们认为不应忽视井的动力学，并应相应地解决这些问题。当条件正常时，这些优化模型寻求寻找具有不同压缩能力的井的最佳进度。显然，当使用更准确的仿真模型和参数实施该方法时，可以获得更好的结果。尽管如此，考虑到此类领域大量的决策，即使对于小实例（井数和时间步较少），在多大程度上将这些细节（增加更多复杂性）纳入决策工具仍然是一个未解决的问题。


