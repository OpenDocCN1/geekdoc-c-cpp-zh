    The optimization technique, on the other hand, is constrained by recovery of hydrocarbons
    from reservoirs. The manipulation or coordination of production parameters (e.g.,
    well pressure or artificial lift) can greatly improve economics and energy. In
    turn, researchers have studied how and what production control strategies can
    successfully respond to demand changes (e.g., natural gas flow).


    Work on supplies, gathering and processing optimization has been equally prominent
    over the years. It should be noted that this field is related to development through
