    # 页岩油气开发的数学规划模型：综述与展望


    Markus G. Grouven^a, Diego C. Cafaro^b, Ignacio E. Grossmann^c

    a 美国国家能源技术实验室, Pittsburgh, PA 15234, USA

    阿根廷国立自由大学, Santa Fe, Argentina

    c 卡内基梅梅隆大学, Pittsburgh, PA 15213, USA


    在本文中，我们对页岩油气开发的数学规划模型进行了全面的综述，并对卓越的研究机会提出了展望。我们将其分为五个主要主题领域：(1) 开发规划，(2) 水资源管理，(3)
    生产优化，(4) 集集与处理，以及(5) 生命周期分析与可持续性。我们重点介绍了过程系统工程领域主要如何应用不同类型的数学规划模型（即线性、整数、非线性随机随机）来解决决策问题，并强调了在工业中成功部署的实例。最后，基于对现有工作的批判性评估，我们确定了跨主要主题的未来研究机会。


    # 摘要


    # 1. 引言


    非常规油气行业决策过程优化工具的发展主要受“页岩革命”的驱动。相比之下，天然气仍然是向更清洁的市场能源转型的关键资源。根据国际能源署（IEA, 2019）的数据，美国从煤改气减少的二氧化碳排放量，等同于在同期内增加了2亿万辆运行在零碳电力上的电动汽车。同时，值得注意的是，这种转变并未为气候变化提供长期解决方案，而且值得注意的是，全球天然气需求一直在增长，从2017年的16%增长到2019年的23%（IEA,
    2019）。


    对辅助页岩油气可持续发展的计算工具的需求仍在增加。在发展中中国家，对新基础设施的战略性投资可以确保基本能源变得更加便宜，特别是那些无法有效被低碳替代品取代的能源，例如冬季峰值需求或脱气气体（如再生甲烷或氢气）的运输，同时在能源安全方面提供效益（IEA,
    2019）。此类基础设施还可能加速捕集、利用和存储技术的部署，这需要决策支持工具进行优化和运行。


    但即使在“已开发”的页岩地区，其工业的复杂性也在不断增加：不断变化的生产单元、加工设施、集集管道和处理资源需要同时进行管理——同时还要不断提高环境管理和盈利能力。做出“决策”活动已不仅是日常，现实要求在实践中采用数学优化工具。


    本文关注用于解决页岩油气开发中已知挑战的决策支持工具的开发和使用。数学规划是优化技术之一（不应与计算机编程混淆）。它是指使用数值方法或算法严谨地（即启发式地）求解模型的实际应用。所有数学规划模型都涉及一个需要最小化或最大化的目标函数，以及变量（决策变量通常是自由）或模型参数（考虑相关问题数据）。根据决策变量的类型，存在许多类数学规划。


