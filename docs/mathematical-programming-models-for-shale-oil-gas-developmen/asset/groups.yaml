    - Water Management

    - coordination of water deliveries, reduction of freshwater consumption

    - Supplies, Gathering, Processing

    - supply chain pipeline, treatment network design, facilities placement

    - LCA & Sustainability

    - assessment and quantification of emissions, "cradle-to-grave" analysis


