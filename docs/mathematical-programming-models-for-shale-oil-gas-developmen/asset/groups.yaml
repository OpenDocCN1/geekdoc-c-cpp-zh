    等， 2020）。在规划开发过程中，考虑钻井和压裂需要不同类型的资源这一事实可能是有益的或必要的。此外，井的垂直剖面段通常使用垂直钻头钻井，而水平段则使用水平钻头钻井。井的水力压裂由由配备高压泵的卡车队执行。拆卸这些钻机和所需设备并非易事，特别是在偏远地区（Vale
    等，2018；Wang 等，2019），他们提出了考虑了资源富裕度和动员成本的数学框架。


