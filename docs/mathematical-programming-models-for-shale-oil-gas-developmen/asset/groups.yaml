    # 3. 页岩开发的数学规划模型


    ### 3.1. 页岩开发优化的早期历史


    20世纪70年代初，开创性的贡献提出了开采页岩矿的优化策略（Crookston, 1975）。首次评估了热解作为一种石油提取的分析技术（Wen & Yen,
    1977; Gufel, 1979）。20世纪80年代，提高油水混合物回收率的优化技术出现（Bose, 1980; Svart, 1982）。井产量的优化由Reeves等人（1993）解决，而早期对页岩开发的贡献实际上关注的是用水。随后在2000年代提出了后期模型（Muskim,
    2008; Gausfeld et al., 2008）。当时，这些贡献仅占出版物总数的10%；我们现在发现，2014年这一频率增加到了25%，专注于页岩气产量的经济和环境影响（Stephens,
    2010; Jiang, 2011; Guanarni et al., 2013）。


    Cafano & Grassmann（2014）建立了页岩气战略规划、设计和开发的优化模型。随后，该领域的贡献显著增加。2017年，Gao & Yu（2017）发表了关于页岩能源系统设计和优化的综述。这项工作限于页岩气。最近的研究涉及2017年以来全球范围内所有的油气开发文献。其他重要事件（如COVID-19疫情、俄罗斯入侵乌克兰）引发了学术界和普通公众对碳氢回收及其影响的讨论。


    ### 3.2. 主要领域


    作为本回顾的一部分，我们将油气优化领域分为五个主要主题，如图6所示：(1）开发规划、（2）产量优化、（3）供应、（4）水资源管理以及（5）生命周期分析（LCA）与可持续性。开发规划活动涉及钻探、压裂和生产。在该阶段的研究人员提出了数学模型，帮助决策者如何协调活动以提高经济或环境性能。注意的是，油气开发需要不同的方法。对于传统石油开发方法，我们参考了Tavalli等人（2014）、Tavalli（2016）和Eggios（2019）。


