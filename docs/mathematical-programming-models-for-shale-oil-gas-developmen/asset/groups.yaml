    # Background on oil and gas development and its impact


    Fig. 1 shows the basic steps involved in the development of a shale oil or gas
    well. The process usually begins with the construction of a well or "pad", as
    shown in Fig. 2. This pad will house temporary equipment necessary for drilling
    and producing hydrocarbons from one or many wells. Up to 60 wells may originate
    from the surface of one well pad. Well development begins by drilling the vertical
    section of the well, which before the well reaches the target depth, the top-set
    is cemented, and a "horizontal" drilling is initiated. This well may extend several
    hundred meters during and after the production process (casing with layers of
    steel and cement) to ensure the integrity of the well and prevent an uncontrollable
    collapse of the well. Ideally, fracturing is performed, which enhances the production
    of hydrocarbons from the shale reservoir to the well itself. Finally, large volumes
    of water (fresh, special sand) and chemicals are injected into the reservoir at
    high pressure to create hydraulic fractures into the shale rock,


    ![](img/b1a54ba24a183aff0397d529dfa0b154_2_0.png)


    water must be produced at the off-site which could create logistical and cost
    challenges in the production process. Li et al., 2021, as well as others use simulations
    (Sanchez-River et al., 2015, Feng et al., 2020). Evolutionary or genetic algorithms,
    such as Swarm Optimization, have been particularly prominent in this field (Jemsik
    2001, Hariri et al., 2018, Zhang & Sheng, 2020). These algorithms are generally
    made to work without assumptions about the mathematical nature of the problem
    being solved, and they can provide feasible solutions to large problems, although
    often with high computational expense. However, because they are stochastic, it
    is repeated and that the same problem can be solved with different solutions (especially
    when time is used as a termination criterion). Also, meta-heuristics do not provide
    a method of objective function evaluation that can assess the quality of a given
    solution.


    Undoubtedly, programming and optimization techniques have contributed to the improvement
    of shale oil and gas development. However, we observe that field affiliation rather
    than characteristics has greatly limited the development of optimization techniques
    which have been applied to these problems. Research and practice in the industry
    (Sengupta 2020) have focused on developing mathematical techniques for reservoir
    planning, contributions from the Petroleum Engineering and Geosciences fields
    although include non mathematical optimization techniques.


    This paper begins with a general introduction on shale oil and gas development,
    and the impact it has on the landscape in the United States, on the production
    of petrochemicals, as well as on various subproblems. Next, the paper presents
    an overview of mathematical techniques for addressing major problems, namely development
    planning, production optimization, supporting decisions, and life cycle analysis
    (LCA) & sustainability. Our objective is also to identify trends in linear vs.
    nonlinear models, general purpose versus specialized solutions, and the extent
    to which they account for uncertainty. The paper concludes with a critical assessment
    of these techniques and the identification of opportunities for further research.


