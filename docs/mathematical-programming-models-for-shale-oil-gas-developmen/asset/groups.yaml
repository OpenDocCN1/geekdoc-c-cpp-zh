    | | Number, size, and location of modular gas production units (skids). | MILP
    | Deterministic equivalent of multi-stochastic programming model. | Yes (homogeneous
    production forecast) |

    | Hong, Li, Zhang & Gong (2020) | Gas | Upstream | Max NPV | | Production start
    times. Allocation (purchase and mobilization) of gathering facilities. | MILP
    | Commercial solver. | No |

    | Droussen & Graham (2017a) | Gas | Upstream | | | To handle leaks. Pressures
    at the nodes of the pipeline network, flow capacities and compression | MILP |
    NLP for initialization. Bounding MILP for solution finding. Global NLP from incumbent.
    | No |

    | Hong, Di, Shi, Chen & Long (2020) | Gas | Upstream | Max NPV | | | Pipeline
    locations, diameters. Flows and pressures over time. | MILP | Piecewise linear
    approximation with discrete ranges for diameters. | No |

    | Zhang, Li & Liang (2022) | Gas | Upstream | Min Purchase + Costs | | | MILP
    | Commercial solver. | No |

    | Montana, Cagiao, Barth, Wu & Furman (2021) | Oil | Upstream | Min NPV | | Number
    and size of location of tanks and processing facilities. Pipeline connections
    and compression | MILP | NLP decomposition and refinement strategies for solutions.
    MILP relaxations for bounding | |

    | Tan & Barrios (2017) | Gas | Upstream & Downstream | Max NPV | | Location and
    capacity of plants (refineries, gas and LNG plants) Transportation modeling |
    Deterministic equivalent of two-stage stochastic programming model. | Yes (egOD,
    gas-price linked) |

    | Montana & Cagiao (2019) | Oil | Upstream | Min NPV | | Size and location of
    facility and service provision to all wells. | MILP | Clustering of wells. | No
    |

    | Wu et al. (2022) | Gas | Upstream | Min Total Annual Costs | | Exploration and
    production facilities. | LP/NLP -> Metaheuristic | Linear Programming (network
    flow) | Yes (Monte Carlo simulation) |


    In terms of optimization models for development planning summarized in Table 2,
    it is clear that most of the work has aimed at gas and very little oil. It is
    interesting to point out that 4 of the 12 models use uncertainty constraint. Most
    of the proposed models use MILP, heuristic or tailored decomposition techniques.
    With respect to production optimization models summarized in Table 3, they are
    NLP, MILP, and MINLP, with 7 out of 8 models considering uncertainty.


    Future work needs to address the challenges in oil and gas optimization, especially
    integration of renewable energy sources. To address the impact on the environment,
    long term expansion planning models (e.g., Lara et al., 2018) and Li et al. (2022)
    should be included to help gas models to assess the benefits of fuel energy and
    supply flexibility and the penetration of renewables such as gas and wind. It
    is important to quantitatively evaluate the impact of decreased CO2 emissions
    by replacing coal with natural gas for power generation.


    In terms of water management models summarized in Table 4, there is nearly equal
    split between MILP and MINLP models, and only one model considers uncertainty.
    For scheduling and processing optimization problems, most models use MILP or MINLP
    solvers.


    For gathering and processing optimization models summarized in Table 5, there
    are far more MILP models than MINLP, with 4 out of 10 considering uncertainty.
    In life cycle analysis of gas systems, studies focus on the development of recycling
    and treatment of water, as well as strategies for reducing methane emissions.


    Furthermore, there are interesting possibilities for carbon sequestration in oil
    and gas fields, as well as opportunities for carbon capture and storage technologies.


    Finally, we conclude that mathematical programming techniques have played a major
    role in the optimization of shale and gas development systems. It is clear that
    they have shown their value as instance demonstrated by water scheduling tool
    that EQT Corporation with a project expected to save the $25–35M per year (Ecot
    et al., 2019).


