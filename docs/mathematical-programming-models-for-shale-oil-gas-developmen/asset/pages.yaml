    # 3. Mathematical programming models for shale development


    # 3.1. Early history of shale development optimization


    Seminal contributions presenting optimized strategies to exploit shale deposits
    early in the 1970s (Crookston, 1975). The first assessed pyrolysis as an analytical
    technique for oil extraction (Wen & Yen, 1977; Gufel, 1979). In the 1980s, the
    first optimization techniques to enhance the recovery of oil and water mixtures,
    came to light (Bose, 1980; Svartve, 1982). Production optimization in wells was
    also addressed by Reeves et al. (1993), while the early contributions to the development
    of shale well actually focused on water usage. Later models were proposed in the
    2000s (Muskimmin, 2008; Gausfeld et al., 2008). By that time, the contributions
    were merely 10% of the total number of publications that we find nowadays, and
    most of them deal with shale oil production. The frequency increases to 25% by
    2014, now deeper analysis on the economic and environmental impact of shale gas
    production (Stephens, 2010; Jiang, 2011; Guanarni et al., 2013).


    Cafano & Grassmann (2014) developed the first optimization model on the strategic
    planning, design, and development of the shale gas chain. Then, the number of
    contributions to the field has increased significantly. In 2017, Gao & Yu (2017)
    published a first review concerning the design and optimization of shale energy
    systems. This work was limited to research on shale gas only. Recent works relate
    to the literature of all publications on oil and gas development since 2017. Also
    important events (e.g., the COVID-19 pandemic, the Russian invasion of Ukraine)
    have sparked debate among the academic community and the general public, on the
    implications and impacts of hydrocarbon recovery from resources across the world.


    # 3.2. Major areas


    As part of this review, we distinguish between five major topics in the field
    of oil and gas optimization, as shown in Fig. 6: (1) development planning, (2)
    production optimization, (3) supplies, gathering & processing, (4) water management,
    and (5) life cycle analysis (LCA) & sustainability. Development planning activities
    associated with shale development involve drilling, fracturing and production
    operations. Researchers active in this phase put forward mathematical programming
    models to help decision-makers understand how to coordinate development activities
    to improve economic or environmental performance. It is important to note that
    oil and gas development require considerably different approaches and resources.
    For information on conventional oil development approaches, and opportunities
    to leverage Process Systems Engineering and optimization methods, we refer to
    the work of Tavalli et al. (2014), Tavallisi (2016) and Epelle & Gerogios (2019).


    ![](img/b1a54ba24a183aff0397d529dfa0b154_4_1.png)


