    NLP, MILP, and MINLP, with 7 out of 8 models considering uncertainty.


    Future work needs to address the challenges in oil and gas optimization, especially
    integration of renewable energy sources. To address the impact on the environment,
    long term expansion planning models (e.g., Lara et al., 2018) and Li et al. (2022)
    should be included to help gas models to assess the benefits of fuel energy and
    supply flexibility and the penetration of renewables such as gas and wind. It
    is important to quantitatively evaluate the impact of decreased CO2 emissions
    by replacing coal with natural gas for power generation.


