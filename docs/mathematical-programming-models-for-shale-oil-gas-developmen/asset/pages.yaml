    # 3.4.3. Refactoring


    Refactoring presents a strategy for addressing the accelerating decline rates
    of shale wells. The core idea behind refactoring is to stimulate the reservoir
    such that it yields untapped hydraulics and improves the overall production profile
    of a well. The seminal work on planning optimal fracturing treatments of shale
    wells was proposed by Driver et al. (2016). The authors present a decision-making
    framework based on a novel forecast that predicts pre- and post-treatment productivity,
    and a discrete-time, multistage MILP model that accounts for the possibility of
    multiple fracturing treatments over the lifetime of the well. They consider multiple
    accounts for the lifespan of the well (Cafaro et al., 2018), also considering
    the net present value (NPV) of the production over continuous time horizon.


    # Refactoring strategies


    In this paper, we propose a refactoring model based on the disjunctive program
    (Big-M, Stage and Convex-Hull). The proposed framework is limited to a single
    well and can be applied to either existing or new wells. The number of fracturing
    treatments and their timing are highly sensitive to the uncertain gas price forecast.
    In two years later, the authors extend their method further to address the challenge
    of handling the uncertainty associated with the well refactoring (Driver et al.,
    2017). A two-stage stochastic programming model in a moving horizon strategy is
    developed to solve the planning problem. The model predicts gas production over
    time depending on how often a well has been refactored, and when it was estimated
    last.


