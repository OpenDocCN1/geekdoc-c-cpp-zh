    # Mathematical Programming Models for Shale Oil & Gas Development: A Review and
    Perspective


    Markus G. Grouven^a, Diego C. Cafaro^b, Ignacio E. Grossmann^c

    a National Energy Technology Laboratory, Pittsburgh, PA 15234, USA

    Universidad Nacional del Liberal, Santa Fe, Argentina

    cnegie Mellon University, Pittsburgh, PA 15213, USA


    In this paper, we provide a comprehensive review of mathematical programming models
    for shale oil & gas development, and we offer a perspective on outstanding research
    opportunities. We distinguish between five major topic areas: (1) development
    planning, (2) water management, (3) production optimization, (4) gathering & processing,
    and (5) life cycle analysis & sustainability. We highlight how types of mathematical
    programming models (i.e., linear, integer, nonlinear, and stochastic) have been
    applied primarily by the Process Systems Engineering community to address the
    decision-making problems, and highlight instances of successful deployment in
    industry. Finally, based on a critical assessment of the body of work, we identify
    opportunities for future research across the major topics.


    # ABSTRACT


    # 1. Introduction


    The development of optimization tools for decision-making processes in the unconventional
    oil & gas industry has primarily been driven by the ''shale revolution''. By contrast
    natural gas remains a key resource in the energy transition to a cleaner market.
    According to the International Energy Agency (IEA, 2019) coal-to-gas switching,
    which in the U.S. reduced CO2 emissions by equivalent to adding 200 million electric
    vehicles running on zero-carbon electricity over the same period. At the same
    time, it is important to note that this switching, which does not provide a long-term
    solution to climate change, and it is worth noting that global gas demand has
    been growing, from 16% in 2017 to 23% in 2019 (IEA, 2019).


    The need for computational tools to aid the sustainable development of shale oil
    and gas remains rising. In the developing world, strategic investments in new
    infrastructure could ensure that essential energies become more affordable, particularly
    those that cannot be effectively replaced by low-carbon alternatives, such as
    winter peak or the transportation of degassed gases (e.g., renewable methane or
    hydrogen) while simultaneously offering benefits in terms of energy security (IEA,
    2019). Such infrastructures may unmet


    also accelerate the deploy capture, utilization and storage technology, of which
    will require decision-support tools to be optimally and operated.


    But even in ''established'' shale areas, there is a growing industry with increasing
    complexity: ever-production production units, processing facilities, gathering
    pipelines, and treatment resources needing to be managed simultaneously – all
    while continuing to improve environmental stewardship and profitability. Making
    ''decision'' activities has become more than daily, and reality requires the adoption
    of mathematical optimization tools in practice.


    This paper focuses on the development and use of decision-support tools to address
    the known challenges in shale oil and gas development. Mathematical programming
    (Mousifakis & Yayge, 1996) is one of many optimization techniques (not to be confused
    with computer programming). The practical application of models which are solved
    rigorously (i.e., heuristically) using numerical methods or algorithms. All mathematical
    programming models involve an objective function to be minimized or maximized,
    and variables (decision variables generally free) or model parameters (considering
    relevant problem data). Many classes of mathematical programs exist depending
