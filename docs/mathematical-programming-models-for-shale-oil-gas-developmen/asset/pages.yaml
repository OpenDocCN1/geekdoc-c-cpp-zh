    # 3.3. Development planning


    At core, development planning options are meant to help organizations operate
    efficiently and economically attractive drilling, fracking and production schedules.
    Such "revolution" has been considered relatively straightforward. Planning involves
    drilling wells one by one, then completing as many wells as they could. However,
    researchers and the industry realized that this approach was suboptimal since
    it could only take months before production starts. They soon proved that drilling
    and fracking were powerful of different tools, depending on the overlap for leveraging
    mechanism and support. Supporting the development and planning problems is inherently
    discrete in nature since it is possible to drill or complete wells if decisions
    are made in time with activities, coordination and conflict of objectives.


    As illustrated in Table 1, the development planning options can range from multi-well
