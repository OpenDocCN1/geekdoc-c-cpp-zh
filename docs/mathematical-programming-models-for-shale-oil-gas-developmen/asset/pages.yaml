    # 3.4.1. Production curtailments and shut-ins


    Foss et al. (2018) propose the concept of daily production optimization (DPO)
    periods in which production engineers aim to optimize the system as effectively
    as possible. They present a discussion on the use of simulations, by adjusting
    control inputs to choke valves, and the limitations of the use of static models
    vs. dynamic models, to address these problems.


    Many important problems can be solved through the use of steady-state models while
    others, in particular related to shale gas, have different characteristics. The
    work in this field holds that daily production optimization problems are well
    suited for mathematical programming.


    Foss et al. (2018) propose a Generalized Direct Optimization Programming (GDOP)
    framework for reservoir management based on proxy reservoir models. A receding
    horizon optimization strategy is repeatedly solved at each step. On the other
    hand, when reservoir production can be neglected, a static model is proposed for
    each time step. Piecewise linear approximations are used to convert the MINLP
    into a MILP. From simulation analysis, it is argued that a static optimization
    framework suffices in most development


    cases, in particular for production of offshore water wells. Important exceptions
    are gas wells and thin oil rims. Hulse et al. (2020) suggest that static models
    are applicable when the optimization-scale is faster than the underlying reservoir
    dynamics. The limitations of static models are illustrated by an illustration
    of oil pad platforms with valves for the production of wells and gas-lift operations.
    Static practices are effectively solved in response to changes in demand. However,
    when surface conditions change frequently or suddenly - potentially due to reduced
    processing capacity - it is argued that the dynamics of wells should not be neglected
    and efforts should be solved accordingly. When the conditions are normal, these
    optimization models seek to find the best schedule of a well with varying compression
    capacity. It is clear that better results can be achieved when the method is implemented
    with more accurate simulation models and parameters. Nevertheless, given the large
    number of decisions in this kind of field, even for small instances (with few
    wells and time steps), it is still an open question to what extent it is worth
    to include these details (adding more complexity) into the decision-making tool.


