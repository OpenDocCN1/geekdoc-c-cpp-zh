    pads (Gao et al., 2018; Wang et al., 2021; Za-Gomez et al., 2022), best to plan
    multi-field systems across geographically distributed areas (Ondeck et al., 2019b).
    Nearly all publications in recent years are geared at planning scenarios spanning
    multiple years. Discrete-time formulations are predominant with planning horizons
