  md: "# Chapter 7 Using External Data\n\nIf you are parsing a JSON file, there are\
    \ two data structures to be concerned with: the demarcated by the objects that\
    \ are demarcated by curly braces, and the arrays that are demarcated by square\
    \ brackets. If you have any programming experience at all, you know that array\
    \ elements are specified by their index values. The same is true with JSON structures.\
    \ Any given array structure in the main structure can be specified by its value\
    \ and an object method, which requests an index value as its argument. Likewise,\
    \ JSON objects are separated by curly braces and are specified by their name values.\
    \ Unlike arrays, though, their elements are specified by names. Both can be nested\
    \ several levels deep, which is the challenge lies. The applications programmer\
    \ needs to \"map\" the input to determine which level the desired data appears\
    \ and drill down to. There seems to be no easy way to parse a JSON object before\
    \ the application is written. I find that the best way is to count through the\
    \ layers of curly brace pairs and square bracket pairs until you get to the data\
    \ items you want and build the code accordingly. You can find more information\
    \ on the JSON format at www.json.org. The process is similar when you are working\
    \ with XML, although the code parsing is a little different.\n\nThe application\
    \ is bare bone and only needs two lines for user entry: one for the street address\
    \ of the target location and the other for the city and state, separated by commas.\
    \ Google does not require a zip code to resolve an address and return the data\
    \ listed earlier. In fact, the zip code is returned with the plethora of data\
    \ that Google supplies. A single button sets the balance of the application in\
    \ motion. The XML file for this application follows:\n\n```\n<LinearLayout xmlns:android=\"\
