  md: '# CHAPTER 8


    # THE CAMERA AS A DATA SOURCE


    # BAR CODES AND QR CODES


    An Android handheld or tablet''s mobility and its camera feature make it a great
    device for scanning and interpreting bar codes and QR codes. The bar code is certainly
    nothing new; it was patented in the 1950s and was used in grocery stores as early
    as the 1970s. Almost every grocery and retail store currently uses bar codes.
    The quick response (QR) code was invented in the 1990s in Japan and was used by
    Toyota to track vehicles during their manufacture. Today, handheld devices are
    used in the field to track inventory in warehouses, tracks on their way to delivery,
    check off pick-lists as orders are prepared to be shipped, and so on. However,
    until recently, devices for these purposes were proprietary, custom built (often
    platforms based on PalmOS or similar), narrowly proposed, and expensive. But now
    just about any handheld device with a camera, networking capabilities, and a built-in
    database management system can be adapted for the purpose. Android devices are
    no exception.


    In fact, programming an application for scanning, interpreting, storing, and displaying
    results for an Android device is one of the easier tasks for the applications
    programmer. This is because of the resources available from Google under the name
    ZXing, or Zebra Crossing. For trivia sake, a zebra crossing, shown in Figure 8.1,
    is actually a pedestrian path across an intersection that is marked by alternating
    white lines on the road surface. It''s similar in appearance to the alternating
    black-and-white stripes on a zebra. One might observe that the black-and-white
    alternating stripes on a barcode are similar to the stripes on a zebra.'
