  md: '# Chapter 5 Content Providers


    instance of the Uri. TheProviderOperation has a nested class called ContentProviderOperation.Builder
    provides other methods essential to interaction with the contacts system. The
    methods of the ContentProviderOperation class listed earlier, along with several
    of the methods of the ContentProviderOperation.Builder, return an instance of
    the ContentProviderOperation.Builder. This allows method calls to be "chained"
    together to perform one operation. An assortment of these methods is assembled
    to provide instructions for a particular CRUD operation and the tables, data types,
    and values that are needed to carry out it. Multiple operations can be combined
    in an ArrayList of ContentProvider instances to be carried out one, such as to
    add an email address and a phone number.


    The second essential class is the ContentResolver. An instance of the ContentResolver
    is returned by a call to the application''s Context method, getContentResolver(),
    and carries out the batch of instructions provided in the ArrayList of ContentProviderOperations.
    The content resolver can return an instance of the Cursor that would contain the
    results of a query into the content system.


