    # FRAGMENTS


    Fragments allow you to take the large tablet surface and divide it into several
    more easily handled sections. You can reuse the sections from screen to screen
    (activity to activity) and preserve and recall while maintaining state. Fragments
    have their own life cycle, similar to the activity that hosts them, the hosting
    activity affects them. For example, when an activity is paused, its fragments
    are paused; when the activity is destroyed, its fragments are destroyed. See the
    fragment life cycle diagram in Figure 2.17.


    Anatomically, fragments consist of a class that extends the Fragment class or
    a subclass of the Fragment class, and their layout is drawn from an XML file similar
    to that of the hosting activity. Fragment "space" can be built into the hosting
    activity''s XML file just controls as buttons and text fields, or they can be
    added dynamically, similar to the way a developer might add a control dynamically.
    In fact, a fragment can exist without a user interface and just manage some background
    activity.'
  merge: -1
  pgno: 49
- img_proc: true
  md: '![](img/cbb97d4daaabf800d0384cb0ef181aa8_50_0.png)


    # ### Figure 2.16

    emulator showing application with revised Action Bar.

    Android 3.2 emulator showing application with revised Action Bar.

    Source: The Eclipse Foundation.


    An application can manage its fragments to suit the device it is running on. For
    example, two fragments might be displayed side by side on a tablet in a given
    application, but the same application running on a handset might display one at
    a time, one triggering the display of the other.


    Like activities, several methods are associated with the stages in the life cycle
    of a fragment, but not all have to be used. The essential methods for the fragment
    are `onCreate()`, `onCreateView()`, and `onPause()`.


    The first method, `onCreate()`, is called when the fragment is created. In your
    application, you would initialize essential components that you intend to maintain
    as the fragment is paused or resumed. The second, `onCreateView()`, is called
    when the fragment is to be drawn on the screen. Here, the fragments use the corresponding
    XML file to dictate the layout, and method returns a View object to represent
    the fragment to the activity. If the fragment has no user interface, a `null`
    can be returned. The `onPause()` method is called as the user leaves the fragment.
    The developer should write code to save any data that is essential to the application,
    such as posting to a data table, saving files, or closing streams, because there
    is no guarantee that the user will return to the fragment during the life of the
    activity.'
