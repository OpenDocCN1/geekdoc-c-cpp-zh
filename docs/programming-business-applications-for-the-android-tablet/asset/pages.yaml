  md: '# PREFACE


    I was motivated to write this book because I believe the tablet platform is suitable
    and even ideal for those who need a mobile source of data in their everyday activities,
    from a quick update during the day to a commute to the need to check inventory,
    quote prices, and place orders throughout the day. The platform is ideal as well
    for those who need an occasional source of information and correspondence but
    don''t want the large footprint of a keyboard, mouse, and monitor taking up their
    space.


    In October 2011, the Institute of Electrical and Electronics Engineers (IEEE)
    reported in its flagship publication, The Spectrum, that the Java programming
    language is by far the most popular applications programming language. Indeed,
    most surveys rate Java near or at the top in categories as so discussed and web-searched,
    most books published, and most commonly used in open-source projects. Because
    there are so many resources available for Java applications programmers and there
    is such a range of choices and availability of Android-powered tablet devices,
    the Android platform puts business automation for mobile devices within reach
    of almost any size.


    This book, like its predecessor Android Application Development for Java Programmers,
    is a tutorial for programming Android applications. The examples presented are
    created using the Eclipse integrated development environment (IDE) with the J2SE,
    Java Standard Edition, and the Android software development toolkit (SDK) added
    in.


    Programming Business Applications for the Android Tablet is intended to be a quick,
    one-stop source of examples for the topics that are central to business application'
  merge: -1
  pgno: 9
- img_proc: true
  md: 'programming for mobile devices, particularly tablets. This book provides enough
    detail that a newcomer to Android programming can create a useful and, indeed
    marketable application. However, each section covers only the surface of a topic;
    there is room for outside research. Java and Android are extremely well-covered
    topics on the Internet. You need only to search class names, method names, or
    keys to receive further guidance. Simply add the word tutorial or example to your
    search query, and you will find plenty of what you are looking for.


    This book is meant for programmers familiar with object-oriented programming (OOP)
    principles and preferably with Java programming experience. If you are familiar
    with C++ or C#, you will be able follow the examples well enough to make a worthwhile
    read. Familiarity with the Eclipse IDE is ideal but not necessary. This book covers
    the basic install of the Java development toolkit (JDK), the Android SDK, and
    the Eclipse IDE. Configuration of the Eclipse environment is covered as the steps
    become necessary.


    Although it is certainly preferable to have a tablet device to test and debug
    your applications, the Android SDK contains the necessary software to generate
    emulators for Android devices such as smartphones and tablets; you don''t need
    to possess an actual device to develop and test an application. An emulator is
    a program that produces a screen display and the functionality of a handheld device
    on your development computer. Using the emulator, you can fine-tune the look of
    your application and test most of its features. Of course, the development experience
    will be much more rewarding with a worthwhile read. You can actually carry out
    your creations and use them as they are intended.


    Each example in this book is functional and usable. You can copy the screen designs
    in the form of XML files from one application to others where the same configuration
    is appropriate. The same is true with subclasses found in examples—especially
    inline classes. The chapters are arranged so that you can use concepts introduced
    in the early chapters throughout the book. Gradually, built-in device features
    such as database management, file storage, and access to networks and the Internet
    are added to applications. Use your imagination as you read this book to convert
    the principles presented into useful, appealing applications. Be productive, and
    enjoy!'
  merge: -1
