  md: '# CHAPTER 5


    # CONTENT PROVIDERS


    # INTRODUCTION


    Many of the operations of an Android handheld or tablet device that are typically
    used in their own right, such as a calendar, contact list, or photo gallery, are
    made available to applications through a system of content providers. Separate
    persons, places, things, and events that have essentially the same pieces of data
    associated with them themselves well to storage in data tables. In fact, this
    is true about content providers on the device. They are addressed as databases
    with data tables and respond to queries the same as SQLite tables. Content providers
    are addressed as uniform resource identifiers (URIs) in the following format.


    ```

    content://package.and.class.name /tablename

    ```


    For example, the first content provider we will look at will be calendars. A calendar''s
    entries are held in a table called events, and when a user posts, reads, or modifies
    an event, it is addressed as follows.


    ```

    content://com.android.calendar/events

    ```


    To some extent, content providers prevent the applications programmer from having
    to reinvent the wheel each an application needs to access the device''s built-in
    applications. They also ensure that the user is accessing consistent, predictable
    sets of data from one specialized application to the next. Often the device will
    provide a user interface for the data tables that can be reached through a content
    provider, such as the ones a user of a device would use to enter a contact, enter
