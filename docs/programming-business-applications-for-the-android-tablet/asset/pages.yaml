    9. The gallery content provider''s title field corresponds to the image file ________________.

    Answer: name

    Reference: http://developer.android.com/reference/android/provider/MediaColumns.html


    10. Environment.getExternalStorageDirectory() refers to the actual /sdcard/ directory
    on the device, true or false?

    Answer: true

