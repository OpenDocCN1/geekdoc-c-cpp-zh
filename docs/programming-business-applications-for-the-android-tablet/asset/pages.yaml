    # PHOTOGRAPHS IN APPLICATIONS


    The need for and use of photographs by professionals in the field is nothing new.
    For years now, real estate agents and appraisers, law enforcement professionals,
    insurance adjusters, and health care professionals have been using photographs
    to support claims and documentation and record significant events, among other
    things.'
