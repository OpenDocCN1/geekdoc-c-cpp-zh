  md: '# Appendix Answers to Chapter Review Questions


    4. The applications programmer can use the ZXing source codes through compliance
    with the ________________ license.

    Answer: Apache

    Reference: http://code.google.com/p/zxing/ and www.apache.org/licenses/LICENSE-2.0


