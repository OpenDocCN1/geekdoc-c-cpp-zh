    Fragments can communicate back and forth with their hosting activity. For example,
    for the hosting activity to gain a reference to fragment, we declare a variable
    of the fragment''s type and assign it using the getFragmentManager(). Look at
    the following example.


    ```

    SomeFragmentClass refreg = (SomeFragmentClass)getFragmentManager().findViewById(R.id.frag_id);

    ```


    frag_id is the ID used in the fragment''s XML file. The fragment''s methods can
    be called by the activity using the fragment''s reference variable. Likewise,
    the fragment can access the activity''s components by using its getActivity().
    method. For example, EditText_parent_edittext = getActivity().findViewById(R.id.edittext_id);


    edittext_id is the ID in the main activity''s XML file element corresponding to
    the targeted EditText object.


    The noticeable user interface covered is here the new application programmer''s
    interface or API for drag and drop. Drag and drop implementation in the application
    can be plain and simple or as sophisticated and embellished as the programmer
    wants to be. You can use the feature with any plain text in a TextView to an image
    from an ImageView, you can even use it with an Intent. As simple or complex as
    the programmer wants to be with his configuration of the drag and drop implementation,
    there are a few essential pieces. The first is some event that indicates to the
    system that a drag and drop operation should be started. Typically, this is a
    long click involving the user touching and holding his finger on the target control.
    To detect this gesture, we simply need to add an OnLongClickListener interface.
    The second item we need to facilitate is a shadow, which is an image representing
    the object being dragged. This is done with a View.DragBuilder and can be as simple
    as taking the text from the source text field or elaborate as a custom-designed
    image. Third and finally, we use a ClipData object to hold the data we want to
    transport.


    The workhorse for the drag and drop operation is OnDragListener, which has several
    actions to which the programmer can write a response. The essentials are ACTION_DRAG_STARTED,
    ACTION_DRAG_ENDED, and ACTION_DROP.


    To illustrate, let''s review the code for the Dynafrag class listed earlier. Recall
    that we contained two text fields (EditTexts) and a button that converted the
    text in the text field to uppercase and copied it to the bottom text field. We
    will revise that class so the user can drag the contents of the top text field
    to the bottom one. The implementation will be extremely simplified but functional.
    Because the top text field will


