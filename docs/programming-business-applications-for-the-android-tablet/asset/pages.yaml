    \ one of three common categories: syntax, logic, and run-time. The second type,\
    \ the logic error, is essentially impossible for the IDE to detect and diagnose\
    \ because these errors are flaws in the approach to solving the problem that the\
    \ application is meant to do. Some cases are incorrect formulas, complex decision\
