  md: 'Stateful connections are done through a socket, which is a combination of an
    IP address and a port number. The port number distinguishes one connection from
    others that may be in place. Using a stateful connection, two-way traffic can
    be conducted, such as might be necessary for a database query and response.


    Port numbers are 16-bit values, meaning there are 2 to the power of 16, or 65,536,
    possible values. Some port numbers are reserved for specific purposes; port 80,
    for example, is reserved for web traffic. Values from 49,152 to 65,535 are commonly
    used for in-house applications.


    Web page requests are done through stateless connections. The Android system and
    software development toolkit allows us to receive and display data through the
    web in two ways: using the web browser through an intent, or displaying data within
    the application using a WebView widget. The WebView is a convenient way to display
    data from a stateless source where no interaction is required, such as an image
    or a static web page.


    # Review Questions


    You can find the answers to these review questions in the appendix at the end
    of the book.


