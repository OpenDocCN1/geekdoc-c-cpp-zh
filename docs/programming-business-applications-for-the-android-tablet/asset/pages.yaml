  md: '# Chapter 2 Migrating to Android 3.0 and Above


    complicated and refers to the Java structure referred to as a package. Simply
    put, a package is a related set of classes. Your project could contain many classes,
    related to each other by a single purpose: to provide the functionality of your
    Android app. All the package names in the Android system must be unique. To be
    sure whatever you are adding will not coincidentally match anything, a reverse-domain-style
    naming system is used. The Java convention for naming packages is sort of a web
    domain name put backwards, as com.sheui.SomeProject. You should note that reverse-domain
    naming is the convention here. You need not own a domain name; you can just make
    one up. (You can learn more about package naming at: //://download.oracle.com/java/tutorial/java/package/namingpkgs.html)


