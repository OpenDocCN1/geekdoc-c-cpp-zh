  md: "The symbols are as follows: table-name is the name of the table to update,\
    \ the null hack allows the insertion of a record with values (normally we would\
    \ give that a value of null), and cv is an instance of the ContentValues class\
    \ that holds the field values to insert. The insert method returns a long value\
    \ indicating the number of the record that was inserted or a minus (-1) if the\
    \ insert operation failed.\n\nFinally, the delete query syntax is follows:\n\n\
    ```\ndelete(table-name,String selection-description,selection-arguments);\n```\n\
