  md: '# Using the Contacts


    and a Gmail address in her mailing list at www.gmail.com and later added a corresponding
    entry for that person with a mobile phone number on Her Android, the synchronization
    process (if the user chose to synchronize the lists) aggregated the listings to
    one entry in the Contacts table and two entries in the RawContacts table. The
    RawContacts table contains a field CONTACT_ID, which is a foreign key to the CONTACT_ID
    field in the Contacts table. Finally, for a given RawContact entry, there can
    be one or more Data rows that contain the actual details for the RawContact. Because
    different types of data have different characteristics—for example, phone numbers
    should behave differently from a thumbnail photo or an email address—their data
    types and characteristics are maintained in a separate table called CommonDataKinds.
    Details from this table are stored in the Data table along with the actual values.
    More details on the table structures and relationships can be found on one of
    the Android Developer''s website pages at http://developer.android.com/guide/topics/providers/contacts-provider.html.


    Needless to say, there is a high level of overhead necessary for the Android system
    to maintain the onboard contact list, including synchronizing the contacts with
    those of email accounts accessed through the Android device. Any attempt by an
    applications programmer to access and take advantage of this system would certainly
    be daunting. Even with the examples that will be provided in this book and the
    examples and tutorials that appear elsewhere, and using the APIs provided, the
    applications programmer would have spend a lot of time and effort to build a complete
    contact management application. My recommendation is for the applications programmer
    to interact with the contact system only to the extent that enhances an application,
    and that the bulk of contact management on a given device be done with the user
    interface that the Android device provides. For example, the People that came
    with the Toshiba Thrive manages contacts. Remember that you can work the device''s
    own contact system into your application an intent, just as we did with the calendar
    posting at the beginning of this chapter.


    With in mind, the following paragraphs contain some experiments to illustrate
    how an application might interact with the contact system and perform the create,
    read, update, and delete (CRUD) operations commonly carried out by applications
    involving a database.


    First, we need to look at two essential classes needed to carry out operations
    on the contact management system. The first is the ContentProviderOperation. This
    class has, among others, the three methods newDelete( ), newInsert( ), and newUpdate(
    ). As have seen earlier in the chapter, content providers are addressed as URIs,
    and each of these methods takes a URI as an argument—more specifically,'
