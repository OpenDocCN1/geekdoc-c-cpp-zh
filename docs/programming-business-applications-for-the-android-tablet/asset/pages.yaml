  md: '# CHAPTER 6


    # CLIENT-SERVER APPLICATIONS


    # CONNECTIONLESS COMMUNICATIONS ON THE INTERNET


    As rich in processing power and resources as the typical handset or tablet is,
    any business application will likely rely or at least benefit from access to outside
    data, whether it is from the Internet or a local area network (LAN). Data can
    come in and go out of the device in many formats, from plain text to images and
    everything in between. Access can be of a connectionless nature, such as a web
    page, for example, or through connection-oriented data streams connected to a
    server-side application. For those unfamiliar with networking, connection-oriented
    communications are those in which the communicating devices establish a connection
    through an exchange of messages before passing useful information. In this type
    of communication is more reliable, but more data must be passed between the parties.
    This extra data is referred to as overhead. Connectionless communications, on
    the other hand, use no such acknowledgments, and neither side has an obligation
    to keep track of the state of the communications. These connections are inherently
    less reliable but require less overhead. Web page requests, for example, are connectionless
    because each request requires a new connection. In this chapter, we will look
    at several options and leave it to the application developer to choose the best
    method for a given application.


    Probably the easiest to incorporate into an application and certainly the easiest
    to demonstrate is simple access to a web page using a WebView widget. The newer
    application programming interfaces (APIs) give a rich set of capabilities to the
    WebView'
  merge: -1
  pgno: 184
- img_proc: true
  md: '# Chapter 6 Client-Server Applications


    object, as such control. However, the most basic settings render a usable platform
    to allow for quick access to the World Wide Web. Possible uses for web access
    might be to an online or internal company directory, access to company products,
    and so on. The application programmer need not develop any web design work and
    information already developed by the enterprise specifically for the tablet. Essentially,
    anything available to a browser can be made available to the application.


    In the first demonstration, we will cover two ways to use a WebView widget. The
    first is to include a WebView in the main XML file and set a specific size in
    pixels to it. This allows the browser window to share space on the screen with
    the rest of an application. By the example, the reader can see how easily the
    WebView can be located on the screen. The second option is to display the WebView
    on its own screen through the use of a separate intent with its own XML file.
    This method allows the maximum size for the WebView and preserves the main screen
    for the application''s balance.


    Before we do anything with the Internet, however, we must enter the appropriate
    permission in our manifest file. Adding the following line to your project''s
    manifest:


    ```

    <uses-permission android:name="android.permission.INTERNET/>/>

    ```


    As be sure that it is an outermost element, and don''t include it in any other
    tag pair. Also, because this demonstration uses two Activity classes, the second
    must be added to the manifest file. This time, however, the entry belongs between
    the `<application>` and `<activity>` tags.


    ```

    <activity android:name=".WebIntent/>

    ```


    If you have never written a multiscreen application, here is a quick tutorial.
    First, the various activities are written as separate classes with separate source
    code files. In Eclipse, you can do this by right-clicking your package in the
    Package Explorer panel and choosing New, Class. Be sure you have the package name
    at the top and the necessary imports, and be sure that your class extends the
    Activity class. Override the `onCreate()` method with your code, but be sure to
    call the “super” constructor before anything else in the method. You also need
    to create an XML file for this activity and refer to it in your new class with
    a line like this:


    ```

    ContentView(R.layout.browse);

    ```


    The actual name of your XML file without the XML extension will replace the word
    above above. You start the XML file for your additional activity by right-clicking
    the layout folder under the res folder in the Package Explorer and choosing Android
    XML file as the file type. (See Figures 6.1 and 6.2.)'
