    Source: The Eclipse Foundation.


    If you are using an older version of the plug-in that doesn''t offer these settings
    at the beginning of the project (on another development machine, I am using version
    16, which doesn''t offer the screen in Figure 9.1), you can still set these manually
    in the manifest file. These attributes can be important if you are in a bring-your-own-device
    environment and have no control over the devices that will use your application.
    A device with an Android version less than the minimum you specify will not install
    the application; therefore, setting the minimum software development toolkit (SDK)
    version will give you some control over which devices will be installing your
    application.


    The next important settings in your manifest file are attributes of the manifest
    element itself; in other words, they are attributes found inside the opening manifest
    tag. They are as follows.


    +   - android:version—This is an integer value that represents the version of
    the application. Newly started projects are set to 1. Successive releases should
    have a higher number than the previous. You may never intend to put an application
    on the public markets, but if you do and you plan to replace it at some'
  merge: -1
  pgno: 273
- img_proc: true
  md: 'point with an upgrade, remember to change the version number, or the market
    will reject you


    android:versionName—This starts at 1.0 for new projects. The Android system does
    not pay attention to this number, so the developer can use it at will. The value
    is stored as a string, so the developer can use multiple decimal points in the
    name to specify revision levels such as 1.2.1, 1.2.2, 1.3.0, and so forth, based
    on the levels or features added the bug fixes. You do not need to bother with
    this attribute, I would strongly suggest that, as a developer, you get into the
    habit of tracking and documenting revisions using this attribute as a reference.


    If your application is to use any included files, text files, SQLite tables, or
    graphics, you should place them in the proper directories of your application
    at this point. If the application needs no graphics, it should at least have launch
    icons. For testing purposes, there are always default launch icons included with
    the project. Version 20 of the plug-in gives you a range of choices at project
    start-up time, but these are hardly suitable for deployment. The website http://developer.android.com/practices/ui_guidelines/icon_design.html
    has the specifics for creating and placing icons in the proper directories.


    When you are satisfied with your project, and you have determined that it is bug
    free, you will get your application ready for deployment by condensing it into
    a single file that will have the extension APK, an abbreviation for Android Package.
    You can think of the APK file for Android as you would think of a Java JAR file
    for an application written for a personal computer. You can create the APK file
    by right-clicking the project name in the Package Explorer and choosing Android
    Tools from the menu. That will bring up another menu, and you can choose either
    Export Signed Application Package or Export Unsigned Application Package. No Android
    device will install an unsigned application. Back in Chapter 1, “Installing Eclipse,
    Java, and the Android SDK,” we went through creating a key and saving it to a
    keystore file. If you choose Export Signed Application Package, you need to know
    where that keystore file is and what password you gave it when you created it.
    You will be prompted for these as you move through the screens to create the signed
    application.


    If you held off on creating the key, it is okay for now; just choose Export Unsigned
    Application Package. You will create the APK file; you just cannot deploy it yet.
    When you finally create a key, you can either go back and redo this process choosing
    Export Signed Application Package from the menus, or use a terminal and command
    line to sign the unsigned APK file you created.'
