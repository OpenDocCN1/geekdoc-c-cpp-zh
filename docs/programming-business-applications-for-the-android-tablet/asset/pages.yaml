  md: '# Connectionless Communications on the Internet


    ![](img/cbb97d4daaabf800d0384cb0ef181aa8_186_0.png)


    Figure 6.1


    Starting a new class from the Package Explorer.

    Source: The Eclipse Foundation.


    From your main activity, you call another activity by invoking an intent with
    code similar to the following:


    ```

    Intent myIntent=new Intent(MainActivity.this.getApplicationContext(),Intent.class);

    startActivity(myIntent);

    ```


    Many of the device''s services, such as phone (if the device is a smart phone,
    of course), and so on, we have built-in symbolic constants in the Intent class.
    To use one of these, you call it with code similar to the following, which would
    start the phone service.


    ```

    Uri uri=Uri.parse("tel:888-555-1212");

    Intent myIntent=new Intent(Intent.CALL, uri);

    startActivity(myIntent);

    ```


    In our example, notice that we need to pass the website URL from the main screen
    to the second screen containing the web browser. We do this by passing a bundle
    to the call to the second intent. The bundle is populated by using the .putExtra()
    method of the Intent class and using a name-value pair as the argument. You can
    make as many entries to the bundle as necessary. On the second activities side,
    you pull values from the bundle by using the matching name in the name-value pair.'
