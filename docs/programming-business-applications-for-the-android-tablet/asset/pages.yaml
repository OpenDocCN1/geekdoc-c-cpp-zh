  md: '# Using External Data


    The second format used to transmit data, which is becoming increasingly popular,
    JSON (JavaScript Object Notation). JSON is an open standard for data exchange
    Many consider its advantage over XML to be the fact that there is less overhead
    to transfer than there is with XML. For instance, a pair of tags might take 20
    bytes, whereas the same demarcation can be done in JSON with much less. Instead
    of using a single root element as XML does, JSON uses a pair of curly braces.
    Instead of using tags to specify a field, JSON uses a name-value separated by
    a colon. The name and value are enclosed in their own quotation marks. What is
    enclosed in a single pair of curly braces is referred to as an object, analogous
    to what we might refer to as a “record” in a data table.


    An array, or series of similar name-value pairs, is demarcated by a pair of square
    brackets. As an example, let us take the XML example we used earlier and restart
    it in JSON notation. First, here is the original XML notation.


    ```

    <?xml version="1.0"?>

    <person>

    <name>

    <first>Jim</first>

    <last>Sheusi</last>

    </name>

    <occupation>College Professor</occupation>

    <position>Dept. Chair</position>

    </person>

    ```


    Next, here’s the same thing using JSON.


    ```

    {

    "name":{

    "first":"Jim",

    "last":"Sheusi"

    },

    "occupation":"College Professor*",

    "position":"Dept. Chair"

    }

    ```


    Right off the bat, the character count for the JSON version without spaces is
    95, ver-us 159 for the same data in XML. This makes JSON about 50 percent more
    efficient compared to XML.


    To perform the same exercise that we did before only using JSON as our format
    for receiving the results from the server, we first have to add the following
    package and class to the source code: org.json.* and java.util.Iterator.


    209'
