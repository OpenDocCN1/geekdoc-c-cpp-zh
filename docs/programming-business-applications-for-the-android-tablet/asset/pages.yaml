- img_proc: true
  md: '# Chapter 3 Databases in the Application


    If the goal of the database is to provide look-up information to the end user,
    and the end user is not expected to modify data on his own, the amount of data
    is not conveniently available at run-time, or connectivity may not be available
    at run-time, an ideal solution is to bundle data with the application. To run
    through an example of this process, we will build an application that includes
    the zip codes for the United States for look-up purposes. Obviously, there would
    be no need or logic to the end user having the ability to add, edit, or delete
    zip codes, the developer might want to include the ability for the user to specify
    a subset of zip codes, as all zip codes for a given state. There are more than
    42,000 zip codes in the table, so this is not a data table we want to load by
    hand. Also, it is information that the developer wouldn''t want to leave at the
    mercy of available connectivity on the road. (Remember, the advantage of mobile
    devices is their mobility!) By its nature, the zip code table is a good example
    to use.


    You can find a usable, downloadable zip code table at www.unitedstatescodes.org/zip-code-database/


    The first step is to convert the zip code table to an SQLite table. The data table
    at this site comes in CSV format and can be read by either Microsoft Excel or
    Microsoft Access. (It''s assumed you have access to one or both of these applications.)
    If you are using Access


    When you unzip the download, you will find one executable file. Just double-click
    it to start the SQLite browser. With this, you will create a database to hold
    the zip code table. I named my database AndroidDatabase. Do this by choosing New
    Database over the File menu. See Figure 3.1.


    For any database that you want to bundle with an Android application, you need
    to create a table called android_metadata with a single field called locale. You
    can do that using the Create Table icon on SQLite Database Browser''s toolbar,
    which is a table symbol with a yellow star on it. After you create the table,
    choose the Execute SQL tab and enter the following code to create a single record:


    ```

    insert into "android_metadata" values(''en_US'');

    ```'
