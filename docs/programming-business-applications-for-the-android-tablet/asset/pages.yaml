  md: "# Chapter 4 Forms and Graphics\n\nthe device if it is available, or you can\
    \ do a little research on the Internet. Alternatively, you can get the dimensions\
    \ from the device itself. Your application can get the dimensions from the device\
    \ and make calculations at run-time. It is helpful if your application must be\
    \ adjusted for different devices or if you need to scale graphics at run-time.\n\
    \nAside from screen dimensions, it is ideal to be able to determine at design\
    \ time whether the screen will display in portrait or landscape mode. It is best\
    \ if you can lock the screen in one or the other mode so your thought-design isn't\
    \ spoiled by the user turning the device the wrong way. Although these two features\
    \ are easy enough to use, they are not intuitive like many of the common programming\
    \ techniques and requirements are. I find myself having to look them up each time.\n\
    \nWith that in mind, let's look at the following experiment. The application's\
    \ screen will contain two TextViews: one to display the width dimension and the\
    \ other to display height. It will also have two buttons: one for the user to\
    \ set landscape orientation and the other to select portrait. These two buttons\
    \ lock the application in the chosen orientation no matter how the device is held.\
    \ If you are fortunate enough to be able to try the application on a real tablet\
    \ device, you will notice that the dimensions displayed will change, depending\
    \ on the screen orientation. Of course, there is probably no practical reason\
    \ why you would want the application's user to be able to swap orientations at\
    \ run-time; this is just an exercise to show the code that does so. Likewise,\
    \ there is probably no reason to display the screen dimensions, but the application\
    \ shows how to get the values so you can use them internally and for planning\
    \ purposes. Following is the XML file for the main screen. You will notice that\
    \ I am using the RelativeLayout, which is currently the default layout for new\
    \ applications. Also, I am basing the positions of my components on the single\
    \ default TextView object, which normally holds the \"Hello\" message. Look at\
    \ the code snippet.\n\n```\n<TextView\n    android:id=\"@id/first\"\n    android:layout_width=\"\
    wrap_content\"\n    android:layout_height=\"wrap_content\"\n    android:layout_centerHorizontal=\"\
