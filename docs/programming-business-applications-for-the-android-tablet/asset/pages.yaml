    \ phone's keypad. As cell phones evolved into what we consider smart phones, such\
    \ as the iPhone and the many Android phones, multiple phone numbers, email addresses,\
    \ photographs, and other details could be added for a given contact. Contacts\
    \ can be included in groups.\n\nTablets, of course, continue to allow the maintenance\
    \ of a contact list and give the applications programmer access to it through\
    \ a content provider. Unfortunately, the rich configuration of data that can be\
    \ stored to a given contact is a double-edged sword for the programmer because\
    \ the features come with a relatively complex collection of related tables. The\
    \ tables share some data that maintains their relationship and contain many unique\
    \ pieces of data that build the contact's profile. Contacts can be synchronized\
    \ with many services. Probably the most common for the Android user is the user's\
    \ mailing list.\n\nAt the top level is a Contacts table represented by the class\
    \ Contracts.Contacts. It has two essential fields that have a one-to-one relationship:\
    \ one set (and record) for each contact in the system. These are the Contact ID\
    \ and the Display Name. There is also an _ID field and a LOOKUP_KEY field; which\
    \ have no value to the end user, but they are essential to the maintenance of\
    \ the system by the device.\n\nFor any given contact with one specific Display\
    \ Name, there can be multiple occurrences in a table called RawContacts. For instance,\
    \ if a user posted a contact name"
