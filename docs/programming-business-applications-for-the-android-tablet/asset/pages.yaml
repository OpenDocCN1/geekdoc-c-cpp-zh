    networks on the Internet and read the postings. Another good idea is to check
    with the websites managed by the software providers themselves. Some of the changes
    in the Android operating system from version to version are subtle, whereas others
    are dramatic. The tablet device and Android 3.0 have new opportunities for useful
    application development. The introduction of Android 4.0 continues to bring improvement.
    This chapter focuses on only a few of them. You should research the changes in
    the versions and the corresponding Android APIs to discover other features that
    might be to your advantage in producing useful applications.


    The Action Bar eliminates the need for the hardware menu button and provides more
    functionality than the old-style menus. Android allows for use of the Action Bar
    while maintaining compatibility with older devices that have the hardware menu
    button.


    Fragments allow the developer to modularize groups of controls and their functionality
    into reusable pieces. Screens can be assembled by using combinations of fragments,
    and fragments can be brought from screen to screen, added and removed dynamically,
    and ported from application to application. Although they are not the solution
    to every problem, they provide a reusable and predictable structure for application
    building.


    # Review Questions


