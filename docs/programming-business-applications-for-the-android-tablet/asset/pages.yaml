  md: 'At the heart of the application are the XMLPullParser XMLPullParserFactory
    objects that appear in the Thread class. They are found in the org.xmlpull.v1
    package that is included in the Android tool kit. This is one of several packages
    you can use to manage XML files. Another is SAX, which can be found at the website
    sax.sourceforge.net. However XMLPullParser because it is easy to use, and it doesn''t
    have to be downloaded separately and added to the application build as an outside
    package. To add outside packages, incidentally, you would choose Properties under
    Eclipse''s Project menu, choose Java Build Path in the properties, and in that
    panel you would Add External JARS on the right side and specify the path to the
    JAR containing packages you want to use on your development machine.


    For convenience, I specified the URL for the data as a literal string. This data
    may or may not be available when you are reading this, but at least you can see
    where it could go and what it looks like. If you are writing an application for
    your company or for yourself, this address will likely be within your control
    or influence, so you could manage it in the same fashion you should. If some kind
    of account authentication is necessary, you can check with your network administrator
    on how to handle that.


    As you can discern from the code, the XMLPullParser class is able to recognize
    the element tags in the XML file as opening or closing tags and is able to spot
    the data between the tags. The code has multiple checked exceptions, and you can
    handle them as you wish: logging messages, controlling the program flow, or whatever
    you want.


