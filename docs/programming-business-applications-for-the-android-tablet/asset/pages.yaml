  md: '# CHAPTER 9


    # DEPLOYMENT AND VERSIONING


    The purpose of this book is not to help you produce applications for general consumption,
    although I certainly would not discourage it. Instead, the purpose is to extend
    functionality and productivity to the mobile platform for your specific concern.
    Even if getting an application to the Android Play Store is not a goal, certain
    conditions must be met before the application can even be installed on a device.


    Many of those conditions start with the manifest file.


    The first settings to look at in the manifest file are in the <uses-sdk> element.
    In this element, you specify the application programming interface (API)-level
    requirements for your application. You will use one or more of the following attributes.


    +   - android:minSdkVersion—This attribute specifies the minimum version of the
    Android platform on which your application will run.


    +   - android:targetSdkVersion—This attribute specifies the Android platform version
    on which the application was meant to run.


    +   - android:maxSdkVersion—This is the maximum version of the Android platform
    on which the application is designed to run. You probably will not need to use
    this attribute, and you are advised to consult the Android documentation for the
    <uses-sdk> attribute before you use it.


    If you are using version 20.0.2 or higher of the Android plug-in in Eclipse, you
    were prompted for the first two of these settings when you began a new application
    project. See Figure 9.1.'
