    The big advantage of the tablet over the handset is the amount of usable space
    on the screen. Even with the “soft” keyboard up there is a lot of visible, available
    space for your application. Of course, any screen, whether it is on a tablet or
    a PC, needs some planning if it is to provide an ideal user experience. Hopefully
    you have had some experience with ViewGroup classes such as the LinearLayout and
    RelativeLayout as well as the common controls such as the EditText, Button, and
    ListView classes. Indeed, if you have done the exercises presented in the previous
    chapters, you have seen how they work.


    If you are using the latest Android toolkit and the latest add-in for Eclipse,
    you may have noticed that new projects default to the RelativeLayout instead of
    the LinearLayout. You will also have noticed the single TextView, which holds
    the "Hello" message, no longer appears on the top of the screen, but in the middle.
    In the RelativeLayout, screen objects are positioned in relation to another object
    that is identified by its given android:id parameter, which is a nice way to plan
    the screen. If you noticed this, you undoubtedly noticed the improved graphic
    designer view when you edited the main XML file. Not so apparent, on the other
    hand, is that Android has deprecated the AbsoluteLayout ViewGroup class.


    If you are planning a screen, it is helpful to know its dimensions in pixels.
    This is especially true if you know the device''s specifications in advance, which
    would be the case if you are lucky enough to specify the device that will be deployed
    with your applications on it. You can get these dimensions from the documentation
    for'
