  md: '# Chapter 5  Content Providers


    to the data maintained on the system, application designers are not bound to the
    device''s user interfaces for this information. This is the feature that makes
    content providers particularly useful and interesting. The Android operating system
    even lets the applications programmer develop his own content provider and the
    data tables behind it.


    # CALENDARS AND EVENT POSTINGS


    We will start by looking at the calendar as a content provider. Calendars are
    typically associated with and synchronized with a mail server associated with
    an email account maintained on the phone or tablet. Android allows multiple calendars
    and allows any one, a combination, or all their entries to be displayed at the
    same time on the built-in calendar application. For example, on my devices I have
    Google Gmail account configured as well as my university email account, which
    uses Microsoft Exchange. Of course, neither mail server resides on the devices.
    Either of the calendars can be accessed at least two ways. First, the calendars
    can be accessed through the built-in "intent" available from Android that brings
    up the built-in user interface. Second, the calendars can be accessed through
    a posting operation similar to that used to add records to any SQLite database.
    To get our feet wet, to speak, with content providers, and specifically the calendar
    content provider, we will write a little application that inventories the device''s
    currently configured calendars. This is useful because later on we will need specific
    information from the calendar(s) to post events through an application.


    We will start with a project called CalendarApp. This, as usual, will create one
    TextView in the XML file that would normally hold the "Hello" greeting. We will
    add a multiline EditText field to hold the information about the configured calendar(s).
    As is true many times the elegance of the user interface for many of the experiments
    is sacrificed for simplicity''s sake, and this one is no exception. Sometimes
    in an effort to make an attractive, ready-for-prime-time user interface, the point
    of the exercise is lost. In this exercise especially, simplicity rules the day.


    Note


    > I should point out that I am using an actual Android tablet to test my applications
    instead of an emulator, so the calendar data revealed is actually on the device.
    If you use an emulator, click the calendar app that is on the emulator and configure
    a calendar as instructed. Some of the classes used in this chapter require API
    14, so configure an emulator for Android 4.0 if you are using one.'
