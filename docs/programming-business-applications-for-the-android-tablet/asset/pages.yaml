  md: '# CHAPTER 7


    # USING EXTERNAL DATA


    In Chapter 3, "Databases in the Application," we looked at using data tables on
    the tablet or device itself, but it is likely that any useful application will
    need to use information that an outside source provides. This could be data on
    a company or enterprise server most managed by its own DBMS or data provided by
    a multitude of external sources such as the Google application programming interfaces
    (APIs). One current limitation in the Android operating system is the lack of
    availability of drivers for various server-based database management systems such
    as MySQL. To provide data to a client device in the field, handset, tablet, or
    otherwise, we can run a dedicated application on the server that exists solely
    to respond to queries (I do this often), or we can essentially do the same job
    with a PHP or similar script on a web server. We covered connection to the server
    by the client device in the previous chapter. Now we will look at the data formatting.


    Data can be returned to the device using various plain text encodings as CSV (comma-separated
    values), XML, and JSON (JavaScript Object Notation). CSV has its disadvantages.
    One disadvantage is that it does not support hierarchical data. We will see an
    example of hierarchical data later in this chapter in the address data we will
    retrieve from Google. Another disadvantage is the use of double quotes, which
    are used to enclose data fields but might be found in the text of the field. This
    requires special handling. Yet another disadvantage is handling of fields with
    missing data.


    To avoid these difficulties and ambiguities, a standardized structured format
    is preferred when transferring data. Two popular methods that have packages included
    in the standard Android development toolkit are XML and JSON.'
