    \ devices such as contact lists and calendars. Data is accessed through queries\
    \ like those used to access tables created by applications programmers for specific\
    \ applications. Though not covered in this book, applications programmers can\
    \ create their own content providers around data tables stored on the device.\n\
    \n+   - All of the typical operations used on data tables such as creating, reading,\
    \ updating, and deleting records can be done to records maintained by content\
    \ providers through third-party applications. However, applications will need\
    \ specific permissions written into the manifest file to allow the application\
    \ to make changes to the content provider's records. The manifest entry will alert\
    \ the installer of applications with these permission requests and allow the user\
    \ of the device to cancel the installation if he chooses not to allow the permissions.\n\
    \n+   - While some content providers' record system might have a very simple design,\
    \ others such as the contact list can be fairly complicated. The programmers who\
    \ chooses to access records of a content provider should do extensive testing\
    \ of applications to ensure that the integrity of these records remains intact."
