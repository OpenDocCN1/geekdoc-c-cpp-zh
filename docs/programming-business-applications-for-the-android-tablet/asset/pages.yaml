    Source: © 2013 Cengage Learning®, All Rights Reserved.


    For Android programmers, however, Zebra Crossing is an open-source multiformat
    image processing library implemented in Java. Perfect! The resources are located
    at the following web address: http://code.google.com/p/zxing/ (zxing is short
    for Zebra Crossing). At this address, you can find documentation, downloads (both
