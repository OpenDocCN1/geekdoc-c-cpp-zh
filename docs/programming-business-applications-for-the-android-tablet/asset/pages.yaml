  md: '![](img/cbb97d4daaabf800d0384cb0ef181aa8_74_0.png)


    **Figure 3.1**\New database using SQLite Browser.

    Source: SourceForge.net.


    Thus, we have created one table in our database, which contains one record. The
    next step is to export the zip code table to the SQLite database. To do this,
    we need to download an SQLite driver. I downloaded this from www.ch-werner.de/sqliteodbc.

    This site was available at the time of this writing, but if it''s not when you''re
    reading this, you can search for another source. The download contains a file
    called sqliteodbc.exe. Just execute that file to install the driver. After you
    have installed the driver, you need to register your newly created SQLite as a
    data source. If you are using Windows, find Data Sources (ODBC) in the Control
    Panel. It should either have its own icon or be listed in Administrative Tools.
    In Windows 7, you may need to click the arrow point to the right of the Control
    Panel in the search bar and choose All Control Panel Items. (See Figure 3.2.)
    When you find it and click it, you bring up the ODBC Data Source Administrator
    dialog box. (See Figure 3.3.) With the User Dsn tab active, click the Add button
    on the right, choose the appropriate newly installed driver (probably SQLite 3
    ODBC Driver), and then click the OK button. When you do this, another dialog box
    pops up for you to choose your SQLite database wherever you saved it on your machine.
    When this is complete, you are good to go. You can find a comprehensive guide
    to this process at: http://web.symnetworks.com/SQLite.htm.'
