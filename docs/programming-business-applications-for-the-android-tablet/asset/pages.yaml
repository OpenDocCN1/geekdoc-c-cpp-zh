  md: '# EXTENDING THE TextView with Graphics


    As uses expand for handheld devices in business, many applications are designed
    to accept and save signatures, by use of either a stylus or a fingertip. You may
    have noticed that more and more small retail stores are using handheld devices
    such as mobile phones as roving cash registers. With a credit card swipe device
    attached to the handheld device, a salesperson on the floor can accept a credit
    card purchase on the spot without having to return to a sales counter. This is
    more convenient for the salesperson and the customer. Of, such purchases (at least
    $25) require a signature. An application to accept pledges or memberships or to
    prepare ID cards that is to be used in the field may also be a suitable use for
    an application that contains a signature component, not to mention proof of a
    delivery to be used by a service device.


    You can create a signature field and many more graphic enhancements to an application
    by extending the TextView class, just as we extended in the earlier examples.
    Part of the application involves detecting a touch and placing a dot at series
    of xy coordinates as the user moves a stylus or finger on the screen; the rest
    involves converting the contents of the TextView to a bitmap file. Once a self-contained
    subclass of the TextView class is created, you can reuse it in any number of business
    applications.


    Following the source code of a class that can be used to collect signatures. In
    reality, it could be used as a doodle pad as well, if that was intent, but because
    we are targeting business applications, we will stick with the signature intent.
    The logic behind the class is to collect a series of xy coordinates that reflect
    the touch locations. As the user moves her stylus or finger on the screen, the
    change in location causes the application to save the new location in the series.
    The act of lifting the finger or stylus prompts the end of one series of dots,
    and the retouch starts another; this preserves the breaks in the motion, such
    as the user moves from first name to last name or from letter to letter. The touch
    positions are saved as an ArrayList of the contained class called spot; each instance
    of this contains the x and y coordinates as well as an index value that indicates
    which letter or continuous of touches the spot belongs to. The dots are connected
    by lines and redrawn by the TextView''s onDraw(Canvas) method.


    ```

    package com.sheusi.Screens;


    import java.util.ArrayList;

    import android.graphics.Paint;

    import android.content.Context;

    import android.util.AttributeSet;

    import android.widget.TextView;

    import android.view.View.*;

    ```'
