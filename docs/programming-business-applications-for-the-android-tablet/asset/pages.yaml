- img_proc: true
  md: 'This query essentially performs a read operation on a table. It doesn''t add
    or change existing records; it simply reads them. The Cursor object that is returned
    is similar to the ResultSet returned by a query in Java Standard Edition''s Statement.query()
    method. Implementation of that code sample might look like this:


    ```

    Cursor c=query("members", null, "subject=?",new String[]\n{"android",null,null,pagecount);

    ```


    This is equivalent to the SQL statement select * from members where subject=''android''

    order by pagecount.


    When a database application is designed for a server or an individual''s desktop
    or laptop, typically the database portion is on a database management system (for
    example, Microsoft Access, MySQL, and Oracle), and the front end is done separately.
    The front end application, or the user interface, is built to assume that the
    database portion exists and is functioning. Indeed, this is the beauty of modern
    relational database management system (RDBMS) middleware; the data operations
    are independent of abstracted from the front end application. On the other hand,
    in a mobile application, unless data is provided by a content provider, the database
    operation is integrated into the application. SQLite does not offer ODBC connectivity
    or JDBC as JSE. So the programmer has a chicken-and-egg dilemma. If she designs
    the application to construct data tables each time the application is started,
    existing data is always overwritten and lost. If she doesn''t include the construction
    of the data tables, they may never exist. Obviously, the solution is to check
    for the tables'' existence before creating them. We did a similar thing with our
    bundled tables using the database object helper in the method openOrCreateDatabase(),
    which returns an instance of the SQLiteDatabase class and has a built-check for
    the database''s existence.


    To round out the CRUD queries, the Update query syntax is as follows:


    ```

    update(table-name,ContentValues cv,String-description,String[])

    selection-arguments);

    ```


    The symbols are as follows: table-name is the name of the table to update, cv
    is an instance of the ContentValues class, selection-description is the specifier
    for which record(s) to update, and selection-arguments is the specification for
    the selection description. The method returns an integer that indicates how many
    records were updated.


    The Insert query syntax is as follows:


    ```

    insert(table-name,null column hack,ContentValues cv);

    ```'
