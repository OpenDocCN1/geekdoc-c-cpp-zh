  md: 'Recall that a web page is essentially a text file with specific content, namely
    HTML, and that it only appears as a web page when it is interpreted and rendered
    in a browser. The fact that a web page is formatted as such has nothing to do
    with the way it is transported. There is no reason that a text file, XML file,
    or image file cannot be transported using the same techniques. For the following
    modification of the application we just covered, I loaded the basic Miranda Rights
    from Wikipedia.org on my web server at Fleobile.com. The file is plain text and
    is appropriately called miranda.txt. I chose the Rights because they meaning as
    plain text (a web page usually doesn''t mean much as plain text), they are brief,
    and they can be useful, although one hopes to never need them. We will modify
    the previous application by substituting the in-screen WebView with an EditText
    field and use it to display the downloaded text.


    Replace the WebView in your main XML file with the following element.


    ```

    android:id="@id/website"

    android:layout_width="match_parent"

    android:layout_height="500dp"

    android:layout_below="@id/getpageforintent"

    android:layout_centerHorizontal="true"

    android:padding="@dim/padding_medium"

    tools:context=".MainActivity" />

    ```


    To download a file using a URL connection, we must run the process in a separate
    thread. To do this, I created an inner class that extends the Java Thread class
    to deal with the download. The constructor for the thread takes the URL (the web
    address combined with the name of the file to be downloaded) as its sole argument.
    As the text is downloaded, it fills a StringBuilder object that is later returned
    to the button''s onClick() method. Once the download is complete and the StringBuilder
    is returned to the onClick() method, it can be displayed in any widget capable
    of displaying text, saved to a file, or both.


    There are occasions when conditions warrant that the application be about downloading
    from a URL, such as if the connection is weak or the server is busy. If the programmer
    assesses that such a thing is possible, he may want to set an allowed timeout
    period for the connection before the application proceeds to move on. To do this,
    he would use the setTimeout() method of the URLConnection with an allowable number
    of milliseconds as the argument. If the connection is not made in the allowable
    time, however, the method will fail and cause a TimeoutException, which must be
    handled by the application in some elegant fashion.'
