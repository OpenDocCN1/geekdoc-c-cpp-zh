  md: "# Subclassing Controls\n\nOOP experience knows that you can just attach a listener\
    \ of one type or another to accomplish the specific task or modify the XML or\
    \ source code for a cosmetic change on a control or widget. However, if you want\
    \ to use a control with a custom feature or features over and again, across different\
    \ applications, it can be tedious to rewrite the special code each time. In these\
    \ cases, it is convenient to create subclasses of the common widget to suit your\
    \ needs. You can write subclasses as inner classes (which sort of defeats the\
    \ purpose of modularity), or you can write them as separate Java class files in\
    \ a given project and then include it if necessary in other projects.\n\nThere\
    \ are two ways to include a widget or a subclass in an application. You can do\
    \ it in the Java code by creating an object of the appropriate ViewGroup class\
    \ (LinearLayout, for example), and linking it to the View used in your XML file,\
    \ and then use the object's add() method to add your control; or you can simply\
    \ add the control or its subclass to the XML file at design time. (Notice that\
    \ I tend to use the terms control and widget interchangeably.) The latter technique\
    \ is what we will use here.\n\nThe first example of subclass widgets is a simple\
    \ one, involving the appearance of two text fields. It probably has no practical\
    \ value other than to illustrate the point. This time we will look at the Java\
    \ file.\n\n```\npackage com.sheusi.Screens;\nimport android.app.Activity;\nimport\
    \ android.os.Bundle;\nimport android.widget.*;\nimport android.content.Context;\n\
    import android.util.AttributeSet;\nimport android.graphics.Color;\n\npublic class\
    \ Screens extends Activity {\n    /** Called when the activity is first created.\
    \ */\n    @Override\n    public void onCreate(Bundle savedInstanceState) {\n \
    \       super.onCreate(savedInstanceState);\n        setContentView(R.layout.main);\n\
    \    }\n\n    public static class BigText extends TextView {\n        public BigText(Context\
    \ c) {\n            super(c);\n            this.setBackgroundColor(Color.WHITE);\n\
    \            this.setTextSize((float) 30.0);\n            this.setText(\"This\
    \ is my big text\");\n        }\n    }\n```"
