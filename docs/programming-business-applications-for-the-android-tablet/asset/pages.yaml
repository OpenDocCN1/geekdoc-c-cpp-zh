    Source: Google.\n\n# SUMMARY OF KEY CONCEPTS\n\n+   - Android devices allow some\
    \ type of connectivity, via either wireless networking or a data plan through\
    \ a cell network provider. Connections can be stateless or stateful. A stateless\
    \ connection waits for a request, sends a response, and waits for the next request.\
    \ It doesn't wait for an acknowledgement that the response was received. A stateful\
    \ connection, on the other hand, maintains communication between the two parties\
    \ through a system of requests, responses, and acknowledgments as long as the\
    \ connection is not cancelled by one side or the other."
