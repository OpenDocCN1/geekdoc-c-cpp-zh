- img_proc: true
  md: 'However, traditionally the integration of photography in the field involved
    instant cameras, staples, paper clips. The advent of digital photography allowed
    a smoother integration of documents and images required the images to be transferred
    to a processing machine, probably a desktop computer, so they could be embedded
    with the appropriate documents. The process still requires the digital photos
    to be indexed and properly matched to the documentation, sized properly, and so
    on.


    The high quality of digital cameras in modern handhelds and tablets, the availability
    of motion photography (videos), the screen size of tablet devices in particular,
    and the ability to write custom applications tailored to a particular need bring
    the integration of images and to a new level. The device itself can take the picture,
    transfer it, catalog it, and in some cases edit it, resize it, and integrate it
    into a document all on its own. In this section, we will look at a couple of exercises
    that focus on using and tracking digital photographs in applications.


    Our first exercise involves building an application that will take a photograph
    and immediately display a bitmap representation of it. This particular application
    allows the user to save the date, a specific name for the image (what the Android
    system calls the image''s title), and a brief description of the image to a text
    file on the system. Should the user choose to transfer the images later, a document
    matching the actual image filenames to their descriptions can accompany them and
    prevent mix-up. The application''s code is surprisingly brief because it uses
    the device''s built-in camera application as an intent. There is no need to reinvent
    the wheel when implementing a feature of the Android handheld or tablet; we simply
    take advantage of built-in software. The screen design is simple. On the left
    side are a few text fields to display the system date, which will be included
    in the description file, to allow the user to type a descriptive filename and
    allow the user to type a brief description of the photo. There are also buttons
    to save the image, update the description file (called archive.txt in the application''s
    code), and close the application. On the right side, there is a button to start
    the camera activity and an ImageView object to hold the newly snapped image. The
    screen is locked in horizontal position in the code. The XML file for the screen
    appears follows.


