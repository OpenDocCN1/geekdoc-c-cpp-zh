  md: '# Summary of Key Concepts


    The pattern of five question marks in the command line indicates values you can
    choose on your. For convenience sake, I use the same value in both sets of question
    marks. The value for the -alias field is sensitive, so be careful to make a note
    of which letters, if any, you capitalize.


    The -genkey switch simply creates a key. -v means verbose, and it allows the user
    to see the key in human-readable form. The -keystore switch allows you to determine
    the location for storing the key; it defaults to the user''s home directory. (See
    the previous note about naming the keystore file. Use .keystore as the extension.)
    The -alias switch secures your key. You will use this alias later to sign an app.
    The -keyalg switch specifies the encryption algorithm used for the key. RSA are
    the three last initials for the algorithm''s developers: Rivest, Shamir, and Alderman.
    The -validity switch specifies the number of days the key is good for. Subsequent
    versions of the application must be signed with the same signature key, or the
    Android operating system on the target device will not allow the update.


    Once you enter the keytool command at a terminal prompt, you will be asked several
    questions whose answers will be used to develop the key. Finally, you will be
    asked if the information is correct, and a file will be generated and stored in
    your home directory with the name you prescribed and the .keystore extension.


    # SUMMARY OF KEY CONCEPTS


    +   -The Java SDK Standard Edition (JSE), the Eclipse integrated development environment
    (IDE), and the Android software development toolkit (SDK) are all freely available
    for download on the Internet. There are plenty of configuration guides similar
    to the content of this chapter available on the Internet as well.


    +   -New revisions and releases of these three key components of the Android development
    environment appear constantly, as do new versions of the Android operating system
    for the Android devices. When you do your initial configuration of your development
    environment, be sure to select the latest stable versions of all components.


    +   -Using an actual Android device wired to the development platform is preferable
    to using an emulator. As stated in the chapter, this will likely require the installation
    of an additional driver for each device you attempt to connect. Even after you
    install a driver successfully, Eclipse will not recognize some devices. In this
    case, you may simply have to resort to using an emulator.'
  merge: -1
