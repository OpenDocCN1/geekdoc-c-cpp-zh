    # CONFIGURING THE TEST SURFACE


    Developing for a tablet device has a couple of minor difficulties to overcome
    compared to developing for a handset. First, when you cross into Android 3.0 and
    Android 4.0, you are demanding more resources from your development environment.
    Once you have your development machine upgraded with the latest Android SDK, you
    will notice that Eclipse takes a little longer to load and configure itself. You
    will probably notice that the start-up configuration progress is reported in the
    lower-right corner of the Eclipse screen, and you can see the different versions
    of Android being loaded and reported. Because you only start Eclipse once per
    session, this is a minor annoyance. Second, when you begin to develop applications
    for 3.0 and eventually 4.0, the emulators take much longer to load. Try to avoid
    closing the emulator during a session (if you are in fact using an emulator; more
    about this later); I prefer to minimize between trial runs of an application project.
    Finally, you have to'
