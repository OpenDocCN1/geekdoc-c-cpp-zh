  md: '# Configuring the Test Surface


    manage the size of the emulator on the screen. Because you will want to use a
    tablet emulator rather than a handset, be prepared to have the emulator cover
    most of the screen.


    As a point of reference to the reader, I have developed two machines: a laptop
    with a 2.5 gigahertz (GHz) Core i5 processor, Windows 7, and 4 gigabytes (GB)
    of RAM, and a desktop machine with a 2.8 GHz Athlon processor with 2 GB of RAM,
    also running Windows 7. I configured an emulator for Android 3.2, 9 megabytes
    (MB) SD card, and WGA skin (which is the default).


    On the laptop, this emulator takes about 60 seconds to load, and the built-in
    apps are essentially unresponsive. On the desktop machine, the same emulator takes
    about 3 minutes to load, and the response from the built-in apps is about the
    same. The emulator defaults to a horizontal tablet configuration and takes most
    of the screen. In fact, I find it useful to move the Windows toolbar from the
    bottom of the screen to the left so it doesn''t overlap with the emulator. Another
    tip to start the emulator is to open it from the AVD Manager under the Windows
    menu in Eclipse. Once it''s open, choose the emulator you want to use (if you
    have more than one), and click the Start button on the right. You will see a dialog
    box, check in Figure 1.5, that lets you reset the emulator if you simply started
    the emulator from the Eclipse Java screen.) Check the Scale Display to Real Size
    check box size you want. Finally, click the Launch button at the bottom. Once
    the emulator starts, minimize it and go back to your code. Although this will
    take care of the size difficulties, it doesn''t really do anything for the load
    speed and responsiveness of the emulator.


    A desirable alternative to using an emulator is to connect an actual device to
    the development machine—preferably the device you are developing for if you are
    fortunate enough to be developing for a single deployment platform and you are
    able to get your hands on one. Aside from the obvious advantage of not having
    to wait for an emulator to "boot up," using an actual device gives you an additional
    screen. With your app running on an attached device, you will have 100 percent
    of your development computer’s screen to yourself. There will be no need to shuffle
    between Eclipse, or whichever IDE you are using, and the emulator.


    I am using two devices to write this book: the Galaxy Player 5 by Samsung, and
    the Thrive 10-inch tablet by Toshiba. The former is running Android 2.3.5 Gingerbread,
    and the latter is running Android 3.2.1 Honeycomb. The Galaxy Player connects
    to the development machine via a micro-USB/USB cable, which is part of its charger
    hardware (the cord separates from the wall-socket plug), and the Thrive tablet
    connects with a mini-USB/USB cable through a port in the side. I chose the Thrive'
