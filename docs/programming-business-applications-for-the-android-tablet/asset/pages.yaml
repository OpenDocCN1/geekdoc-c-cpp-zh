  md: 'Eclipse creates one TextView and puts it center on the screen using the android:layout_centerHorizontal
    and android:layout_centerVertical attributes. I have added to it an android:background
    attribute to give it a shade of gray for a color, and I have removed the predefined
    text. I have also set the android:width attribute to 400dp. The specification
    dp stands for device-independent pixel (dip could also be used), which is an abstract
    unit based on the density of a given screen. It is based on a 160-pixel screen
    and adjusts accordingly. If you use px as your unit, your dimension is based on
    the actual pixel density of the deployed device''s screen. There is plenty of
    documentation on writing applications that are to run on devices with varying
