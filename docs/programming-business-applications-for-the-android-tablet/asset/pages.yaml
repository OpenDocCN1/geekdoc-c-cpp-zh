    a scanning application is one of the simpler tasks. That’s because instead of
    building a complete application from scratch, we can build around available tools.


    The first step is to install the scanning application from the Zebra Crossing
    website and install it on the target device or devices. Look for the APK file
    in the Downloads section. You can also find it free of charge at the Google Play
    Store. If you have had some experience with Android application programming or
    if you read my first book, Android Application Development for Java Programmers,
    or a similar text, you might know something about starting other activities or
    applications through intents. An intent, which is actually implemented as a class
    called Intent, enables communication on the device between applications at run-time.
    We can use this vehicle to provide communication between a specific-purpose application
    written by a programmer and the application downloaded from the Google website
    named earlier.'
