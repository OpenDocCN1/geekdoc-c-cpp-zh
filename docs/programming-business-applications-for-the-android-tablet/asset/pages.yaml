  md: '# CHAPTER 3


    # DATABASES IN THE APPLICATION


    # BUNDLING A DATABASE


    Chances are that any business application has some kind of database. It may be
    as simple as a single table used as a look-up such as a member list, contact list,
    or parts list, or it can be as complex as a multitable relational database that
    is at the heart of the application. Android uses the SQLite database management
    system as its onboard database. Because of the obvious hardware constraints in
    a mobile device, say, SQLite is limited and not as versatile and sophisticated
    as, say, Microsoft Access or even MySQL, Some features found in other databases
    are views, triggers, and stored procedures; furthermore, only left joins are supported.
    On the other hand, SQLite is reasonably easy to implement in an application and
    can exchange data with other databases through downloadable drivers.


    SQLite is part of the Android application development kit; therefore, no extra
    download is necessary for the developer, and no additional libraries or external
    JARs to be included when the application is being developed. Construction and
    maintenance of the SQLite database can be done as the application is used, just
    as a person adds, edits, and deletes people from her contact list on her smartphone.
    An alternative is the database being predefined in the application and being updated
    through downloads to the device. Finally, the database can be bundled with the
    application when it is delivered to the end user. It is often recommended that
    you bundle an initial data set with an app, even if you can download a newer one
    on first run. This allows tables without cellular connections to run the app even
    if it is disconnected from the Internet the first time the application is loaded.'
  merge: -1
