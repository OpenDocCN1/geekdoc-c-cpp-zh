  md: "Although the XML document must be formed perfectly, the burden for the layout\
    \ is managed by the classes that are in the application's packages. The programmer\
    \ is responsible for assembling its content correctly if the data is going out\
    \ in XML format, or interpreting the content correctly if the data is coming in.\n\
    \nThe first application we will look at a simple one that uses a PHP script on\
    \ the server side to send an XML listing of member information based on the submission\
    \ of an email address. You will recall from our exercise in Chapter 3 that we\
    \ built an internal database and screen that we could use to maintain a club membership,\
    \ and we used the email address as our unique identifier. On the device side,\
    \ we will use the basic screen layout from that application, but we will change\
    \ the mechanics in the program to poll a remote server for the member data based\
    \ on submission of the unique identifier. Because we are concentrating on the\
    \ device side of this \"client-server\" application, the server side will \"simulate\"\
    \ the database search and return a set of fixed values in response to the submission\
    \ of any email address. In fact, we can use the same PHP server-side script for\
    \ the upcoming JSON version of the application. The server-side PHP script follows.\n\
    \n```\n// static data used in response\n$response_data = array(\n    \"firstname\"\
    =>\"John\",\n    \"lastname\"=>\"Doe\",\n    \"address\"=>\"101 Main Street\"\
    ,\n    \"city\"=>\"Springfield\",\n    \"state\"=>\"MA\",\n    \"zip\"=>\"12345\"\
    ,\n    \"phone\"=>\"5508-867-5309\",\n);\n\nif ($_REQUEST[\"encoding\"] == \"\
    json\") {\n    echo json_encode($response_data); // requires PHP 5.2 or above\n\
    } else {\n    $xml = new SimpleXMLElement('<person/>');\n    foreach ($response_data\
    \ as $key=>$value) // loop over all elements, add to SimpleXML object\n      \
    \  $xml->addChild($key, $value);\n    }\n    echo $xml->asXML();\n}\n?\n```"
