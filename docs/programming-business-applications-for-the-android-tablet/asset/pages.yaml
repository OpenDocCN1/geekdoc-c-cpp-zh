  md: '# SUMMARY OF KEY CONCEPTS


    +   The ability to use applications included on the Android device, some applications
    subsequently installed, and content providers available on the Android device
    allow the applications programmer to provide enhancements to applications without
    coding from scratch.


    +   The camera built into current Android devices provides a useful and valuable
    source of data for applications, both for scanning bar codes and QR codes and
    taking photographs for specific purposes.


    +   Google provides utilities under the Apache license for applications programmers.
    These utilities can be used to scan, interpret, and even produce one- and two-dimensional
    codes under the name ZXing, pronounced “Zebra Crossing.” The main website for
    ZXing is http://code.google.com/p/zxing/


