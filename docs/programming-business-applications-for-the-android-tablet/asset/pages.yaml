  md: '# SUMMARY OF KEY CONCEPTS


    The large screen size of a tablet device allows the developer to create a rich
    and dense user interface while allowing room for the onscreen keyboard. Although
    this book concentrates on choosing and locking either portrait or landscape orientation,
    the application developer can design a screen that adapts to environment at run-time.


    The developer can configure screen controls or widgets on the screen in the XML
    file at design time or add and remove them from the screen at run-time. Using
    fragments discussed in Chapter 2, "Migrating to Android 3.0 and Above," the developer
    can swap large blocks of screen controls in and out of the application.


    The application developer can subclass widgets such as the EditText to include
    error checking and validation and then reuse these in a single application or
    across many applications. Likewise, a developer can subclass the TextView widget
    to display a graphical representation of data. Using bars, lines, or dots in virtually
    any number and color can provide a pleasant and informative user experience.


    The SimpleAdapter, ArrayList, and HashMap classes are essential to presenting
    data in a pleasing fashion to the user. Study these classes and practice them
    by modifying the examples shown in the chapter.


