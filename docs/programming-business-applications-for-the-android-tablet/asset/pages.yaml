  md: "# Chapter 7    Using External Data\n\nJust briefly,ensible Markup Language,\
    \ is visibly similar to HTML (Hypertext Markup Language). However, while XML uses\
    \ a system of opening and closing tags to define elements like HTML, XML element\
    \ names and structures are defined by the programmer. XML is versatile; just about\
    \ any structured data—records from a relational database, a document, an email,\
    \ and even a vector graphic—can be structured in XML. However, to serve as a universal\
    \ data transfer structure whose content is expected to be read by any program\
    \ code to anticipate a certain structure, the XML data must be correctly structured\
    \ according to the specifications. In other words, the document must be \"well\
    \ formed.\" A document consists of a prologue and a single root element. The root\
    \ element has an opening and a closing tag. Each logical record has an opening\
    \ and a closing tag, and there can be multiples of these pairs inside the root\
    \ element. Tag pairs cannot overlap, though. Inside the logical record's tags,\
    \ the logical fields are defined as elements with their own opening and closing\
    \ tag pairs with the actual data placed between the tags. The data is all text\
    \ and numeric values needed to be converted on the receiving side. For fields\
    \ having composite data, such as a name field with separate entries for first\
    \ and last, \"nested\" elements can be used. Comments also can be included, using\
    \ an XML-defined syntax.\n\nWhat follows is a sample of an XML file.\n\n```\n\
    <?xml version=\"1.0\"?>\n\n<person>\n  <name>\n    <first>Jim</first>\n    <last>Sheusi</last>\n\
    \  </name>\n  <occupation>College Professor</occupation>\n  <position>Dept. Chair</position>\n\
    </person>\n```\n\n```\nprolog\nspace left on purpose\nbegin root element\nend\
    \ root element\n```\n\nComments are enclosed with the following tag pair:\n\n\
    ```\n<!-- -->\n```\n\nAttributes, which provide additional information about a\
    \ particular element aside from its actual data, are presented as a name-value\
    \ pair with the value enclosed in double quotation marks or single quotation marks\
    \ and included in the opening tag. For example\n\n```\n<book binding=\"paperback\"\
    >The Title</book>\n```\n\nOf course, XML should come as no surprise to an Android\
    \ programmer because screen layouts and manifest files are laid out in XML format."
