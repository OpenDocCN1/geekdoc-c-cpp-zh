    The next example is probably a little more useful. This time we will subclass
    an EditText widget and add code to validate the data entry. For the sake of demonstration,
    let''s assume that we have a numeric field for which monetary values must be entered
    in increments of .25. The easiest thing we can do is specify the keypad for this
    field; we will use a numeric keypad to discourage entry of alpha characters. Next,
    we can look for a decimal point. If none is found, we can assume that a whole
    number was entered, as 15. In that case, we will add .00 and make it 15.00. Then
    we will multiply by 100 to convert to whole cents. Finally, we can use the modulus
    operator and check for a zero remainder. If we get zero, the value entered is
    valid. If we don''t get zero, we will pop up a notice that the number entered
    was an invalid entry and return the cursor to that field. It''s not perfect, but
    it''s good enough for demonstration purposes.'
