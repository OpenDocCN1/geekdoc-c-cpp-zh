  md: '# The Action Bar


    The Action Bar is similar to the menu on a desktop application, but it''s not
    identical. One might say the Action Bar is better because a selection on the Action
    Bar can bring a drop-down list as a typical menu bar, or it can bring up a built-service
    or another activity. Because many devices that support Android 3.0 now and in
    the future will not have the hardware button, developers at Android recommend
    that applications developers begin to migrate away from the traditional options
    menu to the Action Bar. For instance, my own Toshiba Thrive tablet does not have
    hardware buttons.


    You can easily upgrade current applications designed for older devices. Applications
    designed for new devices are backward compatible for the most part. You will read
    about some examples of how to accomplish this in code.


    To maintain compatibility for legacy applications, you may want to run on multiple
    platforms; devices running 3.0 and up that have no hardware buttons display a
    screen image of the old hardware buttons, such as the Back button and the Home
    button, as well as an added button image that displays a column of thumbnail-sized
    screens representing the recently run applications when selected. See Figure 2.11.


    These buttons can become “ghosted” at times to allow a more pleasant user experience,
    such as while a video is running the full screen. For example, if a user is watching
