  md: '# CHAPTER 1


    # INSTALLING ECLIPSE, JAVA,

    THE ANDROID SDK


    Because you have chosen this book, chances are that you are already developing
    or at least have attempted to develop some Android applications, and most likely
    for a handset set such as a smart phone or small Android device such as the Galaxy
    Player 5 by Samsung. Android tablets are relatively new to the market, and most
    of them are running Android 3.x or higher. The primary purpose of the book is
    to develop tablet applications, so you may want to upgrade your development environment
    to be sure you can take advantage of the latest features. On the other hand, if
    you are starting from scratch, you need to download the Java software development
    toolkit (SDK), and the Android SDK. Eclipse the integrated development environment
    (IDE), is available from www.eclipse.org, the Java development toolkit (JDK) is
    available from www.oracle.com/technet/java/javase/downloads/index.html, and the
    Android SDK is available from http://developer.android.com/sdk/index.html. All
    the sites include comprehensive documentation and installation guidelines, I am
    including some basics and tips here.


    It is better to download and install the JDK first. The current version at the
    time of this writing is version 7. After it installs, you will want to set its
    location in your computer system’s PATH variable. You can consult references on
    how to do this on the Internet, but if you are using Windows 7 as I am, you can
    use the following steps.


    +   1. Click the Start button, right-click on Computer on the right side of the
    Start menu, and choose Properties. You see a new window; the left side looks like
    Figure 1.1.'
  merge: -1
