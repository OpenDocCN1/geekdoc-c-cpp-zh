    The last graphic application we will look at the chart in this chapter is one
    that collects user input for a Pareto Chart and then displays the chart as a subclass
    of the TextView widget. If you are not familiar with the Pareto Chart, there is
    plenty of information on the Internet about what it is and how to construct one
    using Microsoft Excel. In a nutshell, a Pareto Chart is a graphic display of the
    causes of a given problem whose frequencies are represented by a vertical bar
    chart, with its cumulative percentages superimposed as a line chart. It''s like
    the 80-20 rule it is based on, which says that if you concentrate on the handful
    of causes that compose 80 percent of the total, you can make the greatest impact
    on quality for the least investment of time and resources. The application collects
    a table of cause-and-frequency combinations in an EditText field, reorders them
    by frequency, computes individual and accumulating frequencies, and then constructs
    and displays the chart. This time the TextView object doesn''t need a listener,
    but it requires lot of manual coding to construct the graph.


    ![](img/cbb97d4daaabf800d0384cb0ef181aa8_135_0.png)


    Figure 4.5

    Application in emulator displaying SignatureView class.

    Source: The Eclipse Foundation.'
