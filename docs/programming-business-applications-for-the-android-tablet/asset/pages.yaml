  md: '# Installing Eclipse, Java, and the Android SDK


    ![](img/cbb97d4daaabf800d0384cb0ef181aa8_20_0.png)


    Figure 1.2

    Advanced System Settings window.


    Source: Microsoft® Corporation.


    directory, for the pretty line similar to the following: c:\program files\java\jdk1.6.0_24\bin\.exe.
    You can check this by using a command prompt or the file manager on your development
    system. Move to the Program Files folder (directory) and look for an entry called
    Java. In that folder, check for the entry-beginning with jdk; this is the folder
    you want to put in the path following the example. There will likely be another
    folder whose name starts with jre; don''t use this one.


    +   Finally, click OK and work your way out of the windows.


    The next piece of your development system to install is Eclipse. The Eclipse website
    offers extensive documentation to help you with the install, but it is pretty
    straightforward. What can be confusing, however, is the number and variety of
    Eclipse versions. The current version of the Android SDK requires Eclipse Helios
    or later. The versions have nicknames that run in alphabetical order, newer than
    Helios, would work as well. For more details on which Eclipse version is appropriate,
    you can look at http://developer.'
  merge: -1
