  md: '# Chapter 1 Installing Eclipse, Java, and the Android SDK


    ![](img/cbb97d4daaabf800d0384cb0ef181aa8_21_0.png)


    Figure 1.3 Environment Variables window.


    Source: Microsoft® Corporation.


    android.com/sdk/requirements.html. The Eclipse installation in this book should
    use the system''s PATH variable to find the JDK. The examples in this book were
    created with Helios.


    If you can start Eclipse, select the New menu and choose Project, and see Java
    Project as a choice, so far good. If that doesn''t happen for you, go back and
    check documentation for the Eclipse and Java installations. All above, be patient.


    Finally, we can begin to install the Android SDK. There are actually two steps
    to configure Eclipse. First you need the toolkit, and then you need to configure
    Eclipse. You can download the SDK at http://developer.android.com/sdk. Once you
    have installed, you need to make another change to your PATH environment variable
