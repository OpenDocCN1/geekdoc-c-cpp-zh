  md: '# programming business applications for the android tablet


    Not only have tablet computing devices captured a wide swath of the consumer electronics
    market, they are finding a warm welcome in many businesses, where portability,
    connectivity, and utility are keys. As the Android tablet''s presence expands,
    businesses are hungry for applications that address their needs and problems.
    In Programming Business Applications for the Tablet, James C. Sheusi provides
    a quick start for prototyping applications on the mobile platform for the business
    applications—focusing on such common business applications as database management,
    web-based user interfaces, and graphic representation of data. With step-by-step
    instruction and plenty of examples, the book includes:


    +   * A guide to installing and configuring an Android development environment—and
    an Android device emulator—on your personal computer


    +   * All the code necessary to create several simple applications demonstrating
    the capabilities of an Android mobile device


    +   * Full explanations of the methodologies used in the examples


    +   * Exercises and recommendations for further study


    Programming Business Applications for the Android Tablet is the perfect guide
