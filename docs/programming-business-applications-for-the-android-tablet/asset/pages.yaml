- img_proc: true
  md: '# Chapter 7 Using External Data


    text stream. Also, groups of data embedded in other groups of data, such as line
    items on an invoice, can cause problems when they are being parsed at the receiving
    end. A more robust format for transferring text data is desirable.


    +   - JSON, or JavaScript Object Notation, is one such format. In this format,
    data is sent in group key-value pairs called objects. Similar objects can be combined
    in a series called arrays. Although relatively few formatting characters are necessary
    (overhead), the strict formatting rules making parsing at the receiving end reliable.


    +   - XML, or Extensible Markup Language, is another such format. Instead of using
    punctuated key-value pairs as JSON uses, the keys are presented as tags surrounding
    the data values. Like JSON, the strict formatting rules at the sending ensure
    accurate translation at the receiving end.


    +   - Because of their reliability, both formats are widely accepted standards
    for data transmittal. Therefore, the ability to use these formats enables the
    applications programmer to take advantage of data from a range of sources outside
    the enterprise, such as public-access databases, RSS feeds, social media sites,
    and government sources.


    +   - Packages are available from a variety of sources that can be used to parse
    and assemble data in these formats that the applications programmer can add to
    an application.


    # REVIEW QUESTIONS


    You can find the answers to these review questions in the appendix at the end
    of the book.


    +   1. The acronym CSV stands for ____________________.


    +   2. The outermost element in an XML document is called the element.


    +   3. Data included in the opening tag of an XML element is called ____________________.


    +   4. JSON is an acronym that stands for ____________________.


    +   5. JSON presents individual data items in pairs ____________________.


    +   6. An advantage of the JSON format over XML is that it requires fewer or lower
    ____________________.'
