  md: '# Chapter 9 Deployment and Versioning


    If you choose the latter, you will use the jarsigner application to sign your
    APK file with your key. jarsigner is located in the same directory as the keystore
    program. Note that the keystore''s filename, myandroid, and the application''s
    name, myApplicationName, are just examples. You would use the keystore name you
    specified when you created the key according to the guide in Chapter 1. The application
    name, of course, refers to the name you gave in your.


    ```

    jarsigner -verbose -keystore <path>/myandroid.keystore <path>/myApplicationName.apk
    myandroid (enter)

    ```


    You will be prompted for the password to create the key (hopefully saved it),
    and you will receive several confirmations that components of your application
    are being signed. We use the -verbose switch in the command line to receive these
    confirmations; they are a visible verification that the signing is taking place.


    You can learn about the keytool, its sister utility, jarsigner, and the switches
    that go with them at http://download.oracle.com/java/1.5/0/docs/tooldocs/keytool.html.


    You may have noticed that when you created the APK file, Eclipse warned you that
    you still need to install and align it. The zipalign process aids in the installation
    of the APK file to a device. The zipalign tool is part of the Android APK. It
    is in the /platform-tools subdirectory of the android-sdk directory. A typical
    command-line string using zipalign follows.


    ```

    zipalign -v 4 <sourcename>.apk <path>/targetname.apk (enter)

    ```


    The sourcename represents your signed APK file, and the targetname.apk is the
    name of your signed and zaligned APK file. Note that these names should be different,
    or the target file should be in a different directory. Also, be sure to add the
    APK extension to these entries, because it isn''t automatic.


    Your application should now be ready. If you later upgrade or modify your application,
    you will need to perform these steps again.


    Although it''s not directly related to preparing the application for deployment,
    there are some points you should consider for maintaining your application''s
    domain. You should be fortunate enough to have control over the devices that will
    run your applications, here are some tips for securing your environment.


    The first is keeping the devices you up to date with the latest operating system
    (OS) versions. For development sake, this will allow you to narrow your range
    of SDK versions as we discussed at the beginning of the chapter, and it will give
    you a'
  merge: -1
  pgno: 275
- img_proc: true
  md: 'better idea of how your application will appear and behave in the field. It
    will also reduce risks to security.


    Another step to take is to ensure that the devices under your control have and
    use screen-locking, and that they are encrypted. Figure 9.2 shows the Security
    panel under Settings on your Toshiba Thrive. Visible are choices to lock the screen
    and encrypt the entire device.


    ![](img/cbb97d4daaabf800d0384cb0ef181aa8_276_0.png)


    Figure 9.2

    Security settings on the Toshiba Thrive tablet.

    Source: Google.


    Still another security precaution is remote-wipe. This feature wipes out data
    remotely should the device fall into the wrong hands. Along these lines, you might
    consider installing a GPS tracking application, or one that detects when a device
    joins the Internet. Third-party anti-virus software is just as important for mobile
    devices as it is for desktop and laptop PCs and should be deployed on handheld
    devices.


    It is recommended that device administrators turn off carrier backups while implementing
    their own backup policy and schedule.


    Finally, to the extent possible, try to control the installation of applications
    from the open market. Malware is a threat to internal networks as long as handheld
    devices have access to it.'
