    # CONNECTION-ORIENTED CLIENT-SERVER APPLICATIONS


    Sometimes an enterprise application may include running server applications to
    support devices in the field. Instances include returning data based on a query
    to an enterprise database and posting data from the device to an enterprise database.
    Connected-oriented communications are also useful when data has to travel back
    and forth between the device and the server, connecting with the server-side applications
    to accomplish a useful purpose.


    Connection-oriented network communications are conducted with the establishment
    of a socket between the device and the server, consisting of an IP address and
    a port number. The port numbers used by in-house applications are normally in
    the range from 49152 to 65535. The port number is set on the server-side application,
    so the client application must know the appropriate port number at design time
    or at least be able to set it at run-time.


    Design of connection-oriented applications for the Android device is relatively
    simple and uses the java.net package classes. The bulk of the work generally falls
    on the server-side application, because this is where the custom processing normally
    takes place. Applications on the server-side can be written in any number of languages,'
