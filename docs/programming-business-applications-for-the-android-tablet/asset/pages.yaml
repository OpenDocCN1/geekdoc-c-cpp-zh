    # SUMMARY OF KEY CONCEPTS


    SQLite is the database management system employed by Android devices. Information
    on SQLite can be found at www.sqlite.org. You should review this website, especially
    the documentation and support areas.


    A successful data-based application depends on a clear understanding of database
    design, data types, relations, and SQL. Although the examples in this chapter
    involve a single table of simple design for illustrative purposes, in reality
    it is likely that the data maintained will be much more complicated. You would
    do well to look at outside resources covering relational database design and SQL.
    A place to start is at www.w3schools.com/sql.


    Open Database Connectivity (ODBC) is middleware used by an operating system for
    accessing database management systems (DBMS). You can find information on ODBC
    for Windows 7 at http://www.microsoft.com/en-us/windows7/Using-the-ODBC-Data-Source-Administrator.
    You should review this website for help configuring SQLite on the development
    machine if necessary.


    The SimpleAdapter, ArrayList, and HashMap classes are essential to presenting
    data in a pleasing fashion to the user. Study these classes, and practice them
    by making modifications to the examples shown in this chapter.


    # REVIEW QUESTIONS


    You can find the answers to these review questions in the appendix at the end
    of the book.


