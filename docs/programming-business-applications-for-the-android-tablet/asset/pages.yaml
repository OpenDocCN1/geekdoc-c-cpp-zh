  md: '# INTRODUCTION


    I have to admit that when I first saw the Apple iPad early in 2010, I thought,
    “Who would have the need for a giant iPhone...with no phone service!” In other
    words, all I saw was a giant iPod Touch. I am not an audiophile; I have no music
    on either my smart phone or my tablet devices (I have three), and I am not a particular
    fan of social networks or games, so I didn''t see much in it for me. But after
    using an iPad for a few minutes, I discovered a feature that changed my whole
    opinion of the device: if I turned the tablet landscape, I could just touch-type
    on it! Indeed, the keyboard was the same size as the keyboard on my HP—mini netbook.
    A keyboard was something I could relate to. In fact, this was the biggest shortcoming
    to smart phones like the iPhone in my opinion. With a usable keyboard, I could
    comfortably use the device for emailing or taking notes. I had to admit that the
    iPad was worth another look.


    The sheer size of the device combined with WiFi would allow opportunities for
    teleconference, giving an enjoyable Internet experience, and offer an electronic
    reader platform that would rival devices such as the Amazon Kindle. And much as
    I hate to mention games, the iPad made a better game platform than the smart phone.
    Like millions of others, I bought and became hooked on my iPad, but I missed my
    own applications.


    Years before the release of the Apple iPod Touch, I began writing applications
    for the small platform with J2ME (2 Platform, Micro Edition) on Palm devices.
    As an avid Java programmer (and a Sun-Certified programmer for Java 2), I quickly
    found a new application target when the Android-powered mobile phones hit the
    market.'
  merge: -1
  pgno: 11
- img_proc: true
  md: '# Introduction


    I put my first application on the Android market early in 2011, before I even
    owned an Android device. I was happy to be able to use Java to create applications
    for platforms other than the desktop, just for the challenge of it. Mobility,
    combined with WiFi, cell communications, and GPS service widened the range of
    opportunities for new and interesting applications for handheld devices.


    When Android tablets began to hit the market in 2011, all the advantages of size
    that I enjoyed with the iPad combined with the ability to use Java to write applications.
    I turned my attention toward developing useful applications for the Android-powered
    tablet devices.


    The parallel evolution of cloud-based computing is providing a virtually unlimited
    source of back-end computing for tablet devices. Large-scale applications and
    data no longer had to be stored on the device, which allows the tablet to serve
    as an "ultra-thin client." Nearly ubiquitous connectivity coupled with a truly
    manageable platform makes the mobile enterprise concept a reality. The only thing
    that needs to catch up to the possibilities is the app developer''s imagination.


    There isn''t a single IT publication that hasn''t spent a significant amount of
    time and space on mobile computing. In May 2011, Riva Lesonsky posted an article
    on Networksolutions.com called "Tablet Computing Trends in Business." She made
    several observations worth noting. The first was that tablets (at the time, the
    iPad was essentially the only choice on the market) were cutting into the usage
    of traditional platforms as desktop machines and laptops. Thirty-five percent
    of Nielsen survey respondents stated that since getting a tablet, they use their
    other computers less often or not at all. Second, Lesonsky called a Gartner report
    that predicted that the iPad would dominate the tablet market through 2015, but
    in the same period predicted Android''s market share would rise to 39 percent.
    Ten months later, the market research firm International Data Corporation (IDC)
    predicted that Android-powered tablets would overtake the iPad by 2015. Finally,
    Lesonsky observed iPads being used to take orders and print receipts in a restaurant.


    The term BYOD (bring your own device), a phrase that no one even used a couple
    of years ago, has become a hot IT topic. Big industry players such as IBM and
    Unisys, as well as leading publications such as Networkworld, Computerworld, and
    Network Computing, have weighed in on the topic of managing the BYOD phenomenon.
    Combined, the iPad and the various Android-powered tablets easily dominate the
    tablet market share. The May 21, 2012, edition of NetworkWorld magazine carried
    an debating iOS versus Android use in business. On the Android side, Dennis Baliton
    credited Android''s open-source nature and the large pool of developers who promotes,
    the large number of current Java programmers that already exists who can'
  merge: -1
  pgno: 12
- img_proc: true
  md: '# Introduction


    easily migrate to Android development, and the vast array of preexisting Java
    libraries that are used in Android app development. At print time, those who favored
    Android 55 percent, with 45 percent favoring iOS.


    In a paper by Gartner in January 2012, author Stephen Kleyns coined the phrase
    personal cloud, using it to describe how we are moving away from a hardware-centered
    view of technology toward using our favorite devices to channel the world’s resources.
    Connectivity allows us to leave big jobs to big computers and big applications,
    while tiny low-cost or no-cost apps on one’s favorite mobile device can manage
    everyday needs. A more tech-savvy population coupled with consumer-target virtual
    storage and services allows tiny devices to on big tasks.


    Let’s not technological advances in hardware that today’s smartphones and tablets
    bring to the consumer. The touch screen itself is certainly not new technology,
    but its application-to-consumer devices have never been so pervasive. A tablet
    or smart phone eliminates the need for a keyboard and mouse. Voice recognition
    technology along for years as an added feature but finds its niche on a handheld
    device as an ideal input option. Finally, the camera on most devices provides
    an input channel that has the potential to eliminate an immeasurable number of
    keystrokes when the right application utilizes it. All of these advanced input/output
    (I/O) features say nothing of the amazing processing power and storage capability
    of modern mobile devices compared to what personal computers offered not very
    long ago.


    Whether you prefer the iOS or Android is irrelevant to the fact that tablet computing
    is becoming a popular alternative in the world of business computing. Consider
    the tablet device as a paper saver. Instead of receiving pages of briefing materials
    ahead of a meeting, which you can prepare by reading them on a tablet. You can
    make changes and redistribute them instantly without Reprint. Not only are printing
    costs eliminated, but the whole distribution system can be sped up and decentralized.
    In the warehouse, the device’s camera can scan barcodes to reveal information
    about particular items. A connection to a central database, and an employee filling
    orders can instantly update inventory information. With GPS capability, information
    can be not only time sensitive, but location sensitive. This offers a whole new
    dimension to information management. The possibilities for tablet apps are limited
    to the needs and the imagination of the developer. And that brings us to the purpose
    of this book.'
  merge: -1
  pgno: 13
- img_proc: true
  md: 'My purpose in writing this book is to help the IT worker or entrepreneur who
    sees an opportunity for a business app but may need some insight into the mechanics
    of Android application development. I take 25 years of industry experience along
    with Java and database experience and build some simple business solutions, illustrating
    the code necessary to produce the app and apply the principles. The examples are
    heavily database laden and mix in some of the improvements brought by Android
    3.x and 4.x. I also make suggestions on user interface optimization and take advantage
    of some of the features on a typical Android tablet, including the camera and
    WiFi connectivity. For each feature or topic covered, I supply code for a fully
    functional sample application. In the sample applications, I point out some simple
    tricks for you to use, such as restricting the display to portrait or landscape
    orientation and using toast messages where appropriate. I cover more advanced
    operations such as threads, fragments, and data-binding. My intent is not to present
    cutting-edge techniques, to save you hours of research that might otherwise be
    needed to assemble an application. You will not find animation techniques, application
    of the accelerometer, or other things that may interest game developers. However,
    you will find use of graphics as a visual interpretation of data, as well as retrieval
    of GPS information from the device.



    It is my hope that you will see how you can solve a problem or take advantage
    of an opportunity by customizing some of the examples to suit yourself. Feel free
    to use them as they are; I place no restrictions on the content. Where appropriate,
    I cite a source or point out some useful resources relevant to the topic at hand.
    Most examples are intended for the tablet platform but allow for any limitation
    caused by a minimum version of Android that might be required to use a particular
    feature; all would run on a handheld device as well.


    May you find ways to free your target application audience from their PCs and
    laptop computers and help them find new uses for their mobile devices. Good luck,
    and happy coding.


    # CONVENTIONS Used in This Tutorial


    To make this book easier to read, special conventions are employed throughout.


    Italic is used to indicate new terms.


    Monospace type is used to indicate blocks of code, commands to be entered at a
    terminal screen, messages, menu paths, switches, controls, file and directory
    names, parameters, objects, classes, tags, methods, variables, and widgets.'
  merge: -1
  pgno: 14
- img_proc: true
  md: '# Introduction


    # WHAT YOU''LL FIND IN THIS BOOK


    Here''s what you''ll find throughout the pages of this book:


    +   * A guide to installing and configuring an Android development environment
    on your personal computer.

    * A guide to configuring an Android device emulator on your personal computer
    and illustrations of running applications on the emulator.

    * All the code necessary to create several simple applications to demonstrate
    the capabilities of an Android mobile device.

    * A guide to publishing an Android mobile application.

    * Explanations of the methodologies used in the examples, as well as descriptions
    of the classes and their methods used in the examples.

    * Follow-up exercises and recommendations for further study as well as many outside
    references for clarification of principles and techniques used in the book.


    # WHO THIS BOOK IS FOR


    I intend this book for on-staff, consulting, or freelancing programmers who are
    familiar with OOP, preferably in Java, and are interested or required to extend
    an enterprise''s information processing to the mobile arena. This book concentrates
    on topics that complement and augment the common business uses of technology,
    such as database management, web-based user interfaces, and graphic representation
    of data. This book provides a quick start to prototyping on the mobile platform
    for the business applications programmer.


    # HOW THIS BOOK IS ORGANIZED


    The book is organized in a logical, evolutionary manner starting with configuration
    of the development environment and ending with two comprehensive projects. The
    beginning chapters cover basic application components and configuration of the
    Android emulator and basic user interface design, whereas later chapters cover
    how to accomplish more involved areas such as use of GPS, graphics, networking,
    and databases. In most cases, you will find the following:


    +   * An introduction to the concept or technique to be covered

    * A description of the example application presented to demonstrate the concept

    * All the code necessary to produce a running application to demonstrate the chapter''s
    topic'
  merge: -1
  pgno: 15
