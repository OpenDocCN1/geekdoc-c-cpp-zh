  md: '# Building a Table at Run-Time


    ![](img/cbb97d4daaabf800d0384cb0ef181aa8_92_0.png)


    Figure 3.8

    Structured listing of zip codes with their cities and states on emulator.


    Source: The Eclipse Foundation.


    # BUILDING A TABLE AT RUN-TIME


    Often the database doesn''t have to be preloaded in the application; it can be
    built and incrementally as the application is used. For example, a business might
    deploy tables for employees to use in the field to take applications, collect
    survey data, conduct event registrations, and so on. Data, once collected, can
    be transmitted to a central collection point if necessary or downloaded once the
    worker returns to the main office. The framework of the database, the table names
    and their field descriptions and characteristics (metadata), is contained in the
    application''s coding, but the data is collected at run-time.


    Those familiar with database operations are familiar with the acronym CRUD, which
    stands for create, read, update, and delete—four main operations done on a data
    table. The SQLite''s classes have methods for these specific operations, with
    a built-in parameter list for each. For example, the SQLite class has one query()
    method that returns a Cursor object and requires seven specific arguments. The
    definition of the method is as follows:


    ```

    query(String table-name, String[] column-names, String selection-description,
    String[] selection-arguments, String group-by, String having..., String order-by).

    ```'
  merge: -1
