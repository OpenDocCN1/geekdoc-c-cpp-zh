  md: "# Goldilocks and the Three Bears\n\nOnce upon a time, there was a girl named\
    \ Goldilocks who liked to play in the woods One day as she was chasing butterflies\
    \ in the forest, she arrived at a small house. Goldilocks knocked on the door,\
    \ but no one was home. She smelled delicious food, so went inside. There were\
    \ three bowls of porridge on the table. She tasted the large bowl of porridge\
    \ and it was too hot. She tasted the medium sized of porridge, and it was too\
    \ cold. She tasted the small bowl of porridge, and it was just right. so she ate\
    \ the whole bowl!\n\n```\n#include <stdio.h>\nenum (FALSE, TRUE);\nenum size_e\
    \ {SMALL = 2, MEDIUM, LARGE};\n//Function prototypes\nvoid porridge_test(enum\
    \ size_e porridge_size);\nvoid chair_test(enum size_e chair_size, int person_weight);\n\
    void bed_test(enum size_e bed_size);\nvoid porridge_test(enum size_e porridge_size)\
    \ {\n    if (porridge_size == LARGE) {\n        printf(\"The large porridge is\
    \ too hot\\n\");\n    } else if (porridge_size == MEDIUM) {\n        printf(\"\
    The medium-sized porridge is too cold\\n\");\n    } else if (porridge_size ==\
    \ SMALL) {\n        printf(\"The small porridge is just right! I'll eat it.\\\
    n\");\n    }\n}\n```\n\nContinued...\n\nAn enum is a data type defined using the\
    \ enum keyword that assigns integer values to names. By default, the first name\
    \ is assigned values and each subsequent name is assigned one greater than the\
    \ previous name. In program, FALSE has a value of 0 and the next value TRUE has\
    \ a value of 1. Enums are typically capitalized to indicate they hold constant\
    \ values.\n\nThere are two enums defined in this program it is good practice to\
    \ use enums to group information together. An enum can be given a name like the\
    \ enum size_e in this program. By giving an enum name, you can create a variable\
    \ of type. The porridge_test parameter porridge_size is of type enum size_e, which\
    \ means porridge_size can only accept a value defined in the size_e enum.\n\n\
    Named values in an enum can be any integer value, but if not specified, the default\
    \ is to increment the previous value by 1. In this program, SMALL is assigned\
    \ a value of 2, MEDIUM is assigned 3 and LARGE is assigned 4.\n\n![](img/59c2bc7e23499c00f04d0ab71fe210db_45_0.png)"
