- pgno: 14
  md: "# Rain, Rain, Go Away\n\nRain, rain, go away\nCome again another day\nLittle\
    \ Johnny wants to play.\n\n```\n#include <stdio.h>\n#define RAIN 1\n#define NO_RAIN\
    \ 0\n\nint main(void) {\n    int weather = 1;\n    if (weather == RAIN) {\n  \
    \      printf(\"Rain, rain, go away\\n\");\n        printf(\"Come again another\
    \ day\\n\");\n        printf(\"Little Johnny wants to play.\\n\");\n    }\n  \
    \  return 0;\n}\n```\n\n#define allows a constant value to be represented by a\
    \ name in the code called macro. In this program, RAIN is a macro defined as the\
    \ value 1 and the macro NO_RAIN is defined as the value 0. RAIN is replaced by\
    \ 1 in main(). .define is called a preprocessor directive because the macro name\
    \ is replaced by its value in every place it appears in the program before it\
    \ is processed.\n\nThere is no semicolon at the end of #define line. Defining\
    \ a constant value with a meaningful name, the code is easy to read and you can\
    \ change the constant's value in a single place. It's common to use uppercase\
    \ names for macros to easily distinguish them from variables.\n\nIf statement\
    \ is a conditional statement that tests if a condition is true or false. An expression\
    \ is a piece of code that evaluates to a single value. The expression parentheses\
    \ if is the condition that is tested for true or false. If the statement's condition\
    \ is true, its code block within curly braces {} executed.\n\nIn the if statement's\
    \ condition (conditional expression),weather == RAIN, the double equal sign (=)\
    \ is an equality operator. This is a type of comparison (relational) operator,\
    \ which compares the relation between two values. The equality operator tests\
    \ if the value on the left side of the operator is equal to the value on the right\
    \ side of the operator. Sinceweather is a variable that stores the value and RAIN\
    \ is replaced by 1, the expression is true, so if the statement's condition is\
    \ true and its code block is executed.\n\nTheprintf() functions print:\nRain,\
    \ rain, go away\nCome again another day\nLittle Johnny wants to play."
  merge: -1
  img_proc: true
