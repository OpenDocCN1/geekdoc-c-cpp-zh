  md: "# One Potato, Two Potatoes\n\nOne potato, two potatoes,\nThree potatoes, four!\n\
    Five potatoes, six potatoes,\nSeven potatoes, more!\n\n```\n#include <stdio.h>\n\
    int main(void) {\n    int potato_count = 0;\n    for (int i = 0; i < 7; i++) {\n\
    \        potato_count = potato_count + 1;\n        if (potato_count == 1) {\n\
    \            printf(\"One potato\\n\");\n        } else if (potato_count == 4)\
    \ {\n            printf(\"four!\\n\");\n        } else {\n            printf(\"\
    %d potatoes\\n\", potato_count);\n        }\n    }\n    printf(\"more!\\n\");\n\
    \    return 0;\n}\n```\n\nA loop repeats a code block (with curly braces({}))\
    \ for a specified number of times. In this program, the loop repeats (iterates)\
    \ 7 times to count 7 potatoes. The loop's header, for(int i = 0; i < 7; i++),\
    \ declares i as an integer and initializes it to 0. Although the loop variable\
    \ can be any valid name, the i (representing \"index\") is commonly used in C\
    \ programming. Next, this process is followed:\n\n+   Step 1. The condition <\
    \ i < 7 is tested for true or false.\nStep 2. If the condition is true, the loop\
    \ code block is executed. If it's false, the code block is not executed and the\
    \ program continues jumping to the line of code after the loop.\nStep 3. After\
    \ the code block executes,i++ increases i by the increment operator++.\n\nSteps\
    \ 1 through3 are repeated until the condition i < 7 is false (when i = 7), at\
    \ which point the program exits the loop.\n\nIn the for-loop, the statement potatoes\
    \ = potatoes + 1 assigns the value of potatoes + 1 to potatoes, which increases\
    \ the potatoes value by 1 using the addition operator(+). Since the loop repeats\
    \ 7 times and potato_count was initialized to 0, the value of potato_count is\
    \ 7 when the loop is exited.\n\nThe if..else statement within the for loop code\
    \ block causes a particularprintf() statement to execute based on the potato_count\
    \ value."
