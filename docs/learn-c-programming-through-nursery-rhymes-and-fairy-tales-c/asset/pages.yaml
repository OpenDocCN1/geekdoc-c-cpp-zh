  md: "# This Little Piggy\n\nThis little piggy went to market.\nThis little piggy\
    \ stayed home,\nThis little piggy had roast beef.\nThis little piggy had none.\n\
    This little piggy went...\nWee, wee, wee,\nall the way home!\n\n```\n#include\
    \ <stdio.h>\nvoid piggy_activity(int piggy_number); //Function prototype\nint\
    \ main(void) {\n    for (int i = 1; i < 6; i++) {\n        piggy_activity(i);//Function\
    \ call\n    }\n    return 0;\n}\nvoid piggy_activity(int piggy_number) //Function\
    \ definition {\n    printf(\"This little piggy \");\n    switch (piggy_number)\
    \ {\n        case 1:\n            printf(\"went to market\\n\");\n           \
    \ break;\n        case 2:\n            printf(\"stayed home\\n\");\n         \
    \   break;\n        case 3:\n            printf(\"had roast beef\\n\");\n    \
    \        break;\n        case 4:\n            printf(\"had none\\n\");\n     \
    \       break;\n        case 5:\n            printf(\"went wee, wee, wee, all\
    \ the way home!\\n\");\n            break;\n        default:\n            printf(\"\
    doesn't exist\\n\");\n    }\n}\n```\n\nFor the for loop, the piggy_activity()\
    \ function is called with the current value of the loop variable as the argument\
    \ passed into the piggy_number parameter. This results in the program calling\
    \ piggy_activity() five times, each with a different argument from 1 to 5. In\
    \ the first iteration of the for loop, the function call is piggy_activity(1),\
    \ which starts at 1. In the last iteration of the for loop, the function call\
    \ is piggy_activity(5). The switch statement determines the output based on the\
    \ value of: piggy_number.\n\nWhen the first function is executed, This little\
    \ piggy went to market. When the last function is executed, This little piggy\
    \ went wee, wee, wee, all the way home is printed. If the piggy_number value does\
    \ not match a case value, This little piggy doesn't exist would be printed. This\
    \ does not happen in the program since the function is called with arguments from\
    \ 1 through 5."
