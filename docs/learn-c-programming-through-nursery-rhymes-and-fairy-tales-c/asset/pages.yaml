  md: '# Dear Apprentice,


    I''m so glad you''ve arrived at C Castle! A magical experience awaits you- you''ll
    see computer code transformed into classic nursery rhymes and fairy tales!


    Once upon a time in a faraway land, there was an enchanted computer deep in the
    woods. The computer told nursery rhymes and fairy tales using code, which is a
    set of instructions written for a computer to perform tasks, such as printing
    text to the screen or playing a video.


    A program is a collection of code that can be run by a computer. The enchanted
    computer told the nursery rhymes and fairy tales using programming language has
    its own set of rules for how the code is written, which is called the syntax.
    Dependant programming languages are written with different syntaxand designed
    for different uses.


    People from the nearby village occasionally wandered into the forest and listened
    to the enchanted computer''s stories. Over the years, the C programs stored on
    the computer were written and recorded in a book. You will now be presented with
    these C programs. Your journey has just begun! There are instructions at the end
    of this book for running the enchanted programs on YOUR computer!


    Warm Regards,

    S.E.'
