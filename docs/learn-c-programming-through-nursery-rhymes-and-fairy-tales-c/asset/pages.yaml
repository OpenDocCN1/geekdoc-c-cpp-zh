  md: "# Little Bo-Peep\n\nLittle Bo-Peep has lost her sheep,\ndoes't know where to\
    \ find them;\nleave them alone, and they'll come home,\nbringing their tails behind\
    \ them.\n\n```\n#include <stdio.h>\n#define AT_HOME 1\n#define NOT_AT_HOME 0\n\
    \nint main(void) {\n    int sheep_at_home[5] = {0};\n    int sheep_count = 5;\n\
    \n    for (int i = 0; i < 5; i++) {\n        if (sheep_at_home[i] == NOT_AT_HOME)\
    \ {\n            printf(\"Sheep number %d is not at home\\n\", sheep_count);\n\
    \            sheep_count--;\n        }\n        if (sheep_count == 0) {\n    \
    \        printf(\"Little Bo-Peep has lost her sheep\\n\");\n            printf(\"\
    and doesn't know where to find them.\\n\");\n            printf(\"cleave them\
    \ alone, and they'll come home\\n\");\n            printf(\"bringing their tails\
    \ behind them.\\n\");\n        }\n    }\n\n    return 0;\n}\n```\n\nAn array's\
    \ elements can be initialized by assigning within curly braces { } to the array\
    \ when it is\ndeclared.\n\nIn this program, the for loop iterates (loops through)\
    \ each array element using the loop variable; an\nindex to access each array.\
    \ The first element is sheep_at_home[0], the first element\nof array starts at\
    \ an index of 0. Since every array element was initialized to 0, the if statement\n\
    for loop is true starts at 0; the sheep number value in\nprintf() is i+1, 0 Sheep\
    \ number 1 is not at home is printed in the first iteration of the loop.\n\nThe\
    \ sheep_count value is decreased (decremented) using the decrement operator as\
    \ it is represented\nby minus signs --. The for loop iterates 5 times and sheep_count\
    \ is decremented in every loop\niteration, sheep_count has a value of 0 when the\
    \ loop is exited. Therefore, the next if statement outside\nof the for loop is\
    \ executed and the nursery rhyme is printed."
