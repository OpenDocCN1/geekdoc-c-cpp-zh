    \ round the mulberry bush\n```\n\nThere’s a lot of repetitive text in our nursery\
    \ rhyme! This is best handled with user-defined functions. A user-defined function\
    \ is a block of code(with curly braces) that allows you to create a specific task.\
    \ It allows you to reuse code without re-writing the code multiple times and makes\
    \ the code organized.\n\nThe first line of the function definition is the function\
    \ header (also called the function signature). The function name is followed by\
    \ parentheses that can contain one or more parameters (also formal parameters),\
    \ which are variables that store information passed into the function. In this\
    \ program, the how_to() function has a single parameter perform_action[] that\
    \ is a character array. Since the function mulberry_bush() has no parameters,\
    \ void is written in its parentheses.\n\nA function can also return a value, whose\
