  md: "# Humpty Dumpty\n\n> Humpty Dumpty sat on a wall.\nHumpty Dumpty had a great\
    \ fall.\nAll the king's horses and all the king's men\nCouldn't put Humpty together\
    \ again.\n\n```\n#include <stdio.h>\n\n#define TRUE 1\n#define FALSE 0\n\nint\
    \ main(void) {\n    int humpty_dummy_together = TRUE, humpty_on_wall = TRUE, accident\
    \ = FALSE;\n    if (humpty_on_wall) {\n        printf(\"Humpty Dumpty sat on a\
    \ wall,\\n\");\n        accident = TRUE;\n    }\n    if (accident) {\n       \
    \ printf(\"Humpty Dumpty had a great fall.\\n\");\n        humpty_dummy_together\
    \ = FALSE;\n    }\n    if (!humpty_dummy_together) {\n        printf(\"All the\
    \ king's horses and all the king's men mem\\n\");\n        printf(\"Couldn't put\
    \ Humpty together again.\\n\");\n    }\n    return 0;\n}\n```\n\nMultiple variables\
    \ can be declared on the same line if they are of the same data type. The variables\
    \ humpty_dummy_together, humpty_on_wall, and accident are all integers declared\
    \ on one line by being separated by commas with it at the start of the line.\n\
    \nSince humpty_on_wall is initialized to FALSE, the first statement is executed,\
    \ which assignsTRUE to accident. This causes the second statement to be executed,\
    \ which assignsFALSE to humpty_dummy_together.\n\nThe NOT operator is represented\
    \ by the exclamation mark (!) symbol. When it's placed in front of an expression,\
    \ it reverses the logical value of the expression. It changes true to false, and\
    \ false to true. Therefore, the if statement's condition evaluates to truehumpty_dummy_together\
    \ is false, which is inverted by the NOT operator to make the condition true."
