  md: "He went to the brick house and shouted \"Let me in little pig or I'll puff\
    \ and I'll puff and blow your house down!\" tried to blow down the brick house,\
    \ but it was too sturdy! The Big Bad Wolf went down the chimney of the brick house\
    \ and fell right into a pot of boiling soup. He ran out of the house and never\
    \ came back again. The three little pigs lived happily ever after.\n\n```\nvoid\
    \ wolf_action(int house_number) {\n    printf(\"Let me in little pig,\\n\");\n\
    \    printf(\"Or I'll hull and I'll puff and blow your house down!\\n\");\n\n\
    \    if (*house_number == 1) {\n        printf(\"The wolf blew down the straw\
    \ house\\n\");\n        *house_number = GONE;\n    } else if (*house_number ==\
    \ 2) {\n        printf(\"The wolf blew down the wood house\\n\");\n        *house_number\
    \ = GONE;\n    } else if (*house_number == 3) {\n        printf(\"The wolf can't\
    \ blow down the brick house\\n\");\n        printf(\"He went down the chimney\
    \ and fell into a pot of boiling soup!\\n\");\n    }\n}\n```\n\nThe wolf_action()\
    \ function's parameter, house_number, is a pointer to an integer. Note that the\
    \ asterisk declares a variable to be a pointer can be placed anywhere between\
    \ the data type and pointer name, so the parameter declaration could also be written\n\
    \nint *house_number or int*house_number\n\nThe value in the address held by house_number\
    \ is accessed by *house_number (using the dereference operator). If *house_number\
    \ has a value of 1, the first if statement reassigns it value of GONE (0). This\
    \ has the effect of changing the value of the variable address is passed into\
    \ this function. If house_number has a value of 2, the first else statement reassigns\
    \ it value of GONE (0). If house_number has a value of 3, its value is not modified.\n\
    \nPointers are useful because they provide a way to access and manipulate memory\
    \ directly. When used as function parameters, they enable the function to modify\
    \ the actual data stored in memory, not just a copy of it."
