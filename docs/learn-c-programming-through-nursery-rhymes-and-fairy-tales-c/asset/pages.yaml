  md: "# # I'm a Little Teapot\n\n```\n#include <stdio.h>\n#include <string.h>\n\n\
    struct Teapot {\n    char size[10];\n    char height[10];\n    int steam_level;\n\
    }\n\nint main(void) {\n    struct Teapot t1; //Declare structure variable\n  \
    \  strcpy(t1.size, \"stout\");\n    strcpy(t1.height, \"short\");\n    t1.steam_level\
    \ = 8;\n\n    printf(\"I'm a little teapot\\n\");\n    printf(\"%s and %s!\\n\"\
    , t1.height, t1.size);\n    printf(\"Here is my handle!Here is my spout!\\n\"\
    );\n    printf(\"When I get all steamed up, hear me shout!\\n\");\n\n    return\
    \ 0;\n}\n```\n\nI'm a little teapot\nShort and stout.\nHere is my handle\nHere\
    \ is my spout\nWhen I get all steamed up,\nTip over and pour me out!\n\nA structure\
    \ is a custom data type that groups variables together, which allows you to create\
    \ a collection of related information. A structure's data fields are called members,\
    \ and they can be of different data types. A structure is defined using the keyword`struct`\
    \ with the structure's members declared within curly braces (). The structure's\
    \ name is given after the struct keyword.\n\nIn this program, the structure named\
    \ teapot. The teapot structure contains char array members and one member. t1\
    \ is declared as a Teapot variable.\nThe operator () is used to access members\
    \ of a structure. The steam_level member of t1 is assigned a value of 8. The dot\
    \ operator cannot be used to assign multiple array elements at once, char arrays\
    \ cannot be assigned strings with the dot operator. The string function `strcpy()`\
    \ is used to assign strings to the size and height members. The string stout is\
    \ assigned to the size member of t1 and the string short is assigned to the height\
    \ member of t1. The `printf()` functions print the following:\n\nI'm a little\
    \ teapot\nShort and stout\nHere is my handle\nHere is my spout\nWhen I get all\
    \ steamed up, hear me shout\nTip over and pour me out!"
