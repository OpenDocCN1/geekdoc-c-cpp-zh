  md: "# Hickory Dickory Dock\n\nHickory, dickory, dock.\nThe mouse ran up the clock.\n\
    The clock struck one,\nThe mouse ran down,\nHickory, dickory, dock.\n\n```\n```c\n\
    #include <stdio.h>\ninclude <string.h>\nint main(void) {\n    int clock_hour =\
    \ 1;\n    char mouse_run_direction[10] = \"up\";\n    char first[] = \"Hickory\"\
    ;\n    char middle[] = \"dickory\";\n    char last[] = \"dock\";\n\n    printf(\"\
    %s, %s, %s, first, middle, last,\\n\", first, middle, last);\n    printf(\"%s\
    \ ran up the clock %d,\\n\", mouse_run_direction, clock_hour);\n    printf(\"\
    The clock struck %d,\\n\", clock_hour);\n    strcpy(mouse_run_direction, \"down\"\
    );\n    printf(\"%s ran down %s,\\n\", mouse_run_direction);\n    printf(\"%s,\
    \ %s, %s, first, middle, last,\\n\", first, middle, last);\n    return 0;\n}\n\
    ```\n```\n\nThe char type is used to represent a character as a letter or number.\
    \ A string is an array of characters that represent such as words or sentences.mouse_run_direction\
    \ is declared as a character array of size 10, which means it can hold up to ten\
    \ characters. The null character \\ is automatically added as the last element\
    \ of a string to indicate its end. Since it is initialized with the stringup,\
    \ the characters u, p, and are stored in the first three elements of the array.\n\
    \nWhen declaring a character array that is initialized with a string, it's not\
    \ necessary to specify the array's size. However the size of the array is determined\
    \ by the length of the string, which means there won't be enough space for characters\
    \ if a longer string is assigned to the array later mouse_run_direction is declared\
    \ with an array size of 10, which allows it to accommodate the longer down that\
    \ it is assigned to. The size of each array first, middle, and last is determined\
    \ by the size of its string. For examplelastdock has a size of four characters\
    \ and the null character is automatically added at the end.\n\n%s is a string\
    \ specifier that printf replaces with the actual string value passed to it.stringh\
    \ is a header file in the C standard library that contains functions for performing\
    \ string operations.strcpy is a function declared that is used to copy a string\
    \ from one location to another. It is used to copy the string down into mouse_run_direction.\
    \ The printf functions print the following:\n\nHickory, dickory, dock\nThe mouse\
    \ ran up the clock.\nThe struck 1,\nThe mouse ran down,\nHickory, dickory, dock.\n\
    \n![](img/59c2bc7e23499c00f04d0ab71fe210db_25_0.png)"
