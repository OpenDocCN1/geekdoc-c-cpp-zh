  md: "```\n//Function prototypes\nvoid mulberry_bush(void);\nvoid how_to(char perform_action[]);\n\
    \nint main(void)\n{\n    //Function calls\n    mulberry_bush();\n    how_to(\"\
    wash our face\");\n    how_to(\"brush our teeth\");\n    how_to(\"comb our hair\"\
    );\n    how_to(\"put on our clothes\");\n    mulberry_bush();\n\n    return 0;\n\
    }\n```\n\nYou use a function to execute (run) a function's code. The function\
    \ call consists of the function's name enclosed by parentheses that contain values\
    \ to be passed into any parameters it has. A value that is passed into a function's\
    \ parameter is called an argument.\n\nA function needs to be defined or declared\
    \ before it is called. A function prototype is a function declaration that allows\
    \ you to call a function defined after main(). The function prototypes on the\
    \ previous page can be added to the program before or after the main() function.\n\
    \nIn the first how_to() function, \"wash our face\" is the argument that is passed\
    \ into the perform_action parameter of the how_to() function. The perform_action\
    \ value can be used within the how_to() function. The how_to() function then prints:\n\
    \n+   wash our face\nwash our face\nThis is the way we wash our face\n a cold\
    \ and frosty rhyme.\n\nWhen a function is called, the program transfers control\
    \ to the function. After the function executes, the program resumes from where\
    \ it left off after the function call. The next function call how_to(\"brush our\
    \ teeth\") is executed. The six function calls in this program print the six verses\
    \ of the nursery rhyme.\n\nmulberry_bush() is a function that doesn't have any\
    \ arguments since the function doesn't have parameters. It is used to print ones\
    \ and all of the nursery rhyme.\n\nAs you can see, a function allows a block of\
    \ code to be re-used without typing it multiple times. As a result, this program\
    \ is shorter than the nursery rhyme it prints to the screen! Functions also make\
    \ a program more organized and readable by breaking the program down into separate\
    \ blocks of code."
