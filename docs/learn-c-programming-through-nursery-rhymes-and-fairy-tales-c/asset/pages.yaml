- pgno: 8
  md: "# Jack Nimble\n\nJack be nimble,\nJack be quick,\nJack jump over the candlestick\n\
    \n```\n#include <stdio.h>\n\nint main(void) {\n    printf(\"Jack be nimble, Jack\
    \ be quick, Jack jump over the candlestick\");\n    return 0;\n}\n```\n\nLines\
    \ of code can be separated with empty lines to make the code easier to read. A\
    \ keyword is a word that has a special meaning in C, such as int and return that\
    \ are described below.\n\nA statement is a complete program instruction that is\
    \ run (executed) by a computer to perform an action. Programs' statements are\
    \ executed from top to bottom. The first statement in this program is printf(\"\
    Jack be nimble, Jack be quick, Jack jump over the candlestick\");\n\nmain() is\
    \ a function. A block of code (within curly braces) that contains instructions\
    \ to perform a task. Every C program needs a main() function, where the program\
    \ begins running. It is considered good practice to indent the code within a code\
    \ block, which makes it easier to read.\n\nprintf() is a function in the C standard\
    \ library that outputs text to the computer screen. A library is a collection\
    \ of predefined functions, data, and other resources that can be used in your\
    \ programs. The C standard library is provided with your C compiler, which converts\
    \ your C code into machine instructions for the computer and links with your standard\
    \ library.\n\nA code block is run (executed) when the function is called with\
    \ its name followed by parentheses. The printf() function passes the string to\
    \ be printed within the parentheses to the standard output device (typically a\
    \ screen). A string is a sequence of characters—letters, numbers, symbols, or\
    \ spaces—that is enclosed in double (\"\") marks when written in code. \"Jack\
    \ be nimble, Jack be quick, Jack jump over the candlestick\" is passed to printf()\
    \ as a string within double quotes. When the printf() function returns Jack nimble,\
    \ Jack be quick, Jump over the candlestick to the screen, without the double quotes.\n\
    \nstdio.h is a header file that contains information needed for the C standard\
    \ library input and output functions to work. This header file is needed to use\
    \ the printf(). It is included in the program by #include.\n\nreturn returns a\
    \ value of 0 to the system running the program, which is typically used as a signal\
    \ that the program successfully finishes. The int main() indicates the return\
    \ value is an integer (a whole number that doesn't have a decimal point). The\
    \ void indicates that the main() function does not receive any data."
