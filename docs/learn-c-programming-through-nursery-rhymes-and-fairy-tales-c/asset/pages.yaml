  md: "# Jack and the Beanstalk\n\nOnce upon a time, a boy named Jack lived in a cottage\
    \ with his mother. One day, she told him to go to the town and trade his cow for\
    \ money. In the town, Jack was convinced by a strange man to trade his cow for\
    \ magic beans. When he got back home, his mother was angry and threw the magic\
    \ beans out the window. The next morning, Jack saw a huge beanstalk growing outside!\n\
    \n```\n#include <stdio.h>\nenum (MAGIC_BEANS, GIANT_BEANSTALK, COW, MONEY);\n\
    int throw_into_yard(int item) {\n    if (item == MAGIC_BEANS) {\n        printf(\"\
    Why did you throw the magic beans out the window?\\n\");\n        return item;\n\
    \    }\n    return item;\n}\nint trade(int item) {\n    if (item == COW) {\n \
    \       printf(\"I'll trade my cow for magic beans!\\n\");\n        return MAGIC_BEANS;\n\
    \    }\n    return MONEY;\n}\nvoid climb_beanstalk(int visit_num) {\n    switch\
    \ (visit_num) {\n        case 1:\n            printf(\"I climbed the beanstalk\
    \ and took back a bag of gold coins!\\n\");\n            break;\n        case\
    \ 2:\n            printf(\"I climbed the beanstalk and took back a hen that lays\
    \ golden eggs!\\n\");\n            break;\n        case 3:\n            printf(\"\
    I climbed the beanstalk and took back a magical hararp!\\n\");\n            printf(\"\
    Oh no, the giant is chasing after me!\\n\");\n            printf(\"I cut down\
    \ the beanstalk. Now we can live happily ever after!\\n\");\n            break;\n\
    \        default:\n            printf(\"Invalid visit number. The beanstalk is\
    \ gone!\\n\");\n    }\n}\n```\n\nFunctions return a single value with the return's\
    \ data type specified in front of the function name. In this program, each function\
    \ trade() and throw_into_yard() returns an int value to its function calling.\
    \ In throw_into_yard(), if item has a value of 0 (MAGIC_BEANS), return giant_BEANSTALK\
    \ causes the function to exit with a return value of 1 (GIANT_BEANSTALK). Otherwise,\
    \ the integer value of item is returned from the function. Similarly, in trade(),\
    \ if item has a value of 2 (COW), the function exits with a return value of 0\
    \ (MAGIC_BEANS). Otherwise, the function returns a value of 3 (MONEY).\n\nContinued..."
