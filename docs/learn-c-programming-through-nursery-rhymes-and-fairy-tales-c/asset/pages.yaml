  md: "# # Little Red Riding Hood\n\nOnce upon a time, there was a girl known as Little\
    \ Red Riding Hood. One day, her mother asked her to bring a basket of food (cupcakes,\
    \ cookies, and donuts) to her grandmother because she wasn't feeling well. As\
    \ Little Red Riding Hood was walking through the forest to her grandmother's house,\
    \ a wolf asked her where she was going. Little Red Riding Hood told the wolf she\
    \ was going to granny's house.\n\n```\n#include <stdio.h>\n\ntype struct {\n \
    \   int ears;\n    int eyes;\n    int hands;\n    int teeth;\n}\nFeatures_t;\n\
    enum {SMALL, MEDIUM, BIG};\nconst char HUNTER = 'H';\nconst char GRANNY = 'G';\n\
    ```\n\n![](img/59c2bc7e23499c00f04d0ab71fe210db_62_0.png)\n\n```\n#define IS_FEATURE_BIG(feature)\
    \ feature == BIG\n//Function prototypes\nint wolf_test(Features_t features);\n\
    char scare_wolf(char person);\n```\n\nContinued...\n\nIn previous programs, we've\
    \ defined a macro IS_FEATURE_BIG(feature) as a symbolic name for a value. However,\
    \ a macro can also be used to define an expression, which is a combination of\
    \ code that evaluates to a single value.\n\nIn this program, we've defined a macro\
    \ IS_FEATURE_BIG(feature) as a substitute for the expression (feature == BIG).\
    \ When we use IS_FEATURE_BIG(feature), the value or variable we provide as its\
    \ parameter is substituted for feature in the expression feature == BIG. This\
    \ approach enhances the code's readability because IS_FEATURE_BIG conveys the\
    \ intent of the check.\n\nIn the wolf_test() function prototype, the features\
    \ indicates it is a Features_t structure.\n\nA variable can be declared with the\
    \ const modifier to indicate that its value is constant and won't change during\
    \ the program's execution. You cannot re-assign the value of a_const constant\
    \ variable once it is set. The const variables HUNTER and GRANNY are capitalized\
    \ to indicate they hold constant values. HUNTER is assigned the character H and\
    \ GRANNY is assigned the character G."
