  md: '# Change the Stories


    Change the values of variables and see how the output changes. If Jack didn''t
    fall down the hill?


    # Why C Programming?


    # You Don''t Need a Magic Wand


    C is the most popular language in embedded systems! An embedded system is a hardware
    and software system designed to perform one or more tasks within a larger system.
    A microcontroller is a common type of embedded system that is in devices and appliances
    around you, like your phone, printer, microwave, washing machine, and remote control—just
    to name a few. Now you can make things move by programming them!


    A microcontroller has all the components of a computer contained in a single chip
    (integrated circuit or IC). Just like your computer reads input from the keyboard
    and outputs to the screen, a microcontroller reads inputs (such as from a sensor
    or button) and controlsoutputs (such as turning on an LED or motor). This allows
    the embedded system to sense and interact with the outside world.


    ![](img/59c2bc7e23499c00f04d0ab71fe210db_90_0.png)


    You can apply the syntax and constructs you learned in this book to programming
    microcontrollers, so you can create your own devices. The Arduino® is a popular
    microcontroller development platform. The Arduino language is a set of C/C++ functions
    that you can call from your code. For more information about the Arduino platform,
    please visit:https://www.arduino.cc


    Arduino® is a trademark of Arduino SA'
