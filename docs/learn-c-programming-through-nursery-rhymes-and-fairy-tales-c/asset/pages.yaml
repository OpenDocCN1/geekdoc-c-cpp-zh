  md: "# Peter Piper\n\nPeter Piper picked a peck of pickled peppers.\nIf Peter Piper\
    \ picked a peck of pickled peppers.\nWhere's the peck of pickled peppers Peter\
    \ Piper?\n\n```\n#include <stdio.h>\n\n#define PICKLED_PEPPERS 0\n#define CHOCOLATES\
    \ 1\n#define FRUIT_CANDIES 2\n#define GUMMY_BEARS 3\n\nint main(void) {\n    int\
    \ item_picked = PICKLED_PEPPERS;\n    if (item_picked == CHOCOLATES) {\n     \
    \   printf(\"Peter Piper picked chocolates\\n\");\n    } else if (item_picked\
    \ == PICKLED_PEPPERS) {\n        printf(\"Peter Piper picked a peck of pickled\
    \ peppers\\n\");\n        printf(\"Where's the peck of pickled peppers Peter Piper\
    \ picked?/\\n\");\n    } else if (item_picked == FRUIT_CANDIES) {\n        printf(\"\
    Peter Piper picked fruit candies\\n\");\n    } else if (item_picked == GUMMY_BEARS)\
    \ {\n        printf(\"Peter Piper picked gummy bears\\n\");\n    } else {\n  \
    \      printf(\"Did Peter Piper pick anything?\\n\");\n    }\n    return 0;\n\
    }\n```\n\nAn else if...else statement allows multiple conditions to be tested\
    \ in sequence. In this program, the first true condition is executed. The first\
    \ else if block is executed since item_picked was assigned the value of PICKLED_PEPPERS."
  merge: -1
