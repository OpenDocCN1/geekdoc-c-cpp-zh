  md: "# # Hey Diddle Diddle\n\n```\n#include <stdio.h>\n#define CAT 0\n#define FIDDLE\
    \ 1\n#define SPOON 2\n#define MOON 3\n#define COW 4\n#define LITTLE_DOG 5\n\n\
    int main(void) {\n    int thing_chosen;\n    char name[] = \"diddle\";\n\n   \
    \ printf(\"%s %s\\n\", name);\n    printf(\"The cat and the fiddle\\n\");\n  \
    \  printf(\"The cow jumped over the moon\\n\");\n    printf(\"The little dog laughed\
    \ to see such sport,\\n\");\n    printf(\"And the dish ran away with the spoon\\\
    n\");\n\n    thing_chosen = SPOON;\n    switch (thing_chosen) {\n        case\
    \ 0:\n            printf(\"the cat\");\n            break;\n        case 1:\n\
    \            printf(\"the fiddle\");\n            break;\n        case 2:\n  \
    \          printf(\"the spoon\");\n            break;\n        case 3:\n     \
    \       printf(\"the moon\");\n            break;\n        case 4:\n         \
    \   printf(\"the cow\");\n            break;\n        case 5:\n            printf(\"\
    the little dog\");\n            break;\n        default:\n            printf(\"\
    nothing\");\n            break;\n    }\n\n    return 0;\n}\n```\n\nA switch statement\
    \ is an alternative to using a long if_else if_else statement to test if an integer\
    \ value or a character value is equal to a value in a list. The expression after_switch\
    \ is tested for a match in a list of case values. If there is a matched value\
    \ in the list, one or more statements with the matched value are executed. When\
    \ a break is reached, the switch statement is exited. The default label is optional,\
    \ and its code block will be executed if there is no matched value in the case\
    \ list.\n\nSince thing_chosen was assigned the value of SPOON, which is 2, the\
    \ case 2 code block is executed, which prints the spoon. Since there was no newline\
    \ in the printf(), And the dish ran away with the spoon is printed as the last\
    \ sentence.\n\n![](img/59c2bc7e23499c00f04d0ab71fe210db_27_0.png)"
