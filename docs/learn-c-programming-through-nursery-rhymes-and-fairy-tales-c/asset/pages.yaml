  md: "Just as the little pigs were enjoying their new houses. The Big Bad Wolf arrived\
    \ He went to the house made of straw and shouted 'Let me in little pig, or I'll\
    \ huff and I'll blow your house down!' The wolf blew the house made of straw.\
    \ He went to the house made of sticks and shouted. Let me in little pig, or I'll\
    \ huff and I'll blow your house down! The wolf blew the house made of sticks\n\
    \n```\n/* Call wolf_action() with the address of each pig's house variable and\
    \ display a message if a house variable is set to GONE (0) after the function\
    \ call */\n\nwolf_action(&youngest_pig_house);\nif (youngest_pig_house == GONE)\
    \ {\n    printf(\"The youngest pig's house is gone!\\n\");\n}\n\nwolf_action(&middle_pig_house);\n\
    if (middle_pig_house == GONE) {\n    printf(\"The middle pig's house is gone!\\\
    n\");\n}\n\nwolf_action(&oldest_pig_house);\nif (oldest_pig_house == GONE) {\n\
    \    printf(\"The oldest pig's house is gone!\\n\");\n}\n\nreturn 0;\n```\n\n\
    When variables are passed as arguments into function parameters, they arepassed\
    \ by value. This means a copy of the variable's value is passed into the function\
    \ parameter,leaving the original variable's value unaffected. Although the function\
    \ can change the value passed into it, this doesn't impact the original instance.\
    \ Instead, the new value can be returned to the function call.\n\nHowever, if\
    \ a function parameter is a pointer, the address of a variable can be passed into\
    \ it.this approach is called by reference. It allows the function to modify the\
    \ variable directly, as now it has access to the original variable's memory location.\n\
    The wolf_action() function (defined on the next page) has the potential to change\
    \ the value of the variable whose address is passed into it. Therefore, after\
    \ the address of youngest_pig_house is passed into wolf_action(), the variable\
    \ youngest_pig_house is checked to see if it has a value of GONE (0). The other\
    \ variables whose addresses are passed intowolf_action() are also tested for having\
    \ a value ofGONE (0).\n\nA multi-line comment allows you to write a comment that\
    \ spans as many lines as you want. As demonstrated in the code above, it starts\
    \ with a forward slash and an asterisk /* and ends with an asterisk and a forward\
    \ slash */."
