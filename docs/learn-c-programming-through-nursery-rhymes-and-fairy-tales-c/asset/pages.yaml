    \ {\n    switch (new_item) {\n        case CARRIAGE:\n            printf(\"a pumpkin\\\
    n\n```\n\n![](img/59c2bc7e23499c00f04d0ab71fe210db_74_0.png)\n\n#ifdef is a preprocessor\
    \ directive that stands for \"defined\". It checks if a macro has been defined\
    \ earlier in the code. This happens before the code is becompiled (converted into\
    \ machine language code the computer can understand). The CHORES_NOT_DONE macro\
    \ defined without any specific value, for the purposes of #ifdef, it is not necessary\
    \ for the macro to be defined—only needs to be defined.\nIf after #ifdef has been\
    \ defined, the code between #ifdef and #endif is included in the program before\
