  md: "# The Three Little Pigs\n\nOnce upon a time, three little pigs lived with their\
    \ mother. One day, they left home and set out to build their own houses. The youngest\
    \ pig built a house made of straw in one day. The middle pig built a house made\
    \ of sticks in three days. The oldest pig built a house made of bricks in seven\
    \ days.\n\n```\n#include <stdio.h>\n#define GONE 0\nenum {HOUSE_1 = 1, HOUSE_2,\
    \ HOUSE_3};\n\nvoid wolf_action(int* house_number) { //function prototype\n\n\
    int main(void) {\n    int youngest_pig_house = HOUSE_1, middle_pig_house = HOUSE_2,\
    \ oldest_pig_house = HOUSE_3;\n\n    int* house_ptr = &youngest_pig_house;\n \
    \   printf(\"the youngest pig built house #%d in one day \\n\", house_ptr);\n\
    \    printf(\"at address %p\\n\", house_ptr);\n\n    house_ptr = &middle_pig_house;\n\
    \    printf(\"the middle pig built house #%d in three days \\n\", house_ptr);\n\
    \    printf(\"at address %p\\n\", house_ptr);\n\n    house_ptr = &oldest_pig_house;\n\
    \    printf(\"the oldest pig built house #%d in seven days \\n\", house_ptr);\n\
    \    printf(\"at address %p\\n\", house_ptr);\n```\n\nContinued...\nA pointer\
    \ is a special variable that stores the memory address of another variable or\
    \ value. While a normal variable holds a value or an address (an address in the\
    \ computer's memory), a pointer \"points\" to this by storing the memory address.\
    \ A pointer is declared with the type of data it points to, followed by an asterisk\
    \ (*) and the name of the pointer variable. In this program, house_ptr is the\
    \ name of a pointer that points to an int variable.\n\nThe address operator (&)\
    \ is used in variable to get its memory address. The dereference operator (*)\
    \ is used in front of a pointer to access the data stored at that memory address.\
    \ It holds the value. The address added by house is given by &youngest_pig_house,\
    \ middle_pig_house has a value of _, oldest_pig_house has a value of.\nThe first\
    \ two printf statements print The youngest pig built house #1 in one day at address\
    \ 0x7ffe2fd5ibc4. The % specifier is used to print the address, which will be\
    \ specific to your computer's memory, so you may see a different value. house_ptr\
    \ is reassigned the address of middle_pig_house, and then re-assigned the address\
    \ of oldest_pig_house. The remaining printf statements print The middle pig built\
    \ house #2 in two days at address 0x7ffe2fd5bca8 and the oldest pig built house\
    \ #3 in seven days at address 0x7ffe2fd5bcc. The % in front of an address indicates\
    \ that the address is in hexadecimal format, which is a way to represent numbers\
    \ using a base of 16 (as opposed to decimal numbers, which use a base of 10)."
