  md: "# The Gingerbread Man\n\nOnce upon a time, an old woman and an old man lived\
    \ in a cottage in the countryside. The old woman decided to make gingerbread cookies\
    \ for dessert.\n\n```\n#include <stdio.h>\n#include <math.h>\n\n#define INGREDIENTS_NUM\
    \ 11\n\nint main(void) {\n    enum ingredients_e {\n        EGGS, BUTTER, BAKING_SODA,\
    \ GROUND_GINGER,\n        GROUND_CINNAMON, GROUND_CLOVES, GROUND_NUTMEG, SALT,\n\
    \        GROUND_BLACK_PEPPER, DARK_BROWN_SUGAR\n    };\n    int ingredients[INGREDIENTS_NUM]\
    \ = {\n        FLOUR, EGGS, BUTTER, BAKING_SODA, GROUND_GINGER,\n        GROUND_CINNAMON,\
    \ GROUND_CLOVES, GROUND_NUTMEG, SALT,\n        GROUND_BLACK_PEPPER, DARK_BROWN_SUGAR\n\
    \    };\n    float quantities[INGREDIENTS_NUM] = {3.2,0.2,0.75,0.75,1.0,0.5,0.5,0.5,0.25,0.5};\n\
    // This recipe makes 20 gingerbread cookies. Enter an integer value.\n    printf(\"\
    How many gingerbread cookies do you want to make?%d\\n\",\n    int cookie_num;\n\
    \    scanf(\"%d\", &cookie_num);\n    int batches = ceil((float)cookie_num / 20);\
    \ // round up to next batch number\n    printf(\"A batch of %d is needed to make\
    \ %d d cookies%d\\n\", batches, cookie_num);\n    printf(\"The gingerbread cookie\
    \ recipe calls for:%d\\n\");\n```\n\nContinued...\n\nThe elements of the ingredients\
    \ array are initialized with enum constant values. The quantities array contains\
    \ elements of float data type, which are used for storing-point numbers (numbers\
    \ with a decimal point). Each of these float represents the quantity of the corresponding\
    \ ingredient (at the same index) in the ingredients array.\n\nThe math.h header\
    \ file, which is part of the C standard library, provides a variety of mathematical\
    \ functions. Among these ceil(), which returns the 'ceiling' of floating-point\
    \ number by rounding up to the nearest integer.\n\nIn C, the division of two integers\
    \ returns an integer. The actual result of division is a fraction, the fractional\
    \ part is discarded, not rounded. To keep the fractional part, you can convert\
    \ (into a different data type) by placing the desired data type in parentheses\
    \ before the variable or value you want to convert. The scanf() function is used\
    \ to read an integer value entered by the user and store it in cookie_num, which\
    \ then typecast to a float before it is divided by 20. The ceil() function is\
    \ called on the result of this division. The value returned by ceil indicates\
    \ the total number of batches required to make the desired number of cookies."
