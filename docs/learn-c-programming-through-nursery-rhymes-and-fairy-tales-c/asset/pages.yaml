  md: '# Jack and Jill


    Jack and Jill went up the hill

    To fetch a pail of water.

    Jack fell down and broke his crown,

    And Jill came tumbling after.


    In the first if condition, the && operator is called the logical AND operator.
    It tests the expression on the left of it is true AND the expression on the right
    of it is true. If both expressions are true, the overall condition evaluates to
    true. Conversely, if either expression is false or both expressions are false,
    the condition evaluates to false.


    In this case, since jack_direction == UP and jill_direction == UP is also true,
    if the condition is true. Therefore, the if statement''s code block is executed,
    and jack_fall is assigned the value TRUE.


    An if_else statement allows one of two code blocks to be based on whether the
    condition is true or false. Any expression that evaluates to a non-zero value
    is considered true. Since jack_fall now has a value of 1, the condition in the
    second if statement evaluates to true and the if code block is executed. Conversely,
    if the condition were not true, the else code block would be executed instead.


