- pgno: 12
  md: "# Star Light, Star Bright\n\nStar light, star bright.\nFirst star I see tonight;\n\
    I wish / may. I wish / might.\nHave the wish / I wish tonight.\n\n```\n// Make\
    \ a variable on a star\n#include <stdio.h>\nint main(void) {\n    int star_order\
    \ = 1;\n\n    printf(\"Star light, star bright,\\n\");\n    printf(\"Star number\
    \ %d that I see tonight,\\n\", star_order);\n    printf(\"Have I wish I wish I\
    \ might,\\n\");\n\n    return 0;\n}\n```\n\nstar_order is called a variable. A\
    \ variable stores a value in the computer's memory and the programmer gives it\
    \ a name. The variable can be given any name—star_order was chosen because it's\
    \ a meaningful name. Before variables are used, they must be declared with a type\
    \ such as int for storing an integer. A variable's data type determines the type\
    \ of data it can hold and how it can be used. For example, an integer can be added\
    \ to another integer, but an integer can't be added to string.Variables can be\
    \ assigned a starting value (initialized) when they are declared. In this program,\
    \ the variable star_order is declared as an int and initialized to 1.\n\n%d is\
    \ an integer format specifier. The format specifier of a percent sign followed\
    \ by a character indicates the data type of the data to be displayed. In this\
    \ program %d is replaced by the value of star_order when printf() prints the text.\n\
    \nVariable names in C conventionally written in lowercase letters and an underscore\
    \ (_) separates words in the name because variable names cannot contain blank\
    \ spaces. They can contain letters, numbers, and underscores. A variable name\
    \ cannot start with a number.\n\nThe four printf() functions print these lines:\n\
    Star light, star bright,\nStar number 1 that I see tonight;\nI wish I may, I wish\
    \ I might.\nHave the wish I wish tonight."
  merge: -1
  img_proc: true
