    \ good practice to indent the code within a code block, which makes it easier\
    \ to read.\n\n`printf()` is a function in the standard library that outputs text\
    \ to the computer screen. A library is a collection of predefined functions, data,\
    \ and other resources that can be used in programs. The C standard library is\
    \ provided with your compiler, which converts your code into machine instructions.\n\
    \nA code block is run (executed) when the function is called with its name followed\
