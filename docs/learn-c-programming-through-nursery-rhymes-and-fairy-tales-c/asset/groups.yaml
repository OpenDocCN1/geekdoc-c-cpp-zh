    \ `star_order` 是因为它是一个有意义的名字。在使用变量之前，必须用类型声明它们，例如存储整数的 `int`。变量的数据类型决定了它能持有的数据类型以及如何使用它。例如，整数可以与整数相加，但整数不能与字符串相加。在声明变量时可以分配初始值（初始化）。在本程序中，变量\
