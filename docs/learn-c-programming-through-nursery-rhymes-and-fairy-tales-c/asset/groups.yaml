    ```\n\n// Row Your Boat 是一个注释，通过行前的两个斜杠（/）表示。它是写给阅读代码的人看的，计算机会忽略它。注释可以解释代码的作用或工作原理。\n\
    \n换行符（\\n）结束了该行，使得下一个 `printf()` 从下一行开始打印。\n\n当程序执行时，四个 `printf()` 函数会在屏幕上打印以下文本：\n\
