    \ star bright,\\n\");\n    printf(\"Star number %d that I see tonight,\\n\", star_order);\n\
    \    printf(\"Have I wish I wish I might,\\n\");\n\n    return 0;\n}\n```\n\n\
    `star_order` is called a variable. A variable stores a value in the computer's\
