  - "[PAGE 10]\n\n# Row, Row, Row Your Boat\n\nRow, row, row, your boat\nGently down\
    \ the stream\nMerrily merrily, merrily, merrily\nLife is but a dream\n\n```\n\
    // Row Your Boat\n#include <stdio.h>\nint main(void) {\n    printf(\"Row, row,\
    \ row your boat\\n\");\n    printf(\"Gently down the stream\\n\");\n    printf(\"\
    Merrily merrily, merrily, merrily\\n\");\n    printf(\"Life is but a dream\\n\"\
    );\n    return 0;\n}\n```\n\n// Row Your Boat is a comment, which is indicated\
    \ by the two forward slashes (/) in front of the line. It is written as a note\
    \ for someone reading the code and is ignored by the computer. A comment can explain\
    \ the purpose of the code or how it works.\n\nAn newline character that ends the\
    \ line so that the next printf() will start printing at the beginning of the next\
    \ line.\n\nWhen the program is executed, the fourprintf() functions print the\
    \ following text on the screen:\n\nRow, row, row, your boat\nGently down the stream\n\
    Merrily merrily, merrily, merrily\nLife is but a dream\n\n![](img/59c2bc7e23499c00f04d0ab71fe210db_10_0.png)"
