    \n# 亲爱的学徒：\n\n很高兴你来到 C 城堡！神奇的体验正等待你——你将看到计算机代码转化为经典的童歌和童话！\n\n从前在一个遥远的国家，森林深处有一台魔法计算机。这台电脑使用代码来讲述童歌和童话，代码是一组为让计算机执行任务而编写的指令，例如在屏幕上打印文本或播放视频。\n\
    \n程序是计算机可以运行的代码集合。魔法计算机使用代码讲述童歌和童话，编程语言有自己的一套编写代码的规则，这被称为“语法”。\n\n附近村子里的人偶尔走进森林，听魔法计算机的故事。多年来，存储在计算机上的\
    \ C 程序被编写出来并记录在书中。你现在将看到这些 C 程序。你的旅程刚刚开始！书的最后有关于在计算机上运行程序的指令。\n\n诚挚问候，\nS.E.\n\
    \n![](img/59c2bc7e23499c00f04d0ab71fe210db_7_0.png)\n\n# 敏捷的杰克\n\n杰克敏捷，\n杰克很快，\n\
    跳过蜡烛\n\n```c\n#include <stdio.h>\n\nint main(void) {\n    printf(\"Jack be nimble,\
    \ Jack be quick, Jump over the candlestick\");\n    return 0;\n}\n```\n\n代码行可以用空行隔开以便于阅读。关键字是\
    \ C 中具有特殊含义的词，如下文中的 `int` 和 `return`。\n\n语句是计算机运行（执行）以完成动作的完整程序指令。程序从上到下执行。程序中的第一个语句是\
    \ `printf(\"Jack be nimble, Jack be quick, Jump over the candlestick\");`。\n\n\
    `main()` 是一个函数。代码块（大括号 `{}` 内）包含执行任务的指令。每个 C 程序都需要一个程序开始的 `main()` 函数。这是一个良好的习惯。\n\
    \n`printf()` 是标准库中的一个函数，将文本输出到计算机屏幕。库是预定义函数、数据和其他程序使用的资源集合。C 标准库配合编译器，将你的代码转换为机器指令。\n\
    \n当调用函数名后跟括号时，代码块被运行（执行）。字符串是字符序列——字母、数字、符号——在编写代码时包含在双引号（\"\"）中。“Jack be nimble,\
    \ Jack be quick, Jump over the candlestick”传递给 `printf()`。\n\n`stdio.h` 是一个头文件，包含了标准库输入输出函数所需的信息。使用\
    \ `printf()` 需要通过 `#include` 包含在程序中。\n\n`return` 向运行程序的系统返回一个值 0，通常作为程序成功结束的信号。`int`\
    \ 表示返回值为整数（没有小数点的整数）。`void` 表示 `main()` 函数不接收任何数据。\n\n![](img/59c2bc7e23499c00f04d0ab71fe210db_9_0.png)\n\
