    \ needed for the standard library input and output functions to work. This header\
    \ file is needed to use `printf()`. It is included in the program by `#include`.\n\
    \n`return` returns a value of 0 to the system running the program, which is typically\
    \ used as a signal that the program successfully finishes. `int` indicates the\
    \ return value is an integer (a whole number that doesn't have a decimal point).\
    \ `void` indicates that the `main()` function does not receive any data.\n\n![](img/59c2bc7e23499c00f04d0ab71fe210db_9_0.png)\n\
    \n# Row, Row, Row Your Boat\n\nRow, row, row, your boat\nGently down the stream\n\
