    run the programs on your computer using AC compiler, which converts your source
    code (the code you wrote) into machine code that the computer can execute. There
    are many free C compilers available online. If you search for "free online C compiler",
    you''ll find compilers that run without requiring a download. This is the link
    to a good online C compiler called GDB:


    https://www.onlinegdb.com/online_c_compiler


    Type the code in the editor and click the green Run button at the top. You''ll
    see the output of the printf() functions in the console at the bottom.


    # Common Errors


    Code editors highlight different types of code with different colors, which is
    called syntax highlighting. For example, comments are all highlighted with the
    same color. This makes the code easier to read.


    If you get an error after running the code, fix the code and run it all again!
    There are many common syntax errors. Make sure to:


    +   - Correctly use the assignment operator (=) and equality operator (==).

    - End every statement with a semicolon (;)

    - Insert the correct number of quotation marks and parentheses, and place them
    correctly. You''ll also get an error if you copy and paste quotes (such as from
    a word processor) written in unicode format ("") rather than ASCII format (''!'').
    When you type marks directly into the code editor, it will be in ASCII format.

    - Use open and closing braces around code blocks, including function bodies, loops
    (such as for and while), and conditional statements (such as if and else). Although
    a code block containing only one statement doesn''t require curly braces, it''s
    good practice to include braces in case more lines are added in the future.


