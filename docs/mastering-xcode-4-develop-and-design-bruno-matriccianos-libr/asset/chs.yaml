  \ Instruments 窗口下次将再次提示。\n\n\n\n\n编辑器（图 14.38）只有三个选项。第一个，`Build Configuration`（构建配置），按预期工作。`Release`（发布）构建最符合逻辑也是默认设置，但你也可以创建自己的适用于发布的配置以供此处使用。`Archive\
  \ Name`（归档名称）字段允许你指定用于创建归档的名称。`Options`（选项）部分（只有一个选项）允许你通过复选框指定在操作完成后让 Xcode 在 `Organizer`（组织器）的\
  \ `Archives`（归档）标签页（在第 12 章\n\n### 前置（Pre-Actions）和后（Post-Actions）脚本\n\n你可能注意到了\
  \ `Scheme Editor`（方案编辑器）操作列表中每个操作旁边的展开三角形。展开后，你会看到三个条目（图 14.39）。当你选择某个操作时，你看到的是操作本身的选项（展开操作子项中的中间项），但\
  \ `Pre-`（前置）和 `Post-`（后置）操作呢？`Pre-actions`是在操作开始之前可以完成。`Post-actions` 在之后执行。如果你选择其中一个，你会看到一个空的编辑器。\n\
  \n**图 14.39** 额外操作选项\n\n![image](img/xcode-14-39.jpg)\n\n在 Xcode 4.0 中，有两种不同的前置/后置操作类型可以使用：`execute\
  \ script`（执行脚本）或 `send e-mail`（发送电子邮件）。使用 `Add` (+ ) 按钮，你可以添加一种或多种此类类型的操作。图 14.40\
  \ 显示了一组简单的操作，用于通知可怜的人类（以及他们留尖头发的主人）`Archive`（归档）操作已完成。\n\n**图 14.40** 示例后置操作\n\n\
  ![image](img/xcode-14-40.jpg)\n\n这些到 Xcode 主操作的额外钩子极大地扩展了流程自定义的可能性。请参第 19 章获取更多关于利用\
  \ Xcode 各种脚本钩子的有趣方法的想法。\n\n### 权限（Entitlements，沙箱）\n\n应用程序*沙箱*（sandboxing）是 Mac\
  \ OS X 10.7 中引入的一种安全概念。选择此系统可以通过限制应用程序对各种系统资源的访问（除非在应用程序的 `entitlements` 权限文件中被特别请求）来使你的应用程序更安全。\n\
  \n由于 `Objective-C` 程序的灵活性开放性，外部代码可以“注入”到应用程序中，或者修改应用程序的二进制文件。这些代码将以你的应用程序享有的相同权限运行。通过自愿限制应用程序的系统访问，仅限于其真正需要的资源，你减少了恶意代码在其邪恶的小字节中实现其任何目标的概率。关于这个话题有很多可以说的，而且可能会有很多其他书中讨论，但一如既往，本书的重点是\
  \ IDE，而不是它所帮助你控制的技术。\n\nXcode 让管理应用程序的 `entitlements` 变得简单。要找到它们的设置，导航到所需的构建目标并点击\
  \ `Summary` 标签页。`Entitlements` 部分（图 14.41）包含了一个开关和选项列表。\n\n**图 14.41** Entitlements\
  \ 控制项\n\n![image](img/xcode-14-41.jpg)\n\n***\n\n注意\n\n![image](img/note_02.jpg)\n\
  \n**应用程序沙箱依赖于代码签名。欲需更多信息，请参 [`xcodebook.com/codesigning`](http://xcodebook.com/codesigning)\
  \ 中的代码签名与应用程序沙箱指南。**\n\n***\n\n#### 激活权限和沙箱\n\n你可以通过选择列表顶部的 `Enable Entitlements`\
  \ 复选框为你的应用开启权限。然后你从 `Entitlements File` 弹出窗口中选择一个权限文件。Xcode 会贴心地创建一个与你的目标名称匹配的文件，并将其添加到项目中（图\
  \ 14.42）。该文件是一个简单的偏好列表。你可以使用你在其他地方使用的相同偏好列表编辑器选择它并进行编辑，但使用你现在正在探索的 `Entitlements`\
  \ 部分会更简单。\n\n**图 14.42** Entitlements 文件\n\n![image](img/xcode-14-42.jpg)\n\n要对你的应用程序进行沙箱化，选择\
  \ `App Sandbox` 复选框。现在你必须授予应用程序访问所需的功能。\n\n#### 设置特定权限\n\n`Entitlements` 部分中的剩余设置为你的应用程序授予特定的权限。\n\
  \n##### 文件系统\n\n使用 `File System` 弹出窗口允许你的应用程序读取和写入、只读或对文件系统无访问权限。选择 `Allow Downloads\
  \ Folder Access` 复选框，无论通用文件系统设置如何，都授予对下载文件夹的访问。默认禁止访问文件系统。\n\n##### 网络\n\n使用 `Network`\
  \ 复选框允许传入或传出的连接。默认禁止网络通信。\n\n##### 硬件\n\n使用 `Hardware` 控制允许访问摄像头、麦克风、USB 设备和连接系统的打印机。\n\
  \n##### 应用程序\n\n使用 `Apps` 控制允许访问通讯录和日历数据以及位置服务。\n\n##### 媒体文件夹\n\n使用 `Music`（音乐）、`Movies`（电影）和\
  \ `Pictures`（图片）文件夹允许只读或读写访问。\n\n### 总结\n\n本章涵盖了很多内容，但 Xcode 的新构建系统是最重要的，也是最难理解的概念。IDE\
  \ 是一个帮助你在构建、运行、调试、测试和部署过程中操作的环境。Xcode 4.0 的方法与之前的版本显著不同，正如老手所证实的，这需要学习（或重新学习）。\n\
  \n在下一章中，你将通过进一步探索插件和框架来扩展这些知识。然后在第 16 章中，你将通过将框架项目与 `TestApp` 项目相结合，学习工作区概念以及自动检测的真正威力。\n\
  \n\n\n静态库在构建时由链接器链接到可执行文件中。也就是说，库中的代码会被解档并与你的程序编译后的对象文件（`.o`）一起复制到可执行文件中。静态库会导致可执行文件变大，因为库代码没有共享，而仅仅是“可供复制”。一个常见的静态库示例是\
  \ `libc.a`，即标准 C 库。\n\n## 动态库\n\n动态库可以在启动时或运行时需要时加载。库中的代码是共享的，不属于可执行文件的一部分。这使得启动速度更快、可执行文件更小，并且浪费的空间减少（因为许多可执行文件携带了来自静态库的相同代码）。Cocoa\
  \ 开发者每天使用（可能并没有意识到）的一个流行动态库示例是 `libobjc.a.dylib`，它包含了 Objective-C 运行时库。\n\n## 框架\
  \ (Frameworks)\n\n框架是一个文件和文件夹包，可以包含动态共享库、Interface Builder 文件、本地化（翻译）字符串、头文件和媒体资源。它可能只包含一个动态库，或者只包含资源。如果你使用过\
  \ Cocoa，那么你已经使用过一组框架。\n\n你可能听过人们把 Cocoa 称为“Cocoa 框架”。这是因为 `Cocoa.framework` 实际上是一个包含多个子框架的“伞形框架”。其中一个子框架是\
  \ `Foundation.framework`，它提供了基础字符串、容器类等。在 Mac 上，窗口、按钮和绘图程序等内容来自 `AppKit.framework`，这是一个\
  \ Cocoa 子框架。AppKit 的 iOS 兄弟版本 `UIKit.framework` 也是如此。\n\n除非你的 Cocoa 应用非常简单，否则你很会使用其他由系统或第三方提供的框架，并将它们链接到程序中，以提供核心\
  \ Cocoa 框架本身不具备的功能。至少，你最终可能会使用一个通常情况下不会被自动链接的 Cocoa 框架。事实上，当你创建 TestApp 项目并指定它应使用\
  \ Core Data 时，Xcode 会自动包含 `CoreData.framework` 并将其添加到 TestApp 目标的“与库链接的二进制文件”（Link\
  \ Binary With Libraries）构建阶段。\n\n## 可加载的包 (Loadable Bundles)\n\n包（Bundle）是一种目录结构，在用户看来显示为单个文件。应用程序、框架、插件和内核扩展都是特定种类的包。\n\
  \n*可加载的*包包含了可以在运行时加载和卸载的代码与资源。这允许开发者将应用程序拆分为模块，甚至以插件的形式提供可扩展性。例如，Spotlight 搜索系统自带一组核心插件，教给它如何索引各种类型的文件。第三方开发者可以创建\
  \ Spotlight 导入器插件，允许 Spotlight 索引更多类型的文件（通常由他们自己的应用程序创建的文件）。屏幕保护程序也是另一个例子。每个屏幕保护程序都是一个插件（一个包），教屏幕保护程序如何显示另一种形式的视觉效果，而屏幕保护程序本身则只负责加载效果或在用户移动鼠标时停止（并可能提供密码来解锁屏幕）。\n\
  \nXcode 附带了一系列令人眼目花出的包类型。正如你在上一章中看到的，有模板可以创建用于 Spotlight、通讯录、QuickLook、系统偏好设置、Automator、Dashboard\
  \ 甚至内核的插件。或者，你也可以只选择通用的 Bundle 模板（在“Framework & Library”模板组下找到），并可选地添加你自己的扩展名（例如\
  \ `.testappplugin`）以脱颖而出。\n\n可加载的包就像库或框架，用户可以通过拖放来安装和删除。虽然像 Spotlight 插件通常通常嵌入在应用程序包中（Spotlight\
  \ 会自动找到它们），但它们作为用户可以自行添加或删除的独立插件的威力往往被忽视了。需要注意的是，可加载的包本身也可以是一个产品，也可以是嵌入另一个产品中的组件。\n\
  \n## 使用现有的库和框架\n\n在 Xcode 中使用现有的库或框架非常简单，特别是当作为操作系统的一部分时。至少，你需要将你的目标链接到该库或框架。你已经在第\
  \ 14 章中学习了如何做到这一点。要在代码中使用框架，你可能需要包含它的一个或多个共享头文件。\n\n如果你使用的框架不是操作系统的一部分，你必须将其与你的产品一起分发。这意味着你必须为产品添加一个“拷贝文件”（Copy\
  \ Files）构建阶段，指定要将框架复制到包的 Frameworks 文件夹中。\n\n### 系统框架示例\n\n让我们用 `WebKit.framework`\
  \ 作为一个简单的示例，说明如何使用系统框架为产品添加 Web 浏览功能。你将添加一个包含 Web 视图的简单窗口，它会自动加载 Google 的主页。\n\n\
  #### 链接到框架\n\n要链接到 WebKit，请在项目导航器中选择项目。选择 TestApp 目标，然后点击“构建阶段”（Build Phases）选项卡。展开“与库链接的二进制文件”阶段并点击加\
  \ (+)按钮。会出现一个表单（图 15.1），提示你从可用的系统或工作区库及框架列表中选择，或从其他位置添加另一个。输入 `web` 来过滤列表，选择 `WebKit.framework`\
  \ 并点击添加。除了 `Cocoa.framework` 之外，TestApp 现在将链接到 WebKit，以获得所有的超 Web 能力（图 15.2）。\n\n\
  **图 15.1** 框架和库表单\n\n**图 15.2** 链接阶段中的 WebKit 框架\n\n#### 搭建 UI\n\n为了显示这种强大的力量（以及巨大的责任），你需要添加一些\
  \ UI。导航到 `MainMenu.xib`，它持有 TestApp 的界面。通过从对象库中拖入另一个窗口向界面中添加新窗口，正如你在第 5 章中学习过的那样。我建议使用带纹理的窗口来获得类似\
  \ Safari 的乐趣。在对象库中过滤单词“web”，将一个 Web 视图拖入你的新窗口，并根据喜好进行定位。你应该会得到类似于图 15.3 所示的内容。\n\
  \n**图 15.3** 一个简单的 Web 视图\n\n如果没有可以访问的网站，Web 视图就没什么用处。为了节省时间，假设你的唯一用户是你的奶奶，她当然完全忽略了地址栏，并在\
  \ Google 上搜索每一个 Web 地址。你需要一个 `IBOutlet` 来与 Web 视图通信，这样你就可以告诉它加载 [Google.com](http://Google.com)。使用助手（Assistant）从\
  \ Web 视图拖动连接到 `TestAppAppDelegate.h` 文件，正如你在第 5 章中学习过的那样。将其命名为 `webView`。当你完成后，你的配置应该如图\
  \ 15.4 所示。\n\n**图 15.4** 完成后的工作区更改\n\n### 在代码中使用框架\n\n现在你只需要添加一些代码，在应用程序启动时将 [Google.com](http://Google.com)\
  \ 加到 Web 视图中。在使用 WebKit 的符号之前，必须包含它的主头文件。由于你在 app delegate 的头文件中引用了 `WebView` 作为输出，最简单的方法是在那里导入\
  \ WebKit 头文件。由于助手窗口已打开，请找到源文件顶部的 `#import` 语句，并在其之后的新起一行添加以下代码：\n\n```\n#import\
  \ <WebKit/WebKit.h>\n```\n\n\n\n导航到实现文件 (`TestAppAppController.m`) 并找到 `-applicationDidFinishLaunching:`\
  \ 方法。将以下代码添加到方法体中：\n\n```objc\nNSURL * googleURL = [NSURL URLWithString:@\"http://google.com\"\
  ];\n\nNSURLRequest * request = [NSURLRequest requestWithURL:googleURL];\n\n[[webView\
  \ mainFrame] loadRequest:request];\n```\n\n***\n\n### 提示\n![image](img/tip_01.jpg)\n\
  \n`WebKit.h` 头文件是一个“伞形”头文件，它包含了 `WebKit` 框架中的任何其他头文件。引用此头文件将包含 `WebKit` 中的所有头文件。\n\
  \n***\n\n搞定。运行应用程序。你可能需要找找第二个窗口（看看你熟悉的那个窗口后面），但它应该在那里等着，并且已经加载了 Google 并准备好进行搜索（图\
  \ 15.5]）。去尝试一下吧。\n\n**图 15.5** 一个显示 [Google.com](http://Google.com) 的运行中的 `WebView`\n\
  \n![image](img/xcode-15-05.jpg)\n\n### 负面强化\n\n现在把它弄坏。为了证明使用 Web view 的能力来自于链接了\
  \ `WebKit.framework`，请*取消链接*它。回到项目中的 `TestApp` 目标，然后从 Link（链接）构建阶段中移除 `WebKit.framework`。尝试运行应用。我敢赌你试试。该程序应该在启动时因\
  \ `SIGABRT` 信号而终止，并向调试器控制台抛出一堆消息和堆栈跟踪。控制台消息中最有意思的是第二条，它提到了“`cannot decode object\
  \ of class (WebView)`”，这是一个很好的指标，表明你正在引用尚未加载的库中的符号（通常是因为你没有链接它）。要再次修复它，只需将 `WebKit.framework`\
  \ 重新添加回 Link 构建阶段即可。\n\n### 第三方框架示例\n\n使用第三方框架需要多花一点精力。由于它们不是操作系统的一部分，因此必须与应用程序一起分发。这样做最常用的方法是将框架嵌入应用程序包（bundle）中，这样当用户安装你的应用程序时，它也会随之一起安装。\n\
  \n#### 向项目添加框架\n\n大多数第三方框架都是开源的，许多框架在你的项目中使用之前必须先进行构建。在本示例中，你可以从本书的网站下载一个名为 `Foo.framework`\
  \ 的简单（且几乎毫无用）的框架。直接下载 URL 为*[`files.xcodebook.com/fooframework/FooFramework.zip`](http://files.xcodebook.com/fooframework/FooFramework.zip)*。下载文件并解压内容。你应该看到一个名为\
  \ `Foo.framework` 的文件夹。\n\n***\n\n### 注意事项\n![image](img/note_01.jpg)\n\n你可以跳过将框架拷贝到项目文件夹的操作，但你必须跟踪构建项目所需的所有组件的位置。做到这一点的一种方法是创建一个位置方便的文件夹，命名为\
  \ `Third-Party Frameworks` 或类似的名称，这样无论哪个项目，你都知道它在哪里。\n\n***\n\n要将框架添加到项目中，将 `Foo.framework`\
  \ 拖入项目导航器（Project navigator）并将其掉入 Frameworks 组中（为了整洁，请参考 图 15.6]，尽管你实际上把它拖到哪里并不重要——你可以以最适合自己的方式组织项目）。你在第\
  \ 6 章中遇到的 Add Files（添加文件）面板将会出现（图 15.7]）。确保勾选“拷贝项目到目标组文件夹（如果需要）”（Copy items into\
  \ destination group’s folder）并点击 Finish。该框架将被拷贝到项目文件夹并出现在项目导航器中。\n\n**图 15.6** 通过拖放向项目添加框架\n\
  \n![image](img/xcode-15-06.jpg)\n\n**图 15.7** 通过 Add Files 面板将项目拷贝到项目文件夹\n\n![image](img/xcode-15-07.jpg)\n\
  \n### 链接框架\n\n与上一个示例不同，Xcode 已自动将框架添加到了 `TestApp` 目标的 Link 构建阶段。这是自动为你完成的，因为正如你在图\
  \ 15.7 所示，你接受了 Add to Targets 表的默认设置（即，你要求 Xcode 将框架添加到 `TestApp` 目标）。Xcode 足够聪明，知道库应该被添加到所选目标的\
  \ Link 构建阶段。你可以通过检查目标的 Link 阶段来亲自验证（图 15.8]）。\n\n**图 15.8** 目标 Link 构建阶段中的 Foo 框架\n\
  \n![image](img/xcode-15-08.jpg)\n\n### 嵌入框架\n\n要将框架嵌入应用程序中，导航到 `TestApp` 目标的 Build\
  \ Phases（构建阶段）选项卡。点击窗口底部的 Add Build Phase 按钮并选择 Add Copy Files 来添加一个新的构建阶段。双击新构建阶段的标题并将其更改为\
  \ `Copy Frameworks` 以于清晰。展开构建阶段，并将 Destination（目标）弹出菜单设置为 Frameworks。现在，将 `Foo.framework`\
  \ 从项目导航器拖入 Copy Frameworks 阶段。你的新构建阶段看起来应该像图 15.9]。\n\n**图 15.9** 将 Frameworks 设置为目标向\
  \ Copy Files 构建阶段阶段添加 Foo 框架\n\n![image](img/xcode-15-09.jpg)\n\n***\n\n### 注意事项\n\
  ![image](img/note_01.jpg)\n\n你可以选择在共享位置安装框架，但框架分发的细节超出了本书的范围。请参阅 Apple 文档中的《框架编程指南》以获取更多详情。\n\
  \n***\n\n### 在代码中使用框架\n\n`Foo.framework` 没有包含任何 UI 组件，但它提供了两个类：`MyFoo` 和 `MyBar`。你可以通过创建框架提供的两个类的实例并将它们的描述打印到控制台来验证这一点。你将在应用程序启动时这样做，就像之前的示例一样，导航到\
  \ `TestAppAppDelegate.m` 源文件的 `-applicationDidFinishLaunching:` 方法，并在方法体中添加以下内容：\n\
  \n```objc\nMyFoo * foo = [[[MyFoo alloc] init] autorelease];\n\nMyBar * bar = [[[MyBar\
  \ alloc] init] autorelease];\n\nNSLog(@\"Foo says: %@\", foo);\n\nNSLog(@\"Bar says:\
  \ %@\", bar);\n```\n\n记得添加以下内容以导入框架的头文件：\n\n```objc\n#import <Foo/Foo.h>\n```\n\n\
  ***\n\n### 提示\n![image](img/tip_02.jpg)\n\n如果不确定应该包含哪个头文件，可以使用自动补全（AutoComplete），或者展开项目导航器中的框架本身，打开它的\
  \ Headers 子文件夹查看。此外，大多数框架都有与框架同名的伞形头文件，例如 `Foo.framework` 的 `Foo.h` 或 `WebKit.framework`\
  \ 的 `WebKit.h`。\n\n***\n\n运行 TestApp 并观察调试器控制台的输出。你应该看到如下内容：\n\n```\n2011-03-05\
  \ 15:50:57.623 TestApp[40877:903] Foo says: <MyFoo:0x1006f0b10> - Foo!\n\n2011-03-05\
  \ 15:50:57.623 TestApp[40877:903] Bar says: <MyBar:0x1006f1670> - Bar!\n```\n\n\
  总结，使用第三方框架的额外步骤是：将其添加到项目、在添加时将其拷贝到项目文件夹，以及将其嵌入应用程序包以便分发。\n\n### 创建框架\n\n除了使用系统和第三方框架，创建自己的框架也可能很有用。一个简单的好处是，你可以将\
  \ Mac OS 版本和 iOS 版本之间共享的代码放在一个单一的公共位置。它们都可以链接同一个框架，并从同一源获得改进和错误修复。\n\n为了让你熟悉这一过程，你将在独立的项目中创建一个简单的框架，并学习如何对其进行发布构建以便在其他项目中使用。在第\
  \ 16 章中，你将学习如何将项目合并到一个工作区（workspace），让 Xcode 能够识别其依赖项并自动构建将其包含在 TestApp 中。\n\n####\
  \ 创建项目\n\n\n\n\n要创建一个新项目，从主菜单中选择 `File > New > New Project`。在 `Mac OS X` 栏下选择 `Framework\
  \ & Library` 组。从列表中选择 `Cocoa Framework` 并点击 `Next`。\n\n将出现项目选项表（图 15.10）。在 `Product\
  \ Name` 字段中，输入 `TestAppSharedFramework`，以便将其与 TestApp 项目区分开来。确保 `Company Identifier`\
  \ 值与你为 TestApp 项目提供的值相同也是个好主意。为了简单，你可以取消勾选 `Include Unit Tests` 复选框。点击 `Next`。\n\
  \n**图 15.10** 创建一个新的框架项目\n\n![image](img/xcode-15-10.jpg)\n\n勾选“Create local git\
  \ repository for this project”复选框，并选择包含 TestApp 项目的相同文件夹（TestApp 文件夹的父文件夹）。确保不要将其保存*在*\
  \ TestApp 项目*内*，而是在它的上一层。点击 `Create` 创建项目。你应该会看到一个崭新的项目窗口，如图 图 15.11 所示。\n\n**图\
  \ 15.11** 新框架项目工作空间\n\n![image](img/xcode-15-11.jpg)\n\n### 添加一些代码\n\n正如你在前面的章节中读到的，TestApp\
  \ 对于探索 Xcode 之外的内容并没有特别有用。它的共享框架也不会帮助它在 App Store 上销售，但它*将*成为 第 16 章中一个方便的演示。\n\n\
  首先，框架应该有一个简单的*伞形头文件*umbrella header）——即包含使用该框架所需的所有头文件，并允许其他类进行一站式导入的头文件。要添加此伞形头文件，在项目导航器中选择\
  \ `TestAppSharedFramework`组，然后从主菜单选择 `File > New > New File`。在 `Add File` 表中，选择列表中\
  \ `Mac OS X` 标题下的 `C & C++` 类别，选择 `Header File` 模板（如 图 15.12 所示），并点击 `Next`。在提示保存时，保持文件夹位置、`Group`\
  \ 和 `Add to Targets` 的设置不变，将头文件命名为 `TestAppSharedFramework`（以匹配其父框架的名称），并点击 `Save`。你将有一个空的头文件可供稍后使用。\n\
  \n**图 15.12** 创建一个新的头文件\n\n![image](img/xcode-15-12.jpg)\n\n接下来，你将添加一个简单的类，它的唯一使命是用一个简单的“Hello\
  \ World!”来回答它的 `–description` 方法。重复新建文件（New File）的过程，从 `Cocoa` 类别中选择 `Objective-C\
  \ Class` 模板。当你点击 `Next` 时，在“Subclass of”字段中提供类名 `NSObject`。再次点击 `Next` 即可提示保存。将\
  \ `Save As` 字段中的文件名更改为 `TestFoo`，并点击 `Save`。确保在项目导航器中选中了 `TestFoo.m` 源文件，这样在编辑器中就能看到源代码。在文件末尾\
  \ `@end` 指令的正上方，添加以下方法：\n\n```objc\n-(NSString *)description\n{\n    return @\"\
  Hello World!\";\n}\n```\n\n这使得 `TestFoo` 类在被要求描述时能够打招呼。你稍后会用到它。现在，你需要将它的头文件 `TestFoo.h`\
  \ 添加到框架的伞形头文件中，以便稍后导入。导航到项目导航器中的 `TestAppSharedFramework.h`，并在文件末尾的新的一行添加以下内容：\n\
  \n```objc\n#import \"TestFoo.h\"\n```\n\n你添加到框架的任何其他类都可以以类似的方式包含在这一伞形头文件中。这样一来，当你的框架被使用时，只需要导入一个头文件，它就会带上任何其他类的头文件。\n\
  \n尝试构建（`Command+B`）并验证没有构建问题。框架应该能够顺利构建。\n\n### 配置头文件\n\n为了使用框架的头文件，必须在 `Copy Headers`\
  \ 构建阶段中对其进行配置。要这样做，请导航到项目本身，然后在列表中选择 `TestAppSharedFramework` 目标。接下来，选择 `Build Phases`\
  \ 标签页并展开 `Copy Headers` 阶段（图 15.13）。\n\n**图 15.13** Copy Headers 构建阶段\n\n![image](img/xcode-15-13.jpg)\n\
  \n注意，头文件会自动出现在项目组中。为了使用框架的代码，必须将头文件设置为公开。要这样做，将 `TestAppSharedFramework.h` 和 `TestFoo.h`\
  \ 头文件都拖入 `Public` 组，如 图 15.14 所示。\n\n**图 15.14** 在 Copy Headers 阶段将框架头文件公开\n\n![image](img/xcode-15-14.jpg)\n\
  \n要查看你新创建的框架的内部结构，再次构建一次（`Command+B`），然后展开项目导航器中的 `Products` 组。右键点击（或 Control-点击）`TestAppSharedFramework.framework`\
  \ 产品，并在弹出菜单中选择 `Show in Finder。图 15.15 显示了包含代码库及其公共头文件的完全展开的文件夹结构。\n\n**图 15.15**\
  \ 构建的框架的文件结构\n\n![image](img/xcode-15-15.jpg)\n\n***\n\n> Tip\n![image](img/tip_01.jpg)\n\
  \n**如果你现在想使用此框架，你必须对其归档或手动创建一个发布方案并使用该方案进行构建。请参见 第 19 章 的替代部署构建方法。**\n\n***\n\n\
  就是这些。你拥有了一个功能完整的框架，其中包含可以在多个项目中共享的自定义代码。你将在 第 16 章 中使用该框架。\n\n***\n\n> Tip\n![image](img/tip_02.jpg)\n\
  \n**开发者在开发框架的同时创建测试应用程序目标是非常常见的（并且被认为是良好的做法）。该应用程序用于在开发过程中测试你的框架。**\n\n***\n\n###\
  \ 总结\n\n你已经看到了如何创建插件和框架，并学习了如何在其他项目中使用它们。在下一章中，你将看到如何将多个项目组合到一个工作区中，甚至在它们之间创建依赖关系，这样你就可以在每次构建时构建你的新的\
  \ `TestAppSharedFramework` 框架并将其包含在 TestApp 中。\n\n\n\n\n\n你在第 14 章中学习的自动依赖检测也扩展到了工作空间级别。这意味着，在同一工作空间内，将一个产品的框架包含在应用程序项目的目标中，Xcode\
  \ 通常不需要额外工作即可识别该依赖关系。与同一项目内的依赖目标一样，Xcode 会看到此依赖并在构建应用程序之前构建框架。换句话说，你不需要将共享库拷贝到打算使用该库的每个项目文件夹中。\n\
  \n***\n\n## Note\n\n![image](img/note_01.jpg)\n\n**Xcode 可能无法自动检测复杂的依赖关系。在这种情况下，你需要禁用受影响方案（Scheme）的“查找隐式依赖”（Find\
  \ Implicit Dependencies）设置，并手动添加和排序相互依赖的目标。**\n\n***\n\n工作空间的另一个优势是共享索引。项目索引主要用于代码补全（代码感知）等功能。Xcode\
  \ 的自动代码补全和重构功能将考虑包含在工作空间中的*所有*项目的符号。这意味着，代码补全将自动找到你框架项目的符号，并在编辑使用该框架的应用程序项目源文件时将这些符号供你使用。\n\
  \n工作空间的另一个优势与方案（Schemes）有关。独立项目可能包含一个用于构建、测试和分析主产品的主方案，此外还包含用于较小的依赖目标（例如 Spotlight\
  \ 插件）的方案。在工作空间中，你可能只想看到每个项目主产品的方案。通过你已经在第 14 章中探索过的“管理方案”（Manage Schemes）面板，你可以指定那些较小的“子目标”的方案是在工作空间级别可见，还是仅在单独打开该项目时才可见。这可以帮助保持方案列表简短且易于管理，隐藏工作空间内各种项目中不必要的细节。\n\
  \n## 何时使用工作空间\n\n显而易见，如果没有两个或多个项目，工作空间就是毫无用处的。不那么明显但同样重要的是，工作空间对于多个*不相关*的项目没有帮助。工作空间仅对两个或多个必须共享代码和资源的项目有所帮助。让我们来看两个真实世界的示例。\n\
  \n### 不同的应用程序\n\n想象 Acme 公司拥有一系列互不相关的桌面（甚至是移动）应用程序。在这里，“不相关”意味着一个计算器应用程序、日历应用程序和一个通讯录应用程序。这些应用程序的共同点只有一个：它们都是\
  \ Acme 公司的产品。\n\n由于属于同一个业务实体，这些应用程序可能使用相同的软件注册系统、公司 Logo、联系信息等。它们甚至可以在它们之间共享用户数据。这意味着每个应用程序都将使用相同的代码、资源或两者兼有。\n\
  \n例如，对 `Person` 和 `Event` 类的更改可能需要在通讯录和日历应用程序中同时更新。虽然这些类可能封装也可能未封装在库或框架中，但维护两个 `Person`\
  \ 和 `Event` 副本（每个项目一个）并没什么意义。在这里，创建一个至少包含通用模型层类（以及相应的单元测试）的独立项目是有意义的。创建一个独立的框架项目则更具意义。\n\
  \n由于这些应用程序在其他方面是不相关的，每个应用程序都可能有它自己的工作空间，其中包含应用程序项目和共享框架项目。\n\n### 应用程序套件\n\n想象 Acme\
  \ 公司的桌面日历应用程序取得了任何日历应用程序都未有过的成就。克服重困难，它已成为畅销，用户正要求为他们的各种设备提供移动版本。Acme 公司除了其他共享公司级资源的产品外，现在有了一个支持*两个*平台、共享公司级资源，并且拥有一个设备同步库的产品，让用户在他们的设备和桌面电脑之间共享日历信息。\n\
  \n在这种情况下，拥有一个包含两个应用程序项目（Mac OS 和 iOS）、它们的同步库项目以及公司级资源项目的工作空间是有意义的。\n\n## 创建工作空间\n\
  \n创建工作空间非常简单。从主菜单选择 `File > New > New Workspace`。会弹出一个新的工作空间窗口，并带有“另存为”表格，提示你保存的位置（**图\
  \ 16.1**）。请注意图 16.1 中你在之前的章节创建的两个项目文件夹——`TestApp` 以及你在第 15 章中创建的共享框架。\n\n**图 16.1**\
  \ 保存工作空间\n\n![image](img/xcode_16-01.jpg)\n\n包含这两个项目文件夹的共同父文件夹是存放工作空间文件的好地方，这样很容易找到。输入\
  \ `TestApp Suite` 作为工作空间名称，这样很清楚该工作空间包含了整个 TestApp 应用程序套件的子项目（一个 Mac OS X 应用、一个\
  \ iOS 应用，以及它们之间的一个共享框架，根据你想象中的产品计划）。一旦你选择了名称和位置，点击保存。表格将关闭，给你留下一个令人感到不安的空旷的工作空间窗口。\n\
  \n### 向工作空间添加项目\n\n现在是时候将项目添加到工作空间中了。使用 Finder 导航到包含工作空间和项目的文件夹。对于每个项目（应用程序和框架），找到其\
  \ `.xcodeproj` 文件（**图 16.2**），并将其拖入到 TestApp Suite 工作空间窗口的项目导航器（Project navigator）列表中（**图\
  \ 16.3**）。\n\n**图 16.2** 使用 Finder 定位单个项目文件\n\n![image](img/xcode_16-02.jpg)\n\n\
  **图 16.3** 将项目拖入工作空间\n\n![image](img/xcode_16-03.jpg)\n\n在添加第一个项目后，请注意将后续项目放置在现有项目的*上方*或*下方*，使蓝色插入条尽可能靠左。将项目*拖入*另一个项目会使其成为子项目，这并不是一回事。**图\
  \ 16.4](#ch16.html_ch16fig04)** 显示了 TestApp 项目插入到框架项目的*上方*，而不是*内部*。\n\n**图 16.4**\
  \ 小心地向工作空间插入其他项目\n\n![image](img/xcode_16-04.jpg)\n\n***\n\n## Note\n\n![image](img/note_01.jpg)\n\
  \n**子项目被视为包含它的项目的隐式依赖，如果没有仔细配置，它无法从共享构建位置受益。**\n\n***\n\n### 管理项目依赖\n\n你可以通过将框架添加到\
  \ TestApp 目标的链接（Link）和拷贝框架（Copy Frameworks）构建阶段，允许 TestApp 使用你在第 15 章中创建的共享框架（必要时先构建它）。为此导航到\
  \ TestApp 项目，选择 TestApp 目标，然后选择 Build Phases 选项卡。展开 Link Binary With Libraries 阶段并点击其\
  \ (+) 按钮。将弹出标准的库和框架选择器（**图 16.5**）。\n\n**图 16.5** 从框架和库面板选择框架产品\n\n![image](img/xcode_16-05.jpg)\n\
  \n注意列表顶部新的“Workspace”组。Xcode 知道在 TestApp Suite 工作空间的某个项目中存在一个框架目标。选择 `TestAppSharedFramework.framework`\
  \ 并点击添加。该框架现在是 TestApp 的部分了（图 16.6**）。\n\n**图 16.6** 将 TestApp 产品链接到共享框架\n\n![image](img/xcode_16-06.jpg)\n\
  \n\n\n\n\n要进行测试，请从主菜单中选择 `Product > Clean` 来清理工作区。然后，确保在 `Scheme` 弹出窗口中选择了 `TestApp`\
  \ 方案并编译应用程序。\n\n当然，正如你在第 15 章中所学到的，`TestAppSharedFramework` 并不是系统提供的框架，因此你需要在 `TestApp`\
  \ 中对其进行分发。虽然 `TestApp` 在开发环境中可以运行，但如果你按现状将其分发，它将因为缺少库而崩溃（回想一下在第 15 章中你为外部的 `Foo.framework`\
  \ 添加 `Copy Frameworks` 构建阶段时的做法）。你可以简单地将 `TestApp` 项目中的 `TestAppSharedFramework.framework`\
  \ 拖入 `TestApp` 目标的 `Copy Frameworks` 阶段（**图 16.7**）。\n\n**图 16.7** 将共享框架添加到 Copy\
  \ Frameworks 构建阶段\n\n![image](img/xcode_16-07.jpg)\n\n正如你可能在第 15 章中回想到的，为了使用该框架，你需要包含它的头文件。为了验证一切运行正常，请在\
  \ `TestAppAppDelegate.m` 文件顶部的包含部分添加以下内容：\n\n```objc\n#import <TestAppSharedFramework/TestAppSharedFramework.h>\n\
  ```\n\n在 `-applicationDidFinishLaunching:` 方法的末尾——你现在应该熟悉这个方法了——添加以下代码：\n\n```objc\n\
  TestFoo * testFoo = [[[TestFoo alloc] init] autorelease];\nNSLog(@\"TestFoo says:\
  \ %@\", testFoo);\n```\n\n**图 16.8** 显示了完整的 `-applicationDidFinishLaunching:` 方法。完成后，运行\
  \ `TestApp` 并检查调试器控制台是否有来自 `TestAppSharedFramework` 的 `TestFoo` 类的成功消息。\n\n**图 16.8**\
  \ 完整的 `-applicationDidFinish Launching:` 方法\n\n![image](img/xcode_16-08.jpg)\n\n\
  ## 在工作区中管理方案 (Schemes)\n\n你在第 14 章中学习了管理方案的方方面面。在这里你从另一个角度来管理它们：即存在于工作区中的方案。\n\n\
  你一定注意到，每个项目的方案都出现在你新的 `TestApp Suite` 工作区的 `Schemes` 弹出窗口中。这些方案是继承自它们所属的工作区项目的。**图\
  \ 16.9** 显示了来自 `TestApp` 和 `TestAppSharedFramework` 项目的方案。\n\n**图 16.9** 显示全工作区范围方案的\
  \ Schemes 弹出菜单\n\n![image](img/xcode_16-09.jpg)\n\n从 `Schemes` 弹出窗口中选择 `Manage Schemes`\
  \ 即可显示出你已经熟悉的方案管理器（**图 16.10**）。对于工作区中的每个方案，主要有两个核心问题需要考虑：它是否应该被显示，以及它应该存在于哪个容器中？\n\
  \n**图 16.10** 方案管理器\n\n![image](img/xcode_16-10.jpg)\n\n### 显示与隐藏方案\n\n在图 16.10\
  \ 中，注意方案列表中的 `Show` 列。虽然所有方案在方案管理器中都是可见的，但取消勾选某个方案的 `Show` 复选框会将其从 `Schemes` 弹出控件中移除。\n\
  \n在 `TestApp Suite` 中，你只有一个应用程序及其共享库。从工作区的角度来看，可能有必要只显示应用程序和框架的方案。由于你之前创建的 `TestAppImporter`\
  \ 目标是 `TestApp` 目标的依赖项，你可能不想在工作区视角下看到它。\n\n重要的是，每个方案的 `Show` 设置是持久的，无论你是打开了包含它的工作区还是项目本身，设置都有效。换句话说，如果你更改了项目方案的此设置，该更改将出现在工作区中（如果你在工作区中更改了它，也会出现在项目的设置中）。\n\
  \n### 更改方案的容器\n\n方案管理器的 `Container` 字段指示了方案的存储位置。该字段允许你通过将容器更改为另一个项目来移动方案。当在工作区级别查看方案时，你可以将方案移动并完全包含在该工作区中。这种能力允许你创建一个共享方案，通过该方案从不同的项目中构建一整套产品，而该方案仅在你对整个工作区进行操作时才会出现。\n\
  \n> > 注意\n> ![image](img/note_02.jpg)\n> 记住，方案管理器的 `Shared` 复选框决定了方案是否对打开该项目或工作区的其他用户显示。在团队环境中，可能会至少有一个共享方案——用于构建所有内容的方案。\n\
  \n## 另一种意义的工作区\n\n`workspace`（工作区）一词在软件行业中已经被过度使用了。它在 `Xcode` 中的含义也不例外。`Xcode` 将其新功能称为“workspaces”（这对于一个绑定项目的功能来说是个好名字）是有其道理的，但在更广泛的意义上，你的工作区更多是指你项目的布局和配置。\n\
  \n你的 `Xcode` 工作区包括（其他之外）是否启用某些辅助视图的控件。`Xcode 4` 通过使用行为（behaviors）来帮助你维护工作区。在 `Xcode`\
  \ 的偏好设置（`Command-Comma`）中，`Behaviors` 面板显示了许多配置选项。\n\n### 行为的用途\n\n自定义行为的一个示例是在运行时不显示调试器。\n\
  \n方案管理器的 `Container` 字段指示了方案的存储位置。该字段允许你通过将容器更改为另一个项目来移动方案。当在工作区级别查看方案时，你可以将方案移动并完全包含在该工作区中。这种能力允许你创建一个共享方案，通过该方案从不同的项目中构建一整套产品，而该方案仅在你对整个工作区进行操作时才会出现。\n\
  \n### 定义行为\n\nXcode 在行为面板左侧的列表中提供了许多常见情况。要配置一个行为，请选择、的、的。\n\n### 创建自定义行为\n\n在 `Xcode\
  \ 4.1` 中，Apple 引入了自定义*行为。虽然这些行为不像内置行为那样自动触发，但你可以通过 `Xcode` 应用程序菜单（**图 16.12**）创建它们，或使用自定义快捷键来触发它们。\n\
  \n\n\n\n\n当你按下快捷键（当 Xcode 处于激活状态时）时，边框警告会出现一下（图 16.15）。虽然这看起来不起作用（边框警告功能仅显示自定义告警的名称），但很容易看出，一组简单的快捷键就能轻松地你的\
  \ Xcode 工作区之间在针对当前任务定制的不同配置进行切换。\n\n**图 16.15** 由行为快捷键触发的无用边框警告\n\n![image](img/xcode_16-15.jpg)\n\
  \n### 结语\n\nXcode 新的工作区功能初看似乎可能令人望而畏。你已经看到它其实非常简单。工作区提供了一种将相关项目结合在一起的方法，以利用 Xcode（通常是）智能依赖发现功能。在下一章中，你将探索\
  \ Xcode 一些高级的调试和分析能力。\n\n## 17. 深度调试与分析\n\n在第 9 章中，你通过查看开发者可能使用的最常用功能，已经接触了 Xcode\
  \ 调试和分析能力的边缘。在本章中，你将探索另一个强大的功能——静态分析器——然后深入研究调试导航器（Debug navigator）。之后，你将仔细查看调试器控制台及其一些的命令行界面技巧。你将通过学习如何在设备上或使用\
  \ iOS 模拟器调试 iOS 来完成这次之旅。\n\n### 使用 Clang 静态分析器\n\nLLVM（模块化编译器）通过其 C 语言族前端 `Clang`\
  \ 提供静态分析功能。`Clang Static Analyzer` 执行语义分析，可以发现逻辑问题、内存管理错误、死存储（未使用变量）以及 API 使用问题。此功能直接内置在\
  \ Xcode 中。\n\n当你调用 Xcode 的 Analyze（分析）操作时，分析器会工作以识别你代码中的问题。如果发现问题，它会在源编辑器（Source\
  \ Editor）和问题导航器（Issue navigator）中与错误和警告一起被标记出来（图 17.1）。点击编辑器或问题导航器中的问题，将显示编辑器中关于该问题的详细信息，包括有用的蓝线，指示了问题的代码路径，并对沿途的错误行为进行了描述（图\
  \ 17.2）。\n\n**图 17.1** 静态分析器标出的问题\n\n![image](img/xcode-17-01.jpg)\n\n**图 17.2**\
  \ 展开为步骤的静态分析器问题\n\n![image](img/xcode-17-02.jpg)\n\n* * *\n\n提示\n\n![image](img/tip_01.jpg)\n\
  \n**Clang 静态分析器可以作为独立工具运行，提供分析结果的文本输出。它与 Xcode 的集成才提供了更好的图形化界面。**\n\n* * *\n\n对于跨越较长代码段的问题，遵循所有的蓝色曲线线可能会令人困惑。Xcode\
  \ 通过两种方式帮助你解决这个问题。首先，在问题导航器中展开分析器问题，会显示出问题代码路径中的各个点。其次，也是最有帮助的一点，编辑器顶部会出现一个分析器结果条（类似于搜索栏）（图\
  \ 17.3）。此栏允许你逐步导航分析器问题，以便更容易跟随分析器的诉求。\n\n**图 17.3** 源编辑器顶部的分析器结果条\n\n![image](img/xcode-17-03.jpg)\n\
  \n你可以通过 Instruments（参见第 20 章）和使用严格的警告级别发现以下某些问题，但分析器可以在你编写代码时发现它们，并准确告诉你在哪里以及如何出错。Apple\
  \ 官方文档建议养成早期且频繁分析的习惯。\n\n* * *\n\n注意\n\n![image](img/note_02.jpg)\n\n**记住，错误、警告和分析器结果被称为“问题（issues）”。**\n\
  \n* * *\n\n### 探索分析结果\n\n以下是静态分析器可以为你识别的一些类型问题示例，并对每个结果进行了了演示。\n\n#### 内存泄漏\n\n\
  Cocoa 应用程序中内存泄漏的简单描述是：你丢失了某个对象的任何引用，因此无法再让它释放内存并。从这个意义上说，该对象的内存被“泄漏”了，因为它在应用程序的剩余生命周期内无法被收回。此外，该对象持续存在，取决于该对象的功能，可能会导致意外之外且有时是非常糟糕的行为。\n\
  \n图 17.2 显示了内存泄漏的分析结果。在这种情况下，一个 `NSString` 泄漏了。从 `-init` 方法顶部开始，遵循执行路径穿过该方法。问题被分解为代码中导致它的两个“步骤”。\n\
  \n在第一步中，第 16 行的指令返回了一个引用计数为 +1 的对象（这在内存管理环境中意味着你有责任在需要时妥善地释放该对象）。在第二步中，方法在返回之前没有先释放（或自动释放）该\
  \ `NSString` 实例。这意味着 `NSString` 实例在此时已经泄漏了。\n\n在示例中，修复方法很简单：只需取消第 19 行的注释，在该处字符串实例（分配给\
  \ `message`）被发送了 `-release`（或者你也可以给它发送 `-autorelease`）。\n\n* * *\n\n注释\n\n![image](img/note_01.jpg)\n\
  \n**由于若干原因，使用的代码示例只是“粗略的演示”，不应作为良好实践的示例。**\n\n**这里的内存管理描述是简化的，但细节超出了本书的范围。对于本章而言，内存管理问题指的是手动内存环境（而非垃圾回收环境）中的\
  \ Objective-C 对象。**\n\n* * *\n\n#### 内存过度释放\n\n同样用简单的话说，Cocoa 应用程序中的内存过度释放是指对象被发送了多次\
  \ `-release`，导致其内存过早释放。随后对其进行的任何通信都会导致你的应用程序崩溃。在图 17.4 中，分析器在第 27 行发现潜在的过度释放场景。\n\
  \n**图 17.4** 静态分析器标记的内存问题\n\n![image](img/xcode-17-04.jpg)\n\n展开后（点击编辑器中的蓝色问题条），你会看到问题的描述要复杂得多（图\
  \ 17.5）。这次有四个步骤需要遵循。某些蓝色箭头是加粗的，某些是浅色的。两个步骤位于第 27 行（通过点击右侧的收叠三角形可以看到）。\n\n**图 17.5**\
  \ 静态分析器揭示的内存复杂性\n\n![image](img/xcode-17-05.jpg)\n\n为了理解所有这些，使用分析结果导航器中的箭头按钮在步骤之间跳转会有帮助。当你导航高亮的代码路径时，你会注意到不同的箭头组被加粗，以强调该路径上的特定步骤。在图\
  \ 17.6 中，选择了第二步，因此 Xcode 高亮了从第 22 行到 26 行再到 27 行的执行流，在那里分析器告诉你如果第 26 行的 `if` 条件满足，则第\
  \ 22 行创建的对象将被释放。\n\n**图 17.6** 内存问题的突出显示第二步\n\n![image](img/xcode-17-06.jpg)\n\n\
  逐步查看问题，你会看到图 17.5 中显示的第一个步骤告诉你一个对象被创建并分配给 `objectID`，引用计数为 +1，这意味着你负责释放它。\n\n\n\n\
  \n\n图 17.6 中的第二步显示该对象在第 27 行被释放。虽然不能保证其引用计数（retain count）现在为零（从而将其标记为待释放内存），因为其他对象可能在此之后又留存了它的引用，但第三步（未显示）演示了代码路径返回到它所处循环的头部。\n\
  \n第四步也是最后一步（图 17.7）揭示了最终结果：如果某次第 20 行的 `if` 条件评估为假，则问题对象将在释放后被访问。\n\n**图 17.7**\
  \ 内存问题的高亮第四步\n\n![image](img/xcode-17-07.jpg)\n\n这很好地演示了静态分析器交到手中的力量。它会遵循你代码中所有可能的路径，如果遵循了某个逻辑分支，它就会高亮问题。\n\
  \n* * *\n\n注意\n\n![image](img/note_01.jpg)\n\n**静态分析器足够智能，能够识别你的代码中何时不支持 Objective-C\
  \ 垃圾回收、支持或需要，并针对内存管理相关问题进行相应调整。**\n\n* * *\n\n### 逻辑错误\n\n逻辑错误可能会导致崩溃或更微妙的问题。在复杂代码中，它们很容易被忽略且难以调试，但静态分析器可以轻松地发现并高亮它们。\n\
  \n逻辑错误的一种类型是使用未初始化的变量。声明时未赋初始值的变量可能指向 RAM 中散落的任何旧垃圾数据。尝试访问该变量将得到未定义的值或垃圾值。图 17.8\
  \ 在一个基础场景中演示了这个问题（图中高亮了第二步）。\n\n**图 17.8** 由静态分析器标记的逻辑问题\n\n![image](img/xcode-17-08.jpg)\n\
  \n在第 20 行，声明了一个名为 `positiveFlag` 的 `BOOL` 变量，且没有赋初始值。由于 `if`/`else if` 块中（第 22-27\
  \ 行）的代码可能不会被执行，因此在第 29 行返回值之前，`positiveFlag` 可能从未被分配定义值。\n\n### 线程与堆栈\n\n第 3 章 引入了调试导航器（Debug\
  \ navigator），第 9 章 带你仔细查看了典型开发者最经常使用的功能。在这里，你将看到其他经验更丰富的开发者会寻找的特征。\n\n#### 审查调试导航器\n\
  \n调试导航器底部的按钮栏有两个控件（图 17.9）。当激活时，工具栏左侧的按钮会过滤掉任何与当前调试会话不相关的线程。也就是说，只会显示崩溃的线程以及具有可用调试符号的线程（即你拥有源代码或已保存调试符号的线程）。当按钮处于未激活状态时，会显示所有线程。\n\
  \n**图 17.9** 调试导航器的底部控制栏\n\n![image](img/xcode-17-09.jpg)\n\n滑块控制影响你看到的每个线程堆栈深度。当滑块完全滑到左侧时（图\
  \ 17.10），仅显示每个线程堆栈的顶部帧（frame）。当滑块完全滑到右侧时（图 17.11），将显示每个线程堆栈的所有帧。当你从右向左滑动控制控件时，Xcode\
  \ 开始通过过滤掉代表递归函数调用、内部 Cocoa API 调用、已反汇的对象代码以及最后所有不属于你工作区的代码来折叠堆栈。图 17.12 显示了滑块位于右侧四之三处，堆栈折叠部分用虚线表示。\n\
  \n**图 17.10** 最小堆栈\n\n![image](img/xcode-17-10.jpg)\n\n**图 17.11** 完整堆栈\n\n![image](img/xcode-17-11.jpg)\n\
  \n**图 17.12** 半过滤堆栈\n\n![image](img/xcode-17-12.jpg)\n\n你之前在章节中也学过，可以通过点击调试导航器中的堆栈帧来导航到方法。如果该帧有源码或反汇编的对象代码，它将显示在编辑器区域。\n\
  \n#### 使用调度队列（Dispatch Queues）\n\n随着 Mac OS X 10.6，Apple 引入了 Grand Central Dispatch\
  \ (GCD)。这一新功能让开发者能够更容易利用多核处理器。Grand Central Dispatch 并不是关注线程、线程池管理及其涉及的深度复杂性，而是将这些概念抽象为“提交到队列的工作单元”。\n\
  \n队列充当后台任务的逻辑分组，并在运行时创建。队列可以被暂停和恢复，可以串行或并行处理任务，甚至可以赋予简单的名称以帮助开发者进行调试。默认情况下，你的应用程序主线程运行在名为\
  \ `com.apple.main-thread` 的调度队列中。你可能会创建一个队列将图片处理成缩略图（每张图片一个任务）。\n\n在调试导航器中，你可以为它们命名以便清晰地识别。图\
  \ 17.13 显示了按队列调试。在这里，TestApp 暂停在 `-applicationDid:` 方法中，该方法属于 `com.apple.main-thread`\
  \ 队列。\n\n**图 17.13** 按队列调试\n\n![image](img/xcode-17-13.jpg)\n\n* * *\n\n提示\n\n![image](img/tip_01.jpg)\n\
  \n**访问 [`developer.apple.com`](http://developer.apple.com) 获取更多关于 Grand Central\
  \ Dispatch 的信息。**\n\n* * *\n\n记住这一点最重要的，在使用 Grand Central Dispatch 创建自己的队列时，将在第\
  \ 20 章 使用 Instruments 时发现这一点。\n\n#### 挂起线程\n\n尽管有了 Grand Central Dispatch，线程仍然是线程，典型的\
  \ Cocoa 应用程序无论你是否创建，都有线程在运行。如果你直接创建了某些线程，很可能是你第一次做错了，导致程序冻结、崩溃或运行异常。在这种情况下，在运行时挂起线程是有帮助的，以防止它干扰应用程序的其他部分，或者仅仅对其进行检查。\n\
  \n挂起线程非常简单。确保你已经在调试器中暂停了应用程序（通过断点或使用调试器栏中的暂停按钮），然后在调试导航器中右键点击（或 Control 点击）该线程，从菜单中选择\
  \ `Suspend Thread`（挂起线程）。该线程右侧会出现一个红色指示器，显示它处于挂起状态。此时你可以恢复应用程序（通过点击调试器栏中的继续按钮），在应用程序运行业务逻辑时，该线程将保持挂起状态。若要恢复该线程，你需要再次暂停，右键点击（或\
  \ Control 点击）已挂起的线程，并从菜单中选择 `Resume Thread`（恢复线程）。\n\n\n\n\n挂起线程可能会导致意外的后果，运气好会让你的应用程序运行异常，最坏的情况下会导致数据损坏、冻结或崩溃。例如，暂停一个持有锁的线程可能会导致其他线程死锁。请谨慎使用。\n\
  \n*\n\n## 检查内存\n\n除了允许你设置观察点（watches，指令 Xcode 在内存地址发生变化时通知你）之外，Xcode 4 还允许你查看内存中位置的内容。给定一个内存地址（通常通过使用它的某个特定变量找到），Xcode\
  \ 可以让你直接检查内存内容。当你想要知道变量的值何时发生变化，以及内存中某个位置或区域变化的精确性质时，这些工具非常有用。\n\n## 观察地址\n\n对变量的内存地址设置观察点并在内容变化时接收通知，是大多数\
  \ IDE 的常用功能。在 Xcode 4 中，这可以通过暂停调试器并显示 Debug 区域的变量（Variables）视图（图 17.14），然后右键点击变量并从菜单中选择\
  \ Watch Address of “variable 变量名”来实现。\n\n**图 17.14** Debug 区域中的变量视图\n\n![image](img/xcode-17-14.jpg)\n\
  \n图 17.15 显示了如何为你之前的章节在 TestApp 中创建的 `bar` 变量设置观察点。设置观察点后立即不会发生任何特殊情况。只有当被观察变量地址的内容变化时，你才会在调试器控制台中收到通知。\n\
  \n**图 17.15** 设置观察点\n\n![image](img/xcode-17-15.jpg)\n\n在图 17.16 中，你看到第 47 行的指令已执行，将新创建的对象赋值给\
  \ `bar` 指针。该地址的内存已更新指向新对象的地址，因此 `bar` 指针内存地址的内容现在是赋值给它的新创建对象的内存地址。这些信息显示在控制台中。\n\
  \n**图 17.16** 更新后的 `bar` 指针\n\n![image](img/xcode-17-16.jpg)\n\n观察地址是查看内存中特定变量情况的一种快速且粗暴的方法，但它就像通过钥匙孔观察内存。Xcode\
  \ 提供了一种更好的方法来查看你应用程序内存的内容。\n\n## 查看内存\n\n检查应用程序内存内容的更简单方法是至少暂时暂停应用程序，并通过代表该内存的变量找到你想要查看的内存地址。这与设置观察点的方法相同。但这一次，当你右键点击变量时，从菜单中选择\
  \ View Memory of “变量名”。调试器导航器（Debug navigator）中将出现一个名为 Memory 的新组，你选择要查看的地址将位于其下方（图\
  \ 17.17）。当在调试器导航器中选择某个内存地址进行查看时，内存的内容将显示在编辑器（Editor）区域中（图 17.18）。\n\n**图 17.17**\
  \ 添加到调试器导航器的内存视图\n\n![image](img/xcode-17-17.jpg)\n\n**图 17.18** 内存视图\n\n![image](img/xcode-17-18.jpg)\n\
  \n该视图通过其底部的控件进行操作（图 17.19）。Address 字段显示视图将开始的精确内存地址。内存页（Memory Page）控件允许你向前向后翻页。字节数（Number\
  \ of Bytes）控制允许你调整正在查看的内存页大小。字节分组（Byte Grouping）控制允许控制多少个字节被分组为一个字（word）。\n\n**图\
  \ 17.19** 内存视图控件\n\n![image](img/xcode-17-19.jpg)\n\n锁定（Lock）按钮的行为不如其他部分直观。你的第一反应可能是它锁定了内存内容，防止其被修改。事实并非如此。相反，它让你锁定当前视图的内容不再更新。由于内存视图通常随着内存的变化而更新，锁定显示可以防止其更新，直到你再次解锁。在执行继续时，内存将照常继续发生变化（或不变），但显示的内容将保持锁定时的状态。\n\
  \n由于内存地址仅在应用程序运行时有效，当调试会话结束时，所有查看过的地址都将从调试器导航器中移除。如果你想在会话期间移除某个地址，只需选择它并按 Delete\
  \ 键即可。\n\n## 与控制台交互\n\n调试器控制台是你访问调试器的命令行界面。无论你使用 GDB 还是 LLDB，你都可以做的不仅仅是读取应用程序输出的消息。两个调试器都提供了\
  \ Xcode 以图形界面提供的相同功能的命令行界面。尽管如此，通过控制台向调试器发送几个快速命令（图 17.20）是有帮助的。特别是当你想要结果的文本转储时。\n\
  \n**图 17.20** 调试器控制台\n\n![image](img/xcode-17-20.jpg)\n\n为了向调试器发布命令，你必须点击控制台内部将光标置于右侧。以下是一些可以通过控制台完成的常用任务。注意：截至本文，GDB\
  \ 中可用的命令在 LLDB 中是不完整的。\n\n*\n\n### 打印对象和值\n\n有几种不同的方法可以通过控制台打印对象和值。你使用的命令取决于你想看到什么信息。\n\
  \n### 打印对象\n\n“打印对象”（po）是 Cocoa 开发者最常用的调试器命令。它会让 Objective-C 对象打印其 `-description`\
  \ 方法的结果。继承自 `NSObject`，该方法返回一个描述对象的字符串。当应用程序处于暂停状态时，当前堆栈中的所有符号对你都是有效的。这让你检查对象的引用。\n\
  \n要打印对象，需要在调试器中暂停应用程序。通常使用断点是最方便的。暂停后，找到感兴趣的对象打印。图 17.21 显示 TestApp 再次在 `-applicationDidFinishLaunching:`\
  \ 方法中暂停。这次它位于创建 `NSURL` 对象并将其赋值给变量 `googleURL` 的行下方，提供了一个方便打印的对象。要打印赋值给 `googleURL`\
  \ 的对象，在控制台中输入以下命令并按回车：\n\n```\npo googleURL\n```\n\n**图 17.21** 调试器中的 TestApp\n\n\
  ![image](img/xcode-17-21.jpg)\n\n调试器将响应并记录 `NSURL` 对象请求其 `-description` 时返回的字符串。图\
  \ 17.22 显示了调试器控制台中的结果。\n\n**图 17.22** 在调试器控制台中打印对象\n\n![image](img/xcode-17-22.jpg)\n\
  \n当你停止属于 Objective-C 类实例的方法内部时，你也可以打印 `self`。在示例的当前范围内，`self` 指向 `TestAppAppDelegate`\
  \ 类的实例。图 17.23 显示在该范围内打印 `self` 的结果。在这种情况下，`TestAppAppDelegate` 类没有重写 `-description`，因此显示的信息是继承自\
  \ `NSObject` 的默认描述格式。即类名和正在打印实例的地址。\n\n**图 17.23** 打印 `self`\n\n\n\n\n![image](img/xcode-17-23.jpg)\n\
  \n当然，你也可以通过其他对象的访问器来打印对象。例如，`NSURL` 有一个名为 `-scheme` 的字符串属性。要打印赋值给 `googleURL` 的\
  \ `NSURL` 实例的方案，你可以执行以下命令：\n\n```\npo [googleURL scheme]\n```\n\n调试器会调用 URL 对象的\
  \ `-scheme` 方法，然后调用返回对象的 `-description` 方法并打印出内容：\n\n```\nhttp\n```\n\n你在示例中看到的这些信息并不特别令人兴奋，但它们足以在打印的\
  \ `NSArray` 或 `NSDictionary` 对象中区分两个相似的对象。虽然 Cocoa API 中的许多对象都自带了相当实用的描述，但开发者需要在在自己的对象中重写\
  \ `-description`，并为自己的调试提供有意义的描述。\n\n## 打印值\n\n`po` 命令仅对对象有效。那么原始类型（primitives）的值呢？如果你出于某种原因想知道\
  \ URL 对象的 scheme 返回的字符串长度该怎么办？你可能认为以下命令可以工作：\n\n```\npo [[googleURL scheme] length]\n\
  ```\n\n它将不起作用，因为 `NSString` 的 `-length` 方法返回一个 `NSUInteger`——这是一个原始类型，而不是对象。对于原始值，你需要使用不同的打印命令。\n\
  \n```\np (NSUInteger)[[googleURL scheme] length]\n```\n\n调试器的响应如下：\n\n```\n$1 =\
  \ 4\n```\n\n字符串 `http` 中确实有四个字符。让我们快速查看一下该命令及其响应的结构。\n\n命令 `p`（print 的缩写）期望你提供的待求值语句结果（`[[googleURL\
  \ scheme] length]`）被转换为预期的类型（`NSUInteger`），以便它知道如何表示该结果。该类型应该是最终返回该值的方法或函数的返回类型（嵌套调用中最外层的调用）。在\
  \ `NSString` 的 `-length` 方法中，类型是 `NSUInteger`。\n\n这个响应实际上比看起来更有趣。调试器不仅打印了结果，还体贴地将其赋值给一个局部变量，供你在以后的评估中使用。在这个示例中，数字\
  \ 4（方案方案字符串的长度）被赋值给变量 `$1`。使用它非常简单。想象你无法在脑中算出将长度乘以 2 所需的计算。没问题！GDB 可以为你完成！\n\n```\n\
  p (NSUInteger)($1 * 2)\n```\n\nGDB 执行了这一复杂的计算并响应：\n\n```\n$2 = 8\n```\n\n注意即使是该评估也被赋值了一个新变量\
  \ `$2`。`print` 还有很多技巧，你可以在 [`xcodebook.com/printf`](http://xcodebook.com/printf)\
  \ 找到，但我们继续吧。\n\n## 查看回溯 (Backtrace)\n\n应用程序中当前（暂停）点的的回溯与调试器导航器中暂停线程下方显示的信息相同：堆栈。虽然\
  \ Xcode 的用户界面提供了格式良好的信息，可以用于导航和控制调试会话，但对于与论坛或邮件列表上的其他人共享信息来说并不方便。获取回溯的文本表示通常很有帮助。假设\
  \ `TestApp` 仍然暂停在之前示例相同的位置，执行回溯命令（`bt` 的缩写）将产生以下输出：\n\n```\n#0   -[TestAppAppDelegate\
  \ applicationDidFinishLaunching:] (self=0x10015e520, _cmd=0x7fff84ad29c5, aNotification=0x114029af0)\
  \ at /Users/jnozzi/Path/To/TestApp Suite/TestApp/TestAppAppDelegate.m:42\n#1   0x00007fff83b568ea\
  \ in _nsnote_callback ()\n#2   0x00007fff835f1000 in __CFXNotificationPost ()\n\
  #3   0x00007fff835dd578 in _CFXNotificationPostNotification ()\n#4   0x00007fff83bd84e\
  \ in -[NSNotificationCenter postNotificationName:object:userInfo:] ()\n#5   0x00007fff83e3e3d6\
  \ in -[NSApplication_postDidFinishNotification] ()\n#6   0x00007fff83e3e30b in -[NSApplication_sendFinishLaunchingNotification]\
  \ ()\n#7   0x00007fff83f09305 in -[NSApplication(NSAppleEventHandling)_handleAEOpen:]\
  \ ()\n#8   0x00007fff83f08f81 in -[NSApplication(NSAppleEventHandling)_handleCoreEvent:withReplyEvent:]\
  \ ()\n#9   0x00007fff83b84e42 in -[NSAppleEventManager dispatchRawAppleEvent:withRawReply:handlerRefCon:]\
  \ ()\n#10 0x00007fff83b4c72 in _NSAppleEventManagerGenericHandler ()\n#11 0x00007fff88b50323\
  \ in aeDispatchAppleEvent ()\n#12 0x00007fff88b5021c in dispatchEventAndSendReply\
  \ ()\n```\n\n\n\n\n\n在图 17.24 中，显示了所有包含的头部的内容。编辑器底部的工具栏有两个控件。`Refresh` 按钮会强制重新生成内容。弹出窗口允许你选择要生成输出的构建操作。由于各种构建操作（运行\
  \ Running、分析 Profiling、存档 Archiving 等）之间存在差异，此功能非常有帮助。图 17.25 显示了同一文件的汇编代码。\n\n\
  **图 17.25** 来自 `TestAppAppDelegate.m` 的汇编输出\n\n![image](img/xcode-17-25.jpg)\n\n\
  ### 使用助手编辑器 (Assistant)\n\n助手编辑器也可以保持此输出可见。使用 `Generated Output` 模式并选择 `Preprocessed\
  \ content` 或 `Assembly content`。当调试器暂停时，你可以通过使用助手的 `Disassembly` 模式查看反汇代码（图 17.26）。\n\
  \n**图 17.26** `TestAppAppDelegate.m` 的反汇编\n\n![image](img/xcode-17-26.jpg)\n\n###\
  \ 为 iOS 设备调试应用\n\n到目前，你对 Xcode 的大部分探索都是通过 Mac OS X 应用程序完成，因为这样更容易演示。然而，如果你恰好是一个\
  \ iOS 开发者（或计划成为开发者），由于硬件差异，这种方法将不起作用。因此，你的调试必须使用 iOS 模拟器或连接并配置好的 iOS 设备来完成。\n\n\
  对于本次演示，你需要创建一个 iOS 项目。将其命名为 `TestApp Touch`。参考第 2 章复习如何创建新项目。在 `New Project` 模板选择器（图\
  \ 17.27）中，选择 `iOS` 组下的 `Application` 列表，选择 `Tab Bar Application` 并点击 `Next`。在下一页（图\
  \ 17.28）中，指定名称和公司标识符，将 `Device Family` 弹出窗口设置为 `iPhone`，不包含单元测试，并点击 `Next`。在提示时，将项目保存在与你的\
  \ `TestApp Suite` 工作空间相同的文件夹中。\n\n**图 17.27** 新项目模板页\n\n![image](img/xcode-17-27.jpg)\n\
  \n**图 17.28** iPhone 项目设置\n\n![image](img/xcode-17-28.jpg)\n\n***\n\n注意\n\n![image](img/note_01.jpg)\n\
  \n**你必须订阅 Apple 的 iOS Developer Program 才能在 iOS 设备上测试和调试应用程序。请参见附录 A 有关为开发配置 iOS\
  \ 设备的详情。**\n\n***\n\n完成后，你应该拥有一个像图 17.29 那样的新项目。此时，最好关闭项目以避免混淆，在 `Finder` 中导航到它，并将其拖入你的\
  \ `TestApp Suite` 工作空间，正如你在第 16 章中所学会的那样。\n\n**图 17.29** 新的 iPhone 项目\n\n![image](img/xcode-17-29.jpg)\n\
  \n如果你查看 `Schemes` 弹出窗口，你会看到 `TestApp Touch` 至少有两个新的运行目标（针对 `iPhone` 和 `iPad Simulators`）（图\
  \ 17.30）。其中一个模拟 `iPhone`，另一个模拟 `iPad`。如果你已经连接并配置了任何 iOS 设备（参见附录 A），它们也会作为单独的运行目标显示。\n\
  \n**图 17.30** 带有一些新运行目标的 Schemes 弹出窗口\n\n![image](img/xcode-17-30.jpg)\n\n### 退出应用程序\n\
  \n似乎需要一个关于退出应用程序的章节，这很奇怪。其是，许多新的 iOS 开发者在按下设备上的 `Home` 按钮或 `Simulator` 时，如果应用程序在\
  \ `Xcode` 中继续运行，他们会感到困惑。这是因为 iOS 在按下 `Home` 按钮时处理应用程序的方式。\n\n最新版本的 iOS 中的应用程序可以在后台暂停（除非它们退出了此功能）。这意味着应用程序在技术上仍在运行，它只是被挂起了。除非你的应用程序选择退出“后台化”状态，否则当你按下\
  \ `Home` 按钮时，它不会退出（也不会结束 `Xcode` 调试会话）。\n\n在调试 iOS 应用程序时，有两种方法完全退出：在 `Simulator`\
  \ 中按 `Command+Q` 退出整个 `iOS Simulator`，或者点击 `Xcode` 工具栏中的 `Stop` 按钮。\n\n### 使用 iOS\
  \ 模拟器\n\n你已准备好在 `iOS Simulator` 中运行 iOS 应用程序。你需要确保已从 `Schemes` 弹出窗口中选择了带有 `iPhone\
  \ Simulator` 运行目标的 `TestApp Touch` 方案，如图 17.30 所示。现在只需像常常一样运行应用程序——按下 `Run` 按钮或\
  \ `Command+R`。\n\n`Simulator` 应用程序将启动并显示一个 `iPhone` 的模型，你的应用程序将在其中启动（图 17.31）。尽管它的两个面板由底部的\
  \ `tab bar` 控制，但该应用程序并不特别有趣，不过它是功能性的。\n\n![image](img/iossimulatoricon.jpg)\n\n\
  **图 17.31** iOS 模拟器中的 TestApp Touch\n\n![image](img/xcode-17-31.jpg)\n\n`Simulator`\
  \ 旨在作为你的主要测试和调试环境，但在部署之前在设备上进行测试不仅是高度建议的，而且应该是一项法律。尽管如此，`Simulator` 需要能够模拟所有的硬件、事件、方向、低内存警告等，就像应用程序运行在设备上一样一样。以下是你需要理解的主要功能。\n\
  \n#### 多点触事件 (Multi-Touch Events)\n\n新开发者对 `Simulator` 提出的第一个问题之一是如何生成多点触事件。虽然所有的单指手势都通过点击或拖动处理，但双指事件（如张开或捏合手指）构成了挑战。\n\
  \n`iOS Simulator` 通过 `Option` 和 `Shift` 键非常很好地解决了这个问题。在指针悬停在模拟屏幕上时按住 `Option` 键显示两个点（代表两个手指），如图\
  \ 17.32 所示。在按住 `Option` 键时移动鼠标以更改“手指”之间的宽度。点击并拖动鼠标开始手势；释放鼠标完成手势。如果你需要将双指手势移动到其他地方（例如屏幕键盘上方），像之前一样按住\
  \ `Option` 键，同时按住 `Shift` 键将两个手指一起移动到屏幕的不同部分，在移动手势位置完成后释放 `Shift` 键。\n\n**图 17.32**\
  \ 模拟器中的双指手势\n\n![image](img/xcode-17-32.jpg)\n\n#### 设备与版本\n\nXcode 工具自带一个器统治天下。也就是说，`Simulator`\
  \ 可以配置为模拟 `iPhone`、视网膜分辨率的 `iPhone` 或 `iPad`。你可以从 `Hardware > Device` 主菜单下选择所需的设备。你可以从\
  \ `Hardware > Version` 主菜单下选择旧的 iOS 版本。\n\n#### 旋转\n\n由于 iOS 设备能够感知其物理屏幕方向，你需要能够模拟用户旋转设备，以便测试应用程序如何响应方向变化（如果你的应用程序支持该）。希望你的应用程序比社会某些部分对人们经历方向变化时更有包容。\n\
  \n要更改设备方向，按住 `Command` 键并按下左或右箭头。模拟设备将向你选择的方向旋转。如果你的应用程序支持各种方向，它应该自动重塑其用户界面以适应新方向。如果不支持，你会看到类似图\
  \ 17.33 所示的内容。\n\n**图 17.33** 模拟设备方向变化（此应用尚未支持方向变化）\n\n![image](img/xcode-17-33.jpg)\n\
  \n\n\n\n为了让这个简单的模板应用程序支持所有方向，你需要做两件事。首先，导航到项目并在 `Targets` 列表中选择 `TestApp Touch`\
  \ 目标。在 `Summary` 选项卡下，确保“Supported Device Orientations”（支持的设备方向）下的所有按钮都已选中（图 17.34）。默认情况下，只有“Upside\
  \ Down”（倒置）未被选中为支持。然后，你需要让应用程序的视图控制器（`FirstViewController.m` 和 `SecondViewController.m`）知道允许自动旋转以匹配任何方向。对于每个视图控制器文件，找到\
  \ `-shouldAutorotateToInterfaceOrientation:` 方法并将其修改为始终返回 `YES`。两个文件的方法应该像下面的代码所示。\n\
  \n**图 17.34** 设置支持的设备方向\n\n![image](img/xcode-17-34.jpg)\n\n```objc\n-(BOOL)shouldAutorotateToInterfaceOrientation:\
  \ (UIInterfaceOrientation)interfaceOrientation\n\n{\n   return YES;\n}\n```\n\n\
  如果应用程序仍在运行，点击 Xcode 工具栏上的 `Stop` 按钮，然后重新运行。使用 `Command` 配合左或右箭头键测试不同的方向。用户界面现在应该旋转，无论模拟器显示何种方向，它始终保持直立（图\
  \ 17.35）。\n\n**图 17.35** TestApp Touch 的 UI 旋转以匹配设备方向\n\n![image](img/xcode-17-35.jpg)\n\
  \n***\n\n注意\n\n![image](img/note_01.jpg)\n\n**模板视图中的标签在 图 17.35 中被“挤压”且显示不正确。还需要更多工作来确保所有\
  \ UI 元素正确调整大小并移动，但该主题超出了本书的范围。详情请参 Cocoa 文档。**\n\n***\n\n### 模拟常见设备事件\n\n你可能需要测试几个设备事件。\n\
  \n**低内存警告。** 首先，iOS 应用程序需要正确处理低内存状况。也就是说，当 iOS 告诉你的应用程序内存不足时，应该立即释放不需要的资源。未能正确处理此事件（或根本不处理）将导致你的应用程序被终止。因为你是一个优秀的开发者，你希望确保应用程序能够正确处理此事件。你已经实现了正确的方法并调用了一些应用程序特定的内存清理代码。现在你只需要测试它以确保其工作正常。你可以通过从主菜单中选择\
  \ `Hardware > Simulate Memory Warning` 来。你甚至可以在该方法上设置断点，以确保它被调用并跟踪其指令执行。\n\n**摇晃。**\
  \ 如果你用过 iOS 设备，就知道很多应用支持“摇晃撤销”，这在设备受到物理摇晃时会触发应用程序的撤销操作。要在模拟器中触发此事件，请从主菜单中选择 `Hardware\
  \ > Shake Gesture`。\n\n**通话中状态栏。** 对于 iPhone，UI 必须“压缩”以为通话中状态栏留出空间，该状态栏表示你在使用其他应用程序时手机正处于通话状态。因为这影响了应用程序的用户界面布局，所以有必要切换通话栏以确保你的\
  \ UI 能够自动调整大小。你可以通过从主菜单中选择 `Hardware > Toggle In-Call Status Bar` 来。\n\n### 模拟电视输出\n\
  \n另一个流行的 iOS 功能是使用底座连接器适配器连接外部显示器。这允许你例如，将 iPad 连接到投影仪并使用 Keynote for iPad 进行演示，或者连接到电视播放照片幻灯片。你的应用必须提供这种“电视输出”内容，但你可以在模拟器中测试，无需插入任何设备。要激活电视输出（模拟外部显示器设备连接到\
  \ iOS 设备），从主菜单下的 `Hardware > TV Out` 菜单中选择分辨率。要关闭电视输出，从同一菜单中选择 `Disabled`。图 17.36\
  \ 显示了处于幻灯片模式的模拟 iPhoto 应用，电视输出查看器显示了“星空”幻灯片。\n\n**图 17.36** 模拟电视输出\n\n![image](img/xcode-17-36.jpg)\n\
  \n### 使用调试器\n\n配合 iOS 模拟器使用所有 Xcode 调试功能不需要任何特殊操作。断点、`Debug navigator` 和 `Debug\
  \ area` 的工作方式完全相同。\n\n#### 在 iOS 设备上调试\n\n你刚刚读到调试器在 iOS 模拟器上的运行符合预期。在 iOS 设备上调试你的应用程序时也是如此。只有\
  \ own 几处不同。\n\n##### 设备必须经过配置（Provisioned）\n\n你的设备*必须*经过开发配置。请参阅 附录 A 获取更多关于配置和管理你的\
  \ iOS 设备的信息。\n\n##### 设备必须解锁\n\n你的设备必须处于解锁状态。也就是说，如果你的设备设置了密码并需要输入密码才能解锁使用，你需要在\
  \ Xcode 使用其进行开发之前先将其解锁。在整个调试期间，它也必须保持锁定状态。\n\n##### 设备必须保持连接\n\n你需要保持设备连接。如果你在会话期间拔掉设备，将无法在该会话期间重新连接。你必须在\
  \ Xcode 中停止会话，确保设备重新插好，并且它在 Xcode 中被选为运行目标。\n\n### 总结\n\n你又学习了一些调试技巧，以及学会了如何在设备上或使用模拟器调试你的应用程序。Xcode\
  \ 在各个角落还挤了许多更多与调试相关的功能。希望本章阐明了开发者所寻找的主要方面。在下一章中，你将学习如何使用单元测试在需要调试之前捕捉尽可能多的错误。\n\n\
  \n\n\n当然，方法可以来回传递对象，因此你可能会有一些测试用例，以确保在特定条件下，方法根据各种类型的输入返回了有效的对象，这包括验证在某些输入或条件下*没有*返回任何对象的情况。例如，你可能需要测试一个返回表示网络连接对象的方法。该方法可能无法满足请求，可能是因为你没有提供某些有效输入（如有效的主机名），也因为网络错误（例如网线未插好或\
  \ Wi-Fi 连接已断开）。\n\n测试的设计应该涵盖代码可能失败的所有设上想象到的方式，以确保它不会失败。无论你对代码做了什么更改，现有的测试都应该能够通过，而且新的测试（用于覆盖新功能或新场景的测试）也应该通过。\n\
  \n## 优势\n\n单元测试为开发者提供了几个显而易见的优势。以下这些通常位于列表的最顶端。\n\n### 设计\n\n当软件设计是测试驱动的时，测试本身是首先设计的，并为软件提供了需要实现的目标。也就是说，如果你通过设计测试来指定软件应该如何运行，然后以通过测试为意图编写软件，那么开发者就只有在代码通过了所有定义的测试时，才知道设计目标已经达成。\n\
  \n### 变更管理\n\n维护应用程序代码库的部分工作涉及重构现有代码。有了适当的单元测试，开发者可以放心地进行这些更改，在每次更改后重新运行测试，以验证代码是否仍然符合测试设定的要求。当测试失败时，开发者会立即知道他们的“处理问题的新方法”是否搞坏了什么。此外，设计良好的单元测试会准确告诉开发者新代码在何处以及为什么失败了。\n\
  \n### 简化集成测试\n\n集成测试是将各种软件组件组合成一个整体时所进行的测试。例如，对整个应用程序进行集成测试，以确保其所有部分都能正常协同工作。由于这个原因，集成测试通常由人员使用软件手动完成。单元测试确保单个组件正常工作，在错误显现为可能让用户感到困惑的行为之前将其捕获，从而只将与集成相关的问题留给测试人员处理。这种“组件问题”与“组件之间的问题”的清晰界限简化了调试过程。\n\
  \n### 局限性\n\n如前所述，单元测试最大的局限性在于范围。也就是说，单元测试只测试*单元*。它不涵盖由于单元*集成*而产生的问题。需要将单元测试与其他形式的测试（如集成测试）结合使用。\n\
  \n如果这不足以让你感到恐惧，请考虑覆盖方法的每个可能方面真正需要什么。对于方法可以给出的每个布尔答案，你至少需要两个测试（一个用于测试方法在应该返回 *true*\
  \ 时回答，另一个用于测试适当的 *no* 响应）。设计良好的测试覆盖通常要求每个被测试的方法有几个测试。\n\n事实并非如此。你不仅必须设计这些测试，还必须随着代码的变化维护它们，重写（甚至仅仅是*重命名*）它们，以确保它们在失败时既具有相关性又易于阅读。对于单元中添加的每一个新可能性，测试必须尽可能完整地覆盖它。因此，单元测试需要大量的工程时间和纪律来保持有效。\n\
  \n## 争议\n\n正如我们提到的，许多开发者对单元测试存在争议。他们倾向于不编写单元测试。争议点在于编写单元测试的时间，这在某些情况下是不可接受的。这种争议在很大程度上源于他们对单元测试的*想法*。\n\
  \n## Xcode 中的单元测试\n\n正如你在第 14 章所看到的，Xcode 提供了单元测试工具。当你创建项目时包含了单元测试时，`TestAppTests`\
  \ 目标会被创建。\n\n在 图 18.1 中，`TestAppTests` 目标被展开，显示另一个节点 `TestAppTests`。这对应于属于 `TestAppTests`\
  \ 的唯一文件：`TestAppTests.m`。在类 `.m` 文件中定义的 `TestAppTests` 类定义了可用的测试（以方法的形式）。你可以通过按下\
  \ `Command+U` 或从主菜单选择 `Product > Test` 来启动测试。\n\n**图 18.1** Scheme 中的默认测试\n\n![image](img/xcode-18-01)\n\
  \n对比图 18.2 中的 `TestAppShared` 方案，那里没有单元测试。\n\n**图 18.2** TestAppShared 方案中没有测试\n\
  \n![image](img/xcode-18-02)\n\n在 图 18.1 中，`TestAppTests` 目标被展开，显示 `TestAppTests`。如果类中定义了测试方法，它们将出现在类名下方。Test\
  \ 列允许你切换单个测试。\n\n* * *\n\n注意\n\n![image](img/note_02)\n\n**`TestAppTests.m` 文件位于项目导航器中的\
  \ `TestAppTests` 组。这是你在创建项目时包含单元测试时自动生成的。该文件本身是运行测试的通用位置，但最佳实践是为代码库中的每个类创建一个匹配的测试类。**\n\
  \n\n\n\n再次，重要的是，测试用例类以及它们所测试的类必须添加到单元测试目标。测试用例类是 `SenTestingKit.framework` 提供的 `SenTestCase`\
  \ 类的子类。测试用例类模板提供了用于测试环境设置（setup）和清理（tear-down）的基础存根方法。除此之外，取决于你如何以方法的形式添加单独的测试。代码库中的每个类都会创建一个测试用例类。\n\
  \n***\n\n### 提示\n\n![image](img/tip_01.jpg)\n\n**你可以访问 [www.sente.ch/software/ocunit](http://www.sente.ch/software/ocunit)\
  \ 了解更多关于 OCUnit 的信息。**\n\n***\n\n### 断言自我（Asserting Yourself）\n\n测试最终通过断言来通过或失败。取决于你测试的内容，你将\
  \ `assert` 某个条件必须满足。例如，你可能断言结果与预期值相等，或者必须或不应该抛出异常，或者返回值必须或不能为 `nil`。以下是 OCUnit 提供的一些断言，以及每个断言的描述和基础示例代码。\n\
  \n`STAssertEqualObjects()` 如果传递给它的两个 `objects` 不相等，则生成失败。\n\n```\nSTAssertEqualObjects(objectA,\
  \ objectB, @\"One of these objects is not like the other.\");\n```\n\n`STAssertEquals()`\
  \ 如果传递给它的两个 `scalars`、`structs` 或 `unions` 不相等，则生成失败。\n\n```\nSTAssertEquals(myValue,\
  \ kSomeConstant, @\"myValue should be %f but it's %f. My world view is shattered.\"\
  , myValue, kSomeConstant);\n```\n\n`STAssertEqualsWithAccuracy()` 如果两个标量在某些精度范围内不相等，则生成失败。换句话说，如果精度为\
  \ `.1`，值 `0.9` 和 `1.0` 将被视为相等。它的主要用途用于 `float` 或 `double` 标量，但也适用于其他类型。\n\n```\n\
  STAssertEqualsWithAccuracy(piCloseEnough, M_PI, 0.005, @\"piCloseEnough (%f) isn't\
  \ close enough to pi for our tastes. Mmm. Tasty pi.\", piCloseEnough);\n```\n\n\
  `STFail()` 生成一个无条件的失败。它适用于其他断言未覆盖的边缘情况，也适用于某些代码块永远不应该到达的情况（例如，一个不打算跳出的 `while` 循环之后的行）。\n\
  \n```\nSTFail(@\"Error: Hamster should not float; Q has changed the gravitational\
  \ constant of the universe.\");\n```\n\n`STAssertNil()` 如果传递的对象不是 `nil`，则生成失败。\n\
  \n```\nSTAssertNil(someNilObject, @\"How exactly do you get something from nothing?\"\
  );\n```\n\n`STAssertNotNil()` 如果传递的对象为 `nil`，则生成失败。\n\n```\nSTAssertNotNil(aValidObject,\
  \ @\"I visited this method and all I got was this lousy nil.\");\n```\n\n`STAssertTrue()`\
  \ 如果传递的布尔 (`BOOL`) 表达式求值为为 `false`，则生成失败。\n\n```\nSTAssertTrue((M_PI == 3.0f), @\"\
  Professor Frink says pi is exactly three!\");\n```\n\n`STAssertFalse()` 如果传递的布尔\
  \ (`BOOL`) 表达式求值为 `true`，则生成失败。\n\n```\nSTAssertFalse((1 == 1), @\"We don't BELIEVE\
  \ in equality 'round THESE parts, stranger!\");\n```\n\n`STAssertNoThrow()` 如果表达式抛出\
  \ Objective-C 异常，则生成失败。\n\n```\nSTAssertNoThrow([someCalculatorObject addOneToThree],\
  \ \"The answer is 4, you dolt. What went wrong?\");\n```\n\n`STAssertThrows()` 如果表达式没有抛出\
  \ Objective-C 异常，则生成失败。\n\n```\nSTAssertThrows([someCalculatorObject divideByZero],\
  \ @\"Wait, what? What result did YOU get?!\");\n```\n\n每个每个测试应该至少包含一个断言。有些人认为，每个测试应该*仅*包含一个断言，这样测试名称（方法签名）就能精确地描述所测试的内容，从而在发生故障时更容易识别精确的失败原因。\n\
  \n### 测试结果日志\n\n如前所述，测试结果输出显示在 Log 导航器中。以下是首次运行 TestApp scheme 的 Test action 时的输出。\n\
  \n```\nGNU gdb 6.3.50-20050815 (Apple version gdb-1518) (Sat Feb 12 02:52:12 UTC\
  \ 2011)\nCopyright 2004 Free Software Foundation, Inc.\nGDB is free software, covered\
  \ by the GNU General Public License, and you are welcome to change it and/or distribute\
  \ copies of it under certain conditions.\nType \"show copying\" to see the conditions.\n\
  There is absolutely no warranty for GDB. Type \"show warranty\" for details.\nThis\
  \ GDB was configured as \"x86_64-apple-darwin\".tty /dev/ttys000 sharedlibrary apply-load-rules\
  \ all\n[Switching to process 12421 thread 0x0]\nobjc[12421]: GC: forcing GC OFF\
  \ because OBJC_DISABLE_GC is set\nTest Suite 'All tests' started at 2011-04-13 20:02:20\
  \ -0400\nTest Suite '/Developer/Library/Frameworks/SenTestingKit. framework(Tests)'\
  \ started at 2011-04-13 20:02:20 -0400\nTest Suite 'SenInterfaceTestCase' started\
  \ at 2011-04-13 20:02:20 -0400\nTest Suite 'SenInterfaceTestCase' finished at 2011-04-13\
  \ 20:02:20 -0400.\nExecuted 0 tests, with 0 failures (0 unexpected) in 0.000 (0.000)\
  \ seconds\nTest Suite '/Developer/Library/Frameworks/SenTestingKit. framework(Tests)'\
  \ finished at 2011-04-13 20:02:20 -0400.\nExecuted 0 tests, with 0 failures (0 unexpected)\
  \ in 0.000 (0.001) seconds\nTest Suite '/Users/jnozzi/Library/Developer/Xcode/DerivedData/TestApp_Suite-gjvjpbtynoofyphkphrqcobvoibi/Build/Products/Debug/TestAppTests.octest(Tests)'\
  \ started at 2011-04-13 20:02:20 -0400\nTest Suite 'TestAppTests' started at 2011-04-13\
  \ 20:02:20 -0400\n```\n\n\n\n\n```objc\n#import \"Person.h\"\n\n@implementation\
  \ Person\n\n- (id)init\n{\n    self = [super init];\n    if (self)\n    {\n    \
  \    firstName = nil;\n        lastName = nil;\n    }\n    return self;\n}\n\n-\
  \ (void)dealloc\n{\n    [firstName release];\n    firstName = nil;\n    [lastName\
  \ release];\n    lastName = nil;\n    [super dealloc];\n}\n\n@synthesize firstName;\n\
  @synthesize lastName;\n@end\n```\n\n然后，将你的 `Person.h` 文件内容替换如下代码：\n\n```objc\n#import\
  \ <Foundation/Foundation.h>\n\n@interface Person : NSObject {\n    NSString * firstName;\n\
  \    NSString * lastName;\n}\n@property (nonatomic, retain) NSString * firstName;\n\
  @property (nonatomic, retain) NSString * lastName;\n@end\n```\n\n这段代码描述了一个表示有姓和名的人的基础类。假设你熟悉\
  \ Objective-C，你会发现当人第一次被创建时，这两个名称属性将为 `nil`。此外，用于这些属性的合成访问器将允许名称设置为 `nil` 或 `NSString`（即使是空的）。这些是你应该避免的情况——一个人应该始终有一个姓和一个名，即使在创建时没有提供姓和名。为了这一点，你需要设计一个测试。\n\
  \n### 设计测试\n\n你对 `Person` 测试覆盖的目标非常简单：所有的 `Person` 实例都必须有有效的姓和名。也就是说，它们不能将 `nil`\
  \ 或空 `NSString` 设置为其姓或名，而且 `Person` 实例不能在这种状态下初始化。所有测试必须包含在它们自己的方法中，并且以 `- (void)test...`\
  \ 开头。\n\n为了实现最少量的覆盖，你需要四个测试：`testLastNameCannotBeNil`、`testLastNameCannotBeEmptyString`、`testFirstNameCannotBeNil`\
  \ 和 `testFirstNameCannotBeEmptyString`。\n\n你已经知道，在 `Person` 类目前的状态下，所有四个测试都会失败。目前没有代码来检查并强制这些这些。现在是编写测试了。\n\
  \n### 编写测试\n\n要编写测试，你需要向项目添加一个 Objective-C 测试用例类。你可以从文件模板库（File Template library）将一个\
  \ Objective-C 测试用例类拖入项目导航器（在 `TestAppTests` 组下），如图图 18.7\n\n将类命名为 `PersonTest.m`，以便明确该测试属于哪个类。此外，将测试*仅*添加到\
