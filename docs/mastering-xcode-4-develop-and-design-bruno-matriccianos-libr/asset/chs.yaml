  \ 345–347\n\n## 附录 (Appendixes)\n\n## 附录 A. 管理您的 iOS 设备\n\n如果你正在为 iOS 开发，早晚你都会想要在物理设备上测试您的应用程序，以在提交到\
  \ App Store 之前确保它们正常工作。为了做到这一点，你必须为开发对设备进行 `provision`（配置）。配置需要一个当前的 iOS 开发者账户，并允许你安装和调试自己的应用程序，以及访问设备的控制台日志、屏幕截图等。在本附录中，你将学习如何将\
  \ Xcode 链接到您的开发者门户、为开发配置设备，并通常管理设备。\n\n### 使用 Organizer 的设备 (Devices) 选项卡\n\nOrganizer\
  \ 的设备部分（**图 A.1**）允许你管理用于开发的 iOS 设备，以及配置文件、软件映像、应用程序数据、控制台日志和截图。在 Organizer 的此部分，你可以自动为开发配置设备，从而在设备上运行和测试应用程序，而不仅仅是在模拟器中。打开\
  \ Organizer，从主菜单选择 `Window > Organizer`，然后点击 `Devices` 选项卡。\n\n**图 A.1** Organizer\
  \ 的设备标签\n\n![image](img/appx_a_fig01.jpg)\n\n图 A.1 显示了一个设备——我的 iPhone，以及从激活的 iOS\
  \ 开发者账户获取的配置文件。“Josh’s Phone”旁边的绿色指示表示设备已配置，可以用于开发。\n\n### 配置设备 (Provisioning a\
  \ Device)\n\n为了在实际 iOS 设备（而不是模拟器）上运行和测试您的应用程序，你需要为设备进行开发配置。配置涉及从您的 Apple 开发者账户通过其配置门户网站获取正确的证书，并将其安装到您的设备上。这对于设备允许安装并非来自\
  \ App Store 的应用程序是必要的。如果你有有效的 Apple iOS 开发者计划会员，在 Xcode 4 中配置可以非常简单。\n\n大多数开发者只需要打开\
  \ Organizer 的 Devices 标签并插入设备。当设备出现在列表中时，选择它并点击 `Use for Development` 按钮（**图 A.2**）。\n\
  \n**图 A.2** Organizer 设备标签中的设备\n\n![image](img/appx_a_fig02.jpg)\n\n\n\n\n\n此时，系统可能会要求你提供\
  \ Apple iOS Developer Program 的凭据（图 A.3）。提供你的信息并点击 `Log In`。你还可能收到未找到开发证书的通知（图 A.4），并询问是否想要请求。点击\
  \ `Submit Request` 自动提交请求并获取所需的证书。\n\n**图 A.3** 登录你的 Apple Developer 账号\n\n![image](img/appx_a_fig03.jpg)\n\
  \n**图 A.4** 请求证书的提示\n\n![image](img/appx_a_fig04.jpg)\n\n## 设备配置 (Device Provisioning)\n\
  \n一旦你通过了层层障碍，设备将自动进行分析和配置。列表中设备右侧的指示点将变为绿色，告知你的设备已准备好供开发使用。现在，你应该可以通过工作区窗口工具栏的 `Schemes`\
  \ 弹出窗口中选择设备，并按下 `Run` 按钮直接在设备上运行 iOS 应用程序。\n\n除了自动配置外，你还可以通过使用窗口底部的 `Import` 和 `Export`\
  \ 按钮来导入和导出开发者及配置文件，前提是在列表中选择了 `Developer Profile` 或 `Provisioning Profiles`。这对于手动配置或将你的配置文件移动到不同的计算机非常有用。在导出时，你需要设置一个密码，并在导入时使用相同的密码，以保护用于加密签名你应用程序的私钥（称为*代码签名*）。\n\
  \n***\n\n### 注意事项\n\n![image](img/note_01.jpg)\n\n**Apple 在 Xcode 4 中出色地实现了这一繁琐过程的自动化。尽管如此，它并不总是能正常工作。请阅读你的\
  \ iOS Developer 账号下 Provisioning Portal 网站提供的指南，以帮助你找出问题所在之处以及如何手动完成该过程。**\n\n***\n\
  \n### 在设备上安装 iOS\n\n在开发过程中，有时需要在你的设备上安装不同版本的 iOS 进行兼容性测试。这包括 iOS 本身的 beta 测试版本，你可以通过\
  \ iOS Developer Program 访问这些版本。iOS 版本可以从 Apple Developer 网站（[`developer.apple.com`](http://developer.apple.com)）下载。要在设备上安装不同版本的\
  \ iOS，请确保设备已连接，并在 `Organizer` 的 `Devices` 选项卡显示的列表中被选中。然后，你可以从设备信息下方的 `Software\
  \ Version` 弹出窗口中选择版本。如果你的版本没有出现在列表中，请从弹出窗口中选择 `Other Version` 并找到你下载的 iOS 包。点击 `Restore`\
  \ 按钮并在确认单中确认操作，然后等待 iOS 版本安装（恢复）。当安装完成后，重新激活设备并使用 `iTunes` 恢复其内容（就像你作为终端用户所的那样）。\n\
  \n### 管理设备截图\n\n`Organizer` 的 `Devices` 部分还允许你管理在设备上拍摄的截图。可以通过选择 Organizer 列表中目标设备下的\
  \ `Screenshots` 条目来找到截图（图 A.5）。截图有用的原因有两个：既可以作为 App Store 或你自己的网站的营销材料，也可以作为“默认启动图”，用户在应用程序于设备上启动时会看到它。\n\
  \n**图 A.5** 设备截图列表\n\n![image](img/appx_a_fig05.jpg)\n\n#### 截屏\n\n你可以通过点击窗口右下角的\
  \ `New Screenshot` 按钮来拍摄新截图。所有截图都以带有时间戳的缩略图列出。选择缩略图将在缩略图列表右侧显示完整图像。此图像可能会被缩小以适应窗口（如果你有一个较小的显示器并且正在查看从具有高分辨率\
  \ Retina 显示器的设备上拍摄的截图，这尤为有用）。\n\n#### 比较截图\n\n你可以通过选择两个或多个图像并选择窗口底部的 `Compare` 复选框来比较截图（图\
  \ A.6）。从复选框右侧的弹出窗口选择 `Difference` 将仅显示所选截图之间的差异。你可以通过弹出窗口右侧的滑块来调整容差（即在 `Difference`\
  \ 模式下，像素需要多大的差异才能可见）。图 A.6 显示了两张截图之间的差异（Dock 徽标和信号强度波动）。\n\n**图 A.6** 比较截图\n\n![image](img/appx_a_fig06.jpg)\n\
  \n#### 使用截图作为默认图像\n\n要将截图作为 iOS 应用程序的默认启动图，请从缩略图列表中选择它，并点击窗口底部的 `Save as Launch\
  \ Image`。系统会提示你为启动图命名并选择一个要添加该图像的工作区（图 A.7）。\n\n**图 A.7** 为图像命名并选择工作区\n\n![image](img/appx_a_fig07.jpg)\n\
  \n如果工作区中有多个目标（target），你需要点击 `Next` 来选择你想要为其设置默认图像的目标（图 A.8）。Xcode 会猜测你打算添加图像添加的一个或多个目标；你可能需要使用复选框更改选择。做出选择后，点击\
  \ `Finish`。该截图将作为所选目标的默认启动图像。\n\n**图 A.8** 为默认图像选择目标\n\n![image](img/appx_a_fig08.jpg)\n\
  \n***\n\n### 注意事项\n\n![image](img/note_02.jpg)\n\n**必须打开包含 iOS 应用的工作区才能在其中选择它。**\n\
  \n***\n\n### 管理应用和数据\n\n`Organizer` 的 `Devices` 选项卡提供了一个简单的界面，用于添加和删除你开发的应用程序，以及下载应用数据。要管理应用，请选择\
  \ Organizer 列表中目标设备下的 `Applications` 条目（图 A.9）。\n\n**图 A.9** 设备应用列表\n\n![image](img/appx_a_fig09.jpg)\n\
  \n#### 安装和移除应用\n\n你可以通过点击 `Add` 按钮并选择要添加的应用包来安装应用程序。你需要该应用程序的配置文件（这通常在测试朋友的应用时才会出现问题）。\n\
  \n要卸载，选择列表中的目标应用并点击 `Delete` 按钮。应用程序及其相关数据将从设备上删除。\n\n#### 下载应用数据\n\n你可以通过在列表中定位并点击右侧的\
  \ `Download` 按钮来下载应用数据以保存或分析。选择保存数据的位置，系统将创建一个包含应用数据的文件夹。只有拥有配置文件的应用允许下载下载数据。\n\n\
  ### 查看日志\n\n在没有附加调试器的情况下在设备上运行应用程序时，应用程序崩溃是一个谜。可以通过 `Organizer` `Devices` 选项卡中的\
  \ `Device Logs` 部分访问所有连接设备的日志。通过选择目标设备下的 `Device Logs` 条目可以获取单个设备的日志（图 A.10）。\n\n\
  **图 A.10** 设备日志\n\n![image](img/appx_a_fig10.jpg)\n\n设备的控制台日志可以在目标设备下的 `Console`\
  \ 条目可用（图 A.11）。控制台日志可以显示在调试会话之外独立运行应用程序的有用信息。\n\n**图 A.11** 设备控制台日志\n\n![image](img/appx_a_fig11.jpg)\n\
  \n\n\n\n\n## 附录 B. 手势与快捷键\n\nXcode 4 包含许多标准快捷键和多点手势。本附录包含了这两者的列表。\n\n### 手势\n\n\
  Xcode 4 对多点手势的支持仅限于标准的双指滚动以及三指向左或向右滑动导航——这类似于使用跳转栏（Jump Bar）中的后退和前进按钮。\n\n### 快捷键\n\
  \n以下是 Xcode 4 默认快捷键列表，按类别分组。\n\n![image](img/appx_b_tab01a.jpg)\n![image](img/appx_b_tab01b.jpg)\n\
  ![image](img/appx_b_tab01c.jpg)\n![image](img/appx_b_tab01d.jpg)\n![image](img/appx_b_tab01e.jpg)\n\
  ![image](img/appx_b_tab01f.jpg)\n![image](img/appx_b_tab01g.jpg)\n![image](img/appx_b_tab01h.jpg)\n\
  ![image](img/appx_b_tab01i.jpg)\n![image](img/appx_b_tab01j.jpg)\n![image](img/appx_b_tab01k.jpg)\n\
  ![image](img/appx_b_tab01l.jpg)\n\n### 编辑快捷键\n\n可以使用 Xcode 的“键绑定”（Key Bindings）设置来自定义快捷键。要访问这些设置，请从主菜单选择\
  \ `Xcode` > `Preferences`，然后选择 `Key Bindings` 标签页。\n\n图 B.1 显示了键绑定设置。你可以通过使用列表底部的\
  \ `Add (+)` 按钮创建一个新集合来创建自己的命令集（一组自定义的快捷键）。然后你可以通过双击 `Key` 字段并按下想要触发该事件的快捷键（组合键）来编辑每个快捷键。可以使用搜索字段或通过选择列表上方栏的类别（`All`、`Menu`\
  \ 或 `Text`）对列表进行过滤。\n\n图 B.1 键绑定设置\n\n![image](img/appx_b_fig01.jpg)\n\n## 附录 C.\
  \ 文档更新\n\nXcode 会在后台自动下载并安装文档更新。此外，你可以控制已安装的文档集并手动检查更新。这是通过“文档”（Documentation）设置面板控制的。\n\
  \n### 设置文档偏\n\n要打开文档设置面板，请从主菜单选择 `Xcode` > `Preferences`，然后选择 `Documentation` 标签页。图\
  \ C.1 显示了这些设置。\n\n图 C.1 文档设置面板\n\n![image](img/appx_c_fig01.jpg)\n\nXcode 起初仅下载它认为“必要”的文档集。如果你需要缺失的库（显示为灰色的），你需要点击它们旁边的\
  \ `GET` 按钮。Xcode 将下载并安装该文档集，从那时起，会将这些集合包含在自动更新检查中。\n\n此外，你可以使用列表底部的 `Add (+)` 按钮添加第三方文档集。文档必须来自\
  \ `http://` 或 `feed://` URL。\n\n你可以通过点击 `Add` 按钮左侧的展开按钮来查看所选文档集的信息，如图 C.2 所示。最后，你可以使用工具栏下方的控件禁用自动更新并强制检查更新。复选框切换自动更新状态，按钮则会立即检查并安装。\n\
  \n图 C.2 文档集信息面板\n\n![image](img/appx_c_fig02.jpg)\n\n## 附录 D. 其他资源\n\n有很多实用的在线资源可以学习使用\
  \ Xcode 以及通用的 Cocoa 开发。这里列出了一些作者喜欢的资源。\n\n### 书籍配套网站\n\n本书的配套网站（*[`xcodebook.com`](http://xcodebook.com)*）包含了\
  \ Xcode 4 的新闻、技巧和窍门、反映每个章节任务的可下载示例项目以及错误列表。\n\n### Apple 资源\n\n**开发者论坛**（*[`devforums.apple.com`](http://devforums.apple.com)*）\n\
  \nApple 开发者论坛网站有一个针对 Xcode 的论坛，有许多活跃成员。需要一个有效的 Apple 开发者账号。\n\n**Xcode-Users 邮件列表**（*[`lists.apple.com/mailman/listinfo/xcode-users`](http://lists.apple.com/mailman/listinfo/xcode-users)*）\n\
  \nXcode-Users 邮件列表不需要 Apple 开发者账号即可使用，是一个充满乐于助者的活跃列表。\n\n### 第三方资源\n\n**Stack Overflow**（*[`stackoverflow.com/questions/tagged/xcode`](http://stackoverflow.com/questions/tagged/xcode)*）\n\
  \nStack Overflow 是一个极好的开发者资源，按主题标记问题。问题和答案根据其清晰性和用性进行赞成或反对，从而鼓励社区成员提供经过深思考的问题和答案。\n\
  \n**CocoaDev Wiki**（*[`cocoadev.com`](http://cocoadev.com)*）\n\n虽然内容有些过时，但这个由社区建立的\
  \ wiki 在过去的十年中积累了大量实用的 Cocoa 开发者信息，对于初级、中级和专家开发者来说仍然包含许多价值教训。\n\n**Cocoa Dev Central**（*[`cocoadevcentral.com`](http://cocoadevcentral.com)*）\n\
  \n这个著名的信息性指南文章集合包含了许多 Cocoa 开发者喜爱的内容。值得浏览。\n\n"
