  \n在 Xcode 4 中工作时，并不是每一个项目都`来自` Xcode 4。对于旧版本的项目（甚至于你忘记在创建项目时包含默认单元测试支持的新项目），你可能需要手动添加此功能。\n\
  \n最理想的候选项目是你在第 17 章中创建的 `TestApp Touch` 项目，因为你没有在创建项目时请求创建单元测试。要添加单元测试目标（target），在项目导航器中选择\
  \ `TestApp Touch` 项目，然后从主菜单中选择 `File > New > New Target`（新建新建目标）。由于这是一个 iOS 项目，请选择\
  \ `iOS` 类别下的 `Other` 子类别。选择 `Cocoa Touch Unit Testing Bundle` 选项（**图 18.11****）。点击\
  \ Next（下一步）。\n\n**图 18.11** 选择测试包\n\n![image](img/xcode-18-11.jpg)\n\n在下一页表格中，为目标起一个有用的名称，例如\
  \ `TestAppTouchTests`。你的设置应该类似于**图 18.12****。点击 Finish（完成）添加新目标。\n\n**图 18.12**\
  \ 配置测试包\n\n![image](img/xcode-18-12.jpg)\n\n下一步是设置 `TestApp Touch` 方案（scheme）以识别测试包。打开\
  \ `TestApp Touch` 方案的编辑器（Scheme Editor），选择 `Test` 动作。测试列表应该是空的，如**图 18.13****所示。\n\
  \n**图 18.13** Test 动作中尚无测试包\n\n![image](img/xcode-18-13.jpg)\n\n点击列表底部的 Add `(+)`\
  \ 按钮显示出一个面板（**图 18.14****），你可以从中选择要添加的测试包。选择 `TestAppTouchTests` 并点击 Add（添加）。\n\n\
  **图 18.14** 添加测试包目标\n\n![image](img/xcode-18-14.jpg)\n\n你现在应该能在列表中看到 `TestAppTouchTests`\
  \ 测试目标，以及它的默认测试类和示例测试（**图 18.15****）。从那里开始，你可以像刚刚学到的那样继续添加测试用例类并构建你的测试。\n\n**图 18.15**\
  \ 新添加的测试目标，已准备好进行测试\n\n![image](img/xcode-18-15.jpg)\n\n### 结语\n\n无论你对单元测试有何看法，你无法否认\
  \ Xcode 4 让它的设置和使用变得简单。当然，恰当地设计测试以及花时间维护它们，取决于你自身的自律。在下一章中，你将学习如何利用 Xcode 4 的各种钩子（hooks）和功能来扩展和自定义构建过程。\n\
  \n## 19. 使用脚本和预处理\n\n本章介绍如何使用脚本以及预处理器来自定义构建过程。一种方案绝对不适用于所有的编码环境，大型团队和独立开发者都可以利用\
  \ Xcode 的脚本和预处理能力来自动化各种测试和部署任务。\n\n本章并不会作为你所能实现的所有内容的详尽列表——那将是另一整本书。相反，目标是向你介绍脚本钩子和一些预处理技巧，以激发你的想象力，让你能够更好地构思出理想的自动化流水线。\n\
  \n### 使用自定义脚本扩展工作流\n\n在第 14 章中，你探索了 Xcode 重新设计的构建系统。你了解到有单独的构建动作（build actions）针对活动方案运行。你还了解到，你执行的动作将自动以最符合该动作逻辑的方式构建指定的目标（用于运行的构建产生\
  \ `Debug` 构建；用于归档的构建产生 `Release` 构建）。文中简要提到了两个重要特性：在每种动作之前之后运行脚本的能力，以及作为构建阶段（build\
  \ phase）的一部分运行脚本的能力。\n\n#### 脚本机会\n\nXcode 提供了若干机会让你挂载自定义脚本以扩展功能。Xcode 一直附有 `Run\
  \ Script` 构建阶段（见第 14 章），但 Xcode 4 增加了前置和后动作脚本，它们会在每个主要动作（如 `Build`、`Run`、`Archive`\
  \ 等）之前和之后运行。\n\n##### 前置和后动作脚本\n\n在第 14 章中，你学习了 `Run Script` 构建阶段，正如其名，当它所属的目标被构建时，会运行指定的脚本。这种脚本的局限性与其优点是一致的：它`仅`在目标被`built`（构建）时运行。然而，在\
  \ `Run` 动作正之前（或之后）运行脚本的能力将允许你在启动之前重置应用程序的测试数据，以便始终针对相同的测试数据运行（或在程序运行结束后清理现场）。对归档（archive）进行一些后处理是有用的。对于每个动作（`Build`、`Run`、`Archive`、`Profile`、`Analyze`），你可以在之前或之后运行自定义脚本。这些被称为前置和后动作。要管理这些前置和后动作，你需要编辑想要放置它们的方案。从那里，你选择动作并点击\
  \ `Pre-actions`（前动作）或 `Post-actions`（后动作）。**图 19.1**显示了 `Run` 动作的编辑器。\n\n![image](img/xcode-19-01.jpg)\n\
  \n命名法有点混乱：`Build` 动作的后动作脚本可以被称为“后构建动作脚本”。无论你如何称呼它们，动作通过 Add `(+)` 和 Remove `(–)`\
  \ 按钮添加。目前有两种类型：`Run Script` 和 `Send Email`。我们将忽略明显的发送邮件功能，而转向功能强大的强大的。\n\n`Run Script`\
  \ 动作有三个控件。`Shell`字段允许你指定特定 shell 的路径。默认是 `/bin/sh`。弹出菜单允许你选择提供给脚本环境的环境。例如，`BUILT_PRODUCTS_DIR`始终指向构建产物的文件夹。弹出菜单允许你选择这些变量的目标，或者不选择任何目标。第三个控件是一个微小的脚本编辑器。\n\
  \n图 19.1 显示该脚本做了两件事：它将环境变量打印到当前用户桌面上名为 `EnvironmentVariables.txt` 的文件中，然后俏皮地总结了一个脚本输出问题，稍后我们将探讨这个问题。如果你有任何\
  \ shell 脚本经验，已经在想象许多利用这些额外脚本钩子的方法。你的快乐将持续到段落开头。\n\n遗憾的是，这个精妙的功能带来了一个巨大的失望。在本文写作期间，这些脚本的标准输出似乎出现在它们想去的地方，这取决于它们所属的构建动作（可能还取决于月相——需要进一步测试）。**图\
  \ 19.2**显示，对构建日志（后构建动作脚本标准输出的好去地方）进行搜索没有产生结果。\n\n**图 19.2** 令人失望的日志搜索结果\n\n![image](img/xcode-19-02.jpg)\n\
  \n\n\nBuild 操作脚本的输出会被重定向到系统控制日志，但似乎不会出现在其他地方；而 Run 操作的输出则会出现在调试器控制台和系统控制台中。Test\
  \ 输出会出现在系统控制日志中，但不会出现在 Log 导航器中的测试日志中，也不会出现在调试器控制台中。Profile 和 Archive 的输出只出现在系统控制日志中，而\
  \ Analyze 的执行前和执行后操作则完全不可用（尽管它们在编辑器和 Issue 导航器 UI 中可以显示）。如果你对此此感到困惑，那么你并不孤单。\n\n\
  ***\n\n### 备注\n![image](img/note_01.jpg)\n\n> **此功能很可能只是 Xcode 4 中一个尚未完全成熟的部分，未来将会改进。目前，如果你需要为这些脚本获取一致的标准输出日志，那么你就没好运了。很有可能，在发布前的最后\
  \ Xcode 更新将迫使这位作者收回前言。他的盐和椒已准备就绪。**\n\n***\n\n### Run Script 构建阶段\n尽管有上述的悲观情绪，但仍然有一个经过考验且行之有效的\
  \ Run Script 构建阶段，你已经在第 14 章中学习过它。它的输出很容易找到，并且提供了一系列令人深刻的环境变量。你可以在给定目标的构建阶段中添加任意数量的脚本。图\
  \ 19.3 显示了在 TestApp 目标上添加的空 Run Script 构建阶段，并展开显示其设置。Run Script 脚本按照它们在目标构建阶段列表中的出现顺序执行。\n\
  \n**图 19.3** 一个空 Run Run Script 构建阶段\n![image](img/xcode-19-03.jpg)\n\nShell 字段允许你指定想要用于执行脚本的\
  \ shell。默认值是 `/bin/sh`。替代方案包括 `bash`（Mac OS X 的默认 shell）、`perl`、`python` 或任何已安装的脚本环境。\n\
  \nShell 字段正下方的区域将包含你的脚本。你可以直接在字段中输入或粘贴脚本，也可以从工作区拖入脚本文件。由于该字段会随脚本的大小伸缩，你可能会发现采用“从工作区拖入脚本文件”的方法更容易。要这样做，请从模板中向工作区添加一个新的\
  \ shell 脚本文件（图 19.4）。然后你可以将脚本拖入脚本编辑器字段。通过这种方式，你可以在 Source Editor 中编辑脚本，这会导致构建阶段在执行时调用你的脚本。\n\
  \n**图 19.4** shell 脚本文件模板\n![image](img/xcode-19-04.jpg)\n\n***\n\n### 备注\n![image](img/note_01.jpg)\n\
  \n> **当你从工作区将脚本拖入脚本编辑器时，Xcode 会插入脚本文件的完整路径。这在本质上创建了一个脚本，其唯一目的就是调用你工作区中的脚本。然而，插入的路径是绝对路径，如果你将项目移动到另一个文件夹或磁盘，它将会失效。你可能希望使用相对路径。**\n\
  \n***\n\n“在构建日志中显示环境变量”复选框（图 19.3）是调试脚本的一个方便选项，可以确保你使用的变量具有你预期的值。勾选此选框时，shell 可用的环境变量将包含在构建日志中。但你可以安全地关闭此选项，而不影响脚本的环境，并减小构建日志的大小。\n\
  \n当勾选“仅在安装时运行脚本”复选框时，只有当 Installation Directory 构建设置设置为有效路径，且当前配置的 Deployment Location\
  \ 构建设置设置为 Yes 时，脚本才会执行（这将触发一次“安装构建”）。\n\n### Xcode 的环境变量\nXcode 提供了许多环境变量，其中包含了对你的脚本工作有用的信息。例如，了解构建产物的路径或某些相对于项目外部但相对于项目文件夹的资源路径可能是重要的。了解正在使用哪种构建配置或在构建设置中指定了哪个安装目录可能也有用。\n\
  \n当使用脚本通过自己的后处理来扩展构建过程时，这些构建环境信息是无价的。\n\n### 通过粗暴的方法获取变量\n你可以使用一个小技巧来快速获取项目中使用的环境变量列表以及它们在构建时的值。这个技巧特别狡猾，因为它本身就使用了构建脚本。如果你熟悉\
  \ Unix，你可能知道 `printenv` 命令，它会打印当前的环境变量及其值。\n\n要使用此技巧，只需为 TestApp 目标添加一个 Run Script\
  \ 构建阶段。记得，要做到这一点，你必须导航到 TestApp 项目，选择 TestApp 目标，然后点击 Build Phases 标签页。使用窗口底部的 Add\
  \ Build Phase 按钮，选择 Add Run Script。在 Run Script 阶段的脚本编辑器中添加以下内容：\n\n```\nprintenv\
  \ > ~Desktop/XcodeBuildEnvironmentVariables.txt\n```\n\n你的 Run Script 阶段应该像图 19.5。编译应用程序（按\
  \ `Command+B` 强制构建）。你请求的文本文件（`XcodeBuildEnvironmentVariables.txt`）应该出现在你的桌面上。打开它查看一下。\n\
  \n**图 19.5** 将环境变量打印到文本文件的脚本\n![image](img/xcode-19-05.jpg)\n\n### 通过理智的方法获取变量\n\
  同样注意图 19.5](#ch19.html_ch19fig05）中的“在构建日志中显示环境变量”选框。这在调试脚本时非常有用，因为构建系统会将你放置的内容直接转入构建日志。\n\
  \n### 简单示例\n可以花费大量的文字来详细介绍从到复杂的脚本示例。由于本书关注 Xcode，只需要一个基础的示例就可以演示通过自定义处理扩展构建系统的威力。\n\
  \n在第 12 章中，你学习了使用 Xcode 4 的优选方法 Archive 操作来部署应用程序。该操作会构建发布版本并确实产生用于发布的存档。正如第 12\
  \ 章所示，Apple 似乎认为开发者所谓的“部署”是指“在 App Store 上”。但许多拥有 Mac OS X 产品的软件供应商可能并不准备放弃现有的发行渠道而转向\
  \ Apple 的。因此，为这些异类定制化部署过程需要一些额外努力。\n\n#### 场景\n考虑以下场景。你想在自己的网站上发布 TestApp，无视 Apple\
  \ 的仁慈。你希望用户以简单的 zip 文件形式下载应用程序，该文件仅包含应用程序本身。压缩包（或其他存档）是必要的，因为应用程序包本质上是文件夹，下载很不方便。完成后，你希望生成此\
  \ zip 文件并使其在 Finder 窗口中弹出，以便方便将文件复制到服务器。一种方法是挂钩 Archive 过程，因为它会自动构建发布版本并确实产生用于发布的存档。Xcode\
  \ 仍然会创建自己的存档（目前没有办法阻止它），但自定义脚本也会创建*你的*存档。\n\n***\n\n### 备注\n![image](img/note_02.jpg)\n\
  \n> **当然，你可以将存档操作脚本挂钩到 Archive 操作的后操作中，但接下来的示例将作为通用脚本的一个实用示例。**\n\n***\n\n## 创建脚本\n\
  \n\n\n\n\n要开始，请导航到 `TestApp` 项目，选择 `TestApp` 目标，然后点击 `Build Phases`（构建阶段）标签页。点击\
  \ `Add Build Phase` 按钮并在菜单中选择 `Add Run Script`。双击 `Run Script` 标题，为了清晰起见将其命名为 `Run\
  \ Archive Script`。展开新的 `Run Archive Script` 阶段并添加以下脚本：\n\n```bash\n## 到构建产物目录\n\
  cd $BUILT_PRODUCTS_DIR\n\n## 清理任何之前的存档文件夹并创建一个新的\nrm -Rf Archive\n\nmkdir Archive\n\
  \n## 将目标压缩为 Archive 文件夹中的 zip 文件\nzip -r Archive/$TARGETNAME.zip $FULL_PRODUCT_NAME\n\
  \n## 在 Finder 中显示 Archive 文件夹\nopen ./Archive\n```\n\n`图 19.6` 显示了 `Run Archive\
  \ Script` 构建阶段中完成的脚本。如果你熟悉 shell 脚本编写，这个脚本应该易于理解。它使用了 Xcode 提供的环境变量，以便方便地访问构建产物目录、目标名称和完整产品名称。\n\
  \n**图 19.6** 完成的自定义存档脚本\n\n![image](img/xcode-19-06.jpg)\n\n第 2 行将工作目录更改为构建产物目录。第\
  \ 5 行和第 6 行确保有一个干净的 `Archive` 文件夹用于放置完成的存档（这避免了在 Finder 窗口中查找存档时产生混乱）。第 9 行调用 `zip`\
  \ 命令行程序创建一个以目标（`TestApp`）命名的 zip 文件，使用完整产品名称（`TestApp.app`）并将文件放入第 6 行创建的 `Archive`\
  \ 子文件夹。最后，第 12 行使用 `open` 命令行程序在 Finder 窗口中打开 `Archive` 文件夹，整齐地展示你的新存档。\n\n要测试它，请从主菜单选择\
  \ `Product > Archive` 来运行 `Archive` 操作。`Archive` 操作会像往常一样运行，但你应该还会看到 Finder 窗口出现。\n\
  \n* * *\n\n提示\n\n![image](img/tip_02.jpg)\n\n**你可能更喜欢防止 Xcode 打开 Organizer（默认启用）。要此这样做，请编辑\
  \ scheme 并选择 Archive 操作。取消勾选 Reveal Archive in Organizer 选项并点击 OK。**\n\n* * *\n\n\
  ### 仅在 Release 构建时触发脚本\n\n你还没有完成。目前，脚本会在每次构建目标时运行。运行应用程序（这将进行调试模式构建）。存档脚本也会运行，并在应用程序运行时在\
  \ Finder 窗口中弹出。这并不理想。由于设定的目标是仅在执行存档时（等同于“为发布版本构建”）运行此脚本，因此需要进行更多的自定义。\n\n为什么不使用\
  \ `Archive` 操作后脚本（post-action script）呢？（参见 `Pre- and Post-Action Scripts` 部分）。在\
  \ Xcode 4 的当前版本中，环境变量（如 `BUILT_PRODUCTS_DIR`、`TARGETNAME` 和 `FULL_PRODUCT_NAME`）在操作前和后脚本中是不可用的。在发生变化之前，最简单的方法（从脚本行更少且更灵活来看）是使用\
  \ `Run Script` 构建阶段。\n\n仅限存档的问题通过额外一个环境变量：`CONFIGURATION` 即可解决。你可以使用 `if` 条件判断来检查脚本是否在\
  \ Release 配置下运行。将现有脚本替换为以下内容：\n\n```bash\nif [ $CONFIGURATION = Release ]; then\n\
  \    # 到构建产物目录\n    cd $BUILT_PRODUCTS_DIR\n\n    # 清理任何之前的存档文件夹并创建一个新的\n    rm\
  \ -Rf Archive\n\n    mkdir Archive\n\n    # 将目标压缩为 Archive 文件夹中的 zip 文件\n    zip\
  \ -r Archive/$TARGETNAME.zip $FULL_PRODUCT_NAME\n\n    # 在 Finder 中显示 Archive 文件夹\n\
  \    open ./Archive\nfi\n```\n\n`图 19.7` 显示了新脚本。第 2 行的 `if` 条件评估 `CONFIGURATION`\
  \ 变量以检查是否为 Release 配置。第 17 行结束条件块（`fi` 是 `if` 的反过来写法）。\n\n**图 19.7** 修改后的存档脚本\n\n\
  ![image](img/xcode-19-07.jpg)\n\n测试脚本。正常运行应用程序——脚本不应该运行。现在调用 `Archive` 操作。这次脚本运行了，并且\
  \ Finder 显示了你的存档。\n\n### 扩展脚本\n\n如前面提到的，这个简单的脚本展示了自定义构建过程是多么简单。当操作前和后脚本最终提供环境变量时（它们在未来的发布中几乎肯定会有），脚本可以变得更加具体且不那么具有“条件性”。\n\
  \n网络上展示了许多由 Xcode 用户拼凑并共享的创意部署脚本。有些脚本涉及上传到构建服务器以在持续集成环境中进行测试。有些脚本涉及向仓库中提交和检出代码，甚至将构建版本号设置为从这些仓库中拉取的修订号。某些脚本使用发布说明为“appcast”馈生成更新条目，例如\
  \ Andy Matuschak 备受推崇的 Sparkle 自动更新框架所使用的。其他脚本则将存档（以及相关的 appcast、发布说明等）上传到暂存区域，以便在部署到公共\
  \ Web 服务器之前进行测试。\n\n凭借一些脚本知识和可用命令行程序的列表，你可以构建出相当复杂的流程。如果你是基于 Unix 的平台（Mac X 之一）的新手，作为专业人士，你有责任去探索这些可能性。\n\
  \n### 使用预处理器\n\n在第 13 章中，你看到了如何使用预处理器（cpp）来创建辅助导航的分割符。如果你不熟悉预处理器，可能会惊讶地发现它比简单的 `pragma\
  \ mark` 指令强大得多。\n\n* * *\n\n提示\n\n![image](img/tip_02.jpg)\n\n**了解更多关于预处理器能为你做什么，请访问\
  \ [`xcodebook.com/cpp`](http://xcodebook.com/cpp)。**\n\n* * *\n\n#### 宏\n\n使用预处理器最简单的方法是定义宏。由于预处理器正如名称所示——在编译之前处理文本，因此宏会被展开。这意味着你可以使用\
  \ `#define` 命令创建一种类似于“懒人的常量”，或将一组方法调用压缩为简单的占位符符号。\n\n##### 将宏放在哪里\n\n通常优于将宏定义在头文件中，以便在其他地方导入而无需重复。许多开发者使用全局头文件来实现此。位于项目\
  \ Supporting Files 组的默认 `.pch` 文件包含在处处，是存放全局宏的好地方。\n\n##### 定义宏\n\n宏使用 `#define`\
  \ 指令和宏名称（如 `PlaceholderString` 或 `TRUNCATED_PI`）定义，随后是宏的扩展文本。例如，以下代码定义了一个宏：\n\n\
  ```bash\n#define TRUNCATED_PI 3.14\n```\n\n每当预处理器在源文件中遇到 `TRUNCATED_PI` 时，该值将被“展开为”（或替换为）`3.14`。\n\
  \n在 Cocoa 中，使用统一类型标识符（如 `com.mycompany.TestApp.testappdocument`）来识别数据类型如文档、剪贴板拖拽类型等。与常量一样，使用宏的好处是减少可能输错字符串常量的机会（编译器无法为你验证这一点）。由于宏和符号一样，必须正确输入（并且参与代码补全），Xcode\
  \ 将帮助你正确拼写，且编译器会将其标记为错误。一个简单的字符串宏可以这样定义：\n\n```bash\n#define TestAppDocType @\"\
  com.mycompany.TestApp.testappdocument\"\n```\n\n\n\n\n这将定义宏 `TestAppDocType`，它在任何使用它的地方都将被展开为\
  \ `@\"com.mycompany.TestApp.testappdocument\"`。\n\n宏的另一个方便用途是缩短长且深度嵌套的方法调用。许多非基于文档的\
  \ Cocoa 应用程序会将顶层控制器“挂载”在应用程序代理（application delegate）上，以便从应用程序代码的任何地方访问它们。对此类控制器的调用可能像这样：\n\
  \n```objc\n[[NSApp delegate] importantController] doSomethingImportant];\n```\n\n\
  你可以通过为控制器定义一个宏来缩短调用：\n\n```objc\n#define ImportantController [[NSApp delegate] importantController]\n\
  ```\n\n现在缩短后的调用为：\n\n```objc\n[ImportantController doSomethingImportant];\n```\n\
  \n宏也可以像函数一样使用。事实上，许多常见的（但冗长的）评估在 `Foundation.framework`（在 `NSObjCRuntime.h` 下）中已经预定义了宏。例如，找到两个值中的较大值可以如下评估：\n\
  \n```c\nint largest = (a > b) ? a : b;\n```\n\n然而，`MAX` 宏简化了这一过程（适用于任何类型，而不仅仅是 `int`）：\n\
  \n```c\nint largest = MAX(a, b);\n```\n\n***\n\n### 提示\n\n![image](img/tip_01.jpg)\n\
  \n**找到系统定义符号和宏的简单方法是将它们输入源编辑器，然后 Command-click 它们。编辑器将导航到定义处。尝试输入 MAX 并 Command-click\
  \ 该单词来试一下。**\n\n***\n\n### 污染 (Poison)\n\n尽管听起来没有那么严重，但 `GCC poison` 预处理指令可以将任何符号或宏的使用变为硬错误。这在尝试避免使用特定的函数、变量或预定义宏时非常有用。例如，如果你想确保所有的日志调用都指向\
  \ Cocoa 的 `NSLog()` 而不是 `printf()`，你可以对 `printf()` 进行“投毒”。这将导致编译器标记所有现有的调用，并确保将来以后如果你忘记并再次尝试使用\
  \ `printf()` 时，能够避免任何疏忽。要“投毒”一个符号，请使用以下代码（在下例中将 `printf` 替换为所需的符号）：\n\n```objc\n\
  #pragma GCC poison printf\n```\n\n现在 `printf()` 被视为有毒。解毒的方法只需删除或注释掉你刚刚设置的预处理指令：\n\
  \n```objc\n// #pragma GCC poison printf\n```\n\n### 条件判断\n\n预处理器还有另一个不错的技巧。你可以使用条件判断来包含（或排除）#ifdef`\
  \ 和 `#endif` 之间的文本块，或者发布取决于环境的错误和警告。支持的条件包括 `#if`、`#ifdef`、`#ifndef`、`#else`、`#elif`\
  \ 和 `#endif`。`#ifdef` 和 `#ifndef`（分别为“如果定义”和“如果*未*定义”）是最常用的条件。\n\n你可能会根据某些设定标准在构建时排除代码块。例如，你可能会包含一个在应用程序启动时出现的消息对话框，警告用户他们正在运行\
  \ beta 版本。可以在用于“beta 构建”方案（beta build scheme）的配置中定义一个简单的“beta”标记，而普通方案（normal scheme）不定义它。取决于使用哪种方案，beta\
  \ 警告代码块在编译时可能包含也可能不包含。\n\n你可以这样编写条件代码块：\n\n```objc\n#ifdef SOMEMACRO\n\n    NSLog(@\"\
  这段代码只有在定义了 SOMEMACRO 时才会被包含... \");\n\n#endif\n```\n\n除非 `SOMEMACRO` 被定义，否则 `NSLog()`\
  \ 语句不会包含在编译后的代码中。`#ifdef` 指令不在乎 `SOMEMACRO` 代表什么，只需它是否被定义。记得你可以这样定义 `SOMEMACRO`：\n\
  \n```objc\n#define SOMEMACRO 1\n```\n\n### 在构建环境中定义宏\n\n定义宏并检查它是否被定义是很容易的。宏是否被定义也可以基于当前的构建设置，正如\
  \ `BETABUILD` 标记一样。\n\n要亲自尝试这种场景，请从将以下代码添加到 TestApp 代理类的 `-applicationDidFinishLaunching:`\
  \ 方法末尾开始：\n\n```objc\n#ifdef BETABUILD\n\n    [[NSAlert alertWithMessageText:@”Beta\
  \ Version”\n          defaultButton:@”Ok”\n          alternateButton:nil\n     \
  \     otherButton:nil\n          informativeTextWithFormat:@”Warning: you are using\
  \ a beta version of this application. Bad stuff might happen.”] runModal];\n\n#endif\n\
  ```\n\n图 19.8 显示了完整的 `-applicationDidFinishLaunching:` 方法。`NSAlert` 代码块被封装在 `#ifdef`\
  \ 和 `#endif` 预处理指令中，只有在定义名为 `BETABUILD` 的宏时才会被包含。\n\n**图 19.8** 完整的 `-applicationDidFinishLaunching:`\
  \ 方法\n\n![image](img/xcode-19-08.jpg)\n\n接下来，你需要在某处定义 `BETABUILD` 宏，并且让构建环境处理它的定义。这是通过为\
  \ beta 构建添加单独的构建配置，在目标的构建设置中定义宏（具体为 Preprocessor Macros 设置），然后创建一个使用 beta 构建配置的单独方案来实现的。\n\
  \n执行此操作，你首先要为 beta 构建创建一个单独的构建配置。导航到 TestApp 项目，然后选择 TestApp 目标。如果尚未选中，点击 Info 标签页。**图\
  \ 19.9** TestApp 目标的 Info 标签页\n\n![image](img/xcode-19-09.jpg)\n\nbeta 配置应该基于 Release\
  \ 配置。在 Configurations 部分，选择 Release 配置。使用列表下方的 (+) 按钮，从菜单中选择“Duplicate”。**图 19.10**\
  \ 复制 Release 配置\n\n将名称从“Release”更改为 **Beta Release** 并按回车。\n\n要使用单独的配置，你需要单独的方案。点击\
  \ Schemes 弹出窗口，从菜单中选择 Manage Schemes。**图 19.11** 管理方案\n\n![image](img/xcode-19-11.jpg)\n\
  \n**图 19.12** 编辑 Beta 方案的配置\n\n![image](img/xcode-12.jpg)\n\n现在有两个方案构建 TestApp。点击\
  \ (+) 按钮从菜单中选择 Duplicate。在 Scheme 表中，将方案名称设置为 **TestApp (Beta)**，然后选择 Archive 操作。从\
  \ Build Configuration 弹出窗口选择 Beta Release 并点击 OK。最后一步 TestApp 目标的 Beta Release 配置设置中定义\
  \ `BETABUILD`。导航到 TestApp 项目，然后选择 TestApp 目标并点击 Settings 标签页。搜索 Preprocessor Macros\
  \ 设置。展开设置可以看到三个配置（Debug、Release 和 Beta Release），如 **图 19.13** 所示。\n\n**图 19.13**\
  \ 添加预处理宏\n\n（等待，重新检查文本流……）\n\n在 Beta Release 行的值列（对于 TestApp 值）中双击并添加宏 **BETABUILD**。**图\
  \ 19.14** 最后的 `BETABUILD` 宏设置\n\n![image](img/xcode-19-14.jpg)\n\n现在你可以测试了。确保选择了原始的\
  \ TestApp 方案。从主菜单选择 Product > Build For Build For Archiving 并等待构建完成。在项目导航器中，展开 TestApp\
  \ 项目的 Products 组。右键点击 `TestApp.app` 产品并从菜单选择 Show in Finder。你应该在 Release 文件夹中看到正常构建\
  \ TestApp 应用程序。双击启动它，注意 beta 警告。退出 TestApp。\n\n\n\n现在选择 `TestApp` (Beta) 方案。从主菜单中选择\
  \ `Product > Build For > Build For Archiving` 并等待构建完成。再次，在项目导航器中，右键点击 Products 组中的\
  \ `TestApp.app` 产品，并从菜单中选择 `Show in Finder`。你应该会在它的 Beta Release 文件夹中看到构建好的测试版应用。启动它，但请注意——它是一个测试版（见\
  \ 图 19.15）。\n\n**图 19.15** 测试版警告\n\n![image](img/xcode-19-15.jpg)\n\n***\n\n###\
  \ 提示\n\n![image](img/tip_02.jpg)\n\n**你也可以使用 Beta Release 配置来避免剥离调试符号。对于此配置，你可能禁用\
  \ `Strip Debug Symbols During Copy` 设置，这将有助于调试由测试版测试人员发现的问题。**\n\n***\n\n### 局限性\n\
  \n理解*编译（compile）*或*构建（build）*时间与*运行时（runtime）*之间的区别至关重要。C 预处理器在编译之前处理源文件。对源代码的所有影响都发生在代码被*构建*时，而不是在*运行*时。例如，你无法使用预处理器条件来实现当应用程序运行在\
  \ Mac OS X 10.6 时运行一段代码，而在运行在 Mac OS X 10.5 时运行另一段代码。\n\n***\n\n### 提示\n\n![image](img/tip_01.jpg)\n\
  \n**现在是回想你在第 17 章中读过的两件事的好时机：`Generate Preprocessed File` 命令以及辅助编辑器的生成输出（Generated\
  \ Output）行为。**\n\n***\n\n### 总结\n\n你已经看到如何使用 Xcode 的脚本钩子（scripting hooks）来扩展和自动化各种任务。你还探索了\
  \ C 预处理器提供文本替换宏以及在源文件中条件包含文本的能力。掌握了这两个工具的基础知识，Xcode 就可以被扩展并集成到更大的工作流中，实现任务自动化并减少人为错误的概率。在下一章中，你将学习如何使用\
  \ Xcode 的配套应用程序 Instruments 对代码进行性能分析以及更多内容。\n\n## 20. 使用 Instruments\n\nInstruments\
  \ 是 Apple 用于 DTrace 的前端（以及其他功能），DTrace 是一种动态追踪系统，用于记录运行中程序的调试和性能信息。如果你以前从未用过它，Instruments\
  \ 将彻底改变你分析和调试应用程序的方式。一旦你习惯了它的便利，你就会怀疑自己以前是如何从那个充满内存泄漏、僵尸进程和性能瓶颈的黑暗时代走过来的。\n\n###\
  \ DTrace 概述\n\nDTrace 允许你在应用程序运行时对其进行追踪。*追踪（Tracing）*是指记录正在运行的计算机程序的信息，以用于调试和性能分析；它主要由开发者使用。这与“高级日志（high-level\
  \ logging）”不同，后者由终端用户和系统管理员用于记录程序错误、异常、失败的脚本等。\n\nApple 在 Mac OS X 10.5 中增加了对 DTrace\
  \ 的支持并推出了 Instruments。Instruments 将 DTrace 的学习曲线降低到了可以接受的水平，使得许多传统上困难的调试任务相比之下显得微不足道。\n\
  \n在 DTrace 中，一个*探针（probe）*是一个执行特定任务的脚本。在 Instruments 精美的图形化界面中，探针（或一组相互关联的探针）更通泛地称为*仪表（（instrument）*。探针本质上是一个监控特定事件并记录相关信息的脚本。\n\
  \n在量子力学领域，已经证明观察某个事物会改变它的本质。软件性能分析也是如此。例如，在应用程序中添加大量代码来跟踪其性能会*影响*它的性能。DTrace 最受推崇的特点之一是当启用探针时对性能的影响极小；而对于禁用的探针则*没有*影响。这意味着对于大多数开发者来说，追踪行为不会对应用程序的性能特征产生明显影响。正因如此，DTrace\
  \ 可以用于生产系统而不会减慢其速度。\n\n***\n\n### 提示\n\n![image](img/tip_01.jpg)\n\n**你可以通过 `dtrace`\
  \ 命令从命令行运行 DTrace。在终端中输入 `man dtrace` 并按回车以获取更多信息。**\n\n***\n\n### Instruments 导览\n\
  \n一整本书都可以（也应该）专门介绍 DTrace 和 Instruments。可用的仪表列表仍在不断增长，许多仪表需要熟练掌握一种或多种调试和性能分析技术。本节将以典型开发者使用\
  \ Instruments 的三个常见任务作为示例。首先，你需要熟悉 Instruments 的用户界面。\n\n#### Instruments 用户界面概述\n\
  \n当你首次启动 Instruments 时，你会得到一个空文档，并提示你选择一个*模板（template）*来创建 Instruments 为你创建的追踪文档。模板是以特定方式配置的一个或多个仪表。图\
  \ 20.1 显示了带有许多模板的模板选择表。该表与 Xcode 的模板选择表一样，分为几个类别：iOS、iOS 模拟器、Mac OS X 和用户（你创建并提供的模板）。\n\
  \n**图 20.1** 模板选择表\n\n![image](img/xcode-20-01.jpg)\n\n***\n\n### 提示\n\n![image](img/tip_02.jpg)\n\
  \n**你执行的追踪操作是在 Instruments 追踪文档内部完成的。文档包含仪表及其配置，以及每一次追踪会话。它可以被保存以备后用，未来的追踪会话可以追加其中。**\n\
  \n***\n\n图 20.2 显示了一个带有 33 秒记录会话的追踪文档。该文档使用了 Mac 类别下的 Profiler 模板。这里显示了大量信息，所有仪表的主视图都是激活状态。\n\
  \n**图 20.2** 追踪文档\n\n![image](img/xcode-20-02.jpg)\n\n***\n\n### 提示\n\n![image](img/tip_01.jpg)\n\
  \n**追踪文档可以保存。你也可以通过 Record 按钮追加新的会话。**\n\n***\n\n图 20.3 显示了展开的 Profiler（使用名称左侧的收叠箭头）。最新的轨道始终位于顶端。随后的会话将为每个仪表产生额外的轨道，可以通过展开收叠箭头并点击轨道本身来进行查看和比较。激活的轨道显示为深蓝色（见\
  \ 图 20.4）。\n\n**图 20.3** 显示多个轨道的 Time Profiler\n\n![image](img/xcode-20-03.jpg)\n\
  \n**图 20.4** 选择另一个轨道\n\n![image](img/xcode-20-04.jpg)\n\n还有许多本章未涵盖的视图模式。相反，让我们只关注主视图。\n\
  \n#### 工具栏\n\n工具栏上有一些重要的控件组需要你理解。让我们从工具栏左侧开始探索每个主要分组。\n\nRecord 和 Target 控件工作紧密。使用\
  \ Target 控件将 Instruments 附加到任何运行进程。取决于你如何启动 Instruments（参见本章稍后的“启动 Instruments”部分），目标（你正在追踪的应用程序）可能已被选中。使用\
  \ Record 控制追踪。从左到右有一个暂停按钮用于暂停和恢复对运行程序的追踪；Record 按钮用于开始和停止记录新轨道；还有一个重启按钮，它可以停止当前追踪并启动一个新的（产生新轨道）。如果按下\
  \ Record 按钮时程序未运行，它将被启动。\n\n![image](img/rec-targ-controls.jpg)\n\n\n\n\n`Inspection\
  \ Range`（检查范围）控件指定了你想要在时间轴上检查的时间范围。具体而言，你可以过滤掉所有不在指定范围内的跟踪信息。左侧按钮标记你想要检查的时间开始；右侧按钮标记结束。设置了起始点而没有终点意味着“从这里开始显示到最后”；设置了终点而没有起始点意味着“从开始显示到此点的所有内容”。中间按钮清除所选范围。\n\
  \n![image](img/range-controls.jpg)\n\n虽然它不是工具栏的一部分，但理解如何指定某个时间点至关重要。你可以通过拖动滑块控件（scrubber\
  \ control）到时间轴上的所需位置来实现。滑块控件位于乐器轨道正上方的刻度条中。`scrubber` 一词源于音频/视频应用，在这些应用中，时间指针控制在轨道上移动或“擦过”（scrub），以查看和收听被扫描的时间区域。\n\
  \n![image](img/time-scrubber-control.jpg)\n\n工具栏中间的状态控件显示（以小时、分钟和秒为单位）当前跟踪会话（默认情况下）或当前显示的跟踪会话的长度，以及文档中的会话数量（如果记录了多个会话），并提供控件（左、右箭头）在会话之间切换。点击时间显示右侧的小图标，可以在运行时间（会话长度）和检查时间（滑块控件当前位置）之间切换。\n\
  \n![image](img/status-control.jpg)\n\n`View`（视图）控件切换跟踪文档界面中的三种主要视图。从左到右，按钮分别切换 `Instruments`（乐器）、`Detail`（详情）和\
  \ `Extended Detail`（扩展详情）视图。你稍后将探索它们。\n\n![image](img/view-controls.jpg)\n\n`Library`（库）控件切换\
  \ `Library`面板 `图 20.5`，该面板提供了所有可用的乐器。要向跟踪中添加新乐器，请从 `Library` 面板将其拖出并丢到 `Instruments`\
  \ 列表中。\n\n**图 20.5** 库面板\n\n![image](img/xcode-20-05.jpg)\n\n![image](img/library-control.jpg)\n\
  \n`Search`（搜索）控件通过符号或库来过滤显示的跟踪信息（要选择过滤器，点击控件左边缘的放大镜图标并从菜单中选择）。例如，在字段中输入“drawRect”将仅显示关于\
  \ `NSView` 提供的 `-drawRect:` 方法的跟踪信息（以及任何其他名称中包含“drawRect”的方法），假设该方法在记录的跟踪会话期间被调用过。\n\
  \n![image](img/search-control.jpg)\n\n### 策略栏 (Strategy bar)\n\n`Strategy`（策略）栏\
  \ `图 20.6` 是 Instruments 4 中的新功能。它为你提供了三种主要的跟踪 `strategies`（策略）供选择。该栏左侧边缘的按钮在（从左到右）`CPU`、`Instruments`\
  \ 和 `Threads`（线程）策略之间切换。（本章到目前为止的所有插图显示的都是 `Instruments` 策略——这是 Instruments 4 中的默认策略。）弹出菜单允许你按核心、进程和线程进行过滤。在\
  \ `CPU` 和 `Threads` 策略中会出现额外的弹出窗口，允许你指定额外的图表选项。\n\n**图 20.6** 策略栏\n\n![image](img/xcode-20-06.jpg)\n\
  \n最右侧的按钮弹出一个图形图例 `图 20.7)`，其内容取决于图表模式（该模式会对图表信息着色）。图例显示了使用的每个颜色及其在图表中代表什么。\n\n**图\
  \ 20.7** 状态栏图例\n\n![image](img/xcode-20-07.jpg)\n\n`图 20.8` 显示了使用 `CPU` 策略的 `图 20.3`\
  \ 中的跟踪会话。应用程序活动根据发生它的 `CPU` 核心划分。如果你在 `Instruments` 列表中有多个乐器，使用 `Instruments` 列表下方的弹出菜单在它们之间切换，查看它们收集的跟踪信息\
  \ `图 20.9`。\n\n**图 20.8** CPU 策略\n\n![image](img/xcode-20-08.jpg)\n\n**图 20.9**\
  \ 乐器选择弹出窗口\n\n![image](img/xcode-20-09.jpg)\n\n`图 20.10` 再次显示相同的跟踪会话，这次使用了 `Threads`\
  \ 策略。在这里，应用程序活动按线程划分（如果你运行的是 Mac OS X 10.6 或更高版本，你可能会看到许多从未知道它们创建过的线程）。\n\n**图 20.10**\
  \ 线程策略\n\n![image](img/xcode-20-10.jpg)\n\n### 乐器视图 (Instruments view)\n\n`Instruments`\
  \ 视图 `图 20.11` 在顶部列表中显示了所有乐器（或核心或线程，取决于所选策略）。可以通过点击乐器来选择每个乐器。选中后，按下 `Delete` 键将从跟踪中删除该乐器（及其数据）。点击乐器右侧的\
  \ `i` 按钮可以显示弹出窗口 `图 20.12)`，它提供了更多跟踪数据和选项。\n\n**图 20.11** 乐器视图\n\n![image](img/xcode-20-11.jpg)\n\
  \n**图 20.12** 弹出窗口\n\n![image](img/xcode-20-12.jpg)\n\n**注意**\n\n![image](img/note_01.jpg)\n\
  \n乐器列表下方的控件用于缩放时间轴。它不是 `Instruments` 视图的一部分，但在切换视图时保持位置不变。同样，在 `图 20.9` 中看到的乐器选择弹出窗口属于\
  \ `Detail` 视图的导航栏。\n\n### 详情视图 (Detail view)\n\n`Instruments` 视图（及其轨道）控制并显示收集的基础，而\
  \ `Detail` 视图是显示和探索实际信息的地方。当你切换 `Detail` 视图时，注意顶部的导航栏仍然可见。这允许你在不显示 `Detail` 视图的情况下继续导航数据。\n\
  \n导航栏 `图 20.13)` 由三个独立的区域组成。最左侧的区域是乐器选择弹出窗口（你在 `图 20.9)` 中看到的）。此控件允许你选择在 `Detail`\
  \ 和 `Extended Detail` 视图中显示的乐器跟踪信息，效果与点击列表乐器相同。乐器选择右侧的显示模式允许你选择如何显示跟踪信息。可用模式列表取决于所选乐器，但大多数模式共有\
  \ `Call Tree` 和 `Console` 模式。最后，该栏的其他部分用于导航上下文（类似于 Xcode 编辑器上方的栏），允许你在当前视图的细节级别之间导航。\n\
  \n**图 20.13** 详情视图导航栏\n\n![image](img/xcode-20-13.jpg)\n\n乐器选择控件下方是特定于活动乐器的过滤器和显示选项分类列表\
  \ `图 20.14`。这些控件仅在同时显示 `Detail` 和 `Instruments` 视图时可见，且其内容随乐器的不同而变化巨大。一个常见的用例是运行应用程序的时间剖析，选择\
  \ `Call Tree` 显示模式，然后（在过滤器和选项列表的 `Call Tree` 组下）选择隐藏缺失和系统符号并仅显示 Objective-C 信息。这让你只看到你自己的代码，而不是包含与你的代码链接的无数系统库的信息。\n\
  \n**图 20.14** 活动乐器的选项列表\n\n![image](img/xcode-20-14.jpg)\n\n\n\n\n主视图（通常是一个表格或大纲）列出了\
  \ Instruments 针对你的应用程序收集的各个数据点；它显示的信息特定于所选的工具。`图 20.15` 显示了 Time Profiler 收集的 Objective-C\
  \ 相关的调用树信息。顶部的结果揭示了 TestApp 在性能分析期间耗费时间最多的方法：`WebFrame` 类的 `-drawRect:contentsOnly:`\
  \ 方法，该类是 WebKit 框架的一部分。这是合乎逻辑的，因为在整个跟踪期间，我使用 TestApp 的 Web 窗口浏览了几个网页。因此，WebKit 一忙于绘制网页。你将在本章的稍后部分更深入地探索\
  \ Time Profiler。双击列表中的条目通常可以深入查看更详细的信息。再次强调，这是特定于工具的，因此在此无法进行通用的描述。\n\n**图 20.15**\
  \ 显示调用树信息的详情视图\n\n![image](img/xcode-20-15.jpg)\n\n### 扩展详情视图 (The Extended Detail\
  \ view)\n\n扩展详情视图（`图 20.16`）显示了详情视图中所选数据的扩展信息。与其他面向详情的视图一样，其内容是特定于工具的。在图中，该视图正在显示关于\
  \ `图 20.15` 中选定的 Time Profiler 符号的扩展详情。在这种情况下，显示最重的堆栈跟踪（负责调用所选符号的大次数次数堆栈跟踪）是合适的。此视图表示的信息与调试导航器（Debug\
  \ navigator）中找到的信息相同。底部的滑块原理与调试导航器中的滑块也相同——它会根据自己的位置智能地过滤掉堆栈跟踪中“无趣”的区块。\n\n**图 20.16**\
  \ 扩展详情视图\n\n![image](img/xcode-20-16.jpg)\n\n### 启动 Instruments (Launching Instruments)\n\
  \n现在你已经熟悉了 Instruments 界面的主要方面，准备好自己启动它了。有两种方法。你将先学习较长的方法，以感受 Instruments 是如何附加到进程的，然后学习简单的方法。\n\
  \n#### 较长的方法 (The Long Way)\n\n较长的方法涉及你自己从 `/Developer/Applications` 文件夹启动 Instruments。然后你为你的文档选择一个模板并点击“Choose”（选择）。文档将完成配置并等待你的命令。下一步是选择你想让\
  \ Instruments 附加的进程。使用 Target 控制控件并导航其菜单（`图 20.17`）来找到并选择你所需的运行进程。最后一步是按“Record”（记录）按钮开始跟踪。\n\
  \n**图 20.17** Target 控制器的菜单\n\n![image](img/xcode-20-17.jpg)\n\n较长的方法是附加到已经运行或在\
  \ Xcode 之外运行的进程的*唯一*方法。这句话中最有趣的部分是其隐含的：你实际上*可以*出于各种诊断原因附加到其他进程。例如，作为高级用户或系统管理员，你甚至可以监控进程的文件系统访问——这在安装程序交付负载时监视其负载非常有用。\n\
  \n#### 简单的方法 (The Easy Way)\n\n简单的方法（针对你的 Xcode 项目）是从 Xcode 内部选择“Profile”（分析）操作。你已经熟悉了\
  \ Run（运行）、Test（测试）和 Archive（归档）操作。你可以通过从主菜单选择 Product > Profile 来触发 Profile 操作；或者通过点击并按住\
  \ Run 按钮从*它的*菜单中选择 Profile；或者按下 Command+I。当然，你必须打开一个项目或工作区，并且它必须成功构建（就像执行 Run 操作时一样）。\n\
  \n假设你的项目构建成功，Instruments 将启动并提示你为新的跟踪文档选择一个模板，正如你在 `图 2.1` 中看到的那样。一旦你选择了模板，Instruments\
  \ 将启动你的应用程序，将其附加到其上，并开始记录跟踪。你将在下一节的示例中看到这一操作。\n\n### 使用 Instruments 完成常见任务 (Using\
  \ Instruments for Common Tasks)\n\n现在你已经知道了 Instruments 的基础知识，是时候将它们应用到常见的调试和性能分析任务了。你将开始使用\
  \ Time Profiler 来追踪一个人为的性能问题。然后你将找到一个内存泄漏，并追踪并杀死僵尸进程入侵。\n\n#### 性能分析 (Time Profiling)\n\
  \n在一个在中等到复杂的应用程序中，如果不遇到性能问题，你就无法走得远。这类问题传统上很难追踪。大多数情况下，原因与你怀疑的完全不同。Instruments 的\
  \ Time Profiler 模板具有一种神奇的能力，可以向你展示代码中可能从未怀疑过的低效之处。\n\n要开始，打开 TestApp 的 `TestAppAppDelegate.m`\
  \ 文件并修改 `-applicationDidFinishLaunching:` 方法，使其包含此行：\n\n```\n[self doSomethingStupid];\n\
  ```\n\n在 `-applicationDidFinishLaunching:` 方法的结束大括号之后，添加此新方法：\n\n```\n- (void)doSomethingStupid\n\
  {\n    NSMutableArray * array = [NSMutableArray arrayWithCapacity:1000000];\n  \
  \  NSNumber * number;\n    for (NSInteger i = 0; i < 10000; i++)\n    {\n      \
  \  number = [NSNumber numberWith:i];\n        [array addObject:number];\n    }\n\
  }\n```\n\n为了消除出现的警告，在 App delegate 的头文件 (`TestAppAppDelegate.h`) 中声明 `-doSomethingStupid`：\n\
  \n```\n- (void)doSomethingStupid;\n```\n\n这段代码实际上创建了一个容量为 1,000,000 的可变数组，并填充了 10,000\
  \ 个 `NSNumber` 实例。意料之中，这将花费一些时间并导致应用无响应。一旦有了这些代码，按下 Command+I 来调用 Profile 操作。\n\n\
  假设没有错误，Instruments 将启动并提示你选择模板。选择 Time Profiler 模板并点击 Profile 按钮。TestApp 将启动，但时间会比通常长。一旦它启动并显示窗口，按\
  \ Record 按钮停止跟踪。确保显示 Instruments 和详情视图，并将详情视图模式设置为 Call Tree。然后，在详情视图左侧的 Call Tree\
  \ 选项，确保 Invert Call Tree（反转调用树）、Hide System Libraries（隐藏系统库）和 Show Obj-C Only（仅显示\
  \ Obj-C）是唯一的选项。这将显示 TestApp 的符号。你应该看到类似于 `图 20.18` 的内容。\n\n**图 20.18** TestApp 的调用树\n\
  \n![image](img/xcode-20-18.jpg)\n\n在图中，只显示四个符号（都来自 `TestAppAppDelegate.m`）。尽管你的数字可能略有不同（特别是取决于你在启动后等了多久才停止跟踪），但显而易见，TestApp\
  \ 大部分时间都在做一些蠢事。\n\n许多开发者的本能反应归咎于紧凑的 `for` 循环。当然，创建一万个对象需要时间。敏锐的 Cocoa / Objective-C\
  \ 开发者在这样一个人为示例中会更明智，但这正是 Time Profiler 发挥光芒的地方。双击列表中的 `-[TestAppDelegate doSomethingStupid]`\
  \ 符号，详情视图将证明其名称（`图 20.19`）。\n\n**图 20.19** 叠加了热图的源代码\n\n![image](img/xcode-20-19.jpg)\n\
  \n在图中，显示了 `TestAppAppDelegate.m` 并叠加了一些额外信息。Instruments 分解了在该符号中（`-doSomethingStupid`\
  \ 方法）花费的时间，以突出显示其中最耗时的指令。\n\n\n\n要查看百分比（如图 20.19 所示），你可能需要点击右上角的齿轮按钮并在菜单中选择 `View\
  \ as Percentage`（以百分比显示）。叠加层通过颜色编码作为热力图，颜色（从“深红色”到“不热的黄色”及以上）代表你的计算机执行最耗时指令所花费的时间。\n\
  \n这让一点变得非常明显：罪魁祸首不是 `for` 循环，尽管它确实花费了时间。那个红色的指令（在上面的示例中占了该方法执行时间的 89.5%）是你分配并初始化\
  \ `NSMutableArray` 的那行。如果你还不知道这是为什么，那么这里就是 Instruments 更加强大的地方。\n\n点击详情视图（Detail\
  \ view）导航栏上的 `Call Tree`（调用树）部分返回符号列表。取消勾选 `Hide System Libraries`（隐藏系统库）复选框，以便显示\
  \ `TestApp` 的调用之外之外的所有系统库调用。`TestApp` 的符号将会消失，取而代之的是一些系统库符号。由于调用树是反的，栈中最深层调用显示为顶层对象，而顶部的结果是由于\
  \ `-doSomethingStupid` 产生的调用。\n\n展开项目，直到你看到类似于图 20.20 的内容。你会看到 `-doSomethingStupid`\
  \ 接着调用了 Cocoa，并且仅仅在创建数组上花费了大量时间。虽然它没有告诉你*为什么*，但它确实引起了你的注意。对于那些仍在好奇的人来说，原因是你滥用了 `-[NSMutableArray\
  \ arrayWithCapacity:]`，分配了大量你甚至没有在使用的内存。当然，如果你*确实*在使用所有这些空间，分配它们也会花费同样的时间，但关键点在于，问题并不是许多开发者最初怀疑的地方（特别是如果该分配是在代码的其他部分完成的）。\n\
  \n**图 20.20** 带系统库的 `TestApp` 调用树\n\n![image](img/xcode-20-20.jpg)\n\n尽管这是一个人为构造的例子，但它清晰地展示了\
  \ Instruments 强大且直观的轨迹信息可视化方式——这种方式只需点击几次即可揭示性能问题的根源。既然你已经知道了问题所在，最简单的方法可能是使用更理智的容量（尤其是因为你已经知道需要\
  \ 10,000 个对象）。通过对这两种场景进行分析，将这种方法与使用 -[`NSMutableArray array]` 创建数组进行对比。你会发现，只要使用得当，`-arrayWithCapacity:`\
  \ 方法是更好的选择。\n\n### 查找内存 (Leaks)\n\nObjective-C 提供的引用计数内存管理非常困难。你很容易在来得及告诉对象不再需要之前就“释放”了它。正如你在第\
  \ 17 章中所学到的，这样的对象——或者更具体地说，它的内存——被认为泄漏了。这是因为只要应用程序仍在运行，你就不再拥有该对象的引用，并且无法释放它（希望它能被释放内存）。那部分内存现在被*卡住*，直到你的程序终止。糟糕糟糕，如果你的泄漏是由频繁发生的事情触发的，应用程序将迅速消耗大量内存。在\
  \ iOS 和（较小程度上）Lion 上，这将导致应用程序接收到低内存警告，并最终被操作系统终止。\n\n内存传统上很难追踪。幸运的是，Instruments\
  \ 让它变得简单得多。为了测试这一点，让我们在 `TestApp` 中创建并泄漏一个对象。你不需要任何花哨的东西——简单的 `NSObject` 实例即可。将以下代码添加到\
  \ `TestAppAppDelegate.m` 的 `-applicationDidFinishLaunching:` 方法中，紧接调用 `-doSomethingStupid`\
  \ 之后：\n\n```\nNSObject * leaked = [[NSObject alloc] init];\n```\n\n现在按 Command+I\
  \ 调出 `Profile` 操作。当 Instruments 询问模板时，选择 `Leaks` 并点击 `Profile` 按钮。由于 `Leaks` 工具每隔\
  \ 10 秒左右分析一次数据（并且需要几秒钟启动），请让轨迹运行 15–20 秒后再停止它。点击 `Leaks` 工具以选中它（`Allocations` 工具位于列表顶部，并会随之运行提供帮助）。你应该能看到类似于图\
  \ 20.21 的内容。\n\n**图 20.21** `Leaks` 工具\n\n![image](img/xcode-20-21.jpg)\n\n你会发现\
  \ `Leaks` 恰好发现了一个泄漏的对象。正如预期的那样，它是一个 `NSObject`。如果你点击内存地址右侧的向右箭头（在 `Address` 列中），你会看到对象的历史（图\
  \ 20.22）。它没有多少历史（一个寿命很长的活对象可能有好几页的 retain、release 和 autorelease），但已有的历史告诉了你需要的所有信息。`Responsible\
  \ Caller`（责任调用者）列指示它是在 `-applicationDidFinishLaunching:` 中泄漏的，正如你预期的那样。\n\n**图 20.22**\
  \ 泄漏对象的历史\n\n![image](img/xcode-20-22.jpg)\n\n双击历史条目。图 20.23 显示了代码中泄漏的确切位置。当 `-applicationDidFinishLaunching:`\
  \ 完成时，对对象（命名为 `leaked`）的引用失效。你通过发送 `-release` 或 `-autorelease` 失去了告诉它不再需要的机会。\n\n\
  **图 20.23** 代码中高亮的泄漏对象\n\n![image](img/xcode-20-23.jpg)\n\n通常，你需要对象的复杂历史来追踪一个被创建、传递但错误处理而非正确销毁对象的生命周期。双击历史中的每一点不仅可以帮助你识别哪里发生了错误，还能提供关于错误从哪里真正开始的见解（这可能在错误的上游很多）。\n\
  \n### 杀死僵尸 (一击必喉)\n\n如果说内存泄漏有反面，那么*悬空指针*或意外过度释放的对象就是它的反面。悬空指针是指在对象消失（被释放内存）时没有设置为\
  \ `nil` 的指针变量，它指向一个无效的内存地址。这会导致带有特征信号 `EXC_BAD_ACCESS` 的崩溃，这是操作系统告诉你你不应该再在那里捣乱的方式。这些官方上是许多\
  \ Cocoa 开发者最讨厌的内存管理错误。\n\n长期以来有一种名为 `NSZombie` 的机制帮助开发者追踪这些棘手的错误。当启用“僵尸”时，运行时不会释放对象，而是将对象变成僵尸并保留它们。如果僵尸收到消息（表明你的代码尝试引用不该引的对象），系统会将其标记为收到消息的僵尸。僵尸不是发生在对象的坏事；它们为开发者提供了无价的服务。然后开发者就可以用铲子砸碎脑壳了。\n\
  \n过去，你必须在启动时手动向应用程序传递参数，然后进行大量的挖掘来理解结果。现在你应该能考虑到 Instruments 让这一切变得多么简单。为了发现，请将上一个示例中的泄漏对象行替换为这三行（并确保拼写正确——那是\
  \ *brraaiinns*）：\n\n```\nNSObject * brraaiinns = [[NSObject alloc] init];\n[brraaiinns\
  \ release];\n\nNSLog(@”%”, brraaiinns);\n```\n\n\n\n现在对应用进行分析（`Command+I`）。选择 Zombies\
  \ 模板。几乎立即，应用程序就会因崩溃而崩溃。你会看到两个东西。最上方的是意外退出的通知（`图 20.24`），它是可以忽略的（通过点击“忽略”）。更有趣的是，在`图\
  \ 20.25`）中，你会注意到一个方便的弹出窗口通知你有一个僵尸（zombie）接收了消息。点击僵尸内存地址旁指向右侧的箭头查看该内存地址的糟糕历史。\n\n\
  **图 20.24** 意外退出通知\n\n![image](img/xcode-20-24.jpg)\n\n**图 20.25** Instruments 标记了接收消息的僵尸\n\
  \n![image](img/xcode-20-25.jpg)\n\n`图 20.26` 显示了该内存地址的完整生命周期。明显的条目是 RefCt（引用计数）列显示为\
  \ -1 的那一个。有一个消息传递给了那个僵尸。双击每个条目查看代码（实际上任何条目都可以，因为整个历史都发生在连续的三行代码中）。\n\n**图 20.26**\
  \ 僵尸对象的生命周期\n\n![image](img/xcode-20-26.jpg)\n\n在`图 20.26`中显示的历史，以及让我们能够导航到对象在它应该死亡时接收消息的代码点，对于发现导致内存管理\
  \ bug 的逻辑缺陷来说是无价之宝的。因为它显示的是内存地址的历史而不是对象本身的历史，因此请记住，你可能会看到在在该地址上生存过的其他对象的生命周期条目。寻找那个明显的\
  \ -1 引用计数，以确保你找到了正确的对象。\n\n***\n\n提示\n\n![image](img/tip_02.jpg)\n\n**你可能已经注意到，Zombies\
  \ 模板实际上就是那个老旧的 Allocations（内存分配）工具。区别在于其信息弹出窗口中开启的额外选项（点击 Instruments 列表中工具右侧的 *i*\
  \ 按钮）。**\n\n***\n\n### 其他许多 Instruments\n\n还有许多其他优秀的 Instruments 模板，但书中没有足够的空间来详细介绍它们。有用于分析内存管理、垃圾回收、多核进程、Grand\
  \ Central Dispatch（GCD）队列、文件系统访问、Lion 的 Autolayout 的模板，甚至还有一个 UI 录制器可以录制和回放用户界面事件以进行重复\
  \ UI 测试。通过帮助菜单查看 Instruments 文档以获取更多详情。\n\n### 总结\n\n你已经看到 Instruments 如何为一个强大的追踪系统提供非常简单的\
  \ GUI 界面。它将许多令人印象的调试和测试任务转化为微不足道的思考，这种多样性可能会让人目不从心。如果经历了这一切，你仍然迫不及待地将 Instruments\
  \ 附加到自己的应用中，看看什么样的以前未发现的性能和内存问题会带着惊人的 Apple UI 美感跳到你面前，那么你就太固执了，可能想让这整个 GUI 狂热远离你的生活。在下一章也是最后一章中，你将探索\
  \ Apple 对源码管理的 GUI 处理方式，这可能会让你同样恼火。\n\n## 21. 源代码管理\n\n源代码管理，也称为修订控制或版本控制，是变更控制的一种形式，对于任何中型到大型开发项目都是关重要的。在团队环境中，完整的源代码管理系统通常用于管理多个个人在相同资源上完成的工作。\n\
  \nXcode 提供了两种管理源代码的主要方式：通过使用快照（snapshots）以及通过它与两个完整的源代码管理（SCM）系统的集成。你将在本章中探索这两种。\n\
  \n### Xcode 快照\n\n将代码置于版本控制下的最简单方法是使用 Xcode 的快照功能。快照仅仅是你整个工作区的归档副本。Xcode 允许你恢复快照，这等同于从快照时刻提取工作区文件夹的副本。\n\
  \n这是最基础的版本控制形式，如果你不使用完整的 SCM 系统，你至少应该使用快照。如果你进行了复杂的但没有结果的实验性更改，你会感谢自己在开始真正搞砸一切之前拍摄了快照。由于这非常重要，Xcode\
  \ 在你第一次使用重构（Refactor）功能时会尝试强制你启用自动快照。\n\n#### 配置快照\n\n可以通过主菜单中选择 `File > Workspace\
  \ Settings`（如果你正在处理单个项目，则选择 Project Settings）来配置快照。将出现工作区设置面板。点击 Snapshots 选项卡以显示快照设置（`图\
  \ 21.1`）。\n\n**图 21.1** 项目的 Snapshots 设置\n\n![image](img/xcode-21-1.jpg)\n\n复选框控制在批量编辑操作（如重构或全工作区查找并替换）之前是否自动拍摄快照。由于\
  \ Xcode 会会在你第一次使用批量编辑功能之前询问你是否想要启用自动快照，因此通过此面板启用此功能没有必要，但如果你以后想为了使用完整的 SCM 系统而禁用它，它可能会有用。\n\
  \nSnapshots Location 控制允许你存储当前工作区或项目的快照。默认位置是你主目录中的一个位置，与 Xcode 的派生数据（derived data）并存。快照设置属于单个项目或工作区。\n\
  \n#### 创建快照\n\n你可以随时通过主菜单选择 `File > Create Snapshot` 为项目创建快照。系统会提示输入名称和描述（`图 21.2`）。\n\
  \n**图 21.2** 创建快照面板\n\n![image](img/xcode-21-2.jpg)\n\n如果将所有快照都命名为“New snapshot”而没有任何描述，对你来说将毫无用。应该选择良好的名称和描述，以便在需要时识别是在何时拍摄的。选择任何适合你的命名和描述系统，但你应该有一套系统。`图\
  \ 21.3` 显示了可能的名称和描述。点击 Snapshot 创建快照。工作区的完整副本将被归档并存储在你指定的快照位置。\n\n**图 21.3** 有意义的名称和描述\n\
  \n![image](img/xcode-21-3.jpg)\n\n#### 管理快照\n\n快照在 Organizer 窗口中管理。从主菜单选择 `Window\
  \ > Organizer` 并选择 Projects 选项卡。选择你想要管理的项目或工作区。`图 21.4` 显示了 TestApp Suite 工作区的快照。\n\
  \n**图 21.4** TestApp 项目的快照\n\n![image](img/xcode-21-4.jpg)\n\n在图中，快照列表正上方有一个过滤栏。搜索栏通过关键词过滤（包括标题和描述）。你还可以选择显示工作区的所有快照，或者只显示你自己拍摄的（也就是说，你可以排除自动快照）。\n\
  \n列表按日期排序快照。选择快照将启用底部的 Export Snapshot 和 Delete Snapshot 按钮。Export Snapshot 按钮将提取出的快照副本放置在你选择的位置，而\
  \ Delete Snapshot 按钮将永久删除该快照。\n\n#### 从快照恢复\n\n你可以通过主菜单选择 `File > Restore Snapshot`\
  \ 来恢复快照。从列表中选择快照（`图 21.5`）并点击 Restore。\n\n\n\n\n**图 21.5** 快照选择工作表\n\n![image](img/xcode-21-5.jpg)\n\
  \n将会出现一个工作表（`图 21.6`）。从左侧列表中选择你想要恢复的特定文件。若要恢复整个项目，只需勾选所有文件即可。点击 `Restore`（恢复）。项目将恢复到你拍摄快照时的状态（或者如果你在恢复时没有包含所有文件，则仅恢复所选文件）。作为额外奖励，Xcode\
  \ 会在恢复快照之前自动创建一个新的快照，以便你可以撤销掉这次“撤销”操作。只有在你启用了“在进行批量编辑操作前创建项目快照”功能时，这种情况才会发生。\n\n\
  **图 21.6** 快照审核工作表\n\n![image](img/xcode-21-6.jpg)\n\n### 使用 SCM 系统\n\nXcode 的快照功能管理备份副本，并可用于存储项目及其资源的多个版本，但如果你熟悉\
  \ SCM（源代码控制管理）系统——本章的这一节假设你至少有一定的了解——你就能看到快照的局限性在哪里。\n\nXcode 目前支持并集成了两个著名的 SCM\
  \ 系统：`Git` 和 `Subversion (SVN)`。`Subversion` 主要是基于服务器的（服务器通常但并非总是远程位置），而 `Git` 是所谓的“分布式\
  \ SCM”，运行它不需要服务器（远程或其他）。分布式 SCM 有许多优势，这些以及其他原因使得 `Git`（或其他某些分布式 SCM）很可能在未来几年内取代\
  \ `Subversion`。Apple 似乎也同意这一点。Xcode 对 `Git` 的支持比对 `Subversion` 的支持稍微广泛，且明显更加完善。尽管如此，Xcode\
  \ 为 `Git` 和 `Subversion` 的支持都安装了必要的工具。在终端中输入 `man git` 或 `man svn` 可查看详情。\n\n***\n\
  \n注意\n\n![image](img/note_01.jpg)\n\n**要了解更多关于 `Git` 的信息，请参阅 `[`xcodebook/gitimmersion`](http://xcodebook/gitimmersion)`；`SVN`\
  \ 则请参阅 `[`xcodebook.com/svnprimer`](http://xcodebook.com/svnprimer)`。****\n\n***\n\
  \n#### Git 和 SVN 的区别\n\n在大多数情况下，最大的区别在于术语。例如，当 `Git` 用户 `clones`（克隆）时，`Subversion`\
  \ 用户 `checks out a working copy`（检出工作副本）。当 `Git` 用户 `pulls`（拉取）时，`Subversion` 用户\
  \ `updates`（更新，并可能合并）。`Git` 用户 `stage`（暂存）更改并 `commit`（提交），然后可能将它们 `push`（推送）到远程服务器（`origin`）；`Subversion`\
  \ 用户只需 `commit`（提交）（不过不要被迷惑了——`Git` 的模型有很多值得说的地方）。\n\n这两个系统之间最大的区别在于，正如前一段暗示的那样，`Subversion`\
  \ 用户的 `commit` 意味着更改成为了仓库的一部分（通常位于检出它的那个远程服务器上），而 `Git` 用户的 `commit` 是一个本地操作。`Git`\
  \ 用户拥有整个仓库（及其完整历史）的副本，并可以选择是否将这些更改推送到 `origin`（通常是托管在服务器上的中央仓库）。无论远程服务器（克隆的 `origin`）是否可用，`Git`\
  \ 提交都可以发生。\n\n本章仅将部分关注 Xcode 的 `Git` 支持，因为 Apple 似乎已经选了队。主要是 `Git` 成为焦点是因为 Xcode\
  \ 尽可能提供了一个同化的用户界面，无论你是使用 `Git` 还是 `Subversion`，其工作方式几乎相同。即使有差异，也都是微不足道的。除非特别提到，否则这些差异大多是术语上的。\n\
  \n#### 管理仓库\n\n很有可能，你已经有了绑定到现有仓库的 Xcode 项目。你可能已经有一个本地克隆（在 `Git` 中）或检出的工作副本（在 `Subversion`\
  \ 中）。让 Xcode 感知到 SCM 关联状态的最快方法是打开项目。Xcode 将尝试建立任何到仓库 `origin` 或 `Subversion` 远程服务器的连接。如果需要身份验证且\
  \ Xcode 没有凭据，它将在打开项目时提示你输入凭据。\n\n你可以通过 `Organizer`（组织者）窗口管理仓库。要查看它们，请从主菜单选择 `Window\
  \ > Organizer`，然后选择 `Repositories`（仓库）标签页。`Organizer` 的 `Repositories` 标签页（`图 21.7`）在面板左侧维护了它遇到的所有仓库列表（以及相关的克隆和\
  \ `origins`）。当选择一个仓库时，右侧会显示仓库的详情及其历史；当选择工作副本或克隆时，将显示文件和文件夹结构、工作副本的历史以及特定 SCM 的工具栏。你将在本章的剩余部分详细探索此\
  \ UI。\n\n**图 21.7** Organizer 的 Repositories 标签页\n\n![image](img/xcode-21-7.jpg)\n\
  \n如果你一直在跟进自己的 `TestApp` 项目，那么 Xcode 已经在跟踪你创建的每个项目的 `Git` 仓库（`TestApp`、`TestAppSharedFramework`\
  \ 和 `TestApp Touch`）。因为你选择让 Xcode 为每个项目创建一个 `Git` 仓库，所以 Xcode 已经为每个项目跟踪了 `Git` 仓库。由于你选择让\
  \ Xcode 为每个项目创建一个 `Git` 仓库，对于一组应用程序可以使用独立的仓库，仓库之间的边界几乎不可察觉，不会影响日常任务。\n\n#### 创建仓库\n\
  \n正如前面的章节所学到的，Xcode 在创建新项目时允许你创建 `Git` 仓库。在提示保存新项目的位置时，保存对话框底部包含 Source Control\
  \ 选项。**图 21.8](#ch21_html_ch21fig08)** 显示了创建 Git 仓库的选项。\n\n**图 21.8** 保存新项目时创建 Git\
  \ 仓库\n\n![image](img/xcode-21-8.jpg)\n\n遗憾的是，这就是 Xcode 创建仓库的能力。限于创建项目时创建本地仓库。\n\n\
  一切并非徒劳。你仍然可以通过命令行充分利用 `Git`，将现有项目转换为 `Git` 仓库。在终端中输入以下命令（`your_project_folder` 为项目主目录的完整路径）：\n\
  \n```\ncd your_project_folder\ngit init\n```\n\n就这样。该文件夹现在是一个 Git 仓库了。\n\n要创建一个本地托管的\
  \ `Subversion` 仓库，你无法使用 Xcode，但可以使用终端：\n\n```\nsvnadmin create your_project_folder\n\
  mkdir your_project_folder\n```\n\n然后可以使用以下代码将现有项目导入新仓库：\n\n```\nsvn import path_to_existing_files\
  \ file://full_path_to_project_folder/trunk/ -m \"Initial import\"\n```\n\n不像 `Git`\
  \ 那么优雅，但它可以解决问题。\n\n#### 手动添加仓库\n\n你可以通过 `Organizer` 添加仓库和工作副本。无论是你删除了它们，还是 Xcode\
  \ 在打开版本控制项目时由于原因未能自动添加，你都可以手动添加和删除。这是通过源列表底部的 `(+)` 按钮实现的。\n\n请记住源列表是一个大纲。顶级节点是单个仓库。它们的子节点是属于它们的所有已知工作副本或克隆，以及访问分支和标签的方便文件夹。要添加仓库，点击\
  \ `(+)` 按钮并从菜单中选择 `Add Repository`。将会一个工作表（`图 21.9`），要求输入名称、位置和类型。名称只是一个方便的标识符，可以是你喜欢的任何名称（例如\
  \ *My Company Repository* 或只需 *Fred*）。然而，位置必须是有效的仓库 URL。\n\n**图 21.9** 添加远程 Git\
  \ 仓库\n\n![image](img/xcode-21-9.jpg)\n\n\n\n\n\n当使用类似 `svn://` 和 `git://` 类型的 URL\
  \ 时，系统会自动检测类型，但以 `ssh://`、`http://` 或 `https://` 开头的 URL 将要求你在 `Type` 字段中选择正确的 SCM\
  \ 系统类型。当提供的 URL 指向有效仓库时，`Location` 字段下方的指示灯将变为绿光。\n\n### 提示\n\n![image](img/tip_01.jpg)\n\
  \n`Add a Repository`（添加仓库）表单对于 Subversion 仓库可能更有用，因为克隆的 `Git` 仓库是整个仓库的副本。对于 `Git`，实际上通过打开包含它的项目来添加仓库更符合用户习惯——Xcode\
  \ 会为你设置好一切（包括如果存在源仓库 `origin`）。\n\n要添加一个 `Git` 克隆（或 Subversion 工作副本），你可以将其拖入 `Organizer`（组织者）中\
  \ `Repositories`（仓库）选项卡下的源列表，或者再次使用 `Add (+)` 按钮，转而从菜单中选择 `Add Working Copy`（添加工作副本）。这次，你将面对一个标准的\
  \ `Open`（打开）对话框，允许你选择包含工作副本或克隆的文件夹。一旦选择了文件夹，工作副本（及其关联的仓库条目）就会添加到 `Organizer` 中。\n\
  \n### 注意\n\n![image](img/note_02.jpg)\n\n对于 Subversion 仓库，`branches` 和 `tags` 文件夹必须存在于你添加的仓库根目录下，Xcode\
  \ 才能识别它们。目前没有方法可以将 `Organizer` 列表中的对应条目映射到非预期位置。\n\n### 克隆与检出\n\n如果你还没有本地克隆，Xcode\
  \ 提供了几种 UI 方法来创建一个。一种方法是使用 `Organizer` 的 `Add (+)` 按钮。另一种方法是在 `Welcome to Xcode`\
  \ 窗口（`Command+Shift+1`）中选择 `Connect to a Repository`（连接仓库）选项。图 21.10 显示了一个名为 `GitApp`\
  \ 的 `Git` 仓库，通过 `ssh` 托管在远程服务器上。`Location` 字段下方指示灯显示主机可访问且位置有效。\n\n**图 21.10** 指定远程仓库位置\n\
  \n![image](img/xcode-21-10.jpg)\n\n点击 Next 显示如图 21.11 所示的表单，要求为工作副本或克隆命名。名称可以是任何内容。`Type`\
  \ 字段通常已设置为正确的 SCM 类型（`Subversion` 或 `Git`），如果错误或未指定，你需要在此选择。点击 `Clone`（对于 Subversion\
  \ 为 `Checkout`）按钮继续。系统将提示你选择计算机上的位置保存克隆或工作副本。点击 `Clone`。\n\n**图 21.11** 为克隆命名\n\n\
  ![image](img/xcode-21-11.jpg)\n\n克隆或检出将开始。可能会要求提供验证信息。提供必要信息并点击 OK。根据仓库的大小，实际的检出或克隆可能需要一段时间。完成后，它将与其他仓库一起显示在\
  \ `Organizer` 中。\n\n### 注意\n\n![image](img/note_02.jpg)\n\n通常会为 SCM 服务器设置免密 SSH\
  \ Key。如果你已经设置了服务器密钥但 Xcode 提示你输入用户名和密码，最好保持用户名字段为空且不提供密码。有关设置 SSH Key 的 `Git` 示例，请参见\
  \ [`xcodebook.com/gitkey`](http://xcodebook.com/gitkey)。\n\n### 执行常规 SCM 任务\n\n\
  你已经学习了如何克隆你的 `Git` 仓库。现在我们将探索如何在 Xcode 中执行典型的日常 SCM 管理任务并管理项目更改。\n\n#### 管理 Subversion\
  \ 文件夹\n\nSubversion 处理文件和文件夹；`Git` 处理文件或 `chunks`（文件的部分）。由于此原因，Subversion 用户需要通过\
  \ Subversion 进行目录结构更改，而 `Git` 用户可以自由移动文件和文件夹。\n\n在 Xcode 中，你通过 `Organizer` 的 `Repositories`\
  \ 选项卡管理 Subversion 文件夹。你需要首先选择仓库。使用右侧列表（显示工作副本目录结构）选择要创建子文件夹的文件夹，然后点击 `New Directory`（新建目录）按钮。要删除文件夹，点击\
  \ `Organizer` 中的 `Delete` 按钮。通过在 `Organizer` 中点击并像编辑其他文件名一样编辑它们来重命名文件夹。这些更改都需要立即提交。Xcode\
  \ 将提示你输入提交信息。\n\n#### 检查状态\n\n在整本书中，你一直在回避那个显而易见的问题（或者说是 `Project navigator` 中的符号）。图\
  \ 21.12 显示了 `Project navigator` 中的 `TestApp` 工作区。展开的 `TestApp` 项目项目成员的待处理 SCM 状态以“标签”显示在列表右边缘。\n\
  \n**图 21.12** Project navigator 中的 SCM 状态\n\n![image](img/xcode-21-12.jpg)\n\n每个状态标签的含义如下：\n\
  \n![image](img/36tab01.jpg)\n\n状态消息可能有不同的含义，取决于你正在使用的 SCM 系统。详情请参 SCM 系统的文档。你也可以过滤\
  \ `Project navigator`，使其只显示具有 SCM 状态的项目成员（图 21.13）。关闭过滤器按钮返回显示所有成员。\n\n**图 21.13**\
  \ 按 SCM 状态过滤的 Project navigator\n\n![image](img/xcode-21-13.jpg)\n\n可以使用 Utility\
  \ 区域的 File inspector（文件检查器）更详细地检查单个文件的状态。`Source Control` 部分（图 21.14）显示受控制文件的版本、状态和位置。\n\
  \n**图 21.14** Utility 区域中的源码控制\n\n![image](img/xcode-21-14.jpg)\n\n#### 提交与推送\n\n\
  将更改提交到仓库是非常简单的，有几种方法可以实现。你可以提交所有未处理的更改，或仅提交选中的文件。\n\nXcode 会为下次提交调度新添加到项目的文件。这是目前\
  \ Xcode 对 `Git` 强大的暂存（staging）功能的支持限制，该功能本应让你提交文件中的特定更改。相反，Xcode 的 `commit` 对于 `Git`\
  \ 仓库意味着暂存并提交。\n\n要提交工作区所有项目的所有未处理更改，从主菜单选择 `File > Source Control > Commit`。将出现类似于图\
  \ 21.15 所示的表单。类似于你在第 8 章中学会的查找和替换预览表单，此表单在左侧显示文件列表，右侧显示预览区域。选择列表中的任何文件即可预览仓库与文件工作副本之间的差异。要选择提交的文件，选中文件名左侧的复选框。\n\
  \n**图 21.15** 提交审核表\n\n![image](img/xcode-21-15.jpg)\n\n在表单底部的文本编辑器中输入提交信息，并点击 `Commit`\
  \ 按钮提交更改。假设没有错误，SCM 状态标记将会消失，显示没有待处理的 SCM 状态文件。\n\n\n\n\n如果你只需要提交少数文件，可以在项目导航器（Project\
  \ navigator）中单独选择它们，右键点击选中的一个文件，并从上下文菜单中选择 `Source Control > Commit Selected Files`。将会出现你在图\
  \ 21.15 中看到的相同的提交面板，其工作方式相同。你也可以通过组织器（Organizer）的 `Repositories` 标签页，从源列表中选择一个工作副本或克隆，然后点击底部工具栏上的\
  \ `Commit` 按钮进行提交。\n\n#### 推送更改\n\n当使用从远程源克隆的 `Git` 仓库时，你也可以也可以在 Xcode 内部使用 `Source\
  \ Control` 菜单将本地提交推送到远程源。从主菜单选择 `File > Source Control > Push`。将会出现一个面板（图 21.16），要求你选择要推送的分支。一旦选择了分支，就点击\
  \ `Push`。Xcode 将会推送更改。\n\n**图 21.16** 分支选择面板\n\n![image](img/xcode-21-16.jpg)\n\n\
  #### 拉取（或更新）并合并更改\n\n通过主菜单选择 `File > Source Control > Pull` 将更改拉取到你的克隆中。将会出现一个与分支选择面板类似的面板，要求你选择拉取的远程源。做出选择并点击\
  \ `Choose` 按钮。如果有任何差异，将会出现一个面板（图 21.17），允许你查看每处差异。这允许你挑选想要拉取到克隆中的更改。\n\n**图 21.17**\
  \ 拉取审查面板\n\n![image](img/xcode-21-17.jpg)\n\n图 21.17 显示了两个更改（事实上实际上有三个待处理的更改，但图中只可见两个）。第一个用蓝色轮勒出，仅仅是文本添加。第二个用红色轮勒出，是一个冲突。也就是说，本地克隆和远程版本在同一行上都有更改。点击高亮区域内的任何位置来选择高亮的差异，并使用面板底部的按钮（图\
  \ 21.18）来控制更改。\n\n**图 21.18** 合并控制按钮\n\n![image](img/xcode-21-18.jpg)\n\n这些按钮控制你想保留谁的更改。从左到右的选项是：\n\
  \n**Left then Right**——保留你的更改并将远程更改插入到它们下方。\n\n**Left**——保留你的更改并丢弃远程更改。\n\n**Right**——丢弃你的更改并接受远程更改。\n\
  \n**Right then Left**——保留你的更改并将远程更改插入到它们上方。\n\n你可能可以通过忽略从他人那里拉取的非冲突更改而侥过关，但在解决任何冲突之前，Xcode\
  \ 不允许你继续。解决冲突可以简单到选择一侧，也可以复杂到拉取两处更改并自行修复混乱（然后自己提交并推送该解决方案）。\n\n#### 创建和切换分支\n\n\
  可以在组织器的 `Repositories` 标签页中创建 `Git` 分支。在仓库列表中选择仓库的 `Branches` 文件夹，并点击底部工具栏上的 `Add\
  \ Branch` 按钮。将会出现一个面板（图 21.19），提示你为新分支命名并指定“起点”（用于创建新分支的分支）。\n\n**图 21.19** “创建分支”面板\n\
  \n![image](img/xcode-21-19.jpg)\n\n你还可以选择 `Automatically switch to this branch`\
  \ 复选框，让 Xcode 在创建新分支后立即切换（对于 Subversion 则是 *check out*）分支。Subversion 用户还将被要求输入提交信息。点击\
  \ `Create` 按钮，新分支将被创建并显示在 `Branches` 文件夹中。\n\n切换分支同样在组织器的 `Repositories` 标签页中完成。在仓库列表中选择克隆本身，然后点击底部工具栏中的\
  \ `Switch Branch` 按钮。将会出现一个面板（图 21.20），让你选择想要切换到的的分支。点击 `OK` 切换到选定的分支。\n\n**图 21.20**\
  \ 切换分支面板\n\n![image](img/xcode-21-20.jpg)\n\n![image](img/switch-branch-button.jpg)\n\
  \n#### 比较和浏览历史\n\n通常需要浏览仓库中文件的以前版本或比较版本。Xcode 对此的支持隐藏在显眼处。你已经熟悉主工具栏中编辑器模式按钮栏中的前两个按钮。第一个按钮是纯编辑器模式。第二个按钮显示\
  \ `Assistant` 编辑器。第三个也是最后一个按钮显示 `Version Editor`（图 21.21）。\n\n![image](img/editor-mode-button-bar.jpg)\n\
  \n**图 21.21** 版本编辑器\n\n![image](img/xcode-21-21.jpg)\n\n在两个源编辑器之间的通道的底部，你可以点击时钟图标显示时间轴。在时间轴上移动鼠标会显示以前的版本（图\
  \ 21.22）。\n\n\n\n你可能注意到缺少了一些 SCM（源码控制管理）主题。这是因为，截至本文编写时，Xcode 对 SCM 的支持仍然相当有限。在某些情况下，某个功能可能尚未添加。在其他一些情况下，它可能因为太针对特定的\
  \ SCM 系统而不被添加。无论如何，对于基础之外的任何内容，你仍然可以转向你喜欢的 GUI 前端或命令行。\n\n如果你的 SCM 需求是基础到中等水平，Xcode\
  \ 可以满足你的需求。至少，快照（snapshots）提供了非常基础的版本控制，使你不至于因为一个愚蠢但诚实的错误而丢失数小时（或几天）的工作。如果你还没有开始使用版本控制，现在应该开始吧。Xcode\
  \ 让这一切变得非常简单。\n\n在下一章中……哦等等。没有下一章了。Xcode 还有许多隐藏的宝石，但让我们把深度挖掘探索留给那些更厚、更古板的书吧。\n\n\
