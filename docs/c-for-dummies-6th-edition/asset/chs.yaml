  我觉得非常奇怪，任何书的封面上只出现一个名字，尤其是像这样的一本书。事实上，许多人都在为一本《傻呆指南》（For Dummies）的创作做出了贡献。从一开始，编辑总监\
  \ Mary Corder 和 Katie Feltman 以及我的经纪人 Claudette Moore 就参与了书中内容的指导和塑造。在本书的六个版本的开发过程中，我发现自己深陷于一群项目编辑、文稿编辑和技术审查员提供的修改、纠正和建议中——如果没有他们的参与，这本书的质量将会低得多。而且，如果没有\
  \ Suzanne Thomas 的帮助（她协调了项目的第一、二版），Susan Pink（她负责了第三、第六版）以及 Danny Kavel（他负责本版的技术审查），没有任何内容能够付梓。尽管如此，封面上确实出现了一个名字，而这个名字必须对书中的任何不准确负责。\n\
  \n最后，是对我房子周围动物活动的总结。对于那些没读过我其他任何书的人来说，我应该警告你们，这已经成了我的《傻呆指南》系列书中经常有的。\n\n我的两只狗 Scooter\
  \ 和 Trude 已经走了快五年了。我们大约在三年前搬到了“大城市”，这意味着要送走我们的两只狗 Chester 和 Sadie（它们在其他家庭里过得很好）。我们曾试图留住那两只大丹犬\
  \ Monty 和 Bonnie，但后院对它们来说实在太小了。我们被迫也将它们送了出去。\n\n我刚送走那两只大丹犬，我儿子就带着从收容所领回的两只体型较小的卡霍拉混血犬\
  \ Lolli 和 Bodie 出现了。至少它们学会如厕。我很高兴地报告，它们就在我打字时，它们也状态良好并等待着晚上的散步。\n\n如果你在开始学习时遇到问题，我在\
  \ `www.stephendavis.com` 维护了一个常见问题解答集（FAQ）。如果你在那里没看到你的问题，可以从那里给我发邮件。我没法替你写程序（你不知道我经常被要求帮别人写家庭作业），但我尝试回答大多数问题。\n\
