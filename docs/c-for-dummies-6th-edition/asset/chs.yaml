  *   Debbie Stailey，制作服务总监\n\n## 引言\n\n欢迎阅读《C++ 傻呆指南》第 6 版。请把这本书看作是 `C++`：读者文选版，带你了解开始编程所需的所有知识，而去除了所有无聊的内容。\n\
  \n### 本书内容\n\n《C++ 傻呆指南》是对 `C++` 语言的入门介绍。我从开始讲（还能从哪里开始？），从早期概念一直到更高级的技术。我不假设你具有任何先验知识（至少，不是编程方面的知识）。\n\
  \n书中充斥着示例。每个概念都通过大量的片段和几个完整的程序进行了记录。\n\n与其他 `C++` 编程书籍不同，《C++ 傻呆指南》认为“为什么”和“怎么”同样重要。`C++`\
  \ 的特性就像拼图碎片。与其仅仅介绍这些特性，我认为让你们理解它们是如何组合在一起的非常重要。你也可以将本书作为参考：例如，如果你想了解所有模板内容是怎么回事，只需翻到第\
  \ 25 章即可。每一章都包含了对之前章节的必要引用，以防你没有按顺序阅读章节。\n\n《C++ 傻呆指南》并非针对特定操作系统的。对于 `Unix` 或 `Linux`\
  \ 程序员来说，它与基于 `Windows` 的开发者同样有用。本书不涵盖 `Windows` 或 `.NET` 编程。\n\n你必须掌握一种强大的编程语言，如\
  \ `C++`，即使你的计划是成为一名优秀的 Windows 应用程序或 `.NET` 程序员。一旦你读完《C++ 傻呆指南》，你就可以在你的专业领域继续学习，无论那个领域是什么。\n\
  \n### 光盘内容\n\n《C++ 傻呆指南》附带的光盘包含了了书中示例的源代码。这可以节省大量的打字时间。\n\n你的电脑无法直接执行这些或其他其他 `C++`\
  \ 程序。你必须通过 `C++` 开发环境运行你的 `C++` 程序，该环境会生成一个可执行程序。（别担心，这个过程在第 1 章中解释。）\n\n由于在编写本文时，并不是每个\
  \ C++ 编译器都实现了国际标准组织（ISO）的最新 C++ 标准，光盘中包含了一个名为 `Code::Blocks` 的全功能 C++ 环境，它使用了 GNU\
  \ `gcc` 编译器。磁盘上的 `gcc` 版本（结合 `CodeBlocks`）适用于 Windows 2000、XP 和 Vista 的任何版本。适用于\
  \ Ubuntu 和 Debian Linux 以及 Macintosh OS X（10.4 及更高版本）的 `gcc` 版本可以在 `http://www.gnu.org`\
  \ 下载。确保你下载第 4.4 或更高版本的 `gcc`，以最大化与书中程序的兼容性。\n\n## 什么是 C++？\n\n`C++` 是一种面向对象的低级标准编程语言。作为一种与其前身\
  \ C 相似且兼容的低级语言，`C++` 可以生成非常高效、快速的程序。它经常用于编写游戏、图形软件、硬件控制软件和其他对性能要求很高的应用程序。\n\n作为一种面向对象的语言，`C++`\
  \ 具有编写大型程序的力量和扩展性。`C++` 是所有类型程序中最流行的编程语言之一。你每天在 PC 上使用的大多数程序都是用 `C++`（或其子集 C 语言）编写的。\n\
  \n`C++` 已被认证为 99.9% 的纯标准，这使其成为一种可移植的语言。每个主要的操作系统都存在标准的 `C++` 编译器。某些版本支持基础语言的扩展——特别是微软的\
  \ `Visual C++ Express` 和 `Visual C++ .NET` 实现了一些扩展，允许其程序与其他 .NET 语言进行更好的交互。尽管如此，任何学生先学习标准的\
  \ `C++` 更好。\n\n## 本书使用的约定\n\n当我描述屏幕上显示的消息时，它显示如下：\n\nHi mom!\n\n此外，代码列表显示如下：\n\n\
  ```cpp\n// some program\nint main()\n{\n...\n}\n```\n\n\n\n如果你是手动输入这些程序，你必须按照所示的内容完全输入文本，唯一的例外是：空白字符（空格、制表符和换行符）的数量并不关键。你不能在关键词的中间插入空格，但你不需要担心多输入或少输入一个几个空格。\n\
  \nC++ 单词通常基于含义相似的英文单词。这可能导致在没有一点帮助的情况下，读懂一个同时包含英文和 C++ 的句子变得困难。为了提供帮助，C++ 命令和函数名会以不同的字体显示，像这**这样**。此外，函数名后面总是紧跟着左括号和右括号，例如\
  \ `myFavoriteFunction()`。除非有特定的需要让参数更易于读，否则函数的参数会被省略。\n\n有时，我会要求你使用菜单命令，例如 `File⇒Open`。这种符号表示使用键盘或鼠标打开\
  \ `File`（文件）菜单，然后选择 `Open`（打开）选项。\n\n在编写教程书时，性别的使用始终是一个棘手的话题。我不希望看起来像是在告诉绅士们他们有多无知，同时又通过一直使用\
  \ `he` 和 `him` 来放过女士们。在本书书中，当我指代程序员时，我使用代词 `she` 和 `her`，当我指代程序的用户时，我使用 `he` 和 `him`。所以，她写了一个他可以使用的程序。\n\
  \n## 本书的组织结构\n\n每个新功能都通过回答以下三个问题来介绍：\n\n1. 这个新功能是什么？\n2. 为什么要将其引入语言中？\n3. 它是如何工作的？\n\
  \n小段代码被大量地散落在各个章节中。每段代码都演示了某个引入的新功能，或者突出了我所说的某个精彩观点。这些片段可能是不完整的，而且显然没有执行任何实际意义。然而，每个概念都至少在一个功能性程序中得到了演示，你可以在自己的计算机上执行并尝试它。\n\
  \n## 还有更多\n\n一个真实世界的程序可能会占用很多页面。然而，看到这样的程序对于任何读者来说，都是一个重要的教学工具。\n\n我使用了一个简单的示例程序，我称之为\
  \ `BUDGET`。该程序最初是一个简单的、面向功能导的 `BUDGET1`。这个程序维护了一组简单的检查账户和储蓄账户。鼓励读者在第二部分的末尾回顾这个程序。随后的版本\
  \ `BUDGET2` 增加了第三部分介绍的面向对象概念。示例通过使用越来越多的语言功能进行，最终在 `BUDGET5` 达到顶峰，你应该在掌握了书中所有章节后回顾它。`BUDGET`\
  \ 程序可以在书籍的 CD-ROM 上找到。你可以下载这些程序。\n\n\n\n一个 C++ 程序是一个包含一系列根据 C++ 语法规则组合的 C++ 命令的文本文件。这个文本文件被称为源代码（可能是因为它是所有挫败的源头）。C++\
  \ 源代码通常带有 `.CPP` 扩展名，就像 Microsoft Word 文件以 `.DOC` 结尾，或者 MS-DOS（还记得吗？）批处理文件以 `.BAT`\
  \ 结尾一样。\n\n在 C++ 中进行编程的目的是编写一系列命令，这些命令可以转换为机器语言程序，并实际执行我们想要的任务。这被称为 `compiling`（编译），是\
  \ `compiler`（编译器）的工作。你编写的机器码必须与一些设置和拆卸指令以及标准库例程结合，这个过程被称为 `linking`（链接）或 `building`（构建）。生成的机器可执行文件在\
  \ Windows 中带有 `.EXE` 扩展名。\n\n这听起来挺简单的——但这有什么大不了的？继续继续。\n\n编写一个程序，你需要两个专门的计算机程序。其中一个（编辑器）是你在构建\
  \ `.CPP` 源代码时编写代码的工具。另一个（编译器）将你的源代码转换为机器可执行的 `.EXE` 文件，执行你现实世界中的命令（打开电子表格、发出粗鲁的声音、偏转飞入的小行星，等等）。\n\
  \n如今，工具开发者通常将编译器和编辑器合并成一个软件包——开发环境。当你完成构成你程序的命令输入后，只需点击一个按钮即可创建可执行文件。\n\n幸运的是，有公共领域的\
  \ C++ 环境。我们在书中使用了了其中一个——`Code::Blocks` 环境。这个编辑器可以配合许多不同的编译器，但结合 `GNU gcc` 编译器用于\
  \ 32 位 Windows 版本的 `Code::Blocks` 版本包含书中附带的光盘中。你可以从 [www.codeblocks.org](http://www.codeblocks.org)\
  \ 下载最新版本的 `Code::Blocks`，也可以从作者的网站 [www.stephendavis.com](http://www.stephendavis.com)\
  \ 下载一个经过与书中程序兼容性测试的近期版本。\n\n你可以从 [www.gnu.org](http://www.gnu.org) 下载适用于 Mac 或 Linux\
  \ 的 `gcc` 编译器版本。\n\n尽管 `Code::Blocks` 是公共领域的，但我们鼓励你支付少量费用以支持它的进一步开发。你不需要付费即可使用 `Code::Blocks`，但如果你愿意，可以为这项事业做出贡献。详情见网站。\n\
  \n我已使用 `Code::Blocks` 结合版本 `4.4` 的` 测试了书中的程序；这些程序在后续版本中也应该可以运行。你可以查看我的网站，获取未来 `Code::Blocks`、`gcc`\
  \ 或 `Windows` 版本中可能出现的问题列表。\n\n![TechnicalStuff.eps](img/TechnicalStuff_fmt.jpeg)\
  \ `Code::Blocks` 是一个功能完整的编辑器和开发环境前端。`Code::Blocks` 支持多种不同的编译器，包括附带光盘中的 `gcc` 编译器。\n\
  \n![Warning(bomb).eps](img/Warning(bomb)_fmt.jpeg) `Code::Blocks/gcc` 软件包可以生成 Windows\
  \ 的 32 位程序，但它并不支持创建具有经典 Windows 外观的程序。我强烈建议你先通过书中的示例学习 C++，然后再应对 Windows 开发。C++\
  \ 和 Windows 编程是两个不同的事情，（为了你的心理健康）它们在你的脑海中应该保持独立。\n\n按照下一节的步骤安装 `Code::Blocks` 并构建你的第一个\
  \ C++ 程序。这个程序的任务是将用户输入的温度值从摄氏度转换为华氏度。\n\n## 安装 Code::Blocks\n\n随书附带的光盘包含了本书编写时最新版本的\
  \ `Code::Blocks` 环境。\n\n`Code::Blocks` 环境以易于安装的压缩可执行文件形式提供。该可执行文件包含在附带光盘的 `CodeBlocks`\
  \ 目录中。以下是安装环境的概述：\n\n1. 将光盘插入光驱驱动器。\n2. 当出现带有许可协议的光盘界面时，点击 `Accept`（接受）。\n3. 点击左侧的\
  \ `Installing Code::Blocks` 按钮。\n4. 点击 `Open Directory`打开目录）。\n5. 双击 `codeblocks_setup.exe`\
  \ 文件。\n\n你也可以选择 `Start⇒Run` 并在窗口中输入 `x:\\codeblocks\\setup`，其中 `x` 是你的光驱驱动器盘号（通常为\
  \ `D`）。\n6. 根据你正在使用的 Windows 版本，可能会收到无处不在的“一个未识别的程序想要访问你的计算机”警告弹出。如果是这样，点击 `Allow`（允许）开始安装。\n\
  7. 在关闭所有无关应用程序后，如 `CodeBlocks Setup Wizard` 欢迎对话框中所提示的那样，点击 `Next`（下一步）。\n8. 阅读最终用户许可协议（通常称为\
  \ `EULA`），如果你能接受其条款，请点击 `I Agree`（我同意）。\n\n这看起来不像你有多少选择——要是你不点，软件包真的不会自动安装的。\n\n\
  ## 创建你的第一个 C++ 程序\n\n在这一节中，你将创建第一个 C++ 程序。你将 C++ 代码输入到名为 `CONVERT.CPP` 的文件中，然后将\
  \ C++ 代码转换为可执行程序。\n\n## 创建项目\n\n创建 C++ 程序的的第一步是创建一个所谓的“项目”。项目告诉 `Code::Blocks` 要包含哪些\
  \ `.CPP` 源代码文件的名称以及要创建什么种类型的程序。书中的大多数程序将由单个源文件组成，并且是命令行风格：\n\n\n\n\n1. 选择 `Start⇒Programs⇒CodeBlocks⇒CodeBlocks`\
  \ 来启动 `CodeBlocks` 工具。\n2. 在 `Code::Blocks` 内部，选择 `File⇒New⇒Project`。\n3. 选择 `Console\
  \ Application` 图标并点击 `Go`。\n4. 在下一个窗口中选择 `C++` 作为你想要使用的语言。点击 `Next`。\n`Code::Blocks`\
  \ 和 `gcc` 也支持传统的 C 语言。\n5. 选择 `Console Application` 图标并点击 `Go`。\n6. 在 `Folder to\
  \ Build Project In` 字段中，导航到你想构建程序的子目录。\n我将书中的程序按章节划分，因此我使用 Windows 资源管理器创建了 `C:\\\
  CPP_Programs\\Chap01` 文件夹，然后在文件菜单选择了它。\n7. 在 `Project Title` 字段中输入项目名称，在此例中为 `Conversion`。\n\
  结果屏幕如图 1-3 所示。\n\n**图 1-3:** 我为第一个程序创建了 `Conversion` 项目。\n\n![317266-fg0103.eps](img/317266-fg0103_fmt.jpeg)\n\
  \n8. 点击 `Next`。\n下一个窗口提供创建用于测试的应用程序或最终版本的选项。使用默认值即可。\n9. 点击 `Finish` 创建 `Conversion`\
  \ 项目。\n\n### 输入 C++ 代码\n\n`Code::Blocks` 创建的 `Conversion` 项目包含一个单一的默认 `main.cpp`\
  \ 文件，该文件没有任何实际功能。下一步是输入我们的程序：\n\n1. 在左侧的 `Management` 窗口中，双击 `main`，它位于 `Sources`\
  \ 下，`Conversion` 下。\n`Code::Blocks` 会在代码编辑器中打开它创建的空 `main.cpp` 程序，如图 1-4 所示。（图 1-4\
  \ 也显示了全书所有的项目）。\n\n**图 1-4:** `Management` 窗口显示了所有可用程序的目录结构。\n\n![317266-fg0104.eps](img/317266-fg0104_fmt.jpeg)\n\
  \n2. 按照以下程序精确编辑 `main.cpp`。\n不要太担心缩进或空格——某行是缩进两个空格还是三个空格，或者两个单词之间是一个空格还是两个空格，这并不关键。然而，`C++`\
  \ 是区分大小写的，所以你需要确保所有内容都是小写。\n\n![Tip.eps](img/Tip_fmt.jpeg) 你可以利用随附 CD-ROM 中的文件来“作弊”，正如下一节“作弊”中所描述的。\n\
  \n```cpp\n//\n\n// Conversion - 将温度从\n// 摄氏度转换为华度的程序：\n// Fahrenheit = Celsius *\
  \ (212 - 32)/100 + 32\n\n//\n#include <cstdio>\n#include <cstdlib>\n#include <iostream>\n\
  \nusing namespace std;\n\nint main(int nNumberofArgs, char* pszArgs[])\n{\n// 输入摄氏度温度\n\
  int celsius;\ncout << “Enter the temperature in Celsius:”;\ncin >> celsius;\n//\
  \ 计算摄氏度到\n// 华度的转换因子\nint factor;\nfactor = 212 - 32;\n// 使用转换因子将摄氏度\n// 转换为华氏度值\n\
  int fahrenheit;\nfahrenheit = factor * celsius/100 + 32;\n// 输出结果（后跟换行）\ncout <<\
  \ “Fahrenheit value is:”;\ncout << fahrenheit << endl;\n// 在终止程序前等待用户准备好\n// 以便让用户看到程序结果\n\
  system(“PAUSE”);\nreturn 0;\n}\n```\n\n3. 选择 `File⇒Save` 保存源文件。\n我知道这看起来可能并不兴奋，但你刚刚创建了你的第一个\
  \ `C++` 程序！\n\n### 作弊\n\n书中的所有程序都包含在随附的 CD-ROM 中，以及构建这些程序的项目文件。你可以通过两种方式使用这些文件：一种是先手动通过所有步骤创建程序，但如果你遇到困难（或手指开始抽筋），可以从\
  \ CD-ROM 上的源代码中复制并粘贴到你的程序中。这是首选的技术。\n或者，你可以使用以下步骤一次性将所有程序复制到硬盘上：\n\n1. 将 CD-ROM\
  \ 中的所有源码拷贝到硬盘。\n这会拷贝书中的所有源代码以及构建这些程序的项目文件。\n2. 双击 `C:\\CPP_Programs` 中的 `AllPrograms.workspace`。\n\
  `workspace` 是一个引用一个或多个项目的单一文件。`AllPrograms.workspace` 文件包含了书中定义的所有项目的引用。\n3. 在左侧\
  \ `Management` 窗口中右键点击 `Conversion` 项目。从弹出的上下文菜单选择 `Activate Project`。\n`Code::Blocks`\
  \ 将 `Conversion` 标签加粗，以验证这就是你正在运行的程序。\n\n### 构建你的程序\n\n将 `C++` 源文件保存到磁盘后，是时候生成可执行机器指令了。\n\
  要构建你的 `Conversion` 程序，你可以从菜单中选择 `Build⇒Build` 或按 `Ctrl-F9`。`Code::Blocks` 几乎立即启动，充满热情地编译你的程序。如果一切顺利，右下角的窗口将显示快乐的结果\
  \ `0` 错误，`0` 警告。\n如果在你的 `C++` 程序中发现任何类型的错误，`Code::Blocks` 会生成一条消息——代码错误就像阿拉斯加的冰块一样常见。你无疑会遇到许多警告和错误消息，即使在输入简单的\
  \ `Conversion.cpp` 时也是如此。为了演示错误报告过程，让我们将第 16 行从 `cin >> celsius;` 改为 `cin >>> celsius;`。\n\
  \n这似乎是一个无心的过错——对你可以原谅，但对 `C++` 则不然。选择 `Build⇒Build` 开始编译。`Code::Blocks` 会立即错误行旁边放置一个红色方块，如图\
  \ 1-5 所示。Build 标签中的消息是一个晦涩的错误：expected-expression before `>`。要消除消息，删除多余的 `>` 并重新编译。\n\
  \n**图 1-5:** `Code::Blocks` 标记错误源。\n\n![317266-fg0105.eps](img/317266-fg0105_fmt.jpeg)\n\
  \n![Tip.eps](img/Tip_fmt.jpeg) 你可能认为 `Code::Blocks` 生成的错误消息很奇怪，但你现在才编程 30 分钟。随着时间的推移，你会更好地理解\
  \ `Code::Blocks` 生成的错误。有时它直到下一行或之后之后才会注意到错误，所以如果被标记的行看起来没问题，请查看它的前一个程序。\n\n### 执行你的程序\n\
  \n现在是执行你的新作品的时间了……即运行你的程序。你将运行 `CONVERT.EXE` 文件并给予输入查看其如何工作。\n要执行 `Conversion` 程序，选择\
  \ `Build⇒Build and Run` 或按 `F9`。如果有任何更改，它将重新构建程序，如果构建成功则执行程序。\n窗口立即打开，请求摄氏度。输入一个已知温度，例如\
  \ 100 度。在你按下回车后，程序返回相应的华氏度如下：\n\nEnter the temperature in Celsius:100\nFahrenheit\
  \ value is:212\nPress any key to continue . .\n\nPress any key to continue... 消息让你在消失之前有机会阅读。按下回车，窗口（及其内容）消失。恭喜！你刚刚输入、构建并执行了你的第一个\
  \ `C++` 程序。\n\n注意，`Code::Blocks` 并非真正旨在开发 Windows 程序。理论上，你可以使用 `Code::Blocks` 编写\
  \ Windows 应用程序，但这并不简单。（在 Visual Studio.NET 中构建窗口应用程序容易得多。）\n\nWindows 程序向用户显示视觉化的输出，所有在屏幕窗口中整齐排列。`Conversion.exe`\
  \ 是一个在 Windows 下运行的 32 位程序，但从视觉意义上说，它不是一个 Windows 程序。\n如果你不知道 32 位程序意味着什么，不要担心。正如我所说，这本书不是关于编写\
  \ Windows 程序的。我们在书中编写的 C++ 程序具有在 MS-DOS 框内执行的命令行界面。\n\n\n\n\n\n初学 Windows 程序员不应该感到绝望——你并没有浪费钱。学习\
  \ C++ 是编写 Windows 程序的前提条件。我认为它们应该分别掌握：先学 C++，后学 Windows。\n\n## 复习带注释的程序\n\n在别人的程序中输入数据，就像看别人开车一样无趣。你真的需要自己坐到驾驶位上。程序也有点像汽车。所有的汽车基本上都是相同的，只是有微小的差异和改进——好吧，法国汽车与其他汽车差别很大，但观点仍然有效。汽车遵循相同的基本模式——方向盘在你面前，座椅在你身下，车顶在你上方，诸此类推。\n\
  \n同样，所有的 C++ 程序都遵循一个共同模式。这种模式已经出现在这第一个程序中了。我们可以通过寻找所有程序共有的元素来复习 `Conversion` 程序。\n\
  \n### 检查所有 C++ 程序的框架\n\n你为本书编写的每个 C++ 程序都使用相同的基本框架，看起来大致如下：\n\n```cpp\n//\n// Template\
  \ - 提供一个模板作为\n// 起始点\n//\n// 以下的包含文件定义了\n// 任何程序需要的大部分函数\n#include <cstdio>\n#include\
  \ <cstdlib>\n#include <iostream>\n\nusing namespace std;\n\nint main(int nNumberofArgs,\
  \ char* pszArgs[])\n{\n    // 你的 C++ 代码在这里开始\n    // 在终止程序之前等待用户准备好\n    // 以允许用户看到程序结果\n\
  \    system(\"PAUSE\");\n    return 0;\n}\n```\n\n在不涉及所有无聊细节的情况下，执行从紧跟在 `main()`\
  \ 行之后的左、右括号内的代码开始。\n\n我将这段代码复制到了名为 `Template.cpp` 的文件中，位于随附 CD-ROM 的主 `CPP_Programs`\
  \ 文件夹中。\n\n### 通过注释澄清源代码\n\n`Conversion` 程序的前几行看起来是自由格式的文本。要么这段代码是写给人类看的，要么 C++\
  \ 比我所认为的要聪明得多。这前六行被称为注释。注释是程序员对她在编写特定代码段时正在做什么或在想什么的解释。编译器会忽略注释。程序员（至少是优秀的程序员）则不会。\n\
  \nC++ 注释以双斜杠（`//`）开头并以换行符结束。你可以在注释中放置任何想要的字符。注释可以像你希望那么长，但习惯上是将注释行保持在不超过 80 个字符。在过去——这里的“过去”是相对的——屏幕宽度限制为\
  \ 80 个字符。某些打印机在打印文本时仍默认为 80 个字符宽。现如今，将单行保持在 80 个字符以内是一个很好的实用主意（更容易阅读；不容易引起眼睛疲劳；这是常态的）。\n\
  \n在打字机时代，换行被称为“回车”（carriage return）——当时向机器输入字符的行为被称为打字，而不是键盘输入。换行符是终止命令行的字符。\n\n\
  ![Warning(bomb).eps](img/Warning(bomb)_fmt.jpeg) C++ 允许第二形式的注释，`/*` 之后和 `*/` 之前的所有内容都会被忽略；然而，这种形式的注释在\
  \ C++ 中通常不再使用。（在书的后面部分，我将描述应用这种注释的这种情况。）\n\n在 C++（或任何其他编程语言）中，有一个专门被计算机忽略的命令可能看起来很奇怪。然而，所有的计算机语言都有某种版本的注释。让程序员解释她在编写代码时脑子里在想什么是非常关重要的。程序员的想法对于下一个尝试使用或修改她程序的同事来说可能显而易见。事实上，如果程序员自己在编写原始代码几个月后查看且没有留下任何线索，她自己可能会忘记她的程序的含义。\n\
  \n### 基于 C++ 语句编写程序\n\n所有的 C++ 程序都基于所谓的 C++ 语句。本节复习了构成 `Conversion` 程序所用程序框架的语句。\n\
  \n语句是一组单一命令。除了注释外，几乎所有的 C++ 语句都以分号（`;`）结束。你在第 10 章中会看到另一个异常。程序执行从左括号后的第一个 C++ 语句开始，并逐条语句地通过程序列表继续下去。\n\
  \n当你查看程序时，你可以看到空格、制表符和换行符贯穿程序。事实上，我在这个程序中的每个语句之后都放置了换行符。这些字符统称为空白字符（whitespace），因为你无法显示器上看到它们。\n\
  \n![Tip.eps](img/Tip_fmt.jpeg) 你可以在程序的任何喜欢的地方添加空白字符来增强可读性——但在单词中间除外：\n\n看我\n是什么意思吗？\n\
  \n虽然 C++ 可能会忽略空白字符，但它不会忽略大小写。事实上，C++ 对大小写敏感到了痴迷的地步。变量 `fullspeed` 和变量 `FullSpeed`\
  \ 之间没有任何关系。命令 `int` 完全可以，但 C++ 并不知道。\n\n### 声明\n\n`int celsius;` 行是一个声明。在 C++ 中，变量有类型和名称。第\
  \ 11 行定义的变量称为 `celsius`，并声明存储一个整数。（为什么他们不能直接说 integer 而不是 `int`，我永远不知道。这只是你必须学会接受的事之一。）\n\
  \n变量的名称对 C++ 没有任何特殊意义。变量必须以字母 `A-Z`、`a-z` 或下划线（`_`）开头。所有后续字符必须是字母、数字 `0-9` 或下划线。变量名可以随你想多长。\n\
  \n![Tip.eps](img/Tip_fmt.jpeg) 变量名以小写字母开头是一种约定。变量中的每个新单词都以大写字母开头，如 `myVariable`。\n\
  \n### 生成输出\n\n以 `cout` 和 `cin` 开头的行被称为输入/输出语句，通常缩写为 I/O 语句。（像所有工程师一样，程序员喜欢缩写和复合词。）\n\
  \n第一条 I/O 语句说“向 `cout` 输出短语 Enter the temperature in Celsius”（“see-out”）。`cout`\
  \ 是标准 C++ 输出设备的名称。在这种情况下，标准 C++ 输出设备是你的显示器。\n\n下一行完全相反。它实际上说：“从 C++ 输入设备提取一个值并将其存储在整数变量\
  \ `celsius` 中。”C++ 输入设备通常是键盘。在这里得到的刚才提到的代数公式 `x = 10` 的 C++ 类比。在程序的剩余部分，`celsius`\
  \ 的值取决于用户输入的内容。\n\n### 计算表达式\n\n除了最基本的程序外，所有程序都会执行各种计算。在 C++ 中，表达式是一个执行计算的语句。换句话说，表达式是有值的语句。运算符是生成值的命令。\n\
  \n\n\n\n例如，在转换（Conversion）示例程序中——特别是在标记为计算表达式的两个行中——程序声明了一个变量 `factor`，然后给它赋值计算得出的结果。这条特定命令计算了\
  \ 212 减 32 的差值；运算符是减号（–），表达式为 `212–32`。\n\n### 存储表达式的结果\n\n口语语言可能非常歧义。`equals`（等于）这个词就是这些歧义词之一。`equals`\
  \ 可以意味着两个事物具有相同的值，如“一美元等于一百美分”。`Equals` 也可以暗示赋值，正如数学中当你说“y 等于 x 的 3 倍”那样。\n\n为了避免歧义，C++\
  \ 程序员将 `=` 称为**赋值运算符**，它的作用（效果上）是：“将等号右侧表达式的结果存储在左侧的变量中”。程序员说“`factor` 被赋值为 212\
  \ 减 32 的值”。简而言之，你可以说“`factor` 得到了 212 减 32”。\n\n![Warning(bomb).eps](img/Warning(bomb)_fmt.jpeg)\
  \ 永远不要说“`factor` 等于 212 减 32”。你会听到一些懒人这么说，但你我都很清楚。\n\n### 检查转换程序的剩余部分\n\n转换程序中的第二个表达式比第一个稍微复杂一点。这个表达式使用了相同的数学符号：`*`\
  \ 表示乘法，`/` 表示除法，`+` 表示加法。然而，在这种情况下，计算是针对变量进行的而不仅仅是常量。\n\n名为 `factor` 的变量中的值（顺便说一下，它是通过\
  \ `212 – 32` 的结果计算出来的）乘以变量 `celsius` 中的中的值（这是从键盘输入的）。结果除以 100 并加上 32。整个表达式的结果赋值给整数变量\
  \ `fahrenheit`。\n\n最后两条命令将字符串 `Fahrenheit value is:` 输出到显示器上，随后是 `fahrenheit` 的值——这一切发生得如此快，用户几乎察觉不到正在发生。\n\
  \n# 第 2 章\n\n## 不断声明变量\n\n### 本章内容\n- 声明变量\n- 声明不同类型的变量\n- 使用浮点变量\n- 声明和使用其他类型的变量\n\
  \nC++ 中所有概念中最基础的概念是变量——变量就像一个小盒子。你可以把东西存在盒子里以备后用，特别是数字。变量的概念是从数学中借用的。像这样的语句：\n\n\
  ```\nx = 1\n```\n\n在变量 `x` 中存储值 1。从该点开始，数学家就可以用变量 `x` 代替常量 1——直到他将 `x` 的值改为其他。\n\
  \n变量在 C++ 中的工作原理相同。你可以进行赋值：\n\n```cpp\nx = 1;\n```\n\n从程序执行的该点开始，直到 `x` 的值改变，`x`\
  \ 的值都是 1。对 `x` 的引用会被替换为值 1。在本章中，你将学会如何在 C++ 程序中声明和初始化变量。你还将看到 C++ 定义的不同类型的变量以及何时使用每种类型。\n\
  \n### 声明变量\n\n数学家可能会写类似这样的内容：\n\n```\n(x + 2) = y / 2\nx + 4 = y\nsolve for x and\
  \ y\n```\n\n任何学过代数的读者立刻就能意识到数学家引入了变量 `x` 和 `y`。但 C++ 没有那么聪明。（计算机可能很快，但它们很笨。）\n\n\
  你必须在使用每个变量之前向 C++ 宣布它。你必须说像这样安抚的话：\n\n```cpp\nint x;\nx = 10;\nint y;\ny = 5;\n\
  ```\n\n这些行代码声明了变量 `x` 存在，类型为 `int`，且值为 10；并且一个类型为 `int` 的变量 `y` 也存在且值为 5。（下一节将讨论变量类型。）你可以在程序中（几乎）任何地方声明变量——只要你在使用它之前声明它即可。\n\
  \n### 声明不同类型的变量\n\n如果你和数学很好（谁不是呢？），你可能把数学中的变量认为是一个无形状的盒子，能够容纳你任何选择存储的内容。你可以很容易写出类似这样的代码：\n\
  \n```cpp\nx = 1\nx = 2.3\nx = \"this is a sentence\"\n```\n\n可惜，C++ 并不那么灵活。（另一方面，C++\
  \ 可以做到人类做不到的事情，例如每秒加十亿个数字，所以我们不要太自大。）对于 C++ 来说，存在不同类型的变量，就像存在不同类型的存储箱一样。有些存储箱非常小，只能处理单个数字。需要较大的箱子来处理句子。\n\
  \n![Tip.eps](img/Tip_fmt.jpeg) 一些计算机语言试图更好地适应程序员，允许她在同一个变量中放置不同类型的数据。这些语言被称为弱类型语言。C++\
  \ 是一种**强类型语言**——它要求程序员特意地声明每个变量及其精确类型。\n\n变量类型 `int` 是 C++ 中整数的等价物——一个没有小数部分的数字。（整数也被称为计数数或整数。）\n\
  \n整数对于大多数计算非常有用。我用整数度过了小学的大部分时光。直到我 11 岁左右，我的老师们才开始用分数来搞乱。C++ 中的情况也是如此：C++ 中超过 90%\
  \ 的变量都被声明为 `int` 类型。\n\n遗憾的是，`int` 变量并不适用于每个问题。例如，如果你运行了第 1 章中的温度转换程序，你可能会注意到程序存在一个潜在问题——它只能计算到最近的度。不允许任何度的分数。这种整数局限性不会影响日常使用，因为不太可能有人（气象学家除外）会因为差了几分之一度就感到兴奋。然而，在很多情况下并非如此——例如，你不希望在下一次飞机旅行中，因为导航的舍入导致在跑道上短了半英里。\n\
  \n### 复习 C++ 中整数的局限性\n\n`int` 变量类型是 C++ 版本的整数。`int` 变量所遭受的局限性与其数学中的计数数整数等价物相同。\n\
  \n#### 整数舍入\n\n去掉数字的小数部分被称为**截断**。考虑计算三个数的平均值的问题。给定三个 `int` 变量——`nValue1`、`nValue2`\
  \ 和 `nValue3`——计算平均值的方程为\n\n```cpp\nint nAverage; int nValue1; int nValue2; int\
  \ nValue3;\nnAverage = (nValue1 + nValue2 + nValue3) / 3;\n```\n\n由于三个值都是整数，和被假设为整数。给定\
  \ 1、2 和 2，和为 5。除以 3，你得到 1//3，或 1.666。C++ 使用略有不同的规则：由于所有变量 `nValue1`、`nValue2` 和\
  \ `nValue3` 都是整数，和也被假设为整数。一个整数除以另一个整数的结果也是整数。因此，`nAverage` 的结果值是不合理但逻辑上的值 1。\n\n\
  在以下数学等价的公式中，问题要严重得多：\n\n```cpp\nint nAverage; int nValue1; int nValue2; int nValue3;\n\
  nAverage = nValue1/3 + nValue2/3 + nValue3/3;\n```\n\n代入相同的 1、2 和 2 值，`nAverage`\
  \ 的结果值是 0（真是逻辑上但不合理）。为了看到这种情况如何发生，考虑 1/3 截断为 0，2/3 截断为 0，2/3 截断为 0。0、0 和 0 的和是 0。你可以看到整数截断可能是完全不可接受的。\n\
  \n#### 有限的范围\n\n`int` 变量类型的第二个问题是其范围有限。普通的 `int` 变量可以存储的最大值为 2,147,483,647，最小值为\
  \ –2,147,483,648——大约从正 2 亿到负 2 亿，总范围约为 40 亿。\n\n\n\n\n![Tip.eps](img/Tip_fmt.jpeg)\
  \ 二十亿是一个巨大的数字：对于大多数用途来说已经足够大。但对于某些应用，包括计算机技术，它还不够。事实上，取决于你的电脑有多旧，你的计算机运行速度可能快于 2\
  \ 吉赫兹（Giga 是表示十亿的前缀）。单根通信光纤——那种横跨整个国家两端的光纤——每秒处理的比特数远超 20 亿位。\n\n## 解决截断问题\n\n在某些应用中，`int`\
  \ 变量的局限性可能是不可接受的。幸运的是，C++ 理解带有小数部分的小数（数学家也称其为实数）。小数避免了 `int` 类型整数的许多局限性。对于 C++ 而言，所有的小数都带有小数部分，即使该小数部分为\
  \ `0\\.`。在 C++ 中，数字 `1.0` 和 `1.5` 一样，都是小数。`1.0` 的等价整数只需简单地写为 `1`。小数也可以是负数，例如 –2.3。\n\
  \n当你在 C++ 中声明小数类型的变量时，你将其标识为浮点变量或简单的 `float` 变量。“浮点”一词意味着小数点可以来移动，以确定尽可能的小位数来表示该值。浮点变量的声明方式与\
  \ `int` 变量相同：\n\n```\nfloat fValue1;\n```\n\n一旦声明，你就无法更改变量的类型。`fValue1` 现在是一个 `float`，在程序的剩余时间内它将一直是\
  \ `float`。为了查看浮点数如何解决整数固有的截断问题，将所有的 `int` 变量转换为 `float`。得到的结果如下：\n\n```cpp\nfloat\
  \ fValue;\nfValue = 1.0/3.0 + 2.0/3.0 + 2.0/3.0;\n```\n\n相当于\n\n```cpp\nfValue =\
  \ 0.333... + 0.666... + 0.666...;\n```\n\n结果为数值：\n\n```cpp\nfValue = 1.666...;\n\
  ```\n\n![Warning(bomb).eps](img/Warning(bomb)_fmt.jpeg) 我写数值 `1.6666 . . .` 就像末尾的\
  \ 6 无限持续一样。事实并非如此。`float` 变量的精度位数是有限制的，但比我能记录的要得多。\n\n![Warning(bomb).eps](img/Warning(bomb)_fmt.jpeg)\
  \ 带有小数点的常量被认为是浮点值。然而，浮点常量的默认类型是所谓的 `double` 精度，在 C++ 中简单地称为 `double`，我们将在下一节中看到。\n\
  \n随附的 CD 中 `CPP_Programs\\Chap02` 目录下提供了 `IntAverage` 和 `FloatAverage` 程序，用于演示整数变量中固有的舍入误差。\n\
  \n## 观察浮点数的限性\n\n尽管浮点变量可以解决许多如截断之类的计算问题，但它们本身也有局限性——与整数变量相关的局限性相反。浮点变量不能用于计数，计算机处理起来更困难，而且也会舍入误差的影响（尽管程度远不如\
  \ `int` 变量）。\n\n### 计数\n\n在计数重要的应用中，你不能使用浮点变量。这包括进行计数的 C++ 结构。C++ 无法验证给定的浮点数指的是哪个整数值。\n\
  \n例如，你我都很清楚 `1.0` 是 `1`，但对 C++ 来说并不那么清楚。`0.9` 或 `1.1` 呢？这些也应该被视为 `1` 吗？C++ 通过坚持在涉及计数时强制使用\
  \ `int` 值来简单地避免这个问题。\n\n### 计算速度\n\n从历史上讲，计算机处理器处理整数算术的速度比处理浮点算术快。因此，虽然处理器在给定时间内可以相加\
  \ 100 万个整数，但同一处理器在相同时期内可能只能执行 20 万次浮点计算。\n\n随着微处理器速度的提高，计算速度正变得不再是问题。此外，如今的通用微处理器板上集成了特殊的浮点电路，以提高这些操作的性能。然而，对整数值进行算术运算比对浮点值执行相同操作要容易且快速得多。\n\
  \n### 精度丢失\n\n浮点 `float` 变量的精度约为 6 位数字，而一种名为 `double` 的额外节省、双倍强的 `float` 版本可以处理大约\
  \ 13 位有效数字。这也会导致舍入问题。\n\n考虑 `1/3` 在连续序列中被表示为 `0.333 . . .`。无限级数的概念在数学上有意义，但对计算机没有意义，因为它具有有限的精度。`FloatAverage`\
  \ 程序输出 `1.66667` 作为 1、2 和 2 的平均值——这比 `IntAverage` 版本输出的 `0` 好得多，但远未无限序列。\n\nC++\
  \ 在很多情况下可以修正舍入误差。例如，在输出时，C++ 有时可以判断用户实际上指的是 `1` 而不是 `0.999999\\.`。在其他情况下，即使是 C++\
  \ 也无法修正舍入误差。\n\n噬 不有限的范围\n\n尽管 `double` 数据类型的范围远大于整数，但它仍然有限。`int` 的最大值比 20 亿多一点。`double`\
  \ 变量的最大值大约是 10 的 38 次。\n\n## 声明变量类型\n\n到本书为止，我一直在强调变量必须声明，并且必须分配类型。幸运的是（哒哒！），C++\
  \ 提供了多种变量类型。参见表 2-1 的变量列表及其优点和局限性。\n\n表 2-1 普通 C++ 变量类型\n\n| 变量 | 定义常量 | 它是什么 |\n\
  | :--- | :--- | :--- |\n| `int` | 1 | 简单的计数数字，正负均可。 |\n| `short int` | --- | `int`\
  \ 的可能更小版本。占用内存更少但范围更小。 |\n| `long int` | 10L | `int` 的可能更大的版本。在 gcc 中，`long` 和 `int`\
  \ 没有区别。 |\n| `long long int` | 10LL | `int` 的可能更大的版本。 |\n| `float` | 1.0F | 单精度实数。这个较小版本比\
  \ `double` 占用内存少，但精度较低且范围较小。 |\n| `double` | 1.0 | 标准浮点变量。 |\n| `long double` |\
  \ --- | 可能更大的浮点数。在 PC 上，`long double` 用于 80x86 浮点处理器的原生尺寸，即 80 位。 |\n| `char` |\
  \ ‘c’ | 单个 `char` 变量存储单个字母或数字字符。不适用于算术运算。 |\n| `wchar_t` | L’c’ | 较大的字符，能够存储如中文等较大字符集的符号。\
  \ |\n| `char string` | “this is a string” | 字符字符串组成句子或短语。 |\n| `bool` | true | 另一个值是\
  \ false。不，我的意思是，它真的是假。逻辑上的假。不是指伪造或替代品之类的 . . . 。 |\n\n![c++'09.eps](img/c%2B%2B'09_fmt.jpeg)\
  \ `long long int` 和 `long double` 是 C++ ’09 正式引入的。\n\n整数类型分为符号和无符号两个版本。符号总是默认值（除\
  \ `char` 和 `wchar_t` 之外）。通过在声明类型前添加关键字 `unsigned` 创建无符号版本。无符号常量在其类型标识中包含 `U` 或 `u`。因此，以下代码声明了一个无符号\
  \ int 变量并将其赋值为 10：\n\n```cpp\nunsigned int uVariable;\nuVariable = 10U;\n```\n\n\
  \n\n\n以下语句将两个变量 `lVariable1` 和 `lVariable2` 声明为 `long int` 类型，并将它们赋值为值 1，而 `dVariable`\
  \ 是一个 `double` 类型，设置为值 1.0。在 `lVariable2` 的声明中，注意 `int` 是被假设的，可以省略：\n\n```cpp\n\
  // declare two long int variables and set them to 1\nlong int lVariable1\nlong lVariable2;\
  \ // int is assumed\nlVariable1 = lVariable2 = 1;\n\n// declare a variable of type\
  \ double and set it to 1.0\ndouble dVariable; dVariable = 1.0;\n```\n\n你可以在同一语句中声明变量并对其初始化：\n\
  \n```cpp\nint nVariable = 1; // declare a variable and\n// initialize it to 1\n\
  ```\n\n`char` 变量可以存储单个字符；字符字符串（它实际上不是一种变量类型，但在大多数情况下它的工作方式像变量）包含一个字符串。因此，‘C’ 是一个包含字符\
  \ C 的 `char`，而 “C” 是一个包含一个字符的字符串。一个粗略的类比是‘C’ 对应于手里的一枚钉子，而 “C” 对应于弹匣里剩下一枚钉子的气钉枪。（第\
  \ 9 章详细描述了字符串。）\n\n![Warning(bomb).eps](img/Warning(bomb)_fmt.jpeg)如果应用程序需要一个字符串，你就必须提供一个，即使该字符串只包含单个字符。仅提供字符是无法完成任务的。\n\
  \n### 常量的类型\n\n常量值是不变化的显式数字或字符（例如 1、0.5 或 ‘c’）。与变量一样，每个常量都有一个类型。在像 `n = 1;` 这样的表达式中，常量值\
  \ 1 是一个 `int`。要让 1 成为长整数，请将语句写为 `n = 1L;`。类比如下：1 代表一辆装有一个球的皮卡车，而 `1L` 是一辆同样装有一个球的倾倒车。在两种情况下，球的数量是相同的，但其中一个容器的容量要大得多。\n\
  \n在 `int` 到 `long` 的比较之后，`1.0` 代表值 1，但在浮点数容器中。然而，注意浮点常量的默认类型是 `double`。因此，`1.0`\
  \ 是一个 `double` 数字而不是 `float`。\n\n常量值 `true` 和 `false` 的类型为 `bool`。根据 C++ 对大小写的关注，`true`\
  \ 是一个常量，但 `TRUE` 没有意义。\n\n当通过 `const` 关键字创建变量时，可以将其声明为常量：\n\n```cpp\nconst double\
  \ PI = 3.14159; // declare a constant variable\n```\n\n`const` 变量在声明时必须初始化，且其值不能被任何后续语句更改。\n\
  \n![Tip.eps](img/Tip_fmt.jpeg)声明为 `const` 的变量不需要全大写命名，但按照惯例，它们通常是这样的。这只是给读者的提示，说明所谓的变量实际上并不是。\n\
  \n我承认，声明一个变量然后说它不能改变可能看起来奇怪。为什么要费此精力呢？很大程度上是因为命名良好的 `const` 变量可以让程序变得容易理解得多。考虑以下两个等效表达式：\n\
  \n```cpp\ndouble dC = 6.28318 * dR; // 这是什么意思？\ndouble dCircumference = 2 * PI *\
  \ dRadius; // 这容易理解得多\n```\n\n对于代码的读者来说，第二个表达式将某个物的半径乘以 2π 来计算周长，这应该清晰得多。\n\n###\
