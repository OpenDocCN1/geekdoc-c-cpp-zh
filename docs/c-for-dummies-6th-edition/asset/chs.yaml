  \ 表达式。\n\n## 枚举其他选项\n\nC++ 提供了一种定义独立的、用户自定义类型常量的机制。假设例如，我正在编写一个处理美国各州的程序。我可以通过名称引用这些州，例如“德克萨斯州”（Texas）或“北达科他州”（North\
  \ Dakota）。在实践中，这并不方便，因为重复的字符串比较计算开销很大，而且容易出错。\n\n我可以按照如下所示为每个州定义一个唯一的值：\n\n```cpp\n\
  #define DC_OR_TERRITORY 0\n#define ALABAMA 1\n#define ALASKA 2\n#define ARKANSAS\
  \ 3\n// ...以此类推...\n```\n\n这不仅避免了比较字符串的笨拙；还允许我将州名作为人口等属性数组的索引：\n\n```cpp\n// 增加阿拉斯加州的人口（他们需要这个）\n\
  population[ALASKA]++;\n```\n\n这样的语句比语义上等等的 `population[2]++` 要容易得多。这种操作非常常见，因此 C++\
  \ 允许程序员定义所谓的枚举（enumeration）：\n\n```cpp\nenum STATE {\n    DC_OR_TERRITORY, // 获得\
  \ 0\n    ALABAMA, // 获得 1\n    ALASKA, // 获得 2\n    ARKANSAS,\n    // ...以此类推...\n\
  };\n```\n\n此枚举的每个元素都分配了一个从 0 开始的值，因此 `DC_OR_TERRITORY` 定义为 0，`ALABAMA` 定义为 1，以此此类推。你可以通过使用如下赋值语句来覆盖这种增量序列：\n\
  \n```cpp\nenum STATE {\n    DC,\n    TERRITORY = 0,\n    ALABAMA,\n    ALASKA,\n\
  \    // ...以此类推...\n};\n```\n\n这个版本的 `STATE` 定义了一个元素 `DC`，其值为 0。然后它定义了一个新元素 `TERRITORY`，它也被赋值为\
  \ 0。`ALABAMA` 像以前一样从 1 开始。\n\n![c++'09.eps](img/c%2B%2B'09_fmt.jpeg) ’09 标准扩展了枚举，允许程序员像如下所示创建用户定义的枚举类型（注意代码段中增加了\
  \ `class` 关键字）：\n\n```cpp\nenum class STATE {\n    DC,\n    TERRITORIES = 0,\n \
  \   ALABAMA,\n    ALASKA,\n    // ...以此类推...\n};\n```\n\n此声明创建了一个新类型 `STATE` 并为其分配了\
  \ 52 个成员（从 `ALABAMA` 到 `WYOMING` 加上 `DC` 和 `TERRITORIES`）。程序员现在可以像使用其他变量类型一样使用 `STATE`。可以声明一个变量为\
  \ `STATE` 类型：\n\n```cpp\nSTATE s = STATE::ALASKA;\n```\n\n可以通过这种新类型来区分函数调用：\n\n\
  ```cpp\nint getPop(STATE s); // 返回人口\nint setPop(STATE s, int pop); // 设置人口\n```\n\
  \n`STATE` 类型不仅仅是 `int` 的另一个别名：没有为 `STATE` 成员定义算术运算。以下将 `STATE` 用数组索引的尝试是非法的：\n\n\
  ```cpp\nint getPop(STATE s)\n{\n    return population[s]; // 非法\n}\n```\n\n然而，通过应用强制转换，可以将\
  \ `STATE` 的成员转换为对应的整数（`DC` 和 `TERRITORIES` 为 0，`ALABAMA` 为 1，`ALASKA` 为 2，以此此类推）：\n\
  \n```cpp\nint getPop(STATE s)\n{\n    return population[(int)s]; // 合法\n}\n```\n\
  \n## 包含内容\n\n第三大类预处理器语句是 `#if`，它是 C++ `if` 语句的预处理器版本：\n\n```cpp\n#if constexpression\n\
  // 如果 constexpression 结果非 0，则包含\n#else\n// 如果 constexpression 结果为 0，则包含\n#endif\n\
  ```\n\n被称为条件编译，因为 `#if` 和 `#else` 或 `#endif` 之间的语句集只有在条件为真时才包含在编译中。`constexpression`\
  \ 短语仅限于简单的算术和比较运算符。这是可以的，因为除了等值比较和偶尔的加法之外的情况很少。\n\n例如，以下是 `#if` 的常用用法。我可以将以下定义包含在一个名为\
  \ `LogMessage` 的包含文件中：\n\n```cpp\n#if DEBUG == 1\ninline void logMessage(const char\
  \ *pMessage)\n{ cout << pMessage << endl; }\n#else\n#endif\n```\n*(注：由于原始文本存在大量重复，此处译文已进行去重处理)*\n\
  \n\n\n与 `#error` 不同，`assert()` 在程序执行时才执行测试。例如，假设我写了一个阶乘程序，它根据我传递的任何 `N` 来计算 `N *\
  \ (N - 1) * (N - 2)` 直到 1。阶乘只对正整数有定义；向阶乘函数传递负数总是错误的。为了保险起见，我应该在函数开始处对非正值添加一个测试：\n\
  \n```cpp\nint factorial(int N)\n{\n  assert(N > 0);\n  // ...程序继续执行...\n}\n```\n\
  \n```cpp\n\n现在，程序每次调用 `factorial()` 时都会检查参数。一旦出现负值的第一个迹象，`assert()` 就会停止程序，并向操作员发送一条断言失败的消息信息，同时附带文件名和行号。\n\
  \n在整个程序中大量使用 `assert()` 是在开发早期检测问题的良好方法，但不断测试那些已经在测试期间发现并移除的错误会无谓地减慢程序速度。为了避免这种情况，C++\
  \ 允许程序员在创建交付给用户的程序版本时“移除”测试：通过 `#define` 常量 `NDEBUG`（代表“非调试模式”）。这会导致预处理器将模块中所有对\
  \ `assert()` 的调用转换为“什么都不做”（通称为 NO-OP）。\n\n预处理器无法执行某些编译时测试。例如，假设你的程序只有在默认整数大小为 32\
  \ 位时才能正常工作。预处理器对此无能为力，因为它对整数或浮点数一无所知。为了解决这个问题，C++'09 引入了关键字 `static_assert()`，它由编译器（而不是预处理器）解释。它接受两个参数：一个常量表达式和一个字符串，如下例所示：\n\
  \n```cpp\nstatic_assert(sizeof(int) == 4, “int is not 32-bits.”);\n```\n\n如果常量表达式在编译期间求值为\
  \ 0 或假，编译器将输出该字符串并停止。`static_assert()` 不生成任何运行时代码。但请记住，该表达式是在编译时求值的，因此它不能包含函数调用或对只有在程序执行时才知道的内容的引用。\n\
  \n## Typedef\n\n`typedef` 关键字允许程序员为声明创建一个简短名称。谨慎地使用 `typedef` 可以使生成的程序更容易易读。（注意\
  \ `typedef` 实际上并不是预处理器命令，但它与包含文件和预处理器密切相关。）\n\n```cpp\ntypedef int* IntPtr;\ntypedef\
  \ const IntPtr IntConstPtr;\n\nint i;\nint *const ptr1 = &i;\nIntConstPtr ptr2=\
  \ ptr1; // ptr1 和 ptr2 是相同类型\n```\n\n此片段中的前两个声明为现有类型赋予了新名称。因此，第二个声明将 `IntConstPtr`\
  \ 为 `int const*` 的另一个名称。当这个新类型用于 `ptr2` 的声明时，它的效果与 `ptr1` 较复杂的声明相同。\n\n尽管 `typedef`\
  \ 没有引入任何新功能，但它可以让一些复杂的声明变得非常易读。\n\n### 第三部分：面向对象导论\n\n![317266-pp0301.eps](img/317266-pp0301_fmt.jpeg)\n\
  \n在本部分 . . .\n\n使 C++ 与其他语言区分的特性是 C++ 对面向对象编程的支持。面向对象是计算机世界中最炒作的术语（好吧，也许 .com 比它更火）。计算机语言、编辑器和数据库都声称是面向对象的，有时是有理由的，但大多数时候并没有。\n\
  \n查看随附 CD-ROM 上的 `BUDGET2` 程序，可以看到一个可以帮助你理解面向对象概念中对象的示例程序。\n\n面向对象的特性之处让它在全球范围内备受推求？继续阅读以找到答案。\n\
  \n## 第 11 章：研究面向对象编程\n\n#### 本章内容\n- 制作墨西哥玉米塔\n- 复习面向对象编程\n- 引入抽象和分类\n- 发现为什么面向对象编程很重要\n\
  \n面向对象编程到底是什么？面向对象编程，或者正如内行人士所喜欢的称法 `OOP`，依赖于你在离开纸尿裤之前就学过的两个原则：抽象和分类。为了解释这一点，让我给你们讲个小故事。\n\
  \n#### 抽象化微波炉\n\n有时当我儿子看橄榄球时（这只在我妻子找不到遥控器时才会发生），我会随手做一顿极其不健康的墨西哥玉米塔。我往盘子里倒一些薯片，撒上一些豆子、奶酪和大量的辣椒，然后把这一整乱象放在微波炉里加热五分钟。使用我的微波炉时，我打开门，把东西放进去，按下几个按钮。几分钟后，墨西哥玉米塔就做好了。\n\
  \n现在想一下我使用微波炉时**没有**做的所有事情：\n- 我没有为了让微波炉工作而重新布线或改变内部的任何东西。微波炉有一个接口——带有所有按钮和小型时间显示器的前面板——它让我完成我所需要的一切。\n\
  - 我不需要重新编写用于驱动微波炉内部微处理器的软件，即使我上次用微波炉时做的是不同的菜。\n- 我不需要看微波炉的外壳内部。\n- 即使我是一个微波炉设计师，了解微波炉的所有内部原理（包括它的软件），我仍然会用它加热我的墨西哥玉米塔，而不会考虑那些事情。\n\
  \n这些并不是深奥的观察。你在生活中能处理的压力是有限的。为了减少你处理的事情数量，你在特定的细节水平上工作。在面向对象（OO）计算机术语中，你工作的细节水平被称为**抽象级别**。趁此机会再引入另一个\
  \ OO 术语，我抽象掉了微波炉内部的细节。\n\n当我做墨西哥玉米塔时，我把微波炉看作一个盒子。（当我试着弄点零食时，我不能既担心微波炉的内部构造，又要看电视里的牛仔队比赛。）只要我只通过它的接口（键盘）操作微波炉，我就应该无法导致：\n\
  - 导致微波炉进入不一致状态并崩溃。\n- 让我的墨西哥玉米塔变成一团焦黑、燃烧的物质。\n- 让微波炉（以及周围的房子）起火！\n\n#### 准备函数式墨西哥玉米塔\n\
  \n假设我让我儿子写一个关于“爸爸如何做墨西哥玉米塔”的算法。在他理解了我的要求后，他可能会写“打开一罐豆子，磨一些奶酪，切开辣椒”等等。当涉及到微波加热混合物时，他会写类似“在微波炉中加热五分钟”之的话。\n\
  \n这种描述直接且完整。但并不是函数式程序员编写制作墨西哥玉米塔程序的方式。函数式程序员生活在一个没有微波炉或其他家电的世界里。他们倾向于担心具有无数函数型路径的流程图。在墨西哥玉米塔问题的函数式解决方案中，控制流将通过我的手指传递到面板，然后进入微波炉的内部。很快，控制流就会在复杂的逻辑路径中徘动，考虑要开启微波管多久以及是否要响“来吃饭了”的提示音。\n\
  \n在这样的世界里，用抽象级别来思考是非常困难的。没有对象，没有抽象来隐藏内在的复杂性。\n\n#### 准备面向对象的墨西哥玉米塔\n\n在制作墨西哥玉米塔的面向对象方法中，我首先识别问题中的对象类型：薯片、豆子、奶酪和烤箱。然后我开始在软件中对这些对象进行建模，而不考虑它们在最终程序中如何使用的细节。\n\
  \n\n\n\n当我做这些事情时，被认为我正在基础对象的层面进行工作（和思考）。我需要思考如何制作一个实用的烤箱，但还不需要思考制作纳荷饼（nachos）的逻辑过程。毕竟，微波炉的设计者并没有考虑过我制作零食的特定问题。相反，他们致力于解决设计和建造一个实用微波炉的问题。\n\
  \n在我需要的对象被成功编码和测试之后，我就可以提升到下一个抽象层次。我可以开始在制作纳荷饼的层面进行思考，而不是制作微波炉的层面。在此时，我几乎可以将我儿子的指令直接翻译成\
  \ `C++` 代码。\n\n## 分类微波炉\n\n抽象概念的关键在于分类。如果我问我儿子：“什么是微波炉？”他可能会说：“它是一个……的烤箱。”如果我接着问：“什么是烤箱？”他可能会回答道：“它是一个……的厨房电器。”（如果我再问：“什么是厨房电器？”，他可能会说：“你为什么要问这么多愚蠢的问题？”）\n\
  \n我儿子对我问题的回答源于他对我们特定微波炉的理解，将其视为“微波炉”这类类型物品的一个例子。此外，我儿子认为微波炉只是某种特殊的烤箱，而烤箱本身又是某种特殊的厨房电器。\n\
  \n![Remember.eps](img/Remember_fmt.jpeg) 在面向对象的计算机术语中，我厨房里的微波炉是类 `microwave` 的实例。`microwave`\
  \ 类是 `oven` 类的子类，而 `oven` 类是 `kitchen appliances` 类的子类。\n\n人类会进行分类。我们世界上的一切事物都被组织成分类法。我们这样做是为了减少我们需要记忆的事物数量。例如，你第一次看到\
  \ SUV 的时候。广告可能把这种 SUV 称为“革命性的，前所未有的”。但你和我知道并非如此。我喜欢某些 SUV 的外形（另一些则需要回到工厂，让设计师再尝试一次），但是，嘿，SUV\
  \ 是一辆汽车。正如此，它拥有与其他汽车的所有（或至少是大部分）属性。它有方向盘、座椅、发动机、刹车等。我敢打赌我甚至可以在不先读用户说明书的情况下开一辆。\n\
  \n我不必让我有限的存储空间被 SUV 与其他汽车的所有共同点给占满。我只需要记住“SUV 是一辆……的汽车”，然后加上那几个 SUV 独有的特征（比如价格标签）。我可以更进一步。汽车是轮式车辆的一个子类，其他成员还包括卡车和皮卡。也许轮式车辆是车辆的子类，而车辆包含了船只和飞机。以此类推。\n\
  \n## 为什么要分类？\n\n为什么要分类？这听起来很麻烦。而且，人们使用功能性方法已经这么久了，为什么要现在改变呢？\n\n专门为这一个问题设计和建造一个微波炉似乎可能更容易，而不是建造一个独立的、更通用的烤箱对象。例如，假设我想建造一个微波炉专门用来制作纳荷饼，且只制作纳荷饼。我不需要在它上安装前面板，除了一个\
  \ `Start` 按钮。我每次煮纳荷饼的时间都是样的，所以我可以省去所有 `Defrost`（解冻）和 `Temp Cook`（定时加热）之类的废话。我的纳荷饼专用微波炉只需要容纳一个小平盘。三立方英的空间会被浪费在纳荷饼上。\n\
  \n对于这个问题，我可以完全抛弃“微波炉”这个概念。我真正需要的只是烤箱的核心部件。然后，在食谱中，我放入让它运行的指令：“把纳荷饼放入盒子。将红线连接到黑线。将磁控管升至约\
  \ 3000 伏。注意轻微的嗡嗡声。如果你打算生孩子，尽量不要站得太近。”之类的。\n\n但功能性方法有一些问题：\n\n1. **太复杂**：我不想让建造烤箱的细节混合在制作纳荷饼的细节中。如果我不能定义对象并将它们从错综复杂的泥沼中提取出来单独处理，我就必须同时处理该问题的所有复杂性。\n\
  2. **不灵活**：某一天我可能需要将微波炉更换为其他类型的烤箱。只要它的接口相同，我就应该能够这样做。如果没有清晰的界定和独立开发，就不可能干净地移除一个对象类型并将其替换为另一个。\n\
  3. **不可复用**：烤箱被用来制作许多不同的菜肴。我不想每次遇到新食谱就创建一个新烤箱。解决过一次问题后，能在未来的程序中重用该方案就好了。\n\n本部分的剩余章节将演示面向对象的语言特性如何解决这些问题。\n\
  \n# 第 12 章\n\n## 在 C++ 中添加类\n\n### 本章内容\n- 将数据分组为类\n- 声明和定义类成员\n- 为类添加活动活动属性\n-\
  \ 访问类成员函数\n- 重载成员函数\n\n程序通常处理数据组：一个人的姓名、等级和序列号之类内容。这些值中的任何一个都不足以以描述一个人——只有在汇总时，这些值才有意义。数组这样的简单结构对于存储独立值很棒，但它对数据组的效果并不好。这使得老旧数组不足以存储复杂数据（例如网络公司为了防止数据被黑客窃取而维护的个人信用记录）。\n\
  \n出于很快就会明确的原因，我将这种数据分组称为对象。微波炉是一个对象（如果这听起来不通，请看第 11 章）。你是一个对象（无意）。你在数据库中的储蓄账户信息是一个对象。\n\
  \n## 引入类\n如果我们能在 `C++` 中创建具有我们正尝试建模的现实对象相关属性的对象，那该有多好。我们需要一个能够包含描述单个对象所需的所有数据类型的结构。`C++`\
  \ 将多个数据片段组合成单个对象的结构称为类。\n\n## 类的格式\n类由关键字 `class` 跟着一个名称以及一对大括号组成。一个描述包含账户号码和余额的储蓄账户的类可能如下：\n\
  \n```\nclass SavingsAccount\n{\npublic:\n    unsigned accountNumber;\n    double\
  \ balance;\n};\n```\n\n大括号随后的语句是关键字 `public`。（先别问关于 `public` 关键字的含义。稍后我会让它的含义公开。）\n\
  \n![Tip.eps](img/Tip_fmt.jpeg) 另一个关键字 `struct` 可以代替 `class`。这两个关键字完全相同，区别在于 `struct`\
  \ 假设是公开的（public）声明且可以省略。由于本章稍后会明确的原因，对于大多数程序，你应该坚持使用 `class`。\n\n`public` 关键字之后是描述该对象的条目。`SavingsAccount`\
  \ 类包含两个元素：一个无符号整数 `accountNumber` 和账户 `balance`。我们也可以说 `accountNumber` 和 `balance`\
  \ 是 `SavingsAccount` 类的成员或属性。\n\n要创建一个真正的储蓄账户对象，我输入类似以下的内容：\n\n```\nSavingsAccount\
  \ mySavingsAccount;\n```\n\n我们说 `mySavingsAccount` 是类 `SavingsAccount` 的实例。\n\n\
  ![Tip.eps](img/Tip_fmt.jpeg) 此处使用的命名约定很常见：类名通常首字母大写。在像 SavingsAccount 这样包含多个单词的类名中，每个单词的首字母都大写，并且单词挤在一起不加下划线。对象名称遵循相同的多个单词挤在一起的规则，但它们通常以小写字母开头，如\
  \ `mySavingsAccount`。一如既往，这些规范（我犹豫于称为规则）是为了帮助人类读者——`C++` 并不在乎这些。\n\n\n\n以下语法用于访问特定对象的属性：\n\
  \n```cpp\n// 创建一个储蓄账户对象\nSavingsAccount mySave;\nmySave.accountNumber = 1234;\n\
  mySave.balance = 0;\n\n// 从键盘输入第二个储蓄账户\ncout << “Input your account number and balance”\
  \ << endl;\nSavingsAccount urSave;\ncin >> urSave.accountNumber;\ncin >> urSave.balance;\n\
  ```\n\n这段代码片段声明了两个 `SavingsAccount` 类的对象：`mySave` 和 `urSave`。该片段通过为 `accountNumber`\
  \ 赋值并为 `balance` 赋值为 `0`（按照储蓄账户的惯例）初始化了 `mySave`。然后它创建了同类的第二个对象 `urSave`。该片段从键盘读取了\
  \ `accountNumber` 和 `balance`。\n\n此片段中需要注意的一个重要点是，`mySave` 和 `urSave` 是分离且独立的对象。操作其中一个对象的成员对另一个对象的成员没有影响（这对\
  \ `urSave` 来说是幸运的）。\n\n此外，没有关联对象的成员名称是没有意义的。我无法说以下任何一种语句：\n\n```cpp\nbalance = 0;\
  \ // 非法；没有对象\nSavingsAccount.balance = 0; // 是类但仍没有对象\n```\n\n每个储蓄账户都有自己独特的 `accountNumber`\
  \ 并维护一个独立的 `balance`。（可能存在所有储蓄账户共有的属性——我们很快就会就会这些这些——但 `account` 和 `balance` 并不在其中。）\n\
  \n## 激活我们的对象\n\n你使用类来模拟真实世界的对象。`Savings` 类试图代表一个储蓄账户。这允许你从对象的角度来思考，而不是仅仅是代码行。C++\
  \ 对象越接近模拟真实世界，在程序中处理它们就越容易。这听起来足够简单。然而，`Savings` 类在模拟储蓄账户方面做得并不理想。\n\n### 模拟真实世界的对象\n\
  \n真实世界的对象具有数据类型属性，例如账户号码和余额，与 `Savings` 类相同。这使得 `Savings` 成为描述真实对象的良好起点。但真实世界的对象会“做事情”。烤箱会做饭；储蓄账户会积累利息；定期存款（CDs）提前提取会收取巨额罚金——诸此类比。\n\
  \n功能性程序通过函数来“做事情”。一个 C++ 程序可能会调用 `strcmp()` 来比较两个字符字符串，或者调用 `max()` 返回两个值的最大值。事实上，第\
  \ 23 章解释了即使输入输出（`cin >>` 和 `cout <<`）也是函数调用的一种特殊形式。\n\n如果 `Savings` 类要很好地代表一个真实概念，它需要自己的活动属性：\n\
  \n```cpp\nclass Savings\n{\npublic:\n    double deposit(double amount)\n    {\n\
  \        balance += amount;\n        return balance;\n    }\n    unsigned accountNumber;\n\
  \    double balance;\n};\n```\n\n除了账户号码和余额，这个版本的 `Savings` 还包含了 `deposit()` 函数。这让\
  \ `Savings` 拥有控制自己未来的能力。`MicrowaveOven` 类有 `cook()` 函数，`Savings` 类有 `accumulateInterest()`\
  \ 函数，而 `CD` 类有一个 `penalizeForEarlyWithdrawal()` 函数。\n\n在类中定义的函数被称为成员函数。\n\n### 为什么要费力使用成员函数？\n\
  \n你为什么要费力使用成员函数呢？过去功能性编程的好日子有什么问题吗？\n\n```cpp\nclass Savings\n{\npublic:\n    unsigned\
  \ accountNumber;\n    double balance;\n};\n\ndouble deposit(Savings& s, double amount)\n\
  {\n    s.balance += amount;\n    return s.balance;\n}\n```\n\n这里，`deposit()` 实现了“存款到储蓄账户”的功能。这种功能性解决方案依赖于外部函数\
  \ `deposit()` 来实现一个储蓄账户执行但 `Savings` 缺失的活动。这虽然完成了任务，但它是通过破坏面向对象（OO）规则来实现的。\n\n微波炉有内部组件，它“知道”如何使用这些组件来烹饪、解冻和烤焦。类的数据成员类似于微波炉的零件——类的成员函数执行类似于\
  \ `cook` 的功能。\n\n当我做纳荷时，我不需要开始以特定方式连接烤箱的内部组件来让它工作。我也不依赖某些外部设备为我深入混乱的布线中操作。我希望我的类工作方式像我的微波炉一样（不，我的意思不是“不太好”）。我希望我的类知道如何在没有外部干预的情况下操作它们的内部结构。\n\
  \n## 添加成员函数\n\n为了演示成员函数，从定义一个 `Student` 类开始。这种类的一种可能表示如下（取自程序 `CallMemberFunction`）：\n\
  \n```cpp\nclass Student\n{\npublic:\n    // 将已完成的课程添加到记录\n    float addCourse(int\
  \ hours, float grade)\n    {\n        // 计算所有课程学时乘以\n        // 平均分数的\n        float\
  \ weightedGPA;\n        weightedGPA = semesterHours * gpa;\n        // 现在加上新课程\n\
  \        semesterHours += hours;\n        weightedGPA += grade * hours;\n      \
  \  gpa = weightedGPA / semesterHours;\n        // 返回新的 gpa\n        return gpa;\n\
  \    }\n    int semesterHours;\n    float gpa;\n};\n```\n\n函数 `addCourse(int, float)`\
  \ 称为 `Student` 类的成员函数。在原则上，它是类的一个属性，就像数据成员 `semesterHours` 和 `gpa` 一样。\n\n有时不是类成员的函数是类的“普通函数”，但我会将它们简单地称为非成员函数。\n\
  \n![Tip.eps](img/Tip_fmt.jpeg) 成员函数不需要像这个示例那样位于数据成员之前。类的成员可以按任何顺序列出——我只是倾向于将函数放在前面。\n\
  \n![TechnicalStuff.eps](img/TechnicalStuff_fmt.jpeg) 出历史原因，成员函数也被称为方法（methods）。这个术语起源于最早的面向对象语言之一。这个名字在那里是有意义的，但在\
  \ C++ 中没有意义。尽管如此，这个术语在面向对象领域变得流行，因为它比“成员函数”更容易说。所以，如果你的朋友在宴会上开始大谈“类的方法”，只需将方法替换为成员函数，并重新理解他们说的任何话即可。\n\
  \n## 调用成员函数\n\n下面的 `CallMemberFunction` 程序展示了如何调用成员函数 `addCourse()`：\n\n```cpp\n\
  // CallMemberFunction - 定义并调用一个\n// 是 Student 类的成员函数\n#include <cstdio>\n#include\
  \ <cstdlib>\n#include <iostream>\nusing namespace std;\n\nclass Student\n{\npublic:\n\
  \    // 将已完成的课程添加到记录\n    float addCourse(int hours, float grade)\n    {\n     \
  \   // 计算所有课程学时乘以\n        // 平均分数的\n        float weightedGPA;\n        weightedGPA\
  \ = semesterHours * gpa;\n        // 现在加上新课程\n        semesterHours += hours;\n\
  \        weightedGPA += grade * hours;\n        gpa = weightedGPA / semesterHours;\n\
  \        // 返回新的 gpa\n        return gpa;\n    }\n    int semesterHours;\n    float\
  \ gpa;\n};\n\nint main(int nNumberofArgs, char* pszArgs[])\n{\n    // 创建一个 Student\
  \ 对象并初始化\n    Student s;\n    s.semesterHours = 3;\n    s.gpa = 3.0;\n    // 调用前的值\n\
  \    cout << “Before: s = (“ << s.semesterHours\n    << “, “ << s. gpa\n    << “)”\
  \ << endl;\n\n    // 接下来将 s\n    // 对象的数据成员交给成员函数 addCourse()\n    cout << “Adding\
  \ 3 hours with a grade of 4.0” << endl;\n    s.addCourse(3, 4.0); // 调用成员函数\n\n\
  \    // 值现在改变了\n    cout << “After: s = (“ << s.semesterHours\n    << “, “ << s.\
  \ gpa\n    << “)” << endl;\n\n    // 在程序终止前等待用户准备好\n    // 以允许用户看到程序结果\n    system(“PAUSE”);\n\
  \    return 0;\n}\n```\n\n调用成员函数的语法看起来像是访问数据成员的语法与调用函数的语法的交叉。点的右侧看起来像传统的函数调用，但点的左侧是一个对象。\n\
  \n\n\n\n在调用 `s.addCourse()` 时，我们说“`addCourse()` 在对象 `s` 上进行操作”，或者换句话说，“`s` 是要添加课程的那个学生”。如果你不知道从哪个学生那里获取学分，你就无法获取这些学分的总数——如果你不知道要添加哪个学生，你就无法将学生添加到课程中。在没有对象的情况下调用成员函数，其意义与在没有对象的情况下引用数据成员没有区别。\n\
  \n## 从成员函数访问其他成员\n\n我完全理解：你心里心里反复想着：“在没有对象的情况下访问成员是没有意义的。在没有对象的情况下访问成员。访问……” 正当你接受了这一点时，你看到了成员函数\
  \ `Student::addCourse()`，砰！你灵光一醒：`addCourse()` 在没有引用对象的情况下，访问了类的其他成员。就像那个电视节目《他们是怎么做到的？》一样。\n\
  \n好了，到底是怎样的，你到底能行不能？听我的，你不能这样做。当你从 `addCourse()` 引用 `Student` 的成员时，该引用是针对调用 `addCourse()`\
  \ 的那个 `Student` 对象的。哈？回到 `CallMemberFunction` 示例。这里有一个精简版本：\n\n```cpp\nint main(int\
  \ nNumberofArgs, char* pszArgs[])\n{\n  Student s;\n  s.semesterHours = 10;\n  s.gpa\
  \ = 3.0;\n  s.addCourse(3, 4.0); // 调用成员函数\n  Student t;\n  t.semesterHours = 6;\n\
  \  t.gpa = 1.0; // 状况不太妙\n  t.addCourse(3, 1.5); // 情况并没有好转到哪里\n  system(“PAUSE”);\n\
  \  return 0;\n}\n```\n\n当使用对象 `s` 调用 `addCourse()` 时，`addCourse()` 中所有其他未限定的成员引用也都指向\
  \ `s`。因此，`addCourse()` 中对 `semesterHours` 的引用指向 `s.semesterHours`，而 `gpa` 指向 `s.gpa`。但当使用\
  \ `Student` 对象 `t` 调用 `addCourse()` 时，这些相同的引用改为指向 `t.semesterHours` 和 `t.gpa`。\n\
  \n![TechnicalStuff.eps](img/TechnicalStuff_fmt.jpeg)\n\n### 命名当前对象\n\n成员函数是如何知道当前对象是什么的？这并不是魔法——对象的地址作为一个隐式且隐藏的第一个参数传递给成员函数。换句话说，发生了以下转换：\n\
  \n`s.addCourse(3, 2.5)`\n\n类似于\n\n`Student::addCourse(&s, 3, 2.5)`\n\n（注意，你实际上无法使用这种显式语法；这只是\
  \ C++ 视角下的它的方式。）\n\n在函数内部，这个指向当前对象的隐式指针有一个名称，以备你需要引用它。它被称为 `this`，就像“哪个对象？*这个*对象。”的意思明白了吗？`this`\
  \ 的类型始终是一个指向相应类对象的指针。\n\n每当成员函数在不显式提供对象的情况下引用同类的其他成员时，C++ 都会假定如此。如果你喜欢，你也可以显式地引用它。我可以这样写\
  \ `Student::addCourse()`：\n\n```cpp\nfloat Student::addCourse(int hours, float grade)\n\
  {\n  float weightedGPA;\n  weightedGPA = this->semesterHours * this->gpa;\n  //\
  \ 现在加上新课程\n  this->semesterHours += hours;\n  weightedGPA += hours * grade;\n  this->gpa\
  \ = weightedGPA / this->semesterHours;\n  return this->gpa;\n}\n```\n\n无论你是像上一个示例那样显式包含\
  \ `this`，还是像你之前那样保持隐式，效果都是那样的。\n\n![Remember.eps](img/Remember_fmt.jpeg) 调用成员函数的对象就是“当前”对象，而所有对类成员的未限定引用都指向该对象。换句话说，从成员函数发出的类成员的未限定引用总是针对当前对象的。\n\
  \n### 作用域解析（我指的不是指你的显微镜工作得有多好）\n\n成员与其类名之间的 `::` 被称为作用域解析运算符，因为它指示了该成员所属的类。冒号之前的类名就像姓氏，而冒号后面的函数名就像名字——其顺序类似于中文名字，姓在前后。\n\
  \n你使用 `::` 运算符通过使用空类名来描述一个非成员函数。例如，非成员函数 `addCourse` 如果你愿意，可以被称为 `::addCourse(int,\
  \ float)`。这就像是一个没有家的函数。\n\n通常情况下，`::` 运算符是可选的，但在某些情况下它并非如此，如下所示：\n\n```cpp\n// addCourse\
  \ - 将学分和成绩合并为\n// 一个加权成绩\nfloat addCourse(int hours, float grade)\n{\n  return hours\
  \ * grade;\n}\n\nclass Student\n{\npublic:\n  // 将已完成的课程添加到记录中\n  float addCourse(int\
  \ hours, float grade)\n  {\n    // 调用某些外部函数来计算\n    // 加权成绩\n    float weightedGPA=\
  \ ::addCourse(semesterHours,gpa);\n    // 现在加上新课程\n    semesterHours += hours;\n\
  \    // 使用同一个函数来计算\n    // 这个新课程的加权成绩\n    weightedGPA += ::addCourse(hours, grade);\n\
  \    gpa = weightedGPA / semesterHours;\n    // 返回新的 gpa\n    return gpa;\n  }\n\
  \  int semesterHours;\n  float gpa;\n};\n```\n\n在这里，我希望成员函数 `Student::addCourse()`\
  \ 调用非成员函数 `::addCourse()`。然而，如果没有 `::` 运算符，从 `Student` 发出的 `addCourse()` 调用将指向 `Student::addCourse()`。这将导致函数调用自身。\n\
  \n## 在类中定义成员函数\n\n成员函数既可以在类内部定义，也可以单独定义。在类中定义时，函数形式如下，包含在包含 `Savings.h` 中：\n\n```cpp\n\
  // Savings - 定义一个包含存款\n// 能力的类\nclass Savings\n{\npublic:\n  // 定义成员函数 deposit()\n\
  \  float deposit(float amount)\n  {\n    balance += amount;\n    return balance;\n\
  \  }\n  unsigned int accountNumber;\n  float balance;\n};\n```\n\n![TechnicalStuff.eps](img/TechnicalStuff_fmt.jpeg)\n\
  \n在类中定义的成员函数默认是内联的（inline）（除非它们被编译器开关显式去内联，或者因为包含了循环）。大多数情况下，这是因为在类中定义的成员函数通常很小，而小函数是内联的理想候选者。\n\
  \n记住，内联函数会在调用它的地方展开。（有关内联函数和宏的比较，请参见第 10 章。）内联函数的执行速度更快，因为处理器不需要跳转到函数定义的地方——内联函数占用的内存更多，因为它们被复制到每个调用中，而不是只定义一次。\n\
  \n在类内部定义的成员函数内联还有另一个良好但更技术性的原因。记住 C++ 结构体通常定义在包含文件中，然后这些文件被包含在需要它们的 .CPP 文件中。此类包含文件不应包含数据或函数，因为这些文件会被多次编译。然而，包含内联函数是可以的，因为它（像宏一样）在源文件中就地展开。这同样适用于\
  \ C++ 类。通过将在类中定义的成员函数默认设为内联，你避免了上述问题。\n\n像这样使用包含文件非常明智。现在，程序可以像下面这样包含类的定义（以及成员函数的定义），在老旧的\
  \ `SavingsClass_inline` 程序中：\n\n```cpp\n//\n// SavingsClassInline - 调用一个既声明\n//\
  \ 又定义在类内部的成员函数\n//\n#include <cstdio>\n#include <cstdlib>\n#include <iostream>\n\
  \nusing namespace std;\n#include “Savings.h”\n\nint main(int nNumberofArgs, char*\
  \ pszArgs[])\n{\n  Savings s;\n  s.accountNumber = 123456;\n  s.balance = 0.0;\n\
  \  // 现在向账户添加一些东西\n  cout << “向账户 “ << s.accountNumber << “ 存款 10” << endl;\n  s.deposit(10);\n\
  \  cout << “余额为 ” << s.balance << endl;\n  // 等到用户准备好之前再终止程序\n  // 允许用户看到程序结果\n\
  \  system(“PAUSE”);\n  return 0;\n}\n```\n\n\n\n\n这很酷，因为除了 `Savings` 类的程序员之外，其他人都可以专注于执行存款这一动作，而不是关注银行业务的细节。这些细节被整齐地收纳在它们自己的包含文件（include\
  \ files）中。\n\n![Remember.eps](img/Remember_fmt.jpeg) `#include` 指令在编译过程中插入文件的内容。C++\
  \ 编译器实际上会“看到”一个包含了 `Savings.h` 文件内容的源文件。关于包含文件的详细信息，请参阅第 10 章。\n\n## 在类外保留成员函数\n\
  \n对于较大的函数，将代码直接放在类定义中可能会导致类定义变得庞大且难以维护。为了防止这种情况，C++ 允许你在类外部定义成员函数。\n\n![Tip.eps](img/Tip_fmt.jpeg)\
  \ 定义在类外部定义的函数被称为轮廓函数（outline function）。这个术语是为了与在类内部定义的内联函数（inline function）相反。你的一些基础函数，例如我们自第\
  \ 5 章以来定义的那些函数，也是轮廓函数。\n\n在类声明之外编写时，`Savings.h` 文件如下所示声明了 `deposit()` 函数，但没有对其定义：\n\
  \n```cpp\n// Savings - 定义一个类，它包含\n// 进行存款的能力\nclass Savings\n{\npublic:\n    //\
  \ 声明但不定义成员函数\n    float deposit(float amount);\n    unsigned int accountNumber;\n\
  \    float balance;\n};\n```\n\n`deposit()` 函数的定义必须包含在构成程序的一个源文件中。为了简单起见，我在 `main.cpp`\
  \ 中定义了它。\n\n![Tip.eps](img/Tip_fmt.jpeg) 你通常不会将成员函数的定义与程序的其余部分结合。将轮廓化的成员函数定义收集到一个适当名称的源文件中（例如\
  \ `Savings.cpp`）会更方便。该源文件将作为构建可执行程序的一部分与其他源文件合并。我将在第 21 章中详细描述这一点。\n\n```cpp\n//\n\
  // SavingsClassOutline - 调用一个在类中\n// 声明但在单独文件中\n// 定义成员函数\n//\n#include <cstdio>\n\
  #include <cstdlib>\n#include <iostream>\n\nusing namespace std;\n\n#include “Savings.h”\n\
  \n// 定义成员函数 Savings::deposit()\n// （通常这包含在一个单独的文件中\n// 然后与另一个不同的文件合并）\nfloat Savings::deposit(float\
  \ amount)\n{\n    balance += amount;\n    return balance;\n}\n\n// 主程序\nint main(int\
  \ nNumberofArgs, char* pszArgs[])\n{\n    Savings s;\n    s.accountNumber = 123456;\n\
  \    s.balance = 0.0;\n    // 现在向账户添加一些东西\n    cout << “Depositing 10 to account\
  \ “\n    << s.accountNumber << endl;\n    s.deposit(10);\n    cout << “Balance is\
  \ “ << s.balance << endl;\n    // 在终止程序之前等待用户准备好\n    // 以允许用户看到程序结果\n    system(“PAUSE”);\n\
  \    return 0;\n}\n```\n\n该类定义仅包含函数 `deposit()` 的原型型声明。函数的定义单独出现。结构中的成员函数原型声明与任何其他原型声明类似，并且和所有原型声明一样，它是必须的。\n\
  \n请注意，当函数在类内部定义时，函数别名 `deposit()` 就足够了。然而，当在类外部定义时，该函数需要其扩展名称 `Savings::deposit()`。\n\
  \n## 成员函数的重载\n\n成员函数的重载方式与普通函数的重载方式相同。（如果你不记得那是什么，请参见第 6 章。）然而，请记住类名是扩展名称的一部分。因此，以下函数都是合法的：\n\
  \n```cpp\nclass Student\n{\npublic:\n    // grade -- 返回当前的平均成绩点\n    float grade();\n\
  \    // grade -- 设置成绩点并返回旧值\n    float grade(float newGPA);\n    // ...数据成员和其他内容...\n\
  };\n\nclass Slope\n{\npublic:\n    // grade -- 返回斜率的百分比成绩\n    float grade();\n\
  \    // ...其他内容也可以放在这里...\n};\n\n// grade - 返回数字成绩对应的字母等级\nchar grade(float value);\n\
  \nint main(int argcs, char* pArgs[])\n{\n    Student s;\n    s.grade(3.5); // Student::grade(float)\n\
  \    float v = s.grade(); // Student::grade()\n    char c = grade(v); // ::grade(float)\n\
  \    Slope o;\n    float m = o.grade(); // Slope::grade()\n    return 0;\n}\n```\n\
  \n在 `main()` 中进行的每次调用都在注释中注明了所调用函数的扩展名称。\n\n在调用重载函数时，不仅是参数，而且调用该函数的对象类型（如果有的话）也被用于解析调用。（“解析”（resolve）一词是面向对象的术语，意为“在编译时决定调用哪个重载函数”。凡人可能会称其为“区分”（differentiate）。）\n\
  \n## 第 13 章：指向并凝视对象\n\n### 本章内容\n- 检查对象数组的对象\n- 获取关于对象指针的几个指针\n- 强类型——对我们的指针变得挑剔\n\
  - 穿过对象列表\n\nC++ 程序员一直在生成各种物品的数组——整数数组、浮点数数组——为什么不创建学生数组呢？学生总是在排队——比他们愿意排队的时间多得多。`Student`\
  \ 对象的排队概念正如如此。\n\n### 对象的数组\n\n对象的数组工作方式与简单变量相同（参见第 7 章）。例如，取以下 `ArrayOfStudents`\
  \ 代码段：\n\n```cpp\n// ArrayOfStudents - 定义一个对象\n// 数组并访问其中的元素。\n//（参见第 8 和 9 章）\n\
  class Student\n{\npublic:\n    // ...\n    void addCourse(int hours, float grade);\n\
  };\n\nvoid someFn()\n{\n    // 声明学生数组\n    Student s[10];\n    // 给第五学生分配 4.0 gpa\n\
  \    s[4].gpa = 4.0;\n    // 添加另一个课程\n    s[4].addCourse(3.0);\n}\n```\n\n这里 `s`\
  \ 是对象数组。`s[4]` 指第五学生。此外，`s[4].addCourse()` 添加了课程。\n\n### 指向对象的指针\n\n指向对象的指针工作方式类似于简单类型，正如示例\
  \ `ObjPtr` 所示：\n\n```cpp\n// ObjPtr - 定义并使用指向 对象的指针\n#include <cstdio>\n#include\
  \ <cstdlib>\n#include <iostream>\n\nusing namespace std;\n\nclass Student\n{\npublic:\n\
  \    int semesterHours;\n    float gpa;\n    float addCourse(int hours, float grade);\n\
  };\n\nint main(int argc, char* pArgs[])\n{\n    // 创建一个 Student 对象\n    Student\
  \ s;\n    s.gpa = 3.0;\n    // 现在创建一个指向 Student 的指针 pS\n    Student* pS;\n    //\
  \ 让 pS 指向我们的对象\n    pS = &s;\n    // 现在输出对象的 gpa，第一次通过\n    // 变量名，第二次通过 pS\n  \
  \  cout << “s.gpa = “ << s.gpa << “\\n”\n    << “pS->gpa = “ << pS->gpa << endl;\n\
  \    // 在终止程序之前等待用户准备好\n    // 以允许用户看到程序结果\n    system(“PAUSE”);\n    return 0;\n\
  }\n```\n\n## 解引用对象指针\n\n通过类比指向简单变量的指针，你可能会认为以下代码指向的是学生 `s` 的 GPA：\n\n```cpp\nint\
  \ main(int argc, char* pArgs[])\n{\n    Student s;\n}\n```\n\n\n\n\n\n```cpp\nStudent*\
  \ pS = &s; // create a pointer to s\n\n// access the gpa member of the obj pointed\
  \ at by pS\n\n// (this doesn’t work)\n\n*pS.gpa = 3.5;\n\nreturn 0;\n\n}\n```\n\n\
  如注释所示，这种写法不起作用的。问题在于点运算符（`.`）求值的优先级高于指针运算符（`*`）。需要使用括号来强制指针运算符在点运算符之前求值：\n\n```cpp\n\
  int main(int argc, char* pArgs[])\n{\nStudent s;\nStudent* pS = &s; // create a\
  \ pointer to s\n// access the gpa member of the obj pointed at by pS\n// (this works\
  \ as expected)\n(*pS).gpa = 3.5;\n\nreturn 0;\n}\n```\n\n`*pS` 求值得到 `pS` 所指向的 `Student`\
  \ 对象。`.gpa` 指的是该对象的 `gpa` 成员。\n\n## 指向箭头指针（arrow pointers）\n\n使用星号运算符配合括号对对象指针进行解引用是可以行的；然而，即使是是最老练的技术人员也会承认，这种星号和括号的混合用法有些很别扭。\n\
  \nC++ 提供了一个更方便的运算符来访问对象的成员，以避免笨拙的对象指针表达式。`->` 运算符的定义如下：\n\n`ps->gpa` 等同于 `(*pS).gpa`\n\
  \n这导致了以下结果：\n\n```cpp\nint main(int argc, char* pArgs[])\n{\nStudent s;\nStudent*\
  \ pS = &s; // create a pointer to s\n// access the gpa member of the obj pointed\
  \ at by pS\npS->gpa = 3.5;\n\nreturn 0;\n}\n```\n\n箭头运算符几乎被专门使用，因为它更易读；然而，这两种形式是完全等价的。\n\
  \n## 将对象传递给函数\n\n将指针传递给函数只是你玩转指针变量的方式之一。\n\n## 使用对象值调用函数\n\n如你所知，当参数类型被标记为 `&` 属性时，C++\
  \ 通过引用将参数传递给函数（参见第 8 章）。然而，默认情况下，C++ 通过值将参数传递给函数。（如果你坚持的话，可以检查第 6 章。）\n\n复杂的、用户定义的类对象的传递方式与简单的\
  \ `int` 值相同，如下所示 `PassObjVal` 程序：\n\n```cpp\n// PassObjVal - 尝试在函数中更改对象的值\n// 当对象按值传递时，这种尝试将失败\n\
  #include <cstdio>\n#include <cstdlib>\n#include <iostream>\n\nusing namespace std;\n\
  \nclass Student\n{\npublic:\nint semesterHours;\nfloat gpa;\n};\n\nvoid someFn(Student\
  \ copyS)\n{\ncopyS.semesterHours = 10;\ncopyS.gpa = 3.0;\ncout << “The value of\
  \ copyS.gpa = “\n<< copyS.gpa << endl;\n}\n\nint main(int argc, char* pArgs[])\n\
  {\nStudent s;\ns.gpa = 0.0;\n// 在调用 someFn() 之前显示 s.gpa 的值\ncout << “The value of\
  \ s.gpa = “ << s.gpa << endl;\n// 传递现有对象的地址\ncout << “Calling someFn(Student)” <<\
  \ endl;\nsomeFn(s);\ncout << “Returned from someFn(Student)” << endl;\n// s.gpa\
  \ 的值保持为 0\ncout << “The value of s.gpa = “ << s.gpa << endl;\n// 等待用户准备好后再终止程序\n\
  // 让用户看到程序结果\nsystem(“PAUSE”);\nreturn 0;\n}\n```\n\n`main()` 函数创建了一个对象 `s`，然后将\
  \ `s` 传递给函数 `someFn()`。\n\n![Remember.eps](img/Remember_fmt.jpeg) 传递的对象 `s` 本身，而是\
  \ `s` 的拷贝。\n\n`someFn()` 中的对象 `copyS` 始于 `main()` 中变量 `s` 的精确拷贝。由于它是拷贝，在 `someFn()`\
  \ 中对 `copyS` 进行的任何更改对 `main()` 中的 `s` 都没有影响。执行此程序会产生以下可以理解但令人失望的响应：\n\n```\nThe\
  \ value of s.gpa = 0\nCalling someFn(Student)\nThe value of copyS.gpa = 3\nReturned\
  \ from someFn(Student)\nThe value of s.gpa = 0\nPress any key to continue . . .\n\
  ```\n\n## 使用对象指针调用函数\n\n大多数时候，程序员希望在函数中进行的任何更改也能反映在调用它的函数中。为了这一点，C++ 程序员必须传递对象的地址或对象的引用，而不是对象本身。以下\
  \ `PassObjPtr` 程序使用了地址法：\n\n```cpp\n// PassObjPtr - 通过传递指针在\n// 函数中更改对象的内容\n#include\
  \ <cstdio>\n#include <cstdlib>\n#include <iostream>\n\nusing namespace std;\n\n\
  class Student\n{{\npublic:\nint semesterHours;\nfloat gpa;\n};\n\nvoid someFn(Student*\
  \ pS)\n{\npS->semesterHours = 10;\npS->gpa = 3.0;\ncout << “The value of pS->gpa\
  \ = “\n<< pS->gpa << endl;\n}\n\nint main(int nNumberofArgs, char* pszArgs[])\n\
  {\nStudent s;\ns.gpa = 0.0;\n// 在调用 someFn() 之前显示 s.gpa 的值\ncout << “The value of\
  \ s.gpa = “ << s.gpa << endl;\n// 传递现有对象的地址\ncout << “Calling someFn(Student*)”\
  \ << endl;\nsomeFn(&s);\ncout << “Returned from someFn(Student*)” << endl;\n// s.gpa\
  \ 的值现在是 3.0\ncout << “The value of s.gpa = “ << s.gpa << endl;\n// 等待用户准备好后再终止程序\n\
  // 让用户看到程序结果\nsystem(“PAUSE”);\nreturn 0;\n}\n```\n\n`someFn()` 参数的类型是一个指向 `Student`\
  \ 对象的指针（也称为 `Student*`）。这体现在程序调用 `someFn()` 的方式上，传递的是 `s` 的地址而不是 `s` 的值。给 `someFn()`\
  \ 提供 `s` 的地址允许它修改存储在那里的任何值。从概念上说，这类似于在纸张 `pS` 上写下房子 `s` 的地址，然后将那张纸传给 `someFn()`。函数\
  \ `someFn()` 使用箭头语法来解引用 `pS` 指针。\n\n`PassObjPtr` 的输出要满意得多（至少对我来说）：\n\n```\nThe value\
  \ of s.gpa = 0\nCalling someFn(Student*)\nThe value of pS->gpa = 3\nReturned from\
  \ someFn(Student*)\nThe value of s.gpa = 3\nPress any key to continue . . .\n```\n\
  \n### 使用引用调用函数\n\n在第 9 章中描述的引用运算符适用于用户定义的对象。以下 `PassObjRef` 演示了用户定义对象的引用：\n\n```cpp\n\
  // PassObjRef - 使用引用在\n// 函数中更改对象的内容\n#include <cstdio>\n#include <cstdlib>\n#include\
  \ <iostream>\n\nusing namespace std;\n\nclass Student\n{\npublic:\nint semesterHours;\n\
  float gpa;\n};\n\n// 与之前相同，但这次使用了引用\nvoid someFn(Student& refS)\n{\nrefS.semesterHours\
  \ = 10;\nrefS.gpa = 3.0;\ncout << “The value of refS.gpa = “\n<< refS.gpa << endl;\n\
  }\n\nint main(int nNumberofArgs, char* pszArgs[])\n{\nStudent s;\ns.gpa = 0.0;\n\
  // 在调用 someFn() 之前显示 s.gpa 的值\ncout << “The value of s.gpa = “ << s.gpa << endl;\n\
  // 传递现有对象的地址\ncout << “Calling someFn(Student&)” << endl;\nsomeFn(s);\ncout << “Returned\
  \ from someFn(Student&)” << endl;\n// s.gpa 的值现在是 3.0\ncout << “The value of s.gpa\
  \ = “ << s.gpa << endl;\n// 等待用户准备好后再终止程序\n// 让用户看到程序结果\nsystem(“PAUSE”);\nreturn\
  \ 0;\n}\n```\n\n在本例中，C++ 传递的是 `s` 的引用而不是拷贝。在 `someFn()` 中进行的更改被保留在了 `main()` 中。\n\
  \n![Tip.eps](img/Tip_fmt.jpeg) 按引用传递只是传递对象的另一种方式。C++ 跟踪引用的地址，而你则在指针中操作地址。\n\n##\
  \ 为什么要用指针或引用？\n\n好了，既然指针和引用都提供了相对优势，但为什么要费力使用其中一个呢？为什么不总是传递对象？我在本章开头提到过一个明显的答案：你无法从一个只得到结构对象拷贝的函数修改该对象。\n\
  \n第二个原因是：某些对象很大——我是真的。代表屏幕图像的对象可能有几兆字节。按值传递此类对象意味着将整个对象拷贝到函数的内存中。\n\n如果该函数调用另一个函数，对象将需要再次拷贝。久而久之，你会得到许多对象的拷贝。这会消耗内存，而且拷贝所有对象可能会让你的程序运行速度比启动\
  \ Windows 还要慢。\n\n\n\n\n\n![Warning(bomb).eps](img/Warning(bomb)_fmt.jpeg) 复制对象的问题变得更加严重了。在第\
  \ 17 章中你会看到，创建一个对象的拷贝可能比简单地拷贝周围的一些内存更加痛苦。\n\n## 回到堆\n\n简单类型指针存在的问题同样困扰类对象指针。特别是，你必须确保你正在使用的指针实际上指向一个有效对象。例如，不要返回在函数内局部定义的对象的引用：\n\
  \n```cpp\nMyClass* myFunc()\n{\n// 以下代码不起作用\nMyClass mc;\nMyClass* pMC = &mc;\n\
  return pMC;\n}\n```\n\n从 `myFunc()` 返回后，`mc` 对象离开了作用范围。由 `myFunc()` 返回的指针在调用函数中是无效的。\n\
  \n![Remember.eps](img/Remember_fmt.jpeg) 返回即将离开作用范围的内存的问题在第 9 章中讨论。\n\n在堆上分配对象可以解决这个问题：\n\
  \n```cpp\nMyClass* myFunc()\n{\nMyClass* pMC = new MyClass;\nreturn pMC;\n}\n```\n\
  \n在这里，当变量 `pMC` 离开作用范围时，在堆上分配的内存并不会返回。\n\n![Remember.eps](img/Remember_fmt.jpeg)\
  \ 当程序员不希望内会在任何特定变量离开作用范围时丢失时，他们会从堆分配内存。程序员负责分配和返回堆内存。\n\n## 分配堆对象\n\n也可以使用以下语法在堆上分配对象数组：\n\
  \n```cpp\nclass MyClass\n{\npublic:\nint nValue;\n};\n\nvoid fn()\n{\nMyClass* pMC\
  \ = new MyClass[5]\n// 像任何数组一样引用单个成员\nfor (int i = 0; i < 5; i++)\n{\npMC[i].nValue\
  \ = i;\n}\n// 使用不同的 delete 关键字将内存\n// 返回给堆\ndelete[] pMC;\n};\n```\n\n注意，一旦分配，`pMC`\
  \ 就可以像任何其他数组一样使用，其中 `pMC[i]` 指向类型为 `MyClass` 的第 i 个对象。同样注意，你使用略有不同的关键字 `delete[]`\
  \ 将类对象数组返回给堆。\n\n## 比较指针与引用\n\n我讨厌一直提到指针并指向引用，但新程序员经常会奇怪为什么两者都需要。\n\n![Tip.eps](img/Tip_fmt.jpeg)\
  \ 实际上，你可以认为你并不需要两者。C# 和大多数其他语言都不使用指针。然而，指针变量是老牌标准 C++ 中根深蒂固的一部分。\n\n## 连接链表\n\n\
  除了数组之后，第二常见的结构被称为列表（list）。列表有不同的大小和类型；然而，最常见的是链表。在链表中，每个对象都指向下一个成员，形成一种贯穿内存的链链。程序可以简单地将列表的最后一个元素指向一个对象将其添加到列表中。这意味着用户不需要在程序开始时声明链表的大小——你只需通过断开链接即可从列表中添加和删除对象。此外，你可以通过更改链接来对链表的成员进行排序——而无需实际移动数据对象。\n\
  \n这种灵活性的代价是访问速度。例如，你不能像在数组中那样直接伸进去抓取第十个元素。相反，你必须从列表开始处，从一个对象链接到下一个对象十次。\n\n链表除了运行时可扩展性（这是好事）和随机访问对象的困难性（这是坏事）外，还有另一个特征：链表大量使用了指针。这使得链表成为让你操作指针变量的绝佳工具。\n\
  \n![Tip.eps](img/Tip_fmt.jpeg) C++ 标准库提供了许多类型的列表。你可以在第 27 章中看到它们的运行；然而，自己实现第一个链表总是是好的，以便练习操作指针。\n\
  \n并不是每个类都能用于创建链表。你按照如下所示声明一个可链接类：\n\n```cpp\nclass LinkableClass\n{\npublic:\nLinkableClass*\
  \ pNext;\n// 类的其他成员\n};\n```\n\n可链接类的关键在于 `pNext` 指针。乍看之下，这确实很奇怪——一个类包含一个指向自身的指针？实际上，`pNext`\
  \ 并不是指向自身的指针，而是指向另一个相同类型的不同对象。\n\n`pNext` 指针类似于用于形成过马路孩子链的附属物。孩子列表由若干对象组成，所有类型均为\
  \ `child`。每个孩子都持有另一个孩子。\n\n在链表外部某处有一个指向列表第一个元素的指针，即头指针（head pointer）。头指针仅仅是一个类型为\
  \ `LinkableClass*` 的指针：为了继续维持孩子链的类比，老师指向一个类型为 `child` 的类对象。\n\n始终将任何指针初始化为 `nullptr`，即不指向任何内容的指针，非指针。\n\
  \n```cpp\nLinkableClass* pHead = nullptr;\n```\n\n![c++'09.eps](img/c%2B%2B'09_fmt.jpeg)\
  \ 对于 '09 标准之前没有实现 `nullptr` 的 C++ 编译器，使用硬编码的 `0` 或等效的 `#define` 代替：\n\n```cpp\n\
  LinkableClass* pHead = 0;\n```\n\n为了看到链表如何工作，考虑以下函数，它将传递的参数添加到列表开头：\n\n```cpp\n\
  void addHead(LinkableClass* pLC)\n{\npLC->pNext = pHead;\npHead = pLC;\n}\n```\n\
  \n在这里，`pNext` 指针被设置为列表的头部。这就像是松开了老师手中持有的孩子，并将它指向你。这让你成为了链中的第一个孩子。\n\n## 对链表执行其他操作\n\
  \n向列表头部添加对象是最简单的操作。遍历列表中的元素让你对链表有更好的想法：\n\n```cpp\n// 遍历链表\nLinkableClass* pL =\
  \ pHead;\nwhile(pL)\n{\n// 在此处执行某些操作\n// 获取下一个\npL = pL->pNext;\n}\n```\n\n程序初始化\
  \ `pL` 指针指向列表的头部。然后进入 `while` 循环。如果 `pL` 指针不空，它指向某个 `LinkableClass` 对象。进入循环后，程序对\
  \ `pL` 指向的对象执行任何操作。\n\n赋值 `pL = pL->pNext` 将 `pL` 指针移动到列表中的下一个孩子处。\n\n## 连接 LinkedListData\
  \ 程序\n\n这里展示的 LinkedListData 程序实现了一个包含姓名对象的链表。程序可以轻松包含你喜欢的任何其他数据，例如社会安全号码、平均成绩、身高、体重和银行余额。我将信息限制为姓名，以保持程序尽可能简单。\n\
  \n```cpp\n// LinkedListData - 在对象列表中存储数据\n#include <cstdio>\n#include <cstdlib>\n\
  #include <iostream>\n#include <string.h>\n\nusing namespace std;\n\n// NameDataSet\
  \ - 存储姓名（这些对象\n// 可以轻松存储任何所需的信息）。\nclass NameDataSet\n{\npublic:\nstring name;\n\
  // 指向列表中下一个条目的链接\nNameDataSet* pNext;\n};\n\n// 指向列表第一个条目的指针\nNameDataSet* pHead\
  \ = 0;\n\n// add - 向链表添加新成员\nvoid add(NameDataSet* pNDS)\n{\n// 将当前条目指向列表的开头\npNDS->pNext\
  \ = pHead;\n// 将头指针指向当前条目\npHead = pNDS;\n}\n\n// getData - 读取姓名和社会安全\n// 号；如果没有更多可读取的内容则返回空\n\
  NameDataSet* getData()\n{\n// 读取第一个姓名\nstring name;\ncout << “\\nEnter name:”;\n\
  cin >> name;\nreturn nullptr; // 注：原文此处不完整，此处根据逻辑补全\n}\n```\n\n\n\n\n\n```cpp\n\
  // if the name entered is ‘exit’...\n\nif (name == “exit”)\n{\n    // ...return\
  \ a null to terminate input\n    return 0;\n}\n\n// get a new entry and fill in\
  \ values\nNameDataSet* pNDS = new NameDataSet;\npNDS->sName = name;\npNDS->pNext\
  \ = 0; // zero link\n// return the address of the object created\nreturn pNDS;\n\
  }\n\nint main(int nNumberofArgs, char* pszArgs[])\n{\n    cout << “Read names of\
  \ students\\n”\n    << “Enter ‘exit’ for first name to exit”\n    << endl;\n   \
  \ // create (another) NameDataSet object\n    NameDataSet* pNDS;\n    while (pNDS\
  \ = getData())\n    {\n        // add it to the list of NameDataSet objects\n  \
  \      add(pNDS);\n    }\n    // to display the objects, iterate through the\n \
  \   // list (stop when the next address is NULL)\n    cout << “\\nEntries:” << endl;\n\
  \    for(NameDataSet *pIter = pHead; pIter; pIter = pIter->pNext)\n    {\n     \
  \   // display name of current entry\n        cout << pIter->sName << endl;\n  \
  \  }\n    // wait until user is ready before terminating program\n    // to allow\
  \ the user to see the program results\n    system(“PAUSE”);\n    return 0;\n}\n\
  ```\n\n虽然 `LinkedListData` 程序看起来有点长，但如果你分部分来理解，它是简单的。`NameDataSet` 结构体包含了一个存储人姓名的空间，以及一个指向链表中下一个\
  \ `NameDataSet` 对象的链接。我之前提到过，在现实世界的应用中，这个类还会有其他成员。\n\n![Tip.eps](img/Tip_fmt.jpeg)\
  \ 我使用了 `string` 类来包含人的姓名。虽然我直到第 27 章才会详细描述 `string` 类的所有方法，但它比零终止的字符字符串易用得多。你会发现，在如今大多数应用程序中，人们倾向于使用\
  \ `string` 类而不是字符字符串。`string` 类已经变得几乎接近 C++ 语言中的内建类型了。\n\n`main()` 函数开始循环，在每次迭代中调用\
  \ `getData()` 从用户处获取另一个 `NameDataSet` 条目。如果 `getData()` 返回空（即代表地址的“非地址”），程序将退出循环。\n\
  \n`getData()` 函数提示用户输入姓名并读取用户输入的任何内容。如果输入的字符串等于 `exit`，该函数向调用者返回空，从而退出 `while` 循环。如果输入的字符串不是\
  \ `exit`，程序会创建一个新的 `NameDataSet` 对象，填充姓名，并将 `pNext` 指针置零。\n\n![Remember.eps](img/Remember_fmt.jpeg)\
  \ 永远不要让链接指针未初始化。使用老程序员娘子们的老谚吧：“如果不确定，就把它清零。”（我的意思是“老话了”，而不是“老太子的故事”。）\n\n最后，`getData()`\
  \ 将对象的地址返回给 `main()`。\n\n`main()` 将从 `getData()` 返回的每个对象添加到全局变量 `pHead` 所指向的链表开头。当\
  \ `getData()` 返回空时，控制流退出初始的 `while` 循环。随后 `main()` 进入第二个部分，遍历完整的列表并显示每个对象。\n\n这次我使用了一个\
  \ `for` 循环，它的功能与之前的 `while` 循环等效。`for` 循环通过赋值 `pIter = pHead` 将迭代指针 `pIter` 初始化为指向列表中的第一个元素。接着它检查\
  \ `pIter` 是否为空，当列表耗尽时，它将为空。然后它进入循环。在 `for` 循环的每次完整循环中，第三个子句通过赋值 `pIter = pIter->pNext`\
  \ 将 `pIter` 从一个对象移动到下一个对象，然后重复测试和循环体。这种模式适用于所有的列表类型。\n\n程序示例运行的输出如下：\n\n```\nRead\
  \ names of students\nEnter ‘exit’ for first name to exit\nEnter name:Randy\nEnter\
  \ name:Loli\nEnter name:Bodi\nEnter name:exit\nEntries:\nBodi\nLoli\nRandy\nPress\
  \ any key to continue . . .\n```\n\n![Tip.eps](img/Tip_fmt.jpeg) 程序输出姓名的顺序与输入的顺序相反。这是因为每个新对象都被添加到列表的开头。或者，程序也可以将每个对象添加到列表的末尾——这只需要多写一点代码。我在随附的\
  \ CD-ROM 中包含了一个这样的版本，称为 `LinkedListForward`，它将新添加的对象链接到列表末尾，以便列表输出顺序与输入顺序相同。唯一的区别在于\
  \ `add()` 函数。在看我的答案之前，尝试看看你是否能创建这个正向版本。\n\n# 一线曙光：与 C++ 库链接的容器列表\n\n我相信每个人都应该先走后跑，在使用计算器之前应该学会如何心算，并且在使用别人写的列表类之前应该先自己写一个链表程序。尽管如此，在第\
  \ 27 章中，我将描述 C++ 环境提供的列表类。\n\n# 第 14 章保护成员：请勿打扰\n\n## 本章内容\n- 声明成员为保护的（protected）\n\
  - 在类内部访问保护成员\n- 从类外部访问保护成员\n\n第 12 介绍引入了类的概念。该章将 `public` 关键字描述为类声明的一部分——就像你要做的一项操作。在本章中，你将了解到\
  \ `public` 的替代方案。\n\n## 保护成员\n\n类的成员可以被标记为 `protected`，这使得它们在类外部是无法访问的。另一种方案是将成员设为\
  \ `public`。`public` 成员对所有人开放。\n\n![Remember.eps](img/Remember_fmt.jpeg) 请从弱意义上理解“不可访问”这个词。任何程序员都可以进入源代码，移除\
  \ `protected` 关键字，并做她任何想做的事。此外，任何有真才的黑客都可以在保护代码区域编写代码。`protected` 关键字的设计是为了防止无意访问，从而保护程序员免受伤害。\n\
  \n## 为什么你需要保护成员\n\n为了理解 `protected` 的作用，请思考面向对象编程的目标：\n\n- 保护类的内部免受外部函数的影响。例如，假设你计划制造一个软件微波炉（或其他设备），为外部世界提供一个简单的接口，然后给它套上一个盒子以防止他人捣乱内部结构。`protected`\
  \ 关键字就是那个盒子。\n- 让类负责维护其内部状态。如果其他人可以伸进去操纵它的内部结构，那么要求类来负责是不公平的（这就像要求一个微波炉设计者对我胡乱微波炉内部接线的后果负责一样是不公平的）。\n\
  - 限制类与外部世界的接口。对于一个接口有限（`public` 成员）的类，更容易理解和使用。`protected` 成员对用户隐藏，且不需要学习。接口变成了类本身；这被称为抽象（关于抽象的更多信息请参见第\
  \ 11 章）。\n- 减少类与其他代码之间的耦合程度。通过限制耦合，你可以更容易用一个类替换另一个类，或者在其他程序中使用该类。\n\n现在，我知道你们这些函数式程序员在说什么：“你们不需要某些花哨的功能来实现这一切。只需制定一条规则规定某些成员是公开访问的，而其他不是即可。”\n\
  \n虽然这在理论上是正确的，但行不通。人们起初带着各种善意，但只要语言至少不鼓励直接访问保护成员，这些良好的善意就会在交付产品的压力下被粉碎。\n\n## 发现保护成员的工作原理\n\
  \n在类中添加 `public` 关键字会使后续成员变为 `public`，这意味着它们可以被非成员函数访问。添加 `protected` 关键字会使类的后续成员变为\
  \ `protected`，这意味着它们不能被类的非成员访问。你可以随意地在 `public` 和 `protected` 之间切换。\n\n\n\n\n假设你有一个名为\
  \ `Student` 的类。在这个例子中，以下能力是一个功能完备、正直的 `Student` 所需的所有能力（注意，这里没有 `spendMoney()` 和\
  \ `drinkBeer()` ——这是一个非常理想化的学生）：\n\n- `addCourse(inthours, float grade)` — 添加一门课程\n\
  - `grade()` — 返回当前的平均学分\n- `hours()` — 返回用于毕业的学分数\n\n`Student` 的其余成员可以声明为 `protected`，以防止其他函数的探探行为干扰到\
  \ `Student` 的事务。\n\n```cpp\nclass Student\n{\npublic:\n  // grade - 返回当前的平均学分\n\
  \  float grade()\n  {\n    return gpa;\n  }\n  // hours - 返回学期学分数\n  int hours()\n\
  \  {\n    return semesterHours;\n  }\n  // addCourse - 向学生记录中添加课程\n  float addCourse(int\
  \ hours, float grade);\n\n  // 这里的成员对外部不可访问\nprotected:\n  int semesterHours; //\
  \ 用于毕业的学分\n  float gpa; // 平均学分\n};\n```\n\n现在，成员 `semesterHours` 和 `gpa` 仅对 `Student`\
  \ 的其他成员可见。因此，以下代码无效：\n\n```cpp\nStudent s;\nint main(int argcs, char* pArgs[])\n\
  {\n  // 提高我的分数（不要搞太高；否则，\n  // 人会相信的）\n  s.gpa = 3.5; // <- 产生编译器错误\n  float gpa\
  \ = s.grade(); // <- 这个公共函数读取了\n  // 值的拷贝，但你\n  // 在这里无法修改它\n  return 0;\n}\n```\n\
  \n应用程序尝试更改 `gpa` 值会被标记为编译器错误。\n\n![Tip.eps](img/Tip_fmt.jpeg) 不依赖默认值，而是在类开始处显式指定\
  \ `public` 或 `protected` 被认为是良好的习惯。大多数情况下，人们从 `public` 成员开始，因为它们构成了类的接口。`protected`\
  \ 成员则留到稍后。\n\n![TechnicalStuff.eps](img/TechnicalStuff_fmt.jpeg) 类成员也可以通过声明为 `private`\
  \ 来受保护。在书中，我专门使用 `protected` 关键字。`private` 和 `protected` 之间的区别涉及继承，这将在第 19 章介绍。\n\
  \n# 使用受保护成员的论点\n\n现在你已经更深入地了解了如何在实际类中使用 `protected` 成员，我可以重新阐述使用 `protected` 成员的理由。\n\
  \n## 保护类的内部状态\n\n将 `gpa` 成员设为 `protected` 可以防止应用程序将平均学分设置为任意值。应用程序可以添加课程，但不能更改平均学分。\n\
  \n如果应用程序有直接设置平均学分的合法需求，类可以提供一个该目的的成员函数，如下：\n\n```cpp\nclass Student\n{\npublic:\n\
  \  // 与之前相同\n  float grade()\n  {\n    return gpa;\n  }\n  // 在这里我们允许更改分数\n  float\
  \ grade(float newGPA)\n  {\n    float oldGPA = gpa;\n    // 只有当新值有效时\n    if (newGPA\
  \ > 0 && newGPA <= 4.0)\n    {\n      gpa = newGPA;\n    }\n    return oldGPA;\n\
  \  }\n  // ...其他内容相同，包括数据成员：\nprotected:\n  int semesterHours; // 用于毕业的学分\n  float\
  \ gpa;\n};\n```\n\n成员函数 `grade(float)` 的添加允许应用程序设置 `gpa`。然而，请注意类仍然没有完全放弃控制。应用程序无法将\
  \ `gpa` 设置为任何旧值；只接受合法范围内（从 0 到 4.0）的 `gpa`。\n\n因此，`Student` 类提供了对内部数据成员的访问，但没有放弃其确保类内部状态有效的责任。\n\
  \n### 使用具有有限接口的类\n\n类提供了一个有限的接口。要使用一个类，你只需要知道它的 `public` 成员以及它们的功能和参数。这可以极大地减少你需要掌握和记住以使用该类的事项。\n\
  \n随着条件的改变或故障的发现，你希望能够更改类的内部工作机制。如果你可以隐藏类的内部工作机制，这些细节的更改就不可能需要更改外部应用程序代码。\n\n第二个、可能更重要的原因在于人类能力的局限（我不能代表狗和猫），即无法在任何时刻记住大量事物。使用严格定义的类接口允许程序员忘记其背后的细节。同样，构建类的程序员也不需要以同样的程度专注于每个函数具体是如何被使用的。\n\
  \n### 给非成员函数访问受保护成员的权限\n\n有时，你希望非成员函数能够访问类的 `protected` 成员。你通过使用 `friend` 关键字将函数声明为类的友元来实现这一点。\n\
  \n`friend` 声明出现在包含受保护成员的类中。`friend` 声明类似于原型声明，因为它包含了扩展名称和返回类型。在接下来的示例中，函数 `initialize()`\
  \ 现在可以访问 `Student` 中的任何内容：\n\n```cpp\nclass Student\n{\n  friend void initialize(Student*);\n\
  public:\n  // 与之前相同的公共成员...\nprotected:\n  int semesterHours; // 用于毕业的学分\n  float\
  \ gpa;\n};\n\n// 对应的函数 initialize() 现在可以访问 Student 中的任何内容\nvoid initialize(Student\
  \ *pS)\n{\n  pS->gpa = 0;\n  pS->semesterHours = 0;\n}\n```\n\n一个函数可以被声明为两个类的友元。虽然这很方便，但它倾向于将类绑定在一起。这种类的绑定通常是坏的，因为它使一个类依赖于另一个类。如果两个类自然地属于在一起，那么并不全不好，如下所示：\n\
  \n```cpp\nclass Student; // 前向声明\nclass Teacher\n{\n  friend void registration(Teacher&\
  \ t, Student& s);\npublic:\n  void assignGrades();\n\nprotected:\n  int noStudents;\n\
  \  Student *pList[100];\n};\n\nclass Student\n{\n  friend void registration(Teacher&\
  \ t, Student& s);\npublic:\n  // 相同的公共成员...\nprotected:\n  Teacher *pT;\n  int semesterHours;\
  \ // 用于毕业的学分\n  float gpa;\n};\n\nvoid registration(Teacher& t, Student& s)\n{\n\
  \  // 初始化 Student 对象\n  s.semesterHours = 0;\n  s.gpa = 0;\n  // 如果有空间...\n  if\
  \ (t.noStudents < 100)\n  {\n    // 将其添加到列表末尾\n    t.pList[t.noStudents] = &s;\n\
  \    t.noStudents++;\n  }\n}\n```\n\n![Remember.eps](img/Remember_fmt.jpeg) 示例中的第一行声明了类\
  \ `Student`，但没有它的成员。这被称为前向声明，仅定义类的名称以便其他类（如 `Teacher`）定义指向它的指针。当两个类互相引用时，前向声明是必要的。\n\
  \n一个类的成员函数可以声明为另一个类的友元，如下所示：\n\n```cpp\nclass Teacher\n{\n  // ...其他成员...\npublic:\n\
  \  void assignGrades();\n};\n\nclass Student\n{\n  friend void Teacher::assignGrades();\n\
  public:\n  // 与之前相同的公共成员...\nprotected:\n  int semesterHours; // 用于毕业的学分\n  float\
  \ gpa;\n};\n\nvoid Teacher::assignGrades()\n{\n  // 在这里可以访问 Teacher 的受保护成员\n}\n\
  ```\n\n与非成员示例不同，成员函数 `assignGrades()` 必须在类 `Student` 将其声明为友元之前声明。\n\n整个类可以命名为另一个类的友元。这具有该类每个成员函数都是友元的效果：\n\
  \n```cpp\nclass Student; // 前向声明\nclass Teacher\n{\nprotected:\n  int noStudents;\n\
  \  Student *pList[100];\n\npublic:\n  void assignGrades();\n};\n\nclass Student\n\
  {\n  friend class Teacher; // 将整个类设为友元\npublic:\n  // 与之前相同的公共成员...\nprotected:\n\
  ```\n\n\n\n\n```cpp\nint semesterHours; // 毕业所需的学时\n\nfloat gpa;\n\n};\n```\n\n\
  现在，`Teacher` 的任何成员函数都可以访问 `Student` 的保护成员。将一个类声明为另一个类的友元会将这两个类密不可分地绑定在一起。\n\n# 第\
  \ 15 章：你为什么要把我建立起来，然后又要拆掉我，宝贝？\n\n## 本章内容\n- 创建和销毁对象\n- 声明构造函数和析构函数\n- 调用构造函数和析构函数\n\
  \n程序中的对象就像现实世界中的物体一样被构建和废。如果一个类要对自己的健康负责，它必须对这个过程具有某种控制。幸运的是（我想其中也包含了规划），C++ 提供了恰当的机制。首先，讨论一下创建一个对象的含义。\n\
  \n## 创建对象\n\n有些人在使用 `class` 和 `object` 术语时有点粗心。它们的区别是什么？关系是什么？\n\n我可以创建一个 `Dog`\
  \ 类来描述人类人类好友的相关属性。在我家里，我们有两只狗。因此，我的 `Dog` 类有两个实例：`Trude`（读作“Troo-duh”）和 `Scooter`。（嗯，我想有两个实例——我已经好几天没见过\
  \ Scooter 了。）\n\n![Remember.eps](img/Remember_fmt.jpeg) 类描述一种事物。对象是这些事物中的一个。对象是类的实例。无论我有多少只狗，只有一个\
  \ `Dog` 类。\n\n对象会被创建和销毁，但类仅仅是存在着。我的宠物 `Trude` 和 `Scooter` 来来去去，但 `Dog` 类（暂不谈论进化论）是永恒的。\n\
  \n不同类型的对象在不同的时间被创建。全局对象在程序首次开始执行时创建。局部对象在程序遇到它们的声明时被创建。\n\n![Remember.eps](img/Remember_fmt.jpeg)\
  \ 全局对象是在函数外部声明的对象。局部对象是在函数内部声明的对象，因此它是该函数的局部的。在接的示例中，变量 `me` 是全局的，而变量 `notMe` 是函数\
  \ `pickOne()` 局部的：\n\n```cpp\nint me = 0;\n\nvoid pickOne()\n{\n    int notMe;\n\
  }\n```\n\n![Warning(bomb).eps](img/Warning(bomb)_fmt.jpeg) 根据规则，全局对象在程序开始执行时初始化为全零。声明为函数局部的对象没有特定的初始值。让所有数据成员都处于随机状态对于所有类来说可能并不是有效条件。\n\
  \nC++ 允许类定义一个特殊的成员函数，该函数会在该类的对象创建时被自动调用。这个成员函数称为构造函数，它将对象初始化为有效的初始状态。此外，类可以定义一个析构函数来处理对象的销毁。这两个函数是本章的主题。\n\
  \n## 使用构造函数\n\n构造函数是一个在对象创建时自动调用的成员函数。它的首要任务是将对象初始化为该类的合法初始值。（确保对象状态保持合法的是剩余成员函数的任务。）\n\
  \n构造函数的名称与类名相同，以与类的其他成员区分开来。C++ 的设计者本可以制定一条不同的规则，例如：“构造函数必须命名为 `init()`。” 只要编译器能识别构造函数，这就没有区别。此外，构造函数没有返回值，即使是\
  \ `void` 也没有，因为它只被自动调用——如果构造函数返回了什么，将没有地方放置它。构造函数不能被手动调用。\n\n#### 构建单个对象\n\n有了构造函数，`Student`\
  \ 类看起来如下：\n\n```cpp\n//\n// 构造函数 - 调用构造函数的示例\n//\n#include <cstdio>\n#include <cstdlib>\n\
  #include <iostream>\n\nusing namespace std;\n\nclass Student\n{\npublic:\n    Student()\n\
  \    {\n        cout << “constructing student” << endl;\n        semesterHours =\
  \ 0;\n        gpa = 0.0;\n    }\n    // ...其他公共成员...\n\nprotected:\n    int semesterHours;\n\
  \    float gpa;\n};\n\nint main(int nNumberofArgs, char* pszArgs[])\n{\n    cout\
  \ << “Creating a new Student object” << endl;\n    Student s;\n    cout << “Creating\
  \ a new object off the heap” << endl;\n    Student* pS = new Student;\n    // 在终止程序前等待用户准备绪\n\
  \    // 以允许用户看到程序结果\n    system(“PAUSE”);\n    return 0;\n}\n```\n\n在声明 `s` 的点，编译器会插入对构造函数\
  \ `Student::Student()` 的调用。从堆上分配一个新的 `Student` 对象具有相同的效果，正如程序的输出所示：\n\n```\nCreating\
  \ a new Student object\nconstructing student\nCreating a new object off the heap\n\
  constructing student\nPress any key to continue . . .\n```\n\n这个简单的构造函数被写成一个内联成员函数。构造函数也可以写为定义函数，如下所示：\n\
  \n```cpp\nclass Student\n{\npublic:\n    Student();\n    // ...其他公共成员...\n\nprotected:\n\
  \    int semesterHours;\n    float gpa;\n};\n\nStudent::Student()\n{\n    cout <<\
  \ “constructing student” << endl;\n    semesterHours = 0;\n    gpa = 0.0;\n}\n```\n\
  \n#### 构建多个对象\n\n数组的每个元素都必须单独构建。例如，下面的 `ConstructArray` 程序通过声明一个单一五元素数组创建了五个 `Student`\
  \ 对象：\n\n```cpp\n//\n// ConstructArray - 在对象数组上\n// 调用构造函数的示例\n//\n#include <cstdio>\n\
  #include <cstdlib>\n#include <iostream>\n\nusing namespace std;\n\nclass Student\n\
  {\npublic:\n    Student()\n    {\n        cout << “constructing student” << endl;\n\
  \        semesterHours = 0;\n        gpa = 0.0;\n    }\n    // ...其他公共成员...\n\n\
  protected:\n    int semesterHours;\n    float gpa;\n};\n\nint main(int nNumberofArgs,\
  \ char* pszArgs[])\n{\n    cout << “Creating an array of 5 Student objects” << endl;\n\
  \    Student s[5];\n    // 在终止程序前等待用户准备\n    // 以允许用户看到程序结果\n    system(“PAUSE”);\n\
  \    return 0;\n}\n```\n\n执行程序会产生以下输出：\n\n```\nCreating an array of 5 Student objects\n\
  constructing student\nconstructing student\nconstructing student\nconstructing student\n\
  Press any key to continue . . .\n```\n\n#### 构建复合对象\n\n如果一个类包含一个另一个类对象的数据成员，该类的构造函数也会被自动调用。考虑下面的\
  \ `ConstructMembers` 示例。我添加了输出语句以便你可以看到对象调用的顺序。\n\n```cpp\n//\n// ConstructMembers\
  \ - 类的成员\n// 在类构造函数执行\n// 之前各自被构建\n//\n#include <cstdio>\n#include <cstdlib>\n#include\
  \ <iostream>\n\nusing namespace std;\n\nclass Course\n{\npublic:\n    Course()\n\
  \    {\n        cout << “constructing course” << endl;\n    }\n};\n\nclass Student\n\
  {\npublic:\n    Student()\n    {\n        cout << “constructing student” << endl;\n\
  \        semesterHours = 0;\n        gpa = 0.0;\n    }\nprotected:\n    int semesterHours;\n\
  \    float gpa;\n};\n\nclass Teacher\n{\npublic:\n    Teacher()\n    {\n       \
  \ cout << “constructing teacher” << endl;\n    }\nprotected:\n    Course c;\n};\n\
  \nclass TutorPair\n{\npublic:\n    TutorPair()\n    {\n        cout << “constructing\
  \ tutorpair” << endl;\n        noMeetings = 0;\n    }\nprotected:\n    Student student;\n\
  \    Teacher teacher;\n    int noMeetings;\n};\n\nint main(int nNumberofArgs, char*\
  \ pszArgs[])\n{\n    cout << “Creating TutorPair object” << endl;\n    TutorPair\
  \ tp;\n    // 在终止程序前等待用户准备\n    // 以允许用户看到程序结果\n    system(“PAUSE”);\n    return\
  \ 0;\n}\n```\n\n执行此程序产生以下输出：\n\n```\nCreating TutorPair object\nconstructing student\n\
  constructing course\nconstructing teacher\nconstructing tutorpair\nPress any key\
  \ to continue . . .\n```\n\n在 `main` 中创建对象 `tp` 会自动调用 `TutorPair` 的构造函数。但在控制权传递到\
  \ `TutorPair` 构造函数的体之前，两个成员对象 `student` 和 `teacher` 的构造函数会被调用。\n\n\n\n\n`Student`\
  \ 的构造函数首先被调用，因为它最先声明。然后调用 `Teacher` 的构造函数。\n\n类 `Course` 的成员 `Teacher.c` 作为构建 `Teacher`\
  \ 对象的一部分被构造。`Course` 构造函数首先获得执行。类中的每个对象必须在类构造函数被调用之前构造自己。否则，主构造函数将不知道其数据成员的状态。\n\
  \n在所有成员数据对象构造完成后，控制权返回到大括号，允许 `TutorPair` 的构造函数构造对象的剩余部分。\n\n## 析构函数析\n\n正如对象被创建一样，它们也会被销毁（灰飞烟灭，尘归尘）。如果一个类有一个构造函数来设置设置，它也应该有一个特殊的成员函数来拆解对象。这个成员函数被称为析构函数。\n\
  \n## 为什么你需要析构函数\n\n类可能会在构造函数中分配资源；这些资源在对象消失之前需要被释放。例如，如果构造函数打开了一个文件，在离开该类或程序之前需要关闭该文件。或者，如果构造函数从堆上分配内存，则必须在对象消失之前释放这些内存。析构函数允许类自动执行这些清理任务，而不需要依赖应用程序调用适当成员函数。\n\
  \n## 使用析构函数\n\n析构函数的名称与类名相同，但在前面添加了一个波浪号（`~`）。C++ 又在耍聪明了——波浪号是逻辑非运算符的符号。懂了吗？析构函数就是“非构造函数”。真聪明。）像构造函数一样，析构函数没有返回值。例如，添加了析构函数的\
  \ `Student` 类所示：\n\n```cpp\nclass Student\n{\npublic:\nStudent()\n{\nsemesterHours\
  \ = 0;\ngpa = 0.0;\n}\n\n~Student()\n{\n// ...无论这里返回了什么资产...\n}\n\nprotected:\n\
  int semesterHours;\nfloat gpa;\n};\n```\n\n当对象被销毁时（或者在 C++ 术语中，当一个对象被析构时），析构函数会被自动调用。这听起来有点循环（“当对象被析构时调用析构函数”），所以我在此之前一直避免使用这个词。对于非堆内存，你也可以说“当对象超出作用域时”。局部对象在函数返回时超出作用域。全局或静态对象在程序终止时超出作用域。\n\
  \n但是堆内存呢？指针可能会超出作用域，但堆内存不会。根据定义，它是不属于给定函数的内存。在堆外分配的对象在通过 `delete` 命令返回到堆上时会被析构。这在接下来的\
  \ `DestructMembers` 程序中展示了这一点：\n\n```cpp\n//\n// DestructMembers - 此程序同时构造并\n//\
  \ 析构了一组数据成员\n//\n#include <cstdio>\n#include <cstdlib>\n#include <iostream>\n\n\
  using namespace std;\n\nclass Course\n{\npublic:\nCourse() { cout << “constructing\
  \ course” << endl; }\n~Course() { cout << “destructing course” << endl; }\n};\n\n\
  class Student\n{\npublic:\nStudent() { cout << “constructing student” << endl;}\n\
  ~Student(){ cout << “destructing student” << endl; }\nprotected:\nint semesterHours;\n\
  float gpa;\n};\n\nclass Teacher\n{\npublic:\nTeacher()\n{\ncout << “constructing\
  \ teacher” << endl;\npC = new Course;\n}\n~Teacher()\n{\ncout << “destructing teacher”\
  \ << endl;\ndelete pC;\n}\nprotected:\nCourse* pC;\n};\n\nclass TutorPair\n{\npublic:\n\
  TutorPair(){cout << “constructing tutorpair” << endl;}\n~TutorPair(){cout << “destructing\
  \ tutorpair” << endl; }\nprotected:\nStudent student;\nTeacher teacher;\n};\n\n\
  TutorPair* fn()\n{\ncout << “Creating TutorPair object in function fn()”\n<< endl;\n\
  TutorPair tp;\ncout << “Allocating TutorPair off the heap” << endl;\nTutorPair*\
  \ pTP = new TutorPair;\ncout << “Returning from fn()” << endl;\nreturn pTP;\n}\n\
  \nint main(int nNumberofArgs, char* pszArgs[])\n{\n// 调用函数 fn() 然后将返回\n// 堆的 TutorPair\
  \ 对象\nTutorPair* pTPReturned = fn();\ncout << “Return heap object to the heap” <<\
  \ endl;\ndelete pTPReturned;\n// 在用户准备好之前终止程序\n// 以允许用户看到程序结果\nsystem(“PAUSE”);\n\
  return 0;\n}\n```\n\n函数 `main()` 调用了一个函数 `fn()`，该函数定义了对象 `tp` —— 这是为了让你能够在控制退出函数时观察变量超出作用域。`fn()`\
  \ 还分配了堆内存并将其返回给 `main()`，内存在那里被返回到堆。\n\n如果你执行此程序，它将生成以下输出：\n\n```\nCreating TutorPair\
  \ object in function fn()\nconstructing student\nconstructing teacher\nconstructing\
  \ course\nconstructing tutorpair\nAllocating TutorPair off the heap\nconstructing\
  \ student\nconstructing teacher\nconstructing course\nconstructing tutorpair\nReturning\
  \ from fn()\ndestructing tutorpair\ndestructing teacher\ndestructing course\ndestructing\
  \ student\nReturn heap object to the heap\ndestructing tutorpair\ndestructing teacher\n\
  destructing course\ndestructing student\nPress any key to continue . . .\n```\n\n\
  当 `TutorPair` 对象构建时，每个构造函数按顺序被调用，从最小的数据成员开始，一直到 `TutorPair::TutorPair()` 构造函数。\n\
  \n## 第 16 章：构造性参数\n\n### 本章内容\n- 创建带参数的构造函数\n- 构造载构造函数\n- 使用构造函数创建对象\n- 调用成员构造函数\n\
  - 构建和析构的顺序\n\n类代表现实世界中的某种类型的对象。例如，在之前的章节中，我使用 `Student` 类来表示学生的属性。就像学生一样，类也是自主的。\n\
  \n## 为构造函数配备参数\n\n在第 15 章中介绍的默认构造函数并不总是够用的。例如，默认构造函数可以将学生 ID 初始化为 0，以便它不包含随机值；然而，学生\
  \ ID 为 0 可能无效。\n\nC++ 程序员需要一个接受某种类型参数的构造函数，将对象初始化为默认值以外的值。本章将研究带参数的构造函数。\n\n## 使用构造函数\n\
  \nC++ 允许程序员定义带参数的构造函数，如下：\n\n```cpp\nclass Student\n{\npublic:\nStudent(const char\
  \ *pName);\n// ...类继续...\n};\n```\n\n从概念上说，添加参数的想法很简单。构造函数是一个成员函数，成员函数可以有参数。因此，构造函数可以有参数。\n\
  \n但记住，你不像调用普通函数那样调用构造函数。因此，向构造函数传递参数的唯一时刻是创建对象时。例如，以下程序通过调用 `Student(const char*)`\
  \ 构造函数创建了 `Student` 类对象 `s`。当 `main()` 函数返回时，对象 `s` 被析构。\n\n```cpp\n//\n```\n\n\n\
  \n\n```cpp\n// ConstructorWArg - a class may pass along arguments\n// to the members’\
  \ constructors\n\n#include <cstdio>\n#include <cstdlib>\n#include <iostream>\n\n\
  using namespace std;\n\nclass Student\n{\npublic:\n    Student(const char* pName)\n\
  \    {\n        cout << “constructing Student “ << pName << endl;\n        name\
  \ = pName;\n        semesterHours = 0;\n        gpa = 0.0;\n    }\n    // ...other\
  \ public members...\n\nprotected:\n    string name;\n    int semesterHours;\n  \
  \  float gpa;\n};\n\nint main(int argcs, char* pArgs[])\n{\n    // create a student\
  \ locally and one off the heap\n    Student s1(“Chester\");\n    Student* pS2 =\
  \ new Student(“Trude\");\n    // be sure to delete the heap student\n    delete\
  \ pS2;\n    // wait until user is ready before terminating program\n    // to allow\
  \ the user to see the program results\n    system(“PAUSE\");\n    return 0;\n}\n\
  ```\n\n这里的 `Student` 构造函数看起来与第 15 章所示的构造函数相似，除了增加了 `const char*` 参数 `pName`。构造函数将数据成员初始化为它们的空启动值，但数据成员\
  \ `name` 除外，它的初始值来自 `pName`，因为没有名字的 `Student` 对象不是有效的学生。\n\n对象 `s1` 在 `main()` 中创建。传递给构造函数的参数出现在\
  \ `s1` 的声明中，紧挨着对象的名称。因此，在此声明中，学生 `s1` 被赋予名字 `Chester`。\n\n在紧接着的一行，在堆上分配了第二个学生。在这种情况下，构造函数的参数出现在类名旁边。\n\
  \n![Tip.eps](img/Tip_fmt.jpeg) 程序中的第三行可执行代码在退出程序之前将新分配的对象返回堆。这可能并不是必要的；例如，即使你忘记了这样做，Windows\
  \ 或 Unix 会在程序终止时关闭你可能打开任何文件并返回所有堆内存。然而，在完成后删除堆内存是一个良好的习惯。\n\n.Tip.eps 构造函数声明 `Student::Student(const\
  \ char*)` 中的 `const` 是必要的，允许执行如下语句：\n\n```cpp\nStudent s1(“Chester\");\n```\n\n\
  “Chester”的类型是 `const char *`。我不能将指向常量字符字符串的指针传递给声明为 `Student(char*)` 的构造函数。以此方式声明的函数（包括构造函数）可能会尝试修改字符字符串，这并不好。你不能剥离声明中的\
  \ `const` 部分。\n\n然而，你可以添加常量属性，如下所示：\n\n```cpp\nvoid fn(char* pName)\n{\n    // 即使构造函数声明为\
  \ Student(const char*)\n    // 以下也是允许的\n    Student s(pName);\n    // ...执行任何操作...\n\
  }\n```\n\n函数 `fn()` 将一个 `char*` 字符串传递给构造函数，该构造函数承诺将该字符串视为常量。\n\n# 对木工的要求过高：构造函数的重载\n\
  \n我可以在构造函数与本章其他更普通的成员函数之间再做一个类比：构造函数可以重载。\n\n![Remember.eps](img/Remember_fmt.jpeg)\
  \ 函数重载意味着定义两个具有相同短名但参数类型不同的函数。有关函数重载的最新消息，请参阅第 6 章。\n\nC++ 根据对象声明中的参数来选择合适的构造函数。例如，`Student`\
  \ 类可以同时拥有下面代码段所示的所有三个构造函数：\n\n```cpp\n// OverloadConstructor - 通过重载\n// 构造函数为类提供多种\n\
  // 创建对象方式\n\n//\n\n#include <cstdio>\n#include <cstdlib>\n#include <iostream>\n\n\
  using namespace std;\n\nclass Student\n{\npublic:\n    Student()\n    {\n      \
  \  cout << “constructing student No Name” << endl;\n        name = “No Name”;\n\
  \        semesterHours = 0;\n        gpa = 0.0;\n    }\n    Student(const char *pName)\n\
  \    {\n        cout << “constructing student “ << pName << endl;\n        name\
  \ = pName;\n        semesterHours = 0;\n        gpa = 0;\n    }\n    Student(const\
  \ char *pName, int xfrHours, float xfrGPA)\n    {\n        cout << “constructing\
  \ student “ << pName << endl;\n        name = pName;\n        semesterHours = xfrHours;\n\
  \        gpa = xfrGPA;\n    }\nprotected:\n    string name;\n    int semesterHours;\n\
  \    float gpa;\n};\n\nint main(int argcs, char* pArgs[])\n{\n    // 以下调用了三个不同的构造函数\n\
  \    Student noName;\n    Student freshman(“Marian Haste”);\n    Student xferStudent(“Pikumup\
  \ Andropov”, 80, 2.5);\n    // 等待用户准备好后再终止程序\n    // 让用户看到程序结果\n    system(“PAUSE\"\
  );\n    return 0;\n}\n```\n\n因为对象 `noName` 在没有参数的情况下出现，所以它是使用构造函数 `Student::Student()`\
  \ 构建的。这种构造函数被称为默认构造函数。`freshMan` 是使用仅有一个 `const char*` 参数的构造函数构建的，而 `xferStudent`\
  \ 使用了带有三个参数的构造函数。\n\n注意这三个构造函数的相似之处。如果只提供名字，学期学数和 GPA 默认为 0。否则，这两个构造函数之间没有区别。如果你能直接为这两个参数指定默认值，你就不需要这两个构造函数了。\n\
  \nC++ 允许你在声明中为函数参数指定默认值，以便在参数不存在时使用。现在，所有三个对象都使用同一个构造函数构建；为不存在的参数提供了默认值。\n\n```cpp\n\
  // ConstructorWDefaults - 多个构造函数可以\n// 与默认参数的定义结合使用\n\n#include <cstdio>\n#include\
  \ <cstdlib>\n#include <iostream>\n\nusing namespace std;\n\nclass Student\n{\npublic:\n\
  \    Student(const char *pName = “No Name”,\n            int xfrHours = 0,\n   \
  \         float xfrGPA = 0.0) \n    {\n        cout << “constructing student “ <<\
  \ pName << endl;\n        name = pName;\n        semesterHours = xfrHours;\n   \
  \     gpa = xfrGPA;\n    }\nprotected:\n    string name;\n    int semesterHours;\n\
  \    float gpa;\n};\n\nint main(int argcs, char* pArgs[])\n{\n    // 以下调用了三个不同的构造函数\n\
  \    Student noName;\n    Student freshman(“Marian Haste”);\n    Student xferStudent(“Pikumup\
  \ Andropov”, 80, 2.5);\n    // 等待用户准备好后再终止程序\n    // 让用户看到程序结果\n    system(“PAUSE\"\
  );\n    return 0;\n}\n```\n\n# 默认构造函数的默认化\n\n对于 C++ 而言，每个类都必须有一个构造函数；否则，你就无法创建该类的对象。如果你没有为类提供构造函数，C++\
  \ 应该生成一个错误，但它并没有这样做。为了与对构造函数一无所知的现有 C 代码兼容，C++ 自动提供一个默认构造函数（某种默认构造函数），它将每个数据成员设置为其类型的默认值：`int`\
  \ 为 0，`float` 为 0.0，以此此类推。\n\n如果你为你的类定义了构造函数，C++ 就不会自动提供默认构造函数了。（由于你已经表明了这不是 C 程序，C++\
  \ 并不有义务做额外工作来确保兼容性。）\n\n以下代码片段有助于说明这一点。这样做是合法的：\n\n```cpp\nclass Student\n{\n  \
  \  string name;\n};\n\nint main(int argcs, char* pArgs[])\n{\n    Student noName;\n\
  \    return 0;\n}\n```\n\n自动提供的默认构造函数调用了默认字符串构造函数来创建一个空名字对象。以下代码片段无法编译：\n\n```cpp\n\
  class Student\n{\npublic:\n    Student(const char *pName) {name = pName;}\n    string\
  \ name;\n};\n\nint main(int argcs, char* pArgs[])\n{\n    Student noName; // 编译\n\
  \    return 0;\n}\n```\n\n看似无害的添加 `Student(const char*)` 构造函数阻止了 C++ 自动提供构建对象 `noName`\
  \ 的 `Student()` 构造函数。\n\n![c++'09.eps](img/c%2B%2B'09_fmt.jpeg) C++ ’09 标准允许通过新的\
  \ `default` 关键字“找回默认构造函数”，如下：\n\n```cpp\nclass Student\n{\n```\n\n\n\n\n\n```cpp\n\
  public:\n    Student(const char *pName) { name = pName; }\n    Student() = default;\n\
  \    string name;\n};\n\nint main(int argcs, char* pArgs[])\n{\n    Student noName;\n\
  \    return 0;\n}\n```\n\n`default` 关键字的作用相当于说：“我知道我定义了一个构造函数，但我仍然想找回我的自动默认构造函数。”\n\
  \n'09 标准还允许使用 `new` 关键字 `delete` 来显式移除像默认构造函数这样的默认方法：\n\n```cpp\nclass Student\n\
  {\npublic:\n    Student() = delete; // 移除默认构造函数\n    string name;\n};\n```\n\n当这种方法应用于除默认构造函数以外的自动方法时，它会更有意义，正如你将在书中后部分看到的那。\n\
  \n## 配置类成员\n\n在之前的示例中，所有数据成员都是简单类型，例如 `int` 和 `float`。对于简单类型，在构造函数内部为变量赋值就足够了。然而，在初始化某些类型的数据成员时，问题就会出现。\n\
  \n### 构造复杂数据成员\n\n类的成员面临与任何其他变量相同的问题。让一个 `Student` 对象拥有默认 ID 为 `0` 是没有意义的。即使该对象是另一个类的成员也是如此。考虑以下示例，它创建了一个新类\
  \ `StudentId` 来管理学生标识码，而不是依赖于普通的整数变量：\n\n```cpp\n//\n// ConstructingMembers - 类可以向成员构造函数\n\
  // 传递参数\n//\n#include <cstdio>\n#include <cstdlib>\n#include <iostream>\n\nusing\
  \ namespace std;\n\nint nextStudentId = 1000; // 第一个有效的学生 ID\nclass StudentId\n\
  {\npublic:\n    // 默认构造函数按顺序分配 id\n    StudentId()\n    {\n        value = nextStudentId++;\n\
  \        cout << “take next student id “ << value << endl;\n    }\n    // int 构造函数允许用户分配\
  \ id\n    StudentId(int id)\n    {\n        value = id;\n        cout << “assign\
  \ student id “ << value << endl;\n    }\nprotected:\n    int value;\n};\n\nclass\
  \ Student\n{\npublic:\n    Student(const char* pName)\n    {\n        name = pName;\n\
  \    }\n    // ...其他公共成员...\nprotected:\n    string name;\n    StudentId id;\n};\n\
  \nint main(int argcs, char* pArgs[])\n{\n    // 创建两个学生\n    Student s1(“Chester”);\n\
  \    Student s2(“Trude”);\n    // 等待用户准备好后再终止程序\n    // 让用户能够看到程序结果\n    system(“PAUSE”);\n\
  \    return 0;\n}\n```\n\n在构造学生被对象时，每个学生都会被分配一个学生 ID。在这个示例中，`StudentId` 的默认构造函数使用全局变量\
  \ `nextStudentId` 来跟踪并按顺序分配 ID。\n\n`Student` 类调用了两个学生 `s1` 和 `s2` 的默认构造函数。程序的输出显示此工作正常：\n\
  \n```\ntake next student id 1000\nconstructing Student Chester\ntake next student\
  \ id 1001\nconstructing Student Trude\nPress any key to continue . . .\n```\n\n\
  注意，来自 `StudentId` 构造函数的输出出现在 `Student` 构造函数的输出之前。这意味着在 `Student` 构造函数开始之前，`StudentId`\
  \ 构造函数就已经被了。\n\n如果程序员没有提供构造函数，C++ 默认构造函数会自动调用数据成员的默认构造函数。在销毁时也是如此。类的析构函数会自动调用具有析构函数的数据成员的析构函数。C++\
  \ 提供的析构函数执行同样的操作。\n\n好了，这对默认构造函数来说这些都很棒。但如果你想调用除默认构造以外的构造函数怎么办？你把对象放在哪里？`StudentId`\
  \ 类提供了第二个构造函数，允许将学生 ID 分配给任意值。问题是，我们如何调用它呢？\n\n让我先给你们展示什么是行不通的。考虑以下代码段（此处包含了相关部分——整个程序\
  \ `ConstructSeparateID` 在随书附的 CD-ROM 中）：\n\n```cpp\nclass Student\n{\npublic:\n\
  \    Student(const char *pName, int ssId)\n    {\n        cout << “constructing\
  \ student “ << pName << endl;\n        name = pName;\n        // 孩子们，不要在家里尝试这个。这行不通\n\
  \        StudentId id(ssId); // 构造学生 ID\n    }\nprotected:\n    string name;\n \
  \   StudentId id;\n};\n\nint main(int argcs, char* pArgs[])\n{\n    Student s(“Chester”,\
  \ 1234);\n    cout << “This message from main” << endl;\n    // 等待用户准备好后再终止程序\n\
  \    // 让用户能够看到程序结果\n    system(“PAUSE”);\n    return 0;\n}\n```\n\n在 `Student`\
  \ 的构造函数内部，程序员（也就是我）（聪明地）尝试构造一个命名为 `id` 的 `StudentId` 对象。（我还为 `StudentId` 添加了一个析构函数，它的唯一作用就是输出正在被析构的对象的\
  \ ID。）\n\n如果你看这个程序的输出，就能发现问题所在了：\n\n```\ntake next student id 1000\nconstructing\
  \ student Chester\nassign student id 1234\ndestructing 1234\n```\n\n在 `Student`\
  \ 构造函数执行期间，`StudentId` 成员已经先构造了。当 `Student` 构造函数执行完毕时，该成员就会被析构。\n\n```\ntake next\
  \ student id 1000\nconstructing student Chester\nassign student id 1234\ndestructing\
  \ 1234\nThis message from main\nPress any key to continue . . .\n```\n\n在 `Student`\
  \ 构造函数执行期间，`StudentId` 成员已经先构造了。当 `Student` 构造函数执行完毕时，该成员就会被析构。\n\n这种行为的解释很清楚。在\
  \ `Student` 构造函数体执行之前，`id` 成员已经存在了。\n\n我们需要一种不同的机制来表示“构造现有的成员，而不是创建一个新的。”这种机制需要出现在函数参数列表之后、大括号之前。C++\
  \ 提供了这种构造方式，所示（摘自 `ConstructDataMembers` 程序）：\n\n```cpp\nclass Student\n{\npublic:\n\
  \    Student(const char *pName, int ssId)\n    : name(pName), id(ssId)\n    {\n\
  \        cout << “constructing student “ << pName << endl;\n    }\nprotected:\n\
  \    string name;\n    StudentId id;\n};\n```\n\n特别注意构造函数的第一行。这里的 `:` 意味着后面是对当前类成员构造函数的调用。对于\
  \ C++ 编译器来说，这一行的意思是：“使用参数 `pName` 和 `ssId` 分别构造成员 `name` 和 `id`。”未以这种方式调用的数据成员将使用它们的默认构造函数构造。\n\
  \n这个新程序产生了预期的结果：\n\n```\nassign student id 1234\nconstructing student Chester\n\
  This message from main\nPress any key to continue . . .\n\n### 构造常量数据成员\n\n初始化声明为\
  \ `const` 的成员时也会出现问题。记住 `const` 变量在声明时初始化，之后无法更改。构造函数如何给 `const` 数据成员赋值呢？通过以下成员初始化语法解决了这个问题：\n\
  \n```cpp\nclass Mammal\n{\npublic:\n    Mammal(int nof) : numberOfFeet(nof) {}\n\
  protected:\n    const int numberOfFeet;\n};\n```\n\n表面上，一个特定的 `Mammal` 拥有固定数量的脚（除非截肢）。脚的数量可以、也应该声明为\
  \ `const`。这种声明在对象创建时为变量 `numberOfFeet` 赋值。\n\n\n\n\n\n## 重构构造顺序\n\n当存在多个带有构造函数的对象时，程序员通常并不关心这些东西构建的顺序。然而，如果一个或多个构造函数具有副作用，那么顺序就会产生影响。\n\
  \n构造顺序的规则如下：\n\n-   局部对象和静态对象按照其声明被调用的顺序进行构造。\n-   静态对象仅构造一次。\n-   所有全局对象在 `main()`\
  \ 执行之前完成构造。\n-   全局对象的构造没有特定的顺序。\n-   成员变量按照它们在类中声明的顺序进行构造。\n-   对象的析构顺序与它们的构造顺序相反。\n\
  \n![Remember.eps](img/Remember_fmt.jpeg) 静态变量是局部于函数但在一次函数调用到下一次调用之间保留其值的变量。全局变量是在函数外部声明的变量。\n\
  \n现在我们将逐一考虑上述规则。\n\n## 局部对象按顺序构造\n\n局部对象按照程序遇到其声明的顺序进行构造。通常情况下，这与对象在函数中出现的顺序相同，除非函数跳转到了特定的声明处。（顺便说一句，跳转过声明是件坏事。它会混淆读者和编译器。）\n\
  \n## 静态对象仅构造一次\n\n静态对象与局部变量类似，不同在于它们只构造一次。C++ 会等到控制流第一次通过 `static` 声明时才构造对象。考虑以下简单的\
  \ `ConstructStatic` 程序：\n\n```cpp\n//\n// ConstructStatic - 演示静态对象仅被\n//构造一次\n//\n\
  #include <cstdio>\n#include <cstdlib>\n#include <iostream>\n\nusing namespace std;\n\
  \nclass DoNothing\n{\npublic:\n    DoNothing(int initial) : nValue(initial)\n  \
  \  {\n        cout << \"DoNothing constructed with a value of \"\n        << initial\n\
  \        << endl;\n    }\n    ~DoNothing()\n    {\n        cout << \"DoNothing object\
  \ destructed\" << endl;\n    }\n    int nValue;\n};\n\nvoid fn(int i)\n{\n    cout\
  \ << \"Function fn passed a value of \" << i << endl;\n    static DoNothing dn(i);\n\
  }\n\nint main(int argcs, char* pArgs[])\n{\n    fn(10);\n    fn(20);\n    system(\"\
  PAUSE\");\n    return 0;\n}\n```\n\n执行此程序会产生以下结果：\n\n```\nFunction fn passed a value\
  \ of 10\nDoNothing constructed with a value of 10\nFunction fn passed a value of\
  \ 20\nPress any key to continue . . .\nDoNothing object destructed\n```\n\n注意，来自函数\
  \ `fn()` 的消息出现了两次，但 `DoNothing` 构造函数的输出只在第一次调用 `fn()` 时出现。这表明对象在第一次调用 `fn()` 时被构造，此后不再构造。还要注意，直到程序从\
  \ `main()` 返回并作为程序关闭过程的一部分，析构函数才会被调用。\n\n## 所有全局对象在 main() 之前构造\n\n所有全局变量在程序启动时立即进入范围。因此，所有全局对象在控制权交给\
  \ `main()` 之前就已经完成了构造。\n\n![Warning(bomb).eps](img/Warning(bomb)_fmt.jpeg) 初始化全局变量会导致真正的调试难题。某些调试器尝试在程序加载后并在将控制权交给用户之前直接执行到\
  \ `main()`。这可能会导致问题，因为在你夺取程序控制权时，所有全局对象的构造函数代码已经执行完毕。如果这些构造函数中的某一个存在致命错误，你甚至没有机会发现问题。在这种情况下，程序在启动之前看起来崩溃了！\n\
  \n![TechnicalStuff.eps](img/TechnicalStuff_fmt.jpeg) 我发现检测此类问题的最佳方法是在你稍加怀疑的构造函数以及\
  \ `main()` 中的第一条语句中设置断点。一旦你启动程序，就会会在每个声明的全局对象处遇到断点。在每个断点处按“继续”，直到程序崩溃——现在你知道你多按了一次“继续”。重启程序并重复过程，但在导致程序崩溃的构造函数处停止。现在你可以单步执行构造函数，直到找到问题。如果你一直到了\
  \ `main()` 中的断点，说明程序在构造全局对象时没有崩溃。\n\n## 全局对象的构造没有特定顺序\n\n确定局部对象的构造顺序很容易。顺序由控制流隐含。而对于全局变量，没有这种控制流来提供顺序。所有全局变量同时进入范围——记得吗？好了，你可能会说，为什么编译器不能直接从文件开头开始按顺序处理全局对象列表呢？\n\
  \n这对于单个文件来说没问题（我推测大多数编译器都是做的）。现实世界中的大多数程序由多个单独编译然后进行链接的文件组成。因为编译器无法控制这些文件链接的顺序，所以它无法影响全局对象在文件之间构造的顺序。\n\
  \n大多数时候，全局构造的顺序是非常无关紧要的。然而，偶尔，全局变量会产生极难追踪的 bug。（这种情况发生的频率足以让我们在书中提一下。）\n\n考虑以下示例：\n\
  \n```cpp\nclass Student\n{\npublic:\n    Student (int id) : studentId(id) {}\n \
  \   const int studentId;\n};\n\nclass Tutor\n{\npublic:\n    Tutor(Student& s) :\
  \ tutoredId(s.studentId) {}\n    int tutoredId;\n};\n\n// 设置一个学生\nStudent randy(1234);\n\
  // 为该学生分配一个导师\nTutor jenny(randy);\n```\n\n在这里，`Student` 的构造函数分配了一个学生 ID。`Tutor`\
  \ 的构造函数记录了助学生的 ID 以提供帮助。程序声明了一个学生 `randy`，然后为该学生分配了一个导师 `jenny`。\n\n问题在于，程序隐式地假设\
  \ `randy` 在 `jenny` 之前构造。如果情况反过来，那么 `jenny` 构造时使用的内存块尚未被转换为 `Student` 对象，因此其学生 ID\
  \ 是垃圾值。\n\n![Tip.eps](img/Tip_fmt.jpeg) 上面的例子并不难理解，而且显得稍为刻意。尽管如此，源于全局对象按无特定顺序构造产生的问题可能会以微妙的方式出现。为了避免这个问题，不要让其中一个全局对象的构造函数引用另一个全局对象的内容。\n\
  \n## 成员按照其声明的顺序构造\n\n类的成员按照它们在类内部声明的顺序进行构造。这并不像听起来那么而易见。考虑以下示例：\n\n```cpp\nclass\
  \ Student\n{\npublic:\n    Student (int id, int age) : nAge(age), nId(id){}\n  \
  \  const int nId;\n    const int nAge;\n    double dAverage = 0.0;\n};\n```\n\n\
  在这个例子中，`nId` 在 `nAge` 之前构造，尽管 `nId` 在构造函数的初始化列表中出现在第二个，但因为它在类定义中出现在 `nAge` 之前。数据成员\
  \ `dAverage` 因为同样的原因最后构造。你唯一可能检测到构造顺序差异的情况，是两个数据成员都是某个类的实例，而该类有一个具有某种相互副作用的构造函数。\n\
  \n![Tip.eps](img/Tip_fmt.jpeg) 如果 `Code::Blocks/gcc` 编译器发现你声明数据成员的顺序与它们的构造顺序不同，将生成警告信息。\n\
  \n## 析构函数按构造函数的反方向析构\n\n最后，无论构造函数以什么顺序启动，你都可以确保析构函数按相反的顺序被调用。（知道 C++ 中至少有一条规则没有如果没有、并且或者但是，是件好事。）\n\
  \n# 构造函数作为一种转换的形式\n\n\n\n\nC++ 将带有单个参数的构造函数视为从一种类型转换为另一种类型的方法。考虑一个用于表示复数的自定义类型 `Complex`。在不涉及过多细节的情况下（对我而言，而非对你而言），实数与复数之间存在一种自然转换，就像下面的示例中整数到实数的转换一样：\n\
  \n```cpp\ndouble d = 1; // 这是合法的\nComplex c = d; // 这也应该被允许\n```\n\n事实上，C++ 会寻找方法来尝试理解类似这样的语句。如果\
  \ `Complex` 类有一个以 `double` 为参数的构造函数，C++ 将使用该构造函数作为一种转换形式，就像前面的语句被写成如下所示：\n\n```cpp\n\
  double d = 1;\nComplex c(d);\n```\n\n某些由构造函数引入的转换并没有意义。例如，你可能并不希望 C++ 仅仅因为存在一个 `Student(int)`\
  \ 构造函数就将整数转换为 `Student` 对象。当 C++ 试图解释简单的编码错误时，意想不到的转换可能会导致奇怪的运行时错误。\n\n程序员可以使用 `explicit`\
  \ 关键字来避免创建意料之外且非预期的转换路径。标记为 `explicit` 的构造函数不能作为隐式转换路径：\n\n```cpp\nclass Student\n\
  {\npublic:\n// 以下的“无名”构造函数不能用\n// 从 int 到 Student 的隐式转换路径\n    explicit Student(int\
  \ nStudentID);\n};\n\nStudent s = 1; // 产生编译器错误\nStudent t(123456); // 这仍然被允许\n\
  ```\n\n`s` 的声明并没有隐式调用 `Student(int)` 构造函数，因为它被标记为“仅可显式调用”。显式调用构造函数创建对象 `t` 仍然是可以的。\n\
  \n![onthecd.eps](img/onthecd_fmt.jpeg) 光盘中包含一个用于演示这一原理的完整 TypeConversion 程序。\n\n\
  # 第 17 章：拷贝拷贝拷贝构造函数\n\n## 本章内容\n- 介绍拷贝构造函数\n- 创建副本\n- 让系统自动为你创建副本\n- 创建浅拷贝与深拷贝\n\
  - 避免所有这些拷贝\n\n构造函数是一个特殊的函数，C++ 在创建对象时会自动调用它，以允许对象进行初始化。第 15 章引入了构造函数的概念，而第 16 章描述了其他类型的构造函数。本章将研究构造函数的一种特殊变体，即拷贝构造函数。\n\
  \n## 拷贝对象\n拷贝构造函数是 C++ 用于创建对象副本的构造函数。它的名称为 `X::X(X&)`，其中 `X` 是类的名称。也就是说，它是类 `X`\
  \ 的构造函数，其参数是指向类 `X` 对象的引用。现在，我知道这听起来非常没用，但请给我一个机会解释一下为什么 C++ 需要这样一个“猛兽”。\n\n## 为什么你需要拷贝构造函数\n\
  想一想当你调用类似下面的函数时会发生什么：\n\n```cpp\nvoid fn(Student fs)\n{\n    // ...相同的情景；不同的参数...\n\
  }\n\nint main(int argcs, char* pArgs[])\n{\n    Student ms;\n    fn(ms);\n    return\
  \ 0;\n}\n```\n\n在调用 `fn()` 时，C++ 传递的是对象 `ms` 的副本，而不是对象本身。\n\n现在考虑创建一个对象副本意味着什么。首先，它需要一个构造函数来创建一个对象，即使是现有对象的副本。C++\
  \ 可以创建一个默认拷贝构造函数，逐字节逐字节地将现有对象拷贝到新对象中。这是 `C` 等旧版语言的做法。但如果类不想要对象的简单拷贝呢？如果需要其他东西呢？（暂时忽略“为什么？”）。该类需要能够精确地指定如何创建该拷贝。\n\
  \n因此，在前面的示例中，C++ 使用拷贝构造函数在调用函数 `fn()` 期间在栈上创建了对象 `ms` 的副本。这个特定的拷贝构造函数将是 `Student::Student(Student&)`\
  \ —— 快速说三次。\n\n## 使用拷贝构造函数\n理解拷贝构造函数如何工作的最好方法是看它的实际运行。考虑以下 `CopyConstructor` 程序：\n\
  \n```cpp\n//\n// CopyConstructor - 演示拷贝构造函数\n//\n#include <cstdio>\n#include <cstdlib>\n\
  #include <iostream>\n\nusing namespace std;\n\nclass Student\n{\npublic:\n// 常规构造函数\n\
  \    Student(const char *pName = “no name”, int ssId = 0)\n    : name(pName), id(ssId)\n\
  \    {\n        cout << “Constructed “ << name << endl;\n    }\n// 拷贝构造函数\n    Student(Student&\
  \ s)\n    : name(“Copy of “ + s.name), id(s.id)\n    {\n        cout << “Constructed\
  \ “ << name << endl;\n    }\n    ~Student()\n    {\n        cout << “Destructing\
  \ “ << name << endl;\n    }\nprotected:\n    string name;\n    int id;\n};\n\n//\
  \ fn - 按值接收其参数\nvoid fn(Student copy)\n{\n    cout << “In function fn()” << endl;\n\
  }\n\nint main(int nNumberofArgs, char* pszArgs[])\n{\n    Student chester(“Chester”,\
  \ 1234);\n    cout << “Calling fn()” << endl;\n    fn(chester);\n    cout << “Back\
  \ in main()” << endl;\n    // 等待用户准备好后再终止程序\n    // 以允许用户看到程序结果\n    system(“PAUSE”);\n\
  \    return 0;\n}\n```\n\n执行此程序的输出如下：\n```\nConstructed Chester\nCalling fn()\n\
  Constructed Copy of Chester\nIn function fn()\nDestructing Copy of Chester\nBack\
  \ in main()\nPress any key to continue . . .\n```\n\n普通的 `Student` 构造函数根据 `main()`\
  \ 第一行关于创建 `chester` 的声明生成第一条消息。`main()` 在调用 `fn()` 之前输出了 Calling... 消息。作为函数调用过程的一部分，C++\
  \ 调用拷贝构造函数来创建 `chester` 的副本以传递给 `fn()`。拷贝构造函数输出了一条消息。函数 `fn()` 输出了 In function...\
  \ 消息。拷贝的 Student 对象 `copy` 在从 `fn()` 返回时析构。原始对象 `chester` 在 `main()` 结束时被析构。\n\n\
  ![Tip.eps](img/Tip_fmt.jpeg) 赋值运算符定义在 `string` 类上，用于连接两个字符串或一个字符串与一个空终止字符字符串。你将在第\
  \ 22 章学习如何在自定义类上定义运算符。\n\n拷贝构造函数将提供的对象的名称加上“Copy of”前缀到自己的名称字段中。然后将 `s` 的 `id` 字段拷贝到当前对象的\
  \ `id` 字段。构造函数在返回之前输出生成的名称字段。\n\n输出的第一行显示 `chester` 对象被创建。第三行演示了调用 `fn()` 时通过拷贝构造函数生成的\
  \ `Student`。`fn()` 函数除了输出消息外没有别的。拷贝在返回时析构，产生了 destructing... 消息。\n\n### 自动拷贝构造函数\n\
  和默认构造函数一样，拷贝构造函数非常重要；重要到 C++ 认为没有类应该没有它。如果你没有提供自己的拷贝构造函数，C++ 会为你生成一个。（这与 C++ 为其提供的构造函数不同。）\n\
  \nC++ 提供的拷贝构造函数对每个数据成员进行成员级拷贝。早期版本 C++ 的拷贝构造函数执行的是位拷贝。区别在于，成员级拷贝会调用类成员可能存在的所有拷贝构造函数，而位拷贝不会。你可以在下面的\
  \ `DefaultCopyConstructor` 示例程序看到这种差异的影响。（为了节省空间，我省略了 `Student` 类定义 —— 它与 `CopyConstructor`\
  \ 程序中的相同。整个 `DefaultCopyConstructor` 程序在附的光盘上。）\n\n```cpp\nclass Tutor\n{\npublic:\n\
  \    Tutor(Student& s)\n    : student(s), id(0)\n    {\n        cout << “Constructing\
  \ Tutor object” << endl;\n    }\nprotected:\n    Student student;\n    int id;\n\
  };\n\nvoid fn(Tutor tutor)\n{\n    cout << “In function fn()” << endl;\n}\n\nint\
  \ main(int argcs, char* pArgs[])\n{\n    Student chester(“Chester”);\n    Tutor\
  \ tutor(chester);\n    cout << “Calling fn()” << endl;\n    fn(tutor);\n    cout\
  \ << “Back in main()” << endl;\n}\n```\n\n\n\n\n```cpp\n// wait until user is ready\
  \ before terminating program\n\n// to allow the user to see the program results\n\
  \nsystem(“PAUSE”);\n\nreturn 0;\n\n}\n```\n\n执行此程序将产生以下输出：\n\nConstructed Chester\n\
  Constructed Copy of Chester\nConstructing Tutor object\nCalling fn()\nConstructed\
  \ Copy of Copy of Chester\nIn function fn()\nDestructing Copy of Copy of Chester\n\
  Back in main()\nPress any key to continue . . .\n\n构造 `chester` 对象会生成来自“plain Jane”构造函数的第一条输出消息。`tutor`\
  \ 对象的构造函数调用了 `Student` 拷贝构造函数来生成它自己的学生数据成员，然后输出自己的消息。这构成了接下来的两行输出。\n\n随后，程序将 `Tutor`\
  \ 对象的副本传递给函数 `fn()`。由于 `Tutor` 类没有定义拷贝构造函数，程序将调用默认拷贝构造函数创建一个副本并传递给 `fn()`。\n\n默认的\
  \ `Tutor` 拷贝构造函数会调用每个数据成员的拷贝构造函数。`int` 的拷贝构造函数除了复制值之外不做任何其他操作。你已经见过 `Student` 拷贝构造函数是如何工作的了。这就是生成\
  \ `Constructed Copy of Copy of Chester` 消息的原因。在函数 `fn()` 返回时，该副本的析构函数会被调用。\n\n##\
  \ 创建浅拷贝与深拷贝\n\n在拷贝构造函数中，执行逐成员拷贝似乎是理所当然的。除了能够在学生名字前面添加像“Copy of ”这种愚蠢的东西之外，你还会想要做逐成员拷贝以外的事情吗？\n\
  \n考虑如果构造函数分配了资源（例如堆内存）的情况。如果拷贝构造函数只是复制该资源而不分配自己的资源，你就会陷入一个棘手的局面：两个对象都认为自己独占访问同一个资源。当两个对象的析构函数都被调用且它们都尝试归还同一个资源时，情况会变得糟糕。为了更具体，请考虑以下示例类：\n\
  \n```cpp\n//\n\n// ShallowCopy - 执行逐字节（浅层）拷贝\n// 当类持有资源时是不正确的\n\n//\n\n#include\
  \ <cstdio>\n#include <cstdlib>\n#include <iostream>\n\nusing namespace std;\n\n\
  class Person\n{\npublic:\n\n    Person(const char *pN)\n    {\n        cout << “Constructing\
  \ “ << pN << endl;\n        pName = new string(pN);\n    }\n\n    ~Person()\n  \
  \  {\n        cout << “Destructing “ << pName\n        << “ (“ << *pName << “)”\
  \ << endl;\n        *pName = “already destructed memory”;\n        // delete pName;\n\
  \    }\n\nprotected:\n    string *pName;\n};\n\nvoid fn()\n{\n    // create a new\
  \ object\n    Person p1(“This_is_a_very_long_name”);\n    // copy the contents of\
  \ p1 into p2\n    Person p2(p1);\n}\n\nint main(int argcs, char* pArgs[])\n{\n \
  \   cout << “Calling fn()” << endl;\n    fn();\n    cout << “Back in main()” <<\
  \ endl;\n    // wait until user is ready before terminating program\n    // to allow\
  \ the user to see the program results\n    system(“PAUSE”);\n    return 0;\n}\n\
  ```\n\n此程序产生以下输出：\n\nCalling fn()\nConstructing This_is_a_very_long_name\nDestructing\
  \ 0x360f78 (This_is_a_very_long_name)\nDestructing 0x360f78 (already destructed\
  \ memory)\nBack in main()\nPress any key to continue . . .\n\n`Person` 的构造函数在堆上分配内存来存储人的姓名。析构函数通常会使用\
  \ `delete` 关键字将此内存返回堆；然而在这种情况下，我将 `delete` 的调用替换为将名字替换为消息的语句。主程序调用函数 `fn()`，它创建了一个人\
  \ `p1`，然后创建了该人的副本 `p2`。当程序从函数返回时，两个对象都会被自动析构。\n\n当执行此程序时，只出现了一条构造函数输出消息。这并不太意外，因为用于构建\
  \ `p2` 的 C++ 提供的拷贝构造函数没有输出。然而，`Person` 析构函数被调用了两次，因为 `p1` 和 `p2` 都超出了作用域。第一个析构函数输出了预期的\
  \ `This_is_a_very_long_name`。第二个析构函数指示内存已经被删除。同时注意，两个对象的内存块地址是相同的（`0x360F78`）。\n\
  \n![Warning(bomb).eps](img/Warning(bomb)_fmt.jpeg) 如果程序真的删除了名字，程序在第二次 `delete` 之后将变得不稳定，甚至可能在不崩溃的情况下无法完成。\n\
  \n这个问题在图 17-1 中以图形形式显示。对象 `p1` 被拷贝到新对象 `p2` 中，但资源没有拷贝。因此，`p1` 和 `p2` 最终指向相同的资源（在这种情况下是堆内存）。这被称为浅拷贝，因为它仅仅“触及表面”，复制了成员本身。\n\
  \n**图 17-1:** 从 `p1` 拷贝到 `p2` 的浅拷贝。\n\n![317266-fg1701.eps](img/317266-fg1701_fmt.jpeg)\n\
  \n问题的解决方案在图 17-2 中直视觉化展示。该图表示为新对象分配了自己的资源的拷贝构造函数。\n\n**图 17-2:** 从 `p1` 拷贝到 `p2`\
  \ 的深拷贝。\n\n![317266-fg1702.eps](img/317266-fg1702_fmt.jpeg)\n\n以下是适用于 `Person` 的适当拷贝构造函数，这是你目前为止过的类型。\n\
  \n```cpp\nclass Person\n{\npublic:\n    Person(const char *pN)\n    {\n        cout\
  \ << “Constructing “ << pN << endl;\n        pName = new string(pN);\n    }\n\n\
  \    Person(Person& person)\n    {\n        cout << “Copying “ << *person.pName\
  \ << endl;\n        pName = new string(*person.pName);\n    }\n\n    ~Person()\n\
  \    {\n        cout << “Destructing “ << pName\n        << “ (“ << *pName << “)”\
  \ << endl;\n        *pName = “already destructed memory”;\n    }\n\n\nprotected:\n\
  \    string *pName;\n};\n```\n\n在这里你看到拷贝构造函数为名字分配了自己的内存块，然后复制了所有资源。此输出如下：\n\nCalling\
  \ fn()\nConstructing This_is_a_very_long_name\nCopying This_is_a_very_long_name\n\
  Destructing 0x27fb0 (This_is_a_very_long_name)\nDestructing 0x27f60 (already destructed\
  \ memory)\nBack in main()\nPress any key to continue . . .\n\n`Person` 的析构函数指示 `p1`\
  \ 和 `p2` 的指针不再指向内存块。\n\n## 临时变量的问题\n\n按值传递参数是拷贝构造函数最明显但不是例子。C++ 在其他情况下也会创建对象的副本。\n\
  \n考虑按值返回对象的函数。在这种情况下，C++ 必须使用拷贝构造函数创建副本。这种情况在下面的代码段中演示：\n\n```cpp\nStudent fn();\
  \ // 按值返回\n\nint main(int argcs, char* pArgs[])\n{\n    Student s;\n    s = fn();\
  \ // 调用 fn() 创建临时变量\n    // fn() 返回的临时变量持续多久？\n    return 0;\n}\n```\n\n函数 `fn()`\
  \ 按值返回一个对象。最终，返回的对象被复制到 `s`，在此之前它位于哪里？“好吧，”你说，“C++ 创建了临时变量，但它如何知道何时析构它？”好问题。在这个例子中，区别并不太大，因为临时变量持续多久对结果影响很大，因为\
  \ `refS` 存在于整个函数：\n\n```cpp\nint main(int argcs, char* pArgs[])\n{\n    Student&\
  \ refS = fn();\n    // ...现在怎么办?...\n    return 0;\n}\n```\n\n编译器创建的临时变量在创建它们的扩展表达式内有效，之后不再。\n\
  \n\n\n\n\n在以下函数中，我标记了临时对象不再有效的位置：\n\n```cpp\nStudent fn1();\n\nint fn2(Student&);\n\
  \nint main(int argcs, char* pArgs[])\n{\n    int x;\n    // 通过调用 fn1() 创建一个 Student\
  \ 对象。\n    // 将该对象传递给函数 fn2()。\n    // fn2() 返回一个整数用于某些\n    // 愚的计算。\n    // 在此期间，fn1()\
  \ 返回的临时对象\n    // 始终保持有效。\n    x = 3 * fn2(fn1()) + 10;\n    // fn1() 返回的临时对象现在不再有效了\n\
  \    // ...其他内容...\n    return 0;\n}\n```\n\n这使得引用示例失效，因为该对象可能在 `refS` 之前就消失，导致\
  \ `refS` 指向一个非对象。\n\n## 永久性避免临时对象\n\n你可能已经意识到，到处复制对象可能非常耗时。如果你不想对所有内容进行拷贝怎么办？最直接的解决方案是通过引用将对象传递给函数，并从函数返回对象。这样做可以避免大多数的临时对象。\n\
  \n但如果你仍然不确定 C++ 并不是在背后巧妙地构造你一无所知的临时对象怎么办？或者，如果你的类分配了你不希望被拷贝的唯一资源呢？该怎么办？\n\n你可以在你的拷贝构造函数中添加一条输出语句。执行程序时出现此消息，会警告你刚刚进行了一次拷贝。\n\
  \n更巧妙的方法是将拷贝构造函数声明为受保护（protected），如下：\n\n```cpp\nclass Student\n{\nprotected:\n\
  \    Student(Student&s){}\npublic:\n    // ...其他一切正常的内容...\n};\n```\n\n![c++'09.eps](img/c%2B%2B'09_fmt.jpeg)\
  \ C++ ’09 标准还允许程序员删除拷贝构造函数：\n\n```cpp\nclass Student\n{\n    Student(Student&s)\
  \ = delete;\n    // ...其他一切正常的内容...\n};\n```\n\n将拷贝构造函数声明为受保护或将其完全删除，都可以防止任何外部函数（包括\
  \ C++ 内部）构造你的 `Student` 对象的拷贝。如果没有人调用拷贝构造函数，就不会生成任何拷贝。就是如此。\n\n# 第 18 章：静态成员：柔顺剂能帮上忙吗？\n\
  \n### 本章内容\n- 声明静态成员数据\n- 定义和使用静态成员函数\n- 理解为什么我的静态成员函数不能调用我的其他成员函数\n\n默认情况下，数据成员是按对象分配的。例如，每个人都有自己的名字。你也可以通过将该成员声明为\
  \ `static` 来让该类的所有对象共享该成员。`static` 一词既适用于数据成员也适用于成员函数，尽管它们的含义略有不同。本章将描述这两种类型，从静态数据成员开始。\n\
  \n## 定义静态成员\n\n程序员可以通过在声明中添加 `static` 关键字，使数据成员成为该类所有对象共有的。此类成员被称为静态数据成员。（如果它们被称为其他名字，我会有点不悦的。）\n\
  \n## 为什么你需要静态成员\n\n大多数属性都是对象的属性。使用那个陈词滥调（人们可以说老掉牙的）学生示例，如 `name`、`ID number` 和 `courses`\
  \ 等属性属于特定的学生。然而，所有学生共享某些属性——例如，当前注册的学生人数、所有学生中的最高分，或者指向链表中第一个学生的指针。\n\n将这类信息存储在一个常见的、普通的全局变量里是非常容易的。例如，你可以使用一个低廉的\
  \ `int` 变量来跟踪 `Student` 对象的数量。然而，这种解决方案的问题在于，全局变量位于类之外。这就像把我的微波炉的电压调节器放在外壳外面一样。当然，我可以这样做，而且它可能可以工作——唯一的问题是，如果我的狗钻进了电线里，我不得不把它从天花板上剥下来（那只狗对此也不会太开心的）。\n\
  \n如果一个类要对自己的状态负责，那么像全局变量这样的对象就必须带入类内部，就像电压调节器必须在微波炉盖内部，远离窥探的爪子一样。这就是静态成员的设计思想。\n\
  \n![Tip.eps](img/Tip_fmt.jpeg) 你可能会听到静态成员被称为类成员；这是因为类中的所有对象都共享它们。相比之下，普通成员被称为实例成员（instance\
  \ members）或对象成员（object members），因为每个对象都拥有这些成员的自己的拷贝。\n\n## 使用静态成员\n\n静态数据成员是用 `static`\
  \ 存储类声明的成员，所示：\n\n```cpp\nclass Student\n{\npublic:\n    Student(char *pName = “no\
  \ name”) : name(pName)\n    {\n        noOfStudents++;\n    }\n    ~Student(){ noOfStudents--;\
  \ }\n    static int noOfStudents;\n    string name;\n};\n\nStudent s1;\nStudent\
  \ s2;\n```\n\n数据成员 `noOfStudents` 是类 `Student` 的一部分，但不是 `s1` 或 `s2` 的一部分。也就是说，对于\
  \ `Student` 类的每个对象都有独立的 `name`，但只有一个 `noOfStudents`，所有的 `Students` 都必须共享它。\n\n“那么，”你问，“如果\
  \ `noOfStudents` 的空间没有在 `Student` 类的任何对象中分配，它是在哪里分配的？”答案是，“没有分配。”你必须专门为它分配空间，如下：\n\
  \n```cpp\nint Student::noOfStudents = 0;\n```\n\n这种看起来有些奇特的语法为静态数据成员分配了空间并将其初始化为\
  \ `0`。（在声明静态成员时不需要初始化它；如果你不初始化，C++ 会调用默认构造函数。）静态数据成员必须是全局的——静态变量不能是函数的局部变量。\n\n\
  ![Remember.eps](img/Remember_fmt.jpeg) 当成员在类边界之外出现时，需要类名。\n\n![Tip.eps](img/Tip_fmt.jpeg)\
  \ 这种手动分配空间的操作有点让人困惑，除非你考虑到类定义被设计放在被多个源代码模块包含的文件中。C++ 必须知道在哪些 `.cpp` 源文件中为静态变量分配空间。对于非静态变量这不是问题，因为空间是在创建的每个对象中分配的。\n\
  \n## 引用静态数据成员\n\n静态成员的访问规则与普通成员的访问规则相同。在类内部，静态成员的引用方式与其他任何类成员一样。公共静态成员可以从类外部引用，而受保护良好的静态成员则不行。以下代码片段使用了上一节中\
  \ `Student` 的声明展示了两种引用方式：\n\n```cpp\nvoid fn(Student& s1, Student& s2)\n{\n    //\
  \ 引用公共静态\n    cout << “No of students “\n    << s1.noOfStudents // 从外部引用\n    <<\
  \ endl; // 类的\n}\n```\n\n在 `fn()` 中，`noOfStudents` 是通过对象 `s1` 引用的。但 `s1` 和 `s2`\
  \ 共享同一个成员 `noOfStudents`。我怎么知道选择 `s1` 的？我为什么不用 `s2` 呢？这没有任何区别。你可以使用该类的任何对象来引用静态成员。\n\
  \n事实上，你完全不需要对象。如果你愿意，可以可以直接使用类名，如下所示：\n\n```cpp\n// ...类定义与之前相同...\nvoid fn(Student&\
  \ s1, Student& s2)\n{\n    // 下面两行产生产生相同的结果\n    cout << “Number of students “\n\
  \    << Student::noOfStudents\n    << endl;\n}\n```\n\n如果你在访问静态成员时使用了对象名，C++ 只使用该对象的声明类。\n\
  \n![TechnicalStuff.eps](img/TechnicalStuff_fmt.jpeg) 这是一个次要的技术细节，但为了完全公开：用于引用静态成员的对象即使是一个表达式也不会被求值。例如，考虑以下情况：\n\
  \n```cpp\nclass Student\n{\npublic:\n    static int noOfStudents;\n    Student&\
  \ nextStudent();\n    // ...其他内容相同...\n};\n\nvoid fn(Student& s)\n{\n    cout <<\
  \ s.nextStudent().noOfStudents << “\\n”\n}\n```\n\n\n\n\n成员函数 `nextStudent()` 实际上并没有被调用。C++\
  \ 访问 `noOfStudents` 只需要返回类型，它可以在不费力评估表达式的情况下获取该类型。即使 `nextStudent()` 应该执行其他操作（例如洗窗户或擦鞋），情况也是如此的。这些操作都不会被执行。虽然这个例子很晦涩，但它确实会发生。这就是你试图在一个表达式中塞入太多东西的代价。\n\
  \n## 静态数据成员的用途\n\n静态数据成员有许多用途，但我在这里简单提到几点。首先，你可以使用静态成员来统计浮动中的对象数量。例如，在 `Student`\
  \ 类中，计数初始化为 0，构造函数对其递增，而析构函数对其递减。在任何给定时刻，静态成员都包含现有 `Student` 对象的计数。然而，请记住，这个计数反映的是\
  \ `Student` 对象的数量（包括任何临时对象），而不一定是学生的数量。\n\n静态成员的另一个相关用途是作为标志，用以指示特定操作是否发生。例如，`Radio`\
  \ 类可能在发送第一个调频命令之前需要初始化硬件，但在随后的调频之前不需要。一个指示这是第一次调频的标志就是入场券。这包括在发生错误时进行标记。\n\n另一个常见用途是为列表第一个成员的指针提供空间——即所谓的头指针（如果这听起来不熟悉，请参见第\
  \ 13 章）。静态成员可以分配所有函数中所有对象共享的公共数据位（过度使用这种公共内存是一个非常糟糕的主意，因为这样做会让跟踪错误变得困难）。\n\n## 声明静态成员函数\n\
  \n成员函数也可以声明为静态。当你想要将一个动作与类关联，但不需要将该动作与特定对象关联时，静态成员函数非常有用。例如，成员函数 `Duck::fly()` 与特定的鸭子相关，而更为激进的成员函数\
  \ `Duck::goExtinct()` 则没有。\n\n和静态数据成员一样，静态成员函数与类关联而不是与该类的特定对象关联。这意味着，就像静态数据成员的引用一样，对静态成员函数的引用不需要对象。如果存在对象，只使用它的类型。\n\
  \n因此，以下示例中对静态成员函数 `number()` 的两次调用都是合法的。这引出了我们的第一个静态程序——我是说第一个使用静态成员的程序——`CallStaticMember`：\n\
  \n```cpp\n//\n// CallStaticMember - demonstrate two ways to call a\n// static member\
  \ function\n//\n#include <cstdio>\n#include <cstdlib>\n#include <iostream>\n\nusing\
  \ namespace std;\n\nclass Student\n{\npublic:\nStudent(const char* pN = “no name”)\
  \ : sName(pN)\n{\nnoOfStudents++;\n}\n~Student() { noOfStudents--; }\nconst string&\
  \ name() { return sName; }\nstatic int number() { return noOfStudents; }\n\nprotected:\n\
  string sName;\nstatic int noOfStudents;\n};\n\nint Student::noOfStudents = 0;\n\
  int main(int argcs, char* pArgs[])\n{\n// create two students and ask the class\
  \ “how many?”\nStudent s1(“Chester”);\nStudent* pS2 = new Student(“Scooter”);\n\
  cout << “Created “ << s1.name()\n<< “ and “ << pS2->name() << endl;\ncout << “Number\
  \ of students is “\n<< s1.number() << endl;\n// now get rid of a student and ask\
  \ again\ncout << “Deleting “ << pS2->name() << endl;\ndelete pS2;\ncout << “Number\
  \ of students is “\n<< Student::number() << endl;\n// wait until user is ready before\
  \ terminating program\n// to allow the user to see the program results\nsystem(“PAUSE”);\n\
  return 0;\n}\n```\n\n该程序了两个 `Student` 对象，一个在本地，一个在堆上。然后它显示了它们的名字和学生数量。接下来，程序删除了其中一个学生，并询问类有多少个学生。程序的输出如下：\n\
  \n```\nCreated Chester and Scooter\nNumber of students is 2\nDeleting Scooter\n\
  Number of students is 1\nPress any key to continue . . .\n```\n\n该类保持其数据成员为受保护状态，并提供了访问函数，允许外部（非-Student）代码读取但不可修改它们。\n\
  \n![Tip.eps](img/Tip_fmt.jpeg) 将 `name()` 方法的返回类型声明为 `string&` 而不是简单的 `string`，会导致函数返回对象现有名称的引用，而不是创建一个临时字符串对象。（关于构造和避免临时对象的精彩论述请参见第\
  \ 17 章。）在声明中添加 `const` 可以防止调用者修改类的名称成员。\n\n注意静态成员函数 `number()` 如何访问静态数据成员 `noOfStudents`。事实上，它是类中唯一可以访问的成员——静态成员函数不与任何对象关联。如果我将\
  \ `name()` 声明为静态的，我就可以引用 `Student::name()`，这会立即引发问题：“哪一个名字？”\n\n## 这到底是关于什么的？\n\n\
  非静态对象方法如何知道它所指的是哪一个对象？换句话说，当我向 `Student` 对象索要它的名字时，`name()` 如何知道返回哪一个 `sName`？\n\
  \n当前对象的地址作为隐含的第一个参数传递给每个非静态方法。当需要引用此对象时，C++ 将其命名为 `this`。this 是每个对象方法中的关键字，意味着“当前对象”。这在下面的代码片段中得到了说明：\n\
  \n```cpp\nclass SC\n{\npublic:\nvoid dyn(int a); // like SC::dyn(this)\nstatic void\
  \ stat(int a); // like SC::stat(this)\n};\n\nvoid fn(SC& s)\n{\ns.dyn(10); // -converts\
  \ to SC::dyn(&s, 10)\ns.stat(10); // -converts to SC::stat(10)\n}\n```\n\n也就是说，函数\
  \ `dyn()` 的解释方式就像它声明为 `void SC::dyn(SC *this, int a)`。`s` 的地址作为第一个参数传递。（你不能真的这样写，但这就是编译器正在做的。）\n\
  \n`dyn()` 内部对其他非静态成员的引用会自动使用当前对象的 `this` 指针。当调用 `SC::stat()` 时，没有传递对象地址。这就是为什么我说静态成员函数不与任何对象关联。\n\
  \n你可以在第 9 章链表程序的面向对象版本 `LinkedList` 中看到这种显式用法。整个程序都包含在随附的光盘中；这个关键的 `NameDataSet`\
  \ 类出现在这里：\n\n```cpp\n// NameDataSet - 存储一个人的名字（这些对象\n// 可以存储任何其他所需的\n// 信息）。\nclass\
  \ NameDataSet\n{\npublic:\nNameDataSet(string& refName)\n: sName(refName), pNext(nullptr)\
  \ {}\n\n// add self to beginning of list\nvoid add()\n{\npNext = pHead;\npHead =\
  \ this;\n}\n\n// access methods\nstatic NameDataSet* first() { return pHead; }\n\
  NameDataSet* next() { return pNext; }\nconst string& name() { return sName; }\n\n\
  protected:\nstring sName;\n// the link to the first and next member of list\nstatic\
  \ NameDataSet* pHead;\nNameDataSet* pNext;\n};\n\n// allocate space for the head\
  \ pointer\nNameDataSet* NameDataSet::pHead = nullptr;\n```\n\n在这里你可以看到指向列表开头的 `pHead`\
  \ 指针已转换为静态数据成员，因为它适用于整个类。此外，`pNext` 已成为一个数据成员，并提供了访问方法以允许其他程序访问现在受保护的类成员。\n\n`add()`\
  \ 方法通过首先将其 `pNext` 指针设置为列表开头，将当前对象添加到列表头部。下一条语句通过赋值 `pHead = this` 使头指针指向当前对象。\n\
  \n\n\n\n\n在第三部分面向对象哲学的讨论中，我解释了真实世界解决方案的两个主要特征，而函数式编程解决方案似乎并不具备。\n\n第一个是独立处理对象的能力。我展示了一个使用微波炉快速制作零食的例子。微波炉提供了一个接口（前面板），我用它来控制微波炉，而无需担心它的内部工作原理。即使我完全了解那个该的东西是如何运作的（尽管我并不了解），事实也是如此。\n\
  \n真实世界解决方案的另一个方面是对同类对象进行分类的能力——识别并利用它们的相似性。如果我的食谱要求任何类型的烤箱，我应该没有问题，因为微波炉也是一种烤箱。\n\
  \n在第三部分中，我介绍了 `C++` 用于实现第一个特征的机制：`class`（类）。为了支持面向对象编程的第二个方面，`C++` 使用了一个名为 `inheritance`（继承）的概念，它扩展了类。继承是本文的核心议题，也是随附\
  \ CD-ROM 中 BUDGET3 程序的核心传达。\n\n# 第 19 章：类的继承\n\n### 本章内容\n- 定义继承\n- 继承基类\n- 构建基类\n\
  -探索探索意义关系：IS_A 关系与 HAS_A 关系\n\n本章讨论了继承，即一个 `class` 继承另一个 `class` 能力或属性的能力。\n\n继承是一个常见的概念。我是一个人类（当我早上第一次醒来时除外）。我从\
  \ `Human`（人类）类继承了某些属性，例如我（在多程度上）智能地对话的能力，以及我对空气、水和碳水化合物营养的依赖（我恐怕我对后者的依赖有点过度了）。这些属性并不是人类所独有的`Human`\
  \ 类从 `Mammal`（哺乳动物）类继承了对空气、水和营养的依赖，而 `Mammal` 类又从 `Animal`（动物）类继承了这些。\n\n传递属性的能力是非常强大的。它让你能够以一种经济的方式来描述事物。例如，如果我的儿子问：“什么是鸭子？”我说：“它是一只会‘嘎嘎’叫的鸟。”尽管你可能怎么想，这个答案传达了大量信息。他知道什么是鸟，现在他知道了关于鸭子的所有相同信息，加上鸭子额外的属性“嘎嘎叫性”。（参参见第\
  \ 11 章，对此及其他深刻观察的进一步讨论。）\n\n面向对象（OO）语言通过允许一个 `class` 继承另一个 `class` 来表达这种继承关系。因此，OO\
  \ 语言生成的模型比不支持继承的语言生成的模型更接近现实世界（记住现实中的东西！）。\n\n`C++` 允许一个类如下继承另一个类：\n\n```cpp\nclass\
  \ Student\n{\n\n};\n\nclass GraduateStudent : public Student\n{\n\n};\n```\n\n在这里，`GraduateStudent`\
  \ 继承了 `Student` 的所有成员。因此，一个 `GraduateStudent` 是（IS）一个 `Student`。（`IS_A` 的大写强调了这种关系的重要性。）当然，`GraduateStudent`\
  \ 也可能包含 `GraduateStudent` 特有的其他成员。\n\n## 我需要继承吗？\n\n继承引入到 `C++` 有几个原因。当然，主要原因是表达继承关系的能力。（我稍后会回到这一点。）一个次要原因是减少打字量。假设你有一个\
  \ `Student` 类，被要求添加一个名为 `GraduateStudent` 的新类。继承可以大大减少你必须放入类中的内容数量。在 `GraduateStudent`\
  \ 类中，你真正只需要描述学生和研究生之间差异的内容。\n\n另一个次要副作用与软件修改有关。假设你继承自某个现有的类。后来，你发现基类并没有完全实现子类需要的功能。或者该类有一个\
  \ Bug。修改基类可能会破坏任何使用该基类的代码。创建并使用一个重载了错误功能的新子类可以解决你的问题，而不会给他人带来进一步的问题。\n\n## 这太神奇了（IS_A-mazing）\n\
  \n为了理解周围的环境，人类建立了广泛的分类分类法。Fido 是 `dog`（狗）的一个特例，`dog` 是 `canine`（犬科动物）的一个特例，`canine`\
  \ 是 `mammal`（哺乳动物）的一个特例，以此类推。这塑造了我们对世界的方式。例如，学生是一个（特殊类型的）`person`（人）。如此，我已经知道很多关于学生的事情（至少是美国学生）。我知道他们有社会安全号码，他们看太多电视，他们对异性做白日梦（指男性）。我知道所有这些事情，是因为这些是所有人的属性。\n\
  \n在 `C++` 中，我们说 `Student` 类继承自 `Person` 类。同样，我们说 `Person` 是 `Student` 的基类，而 `Student`\
  \ 是 `Person` 的子类。最后，我们说一个 `Student` 是（IS_A）一个 `Person`（全大写是表达这种独特关系的常用方式——这不是我发明的）。`C++`\
  \ 与其他面向对象语言共享这一术语。\n\n注意尽管 `Student` IS_A `Person`，但反过来并不成立。一个 `Person` 不是 `Student`。（这样的陈述总是指的是一般情况。某个特定的\
  \ `Person` 实际上可能是一个 `Student`。）许多 `Person` 类的成员并不是 `Student` 类的成员。此外，`Student` 类拥有它不与\
  \ `Person` 类共享的属性。例如，`Student` 有平均学点（GPA），但 `Person` 没有。\n\n继承属性具有传递性。例如，如果定义 `GraduateStudent`\
  \ 是 `Student` 的子类，那么 `GraduateStudent` 必须也是 `Person`。\n\n## 类如何继承？\n\n这里是填充好的 `InheritanceExample`\
  \ 示例：\n\n```cpp\n// InheritanceExample - 展示继承\n// 关系其中子类向基类\n// 传递构造函数信息\n#include\
  \ <cstdio>\n#include <cstdlib>\n#include <iostream>\n\nusing namespace std;\n\n\
  // 定义一个空类\nclass Advisor {};\n\nclass Student\n{\n\npublic:\nStudent(const char\
  \ *pName = \"no name\")\n: name(pName), average(0.0), semesterHours(0)\n{\ncout\
  \ << \"Constructing student \" << name << endl;\n}\nvoid addCourse(int hours, float\
  \ grade)\n{\ncout << \"Adding grade to \" << name << endl;\naverage = semesterHours\
  \ * average + grade;\nsemesterHours += hours;\naverage = average / semesterHours;\n\
  }\nint hours( ) { return semesterHours;}\nfloat gpa( ) { return average;}\nprotected:\n\
  string name;\ndouble average;\nint semesterHours;\n};\n\nclass GraduateStudent :\
  \ public Student\n{\n\npublic:\nGraduateStudent(const char *pName, Advisor adv,\n\
  double qG = 0.0)\n: Student(pName), advisor(adv), qualifierGrade(qG)\n{\ncout <<\
  \ \"Constructing graduate student \" << pName << endl;\n}\ndouble qualifier( ) {\
  \ return qualifierGrade; }\nprotected:\nAdvisor advisor;\ndouble qualifierGrade;\n\
  };\n\nint main(int nNumberofArgs, char* pszArgs[])\n{\n// 创建一个虚拟 advisor 给 GraduateStudent\n\
  Advisor adv;\n// 创建两个 Student 类型\nStudent llu(\"Cy N Sense\");\nGraduateStudent\
  \ gs(\"Matt Madox\", adv, 1.5);\n// 现在给它们的平均学点添加一个分数\nllu.addCourse(3, 2.5);\ngs.addCourse(3,\
  \ 3.0);\n// 显示研究生的资格成绩\ncout << \"Matt’s qualifier grade = \" << gs.qualifier()\
  \ << endl;\n// 在程序终止前等待用户准备好\n// 允许用户查看程序结果\nsystem(\"PAUSE\");\nreturn 0;\n}\n\
  ```\n\n此程序演示了两个对象的创建，一个是 `Student` 类，另一个是 `GraduateStudent` 类。该程序的输出如下：\n\n```\n\
  Constructing student Cy N Sense\nConstructing student Matt Madox\nConstructing graduate\
  \ student Matt Madox\nAdding grade to Cy N Sense\nAdding grade to Matt Madox\n```\n\
  \n\n\n\nMatt 的资格考试成绩 = 1.5\n\n按任意键继续 . . .\n\n## 使用子类\n\n`Student` 类是按照传统方式定义的。然而，`GraduateStudent`\
  \ 类稍有不同。在类定义的开头，冒号后跟着短语 `public Student` 将 `GraduateStudent` 声明为 `Student` 的子类。![Tip.eps](img/Tip_fmt.jpeg)\
  \ 关键字 `public` 的出现意味着可能也存在保护继承。好吧，确实如此，但保护继承超出了本书的讨论范围。\n\n程序员们喜欢发明新术语或给现有术语赋予新含义。老天，程序员甚至会发明新术语，然后给它们赋予第二层含义。这里有一组描述相同关系的等价表达式：\n\
  \n- `GraduateStudent` 是 `Student` 的子类。\n- `Student` 是 `GraduateStudent` 的基类或父类。\n\
  - `GraduateStudent` 继承或派自 `Student`。\n- `GraduateStudent` 扩展了 `Student`。\n\n作为 `Student`\
  \ 的子类，`GraduateStudent` 继承了它所有的成员。例如，尽管该成员是在基类中声明的，但 `GraduateStudent` 拥有一个名称。然而，子类可以添加自己的成员，例如\
  \ `qualifierGrade`。毕竟，`gs` 从字面上来说是一个 `Student` 加上了一点东西。\n\n`main()` 函数声明了两个对象：类型为\
  \ `Student` 的 `llu` 和类型为 `GraduateStudent` 的 `gs`。然后它访问了这两个类型学生的 `addCourse()` 成员函数。随后\
  \ `main()` 访问了仅属于子类的成员 `qualifier()` 函数。\n\n## 构建子类\n\n尽管子类可以访问基类的保护成员并对其进行初始化，但每个子类都负责初始化自己。\n\
  \n在控制权通过 `GraduateStudent` 构造函数的大括号之前，控制权会传递给 `Student` 相应的构造函数。如果 `Student` 是基于另一个类（例如\
  \ `Person`），那么该类的构造函数将在 `Student` 构造函数获取控制权之前被调用。就像大大楼一样，对象的构建是从“地下室”类开始，逐层地沿着类结构向上构建的。\n\
  \n与成员对象一样，你通常需要能够向基类构造函数传递参数。示例程序如下所示声明了子类构造函数：\n\n```\nGraduateStudent(const char\
  \ *pName, Advisor adv, double qG = 0.0)\n: Student(pName), advisor(adv), qualifierGrade(qG)\n\
  {\n    // 构造函数执行的其他任何操作\n}\n```\n\n在这里，`GraduateStudent` 的构造函数调用了 `Student` 的构造函数，并为其传递了参数\
  \ `pName`。随后 C++ 在执行构造函数括号内的语句之前，初始化了成员 `advisor` 和 `qualifierGrade`。\n\n如果子类没有显式引用不同的构造函数，则执行基类的默认构造函数。因此，在下面的代码段中，`Pig`\
  \ 基类在 `LittlePig` 的任何成员之前就被构建了，尽管 `LittlePig` 并没有显式引用该构造函数：\n\n```cpp\nclass Pig\n\
  {\npublic:\n    Pig() : pHouse(nullptr) {}\nprotected:\n    House* pHouse;\n};\n\
  \nclass LittlePig : public Pig\n{\npublic:\n    LittlePig(double volStraw, int numSticks,\
  \ int numBricks)\n    : straw(volStraw), sticks(numSticks), bricks(numBricks)\n\
  \    { }\nprotected:\n    double straw;\n    int sticks;\n    int bricks;\n};\n\
  ```\n\n同样，基类的拷贝构造函数也会自动调用。\n\n## 析构子类\n\n根据析构函数按构造函数反序调用的规则，`GraduateStudent` 的析构函数首先获得控制权。在完成最后的奉献后，控制权传递给\
  \ `Advisor` 的析构函数，然后传递给 `Student` 的析构函数。如果 `Student` 是基于类 `Person`，那么 `Person` 的析构函数将在\
  \ `Student` 之后获得控制权。\n\n这是逻辑性的。这块内存首先被转换为 `Student` 对象。只有那时，`GraduateStudent` 构造函数的任务是将这个简单的\
  \ `Student` 转换为 `GraduateStudent`。析构函数只是简单地反这个过程。\n\n## 拥有 HAS_A 关系\n\n注意，`GraduateStudent`\
  \ 类包含了 `Student` 类和 `Advisor` 的成员，但方式不同。通过定义一个 `Advisor` 类的数据成员，你知道 `Student` 内部包含了\
  \ `Advisor` 的所有数据成员。然而，你不能说一个 `GraduateStudent` 是一个 `Advisor` —— 相反，你说 `GraduateStudent`\
  \ 拥有（HAS_A）一个 `Advisor`。这与继承有什么区别？\n\n以汽车为例。你可以逻辑上将汽车定义为 `vehicle` 的子类，因此它继承了其他车辆的属性。同时，汽车有一个发动机。如果你买了一辆汽车，逻辑上可以假设你也买了一个发动机。（除非你去了我买我最后那堆废铁的那个二手车交易场。）\n\
  \n如果朋友请你周六开着你心仪的车辆去参加集会，而你开车去了，他们就不能抱怨（即使有人骑自行车出现），因为汽车确实是一个 `vehicle`。但是，如果你徒步提着一个发动机出现，你的朋友就会理由嘲笑你，因为发动机不是车辆。发动机缺少了车辆共有的某些关键属性——例如没有用于\
  \ MP-3 播放器的 AUX 接口的收音机。\n\n从编程的角度来看，HAS_A 关系同样直观。考虑以下：\n\n```cpp\nclass Vehicle\
  \ {};\nclass Motor {};\nclass Car : public Vehicle\n{\npublic:\n    Motor motor;\n\
  };\n\nvoid VehicleFn(Vehicle& v);\nvoid MotorFn(Motor& m);\n\nint main(int nNumberofArgs,\
  \ char* pszArgs[])\n{\n    Car car;\n    VehicleFn(car); // 这是允许的\n    MotorFn(car);\
  \ // 这是不允许的\n    MotorFn(car.motor);// 这是允许的\n    return 0;\n}\n```\n\n调用 `VehicleFn(c)`\
  \ 是允许的，因为 `car` 是 `vehicle`。调用 `MotorFn(car)` 不允许，因为 `car` 不是 `Motor`，尽管它包含一个 `Motor`。如果意图是将\
  \ `c` 的 `Motor` 部分传递给函数，必须显式表示，如调用 `MotorFn(car.motor)` 所示。\n\n## 第 20 章\n## 检查虚成员函数：它们是真实的吗？\n\
  \n### 本章内容\n- 发现多态（又称晚绑定）是如何工作的\n- 发现多态纳米（nachos）有多安全\n- 在子类中重写成员函数\n- 检查多态的特殊考虑因素\n\
  \n函数参数的数量和类型包含在它的完整（或扩展）名称中。这允许你为两个函数赋予相同的名称，只要扩展名称不同即可：\n\n```cpp\nvoid someFn(int);\n\
  void someFn(char*);\nvoid someFn(char*, double);\n```\n\n在所有三种情况下，这些函数的简短名称都是 `someFn()`（嘿！这有点趣）。这三个函数的扩展名称均不相同：`someFn(int)`\
  \ 相对于 `someFn(char*)`，依此类推。C++ 留给编译器来确定参数是指哪个函数。\n\n成员函数可以被重载。参数的数量、参数类型以及类名都是扩展名称的一部分。\n\
  \n然而，继承引入了一个全新的问题。如果基类中的函数与子类中的函数同名怎么办？例如，考虑下面的简单代码段：\n\n```cpp\nclass Student\n\
  {\npublic:\n    double calcTuition();\n};\n\nclass GraduateStudent : public Student\n\
  {\npublic:\n    double calcTuition();\n};\n\nint main(int argcs, char* pArgs[])\n\
  {\n    Student s;\n    GraduateStudent gs;\n    s.calcTuition(); //调用 Student::calcTuition()\n\
  \    gs.calcTuition();//调用 GraduateStudent::calcTuition()\n    return 0;\n}\n```\n\
  \n与任何重载情况一样，当程序员引用 `calcTuition()` 时，C++ 必须决定指的是图哪个 `calcTuition()`。显然，如果两个函数的参数类型不同，则没有问题。即使参数相同，类名也应该足以解析调用，这个例子也没有区别。`s.calcTuition()`\
  \ 指的是 `Student::calcTuition()`，因为 `s` 在本地声明为 `Student`，而 `gs.calcTuition()` 指的是\
  \ `GraduateStudent::calcTuition()`。\n\n\n\n\n\n但如果对象的精确类型在编译时无法确定呢？为了演示这种情况是如何发生的，请以一种看似微不足的方式修改前面的程序：\n\
  \n```cpp\n//\n// OverloadOverride - 演示函数是在\n// 编译时重载还是运行时\n// 重写（覆盖）\n\n#include\
  \ <cstdio>\n#include <cstdlib>\n#include <iostream>\n\nusing namespace std;\n\n\
  class Student\n{\npublic:\nvoid calcTuition()\n{\ncout << “We’re in Student::calcTuition”\
  \ << endl;\n}\n};\n\nclass GraduateStudent : public Student\n{\npublic:\nvoid calcTuition()\n\
  {\ncout << “We’re in GraduateStudent::calcTuition”\n<< endl;\n}\n};\n\nvoid fn(Student&\
  \ x)\n{\nx.calcTuition(); // 这里的 calcTuition() 指的是\n哪一个？\n}\n\nint main(int nNumberofArgs,\
  \ char* pszArgs[])\n{\n// 将基类对象传递给函数\n// (匹配声明)\nStudent s;\nfn(s);\n// 改为传递基类的派生类\n\
  GraduateStudent gs;\nfn(gs);\n// 等待用户准备好后再终止程序\n// 允许用户看到程序结果\nsystem(“PAUSE”);\n\
  return 0;\n}\n```\n\n此程序产生以下输出：\n\nWe’re in Student::calcTuition\nWe’re in Student::calcTuition\n\
  Press any key to continue . . .\n\n现在调用不是直接调用 `calcTuition()`，而是通过中间函数 `fn()` 调用的。取决于\
  \ `fn()` 如何被调用，`x` 可以是 `Student` 也可以是 `GraduateStudent`。`GraduateStudent` **是一个**\
  \ `Student`。\n\n![Remember.eps](img/Remember_fmt.jpeg) 如果你不记得为什么 `GraduateStudent`\
  \ **是一个** `Student`，请参阅第 19 章。\n\n传递给 `fn()` 的参数 `x` 被声明为对 `Student` 的引用。\n\n![Remember.eps](img/Remember_fmt.jpeg)\
  \ 通过引用传递对象比按值传递对象高效得多。关于复制对象的论述，请参阅第 17 章。\n\n你可能希望当 `x` 是 `Student` 时，`x.calcTuition()`\
  \ 调用 `Student::calcTuition()`；而当 `x` 是 `GraduateStudent` 时，调用 `GraduateStudent::calcTuition()`。如果\
  \ C++ 能有那么智能就太酷了。\n\n![Tip.eps](img/Tip_fmt.jpeg) 你到目前为止习惯类型被称为静态类型，或称编译时类型。在两种情况下，`x`\
  \ 的声明类型都是 `Student`，因为 `fn()` 中的声明是那样所说的。另一种类型是动态类型，或称运行时类型。在示例函数 `fn()` 的例子中，当用\
  \ `s` 调用 `fn()` 时，`x` 的运行时类型是 `Student`；当用 `gs` 调用 `fn()` 时，运行时类型是 `GraduateStudent`。我们不是觉得很有趣吗？\n\
  \n根据运行时类型决定调用多个重载成员函数中的哪一个的能力被称为**多态**（polymorphism）或**晚绑定**（late binding）。在编译时决定调用哪一个重载版本被称为**早绑定**（early\
  \ binding），因为这听起来像是晚绑定的相反。\n\n以多态方式重载基类函数被称为**重写**基类函数（overriding the base class\
  \ function）。使用这个新名称是为了将这种更复杂的情况与普通的重载情况区分开。\n\n## 为什么你需要多态\n\n多态是面向对象编程力量的关键。它是如此重要，以至于不支持多态的语言无法自称是面向对象的语言。（我认为这是一项政府规定——你不能给一个不支持面向对象的语言贴标签，除非加上总军医的免责声明之类的。）\n\
  \n没有多态，继承几乎没有任何意义。还记得我在烤箱里做 nachos 吗？从这个意义上说，我充当了晚绑定者。食谱写着：在烤箱中加热 nachos。它并没有写道：如果烤箱类型是微波炉，这样做；如果烤箱类型是传统的，做那个；如果烤箱类型是对流的，做另一件事。食谱（代码）依赖于我（晚绑定者）来决定当\
  \ `heat`（成员函数）应用于烤箱（`Oven` 类的特定实例）或其任何变体（子类），如微波炉（`Microwave`）时意味着什么。这是人类思考的方式，沿着人类思考的方式设计语言允许编程模型更准确地描述现实世界。\n\
  \n## 多态是如何工作的\n\n任何给定的语言都可以根据开发者的喜好支持早绑定或晚绑定。旧的语言如 `C` 倾向于只支持早绑定。近期的语言如 `Java` 和\
  \ `C#` 只支持晚绑定。作为一个跨界支持者，`C++` 同时支持早绑定和晚绑定。\n\n你可能对 `C++` 默认是早绑定感到惊讶。原因在于很简单，尽管有点过时。首先，`C++`\
  \ 默认必须尽可能像 `C`，以保持与其前任版本的向上兼容性。其次，多态在数据存储和执行调用所需的代码方面为每个函数调用增加了少量的开销。`C++` 的创始人担心任何额外的开销都会被当作不选择\
  \ `C++` 作为系统开发语言的理由，因此他们将更高效的早绑定设置为默认。\n\n最后一个原因是，作为给定类的程序员，决定是否希望给定的成员函数在某时刻被重写是有用的。为了让成员函数具有多态性，程序员必须在某处标记\
  \ `virtual` 关键字，如下所示 Overloadide 程序的修改所示：\n\n```cpp\nclass Student\n{\npublic:\n\
  virtual void calcTuition()\n{\ncout << “We’re in Student::calcTuition” << endl;\n\
  }\n};\n```\n\n`virtual` 关键字告诉 `C++` `calcTuition()` 是多态的。也就是说，如果对调用对象的运行时类型有任何疑问，将将晚绑定。\n\
  \n将 `calcTuition()` 声明为虚函数的 Overloadide 程序产生以下输出：\n\nWe’re in Student::calcTuition\n\
  We’re in GraduateStudent::calcTuition\nPress any key to continue . . .\n\n![TechnicalStuff.eps](img/TechnicalStuff_fmt.jpeg)\
  \ 如果你熟悉环境中调试器，真的应该单步执行这个示例。看到程序第一次调用 `fn()` 时进入 `Student::calcTuition()`，而在第二次调用时进入\
  \ `GraduateStudent::calcTuition()`，这真是太酷了。我认为只有尝试过之后才能真正体会多态。\n\n![Tip.eps](img/Tip_fmt.jpeg)\
  \ 你只需要在基类中声明虚函数。“虚性”会自动传递给子类。然而，在书中，我遵循在处处声明虚函数的编码标准。\n\n## 虚函数在什么时候不是多态的？\n\n仅仅因为你认为某个函数调用是晚绑定的，并不意味着它就是。如果不在子类中以相同的参数进行声明，无论是否声明为虚函数，这些成员函数都不是多态的。\n\
  \n相同声明规则的一个例外是，如果基类中的成员函数返回基类对象的指针或引用，则子类中的重写成员函数可以返回子类对象的指针或引用。换句话说，函数 `makeACopy()`\
  \ 是多态的，尽管这两个函数的返回类型不同：\n\n```cpp\nclass Base\n{\npublic:\n// 返回当前对象的拷贝\nBase* makeACopy();\n\
  };\n\nclass SubClass : public Base\n{\npublic:\n// 返回当前对象的拷贝\nSubClass* makeACopy();\n\
  };\n\nvoid fn(Base& bc)\n{\nBase* pCopy = bc.makeACopy();\n// 继续\n}\n```\n\n在实践中，这是非常自然的。`makeACopy()`\
  \ 函数应该返回 `SubClass` 类型的对象，即使它可能重写了 `BaseClass::makeACopy()`。\n\n\n\n\n在使用虚函数时，你需要记住几点。首先，`static`\
  \ 成员函数不能被声明为虚函数。因为 `static` 成员函数不是通过对象调用的，因此没有运行时对象可以作为绑定决策的依据。\n\n其次，在调用时指明类名会强制进行早期绑定，无论该函数是否为虚函数。例如，以下调用是针对\
  \ `Base::fn()`，因为程序员是这样指示的，即使 `fn()` 被声明为虚函数：\n\n```cpp\nvoid test(Base& b)\n{\n\
  \    b.Base::fn(); // 此调用不是后期绑定的\n}\n```\n\n最后，构造函数不能是虚函数，因为没有（已完成的）对象可以用来确定类型。在构造函数被调用时，对象占据的内存仅仅是一块无定形状的整体。只有在构造函数执行完毕后，该对象才成为类中一个正式的成员。\n\
  \n相比之下，析构函数几乎应该总是声明为虚函数。否则，你将面临无法正确析构对象的风险，如下所示：\n\n```cpp\nclass Base\n{\npublic:\n\
  \    ~Base();\n};\n\nclass SubClass : public Base\n{\npublic:\n    ~SubClass();\n\
  };\n\nvoid finishWithObject(Base* pHeapObject)\n{\n    // ...对对象的操作...\n    // 现在将其归还堆\n\
  \    delete pHeapObject; // 无论如何都会调用 ~Base()\n} // 无论 pHeapObject 的运行时类型是什么\n```\n\
  \n如果传递给 `finishWithObject()` 的指针确实指向一个 `SubClass`，那么 `SubClass` 的析构函数将无法被正确调用——因为析构函数没有声明为虚函数，它总是早期绑定的。将析构函数声明为虚函数可以解决这个问题。\n\
  \n那么，什么情况下你不想将析构函数声明为虚函数呢？只有一种情况。虚函数会引入“微小”的开销。让我更具体一点：当程序员在类中定义第一个虚函数时，C++ 会增加一个额外的隐藏指针——不是每个虚函数增加一个指针，只要该类有任何虚函数，就只增加一个指针。一个没有虚函数的类（且没有从基类继承任何虚函数的类）则没有这个指针。\n\
  \n现在，一个指针听起来并不多，除非满足以下两个条件：\n1. 该类没有许多数据成员（因此与现有内容相比，一个指针代表了很大比例）。\n2. 你打算创建大量该类的对象（否则，这种开销不会产生任何影响）。\n\
  \n如果满足了这两个条件，且你的类本身没有虚成员函数，你可能不想将析构函数声明为虚函数。\n\n![Warning(bomb).eps](img/Warning(bomb)_fmt.jpeg)\
  \ 除了这一种情况外，请始终将析构函数声明为虚函数，即使一个类（尚未）被子类化——你永远不知道何时会有人将你的类作为他们自己的基类。如果你没有将析构函数声明为虚函数，请务必进行说明！\n\
  \n## 第 21 章：类的重构\n\n### 本章内容\n- 将公共属性重构到基类中\n- 使用抽象类持有重构后的信息\n- 声明抽象类\n- 继承自抽象类\n\
  - 使用项目文件将程序分为多个模块\n\n继承的概念允许一个类继承基类的属性。继承有许多目的，包括支付我儿子的大学学费。继承的主要益处能够指明类之间的关系。这就是所谓的\
  \ IS_A（是一个）关系——一个`微波炉`是一个`烤箱`，诸此类推。\n\n如果你能建立起正确的关联，重构就是非常棒的。例如，微波炉与传统烤箱之间的关系看起来是自然的。如果你声称微波炉是某种特殊的烤面包机，你就会遇到麻烦。诚然，它们都能让食物变热，都使用电，而且都在厨房里，但相似性仅此于此——微波炉无法烤吐司。\n\
  \n识别问题中固有的类并在这些类之间画出正确的关系，是一个被称为“重构”（factoring）的过程。（这个词与你在小学被迫做的算术有关：例如，分解因最小公倍数，比如\
  \ 12 等于 2 乘以 2 乘以 3。）\n\n## 重构\n\n本节描述了如何通过银行账户示例使用继承来简化你的程序。假设你被要求编写一个简单的银行程序，实现储蓄账户和支票账户的概念。\n\
  \n关于这些类，我可以一直聊到口干舌燥；然而，面向对象的程序员想出了一种简洁的方法，通过图来描述类的要点。`Checking`（支票账户）类和 `Savings`（储蓄账户）类如图\
  \ 21-1 所示。（这只是用图形化表达相同内容的几种方法之一。）\n\n**图 21-1：** 独立的类 Checking 和 Savings。\n\n![317266-fg2101.eps](img/317266-fg2101_fmt.jpeg)\n\
  \n阅读此图和其他图表时，请记住以下点：\n- 大方框是类，类名位于顶部。\n- 框内的名称是成员函数。\n- 不在框内的名称是数据成员。\n- 延伸到框外的部分的名称是公开访问的成员；也就是说，这些成员可以被该类或其任何后代的类的函数访问。完全在框内的成员无法从类外部访问。\n\
  - 粗箭头（见图 21-2）表示 IS_A 关系。\n- 细箭头表示 HAS_A（有一个）关系。\n\n![Remember.eps](img/Remember_fmt.jpeg)\
  \ 汽车 IS_A 车辆，但汽车 HAS_Aget。\n\n从图 21-1 可以看到，`Checking` 和 `Savings` 类有很多共同点。例如，两个类都有\
  \ `withdrawal()`（取款）和 `deposit()`（存款）成员函数。然而，由于这两个类并不完全相同，它们必须保持为独立的类。（在现实世界的银行应用程序中，这两个类的差异会比这里大得多。）尽管如此，应该有一种避免这种重复的方法。\n\
  \n你可以让其中一个类继承另一个。`Savings` 类的成员比 `Checking` 多，所以可以让 `Savings` 继承 `Checking`。这种安排如图\
  \ 21-2 所示。`Savings` 类继承了所有成员。通过添加数据成员 `noWithdrawals` 并重写函数 `withdrawal()` 完成该类。你必须重写\
  \ `withdrawal()`，因为从储蓄账户取款的规则与支票账户取款的规则不同。\n\n**图 21-2：** 作为 Checking 子类的 Savings。\n\
  \n![317266-fg2102.eps](img/317266-fg2102_fmt.jpeg)\n\n\n\n这种更改可以通过对 `Checking` 类进行极小的修改来轻松处理。你必须向\
  \ `Checking` 类中添加一个新的数据成员，以跟踪该月内的最低余额。我们大胆地称它为 `minimumBalance` 吧。\n\n但现在遇到了一个问题。因为\
  \ `Savings` 继承自 `Checking`，`Savings` 也会获得这个新数据成员。它对这个成员并没有用，因为最低余额不会影响储蓄账户，所以它就只能呆在那里。记住，每个支票账户对象都有这个额外的\
  \ `minimumBalance` 成员。多出一个数据成员可能不是什么大事，但它会增加进一步的混乱。\n\n这样的更改会累积。今天是一个额外的数据成员——明天是一个被修改的成员函数。最终，储蓄账户类将携带许多仅适用于支票账户的额外负担。\n\
  \n现在银行又回来了，决定改变某些储蓄账户政策。这要求你修改 `Checking` 中的某些函数。基类中的此类更改会自动传播到子类，除非该函数在子类 `Savings`\
  \ 中已经被重写了。例如，假设银行决定每向支票账户存入款项就送一台烤面包机。（嘿——这真的可能发生！）在银行（或其程序员）不知情的情况下，向支票账户存款会自动导致烤面包机的赠送。除非你非常小心，否则对\
  \ `Checking` 的更改可能会意外地出现在 `Savings` 中。\n\n如何避免这些问题？声称 `Checking` 是 `Savings` 的一个特例可以改变这一点，但不能解决我们的问题。你需要第三个类（为了好玩叫它\
  \ `Account`），它体现了 `Checking` 和 `Savings` 之间的共同点。这种关系如图 21-3 所示。\n\n**图 21-3:** 基于共同的\
  \ `Account` 类构建 Checking 和 Savings。\n\n![317266-fg2103.eps](img/317266-fg2103_fmt.jpeg)\n\
  \n构建新账户是如何解决问题的？首先，创建一个新的 `Account` 类是对现实世界更准确的描述（无论现实是什么）。在我们对物的概念中（至少在我的概念中），确实存在一种被称为“账户”的东西。储蓄账户和支票账户是这个更基础概念的特例。\n\
  \n此外，`Savings` 类不受 `Checking` 类更改的影响（反之亦然）。如果银行对所有账户实施根本性变更，你可以修改 `Account`，所有子类将自动继承该更改。但如果银行仅对支票账户更改政策，你只需要修改\
  \ `Checking` 账户类而无需修改 `Savings`。\n\n这种从相似类中提取共同属性的过程就是类重构（class factoring）的精髓。\n\
  \n![Warning(bomb).eps](img/Warning(bomb)_fmt.jpeg) 只有当继承关系与现实对应时，重构才是合法的。因为 `Mouse`\
  \ 和 `Joystick` 都是硬件指针设备而将它们重构为一个类是合法的。但因为 `Mouse` 和 `Display` 都进行低级操作系统调用而将它们重构为一个类是不合法的。\n\
  \n## 实现抽象类\n\n尽管重构在智力上令人令人的，但它引入了自身的问题。再次回到银行账户类，特别是公共基类 `Account`。思考一下，你将如何定义 `Account`\
  \ 中定义的不同成员函数。\n\n大多数 `Account` 成员函数没有问题，因为两种类型的账户都以相同的方式实现了了它们。然而，使用 `Account::withdrawal()`\
  \ 实现这些共同函数是不同的。从储蓄账户取款的规则与从支票账户取款的规则不同。你必须以不同 `Checking::withdrawal()` 的方式实现 `Savings::withdrawal()`。但你应该如何实现\
  \ `Account::withdrawal()` 呢？\n\n让我们向银行经理寻求帮助。我想对话大致如下：\n\n“从账户取款的规则是什么？”你带着期待地问。\n\
  \n“什么种类型的账户？储蓄还是支票？”回答道。\n\n“从一个账户，”你说道，“仅仅一个账户。”\n\n茫然的眼神。（人们可能会说是一种‘银行式的茫然眼神’……话又说回来，也许不是。）\n\
  \n问题在于，这个问题没有意义。不存在所谓的“仅仅一个账户”。所有的账户（在这个例子中）要么是支票账户，要么是储蓄账户。账户的概念是一个抽象的概念，它提取了两个具体类共有的属性。它是不完整的，因为缺少关键的属性\
  \ `withdrawal()`。（当你进一步了解细节后，你可能会发现其他简单账户所缺少的属性。）\n\n抽象类是只存在于子类类。具体类是指不是抽象的类。这很难算是一个抽象概念。\n\
  \nC++ 支持一种名为“抽象类”的概念，用来描述像账户这样不完整的概念。\n\n### 描述抽象类概念\n\n抽象类是一个具有一个或多个纯虚函数的类。噢，太棒了！这很有帮助。\n\
  \n好了，纯虚函数是一个被标记为没有实现的虚成员函数。它很可能没有实现，是因为根据类中提供的信息（包括任何基类）是不可能实现。一种传统的、普通的非纯虚函数被称为具体函数（注意，具体函数可以是虚的）。\n\
  \n声明函数为纯虚函数的语法在以下类 `Account` 中进行了演示：\n\n```cpp\n// Account - 此类是一个抽象类\n\nclass Account\n\
  {\npublic:\n    Account(unsigned accNo, double initialBalance = 0.0);\n    // 访问函数\n\
  \    unsigned int accountNo( );\n    double acntBalance( );\n    static int noAccounts(\
  \ );\n    // 事务函数\n    void deposit(double amount);\n    // 以下是一个纯虚函数\n    virtual\
  \ void withdrawal(double amount) = 0;\nprotected:\n    // 将账户保存在链表中，这样账户数量\n   \
  \ // 限制\n    static int count; // 账户数量\n    unsigned accountNumber;\n    double\
  \ balance;\n};\n```\n\n`withdrawal()` 声明后的 `= 0` 表示程序员不打算定义此函数。该声明是给子类的占位符。期望 `Account`\
  \ 的子类用具体函数来重写此函数。程序员必须为每个未声明为纯虚的成员函数提供实现。\n\n![TechnicalStuff.eps](img/TechnicalStuff_fmt.jpeg)\
  \ 我觉得这种符号很愚蠢，我不像你一样喜欢它。但它会一直存在，所以你必须学会习惯它。这种符号有一个原因，虽然不恰恰是理由。每个虚函数必须在一个特殊表中有一个条目。该条目包含函数的地址。纯虚函数的条目是\
  \ 0。某些其他语言定义了 `abstract` 关键字——不，我的意思是关键字 `abstract`。\n\n抽象类不能实例化对象；也就是说，你不能从抽象类创建一个对象。例如，以下声明是不合法的：\n\
  \n```cpp\nvoid fn( )\n{\n    // 声明一个有 100 元的账户\n    Account acnt(1234, 100.00);//这是不合法的\n\
  \    acnt.withdrawal(50); // 你期望\n    // 此调用做什么？\n}\n```\n\n如果该声明被允许，生成的对象将是不完整的，缺乏某些功能。例如，之前的调用应该做什么？记住，没有\
  \ `Account::withdrawal()`。\n\n抽象类作为其他类的基类。`Account` 包含了与通用银行账户相关的所有属性。你可以通过继承 `Account`\
  \ 创建其他类型的银行账户。\n\n## 从抽象类中实现诚实的类\n\n\n\n\n抽象类的子类在所有纯虚拟函数都被重写之前，仍然是抽象类。`Savings`\
  \ 类不是抽象类，因为它用一个完全正确的定义重写了纯虚拟函数 `withdrawal()`。当对 `Savings` 类调用 `withdrawal()` 时，它知道如何执行该操作。`Checking`\
  \ 类也是如此，尽管答案不同。这两个类都不是虚函数类，因为 `withdrawal()` 函数重写了基类中的纯虚拟函数。\n\n## 传递抽象类\n\n由于你无法实例化抽象类，因此可以声明指向抽象类的指针或引用听起来可能很奇怪。然而，通过多态性，这并不像听起来那么疯狂。请考虑以下代码段：\n\
  \n```cpp\nvoid fn(Account *pAccount); // 这是合法的\n\nvoid otherFn( )\n{\n  Savings\
  \ s;\n  Checking c;\n  // 这是合法的，因为 Savings 是一个 Account\n  fn(&s);\n  // 此处也是如此\n\
  \  fn(&c);\n}\n```\n\n在这里，`pAccount` 被声明为指向 `Account` 的指针。但可以理解，当函数被调用时，传递将是某些非抽象子类对象的地址，例如\
  \ `Savings` 或 `Checking`。\n\n`fn()` 接收的所有对象将是 `Savings` 类或 `Checking` 类（或未来任何同样非抽象的\
  \ `Account` 子类）。该函数确保你永远不会传递 `Account` 类的实际对象，因为你根本无法创建一个这样的对象来传递。\n\n附带的 CD-ROM\
  \ 包含一组从 `Budget1` 到 `Budget5` 的程序。每个程序本质上解决同一个问题。每个程序都允许用户创建并收集一系列支票和储蓄账户的余额。然而，序列中的每个程序都比之前的程序更具面向对象。`Budget1`\
  \ 是一个完全函数式的实现，没有类的概念。`Budget2` 实现了独立的 `Savings` 和 `Checking` 类。`Budget3` 程序使用本章介绍的技术，将这两个类的相似之处提取到一个通用的、抽象的\
  \ `Account` 类中。`Budget4` 和 `Budget5` 则进一步使用了后续章节中介绍的功能。\n\n## 第五部分：可选功能\n\n![317266-pp0501.eps](img/317266-pp0501_fmt.jpeg)\n\
  \n### 在本部分中 . . .\n\n本书的目标不是让你变成一个 C++ 语言律师；而是让你对 C++ 基础和面向对象编程有坚实的理解。\n\n书的前几个部分涵盖了你编写良好的面向对象\
  \ C++ 程序所需要了解的基本特性。然而，C++ 是一门大语言（如果你问我的话，它有严重的“功能过载”），我还没有讨论许多特性，例如文件输入/输出标准模板库。第五部分弥补了这一缺陷。\n\
  \n在过去的几年里，C++ 程序员越来越多地利用该库的功能。附带 CD-ROM 上的 `BUGET4` 和 `BUGET5` 程序演示了如何做到。\n\n# 第\
  \ 22 章：一种新的赋值运算符，如果你决定接受的话\n\n### 本章内容\n- 引入赋值运算符\n- 了解为什么以及何时需要赋值运算符\n- 理解赋值运算符与拷贝构造函数之间的相似之处\n\
  \n内置数据类型是构建在语言中的，例如 `int`、`float` 和 `double` 以及各种指针类型。第 3 章和第 4 章描述了 C++ 为内置数据类型定义的运算符。C++\
  \ 允许程序员在这些内置运算符之外，为程序员创建的类定义运算符。这被称为运算符重载。\n\n通常，运算符重载是可选的，初学 C++ 的程序员不会尝试使用。许多丰富的\
  \ C++ 程序员（包括我在内）也不认为运算符重载是一个好主意。然而，你必须学会如何重载一个运算符：赋值运算符。\n\n### 将运算符与函数比较\n\n运算符无非是一个具有特殊语法的内置函数。下面的加法操作\n\
  \n```\na + b\n```\n\n可以被理解为写成：\n\n```\noperator+(a, b)\n```\n\n事实上，C++ 为每个运算符都提供了一个函数风格名称。运算符的函数名称是运算符符号，前面加上关键字\
  \ `operator`，后面加上适当的参数类型。例如，将一个 `int` 加到另一个 `int` 并生成一个 `int` 的 `+` 运算符被称为 `int\
  \ operator+(int, int)`。\n\n任何现有的运算符都可以为用户定义的类定义。因此，我可以创建一个 `Complex operator*(Complex&,\
  \ Complex&)`，它允许我乘以两个 `Complex` 类型的对象。新运算符可能与它所重载的运算符具有相同的语义，但不必如此。在重载运算符时适用以下规则：\n\
  \n- 程序员不能重载 `.`（点）、`::`（冒号）、`.*` 和 `? :`（三元）运算符。\n- 程序员不能发明新运算符。例如，你不能发明 `x $ y`\
  \ 操作。\n- 运算符的格式不能更改。因此，你不能定义 `%i` 操作，因为 `%` 已经定义为二进制运算符。\n- 运算符优先级不能更改。程序不能强制 `operator+`\
  \ 在 `operator*` 之前求值。\n- 应用于内置类型时不能重新定义运算符——你不能改变 `1 + 2` 的含义。现有的运算符只能对新定义的类型进行重载。\n\
  \n运算符重载是那些看起来比实际上要好的主意之一。根据我的经验，运算符重载引入的问题比它解决的要多，三个值得注意的例外是本章的主题。\n\n## 插入新运算符\n\
  \n插入和提取运算符 `<<` 和 `>>` 无非为一组输入/输出类重载的左移和右移运算符。这些定义可以在头文件 `iostream` 中找到（为什么每个程序都包含该文件）。因此，`cout\
  \ << “some string”` 变为 `operator<<(cout, “some string”)`。我们的老朋友 `cout` 和 `cin` 是分别绑定到控制台和键盘的定义对象。我在第\
  \ 23 章详细讨论这些。\n\n## 创建浅拷贝是一个深层次问题\n\n无论别人对运算符重载怎么想，你都需要为你生成的许多类重载赋值运算符。C++ 为所有类提供了\
  \ `operator()` 的默认定义。此默认定义执行逐成员的拷贝。这对于像 `int` 这样的内置类型效果非常好，因为唯一的“成员”就是整数本身。\n\n\
  ```cpp\nint i;\ni = 10; // “成员对成员”拷贝\n```\n\n同样的默认定义也应用于用户定义的类。在接的示例中，`source` 的每个成员都被拷贝到\
  \ `destination` 对应的成员中：\n\n```cpp\nvoid fn()\n{\n  MyStruct source, destination;\n\
  \  destination = source;\n}\n```\n\n赋值运算符适用于大多数类；然而，对于分配资源的类（例如堆内存），它是不正确的。程序员必须重载\
  \ `operator()` 来处理资源的转移。\n\n\n\n\n![Tip.eps](img/Tip_fmt.jpeg) 规则是这样的：在创建新对象时使用拷贝构造函数。如果左侧对象已经存在，则使用赋值运算符。\n\
  \n与拷贝构造函数一样，每当浅拷贝不再适用时，应该提供赋值运算符。（第 17 节讨论了浅拷贝与深拷贝构造函数。）一个简单的规则是：对于定义了用户自定义拷贝构造函数的类，提供赋值运算符。\n\
  \n注意，对于包含本身具有构造函数的成员的类，默认拷贝构造函数是有效的，如下例所示：\n\n```cpp\nclass Student\n{\npublic:\n\
  \    int nStudentID;\n    string sName;\n};\n```\n\nC++ 库类 `string` 确实会在堆上分配内存，因此该类的作者包含了一个拷贝构造函数和一个赋值运算符，这两者（人们希望）执行了创建字符串成功副本所需的所有操作。`Student`\
  \ 的默认拷贝构造函数会调用 `string` 的拷贝构造函数，将 `sName` 从一个学生拷贝到另一个。同样，`Student` 的默认赋值运算符也执行相同的操作。\n\
  \n## 载载赋值运算符\n\n`DemoAssignmentOperator` 程序演示了如何提供赋值运算符。该程序还包含一个拷贝构造函数以便对比：\n\n\
  ```cpp\n//DemoAssignmentOperator - 在用户自定义类上演示\n//赋值运算符\n#include <cstdio>\n#include\
  \ <cstdlib>\n#include <iostream>\n\n// 如果你的编译器不支持\n// C++ ’09 关键字 ‘nullptr’，则以下定义是必要的\n\
  #define nullptr 0\n\nusing namespace std;\n\n// DArray - 一个动态大小数组类，用于演示\n// 赋值和拷贝构造\n\
  // 运算符\nclass DArray\n{\npublic:\n    DArray(int nLengthOfArray = 0)\n    : nLength(nLengthOfArray),\
  \ pArray(nullptr)\n    {\n        cout << “Creating DArray of length = “ << nLength\
  \ << endl;\n        if (nLength > 0)\n        {\n            pArray = new int[nLength];\n\
  \        }\n    }\n    DArray(DArray& da)\n    {\n        cout << “Copying DArray\
  \ of length = “ << da.nLength << endl;\n        copyDArray(da);\n    }\n    ~DArray()\n\
  \    {\n        deleteDArray();\n    }\n    //赋值运算符\n    DArray& operator=(const\
  \ DArray& s)\n    {\n        cout << “Assigning source of length = “ << s.nLength\
  \ << “ to target of length = “ << this->nLength << endl;\n        //删除现有内容...\n\
  \        deleteDArray();\n        //...在替换为新内容之前\n        copyDArray(s);\n     \
  \   //返回现有对象的引用\n        return *this;\n    }\n    int& operator[](int index)\n\
  \    {\n        return pArray[index];\n    }\n    int size() { return nLength; }\n\
  \    void out(const char* pszName)\n    {\n        cout << pszName << “: “;\n  \
  \      int i = 0;\n        while (true)\n        {\n            cout << pArray[i];\n\
  \            if (++i >= nLength)\n            {\n                break;\n      \
  \      }\n            cout << “, “;\n        }\n        cout << endl;\n    }\nprotected:\n\
  \    void copyDArray(const DArray& da);\n    void deleteDArray();\n    int nLength;\n\
  \    int* pArray;\n};\n\n//copyDArray() - 创建 int 动态数组的副本\nvoid DArray::copyDArray(const\
  \ DArray& source)\n{\n    nLength = source.nLength;\n    pArray = nullptr;\n   \
  \ if (nLength > 0)\n    {\n        pArray = new int[nLength];\n        for(int i\
  \ = 0; i < nLength; i++)\n        {\n            pArray[i] = source.pArray[i];\n\
  \        }\n    }\n}\n//deleteDArray() - 返回堆内存\nvoid DArray::deleteDArray()\n{\n\
  \    nLength = 0;\n    delete pArray;\n    pArray = nullptr;\n}\nint main(int nNumberofArgs,\
  \ char* pszArgs[])\n{\n    // 一个动态数组并为其赋值值\n    DArray da1(5);\n    for (int i =\
  \ 0; i < da1.size(); i++)\n    {\n        // 使用用户定义的下标运算符访问\n        // 数组成员\n \
  \       da1[i] = i;\n    }\n    da1.out(“da1”);\n    // 现在使用拷贝构造函数创建此动态数组的\n   \
  \ // 副本；与 da2(da1) 相同\n    DArray da2 = da1;\n    da2[2] = 20; // 修改副本中的一个值\n  \
  \  da2.out(“da2”);\n    // 用原始 da1 覆盖现有的 da2\n    da2 = da1;\n    da2.out(“da2”);\n\
  \    // 在终止程序前等待用户准备好\n    // 以允许查看程序结果\n    system(“PAUSE”);\n    return 0;\n}\n\
  ```\n\n`DArray` 类定义了一个变长整数数组：在构造对象时，你告诉类要创建一个多大的数组。它通过将类封装在两个数据成员周围来实现：`nLength`（包含数组长度）和\
  \ `pArray`（一个指向在堆上分配的适当内存块的指针）。\n\n默认构造函数将 `nLength` 初始化为指定的长度，然后将 `pArray` 初始化为\
  \ `nullptr`。\n\n![c++'09.eps](img/c%2B%2B'09_fmt.jpeg) `nullptr` 关键字是 ’09 标准的新特性。如果你的编译器不识别\
  \ `nullptr`，你可以在程序顶部添加以下定义，就像我在这里做的那样：\n\n```cpp\n#define nullptr 0\n```\n\n如果数组长度实际上大于\
  \ 0，构造函数会在堆上分配一个相应大小的 `int` 数组。\n\n拷贝构造函数创建一个与源对象大小相同的数组，然后使用受保护方法 `copyDArray()`\
  \ 将源数组的内容拷贝到当前数组中。析构函数使用 `deleteDArray()` 方法将构造函数中分配的内存返回堆。该方法在内存被删除后会将指针 `pArray`\
  \ 置空。\n\n`operator=()` 是类的一个方法。在任何人看来，它看起来就像是一个紧跟在析构函数随后的拷贝构造函数。这是很典型的。考虑示例中的赋值\
  \ `da2 = da1`。对象 `da2` 已经与其关联了数据。在赋值过程中，必须通过调用 `deleteDArray()` 将原始动态数组返回堆，就像 `DArray`\
  \ 析构函数一样。然后，赋值运算符调用 `copyDArray()` 将新信息拷贝到对象中，就像拷贝构造函数一样。\n\n关于赋值运算符还有两个细节。首先，`operator=()`\
  \ 的返回类型是 `DArray&`，返回的值总是 `*this`。涉及赋值运算符的表达式具有值和类型，这两者都来自右侧参数。\n\n```cpp\ndouble\
  \ d1, d2;\nvoid fn(double);\nd1 = 2.0; // operator=() 的类型是 double\n```\n\n这使得程序员能够编写如下代码：\n\
  \n```cpp\nfn(d2 = d1 = 2.0); // 执行赋值并将结果值传递给 fn()\n```\n\n赋值 `d1 = 2.0` 的值（2.0）和类型（double）被传递给\
  \ `da2` 的赋值。在第二个例子中，赋值 `da2 = 3.0` 的值被传递给函数 `fn()`。\n\n用户创建的赋值运算符应该支持与版本相同的语义：\n\
  \n```cpp\nfn(DArray&); // 给定此声明...\nfn(da2 = da1); // ...这应该是合法的\n```\n\n第二个细节是\
  \ `operator=()` 是作为成员函数编写的。左侧参数被视为当前对象（`this`）。与其他运算符不同，赋值运算符不能用非成员函数重载。\n\n![c++'09.eps](img/c%2B%2B'09_fmt.jpeg)\
  \ 如果你不想定义自己的，可以删除默认赋值运算符：\n\n```cpp\nclass NonCopyable\n{\npublic:\n    NonCopyable(const\
  \ NonCopyable&) = delete;\n    NonCopyable& operator=(const NonCopyable&) = delete;\n\
  };\n```\n\n`NonCopyable` 类对象不能通过构造或赋值进行拷贝：\n\n```cpp\nvoid fn(NonCopyable& src)\n\
  {\n    NonCopyable copy(src); // 不允许\n    copy = src; // 也不允许\n}\n```\n\n如果你的编译器不支持此\
  \ ’09 扩展，可以将赋值运算符为为：\n\n```cpp\nclass NonCopyable\n{\nprotected:\n    NonCopyable(const\
  \ NonCopyable&) {};\n    NonCopyable& operator=(const NonCopyable&)\n    {\n   \
  \     return *this;\n    }\n};\n```\n\n之前的 `DemoAssignmentOperator` 示例程序实际上悄悄引入了第三种经常为容器类重载的运算符：下标运算符。\n\
  \n\n\n\n\n以下定义允许 `DArray` 类对象像内置数组一样被操作：\n\n```cpp\nint& operator[](int index)\n\
  {\n    return pArray[index];\n}\n```\n\n这使得像下面的赋值变得合法：\n\n```cpp\nint n = da[0];\
  \ // 变为 n = da.operator[](0);\n```\n\n然而，请注意，下标运算符返回的一个整数值，而是 `pArray` 内部值的引用。这允许调用函数像\
  \ `DemoAssignmnentOperator` 程序中所示修改该值：\n\n```cpp\nda2[2] = 20;\n```\n\n你可以在第 27\
  \ 章中看到为容器类重载索引运算符的更多示例。\n\n## 第 23 章：使用流 I/O\n\n## 本章内容\n* 执行输入/输出\n* 作为重载运算符重新发现流\
  \ I/O\n* 检查 `file` 类的其他方法\n* 使用流缓冲区 I/O\n\n在本章之前的程序从 `cin` 输入对象读取数据，并通过 `cout` 输出对象输出。也许你并没有真正深入思考过它，但这种输入/输出技术是所谓的流\
  \ I/O 的子集。\n\n在本章中，我将详细地介绍流 I/O。我必须警告你，流 I/O 是一个巨大的课题，无法在一个章节内完全涵盖——整本书都致力于这一个主题。幸运对我们双方来说，编写绝大多数程序，你不需要了解所有的流\
  \ I/O。\n\n## 流 I/O 如何工作\n\n流 I/O 基于 `operator>>()` 和 `operator<<()` 的重载版本。这些重载运算符的定义位于头文件\
  \ `iostream` 中，从第 1 章开始的所有程序都包含了该头文件。这些函数的代码包含在标准库中，你的 C++ 程序与之链接。\n\n以下代码显示了 `iostream`\
  \ 中出现的几个原型：\n\n```cpp\n对于输入，我们有：\nistream& operator>>(istream& source, char *pDest);\n\
  istream& operator>>(istream& source, string &sDest);\nistream& operator>>(istream&\
  \ source, int &dest);\nistream& operator>>(istream& source, double &dest);\n//...以此此类推...\n\
  \n对于输出，我们有：\nostream& operator<<(ostream& dest, char *pSource);\nostream& operator<<(ostream&\
  \ dest, string &sDest);\nostream& operator<<(ostream& dest, int source);\nostream&\
  \ operator<<(ostream& dest, double source);\n//...以此此类推...\n```\n\n当重载以执行 I/O 时，`operator>>`\
  \ 称为提取器（extractor），`operator<<()` 称为插入器（inserter）。`istream` 类是从文件或键盘等设备输入的基类。程序启动时，C++\
  \ 会打开 `istream` 对象 `cin`。同样，`ostream` 是输出的基础。\n\n## 默认流对象\n\nC++ 在你的程序开头添加一段代码，在\
  \ `main()` 获取控制权之前执行。除了其他外，这段代码创建了表 23-1 所示的默认输入/输出对象。\n\n### 表 23-1 标准流 I/O 对象\n\
  \n| 对象 | 类 | 用途 |\n| :--- | :--- | :--- |\n| `cin` | `istream` | 标准字符输入 |\n| `wcin`\
  \ | `wistream` | 标准 wchar_t “宽字符”输入 |\n| `cout` | `ostream` | 标准字符输出 |\n| `wcout`\
  \ | `wostream` | 标准 wchar_t “宽字符”输出 |\n| `cerr` | `ostream` | 标准错误输出 |\n| `wcerr`\
  \ | `wostream` | 标准错误 wchar_t “宽字符”输出 |\n| `clog` | `ostream` | 标准日志 |\n| `wclog`\
  \ | `ostream` | 标准 wchar_t “宽字符”日志 |\n\n你已经见过 `cin` 和 `cout`，它们分别从键盘读取输入并输出到显示器。当用户如下执行程序时，可以将标准输入和标准输出重定向到文件：\n\
  \n```bash\nC:>MyProgram <InputFile.txt >DefaultOut.txt\n```\n\n在这里，运算符的意思是：“执行 `MyProgram`，但从\
  \ `InputFile.txt` 而不是键盘读取标准输入，并将原本发送标准输出的内容发送文件 `DefaultOut.txt`。”\n\n重定向输入和输出在\
  \ Windows 的 DOS 提示符以及所有版本的 Unix 和 Linux 下均有效。当你尝试快速编写一些内容时，这是执行文件输入/输出的最简单的方法。\n\
  \n默认情况下，`cerr` 对象输出到显示器，就像 `cout` 一样，但它是被单独重定向的——重定向 `cout` 类型的默认输出到文件不会重定向 `cerr`\
  \ 输出。这允许程序即使 `cout` 已重定向到文件，也能向操作员显示错误消息。\n\n错误消息应该发送到 `cerr` 而不是 `cout`，以防操作员重定向了标准输出。\n\
  \n`wcin`、`wcout` 和 `wcerr` 分别是标准输入、输出和错误的宽版本。这些设计用于处理 Unicode 符号：\n\n```cpp\ncout\
  \ << “This is narrow output” << endl;\nwcout << L”This is wide output” << endl;\n\
  ```\n\n## 流输入/输出\n\n在头文件 `fstream` 中定义的 `ifstream` 和 `ofstream` 类是 `istream` 和 `ostream`\
  \ 的子类，旨在执行磁盘文件的流输入和输出。你可以在 `ifstream` 和 `ofstream` 对象上使用与 `cin` 和 `cout` 上使用的提取器和插入器。\n\
  \n`ifstream` 实际上是模板类 `basic_ifstream<T>` 的实例化，其中 `T` 设置为 `char`。我在第 26 章中讨论了模板类。`basic_ifstream<T>`\
  \ 模板类也用其他类型实例化，以提供不同类型的输入类。例如，宽流类 `wifstream` 基于 `basic_ifstream<T>`。`ofstream`\
  \ 类提供了用于打开文件的构造函数：\n\n```cpp\nifstream::ifstream(const char *pszFileName, ios_base::openmode\
  \ mode = ios_base::in);\nofstream::ofstream(const char *pszFileName, ios_base::openmode\
  \ mode = ios_base::out|ios_base::trunc);\n```\n\n第一个参数是指向要打开的文件名的指针。第二个参数指定模式。`openmode`\
  \ 类型是在 `ios_base` 中定义的整数类型。`ios_base` 中还定义了表 23-2 中列出的可能模式值。这些是通过位或运算组合在一起的位域。（有关位域或运算的解释，请参见第\
  \ 4 章。）`ifstream` 的默认模式是打开用于输入（这很符合逻辑）。\n\n### 表 23-2 控制文件打开的常量\n\n| 标志 | 含义 |\n\
  | :--- | :--- |\n| `ios_base::app` | 每次写入前移动到文件末尾。 |\n| `ios_base::ate` | 如果文件存在，打开文件后立即移动到文件末尾。\
  \ |\n| `ios_base::binary` | 以二进制模式打开文件（另一种方案是文本模式）。 |\n| `ios_base::in` | 打开文件用于输入（`istream`\
  \ 隐含）。 |\n| `ios_base::out` | 打开文件用于输出（`ostream` 隐含）。 |\n| `ios_base::trunc` | 如果文件存在，则截断文件（`ostream`\
  \ 的默认值）。 |\n\n`ofstream` 的默认值是打开用于输出并在文件已存在时截断它。截断的替代方案是 `ios_base::app`，这意味着如果文件已存在，则将新输出添加到文件末尾。这两个选项在文件不存在时都会创建一个文件。\n\
  \n例如，下面的 `StreamOutput` 程序打开了 `MyName.txt` 文件，然后向该文件写入一些重要且真实的信息：\n\n```cpp\n//\
  \ StreamOutput - Simple 输出到文件\n#include <fstream>\nusing namespace std;\n\nint main(int\
  \ nNumberofArgs, char* pszArgs[])\n{\n    ofstream my(“MyName.txt”);\n    my <<\
  \ “Stephen Davis is suave and handsome\\n”\n    << “and definitely not balding prematurely”\n\
  \    << endl;\n    system(“PAUSE”);\n    return 0;\n}\n```\n\n文件流类的析构函数会自动关闭关联的文件。在我简单的示例中，当\
  \ `my` 对象在从 `main()` 返回时离开域时，`MyName.txt` 文件被关闭。全局对象在程序终止时关闭。\n\n## 打开模式\n\n表 23-2\
  \ 显示了打开文件时可能的不同模式。然而，每当你打开文件时，都需要回答三个基本问题：\n\n\n\n\n\n你想从文件中读取还是向文件中写入？使用 `ifstream`\
  \ 进行读取，使用 `ofstream` 进行写入。如果你打算对同一个文件同时进行写入和读取，请使用 `fstream` 并将模式设置为 `in|out`，但祝你好运——更好的做法是完全写入一个文件，然后关闭它，再作为一个独立的对象重新打开进行读取。\n\
  \n如果你正在写入的文件且该文件已存在，你是想在现有内容的基础上（这种情况下使用 `ate` 模式打开），还是截断文件并重新开始（这种情况下使用 `trunc`）？\n\
  \n你是在读取或写入文本还是二进制数据？`ifstream` 和 `ofstream` 均默认使用文本模式。如果你正在读取或写入原始的非文本数据，请使用二进制模式。\n\
  \n### 二进制模式与文本模式\n\n二进制模式与文本模式的主要区别在于处理换行符的方式。Unix 操作系统编写于打字机仍然流行的时代（那时被称为“打字”而不是“键盘输入”）。Unix\
  \ 使用换行符后接回车符来结束句子。\n\n随后的操作系统认为没有理由继续使用两个字符来结束句子，但它们无法对使用哪种字符达成共识。有些使用回车符，另一些使用换行符（现在重命名为\
  \ newline）。C++ 标准规定使用单个换行符。\n\n当文件以文本模式打开时，C++ 库会在输出时将单个换行符转换为适用于你操作系统的格式，无论是回车加换行、单个回车、换行还是完全不同的内容。在读取文件时，它执行相反的转换。对于以二进制模式打开的文件，C++\
  \ 库不会进行此类转换。\n\n![Remember.eps](img/Remember_fmt.jpeg) 在处理非人类可读格式的文件时，务必使用二进制模式。否则，如果数据流中的某个字节恰好等于回车或换行符，文件\
  \ I/O 库将修改它。\n\n### 流状态管理\n\n嘿，文件，你现在什么状态？\n\n一个构造好的 `fstream` 对象（包括 `ifstream`\
  \ 和 `ofstream`）成为它所关联文件的代理。例如，流对象维护有关 I/O 过程的状态信息。如果发生了“坏”事，成员函数 `bad()` 将返回 `true`。这个模糊的术语意味着文件无法打开、某些内部对象损坏，或者情况整体非常糟糕。程度较轻的错误\
  \ `fail()` 表示发生了 `bad()` 事件，或者上次读取失败了——例如，如果你尝试读取一个 `int`，但程序能找到的只有一个导致 `fail()`\
  \ 但不是 `bad()` 的字符。成员函数 `good()` 在 `bad()` 和 `fail()` 均为 `false` 时返回 `true`。\n\n\
  对已设置错误的流对象进行任何输入或输出的尝试都将被忽略。成员函数 `clear()` 会清零 `fail` 标志，以便在错误是暂时的给你再次机会——通常情况下，`clear()`清除“失败”但不清除“坏”事。如果\
  \ `my.good()` 不为 `true`，所有向带有错误的 `ofstream` 对象输出的尝试都是无效的。\n\n![Tip.eps](img/Tip_fmt.jpeg)\
  \ 最后一段话是非常字面上的——只要你使用的流对象的内部错误状态不为零，就不可能进行输入或输出。如果错误是暂时的且你可以清除它，否则在你调用 `clear()`\
  \ 清除错误标志之前，程序甚至不会尝试操作。\n\n### 示例：读取整数\n\n你能给我展示一个例子吗？\n\n下面的示例程序演示了如何使用 `ifstream`\
  \ 类来提取一系列整数：\n\n```cpp\n// StreamInput - simple input from a file using fstream\n\
  \n#include <cstdio>\n#include <cstdlib>\n#include <fstream>\n#include <iostream>\n\
  \nusing namespace std;\n\nifstream& openFile()\n{\n    ifstream* pFileStream = 0;\n\
  \    for(;;)\n    {\n        // 打开用户指定的文件\n        string sFileName;\n        cout\
  \ << “Enter the name of a file with integers:\";\n        cin >> sFileName;\n  \
  \      // 打开文件读取\n        const char* pszFileName = sFileName.c_str();\n       \
  \ pFileStream = new ifstream(pszFileName);\n        if (pFileStream->good())\n \
  \       {\n            cerr << “Successfully opened “\n            << pszFileName\
  \ << endl;\n            break;\n        }\n        cerr << “Couldn’t open “ << pszFileName\
  \ << endl;\n        delete pFileStream;\n    }\n    return *pFileStream;\n}\n\n\
  int main(int nNumberofArgs, char* pszArgs[])\n{\n    // 获取文件流\n    ifstream& fileStream\
  \ = openFile();\n    // 当文件中没有更多数据时停止\n    while (!fileStream.eof())\n    {\n  \
  \      // 读取一个值\n        int nValue = 0;\n        fileStream >> nValue;\n      \
  \  // 如果文件读取失败则停止（可能因为\n        // 我们遇到了不是 int 的内容，\n        // 或者我们发现了一个后面没有任何换换符）\n\
  \        if (fileStream.fail())\n        {\n            break;\n        }\n    \
  \    // 输出刚刚读取的值\n        cout << nValue << endl;\n    }\n    system(“PAUSE”);\n\
  \    return 0;\n}\n```\n\n`openFile()` 函数提示用户输入要打开的文件名。该函数创建一个带有指定名称的 `ifstream()`\
  \ 对象。创建 `ifstream` 对象会自动打开文件以进行输入。如果文件打开成功，该函数返回指向 `ifstream` 对象的引用以供读取。否则，程序将删除该对象并重试。退出循环的唯一方法是输入有效文件名或终止程序。\n\
  \n![Tip.eps](img/Tip_fmt.jpeg) 如果打开失败，不要忘记删除 `pFileStream` 对象。这些是内存泄漏产生的隐蔽方式。\n\n\
  程序从 `fileStream` 读取整数值，直到达到 `eof()`。\n\n### 避免缓冲区溢出\n\n不要让缓冲区溢出！\n\n如果你仔细观察 `StreamInput`\
  \ 示例中的 `openFile()` 方法，你会看到另一种确保操作符不会溢出的方法。让我们回顾一下。我可以使用类似下面的代码：\n\n```cpp\nchar\
  \ szFileName[80]; // 任何数组大小都是可能的\ncin >> szFileName; // 输入文件名\n```\n\n你可能在本书的前几章节中看到这样的代码（那时你还在用\
  \ C++ 的“辅助轮器”）。这种方法的问题在于，没有任何地方告诉提取器缓冲区只有 80 个字符——它将继续读取，直到看到换行符，而换行符可能在几千个字符之后出现。\n\
  \n嗯，80 个字符有点小。我们把缓冲区大小增加到 256 个字符怎么样？这完全没切中重点；你使用这种方法时的隐含假设是任何缓冲区溢出都是诚实失误的结果（而且文件名非常长！）。情况越来越不再如此。几种主要的病毒是利用缓冲区溢出攻击传播的。（Wikipedia\
  \ 在该主题上有一篇有趣的文章：[`en.wikipedia.org/wiki/Buffer_overflow`](http://en.wikipedia.org/wiki/Buffer_overflow).）\n\
  \n避免缓冲区溢出的一种方法你在之前的章节中见过，是使用 `getline()` 方法将程序读取的字符数限制为缓冲区的大小：\n\n```cpp\nchar szFileName[80];\n\
  cin.getline(szFileName, 80); // 读取内容不超过 80 字符\n```\n\n这段代码段表示读取一行输入（到下一个换行符为止），但不会超过\
  \ 80 个字符，因为那是缓冲区的大小。未读取的任何字符将留给下一次 `getline()` 调用。\n\n另一种方法是让缓冲区大小适应可用字符的数量。`string`类的提取器足够智能，可以动态调整缓冲区以适应可用数据：\n\
  \n```cpp\nstring sFileName;\ncin >> sFileName; // string 调整缓冲区以适应输入量\n```\n\n对 `c_str()`\
  \ 调用返回指向 `string` 内部字符缓冲区的指针。当你需要 `char*` 而不是 `string` 对象时，这是必要的。然而，不要修改由 `c_str()`\
  \ 返回的字符字符串。此外，请注意一旦 `string` 对象被析构，字符缓冲区将立即返回栈。\n\n\n\n\n\n![Tip.eps](img/Tip_fmt.jpeg)\
  \ 让我再次警告你：从发生错误的输入流中读取数据，不仅不会返回任何内容，而且缓冲区也会保持不变。这个程序很容易得出一个错误的结论，认为它刚刚读取了之前读取过的相同值。此外，在发生错误的输入流上，`eof()`\
  \ 永远不会返回 `true`。\n\n该程序的输出如下（我为输入内容加了粗体）：\n\n```text\nEnter the name of a file with\
  \ integers:chicken\nCouldn’t open chicken\n\nEnter the name of a file with integers:integers.txt\n\
  Successfully opened integers.txt\n\n1\n2\n3\n4\n5\n6\nPress any key to continue\
  \ . . .\n```\n\n## 流类的其他方法\n\n`istream` 和 `ostream` 类提供了许多方法，如表 23-3 所示（并不是完整的列表）。这些函数的原型定义在\
  \ `fstream` 头文件中。它们将在本节的剩余部分进行详细描述。\n\n### 表 23-3 I/O 流类主要方法\n\n| 方法 | 含义 |\n| :---\
  \ | :--- |\n| `bool bad()` | 如果发生了严重错误，则返回 `true`。 |\n| `void clear(iostate flags\
  \ = ios_base::goodbit)` | 清除（或设置）I/O 状态标志。 |\n| `void close()` | 关闭与流对象关联的文件。 |\n\
  | `bool eof()` | 如果文件中没有更多字符可供读取，则返回 `true`。 |\n| `iostate exception()` | 返回会导致异常的条件。\
  \ |\n| `void exception(iostate)` | 设置会导致异常的条件。多个条件可以进行位“或”操作；例如，`exception(ios_base::badbit\\\
  |ios_base::failbit)`。关于异常的讨论请参见第 24 章。 |\n| `char fill()`, `char fill(char newFill)`\
  \ | 返回或设置填充字符。 |\n| `fmtflags flags()`, `fmtflags flags(fmtflags f)` | 返回或设置格式标志。（参见下一节。）\
  \ |\n| `void flush()` | 将输出缓冲区刷新到磁盘。 |\n| `int gcount()` | 返回上次输入期间读取的字节数。 |\n|\
  \ `char get()` | 从文件中读取单个字符。 |\n| `char getline(char* buffer, int count, char delimiter\
  \ = ‘\\n’)` | 读取多个字符，直到遇到文件结束、遇到分隔符，或读取了 `count - 1` 个字符。在读取的行末尾添加一个空字符。不要将读取的分隔符存入缓冲区。\
  \ |\n| `bool good()` | 如果没有设置任何错误条件，则返回 `true`。 |\n| `void open(const char* filename,\
  \ openmode mode = default)` | 参数与构造函数相同。在现有对象上执行与构造函数在创建新对象时执行相同的打开文件操作。 |\n| `streamsize\
  \ precision()`, `streamsize precision(streamsize s)` | 读取或设置浮点变量显示的数字位数。 |\n| `ostream&\
  \ put(char ch)` | 将单个字符写入流中。 |\n| `istream& read(char* buffer, streamsize num)`\
  \ | 读取一个块数据。读取 `num` 个字节或直到遇到文件结束，以较发生者为准。 |\n| `istream& seekg(pos_type position)`,\
  \ `istream& seekg(off_type offset, ios_base::seekdir)` | 将读取指针置于文件开头后的 `position`\
  \ 字节处或当前位置后的 `offset` 字节处。（详情参见本节。） |\n| `istream& seekp(pos_type position)`, `istream&\
  \ seekp(off_type offset, ios_base::seekdir)` | 设置写入指针。 |\n| `fmtflags setf(fmtflags)`\
  \ | 设置特定的格式标志。返回旧值。 |\n| `pos_type tellg()` | 返回读取指针的位置。 |\n| `pos_type tellp()`\
  \ | 返回写入指针的位置。 |\n| `fmtflags unsetf(fmtflags)` | 清除特定的格式标志。返回旧值。 |\n| `int width()`,\
  \ `int width(int w)` | 读取或设置下一个格式化输出语句要显示的字符数。 |\n| `ostream& write(const char*\
  \ buffer, streamsize num)` | 向输出文件写入一个块数据。 |\n\n## 直接读写流\n\n插入运算符（inserter）和提取运算符（extractor）为读取格式化输入提供了一种方便的机制。然而，有时你只想说：“把它给我吧；我不在乎格式是什么。”在这种背景下，几种方法非常有用。\n\
  \n最简单的函数 `get()` 只是返回输入文件中的下一个字符。其对应的输出函数是 `put()`。函数 `getline()` 返回一个字符字符串，直到遇到某个终止符——默认是换行符。`getline()`\
  \ 会剥离终止符，但不会尝试重新格式化或通过方式解释输入。\n\n成员函数 `read()` 更加基础。该函数读取你指定的字符数，如果程序遇到文件结束，则读取较少的字符。`gcount()`\
  \ 函数总是返回实际读取的字符数。其对应的输出函数是 `write()`。\n\n下面的示例程序使用 `read()` 和 `write()` 函数，为你提供的任何文件创建备份，方法是通过在文件名末尾添加\
  \ `\".backup\"` 字符串来创建副本：\n\n```cpp\n// FileCopy - 为传递给程序的文件创建备份\n#include <cstdio>\n\
  #include <cstdlib>\n#include <fstream>\n#include <iostream>\n\nusing namespace std;\n\
  \nint main(int NumberofArgs, char* pszArgs[]) {\n    // 程序遍历参数，记住 pszArgs[0] 指向程序的名称。\n\
  \    for (int n = 1; n < NumberofArgs; n++) {\n        // 对于每个作为参数传递的源文件，程序通过在末尾添加\
  \ “.backup”来创建目标。\n        const char* pszSource = pszArgs[n];\n        string target\
  \ = string(pszSource) + \".backup\";\n        const char* pszTarget = target.c_str();\n\
  \n        // 现在打开源文件读取并目标文件写入，指定如果目标文件已存在则截断。\n        ifstream input(pszSource,\
  \ ios_base::in|ios_base::binary);\n        ofstream output(pszTarget, ios_base::out|ios_base::binary|ios_base::trunc);\n\
  \n        if (input.good() && output.good()) {\n            cout << \"Copying \"\
  \ << pszSource << \"...\";\n            char buffer[4096];\n            // 读取并写入块，直到发生错误或读取到达\
  \ EOF\n            while(!input.eof() && input.good()) {\n                input.read(buffer,\
  \ 4096);\n                output.write(buffer, input.gcount());\n            }\n\
  \            cout << \"finished\" << endl;\n        } else {\n            cerr <<\
  \ \"Couldn’t copy \" << pszSource << endl;\n        }\n    }\n    system(\"PAUSE\"\
  );\n    return 0;\n}\n```\n\n注意在调用 `write()` 时，程序使用了 `gcount()` 返回的值而不是硬编码的 4096。这是因为除非源文件长度恰好是\
  \ 4096 字节的整数倍，否则最后一次 `read()` 在遇到文件结束之前获取的字节数较少。\n\n## 控制格式\n\n`flags()`、`setf()`\
  \ 和 `unsetf()` 方法都用于设置或检索 `istream` 或 `ostream` 对象维护的一组格式标志。这些格式标志在对象创建时被设置为默认值，代表最常见的格式选项。选项见表\
  \ 23-4。\n\n### 表 23-4 I/O 流格式标志\n\n| 标志 | 如果标志为真则... |\n| :--- | :--- |\n| `boolalpha`\
  \ | 显示为 `true` 或 `false` 而不是 1 或 0。 |\n| `dec` | 以十进制格式读取或写入整数（默认）。 |\n| `fixed`\
  \ | 以固定点显示浮点数，而不是科学计数法（默认）。 |\n| `hex` | 以十六进制格式读取或写入整数。 |\n| `left` | 输出左对齐（即在右侧填充）。\
  \ |\n| `oct` | 以八进制格式读取或写入整数。 |\n| `right` | 输出右对齐（即在左侧填充）。 |\n| `scientific` |\
  \ 以科学计数法显示浮点数。 |\n\n\n\n\n\n| `showbase` | 在八进制输出时显示前导 0，在十六进制输出时显示前导 0x。 |\n| `showpoint`\
  \ | 即使小数部分为 0，浮点数输出也显示小数点。 |\n| `skipws` | 使用提取器读取时跳过空白字符。 |\n| `unitbuf` | 在每次输出操作后刷新输出。\
  \ |\n| `uppercase` | 在输出时将小写字母替换为对应的大写字母。 |\n\n以下代码段曾用于以十六进制格式显示数字（参见第 4 章中的 `BitTest`\
  \ 程序）：\n\n```cpp\n// read the current format flags\n// (this is important when you\
  \ need to restore the output\n// format at a later time)\nios_base::fmtflags prevValue\
  \ = cout.flags();\n\n// clear the decimal flag\ncout.unsetf(cout.dec);\n\n// now\
  \ set the hexadecimal flag\ncout.setf(cout.hex);\n\n// ...do stuff..\n\n// call\
  \ flags() to restore the format flags to their\n// previous value\ncout.flags(prevValue);\n\
  ```\n\n在此示例中，程序必须同时使用 `setf()` 设置十六进制标志，并使用 `unsetf()` 取消（即清除）十进制标志，因为十进制、八进制和十六进制标志是互斥的。\n\
  \n对 `flags()` 的最后调用将格式标志恢复到之前读取的值。如果程序即将终止，则这种操作这种必要的。\n\n进一步的格式控制由 `width()` 方法提供，该方法设置下一次输出操作的最小宽度。如果字段未达到指定的宽度，插入器会添加所需的填充字符数量。默认填充字符是空格，但你可以通过调用\
  \ `fill()` 来更改它。C++ 是在左侧还是右侧添加填充字符，取决于是否设置了左侧或右侧的格式标志。\n\n例如，以下段代码：\n\n```cpp\n\
  int i = 123;\ncout.setf(cout.right);\ncout.unsetf(cout.left);\ncout.fill('+');\n\
  cout << \"i = [\";\ncout.width(10);\ncout << i;\ncout << \"]\" << endl;\n```\n\n\
  生成了以下输出：\n\n```\ni = [+++++++123]\n```\n\n![Warning(bomb).eps](img/Warning(bomb)_fmt.jpeg)\
  \ 注意，`width()` 方法仅适用于紧后的下一个输出语句。与其他格式标志不同，在输出每个值之后，必须重置 `width`。\n\n### endl 是怎么的？\n\
  \n书中的大多数程序通过插入对象 `endl` 来终止输出流。然而，某些程序在文本中包含 `\\n` 以输出换行符。这是怎么回事？\n\n`\\n` 实际上是换行符。表达式\
  \ `cout << \"First line\\nSecond line\";` 输出两行。`endl` 对象输出一个换行符，但又进了一步。\n\n磁盘是慢速设备。比需要更频繁地写入磁盘会显著减慢程序速度。为了避免这种情况，`fstream`\
  \ 类将输出收集到内部缓冲区中。该类在缓冲区满时将内容写入磁盘（这被称为刷新缓冲区）。`endl` 对象输出一个换行符然后刷新输出缓冲区。成员函数 `flush()`\
  \ 刷新输出缓冲区而不在末尾添加换行符。\n\n注意，标准错误对象 `cerr` 不对输出进行缓冲。\n\n## 在文件中定位指针\n\n`istream` 类维护一个读取指针，该指针是文件中下一个要读取的字节的位置。你可以使用\
  \ `tellg()` 方法获取此值。（同样，`tellp()` 返回指向 `ostream` 对象中下一个写入位置的指针。）保存位置后，稍后可以通过将 `tellg()`\
  \ 读取的值传递给 `seekg()` 返回到相同的位置。\n\n`seekg()` 的重载版本接受的不是绝对位置，而是偏移量和搜索方向。搜索方向的合法值是以下三个常量之一：\n\
  \n- `ios_base::beg` (beg 表示文件开头）：偏移量必须为正，并被视为从文件开始的字节数，\n- `ios_base::end` (end\
  \ 表示文件结尾）：偏移量必须为负，并被视为从文件结束的字节数。\n- `ios_base::cur` (cur 表示当前位置）：偏移量可以正也可以负，是从当前位置移动指针（向前或向后）的字节数。\n\
  \n在文件中移动读取（或写入）指针可能非常慢（用计算机术语来说），因此在使用此功能时要审慎。\n\n## 使用 stringstream 子类\n\n流类为程序员提供了机制，可以轻松将输入拆分到\
  \ `int`、`float` 和字符数组变量（以及其他）中。一组所谓的 `stringstream` 类允许程序像从文件读取一样从内存中的字符数组中读取内容。`istringstream`\
  \ 和 `ostringstream` 类定义在包含文件 `sstream` 中。\n\n![Tip.eps](img/Tip_fmt.jpeg) 这些类的旧版本是\
  \ `iststream` 和 `oststream`，定义在包含文件 `strstream` 中。\n\n`stringstream` 类与相应的基于文件的类具有相同的语义。这在下面的\
  \ StringStream 程序中得到了体现，该程序从文件中解析账户信息：\n\n```cpp\n// StringStream - read and parse\
  \ the contents of a file\n#include <cstdio>\n#include <cstdlib>\n#include <fstream>\n\
  #include <sstream>\n#include <iostream>\n\nusing namespace std;\n\n// parseInfo\
  \ - read passed buffer as\n// actual file - read the following\n// format:\n// name,\
  \ account\n// return true if all worked\nbool parseString(const char* pString, char*\
  \ pName, int arraySize,\nlong& accountNum, double& balance)\n{\n    // associate\
  \ an istringstream object with the input\n    // string\n    istringstream inp(pString);\n\
  \    // read up to the comma\n    inp.getline(pName, arraySize, ',');\n    // now\
  \ the account number\n    inp >> accountNum;\n    // and the balance\n    inp >>\
  \ balance;\n    // return error status\n    return !inp.fail();\n}\n\nint main(int\
  \ nNumberArgs, char* pszArgs[])\n{\n    // must provide filename\n    char szFileName[128];\n\
  \    cout << \"Input name of file to parse:\";\n    cin.getline(szFileName, 128);\n\
  \n    // get a file stream\n    ifstream* pFileStream = new ifstream(szFileName);\n\
  \    if (!pFileStream->good())\n    {\n        cerr << \"Can’t open \" << pszArgs[1]\
  \ << endl;\n        return 0;\n    }\n\n    // read a line out of file, parse it\
  \ and display\n    // results\n    for(int nLineNum = 1;;nLineNum++)\n    {\n  \
  \      // read a buffer\n        char buffer[256];\n        pFileStream->getline(buffer,\
  \ 256);\n        if (pFileStream->fail())\n        {\n            break;\n     \
  \   }\n        cout << nLineNum << \":\" << buffer << endl;\n\n        // parse\
  \ the individual fields\n        char name[80];\n        long accountNum;\n    \
  \    double balance;\n        bool result = parseString(buffer, name, 80, accountNum,\
  \ balance);\n        if (result == false)\n        {\n            cerr << \"Error\
  \ parsing string\\n\" << endl;\n            continue;\n        }\n\n        // output\
  \ the fields we parsed\n        cout << \"Read the following fields:\" << endl;\n\
  \        cout << \" name = \" << name << \"\\n\"\n             << \" account = \"\
  \ << accountNum << \"\\n\"\n             << \" balance = \" << balance << endl;\n\
  \n        // put the fields back together in a different\n        // order (inserting\
  \ the ‘ends’ makes sure the\n        // buffer is null terminated\n        ostringstream\
  \ out;\n        out << name << \", \"\n            << balance << \" \"\n       \
  \     << accountNum << ends;\n\n        string oString = out.str();\n        cout\
  \ << \"Reordered fields: \" << oString << endl;\n    }\n\n    system(\"PAUSE\");\n\
  \    return 0;\n}\n```\n*(注：由于原文文本中代码块存在错乱和重复，翻译时已根据逻辑关系对代码结构进行了重组和清理，以确保可读性。)*\n\
  \n\n\n\n在调用 `parseString()` 之后，`main()` 输出从文件中读取的缓冲区，随后是解析后的值。然后，它使用 `ostringstream`\
  \ 类重新构建一个具有相同数据但不同不同的字符串对象（仅仅是为了好玩）。\n\n示例执行的结果所示：\n\n```\nInput name of file to\
  \ parse:Accounts.txt\n\n1:Chester, 12345 56.60\nRead the following fields:\nname\
  \ = Chester\naccount = 12345\nbalance = 56.6\nReordered fields: Chester, 56.6 12345\n\
  \n2:Arthur, 34567 67.50\nRead the following fields:\nname = Arthur\naccount = 34567\n\
  balance = 67.5\nReordered fields: Arthur, 67.5 34567\n\n3:Trudie, 56x78 78.90\n\
  Error parsing string\n\n4:Valerie, 78901 89.10\nRead the following fields:\nname\
  \ = Valerie\naccount = 78901\nbalance = 89.1\nReordered fields: Valerie, 89.1 78901\n\
  \nPress any key to continue . . .\n```\n\n在继续之前思考一下。注意程序在输入文件出现错误后是如何能够重新同步的。同样，注意程序核心——`parseString()`\
  \ 函数的简单性。考虑一下如果没有 `istringstream` 类辅助，这个函数会变成什么样。\n\n## 操作操纵符 (Manipulating Manipulators)\n\
  \n你可以使用流 I/O 通过默认格式输出数字和字符字符串。通常默认设置是可以的，但有时它们并不够用。\n\n例如，当我最近的一个程序的财务计算结果总和显示为\
  \ 249.600006 而不是 249.6（或者最好是 249.60）时，我并不高兴。必须有一种方法能让默认设置符合我的意愿。一如既往，C++ 提供了两种方法来控制输出格式。\n\
  \n![警告 Warning(bomb).eps](img/Warning(bomb)_fmt.jpeg) 根据你编译器的默认设置，你可能会得到 249.6 作为输出。尽管如此，你真正想要的是\
  \ 249.60。\n\n首先，你可以通过在流对象上调用一系列成员函数来控制格式。例如，显示的有效位数是通过如下使用 `precision()` 函数设置的（见表\
  \ 23-3）：\n\n```cpp\n#include <iostream>\n\nvoid fn(double interest, double dollarAmount)\n\
  {\ncout << “Dollar amount = “;\ncout.precision(2);\ncout << dollarAmount;\ncout.precision(4);\n\
  cout << interest\n<< endl;\n}\n```\n\n在这个示例中，`precision()` 函数在输出值 `dollarAmount`\
  \ 之前立即将精度设置为 2。这给了你一个像 249.60 的数字，即你想要的结果。然后它在输出 `interest` 之前将精度设置为 4。\n\n第二方法使用了所谓的“操纵符”（manipulators）。（听起来像是纽约证券交易所幕后的某人，不是吗？）操纵符是定义在\
  \ `iomanip` 头文件中的对象，其效果与调用成员函数相同。（你必须包含 `iomanip` 才能访问这些操纵符。）操纵符唯一的优势是程序可以直接将它们插入流中，而无需求助于单独的函数调用。\n\
  \n最常见的操纵符及其对应的含义如表 23-5。\n\n### 表 23-5 常见操纵符和流格式控制函数\n\n| 操纵符 | 成员函数 |  |\n| :---\
  \ | :--- | :--- |\n| `dec` | `setf(dec)` | 将进制设为 10 |\n| `hex` | `setf(hex)` | 将进制设为\
  \ 16 |\n| `oct` | `setf(oct)` | 将进制设为 8 |\n| `setfill(c)` | `fill(c)` | 将填充字符设置为\
  \ `c` |\n| `setprecision(n)` | `precision(n)` | 将显示精度设置为 `n` |\n| `setw(n)` | `width(n)`\
  \ | 将字段宽度设置为 `n` 个字符* |\n\n*\\*输出下一个字段后，它将返回默认值。*\n\n如果你重写前面的示例以使用操纵符，程序将如下所示：\n\
  \n```cpp\n#include <iostream>\n#include <iomanip>\n\nvoid fn(double interest, double\
  \ dollarAmount)\n{\ncout << “Dollar amount = “\n<< setprecision(2) << dollarAmount\n\
  << setprecision(4) << interest\n<< endl;\n}\n```\n\n## 第 24 章：处理错误 — 异常\n\n### 本章内容\n\
  - 介绍一种处理程序错误的异常方式\n- 发现老旧错误返回中的问题\n- 检查抛出和捕获异常\n- 为 throw 增加更多火力\n\n我知道这很难接受，但函数偶尔不会正常工作——即使是我的也是。报告失败的传统手段是向调用者返回某些指示。C++\
  \ 包含了一种新的、改进的捕和处理错误的机制，称为异常。异常被定义为“规则或原则不适的情况”。也被定义为对某事的反对意见。这两种定义都是可行的：异常是程序执行期间发生的意外（且推测是不受欢迎的）条件。\n\
  \n异常机制基于 `try`、`catch` 和 `throw` 关键字（没错，更多你不能使用的变量名）。简而言，它的工作原理如下：一个函数尝试（try）执行一段代码。如果代码检测到问题，它会抛出一个错误指示，调用函数必须对其进行捕获（catch）。\n\
  \n下面的代码片段演示了这在 1 和 0 中是如何工作的：\n\n```cpp\n// Factorial - 使用函数\n// 演示异常\n//\n#include\
  \ <cstdio>\n#include <cstdlib>\n#include <iostream>\n\nusing namespace std;\n\n\
  // factorial - 计算阶乘\nint factorial(int n) throw (string)\n{\n// 最好先检查这个\nif (n <\
  \ 0)\n{\nthrow string(“Argument for negative”);\n}\n// 继续计算\nint accum = 1;\nwhile(n\
  \ > 0)\n{\naccum *= n;\nn--;\n}\nreturn accum;\n}\n\nint main(int nofArgs, char*\
  \ pszArgs[])\n{\ntry\n{\n// 这将正常工作\ncout << “Factorial of 3 is “\n<< factorial(3)\
  \ << endl;\n// 将产生异常\ncout << “Factorial of -1 is “\n<< factorial(-1) << endl;\n\
  // 控制永远不会到达这里\ncout << “Factorial of 5 is “\n<< factorial(5) << endl;\n}\n// 控制传递到这里\n\
  catch(string error)\n{\ncout << “Error occurred: << << error << endl;\n}\ncatch(...)\n\
  {\ncout << “Default catch “ << endl;\n}\n// 在终止前等待用户准备\n// 允许用户看到程序\nsystem(“PAUSE”);\n\
  return 0;\n}\n```\n\n## 证明新错误机制的合理？\n\n像 FORTRAN 那样使用错误返回有什么问题？阶乘不能为负数，所以我可以说：“好的，如果\
  \ factorial() 检测到错误，它会返回一个负数。实际值指示问题的来源。”这有什么问题？这是多年来的做法。\n\n遗憾的是，会产生几个问题。首先，虽然阶乘的结果不能为负数，但其他函数并没有那么幸运。例如，你不能对负数取对数，但负返回值的技巧在这里行不通——对数可以是负数也可以是正数。\n\
  \n其次，整数可以存储的信息实在太多了。也许可以用 -1 表示“参数为负数”，用 -2 表示“参数太大”。但是，如果参数太大，你想知道参数是多少，因为这些信息可能帮助你调试问题。没有地方可以存储这类信息。\n\
  \n\n\n\n第三，错误返回值的处理是可选的。假设有人写了 `factorial()` 函数，它会尽职地检查参数，当参数超出范围时返回一个负数。如果调用 `factorial()`\
  \ 的函数没有检查错误返回，那么返回错误值就无济于事。当然，你可以发出各种严厉的威胁，例如“你不检查错误返回，否则后果自负”，而且程序员可能初衷是好的，但你们都知道，人会偷懒，并回到他们旧的不检查错误的习惯。\n\
  \n即使你检查了来自 `factorial()` 或其他函数的错误返回，该函数又能对错误做什么呢？它可能无非输出一条你自定义的错误消息，并向调用者返回另一个错误指示，而调用者可能也做同样的事情。很快，错误检测代码就会比“真实”代码要多得多。\n\
  \n异常机制通过从正常代码路径中移除错误路径来解决这些问题。此外，异常使得错误处理变得具有强制性。如果你的函数没有处理抛出的异常，控制权将沿着调用函数链向上传递，直到\
  \ C++ 找到能够处理该错误的函数。这同时也赋予了你灵活性，可以忽略那些你无论如何也无法处理的错误。只有那些能够解决问题的函数才需要捕获异常。\n\n## 检查异常机制\n\
  \n仔细观察代码处理异常所经历的步骤。当 `throw` 发生时，C++ 首先将抛出的对象拷贝到某个中性位置。然后它开始寻找当前 `try` 块的末尾。\n\n\
  如果在当前函数中没有找到 `try` 块，控制权将传递给调用函数。然后对该函数进行搜索。如果在该处没有找到 `try` 块，控制权将传递给调用它的函数，依此类推沿着调用函数栈向上移动。这个过程被称为栈回（unwinding\
  \ the stack）。\n\n栈回的一个重要特性是，当每个栈被回溯时，超出作用域的对象会被析构，就像函数执行了 `return` 语句一样。这防止了程序丢失资源或留下悬空对象。\n\
  \n当找到外层的 `try` 块时，代码会搜索紧随 `catch` 块括号之后的第一个 `catch` 句。如果抛出的对象与 `catch` 语句中指定的参数类型匹配，控制权将传递到该\
  \ `catch` 句。如果不匹配，则检查下一个 `catch` 句。如果没有找到匹配的 `catch` 句，代码将不断向外螺旋搜索更高层级的 `try` 块，直到找到适当的\
  \ `catch` 为止。如果未找到 `catch` 句，程序将终止。\n\n考虑以下示例：\n\n```cpp\n// CascadingException\
  \ - 下面的程序演示\n// 栈回的示例；它还\n// 显示了 throw() 子句如何在\n// 函数声明中用法\n#include <cstdio>\n\
  #include <cstdlib>\n#include <iostream>\n\nusing namespace std;\n\n// 我们之后会用到的一些函数原型\n\
  void f1() throw();\nvoid f2();\nvoid f3() throw(int);\n\nclass Obj\n{\npublic:\n\
  Obj(char c) : label(c)\n{ cout << “Constructing object “ << label << endl;}\n~Obj()\n\
  { cout << “Destructing object “ << label << endl; }\n\nprotected:\nchar label;\n\
  };\n\nint main(int nNumberofArgs, char* pszArgs[])\n{\n    f1();\n    // 等待用户准备好后再终止程序\n\
  \    // 以允许用户看到程序结果\n    system(“PAUSE”);\n    return 0;\n}\n\n// f1 - 在函数声明中使用空的\
  \ throw() 子句\n// 意味着它不会抛出异常\nvoid f1() throw()\n{\n    Obj a('a’);\n    try\n  \
  \  {\n        Obj b('b’);\n        f2();\n    }\n    catch(float f)\n    {\n   \
  \     cout << “Float catch” << endl;\n    }\n    catch(int i)\n    {\n        cout\
  \ << “Int catch” << endl;\n    }\n    catch(...)\n    {\n        cout << string(“Generic\
  \ catch”) << endl;\n    }\n}\n\n// f2 - 在函数声明中缺少 throw() 子句\n// 意味着它可能会\n// 抛出任何对象\n\
  void f2()\n{\n    try\n    {\n        Obj c('c’);\n        f3();\n    }\n    catch(string\
  \ msg)\n    {\n        cout << “String catch” << endl;\n    }\n}\n\n// f3 - 此函数可能会抛出一个\
  \ int 类型对象\nvoid f3() throw(int)\n{\n    Obj d('d’);\n    throw 10;\n}\n```\n\n\
  执行此程序的输出结果如下：\n\n```\nConstructing object a\nConstructing object b\nConstructing\
  \ object c\nConstructing object d\nDestructing object d\nDestructing object c\n\
  Destructing object b\nInt catch\nDestructing object a\nPress any key to continue\
  \ . . .\n```\n\n首先，你看到四个对象 `a`、`b`、`c` 和 `d` 被构造，因为 `main()` 调用了 `f1()`，`f1()` 调用了\
  \ `f2()`，`f2()` 调用了 `f3()`。然而，`f3()` 没有返回而是抛出了整数 `10`。由于 `f3()` 中没有定义 `try` 块，C++\
  \ 回溯了 `f3()` 的栈，导致对象 `d` 被析构。链中的下一个函数 `f2()` 定义了一个 `try` 块，但它唯一的 `catch` 句是处理 `string`\
  \ 的，并不匹配 `int`。因此，C++ 继续回溯 `f2()` 的栈，导致对象 `c` 被析构。回到 `f1()`，C++ 找到了另一个 `try` 块。退出该块导致对象\
  \ `b` 离开作用域。下一个 `catch` 句匹配 `int`，因此控制权传递到该 `catch` 句。`catch(...)` 句捕获任何异常，但由于已经找到了匹配的\
  \ `catch` 句，而被跳过。控制权传递到 `main()`。![Tip.eps](img/Tip.jpeg) 注意 `f2()` 没有声明它可能抛出的类型，但\
  \ `f1()` 和 `f3()` 声明了。为什么 `throw` 规格是可选的？首先，新标准为了与不声明异常的代码保持兼容，在异常机制本身出现很久之后才添加了它。在声明中，`throw`\
  \ 描述符是可选的。此外，如果要包含 `f2()` 抛出的 `int` 类型，必须这样声明：\n\n`void f2() throw(int);`\n\n尽管\
  \ `f2()` 并没有直接抛出 `int`，它通过调用 `f3()` 间接抛出。\n\n## 我可以抛出什么类型的内容\n\n`throw` 关键字后面的内容实际上是一个创建一个对象的表达式。在之前的示例中，我抛出了\
  \ `int` 和 `string` 对象，但 `throw` 可以处理任何类型的对象。这意味着你可以抛出几乎任何想要的信息。考虑对阶乘程序的以下更新，`CustomExceptionClass`：\n\
  \n```cpp\n// CustomException - 通过创建\n// 异常类来演示异常机制的灵活性\n//\n#include <cstdio>\n\
  #include <cstdlib>\n#include <iostream>\n#include <sstream>\n\nusing namespace std;\n\
  \n// MyException - 通用异常处理类\nclass MyException\n{\npublic:\nMyException(const char*\
  \ pMsg, int n,\nconst char* pFunc,\nconst char* pFile, int nLine)\n: msg(pMsg),\
  \ errorValue(n),\nfuncName(pFunc), file(pFile), lineNum(nLine)\n{}\n\nvirtual string\
  \ display()\n{\n    ostringstream out;\n    out << “Error <” << msg << “>”\n   \
  \ << “ - value is “ << errorValue << “\\n”\n    << “in function “ << funcName <<\
  \ “()\\n”\n    << “in file “ << file\n    << “ line #” << lineNum << ends;\n   \
  \ return out.str();\n}\n\nprotected:\n// 错误消息\nstring msg;\nint errorValue;\n//\
  \ 函数名、文件名和发生错误\n// 的行号\nstring funcName;\nstring file;\nint lineNum;\n};\n\n// factorial\
  \ - 计算阶乘\nint factorial(int n) throw(MyException)\n{\n    // 你无法处理 n 的负值；\n    //\
  \ 最好先检查这个条件\n    if (n < 0)\n    {\n        throw MyException(“Negative argument\
  \ not allowed”,\nn, __func__, __FILE__, __LINE__);\n    }\n    // 继续计算阶乘\n}\n```\n\
  \n\n\n\n```cpp\nint accum = 1;\n\nwhile(n > 0)\n{\n  accum *= n;\n  n--;\n}\n\n\
  return accum;\n}\n\nint main(int nNumberofArgs, char* pszArgs[])\n{\n  try\n  {\n\
  \    // this will work\n    cout << “Factorial of 3 is “\n    << factorial(3) <<\
  \ endl;\n    // this will generate an exception\n    cout << “Factorial of -1 is\
  \ “\n    << factorial(-1) << endl;\n    // control will never get here\n    cout\
  \ << “Factorial of 5 is “\n    << factorial(5) << endl;\n  }\n  // control passes\
  \ here\n  catch(MyException e)\n  {\n    cout << e.display() << endl;\n  }\n  catch(...)\n\
  \  {\n    cout << “Default catch “ << endl;\n  }\n  // wait until user is ready\
  \ before terminating program\n  // to allow the user to see the program results\n\
  \  system(“PAUSE”);\n  return 0;\n}\n```\n\n这个程序看起来和本章开头的阶乘程序非常相似。不同在于使用了一个自定义的\
  \ `MyException` 类，与简单的字符串相比，它包含了更多关于错误性质的信息。阶乘程序能够抛出错误信息、非法值以及错误发生的精确位置。\n\n![Remember.eps](img/Remember_fmt.jpeg)\
  \ `__FILE__`、`__LINE__` 和 `__func__` 是内置的 `#defines`，分别设置为源文件名、该文件中当前的行号以及当前函数的名称。\n\
  \n`catch` 捕获了 `MyException` 对象，然后使用内置的 `display()` 成员函数显示错误信息。（有关如何使用 `ostringstream`\
  \ 类格式化内部字符串，请参见第 23 章。）该程序的输出如下：\n\nFactorial of 3 is 6\nError <Negative argument\
  \ not allowed> - value is -1\nin function factorial()\nin file C:\\CPP_Programs\\\
  Chap25\\CustomExceptionClass\\main.cpp line #53\nPress any key to continue . . .\n\
  \n## 仅路过\n\n在本地分配资源的函数可能需要捕获异常，进行一些处理，然后将其重新抛出到栈链。考虑以下示例：\n\n```cpp\nvoid fileFunc()\n\
  {\n  ofstream* pOut = new ofstream(“File.txt”);\n  otherFunction();\n  delete pOut;\n\
  }\n```\n\n任何读过第 8 章的人都知道，通过 `new` 分配的内存不会自动返回给堆。如果 `otherFunction()` 抛出异常，程序将在不调用\
  \ `delete` 的情况下退出，导致在 `fileFunc()` 处开始分配的内存丢失。\n\n为了避免这个问题，`fileFunc()` 可以包含一个 `catch(...)`\
  \ 来捕获任何抛出的异常：\n\n```cpp\nvoid fileFunc()\n{\n  ofstream* pOut = new ofstream(“File.txt”);\n\
  \  try\n  {\n    otherFunction();\n    delete pOut;\n  }\n  catch(...)\n  {\n  \
  \  delete pOut;\n    throw;\n  }\n}\n```\n\n在这个短中，`fileFunc()` 将它之前分配的内存返回给堆。然而，它无法处理剩余的异常，因为它不知道可能出了什么问题。它甚至不知道自己刚刚捕获的是什么类型的对象。\n\
  \n不带任何参数的 `throw` 关键字会将当前异常对象重新抛回链链，直到某个可以正确处理错误的函数。\n\n## 第 25 章\n\n## 多重继承\n\n\
  ### 本章内容\n- 引入多重继承\n- 避免多重继承带来的歧义\n- 避免虚继承带来的歧义\n- 确定多个构造函数的排序规则\n- 处理多重继承中的问题\n\
  \n在其他章节讨论的类层次中，每个类都继承自一个父类。这种单继承足以描述大多数现实世界中的关系。然而，某些类代表了两个类合并为一个类。（听起来有点浪漫，不是吗？）\n\
  \n这种类的一个例子是沙发床，它将一张坚硬的床整合到一个不舒服的沙发中。为了在 C++ 中充分描述一个沙发床，沙发床应该能够同时继承床的属性和沙发的属性。这被称为多重继承。\n\
  \n## 描述多重继承机制\n\n图 25-1 显示了 `SleeperSofa` 类的继承图，它既继承自 `Sofa` 类也继承自 `Bed` 类。\n\n\
  **图 25-1：** 沙发床的类层次结构。\n\n![317266-fg2501.eps](img/317266-fg2501_fmt.jpeg)\n\n实现类\
  \ `SleeperSofa` 的代码如下：\n\n```cpp\n//\n// MultipleInheritance - 单一类可以继承自\n// 多个基类\n\
  //\n#include <cstdio>\n#include <cstdlib>\n#include <iostream>\n\nusing namespace\
  \ std;\n\nclass Bed\n{\npublic:\n  Bed(){}\n  void sleep(){ cout << “Sleep” << endl;\
  \ }\n  int weight;\n};\n\nclass Sofa\n{\npublic:\n  Sofa(){}\n  void watchTV(){\
  \ cout << “Watch TV” << endl; }\n  int weight;\n};\n\n// SleeperSofa - 既是床也是沙发\n\
  class SleeperSofa : public Bed, public Sofa\n{\npublic:\n  SleeperSofa(){}\n  void\
  \ foldOut(){ cout << “Fold out” << endl; }\n};\n\nint main(int nNumberofArgs, char*\
  \ pszArgs[])\n{\n  SleeperSofa ss;\n  // 你可以在沙发床上像沙发一样看电视...\n  ss.watchTV(); //\
  \ 调用 Sofa::watchTV()\n  //...然后你可以把它折叠起来...\n  ss.foldOut(); // 调用 SleeperSofa::foldOut()\n\
  \  // ...在上面睡觉\n  ss.sleep(); // 调用 Bed::sleep()\n  // 等待用户准备就绪后再终止程序\n  // 以允许用户看到程序的结果\n\
  \  system(“PAUSE”);\n  return 0;\n}\n```\n\n在这里，`Bed` 和 `Sofa` 类看起来像普通的类。然而，与之前的示例不同，`SleeperSofa`\
  \ 类同时继承自 `Bed` 和 `Sofa`。这从类声明中两个类的出现是显而易见的。`SleeperSofa` 继承了两个基类的所有成员。因此，`ss.sleep()`\
  \ 和 `ss.watchTV()` 的调用都是合法的。你可以将 `SleeperSofa` 作为 `Bed` 或 `Sofa` 使用。此外，`SleeperSofa`\
  \ 类可以有自己的成员，例如 `foldOut()`。该程序的输出如下：\n\nWatch TV\nFold out\nSleep\nPress any key\
  \ to continue . . .\n\n## 这是一个伟大的国家吗？\n\n## 解决继承歧义\n\n虽然多重继承是一项强大的功能，但它引入了几个可能的问题。其中一个在前面的示例中清晰可见。注意\
  \ `Bed` 和 `Sofa` 都包含一个成员 `weight`。这是逻辑性的，因为它们都有可衡量的重量。问题是：“`SleeperSofa` 继承了哪个重量？”\n\
  \n答案是“都有”。`SleeperSofa` 继承了成员 `Bed::weight` 和独立的成员 `Sofa::weight`。由于它们同名，对 `weight`\
  \ 的未限定引用现在是歧义的。下面的代码段演示了这一点，它会产生编译错误：\n\n```cpp\n#include <iostream>\n\nvoid fn()\n\
  {\n  SleeperSofa ss;\n  cout << “weight = “\n  << ss.weight // 非法 - 哪个重量？\n  <<\
  \ “\\n\";\n}\n```\n\n程序必须通过指定指定的基类来指示两个重量之一。以下代码段是正确的：\n\n```cpp\n#include <iostream>\n\
  \nvoid fn()\n{\n  SleeperSofa ss;\n  cout << “sofa weight = “\n  << ss.Sofa::weight\
  \ // 指定哪个重量\n  << “\\n\";\n}\n```\n\n虽然这种解决方案解决了问题，但在应用程序函数中指定基类是不理想的，因为它强制类信息泄露到类代码之外。在这种情况下，`fn()`\
  \ 需要知道 `SleeperSofa` 继承自 `Sofa`。这种类型的命名冲突在单继承中是不可能的，但在多重继承中是一个持续的。\n\n## 添加虚继承\n\
  \n在 `SleeperSofa` 的案例中，`weight` 的命名冲突不仅仅偶然。`SleeperSofa` 并没有独立于沙发重量的床重量。冲突发生是因为这个类层次结构没有完全描述现实世界。具体来说，类没有被完全分解。\n\
  \n进一步思考，很明显床和沙发都是一个更基础概念——家具的特例。（我本可以变得更基础，使用诸像具有质量的物体，但家具已经足够基础了。）重量是所有家具的属性。这种关系如图\
  \ 25-2 所示。\n\n图 25-2：床和沙发的进一步分解（按重量）。\n\n\n\n\n提取类 `Furniture` 应该可以缓解命名冲突。带着极大的释负感和对成功的巨大期待，我生成了如下程序所示的\
  \ C++ 类层次结构，程序 `MultipleInheritanceFactoring`：\n\n```cpp\n//\n// MultipleInheritanceFactoring\
  \ - a single class can\n// inherit from more than one base class\n//\n#include <cstdio>\n\
  #include <cstdlib>\n#include <iostream>\n\nusing namespace std;\n\n// Furniture\
  \ - more fundamental concept; this class\n// has “weight” as a property\nclass Furniture\n\
  {\npublic:\nFurniture(int w) : weight(w) {}\nint weight;\n};\n\nclass Bed : public\
  \ Furniture\n{\npublic:\nBed(int weight) : Furniture(weight) {}\nvoid sleep(){ cout\
  \ << “Sleep” << endl; }\n};\n\nclass Sofa : public Furniture\n{\npublic:\nSofa(int\
  \ weight) : Furniture(weight) {}\nvoid watchTV(){ cout << “Watch TV” << endl; }\n\
  };\n\n// SleeperSofa - is both a Bed and a Sofa\nclass SleeperSofa : public Bed,\
  \ public Sofa\n{\npublic:\nSleeperSofa(int weight) : Bed(weight), Sofa(weight) {}\n\
  void foldOut(){ cout << “Fold out” << endl; }\n};\n\nint main(int nNumberofArgs,\
  \ char* pszArgs[])\n{\nSleeperSofa ss(10);\n// Section 1 -\n// the following is\
  \ ambiguous; is this a\n// Furniture::Sofa or a Furniture::Bed?\n/*\ncout << “Weight\
  \ = “\n<< ss.weight\n<< endl;\n*/\n// Section 2 -\n// the following specifies the\
  \ inheritance path\n// unambiguously - sort of ruins the effect\nSleeperSofa* pSS\
  \ = &ss;\nSofa* pSofa = (Sofa*)pSS;\nFurniture* pFurniture = (Furniture*)pSofa;\n\
  cout << “Weight = “\n<< pFurniture->weight\n<< endl;\n// wait until user is ready\
  \ before terminating program\n// to allow the user to see the program results\n\
  system(“PAUSE”);\nreturn 0;\n}\n```\n\n当我发现这完全没有帮助时，我感到非常沮丧——`main()` 第 1 节对 `weight`\
  \ 的引用仍然是歧义的。“好吧，”我说（其实并没有真正理解为什么 `weight` 仍然是歧义的），我尝试将 `ss` 强制转换为 `Furniture`。”\n\
  \n```cpp\n#include <iostream.h>\nvoid fn()\n{\nSleeperSofa ss;\nFurniture* pF;\n\
  pF = (Furniture*)&ss; // use a Furniture pointer...\ncout << “weight = “ // ...to\
  \ get at the weight\n<< pF->weight\n<< “\\n”;\n};\n```\n\n将 `ss` 强制转换为 `Furniture`\
  \ 也不行。现在，我收到了一条奇怪的消息，说将 `SleeperSofa*` 转换为 `Furniture*` 是歧义的。怎么回事？\n\n解释非常直观。`SleeperSofa`\
  \ 没有直接继承自 `Furniture`。`Bed` 和 `Sofa` 都继承自 `Furniture`，然后 `SleeperSofa` 继承了它们。在内存中，`SleeperSofa`\
  \ 看起来如图 25-3 所示。\n\n**图 25-3：** `SleeperSofa` 的内存布局。\n\n![317266-fg2503.eps](img/317266-fg2503_fmt.jpeg)\n\
  \n你可以看到 `SleeperSofa` 由一个完整的 `Bed`、紧接着一个完整的 `Sofa`，以及一些 `SleeperSofa` 特有的内容组成。`SleeperSofa`\
  \ 中的每个子对象都有它们自己的 `Furniture` 部分，因为每个都继承自 `Furniture`。因此，一个 `SleeperSofa` 包含了两个 `Furniture`\
  \ 对象！\n\n毕竟，我并没有创建图 25-2 所示的层次结构。我实际创建的继承层次结构如图 25-4 所示。\n\n**图 25-4：** 我第一次尝试的实际结果。\n\
  \n![317266-fg2504.eps](img/317266-fg2504_fmt.jpeg)\n\n`MultipleInheritanceFactoring`\
  \ 程序演示了这种基类类的重复。第 2 节通过先将指针 `SleeperSofa` 转换为 `Sofa*` 然后转换为 `Furniture*`，精确地指定了哪一个\
  \ `weight` 对象。\n\n但包含两个 `Furniture` 对象的 `SleeperSofa` 是没有意义的。`SleeperSofa` 只需要一份\
  \ `Furniture`。我希望 `SleeperSofa` 只继承一份 `Furniture`，并且我希望 `Bed` 和 `Sofa` 共享这一个拷贝。C++\
  \ 将之为虚拟继承（virtual inheritance），因为它使用了 `virtual` 关键字。\n\n带着这些新知识，我回到 `SleeperSofa`\
  \ 类并对其如下实现：\n\n```cpp\n//\n// VirtualInheritance - using virtual inheritance the\n\
  // Bed and Sofa classes can share a common base\n//\n#include <cstdio>\n#include\
  \ <cstdlib>\n#include <iostream>\n\nusing namespace std;\n\n// Furniture - more\
  \ fundamental concept; this class\n// has “weight” as a property\nclass Furniture\n\
  {\npublic:\nFurniture(int w) : weight(w) {}\nint weight;\n};\n\nclass Bed : virtual\
  \ public Furniture\n{\npublic:\nBed(int w = 0) : Furniture(w) {}\nvoid sleep(){\
  \ cout << “Sleep” << endl; }\n};\n\nclass Sofa : virtual public Furniture\n{\npublic:\n\
  Sofa(int w = 0) : Furniture(w) {}\nvoid watchTV(){ cout << “Watch TV” << endl; }\n\
  };\n\n// SleeperSofa - is both a Bed and a Sofa\nclass SleeperSofa : public Bed,\
  \ public Sofa\n{\npublic:\nSleeperSofa(int w) : Bed(w), Sofa(w) {}\nvoid foldOut(){\
  \ cout << “Fold out” << endl; }\n};\n\nint main(int nNumberofArgs, char* pszArgs[])\n\
  {\nSleeperSofa ss(10);\n// Section 1 -\n// the following is ambiguous; is this a\n\
  // Furniture::Sofa or a Furniture::Bed?\ncout << “Weight = “\n<< ss.weight\n<< endl;\n\
  // Section 2 -\n// the following specifies the inheritance path\n// unambiguously\
  \ - sort of ruins the effect\nSleeperSofa* pSS = &ss;\nSofa* pSofa = (Sofa*)pSS;\n\
  Furniture* pFurniture = (Furniture*)pSofa;\ncout << “Weight = “\n<< pFurniture->weight\n\
  << endl;\n// wait until user is ready before terminating program\n// to allow the\
  \ user to see the program results\nsystem(“PAUSE”);\nreturn 0;\n}\n```\n\n注意在 `Bed`\
  \ 和 `Sofa` 继承 `Furniture` 时添加的 `virtual` 关键字。这表示：“给我一个 `Furniture` 的拷贝，除非你已经有一个了，如果是那样我就直接用那一个。”\
  \ `SleeperSofa` 的最终结果如图 25-5 所示。\n\n**图 25-5：** 使用虚拟继承的 `SleeperSofa` 内存布局。\n\n\
  ![317266-fg2505.eps](img/317266-fg2505_fmt.jpeg)\n\n在这里你可以看到 `SleeperSofa` 继承了 `Furniture`，然后是去掉\
  \ `Furniture` 部分的 `Bed`，随后是去掉 `Furniture` 部分的 `Sofa`。最后是 `SleeperSofa` 特有的成员。（注意，这可能不是内存中元素的顺序，但对于讨论目的并不重要。）\n\
  \n现在 `fn()` 中对 `weight` 的引用不再是歧义的，因为 `SleeperSofa` 只包含一份 `Furniture`。通过虚拟继承 `Furniture`，你获得了图\
  \ 25-2 所示的理想继承关系。\n\n\n\n更重要的是，多重继承为额外的错误打开了大门。首先，会出现像在“消除继承歧义”中提到的那些歧义问题。其次，在存在多重继承的情况下，将指针从子类强制转换为基类通常涉及以一种复杂且神秘的方式更改指针的值。我就把这些细节留给语言法专家和编译器编写者了。\n\
  \n第三，构造函数的调用方式可能有点神秘。注意 `VirtualInheritance` 示例中，`SleeperSofa` 必须直接调用 `Furniture`\
  \ 构造函数。`SleeperSofa` 无法通过 `Bed` 或 `Sofa` 构造函数来初始化权重。\n\n我建议你在精通 C++ 之前避免使用多重继承。单继承提供的表达能力已经足够让你习惯了。之后，你可以学习手册，直到你确定自己完全理解在使用多重继承时到底发生了什么。一个例外是使用商业库，例如微软的\
  \ Foundation Classes (MFC)，它们大量地使用了多重继承。这些类已经经过了检查，是安全的。\n\n不要误会我的意思。我并不是完全反对多重继承。微软等公司在它们的类库中有效地使用多重继承，这一事实证明了它是可行的。然而，多重继承是一项你希望在准备好之前之前推迟使用的特性。\n\
  \n## 第 26 章：诱人的 C++ 模板\n\n## 本章内容\n- 探讨如何将模板应用于函数\n- 将常用函数合并到单个模板定义中\n- 定义模板或类\n\
  - 复习模板相比于通用的“void”方法的优势\n\n标准 C++ 库提供了一套完整的数学、时间、输入/输出和 DOS 操作，这仅仅是其中一小部分。书中的许多早期程序都使用了在\
  \ `strings` 包含文件中定义的所谓字符字符串函数。这些中许多函数的参数类型是固定的。例如，`strcpy(char*, char*)` 的两个参数都必须是指向空终止字符字符串的指针——没有其他方式是合理的。\n\
  \n有些函数适用于多种类型。考虑低矮的 `maximum()` 函数示例，它返回两个参数的最大值。以下所有变体都是合理的：\n\n```cpp\nint maximum(int\
  \ n1, int n2); // 返回两个整数的最大值\nunsigned maximum (unsigned u1, unsigned u2);\ndouble\
  \ maximum (double d1, double d2);\nchar maximum (char c1, char c2);\n```\n\n我想为这四种情况实现\
  \ `maximum()`。\n\n当然，我可以用所有可能的版本重载 `maximum()`：\n\n```cpp\ndouble maximum(double\
  \ d1, double d2)\n{\n  if (d1 > d2)\n  {\n    return d1;\n  }\n  return d2;\n}\n\
  \nint maximum(int n1, int n2)\n{\n  if (n1 > n2)\n  {\n    return n1;\n  }\n  return\
  \ n2;\n}\n\nchar maximum(char c1, char c2)\n{\n  if (c1 > c2)\n  {\n    return c1;\n\
  \  }\n  return c2;\n}\n// ...对所有其他数值类型重复...\n```\n\n这种方法行得通。现在 C++ 会为像 `maximum(1,\
  \ 2)` 的引用选择最佳匹配项 `maximum(int, int)`。然而，为每种类型的变量创建相同的函数是极大的浪费时间。\n\n所有 `maximum(T,\
  \ T)` 函数的源代码遵循相同的模式，其中 `T` 是数值类型之一。如果可以写一次函数并让 C++ 在使用函数时按需要提供类型 `T`，那将太方便了。事实上，C++\
  \ 允许你完全这样做。这些所谓的模板定义就是本章的主题。\n\n## 将函数泛化为模板\n\n模板函数允许你编写看起来像函数但使用一个或多个类型占位符的代码，C++\
  \ 在编译时会将这些占位符转换为真实的类型。\n\n以下 `MaxTemplate` 程序定义了一个通用 `maximum()` 函数的模板：\n\n```cpp\n\
  // MaxTemplate - 创建一个模板 max() 函数\n// 返回两个类型中较大的那一个\n#include <cstdio>\n#include\
  \ <cstdlib>\n#include <iostream>\n#include <typeinfo>\n\nusing namespace std;\n\n\
  // 仅供本示例使用的简单异常类\ntemplate <class T> T maximum(T t1, T t2)\n{\n  if (t1 > t2)\n\
  \  {\n    return t1;\n  }\n  return t2;\n};\n\nint main(int argc, char* pArgs[])\n\
  {\n  // 找到两个 int 的最大值；\n  // 此处 C++ 创建了 maximum(int, int)\n  cout << “The maximum\
  \ of -1 and 2 is “\n  << maximum(-1, 2)\n  << endl;\n\n  // 对两个 double 重复\n  //\
  \ 在这种情况下，我们必须显式提供 T，因为\n  // 参数类型是不同的\n  cout << “The maximum of 1 and 2.5 is “\n\
  \  << maximum<double>(1, 2.5)\n  << endl;\n\n  system(“PAUSE\");\n  return 0;\n\
  }\n```\n\n关键字 `template` 后面跟着包含一个或多个类型占位符的角括号（模板参数），每个占位符前面都有 `class` 关键字、常量或两者。在这种情况下，`maximum<T>(T,\
  \ T)` 的定义将调用“未知类型” `T`。角括号之后是看起来像普通的函数定义。在这种情况下，模板函数 `T maximum<T>(T t1, T t2)`\
  \ 返回两个对象 `t1` 和 `t2` 中较大的一个，每个对象的类型都是 `T`，其中 `T` 是稍后定义的类。\n\n模板函数在转换为真实函数之前是没用的。C++\
  \ 将 `T` 替换为称为模板参数的实际类型。`main()` 函数首先调用模板定义，传递两个类型为 `int` 的参数。在这种情况下，C++ 可以实例化模板，提供\
  \ `int` 作为 `T` 的定义。\n\n从模板创建函数被称为实例化模板。\n\n第二次调用是个问题——在模板定义中，无法为 `T` 提供一个同时匹配第一个\
  \ `int` 参数和第二个 `double` 参数的单一类型。在这里，显式引用实例化了函数 `maximum(double, double)`。C++ 在调用之前会将\
  \ `int` 参数 `1` 提升为 `double` 的 `1.0`。\n\n该程序的输出如下：\n\n```\nThe maximum of -1 and\
  \ 2 is 2\nThe maximum of 1 and 2.5 is 2.5\nPress any key to continue . . .\n```\n\
  \n注意术语。例如，我是一个酷的自行车骑手（hip, bad bicyclist），这与坏髋自行车骑手（bad hip bicyclist）不是一回事。这里另一个例子：模板函数不是函数。模板函数的原型是\
  \ `maximum<T>(T, T)`。当 `T` 为 `int` 时，该模板创建的函数是函数（而不是模板函数）`maximum(int, int)`。如果你记住保持术语清晰，你的生活会变得更容易。\n\
  \n## 模板类\n\nC++ 还允许程序员定义模板类。模板类遵循相同的原则，即使用传统的类定义并为某些未知的支持类使用占位符。例如，以下 `TemplateVector`\
  \ 程序为用户提供的任何类创建一个向量（vector 是一种按行存储对象的容器类型；数组是经典的向量示例）。\n\n```cpp\n// TemplateVector\
  \ - 实现一个使用\n// 模板类型的 vector\n#include <cstdlib>\n#include <cstdio>\n#include <iostream>\n\
  \nusing namespace std;\n\n// TemplateVector - 一个简单的模板化数组\ntemplate <class T>\nclass\
  \ TemplateVector\n{\npublic:\n  TemplateVector(int nArraySize)\n  {\n    // 存储元素数量\n\
  \    nSize = nArraySize;\n    array = new T[nArraySize];\n    reset();\n  }\n  int\
  \ size() { return nWriteIndex; }\n  void reset() { nWriteIndex = 0; nReadIndex =\
  \ 0; }\n  void add(const T& object)\n  {\n    if (nWriteIndex < nSize)\n    {\n\
  \      array[nWriteIndex++] = object;\n    }\n  }\n  T& get()\n  {\n    return array[nReadIndex++];\n\
  \  }\n\nprotected:\n  int nSize;\n  int nWriteIndex;\n  int nReadIndex;\n  T* array;\n\
  };\n\n// 创建并显示两个向量：\n// 一个是整数的，另一个是名称\nvoid intFn();\nvoid nameFn();\n\nint main(int\
  \ argc, char* pArgs[])\n{\n  intFn();\n  nameFn();\n  system(“PAUSE\");\n  return\
  \ 0;\n}\n\n// intFn() - 操作一组整数\nvoid intFn()\n{\n  // 创建一个整数向量\n  TemplateVector<int>\
  \ integers(10);\n  // 向向量添加值\n```\n\n\n\n\n\n```cpp\ncout << “Enter integer values\
  \ to add to a vector\\n”\n<< “(Enter a negative number to terminate):”\n<< endl;\n\
  for(;;)\n{\n  int n;\n  cin >> n;\n  if (n < 0) { break; }\n  integers.add(n);\n\
  }\ncout << “\\nHere are the numbers you entered:” << endl;\nfor(int i = 0; i < integers.size();\
  \ i++)\n{\n  cout << i << “:” << integers.get() << endl;\n}\n}\n\n// Names - create\
  \ and manipulate a vector of names\nclass Name\n{\npublic:\n  Name() = default;\n\
  \  Name(string s) : name(s) {}\n  const string& display() { return name; }\nprotected:\n\
  \  string name;\n};\n\nvoid nameFn()\n{\n  // create a vector of Name objects\n\
  \  TemplateVector<Name> names(20);\n  // add values to the vector\n  cout << “Enter\
  \ names to add to a second vector\\n”\n  << “(Enter an ‘x’ to quit):” << endl;\n\
  \  for(;;)\n  {\n    string s;\n    cin >> s;\n    if (s == “x” || s == “X”) { break;\
  \ }\n    names.add(Name(s));\n  }\n  cout << “\\nHere are the names you entered”\
  \ << endl;\n  for(int i = 0; i < names.size(); i++)\n  {\n    Name& name = names.get();\n\
  \    cout << i << “:” << name.display() << endl;\n  }\n}\n```\n\n模板类 `TemplateVector<T>`\
  \ 包含一个 `T` 类型类对象的数组。该模板类提供了两个成员函数：`add()` 和 `get()`。`add()` 函数将一个 `T` 类的对象添加到数组中的下一个空位。相应的\
  \ `get()` 函数返回数组中的下一个对象。`nWriteIndex` 和 `nReadIndex` 成员分别用于跟踪下一个空条目和下一个待读取的条目。\n\
  \n`intFn()` 函数通过以下声明创建了一个空间恰上可以容纳 10 个整数的整数向量：\n\n```cpp\nTemplateVector<int> integers(10);\n\
  ```\n\n程序从键盘读取整数值并将其保存，然后使用 `TemplateVector` 提供的函数将这些值输出回来。\n\n第二个函数 `nameFn()`\
  \ 创建了一个 `Name` 对象的向量。同样，该函数读取名称然后将其显示给用户看。\n\n注意，`TemplateVector` 能够轻松地处理 `int`\
  \ 值和 `Name` 对象。同样注意 `nameFn()` 和 `intFn()` 函数之间的相似性，尽管整数和名称之间没有任何关系。\n\n一个示例会话如下（我加粗了从键盘输入的内容）：\n\
  \nEnter integer values to add to a vector\n(Enter a negative number to terminate):\n\
  5\n10\n15\n-1\nHere are the numbers you entered:\n0:5\n1:10\n2:15\nEnter names to\
  \ add to a second vector\n(Enter an ‘x’ to quit):\nChester\nTrude\nLollie\nBodie\n\
  x\nHere are the names you entered\n0:Chester\n1:Trude\n2:Lollie\n3:Bodie\nPress\
  \ any key to continue . . .\n\n## 使用模板的提示\n\n在使用模板时，你应该记住几点。首先，模板本身不会生成任何代码（代码在模板转换为具体的类或函数后才会生成）。这意味着\
  \ `.cpp` 源文件几乎不会与模板类相关。整个模板类的定义（包括所有成员函数）都包含在包含文件中，以便编译器进行展开。\n\n其次，模板类不消耗内存。因此，如果模板类从未被实例化，那么创建它们就没有代价。另一方面，模板类在每次实例化时都会使用内存。因此，即使\
  \ `Array<int>` 已经存在，`Array<Student>` 的代码也会消耗内存。\n\n最后，在模板类转换为真实类之前，无法对其进行编译和错误检查。因此，你必须在创建数组时就知道数组的大小。这种要求通常是无法实现的，尽管你有时知道元素数量不会超过某个“大值”。然而，病毒经常利用这种“它不会比这个大”的假设，而事实证明假设是错误的。没有真正的方法可以“增长”数组，除非声明一个新数组并将旧数组的内容复制到新的更大的版本中。\n\
  \n其次，在数组的任何位置插入元素都涉及数组内部元素的复制。这在内存和计算时间上都是昂贵的。对数组内的元素进行排序甚至更加昂。\n\nC++ 现在带有了标准模板库，或\
  \ `STL`，它包含了许多不同类型的容器，每种容器都有其自身的优点（和缺点）。![Tip.eps](img/Tip_fmt.jpeg) C++ 标准模板库是一个非常大的库，包含了有时复杂的容器。本节仅被视为\
  \ STL 力量的概述。\n\n## string 容器\n\n数组最常见的形式是用于显示文本的空终止符字符字符串，这清楚地显示了数组的优点和缺点。考虑以下内容看起来多么简单：\n\
  \n```cpp\ncout << “This is a string”;\n```\n\n但当你尝试执行即使是连接两个此类空终止符字符串这样简单的操作时，情况就会迅速变得糟糕：\n\
  \n```cpp\nchar* concatCharString(const char* s1, const char* s2)\n{\n  int length\
  \ = strlen(s1) + strlen(s2) + 1;\n  char* s = new char[length];\n  strcpy(s, s1);\n\
  \  strcat(s, s2);\n  return s;\n}\n```\n\nSTL 提供了一个 `string` 容器来处理显示字符串。`string`\
  \ 类提供了许多操作（包括重载运算符）来简化字符字符串的操作（见表 27-1）。使用字符串对象可以如下方式执行相同的 `concat()` 操作：\n\n```cpp\n\
  string concat(const string& s1, const string& s2)\n{\n  return s1 + s2;\n}\n```\n\
  \n| 表 27-1 string 类的主要方法 |\n\n| 方法 | 含义 |\n| :--- | :--- |\n| `string()` | 创建一个空字符串对象。\
  \ |\n| `string(const char*)` | 从空终止符字符数组创建字符串对象。 |\n| `string(const string& s)`\
  \ | 创建一个新的字符串对象，作为现有字符串对象 `s` 的拷贝。 |\n| `~string()` | 析构函数将内部内存返回堆。 |\n| `string&\
  \ operator=(const string& s)` | 使用字符串 `s` 的拷贝覆盖当前对象。 |\n| `istream& operator>>()`\
  \ | 从输入文件中提取字符串。在读取 `istream::width()` 个字符后、发生错误、遇到 EOF 或遇到空白字符时停止。保证不会溢出内部缓冲区。\
  \ |\n| `ostream& operator<<()` | 将字符串插入到输出文件。 |\n| `string operator+(const string&\
  \ s1, const string& s2)` | 创建一个由两个现有字符串拼接的新字符串。 |\n| `string& operator+=( const\
  \ string& s)` | 将字符串添加到当前字符串的末尾。 |\n| `char& operator[](size_type index)` | 返回当前字符串的第\
  \ index 个字符。 |\n| `bool operator==(const string& s1, const string& s2)` | 如果两个字符串在字典序上相等，则返回\
  \ true。 |\n| `bool operator<(const string& s1, const string& s2)` | 如果 `s1` 在字典序上小于\
  \ `s2`（即如果 `s1` 在字典中出现在 `s2` 之前），则返回 true。 |\n\n# 第 27 章：标准化标准模板库\n\n### 本章\n- 使用\
  \ `string` 类\n- 在标准模板库列表中维护条目\n- 从迭代器访问容器元素\n- 使用 `map` 容器\n\n有些程序可以处理实时到达的数据并将其丢弃。然而，大多数程序必须存储数据以备后处理。用于存储数据的结构泛称为容器或集合（我交替使用这两个术语）。到为止，本书严重依赖数组进行数据存储。数组容器有两个很好的属性：它能快速地存储和检索内容。此外，数组可以被声明为以类型安全的方式持有任何类型的对象。然而，与这些优点相对的是两个巨大的负面因素。\n\
  \n首先，你必须在创建时知道数组的大小。这一要求通常是无法实现的，尽管你有时知道元素数量不能超过某个“大值”。然而，病毒经常利用这种“它不会比这个大”的假设，而事实证明假设是错误的。没有真正的方法可以“增长”数组，除非声明一个新并将并将数组的内容复制到新的更大的版本中。\n\
  \n其次，在数组的任何位置插入元素都涉及数组内部元素的复制。这在内存和计算时间上都是昂贵的。对数组内的元素进行排序甚至更加昂。\n\nC++ 现在带有了标准模板库，或\
  \ `STL`，它包含了许多不同类型的容器，每种容器都有其自身的优点（和缺点）。\n\n\n\n\n\n## String Methods\n\n| `bool\
  \ operator>(const string& s1, const string& s2)` | 如果 `s1` 在字典序上大于 `s2`（即如果 `s1`\
  \ 在字典中出现在 `s2` 之后），则返回 true。 |\n| `string& append(const string& s)`, `string& append(const\
  \ char* pszS)` | 将字符串附加到当前字符串的末尾。 |\n| `char at(size_type index)` | 返回当前字符串中第 `index`\
  \ 个字符的引用。 |\n| `size_t capacity()` | 返回字符串对象在不从堆上分配更多空间的情况下可以容纳的字符数。 |\n| `int compare(const\
  \ string& s)` | 如果当前对象字典序上小于 `s`，返回 `< 0`；如果当前对象等于 `s`，返回 `0`；如果当前对象大于 `s`，返回 `>\
  \ 0`。 |\n| `const char* c_str()`, `const char* data()` | 返回指向当前对象内空结尾字符数组字符串的指针。\
  \ |\n| `bool empty()` | 如果当前对象为空，返回 true。 |\n| `size_t find(const string& s, size_t\
  \ index = 0)` | 从第 `index` 个字符开始在当前字符串中搜索子串 `s`。返回子串的索引。如果未找到子串，返回 `string::npos`。\
  \ |\n| `string& insert(size_t index, const string& s)`, `string& insert(size_t index,\
  \ const char* pszS)` | 从偏移量 `index` 处向当前字符串插入一个字符串。 |\n| `size_t max_size()` | 返回字符串对象理论上包含的最大对象数量。\
  \ |\n| `string& replace(size_t index, size_t num, const string& s)`, `string& replace(size_t\
  \ index, size_t num, const char* pszS)` | 替换当前字符串中从偏移量 `index` 开始的 `num` 个字符。如有必要，会扩大当前字符串的大小。\
  \ |\n| `void resize(size_t size)` | 将内部缓冲区调整为指定的长度。 |\n| `size_t size()`, `size_t\
  \ length()` | 返回当前字符串的长度。 |\n| `string substr(size_t index, size_t length)` | 返回一个从偏移量\
  \ `index` 开始并持续 `length` 个字符的子字符串。 |\n\n![c++'09.eps](img/c%2B%2B'09_fmt.jpeg) C++\
  \ ’09 标准规定，如 `max_size()` 等函数返回类型为 `size_type` 数字。我在表 27-1 中将参数类型列为 `size_t`，因为它们在随本书附的\
  \ `gcc` 编译器中是这样声明的。目前它们都是 `unsigned long int` 的同义词。请注意，在未来的某个日期，这两个类型可能会发生分离，且表\
  \ 27-1 中的参数类型可能会从 `size_t` 变为 `size_type`。\n\n以下 `STLString` 程序演示了字符串类的一部分功能：\n\n\
  ```cpp\n// STLString - 演示了字符串类的一些功能\n// 该类是标准模板库（STL）的一部分\n#include <cstdlib>\n\
  #include <cstdio>\n#include <iostream>\n\nusing namespace std;\n\n// removeSpaces\
  \ - 移除字符串中的任何空格\nstring removeSpaces(const string& source)\n{\n    // 复制源字符串，以便我们\n\
  \    // 修改它\n    string s = source;\n    // 找到第一个空格的偏移量；\n    // 继续搜索字符串直到没有找到更多空格\n\
  \    size_t offset;\n    while((offset = s.find(\" \")) != string::npos)\n    {\n\
  \        // 移除刚刚发现的空格\n        s.erase(offset, 1);\n    }\n    return s;\n}\n\n\
  // insertPhrase - 在 <ip> 插入点\n// 位置插入一个短语\nstring insertPhrase(const string& source)\n\
  {\n    string s = source;\n    size_t offset = s.find(\"<ip>\");\n    if (offset\
  \ != string::npos)\n    {\n        s.erase(offset, 4);\n        s.insert(offset,\
  \ \"Randall\");\n    }\n    return s;\n}\n\nint main(int argc, char* pArgs[])\n\
  {\n    // 使用 operator+() 将两个字符串拼接\n    cout << \"string1 + string2 = \"\n    <<\
  \ (string(\"string 1\") + string(\"string 2\"))\n    << endl;\n    // 创建测试字符串，然后使用简单的字符串方法\n\
  \    // 从中移除所有空格\n    string s2(\"This is a test string\");\n    cout << \"<\" <<\
  \ s2 << \"> minus spaces = <\"\n    << removeSpaces(s2) << \">\" << endl;\n\n  \
  \  // 在现有句子的中间（\"<ip>\" 位置）\n    // 插入短语\n    string s3 = \"Stephen <ip> Davis\"\
  ;\n    cout << s3 + \" -> \" + insertPhrase(s3) << endl;\n    system(\"PAUSE\");\n\
  \    return 0;\n}\n```\n\n`main()` 函数首先使用 `operator+()` 将两个字符串拼接。随后，`main()` 调用\
  \ `removeSpaces()` 方法移除提供字符串中的任何空格。它是通过使用 `string.find()` 操作来实现的。它通过使用 `string.find()`\
  \ 找到第一个偏移量。`removeSpaces()` 方法使用 `erase()` 移除发现的空格。`insertPhrase()` 方法使用 `find()`\
  \ 找到 `<ip>` 标记。`insert()` 方法添加新字符串。\n\n输出如下：\n```\nstring1 + string2 = string 12\n\
  <This is a test string> minus spaces = <Thisistring>\nStephen Davis -> Stephen Randall\
  \ Davis\n```\n\n## 遍历列表\n\n标准模板库提供了大量的容器——我可以在一个会话中描述更多的。然而，这里我对一个最有用的容器族进行描述。\n\
  \n`list` 容器通过像乐高积木一样连接它们来保留对象。（13 章了链表的简单实现）。对象可以被拆分并重新组合。这使得列表非常适合插入、排序、合并以及重新排列对象。表\
  \ 27-2 显示了列表的一些方法。\n\n### 表 27-2 list 类主要方法\n\n| 方法 | 含义 |\n| :--- | :--- |\n| `list<T>()`\
  \ | 创建一个 `T` 空列表。 |\n| `~list<T>()` | 析列表，包括对剩余的 `T` 对象调用析构函数。 |\n| `list operator=(const\
  \ list<T>& l)` | 用列表 `l` 的拷贝替换当前列表的内容。 |\n| `bool operator==(const list<T>& l1,\
  \ const list<T>& l2)` | 对两个列表中的每个元素进行字典序比较。 |\n| `list<T>::iterator begin()` | 返回指向当前列表中第一个元素的迭代器。\
  \ |\n| `void clear()` | 移除并析构当前列表中的每个对象。 |\n| `bool empty()` | 如果当前列表为空，返回 true。\
  \ |\n| `list<T>::iterator end()` | 返回指向当前列表末尾之后条目的迭代器。 |\n| `list<T>::iterator insert(\
  \ list<T>::iterator loc, const T& object)` | 在迭代器 `loc` 指向的位置添加 `object`。返回指向所添加对象的迭代器。\
  \ |\n| `void pop_back()void pop_front()` | 从当前列表中移除最后一个或第一个对象。 |\n| `void push_back(const\
  \ T& object)void push_front(const T& object)` | 在当前列表的末尾或开头添加对象。 |\n| `list<T>::reverse_iterator\
  \ rbegin()` | 返回指向列表中最后一个条目的迭代器（用于反向遍历列表，从末尾开始向开头工作）。 |\n\n\n\n\n\n| `list<T>::reverse_iterator\
  \ rend()` | 返回一个指向列表中第一个条目之前的条目的迭代器（当反向遍历列表时很有用）。 |\n| `void remove(const T& object)`\
  \ | 从当前列表中删除所有与 `object` 相同的对象（通过 `operator==(T&, T&)` 确定）。 |\n| `size_t size()`\
  \ | 返回当前列表中的条目数量。 |\n| `void sort()` | 对当前列表进行排序，使得列表中的每个对象都根据 `operator<(T&, T&)`\
  \ 确定的结果小于下一个对象。 |\n| `void splice(list<T>::iterator pos, list<T>& source)` | 从源列表中移除对象，并将它们添加到到当前列表中由\
  \ `pos` 指引的对象的之前。 |\n| `void unique()` | 移除任何后续的相同对象（通过 `operator==(T&, T&)` 确定）。\
  \ |\n\n`list<T>` 的构造函数创建一个空列表。可以使用 `push_front()` 或 `push_back()` 将对象添加到列表的开头或末尾。例如，以下代码段创建了一个\
  \ `Student` 对象的空列表并向列表中添加了两个：\n\n```cpp\nlist<Student> students;\nstudents.push_back(Student(\"\
  Dewie Cheatum\"));\nstudents.push_back(Student(\"Marion Haste\"));\n```\n\n## 遍历列表\n\
  \n程序员通过提供每个元素的索引来遍历数组。然而，这种技术对于像 `list` 这样不支持随机访问的容器是行的。可以想象一种基于 `getFirst()` 和\
  \ `getNext()` 等方法的解决方案；但是，标准模板库（STL）的设计者希望为遍历任何类型的容器提供一种通用的方法。为此，标准模板库定义了迭代器。\n\n\
  `iterator` 是一个指向容器成员的对象。通常情况下，每个迭代器都支持以下函数：\n\n- 类可以返回一个指向集合第一个成员的迭代器。\n- 迭代器可以从一个成员移动到下一个成员。\n\
  - 程序可以获取迭代器所指向的元素。\n\n![Tip.eps](img/Tip_fmt.jpeg) 标准模板库还提供了反向迭代器，用于反向遍历列表。我关于迭代器的所有描述同样适用于反向迭代器。\n\
  \n遍历列表所需的代码与遍历 vector 的代码（仅举两个例子）是不同的。然而，迭代器隐藏了这些细节。\n\n`begin()` 方法返回一个指向列表第一个元素的迭代器。间接操作符\
  \ `*()` 获取迭代器所指向对象的引用。`++` 运算符将迭代器移动到列表中的下一个元素。程序继续递增以遍历列表，直到迭代器等于 `end()` 返回的值。以下代码段从学生列表的开始处开始显示每个人的名字：\n\
  \n```cpp\nvoid displayStudents(list<Student>& students)\n{\n    // 分配一个指向列表中第一个\n\
  \    // 元素的迭代器\n    list<Student>::iterator iter = students.begin();\n    // 继续循环列表，直到\n\
  \    // 迭代器到达列表的末尾\n    while(iter != students.end())\n    {\n        // 获取迭代器指向的\
  \ Student\n        Student& s = *iter;\n        cout << s.sName << endl;\n     \
  \   // 现在将迭代器移动到列表中的\n        // 下一个元素\n        iter++;\n    }\n}\n```\n\n![c++'09.eps](img/c%2B%2B'09_fmt.jpeg)\
  \ 迭代器的声明可能会变得非常复杂。这可能是对 '09 标准中引入的 `auto` 声明最好的理由：\n\n```cpp\nfor(auto iter = students.end();\
  \ iter != students.end(); iter++)\n{\n    cout << iter->sName << endl;\n}\n```\n\
  \n这声明 `iter` 为由 `list<Student>::end()` 方法返回的任意类型的迭代器，避免了前面的代码段中所示那些痛苦的声明。这有多酷啊！\n\
  \n### 对整个列表进行的操作\n\nSTL 库定义了针对整个列表的某些操作。例如，`list<T&>::sort()` 方法表示：“只要你告诉我哪些对象排在前面，我就为你对列表排序。”你通过定义\
  \ `operator<(T&, T&)` 来实现这一点。该运算符对于内建类型和许多库类（如 `string`）已经定义好了。例如，你不需要对整数列表做任何操作：\n\
  \n```cpp\nlist<int> scores;\nscores.push_back(10);\nscores.push_back(1);\nscores.push_back(5);\n\
  scores.sort();\n```\n\n如果程序员想让 C++ 为她的类进行排序，她必须为自己的类定义自己的比较运算符。例如，下面的比较根据学生 ID 对\
  \ `Student` 对象进行排序：\n\n```cpp\nbool operator<(const Student& s1, const Student&\
  \ s2)\n{\n    return s1.ssID < s2.ssID;\n}\n```\n\n### 你能给我看一个例子吗？\n\n下面的 `STLListStudents`\
  \ 程序演示了在本节中你看到的几个函数。它创建了一个自定义 `Student` 对象的列表，遍历列表并排序列表。\n\n程序内容所示：\n\n```cpp\n\
  // STLListStudents - 使用列表来包含和排序\n// 用户定义的类\n#include <cstdio>\n#include <cstdlib>\n\
  #include <iostream>\n#include <list>\n\nusing namespace std;\n\n// Student - 示例自定义类\n\
  class Student\n{\npublic:\n    Student(const char* pszS, int id)\n    : sName(pszS),\
  \ ssID(id) {}\n    string sName;\n    int ssID;\n};\n\n// 以下运算符为了支持\n// 操作\nbool\
  \ operator<(const Student& s1, const Student& s2)\n{\n    return s1.ssID < s2.ssID;\n\
  }\n\n// displayStudents - 遍历列表\n// 显示元素\nvoid displayStudents(list<Student>& students)\n\
  {\n    // 分配一个指向列表中\n    // 元素的迭代器\n    list<Student>::iterator iter = students.begin();\n\
  \    // 继续循环列表，直到\n    // 迭代器到达列表的末尾\n    while(iter != students.end())\n    {\n\
  \        // 获取迭代器指向的 Student\n        Student& s = *iter;\n        cout << s.ssID\
  \ << \" - \" << s.sName << endl;\n        // 现在将迭代器移动到列表中的\n        // 下一个元素\n \
  \       iter++;\n    }\n}\n\nint main(int argc, char* pArgs[])\n{\n    // 定义学生集合\n\
  \    list<Student> students;\n    // 向列表添加三个对象\n    students.push_back(Student(\"\
  Marion Haste\", 10));\n    students.push_back(Student(\"Dewie Cheatum\", 5));\n\
  \    students.push_back(Student(\"Stew Dent\", 15));\n    // 显示列表\n    cout << \"\
  原始列表:\" << endl;\n    displayStudents(students);\n    // 现在排序列表并重新显示\n    students.sort();\n\
  \    cout << \"\\n 排序后的列表:\" << endl;\n    displayStudents(students);\n    system(\"\
  PAUSE\");\n    return 0;\n}\n```\n\n该程序定义了一个自定义 `Student` 对象的列表，遍历列表并排序列表。通过三次 `push_back()`\
  \ 向列表添加元素（硬编码这些调用可以使程序更小）。随后程序在用模板库 `sort()` 函数排序前后调用 `displayStudents()` 显示列表的内容。\n\
  \n该程序的输出如下：\n\n```\n原始列表:\n10 - Marion Haste\n5 - Dewie Cheatum\n15 - Stew Dent\n\
  \n排序后的列表:\n5 - Dewie Cheatum\n10 - Marion Haste\n15 - Stew Dent\n\n按任意键继续 . . .\n\
  ```\n\n## 第部分\n### 十建议\n\n![317266-pp0601.eps](img/317266-pp0601_fmt.jpeg)\n\n####\
  \ 在这一部分中 . . .\n\n哪本 For Dummies 书没有十建议部分是不完整的？在第 28 章中，我涵盖了十种避免向你的 C++ 程序添加 Bug\
  \ 的方法（大多数建议对 C 程序同样有效，且无需额外费用）。\n\n第 29 章列出了近年来该语言的十项重大改进。这些扩展功能似乎都在将语言推向不同的方向。当你对书中涵盖的主题感到熟悉后，你可能想要将此章节作为你进一步学习该语言的指南。\n\
  \n\n\n\n\n# 使用静态断言\n\n## 避免多重继承\n\n在本章中，我将介绍几种减少错误的方法，以及使调试引入的错误变得更容易的方法。\n\n##\
  \ 启用所有警告和错误消息\n\nC++ 语法允许大量的错误检查。当编译器遇到它无法解析的结构时，它只能生成错误消息。尽管编译器会尝试与下一个语句同步，但它不会尝试生成可执行的程序。\n\
  \n禁用警告和错误消息就像是因为你觉得烦而把汽车仪表盘上的“检查引擎”灯给拔掉一样：忽略问题并不会让它消失。如果你的编译器有“地狱级语法检查（Syntax Check\
  \ from Hell）”模式，请启用它。\n\n在删除或至少理解编译期间生成的所有警告之前，不要开始调试你的代码。如果开启了所有警告消息后仍然忽略它们，那对你毫无益处。如果你不理解某个警告，请查阅它。你所不知道的将会误害你。\n\
  \n## 采用清晰且一致的编码风格\n\n以清晰一致的风格进行编码不仅可以增强程序的可读性，还能减少编码错误。记住，你花费在解析 C++ 语法上的脑力越少，你留给思考当前程序逻辑的脑力就越多。良好的编码风格让你能够轻松地完成以下操作：\n\
  \n* 区分类名、对象名和函数名\n* 根据对象名了解该对象的一些信息\n* 区分预处理器符号和 C++ 符号（即 `#defined` 对象应该脱颖而出）\n\
  * 识别同一层级的 C++ 代码块（这是一致缩进的结果）\n\n此外，你还需要建立一个标准的模块头文件，提供关于模块中函数或类的信息、作者（推测就是你）、日期、你使用的编译器版本以及修改历史。\n\
  \n最后，参与同一个项目的所有程序员都应该使用相同的风格。尝试解析一个由不同编码风格补丁拼接而成的程序是令人困惑的。\n\n## 限制可见性\n\n限制类内部实现对外部世界的可见性是面向对象编程的基石。类负责自身的内部实现；应用程序负责使用该类来解决当前的问题。\n\
  \n具体来说，限制可见性意味着数据成员不应能在类外部访问——也就是说它们应该被标记为 `protected`。（书中没有讨论另一种存储类 `private` ）。此外，应用程序软件不需要感知的成员函数也应该标记为\
  \ `protected`。不要向外暴露比必要的更多的类内部实现。\n\n相关的规则是，公共成员函数应该尽可能少对应用程序代码的信任。传递给公共成员函数的任何参数都应该被视为可能导致\
  \ bug，直到它被证明是安全的。像下面这样的函数就是一个注待发生的事故：\n\n```cpp\nclass Array\n{\npublic:\n    explicit\
  \ Array(int s)\n    {\n        size = 0;\n        // 如果内存不可用，new 会抛出异常\n       \
  \ pData = new int[s];\n        size = s;\n    }\n    ~Array()\n    {\n        delete\
  \ pData;\n        size = 0;\n        pData = 0;\n    }\n    // 要返回或设置数组数据\n    int\
  \ data(int index)\n    {\n        return pData[index];\n    }\n\n    int data(int\
  \ index, int newValue)\n    {\n        int oldValue = pData[index];\n        pData[index]\
  \ = newValue;\n        return oldValue;\n    }\n\nprotected:\n    int size;\n  \
  \  int *pData;\n};\n```\n\n`data(int)` 函数允许应用程序从 `Array` 中读取数据。这个函数太信任了；它假设提供的索引在数据范围内。如果索引不在范围内呢？`data(int,\
  \ int)` 函数更糟，因为它覆盖了未知的位置。\n\n需要的是一种检查来确保索引在范围内。在下面的代码中，为了简单起见，只显示 `data(int)` 函数：\n\
  \n```cpp\nint data(unsigned int index)\n{\n    if (index >= size)\n    {\n     \
  \   throw Exception(\"Array index out of range\");\n    }\n    return pData[index];\n\
  }\n```\n\n现在，越界索引将被检查捕获。（将 `index` 设为无符号类型消除了添加负索引值检查的必要性。）\n\n## 在编写代码时编写注释\n\n\
  如果你在编写代码时编写注释，就可以避免错误，而不是等一切运行正常后再回去添加注释。我可以理解以后不花时间去写冗长的头文件和函数描述，但在编写代码时你总有时间添加简短的注释。\n\
  \n简短的注释应该是启发性的。如果不是，它们就没太大价值。在你努力让程序运行起来时，你需要尽可能多的启示。当你查看几天前写的一段代码时，简短、描述性且切中要点的注释能帮助你准确判断自己到底想做什么做出巨大的贡献。\n\
  \n此外，一致的代码缩进和命名规范使代码更容易理解。当你完成后代码易读，这很好，但代码在编写编写时易读同样重要。那才是你需要帮助的时候。\n\n## 每个路径至少单步执行一次\n\
  \n这看起来像是一个显而易见的陈述，但我还是要说：作为程序员，理解你的程序正在做什么非常重要。没有什么比使用良好的调试器单步执行程序更能让你对底层发生了什么有更好的感觉了（`Code::Blocks`\
  \ 包含一个集成调试器）。\n\n此外，当你编写程序时，有时需要原始素材来找出某些奇异的行为。没有什么比在这些函数投入使用时单步执行它们更能提供这些素材了。\n\
  \n最后，当一个函数完成并准备好添加到程序时，每个逻辑路径都需要至少执行一次。在单独对函数进行检查时，比在它和其他函数一起丢进锅里而你的注意力已经转向新的编程挑战之后寻找\
  \ bug 要容易得多。\n\n## 避免重载运算符\n\n除了使用赋值运算符 `operator()` 之外，在你觉得对 C++ 感到熟悉之前，应该推迟重载运算符。除了赋值之外的重载运算符几乎是没必要的，对于新程序员来说，会显著增加你的调试烦恼。你可以通过定义和使用适当的公共成员函数来实现相同的效果。\n\
  \n在你学习 C++ 几个月后，可以随时回来尽情尽快地开始重载运算符。\n\n## 系统地管理堆系统\n\n作为一条一般规则，程序员应该在同一个“层级”分配和释放堆内存。如果成员函数\
  \ `MyClass::create()` 分配了一块堆内存并将其返回给调用者，那么应该有一个成员函数 `MyClass::release()` 将内存返回堆。具体来说，`MyClass::create()`\
  \ 不应该要求父函数释放内存。这确实不能避免所有的内存问题——父函数可能会忘记调用 `MyClass::release()`——但它确实降低了这种可能性。\n\n\
  ## 使用异常处理错误\n\nC++ 的异常机制旨在方便、高效地处理错误。通常，你应该抛出错误指示而不是返回错误标志。生成的代码更容易编写、读取和维护。此外，其他程序员也已经习惯了这一点——你不想让他们失望的，对吧？\n\
  \n\n\n\n如果一个函数返回“未执行”的指示，且这是该函数日常工作的一部分，那么没有必要在该从中抛出异常。考虑一个函数 `lcd()`，它返回作为参数传递的数字的最小公倍数。当接收到一个质数时，该函数将不会返回任何值（质数不能被任何其他数字整除）。这不是一个错误——当给定质数时，`lcd()`\
  \ 函数无话可说。\n\n## 将析构函数声明为虚函数\n\n如果构造函数分配了资源（如堆内存），并在对象销毁时返回，请不要忘记为你的类创建一个析构函数。创建析构函数后，（几乎）每次都要忘记将其声明为虚函数，特别是当你知道你的类可能会被子类继承和扩展时。以下代码片段演示了此问题：\n\
  \n```cpp\nclass Person\n{\npublic:\n    Person(char* pszName) { psName = new string(pszName);}\n\
  \    ~Person() { delete psName; psName = 0; }\nprotected:\n    string* psName;\n\
  };\n\nclass Student : public Person\n{\npublic:\n    Student(char* pszName, unsigned\
  \ ID)\n    : Person(pszName), mID(ID) {}\nprotected:\n    unsigned mID;\n};\n\n\
  void fn()\n{\n    Student student(“Stewart Dent”, 1234);\n}\n```\n\n函数 `fn()` 创建了一个学生对象。`Student`\
  \ 类扩展了 `Person` 类，该类在构造函数中分配了堆内存来存储姓名，并在析构函数中释放它。当学生对象创建时，`fn()` 忠实地调用了 `Person`\
  \ 构造函数。的是，当学生超出作用域时，`~Person()` 析构函数并没有调用，因为它没有被声明为虚函数。\n\n对类进行以下更改可以解决此问题：\n\n\
  ```cpp\nclass Person\n{\npublic:\n    Person(char* pszName) { psName = new string(pszName);}\n\
  \    virtual ~Person() { delete psName; psName = 0; }\nprotected:\n    string* psName;\n\
  };\n```\n\n那么，我不应该将析构函数声明为虚函数呢？在类中声明任何成员为虚函数意味着 C++ 必须为该类的每个对象添加一个或两个额外的指针，以跟踪其虚成员。因此，如果你声明了大量的\
  \ `Person` 对象，每个对象额外的几个指针可能会是一个大问题。\n\n通常规则是，如果你希望析构函数被调用，请将其声明为虚函数。如果你正准备继承一个现有的基类，请确保其析构函数已声明为虚函数。\n\
  \n## 避免多重继承\n\n多重继承就像运算符重载一样，增加了一层在你刚开始不需要处理的复杂性。幸运的是，大多数现实世界的关系可以通过单继承来描述。\n\n\
  可以自由使用商业库的多重继承类。例如，Visual Studio 6 关键的 Microsoft MFC 类大量使用了多重继承。微软花费了大量时间设置它的类，他们知道自己在做什么。\n\
  \n当你觉得对 C++ 的理解水平已经足够后，可以尝试设置一些多重继承层次结构。这样，当出现需要通过多重继承来准确描述的异常情况时，你就准备好了。\n\n##\
  \ 第 29 章：C++ 的十大最新新增\n\n### 本章内容\n- 使用智能指针\n- 使用变长列表初始化对象\n- 内联初始化数据成员\n- 实例化外部模板\
  \ (extern template)\n- 实现线程本地存储\n- 使用 r 值引用以避免创建对象的副本\n- 实现概念 (concepts)\n- 定义 lambda\
  \ 表达式\n- 定义变长模板\n- 使用 typeid\n\n![c++'09.eps](img/c%2B%2B'09_fmt.jpeg)\n\n在本章中，我查看了\
  \ C++ 语言的十大新增。这些新增中的大部分（但不是全部）直到 C++ 2009 标准发布时才正式化。所有这些主题都超出了入门书籍的范围；我只是简单提到这些主题，让你对下一步可能想要学习的方向有一个了解。\n\
  \n## 使用智能指针\n\n由于忘记将内存返回堆导致内存丢失是 C++ 程序错误最大的来源之一。Java 和 C# 作为 C++ 语言的两个随者，引入了一种被称为垃圾回收的过程，它可以为你收集未引用的内存并将其返回给堆。C++\
  \ 也讨论过垃圾回收，但由于几个原因被拒绝了，包括它对程序造成的额外开销。\n\n如果能更好地处理动态分配的内存，问题就可以得到“解决”。标准库包含了 `initializer_list<T>`\
  \ 类，如下代码所示：\n\n```cpp\nstruct MyClass\n{\n    int value;\n};\n\nvoid fn()\n{\n \
  \   shared_ptr<MyClass> ptrObj(new MyClass);\n    ptrObj->value = 5;\n}\n```\n\n\
  ## 使用变长列表初始化变量\n\n你已经见过一种初始化列表可以拥有变数量对象的情况：\n\n`int array[] = {1, 2, 3};`\n\n在这种情况下，数组中的元素数量仅通过计数它们来确定的。C++\
  \ ’09 的定义通过引入 `initializer_list<T>` 将这种能力扩展到了其他容器类上。因此，我可能这样声明一个容器：\n\n```cpp\n\
  #include <initializer_list>\n#include <list>\n\nclass MyContainer\n{\npublic:\n\
  \    MyContainer(initializer_list<int> l)\n    {\n        nSize = l.size();\n  \
  \      for(auto ptr = l.begin(); ptr != l.end(); ptr++)\n        {\n           \
  \ elems.push_back(*ptr);\n        }\n    }\n    int size() { return nSize;}\nprotected:\n\
  \    int nSize;\n    list<int> elems;\n};\n\n// 声明一个 MyContainer 对象\nMyContainer\
  \ myContainer1 = {1, 2, 3, 4, 5};\n```\n\n注意构造函数接受一个 `initializer_list` 对象。这个简单的列表类提供了\
  \ `size()` 方法来返回列表中的元素数量，以及像之前的章节演示的那样返回迭代器的 `begin()` 和 `end()` 方法。\n\n## 内联数据成员\n\
  \n程序员可以在声明变量时对其，如下：\n\n`int value = 10;`\n\n然而，这种能力并没有扩展到类的数据成员。在 ’09 之前，这些成员只能在构造函数中初始化：\n\
  \n```cpp\n// 版本 A\nclass MyClass\n{\npublic:\n    MyClass() : value(10) {}\n   \
  \ int value;\n};\n```\n\n’09 定义将初始化扩展到了数据成员，如下：\n\n```cpp\n// 版本 B\nclass MyClass\n\
  {\npublic:\n    MyClass(){}\n    int value = 10;\n};\n```\n\n编译器处理版本 A 和版本 B 的方式完全相同。\n\
  \n## 实例化外部模板\n\n模板类在被具体类实例化之前不会生成代码。然而，一旦实例化，编译器很难不在每个使用模板的模块中单独重复该过程。考虑包含在头文件中的以下定义：\n\
  \n```cpp\ntemplate <typename T>\n```\n\n\n\n```cpp\nT max(T t1, T t2)\n{\n    if\
  \ (t1 > t2)\n        return t1;\n    return t2;\n}\n```\n\n假设有两个源文件 `ModuleA` 和\
  \ `ModuleB` 均调用了 `max(int, int)`。C++ 应该能够实例化一次模板，并让两个模块都引用同一个定义。事实证明，做到这一点非常困难。\n\
  \n显式实例化模板一直以来都是可行的，例如在 `ModuleA` 中包含以下内容：\n\n```cpp\ntemplate int max<int>;\n```\n\
  \n在 `ModuleB` 内部（以及其他使用 `max<int>` 的模块）中，我可以说：\n\n```cpp\nextern template int max<int>;\n\
  ```\n\n这等同于一个原型声明。它告诉编译器 `max()` 函数已经定义，但同时也表示 `max<T>` 已经在其他地方（另一个模块）被展开。这种对 `extern`\
  \ 的使用可以避免因多次实例化相同模板而导致的大量源代码生成。\n\n## 实现线程本地存储 (Thread Local Storage)\n\n越来越多的计算机提供了多核选项，即在同一块硅片上包含多个\
  \ CPU。然而，为了从多核处理器中获得最大优势，程序员需要划分其程序，使其能够在单独线程中执行。每个线程都可以被分配给自己的处理器，并独立于组成程序的其他线程运行。\n\
  \n多线程库在 C++ 中已经存在多年了，但 C++ ’09 通过引入 `thread_local` 存储，在语言内部实现多线程方面迈出了初步。\n\n具有全局作用域或静态作用域（见第\
  \ 6 章）的变量在所有线程之间共享。每个线程都会获得声明为 `thread_local` 存储的变量的独立副本。`thread_local` 变量在线程开始时构造，并在线程退出时调用其析构函数。\n\
  \n通过头文件 `thread` 访问的线程支持库包含了启动、停止和与独立线程通信的函数。\n\n## 使用右值引用 (Rvalue References)\n\
  \n表达式可以分为两类：`lvalues`（左值）和 `rvalues`（右值）。`lvalue` 是可以出现在赋值运算符左侧的值；而 `rvalue` 只能出现在右侧。某些操作符产生\
  \ `lvalues`（例如，赋值运算符本身返回一个 `lvalue`）。其他操作符（如加法）只返回 `rvalues`。因此，以下代码是不合法的：\n\n```cpp\n\
  int a, b;\n(a + b) = 3; // 错误：a + b 是右值\n```\n\n通常，函数返回的值是 `rvalues`。一个大例外是，返回对象引用的函数可以出现在赋值的左侧：\n\
  \n```cpp\nMyObject& fn1();\nfn1() = MyObject();\n```\n\n此类赋值是通过首先创建 `MyObject()`，然后将其复制到\
  \ `fn1()` 引用的对象来实现的。拷贝 `MyObject` 意味着重新分配并复制类创建的任何资源。然而，这非常荒谬，因为我们知道这里创建的 `MyObject`\
  \ 只是临时对象，一旦赋值完成就会被析构。\n\n与其拷贝临时的 `MyObject()`，为什么不使用移动语义（move semantics），直接“偷取”构造函数创建的任何资源，并将它们交给\
  \ `fn1()` 引用的对象呢？当程序员能够区分传递给函数的 `rvalues` 引用和 `lvalues` 引用时，可以编写高效得多的类。\n\n2009\
  \ 标准允许程序员如下方式表达这种差异：\n\n```cpp\nvoid fn(MyObject& lhr); // 参数是左值\nvoid fn(MyObject&&\
  \ rhr); // 参数是右值\n```\n\n细节超出了本书的范围，但通过明智地使用右值声明，程序员可以大大减少创建和析构临时对象的数量。\n\n## 实现概念\
  \ (Concepts)\n\n程序员经常使用多继承来告诉 C++ 编译器某个类具有某些能力，如下所示所示：\n\n```cpp\nclass Assignable\n\
  {\npublic:\n    virtual Assignable& operator=(Assignable const&) = 0;\n};\n\nclass\
  \ MyClass : public BaseClass, public Assignable {...};\n```\n\n任何继承自抽象类 `Assignable`\
  \ 的类必须在用于创建对象之前实现赋值运算符。这在实现模板类时特别有用。\n\nC++ ’09 以概念（concept）的形式形式化了这种承诺性类，定义如下：\n\
  \n```cpp\nauto concept LessThanComparable<typename T>\n{\n    bool operator<(T,\
  \ T);\n}\n```\n\n后续的模板定义可以依赖这一承诺来实现比较运算符：\n\n```cpp\n由于 C++ 中 概念的作用与 Java 或 C# 中的接口有很多相似之处\n\
  template<typename T> requires LessThanComparable<T>\nconst T& min(const T& t1, const\
  \ T& t2)\n{\n    if (t1 < t2)\n        return t1;\n    else\n        return t2;\n\
  }\n```\n\n有时更方便的结构允许在模板定义中使用概念名称代替 `typename`，如下所示：\n\n```cpp\ntemplate <LessThanComparable\
  \ T> class MyContainer\n{\n    // 下面的 sort 方法使用了 operator<()\n    // 来自类 T 的比较运算符来执行\n\
  \    // 排序\n    void sort();\n    // ...类定义继续...\n};\n```\n\n与使用多继承实现相同目的相比，概念方法生成的代码要要少得多。如果你熟悉\
  \ Java 或 C#，你会发现 C++ 中概念的作用与这些语言中的接口之间有许多相似之处。\n\n## 定义 Lambda 表达式 (Lambda Expressions)\n\
  \nLambda 表达式是一种定义局部函数对象的方式，且不会干扰整体逻辑流。考虑以下来自 C++ ’09 提案的代码片段：\n\n```cpp\ndouble\
  \ dUpperLimit = 1.1 * dSalary;\nstd::find_if(employees.begin(),employees.end(),\n\
  &\n{\n    return e.salary() >= dMinSalary && e.salary() < dUpperLimit;\n});\n```\n\
  \n这里 `employees` 是 Employee 对象的集合。\n\n## 定义变变模板 (Variadic Templates)\n\n变变模板允许程序员定义具有可变类的模板：\n\
  \n```cpp\ntemplate<typename... Attributes> class TableRow;\n```\n\n现在 `TableRow`\
  \ 类可以使用任意数量的属性进行实例化：\n\n```cpp\nclass TableRow<int, string,list<Grades>> Student;\n\
  ```\n\n注意：C 和 C++ 一直允许变参函数（`printf()` 是此类函数的一个例子）。这把“概念”扩展到了类定义。\n\n## 使用 typeid()\n\
  \n通常程序员应该通过虚成员函数区分声明类型和运行时类型的区别：\n\n```cpp\nclass Base\n{\npublic:\n    virtual\
  \ aMethod();\n};\n\nclass Derived : public Base\n{\npublic:\n    virtual aMethod();\n\
  };\n\nvoid fn(Base* pB)\n{\n    // 调用哪一个函数是\n    // 根据运行时类型决定的\n    pB->aMethod();\n\
  }\n```\n\n然而，可以使用关键字 `typeid` 询问对象的运行时类型，它返回一个指向 `type_info` 常量的引用。因此，程序员可以通过比较\
  \ `typeid` 返回的值来区分 `Base` 的子类，如下：\n\n```cpp\nvoid fn(Base* pB)\n{\n    // 使用 typeid\n\
  \    // Base 对象的类型\n    const type_info& ti = typeid(*pB);\n    if (ti == typeid(Base))\n\
  \    {\n        // 它是一个 Base 对象\n    }\n    else if (ti == typeid(Derived))\n  \
  \  {\n        // 它实际上是一个 Derived 对象\n    }\n}\n```\n\n我强调可以使用 `typeid` 判断是因为这通常不是一个好主意；然而，它是可行的。这种技术在创建调试代码且不想修改\
  \ `Base` 或 `Derived` 类时特别有用，因为它们位于你无法控制且无法修改的独立模块中。\n\n\n\n\n\n# 你将在光盘中找到\n\n##\
