  \n## 你将在光盘中找到\n\n以下章节按类别排列，提供了您在光盘上找到的软件和其他精彩内容的摘要。如果您在安装光盘提供的项目时需要帮助，请参考前一节中的安装说明。\n\
  \n对于列出的每个程序，我均提供了程序平台（Windows 或 Mac）以及软件类型。程序属于以下类别之一：\n\n- **共享软件（Shareware programs）**是具有完整功能的免费受版权试用版。如果您喜欢某些程序，可以向作者支付少量费用进行注册，获取许可、增强版和技术支持。\n\
