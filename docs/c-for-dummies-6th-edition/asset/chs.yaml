  \ 随附光盘上的编译器没有实现 `const` 表达式。\n\n## 枚举其他选项\n\nC++ 提供了一种定义独立的、用户自定义类型常量的机制。假设例如，我正在编写一个处理美国各州的程序。我可以通过名称引用这些州，例如“德克萨斯州”（Texas）或“北达科他州”（North\
  \ Dakota）。在实践中，这并不方便，因为重复的字符串比较计算开销很大，而且容易出错。\n\n我可以按照如下所示为每个州定义一个唯一的值：\n\n```cpp\n\
  #define DC_OR_TERRITORY 0\n#define ALABAMA 1\n#define ALASKA 2\n#define ARKANSAS\
  \ 3\n// ...以此类推...\n```\n\n这不仅避免了比较字符串的笨拙；还允许我将州名作为人口等属性数组的索引：\n\n```cpp\n// 增加阿拉斯加州的人口（他们需要这个）\n\
  population[ALASKA]++;\n```\n\n这样的语句比语义上等等的 `population[2]++` 要容易理解得多。这种操作非常常见，因此\
  \ C++ 允许程序员定义所谓的枚举（enumeration）：\n\n```cpp\nenum STATE {\n    DC_OR_TERRITORY, //\
  \ 获得 0\n    ALABAMA, // 获得 1\n    ALASKA, // 获得 2\n    ARKANSAS,\n    // ...以此类推...\n\
  };\n```\n\n此枚举的每个元素都分配了一个从 0 开始的值，因此 `DC_OR_TERRITORY` 定义为 0，`ALABAMA` 定义为 1，以此此类推。你可以通过使用如下赋值语句来覆盖这种增量序列：\n\
  \n```cpp\nenum STATE {\n    DC,\n    TERRITORY = 0,\n    ALABAMA,\n    ALASKA,\n\
  \    // ...以此类推...\n};\n```\n\n这个版本的 `STATE` 定义了一个元素 `DC`，其值为 0。然后它又定义了一个新元素 `TERRITORY`，它也被赋值为\
  \ 0。`ALABAMA` 像以前一样从 1 开始。\n\n![c++'09.eps](img/c%2B%2B'09_fmt.jpeg) ’09 标准扩展了枚举，允许程序员像如下所示创建用户定义的枚举类型（注意代码段中增加了\
  \ `class` 关键字）：\n\n```cpp\nenum class STATE {\n    DC,\n    TERRITORIES = 0,\n \
  \   ALABAMA,\n    ALASKA,\n    // ...以此类推...\n};\n```\n\n此声明创建了一个新类型 `STATE` 并为其分配了\
  \ 52 个成员（从 `ALABAMA` 到 `WYOMING` 加上 `DC` 和 `TERRITORIES`）。程序员现在可以像使用其他变量类型一样使用 `STATE`。可以声明一个变量为\
  \ `STATE` 类型：\n\n```cpp\nSTATE s = STATE::ALASKA;\n```\n\n可以通过这种新类型来区分函数调用：\n\n\
  ```cpp\nint getPop(STATE s); // 返回人口\nint setPop(STATE s, int pop); // 设置人口\n```\n\
  \n`STATE` 类型不仅仅是 `int` 的另一个别名：没有为 `STATE` 成员定义算术运算。以下将 `STATE` 用数组索引的尝试是非法的：\n\n\
  ```cpp\nint getPop(STATE s)\n{\n    return population[s]; // 非法\n}\n```\n\n然而，通过应用强制转换，可以将\
  \ `STATE` 的成员转换为对应的整数（`DC` 和 `TERRITORIES` 为 0，`ALABAMA` 为 1，`ALASKA` 为 2，以此此类推）：\n\
  \n```cpp\nint getPop(STATE s)\n{\n    return population[(int)s]; // 合法\n}\n```\n\
