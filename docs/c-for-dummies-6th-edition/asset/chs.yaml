  \ 开发环境\n\n**适用于 Windows**。`Code::Blocks` 是一个旨在与多种编译器工作的免费环境。光盘中包含的版本捆绑了 `GNU gcc`\
  \ C++ 编译器（版本 `4.4`）。\n\n## 故障排除\n\n我尽力编译了可以在大多数最低系统要求的计算机上运行的程序。遗憾的是，您的计算机可能有所不同，某些程序由于某些原因无法正常运行。\n\
  \n请记住，截至本文编写，大多数 C++ 编译器不支持 `2009` C++ 标准。书中包含的一些程序可能需要在 `GNU gcc` 版本 `4.4` 或更高版本的编译器以外的编译器上进行进行微调。具体而言，截至本文编写，示例程序中使用的每个功能在\
  \ `Visual Studio` 中并不都可用（高级功能在书中标记有 '09' 图标）。\n\n幸运的是，`GNU` 的优秀人士们为您能想到的几乎每个平台都提供了\
  \ `gcc`。您可以在 [www.gnu.org](http://www.gnu.org) 下载适用于您机器的版本。随附光盘中的 `Code::Blocks`\
  \ 包含了一份适用于 32 位 Windows 的 `gcc`。\n\n即使是 `gcc` 默认也不会启用 C++ ’09 功能。请务必遵循第 1 章中的说明来启用\
  \ ’09 功能。\n\n我为包含的 C++ 源代码包含了 `Code::Blocks` 工作空间和项目文件。这允许您只需点击一次即可重新编译所有程序。然而，这些项目文件假设程序安装在\
  \ `C:\\CPP_Programs` 目录下。如果您决定将源代码安装在不同的目录，则需要设置自己的项目文件。\n\n您可能遇到的其他问题是运行所需程序所需的内存（RAM）不足，或者有其他程序正在运行影响程序的安装或运行。如果您收到如\
  \ `Not enough memory` 或 `Setup cannot continue` 等错误消息，请尝试以下一个或多个建议，然后重新尝试软件：\n\n\
  - 关闭计算机上运行的杀病毒软件。安装程序有时模拟病毒活动，可能会导致计算机错误地认为感染了病毒。\n- 关闭所有运行的程序。运行的程序越多，提供其他程序的内存就越少。安装程序通常更新文件和程序；因此，如果您保持其他程序运行，安装可能无法正常工作。\n\
  - 让您的本地电脑商店为计算机增加更多内存。诚然，这是一个激进且相当昂贵的步骤。但是，增加内存确实可以提高计算机速度，并允许更多程序同时运行。\n\n## 客户服务\n\
