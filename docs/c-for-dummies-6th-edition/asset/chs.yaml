  \ 和 `cout << “Only “ << nLoopCount << “ loops to go” << endl;`。在终止程序前等待用户准备好，以允许用户看到程序结果。\n\
  \n（此处由于原文存在大量重复文本，译文已涵盖核心逻辑内容。）\n\n### 使用自增/自减运算符\n\n程序员经常在循环中使用 `++` 或 `--` 运算符。从下面的\
  \ `WhileDemo` 示例中可以看到，程序使用赋值和减法来减少循环计数：\n\n```cpp\n// 现在循环那么多的次\nwhile (nLoopCount\
  \ > 0)\n{\n    nLoopCount = nLoopCount - 1;\n    cout << “Only “ << nLoopCount <<\
  \ “ loops to go” << endl;\n}\n```\n\n更紧凑的版本使用了自减功能，正如你想象的那样：\n\n```cpp\nwhile (nLoopCount\
  \ > 0)\n{\n    nLoopCount--;\n    cout << “Only “ << nLoopCount << “ loops to go”\
  \ << endl;\n}\n```\n\n该版本的逻辑与原始版本相同。不同之处在于 `nLoopCount` 的减少方式。\n\n因为自减操作既减少其参数又返回其值，因此递减操作可以与\
  \ `while` 循环结合。特别是，下面的版本是最小的循环：\n\n```cpp\nwhile (nLoopCount-- > 0)\n{\n    cout\
  \ << “Only “ << nLoopCount << “ loops to go” << endl;\n}\n```\n\n输出如下：\n\n```\n\
  Enter loop count: 5\nOnly 4 loops to go\nOnly 3 loops to go\nOnly 2 loops to go\n\
  Only 1 loops to go\nOnly 0 loops to go\n```\n\n如果用户输入负数循环计数，程序将跳过整个循环。\n\n`while`\
  \ 循环的另一种形式被称为 `do...while`，它与 `while` 循环的相同之处在于循环体至少会被执行一次：\n\n```cpp\ndo\n{\n \
  \   // 循环体\n} while (condition);\n```\n\n\n\n\n\n当用户输入的循环次数为 1 时，`WhileDemo` 的自动递减版本应该执行多少次？如果你使用预递减版本，`--nLoopCount`\
  \ 的值为 0，循环永远不会进入循环体。如果使用后递减版本，`loopCount--` 的值为 1，控制将进入循环。\n\n不要认为带有自动递减命令的程序版本执行得更快（因为它包含的语句较少）。它的执行速度可能完全相同。现代编译器擅长将机器语言指令数减少到最低，无论你实际使用此处所示的哪种递减指令。\n\
  \n## 使用 for 循环\n\n最常见的循环形式是 `for` 循环。`for` 循环比基础的 `while` 循环更受欢迎，因为它通常更易于阅读（实际上没有其他优势）。\n\
  \n`for` 循环具有以下格式：\n\n```cpp\nfor (initialization; conditional; increment)\n{\n \
  \   // ...循环体内容\n}\n```\n\n`for` 循环等同于以下 `while` 循环：\n\n```cpp\n{\n    initialization;\n\
  \    while(conditional)\n    {\n        // ...循环体内容\n    }\n    increment;\n}\n\
  ```\n\n`for` 循环的执行从初始化语句开始，它之所以得这个名字是因为通常它是初始化计数变量的地方。初始化语句只执行一次，在第一次遇到 `for` 循环时执行。\n\
  \n执行继续条件语句。该语句的工作原理与 `while` 循环相同：只要条件语句为真，`for` 循环就会继续执行。\n\n在循环体中的代码执行完毕后，控制传递到递增语句，返回检查条件语句——从而重复该过程。递增语句通常包含用于更新计数变量的自动递增或自动递减语句。\n\
  \n通过示例来理解 `for` 循环是最好的。下面的 `ForDemo` 程序只不过是将 `WhileDemo` 转换为使用 `for` 循环结构的结果：\n\n\
  ```cpp\n// ForDemo1 - 输入循环次数。循环直到\n// 按指定的次数输出一个字符串参数。\n\n#include <cstdio>\n#include\
  \ <cstdlib>\n#include <iostream>\n\nusing namespace std;\n\nint main(int nNumberofArgs,\
  \ char* pszArgs[])\n{\n    // 输入循环次数\n    int nLoopCount;\n    cout << \"Enter loop\
  \ count: \";\n    cin >> nLoopCount;\n\n    // 计数到循环次数限制\n    for (; nLoopCount\
  \ > 0;)\n    {\n        nLoopCount = nLoopCount - 1;\n        cout << \"Only \"\
  \ << nLoopCount << \" loops to go\" << endl;\n    }\n\n    // 等待用户准备好后再终止程序\n  \
  \  // 以允许用户看到程序结果\n    system(\"PAUSE\");\n    return 0;\n}\n```\n\n该程序从键盘读取一个值到变量\
  \ `loopCount` 中。`for` 开始比较 `loopCount` 和 0。如果 `loopCount` 大于 0，控制进入 `for` 循环。一旦进入\
  \ `for` 循环，程序就会递减 `loopCount` 并显示结果。完成后，程序返回到 `for` 循环控制。一旦 `loopCount` 递减到 0，控制立即跳转到\
  \ `for` 循环的下一行。\n\n![Tip.eps](img/Tip_fmt.jpeg) `for` 循环的三个部分都可以是空的。空的初始化或递增部分什么都不做。空的比较部分被视为返回为真的比较。\n\
  \n这个 `for` 循环有两个小问题。首先，它是破坏性的——不是指我的小狗对拖鞋做了什么，而是指它改变了 `loopCount` 的值，“销毁”了原始值。其次，这个\
  \ `for` 循环从大值向小值倒数。这两个问题通过向 `for` 循环添加一个专门的计数变量来解决。它看起来像这样：\n\n```cpp\n// ForDemo2\
  \ - 输入循环次数。循环直到\n// 按指定的次数输出一个字符串参数。\n\n#include <cstdio>\n#include <cstdlib>\n\
  #include <iostream>\n\nusing namespace std;\n\nint main(int nNumberofArgs, char*\
  \ pszArgs[])\n{\n    // 输入循环次数\n    int nLoopCount;\n    cout << \"Enter loop count:\
  \ \";\n    cin >> nLoopCount;\n\n    // 计数到循环次数限制\n    for (int i = 1; i <= nLoopCount;\
  \ i++)\n    {\n        cout << \"We’ve finished \" << i << \" loops\" << endl;\n\
  \    }\n\n    // 等待用户准备好后再终止程序\n    // 以允许用户看到程序结果\n    system(\"PAUSE\");\n   \
  \ return 0;\n}\n```\n\n这个修改后的 `ForDemo` 版本循环方式与之前相同。然而，这个 `ForDemo2` 版本没有修改 `nLoopCount`\
  \ 的值，而是使用了一个新的计数变量。\n\n这个 `for` 循环声明了一个计数变量 `i` 并将其初始化为 0。它随后将该计数变量与 `nLoopCount`\
  \ 进行比较。如果 `i` 小于 `nLoopCount`，控制传递到 `for` 循环体输出语句。一旦体执行完毕，控制传递到递增语句，在那里 `i` 增加并再次与\
  \ `nLoopCount` 比较，循环如此进行。\n\n以下是程序的示例输出：\n\n```\nEnter loop count: 5\nWe’ve finished\
  \ 1 loops\nWe’ve finished 2 loops\nWe’ve finished 3 loops\nWe’ve finished 4 loops\n\
  We’ve finished 5 loops\nPress any key to continue...\n```\n\n![Tip.eps](img/Tip_fmt.jpeg)\
  \ `for` 循环的三个部分都可以是空的。空的初始化或递增部分什么都不做。空的比较部分被视为返回为真的比较。\n\n## 避免可怕的无限循环\n\n无限循环是一个永远持续的执行路径。当本该终止循环的条件无法发生时，就会发生无限循环。考虑之前循环的以下细微变化：\n\
  \n```cpp\nwhile (nLoopCount > 0)\n{\n    cout << \"Only \" << nLoopCount << \" loops\
  \ to go\" << endl;\n}\n```\n\n程序员忘记递减变量 `nLoopCount`。结果是循环计数器永远改变。测试条件要么始终为假，要么始终为真。程序在永无的（无限）循环中执行。\n\
  \n![TechnicalStuff.eps](img/TechnicalStuff_fmt.jpeg) 我意识到没有无限。电源会故障，计算机会崩溃，微软会破产，狗会和猫睡觉……要么循环停止执行，要么你不在乎了。但无限循环将一直执行，直到外部因素使其停止。你可以通过更多方式创建无限循环，其中许多更难发现。\n\
  \n## 应用特殊循环控制\n\nC++ 定义了两个名为 `break` 和 `continue` 的特殊流控制命令。有时终止循环的条件既不在循环开头也不在结尾，而是在中间。考虑一个累加用户输入数值的程序。当用户输入负数时循环终止。\n\
  \n这个问题的挑战在于，程序可以在用户输入值后退出循环，但在将值加入总和之前退出。\n\n对于这些情况，C++ 定义了 `break` 命令。当遇到时，`break`\
  \ 会导致立即退出当前循环。控制从 `break` 语句传递到循环结束大括号之后的语句。\n\n`break` 命令的格式如下：\n\n```cpp\nwhile(condition)\
  \ // break 在 for 循环中同样有效\n{\n    if (some other condition)\n    {\n        break;\
  \ // 退出循环\n    }\n} // 程序遇到 break 时，控制传递到此处\n```\n\n有了这个新的 `break` 命令，我对累加问题的解决方案表现为程序\
  \ `BreakDemo`：\n\n```cpp\n// BreakDemo - 输入一系列数字。\n// 继续累加这些数字的和，\n// 直到用户输入负数。\n\
  \n#include <cstdio>\n#include <cstdlib>\n#include <iostream>\n\nusing namespace\
  \ std;\n\nint main(int nNumberofArgs, char* pszArgs[])\n{\n    // 输入循环次数\n    int\
  \ accumulator = 0;\n\n\n\n\n```cpp\ncout << “This program sums values entered” <<\
  \ “by the user\\n”;\ncout << “Terminate the loop by entering “ << “a negative number”\
  \ << endl;\n// loop “forever”\nfor(;;)\n{\n    // fetch another number\n    int\
  \ nValue = 0;\n    cout << “Enter next number: “;\n    cin >> nValue;\n    // if\
  \ it’s negative...\n    if (nValue < 0)\n    {\n        // ...then exit\n      \
  \  break;\n    }\n    // ...otherwise add the number to the accumulator\n    accumulator\
  \ += nValue;\n}\n// now that we’ve exited the loop\n// output the accumulated result\n\
  cout << “\\nThe total is “ << accumulator << endl;\n// wait until user is ready\
  \ before terminating program\n// to allow the user to see the program results\n\
  system(“PAUSE”);\nreturn 0;\n}\n```\n\n在向用户解释了规则（输入负数退出等）之后，程序进入了一个看起来像无限的 `for(;;)`\
  \ 循环。进入循环后，`BreakDemo` 从键盘获取一个数字。只有在程序读取该数字后，它才能测试该数字是否符合退出标准。如果输入的数字是负数，控制权将传递给\
  \ `break`，导致程序退出循环。如果输入的数字不是负数，控制将跳过 `break` 命令，执行将新值累加到 `accumulator` 中的表达式。程序退出循环后，它输出累加的值然后退出。\n\
  \n![Tip.eps](img/Tip_fmt.jpeg) 在循环中反复对变量进行操作时，请确保该变量在进入循环之前已正确初始化。在这种情况下，程序在进入将\
  \ `nValue` 加到其中的循环之前，已将 `accumulator` 置零。\n\n示例运行的结果如下：\n\n此程序累加用户输入的值\n输入负数以退出循环\n\
  输入下一个数字: 1\n输入下一个数字: 2\n输入下一个数字: 3\n输入下一个数字: -1\n总计为 6\n按任意键继续 . . .\n\n相似的 `continue`\
  \ 命令使用频率较低。当程序遇到 `continue` 命令时，它会立即回到循环顶部。在当前迭代中，循环中的其余语句将被忽略。\n\n下面的示例片段忽略了用户可能输入的负数。只有\
  \ `0` 才会终止此版本（完整程序出现在 CD-ROM 上，名为 `ContinueDemo`）：\n\n```cpp\nwhile(true) //此 while()\
  \ 的效果等同于 for(;;)\n{\n    // 输入一个值\n    cout << “Input a value:”;\n    cin >> nValue;\n\
  \    // 如果该值是负数...\n    if (nValue < 0)\n    {\n        // ...输出错误消息...\n      \
  \  cout << “Negative numbers are not allowed\\n”;\n        // ...回到循环顶部\n      \
  \  continue;\n    }\n    // ...继续像正常一样处理输入\n}\n```\n\n### 嵌套控制命令\n\n回到我们的 PC 屏幕重绘问题。它显然需要某种类型的循环结构来从左到右在单行上写入每个像素。（中东的终端是从右到左扫描的吗？我不清楚。）关于从上到下反复重绘每一行扫描线又是呢？（澳大利亚的\
  \ PC 屏幕是从下向上扫描的吗？）对于这项特定任务，你需要在从上到下的扫描循环内部包含一个从左到右的扫描循环。\n\n循环内部的循环命令被称为嵌套循环。例如，我修改了\
  \ `BreakDemo` 程序以累加任意数量的序列。在 `NestedDemo` 程序中，内部循环累加从键盘输入的数字，直到用户输入负数。外部循环继续累加序列，直到和为\
  \ `0`。它的样子像这样：\n\n```cpp\n// NestedDemo - 输入一系列数字。\n// 继续累加这些数字的和\n// 直到用户输入 0。重复此过程\n\
  // 直到和为 0。\n#include <cstdio>\n#include <cstdlib>\n#include <iostream>\nusing namespace\
  \ std;\n\nint main(int nNumberofArgs, char* pszArgs[])\n{\n    // 外部循环\n    cout\
  \ << “This program sums multiple series\\n”\n    << “of numbers. Terminate each\
  \ sequence\\n”\n    << “by entering a negative number.\\n”\n    << “Terminate the\
  \ series by entering two\\n”\n    << “negative numbers in a row\\n”;\n    // 继续累加序列\n\
  \    int accumulator;\n    for(;;)\n    {\n        // 开始下一个序列\n        accumulator\
  \ = 0;\n        cout << “Start the next\\n”;\n        for(;;)\n        {\n     \
  \       // 获取另一个数字\n            int nValue = 0;\n            cout << “Enter next\
  \ number: “;\n            cin >> nValue;\n            // 如果它是负数...\n           \
  \ if (nValue < 0)\n            {\n                // ...然后退出\n                break;\n\
  \            }\n            // ...否则将该数加到 accumulator\n            accumulator +=\
  \ nValue;\n        }\n        // 如果总和为 0 则退出循环\n        if (accumulator == 0)\n\
  \        {\n            break;\n        }\n        // 输出累加的结果\n        cout << “The\
  \ total is “ << accumulator << endl;\n    }\n    // 我们正要退出\n    cout << “Thank you”\
  \ << endl;\n    // 等到用户准备好后再终止程序\n    // 以便用户看到程序的运行\n    system(“PAUSE”);\n   \
  \ return 0;\n}\n```\n\n### 切换主题\n\n回到我们的 PC 屏幕重绘问题。它显然需要某种循环结构来在单行上从左到右写入每个像素。（中东的终端是从右到左扫描的吗？我不清楚。）关于从上到下反复重绘每一扫描线又是呢？（澳大利亚的\
  \ PC 屏幕是从下向上扫描的吗？）对于这项特定任务，你需要在从上到下的扫描循环内部包含一个从左到右的扫描循环。\n\n循环内部的循环命令被称为嵌套循环。例如，我修改了\
  \ `BreakDemo` 程序以累加任意数量的序列。在 `NestedDemo` 程序中，内部循环累加从键盘输入的数字，直到用户输入负数。外部循环继续累加序列，直到和为\
  \ `0`。它的样子像这样：\n\n（此处代码块已在上方翻译过，不再重复输出）\n\n下面的示例片段忽略了用户可能输入的负数。只有 `0` 才会终止此版本（完整程序出现在\
  \ CD-ROM 上，名为 `ContinueDemo`）：\n\n（此处代码块已在上方翻译过，不再重复输出）\n\n### 切换主题\n\n最后一个控制语句在有限的情况下非常有用。switch\
  \ 语句包含了多种可能性：\n\n```cpp\nswitch {\n    case c1:\n        // 如果 expression == c1\n\
  \        break;\n    case c2:\n        // 如果 expression == c2\n        break;\n\
  \    default:\n        // 如果无匹配\n}\n```\n\n`expression` 的值必须是整数（`int`、`long` 或 `char`）。`case`\
  \ 值必须是常量。当遇到 switch 语句时，会对 expression 进行求值，并与 case 常量进行比较。跳转到匹配的 `case`。\n\n考虑以下示例：\n\
  \n```cpp\nint choice;\ncout << “输入 1, 2 或 3:”;\ncin >> choice;\nswitch(choice)\n\
  \    case 1:\n        // 执行“1”处理\n        break;\n    case 2:\n        // 执行“2”处理\n\
  \        break;\n    case 3:\n        // 执行“3”处理\n        break;\n    default:\n\
  \        cout << “你没有输入 1, 2 或 3\\n”;\n}\n```\n\n再次，switch 语句有一个等效实现，在这种情况下是多个 if\
  \ 语句。然而，当情况超过二或三个时，switch 结构更容易理解。\n\n![Warning(bomb).eps](img/Warning(bomb)_fmt.jpeg)\
  \ break 语句对于退出 switch 命令是必要的。如果没有 break 语句，控制将从一个 case 穿透到下一个。（注意下方！）\n\n\n\n\n\
  C++ 允许程序员将代码划分为称为函数（functions）的此类块。函数是一个可以作为单一实体执行的小型代码块。这允许程序员将其程序划分为许多此类实体，每个实体解决整个程序问题中的某个定义良好的子集。函数本身又拆分成更小、更详细的函数，形成由不断缩小、不断详细的解决方案组成的金字塔，从而构成完整的程序。\n\
  \n这种分治方法将创建规模巨大的可运行程序的复杂性降低到了普通凡人可以完成的程度。\n\n## 编写和使用函数\n\n通过示例理解函数是最好的。本节从示例程序\
  \ `FunctionDemo` 开始，它通过定义一个函数来包含部分逻辑，简化我在第 5 章讨论过的 `NestedDemo` 程序。然后，本节将以 `FunctionDemo`\
  \ 作为理解问题和解决方案的模式，解释如何定义函数以及如何调用函数。\n\n第 5 章中的 `NestedDemo` 程序至少包含三个可以可以在脑中和实际中被轻易分离的部分：\n\
  \n1. 对操作员关于如何输入数据的说明\n2. 一个累加单个数字序列的内层循环\n3. 一个反复调用内层循环、直到累加值为 0 的外层循环\n\n沿着这些线索分离程序允许程序员单独专注于程序的每个部分。接下来的\
  \ `FunctionDemo` 程序展示了如何通过创建 `displayExplanation()` 和 `sumSequence()` 函数来拆分 `NestedDemo`：\n\
  \n```cpp\n// FunctionDemo - 展示函数的用法\n\n// 通过将 NestedDemo\n// 程序的内层循环拆分为其独立的\n//\
  \ 函数\n#include <cstdio>\n#include <cstdlib>\n#include <iostream>\n\nusing namespace\
  \ std;\n\n// displayExplanation - 提示用户游戏的\n// 规则\nvoid displayExplanation(void)\n\
  {\n    cout << \"This program sums multiple series\\n\"\n    << \"of numbers. Terminate\
  \ each sequence\\n\"\n    << \"by entering a negative number.\\n\"\n    << \"Terminate\
  \ the series by entering an\\n\"\n    << \"empty sequence.\\n\"\n    << endl;\n\
  \    return;\n}\n\n// sumSequence - 加从键盘输入的数字序列\n// 直到用户输入负数为止。\n// return - 输入的数字之和\n\
  int sumSequence(void)\n{\n    // 无限循环\n    int accumulator = 0;\n    for(;;)\n \
  \   {\n        // 获取另一个数字\n        int nValue = 0;\n        cout << \"Enter next\
  \ number: \";\n        cin >> nValue;\n        // 如果是负数...\n        if (nValue <\
  \ 0)\n        {\n            // ...那么跳出循环\n            break;\n        }\n     \
  \   // ...否则将数字加到\n        // 累加器中\n        accumulator += nValue;\n    }\n    //\
  \ 返回累加值\n    return accumulator;\n}\n\nint main(int nNumberofArgs, char* pszArgs[])\n\
  {\n    // 向用户显示提示\n    displayExplanation();\n\n    // 累加数字序列...\n    for(;;)\n\
  \    {\n        // 累加从键盘输入的数字序列\n        cout << \"Enter next sequence\" << endl;\n\
  \        int accumulatedValue = sumSequence();\n\n        // 如果 sumSequence() 返回零\n\
  \        // 则终止循环\n        if (accumulatedValue == 0)\n        {\n            break;\n\
  \        }\n        // 现在输出累加结果\n        cout << \"The total is \"\n        << accumulatedValue\n\
  \        << \"\\n\"\n        << endl;\n    }\n    cout << \"Thank you\" << endl;\n\
  \    // 等待用户准备好后再终止程序\n    // 让用户看到程序结果\n    system(\"PAUSE\");\n    return 0;\n\
  }\n```\n\n## 定义我们的第一个函数\n\n`void displayExplanation(void)` 语句被称为函数声明（function declaration）——它引入了紧随其后的函数定义。函数声明始终以函数名开始，其前面是函数返回值的类型，后面紧跟着一对包含函数任何参数的左右括号。\n\
  \n返回类型 `void` 意味着 `displayExplanation()` 不返回任何值。参数列表中的 `void` 意味着它也不接受任何参数（我们很快就会学到它的含义）。函数体包含在紧随函数声明的大括号中。\n\
  \n函数名通常被写为多个单词的描述，并将所有单词挤在一起。我的函数名以小写开头，但将中间单词的首字母大写。函数名几乎总是跟着一对左右括号。\n\n函数在被调用之前什么都不做。我们的程序像一如既往一样，从\
  \ `main()` 中的第一行开始执行。`main()` 中的第一个非注释行是调用 `displayExplanation()`：\n\n```cpp\ndisplayExplanation();\n\
  ```\n\n这会将程序控制权传递给 `displayExplanation()` 函数的第一行。计算机在该处继续执行，直到到达 `displayExplanation()`\
  \ 结尾的 `return` 语句。\n\n## 定义 sumSequence() 函数\n\n声明 `int sumSequence(void)` 开始定义\
  \ `sumSequence()` 函数。该声明表示该函数不期望任何参数，但会向调用者返回一个 `int` 类型的值。该函数的体包含了之前在 `NestedDemo`\
  \ 示例内层循环中相同的代码。\n\n`sumSequence()` 函数还包含一个 `return` 语句来退出程序。这个 `return` 不是可选的，因为它包含了要返回的值\
  \ `accumulator`。返回值的类型必须与声明中的函数类型匹配，在本例中为 `int`。\n\n## 调用函数 sumSequence()\n\n再次回到\
  \ `FunctionDemo` 中的 `main()` 函数。这段代码看起来与 `NestedDemo` 中的外层循环相似。\n\n主要的区别在于 `accumulatedValue\
  \ = sumSequence();` 表达式，它出现在本应该是内层循环的位置。`sumSequence()` 语句调用了同名的函数。函数返回的值存储在变量 `accumulatedValue`\
  \ 中。然后显示此值。主程序继续循环，直到 `sumSequence()` 返回总和 0，这表示用户已完成求和。\n\n## 分治\n\n`FunctionDemo`\
  \ 程序将 `main()` 中的外层循环与内层循环分离成一个函数 `sumSequence()`，并创建了 `displayExplanation()` 来启动。这种划分并不是偶然的：`FunctionDemo`\
  \ 中的两个函数都执行逻辑上独立的操作。\n\n一个好的函数是容易描述的。你不需要超过一个句子，并且像 `and`、`or`、`unless` 或 `but`\
  \ 等单词越少越好。例如，这里有一个简单、直接的定义：“函数 `sumSequence` 累加用户输入的整数序列。”这个定义简洁清晰。与 `NestedDemo`\
  \ 程序的描述相比天差地别：“程序向用户解释它是如何工作的，然后累加正数序列，如果用户输入负数则产生错误，显示总和并重新开始，直到用户输入零长度的和。”\n\n\
  该程序的示例运行输出与 `NestedDemo` 程序生成的输出相同。\n\n## 理解函数的细节\n\n函数对于创建 C++ 程序是基础性的，因此掌握定义、创建和测试它们的细节至关重要。结合示例\
  \ `FunctionDemo` 程序，考虑以下函数的定义：函数是一个逻辑上分离的 C++ 代码块。\n\n函数构造如下所示：\n\n```cpp\n<return\
  \ type> name(<arguments to the function>)\n\n{\n    // ...\n    return <expression>;\n\
  }\n```\n\n函数的参数是可以传递给函数作为输入信息使用的值。返回值函数返回的值。例如，在调用函数 `square(10)` 时，`10` 是函数 `square()`\
  \ 的参数。返回的值是 `100`（如果不是，那么这个函数的命名就很糟糕了）。\n\n\n\n\n参数和返回值都是可选的。如果其中任一缺失，则使用关键字 `void`\
  \ 代替。也就是说，如果函数具有 `void` 参数列表，则在调用该函数时它不接受任何参数（`FunctionDemo` 程序就是这种情况）。如果返回类型为 `void`，则该函数不向调用者返回值。\n\
  \n![Tip.eps](img/Tip_fmt.jpeg) 函数的默认参数类型为 `void`，意味着它不接受任何参数。函数 `int fn(void)` 可以声明为\
  \ `int fn()`。\n\n# 了解简单函数\n\n简单函数 `sumSequence()` 返回一个它计算出的整数值。函数可以返回第 2 章中描述的任何内置变量类型。例如，一个函数可以返回\
  \ `double` 或 `char`。如果函数不返回任何值，则函数的返回类型被标记为 `void`。\n\n![Tip.eps](img/Tip_fmt.jpeg)\
  \ 函数可以根据其返回类型命名——例如，返回 `int` 的函数通常被称为整数函数。不返回值的函数被称为 `void` 函数。\n\n例如，以下 `void`\
  \ 函数执行了一个操作但没有返回值：\n\n```cpp\nvoid echoSquare()\n{\n  int value;\n  cout << \"Enter\
  \ a value:\";\n  cin >> value;\n  cout << \"\\n The square is:\" << (value * value)\
  \ << \"\\n\";\n  return;\n}\n```\n\n控制从左括号开始并持续到 `return` 语句。`void` 函数中的 `return`\
  \ 语句后面没有跟值。`void` 函数中的 `return` 语句是可选的。如果不存在，当控制遇到右括号时，执行将返回到调用函数。\n\n# 了解带参数的函数\n\
  \n没有参数的函数用途有限，因为此类函数的通信是单向的——通过返回值。双向通信是通过函数参数来实现的。\n\n## 带参数的函数\n\n函数参数是一个变量，其值在调用操作期间传递给调用函数。以下\
  \ `SquareDemo` 示例程序定义并使用了一个函数 `square()`，它返回传递给它的 `double` 双精度浮点数的平方：\n\n```cpp\n\
  // SquareDemo - 演示如何使用\n// 处理参数的\n#include <cstdio>\n#include <cstdlib>\n#include\
  \ <iostream>\n\nusing namespace std;\n\n// square - 返回其参数的平方\n// doubleVar - 要取平方的值\n\
  // returns - doubleVar 的平方\ndouble square(double doubleVar)\n{\n  return doubleVar\
  \ * doubleVar;\n}\n\n// displayExplanation - 向用户提示游戏\n// 规则\nvoid displayExplanation(void)\n\
  {\n  cout << \"This program sums the square of multiple\\n\"\n  << \"series of numbers.\
  \ Terminate each sequence\\n\"\n  << \"by entering a negative number.\\n\"\n  <<\
  \ \"Terminate the series by entering an\\n\"\n  << \"empty sequence.\\n\"\n  <<\
  \ endl;\n  return;\n}\n\n// sumSquareSequence - 将键盘输入的\n// 数字平方累加到一个序列中\n// 直到用户输入负数为止\n\
  double sumSquareSequence(void)\n{\n  // 死循环\n  double accumulator = 0.0;\n  for(;;)\n\
  \  {\n    // 获取另一个数字\n    double dValue = 0;\n    cout << \"Enter next number: \"\
  ;\n    cin >> dValue;\n    // 如果是负数...\n    if (dValue < 0)\n    {\n      // ...那么跳出循环\n\
  \      break;\n    }\n    // ...否则计算平方\n    double value = square(dValue);\n   \
  \ // 现在将平方加到\n    // 累加器\n    accumulator += value;\n  }\n  // 返回累加的值\n  return\
  \ accumulator;\n}\n\nint main(int nNumberofArgs, char* pszArgs[])\n{\n  displayExplanation();\n\
  \  // 继续累加数字...\n  for(;;)\n  {\n    // 累加从键盘输入的\n    // 数字序列\n    cout << \"Enter\
  \ next sequence\" << endl;\n    double accumulatedValue = sumSquareSequence();\n\
  \    // 如果序列为零或负数则终止\n    if (accumulatedValue <= 0.0)\n    {\n      break;\n  \
  \  }\n    // 现在输出累加的结果\n    cout << \"\\nThe total of the values squared is \"\n\
  \    << accumulatedValue\n    << \"\\n\"\n    << endl;\n  }\n  cout << \"Thank you\"\
  \ << endl;\n  // 在终止程序前等待用户准备好\n  // 以允许用户看到程序结果\n  system(\"PAUSE\");\n  return\
  \ 0;\n}\n```\n\n这本质上与 `FunctionDemo` 程序相同，只是 `sumSquareSequence()` 函数累加了输入值的平方，并将其作为\
  \ `double` 而不是 `int` 返回。`square()` 函数返回其一个参数乘以自身的值。对 `sumSequence()` 函数的更改非常简单：函数现在不是累加输入的值，而是累加来自\
  \ `square()` 返回的结果。\n\n## 带多个参数的函数\n\n函数可以有多个参数，并用逗号分隔。因此，以下函数返回其两个参数的乘积：\n\n```cpp\n\
  int product(int arg1, int arg2)\n{\n  return arg1 * arg2;\n}\n```\n\n#  de main()\n\
  \n我们标准程序模板中的“关键字” `main()` 仅仅是一个函数——尽管是一个参数奇怪的函数，但它终归是一个函数。\n\n当 C++ 从源码构建程序时，它会添加一些在程序启动之前执行的样板代码。（如果不深入研究\
  \ C++ 库函数的内部，你是看不到这些代码的。）这段代码设置了程序运行的环境。例如，这段样板代码打开了默认的输入输出通道 `cin` 和 `cout`。\n\n\
  在环境建立之后，C++ 样板代码调用函数 `main()`，从而开始执行你的代码。当你的程序结束时，它从 `main()` 退出。这使得 C++ 样板代码可以在将控制权交给杀掉程序的操作系统之前清理一些东西。\n\
  \n`main()` 的参数很复杂——我们稍后会回顾。`main()` 返回的 `int` 是一个错误指示。如果程序正常终止，则程序返回 `0`。任何其他值都可以用于指示导致程序退出的错误性质。\n\
  \n# 重载函数名\n\nC++ 必须有一种区分函数的方法。因此，两个函数不能共享相同的名称和参数列表，这被称为扩展名称或签名。以下扩展函数名都是不同的，并且可以存在于同一个程序中：\n\
  \n```cpp\nvoid someFunction(void)\n{\n  // ....执行某些功能\n}\n\nvoid someFunction(int\
  \ n)\n{\n  // ...执行某些不同的功能\n}\n\nvoid someFunction(double d)\n{\n  // ...执行某些非常不同的功能\n\
  }\n\nvoid someFunction(int n1, int n2)\n{\n  // ....再做一些不同的事情\n}\n```\n\nC++ 知道函数\
  \ `someFunction(void)`、`someFunction(int)`、`someFunction(double)` 和 `someFunction(int,\
  \ int)` 不是同一个。\n\n![Tip.eps](img/Tip_fmt.jpeg) 这种名称的重用被称为函数重载。\n\n程序员通常通过简写名称引用函数，即不带参数的函数名，例如\
  \ `someFunction()`，就像我把 Stephen 简称为 Stephen（实际上，我的绰号是 Randy，但请配合我一下）。\n\n这是一个使用具有唯一扩展名称的重载函数的典型应用：\n\
  \n```cpp\nint intVariable1, intVariable2;\ndouble doubleVariable;\n\n// 函数通过传递的参数类型来区分\n\
  someFunction(); // 调用 someFunction(void)\nsomeFunction(intVariable1); // 调用 someFunction(int)\n\
  someFunction(doubleVariable); // 调用 someFunction(double)\nsomeFunction(intVariable1,\
  \ intVariable2); // 调用\n// someFunction(int, int)\n\n// 这对常量也有效\nsomeFunction(1);\
  \ // 调用 someFunction(int)\nsomeFunction(1.0); // 调用 someFunction(double)\nsomeFunction(1,\
  \ 2); // 调用 someFunction(int, int)\n```\n\n在每情况下，参数的类型都与三个函数的扩展名称匹配。\n\n![Warning(bomb).eps](img/Warning(bomb)_fmt.jpeg)\
  \ 返回类型不是函数扩展名称的一部分。以下两个函数名称相同，因此它们不能存在同一个程序中：\n\n```cpp\nint someFunction(int n);\
  \ // 函数的全名\n// 是 someFunction(int)\n```\n\n\n\n\n\n```cpp\ndouble someFunction(int\
  \ n); // 同名函数\n\nlong l = someFunction(10); // 调用哪个函数？\n```\n\n在这里，C++ 不知道是将 `double`\
  \ 版本的 `someFunction()` 返回的值转换为 `long`，还是将 `int` 版本返回的值进行类型提升。\n\n## 定义函数原型\n\n函数在使用之前必须先进行声明。这样\
  \ C++ 才能将调用处与定义进行比较，以确保执行了任何必要的转换。然而，函数在第一次声明时并不一定需要定义。函数可以定义在模块的任何位置。（模块是 C++ 源代码文件的另一种称呼。）\n\
  \n请考虑以下代码段：\n\n```cpp\nint main(int nNumberofArgs, char* pszArgs[])\n{\n    someFunc(1,\
  \ 2);\n}\n\nint someFunc(double dArg1, int nArg2)\n{\n    // ...执行某些操作\n}\n```\n\
  \n在调用时，`main()` 并不不知道函数 `someFunc()` 的正确参数类型。C++ 可能会根据调用推断出完整的函数定义是 `someFunc(int,\
  \ int)` 且其返回类型为 `void`；然而，紧接着 `main()` 之后的函数定义显示，程序员希望将第一个参数转换为浮点数，且该函数实际上会返回一个值。\n\
  \n我知道，我懂 —— C++ 本可以没那么懒，通过向前查看来自动确定 `someFunc()` 的扩展名称，但它并没有这样做。我们需要的是某种方法，在使用 `someFunc()`\
  \ 之前告知 `main()` 完整名称。这是通过我们所谓的“函数原型”来实现的。\n\n原型声明的形式与没有函数体的函数相同。在使用时，原型声明如下：\n\n\
  ```cpp\nint someFunc(double, int);\n\nint main(int nNumberofArgs, char* pszArgs[])\n\
  {\n    someFunc(1, 2);\n}\n\nint someFunc(double dArg1, int nArg2)\n{\n    // ...执行某些操作\n\
  }\n```\n\n原型声明告诉整个世界（至少是声明之后的那个部分）`someFunc()` 的扩展名称是 `someFunction(double, int)`。现在\
  \ `main()` 中的调用知道在进行调用前将 `1` 强制转换为 `double`。此外，`main()` 知道 `someFunc()` 会向调用者返回一个\
  \ `int` 值。\n\n通常的做法是将模块中每个函数的函数原型包含在模块的开头，或者更常见的是，放在一个单独的文件，该文件可以在编译时被包含在其他模块中。这正是出现在《C++\
  \ For Dummies》官方程序模板开头的 `include` 语句的作用：\n\n```cpp\n#include <cstdio>\n#include\
  \ <cstdlib>\n#include <iostream>\n```\n\n这三个文件 `stdio`、`stdlib` 和 `iostream` 包含了我们一直在使用的常用系统函数的原型定义，例如\
  \ `system(\"PAUSE\")`。这些文件的内容由编译器作为其正常工作的一部分，插入到 `#include` 语句所在。\n\n第 10 章专门介绍包含文件和其他所谓的预处理器指令。\n\
  \n## 变量存储类型\n\n变量也会根据它们在函数中定义的位置和方式被分配存储类型，如下例所示：\n\n```cpp\nint globalVariable;\n\
  \nvoid fn()\n{\n    int localVariable;\n    static int staticVariable = 1;\n}\n\
  ```\n\n在函数内部声明的变量（如 `localVariable`）被称为局部变量。在执行通过函数 `fn()` 内的声明处之前，`localVariable`\
  \ 并不存在。当函数返回时，`localVariable` 停止存在。返回后，存储在 `localVariable` 中的任何值都将丢失。此外，只有 `fn()`\
  \ 可以访问 `localVariable` —— 其他函数无法进入该函数内部访问它。\n\n相比之下，变量 `globalVariable` 在程序开始执行时创建，只要程序运行它一直存在。所有函数始终都可以访问\
  \ `globalVariable`。\n\n`static` 关键字可以创建一种混合体 —— 一种介于全局变量和局部变量之间的东西。静态变量 `staticVariable`\
  \ 在第一次调用函数 `fn()` 执行到达声明处时创建，就像局部变量一样。然而，当程序执行从函数返回时，静态变量 `staticVariable` 不会被销。相反，它保留了从一次调用到下一次调的值。如果\
  \ `fn()` 为 `staticVariable` 赋值过一次，那么在下次调用 `fn()` 时它仍然在那里。在后续每次执行通过该处时，声明的初始化部分会被忽略。\n\
  \n## 第 7 章\n## 在数组中存储序列\n\n### 本章内容\n- 考虑类似数组的需求\n- 引入数组数据类型\n- 使用数组\n- 使用最常见的数组类型\
  \ —— 字符串\n\n数组是共享相同名称并使用索引引用的变量序列。数组是很有用的小东西，允许你存储许多许多相同类型且在某些方面相关的值 —— 例如，同一支球队上所有球员的击球率可能是存储在数组中的良好候选。数组也可以是多维的，例如，允许你在一个月份数组内存储一个击球率数组，从而让你能够按月份处理球队的击球率。\n\
  \n在本章中，你将了解如何初始化和使用数组来获取乐趣和利润。你还将了解到一种特别有用的数组形式，称为字符串。\n\n### 使用数组\n\n以下程序将从键盘输入一系列整数值，直到用户输入负数。然后程序将显示输入的数字并报告它们的总和。\n\
  \n```cpp\n// ArrayDemo - 演示数组的使用\n// 通过读取整数序列\n```\n\n\n\n\n\n```cpp\n// 然后显示它们及其它们的和\n\
  \n#include <cstdio>\n#include <cstdlib>\n#include <iostream>\n\nusing namespace\
  \ std;\n\n// 原型声明\nint readArray(int integerArray[], int maxNumElements);\nint sumArray(int\
  \ integerArray[], int numElements);\nvoid displayArray(int integerArray[], int numElements);\n\
  \nint main(int nNumberofArgs, char* pszArgs[])\n{\n    // 输入循环次数\n    cout << “此程序求加用户输入的“\n\
  \    << “数值\\n”;\n    cout << “输入负数以“\n    << “终止循环\\n”;\n    cout << endl;\n\n\
  \    // 从用户입处读取需要求和的数字并存入\n    // 本地数组\n    int inputValues[128];\n    int numberOfValues\
  \ = readArray(inputValues, 128);\n\n    // 现在输出数值及其总和\n    displayArray(inputValues,\
  \ numberOfValues);\n    cout << “和为“\n    << sumArray(inputValues, numberOfValues)\n\
  \    << endl;\n\n    // 在程序终止前等待用户准备就绪\n    // 以允许用户看到程序结果\n    system(“PAUSE”);\n\
  \    return 0;\n}\n\n// readArray - 从操作员读取整数到\n// ‘integerArray’直到操作员输入负数。\n// 返回存储的元素个数。\n\
  int readArray(int integerArray[], int maxNumElements)\n{\n    int numberOfValues;\n\
  \    for(numberOfValues = 0; numberOfValues < maxNumElements; numberOfValues++)\n\
  \    {\n        // 获取另一个数字\n        int integerValue;\n        cout << “输入下一个数字:\
  \ “;\n        cin >> integerValue;\n\n        // 如果是负数...\n        if (integerValue\
  \ < 0)\n        {\n            // ...则退出\n            break;\n        }\n      \
  \  // ...否则将数字存储\n        // 到存储数组中\n        integerArray[numberOfValues] = integerValue;\n\
  \    }\n    // 返回读取的元素个数\n    return numberOfValues;\n}\n\n// displayArray - 显示长度为\
  \ sizeOfFloatArray\n// 数组的成员\nvoid displayArray(int integerArray[], int numElements)\n\
  {\n    cout << “数组的值为:” << endl;\n    for (int i = 0; i < numElements; i++)\n  \
  \  {\n        cout << i << “: “ << integerArray[i] << endl;\n    }\n    cout <<\
  \ endl;\n}\n\n// sumArray - 返回整数数组\n// 成员之和\nint sumArray(int integerArray[], int\
  \ numElements)\n{\n    int accumulator = 0;\n    for (int i = 0; i < numElements;\
  \ i++)\n    {\n        accumulator += integerArray[i];\n    }\n    return accumulator;\n\
  }\n```\n\n`ArrayDemo` 程序起始于函数 `readArray()`、`sumArray()` 和 `displayArray()` 的原型声明，这些函数在稍后会需要用到。主程序从提示用户输入要求和的数据开始。然后，程序声明了一个数组\
  \ `inputValues[]`，用于存储用户输入的值。主程序将此数组传递给 `readArray()`，并带有数组的长度 ——即使用户没有输入负数，`readArray()`\
  \ 也无法读取超过 128 个值，因为那是 `inputValues[]` 数组中分配的全部空间。\n\n![Warning(bomb).eps](img/Warning(bomb)_fmt.jpeg)\
  \ 数组 `inputValues` 被声明为 128 个整数长度。如果你认为这已经足够了，千万别大意。无论你把数组做得多大，始终都要检查以确保你没有超过数组的限制。写入比数组能容纳更多的数据会导致程序运行异常，并经常导致崩溃。\n\
  \n`main` 函数随后调用 `displayArray()` 来打印数组的内容。最后，该函数调用 `sumArray()` 将数组中的元素相加。\n\n`readArray()`\
  \ 函数接受两个参数：用于存储其读取的值的 `integerArray[]` 以及 `maxNumElements`（即有空间容纳的最大整数个数）。该函数从一个\
  \ `for` 循环开始读取整数值。函数读取的每个非负值都会保存到 `integerArray[]` 中。第一个元素进入 `integerArray[0]`，第二个进入\
  \ `integerArray[1]`，依此类推。\n\n一旦用户输入负数，程序就会跳出循环并返回输入的总数 `numberOfValues`。\n\n`displayArray()`\
  \ 函数也使用 `for` 循环遍历数组元素，从 0 开始一直到最后一个元素，即 `numElements - 1`。最后一个函数 `sumArray()` 也遍历数组，但是将存储在其中的元素累加到\
  \ `accumulator` 中，然后将其返回给调用者。\n\n再次注意，`displayArray()` 和 `sumArray()` 函数中的索引 `i`\
  \ 初始化为 0 而不是 1。此外，注意 `for` 循环在 `i` 达到 `numElements` 时如何立即终止。示例运行的输出如下：\n\n```\n\
  此程序求加用户输入的数值\n输入负数以终止循环\n输入下一个数字: 10\n输入下一个数字: 20\n输入下一个数字: 30\n输入下一个数字: 40\n输入下一个数字:\
  \ -1\n数组的值为:\n0: 10\n1: 20\n2: 30\n3: 40\n和为 100\n按任意键继续 . . .\n```\n\n![Remember.eps](img/Remember_fmt.jpeg)\
  \ 只是让非程序员感到困惑，“遍历”（iterate）一词意味着遍历一组对象（如数组）。程序员说上述函数在在“遍历”数组。\n\n### 初始化数组\n局部变量在声明之前不会包含垃圾值，幸运的是，小数组可以在声明时进行初始化。以下代码演示了如何实现：\n\
  \n```cpp\nfloatArray[5] = {0.0, 1.0, 2.0, 3.0, 4.0};\n```\n\n这会将 `floatArray[0]`\
  \ 初始化为 0.0，`floatArray[1]` 初始化为 1.0，`floatArray[2]` 初始化为 2.0，依此类推。如果元素个数小于尺寸，C++\
  \ 会用 0 填充初始化列表。事实上，可以使用空列表将数组初始化为 0：\n\n```cpp\nint nArray[128] = {};\n```\n\n初始化常量的数量可以确定数组的大小。例如，你通过数括号内的数值就可以确定\
  \ `floatArray` 有五个元素。以下声明与前一个完全相同：\n\n```cpp\nfloat floatArray[] = {0.0, 1.0, 2.0,\
  \ 3.0, 4.0};\n```\n\n### 越界访问数组\n数学家从 1 开始计数数组。大多数编程语言也从 1 开始偏移。C++ 数组从 0 开始计数。C++\
  \ 数组的第一个成员是 `valueArray[0]`。这意味着一个 128 个整数数组的最后一个元素是 `integerArray[127]`，而不是 `integerArray[128]`。\n\
  \n对程序员不幸的是，C++ 不检查你使用的索引是否在数组范围内。C++ 完全允许你访问 `integerArray[200]`。我们的 `integerArray`\
  \ 数组只有 128 个整数长 —— 200 已经进了别人的院子 72 个整数。无法知道住在在那里以及他们在该位置存储了什么。从 `integerArray[200]`\
  \ 读取将返回一个未知且不可预测的值。写入该位置会产生不可预测的结果。它可能什么都不做 —— 可能是废弃且闲用的。另一方面，它可能会覆盖某些数据，从而扰乱邻居并导致程序运行随机。或者可能会导致程序崩溃。\n\
  \n访问数组常见的错误方式是读取或写入位置 `integerArray[128]`。虽然它只比数组末出一个元素，但读取或写入该位置的危险性与任何其他错误地址一样。\n\
  \n\n\n\n\n从表面上看，`ArrayDemo` 程序的功能与我们之前的非基于数组的程序并没有什么区别。诚然，这个版本可以在计算和之前通过显示输入数字集合来重放输入，但这一功能似乎并不算是天翻覆地的。\n\
  \n然而，重新显示输入值的能力暗示了使用数组的显著优势。数组允许程序多次处理一系列数字。主程序能够将输入值数组传递给 `displayArray()` 进行显示，然后将相同的数字再次传递给\
  \ `sumArray()` 进行相加。\n\n## 定义和使用数组数组\n\n数组擅长存储数字序列。某些应用需要“序列的序列”。这种矩阵配置的一个经典例子是电子表格。电子表格像棋盘一样布局，表格中的每个元素都同时具有\
  \ `x` 偏移量和 `y` 偏移量。\n\nC++ 按照以下方式实现矩阵：\n\n```cpp\nint intMatrix[10][5];\n```\n\n\
  该矩阵在其中一个维度上有 10 个元素，在另一个维度上有 5 个元素，总共有 50 个元素。换句话说，`intMatrix` 是一个包含 10 个元素的数组，其中每个元素都是一个包含\
  \ 5 个整数的数组。正如你所预期的，矩阵的一个角位于 `intMatrix[0][0]`，而另一个角位于 `intMatrix[9][4]`。\n\n你认为\
  \ `intMatrix` 在 `x` 维度还是 `y` 维度上长度为 10 个元素取决于个人喜好。矩阵可以以数组相同的方式初始化：\n\n```cpp\nint\
  \ intMatrix[2][3] = {{1, 2, 3}, {4, 5, 6}};\n```\n\n这一行代码将包含 3 个元素的数组 `intMatrix[0]`\
  \ 初始化为 1、2 和 3；将包含 3 个元素的数组 `intMatrix[1]` 初始化为 4、5 和 6。\n\n## 使用字符数组\n\n数组的元素可以是任何类型。浮点型、双精度和长数组都是可能的；然而，字符数组具有特殊的意义。\n\
  \n### 创建字符数组\n\n人类的单词和句子可以表示为字符数组。包含我名字的字符数组将显示为：\n\n```cpp\nchar sMyName[] = {'S’,\
  \ ‘t’, ‘e’, ‘p’, ‘h’, ‘e’, ‘n’};\n```\n\n接下来的的小程序显示了我的名字：\n\n```cpp\n// CharDisplay\
  \ - 将字符数组输出到\n// 标准输出，MS-DOS 窗口\n#include <cstdio>\n#include <cstdlib>\n#include\
  \ <iostream>\n\nusing namespace std;\n\n//原型声明\nvoid displayCharArray(char charArray[],\
  \ int sizeOfArray);\n\nint main(int nNumberofArgs, char* pszArgs[])\n{\n    char\
  \ charMyName[]={'S’, ‘t’, ‘e’, ‘p’, ‘h’, ‘e’, ‘n’};\n    displayCharArray(charMyName,\
  \ 7);\n    cout << endl;\n    // 在终止程序前等待用户准备好\n    // 以允许用户查看程序结果\n    system(\"\
  PAUSE\");\n    return 0;\n}\n\n// displayCharArray - 通过逐个输出\n//字符来显示字符数组\nvoid displayCharArray(char\
  \ charArray[], int sizeOfArray)\n{\n    for(int i = 0; i< sizeOfArray; i++)\n  \
  \  {\n        cout << charArray[i];\n    }\n}\n```\n\n该程序声明了一个固定字符数组 `charMyName`，其中包含——你猜对了——我的名字（还有更好的名字吗？）。这个数组连同它的长度被传递给函数\
  \ `displayCharArray()`。`displayCharArray()` 函数与示例程序中的 `displayArray()` 函数相同，只是这个版本显示的是字符而不是整数。\n\
  \n这个程序运行良好；然而，将数组长度与数组本身一起传递是不方便的。如果我们能想出一个规则来确定字符字符串的结束，我们就不需要传递它的长度了——当你遇到那个告知你结束的特殊规则时，你就知道字符串已完整。\n\
  \n### 创建字符字符串\n\n在许多情况下，每个元素的所有值都是可能的。然而，C++ 预留了特殊的“字符” 0 作为非字符。我们可以使用 `'\\0'` 来标记字符数组的结束。（`'\\\
  0'` 的数值值是 0，但 `'\\0'` 的类型是 `char`。）\n\n![Remember.eps](img/Remember_fmt.jpeg) 字符\
  \ `'\\y'` 是其八进制值为 `y` 的字符。字符 `'\\0'` 是值为 0 的字符，也称为空字符（null character）。使用该规则，之前的的小程序变成了：\n\
  \n```cpp\n// DisplayString - 将字符数组输出到\n// 标准输出，MS-DOS 窗口\n#include <cstdio>\n#include\
  \ <cstdlib>\n#include <iostream>\n\nusing namespace std;\n\n//原型声明\nvoid displayString(char\
  \ stringArray[]);\n\nint main(int nNumberofArgs, char* pszArgs[])\n{\n    char charMyName[]\
  \ = {'S’, ‘t’, ‘e’, ‘p’, ‘h’, ‘e’, ‘n’, ‘\\0’};\n    displayString(charMyName);\n\
  \    cout << endl;\n    // 在终止程序前等待用户准备好\n    // 以允许用户查看程序结果\n    system(\"PAUSE\"\
  );\n    return 0;\n}\n\n// displayString - 逐个字符\n//显示字符字符串\nvoid displayString(char\
  \ stringArray[])\n{\n    for(int i = 0; stringArray[i] != ‘\\0’; i++)\n    {\n \
  \       cout << stringArray[i];\n    }\n}\n```\n\n`charMyName` 的声明为字符数组增加了额外的空字符\
  \ `'\\0'`。`displayString()` 程序遍历字符数组直到遇到空字符。使用 `displayString()` 比使用 `displayCharArray()`\
  \ 更简单，因为它不再需要传递长度。选择 `'\\0'` 作为终止字符并不是随机的；这种做法根植于 C++ 语言之中。\n\n## 使用字符处理字符串\n\n\
  字符串终止数组非常方便。接下来的 `Concatenate` 程序从键盘输入两个字符串并将它们合并为一个字符串：\n\n```cpp\n// Concatenate\
  \ - 合并两个字符串\n// 中间带有空格\n#include <cstdio>\n#include <cstdlib>\n#include <iostream>\n\
  \nusing namespace std;\n\n//原型声明\nvoid concatString(char szTarget[], const char\
  \ szSource[]);\n\nint main(int nNumberofArgs, char* pszArgs[])\n{\n    // 读取第一个字符串...\n\
  \    char szString1[260];\n    cout << “Enter string #1:”;\n    cin.getline(szString1,\
  \ 128);\n\n    // ...现在是第二个字符串...\n    char szString2[128];\n    cout << “Enter\
  \ string #2:”;\n    cin.getline(szString2, 128);\n\n    // ...将第一个字符串拼接“ - ”...\n\
  \    concatString(szString1, “ - “);\n\n    // ...现在加上第二个字符串...\n    concatString(szString1,\
  \ szString2);\n\n    // ...并显示结果\n    cout << \"\\n\" << szString1 << endl;\n\n\
  \    // 在终止程序前等待用户准备好\n    // 以允许用户查看程序结果\n    system(\"PAUSE\");\n    return 0;\n\
  }\n\n// concatString - 将 szSource 字符串\n// 接到 szTarget 字符串的结尾\nvoid concatString(char\
  \ szTarget[], const char szSource[])\n{\n    // 找到第一个字符串的结尾\n    int targetIndex\
  \ = 0;\n    while(szTarget[targetIndex])\n    {\n        targetIndex++;\n    }\n\
  \n    // 将第二个接到第一个的结尾\n    int sourceIndex = 0;\n    while(szSource[sourceIndex])\n\
  \    {\n        szTarget[targetIndex++] = szSource[sourceIndex];\n        sourceIndex++;\n\
  \    }\n}\n```\n\n\n\n\n\n```cpp\nszTarget[targetIndex] = szSource[sourceIndex];\n\
  targetIndex++;\nsourceIndex++;\n}\n// 加上终止空字符\nszTarget[targetIndex] = ‘\\0’;\n\
  }\n```\n\n`Concatenate` 程序读取两个字符字符串并在它们中间加上一个 “ - ” 将它们连接起来。\n\n程序首先从键盘读取一个字符串。程序没有使用常规的\
  \ `cin >> szString1`，原因有两个。首先，`cin >>` 操作在遇到任何类型的空白字符时会停止读取。它会读取到第一个空白字符为止的字符，丢弃该空白字符，并将剩余字符留在输入漏斗中供下一个\
  \ `cin >>` 语句使用。因此，如果我输入“the Dog”，`szString2` 将填充为“the”，而单词“Dog”将留在输入缓冲区中。\n\n第二个原因是\
  \ `getline()` 允许程序员指定缓冲区的大小。调用 `getline(szString2, 128)` 无论输入多少字节，读取的内容都不会多超过 128\
  \ 字节。\n\n相反，调用 `getline()` 会输入整行内容，但不包括末尾的换行符。我们将在第 23 章中与其他文件 I/O 函数详细回顾此函数。\n\n\
  在将第一个字符串读取到 `szString1[]` 后，程序通过调用 `concatString()` 在末尾添加 “ - ”。它通过调用带有 `szString2[]`\
  \ 的 `concatString()` 来连接第二个字符串。\n\n`concatString()` 函数接受一个目标字符串 `szTarget` 和一个源字符串\
  \ `szSource`。函数首先扫描 `szTarget` 以寻找终止空字符，并将其存储在 `targetIndex` 中。然后函数进入第二个循环，从终止空字符开始将字符从\
  \ `szSource` 复制到 `szTarget`。`concatString()` 的最后一个语句在完成的字符串上加上终止空字符。\n\n程序的示例输出如下：\n\
  \n```\nEnter string #1:This is a string\nEnter string #2:THIS IS A STRING\n\nThis\
  \ is a string - THIS IS A STRING\n\nPress any key to continue . . .\n```\n\n###\
  \ 添加一些库函数\n\nC++ 程序员经常需要处理以零终止的字符串。C++ 提供了许多标准字符串处理函数来使工作更容易。其中一些函数列在表 7-1 中。\n\n\
  #### 表 7-1 字符串处理函数\n\n| 名称 | 操作 |\n| :--- | :--- |\n| `int strlen(string)` | 返回字符串中的字符数（不包括终止空字符）。\
  \ |\n| `char* strcpy(target, source)` | 将源字符串拷贝到目标数组。 |\n| `char* strcat(target,\
  \ source)` | 将源字符串连接到目标字符串的末尾。 |\n| `char* strncpy(target, source, n)` | 从源字符串复制最多\
  \ `n` 个字符到目标数组。 |\n| `char* strncat(target, source, n)` | 将源字符串连接到目标字符串的末尾或 `n`\
  \ 个字符，以较者为准。 |\n| `char* strstr(string, pattern)` | 返回 `pattern` 在 `string` 中首次出现的地址。如果未找到\
  \ `pattern` 则返回空指针。 |\n| `int strcmp(source1, source2)` | 比较两个字符串。如果 `source1` 在字典中于\
  \ `source2` 之前则返回 -1，在之后则返回 1。如果两个字符串完全匹配则返回 0。 |\n| `int strncmp(source1, source2,\
  \ n)` | 比较两个字符串中的前 `n` 个字符。 |\n\n![Tip.eps](img/Tip_fmt.jpeg) 你需要在任何使用 `str...`\
  \ 函数的程序开头添加 `#include <cstring>` 语句，因为该头文件包含了 C++ 检查你的工作时所需的原型声明。\n\n![Warning(bomb).eps](img/Warning(bomb)_fmt.jpeg)\
  \ 对于任何理智的人来说，`str...()` 函数的参数看起来都是反向的（你可能认为这是对“理智”的酸测试）。例如，函数 `strcat(target, source)`\
  \ 将第二个字符串 `source` 接到第一个参数 `target` 的末尾。\n\n`strncpy()` 和 `strncat()` 函数与它们的 `strcpy()`\
  \ 和 `strcat()` 相似，不同在于它们接受目标缓冲区长度作为参数之一。调用 `strncpy(szTarget, szSource, 128)` 的意思是“将\
  \ `szSource` 中的字符拷贝到 `szTarget`，直到拷贝空字符或拷贝了 128 个字符，以较者为准”。这避免了无意中写入源字符串数组末尾之外。\n\
  \n### 为宽字符串留位置\n\n标准 C++ 库包含了处理宽字符字符串的类似函数。其中一些函数列在表 7-2 中。\n\n![Remember.eps](img/Remember_fmt.jpeg)\
  \ 回忆第 2 章，宽字符用于必须支持外语言的应用，在这些应用中，区区 255 个不同的字符可能不够。\n\n#### 表 7-2 宽字符串处理函数\n\n|\
  \ 名称 | 操作 |\n| :--- | :--- |\n| `int wcslen(string)` | 返回字符串中宽字符的数量（不包括终止空字符）。 |\n\
  | `wchar_t* wcscpy(target, source)` | 将源宽字符串拷贝到目标数组。 |\n| `wchar_t*wcscat(target,\
  \ source)` | 将源宽字符串连接到目标宽字符串的末尾。 |\n| `wchar_t*wcsncpy(target, source, n)` | 从源字符串复制最多\
  \ `n` 个宽字符到目标数组。 |\n| `wchar_t*wcsncat(target, source, n)` | 将源字符串连接到目标字符串的末尾或 `n`\
  \ 个字符，以较者为准。 |\n| `wchar_t*wcsstr(string, pattern)` | 返回 `pattern` 在 `string` 中首次出现的地址。如果未找到\
  \ `pattern` 则返回空指针。 |\n| `int wcscmp(source1, source2)` | 比较两个字符串。如果 `source1` 在字典中于\
  \ `source2` 之前则返回 -1，在之后则返回 1。如果两个字符串完全匹配则返回 0。 |\n| `int wcsncmp(source1, source2,\
  \ n)` | 比较两个字符串中的前 `n` 个字符。 |\n\n以下显示了 Concatenate 程序的宽字符版本：\n\n```cpp\n// ConcatenateWide\
  \ - 使用库例程\n// 在中间带有破折号的情况下连接两个宽字符串\n#include <cstdio>\n#include <cstdlib>\n#include\
  \ <iostream>\n\nusing namespace std;\n\nint main(int nNumberofArgs, char* psz[])\n\
  {\n    // 读取第一个字符串...\n    wchar_t wszString1[260];\n    cout << “Enter string #1:”;\n\
  \    wcin.getline(wszString1, 128);\n\n    // ...现在是第二个字符串...\n    wchar_t wszString2[128];\n\
  \    cout << “Enter string #2:”;\n    wcin.getline(wszString2, 128);\n\n    // 现在将第二个接到第一个的末尾\n\
  \    // 中间带有破折号\n    wcsncat(wszString1, L” - “, 260);\n    wcsncat(wszString1,\
  \ wszString2, 260);\n\n    wcout << L”\\n” << wszString1 << endl;\n\n    // 在程序终止前等待用户准备好\n\
  \    // 以允许用户看到程序结果\n    system(“PAUSE”);\n\n    return 0;\n}\n```\n\n宽字符字符串程序与其单字节字符版本相似，但有以下不同：\n\
  \n- 变量声明为 `wchar_t` 而不是 `char`。\n- 常量字符和常量字符串前带有一个 `L`，例如 `L”This is a wide string`。\n\
  - 使用对象 `wcin` 和 `wcout` 代替 `cin` 和 `cout` 进行输入输出。\n- `wcs...` 函数代替了 `str...` 函数。\n\
  \n# 第 8 章：初探 C++ 指针\n\n## 本章内容\n\n- 变量中的内存地址\n- 声明和使用指针变量\n- 识别指针固有的危险\n- 将指针传递给函数\n\
  - 在堆上分配对象（无论那是什么）\n\n\n\n\n到目前为止，与其他编程语言相比，C++ 语言相当于传统。诚然，某些计算机语言缺乏第 4 章中那样的（非）逻辑运算符，而且\
  \ C++ 对某些事物有其独特的符号表示，但在概念上并没有新意。C++ 真正通过对指针变量的使用脱颖而出。指针是一个“指向”其他变量的变量。我意识到这是一个循环论证，但在你进入本章内容之前，请至少暂缓对它的怀疑。\n\
  \n本章引入了指针变量类型。它从一些概念定义开始，流经指针语法，然后介绍了席卷 C++ 编程世界的指针狂热的一些原因。\n\n## 变量大小\n\n我的体重一直在波动，但在这里我指的是变量的大小，而不是我自己的体重。内存以字节（bytes）或位（bits）为单位。`sizeof`\
  \ 关键字返回参数的字节数。以下程序使用它来确定不同变量的大小：\n\n```cpp\n// VariableSize - 输出每个类型的大小\n\n#include\
  \ <cstdio>\n#include <cstdlib>\n#include <iostream>\n\nusing namespace std;\n\n\
  int main(int nNumberofArgs, char* pszArgs[])\n{\n    bool b;\n    char c;\n    int\
  \ n;\n    long l;\n    long long ll;\n    float f;\n    double d;\n    long double\
  \ ld;\n\n    cout << \"sizeof bool = \" << b << endl;\n    cout << \"sizeof char\
  \ = \" << c << endl;\n    cout << \"sizeof int = \" << n << endl;\n    cout << \"\
  sizeof long = \" << l << endl;\n    cout << \"sizeof long long = \" << ll << endl;\n\
  \    cout << \"sizeof float = \" << f << endl;\n    cout << \"sizeof double = \"\
  \ << d << endl;\n    cout << \"sizeof long double = \" << ld << endl;\n\n    //\
  \ 在程序终止前等待用户准备好\n    // 让用户查看结果\n    system(\"PAUSE\");\n    return 0;\n}\n```\n\
  \n`VariableSize` 程序产生以下输出：\n\n```\nsizeof bool = 1\nsizeof char = 1\nsizeof int\
  \ = 4\nsizeof long = 4\nsizeof long long = 8\nsizeof float = 4\nsizeof double =\
  \ 8\nsizeof long double = 12\n按任意键继续 . . .\n```\n\n![Remember.eps](img/Remember_fmt.jpeg)\
  \ 正如所说，“你的结果可能会不同。”如果你使用与包含不同的编译器，可能会得到不同的结果。C++ 并没有明确说明 `int` 必须有多大，它只是说 `long`\
  \ 和 `int` 一大或更大，`double` 和 `float` 大。`VariableSize` 输出对于 32 位处理器（如 Pentium）是典型的。\n\
  \n## 地址是什么？\n\n正如俗话说，“每个人都有一个住处。”每个 C++ 变量都存储在内存的某处。内存被分为各个字节，每个字节都有自己的地址，0, 1,\
  \ 2 等。变量 `int` 可能在地址 `0x100`，而 `float` 可能在 `0x180`。（按照惯例，内存地址用十六进制表示。）当然，`int` 和\
  \ `float` 可能在内存的其它位置——只有计算机在程序执行时才确定。这有点像酒店。当你预订时，你被分配到房间 `0x100`。（我知道房间号通常不用十六进制表示，但请理解。）你的朋友可能被分配到房间\
  \ `0x180`。每个变量在创建时都被分配一个地址（稍后介绍）。\n\n## 地址运算符\n\n表 8-1 显示了两个指针运算符。`&` 运算符表示“你的地址”，而\
  \ `*` 表示“该地址的值”。\n\n### 表 8-1 指针运算符\n\n| 运算符 | 含义 |\n| :--- | :--- |\n| `&` (一元)\
  \ | 的地址 |\n| `*` (一元) | (表达式中) 被指向的对象 |\n| `*` (一元) | (声明中) 指向 |\n\n取符号也用于声明变量，你将在本章稍些时候看到。`Layout`\
  \ 程序演示了如何使用 `&` 运算符显示变量在内存中的布局：\n\n```cpp\n// Layout - 此程序试图让读者\n// 了解内存的布局\n#include\
  \ <cstdio>\n#include <cstdlib>\n#include <iostream>\nusing namespace std;\n\nint\
  \ main(int nNumberofArgs, char* pszArgs[])\n{\n    int start;\n    int n;\n    long\
  \ l;\n    long long ll;\n    float f;\n    double d;\n    long double ld;\n    int\
  \ end;\n\n    // 设置输出为十六进制\n    cout.setf(ios::hex);\n    cout.unsetf(ios::dec);\n\
  \n    // 输出每个变量的地址\n    // 以了解变量在内存\n    // 中的布局\n    cout << \"--- = \" << &start\
  \ << endl;\n    cout << \"&n = \" << &n << endl;\n    cout << \"&l = \" << &l <<\
  \ endl;\n    cout << \"&ll = \" << &ll << endl;\n    cout << \"&f = \" << &f <<\
  \ endl;\n    cout << \"&d = \" << &d << endl;\n    cout << \"&ld = \" << &ld <<\
  \ endl;\n    cout << \"--- = \" << &end << endl;\n\n    // 在程序终止前等待用户准备好\n    //\
  \ 让用户查看结果\n    system(\"PAUSE\");\n    return 0;\n}\n```\n\n程序声明了一组不同类型的变量。然后对每个变量应用\
  \ `&` 运算符。在 Code::Blocks 中执行的结果如下：\n\n```\n--- = 0x22ff1c\n&n = 0x22ff18\n&l = 0x22ff14\n\
  &ll = 0x22ff08\n&f = 0x22ff04\n&d = 0x22ef8\n&ld = 0x22fee0\n--- = 0x22fedc\n按任意键继续\
  \ . . .\n```\n\n![Remember.eps](img/Remember_fmt.jpeg) 你的结果可能会不同。程序变量的绝对地址取决于许多因素。通常，它甚至可能从程序的这一次执行到下一次发生变化。C++\
  \ 标准确实没有规定变量在内存中的布局。\n\n注意变量 `n` 距离第一个声明的变量（`start`）正好是 4 个字节，这对应于 `int` 的大小（4 字节）。同样，变量\
  \ `l` 出现在下方 4 个字节处，这也是 `long` 的大小。然而，`double` 变量 `d` 距离其相邻变量 `f` 有整整 12 个字节（`0xff0`\
  \ — `0ef8`）。更糟糕的是，`long double` 变量 `ld` 距离 `d` 有 24 个字节（`000c`）。\n\n![Warning(bomb).eps](img/Warning_bomb)_fmt.jpeg)\
  \ C++ 编译器并不要求在变量之间留空。\n\n![Tip.eps](img/Tip_fmt.jpeg) Code::Blocks/gcc 编译器可能会在我们变量之间浪费空间。\n\
  \n\n\n指针变量的声明与普通变量相似，只是多了一个单元运算符 `*`。这个 `*` 字符可以出现在基本类型名称之间的任何位置——以下两个声明是等价的：\n\n\
  ```\nint* pnVar1;\nint *pnVar2;\n```\n\n使用哪种取决于个人喜好。\n\n![Tip.eps](img/Tip_fmt.jpeg)\
  \ `*` 字符被称为星号（asterisk character，这符合逻辑），但因为 asterisk 这个词很难读，很多程序员开始称其为 star（星形），或者不常见地称为\
  \ splat（溅点号）。因此，他们会说“star `pnVar`”或“splat `pnVar`”。\n\n在表达式中，单元运算符 `&` 表示“……的地址”。因此，我们将赋值语句\
  \ `pnVar = &nVar;` 读取为“`pnVar` 获取了 `nVar` 的地址”。\n\n## 使用不同类型的指针\n\n每个表达式都有类型和值。表达式\
  \ `nVar` 的类型是 `int`；`&nVar` 的类型是“指向整数的指针”，写作 `int*`。将其与 `pVar` 的声明对比，你会发现类型是完全匹配的：\n\
  \n```\nint* pnVar = &nVar; // 赋值语句的双方\n// 类型均为 int*\n```\n\n同样，因为 `pnVar` 的类型是 `int*`，所以\
  \ `*pnVar` 的类型是 `int`：\n\n```\n*pnVar = 10; // 赋值语句的双方\n// 类型均为 int\n```\n\n`pnVar`\
  \ 所指向的对象类型是 `int`。这等于说，如果 `houseAddress` 是某间房子的地址，那么 `houseAddress` 指向的东西必须是一个房子。令人难以置信，但事实如此。\n\
  \n指向其他类型变量的指针写法相同：\n\n```\ndouble doubleVar;\ndouble* pdoubleVar = &doubleVar;\n\
  *pdoubleVar = 10.0;\n```\n\n在奔腾级级机器上，指针无论指向什么，都占用 4 个字节。也就是说，奔腾上的地址长度就是 4 字节，仅此而已。\n\
  \n![onthecd.eps](img/onthecd_fmt.jpeg) 查看随附 CD-ROM 上的 `LayoutError` 程序，看看当错误地从一种指针类型转换为另一种类型时，情况会变得多么糟糕。\n\
  \n房子的类比大致如下：\n\n```\nHouse* houseAddress = &”123 Main Street”;\nHotel* hotelAddress;\n\
  hotelAddress = (Hotel*)houseAddress;\n*hotelAddress = TheRitz;\n```\n\n`houseAddress`\
  \ 被初始化指向我的房子。变量 `hotelAddress` 是一个指向酒店的指针。现在，房子地址被强制转换为酒店地址，并保存到变量 `hotelAddress`\
  \ 中。最后，`TheRitz` 被直接落在我的房子上。因为 `TheRitz` 比我的房子大一点（好吧，大得多），`TheRitz` 连我邻居的房子也冲掉并不意外。\n\
  \n## 将指针传递给函数\n\n指针变量的用途之一是在向函数传递参数。要理解为什么这很重要，你需要理解参数是如何传递给函数的\n\n### 按值传递\n\n\
  默认情况下，参数是通过值传递给函数的。这导致了一个有些出乎意的结果：在函数中改变变量的值通常不会改变调用函数中对应的值。考虑以下示例代码段：\n\n```\n\
  void fn(int nArg)\n{\n  nArg = 10;\n  // 此时 nArg 的值是 10\n}\n\nvoid parent(void)\n\
  {\n  int n1 = 0;\n  fn(n1);\n  // 此时 n1 的值仍然是 0\n}\n```\n\n在这里，`parent()` 函数将整数变量\
  \ `n1` 初始化为 0。然后 `n1` 的值被传递给 `fn()`。进入函数后，`nArg` 等于传递的值 0。`fn()` 在返回 `parent()`\
  \ 之前将 `nArg` 的值改为 10。可能令人惊讶的是，返回到 `parent()` 后，`n1` 的值仍然是 0。\n\n这种行为的原因是 C++ 并没有将变量本身传递给函数（我甚至不确定那意味着什么）。相反，C++\
  \ 传递的是调用时变量中所包含的值。也就是说，表达式会被求值（即使它只是一个变量名），并传递其结果。\n\n在示例中，`n1` 的值（即 0）被传递给了 `fn()`。函数对该值的操作对\
  \ `n1` 没有影响。\n\n![Warning(bomb).eps](img/Warning(bomb)_fmt.jpeg) 演讲者很容易偷懒，说诸如“将变量\
  \ `x` 传递给函数 `fn()`”。这实际上是指传递表达式 `x` 的值。\n\n### 传递指针值\n\n与其他任何内置类型一样，指针也可以作为参数传递给函数：\n\
  \n```\nvoid fn(int* pnArg)\n{\n  *pnArg = 10;\n}\n\nvoid parent(void)\n{\n  int\
  \ n = 0;\n  fn(&n); // 这传递了 n 的地址\n  // 现在 n 的值是 10\n}\n```\n\n在这种情况下，传递给函数 `fn()`\
  \ 的 `n` 的地址而不是 `n` 的值。当你考虑到 `fn()` 的赋值时，这种差异的意义显而易见。\n\n假设 `n` 位于地址 `0x100`。调用 `fn(&n)`\
  \ 传递的是值 `0x100` 而不是 10。在 `fn()` 内部，赋值 `*pnArg = 10` 将 10 存储在位于 `0x100` 的 `int` 变量中，从而覆盖了值\
  \ 0。返回到 `parent()` 后， `n` 的值变为 10，因为 `n` 只是 `0x100` 的另一个名字。\n\n## 按引用传递\n\nC++ 提供了一种快捷方式，让人无需费处理指针。以下声明创建了对\
  \ `n1` 的引用：\n\n```cpp\nint n1;\nint& nRef = n1; // 声明对 n1 的引用\n```\n\n引用变量的主要应用是在函数调用中：\n\
  \n```cpp\nvoid fn(int& rnArg)\n{\n  rnArg = 10;\n}\n\nvoid parent(void)\n{\n  int\
  \ n1 = 0;\n  fn(n1); // 传递 n1 的引用\n  // 现在 n1 是 10\n}\n```\n\n这被称为“按引用传递”。语法 `int&\
  \ rnArg` 将 `rnArg` 声明为整数的引用。`fn()` 函数将值 10 存储在 `rnArg` 引用的位置。\n\n![Tip.eps](img/Tip_fmt.jpeg)\
  \ 引用语法将应用“地址的”运算符的责任交给了 C++，而不是要求程序员去这样做。\n\n![Warning(bomb).eps](img/Warning(bomb)_fmt.jpeg)\
  \ 你不能用按引用传递的函数来重载按值传递函数。因此，C++ 不知道应该调用哪一个。\n\n## 常量\n\n程序一旦定义了声明为 `const` 的变量，就无法更改它的值。然而这在指针变量的情况下引入了一个有趣的二分法。考虑以下声明：\n\
  \n```cpp\nconst int* pInt;\n```\n\n这里的常量究竟是什么？我们不能改变什么？是变量 `pInt` 还是 `pInt` 指向的整数？事实证明两者都是可能的，但此声明声明了一个指向常量内存位置的变量指针。因此：\n\
  \n```cpp\nconst int* pInt; // 声明指向常量 int 的指针\nint nVar;\n\npInt = &nVar; // 这是允许的\n\
  *pInt = 10; // 但这是不允许的\n```\n\n我们可以更改 `pInt` 的值，例如将其指向 `nVar` 的地址。但示例片段中的最后赋值会产生编译器错误，因为我们不能改变\
  \ `pInt` 所指向的常量 int。\n\n如果我意图创建一个具有常量值的指针变量呢？以下片段展示了这一点：\n\n```cpp\nint nVar;\n\
  int * const cpInt = &nVar; // 声明指向变量整数\n// 的常量指针\n*cpInt = 10; // 现在这是合法的...\ncpInt++;\
  \ // 但这是不允许的\n```\n\n变量 `cpInt` 是一个指向变量 `int` 的常量指针。程序员不能更改指针的值，但可以更改所指向整数的值。常量可以通过赋值或初始化添加，但无法（轻易）剥离。因此：\n\
  \n```cpp\nint nVar = 10;\n```\n\n\n\n\n\n```cpp\nint pVar = &nVar;\n\nconst int*\
  \ pcVar = pVar; // 这是合法的\n\nint* pVar2 = pcVar; // 这是不合法的\n```\n\n赋值 `pcVar = pVar;`\
  \ 是允许的 —— 这是添加了 `const` 限制。片段中的最后一个赋值是不允许的，因为它试图移除 `pcVar` 的常量属性。\n\n变量可以作为函数调用的一部分被隐式强制类型转换，如下例所示：\n\
  \n```cpp\nvoid fn(const int& nVar);\n\nvoid mainFn()\n{\n  int n;\n  fn(10); //\
  \ 调用 fn(const int&)\n  fn(n); // 通过将 n 视为 const 来调用同一个函数\n} // 就像它是 const 一样\n```\n\
  \n声明 `fn(const int&)` 表示函数 `fn()` 不修改其参数的值。在传递常量 10 的引用时，这一点很重要。在传递变量 `n` 的引用时这并不重要，但这样做也没有害。\n\
  \n最后，`const` 可以作为同名函数的区分符：\n\n```cpp\nvoid fn(const int& nVar);\n\nvoid fn(int&\
  \ nVar);\n\nvoid mainFn()\n{\n  int n;\n  fn(10); // 调用第一个函数\n  fn(n); // 调用第二个函数\n\
  }\n```\n\n# 使用称为堆（Heap）的内存块\n\n堆是一个无形状的内存块，程序可以根据需要访问它。本节描述了它之所以存在的原因以及如何使用它。\n\n\
  就像可以将指针传递给函数一样，函数也可以返回指针。一个返回 double 类型地址的函数声明如下：\n\n```cpp\ndouble* fn(void);\n\
  ```\n\n然而，在返回指针时必须非常小心。为了理解其中的危险性，你必须了解变量的作用域。（不，我指的不是变量缩击镜。）\n\n## 有限作用域\n\n除了是漱口水（mouthwash）之外，作用域是指变量定义的范围。考虑以下代码片段：\n\
  \n```cpp\n// 以下变量可以被所有函数访问，\n// 只要程序在运行就可以定义（全局作用域）\nint intGlobal;\n\n// 以下变量 intChild\
  \ 仅能被函数\n// 访问，并且仅在 C++ 执行 child() 或\n// child() 调用的函数期间才定义（函数作用域）\nvoid child(void)\n\
  {\n  int intChild;\n}\n\n// 以下变量 intParent 具有函数\n// 作用域\nvoid parent(void)\n{\n\
  \  int intParent = 0;\n  child();\n  int intLater = 0;\n  intParent = intLater;\n\
  }\n\nint main(int nArgs, char* pArgs[])\n{\n  parent();\n}\n```\n\n这个程序片段从变量 `intGlobal`\
  \ 的声明开始。该变量从程序开始执行一直存在到结束。我们说 `intGlobal` “具有程序作用域”。我们还说该变量在函数 `main()` 被调用之前就已经“进入了作用域”。\n\
  \n函数 `main()` 立即调用了 `parent()`。处理器在 `parent()` 中看到的第一件事是 `intParent` 的声明。在那个点，`intParent`\
  \ 进入了作用域 —— 也就是说 `intParent` 被定义并在 `parent()` 函数的剩余部分中是可用的。\n\n`parent()` 中的第二个语句是调用\
  \ `child()`。再次，函数 `child()` 声明了一个局部变量，这次是 `intChild`。变量 `intChild` 的作用域局限于函数 `child()`。从技术上讲，`intParent`\
  \ 在 `child()` 的作用域内并没有定义，因为 `child()` 无法访问 `intParent`；然而在 `child()` 执行期间，变量 `intParent`\
  \ 继续存在。\n\n当 `child()` 退出时，变量 `intChild` 离开了作用域。`intChild` 不仅不再可访问，而且不再存在了。（`intChild`\
  \ 占用的内存被返回到通用池以用于其他事情。）\n\n随着 `parent()` 继续执行，变量 `intLater` 在声明处进入了作用域。在 `parent()`\
  \ 返回 `main()` 的时候，`intParent` 和 `intLater` 都离开了作用域。\n\n因为在这个例中 `intGlobal` 是全局声明的，所以对所有三个函数都是可用的，并在程序的生命周期内保持可用。\n\
  \n## 检查作用域问题\n\n以下代码段可以编译而不报错，但无法工作（你难道不讨厌那样吗）：\n\n```cpp\ndouble* child(void)\n\
  {\n  double dLocalVariable;\n  return &dLocalVariable;\n}\n\nvoid parent(void)\n\
  {\n  double* pdLocal;\n  pdLocal = child();\n  *pdLocal = 1.0;\n}\n```\n\n这个函数的问题在于\
  \ `dLocalVariable` 只定义在函数 `child()` 的作用域内。因此，当 `dLocalVariable` 的内存地址从 `child()`\
  \ 返回时，它引用的是一个不再存在的变量。`dLocalVariable` 之前占用的内存可能正被用于其他地方。\n\n![Warning(bomb).eps](img/Warning(bomb)_fmt.jpeg)\
  \ 这种错误非常常见，因为它可以以许多方式溜入。不幸的是，这个错误不会导致程序立即停止。事实上，程序在大多数时候可能运行良好 —— 即，只要 `dLocalVariable`\
  \ 原先占用的内存没有立即被复用，程序就能继续工作。这种间歇性问题是最难解决的。\n\n## 使用堆提供解决方案\n\n作用域问题的产生是因为 C++ 在程序员准备好之前取回了局部定义的内存。我们需要的是由程序员控制的内存块。她可以在想要的时候分配并归还\
  \ ——而不是因为 C++ 认为这是好主意。这样的内存块被称为堆。\n\n堆内存使用 `new` 关键字后跟要分配的对象类型来分配。`new` 命令从堆中切出足够存放指定类型对象的内存，并返回其地址。例如，以下代码在堆上分配了一个\
  \ double 变量：\n\n```cpp\ndouble* child(void)\n{\n  double* pdLocalVariable = new\
  \ double;\n  return pdLocalVariable;\n}\n```\n\n这个函数现在正常工作了。虽然变量 `pdLocalVariable`\
  \ 在函数 `child()` 返回时离开了作用域，但 `pdLocalVariable` 引用的内存并没有。`new` 返回的内存位置在显式使用 `delete`\
  \ 关键字返回堆之前都不会离开作用域，该关键字专门为此设计：\n\n```cpp\nvoid parent(void)\n{\n  // child() 返回堆内存块\n\
  \  // 的地址\n  double* pdMyDouble = child();\n  // 在那里存储一个值\n  *pdMyDouble = 1.1;\n\
  \  // ...\n  // 现在将内存返回给堆\n  delete pdMyDouble;\n  pdMyDouble = 0;\n  // ...\n}\n\
  ```\n\n这里 `child()` 返回的指针用于存储一个 double 值。在函数处理完内存后，它被返回到了堆。`parent()` 函数在堆内存返回后将指针置为\
  \ 0 —— 这并非要求，但是一个非常好的主意。如果程序员在 `delete` 之后错误地尝试 `*pdMyDouble` 存储内容，程序将立即崩溃并带有（我希望）有意义的错误信息。\n\
  \n\n\n\n\n| 操作 | 结果 | 含义 |\n| :--- | :--- | :--- |\n| `pointer + offset` | `pointer`\
  \ | 计算从 `pointer` 偏移若干条目的对象的地址 |\n| `pointer - offset` | `pointer` | 加法的反操作 |\n\
  | `pointer2 - pointer1` | `offset` | 计算 `pointer2` 和 `pointer1` 之间的条目数 |\n\n邻域内存模型对于解释指针算术的工作原理非常有帮助。考虑一个所有房子都按顺序编号的城市街区。位于\
  \ `123 Main Street` 的房子一侧是 `122 Main Street`，另一侧是 `124 Main Street`。\n\n现在很清楚了，从\
  \ `123 Main Street` 往下走四栋房子必然是 `127 Main Street`；因此，你可以说 `123 Main + 4 = 127 Main`。同样，如果我问你从\
  \ `123 Main` 到 `127 Main` 共有多少栋房子，答案是四 —— —— `127 Main - 123 Main = 4`。（顺便提一下，房子到自身的距离是零栋房子：`123\
  \ Main - 123 Main = 0`。）\n\n但询问 `4` 距离 `123 Main Street` 多远，或者 `123 Main` 和 `127\
  \ Main` 的和是多少是没有意义。同样，你不能将两个地址相加。你不能对一个地址进行乘法、除法、平方或开平方 —— 你明白我的意思了。你可以执行任何可以转换为加法或减法的操作。例如，如果将指针增加到\
  \ `123 Main Street`，它现在指向隔壁的房子（当然，是在 `124 Main`！）。\n\n## 结合指针变量重新审视数组\n\n现在让我们回到奇妙的数组上一刻。考虑一个包含\
  \ 32 个 1 字节字符的数组，名为 `charArray`。如果该数组的第一个字节存储在地址 `0x100`，则数组将延伸从 `0x100` 到 `0x11f`\
  \ 的范围。`charArray[0]` 位于地址 `0x100`，`charArray[1]` 位于 `0x101`，`charArray[2]` 位于 `0x102`，以此此类推。\n\
  \n执行表达式后\n\n```\nptr = &charArray[0];\n```\n\n指针 `ptr` 包含地址 `0x100`。指针加一个整数偏移量的定义如下，使得表\
  \ 9-2 所示的关系成立。表 9-2 还展示了为什么给 `ptr` 加上偏移量 `n` 可以计算 `charArray` 中第 `n` 个元素的地址。\n\n\
  ### 表 9-2 增加偏移量\n\n| 偏移量 | 结果 | 是哪个的地址 |\n| :--- | :--- | :--- |\n| `+ 0` | `0x100`\
  \ | `charArray[0]` |\n| `+ 1` | `0x101` | `charArray[1]` |\n| `+ 2` | `0x102` |\
  \ `charArray[2]` |\n| `...` | `...` | `...` |\n| `+ n` | `0x100+ n` | `charArray[n]`\
  \ |\n\n对指针增加偏移量与对数组应用索引是等价的。\n\n因此，如果\n\n```\nchar* ptr = &charArray[0];\n```\n\n\
  那么\n\n```\n*(ptr + n) 对应于 charArray[n]\n```\n\n![Warning(bomb).eps](img/Warning(bomb)_fmt.jpeg)\
  \ 因为 `*` 的优先级高于加法，`* ptr + n` 是在 `ptr` 所指向的字符上加上 `n`。需要括号来强制在执行间接引用之前执行加法。表达式 `*(ptr\
  \ + n)` 获取指针 `ptr` 指向的字符加上偏移量 `n`。\n\n事实上，这两种表达式形式之间的对应关系是如此紧密，以至于 C++ 认为 `array[n]`\
  \ 仅仅是 `*(ptr + n)` 的简化版本，其中 `ptr` 指向 `array` 中的第一个元素。\n\n`array[n]` -- C++ 解释为 →\
  \ `*(&array[0] + n)`\n\n为了完成这种关联，C++ 采取了第二个快捷方法。如果给出\n\n```cpp\nchar charArray[20];\n\
  ```\n\n`charArray` 被定义为 `&charArray[0]`。也就是说，不带下标的数组名就是数组本身的地址。因此，你可以将这种关联进一步简化为\n\
  \n`array[n]` -- C++ 解释为 → `*(array + n)`\n\n![Tip.eps](img/Tip_fmt.jpeg) `charArray`\
  \ 的类型实际上是 `char const*`；即“指向字符的常量指针”，因为它的地址不能改变。\n\n## 将运算符应用于数组的地址\n\n索引数组与指针算术之间的对应关系是有用的。例如，一个用于显示整数数组内容的\
  \ `displayArray()` 函数可以写如下：\n\n```cpp\n// displayArray - 显示长度为 nSize 的\n// 数组的成员\n\
  void displayArray(int intArray[], int nSize)\n{\n    cout << “数组的值为：\\n”;\n    for(int\
  \ n; n < nSize; n++)\n    {\n        cout << n << “: “ << intArray[n] << “\\n”;\n\
  \    }\n    cout << endl;\n}\n```\n\n这种索引数组与指针算术的对应关系非常有用。\n\n```cpp\n// displayArray\
  \ - 显示长度为 nSize 的\n// 数组的成员\nvoid displayArray(int intArray[], int nSize)\n{\n \
  \   cout << “数组的值为：\\n”;\n    for(int n; n < nSize; n++)\n    {\n        cout <<\
  \ n << “: “ << intArray[n] << “\\n”;\n    }\n    cout << endl;\n}\n```\n\n这种版本使用了你熟悉的数组。指针版本如下：\n\
  \n```cpp\n// displayArray - 显示长度为 nSize 的\n// 数组的成员\nvoid displayArray(int intArray[],\
  \ int nSize)\n{\n    cout << “数组的值为：\\n”;\n    int* pArray = intArray;\n    for(int\
  \ n = 0; n < nSize; n++)\n    {\n        cout << n << “: “ << *(pArray + n) << “\\\
  n”;\n    }\n    cout << endl;\n}\n```\n\n这种版本通过 `pArray` 指向数组的每一个元素。\n\n![Remember.eps](img/Remember_fmt.jpeg)\
  \ `p` 表示变量是一个指针，但 C++ 程序员并不喜欢数组，他们喜欢指针操作。\n\n## 将指针运算应用于字符串\n\n空终止字符串简单来说就是一个末尾为空字符的字符数组。C++\
  \ 使用空字符作为终止符。这种空终止数组有自己的变量类型。（参见第 7 章关于空终止数组的解释。） C++ 程序员通常使用指针来操作此类字符串。以下代码示例将这种技术与之前的索引技术进行了对比。\n\
  \n```cpp\n// DisplayString - 使用指针和数组\n// 显示字符数组\n#include <cstdio>\n#include <cstdlib>\n\
  #include <iostream>\n\nusing namespace std;\n\nint main(int nNumberArgs, char* psz[])\n\
  {\n    // 声明字符串\n    const char* szString = “Randy”;\n    cout << “数组为‘” << szString\
  \ << “’” << endl;\n\n    // 作为数组显示 szString\n    cout << “用数组显示字符串：“;\n    for(int\
  \ i = 0; i < 5; i++)\n    {\n        cout << szString[i];\n    }\n    cout << endl;\n\
  \n    // 现在使用典型的指针算术\n    cout << “用指针显示字符串：“;\n    const char* pszString = szString;\n\
  \    while(*pszString)\n    {\n        cout << *pszString;\n        pszString++;\n\
  \    }\n    cout << endl;\n\n    // 等待用户准备好后终止程序\n    // 允许用户查看程序结果\n    system(“PAUSE”);\n\
  \    return 0;\n}\n```\n\n该程序的输出是\n\n```\n数组为‘Randy’\n用数组显示字符串：Randy\n用指针显示字符串：Randy\n\
  . .\n```\n\n你可能觉得这种指针转换是愚蠢的；然而，指针版本在 C++ 程序员中实际上常见。\n\n\n\n\n\n![Remember.eps](img/Remember_fmt.jpeg)\
  \ 整数值 `0` 被解释为假——所有其他值均为真。\n\n程序输出 `pszString` 指向的字符，然后递增指针，使其在返回循环顶部之前指向字符串中的下一个字符。\n\
  \n![Tip.eps](img/Tip_fmt.jpeg) 解引用和递增可以（且通常会）组合成单个表达式，如下所示：\n\n```cpp\ncout << *pszString++;\n\
  ```\n\n程序的输出如下：\n\n数组为 ‘Randy’\n\n将字符串作为数组显示：Randy\n\n使用指针显示字符串：Randy\n\n按任意键继续\
  \ . . .\n\n## 论证基于指针的字符串操作的合理性\n\n基于指针的字符字符串操作有时具有晦涩的性质，这可能让读者产生疑问：“为什么要？”换句话说，`char*`\
  \ 指针版本比更易读的索引版本有什么优势呢？\n\n答案部分源于**历史原因**，部分源于人性。当 `C++` 的祖先 `C` 发明时，编译器还非常简单。这些编译器无法执行现代编译器所执行的复杂优化。尽管对于人类读者来说\
  \ `pszString++` 这样的语句看起来很复杂，但即使是一个愚蠢的编译器，也能将其转换为极少数的机器级指令。\n\n早期的计算机处理器按今天的标准来看并不快。在\
  \ `C` 的早期阶段，节省几条计算机指令是一件大事。这使得 `C` 相比于当时的其他语言具有巨大优势，特别是没有提供指针算术的 `Fortran`。\n\n\
  除了效率因素外，程序员还喜欢编写构思精巧的程序语句。一旦 `C++` 程序员学会了如何编写紧凑、晦涩但高效的语句，他们就再也回到使用索引来访问数组了。\n\n\
  ![Tip.eps](img/Tip_fmt.jpeg) 不要通过创建复杂的 C++ 表达式来编写更高效的程序。`C++` 语句的数量与生成的机器指令数量之间没有明显的联系。\n\
  \n## 将运算符应用到除 char 以外的指针类型\n\n当 `szTarget` 是字符数组时，要让自己相信 `szTarget + n` 指向 `szTarget[n]`\
  \ 并不难。毕竟，一个 `char` 占用一个字节。如果 `szTarget` 存储在 `0x100`，那么 `szTarget[5]` 位于 `0x105`。\n\
  \n指针加法在 `int` 数组上的工作方式完全相同并不那么明显，因为每个 `int` 占用 4 个字节，而不是每个字符占用的 1 个字节（至少在 32 位 Intel\
  \ 处理器上是这样）。如果 `intArray` 中的第一个元素位于 `0x100`，那么 `intArray[5]` 将位于 `0x114`（`0x100 +\
  \ (5 * 4) = 0x114`），而不是 `0x104`。\n\n幸运的是，无论 `array` 的单个元素有多大，`array + n` 都会指向 `array[n]`。`C++`\
  \ 为我们处理了元素的大小——它就是很聪明。\n\n再次，那个“老旧房子”的比喻在这里同样适用。（我是说旧的比喻，不是老旧的房子。）主路 123 号之后的第三间房子是\
  \ 126 号，无论那栋建筑有多大，即使它是一家酒店。\n\n## 对比指针与数组\n\n数组和指针之间存在一些差异。首先，数组为数据分配空间，而指针没有，如下：\n\
  \n```cpp\nvoid arrayVsPointer()\n{\n  // 为 128 个字符分配存储\n  char charArray[128];\n\
  \  // 为指针分配空间，但没有为\n  // 指向的内容分配\n  char* pArray;\n}\n```\n\n在这里，`charArray` 为 128\
  \ 个字符留了空间。`pArray` 只分配了 4 个字节——指针所需的存储空间。\n\n考虑以下示例：\n\n```cpp\nchar charArray[128];\n\
  charArray[10] = ‘0’; // 这运行正常\n\nchar* pArray;\npArray[10] = ‘0’; // 这会写入随机位置\n\
  ```\n\n## 字符串经常让我感到困惑\n\n你可能注意到，我在之前的 `DisplayString` 示例程序中插入了一个 `const` 声明。为了考虑到数组和指针之间的差异，这是必要的。像“this\
  \ is a string”这样的字符串被认为是一个常量字符字符串的常量地址。换句话说，字符串的地址或字符本身都不能被更改。为什么呢？\n\n一个问题是，你不知道\
  \ C++ 在哪里存储它的局部字符串，也不知道它复用了多少次相同的字符串。C++ 经常将常量字符串存储在与源代码相同的内存位置，并且经常在程序的多个地方复用同一个字符串。由于由于原因，`C++`\
  \ 经常将常量字符串标记为不可写。\n\n指针变量的初始化与初始化任何其他简单变量：\n\n```cpp\nint i = 1;\nconst char* pString\
  \ = “this is a string”;\n```\n\n这两个声明都用右边的常量值初始化左侧的变量。然而，由于 `pString` 直接指向不可变的字符串“this\
  \ is a string”，因此将其声明为 `const char*` 非常重要；即指向常量字符的指针。\n\n等价的数组比看起来要复杂：\n\n```cpp\n\
  char sChars[] = “this is a string”; // 声明并初始化数组\n```\n\n这声明为数组 `sChars[]` 分配了内存，然后将初始化字符串复制到其中。因此，`sChars`\
  \ 中的第一个字母 `t` 与组成不可变初始化字符串的字母 `t` 不是同一个。\n\n事实上，上述是更冗长但更具描述性的简写：\n\n```cpp\nchar\
  \ sChars[17]; // 声明数组并...\nstrcpy(sChars, “this is a string”); // ...然后初始化它\n```\n\
  \n记住 `strcpy()` 将第二个参数代表的字符字符串复制到第一个参数所指向的数组中。还要记住为终止的空字符分配空间。\n\n表达式 `pArray[10]`\
  \ 在语法上等同于 `charArray[10]`，但 `pArray` 未初始化，因此 `pArray[10]` 引用了内存中的某个随机（垃圾）位置。\n\n\
  ![Tip.eps](img/Tip_fmt.jpeg) 使用未初始指针变量引用内存的错误通常会在程序执行时被 CPU 捕获，导致可怕的段错误（segment\
  \ violation error），这种错误偶尔会在你喜爱的应用程序以及你喜欢的（或不那么喜欢的）操作系统下出现。这个问题通常不是处理器或操作系统的错，而是应用程序的问题。\n\
  \n指针和数组地址之间的第二个区别是 `charArray` 是一个常量，而 `pArray` 不是。因此，以下用于初始化数组 `charArray` 的 `for`\
  \ 循环不起作用：\n\n```cpp\nvoid arrayVsPointer()\n{\n  char charArray[10];\n  for (int\
  \ i = 0; i < 10; i++)\n  {\n    *charArray = ‘0’; // 这有意义...\n    charArray++; //\
  \ ...这没有\n  }\n}\n```\n\n表达式 `charArray++` 的意义并不比 `10++` 大大。下面的版本是正确的：\n\n```cpp\n\
  void arrayVsPointer()\n{\n  char charArray[10];\n  char* pArray = charArray;\n \
  \ for (int i = 0; i < 10; i++)\n  {\n    *pArray = ‘0’; // 这运行得很好\n    pArray++;\n\
  \  }\n}\n```\n\n## 指针什么时候不是？\n\nC++ 对于什么是、什么不是合法的地址完全保持不沉默，但有一个例外。`C++` 预定义了常量 `nullptr`，具有以下属性：\n\
  \n- 它是一个常量值。\n- 它可以赋值给任何指针类型。\n- 它的求值为假。\n- 它永远不是合法的地址。\n\n常量 `nullptr` 用于指示指针未初始化。它也经常被用于指示指针数组中的最后一个元素，就像空字符用于终止字符字符串一样。\n\
  \n![c++'09.eps](img/c%2B%2B'09_fmt.jpeg) 实际上关键字 `nullptr` 是在 2009 标准中引入的。在此之前，使用常量\
  \ 0 来指示空指针。\n\n将指针初始化为 `nullptr`（如果你的编译器还不支持 `nullptr` 则使用 `0`）是一种安全的做法。在调用 `delete`\
  \ 后，你还应该清除指向堆内存指针的内容，以避免两次删除同一个内存块：\n\n```cpp\ndelete pHeap; // 将内存返回堆\npHeap =\
  \ nullptr; // 现在清空指针\n\n```\n\n\n\n\n\n![Warning(bomb).eps](img/Warning(bomb)_fmt.jpeg)\
  \ 两次向 `delete` 传递同一个地址始终会导致程序崩溃。向 `delete` 传递 `nullptr`（或 `0`）则没有影响。\n\n# 声明和使用指针数组\n\
  \n如果指针可以指向数组，那么反过来似乎也是理所应当的。指针数组是一种特别受关注的数组类型。\n\n正数组可以包含其他数据类型，数组也可以包含指针。以下代码声明了一个指向\
  \ `int` 的指针数组：\n\n```cpp\nint* pInts[10];\n```\n\n根据前述声明，`pInts[0]` 是一个指向 `int`\
  \ 值的指针。因此，以下内容是正确的：\n\n```cpp\nvoid fn()\n{\n  int n1;\n  int* pInts[3];\n  pInts[0]\
  \ = &n1;\n  *pInts[0] = 1;\n}\n```\n\n或者\n\n```cpp\nvoid fn()\n{\n  int n1, n2,\
  \ n3;\n  int* pInts[3] = {&n1, &n2, &n3};\n  for (int i = 0; i < 3; i++)\n  {\n\
  \    *pInts[i] = 0;\n  }\n}\n```\n\n甚至可以\n\n```cpp\nvoid fn()\n{\n  int* pInts[3]\
  \ = {(new int),\n  (new int),\n  (new int)};\n  for (int i = 0; i < 3; i++)\n  {\n\
  \    *pInts[i] = 0;\n  }\n}\n```\n\n后者在堆上声明了三个 `int` 对象。除了字符字符串指针数组的情况外，这种类型的声明并不常用。以下两个示例展示了为什么字符字符串数组很有用。\n\
  \n## 利用字符字符串数组\n\n假设我需要一个函数，根据传递给它的整数参数返回相应的月份名称。例如，如果向程序传递 `1`，它将返回指向字符串“January”的指针；如果是\
  \ `2`，则报告“February”，以此此类推。月份 `0` 和任何大于 `12` 的数字被认为是无效的。我可以像这样编写该函数：\n\n```cpp\n\
  // int2month() - 返回月份名称\nconst char* int2month(int nMonth)\n{\n  const char* pszReturnValue;\n\
  \  switch(nMonth)\n  {\n    case 1: pszReturnValue = “January”;\n    break;\n  \
  \  case 2: pszReturnValue = “February”;\n    break;\n    case 3: pszReturnValue\
  \ = “March”;\n    break;\n    // ...以此此类推...\n    default: pszReturnValue = “invalid”;\n\
  \  }\n  return pszReturnValue;\n}\n```\n\n![Remember.eps](img/Remember_fmt.jpeg)\
  \ `switch()` 控制命令就像一组 `if` 语句。\n\n一种更优雅的解决方案是将月份的整数值作为指向月份指针数组的索引。在使用时，它的形式如下：\n\
  \n```cpp\n// 定义一个包含月份名称的数组\nconst char *const pszMonths[] = {“invalid”,\n“January”,\n\
  “February”,\n“March”,\n“April”,\n“May”,\n“June”,\n“July”,\n“August”,\n“September”,\n\
  “October”,\n“November”,\n“December”};\n\n// int2month() - 返回月份名称\nconst char* int2month(int\
  \ nMonth)\n{\n  // 首先检查值是否超出范围\n  if (nMonth < 1 || nMonth > 12)\n  {\n    return\
  \ “invalid”;\n  }\n  // nMonth 有效 - 返回月份名称\n  return pszMonths[nMonth];\n}\n```\n\
  \n在这里，`int2Month()` 首先检查 `nMonth` 是否为 `1` 到 `12` 之间的数字（包含边界值，在上一个示例中 `switch` 语句的默认分支处理了这一点）。如果\
  \ `nMonth` 有效，函数将将其作为指向包含月份名称数组的偏移量。\n\n![Tip.eps](img/Tip_fmt.jpeg) 这种通过索引引用字符字符串的技术在编写可在不同语言运行的程序时特别有用。例如，程序可以声明一个指向不同语言的儒利月份指针的数组\
  \ `ptrMonths`。程序可以在执行时将 `ptrMonth` 初始化为正确的名称（例如英语、法语或德语）。这样，无论语言如何，`ptrMonth[1]`\
  \ 都指向第一个儒利月份的正确名称。\n\nCD-ROM 中包含一个演示 `int2Month()` 的程序，名为 `DisplayMonths`。\n\n##\
  \ 访问 main() 的参数\n\n现在可以说真相了——我们程序模板中 `main()` 那些奇怪的参数声明到底是什么？`main()` 的第二个参数是一个指向空终止字符字符串的指针数组。这些字符串包含了程序的参数。程序的参数是在您启动程序时随程序名出现的字符串。这些参数也被称为参数。`main()`\
  \ 的第一个参数是传递给程序的参数数量。例如，假设我在命令行提示符输入了以下命令：\n\n`MyProgram file.txt /w`\n\n操作系统执行文件\
  \ `MyProgram.exe` 中的程序，并向其传递参数 `file.txt` 和 `/w`。\n\n考虑以下简单程序：\n\n```cpp\n// PrintArgs\
  \ - 输出程序的参数\n#include <cstdio>\n#include <cstdlib>\n#include <iostream>\nusing namespace\
  \ std;\n\nint main(int nNumberArgs, char* pszArgs[])\n{\n  // 打印横幅\n  cout << “The\
  \ arguments to “\n  << pszArgs[0] << “ are:\\n”;\n  // 现在输出参数\n  for (int i = 1;\
  \ i < nNumberArgs; i++)\n  {\n    cout << i << <<:” << pszArgs[i] << “\\n”;\n  }\n\
  \  // 结束\n  cout << “That’s it” << endl;\n  return 0;\n}\n```\n\n一如一样，`main()` 函数接受两个参数。第一个参数是\
  \ `int` 类型的 `nNumberArgs`。第二个参数是 `char*` 类型的指针数组 `pszArgs`。\n\n## 以 DOS 风格访问程序参数\n\
  \n如果我在命令行中这样执行 `PrintArgs` 程序：\n\n`PrintArgs arg1 arg2 /w`\n\n`nNumberArgs` 将是 `5`（每个参数一个）。第一个参数是程序本身。`pszArgs`\
  \ 中的其余元素指向参数。例如，`pszArgs[1]` 指向“arg1”，`pszArgs[2]` 指向“arg2”。由于 Windows 不对“/w”赋予特殊含义，该字符串也会作为参数传递给程序进行处理。\n\
  \n为了演示参数传递如何工作，你需要在 Code::Blocks 中构建程序，然后从命令行执行它。首先，通过在 Code::Blocks 中打开 PrintArgs\
  \ 项目并选择 Build⇒Rebuild 来确保已构建可执行文件。接下来，打开一个命令行窗口。以下显示了我在 Windows Vista 上操作的情况：\n\n\
  ```\nMicrosoft Windows [Version 6.0.6001]\nCopyright (c) 2006 Microsoft Corporation.\
  \ All rights reserved.\n\nC:\\Users\\Randy>cd \\cpp_programs\\chap09\\printargs\\\
  bin\\debug\n\nC:\\CPP_Programs\\Chap09\\PrintArgs\\bin\\Debug>PrintArgs arg1 arg2\
  \ arg3 /n\n\nThe arguments to PrintArgs are:\n\n1:arg1\n2:arg2\n3:arg3\n4:/n\n\n\
  That’s it\n\nPress any key to continue . . .\n```\n\n像 `*.*` 这样的通配符在传递给程序之前可能会或可能扩展——标准对此没有规定。书中随附的\
  \ Code::Blocks/gcc 编译器在 Windows Vista 上确实会执行此类扩展，如下例所示：\n\n```\nC:\\CPP_Programs\\\
  Chap09\\PrintArgs>bin\\debug\\PrintArgs *.*\n\nThe arguments to bin\\debug\\PrintArgs\
  \ are:\n\n1:bin\n2:main.cpp\n3:obj\n4:PrintArgs.cbp\n```\n\n\n\n\n在这里你看到的是当前目录下的文件名，而不是我之前输入的\
  \ `.*`。\n\n![Tip.eps](img/Tip_fmt.jpeg) 通配符扩展在所有形式的 Unix 和 Linux 下都会执行。旧版本的 gcc\
  \ 特别地没有执行通配符扩展，在 Visual C++ Express 中也不执行该扩展。\n\n## 以 Code::Blocks 风格访问程序参数\n\n\
  当你从 Code::Blocks 执行程序时，你也可以为你的程序添加参数。在 Code::Blocks 内部，选择 `Project⇒Set programs’\
  \ arguments`。在程序参数窗口中输入你想要的命令行。\n\n## 以 Windows 风格访问程序参数\n\nWindows 同样通过传递参数作为与你的程序通信的手段。尝试以下实验：像通常一样构建你的程序。使用\
  \ Windows 资源管理器找到可执行文件。如前所述，`PrintArgs` 程序的默认位置是 `C:\\CPP_Programs\\Chap09\\PrintArgs\\\
  bin\\Debug`。现在取一个文件并将其拖到文件名上。（选择哪个文件都无所谓，因为程序反正不会损坏它。）砰！`PrintArgs` 程序立即启动，你拖到程序上的文件名就会显示出来。\n\
  \n再次尝试一次，但一次拖入多个文件。按住 `Ctrl` 键或使用 `Shift` 键选择一组文件名。现在将所有文件拖到 `PrintArgs.exe` 上并松手。每个文件的名称将作为输出出现。\n\
  \n我将我的 `\\Program Files\\WinZip` 文件夹中的几个文件拖入 `PrintArgs` 作为示例：\n\n传递 `C:\\CPP_Programs\\\
  Chap09\\PrintArgs\\bin\\Debug\\PrintArgs.exe` 的参数为：\n\n1:`C:\\Program Files\\WinZip\\\
  VENDOR.TXT`\n2:`C:\\Program Files\\WinZip\\WHATSNEW.TXT`\n3:`C:\\Program Files\\\
  WinZip\\WINZIP.CHM`\n4:`C:\\Program Files\\WinZip\\WINZIP.TXT`\n5:`C:\\Program Files\\\
  WinZip\\WINZIP32.EXE`\n6:`C:\\Program Files\\WinZip\\WZ.COM`\n7:`C:\\Program Files\\\
  WinZip\\WZ.PIF`\n8:`C:\\Program Files\\WinZip\\WZ32.DLL`\n9:`C:\\Program Files\\\
  WinZip\\WZCAB.DLL`\n10:`C:\\Program Files\\WinZip\\WZCAB3.DLL`\n11:`C:\\Program\
  \ Files\\WinZip\\FILE_ID.DIZ`\n12:`C:\\Program Files\\WinZip\\LICENSE.TXT`\n13:`C:\\\
  Program Files\\WinZip\\ORDER.TXT`\n14:`C:\\Program Files\\WinZip\\README.TXT`\n\n\
  就是这些\n\n按任意键继续 . . .\n\n注意，每个文件的名称都作为一个单独参数出现，即使文件名可能包含空格。还要注意 Windows 传递的是文件的完整路径名。\n\
  \n# 第 10 章\n## C++ 预处理器\n\n### 本章内容\n- 包含源文件\n- 定义常量和宏\n- 枚举常量替代方案\n- 插入编译时检查\n\
  - 通过 `typedef` 简化声明\n\n你原以为你需要学习的只有 C++。事实证明，C++ 包含一个预处理器，它会在“真正的 C++ 编译器”看到源文件之前对你的源文件进行处理。遗憾的是，预处理器的语法与\
  \ C++ 本身完全不同。\n\n然而，在你绝望之前，请让我赶紧补充一点：预处理器非常基础，而且 C++'09 标准已经增加了许多功能，使得预处理器几乎不再必要。尽管如此，如果你在下一次咖啡俱乐部会议上谈到\
  \ C++，你仍会被要求理解预处理器。\n\n## 什么是预处理器？\n\n到目前为止，你可能认为 C++ 编译器是一步到位吃掉你的源代码并吐出可执行程序，但并非完全如此。\n\
  \n首先，预处理器会对你的程序进行扫描，寻找预处理器指令。预处理步骤的输出是一个中间文件，其中所有的预处理器命令都被展开。这个中间文件被传递给 C++ 编译器进行处理。C++\
  \ 编译器的输出是一个对象文件，它包含与你的 C++ 源代码等效的机器指令。在最后一步，一个名为链接器的独立程序会将一组标准库与你的对象文件（或文件，如我们在第\
  \ 21 章中看到的）相结合，创建一个可执行程序。（本章的下一节将更详细介绍标准库。）\n\n![Tip.eps](img/Tip_fmt.jpeg) 对象文件通常带有\
  \ `.o` 扩展。可执行程序在 Windows 中始终带有 `.exe` 扩展，在 Unix 和 Linux 下没有扩展名。Code::Blocks 将对象文件和可执行文件存储在自己的文件夹中。例如，如果你已经构建了第\
  \ 2 章的 `IntAverage` 程序，在你的硬盘上将有一个文件夹 `C:\\CPP_Programs\\IntAverage\\obj\\Debug`，其中包含\
  \ `main.o`，以及包含可执行程序的文件夹 `C:\\CPP_Programs\\IntAverage\\bin\\Debug`。\n\n所有预处理器命令都以第\
  \ 1 列的 `#` 符号开头，并以换行符结束。\n\n![Warning(bomb).eps](img/Warning(bomb)_fmt.jpeg) 与 C++\
  \ 中几乎所有的规则一样，这条规则也有例外。你可以通过用转义字符 `\\` 结束行将一个预处理器命令跨越多行。不过，我们不会有任何复杂的预处理器命令。\n\n\
  在书中，我们将使用三个预处理器命令：\n\n- `#include` 在指定的位置包含文件的内容。\n- `#define` 定义一个常量或宏。\n- `#if`\
  \ 如果后续条件为真则包含一段代码。\n\n这些预处理器命令将在后续章节中详细介绍。\n\n## 包含文件\n\nC++ 标准库由一些基础函数组成，这些函数都需要它们。强迫程序员手动编写它们是愚蠢的，例如，用于从键盘输入和向控制台输出的\
  \ I/O 函数就包含在标准库中。\n\n然而，C++ 要求任何用的函数都有原型声明，无论它是否在库中（如果不理解，请参见第 6 章）。与其强迫程序员输入所有声明，库作者创建了包含声明的文件。你只需要\
  \ `#include` 你打算使用的源文件即可。\n\n来看这个简单的例子。假设我创建了一个包含 `sin()`、`cosin()`、`tan()` 以及大量函数的库。我可能会创建一个名为\
  \ `mytrig` 的包含文件，内容如下：\n\n```cpp\n// 我的库的声明\ndouble sin(double x);\ndouble cosin(double\
  \ x);\ndouble tan(double x);\n// ...更多声明...\n```\n\n任何想要使用这些数学函数的程序都会 `#include`\
  \ 该文件，用括号或引号包含文件名如下：\n\n```cpp\n#include <mytrig>\n```\n\n或者\n\n```cpp\n#include\
  \ \"mytrig\"\n```\n\n![TechnicalStuff.eps](img/TechnicalStuff_fmt.jpeg) 两种 `#include`\
  \ 形式的区别在于预处理器去哪里寻找 `mytrig` 文件。当文件被引号包裹时，预处理器假设该包含文件是本地生成的，因此它从发现源文件的相同目录开始查找。如果在那里没有找到，它将开始在自己的包含目录中查找。预处理器假设角括号中的文件来自\
  \ C++ 库，因此它会跳过源文件目录直接进入标准包含文件夹。对于你创建的任何包含文件使用引号，对于 C++ 库文件使用角括号。\n\n因此，你可能会编写如下源文件：\n\
  \n```cpp\n// MyProgram - 非常智能\n#include \"mytrig\"\n\nint main(int nArgc, char*\
  \ pArguments[])\n{\n    cout << \"The sin of .5 is \" << sin(0.5) << endl;\n   \
  \ return 0;\n}\n```\n\n在预处理器完成展开 `#include` 后，C++ 编译器看到的中间文件如下：\n\n```cpp\n// MyProgram\
  \ - 非常智能\n// 我的库的原型声明\ndouble sin(double x);\ndouble cosin(double x);\ndouble tan(double\
  \ x);\n```\n\n\n\n\n```cpp\n// ...更多原型函数声明...\n\nint main(int nArgc, char* pArguments[])\n\
  {\n  cout << “The sin of .5 is “ << sin(0.5) << endl;\n  return 0;\n}\n```\n\n![TechnicalStuff.eps](img/TechnicalStuff_fmt.jpeg)\n\
  \n### 在你自己的命名沙盒中运行\n\n（这非常有技术性，所以你可以随意跳过这个侧边栏，稍后再回来。）C++ 标准的作者们非常担心命名冲突。例如，除了我返回\
  \ `x` 的对数的数学函数 `log(x)` 之外，假设在另一个语境下，我写了一个函数 `log(x)`，它用于将状态信息写入系统日志中。显然，两个参数相同的不同函数无法在同一个程序中并存。这被称为命名冲突。\n\
  \n为了避免这种情况，C++ 允许程序员使用同名的关键字将声明组合到一个 `namespace`（命名空间）中：\n\n```cpp\nnamespace Mathematics\n\
  {\n  double log(double x)\n  {\n    // ...函数的定义...\n  }\n}\n\nnamespace SystemLog\n\
  {\n  int log(double x)\n  {\n    // ...将值记录文件...\n  }\n}\n```\n\n命名空间变成了函数扩展名称的一部分。因此，以下代码段实际上是记录了一个数值的对数：\n\
  \n```cpp\nvoid myFunc(double x)\n{\n  // 调用对数函数...\n  double dl = Mathematics::log(x);\n\
  \  // ...现在将其记录到磁盘\n  SystemLog::log(dl);\n}\n```\n\n幸运的是，你不需要每次都指定命名空间。`using`\
  \ 关键字允许程序员为给定的函数指定默认命名空间：\n\n```cpp\nusing double Mathematics::log(double);\n\n\
  void myFunc(double x)\n{\n  // 默认是数学版本...\n  double dl = log(x);\n  // ...然而，通过显式指定命名空间\n\
  \  // 仍然可以访问另一个版本\n  SystemLog::log(dl);\n}\n```\n\n你可以自动为命名空间内的每个声明设置默认值：\n\n```cpp\n\
  using namespace Mathematics;\n\nvoid myFunc(double x)\n{\n  // 先在 Mathematics 命名空间中查找...\n\
  \  double dl = log(x);\n  // ...然而，通过显式指定命名空间\n  // 仍然可以访问另一个版本\n  SystemLog::log(dl);\n\
  }\n```\n\n参见随附 CD-ROM 中的程序 `NamespaceExample` 以获取命名空间使用的示例。\n\n标准库函数位于 `std` 命名空间中；在书中每个程序开头包含的\
  \ `using namespace std;` 语句使得程序可以直接访问标准库函数，而不需要显式指定命名空间。\n\n![Warning(bomb).eps](img/Warning(bomb)_fmt.jpeg)\
  \ 历史上，习惯是包含文件以 `.h` 结尾。C 仍然使用该标准。然而，C++ 在重构包含文件结构时删除了扩展名。现在，C++ 标准包含文件没有扩展名。\n\n\
  ## 定义内容\n\n预处理器还允许程序员 `#define` 在预处理步骤中被展开的表达式。例如，你可以 `#define` 一个在整个程序使用的常量。\n\n\
  ![Tip.eps](img/Tip_fmt.jpeg) 在用法上，你把 `#` 符号读作“pound”（磅），所以你会说“pound-define a constant”，以与以其他方式定义常量区分来。\n\
  \n```cpp\n#define TWO_PI 6.2831852\n```\n\n这使得下面的语句变得更容易理解：\n\n```cpp\ndouble diameter\
  \ = TWO_PI * radius;\n```\n\n比等价表达式容易得多，后者实际上是 C++ 编译器在预处理器将 `TWO_PI` 替换为其定义后看到的：\n\
  \n```cpp\ndouble diameter = 6.2831852 * radius;\n```\n\n另一个优势是可以在一个地方 `#define`\
  \ 一个常量并在处处使用。例如，我可能会在一个包含文件中包含以下 `#define`：\n\n```cpp\n#define MAX_NAME_LENGTH 512\n\
  ```\n\n在整个程序中，我可以将从键盘读取的名称截断为通用且一致的 `MAX_NAME_LENGTH`。这不仅更易读，而且如果我想增加或减少所选择处理的最大名称长度，在程序中提供了一个单一的修改位置。\n\
  \n预处理器还允许程序 `#define` 带有参数的函数类宏，这些宏在定义被使用时展开：\n\n```cpp\n#define SQUARE(X) X * X\n\
  ```\n\n在用法中，此类宏定义看起来非常像函数：\n\n```cpp\n// 计算圆的面积\ndouble dArea = HALF_PI * SQUARE(dRadius);\n\
