  - **试用版、演示版或评估版**软件通常在时间或功能上有限制（例如，不允许在创建项目后保存）。\n\n### CPP 程序\n\n**适用于所有环境**。书中提供的所有示例都位于光盘上的\
  \ `CPP_Programs` 目录，并适用于 Macintosh、Linux、Unix 和 Windows 及后续计算机。这些文件包含了书中的示例代码。每个示例程序都在自己的独立文件夹中。例如，来自\
