  md: "# 30. Organizing Your Programs with Functions\n\n+   In This Chapter\n* Adding\
    \ functions to programs\n* Choosing between global and local variables\n\nTypical\
    \ computer programs are not the 20- to 30-line variety that you see in textbooks.\
    \ In the “real world,” computer programs are much longer—but long programs contain\
    \ lots of code that get in the way while learning new concepts. That’s why, until\
    \ this point, you’ve seen fairly short programs that contain all their code in\
    \ main ().\n\nIf you were to write an entire program in main(), you would spend\
    \ a lot of time trying to find anything specific you later needed to change it.\
    \ This chapter is the first of three chapters that explores ways to partition\
    \ your programs into sections via multiple functions. Categorizing your code by\
    \ breaking it makes programs easier to write and also easier to maintain.\n\n\
    People have to write, change, and fix code. The clearer you make the code by writing\
    \ lists of functions that do individual tasks, the faster you can get home from\
    \ your programming job and relax! As you’ll see, separate functions let you focus\
    \ on code that needs changing.\n\n# Form Follow C Functions\n\nC was designed\
    \ to force you into a modular style through the use of functions. A C program\
    \ isn’t just one long program. It’s made up of many routines, as you know, functions.\
    \ One of the program’s functions (the one always required and usually listed first)\
    \ is named main().\nIf your program grows large, break it into several functions.\
    \ Each function should do one primary task. For instance, if you were writing\
