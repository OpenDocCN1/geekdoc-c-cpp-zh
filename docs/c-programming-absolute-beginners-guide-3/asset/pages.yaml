    # ## How Can I Have Fun with C?


    Appendix B, “The Draw Poker Program,” contains a complete, working Draw Poker
    program. The program was kept as short as possible without sacrificing readable
    code and game-playing functionality. The game also had to be kept generic to work
    on all C compilers. Therefore, you won''t find fancy graphics, but when you learn
    C, you''ll easily be able to access your compiler’s specific graphics, sound,
    and data-entry routines to improve the program.


    The program uses as much of this book’s contents as possible. Almost every topic
    taught in this book appears in the Draw Poker game. Too many books offer nothing
    more than snippets of code. The Draw Poker game gives you the chance to see the
    “big picture.” As you progress through this book, you’ll understand more and more
    of the game.


