  md: '# # What Is C Programming, and Why Should I Care?


    +   In This Chapter

    * Understanding the basics of C programming

    * Finding and installing a C compiler

    * Learning the steps of the programming process


    Although some people consider C to be difficult to learn and use, you''ll soon
    see that they are wrong. C is touted as being a cryptic programming language,
    and it can be—but a well-written C program is just as easy to follow as a program
    written in any other language. The demand for programmers and developers today
    is high, and learning C is an excellent foundation to build the skills needed
    in a variety of fields, including app development, game programming, and so much
    more.


    If you''ve never written a program in your life, this chapter is an excellent
    beginning because it teaches introductory programming concepts, explains what
    a program is, and provides a short history of the C language. Get ready to be
    excited! C is a programming language rich in its capabilities.


    # ## What Is a Program?


    A computer is not smart. Believe it or not, on your worst days, you are still
    light-years ahead of your computer in intelligence. You can think, and tell a
    computer what to do. Here is where it shines: It will obey your instructions.
    Your computer will sit for days processing the data you supply, without getting
    bored or waiting overtime pay.


    The computer can''t decide what to do on its own. Computers can''t think for themselves,
    so programmers (people who tell computers what to do) must give computers extremely
    detailed instructions. Without instructions, a computer is useless; with incorrect
    instructions, a computer will not successfully execute your desired task. A computer
    can process no more payroll without detailed instructions than an automobile can
    start by itself and drive around the block independently. The collection of detailed
    expressions that you supply when you want your computer to perform a specific
    task is known as a *program*.


    ![](img/16305f3570927791787abd82e5e0ea39_21_0.png)


    > **Note** Word processors, apps, spreadsheets, and computer games are nothing
    more than computer programs. Facebook is a collection of programs. Without such
    programs, the computer would just sit there, knowing what to do next. A word-processing
    program contains a list of detailed instructions, written in a computer language
    such as C, that tells your computer exactly how to be a word processor. When you
    program, you are telling the computer to follow the instructions in the program
    you have'
  merge: -1
  pgno: 21
- img_proc: true
  md: 'supplied.


    You can buy or download thousands of programs for your computer, tablet, phone,
    but when a business needs a computer to perform a specific task, that business
    hires programmers and developers to create software that follows the specifications
    business needs. You can make your computer or mobile device do many things, but
    you might not be able to find a program that does exactly what you want. This
    book rescues you from that dilemma. After you learn C, you will be able to write
    programs that contain instructions that tell the computer how to behave.


    # Tip


    A computer program tells your computer how to do what you want. Just as a chef
    needs a recipe to make a dish, a program needs instructions to produce results.
    A recipe is nothing more than a set of detailed instructions that, if properly
    written, describes that proper sequence and the contents of the steps needed to
    prepare a certain dish. That’s exactly what a computer program is to your computer.


    Programs produce output when you run or execute them. The prepared dish is a recipe’s
    output, and the word processor or app is the output produced by a running program.


    # Warning


    > Just as a chef gets an ingredient wrong or misses a step in a recipe, the resulting
    dish can be inedible; if you mistype code or skip a step, your program will not
    work.


    # What You Need to Write C Programs


    Before you can write and execute a C program on your computer, you need a C compiler.
    The C compiler takes the C program you write and builds or compiles it (technical
    terms for making the program computer-readable), enabling you to run the compiled
    program when you’re ready to look at the results. Luckily, miễn free software
    packages are available in which you can edit and compile your C programs. A simple
    web search will provide a list. This book uses Code::Blocks (www.codeblocks.org).


    # Tip


    If you run a search for “C Programming Compilers,” you’ll see a number of freeware
    options, including offerings from Borland and Microsoft. So why does this book
    use Code::Blocks? Because it offers versions for Windows, Macs, and Linux, so
    you can'
  merge: -1
  pgno: 22
- img_proc: true
  md: 'a version of the software no matter what operating system you use. However,
    feel free pick whichever programming environment looks best to you.


    If you surf to the Code::Blocks page and read the very first sentence, you may
    worry a bit (or a lot): The open source, cross-platform, free C++ IDE.


    Open source refers to software code that users can alter or improve. (You will
    not be doing this anytime, so put it out of your mind.) *Cross-platform* is an
    adjective that means the software can run on different operating systems—as a
    beginner, however you need yourself with only your own plan. *Think free* is a
    term we can all get behind, and IDE is for *integrated development environment*,
    which just means you can write, edit, and debug your programs without having to
    switch software or do so. Go to debugging.


    Don''t panic about the C++ part. You can write either C or C++ programs in Code::Blocks.
    Finding a C compiler these days is harder. Most of the time, C compilers come
    bundled with an advanced version of C, known as C++. Therefore, when you look
    for a C compiler, you will almost always have a combination of C and C++ compiler
    and often the C++ functionality is highlighted. The good news is that after you
    learn C, you will already have a C++ compiler and you won''t have to learn the
    ins and outs of a new IDE.


    Figure 1.1 shows the Code::Blocks home page. To download the C/C++ IDE, click
    the Downloads choice under the Main section in the left column.


    ![](img/16305f3570927791787abd82e5e0ea39_23_0.png)


    **FIGURE 1.1** The home page for Code::Blocks. You want to focus on the Downloads
    option.


    After you select Downloads, you are taken to a page that further discusses three
    options: Binaries, Source, and SVN. The latter two options are advanced, so you
    can ignore them. Click Binaries.


    > Note


    Two things to consider when doing this installation. First, the screen shots in
    the book will probably be a little different than what you see on the Internet—Code::Blocks
