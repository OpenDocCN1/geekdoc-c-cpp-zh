    {\n    printf(\"Counting up...%d\\n\", i);\n    if (i== num)\n    {break;}\n}\n\
    /* Rest of program follows*/\n```\n\nFIGURE 16.1 break terminates a loop earlier\
    \ than usual.\n\n# Let’s continue Working\n\nWhereas break causes a loop to break\
    \ early, continue forces a loop to continue early. (So that’s why they’re named\
