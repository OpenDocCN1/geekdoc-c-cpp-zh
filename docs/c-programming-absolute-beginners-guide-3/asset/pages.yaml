  md: 'you always have to reserve enough array space to hold the longest string you
    will need to hold, plus the string terminator. You can define more array characters
    than needed, but not fewer than you need.


    If you want, you can store a string value in the array at the same time you define
    the array:


    Click here to view code image


    ```

    char month[10] = "January"; /* Defines a character array */

    ```


    Figure 6.2 shows you what this looks like. Because nothing was put in the last
    two places of the array (January takes only seven characters plus an eighth place
    for the null zero), you don''t know what''s in the last two places. (Some compilers,
    however, fill the unused elements with zeros to kind of empty the rest of the
    string.)


    ![](img/16305f3570927791787abd82e5e0ea39_61_0.png)


    FIGURE 6.2 Defining and initializing an array named month that holds string data.


    Each individual piece of an array is called an element. The month array has 10
    elements. You can distinguish between them with subscripts. Subscripts are numbers
    that you specify inside brackets that refer to each of the array elements.


    All array subscripts begin with 0. As Figure 6.2 shows, the first element in the
    array is called month[0]. The last is month[9] because there are 10 elements altogether,
    and when you begin at 0, the last is 9.


    Each element in a character array is a character. The combination of characters—the
    array or list of characters—enters the entire string. If you wanted to, you could
    change the contents of the array from January to March one element at a time,
    like this:


    Click here to view code image


    ```

    month[0] = ''M'';

    m[1] = ''a'';

    m[2] = ''r'';

    m[3] = ''c'';

    m[4] = ''h'';

    m[5] = ''\0''; // You must add this

    ```


    It is vital that you insert the null zero at the end of the string. If you don''t,
    the month array would have a null zero three places after Month[7]; when you attempted
    to print the string, you would get:


    Marchry'
