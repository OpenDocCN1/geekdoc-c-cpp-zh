- img_proc: true
  md: '![](img/16305f3570927791787abd82e5e0ea39_69_0.png)


    Use uppercase letters for the defined constant name. This is the one exception
    in C when uppercase is not used, but recommended. Because defined constants are
    not variables, the uppercase lets you glance through a program and tell at a glance
    what is a variable and what is a constant.


    Assuming that you have previously defined the constant PI, the uppercase letters
    help keep you from doing something like this in the middle of the program:


    Click here to view code image


    ```

    PI = 544.34; /* Not allowed */

    ```


    As long as you keep defined constant names in upper case, you will know not to
    change them because they are *constants*.


    Defined constants are good for naming values that might need to be changed between
    program runs. For example, if you didn''t use a constant for AGELIMIT, but instead
    used an actual age value such as 21 throughout the program, if that age limit
    changed, finding and changing every single 21 would be difficult. You had only
    need to change the #define statement to the top of the program and the age limit
    changed,


    ```

    #define AGELIMIT 18

    ```


    The #define directive is not a C command. As with #include, C handles your #define
    statements before your program is compiled. Therefore, if you defined PI as 3.14159
    and you used PI throughout a program in which you needed the value of the mathematical
