  md: "# 16. Breaking in and out of Looped Code\n\n| In This Chapter |\n| Taking a\
    \ break |\n| Continuing to use |\n\nThis chapter doesn’t teach you how to use\
    \ another kind of loop. Instead, this chapter extends the information you learned\
    \ in the last two chapters. You have ways available to control the while loop\
    \ in addition to a relational test, and you can change the way a for loop operates\
    \ via means other than the counter variable.\n\nThe break and continue statements\
    \ let you control loops for those special occasions when you want to quit a loop\
    \ early or repeat a loop sooner than it would normally repeat.\n\n# Take a break\n\
    \nThe break statement rarely, if ever, appears on a line by itself. Typically,\
    \ break appears in the body of an if statement. The reason for this will be made\
    \ clear shortly. Here is the format of break:\n\n```\nbreak;\n```\n\n> > Note\n\
    > break is easy\n\nbreak always appears inside a loop. The purpose of break is\
    \ to terminate the current loop. When a loop ends, the code following the body\
    \ of the loop takes over. When break appears inside your loop’s body, break terminates\
    \ immediately, and the rest of the program continues. Here is a for loop that\
    \ would normally print 10 numbers. Instead of printing 10, however, the break\
    \ causes the loop to stop after printing 5 numbers.\n\nClick here to view code\
    \ image\n\n```\nfor (i=0; i < 10; i++) {\n    printf(\"%d \\ i);\n    if (i ==\
    \ 4) {\n        break;\n    }\n}\n// Rest of program would follow.\n```"
