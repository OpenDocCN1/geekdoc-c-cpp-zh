    # # One Last Step: Prototype


    Making a function work properly involves one last step. If a function returns
    any value other than

    int, you should *prototype* that function. Actually, you should prototype functions
    that return integers

    as well for clarity.


    The word *prototype* means a model of something else. A prototype of a function
    is just a model of the

    actual function. At first, a C prototype seems like a total waste of time.


    The reasons that return *int* values don''t need prototypes is that *int* is the
    default

    prototyped return value unless you specify a different return value. Therefore,
    these two prototypes

    bodel the same function:


    [Click here to view code image]


    ```

    int aFunc(int x, float y);   /* 2 passed, one integer returned * /

    ```


    and


    [Click here to view code image]


    ```

    aFunc(int x, float y);   /* 2 passed, one integer returned * /

    ```


    Prototypes are not required if you don''t return a value or if you return an integer
    value, but they are

    *strongly recommended*. When you prototype, C ensures you don''t pass a *float*
    value to a

    function that expects to receive a *char*. Without the prototype, C tries to convert
    the *float* to a

    char, and bad value is passed as a result.


    To prototype a function, make an exact duplicate of the function''s first line
    somewhere before

    main(). The prototype for *gradeAve* appears right before *main()* in the program
    you see

    earlier. The line is *not* a function call because it appears before *main()*.
    The line is not a function''s

    actual first line is the semicolon that follows all prototypes. The line is a
    function prototype.

    If your program calls 20 functions, you should have 20 prototypes.


    Prototype every function in your programs—every function called by your code and
    the built-in

    functions such as *printf*. "Huh" might be a good question at this point. You
    might wonder how

    You can prototype *printf* when you didn''t write it to begin. The file *stdio.h*
    contains a

    prototype for *printf()*, *scanf()*, *getchar()*, and many other input and output
    functions.

    The prototype for *strcpy()* appears in *string.h*. You should find out the name
    of the header file

    when you learn a built-in function so that you can use the #include directive
    to add the file to

    y program and make sure that each function is prototyped.


    > Tip

    main() needs no prototype as long as you place main() as the first function in
    the'
