  md: '# Calling function


    ```

    ans=callit[i, j, k];

    ```


    Three passed


    ```

    callit(int i, int j, int k)


    return [i*j*k];

    ```


    One returned


    Receiving function


    FIGURE 32.1 You can pass more than one value but return only one.


    Although a single return value might seem limiting, it really isn''t. Consider
    the built-in `sqrt()` function. You might remember from Chapter 20, “Advanced
    Math (For the Computer, Not You!),” that `sqrt()` returns the square root of whatever
    value is passed to it. `sqrt()` doesn''t return several values—only one. As a
    matter of fact, none of the built-in functions returns more than a single value,
    and neither can yours.


    # Note


    The `gets()` function seems as if it returns more than one value because it returns
    a character string array. Remember, though, an array is nothing more than a pointer
