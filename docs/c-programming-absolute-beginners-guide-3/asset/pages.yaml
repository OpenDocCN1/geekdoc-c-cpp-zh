  md: '# 11. The Fork in the Road—Testing Data to Pick a Path


    +   In This Chapter

    * Testing data

    * Using if

    * Using else


    C provides an extremely useful statement if.if lets your programs make decisions
    and execute certain statements based on the results of those decisions. By testing
    contents of variables, your programs can produce different output, given different
    input.

    This chapter also describes relational operators. Combined with if, relational
    operators make C a powerful data-processing language. Computers would really be
    boring if they couldn''t test data; they would be little more than calculators
    if they had no capability to decide courses of action based on data.


    # Testing Data


    C if something works just like it does in spoken language: If something is true,
    do one thing; otherwise, do something else. Consider these statements:

    If I make enough money, we''ll go to Italy.

    If the shoes don''t fit, take them back.

    If it''s hot outside, water the lawn.


    Table 11.1 lists C relational operators, which permit testing of data. Notice
    that some of the relational operators consist of two symbols.


    | Relational Operator | Description |

    |---|---|

    | == | Equal to |

    | > | Greater than |

    | < | Less than |

    | >= | Greater than or equal to |

    | <= | Less than or equal to |

    | != | Not equal to |


    TABLE 11.1 C Relational Operators


    ![](img/16305f3570927791787abd82e5e0ea39_93_0.png)


    Relational operators compare two values. You always put a variable, literal, or
    expression—or a combination of any two of them—on either side of a relational
    operator.'
  merge: -1
  pgno: 93
- img_proc: true
  md: 'Before delving into if, let''s look at a few relational operators and see what
    they really mean. A regular operator produces a mathematical result. A relational
    operator produces a true or false result. When you compare two data values, the
    data values either produce a true comparison or they don''t. For example, given
    the following values:


    ```

    int i = 5;

    int j = 10;

    int k = 15;

    int l = 5;

    ```


    the following statements are true:


    ```

    i == 1;

    j < k;

    k > i;

    j != 1;

    ```


    The following statements are not true, so they are false:


    ```

    i > j;

    k < j;

    k == 1

    ```


    ![](img/16305f3570927791787abd82e5e0ea39_94_0.png)


    # Tip


    To tell the difference between = and ==, remember that you need two equals signs
    to double-check whether something is equal.


    ![](img/16305f3570927791787abd82e5e0ea39_94_1.png)


    # Warning


    Only like values should go on either side of the relational operator. In other
    words, don''t compare a character to a float. If you have to compare two unlike
    data values, use a typecast to keep the values the same data type.


    Every time C evaluates a relational operator, a value of 1 or 0 is produced. True
    always results in 1, and false always results in 0. The following statements assign
    a 1 to the variable a and a 0 to the variable b:


    Click here to view code image


    ```

    a = (4 < 10); // (4 < 10) is true, so a 1 is put in a

    b = (8 == 9); // (8 == 9) is false, so a 0 is put in b

    ```


    You will often use relational operators in your programs you''ll want to know
    whether sales (stored in a variable) is more than a set goal, payroll calculations
    are in line, and whether a product is in inventory or needs to be ordered, for
    example. You have seen only the'
