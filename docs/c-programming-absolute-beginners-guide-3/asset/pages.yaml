  md: Several computer methods help in sorting values. This chapter teaches you about
    the *bubble sort*. The bubble sort isn't extremely efficient compared to other
    sorts, but it's the easiest to understand. The name *bubble sort* comes from the
    nature of the sort. During a sort, the lower values “float” up the list each time
    a pass is made through the data. [Figure 23.1] shows the process of sorting five
    numbers using a bubble sort.
