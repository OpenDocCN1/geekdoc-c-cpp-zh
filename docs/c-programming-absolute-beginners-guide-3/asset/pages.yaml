    If the user uses GP and presses Enter, the G resides in the firstInit variable
    and the P resides in the lastInit variable.


    # A Little Faster: get()


    A character input named get() helps the leftover Enter keypress that get() leaves.
    get() is unbuffered—that is, get() gets whatever the user types immediately and
    doesn''t wait for an Enter keypress. The drawback to get() is that the user can''t
    press the Backspace key to correct bad input. For example, with getchar(), a user
    could press Backspace if he typed a B instead of a D. The B would be taken off
    by the Backspace, and the D would be left for getchar() after the user pressed
    Enter. Because get() does not buffer input, there is no chance of the user pressing
    Backspace. The following code shows two characters without an Enter keypress following
    each one:


    Click here to view code image


    ```

    printf("What are your two initials?\n");

    firstInit = get();

    lastInit = get();"

    ```


    get() is a little faster than getchar() because it doesn''t wait for an Enter
    keypress before grabbing the user''s keystrokes and continuing. Therefore, you
    don''t need a standalone get() to get rid of the \n as you do with getchar().


    ![](img/16305f3570927791787abd82e5e0ea39_150_0.png)


    get() does not echo the input characters to the screen as get() does. Therefore,
    you must follow get() with a mirror-image putch() if you want the user to see
    onscreen the character he or she typed. To echo the initials, you could do this:


    Click here to view code image


    ```

    printf("What are your two initials?\n");

    firstInit = get();


    putch(firstInit);


    lastInit = putch();"

    ```'
