  md: "You now know everything there is to know about passing parameters and returning\
    \ values. Put on\nyour official programmer's thinking cap and start your C compiler!\n\
    \n# The Absolute Minimum\n\nThe goal of this chapter was to round out your knowledge\
    \ of functions by explaining\nprototypes and return values. When your program\
    \ contains a list of functions, prototype\nthose functions somewhere before main().\
    \ The prototypes tell C what to expect.\nAfter you prototype, you can pass and\
    \ return variables of any data type. (You can\nreturn ints only if you don't prototype.)nThe\
    \ prototype ensures that you don't inadvertently pass the wrong data types to\n\
    functions. For example, if the prototype states that you'll pass two float values\
    \ to a\nfunction, but if you accidentally pass two int variables, C complains.\
    \ C doesn't\ncomplain if you don't prototype, and you might get wrong results\
    \ because of it.\n\nNow that you know how to return values, you can write functions\
    \ that mirror those that\nare built in, such as sqrt() and rand(). When you call\
    \ a function, that function\nreturns a value based on the function's code. A function\
    \ can return a maximum of one\nvalue, just like functions that are built in. Key\
    \ concepts from this chapter include:\n\n+   - Place the return data type before\
    \ a function name that returns a value.\n- The return value appears after a return\
    \ statement.\n- In the calling function, do something with the return value. Print\
    \ it or assign it to\nsometh. Calling a function that returns a value is useless\
    \ if you do nothing with\nthe return value.\n- Use void as the return data type\
    \ or in the parameter list if you neither return nor\n values to a function.\n\
    - Don't return more than one value from a function.\n- Don't return a non-integer\
    \ without a prototype. Better yet, prototype all functions\nexcept main()."
