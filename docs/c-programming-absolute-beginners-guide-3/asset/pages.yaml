  md: '# Introduction


    +   ### In This Introduction

    * Who''s This Book?

    * What Makes This Book Different?

    * This Book''s Design Elements

    * How Can I Have Fun with C?

    * What Do I Do Now?


    Are you tired of seeing your friends get C programming jobs while you''re left
    out in the cold? Would you like to learn C but don''t have the energy? Is your
    old, worn-out computer in need of a hot programming language to spice up its circuits?
    This book is just what the doctor ordered!


    C Programming Absolute Beginner''s Guide handles the commonality of computer books
    by talking to you at your level without talking down. This book is like your best
    friend sitting next to you teaching. C Programming Absolute Beginner''s Guide
    attempts to express without impressing. It talks to you in plain language, not
    in "computerese." The short chapters, line drawings, and occasionally humorous
    straight talk guide you through the maze of C programming faster, friendlier,
    and easier than any other book available today.


    # Who''s This Book For?


    This is a beginner''s book. If you have never programmed, this book is for you.
    No knowledge of any programming concept is assumed. If you can''t even spell C,
    you can learn to program in C with this book.


    The phrase absolute beginner has different meanings at different times. Maybe
    you''ve tried to learn C but gave up. Many books and classes make C more technical
    than it is. You might have programmed in other languages but are a beginner in
    C. If so, read on, O faithful one, in 32 quick chapters, you''ll know C.


    # What Makes This Book Different?


    This book doesn''t cloud issues with internal technical stuff that beginners in
    C don''t need. We''re of the firm belief that introductory principles have to
    be taught well and slowly. After you tackle the basics, "harder" parts never seem
    hard. This book teaches the real C you need to get started.


    C can be an extremely tricky and difficult language. Many people try to learn
    C more than once. The problem is simply this: Any subject, whether it be brain
    surgery, mailing sorting, or C programming, is easy if explained properly. Nobody
    can teach you anything you have to teach yourself—but if the instructor, book,
    or video doing the teaching doesn''t make the subject simple and fun, you won''t
    want to learn the subject.


    We challenge you to find a more straightforward approach to C than is offered
    in the C Programming Absolute Beginner''s Guide. If you can, call one of us because
    we''d like to read it. (You thought'
