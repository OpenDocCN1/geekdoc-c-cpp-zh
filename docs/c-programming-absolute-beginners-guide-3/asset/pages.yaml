    C ensures that if none of the other cases matches the variable after switch, the
    default statements execute.


    default works like else, in a way. else takes care of an action if it is false,
    and default takes care of an action if none of the other case conditions successfully
    matches the variable. Although default is optional (as is else), it’s good programming
    practice to use a default to handle unexpected switch values.


