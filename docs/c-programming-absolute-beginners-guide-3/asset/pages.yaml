    # The Absolute Minimum


    The goal of this chapter was to get you thinking about the similarities between
    arrays and pointers. An array name is really just a pointer that points to the
    first element in the array. Unlike pointer variables, an array name cannot change.
    This is the primary reason an array name cannot appear on the left side of an
    equals sign.


    Using pointers allows more flexibility than arrays. You can directly assign a
    string literal to a character pointer variable, whereas you must use the strcpy()
    function to assign strings to arrays. You''ll see many uses for pointer variables
    throughout your C programming career. Key concepts from this chapter include:


    +   - Use character pointers if you want to assign string literals directly.

    - Use either array subscript notation or pointer dereferencing to access array
    and pointer values.

    - Don''t use a built-in function to fill a character pointer''s location unless
    that character pointer was originally set up to point to a long string.'
