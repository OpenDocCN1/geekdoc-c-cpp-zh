  md: 'getchar() gets a single character, control not returned to your program until
    the user presses Enter. The getchar() function instructs C to accept input into
    a buffer, which is a memory area reserved for input. The buffer is not released
    until the user presses Enter, and then the buffer''s contents are released a character
    at a time. This means two, the user can use the Backspace key to correct bad character
    input, as long as he or she has not pressed Enter. Two, the Enter keypress is
    left on the buffer if you don''t get rid of it.


    Getting rid of the Enter keypress is a problem that all C programmers must face.
    Solutions exist, none are extremely easy. Consider the following segment of a
    program:


    Click here to view code image


    ```

    printf("What are your two initials?\n");

    firstInit = getchar();

    lastInit = getchar();

    ```


    If you think that typed GT, the G would go in the variable firstInit and the T
    would go in lastInit, but that''s not what happens. The first getchar() doesn''t
    finish until the user presses Enter because the G leave the buffer and go to the
    program—then the Enter is still on the buffer! Therefore, the second getchar()
    sends that Enter (actually, the \n that represents Enter) to lastInit. The T is
    still left for a subsequent getchar() (if there is one).


    ![](img/16305f3570927791787abd82e5e0ea39_149_0.png)


    > One way to fix this problem is to insert an extra getchar() that captures the
    Enter but doesn''t do anything with it.


    Here is a workaround for the initial-getting problem:


    Click here to view code image


    ```

    printf("What are your two initials?\n");

    firstInit = getchar();

    n1 = getchar();

    lastInit = getchar();

    n1 = getchar();

    ```


    This code requires the user press Enter between each initial. You don''t have
    to do anything with the n1 variable because n1 exists only to hold the in-between
    newline. You don''t even have to save the newline keypress in a variable. The
    following code works just like the


    Click here to view code image


    ```

    printf("What are your two initials?\n");

    firstInit = getchar();

    getchar(); // Discards the newline

    lastInit = getchar();

    getchar(); // Discards the newline

    ```


    Some Compilers issue warning messages when you compile programs with a standalone'
