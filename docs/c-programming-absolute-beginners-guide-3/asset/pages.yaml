    \nClick here to view code image\n\n```\ntotal = 5;\ntotal *= 2 + 3; /* Updates\
    \ the total variable */\n```\n\nAt first glance, you might think that the value\
    \ of **total** is 13 because you learned earlier that multiplication is done before\
    \ addition. You're right that multiplication is done before addition, but *compound\
    \ multiplication* is done *after* addition, according to the order of operators.\
    \ Therefore, the **2 + 3** is evaluated to get 5, and *then* that 5 is multiplied\
    \ by the old value of *total* (which also happens to be 5) to get a total of **25**,\
    \ as [Figure 10.1] points out.\n\n```\ntotal *= 2+3;\nis the same as this:\ntotal\
    \ = total*(2 + 3);\nbecause *= is lower than + in the table.\n```\n\nFIGURE 10.1\
    \ The compound operators reside on a low level.\n\n# Typecasting: Hollywood Could\
    \ Take Lessons from C\n\nTwo kinds of typecasting exist: the kind directors of\
    \ movies often do (but we don't cover that here) also C's typecasting. A C *typecast*\
    \ temporarily changes the data type of one variable to another. Here is a format\
    \ of a typecast: \n\n```\n(dataType) value\n```\n\nThe **dataType** can be any\
    \ C data type, such as *int* or *float*. The **value** is any variable, literal,\
    \ or expression. Suppose that *age* is an integer variable that holds 6. The following\
    \ converts *age* to a float value of 6.0:\n\n```\n(float)age;\n```\n\nIf you were\
    \ using *age* in an expression with other floats, you should typecast *age* to\
    \ float to maintain consistency in the expression.\n\n![](img/16305f3570927791787abd82e5e0ea39_91_0.png)\n\
    \nBecause of some rounding problems that can automatically occur if you mix data\
    \ types, you'll have fewer problems if you explicitly typecast all variables and\
    \ literals in an expression to the same data type."
