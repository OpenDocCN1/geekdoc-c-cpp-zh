    The Absolute Minimum

    The goal of this chapter was to round out your knowledge of C operators.

    Understanding these operators doesn''t take a lot of work, yet the operators are
    powerful and substitute for complete statements in other languages. Key concepts
    for this chapter include:


    +   * Use the conditional operator in place of simple if...else statements to
    improve efficiency.

    * The conditional operator requires three arguments. Extra parentheses help clarify
    these arguments by separating them from each other.

    * Use ++ and -- to increment and decrement variables instead of adding and subtracting
    1 using assignment or the += and -- operators.

    * Don''t think that a prefix and postfix always produce the same values. A prefix
    and postfix are identical only when a single variable is involved. If you combine
    ++ or with other variables and expressions, the placement of the prefix and postfix
    is critical to get the result you want.'
