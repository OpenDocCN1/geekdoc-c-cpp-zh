  md: '# 6. Adding Words to Your Programs


    In This Chapter

    * Understanding the string terminator

    * Determining the length of strings

    * Using character arrays: listing characters

    * Initializing strings


    Although C doesn''t have string variables, you do have a way to store data in
    quotation marks. This chapter explains how. You already know that you must enclose
    data in quotation marks. Even a single character enclosed in quotation marks is
    a string. You also know how to print strings with `printf()`.

    The only task left is to see how to use a special type of character variable to
    hold string data so that your program can input, process, and output that string
    data.


    # Understanding the String Terminator


    C does the strangest thing to strings: It adds a zero to the end of every string.
    The zero at the end of strings has several names:


    +   * Null zero

    * Binary zero

    * String terminator

    * ASCII 0

    * \0


    ![](img/16305f3570927791787abd82e5e0ea39_58_0.png)


    > Warning About the only thing you don''t call the string-terminating zero is
    zero! C programmers use the special names for the string-terminating zero so that
    you''ll know that a regular numeric zero or a character ''0'' is not being used
    at the end of the string; only the special null zero appears at the end of a string.


    C marks the end of all strings with the string-terminating zero. You never have
    to do anything special when entering a string literal such as "My name is Julie."
    C automatically adds the null zero. You''ll never see the null zero, but it is
    there. In memory, C knows when it gets to the end of a string only when it finds
    the null zero.'
  merge: -1
  pgno: 58
- img_proc: true
  md: '# Note


    Appendix A. “The ASCII Table,” contains an ASCII table (first mentioned in Chapter
    2, “Writing Your First C Program”). The very first entry is labeled null, and
    the ASCII value for null is 0. Look further down ASCII 48, and you''ll see a 0.
    ASCII 48 is the character ''0'', whereas the ASCII value is the null zero. C puts
    the null zero at the end of strings. Even the string “I am 20” ends in ASCII directly
    after the character 0 in 20.


    The string terminator is sometimes called \0 (backslash zero) you can represent
    the string by enclosing \0 in single quotes. Therefore, ''0'' is the character
    zero, and ''\0'' is the string terminator. (Remember the escape sequences covered
    in Chapter 4, “Your World Premiere–Putting Your Program’s Results Up on the Screen,”
    that were also single characters represented by two characters—a backslash followed
    by a letter or another character. Now you have a backslash number to add to the
    collection.)


    Figure 6.1 shows how the "Crazy" is stored in memory. As you can see, it takes
    6 bytes (a is a single memory location) to store the string, even though the string
    has only five letters. The null zero that is part of the string "Crazy" takes
    one of those six memory locations.


    ![](img/16305f3570927791787abd82e5e0ea39_59_0.png)


    FIGURE 6.1 A always ends with a null zero in memory.


    # The Length of Strings


    The length of a string is always the number of characters up to, but not including,
    the null zero. Sometimes you will need to find the length of a string. The null
    zero is never counted when determining the length of a string. Even though the
    null zero must terminate the string (so that C knows where the string ends), the
    null zero is not part of the string length.


    Given the definition of the string length, the following strings all have length
    of nine characters:


    ```

    Wednesday

    August 10

    I am here

    ```


    When counting the length of strings, numbers, remember that you must account for
    every space. Although the second string has eight letters and numbers, as well
    as a space in the middle, and the third string has seven letters, as well as two
    spaces in the middle, are all considered nine-character strings. If you choose
    to put three spaces between August and 10 in the middle example, it would become
    an 11-character string.'
