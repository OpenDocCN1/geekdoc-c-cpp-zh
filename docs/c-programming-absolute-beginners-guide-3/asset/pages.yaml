    In some older C compilers, `int` could hold only values between 32767 and -32768.
    If you wanted to use a larger integer, you needed to use the `long int` type.
    In most modern compilers, though, an `int` can hold the same as a `long int` type.
    If you''d like to be sure with your program''s variables, you can use the `sizeof`
    operator, covered in [Chapter 13], [A Bigger Bag of Tricks—Some More Operators
    for Your Programs].


