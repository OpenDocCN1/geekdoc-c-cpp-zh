    Only when combine code a small “gotcha” appears. Consider the following code:


    ```

    int i = 2, j = 5, n;

    n++=i * j;

    ```


    The question is, what is n when the statements finish executing? It''s easy to
    see what''s in j because j doesn''t change and holds 5. The ++ ensures that i
    is always incremented, so you know that i becomes 3. The trick is detecting exactly
    when i increments. If i increments before the multiplication, n becomes 15, but
    if i increments after the multiplication, n becomes 10.

    The answer lies in the prefix and postfix placements. If the ++ or -- is a prefix,
    C computes it after everything on the line finishes. The ++ in the preceding code
    is a prefix, i increments to 3 before being multiplied by j. The following statement
    i after multiplying i by j and storing the answer in n:


    [Click here to view code image](#)


    ```

    n = i++ * j; /* Puts 10 in n and 3 in i */

    ```


    Being able to increment a variable in the same expression as you use the variable
    means less work on the programmer''s part. The preceding statement replaces the
    following two statements that you would have to write in other programming languages:


    ```

    n = i * j;

    i = i + 1

    ```


