  md: 'Variable g2 is usable because it''s defined before a function (prAgain()).
    Local variables are usable only within their block of code. Therefore, l11 could
    never be printed or changed in prAgain() because l11 is local to main(). Conversely,
    l12 could not be used in main() because l12 is visible only to prAgain(). The
    variable g1 is visible to the entire program. g2 is usable only from its point
    of definition down.


    ![](img/16305f3570927791787abd82e5e0ea39_246_0.png)


    # Tip


    All global variables are known from their points of definition down in the source
    file. Don''t define a global variable in the middle of a program (as is done in
    the preceding program) because its definition can be too hard to find during debugging
    sessions. You should limit (or eliminate) the use of globals. If you use them
    at all, define all of them before main(), they are easy to find (such as if you
    need to change them or look at their defined data types).


    The program outline shown earlier has a problem. If you use only local variables
    (and you should always to), the user ID created in assignID() cannot be used in
    buildContact() or addPayroll(). Stay tuned—the next chapter shows you the solution.


    ![](img/16305f3570927791787abd82e5e0ea39_246_1.png)


    # Warning


    If you compile the previous program and receive a compiler compiler warning about
    a call to a function prototype, ignore the warning for now. Chapter 32, “Returning
    Data from Your Functions,” answers your questions.


    # The Absolute Minimum


    The goal of this chapter was to teach you the building-block approach to writing
    C programs. Long programs can become unwieldy unless you break them into several
    separate functions. One long main() function is analogous to a long book without
    chapter divisions. Break your long programs into separate functions, and have
    each function perform a single, task in the program.


    When you divide your programs into several functions, you have to consider how
    variables are used throughout the code. Local variables are defined inside a function
    and are usable only in that function. The opposite of a local variable is a global
    variable, whose value is usable in all functions after its definition. Global
    variables are frowned upon. Local variables are safer because you can limit their
    access to functions that need them. In the next chapter, you learn how to share
    local variables between functions. Key concepts from this chapter include:


    +   - Define local variables after a block''s opening brace. Define global variables
    before'
