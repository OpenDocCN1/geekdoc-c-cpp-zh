    # The Absolute Minimum


    C provides several math operators that do calculations for you. You just need
    to understand the order of operators to ensure that you put your numbers correctly
    for your desired calculations. Key concepts from this chapter include:

    * Use +, *, and / for addition, subtraction, multiplication, and division, respectively.

    * Use the modulus operator (%) if you want the remainder of an integer division.

    * Remember the order of operators, and use parentheses if you need to change the
    order.

    * Don''t put two signs together if you are subtracting a negative number, or C
    will think you are using a different operator. Place a space between the two minus
    signs.

    * Use multiple assignment operators if you have several variables to initialize.'
