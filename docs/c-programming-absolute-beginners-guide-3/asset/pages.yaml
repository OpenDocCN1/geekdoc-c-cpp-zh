    if ((hrWorked > 40) || (sales > 25000.00)) {

    ```


    and


    ```

    if (!isCharterMember)) {

    ```


    If you combine two relational operators with a logical operator or you use the
    ! (not) operator to negate a relation, the entire expression following the if
    statement requires parentheses. This is not allowed:


    Click here to view code image


    ```

    if !!isCharterMember { /* Not allowed */

    ```


    Of course, this is more to the preceding if statements than what is shown, but
    to keep things simple at this point, the if bodies aren''t shown.


    Logical operators work just as they do in spoken language. For example, consider
    the spoken statements that correspond to the code lines just seen:


    Click here to view code image


    ```

    if ((age >= 21) && (age <= 65)) {

