  md: '# 8. Interacting with Users


    In This Chapter

    * Looking at scan()

    * Prompting for scan()

    * Solving problems with scan()


    `printf()` sends data to the screen. The `scan()` function gets data from the
    keyboard. You must have a way to get data from your user. You can''t always assign
    data values using assignment statements. For example, if you were writing a movie
    theater program throughout the country, you couldn''t assign the cost of a ticket
    to a variable using the equals sign in your program because every theater''s ticket
    price could differ. Instead, you would have to ask the user of the program in
    every theater location how much a ticket costs before computing a charge.


    At first glance, the `scan()` function might seem confusing, but it is the easiest.
    To a beginner, `scan()` makes little sense, but despite its strange format, it
    is the easiest function to use for input in this book because of its closeness
    to the `printf()` function. Practice with `scan()` will make your programs perfect!


    # Looking at scan()


    `scan()` is a built-in C function that comes with all C compilers. Its header
    file is the same as `printf()` (`stdio.h`), so you don''t have to worry about
    including an additional header file for `scan()`. It fills variables with values
    typed by the user.

    `scan()` is fairly easy if you know `printf()`. `scan()` looks a lot like `printf()`
    because it uses conversion codes like `%s` and `%d`. `scan()` is the mirror-image
    of `printf()`. Often you will write programs that ask the user for values with
    a `printf()` and get those values with `scan()`. Here is the format of `scan()`:


    [Click to view code image]


    ```

    scan(controlString, data);

    ```


    When you get programs to `scan()`, C stops and waits for the user to type values.
    The variables inside `scan()` (following the `controlString`) will accept whatever
    values the user types. `scan()` quits when the user presses Enter after typing
    values.

    Even though `scan()` uses the same conversion characters as `printf()`, never
    specify escape sequences like `\n`, `\a`, or `\t`. Escape sequences confuse `scan()`.
    `scan()` quits getting from the user when the user presses Enter, so you don''t
    ever specify the `\n`.


    # Prompting for scan()


    Almost every `scan()` you should write be preceded with `printf()`. The program
    stops and waits for input, and the user has no idea what to do. For example,'
