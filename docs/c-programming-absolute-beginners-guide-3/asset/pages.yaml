    Absolute beginners to C aren''t the only ones who might find this chapter’s concepts
    confusing at first. Even advanced C programmers get mixed up when dealing with
    the heap. The heap is the collection of unused memory in your program. The memory
    left over—after your program, your variables, and your operating system’s workspace—comprises
    your computer’s available heap space, as Figure 26.1 shows.


    | Your operating system |

    | Your C program |

    | Your variables |

    | Heap |


    FIGURE 26.1 The heap is unused memory.


    Many times you’ll access to the heap, because your program will need more memory
    than you initially define in variables and arrays. This chapter gives you some
    insight into why and how you want to use heap memory instead of variables.


    You don’t assign variable names to heap memory. The only way to access data stored
    in heap memory is through pointers. Aren’t you glad you learned about pointers
    already? Without pointers, you couldn''t learn about the heap.


    > Note

    The free heap memory is called free heap or unallocated heap memory. The part
    of the heap in use by your program at any one time is called the allocated heap.
    Your program might use varying amounts of heap space as the program executes.
