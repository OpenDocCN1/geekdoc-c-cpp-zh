  md: "# Methods of Passing Arguments\n\nYou pass arguments from a function to another\
    \ function in two ways: by value and by address. Both of these methods pass arguments\
    \ to a receiving function from a calling function. There is also a way to return\
    \ a value from a function back to the calling function (see the next chapter).\n\
    All of this passing values focuses on the parentheses that follow function names.\
    \ That's right, those empty parentheses have a use after all! The variables you\
    \ use go inside the parentheses of the function call and also in the receiving\
    \ function, as you'll see in the next section.\n\n![](img/16305f3570927791787abd82e5e0ea39_249_0.png)\n\
    \nYes, this passing values stuff is important! It's easy, though, as you'll see.\n\
    \n# Passing by Value\n\nSometimes passing by value is called passing by copy.\
    \ You'll hear these terms used interchangeably because they mean the same thing.\
    \ Passing by value means that the value of the variable is passed to the receiving\
    \ function, not the variable itself. Here is a program that passes a value from\
    \ main() to half():\n\nClick here to view code image\n\n```\n// Example program\
    \ #1 from Chapter 31 of Absolute Beginner's Guide\n// to C, 3rd Edition\n// File\
    \ Chapter 31lex.c\n\n/* The Program demonstrates passing a variable to a function\
    \ by\nvalue. * */\n\n#include <stdio.h>\n\nmain()\n{\n    int i;\n\n    printf(\"\
    Please enter an integer: \");\n    scanf(\"%d\", &i);\n\n    // Now call the half\
    \ function, passing the value of i\n\n    half(i);\n    // Shows that the function\
    \ did not alter i's value\n    printf(\"In main(), i is still %d.\\n\", i);\n\n\
    \    return(0); // Ends the program\n}\n********************************************************************/\n\
    \n/* Sometimes putting dividers like the one above is a nice break\nbetween your\
    \ different functions. */\n```"
