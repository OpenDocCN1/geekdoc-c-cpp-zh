    # Conversion Characters


    When you print numbers and characters, you must tell C exactly how to print them.
    You indicate the format of numbers with conversion characters. Table 4.2 lists
    a few of C''s most-used conversion characters.


    | Conversion Character | Description |

    |---|---|

    | %d | Integer |

    | %f | Floating-point |

    | %c | Character |

    | %s | String |


    # TABLE 4.2 Conversion Characters


    When you want to print a value inside a string, insert the appropriate conversion
    characters in the controlString. Then to the right of the controlString, list
    the value you want to be printed. Figure 4.1 is an example of how printf() can
    print three numbers—an integer, a floating-point value, and another integer.


    ```

    printf("%d roses cost %2f per %d\n", 24, 19.95, 12);

    nThe output:

    24 roses cost 19.95 per 12

    ```'
