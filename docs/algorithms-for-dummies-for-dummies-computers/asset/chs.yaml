  \ A* 寻找最佳启发式路线**\n\n作为一个总结性性主题，本章完成了从第 18 章开始的启发式概述。该章节将启发式描述为利用局部搜索导航邻近解决方案的有效手段。第\
  \ 18 章将启发式定义为对解决方案的经验性猜测——即它们是指向预期结果的经验法则集，从而帮助算法向该目标采取正确的步骤；然而，仅凭启发式无法准确告诉你如何到达解决方案。\n\
  \n启发式有深浅之分，正如真理也有层次之分。启发式触及了算法开发的边缘。AI 革命建立在书中目前介绍的算法之上，这些算法负责排序、排列、搜索和处理输入数据。层次结构的顶端是驱动优化的启发式算法，以及决定机器如何从数据中学习并能够在无直接干预的情况下自主解决问题的搜索。\n\
  \n启发式并非万灵药；没有一种解决方案能解决所有问题。启发式算法有严重的缺点，你需要知道何时使用它们。此外，启发式可能会导致计算机和人类得出错误的结论。对于人类来说，在评估个人或情况时节省时间的偏见往往被证明是错误的，甚至是从经验中获得的行为准则也只在特定情况下才能获得正确解。例如，考虑在电器设备不工作时敲击它的习惯。如果问题是连接松动，敲击电器可能会通过重新建立电连接而获益，但你不能将其作为通用的启发式，因为在其他情况下，这种“解决方案”可能是无效的，甚至会对电器造成严重损坏。\n\
  \n## 区分启发式\n\n`heuristic` 一词源于古希腊语 `heuriskein`，意思是发明或发现。它的原始含义强调了一个事实：使用启发式是寻找未定义解决方案的实用手段，这种解决方案是通过探索和对所取方向的直觉把握找到的。启发式依赖于运气猜测或尝试不同解决方案的试错法。`heuristic\
  \ algorithm`（由启发式驱动的算法）通过牺牲解决方案的精确性和完整性，在计算资源方面更快速、更高效地解决问题，这与大多数具有输出保证的算法形成对比。当问题变得过于复杂时，启发式算法可能是获取解决方案的唯一方法。\n\
  \n### 考虑启发式的目标\n\n启发式可以加速其他解决方案执行的长时、耗尽搜索，特别是对于根据输入数量需要指数级尝试的 NP 困难问题。例如，考虑旅行商问题或\
  \ SAT 问题的变体，如 `MAX-3SAT`（这两个问题都出现在第 18 章关于局部搜索的讨论介绍了模拟退火和禁忌搜索等启发式，这些有助于爬山优化（避免陷入不理想的解决方案中）。除了这些之外，启发式家族还包含许多不同的应用，其中包括：\n\
  \n- **群体智能 (Swarm intelligence)**：一组基于对昆虫群（如蜜蜂、蚂蚁或萤火虫）或粒子行为研究的启发式。该方法使用多次尝试，通过代理（如运行相同算法的多个实例）寻找解决方案，这些代理在相互与问题设定之间协作互动。群体智能算法研究的顶级专家和贡献者\
  \ Marco Dorigo 教授在 [`http://www.aco-metaheuristic.org/`](http://www.aco-metaheuristic.org/)\
  \ 上提供了关于此主题的信息。\n- **元启发式 (Metaheuristics)**：帮助你确定（甚至生成）适用于你问题的正确启发式。在元启发式中，广为人知的是受自然演化启发的`遗传算法`。遗传算法从可能的解决方案池开始，然后通过变异（在解决方案中添加或删除内容）和交叉（当解决方案可分时混合不同解决方案的部分）来生成新解决方案。例如，在皇后问题（第\
  \ 18 章**：如神经模糊系统、支持向量机和神经网络等方法，它们是计算机如何从数据集提供的训练示例中估计和分类的基础。与孩子通过经验学习一样，机器学习算法在不使用精确规则和详细行为准则的情况下确定如何提供最可能的答案。（有关机器学习如何工作的细节，请参见\
  \ John Paul Mueller 和 Luca Massaron 写的 *Machine Learning For Dummies* [Wiley]。）\n\
  - **启发式路由 (Heuristic routing)**：一组帮助机器人（但也用于网络通信和物流运输）在移动时选择最佳避障路径的启发式。\n\n## 使用启发式进行机器人路由\n\
  \n\n\n\n在未知环境中引导机器人意味着避开障碍并到达特定目标。这是人工智能领域一项既基础又具有挑战性的任务。机器人可以依靠`laser rangefinder`（激光测距仪）、`lidar`（通过激光束确定与物体距离的设备，雷达）或\
  \ `sonar arrays`（利用声波感知环境的设备）在周围环境中导航。然而，无论配备了多么复杂的硬件，机器人仍然需要适当的算法来：\n\n*   找到通目的地的最短路径（或至少是足够短的路径）\n\
  *   避开途中障碍\n*   执行自定义行为，例如最小化转弯或刹车\n\n`pathfinding`（也称为 `path planning` 或简单的 `pathing`）算法可以帮助机器人从一个位置开始，利用两地之间的最短路径到达目标，并预测且避开沿途障碍（仅在撞到墙后做出反应是不够的）。在将任何其他设备移动到空间目标（即使是虚拟目标，如视频游戏或万维网页面）时，路径查找同样有用。\n\
  \n![remember](img/remember.png) 自主路由是自动汽车（SDC）的核心能力，这类车辆能够感知道路环境并在无需人工干预的情况下行驶到达目的地。（你仍然需要告诉汽车去哪里；它不会读心。）来自《卫报》报的这篇最新文章对自动汽车的发展和预期提供了良好的概述：[`https://www.theguardian.com/technology/2015/sep/13/self-driving-cars-bmw-google-2020-driving`](https://www.theguardian.com/technology/2015/sep/13/self-driving-cars-bmw-google-2020-driving)。\n\
  \n### 在未知领域侦察\n\n路径查找算法通过实现之前讨论的所有任务，来实现最短路由、避障和其他预期行为。算法通过使用周围的基础示意图工作。这些地图分为两种：\n\
  \n*   **拓扑地图（Topological maps）：** 删除了所有不必要细节的简化图表。地图保留了关键地标、正确的方向以及某些距离比例。拓扑地图的现实生活示例包括东京的地铁图（[`www.tokyometro.jp/en/subwaymap/`](http://www.tokyometro.jp/en/subwaymap/))）和伦敦的地铁图（[`tfl.gov.uk/maps/track/tube`](https://tfl.gov.uk/maps/track/tube)）。\n\
  *   **占据栅格地图（Occupancy grid maps）：** 这些地图将周围环境划分为小的空正方形或六边形，当机器人的传感器在它们代表的位置发现障碍物时，就会对其进行填充。你可以在布拉格捷理工大学看到此类地图的示例：[`http://cmp.felk.cvut.cz/cmp/demos/Omni/mobil/`](http://cmp.felk.cvut.cz/cmp/demos/Omni/mobil/)。此外，请查看展示机器人如何构建和可视化此类地图的视频：[`https://www.youtube.com/watch?v=zjl7NmutMIc`](https://www.youtube.com/watch?v=zjl7NmutMIc)\
  \ 和 [`https://www.youtube.com/watch?v=RhPlzIyTT58`](https://www.youtube.com/watch?v=RhPlzIyTT58)`.\n\
  \n你可以将拓扑地图和占据栅格地图都可视化为图形图表。然而，当它们被渲染成适当的数据结构时，算法对它们的理解最好。此此目的最佳数据结构是图，因为顶点可以很容易地表示正方形、六边形、地标和路点。边可以像道路、通道和路径一样连接顶点。\n\
  \n![remember](img/remember.png) 你的 GPS 导航设备使用图运行。在设备在屏幕上显示的连续、详细、彩色的地图之下，道路地图在后台被详细化为算法遍历的顶点和边的集合，帮助你于避开交通拥堵的同时找到方向。\n\
  \n将机器人的领地表示为图重新引入了第 9 章中讨论的问题，该章节研究了如何使用最短路径从一个顶点旅行到另一个顶点。最短路径可以是经过顶点最少的路径，也可以是成本最低的路径（取决于交叉边的权重成本之和，这些权重可能代表边的长度或其他成本）。就像你开车一样，你不仅要决定为了到达目的地地的行驶距离，还要考虑交通状况（拥堵或被交通拥堵阻塞的道路）、路况以及可能影响旅程质量的速度限制。\n\
  \n在图中找到通目的最短路径时，图论中最简单、最基础的算法是深度优先搜索和 Dijkstra 算法（在第 9 章中描述）。深度优先搜索通过从起点尽可能远的地方开始探索图，然后回溯步骤以探索其他路径，直到找到目标。Dijkstra\
  \ 算法以智能且贪婪的方式探索图，只考虑最短路径。尽管这两种算法非常简单，但在评估简单图（如鸟视图）时非常有效，因为你对到达目标所需的方向有完全的认知，而且评估各种可能路径的成本很低。\n\
  \n机器人的情况略有不同，因为它无法同时感知所有可能的路径，受限于可见性和视野范围（障碍可能会隐藏路径，或目标可能很远）。\n\n### 使用距离测量作为启发式\n\
  \n当由于输入混乱、缺失或不稳定而无法通过精确算法解决现实问题时，使用启发式会有帮助。在坐标平面（依赖一组水平和垂直坐标的平面地图）中使用坐标进行路径查找时，两种简单的方法可以提供该平面内两点之间的距离：欧几里得距离和曼哈顿距离。\n\
  \n人们通常使用欧几里得距离，因为它来源于三角形的勾股定理。如果你想知道平面上两点（例如 A 和 B）之间的视线距离，并且知道它们的坐标，你可以假设它们是斜角边（三角形中最长的边）。如图\
  \ 20-1 所示，你通过创建一个第三点 C 来根据另外边的长度计算距离，C 的水平坐标源自 B，垂直坐标来自 A。\n\n![image](img/9781119330493-fg2001.png)\n\
  \n图 20-1：A 和 B 是地图坐标上的点。\n\n这一过程转化为：取两点水平和垂直坐标的差，差值的平方（使它们都变为正数），求和，最后对结果取平方根。在这个例子中，从\
  \ A 到 B 使用的坐标 (1,2) 和 (3,3)：\n\n\n\n\n\n```\nsqrt((1-3)`^(`2`) `+ (2-3)`^(`2`)`)\
  \ = sqrt(2`^(`2`)`+1`^(`2`)`) = sqrt(5) = 2.236\n```\n\n曼哈顿距离的工作原理有所不同。你首先相加边 `B`\
  \ 和 `C` 的长度，这等同于将点 `A` 和 `B` 的水平和垂直坐标差的绝对值相加。\n\n```\n|(1-3)| + |(2-3)| = 2 + 1\
  \ = 3\n```\n\n欧几里距离标记了最短路线，而如果你预计在走直路线时遇到障碍，曼哈顿距离则提供了最长但最合理的路线。事实上，这种移动代表了曼哈顿出租车的轨迹（因此得此名），它沿着城市街区移动以到达目的地（穿过建筑的捷径是行不通的）。这种方法的其他名称是街区距离或出租车距离。因此，如果你必须从\
  \ `A` 移动到 `B`，但不知道它们之间是否有障碍，那么通过点 `C` 绕路是一个很好的启发式策略，因为那是你预期最坏的距离。\n\n## 解释路径查找算法\n\
  \n本章的最后一部分集中于解释两种算法：最佳优先搜索和 `A*`（读作“A 星”），它们都基于启发式方法。接下来的章节将证明这两种算法都能为代表拓扑或占用网格地图的迷宫问题提供快速解决方案。这两种算法在机器人领域和视频游戏中被广泛使用。\n\
  \n### 创建迷宫\n\n如前所述，拓扑或占用网格地图类似于花园迷宫，特别是当起点和终点之间存在障碍时。有用于创建和处理迷宫的专门算法，最著名的沿墙法（古代就已知：将手放在墙上，在离开迷宫前永远不要离开）或\
  \ Pledge 算法（可以在 [`http://www.astrolog.org/labyrnth/algrithm.htm`](http://www.astrolog.org/labyrnth/algrithm.htm）阅读更多关于七种迷宫分类的内容）。然而，路径查找在本质上与迷宫求解不同，因为在路径查找中你知道目标在哪里，而迷宫求解算法试图在完全不知道出口位置的情况下解决问题。\n\
  \n因此，模拟机器人必须导航的障碍迷宫的过程采取了不同且更简单的方法。你不是创建一个障碍组成的谜题，而是创建一个排列在网格中的顶点图（类似于地图），并随机删除连接以模拟障碍的存在。该图是无向的（你可以从两个方向遍历每条边），并且是加权的，因为从一个顶点移动到另一个顶点需要时间。特别是，对角线移动比向上/向下或向左/右移动花费长时间。\n\
  \n第一步导入必要的 Python 包。接下来的代码定义了 `euclidean` 和 `manhattan` 距离函数（你可以在 Dummies 网站上下载的代码中的\
  \ `A4D; 20; Heuristic Algorithms.ipynb` 文件中找到这些代码；详情见引言）。\n\n```python\nimport numpy\
  \ as np\nimport string\nimport networkx as nx\nimport matplotlib.pyplot as plt\n\
  %matplotlib inline\n\ndef euclidean_dist(a, b, coord):\n    (x1, y1) = coord[a]\n\
  \    (x2, y2) = coord[b]\n    return np.sqrt((x1-x2)**2+(y1-y2)**2)\n\ndef manhattan_dist(a,\
  \ b, coord):\n    (x1, y1) = coord[a]\n    (x2, y2) = coord[b]\n    return abs(x1\
  \ - x2) + abs(y1 - y2)\n\ndef non_informative(a,b):\n    return 0\n```\n\n下一步是创建一个生成随机迷宫的函数。它基于你所选择的整数种子，这允许你在每次提供相同的数字时重建相同的迷宫。否则，迷宫的生成将完全完全随机。\n\
  \n```python\ndef create_maze(seed=2, drawing=True):\n    np.random.seed(seed)\n\
  \    letters = [l for l in string.ascii_uppercase[:25]]\n    checkboard = np.array(letters[:25]).reshape((5,5))\n\
  \    Graph = nx.Graph()\n    for j, node in enumerate(letters):\n        Graph.add_nodes_from(node)\n\
  \        x, y = j // 5, j % 5\n        x_min = max(0, x-1)\n        x_max = min(4,\
  \ x+1)+1\n        y_min = max(0, y-1)\n        y_max = min(4, y+1)+1\n        adjacent_nodes\
  \ = np.ravel(checkboard[x_min:x_max,y_min:y_max])\n        exits = np.random.choice(adjacent_nodes,\
  \ size=np.random.randint(1,4), replace=False)\n        for exit in exits:\n    \
  \        if exit not in Graph.edge[node]:\n                Graph.add_edge(node,\
  \ exit)\n    spacing = np.arange(0.0, 1.0, 0.2)\n    coordinates = [[x,y] for x\
  \ in spacing for y in spacing]\n    position = {l:c for l,c in zip(letters, coordinates)}\n\
  \    for node in Graph.edge:\n        # ...逻辑根据提供的文本片段继续\n```\n\n\n\n\n使用之前构建的迷宫在\
  \ Python 中演示广度优先搜索（BFS），说明了机器人如何通过将空间视为图。以下代码显示了一些通用函数，这些函数也用于本节中的下一个算法。这两个函数提供了从顶点出发的方向建议（`node_neighbors`），并确定了从一个顶点到另一个顶点的代价（`graph_weight`）。权重代表距离或时间。\n\
  \n```python\ndef graph_weight(graph, a, b):\n    return graph.edge[a][b]['weight']\n\
  \ndef node_neighbors(graph, node):\n    return graph.edge[node]\n```\n\n路径规划算法模拟机器人在图中移动。当找到解决方案时，计划就会转化为移动。因此，路径规划算法提供的输出告诉如何如何地从一个顶点移动到另一个顶点，你仍然需要一个函数来转换信息、确定采取的路线并计算行程长度。`reconstruct_path`\
  \ 和 `compute_path` 函数在提供路径规划算法的结果时，能够以步骤和预期成本的形式提供计划。\n\n```python\ndef reconstruct_path(connections,\
  \ start, goal):\n    if goal in connections:\n        current = goal\n        path\
  \ = [current]\n        while current != start:\n            current = connections[current]\n\
  \            path.append(current)\n    return path[::-1]\n\ndef compute_path_dist(path,\
  \ graph):\n    if path:\n        run = 0\n        for step in range(len(path)-1):\n\
  \            A = path[step]\n            B = path[step+1]\n            run += graph_weight(graph,\
  \ A, B)\n        return run\n    else:\n        return 0\n```\n\n准备好所有基本函数后，示例使用种子值\
  \ 30 创建了一个迷宫。这个迷宫提供了从顶点 A 到顶点 Y 的两条主要路线，因为地图中间有一些障碍（如图 20-3 所示）。途中还有一些死胡同路（例如顶点\
  \ E 和 O）。\n\n```python\ngraph, coordinates = create_maze(seed=30)\nstart = 'A'\n\
  goal = 'Y'\nscoring=manhattan_dist\n```\n\n![image](img/9781119330493-fg2003.png)\n\
  \nFIGURE 20-3: 一个由启发式算法解决的复杂迷宫。\n\nBFS 的实现比第 9 章中的深度优先搜索代码稍微复杂。它使用了两个列表：一个存储从未访问过的顶点（称为\
  \ `open_list`），另一个存储已访问过的顶点（`closed_list`）。`open_list` 列表充当优先级队列，优先级决定了提取的第一个元素。在这种情况下，启发式提供了优先级，因此优先级队列提供了更接近目标的方向。曼哈顿距离启发式效果最好，因为有障碍物阻挡了通目的地的路径：\n\
  \n```python\n# Best-first search\npath = {}\nopen_list = set(graph.nodes())\nclosed_list\
  \ = {start: manhattan_dist(start, goal, coordinates)}\nwhile open_list:\n    candidates\
  \ = open_list&closed_list.keys()\n    if len(candidates)==0:\n        print (\"\
  Cannot find a way to the goal %s\" % goal)\n        break\n    frontier = [(closed_list[node],\
  \ node) for node in candidates]\n    score, min_node =sorted(frontier)[0]\n    if\
  \ min_node==goal:\n        print (\"Arrived at final vertex %s\" % goal)\n     \
  \   print ('Unvisited vertices: %i' % (len(open_list)-1))\n        break\n    else:\n\
  \        print(\"Processing vertex %s, \" % min_node, end=\"\")\n        open_list\
  \ = open_list.difference(min_node)\n        neighbors = node_neighbors(graph, min_node)\n\
  \        to_be_visited = list(neighbors-closed_list.keys())\n        if len(to_be_visited)\
  \ == 0:\n            print (\"found no exit, retracing to %s\" % path[min_node])\n\
  \        else:\n            print (\"discovered %s\" % str(to_be_visited))\n   \
  \     for node in neighbors:\n            if node not in closed_list:\n        \
  \        closed_list[node] = scoring(node, goal, coordinates)\n                path[node]\
  \ = min_node\n        print ('\\nBest path is:', reconstruct_path(path, start, goal))\n\
  \        print ('Length of path: %i' % compute_path_dist(reconstruct_path(path,\
  \ start, goal), graph))\n```\n\nProcessing vertex A, discovered ['F', 'G']\nProcessing\
  \ vertex G, discovered ['K', 'H']\nProcessing vertex H, discovered ['B', 'D']\n\
  Processing vertex D, discovered ['E', 'J', 'C']\nProcessing vertex J, discovered\
  \ ['O']\n\n\n\n\n![remember](img/remember.png) 一个恰当且公平的 `admissible`（可采）启发式通过从不高估到达目标的成本，为\
  \ `A*` 提供关于目标距离的有用信息。此外，`A*` 比 `BFS` 更多地使用了其启发式，因此启发式必须快速完成计算，否则整体处理时间将过长。\n\n本示例中的\
  \ Python 实现使用了与 `BFS` 相同的代码和数据结构，但它们之间存在差异。主要区别在于，随着算法的进行，它会更新从起始顶点到每个已探索顶点的成本。此外，在决定路线时，`A*`\
  \ 会考虑从起点经过当前顶点到达的最最短路径，因为它将来自启发式的估算值与计算到当前顶点的路径成本相加。这一过程使得算法在启发式是准确估计值时，能够执行比 `BFS`\
  \ 更多的计算，并确定可能的最佳路径。\n\n![tip](img/tip.png) 在成本角度上找到可能的最短路径是 Dijkstra 算法的核心功能。`A*`\
  \ 仅仅是 Dijkstra 算法，其中到达顶点的成本通过对目标预期距离的启发式得到了增强。第 9 章 详细描述了 Dijkstra 算法。重温 第 9 章 的讨论将帮助你更好地理解\
  \ `A*` 如何利用启发式。\n\n# A*\n\n```python\nopen_list = set(graph.nodes())\n\nclosed_list\
  \ = {start: manhattan_dist(\nstart, goal, coordinates)}\nvisited = {start: 0}\n\
  path = {}\nwhile open_list:\n    candidates = open_list&closed_list.keys()\n   \
  \ if len(candidates)==0:\n        print (\"Cannot find a way to the goal %s\" %\
  \ goal)\n        break\n    frontier = [(closed_list[node],\nnode) for node in candidates]\n\
  \    score, min_node =sorted(frontier)[0]\n    if min_node==goal:\n        print\
  \ (\"Arrived at final vertex %s\" % goal)\n        print ('Unvisited vertices: %i'\
  \ % (len(\nopen_list)-1))\n        break\n    else:\n        print(\"Processing\
  \ vertex %s, \" % min_node, end=\"\")\n        open_list = open_list.difference(min_node)\n\
  \        current_weight = visited[min_node]\n        neighbors = node_neighbors(graph,\
  \ min_node)\n        to_be_visited = list(neighbors-visited.keys())\n        for\
  \ node in neighbors:\n            new_weight = current_weight + graph_weight(\n\
  graph, min_node, node)\n            if node not in visited or \\\n            new_weight\
  \ < visited[node]:\n                visited[node] = new_weight\n               \
  \ closed_list[node] = manhattan_dist(node, goal,\ncoordinates) + new_weight\n  \
  \              path[node] = min_node\n            if to_be_visited:\n          \
  \      print (\"discovered %s\" % to_be_visited)\n            else:\n          \
  \      print (\"getting back to open list\")\nprint ('\\nBest path is:', reconstruct_path(\n\
  path, start, goal))\nprint ('Length of path: %i' % compute_path_dist(\nreconstruct_path(path,\
  \ start, goal), graph))\n```\n\nProcessing vertex A, discovered ['F', 'G']\nProcessing\
  \ vertex F, discovered ['B', 'K']\nProcessing vertex G, discovered ['H']\nProcessing\
  \ vertex K, discovered ['Q', 'P']\nProcessing vertex H, discovered ['D']\nProcessing\
  \ vertex B, discovered ['C']\nProcessing vertex P, discovered ['L', 'U', 'V']\n\
  Processing vertex Q, discovered ['M', 'W']\nProcessing vertex C, getting back to\
  \ open list\nProcessing vertex U, getting back to open list\nProcessing vertex D,\
  \ discovered ['E', 'J']\nProcessing vertex V, getting back to open list\nProcessing\
  \ vertex L, getting back to open list\nProcessing vertex W, discovered ['X']\nProcessing\
  \ vertex E, getting back to open list\nProcessing vertex M, discovered ['R']\nProcessing\
  \ vertex J, discovered ['O', 'I', 'N']\nProcessing vertex X, discovered ['T', 'Y']\n\
  Processing vertex R, getting back to open list\nProcessing vertex O, getting back\
  \ to open list\nProcessing vertex I, getting back to open list\nArrived at final\
  \ vertex Y\nUnvisited vertices: 3\nBest path is: ['A', 'F', 'K', 'Q', 'W', 'X',\
  \ 'Y']\nLength of path: 14\n\n当 `A*` 完成对迷宫的分析后，它输出的比 `BFS` 解决方案短得多的最佳路径。这种解决方案是有代价的：`A*`\
  \ 探索了几乎所有的当前顶点，只留下了三个未考虑的顶点。与 Dijkstra 一样，它的最坏运行时间为 O(v²)，其中 `v` 是图中顶点的数量；使用最小优先级队列（一种当需要从长列表中获取最小值时的有效数据结构）时，为\
  \ O(e + v*log(v))，其中 `e` 是边的数量。`A*` 算法的最坏运行时间上与 Dijkstra 无异，尽管平均而言它在大图上的表现更好，因为它在启发式测量的正确引导下（在路由机器人的情况下，为曼哈顿距离），会首先找到目标顶点。\n\
