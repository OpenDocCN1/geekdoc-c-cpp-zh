  \ 个。\n\n你可能会觉得 147 个子问题令压力很大。事实上，六个物品乘以 21 个背包是 126 个解决方案，但你必须额外添加 21 个朴素解决方案以便算法正常工作（`naive`\
  \ 意味着留空背包），这使得子问题的数量增加到 147 个。\n\n你可能会觉得 147 个子问题令压力很大。事实上，六个物品乘以 21 个背包是 126 个解决方案，但你必须额外添加\
  \ 21 个朴素解决方案以便算法正常工作（`naive` 意味着留空背包），这使得子问题的数量增加到 147 个。\n\n```python\nfrom scipy.misc\
  \ import comb\nobjects = 6\nnp.sum([comb(objects,k+1) for k in range(objects)])\n\
  ```\n\n解决它需要 63 种组合。然而，如果你尝试更多物品，例如 20 个，运行时间会有很大不同，因为有 1,048,575 种组合。将这个巨大的数字与动态规划对比，后者只需要\
  \ 441 个子问题。\n\n\n\n\nTSP（旅行商问题）是一个 NP-hard 问题，但你可以使用多种方法来解决，其中一些是近似算法（启发式），另一些是精确算法（动态规划）。与其他\
  \ NP-hard 问题一样，该问题的困难在于运行时间。尽管你可以依赖你认为最优的问题的解（除非是求解短路径，否则你无法确定），但对于像环游世界这样复杂的问题，你无法确切知道：[`http://www.math.uwaterloo.ca/tsp/world/`](http://www.math.uwaterloo.ca/tsp/world/)。接下来的示例在一个代表六个城市的简单回路（加权图）上测试了各种算法，例如暴力法、贪心算法和动态规划（参见图\
  \ 16-1）。你可以在 Dummies 网站的可下载代码中找到此代码，路径为 A4D; 16; `TSP.ipynb` 文件；详情请参见引言。）\n\n```python\n\
  import numpy as np\nimport networkx as nx\nimport matplotlib.pyplot as plt\n%matplotlib\
  \ inline\nD = np.array([[0,20,16,25,24],[20,0,12,12,27],\n[16,12,0,10,14],[25,12,10,0,20],\n\
  [24,27,14,20,0]])\nGraph = nx.Graph()\nGraph.add_nodes_from(range(D.shape[0]))\n\
  for i in range(D.shape[0]):\n    for j in range(D.shape[0]):\n        Graph.add_edge(i,j,weight=D[i,j])\n\
  np.random.seed(2)\npos=nx.shell_layout(Graph)\nnx.draw(Graph, pos, with_labels=True)\n\
  labels = nx.get_edge_attributes(Graph,'weight')\nnx.draw_networkx_edge_labels(Graph,pos,\n\
  edge_labels=labels)\nplt.show()\n```\n\n![image](img/9781119330493-fg1601.png)\n\
  \nFIGURE 16-1: 在加权图中节点表示的城市。\n\n在定义了 `D`（距离）矩阵后，示例测试了第一个也是最简单的解决方案，以确定从城市 0 开始并结束的最短回路。该解决方案依赖于暴力法，它生成城市之间所有可能的排列组合，排除城市\
  \ 0。在计算出每个方案的总距离后，会加上从 0 到第一个城市的距离以及从最后一个城市回到 0 的距离。当所有方案都可用时，你只需选择最短的一个即可。\n\n\
  ```python\nfrom itertools import permutations\nbest_solution = [None, np.sum(D)]\n\
  for solution in list(permutations(range(1,D.shape[0]))):\n    start, distance =\
  \ (0,0)\n    for next_one in solution:\n        distance += D[start, next_one]\n\
  \        start = next_one\n    distance += D[start,0]\n    if distance <= best_solution[1]:\n\
  \        best_solution = [[0]+list(solution)+[0], distance]\n    print ('Best solution\
  \ so far: %s kms' %\n    str(best_solution)[1:-1])\nBest solution so far: [0, 1,\
  \ 2, 3, 4, 0], 86 kms\nBest solution so far: [0, 1, 3, 2, 4, 0], 80 kms\nBest solution\
  \ so far: [0, 4, 2, 3, 1, 0], 80 kms\n```\n\n暴力算法可以快速确定最佳解决方案及其对称路径。然而，由于问题规模较小，你得到的是及时答案，因为对于四个城市，只有\
  \ 24 种可能的解决方案。随着城市数量的增加，即使删除了对称路径（这会让排列数减半）并使用快速计算机，要测试的排列数量也会变得无法处理。例如，考虑在处理 13\
  \ 个城市加上起始/结束点时的计算量：\n\n```python\nfrom scipy.special import perm\nprint (perm(13,13)/2)\n\
  3113510400.0\n```\n\n动态规划可以简化运行时间。Held–Karp 算法（也称为 Bellman–Held–Karp 算法，因为 Bellman\
  \ 在 1962 年与 Michael Held 和 Richard Karp 同年发表了它）可以将时间复杂度降低到 `O(2^n²)`。它仍然是指数复杂度，但比比暴力法穷举所有回路的时间要少。\n\
  \n![tip](img/tip.png) 近似和启发式算法可以提供快速且实用的结果（尽管结果并不总是反映最优解，但它们通常足够好）。你会在书中后面再次遇到 TSP（参见第\
  \ 18 章）。\n\n使用动态规划解决 TSP 的步骤如下：\n\n1. 初始化一个表来存储从城市 0 到所有其他城市的最短路径。\n2. 从大小二到 $n$\
  \ 的每个子集大小：\n3. 枚举所有包含城市 0 的该大小子集。\n4. 对于每个子集，考虑所有可能的终点（排除城市 0）。\n5. 对于每个终点，通过考虑之前解决的子集找到最短路径。\n\
  6. 存储最佳路径及其总长度。\n7. 当所有迭代结束时，确定最短方案并输出结果。\n\n接下来的 Python 示例探索了这种工作原理，使用了 `frozenset`\
  \ 使得集合可以作为字典键。\n\n```python\nfrom itertools import combinations\nmemo = {(frozenset([0,\
  \ idx+1]), idx+1): (dist, [0,idx+1])\nfor idx,dist in enumerate(D[0][1:])}\ncities\
  \ = D.shape[0]\nfor subset_size in range(2, cities):\n    # 这里我们定义城市子集的大小\n    new_memo\
  \ = {}\n    for subset in [frozenset(comb) | {0} for comb in\n    combinations(range(1,\
  \ cities),\n    subset_size)]:\n        # 我们枚举具有特定\n        # 大小的子集\n        for\
  \ ending in subset - {0}:\n            # 我们考虑子集中的每个终点\n            all_paths = []\n\
  \            for k in subset:\n                # 我们检查子集中每个\n                # 元素的最短路径\n\
  \                if k != 0 and k!=ending:\n                    length = memo[(subset-{ending},k)][0]\n\
  \                    + D[k][ending]\n                    index = memo[(subset-{ending},k)][1]\n\
  \                    + [ending]\n                    all_paths.append((length, index))\n\
  \            new_memo[(subset, ending)] = min(all_paths)\n    # 为了节省内存，我们只记录之前的\n\
  \    # 子集，因为我们不再使用更短的子集\n    memo = new_memo\n```\n\n\n\n# 现在我们关闭循环并回到行程的起点，城市 0\n\
  \n```python\ntours = list()\nfor distance, path in memo.values():\n    distance\
  \ += D[path[-1],0]\n    tours.append((distance, path+[0]))\n\n# 我们现在可以声明最短路径\ndistance,\
  \ path = min(tours)\nprint ('Shortest dynamic programming tour is: %s, %i kms' %\
  \ (path, distance))\n```\n\n最短动态规划路径为：\n[0, 1, 3, 2, 4, 0], 80 kms\n\n## 字符串搜索近似\n\
  \n判断一个单词与另一个单词是否相似并不总是简单的。单词可能因为拼写错误或单词本身的书写方式不同而略有差异，从而导致任何精确匹配都不成为可能。然而，这不仅仅是一个在拼写检查期间会引发有趣问题的问题。例如，将指向同一人的相似文本字符串（如名称、地址或代码标识符）组合在一起，可以帮助创建企业客户群的单一视图，或帮助国家安全机构定位危险的罪犯。\n\
  \n![remember](img/remember.png) 字符串近似搜索在机器翻译、语音识别、拼写检查、文本处理、计算生物学和信息检索中有许多应用。思考数据源将数据输入数据库的方式，你会发现数据字段之间存在许多智能算法必须解决的不匹配。匹配一组相似但并不完全相等的字母序列，这种能力在遗传学等领域有用，例如在比较\
  \ DNA 序列（用代表核苷酸 G、A、T 和 C 的字母表示）时，确定两个序列是否相似以及它们是如何相互相似的。\n\nVladimir Levenshtein\
  \ 是一位精通信息理论的俄罗斯科学家（详情请参见 [`http://ethw.org/Vladimir_I._Levenshtein`](http://ethw.org/Vladimir_I._Levenshtein)），他在\
  \ 1965 年发明了一种简单的衡量方法（以他的命名），该方法通过计算将第一个字符串转换为第二个字符串所需的转换次数，来计算两个字符串之间的相似性。列文斯坦距离（也称为编辑距离）计算一个单词中必要的更改次数：\n\
  \n*   **删除 (Deletion):** 从单词中移除一个字母\n*   **插入 (Insertion):** 在单词中插入一个字母并获得另一个单词\n\
  *   **替换 (Substitution):** 将一个字母替换为另一个字母，例如将 `p` 字母改为 `f` 字母并从 `pan` 得到 `fan`\n\n\
  ![tip](img/tip.png) 每次编辑都有一个成本，列文斯坦将每次转换的定义为 1。然而，取决于你如何应用算法，你可以为删除、插入和替换设置不同的成本。例如，在搜索相似的街道名称时，拼写错误比字母本身的差异更常见，因此替换的成本可能只有\
  \ 1，而删除或插入的成本可能为 2。另一方面，在寻找金额时，相似的值很可能具有不同的位数。有人可能会向数据库中输入 $123 或 $123.00。数字是相同的，但数字的数量不同，因此插入和删除的成本可能比替换低（$124\
  \ 的值与 $123 的值并不相同，因此将 3 替换为 4 的成本应该更高）。\n\n可以将计数算法实现为递归或迭代。然而，使用自底向上的动态规划解决方案运行速度快得多，正如\
  \ Robert A. Wagner 和 Michael J. Fischer 在 1974 年的论文《字符串到字符串的修正问题》中所描述的那样（[`http://www.inrg.csie.ntu.edu.tw/algorithm2014/homework/Wagner-74.pdf`](http://www.inrg.csie.ntu.edu.tw/algorithm2014/homework/Wagner-74.pdf)）。该解决方案的时间复杂度为\
  \ `O(mn)`，其中 `n` 和 `m` 是所比较的两个单词的字母长度。以下代码使用矩阵的动态规划计算将单词 *Saturday* 转换为 *Sunday*\
  \ 所需的更改（参见图 16-2]来存储之前的的结果（自底向上的方法）。你可以在 Dummies 网站上的 A4D; 16; Levenshtein.ipynb\
  \ 文件找到此代码，它是下载代码的一部分；详情见引言）。\n\n```python\nimport numpy as np\nimport pandas as\
  \ pd\n\ns1 = 'Saturday'\ns2 = 'Sunday'\nm = len(s1)\nn = len(s2)\nD = np.zeros((m+1,n+1))\n\
  D[0,:] = list(range(n+1))\nD[:,0] = list(range(m+1))\nfor j in range(1, n+1):\n\
  \    for i in range(1, m+1):\n        if s1[i-1] == s2[j-1]:\n            D[i, j]\
  \ = D[i-1, j-1]\n        else:\n            D[i, j] = np.min([\n               \
  \ D[i-1, j] + 1, # a deletion\n                D[i, j-1] + 1, # an insertion\n \
  \               D[i-1, j-1] + 1 # a substitution\n            ])\nprint ('Levenshtein\
  \ distance is %i' % D[-1,-1])\n```\n\n\n\n\n你可以在意想不到的日常工具中发现随机化的应用。Roomba 扫地机器人（由马萨诸塞理工学院\
  \ [MIT] 创建的公司设计）在清洁房间时不需要精确的计划和区域蓝图。该工具在大多数时间内通过在房间内随机游荡工作，根据原始专利，在撞到障碍物后会随机旋转若干度，并从新方向开始移动。然而，Roomba\
  \ 总是能完成清洁任务。（如果你好奇它是如何运行的，可以参考 [`http://www.explainthatstuff.com/how-roomba-works.html`](http://www.explainthatstuff.com/how-roomba-works.html)。）\n\
  \n从历史角度来看，随机化算法是一项近期的创新，因为第一类算法——最近点对算法（用于在几何平面上的许多点中确定距离最近的一对点，而无需比较所有点）是由 Michael\
  \ Rabin 在 1976 年开发的。紧随该第一种算法之后，Robert M. Solovay 和 Volker Strassen 在次年开发了随机素数性测试（一种用于判断一个数是合数还是可能的质数的算法）。不久后，密码学和分布式计算中的应用使随机化更加流行并成为密集研究的主题，尽管该领域仍然很新颖且未经开发。\n\
  \n随机化通过用时间换取复杂度，使得寻找解决方案变得更加简单。简化任务并不是它的唯一优势：随机化节省了资源，并以分布式方式运行，减少了对通信和协调的需求。本章向你介绍理解如何通过增加算法随机性来帮助解决问题所需的信息（本章使用了\
  \ `injecting randomness` 这一术语，就像一种治疗方法一样）。后续章节还有更多应用，因此本章还讨论了概率基础知识、概率分布和蒙特卡洛模拟等关键课题。\n\
  \n## 定义随机化的工作原理\n\n随机化依赖于计算机生成随机数的能力，这意味着在没有计划的情况下创建数字。因此，随机数是不可预测的，当你生成随后的随机数时，它们不应该相互关联。\n\
  \n![remember](img/remember.png) 然而，随机性很难实现。即使当你掷骰子时，结果也不可能是完全出乎意料的，这取决于你握骰子的方式、掷的方式以及骰子形状并不完美。计算机也不擅长创建随机数。它们通过使用算法或伪随机表（通过使用一个\
  \ `seed` 值作为起点，一个等同于索引的数字）来生成随机性，因为计算机无法创建真正的随机数。计算机是确定性机器；其内部的一切都响应于一个定义良好的响应模式，这意味着它以某种方式模仿了随机性。\n\
  \n### 思考为什么需要随机化\n\n即使计算机无法创建真正的随机性，伪随机数流（看起来是随机的但以某种方式预先确定的数字）仍然可以在许多计算机科学问题中产生影响。任何在逻辑中使用随机性的算法都可以表现为随机化算法，无论随机性是决定了其结果、改进了其性能，还是通过在某些情况下提供解决方案来降低失败风险。\n\
  \n通常，你会发现随机性被用于选择输入数据、优化的起点，或应用于数据上的操作数量和种类。当随机化成为算法逻辑的核心部分而不仅仅是性能的辅助手段时，算法的预期运行时间甚至其结果也可能变得不确定并受随机性影响；例如，一个算法在每次运行期间可能会提供不同但同样优质的结果。因此，区分不同类型的随机解决方案是有帮助的，每种方案都以标志性的赌博地点命名：\n\
  \n*   **拉斯维加斯 (Las Vegas)：** 这些算法的特点是使用随机输入或资源每次都提供正确的问题答案。由于其随机程序，获得结果可能需要不确定的时间。一个例子是快速排序（Quicksort）算法。\n\
  *   **蒙特卡洛 (Monte Carlo)：** 由于使用了随机性，蒙特卡洛算法可能不提供正确答案，甚至完全不提供答案，尽管这些结果很少发生。由于结果是不确定的，它们运行时间中的最大尝试次数可能会限制它们。蒙特卡洛算法证明了算法并不总是能成功解决它们本应该解决的问题。一个例子是\
  \ Solovay–Strassen 素数性测试。\n*   **大西洋城 (Atlantic City)：** 这些算法在多项式时间内运行，并在至少在 75%\
  \ 的时间内提供正确的问题答案。蒙特卡洛算法总是是快速的，但不总是正确的；而拉斯维加斯算法总是是正确的，但不总是快速的。因此，人们认为大西洋城算法处于两者之间，因为它们通常既既快又准确。这一类算法由\
  \ J. Finn 在 1982 年在一篇名为 `Comparison of Probabilistic Test for Primality.` 的未发表手稿中引入。它是为了测试质数的理论原因而创建的，这类算法包含了难以设计的解决方案，因此今天这类算法寥寥几。\n\
  \n### 理解概率如何运作\n\n概率告诉你事件发生的可能性，你通常将其用一个数字表示。在书中以及广义的概率研究领域，事件的概率测量范围在 0（事件发生的概率为零）到\
  \ 1（事件发生的确定性）之间。中间值（如 0.25 或 0.75）表示在可能导致该事件的条件（称为 `trials`）下，事件将以一定的频率发生。即使 0 到\
  \ 1 的数值范围起初看起来并不直观，但随着时间的推移，处理概率使得使用这种范围的原因变得更容易理解。当一个事件以 0.25 的概率发生时，你知道在 100 次试验中，该事件将发生\
  \ `0.25 * 100 = 25` 次。\n\n例如，当你喜欢的运动队获胜的概率为 0.75 时，你可以使用这个数字来确定你的球队与另一队比赛时的成功率。你甚至可以获得更具体的信息，例如赢得某个锦赛的概率（你的球队赢得该锦赛比赛的概率为\
  \ 0.65），或根据另一个事件条件的概率（当客场时，你球队的获胜概率下降到 0.60）。\n\n概率可以告诉你关于事件的很多信息，对算法也有帮助。在随机算法方法中，你可能会想知道何时停止算法，因为它应该已经找到了解决方案。在放弃之前，知道需要寻找多久解决方案是有用的。概率可以帮助你确定可能需要多少迭代。第\
  \ 18 章对 2-可满足性（o 2-SAT）算法的讨论提供了一个使用概率作为算法停止规则的运行示例。\n\n\n\n\n\n![remember](img/remember.png)\
  \ 你在体育和经济领域经常听到以百分比形式表示的概率，它告诉你某个事件在 100 次试验后会发生多少次。无论你将其表示为 `0.25` 还是 `25`%，其概率是完全相同的。这仅仅是惯俗问题。在赌博中，你甚至会听到赔率（odds），这是表示概率的另一种方式，它将事件发生的概率（例如，某匹马赢得比赛）与事件不发生的概率进行比较。在这种情况下，你将\
  \ `0.25` 表示为 `25` 比 `75`，或者任何其他产生相同比例的表达。\n\n你可以将多次试验的概率相乘，得到事件发生的估计次数，但通过反向操作，你可以经验性地估计概率。进行一定次数的试验，观察每次试验，并统计事件发生的次数。发生次数与试验次数之比就是你的概率估计值。例如，`0.25`\
  \ 是从扑牌中随机抽取一张牌时抽到特定花色的概率。法国扑牌（最广泛使用的牌组；也出现在美国和英国）是解释概率的经典示例。（例如，意大利人、德国人和瑞士人使用不同花色的牌组，你可以在\
  \ [`http://healthy.uwaterloo.ca/museum/VirtualExhibits/Playing%20Cards/decks/index.html`](http://healthy.uwaterloo.ca/museum/VirtualExhibits/Playing%20Cards/decks/index.html)\
  \ 中阅读相关内容。）牌组包含 52 张牌，平均分布在四个花色中：梅花和黑片是黑色的，方片和红心是红色的。如果你想确定抽到王的概率，你必须考虑通过从牌组中抽牌，你会观察到四张王。你抽牌的试验次数为\
  \ `52`（牌数），因此从概率角度来看答案是 `4/52 = 0.077`。\n\n![tip](img/tip.png) 通过增加试验次数，你可以获得更可靠的经验概率估计。当使用的试验次数较少时，由于偶然的影响，你可能无法获得事件概率的正确估计。随着试验次数的增加，事件观测结果将接近事件本身的真实概率。其原理是事件背后有一个生成过程。要理解该生成过程如何工作，你需要许多试验。这种使用试验的方法被称为从概率分布中进行\
  \ `sampling`（采样）。\n\n### 理解分布\n\n概率分布是另一个对于构建更好算法的重要概念。`distribution`（分布）是一个数值值表或数学函数，它将输入的每个可能值与这些值发生的概率联系起来。概率分布通常（但不仅限于）用图表表示，其横轴表示输入的可能值，纵轴表示发生的概率。大多数统计模型都依赖于正态分布，这是一种对称且具有特征钟形形状的分布。在\
  \ Python 中表示正态分布（如图 17-1 所示）需要几行代码。（你可以在 Dummies 网站上的 A4D；17；`Probability.ipynb`\
  \ 文件中找到这些代码，它是可下载代码的一部分；详见引言。）\n\n```python\nimport numpy as np\nfrom numpy.random\
  \ import normal, uniform\nimport matplotlib.pyplot as plt\n%matplotlib inline\n\n\
  normal_distribution = normal(size=10000) * 25 + 100\nweights = np.ones_like(normal_distribution)\
  \ / len(normal_distribution)\nplt.hist(normal_distribution, bins=20, weights=weights)\n\
  plt.xlabel(\"Value\")\nplt.ylabel(\"Probability\")\nplt.show()\n```\n\n![image](img/9781119330493-fg1701.png)\n\
  \nFIGURE 17-1: 正态分布的直方图。\n\n绘制的分布代表 10,000 个数字的输入，其平均值约为 100。直方图中的每个柱条代表某个值范围出现在输入中的概率。如果你将所有柱条相加，得到值\
  \ 1，它包含了分布表示的所有概率。\n\n在正态分布中，大多数数值都围绕平均值。因此，如果你从输入中随机选取一个数字，你最可能得到一个分布中心附近的数字。然而，虽然概率较低，你也可能抽取一个远离中心的数字。如果你的算法使用平均值比使用任何其他数字效果更好，那么随机选取一个数字是有意义的，并且可能比设计一种从输入中抽取值的更智能的方法要省事得多。\n\
  \n本章提到的另一个重要分布是均匀分布（uniform distribution）。你也可以用一些 Python 代码表示它（输出也出现在图 17-2）：\n\n\
  ```python\nuniform_distribution = uniform(size=10000) * 100\nweights = np.ones_like(uniform_distribution)\
  \ / len(uniform_distribution)\nplt.hist(uniform_distribution, bins=20, weights=weights)\n\
  plt.xlabel(\"Value\")\nplt.ylabel(\"Probability\")\nplt.show()\n```\n\n![image](img/9781119330493-fg1702.png)\n\
  \nFIGURE 17-2: 均匀分布的直方图。\n\n均匀分布与正态分布明显不同，因为每个数字出现的概率相同。因此，直方图的柱条大小相似，在均匀分布中选取数字意味着赋予所有数字相同的概率。不仅仅是初始分布很重要，你还可以利用随着算法进行而变化的。由于算法需要数值输入，了解它们的分布可以帮助它们运行得更智能。作为改变分布改进算法的示例，以下代码展示了如何通过随机选择在法国牌组中猜牌：\n\
  \n```python\nnumbers = ['Ace','2','3','4','5','6','7','8','9','10','Jack','Queen','King']\n\
  seeds = ['Clubs','Spades','Diamonds','Hearts']\ndeck = [s+'_'+n for n in numbers\
  \ for s in seeds]\nfrom random import choice\nmy_cards = deck.copy()\nguessed =\
  \ 0\nfor card in deck:\n    if card == choice(my_cards):\n        guessed += 1\n\
  print('Guessed %i card(s)' % guessed)\n```\n\n这种策略的结果很少，平均而言，你在 52 次试验中只能猜中一张牌。事实上，对于每次试验，你猜对牌的概率都是\
  \ `1/52`，在选取所有牌后总和为 1：`(1/52) * 52 = 1\\`。相反，你可以通过从可能的选择中排除已过的牌来改变这种简单的随机算法：\n\n\
  ```python\nfrom random import choice\nmy_cards = deck.copy()\nguessed = 0\nfor card\
  \ in deck:\n    if card == choice(my_cards):\n        guessed += 1\n    else:\n\
  \        my_cards.pop(my_cards.index(card))\nprint('Guessed %i card(s)' % guessed)\n\
  ```\n\n现在，平均而言，你猜中正确牌的概率更高，因为随着牌组减少，你的猜测概率会增加，在游戏接近时更有可能猜对。（你的概率是 1 除以牌组中剩余的牌数）。\n\
  \n\n\n\n\n![tip](img/tip.png) 算牌可以在扑牌游戏中提供优势。一组麻省理工学院的学生曾利用算牌和概率估计在拉斯维加赢得了巨额财富，直到这种做法在赌场被禁止。这个故事甚至启发了\
  \ 2008 年一部名为*《21>*的电影，由凯文·斯派西基主演。你可以在这里阅读更多关于该故事：[`http://www.bbc.com/news/magazine-27519748`](http://www.bbc.com/news/magazine-27519748)。\n\
  \n### 模拟蒙特卡洛方法的使用\n\n除了本章之前讨论的操作外，计算概率已超出本书的范围。理解一个包含随机性的算法是如何运作的并非易事，即使你知道如何计算概率，因为这可能是许多不同概率分布混合的结果。然而，对蒙特卡洛方法的讨论为最复杂算法的结果提供了启发，并帮助你理解它们是如何工作的。这种方法被应用于数学和物理，用于解决许多问题。例如，恩里科·费米（Enrico\
  \ Fermi）和爱德华·泰勒（Edward Teller）等科学家在曼哈顿计划（二世界大战期间开发原子弹）期间利用特制的超级计算机进行蒙特卡洛模拟来加速他们的实验。你可以在这里阅读更多关于这种用法：[`http://www.atomicheritage.org/history/computing-and-manhattan-project`](http://www.atomicheritage.org/history/computing-and-manhattan-project)。\n\
  \n![remember](img/remember.png) 不要将蒙特卡洛方法与蒙特卡洛算法混淆。蒙特卡洛方法是一种理解概率分布如何影响问题的方法，而如之前讨论过的，蒙特卡洛算法是一种不保证达到解决方案的随机算法。\n\
  \n在蒙特卡洛模拟中，你对算法结果进行采样。你存储一定数量的结果，然后计算统计数据（如平均值），并将其可视化为分布。例如，如果你想更好地理解减小抽牌牌组的大小如何帮助你获得更好的结果（如上一个\
  \ Python 脚本所示），你可以迭代算法几次并记录成功率：\n\n```\nimport numpy as np\nsamples = list()\nfor\
  \ trial in range(1000):\n    my_cards = deck.copy()\n    guessed = 0\n    for card\
  \ in deck:\n        if card == choice(my_cards):\n            guessed += 1\n   \
  \     else:\n            my_cards.pop(my_cards.index(card))\n    samples.append(guessed)\n\
  ```\n\n运行蒙特卡洛模拟可能需要几秒钟。所需的时间取决于算法的速度、问题的规模以及试验次数。然而，当从分布中采样时，试验次数越多，结果越稳定。这个示例执行了\
  \ 1000 次试验。你可以使用以下代码对预期结果进行估计和可视化（参见图 17-3）：\n\n```\nplt.hist(samples, bins=8)\n\
  plt.xlabel(\"Guesses\")\nplt.ylabel(\"Frequency\")\nplt.show()\nprint ('On average\
  \ you can expect %0.2f guesses each run' % np.mean(samples))\n```\n\n平均而言，你可以预计每次运行\
  \ 3.15 次猜测\n\n![image](img/9781119330493-fg1703.png)\n\nFIGURE 17-3: 显示蒙特卡洛模拟的结果。\n\
  \n观察生成的直方图，你可以确定在 1000 次试验中，大约有 300 次运行的结果是三次，这使得三次成为概率最高事件。有趣的是，你从未获得过为零的结果，但得到七次或更多命中也很罕见。本章后面的示例将使用蒙特卡洛模拟来理解更复杂的随机算法是如何运作的。\n\
  \n## 在逻辑中引入随机性\n\n以下是在算法逻辑中包含随机性的许多原因中的几个：\n\n*   它让算法运行得更好，并提供更智能的解决方案。\n*   在内存和计算方面，它需要的资源更少。\n\
  *   它创建了具有分布式输出且几乎或没有监督的算法。\n\n在专门介绍局部搜索的下一章，你将看到当难以确定算法应该采取哪个方向时，随机化和概率如何证明是有帮助。后续章节中的示例演示了随机化如何帮助快速找到数据输入中特定位置的值，以及依赖随机性如何加速排序。\n\
  \n### 使用 Quickselect 计算中位数\n\n在处理未排序的输入列表时，计算统计量——中位数可能证明是具有挑战性的。事实上，中位数取决于数据在排序后的位置：\n\
  \n*   如果输入数据的元素个数为奇数，中位数恰好是中间值。\n*   如果输入数据的元素个数为偶数，中位数是有序输入列表中两个中间数字的平均值。\n\n![remember](img/remember.png)\
  \ 中位数类似于平均值，是一个可以代表值分布的单一值。中位数基于输入向量的元素顺序，受列表中存在的值的影响很小。它仅仅是中间值。相反，当输入头部和末尾的值极小时，这些的值会影响平均值。\n\
  \n```python\nfrom random import randint, choice\nimport numpy as np\nimport sys\n\
  \nsys.setrecursionlimit(1500)\nn = 501\nseries = [randint(1,25) for i in range(n)]\n\
  print ('Median is %0.2f' % np.median(series))\n# Median is 14.0\nprint ('251st element\
  \ of ordered series is %0.1f' % sorted(series)[250])\n# 251st element of ordered\
  \ series is 14.0\n```\n\n\n\n\n\n```python\nleft, right = list(),list()\n\nfor item\
  \ in series:\n    if item < pivot:\n        left.append(item)\n    if item > pivot:\n\
  \        right.append(item)\nlength_left = len(left)\nif length_left > k:\n    return\
  \ quickselect(left, k)\nk -= length_left\nduplicates = len(series) - (length_left\
  \ + len(right))\nif duplicates > k:\n    return float(pivot)\nk -= duplicates\n\
  return quickselect(right, k)\n```\n\n`quickselect(series, 250)`\n\n`14.0`\n\n该算法之所以运行良好，是因为它不断减小问题规模。当随机取的基准值接近第\
  \ $k$ 个位置时，效果最好（停止规则是基准值恰等于第 $k$ 个位置的值）。遗憾的是，由于你无法在无序列表中知道第 $k$ 个位置，使用均匀分布进行随机抽取（列表中的每个元素被中的概率相同）是最佳解决方案，因为算法最终会找到正确答案。即使随机机会对算法不利，算法也会继续缩小问题，从而获得更多找到解的机会，正如本早期提到的猜测扑牌中随机抽取的牌所示。随着牌组变小，猜测答案变得越来越容易。以下代码展示了如何使用\
  \ Quickselect 来确定一组数字的中位数：\n\n```python\ndef median(series):\n    if len(series)\
  \ % 2 != 0:\n        return quickselect(series, len(series)//2)\n    else:\n   \
  \     left = quickselect(series, (len(series)-1) // 2)\n        right = quickselect(series,\
  \ (len(series)+1) // 2)\n        return (left + right) / 2\n```\n\n`median(series)`\n\
  \n`14.0`\n\n## 使用蒙特卡洛进行模拟\n\n作为理解 Quickselect 算法的一部分，了解它的内部原理是有价值的。通过在 `quickselect`\
  \ 函数内部设置计数器，你可以使用蒙特卡洛模拟检查不同条件下的性能：\n\n```python\ndef quickselect(series, k, counter=0):\n\
  \    pivot = choice(series)\n    left, right = list(),list()\n    for item in series:\n\
  \        if item < pivot:\n            left.append(item)\n        if item > pivot:\n\
  \            right.append(item)\n    counter += len(series)\n    length_left = len(left)\n\
  \    if length_left > k:\n        return quickselect(left, k, counter)\n    k -=\
  \ length_left\n    duplicates = series.count(pivot)\n    if duplicates > k:\n  \
  \      return float(pivot), counter\n    k -= duplicates\n    return quickselect(right,\
  \ k, counter)\n```\n\n第一个实验尝试确定算法平均找到包含 1001 个数字的输入列表的中位数需要多少次操作：\n\n```python\n\
  results = list()\nfor run in range(1000):\n    n = 1001\n    series = [randint(1,25)\
  \ for i in range(n)]\n    median,count = quickselect(series, n//2)\n    assert(median==np.median(series))\n\
  \    results.append(count)\nprint (\"Mean operations: %i\" % np.mean(results))\n\
  ```\n\n`Mean operations: 2764`\n\n将结果显示在直方图上（参见图 17-4）可以看出，算法的计算量是输入规模的两到四倍之间，其中三倍是最可能的计算次数。\n\
  \n```python\nimport matplotlib.pyplot as plt\n%matplotlib inline\nplt.hist(results,\
  \ bins='auto')\nplt.xlabel(\"Computations\")\nplt.ylabel(\"Frequency\")\nplt.show()\n\
  ```\n\n![image](img/9781119330493-fg1704.png)\n\n图 17-4： 显示 Quickselect 的蒙特卡洛模拟结果。\n\
  \n如果平均所需时间大约是输入规模的三倍，那么 Quickselect 提供了良好的性能。然而，你可能会好奇当输入规模增大时，输入与计算量之间的比例是否会保持。正如研究\
  \ NP 完全问题时所示，许多问题在输入规模增长时会发生爆炸性增长。你可以通过在之前的模拟之上使用另一个蒙特卡洛模拟并绘制输出来证明这一理论，如图 17-5 所示。\n\
  \n```python\ninput_size = [501, 1001, 5001, 10001, 20001, 50001]\ncomputations =\
  \ list()\nfor n in input_size:\n    results = list()\n    for run in range(1000):\n\
  \        series = [randint(1, 25) for i in range(n)]\n        median,count = quickselect(series,\
  \ n//2)\n        assert(median==np.median(series))\n    computations.append(np.mean(results))\n\
  \nplt.plot(input_size, computations)\nplt.xlabel(\"Input size\")\nplt.ylabel(\"\
  Number of operations\")\nplt.show()\n```\n\n\n\n\n\n![check](img/check.png) # 使用局部搜索和随机化求解\
  \ 2-SAT 问题\n\n![check](img/check.png) # 发现你有很多技巧可以应用于局部搜索\n\n在处理 NP-hard 型问题时（即没有已知解决方案的运行复杂度低于指数级的问题，请参见第\
  \ 15 章中关于 NP 完全性的理论讨论），你有几个值得尝试的替代方案。根据 `NP-类`问题需要某种折协（例如接受部分或非最优结果）的观点，以下选项为这一原本棘手的问题提供了解决方案：\n\
  \n*   识别特殊情况，使得你可以使用精确方法或贪心算法在多项式时间内高效解决问题。这种方法简化了问题并限制了尝试的解组合数量。\n*   采用动态规划技术（在第\
  \ 16 章中描述），这些技术可以改进暴力搜索并降低问题的复杂度。\n*   折协并勾勒出近似算法，以找到部分的、接近最优的解。当你对部分解满意时，就可以缩短算法的运行时间。近似算法可以是：\n\
  \    *   贪心算法（在第 15 章中讨论过）\n    *   使用随机化或其他启发式技术进行局部搜索（本章的主题）\n    *   线性规划（第 19\
  \ 章的主题）\n*   选择一种在实践中对你的问题有效的启发式或元启发式（一种帮助你决定使用哪种启发式的启发式）。然而，它没有理论保证，且往往倾向于经验性。\n\
  \n## 理解局部搜索\n\n`local search` 是一种解决问题的通用方法，包含了大量算法，它将帮助你逃避许多 `NP` 问题的指数复杂度。局部搜索从一个不完美的解决方案开始，一步步远离它。它根据随机选择或敏锐的启发式方法（不涉及精确方法）确定邻近解的可行性，从而可能导致完美解决方案的产生。\n\
  \n![remember](img/remember.png) `heuristic`（启发式）是对解决方案的一种教育推测，例如一种指向预期结果方向的经验法则，但不能具体说明如何到达它。这就像迷失在一个未知的城市中，人们告诉你向某个方向走以到达酒店（但没有精确的指令），或者只是告诉你离酒店有多远。某些局部搜索解决方案使用了启发式，因此你会在本章中发现它们。第\
  \ 20 章深入介绍了使用启发式执行实际任务的完整细节。\n\n你无法保证局部搜索一定会得到解决方案，但当你为搜索提供足够的时间运行计算时，你的机会会从起点得到提高。它只在无法找到任何进一步改进已得解的方法后才会停止。\n\
  \n### 了解邻域\n\n局部搜索算法从初始解开始迭代改进，一步步在邻域解中移动，直到无法进一步改进解为止。由于局部搜索算法像贪心算法一样简单直观，因此为算法问题设计局部搜索方法并不困难。关键在于定义正确的步骤：\n\
  \n1.  从现有的解开始（通常是随机解或来自另一个算法的解）。\n2.  在当前解的邻域内搜索一组可能的新解，这构成了候选列表。\n3.  根据接受候选列表作为输入的启发式输出，决定使用哪个解来代替当前解。\n\
  4.  继续执行第 2 步和第 3 步，直到你看到解没有进一步的改进，这意味着你已经拥有可用的最佳解。\n\n![remember](img/remember.png)\
  \ 虽然设计简单，局部搜索解决方案可能无法在合理时间内找到解（你可以停止过程并使用当前解），或者产生最小质量的解。你可以采用一些行业技巧来确保获得这种方法的最大效处。\n\
  \n在局部搜索开始时，你选择一个初始解。如果你决定使用随机解，那么将搜索封装在重复迭代中是有帮助的，在迭代中你生成不同的随机起始解。有时，得到一个良好的最终解取决于起点。如果你从一个待精化的现有解开始，将该解插入贪心算法中可能证明在拟合一个生成耗时不过长的解方面是一个很好的折协。\n\
  \n在选择了起点点后，定义邻域并确定其大小。定义邻域需要弄清楚你可以对解施加的最小变化。如果解是一组元素，那么所有邻域解都是其中一个元素发生变变的集合。例如，在旅行箱问题（`TSP`）中，邻域解可能涉及改变两个（或更多）行程的终点城市，如图图\
  \ 18-1](#26_9781119330493-ch18.xhtml_c18-fig-0001）所示。\n\n![image](img/9781119330493-fg1801.png)\n\
  \n图 18-1： 切换 TSP 中的行程可能会带来更好的结果。\n\n## 介绍局部搜索技巧\n\n局部搜索跟踪当前解并一步步移动到邻域解，直到找到解决方案（或无法改进当前解）。在处理\
  \ `NP-hard` 问题时，它具有一些关键优势，因为它\n\n*   设计和执行非常简单\n\n\n\n\n\n*   消耗内存和计算机资源较少（但搜索需要运行时间）\n\
  *   当从一个不完美的解决方案开始时，可以找到可以接受甚至是良好的解决方案（邻接解决方案应该形成一条通往最终解决方案的路径）\n\n![tip](img/tip.png)\
  \ 你可以将局部搜索所解决的问题视为一个互连解决方案的图。该算法遍历该图，在节点与节点之间移动，寻找满足任务要求的节点。从这个角度来看，局部搜索利用了图探索算法，例如深度优先搜索（`DFS`）或广度优先搜索（`BFS`），这两者在第\
  \ 9 章中都得到了讨论。\n\n局部搜索为寻找 NP 困难问题的接受解决方案提供了可行的方法。然而，如果没有正确的启发式，它无法正常工作。随机化可以与局部搜索很好结合，它通过以下方式提供帮助：\n\
  \n*   **随机采样：** 生成用于开始的解决方案。\n*   **随机游走：** 选择一个与当前解决方案相邻的随机解决方案。（你在本章后面的“使用随机化求解\
  \ 2-SAT”部分中可以找到更多关于随机游走的知识。）\n\n随机化并不是唯一的可用启发式。局部搜索可以依靠对解决方案进行更理性的探索，使用目标函数来获取方向（如爬山优化），并避免平庸解决方案的陷阱（如模拟退火和`Tabu\
  \ Search`）。`objective function`是一种计算，可以通过输出分数来评估你的解决方案的质量。如果你在爬山过程中需要更高的分数，那么就是一个最大化问题；如果你在寻找更小的分数，那么就是一个最小化问题。\n\
  \n### 用八皇后问题解释爬山算法\n\n你可以很容易地找到局部搜索所采用技术的类比，因为许多现象都意味着从一种情况到另一种情况的逐渐过渡。局部搜索不仅是算法专家设计的一种技术，它实际上是你在自然界和社会中都能看到的现象。例如，在社会和科学中，你可以将创新视为在当前可用技术中对下一步的局部搜索：[`https://www.technologyreview.com/s/603366/mathematical-model-reveals-the-patterns-of-how-innovations-arise/`](https://www.technologyreview.com/s/603366/mathematical-model-reveals-the-patterns-of-how-innovations-arise/)。许多启发式方法源于物理世界，灵感来自重力、金属融合、动物\
  \ DNA 的进化以及蚂蚁、蜜蜂和萤火虫群的行为（位于[`https://arxiv.org/pdf/1003.1464.pdf`](https://arxiv.org/pdf/1003.1464.pdf）的论文解释了\
  \ Lévy 萤火虫算法）。\n\n爬山算法的灵感来自重力。它依赖于一种观察：当球向山谷滚动时，它会沿着最陡的路径下降；当它爬山时，它倾向于采取最直接的向上方向到达顶峰。逐渐地，一步一个，无论是向上还是向下，球都会到达它的目的地，在那里无法更高或更低。\n\
  \n在局部搜索中，你可以使用`objective function`成功地模拟相同的程序，这是一种评估邻接解决方案并确定哪一个能改进当前解决方案的测量方法。使用爬山的类比，拥有目标函数就像感受地形的倾斜并确定下一个最佳移动。从当前位置开始，登山者评估每个方向以确定地形的坡度。当目标是到达顶部时，登山者选择向上坡度最大的方向到达顶顶。然而，这只是理想情况；登山者在爬山过程中经常会遇到问题，必须使用其他解决方案绕过它们。\n\
  \n`objective function`类似于贪心准则（参见第 5 章）。它相对于最终目标是盲目的，因此它可以确定方向，但无法检测障碍。考虑爬山时盲目带来的影响——很难说登山者何时到达山顶。缺乏任何向上移动机会的平坦地形可能表明登山者已到达山顶。不幸的是，一个平坦的地方也可能是一个平原、一个转折点，甚至是登山者恰好掉进去的洞。你无法确定，因为登山者看不见。\n\
  \n当使用由爬山启发式引导的局部搜索时，也会发生相同的问题：它追求不断改进的邻接解决方案，直到无法通过检查当前解决方案周围的解决方案来找到更好的解决方案。此时，算法宣布它找到了解决方案。它还说它找到了全局解决方案，尽管如图\
  \ 18-2 所示，它可能仅仅发现了一个局部`maximum`，一个在周围最好的解决方案，因为它被更差的解决方案包围。通过进一步的探索仍然可能找到更好的解决方案。\n\
  \n![image](img/9781119330493-fg1802.png)\n\n图 18-2: 局部搜索通过爬山算法探索景观。\n\n![tip](img/tip.png)\
  \ 这是一个真正的 NP 困难问题。如果你要在 8x8 的棋盘上放置 8 个皇后，有 4,426,165,368 种不同的放置方法，但只有 92 种配置可以解决问题。显然，你不能通过暴力破解或运气来解决这个问题。局部搜索通过非常简单的方法解决这个问题：\n\
  \n1. 放置皇后\n2. 通过在每列中向上或向下移动评估下一组解决方案。这需要`2^n` 次移动。\n3. 确定之后有多少皇后相互攻击。\n4. 确定哪个解决方案相互攻击最少，并使用该解决方案进行下次迭代。\n\
  5. 执行步骤 4 和 5 直到找到解决方案。\n\n不幸的是，这种方法只有 14% 的情况下有效，因为它在 86% 的时间内陷入了无法进行任何改进的棋盘配置中（对于所有可用的`2^n`\
  \ 次移动，受攻击皇后的数量都不会减少）。离开这种困境的唯一方法是通过在棋盘上选择另一个随机配置来重新开始局部搜索。图 18-3 显示了一个成功的解决方案。\n\
  \n![image](img/9781119330493-fg1803.png)\n\n八皇后问题已解决。\n\n尽管有这个缺点，爬山算法也被广泛使用，特别是在人工智能和机器学习中。识别声音或图像、支持移动手机以及驱动自动驾驶汽车的神经网络主要依赖于一种称为`梯度下降`的爬山优化。随机启动和爬山过程中的随机注入使得逃离任何局部解决方案并到达全局最大值成为可能。模拟退火和`Tabu\
  \ Search`都是爬山上随机决策的明智方法。\n\n### 发现模拟退火\n\n\n\n\n\n在搜索的某个时刻，如果你的目标函数停止为你提供正确的指示，你可以使用另一种启发式方法来控制局面，并尝试寻找通往更好任务解决方案的路径。这就是模拟退火和禁忌搜索的工作原理：它们在需要时为你提供紧急出口。\n\
  \n模拟退火的名字源于冶金中的一种技术，将金属加热到高温，然后缓慢冷却以软化金属以便进行冷加工并消除内部晶体缺陷（关于这种金属加工过程的细节，请参阅[`http://www.brighthubengineering.com/manufacturing-technology/30476-what-is-heat-treatment/`](http://www.brighthubengineering.com/manufacturing-technology/30476-what-is-heat-treatment/)）。局部搜索通过将解决方案搜索视为一个为了提高加工性而变化的原子结构，复制了这一想法。温度是优化过程中的关键变量。就像高温使材料结构松弛一样（固体在高温下熔化，液体在高温下蒸发），局部搜索算法中的高温也会导致目标函数的松弛，允许它倾向于更差的解而非更好的解。模拟退火修改了爬山算法，保留了用于评估邻域解的目标函数，但允许它以不同的方式确定搜索解的选择：\n\
  \n1. 获取一个以概率表示的温度。（吉布斯-玻尔兹曼物理函数是一个将温度转换为概率的公式。关于该函数的解释超出了本书的范围，但你可以在此处进行探索：[`http://www.iue.tuwien.ac.at/phd/binder/node87.html`](http://www.iue.tuwien.ac.at/phd/binder/node87.html)。）\n\
  \n2. 设置温度调度。随着时间的推移和搜索的运行，温度按速率下降。\n\n3. 定义初始解（使用随机采样或其他算法）并开始循环。随着循环的进行，温度降低。\n\
  \n4. 温度为零时停止优化。\n\n5. 将当前结果作为解决方案。\n\n此时，你必须对解决方案进行迭代搜索。在之前的迭代的每一步（步骤 3 和步骤 4 之间），执行以下操作：\n\
  \n1. 列出邻域解并随机选择一个。\n\n2. 当邻域解比当前解更好时，将邻域解设置为当前解。\n\n3. 否则，根据与实际温度相关的阈值概率在 0 和 1\
  \ 之间选取一个随机数，并判断它是否小于阈值概率：\n\n    * 如果小于，将邻域解设置为当前解（即使根据目标函数它比当前解差）。\n    * 如果大于，则保留当前解。\n\
  \n模拟退火是改进爬山算法的一种智能方法，因为它避免了搜索停止在局部解上。当温度足够高时，搜索可能会使用随机解并找到通往更优优化的其他途径。由于搜索开始时温度较高，算法有机会向优化中注入随机性。随着温度冷却到零，选择随机解的几变得越来越小，局部搜索将像爬山算法一样进行。例如，在\
  \ TSP（旅行商问题）中，算法通过在高温下挑战当前解来实现模拟退火，具体方法包括：\n\n* 随机选择路径的一段并反反方向遍历它\n* 在路径中更早或更晚访问某个城市，保持其他城市的访问顺序不变\n\
  \n如果结果产生的调整导致路径长度变差，算法将根据模拟退火过程中的温度保留或拒绝这些调整。\n\n### 使用禁忌搜索避免重复\n\nTabu（禁忌）是一个源自波利尼西亚汤加语的古语，意思是某些事物不能触碰，因为它们是神圣的。`tabu`（英语中拼写为\
  \ taboo）从人类学研究进入日常语言，表示被禁止的事。在局部搜索优化中，很容易陷入一个无法提供任何改进的解邻域；也就是说一个看起来是最佳解但离你需要的解很远的局部解。禁忌搜索放宽了某些规则并强制了其他规则，提供了一种离开局部最小值的方法并帮助你达到更好的解。\n\
  \n禁忌搜索启发式方法封装了目标函数并沿着许多邻域解运行。当你因为下一个解无法提高目标而无法继续时，它会干预。当这种情况发生时，禁忌搜索执行以下操作：\n\n\
  * 允许使用几次较差解，以观察离开局部解是否有助于搜索找到通往最佳解的更好路径。\n* 记住搜索尝试过的解并禁止再次使用它们，从而确保搜索不会在局部解周围的相同解之间循环而找不到逃生路线。\n\
  * 通过修改用于存储过去解的队列长度，创建禁忌解的长期或短期记忆。当队列满时，启发式方法会丢弃旧的禁忌解为新解腾出空间。\n\n你可以将禁忌搜索与缓存和记忆化联系（参见第\
  \ 16 章），因为它要求算法跟踪其步骤以节省时间并避免重复使用之前的解。在 TSP 中，当你尝试通过交换两个或多个城市的访问顺序来优化解决方案时，它可以通过避免重复解集提供帮助。\n\
  \n### 解决布尔电路的满足性\n\n作为一个局部搜索工作的实际视角，这个示例深入研究了电路满足性，这是一个经典的 NP 完全问题。它使用了随机化和蒙特卡洛方法。正如第\
  \ 17 章所示，它们对 `True` 和 `False` 条件作为输入并将其转换为不同的输出。\n\n\n\n\n\n图 18-4:逻辑运算符 `AND`、`OR`\
  \ 和 `NOT` 的符号和真值表。\n\n这种逻辑表示是一种`布尔组合电路`，而验证其功能性的测试是`电路可满足性`。在最简单的情况下，电路仅由接受一个导线输入的\
  \ `NOT` 条件（称为`反相器`）和接受两根导线作为输入的 `OR` 条件组成。这是一种二元可满足性（2-SAT）场景，如果算法使用穷举搜索来处理它，最坏需要`2^k`\
  \ 次尝试（`k` 为输入导线的数量）才能找到一组使电流流过整个电路的条件。还存在更复杂的问题版本，每个 `OR` 逻辑门接受更多输入并使用 `AND` 门，但它们超出了本书的范围。\n\
  \n### 使用随机化求解 2-SAT\n\n无论你必须使用布尔表示来测试哪种电子电路，都可以将其渲染为布尔变量向量。你还可以创建另一个向量来包含`clauses`（子句），即电路需要满足条件的集合（例如，导线\
  \ A 和导线 B 都应该为 `True`）。这并不是表示问题的唯一方法；事实上，还有其他涉及图的解决方案。然而，对于这个示例，这两个向量足够了。\n\n你使用多项式时间内的随机局部搜索来解决这个问题。在加利州大学伯克利分校教学的\
  \ Christos H. Papadimitriou 教授（https://people.eecs.berkeley.edu/~christos/）设计了这种名为\
  \ `RandomWalkSAT` 的算法。他在 1991 年于第 32 次 IEEE 计算机科学基础会议论文集上发表的《关于选择满足真值的赋值》中介绍了它。与更有条理的方法相比，该算法具有竞争力，而且它是一个示例性的局部搜索方法，因为它每次只对当前解进行一次更改。它使用两个嵌套循环，一个用于多次尝试起始解，另一个用于随机修改初始随机解。重复外层循环\
  \ `log2` 次（其中 `k` 是导线的数量）。内层循环使用以下步骤：\n\n1.  随机选择一个问题解。\n2.  重复以下步骤 `2*k²` 次：\n\
  \    1.  确定当前解是否正确。当解正确时，跳出所有循环并报告该解。\n    2.  随机选择一个不满足的子句。随机选择其中的一个条件并对其修改。\n\n\
  ### 实现 Python 代码\n\n使用 Python 和 RandomWalkSAT 算法求解 2-SAT 问题，你需要设置几个有用的函数。`create_clauses`\
  \ 和 `signed` 函数分别通过处理 `OR` 和 `NOT` 门帮助生成要解决的电路问题。使用这些函数，你可以指定 `OR` 门的数量并提供一个种子数，以确保你以后可以重建生成的问题（允许你在不同的计算机上多次尝试该问题）。\n\
  \n`create_random_solutions` 函数通过提供一个设置了输入的随机解来提供问题的冷启动。利用随机运气找到正确解的概率微乎其微（二的门数量幂的倒分之一），但平均而言，你可以预期四之三的门被正确设置（因为正如使用\
  \ OR 函数的真值表所示，四个可能的输入中有三个是 `True`）。`check_solution` 函数确定电路何时满足（表示正确的解）。否则，它输出哪些条件未被满足。（你可以在\
  \ Dummies 网站上的 A4D; 18; Local Search.ipynb 文件找到此代码，作为可下载代码的一部分；详情见引言。）\n\n```python\n\
  import numpy as np\nimport random\nfrom math import log2\nimport matplotlib.pyplot\
  \ as plt\n% matplotlib inline\n\ndef signed(v):\n    return v if np.random.random()<0.5\
  \ else -v\n\ndef create_clauses(i, seed=1):\n    np.random.seed(seed)\n    return\
  \ [(signed(np.random.randint(i)), signed(\n    np.random.randint(i))) for j in range(i)]\n\
  \ndef create_random_solution(i, *kwargs):\n    return {j:signed(1)==1 for j in range(i)}\n\
  \ndef check_solution(solution, clauses):\n    violations = list()\n    for k,(a,b)\
  \ in enumerate(clauses):\n        if not (((solution[abs(a)]) == (a>0)) |\n    \
  \    ((solution[abs(b)]) == (b>0))):\n            violations.append(k)\n    return\
  \ violations\n```\n\n设置好这些函数后，你就拥有了求解问题的 `sat2` 函数所需的所有构建块。该解决方案使用了两个嵌套迭代：第一次复制多次起始状态；第二次随机选择不满足的条件并使其变为真。该解决方案在多项式时间内运行。该函数不能保证一定找到解（如果存在的话），但很有可能，当解存在时它会提供一个解。事实上，内部迭代循环对电路进行了\
  \ `2*k²` 次随机尝试，这对于直线上的随机游走通常是足够的。\n\n\n\n\n将解绘制成图表，其中横轴表示步数（解的随机修正），纵轴表示待修复的子句数，你可以验证该算法从长期来看倾向于找到正确解，如图\
  \ 18-5, 'b-')\nplt.xlabel(\"Random adjustments\")\nplt.ylabel(\"Unsatisfied clauses\"\
  )\nplt.grid(True)\nplt.show()\n```\n\n![image](img/9781119330493-fg1805.png)\n\n\
  图 18-5: 随机调整后，未满足的子句数量减少了。\n\n如果你尝试使用具有 1,000 个门电路且种子为 8 的电路，你会发现它似乎永远不会结束。这是因为该电路是不可解的，而且所有的随机选择和尝试需要很长时间。最终，算法将不会为你提供任何解决方案。\n\
  \n### 意识到起点非常重要\n\n尽管 `RandomWalkSAT` 算法的最坏情况下的运行复杂度为 `O(log`[`2`]`k * k`^(`2`)`)`（其中\
  \ `k` 是输入数量），但你仍然可以通过改进起点来加速它。事实上，尽管从随机配置开始意味着平均开始时有四分之一的子句是未满足的，但你仍然通过遍历数据来修复其中许多子句。\n\
  \n子句的问题在于，许多子句需要真输入，而同时，许多子句又需要假输入。当所有子句都要求某个输入为真或假时，你可以将其设置为所需的条件，这会满足大量子句并使解决剩余子句变得更容易。以下新的\
  \ `RandomWalkSAT` 实现包含一个启动阶段，该阶段会立即解决那些所有交互子句都要求输入具有特定真/假设置的情况：\n\n```python\ndef\
  \ better_start(n, clauses):\n    clause_dict = dict()\n    for pair in clauses:\n\
  \        for clause in pair:\n            if abs(clause) in clause_dict:\n     \
  \           clause_dict[abs(clause)].add(clause)\n            else:\n          \
  \      clause_dict[abs(clause)] = {clause}\n    solution = create_random_solution(n)\n\
  \    for clause, value in clause_dict.items():\n        if len(value)==1:\n    \
  \        solution[clause] = value.pop() > 0\n    return solution\n```\n\n该代码定义了一个新的冷启动函数，在生成随机解后，它扫描解并找到所有与单一状态（真或假）关联的输入。通过将它们立即设置为所需的状态，你可以减少需要修改的子句数量，让局部搜索的工作更少并更早完成。\n\
  \n```python\nn = 1000\n# Solvable seeds = 0,1,2,3,4,5,6,9,10\n# Unsolvable seeds\
  \ = 8\nclauses = create_clauses(n, seed=0)\nhistory, solution = sat2(clauses, n,\
  \ start=better_start)\nFound solution in 1 external loops, 393 internal loops\n\
  ```\n\n通过提供这个新的、简化的起点，在绘制结果图后，你可以立即看到改进，因为平均而言完成任务所需的操作更少。\n\n![tip](img/tip.png)\
  \ 在局部搜索中，始终考虑起点的重要性，以便算法能够更早、更成功地完成，如图 18-6 所示。总之，尽可能为你的搜索提供质量最好的起点。\n\n![image](img/9781119330493-fg1806.png)\n\
  \n图 18-6: 执行速度更快，是因为起点更好。\n\n# 第 19 章\n\n# 运用线性规划\n\n## 本章\n\n- ![check](img/check.png)\
  \ **发现如何使用线性规划实现优化**\n- ![check](img/check.png) **将现实世界的问题转化为数学和几何问题**\n- ![check](img/check.png)\
  \ **学习如何使用 Python 解决线性规划问题**\n\n线性规划首次出现在二战期间，当时后勤被证明在地理位置多样的战场上调动数百万士兵、武器和物资是至关重要的。坦克和飞机需要加油和重新装弹，尽管在时间、资源和来自敌人的行动方面存在限制，但这需要巨大的组织努力才能成功。\n\
  \n你可以用数学形式表达这些大多数军事问题。数学家乔治·伯纳德·丹齐（George Bernard Dantzig）受雇于美国空军统计控制办公室，发明了一种使用\
  \ `simplex` 算法解决这些问题的巧妙方法。单纯形法是战后引发人们对数值优化兴趣的核心思想，并催生了前景广阔的线性规划领域。当时第一批计算机出现出现增加了这种兴趣，使得复杂的计算变得可行。\n\
  \n丹齐于 2005 年去世，他开创的领域仍在不断发展中。近年来，与线性规划相关的新想法和方法持续涌现，例如：\n\n- **约束规划：** 将计算机程序中变量之间的关系表示为线性规划中的约束。\n\
  - **遗传算法：** 考虑数学公式可以像 DNA 在进化中一样进行复制和变异以解决问题。遗传算法也出现在第 20 章中，因为它们采用了启发式方法。\n\n本章将帮助你理解线性规划。此外，你将看到如何使用\
  \ Python 作为工具解决现实世界的问题。\n\n## 使用线性函数作为工具\n\n本节展示了如何处理一个问题，即某人将目标（要最大化或最小化的成本、利润或其他数量的表示）和约束条件（源自应用的线性不等式，例如\
  \ 40 小时工作周的限制）转化为线性函数。这个定义听起来可能有点复杂，因为涉及到数学和抽象，但在考虑了什么是函数以及何时判断一个函数是否为线性的之后，情况就会变得清晰。\n\
  \n\n\n线性规划广泛应用于制造、物流、运输（特别是航空业，用于定义路线、时间表和票价）、营销、金融和电信等领域。所有这些应用都要求你在优化可用资源分配并满足所有约束和限制的同时，获得最大的经济效益和最低成本。此外，你还可以将线性规划应用于视频游戏和计算机可视化等常见场景，因为游戏需要处理二维和三维的复杂几何形状，并且你需要判断任何形状是否发生碰撞，并确保它们符合游戏规则。你通过由线性规划支持的凸包算法来实现这些目标（参见\
  \ [`http://www.tcs.fudan.edu.cn/rudolf/Courses/Algorithms/Alg_ss_07w/Webprojects/Chen_hull/applications.htm`](http://www.tcs.fudan.edu.cn/rudolf/Courses/Algorithms/Alg_ss_07w/Webprojects/Chen_hull/applications.htm)）。最后，线性规划也用于搜索引擎中的文档检索问题中；你可以将单词、短语和文档转换为函数，并在寻找具有特定数学特征的文档时，确定如何最大化你的搜索结果（即获取回答查询所需的文档）。\n\
  \n### 掌握所需的数学数学知识\n\n在计算机编程中，函数提供了封装打算多次使用的代码的手段。函数将代码变成一个黑盒，即一个你对其提供输入并期望特定输出的实体。第\
  \ 4 章 讨论了如何在 Python 中创建函数。数学中使用函数的方式与编程类似；它们是一组将某些输入转换为输出的数学运算。输入可以包括一个或多个变量，并根据输入产生唯一的输出。通常一个函数具有如下形式：\n\
  \n```\nf (x) = x*2\n```\n\n*   `f`：确定函数名。它可以是任何内容；你可以使用字母表中的任何字母，甚至可以是一个单词。\n* \
  \  `(x)`：指定输入。在这个示例中，输入是变量 `x`，但你可以使用更多且具有任何复杂性的输入，包括多个变量或矩阵。\n*   `x*2`：定义函数在接收到输入后执行的操作集。结果是数字形式的函数输出。\n\
  \n如果你在这个示例中将输入 `2` 赋值为 `x`，你得到：\n\n```\nf(2) = 4\n```\n\n在数学术语中，通过调用此函数，你将输入 `2`\
  \ 映射到了输出 `4`。\n\n![remember](img/remember.png) 函数可以是简单的也可以是复杂的，但对于你提供的每组输入，每个函数都有且只有一个结果（即使输入是由多个变量组成的）。\n\
  \n线性规划利用函数以数学方式呈现其必须实现的目标，用以解决当前问题。当你将目标转换为数学函数时，问题就转化为确定函数的输入，通过该输入映射到最大输出（或最小，取决于你想实现什么）。代表优化目标的函数是`目标函数`。此外，线性规划使用函数和不等式来表达约束或边界，这些边界防止你向目标函数中输入任何你想要的输入。例如，不等式是：\n\
  \n```\n0 <= x <= 4\n```\n\n```\ny + x < 10\n```\n\n第一个不等式意味着将目标函数的输入限制在 0 到 4 之间的值。不等式可以同时涉及更多输入变量。第二个不等式将一个输入的值与其他值联系起来，因为它们的总和不能超过\
  \ 10。\n\n![remember](img/remember.png) `Bounds`（边界）意味着值之间的输入限制，如第一个示例。`Constraints`（约束）始终涉及包含一个以上变量的数学表达式，如第二个示例。\n\
  \n线性规划的最终要求是目标函数和不等式都必须线性表达式。这意味着目标函数和不等式不能包含相互相乘的变量，也不能包含带有幂次的变量（例如平方或立方）。\n\n\
  ![technicalstuff](img/technicalstuff.png) 优化中的所有函数都应该是线性表达式，因为该程序将它们表示为笛卡尔空间中的直线。（如果你需要复习笛卡尔空间的概念，可以在\
  \ [`http://www.mathsisfun.com/data/cartesian-coordinates.html`](http://www.mathsisfun.com/data/cartesian-coordinates.html)\
  \ 找到有用信息。）正如本章后面“#在实践中使用线性规划](#27_9781119330493-ch19.xhtml_c19-sec-0007)”部分解释的那样，你可以将线性规划更多地看作是解决几何问题而非数学问题。\n\
  \n### 学习在规划时进行简化\n\n原始单纯形算法解决的问题都是你通常在教科书中读到的数学题类型。在这些问题中，所有数据、信息和限制都表述得很清楚，没有无关或冗余信息，你只需要明确应用一个数学公式（很可能是你刚刚学习的那个）来解决问题。\n\
  \n在现实世界中，问题的解决方案绝不会如此美好地给出提示。相反，它们往往以混乱的方式出现，任何必要信息都无法直接供你处理。然而，你可以分析问题并定位所需的数据和其他信息。此外，你还可以发现某些限制，如资金、时间或某些你必须考虑的规则或顺序。在解决问题时，你收集信息并设计简化它的手段。\n\
  \n简化意味着真实性的某种丧失，但使事物变得简单，这可以凸显运行的底层过程，从而帮助你判断发生的情况。更简单的问题允许你开发一个代表现实情况的模型。模型可以近似现实情况，你可以将其用于模拟和线性规划。\n\
  \n例如，如果你在工厂工作并必须制定生产计划，你知道增加的人越多，生产就越快。然而，你并不总是能通过增加的人数获得相同的收益。例如，你加入的操作员的技能会影响结果。此外，你可能会发现，当人们之间花费更多时间进行沟通和协调而非执行有效工作时，增加人数会导致收益递减。然而，你可以通过假定每个加入任务的人都会产生一定数量的成品或半成品来使模型更容易。\n\
  \n### 使用几何法进行工作\n\n线性规划问题的经典案例涉及使用有限资源（时间、工人或材料）进行生产。作为一个描述线性规划如何应对此类挑战的示例，想象一个工厂在规定时间内组装两种或更多产品。工厂工人在八小时班次内生产两种产品\
  \ `x` 和 `y`。对于每种产品，他们获得不同的利润（你通过收入减去成本来计算）、不同的小时生产率以及市场上不同的每日需求：\n\n*   每种产品的收入（美元）：`x=15`,\
  \ `y=25`\n*   每小时生产率：`x=50`, `y=40`\n*   每种产品的每日需求：`x=300`, `y=200`\n\n\n\n\n# 引言\n\
  \n从本质上说，这个业务问题是决定生产更多的 `x`（组装较容易但收益较低）还是更多的 `y`（能保证获得更多收入但产量较低）。要解决这个问题，首先要确定目标函数。将其表示为两种产品数量之和乘以它们的预期单位收入，你已知你需要最大化这个值（只有当问题涉及成本时，才需要最小化目标函数）：\n\
  \n```\nf(x,y) = 15 * x + 25 * y\n```\n\n该问题包含不等式，这些不等式由 `x` 和 `y` 的值限制，以确保优化得到有效的结果：\n\
  \n```\n0 <= x <= 300\n0 <= y <= 200\n```\n\n事实上，你不能生产负数量的产品，生产超过市场需求的产品也是意义意义。另一个重要的限制是可用时间，因为每个工作班次不能超过八小时。这意味着要计算生产\
  \ `x` 和 `y` 产品所需的时间，并将总时间限制在小于或等于八小时以内。\n\n```\nx/40 + y/50 <= 8\n```\n\n你可以在笛卡尔平面上表示函数。（关于绘制函数的复习，请参阅[`http://www.mathplanet.com/education/pre-algebra/graphing-and-functions/linear-equations-in-the-coordinate-plane`](http://www.mathplanet.com/education/pre-algebra/graphing-and-functions/linear-equations-in-the-coordinate-plane)。）由于你可以在这个问题中使用函数表示一切，因此你也可以将线性规划问题作为笛卡尔坐标空间上的几何问题来解决。如果问题涉及变量没有两个，你可以将这两个函数及其约束条件画成平面上的直线，并确定它们如何界定一个几何形状。你会发现这些线界定了一个多边形区域，被称为“可行区域（`feasible\
  \ region`）这个区域就是你找到解决方案的地方，它包含了问题所有有效（根据约束条件）的输入。\n\n![remember](img/remember.png)\
  \ 当问题涉及两个以上变量时，你仍然可以将其想象为空间中交叉的直线，但你无法进行视觉化表示，因为每个输入变量都需要图中一个维度，而图表受限于我们所处的三维世界。\n\
  \n此时，线性规划算法会以一种智能的方式探索受限的可行区域，并报告解决方案。事实上，你不需要检查界定区域内的每一个点来确定最佳问题解。将目标函数想象成平面上表示的另一条线（毕竟，目标函数也是线性函数）。你可以看到你正在寻找的解是可行区域和目标函数线首次接触的坐标点（参见图\
  \ 19-1）。当目标函数线从上方下降时（从可行区域外部到达，那里的结果由于约束条件是你无法接受的），它会在某一点触碰到该区域。这个接触点通常是该区域的一个顶点，但也可能是多边形的一整条边（在这种情况下，该边上的每个点都是最优解）。\n\
  \n![image](img/9781119330493-fg1901.png)\n\n图 19-1: 观察目标函数将如何接触可行区域。\n\n在实际操作中，单纯形算法无法像本例这样让直线视觉上下降。相反，它沿着可行区域的边界行走（通过枚举顶点），并在每个顶点测试产生的目标函数值，直到找到解决方案。因此，有效的运行时间取决于顶点的数量，而顶点数量又取决于解决方案涉及的约束条件和变量的数量。（变量越多意味着维度越高，顶点越多。）\n\
  \n## 理解局限性\n\n随着你对线性规划变得越来越自信，且问题变得更具挑战性，你需要比本章介绍的基础单纯形算法更复杂的方法。事实上，单纯形法不再被使用，因为更复杂的算法取代了它——这些算法从几何上直接穿过可行区域的内部，而不是沿着边缘行走。当算法显然在区域的错误侧寻找解决方案时，这些较新的算法会走捷径。\n\
  \n你还可能发现使用浮点数具有局限性，因为许多问题需要二进制（1/0）或整数答案。此外，其他问题可能需要使用曲线而非直线来正确表示问题空间和可行区域。你在商业软件中可以看到整数线性规划和非线性规划算法。请注意，整数规划和非线性规划都是\
  \ NP 完全问题，可能需要比你了解的其他算法相同甚至更多的时间。\n\n## 在实践中使用线性规划\n\n开始线性规划的最好方法是使用预定义的解决方案，而不是自己创建自定义应用程序。接下来的第一部分将帮助你安装用于后续示例的预定义解决方案。\n\
  \n![warning](img/warning.png) 在使用软件产品时，你可能会发现开源软件和商业软件包之间存在显著差异。尽管开源软件提供了广泛的算法，但在处理大型且复杂的问题时，性能可能会令人失望。在工作软件中实现线性规划算法仍涉及许多技巧，你不能期望开源软件的运行得像商业产品一样快速流畅。\n\
  \n尽管如此，开源为学习线性规划提供了一些不错的选择。接下来的章节使用一个名为 `PuLP` 的开源解决方案，它允许你在定义成本函数和约束后创建线性规划优化。它主要是一个教学性的解决方案，适用于帮助测试线性规划在某些问题上的作用，并从数学术语的角度产生见解。\n\
