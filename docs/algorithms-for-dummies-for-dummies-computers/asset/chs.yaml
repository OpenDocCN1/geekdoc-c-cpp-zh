  \ Anaconda。\n\n![image](img/9781119330493-fg0303.png)\n图 3-3 指定安装位置。\n\n![image](img/9781119330493-fg0304.png)\n\
  图 3-4 配置高级安装选项。\n\n## 下载数据集和示例代码\n本书介绍如何使用 Python 执行机器学习任务。当然，你可以花费所有时间从零开始创建示例代码、对其进行调试，然后才发现它们与机器学习的关系；或者你也可以采取简单的方法，从\
  \ Dummies 网站下载预先编写的代码（详情请参阅本书的引言），这样你就可以直接开始工作。同样，创建足够算法的大型数据集需要花费相当的时间。幸运的是，你可以通过某些数据科学包中的功能轻松地访问标准的、预创建的数据集（这些包也适用于各种用途，包括学习如何使用算法）。后续章节将帮助你下载和使用示例代码以及数据集。\n\
