  \n# 第 21 章\n\n# 改变世界的十种算法\n\n在本章中\n\n![check](img/check.png) **考虑排序和搜索程序**\n\n![check](img/check.png)\
  \ **使用随机数**\n\n![check](img/check.png) **缩小数据体积**\n\n![check](img/check.png) **确保数据秘密，以及……**\n\
  \n很难想象算法能做什么，更不用说改变世界。然而，现在的算法无处不在，你可能甚至没有它们对你的生活有多大的影响。\n\n大多数人意识到在线商店和其他销售场所依赖算法根据之前的购买记录推荐附加产品。然而，大多数人对算法在医学中的应用并不了解，其中许多应用帮助医生做出诊断。\n\
  \n\n\n\n\n如今许多企业得益于排序算法而繁荣发展。例如，考虑到 Google 的存在是因为它能帮助人们找到东西，而这种能力很大程度上取决于对数据进行排序以使其易于访问的能力。想想，如果没有排序程序，在亚马逊上找到某个物品将有多困难。即使是你家里电脑上的那个菜谱程序，也高度依赖排序程序来保持其包含的数据有序有序。事实上，说任何实质性的应用程序都高度依赖排序程序可能并并不夸张。\n\
  \n### 使用搜索程序查找内容\n\n与排序程序一样，搜索程序几乎出现在今天任何规模的应用程序中。这些应用程序无处不在，甚至出现在你可能没有多想过的地方，比如你的汽车。快速找到信息是日常生活的必组成部分。例如，想象一下你约会迟到了，突然发现你的\
  \ `GPS` 找不到你需要的地址。与排序程序一样，搜索程序有各种形状和大小，你可以在 [`https://tekmarathon.com/2012/10/05/best-searching-algorithm-2/`](https://tekmarathon.com/2012/10/05/best-searching-algorithm-2/)\
  \ 和 [`http://research.cs.queensu.ca/home/cisc121/2006s/webnotes/search.html`](http://research.cs.queensu.ca/home/cisc121/2006s/webnotes/search.html)\
  \ 等网站上找到它们的描述。事实上，搜索程序比排序程序更多，因为搜索需求通常更加严苛和复杂。你在这书中也会发现很多关于搜索程序的讨论（参见第 7 章）。\n\n\
  ### 使用随机数带来新变化\n\n如果没有随机性，各种事情都会变得无趣得多（注：此处原文为 less fun，意译为如果没有随机性，很多事情会变得无趣得多）。例如，想象一下开始玩纸牌，发现每次开始时看到的游戏都完全相同。没人会玩这样的游戏。因此，随机数生成是游戏体验的重要组成部分。事实上，正如本书中的许多章节所述，某些算法实际上需要一定程度的随机性才能正常工作（例如参见第\
  \ 15 章中的“安排计算机缓存数据”部分）。你还会发现，在某些情况下使用随机值测试效果更好（例如参见第 14 章中的“选择特定类型的压缩”部分）。\n\n![remember](img/remember.png)\
  \ 你从算法获得的数字实际上是伪随机的，这意味着通过知道算法和用于生成该数字的种子值，你完全可能预测出序列中的下一个数字。这就是为什么这些信息被如此严密地守护。\n\
  \n![technicalstuff](img/technicalstuff.png) 并不是所有的应用程序和所有的计算机都依赖于算法生成的伪随机数（但绝大多数都是）。存在基于计算机硬件的创建随机数的方法，例如依赖大气噪声或温度变化（详情请参见\
  \ [`http://engineering.mit.edu/ask/can-computer-generate-truly-random-number`](http://engineering.mit.edu/ask/can-computer-generate-truly-random-number)）。事实上，你可以获得基于硬件的随机数解决方案，例如\
  \ `ChaosKey` [`http://altusmetrum.org/ChaosKey/`](http://altusmetrum.org/ChaosKey/)），并将其插入你的\
  \ USB 接口以生成可能是真正的随机数。ChaosKey 网站有趣的地方在于，它为你提供了一个原理图，展示它是如何收集随机噪声并将其转换为随机数的。\n\n\
  ### 执行数据压缩\n\n第 14 章讨论了数据压缩技术，并使用了你通常用于文件的压缩类型。然而，数据压缩影响着今天计算的每一个方面。例如，大多数图形、视频和音频文件都依赖于数据压缩。如果没有数据压缩，你无法获得所需的吞吐量来实现流媒体电影等任务。\n\
  \n然而，数据压缩的用途比你想象的还要多。几乎每个数据库管理系统（DBMS）都依赖数据压缩来使数据适应磁盘上合理的空间。云计算如果没有数据压缩无法运行，因为从云端下载项目到本地机器将花费太长时间。甚至网页通常也依赖数据压缩来将信息从一个地方传输到另一个地方。\n\
  \n###保持数据秘密\n\n保持数据秘密的概念并不新鲜。事实上，它是使用某种算法的最古老的原因之一。密码学（Cryptography）一词源于两个希腊语：*kryptós*（隐藏或秘密）和\
  \ *graphein*（写作）。事实上，希腊人可能是密码学的第一批使用者，古代文献记载朱利斯·凯撒使用加密信件与其将领通信。重点在于，保持数据秘密是历史上持续时间最长的战斗之一。当一方发现了保持秘密的方法时，另一个人就会找到通过破解加密来使秘密公开的方法。今天计算机驱动的密码学的通用用途包括：\n\
  \n*   **机密性（Confidentiality）：** 确保没有人能看到双方交换的信息。\n*   **数据完整性（Data integrity）：**\
  \ 减少他人更改双方传递的数据内容的可能性。\n*   **身份验证（Authentication）：** 确定一个或多个对象的身份。\n*   **不可否认性（Nonrepudiation）：**\
  \ 防止某方否认其未过某项行为。\n\n![tip](img/tip.png) 由于在使用计算机时需要保持秘密，基于计算机的密码学历史悠久且有趣。你可以在 [`http://www.cryptographyworld.com/algo.htm`](http://www.cryptographyworld.com/algo.htm)\
  \ 和 [`https://www.dwheeler.com/secure-programs-HOWTO/crypto.html`](https://www.dwheeler.com/secure-programs-HOWTO/crypto.html)\
  \ 找到常用算法列表（包括历史算法）。[`https://www.owasp.org/index.php/Guide_to_Cryptography`](https://www.owasp.org/index.php/Guide_to_Cryptography)\
  \ 的指南提供了关于加密工作的更多细节。\n\n### 改变数据域\n\n傅里叶变换和快速傅里叶变换（`FFT`）对感知数据的方式产生了巨大影响。这两种算法将数据从频域（信号振荡的速度）转换到时域（信号变化之间的时间差）。事实上，如果没有深入地使用这两种算法，是不可能获得计算机硬件学位的。时机就是一切。\n\
  \n![remember](img/remember.png) 通过了解事物变化的频率，你可以推算出变化之间的时间间隔，从而知道在状态变化要求你执行其他操作之前你有多少时间执行任务。这些算法常见于各种过滤器。如果没有这些算法的过滤效果，通过流媒体连接忠实地复制视频和音频将是不可能的。所有这些应用听起来相当先进，确实如此，但一些很出色的教程可以让你更好地理解这些算法是如何工作的（例如参见\
  \ [`http://w.astro.berkeley.edu/~jrg/ngst/fft/fft.html`](http://w.astro.berkeley.edu/~jrg/ngst/fft/fft.html)\
  \ 中的教程）。\n\n\n\n\n\n分析关系的能力是现代计算之所以与众不同的特征之一。事实上，首先创建这些关系的表征然后对其进行分析的能力，是本书第三部分的主题。事实上，万网的核心理念就是创建连接，而在这一演变成全球性现象之初，连通性就已是一个被考虑的因素。如果没有分析和利用链接的能力，像数据库和电子邮件这样的应用程序将无法运行。你无法与\
  \ Facebook 上的朋友进行良好的交流。\n\n随着万网的成熟，人们越来越习惯于那些让连接变得更简单且无处不在的设备，Facebook 以及 Amazon\
  \ 等销售网站等应用程序更多地利用链接分析来执行向你推销更多产品等操作。当然，这种连接性也带来了一些负面影响（以 [`http://www.pcmag.com/commentary/351623/facebook-a-tool-for-evil`](http://www.pcmag.com/commentary/351623/facebook-a-tool-for-evil)\
  \ 为例），但绝大多数情况下，链接分析确实让人们能够获取更丰富的信息，并与周围的世界保持更好的联系。\n\n当然，链接分析并不仅仅是以一种连接的方式提供信息。考虑使用链接分析来提供驾驶路线，或寻找人类活动与疾病之间的偶然联系。链接分析让你能够看到某些你平时可能不会考虑、但对你的日常生活产生影响的事物之间的联系。因为链接分析，你可能会活得更长，因为医生可以建议你改变哪些习惯，以纠正以后可能变成问题。要点在于，连接无处不在，而链接分析提供了一种方法来确定这些连接存在的地方以及它们是否真的重要。\n\
  \n## 识别数据模式\n\n数据并非存在于真空之中。各种因素都会影响数据，包括影响人类感知数据的偏见。第 10 章开始讨论数据如何倾向于在特定环境中聚类，以及对这些聚类进行分析可以告诉我们关于数据的各种信息。\n\
  \n![tip](img/tip.png) 模式分析是当今计算机一些惊人用途的前沿。例如，Viola–Jones 目标检测框架使得实时脸部识别成为可能。这种算法可以让人们在机场等场所建立更好的安全性，目前不法分子正是在这些地方作案。类似的算法可以帮助你的医生在肉眼实际看到癌症之前的很长时间就检测出各种癌症。早发现意味着完全康复的概率更高。这对于所有其他医疗问题同样适用（例如发现目前小到肉眼不可见但仍引起疼痛的骨折）。\n\
  \n你还会发现模式识别被用于更平凡的用途。例如，模式分析让人们在潜在交通问题发生之前就能检测到。还可以使用模式分析来帮助农民仅在需要时施水和施肥，从而以更低的成本种出更多食物。模式识别的使用还可以帮助无人机在田间移动，从而使农民的工作效率更高，并能以更低的成本耕更多土地。如果没有算法，这些对日常生活影响如此巨大的模式是无法被识别的。\n\
  \n## 处理自动化与自动响应\n\n比例积分微分（proportional integral derivative，简称 PID）算法听起来很长。试着快点说三次！然而，它是你从未听说过的、但每天都依赖的最重要的秘密算法之一。这种特定算法依赖于控制环路反馈机制，以最小化减少期望输出信号与实际输出信号之间的误差。你会看到它被广泛用于控制自动化和自动响应。例如，当你因为刹车过猛导致汽车打滑时，这种算法有助于确保防抱制动系统（ABS）能够按预期工作。否则，ABS\
  \ 可能会过度补偿并使情况恶化。\n\n今天几乎每种形式的机械在使用比例积分微分算法。事实上，如果没有它，机器人学将是不可能的。想象一下，如果工厂里所有的机器人对其参与每项活动都不断过度补偿，会发生什么。产生的混乱将迅速让所有者停止出于任何目的使用机器。\n\
  \n## 创建唯一标识符\n\n似乎我们都只是一个数字。实际上，不仅仅是一个数字——是大量的、大量的数字。我们的每张信用卡都有一个号码，驾照是如此，政府身份标识也是如此，所有其他企业和组织也是如此。人们实际上必须记录所有数字的列表，因为数字太多了，无法追踪。然而，这些数字中的每一个都必须向某个方唯一地标识某个人。在所有这些唯一性的背后是各种算法。\n\
  \n第 7 章讨论了哈希（hashes），这是确保唯一性的方法之一。哈希和密码学的底层都是整数分解（integer factorization），这是一种将非常大的数字分解为质数的算法。事实上，整数分解是用算法解决的最困难的问题类型之一，但人们一直在研究这个问题。当今社会有很大程度上取决于你能够唯一地标识自己身份的能力，因此创建这些标识符的隐藏秘密是现代世界不可或缺的一部分。\n\
  \n## 第 22 章\n\n# 十个待解决的算法问题\n\n## 本章内容\n\n![check](img/check.png) **轻松地执行文本搜索**\n\
  \n![check](img/check.png) **检测单个单词之间的差异**\n\n![check](img/check.png) **考虑超级计算机的可行性**\n\
  \n![check](img/check.png) **采用单向函数等……**\n\n算法确实已经存在了几个世纪，所以你可能会认为科学家们已经发现并解决了所有的算法。遗憾的是，事实恰相反。解决一个特定的算法往往会带来一些算法无法解决的问题，而这些问题在有人提出解决方案之前并不而易见。此外，技术和生活方式的变化经常带来新的挑战。例如，社会的连接化特性和机器人的使用都增加了对新算法的需求。正如第\
  \ 1 章 所述，算法是解决问题的系列步骤。\n\n## 处理文本搜索\n\n\n\n\n\n许多文本搜索都涉及正则表达式的使用——这是一种告诉计算机要查找什么的简写形式。正则表达式所使用的语法取决于具体的语言或应用程序，但你会发现正则表达式被用于许多地方，包括文字处理器、电子邮件应用程序、搜索对话框，以及所有其他需要为一系列文本项提供精确搜索术语的地方。你可以在\
  \ [`http://www.regular-expressions.info/`](http://www.regular-expressions.info/)\
  \ 阅读更多关于正则表达式的知识。\n\n![remember](img/remember.png) 正则表达式目前的问题之一是，每个应用程序环境似乎都有一套相似的规则，但它们之间的细微差异又足以让创建搜索术语变得困难。广义星高问题（generalized\
  \ star-height problem）试图发现是否存在一种广义正则表达式语法。如果存在，那么所得算法将使得人们只需学习一种创建正则表达式的方法即可执行搜索。你可以在\
  \ [`https://www.irif.fr/~jep/Problemes/starheight.html`](https://www.irif.fr/~jep/Problemes/starheight.html)\
  \ 了解更多关于这个问题的信息。\n\n## 区分单词\n\n在处理字符时，计算机看到的是数字而不是字母。对计算机来说，这些数字实际上是一系列 0 和 1 的序列，并且没有任何实际意义。将字符组合成字符串只是让这系列\
  \ 0 和 1 序列变得更长。因此，比较两个字符串（这是人类一眼就能完成的任务）在计算机中可能需要时间，而且在构形变化词之间可能会产生混淆。例如，除非你在构建算法时非常小心，否则计算机可能会混淆\
  \ `enlist` 和 `listen`。更重要的是，计算机需要时间来区分这两者的不同。单词分离问题（separating words problem）试图寻找最小（也是最快）的算法（在这种情况下是确定性有限自动机，`DFN`）来执行单词分离。其目标是在给定两个特定长度单词的情况下，接受其中一个并拒绝另一个。\n\
  \n## 判断应用程序是否会结束\n\n艾兰·图灵在 1936 年提出的问题之一是：给定一个程序描述和一个输入，算法是否能够判断该程序最终会停止（停机问题，`halting\
  \ problem`）。在处理一个简单的应用程序时，很多情况下很容易判断程序将停止还是在无限循环中运行。然而，随着程序复杂性的增加，确定任何给定输入运行程序的结果变得越来越困难。图灵机无法做出这种判断；结果就是带有无限循环的\
  \ Bug 代码。使用当前技术进行的任何测试都无法解决这个问题。\n\n![remember](img/remember.png) `hypercomputer`（超计算机）是一种超越图灵机的计算模型，可用于解决如停机问题等的问题。然而，使用当前技术无法实现这种机器。如果可行，你就可以问它们各种计算机无法回答的不可测问题。[`https://www.newscientist.com/article/mg22329781-500-what-will-hypercomputers-let-us-do-good-question/`](https://www.newscientist.com/article/mg22329781-500-what-will-hypercomputers-let-us-do-good-question/)\
  \ 文章将让你大致了解如果有人能解决这个问题会发生什么。\n\n## 创建和使用单向函数\n\n单向函数是一种易于在一个方向上获取答案，但几乎不可能使用该答案的逆过程的函数。换句话说，你使用单向函数创建类似于哈希值的内容，它可以作为加密、个人身份识别、认证或其他数据安全需求解决方案的一部分。\n\
  \n![remember](img/remember.png) 单向函数的存在不是一个谜题，而是一个证明问题。目前许多电信、电子商务和电子银行系统都依赖于所谓的单向函数，但没有人真正知道它们是否真的是单向的。单向函数的存在目前是一个假设，而非理论（关于两者区别，参见\
  \ [`http://www.diffen.com/difference/Hypothesis_vs_Theory`](http://www.diffen.com/difference/Hypothesis_vs_Theory)\
  \ 中的解释）。如果有人能证明单向函数是存在的，那么从编程的角度来看，数据安全安全问题将变得更容易解决。\n\n## 乘法极大数字\n\n极大数字存在于许多地方。例如，考虑执行涉及到火星或可能是王星距离的计算。目前确实存在执行极大数乘法的方法，但它们往往很慢，因为需要多次操作才能完成。当数字大到无法放入处理器的寄存器时，问题就出现了。此时，乘法必须分多个步骤进行，这会显著降低速度。目前的解决方案包括：\n\
  \n*   高斯复乘法算法\n*   Karatsuba 乘法\n*   Toom-Cook 算法\n*   傅里叶变换方法\n\n尽管目前许多可用方法都能产生可以接受的结果，但它们都需要时间，当你有大量计算需要执行时，时间问题可能会变得至关重要。因此，大数乘法是那些需要比现有更好解决方案的问题。\n\
  \n## 公平分配资源\n\n平分资源看起来并不难，但人类是嫉妒的物种，除非你能找到一种方法向所有人保证分配确实是公平，否则他们可能会认为资源分配是不平等的。这就是无嫉妒分蛋糕问题（envy-free\
  \ cake-cutting problem）。当然，当你切蛋糕时，无论你尝试做得多么公平，人们总会有认为分配不公平的错。公平分配资源在日常生活中很重要，可以减少组织内利益相关者之间的冲突。\n\
  \n![tip](img/remember.png) 针对特定人数的无嫉妒分蛋糕问题已经存在解决方案，但还没有通用的解决方案。当两个人参与时，由其中一个人切蛋糕，另一个人选择第一块。通过这种方式，双方都能确保获得公平分配。三个人的问题变得更加复杂，但你可以在\
  \ [`https://ochronus.com/cutting-the-pie`](https://ochronus.com/cutting-the-pie)\
  \ 找到针对该问题的 Selfridge-Conway 解决方案（尽管该网站讨论的是派，过程是一样的）。然而，当达到四个人时，就没有解决方案了。\n\n## 减少编辑距离计算时间\n\
  \n两个字符串之间的`编辑距离`是将一个字符串转换为另一个字符串所需的操作次数。距离计算围绕 Levenshtein 距离操作展开，即字符串中字符的删除、插入或替换。这种特定技术用于自然语言界面、DNA\
  \ 序列定量以及所有其他需要对相似字符串进行某种比较或修改的地方。\n\n目前存在许多该问题的解决方案，但都很慢。事实上，大多数方法需要指数级的时间，因此执行转换所需的时间会迅速增加，直到人类可以感觉到输入处理上的停顿。当使用执行自动单词检查并将拼写错误更改为正确的文字处理器时，这种停顿并不严重。然而，在使用语音界面时，停顿可能会变得非常明显并导致人类操作员出错。目前的目标是在亚二次时间内允许编辑距离计算：`O(n^(2-ϵ))`。\n\
  \n## 快速解决问题\n\n\n\n\n随着机器学习的兴起以及我们越来越依赖计算机来解决问题，计算机解决问题的快慢变得至关重要。`P versus NP` 问题简单来说就是问：如果计算机可以快速验证一个问题的解决方案，它是否也能快速解决该问题？换句话说，如果计算机可以在多项式时间或更短时间内合理地确定人类对问题的回答是否正确，它是否也能在多项式时间或更短时间内解决问题本身？\n\
  \n这个问题最初由约翰·纳什（John Nash）在 20 世纪 50 年代写给美国国家安全局（`NSA`）的信中讨论，后来在库尔特·哥德尔（Kurt Gödel）与约翰·冯·诺曼（John\
  \ von Neumann）之间的信中再次讨论。除了机器学习（以及通用人工智能），这个问题也是许多其他领域的关注焦点，包括数学、密码学、算法研究、博弈论、多媒体处理、哲学和经济学。\n\
  \n# 偶偶（Parity Game）\n\n起初，解决游戏在现实生活中似乎并没有那么有用。是的，游戏很有趣且有趣，但它们并没有真正为任何实用的事情提供背景——至少，通用理论是这样说的。然而，博弈论确实出现在大量现实场景中，其中许多场景涉及复杂的过程，人们可能将这些过程视为游戏比将其视为实际过程更容易理解。在这种情况下，游戏有助于人们理解自动化验证和控制器合成等。你可以在\
  \ `http://www.sciencedirect.com/science/article/pii/S0890540115000723` 了解更多关于奇游戏的知识。事实上，如果你愿意，可以在\
  \ `https://www.abefehr.com/parity/` 玩玩它。\n\n# 理解空间问题\n\n为了将这个问题置于背景中，请想象在仓库中移动箱子，或者在其他需要考虑物体移动空间的情况下。显然，如果你在一个大仓库里有很多箱子，而且它们都需要叉车来搬运，你不想尝试通过物理重新排列它们来寻找最佳存储方法。这就是你需要通过可视化解决方案来解决问题的地方。\n\
  \n然而，问题在于是否所有的空间问题都有解决方案。在这种情况下，想一下那种儿童游戏，让你通过滑动小拼块来拼凑图片。似乎在所有情况下都存在解决方案，但在某些情况下，一个糟糕的起点会导致无解的局面。你可以在\
  \ `http://math.stackexchange.com/questions/754827/does-a-15-puzzle-always-have-a-solution`\
  \ 找到对此问题的讨论。\n\n![tip](img/tip.png) 像萨·洛德（Sam Loyd，参见 `https://www.mathsisfun.com/puzzles/sam-loyd-puzzles-index.html`）这样的数学家经常使用谜题来演示复杂的数学问题，其中有些今天还没有。访问这些网站很有趣，因为你不仅能获得免费的娱乐，还能获得思考。这些谜题提出的问题确实实际应用，但它们是以有趣的方式呈现的。\n\
  \n# 关于作者\n\n`John Mueller` 是一位自由作家和技术编辑。他血液里流淌着写作的基因，迄为止创作了 102 本书和 600 多篇文章。主题范围从网络到人工智能，从数据库管理到埋头编程。他目前编写的一些书籍包括一本面向初学者的\
  \ `Python`、面向数据科学的 `Python` 以及一本关于 `MATLAB` 的书。他还写过关于针对管理员的 `Amazon Web Services`、Web\
  \ 应用安全、使用 `JavaScript` 进行 `HTML5` 开发以及 `CSS3` 的书籍。他的技术编辑技能已帮助 63 多位作者完善了手稿内容。John\
  \ 还曾为各种技术杂志提供技术编辑服务。在他在 *Data Based Advisor* 工作期间，John 接触了 `MATLAB`，从那以后一直关注 `MATLAB`\
  \ 开发的进展。在 `Cubic Corporation` 期间，John 接触了可靠性工程，并继续对概率保持兴趣。请务必访问 `http://blog.johnmuellerbooks.com/`\
  \ 阅读 John 的博客。\n\n当 John 不在电脑前工作时，你可以在花园里找到他，他在伐木或通常在享受自然。John 还喜欢酿酒、烤饼干和编织。你可以在互联网通过\
  \ `John@JohnMuellerBooks.com` 联系到 John。John 正在 `http://www.johnmuellerbooks.com/`\
  \ 建立一个网站。欢迎查看并就他如何改进该网站提出建议。\n\n`Luca Massaron` 是一位数据科学家和营销研究总监，专长多元统计分析、机器学习和客户洞察。在应用推理、统计学、数据挖掘和算法解决现实世界问题并为利益相关者创造价值方面拥有十多年经验。Luca\
  \ 对所有关于数据和分析的事情都充满热情，并致力于向专家和非专家展示数据驱动知识发现的潜力。Luca 是 *Python for Data Science For\
  \ Dummies* 和 *Machine Learning For Dummies* 的合著者。他偏好简单而非不必要的复杂化，他相信通过简单的术语进行理解可以取得许多成就。\n\
  \n## John 的献词\n\n本书献给朱莉·索隆德（Julie Thrond），一位既忠诚又善良的朋友。愿她总能从生活的斗争中胜出。\n\n##  Luca\
  \ 的献词\n\n我将这本书献给我的妻子由纪子（Yukiko），我总能发现她充满好奇心，并准备好惊叹这个世界的奇迹。保持好奇。享受大小事物带来的惊喜。不要害怕任何事，不要让愚蠢的细节困扰你。永远保持童心。爱。\n\
  \n## John 的致谢\n\n感谢我的妻子 Rebecca。尽管她已经离开了，但她的精神存在于我写的每一本书、页面上的每一个字中。在没有人相信我时，她相信过我。\n\
  \n`Russ Mullen` 感谢他对本书的技术编辑。他极大地丰富了书中内容的准确性和深度。Russ 在寻找难以找到的 URL 方面付出了巨大努力，并提供了许多建议。\n\
  \n我的经纪人 Matt Wagner 值得感谢，感谢他帮助我获得了合同，并处理了大多数作者并不会考虑的细节。我总是感激他的帮助。知道有人愿意帮助真是真好。\n\
  \n许多人读过这本书或其部分，帮助我完善方法、测试脚本并通提供了所有读者希望获得的投入。这些无偿志愿者提供的帮助多到数不详。我特别感谢 Eva Beattie、Glenn\
  \ A. Russell、Alberto Boschetti、Cristian Mastrofrancesco、Diego Paladin、Dimitris Papadopoulos、Matteo\
  \ Malosetti、Sebastiano Di Paola、Warren B 和 Zacharias Voulgaris，他们提供了通用建议，读了全书并无私投入本项目。\n\
  \n最后，我要感谢 Katie Mohr、Susan Christophersen 以及 Wiley 的编辑和制作团队，他们对这项写作工作提供了无与伦比的支持。\n\
  \n## Luca 的致谢\n\n最要感谢我的家人，由纪子和美亚，感谢他们在编写这本书的漫长白天、夜晚、几周和几个月里提供的支持、牺牲和充满爱的耐心。\n\n\n\
