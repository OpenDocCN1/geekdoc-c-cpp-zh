- "# 算法入门指南\n\n\n\n![](img/cover.jpg)\n\n# 引言\n\n你为了学校或工作需要学习算法。然而，你尝试过的所有关于这个主题的书最终都更像是极佳的助眠剂，而不是教你些东西的教材。假设你能读懂那些显然由一个痴迷于涂鸦的疯掉两岁小孩写下的神秘符号，你最终还是不知道为什么要了解它们。大多数数学书籍都是枯燥无味的！但是，《傻瓜算法》（`Algorithms\
  \ For Dummies`）不同。你注意到的第一点是，书中完全没有漂浮着奇怪的符号（尤其是那些波浪线）。是的，你会看到几个（毕竟这这是一本数学书），但你发现的是使用算法的清晰指令，这些算法实际上有名字和历史背景，可以执行有用的任务。你会遇到一些执行神奇作用的简单编码技术，它们会让你的朋友好奇，并在你展示他们无法理解的数学奇迹时无疑让他们感到嫉妒。你不需要费脑筋就能获得这一切，而且甚至不会睡着（嗯，除非你真的想睡的话）。\n\
  \n## 关于本书\n\n《傻瓜算法》就是你在大学里想学但没有得到的那本数学书。例如，你会发现算法并不是新鲜的。毕竟，巴比伦人早在公元前 1600 年就开始使用算法执行简单任务了。如果巴比伦人能弄明白这些东西，你一定也可以！这本书实际上包含了三点你会在大多数数学书中找不到的内容：\n\
  \n*   具有实际名称和历史基础的算法，这样你就能记住算法，并知道为什么有人花时间创建它\n*   对算法如何执行数据操作、数据分析或概率预测等惊人壮举的简单解释\n\
  *   展示如何使用该算法的代码，而无需实际处理那些没有数学学位的人无法理解的神秘符号\n\n本书的重点之一是使用正确的工具。本书使用 `Python` 来执行各种任务。`Python`\
  \ 具有特殊功能，使得处理算法变得容易得多得多。例如，`Python` 提供了对大量包的访问，让你能够做到几乎你能想象的任何事情，以及许多你无法做的事情。然而，与许多使用\
  \ `Python` 的文本不同，本书并没有将你埋没在包中。我们使用了一组精选的包，它们提供了极大的灵活性和功能，但不需要你支付任何费用。你可以读完整本书，而不需要花一分钱辛苦赚来的钱。\n\
  \n你还会在书中发现一些有趣的技术。最重要的是，你不仅看到了用于执行任务的算法，还获得了关于算法如何运作的解释。与许多其他书不同，《傻瓜算法》让你完全理解自己在做什么，而不需要你拥有数学博士学位。每一个例子都显示了预期的输出，并告诉你为什么该输出很重要。你不会留下觉得遗漏了什么的感觉。\n\
  \n当然，你可能仍然担心整个编程环境的问题，本书在这方面也没有让你一目了然。在开始，你会找到 `Anaconda` 的完整安装说明，`Anaconda` 是本书使用的\
  \ `Python` 语言集成开发环境（`IDE`）。此外，快速入门指南（带有引用）将帮助你理解需要执行的基础 `Python` 编程。重点是让你尽可能快地上手，并使示例变得直观简单，以便代码不会成为学习的障碍。\n\
  \n为了帮助你吸收这些概念，本书使用了以下约定：\n\n*   你应当按照书中所示的内容直接输入的文本将以**粗体**显示。例外是你正在处理步骤列表时：因为每一步都是粗体，所以要输入的文本不是粗体。\n\
  *   我们希望你输入的且标记为*斜体*的单词用作占位符，这意味着你需要将它们替换为适合你的内容。例如，如果你看到“输入 *Your Name* 并按回车”，你需要将\
  \ *Your Name* 替换为你的真实姓名。\n*   我们还使用*斜体*表示我们定义的术语。这意味着你不需要依赖其他来源来提供所需的定义。\n*   网络地址和编程代码以\
  \ `monofont`（等宽字体）显示。如果你在连接到互联网的设备上阅读本书的电子版，你可以点击活动链接访问该网站，例如：[`http://www.dummies.com`](http://www.dummies.com/)。\n\
  *   当你需要点击命令序列时，你会看到它们被一个特殊的箭头隔开，例如：File ⇒ New File，这告诉你点击 File 然后点击 New File。\n\
  \n## 愚蠢的假设\n\n你可能很难相信我们对你做出了任何假设——毕竟，我们甚至还没有见过你！虽然大多数假设确实是愚蠢的，但我们做出某些假设是为了为书的内容提供一个起点。\n\
  \n第一个假设是你熟悉自己想要使用的平台，因为本书在这方面没有提供任何指导。（不过，第 3 章 提示非常棒，因为它们可以帮你节省时间或在不需要大量额外工作的情况下完成任务。书提示是节省时间的技巧或资源的索引，你应该尝试这些从\
  \ `Python` 中获得最大收益，或者执行与算法或数据分析相关的任务。\n\n![warning](img/warning.png) 我们不想听起来像愤怒的父母或某种疯子，但你应该避免执行任何标记有警告图标的操作。否则，你可能会发现应用程序没有按预期运行，从看似无懈可击的算法得到错误的答案，或者（在最坏的情况下）丢失数据。\n\
  \n\n\n\n\n![remember](img/remember.png) 如果你没有从某个章节或节中获得其他任何收获，请记住由此图标标记的内容。这些文本通常包含一个核心流程，或者你为了能够使用\
  \ Python、或成功完成与算法相关或数据分析相关的任务而必须掌握的信息。\n\n## 书籍之外的内容\n\n这本书并不是你 Python 或算法学习之旅的终点——它真的只是开始。我们提供了在线内容来让这本书更具灵活性，并能更好地满足你的需求。这样，当我们收到你的邮件时，我们就可以解答疑问，并告诉你\
  \ Python 及其相关插件的更新如何影响本书的内容。事实上，你将获得所有这些酷炫的补充内容：\n\n-   备查表（Cheat sheet）：你记得在学校时用过“小抄”在考试中获得更好的成绩，对吧？记得吗？嗯，备查表就像是那样。它为你提供了一些关于使用\
  \ `Python`、`Anaconda` 和算法执行任务的特殊笔记，而这些任务并不是每个人都知道的。要找到这本书的备查表，请访问 [`www.dummies.com`](http://www.dummies.com)\
  \ 并搜索 `Algorithms For Dummies Cheat Sheet.`。它包含了非常实用的信息，例如找到你执行特定任务时常用的算法。\n\n-\
  \   更新：情况有时会发生变化。例如，在我们编写这本书期间观察“水晶球”时，可能没有看到即将到来的变化。在过去，这种可能性仅仅意味着书籍变得过时且用处减少，但你现在可以在\
  \ [`www.dummies.com/go/algorithmsfd`](http://www.dummies.com/go/algorithmsfd) 找到书籍的更新。\n\
  \n除了这些更新，还可以查看 [`http://blog.johnmuellerbooks.com/](http://blog.johnmuellerbooks.com/)\
  \ 上的博客文章，其中包含读者问题的解答以及有用书籍相关技术的演示。\n\n-   配套文件：嘿！真的有人想输入书中的所有代码并手动重建所有那些图表吗？大多数读者更倾向于花时间实际操作\
  \ `Python`，使用算法执行任务，并观察他们能做出的有趣事情，而不是打字。对你幸运的是，书中使用的示例可以下载，因此你只需要阅读书籍来学习算法的使用技巧即可。你可以在\
  \ [`www.dummies.com/go/algorithmsfd`](http://www.dummies.com/go/algorithmsfd) 找到这些文件。\n\
  \n## 从何开始\n\n是时候开始你的算法学习之旅了！如果你是算法领域完全的新手，应该从第 1 章开始，并按照允许你吸收尽可能多材料的速度阅读全书。确保你阅读关于\
  \ `Python` 的内容，因为本书在示例中根据需要使用了这种语言。\n\n如果你是一个急于尽快开始学习算法的初学者，可以跳到第 3 章，但前提是理解你之后可能会发现某些主题有点令人困惑。如果你已经安装了\
  \ `Anaconda`，可以快速读读第 3 章。要使用这本书，你必须安装 `3.4` 版本的 `Python`。示例无法在 `2.x` 版本的 `Python`\
  \ 上运行，因为该版本不支持我们使用的一些软件包。\n\n对 `Python` 有一定了解且安装了相应语言版本的读者，可以通过直接进入第 6 章 来节省阅读时间。当你有疑问时，可以随时返回前面的章节。然而，在移动下一个技术之前，你确实需要理解每种技术是如何工作的。每种技术、代码示例和程序对你都有重要的教训，如果你开始跳过太多信息，可能会错过关键内容。\n\
  \n# 第一部分：入门\n\n在本部分中……\n\n-   发现如何使用算法执行实际任务。\n-   理解算法是如何组合而成的。\n-   安装并配置 `Python`\
  \ 以配合算法。\n-   使用 `Python` 处理算法。\n-   使用 `Python` 执行基础算法操作。\n\n# 第 1 章：算法简介\n\n在本章中\n\
  \n![check](img/check.png) 定义什么是算法\n\n![check](img/check.png) 依靠计算机使用算法提供解决方案\n\n\
  ![check](img/check.png) 确定问题与解决方案的区别\n\n![check](img/check.png) 执行数据操作以便你找到解决方案\n\
  \n如果你属于大多数人之一，当你打开这本书并开始算法之旅时，可能会感到困惑，因为大多数文本从未告诉过什么是算法，更不用说你为什么要使用它了。大多数文本假设你已经对算法有所了解，并且你阅读它们是为了精炼和提升你的知识。有趣的是，有些书籍实际上为\
  \ `algorithm` 提供了一个令人困惑的定义，实际上并没有真正定义它，有时甚至将其等同于其他形式的抽象、数值或符号表达式。\n\n本章的第一节致力于帮助你精确理解\
  \ `algorithm` 一术语的含义，以及为什么了解如何使用算法对你有益。算法并不深奥，它们实际上无处不在，你可能多年来一直在使用它们或受过它们的帮助，但并不真正知晓。事实上，算法正在成为支撑和调节日益复杂的科技社会中重要内容的支柱。\n\
  \n本章还讨论了如何使用计算机创建算法解决方案，如何区分问题与解决方案，以及为了找到解决方案需要对数据进行处理。本章的目标是帮助你区分算法与人们容易误认为是算法的其他任务。简而言之，你发现了自己为什么想了解算法以及如何将它们应用于数据。\n\
  \n## 描述算法\n\n尽管人们在几千年来一直在手动解决算法，但取决于你想要解决问题的复杂性，这可能会消耗大量时间并需要许多数值计算。算法的核心在于寻找解决方案，越快、越简单越好。历史上由天才们（如`欧几里得`、`牛顿`或`高斯`）创建的数学算法与大学以及私人研发实验室创建的现代算法之间存在巨大的差距。这种差距的主要原因是计算机的使用。通过采用合适的算法使用计算机解决问题可以显著加快速度，这也是为什么在强大的计算机出现后，新算法的发展如此迅速的原因。事实上，你可能注意到现在问题的解决方案出现得很快，部分是因为计算机性能既廉价又不断增长。鉴于使用算法解决问题的能力，计算机（有时以特殊硬件的形式存在）变得无处不在。\n\
  \n\n\n\n本书从许多角度审视算法。然而，由于它提供了一个概述，讲述了算法如何改变和丰富人们的生活，因此其重点在于使用计算机来处理数据的算法，由计算机提供必要的处理能力。考虑到这一点，你在书中涉及的算法需要以特定格式输入数据，这有时意味着需要更改数据以匹配算法的要求。数据处理不会改变数据的内容。它所做的是改变数据的呈现和形式，以便算法能够帮助你发现之前并不明显的新模式（但这些模式实际上一直存在于数据中）。\n\
  \n关于算法的信息源通常以一种证明令人困惑的方式来呈现它们，因为它们过于复杂或完全是错误的。尽管你可能会找到其他定义，但本书对人们经常与算法混淆（但它们并不是算法）的术语使用了以下定义：\n\
  \n- `Equation`（方程/方程式）：作为一个整体时，等于特定值的数字和符号。等式始终包含等号，这样你就知道数字和符号代表等号另一侧的特定。等式通常包含以符号形式表示的变量信息，但并不要求使用变量。\n\
  \n- `Formula`（公式）：用于表达信息或想法的数字和符号组合。公式通常表示数学或逻辑概念，例如定义两个整数的最大公约数（`GCD`）（`https://www.khanacademy.org/math/in-sixth-grade-math/playing-numbers/highest-common-factor/v/greatest-common-divisor`\
  \ 视频解释了它是如何运作的）。通常，它们显示了两个或多个变量之间的关系。大多数人将公式视为特殊的等式。\n\n- `Algorithm`（算法）：用于解决问题的步骤序列。该序列通过提供特定的解决方案，展示了处理问题的独特方法。算法并不需要代表数学或逻辑概念，尽管书中的演示通常属于这一类别，因为人们最常用这种方式使用算法。某些特殊公式也是算法，例如二次公式。为了使一个过程代表算法，它必须是：\n\
  \    - `Finite`（有限的）：算法必须最终解决问题。本书讨论了具有已知解的问题，以便你评估算法是否正确解决了问题。\n    - `Well-defined`（定义良好的）：这一系列步骤必须是精确的，并呈现易于理解的步骤。特别是由于算法的使用涉及计算机，计算机必须理解这些步骤以创建一个可用的算法。\n\
  \    - `Effective`（有效的）：算法必须解决某人为其定义的问题的所有情况。算法应该始终解决它必须解决的问题。尽管你应该预见到一些失败，但失败的发生是罕见的，且仅发生在符合预期算法用途的情况下。\n\
  \n记住这些定义，接下来的章节将有助于澄清算法的精确本质。目标并不是为算法提供一个精确的定义，而是帮助你理解算法如何融入宏大格局，以便对算法是什么以及它们为什么如此重要产生自己的理解。\n\
  \n### 定义算法用途\n\n算法总是呈现一系列步骤，并不一定通过执行这些步骤来求解数学公式。算法的范围极其巨大。你可以在科学、医学、金融、工业生产与供应以及通信领域找到解决问题的算法。算法为个人日常生活的方方面面提供支持。只要我们生活中实现某事的动作序列是有限的、定义良好的且有效的，你就可以将其视为算法。例如，你甚至可以将制作吐司这种微不足道简单的事情变成一种算法。事实上，制作吐司的程序经常出现在计算机科学课程中，正如\
  \ `http://brianaspinall.com/now-thats-how-you-make-toast-using-computer-algorithms/`\
  \ 中讨论的那样。\n\n![tip](img/tip.png)遗憾的是，网站上的算法是有缺陷的。讲师从未将吐司从包装中取出，也从未给烤箱机插电，因此结果是受损的白面包仍在包装里，被塞进了一个无法运行的烤箱机中（详情请参见\
  \ `http://blog.johnmuellerbooks.com/2013/03/04/procedures-in-technical-writing/`\
  \ 中的讨论）。尽管如此，这个想法是正确的，但它需要一些细微但至关重要的调整，使算法有限且有效。\n\n算法最常用的用途之一是求解公式的手段。例如，在处理两个整数值的\
  \ `GCD` 时，你可以通过列出两个整数的每个因子来手动完成任务，然后选择两者共有的最大因子。例如，`GCD(20, 25)` 是 `5`，因为 `5` 是能整除\
  \ `20` 和 `25` 的最大数字。然而，手动处理每一个 `GCD`（实际上是一种算法）既耗时又容易出错，因此希腊数学家欧几里得（`https://en.wikipedia.org/wiki/Euclid`）创建了一个算法来执行此任务。你可以在\
  \ `https://www.khanacademy.org/computing/computer-science/cryptography/modarithmetic/a/the-euclidean-algorithm`\
  \ 看到欧几里得法的演示。\n\n然而，一个公式（用于表达信息或想法的符号和数字呈现）可以有多种解决方案，每种解决方案都是算法。在 `GCD` 的情况下，另一种常用算法是\
  \ Lehmer 创建的（详情见 `https://www.imsc.res.in/~kapil/crypto/notes/node11.html` 和 `https://en.wikipedia.org/wiki/Lehmer%27s_GCD_algorithm`）。因为你可以多种方法解决任何公式，人们经常花费大量时间比较算法，以确定哪种算法在特定情况下效果最好。（关于欧几里得与\
  \ Lehmer 的比较请参见 `http://citeseerx.ist.psu.edu/viewdoc/download?doi=10.1.1.31.693&rep=rep1&type=pdf`。）\n\
  \n![remember](img/remember.png) 由于我们的社会及其伴随的技术正在加速、运行得越来越快，我们需要能够跟上步伐的算法。人类基因组测序等科学成就之所以在我们时代成为可能，是因为科学家找到了运行足够快以完成任务的算法。在特定情况下或平均使用情况下衡量哪种算法更好是一项非常严肃的事情，也是计算机科学家讨论的话题。\n\
  \n\n\n在计算机科学领域，同一个算法有有表现形式。例如，你可以用递归和迭代的方式来展示欧几里得算法，正如在该处所示：[`http://cs.stackexchange.com/questions/1447/what-is-most-efficient-for-gcd`](http://cs.stackexchange.com/questions/1447/what-is-most-efficient-for-gcd)。简而言之，算法提供了一种解决公式的方法，但如果说任何给定公式只存在一种可接受的算法，或者只有一种可接受的表现形式，那是错误的。利用算法解决各种问题有着悠久的历史——这并不是刚刚发生的事情。\n\
  \n即使你将目光限于计算机科学、数据科学、人工智能和其他技术领域，你会发现许多算法——多到一本书都写不完。例如，Donald E. Knuth 编写（Addison-Wesley\
  \ 出版）的《程序设计艺术》四卷共计 3,168 页（参见 [`http://www.amazon.com/exec/obidos/ASIN/0321751043/datacservip0f-20/`](http://www.amazon.com/exec/obidos/ASIN/0321751043/datacservip0f-20/)`），但仍然无法涵盖该主题（作者打算写更多卷）。然而，这里有一些供你考虑的有趣用途：\n\
  \n*   **搜索：** 定位信息或验证你看到的信息是否是你想要的信息是一项基本任务。如果没有这种能力，许多在线任务将无法完成，例如在互联网上寻找销售适合你办公室的完美咖啡壶网站。\n\
  \n*   **排序：** 确定使用什么顺序来展示信息信息，因为现在大多数人饱受信息过载之苦，而对信息排序是减少数据冲击的方法之一。你可能在小时候就学会了当你把玩具按顺序摆放时，比玩具散落在各处更容易找到并玩你感兴趣的玩具。想象一下去\
  \ Amazon 发现那里有一千多个咖啡壶待售，却无法按照价格或好评对它们进行排序。此外，许多复杂算法需要正确顺序的数据才能可靠地工作，因此排序是解决更多问题的重要前提。\n\
  \n*   **转换：** 将一种类型的数据转换为另一种类型对于理解和有效使用数据至关重要。例如，你可能完全理解英制单位，但你所有的来源都使用公制单位。在两种系统之间转换有助于你理解数据。同样，`Fast\
  \ Fourier Transform`（`FFT`）在时域和频域之间转换信号，使得你的 Wi-Fi 路由器等设备能够运行。\n\n*   **调度：** 使资源的使用对所有相关者公平是算法体现其存在的另一种方式。例如，交叉路口的信号灯不再是简单的计算灯光变化之间秒数的设备。现代设备会考虑各种问题，如时间、天气状况和流量。然而，调度有许多形式。例如，考虑你的计算机如何同时运行多个任务。如果没有调度算法，操作系统可能会夺取所有可用资源并阻止你的应用程序执行任何有用工作。\n\
  \n*   **图分析：** 决定两点之间的最短线有各种用途。例如，在路由问题中，如果没有这种特定算法，你的 GPS 将无法工作，因为它永远无法通过 A 点到\
  \ B 点的最短路线引导你在城市街道上行驶。\n\n*   **加密：** 保护数据安全是与黑客的持续战斗。算法使得分析数据、将其放入某种形式然后恢复其原始形式成为可能。\n\
  \n*   **伪随机数生成：** 想象从不变化的游戏。你每次从同一个地方开始，执行相同的步骤。如果没有生成看似随机数字的能力，许多计算机任务将变得不可能。\n\
  \n![remember](img/remember.png) 此列表提供了一个极其简短的概述\n\n### 处处发现算法\n\n上一节提到吐司算法是有特定原因的。出于某种原因，制作吐司可能是创造以来最流行的算法。许多小学生在学会解决最基本的数学问题之前，就写下了他们自己的吐司算法。很难想象存在多少种吐司算法的变体，以及每个版本的精确输出是什么。结果可能因个人和运用的创造力水平而异。简而言之，算法种类多样，并且经常出现在意想不到的地方。\n\
  \n你在计算机上执行的每个任务都涉及算法。某些算法作为计算机硬件的一部分（它们是嵌入的，因此你会听到嵌入式处理器）。启动计算机的行为本身就涉及算法。你还在操作系统、应用程序和每一其他软件中发现算法。甚至用户也依赖算法。脚本帮助引导用户以特定方式执行任务，但这些步骤也可以作为书面指令或组织政策声明的一部分出现。\n\
  \n日常行事往往会演变成算法。想想你是如何过一天的。如果你像大多数人一样，你每天以相同的顺序执行基本上相同的任务，这使得你的一天变成了一个算法，解决了了在花费最少能量的情况下成功生活的问题。毕竟，这就是常规做法所起的作用；它让我们变得高效。\n\
  \n在整本书中，你会看到每个算法都有相同的三个元素：\n\n1.  描述问题。\n2.  创建一系列解决问题的步骤（定义良好的）。\n3.  执行这些步骤以获得所需的结果（有限且有效的）。\n\
  \n\n\n\n\n`computer` 这个词听起来非常具有技术性，对某些人来说可能有些令人从畏，但现在的人已经深陷于计算机之中（可能更深）。在大多数时间里，你至少戴着一台电脑，即你的智能手机。如果你有任何特殊设备，例如起搏器，它也包含了一台计算机。你的智能电视包含至少一台计算机，你的智能家电也是如此。一台汽车可能包含多达\
  \ 30 台以嵌入式微处理器形式存在的计算机，用于调节燃油消耗、发动机燃烧、变速、转向和稳定性（根据《纽约时报》的一篇文章，[`http://www.nytimes.com/2010/02/05/technology/05electronics.html`](http://www.nytimes.com/2010/02/05/technology/05electronics.html)），其代码行数比喷战斗机还要多。出现在市场的自动驾驶汽车将需要更多的嵌入式微处理器和复杂的算法。计算机的存在是为了比手动解决问题更快、更省力地解决问题。因此，本书使用更多的计算机来帮助你更好地理解算法，这应该让你感到意外。\n\
  \n计算机在许多方面各不相同。手表中的计算机很小；桌面电脑的则很大。超级计算机规模巨大，包含许多较小的计算机，它们被分工协同工作以解决复杂问题，例如天气预测。最复杂的算法依赖特殊的计算机功能来获得人们设计其解决问题的解决方案。是的，你可以使用较少的资源来完成任务，但代价是等待更长时间的答案，或者得到一个准确性不足以提供有效解决方案的答案。在某些情况下，你等待太久，答案已经不再重要了。考虑到对速度和准确性的需求，以下章节将讨论一些影响算法的特殊计算机特性。\n\
  \n## 利用现代 CPU 和 GPU\n\n通用处理器 CPU 起初是作为一种使用算法解决问题的手段存在的。然而，它们的通用性也意味着 CPU 可以执行许多其他任务，例如移动数据或与外部设备交互。通用处理器在很多方面都表现得很好，这意味着它可以执行完成算法所需的步骤，但并不一定快。事实上，早期通用处理器的所有者可以向其系统添加数学协处理器（专门用于数学运算的芯片）以获得速度优势（详情请参见\
  \ [`http://www.computerhope.com/jargon/m/mathcopr.htm`](http://www.computerhope.com/jargon/m/mathcopr.htm)）。今天，通用处理器已经嵌入了数学协处理器，因此当你获得一个\
  \ `Intel i7` 处理器时，你实际上是在单个封装中获得了多个处理器。\n\n![tip](img/tip.png) 有趣的是，Intel 仍在营销特殊处理器扩展，例如配合\
  \ `Xeon` 芯片使用的 `Xeon Phi` 处理器（详情请参见 [`http://www.intel.com/content/www/us/en/processors/xeon/xeon-phi-detail.html`](http://www.intel.com/content/www/us/en/processors/xeon/xeon-phi-detail.html)\
  \ 和 [`https://en.wiki2.org/wiki/Intel_Xeon_Phi`](https://en.wiki2.org/wiki/Intel_Xeon_Phi)）。在执行机器学习等计算密集型任务时，你会配合\
  \ `Xeon` 芯片使用 `Xeon Phi` 芯片（详情请参见 John Mueller 和 Luca Massaron 写的 *Machine Learning\
  \ For Dummies*，了解机器学习如何使用算法来确定如何执行各种任务，从而帮助你利用数据预测未知并有意义地组织信息）。\n\n你可能会奇怪为什么这一节提到了图形处理器（GPU）。毕竟，GPU\
  \ 被认为应该是接收数据、以特殊方式进行处理，然后在屏幕上显示出漂亮的图像。任何计算机硬件都可以有多个用途。事实证明，GPU 特别擅长执行数据转换，这在许多情况下是解决算法的关键任务。GPU\
  \ 是一种特殊处理器，但其能力有助于更快的算法执行。如果你发现创建算法的人花费大量时间进行跳跃思维，这并不应该意外，这意味着他们经常以非传统的方法寻找解决问题。\n\
  \n点在于，CPU 和 GPU 成了执行算法相关任务最常用的芯片。前者很好地执行通用任务，后者则专门为数学密集型任务提供支持，特别是涉及数据转换的任务。使用多个核心使得并行处理（一次执行多个一个算法步骤）成为可能。添加多个芯片增加了可用核心的数量。更多的核心会增加速度，但某些因素使速度增益保持在最低。使用两个\
  \ `i7` 芯片并不会产生单个 `i7` 芯片两倍的速度。\n\n## 使用专用芯片\n\n数学协处理器和 GPU 是常见专用芯片的两个例子，因为你见它们被用于执行启动系统等任务。然而，算法通常需要使用不常用的专用芯片来解决问题。这不是一本硬件书，但花一点时间观察一下可以让你看到各种新的芯片，例如\
  \ IBM 正在研发的新人工神经元（详情请参见 [`http://www.computerworld.com/article/3103294/computer-processors/ibm-creates-artificial-neurons-from-phase-change-memory-for-cognitive-computing.html`](http://www.computerworld.com/article/3103294/computer-processors/ibm-creates-artificial-neurons-from-phase-change-memory-for-cognitive-computing.html)）。想象一下使用模拟大脑的内存进行算法处理。这将为执行目前可能无法实现的任务创建一个有趣的环境。\n\
  \n神经网络是一种用于模拟人类思维并为机器学习场景提供深度学习可能的技术，现在正受益于专用芯片的使用，例如 `NVidia` 的 `Tesla P100`（详情请参见\
  \ [`https://www.technologyreview.com/s/601195/a-2-billion-chip-to-accelerate-artificial-intelligence`](https://www.technologyreview.com/s/601195/a-2-billion-chip-to-accelerate-artificial-intelligence/)）。这类芯片不仅执行算法处理的速度极快，而且在执行任务的同时进行学习，使得每次迭代都变得更快。学习计算机最终将驱动能够自主移动（某种程度上）的机器人，类似于电影《机器人世界》中看到的机器人（这种机器人见\
  \ [`http://www.cbsnews.com/news/this-creepy-robot-is-powered-by-a-neural-network/`](http://www.cbsnews.com/news/this-creepy-robot-is-powered-by-a-neural-network/)）。还有用于视觉识别等任务的特殊芯片（详情请参见\
  \ [`https://www.technologyreview.com/s/537211/a-better-way-to-build-brain-inspired-chips/`](https://www.technologyreview.com/s/537211/a-better-way-to-build-brain-inspired-chips/)）。\n\
  \n\n\n\n\n![remember](img/remember.png) 无论这些设备如何工作，专用处理器最终将为各种算法提供动力，而这些算法将产生现实世界的影响。你已经以相对简单的形式发现许多此类现实应用。例如，想象一下制作披萨的机器人需要解决的任务——它必须实时考虑的各种变量。这类机器人已经存在了（这只是许多利用算法生产物资的工业机器人中的一个例子），你可以打赌它依赖于算法来描述应该要做什么，并依赖特殊芯片来确保任务快速完成（请参阅关于`硅谷的机器人披萨店`的报道：[`http://www.bloomberg.com/news/articles/2016-06-24/inside-silicon-valley-s-robot-pizzeria``）。\n\
  \n![technicalstuff](img/technicalstuff.png) 最终，甚至可能将人类大脑作为处理器，并通过特殊接口输出信息。现在一些公司正在尝试将处理器直接植入人类大脑，以增强其处理信息的能力（详情请参阅报道：[`https://www.washingtonpost.com/news/the-switch/wp/2016/08/15/putting-a-computer-in-your-brain-is-no-longer-science-fiction/`](https://www.washingtonpost.com/news/the-switch/wp/2016/08/15/putting-a-computer-in-your-brain-is-no-longer-science-fiction/)`）。想象这样一个系统：在那个系统中，人类可以以计算机的速度解决算法，同时具备人类创造性的“如果……会怎样”潜力。\n\
  \n## 利用网络\n\n除非你拥有无限资金，否则即使使用专用芯片，有效使用某些算法也可能是不可能的。在这种情况下，你可以将计算机连接起来。通过特殊软件，一台计算机（主节点）可以使用所有运行\
  \ `agent`（一种让处理器可用的内存后台应用程序）的从计算机（从节点）的处理器。通过这种方法，你可以通过将问题的部分卸载到许多从计算机上来解决极其复杂的问题。当网络中的每台计算机解决其负责的问题部分时，它们会将结果传回主节点，由主节点将这些部分组合起来创建一个汇总答案，这种技术被称为\
  \ `cluster computing`（集群计算）。\n\n不要认为这是科幻小说情节，人们已经在以各种有趣的方式使用集群计算技术。例如，`http://www.zdnet.com/article/build-your-own-supercomputer-out-of-raspberry-pi-boards/`\
  \ 找到分布式计算项目列表。该列表包含一些重大事业，例如搜寻地外生命（SETI）。你还可以捐出你计算机的额外处理能力来研究癌症治疗法。这个潜在项目列表令人惊叹。\n\
  \n网络还让你能够以非附加的形式访问他人的处理能力。例如，亚马逊云服务（AWS）和其他供应商提供了利用他们的计算机来执行你工作的手段。网络连接可以让远程计算机感觉就像它们是你自己网络的一部分。关键点在于，你可以以各种方式利用网络在计算机之间建立连接，以解决仅用你的系统无法解决的各种复杂算法。\n\
  \n## 利用可用数据\n\n解决算法的一部分与处理能力、跳出框架的思维或任何物理性质无关。要为大多数问题创建解决方案，你还需要数据来得出结论。例如，在制作吐司算法中，在解决实际制作吐司的问题之前，你需要知道面包的可用性、烤箱机、为烤箱机供电的情况等。数据变得重要是因为如果缺少所需解决方案中的任何一个元素，你就无法完成算法。当然，你可能还需要额外的输入数据。例如，想要吐司的人可能不喜欢黑麦。如果是这种情况，而你只有黑麦面包可用，那么即使有面包也不会产生成功的结果。\n\
  \n数据来自各种来源和各种形式。你可以从实时监控器等源流传输数据，访问公共数据源，依赖数据库中的私有数据，从网站抓取数据，或者通过许多其他在此不详述的方法获取数据。数据可能是静态的（不变的）或动态的（不断变化的）。你可能会发现数据是完整的或缺失元素。数据可能没有以正确的格式出现（例如，在解决重量问题时你得到英制单位，而你需要公制单位）。数据可能以表格格式出现，而你需要的却是其他形式。当你需要关系型数据库的正式格式时，它可能以非结构化的方式存在（例如在\
  \ NoSQL 数据库中或在一堆不同的数据文件中）。简而言之，为了解决算法，你需要了解关于与算法一起使用的数据的各种信息。\n\n![remember](img/remember.png)\
  \ 由于数据有多种形式，且你需要以各种方式处理它，因此本书非常关注数据。从第 6 章（11_978119304-ch06.xhtml）开始，你将发现数据结构是如何发挥作用。进入第\
  \ 7 章（12_978119304-ch07.xhtml），你开始学习如何搜索数据。第 12 章（19_978119304-ch12.xhtml）到第 14\
  \ 章（21_978119304-ch14.xhtml）帮助你处理大数据。然而，你可以在书中几乎任何章节找到关于算法数据的特定信息，因为没有数据，算法无法解决任何问题。\n\
  \n## 区分问题与解决方案\n\n本书讨论了算法视角下世界的两个部分。一方面，你拥有 `issues`（问题），即需要解决的问题。问题可以描述算法的预期输出，也可以描述为了获得预期输出而必须克服的障碍。`Solutions`（解决方案）是解决问题的方法或步骤。一个解决方案可以涉及算法中的一个或多个步骤。事实上，算法的输出——最后一步——解决方案。接下来的章节帮助你理解问题和解决方案的一些重要方面。\n\
  \n### 正确与高效\n\n使用算法是为了获得可以接受的答案。你寻找可接受答案是因为某些算法会对模糊的输入产生多个答案。生活往往让获取精确答案变得不可能。获取最精确的答案可能花费太多时间。当你获得精确答案但该答案来得太晚无法使用时，这些信息就变得毫无意义，你也浪费了时间。在两个解决同一问题的算法之间进行选择可能取决于速度和精度的权衡。\n\
  \n\n\n\n错误的答案可能会成为问题。快速创建大量错误答案与缓慢地创建大量精确的正确答案同样糟糕。本书的重点之一是帮助你在这“太快”与“太慢”以及“不准确”与“过精确”之间找到平衡点。尽管你的数学老师强调需要按照你当时所用教科书的方式提供正确答案，但现实世界中的数学通常涉及权衡选择并做出折中决策，这些决策会以你可能无法想象的方式影响你。\n\
  \n## 发现没有免费的午餐\n\n你可能听过一种常见的迷信，即你可以在不投入过多精力推导解决方案的情况下，获得计算机输出的所有内容。遗憾的是，任何问题都不存在绝对的解决方案，更好的答案往往是高昂的。在处理算法时，你会很快发现，当你需要快速获得精确答案时就需要提供额外的资源。你使用的数据源的大小和复杂性也会极大影响解决方案的解析。随着规模和复杂的增加，你会发现增加资源的需求也随之增加。\n\
  \n## 根据问题调整策略\n\n本书的第 5 部分`探讨了你可以用来降低算法工作成本的策略。顶尖的数学家利用技巧从更少的计算中获得更多的输出。例如，你可以创建一个终极算法来解决问题，或者可以使用一组更简单的算法通过多处理器来解决同一个问题。这组简单算法的运行速度通常比单一的复杂算法更快、更好，尽管这种方法看起来违背直觉。\n\
  \n## 用通用语言描述算法\n\n算法确实为人与之间的交流提供了基础，即使这些人有不同的观点并使用不同的语言。例如，贝叶斯定理（在给定某些条件下某事件发生的概率；欲快速了解这一神奇定理，请参见[`https://betterexplained.com/articles/an-intuitive-and-short-explanation-of-bayes-theorem/`](https://betterexplained.com/articles/an-intuitive-and-short-explanation-of-bayes-theorem/)）\n\
  \n```\nP(B|E) = P(E|B)*P(B)/P(E)\n```\n\n无论你说英语、西班牙语、中文、德语、法语还是任何其他语言，它看起来都是那样的。无论你说什么语言，在给定数据的情况下，算法的形式和行为都是相同的。算法通过以任何人都可以证明的形式表达思想，帮助跨越各种隔离人类的鸿沟。当你阅读这本书时，你会发现算法在向他人传达微妙思想时所提供的美与魔。\n\
  \n![tip](img/tip.png) 除了通用的数学符号外，算法还利用编程语言作为解释和交流它们所解决公式的手段。你可以在`C`、`C++`、`Java`、`Fortran`、`Python`（如本书所示）和其他语言找到各种算法。有些作者依赖伪代码来克服算法可能是用你不熟悉的编程语言提出的这一事实。`伪代码`是一种使用常用英语单词来描述计算机操作的方法。\n\
  \n## 面临难题\n\n处理算法时一个重要的考虑因素是，你可以使用它们来解决任何复杂程度的问题。算法不会思考、没有情感，也不在乎你如何使用它（甚至滥用它）。你可以以任何需要的方式使用算法解决问题。例如，用于人脸识别以作为计算机密码替代（出于安全考虑）的相同算法，可以发现机场潜伏的恐怖分子，或识别在街道上游走的失散儿童。同一个算法有不同的用途；如何使用它取决于用户的兴趣。你想仔细阅读这本书的原因之一是为了帮助你解决那些可能只需要简单算法即可处理的难题。\n\
  \n## 结构化数据以获得解决方案\n\n以非特定的方式思考数据，并对同一数据应用各种规则，以计算机永远无法理解的方式来理解。计算机对数据的观点是结构化的、简单的、不妥协的，而且绝对不具备创造力。当人类为计算机使用准备数据时，数据往往以意想不到的方式与算法交互，并产生不理想的输出。问题在于人类未能意识到计算机对数据的局限视角。以下章节描述了数据的两个方面，你将在后的许多章节中看到这些插图。\n\
  \n### 理解计算机的观点\n\n计算机对数据的观点是简单的，但这种观点也是人类通常无法理解的。首先，对计算机来说，一切都是数字，因为计算机的设计初衷不是处理任何其他类型的数据。人类在显示器上看到字符，并假设计算机是以这种方式与数据交互的，但计算机并不理解数据及其含义。字母\
  \ `A` 对计算机来说只是数字 `65`。事实上，它甚至不真的是数字 `65`。计算机看到的是一系列电脉冲，等同于二进制值 `0100 0001`。\n\n\
  计算机也不理解大写和小写这整个概念。对人类来说，小写 `a` 只是大写 `A` 的另一种形式，但对计算机来说它们是两个不同的字母。小写 `a` 在计算机看来是数字\
  \ `97`（二进制值 `0110 0001`）。\n\n如果这些简单的单字母比较就能在人类和计算机之间引起此类问题，那么想象一下人类开始对其他类型的数据假设过多时会发生什么并不困难。例如，计算机无法听或欣赏音乐。然而，音乐从计算机扬声器中传出。图形也是如此。计算机看到的是一系列\
  \ `0` 和 `1`，而不是一张包含乡村风景的图形。\n\n![remember](img/remember.png) 使用算法时，从计算机的视角考虑数据是非常重要的。计算机只看到\
  \ `0` 和 `1`，没有别的。因此，当你开始处理算法的需求时，你必须以这种方式看待数据。你可能会发现，知道计算机对数据的观点会让某些解决方案更容易，而不是更难。随着书籍的进展，你会发现更多关于这种奇特现象的内容。\n\
  \n## 数据布局产生差异\n\n计算机对数据的形式和结构也有严格的想法。当你开始处理算法时，你会发现工作的很大一部分是将数据转换为计算机在使用算法寻找问题解决方案时可以使用的形式。虽然人类可以在脑海中看到安排不完全精确的数据中的模式，但计算机确实需要精确性来找到相同的模式。这种精确性的优势在于，计算机往往能让新模式可见。事实上，这是在计算机上使用算法的主要原因之一——帮助定位新模式，然后利用这些模式执行其他任务。例如，计算机可能会识别客户的消费模式，以便你能够利用这些信息自动增加销售额。\n\
  \n\n\n如第 1 章所示，算法是由用于解决问题的系列步骤组成的。在大多数情况下，输入数据提供了解决问题的基础，有时还会提供约束条件，在任何人认为某个算法有效之前，任何解决方案都必须考虑这些条件。本章的第一节将帮助你考虑`problem\
  \ solution`（即你试图解决的问题的解决方案）。它将帮助你理解创建既灵活性（即能够处理广泛的数据输入）又有效（即能够产生所需的输出）的算法的必要性。\n\
  \n有些问题非常复杂。事实上，当你初眼看到它们时，可能会认为它们复杂到无法解决。对问题感到无从从心是很常的。解决问题最常见的方法是将问题分解为较小的部分，每个部分都可以独立处理。本章第二节讨论的解决问题的“分治法”最初是指战争的（有关该方法的历史，请参阅[`http://classroom.synonym.com/civilization-invented-divide-conquer-strategy-12746.html`](http://classroom.synonym.com/civilization-invented-divide-conquer-strategy-12746.html)）。然而，人们利用同样的思想来将各种问题缩小到可处理的范围。\n\
  \n![remember](img/remember.png) 本章的第三节提到解决问题的贪心算法。“贪婪”通常带有负面含义，但在这种情况下并非如此。`greedy\
  \ algorithm`是指在每个问题解决阶段都做出最优选择的算法。通过这种方式，它希望获得一个全局最优解决方案来解决问题。遗憾的是，这种策略并不总是有效，但始终值得尝试。它通常能产生一个`足够好`的解决方案，使其成为一个良好的基准。\n\
  \n无论你选择哪种解决问题的方法，每个算法都带有成本。作为精明的购物者，过度依赖算法的人希望获得最优可能的交易，这意味着要进行成本效益分析。当然，获得最优交易也假设使用算法的人对什么种解决方案是“足够好”有一定的了解。获取一个过于精确的解决方案，或者输出过多的解决方案通常是浪费的，因此控制成本的一部分就是获取你需要的输出，而不再更多。\n\
  \n要了解你通过算法拥有了什么，你需要知道如何通过各种方式来衡量它。测量会在脑脑中勾勒出一幅关于可用性、尺寸、资源消耗和成本的图谱。更重要的是，测量提供了比较的手段。没有测量，你就无法比较算法。在能够比较算法之前，你就无法为任务选择出最佳的一个。\n\
  \n## 开始解决问题\n\n在解决任何问题之前，你必须理解它。这不仅仅是评估问题规模。知道你拥有某些输入并需要某些输出只是开始，但对于创建一个解决方案来说这还远远不够。解决方案过程的一部分是：\n\
  \n* 发现他人是如何创建新问题解决方案的\n* 了解你手头拥有的资源\n* 确定过去哪些解决方案对类似问题有效\n* 考虑哪些类型的解决方案没有产生理想的结果\n\
  \n接下来的章节将帮助你理解解决问题的这些阶段。请意识到，你不一定需要按顺序执行这些阶段，而且在获得更多信息后，有时你会重新回到某个阶段。开始制定解决方案的过程是迭代的；你将不断尝试，直到你对当前的问题有良好的理解。\n\
  \n### 为现实问题建模\n\n现实世界的问题与教科书中的问题不同。在编写教科书时，作者通常创建一个简单的示例来帮助读者理解正在起的基本原理。该示例仅模拟了更复杂问题的一个方面。现实问题可能需要你结合多种技术来创建一个完整的解决方案。例如，为了找到问题的最佳答案，你可能：\n\
  \n1. 需要根据特定标准对答案集进行排序。\n2. 执行某种过滤和转换。\n3. 搜索结果。\n\n如果没有这一系列步骤，充分比较每个答案可能将是不可能的，你最终将得到一个次优的结果。组合在一起使用以创建所需结果的一系列算法被称为`ensemble`（集成）。你可以在\
  \ John Paul Mueller 和 Luca Massaron (Wiley) 出版的*Machine Learning For Dummies* 书中读关于它们在机器学习中的应用。[`https://www.toptal.com/machine-learning/ensemble-methods-machine-learning`](https://www.toptal.com/machine-learning/ensemble-methods-machine-learning)上的文章将为你快速概述集成是如何运作的。\n\
  \n然而，现实世界的问题比仅仅查看静态数据或仅对数据迭代一次要复杂得多。例如，任何移动物体（如汽车、飞机或机器人）都会接收持续的输入。每个更新的输入都包含错误信息，现实解决方案需要将这些信息整合到结果中，以保持这些机器正常运行。除了其他算法外，持续的计算还需要比例积分微分（PID）算法（有关该算法的详细解释，请参阅[`http://www.ni.com/white-paper/3782/en/`](http://www.ni.com/white-paper/3782/en/)）来通过使用反馈回路控制机器。每次计算都让用于控制机器的解决方案更加聚焦，这就是为什么当你第一次启动机器时，通常会经历一个稳定阶段。（如果你经常接触计算机，你可能习惯迭代的概念。PID\
  \ 是用于连续系统的；因此，没有迭代。）找到正确的解决方案被称为`settling time`（稳定时间）——控制机器的算法尚未找到正确答案的时间。\n\n在对现实问题建模时，你还必须考虑出现的非明显问题。显而易见的解决方案，即使是基于大量的数学输入和可靠的理论，可能无效。例如，在世界大战期间，盟军面临轰炸机损失的严重问题。因此，工程师分析了每架返回飞机的每个弹孔。分析后，工程师使用他们的解决方案来加强盟军飞机的装甲，以确保更多飞机返回。这并没有起作用。亚伯拉罕·瓦尔德（Abraham\
  \ Wald）登场了。这位数学家提出了一个非明显的解决方案：在缺乏弹孔的地方放置装甲板（因为有弹孔的地方已经足够坚固；否则飞机不会返回）。结果产生的解决方案有效了，并且现在被作为处理算法时`survivor\
  \ bias`（幸存者偏差，即事件的幸存者往往无法显示导致损失的真实原因）的基础。你可以在[`http://www.macgetit.com/solving-problems-of-wwii-bombers/`](http://www.macgetit.com/solving-problems-of-wwii-bombers/)\
  \ 上了解这段迷人的历史。这一点在于，建模问题中的偏差和其他问题可能会产生无效的解决方案。\n\n\n\n\n\n真实世界的建模可能还包括科学家通常认为是不良特性的添加。例如，科学家通常认为噪声是不良的，因为它隐藏了底层数据。考虑助听器，它通过消除噪声来让人们听得更清楚（详情请参见\
  \ [`http://www.ncbi.nlm.nih.gov/pmc/articles/PMC4111515/`](http://www.ncbi.nlm.nih.gov/pmc/articles/PMC4111515/)）中的讨论）。消除噪声的方法有很多，其中一些你可以在书中从第\
  \ 9 章开始作为其他主题讨论的一部分找到。然而，尽管这可能违背直觉，但添加噪声也需要一种提供有用输出的算法。例如，肯·帕尔林（Ken Perlin）在 1983\
  \ 年想要消除计算机生成图形的机械感，并创建了一种算法来实现这一点。结果就是柏林噪声（Perlin noise）（详情请参见 [`http://paulbourke.net/texture_colour/perlin/`](http://paulbourke.net/texture_colour/perlin/)）。其效果如此有用，以至于肯因他的工作获得了奥斯卡奖（详情请参见\
  \ [`http://mrl.nyu.edu/~perlin/doc/oscar.html`](http://mrl.nyu.edu/~perlin/doc/oscar.html/)）。其他人，如斯蒂文·沃尔利（Steven\
  \ Worley），创建了以其他方式影响图形的其他噪声（请参见 [`http://procworld.blogspot.com/2011/05/hello-worley.html`](http://procworld.blogspot.com/2011/05/hello-worley.html)中的讨论，其中比较了柏林噪声和沃尔利噪声）。点在于，你需要移除噪声还是添加噪声取决于你想要解决的问题领域。真实世界的场景通常需要一些在实验室工作或学习过程中可能并不明显的选择。\n\
  \n![remember](img/remember.png) 这一节的核心思想是，解决方案通常需要多次迭代才能创建，你可能需要花费大量时间来完善它们，而明显的解决方案可能完全不起作用。在对真实问题进行建模时，你确实是从教科书中的解决方案开始的，但然后你必须超越理论，找到你问题的实际解决方案。随着本书的进展，你将接触到各种算法——所有算法都能帮助你找到解决方案。要记住的是，你可能需要以各种方式结合这些示例，并发现与数据交互的方法，使其能够找到与你所需的输出匹配的模式。\n\
  \n### 寻找解决方案和反例\n\n上一节向你介绍了发现真实世界解决方案的变数，这些解决方案考虑了实验室发现的解决方案无法考虑的问题。然而，仅仅找到解决方案——即使是好的解决方案——也是不够的，因为即使好的解决方案偶尔也会失败。通过寻找反例来扮演“恶魔代言人”是开始解决问题的重要部分。反例的目的是：\n\
  \n*   潜在地反驳解决方案\n*   提供能更好地定义解决方案的边界\n*   考虑在作为解决方案基础的假设未经测试的情况\n*   帮助你理解解决方案的局限性\n\
  \n一个说明解决方案和反例的常见场景是陈述：所有质数都是奇数。`Prime numbers`（质数）是只能被自身和 1 除以得到整数结果的整数。当然，2 是质数，但它也是偶数，这使得原始陈述是错误的。做出该陈述的人可以通过说“除\
  \ 2 以外的所有质数都是奇数”来限定它。寻找所有质数的问题的部分解决方案是：你需要找到奇数，但 2 是个例外，它是偶数。在第二种情况下，反驳解决方案已不再可能，但在原始陈述中添加内容提供了一个边界。\n\
  \n通过对原始断言表示怀疑，你也可以考虑假设（除 2 以外的所有质数都是奇数）可能不成立的情况。例如，1 是一个奇数，但不被认为是质数（详情请参见 [`https://primes.utm.edu/notes/faq/one.html`](https://primes.utm.edu/notes/faq/one.html)中的讨论）。现在原始陈述有两个边界，你必须将其重新表述为：质数大于\
  \ 1 且通常是奇数，但 2 是个例外，它是偶数。通过寻找和考虑反例，可以更好地地定义质数的边界。如果你好奇的话，0 也不被认为是质数，原因见 [`http://math.stackexchange.com/questions/539174/is-zero-a-prime-number`](http://math.stackexchange.com/questions/539174/is-zero-a-prime-number)中的讨论。\n\
  \n![tip](img/tip.png) 随着问题复杂性的增加，发现反例的潜力也随之增长。需要考虑的一个基本规则是，就像可靠性一样，故障点越多，故障的可能性越大。以这种方式思考算法是非常重要的。简单算法的集成比单一复杂算法产生更好的结果，且潜在的反例更少。\n\
  \n### 站在巨人的肩膀上\n\n一个令人无法解释的神话是，目前用于处理海量数据的技术在某种程度上是新的。是的，新算法不断出现，但这些算法的基础是之前所有的算法。事实上，当你想到艾萨克·牛顿爵士（Sir\
  \ Isaac Newton）时，你可能会想到一个发明了新东西的人，但他也陈过（使用当时的拼写）“如果我能看得更远，是因为站在巨人的肩膀上”（参见 [`en.wikiquote.org/wiki/Isaac_Newton`](https://en.wikiquote.org/wiki/Isaac_Newton)）。\n\
  \n事实上，你现在使用的算法在亚里士多德时代并不是新的（参见 [`http://plato.stanford.edu/entries/aristotle-mathematics/`](http://plato.stanford.edu/entries/aristotle-mathematics/）关于亚里士多德如何使用数学的讨论），也不是柏拉图时代（参见\
  \ [`http://www.storyofmathematics.com/greek_plato.html`](http://www.storyofmathematics.com/greek_plato.html）关于柏拉图如何使用数学的讨论）。现代算法的起源如此隐藏，人们能说的最好是对古代知识的适应。自古代以来算法的使用应该给你某种安慰，因为现在使用的算法是基于数千年测试的知识。\n\
  \n\n\n\n\n# 引言\n\n如果解决问题是那么简单，那每个人都会这样做。然而，世界仍然充满了未决解决的问题，而且这种情况在短期内不太可能改变，原因只有一个且简单：问题往往显得如此巨大，以至于无法想象出解决方案。古代战士就面临过类似的问题。敌军看起来是如此庞大，而己方的力量是如此微小，以至于赢得战争的问题变得困难得难以想象，甚至是不可能的。然而，通过将敌军分成若干小块并逐次进攻，一支小小的军队完全可能击败规模大得多的对手。（古希腊人、罗马人和拿破仑·波拿尔都是分治策略的大师；有关详情请参阅\
  \ J. David Markham 编写的《Napoleon For Dummies》，Wiley 出版。）\n\n你面临着与那些古代战士相同的问题。通常，你所拥有的资源看起来非常稀少且不足。然而，通过将一个巨大的问题分解成若干小部分，以便你理解每一个部分，你最终可以创建一个适用于整个问题的解决方案。算法的核心前提正是此：使用步骤来一次次解决一小块一的问题。接下来的章节将帮助你更详细地理解分治法解决问题的方法。\n\
  \n## 避免暴力破解法\n\n`brute-force solution`（暴力破解法）是指你逐个尝试每一个可能的答案，以找到最佳答案的方法。可以确定，这种方法是详尽的，但在大多数情况下它也浪费了时间和资源。测试每一个答案，即使很容易证明某个特定答案没有成功的希望，也会浪费时间，而算法本可以将这些时间用在更有成功希望的答案上。此外，使用这种方法测试各种答案通常会浪费资源，例如内存。这样想：你想破解一把锁的密码，所以你从\
  \ `0, 0, 0` 开始，尽管你知道根据组合锁的物理特性，这个特定的组合是不可能成功的。`brute-force solution` 仍然会测试 `0, 0,\
  \ 0`，然后移动到同样荒谬的 `0, 0, 1`。\n\n![remember](img/remember.png) 重要的是要理解每种解决方案都有其优势，有时这些优势非常微小。`brute-force\
  \ solution`就有这样一个优势。因为你都要测试每一个答案，所以在在使用暴力破解法时不需要进行任何形式的预处理。然而，跳过预处理所节省的时间可能无法弥补尝试每一个答案所耗费的时间。但是，你可能会在以下情况下发现使用\
  \ `brute-force solution`：\n\n*   寻找解决方案（如果存在）是至关重要的。\n*   问题规模有限。\n*   可以使用启发式算法来减少解集的规模。\n\
  *   实现的简单性比速度更重要。\n\n## 从简化开始开始\n\n`brute-force solution` 有一个严重的缺点。它一次观察整个问题。这就像进入一个包裹，在书架上一本一本地找书，而从未考虑过任何让搜索变得简单的方法。搜索包裹的分治法则不同。在这种情况下，你首先将包裹分为儿童区和成人区。之后，你将成人区分为不同的类别。最后，你只搜索包含感兴趣书籍的那个类别部分。这就是杜伊图书分类法等分类系统的目的（参见\
  \ `https://en.wikipedia.org/wiki/List_of_Dewey_Decimal_classes` 获取类别列表、层级划分和章节）。要点在于分治简化了问题。通过减少候选书籍的数量，你让事情变得更快、更容易。\n\
  \n分治法中的“分”部分也是更好地理解问题的一种基本方式。尝试理解整个包裹的布局证明可能是困难的。然而，知道你想要找的比较心理学书籍出现在 `Section 156`\
  \ 的 `Division 150` 的 `Class 100` 中，这会让你的工作变得更容易。你可以理解这个更小的问题，因为你知道每一本 `Section 156`\
  \ 的书都会包含关于你感兴趣的话题的内容。算法的工作原理也是如此。通过让问题变得简单，你可以创建一组更简单的步骤来寻找解决方案，这缩短了找到解决方案的时间，减少了使用的资源数量，并增加了你找到精确解决方案的概率。\n\
  \n## 拆解问题通常更好\n\n在你将一个问题分解成可以管理的部分之后，你需要攻克那个特定的部分。这意味着创建一个精确的问题定义。你想要的不仅仅是任何一本关于比较心理学的书；你想要的是一本由乔治·罗曼斯（George\
  \ Romanes）编写的书。知道你想要的书出现在杜伊图书分类法的 `Section 156` 中是一个很好的开始，但它并没有解决问题。现在，你需要一个过程来审查\
  \ `Section 156` 中的每一本书，以找到你需要的特定书籍。这个过程可能进一步，寻找具有特定内容的书籍。为了使这个过程可行，你必须完全地拆解问题，精确地定义你需要什么，然后在彻底理解问题后，使用正确的步骤集（算法）来找到你需要的东西。\n\
  \n## 学习贪婪可能是好事\n\n在某些情况下，你无法看到解决方案过程的终点，甚至不知道你是否正在赢得战争。你唯一真正能做的就是确保赢得每一场战斗，以创建一个问题的解决方案，并希望也能赢得战争。解决问题的贪心算法使用了这种方法。它寻找一个整体解决方案，以便在每个问题解决阶段选择最可能的结果。\n\
  \n![remember](img/remember.png) 看起来赢得每场战斗意味着意味着赢得战争，但有时现实世界并非如此。`Pyrrhic victory`（惨胜）是指某人赢了每场战斗但最终输掉了战争，因为胜利的代价远大于收益。你可以在\
  \ `http://www.history.com/news/history-lists/5-famous-Pyrrhic-victories` 阅读五次惨胜。这些历史的重要教训是，贪心算法通常有效，但并非总是，因此你需要考虑问题的整体解决方案，而不是被阶段胜利所蒙蔽。接下来的章节描述了在处理算法时如何避免惨胜。\n\
  \n### 应用贪心策略\n\n贪心策略通常用作优化过程的一部分。算法一次处理问题的步骤，并只关注当前的步骤。每个贪心算法都包含两个假设：\n\n*   在给定的步骤可以做出单一的最优选择。\n\
  *   通过在每个步骤做出最优选择，你可以找到整个问题的最优解。\n\n你可以找到许多贪心算法，每种算法都针对特定任务进行了优化。这里是一些用于图分析（参见第\
  \ 9 章了解更多图）和数据压缩（参见第 14 章了解更多数据压缩）的常见贪心算法示例，以及你可能使用它们的原因：\n\n*   **Kruskal 最小生成树\
  \ (MST)：** 该算法实际上展示了贪心算法的一个原理，人们可能没有立即考虑到。在这种情况下，算法选择两个节点之间值最小的边，而不是像“贪婪”一词最初传达的极大值。这种算法可能帮助你找到地图上两个位置之间的最短路径或执行其他与图相关的任务。\n\
  \n\n\n\n\n* **Prim 最小生成生成树（MST）：** 该算法将一个无向图（不考虑方向的图）一分为两部分。然后，它选择连接这两个部分的边，使得两部分的总权重尽可能最小。你可能会发现这种算法被用于迷宫游戏，以找到迷宫起点和终点之间的最短距离。\n\
  * **哈夫曼编码（Huffman Encoding）：** 这种算法在计算机领域非常有名，它是许多数据压缩技术的基础。该算法为数据流中的每个唯一数据条目分配代码，使得最常用的数据条目获得最短的代码。例如，在压缩英文文本时，字母\
  \ `E` 通常会获得最短的代码，因为你使用它的频率比字母表中的任何字母都高。通过改变编码技术，你可以压缩文本并使其变得小得多，从而缩短传输时间。\n\n##\
  \ 良好的解决方案\n\n科学家和数学家频繁使用贪心算法，以至于第 15 章对它们进行了深入介绍。然而，重要的是要意识到你真正想要的是一个良好的解决方案，而不仅仅是一个特定的解决方案。在大多数情况下，良好的解决方案提供了可以衡量的这类优化结果，但\
  \ `good`（良好）这个词包含许多含义，取决于问题领域。你必须思考你想解决什么问题，以及哪种解决方案以最符合你需求的方式解决问题。例如，在工程领域工作时，你可能需要权衡考虑重量、尺寸、成本或其他因素的解决方案，或者可能是所有这些输出以满足特定要求的组合。\n\
  \n为了将这个问题情境化，假设你制造了一台硬币机，它可以使用最少的硬币为特定金额找零（可能只是作为商店自动结账机的一部分）。使用最少硬币的原因是为了减少设备磨损、所需的硬币重量以及找零所需的时间（毕竟你的客户总是很忙）。贪心解决方案通过使用尽可能大的硬币来解决问题。例如，为了找\
  \ 0.16 美元的零钱，你使用一个一角币（$0.10）、一个镍币（$0.05）和一枚美分（$0.01）。\n\n![remember](img/remember.png)\
  \ 当你无法在解决方案中使用每种硬币时，问题就出现了。例如，找零机可能没有镍币了。为了提供 0.40 美元的零钱，贪心解决方案将从一个四角币（$0.25）和一个一角币（$0.10）开始。不幸的是，没有镍币，于是硬币机会输出五枚美分（5\
  \ × $0.01），总共七枚硬币。在这种情况下，最优解决方案是使用四个一角币（4 × $0.10）。结果是，贪心算法提供了一个特定的解决方案，而不是一个良好的（最优）解决方案。找零问题引起了大量的关注，因为它太难解决了。你可以在如\
  \ Anna Adamaszeka 和 Michal Adamaszek 编写的“找零问题的组合数学”等讨论中找到更多信息（详情请参见 [`http://www.sciencedirect.com/science/article/pii/S0195669809001292`](http://www.sciencedirect.com/science/article/pii/S0195669809001292)）。\n\
  \n## 计算成本与遵循启发式算法\n\n即使你找到了一个良好的解决方案（既高效又有效），你仍然需要精确地知道该解决方案的成本。你可能会发现，即使考虑了其他因素，使用特定解决方案的成本仍然太高。也许答案几乎准时但并非完全准时，或者它使用了太多的计算资源。寻找良好的解决方案涉及创建一个环境，在这个环境里，你可以充分测试算法、它创建的状态、它用于更改这些状态的算符，以及推导出解决方案所需的时间。\n\
  \n通常，你会发现一种 `heuristic approach`（启发式方法）——即依赖于自发现并产生足够有用结果（不一定最优，但足够好）的方法是你真正解决问题所需的方法。让算法为你完成一些所需的工作可以节省精力和精力，因为你可以创建比人类更能洞察模式的算法。因此，自发现是允许算法向你展示通往解决方案的潜在有用路径的过程（但你仍然需要人类的直觉和理解来判断解决方案是否正确）。接下来的章节描述了你可以使用启发式方法来计算算法成本的技巧，将其作为发现任何给定解决方案的实际用性的手段。\n\
  \n### 将问题表示为空间\n\n`problem space`（问题空间）是进行解决方案搜索的环境。一组状态和用于更改这些状态的算符代表了问题空间。例如，考虑一种在\
  \ 3x3 框架内有八块瓷砖的游戏。每块瓷砖显示图片的一部分，瓷砖初始以某种随机顺序排列，使得图片被弄乱。目标是一次移动一块瓷砖，将所有瓷砖按正确的顺序排列并显示图片。你可以在\
  \ [`http://mypuzzle.org/sliding`](http://mypuzzle.org/sliding) 看到这类谜题的示例。\n\n起始状态、随机瓷砖和目标状态（特定顺序的瓷砖）的组合就是\
  \ `problem instance`（问题实例）。你可以使用 `problem space graph`（问题空间图）图形化地表示这个游戏。问题空间图的每个节点都表示一个状态（特定位置上的八块瓷砖）。边代表操作，例如将八号瓷砖向上移动。当你向上移动八号瓷砖时，图片发生了变化——移动到了另一个状态。\n\
  \n从起始状态移动到目标状态赢得游戏并不是唯一的考虑。为了高效解决游戏，你需要用最步骤完成任务，这意味着使用最少的算符。解决谜题所需的步数是 `problem\
  \ depth`（问题深度）。\n\n在将问题表示为空间时，你必须考虑多个因素。例如，你必须考虑放入内存的最大节点数量，这代表了 `space complexity`（空间复杂度）。当你无法一次将所有节点放入内存时，计算机必须将节点存储在其他位置（如硬盘），这会显著降低速度。为了确定节点是否能放入内存，你必须考虑\
  \ `time complexity`（时间复杂度），它是解决问题创建的最大节点数。此外，考虑 `branching factor`（分支因子）也是重要的，它是解决问题空间图中创建的节点平均数。\n\
  \n### 随机尝试并获得好运\n\n使用暴力破解技术（在本章前面的“避免暴力破解技术”中介绍过）来解决搜索问题是可行的。这种方法的优点是，不需要任何领域特定知识即可使用这些算法。暴力算法倾向于使用最简单的方法来解决问题。缺点是暴力方法在节点数量较少时效果良好。以下是一些常见的暴力破解搜索算法：\n\
  \n* **广度优先搜索（Breadth-first search）：** 这种技术从根节点开始，首先探索每个子节点，然后移动到下一层。它逐层推进直到找到解决方案。该算法的缺点是它必须将每个节点存储在内存中，这意味着对于大量节点，会消耗大量的内存。这种技术可以检查重复节点，从而节省时间，并且总是能给出解决方案。\n\
  \n\n\n\n\n- **深度优先搜索：** 这种技术从根节点开始，探索一组连接的子节点，直到到达叶子节点。它逐分支地进行演进，直到找到解决方案。该算法的缺点是它无法检查重复节点，这意味着它可能会多次遍历相同的节点路径。事实上，这种算法可能根本找不到解决方案，这意味着你必须定义一个截断点，以防止算法无限搜索。这种方法的优点是它的内存效率极高。\n\
  - **双向搜索：** 这种技术同时从根节点和目标节点进行搜索，直到两条搜索路径在中间汇合。这种方法的优点是它的时间效率高，因为它比许多其他暴力破解法更快地找到解决方案。此外，它比其他方法更有效地利用内存，并且总是能找到解决方案。主要的缺点是实现复杂复杂，导致了更长的开发周期。\n\
  \n### 使用启发式函数和代价函数\n\n对于某些人来说，`heuristic`（启发式）这个词听起来很复杂。其实说算法做了一个有根据的猜测，并在失败时尝试尝试也一样。与暴力破解方法不同，启发式算法是可以学习的。它们还使用代价函数来做出更好的选择。因此，启发式算法更加复杂，但它们在解决复杂问题具有明显的优势。与暴力算法一样，有许多启发式算法，每种算法都有其自身的优点、缺点和特殊要求。以下列表描述了一些最常见的启发式算法：\n\
  \n- **纯启发式搜索：** 算法按照代价的顺序扩展节点。它维护了两个列表：闭节点列表（closed list）包含已经探索过的节点；开启节点列表（open\
  \ list）包含尚待探索的节点。在每次迭代中，算法扩展代价最低的节点。所有的子节点都被放入闭节点列表，并计算各个子节点的代价。算法将低代价的子节点发回开启列表并删除高代价的子节点。因此，算法对解决方案执行智能的、基于代价的搜索。\n\
  - **A* 搜索：** 算法在探索节点时使用方程 `f(n) = g(n) + h(n)` 来跟踪节点的代价，其中：\n    - `n` 是节点标识符。\n\
  \    - `g(n)` 是到目前为止到达该节点的代价。\n    - `h(n)` 是从该节点到达目标的估计代价。\n    - `f(n)` 是从 `n`\
  \ 到目标的路径的估计代价。\n  其思想是优先搜索最有希望的路径，并避免昂贵的路径。\n- **贪婪最佳优先搜索：** 算法始终使用方程 `f(n) = h(n)`\
  \ 选择距离目标最近的路径。这种特殊算法可以很快找到解决方案，但它可能会陷入循环，因此许多人并不认为它是寻找解决方案的最优方法。\n\n## 评估算法\n\n\
  深入了解算法具体是如何工作的是非常重要的，否则你无法判断一个算法的执行是否真的按照你要求的方式运行。此外，如果没有良好的衡量标准，你就无法进行准确的比较，以判断当旧的解决方案运行太慢或占用过多资源时，你是否真的需要发现解决问题的新方法。现实情况是，你大多数时候都会使用他人编写的算法，可能还会设计几个自己的。在处理算法时，了解比较不同解决方案的依据并在它们之间做出决策是一项基本技能。\n\
  \n效率问题自算法概念首次出现起就一直是发现和设计新算法的一部分，这就是为什么你看到这么多不同的算法在竞争解决同一个问题（有时这是一种“选择的烦恼”）。衡量算法内部函数大小以及分析算法如何工作的概念并不新；艾达·洛芙莱斯（Ada\
  \ Lovelace）和查尔斯·巴贝奇（Charles Babbage）早在 1843 年就考虑了关于计算机的算法效率问题（参见[`http://www.computerhistory.org/babbage/adalovelace/`]中巴贝奇机的简史）。\n\
  \n唐纳德·柯恩（Donald Knuth [`http://www-cs-faculty.stanford.edu/~uno/]`），计算机科学家、数学家、斯坦福大学荣誉教授以及里程碑式巨著《计算机程序设计》（Addison-Wesley）的作者，将大部分研究和学习致力于比较算法。他努力用数学方法形式化估计算法资源需求，并允许对替代方案进行正确的比较。他创造了`analysis\
  \ of algorithms`（算法分析）一术，这是计算机科学中致力于正式方式理解算法如何工作的分支。分析通过算法达到解决方案所需的操作次数或其占用的空间（如算法在计算机内存中所需的存储）来衡量所需的资源。\n\
  \n算法分析需要一些数学理解和计算，但在你发现、欣赏和有效使用算法的旅途中非常有益。这个主题比书中的其他主题要抽象得多。为了使讨论不那么理论化，后面的章节将通过详细检查算法共同展示了这种衡量的更多实用性。以下章节为你提供了基础知识。\n\
  \n### 使用抽象机器模拟\n\n算法所需的操作越多，它就越复杂。复杂度是从时间使用方面衡量算法效率的指标，因为每个操作都需要一些时间。对于相同的问题，复杂算法通常不如简单算法理想，因为复杂算法需要更多时间。想想那些执行速度产生差异的时刻，例如在医疗或金融领域，或者在飞机或太空火箭上开启自动驾驶时。衡量算法复杂度是一项挑战性任务，但如果你想采用正确的解决方案，这是必要的。第一种测量技术使用了抽象机器，如随机访问机（`RAM`）。\n\
  \n```\n![remember](img/remember.png)\n```\n\n*抽象机器*不是真实的计算机，而是理论上的，是在功能上想象的计算机。你使用抽象机器来考虑算法在不进行真实测试的情况下在计算机上的运行效果，但受限于你将使用的硬件类型。`RAM`\
  \ 计算机执行基本算术运算并与内存中的信息交互，仅此而已。每当 `RAM` 执行任何操作时，都需要一个时间步（一个时间单位）。在 `RAM` 模拟中评估算法时，你按照以下步骤计算时间步：\n\
  \n1. 将每个简单操作（算术运算）计为一个时间步。\n2. 将复杂操作分解为简单的算术运算，并按照步骤 1 中的定义计算时间步。\n3. 将从内存访问的每次数据访问计为一个时间步。\n\
  \n为了进行这项记账，你将编写算法的伪代码版本（如第 1 章]中提到的），并使用纸和笔执行这些步骤。最后，这是一个基于计算机工作基本原理的简单方法，是一种实用的近似方法，无论你的硬件性能和速度或你使用的编程语言如何，都可以用它来比较解决方案。\n\
  \n\n\n\n\n![remember](img/remember.png) 使用模拟与在计算机上运行算法不同，因为你使用的是标准且预定义的输入。真实的计算机测量需要你运行代码并验证运行它所需的时间。在计算机上运行代码实际上是一种`benchmark`（基准测试），另一种形式的效率测量，在其中你还考虑了应用环境（例如所使用的硬件类型和软件实现）。`benchmark`很有用，但缺乏通用性。例如，考虑较新的硬件如何快速执行一个在你先的计算机上运行需要耗费长时间的算法。\n\
  \n### 进一步抽象\n\n衡量为了实现问题解决方案而设计的一系列步骤面临着许多挑战。上一节讨论了计算时间步数（操作次数），但有时你也需要计算空间（例如算法消耗的内存）。当你的问题对资源有贪婪需求时，你就会考虑空间。根据问题的不同，如果一个算法在这些资源消耗方面的某一方面运行高效，你可能会认为它是更好的算法：\n\
  \n*   运行时间\n*   计算机内存需求\n*   磁盘占用率\n*   功耗\n*   网络中的数据传输速度\n\n这些方面中的某些是以反向相互相关的，例如，如果你想要更快的执行时间，你可以增加内存或功耗来获得。在运行算法时，你不仅有不同的效率配置，还可以更改硬件特性和软件实现来实现你的目标。在硬件方面，使用超级计算机还是通用计算机是有区别的，而软件或编写算法的语言绝对是改变规则的因素。此外，你提供给算法的数据量和种类可能会导致更好或更差的性能测量。\n\
  \nRAM 模拟计算时间，是因为当你可以在许多环境中中使用某种解决方案，且它的资源使用取决于许多因素时，你必须找到一种简化比较的方法，使其成为标准。否则，你就无法比较可能的替代方案。解决方案正如许多其他问题经常发生的那样，使用单一的衡量标准并称之为一刀适用。在这种情况下，衡量标准是时间，你将其等同于操作次数，即算法的复杂度。\n\
  \nRAM 模拟将算法置于一种与语言和机器无关的情境中（它独立于编程语言和计算机类型）。然而，向他人解释 RAM 模拟的工作原理需要巨大的努力。算法分析建议使用你从\
  \ RAM 模拟中获得的操作次数，并将它们转换为数学函数，表示你的算法在时间方面的行为，这是当数据输入数量增加时所需步骤或操作的量化。例如，如果你的算法对对象排序，你可以使用函数来表示复杂度，该函数根据接收的对象数量报告它需要多少操作。\n\
  \n### 使用函数\n\n数学中的函数仅仅是将某些输入映射到响应的方法。换一种说法，`function` 是一种变换（基于数学运算），它能将你的输入转换（映射）到答案。对于某些输入值（通常用字母\
  \ `x` 或 `n` 表示），你使用定义函数的数学方法有一个相应的答案。例如，像`f(n) = 2n` 这样的函数告诉你，当输入为数字 `n` 时，你的答案是数字\
  \ `n` 乘以 2。\n\n考虑到这是一个对时间至关重要的时代，人们的生活充满了不断增长的数据量，使用输入的大小是有意义的。将一切变为数学函数可能没那么直观，但一个描述算法如何将其解决方案与其接收的数据量联系起来的函数是你可以在没有特定硬件或软件支持的情况下分析的东西。鉴于你问题的大小，它也很与其他解决方案进行比较。算法分析确实是一个令人惊叹的概念，因为它将一系列复杂的步骤简化为一个数学公式。\n\
  \n此外，大多数时候，算法分析甚至不关心精确定义函数。你真正想做的是是将目标函数与另一个函数进行比较。这些比较函数出现在一组建议的函数中，这些函数与目标算法相比时性能较差。通过这种方式，你不需要将数字代入复杂度较高或较低的函数；相反，你处理的是简单的、预制的且为人知的函数。这听起来可能很粗，但它更有效，类似于将算法的性能归类，而不是获得精确的性能测量。\n\
  \n这组通用函数被称为 `Big O` 表示法，在本书书中，你经常遇到这组小函数（放在括号中并在前面加大写字母 `O`），用于表示算法的性能。图 2-1 显示了算法的分析。笛卡尔坐标系可以表示由\
  \ RAM 模拟测量的函数，其中`abscissa`（x 坐标）是输入的大小，`ordinate`（y 坐标）是其结果的操作次数。你可以看到表示的三条曲线。输入大小很重要。然而，质量也很重要（例如，在排序问题中，对一个已经几乎有序的输入进行排序更快）。因此，分析显示了最坏情况\
  \ `f1`、平均情况 `f2` 和最好情况 `f3`。尽管平均情况可能给你一个大致的观点，但你真正关心的是最坏情况，因为当你的算法难以达到解决方案时，可能会出现问题。Big\
  \ O 函数是指在经过某个 `n[0]` 值（认为输入足够大的阈值）之后，对于相同的输入，其产生的操作次数总是比最坏情况函数 `f[1]` 大。因此，Big O\
  \ 函数比代表你算法的函数更悲观，所以无论输入质量如何，你都可以确定情况不会比这糟糕。\n\n![image](img/9781119330493-fg201.png)\n\
  \n图 2-1： 许多可能的函数会导致更差的结果，但 Big O 表示法提供的函数选择是有限的，因为其目的是通过提出标准来简化复杂度测量。因此，本节仅包含了 Big\
  \ O 表示法中的少数函数。以下列表按复杂度递增顺序描述：\n\n*   **常数复杂度 O(1)**：无论你提供多少输入，时间都是一样的。最终，无论数据有多长，操作次数都是恒定的。这种复杂度在实践中非常罕见。\n\
  *   **对数复杂度 O(log n)**：操作数的增长速度比输入慢，使得算法在小输入时效率较低，在大输入时效率更高。该类的典型算法是二分查找，如第 7 章](#12_9781119330493-ch07.xhtml）数据排序和搜索所示。\n\
  *   **线性复杂度 O(n)**：操作按 1:1 的比例随输入增长。典型算法是迭代，即扫描一次输入并对每个元素应用操作。第 5 章](#09_9781119330493-ch05.xhtml）讨论了迭代。\n\
  \n\n\n\n\n*   **线性对数复杂度 O(n log n):** 复杂度是对数复杂度和线性复杂度的混合。它是某些用于数据排序的智能算法的典型特征，例如\
  \ `Mergesort`、`Heapsort` 和 `Quicksort`。第 7 章 将为你介绍了其中大多数算法。\n*   **二次复杂度 O(n²):**\
  \ 操作随输入数量的平方而增长。当在一个迭代内部嵌套另一个迭代时（计算机科学中称为嵌套迭代），你就具有了二次复杂度。例如，你有一个名称列表，为了找到最相似的，你将每个名称与其他所有名称进行比较。一些效率较低的排序算法具有这种复杂度：`bubble\
  \ sort`（泡排序）、`selection sort`（选择排序）和 `insertion sort`（插入排序）。这种级别的复杂度意味着你的算法在找到解决方案之前可能运行数小时甚至几天。\n\
  *   **三次复杂度 O(n³):** 操作增长得比二次复杂度更快，因为现在你有多个多个嵌套迭代。当一个算法具有这种数量级的复杂度，而你需要处理适量的数据（100,000\
  \ 个元素）时，你的算法可能会运行多年。当你执行的操作次数是输入的幂时，通常认为该算法是*在多项式时间内运行*。\n*   **指数复杂度 O(2^n):**\
  \ 每增加一个新元素，算法所需的操作都是之前操作的两倍。当一个算法具有这种复杂度时，即使是很小的问题可能需要永远。许多执行穷式搜索的算法具有指数复杂度。然而，这种复杂度的经典示例是\
  \ `Fibonacci numbers` 的计算（作为递归算法，在第 5 章:** 由于元素之间存在大量的组合，这是一个真正的复杂度噩梦。想象一下：如果你的输入是\
  \ 100 个对象，计算机上的某项操作需要 `10^(-6)` 秒（这是目前大多数计算机的合理速度），你需要大约 `10¹⁴⁰` 年才能成功完成任务（这是一个不可能的时间，因为宇宙的年龄估计为\
  \ `10¹⁴` 年）。一个著名的阶乘复杂度问题是 `traveling salesman problem`（旅行推员问题），推员必须找到访问许多城市并返回起始城市的最短路线（在第\
  \ 18 章](#26_9781119330493-ch18.xhtml）中介绍）。\n\n# 第 3 章\n\n# 使用 Python 处理算法\n\n本章内容\n\
  \n![check](img/check.png) **使用 Python 发现算法的工作原理**\n![check](img/check.png) **考虑不同的\
  \ Python 发版本**\n![check](img/check.png) **在 Linux 上安装 Python**\n![check](img/check.png)\
  \ **在 OS X 上安装 Python**\n![check](img/check.png) **在 Windows 上安装 Python**\n![check](img/check.png)\
  \ **获取并安装书中使用的数据集**\n\n在利用计算机辅助发现算法的奇之处方面，你有很多很好的选择。例如，除了 `Python` 之外，许多人依赖 `MATLAB`，另许多人使用\
  \ `R`。事实上，有些人同时使用这三者，然后比较他们得到的输出类型（参见 [`https://www.r-bloggers.com/evaluating-optimization-algorithms-in-matlab-python-and-r/`](https://www.r-bloggers.com/evaluating-optimization-algorithms-in-matlab-python-and-r/）中的其中一种比较）。如果你只有三个选择，你仍然需要考虑一段时间，并可能选择学习一门语言，但你实际上有三个以上的选择。当你深入算法世界时，你会发现你可以使用所有语言，而本书无法涵盖它们。本书使用\
  \ `Python` 是出于许多良好考虑，你会发现它功能完备，且深受社区的推崇（例如在第 2 章](#06_9781119330493-ch02.xhtml)中描述的\
  \ `RAM simulation`）。`Python` 是一种类似于人类创建指令的语言，而不是计算机解释它们的语言。\n\n\n\n\n要在计算机上运行算法，你需要一些与计算机通信的手段。如果这是在《星际迷航》（*Star\
  \ Trek*）中，你可能只需要告诉计算机你需要什么，它就会尽职地为你完成任务。事实上，斯科蒂（Scotty）对《星际迷航 4》中缺乏语音计算机界面感到相当困惑（详情请参见\
  \ [`http://www.davidalison.com/2008/07/keyboard-vs-mouse.html`](http://www.davidalison.com/2008/07/keyboard-vs-mouse.html)）。要点在于，你仍然需要使用鼠标、键盘以及一种特殊的语言向计算机传达你的想法，因为计算机并不会努力与你交流。Python\
  \ 是许多语言之一，它特别擅长让非开发者轻松向计算机传达想法，但它并不是唯一的选择。接下来的段落将帮助你理解为什么这本书使用 Python，以及你的其他选择是什么。\n\
  \n## 理解为什么这本书使用 Python\n\n今天现有的每种计算机语言都会将算法翻译成计算机可以处理的形式。事实上，像 `ALGOL`（算法语言）和 `FORTRAN`（公式翻译语言）这样的语言清楚地体现了这一重点。记住第\
  \ 1 章中对算法的定义：它是用于解决问题的步骤序列。执行这种翻译的方法因语言而异，某些语言使用的技术非常深奥，即使是尝试一下也需要专业知识。\n\n![remember](img/remember.png)\
  \ 计算机只说一种语言，即*机器码*（计算机解释用以执行任务的 0 和 1），这种语言对人类来说极其难以口说，以至于早期的开发人员创建了大量的替代方案。计算机语言的存在是为了让人类与计算机的通信变得简单。因此，如果你发现自己苦苦于让任何东西运行，也许你选错了语言。最好的方法始终手头准备多种语言，这样你就可以轻松地进行计算机通信了。Python\
  \ 恰好是对于应用开发领域以外的人员来说非常好用的语言之一。\n\nPython 是一个人的愿景——吉多·范·罗姆（Guido van Rossum）的产物（请见他的主页\
  \ [`https://gvanrossum.github.io/`](https://gvanrossum.github.io/)）。你可能会对 Python\
  \ 已经存在很久感到惊讶——吉多在 1989 年 12 月启动了这种语言，作为 `ABC` 语言的替代。关于 Python 的精确目标的信息不多，但它确实保留了\
  \ ABC 使用更代码创建应用程序的能力。然而，它远超了 ABC 创建所有类型应用程序的能力，与 ABC 相比，它拥有四种编程风格。简而言之，吉多以 ABC 为起点，发现它具有局限性，并创建了一个没有这些限制的新语言。这是一个创建一个真正比前身更好的新语言的范。\n\
  \nPython 经过了多次迭代，目前有两条开发路径。`2.x` 路径与 Python 之前的版本后兼容；`3.x` 路径则不兼容。兼容性问题会影响你如何使用\
  \ Python 执行算法相关的任务，因为至少有一些包无法在 `3.x` 上运行。此外，由于吉多在 Python 开发期间曾在于不同的公司工作，某些版本使用了不同的许可协议。你可以在\
  \ [`https://docs.python.org/3/license.html`](https://docs.python.org/3/license.html)\
  \ 查看版本及其相应许可的列表。Python 软件基金会（PSF）拥有所有的 Python 版本，所以除非你使用旧版本，否则你真的不需要担心许可问题。\n\n\
  ![technicalstuff](img/technicalstuff.png) 吉多实际上是将 Python 作为一个一个*秘密工作项目*（由一个规模小且结构松散的群体开发的项目）。其核心概念是尽可能地创建\
  \ Python，同时创建一个灵活的、可以在任何平台上运行的并提供巨大扩展潜力的语言。Python 提供了所有特征以及更多功能。当然，道路上总会有波折，例如确定到底要暴露多少底层系统。你可以在\
  \ [`http://python-history.blogspot.com/2009/01/pythons-design-philosophy.html`](http://python-history.blogspot.com/2009/01/pythons-design-philosophy.html)\
  \ 阅读更多关于 Python 的设计哲学。在 [`http://python-history.blogspot.com/2009/01/introduction-and-overview.html`](http://python-history.blogspot.com/2009/01/introduction-and-overview.html)\
  \ 中的 Python 历史也提供了一些有用信息。\n\nPython 最初的开发（或设计）目标与自那时以来该语言发生的情况并不完全匹配。吉多最初将 Python\
  \ 设计为开发者的第二语言语言，这些开发者需要创建一次性代码但无法通过脚本语言完全实现他们的目标。Python 最初的目标受众是 `C` 开发者。你可以在 [`http://www.artima.com/intv/pyscale.html`](http://www.artima.com/intv/pyscale.html)\
  \ 的采访中阅读这些原始目标。\n\n你今天可以找到许多用 Python 编写的应用程序，因此仅将其用于脚本编写的想法并没有实现。事实上，你可以在 [`https://www.python.org/about/apps/`](https://www.python.org/about/apps/)\
  \ 找到 Python 应用程序的列表。\n\n自然，有了这些成功案例，人们对增加 Python 充满热情。你可以在 [`http://legacy.python.org/dev/peps/`](http://legacy.python.org/dev/peps/)\
  \ 查看 Python 增强提案（PEPs）。这些 `PEPs` 可能可能实现，但它们证明了 Python 是一门活的、不断发展的语言，将继续为开发者提供创建所有类型应用程序所需的功能。\n\
  \n## 使用 MATLAB\n\nPython 通过提供多种编码风格、极大的灵活性和强大的扩展性优于许多语言，但它仍然是一种编程语言。如果你真的不想使用编程语言，你确实有其他选择，例如\
  \ `MATLAB` ([`https://www.mathworks.com/products/matlab/`](https://www.mathworks.com/products/matlab/))，它关注算法。`MATLAB`\
  \ 仍然是一种脚本语言，为了执行任何重大任务你仍然需要了解编程，但不需要 Python 那么多。\n\n使用 `MATLAB` 的主要问题之一是你需要支付的价格。与\
  \ Python 不同，`MATLAB` 需要资金投入（参见 [`https://www.mathworks.com/pricing-licensing/`](https://www.mathworks.com/pricing-licensing/)\
  \ 的许可费用）。该环境确实更容易使用，但大多数事情一样，没有免费午餐，你必须将成本差异作为决定使用产品的一部分。\n\n很多人对 `MATLAB` 感奇，即它与\
  \ Python 相比的优缺点。这本书没有空间提供完整的比较，但你可以在 [`http://www.pyzo.org/python_vs_matlab.html`](http://www.pyzo.org/python_vs_matlab.html)\
  \ 找到很很好的概述。此外，你可以在 [`https://www.mathworks.com/help/matlab/call-python-libraries.html`](https://www.mathworks.com/help/matlab/call-python-libraries.html)\
  \ 中的技术在 `MATLAB` 中调用 Python 包。事实上，`MATLAB` 还支持以下内容：\n\n*   `MEX` ([`https://www.mathworks.com/help/matlab/call-mex-file-functions.html`](https://www.mathworks.com/help/matlab/call-mex-file-functions.html))\n\
  \n\n\n\n\n*   C ([`https://www.mathworks.com/help/matlab/using-c-shared-library-functions-in-matlab-.html`](https://www.mathworks.com/help/matlab/using-c-shared-library-functions-in-matlab-.html))\n\
  *   Java ([`https://www.mathworks.com/help/matlab/using-java-libraries-in-matlab.html`](https://www.mathworks.com/help/matlab/using-java-libraries-in-matlab.html))\n\
  *   .NET ([`https://www.mathworks.com/help/matlab/using-net-libraries-in-matlab.html`](https://www.mathworks.com/help/matlab/using-net-libraries-in-matlab.html))\n\
  *   COM ([`https://www.mathworks.com/help/matlab/using-com-objects-in-matlab.html`](https://www.mathworks.com/help/matlab/using-com-objects-in-matlab.html))\n\
  \n因此，你并不非得要在 MATLAB 和 Python（或其他语言）之间做出选择，但你使用的 Python 特性越多，就越容易直接使用 Python 并跳过\
  \ MATLAB。你可以通过 Jim Sizemore 和 John Paul Mueller (Wiley 出版)的 *MATLAB 入门》(MATLAB For\
  \ Dummies) 了解更多关于 MATLAB 的知识。\n\n## 考虑其他算法测试环境\n\n算法相关工作的第三大主要竞争者是 R。R 编程语言像 Python\
  \ 一样是免费的。它还支持大量的包并提供了极大的活性。然而，某些编程构造有所不同，一些人认为 R 比 Python 更难用。在执行统计工作方面，大多数人认为 R\
  \ 是胜者，但他们认为 Python 的通用性具有巨大优势（请参见 [`https://www.datacamp.com/community/tutorials/r-or-python-for-data-analysis`](https://www.datacamp.com/community/tutorials/r-or-python-for-data-analysis)\
  \ 和 [`http://www.kdnuggets.com/2015/05/r-vs-python-data-science.html`](http://www.kdnuggets.com/2015/05/r-vs-python-data-science.html)\
  \ 中的文章）。Python 更强大的社区支持也是一个主要优势。\n\n如前所述，你可以使用任何计算机编程语言来执行算法相关工作，但大多数语言都有特定的用途。例如，你可以使用结构化查询语言\
  \ (SQL) 等语言来执行算法相关任务，但这种语言侧重于数据管理，因此某些算法相关任务可能会变得复杂且难以执行。SQL 的一个重大缺陷是无法轻松绘制数据图，也无法执行算法特定工作所需的某些翻译和转换。简而言之，在选择语言时，你需要考虑你计划做什么。本书使用\
  \ Python 是因为它确实是执行这些任务的最佳整体语言，但重要的是，要意识到在某一点你可能需要另一种语言。\n\n## 查看 Python 发行版\n\n\
  你完全可以获取一个通用的 Python 版本，并为其添加所有运行算法所需的包。由于这个过程可能会很困难，因为你需要确保拥有所有正确版本的所需包，以确保成功。此外，你还需要进行必要的配置，以确保在需要时可以访问这些包。幸运的是，没有必要完成这些工作，因为有许多与算法配合良好的\
  \ Python 产品可供你使用。这些产品提供了开始算法相关项目所需的所有内容。\n\n![remember](img/remember.png) 你可以使用后续章节中提到的任何包来处理此书中的示例。然而，本书的源代码和可下载的源代码依赖于\
  \ Continuum Analytics Anaconda 4.2.0，因为这个特定的包可以在本书支持的所有平台上运行：Linux、Mac OS X 和 Windows（注：此处应为\
  \ Mac OS X）。书在随后的章节中没有提到特定的包，但任何截图都反映了在 Windows 上使用 Anaconda 的外观。你可能需要调整代码以使用另一个包，如果你在其他平台上使用\
  \ Anaconda，屏幕显示将会有不同。\n\n![warning](img/warning.png) Windows 10 在处理 Python 时会遇到一些严重的安装问题。你可以在我的（John）博客上阅读这些问题：[`http://blog.johnmuellerbooks.com/2015/10/30/python-and-windows-10/`](http://blog.johnmuellerbooks.com/2015/10/30/python-and-windows-10/)。鉴于许多读过我其他\
  \ Python 书籍的读者反馈说 Windows 10 没有提供良好的环境，我无法将 Windows 10 推荐为本书的 Python 平台。如果你正在使用\
  \ Windows 10，只需意识到你的 Python 安装之路将充满坎坷。\n\n## 获取 Analytics Anaconda\n\n基础 Anaconda\
  \ 包是一个免费下载包，你可以在 [`https://store.continuum.io/cshop/anaconda/`](https://store.continuum.io/cshop/anaconda/)\
  \ 获取。只需点击 Download Anaconda 即可获取该免费产品。你需要提供一个电子邮件地址来获取 Anaconda 副本。提供电子邮件地址后，你会进入另一个页面，你可以在那里选择你的平台以及该平台的安装程序。Anaconda\
  \ 支持以下平台：\n\n*   Windows 32 位和 64 位（安装程序可能只提供 64 位）\n*   Linux 32 位和 64 位\n*   Mac\
  \ OS X 32 位和 64 位\n\n![tip](img/tip.png) 你可以获取带有旧版本的 Anaconda。如果你想使用旧版本的 Python，请点击页面底部的链接。你只有在有迫切需求时才应该使用旧版本的\
  \ Python。Miniconda 安装程序通过限制安装的功能数量可能节省时间。然而，确定你具体需要哪些包是一个容易出错且耗时的过程。通常情况下，你应该进行完整安装以确保拥有项目所需的一切。即使是完整安装，在大多数系统上也不需要太多时间或精力。\n\
  \n免费产品就是本书所需。\n\n## 考虑 Enthought Canopy Express\n\nEnthought Canopy Express 是一款使用\
  \ Python 生成技术和科学应用的免费产品。你可以在 [`https://www.enthought.com/canopy-express/`](https://www.enthought.com/canopy-express/)\
  \ 获取。在主页点击 Download Free 可查看下载版本列表。只有 Canopy Express 是免费的；完整的 Canopy 产品需要付费。然而，你可以使用\
  \ Canopy Express 处理此书中的示例。Canopy Express 支持以下平台：\n\n*   Windows 32 位和 64 位\n*  \
  \ Linux 32 位和 64 位\n*   Mac OS X 32 位和 64 位\n\n选择你想要下载的平台和版本。点击 Download Canopy\
  \ Express 时，你会看到一个个人信息的可选表单。即使你不向公司提供个人信息，下载也会自动开始。\n\n\n\n\n\nCanopy Express 的优势之一是\
  \ Enthought 深度参与为学生和教师提供支持。人们还可以参加各种课程，包括在线课程，通过多种方式教你如何使用 Canopy Express（参阅 [`https://training.enthought.com/courses`](https://training.enthought.com/courses)）。\n\
  \n### 考虑 pythonxy\n\n`pythonxy` 集成开发环境 (IDE) 是一个托管在 Google 上的社区项目，地址为 [`http://python-xy.github.io/`](http://python-xy.github.io/)。它是一个仅限\
  \ Windows 的产品，因此你无法轻松地将其用于跨平台需求。（事实上，它只支持 Windows Vista、Windows 7 和 Windows 8.）不过，它确实附带了一套完整的软件包，如果你想的话，可以很容易地用它来本书。\n\
  \n由于 `pythonxy` 使用 GNU 通用公共许可许可证 (GPL) v3（参阅 [`http://www.gnu.org/licenses/gpl.html`](http://www.gnu.org/licenses/gpl.html)），你无需担心任何插件、培训或其他付费功能。没有人会敲开你的门希望向你推销东西。此外，你可以访问\
  \ `pythonxy` 的所有源代码，因此如果你愿意，可以进行修改。\n\n### 考虑 WinPython\n\n这个名字告诉你 `WinPython` 是一个仅限\
  \ Windows 的产品，你可以在 [`http://winpython.sourceforge.net/`](http://winpython.sourceforge.net/)\
  \ 找到它。该产品实际上是 `pythonxy` 的衍生品，并不是为了取代它。恰恰相反：`WinPython` 仅仅是使用 `pythonxy` 的更灵活的方法。你可以在\
  \ [`http://sourceforge.net/p/winpython/wiki/Roadmap/`](http://sourceforge.net/p/winpython/wiki/Roadmap/)\
  \ 了解创建 `WinPython` 的动机。\n\n该产品的底线是，你以牺牲易用性和一些平台集成为代价换得了灵活性。然而，对于需要维护多个版本 IDE 的开发者来说，`WinPython`\
  \ 可能会产生显著差异。在配合本书使用 `WinPython` 时，请务必特别注意配置问题，否则你会发现即使是下载的代码也几乎没有机会正常运行。\n\n## 在\
  \ Linux 上安装 Python\n\n你使用命令行在 Linux 上安装 Anaconda —— 它没有提供图形化安装选项。在执行安装之前，你必须从 Continuum\
  \ Analytics 网站下载 Linux 软件副本。你可以在本章早前的“获取 Analytics Anaconda”部分中找到所需的下载信息。以下步骤在任何\
  \ Linux 系统上都应该可以正常工作，无论你使用的是 32 位还是 64 位的 Anaconda：\n\n1.  **打开 Terminal 副本。**\n\
  \    Terminal 窗口出现。\n\n2.  **切换目录到系统上下载的 Anaconda 副本。**\n    该文件的名称各不相同，但通常 32 位系统显示为\
  \ `Anaconda3-4.2.0-Linux-x86.sh`，64 位系统显示为 `Anaconda3-4.2.0-Linux-x86_64.sh`。版本号作为文件名的一部分嵌入。在这种情况下，文件名指的是版本\
  \ 4.2.0，这是本书使用的版本。如果你使用其他版本，可能会在处理源代码时遇到问题，并在操作时需要进行调整。\n\n3.  **输入 `bash Anaconda3-4.2.0-Linux-x86.sh`（针对\
  \ 32 位版本）或 `bash Anaconda3-4.2.0-Linux-x86_64.sh`（针对 64 位版本）并按回车。**\n    启动安装向导，要求你接受使用\
  \ Anaconda 的许可条款。\n\n4.  **阅读许可协议并使用适用于你 Linux 版本的方法接受术语。**\n    向导要求你提供 Anaconda\
  \ 的安装位置。本书假设你使用默认位置 `~/anaconda`。如果你选择了其他位置，你可能需要修改书中后半部分的某些步骤以适应你的设置。\n\n5.  **提供安装位置（如有必要）并按回车（或点击“下一步”）。**\n\
  \    应用程序的解压过程开始。解压完成后，你会看到一条完成消息。\n\n6.  **使用适用于你 Linux 版本的方法将安装路径添加到你的 PATH 语句中。**\n\
  \    你已准备好开始使用 Anaconda 了。\n\n## 在 MacOS 上安装 Python\n\nMac OS X 的安装只有一种形式：64 位。在执行安装之前，你必须从\
  \ Continuum Analytics 网站下载 Mac 软件副本。你可以在本章早前的“获取 Analytics Anaconda”部分中找到所需的下载信息。\n\
  \n安装文件有两种形式。第一种依赖图形化安装程序；第二种依赖命令行。命令行版本与本章“在 Linux 上安装 Python”部分描述的 Linux 版本非常相似。以下步骤帮助你使用图形化安装程序在\
  \ Mac 系统上安装 64 位 Anaconda：\n\n1.  **找到下载的 Anaconda 副本。**\n    文件名名称各不相同，但通常显示为 `Anaconda3-4.2.0-MacOSX-x86_64.pkg`。版本号作为文件名的一部分嵌入。在这种情况下，文件名指的是版本\
  \ 4.2.0，这是本书使用的版本。如果你使用其他版本，可能会在处理源代码时遇到问题，并在操作时需要进行调整。\n\n2.  **双击安装文件。**\n   \
  \ 出现一个窗口。\n\n3.  **点击继续。**\n    向导询问你是否想要阅读材料。现在你可以安全地跳过。\n\n4.  **点击继续。**\n   \
  \ 向导显示许可协议。务必阅读以了解使用条款。\n\n5.  **如果你同意许可协议，点击我同意。**\n    向导要求你提供 Anaconda 的安装目标。目标决定了是针对个人用户还是组。\n\
  \    ![警告](img/warning.png) 你可能会看到一条无法在系统上安装的消息。该错误是由安装程序的漏洞引起的，与你的系统无关。要消除错误消息，请选择“仅限个人”选项。\n\
  \n6.  **点击继续。**\n    安装程序显示包含安装类型选项的对话框。如果你想修改 Anaconda 的位置，点击安装位置（本书假设你使用默认路径 ~/anaconda）。如果你想修改安装程序的工作方式，点击自定义。例如，你可以选择不将\
  \ Anaconda 添加到 PATH 语句中。然而，本书假设你选择了默认安装选项，除非你在其他地方安装了 Python 3.5，否则没有理由更改它们。\n\n\
  7.  **点击安装。**\n    安装开始。进度条显示安装过程的进度。安装完成后，你会看到一个完成对话框。\n\n8.  **点击继续。**\n    你已准备好开始使用\
  \ Anaconda 了。\n\n## 在 Windows 上安装 Python\n\nAnaconda 为 Windows 带来了一个图形化安装程序，因此良好的安装意味着使用向导，就像安装任何其他程序一样。当然，在开始之前你需要一个安装文件的副本，你可以在本章早前的“获取\
  \ Analytics Anaconda”部分中找到所需的下载信息。\n\n1.  **在系统上找到下载的 Anaconda 副本。**\n\n\n\n\n\n\
  该文件的名称各异，但通常 32 位系统显示为 `Anaconda3-4.2.0-Windows-x86.exe`，64 位系统显示为 `Anaconda3-4.2.0-Windows-x86_64.exe`。版本号作为文件名的一部分嵌入其中。在此情况下，文件名指的是\
  \ `4.2.0` 版本，这也是本书使用的版本。如果你使用其他版本，可能会在源代码方面遇到问题，并在处理它时需要进行调整。\n\n### 2. 双击安装文件。\n\
  （你可能会看到一个“打开文件 – 安全警告”对话框，询问你是否要运行此文件。如果弹出此对话框，请点击`运行`。）你将看到一个 Anaconda 4.2.0 安装对话框，类似于图\
  \ 3-1 所示。你看到的具体对话框取决于你下载了哪个版本的 Anaconda 安装程序。如果你使用的是 64 位操作系统，始终使用 64 位版本的 Anaconda\
  \ 是最佳选择，这样可以获得最佳性能。这个第一个对话框会告诉你你拥有的是产品的 64 位版本。\n\n### 3. 点击“下一步”。\n向导会显示许可协议。请务必仔细阅读许可协议，以便了解使用条款。\n\
  \n### 4. 如果你同意许可协议，请点击“我同意”。\n系统会要求你选择何种安装类型，如图 3-2 所示。在大多数情况下，你只想为自己安装该产品。例外是你有多个人使用你的系统，并且他们都需要访问\
  \ Anaconda。\n\n### 5. 选择一种安装类型，然后点击“下一步”。\n向导会询问你将 Anaconda 安装在磁盘的何，如图 3-3 所示。本书假设你使用默认位置。如果你选择了其他位置，你可能需要在书的后部分修改某些操作步骤以适应你的设置。\n\
  \n### 6. 选择一个安装位置（如有必要），然后点击“下一步”。\n你将看到高级安装选项，如图 3-4 所示。这些选项默认被勾选，在大多数情况下没有正理由更改它们。如果\
  \ Anaconda 不提供你默认的 Python `3.5`，你可能需要更改它们。然而，本书假设你已使用默认选项设置了 Anaconda。\n\n### 7.\
  \ 修改高级安装选项（如有必要），然后点击“安装”。\n你你将看到一个带有进度条的“正在安装”对话框。安装过程可能需要几分钟，所以去给自己泡杯咖啡，读一会儿漫画。当安装过程完成后，你会看到`下一步`按钮变为可用。\n\
  \n### 8. 点击“下一步”。\n向导会提示你安装已完成。\n\n### 9. 点击“完成”。\n你准备好开始使用 Anaconda 了。\n\n![image](img/9781119330493-fg0301.png)\n\
