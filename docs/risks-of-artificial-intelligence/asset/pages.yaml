    that it will be able to work with merely a humongous amount of computing resource,
    rather than the Gödel machine in its simple and direct form, an infeasible amount
    of computing resource. This has not been proved and remains a tantalizing conjecture.


    # 7.3 ARGUMENT FOR GOLEM''S STEADFASTNESS


    Our main goal here is to argue that a program with (fixed) GOLEM metaarchitecture
    will be steadfast, in the sense that it will maintain its architecture (or stop
    acting) while seeking to maximize the goal function implicit in its GE.


    Why do we believe GOLEM can be steadfast? The basic argument, put simply, is that
    if


    +   The GE and environment together have the property that

    - World states involving conservative meta-architecture preservation tend to have
    very high fitness

    - World states not involving conservative meta-architecture tend to have very
    low fitness

    - World states approximately involving conservative meta-architecture preservation
    tend to have intermediate fitness

    - The initial OP has a high probability of leading to world states involving conservative
    meta-architecture preservation (and this is recognized by the GE)'
