    With armed border guards patrolling one side of the DMZ and the potential for
    North Korea to respond in, the darkly dystopian “science fiction” vision of two
    quasi-autonomous armies squaring up to each other begins to look all too; furthermore,
    given that one of the protagonists is an unstable nuclear armed state, the unintended
    dangers from a relatively minor military transgression, say a minor border incursion,
    escalating into a very serious, potentially nuclear, confrontation, begin to look
    alarmingly possible.


    # 12.4 BODY IN QUESTION


    I believe that the DwP reductio, John Searle’s “Chinese room argument” and Roger
    Penrose; reflections on the noncomputable nature of mathematical insight suggest
    we need to move away from purely computational explanations of cognitive processes
    and instead reflect on how meaning, teleology, and human creative processes are
    fundamentally grounded in the human body, society, and the world, obliging us,
    in turn, to take issues of embodiment—the body and our social embedding—much more'
