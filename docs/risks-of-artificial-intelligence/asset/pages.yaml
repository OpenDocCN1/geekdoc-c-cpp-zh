    The various tools and analyses were applied in case studies to five famous AI
    predictions: the original Dartmouth conference, Dreyfus'' criticism of AI, Searle''s
    Chinese room thought experiment, Kurzweil''s 1999 predictions, and Omohundro''s
    “AI drives” argument. This demonstrated the great difficulty of assessing the
    reliability of AI predictions at the time they were made; by any reasonable measures,
    the Dartmouth conference should have been expected to be more accurate than Dreyfus.
    The reality, of course, was completely opposite. Though there are some useful
    tools for assessing prediction quality, they should definitely be used, provide
    only weak evidence. The only consistent message was that all predictors were overconfident
    in their verdicts, and that model-based predictions were superior to those founded
    solely on expert intuition.


    It is hoped that future predictors (and future predictor assessors) will follow
    in the spirit of these examples and make their assumptions explicit, their methods
    clear, their predictions testable, and their uncertainty greater. This is not
    limited to statements about AI—there are many fields where the “toolbox” of methods
    described could be used to analyze and improve their predictions.


