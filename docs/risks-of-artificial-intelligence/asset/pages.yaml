    would achieve 10^10 gigaflocks in a 1 mm cube weighing 1 mg and dissipating 1
    kW of energy. He also describes a nanosystem for manufacturing that would be capable
    of producing 1 kg per hour of atomically precise matter and would use 1.3 kW of
    energy and cost about $1 kilogram.


    A single system would optimally configure its physical resources for computation
    and construction by making them spatially compact to minimize communication delays
    and eutectic, adiabatic, and reversible to minimize free energy usage. In a conflict,
    however, the pressures are quite different. Systems would spread themselves out
    for better defense and compute, act rapidly to outmaneuver the adversarial system.
    Each system would try to force the opponent to use large amounts of its resources
    to sense, store, and predict its behaviors.


    It will be important to develop detailed models for the likely outcome of conflicts,
    but certain general features can be easily understood. If a system has too little
    matter or too little free energy, it will be incapable of defeating itself or
    of successfully attacking another system. However, if an attacker has resources
    which are a sufficiently large multiple of a defender''s, it can overcome it by
    devoting subsystems with sufficient resources to reach each small subsystem of
    the defender. It appears that there is intermediate regime in which a defender
    can survive for long periods in conflict with a superior attacker whose resources
    are not a sufficient multiple of the defender''s. To have high confidence that
    harmful systems can be stopped, it will be important to know what multiple of
    their resources will be required by an enforcing system. If systems are sufficiently
    powerful to prevail in a military conflict, then peaceful negotiations are much
    more likely to succeed.


    # 2.8 SAFE-AI SCAFFOLDING STRATEGY


    To ensure greater human good over the longer term, autonomous technology must
    be designed and deployed in a very careful manner. These systems have the potential
    to solve many of today''s problems, but they also have the potential to create
    many new problems. We have seen that the computational infrastructure of the future
    must protect against harmful autonomous systems.


    We also make decisions in alignment with the best of human values and principles
    of good governance. Designing that infrastructure will probably require the use
    of powerful autonomous systems. Therefore, the technologies we need to solve the
    problems themselves may cause problems.


    To solve this conundrum, we can learn from an ancient architectural principle.
    Stone arches have been used in construction the second'
  merge: -1
  pgno: 33
- img_proc: true
  md: '# Autonomous Technology and the Greater Human Good ■ 25


    millennium BC. They are stable structures that make good use of stone''s ability
    to resist compression. By partially constructed arches are unstable. Ancient builders
    created the idea of first building a wood form on top of which the stone arch
    could be built. Once the arch was completed and stable, the wood form could be
    removed.


    We can safely develop autonomous technologies in a similar way. We build a sequence
    of provably safe autonomous systems which are used in the construction of more
    powerful and less limited successor systems. The early systems are used to model
    human values and governance structures. They are also used to construct proofs
    of safety and other desired characteristics for more complex and less limited
    successor systems. In this way, we can build up the powerful technologies that
    can serve the greater human good without significant risk along the development
    path.


    Many new insights and technologies will be required during this process. The field
    of positive psychology was formally introduced only in 1998. The formalization
    and automation of human strengths and virtues will require much further study
    (Peterson & Seligman, 2004). Intelligent systems will also be required to model
    the game theory and economics of different possible governance and legal frameworks.


    The new infrastructure must also detect dangerous systems and prevent them from
    causing harm. As robotics, biotechnology, and nanotechnology develop and become
    widespread, the potential destructive power of harmful systems will grow. It will
    become increasingly crucial to detect harmful systems early, preferably before
    they are deployed. That suggests the need for pervasive surveillance which must
    be balanced against the desire for freedom (Brin, 1998). Intelligent systems may
    introduce new intermediate possibilities that restrict surveillance to detecting
    precisely specified classes of dangerous behavior while provably keeping others
    private.


    In conclusion, it appears that humanity''s great challenge for this century is
    to extend cooperative human values and institutions to autonomous technology for
    the greater good. We have described some of the many challenges in quest but have
    also outlined an approach to meeting those challenges.


