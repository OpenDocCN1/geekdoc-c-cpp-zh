    # 8.2.2 Representational Minimum Description Length Principle as the Basis for
    Generalized States


    There were two main reasons to introduce the representational minimum description
    length (RMDL), namely, adaptive selection of the reference machine and reduction
    of computational costs (Potapov & Rodionov, 2012). However, it appeared that this
    principle is also suitable for solving the problem of value learning because it
    allows for incremental generalization of states. Let us introduce the RMDL principle.


    On the one hand, search for holistic model for some long data string is computationally
    very inefficient, and one would like to reconstruct parts of the model independently.
    Moreover, practical applications frequently require independent analysis of separate
    data pieces (e.g., separate images). On the other hand, summed Kolmogorov complexity
    of some data pieces $f_i$ is usually much higher than complexity of their concatenation:
    $K(f_1...f_n) << K(f_1)...K(f_n)$. Thus, decomposition of universal induction
    for $f_1...f_n$ into separate tasks for its substrings is inadmissible.


    In practice, data pieces are described within certain representations containing
    general regularities characteristic for this data type. Representations can be
    treated as programs which can reconstruct any data piece given its description
    (and there is an appropriate description for any data piece). Thus, one would
    like to have such program $S$ that for any $f$, there is $q$: $U(Sqi)=f_i$. Such
    program $S$ will satisfy the general notion of representation. In accordance with
    information theoretic criterion, one would also like to choose this program in
    such a way that $l(S)+\sum l(q)$ is minimal (most close to $K(f...)$, and each
    $q$ is the description of $f_i$ within $S$). This is the basic idea behind the
    RMDL principle.


    In the case of the agent, the best representation $S$ can be constructed for decomposition
    $U(S,y_k)=x_{k+1m_k}$ of the holistic agent into submodels $U(S\{q_1...q_n\}y_k)=x_{ik}$.
    Models $q_i$ can stand for generalized states within the environment representation
    $S$. Of course, it is problematic to construct $S$ on the base of initial history
    and to use this representation further without any changes because it will become
    not optimal for new data pieces. Arbitrary changes in $S$ are undesirable, because
    will violate previous bindings of generalized states and values, which we would
    like to introduce.


