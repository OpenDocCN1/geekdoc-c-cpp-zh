  md: '# Ethics of Brain Emulations ■ 225


    Conversely, counterparts to practices that reduce suffering such as analgesic
    practices should be developed for emulated systems. Many of the best practices
    discussed in the work of Schofield (2002) can be readily implemented: brain emulation
    technology by definition allows parameters of the emulation that can be changed
    to produce the same functional effect as the drugs in the real nervous system.
    Addition, pain systems in theory can be perfectly controlled in emulations (e.g.,
    by inhibiting their output), producing “perfect painkillers.” However, this is
    all based on the assumption that we understand what is involved in the experience
    of pain: if there are undiscovered systems of suffering, research can produce
    undetected distress.


    It is also possible to run only part of an emulation, for example, leaving out
    or blocking nociceptors, the spinal or central pain systems, or systems related
    to consciousness. This could be done more exactly (and reversibly) than in biological
    animals. Emulations can also be run for brief spans of time, not allowing any
    time for a subjective experience. But organisms are organic wholes with densely
    interacting parts: such ethics would no doubt exist situations where experiments
    hinge upon the whole behaving organism, including its aversive experiences.


    It is likely that early scans, models, and simulations will often be flawed. Flawed
    scans would be equivalent to animals with local or global brain damage. Flawed
    models would introduce systemic distortions, ranging from the state of not having
    any injury to abnormal brain states. Flawed simulations (broken off because of
    software crashes) would correspond to premature death (possibly repeated, with
    no memory—see later). Viewed in analogy with animals, it seems that the mean worry
    should be flawed models producing hard-to-detect suffering.


    Just like animal research, it is possible to develop best practices. We can approximate
    enough of the inner life of animals from empirical observations to make some inferences;
    the same process is in principle possible with emulations to detect problems peculiar
    to their state. In fact, the transparency of an emulation to data gathering makes
