    Note that the GE may need to be very smart indeed to do its job. However, an important
    idea of the architecture is that the optimization of the GE''s functionality may
    be carried out as part of the system''s overall learning.


    In its initial and simplest form, the GE''s internal OP (GEOP) could be a giant
    simulation engine which tells you, based on a codified definition of the goal
    function: in world-state W, the probability distribution of goal satisfaction
    values is as follows: It could also operate in various ways, for example, by requesting
    human input when it gets confused in evaluating the desirability of a certain
    hypothetical world state; by doing similarity matching according to a codified
    distance measure against a set of desirable world states; and so on.


    However, the metaprogram may supplement the initial “base GEOP with an intelligent
    GEOP, which is learned by the Searcher, after the Searcher is given the goal of
    finding a program that will


    +   - Accurately agree with the base GEOP across the situations in the HR, as
    determined by the tester.

    - Be compact as possible.


    In this approach, there is a “base GE” that may use simplistic methods, but then
    the system learns programs that do approximately the same thing as this but perhaps
    faster and more compactly, and potentially embodying more abstraction. Because
    this program learning the specific goal of learning efficient approximations to
    what the GE does, it is not susceptible to “cheating” in which the system revises
    its goals to make them easier to achieve (unless the whole architecture gets broken).


    What is particularly interesting about this mechanism is as follows: it provides
    a built-in mechanism for extrapolation beyond the situations for which the base
    GEOP was created. The tester requires that the learned GEOPs must agree with the
    base GEOP on the HR, but for cases not considered in the HR, the metaprogram is
    then doing Occam’s Razor-based program learning, seeing a compact and hence rationally
    generalizable explanation of the base GEOP.


    > This general idea was introduced by Abram Demski upon reading an earlier draft
    of this article, though he may not agree with the particular way we have improvised
    on this idea.'
