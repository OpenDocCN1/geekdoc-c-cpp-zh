    # 7.4 PARTIAL FORMALIZATION OF THE ARCHITECTURE AND STEADFASTNESS ARGUMENT


    To formalize the above conceptual argument, we use a formal agent model that is
    inspired by the model used in the work of Legg and Hutter (2007) but with the
    significant difference of not involving rewards. In the GOLEM framework, the GE
    is used in place of the reward function.


    # 7.4.1 Simple Formal Agent Model


    Consider a class of active agents that observe and explore their environment and
    also take actions in it, which may affect the environment. Formally, the agent
    sends information to the environment by sending symbols from some finite alphabet
    called the *action space*, denoted $\Sigma$ and the environment sends signals
    to the agent with symbols from an alphabet called the *perception space*, denoted
    $\mathcal{P}$.


    Sometimes, it is useful to consider agents that can also experience rewards, which
    lie in the *reward space*, denoted $\mathcal{R}$, for each agent is a subset of
    the rational unit interval. GOLEM is not a reward-based architecture, but a little
    later we will contrast GOLEM with reward-based architectures. In the case of a
    non-reward-based architecture, in the formal model all rewards $r_i \in \mathcal{R}$
    may be assumed constant.


    The agent and the environment are understood to take turns sending signals back
    and forth, yielding a history of actions, observations, and rewards, which may
    be denoted


    ```

    $a_1x_1r_1a_0x_2r_2\dots$

    ```


    or else


    ```

    $a_1x_1a_2x_2\dots$

    ```'
