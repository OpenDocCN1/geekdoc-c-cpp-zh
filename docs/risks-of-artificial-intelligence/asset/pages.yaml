  md: '# 278 ■ Risks of Artificial Intelligence


    (as described earlier) precisely illustrate why it is easy to concur that already
    current AI systems pose a real “existential threat” to humanity—the threat of
    artificial stupidity. For this reason, in May 2014, members of the ICRAC gathered
    in Geneva to participate in the first meeting ever lethal autonomous weapons systems
    (LAWS)—a debate that continues to that day at the very highest levels of the United
    Nations, in a firm, refracted, of Warwick and Hawking on AI—I think we should
    be very concerned.


    Nonetheless, it is equally obvious that even-current AI has a rich potential to
    transform society from the “trivial” replacement of tedious human labor (e.g.,
    by controlling robots to clean the floor and mow the lawn) to a more complex new
    role as an international social facilitator (by helping people communicate easily
    by instantaneously offering an approximate translation from one language to another),
    to helping the State substantially better use of public resources (e.g., one project
    that I was personally closely involved with—the UKPLC “Spendinsight” system—has
    been recently evaluated by the UK National Audit Office and used to identify potential
    saving in the UK National Health purchasing budget in excess of £500 million per
    annum [32,33]; if such savings were realized, they would buy a significant number
    of additional frontline doctors, nurses, and drugs.


    Already, post “Lighthill,” post “connectionist winter,” and post the recent realization
    of ambitious real-world, nouveau AI, machine learning, big data systems is tempting
    the engineered geek in me too many lucrative, new, and seductive headline images,
    any one of which could easily prompt me to fall headstrong-in-love with AI again.


