  md: '# ABSTRACT


    Whole brain emulation attempts to achieve software intelligence by copying the
    function of biological nervous systems into software. This chapter aims at giving
    an overview of the ethical issues of the brain emulation approach, and analyze
    how they should affect responsible policy for developing the field. Animal emotions
    have uncertain moral status, and a principle of analogy is proposed for judging
    virtual animals. Various considerations of developing and using human brain emulations
    are discussed.


    # 10.1 INTRODUCTION


    Whole brain emulation (WBE) is an approach to achieve software intelligence by
    copying the functional structure of biological nervous systems into software.
    Rather than attempting to understand the high-level processes underlying perception,
    action, emotions, and intelligence, the approach assumes that they would emerge
    from a sufficiently close imitation of the low-level neural functions, even if
    this is done through a software process (Merkle, 1989; Sandberg & Bostrom, 2008).


    Unlike philosophy (Chalmers, 2010), impact (Hanson, 2008), and feasibility (Sandberg,
    2013) of brain emulations have been discussed, little analysis of the ethics of
    the project so far has been done. The main questions of this chapter are to what
    extent brain emulsions are moral patients and what new ethical concerns are introduced
    as a result of brain emulation technology.


    # 10.1.1 Brain Emulation


    The basic idea is to take a particular brain, scan its structure in detail at
    some resolution, and construct a software model of the physiology that is so faithful
    to the original, when run on appropriate hardware, it will have an internal causal
    structure that is essentially the same as the original brain. All relevant functions
    on some level of description are present and higher level functions supervene
    from these.


    Although at presenting an unfeasibly ambitious challenge, the necessary computing
    power and various scanning methods are rapidly developing. Large-scale computational
    brain models are a very active research area, at present reaching the size of
    mammalian nervous systems (Markram, 2006; Djurfelfeldt et al., 2008; Eliasmith
    et al., 2012; Preissl et al., 2012). WBE can be viewed as the logical endpoint
    of current trends in computational neuroscience and systems biology. Obviously
    the eventual'
  merge: -1
  pgno: 223
- img_proc: true
  md: '# Ethics of Brain Emulations ■ 215


    feasibility depends on a number of philosophical issues (physicalism, functionalism,
    non-organicism) and empirical facts (computability, scale separation, detectability,
    scanning, and simulation tractability) that can-be predicted beforehand; WBE can
    be viewed as a program trying to test them empirically (Sandberg, 2013).


    Early projects are likely to merge data from multiple brains that can produce
    a sufficiently rich model to produce nontrivial behavior but not attempting to
    emulate any particular individual. However, it is not clear that this can be carried
    out indefinitely: higher mammalian brains are organized and simultaneously individualized
    through experience, and linking parts of different brains is unlikely to produce
    functional behavior. This means that the focus is likely to move to developing
    a “pipeline” from brain to executable model, where ideally an individually learned
    behavior of the original animal is demonstrated by the resulting emulation.


    Although WBE focuses on the brain, a realistic project will likely have to include
    a fairly complex body model in order to allow the emulated nervous system to interact
    with a simulated or real world, as well as the physiological feedback loops that
    influence neural activity.


    At present the only known methods to generate complete data at cellular and subcellular
    resolution are destructive, making the scanned brain nonviable. For a number of
    reasons, it is unlikely that nondestructive methods will be develope any time
    soon (Sandberg & Bostrom, 2008, Appendix E).


    In the following, I will assume that WBE is doable, or at least does not suffer
    enough roadblocks to preclude attempting it, in order to examine the ethics of
    pursuing the project.


    # 10.2 VIRTUAL LAB ANIMALS


    The aim of brain emulation is to create systems that closely imitate real biological
    organizations in terms of behavior and internal causal structure. Although the
    ultimate ambitions may be great, there are many practical uses of intermediate
    realistic organic simulations. In particular, emulations of animals could be used
    instead of real animals for experiments in education, science, medicine, or engineering.
    Opponents of animal testing often argue that much of it is excessive and could
    be replaced with simulations. Although the current situation is debatable, in
    a future where brain emulations are possible it would seem this would be true:
    definition, emulations would produce the same kind of results as real animals.'
  merge: -1
  pgno: 224
- img_proc: true
  md: '# 216 ■ Risks of Artificial Intelligence


    However, there are three problems:


    +   - Brain emulations might require significant use of test animals to develop
    the technology.


    +   - Detecting something is is a perfect emulation might be impossible.


    +   - An emulation might hold the same moral weight as a real animal by being
    sentient or being with inherent value.


    # 10.2.1 Need for Experiments


    Developing brain emulation is going to require the use of animals. It would be
    necessary not only for direct scanning into emulations, but also in various experiments
    for gathering the necessary understanding of neuroscience, testing scanning modalities,
    and comparing the real and simulated animals. In order to achieve a useful simulation,
    we need to understand at least one relevant level of the real system well enough
    to recreate it, otherwise the simulation will not produce correct data.


    What kind of lab animals would be suitable for research in brain emulation and
    how would they be used? Present neuroscientists use nearly all species, from nematode
    worms to primates. Typically there are few restrictions on research on invertebrates
    (with the exception of cephalopods). Although early attempts are likely to aim
    at simple, well-defined nervous systems such as the nematode Caenorhabitis elegans,
    Lymnaea stagnalis (British pond snail), or Drosophila melanogaster (fruit fly),
    the neuroscience tool development will likely involve standard vertebrate lab
    animals such as mice, either for in vitro experiments or in vivo experiments attempting
    to map neural function to properties that can be detected. The nervous system
    of invertebrates also differ in many ways from the mammalian nervous system; although
    they might make good test benches for small emulations, it is likely that the
    research will need to move towards small animals that can be scaled up to larger
    brains and bodies. The final stages in animal brain emulation before moving on
    to human emulation would likely involve primates, raising the strongest animal
    protection issues. In theory this stage might be avoidable if the scaling up from
    smaller brains towards humans seems smooth enough, but this would put a greater
    risk on the human test subjects.


    Most "slice and dice" scanning (where the brain is removed, fixated, and then
    analyzed) avoids normal animal experimentation concerns'
  merge: -1
  pgno: 225
- img_proc: true
  md: '# Ethics of Brain Emulations ■ 217


    because there is no experiment done on the living animal itself, just tissue extraction.
    This is essentially terminal anesthesia ("unclassified") in UK classification
    of suffering. The only issue here is the prescribing treatment, whether there
    any harm to the animal in its life coming to an end, and whether in silico suffering
    possible.


    However, developing brain emulation techniques will likely also involve experiments
    on living animals, testing whether an in vivo preparation behaves like an in vitro
    and in silico model. This will necessitate using behaving animals in ways that
    could cause suffering. The amount of such research needed is present hard to estimate.
    If the non-organism assumption of WBE is correct, most data gathering and analysis
    will deal with low-level systems such as neuron physiology and connectivity rather
    than the whole organism; if all levels are needed, then the fundamental feasibility
    of WBE is cast into question (Sandberg, 2013).


    # 10.2.2 What Can We Learn from Emulations?


    The second problem is equivalent to the current issue of how well animal models
    map onto human conditions, or more generally how much models and simulations in
    science reflect anything about reality.


    The aim is achieving structural validity (Zeiegler, 1985; Zeiegler, Praehofer,
    & Kim, 2000) that the emulation reflects the real system operates. Unfortunately
    this might be impossible to prove: could exist hidden properties that only very
    come into play that are not represented. Even defining meaningful and observable
    measures of success is nontrivial when dealing with higher order systems (Sandberg,
    2013). Developing methods and criteria for validating neuroscience models is one
    of the key requirements for WBE.


    One of the peculiar things the brain emulation program is that many scientific
    projects the aim is not fully understanding of the system that is being simulated.
    Rather, the simulation is used as a verification of our low-level understanding
    of neural systems and is intended as a useful tool. Once successful, emulations
    become a very powerful tool for further investigations (or valuable in themselves).
    Before that stage, the emulation does not contribute much knowledge about the
    full system. The WBE project: the cost and animals are not outweighed by returns
    in the form of useful scientific knowledge. However, sometimes very risky projects
    are worth doing because they promise large eventual returns (consider the Panama
    Canal) or might have unexpected but significant'
  merge: -1
  pgno: 226
- img_proc: true
  md: '# 218 ■ Risks of Artificial Intelligence


    spin-offs (consider the Human Genome Project). Where the balance depends on both
    how the evaluations are made and the degree of long-term ambition.


    # 10.2.3 What Is the Moral Status of an Emulation?


    The question what consideration we should give to animals lies at the core of
    the debate about animal experimentation ethics. We can pose a similar question
    about what moral claims emulations have on us. Can they be wronged? Can they suffer?


    Indirect theories argue that animals do not merit moral consideration, but the
    effect of human actions on them does. The classic example is Kantian theories,
    where animals lack moral autonomy and hence are not beings whose interests morally
    count. Our duties toward them are merely indirect duties toward humanity. Being
    cruel to animals harms our own humanity:


    > Our duties towards animals are merely indirect duties towards humanity. Animal
    nature has analogies to human nature, and by doing our duties to animals in respect
    of manifestations of human nature, we indirectly do our duty to humanity ....
    We can judge the heart of a man by his treatment of animals.


    > REGAN & SINGER, 1989, PP. 23–24


    By this kind of indirect account, the nature of the emulation does not matter:
    if it is cruel to pinch the tail of biological mice, the same cruel impulse is
    present in pinching the tail of an emulated mouse. It is like damaging an effigy:
    it is the intention behind doing damage that is morally bad, not the damage. Conversely,
    treating emulations might be like treating dolls well; it might not be obligatory
    but its compassionate.


    A different take on animal moral consideration comes from social contract or feminist
    ethics, arguing against the individualist bias they perceive in the other theories.
    What matters is intrinsic properties but the social relations we have with animals.


    Moral considerability is not an intrinsic property of any creature, nor is it
    supervenient on only its intrinsic properties, such as its capacities. It depends,
    deeply, on the kind of relations we can have with


    > ANDERSON, 2004, P. 289'
  merge: -1
  pgno: 227
- img_proc: true
  md: '# Ethics of Brain Emulations ■ 219


    If we have the same kind of relations to an emulated animal as a biological animal,
    they should be treated similarly. Because successful emulations (by assumption)
    also have the capacity to form reciprocal relations, this seems likely.


    Another large set of theories argues that the interests of animals do not count
    morally due to intrinsic properties. Typically they are based on the sentience
    of animals giving them moral status: experiences of pleasure or suffering are
    morally relevant sets no matter what systems they experience. Whether animals
    are sentient or not is usually estimated from the argument from analogy, which
    supports claims of consciousness by looking at similarities between animals and
    human beings. Species membership is not a relevant factor. These theories differ
    on whether human interests can still trump animal interests or whether animals
    actually have the same moral status as humans. For the present purpose, the important
    question is whether software emulations can sense, consciousness, or the other
    properties these theories ground moral status.


    Animal rights can be argued on other grounds than sentience, such as animals having
    beliefs, desires, and self-consciousness of their own, and hence having inherent
    value and rights as subjects of a life that has inherent value (Regan, 1983).
    Successfully emulated animals would presumably behave in similar ways: the virtual
    mouse will avoid virtual pain; the isolated social animal will behave in a lonely
    fashion. Whether the mere behavior of loneliness or pain avoidance is an indication
    of a moral interest even when we doubt it is associated with any inner experience
    is problematic: most accounts of moral patithood take experience as fundamental,
    because that actually ties the state of affairs to a value, the welfare of something.
    But theories of value that ascribe value to nonagents can cause all nonscientious
    software as a moral patient (e.g., having value by virtue of its unique complexity).


    To my knowledge, nobody has yet voiced concern that existing computational simulations
    have aversive experiences. In fact, the assumption that simulations do not have
    phenomenal consciousness is often used to motivate such research:


    Secondly, one of the more obvious features of mathematical modelling is that it
    is not invasive, and hence could be of great advantage in the study of chronic
    pain. There are major ethical problems with the experimental study of chronic
    pain in humans and animals. It is possible to use mathematical modelling to test
    some of the neurochemical and neurophysiological features of chronic pain'
  merge: -1
  pgno: 228
- img_proc: true
  md: '# 220 ■ Risks of Artificial Intelligence


    without the use of methods which would be ethically prohibitive in the laboratory
    or clinic. Stembach has observed “Before inflict-pain on humans, can mathematical
    or statistical modelling provide answers to the questions being considered?” (p.
    262) (53). We claim that mathematical modelling has the potential to add something
    unique to the armament of the pain researcher.


    BRITTON & SKEVINGTON, 1996, P. 1139


    To some degree, this view is natural because typical computational simulations
    contain just a handful of neurons. It is unlikely that small systems could suffer.
    However the largest simulations have reached millions or billions of neurons:
