    exploration. Quite opposite, we want it to follow social values, even when transmission
    of social rewards is stopped, but also accounting for dynamic somatic rewards.


    Let us consider State-Action-Reward-State-Action (SARSA) with ε-greedy. It uses
    the following well-known update rule:


    ```

    Q(s_t, a_t) \leftarrow Q(s_t, a_t) + \alpha[r_t + \gamma Q(s_{t+1}, a_{t+1}) -
    Q(s_t, a_t)] \quad (8.3)

    ```


    where:

    $s_t, a_t,$ and $r_t$ are state, action and reward on cycle $t$, respectively

    $\gamma$ is the discount factor


    Q(s,a) is the expected future rewards after performing action $a$ in state $s$


    Reward $r$ incorporates social rewards during some sensitivity period, so $r_t
    = r^{(1)}_t + r^{(2)}_t$, where $r^{(k)}_t = R^{(k)}(s_{t+1}, a_t)$. After this
    period (or formation of the next level of representation), values learned by conventional
    SARSA update rule (8.3) are memoized $Q''(s'', a_t) = Q(s'', a_t)$. They are further
    used as the additional reward term:


    ```

    Q(s_t, a_t) \leftarrow Q(s_t, a_t)\n+\alpha[r_t + (1-\gamma)\gamma_m Q(s''_t,
    a_t) + \gamma Q(s_{t+1}, a_{t+1}) - Q(s_t, a_t)] \quad (8.4)

    ```


    where $\gamma_m$ is some additional factor necessary to balance the influence
    of social and somatic rewards (it is needed because one would like to amplify
    social rewards during sensitivity period and compensate this amplification afterward).


    More specifically, the following stages in our experiments were used:


    +   1. The agent receives $r^{(1)} + r^{(2)}$ as the reward during the first stage
    (some number of iterations). The agent memor learned $Q''$ at the end of the first
    stage. Moreover (and this is crucial), the somatic rewards $R^{(1)}(s''|s)$ is
    randomly changed at the end of the first stage.

    2. The agent receives only (new) $r^{(1)}$ and if possible uses it in combination
    with $Q''$ (or $r^{(2)}$) with testing purpose).

    3. After some learning time, the frequency of "bad actions" (leading to the dangerous
    state) and the mean of the reward $r^{(1)} + r^{(2)}$ per action are calculated
    ("true social rewards") were averaged, even if the agent was actually using $r^{(1)}$
    or $r^{(1)} + Q''$ as the reward.'
