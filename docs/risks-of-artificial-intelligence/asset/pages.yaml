    Causal models are a staple of physics and the harder sciences: given certain facts
    about the situation under consideration (momentum, energy, charge, etc.), a conclusion
    is reached about what the ultimate state will be. If the facts were different,
    the end situation would be different.


    Outside of the hard sciences, however, causal models are often a luxury, by the
    underlying causes are not well understood. Some success can be achieved with noncausal
    models: without understanding what influences one, one can extrapolate trends
    into the future. Moore''s law is a highly successful noncausal model (Moore 1965).


    In the outside view, specific examples are grouped together and claimed to be
    examples of the same underlying trend. This trend is to give further predictions.
    For instance, one could notice the many analogs of Moore''s law across the spectrum
    of computing (e.g., in numbers of transistors, size of hard drives, network capacity,
    pixels per dollar), note that AI is in the same category, and hence argue that
    AI development must follow a similarly exponential curve (Kurzweil 1999). Note
    that the use of the outside view is often implicit rather explicit; rarely is
    it justified why these examples are grouped together, beyond general plausibility
    or similarity arguments. Here detecting uses of the outside view will be part
    of the task of revealing hidden assumptions (see Section 3.3.2). There is evidence
    that the use of the outside view provides improved prediction accuracy, at least
    in some domains (Kahneman and Lovallo 1993).


    Philosophical arguments are common in the field of AI. Some simple impossibility
    statements: vary. More thoughtful philosophical arguments highlight problems that
    need to be resolved in order to achieve AI, investigating approaches for doing
    so, and potential issues that might emerge if AIs were to be built.'
