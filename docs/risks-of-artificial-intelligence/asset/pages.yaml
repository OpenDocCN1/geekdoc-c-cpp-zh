    historical precedent for humans behaving well when they suddenly come into large
    amounts of political power does not seem particularly encouraging.


    11.4.4 Other Decisive Technological Advantage


    The development of atomically precise manufacturing, whole brain emulations, or
    some otherably revolutionary technology could enable a private project or government(s)
    to gain a decisive strategic advantage, and then to enact a proactive or reactive
    empowered project strategy. Whatever advantage was found to be powerful enough
    to allow the empowered project to find and halt unsafe AI development globally,
    or to detect and prevent AI catastrophes as they begin. Perhaps whole brain emulation¹
    or atomically precise manufacturing² would be sufficient for this purpose, or
    perhaps further comparable sources of advantage have yet to be discovered.


    # 11.5 CONCLUSION


    Starting from the assumption that an AI could improve rapidly enough to gain a
    decisive strategic advantage, I have argued that the exponential decay model of
    fast takeoff-risk captures the most important features of the situation. After
    describing the most relevant concerns, I have reviewed the four strategies that
    they could possibly end the period of risk: international coordination, sovereign
    AI, AI-empowered project, and other decisive technological advantage.


    > ¹ Sandberg and Bostrom, Whole Brain Emulation: A Roadmap.


    > ² Drexler, Radical Abundance: How a Revolution in Nanotechnology Will Change
    Civilization.'
