    # 7.2.2 Conservative Meta-Architecture Preservation


    Next, the GOLEM meta-architecture assumes that the goal embodied by the GE includes,
    as a subgoal, the preservation of the overall meta-architecture described earlier
    (with a fallback to inaction if this seems infeasible). This may seem a nebulous
    assumption, but it is not hard to specify if one thinks about it the right way.


    For instance, one can envision each of the items in the above list as occupying
    a separate hardware component, with messaging protocols established for communicating
    between the components along cables. Each hardware component can be assumed to
    contain some control code, which is connected to the I/O system of the component
    and also the rest of the component''s memory and processors.


    Then what we must assume is that the goal includes the following criteria, which
    we will call *conservative meta-architecture preservation*:


    +   1. No changes to the hardware or control code should be made except in accordance
    with the second criterion.

    2. If changes to the hardware or control code are found, then the system should
    stop acting (which may be done in a variety of ways, ranging from turning off
    the power to self-destruction; we will leave that unspecified for the time being
    as that is not central to the point we want to make here).


    Any world that violates these criteria should be rated extremely low by the GE.


    # 7.2.3 Complexity and Convergence Rate


    One might wonder why such a complex architecture is necessary. Why not just use,
    say, Schmidhuber''s Gödel machine (Schmidhuber 2006)? This is an architecture
    that, in theory, can take any goal function and figure out how to achieve it in
    a way that is optimally given its current knowledge and capabilities—including
    figuring out how to modify it so that it can better achieve the goal in the future,
    after if the specifics of the GOLEM architecture are a good idea, then a Gödel
    machine should eventually transform itself into a GOLEM.


    The catch, however, lies in the word “eventually.” Depending on the situation
    and the computational resources available, a Gödel machine might'
