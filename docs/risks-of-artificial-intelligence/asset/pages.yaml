  md: Next, Freeman (2009) has articulated a relatively simple (only 1000 lines of
    code in Python) theory of how an AGI could be motivated by something akin to "compassion
    and respect." Under this framework, a machine would be trained on past observations
    of the world and would learn the preferences of the people inhabiting it, and
    would seek to maximize the sum of the utility functions of people. Like CEV, this
    theory is not neutral *vis-à-vis* ethical theory, but reflects utilitarian assumptions
    and is as vulnerable to arguments against utilitarianism. Nevertheless, a few
    specific comments can be made about this proposal. First, as noted by Freeman,
    the compassion/respect approach is specifically designed to work with infinite
    computing resources, and as it is unclear whether any suitable approximation could
    be developed for actual systems. Second, inferring utility functions from behavior
    is problematic. Although extrapolation-based approaches such as CEV also have
    their problems, it is also the case that taking people's desires at face value
    is an insufficient basis for a moral system used by an extremely powerful agent.
    For example, imagine that the majority of the world exhibits some prejudiced tendencies
    directed toward a certain group of people. Such a system,
  merge: -1
  pgno: 114
- img_proc: true
  md: 'based solely to maximizing global utility, could exterminate those people in
    attempt to appease the prejudiced majority. Third, it is not clear that the rhetorical
    move made by Freeman from maximizing people''s utility functions to characterizing
    this as akin to “compassion and respect” is appropriate. As noted in Section 5.2,
    utilitarian has been judged by some as not taking sufficiently seriously the integrity
    and separateness of persons. A strictly maximizing this theory such as Freeman''s
    compassion/respect approach would seem to lead to many counterintuitive conclusions
    such the sacrificing of an innocent person to provide organs to others who need
    organs (in a common consequentialism), and Freeman''s approach gives no way to
    reason about the trade-offs between such utility maximizing decisions and the
    broader utilitarian implications of acting on such “cold” logic, which may also
    be computationally intractable.


    Finally, Waser (2011) defends an approach entitled “RUB”, which he argues is grounded
    in evolutionary theory and “simpler, safer, and wiser” than Friendly AI/CEV. Rather
    than seeking to create a purely selfless maximizer, Waser argues that we should
    develop systems that find cooperation to be in their own self-interest (because,
    in fact, it is) and that see the flourishing of a cooperative society as a motivating
    goal. Such a system would conclude that actions “defending humans, the future
    of humankind, and the destiny of humankind” are rationally required and would
    carry them out. It should be fairly clear from the earlier discussion that there
    are computational issues with Waser’s approach, and there is fine line between
    rational universal good and rational universal evil (in the sense that each demands
    action on a large spatiotemporal scale). Given, the potential for ethical “black
    swans” arising from complex social system dynamics, it will not always be clear
    how a RUB system would act in the real world, and what the actual consequences
    would be. Furthermore, as Shulman (2010) argues, the propensity of an agent to
    cooperate depends, on other factors, on the probability it being able to attain
    resources through cooperation versus conflict. Thus, Waser’s proposal may make
    sense in particular situations where cooperation is, in fact, desirable for the
    agent, but may fail if the intelligence or power differential becomes so great
    that an agent decides to take over the world and maximize its own utility and
    that of its descendants, which it perceives as having more potential value than
    that of existing humans (see, e.g., Robert Nozick’s famous utility monster as
    an example of such logic).'
