  md: '# Editorial


    # Risks of Artificial Intelligence


    Vincent C. Müller


    +   CONTENTS

    1.1 Introduction: Risk of Artificial Intelligence 1

    1.2 Risks of AI 2

    1.3 Chapters 3

    1.4 Outlook: Ethics and Existential Risks of AI 5

    References 5


    ABSTRACT If the intelligence of artificial systems were to surpass that of humans
    significantly, humanity would face a significant risk. The time has come to deconsider
    these issues, and consideration must include progress in artificial intelligence
    (AI) as much as insights from the theory of AI. The chapters in this volume try
    to make cautious headway in setting the problem, evaluating predictions on the
    future of AI, proposing ways to ensure that AI systems will be beneficial to humans,
    and critically evaluating such proposals.


    # 1.1 INTRODUCTION: RISK OF ARTIFICIAL INTELLIGENCE


    This is the first volume of papers ever dedicated to the risks of AI and it originates
    from the first conference on the risks of AI (AGI Impacts, Oxford, December 2012).
    Following that conference, was published a volume of selected papers in the Journal
    of Experimental and Theoretical Artificial Intelligence (JETAI) (see Müller, 2014).
    Our volume generated significant interest: there were approximately 20,000 paper
    downloads from the JETAI site alone in the first year, and three of the top five
    downloaded'
  merge: -1
  pgno: 10
- img_proc: true
  md: '# Risks of Artificial Intelligence


    papers from JETAI are now from our volume. As a result, the publishers suggested
    turning the journal volume into a book after adding some recent material, so this
    is what you have in front of you.


    The notion that AI might generate an existential threat to humanity has gained
    currency since we published the journal volume: Nick Bostrom''s book Superintelligence:
    Paths, Dangers, Strategies has come out (Bostrom, 2014); well-known public intellectuals
    such as Stephen Hawking and Stuart Russell have published warning notes in the
    general press (Hawking and Stuart et al., 2014) and a host of media publications
    has followed. The idea of existential risk, to use a Hollywood cliché, that the
    machines will take over and kill us all—this obviously strikes a chord. The spread
    of this fear has generated significant concern among academics in AI. One indication
    that the current and past presidents of the Association for the Advancement of
    Artificial Intelligence (that most significant academic AI association) wrote
    a short statement to the effect that “AI doomsday scenarios before in the realm
    of science fiction than science fact”, although they say “our colleagues in industry
    and academia to join us in identifying and studying these risks” (Ditterich and
    Horowitz, 2015). Recently, some efforts have been made to outline the research
    agenda for AI that is beneficial for humanity, for example, in the new “Future
    of Life Institute” (Russell et al., 2015) and the renamed “Machine Research Institute
    (MIRI)” (Soares and Fallenstein, 2014).


    Although the traditional concerns in the philosophy and theory of AI have focused
    on the prospects of AI, its relation to cognitive science, and its fundamental
    problems (see conference series at www.pt-ai.org), we now see an increasing focus
    on matters of risk and ethics. But what is the general idea of this shift?


    # 1.2 RISKS OF AI


    The notion of an agent with general intelligence ability is the original driving
    vision of AI research (see McCarthy et al., 1955) and dominates much of its public
    image—although nearly all current work in AI is on specialized technology, far
    removed from such a general ability and often without use of the term “artificial
    intelligence.”


    The move from AI to risk is relatively easy: there is no reason to think that
    the level of human intelligence is anything special in the space of possibilities—it
    is easy to imagine natural or artificial intelligence agents that are vastly superior
    to us. There also seem to be reasons to think that the development of AI is accelerating,
    together with related technologies,'
  merge: -1
  pgno: 11
- img_proc: true
  md: 'and the invention of intelligent machines itself would further accelerate this
    development, thus constituting an “argument for acceleration” for the hypothesis
    that some disruptive transformation will occur. If one thinks of intelligence
    as a quantifiable unit, then this acceleration will continue and move past the
    (small) space that intelligence of humans occupies. Therefore, we will reach “superintelligence”,
    which Bostrom tentatively defines as “any intellect that greatly exceeds the cognitive
    performance of humans in virtually all domains of interest” (Bostrom, 2014, p.
    22). In a classic passage, Good has speculated that the first ultrintelligent
    machine is the last invention that man ever make, provided that the machine is
    docile enough to tell us how to keep it under control (Good, 1965, section 2).
    Therefore, there is the risk that “the machines take over” and this loss of control
    is a significant risk, perhaps an existential risk for humanity [for a survey,
    see Sotala and Yampolski (2013)].


    The discussion of risk is not dependent on the view that AI is on a successful
    path towards superintelligence—though it gains urgency if “success” is a nonnegligible
    possibility in the consequence. It also gains urgency if the stakes are set high,
    even up to human extinction. If the stakes are as high as to extinction of humankind,
    even a fairly small possibility of a disastrous outcome (say, 3%) is entirely
    sufficient to motivate the research. Consider if there were a 3% possibility that
    a plane you are about to board will crash; that would be sufficient motivation
    for getting off. The utility at scientific or philosophical research is usually
    a bit lower. It appears that the outcome of superintelligence is more likely to
    be extreme: either bad or good for humanity.


    As it happens, according to our recent research, the estimation of technical experts
    is that by 2050 the probability of high-level machine intelligence (that surpasses
    human ability in nearly all respects) goes beyond the 50% mark, that it, becomes
    more probable than not (Müller and Bostrom, forthcoming 2015). 2050 is also the
    year that “RoboCup” sets itself for fielding a team that can beat the human football
    world champions (actually an aim that does not make much sense).


    # 1.3 CHAPTERS


    Orinho in Chapter 2 introduces the problem of risk and the author presses his
    point that even an innocuous artificial agent, one programmed to win chess games,
    can very easily turn into a serious threat for humans, for example, if it starts
    acquiring resources to accomplish its goals: “the seemingly harmless goal therefore
    motivates harmful'
  merge: -1
  pgno: 12
- img_proc: true
  md: '# Risks of Artificial Intelligence


    activities like breaking into computers and robbing banks” (see Chapter 2, Section
    2.4.2). It suggests we need formal methods that provide proofs of safe systems,
    a “safe-AI scaffolding strategy.”


    Chapters 3 and 4 deal with the prediction of coming success in AI. Armstrong,
    Sotala, and Ohifeigeartaig in Chapter 3 proposes a decomposition scheme to compare
    predictions on the future of AI and then test famous predictions, from the Dartmouth
    Conference, Dreyfus, Searle, Kurzweil, and Omohundro—with the result that they
    are poor, the optimistic ones. T. Goertzel in Chapter 4 argues that although most
    progress in AI so far has “narrow” technical AI, the next stage of development
    of AI, for at least the decade and more likely for the next 25 years, will be
    increasingly dependent on contributions from AI.


    From here, we go into the proposals on how to achieve safer and ethical general
    AI. In Chapter 5, Brundage investigates the general limitations of the approach
    to supply AI with “machine ethics,” and finds them both serious and deeply rooted
    in the nature of ethics itself. Yampolskiy in Chapter 6 investigates utility functions
    we might want to implement in artificial agents and particularly how we might
    prevent them from finding simple but counterproductive self-satisfaction solutions.
    B. Goertzel in Chapter 7 explains how “goal-oriented learning meta-architecture”
    may be capable of preserving its—benevolent—while learning and improving its general
    intelligence. Potapov and Rodinov in Chapter 8 outline an approach to machine
    ethics in AIXI that is not based on “rewards” (utility) but on learning “values”
    from more “mature” systems. Kornai in Chapter 9 argues that Alan Geirirth’s dialectical
    argument, a version of Kantian ethical rationalism, shows how an artificial agent
    with a certain level of rationality and autonomy will necessarily come to understand
    what is moral. Kornai denies what Bostrom calls the “orthogonality thesis” (Bostrom,
    2012), namely, that ethical motivation and intelligence are independent or “orthogonal.


    Last but not least, Sandberg in Chapter 10 looks at the special case of general
    AI via whole brain emulation; in particular, he considers the ethical status of
    such an emulation: Would the emulation (e.g., of a lab animal’s brain) have the
    ability to suffer? Would it have rights?


    In our new contributions for this volume, Dewey in Chapter 11 investigates strategies
    to mitigate the risk from a fast takeoff to superintelligence in more detail.
    Bishop in Chapter 12 takes a different line and argues that there is no good reason
    to worry about existential risk from AI but that we'
  merge: -1
  pgno: 13
- img_proc: true
  md: 'should rather be concerned about risks that we are coming—such as the military
    use of AI. Like many people working in AI, Bishop remains unimpressed by the discussion
    about risks of superintelligence because he thinks that there are principled reasons
    why machines will not reach these abilities: they will lack phenomenal consciousness,
    understanding, and insight.


    # 1.4 OUTLOOK: ETHICS AND EXISTENTIAL RISKS OF AI


    These two contributions are perhaps characteristic of a divide opening up in the
    debates between the “normal ethics” side, which stresses the challenges for AI,
    and the “existential risks” side, which stresses the big challenges for humanity.
    In the existential risks tradition, the tradition-central issues of consciousness,
    intentionality, and mental content are literally dispensed within a footnote (Bostrom,
    2014, fin. 2 to p. 22) and embodied cognition is not mentioned at all, like any
    other cognitive science.


    I tend to think that both extremes are unlikely to be fruitful: stick to the traditional
    problems and ignore them. It is unlikely that nothing can be learned about the
    long-term future of AI from the critics of AI, and it is equally unlikely that
    nothing can be learned about future from the actual success of AI. Therefore,
    although Dreyfus is right to say that the history of AI is full of “first step
    fallacies” that are similar to claiming “the first monkey that climbed a tree
    was making progress towards landing on the moon”(Dreyfus, 2012, p. 92), Bostrom
    is right to say that “the fact that some individuals have overpredicted artificial
    intelligence in the past, however, it does not follow that AI is impossible or
    will never be developed”(Bostrom, 2014, p. 4).


    As noted in my earlier editorial (Müller, 2014) which shares some text with this
    one), the term “singularity” is now pretty much discredited in academic circles—with
    the notable exception of Chalmers (2010) and the ensuing debate. It is characteristic
    that the only chapter here that uses it (Chapter 12) is critical of notion. Singularity
    is associated with ideological techno-optimism, trans-humanism, and predictions
    such as those of Ray Kurzweil (specifically Kurzweil, 2005; more recently Kurzweil,
    2012) that ignore the deep difficulties and risks of AI, for example, by equating
    intelligence and computing power. What was the “Singularity Institute” is now
    called the “Machine Intelligence Research Institute.” “Singularity” is on its
    way toward becoming, literally, the trademark of a particular ideology, without
    academic credentials.'
  merge: -1
  pgno: 14
- img_proc: true
  md: 'The most important thing between "existential risks" and "normal ethics" is
    to realize that both sides could be wrong: It might be that superintelligence
    will never be developed (Chapter 12) and it might be that it will likely be developed
    (Bostrom, 2014)—but if both are possible, then we would do to look into the consequences
    (Bostrom, 2014), taking the arguments about constraints (Chapter 12) into account.
    We need to talk. When we do that, we realize that there is much to learn from
    the "other" side.


    The problem of identifying the risks of general AI and controlling them before
    one knows what form or forms that general AI might take is formidable. To make
    things worse, we do not know when the move from fairly good AI to a human and
    then superintelligent level might occur (if at all) and whether it will be slow
    enough to prepare or perhaps quite rapid—is often referred to as an "explosion"
    (Chapter 11). As we have discussed above, one might try to mitigate the risks
    of a superintelligent, goal-directed agent by making it "friendly" (see, e.g.,
    Muehlhauser and Bostrom, 2014), by "controlling" or "boxing" it, or by trusting
    that any superintelligent agent would be "good." All these approaches make substantial
    assumptions about the nature of the problem, for instance, they assume that superintelligence
    takes the form of an agent with goals, rather like us. It is even doubtful that
    some assumptions about agency are consistent: can an agent have goals (rather
    than a technical "utility function") without having the ability for pain and pleasure,
    that is, phenomenal experience? Of course, it is conceivable that superintelligence
    will take very different forms, with no individuality or no goals at all, perhaps
    because it lacks conscious experience, desires, intentional states, or an embodiment.
    Notoriously, classical critics of AI (Dreyfus, 1992; Searle, 1990) and more recent
    cognitive science have provided arguments that indicate which directions AI is
    unlikely to take, and full agency among them (Clark, 2008; Haugeland, 1995; Pfeifer
    and Bongard, 2007; Varela et al., 1991).


    Of course, superintelligence may constitute a risk without being an agent, but
    what do we really know about it, then? Even if intelligence is not deeply mysterious
    and fundamentally incomparable, as some people claim, it is not simply a smart
    property with a one-dimensional metric either. Therefore, saying that a general
    AI is well, "intelligent," does not tell us much as Yudkowsky urges, "one should
    resist the temptation to spread quantifiers over all possible minds" (2012, p.
    186)—if that is true, the temptation to say anything about the even larger scale
    of "possible intelligent systems" is also to be resisted. Certainly, we should
    say what we'
  merge: -1
  pgno: 15
- img_proc: true
  md: '# Editorial ■ 7


    mean by “intelligent” when we claim that “superintelligence” is coming and would
    constitute an existential risk.


    There is a serious question whether rigorous work is even possible at this point,
    given that we are speculating about the risks from something about which we know
    very little. The current state of AI is not sufficiently specific to limit that
    space of possibilities enough. To make matters worse, the object of our study
    be more intelligent than us, perhaps far more intelligent, which seems to imply
    (though this needs clarification) even if we were to know a lot about it, its
    ways must ultimately remain unfathomable and uncontrollable to mere humans.


    Given these formidable obstacles, our efforts are at danger of looking more like
    theological speculation or ideological fervor like science or analytic philosophy.
    We are walking a fine line and have to read carefully. The chapters in this volume
    try to make some headway into this difficult territory because we remain convinced
    that cautious progress is better than a headless rush into the dark.


