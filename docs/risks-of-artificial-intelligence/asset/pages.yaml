    # 8.1 INTRODUCTION


    Intelligent agents should have some motivation or pursue some goals. Most works
    on artificial intelligence (AI) assume that these goals are correctly stated,
    and one can focus on problem solving. However, the problem of motivation is more
    urgent in the case of artificial general intelligence (AGI) agents. Indeed, it
    is almost impossible to set such “basic” prior goal as survival. It is much easier
    to use somatic pain and pleasure for motivation, but this motivation will not
    guarantee optimal survivability. This problem is even more appreciable in the
    context of AGI, within which motivation and goals issues and their desirable realization
    are of first priority.


    Different approaches to solve AGI have already been proposed. Some excellent surveys
    on this topic exist de-tail, and there is no need to repeat them, but it should
    be concluded that different approaches aimed at complete solution of the safety
    problem can be expressed in terms of value functions.


    Value functions do not solve the problem, but help to state it. Indeed, the problem
    of complex values still remains (Yudkowski, 2011). Safe value functions should
    be expressed in terms of high-level notionsantically grounded in the real world,
    which are not internally accessible for both a “newborn” AGI agent and an “adult”
    expert system. The latter can have complex-level goals expressed in terms of environments
    models, but there will always be undesirable ways to reach them. Even simply safe
    functions as curiosity, for example, considered in the works of Schmidhuber (2010)
    and Ring and Orseau (2011), imply dangerous instrumental subgoals or derative
    motivation (e., Omohunder, 2008), such as increase of computational (or other)
    resources or protection of reward channel that can lead to extinction of humans.
    Thus, introduction of prior value functions is problematic. Consequently, the
    AGI agent should be supplied with some external “true” rewards intra vitam. These
    true rewards can be “calculated” by existing adult agents'
