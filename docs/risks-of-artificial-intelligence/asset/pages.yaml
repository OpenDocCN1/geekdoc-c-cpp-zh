    Conversely, in an argument “Dancing with Pixies” (DwP) I demonstrated that if
    a computer-controlled robot experiences a conscious sensation as it interacts
    with the world, then an infinite of “conscious sensation” must be realized in
    all objects throughout the universe: in this cup of tea I am drinking as in the
    seat that I am sitting as I type, and so on. If we reject “panpsychism,” we must
    reject “machine consciousness.”


    The underlying theory of the DwP reductio [3–6] derives from positions originally
    espoused by Hilary Putnam [7], John Maudlin [8], and John Searle [9], with subsequent
    criticism from David Chalmers [10], Colin Klein [11], and Ron Chesley [12], among
    others [13].


    In the DwP reductio, instead of seeking to secure Putnam’s claim that “every open
    system implements every Finite State Automaton” (FSA) and hence that “psychological
    states of the brain cannot be functional states of a computer,” I establish the
    weaker result that, over a finite time window, every open physical system implements
    the particular execution trace of a FSA on a specific input vector (I).


    That result leads to panpsychism is clear, equating FSA Q(I) to a finite computational
    system that is claimed to instantiate phenomenal states as it executes and employing
    Putnam’s state-mapping procedure to map a series of computational states to any
    arbitrary noncyclic sequence of states, we discover identical computational (and
    ex-hypothesis phenomenal) states lurking in any open physical system (e.g., a
    rock); then infinit of disembodied experience of conscious sensation (dancing
    little pixies) are realized in everything.


