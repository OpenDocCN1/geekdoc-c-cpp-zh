  md: '# 80 ▄ Risks of Artificial Intelligence


    prescription by human doctors (Maslow, 2011). Routine diagnostic needs did not
    justify the time neededed to feed information into the AI systems. Critics argued
    that the process of diagnosis was too closely integrated with the process of treatment
    to be handled by computers (Miller, 1990). Physicians often initiated treatments
    before reaching a definitive diagnosis and took a wide range of information about
    the patient and her circumstances into account. Much of this knowledge was tacit
    rather than explicit and very difficult to formalize for input into an AI system.
    Although it was thought that AI might be developed to carry out this complex process,
    doing so would require access to a wider range of information than could be provided
    to the available programs at the time.


    By the mid-1990s, the consensus in the field was that, despite a decade of impressive
    technical accomplishment, the impact on medical practice had been minimal. A comprehensive
    review at the time (Coiera, 1996) concluded that “the modern study of artificial
    intelligence in medicine (AIM) is 25 years old. Throughout this period, the field
    has attracted many of the best computer scientists, and their work represents
    a remarkable achievement. However, AIM has not been successful—if success is judged
    as making an impact on the practice of medicine” (p. 363). The problem was not
    the complexity of the diagnostic process or the limitations of the computers.
    Rather, as the reviewer observed (Coiera, 19), “it is now generally recognized
    that for AI research can produce systems that have a significant impact, a substantial
    information infrastructure has to be in place” (p. 365).


    In the past 15 years, tremendous resources have been devoted to developing medical
    information systems, including electronic medical records, computerized physician
    order entry systems, and decision support systems (Blumenthal and Glaser, 2007;
    Harrison et al., 2007; Koppel, 2005). The task seems straightforward enough. Records
    that were previously kept on paper, including physicians’ observations and analyses,
    need to be digitized standardized categories and measurements. Information needs
    to be accurate and made available to medical practitioners in a timely manner.
    Therapeutic interventions and outcomes need to be continuously monitored and the
    outcome data made available to both clinicians and researchers in a timely and
    accurate fashion.


    Implementing these systems has proven surprisingly difficult and has led to a
    multitude of unintended consequences (Rahimi et al., 2009). The difficulties fall
    into two main categories: entering and retrieving information, and integrating
    the information into patient care (Ash et al., 2004). Physicians and'
  merge: -1
  pgno: 89
- img_proc: true
