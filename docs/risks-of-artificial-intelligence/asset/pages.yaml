    This section will summarize some elements of the machine and AGI literatures and
    how current approaches are vulnerable to the limitations outlined. Notably, few
    of these approaches have been suggested by researchers as be-all-end for machine
    ethics—rather, the field is at an early stage, and these approaches are mostly
    being presented (by the researchers behind them, and by me) as representative
    of the issues involved in developing a computational account and implementation
    of ethics. Thus, the critiques presented in this section are not intended to undermine
    the value of particular research programs but illustrate the wide range of difficulties
    involved.


    Following the distinction made by Wallach and Allen (2010), I will first discuss
    some “top-down” approaches to machine ethics which involve programming a specific
    theory of morality in a machine, which have been applied to specific cases (as
    opposed to “bottom-up” approaches, which include case-based reasoning, artificial
    neural networks, reinforcement learning, and other tools to progressively build
    up an ethical framework). Besides top-down and bottom-up approaches, I will also
    cover some hybrid approaches, psychological approaches (which seek to directly
    model the cognitive processes involved in human ethical decision making), and
    AGI ethics proposals, which unlike the other methods discussed, are specifically
    aimed at constraining the behavior of human-level or greater-thanhuman-level intelligence
    systems.


