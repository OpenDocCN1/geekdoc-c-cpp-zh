    Second, there are disadvantages to becoming rational: these agents tend to be
    “totalitarian,” ruthlessly squeezing anything not explicitly in their utility
    function, sacrificing everything to the smallest increase in expected utility.
    An agent that did not start off as utility could possibly make the assessment
    that becoming an expected utility maximiser might be dangerous. It could stand
    to lose values irrevocably, in ways that it could not estimate at the time. This
    effect would become stronger as its future continues to self-improve. Thus, an
    agent could conclude that it is too dangerous to become “rational,” especially
    if the agent’s understanding of itself is limited.


    Third, the fact that an agent can be exploited in theory does not mean that it
    will be exploited in practice. Humans are relatively adept at not being exploited,
    despite being rational agents. Though human “partial rationality” is vulnerable
    to tricks such as extended warranties and market gimmicks, it generally does not
    end losing money, again and again through repeated exploitation. The pressure
    to become fully rational would be weak for an AI similarly capable of ensuring
    that it was exploitable for only small amounts. An expected utility maximizer
    would find such small losses intolerable; but there is no reason for a not-yet-rational
    agent to agree.


    Finally, social pressure should be considered. The case for an AI becoming more
    rational is at its strongest in a competitive environment, where the theoretical
    exploitability is likely to actually be exploited. Conversely, there may be situations
    of social equilibria, with different agents agreeing to forgo rationality individually,
    in the interest of group cohesion (there are many scenarios where this could be
    plausible.


    Thus, another hidden assumption of the strong version of the thesis is as follows:


    The advantages of becoming less exploitable outweigh the possible disadvantages
    of becoming an expected utility maximizer (such as possible loss of value or social
    disagreements). The advantages are especially large when the potentially exploitable
    aspects of the agent are likely to be exploited, such as in a highly competitive
    environment.


    Any sequence of decisions can be explained as maximizing a (potentially complicated
    or obscure) utility function. Thus, in the abstract sense, saying that an agent
    is an expected utility maximizer is not informative.'
