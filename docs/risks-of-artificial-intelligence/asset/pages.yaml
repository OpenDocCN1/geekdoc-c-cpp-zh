  md: '# Ethics of Brain Emulations ■ 239


    Yet these stimulating factors also make us ignore the very real gaps in our knowledge,
    the massive difference between the current technology and the technology we can
    conjecture need, the foundational uncertainty about whether the project is feasible.
    This lack of knowledge easily leads to a split into a camp of enthusiasts who
    assume the eventual answers will prove positive and a camp of skeptics who dismiss
    the whole endeavor. In both camps, motivated cognition will filter to suit their
    interpretation, producing biased claims and preventing actual epistemic progress.


    There is also a risk that ethicists work hard on inventing problems that are not
    there. After all, institutional reviews go to ethicists to find high-impact topics
    to pursue, and hence it makes sense arguing that whatever topic one is studying
    is of higher impact than commonly perceived. Alfred Nordmann argued that debate
    about human enhancement is based on “if ...” ethical experiments where some radical
    technology is first assumed, and then the ethical impact explored in this far-fetched
    scenario. He argued that these limited ethical resources on flights of fantasy
    rather than the very real ethical problems we have today (Nordmann, 2007).


    Nevertheless, considering potential risks and their ethical impacts is an important
    aspect of research ethics, even when dealing with merely possible radical technologies.
    Low-probability, high-impact risks do matter. In many cases, the steps are simply
    to gather better information and have a few preliminary guidelines ready if the
    future arrives unexpectedly. Although we have little information in the present,
    we have great leverage over the future. When the future arrives, we may know far
    more, but we will have less ability to change it.


    In case of WBE, the main conclusion of this chapter is the need for computational
    modelers to safeguard against software suffering. At present this would merely
    consist of being aware of the possibility, monitor the progress of the field,
    and consider what animal protection practices can be imported into the research
    models when needed.


