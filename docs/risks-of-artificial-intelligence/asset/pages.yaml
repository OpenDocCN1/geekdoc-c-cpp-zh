    # 10.3.5 Time and Communication


    Emulations will presumably have experience and behave on a timescale set by the
    speed of their software. The speed a simulation relative to the outside could
    be changed, depending on available hardware and software. Current large-scale
    neural simulations are commonly run with slowdown factors on the order of a thousand,
    but does not seem to be any reason precluding emulations running faster than real-time
    biological brains.


    Nick Strom and Eliez Yudkowsky (2014) have argued for a principle of subjective
    rate of time: “In cases the duration of an experience is of basic normative significance,
    it is the experience’s subjective duration that counts.” By this account freezes
    do not count at all. Conversely, very fast emulations can rapidly produce a large
    amount of positive or negative values if they are in extreme states; they might
    count for more in utilitarian calculations.


    Does human have a right to real time? Being at a faster or slower rate does not
    matter as long as an emulation is only interacting with a virtual world and other
    emulations updating at the same speed. But when interacting with the outside world,
    speed matters. A divergent


