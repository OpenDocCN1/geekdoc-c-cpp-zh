    # 3.3.3 Empirical Evidence and the Scientific Method


    The gold standard in separating true predictions from false ones must always be
    empirical evidence. The scientific method has proved to be the best way of disposing
    false hypotheses and be used whenever possible, always preferred over expert opinion
    or unjustified models.


    Empirical evidence is generally lacking in the AI prediction field, however. Because
    AI predictions concern the existence and properties of a machine that has not
    yet been built, and for detailed plans do not exist, there is little opportunity
    for the hypothesis–testing cycle. This should indicate the great challenges in
    the field, with AI predictions being more uncertain than those of the "softest"
    sciences, which have access to some form of empirical evidence.


    Some AI predictions approximate the scientific method better than others. The
    whole brain emulations model, for instance, makes testable predictions over the
    near and medium future (Sandberg 2008). Moore’s law is a prediction backed up
    by a lot of scientific evidence and connected to some extent with AI. Many predictors
    (e.g., Kurzweil) make partial predictions on the road towards AI; these can and
    should be assessed as evidence of the expert’s general predictive success. Though
    not always possible, efforts should be made to connect general predictions with
    some near-term empirical evidence.


    # 3.3.4 Reliability of Expert Judgment


    Reliance on experts is nearly unavoidable in AI prediction. Predictions are often
    explicitly based on experts’ judgment.’ Plans also need experts to come up with
    them and judge their credibility. Unless every philosopher agrees on the correctness
    of a particular argument, one is dependent on some degree on the philosophical
    judgment of the author.


    > * Consider an expert who says that AI will arrive when computer reaches a particular
    level of ability and uses Moore’s law to find the date. Though Moore’s law is
    a factor in the argument, one still has to trust the expert’s opinion that that
    particular level of computational ability will truly lead to AI—the expert’s judgment
    is crucial.'
