  md: '# 10.3.4 Identity


    Personal identity is likely going to be a major issue, both because of the transition
    from an original unproblematic human identity to successor identity/identities
    that might or might not be the same, and software minds can potentially have multiple
    realizability. The discussion about how personal identity relates to successor
    identities on different substrates is already extensive and will be foreseen here,
    for instance, Chalmers (2010).


    Instantiating multiple copies of an emulation and running them as separate from
    a single one is obviously feasible. If they have different inputs (or simulated
    neuronal noise), they will over time diverge into different persons, who have
    not just a shared past but at least very similar outlooks and mental states.


    Obviously multiple copies of the same original person pose intriguing legal challenges.
    For example, contract law would need to be updated to handle contracts where one
    of the parties is copied—does the contract now apply to? What about marriages?
    Are all copies descended from a person legally culpable of past deeds occurring
    before the copying? To what extent do the privileged understanding copies of each
    other affect their suitability as witnesses against each other? How should votes
    be allocated if copying is relatively cheap and can do “ballot box stuffing” with
    copies? Do copies start out with equal shares of the original property? If so,
    what about inactive backup copies? And so on. These issues are to speculate upon
    and will no doubt lead to major legal, social, and political changes if they become
    relevant.


    From an ethical standpoint, if all instances are moral agents, then the key question
    is what obligations, rights, and other properties carry over from originals to
    copies and whether the existence of copies changes something of these. For example,
    making a promise “I will do X” is typically meant to signify that the future instance
    of the person making the promise will do X. If there are two instances, it might
    be that one of them does X (whereas promising not to X might oblige both to abstain).
    But this assumes that the future instances acknowledge the person doing as their
