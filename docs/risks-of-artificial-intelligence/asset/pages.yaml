    # 8.4 CONCLUSION


    We have started from the assertion that generalized states of the world are valuable—not
    the rewards themselves. Thus, true values of states should be learned and bound
    with generalized representations. The agent can be supplied directly with specific
    rewards (from which it reconstructs “true values”) or it can reconstruct what
    generalized states of the environment are desired by other agents which possess
    better value systems. Usage of learned true values ensures that the agent will
    perform safe actions.


    We have performed methodological considerations and proposed general mathematical
    models by introducing corresponding modifications in AIXI. These models cannot
    be directly applied in practice, but they give appropriate starting point. In
    particular, simplifications of these models in Markov environments have been implemented.
    Their experimental study has shown that the developed models are suitable for
    detecting presence of other agents, reconstructing, and adopting their values
    without permanently receiving external “true” rewards. Hopefully, empathetic agents
    with socially desirable behavior may be developed.'
