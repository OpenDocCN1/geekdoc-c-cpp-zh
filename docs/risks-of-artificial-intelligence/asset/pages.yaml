  md: '# Editor


    **Vincent C. Müller**’s research focuses on the nature and future of computational
    systems, particularly on the prospects and dangers of artificial intelligence.
    He is the president of the European Association for Cognitive Systems and was
    the coordinator of the European Network for Cognitive Systems, Robotics and Interaction,
    which has nearly 1000 members and is funded by the European Commission through
    two FP7 projects worth €3.9 million over 2009–2014 (www.eucognition.org). He organizes
    a conference series, Theory and Philosophy of AI (www.pt-ai.org) and is the principal
    investigator of a European Commission–funded research project Digital DIY. He
    is currently working as professor of philosophy, Division of Humanities & Social
    Sciences, Anatolia College/ACT, Pylaia-Thessaloniki, Greece.


    Müller has published a number of articles in leading journals on the philosophy
    of computing, the philosophy of artificial intelligence and cognitive science,
    and the philosophy of language, applied ethics, and related areas. He has edited
    10 volumes, mostly on the theory of cognitive systems and artificial intelligence,
    and is preparing a monograph on the fundamental problems of artificial intelligence.
    Müller studied philosophy with cognitive science, linguistics, and history at
    the universities of Marburg, Hamburg, London, and Oxford. He was Stanley J. Seeger
    Visiting Fellow at Princeton University and James Martin Research Fellow at the
    University of Oxford.


    ORCID: 0000-0002-4144-4957'
