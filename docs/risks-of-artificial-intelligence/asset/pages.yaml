  md: '# 116 ■ Risks of Artificial Intelligence


    # 6.1 INTRODUCTION


    The term "wirehead" traces its origin to intracranial self-stimulation experiments
    performed by James Olds and Peter Milner on rats in the 1950s (Olds & Milner,
    1954). Experiments included a procedure for implanting a wire electrode in an
    area of a rat’s brain responsible for reward administration (see Figure 6.1a).
    The rodent was given the ability to self-administer a small electric shock by
    pressing a lever and to continue receiving additional "pleasure shocks" for each
    press. It was observed that the animal will continue to self-stimulate without
    rest, and even cross an electrified grid, to gain access to the lever (Pearce,
    2012). The rat’s self-stimulation behavior completely displaced all interest in
    sex, sleep, food, and water, ultimately leading to premature death.


    Others have continued the work of Olds et al. and even performed successful wireheading
    experiments in humans (Heath, 1963) (see Figure 6.1b). A classic example of wireheading
    in humans is direct generation of pleasurable sensations via administration of
    legal (nicotine, alcohol, caffeine, pain killers) or illegal (heroin, methampamines,
    morphine, cocaine, 3-4methenedioxymethamphetamine, lysergic acid didiethyl, 1-(1-phenylhexyl)piperidine),
    mushrooms, tetrahydrocannabinol) drugs. If we loosen our definition of wireheading
    to include other forms of direct reward generation, it becomes clear just how
    common wireheading is in human culture (Omohuro, 2008);


    +   - Currency counterfeiting. Money is intended to measure the value of goods
