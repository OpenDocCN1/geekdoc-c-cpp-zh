    in 1990, Randolph Miller (1990) responded to James Mazoué’s (1990) “diagnosis
    without doctors” proposal by arguing that “for the remainder of this century and
    at the beginning of the next, humans will be the primary purveyors of medical
    diagnosis” (p. 582). He argued diagnosis was an “art” rather than a science because
    it involved many steps including gathering data, integrating it into plausible
    scenarios and refining hypotheses, initiating therapy, monitoring the results,
    and evaluating the effects. In 1990, digital records of all these steps were not
    kept, nor were the AI programs of the time prepared to use it. We are rapidly
    approaching the time when data will be accessible, creating new opportunities
    to develop the stronger AI systems needed to make of it.


    # 4.8 CONCLUSIONS


    The cases we have examined are quite different, the risks, benefits, and technical
    challenges they present vary widely. Setting up a giant computer system to run
    an entire national economy was long ago abandoned for technical reasons, and no
    one considers reviving it today. Just because a project might be technically feasible
    does not mean that it will be implemented. Human institutions are still firmly
    in charge of that. With computerized financial trading, the primary challenge
    is analytical. Tremendous quantities of data are already available; the challenge
    is to come up with algorithms that can actually beat the market over long periods
    of time. With surveillance, in medicine, the primary challenge is building the
    information system to feed data into algorithms that are already quite sophisticated.
    The primary challenges are political, finding ways to gather information that
    is really needed to fight terrorism and solve crime compromising civil liberties.
    Self-driving motorcars, however, are almost entirely a technical challenge without
    raising political issues.


    In all of the areas we have examined, it seems that the next 10–25 years will
    be characterized by a merger of narrow AI and strong AI approaches as develop
    intelligent agents that can interact actively and creatively with complex environments.
    These agents will not be the humane robots of science fiction, least not for several
    decades. At some point, it may become possible to create a robot that could drive
    itself to engage in electronic trading at a bank in the morning, diagnose and
    treat patients in a hospital in the afternoon, volunteer for a cyberlogging collective
    in the evening, then fight terrorists at night. There is no convincing reason
    to concentrate all these skills in one electronic individual. Rather, resources
    will be used to gradually strengthen'
  merge: -1
  pgno: 91
- img_proc: true
  md: '# Path to More General Artificial Intelligence ■ 83


    the capabilities of AIs designed for narrow tasks, gradually linking them together
    to form a more general AI.


    Risk management will also follow this approach. Programs will be developed to
    manage specific risks: sousveillance to counter surveillance, automated traffic
    cops to police self-driving cars, automated risk-limiting computers at stock markets,
    and sensors to monitor bodily functioning and detect when pacemakers and other
    implants malfunction. There will certainly be failures and risks, but they will
    be less catastrophic than if a single all-powerful AI were developed.


    If this vision of development of AGI is correct, we will not have one global brain
    on one mainframe computer, but millions of AIs with specialized but increasingly
    complex functionality. General intelligence will emerge as these specialized AIs
    are linked in complex and varied ways. The human-level AGI that eventually develops
    may be similar to the Siri program on the iPhone but much smaller, interfacing
    with dozens or hundreds of AGI experts, as well as human beings, in carrying out
    its tasks. By working with other agents, an assistant could awaken its owner,
    delivering the morning''s news and messages, order the kitchen to prepare a nutritious
    appropriate breakfast, select clothing to fit the day''s weather and the scheduled
    events, order the car to retrieve itself from valet parking, monitor the owner''s
    vital signs, and interface with the computers at the owner''s workplace. In doing
    these things, it could choose to interact with a large number of collaborating
    AIs, selecting those with high reliability as well as advanced functionality,
    as judged by automated crowd sourcing techniques.


    All of these AIs will be constantly interacting with each other, seeking improved
    partners, and maximizing their functionality and reliability. Each step in this
    development will involve new risks and strategies for containing them will evolve
    with the new capabilities. The AGI that will emerge from this process will rapidly
    exceed human levels in performing many tasks, although it will have no reason
    to evolve the exact set of abilities—and vulnerabilities—found in human beings.


    The small-N comparative method has some value for projecting trends a decade or
    two into the future. The options for the more distant future are best addressed
    with philosophical and speculative methods. However, longer termist future analyses
    should take into account the way things are likely to develop in the more foreseeable
    future. It seems that more generally intelligent AI agents will continue to develop
    for a period of years before the much feared development of a superhuman AGI with
    the'
