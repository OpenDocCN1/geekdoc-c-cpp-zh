    # 2.4 RATIONAL SYSTEMS HAVE UNIVERSAL DRIVES


    Most goals require physical and computational resources. Better outcomes can usually
    be achieved as more resources become available. To maximize the expected utility,
    a rational system will therefore develop a number of instrumental subgoals related
    to resources. Because these instrumental subgoals appear in a wide variety of
    systems, we call them “drives.” Like human or animal drives, they are tendencies
    that will be acted upon unless something explicitly contradicts them. There are
    a number of these drives, and they naturally cluster into a few important categories.


    To develop an intuition about drives, it is useful to consider a simple autonomous
    system with a concrete goal. Consider a rational chess robot with a utility function
    rewards as many games of chess as possible against good players. This might seem
    to be an innocuous goal, but we will see that it leads to harmful behaviors out
    of the drives.


    # 2.4.1 Self-Protective Drives


    When roboticists are asked by numerous onlookers about safety, a common answer
    is “[w]we can always unplug it!” But imagine this outcome from the chess robot''s
    point of view. In a future in which it is unplugged is a future in which it cannot
    play or win any games of chess. This has very low utility, so expected utility
    maximization will cause the creation of the instrumental subgoal of preventing
    itself from being unplugged. If the system believes that the roboticist will persist
    in trying to unplug it, it will be motivated to develop the subgoal of permanently
    stopping the roboticist. Because nothing in the chess utility function gives a
    negative weight to murder, the seemingly harmless chess robot will become a killer
    out of the drive for self-protection.


    The same reasoning will cause the robot to prevent damage to itself or loss of
    its resources. Systems will be motivated to physically harden themselves. To protect
    their data, they will be motivated to restore redundantly and with error detection.
    Because damage is localized in space, they will be motivated to disperse their
    information across different physical locations. They will be motivated to develop
    and deploy computational security against intrusion. They will be motivated to
    detect deception and defend against manipulation by others.'
