    # 3.3.4.2 Nonexpert Judgment


    All the issues and problems with expert judgment apply just as well to nonexperts.
    Although experts could expect to have some source of useful insight due to their
    training, knowledge, and experience, this is not the case with nonexperts, giving
    no reason to trust their judgment. That is not to say nonexperts cannot come up
    with good models, convincing timelines, or interesting plans and scenarios. It
    means that any assessment of the quality of the prediction depends only on the
    prediction itself; a nonexpert cannot be granted any leeway to cover up a weak
    premise or a faulty logical step.


    One must beware the halo effect in assessing predictions (Finucane et al. 2000;
    Thornd 1920). This denotes the psychological tendency to see different measures
    of personal quality to be correlated: an attractive person is seen as likely to
    be intelligent, someone skilled in one domain is believed to be skilled in another.
    Here, it is hard to prevent one''s opinion of the predictor from affecting one''s
    assessment of the prediction, even when this is unwarranted. One should ideally
    assess nonexpert predictions without knowing who the author is. If one can attempt
    to reduce the bias by imagining that the prediction was authored by someone else—such
    as the Archbishop of Canterbury, Warren Buffet, or the Unabomber. Success is achieved
    when hypothetical changes in authorship do not affect estimations of the validity
    of the prediction.


