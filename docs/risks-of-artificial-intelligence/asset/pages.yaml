  md: 'of control over behavior—norms, police, economic incentives, and political
    institutions—to act on the software. This is by no means a guarantee: emulations
    might prove to be far more upgradeable than we currently expect; motivations might
    shift from human norms; speed differences and socioeconomic factors that might
    create turbulence; and the development of emulations might also create spin-off
