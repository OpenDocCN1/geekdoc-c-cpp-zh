    This method often increases the prediction''s uncertainty, in that it makes the
    prediction less restrictive (and less powerful) than it first seemed. For instance,
    Bruce Edmonds (2009), building on the “No Free Lunch” results (Wolpert and Macready
    1995), demonstrates that there is no such thing as a universal intelligence: no
    intelligence outperforms others in every circumstance. Initially, this seems to
    rule out AI entirely; but when one analyzes it empirically, there is far less
    to it. It does not forbid an algorithm from performing better than any human in
    any situation any human being would ever encounter, for instance. Therefore, the
    initial impression, which was the argument ruled out all futures with AIs in them,
    is now replaced by the realization that the argument has barely put any constraints
    on the future at all.


    # 3.3.2 Clarifying and Revealing Assumptions


    Section 3.3.1 was concerned with the prediction''s conclusions. This section will
    instead be looking at its assumptions and the logical structure of the argument
    or model behind. The objective is to make the prediction as rigorous as possible.
    This kind of task has been a staple of philosophy ever since dialectic (Plato
    380 BC).


    Of critical importance is revealing hidden assumptions that went into the predictions.
    These hidden assumptions—sometimes called Enthymematic gaps in the literature
    (Fallis 2003)—are very important because they clarify the true disagreements and
    where the investigation needs to be focused to figure out the truth of the prediction.
    Too often, competent experts make broad-based arguments that fly past each other.
    This makes choosing the right argument a matter of taste, prior opinions, and
    admiration of the experts involved. If the argument can be correctly deconstructed,
    however, the source of the disagreement can be isolated, and decided on much narrower
    grounds—and it is clearer whether the various experts have relevant expertise
    or not (see Section 3.3.4). The hidden assumptions are often implicit, so it is
    perfectly permissible to construct assumptions that the predictors were not consciously
    aware of. The purpose is not to score points for one “side” or the other, but
    always to clarify and analyze arguments and find the true points of disagreement.


