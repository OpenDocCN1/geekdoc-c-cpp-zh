    the complex logic of intelligence. Applied areas chosen for examination were heart
    pacemakers, socialist planning, computer-based trading, self-driving automobiles,
    surveillance and sousveillance and AI in medicine.


    # 4.1 INTRODUCTION


    Two different approaches have developed in the history of artificial intelligence
    (AI). The first, known as “strong AI” or “general intelligence” (AGI), seeks to
    engineer human-level intelligence-based theoretical models (Wikipedia, 2013).
    The second, sometimes known as “narrow AI” or “practical AI,” develops software
    to solve limited practical problems. Strong AI has had a mercur history, experiencing
    “several cycles of hype, followed by disappointment and criticism, followed by
    funding cuts, by renewed interest years or decades later” (Wikipedia, 2013). Narrow
    or practical AI became dominant in the field because it was successful in using
    useful practical problems and because it was easier to demonstrate in academic
    papers even without a practical application. Today, the remarkable success of
    narrow AI is widely known. A article in New York Times (Markoff, 2012) reported
    that “using an artificial intelligence technique inspired by theories about how
    the brain recognizes patterns, technology companies are reporting gains in fields
    as diverse as computer vision, speech recognition and the identification of promising
    new molecules for designing drugs.


    Public interest and support for strong AI has lagged because optimistic often
    failed and progress is difficult to measure or demonstrate. This chapter argues,
    however, that the next stage of development of AI, for at least the next decade
    and more likely for the next 25 years, will be increasingly dependent on contributions
    from strong AI. This hypothesis arises from an early study of the history of AI
    in practical domains using what Abbott (2004) calls the small-N comparative method.
    This method examines a small number of varied cases in moderate detail, drawing
    on descriptive case study accounts. The cases are selected to illustrate different
    processes, risks, and benefits. This method draws on the qualitative insights
    of specialists who have studied each of the cases in depth and over historically
    significant periods of time. The small-N comparisons help identify general patterns
    and to suggest priorities for further research. Readers who want more depth on
    each case are encouraged to pursue links to the original case research.'
  merge: -1
  pgno: 79
- img_proc: true
  md: '# Path to More General Artificial Intelligence ■ 71


    The six cases chosen for examination are intentionally quite different. The first
    was the attempt to use what was then known as “cybernetic” technology to create
    a viable socialist economic system. This took place during the heyday of optimism
    about AI and failed in both the Soviet Union and Chile for technical and sociological
    reasons. The second case is computer-based financial trading, a decisively capitalist
    enterprise and one that continues to be active and profitably pursued although
    its effectiveness is still controversial. These are followed by three cases where
    narrow AI has had impressive success: surveillance for security purposes, self-driving
    automobiles, and pacemakers. Finally, we examine the case of AI in medicine, a
    very well-funded and promising enterprise that has encountered unanticipated difficulties.


    # 4.2 CYBERNETIC SOCIALISM


    Norbert Wiener’s classic 1948 book Cybernetics was enthusiastically received by
    an influential segment of forward-looking Soviet scientists and engineers. Cybernetics
    as presented by Wiener was an intriguing set of analogies between humans and self-regulating
    machines. It posted that there were general principles that could be applied to
    the modeling and control of biological, mechanical, and social processes. At first,
    the Soviet establishment rejected cybernetics as “reactive pseudo-science,” but
    things loened after the death of Stalin and cybernetic enthusiasts succeeded in
    establishing a Council on Cybernetics within the Academy of Sciences. In 1959,
    its director, Aksel Ivanovich Berg, made very strong promises for the new field,
    claiming that cybernetics was nothing less than “the development of methods and
    tools for controlling the entire national economy, individual technological processes,
    and various forms of economic activity to ensure the optimal regime of government”
    (Gerovitch, 2002, p. 254). Cybernetics (often renamed *uplenie*, a Russian word
    which means “optimization of government”) was included in the Communist Party
    program as “science in the service of communism” (Gerovitch, 2002, p. 4).


    This was appealing because, as the Soviet economy became more complex, it became
    more and difficult for central planners to manage and control. Soviet philosophers,
    who had initially proposed cybernetics as anti-Marxist, decided that it was actually
    firmly rooted in Marxist principles. Politically, it was opposed by traditional
    economists and administrators who feared being displaced and by reformers who
    saw the cybernetic movement as an obstacle to the market reforms they believed
    Russia really needed.'
  merge: -1
  pgno: 80
- img_proc: true
  md: '# 72 Risks of Artificial Intelligence


    If cybernetics really had the technical capability to solve the problems of Soviet
    secret planning in the 1960s, its proponents could probably have overcome the
    political resistance. The movement failed because the computer scientists and
    economists charged with implementing it concluded that "it was impossible to centralize
    all economic decision making in Moscow: the mathematical optimization of a large-scale
    system was simply not feasible" (Gerovitch, 2002, p. 273). The data needed were
    available and could realistically be obtained and the computers would not be ready
    to handle them if they were.


    A second attempt to apply cybernetics to building a frame of socialism took place
    in Chile during the Allende government from 1970 to 1973 (Medina, 2011). Allende''s
    goal was to build a democratic socialist system as a "third way" between Western
    capitalism and Soviet communism. One of the visionaries in his administration,
    Fernando Flores, was familiar with the writings of British cybernetician Stanford
    Beer and invited him to consult with the Allende government. Beer was a successful
    business consultant who specialized in helping companies their information and
    decision-making systems. He was ideologically sympathetic to Allende''s project
    and responded enthusiastically to Flores'' invitation.


    Beer was not to repeat the mistakes of the Soviet experiments in Chile at the
    time. There were approximately 50 computers in the country as a whole, many of
    which were out of date, compared to approximately 48,000 in the United States
    at the time. There was no network linking them together. They did have a number
    of yet unused telex machines in a government warehouse, so they set up telex links
    to key industries so they could send up-to-date information on production, supplies,
    and other variables. Beer then designed a modernistic control room where decision
    makers could sit on swivel chairs and push buttons on their arm rests to display
    economic information on charts the wall. Following the cyber vision, this wall
    was decorated with a chart showing how the network of communications was analogous
    to that in the human brain. But there was no attempt to replace human brains.
    The project simply sought to collect time-sensitive information and present it
    in a way that human managers and workers could use to make better-informed decisions.
    Beer emphasized that information should be available to all levels of the system,
    so that workers could participate with managers in making decisions.'
  merge: -1
  pgno: 81
- img_proc: true
  md: '# Path to More General Artificial Intelligence ■ 73


    This modest task was difficult enough. Managers were busy running their factories
    and dealing with multiple crises, and were not always able to get the data typed
    into the telex prompt. Then it took time for the data to be punched on cards and
    fed into the computers. President Allende had more urgent matters on his agenda,
    but he gave his imprimatur to the project, which was progressing well until they
    ran into a public relations problem. The project was no secret, but neither was
    it publicized. When they were getting ready to make a public announcement, the
    British newspaper *The Observer* (January 7, 1973) published a story claiming
    that “the first computer system designed to control an entire economy has been
    secretly brought into operation in Chile.” The story was then picked up by the
    press in the United States and finally in Chile.


    The Observer story was far from reality. No such system existed, nor did Beer
    and his colleagues believe that they could construct one in 1973. All they were
    doing was setting an information system. They had a vision of someday building
    a cybernetic system that would take place in all sectors of Chilean social order
    (Guzmán, 2003, pp. 5–8), but they had little understanding of the social, political,
    and international conflicts that threatened the Allende project. They gave the
    project a flashy name, *Proyecto Synco (Project Cybersyn in English)* attracting
    unnecessary attention and causing confusion about what they were doing. Critics
    argued that if these plans ever came to fruition, they would lead to a totalitarian
    Soviet-style system, despite the wishes of the designers.


    Proyecto Synco came to an abrupt end in September 1973 when the Chilean military
    overthrew the Allende government and brutally suppressed the Chilean left. There
    was really no technical reason for ending Proyecto Synco; the new government could
    have used an economic information system. Today, the need for this kind of information
    system is taken by governments of all political stripes. Prime Minister David
    Cameron and his ministers have an iPad app, called *The Number 10 Dashboard*,
    which supplies the leadership with the kind of information Beer and were trying
    to gather for the Allende government (Lee, 2012).


    The myth of Proyecto Synco has recently been revived in a science fiction novel
    (Baradit, 2008) that has revived fears about an evil AI taking over the nation
    and indeed the continent. In the novel, the Allende government survives and Synco
    grows so large that it requires legions of slave laborers to tend it in its huge
    underground bunkers. It depends, oddly'
  merge: -1
  pgno: 82
- img_proc: true
  md: '# 74 Risks of Artificial Intelligence


    enough, on transistors the size of automobiles. Its electricity demands are so
    great that a new system has to be developed based the ideas of Nikola Tesla, a
    Croatian inventor who died in 1943. Then Stonehenge is revealed as the control
    center of a global computer setup to melt the ice in Antarctica, revealing it
    to be the lost continent Atlantis. Roswell, New Mexico, and the Philadelphia Experiment
    are all part of a global conspiracy run by a Galactic AI. Then Synco develops
    hallucinations, President Allende is replaced by a robot, and the whole country
    of Chile sinks into the sea. The goal of the project is described as "magical
    socialism" centered on an island off the coast of Chile. These kinds of fantasies
    may be harmful if not taken seriously, but they also reveal something of the underlying
    fears strong AI can still evoke.


    No one would have expected AI to take over an entire economy in the 1960s if it
    were not for the excessive optimism of the early cyberneticists and AI pioneers,
    reinforced by many works of science fiction. The Soviet planners could have benefited
    from an improved electronic data network of the sort that Chile were building
    to 1973. The Chilean efforts were well planned but were sabotaged by irrational
    fears of a future they could not have implemented even if they had wanted to do
    so. Ironically, today''s computers are powerful enough that centrally administering
    an entire economy might be technically feasible, but the project lost its appeal
    to a tiny group based in Venezuela (Goertzel, 2009; Dieterich, 2007).


    No one worries longer about computers bringing a communist future. But as narrow
    AI is more and widely used, alarmism is being raised in the mainstream press about
    robots replacing human workers (Rampell, 2013; Wiseman et al., 2013). Of course,
    many repetitive jobs have been and will be automated, but fears about AI are unnecessarily
    exacerbated by talking about developments that are several decades off if they
    were to be implemented next. The risk is that political opposition may impede
    potentially beneficial innovations, as it did in the Soviet Union and in Chile.
    It is important to take a broadly sociotechnical approach for a social as well
    as a technical transition.


    # 4.3 COMPUTER-BASED TRADING


    Computer-based financial trading does not aim to replace capitalism but to better
    profit from it, and it has been well funded. AI is already superior to human intelligence
    in some skills important to trading. It is certain much quicker, completing complex
    analyses and executing very'
  merge: -1
  pgno: 83
- img_proc: true
  md: '# Path to More General Artificial Intelligence ■ 75


    numbers of trades in fractions of a second. This can be viewed as cheating if
    traders are able to take advantage of information about trades by large institutional
    investors before the market has had time to react to them. Nonlinear sensitivities
    to change and interaction between programs can also cause problems. Feedback loops
    in the software can greatly accelerate losses by software errors, such as the
    August 2012 incident when Knight Capital lost $461 million in half an hour.


    Although these are new risks, the experts closest to them are not greatly concerned
    and generally view the benefits much greater than the costs. A comprehensive study
    by the Foresight (2012) in the United Kingdom concluded that computer-based trading
    has improved liquidity, transaction costs, and made market prices more efficient.
    They viewed the concerns about fraud as a public relations problem, not a real
    risk. The risks from programming errors, although real, are smaller than those
    from rogue traders, of whom have cost their employers billions of dollars in a
    few hours.


    A recent report from an analyst at the Federal Reserve Bank of Chicago (Clark,
    2012) urged traders to tighten up risk management procedures, but the procedures
    suggested were not new. Human programmers set limits and trading programs are
    cut off when they exceed those limits. The exchanges can institute "circuit breakers"
    when cut trading when parameters are exceeded. These risk management procedures
    are imposed by both the trading companies and the exchanges. The problem is that
    applying these limits can slow trading even by fractions of a second, so trading
    firms have an incentive to cut corners. Exchanges fear that imposing rigorous
    controls would cause them to lose business to competitors. The culture of the
    trading industry praises risk taking; risk managers have low status and are deprecated.
    But there are similar problems when humans conduct trading, indeed the psychology
    of irrational exuberance and panic may make things worse with humans at the helm.
    With human traders, this is also the psychological phenomenon of “normalization
    of deviance” where groups of people learn to tolerate unusual events such as spikes
    in markets until a massive disaster occurs. Computers are less susceptible to
    these subtle pressures.


    At present, risk control parameters are largely set by human analysts, not by
    automated systems. There is an advantage, however, to making the process quicker
    and more complex, which favors software over the limits. Trading software will
    evolve more and more sophisticated ways of monitoring the environment and incorporating
    the information into'
  merge: -1
  pgno: 84
- img_proc: true
  md: 'trading decisions, just as heartemakers, to be examined next, will evolve more
    and more complex ways of monitoring bodily processes. In the case of trading,
    the risks involved are only financial, they do not kill anybody, and the benefits
    seem to outweigh the costs, at least in the view of those most directly involved.


    The data available for economic analysis is much better than a few decades ago,
    vastly beyond the Soviet planners or Salvador Allende''s Chileans had. Economic
    modeling has also progressed, and its limitations are perhaps better understood.
    The challenge here is to gather more economic data, but to integrate it with other
    kinds of data and use it to accurately predict and shape market trends and set
    government policies. Stronger AI programs are clearly needed here, and they are
    being funded by finance capitalists seeking to maximize market returns. Government
    agencies will need stronger and stronger AI to man-age this economy.


    # 4.4 PACEMAKERS


    The first experimental heart pacemaker, invented in 1932, was an external mechanical
    device powered by a hand crank, with wires attached to the body (Haddad and Serdinjin,
    2009). It could be set to 30, 60, or 120 beats per minute, and run for 6 minutes
    before it needed to be cranked again. It served its purpose of demonstrating that
    electrical pulses could stabilize the human heart beat, but it was not until 1959
    that the electronics were available to create an implantable pacemaker which beat
    a steady 60 beats per minute. The batteries lasted 5 years.


    Since that, pacemakers have rapidly become more complex because the need to provide
    a flexible heartbeat that coordinates with the needs of the body''s other systems.
    Modern pacemakers also synchronize ventricular stimuli to atrial attraction. Although
    common sense would suggest that a simple mechanism would be more reliable than
    a complex one, this has not proven to be the case with pacemakers. Reliability
    has increased as the devices became more complex, due to continual improvement
    in the design and quality control of integrated circuits (Maisel, 2006). Research
    is also done to predict when pacemakers are likely to fail so they can be replaced
    well in advance.


    Further developments in this field are not focused primarily on improving reliability
    because this is already so high. The main challenge in the field is to improve
    the integration with bodily processes such as blood'
  merge: -1
  pgno: 85
- img_proc: true
  md: '# Path to More General Artificial Intelligence ■ 77


    pressure, blood glucose, and T-wave alternans (Brown University, n.d.). As implantable
    devices are developed to deal with other problems, such as insulin dispensers
    and defibrillators, the pacemakers will need to interact with these devices. This
    integration of multiple devices is a stepwise progress toward a cyborgian future,
    when and more bodily organs will be replaceable. This is moving rapidly in certain
    areas such as the development of artificial arms for injured American veterans
    that respond to signals from the brain (Dao, 2012). Based on the experience with
    pacemakers, it seems these replaceable body parts are likely to be quite reliable,
    especially those that depend on integrated circuits. Simpler implants, such as
    hip or knee replacements, may have more reliability problems because they carry
    more physical stress. These artificial organs do not yet have the self-repairing
    capabilities of natural body parts, but they can be more readily replaced when
    they wear out or are damaged.


    Pacemakers are very useful with the level of AI they now contain. Further development
    will require the information they collect and using it to predict oncoming heart
    and initiate treatments. Sensors will be needed in other parts of the body, and
    by very sophisticated AI will be needed to analyze the data streams and make recommendations.
    This software will have to develop expertise beyond that of any human specialist,
    because humans cannot analyze such massive streams of data. It would have to learn
    for itself. At times, it would have to be trusted to act quickly in the event
    of heart attacks or emergencies when there is no time to wait for human intervention.
    Of course, this raises challenges for security and reliability. These have already
    been explored in an episode of the very popular television series (Homeland, 2012)
    when terrorists assassinated the vice president of the United States by obtaining
    the password to the software controlling his pacemaker.


    # 4.5 SELF-DRIVING MOTORCARS


    Self-driving motorcars present an obvious risk of injury and death. But this risk
    also exists with human drivers and the rationales for developing self-driving
    automobiles is to cut the accident rate. Although the database is still small,
    even the early experimental technology has compared well for safety with human
    drivers (Thrun, 2006). Self-driving automobiles build on gradually evolving technologies
    including selfstarters, automatic chokes, automatic transmissions, power steering,
    lane'
