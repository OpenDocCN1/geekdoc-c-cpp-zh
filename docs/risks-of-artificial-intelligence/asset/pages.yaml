  md: "# Limitations and Risks of Machine Ethics ■ 109\n\nFriendly AI (in the sense\
    \ of a machine that is guaranteed to act in an ethical fashion at a large scale\
    \ for a long period of time) is unattainable. Thus, if this is true and the argument\
    \ for the plausibility of an intelligence explosion is also true and this carries\
    \ substantial risks, then more attention should be given to alternative AGI risk\
    \ approaches as hardware constraints, AGI “boxing”, regulation of advanced AI,\
    \ and attentiveness to and enhancement of human values rather than hoping that\
    \ our ethical intuitions will be able to be systematized in the near future.\n\
    \n# 5.6 CONCLUSION\n\nSeveral broad classes of possible machine ethics failure\
    \ modes have been identified in this chapter:\n\n+   1. Insufficient knowledge\
    \ and/or computational resources for the situation at hand\n   a. Making an exception\
    \ to a rule when an exception should not have been made based on the morally relevant\
    \ factors\n   b. Not making an exception when an exception should have been based\
    \ on the morally relevant factors\n2. Moral dilemmas facing an agent result in\
    \ the sacrificing of something important.\n3. The morals being modeled by the\
