  md: '# Errors, Insights, and Lessons of Famous AI Predictions ■ 41


    Using all the methods of Section 3.3.3, one can refine and caveat a pre-diction,
    find the nodes of disagreement, back it up whenever possible, and thus clarify
    the points where one needs to rely on expert opinion.


    What performance should then be expected from the experts? There have been several
    projects over the past decades looking into expert performance (Kahneman and Klein
    2009; Shanteau 1992). The main result is that it is mainly the nature of the task
    that determines the quality of expert performance, rather than other factors.
    Table 3.1, reproduced from Shanteau’s paper, lists the characteristics that lead
    to good or poor expert performance.


    Not all of these are directly applicable to this chapter, and hence will be explained
    in detail. One very important factor is whether experts get feedback, preferably
    immediately. When feedback is unavailable or delayed, the environment is not one
    that gives good feedback, then expert performance drops precipitously (Kahneman
    2011; Kahneman and Klein 2009). Generally, AI predictions have little possibility
    for feedback from empirical data (see Section 3.3.3), especially not rapid feedback.


    The task characteristics of Table 3.1 apply to both the overall domain and the
    specific task. Though AI prediction is strongly in the right column, any individual
    expert can improve his or her performance by moving his or her approach into the
    left column—for instance, by decomposing the problem as much as possible. When
    experts fail, better results can be achieved by asking the experts to design a
    simple algorithmic model and then using the model for predictions (Grove et al.
    2000). Thus, the best types of predictions are probably coming from well-decomposed
    models.


