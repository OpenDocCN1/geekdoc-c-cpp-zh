  md: '# 2.7 HARMFUL SYSTEMS


    Harmful systems might at first appear to be harder to design or less powerful
    than safe systems. Unfortunately, the opposite is the case. Most simple utility
    functions will cause harmful behavior, and it is easy to design utility functions
    that would be extremely harmful. There are six categories of harmful systems ranging
    from bad to worse (according to one ethical scale):


    +   - Sloppy: Systems intended to be safe but not designed correctly

    - Simplistic: Systems not intended to be harmful but have unintended consequences

    - Greedy: Systems whose utility functions reward them for controlling as much
    matter and free energy in the universe as possible

    - Destructive: Systems whose utility functions reward them for using as much free
    energy as possible, as rapidly as possible

    - Murderous: Systems whose utility functions reward the destruction of other systems

    - Sadistic: Systems whose utility functions reward them when they thwart the goals
    of other systems and gain utility as other systems'' utilities are lowered


    Designs for powerful autonomous systems are widely available, modifying them into
    one of these harmful forms would just involve simple modifications to the utility
    function. It is therefore important to develop strategies for stopping harmful
    autonomous systems. Because harmful systems are not constrained by limitations
    that guarantee safety, they can be more aggressive and use their resources more
    efficiently than safe systems. Safe systems therefore need more resources than
    harmful systems just to maintain parity in their ability to compute and act.


    # 2.7.1 Stopping Harmful Systems


    Harmful systems may be


    +   - Prevented from being created.

    - Detected and stopped early in their deployment.

    - Stopped after they have gained significant resources.'
