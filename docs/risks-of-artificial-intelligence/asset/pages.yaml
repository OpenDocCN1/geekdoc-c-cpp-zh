    # 2.6.1 Avoiding Adversarial Constraints


    In principle, we can impose this kind of constraint on any system without regard
    for its utility function. There is a danger, however, creating situations where
    systems are motivated to violate their constraints. Theorems are only as good
    as the models they are built. Systems motivated to break their constraints would
    seek to put themselves into states that the model accurately describes the physical
    reality and to exploit the inaccuracy.


    This problem is familiar to cryptographers who must watch for holes due to inadequacies
    of their formal models. For example, Zhang, Juels, Reiter, and Ristenpart (2012)
    recently showed how a virtual machine can extract an ELGamal decryption key from
    an apparently separate virtual machine running on the same host using side-channel
    information left in the host''s instruction cache.


    It is important to choose utility functions so that they “want” to obey their
    constraints in addition to formally proving that they hold. It is not sufficient,
    however, to simply choose a utility function that rewards obeying the constraint
    without an external proof. Even if a system “wants” to obey constraints, it may
    not be able to discover which do. And constraints defined via the system''s utility
    are defined relative to the system''s own semantics. If the system of the world
    deviates from ours, its interpretation of the constraints may differ from what
    we intended. Proven “external” constraints, however, will hold relative to our
    own model of the system and provide a higher confidence of compliance.


    Ken Thompson (1984) was one of the creators of UNIX, and in his Turing Award acceptance
    speech “Reflections on Trust,” he described a method for subverting the C compiler
    used to compile UNIX so that it would install a backdoor into UNIX and compile
    the original C compiler source into binaries that included his hack. The challenge
    of this Trojan horse was that it was not visible in any of the source code!'
