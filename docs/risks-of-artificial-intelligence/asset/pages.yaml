  md: '# 5.1 INTRODUCTION


    In response to the increasing sophistication and social impact of artificial intelligence
    (AI)-based technologies, some authors have proposed that software agents and robots
    be imbued with explicit principles to govern their behavior (Wallach and Allen,
    2010). This area of research, known as “machine ethics,” incorporates insights
    from normative ethics, AI, and other disciplines and seeks to instantiate models
    of ethical reasoning in order to ensure ethical machine behavior as well as to
    explore the nature and computation of human ethics. In addition, other authors
    concerned with the risks posed by future greater-than-human intelligence machines
    have characterized machine ethics as one among multiple strategies for ensuring
    positive outcomes of such machines. Yudkowski (2001), for example, argues that
    failing to develop a sufficiently well-formulated computational instantiation
    of morality will result in catastrophic outcomes from developing superintelligent
    machines, because the instrumental goals of self-improving systems seeking to
    maximize some arbitrary utility function will at some point come into conflict
    with human interests.


    What these (referred to here as “traditional machine ethics”) on the one hand,
    “artificial general intelligence (AGI) ethics” on the other, though the two have
    cross-pollinated to some extent have in common the apparent belief that the ethical
    behavior “problem” can be “solved” to some extent through philosophical and technological
    innovation. Although this chapter does not seek to undermine the desirability
    of such a solution, in principle, it points to a number of reasons to believe
    that such a project will inevitably fail to guarantee ethical behavior of a given
    AI across all possible domains. The intrinsic imperfectionability of machine ethics
    has been suggested by several authors, such as Allen et al. (2000); this chapter
    seeks to synthesize, deepen, and extend these concerns, and draw out some of their
    implications for the project of machine ethics vis-à-vis the possible social outcomes
    from AGI. Although inevitable imperfection may be acceptable to traditional ethicists,
    who have often explicitly acknowledged and accepted that machines, like humans,
    will inevitably make some mistakes, it presents a fundamental problem for the
    usefulness of machine ethics as a tool in the toolbox for ensuring positive outcomes
    from powerful computational agents (Sotal and Yampolskiy, 2013).


    The chapter will proceed as follows: first, a diverse set of inherent limitations
    on the machine ethics project which come from the nature of ethics,'
  merge: -1
  pgno: 97
- img_proc: true
  md: '# Limitations and Risks of Machine Ethics ■ 89


    the nature of computational agents in general, and the nature of the world will
    be identified. Next, some specific categories of machine ethics and AGI ethics
    proposals will be reviewed, finding that they are susceptible to the limitations
    identified in Section 5.2. A number of possible failure modes for machine ethics
    will be summarized, that is, ways which instantiating ethics principles in a powerful
    AGI system could result in outcomes that are unintended and possibly even catastrophic.
    Finally, machine ethics will be characterized as an insufficient (albeit potentially
    helpful) tool for ensuring positive social outcomes from AGI, because other factors
    (such as cybersecurity, human decisions, and systemic risks) will also have to
    be reckoned with the creation of human-level or greater-than-human intelligence
    machines.


    # 5.2 LIMITATIONS FROM THE NATURE OF ETHICS


    This section will survey some of the literature in normative ethics and moral
    psychology, which suggest that morality does not lend itself to an algorithmic
    solution. This is not to say that humans and machines cannot improve their moral
    behavior in many situations by following the prescriptions of something akin to
    an algorithm—indeed, there is widespread agreement on at least some moral rules
    (Gert, 2007). However, these rules are often ambiguous and should sometimes be
    broken, and there is persistent disagreement about the conditions in which such
    exceptions should be made, as well as broad agreement that some specific ethics
    domains are still problematic the best efforts of philosophers. Importantly, for
    the present discussion, this "unsolved" nature of ethics may be a transient condition
    owing to insufficient rational analysis, but rather a reflection of the fact that
    the intuitions on which our ethical theories are based are unsystematic at their
    core, which creates difficulties for the feasibility of machine ethics.


    Researchers dating back to Darwin in The Descent of Man (1871) have attempted
    to explain human moral judgments as deriving, at least in part, from evolutionary
    processes. Recently, Boehm (2012) has distilled much anthropological and evolutionary
    psychological evidence to argue that many of our intuitions about morality have
    their origins in prehistoric humans’ and prehuman primates’ attempts to suppress
    antisocial behavior. Under this reading of the scientific evidence, virtue, altruism,
    shame, and other morally salient concepts and emotions exist because those who
    are alive today descended from humans that adapted, genetically and'
  merge: -1
  pgno: 98
- img_proc: true
  md: 'culturally, to the demands of social cooperation. Findings in the social psychology
    and neuroscience of morality bear out the deep connection between ethical judgments
