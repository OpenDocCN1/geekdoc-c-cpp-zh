  md: '# Goal-Oriented Learning Meta-Architecture ■ 143


    I describe here AGI meta-architecture, that I label the goal-oriented learning
    meta-architecture (GOLEM), and I present a careful semiform argument that, under
    certain reasonable assumptions (and given a large, but not clearly feasible amount
    of computer power), this architecture is likely to be both steadfast and massively,
    self-improving intelligent. Full formalization of the argument is left for later
    work; the arguments given here are conceptual.


    An alternate version of GOLEM is also described, which possesses more flexibility
    to adapt to an unknown future, but lacks a firm guarantee of steadfastness.


    Discussion of the highly nontrivial problem of “how to encapsulate the goal of
    beneficialness in an AGI’s goal system” is also left for elsewhere (see Goertzel
    2010) for some informal discussion.


    # 7.2 THE GOLEM


    The GOLEM refers to an AGI system S with the following high-level architecture,
    depicted roughly in Figure 7.1:


    +   - Goal evaluator (GE). A component that calculates, for each possible future
    world (including environment states and internal program states), how well this
    world fulfills the goal (i.e., it calculates “utility” of the possible world).


