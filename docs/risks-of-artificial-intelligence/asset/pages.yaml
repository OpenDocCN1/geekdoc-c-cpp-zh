    problems of “artificial stupidity” forcibly come to bear.


    A light-hearted example demonstrating how easily autonomous systems can rapidly
    escalate out of control occurred in April 2011, when Peter Lawrence’s book The
    Making of a Fly was auto-priced upward by two “trade-bots” competing against each
    other in the Amazon reseller marketplace. The result of this process is that Lawrence
    can now comfortably out of print—once valued by one of the biggest and most respected
    companies on the Earth at $23,698,655.93 (plus $3.99 shipping). His most scholarly
    tract—first published in 1992 and currently out of print—


