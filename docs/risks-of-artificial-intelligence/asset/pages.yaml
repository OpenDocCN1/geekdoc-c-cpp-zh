    # APPENDIX: THE SIZE OF THE EXISTENTIAL THREAT


    Our understanding of the dangers facing humankind is quite limited. We have only
    a few, imperfectly understood data points, and estimates of the death toll of
    even recent and well-documented events as the Cambodian genocide, the ongoing
    Iraq conflict, are not accurate within 10%. Nevertheless, we can pin out some
    points in the geological record where mass extinctions ibitably took place. A
    good example is the Ordovician-Silurian extinction event that occurred around
    443.7 million years ago: all main phyla decimated and nearly half of the genera
    (49%) according to Rohde and Muller 2005 became extinct. The causes of this and
    similar extinctions are ill-understood, with continental drift, meteor-impact,
    and gamma-ray bursts standing out the most widely accepted hypotheses. Needless
    to say, the causes of this magnitude is in no way tantamount to controlling them,
    in spite of the widespread belief, sustained by movies such as Armageddon, that
    there is nothing that a few heroic people and a few nukes not take care of.


    When designing radioactive emission, a reasonable guideline is to limit emissions
    to orders of magnitude below the natural background radiation level, so that human-caused
    dangers are lost in the noise compared to the prehistoric threat we must live
    with anywhere. Here we take the “big five” extinction events that occurred within
    the past half billion years mass extinctions and 10^9 victims in the next one
    yields an annualized death rate of 10, ~500 for contact with hornets, wasps, and
    bees (ICD-9-CM E905.3), not to speak of death from famine, wars, and preventable
    diseases, which have several orders of magnitude higher death tolls (the annualized
    rates are declining, see Pinker (2011)). Martel (1997) estimates a'
  merge: -1
  pgno: 216
- img_proc: true
  md: '# 208 Risks of Artificial Intelligence


    considerably higher annualized death rate of 3500 from meteorite impacts alone
    (she does not consider continental drift or gamma-ray bursts), but the internal
    logic of safety engineering demands we seek a lower bound, one that we must put
    up with no what strides we make in redistribution of food, global peace, or health
    care.


    Let us define existential threat as AGI (individual or collective) pushing the
    wrong button. Current computers operate in the gigahertz range, so they can perform
    roughly $10^9$ operations per second, or about $10^{17}$ operations annually.
    Clock speeds will no doubt continue to increase, and there is no easily defensible
    upper bound in sight. Therefore we use the Planck limit and assume at most $10^{56}$
    operations per year per processor. For an AGI with a finger on the button to be
    less of an existential threat than the threat from the astronomical background
    by safety factor $m=10$, it needs a guaranteed failure rate of no more than $10^{56+}$
    operations. If it is not one AGI but several, we can use the computational capacity
    of the universe, estimated by Lloyd (2002) as $10^{20}$. These numbers rarely
    touch with the best that humanity can currently manage, the Long Now Foundation''s
    clocks with a planned lifetime of $3\times 10^{11}$ seconds.


