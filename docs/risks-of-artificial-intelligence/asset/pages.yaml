    which they use to learn the environmental uncertainties using Bayesian statistics.


    Modern artificial intelligence (AI) research has adopted this rational paradigm.
    For example, the leading AI textbook (Russell & Norvig, 2009) uses it as a unifying
    principle and an influential theoretical AI model (Hutter, 2005) is based on it.
    For definiteness, we review our formal version of optimal rational decision making.
    At each discrete time step t=1,...,t=N, the system receives a sensory input $S_i$
    and then generates an action $A_i$. The utility function is defined over sensation
    sequences $U(S_1,...,S_N)$ and the prior probability distribution $P(S_1,...,S_N|A_1,...,A_N)$
    is the prior probability of receiving a sensation sequence $S_i,...,S_N$ when
    taking actions $A_1,...,A_N$. The rational action at time t is


    ```

    $A_i^R(S_1,A_1,...,A_{i-1},S_i) = \arg\max_{S_i,...,S_N} U(S_1,...,S_N)P(S_1,...,S_N|A_1,...,A_N)A_{i-1}^R,A_i^R$

    ```


    This may be viewed as the formula for intelligent action and includes Bayesian
    inference, search, and deliberation. There are subtleties involved in defining
    this model when the system can sense and modify its structure but it captures
    the essence of rational action.


