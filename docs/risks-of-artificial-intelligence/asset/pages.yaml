    Popper''s notion of falsifiability (Popper 1934). This chapter will take every
    falsifiable statement about future AI to be a prediction.


    For the present analysis, predictions about AI will be divided into four types:


    +   Timelines and outcome predictions. These are the traditional types of predictions,
    giving the dates of specific AI milestones. Examples: An AI will pass the Turing
    test by 2000 (Turing 1950); within a decade, AIs will be replacing scientists
    and other thinking professions (Hall 2011).


    +   Scenarios. These are a type of conditional predictions, claiming that if the
    conditions of the scenario are met, certain types of outcomes will follow. Example:
    if someone builds a human-level AI that is easy to copy and cheap to run, this
    will cause unemployment among ordinary humans (Hanson 1994).


    +   Plans. These are a specific type of conditional predictions, claiming that
    if someone decides to implement a specific plan, then they will be successful
    in achieving a particular goal. Example: AI can be built by scanning a human brain
    and simulating the scan on a computer (Sandberg 2008).


    +   Issues and metastements. This category covers relevant problems with (some
    or all) approaches to AI (including sheer impossibility) and metastements about
    the whole field. Examples: an AI cannot be built without a fundamental new understanding
    of epistemology (Deutsch 2012); generic AIs will have certain (potentially dangerous)
    behaviors (Omohundro 2008).


    There will inevitably be some overlap between the categories, but the division
    is natural enough for this chapter.


    # 3.2.2 Prediction Methods


    Just as there are many types of predictions, there are many ways of arriving at—crystal
    balls, consulting experts, and constructing elaborate models. An initial review
    of various AI predictions throughout the literature suggests the following loose
    schema for prediction methods:


    > * With any such schema, the purpose is to bring clarity to the analysis, not
    to force every prediction into a particular box, so it should not be seen as the
    definitive decomposition of prediction methods.'
