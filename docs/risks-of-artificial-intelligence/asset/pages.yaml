  md: 'consequences of their own actions and those of others. Under the prevailing
    concept of artificial general intelligence (AGI), we envision artificial agents
    that have at least this high, and possibly considerably higher, levels of autonomy
    and rationality. We use the method of bounds to argue that AGIs meeting these
    criteria are subject to Gewirths''s dialectical argument to the necessity of morality,
    compelling them to behave in a moral fashion, proved Gewirth''s argument can be
    formally shown to be conclusive. The practical obstacles to bounding AGIs by means
    of ethical rationalism are also discussed.


    # 9.1 INTRODUCTION


    With the emergence of intelligent question-answering capabilities of IBM''s Watson
    to Apple''s Siri, the fear of autonomous agents harming humans, as old as mythology,
    has recently taken on new urgency (for a recent overview see Yapolskiy and Fox,
    2012). There are three factors that make particularly hard to assure such fears.
    First, the stakes are high: just as humans can now quite accidentally wipe other
    species and genera, a new breed of superintelligent machines poses an existential
    threat to humanity. Second, it is reasonable to fear the unknown, and there is
    very little we know in advance about such superintelligent beings, whether there
    will be one such individual or many, one breed or many, how they will view us.
    Third, the emergence of artificial general intelligences (AGIs) seems to be a
    slow but quite steady process—something we can understand but we are in no position
    to stop, like continental drift.


    The aim of this chapter is not simply to ease such fears but to evaluate a research
    program that can guarantee that AGI poses no existential threat. This will be
    a one-sided bound, staying some of the worst consequences of Bostrom''s (2013)
    orthogonality thesis that a high level of intelligence can be in the service of
    any goal, good or bad alike, and will say nothing about the good, possibly spectacularly
    impacts that AGI may have on the future of humanity. In Section 9.2, we argue
    that no physical interlock or other safety mechanism can be devised to restrain
    AGIs, and the guarantees are necessarily of a mathematical (deductive, as opposed
    to algorithmic) nature. This requires some shift in focus, because the current
    literature it is not local deductive system that is viewed as the primary descriptor
    of AGI behavior but rather some utility function whose maximization is the goal
    of the AGI. Yet, as we shall argue,'
  merge: -1
  pgno: 189
- img_proc: true
  md: '# Bounding the Impact of Artificial General Intelligence ■ 181


    deductive bounds are still possible: for example, consider an AGI whose goal is
    to square the circle with ruler and compass—we know in advance no matter what
    (static or dynamically changing) weights its utility function has, and no matter
    what algorithmic tricks it has in its sleeve, leaving self-modifying code, reliance
    on probabilistic, quantum, or other hypercomputing methods (Ord 2002), it simply
    cannot reach this goal.


    In Section 9.3, we present the restraining device, morality, and address the conceptual
    and practical difficulties attendant upon its use. The main conceptual difficulty
    is that the conventional human definition of “morally sound” is highly debatable,
    and one can very well imagine situations in which AGIs consider it best, from
    their moral standpoint, to do away with all of humanity except for “Noah”, start
    with a clean slate. The practical difficulty, well appreciated in the current
    literature, is to guarantee that morality is indeed proper, even on AGIs that
    are capable of transcending the limitations placed upon them by their designers.


    The central element of our proposal, *ethical rationalism*, is due to Gewirth
    (1978), with significant arguments and counterarguments scattered through the
    literature; see, in particular, Regis (1984) and Beyleveld (1992). The basic construction
    is a *purposive agent* (PPA) which can act with purpose and reason rationally—clearly
    these are conditions that any future AGI will meet by virtue of being AGI. From
    these premises, Gewirth derives a variant of the Golden Rule which he calls the
    *principle of generic consistency* (PGC) “Act in accord with the generic rights
    of your recipients [to freedom and well-being] as well as yourself.” The research
    program outlined here is to turn from a philosophical argument into a formally
    verified proof. There are plenty of potential problems, such as devising the right
    kind of action logic to sustain the proof, but we argue in Section 9.3, the kind
    of problems, that the AGI research needs to concern itself anyway.


    There are notable difficulties in the way of this program, even if we succeed
    in hardening ethical rationalism into a theory of logic, which will be discussed
    in Section 9.4. First, there is an issue of pattern recognition—given humanity’s
    propensity to disregard the PGC, when there is reason to believe that we will
    be recognized as PPAs and deemed worthy of protection by the PGC? Second, even
    when a strong argument can be disregarded on pain of contradiction, the pain so
    inflicted is relatively mild, and we see PPAs living and functioning in a self-contradicted
    state all the time. Third, a proof presupposes not just the premises, but also
    the reliability of the logical apparatus it employs. As we shall see, these problems
    are closely related.'
