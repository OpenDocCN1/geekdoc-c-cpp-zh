    Of course, one can support the AIXI agent with manually assigned “true” (instead
    of “somatic”) rewards as plan and pleasure). However, even in this case, the agent
    will be able to find some undesirable ways to maximize these rewards by seizing
    the reward channel or forcing humans to submit high values to it. It can be seen
    that events and states of the world should be valuable—not the rewards. However,
    because holistic environment models in the form of arbitrary programs q are used,
    it is difficult to bind human values of real-world objects and situations with
    these internal models. Thus, some other mathematical descriptions of motivation
    are needed.


    Indeed, the AIXI agent is the traditional reinforcement learning agent (in the
    aspect of motivation), and the classic option is here that “the reward function
    must necessarily be fixed” and “without rewards there could be no values, and
    the only purpose of estimating values is to achieve more reward” (Sutton & Barto,
    1998, p. 133). Thus, it can be seen that pure reinforcement learning approach
    is not, whereas aiming at valuable states is acceptable. Consequently, one can
    claim that values necessarily be learned, and the only purpose of the reward function
    is to bootstrap value learning.


    Values in AIXI are calculated as predicted rewards; there are no states in the
    environment model, which can be bound with values. Absence of states is caused
    by the assumption that the environment is nonstationary or partially observable.
    Indeed, if the agent considers x_i as states, it will observe high nonstationarity,
    which will be much less, if tuples x_m...x_{m-1} are used to specify states. If
    the phase space of the environment has finite dimension, a finite number of lag
    variables are required to reconstruct the environment-phase portrait in accordance
    with Takens’ theorem (1981).


    Then, is universal algorithmic induction needed? Of course, basic reinforcement
    learning (RL) techniques are not directly applicable to state spaces defined by
    lag variables because they are too huge, so all possible states will be encountered.
    And this can be considered exactly the reason to use universal induction for generalizing
    states. However, it should be used in a different form than in AIXI. Namely, the
    agent should induce the same (algorithmic) mapping from some generalized to all
    tuples x_m...x_{m-1}. Not only does this approach allowing to states, but also
    it helps to reduce computational costs of induction that was the reason to introduce
    the representational minimum description length principle.'
