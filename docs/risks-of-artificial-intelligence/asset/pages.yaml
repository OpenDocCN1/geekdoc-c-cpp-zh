  md: 'Third, equity issues may arise in the deployment of AGI systems. Such systems,
    which could assist humans in attaining arbitrary goals, would be of great personal
    and professional value. Yet the history of technological diffusion suggests that
    there is no reason to assume that all will benefit equally, or even to any extent,
    from a given technology (e.g., the continuing lack of access to purified water
    and electricity by billions of people today). Thus, even if machines act in ethical
    fashions in their prescribed domains, the overall impact may not be broadly beneficial,
    particularly if control of AGI technologies is concentrated in already powerful
    groups such as the militaries or large corporations that are not necessarily incentivized
    to diffuse the benefits of these technologies.


    Fourth, risks may arise at the system level that are not apparent or relevant
    to the decision making of individual AGIs. For example, if Hanson’s (2001) and
    Bjorgstrand and Johnson’s (2012) analyses are correct, then ubiquitous AGIs could
    lead to a decline in human wages that is not necessarily intended by any particular
    AGI or human. Also, unintended systemic effects may arise due to ubiquitous ethical
    actions carried out by previously moral affairs used by self-interested humans,
    akin to the unintended effects that can arise from ubiquitous defeating behavior
    by the commons (i.e., there could be some sort of “reverse tragedy of the commons”
    arising from inefficient social coordination). For example, it is not necessarily
    clear that explicitly altruistic behavior by all agents will necessarily be in
    the best interest of society because many social institutions (including corporations
    who do business) are based on action according a profit motive. Unanticipated
    herding or other interactive effects between AGIs could also rise with unintended
    negative consequences, as the systemic risks that have arisen due to the adoption
    of high-frequency machine trading in the stock market.


    Before proceeding to the conclusion, one final comment should be made about the
    place of machine/AGI ethics in a broader portfolio of approaches for ensuring
    positive outcomes from AGI (Muehauser et al., unpublished). The Machine Intelligence
    Research Institute has argued that because of the possibility of an intelligence
    explosion, developing Friendly AI (their term for what, in the parlance of this
    chapter, is a reliable variant of machine ethics) is an urgent engineering challenge.
    Although this chapter makes no judgment about the plausibility of an intelligence
    explosion, our response to such a possibility should be informed not by what would
    seem, in principle, to help solve the problem (such as Friendly AI) but what is
    foreseeable current values and technology. All of the considerations discussed
    so far in this chapter seem to point in the direction of'
