    Standalone systems designed to diagnose illnesses and recommend treatments were
    first developed in the 1970s (Patel et al., 2009), an approach sometimes optimistically
    described as "diagnosis without doctors" (Mazoué, 1990) or the "Greek Oracle"
    method (Miller and Masarie, 1990). These systems gave impressive results in experimental
    tests, but they were viewed as tools that physicians might use if puzzled, not
    as alternatives to diagnosis and'
