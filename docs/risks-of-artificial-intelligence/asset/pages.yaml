    Forest fires are a useful analogy. Forests are stores of free energy resources
    that fires consume. They are relatively easy to start early on but can be extremely
    difficult to contain once they have grown too large.


    The later categories of harmful system described above appear to be especially
    difficult to contain because they do not have positive goals that can be bargained
    for. Nick Bostrom comm comm December 11, 2012 pointed out that, for example, the
    long-term survival of a destructive agent is uncertain,a bargaining agent should
    be able to offer it a "pro-protected zone" for the bargaining agent. A new agent
    would be constructed with a combined utility function that rewards destruction
    outside the protected zone and the goals of the bargaining agent within it. This
    new agent would replace both of the original agents. The hint of transaction would
    be very dangerous for both agents during the transition and the opportunities
    for deception. For it to be possible, technologies are needed which provide each
    party with a high assurance that the terms of the agreement are carried out as
    agreed. Formal methods applied to a system for carrying out the agreement is one
    strategy for giving both parties high confidence that the terms of the agreement
    will be honored.


    To understand what it is necessary to stop harmful systems, we must understand
    how the power of systems scales with the amount of matter and free energy they
    control. A study of the bounds on the computational power of physical systems
    have been published (Lloyd 2000). The Bekenstein bound limits the information
    that can be contained in a finite spatial region using a given amount of energy.
    Bremermann limit bounds the maximum computational speed of physical systems. Lloyd
    presents refined limits on quantum computation, memory space, and serial computation
    as a function of the free energy, matter, and space available.


    Lower bounds on system power can be studied by analyzing particular designs. Drexler
    (1992) describes a concrete conservative nanosystem design for computation based
    on a mechanical diamondoid structure that'
