    # 3.5.5.1 Dangerous AIs and the Failure of Counterexamples


    Another thesis, quite similar to Omohundro’, is that generic AIs would behave
    dangerously, unless they were exceptionally programmed. This point has been made
    repeatedly by Roman Yampolsky, Eliezer Yudkowsky, and Marvin Minsky, among others
    (Minsky 1984; Yampolsky 2012; Yudkowsky 2008). That thesis divides the in same
    fashion as Omohundro’s: a weaker claim that any AI could behave dangerously, and
    a stronger claim that it would likely do so. The same analysis applies as for
    the “AI drives”: the weak claim is solid and the stronger claim needs extras (but
    describes a useful “simplified agent” model of behavior).


    There is another source of evidence for these theses: the inability of critics
    to dismiss them. There are many counterposals to the theses (some given in question
    and answer sessions at conferences) where critics have presented ideas that “easily”
    dispose of the dangers; every time, the authors of the theses have been able to
    point out flaws in the counterposals. This demonstrated that the critics had not
    grappled with the fundamental issues at hand, or at least not sufficiently to
    weaken the theses.


    This should obviously not be taken as a proof of the theses. But it does show
    that the arguments are difficult to counter. Informally, this is a reverse expert
    opinion test: if experts often find counterarguments, then any given counterargument
    is likely to be false (especially if it seems obvious and easy). Thus, anyargument
    should have been subject to a degree of public scrutiny and analysis, before it
    could be accepted as genuinely undermining the theses. That time, both predictions
    seem solid enough that any AI designer do well to keep them in mind in the course
    of their programming.


    # 3.6 CONCLUSION


    The aims of this chapter (Armstrong and Sotala 2012) and Chapter 2 were to analyze
    how AI predictions were made, and to start constructing a toolbox of methods that
    would allow people to construct testable predictions from most AI-related publications,
    and assess the reliability of these predictions. It demonstrated the problems
    with expert judgment, in theory and in practice. Timeline predictions were seen
    to be particularly unreliable: in general, these should be seen as containing
    little useful information.


    > See, for instance, http://lesswrong.com/lw/cbs/thoughts_on_the_singularity_institute_si/
    and http://becominggaia.files.wordpress.com/2010/06/agi-11-waser.pdf.'
