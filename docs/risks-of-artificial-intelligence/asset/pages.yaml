  md: '# Goal-Oriented Learning Meta-Architecture ■ 155


    One significant issue with this approach is ensuring conservative meta-architecture
    preservation, based on reward signals, seems problematic. Put simply, in a pure
    reinforcement learning (RL) approach, in order to learn that mucking with its
    own architecture is bad, the system would need to muck with its architecture and
    observe that it got a negative reinforcement signal. This seems needlessly dangerous!
    One can work around the problem by assuming an initial OP that has a bias towards
    conservative meta-architecture preservation. But then if one wants to be sure
    that this bias is retained over time, things get complicated. For the system to
    learn via RL that this bias is bad, it would need to try it and observe that it
    got a negative reinforcement signal.


    One could try to achieve the GOLEM within a classical RL framework by stretching
    the framework somewhat (RL++)?


    +   - Allowing the Rewarder to see the OP, and packing the predictor and GE into
    the Rewarder. In this case, the Rewarder is tasked with giving the system a reward
    based on the satisfactoriness of the predicted outcome of running its.

    - Allowing the Searcher to query the Rewarder with hypothetical actions in hypothetical
    scenarios (thus allowing the Rewarder to be used like the GE!).


    This RL++ approach is basically the GOLEM in RL clothing. It requires a very smart
    Rewarder, because the Rewarder must carry out the job of predicting the probability
    of a given OP giving rise to a world state. The GOLEM puts all the intelligence
    in one place, which seems simpler. In RL++, one faces the problem of how to find
    a good predictor, which may be solved by putting another Searcher and metaprogram
    inside the Rewarder; but that complicates inelegantly.


    Note that the predictor and GE are useful in RL++ specifically because we are
    assuming that in RL++ the Rewarder can see the OP. If the Rewarder can see the
    OP, it can reward the system for what it is going to do in the future if it keeps
    running the same OP, under various possible assumptions about the environment.
    In a strict RL design, the Rewarder cannot see the OP, and hence it can only reward
