    # 10.3.7 Self-Ownership


    Even if emulations are given personhood, they might still find the ownership of
    parts of themselves to be complicated. It is not obvious that an emulation can
    claim to own the brain scan that produced it: it was made at a point in time when
    the person did not legally exist. The process might produce valuable intellectual
    property, for example, useful neural networks that can be integrated in nonulation
    software to solve problems, in which case the matter of who has a right to the
    property and proceeds from it, emerge.


    This is not an academic question: ownership is often important for developing
    technologies. Investors want to have returns on their investment, and innovators
    want to retain control over their innovations. This was apparently motivating
    the matter in Moore v. Regents of the University of California that a patient
    did not have property rights to cells extracted from his body and turned into
    lucrative products (Gold, 1998). This might produce pressures that work against
    eventual self-ownership for the brain emulations.


    Conversely, essential subsystems of the emulation software or hardware may be
    licensed or outright owned by other parties. Does right to triumph or self-ownership
    persist? At least in the case of the first emulations, it is unlikely that they
    would have been able to sign any legal contracts, and they might have a claim.
    However, the owners might still want fair compensation. Would it be acceptable
    for owners computing facilities to slow down or freeze nonprofit? It seems that
    the exact answer depends on how emulation self-ownership is framed ethically and
    legally.


