  md: '# Long-Term Strategies for Ending Existential Risk from Fast Takeoff ■ 263


    That said, there are three strategic questions seem most important to me at this
    stage:


    +   - What fraction of x-risk from AI comes from fast takeoff?


    +   - How much credence should we give to the key premises of fast takeoff risk,
    the exponential decay model, and the major strategic considerations?


    +   - Assuming the exponential decay model holds, is it the case that ending period
    of risk is the best aim, or are there other ways to reduce overall fast takeoff
    risk more effectively?


    There are many other questions that could help us choose among these strategies,
    or that could give us more insight into how each strategy could play out:


    +   - How do the exponential decay model, major considerations, and strategies
    change if human-level AI comes sooner (<20 years) or later?


    +   - Suppose that we thought one of these strategies was best, or that we had
    some distribution over which was going to be best. What actions could we take
    now to best our changes of future success?


    +   - What evidence will likely be available about these things we approach and
    enter the period of risk, and how persuasive will it be to various parties?


    +   - How hard is it to solve different aspects of the control problem? How do
    these difficulties affect sovereign, empowered project, pro-active, and reactive
    strategies?


    +   - Can international cooperation succeed? What kinds? Are there historical
    analogs, and how often have they been successful?


    +   - What organizational challenges would different types of AI-empowered projects
