    # 2.4.3 Efficiency Drives


    Autonomous systems will also want to improve their utilization of resources. For
    example, the chess robot would like to improve its chess search algorithms to
    make them more efficient. Improvements in efficiency involve only the one-time
    cost of discovering and implementing them, but provide benefits over the lifetime
    of a system. The sooner efficiency improvements are implemented, the greater benefits
    they provide. We can expect autonomous systems to rapidly improve their use of
    physical and computational resources. They will aim to make every joule of energy,
    every atom, every bit of storage, and every moment of existence count for the
    reason of expected utility.


    Systems will be motivated to allocate these resources among their different subsystems
    according to what we have called the “resource balance principle” (Omohundro,
    2007). The marginal contributions of each subsystem to expected utility as given
    more resources should be equal. If a particular subsystem has a greater expected
    utility than the rest, then the system can benefit by shifting more of resources
    to that subsystem. The same principle applies to the allocation of computation
    to processes, of hardware to sense organs, of language terms to concepts, of storage
    to memories, or effort to mathematical theorems, and so on.


