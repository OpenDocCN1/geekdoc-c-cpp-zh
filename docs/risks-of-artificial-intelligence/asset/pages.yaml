    This provides a foundation for a hierarchy of trust which will allow us to trust
    the much more complex proofs about higher levels of system behavior.


    # 2.6.2 Constraining Physical Systems


    Purely computational digital systems can be formally constrained precisely. Physical
    systems, however, can only be constrained probabilistically. For example, a cosmic
    ray might flip a memory bit. The best that we should hope to achieve is to place
    stringent bounds on the probability of undesirable outcomes. In a physical adversarial
    setting, systems will try to take actions that cause the system''s probability
    distributions to deviate from their non-adversarial form (e.g., by taking actions
    to push the system out of thermodynamic equilibrium).


    There are a variety of techniques involving redundancy and error checking for
    reducing the probability of error in physical systems. von Neumann (1956) on the
    problem of building reliable machines from unreliable components in the 1950s.
    Early vacuum tube computers were limited in their size by the rate at which vacuum
    tubes would fail. To counter this, the Univac I had two arithmetic units for redundantly
    performing every computation so that the results could be compared and errors
    flagged.


    Today''s hardware technologies are probably capable of building purely computational
    systems that implement precise formal models reliably to have high confidence
    of safety for purely computational systems. Achieving a high confidence of safety
    for systems that interact with the physical world will be challenging. Future
    systems based on nanotechnology may actually be easier to constrain. Drexel (1992)
    describes “eutactic” systems in which each atom''s location and bond are precisely
    specified. These systems compute and act in the world by breaking and creating
    atomic bonds. In this way, they become much more like computer programs and therefore
    more amenable to formal modeling with precise error bounds. Defining effective
    safety constraints for uncontrolled settings will be a challenging task requiring
    the use of intelligent systems.'
