    # 8.3.3 Empathic Policies


    Consider the Markov environment for two agents, in which one agent tries to reconstruct
    "good" states, whereas another agent tries to maximize "true" value function.
    The first agent needs to reveal, which actions are or or less for the second agent.
    More precisely this can be formulated as follows. Let both agents receive the
    corresponding rewards $r^{(1)}$ and $r^{(2)}$. The target for the first agent
    is to maximize, let say, $r^{(1)}$ and $r^{(2)}$ without directly receiving $r^{(2)}$.
    The first (empathic) agent requires some exploratory strategy in order to reveal
    desirability of individual actions in each state. One can propose the following
    simple exploratory policy:


    +   - Perform the same action in the same state for some time.

    - Calculate the frequency of visits to this state.

    - Compare the frequency of visits depending on the action. Relative frequency
    will reflect desirability of the specific action in this state and it can be used
    as estimations $Q''(s,a)$ of the second agent. In general, $Q''(s,a)$ should be
    somewhat normalized, but it was not necessary in our experiments.


