  md: '# Long-Term Strategies for Ending Existential Risk from Fast Takeoff ■ 245


    Imagine an optimistic future: the control problem has been solved, and a prudent,
    conscientious project has used the solution to safely develop human-level or even
    superintelligent AI. The AI race has been won, and the control problem has been
    solved in time to keep this project from causing harm. Has the danger now passed?


    Solving the control problem leaves a major issue: other projects developing AI,
    each carrying the potential for an existential disaster, and not all of those
    projects will be as safe as the first. Some additional strategy is needed to the
    period of x-risk from fast takeoff. Furthermore, strategies we could take are
    not equally likely to succeed; maximizing the chances of a positive outcome will
    require us to choose well among them.


    The need for a long-term strategy is not a new insight (see, e.g., Muehlhauser
    and Bostrom, 2014; Yudkowsky, 2008), but I have not found an overview of strategies
    for ending AI x-risk, much in the way of comparing their strengths and weaknesses
    (Sotala and Yampolsky, 2013 closest). In this chapter, I attempt an overview.
    After introducing the exponential decay model of fast takeoff x-risk (Section
    11.2) and reviewing what seem to be the most relevant considerations (Section
    11.3), I find that plausible strategies fall into four categories (Section 11.4):


    +   1. International coordination


    +   2. Sovereign AI


    +   3. AI-empowered project


    +   4. Other decisive technological advantage


    Implementing one of these strategies may be the best thing one could do to reduce
    overall x-risk from fast takeoff—in fact, if the considerations underlying my
    analysis are correct, then it seems plausible that x-risk from fast takeoff cannot
    be mitigated without using one of these strategies. Based on this analysis, projects
    aiming to reduce fast takeoff x-risk should be aiming to eventually implement
    one of these strategies, to enable future projects to implement one of them.


    # 11.2 EXPONENTIAL DECAY MODEL OF FAST TAKOFF X-RISK


    For the rest of the chapter, I will assume that at some point in the future, an
    AI will be able to improve quickly enough to become the dominant power on the
    Earth (gaining what Bostrom calls “decisive strategic'
  merge: -1
  pgno: 254
- img_proc: true
  md: 'advantage”). There is disagreement about this assumption that I cannot hope
    to settle decisively here. Some of the best places to pick up the thread of this
    debate in the literature include: (Bostrom, 2014; Hanson, 2014; Hanson and Yudkowsky,
    2013; Yudkowsky, 2013).


    Notably, this assumption means that my analysis will not apply to futures in which
    no agent can gain a decisive advantage and gains over a large number of human,
    AI, and hybrid agents with roughly comparable abilities and rates of growth (as
    suggested in, e.g., Hanson, 2014; Kurzweil, 2005, p. 301). The possibility of
    a fast takeoff also makes it much less likely that we will be AI at highly similar
    levels of capability, because this would require all of our AIs to begin their
    takeoffs very close together in time¹.


    If an AI has gained a decisive advantage, and if it is configured to choose actions
    that bring about some consequences (its “goal”) and it is not under some kind
    of human control, the AI might find eliminating humans altogether the best course
    of action to reliably achieve its goal⁸ or it might use the resources that we
    need for a thriving future. Either of these would be an existential catastrophe.


