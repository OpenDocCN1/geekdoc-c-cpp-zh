    # 12.1 BACKGROUND: THE “TECHNOLOGICAL” SINGULARITY


    It is not often that we are obliged to proclaim a much-loved international genius
    work, but in his alarming prediction regarding artificial intelligence (AI) and
    the future of humankind, I believe Professor Stephen Hawking is wise. Well, to
    be precise, being a theoretical physicist—in an echo of Schrödinger’s cat, famously
    both dead and alive at the same time—I believe the eminent Professor is both wrong
    and right at the same time. Wrong because there are strong grounds for believing
    that computers will never be able to replicate all human cognitive faculties and
    right even such emulated machines may still pose a threat to mankind’s future
    existence; an existential threat, to speak.


    In a television interview on December 2, 2014, Rory Cellan-Jones asked how engineers
    had come along the path toward creating AI to, slightly alarming, Professor Hawking
    replied “Once humans develop artificial intelligence it would take off on its
    own and redress itself at an increasing rate. Humans, who are limited by slow
    biological evolution, couldn''t compete, and would be superseded.”


    Although warranting headlines that week, such predictions are not new in the world
    of science and science fiction; indeed my-colleague at the University of Reading,
    Professor Kevin Warwick, made a very similar prediction back in 1997 in his book
    March of the Machines. In the book, Kevin observed that, even in 1997 there were
    already robots with the “brain power of an insect”; soon, he predicted that there
    would be robots with the brain power of a cat, and soon after there would be machines
    as intelligent as humans. When this happens, Warwick predicted that the science
    fiction nightmare of a “terminator” machine could quickly become reality, because
    these robots would rapidly become more intelligent and superior in their practical
    skills than the humans that designed and constructed them.


    The notion of the singularity (with the accompanying vision of a future mankind
    subjugated by evil machines) is based on the ideology that all aspects of human
    mentality will eventually be instantiated by an AI


