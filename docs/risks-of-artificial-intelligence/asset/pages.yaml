  md: '# 52 Risks of Artificial Intelligence


    In the key thought experiment, Searle imagined that AI research had progressed
    to the point where a computer program had been created that could demonstrate
    the same input–output performance as a human—for instance, it could pass the Turing
    test. Nevertheless, Searle argued, this program would not demonstrate true understanding.
    He supposed the program’s inputs and outputs were in Chinese, a language Searle
    could not understand. Instead of a standard computer program, the required instructions
    were given on paper, and Searle himself was locked in a room somewhere, slavishly
    following the instructions and therefore causing the same input–output behavior
    as the AI. Because it was functionally equivalent to the AI, the setup should,
    from the “strong AI” perspective, demonstrate understanding if and only if the
    AI did. Searle argued that there would be no understanding at all: he himself
    could not understand Chinese, and there was no one in the room to understand it
    either.


    The whole argument depends on strong appeals to intuition (indeed D. Dennet (1991)
    went as far accusing it of being an “intuition pump”). The required assumptions
    are as follows:


    +   - The Chinese room setup analogy preserves the relevant properties of the
    AI’s program.


    +   - Intuitive reasoning about the Chinese room is thus relevant reasoning about
    algorithms.


    +   - The intition that the Chinese room follows a purely syntactic (symbol-manipulating)
    process rather than a semantic (understanding) one is a correct philosophical
    judgment.


    +   - The intuitive belief that humans follow semantic processes is ever correct.


    Thus, the Chinese room argument is unconvincing to that do not share Searle’s
    intuitions. It cannot be accepted solely on Searle’s philosophical expertise,
    as other philosophers disagree (Dennett 1991; Rey 1986). On top of this, Searle
    is very clear that his thought experiment does not put any limits on the performance
    of AIs (he argues that even a computer with all the behaviors of a human being
    would not demonstrate true understanding). Hence, the Chinese room seems to be
    useless for AI predictions. Can useful prediction nevertheless be extracted from
    it?'
