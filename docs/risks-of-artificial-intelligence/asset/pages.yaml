    +   4. Emulation allows exploration of another part of the space of possible minds,
    which might encompass states of very high value (Bostrom, 2008).


    Unfortunately, these considerations do not lend themselves to common parity. They
    all depend on speculative possibilities, and their probabilities and magnitude
    cannot easily be compared. Rather than giving a rationale for going ahead or for
    stopping WBE, they give reasons for assuming WBE will—or to succeed—matter enormously.
    The value of information helping determining the correct course of action is hence
    significant.


    # 10.4 DISCUSSION: SPECULATION OR JUST BEING PROACTIVE?


    Turning back from these long-range visions, we get to the mundane but essential
    issues of research ethics and the ethics of ethical discourse.


    Ethics matters because we want to do good. In order to do that, we need to have
    some ideas of what the good is and how to pursue it in the right way. It is also
    necessary for establishing trust with the rest of society—not just as public relations
    or a way of avoiding backlashes, but in order to reap the benefit of greater cooperation
    and useful criticism.


    There is a real risk of overselling and dismissing brain emulation. It has been
    a mainstay of philosophical thought experiments and science fiction for a long
    time. The potential impact for humanity (and to currently living individuals hoping
    for immortality) could be enormous. Unlike novo AI, it is possible to benchmark
    progress toward brain emulation, promising a more concrete (or arduous) path toward
    software intelligence. It is a very concrete research goal that can be visualized,
    and it will likely have a multitude of useful spin-off technologies and scientific
    findings no matter its eventual success.'
