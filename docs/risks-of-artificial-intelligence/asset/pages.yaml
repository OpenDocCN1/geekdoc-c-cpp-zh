    monitoring, automatic cruise control, blind spot monitoring, radar, and global
    positioning systems. Premium-class automobiles currently sold to the public carry
    100 million lines of computer code, more than Boeing''s new 787 Dreamliner (Vanderbilt,
    2010).


    Self-driving automobiles are being tested by Google and others essentially bundle
    these technologies. Their operation is then monitored with sophisticated algorithms
    including sequential Monte Carlo methods and Bayesian models in which latent variables
    are linked in Markov chains. A big challenge is to enable these methods to work
    quickly enough with the limiting resources that can be fitted to a motorcar. These
    innovations are not dependent on any new theoretical breakthrough; actually the
    theory seems to emerge from the practice as the software generates more abstract
    models to facilitate its analysis. Costs are expected to come down significantly,
    especially as improved video camera technology will replace radar. Cars may be
    on the market in 5 years or so with limited self-driving capabilities, as driving
    through stop-and-go traffic or on limited freeways (Levitan, 2012). Although fully
    self-driving cars have the potential to displace people employed as drivers, most
    cars are already driven by their owners or passengers, and the benefits are quite
    appealing. Safety regulations will probably keep human drivers on the job as backups
    for a long time.


    # 4.6 SURVEILLANCE AND SOUSVEILLANCE


    Although self-driving motorcars are generally viewed as desirable, surveillance
    by security agencies presents strong risks to privacy and human rights and is
    widely opposed (Ball and Webster, 2003; Brinn, 1999; Goldman et al., 2009). The
    future critics did not usually explore the difficulties in processing and analyzing
    vast quantities of surveillance data, because the computerized data-mining techniques
    required did not exist until the computer age. Today, security agencies find it
    much easier to monitor communication than voice or video, although improvements
    in audio transcription and facial recognition may soon start to close that gap.


    There is no realistically of stopping technical advance in this field, making
    legal and political resistance by civil liberties and human rights groups essential.
    This value is in countries where the rule of law is observed. It may be very difficult
    to keep security agencies from using the technologies to collect information,
    but they may be restricted in using the information so gathered in legal proceedings.'
