    # 3.5.5 What Drives an AI?


    Classification: issues and metastatements, using philosophical arguments and expert
    judgment.


    Steve Omohundro, in his paper “AI drives,” presented arguments aiming to show
    that generic AI designs would develop “drives” that would cause them to behave
    in specific and potentially dangerous ways, even if these drives were not programmed
    initially (Omohundro 2008). One of his examples was a superintelligent chess computer
    that was programmed purely to perform well at chess, but was nevertheless driven
    by that goal to self-improve, to replace its goal with a utility function, to
    defend this utility function, to protect itself, and ultimately to acquire more
    resources and power.


    This is a statement: generic AI designs would have this unexpected and convergent
    behavior. This relies on philosophical and mathematical arguments, though the
    author has expertise in mathematics and machine learning, he has no none directly
    in philosophy. It also makes implicit use of the outside view: utility maximizing
    agents are grouped together into one category and similar types of behaviors are
    expected from all agents in this category.


    In order to clarify and reveal assumptions, it helps to divide Omohundro’s thesis
    into two claims: the weaker one is that a generic AI design end up having these
    AI drives; the stronger one is that it would likely have them.


    Omohundro’s paper provides evidence for the weak claim. It demonstrates how an
    AI motivated to achieve a particular goal would nevertheless improve itself, become
    a utility maximizing agent, reach out for resources, and so on. Every step of
    the way, the AI becomes better at achieving its goal, all these changes are consistent
    with its initial programming. This behavior is very generic: only specifically
    tailored or unusual goals would preclude such drives.


    The claim that AIs generically would have these drives needs assumptions. There
    are no counterfactual resiliency tests for philosophical arguments, but something
    similar can be attempted: one can use humans as potential counterexamples to the
    thesis. It has been argued that AIs'
