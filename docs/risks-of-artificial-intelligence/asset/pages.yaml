    approach (specifically, it integrates utilitarian calculations and deontological
    ones such as sacred values). Finally, Bringsjord and Bello focus on the role of
    theory of mind (ToM) in moral psychology and argue that an appropriate computational
    account of ToM is necessary in order to reason about moral implications of one’s
    actions. Additionally, they make an argument for the importance of taking folk
    psychology seriously in machine ethics, as opposed to waiting in vain for a solution
    to ethics by philosophers. These efforts are important steps in the direction
    of scientific accounts of moral judgment, there does not appear to be any reason
    to believe that the resulting systems will be able to act reliably. The problem
    of human ethics is not merely that we do not always follow our own ethical judgments—the
    problem is also that we do not have a clear understanding of what ethical perfection
    could entail, and dual-process theories of moral judgment and the current state
    of the normative ethics literature suggest that the pursuit of the deterministic
    algorithm may be fruitless.'
  merge: -1
  pgno: 111
- img_proc: true
  md: 'Moreover, Savlescu and Persson (2012) note many characteristics of folk morality
    that appear unsuitable for the modern techno-human condition, such as a high discount
    rate, little regard for distant and unrelated people, and distinctions based on
    (arguably) irrelevant features such as inflicting harm or without direct physical
    contact. One could respond that with a computational account of folk psychology,
    we could seek to address these deficiencies by tweaking the program. However,
    this would seem to bring one back to where we started, which is that solving problem
    requires a well-specified understanding of what ethical behavior requires in the
    first place and how to improve on our intuitions, and the psychological approach
    does not appear to offer a way around this problem or the knowledge and computational
    limitations discussed earlier.


    Finally, several approaches categorized here as AGI ethics have been put forward.
    I will discuss three in particular that are characteristic of the literature:
    Coherent extrapolated volition (CEV) (Tarleton, 2010), compassion/respect (Freeman,
    2009), and Rational universal benevolence (RUB) (Waser, 2011). CEV is an approach
    based on the argument that human values are not well specified as, but upon substantial
    reflection by a superintelligence, our values may coerce to some extent and that
    convergent extrapolated values are what an AGI should seek to realize in the world.
    This approach has many desirable features—one that it can be seen as broadly democratic,
    in that it takes into consideration all human desires (though not all of them
    may fit into a coherent world, so there are potentially important considerations
    related to minority rights fit into such a framework). Additionally, the specification
    that we should realize the values “if we knew more, thought faster, were more
    the people we wished, had grown up further together” seems to get around concerns
    that could be levelled at other approaches, such as utilitarianism, could lead
    to outcomes that we would not in fact want.


    Nevertheless, CEV has various limitations. First, it makes a number of normative
    assumptions that make it vulnerable to objections from within the normative literature,
    such as rejecting objective theories of morality, in which some things are good
    regardless of whether or not they are desired, such as that put forward by Parfit
    (2011). It is also implicitly monistic in the sense that it proposes CEV as the
    sole criterion of moral righteousness and makes no room for, for example, prima
    facie duties or individual rights, or even the possibility of moral dilemmas more
    generally. Also, the notion that what we would want upon reflection then should
    be prioritized over'
  merge: -1
  pgno: 112
- img_proc: true
  md: 'we, in fact, want a controversial claim in normative ethics. This is not to
    suggest that all of these assumptions are false, but simply that CEV does not
    avoid, but rather deeply bound up with, existing controversial debates in ethics.
    Note that researchers (e.g., Tarleton, 2010) at the Machine Intelligence Research
    Institute do not characterize CEV as necessarily the one right ethical approach
    in the sense of moral realism, but rather, one way to attempt ensuring a safe
    and desirable outcome for humanity. Nevertheless, the concerns raised here apply
    to CEV in this pragmatic sense, all.


    Second, CEV appears to be computationally intractable. Not noted earlier, Reynolds''
    analysis finds that ever larger numbers of agents and decision options, as well
    as ever longer time horizons, make ethical decision making exponentially more
    difficult. CEV seems to be an unsolvable problem both in that it has an unspecified
    time horizon of the events it considers, and in the sense that it is not clear
    how much “further” the modeled humans will need to think in the simulation before
    their morals will be considered extrapolated.


    Third, even if extrapolation of ethical judgments is normatively plausible in
    some sense, it may be unacceptable for other reasons. For example, consider the
    broadly accepted consideration that people should say in their lives. If our volitions
    are extrapolated into the future, our extrapolated selves may come to conclusions
    that are unacceptable to our current selves, and particularly to disenfranchised
    groups whose views will not “win out” in the process of making our visions coherent.
    Consider again the I, Robot scenario, which would hopefully be avoided by CEV
    as opposed to utilitarianism. But what if it is actually the case that humans,
    upon sustained reflection, conclude that the robots, in fact, should be allowed
    to take over the world and make decisions for humans? Muehlhauser et al. (unpublished)
    also note that most people consider catastrophic outcomes, such as human extinction
    (an example being philosopher David Benatar, argues without any glaring contradiction,
    that humans should allow them to die gradually in light of the suffering associated
    with existence). Maybe we would accept such views upon significant reflection,
    and maybe we would not, and the actual accuracy of such views is not being judged
    here, but in practice, this uncertainty regarding our ideally extrapolated beliefs
    may be enough to prevent public acceptance of any such regime (if it had a strong
    normative argument in its favor).'
