  md: '# Errors, Insights, and Lessons of Famous AI Predictions ■ 49


    Nowadays, it is obvious that the paper’s predictions were very wrong. All the
    tasks mentioned were much harder to accomplish than they claimed at the time and
    have not been successfully completed even today. Rarely have such plausible predictions
    turned out to be so wrong; so what can be learned from this?


    The most general lesson is perhaps on the complexity of language and the danger
    of using human-understandable informal concepts in the field of AI. The Dartmouth
    group seemed convinced that they could understand certain concepts and could begin
    to capture some of this understanding in a formal model, it must be possible to
    capture all this understanding in a formal model. In this, they were wrong. Similarities
    of features do not make the models similar to reality, and using human terms—such
    as “culture” and “informal”—in these models concealed huge complexity and gave
    an illusion of understanding. Today’s AI developers have a much better understanding
    of how complex cognition can be and have realized that programming simple-seeming
    concepts into computers can be very difficult. Therefore, the main lesson to draw
    is reasoning about AI using human concepts (or anthropomorphizing the AIs by projecting
    human onto it) is a very poor guide to the nature of the problem and the time
    and effort to solve it.


    # 3.5.2 Dreyfus’s Artificial Alchemy


    Classification: issues and metastatements, using the outside view, nonexpert judgment,
    and philosophical arguments.


    Hubert Dreyfus was a prominent critic of AI. He published a series of papers and
    books attacking the claims and assumptions of the AI field, starting in 1965 with
    a paper for the RAC corporation entitled “Alchemy and AI” (Dreyfus 1965). The
    paper was famously combative, analogizing AI research to alchemy and ridicing
    AI. Later, D. Crevier (1993) would claim “time has proven the accuracy and perceptiveness
    of Dreyfus’s claims. Had he formulated them less aggressively, constructive actions
    they suggested might have been taken earlier.” Ignoring the formulation issues,
    were Dreyfus’s criticisms actually correct, and what can be learned from them?


    Was Dreyfus an expert? Though a reasonably prominent philosopher, there is nothing
    in his background to suggest perceived expertise with theories of minds and consciousness,
    and absolutely nothing to suggest familiarity with AI and the problems of the
    field. Thus, Dreyfus cannot be considered anything more than an intelligent outsider.'
