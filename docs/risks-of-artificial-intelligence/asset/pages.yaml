    It also seems to me that the mitigation strategies are far enough from business
    as usual that it is probably not feasible to implement them as a hedge against
    fast takeoff x-risk; international coordination, or even the level of support
    necessary to create sovereign AI or an AI-empowered project, may not be feasible
    in the face of considerable uncertainty about whether an AI could improve rapidly
    to gain a decisive strategic advantage. Becoming more certain about whether or
    not AI can realistically gain a decisive strategic advantage—whether fast takeoff
    is possible—would therefore a valuable pursuit for a risk mitigation project.


