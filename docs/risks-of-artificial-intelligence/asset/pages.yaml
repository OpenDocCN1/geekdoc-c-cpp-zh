    other practitioners often find the requirements for increased documentation burdensome,
    and resort to pasting in standardized boilerplate plate. Nurses find workarounds
    to avoid the burden of compliance with information systems, such as using bar
    code tags to a central nursing station and clicking on them instead of at each
    patient''s bedside when services are provided.

    AI systems generate too many warnings of possible but highly unlikely interactions,
    leading physicians to generally ignore them. Formal interactions and redundant
    checks are minimized, increasing efficiency at the cost of a greater risk of serious
    errors. Errors creep in because of different use of abbreviations or measurement
    conventions. Expenses go up rather than down because electronic systems make it
    easier to submit bills for multiple procedures.


    In the United States, these problems may be complicated by the multiplicity of
    insurance and billing systems, although billing procedures are computerized. But
    the difficulties have been very great in the United Kingdom (Fraser and Stelzer,
    2009) despite the single payer public system. The fundamental problem is integrating
    technology with a complex system that depends heavily on informal cultural practices
    and tacit knowledge. Some of these problems can be resolved with technology as
    smart wearable systems that automatically monitor body signs and input the information
    into the information systems (Chan, 2012). Indeed, the information so gathered
    may be superior in many ways to that collected by doctors and nurses. But humans
    will not be taken out of the loop for the unfore future, and successfully integrating
    AI into the system requires a sociotechnical approach that focuses on how technology
    is actually used in human social systems.


    Advances in medical informatics has also raised new privacy issues, as information
    is gathered from sensors attached to the body or collected with mobile devices
    and shared easily with providers, insurers, employers, and patients (Malin et
    al., 2013). The ready availability of information has potential for improving
    health care, but it also leads patients to lose trust in their providers and forego
    treatment or seek help outside the system, especially for mental health issues
    and other stigmatized conditions. Many of these are ethical and legal, as well
    as technical, and conflicting interests that are difficult and time consuming
    to resolve.


    As wearable systems become more widely used, sophisticated AI will be needed to
    analyze and act on the information they provide. Health informatics will create
    vast streams of data about the effectiveness of treatments and about costs and
    inefficiencies in the system. Writing'
