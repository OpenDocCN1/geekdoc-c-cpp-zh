    7.7 More Radically Self-Modifying GOLEM 157


    7.8 Concluding Remarks 158


    References 160


    ABSTRACT A high-level artificial general intelligence (AGI) architecture goal-oriented
    learning meta-architecture (GOLEM) is presented, along with an informal but careful
    argument that GOLEM may be capable of preserving its initial goals while radically
    improving its general intelligence. As a meta-architecture, GOLEM can be wrapped
    around a variety of different base-level AGI systems, and also has a role for
    a powerful narrow-AI sub as a probability estimator. The motivation underlying
    these ideas is to create AGI systems fulfilling the multiple criteria of being
    massively and self-improving intelligent, probably beneficial, and almost surely
    not destructive.


    # 7.1 INTRODUCTION


    One question looms large when thinking about the future of artificial general
    intelligence (AGI) is how to create an AGI system that will maintain its initial
    goals as it revises and improves itself—becomes so much smarter in many ways it
    becomes incomprehensible to its creators or its initial condition. One of the
    motives making this question interesting is the quest to design AGI systems that
    are massively intelligent, probably beneficial, and almost surely not destructive.


    Informally, I define an intelligent system as steadfast if, over a long period
    of time, it continues to pursue the same goals it had at the start of the time
    period, or stops acting altogether. In this terminology, one way to confront the
    problem of creating probably beneficial, almost surely nondestructive AGI, is
    to solve the two problems


    +   * How to encapsulate the goal of beneficialness in an AGI’s goal system.

    * How to create steadfast AGI, in a way that applies to the “beneficialness” among
    others.


    Of course, the easiest way to achieve steadfastness is to create a system that
    does not change or grow much. The interesting question is how to couple steadfastness
    with ongoing, radical, and transformative learning.'
