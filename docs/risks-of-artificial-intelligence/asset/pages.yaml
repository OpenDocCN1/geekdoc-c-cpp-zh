  md: '# Risks of Artificial Intelligence


    This makes the pertinence and accuracy of his criticisms that much more impressive.
    Dreyfus highlighted several overoptimistic claims for the power of AI, predicting—correctly—that
    the 1965 optimism would also fade (with, for instance, decent computers still
    a long off). He used the outside view to claim this as a near universal pattern
    in AI: initial successes, followed by lofty claims, followed by unexpected difficulties
    and subsequent disappointment. He highlighted the inherent ambiguity in human
    language and syntax, and claimed that computers could not deal with these. He
    noted the importance of unconscious processes in recognizing objects, the importance
    of context, and the fact that humans and computers operated in very different
    ways. He also criticized the use of computational paradigms for analyzing human
    behavior and claimed that philosophical ideas in linguistics and classification
    were relevant to AI research. In all, his paper is full of interesting ideas and
    intelligent deconstructions of how humans and machines operate.


    All these are astounding predictions for 1965, when computers were in their infancy
    and their limitations were only beginning to be understood. Moreover, he was not
    only off, but right for the right reasons (see, for instance, understanding of
    the difficulties computer would have in dealing with ambiguity). Not everything
    Dreyfus wrote was correct, however; at minor specific points, he proved most by
    pushing his predictions to extremes. He claimed that “the boundary may be near”
    in computer abilities, and concluded with


    > what can now be done? Nothing directly towards building machines which can be
    intelligent. [...] in the long run [we must think] of non-digital automata ...


    Currently, however, there exists “digital automata” that can beat all humans at
    chess, translate most passages to at least an understandable level, and beat humans
    at “jeopardy,” a linguistically ambiguous arena (Guizzo 2011). He also failed
    to foresee that workers in AI would eventually develop new methods to overcome
    the problems he had outlined. Though Dreyfus would later state that he never claimed
    AI achievements were impossible (McCorduck 2004), there is no reason to pay attention
    to later reinterpretations. Dreyfus’s 1965 article suggests that AI progress was
    bounded. These failures are an illustration of the principle that even the best
    of predictors is vulnerable to overconfidence.


