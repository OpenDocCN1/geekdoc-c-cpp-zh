    An often underappreciated problem is existential risk: the risk that humanity
    and all Earth-lived go extinct (or suffer a global permanent reduction in potential
    or experience) (Bostrom, 2002). Ethical analysis of the issue shows that reducing
    existential risk tends to take strong precedence over many other considerations
    (Bostrom, 2003, 2013). Brain emulations have a problematic role in this regard.
    On the one hand, they might lead to various dystopian scenarios, but on the other
    hand, they might enable some very good outcomes.


