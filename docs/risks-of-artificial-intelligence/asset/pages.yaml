    with the world outside their simulation. Nozick''s experiment demonstrates, most
    people seem to want to interact with the "real world," although that might just
    mean the shared social reality of meaningful activity rather than the physical
    world. At the very least emulated people would need some "I/O rights" for communication
    within their community. Because the virtual world is contingent upon the physical
    world and asymmetrically affected by it, restricting access only to the virtual
    is not enough if the emulated people are to be equal citizens of their wider society.


    # 10.3.6 Vulnerability


    Brain emulations are extremely vulnerable by default: the software and data constituting
    them and their mental states can be erased or changed by anybody with access to
    the system on which they are running. Their bodies are not self-contained and
    their survival is dependent upon hardware they might not have causal control over.
    They can also be subjected to undetectable violations as illicit copying. From
    an emulation perspective, software security is identical to personal security.


    Emulations also have a problematic privacy situation, because not their behavior
    can be perfectly documented by the very system they are running on, but also their
    complete brain states are open for inspection. Whether that information can be
    interpreted in a meaningful way depends on future advances in cognitive neuroscience,
    but it is unreasonable to think that by the time human emulations exist, many
    neural correlates of private mental states will be known. This would put them
    in a precarious situation.


    These considerations suggest that the ethical way of handling brain emulations
    would be to require strict privacy protection of the emulations'
