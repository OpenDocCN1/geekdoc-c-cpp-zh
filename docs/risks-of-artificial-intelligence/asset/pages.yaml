    # 2.6 DESIGNING SAFE SYSTEMS


    A primary precept in medical ethics is Primum Non Nocere which is Latin for “First,
    Do No Harm.” Because autonomous systems are prone to taking unintended harmful
    actions, it is critical that we develop design methodologies that provide a high
    confidence of safety. The best current technique for guaranteeing system safety
    is to use mathematical proof. A number of different systems using “formal methods”
    to provide safety and security guarantees have been developed. They have been
    successfully used in a number of safety-critical applications.


    The Formal Methods Wiki (http://formalmethods.wikia.com/wiki/Formal_methods) provides
    links to formal methods systems and research. Most systems are built using first-order
    predicate logic to encode one of the three approaches to mathematical foundations:
    Zermelo-Fraenkel set theory, category theory, or higher order type theory. Each
    system introduces a specialized syntax and ontology to simplify the specifications
    and proofs in their application domain.


    To use formal methods to constrain autonomous systems, we need to first build
    formal models of the hardware and programming environment that the systems run
    on. Within those models, we can prove that the execution of a program will obey
    safety constraints. Over the longer term, we are able to prove such constraints
    on systems operating freely in the world. Initially, however, we will need to
    severely restrict the system''s operating environment. Examples of constraints
    that early systems should'
