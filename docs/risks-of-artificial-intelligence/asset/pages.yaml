  md: '# Limitations and Risks of Machine Ethics


    Miles Brundage


    +   CONTENTS

    5.1 Introduction 88

    5.2 Limitations from the Nature of Ethics 89

    5.3 Limitations Arising from Bounded Agents and Complex Environments 93

    5.4 Current Approaches to Machine/AGI Ethics 98

    5.5 Insufficiency of Machine Ethics in Guaranteeing Positive AI Outcomes 107

    5.6 Conclusion 109

    Acknowledgments 110

    References 111


    ABSTRACT Many authors have proposed constraining the behavior of intelligent systems
    with “machine ethics” to ensure positive social outcomes from the development
    of such systems. This chapter critically analyzes the prospects for machine ethics,
    identifying several inherent limitations. Although machine ethics may increase
    the probability of ethical behavior in some situations, it cannot guarantee it
    due to the nature of ethics, the computational limitations of computational agents,
    and the complexity of the world. Additionally, machine ethics, even if it were
    to be “solved” at a technical level, would be insufficient to ensure positive
    social outcomes from intelligent systems.'
