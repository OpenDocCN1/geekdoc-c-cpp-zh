    ABSTRACT Predicting the development of artificial intelligence (AI) is a vital
    one, according to some analysts. AI predictions already abound: but are they reliable?
    This chapter will start by proposing a decomposition schema for classifying them.
    Then it constructs a variety of theoretical tools for analyzing, judging, and
    improving them. These tools are demonstrated by careful analysis of five famous
    AI predictions: the initial Dartmouth conference, Dreyfus''s criticism of AI,
    Searle''s Chinese room paper, Kurzweil''s predictions in The Age of Spiritual
    Machines, and Omohuordre’s “AI drives” paper. These case studies illustrate several
    important principles, such as the general confidence of experts, the superiority
    of models over expert judgment, and the need for greater uncertainty in all types
    of predictions. The general reliability of expert judgment in AI timeline is shown
    to be poor, a result that fits in previous studies of expert competence.


    # 3.1 INTRODUCTION


    Predictions about the future development of artificial intelligence (AI) are as
    confident as they are diverse. Starting with Turing’s initial estimation of a
    30% pass rate on Turing test by the year 2000 (Turing 1950), computer scientists,
    philosophers, and journalists have never been shy to offer their own prognostics,
    claiming AI to be impossible (Jacquette 1987), just around the corner (Darrach
    1970) or anything in between.


    > * AI is used here in the old fashioned sense of a machine capable of human-comparable
    cognitive performance; a less ambiguous modern term would be “AGI,” artificial
    general intelligence.'
  merge: -1
  pgno: 39
- img_proc: true
  md: '# Errors, Insights, and Lessons of Famous AI Predictions ■ 31


    What should one think of this breadth and diversity of predictions? Can anything
    of value be extracted from them, or are they to be seen as mere entertainment
    or opinion? The question is an important one, because true AI would have a completely
    transformative impact on human society—and many have argued that it could be extremely
    dangerous (Minsky 1984; Yampskiy 2012; Yudkowsky 2008). Those arguments are predictions
    in themselves, so an assessment of predictive reliability in the AI field is a
    very important project. It is in humanity''s interest to know if these predictions
    are reasonable, and if, when and how AI is likely to be developed. Even if the
    risks turn out to be overlblown, simply knowing the reliability of general AI
    predictions will have great social and economic consequences.


    The aim of this chapter is to construct a framework and tools of analysis that
    allow for the assessment of predictions, their quality, and their uncertainties.
    Though specifically aimed at AI, these methods can be used to assess predictions
    in other contexts and uncertain fields.


    This chapter first proposes a classification scheme for predictions, dividing
    them into four categories and analyzing what types of arguments are used (implicitly
    or explicitly) to back them. Different prediction types and methods result in
    different performances, and it is critical to understand this varying reliability.
    To do so, this chapter will build a series of tools that can be used to clarify
    a prediction, reveal its hidden assumptions, and make use of empirical evidence
    whenever possible.


    Because expert judgment is such a strong component of most predictions, assessing
    the reliability of this judgment is a key component. Previous studies have isolated
    the task characteristics in which experts tend to have good judgment—and results
    of literature strongly imply that AI predictions are likely to be very unreliable,
    at least as far as timeline predictions ("date until AI") are concerned. That
    theoretical result is born out in practice: timeline predictions are all over
    the map, with no pattern of convergence and no visible difference between expert
    and nonexpert predictions. These results were detailed in a previous paper (Armstrong
    and Sotala 2012) and are summarized here.


    The key part of the chapter is a series of case studies on five of the most famous
    AI predictions: the initial Dartmouth conference, Dreyfus''s criticism of AI,
    Searle''s Chinese room paper, Kurzweil''s predictions in The Age of Spiritual
    Machines, and Omohundro''s AI drives. Each prediction is analyzed in detail, using
    the methods developed earlier. The Dartmouth conference proposal was surprisingly
    good—despite being inaccurate, it would have seemed to be the most reliable estimate
    at the time.'
