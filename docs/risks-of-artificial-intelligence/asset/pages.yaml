    Dreyfus''s work was very prescient, despite his outsider status, and could have
    influenced AI development for the better—had it not been so antagonistic to the
    field. Some predictions could be extracted even from Searle''s nonproductive Chinese
    room experiment, mostly criticisms of the AI work of time. Kurzweil''s predictions
    were tested with volunteer assessors and shown to be surprisingly good—but his
    self-assessment was very inaccurate, showing some doubt on his later predictions.
    Finally, Omohuro''s predictions were shown to be much better as a warning for
    what could happen to general AIs, than as emphatic statements of what would necessarily
    happen.


    The keys learned are all of general overconfidence of experts, the possibility
    of deriving testable predictions from even the most theoretical of papers, the
    superiority of model-based over judgment-based predictions, and the great difficulty
    in assessing the reliability of predictors—by all reasonable measures, the Dartmouth
    conference predictions should have been much more reliable than Dreyfus''s outside
    predictions, and yet reality was completely opposite.


    # 3.2 TAXONOMY OF PREDICTIONS


    # 3.2.1 Prediction Types


    If present trends continue, the world will be ... eleven degrees colder by the
    year 2000.


    > KENNETH E.F. WATTnEarth Day, 1970


    A fortune-teller talking about celebrity couples, a scientist predicting the outcome
    of an experiment, and an economist pronouncing on next year''s gross domestic
    product are canonical examples of predictions. There are other types of predictions,
    though. Conditional statements—if X happens, then so will Y—are also valid, narrower
    predictions. Impossibility results are also a form of prediction. For instance,
    the law of conservation of energy gives a very broad prediction about every single
    perpetual machine ever made: to wit, that they will never work.


    The common thread is that all these predictions constrain expectations of the
    future. If one takes the prediction to be true, one expects to see different outcomes
    than one if it takes to be false. This is closely related to


