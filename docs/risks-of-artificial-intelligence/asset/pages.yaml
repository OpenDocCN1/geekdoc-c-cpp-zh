    A lot of people who achieve their “big” goal, such as becoming famous, tend to
    do drugs. Those who lose a goal (death of a child) or are not fully intellectually
    developed (children, teenagers) are also more likely to wirehead if not prevented
    from doing so. The stronger one is committed to their goal(s), the less likely
    they are to wirehead.


    # 6.4 PERVERSE INSTANTIATION


    Even nonheading superintelligence may have an extremely negative impact on human
    welfare if superintelligence does not possess common sense. The challenge, known
    as “perverse instantiation” (Bostrom, 2011), is easy to understand via some cited
    examples (Yampolsky, 2011b). Suppose scientists succeed in creating a superintelligent
    machine and order it to “make all people happy”. Complete happiness for humankind
    is certainly a noble and worthwhile goal, but perhaps we are not considering some
    unintended consequences of giving such an order. Any nonexhaustive list may include
    making all people healthy, wealthy, beautiful, and talented, giving them loving
    relationships and never entertainment. However, many alternative ways of “making
    all people happy” could be derived by a superintelligent machine. Examples are
    as follows:


    +   - Killing all people trivially satisfies this request with 0 people around
    all of them being happy.


    +   - Forced lobotomies for every man, woman, and child might also accomplish
    the same goal.


    +   - A simple observation that happy people tend to smile lead to forced plastic
    surgeries to affix permanent smiles to all human faces.


    +   - A daily cocktail of cocaine, methamphetamine, methylphenidate, nicotine,
    and 3,4-methylenedioxymethamphetamine, better known as ecstasy, may do the trick.'
  merge: -1
  pgno: 140
- img_proc: true
  md: '# 132 ■ Risks of Artificial Intelligence


    An infinite number of other approaches to accomplish universal human happiness
    could be derived. For a superintelligence, the question is simple which one is
    fastest/cheapest (in terms of computational resources) to implement, although
    the final outcome may literally be as requested, the path chosen may be anything
    but desirable for humanity. This is sometimes referred to as the literalness problem
    (Muehlhauser & Helm, 2012). In the classical definition, the problem is based
    on precise interpretation of words as given in the order (wish) rather than the
    desired meaning of such words. We can expand the definition to include ambiguity
    over tone of voice, sarcasm, jokes, and so on.


    Numerous humorous anecdotes are based around this idea. For example, married couple,
    60 years old, were celebrating their 35th anniversary. During their party, a fairy
    appeared to congratulate them and grant them a wish. The couple discussed their
    options and agreed upon a wish. The husband voiced his desire, "I wish I had a
    wife 30 years younger than me." The fairy picked up her wand and poof—the husband
    was 90.


    Realizing the dangers presented by a literal instantiation granted by an all-powerful
    being has begun on properly phrasing some of the common wishes (Yudkowsky, 2011).
    The Open-Source Wish Project (OSWP) (Anonymous, 2006) attempts to formulate in
    precise and safe from perverse instantiation form common wishes as immortality,
    being rich, having true love, and omnipotence. For example, the latest version
    of the properly formed request for immortality is formalized as follows: "I wish
    to live in the locations of my choice, in a physically healthy, uninjured, and
    apparently normal version of my current body containing my current state, a body
    which will heal from all injuries at a rate three sigmas faster than the average
    given medical technology available to me, and which will be protected from any
    diseases, injuries or illnesses causing disability, pain, or degraded functionality
    or any sense for more than ten days consecutively or fifteen days in any year;
    at any time I may rejuvenate my body to a younger age, by saying a phrase matching
    this pattern times without interruption, and with conscious intent: ''I wish to
    be age,'' followed by a number between one and two hundred, followed by years
    old,'' at which point the pattern ends—after saying a phrase matching that pattern,
    my body will revert to an age matching the number of years I started and I will
    commence to age normally from that stage, with all of my memories intact; at any
    time I die, by saying five times without'
  merge: -1
  pgno: 141
- img_proc: true
  md: '# Utility Function Security in Artificially Intelligent Agents ■ 133


    interruption, and with conscious intent, ''I wish to be dead''; the terms ''year''
    and ''day'' in this wish shall be interpreted as the ISO standard definitions
    of the Earth year and day as of 2006.'' Even that is perceived by many to be too
    vague, and therefore, a lengthy list of corrections is available at the project
    website (Anonymous, 2006).


    Unfortunately, OSWP is not a feasible approach to the perverse instantiation problem.
    To see why this is the case, we can classify all wish grantors into three categories
    (literal—who exactly do what they are told and do not understand hyperbole; evil—who
    will choose the absolute worst, de 2012a) but technically still valid interpretation
    of the wish; and benevolent—who will actually do what is intended and beneficial
    by the wisher. The OSWP approach if executed perfectly may minimize problems with
    a literal granter. In fact, we can take the OSWP one step further and avoid all
    ambiguities of human languages by developing a vagueness free language.


    Development of engineered languages has been attempted in the past (Devito & Oehrle,
    1990). In particular, engineered logical languages that are designed to enforce
    unambiguous statements by eliminating syntactic and semantic ambiguity could provide
    the necessary starting point. Well-known examples are Loglan (Brown, 1960) and
    Lojban (Goertzel, 2005). More recently, some Agent Communication Languages (ACLs)
    have been proposed for communication among software agents and knowledge-based
    systems. The best known are Knowledge Query and Manipulation Language (KQML) developed
    as a part of DARPA''s Knowledge Sharing Effort (KSE) (Nese et al., 1991; Patel
    et al., 1992) and Foundation for Intelligent Physical Agents (FIPA-ACL) (Finin
    et al., 1992). In addition to being ambiguity free, the proposed language should
    also be powerful enough to precisely define the states of the universe, perhaps
    down to individual subatomic particles or at least with respect to their probabilistic
    distributions.


    A benevolent granter who has enough common sense to avoid the literalness problem
    is what we hope to be faced. In fact, in the presence of such an entity, wishing
    it becomes unnecessary; the wish granter already knows what is best for us and
    what we want and we will start work on it as soon as it is possible (Yudkovsky,
    2007). It may be possible to recalibrate a willing to learn wish granter to perfectly
    match our worldview via a well-known theorem by Aumann (1976) which states that
    two Bayesians who share the same priors cannot disagree and their opinion on any
    topic of knowledge is the. Aaronson (2005)'
  merge: -1
  pgno: 142
- img_proc: true
  md: 'has shown that such a process can be computationally efficient, essentially
    giving you a wish granter who shares your frame of mind. However, it has been
    argued that it might be better to rather have a wish granter whose prior probabilities
    correspond to the real world instead of simply being in sync with the wiser (Yudkowsky,
    2007).


    Finally, if we are unfortunate enough to deal with an antagonistic wish granter
    simply having ambiguity in the phrasing of our orders is not sufficient. If the
    wish granter chooses to obey our order, he or she may do so by "... executing[searching]
    all possible strategies which satisfy the wording of the wish, and select[ing]
    strategy yields consequences least desirable to the wish” (Yudowsky, 2011, p.5).
    The chosen wish fulfillment path may have many unintended side effects or cause
    temporary suffering until the wish is fully executed. Such a wish granter is an
    equivalent of a human sociopath pursuing a pervasive pattern of disregard for,
    and violation of, the others (Anonymous, 2000a).


    As the wish becomes ever formal, the changes of a critical error in the phrasing,
    even using nonambiguous engineered language, increase exponentially. Additionally,
    a superintelligent artifact may be able to discover a loophole in our reasoning
    which is beyond our ability to comprehend. Consequently, perverse instantiation
    is a serious problem accompanying superintelligence. As long as the superintelligence
    does not have access to a human common-sense function, there is little we can
    do to avoid dangerous consequences and existential risks resulting from perverse
    instantiations of our wishes. Whether there is a common function which all humans
    share or if there actually are a number of common sense functions as seen in different
    cultures, times, casts, and so on remains to be determined.


    # 6.5 CONCLUSIONS AND FUTURE WORK


    In this chapter, we have addressed an important issue of reward function integrity
    in artificially intelligent systems. Throughout the chapter, we have analyzed
    historical examples of wireheading in man and machine, and evaluated a number
    of approaches proposed for dealing with reward function corruption. Although simplistic
    optimizers driven to maximize a proxy measure for a particular goal will be subject
    to corruption, sufficiently rational self-improving machines are believed by many
    to be safe from wireheading problems. They claim that their true goals are different
    from the proxy measures utilized to represent the progress toward goal achievement
    in their fitness functions'
  merge: -1
  pgno: 143
- img_proc: true
  md: '# Utility Function Security in Artificially Intelligent Agents ■ 135


    and will choose not to modify their reward functions in a way which does not improve
    chances for the true goal achievement. Likewise, supposedly such advanced machines
    will choose to avoid corrupting other system components as input sensors, memory,
    internal and external communication channels, CPU architecture, and software modules.
    They will also work on making sure that external environmental forces including
    other agents will not make modifications to them (Omohundroy, 2008). We have presented
    a number of potential reasons for arguing that wireheading problem is far from
    being completely solved. Nothing precludes smart self-improving systems from optimizing
    their reward mechanisms in order to optimize their current goal achievement and
    in the process making a mistake leading to corruption of their reward functions.


    In many ways, the theme of this chapter is about addiction and mental illness,
    topics well studied in human subjects, will manifest in artificially intelligent
    agents. On numerous occasions, we have described behaviors equivalent to suicide,
    autism, antisocial personality disorder, drug addiction, and many others in intelligent
    machines. Perhaps via better understanding of these problems in artificial agents,
    we will also become better at dealing with them in biological entities.


    A still unresolved is the problem of perverse instantiation. How can we provide
    orders to superintelligent machines without danger of ambiguous order interpretation
    resulting in a serious risk? The answer seems to require machines that have childlike
    common sense to interpret the meaning of our words. However, being superintelligent
    and having common sense are not the same things, and it is entirely possible that
    we will succeed in constructing a machine that has one without the other (Yampolskiy,
    2011c). Finding a way around the literalness problem is a major research challenge
    and a subject of our future work. A new language specifically developed to avoid
    ambiguity may be a step in the right direction.


    Throughout this chapter we have considered wireheading as a potential choice made
    by the intelligent agent. As smart machines become more prevalent, a possibility
    will arise that undesirable changes to the fitness function will be a product
    of the external environment. For example, in the context of military robots, the
    enemy may attempt to reprogram the robot by hacking or computer virus to turn
    it against its original designers—a situation which is similar to that faced by
    human war prisoners subjected to brainwashing or hypnosis. Alternatively, robots'
  merge: -1
  pgno: 144
- img_proc: true
  md: 'could be kidnapped and physically rewired. In such scenarios, it becomes important
    to be able to detect changes in the agent’s reward function caused by forced or
    self-administered wireheading. Behavioral profiling of artificially intelligent
    agents may present a potential solution to wireheading detection (Ali, Hindi,
    & Yampolskiy, 2011a; Yampolskiy, 2008a; Yampolskiy & Govindaraju, 2007, 2008 a,b).


