    # ABSTRACT


    If, at some point in the future, each artificial intelligence (AI) development
    project carries some amount of existential risk from fast takeoff, our chances
    of survival will decay exponentially until the risk period is ended. In this chapter,
    I review strategies for ending the risk period. It seems that effective strategies
    will need to be resilient to government involvement (nationalized projects, regulation,
    or restriction), will need to account for the additional difficulty of solving
    some form of the control problem beyond the development of AI, and will need to
    deal with the possibility that many projects will be unable or unwilling to make
    the investments required to robustly solve the control problem. Strategies to
    end the risk period could take advantage of the capabilities provided by powerful
    AI, or of the incentives and abilities governments will have to mitigate fast
    takeoff. Based on these considerations, I find four classes of strategy—international
    coordination, sovereign AI, AI-powered project, or other decisive technological
    advantage—could plausibly end the period of risk.


    # 11.1 INTRODUCTION


    It has been argued that after some level of artificial intelligence (AI) capability
    is reached, an AI might be able to improve very quickly, and could gain enough
    cognitive capability to become the dominant power on the Earth. Call this "fast
    takeoff." In this chapter, I assume that fast takeoff will be possible at some
    point in the future and to clarify the result-ing situation.


    Most work on existential risk (x-risk)* from long-term AI capabilities has focused
    on the problem of designing an AI that would remain safe even if it were to undergo
    a fast takeoff. Bostrom calls this the control problem.†


    > * Chalmers, The singularity: A philosophical analysis; Bostrom, Superintelligence:
    Paths, Dangers, Strategies.


    > † Bostrom, Existential risk prevention as global priority.


    > † Superintelligence, p. 128.'
