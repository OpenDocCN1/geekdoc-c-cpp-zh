    merging of narrow AI and strong AI approaches. This will be necessary as programmers
    seek to move beyond narrowly defined tools to developing software agents capable
    of acting independently in complex environments. The present stage of AI development
    is propitious for this because of the exponential increases in computer power
    and in available data streams over the past 25 years, and because of better understanding
