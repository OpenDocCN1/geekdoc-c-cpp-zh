  md: '# 5.5 INSUFFICENCY OF MACHINE ETHICS IN GUARANTEEING POSITIVE AI OUTCOMES


    Even if the machine/AGI ethics problem were "solved," the deployment of AGI systems
    on a large scale may not actually lead to positive social outcomes. First, one
    can imagine malevolent human training a machine on experiences that would lead
    to the development of a warped sense of morality, akin to the ways in which cults
    limit the information available to their members. Absent a totalitarian state
    in which academic freedom and the ability to tinker with one''s purchased technologies
    are eliminated, people will be able to reprogram machines to fit their preferences.
    As such, a "technical" solution to machine ethics may mean little in a world where
    unethical humans exist and have access to advanced technology.


    A second related concern is that even if the software problem is solved, cybersecurity
    vulnerabilities on the hardware side may lead to unethical outcomes from advanced
    AGI systems. In humans, the concepts of benevolence, competence, and integrity
    are often distinguished in the context of trust (Mayer et al., 1995). These terms
    may not mean the same thing in machines as they do in humans, but some interesting
    lessons can be learned. Humans have a background set of psychological traits which
    are typically assumed by default in trusting relationships, including empathy,
    and it is hoped that they will not be steered away from benevolent behavior by
    malevolent individuals, the strength of one''s moral convictions/integrity is
    crucial for establishing trust. One does not expect a human to instantaneously
    become malevolent after a lifelong of benevolent behavior (although it should
    be noted that the environments matter greatly in determining whether people will
    violate ethical constraints, even when involved people do, have empathy). Insofar
    as there is a machine analog of moral integrity, it is to say, a virtual or physical
    autonomous system could be manipulated into actions with harmful sequences. Insolar
    as the consequences of a machine''s actions and existence reflect back upon it
    can be seen as having more or less integrity to the extent to which its software
    and hardware are immune to corruption by outside sources. In other words, a system
    that is "unhackable" will be and should be considered as more likely to be sustainably
    benevolent than one which is vulnerable to hacking, but given the frequency of
    news reports about incursions into supposedly secure information systems, machine
    ethics needs to be considered in the context of the security of the broader human-information
    technology ecosystem.'
  merge: -1
  pgno: 116
