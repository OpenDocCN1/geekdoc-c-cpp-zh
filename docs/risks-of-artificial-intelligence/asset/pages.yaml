  md: '# Errors, Insights, and Lessons of Famous AI Predictions ■ 51


    In 1965, people would have been justified to find Dreyfus’s analysis somewhat
    implausible. It was the work of an outsider with no specific relevant expertise,
    and dogmatically contradicted the opinion of genuine experts in the AI field.
    Though the claims it made about human and machine cognition seemed plausible,
    there is a great difference between seeming plausible and actually being correct,
    and his own nonexpert judgment was the main backing for the claims. Outside of
    logic, philosophy had to contribute much to the field of AI, so no intrinsic reason
    to listen to a philosopher. There were however, a few signs that the paper was
    of high quality: Dreyfus seemed to be very knowledgeable about progress and work
    in AI, and most of his analyses on human cognition were falsifiable, at least
    to some extent. They were still not strong arguments to heed the skeptical opinions
    of an outsider.


    The subsequent partial vindication of the therefore is a stark warning: it is
    very difficult to estimate the accuracy of outsider predictions. There were many
    reasons to reject Dreyfus’s predictions in 1965, and what would have been the
    wrong thing to do. Blindly accepting nonexpert outsider predictions would also
    have been a mistake, however: these are most often in error (see Section 3.3.4.2).
    One general lesson concerns the need to decrease certainty: the computer scientists
    of 1965 should at least have accepted the plausibility (if not the plausibility)
    that some of Dreyfus’s analysis was correct, and they should have spent more attention
    to the “success-excitement-difficulties-stalling” cycles in their field to see
    if the pattern continued. A second lesson could be about the importance of philosophy:
    it does seem that philosophers’ meta-analytical skills can contribute useful ideas
    to AI—a fact that is certainly not self-evident (see also Section 3.5.5).


