  md: '# 224 ■ Risks of Artificial Intelligence


    Principle of assuming the most (PAM): Assume that any emulated system could have
    the same mental properties as the original system and treat it correspondingly.


    The mice should be treated the same in the real laboratory as the virtual. It
    is better to treat a simulacrum as the real thing than to mistreat a sentient
    being. This has the advantage that many of the ethical principles, regulations,
    and guidance in animal testing can be carried out directly to the pursuit of brain
    emulation.


    This has some similarity to the principle of substrate nondiscrimination ("If
    two beings have the same functionality and the same conscious experience, and
    differ only in the substrate of their implementation, then they have the same
    moral status") (Bostrom & Yudkowski, 2014) but does not assume that the conscious
    experience is identical. However, if one were to reject the principle of substrate
    nondiscrimination on some grounds, then it seems that one could also reject PAM
    because one has a clear theory of what systems have moral status. However, this
    seems to be a preumptuous move given the uncertainty of the question.


    Note that once the principle is applied, it makes sense to investigate in what
    ways the assumptions can be sharpened. If there are reasons to think that certain
    mental properties are not present, they overrule the principle in that case. An
    emulated mouse that does not respond to sensory stimuli is clearly different from
    a normal mouse. It is also relevant to compare to the right system. For example,
    the CyberChild, despite its suggestive appearance, is not an emulation of a human
    infant but at most an etiolated subset of neurons in a generic mammalian nervous
    system.


    It might be argued that PAM is too extreme, and that it forecloses much of the
    useful pain research discussed by Britton and Skeving (1996). However, it is agnostic
    on whether there exists overruling human interests. What is left for the ethical
    theory of the user to determine, for example, using cost–benefit methods. Also,
    as discussed in the following, it might be quite possible to investigate pain
    systems without phenomenal consciousness.


    # 10.2.5 Ameliorating Virtual Suffering


    PAM implies that unless there is evidence to the contrary, we should treat emulated
    animals with the same care as the original animal. This means in most cases that
    practices that would be impermissible in the physical lab are impermissible in
    the virtual lab.'
