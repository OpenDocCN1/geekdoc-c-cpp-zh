  md: '# Risks of Artificial Intelligence


    ABSTRACT Military and economic pressures are driving the rapid development of
    autonomous systems. These systems are likely to behave in antisocial and harmful
    ways unless they are very carefully designed. Designers will be motivated to create
    systems that act approximately rationally and rational systems exhibit universal
    drives towards self-protection, resource acquisition, replication, and efficiency.
    The current computing infrastructure will be vulnerable to unconstrained systems
    with these drives. We describe the use of formal methods to create provably safe
    but limited autonomous systems. We then discuss harmful systems and how to stop
    them. We conclude with a description of the “safe-AI scaffolding strategy” for
    creating powerful safe systems with a high confidence of safety at each stage
    of development.


    # 2.1 INTRODUCTION


    Autonomous systems have the potential to create tremendous benefits for humanity
    (Diamandas & Kotler, 2012), but they may also cause harm by acting in ways not
    anticipated by their designers. Simple systems such as thermostats “autonomous”
    in the sense that they take actions without human intervention, but a thermostat’s
    designer predetermines the system’s response to every condition it will. In this
    chapter, we use the phrase “autonomous system” to describe systems in which the
    designer has not predetermined the responses to every condition. Such systems
    are capable of surprising their designers and behaving in unexpected ways. See
    Müller (2012) for more insights into the notion of autonomy.


    There are several motivations for building autonomous systems. Competitive situations
    are often time sensitive and create pressure to remove human decision making from
    the critical path. Autonomous systems may also be cheaply replicated without requiring
    additional human operators.


    The designer of an autonomous system chooses system goals and the itself searches
    for and selects at least some aspects of actions that will best achieve those
    goals. In complex systems, the designer cannot afford to examine all possible
    operating conditions and the system’s response. This kind of autonomous system
    is rare today but will become much more common in the near future. Today, failures
    arise from systems which were intended to be preprogrammed but whose designers
    neglected'
