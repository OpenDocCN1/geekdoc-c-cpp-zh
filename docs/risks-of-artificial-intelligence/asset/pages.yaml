    # 9.5 CONCLUSIONS


    In the history of ideas, ethical precepts are traditionally attributed to the
    sages. Variants of the PGC go back to Confucius “Do not impose on others what
    you yourself do not desire” (Analects II 2), Buddha “Hurt not in others in ways
    that you would find hurtful” (Udana-Rga 5.18), Jesus “So in everything, to others
    what you would have them do to you, for this sums up the Law and the Prophets”
    (Matt. 7:12), and Muhammad “No one of you will become a true believer until he
    desires for what he desires” (Sahih Al-Bukhari), and can be found in any most
    sacred book from the Mahabharata “Do not do to others what would cause pain done
    to you” (5.1517) by the Shayest Na-Shayest “Not to do unto all that which is not
    well for one’s self” (13.29). This tradition assumes ethics is divinely inspired,
    and this laws carry a special, transcendent authority.


    Another view, characteristic of the Enlightenment, and given modern form in Rawls
    (1971), takes morals to be the result of a social contract. Closely related is
    the historical view, which takes them to be the result of a long social process
    that begins with “folk law” (Renteln and Dundes 1995). Modern research extends
    this to prehistory based on the observation that not just humans but primates
    already come with inherited moral traits such as compassion (de Waal 1997, 2009),
    and in Section 9.4.1, we already pointed at one issue, recognition of PPAs, that
    seems to rely on some form of hardware support. To the extent collaborative behavior
    can be advantageous even in a purely goal-directed setting (Munoz de Côte et al.
    2010; Waser 2012), in due time we can expect the PGC to emerge directly under
    evolutionary pressure. As Bayles (1968):


    It seems that [egoism] would often result in severe competition between people,
    since each person would be out to get the most for himself, and what might involve
    deving others. However, serious defenders of egoism, e.g. Hobbes and Spinoza,
    have generally held that upon a rational examination of the human situation it
    appears one promotes his own interest by co-operating with others.


    One thing that stands in the way of an evolutionary justification of morals is
    the variety of instinctive behaviors we see in animals. Because many of these
    are strikingly egoistic the individual and'
