    Many of the predictions made by AI experts are not logically complete: not every
    premise is unarguable, not every deduction is rigorous. In many cases, the argument
    relies on the expert''s judgment to bridge these gaps. This does not mean that
    the prediction is unreliable: in a field as challenging as AI, honed by years
    of related work, may be the best tool available. Nonexperts cannot easily develop
    a good feel for the field and its subtleties, so should not confidently reject
    expert judgment out of hand. Relying on expert judgment has its pitfalls, however,
    as will be seen in Sections 3.3.4 and 3.4.


    Finally, some predictions rely on the judgment of nonexperts, or of experts making
    claims outside their domain of expertise. Prominent journalists, authors, chief
    executive officers, historians, physicists, and mathematicians will generally
    be no accurate than anyone else when talking about AI, no matter how stellar they
    are in their own field (Kaheman 2011).


    Predictions often use a combination of these methods. For instance, Ray Kurzweil''s
    "Law of Time and Chaos" uses the outside view to grow evolutionary development,
    technological development, and putting into the same category, and constructs
    a causal modeling time to the "singularity" (Kurzweil 1999) (see Section 3.5.4).
    Moore’s law (noncausal model) is a key input to this law, and Ray Kurzweil’s expertise
    is the Law’s main support (see Section 3.5).


    The case studies of Section 3.5 have examples of all of these prediction methods.


    # 3.3 TOOLBOX OF ASSESSMENT METHODS


    The purpose of this chapter is not simply to assess the accuracy and reliability
    of past AI predictions. Rather, the aim is to build a “toolbox” of methods that
    can be used to assess future predictions, both within and outside the field of
    AI. The most important features of the toolbox are ways of extracting falsifiable
    predictions, ways of clarifying and revealing assumptions, ways of making use
    of empirical evidence when possible, and ways of assessing the reliability of
    expert judgment.


