- img_proc: true
  md: '# Singularity, or How I Learned to Stop Worrying and Love Ai ■ 277


    seriously. And such a strong notion of embodiment most certainly cannot be realized
    by simply co-opting a putative computational creative system into a conventional
    tin can robot.


    As Slawomir Nasuto and I set out in our recent discussion of biologically-controlled
    animals¹ and the so-called zombie animals² (two examples carefully chosen to lie
    polar at all orders of the spectrum of possible engineered robotic/cyborg systems,
    because the induced behavioral couplings therein are not the effect of the intrinsic
    “nervous” system’s constraints (metabolic or otherwise) at all, fortiori, merely
    instantiating appropriate sensorim coupling is insufficient to satisfy any meaningful
    intentional states [31].


    On the contrary, in zombie animals and biologically controlled animates, the sensimotor
    couplings are actually the cause of extrinsic demands (made via the experimenter''s
    externally directed manipulations). But because the experimenter delivers sensimotor
    couplings in a completely arbitrary way (from the perspective of the intrinsic
    metabolic needs of an animal or its cellular constituents), the actual relationship
    between the bodily milieu and the motor actions and sensory readings can never
    be genuinely and appropriately coupled. Hence, our conclusion (ibid) that only
    the right type and directionality of sensimotor couplings can ultimately lead
    to genuine understanding and intentionality.


    In light of such concerns, and until the challenges of the CRA, DwP and the mystery
    of mathematical insight have been fully met with the role of embodiment more strongly
    engaged (such that the neurons, brain, and body fully interact with other bodies,
    and society), I suggest a note of caution in labeling any artificial system as
    “strongly intelligent”—a computational mind—in its own right; “cognition” displayed
    therein being mere projection of one engineer’s intent, aesthetic judgment, and
    desire.


    # 12.5 CONCLUSION


    Without fantasizing that it has now (or ever will) reached the level of superhuman
    intelligence that Professors Warwick and Hawking have graphically warped us, the
    all-too-real-world example of armored robots


