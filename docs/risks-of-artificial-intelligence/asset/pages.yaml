    1990). Most of these works by varying parameters in the model and checking that
    this does not cause a breakdown of the prediction. This is more check of robustness
    of the model than of its accuracy, however.


    # 3.3.2.1 Model Testing and Counterfactual Resiliency


    Causal models can be tested by analyzing their assumptions. Noncausal models are
    much harder to test: what are the assumptions before Moore’s famous law (Moore
    1965) or Robin Hanson’s model that humanity is due for another technological revolution,
    based on the timeline of previous revolutions (Hanson 2008?) They both assume
    that a particular pattern will continue into the future, but why should this be
    the case? What grounds (apart from personal taste) does anyone have to endorse
    or reject them?


    The authors of this chapter come up with a putative way of testing the assumptions
    of such models. It involves giving the model a counter check: imagining that world
    history had happened differently and checking whether the model would have been
    true in those circumstances. The purpose is to set up a tension between the model
    says and (or believed) facts about the world. This will refute the model, refute
    the believed facts, or reveal implicit assumptions the model is making.'
