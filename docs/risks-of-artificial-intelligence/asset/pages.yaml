  md: '# Ethics of Brain Emulations ■ 237


    However, there are at least four major ways emulations that might lower the risks
    of Earth-originating intelligence going extinct:


    +   1. The existence of nonbiological humans would ensure at least partial protection
    from some threats: there is no biological pandemic that can wipe out software.
    Of course, it is easy to imagine a digital disaster, for example, an outbreak
    of computer viruses that wipe out the brain emulations. But that threat would
    not affect the biological humans. By splitting the human species into two, the
    joint risks are significantly reduced. Clearly threats to the shared essential
    infrastructure remain, but the new system is more resilient.


    +   2. Brain emulations are ideally suited for colonizing space and many other
    environments where biological humans require extensive life support. Avoiding
    carrying all eggs in one planetary basket is an obvious strategy for strongly
    reducing existential risk. Besides existing in a substrate-independent manner
    where they could run on computers hardware for local conditions, environments
    could be transmitted digitally across interplanetary distances. One of the largest
    obstacles of space colonization is the enormous cost in time, energy, and reaction
    mass needed for space travel: emulation technology would reduce this.


    +   3. Another set of species accrues from the emergence of machine superintelligence.
    It has been argued that successful AI is potentially extremely dangerous because
    it would have radical potential for self-improvement yet possibly deeply flawed
    goals or motivation systems. If intelligence is defined as the ability to achieve
    one''s goals in general environments, superintelligent systems would be significantly
    better than humans at achieving their goals—even at the expense of human goals.
    Intelligence does not strongly prescribe the nature of goals (especially in systems
    that might have been given top-level goals by imperfect programmers). Brain emulations
    get around part of this risk by replacing the de novo machine intelligence with
    a copy of the relatively well-understood human intelligence. Instead of getting
    potentially very rapidly upgrade software with nonhuman motivation systems, we
    get messy emulations that have human motivations. This slows the “hard takeoff”
    into superintelligence and allows existing, well-tested forms'
