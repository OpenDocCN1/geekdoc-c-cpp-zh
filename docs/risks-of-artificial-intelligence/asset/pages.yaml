    # 11.4.2 Sovereign AI


    In a sovereign AI strategy, a private or government-run project creates an autonomous
    AI system, which in turn acts to end the period of risk. Bostrom defines sovereign
    AI as a "system that has an open-ended mandate to operate in the world in pursuit
    of and possibly very long-range objectives." Here, I mean "sovereign" in Bostrom''s
    sense, and not in the sense of a ruler or monarch; though an AI with a decisive
    strategic advantage would have the capability to become a sovereign in this more
    traditional sense, it need not be deigned widespread or invasive control.


    Why would we think that AI itself be a useful tool for mitigating takeoff risk?
    As I suggested earlier (and as Bostrom has been pointed out by many in the AI
    x-risk literature, e.g., Mehauser and Bostrom, 2014; Yudkowsky, 2008), if a fast
    takeoff is possible, then a carefully designed AI might be able to undergo fast
    takeoff, granting it or its projects capabilities that could be used to end the
    risk. These capabilities would plausibly not be accessible in any other way, at
    least on similar timescales. These advantages could be used by a sovereign AI,
    or (see Section 11.4.3) by an AI-empowered project.


    In order to end the risk, a sovereign AI would need to prevent unsafe fast takeoffs
    or prevent them from being extinction risks in some other way. In thinking about
    ways to do this, I found it useful to make an informal distinction between two
    types of sovereign AI proactive and reactive.


    A proactive AI is designed to end the period of risk by intervening significantly
    in one or more of the basic conditions required for a fast takeoff into an existential
    catastrophe. After its takeoff, a proactive AI might (covertly or overtly) prevent
    AI development from proceeding beyond a certain point, might make sure that any
    projects that continue are safe, or merely accrue resources and build institutions
    to prevent any AI that undergoes takeoff from causing significant harm. Useful
    capabilities for these purposes would include strategic planning, persuasion,
    technological development, and economic productivity. A proactive sovereign AI
    could also be tasked with broader fulfilment of humane values,\¹ or it could be
    designed to intervene only on AI development (something like Goertzel''s "Nanny
    AI" proposal²).


    * Superintelligence, p. 148.


    ¹ Yudkowsky, Complex value systems in friendly AI.


    ² Goertzel, Should humanity build a global AI nanny to delay the singularity until
