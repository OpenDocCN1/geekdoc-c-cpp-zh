    to use the AcceptChangesDuringFill property to control when changes are applied
    to a DataSet during data retrieval.


    By the end of this module, you''ll have a solid understanding of data adapters
    in ADO.NET. You''ll be able to use data adapters to interact with databases using
    DataSet and DataTable objects, and perform efficient and reliable data retrieval
