    # Subqueries


    A subquery is a query nested within another query. It allows you to perform a
    query within a query and use the result of the inner query in the outer query.
    Here''s an example of a subquery:


    ```

    ```sql

    SELECT * FROM Employees

    WHERE Department IN (SELECT Department FROM Departments WHERE Location = ''New
    York'');

    ```

    ```


    In this example, the inner query retrieves the Department values where the Location
    is ''New York'', and the outer query retrieves all records from the Employees
    table where the Department is in the result of the inner query.'
