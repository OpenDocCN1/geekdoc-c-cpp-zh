    Data adapters allow you to perform updates, inserts, and deletes on a database
    using a DataSet. We''ll explore how to use the Update method of a data adapter
    to apply changes from a DataSet to a database. We''ll also discuss how to handle
    conflicts that may arise when applying changes, such as concurrency conflicts
    and constraint violations.


    # Batch Processing with Data Adapters


    Data adapters support batch processing, which allows you to perform multiple database
    operations in a single transaction. We''ll discuss how to use the BatchSize property
    of a data adapter to control the size of batches, and how to use the FillBatchSize
