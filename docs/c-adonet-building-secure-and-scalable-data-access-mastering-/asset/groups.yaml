  - "[PAGE 195]\n\nHere's an example of how to use transactions in LINQ to SQL:\n\n\
    ```\nusing System.Transactions;\n\nnamespace MyNamespace\n{\n    public class\
    \ MyService\n    {\n        public void UpdateCustomer(int customerId, string\
    \ newAddress)\n        {\n            using (var scope = new TransactionScope())\n\
    \            {\n                using (var db = MyDataContext.GetMyDataContext())\n\
    \                {\n                    Customer customerToUpdate = db.Customers.Single(c\
    \ => c.CustomerId == customerId);\n                    customerToUpdate.CustomerAddress\
    \ = newAddress;\n\n                    db.SubmitChanges();\n                }\n\
    \n                scope.Complete();\n            }\n        }\n    }\n}\n```\n\
    \nIn this example, the \"UpdateCustomer\" method updates a customer's address\
    \ in the \"Customers\" table. The changes are committed to the database using\
    \ the SubmitChanges method, and the transaction is completed using the Complete\
    \ method."
