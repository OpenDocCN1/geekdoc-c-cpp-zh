    - **索引优化：** 使用适当的索引来提高查询性能。这涉及在查询中经常使用的列上创建索引，以加快数据检索速度。

    - **查询优化：** 优化 SQL 查询以提高性能。这涉及使用适当的联接类型、避免不必要的查询，以及使用适当的 WHERE 子句。


