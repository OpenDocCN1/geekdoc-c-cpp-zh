    \    string sql = \"SELECT * FROM Employees\";\n    using (SqlCommand command\
    \ = new SqlCommand(sql, connection))\n    {\n        // Executing the command\
    \ and retrieving data\n        using (SqlDataReader reader = command.ExecuteReader())\n\
