    ### Basic SQL Syntax


    SQL syntax is divided into several categories, including:


    - **Data Definition Language (DDL):** DDL is used to define and manage the structure
    of database objects, such as tables, indexes, and views. Some common DDL statements
    include CREATE, ALTER, and DROP.

    - **Data Manipulation Language (DML):** DML is used to manipulate data in a database.
    Some common DML statements include SELECT, INSERT, UPDATE, and DELETE.

    - **Data Control Language (DCL):** DCL is used to control access to data in a
    database. Some common DCL statements include GRANT and REVOKE.

    - **Transaction Control Language (TCL):** TCL is used to manage transactions in
    a database. Some common TCL statements include COMMIT, ROLLBACK, and SAVEPOINT.


    ### SELECT Statement


    The SELECT statement is one of the most commonly used SQL statements. It is used
    to retrieve data from a database. The basic syntax of the SELECT statement is:


    ```

    SELECT column1, column2, ...

    FROM table_name

    WHERE condition;

    ```


    In this syntax:


    - column1, column2, ... are the columns you want to retrieve.

    - table_name is the name of the table you want to retrieve data from.

    - condition is an optional condition that filters the rows returned by the query.


    ### INSERT Statement


    The INSERT statement is used to insert new rows into a table. The basic syntax
    of the INSERT statement is:


    ```

    INSERT INTO table_name (column1, column2, ...)

    VALUES (value1, value2, ...);

    ```


    In this syntax:


    - table_name is the name of the table you want to insert data into.

    - column1, column2, ... are the columns you want to insert data into.

    - value1, value2, ... are the values you want to insert into the columns.


    ### UPDATE Statement


    The UPDATE statement is used to update existing rows in a table. The basic syntax
    of the UPDATE statement is:


    ```

    UPDATE table_name

    SET column1 = value1, column2 = value2, ...

    WHERE condition;

    ```


    In this syntax:


    - table_name is the name of the table you want to update data in.

    - column1 = value1, column2 = value2, ... are the columns you want to update and
    the new values you want to set them to.

    - condition is an optional condition that filters the rows to be updated.


    ### DELETE Statement


    The DELETE statement is used to delete existing rows from a table. The basic syntax
    of the DELETE statement is:


    ```

    DELETE FROM table_name

    WHERE condition;

    ```


    In this syntax:


    - table_name is the name of the table you want to delete data from.

    - condition is an optional condition that filters the rows to be deleted.


    In this section, we''ve explored the fundamentals of SQL syntax, which is essential
