    INSERT INTO Employees (EmployeeName) VALUES ('Jane Doe')\", connection, transaction);\n\
    \    command2.ExecuteNonQuery();\n    ```\n\n- **3. Commit or Rollback Transaction**:\
    \ Use the Commit method of the SqlTransaction object to commit the transaction,\
