  mdcn: "\n\nADO.NET Core 相比传统 ADO.NET 提供了多项优势。它具有更好的性能、更高的安全性，并与 .NET 生态系统的最新发展保持一致。ADO.NET\
    \ Core 还被设计为在基于云的环境中更高效，使其成为现代应用程序的绝佳选择。\n\n## 将现有 ADO.NET 应用程序迁移到 Core\n\n将现有\
    \ ADO.NET 应用程序迁移到 .NET Core 是利用 ADO.NET Core 新特性的关键一步。我们将探讨各种策略、工具和最佳实践，帮助你平稳管理迁移过程，并尽量减少对应用程序的干扰。\n\
    \n到本模块结束时，你将扎实地理解 ADO.NET Core、它的优势，以及如何将其集成到你的 .NET Core 应用程序中。你还将获得有效将现有 ADO.NET\
    \ 应用程序迁移到 ADO.NET Core 所需的知识和工具。\n\n## ADO.NET Core 概述\n\n在本节中，我们将概述 ADO.NET Core，它是\
    \ ADO.NET 的后继者，是一种用于 .NET Core 应用程序的数据访问技术。\n\n### 什么是 ADO.NET Core？\n\nADO.NET\
    \ Core 是一种跨平台的数据访问技术，它提供一组类和接口，用于在 .NET Core 应用程序中与数据库交互。它是 ADO.NET 的后继者，旨在更加轻量且高效。\n\
    \n### 主要功能和改进\n\nADO.NET Core 相比 ADO.NET 引入了多项关键特性和改进，包括：\n\n- **性能提升**：ADO.NET\
    \ Core 的设计目标是比 ADO.NET 具有更高的性能和效率，尤其是在高流量场景中。\n- **跨平台支持**：ADO.NET Core 被设计为跨平台，这意味着它可以在\
    \ Windows、macOS 和 Linux 上运行。\n- **轻量级和模块化**：ADO.NET Core 被设计为轻量级和模块化，允许你在应用程序中仅包含所需的组件。\n\
    - **异步编程**：ADO.NET Core 支持异步编程，允许你异步执行数据库操作，这可以提高性能和可伸缩性。\n- **支持新的数据库提供程序**：ADO.NET\
    \ Core 包含对新的数据库提供程序的支持，包括 SQLite，它是一种轻量级的基于文件的数据库。\n- **与 Entity Framework Core\
    \ 集成**：ADO.NET Core 与 Entity Framework Core 集成，后者是一种流行的用于 .NET Core 应用程序的对象关系映射（ORM）框架。\n\
    \n### 将 ADO.NET Core 与 ADO.NET 进行比较\n\nADO.NET Core 和 ADO.NET 有若干相似之处，包括：\n\n\
    - **数据提供程序**：ADO.NET Core 和 ADO.NET 都包含适用于各种数据库系统的数据提供程序，例如 SQL Server、MySQL 和\
    \ Oracle。\n- **连接管理：** ADO.NET Core 和 ADO.NET 都提供用于管理数据库连接的类和接口，例如 SqlConnection\
    \ 和 OleDbConnection。\n- **数据读取器和数据适配器：** ADO.NET Core 和 ADO.NET 都提供用于从数据库读取数据和向数据库写入数据的类，例如\
    \ SqlDataReader 和 SqlDataAdapter。\n- **存储过程和事务：** ADO.NET Core 和 ADO.NET 都支持用于管理数据库操作的存储过程和事务。\n\
    - **DataSet 和 DataTable：** ADO.NET Core 和 ADO.NET 都支持用于处理内存中数据的 DataSet 和 DataTable。\n\
    \n## 将现有 ADO.NET 应用程序迁移到 Core\n\n如果你有现有的 ADO.NET 应用程序，可以通过以下方式将其迁移到 ADO.NET Core：\n\
    \n- **更新引用：** 更新项目中指向 ADO.NET Core 的引用。\n- **更新代码：** 更新代码以使用 ADO.NET Core 类和方法。\n\
    - **测试：** 测试应用程序，确保它在使用 ADO.NET Core 时按预期工作。\n- **部署：** 使用 ADO.NET Core 部署应用程序。\n\
    \n在本节中，我们概述了 ADO.NET Core，即 ADO.NET 的后继者。我们讨论了它的关键特性和改进，并将其与 ADO.NET 进行了比较。我们还探讨了如何将现有\
    \ ADO.NET 应用程序迁移到 ADO.NET Core。在下一节中，我们将深入探讨如何使用数据提供程序，敬请关注！\n\n## 核心组件和体系结构\n\
    \n在本节中，我们将探讨 ADO.NET Core 的基础组件和体系结构，重点介绍其创新设计以及与传统的 ADO.NET 的区别。理解这些核心要素对于使用\
    \ ADO.NET Core 构建安全且可伸缩的数据访问解决方案至关重要。\n\n### ADO.NET Core 组件\n\nADO.NET Core 构建在\
    \ .NET Core 的基础之上，后者是一个用于构建应用程序的跨平台开源框架。它具有模块化体系结构，允许开发人员根据其特定需求选择所需的组件。ADO.NET\
    \ Core 的一些核心组件包括：\n\n- **数据库连接**：ADO.NET Core 提供多种连接选项，包括用于 SQL Server 的 SqlConnection、用于\
    \ MySQL 的 MySqlConnection，以及用于 PostgreSQL 的 NpgsqlConnection。这些连接对象用于与数据库服务器建立连接。\n\
    - **命令执行**：ADO.NET Core 支持不同类型的命令，例如 SqlCommand、MySqlCommand 和 NpgsqlCommand，用于执行\
    \ SQL 查询和存储过程。这些命令用于向数据库服务器发送 SQL 命令并检索数据。\n- **数据检索**：ADO.NET Core 提供多种数据检索方法，例如\
    \ ExecuteReader、ExecuteScalar 和 ExecuteNonQuery，用于从数据库服务器检索数据。这些方法用于以不同格式检索数据，例如数据读取器、单个值，或查询影响的行数。\n\
    - **数据集和数据表：** ADO.NET Core 支持 DataSet 和 DataTable 对象，用于处理内存中的数据。这些对象可用于存储和操作从数据库服务器检索的数据。\n\
