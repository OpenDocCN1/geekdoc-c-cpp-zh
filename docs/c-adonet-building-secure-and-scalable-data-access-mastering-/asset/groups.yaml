    ADO.NET 会自动使用连接池来重用连接，并减少打开和关闭连接的开销。但是，你也可以在连接字符串中配置连接池设置，以优化连接池行为。


    ### 3. 使用异步编程


    异步编程允许你并发执行数据库操作，从而提高应用程序的响应能力和可扩展性。在数据访问代码中使用 async 和 await 关键字来异步执行数据库操作。


