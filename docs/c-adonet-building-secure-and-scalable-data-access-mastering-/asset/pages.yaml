- pgno: 210
  md: '+   - **Simplicity**: Dapper is designed to be simple and easy to use. It provides
    a small set of extension methods that map database records to objects without
    requiring complex configuration or setup.

    +   - **Supports Multiple Database Providers**: Dapper supports multiple database
    providers, including SQL Server, MySQL, SQLite, PostgreSQL, and more. It abstracts
    away the differences between different database providers, allowing you to write
    database-agnostic code.

    +   - **Supports Raw SQL**: Dapper supports raw SQL queries, allowing you to execute
    custom SQL queries directly against the database. This gives you full control
    over the SQL that is executed and allows you to leverage the power of SQL when
    needed.

    +   - **Parameterized Queries**: Dapper supports parameterized queries, which
    help protect against SQL injection attacks and improve performance by allowing
    the database to cache execution plans.

    +   - **Automatic Mapping**: Dapper automatically maps database records to objects
    based on naming conventions. For example, if you have a "User" table in your database
    and a "User" class in your .NET application, Dapper will automatically map the
    columns in the "User" table to the properties of the "User" class.


