    +   - **Data Control Language (DCL):** DCL is used to control access to data in
    a database. Some common DCL statements include GRANT and REVOKE.

    +   - **Transaction Control Language (TCL):** TCL is used to manage transactions
    in a database. Some common TCL statements include COMMIT, ROLLBACK, and SAVEPOINT.


    # SELECT Statement


    The SELECT statement is one of the most commonly used SQL statements. It is used
    to retrieve data from a database. The basic syntax of the SELECT statement is:


    ```

    SELECT column1, column2, ...

    FROM table_name

    WHERE condition;

    ```


    In this syntax:


    +   - column1, column2, ... are the columns you want to retrieve.

    +   - table_name is the name of the table you want to retrieve data from.

    +   - condition is an optional condition that filters the rows returned by the
    query.'
