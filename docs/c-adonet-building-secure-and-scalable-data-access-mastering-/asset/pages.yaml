- pgno: 73
  md: 'There are two main types of database connections in ADO.NET: *Connection-oriented*
    and *Connection-less*.


    +   - **Connection-oriented:** This type of connection is established and maintained
    for the duration of a session. The session begins when the connection is established
    and ends when the connection is closed. This type of connection is used for long-running
    operations, such as executing multiple commands or transactions.

    +   - **Connection-less:** This type of connection is established and closed for
    each command or query. The connection is opened, the command is executed, and
    then the connection is closed. This type of connection is used for short-lived
    operations, such as retrieving a single row of data.


    # Establishing a Connection Using SqlConnection


    To establish a connection to a Microsoft SQL Server database, you can use the
    SqlConnection class, which is included in the System.Data.SqlClient namespace.
    You''ll need to provide a connection string that specifies the server, database
    name, and authentication credentials. Here''s an example:


    ```

    string connectionString = "Data Source=MyServer;Initial Catalog=MyDatabase;Integrated
    Security=True;";

    SqlConnection connection = new SqlConnection(connectionString);

    connection.Open();

    ```


