- pgno: 260
  md: '+   - ADO.NET is a data access technology that allows you to interact with
    databases from your .NET applications.

    +   - It provides a set of classes and libraries for connecting to databases,
    executing queries, and retrieving data.


    # Database Design and Modeling


    +   - Database design is the process of creating a database schema that reflects
    the structure of your data.

    +   - Entity-Relationship Diagrams (ERDs) are a visual representation of the relationships
    between entities in your database.

    +   - Normalization is the process of organizing data to minimize redundancy and
    dependency.


    # SQL Basics for C# Developers


    +   - SQL is a programming language used for managing and manipulating data in
    relational databases.

    +   - CRUD (Create, Read, Update, Delete) operations are the basic operations
    for managing data in a database.

    +   - Advanced SQL techniques, such as joins, subqueries, and stored procedures,
    can improve query performance and efficiency.


    # ADO.NET Core'
  merge: -1
  img_proc: true
- pgno: 261
  md: '+   - ADO.NET Core is a cross-platform version of ADO.NET that runs on .NET
    Core and .NET 5+.

    +   - It provides improved performance and features compared to ADO.NET, and is
    recommended for new development.


    # Working with Data Providers


    +   - Data providers are classes that provide connectivity to specific types of
    databases.

    +   - The built-in .NET data providers are System.Data.SqlClient for SQL Server,
    System.Data.OleDb for OLE DB, and System.Data.Odbc for ODBC.


    # Data Connection Management


    +   - Establishing database connections involves creating a connection string
    and using a Connection object to open the connection.

    +   - Connection pooling allows you to reuse connections and reduce the overhead
    of opening and closing connections.


    # Working with Data Readers


    +   - Data readers are lightweight objects that provide a forward-only, read-only
    view of the data.

    +   - They are ideal for retrieving large amounts of data quickly and efficiently.


    # Working with Data Adapters


    +   - Data adapters are objects that facilitate the transfer of data between a
    database and a DataSet.'
  merge: -1
  img_proc: true
- pgno: 262
  md: '+   - They provide methods for populating a DataSet with data from a database
    and updating a database with changes made to a DataSet.


    # Working with DataSets and DataTables


    +   - DataSets are in-memory representations of data retrieved from a database.

    +   - DataTables are collections of rows and columns that represent a subset of
    the data in a DataSet.


    # Performing Data Validation


    +   - Data validation ensures that data entered by users is accurate, complete,
    and within acceptable ranges.

    +   - It can be performed both on the client side and the server side.


    # Handling Transactions


    +   - Transactions ensure that a set of database changes is performed as a single
    unit of work.

    +   - They provide the ACID (Atomicity, Consistency, Isolation, Durability) properties.


    # Working with Stored Procedures


    +   - Stored procedures are precompiled SQL statements that are stored on the
    database server.

    +   - They can improve performance by reducing network traffic and optimizing
    queries.


    # Handling Large Datasets'
  merge: -1
  img_proc: true
- pgno: 263
  md: '+   - Large datasets can be paged to improve performance and reduce memory
    usage.

    +   - Bulk inserts and updates can be used to efficiently insert or update large
    amounts of data.


    # Working with XML Data


    +   - XML data can be stored in and retrieved from databases using ADO.NET.

    +   - It can be queried using XPath or XQuery, and transformed using XSLT.


    # Data Access Security


    +   - Data access security involves protecting data from unauthorized access,
    modification, or disclosure.

    +   - It can be achieved through encryption, access controls, and audit logging.


    # Handling Concurrency


    +   - Concurrency control ensures that multiple users can access and modify data
    simultaneously without interfering with each other.

    +   - It can be implemented using optimistic or pessimistic concurrency control.


    # Introduction to LINQ to SQL


    +   - LINQ to SQL is a component of .NET that provides a way to query SQL databases
    using LINQ (Language Integrated Query).'
  merge: -1
  img_proc: true
- pgno: 264
  md: '+   - It allows you to write SQL queries as .NET code, providing type safety
    and intellisense.


    # ### Introduction to Entity Framework


    +   - Entity Framework is a data access technology that provides an object-relational
    mapping (ORM) framework for .NET applications.

    +   - It allows you to interact with databases using .NET objects, rather than
    writing SQL queries.


    # ### Introduction to Dapper


    +   - Dapper is a micro-ORM that provides a lightweight, fast, and simple way
    to query SQL databases.

    +   - It allows you to execute raw SQL queries and map the results to .NET objects.


    # ### Working with Object-Relational Mapping (ORM) Tools


    +   - ORM tools provide a way to map database tables to .NET objects, and vice
    versa.

    +   - They can simplify data access code and improve code maintainability.


    # ### Performance Tuning and Optimization


    +   - Performance tuning involves identifying and resolving performance bottlenecks
    in your application.

    +   - It can be achieved through query optimization, index optimization, and database
    design optimization.'
