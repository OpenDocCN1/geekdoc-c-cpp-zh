- pgno: 43
  md: '# Joins


    Joins are used to combine data from two or more tables based on a related column
    between them. There are several types of joins, including:


    +   - **INNER JOIN**: Returns rows when there is a match in both tables.

    +   - **LEFT JOIN**: Returns all rows from the left table and the matched rows
    from the right table.

    +   - **RIGHT JOIN**: Returns all rows from the right table and the matched rows
    from the left table.

    +   - **FULL JOIN**: Returns all rows when there is a match in one of the tables.


    Here''s an example of an INNER JOIN:


    ```

    SELECT Employees.Name, Departments.Name AS Department

    FROM Employees

    INNER JOIN Departments ON Employees.DepartmentID = Departments.ID;

    ```


    In this example, we''re joining the Employees and Departments tables based on
    the DepartmentID column and selecting the Name column from both tables.


    # Views


    A view is a virtual table based on the result of a SELECT statement. It allows
    you to store complex queries as a single object and access the results as if they
    were a table. Here''s an example of creating a view:


    ```

    CREATE VIEW EmployeesWithDepartments AS

    SELECT Employees.Name, Departments.Name AS Department

    FROM Employees

    ```'
  merge: -1
  img_proc: true
