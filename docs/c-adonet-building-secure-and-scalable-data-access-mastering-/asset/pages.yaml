    # **Key Features of Entity Framework**


    +   - **Entity Data Model (EDM)**: The Entity Data Model is a conceptual model
    that maps database tables to classes in your application. It allows you to work
    with database data as objects in your application.


    +   - **LINQ to Entities**: Entity Framework provides a LINQ provider that allows
    you to use LINQ queries to query databases and manipulate data. LINQ to Entities
    translates LINQ queries into SQL queries that can be executed against the database.


    +   - **Automatic Change Tracking**: Entity Framework automatically tracks changes
    to objects in your application and generates the necessary SQL commands to update
    the database.


    +   - **Lazy Loading**: Entity Framework supports lazy loading, which means that
    related objects are loaded from the database only when they are accessed.


    +   - **Database First, Model First, and Code First Approaches**: Entity Framework
    supports three different approaches to model creation: Database First, Model First,
    and Code First. This allows you to choose the approach that best fits your project''s
    needs.


