  md: 'An ERD is a visual representation of the structure of a database. It consists
    of entities (tables), attributes (columns), and relationships between entities.
    ERDs help database designers understand the structure of a database and its relationships,
    making it easier to design and maintain the database.


    # Entities and Attributes


    Entities represent the tables in the database, while attributes represent the
    columns in the tables. For example, in a database for a library, the "Book" entity
    might have attributes such as "Title", "Author", and "ISBN".


    # Relationships


    Relationships between entities represent how the tables in the database are related
    to each other. There are three types of relationships:


    +   - **One-to-One (1:1):** In a one-to-one relationship, each record in one table
    is related to exactly one record in another table. For example, in a database
    for a university, each student might have exactly one student ID.

    +   - **One-to-Many (1:N):** In a one-to-many relationship, each record in one
    table can be related to many records in another table. For example, in a database
    for a library, each book can have multiple authors.

    +   - **Many-to-Many (M:N):** In a many-to-many relationship, each record in one
    table can be related to many records in another table, and vice versa. For example,
    in a database for a university, each student can have multiple courses, and each
    course can have multiple students.'
