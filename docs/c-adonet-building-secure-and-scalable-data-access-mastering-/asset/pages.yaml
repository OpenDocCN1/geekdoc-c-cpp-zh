    # ## Stored Procedures


    A stored procedure is a precompiled collection of SQL statements that can be executed
    by calling the stored procedure name. It allows you to encapsulate complex logic
    and reuse it across multiple applications. Here''s an example of creating a stored
    procedure:


    ```

    ```sql

    CREATE PROCEDURE GetEmployeesByDepartment

    @DepartmentID INT

    AS

    BEGIN

    SELECT * FROM Employees WHERE DepartmentID = @DepartmentID;

    END;

    ```

    ```


    In this example, we''re creating a stored procedure called GetEmployeesByDepartment
    that retrieves all employees in a specific department based on the DepartmentID
    parameter.


