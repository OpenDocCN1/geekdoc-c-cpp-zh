- pgno: 38
  md: '+   - **Data Definition Language (DDL):** DDL is used to define and manage
    the structure of database objects, such as tables, indexes, and views. Some common
    DDL statements include CREATE, ALTER, and DROP.

    +   - **Data Manipulation Language (DML):** DML is used to manipulate data in
