  md: '**Keep Transactions Short:** Keep transactions short-lived to minimize the
    lock duration on database resources. This helps to reduce the risk of deadlocks
    and improves the overall performance of your application.


    **Use Nested Transactions with Caution:** If you need to use nested transactions,
    be aware that they can be complex and difficult to manage. Consider alternatives,
    such as using savepoints or breaking the transaction into smaller transactions.


    **Use Savepoints:** Use savepoints to mark specific points within a transaction
    where you can rollback to if necessary. This can be useful when you need to rollback
    part of a transaction without rolling back the entire transaction.


    **Handle Deadlocks Gracefully:** If a deadlock occurs, handle it gracefully by
    retrying the transaction or taking appropriate action, such as redirecting the
    user to a different page.


    **Use the Right Isolation Level:** Choose the appropriate isolation level for
    your transactions based on your application''s requirements and performance considerations.
    Use the least restrictive isolation level that meets your application''s needs.


