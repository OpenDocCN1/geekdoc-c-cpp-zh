- pgno: 217
  md: '+   - **Bulk Operations**: Use Dapper''s support for bulk operations when you
    need to insert, update, or delete multiple records in a single operation. This
    can improve performance by reducing the number of round trips to the database.

    +   - **Connection Management**: Dapper does not manage database connections for
    you. You need to open and close connections manually. Use the using statement
    or the IDisposable pattern to ensure connections are properly closed and resources
    are released.

    +   - **Use the IDbConnection Interface**: When working with Dapper, use the IDbConnection
    interface instead of specific database connection classes (e.g., SqlConnection).
    This allows your code to be more flexible and support different database providers.

    +   - **Error Handling**: Properly handle exceptions when using Dapper to execute
    queries. Use try-catch blocks to catch and handle any exceptions that may occur
    during database operations.

    +   - **Avoid Overuse of Dynamic Queries**: While Dapper supports dynamic queries,
    it''s generally best to avoid them whenever possible. Dynamic queries can be harder
    to maintain and can lead to performance issues if overused.

    +   - **Optimize Query Performance**: Optimize your queries to improve performance.
    Use indexes, avoid unnecessary joins, and consider denormalizing data when appropriate.

    +   - **Logging and Profiling**: Enable logging and profiling in your Dapper applications
    to monitor query performance and identify potential bottlenecks. Dapper provides
    built-in logging capabilities that can be customized to suit your needs.'
