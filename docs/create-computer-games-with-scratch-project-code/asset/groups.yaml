  mdcn: '

    ## 逻辑运算符


    逻辑运算符使用布尔逻辑。布尔逻辑以一位名叫乔治·布尔的人命名。布尔发明了一套非常简单的逻辑系统，其中每个问题都可以用“真”或“假”来回答。“我痒吗？”的答案要么是“是”（真），要么是“否”（假）。逻辑运算符还可以使用
    AND 和 OR 来回答更复杂的问题。例如，如果你想知道“我是发痒 OR 发热吗？”，运算符会检查哪个条件（发痒或发热）为真。


    ### OR 逻辑


    OR 逻辑测试其中一个条件是否为真。例如：“如果我按右箭头 OR 我按‘D’键，那么把青蛙向右移动。”如果任一问题的答案为真，青蛙就向右移动一个单元格。


    ### AND 逻辑


    AND 逻辑测试两个问题的答案是否都为真。例如：“如果我按右箭头键 AND 青蛙右边有空间，那么把青蛙向右移动。”如果任一问题的答案为“否”，青蛙就不会移动。


    ### 想一想


    这句话使用的是 OR 逻辑还是 AND 逻辑？“如果我按 7 键，并且左上方有移动空间，那么向左上方移动”（答案见第32页。）


    ![](img/2028793d21e48318011e28fb666f71e7_22_0.png)


    ## 坐标与变量


    在游戏中，知道青蛙位于哪个单元格，以及哪些单元格有洞或龙，很重要。为了跟踪这些单元格，我们需要使用若干变量。


    ### 存储容器


    变量是可以改变的值。变量有点像数据的容器。你给变量命名，并把数据存进去。任何时候只要输入变量名，就可以使用这些数据。然后代码会取出该容器中的数据。


    在 Scratch 中打开 `dragons4.sb2`。这个项目的运行方式和上一个一样，但代码却大不相同。我们现在使用了变量。在 ''Row'' 变量积木中，我们输入了值
    9。在 ''Column''（col）变量框中，我们输入了值 12。这些值把青蛙放在网格的中心单元格。''Row''、''Col'' 和 ''Cell''
    都是变量，因为你可以通过修改白色输入框中的值来改变它们。


    ![](img/2028793d21e48318011e28fb666f71e7_23_0.png)


    ```

    when green flag clicked

    set row to 9

    set col to 12

    ```


    ```

    set [Cell v] to [row * 24 + col]

    ```


    这段代码使用变量为每个单元格分配一个编号。它的工作原理如下。共有 24 列。底行（0）上的每个单元格，其编号由行号（0）乘以 24，再加上列号得到。


    我们来算一下网格上绿色十字的单元格编号：0（行号）× 24 = 0；0 + 0（列号）= 0，所以单元格编号是‘0’。对于蓝色十字，计算为：1（行号）× 24
    = 24；24 + 1（列号）= 25；它旁边的单元格会是 24 + 2 = 26，依此类推，一直到右上角单元格，其编号为 431。


    ![](img/2028793d21e48318011e28fb666f71e7_24_0.png)


    看看你能否算出其他一些网格位置的单元格编号。查看下面的表格，看看你是否算对了。


    ![](img/2028793d21e48318011e28fb666f71e7_24_1.png)


    ### 试一试！


    试着让青蛙从网格上的不同位置开始。在 column 变量中输入 0 到 23 之间的数字，在 row 变量中输入 0 到 17 之间的数字。你能预测青蛙会从哪个方格开始吗？数字范围是
    0-17 和 0-23，但网格有 18 行和 24 列。为什么？（答案见第32页。）


    ## 不可预测的青蛙


    在游戏中，每次点击绿旗，青蛙都会从不同的单元格开始。你已经看到如何通过改变列号和行号来自己做到这一点。我们怎样才能让代码替我们完成这件事？我们需要让代码每次都选择一个随机起点。


    在 Scratch 中打开 `dragons5.sb2`。现在，当点击绿旗时，我们把 ''row'' 变量设置为在 0 到 17 之间随机选取任意数字（我们网格中的行号），然后把
    ''col'' 变量设置为在 0 到 23 之间随机选取任意数字（我们网格中的列号）。这样，我们就把青蛙完全随机地放在网格的 432 个单元格中的任意一个里。


    ```

    when green flag clicked

    set row to pick random 0 to 17

    set col to pick random 0 to 23

    ```


    ![](img/2028793d21e48318011e28fb666f71e7_25_0.png)


    ![](img/2028793d21e48318011e28fb666f71e7_26_0.png)


    ### 并非真正的随机数……


    由于计算机只处理真值和假值，它们无法生成真正随机的数字。它们必须改为创建一个看起来随机的数学算式。这个算式需要足够复杂，否则我们可能预测出它会选什么数字。你能猜出我们用了什么算式来生成这些数字吗？你能预测下一个数字吗？


    1, 3, 5, 7, 9


    试着想出一个可能更难预测的算式。


    能够选择随机数在游戏设计中非常重要。事实上，如果没有这种能力，大多数游戏根本无法运行。


    ### 不插电编程


    人真的可以做到随机。和朋友玩这个猜数字游戏。想一个 1 到 10 之间的随机数。让朋友猜这个数字。告诉他们猜的数是小于还是大于你的数字。你的朋友会像计算机的大脑那样工作，使用比较运算符，根据你的回答决定下一个要猜哪个数字。看看他们猜多少次才能猜对。现在试试选一个
    1 到 50 之间的数字！


    ![](img/2028793d21e48318011e28fb666f71e7_26_1.png)


    ![](img/2028793d21e48318011e28fb666f71e7_26_2.png)


    ## 项目页面：添加龙！


    在 Scratch 中打开 `dragons6.sb2`。现在，我们让青蛙随机出现在屏幕上的不同位置。使用类似的方法，我们还让洞随机出现在屏幕各处。我们的游戏板准备好了，是时候让龙登场了！


    ### 使用子程序


    当我们想在代码中的不同位置重复同一件事时，我们会使用**子程序**。要让子程序运行，我们‘调用’它。这只是说，我们在代码中按名称调用它，然后代码会取出并运行它。


    - 1. 你会看到我们现在有一个名为‘CreateDragons’的子程序。我们可以输入想要创建多少条龙。我们会检查每条龙都不在青蛙所在的位置。我们还会确保同一个单元格中没有洞或另一条龙。

    - 2. 检查完这些事项后，我们通过制作龙角色的克隆体来创建一条新龙。克隆体就是副本。


    ![](img/2028793d21e48318011e28fb666f71e7_27_0.png)


    ![](img/2028793d21e48318011e28fb666f71e7_27_1.png)


    Scratch 积木展示了 `CreateDragons` 子程序，包括用于创建龙的克隆体、检查 `Dragons` 列表长度、选择单元格、检查单元格中是否包含洞或龙，以及将单元格添加到
    `Dragons` 列表的积木。


    ### 追捕青蛙


    龙会追捕青蛙。它们通过等待青蛙广播消息“Chase”来做到这一点。广播消息是一个角色与另一个角色交流的一种方式。这个消息告诉龙青蛙的位置。然后龙朝那个位置移动一格。


    ![](img/2028793d21e48318011e28fb666f71e7_28_0.png)


    ### 使用造型


    你可能没有注意到，但龙总是面向青蛙。我们通过使用四个**造型**（角色姿态）来做到这一点，两个面向左，两个面向右。点击龙角色，然后点击‘造型’。你会看到我们使用的四种不同的龙姿态。


    ![](img/2028793d21e48318011e28fb666f71e7_28_1.png)


    ### 想一想


    要让一个游戏运行得非常好，可能需要大量代码！当你在创建自己的游戏时，代码对你会是有意义的。你会随着进展一点一点地添加它。别人的代码，就像你现在看到的那样，可能看起来相当复杂！只需关注我们正在讨论的部分，并思考如何把它们用到你的游戏中。

