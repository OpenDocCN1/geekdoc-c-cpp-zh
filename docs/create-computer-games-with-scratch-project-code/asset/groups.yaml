    # # ALL ABOUT COMPUTER GAMES


    Do you like computer games? Perhaps you like puzzles, action games or adventure
    games. Have you ever wondered how people write computer games? You can create
    games yourself using a program called Scratch.


    # ## Planning your computer game


    Before you write a computer game you need to decide a few things. What kind of
    game do you want to write? What will the aim of the game be? Will your game have
    characters? What will the characters do?


    Once you have a plan, Scratch helps you create games easily using pieces of **code**,
    called coding blocks. The blocks can be arranged to create different kinds of
    programs, such as games.


    ![](img/2028793d21e48318011e28fb666f71e7_7_0.png)


    # ## Starting from Scratch


    To get some inspiration, have a look at some of the games that people have shared
    on the Scratch website. You can click on the ''see inside'' button to look at
    the code.


    https://scratch.mit.edu/starter_projects/#Games'
  - '[PAGE 8]


    # Try it!


    How about making a simple dressing-up game to play with your friends? Open our
    game called dressing.sb2 to see one we have created. Or you can try making one
    yourself:


    +   1. In Scratch, you can choose backgrounds known as backdrops for your game.
    Click on ''New backdrop''. You can choose a backdrop from the library, draw your
    own, or upload one from your computer or camera.


    +   2. Now you need someone to dress. Choose a **sprite** from the library. Sprites
    are characters in Scratch that you can write code for. Go to ''New sprite'', and
    choose ''Dress-Up'' from the menu on the left under ''Theme''. You''ll see a sprite
    called Dani and some clothes that will fit her. Select the clothes you want and
    click ''OK''.


    +   3. To play the game, simply drag and drop the clothes onto Dani!


    | Sprite Library | |

    | --- | --- |

    | Category: Animals, Fantasy, Letters, People, Things, Transportation | Bowtie,
    Dani |

    | Theme: Castle, City, Dance, Dress-Up, Flying, Holiday, Music, Space, Sports,
    Underwater, Walking | Hat Winter, Hat Wizard, Dress, Short Blouse, Sunglasses1,
    Sunglasses2 |

    | Type: All, Animals, People, Wonder | |


    ![](img/2028793d21e48318011e28fb666f71e7_8_0.png)


    ![](img/2028793d21e48318011e28fb666f71e7_8_1.png)


    ![](img/2028793d21e48318011e28fb666f71e7_8_2.png)


    ![](img/2028793d21e48318011e28fb666f71e7_8_3.png)'
