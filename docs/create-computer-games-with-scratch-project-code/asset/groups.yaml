  mdcn: "\n![](img/2028793d21e48318011e28fb666f71e7_30_0.png)\n\n抱歉，你已经死了！如果青蛙移动到一个已经有洞或龙的格子，它就会死亡。游戏会运行一个名为“Die”的子程序，如下所示：\n\
    \n```scratch\ndefine Die\nset GameOn to 0\nbroadcast Delete\nswitch backdrop to\
    \ Die\nhide\n```\n\n![](img/2028793d21e48318011e28fb666f71e7_30_1.png)\n\n这个子程序将“GameOn”设为\
    \ 0，意味着青蛙不再移动；它还会将背景切换为“die”画面，并隐藏青蛙。然后它会广播一条名为“Delete”的消息。\n\n### 收到消息\n\n消息是角色之间相互交流的另一种方式。如果你查看洞和龙的代码，就会发现它们在寻找这条“Delete”消息。收到消息后，克隆体会被删除。\n\
