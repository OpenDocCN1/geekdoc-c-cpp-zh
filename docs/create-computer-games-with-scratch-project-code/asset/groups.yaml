  - '[PAGE 15]


    # # STRATEGY GAMES


    > > A strategy game invites the player to make choices which affect what happens
    next. Chess is a strategy game. Every piece that you move in chess makes a big
    difference to what happens in the game. These games are won through tactics. A
    lot of computer war games are strategy games.


    ![](img/2028793d21e48318011e28fb666f71e7_15_0.png)


    # ## Dragons


    For this book, we have created a strategy game called Dragons. Our hero is a little
    frog that we need to save from an increasing number of nasty dragons. If you like,
    you can play the finished game first, so that you can see what we are going to
    create. Open dragons.sb2 in Scratch and click on the green flag. The game looks
    better if you go to full screen mode.


    # ## How to play the game


    You can move the frog one space in any direction using the arrow keys on your
    keyboard. Be careful not to make the frog fall into a hole, though. After the
    frog has moved, all of the dragons will take one step towards it. Watch out! They
    will eat the frog if they catch it. When you have beaten all the dragons you go
    up to a new level. See how long you can keep the frog alive!'
