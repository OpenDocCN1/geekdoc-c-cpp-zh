    \n## 测试，测试\n\n当你创建一个游戏时，最好让很多人帮你测试。代码可能会变得复杂，你也可能会遇到漏洞。漏洞是指代码没有完全按你的预期运行。如果有什么不对，就调试它。仔细检查你的代码，看看哪里出了问题。注意你的修改不要引发另一个漏洞！即使最优秀的程序员也会在代码中遇到漏洞，所以如果你遇到了也不用担心。边测试边修复就好。\n\
    \n## 试一试！\n\n开始创建你自己的游戏吧。最好先尝试简单的东西。一种方法是查看一些已经写好的代码，并做一些小改动。把《龙》游戏中的角色换掉怎么样？从“新建角色”菜单中选择你的新英雄。要赋予它青蛙的代码，请右键点击你的新角色，然后单击“保存到本地文件”。把它保存到容易找到的地方。\n\
    \n现在点击青蛙角色，然后点击“造型”。点击打开文件夹的符号（左侧），指向新角色并导入它。删除青蛙造型，你就有了一个新英雄！现在点击左上角的蓝色“i”，然后输入你的新英雄的名字。\n\
    \n![](img/2028793d21e48318011e28fb666f71e7_32_1.png)\n\n现在运用你学到的技能，制作属于你自己的精彩游戏吧。玩得开心！\n\
