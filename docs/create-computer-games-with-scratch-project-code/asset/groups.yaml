    \ UK 公司\nwww.hachette.co.uk\nwww.franklinwatts.co.uk\n\n## 使用 Scratch\n\nScratch\
    \ 是麻省理工学院（MIT）设计的一种编程语言，可让你创建自己的互动故事、动画、游戏、音乐和艺术。它不使用复杂的计算机语言，而是使用易于理解的编码积木。为了充分利用本书，你需要会使用电脑，并需要将\
    \ Scratch 加载到你的电脑上。从互联网下载文件到电脑前，请务必征得成年人同意。请访问：**https://scratch.mit.edu**\n\n\
    首先，完成 Scratch 的“Scratch 入门”教程，可通过访问主页上的“创建”，然后查看“提示”菜单找到该教程。你也可以离线使用 Scratch。滚动到主页底部，在“支持”菜单中点击“离线编辑器”。按照说明将其安装到你的电脑上。\n\
    \n![](img/2028793d21e48318011e28fb666f71e7_5_2.png)\n\nScratch 由 MIT Media Lab\
    \ 的 Lifelong Kindergarten Group 开发。参见 http://scratch.mit.edu。本书中包含的 Scratch 图像和插图由\
    \ MIT Media Lab 的 Lifelong Kindergarten Group 开发（参见 http://scratch.mit.edu），并根据\
    \ Creative Commons Attribution-ShareAlike 2.0 许可协议（https://creativecommons.org/licenses/by-sa/2.0/deed.en）提供。本书中使用的第三方商标是其各自所有者的财产，包括\
    \ Scratch 名称和徽标。这些商标的所有者并未认可、授权或赞助本书。\n\n## 关于电脑游戏的一切\n\n你喜欢电脑游戏吗？也许你喜欢解谜游戏、动作游戏或冒险游戏。你有没有想过人们是如何编写电脑游戏的？你可以使用一个叫作\
    \ Scratch 的程序自己创建游戏。\n\n### 规划你的电脑游戏\n\n在编写电脑游戏之前，你需要决定几件事。你想编写哪种游戏？游戏的目标是什么？你的游戏会有角色吗？这些角色会做什么？\n\
    \n一旦有了计划，Scratch 就能借助称为编码积木的**代码**块，帮助你轻松创建游戏。这些积木可以组合起来创建不同类型的程序，例如游戏。\n\n![](img/2028793d21e48318011e28fb666f71e7_7_0.png)\n\
    \n### 从 Scratch 开始\n\n为了获得一些灵感，可以看看人们在 Scratch 网站上分享的一些游戏。你可以点击“查看内部”按钮来查看代码。\n\
    \nhttps://scratch.mit.edu/starter_projects/#Games\n\n### 试一试！\n\n做一个简单的换装游戏和朋友们一起玩怎么样？打开我们名为\
    \ dressing.sb2 的游戏，看看我们创建的一个示例。或者你也可以自己尝试制作一个：\n\n- 1. 在 Scratch 中，你可以为游戏选择称为背景的图片。点击“新背景”。你可以从库中选择背景、自己绘制，或从电脑或相机上传一个背景。\n\
    - 2. 现在你需要一个可以装扮的人。从库中选择一个**角色**。角色是 Scratch 中你可以为其编写代码的人物。转到“新角色”，在左侧“主题”下的菜单中选择“装扮”。你会看到一个叫\
    \ Dani 的角色以及一些适合她的衣服。选择你想要的衣服，然后点击“确定”。\n- 3. 要玩这个游戏，只需将衣服拖放到 Dani 身上！\n\n| 角色库\
    \ | |\n| --- | --- |\n| 类别：动物、幻想、字母、人物、物品、交通 | 领结、Dani |\n| 主题：城堡、城市、舞蹈、装扮、飞行、节日、音乐、太空、运动、水下、行走\
    \ | 冬季帽子、巫师帽、连衣裙、短上衣、太阳镜1、太阳镜2 |\n| 类型：全部、动物、人物、奇妙 | |\n\n![](img/2028793d21e48318011e28fb666f71e7_8_0.png)\n\
    \n![](img/2028793d21e48318011e28fb666f71e7_8_1.png)\n\n![](img/2028793d21e48318011e28fb666f71e7_8_2.png)\n\
    \n![](img/2028793d21e48318011e28fb666f71e7_8_3.png)\n\n- 2. 现在你可以在游戏中使用不同的计分元素。在这个篮球游戏中，每次点击角色时，我们将分数改变\
    \ 1。新游戏开始时，我们将分数重置为 0。\n- 3. 这个游戏使用计时器。如果我们没有在代码中加入计时器，游戏就会一直进行下去！你可以通过更改计时器中的数值来改变游戏持续时间。目前，游戏持续\
    \ 10 秒。\n\n```\nwhen this sprite clicked\nchange [score v] by (1)\n\n<[timer v]\
    \ > (10)>\n```\n\n### 想一想\n\n设计游戏的部分乐趣就在于让别人非常想玩它！你认为有记分牌会让人更想玩吗？为什么？（答案在第 32\
    \ 页。）\n\n![](img/2028793d21e48318011e28fb666f71e7_10_0.png)\n\n![](img/2028793d21e48318011e28fb666f71e7_10_1.png)\n\
    \n## 使用循环\n\n程序员使用循环来告诉计算机重复执行一组指令。\n\n在 Scratch 中，你可以创建循环来：\n\n- 永远重复代码\n- 将代码重复一定次数\n\
    - 重复代码直到发生其他事情。\n\n要在 Scratch 中做到这一点，你可以使用 FOREVER、REPEAT 或 REPEAT UNTIL 积木。\n\
    \n```\nrepeat until <timer > 10>\n    hide\n    wait (1) secs\n    go to x: (pick\
    \ random -200 to 200) y: (pick random -140 to 140)\n    show\n    wait (0.8) secs\n\
    ```\n\n在我们的篮球游戏中，我们使用**重复直到**循环来编写球的出现、等待被点击以及再次消失。\n\n如果没有重复直到循环，我们就必须一遍又一遍地告诉篮球角色隐藏、等待、随机出现在某个位置、隐藏、等待并出现。使用上面的重复循环会告诉计算机重复同样的动作，直到时间用完，因此我们不必多次编写同一段代码。\n\
    \n![](img/2028793d21e48318011e28fb666f71e7_11_0.png)\n\n> 要让游戏持续更长时间，请调整“重复直到”积木中计时器旁边的数值。\n\
    \n![](img/2028793d21e48318011e28fb666f71e7_12_0.png)\n\n### 试一试\n\n看看你能否调整这个游戏中的代码，让游戏变得更容易或更难。试着更改“永远”循环中的第二个“等待”数值。如果数值更大，比如\
    \ 1，球会在屏幕上停留稍久一些。如果你把数值改小，比如 0.5，球在屏幕上停留的时间就会更短，从而使游戏更难。你也可以调整第一个“等待”数值，让球每次出现得更快。\n\
    \n### 添加声音\n\n你可以为游戏添加声音。点击“声音”脚本，你会看到可以播放声音和乐器，并更改它们的音量和速度（节奏）。要选择声音，你需要转到 Scratch\
    \ 声音库。\n\n有各种有趣的声音，非常适合不同的游戏。点击它们听听声音效果，并为你的游戏选择一些声音。\n\n![](img/2028793d21e48318011e28fb666f71e7_12_1.png)\n\
    \n![](img/2028793d21e48318011e28fb666f71e7_12_2.png)\n\n![](img/2028793d21e48318011e28fb666f71e7_12_3.png)\n\
    \n"
