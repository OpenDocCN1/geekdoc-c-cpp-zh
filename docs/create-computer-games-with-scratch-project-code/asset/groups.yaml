  - "[PAGE 17]\n\n# # MAKING DECISIONS\n\nNow we are going to begin to create our\
    \ own Dragons game. Let's start by looking at how our main character, the frog,\
    \ will move around the screen. Open dragons1sb2 in Scratch and click the green\
    \ flag.\n\nYou can see that we have divided the screen into a **grid** of 18 rows\
