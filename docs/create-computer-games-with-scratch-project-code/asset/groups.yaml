    \n![](img/2028793d21e48318011e28fb666f71e7_14_2.png)\n\n### 试一试\n\n如果你想使用不同的球，或者向游戏中添加第二个球，该怎么办？选择一个新的球角色。通过右键单击每个代码块并选择“复制”，来复制原始球的代码。将复制出的代码拖到新角色上。这些积木块可能会彼此重叠，因此你可能需要整理一下。\n\
    \n删除原来的球，只使用新球，或者尝试使用两个球。那样会难得多！我们在太空主题的 Paddleball 中加入了地球。打开 paddleball2.sb2\
    \ 来试试这个版本。\n\n## 策略游戏\n\n> 策略游戏邀请玩家做出会影响接下来发生什么的选择。国际象棋就是一种策略游戏。在国际象棋中，你每移动一个棋子，都会对游戏进程产生很大影响。这类游戏靠战术取胜。许多电脑战争游戏都是策略游戏。\n\
    \n![](img/2028793d21e48318011e28fb666f71e7_15_0.png)\n\n### 龙\n\n为了本书，我们创作了一款名为《龙》的策略游戏。我们的主角是一只小青蛙，我们需要从越来越多凶恶的龙手中拯救它。如果你愿意，可以先玩一玩完成版游戏，这样就能看到我们将要创作的内容。在\
    \ Scratch 中打开 dragons.sb2 并点击绿旗。如果进入全屏模式，游戏看起来会更好。\n\n### 如何玩这个游戏\n\n你可以使用键盘上的方向键，让青蛙向任意方向移动一格。不过要小心，别让青蛙掉进洞里。青蛙移动之后，所有龙都会朝它走一步。当心！如果它们抓住青蛙，就会把青蛙吃掉。当你击败所有龙后，就会升到新的一关。看看你能让青蛙存活多久！\n\
    \n## 做决定\n\n现在我们要开始创作自己的《龙》游戏了。我们先来看看主角青蛙将如何在屏幕上移动。在 Scratch 中打开 dragons1.sb2\
    \ 并点击绿旗。\n\n你可以看到，我们把屏幕划分成了一个由 18 行和 24 列组成的**网格**。每个方格称为一个单元格，高 20 **像素**、宽 20\
    \ 像素。开始时，青蛙位于网格中间的一个单元格中。\n\n![](img/2028793d21e48318011e28fb666f71e7_17_0.png)\n\
    \n![](img/2028793d21e48318011e28fb666f71e7_17_1.png)\n\n### 等待指令……\n\n我们代码的这一部分需要做出三个决定。它在等待绿旗被点击、等待某个键被按下，并判断按下了哪个键。只有当某个方向键被按下时，代码才会被激活。如果按下了，青蛙就会向左、右、上或下移动\
    \ 20 步（或像素），这相当于一个单元格。\n\n```scratch\nwhen [any v] key pressed\nif <key [right\
    \ arrow v] pressed?> then\n    change x by (20)\nif <key [left arrow v] pressed?>\
    \ then\n    change x by (-20)\nif <key [up arrow v] pressed?> then\n```\n\n###\
    \ 我们如何在代码中做决定？\n\n我们可以使用 IF 语句来做决定。IF 语句是编程中最常用的语句之一。它通过询问某件事是否发生，让代码做出决定。例如，如果按下了方向键，那么代码就会让青蛙朝该方向键的方向移动。如果没有按下任何方向键，就什么也不会发生。\n\
    \n#### 想一想\n\n能够做决定让代码看起来更像人类。\n如果你给机器人编程让它向前走，那么即使前方是悬崖边缘，它也会一直向前走。\n而人如果看到前面有落差，就会决定停下来！如果你给机器人编程为“如果没有悬崖边缘就向前走”，它们就会做出和人一样的决定。\n\
    \n![](img/2028793d21e48318011e28fb666f71e7_18_0.png)\n\n#### 不插电编程\n\n你每天都会做出\
    \ IF 决定。如果你的手臂发痒，你就会去挠它。要让计算机做出“挠”的决定，就需要告诉它手臂发痒，并告诉它因此要去挠。试试这个 IF 游戏，把你的决定变成代码。写下六件你必须做的事，例如“吃一块饼干”或“做我的作业”，并把它们编号为\
    \ 1—6。现在掷一个骰子。要运行你的代码，你必须做该数字旁边写的那件事。\n\n![](img/2028793d21e48318011e28fb666f71e7_18_1.png)\n\
    \n## 项目页面：运算符\n\n既然你可以让青蛙在屏幕上移动了，你可能会注意到，有可能把它完全移出屏幕。我们并不希望这样，所以让我们添加一些代码来阻止这种情况发生。在\
    \ Scratch 中打开 dragons2.sb2。\n\n你会看到，我们给每个“按键被按下”的 IF 语句都额外添加了一个 IF 语句。在青蛙移动之前，代码需要检查是否有可供青蛙移动到的单元格。对于这第二个\
    \ IF 语句，我们需要使用一个**运算符**。\n\n```scratch\nif <(x position) < [220]> then\n    change\
    \ x by (20)\n```\n\n> **提示：** 添加绿色运算符积木块可能有点麻烦。将鼠标悬停在空白处，直到它发出白光，然后将其放到合适位置。\n\
    \n### 不同类型的运算符\n\n计算机运算符控制计算机如何使用数据。数据是我们输入计算机或在屏幕上选择的数字或其他信息。当我们在计算机中输入一个数字时，运算符会告诉计算机如何处理它。\n\
    \n运算符有几种不同类型：\n\n- 数学运算符让我们执行简单的数学运算，例如“加 +”、“减 -”、“乘 ×”和“除 ÷”。\n- 比较运算符比较数值，例如“小于”（显示为<）、“大于”（显示为>）或“等于”（显示为=）。\n\
    - 逻辑运算符将在下一章解释：它们包括 AND、OR 和 NOT 等运算符。\n\n![](img/2028793d21e48318011e28fb666f71e7_19_0.png)\n\
    \n### 使用比较运算符\n\n在我们的项目中，我们使用“大于”和“小于”这两个比较运算符。如果玩家要求把青蛙向右移动，运算符会告诉计算机，只有当青蛙的当前位置（“X”）小于\
    \ 220（屏幕边缘）时，才移动青蛙。运算符会确保有空间让青蛙向右移动。如果有空间，青蛙就可以移动。如果没有空间，青蛙就留在原地。试着用方向键把青蛙移出屏幕。你应该再也无法做到这一点了。\n\
    \n![](img/2028793d21e48318011e28fb666f71e7_20_0.png)\n\n> **想一想**\n>\n> 在编程中，询问某事物是否“小于”或“大于”真的很有用。想象一个游戏，玩家必须先获得一定分数才能进入下一关。你可能会使用“大于”运算符——只有当玩家的分数大于所需分数时，玩家才能进入下一关。\n\
    \n![](img/2028793d21e48318011e28fb666f71e7_20_1.png)\n\n### X 和 Y 是什么？\n\n所有图表和网格都有\
    \ x 轴和 y 轴。它们帮助你描述一个点在网格上的位置。水平轴是 x 轴。垂直轴是 y 轴。每次青蛙移动时，我们都会调整青蛙的 X 值和 Y 值，以精确指出它的位置。\n\
    \n### 试一试！\n\n现在你可以让青蛙在屏幕上移动了，你可以制作一个迷宫游戏。点击“新背景”画笔。使用矩形工具创建迷宫。也许你可以添加一个计时器，并在到达出口时发出拍手声。打开\
    \ maze.sb2，试着把青蛙引导到由绿色单元格标记的出口。\n\n## 项目页面：这个还是那个？\n\n你可能已经注意到，在完整的《龙》游戏中，你可以使用许多不同的键来移动青蛙。人们使用的键盘类型不同，有些键盘没有可用于游戏的方向键。在\
    \ dragons2.sb2 中，我们只能使用方向键。\n\n![](img/2028793d21e48318011e28fb666f71e7_21_0.png)\n\
    \n在 Scratch 中打开 dragons3.sb2。现在你可以使用许多不同的键来向上、向下、向左和向右移动。我们可以使用键盘左侧的一组字母键，或者方向键。\n\
    \n为了确保代码允许所有不同的按键，我们需要使用逻辑运算符“OR”。这个运算符让我们列出所有希望用来让青蛙朝特定方向移动的不同按键。\n\n```scratch\n\
    when [any v] key pressed\nif <key [right arrow v] pressed?> or <key [d v] pressed?>\
    \ then\n    if <(x position) < [220]> then\n        change x by (20)\nif <key\
    \ [left arrow v] pressed?> or <key [a v] pressed?> then\n    if <(x position)\
    \ > [-240]> then\n```\n"
