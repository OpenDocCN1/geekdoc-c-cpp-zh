    # Using Scratch


    Scratch is a programming language designed by MIT (Massachusetts Institute of
    Technology) that lets you create your own interactive stories, animations, games,
    music and art. Rather than using a complex computer language, it uses easy-to-understand
    coding blocks. To get the most out of this book, you will need to be able to use
    a computer and you will need to load Scratch onto your computer. Always check
    with an adult if it is OK to download files from the Internet to your computer.
    Go to: **https://scratch.mit.edu**


    First, do Scratch’s ‘Getting Started with Scratch’ tutorial, found by going to
    ‘Create’ on the home page, and then look in the ‘Tips’ menu. You can also work
    on Scratch offline. Scroll to the bottom of the homepage and click on Offline
    Editor in the Support menu. Follow the instructions to install it on your computer.


    ![](img/2028793d21e48318011e28fb666f71e7_5_2.png)


    Scratch is developed by the Lifelong Kindergarten Group at the MIT Media Lab.
    See http://scratch.mit.edu.

    Images and illustrations from Scratch included in this book have been developed
    by the Lifelong Kindergarten Group at the MIT Media Lab (see http://scratch.mit.edu)
    and made available under the Creative Commons Attribution-ShareAlike 2.0 license
