  - '[PAGE 10]


    2. Now you can use the different scoring elements in your game. For this basketball
    game we change the score by 1 each time the sprite is clicked. When a new game
    starts, we set the score back to 0.


    3. This game uses a timer. If we didn''t put the timer in our code, the game would
    play for ever! You can change how long the game goes on for by changing the value
    in the timer. At the moment, the game lasts for 10 seconds.


    ```

    ```

    when this sprite clicked

    change [score v] by (1)


    <[timer v] > (10)>

    ```

    ```


    # ### Think about it


    Part of the fun when you are designing a game is to make other people really want
    to play it! Do you think having a scoreboard helps people want to play? Why? (The
    answers are on page 32.)


    ![](img/2028793d21e48318011e28fb666f71e7_10_0.png)


    ![](img/2028793d21e48318011e28fb666f71e7_10_1.png)'
  - "[PAGE 11]\n\n# USING LOOPS\n\nProgrammers use loops to tell the computer to repeat\
    \ a set of instructions.\n\nIn Scratch, you can create a loop to:\n\n+   - repeat\
    \ the code forever\n+   - repeat the code a number of times\n+   - repeat the\
    \ code until something else happens.\n\nTo do this in Scratch, you use the FOREVER,\
    \ REPEAT or REPEAT UNTIL blocks.\n\n```\nrepeat until <timer > 10>\n    hide\n\
    \    wait (1) secs\n    go to x: (pick random -200 to 200) y: (pick random -140\
    \ to 140)\n    show\n    wait (0.8) secs\n```\n\nIn our basketball game, we use\
    \ a **repeat until** loop to program the ball appearing, waiting to be clicked\
    \ and disappearing again.\n\nWithout the repeat until loop, we would have to tell\
    \ the basketball sprite to hide, wait, appear in a random place, hide, wait and\
    \ appear, over and over again. Using the repeat loop above tells the computer\
    \ to repeat the same action until the time runs out, so we don’t have to write\
    \ the same piece of code more than once.\n\n![](img/2028793d21e48318011e28fb666f71e7_11_0.png)"
  - '[PAGE 12]


    > > To make the game last longer, adjust the value next to the timer in the ''Repeat
    until'' block.


    ![](img/2028793d21e48318011e28fb666f71e7_12_0.png)


    # ## Try it


    See if you can adjust the code in this game to make the game easier or harder.
    Try changing the second ''wait'' value inside the forever loop. If the number
    is larger, say 1, the ball will be on screen for a little longer. If you make
    the number smaller, say 0.5, the ball will be on the screen for a shorter time,
    making the game harder. You can also adjust the first wait value to make the ball
    appear quicker each time.


    # ## Adding sounds


    You can add sounds to your game. Click on the ''Sound'' scripts and you''ll see
    you can play sounds and musical instruments, and change their volume and tempo
    (speed). To select a sound, you need to go to the Scratch Sound Library.


    There are all kinds of fun sounds that would be great for different games. Click
    on them to hear what they sound like, and choose some for your game.


    ![](img/2028793d21e48318011e28fb666f71e7_12_1.png)


    ![](img/2028793d21e48318011e28fb666f71e7_12_2.png)


