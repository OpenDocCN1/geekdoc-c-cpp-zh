- pgno: 7
  md: '# # ALL ABOUT COMPUTER GAMES


    Do you like computer games? Perhaps you like puzzles, action games or adventure
    games. Have you ever wondered how people write computer games? You can create
    games yourself using a program called Scratch.


    # ## Planning your computer game


    Before you write a computer game you need to decide a few things. What kind of
    game do you want to write? What will the aim of the game be? Will your game have
    characters? What will the characters do?


    Once you have a plan, Scratch helps you create games easily using pieces of **code**,
    called coding blocks. The blocks can be arranged to create different kinds of
    programs, such as games.


    ![](img/2028793d21e48318011e28fb666f71e7_7_0.png)


    # ## Starting from Scratch


    To get some inspiration, have a look at some of the games that people have shared
    on the Scratch website. You can click on the ''see inside'' button to look at
    the code.


    https://scratch.mit.edu/starter_projects/#Games'
  merge: -1
  img_proc: true
