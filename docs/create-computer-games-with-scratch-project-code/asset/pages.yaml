- pgno: 11
  md: "# USING LOOPS\n\nProgrammers use loops to tell the computer to repeat a set\
    \ of instructions.\n\nIn Scratch, you can create a loop to:\n\n+   - repeat the\
    \ code forever\n+   - repeat the code a number of times\n+   - repeat the code\
    \ until something else happens.\n\nTo do this in Scratch, you use the FOREVER,\
    \ REPEAT or REPEAT UNTIL blocks.\n\n```\nrepeat until <timer > 10>\n    hide\n\
    \    wait (1) secs\n    go to x: (pick random -200 to 200) y: (pick random -140\
    \ to 140)\n    show\n    wait (0.8) secs\n```\n\nIn our basketball game, we use\
    \ a **repeat until** loop to program the ball appearing, waiting to be clicked\
    \ and disappearing again.\n\nWithout the repeat until loop, we would have to tell\
    \ the basketball sprite to hide, wait, appear in a random place, hide, wait and\
    \ appear, over and over again. Using the repeat loop above tells the computer\
    \ to repeat the same action until the time runs out, so we don’t have to write\
    \ the same piece of code more than once.\n\n![](img/2028793d21e48318011e28fb666f71e7_11_0.png)"
  merge: -1
  img_proc: true
