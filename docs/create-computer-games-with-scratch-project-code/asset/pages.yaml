    # ## Try it


    See if you can adjust the code in this game to make the game easier or harder.
    Try changing the second ''wait'' value inside the forever loop. If the number
    is larger, say 1, the ball will be on screen for a little longer. If you make
    the number smaller, say 0.5, the ball will be on the screen for a shorter time,
    making the game harder. You can also adjust the first wait value to make the ball
    appear quicker each time.


    # ## Adding sounds


    You can add sounds to your game. Click on the ''Sound'' scripts and you''ll see
    you can play sounds and musical instruments, and change their volume and tempo
    (speed). To select a sound, you need to go to the Scratch Sound Library.


    There are all kinds of fun sounds that would be great for different games. Click
    on them to hear what they sound like, and choose some for your game.


