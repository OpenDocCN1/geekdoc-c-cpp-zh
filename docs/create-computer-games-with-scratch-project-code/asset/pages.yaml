- pgno: 17
  md: "# # MAKING DECISIONS\n\nNow we are going to begin to create our own Dragons\
    \ game. Let's start by looking at how our main character, the frog, will move\
    \ around the screen. Open dragons1sb2 in Scratch and click the green flag.\n\n\
    You can see that we have divided the screen into a **grid** of 18 rows and 24\
    \ columns. Each square is called a cell and is 20 **pixels** high and 20 pixels\
    \ wide. At the start, the frog sits in a cell in the middle of the grid.\n\n![](img/2028793d21e48318011e28fb666f71e7_17_0.png)\n\
    \n![](img/2028793d21e48318011e28fb666f71e7_17_1.png)\n\n# ### Waiting for instructions\
    \ ...\n\nThis part of our code needs to make three decisions. It is waiting for\
    \ the green flag to be clicked, waiting for a key to be pressed and deciding which\
    \ key has been pressed. The code is only activated if one of the arrow keys has\
    \ been pressed. If it has, the frog moves to the left, right, up or down 20 spaces\
    \ (or pixels), which is the same as one cell.\n\n```\n~~~scratch\nwhen [any v]\
    \ key pressed\nif <key [right arrow v] pressed?> then\n    change x by (20)\n\
    if <key [left arrow v] pressed?> then\n    change x by (-20)\nif <key [up arrow\
    \ v] pressed?> then\n~~~\n```"
  merge: -1
  img_proc: true
- pgno: 18
  md: '# ## How do we make decisions in code?


    We can use an IF statement to make decisions. The IF statement is one of the most
    used statements in coding. It allows the code to make a decision by asking IF
    something has happened. For example, IF an arrow key is pressed, THEN the code
    moves the frog in the direction of the arrow key. IF no arrow key is pressed,
    nothing will happen.


    # ### Think about it


    Being able to make decisions makes code seem more human.

    If you programmed a robot to walk forwards, it would walk forwards even if there
    was a cliff edge in front of it.

    A person would make the decision to stop if they saw the drop! If you programmed
    the robot to ''walk forwards IF no cliff edge'' they would make the same decision
    as the person.


    ![](img/2028793d21e48318011e28fb666f71e7_18_0.png)


    # ### Coding unplugged


    You make IF decisions every day. If your arm is itchy, you''ll scratch it. For
    a computer to make the decision to scratch, it needs to be told its arm is itchy,
    and told to scratch as a result. Try this IF game and turn your decisions into
    code. Write down six things you must do, such as ''eat a biscuit'' or ''do my
    homework'' and number them 1-6. Now roll a die. To run your code you must do the
    thing you wrote next to that number.


    ![](img/2028793d21e48318011e28fb666f71e7_18_1.png)'
  merge: -1
  img_proc: true
- pgno: 19
  md: "# # PROJECT PAGE: OPERATORS\n\nNow that you can move the frog around the screen,\
    \ you may notice that it is possible to move him off the screen entirely. We don't\
    \ really want this, so let's add some code to stop it from happening. Open dragons2.sb2\
    \ in Scratch.\n\nYou will see that we have added an extra IF statement to each\
    \ 'key pressed' one. Before the frog moves, the code needs to check whether there\
    \ is a cell for the frog to move to. For this second IF statement, we need to\
    \ use an **operator**.\n\n```\n```scratch\nif <(x position) < [220]> then\n  \
    \  change x by (20)\n```\n```\n\n> > **Tip:** Adding a green operator block can\
    \ be fiddly. Hover over the space until it glows white, then drop it in place.\n\
    \n# ## Different types of operator\n\nComputer operators control how the computer\
    \ uses data. Data are numbers or other information that we type into the computer\
    \ or select on-screen. When we type a number into our computer, the operator tells\
    \ the computer what to do with it.\n\nThere are a few different types of operator:\n\
    \n+   - Maths operators let us perform simple maths such as 'add +', 'subtract\
    \ -', 'multiply x' and 'divide ÷'.\n+   - Comparison operators compare values,\
    \ and are operators such as 'less than' (shown as <), 'greater than' (shown as\
    \ >) or 'equal to' (shown as =).\n+   - Logic operators are explained in the next\
    \ chapter: they are operators such as AND, OR and NOT.\n\n![](img/2028793d21e48318011e28fb666f71e7_19_0.png)"
  merge: -1
  img_proc: true
- pgno: 20
  md: '# # Using comparison operators


    In our project we use the comparison operators ''greater than'' and ''less than''.
    If the player asks to move the frog right, the operator tells the computer to
    only move the frog if its current position (''X'') is less than 220 (the edge
    of the screen). The operator makes sure there is space for the frog to move right.
    If there is, the frog can be moved. If there isn''t, the frog stays where it is.
    Try moving the frog off the screen using the arrow keys. You should no longer
    be able to do so.


    ![](img/2028793d21e48318011e28fb666f71e7_20_0.png)


    > > **Think about it**

    > >

    > > Asking if something is ''less than'' or ''greater than'' is really useful
    in coding. Imagine a game in which the player has to get a certain score before
    they can go to the next level. You might use a ''greater than'' operator - the
    player can only move to the next level when their score is greater than the score
    needed.


    ![](img/2028793d21e48318011e28fb666f71e7_20_1.png)


    # # What are X and Y?


    All graphs and grids have an x-axis and a y-axis. They help you describe where
    a point is on a grid. The horizontal axis is the x-axis. The vertical axis is
    the y-axis. Each time the frog moves, we adjust the X and Y values of the frog
    to pinpoint where he is.


    # # Try it!


    Now you can move the frog around the screen, you could make a maze game. Click
    on the ''New backdrop'' paintbrush. Create a maze using the rectangle tool. Perhaps
    you could add a timer, and make a clapping sound when you reach the exit. Open
    maze.sb2 and try to steer the frog to the exit, marked by a green cell.'
  merge: -1
  img_proc: true
- pgno: 21
  md: "# PROJECT PAGE:\n# THIS OR THAT?\n\nYou may have noticed in the full Dragons\
    \ game that you could use many different keys to move the frog. People have different\
    \ types of keyboard and some of them don't have arrow keys that can be used for\
    \ games. In dragons2.sb2 we could only use the arrow keys.\n\n![](img/2028793d21e48318011e28fb666f71e7_21_0.png)\n\
    \nOpen dragons3.sb2 in Scratch. Now you can use many different keys to move up,\
    \ down, left and right. We can use a block of letter keys from the left side of\
    \ the keyboard, or the arrow keys.\n\nTo make sure the code allows all the different\
    \ keys, we need to use the logic operator 'OR'. This operator allows us to list\
    \ all the different keys we would like to be able to use to make the frog move\
    \ in a particular direction.\n\n```\n```scratch\nwhen [any v] key pressed\nif\
    \ <key [right arrow v] pressed?> or <key [d v] pressed?> then\n    if <(x position)\
    \ < [220]> then\n        change x by (20)\nif <key [left arrow v] pressed?> or\
    \ <key [a v] pressed?> then\n    if <(x position) > [-240]> then\n```\n```"
  merge: -1
  img_proc: true
- pgno: 22
  md: '# # Logic operators


    Logic operators use Boolean logic. Boolean logic is named after a man called George
    Boole. Boole invented a really simple system of logic, where every question can
    be answered with either ''true'' or ''false''. The answer to ''Am I itchy?'' is
    either ''yes'' (true) or ''no'' (false). Logic operators can also use Boolean
    logic to answer more complex questions by using AND and OR. For example, if you
    wanted to know ''Am I itchy OR hot?'', the operator would check which of the conditions
    (itchy or hot) is true.


    # # OR logic


    OR logic tests to see if one of the conditions is true. For example: ''If I press
    the right arrow OR I press the ''D'' key THEN move the frog to the right''. If
    the answer to either question is true then the frog is moved one cell to the right.


    # # AND logic


    AND logic tests to see if the answers to both questions are true. For example:
    ''If I press the right arrow key AND there is space to the right of the frog,
    THEN move the frog to the right''. If the answer to either question is ''no'',
    then the frog won''t move.


    # # Think about it


    Does this statement use OR logic or AND logic? ''If I press the 7 key and there
    is space to move up and left, then move up and left'' (The answers are on page
    32.)


    ![](img/2028793d21e48318011e28fb666f71e7_22_0.png)'
  merge: -1
  img_proc: true
- pgno: 23
  md: "# # COORDINATES AND VARIABLES\n\n> > It is important in the game to know which\
    \ cell the frog is in, as well as which cells have holes or dragons. To keep track\
    \ of the cells, we need to use a number of variables.\n\n# ## Storage containers\n\
    \nVariables are values that can be changed. A variable is a little like a container\
    \ for data. You name your variable and store data in it. You can use that data\
    \ any time you want by typing the variable's name. Your code will then fetch the\
    \ data in that container.\n\nOpen dragons4.sb2 in Scratch. This project operates\
    \ just like the last one, but the code is quite different. We have now used variables.\
    \ In our 'Row' variable block we have entered the value 9. In our 'Column' (col)\
    \ variable box we have entered the value 12. These values place the frog in the\
    \ centre cell of the grid. 'Row', 'Col' and 'Cell' are variables, because you\
    \ can change them by altering the values in the white boxes.\n\n![](img/2028793d21e48318011e28fb666f71e7_23_0.png)\n\
    \n```\n    when green flag clicked\n    set row to 9\n    set col to 12\n```"
  merge: -1
  img_proc: true
- pgno: 24
  md: '```

    ```

    set [Cell v] to [row * 24 + col]

    ```

    ```


    This piece of code uses variables to give each cell a number. It works like this.
    There are 24 columns. Each cell on the bottom row (0) is given its number by multiplying
    the row number (0) by 24 and then adding its column number.


    Let''s work out the cell number of the green cross on our grid: 0 (row number)
    x 24 = 0; 0 + 0 (column number) = 0, so the cell number is ''0''. For the blue
    cross, the sum is: 1 (row number) x 24 = 24; 24 + 1 (column number) = 25; the
    cell next to it would be 24 + 2 = 26 and so on, all the way to the top right cell,
    which is number 431.


    ![](img/2028793d21e48318011e28fb666f71e7_24_0.png)


    See if you can work out the cell number for some other grid positions. Check the
    table below to see if you were right.


    ![](img/2028793d21e48318011e28fb666f71e7_24_1.png)


    # ## Try it!


    Try getting the frog to start from different positions on the grid. Type a number
    between 0 and 23 in the column variable and 0-17 in the row variable. Can you
    predict which square your frog will start in? The numbers go from 0-17 and 0-23,
    but there are 18 rows and 24 columns. Why? (The answers are on page 32.)'
  merge: -1
  img_proc: true
- pgno: 25
  md: '# # UNPREDICTABLE FROG


    In the game, the frog starts from a different cell each time you click the green
    flag. You have seen how you can do this yourself by changing the cell and row
    number. How can we get our code to do this for us? We need the code to pick a
    random starting place each time.


    Open dragons5.sb2 in Scratch. Now when the green flag is clicked, we set the ''row''
    variable to pick at random any number between 0 and 17 (the row numbers on our
    grid), then the ''col'' variable to pick any number between 0 and 23 (the column
    numbers on our grid). In this way we place the frog in any one of the 432 cells
    of the grid, completely at random.


    ```

    ```

    when green flag clicked

    set row to pick random 0 to 17

    set col to pick random 0 to 23

    ```

    ```


    ![](img/2028793d21e48318011e28fb666f71e7_25_0.png)'
  merge: -1
  img_proc: true
- pgno: 26
  md: '![](img/2028793d21e48318011e28fb666f71e7_26_0.png)


    # ### Not really random numbers ...


    As computers only deal with true and false values they can''t create a truly random
    number. They have to create a maths sum that appears random, instead. The sum
    needs to be complicated, or we might be able to predict what number it will pick.
    Can you guess what sum we did to create these numbers? Can you predict the next
    number?


    1, 3, 5, 7, 9


    Try to think up a sum that might be harder to predict.


    Being able to choose random numbers is very important in game design. In fact,
    most games couldn''t work at all unless this was possible.


    # ### Coding unplugged


    People really can be random. Play this number guessing game with a friend. Think
    of a random number between 1 and 10. Ask your friend to guess the number. Tell
    them if their guess was less than or greater than your number. Your friend will
    be working like a computer''s brain does, using comparison operators to decide
    which number to choose next depending on your answer. See how many guesses it
    takes for them to get it right. Now try choosing a number between 1 and 50!


    ![](img/2028793d21e48318011e28fb666f71e7_26_1.png)


    ![](img/2028793d21e48318011e28fb666f71e7_26_2.png)'
  merge: -1
  img_proc: true
- pgno: 27
  md: '# PROJECT PAGE:

    # ADDING DRAGONS!


    Open `dragons6.sb2` in Scratch. Now we have a frog appearing at random places
    on the screen. Using a similar method, we have also created the holes to appear
    at random around the screen. Our game board is ready, and it’s time to bring on
    the dragons!


    # ## Using sub-routines


    When we want to repeat the same thing at different points in our code we use a
    **sub-routine**. To get a sub-routine to run, we ‘call’ it. That just means that
    we call it by name in our code, and our code then fetches it and runs it.


    +   1. You will see that we now have a sub-routine called ‘CreateDragons’, we
    can enter how many dragons we want to create. We check that each dragon is not
    where the frog is. We also make sure that there is not a hole or another dragon
    in the same cell.


    +   2. Once we have checked these things, we create a new dragon by making a clone
    of the dragon sprite. A clone is a copy.


    ![](img/2028793d21e48318011e28fb666f71e7_27_0.png)


    ![](img/2028793d21e48318011e28fb666f71e7_27_1.png)


    ```

    Scratch blocks showing the `CreateDragons` sub-routine, including blocks for creating
    clones of dragons, checking the length of the `Dragons` list, selecting cells,
    checking whether a cell contains a hole or dragon, and adding cells to the `Dragons`
    list.

    ```'
  merge: -1
  img_proc: true
- pgno: 28
  md: '# ### Frog hunting


    The dragons chase the frog. They do this by waiting for the frog to broadcast
    the message “Chase”. Broadcasting messages is a way of one sprite talking to another.
    This message tells the dragons the frog’s position. The dragons then move towards
    that position by one square.


    ![](img/2028793d21e48318011e28fb666f71e7_28_0.png)


    # ### Using costumes


    You may not have noticed, but the dragons always face towards the frog. We do
    this by having four **costumes** (character poses), two facing to the left and
    two facing to the right. Click on the dragon sprite and then click on ‘Costumes’.
    You will see the four different dragon poses that we use.


    ![](img/2028793d21e48318011e28fb666f71e7_28_1.png)


    # ### Think about it


    To make a game work really well it may need a lot of code! When you are creating
    your own game, the code will make sense to you. You will be adding it, little
    by little, as you go. Someone else’s code, like you are looking at now, can look
    pretty complicated! Just focus on the bits we are talking about and think about
    how you could use them in your game.'
  merge: -1
  img_proc: true
