- pgno: 32
  md: '![](img/2028793d21e48318011e28fb666f71e7_32_0.png)


    # Testing, testing


    When you create a game it is a good idea to get lots of people to test it for
    you. Code can get complicated, and you can get bugs. Bugs are when your code doesn’t
    do exactly what you expect. If something isn’t right, debug it. Check your code
    carefully to see what went wrong. Be careful that your changes do not cause another
    bug! Even the best programmers get bugs in their code, so don’t worry if you do.
    Just test and fix as you go.


    # Try it!


    Start creating your own game. It is best to try something simple first. One way
    is to look at some already-written code and make little changes. How about changing
    the sprites in the Dragons game? Choose your new hero from the ‘New Sprite’ menu.
    To give it the frog’s code, right click your new sprite and click ‘save to local
    file.’ Save it somewhere easy to find.


    Now click on the frog sprite, and then ‘Costumes’. Click on the open folder symbol
    (left), point to the new sprite and import it. Delete the frog costume and you
    have a new hero! Now click the blue ‘i’ in the top left corner and type the name
    of your new hero.


    ![](img/2028793d21e48318011e28fb666f71e7_32_1.png)


    Now use the skills you have learned to make your own great games. Have fun!'
  merge: -1
