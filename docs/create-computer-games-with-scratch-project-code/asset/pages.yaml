  md: "![](img/2028793d21e48318011e28fb666f71e7_30_0.png)\n\nSorry, you have died!\
    \ If the frog moves to a cell which already contains a hole or a dragon, it dies.\
    \ The game runs a sub-routine called ‘Die’, which looks like this:\n\n```\n  \
    \  define Die\n    set GameOn to 0\n    broadcast Delete\n    switch backdrop\
    \ to Die\n    hide\n```\n\n![](img/2028793d21e48318011e28fb666f71e7_30_1.png)\n\
    \nThis routine sets ‘GameOn’ to 0, meaning that the frog no longer moves; it also\
    \ switches the backdrop to the ‘die’ screen and hides the frog. It then broadcasts\
    \ a message named ‘Delete’.\n\n# ## Message received\n\nMessages are another way\
    \ of one sprite talking to another. If you look in the code for the hole and dragon\
    \ you will see that they look for this ‘Delete’ message. When it is received,\
    \ the clones are deleted.\n\n```\n    when I receive Delete\n    delete this clone\n\
    ```\n\n![](img/2028793d21e48318011e28fb666f71e7_30_2.png)\n\n![](img/2028793d21e48318011e28fb666f71e7_30_3.png)\n\
    \n![](img/2028793d21e48318011e28fb666f71e7_30_4.png)\n\n![](img/2028793d21e48318011e28fb666f71e7_30_5.png)"
