  \ | :--- |\n| `i` | 使匹配不区分大小写。 |\n| `m` | 指定如果字符串包含换行符或回车符，`^` 和 `$` 运算符现在将匹配换行边界，而不是字符串边界。\
  \ |\n| `o` | 仅评估一次表达式。 |\n| `s` | 允许使用 `.` 匹配换行符。 |\n| `x` | 允许在表达式中使用空白以提高清晰度。\
  \ |\n| `g` | 将找到的所有表达式出现处替换为替换文本。 |\n| `e` | 将替换内容像 Perl 语句一样进行评估，并使用其返回值作为替换文本。\
  \ |\n\n### 6. 翻译运算符\n\n（注：此处原文为 Translation Operator，译为翻译运算符）\n\n`m//` 的工作方式与 `q//`\
  \ 运算符系列相同。你可以使用任何自然匹配的字符组合作为表达式的分隔符。例如，`m{}`、`m()` 和 `m><` 都是有效的。上面的示例可以重写为如下：\n\
  \n```perl\n#!/usr/bin/perl\n$bar = \"This is foo and again foo\"; if ($bar =~ m[foo]){\n\
  \    print \"First time is matching\\n\";\n}else{\n    print \"First time is not\
  \ matching\\n\";\n}\n\n$bar = \"foo\";\nif ($bar =~ m{foo}){\n    print \"Second\
  \ time is matching\\n\";\n}else{\n    print \"Second time is not matching\\n\";\n\
  }\n```\n\n如果分隔符是正斜杠，你可以从 `m//` 中省略 `m`，但对于所有其他分隔符，你必须使用 `m` 前缀。\n\n注意，整个匹配表达式（即\
  \ `=~` 或 `!~` 左侧的表达式加上匹配运算符）在表达式匹配时会返回真（在标量语境下）。因此，下述语句：\n\n```perl\n$true = ($foo\
  \ =~ m/foo/);\n```\n\n如果 `$foo` 匹配正则，则将 `$true` 设置为 1；如果匹配失败，则为 0。在列表语境下，匹配返回任何分组表达式的内容。例如，当从时间字符串中提取小时、分钟和秒时，可以使用：\n\
  \n```perl\nmy ($hours, $minutes, $seconds) = ($time =~ m/(\\d+):(\\d+):(\\d+)/);\n\
  ```\n\n## 8. 更复杂的正则表达式\n\n你并不一定要匹配固定字符串。事实上，你可以通过更复杂的表达式匹配任何你想象到的内容。这里有一个快速表列了 Python\
  \ 中使用的正则表达式语法：\n\n| 模式 | 描述 |\n| :--- | :--- |\n| `^` | 匹配行首。 |\n| `$` | 匹配行尾。 |\n\
  | `.` | 匹配除换行符以外的单个字符。使用 `m` 选项允许匹配换行符。 |\n| `[...]` | 匹配括号内的单个字符。 |\n| `[^...]`\
  \ | 匹配不在括号内的单个字符。 |\n| `*` | 匹配表达式 0 次或多次。 |\n| `+` | 匹配表达式一次或多次。 |\n| `?` | 匹配表达式\
  \ 0 次或 1 次。 |\n| `{n}` | 匹配表达式的精确 n 次。 |\n| `{n,}` | 匹配表达式 n 次或多次。 |\n| `{n, m}`\
  \ | 匹配表达式至少 n 次且最多 m 次。 |\n| `a\\|b` | 匹配 a 或 b。 |\n| `\\w` | 匹配单词字符。 |\n| `\\W`\
  \ | 匹配非单词字符。 |\n| `\\s` | 匹配空白字符。等于 `[\\t\\n\\r\\f]`。 |\n| `\\S` | 匹配非空白字符。 |\n\
  | `\\d` | 匹配数字。等于 `[0-9]`。 |\n| `\\D` | 匹配非数字。 |\n| `\\A` | 匹配字符串开头。 |\n| `\\Z`\
  \ | 匹配字符串结尾。如果存在换行符，它匹配换行符之前。 |\n| `\\z` | 匹配字符串结尾。 |\n| `\\G` | 匹配上次匹配结束的位置。 |\n\
  \n\n\n\n\n| `\\b` | 在括号外时匹配单词边界。在括号内时匹配退格符 `(0x08)`。 |\n| `\\B` | 匹配非单词边界。 |\n|\
  \ `\\n`, `\\t`, 等. | 匹配换行符、回车、制表符等。 |\n| `\\1...\\9` | 匹配第 n 个分组子表达式。 |\n| `\\10`\
  \ | 如果已经匹配，则匹配第 n 个分组子表达式。否则，引用字符代码的八进制表示。 |\n| `[aeiou]` | 匹配给定集合中的单个字符 |\n| `[^aeiou]`\
  \ | 匹配给定集合之外的单个字符 |\n\n元字符 `^` 匹配字符串的开头，元符号 `$` 匹配字符串的结尾。以下是一些简短的示例。\n\n### 字符串中没有任何内容（起始和结束相邻）\n\
  ```perl\n^$/\n```\n\n### 三个数字，每个数字后面跟着一个空白 字符（例如 \"3 4 5 \")\n```perl\n/(\\d\\s){3}/\n\
  ```\n\n### 匹配一个字符串，其中每个奇数字母都是 a（例如 \"abacadaf\"）\n```perl\n/(a.)+/\n```\n\n### 字符串以一个或多个数字开头\n\
  ```perl\n/^\\d+/\n```\n\n### 以一个或多个数字结尾的字符串\n```perl\n/\\d+$/\n```\n\n让我们来看另一个例子。`#!/usr/bin/perl`\n\
  \n```perl\n$string = \"Cats go Catatonic\\nWhen given Catnip\"; ($start) = ($string\
  \ =~ /\\A(.*?)  /);\n@lines = $string =~ /^(.*?)  /gm;\nprint \"First word: $start\\\
  n\",\"Line starts: @lines\\n\";\n```\n\n执行上述程序时，它产生以下结果 − First word: Cats\nLine\
  \ starts: Cats When\n\n## 9. 边界匹配\n\n`\\b` 匹配任何单词边界，该边界由 `\\w` 类和 `\\W` 类之间的差异定义。由于\
  \ `\\w` 包含了单词字符，而 `\\W` 包含反之，这通常意味着单词的终止。`\\B` 断言匹配任何不是单词边界的位置。例如 −\n\n```perl\n\
  /\\bcat\\b/ # 匹配 'the cat sat' 但不是 'cat on the mat'\n/\\Bcat\\B/ # 匹配 'verification'\
  \ 但不是 'the cat on the mat'\n/\\bcat\\B/ # 匹配 'catatonic' 但不是  'polecat'\n/\\Bcat\\\
  b/ # 匹配 'polecat' 但不是  'catatonic'\n```\n\n### 选择备选项\n\n`|` 字符就像 Perl 中的标准或 (or)\
  \ 或位或 (bitwise OR)。它指定了正则表达式或组内的交替匹配。例如，要在表达式中匹配 \"cat\" 或 \"dog\"，你可能使用这种 −\n\n\
  ```perl\nif ($string =~ /cat|dog/)\n```\n\n你可以将表达式中的单独元素组合在一起，以支持复杂匹配。搜索两个名字可以通过两个独立的测试来实现，如下\
  \ −\n\n```perl\nif (($string =~ /Martin Brown/) || ($string =~ /Sharon  Brown/))\n\
  ```\n\n这可以写成如下：\n\n```perl\nif ($string =~ /(Martin|Sharon) Brown/)\n```\n\n## 分组匹配\n\
  \n从正则表达式的角度来看，两者之间没有区别，也许前者稍微清晰一点。\n\n```perl\n$string =~ /(\\S+)\\s+(\\S+)/;\n\
  and\n$string =~ /\\S+\\s+\\S+/;\n```\n\n然而，分组的好处在于它允许我们从正则表达式中提取序列。分组以列表形式返回，按照它们在原始表达式出现的顺序。例如，在下面的片段中，我们从字符串中提取了小时、分钟和秒。\n\
  \n```perl\nmy ($hours, $minutes, $seconds) = ($time =~ m/(\\d+):(\\d+):(\\d+)/);\n\
  ```\n\n除了这种直接方法外，匹配的组也可以在特殊的 `$x` 变量可用，其中 `x` 是正则表达式中的组编号。因此，我们可以如下所示重写之前的示例 −\n\
  \n```perl\n#!/usr/bin/perl\n$time = \"12:05:30\";\n$time =~ m/(\\d+):(\\d+):(\\\
  d+)/;\nmy ($hours, $minutes, $seconds) = ($1, $2, $3);\nprint \"Hours : $hours,\
  \ Minutes: $minutes, Second: $seconds\\n\";\n```\n执行上述程序时，它产生以下结果 − Hours : 12,\
  \ Minutes: 05, Second: 30\n\n当组被用于替换表达式时，`$x` 语法可以用于替换文本。因此，我们可以使用这种方法格式化日期字符串 −\n\
  \n```perl\n#!/usr/bin/perl\n$date = '03/26/1999';\n$date =~ s#(\\d+)/(\\d+)/(\\\
  d+)#$3/$1/$2#;\nprint \"$date\\n\";\n```\n执行上述程序时，它产生以下结果 − 1999/03/26\n\n正则表达式是一个定义你正在查看的模式或模式的字符字符串。Perl\
  \ 中正则表达式的语法与你在其他支持正则表达式的程序（如 `sed`、`grep` 和 `awk`）中看到的非常相似。\n\n应用正则表达式的基本方法是使用模式绑定运算符\
  \ `~=` 和 `!~`。第一个运算符是测试赋值运算符。Perl 中有正则表达式运算符：\n\n*   匹配正则表达式 - `m//`\n*   替换正则表达式\
  \ - `s///`\n*   字符转换正则表达式 - `tr///`\n\n斜杠在每情况下都是你所指定的正则表达式 (regex) 的分隔符。如果你习惯任何其他分隔符，可以使用它们来代替斜杠。\n\
