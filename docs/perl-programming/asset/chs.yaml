  \n![](img/image00473.jpeg)\n\n## Unit-IV\n\n### 1. Perl 控制语句\n\nPerl 控制语句– if 语句\
  \ – if-else – if-elsif – if-elsif-else – while loop – until loop – foreach loop\n\
  \n可能会遇到需要多次执行代码块的情况。通常情况下，语句按顺序执行：函数中的第一个语句执行，然后是第二个，依此类推。\n\n编程语言提供了各种控制结构，允许更复杂的执行路径。Perl\
  \ 语言提供了以下类型的循环来处理 0474.jpeg\n\n| 循环类型 | 描述 |\n| [while loop](https://www.tutorialspoint.com/perl/while_loop.htm)\
  \ | 当条件为真时重复语句。在执行循环体之前测试条件。 |\n| [until loop](https://www.tutorialspoint.com/perl/until_loop.htm)\
  \ | 直到条件变为真时重复语句。在执行循环体之前测试条件。 |\n| [for loop](https://www.tutorialspoint.com/perl/for_loop.htm)\
  \ | 多次执行语句序列并简化循环变量的代码。 |\n| [foreach loop](https://www.tutorialspoint.com/perl/foreach_loop.htm)\
  \ | foreach 循环遍历列表值，并将变量设置为列表中的每个元素。 |\n| [do...while loop](https://www.tutorialspoint.com/perl/do_while_loop.htm)\
  \ | 类似于 while 语句，但在循环体末尾测试条件 |\n| [nested loops](https://www.tutorialspoint.com/perl/nested_loops.htm)\
  \ | 你可以在任何其他 while、for 或 do..while 中使用一个或多个循环\n\n### 2. 控制语句\n\n控制语句改变正常的执行序列。当执行离开作用域时，在该作用域内创建的所有自动对象都会被销。\n\
  \nC 支持以下控制语句。点击以下链接查看详细信息。\n\n| 控制语句 | 描述 |\n| [next statement](https://www.tutorialspoint.com/perl/next_statement.htm)\
  \ | 使循环跳过其剩余部分并立即重新测试条件以进行迭代。 |\n| [last statement](https://www.tutorialspoint.com/perl/last_statement.htm)\
  \ | 终止循环语句并将执行转移到循环后的后续语句。 |\n\n\n\n\n\n| [continue 语句](http://www.tutorialspoint.com/perl/perl_continue_statement.htm)\
  \ | 一个 `continue` 块，它在条件准备再次评估之前总是会被执行。 |\n| [redo 语句](http://www.tutorialspoint.com/perl/perl_redo_statement.htm)\
  \ | `redo` 命令会重启循环块，而不再次评估条件。如果存在 `continue` 块，它将不会被执行。 |\n| [goto 语句](http://www.tutorialspoint.com/perl/perl_goto_statement.htm)\
  \ | Perl 支持三种形式的 `goto` 命令：`goto label`、`goto expr` 和 `goto &name`。 |\n\n## 3. 无限循环\n\
  \n如果一个条件永远不变为假，循环就会变成无限循环。`for` 循环传统上用于此目的。由于构成 `for` 循环的三个表达式中没有任何是必须的，你可以通过留空条件表达式来创建一个无限循环。\n\
  \n```perl\n#!/usr/local/bin/perl\nfor( ; ; )\n{\n    printf \"This loop will run\
  \ forever.\\n\";\n}\n```\n\n你可以通过按下 `Ctrl + C` 键来终止上面的无限循环。\n\n当条件表达式不存在时，假设它为真。你可以有一个初始化表达式和增加表达式，但程序员更经常使用\
  \ `for (;;)` 结构来表示无限循环。\n\nPerl 条件语句有助于决策制定，这要求程序员指定一个或多个需要由程序评估或测试的条件，以及当条件被确定为真时执行的语句或多个语句，可选地，当条件被确定为假时执行的其他语句。\n\
  \n以下是大多数编程语言中常见的典型决策结构的一般形式 ——\n\n![](img/image00475.jpeg)\n\n数字 `0`、字符串 `'0'` 和\
  \ `\" \"`、空列表 `()` 以及 `undef` 在布尔上下文中均为假值，而所有其他值均为真值。通过 `!` 或 `not` 对真值进行取反会返回一个特殊的假值。\n\
  \nPerl 编程语言提供了以下类型的条件语句。\n\n| 语句 | 说明 |\n| :--- | :--- |\n| `if` 语句 | `if` 语句由一个布尔表达式后跟一个或多个语句组成。\
  \ |\n| `if...else` 语句 | `if` 语句可以跟随一个可选的 `else` 语句。 |\n| `if...elsif...else` 语句\
  \ | `if` 语句可以跟随一个可选的 `elsif` 语句，然后是一个一个可选的 `else` 语句。 |\n| `unless` 语句 | `unless`\
  \ 语句由一个布尔表达式后跟一个或多个语句组成。 |\n| `unless...else` 语句 | `unless` 语句可以跟随一个可选的 `else` 语句。\
  \ |\n\n## 4. Perl 变量的作用域\n\nPerl 中有两种主要的变量类型。其中一种是使用已过时的 `use vars` 结构或 `our` 声明的包全局变量。\n\
  \n另一个是使用 `my` 声明的词法变量。\n\n让我们看看当使用 `my` 声明变量会发生什么？该变量在代码的哪些部分可见？换句话说，变量的作用范围是什么？\n\
  \n### 变量作用域：闭包块\n\n```perl\n#!/usr/bin/perl\nuse strict;\nuse warnings;\n{\n   \
  \ my $email = 'foo@bar.com';\n    print \"$email\\n\"; # [foo@bar.com]\n}\n# print\
  \ $email;\n# $email 不存在\n# Global symbol \"$email\" requires explicit package name\
  \ at ...\n```\n\n在匿名块（一对大括号 `{}`）内部，我们首先看到名为 `$email` 的新变量的声明。该变量从其声明点一直到块的结束都存在。因此，右大括号\
  \ `}` 之后的行必须被注释掉。如果你删除了 `# print $email;` 语句中的 `#` 并尝试运行脚本，你将得到以下编译时错误：Global symbol\
  \ \"$email\" requires explicit package name at ....\n\n换句话说，每个用 `my` 声明的变量的作用域都是其所属的闭包块。\n\
  \n### 变量作用域：随处可见\n\n变量 `$lname` 在代码开头声明。它在文件结束前的处处都是的。即使在块内部也是如此。即使这些是函数声明。如果我们在块内部更改变量，这将更改代码其余部分的值。即使当你离开块也是如此：\n\
  \n```perl\n#!/usr/bin/perl\nuse strict;\nuse warnings;\nmy $lname = \"Bar\";\nprint\
  \ \"$lname\\n\"; # Bar\n{\n    print \"$lname\\n\"; # Bar\n    $lname = \"Other\"\
  ;\n    print \"$lname\\n\"; # Other\n}\nprint \"$lname\\n\"; # Other\n```\n\n###\
  \ 变量被其他声明隐藏\n\n```perl\n#!/usr/bin/perl\nuse strict;\nuse warnings;\nmy $fname =\
  \ \"Foo\";\nprint \"$fname\\n\"; # Foo\n{\n    print \"$fname\\n\"; # Foo\n    my\
  \ $fname = \"Other\";\n    print \"$fname\\n\"; # Other\n}\nprint \"$fname\\n\"\
  ; # Foo\n```\n\n在这种情况下，变量 `$fname` 在代码开头声明。如前所述，它在文件结束前的处处都是的，但在那些被同名局部声明变量隐藏的地方除外。在块内部，我们使用\
  \ `my` 声明了另一个同名变量。这有效地隐藏了块外部声明的 `$fname` 直到我们离开块。在块结束 `}` 处，内部声明的 `$fname` 将被销毁，原始\
  \ `$fname` 将再次可访问。多个块中的同名：你可以自由地在多个块中使用相同的变量名。这些变量之间没有联系。\n\n```perl\n#!/usr/bin/perl\n\
  use strict;\nuse warnings;\n{\n    my $name = \"Foo\";\n    print \"$name\\n\";\
  \ # Foo\n}\n{\n    my $name = \"Other\";\n    print \"$name\\n\"; # Other\n}\n```\n\
  \n### 文件内包声明\n\n这是一个稍微高级的示例，但在这里提到它可能是重要的：\n\nPerl 允许我们使用文件内的 `package` 关键字在命名空间切换。包声明并不提供作用域。如果你在隐式主包（即你的脚本的主体）中声明一个变量，那么该\
  \ `$fname` 变量即使在同一个文件的其他命名空间中也是可见的。如果你在 `Other` 命名空间中声明一个名为 `$lname` 的变量，当你稍后切换回主命名空间时，它将是可见的。如果\
  \ `Other` 包的声明在另一个文件中，那么变量将拥有文件创建的独立作用域。\n\n```perl\n#!/usr/bin/perl\nuse strict;\n\
  use warnings;\nmy $fname = \"Foo\";\nprint \"$fname\\n\"; # Foo\npackage Other;\n\
  use strict;\nuse warnings;\nprint \"$fname\\n\"; # Foo\nmy $lname = 'Bar';\nprint\
  \ \"$lname\\n\"; # Bar\n\npackage main;\nprint \"$fname\\n\"; # Foo\nprint \"$lname\\\
  n\"; # Bar\n```\n\n## 5. BioPerl 及其应用\n\nBioPerl 是一系列 Perl 模块，旨在有助于开发用于生物信息学应用的\
  \ Perl 脚本。它在人类基因组计划中发挥了不可缺的作用。BioPerl 是一个由 Open Bioinformatics Foundation 支持的活跃开源项目。\n\
  \n\n\n\n\n#\n\nBioperl 的第一组 Perl 代码由 Tim Hubbard 和 Jong Bhak 在剑桥 MRC 中心（MRC Centre\
  \ Cambridge）创建，那里由 Fred Sanger 完成了首次基因组测序。MRC 中心是现代生物信息学的枢纽和诞生地之一，因为它拥有海量的 DNA 序列和\
  \ 3D 蛋白质结构。Bioperl 这个名字是由 Jong Bhak 和 Steve Brenner 在 MRC 中心蛋白质工程中心（CPE）的一间小房间里共同命名的，当时\
  \ Alan Fersht 担任该中心的主管。在那个*小而而闹*的房间里，Cyrus Chothia 和 Tim Hubbard 正在与他们的一些博士生和同事一起工作。Tim\
  \ Hubbard 是一位出色的 Perl 程序员，他当时一直使用 `th_lib.pl`，该文件包含了许多用于生物信息学的有用 Perl 子程序。Jong Bhak\
  \ 作为 Tim Hubbard 的第一个博士生，创建了 `jong_lib.pl`。Jong 将这两个 Perl 子程序库合并成了 `Bio.pl`。1995\
  \ 年的一天，Cyrus Chothia 的博士生 Steve Brenner 访问了该房间，并开始讨论他们如何命名这个 Perl 库。此前，他们就 Perl\
  \ 是否在生物信息学方面优于 C 语言进行了长时间（几个月）的辩，因为 Steve Brenner 自己有一套用于生物信息学的 C 库。这两个博士生在经历了 `protein\
  \ perl`、`protperl`、`PerlBio` 等名称后，将这个用于生物学的 Perl 库命名为 Bioperl。Steve Brenner 在 1995\
  \ 年的 ISMB 剑桥组织了一场 Bioperl 会议，尽管会议并未真正举行。在接后的几个月里，Bioperl 有了一些用户，其中包括 Georg Fuellen，他在德国组织了一个培训课程。Georg\
  \ 的同事和学生极大扩展了 Bioperl，随后其他人员也加入了进来，例如 Steve Chervitz，他活跃于为酵母基因数据库开发 Perl 代码。当另一位剑桥学生\
  \ Ewan Birney 在另一场关于 Perl 是否在生物信息学方面优于 C 语言的长时间辩论后加入后，项目迎来了主要的扩张，Ewan 和许多其他人在开发\
  \ Bioperl 方面非常活跃。\n\n第一个稳定版本于 2002 年 6 月 11 日发布；最新的稳定版本（就 API 而言）是 2011 年 4 月 14\
  \ 日的 `1.6.9`。此外还会定期发布开发者版本。`1.6.0` 系列被认为是 BioPerl 最稳定（就 Bug 而言）的版本，推荐日常使用，但每夜构建（nightly\
  \ builds）也非常稳定，许多 BioPerl 用户一直保持这些版本的更新。\n\n为了利用 BioPerl，用户需要对 Perl 编程语言有基础了解，包括如何使用\
  \ Perl 引用、模块、对象和方法。\n\n## 特性与应用\n\nBioPerl 为生物信息学编程许多许多任务提供了软件模块。这些包括：\n\n*   从本地和远程数据库访问核苷酸和肽序列数据\n\
  *   转换数据库/文件记录的格式\n*   处理单个序列\n*   搜索相似序列\n*   创建和处理序列比对\n*   在基因组 DNA 上搜索基因和其他结构\n\
  *   开发机器可读的序列注释\n\n除了终端用户直接使用外，BioPerl 还为各种生物信息学工具提供了基础，包括：\n\n*   SynBrowse\n*\
  \   Gene Comber, TFBS, MIMOX, BioParser, 简引物设计, 查询公共数据库, 当前比较表\n*   来自外部开发人员的新工具和算法通常直接集成到\
  \ BioPerl 本身中\n*   处理进化树和嵌套分类 FPC Web 工具，其他编程语言中的相关库。\n\n在其他编程语言中实现的几个相关生物信息学库构成了\
  \ [开放生物信息学基金会](https://en.wikipedia.org/wiki/Open_Bioinformatics_Foundation)的一部分，包括\
  \ Biopython, BioJava, BioRuby, BioPHP, BioJS, Bioconductor 等。\n\n# 第五单元\n\n## 1\
  \ PERL 模块简介\n\n## Getopt::Long - 命令行选项的扩展处理\n\n#### 语法概要 (SYNOPSIS)\n\n```perl\n\
  1. use Getopt::Long;\n2. my $data = \"file\";\n3. my $length = 24;\n4. my $verbose;\n\
  5. GetOptions (\"length=i\" => \\$length,\n6. \"file=s\" => \\$data,\n7. \"verbose\"\
  \ => \\$verbose)\n8. die(\"Error in command line\");\n```\n\n#### 描述 (DESCRIPTION)\n\
  \n`Getopt::Long` 模块实现了名为 `GetOptions()` 的函数。它解析命令行中的选项及其值。\n\n该函数遵循 POSIX 语法，提供了命令行选项的扩展。通常，选项使用长名称，通过双横杠\
  \ `--` 引入。\n\n#### 命令行选项简介 (Command Line Options, an Introduction)\n\n程序传统上从命令行获取选项，例如文件名或其他信息。除了参数外，程序通常也会接收选项。选项对于程序运行并非必需，但用于修改其默认行为。\n\
  \n命令行选项有几种形式。历史上，它们以单连字符 `-` 开头，由单个字母组成。\n\n1. `-lc`\n\n通常，这些单字符选项可以组合：\n\n1. `-ac`\n\
  \n选项可以带有值，值放在选项之后。有时中间有空格，有时没有：\n\n1. `-s 24` `-s24`\n\n由于这些选项非常晦涩，开发了另一种使用长名称的样式。因此，与其晦涩的\
  \ `-l`，可以使用具描述性的 `--long`。为了区分单字符选项和长选项，使用了两个横杠作为选项名前。早期的长选项实现使用加号 `+`。此外，选项值可以这样指定：\n\
  \n1. `--size=24` 或 1 `--size 24`\n\n`+` 形式现在已过时并强烈弃用。\n\n#### 开始使用 Getopt::Long\
  \ (Getting Started with Getopt::Long)\n\n`Getopt::Long` 是 `newgetopt.pl` 的 Perl\
  \ 后继。这是第一个支持处理新样式命令行选项（特别是长选项名称）的 Perl 模块，因此名为 `Getopt::Long`。该模块还支持单字符选项组合。\n\n\
  要在 Perl 程序中使用 `Getopt::Long`，必须在程序中包含以下行：\n\n```perl\nuse Getopt::Long;\n```\n\n\
  这将加载 `Getopt::Long` 模块的核心部分并为你的程序做好准备。大部分的 `Getopt::Long` 代码在你真正调用其函数时才会加载。\n\n\
  在默认配置下，选项名称可以为了唯一性进行缩写，不区分大小写，单连字符也是足够的。此外，选项可以放在非选项参数之间。\n\n##### 简单选项 (Simple\
  \ options)\n\n最简单的选项是不带值的选项。它们在命令行中的出现即可启用该选项。常见的例子有：\n\n`--all --verbose --quiet\
  \ --debug` 处理简单选项非常直观：\n\n```perl\nmy $verbose = '';\nmy $all = '';\nGetOptions\
  \ ('verbose' => \\$verbose, 'all' => \\$all);\n```\n\n调用 `GetOptions()` 会解析位于 `@ARGV`\
  \ 中的命令行参数，如果选项出现在命令行中，则将选项变量赋值为 1。否则，选项变量将不会被触。将选项值设为真通常被称为启用该选项。\n\n\n\n\n\n传递给\
  \ `GetOptions()` 函数指定的选项名称被称为选项规范（option specification）。稍后我们将看到，这种规范包含的不仅仅是选项名称。对变量的引用被称为选项目标（option\
  \ destination）。\n\n如果命令行可以成功处理，`GetOptions()` 将返回真值。否则，它将使用 `die()` 和 `warn()` 写入错误信息，并返回假结果。\n\
  \n## 稍微复杂一点的选项\n\n`Getopt::Long` 支持简单选项的两种有用变体：可否定选项（negatable options）和增量选项（incremental\
  \ options）。\n\n可否定选项通过在选项名后加感叹号 `!` 来指定：\n\n1. `my $verbose  =  '';#带有默认值的选项变量 (false)`\n\
  2. `GetOptions ('verbose!' => \\$verbose);`\n\n现在，在命令行上使用 `--verbose` 将如预期地启用 `$verbose`。但也允许使用\
  \ `--noverbose`，它将通过将 `$verbose` 的值设置为 `0` 来禁用它。通过使用合适的默认值，程序可以判断出 `$verbose` 是默认为\
  \ `false`，还是通过使用 `--noverbose` 被禁用的。\n\n增量选项通过在选项名后加加号 `+` 来指定：\n\n1. `my $verbose\
  \  =  '';#带有默认值的选项变量 (false)`\n2. `GetOptions ('verbose+' => \\$verbose);`\n\n命令行上使用\
  \ `--verbose` 将增加 `$verbose` 的值。通过这样，程序可以跟踪该选项在命令行上出现的次数。例如，每次出现 `--verbose` 都可以增加程序的详细程度。\n\
  \n## 混合命令行选项与其他参数\n\n通常情况下，程序会接收命令行选项以及其他参数，例如文件名。良好的做法始终先指定选项，最后指定其他参数。\n\n然而，`Getopt::Long`\
  \ 允许选项和参数混合，并在将剩余参数传递给程序之前“过滤掉”所有选项。要停止 `Getopt::Long` 继续处理参数，请在命令行上插入双横线 `--`：\n\
  \n1. `--size  24-------------all`\n\n在这个示例中，`--all` 将不会被视为选项，而是原样传递给程序中的 `@ARGV`。\n\
  \n## 带有值的选项\n\n对于带有值的选项，必须指定选项值是否是必需，以及选项期望什么种类型的值。\n\n支持三种类型的值：整数、浮点数和字符串。\n\n\
  如果选项值是必需的，`Getopt::Long` 将获取选项后的命令行参数并将其分配给选项变量。然而，如果选项值被指定为可选，则只有当该值本身看起来不像有效的命令行选项时才会执行赋值。\n\
  \n1. `my $tag  =  '';#带有默认值的选项变量`\n2. `GetOptions ('tag=s' => \\$tag);`\n\n在选项规范中，选项名后跟着等号\
  \ `=` 和字母 `s`。等号表示该选项需要一个值。字母 `s` 表示该值是一个任意字符串。其他可能的值类型是用于整数整数的 `i` 和用于浮点数值的 `f`。使用冒号\
  \ `:` 代替等号表示选项值是可选的。在这种情况下，如果没有提供合适的值，字符串值选项将获得一个空字符串 `''`，而数值型选项将被设置为 `0`。\n\n\
  ## 带有多个值的选项\n\n选项有时会接受多个值。例如，程序可以使用多个目录来搜索库文件：\n\n`--library lib/stdlib --library\
  \ lib/extlib`\n\n要实现这种行为，只需将数组引用指定为选项的目标：\n\n```\nGetOptions (\"library=s\" => \\\
  @libfiles);\n```\n\n或者，你可以通过添加 `\"@\"` 指定该选项可以有多个值，并将标量引用作为目标：\n\n```\nGetOptions\
  \ (\"library=s@\" => \\$libfiles);\n```\n\n配合上面的示例使用，`@libfiles`（或 `@$libfiles`）在完成后将包含两个字符串：顺序依次为\
  \ `\"lib/stdlib\"` 和 `\"lib/extlib\"`。也可以指定只允许整数或浮点数作为可接受的值。\n\n通常，允许逗号分隔的值列表以及选项的多次出现是非常有用的。使用\
  \ Perl 的 `split()` 和 `join()` 操作符可以很容易实现：\n\n```perl\nGetOptions (\"library=s\"\
  \ => \\@libfiles); @libfiles = split(/,/,join(',',@libfiles));\n```\n\n当然，为每个用途选择正确的分隔符字符串非常重要。警告：以下内容为实验性功能。\n\
  \n选项可以一次接受多个值，例如：\n\n`--coordinates 52.2 16.4 --rgbcolor 255 255 149`\n\n这可以通过在选项规范中添加重复计数符（repeat\
  \ specifier）来实现。重复计数符与正则表达式模式中可以使用的 `{...}` 重复计数符非常相似。例如，上述命令行将按如下处理：\n\n```\nGetOptions('coordinates=f{2}'\
  \ => \\@coor, 'rgbcolor=i{3}' => \\@color);\n```\n\n选项的目标必须是一个数组或数组引用。\n\n还可以指定选项接受的参数最小和最大数量。`foo=s{2,4}`\
  \ 表示一个至少接受两个且最多 4 个参数的选项。`foo=s{1,}` 表示一个或多个值；`foo:s{,}}` 表示零或多个选项值。\n\n## 带有哈希值的选项\n\
  \n如果选项目标是哈希引用，选项将以 `key= value` 的形式接受值。值将存储在指定的哈希键中。\n\n```\nGetOptions (\"define=s\"\
  \ => \\%defines);\n```\n或者，你可以使用：\n\n```\nGetOptions (\"define=s%\" => \\$defines);\n\
  ```\n配合命令行选项使用：\n\n`--define os=linux --define vendor=redhat`\n\n哈希 `%defines` 将包含两个键，键为\
  \ `\"os\"` 值为 `\"linux\"`，以及 `\"vendor\"` 值为 `\"redhat\"`。也可以指定只有整数或浮点数是可接受的值。键始终被视为字符串。\n\
  \n## 处理选项的自定义子函数\n\n对（实际上：每次）遇到选项时应该执行的操作，可以通过指定子函数的引用（或匿名函数）作为选项目标来实现。当 `GetOptions()`\
  \ 遇到选项时，它将带有两个或三个参数调用子函数。第一个参数是选项名称（实际上是一个字符串化为选项名称的对象）。对于标量或数组目标，第二个参数是需要存储的值。对于哈希目标，第二个参数是哈希的键，第三个参数是需要存储的值。存储值由子函数自行决定。\n\
  \n这种机制的一个简单应用是实现相互相关的选项。例如：\n\n1. `my $verbose  =  ';#带有默认值的选项变量 (false)`\n2. `GetOptions\
  \ ('verbose' => \\$verbose,`\n3. `'quiet' => sub { $verbose = 0 });`\n\n这里 `--verbose`\
  \ 和 `--quiet` 控制同一个变量 `$verbose`，但值相反。\n\n如果子函数需要发出错误，它应该调用 `die()` 并并将所需的错误消息作为参数。`GetOptions()`\
  \ 将捕获 `die()`，发布错误消息，并记录完成后必须返回错误结果。\n\n如果错误信息的文本以感叹号 `!` 开头，它会被 `GetOptions()`\
  \ 特殊解释。目前实现了一个特殊命令：`die(\"!FINISH\")` 会导致 `GetOptions()` 停止处理选项，就像遇到了双横线 `--`。\n\
  \n2.37 版本中，回调函数的第一个参数从字符串更改为对象。这样做是为了扩展和更详细的控制留出空间。该对象字符串化为选项名称，因此这种更改不应引入兼容性问题。\n\
  \n这是一个在子函数内部访问选项名称和值的示例：\n\n```perl\n1. GetOptions ('opt=i' => \\&handler);\n2.\
  \ sub handler {\n3. my ($opt_name, $opt_value) = @_;\n}\n```\n\n\n\n\n\n```perl\n\
  4. print(\"Option name is $opt_name and value is  $opt_value\\n\"); 5.}\n```\n\n\
  ## 具有多个名称的选项\n\n通常情况下，为选项提供备用的助记名称是用户友好的。例如，`-- height` 可以作为 `--length` 的替代名称。替代名称包含在选项规格中，并用竖线\
  \ `|` 字符分隔。要实现上述示例：\n\n```perl\nGetOptions ('length|height=f' => \\$length);\n```\n\
  \n第一个名称称为主名称（primary name），其他名称称为别名（aliases）。在使用哈希（hash）存储选项时，键将始终为主名称。\n\n### 多个替代名称。大小写与缩写\n\
  \n在没有额外配置的情况下，`GetOptions()` 会忽略选项名称的大小写，并允许将选项缩写为唯一的字符串。\n\n```perl\nGetOptions\
  \ ('length|height=f' => \\$length, \"head\" => \\$head);\n```\n\n此调用将允许使用 `--l`\
  \ 和 `--L` 作为长度选项，但要求 head 和 height 选项至少输入 `--hea` 和 `--hei`。\n\n## 选项规格总结\n\n每个选项规格符由两部分组成：名称规格（name\
  \ specification）和参数规格（argument specification）。\n\n名称规格包含选项的名称，可选地跟随一个由竖线字符分隔的替代名称列表。\n\
  \n1. `lengthoption` 名称为 `\"length\"`\n2. `length|size|lname` 名称为 `\"length\"`，别名为\
  \ `\"size\"` 和 `\"l\"`\n\n参数规格是可选的。如果省略，则该选项被视为布尔值（boolean），当在命令行使用该选项时，将赋值一个值 `1`。\n\
  \n参数-参数规格可以是：\n\n### `!`\n\n该选项不接受参数，并且可以通过在其前面加上 `no` 或 `no-` 来进行取反（negated）。\n\
  \n例如，`\"foo!\"` 将允许 `--foo`（赋值为 `1`）以及 `--nofoo` 和 `--no-foo`（赋值为 `0`）。如果该选项有别名，此规则也适用于别名。\n\
  \n在启用捆绑（bundling）时对单字母选项使用取反是没有意义的，并且会产生警告。\n\n### `+`\n\n该选项不接受参数，并且每在命令行上出现一次，值就会加\
  \ `1`。例如，`\"more+\"`，当使用 `--more --more --more` 时，值将增加三次，结果结果为 `3`（前提是初始值为 `0` 或未定义）。\n\
  \n如果选项目标不是标量（scalar），则 `+` 规格符会被忽略。\n\n### `= type [ desttype ] [ repeat ]`\n\n\
  该选项需要一个给定类型的参数。支持的类型有：\n\n*   `s`: 字符串（String）。字符的任意序列。参数以 `-` 或 `--` 开是有效的。\n*\
  \   `i`: 整数（Integer）。可选的前加号或减号，后跟一串数字。\n*   `oo`: 扩展整数，Perl 风格。可以是可选的前加号或减号，后跟一串数字，或者是八进制字符串（一个零，后面可选跟上\
  \ '0', '1' .. '7'），或十六进制字符串（`0x` 后跟 '0' .. '9'，'a' .. 'f'，不区分大小写），或二进制字符串（`0b` 后跟一系列\
  \ '0' 和 '1'）。\n*   `f`: 实数（Real number）。例如 `3.14`、`-6.23E24` 等。\n\n`desttype` 可以是\
  \ `@` 或 `%`，用于指定该选项是列表或哈希值的。只有当选项值的目标没有被其他指定时，才需要此项。不需要时应省略。\n\n`repeat` 指定了该选项在命令行上每次出现时所取值的数量。其格式为\
  \ `{ [ min ] [ , [ max ] ] }`。\n\n*   `min` 表示参数的最少数量。对于带有 `=` 的选项，默认值为 `1`；对于带有\
  \ `:` 的选项，值为 `0`（见下文）。注意，`min` 覆盖 `=` 和 `:` 的语义。\n*   `max` 表示参数的最大数量。它至少等于 `min`。如果省略了\
  \ `max` 但保留了逗号，则获取参数值的数量没有上限。\n\n### `: type [ desttype ]`\n\n与 `=` 类似，但将参数指定为可选。如果省略，为字符串型选项将分配一个空字符串，为数值型选项将分配值\
  \ `zero`。\n\n注意，如果字符串参数以 `-` 或 `--` 开头，它将被视为选项本身。\n\n### `: number [ desttype ]`\n\
  \n与 `:i` 类似，但如果省略了值，将分配数字。\n\n### `: + [ desttype ]`\n\n与 `:i` 类似，但如果省略了值，该选项的当前值将加\
  \ 1。\n\n## 3 LWP::Simple 模块\n\nLWP - Perl 的万维网库\n\n### SYNOPSIS\n\n```perl\nuse\
  \ LWP;\nprint \"This is libwww-perl-$LWP::VERSION\\n\";\n```\n\n### DESCRIPTION\n\
  \nlibwww-perl 集合是一组 Perl 模块，为万维网提供简单且一致的应用编程接口（API）。该库的主要重点是提供允许你编写 WWW 客户端的类和函数。该库还包含更通用的模块，甚至是帮助你实现简单\
  \ HTTP 服务器的类。\n\n此库中的大多数模块提供面向对象的 API。用户代理（user agent）、发送的请求以及从 WWW 服务器收到的响应都由对象表示。这为这些服务提供了一个简单而强大的接口。该接口可以根据需要进行扩展和定制。\n\
  \n该库的主要功能包括：\n\n*   包含各种可复用的组件（模块），可以单独或组合使用。\n*   提供 HTTP 风格的面向对象模型。在此框架内，我们支持访问\
  \ `http`、`https`、`gopher`、`ftp`、`news`、`file` 和 `mail`。\n*   支持基本和摘要认证方案。\n*   支持透明重定向。\n\
  *   支持通过代理服务器访问。\n*   提供 `robots.txt` 文件的解析器以及构建 HTML 表单的框架。\n*   支持 HTTP `cookies`。\n\
  *   一些简单的命令行客户端，例如 `lwp-request` 和 `lwp-download`。\n\n## HTTP 通信\n\nlibwww-perl\
  \ 基于 HTTP 通信。本节从规范文档开始\n\n<URL[:http://www.w3.org/Protocols/](http://www.w3.org/Protocols/)>：\n\
  \n*   HTTP 协议基于请求/响应范式。客户端与服务器建立连接，并以请求方法、URI 和协议版本的形式向服务器发送请求，随后是一个类似于 MIME 的消息，其中包含请求修改器、客户端信息和可能的正文内容。服务器响应状态行，包括消息的协议版本和成功或错误代码，随后是一个类似于\
  \ MIME 的消息，其中包含服务器信息、实体元数据和可能的正文内容。\n\n对于 libwww-perl，这意味着通信始终通过这些步骤进行：首先创建并配置请求对象。然后将该对象传递给服务器并返回一个响应对象供检查。请求始终与之前的请求无关，即服务是无状态的。这种简单模型用于任何我们想要访问的服务。\n\
  \n\n\n\n\nlibwww-perl 请求对象的类名为 `HTTP::Request`。类名使用 `HTTP::` 作为前缀这一事实仅意味着我们使用了 HTTP\
  \ 通信模型。它并不会限制我们尝试将此请求传递给什么类型的服务。例如，我们将 `HTTP::Requests` 同时发送到 `ftp` 和 `gopher` 节点，也会发送到本地文件系统。\n\
  \n请求对象的主要属性有：\n\n* `method` 是一个短字符串，用于说明这是什么类型的请求。最常用的方法有 `GET`、`PUT`、`POST` 和 `HEAD`。\n\
  * `uri` 是一个字符串，表示访问的协议、服务器以及我们想要访问的“文档”的名称。`uri` 还可能编码了其他各种参数。\n* `headers` 包含关于请求的额外信息，也可用于描述内容。`headers`\
  \ 是一组键值对（keyword/value pairs）。\n* `content` 是任意长度的数据。\n\n## 响应对象 (Response Object)\n\
  \nlibwww-perl 响应对象的类名为 `HTTP::Response`。此类对象的主要属性有：\n\n* `code` 是一个数值，表示请求的总体结果。\n\
  * `message` 是一个人类可读的短字符串，与 `code` 对应。\n* `headers` 包含关于响应的额外信息并描述内容。\n* `content`\
  \ 是任意长度的数据。\n\n由于我们不想在程序中直接处理所有可能的代码值，libwww-perl 响应对象提供了几种方法用于查询该响应的类型。最常用的响应分类方法是：\n\
  \n```\nis_success()\n```\n请求已被成功接收、理解或接受。\n\n```\nis_error()\n```\n请求失败。服务器或资源可能不可，访问资源可能被拒绝，或者由于某些原因其他操作失败了。\n\
  \n## 用户代理 (User Agent)\n\n假设我们已经创建了一个请求对象。为了接收响应，我们实际上对它做什么？\n\n答案是将其传递给一个用户代理对象，该对象会处理所有需要完成的工作（如底层通信和错误处理）并返回一个响应对象。用户代理代表你的应用程序在网络上的身份，并为你提供了一个可以接受请求并返回响应的接口。\n\
  \n用户代理是你的应用程序代码与网络之间的接口层。通过这个接口，你可以访问网络上的各种服务器。\n\n用户代理的类名为 `LWP::UserAgent`。每个想要通信的\
  \ libwww-perl 应用都应该至少创建一个该类的对象。该对象提供的主要方法是 `request()`。该方法接受一个 `HTTP::Request` 对象作为参数并（最终）返回一个\
  \ `HTTP::Response` 对象。\n\n用户代理还有许多其他属性，让你配置它如何与网络以及与你的应用程序交互：\n\n* `timeout` 指定了在库断开连接并创建内部超时响应之前，我们给远程服务器响应的时间。\n\
  * `agent` 指定了你的应用程序在网络上展示自己身份时使用的名称。\n* `from` 可以设置为负责运行应用程序员的电子邮件地址。如果设置了此项，则该地址将在每次请求时发送到服务器。\n\
  * `parse_head` 指定了我们是否应该从 HTML 文档的 `<head>` 部分初始化响应头。\n* `proxyandno_proxyspecify`\
  \ 指定了何时以及何时通过代理服务器进行。\n* `credentials` 提供了一种设置访问某些服务所需的用户名和密码的方法。\n\n许多应用程序希望对与网络交互的方式有更强的控制力，它们通过子类\
  \ `LWP::UserAgent` 实现这一点。该库包含一个用于机器人应用的子类 `LWP::RobotUA`。\n\n## 3. 文件 – 操作文件 – 文件模式\
  \ – 文件测试运算符\n\n* `-X FILEHANDLE`\n* `-X EXPR`\n* `-X DIRHANDLE`\n* `-X`\n\n这是一个文件测试，其中\
  \ `X` 是下面列出的字母。该运算符接受一个参数（文件名、文件句柄或目录句柄），并测试关联的文件。如果省略参数，则测试 `STDIN`。除非另有说明，真时返回\
  \ `1`，假时返回空。运算符如下：\n\n1. `-r` 权限是否可读。\n2. `-w` 是否可写。\n3. `-x` 是否可执行。\n4. `-o` 是否属于有效用户所有。\n\
  5. `-R` 真实用户是否可读。\n6. `-W` 真实用户是否可写。\n7. `-X` 真实用户是否可执行。\n8. `-O` 是否属于真实用户所有。\n\
  9. `-e` 是否存在。\n10. `-z` 是否为零。\n11. `-f` 是否为普通文件。\n12. `-d` 是否为目录。\n13. `-l` 是否为符号链接。\n\
  14. `-p` 是否为命名管道（FIFO）。\n15. `-S` 是否为套接字。\n16. `-b` 是否为块设备文件。\n17. `-c` 是否为字符设备文件。\n\
  18. `-t` 文件句柄是否打开到终端。\n19. `-u` 是否设置了 UID。\n20. `-g` 是否设置了 GID。\n21. `-k` 是否设置了粘位。\n\
  22. `-T` 是否为“二进制”文件（`-B` 的相反）。\n23. `-M` 脚本启动时间减文件修改时间，以天为单位。\n24. `-A` 访问时间（Unix，其他平台可能不同）。\n\
  25. `-C` inode 更改时间。\n\n示例：\n\n```\nwhile (<>) {\n    chomp($_);\n    next unless\
  \ -f $_; # 忽略特殊文件\n    ...\n}\n```\n\n注意 `-s/a/b/` 并不会执行取反替换。然而，说 `-exp($foo)` 会按预期工作：只有在减号后面的单个字母才被解释为文件测试。\n\
  \n这些运算符免受上述“看起来像函数”规则的限制。也就是说，运算符后的左括号不会影响后续代码的哪些构成参数。将左括号放在运算符之前以与后续代码分离（这仅适用于优先级高于一元运算符的运算符）：\n\
  \n```\n-s($file) + 1024 # 错误的；等同于 -s($file + 1024)\n(-s $file) + 1024 # 正确\n```\n\
  \n\n\n\n\n文件权限操作符 `-r`、`-R`、`-w`、`-W`、`-x` 和 `-X` 的解释默认基于基于文件的模式以及用户的 `uids` 和 `gids`。可能存在其他原因导致你实际上无法读取、写入或执行该文件：例如网络文件系统的访问控制、`ACLs`（访问控制列表）、只读文件系统以及无法识别的可执行格式。请注意，使用这六个特定运算符来验证某些操作是否可行通常是一个错误，因为这可能会受到竞态条件的影响。\n\
  \n另请注意，对于本地文件系统上的超级用户，`-r`、`-R`、`-w` 和 `-W` 测试始终返回 1，而如果模式中设置了任何执行位，则 `-x` 和 `-X`\
  \ 返回 1。因此，由超级用户运行的脚本可能需要执行 `stat()` 来确定文件的实际模式，或者临时将它们的有效 `uid` 设置为其他值。\n\n如果你正在使用\
  \ ACL，有一个名为 `filetest` 的预指令，它产生的结果可能比原始的 `stat()` 模式位更准确。当在 `use filetest 'access'`\
  \ 模式下，上述文件测试将测试权限是否可以使用 `access(2)` 系列系统调用授予（或不授予）。另请注意，在此预指令下，即使没有设置执行权限位（也没有设置任何额外的执行权限\
  \ ACL），`-x` 和 `-X` 也可能返回真。这种奇怪现象源于底层系统调用的定义。还要注意，由于 `use filetest 'access'` 的实现，当此预指令生效时，特殊文件句柄\
  \ `_` 不缓存文件测试的结果。更多信息请参阅 `filetest` 预指令的文档。\n\n`-T` 和 `-B` 选项的工作方式如下：检查文件的第一个块，查看其是否为包含非\
  \ ASCII 字符的有效 UTF-8。如果是，它就是 `-T` 文件。否则，检查文件的相同部分是否存在异常字符，例如奇怪的控制代码或设置了高位的字符。如果超过三分之一的字符是异常字符，它就是\
  \ `-B` 文件；否则它是 `-T` 文件。此外，任何在检查部分包含零字节的文件都被视为二进制文件。（如果在包含 `LC_CTYPE` 的 `use locale`\
  \ 范围内执行，异常字符是指任何在当前 locale 中既不是可打印字符也不是空格的字符。）如果对文件句柄使用 `-T` 或 `-B`，则检查当前的 IO 缓冲区而不是第一个块。`-T`\
  \ 和 `-B` 在空文件或在测试文件句柄时处于 EOF 的文件上返回真。由于执行 `-T` 测试必须读取文件，在大多数情况下你可能想先对文件使用 `-f`，例如\
  \ `next unless -f $file && -T $file`。\n\n如果给任何文件测试（或 `stat` 或 `lstat` 运算符）提供一个由单个下划线\
  \ `_` 组成的特殊文件句柄，则将使用上一个文件测试（或 `stat` 运算符）的 stat 结构，从而节省一次系统调用。（这对于 `-t` 不起，你需要记得\
  \ `lstat()` 和 `-l` 在 stat 结构中留的是符号链接的值，而不是真实文件。）（此外，如果 stat 缓冲区是由 `lstat` 调用填充的，`-T`\
  \ 和 `-B` 将用 `stat _` 的结果重置它。）\n\n### 示例\n\n```\n43. print \"Can do.\\n\" if -r $a\
  \ || -w _ || -x _; 44.\n45. stat($filename);\n46. print \"Readable\\n\" if -r _;\n\
  47. print \"Writable\\n\" if -w _;\n48. print \"Executable\\n\" if -x _;\n49. print\
  \ \"Setuid\\n\" if -u _;\n50. print \"Setgid\\n\" if -g _;\n51. print \"Sticky\\\
  n\" if -k _;\n52. print \"Text\\n\" if -T _;\n```\n\n\n\n\n它可能通过 `chdir()` 将你带出一个它无法通过\
  \ `chdir()` 返回的目录。如果 `fastcwd` 遇到问题，它将返回 `undef`，但可能会将你留在不同的目录中。为了额外的安全措施，如果一切看起来运行正常，`fastcwd()`\
  \ 函数将检查它是否将你留在与开始时相同的目录。如果发生了变化，它将[报错（die）](http://perldoc.perl.org/functions/die.html)\
  \ 并显示消息“Unstable directory path, current directory changed unexpectedly”。这种情况永远不应该发生。\n\
  \n### fastgetcwd\n\n```perl\nmy $cwd = fastgetcwd();\n```\n\n`fastgetcwd()` 函数作为\
  \ `cwd()` 的同义词提供。\n\n getdcwd\n\n```perl\nmy $cwd = getdcwd();\nmy $cwd = getdcwd('C:');\n\
  ```\n\nWin32 上提供了 `getdcwd()` 函数，用于获取指定驱动器上的当前工作目录，因为 Windows 为每个驱动器维护一个独立的当前工作目录。如果没有指定驱动器，则假设为当前驱动器。\n\
  \n此函数简单地调用了 Microsoft C 库的 `_getdcwd()` 函数。\n\n### abs_path and friends\n\n这些函数仅在请求时导出。它们各接受一个参数并返回该参数的绝对路径。如果没有给出参数，它们将使用当前工作目录。\n\
  \n#### abs_path\n\n```perl\nmy $abs_path = abs_path($file);\n```\n\n使用与 `getcwd()`\
  \ 相同的算法。符号链接和相对路径组件（`.` 和 `..`）会被解析并返回规范路径，就像 `realpath(3)` 一样。\n\n#### realpath\n\
  \n```perl\nmy $abs_path = realpath($file);\n```\n\n`abs_path()` 的同义词。\n\n#### fast_abs_path\n\
  \n```perl\nmy $abs_path = fast_abs_path($file);\n```\n\n更危险但可能更快的 `abs_path` 版本。\n\
  \n### $ENV{PWD}\n\n如果你请求覆盖内置的 `chdir()` 函数，即 `use Cwd qw(chdir);`，那么你的 `PWD` 环境变量将保持更新。请注意，只有当所有使用\
  \ `chdir` 的包都从 `Cwd` 导入它时，它才会保持更新。\n\n由于某些操作系统上的路径分隔符不同（Unix 上为 `/`，MacPerl 上为 `:`\
  \ 等），我们建议在任何涉及移植性的地方使用 `File::Spec` 模块。\n\n实际上，在 Mac OS 上，`getcwd()`、`fastgetcwd()`\
  \ 和 `fastcwd()` 函数都是 `cwd()` 函数的别名，后者在 Mac OS 上调用 `pwd`。同样，`abs_path()` 函数是 `fast_abs_path()`\
  \ 的别名。\n\n## 6. Perl 系统函数\n\n`system()` 函数通过派生子进程并等待子进程完成来执行执行操作系统命令，并为子进程返回某种退出状态供你进行测试。\n\
  \n`system()` 函数的参数可以采取三种形式（括号可选）：\n\n1. `system($STRING);`\n2. `system($PROGRAM,\
  \ @ARGUMENT_LIST);`\n3. `system { $PROGRAM } $FAUX_PROGRAM, @ARGUMENT_LIST`\n\n\
  第一种形式是最常用的。决定你使用哪种形式（或 Perl 实际上使用哪种形式）取决于你尝试执行的命令是否包含 shell 元字符。Shell 元字符包括管道、重定向和语句分隔符等，例如：`(ps\
  \ -aux | column 1 > pids); date`。具体字符为：`& ; ` ' \\ \" | * ? ~ < > ^ ( ) [ ] { }\
  \ $ \\n \\r`\n\n如果你尝试执行的操作系统命令使用了这些任何字符，你必须使用第一种形式，例如：\n\n```perl\nsystem (\"$tace\
  \ < $tcmd > $tout\");\n```\n\n在这种，唯一的字符串参数被传递给命令 shell。要记住的一点是，一旦引入了 `system()`\
  \ 函数，你的脚本在不修改的情况下无法移植到运行在 Windows 以及可能的 Unix 操作系统上的 Perl。\n\n## 7. Perl 子程序和函数\n\
  \nPerl 子程序或函数组共同执行任务的语句。你可以将代码分成不同的子程序。如何在不同子程序之间划分代码取决于你，但在逻辑上，划分通常是每个函数执行一个特定的任务。\n\
  \nPerl 交替使用子程序（subroutine）、方法（method）和函数（function）。\n\n### 定义和调用子程序\n\nPerl 语言中子程序定义的通用形式如下：\n\
  \n```perl\nsub subroutine_name{\n    子程序的主体\n}\n```\n\n调用该 Perl 子程序的典型方式如下：\n\n\
  ```perl\nsubroutine_name( 参数列表 );\n```\n\n在 5.0 之前的 Perl 版本中，调用子程序的语法略有不同，如下所示。在最新的\
  \ Perl 版本中仍然有效，但不建议这样做，因为它跳过了子程序的原型检查（prototypes）。\n\n```perl\n&subroutine_name(\
  \ 参数列表 );\n```\n\n让我们来看下面的这个示例，它定义了一个简单的函数然后调用了它。因为 Perl 在执行程序之前会编译你的程序，所以你在哪里声明子程序并不重要。\n\
  \n```perl\n#!/usr/bin/perl\n\n# 函数定义\nsub Hello{\n    print \"Hello, World!\\n\"\
  ;\n}\n\n# 函数调用\nHello();\n```\n\n当执行上述程序时，它产生：`Hello, World!`\n\n### 向子程序传递参数\n\n\
  你可以像在任何其他语言中向子程序传递各种参数，并在函数内部使用特殊数组 `@_` 进行访问。\n\n函数的第一个参数在 `$[0]` 中，第二个在 `$[1]`\
  \ 中，以此此类推。你可以像传递标量一样传递数组和哈希作为参数，但传递多个数组或哈希通常会导致它们丢失身份标识。因此，我们将使用引用（references）来传递任何数组或哈希。\n\
  \n让我们尝试下面的示例，它接收一个数字列表然后打印它们的平均值：\n\n```perl\n#!/usr/bin/perl\n\nsub Average{\n\
  \    # 获取传递的参数总数。\n    $n = scalar(@_);\n    $sum = 0;\n    foreach $item (@_){\n\
  \        $sum += $item;\n    }\n    $average = $sum / $n;\n    print \"Average for\
  \ the given numbers : $average\\n\";\n}\n\n# 函数调用\nAverage(10, 20, 30);\n```\n\n\
  当执行上述程序时，它产生：`Average for the given numbers : 20`\n\n### 向子程序传递列表\n\n由于 `@_` 变量是一个数组，它可以用于向子程序提供列表。然而，由于\
  \ Perl 接受和解析列表的方式，从 `@_` 提取单个元素可能是困难的。如果你必须和标量一起传递列表，请将列表作为最后一个参数，如下所示：\n\n```perl\n\
  #!/usr/bin/perl\n\nsub PrintList{\n    my @list = @_;\n    print \"Given list is\
  \ @list\\n\";\n}\n\n$a = 10;\n@b = (1, 2, 3, 4);\n\n# 带列表参数调用\nPrintList($a, @b);\n\
  ```\n\n当执行上述程序时，它产生：`Given list is 10 1 2 3 4`\n\n### 向子程序传递哈希\n\n当你向接受列表的子程序或操作符提供哈希时，哈希会被自动转换为键值对的列表。例如：\n\
  \n```perl\n#!/usr/bin/perl\n\nsub PrintHash{\n    my (%hash) = @_;\n    foreach\
  \ my $key ( keys %hash ){ \n        my $value = $hash{$key}; \n        print \"\
  $key : $value\\n\";\n    }\n}\n\n%hash = ('name' => 'Tom', 'age' => 19);\n\n# 带哈希参数调用\n\
  PrintHash(%hash);\n```\n\n当执行上述程序时，它产生：\nname : Tom\nage : 19\n\n### 从子程序返回数值\n\n\
  你可以像在任何其他编程语言中从子程序返回数值。如果你没有从子程序返回数值，那么子程序中最后执行的任何计算结果都将自动成为返回值。\n\n你可以像返回标量一样从子程序返回数组和哈希，但返回多个数组或哈希通常会导致它们丢失身份标识。因此，我们将使用引用（在下一章中解释）从函数返回任何数组或哈希。\n\
  \n\n\n让我们尝试以下示例，它接收一个数字列表并返回它们的平均值 −\n\n```perl\n#!/usr/bin/perl\n\n# 函数定义 sub Average{\n\
  # 获取传递的参数总数。\n$n = scalar(@_);\n$sum = 0;\nforeach $item (@_){\n$sum += $item;\n\
  }\n$average = $sum / $n;\nreturn $average;\n}\n\n# 函数调用\n$num = Average(10, 20,\
  \ 30);\nprint \"Average for the given numbers : $num\\n\";\n```\n\n当执行上述程序时，它产生如下结果\
  \ − 数字的平均值：20\n\n## 子程序中的私有变量\n\n默认情况下，Perl 中的所有变量都是全局变量，这意味着它们可以从程序的任何位置访问。但你可以随时使用\
  \ `my` 操作符创建名为局部变量的私有变量。\n\n`my` 操作符将变量限制在代码的特定区域内，在该区域内，它可以被使用和访问。在该区域之外，该变量无法被使用或访问。该区域被称为它的作用域（scope）。局部作用域通常是一个由大括号包围的代码块，例如定义子程序体的大括号，或者标记\
  \ `if`、`while`、`for`、`foreach` 和 `eval` 语句的代码块。\n\n以下示例了如何使用 `my` 操作符定义单个或多个私有变量\
  \ −\n\n```perl\nsub somefunc {\nmy $variable; # $variable 在 somefunc() 外部不可见\nmy\
  \ ($another, @an_array, %a_hash); # 一次声明多个变量\n}\n```\n\n让我们检查以下示例以区分全局变量和私有变量 −\n\
  \n```perl\n#!/usr/bin/perl\n\n# 全局变量\n$string = \"Hello, World!\";\n\n# 函数定义 sub\
  \ PrintHello{\n# PrintHello 函数的私有变量\nmy $string;\n$string = \"Hello, Perl!\";\n\
  print \"Inside the function $string\\n\";\n}\n\n# 函数调用 PrintHello();\nprint \"Outside\
  \ the function $string\\n\";\n```\n\n当执行上述程序时，它产生如下结果 − 函数内部 Hello, Perl! 函数外部 Hello,\
  \ World!\n\n## 通过 local() 使用临时值\n\n`local` 主要用于变量的当前值必须对调用的子程序可见的情况。`local` 只是为全局（即包）变量提供临时值。这被称为动态作用域。局部作用域通过\
  \ `my` 实现，它的工作方式更类似于 C 语言的自动声明。\n\n如果给 `local` 传递多个变量或表达式，必须将它们放在括号中。该操作符通过将参数列表中变量的当前值保存到隐藏堆栈中，并在退出代码块、子程序或\
  \ `eval` 时恢复它们。\n\n让我们检查以下示例以区分全局变量和局部变量 −\n\n```perl\n#!/usr/bin/perl\n\n# 全局变量\n\
  $string = \"Hello, World!\";\n\nsub PrintHello{\n# PrintHello 函数的私有变量 local $string;\n\
  $string = \"Hello, Perl!\"; PrintMe();\nprint \"Inside the function PrintHello $string\\\
  n\";\n}\n\nsub PrintMe{\nprint \"Inside the function PrintMe $string\\n\";\n}\n\n\
  # 函数调用 PrintHello();\nprint \"Outside the function $string\\n\";\n```\n\n当执行上述程序时，它产生如下结果\
  \ − 函数内部 PrintMe Hello, Perl! 函数内部 PrintHello Hello, Perl! 函数外部 Hello, World!\n\n\
  ## 通过 state() 使用状态变量\n\n还有另一种类型的局部变量，它们与私有变量相似，但它们会保持状态，并且在多次调用子程序时不会重新初始化。这些变量使用\
  \ `state` 操作符定义，并从 Perl 5.9.4 开始可用。\n\n让我们检查以下示例演示状态变量的使用 −\n\n```perl\nuse feature\
  \ 'state';\n\nsub PrintCount{\nstate $count = 0; # 初始值\nprint \"Value of counter\
  \ is $count\\n\";\n$count++;\n}\n\nfor (1..5){ PrintCount();\n}\n```\n\n当执行上述程序时，它产生如下结果\
  \ − 计数器值为 0 计数器值为 1 计数器值为 2 计数器值为 3 计数器值为 4\n\n在 Perl 5.10 之前，你必须这样写 −\n\n```perl\n\
  #!/usr/bin/perl\n{\nmy $count = 0; # 初始值\nsub PrintCount {\nprint \"Value of counter\
  \ is $count\\n\";\n$count++;\n}\n}\nfor (1..5){ PrintCount();\n}\n```\n\n## 子程序调用上下文\n\
  \n子程序或语句的上下文是由期望的返回值类型定义的。这允许你使用单个函数根据用户期望接收的内容来返回不同的值。例如，接下来的 `localtime()` 在标量上下文（scalar\
  \ context）调用时返回字符串，但在列表上下文（list context）调用时返回列表。\n\n```perl\nmy $datestring = localtime(\
  \ time );\n```\n\n在此示例中，`$timestr` 的值现在是由当前日期和时间组成的字符串，例如 Thu Nov 30 15:21:33 2000。。反地\
  \ −\n\n```perl\n($sec,$min,$hour,$mday,$mon, $year,$wday,$yday,$isdst) = localtime(time);\n\
  ```\n\n现在，各个变量包含了 `localtime()` 子程序返回的相应值。\n"
