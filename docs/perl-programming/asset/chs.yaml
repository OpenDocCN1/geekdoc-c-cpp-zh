  \ $&\\n\"; print \"After:  $'\\n\";\n```\n\n当执行上述程序时，它会产生以下结果：\nBefore: The\nMatched:\
  \ foo\nAfter: d is in the salad bar\n\n### 5. 替换运算符\n\n替换运算符 `s///` 实际上是匹配运算符的扩展，允许你将匹配到的文本替换为新文本。该运算符的形式为：`s/PATTERN/REPLACEMENT/`。\n\
