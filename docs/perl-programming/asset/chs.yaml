  \ ?(foo.*)?;\n    $last = $1 if /(foo.*)/;\n}\nprint \"First: $first, Last: $last\\\
  n\";\n```\n\n当执行上述程序时，它会产生以下结果：`First: food, Last: footbrdige`。\n\n### 4. 正则表达式变量\n\
