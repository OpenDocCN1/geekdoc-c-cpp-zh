  \n### 仅匹配一次\n\n匹配运算符还有一个更简单的版本 - `?PATTERN?` 运算符。这基本上与 `m//` 运算符相同，不同之处在于它在每次调用重置之前只在搜索的字符串中匹配一次。\n\
  \n例如，你可以使用它来获取列表中的第一个和最后一个元素：\n\n```perl\n#!/usr/bin/perl\n@list = qw/food foosball\
