  \n```perl\nmy ($hours, $minutes, $seconds) = ($time =~ m/(\\d+):(\\d+):(\\d+)/);\n\
  ```\n\n## 3. 匹配运算符修饰\n\n匹配运算符支持自己的一组修饰。`/g` 修饰允许全局匹配。`/i` 修饰将使匹配不区分大小写。以下是修饰的完整列表：\n\
