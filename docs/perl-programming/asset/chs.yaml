- "# PerL 编程入门指南\n\n\n\n![](img/cover00476.jpeg)\n\n\n\n# 第一单元 PERL 简介\n\n## 1. PERL\
  \ 简介与数据类型\n\n标量（Scalars）是简单的变量。它们以美元符号（`$`）开头。标量可以是数字、字符串或引用。引用实际上实际上是变量的地址，我们将在接下来的章节中看到。\n\
  \n数组（Arrays）是标量的有序列表，你通过从 0 开始的数值索引访问它们。它们以“at”符号（`@`）开头。\n\n哈希表（Hashes）是无序的键值对集合，你使用键作为下标进行访问。它们以百分比符号（`%`）开头。\n\
  \n![](img/image00428.jpeg)\n\n## 2. 构建 atgc.pl\n\n![](img/image00429.jpeg)\n![](img/image00430.jpeg)\n\
  \n## 3. ~tr/// 函数\n\n这不是一个函数。这是一个置换运算符（transliteration operator）；它将 `SEARCHLIST`\
  \ 中所有字符替换为 `REPLACEMENTLIST` 中的字符。\n\n语法：`tr/SEARCHLIST/REPLACEMENTLIST/`\n\n###\
  \ 返回值\n此函数返回替换或删除的字符数量。示例\n\n以下是显示其基本用法示例代码：\n```\n#!/usr/bin/perl -w\n$string =\
  \ 'the cat sat on the mat.';\n$string =~ tr/a-z/b/d;\nprint \"$string\\n\";\n```\n\
  \n当执行上述代码时，它会产生以下结果。在这里，选项 `d` 用于删除匹配的字符。\n\n![](img/image00428.jpeg)\n\n## 4. ~s///\
  \ 函数\n\n### 描述\n这不是一个函数。这是一个正则表达式替换运算符。根据 `PATTERN` 中指定的正则表达式，数据将被 `REPLACE` 替换。与\
  \ `m//` 类似，分隔符由 `s` 之后的第一个字符定义。\n\n### 语法\n`s/PATTERN/REPLACE/`\n\n### 返回值\n此函数在失败时返回\
  \ 0，在成功时返回替换的次数。示例\n\n```\n#!/usr/bin/perl -w\n$string = \"This is Test\";\n## 这会将\
  \ Test 替换为 Best。\n$string =~ s/Test/Best/;\nprint \"$string\\n\";\n```\n\n当执行上述代码时，它产生以下结果\
  \ — This is Best\n\n![](img/image00428.jpeg)\n\n## 5. 使用 Printf 函数格式化数值输出\n\n![](img/image00428.jpeg)\n\
  ![](img/image00428.jpeg)\n![](img/image00431.jpeg)\n\n## 6. Chop 和 Chomp 运算符\n\n\
  ![](img/image00428.jpeg)\n![](img/image00432.jpeg)\n![](img/image00428.jpeg)\n\n\
  ## 7. 通用网关接口(CGI) - 简介与应用\n\n通用网关接口（CGI）是 Web 服务器将 Web 用户请求传递给应用程序并接收返回数据以转发给用户标准方法。当用户请求\
  \ Web 页面（例如，通过点击高亮单词或输入网站地址）时，服务器返回请求的页面。然而，当用户在 Web 页面上填写表单并提交时，通常需要由应用程序处理。Web\
  \ 服务器通常会将表单信息传递给一个处理数据的小应用程序，并可能会返回确认消息。这种在服务器和应用程序之间传递数据的方法或约定被称为通用网关接口（CGI）。它是\
  \ Web 超文本传输协议（HTTP）的一部分。\n\n如果你正在创建一个网站并希望让 CGI 应用程序进行控制，你可以在 HTML 文件中编写的统一资源定位符（URL）中指定应用程序名称。如果你正在创建一个表单，此\
  \ URL 可以作为 `FORMS` 标签的一部分。例如，你可能会编写：\n\n![](img/image00428.jpeg)\n```html\n<FORM\
  \ METHOD=POST ACTION=http://www.mybiz.com/cgi-bin/formprog.pl>\n```\n\n\"mybiz.com\"\
  \ 上的服务器会将控制权交给名为 `formprog.pl` 的 CGI 应用程序，以记录输入的数据并返回确认消息。（`.pl` 表示用 PERL 编写的程序，但也可以使用其他语言。）\n\
  \n通用网关接口提供了一种一致的方法，使数据从用户请求传递到应用程序并返回用户。这意味着编写应用程序的人可以确保无论服务器使用何种操作系统（PC、Macintosh、UNIX、OS/390\
  \ 或其他），它都能被使用。这仅仅是信息从 Web 服务器关于你的请求传递到应用程序并再次返回的一种基本方法。\n\nCGI 的重要性在于，它的灵活性使其成为从\
  \ Web 服务器运行可执行文件的标准。该标准允许在网站上以无无尽的方式实现真正的交互性。\n\n![](img/image00428.jpeg)\n![](img/image00433.jpeg)![](img/image00434.jpeg)\n\
  \n## CGI 的局限性与问题\n\n### 问题：\nImages/image00428.jpeg\n\n性能：每当用户请求时，服务器都必须启动 CGI 程序。当程序是用解释型语言（如\
  \ Perl）编写时，服务器仍然需要进行解释或编译，这需要更多时间。如果命令被频繁调用，产生的工作量可能会使服务器崩溃。\n\n### CGI 的优势与应用：\n\
  - **平台独立性**：大多数 Web 服务器支持 CGI，包括 Unix、Windows NT 和 Macintosh。\n- **语言独立性**：Perl、C、C++、Visual\
  \ Basic、Java。\n- **可扩展性**：CGI 的简单性使其具有极的可扩展性。\n\n一个 CGI 程序的示例是 Wiki。用户代理请求名称；服务器执行\
  \ CGI；CGI 程序检索条目的源码（如果存在），将其转换为 HTML 并传输给用户。如果点击“编辑此页面”链接，CGI 将内容填充到 HTML 区域或其他控件，并在用户提交时将其保存回服务器。\n\
  \n# 第二单元\n\n## 数组与哈希表简介\n\n### 数组\n虽然我们经常处理单个变量，但有时处理变量集合很有用。对此，Perl 提供了选项：数组和哈希表。数组是最简单的集合类型，因此我们从数组开始。\n\
  \n例如，假设你想测试“Hello”程序的所有可能输出。当然，你可以手动运行三次，每次更改 `$status` 变量的值。但你也可以使用包含状态变量所有可能值（'leaving'、'arriving'\
  \ 和 'other'）的数组并遍历它。\n\n首先，如下定义数组：\n```perl\n@status = (\"leaving\", \"arriving\"\
  , \"staying\", \"whatever\");\n```\n\n注意，数组不是以 `$` 符号开头，而是以 `@` 符号开头。\n\n现在你可以在\
  \ hello 程序中添加如下内容：\n```perl\n@status = (\"leaving\", \"arriving\", \"staying\",\
  \ \"whatever\"); foreach $status (@status) {\n```\n\n\n\n\n\n## Perl 数组操作与循环\n\n\
  ## Foreach 循环\n\n这说明了几个点。首先，它演示了如何使用 `foreach` 语句遍历数组。`foreach` 的含义类似于：“对于数组中的每个元素，执行起始大括号和结束大括号之间的任何操作。”\n\
  \n它还演示了一个循环结构，因为当程序运行到 `foreach` 循环的底部（最后一个大括号）时，只要数组中还有更多值，它就会再次回到顶部。一旦数组中的所有值都被使用完毕，循环就会终止。如果循环之后还有额外的指令，程序将从那里继续执行。\n\
  \n注意 `print $greeting` 指令现在在分号前有一个点号和 `\\n`（在引号中）。`\\n` 是一个换行符。它告诉解释器在之后打印一个回车符。如果没有它，所有的问候语将全部连在同一行上。点号（在此背景下）被称为连接操作符。它将回车符与紧接其前的\
  \ `$greeting` 连接在一起。\n\n```perl\nif ($status eq \"leaving\") {\n    $greeting =\
  \ \"Goodbye\";\n}\nelsif ($status eq \"arriving\") {\n    $greeting = \"Hello\"\
  ;\n}\nelse {\n    $greeting = \"Nice day\";\n}\nprint $greeting . \"\\n\";\n```\n\
  \n### 练习\n目标：1) 熟悉条件判断\n指令：复制并运行上面的脚本，该脚本遍历数组并根据 `$status` 的内容更改 `$greeting` 的值。然后添加另一个\
  \ `elsif` 条件，如果 `$status` 的值为 \"staying\"，则将 `$greeting` 的值改为 \"Set yourself down\
  \ and rest\"。\n\n## Perl 记录 (Records)\n\nPerl 允许我们创建数组数组、数组哈希、哈希数组以及哈希哈希。这些复杂的、嵌套数据结构使用称为“引用”（references）的特殊变量来创建“记录”（records）（你使用“解引用”（dereferences）来访问记录的部分）。我们不会详细介绍\
  \ Perl 引用和记录，但在我们开始解析 XML 时，知道它们是什么以及如何使用解引用来表示记录的特定部分是有用的。\n\n一个普通数组起始像这样：\n```perl\n\
  @a_list = ();\n```\n\n我们可以将哈希表作为元素添加到数组中。哈希表没有普通的变量名，而是被称为“匿名”哈希：\n```perl\n@a_list\
  \ = (\n    { 'key_1' => 'value_1', 'key_2' => 'value_2', 'key_3' => 'value_3' },\n\
  \    { 'key_4' => 'value_4', 'key_5' => 'value_5', 'key_6' => 'value_6' }\n);\n\
  ```\n\n要打印与 `key_2` 关联的值，我们使用特殊语法对其进行解引用：\n```perl\nprint %{$a_list[0]}->{\"key_2\"\
  } . \"\\n\";\n```\n\n该打印命令的结果是 `value_2`。解引用的部分很容易识别：`$a_list[0]` 代表 `@a_list` 数组中的第一项，`key_2`\
  \ 是我们匿名哈希中的键之一。困难的部分在于 `%` 以及你必须用来指示实际解引用的额外大括号。\n\n现在不要担心这些细节的含义，因为具体的用法取决于你解引用的是数组、哈希还是标量，以及你在什么语境下使用它们。此时最重要的是注意的是使用\
  \ `->` 来连接嵌套的 Perl 记录层级。我们稍后会遇到。\n\n## 哈希 (Hashes)\n\n最后是另一种集合类型，哈希。本课程不会深入研究哈希，但简单来说，哈希类似于数组，不同之处在于不是通过数字引用其元素，而在哈希中你通过分配的键来引用它们。\n\
  \n一个示例：\n```perl\n%names = (\n    'Durno' => 'John',\n    'Jordan' => 'Mark',\n\
  \    'Hacker' => 'J.R.'\n);\n```\n\n注意哈希是用百分号表示的。要找到名为 Durno 的人的名字，你可以这样做：\n```perl\n\
  $firstName = $names{'Durno'};\nprint $firstName;\n```\n\n## Split 函数\n\n`split`\
  \ 函数根据分隔符将字符串拆分为多个字段。\n\n### 语法\n`split(pattern, string)`\n\n`split` 函数返回字段列表。如果没有指定限制，它返回所有字段。如果指定了限制，它返回最多指定数量的字段。\n\
  \n### 返回值\n- 在**标量语境 (Scalar Context)** 中：返回第一个字段。\n- 在**数组语境 (Array Context)**\
  \ 中：返回字段列表。\n\n### 示例\n```perl\nmy @fields = split(\":\", \"apple:banana:cherry\"\
  );\nprint $fields[0]; # 输出 apple\n```\n\n## 复制数组\n\n复制一个 Perl 数组实际上非常简单，看起来像是个魔术，一旦你学会了怎么做。在其他语言中，`@array2`\
  \ 似乎是对 `@array1` 的引用，但在 Perl 中它是一个拷贝。\n\n为了证明这确实复制了第一个数组，这里有一个短的 Perl 数组脚本来证明这一点：\n\
  \n```perl\nmy @arr1 = qw/cheese pepperoni/;\nmy @arr2 = @arr1;\npush @arr1, 'works';\n\
  \nsub print_arr() {\n    my (@arr) = @_;\n    foreach $elem (@arr) {\n        print\
  \ \"$elem\\n\";\n    }\n}\n\nprint \"array1:\\n\";\nprint_arr(@arr1);\n\nprint \"\
  \\narray2:\\n\";\nprint_arr(@arr2);\n```\n\n## 使用顺序数据填充数组\n\nPerl 为顺序数字和字母提供了快捷方法。例如，在数到\
  \ 100 时不需要手动输入每个元素，我们可以这样做：\n\n```perl\n#!/usr/bin/perl\nmy @var_10 = (1..10);\n\
  my @var_20 = (10..20);\nmy @var_abc = (a..z);\n\nprint \"@var_10\\n\"; # 打印 1 到\
  \ 10 的数字\nprint \"@var_20\\n\"; # 打印 10 到 20 的数字\nprint \"@var_abc\\n\"; # 打印 a\
  \ 到 z 的字母\n```\n\n\n\n\n\n## 3. qw 函数\n\n该函数是快速指定许多单引号单词的快捷。例如，`qw(foo bar baz)`\
  \ 等同于 `('foo', 'bar', 'baz')`。一些程序员觉得使用 `qw` 让 Perl 脚本更易于读。你实际上可以使用任何一组分隔符，而不仅仅是括号。\n\
  \n你只需要使用 `qw()` 来准备一个数组，如下面的示例所示。\n\n### 语法\n以下是该函数的简单语法 −\n\n```perl\nqw EXPR\n\
  ```\n\n### 返回值\n此函数返回一个列表，由 `LIST` 中的元素组成，这些元素的评估方式就像它们被单引号一样。\n\n### 示例\n以下是显示其基本用法的示例代码\
  \ −\n\n```perl\n#!/usr/bin/perl -w\n\n@array = qw(This is a list of words without\
  \ interpolation); foreach $key (@array){\n\nprint\"Key is $key\\n\";\n\n}\n```\n\
  \n当执行上述代码时，它产生以下结果 −\n\nKey is This Key is is Key is a Key is list Key is of\nKey\
  \ is words Key is without\nKey is interpolation\n\n## 4. 数组大小的确定\n\n数组的大小可以使用数组的标量上下文（scalar\
  \ context）来确定 - 返回值将数组中元素的数量 −\n\n```perl\n@array = (1,2,3);\n\nprint \"Size: \"\
  ,scalar @array,\"\\n\";\n```\n\n返回值始终是数组的物理大小，而不是有效元素的数量。你可以使用此片段演示这一点，以及 `scalar\
  \ @array` 和 `$#array` 之间的差异如下 −\n\n```perl\n#!/uer/bin/perl @array = (1,2,3);\n\n\
  $array[50] =  4;\n\n$size =  @array;\n\n$max_index = $#array;\n\nprint  \"Size:$size\\\
  n\";\nprint \"Max Index:  $max_index\\n\";\n```\n\n这将产生以下结果  −\n\nSize: 51\nMax\
  \ Index: 50\n\n数组中只有四个元素包含信息，但数组的长度为 51，最高索引为 50。\n\n## 5. 访问数组的第一个和最后一个最后一个元素\n\
  \n### Shift 函数\n此函数返回数组中的第一个值，将其删除并将数组列表的元素向左移动一位。如果没有指定 `ARRAY`，则移动子程序内的 `@_` 数组，否则移动\
  \ `@ARGV`。`shift` 本质上与 `pop` 相同，但值是从数组的开头而不是末尾取的。\n\n### 语法\n以下是该函数的简单语法 −\n\n```perl\n\
  shift ( [ARRAY] )\n\nshift\n```\n\n### 返回值\n如果数组为空，此函数返回 `undef`，否则返回数组中的第一个元素。\n\
  \n### 示例\n以下是显示其基本用法的示例代码 −\n\n```perl\n#!/usr/bin/perl\n\n@array = (1..5);\n\n\
  while ($element = shift(@array)) { print(\"$element - \");\n\n}\n\nprint(\"The End\\\
  n\");\n```\n\n当执行上述代码时，它产生以下结果 −\n\n1 - 2 - 3 - 4 - 5 - The End\n\n## 6. Unshift\
  \ 函数\n\n此函数将 `LIST` 中的元素按顺序放置在 `ARRAY` 的开头。这是 `shift()` 的相反函数。\n\n### 语法\n以下是该函数的简单语法\
  \ −\n\n```perl\nunshift ARRAY, LIST\n```\n\n### 返回值\n此函数返回 `ARRAY` 中新元素的数量。\n\n\
  ### 示例\n以下是显示其基本用法的示例代码 −\n\n```perl\n#!/usr/bin/perl -w @array = ( 1, 2, 3, 4);\n\
  \nprint \"Value of array is @array\\n\" ; unshift( @array, 20, 30, 40 );\n\nprint\
  \ \"Now value of array is @array\\n\" ;\n```\n\n当执行上述代码时，它产生以下结果 −\n\nValue of array\
  \ is 1 2 3 4\nNow value of array is 20 30 40 1 2 3 4\n\n## 7. Push 函数\n\n此函数将 `LIST`\
  \ 中的值推到列表 `ARRAY` 的末尾。与 `pop` 配合实现栈。\n\n### 语法\n以下是该函数的简单语法 −\n\n```perl\npush ARRAY,\
  \ LIST\n```\n\n### 返回值\n此函数返回新数组中元素的数量。\n\n### 示例\n以下是显示其基本用法的示例代码 −\n\n```perl\n\
  #!/usr/bin/perl -w\n\n$, = \",\";\n\n@array = ( 1, 2 );\n\nprint \"Before pushing\
  \ elements @array \\n\"; push(@array, (3, 4, 5));\n\nprint \"After pushing elements\
  \ @array \\n\";\n```\n\n当执行上述代码时，它产生以下结果 −\n\nBefore pushing elements 1 2\nAfter\
  \ pushing elements 1 2 3 4 5\n\n## 8. Pop 函数\n\n此函数返回 `ARRAY` 的最后一个元素，从数组中移除该值。注意\
  \ `ARRAY` 必须明确是一个数组，而不是列表。\n\n如果省略了 `ARRAY`，它将从主程序中的 `@ARGV` 或在 `eval STRING` 调用内、或\
  \ `BEGIN`、`CHECK`、`INIT` 或 `END` 块中弹出最后一个值。否则，它尝试从子程序内的 `@_` 数组中弹出信息。它是 `push` 的相反操作，结合使用时，允许你实现“栈”。\n\
  \n注意在应用 `pop` 之后数组将缩短。\n\n### 语法\n以下是该函数的简单语法 −\n\n```perl\npop ARRAY\n```\n\n###\
  \ 返回值\n如果列表为空，此函数返回最后一个值，否则返回数组中的最后一个元素。\n\n### 示例\n以下是显示其基本用法的示例代码 −\n\n```perl\n\
  #!/usr/bin/perl -w\n\n@a = (1, 2, 3);\n\nprint(\"pop() \", pop(@a), \"\\n\");\n\
  ```\n\n当执行上述代码时，它产生以下结果 −\n\npop() 3\n\n## 9. 数组切片 (Array Slices)\n\n数组是一个存储有序列表的变量。要引用单个元素，将使用方括号。这里有一个简单的示例：\n\
  \n```perl\n#!/usr/bin/perl\n\n@array = (1, 2, 3);\n\nprint $array[0];\nprint $array[1];\n\
  ```\n\n## 10. Splice 函数\n\n此函数从 `ARRAY` 的 `OFFSET` 开始移除 `LENGTH` 个元素，并替换指定的 `LIST`。如果省略\
  \ `LENGTH`，则从那里开始移除。\n\n切片允许一次性访问数组的多个元素：\n\n```perl\n#!/usr/bin/perl\n\n@ages =\
  \ (25,30,40);\n\n@names = (\"John\", \"Paul\", \"Kumar\");\n\nprint @ages[0..1];\n\
  print @names[1..2];\n```\n\n### 语法\n以下是该函数的简单语法 −\n\n```perl\nsplice ARRAY, OFFSET,\
  \ LENGTH, LIST splice ARRAY, OFFSET\n```\n\n### 返回值\n此函数返回 −\n\n*   在标量上下文中，如果没有移除元素则返回\
  \ `undef`\n*   在标量上下文中，移除的最后一个元素\n*   在列表中文中，失败时返回空列表\n*   在列表中文中，移除的元素列表\n\n###\
  \ 示例\n以下是显示其基本用法的示例代码 −\n\n```perl\n#!/usr/bin/perl -w\n\n@array=(\"a\", \"e\",\
  \ \"i\", \"o\", \"u\");\n\n@removedItems = splice(@array, 0 , 3, (\"A\", \"E\",\
  \ \"I\"));\n\nprint \"Removed items: @removedItems\\n\";\n```\n\n当执行上述代码时，它产生以下结果\
  \ −\n\nRemoved items: a e i\n\n## 11. 数组排序\n\nPerl 有名为 `sort` 的内置函数可以对数组排序。在最简单的形式下，你只需要给它一个数组，它就会返回排序后的元素。\n\
  \n```perl\n@sorted = sort @original;\n```\n\n### 比较函数\nPerl 中 `sort` 的工作方式是，它遍历原始数组的每两个元素；在每次循环中，它将左侧的值放入变量\
  \ `$a`，将右侧的值放入变量 `$b`。然后它调用一个比较函数。该“比较函数”如果 $a$ 的内容应该在左侧则返回 1，如果 $b$ 的内容应该在左侧则返回\
  \ -1，或者如果两个值相同则无紧要，返回 0。\n\n默认情况下，你看不到这个比较函数，sort 根据 ASCII 表对值进行比较，但如果你愿意，可以显式地编写它：\n\
  \n```perl\nsort { $a cmp $b } @words;\n```\n\n这段代码提供的结果与不带块的结果完全相同：`sort @words`。\n\
  \n\n\n\n在这里你可以看到，默认情况下，perl 在比较函数中使用 `cmp`。这是因为 `cmp` 正好执行了我们这里的操作。它将两侧的值作为字符串进行比较：如果左参数“小于”右参数，则返回\
  \ `1`；如果左参数“大于”右参数，则返回 `-1`；如果它们相同，则则返回 `0`。\n\n### 字母顺序排序\n\n如果你想忽略字符串中的大小写（这通常称为字母顺序排序），你可以像下面的示例那样操作：\n\
  \n```perl\nmy @sorted_words = sort { lc($a) cmp lc($b) } @words;\n```\n\n在这里，为了比较，我们调用了\
  \ `lc` 函数，它返回参数的小写版本。然后 `cmp` 比较这些小写版本，并决定原始字符串中哪个应该在前，哪个应该在后。\n\n结果是：\n\n```perl\n\
  $VAR1 = [\n2. 'bar',\n3. 'foo',\n4. 'moo',\n5. 'Zorg'\n6];\n```\n\n### 在 Perl 中排序数字\n\
  \n如果我们取一个数字数组并使用默认排序进行排序，结果可能不是我们预期的。\n\n```perl\nmy @numbers = (14, 3, 12, 2, 23);\n\
  my @sorted_numbers = sort @numbers;\nsay Dumper \\@sorted_numbers;\n```\n\n```perl\n\
  $VAR1 = [\n2.12,\n3.14,\n4.2,\n5.23,\n6.3];\n```\n\n如果你仔细考虑，当然，这并不奇怪。当比较函数看到 `12`\
  \ 和 `3` 时，它将它们作为字符串进行比较。这意味着比较两个字符串中的第一个字符。\"1\"` 与 `\"3\"`。在 ASCII 表中 `\"1\"` 在\
  \ `\"3\"` 之前，因此字符串 `\"12\"` 会在字符串 `\"3\"` 之前。\n\nPerl 并不会魔法地理解你想将这些值作为数字进行排序。\n\n\
  不过没问题，我们可以写一个比较函数来将这两个值作为数字进行比较。为此，我们使用 `<=>`（也称为[宇宙船运算符](http://en.wikipedia.org/wiki/Spaceship_operator)），它将它的两个参数作为数字进行比较，并返回\
  \ `1`、`-1` 或 `0`。\n\n```perl\nmy @sorted_numbers = sort { $a <=> $b } @numbers;\n\
  ```\n\n结果如下：\n\n```perl\n$VAR1 = [\n2.2,\n3.3,\n4.12,\n5.14,\n6.23];\n```\n\n###\
  \ 反转数组\n\n#### 反转列表 (LIST)\n\n在列表上下，返回一个由 `LIST` 元素按相反顺序组成的列表值。在标量上下，连接 `LIST` 的元素并返回一个所有字符顺序都相反的字符串值。\n\
  \n```perl\nprint join(\", \", reverse \"world\", \"Hello\"); # Hello, world 2.\n\
  print scalar reverse \"dlrow ,\" \"olleH\";# Hello, world 在标量上下不带参数使用，reverse()\
  \ 反转 `$_`。\n$_ = \"dlrow ,olleH\";\nprint reverse; # 无输出，列表上下文\nprint scalar reverse;\
  \ # Hello, world\n```\n\n注意，将数组反转自身（如 `@a = [reverse](http://perldoc.perl.org/functions/reverse.html)\
  \ @a`）将尽可能保留不存在的元素；即对于非魔法数组或具有 `EXISTS` 和 `DELETE` 方法的绑定数组。\n\n### 创建哈希-向哈希添加元素-删除、排序和打印哈希元素\n\
  \n哈希是键/值对的集合。哈希变量以百分号（`%`）开头。要引用哈希的单个元素，你将使用以 `$` 符号开头的哈希变量名，并在花括号中跟随与值相关的 `\"key\"\
  `。\n\n这是一个使用哈希变量的简单示例：\n\n```perl\n#!/usr/bin/perl\n%data = ('John Paul', 45, 'Lisa',\
  \ 30, 'Kumar', 40);\nprint \"\\$data{'John Paul'} = \\$data{'John Paul'}\\n\"; print\
  \ \"\\$data{'Lisa'} = \\$data{'Lisa'}\\n\";\nprint \"\\$data{'Kumar'} = \\$data{'Kumar'}\\\
  n\";\n```\n\n这将产生以下结果：\n\n```\n$data{'John Paul'} = 45\n$data{'Lisa'} = 30\n$data{'Kumar'}\
  \ = 40\n```\n\n#### 创建哈希\n\n哈希通过以下两种方式之一创建。在第一种方法中，你逐个地为命名键分配值：\n\n```perl\n$data{'John\
  \ Paul'} = 45;\n$data{'Lisa'} = 30;\n$data{'Kumar'} = 40;\n```\n\n在第二种情况下，你使用列表，它通过从列表中提取单独对来转换：对的第一个元素用作键，第二个用作值。例如：\n\
  \n```perl\n%data = ('John Paul', 45, 'Lisa', 30, 'Kumar', 40);\n```\n\n为了清晰起见，你可以使用\
  \ `=>` 作为 `,` 的别名，如下所示键/值对：\n\n```perl\n%data = ('John Paul' => 45, 'Lisa' => 30,\
  \ 'Kumar' => 40);\n```\n\n这是上述形式的另一种变体，看这里，在这里所有的键都以连字符（`-`）开头，且不需要加引号：\n\n```perl\n\
  %data = (-JohnPaul => 45, -Lisa => 30);\n```\n\n（注：提供的原始文本包含大量重复和碎片，此处已根据逻辑进行了清理和翻译，保留了所有核心信息和示例。）\n\
  \n\n\n\n`m//` 的工作方式与 `q//` 运算符系列相同。你可以使用任何自然匹配的字符组合作为表达式的分隔符。例如，`m{}`、`m()` 和 `m><`\
  \ 都是有效的。上面的示例可以重写为：\n\n```perl\n#!/usr/bin/perl\n$bar = \"This is foo and again\
  \ foo\"; if ($bar =~ m[foo]){\n    print \"First time is matching\\n\";\n}else{\n\
  \    print \"First time is not matching\\n\";\n}\n\n$bar = \"foo\";\nif ($bar =~\
  \ m{foo}){\n    print \"Second time is matching\\n\";\n}else{\n    print \"Second\
  \ time is not matching\\n\";\n}\n```\n\n如果分隔符是正斜杠，你可以从 `m//` 中省略 `m`，但对于所有其他分隔符，你必须使用\
  \ `m` 前缀。\n\n注意，整个匹配表达式（即 `=~` 或 `!~` 左侧的表达式加上匹配运算符）在表达式匹配时会返回真（在标量语境下）。因此，下述语句：\n\
  \n```perl\n$true = ($foo =~ m/foo/);\n```\n\n如果 `$foo` 匹配正则，则将 `$true` 设置为 1；如果匹配失败，则为\
  \ 0。在列表语境下，匹配返回任何分组表达式的内容。例如，当从时间字符串中提取小时、分钟和秒时，可以使用：\n\n```perl\nmy ($hours, $minutes,\
  \ $seconds) = ($time =~ m/(\\d+):(\\d+):(\\d+)/);\n```\n\n## 3. 匹配运算符修饰\n\n匹配运算符支持自己的一组修饰。`/g`\
  \ 修饰允许全局匹配。`/i` 修饰将使匹配不区分大小写。以下是修饰的完整列表：\n\n| 修饰 | 描述 |\n| :--- | :--- |\n| `i`\
  \ | 使匹配不区分大小写。 |\n| `m` | 指定如果字符串包含换行符或回车符，`^` 和 `$` 运算符现在将匹配换行边界，而不是字符串边界。 |\n\
  | `o` | 仅评估一次表达式。 |\n| `s` | 允许使用 `.` 匹配换行符。 |\n| `x` | 允许在表达式中使用空白以提高清晰度。 |\n|\
  \ `g` | 全局查找所有匹配项。 |\n| `cg` | 允许在全局匹配失败后继续搜索。 |\n\n### 仅匹配一次\n\n匹配运算符还有一个更简单的版本\
  \ - `?PATTERN?` 运算符。这基本上与 `m//` 运算符相同，不同之处在于它在每次调用重置之前只在搜索的字符串中匹配一次。\n\n例如，你可以使用它来获取列表中的第一个和最后一个元素：\n\
  \n```perl\n#!/usr/bin/perl\n@list = qw/food foosball subeo footnote terfoot canic\
  \ footbrdige/; foreach (@list) {\n    $first = $1 if ?(foo.*)?;\n    $last = $1\
  \ if /(foo.*)/;\n}\nprint \"First: $first, Last: $last\\n\";\n```\n\n执行上述程序时，它会产生以下结果：`First:\
  \ food, Last: footbrdige`。\n\n### 4. 正则表达式变量\n\n正则表达式变量包括 `$&`，它包含整个匹配字符串；`` ` ```，它包含匹配字符串之前的所有内容；以及\
  \ `` `'` ，它包含匹配字符串之后的所有内容。`$` 包含最后一次分组匹配的内容。以下代码演示了结果：\n\n```perl\n#!/usr/bin/perl\n\
  $string = \"The food is in the salad bar\";\n$string =~ m/foo/; print \"Before:\
  \ $`\\n\"; print \"Matched: $&\\n\"; print \"After:  $'\\n\";\n```\n\n执行上述程序时，它会产生以下结果：\n\
  Before: The\nMatched: foo\nAfter: d is in the salad bar\n\n### 5. 替换运算符\n\n替换运算符\
  \ `s///` 实际上是匹配运算符的扩展，允许你将匹配到的文本替换为新文本。该运算符的形式为：`s/PATTERN/REPLACEMENT/`。\n\n`PATTERN`\
  \ 是我们要查找的文本的正则表达式。`REPLACEMENT` 是我们用于替换所找到文本的文本或正则表达式规范。例如，我们可以使用以下正则表达式将所有的 dog\
  \ 替换为 cat：\n\n```perl\n#!/usr/bin/perl\n$string = \"The cat sat on the mat\";\n\
  $string =~ s/cat/dog/;\nprint \"$string\\n\";\n```\n\n执行上述程序时，它产生以下结果：`The dog sat\
  \ on the mat`。\n\n#### 替换运算符修饰\n\n以下是用于替换运算符的所有修饰符列表：\n\n| 修饰 | 描述 |\n| :--- | :---\
  \ |\n| `i` | 使匹配不区分大小写。 |\n| `m` | 指定如果字符串包含换行符或回车符，`^` 和 `$` 运算符现在将匹配换行边界，而不是字符串边界。\
  \ |\n| `o` | 仅评估一次表达式。 |\n| `s` | 允许使用 `.` 匹配换行符。 |\n| `x` | 允许在表达式中使用空白以提高清晰度。\
  \ |\n| `g` | 将找到的所有表达式出现处替换为替换文本。 |\n| `e` | 将替换内容像 Perl 语句一样进行评估，并使用其返回值作为替换文本。\
  \ |\n\n### 6. 翻译运算符\n\n（注：此处原文为 Translation Operator，译为翻译运算符）\n\n你可以使用任何自然匹配的字符组合作为表达式的分隔符。例如，`m{}`、`m()`\
