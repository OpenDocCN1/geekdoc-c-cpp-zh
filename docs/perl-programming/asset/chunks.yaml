    | A continue BLOCK, it is always executed just before the conditional is about
    to be evaluated again. |


    | [redo statement](http://www.tutorialspoint.com/perl/perl_redo_statement.htm)
    | The redo command restarts the loop block without evaluating the conditional
    again. The continue block, if any, is not executed. |


    | [goto statement](http://www.tutorialspoint.com/perl/perl_goto_statement.htm)
    | Perl supports a goto command with three forms: goto label, goto expr, and goto
    &name. |


    3.  The Infinite  Loop


    A loop becomes infinite loop if a condition never becomes false. The for loop
    is traditionally used for this purpose. Since none of the three expressions that
    form the for loop are required, you can make an endless loop by leaving the conditional
    expression empty.  #!/usr/local/bin/perl


    for( ; ; )


    {


    printf "This loop will run forever.\n";


    }


    You can terminate the above infinite loop by pressing the Ctrl + C keys.


    When the conditional expression is absent, it is assumed to be true. You may have
    an initialization and increment expression, but as a programmer more commonly
    use the for (;;) construct to signify an infinite loop.


    Perl conditional statements helps in the decision making, which require that the
    programmer specifies one or more conditions to be evaluated or tested by the program,
    along with a statement or statements to be executed if the condition is determined
    to be true, and optionally, other statements to be executed if the condition is
    determined to be false.


    Following is the general from of a typical decision making structure found in
    most of the programming languages −


    ![](Images/image00475.jpeg)


    The number 0, the strings ''0'' and " " , the empty list () , and undef are all
    false in a boolean context and all other values are true. Negation of a true value
    by ! or not returns a special false value.


    Perl programming language provides the following types of conditional statements.


    | Statement | Description |


    | if statement | An if statement consists of a boolean expression followed by
    one or more statements. |


    | if...else statement | An if statement can be followed by an optional else |


    |  | statement. |


    | if...elsif...else statement | An if statement can be followed by an optional
    elsif statement and then by an optional else statement. |


    | unless statement | An unless statement consists of a boolean expression followed
    by one or more  statements. |


    | unless...else statement | An unless statement can be followed by an optional
    else statement. |


    4.  PERL Scoping of  Variable


    There are two major variable types in Perl. One of them is the package global
    variable declared either with the now obsolete use vars construct or with our.


    The other one is the lexical variable declared with my.


    Let''s see what happens when you declare a variable using my? In which parts of
    the code will that variable be visible? In other words, what is the scope of the  variable?


    Variable scope: enclosing block


    1. #!/usr/bin/perl


    2. use  strict;


    3. use  warnings; 4.


    5\. {


    6. my $email = ''foo@bar.com'';


    7. print  "$email\n";# [foo@bar.com](mailto:foo@bar.com) 8.  }


    9. # print  $email;


    10. # $email does not  exists


    11. # Global symbol "$email" requires explicit package name at  ...


    Inside the anonymous block (the pair of curly braces {}), first we see the declaration
    of a new variable called $email. This variable exists between the point of its
    declaration till the end of the block. Thus the line after the closing curly brace
    } had to be commented out. If you removed the # from the # print $email; line,
    and tried to run the script, you''d get the following compile-time error: Global
    symbol "$email" requires explicit package name at ....


    In other words, the scope of every variable declared with my is the enclosing
    block..


    Variable scope: visible everywhere


    The variable $lname is declared at the beginning of the code. It will be visible
    till the end of the file everywhere. Even inside blocks. Even if those are function
    declarations. If we change the variable inside the block, that will change the
    value for the rest of the code. Even when you leave the block:


    1. #!/usr/bin/perl


    2. use  strict;


    3. use warnings; 4.


    5. my $lname =  "Bar";


    6. print  "$lname\n";# Bar 7.{


    8. print  "$lname\n";# Bar


    9. $lname =  "Other";


    10. print  "$lname\n";# Other


    11\. }


    12.  print "$lname\n";# Other


    Variable hidden by other declaration


    1. #!/usr/bin/perl


    2. use strict;


    3. use  warnings;


    4.


    5. my $fname =  "Foo";


    6. print  "$fname\n";# Foo 7.{


    8. print  "$fname\n";#  Foo


    9. my $fname =  "Other";


    10. print  "$fname\n";#  Other


    11\. }


    12\. print "$fname\n"; # Foo


    In this case the variable $fname is declared at the beginning of the code. As
    written earlier, it will be visible till the end of the file everywhere, except
    in places where they are hidden by locally declared variables with the same name.


    Inside the block we used my to declare another variable with the same name. This
    will effectively hide the $fname declared outside the block till we leave the
    block. At the end of the block (at the closing}), the $fname declared inside will
    be destroyed and the original $fname will be accessible again. This feature is
    especially important as this makes it easy to create variables inside small scopes
    without the need to think about possible use of the same name  outside.


    Same name in multiple blocks


    You can freely use the same variable name in multiple blocks. These variables
    have no connection to each other.


    1. #!/usr/bin/perl


    2. use strict;


    3. use  warnings;


    4.  {


    5. my $name =  "Foo";


    6. print  "$name\n";# Foo 7.  }


    8\. {


    9. my $name =  "Other";


    10. print  "$name\n";# Other


    11\. }


    In-file package declaration


    This a bit more advanced example, but it might be important to mention it here:


    Perl allows us to switch between name-spaces using the package keyword inside
    a file. A package declaration does NOT provide scope. If you declare a variable
    in the implicit main package which is just the regular body of your script, that
    $fname variable will be visible even in other name-spaces in the same  file.


    If you declare a variable called $lname in the ''Other'' name-space, it will be
    visible when later you might switch back to the main name-space. If the package
    Other declaration was in another file, then the variables would have separate
    scope created by the  file.


    1. #!/usr/bin/perl


    2. use strict;


    3. use  warnings;


    4.


    5. my $fname =  "Foo";


    6. print  "$fname\n";# Foo 7.


    8. package  Other;


    9. use strict;


    10. use  warnings;


    11. 11.


    12. print  "$fname\n";#  Foo


    13. my $lname =  ''Bar'';


    14. print  "$lname\n";# Bar 15.


    16.


    17\. package main;


    18.


    19. print  "$fname\n";#  Foo


    20. print  "$lname\n";#  Bar


    5.  Bioperl and its  applications


    BioPerl is a collection of Perl modules that facilitate the development of Perl
    scripts for bioinformatics applications. It has played an integral role in the
    Human Genome Project. BioPerl is an active open source software project supported
    by the Open Bioinformatics Foundation. The'
