    ## 子程序中的私有变量


    默认情况下，Perl 中的所有变量都是全局变量，这意味着它们可以从程序的任何位置访问。但你可以随时使用 `my` 操作符创建名为局部变量的私有变量。


    `my` 操作符将变量限制在代码的特定区域内，在该区域内，它可以被使用和访问。在该区域之外，该变量无法被使用或访问。该区域被称为它的作用域（scope）。局部作用域通常是一个由大括号包围的代码块，例如定义子程序体的大括号，或者标记
    `if`、`while`、`for`、`foreach` 和 `eval` 语句的代码块。


    以下示例了如何使用 `my` 操作符定义单个或多个私有变量 −


    ```perl

    sub somefunc {

    my $variable; # $variable 在 somefunc() 外部不可见

    my ($another, @an_array, %a_hash); # 一次声明多个变量

    }

    ```


    让我们检查以下示例以区分全局变量和私有变量 −


    ```perl

    #!/usr/bin/perl


    # 全局变量

    $string = "Hello, World!";


    # 函数定义 sub PrintHello{

    # PrintHello 函数的私有变量

    my $string;

    $string = "Hello, Perl!";

    print "Inside the function $string\n";

    }


    # 函数调用 PrintHello();

    print "Outside the function $string\n";

    ```


    当执行上述程序时，它产生如下结果 − 函数内部 Hello, Perl! 函数外部 Hello, World!


    ## 通过 local() 使用临时值


    `local` 主要用于变量的当前值必须对调用的子程序可见的情况。`local` 只是为全局（即包）变量提供临时值。这被称为动态作用域。局部作用域通过 `my`
    实现，它的工作方式更类似于 C 语言的自动声明。


    如果给 `local` 传递多个变量或表达式，必须将它们放在括号中。该操作符通过将参数列表中变量的当前值保存到隐藏堆栈中，并在退出代码块、子程序或 `eval`
    时恢复它们。


    让我们检查以下示例以区分全局变量和局部变量 −


    ```perl

    #!/usr/bin/perl


    # 全局变量

    $string = "Hello, World!";


    sub PrintHello{

    # PrintHello 函数的私有变量 local $string;

    $string = "Hello, Perl!"; PrintMe();

    print "Inside the function PrintHello $string\n";

    }


    sub PrintMe{

    print "Inside the function PrintMe $string\n";

    }


    # 函数调用 PrintHello();

    print "Outside the function $string\n";

    ```


    当执行上述程序时，它产生如下结果 − 函数内部 PrintMe Hello, Perl! 函数内部 PrintHello Hello, Perl! 函数外部
    Hello, World!


    ## 通过 state() 使用状态变量


    还有另一种类型的局部变量，它们与私有变量相似，但它们会保持状态，并且在多次调用子程序时不会重新初始化。这些变量使用 `state` 操作符定义，并从 Perl
    5.9.4 开始可用。


    让我们检查以下示例演示状态变量的使用 −


    ```perl

    use feature ''state'';


    sub PrintCount{

    state $count = 0; # 初始值

    print "Value of counter is $count\n";

    $count++;

    }


    for (1..5){ PrintCount();

    }

    ```


    当执行上述程序时，它产生如下结果 − 计数器值为 0 计数器值为 1 计数器值为 2 计数器值为 3 计数器值为 4


    在 Perl 5.10 之前，你必须这样写 −


    ```perl

    #!/usr/bin/perl

    {

    my $count = 0; # 初始值

    sub PrintCount {

    print "Value of counter is $count\n";

    $count++;

    }

    }

    for (1..5){ PrintCount();

    }

    ```


    ## 子程序调用上下文


    子程序或语句的上下文是由期望的返回值类型定义的。这允许你使用单个函数根据用户期望接收的内容来返回不同的值。例如，接下来的 `localtime()` 在标量上下文（scalar
    context）调用时返回字符串，但在列表上下文（list context）调用时返回列表。


    ```perl

    my $datestring = localtime( time );

    ```


    在此示例中，`$timestr` 的值现在是由当前日期和时间组成的字符串，例如 Thu Nov 30 15:21:33 2000。。反地 −


    ```perl

    ($sec,$min,$hour,$mday,$mon, $year,$wday,$yday,$isdst) = localtime(time);

    ```


    现在，各个变量包含了 `localtime()` 子程序返回的相应值。

