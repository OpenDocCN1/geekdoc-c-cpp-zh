    \ 前缀。\n\n注意，整个匹配表达式（即 `=~` 或 `!~` 左侧的表达式加上匹配运算符）在表达式匹配时会返回真（在标量语境下）。因此，下述语句：\n\
    \n```perl\n$true = ($foo =~ m/foo/);\n```\n\n如果 `$foo` 匹配正则，则将 `$true` 设置为 1；如果匹配失败，则为\
    \ 0。在列表语境下，匹配返回任何分组表达式的内容。例如，当从时间字符串中提取小时、分钟和秒时，可以使用：\n\n```perl\nmy ($hours,\
    \ $minutes, $seconds) = ($time =~ m/(\\d+):(\\d+):(\\d+)/);\n```\n\n### 8. 更复杂的正则表达式\n\
    \n你并不一定要匹配固定字符串。事实上，你可以通过更复杂的表达式匹配任何你想象到的内容。这里有一个快速表列了 Python 中使用的正则表达式语法：\n\n\
