    ## 7. 通用网关接口(CGI) - 简介与应用


    通用网关接口（CGI）是 Web 服务器将 Web 用户请求传递给应用程序并接收返回数据以转发给用户标准方法。当用户请求 Web 页面（例如，通过点击高亮单词或输入网站地址）时，服务器返回请求的页面。然而，当用户在
    Web 页面上填写表单并提交时，通常需要由应用程序处理。Web 服务器通常会将表单信息传递给一个处理数据的小应用程序，并可能会返回确认消息。这种在服务器和应用程序之间传递数据的方法或约定被称为通用网关接口（CGI）。它是
    Web 超文本传输协议（HTTP）的一部分。


    如果你正在创建一个网站并希望让 CGI 应用程序进行控制，你可以在 HTML 文件中编写的统一资源定位符（URL）中指定应用程序名称。如果你正在创建一个表单，此
    URL 可以作为 `FORMS` 标签的一部分。例如，你可能会编写：


    ![](img/image00428.jpeg)

    ```html

    <FORM METHOD=POST ACTION=http://www.mybiz.com/cgi-bin/formprog.pl>

    ```


    "mybiz.com" 上的服务器会将控制权交给名为 `formprog.pl` 的 CGI 应用程序，以记录输入的数据并返回确认消息。（`.pl` 表示用
    PERL 编写的程序，但也可以使用其他语言。）


    通用网关接口提供了一种一致的方法，使数据从用户请求传递到应用程序并返回用户。这意味着编写应用程序的人可以确保无论服务器使用何种操作系统（PC、Macintosh、UNIX、OS/390
    或其他），它都能被使用。这仅仅是信息从 Web 服务器关于你的请求传递到应用程序并再次返回的一种基本方法。


    CGI 的重要性在于，它的灵活性使其成为从 Web 服务器运行可执行文件的标准。该标准允许在网站上以无无尽的方式实现真正的交互性。


    ![](img/image00428.jpeg)

    ![](img/image00433.jpeg)![](img/image00434.jpeg)


    # CGI 的局限性与问题


    ### 问题：

    Images/image00428.jpeg


    性能：每当用户请求时，服务器都必须启动 CGI 程序。当程序是用解释型语言（如 Perl）编写时，服务器仍然需要进行解释或编译，这需要更多时间。如果命令被频繁调用，产生的工作量可能会使服务器崩溃。


    ### CGI 的优势与应用：

    - **平台独立性**：大多数 Web 服务器支持 CGI，包括 Unix、Windows NT 和 Macintosh。

    - **语言独立性**：Perl、C、C++、Visual Basic、Java。

    - **可扩展性**：CGI 的简单性使其具有极的可扩展性。


    一个 CGI 程序的示例是 Wiki。用户代理请求名称；服务器执行 CGI；CGI 程序检索条目的源码（如果存在），将其转换为 HTML 并传输给用户。如果点击“编辑此页面”链接，CGI
    将内容填充到 HTML 区域或其他控件，并在用户提交时将其保存回服务器。


