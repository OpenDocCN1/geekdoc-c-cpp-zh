- fmt: "\nThe `m//` actually works in the same fashion as the `q//` operator series.\
    \ you can use any combination of naturally matching characters to act as delimiters\
    \ for the expression. For example, `m{}`, `m()`, and `m><` are all valid. So above\
    \ example can be re-written as follows:\n\n```perl\n#!/usr/bin/perl\n$bar = \"\
    This is foo and again foo\"; if ($bar =~ m[foo]){\n    print \"First time is matching\\\
    n\";\n}else{\n    print \"First time is not matching\\n\";\n}\n\n$bar = \"foo\"\
    ;\nif ($bar =~ m{foo}){\n    print \"Second time is matching\\n\";\n}else{\n \
    \   print \"Second time is not matching\\n\";\n}\n```\n\nYou can omit `m` from\
    \ `m//` if the delimiters are forward slashes, but for all other delimiters you\
    \ must use the `m` prefix.\n\nNote that the entire match expression that is the\
    \ expression on the left of `=~` or `!~` and the match operator, returns true\
    \ (in a scalar context) if the expression matches. Therefore the statement:\n\n\
    ```perl\n$true = ($foo =~ m/foo/);\n```\n\nwill set `$true` to 1 if `$foo` matches\
    \ the regex, or 0 if the match fails. In a list context, the match returns the\
    \ contents of any grouped expressions. For example, when extracting the hours,\
    \ minutes, and seconds from a time string, we can use:\n\n```perl\nmy ($hours,\
    \ $minutes, $seconds) = ($time =~ m/(\\d+):(\\d+):(\\d+)/);\n```\n\n### 3. Match\
    \ Operator Modifiers\n\nThe match operator supports its own set of modifiers.\
    \ The `/g` modifier allows for global matching. The `/i` modifier will make the\
    \ match case insensitive. Here is the complete list of modifiers:\n\n| Modifier\
    \ | Description |\n| :--- | :--- |\n| `i` | Makes the match case insensitive.\
    \ |\n| `m` | Specifies that if the string has newline or carriage return characters,\
    \ the `^` and `$` operators will now match against a newline boundary, instead\
    \ of a string boundary. |\n| `o` | Evaluates the expression only once. |\n| `s`\
    \ | Allows use of `.` to match a newline character. |\n| `x` | Allows you to use\
    \ white space in the expression for clarity. |\n| `g` | Globally finds all matches.\
    \ |\n| `cg` | Allows the search to continue even after a global match fails. |\n\
    \n#### Matching Only Once\n\nThere is also a simpler version of the match operator\
    \ - the `?PATTERN?` operator. This is basically identical to the `m//` operator\
    \ except that it only matches once within the string you are searching between\
    \ each call to reset.\n\nFor example, you can use this to get the first and last\
    \ elements within a list:\n\n```perl\n#!/usr/bin/perl\n@list = qw/food foosball\
    \ subeo footnote terfoot canic footbrdige/; foreach (@list) {\n    $first = $1\
    \ if ?(foo.*)?;\n    $last = $1 if /(foo.*)/;\n}\nprint \"First: $first, Last:\
    \ $last\\n\";\n```\n\nWhen above program is executed, it produces the following\
    \ result: `First: food, Last: footbrdige`.\n\n### 4. Regular Expression Variables\n\
    \nRegular expression variables include `$&`, which contains the entire matched\
    \ string; `` ``` `, which contains everything before the matched string; and `'$`,\
    \ which contains everything after the matched string. `$` contains whatever the\
    \ last grouping match matched. Following code demonstrates the result:\n\n```perl\n\
    #!/usr/bin/perl\n$string = \"The food is in the salad bar\";\n$string =~ m/foo/;\
    \ print \"Before: $`\\n\"; print \"Matched: $&\\n\"; print \"After:  $'\\n\";\n\
    ```\n\nWhen above program is executed, it produces the following result:\nBefore:\
    \ The\nMatched: foo\nAfter: d is in the salad bar\n\n### 5. The Substitution Operator\n\
    \nThe substitution operator, `s///`, is really just an extension of the match\
    \ operator that allows you to replace the text matched with some new text. The\
    \ basic form of the operator is: `s/PATTERN/REPLACEMENT/`.\n\nThe `PATTERN` is\
    \ the regular expression for the text that we are looking for. The `REPLACEMENT`\
    \ is a specification for the text or regular expression that we want to use to\
    \ replace the found text with. For example, we can replace all occurrences of\
    \ dog with cat using the following regular expression:\n\n```perl\n#!/usr/bin/perl\n\
    $string = \"The cat sat on the mat\";\n$string =~ s/cat/dog/;\nprint \"$string\\\
    n\";\n```\n\nWhen above program is executed, it produces the following result:\
    \ `The dog sat on the mat`.\n\n#### Substitution Operator Modifiers\n\nHere is\
    \ the list of all modifiers used with substitution operator:\n\n| Modifier | Description\
    \ |\n| :--- | :--- |\n| `i` | Makes the match case insensitive. |\n| `m` | Specifies\
    \ that if the string has newline or carriage return characters, the `^` and `$`\
    \ operators will now match against a newline boundary, instead of a string boundary.\
    \ |\n| `o` | Evaluates the expression only once. |\n| `s` | Allows use of `.`\
    \ to match a newline character. |\n| `x` | Allows you to use white space in the\
    \ expression for clarity. |\n| `g` | Replaces all occurrences of the found expression\
    \ with the replacement text. |\n| `e` | Evaluates the replacement as if it were\
    \ a Perl statement, and uses its return value as the replacement text. |\n\n###\
    \ 6. The Translation Operator\n\nTranslation is similar, but not identical, to\
    \ the principles of substitution, but unlike substitution, translation (or transliteration)\
    \ does not use regular expressions for its search on replacement values. The translation\
    \ operators are: `tr/SEARCHLIST/REPLACEMENTLIST/` and `y/SEARCHLIST/REPLACEMENTLIST/`.\n\
    \nThe translation replaces all occurrences of the characters in `SEARCHLIST` with\
    \ the corresponding characters in `REPLACEMENTLIST`. For example, using the \"\
    The cat sat on the mat.\" string we have been using in this chapter:\n\n```perl\n\
    #!/usr/bin/perl\n$string = 'The cat sat on the mat.';\n$string =~ tr/a-z/A-Z/;\n\
    ```\n\nWhen above program is executed, it produces the following result: THE CAT\
    \ SAT ON THE MAT.\n\n### 7. Translation Operator Modifiers\n\nFollowing is the\
    \ list of operators related to translation:\n\n| Modifier | Description |\n| :---\
    \ | :--- |\n| `c` | Complements `SEARCHLIST`. |\n| `d` | Deletes found but unreplaced.\
    \ |\n| `s` | Squashes duplicate replaced. |\n\nThe `/d` modifier deletes characters\
    \ matching `SEARCHLIST`. For example:\n\n```perl\n#!/usr/bin/perl\n$string = 'food';\n\
    $string =~ tr/a-z/b/d;\nprint \"$string\\n\";\n```\n\nWhen above program is executed,\
    \ it produces the following result: `od`.\n\n### 8. More Complex Regular Expressions\n\
    \nYou don't just have to match on fixed strings. In fact, you can match on just\
    \ anything you could dream of by using more complex expressions. Here's a quick\
    \ cheat sheet following table lists the regular expression syntax that is available\
    \ in Python:\n\n| Pattern | Description |\n| :--- | :--- |\n| `^` | Matches beginning\
    \ of line. |\n| `$` | Matches end of line. |\n| `.` | Matches any single character\
    \ except newline. Using `m` option allows it to match newline as well. |\n| `[...]`\
    \ | Matches any single character in brackets. |\n| `[^...]` | Matches any single\
    \ character not in brackets. |\n| `*` | Matches 0 or more occurrences of preceding\
    \ expression. |\n| `+` | Matches 1 or more occurrence of preceding expression.\
    \ |\n| `?` | Matches 0 or 1 occurrence of preceding expression. |\n| `{n}` | Matches\
    \ exactly n number of occurrences of preceding expression. |\n| `{n,}` | Matches\
    \ n or more occurrences of preceding expression. |\n| `{n, m}` | Matches at least\
    \ n and at most m occurrences of preceding expression. |\n| `a\\|b` | Matches\
    \ either a or b. |\n| `\\w` | Matches word characters. |\n| `\\W` | Matches nonword\
    \ characters. |\n| `\\s` | Matches whitespace. Equivalent to `[\\t\\n\\r\\f]`.\
    \ |\n| `\\S` | Matches nonwhitespace. |\n| `\\d` | Matches digits. Equivalent\
    \ to `[0-9]`. |\n| `\\D` | Matches nondigits. |\n| `\\A` | Matches beginning of\
    \ string. |\n| `\\Z` | Matches end of string. If a newline exists, it matches\
    \ just before newline. |\n| `\\z` | Matches end of string. |\n| `\\G` | Matches\
    \ point where last match finished. |\n"
