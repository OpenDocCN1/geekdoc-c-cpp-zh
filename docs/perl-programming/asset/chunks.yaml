    The `^` metacharacter matches the beginning of the string and the `$` metasymbol\
    \ matches the end of the string. Here are some brief examples.\n\n### nothing\
    \ in the string (start and end are adjacent)\n```perl\n^$/\n```\n\n### a three\
    \ digits, each followed by a whitespace # character (eg \"3 4 5 \")\n```perl\n\
    /(\\d\\s){3}/\n```\n\n### matches a string in which every odd-numbered letter\
    \ is a (eg \"abacadaf\")\n```perl\n/(a.)+/\n```\n\n### string starts with one\
    \ or more digits\n```perl\n/^\\d+/\n```\n\n### string that ends with one or more\
    \ digits\n```perl\n/\\d+$/\n```\n\nLets have a look at another example. `#!/usr/bin/perl`\n\
    \n```perl\n$string = \"Cats go Catatonic\\nWhen given Catnip\"; ($start) = ($string\
    \ =~ /\\A(.*?)  /);\n@lines = $string =~ /^(.*?)  /gm;\nprint \"First word: $start\\\
    n\",\"Line starts: @lines\\n\";\n```\n\nWhen above program is executed, it produces\
    \ the following result − First word: Cats\nLine starts: Cats When\n\n## 9. Matching\
    \ Boundaries\n\nThe `\\b` matches at any word boundary, as defined by the difference\
    \ between the `\\w` class and the `\\W` class. Because `\\w` includes the characters\
    \ for a word, and `\\W` the opposite, this normally means the termination of a\
    \ word. The `\\B` assertion matches any position that is not a word boundary.\
    \ For example −\n\n```perl\n/\\bcat\\b/ # Matches 'the cat sat' but not 'cat on\
    \ the mat'\n/\\Bcat\\B/ # Matches 'verification' but not 'the cat on the mat'\n\
    /\\bcat\\B/ # Matches 'catatonic' but not  'polecat'\n/\\Bcat\\b/ # Matches 'polecat'\
    \ but not  'catatonic'\n```\n\n### Selecting Alternatives\n\nThe `|` character\
    \ is just like the standard or or bitwise OR within Perl. It specifies alternate\
    \ matches within a regular expression or group. For example, to match \"cat\"\
    \ or \"dog\" in an expression, you might use this −\n\n```perl\nif ($string =~\
    \ /cat|dog/)\n```\n\nYou can group individual elements of an expression together\
    \ in order to support complex matches. Searching for two peoples names could be\
    \ achieved with two separate tests, like this −\n\n```perl\nif (($string =~ /Martin\
    \ Brown/) || ($string =~ /Sharon  Brown/))\n```\n\nThis could be written as follows\n\
    \n```perl\nif ($string =~ /(Martin|Sharon) Brown/)\n```\n\n### Grouping Matching\n\
    \nFrom a regular-expression point of view, there is no difference between except,\
    \ perhaps, that the former is slightly clearer.\n\n```perl\n$string =~ /(\\S+)\\\
    s+(\\S+)/;\nand\n$string =~ /\\S+\\s+\\S+/;\n```\n\nHowever, the benefit of grouping\
    \ is that it allows us to extract a sequence from a regular expression. Groupings\
    \ are returned as a list in the order in which they appear in the original. For\
    \ example, in the following fragment we have pulled out the hours, minutes, and\
    \ seconds from a string.\n\n```perl\nmy ($hours, $minutes, $seconds) = ($time\
    \ =~ m/(\\d+):(\\d+):(\\d+)/);\n```\n\nAs well as this direct method, matched\
    \ groups are also available within the special `$x` variables, where `x` is the\
    \ number of the group within the regular expression. We could therefore rewrite\
    \ the preceding example as follows −\n\n```perl\n#!/usr/bin/perl\n$time = \"12:05:30\"\
    ;\n$time =~ m/(\\d+):(\\d+):(\\d+)/;\nmy ($hours, $minutes, $seconds) = ($1, $2,\
    \ $3);\nprint \"Hours : $hours, Minutes: $minutes, Second: $seconds\\n\";\n```\n\
    When above program is executed, it produces the following result − Hours : 12,\
    \ Minutes: 05, Second: 30\n\nWhen groups are used in substitution expressions,\
    \ the `$x` syntax can be used in the replacement text. Thus, we could reformat\
