- fmt: '

    The option name as specified to the `GetOptions()` function is called the option
    specification. Later we''ll see that this specification can contain more than
    just the option name. The reference to the variable is called the option destination.


    `GetOptions()` will return a true value if the command line could be processed
    successfully. Otherwise, it will write error messages using `die()` and `warn()`,
    and return a false result.


    ## A little bit less simple options


    `Getopt::Long` supports two useful variants of simple options: negatable options
    and incremental options.


    A negatable option is specified with an exclamation mark `!` after the option
    name:


    1. `my $verbose  =  '''';# option variable with default value (false)`

    2. `GetOptions (''verbose!'' => \$verbose);`


    Now, using `--verbose` on the command line will enable `$verbose`, as expected.
    But it is also allowed to use `--noverbose`, which will disable `$verbose` by
    setting its value to `0`. Using a suitable default value, the program can find
    out whether `$verbose` is false by default, or disabled by using `--noverbose`.


    An incremental option is specified with a plus `+` after the option name:


    1. `my $verbose  =  '''';# option variable with default value (false)`

    2. `GetOptions (''verbose+'' => \$verbose);`


    Using `--verbose` on the command line will increment the value of `$verbose`.
    This way the program can keep track of how many times the option occurred on the
    command line. For example, each occurrence of `--verbose` could increase the verbosity
    level of the program.


    ## Mixing command line option with other arguments


    Usually programs take command line options as well as other arguments, for example,
    file names. It is good practice to always specify the options first, and the other
    arguments last.


    `Getopt::Long` will, however, allow the options and arguments to be mixed and
    ''filter out'' all the options before passing the rest of the arguments to the
    program. To stop `Getopt::Long` from processing further arguments, insert a double
    dash `--` on the command line:


    1. `--size  24-------------all`


    In this example, `--all` will not be treated as an option, but passed to the program
    unharmed, in `@ARGV`.


    ## Options with values


    For options that take values it must be specified whether the option value is
    required or not, and what kind of value the option expects.


    Three kinds of values are supported: integer numbers, floating point numbers,
    and strings.


    If the option value is required, `Getopt::Long` will take the command line argument
    that follows the option and assign this to the option variable. If, however, the
    option value is specified as optional, this will only be done if that value does
    not look like a valid command line option itself.


    1. `my $tag  =  '''';# option variable with default value`

    2. `GetOptions (''tag=s'' => \$tag);`


    In the option specification, the option name is followed by an equals sign `=`
    and the letter `s`. The equals sign indicates that this option requires a value.
    The letter `s` indicates that this value is an arbitrary string. Other possible
    value types are `i` for integer values, and `f` for floating point values. Using
    a colon `:` instead of the equals sign indicates that the option value is optional.
    In this case, if no suitable value is supplied, string valued options get an empty
    string `''''` assigned, while numeric options are set to `0`.


    ## Options with multiple values


    Options sometimes take several values. For example, a program could use multiple
    directories to search for library files:


    `--library lib/stdlib --library lib/extlib`


    To accomplish this behaviour, simply specify an array reference as the destination
    for the option:


    ```

    GetOptions ("library=s" => \@libfiles);

    ```


    Alternatively, you can specify that the option can have multiple values by adding
    a `"@"`, and pass a scalar reference as the destination:


    ```

    GetOptions ("library=s@" => \$libfiles);

    ```


    Used with the example above, `@libfiles` (or `@$libfiles`) would contain two strings
    upon completion: `"lib/stdlib"` and `"lib/extlib"`, in that order. It is also
    possible to specify that only integer or floating point numbers are acceptable
    values.


    Often it is useful to allow comma-separated lists of values as well as multiple
    occurrences of the options. This is easy using Perl''s `split()` and `join()`
    operators:


    ```perl

    GetOptions ("library=s" => \@libfiles); @libfiles = split(/,/,join('','',@libfiles));

    ```


    Of course, it is important to choose the right separator string for each purpose.
    Warning: What follows is an experimental feature.


    Options can take multiple values at once, for example:


    `--coordinates 52.2 16.4 --rgbcolor 255 255 149`


    This can be accomplished by adding a repeat specifier to the option specification.
    Repeat specifiers are very similar to the `{...}` repeat specifiers that can be
    used with regular expression patterns. For example, the above command line would
    be handled as follows:


    ```

    GetOptions(''coordinates=f{2}'' => \@coor, ''rgbcolor=i{3}'' => \@color);

    ```


    The destination for the option must be an array or array reference.


    It is also possible to specify the minimal and maximal number of arguments an
    option takes. `foo=s{2,4}` indicates an option that takes at least two and at
    most 4 arguments. `foo=s{1,}` indicates one or more values; `foo:s{,}}` indicates
    zero or more option values.


    ## Options with hash values


    If the option destination is a reference to a hash, the option will take, as value,
    strings of the form `key= value`. The value will be stored with the specified
    key in the hash.


    ```

    GetOptions ("define=s" => \%defines);

    ```

    Alternatively you can use:


    ```

    GetOptions ("define=s%" => \$defines);

    ```

    When used with command line options:


    `--define os=linux --define vendor=redhat`


    the hash `%defines` (or `$defines`) will contain two keys, `"os"` with value `"linux"`
    and `"vendor"` with value `"redhat"`. It is also possible to specify that only
    integer or floating point numbers are acceptable values. The keys are always taken
    to be strings.


    ## User-defined subroutines to handle options


    Ultimate control over what should be done when (actually: each time) an option
    is encountered can be achieved by designating a reference to a subroutine (or
    anonymous subroutine) as the option destination. When `GetOptions()` encounters
    the option, it will call the subroutine with two or three arguments. The first
    argument is the name of the option (Actually, it is an object that stringifies
    to the option name.) For a scalar or array destination, the second argument is
    the value to be stored. For a hash destination, the second argument is the key
    to the hash, and the third argument the value to be stored. It is up to the subroutine
    to store the value, or do whatever it thinks is appropriate.


    A trivial application of this mechanism is to implement options that are related
    to each other. For example:


    1. `my $verbose  =  '';# option variable with default value (false)`

    2. `GetOptions (''verbose'' => \$verbose,`

    3. `''quiet'' => sub { $verbose = 0 });`


    Here `--verbose` and `--quiet` control the same variable `$verbose`, but with
    opposite values.


    If the subroutine needs to signal an error, it should call `die()` with the desired
    error message as its argument. `GetOptions()` will catch the `die()`, issue the
    error message, and record that an error result must be returned upon completion.


    If the text of the error message starts with an exclamation mark `!` it is interpreted
    specially by `GetOptions()`. There is currently one special command implemented:
    `die("!FINISH")` will cause `GetOptions()` to stop processing options, as if it
    encountered a double dash `--`.


    In version 2.37 the first argument to the callback function was changed from string
    to object. This was done to make room for extensions and more detailed control.
    The object stringifies to the option name so this change should not introduce
    compatibility problems.


    Here is an example of how to access the option name and value from within a subroutine:


    ```perl

    1. GetOptions (''opt=i'' => \&handler);

    2. sub handler {

    3. my ($opt_name, $opt_value) = @_;

    }

    ```

    '
