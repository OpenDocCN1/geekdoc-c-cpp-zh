    3. `''quiet'' => sub { $verbose = 0 });`


    这里 `--verbose` 和 `--quiet` 控制同一个变量 `$verbose`，但值相反。


    如果子函数需要发出错误，它应该调用 `die()` 并并将所需的错误消息作为参数。`GetOptions()` 将捕获 `die()`，发布错误消息，并记录完成后必须返回错误结果。


