- fmt: "\nThe libwww-perl request object has the class name `HTTP::Request`. The fact\
    \ that the class name uses `HTTP::` as a prefix only implies that we use the HTTP\
    \ model of communication. It does not limit the kind of services we can try to\
    \ pass this request to. For instance, we will send `HTTP::Requests` both to `ftp`\
    \ and `gopher` servers, as well as to the local file system.\n\nThe main attributes\
    \ of the request objects are:\n\n* `method` is a short string that tells what\
    \ kind of request this is. The most common methods are `GET`, `PUT`, `POST` and\
    \ `HEAD`.\n* `uri` is a string denoting the protocol, server and the name of the\
    \ \"document\" we want to access. The `uri` might also encode various other parameters.\n\
    * `headers` contains additional information about the request and can also used\
    \ to describe the content. The `headers` are a set of keyword/value pairs.\n*\
    \ `content` is an arbitrary amount of data.\n\n## The Response Object\n\nThe libwww-perl\
    \ response object has the class name `HTTP::Response`. The main attributes of\
    \ objects of this class are:\n\n* `code` is a numerical value that indicates the\
    \ overall outcome of the request.\n* `message` is a short, human readable string\
    \ that corresponds to the `code`.\n* `headers` contains additional information\
    \ about the response and describe the content.\n* `content` is an arbitrary amount\
    \ of data.\n\nSince we don't want to handle all possible code values directly\
    \ in our programs, a libwww-perl response object has methods that can be used\
    \ to query what kind of response this is. The most commonly used response classification\
    \ methods are:\n\n```\nis_success()\n```\nThe request was successfully received,\
    \ understood or accepted.\n\n```\nis_error()\n```\nThe request failed. The server\
    \ or the resource might not be available, access to the resource might be denied\
    \ or other things might have failed for some reason.\n\n## The User Agent\n\n\
    Let us assume that we have created a request object. What do we actually do with\
    \ it in order to receive a response?\n\nThe answer is that you pass it to a user\
    \ agent object and this object takes care of all the things that need to be done\
    \ (like low-level communication and error handling) and returns a response object.\
    \ The user agent represents your application on the network and provides you with\
    \ an interface that can accept requests and return responses.\n\nThe user agent\
    \ is an interface layer between your application code and the network. Through\
    \ this interface you are able to access the various servers on the network.\n\n\
    The class name for the user agent is `LWP::UserAgent`. Every libwww-perl application\
    \ that wants to communicate should create at least one object of this class. The\
    \ main method provided by this object is `request()`. This method takes an `HTTP::Request`\
    \ object as argument and (eventually) returns a `HTTP::Response` object.\n\nThe\
    \ user agent has many other attributes that let you configure how it will interact\
    \ with the network and with your application.\n\n* `timeout` specifies how much\
    \ time we give remote servers to respond before the library disconnects and creates\
    \ an internal timeout response.\n* `agent` specifies the name that your application\
    \ uses when it presents itself on the network.\n* `from` can be set to the e-mail\
    \ address of the person responsible for running the application. If this is set,\
    \ then the address will be sent to the servers with every request.\n* `parse_head`\
    \ specifies whether we should initialize response headers from the `<head>` section\
    \ of HTML documents.\n* `proxyandno_proxyspecify if and when to go through a proxy\
    \ server.`\n* `credentials` provides a way to set up user names and passwords\
    \ needed to access certain services.\n\nMany applications want even more control\
    \ over how they interact with the network and they get this by sub-classing `LWP::UserAgent`.\
    \ The library includes a sub-class, `LWP::RobotUA`, for robot applications.\n\n\
    ## 3. Files – operating files – file modes – file test operators\n\n* `-X FILEHANDLE`\n\
    * `-X EXPR`\n* `-X DIRHANDLE`\n* `-X`\n\nA file test, where `X` is one of the\
    \ letters listed below. This unary operator takes one argument, either a filename,\
    \ a filehandle, or a dirhandle, and tests the associated file to see if something\
    \ is true about it. If the argument is omitted, tests `$_`, except for `-t`, which\
    \ tests `STDIN`. Unless otherwise documented, it returns `1` for true and `''`\
    \ for false. If the file doesn't exist or can't be examined, it returns `undef`\
    \ and sets `$!`. Despite the funny names, precedence is the same as any other\
    \ named unary operator. The operator may be any of:\n\n1. `-r` File is readable\
    \ by effective `uid/gid`.\n2. `-w` File is writable by effective `uid/gid`.\n\
    3. `-x` File is executable by effective `uid/gid`.\n4. `-o` File is owned by effective\
    \ `uid`.\n5. `-R` File is readable by real `uid/gid`.\n6. `-W` File is writable\
    \ by real `uid/gid`.\n7. `-X` File is executable by real `uid/gid`.\n8. `-O` File\
    \ is owned by real `uid`.\n9. `-e` File exists.\n10. `-z` File has zero size.\n\
    11. `-f` File is a plain file.\n12. `-d` File is a directory.\n13. `-l` File is\
    \ a symlink.\n14. `-p` File is a named pipe (FIFO).\n15. `-S` File is a socket.\n\
    16. `-b` File is a block special file.\n17. `-c` File is a character special file.\n\
    18. `-t` Filehandle is opened to a tty.\n19. `-u` File has setuid bit.\n20. `-g`\
    \ File has setgid bit.\n21. `-k` File has sticky bit set.\n22. `-T` File is a\
    \ \"binary\" file (opposite of `-B`).\n23. `-M` Script start time minus file modification\
    \ time, in days.\n24. `-A` Same access time (Unix, may differ for other platforms).\n\
    25. `-C` Same inode change time.\n\nExample:\n\n```\nwhile (<>) {\n    chomp($_);\n\
    \    next unless -f $_; # ignore specials\n    ...\n}\n```\n\nNote that `-s/a/b/`\
    \ does not do a negated substitution. Saying `-exp($foo)` still works as expected,\
    \ however: only single letters following a minus are interpreted as file tests.\n\
    \nThese operators are exempt from the \"looks like a function rule\" described\
    \ above. That is, an opening parenthesis after the operator does not affect how\
    \ much of the following code constitutes the argument. Put the opening parentheses\
    \ before the operator to separate it from code that follows (this applies only\
    \ to operators with higher precedence than unary operators, of course):\n\n```\n\
    -s($file) + 1024 # probably wrong; same as -s($file + 1024)\n(-s $file) + 1024\
    \ # correct\n```\n"
