  trans: "\n\n| [continue 语句](http://www.tutorialspoint.com/perl/perl_continue_statement.htm)\
    \ | 一个 `continue` 块，它在条件准备再次评估之前总是会被执行。 |\n| [redo 语句](http://www.tutorialspoint.com/perl/perl_redo_statement.htm)\
    \ | `redo` 命令会重启循环块，而不再次评估条件。如果存在 `continue` 块，它将不会被执行。 |\n| [goto 语句](http://www.tutorialspoint.com/perl/perl_goto_statement.htm)\
    \ | Perl 支持三种形式的 `goto` 命令：`goto label`、`goto expr` 和 `goto &name`。 |\n\n## 3.\
    \ 无限循环\n\n如果一个条件永远不变为假，循环就会变成无限循环。`for` 循环传统上用于此目的。由于构成 `for` 循环的三个表达式中没有任何是必须的，你可以通过留空条件表达式来创建一个无限循环。\n\
    \n```perl\n#!/usr/local/bin/perl\nfor( ; ; )\n{\n    printf \"This loop will run\
    \ forever.\\n\";\n}\n```\n\n你可以通过按下 `Ctrl + C` 键来终止上面的无限循环。\n\n当条件表达式不存在时，假设它为真。你可以有一个初始化表达式和增加表达式，但程序员更经常使用\
    \ `for (;;)` 结构来表示无限循环。\n\nPerl 条件语句有助于决策制定，这要求程序员指定一个或多个需要由程序评估或测试的条件，以及当条件被确定为真时执行的语句或多个语句，可选地，当条件被确定为假时执行的其他语句。\n\
    \n以下是大多数编程语言中常见的典型决策结构的一般形式 ——\n\n![](img/image00475.jpeg)\n\n数字 `0`、字符串 `'0'`\
    \ 和 `\" \"`、空列表 `()` 以及 `undef` 在布尔上下文中均为假值，而所有其他值均为真值。通过 `!` 或 `not` 对真值进行取反会返回一个特殊的假值。\n\
    \nPerl 编程语言提供了以下类型的条件语句。\n\n| 语句 | 说明 |\n| :--- | :--- |\n| `if` 语句 | `if` 语句由一个布尔表达式后跟一个或多个语句组成。\
    \ |\n| `if...else` 语句 | `if` 语句可以跟随一个可选的 `else` 语句。 |\n| `if...elsif...else` 语句\
    \ | `if` 语句可以跟随一个可选的 `elsif` 语句，然后是一个一个可选的 `else` 语句。 |\n| `unless` 语句 | `unless`\
    \ 语句由一个布尔表达式后跟一个或多个语句组成。 |\n| `unless...else` 语句 | `unless` 语句可以跟随一个可选的 `else`\
    \ 语句。 |\n\n## 4. Perl 变量的作用域\n\nPerl 中有两种主要的变量类型。其中一种是使用已过时的 `use vars` 结构或 `our`\
    \ 声明的包全局变量。\n\n另一个是使用 `my` 声明的词法变量。\n\n让我们看看当使用 `my` 声明变量会发生什么？该变量在代码的哪些部分可见？换句话说，变量的作用范围是什么？\n\
    \n### 变量作用域：闭包块\n\n```perl\n#!/usr/bin/perl\nuse strict;\nuse warnings;\n{\n \
    \   my $email = 'foo@bar.com';\n    print \"$email\\n\"; # [foo@bar.com]\n}\n\
    # print $email;\n# $email 不存在\n# Global symbol \"$email\" requires explicit package\
    \ name at ...\n```\n\n在匿名块（一对大括号 `{}`）内部，我们首先看到名为 `$email` 的新变量的声明。该变量从其声明点一直到块的结束都存在。因此，右大括号\
    \ `}` 之后的行必须被注释掉。如果你删除了 `# print $email;` 语句中的 `#` 并尝试运行脚本，你将得到以下编译时错误：Global\
    \ symbol \"$email\" requires explicit package name at ....\n\n换句话说，每个用 `my` 声明的变量的作用域都是其所属的闭包块。\n\
    \n### 变量作用域：随处可见\n\n变量 `$lname` 在代码开头声明。它在文件结束前的处处都是的。即使在块内部也是如此。即使这些是函数声明。如果我们在块内部更改变量，这将更改代码其余部分的值。即使当你离开块也是如此：\n\
    \n```perl\n#!/usr/bin/perl\nuse strict;\nuse warnings;\nmy $lname = \"Bar\";\n\
    print \"$lname\\n\"; # Bar\n{\n    print \"$lname\\n\"; # Bar\n    $lname = \"\
    Other\";\n    print \"$lname\\n\"; # Other\n}\nprint \"$lname\\n\"; # Other\n\
    ```\n\n### 变量被其他声明隐藏\n\n```perl\n#!/usr/bin/perl\nuse strict;\nuse warnings;\n\
    my $fname = \"Foo\";\nprint \"$fname\\n\"; # Foo\n{\n    print \"$fname\\n\";\
    \ # Foo\n    my $fname = \"Other\";\n    print \"$fname\\n\"; # Other\n}\nprint\
    \ \"$fname\\n\"; # Foo\n```\n\n在这种情况下，变量 `$fname` 在代码开头声明。如前所述，它在文件结束前的处处都是的，但在那些被同名局部声明变量隐藏的地方除外。在块内部，我们使用\
    \ `my` 声明了另一个同名变量。这有效地隐藏了块外部声明的 `$fname` 直到我们离开块。在块结束 `}` 处，内部声明的 `$fname` 将被销毁，原始\
    \ `$fname` 将再次可访问。多个块中的同名：你可以自由地在多个块中使用相同的变量名。这些变量之间没有联系。\n\n```perl\n#!/usr/bin/perl\n\
    use strict;\nuse warnings;\n{\n    my $name = \"Foo\";\n    print \"$name\\n\"\
    ; # Foo\n}\n{\n    my $name = \"Other\";\n    print \"$name\\n\"; # Other\n}\n\
    ```\n\n### 文件内包声明\n\n这是一个稍微高级的示例，但在这里提到它可能是重要的：\n\nPerl 允许我们使用文件内的 `package` 关键字在命名空间切换。包声明并不提供作用域。如果你在隐式主包（即你的脚本的主体）中声明一个变量，那么该\
    \ `$fname` 变量即使在同一个文件的其他命名空间中也是可见的。如果你在 `Other` 命名空间中声明一个名为 `$lname` 的变量，当你稍后切换回主命名空间时，它将是可见的。如果\
    \ `Other` 包的声明在另一个文件中，那么变量将拥有文件创建的独立作用域。\n\n```perl\n#!/usr/bin/perl\nuse strict;\n\
    use warnings;\nmy $fname = \"Foo\";\nprint \"$fname\\n\"; # Foo\npackage Other;\n\
    use strict;\nuse warnings;\nprint \"$fname\\n\"; # Foo\nmy $lname = 'Bar';\nprint\
    \ \"$lname\\n\"; # Bar\n\npackage main;\nprint \"$fname\\n\"; # Foo\nprint \"\
    $lname\\n\"; # Bar\n```\n\n## 5. BioPerl 及其应用\n\nBioPerl 是一系列 Perl 模块，旨在有助于开发用于生物信息学应用的\
    \ Perl 脚本。它在人类基因组计划中发挥了不可缺的作用。BioPerl 是一个由 Open Bioinformatics Foundation 支持的活跃开源项目。\n\
    \n"
- fmt: "\n#\n\nThe first set of Perl codes of Bioperl was created by Tim Hubbard and\
    \ Jong Bhak at MRC Centre Cambridge where the first genome sequencing was carried\
    \ out by Fred Sanger. MRC Centre was one of the hubs and birth places of modern\
    \ bioinformatics as it had large amount of DNA sequences and 3D protein structures.\
    \ The name Bioperl was coined jointly by Jong Bhak and Steve Brenner in a small\
    \ room of Centre for Protein Engineering (CPE) of MRC Centre where Alan Fersht\
    \ was the director. In that small room, Cyrus Chothia and Tim Hubbard were working\
    \ with some of their Ph.D. students and colleagues. Tim Hubbard is an expert Perl\
    \ programmer and he was using `th_lib.pl` that contained many useful Perl subroutines\
    \ for bioinformatics. Jong Bhak, being the first Ph.D. student of Tim Hubbard\
    \ created `jong_lib.pl`. Jong merged the two Perl subroutine libraries into `Bio.pl`.\
    \ One day in 1995, Steve Brenner, a Ph.D. student of Cyrus Chothia visited the\
    \ room and started to discuss what they would call the perl library after some\
    \ lengthy (a few months) debate on whether Perl is superior to C for bioinformatics\
    \ as Steve Brenner had his own C library for bioinformatics. The two Ph.D. students\
    \ named the net Perl library for biology Bioperl after going through names such\
    \ as protein perl, protperl, PerlBio, and so on. Steve Brenner organized a Bioperl\
    \ session in 1995 at ISMB Cambridge although it did not really happen. Bioperl\
    \ had some users in coming months including Georg Fuellen who organized a training\
    \ course in Germany. Georg's colleagues and students extended the Bioperl much\
    \ and this was joined later by other people such as Steve Chervitz who was actively\
    \ developing Perl codes for his yeast genome DB. The major expansion came when\
    \ another Cambridge student Ewan Birney joined the wagon after another lengthy\
    \ debate on if Perl was superior to C for bioinformatics and Ewan and many other\
    \ people were very active in developing Bioperl.\n\nThe first stable release was\
    \ on 11 June 2002; the most recent stable (in terms of API) release is `1.6.9`\
    \ from 14 April 2011. There are also developer releases produced periodically.\
    \ Version series `1.6.0` is considered to be the most stable (in terms of bugs)\
    \ version of BioPerl and is recommended for everyday use, but the nightly builds\
    \ are also extremely stable, and many BioPerl users stay current with those.\n\
    \nIn order to take advantage of BioPerl, the user needs a basic understanding\
    \ of the Perl programming language including an understanding of how to use Perl\
    \ references, modules, objects and methods.\n\n## Features and Applications\n\n\
    BioPerl provides software modules for many of the typical tasks of bioinformatics\
    \ programming. These include:\n\n* Accessing nucleotide and peptide sequence data\
    \ from local and remote databases\n* Transforming formats of database/ file records\n\
    * Manipulating individual sequences\n* Searching for similar sequences\n* Creating\
    \ and manipulating sequence alignments\n* Searching for genes and other structures\
    \ on genomic DNA\n* Developing machine readable sequence annotations\n\nIn addition\
    \ to being used directly by end-users, BioPerl has also provided the base for\
    \ a wide variety of bioinformatic tools, including amongst others:\n\n* SynBrowse,\n\
    * Gene Comber, TFBS, MIMOX, BioParser, Degenerate primer design, Querying the\
    \ public databases, Current Comparative Table\n* New tools and algorithms from\
    \ external developers are often integrated directly into BioPerl itself:\n* Dealing\
    \ with phylogenetic trees and nested taxa FPC Web tools Related Libraries in Other\
    \ Programming Languages.\n\nSeveral related bioinformatics libraries implemented\
    \ in other programming languages exist as part of the [Open Bioinformatics Foundation](https://en.wikipedia.org/wiki/Open_Bioinformatics_Foundation)\
    \ including: Biopython, BioJava, BioRuby, BioPHP, BioJS, Bioconductor, etc.\n\n\
    ## Unit-V\n\n### 1. INTRODUCTION TO PERL MODULES \n\n### Getopt::Long - Extended\
    \ processing of command line options\n\n#### SYNOPSIS\n\n```perl\n1. use Getopt::Long;\n\
    2. my $data = \"file.dat\";\n3. my $length = 24;\n4. my $verbose;\n5. GetOptions\
    \ (\"length=i\" => \\$length,# numeric\n6. \"file=s\" => \\$data,# string\n7.\
    \ \"verbose\" => \\$verbose) # flag\n8. or die(\"Error in command line arguments\\\
    n\");\n```\n\n#### DESCRIPTION\n\nThe `Getopt::Long` module implements an extended\
    \ getopt function called `GetOptions()`. It parses the command line from `@ARGV`,\
    \ recognizing and removing specified options and their possible values.\n\nThis\
    \ function adheres to the POSIX syntax for command line options, with GNU extensions.\
    \ In general, this means that options have long names instead of single letters,\
    \ and are introduced with a double dash `--`. Support for bundling of command\
    \ line options, as was the case with the more traditional single-letter approach,\
    \ is provided but not enabled by default.\n\n#### Command Line Options, an Introduction\n\
    \nCommand line operated programs traditionally take their arguments from the command\
    \ line, for example filenames or other information that the program needs to know.\
    \ Besides arguments, these programs often take command line options as well. Options\
    \ are not necessary for the program to work, hence the name 'option', but are\
    \ used to modify its default behaviour. For example, a program could do its job\
    \ quietly, but with a suitable option it could provide verbose information about\
    \ what it did.\n\nCommand line options come in several flavours. Historically,\
    \ they are preceded by a single dash `-`, and consist of a single letter.\n\n\
    1. `-l -a -c`\n\nUsually, these single-character options can be bundled:\n\n1.\
    \ `-lac`\n\nOptions can have values, the value is placed after the option character.\
    \ Sometimes with whitespace in between, sometimes not:\n\n1. `-s 24` `-s24`\n\n\
    Due to the very cryptic nature of these options, another style was developed that\
    \ used long names. So instead of a cryptic `-l` one could use the more descriptive\
    \ `--long`. To distinguish between a bundle of single-character options and a\
    \ long one, two dashes are used to precede the option name. Early implementations\
    \ of long options used a plus `+`. Also, option values could be specified either\
    \ like\n\n1. `--size=24` or\n\n1. `--size 24`\n\nThe `+` form is now obsolete\
    \ and strongly deprecated.\n\n#### Getting Started with Getopt::Long\n\n`Getopt::Long`\
    \ is the Perl5 successor of `newgetopt.pl`. This was the first Perl module that\
    \ provided support for handling the new style of command line options, in particular\
    \ long option names, hence the Perl name `Getopt::Long`. This module also supports\
    \ single- character options and bundling.\n\nTo use `Getopt::Long` from a Perl\
    \ program, you must include the following line in your Perl program:\n\n```perl\n\
    1.use Getopt::Long;\n```\n\nThis will load the core of the `Getopt::Long` module\
    \ and prepare your program for using it. Most of the actual `Getopt::Long` code\
    \ is not loaded until you really call one of its functions.\n\nIn the default\
    \ configuration, options names may be abbreviated to uniqueness, case does not\
    \ matter, and a single dash is sufficient, even for long option names. Also, options\
    \ may be placed between non-option arguments.\n\n##### Simple options\n\nThe most\
    \ simple options are the ones that take no values. Their mere presence on the\
    \ command line enables the option. Popular examples are:\n\n1. `--all --verbose\
    \ --quiet --debug` Handling simple options is straightforward:\n\n```perl\n1.\
    \ my $verbose = '';\n2. my $all = '';\n3. GetOptions ('verbose' => \\$verbose,\
    \ 'all' => \\$all);\n```\n\nThe call to `GetOptions()` parses the command line\
    \ arguments that are present in `@ARGV` and sets the option variable to the value\
    \ 1 if the option did occur on the command line. Otherwise, the option variable\
    \ is not touched. Setting the option value to true is often called enabling the\
    \ option.\n"
