  trans: '


    文件权限操作符 `-r`、`-R`、`-w`、`-W`、`-x` 和 `-X` 的解释默认基于基于文件的模式以及用户的 `uids` 和 `gids`。可能存在其他原因导致你实际上无法读取、写入或执行该文件：例如网络文件系统的访问控制、`ACLs`（访问控制列表）、只读文件系统以及无法识别的可执行格式。请注意，使用这六个特定运算符来验证某些操作是否可行通常是一个错误，因为这可能会受到竞态条件的影响。


    另请注意，对于本地文件系统上的超级用户，`-r`、`-R`、`-w` 和 `-W` 测试始终返回 1，而如果模式中设置了任何执行位，则 `-x` 和 `-X`
    返回 1。因此，由超级用户运行的脚本可能需要执行 `stat()` 来确定文件的实际模式，或者临时将它们的有效 `uid` 设置为其他值。


    如果你正在使用 ACL，有一个名为 `filetest` 的预指令，它产生的结果可能比原始的 `stat()` 模式位更准确。当在 `use filetest
    ''access''` 模式下，上述文件测试将测试权限是否可以使用 `access(2)` 系列系统调用授予（或不授予）。另请注意，在此预指令下，即使没有设置执行权限位（也没有设置任何额外的执行权限
    ACL），`-x` 和 `-X` 也可能返回真。这种奇怪现象源于底层系统调用的定义。还要注意，由于 `use filetest ''access''` 的实现，当此预指令生效时，特殊文件句柄
    `_` 不缓存文件测试的结果。更多信息请参阅 `filetest` 预指令的文档。


    `-T` 和 `-B` 选项的工作方式如下：检查文件的第一个块，查看其是否为包含非 ASCII 字符的有效 UTF-8。如果是，它就是 `-T` 文件。否则，检查文件的相同部分是否存在异常字符，例如奇怪的控制代码或设置了高位的字符。如果超过三分之一的字符是异常字符，它就是
    `-B` 文件；否则它是 `-T` 文件。此外，任何在检查部分包含零字节的文件都被视为二进制文件。（如果在包含 `LC_CTYPE` 的 `use locale`
    范围内执行，异常字符是指任何在当前 locale 中既不是可打印字符也不是空格的字符。）如果对文件句柄使用 `-T` 或 `-B`，则检查当前的 IO 缓冲区而不是第一个块。`-T`
    和 `-B` 在空文件或在测试文件句柄时处于 EOF 的文件上返回真。由于执行 `-T` 测试必须读取文件，在大多数情况下你可能想先对文件使用 `-f`，例如
    `next unless -f $file && -T $file`。


    如果给任何文件测试（或 `stat` 或 `lstat` 运算符）提供一个由单个下划线 `_` 组成的特殊文件句柄，则将使用上一个文件测试（或 `stat`
    运算符）的 stat 结构，从而节省一次系统调用。（这对于 `-t` 不起，你需要记得 `lstat()` 和 `-l` 在 stat 结构中留的是符号链接的值，而不是真实文件。）（此外，如果
    stat 缓冲区是由 `lstat` 调用填充的，`-T` 和 `-B` 将用 `stat _` 的结果重置它。）


    ### 示例


    ```

    43. print "Can do.\n" if -r $a || -w _ || -x _; 44.

    45. stat($filename);

    46. print "Readable\n" if -r _;

    47. print "Writable\n" if -w _;

    48. print "Executable\n" if -x _;

    49. print "Setuid\n" if -u _;

    50. print "Setgid\n" if -g _;

    51. print "Sticky\n" if -k _;

    52. print "Text\n" if -T _;

    ```


    '
- fmt: "\nIt might conceivably `chdir()` you out of a directory that it can't `chdir()`\
    \ you back into. If `fastcwd` encounters a problem it will return `undef` but\
    \ will probably leave you in a different directory. For a measure of extra security,\
    \ if everything appears to have worked, the `fastcwd()` function will check that\
    \ it leaves you in the same directory that it started in. If it has changed it\
    \ will [die](http://perldoc.perl.org/functions/die.html) with the message \"Unstable\
    \ directory path, current directory changed unexpectedly\". That should never\
    \ happen.\n\n### fastgetcwd\n\n```perl\nmy $cwd = fastgetcwd();\n```\n\nThe `fastgetcwd()`\
    \ function is provided as a synonym for `cwd()`.\n\n getdcwd\n\n```perl\nmy $cwd\
    \ = getdcwd();\nmy $cwd = getdcwd('C:');\n```\n\nThe `getdcwd()` function is also\
    \ provided on Win32 to get the current working directory on the specified drive,\
    \ since Windows maintains a separate current working directory for each drive.\
    \ If no drive is specified then the current drive is assumed.\n\nThis function\
    \ simply calls the Microsoft C library `_getdcwd()` function.\n\n### abs_path\
    \ and friends\n\nThese functions are exported only on request. They each take\
    \ a single argument and return the absolute pathname for it. If no argument is\
    \ given they'll use the current working directory.\n\n#### abs_path\n\n```perl\n\
    my $abs_path = abs_path($file);\n```\n\nUses the same algorithm as `getcwd()`.\
    \ Symbolic links and relative-path components (`.` and `..`) are resolved to return\
    \ the canonical pathname, just like `realpath(3)`.\n\n#### realpath\n\n```perl\n\
    my $abs_path = realpath($file);\n```\n\nA synonym for `abs_path()`.\n\n#### fast_abs_path\n\
    \n```perl\nmy $abs_path = fast_abs_path($file);\n```\n\nA more dangerous, but\
    \ potentially faster version of `abs_path`.\n\n### $ENV{PWD}\n\nIf you ask to\
    \ override your `chdir()` built-in function, `use Cwd qw(chdir);`, then your `PWD`\
    \ environment variable will be kept up to date. Note that it will only be kept\
    \ up to date if all packages which use `chdir` import it from `Cwd`.\n\nSince\
    \ the path separators are different on some operating systems (`/` on Unix, `:`\
    \ on MacPerl, etc...) we recommend you use the `File::Spec` modules wherever portability\
    \ is a concern.\n\nActually, on Mac OS, the `getcwd()`, `fastgetcwd()`, and `fastcwd()`\
    \ functions are all aliases for the `cwd()` function, which, on Mac OS, calls\
    \ `pwd`. Likewise, the `abs_path()` function is an alias for `fast_abs_path()`.\n\
    \n## 6. Perl System Function\n\nThe `system()` function executes an operating\
    \ system command by forking a child process and waiting for the child process\
    \ to complete, returning some sort of exit status for the child that you can test.\n\
    \nThe arguments to the `system()` function can take three forms (parenthesis optional):\n\
    \n1. `system($STRING);`\n2. `system($PROGRAM, @ARGUMENT_LIST);`\n3. `system {\
    \ $PROGRAM } $FAUX_PROGRAM, @ARGUMENT_LIST`\n\nThe first form is the most commonly\
    \ used. What determines which form you use (or which Perl will really use) depends\
    \ on whether the command you're trying to execute contains shell metacharacters.\
    \ Shell metacharacters include things like pipes, redirects and statement separators:\
    \ `(ps -aux | column 1 > pids); date`. Specifically the characters: `& ; ` ' \\\
    \ \" | * ? ~ < > ^ ( ) [ ] { } $ \\n \\r`\n\nIf the operating system command you're\
    \ trying to execute uses any of these, you must use the first form, e.g:\n\n```perl\n\
    system (\"$tace < $tcmd > $tout\");\n```\n\nIn this case the sole string argument\
    \ is passed to a command shell. One key thing to remember is that once you introduce\
    \ the `system()` function, your script is no longer portable, without modification,\
    \ to Perl running under Windows and possibly other Unix operating systems.\n\n\
    ## 7. PERL Subroutines and functions\n\nPerl subroutine or function is a group\
