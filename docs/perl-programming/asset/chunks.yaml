    # UNIT- I INTRODUCTION TO PERL


    ## 1. INTRODUCTION TO PERL AND DATA TYPES


    Scalars are simple variables. They are preceded by a dollar sign (`$`). A scalar
    is either a number, a string, or a reference. A reference is actually an address
    of a variable, which we will see in the upcoming chapters.


    Arrays are ordered lists of scalars that you access with a numeric index which
    starts with 0. They are preceded by an "at" sign (`@`).


    Hashes are unordered sets of key/value pairs that you access using the keys as
    subscripts. They are preceded by a percent sign (`%`).


    ![](Images/image00428.jpeg)


    ## 2. Constructing atgc.pl


    ![](Images/image00429.jpeg)

    ![](Images/image00430.jpeg)


    ## 3. ~tr/// function


    This is not a function. This is the transliteration operator; it replaces all
    occurrences of the characters in `SEARCHLIST` with the characters in `REPLACEMENTLIST`.


    Syntax: `tr/SEARCHLIST/REPLACEMENTLIST/`


    ### Return Value

    This function returns number of characters replaced or deleted. Example


    Following is the example code showing its basic usage:

    ```

    #!/usr/bin/perl -w

    $string = ''the cat sat on the mat.'';

    $string =~ tr/a-z/b/d;

    print "$string\n";

    ```


    When above code is executed, it produces the following result. Here option `d`
    is used to delete matched characters.


    ![](Images/image00428.jpeg)


    ## 4. ~s/// function


    ### Description

    This is not a function. This is the regular expression-substitution operator.
    Based on the regular expression specified in `PATTERN`, data is replaced by `REPLACE`.
    Like `m//`, the delimiters are defined by the first character following `s`.


    ### Syntax

    `s/PATTERN/REPLACE/`


    ### Return Value

    This function returns 0 on failure and number of substitutions made on success.
    Example


    Following is the example code showing its basic usage:

    ```

    #!/usr/bin/perl -w

    $string = "This is Test";

    # this will replcase Test with Best.

    $string =~ s/Test/Best/;

    print "$string\n";

    ```


    When above code is executed, it produces the following result — This is Best


    ![](Images/image00428.jpeg)


    ## 5. Formatting Numerical Output With Printf function


    ![](Images/image00428.jpeg)

    ![](Images/image00428.jpeg)

    ![](Images/image00431.jpeg)


    ## 6. Chop and Chomp operators


    ![](Images/image00428.jpeg)

    ![](Images/image00432.jpeg)

    ![](Images/image00428.jpeg)


    ## 7. THE COMMON GATEWAY INTERFACE(CGI) - Introduction and Applications


    The common gateway interface (CGI) is a standard way for a Web server to pass
    a Web user''s request to an application program and to receive data back to forward
    to the user. When the user requests a Web page (for example, by clicking on a
    highlighted word or entering a Web site address), the server sends back the requested
    page. However, when a user fills out a form on a Web page and sends it in, it
    usually needs to be processed by an application program. The Web server typically
    passes the form information to a small application program that processes the
    data and may send back a confirmation message. This method or convention for passing
    data back and forth between the server and the application is called the common
    gateway interface (CGI). It is part of the Web''s Hypertext Transfer Protocol
    (HTTP).


    If you are creating a Web site and want a CGI application to get control, you
    specify the name of the application in the uniform resource locator (URL) that
    you code in an HTML file. This URL can be specified as part of the `FORMS` tags
    if you are creating a form. For example, you might code:


    ![](Images/image00428.jpeg)

    ```html

    <FORM METHOD=POST ACTION=http://www.mybiz.com/cgi-bin/formprog.pl>

    ```


    and the server at "mybiz.com" would pass control to the CGI application called
    `formprog.pl` to record the entered data and return a confirmation message. (The
    `.pl` indicates a program written in PERL but other languages could have been
    used.)


    The common gateway interface provides a consistent way for data to be passed from
    the user''s request to the application program and back to the user. This means
    that the person who writes the application program can makes sure it gets used
    no matter which operating system the server uses (PC, Macintosh, UNIX, OS/390,
    or others). It''s simply a basic way for information to be passed from the Web
    server about your request to the application program and back again.


    The importance of CGI lies in the fact that its flexibility has made it a standard
    for running Executable files from Web servers. This standard allows for true interactivity,
    in endless ways, on Web sites.


    ![](Images/image00428.jpeg)

    ![](Images/image00433.jpeg)![](Images/image00434.jpeg)


    # The limitation and problems of CGI


    ### Problems:

    ![](Images/image00428.jpeg)


    Performance: Every time a user requests an entry, the server must launch the CGI
    program. When the program is written in interpreted language like Perl, the server
    still needs to interpret or compile before it can run, which takes more time.
    If the command is called often, the resulting workload can quickly overwhelm the
    server.


    ### Advantages and applications of CGI:

    - **Platform independence**: Most web servers support CGI, including Unix, Windows
    NT, and Macintosh.

    - **Language independence**: Perl, C, C++, Visual Basic, Java.

    - **Scalability**: The simplicity of the CGI interface means that it is extremely
    scalable.


    An example of a CGI program is one Wiki. The user agent requests the name of an
    entry; the web server executes the CGI; the CGI program retrieves the source of
    that entry (if one exists), transforms it into HTML and transmits it to the user.
    If the "Edit this page" link is clicked, the CGI populates an HTML textarea or
    other control with the page''s contents, and saves it back to the server when
    the user submits the form.


    # Unit-II


    ## Introduction to arrays and Hashes


    ### Arrays

    While we often work with single variables, it''s sometimes useful to work with
    collections of variables. For this, Perl offers two options: arrays and hashes.
    Arrays are the simplest kind of collection, so we will start with them.


    For example, let''s say you want to test all possible output of the ''Hello''
    program. Of course, you could just run it three times, manually changing the value
    of the `$status` variable each time. But you could also use an array containing
    all the possible values of the status variable (''leaving'', ''arriving'', and
    ''other'') and iterate through the array.


    First, define the array like this:

    ```perl

    @status = ("leaving", "arriving", "staying", "whatever");

    ```


    Note that instead of a `$` sign, arrays are preceded by an `@` sign.


    So now you could add something like the following to your hello program:

    ```perl

    @status = ("leaving", "arriving", "staying", "whatever"); foreach $status (@status)
    {

    ```

