    \ print \"$elem\\n\";\n    }\n}\n\nprint \"array1:\\n\";\nprint_arr(@arr1);\n\n\
    print \"\\narray2:\\n\";\nprint_arr(@arr2);\n```\n\n## 使用顺序数据填充数组\n\nPerl 为顺序数字和字母提供了快捷方法。例如，在数到\
    \ 100 时不需要手动输入每个元素，我们可以这样做：\n\n```perl\n#!/usr/bin/perl\nmy @var_10 = (1..10);\n\
    my @var_20 = (10..20);\nmy @var_abc = (a..z);\n\nprint \"@var_10\\n\"; # 打印 1\
    \ 到 10 的数字\nprint \"@var_20\\n\"; # 打印 10 到 20 的数字\nprint \"@var_abc\\n\"; # 打印\
