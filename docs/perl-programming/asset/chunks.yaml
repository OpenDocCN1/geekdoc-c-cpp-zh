    ## Options with multiple names


    Often it is user friendly to supply alternate mnemonic names for options. For
    example `-- height` could be an alternate name for `--length`. Alternate names
    can be included in the option specification, separated by vertical bar `|` characters.
    To implement the above example:


    ```perl

    GetOptions (''length|height=f'' => \$length);

    ```


    The first name is called the primary name, the other names are called aliases.
    When using a hash to store options, the key will always be the primary name.


    ### Multiple alternate names. Case and abbreviations


    Without additional configuration, `GetOptions()` will ignore the case of option
    names, and allow the options to be abbreviated to uniqueness.


    ```perl

    GetOptions (''length|height=f'' => \$length, "head" => \$head);

    ```


    This call will allow `--l` and `--L` for the length option, but requires a least
    `--hea` and `--hei` for the head and height options.


    ## Summary of Option Specifications


    Each option specifier consists of two parts: the name specification and the argument
    specification.


    The name specification contains the name of the option, optionally followed by
    a list of alternative names separated by vertical bar characters.


    1. `lengthoption` name is `"length"`

    2. `length|size|lname` is `"length"`, aliases are `"size"` and `"l"`


    The argument specification is optional. If omitted, the option is considered boolean,
    a value of `1` will be assigned when the option is used on the command line.


    The argument-argument specification can be:


    ### `!`


    The option does not take an argument and may be negated by prefixing it with `no`
    or `no-`.


    E.g. `"foo!"` will allow `--foo` (a value of `1` will be assigned) as well as
    `--nofoo` and `--no-foo` (a value of `0` will be assigned). If the option has
    aliases, this applies to the aliases as well.


    Using negation on a single letter option when bundling is in effect is pointless
    and will result in a warning.


    ### `+`


    The option does not take an argument and will be incremented by `1` every time
    it appears on the command line. E.g. `"more+"`, when used with `--more --more
    --more`, will increment the value three times, resulting in a value of `3` (provided
    it was `0` or undefined at first).


    The `+` specifier is ignored if the option destination is not a scalar.


    ### `= type [ desttype ] [ repeat ]`


    The option requires an argument of the given type. Supported types are:


    *   `s`: String. An arbitrary sequence of characters. It is valid for the argument
    to start with `-` or `--`.

    *   `i`: Integer. An optional leading plus or minus sign, followed by a sequence
    of digits.

    *   `oo`: Extended integer, Perl style. This can be either an optional leading
    plus or minus sign, followed by a sequence of digits, or an octal string (a zero,
    optionally followed by ''0'', ''1'', .. ''7''), or a hexadecimal string (`0x`
    followed by ''0'' .. ''9'', ''a'' .. ''f'', case insensitive), or a binary string
    (`0b` followed by a series of ''0'' and ''1'').

    *   `f`: Real number. For example `3.14`, `-6.23E24` and so on.


    The `desttype` can be `@` or `%` to specify that the option is list or a hash
    valued. This is only needed when the destination for the option value is not otherwise
    specified. It should be omitted when not needed.


    The `repeat` specifies the number of values this option takes per occurrence on
    the command line. It has the format `{ [ min ] [ , [ max ] ] }`.


    *   `min` denotes the minimal number of arguments. It defaults to `1` for options
    with `=` and to `0` for options with `:`, see below. Note that `min` overrules
    the `=` `:` semantics.

    *   `max` denotes the maximum number of arguments. It must be at least `min`.
    If `max` is omitted, but the comma is not, there is no upper bound to the number
    of argument values taken.


    ### `: type [ desttype ]`


    Like `=`, but designates the argument as optional. If omitted, an empty string
    will be assigned to string values options, and the value `zero` to numeric options.


    Note that if a string argument starts with `-` or `--`, it will be considered
    an option on itself.


    ### `: number [ desttype ]`


    Like `:i`, but if the value is omitted, the number will be assigned.


    ### `: + [ desttype ]`


    Like `:i`, but if the value is omitted, the current value for the option will
    be incremented.


    ## 3 LWP::Simple Module


    LWP - The World-Wide Web library for Perl


    ### SYNOPSIS


    ```perl

    use LWP;

    print "This is libwww-perl-$LWP::VERSION\n";

    ```


    ### DESCRIPTION


    The libwww-perl collection is a set of Perl modules which provides a simple and
    consistent application programming interface (API) to the World-Wide Web. The
    main focus of the library is to provide classes and functions that allow you to
    write WWW clients. The library also contain modules that are of more general use
    and even classes that help you implement simple HTTP servers.


    Most modules in this library provide an object oriented API. The user agent, requests
    sent and responses received from the WWW server are all represented by objects.
    This makes a simple and powerful interface to these services. The interface is
    easy to extend and customize for your own needs.


    The main features of the library are:


    *   Contains various reusable components (modules) that can be used separately
    or together.

    *   Provides an object oriented model of HTTP-style communication. Within this
    framework we currently support access to `http`, `https`, `gopher`, `ftp`, `news`,
    `file`, and `mail`.

    *   Supports basic and digest authorization schemes.

    *   Supports transparent redirect handling.

    *   Supports access through proxy servers.

    *   Provides parser for `robots.txt` files and a framework for constructing HTML
    forms.

    *   Supports HTTP `cookies`.

    *   Some simple command line clients, for instance `lwp-request` and `lwp-download`.


    ## HTTP STYLE COMMUNICATION


    The libwww-perl library is based on HTTP communication. This section tries to
    describe what that means.


    Let us start with this from the HTTP specification document


    <URL[:http://www.w3.org/Protocols/](http://www.w3.org/Protocols/)>:


    *   The HTTP protocol is based on a request/response paradigm. A client establishes
    a connection with a server and sends a request to the server in the form of a
    request method, URI, and protocol version, followed by a MIME-like message containing
    request modifiers, client information, and possible body content. The server responds
    with a status line, including the message''s protocol version and a success or
    error code, followed by a MIME-like message containing server information, entity
    meta-information, and possible body content.


    What this means to libwww-perl is that communication always take place through
    these steps: First a request object is created and configured. This object is
    then passed to a server and we get a response object in return that we can examine.
    A request is always independent of any previous requests, i.e. the service is
    stateless. The simple model is used for any kind of service we want to access.


    For example, if we want to fetch a document from a remote file server, then we
    send it a request that contains a name for that document and the response will
    contain the document itself. If we access a search engine, then the content of
    the request will contain the query parameters and the response will contain the
    query result. If we want to send a mail message to somebody then we send a request
    object which contains our message to the mail server and the response object will
    contain an acknowledgment that tells us that the message has been accepted and
    will be forwarded to the recipient(s).

