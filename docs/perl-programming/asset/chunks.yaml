    can use any combination of naturally matching characters to act as delimiters
    for the expression. For example, m{}, m(), and m>< are all valid. So above example
    can be re-written as follows − #!/usr/bin/perl


    $bar = "This is foo and again foo"; if ($bar =~ m[foo]){


    print "First time is matching\n";


    }else{


    print "First time is not matching\n";


    }


    $bar = "foo";


    if ($bar =~ m{foo}){


    print "Second time is matching\n";


    }else{


    print "Second time is not matching\n";


    }


    You can omit m from m// if the delimiters are forward slashes, but for all other
    delimiters you must use the m prefix.


    Note that the entire match expression that is the expression on the left of =~
    or !~ and the match operator, returns true (in a scalar context) if the expression
    matches. Therefore the statement −


    $true = ($foo =~ m/foo/);


    will set $true to 1 if $foo matches the regex, or 0 if the match fails. In a list
    context, the match returns the contents of any grouped expressions. For example,
    when extracting the hours, minutes, and seconds from a time string, we can use
    −


    my ($hours, $minutes, $seconds) = ($time =~ m/(\d+):(\d+):(\d+)/);


    3.  Match Operator  Modifiers


    The match operator supports its own set of modifiers. The /g modifier allows for
    global matching. The /i modifier will make the match case insensitive. Here is
    the complete list of modifiers


    | Modifier | Description |


    | i | Makes the match case insensitive. |


    | m | Specifies that if the string has newline or carriage return characters,
    the ^ and $ operators will now match against a newline boundary, instead of a
    string boundary. |


    | o | Evaluates the expression only once. |


    | s | Allows use of . to match a newline character. |


    | x | Allows you to use white space in the expression for clarity. |


    | g | Globally finds all matches. |


    | cg | Allows the search to continue even after a global match fails. |


    Matching Only Once


    There is also a simpler version of the match operator - the ?PATTERN? operator.
    This is basically identical to the m// operator except that it only matches once
    within the string you are searching between each call to reset.


    For example, you can use this to get the first and last elements within a list
    − #!/usr/bin/perl


    @list = qw/food foosball subeo footnote terfoot canic footbrdige/; foreach (@list)


    {


    $first = $1 if ?(foo.*)?;


    $last = $1 if /(foo.*)/;


    }


    print "First: $first, Last: $last\n";


    When above program is executed, it produces the following result − First: food,
    Last: footbrdige


    4.  Regular Expression  Variables


    Regular expression variables include $, which contains whatever the last grouping
    match matched; $&, which contains the entire matched string; $`, which contains
    everything before the matched string; and $'', which contains everything after
    the matched string. Following code demonstrates the result −


    #!/usr/bin/perl


    $string = "The food is in the salad bar";


    $string =~ m/foo/; print "Before: $`\n"; print "Matched: $&\n"; print "After:  $''\n";


    When above program is executed, it produces the following result − Before: The


    Matched: foo


    After: d is in the salad bar


    5.  The Substitution  Operator


    The substitution operator, s///, is really just an extension of the match operator
    that allows you to replace the text matched with some new text. The basic form
    of the operator is − s/PATTERN/REPLACEMENT/;


    The PATTERN is the regular expression for the text that we are looking for. The
    REPLACEMENT is a specification for the text or regular expression that we want
    to use to replace the found text with. For example, we can replace all occurrences
    of dog with cat using the following regular expression −


    #/user/bin/perl


    $string = "The cat sat on the mat";


    $string =~ s/cat/dog/;


    print "$string\n";


    When above program is executed, it produces the following result − The dog sat
    on the mat


    Substitution Operator Modifiers


    Here is the list of all modifiers used with substitution operator.


    | Modifier | Description |


    | i | Makes the match case insensitive. |


    | m | Specifies that if the string has newline or carriage return characters,
    the ^ and $ operators will now match against a newline boundary, instead of a
    string boundary. |


    | o | Evaluates the expression only once. |


    | s | Allows use of . to match a newline character. |


    | x | Allows you to use white space in the expression for clarity. |


    | g | Replaces all occurrences of the found expression with the replacement text.
    |


    | e | Evaluates the replacement as if it were a Perl statement, and uses its return
    value as the replacement text. |


    6.  The Translation  Operator


    Translation is similar, but not identical, to the principles of substitution,
    but unlike substitution, translation (or transliteration) does not use regular
    expressions for its search on replacement values. The translation operators are
    −


    tr/SEARCHLIST/REPLACEMENTLIST/cds y/SEARCHLIST/REPLACEMENTLIST/cds


    The translation replaces all occurrences of the characters in SEARCHLIST with
    the corresponding characters in REPLACEMENTLIST. For example, using the "The cat
    sat on the mat." string we have been using in this chapter −


    #/user/bin/perl


    $string = ''The cat sat on the mat'';


    $string =~ tr/a/o/;


    print "$string\n";


    When above program is executed, it produces the following result − The cot sot
    on the mot.


    Standard Perl ranges can also be used, allowing you to specify ranges of characters
    either by letter or numerical value. To change the case of the string, you might
    use the following syntax in place of the uc function.


    $string =~ tr/a-z/A-Z/;


    7.  Translation Operator  Modifiers


    Following is the list of operators related to translation.


    | Modifier | Description |


    | c | Complements SEARCHLIST. |


    | d | Deletes found but unreplaced characters. |


    | s | Squashes duplicate replaced characters. |


    The /d modifier deletes the characters matching SEARCHLIST that do not have a
    corresponding entry in REPLACEMENTLIST. For example −


    #!/usr/bin/perl


    $string = ''the cat sat on the mat.'';


    $string =~ tr/a-z/b/d; print "$string\n";


    When above program is executed, it produces the following result − b b b.


    The last modifier, /s, removes the duplicate sequences of characters that were
    replaced, so − #!/usr/bin/perl


    $string =  ''food'';


    $string =  ''food'';


    $string =~ tr/a-z/a-z/s;


    print "$string\n";


    When above program is executed, it produces the following result − fod


    8.  More Complex Regular  Expressions


    You don''t just have to match on fixed strings. In fact, you can match on just
    about anything you could dream of by using more complex regular expressions. Here''s
    a quick cheat sheet − Following table lists the regular expression syntax that
    is available in Python.


    | Pattern | Description |


    | ^ | Matches beginning of line. |


    | $ | Matches end of line. |


    | . | Matches any single character except newline. Using m option allows it to
    match newline as  well. |


    | [...] | Matches any single character in brackets. |


    | [^...] | Matches any single character not in brackets. |


    | * | Matches 0 or more occurrences of preceding expression. |


    | + | Matches 1 or more occurrence of preceding expression. |


    | ? | Matches 0 or 1 occurrence of preceding expression. |


    | { n} | Matches exactly n number of occurrences of preceding expression. |


    | { n,} | Matches n or more occurrences of preceding expression. |


    | { n, m} | Matches at least n and at most m occurrences of preceding expression.
    |


    | a&#124; b | Matches either a or b. |


    | \w | Matches word characters. |


    | \W | Matches nonword characters. |


    | \s | Matches whitespace. Equivalent to [\t\n\r\f]. |


    | \S | Matches nonwhitespace. |


    | \d | Matches digits. Equivalent to [0-9]. |


    | \D | Matches nondigits. |


    | \A | Matches beginning of string. |


    | \Z | Matches end of string. If a newline exists, it matches just before newline.
    |


    | \z | Matches end of string. |


    | \G | Matches point where last match finished. |'
