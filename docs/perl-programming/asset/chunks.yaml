  raw: '3.  qw  function


    This function is a quick way to specify a lot of little single-quoted words. For
    example, qw(foo bar baz) is equivalent to (''foo'', ''bar'', ''baz''). Some programmers
    feel that using qw make Perl scripts easier to read. You can actually use any
    set of delimiters, not just the parentheses.


    Simply you can use qw() to prepare an array as shown in the example below.


    Syntax


    Following is the simple syntax for this function −


    qw EXPR


    Return Value


    This function return a list consisting of the element of LIST evaluated as if
    they were single- quoted.


    Example


    Following is the example code showing its basic usage −


    #!/usr/bin/perl -w


    @array = qw(This is a list of words without interpolation); foreach $key (@array){


    print"Key is $key\n";


    }


    When above code is executed, it produces the following result −


    Key is This Key is is Key is a Key is list Key is of


    Key is words Key is without


    Key is interpolation


    4.  Determination of the size of an  array


    The size of an array can be determined using the scalar context on the array -
    the returned value


    will be the number of elements in the array −


    @array = (1,2,3);


    print "Size: ",scalar @array,"\n";


    The value returned will always be the physical size of the array, not the number
    of valid elements. You can demonstrate this, and the difference between scalar
    @array and $#array, using this fragment is as follows −


    #!/uer/bin/perl @array = (1,2,3);


    $array[50] =  4;


    $size =  @array;


    $max_index = $#array;


    print  "Size:$size\n";


    print "Max Index:  $max_index\n";


    This will produce the following result  −


    Size: 51


    Max Index: 50


    There are only four elements in the array that contains information, but the array
    is 51 elements long, with a highest index of 50.


    5.  Accessing first and last element of an  array


    Shift function


    This function returns the first value in an array, deleting it and shifting the
    elements of the array list to the left by one. If ARRAY is not specified, shifts
    the @_ array within a subroutine, or @ARGV otherwise. shift is essentially identical
    to pop, except values are taken from the start of the array instead of the end.


    Syntax


    Following is the simple syntax for this function −


    shift ( [ARRAY] )


    shift


    Return Value


    This function returns undef if the array is empty else returns first element in
    array.


    Example


    Following is the example code showing its basic usage −


    #!/usr/bin/perl


    @array = (1..5);


    while ($element = shift(@array)) { print("$element - ");


    }


    print("The End\n");


    When above code is executed, it produces the following result −


    1 - 2 - 3 - 4 - 5 - The End


    6.  Unshift  function


    This function places the elements from LIST, in order, at the beginning of ARRAY.
    This is opposite function to shift().


    Syntax


    Following is the simple syntax for this function −


    unshift ARRAY, LIST


    Return Value


    This function returns the number of new elements in ARRAY.


    Example


    Following is the example code showing its basic usage −


    #!/usr/bin/perl -w @array = ( 1, 2, 3, 4);


    print "Value of array is @array\n" ; unshift( @array, 20, 30, 40 );


    print "Now value of array is @array\n" ;


    When above code is executed, it produces the following result −


    Value of array is 1 2 3 4


    Now value of array is 20 30 40 1 2 3 4


    7.  Push  function


    This function pushes the values in LIST onto the end of the list ARRAY. Used with
    pop to implement stacks.


    Syntax


    Following is the simple syntax for this function −


    push ARRAY, LIST


    Return Value


    This function returns number of elements in new array.


    Example


    Following is the example code showing its basic usage −


    #!/usr/bin/perl -w


    $, = ",";


    @array = ( 1, 2 );


    print "Before pushing elements @array \n"; push(@array, (3, 4, 5));


    print "After pushing elements @array \n";


    When above code is executed, it produces the following result −


    Before pushing elements 1 2


    After pushing elements 1 2 3 4 5


    8.  Pop  function


    This function returns the last element of ARRAY, removing the value from the array.
    Note that ARRAY must explicitly be an array, not a list.


    If ARRAY is omitted, it pops the last value from @ARGV in the main program or
    when called within eval STRING, or the BEGIN, CHECK, INIT, or END blocks. Otherwise,
    it attempts to pop information from the @_ array within a subroutine. It is the
    opposite of push, which when used in combination, allows you to implement "stacks".


    Note that after applying pop the array will be shortened by one element.


    Syntax


    Following is the simple syntax for this function −


    pop ARRAY


    pop


    Return Value


    This function returns undef if list is empty else last element from the array.


    Example


    Following is the example code showing its basic usage −


    #!/usr/bin/perl  -w


    @a = (1, 2, 3,  4);


    print("pop() ", pop(@a), " leaves ",@a, "\n");


    When above code is executed, it produces the following result −


    pop() 4 leaves 123


    9.  Array  Slices


    An array is a variable that stores an ordered list of scalar values. Array variables
    are preceded by an "at" (@) sign. To refer to a single element of an array, you
    will use the dollar sign ($) with  the variable name followed by the index of
    the element in square  brackets.


    Here is a simple example of using the array variables −


    #!/usr/bin/perl


    @ages = (25, 30, 40);


    @names = ("John Paul", "Lisa", "Kumar");


    print "\$ages[0] = $ages[0]\n"; print "\$ages[1] = $ages[1]\n"; print "\$ages[2]
    = $ages[2]\n"; print "\$names[0] = $names[0]\n"; print "\$names[1] = $names[1]\n";
    print "\$names[2] = $names[2]\n";


    Here we have used the escape sign (\) before the $ sign just to print it. Other
    Perl will understand


    it as a variable and will print its value. When exected, this will produce the
    following result −


    $ages[0] =  25


    $ages[1] =  30


    $ages[2] = 40


    $names[0] = John Paul


    $names[1] = Lisa


    $names[2] = Kumar


    10.  Splice  Function


    This function removes the elements of ARRAY from the element OFFSET for LENGTH
    elements, replacing the elements removed with LIST, if specified. If LENGTH is
    omitted, removes everything from OFFSET onwards.


    Syntax


    Following is the simple syntax for this function −


    splice ARRAY, OFFSET, LENGTH, LIST splice ARRAY, OFFSET, LENGTH


    splice ARRAY, OFFSET


    Return Value


    This function returns −


    *   In scalar context undef if no elements  removed


    *   In scalar context last element  removed


    *   In list context empty list on  failure


    *   In list context list of elements  removed


    Example


    Following is the example code showing its basic usage −


    #!/usr/bin/perl -w


    @array= ("a", "e", "i", "o",  "u");


    @removedItems = splice(@array, 0 , 3, ("A", "E", "I"));


    print "Removed items: @removedItems\n";


    When above code is executed, it produces the following result −


    Removed items: a e i


    11.  Sorting  Arrays


    Perl has a built-in function called sort that can, unsurprisingly, sort an array.
    In its most simple form, you just give it an array, and it returns the elements
    of that array in a sorted order. @sorted


    = sort @original.


    Comparison function


    The way sort works in Perl is, that it goes over every two elements of the original
    array; In every turn it puts the value from the left side into the variable $a,
    and the value on the right side in the variable $b. Then it calls a comparison
    function. That "comparison function" will return 1 if the content of $a should
    be on the left, -1 if the content of $b should be on the left, or 0 if it does
    not matter as the two values are the same.


    By default you don''t see this comparison function and sort compares the values
    according to the ASCII table, but if you want, you can write it explicitly:


    1\. sort { $a cmp $b } @words;


    This code will provide the exact same result as the one without the block: sort
    @words.'
