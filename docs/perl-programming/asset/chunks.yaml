    # 第一单元 PERL 简介


    ## 1. PERL 简介与数据类型


    标量（Scalars）是简单的变量。它们以美元符号（`$`）开头。标量可以是数字、字符串或引用。引用实际上实际上是变量的地址，我们将在接下来的章节中看到。


    数组（Arrays）是标量的有序列表，你通过从 0 开始的数值索引访问它们。它们以“at”符号（`@`）开头。


    哈希表（Hashes）是无序的键值对集合，你使用键作为下标进行访问。它们以百分比符号（`%`）开头。


    ![](img/image00428.jpeg)


    ## 2. 构建 atgc.pl


    ![](img/image00429.jpeg)

    ![](img/image00430.jpeg)


    ## 3. ~tr/// 函数


    这不是一个函数。这是一个置换运算符（transliteration operator）；它将 `SEARCHLIST` 中所有字符替换为 `REPLACEMENTLIST`
    中的字符。


    语法：`tr/SEARCHLIST/REPLACEMENTLIST/`


    ### 返回值

    此函数返回替换或删除的字符数量。示例


    以下是显示其基本用法示例代码：

    ```

    #!/usr/bin/perl -w

    $string = ''the cat sat on the mat.'';

    $string =~ tr/a-z/b/d;

    print "$string\n";

    ```


    当执行上述代码时，它会产生以下结果。在这里，选项 `d` 用于删除匹配的字符。


    ![](img/image00428.jpeg)


    ## 4. ~s/// 函数


    ### 描述

    这不是一个函数。这是一个正则表达式替换运算符。根据 `PATTERN` 中指定的正则表达式，数据将被 `REPLACE` 替换。与 `m//` 类似，分隔符由
    `s` 之后的第一个字符定义。


    ### 语法

    `s/PATTERN/REPLACE/`


    ### 返回值

    此函数在失败时返回 0，在成功时返回替换的次数。示例


    ```

    #!/usr/bin/perl -w

    $string = "This is Test";

    # 这会将 Test 替换为 Best。

    $string =~ s/Test/Best/;

    print "$string\n";

    ```


    当执行上述代码时，它产生以下结果 — This is Best


