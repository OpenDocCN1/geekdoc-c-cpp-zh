    13. Creating Hashes-Adding elements to Hashes-deleting, sorting and printing hash
    elements


    A hash is a set of key/value pairs. Hash variables are preceded by a percent (%)
    sign. To refer to a single element of a hash, you will use the hash variable name
    preceded by a "$" sign and followed by the "key" associated with the value in
    curly brackets.


    Here is a simple example of using the hash variables −


    #!/usr/bin/perl


    %data = (''John Paul'', 45, ''Lisa'', 30, ''Kumar'', 40);


    print "\$data{''John Paul''} = $data{''John Paul''}\n"; print "\$data{''Lisa''}
    = $data{''Lisa''}\n";


    print "\$data{''Kumar''} = $data{''Kumar''}\n";


    This will produce the following result −


    $data{''John Paul''} = 45


    $data{''Lisa''} = 30


    $data{''Kumar''} = 40


    Creating Hashes


    Hashes are created in one of the two following ways. In the first method, you
    assign a value to a named key on a one-by-one basis −


    $data{''John Paul''} = 45;


    $data{''Lisa''} = 30;


    $data{''Kumar''} = 40;


    In the second case, you use a list, which is converted by taking individual pairs
    from the list: the first element of the pair is used as the key, and the second,
    as the value. For example −


    %data = (''John Paul'', 45, ''Lisa'', 30, ''Kumar'', 40);


    For clarity, you can use => as an alias for , to indicate the key/value pairs
    as follows −


    %data = (''John Paul'' => 45, ''Lisa'' => 30, ''Kumar'' => 40);


    Here is one more variant of the above form, have a look at it, here all the keys
    have  been preceded by hyphen (-) and no quotation is required around  them:


    %data = (-JohnPaul => 45, -Lisa => 30, -Kumar =>  40);


    But it is important to note that there is a single word, i.e. without spaces keys
    have been used in this form of hash formation and if you build-up your hash this
    way then keys will be accessed using hyphen only as shown below.


    $val = %data{-JohnPaul}


    $val = %data{-Lisa}


    Accessing Hash Elements


    When accessing individual elements from a hash, you must prefix the variable with
    a dollar sign ($) and then append the element key within curly brackets after
    the name of the variable. For example −


    #!/usr/bin/perl


    %data = (''John Paul'' => 45, ''Lisa'' => 30, ''Kumar'' => 40); print "$data{''John
    Paul''}\n";


    print "$data{''Lisa''}\n"; print "$data{''Kumar''}\n";


    This will produce the following result −


    45


    30


    40


    Extracting Slices


    You can extract slices of a hash just as you can extract slices from an array.
    You will need to use


    @ prefix for the variable to store the returned value because they will be a list
    of values −


    #!/uer/bin/perl


    %data = (-JohnPaul => 45, -Lisa => 30, -Kumar => 40); @array = @data{-JohnPaul,
    -Lisa};


    print "Array : @array\n";


    This will produce the following result −


    Array : 45 30


    Extracting Keys and Values


    You can get a list of all of the keys from a hash by using keys function, which
    has the following


    syntax −


    keys %HASH


    This function returns an array of all the keys of the named hash. Following is
    the example −


    #!/usr/bin/perl


    %data = (''John Paul'' => 45, ''Lisa'' => 30, ''Kumar'' => 40); @names = keys  %data;


    print "$names[0]\n"; print "$names[1]\n"; print  "$names[2]\n";


    This will produce the following result −


    Lisa


    John Paul Kumar


    Similarly, you can use values function to get a list of all the values. This function
    has the


    following syntax −


    values %HASH


    This function returns a normal array consisting of all the values of the named
    hash. Following is


    the example −


    #!/usr/bin/perl


    %data = (''John Paul'' => 45, ''Lisa'' => 30, ''Kumar'' => 40); @ages = values
    %data;


    print "$ages[0]\n"; print "$ages[1]\n"; print "$ages[2]\n";


    This will produce the following result −


    30


    45


    40


    *****


    Unit-III REGULAR EXPRESSIONS


    1.  Perl Regular Expressions and regex operator and pattern modifier  operators


    A regular expression is a string of characters that defines the pattern or patterns
    you are viewing. The syntax of regular expressions in Perl is very similar to
    what you will find within other regular expression.supporting programs, such as
    sed, grep, and  awk.


    The basic method for applying a regular expression is to use the pattern binding
    operators =~ and


    !~. The first operator is a test and assignment operator. There are three regular
    expression operators within Perl.


    *   Match Regular Expression -  m//


    *   Substitute Regular Expression -  s///


    *   Transliterate Regular Expression - tr///


    The forward slashes in each case act as delimiters for the regular expression
    (regex) that you are specifying. If you are comfortable with any other delimiter,
    then you can use in place of forward slash.


    2.  The Match  Operator


    The match operator, m//, is used to match a string or statement to a regular expression.
    For example, to match the character sequence "foo" against the scalar $bar, you
    might use a statement like this  −


    #!/usr/bin/perl


    $bar = "This is foo and again foo"; if ($bar =~ /foo/){


    print "First time is matching\n";


    }else{


    print "First time is not matching\n";


    }


    $bar = "foo";


    if ($bar =~ /foo/){


    print "Second time is matching\n";


    }else{


    print "Second time is not matching\n";


    }


    When above program is executed, it produces the following result − First time
    is matching


    Second time is matching'
