    # 3. qw 函数


    该函数是快速指定许多单引号单词的快捷。例如，`qw(foo bar baz)` 等同于 `(''foo'', ''bar'', ''baz'')`。一些程序员觉得使用
    `qw` 让 Perl 脚本更易于读。你实际上可以使用任何一组分隔符，而不仅仅是括号。


    你只需要使用 `qw()` 来准备一个数组，如下面的示例所示。


    ### 语法

    以下是该函数的简单语法 −


    ```perl

    qw EXPR

    ```


    ### 返回值

    此函数返回一个列表，由 `LIST` 中的元素组成，这些元素的评估方式就像它们被单引号一样。


    ### 示例

    以下是显示其基本用法的示例代码 −


    ```perl

    #!/usr/bin/perl -w


    @array = qw(This is a list of words without interpolation); foreach $key (@array){


    print"Key is $key\n";


    }

    ```


    当执行上述代码时，它产生以下结果 −


    Key is This Key is is Key is a Key is list Key is of

    Key is words Key is without

    Key is interpolation


    # 4. 数组大小的确定


    数组的大小可以使用数组的标量上下文（scalar context）来确定 - 返回值将数组中元素的数量 −


    ```perl

    @array = (1,2,3);


    print "Size: ",scalar @array,"\n";

    ```


    返回值始终是数组的物理大小，而不是有效元素的数量。你可以使用此片段演示这一点，以及 `scalar @array` 和 `$#array` 之间的差异如下
    −


    ```perl

    #!/uer/bin/perl @array = (1,2,3);


    $array[50] =  4;


    $size =  @array;


    $max_index = $#array;


    print  "Size:$size\n";

    print "Max Index:  $max_index\n";

    ```


    这将产生以下结果  −


    Size: 51

    Max Index: 50


    数组中只有四个元素包含信息，但数组的长度为 51，最高索引为 50。


    # 5. 访问数组的第一个和最后一个最后一个元素


    ### Shift 函数

    此函数返回数组中的第一个值，将其删除并将数组列表的元素向左移动一位。如果没有指定 `ARRAY`，则移动子程序内的 `@_` 数组，否则移动 `@ARGV`。`shift`
    本质上与 `pop` 相同，但值是从数组的开头而不是末尾取的。


    ### 语法

    以下是该函数的简单语法 −


    ```perl

    shift ( [ARRAY] )


    shift

    ```


    ### 返回值

    如果数组为空，此函数返回 `undef`，否则返回数组中的第一个元素。


    ### 示例

    以下是显示其基本用法的示例代码 −


    ```perl

    #!/usr/bin/perl


    @array = (1..5);


    while ($element = shift(@array)) { print("$element - ");


    }


    print("The End\n");

    ```


    当执行上述代码时，它产生以下结果 −


    1 - 2 - 3 - 4 - 5 - The End


    # 6. Unshift 函数


    此函数将 `LIST` 中的元素按顺序放置在 `ARRAY` 的开头。这是 `shift()` 的相反函数。


    ### 语法

    以下是该函数的简单语法 −


    ```perl

    unshift ARRAY, LIST

    ```


    ### 返回值

    此函数返回 `ARRAY` 中新元素的数量。


    ### 示例

    以下是显示其基本用法的示例代码 −


    ```perl

    #!/usr/bin/perl -w @array = ( 1, 2, 3, 4);


    print "Value of array is @array\n" ; unshift( @array, 20, 30, 40 );


    print "Now value of array is @array\n" ;

    ```


    当执行上述代码时，它产生以下结果 −


    Value of array is 1 2 3 4

    Now value of array is 20 30 40 1 2 3 4


    # 7. Push 函数


    此函数将 `LIST` 中的值推到列表 `ARRAY` 的末尾。与 `pop` 配合实现栈。


    ### 语法

    以下是该函数的简单语法 −


    ```perl

    push ARRAY, LIST

    ```


    ### 返回值

    此函数返回新数组中元素的数量。


    ### 示例

    以下是显示其基本用法的示例代码 −


    ```perl

    #!/usr/bin/perl -w


    $, = ",";


    @array = ( 1, 2 );


    print "Before pushing elements @array \n"; push(@array, (3, 4, 5));


    print "After pushing elements @array \n";

    ```


    当执行上述代码时，它产生以下结果 −


    Before pushing elements 1 2

    After pushing elements 1 2 3 4 5


    # 8. Pop 函数


    此函数返回 `ARRAY` 的最后一个元素，从数组中移除该值。注意 `ARRAY` 必须明确是一个数组，而不是列表。


    如果省略了 `ARRAY`，它将从主程序中的 `@ARGV` 或在 `eval STRING` 调用内、或 `BEGIN`、`CHECK`、`INIT` 或
    `END` 块中弹出最后一个值。否则，它尝试从子程序内的 `@_` 数组中弹出信息。它是 `push` 的相反操作，结合使用时，允许你实现“栈”。


    注意在应用 `pop` 之后数组将缩短。


    ### 语法

    以下是该函数的简单语法 −


    ```perl

    pop ARRAY

    ```


    ### 返回值

    如果列表为空，此函数返回最后一个值，否则返回数组中的最后一个元素。


    ### 示例

    以下是显示其基本用法的示例代码 −


    ```perl

    #!/usr/bin/perl -w


    @a = (1, 2, 3);


    print("pop() ", pop(@a), "\n");

    ```


    当执行上述代码时，它产生以下结果 −


    pop() 3


    # 9. 数组切片 (Array Slices)


    数组是一个存储有序列表的变量。要引用单个元素，将使用方括号。这里有一个简单的示例：


    ```perl

    #!/usr/bin/perl


    @array = (1, 2, 3);


    print $array[0];

    print $array[1];

    ```


    # 10. Splice 函数


    此函数从 `ARRAY` 的 `OFFSET` 开始移除 `LENGTH` 个元素，并替换指定的 `LIST`。如果省略 `LENGTH`，则从那里开始移除。


    切片允许一次性访问数组的多个元素：


    ```perl

    #!/usr/bin/perl


    @ages = (25,30,40);


    @names = ("John", "Paul", "Kumar");


    print @ages[0..1];

    print @names[1..2];

    ```


    ### 语法

    以下是该函数的简单语法 −


    ```perl

    splice ARRAY, OFFSET, LENGTH, LIST splice ARRAY, OFFSET

    ```


    ### 返回值

    此函数返回 −


    *   在标量上下文中，如果没有移除元素则返回 `undef`

    *   在标量上下文中，移除的最后一个元素

    *   在列表中文中，失败时返回空列表

    *   在列表中文中，移除的元素列表


    ### 示例

    以下是显示其基本用法的示例代码 −


    ```perl

    #!/usr/bin/perl -w


    @array=("a", "e", "i", "o", "u");


    @removedItems = splice(@array, 0 , 3, ("A", "E", "I"));


    print "Removed items: @removedItems\n";

    ```


    当执行上述代码时，它产生以下结果 −


    Removed items: a e i


    # 11. 数组排序


    Perl 有名为 `sort` 的内置函数可以对数组排序。在最简单的形式下，你只需要给它一个数组，它就会返回排序后的元素。


    ```perl

    @sorted = sort @original;

    ```


    ### 比较函数

    Perl 中 `sort` 的工作方式是，它遍历原始数组的每两个元素；在每次循环中，它将左侧的值放入变量 `$a`，将右侧的值放入变量 `$b`。然后它调用一个比较函数。该“比较函数”如果
    $a$ 的内容应该在左侧则返回 1，如果 $b$ 的内容应该在左侧则返回 -1，或者如果两个值相同则无紧要，返回 0。


    默认情况下，你看不到这个比较函数，sort 根据 ASCII 表对值进行比较，但如果你愿意，可以显式地编写它：


    ```perl

    sort { $a cmp $b } @words;

    ```


    这段代码提供的结果与不带块的结果完全相同：`sort @words`。


