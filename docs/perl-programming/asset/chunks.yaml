    \ 0。在列表语境下，匹配返回任何分组表达式的内容。例如，当从时间字符串中提取小时、分钟和秒时，可以使用：\n\n```perl\nmy ($hours,\
    \ $minutes, $seconds) = ($time =~ m/(\\d+):(\\d+):(\\d+)/);\n```\n\n### 3. 匹配运算符修饰\n\
    \n匹配运算符支持自己的一组修饰。`/g` 修饰允许全局匹配。`/i` 修饰将使匹配不区分大小写。以下是修饰的完整列表：\n\n| 修饰 | 描述 |\n\
    | :--- | :--- |\n| `i` | 使匹配不区分大小写。 |\n| `m` | 指定如果字符串包含换行符或回车符，`^` 和 `$` 运算符现在将匹配换行边界，而不是字符串边界。\
    \ |\n| `o` | 仅评估一次表达式。 |\n| `s` | 允许使用 `.` 匹配换行符。 |\n| `x` | 允许在表达式中使用空白以提高清晰度。\
