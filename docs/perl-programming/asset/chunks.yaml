  trans: "\n\nlibwww-perl 请求对象的类名为 `HTTP::Request`。类名使用 `HTTP::` 作为前缀这一事实仅意味着我们使用了\
    \ HTTP 通信模型。它并不会限制我们尝试将此请求传递给什么类型的服务。例如，我们将 `HTTP::Requests` 同时发送到 `ftp` 和 `gopher`\
    \ 节点，也会发送到本地文件系统。\n\n请求对象的主要属性有：\n\n* `method` 是一个短字符串，用于说明这是什么类型的请求。最常用的方法有 `GET`、`PUT`、`POST`\
    \ 和 `HEAD`。\n* `uri` 是一个字符串，表示访问的协议、服务器以及我们想要访问的“文档”的名称。`uri` 还可能编码了其他各种参数。\n\
    * `headers` 包含关于请求的额外信息，也可用于描述内容。`headers` 是一组键值对（keyword/value pairs）。\n* `content`\
    \ 是任意长度的数据。\n\n## 响应对象 (Response Object)\n\nlibwww-perl 响应对象的类名为 `HTTP::Response`。此类对象的主要属性有：\n\
    \n* `code` 是一个数值，表示请求的总体结果。\n* `message` 是一个人类可读的短字符串，与 `code` 对应。\n* `headers`\
    \ 包含关于响应的额外信息并描述内容。\n* `content` 是任意长度的数据。\n\n由于我们不想在程序中直接处理所有可能的代码值，libwww-perl\
    \ 响应对象提供了几种方法用于查询该响应的类型。最常用的响应分类方法是：\n\n```\nis_success()\n```\n请求已被成功接收、理解或接受。\n\
    \n```\nis_error()\n```\n请求失败。服务器或资源可能不可，访问资源可能被拒绝，或者由于某些原因其他操作失败了。\n\n## 用户代理\
    \ (User Agent)\n\n假设我们已经创建了一个请求对象。为了接收响应，我们实际上对它做什么？\n\n答案是将其传递给一个用户代理对象，该对象会处理所有需要完成的工作（如底层通信和错误处理）并返回一个响应对象。用户代理代表你的应用程序在网络上的身份，并为你提供了一个可以接受请求并返回响应的接口。\n\
    \n用户代理是你的应用程序代码与网络之间的接口层。通过这个接口，你可以访问网络上的各种服务器。\n\n用户代理的类名为 `LWP::UserAgent`。每个想要通信的\
    \ libwww-perl 应用都应该至少创建一个该类的对象。该对象提供的主要方法是 `request()`。该方法接受一个 `HTTP::Request`\
    \ 对象作为参数并（最终）返回一个 `HTTP::Response` 对象。\n\n用户代理还有许多其他属性，让你配置它如何与网络以及与你的应用程序交互：\n\
    \n* `timeout` 指定了在库断开连接并创建内部超时响应之前，我们给远程服务器响应的时间。\n* `agent` 指定了你的应用程序在网络上展示自己身份时使用的名称。\n\
    * `from` 可以设置为负责运行应用程序员的电子邮件地址。如果设置了此项，则该地址将在每次请求时发送到服务器。\n* `parse_head` 指定了我们是否应该从\
    \ HTML 文档的 `<head>` 部分初始化响应头。\n* `proxyandno_proxyspecify` 指定了何时以及何时通过代理服务器进行。\n\
    * `credentials` 提供了一种设置访问某些服务所需的用户名和密码的方法。\n\n许多应用程序希望对与网络交互的方式有更强的控制力，它们通过子类\
    \ `LWP::UserAgent` 实现这一点。该库包含一个用于机器人应用的子类 `LWP::RobotUA`。\n\n## 3. 文件 – 操作文件 –\
    \ 文件模式 – 文件测试运算符\n\n* `-X FILEHANDLE`\n* `-X EXPR`\n* `-X DIRHANDLE`\n* `-X`\n\
    \n这是一个文件测试，其中 `X` 是下面列出的字母。该运算符接受一个参数（文件名、文件句柄或目录句柄），并测试关联的文件。如果省略参数，则测试 `STDIN`。除非另有说明，真时返回\
    \ `1`，假时返回空。运算符如下：\n\n1. `-r` 权限是否可读。\n2. `-w` 是否可写。\n3. `-x` 是否可执行。\n4. `-o`\
    \ 是否属于有效用户所有。\n5. `-R` 真实用户是否可读。\n6. `-W` 真实用户是否可写。\n7. `-X` 真实用户是否可执行。\n8. `-O`\
    \ 是否属于真实用户所有。\n9. `-e` 是否存在。\n10. `-z` 是否为零。\n11. `-f` 是否为普通文件。\n12. `-d` 是否为目录。\n\
    13. `-l` 是否为符号链接。\n14. `-p` 是否为命名管道（FIFO）。\n15. `-S` 是否为套接字。\n16. `-b` 是否为块设备文件。\n\
    17. `-c` 是否为字符设备文件。\n18. `-t` 文件句柄是否打开到终端。\n19. `-u` 是否设置了 UID。\n20. `-g` 是否设置了\
    \ GID。\n21. `-k` 是否设置了粘位。\n22. `-T` 是否为“二进制”文件（`-B` 的相反）。\n23. `-M` 脚本启动时间减文件修改时间，以天为单位。\n\
    24. `-A` 访问时间（Unix，其他平台可能不同）。\n25. `-C` inode 更改时间。\n\n示例：\n\n```\nwhile (<>)\
    \ {\n    chomp($_);\n    next unless -f $_; # 忽略特殊文件\n    ...\n}\n```\n\n注意 `-s/a/b/`\
    \ 并不会执行取反替换。然而，说 `-exp($foo)` 会按预期工作：只有在减号后面的单个字母才被解释为文件测试。\n\n这些运算符免受上述“看起来像函数”规则的限制。也就是说，运算符后的左括号不会影响后续代码的哪些构成参数。将左括号放在运算符之前以与后续代码分离（这仅适用于优先级高于一元运算符的运算符）：\n\
    \n```\n-s($file) + 1024 # 错误的；等同于 -s($file + 1024)\n(-s $file) + 1024 # 正确\n```\n\
    \n"
- fmt: '

    The interpretation of the file permission operators `-r`, `-R`, `-w`, `-W`, `-x`,
    and `-X` is by default based solely on the mode of the file and the `uids` and
    `gids` of the user. There may be other reasons you can''t actually read, write,
    or execute the file: for example network filesystem access controls, `ACLs` (access
    control lists), read-only filesystems, and unrecognized executable formats. Note
    that the use of these six specific operators to verify if some operation is possible
    is usually a mistake, because it may be open to race conditions.


    Also note that, for the superuser on the local filesystems, the `-r`, `-R`, `-w`,
    and `-W` tests always return 1, and `-x` and `-X` return 1 if any execute bit
    is set in the mode. Scripts run by the superuser may thus need to do a `stat()`
    to determine the actual mode of the file, or temporarily set their effective `uid`
    to something else.


    If you are using ACLs, there is a pragma called `filetest` that may produce more
    accurate results than the bare `stat()` mode bits. When under `use filetest ''access''`
    the above-mentioned filetests test whether the permission can(not) be granted
    using the `access(2)` family of system calls. Also note that the `-x` and `-X`
    may under this pragma return true even if there are no execute permission bits
    set (nor any extra execute permission ACLs). This strangeness is due to the underlying
    system calls'' definitions. Note also that, due to the implementation of `use
    filetest ''access''`, the `_` special filehandle won''t cache the results of the
    file tests when this pragma is in effect. Read the documentation for the `filetest`
    pragma for more information.


    The `-T` and `-B` switches work as follows. The first block or so of the file
    is examined to see if it is valid UTF-8 that includes non-ASCII characters. If,
    so, it''s a `-T` file. Otherwise, that same portion of the file is examined for
    odd characters such as strange control codes or characters with the high bit set.
    If more than a third of the characters are strange, it''s a `-B` file; otherwise
    it''s a `-T` file. Also, any file containing a zero byte in the examined portion
    is considered a binary file. (If executed within the scope of a `use locale` which
    includes `LC_CTYPE`, odd characters are anything that isn''t a printable nor space
    in the current locale.) If `-T` or `-B` is used on a filehandle, the current IO
    buffer is examined rather than the first block. Both `-T` and `-B` return true
    on an empty file, or a file at EOF when testing a filehandle. Because you have
    to read a file to do the `-T` test, on most occasions you want to use a `-f` against
    the file first, as in `next` unless `-f $file && -T $file`.


    If any of the file tests (or either the `stat` or `lstat` operator) is given the
    special filehandle consisting of a solitary underline `_`, then the stat structure
    of the previous file test (or `stat` operator) is used, saving a system call.
    (This doesn''t work with `-t`, and you need to remember that `lstat()` and `-l`
    leave values in the stat structure for the symbolic link, not the real file.)
    (Also, if the stat buffer was filled by an `lstat` call, `-T` and `-B` will reset
    it with the results of `stat` `_`.)


    ### Examples


    ```

    43. print "Can do.\n" if -r $a || -w _ || -x _; 44.

    45. stat($filename);

    46. print "Readable\n" if -r _;

    47. print "Writable\n" if -w _;

    48. print "Executable\n" if -x _;

    49. print "Setuid\n" if -u _;

    50. print "Setgid\n" if -g _;

    51. print "Sticky\n" if -k _;

    52. print "Text\n" if -T _;

    ```

    '
  raw: 'The interpretation of the file permission operators -r , -R , -w , -W , -x
    , and [-X](http://perldoc.perl.org/functions/-X.html) is by default based solely
    on the mode of the file and the uids and gids of the user. There may be other
    reasons you can''t actually read, write, or execute the file: for example network
    filesystem access controls, ACLs (access control lists), read-only filesystems,
    and unrecognized executable formats. Note that the use of these six specific operators
    to verify if some operation is possible is usually a mistake, because it may be
    open to race  conditions.


    Also note that, for the superuser on the local filesystems, the -r , -R , -w ,
    and -W tests always return 1, and -x and [-X](http://perldoc.perl.org/functions/-X.html)
    return 1 if any execute bit is set in the mode. Scripts run by the superuser may
    thus need to do a stat() to determine the actual mode of the file, or temporarily
    set their effective uid to something else.


    If you are using ACLs, there is a pragma called filetest that may produce more
    accurate results than the bare stat() mode bits. When under [use](http://perldoc.perl.org/functions/use.html)
    filetest ''access'' the above-mentioned filetests test whether


    the permission can(not) be granted using the access(2) family of system calls.
    Also note that the -x and [-X](http://perldoc.perl.org/functions/-X.html) may
    under this pragma return true even if there are no execute permission bits set
    (nor any extra execute permission ACLs). This strangeness is due to the underlying
    system calls'' definitions. Note also that, due to the implementation of [use](http://perldoc.perl.org/functions/use.html)
    filetest ''access'' , the _ special filehandle won''t cache the results of the
    file tests when this pragma is in effect. Read the documentation for the filetest
    pragma for more  information.


    The -T and -B switches work as follows. The first block or so of the file is examined
    to see if it is valid UTF-8 that includes non-ASCII characters. If, so it''s a
    -T file. Otherwise, that same portion of the file is examined for odd characters
    such as strange control codes or characters with the high bit set. If more than
    a third of the characters are strange, it''s a -B file; otherwise it''s a -T file.
    Also, any file containing a zero byte in the examined portion is considered a
    binary file. (If executed within the scope of a [use locale](http://perldoc.perl.org/perllocale.html)
    which includes LC_CTYPE , odd characters are anything that isn''t a printable
    nor space in the current locale.) If -T or -B is used on a filehandle, the current
    IO buffer is examined rather than the first block. Both -T and -B return true
    on an empty file, or a file at EOF when testing a filehandle. Because you have
    to read a file to do the -T test, on most occasions you want to use a -f against
    the file first, as in [next](http://perldoc.perl.org/functions/next.html) unless
    -f $file && -T $file  .


    If any of the file tests (or either the [stat](http://perldoc.perl.org/functions/stat.html)
    or [lstat](http://perldoc.perl.org/functions/lstat.html) operator) is given the
    special filehandle consisting of a solitary underline, then the stat structure
    of the previous file test (or stat operator) is used, saving a system call. (This
    doesn''t work with -t , and you need to remember that lstat() and -l leave values
    in the stat structure for the symbolic link, not the real file.) (Also, if the
    stat buffer was filled by an [lstat](http://perldoc.perl.org/functions/lstat.html)
    call, -T and -B will reset it with the results of [stat](http://perldoc.perl.org/functions/stat.html)
    _ ).  Example:


    43. [print](http://perldoc.perl.org/functions/print.html) "Can do.\n" if -r $a
    || -w _ || -x _; 44.


    45. [stat](http://perldoc.perl.org/functions/stat.html)($filename);


    46. [print](http://perldoc.perl.org/functions/print.html) "Readable\n" if -r  _;


    47. [print](http://perldoc.perl.org/functions/print.html) "Writable\n" if -w _;


    48. [print](http://perldoc.perl.org/functions/print.html) "Executable\n" if -x  _;


    49. [print](http://perldoc.perl.org/functions/print.html) "Setuid\n" if -u  _;


    50. [print](http://perldoc.perl.org/functions/print.html) "Setgid\n" if -g  _;


    51. [print](http://perldoc.perl.org/functions/print.html) "Sticky\n" if -k  _;


    52. [print](http://perldoc.perl.org/functions/print.html) "Text\n" if -T  _;


    53. [print](http://perldoc.perl.org/functions/print.html) "Binary\n" if -B  _;


    As of Perl 5.10.0, as a form of purely syntactic sugar, you can stack file test
    operators, in a way that -f -w -x $file is equivalent to -x $file && -w _ && -f
    _ . (This is only fancy syntax: if you use the return value of -f $file as an
    argument to another filetest operator, no special magic will happen.)


    Portability issues: [-X in perlport.](http://perldoc.perl.org/perlport.html#-X)


    To avoid confusing would-be users of your code with mysterious syntax errors,
    put something like this at the top of your script:


    54. [use](http://perldoc.perl.org/functions/use.html) 5.010; # so filetest ops
    can  stack


    4.  @ ARGV  variable


    ARGV array elements: In the ARGV array, $ARGV[0] contains the first argument,
    $ARGV[1] contains the second argument, etc. So if you''re just looking for one
    command line argument you can test for $ARGV[0], and if you''re looking for two
    you can also test for $ARGV[1], and so on.


    ARGV array size: The variable $#ARGV is the subscript of the last element of the
    @ARGV array, and because the array is zero-based, the number of arguments given
    on the command line is


    $#ARGV + 1.


    Perl automatically provides an array called @ARGV, that holds all the values from
    the command line. You don''t have to declare the variable, even if you use strict.


    This variable always exists and the values from the command line are automatically
    placed in this variable.


    If there are no parameters, the array will be empty. If there is one parameter
    on the command line, that value will be the only element in @ARGV. In the above
    example the @ARGV will have the following elements: -a, --machine, remote, /etc


    Let''s see this in action:


    Save this code as programming.pl:


    1. use strict;


    2. use  warnings;


    3. use Data::Dumper qw(Dumper); 4.


    5.print Dumper  \@ARGV;


    Run it like this: perl programming.pl -a --machine remote /etc and this is the
    output:


    $VAR1 = [


    ''-a'',


    ''--machine'', ''remote'', ''/etc''


    ];


    5.  CWD  Module


    Cwd - get pathname of current working directory


    SYNOPSIS


    [use](http://perldoc.perl.org/functions/use.html) Cwd;


    [my](http://perldoc.perl.org/functions/my.html) $dir = getcwd; [use](http://perldoc.perl.org/functions/use.html)
    Cwd ''abs_path'';


    [my](http://perldoc.perl.org/functions/my.html) $abs_path = abs_path($file);


    DESCRIPTION


    This module provides functions for determining the pathname of the current working
    directory. It is recommended that getcwd (or another *cwd() function) be used
    in all code to ensure portability.


    By default, it exports the functions cwd(), getcwd(), fastcwd(), and fastgetcwd()
    (and, on Win32, getdcwd()) into the caller''s namespace.


    getcwd and  friends


    Each of these functions are called without arguments and return the absolute path
    of the current working  directory.


    getcwd


    [my](http://perldoc.perl.org/functions/my.html) $cwd = getcwd();


    Returns the current working directory.


    Exposes the POSIX function getcwd(3) or re-implements it if it''s not available.
    cwd


    [my](http://perldoc.perl.org/functions/my.html) $cwd = cwd();


    The cwd() is the most natural form for the current architecture. For most systems
    it is identical to


    `pwd` (but without the trailing line terminator). fastcwd


    [my](http://perldoc.perl.org/functions/my.html) $cwd = fastcwd();


    A more dangerous version of getcwd(), but potentially faster.'
