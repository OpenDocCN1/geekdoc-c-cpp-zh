- fmt: "\n# Perl Array Operations and Loops\n\n## Foreach Loop\n\nThis illustrates\
    \ a couple of things. First, it illustrates how to iterate through an array using\
    \ the `foreach` statement. `foreach` means something like: \"For each element\
    \ in the array, do whatever is between the beginning and ending braces.\"\n\n\
    And it also illustrates a loop structure because when the program gets to the\
    \ bottom of the `foreach` loop (the last brace) it returns to the top again as\
    \ long as there are more values in the array. Once all values in the array have\
    \ been used, the loop terminates. If there were additional instructions after\
    \ the loop, the program would continue from there.\n\nNotice that the `print $greeting`\
    \ instruction now has a dot and `\\n` (in quotes) before the semicolon. `\\n`\
    \ is a newline character. It tells the interpreter to print carriage return after.\
    \ If it was not there, greetings would all run together on same line. The dot\
    \ (in context) is called concatenation operator. It joins the carriage return\
    \ with `$greeting` immediately preceding it.\n\n```perl\nif ($status eq \"leaving\"\
    ) {\n    $greeting = \"Goodbye\";\n}\nelsif ($status eq \"arriving\") {\n    $greeting\
    \ = \"Hello\";\n}\nelse {\n    $greeting = \"Nice day\";\n}\nprint $greeting .\
    \ \"\\n\";\n```\n\n### Exercise\nGoals: 1) To gain familiarity with conditionals\n\
    Instructions: Copy and run the script above that iterates through an array and\
    \ changes the value of `$greeting` based on the contents of `$status`. Then add\
    \ another `elsif` condition that changes the value of `$greeting` to \"Set yourself\
    \ down and rest\" if the value of `$status` is \"staying\".\n\n## Perl Records\n\
    \nPerl allows us to create arrays of arrays, arrays of hashes, hashes of arrays,\
    \ and hashes of hashes. These complex, nested data structures use special variables\
    \ called \"references\" to create \"records\" (and you use \"dereferences\" to\
    \ access parts of a record). We will not cover Perl references and records in\
    \ much detail, but knowing what they are and how to use dereferences to express\
    \ particular parts of records is useful when we start parsing XML.\n\nA regular\
    \ array starts out like this:\n```perl\n@a_list = ();\n```\n\nWe can add hashes\
    \ as elements in the array. The hashes don't have regular variable names but are\
    \ known as \"anonymous\" hashes:\n```perl\n@a_list = (\n    { 'key_1' => 'value_1',\
