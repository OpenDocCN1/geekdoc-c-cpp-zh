    *   Searching for similar  sequences


    *   Creating and manipulating sequence  alignments


    *   Searching for genes and other structures on genomic  DNA


    *   Developing machine readable sequence  annotations


    In addition to being used directly by end-users, BioPerl has also provided the
    base for a wide variety of bioinformatic tools, including amongst others:


    *   SynBrowse,


    *   Gene Comber, TFBS, MIMOX, BioParser, Degenerate primer design, Querying the
    public databases, Current Comparative  Table


    *   New tools and algorithms from external developers are often integrated directly
    into BioPerl  itself:


    *   Dealing with phylogenetic trees and nested taxa FPC Web tools Related Libraries
    in Other Programming  Languages.


    Several related bioinformatics libraries implemented in other programming languages
    exist as part of the [Open Bioinformatics Foundation](https://en.wikipedia.org/wiki/Open_Bioinformatics_Foundation)
    including: Biopython, BioJava, BioRuby, BioPHP, BioJS, Bioconductor, etc.


    *****


    Unit-V


    1.  INTRODUCTION TO PERL MODULES Getopt::Long - Extended processing of command
    line options SYNOPSIS


    1. use  Getopt::Long;


    2. my $data =  "file.dat";


    3. my $length =  24;


    4. my  $verbose;


    5. GetOptions ("length=i"  =>  \$length,# numeric


    6. "file=s" =>  \$data,# string


    7. "verbose" => \$verbose) # flag


    8. or die("Error in command line  arguments\n"); DESCRIPTION


    The Getopt::Long module implements an extended getopt function called GetOptions().
    It parses the command line from @ARGV , recognizing and removing specified options
    and their possible values.


    This function adheres to the POSIX syntax for command line options, with GNU 
    extensions. In general, this means that options have long names instead of single
    letters, and are introduced with a double dash "--". Support for bundling of command
    line options, as was the case with the more traditional single-letter approach,
    is provided but not enabled by default.


    Command Line Options, an Introduction


    Command line operated programs traditionally take their arguments from the command
    line, for example filenames or other information that the program needs to know.
    Besides arguments, these programs often take command line options as well. Options
    are  not


    necessary for the program to work, hence the name ''option'', but are used to
    modify its default behaviour. For example, a program could do its job quietly,
    but with a suitable option it could provide verbose information about what it  did.


    Command line options come in several flavours. Historically, they are preceded
    by a single dash - , and consist of a single letter.


    1. -l -a  -c


    Usually, these single-character options can be bundled:


    1. -lac


    Options can have values, the value is placed after the option character. Sometimes
    with whitespace in between, sometimes not:


    1.-s 24  -s24


    Due to the very cryptic nature of these options, another style was developed that
    used long names. So instead of a cryptic -l one could use the more descriptive
    --long . To distinguish between a bundle of single-character options and a long
    one, two dashes are used to precede the option name. Early implementations of
    long options used a plus + instead. Also, option values could be specified either
    like


    1.--size=24 or


    1. --size  24


    The + form is now obsolete and strongly deprecated.


    Getting Started with Getopt::Long


    Getopt::Long is the Perl5 successor of newgetopt.pl . This was the first Perl
    module that provided support for handling the new style of command line options,
    in particular long


    option names, hence the Perl5 name Getopt::Long. This module also supports single-
    character options and bundling.


    To use Getopt::Long from a Perl program, you must include the following line in
    your Perl program:


    1.use  Getopt::Long;


    This will load the core of the Getopt::Long module and prepare your program for
    using it. Most of the actual Getopt::Long code is not loaded until you really
    call one of its functions.


    In the default configuration, options names may be abbreviated to uniqueness,
    case does not matter, and a single dash is sufficient, even for long option names.
    Also, options may be placed between non-option arguments.


    Simple options


    The most simple options are the ones that take no values. Their mere presence
    on the command line enables the option. Popular examples are:


    1.--all --verbose --quiet --debug Handling simple options is  straightforward:


    1. my $verbose  =  '''';# option variable with default value  (false)


    2. my $all  = '''';# option variable with default value  (false)


    3. GetOptions (''verbose'' => \$verbose, ''all'' =>  \$all);


    The call to GetOptions() parses the command line arguments that are present in
    @ARGV and sets the option variable to the value 1 if the option did occur on the
    command line. Otherwise, the option variable is not touched. Setting the option
    value to true is often called enabling the option.'
