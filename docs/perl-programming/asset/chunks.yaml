    \ and again foo\"; if ($bar =~ m[foo]){\n    print \"First time is matching\\\
    n\";\n}else{\n    print \"First time is not matching\\n\";\n}\n\n$bar = \"foo\"\
    ;\nif ($bar =~ m{foo}){\n    print \"Second time is matching\\n\";\n}else{\n \
    \   print \"Second time is not matching\\n\";\n}\n```\n\n如果分隔符是正斜杠，你可以从 `m//`\
    \ 中省略 `m`，但对于所有其他分隔符，你必须使用 `m` 前缀。\n\n注意，整个匹配表达式（即 `=~` 或 `!~` 左侧的表达式加上匹配运算符）在表达式匹配时会返回真（在标量语境下）。因此，下述语句：\n\
    \n```perl\n$true = ($foo =~ m/foo/);\n```\n\n如果 `$foo` 匹配正则，则将 `$true` 设置为 1；如果匹配失败，则为\
    \ 0。在列表语境下，匹配返回任何分组表达式的内容。例如，当从时间字符串中提取小时、分钟和秒时，可以使用：\n\n```perl\nmy ($hours,\
    \ $minutes, $seconds) = ($time =~ m/(\\d+):(\\d+):(\\d+)/);\n```\n\n### 3. 匹配运算符修饰\n\
    \n匹配运算符支持自己的一组修饰。`/g` 修饰允许全局匹配。`/i` 修饰将使匹配不区分大小写。以下是修饰的完整列表：\n\n| 修饰 | 描述 |\n\
