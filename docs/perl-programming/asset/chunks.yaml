  trans: "\n\n`m//` 的工作方式与 `q//` 运算符系列相同。你可以使用任何自然匹配的字符组合作为表达式的分隔符。例如，`m{}`、`m()`\
    \ 和 `m><` 都是有效的。上面的示例可以重写为：\n\n```perl\n#!/usr/bin/perl\n$bar = \"This is foo\
    \ and again foo\"; if ($bar =~ m[foo]){\n    print \"First time is matching\\\
    n\";\n}else{\n    print \"First time is not matching\\n\";\n}\n\n$bar = \"foo\"\
    ;\nif ($bar =~ m{foo}){\n    print \"Second time is matching\\n\";\n}else{\n \
    \   print \"Second time is not matching\\n\";\n}\n```\n\n如果分隔符是正斜杠，你可以从 `m//`\
    \ 中省略 `m`，但对于所有其他分隔符，你必须使用 `m` 前缀。\n\n注意，整个匹配表达式（即 `=~` 或 `!~` 左侧的表达式加上匹配运算符）在表达式匹配时会返回真（在标量语境下）。因此，下述语句：\n\
    \n```perl\n$true = ($foo =~ m/foo/);\n```\n\n如果 `$foo` 匹配正则，则将 `$true` 设置为 1；如果匹配失败，则为\
    \ 0。在列表语境下，匹配返回任何分组表达式的内容。例如，当从时间字符串中提取小时、分钟和秒时，可以使用：\n\n```perl\nmy ($hours,\
    \ $minutes, $seconds) = ($time =~ m/(\\d+):(\\d+):(\\d+)/);\n```\n\n### 3. 匹配运算符修饰\n\
    \n匹配运算符支持自己的一组修饰。`/g` 修饰允许全局匹配。`/i` 修饰将使匹配不区分大小写。以下是修饰的完整列表：\n\n| 修饰 | 描述 |\n\
    | :--- | :--- |\n| `i` | 使匹配不区分大小写。 |\n| `m` | 指定如果字符串包含换行符或回车符，`^` 和 `$` 运算符现在将匹配换行边界，而不是字符串边界。\
    \ |\n| `o` | 仅评估一次表达式。 |\n| `s` | 允许使用 `.` 匹配换行符。 |\n| `x` | 允许在表达式中使用空白以提高清晰度。\
    \ |\n| `g` | 全局查找所有匹配项。 |\n| `cg` | 允许在全局匹配失败后继续搜索。 |\n\n#### 仅匹配一次\n\n匹配运算符还有一个更简单的版本\
    \ - `?PATTERN?` 运算符。这基本上与 `m//` 运算符相同，不同之处在于它在每次调用重置之前只在搜索的字符串中匹配一次。\n\n例如，你可以使用它来获取列表中的第一个和最后一个元素：\n\
    \n```perl\n#!/usr/bin/perl\n@list = qw/food foosball subeo footnote terfoot canic\
    \ footbrdige/; foreach (@list) {\n    $first = $1 if ?(foo.*)?;\n    $last = $1\
    \ if /(foo.*)/;\n}\nprint \"First: $first, Last: $last\\n\";\n```\n\n执行上述程序时，它会产生以下结果：`First:\
    \ food, Last: footbrdige`。\n\n### 4. 正则表达式变量\n\n正则表达式变量包括 `$&`，它包含整个匹配字符串；`` `\
    \ ```，它包含匹配字符串之前的所有内容；以及 `` `'` ，它包含匹配字符串之后的所有内容。`$` 包含最后一次分组匹配的内容。以下代码演示了结果：\n\
    \n```perl\n#!/usr/bin/perl\n$string = \"The food is in the salad bar\";\n$string\
    \ =~ m/foo/; print \"Before: $`\\n\"; print \"Matched: $&\\n\"; print \"After:\
    \  $'\\n\";\n```\n\n执行上述程序时，它会产生以下结果：\nBefore: The\nMatched: foo\nAfter: d is\
    \ in the salad bar\n\n### 5. 替换运算符\n\n替换运算符 `s///` 实际上是匹配运算符的扩展，允许你将匹配到的文本替换为新文本。该运算符的形式为：`s/PATTERN/REPLACEMENT/`。\n\
    \n`PATTERN` 是我们要查找的文本的正则表达式。`REPLACEMENT` 是我们用于替换所找到文本的文本或正则表达式规范。例如，我们可以使用以下正则表达式将所有的\
    \ dog 替换为 cat：\n\n```perl\n#!/usr/bin/perl\n$string = \"The cat sat on the mat\"\
    ;\n$string =~ s/cat/dog/;\nprint \"$string\\n\";\n```\n\n执行上述程序时，它产生以下结果：`The\
    \ dog sat on the mat`。\n\n#### 替换运算符修饰\n\n以下是用于替换运算符的所有修饰符列表：\n\n| 修饰 | 描述 |\n\
    | :--- | :--- |\n| `i` | 使匹配不区分大小写。 |\n| `m` | 指定如果字符串包含换行符或回车符，`^` 和 `$` 运算符现在将匹配换行边界，而不是字符串边界。\
    \ |\n| `o` | 仅评估一次表达式。 |\n| `s` | 允许使用 `.` 匹配换行符。 |\n| `x` | 允许在表达式中使用空白以提高清晰度。\
    \ |\n| `g` | 将找到的所有表达式出现处替换为替换文本。 |\n| `e` | 将替换内容像 Perl 语句一样进行评估，并使用其返回值作为替换文本。\
    \ |\n\n### 6. 翻译运算符\n\n（注：此处原文为 Translation Operator，译为翻译运算符）\n\n你可以使用任何自然匹配的字符组合作为表达式的分隔符。例如，`m{}`、`m()`\
    \ 和 `m><` 都是有效的。\n\n`m//` 的工作方式与 `q//` 运算符系列相同。你可以使用任何自然匹配的字符组合作为表达式的分隔符。例如，`m{}`、`m()`\
    \ 和 `m><` 都是有效的。上面的示例可以重写为如下：\n\n```perl\n#!/usr/bin/perl\n$bar = \"This is foo\
