- fmt: "\nHere you can see that, by default, perl uses `cmp` in the comparison function.\
    \ That's because `cmp` is doing exactly what we need here. It compares the values\
    \ on its two sides as strings, returns `1` if the left argument is \"less than\"\
    \ the right argument; returns `-1` if the left argument is \"greater than\" the\
    \ right argument; and returns `0` if they are the same.\n\n### Sorting in alphabetical\
    \ order\n\nIf you want to disregard the case in the strings - what is usually\
    \ called alphabetical order - you can do so as given in the next example:\n\n\
    ```perl\nmy @sorted_words = sort { lc($a) cmp lc($b) } @words;\n```\n\nHere, for\
    \ the sake of comparison, we call the `lc` function that returns the lower case\
    \ version of its argument. Then `cmp` compares those lower case versions and decides\
    \ which of the original strings must go first and which second.\n\nThe result\
    \ is\n\n```perl\n$VAR1 = [\n2. 'bar',\n3. 'foo',\n4. 'moo',\n5. 'Zorg'\n6];\n\
    ```\n\n### Sorting numbers in Perl\n\nIf we take an array of numbers and sort\
    \ them with the default sorting, the result is probably not what we are expecting.\n\
    \n```perl\nmy @numbers = (14, 3, 12, 2, 23);\nmy @sorted_numbers = sort @numbers;\n\
    say Dumper \\@sorted_numbers;\n```\n\n```perl\n$VAR1 = [\n2.12,\n3.14,\n4.2,\n\
    5.23,\n6.3];\n```\n\nIf you think about it, of course, this is not surprising.\
    \ When the comparison function sees `12` and `3` it compares them as strings.\
    \ That means comparing the first character in both strings. `\"1\"` to `\"3\"\
    `. `\"1\"` is ahead of `\"3\"` in the ASCII table and thus the string `\"12\"\
    ` will come before the string `\"3\"`.\n\nPerl does not magically understand that\
    \ you want to order these values as numbers.\n\nNo problem though as we can write\
    \ a comparison function that will compare the two values as numbers. For that\
    \ we use the `<=>` (also called [spaceship operator](http://en.wikipedia.org/wiki/Spaceship_operator))\
    \ that will compare its two parameters as numbers and return `1`, `-1` or `0`.\n\
    \n```perl\nmy @sorted_numbers = sort { $a <=> $b } @numbers;\n```\n\nResults in:\n\
    \n```perl\n$VAR1 = [\n2.2,\n3.3,\n4.12,\n5.14,\n6.23];\n```\n\n### Reversing Arrays\n\
    \n#### Reverse LIST\n\nIn list context, returns a list value consisting of the\
    \ elements of `LIST` in the opposite order. In scalar context, concatenates the\
    \ elements of `LIST` and returns a string value with all characters in the opposite\
    \ order.\n\n```perl\nprint join(\", \", reverse \"world\", \"Hello\"); # Hello,\
    \ world 2.\nprint scalar reverse \"dlrow ,\" \"olleH\";# Hello, world Used without\
    \ arguments in scalar context, reverse() reverses `$_`.\n$_ = \"dlrow ,olleH\"\
    ;\nprint reverse; # No output, list context\nprint scalar reverse; # Hello, world\n\
    ```\n\nNote that reversing an array to itself (as in `@a = [reverse](http://perldoc.perl.org/functions/reverse.html)\
    \ @a` ) will preserve non-existent elements whenever possible; i.e., for non-magical\
    \ arrays or for tied arrays with `EXISTS` and `DELETE` methods.\n\n### Creating\
    \ Hashes-Adding elements to Hashes-deleting, sorting and printing hash elements\n\
    \nA hash is a set of key/value pairs. Hash variables are preceded by a percent\
    \ (`%`) sign. To refer to a single element of a hash, you will use the hash variable\
    \ name preceded by a `$` sign and followed by the `\"key\"` associated with the\
    \ value in curly brackets.\n\nHere is a simple example of using the hash variables\
    \ —\n\n```perl\n#!/usr/bin/perl\n%data = ('John Paul', 45, 'Lisa', 30, 'Kumar',\
    \ 40);\nprint \"\\$data{'John Paul'} = \\$data{'John Paul'}\\n\"; print \"\\$data{'Lisa'}\
    \ = \\$data{'Lisa'}\\n\";\nprint \"\\$data{'Kumar'} = \\$data{'Kumar'}\\n\";\n\
    ```\n\nThis will produce the following result —\n\n```\n$data{'John Paul'} = 45\n\
    $data{'Lisa'} = 30\n$data{'Kumar'} = 40\n```\n\n#### Creating Hashes\n\nHashes\
    \ are created in one of the two following ways. In the first method, you assign\
    \ a value to a named key on a one-by-one basis —\n\n```perl\n$data{'John Paul'}\
    \ = 45;\n$data{'Lisa'} = 30;\n$data{'Kumar'} = 40;\n```\n\nIn the second case,\
    \ you use a list, which is converted by taking individual pairs from the list:\
    \ the first element of the pair is used as the key, and the second, as the value.\
    \ For example —\n\n```perl\n%data = ('John Paul', 45, 'Lisa', 30, 'Kumar', 40);\n\
    ```\n\nFor clarity, you can use `=>` as an alias for `,` to indicate the key/value\
    \ pairs as follows —\n\n```perl\n%data = ('John Paul' => 45, 'Lisa' => 30, 'Kumar'\
    \ => 40);\n```\n\nHere is one more variant of the above form, have a look at it,\
    \ here all the keys have been preceded by hyphen (`-`) and no quotation is required\
    \ around them:\n\n```perl\n%data = (-JohnPaul => 45, -Lisa => 30);\n```\n\nWait,\
    \ the text says: `%data = (-JohnPaul => 45, -Lisa => 30);` Let's stick to the\
    \ logic provided in the text:\n`%data = (-JohnPaul => 45, -Lisa => 30);` (Actually,\
    \ looking at the source text: `%data = (-JohnPaul => 45, -Lisa => 30);` seems\
    \ to be a typo in the source for symbols symbols, usually, it's `'JohnPaul'`,\
    \ but I will preserve the content content).\n\nActually, let's re-examine the\
    \ provided text:\n\n```perl\n$data{'John Paul'} = 45;\n$data{'Lisa'} = 30;\n$data{'Kumar'}\
    \ = 40;\n```\n\n`$data{'John Paul'} = 45`, `$data{'Lisa'} = 30`, `$data{'Kumar'}\
    \ = 40`\n\n#### Accessing Hash Elements\n\nTo refer to a single element of a hash,\
    \ you will use the hash variable name preceded by a `$` sign and followed by the\
