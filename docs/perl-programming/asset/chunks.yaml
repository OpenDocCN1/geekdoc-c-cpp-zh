    $time =~ m/(\d+):(\d+):(\d+)/;

    my ($hours, $minutes, $seconds) = ($1, $2, $3);

    print "Hours : $hours, Minutes: $minutes, Second: $seconds\n";

    ```

    执行上述程序时，它产生以下结果 − Hours : 12, Minutes: 05, Second: 30


