  trans: "\n它可能通过 `chdir()` 将你带出一个它无法通过 `chdir()` 返回的目录。如果 `fastcwd` 遇到问题，它将返回 `undef`，但可能会将你留在不同的目录中。为了额外的安全措施，如果一切看起来运行正常，`fastcwd()`\
    \ 函数将检查它是否将你留在与开始时相同的目录。如果发生了变化，它将[报错（die）](http://perldoc.perl.org/functions/die.html)\
    \ 并显示消息“Unstable directory path, current directory changed unexpectedly”。这种情况永远不应该发生。\n\
    \n### fastgetcwd\n\n```perl\nmy $cwd = fastgetcwd();\n```\n\n`fastgetcwd()` 函数作为\
    \ `cwd()` 的同义词提供。\n\n getdcwd\n\n```perl\nmy $cwd = getdcwd();\nmy $cwd = getdcwd('C:');\n\
    ```\n\nWin32 上提供了 `getdcwd()` 函数，用于获取指定驱动器上的当前工作目录，因为 Windows 为每个驱动器维护一个独立的当前工作目录。如果没有指定驱动器，则假设为当前驱动器。\n\
    \n此函数简单地调用了 Microsoft C 库的 `_getdcwd()` 函数。\n\n### abs_path and friends\n\n这些函数仅在请求时导出。它们各接受一个参数并返回该参数的绝对路径。如果没有给出参数，它们将使用当前工作目录。\n\
    \n#### abs_path\n\n```perl\nmy $abs_path = abs_path($file);\n```\n\n使用与 `getcwd()`\
    \ 相同的算法。符号链接和相对路径组件（`.` 和 `..`）会被解析并返回规范路径，就像 `realpath(3)` 一样。\n\n#### realpath\n\
    \n```perl\nmy $abs_path = realpath($file);\n```\n\n`abs_path()` 的同义词。\n\n####\
    \ fast_abs_path\n\n```perl\nmy $abs_path = fast_abs_path($file);\n```\n\n更危险但可能更快的\
    \ `abs_path` 版本。\n\n### $ENV{PWD}\n\n如果你请求覆盖内置的 `chdir()` 函数，即 `use Cwd qw(chdir);`，那么你的\
    \ `PWD` 环境变量将保持更新。请注意，只有当所有使用 `chdir` 的包都从 `Cwd` 导入它时，它才会保持更新。\n\n由于某些操作系统上的路径分隔符不同（Unix\
    \ 上为 `/`，MacPerl 上为 `:` 等），我们建议在任何涉及移植性的地方使用 `File::Spec` 模块。\n\n实际上，在 Mac OS\
    \ 上，`getcwd()`、`fastgetcwd()` 和 `fastcwd()` 函数都是 `cwd()` 函数的别名，后者在 Mac OS 上调用\
    \ `pwd`。同样，`abs_path()` 函数是 `fast_abs_path()` 的别名。\n\n## 6. Perl 系统函数\n\n`system()`\
    \ 函数通过派生子进程并等待子进程完成来执行执行操作系统命令，并为子进程返回某种退出状态供你进行测试。\n\n`system()` 函数的参数可以采取三种形式（括号可选）：\n\
    \n1. `system($STRING);`\n2. `system($PROGRAM, @ARGUMENT_LIST);`\n3. `system {\
    \ $PROGRAM } $FAUX_PROGRAM, @ARGUMENT_LIST`\n\n第一种形式是最常用的。决定你使用哪种形式（或 Perl 实际上使用哪种形式）取决于你尝试执行的命令是否包含\
    \ shell 元字符。Shell 元字符包括管道、重定向和语句分隔符等，例如：`(ps -aux | column 1 > pids); date`。具体字符为：`&\
    \ ; ` ' \\ \" | * ? ~ < > ^ ( ) [ ] { } $ \\n \\r`\n\n如果你尝试执行的操作系统命令使用了这些任何字符，你必须使用第一种形式，例如：\n\
    \n```perl\nsystem (\"$tace < $tcmd > $tout\");\n```\n\n在这种，唯一的字符串参数被传递给命令 shell。要记住的一点是，一旦引入了\
    \ `system()` 函数，你的脚本在不修改的情况下无法移植到运行在 Windows 以及可能的 Unix 操作系统上的 Perl。\n\n## 7.\
    \ Perl 子程序和函数\n\nPerl 子程序或函数组共同执行任务的语句。你可以将代码分成不同的子程序。如何在不同子程序之间划分代码取决于你，但在逻辑上，划分通常是每个函数执行一个特定的任务。\n\
    \nPerl 交替使用子程序（subroutine）、方法（method）和函数（function）。\n\n### 定义和调用子程序\n\nPerl 语言中子程序定义的通用形式如下：\n\
    \n```perl\nsub subroutine_name{\n    子程序的主体\n}\n```\n\n调用该 Perl 子程序的典型方式如下：\n\n\
    ```perl\nsubroutine_name( 参数列表 );\n```\n\n在 5.0 之前的 Perl 版本中，调用子程序的语法略有不同，如下所示。在最新的\
    \ Perl 版本中仍然有效，但不建议这样做，因为它跳过了子程序的原型检查（prototypes）。\n\n```perl\n&subroutine_name(\
    \ 参数列表 );\n```\n\n让我们来看下面的这个示例，它定义了一个简单的函数然后调用了它。因为 Perl 在执行程序之前会编译你的程序，所以你在哪里声明子程序并不重要。\n\
    \n```perl\n#!/usr/bin/perl\n\n# 函数定义\nsub Hello{\n    print \"Hello, World!\\\
    n\";\n}\n\n# 函数调用\nHello();\n```\n\n当执行上述程序时，它产生：`Hello, World!`\n\n### 向子程序传递参数\n\
    \n你可以像在任何其他语言中向子程序传递各种参数，并在函数内部使用特殊数组 `@_` 进行访问。\n\n函数的第一个参数在 `$[0]` 中，第二个在 `$[1]`\
    \ 中，以此此类推。你可以像传递标量一样传递数组和哈希作为参数，但传递多个数组或哈希通常会导致它们丢失身份标识。因此，我们将使用引用（references）来传递任何数组或哈希。\n\
    \n让我们尝试下面的示例，它接收一个数字列表然后打印它们的平均值：\n\n```perl\n#!/usr/bin/perl\n\nsub Average{\n\
    \    # 获取传递的参数总数。\n    $n = scalar(@_);\n    $sum = 0;\n    foreach $item (@_){\n\
    \        $sum += $item;\n    }\n    $average = $sum / $n;\n    print \"Average\
    \ for the given numbers : $average\\n\";\n}\n\n# 函数调用\nAverage(10, 20, 30);\n\
    ```\n\n当执行上述程序时，它产生：`Average for the given numbers : 20`\n\n### 向子程序传递列表\n\n由于\
    \ `@_` 变量是一个数组，它可以用于向子程序提供列表。然而，由于 Perl 接受和解析列表的方式，从 `@_` 提取单个元素可能是困难的。如果你必须和标量一起传递列表，请将列表作为最后一个参数，如下所示：\n\
    \n```perl\n#!/usr/bin/perl\n\nsub PrintList{\n    my @list = @_;\n    print \"\
    Given list is @list\\n\";\n}\n\n$a = 10;\n@b = (1, 2, 3, 4);\n\n# 带列表参数调用\nPrintList($a,\
    \ @b);\n```\n\n当执行上述程序时，它产生：`Given list is 10 1 2 3 4`\n\n### 向子程序传递哈希\n\n当你向接受列表的子程序或操作符提供哈希时，哈希会被自动转换为键值对的列表。例如：\n\
    \n```perl\n#!/usr/bin/perl\n\nsub PrintHash{\n    my (%hash) = @_;\n    foreach\
    \ my $key ( keys %hash ){ \n        my $value = $hash{$key}; \n        print \"\
    $key : $value\\n\";\n    }\n}\n\n%hash = ('name' => 'Tom', 'age' => 19);\n\n#\
    \ 带哈希参数调用\nPrintHash(%hash);\n```\n\n当执行上述程序时，它产生：\nname : Tom\nage : 19\n\n###\
    \ 从子程序返回数值\n\n你可以像在任何其他编程语言中从子程序返回数值。如果你没有从子程序返回数值，那么子程序中最后执行的任何计算结果都将自动成为返回值。\n\
    \n你可以像返回标量一样从子程序返回数组和哈希，但返回多个数组或哈希通常会导致它们丢失身份标识。因此，我们将使用引用（在下一章中解释）从函数返回任何数组或哈希。\n"
