    \ `(0x08)` when inside brackets. |\n| `\\B` | Matches nonword boundaries. |\n\
    | `\\n`, `\\t`, etc. | Matches newlines, carriage returns, tabs, etc. |\n| `\\\
    1...\\9` | Matches nth grouped subexpression. |\n| `\\10` | Matches nth grouped\
