- fmt: "\n| [continue statement](http://www.tutorialspoint.com/perl/perl_continue_statement.htm)\
    \ | A continue `BLOCK`, it is always executed just before the conditional is about\
    \ to be evaluated again. |\n| [redo statement](http://www.tutorialspoint.com/perl/perl_redo_statement.htm)\
    \ | The `redo` command restarts the loop block without evaluating the conditional\
    \ again. The continue block, if any, is not executed. |\n| [goto statement](http://www.tutorialspoint.com/perl/perl_goto_statement.htm)\
    \ | Perl supports a `goto` command with three forms: `goto label`, `goto expr`,\
    \ and `goto &name`. |\n\n## 3. The Infinite Loop\n\nA loop becomes infinite loop\
    \ if a condition never becomes false. The `for` loop is traditionally used for\
    \ this purpose. Since none of the three expressions that form the `for` loop are\
    \ required, you can make an endless loop by leaving the conditional expression\
    \ empty.\n\n```perl\n#!/usr/local/bin/perl\nfor( ; ; )\n{\n    printf \"This loop\
    \ will run forever.\\n\";\n}\n```\n\nYou can terminate the above infinite loop\
    \ by pressing the `Ctrl + C` keys.\n\nWhen the conditional expression is absent,\
    \ it is assumed to be true. You may have an initialization and increment expression,\
    \ but as a programmer more commonly use the `for (;;)` construct to signify an\
    \ infinite loop.\n\nPerl conditional statements helps in the decision making,\
    \ which require that the programmer specifies one or more conditions to be evaluated\
    \ or tested by the program, along with a statement or statements to be executed\
    \ if the condition is determined to be true, and optionally, other statements\
    \ to be executed if the condition is determined to be false.\n\nFollowing is the\
    \ general from of a typical decision making structure found in most of the programming\
    \ languages —\n\n![](Images/image00475.jpeg)\n\nThe number `0`, the strings `'0'`\
    \ and `\" \"`, the empty list `()`, and `undef` are all false in a boolean context\
    \ and all other values are true. Negation of a true value by `!` or `not` returns\
    \ a special false value.\n\nPerl programming language provides the following types\
    \ of conditional statements.\n\n| Statement | Description |\n| :--- | :--- |\n\
    | `if` statement | An `if` statement consists of a boolean expression followed\
    \ by one or more statements. |\n| `if...else` statement | An `if` statement can\
    \ be followed by an optional `else` statement. |\n| `if...elsif...else` statement\
    \ | An `if` statement can be followed by an optional `elsif` statement and then\
    \ by an optional `else` statement. |\n| `unless` statement | An `unless` statement\
    \ consists of a boolean expression followed by one or more statements. |\n| `unless...else`\
    \ statement | An `unless` statement can be followed by an optional `else` statement.\
    \ |\n\n## 4. PERL Scoping of Variable\n\nThere are two major variable types in\
    \ Perl. One of them is the package global variable declared either with the now\
    \ obsolete `use vars` construct or with `our`.\n\nThe other one is the lexical\
    \ variable declared with `my`.\n\nLet's see what happens when you declare a variable\
    \ using `my`? In which parts of the code will that variable be visible? In other\
    \ words, what is the scope of the variable?\n\n### Variable scope: enclosing block\n\
    \n```perl\n#!/usr/bin/perl\nuse strict;\nuse warnings;\n{\n    my $email = 'foo@bar.com';\n\
    \    print \"$email\\n\"; # [foo@bar.com]\n}\n# print $email;\n# $email does not\
    \ exists\n# Global symbol \"$email\" requires explicit package name at ...\n```\n\
    \nInside the anonymous block (the pair of curly braces `{}`), first we see the\
    \ declaration of a new variable called `$email`. This variable exists between\
    \ the point of its declaration till the end of the block. Thus the line after\
    \ the closing curly brace `}` had to be commented out. If you removed the `#`\
    \ from the `# print $email;` line, and tried to run the script, you'd get the\
    \ following compile-time error: Global symbol \"$email\" requires explicit package\
    \ name at ....\n\nIn other words, the scope of every variable declared with `my`\
    \ is the enclosing block.\n\n### Variable scope: visible everywhere\n\nThe variable\
    \ `$lname` is declared at the beginning of the code. It will be visible till the\
    \ end of the file everywhere. Even inside blocks. Even if those are function declarations.\
    \ If we change the variable inside the block, that will change the value for the\
    \ rest of the code. Even when you leave the block:\n\n```perl\n#!/usr/bin/perl\n\
    use strict;\nuse warnings;\nmy $lname = \"Bar\";\nprint \"$lname\\n\"; # Bar\n\
    {\n    print \"$lname\\n\"; # Bar\n    $lname = \"Other\";\n    print \"$lname\\\
    n\"; # Other\n}\nprint \"$lname\\n\"; # Other\n```\n\n### Variable hidden by other\
    \ declaration\n\n```perl\n#!/usr/bin/perl\nuse strict;\nuse warnings;\nmy $fname\
    \ = \"Foo\";\nprint \"$fname\\n\"; # Foo\n{\n    print \"$fname\\n\"; # Foo\n\
    \    my $fname = \"Other\";\n    print \"$fname\\n\"; # Other\n}\nprint \"$fname\\\
    n\"; # Foo\n```\n\nIn this case the variable `$fname` is declared at the beginning\
    \ of the code. As written earlier, it will be visible till the end of the file\
    \ everywhere, except in places where they are hidden by locally declared variables\
    \ with the same name. Inside the block we used `my` to declare another variable\
    \ with the same name. This will effectively hide the `$fname` declared outside\
    \ the block till we leave the block. At the end of the block `}`, the `$fname`\
    \ declared inside will be destroyed and the original `$fname` will be accessible\
    \ again. Same name in multiple blocks You can freely use the same variable name\
    \ in multiple blocks. These variables have no connection to each other.\n\n```perl\n\
    #!/usr/bin/perl\nuse strict;\nuse warnings;\n{\n    my $name = \"Foo\";\n    print\
    \ \"$name\\n\"; # Foo\n}\n{\n    my $name = \"Other\";\n    print \"$name\\n\"\
    ; # Other\n}\n```\n\n### In-file package declaration\n\nThis a bit more advanced\
    \ example, but it might be important to mention it here:\n\nPerl allows us to\
    \ switch between name-spaces using the `package` keyword inside a file. A package\
    \ declaration does NOT provide scope. If you declare a variable in the implicit\
    \ main package which is just the regular body of your script, that `$fname` variable\
    \ will be visible even in other name-spaces in the same file.\n\nIf you declare\
    \ a variable called `$lname` in the `Other` name-space, it will be visible when\
    \ later you might switch back to the main name-space. If the package `Other` declaration\
    \ was in another file, then the variables would have separate scope created by\
    \ the file.\n\n```perl\n#!/usr/bin/perl\nuse strict;\nuse warnings;\nmy $fname\
    \ = \"Foo\";\nprint \"$fname\\n\"; # Foo\npackage Other;\nuse strict;\nuse warnings;\n\
    print \"$fname\\n\"; # Foo\nmy $lname = 'Bar';\nprint \"$lname\\n\"; # Bar\n\n\
    package main;\nprint \"$fname\\n\"; # Foo\nprint \"$lname\\n\"; # Bar\n```\n\n\
    ## 5. Bioperl and its applications\n\nBioPerl is a collection of Perl modules\
    \ that facilitate the development of Perl scripts for bioinformatics applications.\
    \ It has played an integral role in the Human Genome Project. BioPerl is an active\
    \ open source software project supported by the Open Bioinformatics Foundation.\n"
