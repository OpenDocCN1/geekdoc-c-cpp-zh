  raw: 'It might conceivably chdir() you out of a directory that it can''t chdir()
    you back into. If fastcwd encounters a problem it will return undef but will probably
    leave you in a different directory. For a measure of extra security, if everything
    appears to have worked, the fastcwd() function will check that it leaves you in
    the same directory that it started in. If it has changed it will [die](http://perldoc.perl.org/functions/die.html)
    with the message "Unstable directory path, current directory changed unexpectedly".
    That should never happen.


    fastgetcwd


    [my](http://perldoc.perl.org/functions/my.html) $cwd = fastgetcwd();


    The fastgetcwd() function is provided as a synonym for cwd(). getdcwd


    [my](http://perldoc.perl.org/functions/my.html) $cwd = getdcwd(); [my](http://perldoc.perl.org/functions/my.html)
    $cwd =  getdcwd(''C:'');


    The getdcwd() function is also provided on Win32 to get the current working directory
    on the specified drive, since Windows maintains a separate current working directory
    for each drive. If no drive is specified then the current drive is  assumed.


    This function simply calls the Microsoft C library _getdcwd() function. abs_path
    and friends


    These functions are exported only on request. They each take a single argument
    and return the absolute pathname for it. If no argument is given they''ll use
    the current working  directory.


    abs_path


    [my](http://perldoc.perl.org/functions/my.html) $abs_path = abs_path($file);


    Uses the same algorithm as getcwd(). Symbolic links and relative-path components
    ("." and "..") are resolved to return the canonical pathname, just like realpath(3).


    realpath


    [my](http://perldoc.perl.org/functions/my.html) $abs_path = realpath($file); A
    synonym for abs_path(). fast_abs_path


    [my](http://perldoc.perl.org/functions/my.html) $abs_path = fast_abs_path($file);


    A more dangerous, but potentially faster version of abs_path.


    $ENV{PWD}


    If you ask to override your chdir() built-in function, [use](http://perldoc.perl.org/functions/use.html)
    Cwd qw(chdir);


    then your PWD environment variable will be kept up to date. Note that it will
    only be kept up to date if all packages which use chdir import it from  Cwd.


    Since the path separators are different on some operating systems (''/'' on Unix,
    '':'' on MacPerl, etc...) we recommend you use the File::Spec modules wherever
    portability is a concern.


    Actually, on Mac OS, the getcwd() , fastgetcwd() and fastcwd() functions are all
    aliases for the cwd() function, which, on Mac OS, calls `pwd`. Likewise, the abs_path()
    function is an alias for fast_abs_path() .


    6.  Perl System  Function


    The system() function executes an operating system command by forking a child
    process and waiting for the child process to complete, returning some sort of
    exit status for the child that you can test.


    The arguments to the system() function can take three forms (parenthesis optional):


    1. system($STRING);


    2. system($PROGRAM,  @ARGUMENT_LIST);


    3. system { $PROGRAM } $FAUX_PROGRAM,  @ARGUMENT_LIST


    The first form is the most commonly used. What determines which form you use (or
    which Perl will really use) depends on whether the command you''re trying to execute
    contains shell metacharacters. Shell metacharacters include things like pipes,
    redirects and statement separators: (ps -aux | column 1 > pids); date. Specifically
    the characters:


    & ; ` '' \ " | * ? ~ < > ^ ( ) [ ] { } $ \n \r


    If the operating system command you''re trying to execute uses any of these, you
    must use the first form, e.g:


    system ("$tace < $tcmd > $tout");


    In this case the sole string argument is passed to a command shell.


    One key thing to remember is that once you introduce the system() function, your
    script is no longer portable, without modification, to Perl running under Windows
    and possibly other Unix operating systems.


    7\. PERL Subroutines and functions


    Perl subroutine or function is a group of statements that together performs a
    task. You can divide up your code into separate subroutines. How you divide up
    your code among different subroutines is up to you, but logically the division
    usually is so each function performs a specific task.


    Perl uses the terms subroutine, method and function interchangeably. Define and
    Call a Subroutine


    The general form of a subroutine definition in Perl programming language is as
    follows −


    sub subroutine_name{ body of the subroutine


    }


    The typical way of calling that Perl subroutine is as follows − subroutine_name(
    list of arguments );


    In versions of Perl before 5.0, the syntax for calling subroutines was slightly
    different as shown below. This still works in the newest versions of Perl, but
    it is not recommended since it bypasses the subroutine prototypes.


    &subroutine_name( list of arguments );


    Let''s have a look into the following example, which defines a simple function
    and then call it. Because Perl compiles your program before executing it, it doesn''t
    matter where you declare your subroutine.


    #!/usr/bin/perl


    # Function definition sub Hello{


    print "Hello, World!\n";


    }


    # Function call Hello();


    When above program is executed, it produces the following result − Hello, World!


    Passing Arguments to a Subroutine


    You can pass various arguments to a subroutine like you do in any other programming
    language and they can be acessed inside the function using the special array @_.
    Thus the first argument to the function is in $_[0], the second is in $_[1], and
    so on.


    You can pass arrays and hashes as arguments like any scalar but passing more than
    one array or hash normally causes them to lose their separate identities. So we
    will use references ( explained in the next chapter ) to pass any array or hash.


    Let''s try the following example, which takes a list of numbers and then prints
    their average − #!/usr/bin/perl


    # Function definition sub Average{


    # get total number of arguments passed.


    $n = scalar(@_);


    $sum = 0;


    foreach $item (@_){


    $sum += $item;


    }


    $average = $sum / $n;


    print "Average for the given numbers : $average\n";


    }


    # Function call Average(10, 20, 30);


    When above program is executed, it produces the following result − Average for
    the given numbers : 20


    Passing Lists to Subroutines


    Because the @_ variable is an array, it can be used to supply lists to a subroutine.
    However, because of the way in which Perl accepts and parses lists and arrays,
    it can be difficult to extract the individual elements from @_. If you have to
    pass a list along with other scalar arguments, then make list as the last argument
    as shown below  −


    #!/usr/bin/perl


    # Function definition sub  PrintList{


    my @list = @_;


    print "Given list is @list\n";


    }


    $a = 10;


    @b = (1, 2, 3, 4);


    # Function call with list parameter PrintList($a, @b);


    When above program is executed, it produces the following result −


    Given list is 10 1 2 3 4 Passing Hashes to  Subroutines


    When you supply a hash to a subroutine or operator that accepts a list, then hash
    is automatically translated into a list of key/value pairs. For example −


    #!/usr/bin/perl


    # Function definition sub PrintHash{


    my (%hash) = @_;


    foreach my $key ( keys %hash ){ my $value = $hash{$key}; print "$key : $value\n";


    }


    }


    %hash = (''name'' => ''Tom'', ''age'' => 19);


    # Function call with hash parameter PrintHash(%hash);


    When above program is executed, it produces the following result − name : Tom


    age : 19


    Returning Value from a Subroutine


    You can return a value from subroutine like you do in any other programming language.
    If you are not returning a value from a subroutine then whatever calculation is
    last performed in a subroutine is automatically also the return value.


    You can return arrays and hashes from the subroutine like any scalar but returning
    more than one array or hash normally causes them to lose their separate identities.
    So we will use references ( explained in the next chapter ) to return any array
    or hash from a function.'
