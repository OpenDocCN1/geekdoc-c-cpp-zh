    $date =~ s#(\\d+)/(\\d+)/(\\d+)#$3/$1/$2#;\nprint \"$date\\n\";\n```\n\nWhen above\
    \ program is executed, it produces the following result − 1999/03/26\n\nA regular\
    \ expression is a string of characters that define the pattern or patterns you\
    \ are viewing. The syntax of regular expressions in Perl is very similar to what\
    \ you will find within other regular expression.supporting programs, such as `sed`,\
    \ `grep`, and `awk`.\n\nThe basic method for applying a regular expression is\
