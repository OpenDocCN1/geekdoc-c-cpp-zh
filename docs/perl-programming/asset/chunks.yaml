    \ food, Last: footbrdige`。\n\n### 4. 正则表达式变量\n\n正则表达式变量包括 `$&`，它包含整个匹配字符串；`` `\
    \ ```，它包含匹配字符串之前的所有内容；以及 `` `'` ，它包含匹配字符串之后的所有内容。`$` 包含最后一次分组匹配的内容。以下代码演示了结果：\n\
