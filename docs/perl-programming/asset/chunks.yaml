    Let''s try the following example, which takes a list of numbers and then returns
    their average −


    ```perl

    #!/usr/bin/perl


    # Function definition sub Average{

    # get total number of arguments passed.

    $n = scalar(@_);

    $sum = 0;

    foreach $item (@_){

    $sum += $item;

    }

    $average = $sum / $n;

    return $average;

    }


    # Function call

    $num = Average(10, 20, 30);

    print "Average for the given numbers : $num\n";

    ```


    When above program is executed, it produces the following result − Average for
    the given numbers : 20


    ## Private Variables in a Subroutine


    By default, all variables in Perl are global variables, which means they can be
    accessed from anywhere in the program. But you can create private variables called
    lexical variables at any time with the `my` operator.


    The `my` operator confines a variable to a particular region of code in which
    it can be used and accessed. Outside that region, this variable cannot be used
    or accessed. This region is called its scope. A lexical scope is usually a block
    of code with a set of braces around it, such as those defining the body of the
    subroutine or those marking the code blocks of `if`, `while`, `for`, `foreach`,
    and `eval` statements.


    Following is an example showing you how to define a single or multiple private
    variables using `my` operator −


    ```perl

    sub somefunc {

    my $variable; # $variable is invisible outside somefunc()

    my ($another, @an_array, %a_hash); # declaring many variables at once

    }

    ```


    Let''s check the following example to distinguish between global and private variables
    −


    ```perl

    #!/usr/bin/perl


    # Global variable

    $string = "Hello, World!";


    # Function definition sub PrintHello{

    # Private variable for PrintHello function

    my $string;

    $string = "Hello, Perl!";

    print "Inside the function $string\n";

    }


    # Function call PrintHello();

    print "Outside the function $string\n";

    ```


    When above program is executed, it produces the following result − Inside the
    function Hello, Perl! Outside the function Hello, World!


    ## Temporary Values via local()


    The `local` is mostly used when the current value of a variable must be visible
    to called subroutines. A `local` just gives temporary values to global (meaning
    package) variables. This is known as dynamic scoping. Lexical scoping is done
    with `my`, which works more like C''s auto declarations.


    If more than one variable or expression is given to `local`, they must be placed
    in parentheses. This operator works by saving the current values of those variables
    in its argument list on a hidden stack and restoring them upon exiting the block,
    subroutine, or `eval`.


    Let''s check the following example to distinguish between global and local variables
    −


    ```perl

    #!/usr/bin/perl


    # Global variable

    $string = "Hello, World!";


    sub PrintHello{

    # Private variable for PrintHello function local $string;

    $string = "Hello, Perl!"; PrintMe();

    print "Inside the function PrintHello $string\n";

    }


    sub PrintMe{

    print "Inside the function PrintMe $string\n";

    }


    # Function call PrintHello();

    print "Outside the function $string\n";

    ```


    When above program is executed, it produces the following result − Inside the
    function PrintMe Hello, Perl! Inside the function PrintHello Hello, Perl! Outside
    the function Hello, World!


    ## State Variables via state()


    There are another type of lexical variables, which are similar to private variables
    but they maintain their state and they do not get reinitialized upon multiple
    calls of the subroutines. These variables are defined using the `state` operator
    and available starting from Perl 5.9.4.


    Let''s check the following example to demonstrate the use of state variables −


    ```perl

    use feature ''state'';


    sub PrintCount{

    state $count = 0; # initial value

    print "Value of counter is $count\n";

    $count++;

    }


    for (1..5){ PrintCount();

    }

    ```


    When above program is executed, it produces the following result − Value of counter
    is 0 Value of counter is 1 Value of counter is 2 Value of counter is 3 Value of
    counter is 4


    Prior to Perl 5.10, you would have to write it like this −


    ```perl

    #!/usr/bin/perl

    {

    my $count = 0; # initial value

    sub PrintCount {

    print "Value of counter is $count\n";

    $count++;

    }

    }

    for (1..5){ PrintCount();

    }

    ```


    ## Subroutine Call Context


    The context of a subroutine or statement is defined by the type of return value
    that is expected. This allows you to use a single function that returns different
    values based on what the user is expecting to receive. For example, the following
    `localtime()` returns a string when it is called in scalar context, but it returns
    a list when it is called in list context.


    ```perl

    my $datestring = localtime( time );

    ```


    In this example, the value of `$timestr` is now a string made up of the current
    date and time, for example, Thu Nov 30 15:21:33 2000\. Conversely −


    ```perl

    ($sec,$min,$hour,$mday,$mon, $year,$wday,$yday,$isdst) = localtime(time);

    ```


    Now the individual variables contain the corresponding values returned by `localtime()`
    subroutine.

