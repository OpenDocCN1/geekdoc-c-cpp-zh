    If the result is greater than a certain value, it is considered a human; otherwise
    it is considered a cat. How can we determine the weight for each message? We can
    choose from the best results through continuous experiments. A better way is to
    find a large number of pictures containing cats or people, and let the system
    automatically derive these weights.


    As discussed, it is a typical problem of machine learning. If the problem can''t
    be solved by explicit programming, we can use machine learning algorithms to generalize
    specific models from training data. In order to learn from training data, we need
    to construct a model, and design a training algorithm, which describes how to
    use the information provided by the training data and how the specific parameters
    the model can be adjusted. We then need to extract information from the training
    data (such as how many leaves the creature in the picture have, whether it has
    a beard, etc.)—such information is called features in machine learning. The training
    dataset contains a large number of samples, of which may contain the output we
    need in addition to features. Through these samples and specific training algorithms,
    we can adjust the parameters in the model and finally obtain the trained model—this
    is the process of a model. On the other hand, using a trained model and entering
    new features, we can use the parameters in the model to obtain corresponding prediction
    results—it is the process of a model.


    Of course, that''s not the whole story of machine learning and we''re briefly
    introducing a branch of machine learning here—supervised learning. Machine learning
    also includes many branches, such as unsupervised learning, reinforcement learning,
    and so on. But learning from data and features is the common concept of machine
    learning.


    So, what does it have to do with deep learning? In fact, it solves the question
    described earlier—how to construct that magical machine, and how to extract features
    from the original input information?


    Before the advent of deep learning, the problem relied heavily on experts and
    algorithms in specific fields. For example, we may need some specialized algorithms
    in the image field in order to extract how many leaves the creature in the image
    have. With strong limitations, these algorithms extract features effectively in
    the field of image processing may be difficult to apply to the field of speech.
    In fact, such feature extraction is so difficult that it has developed a specialized
    field: feature engineering.


    Feature engineering is laborious, and the effect of artificial feature extraction
    is often not ideal. So, can we make the computer extract features itself? Based
    on this, people have carried out long-term researches. In the 1990s, Yann LeCun
    and others published LeNet, employing a multilayer neural network to automatically
    learn features from the original pixels and using extracted features to predict
    which number from 0 to 9 is in the machine, which has achieved good results. However,
    LeNet is much more complex than traditional artificial neural networks and there
    was no great progress after LeNet''s release. Until 2006, a famous scholar Geoffrey
    Hinton published a related paper, which has solved the problem of training complex
    networks to extent, creating a new climat in the study of multilayer neural networks.
    Multilayer neural network can effectively extract features from raw data through
    its own learning, which advantage the traditional machine learning does not have.
    Accordingly, the method of stacking complex neural networks together to form a
    “deep” structure, automatically extracting features, and completing model learning
    is called deep learning.'
