  md: '# 22 C++ Template Metaprogramming Practice


    Let''s take a look at an example. Given an unsigned integer, find the number of
    Iss in the binary representation of the integer. At runtime, we can use a simple
    loop to implement. At compile time, we need to use recursion to implement:


    ```

    template <size_t> Input>

    constexpr size_t OnesCount = (Input % 2) + OnesCount<(Input / 2)>;

    template <> constexpr size_t OnesCount<0> = 0;

    constexpr size_t res = OnesCount<45>;

    ```


    Lines 1–4 define a metafunction OnesCount, and line 6 uses this metafunction to
    calculate the number of Is contained in the corresponding binary format of 45.
    The whole program is logically complex, which is adapt to this programming style.
    The amount of code is similar to writing a runtime loop. The core of the code
    is OnesCount<(Input / 2)> at line 2, which is essentially a recursive call. Readers
    can think about the behavior of line 2 in the code snippet when Input is 45 or
    any other value.


    In general, a metaprogram that uses recursion to implement loops, a branch needs
    to be introduced to the loop. Line 4 in the discussed procedure implements a branch
    like this—when the input is reduced to 0, the procedure switches to this branch
    and ends the loop.


    A more common scenario of loops is the processing of elements in an array. We
    discussed the representation of arrays in the previous section and here we give
    an example of working with arrays:


    ```

    template <size_t...>Inputs>

    constexpr size_t Accumulate = 0;

    template <size_t CurInput, size_t...Inputs>

    constexpr size_t Accumulate<CurInput, Inputs...>

    = CurInput + Accumulate<Inputs...>;

    constexpr size_t res = Accumulate<1, 2, 3, 4, 5>;

    ```


    Lines 1–6 define a metafunction: Accumulate, which receives an array of type size_t,
    sums the elements in the array and takes the result as the output of the metafunction.
    Line 8 shows the usage of this metafunction: calculates the value of adding 1
    to 5 and assigns the result to res.


    As mentioned earlier, introducing a branch to terminate the loop is very important
    for the looping logic in metafunction. Line 2 of the code snippet is the branch
    to terminate the loop—when the input array is empty, it will match the template
    parameters of the function <size_t...Inputs>, at point Accumulate returns 0. Lines
    4–6, on the other hand, make up another branch—if the array contains one or more
    elements, it will match this template specialization, which takes out the first
    element, sums the remaining elements, and adds the result to the first element.'
