    # 8.3.3 Multi-operation Co-optimization


    Multi-operation co-optimization means considering multiple operations at the same
    time and simplifying them from a mathematical point of view to achieve optimization.
    Compared with “avoiding repetitive computations” and “merging similar computations,”
    multi-operation co-optimization is a peculiar method of optimization, which can
    also play a great role if used well.


    For a deep learning framework, the so-called system optimization should not only
    increase the speed but also the stability and ease of use for the system. Methods
    such as “avoiding repetitive computations” and “merging similar computations”
    are mainly aimed at speed but multi-operation co-optimization can take the three
    points into account. Next, let’s take a concrete example to display how to introduce
    multi-operation co-optimization in MetaNN.


