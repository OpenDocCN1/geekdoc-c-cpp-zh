    #  4.6 Summary


    This chapter discussed the basic data types introduced by MetaNN.


    A flexible deep learning framework can involve multiple data types. These data
    types can be classified into different categories. Object-oriented programming
    handles this scenario by declaring base classes and then deriving types from the
    base classes. But, as a metaprogramming framework, MetaNN adopts a typical generic
    programming idea: there are no derivation relationships among different types
    belonging to the same category—the organization is loose and designed to be more
    flexible.


    Generic programming and object-oriented programming are not incompatible. In the
    implementation of Array and Duplicate, we combine generic programming with object-oriented
    techniques of inheritance to provide an implementation scheme for the introduction
    of different interfaces for different categories. Learning generic programming
    does not mean abandoning the typical concepts in object-oriented programming.
    Conversely, using the appropriate concepts in the appropriate scenario enables
    us to develop more elegant and robust programs.


    In this section, we are aware that the interfaces provided by classes are not
    limited to functions and declarations such as DeviceType and ElementType can also
    be considered interfaces to provide information (as computing devices) for subsequent
    extensions.


