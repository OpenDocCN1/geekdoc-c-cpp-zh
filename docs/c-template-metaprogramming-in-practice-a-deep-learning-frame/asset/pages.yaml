    to use std::tuple as the storage space of values in any way.


    # 2.3 Policy Templates


    Heterogeneous dictionaries can be regarded as containers that use keys to indexed-related
    values. The keys are constants at compile time, and the values can be objects
    at runtime. This characteristic of heterogeneous dictionary allows it to be applied
    in many scenarios. Typically, we can construct objects of heterogeneous dictionaries
    as containers of functions.


    Also, it is precisely because of heterogeneous dictionaries are runtime objects
    that can''t be applied in certain scenarios. Compared with functions, templates
    can also receive arguments, but arguments received by templates are constant compile
    time. Meanwhile, template parameters can be types or templates in addition to
    numeric objects—these cannot be processed by heterogeneous dictionaries themselves.
    In this section, we will consider another construct, policy templates, to simplify
    the input of template parameters.


    # 2.3.1 Introduction to Policies


    Considering the following scenario: we want to implement a class that encapsulates
    the concept of “accumulation.” A typical cumulative strategy behaviors are different,
    but the calling interfaces are similar. To maximize code reuse, we consider introducing
    a class template to encapsulate different behaviors:


    ```

    template <typename TAccType> struct Accumulator { /* ... * / };

    ```


    In this definition, TAccType represents the “cumulative” strategy adopted. Inside
    Accumulator, you can choose the appropriate processing logic based on the value
    of this parameter.


    In fact, there may be other options for cumulative classes. For example, we might
    want this class to accumulate and also average the cumulative results. Further,
    we would like to be able to control how the class carries out the average operation.
    Also, and so on. Based on the discussed considerations, the previously defined
    Accumulator is extended as follows:


    ```

    template <typename TAccType, bool DoAve, typename ValueType> struct Accumulator
    { /* ... * / };

    ```'
