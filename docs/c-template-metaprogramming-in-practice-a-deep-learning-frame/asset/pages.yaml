  md: "# C++ Template Metaprogramming in Practice\n\nCodes executed in order like\
    \ this snippet can be easily understood. The only thing to be reminded is that\
    \ declarations in structures now have to be seen as executing statements and their\
    \ order cannot be swapped at all. Consider the following code snippet:\n\n```\n\
    struct RunTimeExample {\n    static void fun1() { fun2(); }\n    static void fun2()\
    \ { cerr << \"hello\" << endl; }\n};\n```\n\nThis snippet is correct and the order\
    \ of definitions of fun1 and fun2 can be swapped changing their behaviors. But,\
    \ if we adjust the order of the code lines in the discussed metaprogramming example:\n\
    \n```\ntemplate <typename T>\nstruct RemoveReferenceConst_\n    using type = typename\
    \ std::remove_const<inter_type>::type;\n    using inter_type = typename std::remove_reference<T>::type;\n\
    ```\n\nThat program will not be compiled. It's not hard to understand: the compiler\
    \ scans the declaration the first time and goes into the definition of the methods\
    \ the second time. Because of this, RuntimeExample is correct. In the first scan,\
    \ the compiler only learns that RuntimeExample contains two members fun1 and fun2.\
    \ In the second scan, the compiler learns that fun2 relies on fun1. Although the\
    \ statement of fun2 appears after its declaration, it is because of the two scanning\
    \ that the compiler does not report an error such as fun2 can't be found.\n\n\
    But in the modified RemoveReferenceConst, the compiler will find that types rely\
    \ on an undefined_type when it first scans the program from top to bottom. It\
    \ will not continue to scan subsequent lines but gives an error message directly.\
    \ In many cases, we place the metafunction' calling statements in structures or\
    \ classes, and we should make sure that the statements are in the correct order.\n\
    \n# 1.3.2 Codes Executed in Branches\n\nWe can also include logic of branches\
    \ at compile time. Unlike codes executed or or compile, the logic of branches\
    \ at compile time can be represented either as a metafunction or in combination\
    \ with the execution logic at runtime. For the latter, the branches at compile\
    \ time are often used for the selection of runtime logic. We will see examples\
    \ of these two scenarios in this section.\n\nIn fact, we have implemented codes\
    \ executed in branches in the previous discussion. For example, in section 1.2.2,\
    \ we implement a metafunction Fun_, and a Boolean parameter to determine the behavior\
    \ (return value) of the function. This is a typical branching behavior. In fact,\
    \ using specialization or partial specialization of templates to implement branches\
    \ is a very common way to implement branches, as in that example. Of course, there\
    \ are other implementations of branches, each of which has its advantages and\
    \ disadvantages. Several of them have been discussed in this section."
