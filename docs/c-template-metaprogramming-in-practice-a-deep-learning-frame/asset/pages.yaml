    need to evaluate objects of this type uniformly before updating the parameter
    gradient—which facilitates the consolidation of calculations and boosts efficiency.


    MetaNN introduces GradCollect to collect parameter gradients and each layer containing
    the parameter matrix should provide this interface. We''ll see the specific form
    of the interface later.


    # 6.1.8 Acquisition of Parameter Matrices


    If a layer contains a parameter matrix, it should be preserved for prediction
    after the completion of training. MetaNN requires each layer with a parameter
    matrix to provide an interface SaveWeights to obtain the parameters of the matrix.
    Of course, if the layer does not contain a parameter matrix, it is unnecessary
    to provide this interface.


    # 6.1.9 Neutral Detection of Layers


    Layer objects need to save intermediate results in forward propagation for calculations
    of backward propagation. From the perspective of intermediate results, forward
    and backward propagation just constitute the “producer-consumer” relationship.
    During a round of training, the intermediate results produced in forward propagation
    should be completely consumed in backward propagation. We call the layer “without
    any intermediate results” a “neutral layer.” The layer should be neutral at initial
    state; after each call of forward and backward propagation and obtaining the corresponding
    parameter gradient, the layer should return to the neutral state.


    If a layer in MetaNN needs to preserve information, it will provide an interface
    NeutralInvariant to assert that the layer is neutral. Typically, this function
    can be called after a round of training. If the layer is not neutral, the function
    prompts an exception indicating that there is an error in some parts of the system.


    Like most interfaces, not all layers provide the NeutralInvariant. If a layer
    does not need to save variables in the intermediate state, it is needless to provide
    this function.


    So far, we have learned the basic design principles of layers. From the above
    analysis, it is natural to realize that a layer is not only the package of operations
    but has numerous features also. It is these features that make this introduction
    will not impact on the performance of the system too much, but help to be more
    user-friendly. In the second half of this chapter, we''ll dive into the implementation
    details of layers to illustrate how to embed these principles into the specific
    code.


    Nonetheless, before discussing the specific implementation of layers, we should
    implement some auxiliary logic: for example, initialization modules for the entire
