  md: '# Operations Expression Templates ■ 147


    Sigmoid is an operation in neural networks that maps a real number into an interval
    of (0,1), of which the following formula is:


    ```

    $S(x) = \frac{1}{1 + e^{-x}}$

    ```


    When $x$ tends to be positive or negative infinity, the value of this function
    tends to 1 or 0. The function is usually used in neural networks as layers of
    nonlinear transformation.


    The main processing unit of a neural network is a matrix. Accordingly, we ought
    to implement the operation Sigmoid that receives a matrix as arguments and calculates
    the *sigmoid* value for each element in the matrix. In addition, we hope this
    operation to support lists of matrices so to support processing multiple matrices
    at the same time. Therefore, the operation *Sigmoid* should be valid for both
    matrices and lists of matrices.


    # 5.6.1.1 Function Interface


    The function interface for the operation Sigmoid is defined as:


    +   1 template <typename TP,

    2 std::enable_if_t<OperSigmoid_<TP>::valid>* = nullptr

    3 auto Sigmoid(TP&& p_m)

    4 {

    n5 return OperSigmoid_<TP>::Eval(std::forward<TP>(p_m));

    6 }


    It is a function template that receives objects of type $TP$ and returns the object
    of the operation corresponding to *Sigmoid*. Let''s take a closer look at this
    code snippet and see what it implements.


    Firstly, as a function template, *Sigmoid* contains two template parameters. But
    its second template parameter is actually a metafunction *enable_if_t*. Please
    recall the knowledge about this metafunction we discussed in Chapter 1, it is
    not hard to aware that this parameter actually constructs the logic of selection.
    The code will only compile when *OperSigmoid_<TP>::valid* is true, otherwise the
    SFINAE mechanism will be triggered and will be rejected by the compiler.


    In other words, *OperSigmoid_<TP>::valid* is essentially to ensure the validity
    of the input parameters. If $TP$ is a valid type of parameters, the metafunction
    will return true, triggering compilation; otherwise the metafunction will return
    false with the compilation rejected. It is because this is the only version of
    the function *Sigmoid*. If the compiler fails to associate a *Sigmoid* call to
    it,


    We''ll analyze the implementation of *OperSigmoid_<TP>::valid* in the next section.
    Before, let''s finish the discussion about function signature. Line 3 of the function
    gives its signature. Please note that the return type of the function is here
    as auto, which is a feature in C++14, indicating that its actual return type is
    determined by the return statement in the function body.


    The function body of this function contains only one statement (line 5), which
    calls the function *OperSigmoid_<TP>::Eval* and forwards the input parameters
    to it via *std::forward*. The function *Sigmoid* returns the result of *OperSigmoid_<TP>::Eval*
    and the return type of the function *Sigmoid* corresponds to that of *OperSigmoid_<TP>::Eval*,
    accordingly.'
