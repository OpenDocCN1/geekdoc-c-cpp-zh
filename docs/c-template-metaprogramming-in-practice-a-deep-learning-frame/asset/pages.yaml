    expressed as a loss function and the learning process of the system is the process
    of constantly adjusting network parameters so that the value of the loss function
    decreases gradually on the training set. Take the task of judging whether there
    is a cat or a person in a picture described earlier as an example. Assuming that
    we construct a deep learning system with pixels in the picture and output as two
    probability $p_c$, $p_p$, representing the probability of a cat and a person,
    Given $N$ samples and the real category of sample $i$ as $y_i$, then we can define
    the following function:


    ```

    $loss = -\sum_{i=1}^{N} { \delta_{y_i,y_c} \log p_c'' + \delta_{y_i,y_p} \log
    p_p'' }

    ```


    $p_c''$ and $p_p''$ represent the probability that the output of the current system
    is a cat or a person respectively for sample $i$. When $y_i$ is a cat, the value
    of $\delta_{y_i,y_c}$ is 1, otherwise it is 0. Similarly, when $y_i$ is a person,
    the value of $\delta_{y_i,y_p}$ is 1, otherwise it is 0. It is not difficult to
    realize that the value of the formula will gradually decrease with the classification
    accuracy of the system increasing. The training process of the network is indexed
    by the process of gradually reducing the loss function by adjusting the network
    parameters.


    As the developers of deep learning frameworks, we do not need to pay too attention
    to how to choose the structure of the network and loss function but we should
    provide a series of modules to make it convenient to build the corresponding network
    structure after determining the network structure and loss function.


    # 3.1.3.2 Model Training


    After defining the network structure and loss function, we can adopt them to build
    a neural network model. The model usually contains a large number of parameters.
    The training process of the model is the process of adjusting the model parameters
    according to training samples, in order to make the loss function as small as
    possible. The training processes for different network structures and loss functions
    are different, but in general, the training of a whole model includes following
    steps:


    +   **Parameter initialization:** at the beginning of model training, we need
    to initialize the parameters contained therein. In general, these parameters can
    be assigned values with random initialization. But in order to ensure that the
    model works well, we should limit the distribution of initialization parameters—such
    as initializing according to a certain distribution or ensuring that the initialized
    parameters have certain properties. The deep learning framework needs to provide
    a variety of initialization methods for users to choose from.


    +   **Forward propagation and backward propagation:** after assigning parameters
    in the model with initial values, the parameters need to be adjusted according
    to training samples. The process of adjustment is mainly composed of forward and
    backward propagation. In forward propagation, the input of each sample is passed
    in turn; the system calculates the output of the system under the current parameters
    of the model, and the corresponding loss function value of the output. In backward
    propagation, the value of the loss function is used to calculate the gradient
    and feed back to each component of the neural network along a path opposite to
    the forward propagation, in which the components calculate the gradient of'
