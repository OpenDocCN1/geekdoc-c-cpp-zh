    template <typename TData>

    constexpr bool IsScalar<Array<TData>> = IsScalar<TData>;

    ```


    The described code snippet is not hard to understand: if the elements stored in
    Array are matrices, then Array is obviously a list of matrices; if the elements
    stored in Array are scalars, then Array is the list of scalars.


