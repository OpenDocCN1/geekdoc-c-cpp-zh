    The template contains three parameters called policies, which act on templates
    and control their behaviors. Each policy is represented as a key-value pair, where
    the key and value are complete constants. Each policy has its own set of values.
    For example, for the described example, the value set of TAccType includes "addition,"
    "multiplication," and so on; the value of DoAve includes true and false; for ValueType,
    it can float, and so on.


