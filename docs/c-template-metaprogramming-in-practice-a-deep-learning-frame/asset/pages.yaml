    This approach is so common that we may not realize that we are already using compile-time
    computations. In fact, this is a typical compile-time computation. The compiler
    needs to select the appropriate function to match the user''s call and the selection
    itself is a computational process. In this compile-time computation process, we
    use the information that "the matrix type involved in calculation is a ZeroMatrix,"
    and therefore improves the system''s performance.


    Function overloading is a very simple compile-time computation. Although it can
    solve problems, its scenarios are relatively narrow. What this book will discuss
    is more complex compile-time computation where we use templates to explicitly
    contain the logic that needs to be processed by the compiler. The compiler uses
    the values (or types) derived from these templates to optimize the system. These
    templates for compile-time computation are called metafunctions, and the corresponding
    computation methods are called metaprogramming or C++ template metaprogramming.


    # Metaprogramming and Large-scale System Design


    Metaprogramming is not a new concept. In fact, as early as 1994, Erwin Unwin showed
    a program that can use compile-time computation to output prime numbers. Due to
    various reasons, the research on C++ metaprogramming has been in a state of apathy.
    Although several metaprogramming libraries (such as Boost::MP, Boost::Hana, etc.)
    have been developed, there are relatively few cases of using these libraries to
    solve practical problems. Even occasionally, these metaprogramming libraries and
    techniques are often in an auxiliary position, assisting object-oriented methods
    to construct programs.


    With the development of C++ standard, we are pleased to find that a large number
    of gram and tools have been introduced into the new standard, which makes metaprogramming
    easier. This also makes it possible for us to use metaprogramming to construct
    complex programs.


    This will construct a relatively complex system: a framework for deep learning.
    Metaprogramming is no longer a subsidiary role, but the leading role of the whole
    system. Previously, we mentioned that one of the advantages of metaprogramming
    and compile-time computation is to make better use of the information of operation
    itself to improve system''s performance. Here is an overview of what can be achieved
    in large-scale systems.


    A large-scale system contains a number of concepts and each concept may correspond
    to a variety of implementations with their advantages. With metaprogramming, we
    can organize different implementations to the same concept into loose structures.
    Furthermore, concepts can be classified with tag, so as to maintain existing concepts,
    introduce new concepts, or introduce new implementations of existing concepts.


    Concepts can be combined. A typical example is that the addition of two matrices
    will construct a new matrix. We will discuss a very useful technique in metaprogramming:
    expression templates to form new ones. The new type will retain all the information
    in the original type(s) and can be optimized at compile time.'
