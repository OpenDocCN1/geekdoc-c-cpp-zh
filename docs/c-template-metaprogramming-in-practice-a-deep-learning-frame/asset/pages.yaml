  md: '# Code-level Optimization


    A good metaprogram should achieve its objectives with fewer instantiations as
    possible. Also take the case of accessing an array as an example. The code in
    the previous section is just a quite basic to access an array, which results in
    numerous instances during compilation. We can adopt the Big O notation in data
    structures and algorithms to approximately describe the complexity of algorithms
    at time. It is natural to realize that the complexity of the algorithm earlier
    is O(n). Further, consider the following code:


    ```

    1 using Check1 = typename<at3, tuple<int, short, long, double>>::type;

    2 using Check2 = typename<at2, tuple<int, short, long, double>>::type;

    ```


    The complexities of Check1 and Check2 are both O(n). Although they access the
    array, the index values are different. Therefore, we cannot benefit from the Calculation
    of Check1 when calculating Check2 to the algorithm discussed earlier.


    The Boost::MPL contains a compile-time array construct and provides metafunctions
    to acquire elements in it. Its algorithms are optimized to reduce the complexity
    of repeatedly obtaining the values of elements in the same array:


    ```

    1 using Check1 = typename<at3, vector<int, short, long, double>>::type;

    2 using Check2 = typename<at2, vector<int, short, long, double>>::type;

    ```


    Suppose the call of Check1 is the first time to traverse the array<int, short,
    long, double>, where the complexity of Check1 is also O(n). When Check2 is calculated
    later, it others the elements in the same array as Check1. The complexity of Check2
    can therefore be reduced from O(n) to O(1).


    The Boost::MPL utilizes only the techniques in the C++ 03 standard. Based on new
    standards as C++ 11, we can further decrease the complexity of compile-time computing—MPL1
    on GitHub is a metaprogramming library that uses the techniques in C++ 11 to rewrite
    some algorithms in Boost::MPL. The metafunction has provided better performance
    at compile time. If we use this metafunction, then it can be called as:


    ```

    1 using Check1 = typename<at3, vector<int, short, long, double>>::type;

    2 using Check2 = typename<at2, vector<int, short, long, char>>::type;

    ```


    Assuming that the first call of it, the complexity is O(log(n)). For subsequent
    evaluation of Check2, the complexity is O(1)—although Check1 calls a different
    array from Check2, the two arrays have the same length. Therefore, the compiler
    can also utilize the information to reduce the number of instantiations.


    The implementations of these metafunctions are beyond the scope of this book and
    they are all open source. Interested readers can search for relevant code to analyze
    their implementations.'
