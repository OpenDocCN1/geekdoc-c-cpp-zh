    17. But this book will follow the writing conventions before C++ 17, which is
    using class instead of typename to represent templates.


    > 8 Containers like template <auto...> struct Cont is supported for storing different
    types of numeric values in C++ 17. This book will not use such kind of containers,
    so they will not be discussed in detail.'
