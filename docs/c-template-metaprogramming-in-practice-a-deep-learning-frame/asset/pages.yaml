    # 3.1.3 Organization and Training of Deep Learning Systems


    Neural structures in deep learning systems can be quite complex and contain a
    large number of parameters. The so-called training of a deep learning system is
    to adjust the parameters contained in the network to make them meet demands of
    related tasks. For example, if we want to use CNNs for image recognition, we need
    to adjust the parameters of the convolution matrix in the network to improve the
    system''s recognition accuracy.


    # 3.1.3.1 Network Structure and Loss Function


    Before solving practical problems through deep learning systems, we should first
    choose the neural network structure and optimization objectives contained in the
    deep learning system. As mentioned earlier, different structures are also applicable
    in different areas. When dealing with sequence-related issues, we can consider
    structures such as RNN; CNN can be a good choice for image processing; for more
    complex problems, it requires a specialized structure or a complex network constructed
    by building multiple structures.


    Another practical problem is to describe optimization objectives of the network
    quantitatively. In general, we need to convert optimization objectives of the
    network into mathematical representations and use some optimization algorithms
    to adjust the network parameters in the deep learning system in the subsequent
    training process, so that the behavior of the network will be more and more inclined
    to our optimization objective. Typically, the optimization objective'
