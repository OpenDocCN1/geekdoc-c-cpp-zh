    # 7.4.6 Backward Propagation


    ComposeKernel provides the interface FeedBackward for backward propagation. The
    logic of backward propagation is analogous to that of forward propagation and
    we will not discuss its details any more. Here we mainly discuss the distinctions
    between code of backward propagation and forward propagation.


    Firstly, during forward propagation, we process each sublayer in the composite
    layer from front to back according to the resulting order of topological sorting.
    Nevertheless, the order of sublayers processed in backward propagation is the
    opposite of the order in forward propagation. Therefore, each sublayer should
    be processed from back to front in backward propagation according to the reverse
    order of topological sorting.


    Secondly, the input of backward propagation is the output container of each sublayer,
    where elements may have multiple data sources. Consider the example in Figure
    7.1, where the output container of S2 in forward propagation is delivered to the
    output container of the composite layer and the input container of S1 obtains
    data from the output container of the composite layer and the input container
    of S2 respectively.·^10. Here, we use all the information from multiple data sources
    together and adopt it as the input for backward propagation.


    # 7.5 Examples of Composite Layer Implementations


    So far, we have basically accomplished the discussion of ComposeTopology and ComposeKernel.
    With these components, it is effortless to combine basic layers to construct complex
    network structures. MetaNN contains several composite layers as examples, which
    will be briefly discussed in this section.


    It should be noted that these composite layers are just examples for application
    of ComposeTopology and ComposeKernel. The code is relatively simple and far less
    important in MetaNN than other components. Readers can fully understand the construction
    processes of composite layers by reading how the two layers are defined, so as
    easily implement similar composite layers.


    +   - LinearLayer**: is a combination of WeightLayer and BiasLayer. It contains
    two parameter matrices internally, W and b. for an input vector x, it performs
    the operation of y = Wx + b

    - **SingleLayer**: It executes nonlinear transformations against the input vector
    and returns. Its specific operations depend on the policy passed in.


    > ·10 Note that this situation does not occur in forward propagation because the
    data source for each layer container is unique in forward propagation.'
