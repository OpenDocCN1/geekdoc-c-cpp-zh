    # # 4.1 The Type System


    # ## 4.1.1 Introduction to the Type System


    In any system, if we want to support different data types and easily introduce
    new types for extensions, then a mechanism is required to manage the data types
    therein. This book refers to the mechanism of managing data types as the type
    system. One of the most important tasks for the type system is to group data types:
    each group is called a category, representing a unique concept and several specific
    implementations for it.


    Each programming approach can introduce its own management system for data types.
    For instance, in an object-oriented system, the typical way is to classify by
    derivation—types in each category are derived directly or indirectly from a base
    class, which represents the concept described by the corresponding category. A
    base class defines the interfaces corresponding to the concept in the form of
    virtual functions. Derived classes may choose to inherit or rewrite virtual functions
    in the base class, providing a situation-appropriate implementation that complies
    with the requirements of the concept.


    C++ supports object-oriented programming, so the type system can be defined in
    the above way. Nonetheless, within the framework of generic metaprogramming, there
    are other ways to handle data, such as tags.


    Tags are nothing new. In fact, the C++ Standard Library we use day contains tags:
    a tagging system to manage iterators and classify them into categories. Each iterator
    requires specific interfaces and behaviors. The requirements for interfaces are
    not explicitly introduced through base classes and virtual functions but are given
    in documents. There is no common base class among diverse types belonging to the
    same category. As a result, the organizational relationship is relatively loose
    among iterators of a category in a tag-based type system developed


    Compared with derivation-based type systems, tag-based type systems have their
    inherent performance advantages. A derivation-based type system, base classes
    and derived classes are linked through virtual functions and derived classes need
    to inherit or modify the virtual functions defined in base classes to implement
    their specific logic. Users, or not to modify, call virtual functions to access
    interfaces. Access to virtual functions involves pointers dereference,'
