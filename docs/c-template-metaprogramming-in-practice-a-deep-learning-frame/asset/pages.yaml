    convenient interfaces for extension. To achieve this, we introduced several auxiliary
    class templates, which encapsulate different parts involved in operations. We
    can introduce various operations by specialising these auxiliary class templates.


    This chapter presented specific examples of several operations’ implementations
    and limited the operations that MetaNN currently supports, which can be helpful
    references for implementations of operations.


