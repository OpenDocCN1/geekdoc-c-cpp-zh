  md: "When using specialization to implement branches, one thing to note is that\
    \ it is illegal to introduce fully specialized branches into a non-fully specialized\
    \ class template. Consider the following code snippet:\n\n```\ntemplate <typename\
    \ TW>\nstruct Wrapper {\n    template <typename T>\n    struct Fun_\n        constexpr\
    \ static size_t value = 0;\n};\n\ntemplate <>\nstruct Fun_<int> {\n    constexpr\
    \ static size_t value = 1;\n};\n```\n\nIt is illegal. The reason is that Wrapper\
    \ is a non-fully specialized class template, but it contains a fully specialized\
    \ template within it (Fun_<int>), which is not allowed by C++ standard and will\
    \ cause compilation errors.\n\nTo solve this problem, we can use partial specialization\
    \ instead of full specialization and the discussed code snippet can be modified\
    \ as follows:\n\n```\ntemplate <typename TW>\nstruct Wrapper {\n    template <typename\
    \ T, typename TDummy = void>\n    struct Fun_\n        constexpr static size_t\
    \ value = 0;\n\n\n    template <typename TDummy>\n    struct Fun_<int, TDummy>\n\
    \        constexpr static size_t value = 1;\n};\n```\n\nA pseudo-parameter TDummy\
    \ is introduced here, which is used to reform the original full specialization\
    \ to partial specialization. This parameter has a default value of void, so that\
    \ the meta-function can be called directly in the form of Fun_<int> without providing\
    \ an argument to the pseudo-parameter."
