    # 2.3.1.1 Policy Objects


    Each policy object belongs to a policy and their relationships are like that between
    objects and classes in C++. Policy objects are compile-time constants that contain
    all the information about keys and values and are easy to read. A typical policy
    object is as follows:


    ```

    1 PMulAccu // To accumulate by multiplication

    2 Pave // To average

    ```


    The policy objects defined in this book begin with a capital letter P. Depending
    on its name, users can clearly grasp the meaning of the policy described by the
    object at a glance. For templates that support policy objects, it is quite simple
    to alter their default behaviors. For example, assuming the class template Accumulator
    discussed earlier policy objects, we can write as follows:


    ```

    1 Accumulator<DoubleValueType>

    2 Accumulator<DoubleValueType, Pave>

    3 Accumulator<Pave, DoubleValueType>

    ```


    Line 1 indicates that the default behavior is modified to double as the type of
    values. Lines 2 and 3 represent using double as type and averaging. It is not
    difficult to see from the declaration when assigning a policy object to a template,
    the order is arbitrary. With policy objects, we can obtain all benefits of named
    arguments.


    # 2.3.1.2 Policy Object Templates


    The construction and use of policy objects are separate. We need to first construct
    a policy object (such as Pave) and then use that when declaring instances of Accumulator
    later (such as Accumulator<Pave>).


    It introduces a problem, that the policy designer needs to declare all possible
    policy values in order to enable users to use the policy object effectively. For
    example, Pave and PAve can be constructed to represent averages and non-averages—which
    is equivalent to enumerating options for whether to average. In some cases, this
    enumeration is relatively simple—for example, it takes two cases to enumerate
    the question of whether to average. In other cases it is unrealistic to enumerate
    all possible values to construct a collection of objects. For example, we defined
    DoubleValueType previously to represent the return value of accumulation as type.
    But, if we want to support return value, we need to introduce more policy objects,
    such as PFloatTypeValue, PIntTypeValue, and so on. And it is often unrealistic
    to cite all the cases. To solve this problem, we introduced the template, which
    is a metafunction that can pass in template parameters to construct a policy object.
    For example, we can construct a policy object template to represent the type that
    holds the results of calculation:


    ```

    1 PValueIs<typename T>

    ```


    Users can use the template as follows:


    ```

    1 // Equivalent to Accumulator<DoubleValueType>

    ```'
