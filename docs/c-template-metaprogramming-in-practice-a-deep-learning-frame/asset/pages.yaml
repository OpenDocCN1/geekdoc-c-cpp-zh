  md: "# Basic Tips ■ 13\n\nIn fact, it is almost an idiom in metaprogramming—the\
    \ definition is introduced only when necessary, otherwise we use declarations\
    \ directly. In the following sections, we'll see a lot of similar declarations\
    \ and take concrete examples to see how they are used.\n\nIn fact, we've almost\
    \ finished the discussion of data structures so far—we almost only use these structures\
    \ when constructing a deep learning framework. If you are not familiar with these\
    \ structures, it's okay. We'll keep using these data structures in the process\
    \ of constructing the deep learning framework and you will be familiar with them.\n\
    \nThe data structures are only half the story, and a complete program contains\
    \ algorithms in addition to data structures. An algorithm is composed of the most\
    \ basic sequences, branches, and looping logic. In the next section, we'll discuss\
    \ how to write the appropriate sequences, branches, and looping logic when it\
    \ comes to metafunctions.\n\n# 1.3 Writing of Sequences, Branches, and Looping\
    \ Codes\n\nThe author believes readers of this book can skillfully write sequences,\
    \ branches, and looping codes of runtime. However, this book still carves out\
    \ a section to discuss this issue. It is because once metafunctions are involved,\
    \ the method of code writing will change as well.\n\n# 1.3.1 Codes Executed in\
    \ Sequence Order\n\nCodes executed in sequence order are more intuitive to write.\
    \ Consider the following code snippet:\n\n```\ntemplate <typename T>\nstruct RemoveReferenceConst\
    \ {\nprivate:\n    using inter_type = typename std::remove_reference<T>::type;\n\
    public:\n    using type = typename std::remove_const<inter_type>::type;\n};\n\n\
    template <typename T>\nusing RemoveReferenceConst\n    = typename RemoveReferenceConst_<T>::type;\n\
    \nRemoveReferenceConst<const int&> h = 3;\n```\n\nThe key point of this code snippet\
    \ is lines 2–7, which encapsulates the metaf RemoveReferenceConst_. The metafunction\
    \ contains two statements executed in sequence:\n\n+   1. Line 4 calculates inter_type\
    \ according to T;\n2. Line 6 calculates type according to inter_type.\n\nAt the\
    \ same time, inter_type in the code snippet is declared as private to ensure that\
    \ users of the function will not misuse the intermediate result inter_type as\
    \ the return value of the function."
