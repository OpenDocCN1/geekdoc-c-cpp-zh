  md: '# 256 ■ C++ Template Metaprogramming in Practice


    Addition will alter the data type of the result$^{12}$ and the type of container
    for FeedStepBackward will depending on whether the addition operation is performed.
    When FeedBackward is called in FeedStepBackward, various types of output will
    be produced due to different types of input.


    Whether to add or not is determined at runtime. If we attempt to recur directly
    to the FeedBackward result of RecurrentLayer::FeedBackward will produce different
    types of output at runtime, which is not allowed. We cannot "convert" the output
    of the core components to be of the same type in order to allow RecurrentLayer
    to return correctly. To achieve the preceding transformation, we should first
    call FeedBackward of the core component and obtain the corresponding result container,
    and then convert each element in the container to the correct dynamic type.


    The container used by a recurrent layer is defined by its core component, so the
    conversion process is also placed inside core components. That''s why we introduce
    the function FeedStepBackward into core components of recurrent layers.


