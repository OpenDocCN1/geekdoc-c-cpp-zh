  md: '# Type System and Basic Data Types — 97


    This is, above all, a cost issue. In general, reading and writing of data involves
    interaction with the CPU memory—we can read data from memory or write back into
    memory. If the storage space to be read from and written is not CPU-controlled
    memory—such as a matrix for GPU operations, where data is stored in the GPU memory.
    In order to achieve element-level reading and writing, a copy between the GPU
    memory and the CPU memory is required. For example, when data is read from the
    GPU, data is first copied to the CPU before it can be read by users. The cost
    of copying storage space is often high compared to reading and writing itself,
    so supporting this form of reading and writing leads to an additional burden on
    the system. In general, when it comes between different types of computing devices,
    what we need is not to read and write an element, but to read and write the entire
    set of data—such as copying a matrix into the GPU as a whole, or vice versa. As
    result, the framework can achieve the required functionality by simply providing
    replication of data at the level of abstract data types (such as the level of
    matrices) between the CPU and a particular device. The replication handles multiple
    items at once, so to take full advantage of the bandwidth provided by the computing
    device and improve replication efficiency.


    Secondly, some special types of data structures are not necessary to support element-level
    reading and writing. Typical data structures include a distinctive mark of all
    0s or 1s, which has a special purpose in the system. It makes no sense to execute
    write operations when it—because all elements have the same value.


    # ## 4.2.3 Element-level Writing and Shallow Copy


    Even if a data type does not support operations of element-level reading and writing
    on the side of the CPU, the statuses of reading and writing are distinct. In general,
    operations of reading can be performed at any time but when write operations are
    supported depending on the timing of operations. We will take matrices as an example
    to discuss the causes of this phenomenon.


    Numerous operations of deep learning frameworks involve the replication of data—for
    example, copying of one network to the another. Typically, a data type uses an
    array to store its element values. The replication of arrays is relatively time-consuming.
    Each time replication involves the replication of each element in the data, the
    speed of the entire framework will be significantly affected. To solve this problem,
    MetaNN uses shallow copy for data replication—the data type contains objects of
    ContinuousMemory internally and the core logic of replication is done by copying
    the objects. ContinuousMemory uses the default method of replication, which is
    essentially replication of the smart pointer std::shared_ptr inside ContinuousMemory.
    The target object involved in replication will point to the same memory as the
    original—which can greatly improve the performance of the system.


    However, this design has a side effect: when an object will affect other objects
    that point to the same memory region. In general, this is not the way we want.
    A typical scenario is that we save the intermediate results of forward propagation
    in the network to ensure that backward propagation is performed correctly. However,
    intermediate results may share memory with the input matrix. If we modify the
    contents of the input matrix (i.e., operations of writing) after forward propagation,
    the intermediate results saved in the corresponding network will also be modified,
