  md: "# Basic Tips 19\n\nIt should be noted that enable_if and enable_if_t can be\
    \ used in a variety of forms and are not limited to the way described earlier,\
    \ in which they are used as template parameters. In fact, enable_if or enable_if_t\
    \ can be introduced anywhere SFINAE is supported. Interested readers can refer\
    \ to the instructions in C++ Reference.\nenable_if or enable_if_t also has drawbacks—they\
    \ are not intuitive template specialization and the codes written with them are\
    \ relatively difficult to read (the author believes that programmers who understand\
    \ the mechanism of template specialization are more than programmers who know\
    \ SFINAE).\nIt should be stated that the example given here based on enable_if\
    \ is a typical way of using a combination of compile time and runtime. FeedbackOut_\
    \ contains the logic of runtime and choosing the right version of FeedbackOut_\
    \ is implemented through the branch at compile time. By introducing a branching\
    \ method for compile time, we can create more flexible functions.\n\n# 1.3.2.4\
    \ Compile-time Branches with Different Return Types\n\nBranching statements at\
    \ compile time look a bit more complex but more flexible than runtime branches.\
    \ Consider the following code snippet:\n\n```\nauto wrapl(bool Check)\n{\n   \
    \ if (Check) return (int)0;\n    else return (double)0;\n}\n```\n\nThis is a runtime\
    \ code snippet. First we'd like to briefly explain line 1—in C++14, it is not\
    \ necessary to provide return types explicitly in declarations of functions. The\
    \ compiler will automatically derive its type from the return statement in the\
    \ function body, but it is required that all return statements in the function\
    \ return the same type. For the described code snippet, line 3 does not return\
    \ the same type as line 4, which can cause a compilation error. In fact, runtime\
    \ function's type is determined at compile time. No matter what form is used to\
    \ write the function, its type cannot be changed at runtime.\nBut at compile time,\
    \ we can break this limitation in some way:\n\n```\ntemplate <bool Check, std::enable_if_t<Check>*\
    \ = nullptr>\nauto fun() {\n    return (int)0;\n}\n\ntemplate <bool Check, std::enable_if_t<!Check>*\
    \ = nullptr>\nauto fun() {\n    return (double)0;\n}\n```\n\n> ¹¹ http://en.cppreference.com/w/cpp/types/enable_if"
