    # 2.3.6.1 Main Frame


    The external interface of the entire policy template is the policy selection metafunction:
    PolicySelect. Review how this metafunction is used:


    ```

    1 <typename...TPolicies>

    2 struct Accumulator {

    3   using TPolicyCont = PolicyContainer<TPolicies...>;

    4   using TPolicyRes = PolicySelect<AccPolicy, TPolicyCont>;

    5

    6   using ValueType = typename TPolicyRes::Value;

    7   static constexpr is_ave = TPolicyRes::IsAve;

    8   using AccType = typename TPolicyRes::Acc;

    9

    10  // ...

    11 }

    ```


    Line 4 calls PolicySelect, the policy selection metafunction, with arguments AccPolicy,
    the policy group information we are concerned about, and TPolicyCont, an array
    of policies consisting of policy objects received by the template. TPolicyRes
    returned by the metafunction is the policy dominance structure shown in Figure
    2.3. On this basis, lines 6–8 use this structure to obtain the corresponding policy
    parameter value.


    PolicyContainer is an array of policies and its declaration is almost the same
    as the declaration of a compile-time array we saw earlier:


    ```

    1 <typename...TPolicies>

    2 struct PolicyContainer;

    ```


    std::tuple or other containers can be used as a substitute for it. However, with
    this container declaration, the functionality of the array can be easily identified
    from its name.


    PolicySelect is simpel encapsulation of the metafunction NSPolicy::Selector_:


    ```

    1 <typename TMajorClass, typename TPolicyContainer>

    2   using PolicySelect

    3   = typename NSPolicy::Selector_<TMajorClass,

    4                               PolicyContainer>::type;

    ```'
