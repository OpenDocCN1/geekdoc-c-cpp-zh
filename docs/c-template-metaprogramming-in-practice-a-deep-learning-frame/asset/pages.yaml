    and its grammar is easier to learn and maintain than assembly language and other
    low-level languages. C++ programs do not support binary porter and developers
    need to handle pointers manually to ensure there is no memory leak. This effort
    in return is the execution speed comparable to assembly-language program. In the
    author''s opinion, if we don''t intend to run programs quickly and efficiently,
