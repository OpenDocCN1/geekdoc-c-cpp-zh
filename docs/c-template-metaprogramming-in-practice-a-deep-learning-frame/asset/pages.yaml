    From the analysis discussed, it is obvious that VarTypeDict maintains a mapping
    that maps the keys at compile to runtime values. From this point of view alone,
    it is not much different from the feature std::map mentioned at the beginning
    of this chapter. However, std::map and similar runtime containers incurably excessive
    runtime expenses in the process of using them. For example, when we insert an
    element into it, std::map requires to compare the keys to determine the location
    to insert. The process of comparison takes up the amount of computation at runtime.
    The Set function implemented by VarTypeDict also requires similar work of looking
    up, but the corresponding code is


