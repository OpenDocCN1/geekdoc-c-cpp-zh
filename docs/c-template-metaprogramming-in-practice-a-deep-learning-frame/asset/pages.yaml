  md: '# Standard-level Optimization¹


    Although we can reduce the number of instances produced by compile-time operations
    through the optimization of metafunctions to decrease the burden on the compiler,
    the author argues that this solution alone is not enough. When the code is complex
    to a certain extent, it can cause compilation failures due to demands for too
    many resources. To support more computing at compile time, we should introduce
    optimization at the standard level.


    In fact, the problem of "resource maintenance in the computing process" also occurs
    at runtime. However, compared with compile-time computing, the solution for runtime
    is much more complex. Complete resource maintenance at runtime as an example:
    the author believes that the most effective means of reducing resource consumption
    is lifetime control of objects other than algorithm optimization.


    Most languages control the lifetime of objects: the corresponding resources are
    freed up when an object is no longer needed. C++ utilizes the concept of domains
    to control the lifetime of memory—when a domain ends, objects constructed in the
    domain are destroyed and resources as memory are freed up. In contrast, runtime
    function corresponds to a domain. At runtime of a certain function, several intermediate
    variables may be generated. When it is over, the intermediate variables constructed
    at runtime are destroyed accordingly because the domain is over.


    In contrast, there does not appear to be an effective way to control the lifetime
    of compile-time "objects" in the existing standards.


    We can think of a type instantiated at compile time as a compile-time object.
    Take the following as an example:


    ```

    using Check = typename at<3, vector<int, short, long, double>>::type;

    ```


    In order to derive the value of Check at compile time, the compiler may produce
    intermediate objects when parsing the metafunction at, which may be preserved
    in the compiler''s symbol table. But there does not seem to be a method to explicitly
    inform the compiler that these intermediate variables will no longer be used and
    "lifetime" can be terminated.


    Therefore, the author assumes here that the standard should introduce the concept
    of domains at compile time, so as to tell the compiler to destroy instances longer
    used when the calls of corresponding metafunctions are completed—that is, to remove
    the corresponding entries from the symbol table maintained by the compiler.


    The compiler maintains the instances it constructs in the symbol table in order
    to reduce unnecessary repetition of instances. Consider the following code:


    ```

    1 | vector<int> a; // the operation of a

    2 | vector<int> b; // the operation of b

    ```


    > ¹ Note that the content of this section is an author''s point of view, to inspire
    ideas. It is not a moulded solution. This view may be wrong, and the author is
    not responsible for its correctness.'
