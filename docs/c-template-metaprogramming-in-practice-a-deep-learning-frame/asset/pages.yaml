    If a layer contains parameter matrices, we need to specify the appropriate name
    for it one of the layer''s constructor arguments. On the other hand, the layer
    does not contain parameter matrices, it does not need to introduce a corresponding
    name. It is tantamount to assigning names to each matrix in the neural network
    in this way. If we can ensure that the name in the constructor passed to each
    layer is unique to the entire network, then we can guarantee that the parameter
    matrix contained in the layer is not shared with other layers. If we have various
    layers to share a same set of parameter matrices, we only need to assign a name
    to those layers.


    The name of the matrix is of type string, more user-friendly to the framework
    than other forms of naming. As we discussed earlier, it is daunting to use data
    type string as template parameters. Another message to be passed through constructors
    is the dimensions of input and output of layers (as the number of rows and columns
    of the output matrix). Layers ought to specify the information when constructing
    matrices contained inside it. Typically, the layer used to calculate the dot product
    of the input and a matrix requires these two messages to infer the number of rows
    and columns of the parameter matrix it maintains.


    The information of dimensions can theoretically be placed in template parameters,
    but MetaNN delivers them in constructors because arguments cannot provide great
    help with optimization of performance introduced at compile time. If passed as
    a template argument, it will boost the performance on the compiler with few benefits.
    MetaNN delivers the information in constructors.


    # 6.1.2.2 Information Specified through Template Parameters


    Most messages required for construction of layers are passed as template arguments.
    These messages are diverse, and different layers require distinct information.
    For instance, for a layer that contains a parameter matrix, it should know whether
    the corresponding parameter gradient during training; for a layer without parameter
    matrices, this message is redundant. Some parameters only make sense for a particular
    layer, while others may be meaningful for most layers.


    Parameters of layers vary widely, which is distinct from the data and operations
    discussed previously. Although data and operations are implemented as templates
    in MetaNN, the number of parameters and the meaning of each parameter in these
    templates are basically constant (e.g., there are usually two parameters in class
    templates that represent basic data types, indicating the type of computing unit
    and device, respectively). For layers, it is totally different in this aspect.
    To deal with the disparity effectively, we should utilize the Policy template
    implemented in Chapter 2. Hopefully, you will remember the details of this module.
    If not, refer back to this part.


    Specifically, a layer is implemented as a class template, declared as follows:


    ```

    1 template <typename T>

    2 class XXXLayer;

    ```


    T is a containerPolicy that contains the template parameters required for the
    layer.


