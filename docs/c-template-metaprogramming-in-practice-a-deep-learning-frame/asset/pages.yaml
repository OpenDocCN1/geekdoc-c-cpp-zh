    “large building blocks.” Tests have shown that this approach could improve performance
    dozens of times compared with many deep learning frameworks at time. Accordingly,
    the maintenance of these “large building blocks” is difficult.


    For instance, we attempted to introduce a new translation model to form an ensemble
    model with the original one—experiments that could significantly improve the quality
    of translation. However, in the original system, the layers that represented the
    deep model were already tightly coupled with each other. There were two options
    for introducing an additional complex construct.


    +   1. To rewrite the system and continue using “large blocks” deeply coupled
    at more onerous cost of maintenance than the original system.

    2. To optimize the new translation model in depth—using the new model and the
    original model separately and merge the evaluation results in the end. This approach
    is less costly, but the two models are optimized, which can only be used in turn
    or using GPUs separately. It cannot maximize computing resources.


    This example explains the contradiction between model description and performance
    optimization. On the hand, we hope to provide relatively basic components that
    allow users to use their description models more flexibly; on the other hand,
    we want to integrate complex calculations for better performance optimization.
    This contradiction cannot be easily resolved by traditional object-oriented programming.
    Therefore, constructs such as the SoftmaxLoss layer in Caffe emerged.³ By metaprogramming
    and compile-time computing, we can ease the contradiction between the two to some
    extent: users still adopt the basic components to construct the network; with
    the metaprogramming, the computer can better understand the network structure,
    providing better optimization.


    For example, we have previously encountered difficulties in the machine translation
    system. If we use MetaNN, upper-level users need to describe the structure of
    each model. The evaluation logic in MetaNN will automatically explore the calculations
    that can be merged, which can achieve multi-operation co-optimization.


    # “Playground” and “One-way Road”


    As a framework based on compile-time computing, metafunctions can be found everywhere
    in MetaNN. A lot of logic that can be achieved in object-oriented implementations
    at runtime are implemented using template metaprogramming. For instance, in general,
    a deep learning framework introduces logic for runtime to realize automatic differentiation,
    while MetaNN uses compile-time computing solely to implement this part.


    ³ Chapter 8 discusses it.'
