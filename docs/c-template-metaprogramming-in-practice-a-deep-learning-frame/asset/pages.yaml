    }\n```\n\nIf the type of the input parameter is an instance of DynamicData, MakeDynamic\
    \ returns the input object itself, or otherwise it will derive and return the\
    \ corresponding DynamicData type based on its computing unit, supported devices,\
    \ and category tag.\n\n# 6.2.2.6 DynamicData and Dynamic Type System\n\nWhen discussing\
    \ systems in Chapter 4, we mentioned that the main type system employed in MetaNN\
    \ is a type system based on tags—a static type system that can be used for compile-time\
    \ computing. DynamicData dealt with this section can be regarded as reorganizing\
    \ the types in the tagging system through inheritance in object-oriented programming,\
    \ thus constructing a dynamic type system.\n\n+   - The type system based on DynamicData\
    \ is dynamic because DynamicData itself masks most information about specific\
    \ data type—we cannot execute operations based on the hidden information at compile\
    \ time. These hidden pieces of information, or the specific behaviors of the type\
    \ encapsulated by DynamicData, are embodied dynamically when called at runtime.\n\
    \nA dynamic type system and a static type system have their pros and cons, respectively.\
    \ A dynamic type system can mask the differences of specific types and represent\
    \ various specific data through an abstract data type, simplifying the writing\
    \ of code; a static type system does not hide specific type information, so that\
    \ optimization can be executed at compile time according to the information. When\
    \ writing code, we ought to select the appropriate type system in order to take\
    \ full advantage of both.\n\nA dynamic type system and a static type system can\
    \ also be converted to each other. In this section, DynamicData is the process\
    \ of transforming a static type system into a dynamic type system. We then bring\
    \ in the corresponding category tags for DynamicData, which is essentially the\
    \ process of incorporating the abstract data types of dynamic type systems into\
    \ static type systems. The two types of systems work together and can produce\
    \ more subtle cases to cope with complex scenarios."
