    We want to unify this interface in different layers to facilitate subsequent calls
    and management. So, how can we resolve the problem?


    One way is to use the list structure as a container for input and output of a
    function: to distinguish among parameters by artificially defining the meaning
    of each element in the list. For example, for a layer that represents matrix subtraction,
    we can require that the input of the layer be a vector list, which can contain
    only two elements, the first as the subtrahend and the second as the minuend.
    The output of the layer is also a list that contains an element to represent the
    result of the subtraction of the two matrices.


    Nonetheless, there are two problems with this approach. Firstly, it does not reduce
    the likelihood of misuse. It is because we artificially specify the meaning of
    each element in the list, which is not designed in the program code and may still
    be misuse and more difficult to debug. The class of lists requires each element
    to be of the same type, but by MetaNN''s main design principle is to introduce
    types to improve system performance. Typically, two inputs to an addition layer
    may come from the basic class template Matrix and the operation template formed
    by an operation—where the types of parameters passed in the layer are. Of course,
    we can evaluate the input data, convert it to the same type, and then call FeedForward.
    However, it is not consistent with our design principle: our goal is to postpone
    the evaluation process, providing the possibility of optimization. The benefits
    of introducing rich types, operation templates, and other mechanisms will be ruined
    if we evaluate simply to match interfaces of layers.


    How to resolve this problem? Some readers may have the answer, which is to use
    the heterogeneous dictionary discussed in Chapter 2. First of all, the model is
    essentially a dictionary and each entry is a key-pair—the types of values in different
    entries. We can use this to solve the problem of type differentiation; secondly,
    we should explicitly give the key names for the module to read and write, which
    will reduce the possibility of parameter misuse. Heterogeneous dictionaries are
    containers that hold heterogeneous data structures. In the process of forward
    and backward propagation, the received input and the resulting output containers,
    the input and output containers of the same layer may be different (e.g., for
    a layer that represents the addition of two matrices, two parameters are required
    in each layer, the input container of it in backward propagation must be the same
    as the output container in forward propagation; the output container in backward
    propagation must be the same as the input container in forward propagation). Therefore,
    a layer ought to correlate two containers: one to store the forward input and
    backward output, and one to store the forward output and backward input.


    One more to think about FeedForward: it is a function template rather than a trivial
    function, so it''s designed to receive input of different types and produce output
    of different types. Consider a layer that calculates Sigmoid, which calculates
    the Sigmoid result of the input and returns it. Depending on the type of input,
    it constructs the corresponding calculation template as the returning value. Thus,
    although layers are introduced in MetaNN, they do not generate too many side effects
    on computational performance during forward


