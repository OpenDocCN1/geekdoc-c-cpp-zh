  md: '# Development Cost


    Essentially, the development cost of metaprogramming does not come from the technology
    itself, but from the cost of programmers changing their coding habits. Although
    this book is about a programming technology in C++, the technology is quite different
    from object-oriented C++ development methods. In a sense, metaprogramming is more
    like a new language seamlessly connected with object-oriented C++. Even a C++
    master takes some time to master and use it well.


    For C++ familiar familiar object-oriented programming, the main difficulty is
    to establish the mode of thinking in functional programming. The metaprogramming
    approach at compile time is functional, which means the intermediate results of
    the construction cannot be changed and the impact may be greater than expected.
    This book will help readers gradually establish this mode of thinking through
    a large number of examples. We believe after reading this book, readers will have
    a relatively in-depth understanding of it.


    The second problem with metaprogramming is the difficulty of debugging. The reason
    is simple: most C++ programmers focus on runtime debugging and most tools are
    optimized for runtime debugging. Accordingly, compilers perform worse in outputting
    debugging information for metaprogramming. In some cases, the error information
    of metaprogram output by compilers is more like a short article, and it is difficult
    to locate at a glance. There is no particularly good solution to this problem.
    Do more experiments and look at output information of compilers and you will find
    the hang of it.


    The last problem is that there are fewer metaprogramming developers than object-oriented
    C++ developers. That makes it difficult to use metaprogramming when many developers
    collaborate; if others cannot understand your codes, the cost of learning and
    maintenance will be higher. The author often encounters problems in work, which
    in fact indirectly led to the publication of this book. If you want to convince
    your collaborators to use metaprogramming in developing C++ programs, you can
    recommend this book: this can also be a small advertisement.


    # Usage Cost


    The development cost of metaprogramming is mainly subjective, which can be reduced
    by improving programmers'' skills; but in contrast, the usage of metaprogramming
    is mainly objective and more difficult to deal with.


    Usually, if we want to develop a package and deliver it to others, the package
    often contains header files and compiled static or dynamic libraries, where the
    main logic of the package is located. It has two advantages. First, the package
    provider won''t worry about the main logic in the static or dynamic library. Users
    cannot use the source code. To obtain the main logic in the library, one needs
    to use means like reverse engineering, which costs relatively highly. Second,
    users of packages can compile and link their programs faster; since the static
    or dynamic libraries in packages are already compiled. When we use them, we only
    need to link them, unnecessary to compile them again.


    But if we develop a meta-library and deliver it to others, those two benefits
    are usually not available. Metaprogram is often implemented by templates. Currently,
    the compilation mode supported by mainstream compilers is to put templates in
    header files. It leads that the main logic of metaprogramming is in header files,
    which will be provided to use users with release of packages. The cost for users
    to understand and copy the corresponding logic is therefore greatly reduced.'
