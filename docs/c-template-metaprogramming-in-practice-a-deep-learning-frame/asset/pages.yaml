  md: '# C++ Template Metaprogramming in Practice


    The problem can be resolved at the level of matrix computations. It is provided
    that the Batch list of matrices can be multiplied by a matrix object, with each
    element in the Batch list is multiplied by the matrix object and the results are
    collected to form a new Batch object. Under this provision, we can introduce concrete
    implementation logic for a matrix multiplying a matrix, a list of matrices multiplying
    a matrix, and a list of matrices multiplying a list of matrices.


    Nevertheless, this approach turns clearly not perfect: on the one hand, the number
    of functions we want to implement increases exponentially as the categories increase—which
    is not conducive to writing or maintenance of the code; on the other hand, much
    logic of these functions is the same and the entire process of implementation
    is time-consuming and tedious. To solve this problem, we divide the calculation
    process into two steps: the first step is to determine whether a matrix is multiplying
    the list of matrices, and if so, convert the matrix to the list of matrices; in
    the second step, we only need to implement two versions—matrix multiplying and
    list of matrices multiplying a list of matrices. For each type of multiplication,
    need to implement the type conversion, which costs are not high. The main logic
    of computations is in the second step, but the second step involves only two implementations.
    So, the whole process is much easier to implement than implement alone.


    Now let''s focus on the first step, how to convert a matrix into a list of matrices.
    We notice in this case, each matrix in the list is the same. Of course, we can
    use the class template Batch to construct this list of matrices, but it will deprive
    us of the information that "every matrix in the list is the same". To preserve
    the information for evaluation optimization, we introduce the template Duplicate
    to implement a replicable list like this:


    ```

    1 template <typename TData, typename TCategory>

    2 class DuplicateImp;

    3

    4 template <typename TData>

    5 class Duplicate : public DuplicateImp<TData, DataCategory<TData>>

    6 {

    7 public:

    8 using ElementType = typename TData::ElementType;

    9 using DeviceType = typename TData::DeviceType;

    10 using DuplicateImp<TData, DataCategory<TData>>::DuplicateImp;

    11 };

    12

    13 template <typename TData>

    14 constexpr bool IsBatchMatrix<Duplicate<TData>> = IsMatrixMatrix<TData>;

    15

    16 template <typename TData>

    17 constexpr bool IsBatchScalar<Duplicate<TData>> = IsScalar<TData>;

    ```


    Similar to the template Array, the template Duplicate is derived from a base class:
    DuplicateImp, which is responsible for determining whether a scalar or a matrix
    is replicated. If TData is a matrix (scalar), Duplicate<TData> is a list of matrices
    (scalars).'
