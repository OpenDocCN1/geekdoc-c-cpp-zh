    # 5.2 The Design Principles of Operation Templates in MetaNN


    # 5.2.1 Problems of the Operation Template Add


    Previously, we used the template Add to demonstrate the basic idea of expression
    templates. As an example of code, the template Add is sufficient to illustrate
    the core concept. But, if applied directly to the MetaNN framework as a component,
    the template Add is not up to the task.


    Firstly, the template Add lacks a mechanism to represent the category tags of
    operands and the results. In the previous section, we assume that the inputs and
    output of Add are both matrices, which is not strictly limited in the core and
    might lead to misuse of the template. In the meantime, the corresponding expression
    template will not be able to be input to other operations due to the missing information
    corresponding to the expression''s evaluation result.


    Secondly, the template Add is not scalable enough, which is a major problem. After
    implementing matrix addition, we may also implementing matrix subtraction, which
    can be introduced by another template, Sub. Many functions of Sub are fully consistent
    with the implementation of Add (such as the interface RowNum). For every expression
    template to implement an operation, we hope not to rewrite all the logic associated
    with that template.


    To solve these two problems, we should systematically design expression templates
    for the representation of operations in MetaNN. We refer to the expression templates
    specifically adopted to represent operations as operation templates in MetaNN.
    This section discusses the design of operation templates. First, let''s take a
    closer look at how an operation template should behave.


    # 5.2.2 Behavior Analysis of Operation Templates


    An operation template is the bridge between its operation and data. On the one
    hand, it preserves the input of the operation inside its object, which is essentially
    an abstraction of the operation'
