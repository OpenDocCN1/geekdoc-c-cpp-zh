    # 6.2.5 Universal I/O Structure


    Layers will utilize heterogeneous dictionaries discussed in Chapter 2 as an input/output
    container for forward and backward propagation. In order to use a heterogeneous
    dictionary, we should also bring in some definitions to represent the specific
    container and the names of elements. Various layers have similar I/O structures
    and we extract the I/O structures that we might use frequently to form some structure
    definitions:


    ```

    struct LayerIO : public NamedParams<LayerIO>;

    struct CostLayerIn : public NamedParams<CostLayerLabel>;

    ```


    Many layers are single-input or single-output. For layers, LayerIOs can be used
    as its input or output container. The container contains only one element and
    LayerIO will also serve as the index for that element.

    Note that the definition in line 1 contains two LayerIOs, the first of which is
    the container and the second is the index keyword. They have distinct meanings
    and purposes but can be represented by the same name.

    The last layer of the training network often serves to calculate the value of
    the loss function, usually adopts the output of its predecessor layer and the
    labeled data as input to determine the similarity between the two. Therefore,
    a generic structure CostLayerIn is defined as an input container for the loss
    function, which contains two elements, CostLayerIn for the output of the predecessor
    layer and CostLayerLabel for label information.


    # 6.2.6 Universal Operation Functions


    As mentioned earlier, all layers should provide interfaces FeedForward and FeedBackward
    for forward and backward propagation. Not all layers need to support such functions
    as parameter loading—only layers that contain parameter matrices need to provide
    such interfaces. The design avoids introducing unnecessary interfaces into the
    layer but might contribute to the complexity of usage for users—they may call
    the interface Init to a layer that does not support parameter initialization,
    resulting in a compilation error.'
