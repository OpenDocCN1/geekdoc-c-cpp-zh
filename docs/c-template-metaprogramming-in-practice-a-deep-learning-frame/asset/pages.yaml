  md: '# Chapter 6


    # Basic Layers


    Chapter 5 discusses the operations in MetaNN, which are represented as template
    expressions and postpone the entire process of calculation, providing a prerequisite
    for the overall optimization of the system. The end of Chapter 5 also mentions
    that operations are not user-friendly interfaces. Therefore, we should encapsulate
    layers on the basis of operations with the introduction of the concept, “layer.”
    We’ll discuss the implementation of layers in MetaNN in two chapters: present
    chapter discusses the basic layers in MetaNN and Chapter 7 discusses the composite
    and recurrent layers in MetaNN.


    Layers encapsulate operations to provide user-friendly interfaces. Users can organize
    the deep learning network through “layers” in MetaNN to train and predict models.
    It can be stated that “layer” is a concept attached to end-users. Deep learning
    is a fast-growing field with emerging technologies. In order to support more technologies,
    on the one hand, we should simplify the introduction of new layers to the entire
    framework; on the other hand, existing layers ought to be flexible enough to support
    different formulations and adjust details of their behaviors. These are all MetaNN
    needs to consider when designing the concept of layers. It is precisely because
    of the flexibility that we need to discuss the details of implementation through
    two chapters.


    Present chapter discusses the basic layers, whose main function is to encapsulate
    operations and form the most basic logic of execution. The composite layers discussed
    in Chapter 7 are combinations of the basic layers, which are a typical composite
    pattern. The composite layers and the basic layers share design concepts, so understanding
    the design principle of layers is also a prerequisite for understanding composite
    layers.


    Similar to previous chapters, before actual development, it is significant to
    analyze what features the concept of “layers” should contain and how to introduce
    them—these contents constitute the design principles of layers. Let’s begin with
    this and dive into the discussion of layers.


    # 6.1 Design Principles of Layers


    # 6.1.1 Introduction to Layers


    From users’ point of view, layers are the basic units that make up a deep learning
    network. A deep learning network usually requires two types of operations: training
    and prediction. Layers also offer appropriate support for both.'
