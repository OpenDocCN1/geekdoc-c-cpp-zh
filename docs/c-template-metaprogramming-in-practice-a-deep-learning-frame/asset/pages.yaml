    which introduce performance losses themselves. Getting rid of limitations of virtual
    functions can improve the performance of systems to some extent. In addition,
    because there is no limitation of virtual functions, there will be more freedom
    for different types when implementing interfaces.¹


    Of course, comparison with derivation-based type systems, there are also inconveniences
    of tag-based type systems. The main usage limit is still related to compile-time
    computing. In a derivation-based type system, we can declare a function that receives
    references or pointers of base classes and passes the object of the derived class
    into it, which is a typical implementation of polymorphism and operates at runtime,
    however, we will lose this polymorphic nature of runtime when using a tag-based
    type system. All types are specified at the compile time and cannot be flexibly
    at runtime. Because of this, whether a tag-based type system should be used is
    up to the constructs. Furthermore, we can combine type systems with derivation-based
    type to take advantage of both.


    In MetaNN, we will primarily use the tag-based type system, supplemented by the
    derivation-based type system mainly used at runtime of the program. When discuss
    the concept of layers in Chapter 6, we introduced a dynamic type system DynamicData
    to save the intermediate results of calculations in the deep learning framework.
    Meanwhile, Chapter 6 will how to combine the two types of systems.


    In addition to the special cases covered in Chapter 6, MetaNN will primarily use
    the tag-based system to maintain the collection of data. We need a system to represent
    the various data types by the framework, each of which has a specific purpose.
    If the network constructed by the deep learning framework can be clarified at
    compile time²,corresponding the data types used in this network can be clarified
    at compile time. The advantages of friendliness and scalability in this tag-based
    system will manifest.


    Tag-based generic types are not original in MetaNN—the C++ Template Library (STL)
    uses a tagging system to manage the type of iterator. MetaNN, on the other hand,
    draws and extends on this technique to manage the data used with a similar tagging
    system. Before understanding the data tagging system in MetaNN, we need to first
    look at the tagging system used to manage iterators in C++.


    # 4.1.2 Classification Systems of Iterators


    Readers who have used the C++ STL must be no stranger to iterators. STL classifies
    iterators into several categories and the interfaces that each iterator category
    needs. For example:


    +   * Input iterators support increment operations and dereference to get values.
    An input iterator can be compared with another iterator to determine whether they
    are equal.

    * Random-access iterators support more operations than input iterators. For example,
    we can add or subtract an integer to move the position where the iterator points;
    it supports relational operators to be compared with one another; two random-access
    iterators can subtract one another to calculate the distance between them.


