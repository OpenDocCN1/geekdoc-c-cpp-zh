    the Recurrent Neural Network: GatedUnitedUnit (GRU). The implementation of GRU
    can also be regarded as a typical application of composite layers.


    # 7.1 Interfaces and Design Principles of Composite Layers


    # 7.1.1 Basic Structure


    Composite layers can be considered a typical pattern of combination and its external
    interfaces should conform to the basic requirements of MetaNN for “layers.” For
    a layer, the two primary operations are forward and backward propagation. A composite
    layer also needs to offer both interfaces.


    A composite layer is a combination of basic layers, yet it does not necessarily
    contain basic layers but can include other composite layers, which can compose
    a more complex structure. For the convenience of subsequent discussions, we refer
    to layers contained in a composite layer as its “sublayer.” A sublayer can be
    either a basic layer or another composite layer. Chapter 6 mentioned the concepts
    of input and output containers for forward and backward propagation introduced
    by MetaNN. Forward propagation receives the input container, returning the output
    container. Backward propagation receives the output container, returning the input
    container. The interfaces for forward and backward propagation in composite layers
    also ought to configure the corresponding input and output containers, which should
    be capable of being connected to the sublayers in composite layers. After a sublayer
    receives the parameters delivered to the composite layer, it will calculate and
    output the result. The resulting output may be connected to other sublayers or
    as the overall output of the composite layer.


    Figure 7.1 shows the internal structure of a composite layer from the perspective
    of forward propagation.


    > Readers can refer to the relevant content in Chapter 3 for a brief description
    of the Recurrent Neural Network.'
