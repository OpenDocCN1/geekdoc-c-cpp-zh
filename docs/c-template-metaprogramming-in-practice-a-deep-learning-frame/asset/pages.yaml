  md: '# C++ Template Metaprogramming in Practice


    Deep neural networks contain a large number of parameters, which are generally
    stored in form of matrices in the layers that constitute deep neural networks.
    Model training refers to the process of optimizing parameter matrices in networks
    by training data. A typical form of inspiring is supervised training: a training
    dataset $(x_1, y_1), (x_2, y_2), ..., (x_n, y_n)$, where $(x_i, y_i)$ is a sample,
    $x_i$ is the information of the sample and $y_i$ is the labeling corresponding
    to the sample. The purpose of training models is to adjust parameter matrices
    so that when the input of a model is $x_i$, its output is as close as possible
    to $y_i$. A typical training method for deep neural networks is to input $x_i$
    to network, calculate the output value of the network in the case of the current
    parameter matrices, compare the value with the label $y_i$, obtain the difference
    between the two, and then adjust the parameters in the network according to the
    direction.


    Model training can be divided into two steps: predicting results of the network
    based on the input and adjusting the parameter matrices according the performance
    of the network. Network predictions are in reverse order to gradient calculations.
    We assume that a forward network has two layers, $A$ and $B$. During the prediction,
    the input is fed into $A$, the output of $A$ is passed to $B$, and the output
    of $B$ is the output of the entire network. During the calculation of the gradient,
    the gradient representing the difference is passed to $B$ first, the result is
    then passed to $A$ after being processed by $B$, and $A$ will use the input gradient
    $B$ passes to calculate the gradient corresponding to its internal parameter matrix.


    We use forward propagation to describe the process of prediction in the network
    and backward propagation to describe the process of gradient calculation of network
    parameters. For any layer, the information of input received in forward propagation
    is called the input feature (or input for short) and the information of output
    is called the output feature (or output for short); the information of input received
    in backward propagation is called the input gradient and the information of output
    is called the output gradient. If the layer needs to update the parameter it contains,
    then it should calculate the parameter gradient with the input gradient, which
    will serve to update the parameter matrix after backward propagation.


    Corresponding to the prediction process of the described example, $A$ receives
    the input and generates output, the output of $A$ is equal to input of $B$ and
    the output of $B$ is the output of the whole network. In backward propagation,
    $B$ receives its input gradient, calculates the gradient corresponding to its
    internal parameter matrix and output gradient. The output gradient of $B$ is delivered
    to $A$ as the input gradient of $A$, and $A$ uses that gradient to calculate the
    internal parameter gradient and output gradient. The output gradient is further
    transmitted outward.


    When the entire backward propagation is completed, we get the parameter gradients
    for each matrix to be updated, which support the training process, a layer needs
    to provide two interfaces for forward and backward propagation. For tasks of pure
    prediction, there is no need for backward propagation. As a deep learning framework
    supports training and prediction, needs to provide interfaces for both forward
    and backward propagation. MetaNN uses FeedForward and FeedBackward in each layer
    as interfaces for forward and backward propagation. Arguably, they are the most
    critical interfaces in each layer of MetaNN.


    It should be noted that not all layers contain parameter matrices within them.
    In fact, some of the basic layers we see later not contain parameter matrices—they
    just serve to transform the input. However, these layers also require backward
    propagation functions to produce the input gradients required by other layers
    in the network.


    > ¹ The difference is usually expressed by the loss function, which receives the
    true label and the prediction result of the network and returns a value to measure
    the prediction.'
