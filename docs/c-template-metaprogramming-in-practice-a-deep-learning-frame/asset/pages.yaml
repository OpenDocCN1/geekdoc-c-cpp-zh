    # # Operations and Expression Templates


    Chapter 4 discusses the basic data types introduced in MetaNN. On this basis,
    this chapter discusses how MetaNN uses these data types to implement computational
    logic.


    In MetaNN, operations are offered in the form of functions, which can receive
    one or more parameters, perform specific calculations, and return the corresponding
    results. Undoubtedly, readers of this book are no strangers to the implementation
    of functions. Theoretically, according to the principles or formulas of an algorithm,
    it is not a tough task to implement the corresponding functions. So why we utilize
    a specific chapter to discuss function implementations?


    In fact, it is pertinent to the design principles of MetaNN: we hope MetaNN to
    be scalable; meanwhile, the framework should offer enough space for optimization.
    For data, the tag system is introduced to support space for optimization. For
    sufficient space, various data types are introduced. The design of operations
    in MetaNN also embodies these two principles—in order to supply a better and more
    convenient approach to extend, we extract similar logic from different operations
    to form a hierarchy on the implementation of the operation logic; for the sake
    of sufficient optimization space, we introduce expression templates as a bridge
    between operations and results. These contents will be divided into this chapter.


    Although our discussion is based on “operations,” readers will find that much
    of this chapter revolves around “data types.” Data types are the core of operations
    and what this chapter talks about is no longer basic data types, but a specialized
    structure that is made up of basic data types—expression templates. Let’s start
    from this point and begin the design of computing modules.


