  md: '# C++ Template Metaprogramming in Practice


    There are two reasons why we choose to implement logic at compile time rather
    than runtime. On the one hand, the author hopes to practice relevant techniques
    of C++ template metaprogramming through the implementation of such complex logic;
    on the other hand, some implementation is caused by the occasion that demands
    it.


    Traditional object-oriented C++ programming pays more attention to runtime. With
    the introduction of metaprogramming, we should focus more on both compile time
    and runtime. Compile-time computations are executed before runtime computations,
    which impacts far more than its literal meaning. It means once we implement some
    logic using runtime techniques, it will be nearly impossible for us to introduce
    compile-time operations after the first logic is executed.


    The author refers to this phenomenon as "playground" and "one-way road." Compile-time
    computing and runtime are like playgrounds where we can play around, and we have
    many opportunities to move from the "playground" of compile time to the "playground
    of of runtime. But, after that, it''s hard to get back to the "playground" of
    compile time because the connection between two is a one-way road.


    The concept is embedded in MetaNN—our goal is to introduce compile-time computation
    for multi-operation co-optimization while evaluating. Before that, we should choose
    implementations at any stage to prevent evaluation optimization from being hindered
    by the premature introduction of runtime logic. For example, we should declare
    the interfaces between forward and back propagation and utilize compile-time computations
    to achieve topological ordering in automatic differentiation—all of which are
    affected by this limitation.


    The introduction of runtime logic is sometimes useless. For instance, this book
    discusses the applications of expression templates in MetaNN— plenty to introduce
    a base class for expression templates, which specifies interface that expression
    templates should support. Introducing a base class is not a big issue and we also
    introduce DynamicData in MetaNN, which can be treated as a base class for expression
    templates. When we refer to an expression template, whether to use a base class
    reference or a derived class instance is indeed the choice of whether to introduce
    runtime logic.


    This book does not introduce DynamicData when discussing operation templates or
    utilize objects instantiated by such class as template parameters—which also embody
    the avoidance of premature introduction of runtime logic. DynamicData encapsulates
    classes in a derived means, which is equivalent to hiding some types of information
    that can be a serious problem for optimization at compile time. Readers can consider
    how to implement "multi-operation co-optimization" discussed in Chapter 8, if
    parameters of operation templates are instances of the class template DynamicData.


    Although the author tries to avoid introducing runtime constructs too, it is inevitable
    to deal with runtime computations in advance in some cases. Also DynamicData as
    an example: we should declare a domain in the class to hold the intermediate results.
    The author chooses the implementation of "introducing base classes with derivation,"
    which can also be regarded as a solution with few other choices.


    # Different Ways to Use


    The advantages of MetaNN are discussed earlier but the framework has its "disadvantages":
    its interface is written in C++. Currently, the mainstream deep learning frameworks
    are usually based on C++, using scripting languages as Python as an interface
    to interact with users, but MetaNN cannot take this form. It has been admitted
    that it is relatively difficult to master C++'
  merge: -1
  pgno: 328
- img_proc: true
  md: 'compared with scripting languages. Therefore, if only C++ interfaces are provided,
    then MetaNN may not be as widely used as other deep learning frameworks.


    In fact, we can also introduce scripting languages such as Python to interact
    with users on the basis of C++ kernel in MetaNN. But it can seriously affect the
    performance of MetaNN: in order to achieve such interactions, Python needs to
    call the compiled C++ kernel, which means that Python cannot benefit from the
    compile-time calculation of C++. Most advantages of MetaNN come from compile-time
    computing, so introducing scripting languages for interaction in MetaNN would
    deprive the framework of its advantages.


    However, if we want to introduce a relatively easy-to-use interaction environment,
    scripting languages like Python are not the only option. In fact, it is fairly
    possible to develop an integrated development environment that supports "drag
    and drop," allowing users to organize interlayer relationships through their mouse,
    which can further generate and compile the corresponding C++ code. Such a system
    might be more intuitive than Python. Of course, in order to achieve a similar
    environment, we also pay more efforts.


    # # Conclusion


    We have also talked about MetaNN itself. But it has to be acknowledged that, for
    the time being, of our discussion here is not supported by sufficient arguments.
    The author mentioned the distinctions between MetaNN and other frameworks, as
    well as the advantages and disadvantages that such distinctions may bring in.
    However, the advantages introduced by these variations can be truly embodied and
    whether the problems can eventually become problems can only be tested if the
    whole framework is implemented relatively completely.


    But as discussed in this book, MetaNN is only an initial implementation of a deep
    learning framework for the time being. Compared to a complete framework, it still
    lacks a lot of features—after all, it was constructed by the author using spare
    time. To achieve a complete framework, requires developers with different expertise
    to form a team and collaborate. For example, developers mastering hardware programming,
    such as GPU/FPGA, are required to develop hardware-accelerated code; developers
    proficient in network programming are needed to develop environments for parallel
    training; for MetaNN, developers proficient in GUI programming might be demanded
    to develop interactive systems. It is quite burdensome to complete the entire
    framework for one person. So here, the author wants to apologize to readers: as
    far as the deep learning framework itself is concerned, currently MetaNN offers
    new design ideas for reference.


    Similar to MetaNN, most contents of this book are organized through the author''s
    explorations—in this book, the author doesn''t want to cover what has been discussed
    in other books. But writing like this is quite risky, because most contents merely
    come from the author''s views. Therefore, something the author considers worth
    discussion might be biased in reality. Again, the author sincerely apologizes
    for this.'
