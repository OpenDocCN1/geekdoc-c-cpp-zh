    # 4.1.5 Metafunctions Related to the Type System


    After defining the tags that represent the categories, the next step is to associate
    them with specific data types—only by this can category tags play their practical
    roles. MetaNN introduces sets of metafunctions to associate tags with specific
    data types.


    # 4.1.5.1 Metafunction IsXXX


    Given any data type, the metafunction IsXXX is used to determine whether the type
    belongs to a certain tag. For each tag, there is a corresponding metafunction
    IsXXX. For example, for tags of BatchMatrix, the corresponding metafunction is
    defined as follows:


    ```

    template <typename T>

    constexpr bool IsBatchMatrix = false;


    template <typename T>

    constexpr bool IsBatchMatrix<const T> = IsBatchMatrix<T>;


    template <typename T>

    constexpr bool IsBatchMatrix<T&> = IsBatchMatrix<T>;


    template <typename T>

    constexpr bool IsBatchMatrix<const T&> = IsBatchMatrix<T>;


    template <typename T>

    constexpr bool IsBatchMatrix<T&&> = IsBatchMatrix<T>;


    template <typename T>

    constexpr bool IsBatchMatrix<const T&&> = IsBatchMatrix<T>;

    ```


    Five specializations (4–17 lines) are defined to remove const and reference symbols
    from the types—making metafunctions more common. For example, after the introduction
    of specializations, IsBatchMatrix<const int> and IsBatchMatrix<int> will produce
    the same result: this is what we want to see.


    In the basic definition of IsBatchMatrix, it returns false directly, indicating
    that the tag for a specific data type is not BatchMatrix by default. As the program
    develops, we need to introduce a new type A, which is a list of matrices. We can
    describe it with the following specialization in the program:


    ```

    template <>

    constexpr bool IsBatchMatrix<A> = true;

    ```


    In this way, the metafunction IsBatchMatrix<A&>, IsBatchMatrix<const A>, etc.,
    will return true in subsequent code.'
