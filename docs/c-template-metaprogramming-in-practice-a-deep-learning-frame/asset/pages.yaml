    # 5.8 The Trade-off and Limitations of Operations


    # 5.8.1 The Trade-off of Operations


    Usually, the main problem in introducing operations is not the writing of the
    code, but the trade-off between "using an existing combination of operations"
    and "introducing new functions for operations"—more of a design issue. Various
    operations can be combined with other operations. A typical example: elements
    in a matrix, addition and multiplication can be combined to form subtraction:


    $A - B = A + (-1) \times B$


    So, is is it necessary to introduce subtraction? Essentially, an expression template
    itself can be considered a tree structure. If we choose to use a combination of
    existing operations to form new operations, we only need one root node to represent
    the result of the operation and two leaf nodes represents in order to construct
    a tree structure that represents subtraction. However, if we combine addition
    with multiplication to "simulate" subtraction, then the constructed subtraction
    tree needs five nodes to indicate—three nodes are needed to represent the input
    and output of the multiplication, and the other two nodes represent the other
    operand and the final operation result respectively. Increased depth of the trees
    increases the difficulty of subsequent optimization.'
