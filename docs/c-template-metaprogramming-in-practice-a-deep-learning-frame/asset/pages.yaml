    The parameters contained. The components that the data experience in forward propagation
    are exactly the same as the components in backward propagation but the orders
    are exactly the opposite. The deep learning framework needs to maintain the processes
    of forward and backward propagation, ensuring that the right results are obtained
    at each step with enough efficiency of computations.


    +   - update: after forward and backward propagation of one or more samples, the
    system accumulates parameters'' gradients, which can be used to update the parameter
    values. The most basic way to update is to multiply a gradient value by a factor
    and add the result to the original parameter. Of course, there are other ways
    to update parameters, each of which has its pros and cons, and the deep learning
    framework needs to provide a variety of update methods for users to choose.


    It is not difficult to be aware that the deep learning framework plays an important
    role in every step of model training. A deep learning framework may also contain
    extended features. For example, deep learning frameworks may be required to support
    multi-machine concurrent training to speed up training because the calculation
    speed of forward and backward propagation is relatively slow. What''s more, a
    good deep learning framework should be able to output some intermediate results
    for debugging.


    # 3.1.3.3 Predictions with Models


    After a model is trained, it can be used for prediction. The so-called prediction
    refers to the process of entering samples into model, executing forward propagation
    and calculating the output results. From the perspective of neural networks, the
    prediction process of the model only involves forward propagation, without backward
    propagation or parameter update, so it is simpler than model training. Meanwhile,
    since the model prediction only involves forward propagation, so it doesn''t need
    to record some intermediate variables probably required for backward propagation,
    which spares room for optimization.


    An excellent deep learning framework should not only support the training of models,
    but also further optimize the prediction using models in order to improve the
    speed of prediction and reduce the use of resources.


