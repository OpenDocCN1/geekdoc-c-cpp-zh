  md: '# C++ Template Metaprogramming in Practice


    With the support of the above techniques, it can be relatively facile to introduce
    performance optimization at the network level for MetaNN. It is an advantage that
    deep learning frameworks without metaprogramming does not have. This chapter discusses
    the related techniques for evaluating optimization.


    The evaluation in MetaNN involves the interaction with data types and operation
