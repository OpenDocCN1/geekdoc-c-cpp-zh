  md: '# C++ Template Metaprogramming in Practice


    Although the media often use philosophical metaphors as "simulating the human
    brain" to introduce deep learning techniques to the public, making the public
    more or less aware that it is a powerful and mysterious technology. However, it
    often misleads the public to some extent. This book avoids using such biological
    metaphors and introduces the basics of the technology from programmers'' perspective
    instead.


    Readers often see deep learning and machine learning mentioned together, but in
    fact deep learning is an important subdomain of machine learning.


    # 3.1. From Machine Learning to Deep Learning


    As programmers, you no doubt understand how to write programs to solve practical
    problems. When we need to implement a program, which caters for users'' input
    and then displays different contents based on their input, we will naturally tear
    down the functionality into the form that the sequences, loops, and branch. When
    the problem is a little complicated, such as sorting elements in an array based
    on certain information, it''s natural to come up with some sorting algorithms.
    Further, when designing large-scale projects, we will need to refer to classic
    design patterns to ensure reuse and flexibility modules.


    However, consider the following question: we need to implement a program that
    determines whether a cat or a person is depicted in a picture by the picture entered
    by users. Programmers who don''t know anything about machine learning may be aware
    of what to do after making the program the pixel value of a picture into an array.
    Some programmers might try to write the program like this: if the pixel value
    of some area is within a certain range, the system decides that a cat is depicted
    on it. Such procedure, in today''s view, is ridiculous—measured by accuracy, this
    program may only be a little more accurate than randomly guessing a category of
    it. Even if it is a cat, the pixel value on different pictures will vary by their
    camera angle and shooting time.


    If we make this problem a little easier, assuming a magical machine that can tell
    us how many feet in the picture has after a picture is entered, then we can use
    the information to determine. If the machine returns the creature in the picture
    has 4 feet, then we consider it as a cat; if there are two feet, then there is
    a person.


    We can''t guarantee that this judgment is 100% accurate. For example, because
