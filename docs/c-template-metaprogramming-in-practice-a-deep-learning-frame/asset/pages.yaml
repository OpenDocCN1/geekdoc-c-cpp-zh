  md: '# Basic Layers ■ 165


    Support for forward and backward propagation is of great significance, but far
    from all the features supplied by layers. In fact, layers in MetaNN have worked
    on many implementation details in order to satisfy both flexibility and efficiency.
    Next, let''s take the cycle of layer objects as a clue to comprehend the design
    details of layers in MetaNN.


    # 6.1.2 Construction of Layer Objects


    In general, we hope layers to be more versatile—especially basics as the basis
    for forming composite layers. The generality is often embodied when we want a
    layer to have some behavior and can be fine-tuned with parameters. For instance,
    a layer with a parameter matrix during training, it would normally calculate the
    gradient in back propagation for subsequent adjustments. Nevertheless, in special
    cases, we want the matrix contained in the layer to remain unchanged. At this
    point, the layer does not need to calculate the parameter gradient. Similarly,
    we may also adjust the behavior of a layer in other ways. We wish to support versatility
    to some extent—supply interfaces that allow users to decide on the details of
    behaviors, which can be determined at the beginning of the construction of layer
    objects and will remain unchanged in use of layers. Therefore, a layer should
    provide interfaces to receive the parameters that control its behavior when constructed.


    If implementing based object-oriented programming, we can adopt classes to represent
    various layers and introduce parameters into constructors of classes to control
    the subsequent behavior of objects. Nonetheless, MetaNN is a framework for generic
    programming. In addition to introducing parameters into constructors, we can also
    set a layer as a class to specify its behavior by introducing template parameters
    for it. It is an inherent advantage of templates: for instance, stack in the STL
    is a template, which can be implemented with vector, deque, or other libraries
    at the low level. We can set the details of its underlying data structure by specifying
    the template parameters of stack. Similarly, we can specify the details of its
    behavior by introducing template parameters in layers in MetaNN.


    > There is one benefit of specifying behavior details using template parameters:
    constructors can only be called at runtime and parameters are processed at compile
    time. Specifying parameters at compile time allows us to introduce better optimization
    using characteristics of compile time, which is not available for runtime parameters.
    Also consider the example of stack. If its underlying data structure is specified
    through stack''s constructor in the STL, its implementation will be a lot more
    complex. Nevertheless, it is using template parameters that stack can optimize
    data structures at compile time to enhance its performance. For layers in MetaNN,
    we deliver a few parameters in the constructor, using template parameters to specify
    most of its behaviors.


    # 6.1.2.1 Information Delivered over Constructors


    In MetaNN, if necessary, we specify the name of a layer in the string of the constructor,
    as well as information such as the dimensions of the input parameters and the
    output. A deep learning network may contain several layers, each of which may
    contain parameter matrices. In order to make a distinction between different parameter
    matrices in the layers, we ought to assign each matrix a name. MetaNN will name
    a layer that contains parameter matrices, and the layer uses its name as a prefix
    to nominate the parameter matrices it contains. For example, if a layer named
    “MyLayer” contains two parameter matrices, the layer can name the parameter matrices
    it contains as “MyLayer-1” and “MyLayer-2.”'
