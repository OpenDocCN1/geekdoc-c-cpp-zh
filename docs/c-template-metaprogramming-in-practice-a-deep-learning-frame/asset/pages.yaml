  md: "# Basic Tips 21\n\nHere, *if constexpr* must receive a constant expression,\
    \ namely, the compile-time constant. When the compiler parses the invocation of\
    \ a function containing *if constexpr*, it will automatically select the statement\
    \ body where the *if constexpr* is true and ignore other statement bodies. For\
    \ example, when the compiler parses a function call in line 15, a function will\
    \ be automatically constructed as follows:\n\n```\n// template <bool Check>\n\
    auto fun() {\n    if constexpr (Check) {\n        return (int)0;\n    }\n    else\
    \ {\n        return (double)0;\n    }\n}\n```\n\nThe code written with *if constexpr*\
    \ is more like branching code at runtime. At the same time, it has an extra benefit\
    \ that it can reduce the generation of instances. Using the code snippets in the\
    \ previous section, the compiler needs to construct two instances (*wrap2* and\
    \ *fun*) when instantiating. But using the code snippets in this point, the compiler\
    \ produces only one instance of the function *fun* when instantiating. Although\
    \ good compilers can merge instances with inline or other ways, we cannot guarantee\
    \ that compilers will do such kind of optimization. In turn, using *if constexpr*\
