    # 3.2.3.2 Matrix Operations


    The deep learning framework should support a variety of methods in matrix operations,
    such as the dot product of matrix or calculating tanh values for elements in the
    matrix. The development of deep learning is changing rapidly and many new operations
    are being invented constantly. Accordingly, the deep learning framework should
    also be able to support computational expansion and can easily introduce new operations.


    MetaNN divides matrix calculation into two steps: construction of computation
    expressions and evaluation of computation expressions. The former is to construct
    an expression template that represents the result of an operation while the later
    is to execute an actual calculation of the expression template to obtain the result.
    For example, an operation adding two matrices produces an expression template
    that represents the result of an operation. This expression template can be evaluated
    later to obtain the result matrix, but we cannot obtain the values of the elements
    in the result matrix through the expression template until the evaluation finished.


    The reason for this design is, on the one hand, the construction of an expression
    template representing the results of the operation is quite fast compared to the
    evaluation; on the other hand, separating the construction of expressions from
    the evaluation makes it possible to optimize specifically for evaluation and improve
    system performances. We will use a specific chapter to discuss matrix operations
    and construction of expression templates.


    Because operations are divided into two steps and the evaluation will be discussed
    separately, we mainly focus on the process of constructing operation expressions
    when discussing the "operations" in MetaNN. The "operation" we discuss in Chapter
    5 also refers to the construction of operation expressions while the evaluation
    will be discussed in Chapter 8.


