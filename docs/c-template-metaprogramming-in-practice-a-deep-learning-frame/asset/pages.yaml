    # 5.6.2 Operation Add


    The operation Add is more complicated than Sigmoid since it is a binary operator
    that processes three types of parameters, including scalars, matrices, and lists
    of matrices.


    Currently, MetaNN does not support operations of scalar addition which usually
    we don''t need. Because operations allow the addition of two floating-point scalars
    can be done directly through the built-in operations provided in C++. Nonetheless,
    we ought to support many kinds of addition beyond, such as the following ones.


    +   * A scalar is added to a matrix: the operation is to add the scalar to each
    element of the matrix.

    * A scalar is added to a list of matrices: the operation is to add the scalar
    to each element of the list of matrices.

    * A matrix is added to a matrix: the operation is to add the corresponding elements
    of the matrices.

    * A matrix is added to a list of matrices: the operation is to add each element
    in the list of matrices to another operand (matrix).

    * Lists of matrices are added: the two lists of matrices should contain the same
    number of matrices. On this basis, the corresponding matrices in the two lists
    are added.


    Considering that the commutative property is applied in addition, we ought to
    deal with all combinations of input parameters.'
