    For example, when evaluating SoftmaxDerivative, we construct an intermediate matrix
    and calculate the dot product of it and the input gradient. In order to calculate
    the dot product, we should construct a request for dot product and deliver it
    to EvalPlan. This request is constructed during the evaluation process of SoftmaxDerivative,
    which is triggered when EvalPlan:Eval is called. Accordingly, we obtain a new
    evaluation request when we call EvalPlan:Eval.


    According to the original logic of EvalPlan, the parameters of the dot product
    request are all principal types. The request will be placed in the first EvalCluster.
    However, the computation request of SoftmaxDerivative may be in a subsequent EvalCluster.
    When calculating SoftmaxDerivative, the system will assume that the EvalCluster
    has already been processed, which will lead to the disposal of requests that have
    been processed and incurs computation errors.


    To deal with this problem, the concept of EvalLayer is introduced in EvalPlan.
    Initially, EvalPlan contains only one EvalLayer to receive the evaluations. Before
    calling EvalPlan:Eval, the system should construct a new EvalLayer and requests
    entered during the evaluation process will be placed in the new EvalLayer. After
    processing each Cluster, the system will determine whether the newly constructed
    EvalLayer contains the newly introduced EvalCluster. If true, a new EvalLayer
    is introduced during processing the previous EvalCluster. The system will process
    the next EvalCluster after processing all the evaluations in the new EvalPlan.


    In fact, EvalPlan can contain multiple EvalLayers—they form a structure. New requests
    may be introduced in the second EvalLayer when the system process requests in
    the first EvalLayer; and new requests may be introduced in the third EvalLayer
    when processing requests in the second EvalLayer. EvalPlan is designed to handle
    these complex situations.


    # 8.1.2.3 EvalPool


    EvalPool obtains the evaluations in EvalPlan and calls the evaluation function
    to complete the actual evaluation.


    Objects of type EvalUnit are delivered to EvalPool, each of which contains an
    Eval interface that encapsulates the actual evaluation logic. The main task for
    EvalPool is to call this Eval-interface to complete computations.


    The implementation of EvalPool can be fairly simple, such as calling the function
    of each EvalUnit object in turn. It can also be complicated, as containing several
    computing threads to execute multiple computations at the same time. EvalPool
    should supply an interface Barrier for all evaluations in EvalPlan to be completed.
    As mentioned earlier, EvalPlan divides the evaluations into EvalCluster. After
    delivering all the computation requests in a certain EvalCluster, it calls the
    interface EvalPool:Barrier. After the interface returns, it continues to deliver
    the evaluation unit in the next EvalCluster. Accordingly, EvalPool must guarantee
    that the computations in EvalPool are fully completed when its interface Barrier
    returns—in order to ensure the sequentiality of computations.


    In the current version of MetaNN, only a fairly trivial EvalPool is implemented,
    which serves to evaluate incoming EvalUnit objects and does not involve multithreaded
    operations. We can also add more complex EvalPool to the framework if necessary,
    thereby promoting computational parallelism.'
