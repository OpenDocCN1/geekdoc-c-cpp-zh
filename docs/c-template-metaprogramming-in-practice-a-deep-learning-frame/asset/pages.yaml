    ComposeTopology''s input is a syntax for structural description, which consists
    of four clauses that describe the sublayers contained in a composite layer, the
    input/output connections among the sublayers and the input/output connections
    between sublayers and the composite layer. MetaNN assumes that the complex connections
    are essentially a directed acyclic graph in which the nodes represent the sublayers
    and the arcs depict the directions of the data in the sublayers during forward
    propagation. The sublayers inside the composite layer constitute a graph structure.
    When the forward and backward propagation is executed, the data will flow through
    each layer in a certain order, which cannot be confused or otherwise there will
    be logical errors.


    In Figure 7.1, for example, the composite layer contains two sublayers, S1 and
    S2. During forward propagation, the data delivered into the composite layer can
    only pass through S1 and then S2. If this is reversed, the output of S2 depends
    on the output of S1, so the interfaces for forward propagation in S2 are called
    correct results are naturally available. It is similar to backward propagation
    where the gradient information entered into the composite layer must pass through
    S2 and then through S1. Deriving the sequence of propagation is the basis for
    ensuring that the composite layer behaves correctly, which is the most significant
    task for ComposeTopology.


    How can we transform the structure of the diagram into such a sequence? If familiar
    with data structures and algorithms, readers may have a solution: topological
    sorting. In fact, it is a classic problem of topological sorting. The source of
    ComposeTopology''s name is that it essentially implements topological sorting
    of sublayers within the composite layer.


    The topological sorting given by ComposeTopology embeds the order of layers in
    which data should pass through in turn during forward propagation. Accordingly,
    in backward propagation, we can achieve automatic calculation of gradients by
    going the layers in reverse order of forward propagation. Of course, there are
    still many implementation details for forward and backward propagation. These
    details will be discussed later in this chapter.


    Unlike the general implementation of topological sorting, ComposeTopology-topological
    sorting is executed at compile time and fully utilizes metaprogramming techniques
    to implement the entire algorithm. The implementation of ComposeTopology is a
    comprehensive application of metaprogramming techniques. It can be said that readers
    can be relatively proficient in using the various basic methods of metaprogramming
    if fully understanding the implementation code of topological sorting. Next, let''s
    review the topological sorting algorithm and then dive into the implementation
    details of ComposeTopology.


