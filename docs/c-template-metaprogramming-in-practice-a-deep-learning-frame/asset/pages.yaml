  md: "# 18 C++ Template Metaprogramming in Practice\n\n# 1.3.2.3 Implementing Branches\
    \ Using std::enable_if and std::enable_if_t\n\nThe definitions of enable_if and\
    \ enable_if_t are as follows:\n\n```\nnamespace std\n{\n    template<bool typename\
    \ T = void>\n    struct enable_if {};\n\n    template<class T>\n    struct enable_if<true,\
    \ T> { using type = T; };\n\n    template<bool B, class T = void>\n    using enable_if_t\
    \ = typename enable_if<B, T>::type;\n}\n```\n\nT is not particularly important\
    \ for the implementation of the branch. It is important when B is true, the metafunction\
    \ enable_if can return the result type. Branches can be implemented based on this\
    \ structure. Considering the following snippet:\n\n```\ntemplate<bool IsFeedbackOut,\
    \ typename T,\n    std::enable_if<t::IsFeedbackOut>* = nullptr\nauto FeedbackOut(T&)\
    \ { /* ... */ }\n\ntemplate<bool IsFeedbackOut, typename T,\n    std::enable_if<t::IsFeedbackOut>*\
    \ = nullptr\nauto FeedbackOut_(T&) { /* ... */ }\n```\n\nA branch is introduced\
    \ here. When FeedbackOut is true, std::enable_if_t<IsFeedbackOut> makes sense,\
    \ which makes the first substitution successfully and correspondingly the second\
    \ function substitution fail. Conversely, when FeedbackOut is False, std::enable_if<t<IsFeedbackOut>\
    \ makes sense, which makes the second function substitution successfully and the\
    \ first substitution fail.\n\nThere is a feature called SFINAE (Substitution Failure\
    \ Is Not An Error) in C++. For the discussed scenario, when one function substitution\
    \ fails and the other function substitution succeeds, the compiler will select\
    \ the function whose substitution succeeds without reporting the error. The implementation\
    \ of branches here also takes advantage of this feature.\n\nIn general, enable_if\
    \ and enable_if_t are used in functions as overloads—overloads distinguish among\
    \ functions with the same name but different types of parameters. In some cases,\
    \ we want to introduce functions with the same name, but we can't distinguish\
    \ among them by parameter type.¹10 Thus, we can solve the corresponding overload\
    \ problem to a certain extent through enable_if and enable_if_t.\n\n10 We'll see\
    \ examples like this in the deep learning framework."
