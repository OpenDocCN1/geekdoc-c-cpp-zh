  md: '# Composite and Recurrent Layers ■ 209


    The introduction of policies adjusts the behavior of layers often lie in two situations.
    Firstly, each layer in MetaNN has its default behavior—corresponding to the default
    value of policies. In general, if we want to alter a behavioral detail, it is
    usually the corresponding details of all the sublayers in the composite layer
    that should be adjusted. By default, for example, each layer in the network receives
    input in a non-batch way (BatchMode is false). We might wish all the sublayers
    in a certain composite layer to handle the input in a Batch way—that is BatchMode
    be true.


    Another scenario is that most sublayers in a composite layer serve to satisfy
    the requirements but the policy concerning them requires adjustment. For instance,
    we have most sublayers to update parameters during the training phase and some
    not update parameters contained therein. In fact, when configuring the policy
    for the composite layer, we can solve most problems by dealing both of the discussed
    situations.


    There are relationships of including being between a composite layer and its sublayers.
    On such structures, a natural solution to the policy adjustment is that we can
    specify a policy for the composite layer, in addition sublayers can specify their
    own behaviors. The policy specified by sublayers can override the policy specified
    by the composite layer. Assuming there are two policy objects P1 and P2, we have
    most sublayers in the composite layer to possess the policy specified by P1 and
    a sublayer SubX to possess the behavior specified by P2. Then the policy of the
    composite layer can be declared as follows:


    +   1 | PolicyContainer<P1, SubPolicyContainer<SubX,>>


    SubPolicyContainer is container in MetaNN that assigns the appropriate policy
    object. When using the discussed code to define template parameters for the composite
    layer, the sublayers except SubX will correspond to PolicyContainer<P1> while
    SubX corresponds to PolicyContainer<P1,P2> or PolicyContainer<P2>, which depends
    on whether P1 and P2 conflict (i.e., whether their major and minor categories
    are the same). If P1 not conflict with P2, then SubX corresponds to PolicyContainer<P1,P2>,
    which can be considered as SubX "inheriting" the behavior from its parent container;
    otherwise if P1 and P2 conflict, then SubX responds to PolicyContainer<P2>, indicating
    that the behavior specified for SubX overrides the behavior specified by the composite
    layer.


    We call this extension the inheritance of policy. The inheritance of policy can
    be further promoted. For instance, SubX also contains a sublayer SubY, and can
    be written as:


    ```

    1 PolicyContainer<P1,

    2 SubPolicyContainer<SubX, P2,

    3 SubPolicyContainer<SubY, P3>>>

    ```


    Such a structure specifies the policy for each sublayer in the composite layer
    with a relatively simple syntax. We''ll consider in this chapter how to implement
    the inheritance of policy.


    # 7.1.4 Correction of Policies


    The correction logic of policy is also involved in the composite layer. Chapter
    6 introduced the policy IsFeedbackOutput, which indicates whether a layer needs
    to calculate the output gradient. In general, the information should be derived
    from the relationships between layers. Specifically in composite layers, this
    involves the problem of policy correction.'
