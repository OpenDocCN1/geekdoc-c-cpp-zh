    However, this book will not use MPL. The main reason is that MPL encapsulates
    some of the underlying details that are important for metaprogramming learning.
    Simply using MPL will somewhat lead to the loss of the opportunity to learn metaprogramming
    techniques. On the other hand, learning MPL with knowledge of basic metaprogramming
    methods will help with a deeper understanding and easier use of MPL. It''s just
    like we usually start by discussing arrays like int a[10] and using them to drive
    important concepts such as pointers when C++. In this basil, we will grasp a deeper
    understanding when discussing vector<int>. This book will talk about the core
    techniques of metaprogramming rather than some metaprogramming libraries are used.
    We will only use simple custom structures to represent arrays, which are as we
    use int*.


    Essentially, what we need is not a representation of an array, but a container:
    to hold each element of the array. Elements can contain numeric values, types,
    or others. You can regard these three kinds of data as different categories of
    operands. Since that int and float in C++ are different types, in metaprogramming
    we can simply think that "numeric values" and "types" belong to different categories.
    A typical array in C++ (whether int or vector<int>) can hold only one type of
    data—the reason for this design is that it is simple and meets most requirements.
    Similarly, containers can hold only one category of operands. For example, a container
    that can hold only numeric values, a container that can only hold types, or a
    container that can only hold templates. This kind of containers can already meet
    the majority of needs.


    The variadic template has been introduced in C++ 11 to make it easy to implement
    containers we need:


    ```

    template <int...> Vals struct IntContainer;

    template <bool...> Vals struct BoolContainer;

    template <typename...> struct TemplateCont;

    template <template <typename>...> class...<T> struct TemplateCont2;

    ```


    The code snippet defines five containers (equivalent to five arrays). The first
    two containers can hold types of int and bool. The fourth container can hold templates
    as its element and each template element can receive one type as a parameter.
    The fifth container can also take templates as its element, but each template
    can hold zero or more type parameters.


    Careful readers may find that the discussed statements are actually declarations
    rather than definitions (each is not followed by a brace, so it is just a declaration).
    It''s also a feature of C++ metaprogramming. In fact, we can add a brace at the
    end of each statement to introduce a definition. Think about how to define it?
    No, not. The declaration already contains all the information that the compiler
    needs, so why do we introduce a definition?


