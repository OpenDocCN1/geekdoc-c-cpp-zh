    On the other hand, we can''t introduce new operational expressions for every possible
    combination of operations, which will greatly raise the number of operational
    expressions and are detrimental to system maintenance. A better trade-off is to
    introduce specialized functions to represent operations that may be used frequently
    in the framework. If an operation is not used so frequently, it can be combined
    with multiple suboperations.


    # 5.8.2 Limitations of Operations


    An operation is a construct based on data and forms new data by combining and
    transforming the original data. It is often employed in deep learning frameworks,
    but it is also a relatively underlying construct with some limitations in usage.


    First, it can be tough for users who don''t know much about deep learning systems
    to determine when and what to use operations. The author does not mention too
    mathematical deduction in the discussion of this chapter, most of which cases
    concerns directly, for instance, how to calculate the derivative of Softmax, etc.
    It is because that these mathematical deductions are beyond the scope of this
    book. On the other hand, readers unfamiliar with these mathematical principles
    may raise questions about which to choose to represent the derivative calculation
    for another operation when reading this section. In fact, if an operation is offered
    directly to users, they may have the same questions. This is not what we want.


    Secondly, there is a risk that operations could be misused. For example, for SigmoidDerivative,
    assuming that the input of Sigmoid is x and the output is y, then we use y as
    input of SigmoidDerivative to obtain the derivative of y. Nonetheless, it is not
    embedded in the declaration and definition of the function SigmoidDerivative.
    A typical mistake is to take the input of Sigmoid as input to SigmoidDerivative—if
    x is used as input to SigmoidDerivative, the result will be wrong.


    The limitation forces us to introduce more advanced constructs that provide interfaces,
    which are convenient and not error-prone. We''ll discuss the concept of “layers”
    in the next chapter, which is the upper-level component of operations, will better
    combine and encapsulate operations.


    # 5.9 Summary


    This chapter discussed the design and implementation of operations in MetaNN.


    MetaNN adopts template expressions to represent operations. A template expression
    is a bridge between operations and data that encapsulates operations and supplies
    the interfaces that data needs to support. Through template expressions, we postpone
    the evaluation process of operations to provide more space for optimization.


