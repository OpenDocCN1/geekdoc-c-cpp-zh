    # 1.4 Curiously Recurring Template Pattern (CRTP)


    Much of what is discussed in this chapter does not involve newly introduced technologies
    in C++, but is based on some of the usage methods derived from existing technologies.
    These methods may not be common when using runtime programs, but they are often
    used in metaprogramming. These methods can also be considered as idioms in metaprogramming.


    If mutations are graded, then metunction that make basic transformations (such
    as the input is a type and it returns the corresponding pointer type) are the
    lowest, above which is the metunction that contains sequences, branches, and looping
    logic. With these tools in hand, we can learn some of the more advanced metaprogramming
    methods, one of which is CRTP.


    CRTP is a way of declaring a derived class and what is "curious" is that the derived
    class passes itself as a template parameter to its base class. Consider the code
    snippet:


    ```

    1 template <typename D> class Base { /*...*/ };

    2 class Derived : public Base<Derived> { /*...*/ };

    ```


    Line 3 defines the class Derived, derived from Base<Derived>—the base class takes
    the name of the derived class as the template parameter. At first glance it seems
    to be suspected of a circular definition, but it is indeed legal. It just looks
    like a little "curious"


    CRTP can be applied in many scenarios and simulating virtual functions is one
    of its typical applications. Readers accustomed to object-oriented programming
    are no stranger to virtual functions—we can declare a virtual function in the
    base class (which actually declares an interface) and implement the interface
    in different ways in each derived class, providing different functions. It is
    a classic way to implement polymorphism using inheritance in object-oriented programming.
    Choosing the correct virtual function to execute requires the corresponding mechanism
    at runtime to support it. In some cases, the functions we cannot declare as virtual
    functions, such as the following example:


    ```

    1 template <typename D>

    2 struct Base

    3 {

    4 template <typename TI>

    5 void Fun(const TI& input) {

    6 D* ptr = static_cast<D*>(this);

    7 ptr->Imp(input);

    8 }

    9 };

    10

    ```'
