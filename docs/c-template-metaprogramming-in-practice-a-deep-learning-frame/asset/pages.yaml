    # 8.1.2.6 EvalHandle


    EvalHandle is the general term for evaluation handles in MetaNN, which can be
    used to obtain the corresponding results of evaluation through its interface Data
    after the completion of evaluation. MetaNN implements three class templates that
    represent handles. Unlike EvalUnit and EvalGroup, these class templates are not
    derived from a base class. They are only conceptually relevant—they all provide
    the interface Data to return the results of evaluation and the interface DataPtr
    to return a pointer to the result value. Distinct evaluation handles return different
    data types and EvalPlan requires a uniform representation of data to plan the
    order of evaluation order. Therefore, evaluation handles should provide the interface
    DataPtr, which returns a void* pointer to the handle for EvalPlan to use.

    These three class templates are collectively referred to as EvalHandle, but their
    specific scenarios are


    +   * EvalHandle<TData>: It encapsulates the results of evaluation. In general,
    at the beginning of construction of this handle, the data saved in it is itself.
    It provides the interface IValidated to determine the validity of the data (i.e.,
    whether evaluation has performed). If the interface returns false, the system
    should execute evaluation and fill the handle with the results. EvalHandle<TData>
    also provides Allocate to allocate objects for preserving results; MutableData
    to obtain references to the objects for the filling of results; SetValue to configure
    the value of results after the filling of results. In addition to the features,
    EvalHandle<TData> guarantees that the same result object is shared across multiple
    copies and the result are same when multiple copies of EvalHandle<TData> call
    DataPtr. It allows us to introduce multiple copies of EvalHandle<TData> in the
    process of evaluation, simplifying the writing of the evaluation code.

    * ConstEvalHandle<TData>: MetaNN requires each of its data members to offer an
    interface EvalRegister to register evaluations and return the appropriate attribute.
    The handle will serve to obtain the evaluation results without providing a write
    interface to modify the contents. It just needs to provide a read interface. MetaNN
    uses ConstEvalHandle<TData> to describe this read-only handle. EvalRegister option
    templates returns an instantiation of ConstEvalHandle, which can receive data
    objects and construct the ConstEvalHandle handle.

    * DynamicEvalHandle<TData>: Chapter 6 introduces the data type DynamicData to
    serve intermediate results of layers, which is also involved in the evaluation
    process. However, DynamicData has specific type information, so we don''t know
    what type of handle should be constructed when calling EvalRegister for this data
    type. To solve this problem, MetaNN introduces a data type DynamicConstEvalHandle<TData>.
    DynamicData::EvalRegister returns objects of this type. DynamicConstEvalHandle<TData>
    is similar to ConstEvalHandle<TData>—they are read-only and we cannot modify the
    data inside.'
