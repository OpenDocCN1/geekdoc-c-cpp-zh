    # 5.2.2.3 Auxiliary Class Templates


    According to the previous analysis, it is natural to be aware that distinct parts
    involved in operations can be reduced logically to different degrees. Depending
    on the degree of reuse, MetaNN introduces several auxiliary class templates for
    each operation template to determine the validity of the input parameters, define
    the category for the output, and supply interfaces related to dimensions and evaluation.


    Note that these auxiliary class templates are conceptually orthogonal. If we combine
    few auxiliary templates it can impose an impact on the reuse of code. For instance,
    if we combine auxiliary templates related to dimensions and evaluation into one,
    we should write the same calculation logic of dimensions repeatedly when introducing
    diverse computational logic for operations.


