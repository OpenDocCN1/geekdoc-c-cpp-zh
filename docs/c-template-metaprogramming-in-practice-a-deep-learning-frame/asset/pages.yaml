  md: "# 1.3.2.1 Implementing Branches Using std::conditional and std::conditional_t\n\
    \nconditional and conditional_t are two metafunctions provided in type_traits,\
    \ defined as follows:\n\n```\nnamespace std\n{\n    template <bool B, typename\
    \ T, typename F>\n    struct conditional {\n        using type = T;\n    };\n\n\
    \    template <typename T, typename F>\n    struct conditional<false, T, F> {\n\
    \        using type = F;\n    };\n\n    template <bool B, typename T, typename\
    \ F>\n    struct conditional_t = typename conditional<B, T, F>::type;\n}\n```\n\
    \nIts logic is that if B is true, the function returns T, otherwise F is returned.\
    \ It is typically used in\nt following way:\n\n```\nstd::conditional<true, int,\
    \ float>::type x = 3;\nstd::conditional_t<false, int, float> y = 1.0f;\n```\n\n\
    The variable x of int and the variable y of float are defined, respectively.\n\
    The advantage of conditional and conditional_t is that they are relatively simple\
    \ to use, but the\ndisadvantage is that they are not expressive—can only implement\
    \ binary branches (true\nand false branches) and it behaves more like a conditional\
    \ operator at runtime: x = B?\nT. Support for multiple branches (a feature similar\
    \ to switch) is more difficult. Accordingly, the\nuse of conditional and conditional_t\
    \ is relatively narrow. Thus, these metafunction are not\nrecommended unless there\
    \ are particularly simple cases of branches.\n\n# 1.3.2.2 Implementing Branches\
    \ with (Partial) Specialization\n\nIn the previous discussion, we implement branches\
    \ using specialization. (Partial) specialization\nis naturally used to introduce\
    \ differences, so it is natural to implement branches by this way.\nConsider the\
    \ following code snippet:\n\n```\nstruct A; struct B;\n```"
