  md: '# Chapter 3


    # A Brief Introduction to Deep Learning


    Deep learning is a branch of artificial intelligence, which has been widely used
    in many fields such as speech, image, and natural language processing. This book
    is not intended to discuss deep learning in depth—it focuses on implementing such
    a framework with metaprogramming the mathematical principles of deep learning
    algorithms. Nevertheless, a preliminary understanding of the background of deep
    learning is a prerequisite for the follow-up discussion.


    This chapter provides an overview of deep learning and the framework to be implemented,
    giving the reader a holistic understanding of the framework to be implemented.


    # 3.1 Introduction to Deep Learning


    Readers of the computer industry must have heard of deep learning more than once,
    and more or less its breakthrough achievements in fields such as image processing
    and speech recognition. For example, AlphaGo, a deep learning-based chess(go)
    program developed by DeepMind for Google, shocked the world by beating top chess
    players Lee Sedol and Ke Jie; however, the application of deep learning did not
    stop there. In fact, deep learning (or a more basic concept: machine learning)
    permeated every aspect of our lives.


    For example, when we drive or walk in a public area of a busy city, images captured
    by definition cameras deployed in the corner of the city are transferred to the
    relevant systems for automatic number-plate recognition, facial recognition, collision
    detection, etc. to ensure public safety throughout the city; when we pay by credit
    card at a convenience store, banks data centers employ this technology to automatically
    determine whether it is an identity theft; when we use search engines, search
    algorithms running on server clusters adapt deep learning to match users'' input
    with massive amounts of data and return results to satisfy users; when we use
    social or newsletter software, algorithms supported by deep learning are deployed
    on servers to analyze users'' interaction with software, providing a relatively
    personalized service to users.'
