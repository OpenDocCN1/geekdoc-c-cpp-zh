    # Library of Cataloging-In-Publication Data


    Names: Wei, Li, author.

    Title: C++ metaprogramming in practice : a deep learning references / Wei.

    Description: First edition ; Boca Raton, FL : CRC Press, 2021 . Includes bibliographic
    references and

    index.; Summary: "Using the implementation of a deep learning framework as an
    example, C++ Metaprogramming in Practice: A Deep Learning Framework explains the
    example with large relate projects and aims to optimize performance. The book
    is suitable for developers with basic knowledge of C++ who are familiar with machine
    learning frameworks, can also refer to this book to compare the differences between
    the two frameworks implemented with metaprogramming and compile-time computing
    using deep learning frameworks. Consists of eight chapters, the book starts with
    two chapters discussing basic techniques of metaprogramming and compile-time computing.
    The rest of the book''s chapters covers the practical application of metaprogramming
    in a deep learning framework. It examines types and systems, expression templates,
    and writing complex meta-features, as well as others as Heterogeneous dictionaries
    and policies, an introduction to deep learning, type system and basic data operations
    and experiments can construct flexible and efficient code for C++ developers who
    are familiar with object-oriented programming; the main difficulty in learning
    and mastering C++ metaprogramming is establishing the thinking mode of functional
    programming. The meta-programming approach involved at compile time is greater
    than expected. This book enables C++ developers to develop a functional mindset
    and metaprogramming skills. The book also discusses the time cost and cost of
    metaprogramming and provides workarounds for minimizing these costs.”—Published
    by publisher.

