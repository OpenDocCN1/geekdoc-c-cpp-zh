    behavior; on the other hand, the computing template object itself provides an
    interface to represent the result of the operation, which is the abstraction of
    the data. This section analyzes the tasks an operation template needs to accomplish
    and the reuse of logic that may occur during its life cycle by dividing in detail
    the construction and use of operation templates in MetaNN.

    In MetaNN, the construction and use of operation templates involve the following
    aspects.


    # 5.2.2.1 Validation and Derivation of Types


    In the previous chapter, we established the data type system in MetaNN, which
    is also used in computational operations. Operations require the system to determine
    the validity of its input parameters and to determine the category to which the
    corresponding output belongs.


    +   - To verify the category of input operands for the expression to ensure the
    validity of the input. An operation is not valid for all types of data. For example,
    the matrix multiplication needs to receive two matrices as operands. If the arguments
    are two scalars, the operation is invalid. The system should be capable of detecting
    this error and prompting the corresponding information. In general, this part
    of logic is unlikely to be reused because each operation checks the validity of
    its parameters in diverse ways.


    +   - To determine the category of its input operands. The output category of
    the operation is closely pertinent to the category of its input parameters. For
    example, in the addition operation, the result should be a matrix when two matrices
    add together and the result of adding two lists should be a list of matrices.
    An operation template, as a composite data type, may serve as an input to other
    operation templates. So it should derive the category for results of operations.
    The category tag is also relevant to the output, but the output category of operation
    is likely to be consistent with the input category. For instance, if the category
    of the input parameter of an operation is a matrix, it is more likely that the
    output category will be a matrix. We can use this feature to construct the most
    basic inference system of output types. If so, the category of input parameters
    in the operation can be returned to the category of the output. The logic is valid
    for most operations. For operations not in line with the logic, specializations
    are required to derive the actual categories.


