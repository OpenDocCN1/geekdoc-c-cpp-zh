    step after constructing the layer object is assigning a value to the parameter
    matrix contained therein. The data sources of assignments are roughly divided
    into two types: if the layer has not been involved in training before, then we
    need to initialize the parameter matrix through an initializer so that the parameter
    matrix is assigned a specific value (such as 0) or distribution (e.g., normal
    distribution); or we can adopt an existing matrix to assign the parameter matrix—for
    example, obtain the results of model training previously from files and load them
    into the current parameter matrix.


    In order to initialize and load parameters: on the one hand, MetaNN introduce
    the function template Init in layers as an interface for initialization and load
    loading; on the other hand, MetaNN introduces a network-initialization module
    to initialize all the layers contained in the network. We will discuss both in
    more detail later in this chapter.


    # 6.1.4 Forward Propagation


    Each layer ought provide a template FeedForward as an interface to be called during
    forward propagation. The interface should receive information of input passed
    to by its predecessor in the network, calculate the result and return it to its
    successor layer in the network.


    Here''s a problem: each layer variables in the number and meaning of the inputs
    and outputs. For example, the number of input corresponding to the layers that
    represents addition of matrices or transpose of a matrix is not the same; if a
    layer subtraction of matrices, the statuses of the subthend and minuend are all
    distinct—when passed to the layer as, they are non-interchangeable.


    One straightforward way to specify the meaning of each parameter is to introduce
    multiple parameters for FeedForward. it is written as follows:


    ```

    template <typename TMinuend, typename TSubhend>

    auto FeedForward(TMinuend&& minuend, TSubhend&& subthend);

    ```


    Through the names of arguments, we can distinguish the meanings of the two parameters
    (subtrahend and minuend). This approach is intuitive, but may lead to a number
    of problems. First of all, we still cannot prevent the function from being misused—for
    example, for two matrices A and B, we to subtract B from A. However, if users
    accidentally write the two in wrong positions when calling the function:


    ```

    1 FeedForward(B, A);

    ```


    The system will continue to work but the results will be, which will not directly
    lead to compilation errors and run failures, therefore difficult for error debugging.

    Another problem is the fact that it leads to a difference among the interfaces
    FeedForward defined by distinct layers; the number of parameters it receives accordingly
    with different functions of the layers. If we''re dealing with a single layer,
    it is not a big deal. But if we want to introduce a unified set of logic to handle
    the combinations of layers, the disparity among the forms of the interface FeedForward
    in each layer will intensify the complexity of programming.


    Not all layers require this interface. If a layer does not contain a parameter
    matrix, it does not need to provide it.

