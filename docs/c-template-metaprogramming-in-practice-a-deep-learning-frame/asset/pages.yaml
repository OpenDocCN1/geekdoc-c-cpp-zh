    our program can still have a more accurate prediction about whether the creature
    in the picture is a person or cat than a random guess.


    If our goal is to construct such a program, then there are two problems to solve:
    Firstly, assuming that the magical machine already exists, how to maximize the
    information it provides to improve the accuracy of the classification? Secondly,
    how to construct the "magical machine" mentioned earlier, to provide us with such
    information?


    The first question is relatively intuitive. For example, we can consider constructing
    a model whose input is information as the number of feet, whether there is a beard
    on the face, how many hands are on the body, and so on. Then we can convert each
    message into a'
