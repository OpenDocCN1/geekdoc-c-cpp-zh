  md: '# Chapter 1


    # Basic Tips


    This chapter discusses the basic methods involved in metaprogramming and compile-time
    computing. We''ll start with metafunctions and introduce the similarities and
    differences of functions used at compile time and runtime through some simple
    examples. We''ll also discuss the basic writing rules of sequences, branches,
    and looping codes. Finally, we''ll introduce a classic technique—theiously Recurring
    Template Pattern (CRTP).

    The aforementioned content can be regarded as the basic metaprogramming technologies.
    Subsequent chapters of this book will also be considered as applications of these
    technologies. Mastering the techniques, as discussed in this chapter, is a prerequisite
    for skilled use of C++ template metaprogramming and compile-time calculation.


    # 1.1 Metafunction and type-traits


    # 1.1.1 Introduction to Metafunctions


    C++ metaprogramming is typically functional programming in which functions have
    a pivotal figure in the recurring system. The functions are different from those
    defined and used in general C++ programs and are closer to functions in the mathematical
    sense—mapping or transformation without side effects; with the same input, the
    results remain the same no how many times the function is called.


    If there are effects in a function, it is usually caused by the presence of certain
    variables that maintain the state of the system. Each time a function is called,
    even if the input is the same, the difference in the state of the system will
    lead to the output; such a function is called with side effects. Metafunctions
    are called and executed at compile time. During the compilation phase, the compiler
    can only construct constants as intermediate results, unable to construct and
    maintain variables that can record the state of the system and change it hereafter,
    so functions (which are metafunctions) are executed at compile time can only be
    functions without side effects.


    The following code snippet defines a function that meets the limitations of no
    side effects and can be used as a metafunction.


    ```

    constexpr int fun(int a) { return a + 1; }

    ```'
