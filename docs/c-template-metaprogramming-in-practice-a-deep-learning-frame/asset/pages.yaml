    # 2.3.2 Defining Policies and Policy Objects (Templates)


    # 2.3.2.1 Policy Grouping


    An actual system might contain templates like Accumulator: each template uses
    policy objects and some might share policy objects. Therefore, simply declaring
    and using policy objects are not enough for complex systems. A better idea is
    to divide these into groups according to their functionality. Each template can
    use one or more groups of policy objects.


    There is mutual exclusion among policy objects with different value, which belongs
    to the same policy. For example, it can be defined that PAddAcc and PMulAcc represent
    the accumulation by addition and multiplication, respectively. When instantiating
    cumulative objects, we can only choose one from the two and can''t introduce both
    policy objects at the same time—in other words, the following code snippet is:


    ```

    Accumulator<PAddAcc, PMulAcc>

    ```


    To describe the groups to which a policy object belongs and mutual exclusion,
    we introduced two properties for each policy object: the major and the minor class.
    The major class describes the group to which it belongs and the minor describes
    the information about mutual exclusion. If two policy objects belong to the same
    major class and the same minor class, then they are mutually exclusive and cannot
    be used at the same time.


    There are many approaches to group in C++. For example, we can put each group
    in a namespace or place different groups of policy objects in different arrays—but
    these are not good choices. It is because policy objects will participate in the
    calculation of the metafunction


