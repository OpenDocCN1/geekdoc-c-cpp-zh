    # 6.1.6 Backward Propagation


    In backward propagation, the layer''s interface FeedBackward is called. Similar
    to forward propagation, the interface is a template. The intermediate results
    produced in forward propagation will be utilized in the calculation of backward
    propagation.


    There are two points to note about backward propagation. Firstly, each layer should
    provide interfaces for backward propagation. However, not all backward propagation
    interfaces will be called. If a layer is only used for prediction instead of training,
    then backward propagation is not requisite and we opt to optimize for it.


    Secondly, it is also significant that in some cases, even if the layer''s interface
    for backward propagation is called, it can choose not to calculate the output
    gradient. With regard to this point, it is worth mentioning analysis: in deep
    networks, each layer involves forward propagation to produce results and output
    outputs, but backward propagation does not require calculating the output gradient.
    Backward propagation generates an output gradient because the gradient will be
    delivered to other layers and adopted by these layers to calculate the parameter
    gradient. If we do not have to update the parameter matrix for some layers in
    the network, then the layer does not need to receive update from other layers.
    It results in some layers that do not require substantial calculations in backward
    propagation (because they are not required to offer the information of gradients
    for other layers), reducing the amount of computations.


    To achieve optimization at this level, we introduce a parameter IsFeedOut for
    each layer, to indicate whether the output gradient needs calculation for backward
    propagation. If it is false, we will omit the calculation of the output gradient
    in backward propagation of the layer.


    In general, IsFeedOut does not require manual settings of users because its value
    is pertinent to other layers require updates. We''ll see that the information
    can be automatically detected by methods of metaprogramming when discussing composite
    layers in the next chapter.


    If a layer''s IsFeedOut is set to false, then we can acquire an additional benefit:
    in many cases, we no longer need to introduce DynamicData into the layer to support
    calculations of backward propagation. In this way, the logic of forward propagation
    will be simplified and we will obtain more space to optimize system performance.


    # 6.1.7 Update of Parameter Matrices


    In the process of backward propagation, if the parameter matrix contained in the
    layer needs to be updated, then the layer will save the corresponding parameter
    gradient, which will be unified after backward propagation to update the corresponding
    parameters.


    Note that the backward propagation of gradients and the update of parameters are
    two processes. When FeedBackward is called, it can only record the parameter gradient
    and cannot update the parameter with the same time. Firstly, when the parameter
    matrix is shared by multiple layers in the network, if a certain layer updates
    the parameter matrix when it calls FeedBackward, it may affect the gradient calculation
    of another layer. Secondly, some update adjusts the parameter gradient generated
    in backward propagation and the adjustment may be built on all the parameter gradients
    obtained, which requires us to update the parameters uniformly after the backward
    propagation of the entire network is completed.


    The last benefit of updating parameter uniformly is also about the computation
    speed. Essentially, the parameter gradients we preserve are also objects of type
    DynamicData. We only'
