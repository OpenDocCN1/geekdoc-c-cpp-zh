    propagation—we are still constructing operation templates, the entire computing
    process can be deferred to the end, and we can take advantage of the benefits
    of Lazy Evaluation to improve system performance.


    If FeedForward is set as a function, or if we require that its return result be
    some type, then we will lose that advantage to some extent. Typically, we may
    need to return the results after evaluating the results in the layer, thus losing
    the meaning of introducing rich types and computational templates.


    # 6.1.5 Preservation of Intermediate Results


    In the case of the operation Sigmoid, which is encapsulated in the layer SigmoidLayer
    and provided to the outside. If we want to support backward propagation, we need
    a place to hold the intermediate result that SigmoidLayer produces when calling
    FeedForward—the result can be utilized to calculate the output gradient in backward
    propagation. We can select two places to preserve these intermediate results:
    to place intermediate results with output, and to preserve intermediate results
    in the layer. MetaNN selects the second approach because we think the layer represents
    a collection of operations related to the layer itself, which can be better associated
    with these intermediate results. Conversely, if intermediate results are delivered
    together with output, the correspondence between the data and the intermediate
    results will be lost (i.e., how the intermediate result is obtained with the data).


    In MetaNN, however, there is a problem with preserving intermediate results: FeedForward
    is a function template and the type of the intermediate result it during calculation
    depends on the type of argument entered. If we introduce a data field into the
    layer to hold intermediate results, what is the type of the data field?


    A simple solution is to set the type of the intermediate result as the principal
    type.¹ The intermediate results are be converted to the principal type and saved
    during forward propagation. But this conversion is essentially an evaluation,
    which leads to a forward movement of the evaluation process and is not what we
    would like to happen.


    To solve this, we introduced a type “DynamicData,” which encapsulates intermediate
    result types, masking differences among specific types. Constructing dynamic types
    does not involve actual computations and the expense of construction is relatively
    low. Dynamic types also provide an interface for evaluation, which essentially
    forwards the input to the type that encapsulates calculation.


    The introduction of this construct comes at an additional cost: in order to unify
    types, it is equivalent to discarding some information—which complicates subsequent
    optimization processes for evaluation.


    With intermediate results, it is also significant to point out that the field
    used by the layer to save intermediate results is not simply DynamicData, but
    a stack of DynamicData. Because a certain layer may be used multiple times in
    forward propagation², The corresponding intermediate results ought to be recorded
    for each usage. The results of the last calculation be used first, which is typical
    logic of “Last In, First Out” and most reasonable to be expressed in a stack.


    > ¹Principal types are discussed in Chapter 4.


    > ²We will see this case in Chapter 7 when discussing recurrent layers.'
