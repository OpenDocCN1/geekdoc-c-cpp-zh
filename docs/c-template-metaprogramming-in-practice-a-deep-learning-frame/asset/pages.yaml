    # 1.2.3 Container Templates


    At the beginning of learning a programming language, we often start with the basic
    data types supported by the language, as int for a signed integer in C++. On this
    basis, we''ll make a natural extension of basic data types and discuss how to
    use arrays. Similarly, regarding numeric types, and templates as operations of
    metafunctions, metafunction discussed previously are metafunctions with single
    element input. In this section, we''ll discuss the “array” representation of metadata:
    the “element” in the array can be numeric values, types, or templates.


    There are many ways to represent arrays or even more complex structures. The book
    C++ Template Metaprogramming discusses MPL (Boost C++ Template Metaprogramming
    Library). It implements STL-like functionality that provides a good representation
    of complex data structures (such as arrays, collections, mappings, etc.) at compile
    time.'
