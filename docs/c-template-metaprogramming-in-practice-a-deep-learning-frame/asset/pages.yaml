    # 1.5 Summary


    This chapter discusses some basic techniques that can be used in metaprogramming,
    from the way metafunctions are defined and the writing of sequences, branches,
    and looping codes to CRTP. Some of these techniques are specifically designed
    to write metafunction, others needs to be combined with metaprogramming to play
    a greater role. Some techniques seem to be very different from the common runtime
    programming methods at first glance, and beginners will inevitably feel unaccustomed
    to. But, if practicing over and over again, readers will be able to write metaprograms
    and execute most computing functions at compile time after adapting to these techniques.


    This chapter only selects relatively basic and representative techniques to omit
    and many advanced metaprogramming techniques, such as using default parameters
    to implement branches; implementing loops based on pack expansion, fold expression,
    and so on. With object-oriented programming techniques, C++ template metaprogramming
    is a relatively new field, and new techniques have been emerging endlessly. The
    length of a chapter is difficult to enumerate them all. Interested readers can
    search for resources to learn.


    Even if using techniques discussed in this chapter, we can perform complex time
    calculations. Subsequent chapters of this book will use these techniques to construct
    a deep learning framework. In fact, much of the techniques discussed in this chapter
    will be seen as a walkthrough in which the techniques discussed in this chapter
    will be used to solve practical problems. Therefore, readers can fully regard
    the subsequent contents of this book as exercises for the techniques discussed
    in this chapter. The process of executing is also the process of leading readers
    to become familiar with the knowledge points in this chapter. The author believes
    that readers will have a more mature understanding of metaprogramming after reading
    this book.


    In addition to the techniques discussed in this chapter directly, we can also
    implement specific operations through a number of metaprogramming libraries. For
    example, using Boost::MPL or Boost::Hana libraries to implement arrays and collections.
    The interfaces these libraries provide look very different from the processing
    methods of arrays discussed in this chapter, but the functionality they implement
    is similar. Using the processing methods of arrays described in this book is like
    using basic arrays in C++ at runtime when using metaprogramming libraries such
    as MPL is more like using vector at runtime. This book will not use these metaprogramming
    libraries because the authors believe that it is difficult to use vector well
    enough if the basic arrays are not used well. This book wants to convey to readers
    is basic techniques of metaprogramming. The author believes that it will not be
    difficult for readers to use other advanced class libraries in metaprogramming
    after laying the corresponding foundations.


