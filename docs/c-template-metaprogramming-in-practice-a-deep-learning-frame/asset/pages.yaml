    # 4.5.2 Template Array


    The relationship between Batch and Array is like between the built-in array in
    C++ and linear containers in the STL. For the former, the space allocated is kept
    unchanged and data items are stored continuously, which provides better performance
    for accessing storage space. For the latter, the size can change dynamically and
    the system does not guarantee that data items must be continuously stored, with
    slightly worse performance for accessing storage space.


    # 4.5.2.1 Introduction of the Template Array


    The declaration of template Array is as follows:


    ```

    template <typename TData>

    class Array;

