    Where is the definition of the function? Programmers who are getting to know metafunction
    ask such a question. In fact, lines 1–8 of the code snippet already define a function
    Fun_, and line 10 use Fun_<int> to return unsigned int, so line 10 is equivalent
    to defining unsigned integer variable b and initialized with 3.


