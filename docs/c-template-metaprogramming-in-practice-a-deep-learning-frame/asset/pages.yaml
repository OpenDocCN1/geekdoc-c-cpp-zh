  md: '# Chapter 8


    # Evaluation and Its Optimization


    This chapter discusses the evaluation in MetaNN.

    Evaluation is a fairly important step in deep learning frameworks. From the point
    of view of programming, the essence of a deep learning system is to transform
    the input data and produce the output result. Transformations like this require
    a large amount of computing resources. Whether the framework is able to quickly
    and accurately complete computations (or evaluations) directly determines the
    availability of it—if the entire process of evaluation is relatively slow, the
    entire system will be unable to conform to the actual computing requirements.


    A number of software libraries have been developed to improve the performance
    of numerical computations. Deep learning frameworks can take advantage of the
    appropriate libraries to achieve speed with the supplement of specific hardware.
    However, most software libraries focus on how to improve the performance of a
    certain algorithm, such as optimizing the algorithm to boost the performance of
    multiplying two matrices or providing algorithms to quickly calculate the output
    of a recurrent neural network as LSTM.


    MetaNN can adopt these libraries to improve system performance, which is equivalent
    to elevating computing speed from the level of operations. How to introduce such
    a software for rapid evaluation will not be discussed in this chapter. This chapter
    is concerned with another dimension—how to enhance computation speed from the
    level of the entire network. It is precisely the metaprogramming techniques introduced
    in the previous chapters that provide a prerequisite for optimization of evaluation
    at the network level.


    +   - Chapter 4 introduces a rich-type system, which allows optimization for different
    types in evaluation.


    +   - Chapter 5 introduces expression templates, which postpone the entire network''s
    evaluation process, providing a prerequisite for merging similar computations
    and multi-operation co-optimization.


    +   - Chapter 6 and Chapter 7 construct layers, where the interfaces for forward
    and backward propagation are template member functions, minimizing layers'' impact
    on optimization of computations.'
