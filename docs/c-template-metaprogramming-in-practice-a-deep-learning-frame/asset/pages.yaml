    # 7.3.5 Examination of Structural Validity


    After classifying the clauses of structural descriptions, the next step is to
    examine the validity. Even though, clauses of structural description construct
    a directed acyclic graph in essence and the directionality of arcs in graph is
    guaranteed by clauses of structural descriptions. The topological algorithm itself
    examine whether there are cycles in the graph. In addition to these two aspects,
    specifically to the application of composite layers, there are numerous items
    to consider. Currently, MetaNN has introduced a total of eight examinations, which
    are outlined as follows. Readers can consider whether there is anything else that
    should be detected.


    +   - A composite layer should contain one or more sublayers, that is, ComposeTopology::SubLayers
    cannot be empty.

    - Each sub in the same composite layer have distinct names. Note that different
    sublayers can be of the same type (e.g., all of AddLayer) but their names (i.e.,
    the first parameter for SubLayer) cannot be the same. It is because names will
    serve to describe the connections among sublayers. If there are different sublayers
    with a same name, the connections among layers cannot be accurately described.

    - In an InternalConnect description, the input layer and the output layer cannot
    be the same, or otherwise a cycle will be formed in the graph. It is the simplest
    case of detecting the existence of cycles—that is, whether a single sublayer forms
    a cycle inside itself. For the input of users, there may be multiple sublayers
    forming a cycle, which can be detected by the topology sorting algorithm.

    - The data source for the input must be unique. For instance, there can''t multiple
    InConnect statements with exactly the same InLayerTag and InLayerName. If this
    happens, it means that there are multiple sources of data for particular elements
    in a certain input containing forward propagation. Then the system will be unable
    to select which source as the actual input for the layer InLayerTag.

    - The names of the layer in InternalConnect, InConnect, and OutConnect must appear
    in the SubLayer clauses. Otherwise, the name of the layer cannot be associated
    with the type of layer.

    - Similar to the previous one, name of the layer introduced with the SubLayer
    clauses must also appear in InternalConnect, Inconnect, and OutConnect, or otherwise
    the layer would not be involved in forward and backward propagation, which is
    essentially a "zombie layer."


