    \ computing, each operand in computing can be regarded as a data series that contains\
    \ a set of (ordered) raw data, usually with the same dimension. For instance,\
    \ if we want to execute matrix multiplication, the dimensions of matrices involve\
    \ in multiplication are $M \times N$ and $N \times K$ respectively, and the result\
    \ is an $M \times K$ matrix. Now, we want to speed up by batch computing; each\
    \ $B$ matrices are grouped together and the calculation is executed at all one.\
    \ For each multiplication, the multipliers will actually be two matrix sequences,\
    \ containing $B$ matrices with dimensions as $M \times N$ and $N \times K$. The\
    \ result is a matrix sequence, containing $B$ matrices with dimensions as $MK$.\n\
    \nIf we want to support batch computing, the framework must data structures to\
    \ represent the sequences in batch computing is performed. The simplest way to\
    \ represent data in batch computing is to ascend the dimension. For example, if\
    \ the original data involved in computing is a one-dimensional vector, then we\
    \ use a two-dimensional matrix to represent the list of vectors; if the original\
    \ data involved in computing is a two-dimensional matrix, then we can use a three-dimensional\
    \ tensor to represent the list of matrices. But the author argues this approach\
    \ is too simplistic and rough, which can lead to conceptual confusions—a same\
    \ matrix may be used in the pattern of batch computing to represent the list of\
    \ vectors and a separate matrix in the other pattern, which can introduce procedural\
    \ confusion. To avoid the confusions, two categories of lists are introduced to\
    \ specify the operands required for batch computing in MetaNN.\n\nLists in MetaNN\
    \ actually correspond to two categories: BatchScalar for lists of scalars and\
