    If we cant afford the described costs introduced by metaprogramming, we need to
    consider compromise solutions. A typical way is logic splitting, as formalizing
    what consumes compile time and those we want to keep secret in static or dynamic
    libraries; organizing takes a short time to compile and can be shown to end-users
    into metafunctions and providing them in form of header files, so as to ensure
    to take advantages of metaprogramming. The way of division depends on specific
