    # 10.4.1.3 Skew Correction


    To correct skewness, the angle at which a document image is

    rotated as referenced by the horizontal axis, the orientation of the input doc-

    ument image should be determined. There are several commonly used

    methods for detecting document skewness. Some methods perform line

    detection using the Hough transform [10, 11]. The median of the angles of the

    detected lines relies on the detection of connected components [12, 13], which
    are roughly

    equ to characters, and then finds the average angles connecting the

    centroids. In contrast, some methods straightforwardly detect document\skewness
    using a projection profile analysis [14, 15]. A document page is

    projected at several angles, and the variances in the number of foreground

    pixels per projected line are computed. The projection parallel to the correction
    of the lines will likely have the maximum document variance. After the

    document skewness has been detected, the document image must be rotated

    with the angle in order to correct this skewness.


    # 10.4.2 Segmentation


    In the segmentation task, a binary document image is gradually separated to

    obtain several isolated characters or word images as the results. It involves

    line segmentation and character segmentation.


    # 10.4.2.1 Text Line Segmentation


    Most document analysis and recognitions start with line segmentation. A

    variety of projection profile techniques are used in [1, 16–19]. The goal of

    those methods is to extract estimated median or seam positions of text lines'
