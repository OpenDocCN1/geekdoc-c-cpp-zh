    # 8.2.2 Data Characteristics


    Tweets are mostly extracted using their API, and the extractor defines the ranges/properties
    like geographical region, language and topic of interest. In context with gender
    identification and aggression identification, the most common data characteristics
    to consider are the following:


    +   - The region of data collection: With the help of this information it becomes
    easy to predict/remove unwanted noise in the dataset. For example, understanding
    of slang language, Common traits of users of behavior/sarcasm.

    - Usage of language-specific stop-words: In general, it is observed that 30% of
    user posts contain common words. For instance, if tweets are in English, then
    these words would be the is, a and so on.

    - The modality of words in terms of abbreviation/jargon: Mostly, in informal communication,
    people tend to use abbreviations or jargon instead of writing complete words.
    For example ROFL, LOL and many more.

    - Usage of emojis and their impact on tweets: Apparently, emojis give more insight
    than the text or can add meaning to the tweet. Mainly, the focus is here to check
    the distribution level and how much noise an emoji adds to the dataset.

    - In cases of supervised learning, class/label distribution over the data-set:
    It is preferable to have an equally distributed dataset for machine learning approaches,
    but many datasets suffer from class imbalance.

    - Usage of hashtags: As it is a Twitter and Facebook dataset, it contains several
    hashtags and just words. Before doing any preprocessing to it, one needs to consider
    how meaning these hold in context.


    Table 8.2 shows the data characteristics of the dataset.'
