    # 3.2 Literature Review


    In [10], authors extracted rotation invariant texture features from an extended
    version of a multi-channel Gabor filtering method to identify 15 different textures,
    a technique that has been adopted to identify different scripts, namely Persian,
    Greek, Russian, English, and Malayalam. The authors in [11] proposed a technique
    for word-wise script identification: their work was carried out in two phases,
    considering the tradeoff between accuracy and speed, in to identify Bengali, Devanagari,
    and Roman scripts. In the first phase, a chain-code-histogram was used for feature
    extraction, returning a 64-dimensional feature at high speed but with less accuracy.
    In the second phase, considering those samples which yield low accuracy rates,
    gradient features were extracted from dimension 400. For the classification majority,
    a voting method was exploited. In [12], Telugu, Devanagari, and English scripts
    were separated from a printed document using distinct features from the top and
    bottom profiles of the printed text. The experiment was conducted over 2,400 text
    lines with a recognition accuracy of 99.67%. The authors of [13] used maximized
    mutual information to identify the multi-script documents of'
