  md: "# Document Processing Using Machine Learning\n\n+   - By utilizing the values\
    \ from sustained uniform distribution, the weights are randomly created from input\
    \ to hidden layer, called ‘random projection’.\n\n+   - To solve the output weight,\
    \ the least square error regression is used, i.e. the Moore–Penrose generalized\
    \ algorithm.\n\nELMs are the contemporary flavor of the random projection, accompanied\
    \ by some hypothetical properties which can potentially fit any structure along\
    \ with a least square procedure. The concept of this learning machine lies on\
    \ the factual theory of risk minimization and only one iteration is needed to\
    \ finish the learning process.\n\nInitially, Huang et al. [1] proposed ELMs to\
    \ address the complication caused by gradient descent-based algorithms. But in\
    \ the 1940s, McCulloch and Pitts [2] gave the logical view that unlocked the path\
    \ of artificial neural networks (ANNs).\n\nThe ELM was used to explain a linear\
    \ equation when the weights of output layers are projected. Moore–Penrose’s generalized\
    \ inverse [3] is applied to solve the general system which led to solving the\
    \ linear equation. The ELM has been to solve classification and regression problems\
    \ [4, 5] and has produced promising results in several instances.\n\nIn this chapter\
    \ we talk about the preliminaries, extensions, applications and issues of ELMs.\n\
    \n# 4.2 Preliminaries\n\nAssuming that a SHLFFF with L number of hidden neurons,\
    \ where G($w_i, b_i, x$) is the resultant output of the hidden layer node, and\
    \ with b, bias corresponding to x input vector with the weight $w_i$ ($w_i, w_j,\
    \ \\dots, w_n$) connected to hidden to output layer, then $\beta_i\\beta_j\\beta_{ij}$\
    \ is the output function $f(x)$ given by:\n\n```\n$f(x) = \\sum_{i=1}^{L} \\beta_i\
    \ G(w_i, b_i, x_i) \\quad (4.1)$\n```\n\nG($w_i, b_i, x_i$) will compute for additive\
    \ hidden neurons as:\n\n```\n$G(w_i, b_i, x_i) = g(w_i, x+b_i) \\quad (4.2)$\n\
    ```\n\nHere, the activation function is represented by $g: R \\to R$.\n\nEquations\
    \ 4.1 and 4.2 aid in the generation of the following:\n\n```\n$H\\beta = Y \\\
    quad (4.3)$\n```\n\n```\n$\\beta = H^{-1}Y \\quad (4.4)$\n```"
