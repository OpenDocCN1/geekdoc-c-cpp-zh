    # 7.3.2 Pre-Processing


    Linear sequences of representations such as characters, words and phrases are
    used to form digital text documents. For a given sequence of characters in its
    respective text document, tokenization needs to be carried out before the application
    of the feature extraction and selection schemes. Tokenization is the task of segregating
    the sentences into pieces, called tokens. Without chopping the sentences into
    tokens, further processing is not possible. The splitting of sentences was performed
    on a ''space'' delimiter, with the total number of words retrieved from the dataset
    being 2,806,159. The tokenized data speed up the processing of the system, make
    it more efficient and reduce the burden on system resources. This proves to be
    an advantage in systems relying on better performance. Since not all the words
    extracted from the dataset are relevant or informative to be in the feature set,
    the removal of stopwords is necessary in order to filter the data. In the present
    experiment, punctuations, pronouns, English equivalent words, postpositions, English
    and Bangla numerals, interjections, some adjectives, conjunctions, some adverbs
    and all the articles have been considered stopwords, and the number of tokens
    acquired is 1,310,119.'
