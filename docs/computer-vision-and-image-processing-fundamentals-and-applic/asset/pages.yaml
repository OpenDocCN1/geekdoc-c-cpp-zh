  md: '# viii


    # Preface


    parameter tuning. The authors provide an idea of how document analysis can be
    done using ELM.


    Internet technology has brought about substantial changes to our day-to-day lives.
    Nowadays, we need several digital means to automatically manage, filter, store
    and retrieve information from text documents. Automated text document analysis
    and mining are becoming an essential part of computer applications and various
    classification and clustering approaches are required for carrying out these tasks.
    The classification of documents needs to be performed in the training dataset,
    which is further used to train the model classifier to classify the documents
    into their respective text categories or domains. Thus, text analysis becomes
    one of the major aspects of text data mining. Under this scope, Chapters 5, 6
    and 7 provide various graph-based models for different web text classification
    problems.


    Chapter 8 discusses two essential aspects of an author, namely aggression and
    author profile. The identification of aggression is classified into three classes:
    overtly and non-aggressive. On the other hand, profiling identifies the two properties
    of age and gender. The chapter also explains various machine learning concepts
    incorporated into the deep neural network. It also provides insight into the previous
    work done on author aggression and profiling.


    Document image analysis problems broadly fall under two categories: offline and
    online. In Chapter 9, the authors discuss offline recognition using features from
    generated offline images. Interestingly, this chapter shows an integrated version/connection
    of how offline and online domains can be merged to achieve recognition performance.


    Chapter 10 discusses handwritten character recognition for palm-leaf manuscripts.
    Palm-leaf manuscripts are ancient documents primarily from South and Southeast
    Asia. Over hundreds of years, the manuscripts have become damaged. The chapter
    discusses how to transform the palm-leaf images into machine-encoded texts so
    that the document can be edited, retrieved, accessed and processed. The issue
    of applying handwritten character recognition for the said problem, with associated
    challenges, is covered in detail.


    We hope this book will help researchers in document analysis and machine learning
    as different real-life problems are discussed with experimental outcomes. Additionally,
    undergraduate or postgraduate scholars wish to carry out their research-based
    projects or theses on document analysis problems can get help from this book.


    Sk Md Obaidur


    KC Santosh


    Teresa Gonçalves


    Nibaran Das


    Kaushik Roy'
