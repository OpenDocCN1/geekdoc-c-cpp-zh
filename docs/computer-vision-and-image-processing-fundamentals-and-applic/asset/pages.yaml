    The quality of images is often the first issue encountered in the OHCR process.
    Many palm-leaf manuscript images are taken without standardized equipment, yielding
    differences in image quality. Although digitizing using a professional grade scanner
    is usually preferred, curators opt for digital cameras when it comes to digitizing
    highly valuable and fragile originals. Thus, it is difficult to ensure that the
