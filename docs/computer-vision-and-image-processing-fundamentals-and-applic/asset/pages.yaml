  md: '# 1.1 Introduction


    There has been rapid development in technology which has aided the digitization
    of documents. The number of digital documents has increased significantly over
    time [1, 2]. Information is now easily available on the Internet and can be distributed
    with ease. Such voluminous numbers of documents demand efficient processing. Digitized
    documents can be broadly categorized into two types, namely image documents and
    text documents. In the case of document, it is essential to understand what is
    written. This requires optical character recognition (OCR) [3–5]. Once the characters
    are identified, approaches based on natural language processing (NLP) [6–8] need
    to be used to understand what is written. In the case of text documents, research
    in the fields of OCR and NLP started back in the last century and different systems
    in languages like English are not commercially available [9–11], but there have
    been no significant developments for Indic languages [12]. One reason for this
    is the complex nature of Indic scripts. This is also coupled with the unavailability
    of standard (and free) datasets for research.


    # 1.2 Optical Character Recognition


    Optical character recognition [13, 14] refers to the task of decoding what is
    written in a document. It does not involve understanding the written texts, but
    it does involve converting a scan or a picture of a document, identifying the
    characters and giving the text output of the identified words and characters.
    The document can be either handwritten or printed. In the case of handwritten
    documents, there are different variations which need to be considered prior to
    recognition. While writing, it is often observed that the texts have disparate
    degrees of slant. It is very important to deal with these slants while processing
    the documents. A document with characters having multiple degrees of slant is
    presented in Figure 1.1.


    The second important factor which needs to be tackled is the similarity between
    different characters. For instance, the natural "3" is similar to "З"


    ![](img/c1b3e2dbc63803c5374b5058ce979284_16_0.png)


    FIGURE 1.1

    A document depicting multiple degrees of slant for different characters.'
