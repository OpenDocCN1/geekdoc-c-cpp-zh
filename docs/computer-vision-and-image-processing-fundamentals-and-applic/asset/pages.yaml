    # 6.3.3 Feature Extraction and Selection


    The standard and widely weighted scheme, term-inverse document frequency (TF-IDF),
    is modified into a new approach and named TF-IDF-ICF, adding an inverse class
    frequency (ICF) into it to develop the feature vector from the dataset [26]. An
    inverse document frequency (IDF) is basically useful for measuring the difference
    of a term among relevant and non-relevant text documents. The experiments performed
    show that there is more likelihood of a token occurring in text documents of domain
    x than in domains that does not belong to x where the term is a target term of
    t. Depending on this observation, ICF is proposed to measure the discerning power
    of a term to a domain.


    The TF counts the presence of a token t in a specific text d. Here, log normalization
    is considered to be the normalized term frequency for each term t.


    ```

    TF = log \frac{O_{t,d}}{\sum_{td}} (6.1)

    ```


    The IDF generally predicts the relevance of a term t in the total dataset. The
    document frequency (IDF) counts the presence of a term t in a number of texts
    in the dataset using the equation below which N represents the dataset.


    ```

    IDF = log \frac{N}{CF(t)} (6.2)

    ```


    The class frequency (CF) counts the presence of a token t in the total statistics
    of the domains. ICF is estimated based on the following equation where C is the
    overall categories being considered in the experiment.


    ```

    ICF = log \frac{N}{CF(t)} (6.3)

    ```


    The proposed TF-IDF-ICF is a novel scheme that considers the presence of a token
    t in a domain c with TF-IDF in consideration, while measuring the weight for t
    using Equation 6.4. In every case, normalized values for the terms were considered
    to get a more specific and relevant feature vector.'
