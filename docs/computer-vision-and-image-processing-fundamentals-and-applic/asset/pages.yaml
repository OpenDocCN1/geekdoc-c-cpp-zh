  md: '# A Study of Proximity of Domains for Text Categorization


    # 7.5 Conclusion


    This chapter presents an approach that uses the NBM classification algorithm based
    on a feature extraction scheme (unique bag of words and proximity among domains)
    to classify Bangla text documents into their respective text categories. The results
    were also compared with other commonly used classifiers and it has been observed
    from the experiments that the NBM performs better compared to other algorithms
    for Bangla text classification. In future, this experiment can be expanded to
    include a larger number of domain-wide Bangla text documents, as well as more
    domains or text categories. Also, new hybrid approaches can be introduced to classify
    text documents into their predetermined text categories. We also plan to experiment
    with other machine learning techniques like those based on deep learning and active
    learning [35] approaches to obtain better results. In future, this study can be
    used on the datasets of other languages as well.


