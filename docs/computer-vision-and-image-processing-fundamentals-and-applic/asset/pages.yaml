    writing pads. These features are evaluated by a quadratic classifier to recognize
    handwritten islamic Bangla characters. The authors in [47] have shown the effectiveness
    of direction code and point-float histogram features for the recognition of four
    popular Indic scripts. The authors also used some regular classifiers like the
    multi-layer perceptron (MLP), nearest neighbor (NN) and hidden Markov model (HMM)
    for classification. A different scheme is highlighted in [48], where the constituent
    are first extracted at the character level. The previously mentioned sequential
    and dynamic features are extracted from strokes for their recognition. A recognized
    stroke sequence is then matched with an already built rule base for the construction
    of characters.


    Parau in [49] highlighted a stroke-based character recognition mechanism where
    one HMM is built for each stroke class. The authors manually grouped the strokes
    of all characters into 54 classes depending on the similarity of strokes at the
    grapheme level. Characters are formed from recognized stroke sequences with the
    help of a previously built look-up table. Direction code-based features were used
    by authors to recognize handwritten Bangla basics in [50]. Another stroke-based
    character recognition approach was mentioned by Bandopadhyay et al. in [51], where
    they generated shape-based features from constituent strokes collected from all
    the character samples. The recognition of strokes was performed using the dynamic
    warping (DTW) technique [52]. The author in [53] also experimented with a stroke-based
    character recognition where he generated features by dividing the scheme into
    nine zones and inclination, the direction of the writing, curvature, standard
    deviation of x and y coordinates and curvature of the strokes. An SVM classifier
    [54] was used for stroke classification. The effectiveness of using distance-based
    features, global features, local features, hausdorff distance-based features,
    area mass distribution and chord length features for online handwritten Bangla
    characters was discussed in Sen et al. in [55–58].


    These research works made efforts towards the enhancement of recognition accuracy
    of online handwritten Bangla characters by introducing new features and combining
    different feature vectors [59]. In this chapter, an effort has been made to use
    the information of offline images with features generated in online mode for the
    enhancement of character recognition accuracy. The purpose of this work is two-fold:
    First, the generation of offline character images from online information that
    may be used for working offline, and second, the enhancement of character recognition
    accuracy by incorporating the offline information of its counterparts.


    The organization of the paper is as follows. Section 9.2 introduces a brief review
    of the well-known feature extraction techniques for the recognition of online
    handwritten Bangla characters. Section 9.3 deals with database preparation and
    the pre-processing mechanism. Section 9.4 describes the feature generation procedure
    used in both online and offline modes to recognize the online handwritten Bangla
    characters. The classification'
