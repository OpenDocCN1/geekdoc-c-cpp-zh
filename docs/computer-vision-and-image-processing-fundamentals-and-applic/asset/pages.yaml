    # 3.3 Data Collection and Preprocessing


    As data collection is the preliminary work in image processing and text recognition,
    research on validating methods is important. collecting real-world artistic multi-character
    scripts to study is not an easy task. From different areas of Kolkata, India,
    we collected texts not written in different scripts, but that also varied widely
    in size, color, texture, background, etc. These scripts alone, however, were not
    sufficient for our work. So, we made synthetic artistic multi-character scripts/images
    for experimentation. Until now we have managed to collect 49 real-world images
    from various places like company hoardings, t-shirt graffiti, a cinema hall poster,
    placards, festoons, wall writings, newspapers, etc. We have used mobile phones
    with resolutions varying from 8 MP to 20 MP, as well as a DSLR camera (Nikon D3300)
    with 24.2 MP resolution and an 18-55 mm lens. Around 2628 characters have been
    extracted from these real-world images, and additionally from 833 synthetic images
    with 178 Devanagari, 1599 Bangla, and 851 Roman scripts.


