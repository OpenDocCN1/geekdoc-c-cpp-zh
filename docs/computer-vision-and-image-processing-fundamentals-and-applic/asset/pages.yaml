  md: '# 1.3.5 Parsing


    Parsing is the analysis of a sentence with respect to the syntactic structure
    of the language. It is very helpful in determining the part of speech of words
    as well as in different applications like word sense disambiguation.


    # 1.3.6 Applications


    Some of the disparate applications of natural language processing are detailed
    hereafter.


    # 1.3.6.1 Text Summarization


    Text summarization [43, 44] is the technique of extracting the most relevant information
    from a given text. The term “relevant text” is problem-specific. A text may contain
    information related to various topics. Summarization generally involves distillation
    of a particular type of information from a text. It is important to discard the
    irrelevant information.


    # 1.3.6.2 Question Answering


    Question answering [45, 46] involves automated responses to different queries
    raised by a user. It may be used in healthcare-related applications as well as
    automated tutoring systems. It is also required in automated customer handling
    systems. Such a system involves analysis of the texts in order to understand what
    a user means to say and then generation of the appropriate reply.


    # 1.3.6.3 Text Categorization


    Text categorization [47, 48] is the task of grouping texts based on certain criteria.
    The texts may be grouped based on domains [36] like sports, medical, etc. This
    is very important as the number of documents on the Internet has increased tremendously.
    It is very important to categorize and order such information for its efficient
    retrieval, thus reducing the workload on the system.


    # 1.3.6.4 Sentiment Analysis


    Sentiment analysis [49, 50] is the process of analyzing different types of information
    within a text, like emotional- and opinion-related information. It can help by
    automatically suggesting the importance of certain texts at times may be overlooked
    by human error.


    # 1.3.6.5 Word Sense Disambiguation


    Word sense disambiguation [51, 52] is the process of determining the actual meaning
    of a word in a sentence when a word has multiple meanings. For'
  merge: -1
  pgno: 24
- img_proc: true
  md: '# Artificial Intelligence for Document Image Analysis


    instance, the word “bank” may mean “river bank” or “a place where we deposit money”.
    It is very important to understand the meaning of different words prior to understanding
    the meaning of a text for different applications like summarization and evaluation.
    For instance, in the sentence, “I will go to the bank for a loan,”bank” refers
    to the financial place and not to a river bank. The meaning of a word is very
    context-dependent, and analysis of neighboring text can help derive its meaning.


    # 1.4 Conclusion


    Artificial intelligence has developed significantly over the years and has provided
    different simplified solutions. Document image processing has also advanced with
    the passage of time. Document processing involves both recognition and understanding.
    Optimal character recognition is required for recognition of characters, words
    and sentences from document images which is followed by natural language processing
    for the purpose of understanding. Research in these fields for non-Indic languages
    has progressed significantly, while Indic languages has not. In this chapter,
    we have presented some avenues for OCR and NLP which are critical in developing
    a full-fledged system which can truly understand a document in an Indic language.


