    # 8.2.3 Data Preprocessing


    Data preprocessing is the most important phase of any system modeling and, generally,
    data characteristics are considered for preprocessing. Here, for the previously
    mentioned data characteristics, tweet preprocessing is discussed.


    +   - Stem words: As per language morphology. A stem word is a word without aff.
    Removing a word from, or making it into, its stem form does not affect its semantic
    meaning. In addition, it reduces the number of distinct words in the dataset.
    This might be very helpful when a dictionary is created using a dataset. The rule
    is as follows:

    - Rule: regexp =~ ''^(?i)(ing|ed)(ment)(ion)?$''

    - Stop-words: The removal of stop-words helps in many cases where the semantic
    meaning of the sentence is not captured. Again, it helps in reducing the sentence
    length and extending distributed language noise by only keeping meaningful words
    in the sentence. On the other side, it is not advisable to remove stop-words when
    the users want to capture the (semantic) meaning of the sentence.

    - Symbolic emojis: In most textual media communication, emojis are used to represent
    the emotion of the author. Normally, all text platforms have emojis (an image),
    but most people use the symbolic emoji. To do this, the following expressions
    are used:

    - "\[sD]?-D-x[X-D]?" for Laugh - :-D ; D ; :-D ; xD, XD, X-D"

    - "\[sD]?\(|\:\(- \?[:^\S:]*\)" for Smile - - ;), ) ; (:), ( ; (; :-

    - "<3\^*" for Love - <3, *"

    - "\[sD]?\(|\:\(- \?\)" for Wink - - ;), ) ; :-D ; D ; (; (: :"

    - "\[sD]?\(|\:\(- \?[:^\S:]*\)" for Sad - -:( ; (:), (:), (: :"

    - "\[sD]?\(|\:\(- \"\0*" for Cry - -;:( ;), (: :"

    - Abbreviation/jargon: The abbreviation/jargon depends upon the region of data
    collection, and accordingly, regular expressions were used to replace such words
    with their original form.'
