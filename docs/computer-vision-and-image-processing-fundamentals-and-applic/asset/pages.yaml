    text documents of 12 texts. Dhar et al. [24] worked with text representation schemes
    with a multilayer perceptron model on 4000 articles and achieved 98.03%. In another
    work [25], the author explored the optimization problem on 9000 articles by modifying
    the Cuckoo search algorithm with weighting schemes and obtained an accuracy of
    98%. The brief survey presented here clearly shows that we still need to go a
    long way to develop an automatic text categorization system for Bangla language
    users, in order to serve their purposes efficiently.


