    # ##2.4 Conclusion


    This chapter presents a study of character recognition from handwritten isolated
    characters in different standard databases. Our own database of 89,815 characters
    (letters + numerals + vowel modifiers) is considered. The standard database of
    ISI handwritten characters and CMATERdb 3.1.2 are also considered for a comparative
    study of our methods. The comparative study shows that our method has outperformed
    every other method in every aspect. Further study also reveals that our proposed
    feature is robust and stable across all the standard databases. Though the recognition
    performance is quite high, there are still classification errors in the results,
    due to the handwritten shape of some Bangla letters, numerals and vowel modifiers.


    In future, features and feature combinations can be studied to find high recognition
    performances across different databases. Similar studies will be performed on
    handwritten Bangla text databases to get better performances of recognition not
    only in terms of accuracy but also in terms of computational complexity. Additionally,
    extreme learning methods similar to the work of [22] and deep learning-based methods
    similar to [23] may be employed in future on text databases attempts similar to
    this. Graph mining-based specific content selection methods similar to [24] may
    be implemented in future for fast learning. Along with this, we will try to publish
    a database similar to the script identification database of [25], and make it
    freely available to the research community for the study of character recognition.


