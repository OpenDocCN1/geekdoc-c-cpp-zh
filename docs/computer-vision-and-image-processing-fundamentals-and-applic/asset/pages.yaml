    the design of the form, all the vowels and alphabets that are used in writing
    Bangla are considered along with vowel modifiers. A total of 11 vowels, 40 consonants,
    10 vowel modifiers and 10 numerals are considered in the design of the isolated
    character data collection form.


    During data collection, individuals are asked to write the sample isolated characters
    and sample printed text within the provided area on the form at their natural
    speed. The writers are also given each data collection form (blank) on different
    days, so that intra-writer variations along with inter-writer variations can be
    captured. Individuals of different gender, culture, age groups and educational
    qualifications are considered during data collection. Individuals from 8 to 70
    years old are considered during data collection, including schoolchildren, retired
    persons, graduates, postgraduate students and people with different professions.
    The natural variations are incorporated into the database to create standard isolated
    character and text databases [62,63] to be helpful in assessing whether a character
    text recognition algorithm is robust or not. For a character-level database, characters
    are written within the boxes as shown in Figure 9.12. In the next step, the coordinates
    of the boundary of every box are measured and then the character-level information
    (x,y coordinates, along with pen status) from all the boxes are stored.


    This section describes the detailed statistics of two different types of databases
    developed here. One hundred volunteers contributed during the design of the isolated
    character database, and from each individual three sets of characters of the Bangla
    alphabet were collected. Though initially 135 volunteers agreed to contribute
    to the development of this character database, only 100 volunteers completed the
    required three sets. The database contains approximately 12,000 alphabets, 3,300
    vowels, 3,000 vowel modifiers and 3,000 numerals. Each collected dataset contains
    pixel points with x and y coordinates, along with .dat format with a particular
    naming convention: < 4 digit serial number (Writer_id) ><2 digit serial number
    (Set_id>. For example, the first isolated digitized form would be named ''0000_01'',
    where ''0000'' stands for the ID of the first writer, and ''01'' for the first
    set of writings by that writer; these two fields are separated by the ".


