    few works have been carried out on Persian and Urdu as well. For instance, Lin
    et al. [1] proposed a new similarity measure named similarity for text processing
    (SMTP) by considering three cases: (i) the feature appearing in both text documents,
    (ii) the feature appearing in only one text document and (iii) the feature appearing
    in none of the text documents. They carried out their experiment on WebKB, Reuters-8
    and RCV1 on TF-IDF, and obtained accuracies of 0.8467, 0.9488 and 0.7130 for the
    value of K = 11, 11 and 8, respectively. In another experiment, Wandabwa et al.
    [2] extracted the most relevant features by assigning them weights in respect
    to their contents. They then estimated the distance between the features with
    high ranks in the dataset for the classification task. They experimented on a
    dataset comprised of 15,000 documents of random Wikipedia personalities having
    elements like URI, name and text. An experiment by Wu et al. [3] presented a method
    of balancing between over-weighting and under-weighting the terms for classification
    using 20 Newspapers, RT-2K, IMDB and Reuters-2157 datasets. Koswari et al. [4]
    presented a technique called random multilayer learning (RDML) that solves the
    issue of perceiving the ideal deep learning accuracy through ensembles of deep
    learning networks. They experimented using the IMDB dataset and obtained a maximum
    accuracy of 70.97% using 15 RLDS model, and also observed RDML performs better
    in comparison to the traditional approaches. Feng et al. [5] presented a new scheme
    for weighting the terms based on a probabilistic method using a matching score,
    and observed the effectiveness of the methods using K-NN and SVM on small and
    large texts, respectively. In the case of Persian, Parvin et al. [6] classified
    Persian text documents from five text categories by using normalized mutual information
    along with the thesaurus and obtained a maximum accuracy of 81.45% for the value
    K =1. Ali and Ijaz [7] provided a comparative study among the statistical methods
    for classifying Urdu text documents using NB and SVM. Mainly they have processed
    the documents using language-specific techniques for developing a standard and
    less dimensional feature vector. From the experiments, it can be seen that the
    performance increases when the value of n increases to 3, but when the value reaches
    4.


    # 6.2.2 Sino–Tibetan


    Besides the cases of English, Persian and Urdu, various works carried out for
    Chinese can be referred to. To a name, Wei et al. [8] conducted experiments in
    a Chinese corpus consisting of 14,150 Chinese text documents from 12 classes based
    on three parameters: (i) comparison of the performance among absolute and relative
    text frequency and N-gram frequency; (ii) comparison between sparseness and feature
    correlation; (iii) performance comparison among 0/1 logical value, N-gram numeric
    value and TF-IDF value. Wenliang et al. [9] used the NEU TC dataset of 14,459
    texts from 37 domains and applied document frequency and chi square statistics
    to develop the class distribution of tokens. They also'
