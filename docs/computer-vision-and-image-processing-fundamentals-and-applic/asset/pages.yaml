    rate has been taken as 0.3 and momentum as 0.2, and we have found nine numbers
    of hidden layers gives the best result.


    In Table 3.2, we tabulate the confusion matrix of the highest performing classifier
    on our dataset.


    In Table 3.2, it is observed that some characters are not correctly recognized
    as the corresponding class: 1,554 characters are correctly classified as Bangla,
    but 45 and 21 characters are classified as Devanagari and Roman, respectively.
    This misclassification occurs due to similarity in character geometry and binarization
    issues, i.e. some character shape vanish after binarization.


    # 3.6 Conclusion


    Artistic multi-character script recognition is a very new problem of script identification
    and document processing [32–35] work. Aspects like size, color, texture, complex
    background, and skewness make this problem challenging to researchers. From our
    technique, 94.95% accuracy has been observed, but this rate can be increased by
    using the preprocessing phase more accurately and with other feature extraction
    algorithms along with the above-described methods. The database creation is another
    issue and collecting more natural images is our next plan.'
