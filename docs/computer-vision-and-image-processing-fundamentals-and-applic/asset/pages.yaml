    # ### 3.1 Introduction


    Script identification [1–8], a research topic in image processing and pattern
    recognition, is a very important phase in the automatic processing of documents
    in an international scenario. This is because script identification is a requirement
    for OCR without which an OCR system would not be able to automatically read and
    convert an image into scripts that are comfortable for the reader. It is not possible
    to devise a universal or generalized OCR for all kinds of scripts, especially
    in countries like India, where Indus script consist of very complex graphic symbols.
    So, a good technique for script identification can lead us to choose the correct
    OCR package. In the last several years, many works have been proposed for automatic
    script identification, none have been able to fully address the factors involved
    like multi-script inline level, word level, character level, complex backgrounds,
    broken lines, noisy data, directional complexity, etc. One feature which has so
    far been unattainable is artistic multi-character script identification, where
    different scripted characters vary significantly in color, texture, size, and
    background. Figure 3.1 depicts the flowchart of our proposed work, which tackles
    this research topic.'
