- img_proc: true
  md: '# 10.6 Concluding Remarks and Outlook


    In this chapter, we have discussed the issues associated with performing OHCR
    on palm-leaf manuscripts. Those problems should be emphasized during the development
    of OHCR systems for palm-leaf manuscripts. We then outlined the current-state-of-the-art
    preprocessing, linear segmentation, character segmentation and character recognition
    steps which were successfully applied to the task. A working example of an ancient
    Lanna Dharma character recognition system was presented. Despite the availability
    of the various methods proposed to date, there is still room to improve OHCR systems
    for palm-leaf manuscripts. Compared to the human recognition ability and the requirement
    of applications, the current recognition accuracy by OHCR systems for palm-leaf
    manuscripts is still insufficient. Furthermore, most recent methods in OHCR were
    proposed with a deep learning approach, but this cannot be adopted in the works
    for palm-leaf manuscripts because of the limitation of the training dataset. Constructing
    large training datasets is needed to develop efficient OHCR methods for palm-leaf
    manuscripts that use the deep learning approach.


