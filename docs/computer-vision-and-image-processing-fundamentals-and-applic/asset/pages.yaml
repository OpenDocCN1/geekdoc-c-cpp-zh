  md: '# 3.4 Feature Extraction


    Feature extraction is a very important phase in image recognition. In this work,
    we have considered two types of features, namely topology- or geometry-based and
    texture features.


    # 3.4.1 Topology-Based Features


    The topology-based [23] feature extracts the basic geometrical properties of a
    character-image. The following features are considered in the topology of characters.


    +   a. Area: Area measures the number of pixels with an intensity value I in the
    whole image. The area can be represented as


    $Area = \sum_{m,neR} 1 \quad (3.1)$


    where m and n denote the x and y ranges of region R.


    +   b. Major Axis Length: In an ellipse, there are two focus points (foci), a
    and b; the sum of the distance between these points represents the length (Figure
    3.5). Major axis length can be expressed as n+p, where n and p are the distances
    from each focus to any random point c on the ellipse.


    +   c. Minor Axis Length: Looking at Figure 3.5, the minor axis length can be
    expressed as $\sqrt{(n+p)^2-m^2}$.


    +   d. Eccentricity: The meaning of eccentricity is ''off center''. That means
    that, as the eccentricity increases, the foci are proportionally rece-d from the
    center or off the center. It can be expressed as


    $Eccentricity = \frac{g}{h} \quad (3.2)$


    Where g is the distance from the center c to a focus f2, and h is the distance
    from that focus f2 to a vertex a, which is a scalar value in the range 0 to 1.
    When the ratio is 0 Figure 3.6 will be a circle, and when it is 1 it will be a
    line.


    ![](img/c1b3e2dbc63803c5374b5058ce979284_48_0.png)


    FIGURE 3.5

    Ellipse with foci.'
