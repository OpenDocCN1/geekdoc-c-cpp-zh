    \ 64\n\n# 5.1 Introduction\n\nA significant mass of accessible digital data is\
    \ found to be in unstructured or semi-structured form. Thus, for a user to understand\
    \ the importance and applicability of the information in this form according their\
    \ needs, and to access that information efficiently, there is a pressing need\
    \ for automated information extraction and text document classification/categorization\
    \ systems. However, the task is not very simple, as text data is formed in natural\
    \ language. Communication in the form of writing and speaking in a language desires\
    \ understanding of syntactic and semantic relationships along with the enriching\
    \ perceptions within that language. In spite of these complexities, most studies\
    \ in this domain of text mining cast light on one particular"
  merge: -1
