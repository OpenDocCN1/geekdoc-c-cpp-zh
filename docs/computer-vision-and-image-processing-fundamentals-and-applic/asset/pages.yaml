- img_proc: true
  md: '# Document Processing Using Machine Learning


    facet of a language, that is, the frequency of a term. Representation of text
    documents using the bag-of-words approach is believed to be self-sufficient without
    expressing the syntactic or semantic relationships between terms or series of
    terms. These become important while categorizing short text documents where capturing
    the syntactic semantic relationships among terms is necessary for identification,
    because of the use of synonyms or interconnected terms in the tests similar casing
    categories.


    In the present experiment, a graph-based text classification approach has been
    designed, involving syntactic and semantic relationships along with term frequencies,
    to enhance the performance of the text categorization system. The experiment was
    carried out on a dataset of 9000 Bangla text documents covering eight different
    text categories acquired from online news corpora, various magazines and webpages.
    Sets of text documents are treated as graph sets to which an algorithm of a weighted
    graph is executed to extract subgraphs which can be further used to generate the
    feature vectors from the considered dataset for classification. A weighted graph
    algorithm is taken into account for extracting the most applicable subgraphs,
    which successfully increases the rate of classification computational efficiency.
    Contrary to the traditional vector space model and bag-of-words approaches, graph-based
    models perform more efficiently by considering the structural information of the
    text documents. Graph-based models are becoming an alternative way to represent
    text by the ability to encapsulate important facts regarding texts, such as ordering
    a term, co-occurrence of terms and relationships among different terms. Furthermore,
    compared to the existing methods applied to Bangla text categorization by various
    researchers, the graph-based learning method shows the advantage of involving
    related knowledge.


    The paper is organized as follows. In Section 5.2, the basis of text categorization
    and various machine learning algorithms is provided by surveying literature in
    this domain. Section 5.3 provides details about the data collection, approaches
    used for pre-processing, graph generations for the extraction of features and
    the classification algorithms. Section 5.4 explores the results and other perceptions
    obtained by the graph-based methods. Besides analyzing the outcomes and potential
    developments, Section 5.4 also provides a comparison among several commonly used
    classification algorithms as well as a comparison with existing methods. In Section
    5.5, the paper is concluded showing some future directions.


    # 5.2 Related Works


    # 5.2.1 English


    From the literature survey it can be observed that text categorization in English
    has gained great attention by researchers. A few works briefly'
