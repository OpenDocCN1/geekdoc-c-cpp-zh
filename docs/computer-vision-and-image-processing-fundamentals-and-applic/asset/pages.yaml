    Persian text documents from five categories by using normalized mutual information
    along with a thesaurus and achieved maximum accuracy of 81.45% for the value of
    K=1.


    # 5.2.3 Arabic and Urdu


    Besides the cases of English, Chinese, Japanese and Persian, several techniques
    of text categorization have also been explored for the Arabic language. To mention
    a few, Al-Tahrawi [11] classified 1500 news articles from the Jazeera Arabic News
    corpus that were uniformly scattered into five domains using the chi square method.
    Al-Radaieh and Al-Khateeb [12] proposed a classification algorithm based on associative
    rules for classifying Arabic medical documents; Haralamb et al. [13] implemented
    system mining and routing procedures using the TF-IDF and dependency grammar features
    on the observed dataset from the Kalimat corpus; Al Ij [14] proposed a comparative
    study of the statistical methods for classifying Urdu text documents using NB
    and SVM. Mainly they pre-processed the documents using language-specific techniques
    for developing a standard and less dimensional feature vector. From the experiments,
    it can see that the performance increases when the value of n increases up to
    3, but decreases when the reaches 4.


