  md: '# Document Processing Using Machine Learning


    # 1.2.3.4 CAPTCHA


    Nowadays, CAPTCHA is a very common term. Many human activities like transactions,
    admissions and registrations are carried out on the Internet and need a password
    to prevent misuse by hackers [29]. With CAPTCHA, an image consisting of a series
    of letters and numbers is generated that is obscured by image distortion techniques,
    size and font variation, distracting backgrounds, random segments, highlights
    and noise in the image. OCR is useful here in reducing the noise and segmenting
    the image to make it traceable [26].


    # 1.2.3.5 Automatic Number Recognition


    Automatic plate number recognition systems use OCR to identify vehicle registration
    plates.


    # 1.2.3.6 Handwriting Recognition


    # 1.3 Natural Language Processing


    Natural language processing (NLP) [33] involves the understanding of what is written
    in a text. Once the characters are identified in a text, NLP-based approaches
    come into play to actually understand the meaning of what is written. NLP has
    several applications including text summarization [34], question answering [35],
    text categorization [36, 37], sentiment analysis [38] and word sense disambiguation
    [39]. Research in different non-Indic languages has progressed significantly [40,
    41], but for Indic languages it has not. One reason for this is the unavailability
    of datasets. The Indic languages are also very complex both from grammatical and
    linguistic points of view [42]. Handling Indic texts is also a problem as extended
    font sets in UTF-8 are required, but not always supported by different platforms.


    NLP has several important stages which are detailed in the following subsections.


    # 1.3.1 Tokenization


    Tokenization is the task of segmenting a string into corresponding words. It is
    one of the first steps in different NLP-based applications and can be done at
    the sentence, word or character level. The different schemes are enumerated in
    Table 1.2 for the sentence, “Today is Friday. Tomorrow is Saturday”. The tokenization
    is performed by discarding spaces. The same can be done by involving spaces as
    well.'
