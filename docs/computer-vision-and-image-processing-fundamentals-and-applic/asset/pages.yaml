    When we merely observed the prediction scores of the classifier MLP for both the
    vectors, it was observed that for some cases the prediction score of a correct
    choice was higher for the offline feature vector. We have observed that the prediction
    score of a correct choice was not on top for the features. In order to increase
    the overall character recognition performance, a late fusion technique was tried
    [30] on the top five prediction choices by MLP; i.e. after classification of the
    characters by both the feature vectors (online and offline mode) using MLP. In
    this scheme, the MLP classifier was trained for each modality ($m$), ''online
    mode'' and ''offline mode''. Each modality was assigned an expert trust score
    $e_{sm}$ that is specific to each activity $s$ (prediction choice). This score
    is defined as a normalized performance computed by the performance measure $P_{sm}$
    (observed probability/percentage from classifier) obtained by the modality $m$
    for the activity $s$ as defined in Equation 9.6.


    ```

    $e_{sm} = \frac{P_{sm}}{\sum_m P_{sm}} \quad (9.6)$

    ```


    The final decision is computed as follows: for each observation, a label is allocated
    to the activity with the best trusted score of both modalities. For each observation
    $O_p$ we applied the argmax fusion operator as defined in Eq. 9.7.


    ```

    $s_j = \text{argmax}(e_n^{\text{online based}}, e_n^{\text{offline based}}) \quad
    (9.7)$

    ```


    The application of the late fusion technique with a max fusion operator gives
    the character prediction choice with the highest trusted score between both modalities.
    Hence, the resultant choice may be selected from either'
