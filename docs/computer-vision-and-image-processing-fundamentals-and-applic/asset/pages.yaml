    of these issues when trying to perform line segmentation as well as character
    segmentation on palm-leaf manuscript folios.


    Lastly, the huge number of character classes, variations in handwriting styles,
    unconstrained writing and existence of visually similar characters are considered
    to be challenging issues in character recognition tasks. Moreover, as alphabets
    appearing on palm-leaf manuscripts are ancient characters which are not in use
    in modern days, only a handful of labeled examples are provided for training a
    recognition model. In OHCR from palm-leaf manuscripts, the lack of training examples
    becomes a major challenge in constructing an effective recognition model.


