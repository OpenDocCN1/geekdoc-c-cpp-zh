    # 9.5 Experimental Results and DHD procedure


    The feature extracted from both online and offline modes of the character images
    is evaluated using four well-known classifiers, multi-layered perceptron (MLP),
    support vector machine (SVM), BayesNet and simple logic, where the character sample
    has been used for classification into 16 zones (at quad-tree depth two). Table
    9.1 records the classification accuracy produced by the classifiers mentioned
    for both online and offline modes of the character images.


    Table 9.1 demonstrates that the strength of the feature vector produced using
    online information is higher than the feature set generated from offline character
    images for all the classifiers.


