    # 5.3.2 Pre-Processing


    Linear sequences of representations such as characters, words and phrases are
    involved in the formation of digital text documents. For a given sequence of characters
    in a respective text document, tokenization needs to be carried out before the
    implementation of the feature extraction and selection approaches. Tokenization
    is the task of segregating the sentences into pieces, called tokens. Without chopping
    the sentences clearly into the tokens, further processing is not possible. Here,
    the splitting of sentences was performed on a ''space'' delimiter and the total
    number of words retrieved from the dataset was 2,806,159. The tokenized data enhances
    the processing of the system, makes it more efficient and reduces the burden on
    system resources. This proves to be an advantage in systems relying on better
    performances. Since not all the words extracted from the dataset are relevant
    or informative enough to be in the feature set, the removal of stopwords from
    this set is necessary to filter the data. In the present experiment, punctuations,
    pronouns, English equivalent words, postpositions, English and Bangla numerals,
    interjections, some adjectives, conjunctions, some adverbs and all the articles
    have been considered'
