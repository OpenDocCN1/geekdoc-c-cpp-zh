    # 10.2 Palm-Leaf Manuscripts


    Palm-leaf manuscripts are ancient documents made out of dried palm leaves. Palm
    leaves were primarily used as writing materials in South Asia and Southeast Asia
    in ancient times. Over hundreds of years, the manuscripts have become damaged.
    In an attempt to preserve these potentially valuable documents, several organizations
    have started surveying local communities everywhere. A lot of invaluable manuscripts
    have been recovered, especially in Sri Lanka, India, Laos, Burma, Cambodia and
    Thailand. Figure 10.1 shows examples of palm-leaf manuscripts, found in the northern
    part of Thailand, describing traditional traditional medicine which is important
    for further investigation. These manuscripts were preserved and archived using
    microfilming, scanning and photographing techniques. Normally, several palm leaves
    were put into a single image called a folio. Storing palm-leaf manuscripts in
    folio form reduces digitization time and storage space.


    # 10.3 Challenges in OHCR for Palm-Leaf Manuscripts


    Storing palm-leaf manuscripts in the form of imagery somewhat limits interaction
    with the documents. Instead, it is more desirable to transform'
