    # 3.5 Experiments


    # 3.51 Estimation Procedure


    To estimate the performance of our technique, the correct recognition rate (CRR)
    can be measured:


    $CRR = \frac{(Number\ of\ images\ correctly\ recognised) * 100%\}{(Total\ number\
    images)}$$ (3.13)


    Along with CRR, statistical and root mean square error (RMSE) metrics also play
    a vital role in recognition, defined as follows:


    $Kappa = \frac{(observed\ accuracy - expected\ accuracy)}{\(1 - expected\ accuracy)}$$
    (3.14)


    $RMSE = \frac{\sum_{m=1}^{S}\sum_{n=1}^{T}[f(m,n)-g(m,n)]^2}{ST}$$$ (3.15)


    Here, we used five-fold cross-validation to estimate the performance of our technique.
    In the five-fold process, the whole dataset has bifurcated into five equally sized
    parts, one of which has been considered a testing part, and the remainder as a
    training set; the average of all the results produces the final result.


    # 3.5.2 Results and Analysis


    We tested our method using different classifiers like SVM [28], RBF [29], random
    forest [30], and MLP [31], and in Table 3.1 the different parameter values of
    their corresponding classifiers are depicted.'
