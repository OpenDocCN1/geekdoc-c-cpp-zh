    # 6.3.4.4 Minkowski Distance


    The Minkowski distance can be recognized as a generalization of both the Euclidean
    distance and the Manhattan distance computed using the following-equation where
    m is a positive integer value considered to be 1 or 2.


    ```

    $$Dis(i, j) = \sum_{l=1}^{n} |i_l - j_l|^{1/m}$ $\quad (6.8)$

    ```


    # 6.3.4.5 Chebyshev Distance


    The Chebyshev distance can be defined on the feature vectors to measure the greatest
    of the differences between two vector spaces along the standard coordinates. It
    is measured using the equation below.


    ```

    $$Dis(i, j) = \max|i_l - j_l|$ $\quad (6.9)$

    ```


    # 6.3.4.6 Canberra Distance


    The Canberra distance explores the sum of a series of a fraction difference between
    the coordinates of a pair of variables. Each variable has a value between 0 and
    1 which is very susceptible to a small change. The Canberra distance for the given
    vectors $i$ and $j$ is represented using Equation 6.10. It is a numerical measure
    of the distance between pairs of terms considered in a vector space.


    ```

    $$Dis(i, j) = \sum_{l=1}^{n} \frac{|i_l - j_l|}{|i_l| + |j_l|}$ $\quad (6.10)$

    ```


