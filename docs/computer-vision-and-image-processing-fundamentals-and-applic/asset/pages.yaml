    based on the peaks or valleys of the horizontal projection profile of the image.
    Another text segmentation approach tries to find optimal paths through text line
    [20–23]. These line segmentation methods operate on a binary document image, and
    so an initial binarization method is required. By contrast, some segmentation
    methods that do not rely on the effectiveness of the binarization process have
    been proposed. A method proposed in [24] created the medial axis of the text lines
    by analyzing the horizontal projection profiles. Two adjacent lines are separated
    by the seam-carving algorithm. An adaptive path-finding method has been proposed
    in [25]. A competitive algorithm is presented to find the medial axis of the text.
    To deal with a component spreading over multiple lines, two adjacent lines are
    separated by using a modified A* path-planning technique [26]. A comparative study
    [9] showed that the adaptive path-finding method achieved better results than
    the seam-carving method on three palm-leaf manuscript datasets.


    # 10.4.2. Character Segmentation


    After line segmentation, characters in each text line are be segmented into isolated
    character images which will be recognized in the recognition task. Character segmentation
    methods can be categorized into three strategies, namely dissection, recognition-based
    segmentation and holistic methods [27]. The dissection strategy is considered
    a heuristic approach. Since different alphabets have the dissection method is
    rather specific to the alphabet it was designed for. The characteristics which
    are normally used as contour information [28, 29], reservoir [30] and skeleton
    [29, 31]. Recognition-based segmentation, on the other hand, utilize feedback
    from a character model in order to determine segmentation points. A recent study
    showed that recognition-based methods generally outperform dissection methods
    [32]. The recognition-based segmentation methods usually consist of two phases,
    namely an over-segmentation phase and a segmentation searching phase. Normally,
    a dissection method is used in the over-segmentation phase to obtain candidate
    segmentation points. The candidate segmentation points are used to segment a given
    word into several fragments. The fragments are represented in an appropriate data
    structure that represents all possible segmentation hypotheses. Most recent methods
    for touching digits usually represent possible segmentation hypotheses in a directed
    acyclic graph (DAG) [33–35]. The problem is how to search for the best segmentation
    path. Existing approaches have considered the Viterbi algorithm [33, 36] and the
    shortest path algorithm [34, 37]. Alternatively, an undirected graph can be used
    to represent segmentation hypotheses [36]. The best segmentation hypothesis is
    a set of linear subgraphs obtained from applying a modified Viterbi algorithm.
    Despite the current availability of various recognition-based character segmentation
    methods, these existing methods cannot satisfyingly segment'
