  md: '# 6.1 Introduction


    Computers are able to perform an efficient and automated job using various approaches
    of data mining and machine learning. The volume of digital text data has suddenly
    increased with the rapid growth of the Internet in recent years. In addition,
    the manual investigation of each text data is a laborious, error-prone and time
    consuming task. Thus, there is an urgent need to deliver an efficient automatic
    text categorization system for these large amounts of unstructured text resources.
    Text categorization has become a major task in text problems. Several text categorization
    techniques have been developed in recent years in various languages, but fail
    to meet the requirements for Indian languages, especially for Bangla. This paper
    presents a text categorization technique that performs the classification for
    Bangla text documents. The proposed methodology is a text categorization problem
    that takes the pre-labeled Bangla text documents obtained from new newspapers,
    online magazines and webpages as the input; these are the data required to train
    the model classifier based on the various distance measurement algorithms and
    classify them into the respective text categories that are considered for this
    work.


    In this chapter, of the distance measurement algorithms such as squared Euclidean
    distance, Manhattan distance, Mahalanobis distance, Minkowski distance, Chebyshev
    distance and Canberra distance have been explored for Bangla text categorization
    for the first time, their applicability in this task examined using a dataset
    of 9000 Bangla text documents generated from new web corpora, magazines and webpages
    covering every text categories. Also, some standard and widely used distance measurement
    algorithms were studied, namely Cosine Similarity and Euclidean distance on the
    datasets, for the purposes of comparison.


    The rest of the paper has the following structure. The related work is discussed
    in Section 6.2, followed by the proposed methodology in Section 6.3, which includes
    discussion on data collection, pre-processing techniques, feature extraction and
    selection approaches and various distance measurement algorithms. In Section 6.4,
    the results are discussed with a comparative analysis among various distance measurement
    algorithms as well as the comparison of the proposed approach with existing methods.
    In Section 6.5, the paper is concluded showing some future directions in this
    field.


    # 6.2 Literature Survey


    # 6.2.1 Indo-European


    English text classification has gained immense acceptance among researchers all
    over the place. In the Indo–European language family, besides English, a'
