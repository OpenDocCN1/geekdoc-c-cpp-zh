    The popular maxmin function has been considered to compute forward HD(P,Q) from
    set P to set Q by using Equation 9.5.


    ```

    h(P,Q) = \max_{x \in P} \min_{y \in Q} \{d(x,y)\} \quad (9.5)

    ```


    When pen points of sets P and Q are represented by $a$ and $b$. For the present
    experiment, d(x,y) measures the Euclidean distances between $x$ and $y$. In the
    same way, h(Q,P) (known as backward HD) has been estimated from set Q to set P.
    9.13a illustrates the calculation of distances from each point of zone P to every
    other point of zone Q and the minimum valued distances for each point of zone
    P are marked in yellow. Among those minimum valued distances, the maximum is considered
    as forward HD and reflected in Figure 9.13b. Similarly, the computation of backward
    HD is shown in Figure 9.14a and b. During analysis it has been noticed that the
    computed h(P,Q) and h(Q,P) values are not the same most of the time. Therefore,
    in this work, the authors have measured both the forward and backward HD values
    (known as DHD) from each zone to all other zones to get exclusivity. This feature
    extraction strategy generates N-1 HD values for each zone and thereby a total
    of N*(N-1) HD features are estimated for an entire character.


    To extract DHD-based features in offline mode, the previously generated character
