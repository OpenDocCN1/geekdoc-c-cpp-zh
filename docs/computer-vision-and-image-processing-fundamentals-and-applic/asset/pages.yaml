    # 10.5.2 Layout Analysis


    By observing Lanna palm-leaf manuscripts, we found four patterns of layout alignment
    as illustrated in Figure 10.5. For these patterns, the text layouts are arranged
    from the left to the right of a palm leaf. They can be separated by some vertical
    lines. To find these separating lines, the vertical projection of the binary palm-leaf
    image is obtained and analyzed. We assumed that gaps between characters in the
    same layout are obviously smaller than the gap between layouts. Before computing
    the projection profile, we need to reduce the sensitivity caused by gaps among
    characters in order to merge characters in the same layout into one component.
    Hence, the morphology dilation operation [65] is applied to the binary image.
    Then, the projection profile is computed. Next, all pairs of opening and closing
    points of holes are detected. Each pair corresponds to each layout on the binary
    palm-leaf image.


