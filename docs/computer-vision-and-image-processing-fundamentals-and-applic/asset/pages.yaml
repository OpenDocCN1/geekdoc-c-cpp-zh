    also by the image binarization process. Furthermore, the manuscripts are dried
    palm leaves, naturally prepared without the knowledge of modern paper-making processes,
    and as a result leaf streaks are visible on the writing media. The leaf streak
    noises usually appear along the cracks of the leaf. Lastly, to bind the manuscripts,
    palm leaves were pierced'
