    # 1.2.3.1 Legal Industry


    In the legal industry, OCR plays a significant role in digitizing paper documents.
    To save space, documents are scanned and entered into computer databases. OCR
    simplifies the process and makes the documents-searchable [27, 28].


    # 1.2.3.2 Banking


    One of the most widely used applications of OCR is in banking. It can process
    a cheque without human involvement. When a cheque is inserted into a machine,
    the text written on it is scanned instantly and the correct amount of money is
    transferred directly to the specified account number. This technique [27, 28],
    however, is preferable for printed text because it is only accurately for handwritten
    texts.


    # 1.2.3.3 Healthcare


    OCR also contributes to healthcare by reducing paperwork by a huge volume. Healthcare
    professionals generally deal with a large number of forms with patient data. This
    task becomes easier when relevant data are put into an electronic database, where
    they can be accessed whenever needed. Here, OCR is used to extract information
    from the forms and put them into the databases [27, 28].'
