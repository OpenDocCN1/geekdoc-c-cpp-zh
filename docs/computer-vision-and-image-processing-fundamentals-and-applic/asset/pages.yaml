    # 9.2.4 Transition Count Scale [61]


    The proposed technique firstly scales a character into a window of size $N \times
    N$ and then the sample of position is set to 1 if this is a character data point
    (referred to as a foreground pixel), and set to 0 otherwise (background pixel).
    The center of gravity (CG) of the binarized image is computed and then the character
    image is segmented into four sub-regions. The transition counts from foreground
    to background pixels and vice-versa measured along four directions, row, column
    and two major diagonals (i.e. at four different angles $\theta=0^{\circ};90^{\circ};45^{\circ};135^{\circ}$)
    for each sub-region. This technique basically finds data distribution along four
    directions. The left side of Figure 9.10 shows the binarized character image divided
    into four sub-regions based on CG. It has also been noted that the maximum value
    of the transition count for a particular row/column/diagonal within a sub-image
    varies from 0 to 6. In the next step, the frequencies of these counts are estimated
    and used as features. For each sub-image, 28 (i.e. $7 \times 4$) feature values
    are generated for 0 to 1 transition and another 28 for 1 to 0. Therefore, a total
    of 56 (i.e. $28 \times 2$) feature values are generated for each sub-image. Finally,
    a total of 224 (i.e. $56 \times 4$) feature values are produced for the whole
    image. For any reference, feature calculation (here, 0 to 1 transition) is described
    on the right side of Figure 9.10.


    # 9.2.5 Topological Feature [61]


    # 9.2.5.1 Crossing Point


    This feature is useful for differentiating a few character pairs in the Bangla
    alphabet that are structurally similar in shape. For example, “\b” and “\v” are
    quite structurally similar, except “\v” has a crossing point on the lower left
    side due to the formation of a loop. Therefore, the presence of the crossing point
    plays an important role in distinguishing such character pairs. To estimate this
    feature, the pixel points of the character sample are sampled in way that points
    are at unit distance apart. This feature examines if a character sample contains
    a loop or not. The pixel points of the sample character'
