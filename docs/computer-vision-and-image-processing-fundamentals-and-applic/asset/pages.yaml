    [59]. Normally, a CNN requires a large training sample to perform at its best
    due to the classifier''s high complexity. In our experience, educating a CNN model
    with a small training set could lead to serious overfitting.


    # 10.4.3.2 Segmentation-Free Approach


    In segmentation-free character recognition, a word image can be sent directly
    as an input to the classifier. A poplar recognition model in this approach is
    the combination of a recurrent neural network-short-term memory (RNN-LSTM) [60]
    and a connectionist temporal classification (CTC) [61]. RNNs are similar to the
    feed-forward neural networks with the exception that they can use the internal
    state (memory) to process sequences of inputs. However, the vanishing gradient
    problem, where the gradients of the weight vectors become too small to be useful
    for learning, is often encountered during the training phase. LSTM architecture
    was introduced to deal with the vanishing gradient problem. The LSTM network adds
    multiplicative gates and additive feedback to the RNN [60]. Recent studies on
    word recognition using the RNN-LSTM can be found in [62, 63].


    # 10.5 An OHCR System for Lanna Palm-Leaf Manuscripts


    In this section, we present a working OHCR system for Lanna palm-leaf manuscripts
    as an example. These manuscripts are important sources of the knowledge of Lanna
    wisdom. The system consists of four main tasks, as shown in Figure 10.3, namely
    preprocessing, layout analysis, segmentation and character recognition. In the
    preprocessing task, palm-leaf images are segmented from a folio image. Each palm-leaf
    image is enhanced and transformed into a binary image. In the layout analysis,
    text layouts in the binary image are detected. Each text is individually decomposed
    into isolated character images in the segmentation task. Finally, in the character
    recognition task, all the characters are recognized by a classifier. A machine-encoded
    text of the input palm-leaf image is produced as the output.


