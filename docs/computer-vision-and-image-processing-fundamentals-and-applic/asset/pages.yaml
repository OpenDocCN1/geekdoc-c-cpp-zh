  md: '# Online Recognition of Handwritten Bangla Using Offline Images


    # 9.6 Conclusion


    In the present work, the efficiency of the feature set generated from online handwritten
    Bangla character images is increased by creating a corresponding offline version
    of the same. The intention is not only to enhance the character recognition accuracy
    also to build both online and offline character databases that can be used for
    further work in this domain. Though the combined feature set reflects better performance
    than the individual feature vectors, which were separately created from online
    and offline versions of the character images, the overall accuracy is not much
    increased. The applied late fusion scheme produces better results and improves
    recognition accuracy. However, due to strong similarity, a few characters are
    still misclassified. Hence, we plan to introduce more features to differentiate
    these similarly shaped characters in future, in order to improve the overall recognition
    accuracy. Another viable plan is to test the efficiency of this feature set for
    online handwritten texts in other languages.


