    # 6.3.4 Distance Measurement


    Distance measures are an important affair in many machine learning tasks. The
    purpose of the distance measurement is to estimate the similarity or dissimilarity
    between two terms. The distance measures considered squared Euclidean distance,
    Manhattan distance, Mahalanobis distance, Minkowski distance, Chebyshev distance
    and Canberra distance.


    # 6.3.4.1 Squared Euclidean Distance


    The squared Euclidean distance measure represents the same formula as the Euclidean
    distance measure, but the difference is that it squared in order to assign gradually
    increasing weight on terms that are at longer distances. It is estimated using
    the equation below


    Dis(i, j) = (i_i - j_i)² + (i_j - j_j)² + ... + (i_n - j_n)²                                     (6.5)


    The squared Euclidean distance considers the sum of the squared differences between
    two terms, corresponding to a text document.


    # 6.3.4.2 Manhattan Distance


    The Manhattan distance has various names like city block distance, L1 distance
    or absolute value distance. It measures the distance between two terms along the
    axes at right angles and is calculated using Equation 6.6. This distance measure
    is less influenced by the deviation, compared to the Euclidean and squared Euclidean
    measures.


    Dis(i, j) = |i - j| = ∑ |i_i - j_i|                                     (6.6)


    # 6.3.4.3 Mahalanobis Distance


    The Mahalanobis distance takes the mean or centroid of the varied data into consideration.
    It measures the relative distance between two terms with respect to the centroid.
    The Mahalanobis distance is larger for terms which are farther apart the centroid.
    The distance is represented by Equation 6.7 where SD is the standard deviation
    of the i_i and j_j over the dataset.'
