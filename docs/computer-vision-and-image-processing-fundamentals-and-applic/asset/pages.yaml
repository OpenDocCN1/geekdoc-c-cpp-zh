    # 5.5 Conclusion


    This chapter presents an approach that uses a multilayer perceptron classification
    algorithm based on a graph-based text representation scheme for classifying Bangla
    texts into their respective text categories. The results were also compared with
    other commonly used classifiers and it has been observed from the experiments
    that the multilayer perceptron performs better compared to other algorithms for
    classifying Bangla documents. In future, this experiment can be expanded to include
    a larger number of domains of Bangla texts as well as text categories. Also new
    hybrid approaches can be introduced for classifying the text documents to their
    predetermined text categories. We also plan to experiment with other machine learning
    techniques like those based on deep learning [36] and active learning [37] approaches
    to obtain better results. Also, a dynamic programming-based approach as stated
    in [38, 39] and ELM in [40] can be explored in text categorization tasks. In future,
    this study can be explored on the datasets of other languages as well.


