  md: '# # Preface


    We are surrounded by huge volumes of data in various categories. In the context
    of big data, automated and faster tools are in great demand. Often, data exist
    on scanned documents and can be either machine-printed or handwritten. These include,
    but are not limited to, letters, checks, payment slips, income tax and business
    forms numbering in the billions. Manual digitization is impossible, time consuming,
    and vulnerable to errors. Automation can solve such problems. Compared to machine-printed
    documents, handwritten document processing can be more challenging and, of, opens
    a wide range of issues to consider. Writer identification via handwriting can
    be one of the important applications. Further, we have experienced that both machine-printed
    and handwritten texts go together in one document. Can we treat/process them separately?
    For this, one needs to be able to extract meaningful information; it can be either
    machine-printed or handwritten texts. This can open up ideas of information extraction
    and understanding, as such information retrieval and natural language processing.


    Advances in document processing can only be possible by considering appropriate
    machine learning algorithms that help build data-driven models or predictions.
    The process includes classification, clustering, regression, association rules
    and many more elements. How can we forget learning-based approaches? In this book,
    advanced document processing techniques using up-to-date and well-trained machine
    learning algorithms are presented.


    Chapter 1 discusses the role of AI for different document analysis problems, such
    as optical character recognition and text categorization, where real-world issues
    are considered.


    Chapter 2 discusses multiple methods for optical character recognition on handwritten
    Bangla characters. It provides results on a database of 89,000 plus handwritten
    characters in addition to two publicly available benchmark databases, the ISI
    handwritten character database and CMATERb3.1.2.


    Chapter 3 presents a script identification study on multi-script artistic documents
    where real-world problems are taken into consideration. The primary motivation
    behind this work is that OCR tools are script-dependent. In the authors'' work,
    a semi-automated segmentation algorithm has been used for character separation
    within words followed by a thinning procedure and a structural feature; Gabor
    filters are used for feature extraction. The results were reported using several
    different machine classifiers.


    Chapter 4 discusses the use of extreme learning machines (ELMs), as they suppress
    the pitfalls of neural networks like slow learning rates and'
