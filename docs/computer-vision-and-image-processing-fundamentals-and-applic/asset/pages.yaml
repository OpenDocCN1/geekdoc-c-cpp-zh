    # 9.2.1 Direction Code-Based Feature [50]


    The collected character data firstly go through some pre-processing stages before
    this feature extraction technique is applied. The pre-processing steps involve
    elimination of redundant (repeated) pen points, and then the result-tant points
    are re-sampled into a fixed number of points that are almost equi-distant (Figure
    9.6).


    Each of the pre-processed character sample is segmented into K sub-divi-s and
    the direction code features are estimated for all the sub-divisions. As the character
    may contain single or multiple strokes, the number of subdivisions for the ith
    stroke is calculated by Equation 9.1.


    > $K_i = \round \frac{X_i}{X}$ (9.1)


    The length of strokes $X_i$ is computed by summing the distance between the two
    consecutive points in the sequence that compose it. The total length $X$ of the
    character sample is calculated as $X = \sum X_i$, and the value of $i$ denotes


    number of strokes used to represent sample character sample. If $\sum K_i \neq
    K$ then a slight modification needs to make $\sum K_i = K$.


