    # 10.4.3 Recognition


    Common to the majority of OHCR pipelines is the character recognition task, where
    an image actually gets converted into text; it is the task where existing methods
    have been unable to provide satisfactory results. Character recognition methods
    can be categorized into two streams, namely segmentation-based and segmentation-free
    methods.


    # 10.4.3.1 Segmentation-Based Approach


    Segmentation-based methods require isolated character images as input. An appropriate
    feature extraction and effective classifier can increase recognition accuracy.
    Many feature extraction methods for handwritten character recognition have been
    proposed in the literature. Notable feature extraction methods are the histogram
    of orientation gradient (HOG) [40], scale invariant feature transform descriptor
    [41], image moment descriptors [42–48], Fourier descriptors [49], multi-projection
    profiles [50, 51] and chain codes [49, 52, 53]. Furthermore, researchers have
    reported that combining several feature to form a feature vector can improve recognition
    performance [54–56]. To recognize isolated character images, there are several
    classification models available, for example k-nearest neighbor (kNN), support
    vector machines (SVM) and multi-layer perceptron (MLP), to just name a few.


    Another recognition approach is to adopt convolutional neural networks (CNN) as
    the recognition model. CNNs perform feature extraction simultaneously with learning
    the recognition model. A well-known architecture is the LeNet-5 [57], which performs
    reasonably well on handwritten digit classification. Several architectures for
    character recognition have been presented to, such as SPnet [58], Vanilla [9]
    and SHL-CNN'
