    #  8.3.5 Algorithm and Fine-Tuning the Model


    There were two learning algorithms used for the experiments: support vectors (SVM)
    and convolutional neural network (CNN). For the first part, we used an SVM with
    a linear kernel with the default penalty parameter of the error term to 1 to see
    which of the conventional features worked the best for this problem. A Wilcox
    signed rank test [36] was then done to check the difference between the results
    were significant or not.


    Then, for word vector averages, we experimented with a polynomial kernel and a
    basis function kernel. We experimented with polynomial degrees of 1, 2 and 3 with
    the penalty parameter of the error term to be 0.01, 1 or 100. We also experimented
    with radial basis function kernels with gammas of either 0.01, 1 or 100 with the
    same options of the penalty to the error term as the previous. We did not use
    statistical tests in this section.


    The convolutional neural network that we used follows of Kim [35] which is comprised
    of an embedding layer, followed by a convolutional layer with three filters of
    window sizes 3, 4 and 5, wherein each filter has 100 feature maps. We used the
    tanh function for the non-linearity. After the feature maps, max-over-time pooling
    was performed. Then a dropout layer was added. Our dropout probability was 0.5.
    Then everything was'
