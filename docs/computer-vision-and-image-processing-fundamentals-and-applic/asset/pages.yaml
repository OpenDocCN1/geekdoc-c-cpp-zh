- img_proc: true
  md: '# 4.3.1 Sigmoid Function


    A Sigmoid activation function produces an ‘S’ formation curve, which ranges between
    0 to 1. This function is widely used and easy to understand, but there are some
    major aspects that have made the sigmoid function fall out of popularity. The
    The issues result in this function being 0-centered. It saturates and kills the
    gradient and also has a slow convergence. The equation is as follows:


    ```

    $$g(w,b,x) = \frac{1}{1+\exp(-w.x+b)} \quad (4.5)$

    ```


    # 4.3.2 Hardlimit Function (‘Hardlim’)


    The activation function hardlimit, written as ‘hardlim’, insists on a node to
    output 1 if it reaches the threshold value, or else it is set to 0. This kind
    of activation function is mainly used with perceptron learning. The output of
    this transfer function is strictly either 0 or 1. The equation is follows:


    ```

    $$g(w,b,x)=1 \quad \text{If} (w.x-b) \geq 0$\n$g(w,b,x)=0 \quad \text{If} (w.x-b)
    \leq 0 \quad (4.6)$

    ```


    # 4.3.3 Radial Basis Function (‘Radbas’)


    The radbas activation function in an ELM is a real-valued activation function.
    It is defined only on Euclidean space. The aggregation of radial basis function
    is mainly applied to the function approximation problem. ELM-radbas functions
    use a Gaussian kernel function. For this function, the output can be ranged between
    -1 to +1. The equation is follows:


    ```

    $$g(w,b,x) = 1 \exp(-b||x-w||^2) \quad (4.7)$

    ```


    # 4.3.4 Sine Function


    The sine activation, known as the ‘sine C activation’, is a very popular function
    in ELMs for illustrating classifications and regressions. For this activating
    function, the output for negative and large positive inputs converges to 0. This
    function is defined as follows:


    ```

    $$y = \sin(x)/x \quad (4.8)$

    ```'
  merge: -1
  pgno: 60
- img_proc: true
  md: '# The Extreme Learning Machine and Its Applications


    As we know, dividing a value to 0 makes an undefined equation. So, an exception
    to the above function, where x is equal to 0, SinC(0), is noted. The value of
    1 is an exception.


    ```

    $$y = \frac{\sin(x)}{x} = 0 \quad \text{for } x \neq 0$$

    $$y = \frac{\sin(x)}{x} = 1 \quad \text{for } x = 0$$ (4.9)

    ```


    # 4.3.5 Triangular Basis Function (''Tribas'')


    The graphical shape of the triangular basis function is like a triangle, it is
    also known as ''hat'', ''triangle'' and ''tent function''. To derive realistic
    signals for this function, mainly a kernel transform function is used. The following
    equation is derived from this transfer function.


    ```

    $$g(w,b,x)=1 \quad \text{if } -1\leq x\leq 1$$

    $$g(w,b,x)=0 \quad \text{otherwise}$$$$ (4.10)

    ```


    # 4.4 Metamorphosis of ELM


    Due to some boundaries and pitfalls of ELMs, the idea of metamorphosis of an ELM
    is established. Some of the metamorphosis is briefly implemented.


    +   - An incremental ELM or I-ELM [6] is proposed for the handling of the complication
    occurring during the learning procedure. Here, the hidden nodes are randomly allocated
    to the hidden layer by one, and the output weights are also coagulated. As the
    transfer function of ELMs is continuous in nature, the I-ELM is one of the most
    muscular extensions for fixing any expected function domain.

    - An evolutionary ELM, also known as an E-ELM [7], is enhanced to determine the
    weight without tuning to the least square error minimization. Within the models
    of a conventional ELM, there exist a vast number of hidden nodes, and thus the
    input weight determination and network generalization performance are not satisfactory.
    For this reason, the concept of E-ELM has been established. The resultant output
    of the E-ELM is better than the conventional algorithm.

    - To solve the benchmark problem of classification, a pruning ELM or P-ELM [8]
    is proposed. It is a very popular method for resolving regression and classification
    problems. A P-ELM can deal with more'
  merge: -1
  pgno: 61
- img_proc: true
  md: '# Document Processing Using Machine Learning


    just the over-fitting problem. First it gathers the nodes which are not suitable
    for the network, then diminishes the remaining ones from the network.


    +   - A voting-based ELM, known as V-ELM [9], reduces misclassification problems.
    For the Classical ELM, the data class to the classification boundary may be misclassified
    due to the fluent abstraction of bias and input weights. By applying a major voting
    mechanism after multiple training, the resulting V-ELM deals with such misclassification
    problems.

    - An online sequential ELM or OS-ELM [10] may or not set the data size for learning.
    In an OS-ELM, the weights of input towards the hidden layer are rapidly assembled,
    but the output weights are regulated in a refined manner. It is clearly discerned
    that the OS-ELM is swifter and promotes better generalization effect.

    - To resolve tuning parameters as well as local minimum problems, Li et al. [11]
    proposed a fully complex ELM or C-ELM. It can move comfortably in any complex
    domain, its learning phase is significantly high-speed and acquires symbol error
    rate (SER).

    - To suppress computational complexity, an error minimized ELM or EM-ELM [12]
    is proposed. Beyond this metamorphosis, other extended versions of ELMs are proposed
    these days.


    Not only are these extensions of an ELM implemented, but also other metamorphosis
    like the O-ELM, Fuzzy ELM, Weighted ELM, Regularized ELM, Robust ELM, Parallel
    ELM, TLS ELM, S-ELM and others. These are extended to handle several complications
    that occur in ELMs for the classification, regression, close boundary, etc., problems.


    # 4.5 Applications of ELMs


    ELMs as well as their extensions may contribute to many fields. ELMs may serve
    different aspects of classification as well as regression problems. Some domains
    where the applications of ELMs are highly popular are discussed below.


    # 4.5.1 ELMs in Document Analysis


    Obaidullah et al. [13] have experimented with different activation functions in
    the task of script identification from images of handwritten documents. Extreme
    learning machines were widely used to recognize patterns. Chacko et al. [14] have
    used ELMs for handwritten character identification'
  merge: -1
  pgno: 62
- img_proc: true
  md: '# The Extreme Learning Machine and Its Applications


    along with wavelet energies to recognize 3D objects. Mahmoud et al. [15] have
    used ELMs combined with SVMs for recognizing offline handwritten Arabic numerals.


    # 4.5.2 ELMs in Medicine


    Machine learning has had remarkable contributions in the fields of medical [16–21]
    and health care. ELMs have been used to recognize thyroid stimulating hormones
    by Li et al. [22]. Daliri et al. [23] showed that ELMs can also detect lung cancer.
    Detecting heart problems using an ELM has also been shown, by Karpagacheveli et
    al. [24].


    # 4.5.3 ELM in Audio Signal Processing


    ELMs proved to be very beneficial in diverse audio-based applications. Mukherjee
    et al. [25] demonstrated the use of ELMs in musical instruments well as instrument
    identification from audio signals in the presence of different types of noises.
    In another instance, they used an ELM for voice activity detection [26]. Voice
    activity detection is a very important step for processing speech signals, detecting
    segments with vocal data.


    # 4.5.4 ELM in Other Pattern Recognition Fields


    Mohammed et al. [27] defined how an ELM can recognize a human face for 2D bidirectional
    components [28]. ELMs may be able to recognize multi-label faces, as implemented
    by Zong et al. [29]. ELMs have also been used for regression analysis. As per
    He et al. [30], a Parallel ELM intercept regression on scale data. To conquer
    the consequence of unsettled data. Balasundaram [32] proposed an E-incentive regression
    model for neuro computing and its applications. So, ELMs are used in both aspects
    and different areas. Their applications are not limited to image processing but
    are also useful in medicine, retail and other domains.


    # 4.6 Challenges of ELM


    Though extreme learning machines are very popular in many areas, some issues clearly
    remain. One of the main problems is that we can''t get any optimal solutions from
    ELMs. ELMs cannot play any role in parallel computing or distributed computing.
    Compared to learning algorithms, the performance is quite unstable. To resolve
    the classification problem and other boundaries, ELMs need to be tested more.'
