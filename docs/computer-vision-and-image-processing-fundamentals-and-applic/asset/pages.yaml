  md: '# Character Recognition of Bangla Handwritten Characters


    Recall is a measure of how many truly relevant instances are retrieved among the
    relevant instances.


    Recall (R) = \frac{(Relevent instances) \cap (Retrieved instances)}{(Relevant
    instances)}$


    This can also be defined as:


    R = \frac{T_p}{T_p + F_n}


    F₁ score (F₁) is the measure of accuracy of the observations which can be defined
    as the harmonic mean of precision and recall scores.


    F₁ = 2 \frac{P \times R}{P + R}


    Table 2.2 provides these scores for each individual character of Bangla. The table
    shows that character ৎ has the best precision score of 1 which produced an F₁
    score of 1. The lowest score of 0.979 is given by the numeral ৯, while the vowel
    modifier ɤ provides the lowest recall score of 0.987. For both classes the F₁
    score is also low, while the numeral ৎ is the lowest (0.988) and the vowel modifier
    ৈ and numeral ٩ the second lowest (0.991) amongst all the characters. The reduction
    in precision and recall is due to the fact that the numeral and the letter ের
    are close in terms of the writing pattern and the same can be observed for the
    vowel modifier ৈ and numeral ের, as there can be confusion of the structural pattern
    of these two, which can be observed in Figure 2.2. The average precision, recall
    and F₁ scores of all the characters are 0.996385714 (≈ 0.9964), 0.996385714 (≈
    0.9964) and 0.996414286 (≈ 0.9964), respectively.


