    # 7.3.4 Classifiers


    The feature set being developed to train the NBM classification algorithm in order
    to classify Bangla text documents. The reason behind the selection of this classifier
    was its encouraging achievements in earlier classification works [27–30]. The
    NBM algorithm is an extended version of naive Bayes that generally works better
    according to the kind of text documents. It generally estimates the probability
    of a domain in a document. The probability of a domain $[P(v|w)]$ is determined
    using Equation 7.3, where $P(t|v)$ is the conditional probability of term $t$
    and $t_w$ represent the count of terms in a document $w$.


    ```

    $P(v|w) = P(v) \prod_{t_s}^{t_w} P(t|v) (7.3)

    ```


    This equation determines the count of the tokens and manages computations in actions.
    This extended version is basically used for the presence of a term multiple times
    in a categorization task. It computes the conditional probability $[P(t|v)]$ that
    denotes the relative frequency of a particular term of $t$ for a given text category.
    It is evaluated using Equation 7.4, where $t$ represents a term of domain $v$,
    $N$ denotes the dataset, $B_w$ is the bag'
