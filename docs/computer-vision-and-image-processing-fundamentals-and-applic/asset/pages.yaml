    # 8.3.3 Feature Extraction


    There were a few features extracted. These included a bag-of-words feature, word
    n-grams and part-of-speech n-grams. The experiments included two bag-of-word features.
    The first is a normalized term frequency, which was normalized by the number of
    terms in the training example. The second is TFIDF, which was normalized by the
    inverse document frequency. Word bigrams and trigrams were used in the experiments
    as well. There were also part-of-speech n-grams. This included only unigrams and
    bigrams. The tagger was using Schmid’s TreeTagger [32]. Another feature was the
    average of word vectors. We used a Gensim [33] implementation of Word2Vec to get
    word vectors with dimensions 100 and 300. We used the February 5, 2016 Wikipedia
    dump.


    # 8.3.4 Experimental Setup


    There were multiple things that needed to be tested. First, we wanted to know
    which of the conventional features would be indicative of the classes for age,
    gender and personality profiling. We wanted to observe if using word vectors could
    have a comparable or better improvement over classification.


    Finally, we wanted to see if deep learning architectures could yield better results.
    Since there were two datasets, also with different modalities of the classification
    algorithms, as well as different things to be tested, we created two sets. This
    is illustrated in Figure 8.2. The first setup used ten-fold cross-validation when
    first dealing with the PAN 2015 and PAN 2016 datasets. In this setup, one training
    example is the concatenation of tweets for each user. Established features such
    as bag of words, part-of-speech n-grams and word n-grams were used on PAN 2015
    in conjunction with support vector machines [34] and various kernels. This allowed
    us to compare the effect of the features over this dataset. We had the same cross-validation
    setup using the average of word vectors for PAN 2016 also in conjunction with
    support vector machines. This enabled us to observe the effect of such vectors
    on classification.


    The second setup used hold-out and the PAN 2016 dataset. In this setup, one training
    example is a tweet. The dataset was first split by users into 70% training and
    30% test. Training examples were made from each tweet coming from the 70% portion.
    Test examples were also made from each tweet coming from the 30% portion. The
    training examples were then used in a convolutional neural network model based
    on Kim [35]. This enabled us to observe some factors for classification.'
