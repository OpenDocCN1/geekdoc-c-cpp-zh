    # 10.4.1 Preprocessing


    In the preprocessing task, an input document image is transformed into a suitable
    format, hopefully removing most the noise as well as undergoing foreground and
    background separation, where the pixels corresponding to the characters (considered
    the foreground) and the pixels corresponding to the background are commonly designated
    with binary 1s and 0s, respectively. The preprocessing task for palm-leaf manuscripts
    additionally consists of binarization and skew correction [1, 2].


    # 10.4.1.1 Binarization


    Binarization is a common starting point for document image analysis that converts
    gray image values into binary representation. The performance of binarization
    techniques has a great impact and directly affects the performance of the segmentation
    and recognition tasks. A simple and well-known binarization approach is the thresholding
    method. Based on the choice of the thresholding value, binarization methods can
    generally be divided into two types, global thresholding and local thresholding.
    For global thresholding, a single threshold value is calculated from the global
    characteristics of the image. Otsu''s method [3], for example, is a well-known
    global binarization technique. In local adaptive thresholding, the threshold value
    is calculated in smaller local image area, region or window. Many local adaptive
    thresholding techniques have been proposed, for example the adaptive mean method,
    Niblack''s method [4], Sauvola''s method [5], Wolf''s method [6] and the nick
    method [7]. Another binarization approach is the training-based method. This approach
    uses classifiers to classify each pixel into either the foreground or background
    pixel. The two training-based binarization methods were proposed in the Binarization
    Challenge for ICFHR 2016 Competition on the Analysis of Handwritten Text in Images
    of Balinese Palm Leaf Manuscripts [8]. The best in this competition, ICFHR G1
    [8], employs a fully convolutional network (FCN). It takes a color sub-image and
    outputs the probability that each pixel in the sub-image is part of the foreground.
    The second-method, ICFHR G2 [8], uses two neural classifiers to classify each
    pixel as background or not. A comparative study of document image analysis methods
    for palm-leaf manuscripts is reported in [9]. The study performed a comprehensive
    test of binarization, text line segmentation, isolated character recognition,
    word recognition and transliteration with collections of palm-leaf manuscripts
    from Southeast Asia (ie. Balinese, Khmer and Sundanese palm-leaf manuscripts).
    It reported that Niblack''s method, ICFHR G1 and ICFHR G2 performed for Sundanese,
    Khmer and Balinese manuscripts, respectively,'
