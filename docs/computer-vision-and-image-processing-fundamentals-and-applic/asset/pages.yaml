    # 10.5.3 Segmentation


    The next in the OHCR process is the segmentation step, which greatly affects the
    recognition performance. A binary image of each text layout is gradually separated
    to obtain several isolated characters. We divided this task into three steps,
    (1) text line segmentation, (2) block segmentation and (3) character segmentation.


    In line segmentation, we adopted the concepts of the text line segmentation method
    presented in [18]. The number of text lines in the given binary image is firstly
    determined. Unlike [18], the number of text lines is estimated by analyzing the
    horizontal projection profile of the whole image. The number of peaks in the projection
    profile is assigned to be the number of text lines, because the overall curvature
    of text lines tends to be linear, though some sections may be curved.


    In block segmentation, text lines are separated into small blocks, disregarding
    their semantics. This task is required in order to prepare suitable input'
  merge: -1
  pgno: 170
- img_proc: true
  md: '# Character Recognition for Palm-Leaf Manuscripts


    images for the character segmentation, which works better when the input is a
    small block of characters. It can be easily done by analyzing a vertical projection
    profile of each text line. Firstly, the vertical projection profile of each text
    line is computed. Gaps between characters are then extracted from the projection
    profile by scanning to find the positions where the profile is zero. To avoid
    cutting a character into redundant blocks, the smaller gaps are ignored. Meanwhile,
    the larger gaps are used as cutting points to separate the text line into small
    blocks.


    In character segmentation, characters in each block are separated into isolated
    characters. To do, we proposed a recognition-based character segmentation method
    in [39]. The method consists of three phases: (1) determination of candidate segmentation
    points, (2) representation of segmentation in a hypotheses graph and (3) determination
    of the best segmentation hypothesis. In the first phase, we analyzed the skeletons
    of a word image to identify the candidate segmentation points are used to separate
    the word image into fragments. In the second phase, we represented all segmentation
    hypotheses as an undirected graph. The graph was partitioned into subgroups corresponding
    to segmented character images. We defined a confidence function that combines
    feedback from a recognition model together with the expected width and height
    of segmented characters to guide the partitioning algorithm. A multilayer perceptron
    was used as the recognition model. We designed a dynamic programming algorithm
    for finding the global optimal solution, in the sense that it maximizes the confidence
    function, to the graph partitioning problem.


    # 10.5.4 Recognition


    Character recognition is the last task of our OHCR system. In this task, isolated
    character is to be classified into its corresponding character class. To enhance
    the performance of writer-independent recognition accuracy, we proposed an efficient
    character recognition method of handwritten Lanna Dhamma characters using intelligent
    moment feature selection (LDMS) [54]. The LDMS obtains a set of optimized designed
    features from a comprehensive set of shape-based moment descriptors. It consists
    of three phases (1) determination of orders for each effective moment descriptors
    (2) determination of the best combination of moment descriptors and (3) optimized
    moment feature selection using an inheritable bi-objective combinatorial genetic
    algorithm. The moment features are considered because they provide scale and rotation
    invariants as well as noise robustness. Through the experiments, four effective
    moment descriptors including Meixner, Charlier, Tchebiche and Hahn were selected
    to form a feature vector. A KNN was employed as the classifier as it makes less
    assumption on the distribution of the data.'
