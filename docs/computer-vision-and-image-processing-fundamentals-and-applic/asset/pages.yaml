    # 6.2.3 Japonic


    Mikawa et al. [10] proposed an efficient approach using extended cosine measure
    for classification of the Mainichi newspaper and customer reviews in Japanese.
    The approach measures the distance between two documents based on a vector space
    model.


    # 6.2.4 Afro–Asiatic


    Various techniques of text categorization have also been explored for Arabic.
    To mention a few, Boukil et al. [11] used convolutional neural networks for categorizing
    Arabic texts after extracting features using TF-IDF scheme. Al-Tahrawi and Al-Khatib
    [12] worked with polynomial neural networks on the Al-I-Jazeera dataset and achieved
    encouraging results. Raho et al. [13] studied the performances of various learning
    models for different cases on the BBC Arabic dataset and presented the results
    which are quite useful.


    # 6.2.5 Dravidian


    Recent research on text classification in Dravidian languages is briefly discussed.
    For the classification of Tamil documents, ArunaDevi and Saveeth [14] used the
    C-feature extraction technique, which takes pairs of terms into consideration.


    # 6.2.6 Indo–Aryan


    Recent research carried out for text classification in Indo–Aryan languages is
    briefly discussed. For instance, Gupta and Gupta [15] combined NB- and Ontology-based
    techniques to classify 184 Punjabi documents extracted from news corpus covering
    seven sub-domains of domains. Their experiment shows that the combined approach
    performs better compared to other approaches. Patil and Bogiri [16] performed
    an automatic Marathi text categorization on 200 documents of Gujarati based on
    user profiles using the label induction grouping (LINGO) algorithm. Rakholi and
    Saini [17] implemented a Bayes model for classifying 280 Gujarati documents from
    six categories for two cases: with without feature selection methods and obtained
    accuracies of 88.96% and 75.74% respectively. Classification of texts using language-specific
    WordNets for Assamese and Sanskrit was performed by Sarmah et al. [18] and Mohanty
    et al. [19]. In the case of Assamese [18], four classes were considered and an
    encouraging result of 90.27% accuracy was obtained for the same. However, the
    state of text classification approaches tells a sorry tale for Bangla. The'
