  md: '# Graph-Based Classification Model for Web Text Documents


    discussed here. For instance, Dasondi et al. [1] proposed a new text categorization
    technique for classifying text documents from social media. the proposed approach
    analyzes the text patterns automatically and extracts their positive and negative
    directions based on the analyzed patterns. The approach employs the possibility
    of term occurrence, generation of a sentence and assigning of weights to the terms
    for observing the location of the text data. They formulated their approach in
    such a way that various combinations of terms can be observed using a graphical
    model. The estimated possibilities and the assigned weights are used for generating
    the directed weights and graphs, and based on this graph the text documents were
    classified. Guru et al. [2] introduced an alternative scheme for choosing the
    most appropriate subset of the feature set for text classification. Based on a
    feature set and standard feature selection methods, the proposed methodology assigns
    rank to the features in a cluster rather assigning the ranks individually. According
    to their study, a cluster of features with nth rank is much more dominant than
    the cluster of features with (n + 1)th rank. Thus, clusters of features were developed
    to help distinguish one category from another. The advantageous factor of their
    technique is its capability of automatically discarding relevant features while
    ranking the clusters of features. Also, the approach efficiently handles the overlapping
    categories based on the choice of low-ranked yet dominant features. The experiment
    was expanded on three standard datasets using four commonly used algorithms such
    as the support vector machine (SVM) and naive Bayes (NB) to observe the performance
    of the system over the existing methods. As et al. [3] provide a comparative study
    of the nine feature selection approaches on six datasets, Kla, REL, WAP, Enreo
    and Spam, from which Kla and REO are highly skewed datasets using NB and SVM algorithms.
    Koswari et al. [4] proposed a technique called Rapid Deep Learning (RMDL) that
    solves the issue of perceiving the deep learning network by enhancing the accuracy
    through ensembles of deep learning networks. They experimented in the IMDB dataset
    and obtained a maximum accuracy of 90.79% using a 15 RMDL model, and also observed
    that RMDL performs better in comparison to the traditional approaches. Feng et
    al. [5] presented a new scheme for weighting the terms based on a probabilistic
    model using a matching score function and observed the effectiveness of the methods
    using KNN and SVM on small and large texts respectively.


