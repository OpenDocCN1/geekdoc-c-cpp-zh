  md: '# 6.3.1 Data Collection


    Data both in terms of quality and quantity acts as an important factor in the
    outcome of any experiment. Development of a database requires much attention so
    that errors do not come up while executing the experiment and the appropriate
    outcome may be attained. However, from the brief literature survey, it has been
    observed that the availability of category-based Bangla text documents is not
    adequate, so we had to develop our own database for carrying out the task. The
    text documents included in the experiment were acquired from various online Bangla
    corpora, magazines and webpages, covering eight domains: Business (B), Sports
    (SP), State News (P), Entertainment (E), Travel (T), Medical (M), Food (F) and
    Science and Technology (ST), as stated by leading newspapers. The distribution
    of text documents for each of the eight domains is provided in Table 6.1. The
    web sources of the text documents are anandabazar.com, bartmanpatrika.com, ebela.in,
    deshirice.wordpress.com, ebanglarecipe.com, recipebangla.com, banglaadda.com,
    amaderhchutthi, ebanglatravel.com.


    # 6.3.2 Pre-Processing


    Digital documents are formed of a linear series of symbols such as characters,
    words and phrases. For a given sequence of characters in their respective text
    document, before implementing the feature extraction and selection approaches,
    tokenization needs to be performed. Tokenization is the process of chopping the
    sentences into pieces, called tokens. Without segmenting the sentences, they were
    split based on a ‘space’ delimiter. After tokenization, the count of terms after
    retrieval is 2,806,159. The tokenized data allows the processing of the system
    more quickly and efficiently and also reduces pressure on system resources. This
    proves to be an advantage in systems relying on better performance. Since not
    all the tokens extracted


