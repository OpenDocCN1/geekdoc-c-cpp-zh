    # 4.1 Introduction


    The primary issue for the establishment of extreme learning machines (ELMs) is
    the slow learning rate that occurs in neural networks. The ELM algorithm is near
    the single hidden layer feed forward neural network (SHLFNN) for regression as
    well as classification with three differences. Those are as follows:


    +   - The number of neural network hidden neurons which use back propagation algorithm
    for training is much less than the number of ELM hidden neurons.'
