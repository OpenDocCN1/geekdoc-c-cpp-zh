  md: '# Character Recognition of Bangla Handwritten Characters


    K-NN (IBK) classification methods are used to get the best recognition performances
    of all the available databases.


    +   - Random Forest: This is one of several supervised learning algorithms that
    creates different numbers of decision trees (thus creating a forest of decision
    trees). It chooses different feature randomly to create decision trees during
    training time. Rather than searching for the most important feature, it searches
    for the best feature among the pool using a bagging method which results in a
    better model for classification. This makes the classifier more stable and accurate
    compared to other contemporary classifiers. In the testing phase, during predictions
    of unseen samples, an average value is taken from the predictions of all the individual
    regression trees or majority vote is used for final decision-making. Details can
    be found in [19].


    +   - Instance-based K-NN (IBK): The usual K-NN classification technique looks
    for the K neighbours to which the new instance of the current class can be assigned.
    When the value of K is 1, it always checks the immediate nearest neighbour and
    is incremental in nature. Usually, it does not rely on the training phase or,
    in have so much to do during training; an efficient training phase will do some
    indexing to reduce the time complexity during testing phase where exhaustive comparisons
    are required to find the nearest neighbour of a new instance of an unknown class.
    The instance-based K-NN (IBK) classification is an extension of the usual K-NN,
    where specific instances are used to improve the performance of the supervised
    K-NN. This type of technique does not maintain a set of abstractions derived from
    specific instances. It reduces the problem of the large storage requirement of
    the conventional K-NN approach. The IBK is a supervised learning algorithm which
    learns from labelled examples of instances. The details can be found in [20].


    +   - Simple logistic: The Logit algorithm and simple regression functions are
    the base learning mechanism for fitting the logistic model into a simple logistic
    classification. The dimension of the input feature vector and its mapping to the
    output are as same as the MLP classifier. It uses cross-validation to determine
    the optimal number of LogBoost iterations that is primarily used for the automatic
    selection of attributes. More details can be found in [18].


    +   - Multi-layer perceptron (MLP): This is the most widely used classifier for
    this type of research, consisting mainly of three layers of feedforward artificial
    neurons represented as nodes. Each node of the MLP is connected to another by
    a single connector whose'
  merge: -1
  pgno: 33
- img_proc: true
  md: 'strength or capacity is represented by the level or weight associated with
    it. Generally the weight vector and the bias vector of each layer pair are trained
    by a back propagation algorithm. The input layer neurons are determined by the
    feature dimension, and the number of classes it needs to be mapped determines
    the output layer neuron count. Neurons in the hidden layers (H) are determined
    during training phase. In our case, it is calculated as H=total attributes + total
    classes. The momentum and learning rate are chosen to be 0.7468 and 0.8907, respectively.
    Further details can be found in [19].


    # 2.3 Results and Discussion


    This section describes the experimental setup and the outcomes of the proposed
    method. As described earlier, in this proposed work our collected database of
    more 89000 Bangla classes is used. In our experimental scenario, the k-fold cross
    validation method is used, where K is chosen to be 5, actually, the contour chain
    code-based feature with a random forest classifier has yielded recognition accuracy
    of 99.64% for these isolated characters (out of 89,815 characters, 323 characters
    were found to be incorrectly classified). The 50 basic characters (letters) are
    considered along with all the numerals and ten vowel models of the Bangla script
    in this proposed work. In classification, the true positive ($T_p$), false positive
    ($F_p$), true negative ($T_n$), false negative ($F_n$) are the measures of result
    outcomes, in other words, observations. True positive means the classification
    result correctly indicating a positive class instance as a positive. True negative
    means the classification result correctly indicating a negative class instance
    as a negative. A false positive means the classification result is incorrectly
    indicating a positive class instance as a positive. A false negative means the
    classification result is incorrectly indicating a positive class instance as a
    negative. Precision (P), recall (R) and $F_1$ are the most widely used statistical
    measures for judging recognition performances. Precision is the measure of how
    many relevant instances are retrieved. This is also known as the positive predictive
    value.


    ```

    Precision (P) = \frac{(Relevant instances) \cap\ (Retrieved instances)}{(Retrieved
    instances)}$

    ```


    This can also be defined as:


    ```

    P = \frac{T_p}{T_p + F_p}$

    ```'
