    # ### 5.3.3 Graph-Based Representation


    In the present experiment, a graph-based text representation scheme has been implemented
    based on a weighted graph algorithm. Graph models have been used in several fields
    [27]. Then a classification algorithm was used to assign the text category to
    the text documents in the dataset.


    A graph Z is denoted by 3-tuple: Z = (V, E, W), where V is a set of nodes or vertices,
    E is a collection of weighted edges connecting the nodes and W represents the
    feature weight vector of edges.


    +   * Unique terms obtained from the training set using the feature extraction
    methods.

    * Edge: Established depending on the occurrence of terms in text documents. If
    two terms arrive in a certain text document then an edge was assigned from the
    previous node to the later one.

    * Feature Weight Vector: Determined using equation 1, where W(p,q) represents
    the weight assigned to the term p and q; f(p,q) denotes the count of occurrence
    of the term p and q within a text document; f(p) denotes the count of occurrence
    of the term p and f(q) denotes the count of occurrence of the term q separately
    in that particular text document. The higher the W(p,q), the stronger the edge
    between the two nodes is.


    ```

    $W(p,q) = \frac{f(p,q)}{f(p) + f(q) - f(p,q)} \quad (5.1)$

    ```


    The trend of the features for the distinct text classes is graphically depicted
    in Figure 5.2.


    # ### 5.3.4 Classifier


    A multilayer perceptron (MLP), one of the popular and commonly used classifiers
    in pattern recognition problems [28–31], is a feed-forward neural network architecture
    that plots the input data to a set of output data. It involves at least three
    surfaces of points bounded with the number of neurons in each surface, which are
    presented as a directed graph that employs a non-linear activation function. Multiple
    surfaces and non-linear activation make MLP capable of classifying data that are
    not linearly separable, and also of differentiating from a linear percept. In
    our experiment we have opted for the configuration of the MLP as i-hl-o (i.e denotes
    the number of attributes, hl represents the number of hidden layers and o is the
    number of output text'
