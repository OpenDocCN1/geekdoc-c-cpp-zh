    # 8.3 Overview of Author Profiling


    One aspect of document processing is authorship identification, wherein a specific
    author is predicted given a certain text. Author profiling is a subsection where
    instead of giving the specific author, characteristics such as age and gender
    of the author are predicted. The profiling methods simply move from the different
    features extracted.


    One paper that outlines various features is given by Stamatatos [18]. It outlines
    lexical, character, syntactic, semantic and application-specific features. These
    feature types were evident in submissions to the author profiling task of PAN,
    an ongoing project of the Conference and Labs of the Evaluation Forum (CLEF).
    There are various elections, but the ones pertinent to our task are PAN 2015 [19],
    whose task is to classify tweets for four languages, and PAN 2016 [20], whose
    task is to do a cross-genre evaluation. The main types of features extracted style-based,
    content-based, n-gram, information retrieval-based and collocation-based models
    were used in [21, 22]. Word n-grams were also used in works such as [23–25]. TFIDF
    n-grams were used in [26, 27]. POS n-grams were used in [26, 28]. Another set
    of features from word vectors. There are various vector implementations proposed.
    One that widely used is Word2Vec by Mikolov [29, 30]. Word2Vec algorithm has two
    modes: continuous bag of words and skipgrams. To obtain the word vectors, the
    program must initialize the vectors from random numbers. Then it reads from a
    large corpus as Wikipedia. Using the sequence of words in the text given in the
    corpus, the program uses the initial random vectors that represent words to predict
    other words. In continuous bag of words, for instance, a target word is predicted
    using the'
