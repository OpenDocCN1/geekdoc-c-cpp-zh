    # 2.1 Introduction


    Recognition of characters from their images is one of the most essential tasks
    in the field of computer vision. Optical character recognition (OCR) has lately
    become a very interesting field of research, especially for Indic scripts, due
    to its potential in Asian countries like India. The task, however, is quite difficult
    when images of handwritten characters are considered [1, 2]. Recently, various
    works on character recognition from handwritten characters have become available
    [1-13], while some very established standard character recognition systems from
    printed characters are already commercially available [14, 15]. Numerous techniques
    on scripts [3] for offline character recognition have already appeared in the
    literature. Bhowmik et al. [3] proposed two-stage hierarchical learning architectures
    based on a support vector machine (SVM), whereas Bhattacharya et al. [5] proposed
    an efficient two-stage approach for Bangla handwritten character recognition and
    achieved very good recognition accuracy with a multi-layer perceptron (MLP) classifier.
    Maitra et al. [6] also developed an approach for the handwritten character recognition
    of multiple scripts by a convolutional neural network (CNN). At the same time,
    Surinta et al. [7] contributed'
  merge: -1
  pgno: 29
- img_proc: true
  md: '# Document Processing Using Machine Learning


    a system that used local gradient feature descriptors. Another method using soft
    computing paradigm embedded with a two-pass approach was developed by Das et al.
    [8]. Sarkhel et al. [9] proposed a multi-objective approach for isolated Bangla
    character and digit recognition. Pramanik and Bag [10] came up with an idea for
    Bangla character recognition based on shape decomposition. Sarkhel et al. [11]
    also presented a technique for the recognition of popular Indic scripts. Recently,
    a performance study was made on feature selection techniques for OCR by Kumar
    et al [12]. Additionally, isolated handwritten character recognition from different
    scripts such as Devanagiri, Bangla, Oriya and Japanese-Kakana were attempted by
    Santosh and Wendling [13]. The Radon transform was used to produce a multi-projection
    profile of characters and dynamic time warping (DTW) was used to match that profile.


    The available approaches towards handwritten character recognition usually consists
    of several steps. Among them, two major steps are feature extraction and classifier
    design. From the related survey, some well-known and popularly classifiers can
    be found, including multilayer perceptron (MLP) [5], radial basis function (RBF)
    [3], modified quadratic discriminant function (MQDF) [5], support vector machine
    (SVM) [3], nearest neighbour [3], etc. Some frequently used and well-known features
    of state-of-the-art approaches are direction, gradient, curvature, the G transform,
    wavelet transform and statistical/structural features, [6]. In a few character
    recognition/document recognition studies, CNNs [6] were used to achieve higher
    accuracy. The literature reveals that although there are methods available for
    character recognition, there is still room for excellence in recognition performance.
    In this chapter, an approach to recognize handwritten, isolated Bangla characters
    have been studied on a relatively large database. Along with this, to improve
    the performance of existing methods is described, using standard databases of
    isolated Bangla handwritten characters. There are two objectives of these tasks
    which need simultaneous optimization: maximizing the recognition accuracy and
    minimizing the effective cost.


    Section 2.2 presents a proposed framework where database, feature and classification
    approaches are described; results and a discussion, using a comparative study
    with state-of-the-art methods, are presented in Section 2.3; and, lastly, Section
    2.4 contains our conclusions.


    # 2.2 Proposed Framework


    An optical character recognition system usually has various steps to follow before
    it can actually recognize characters. The preliminary steps include cleaning and
    normalizing the raw input data, for which some pre-processing steps need to be
    performed. In this proposed method of character recognition'
