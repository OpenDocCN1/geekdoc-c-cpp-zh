    The direction code for the first pixel of a stroke is considered to be 0. Hence,
    each stroke of the character is represented by direction code measurements.

    A histogram corresponding to measured direction codes is computed for each subdivision.
    As the measurement of changes in direction is mentioned by one of the nine values
    (from 0 to 9), the histogram contains nine components for each subdivision. If
    the whole character contains K number of subdivisions then this produces a 9 ×
    N element feature vector.


    # 9.2.2 Area and Local Features


    Research by Sen et al. [58] shows they find the strength of some features (by
    computing area, mass distribution and chord length) in recognizing online handwritten
    Bangla characters. The features are extracted from the local regions of the character
    by first dividing the sample into a quad-tree-based image segmentation approach
    mentioned in [58]. The detailed feature extraction mechanisms are described in
    the following.


    # 9.2.2.1 Area Feature


    In cases, the shapes of Bangla characters are different from each other. Hence,
    the structure of constituent parts of different characters in different blocks
    must be different when viewed at various quad-tree depths. Keeping this in mind,
    we have assumed that block-wise computation of the area under the curve of such
    character segments may generate discriminative features which in turn may play
    an important role towards the enhancement of character recognition accuracy. The
    block-wise computation of area under the curve is illustrated in Figure 9.8. There
    may exist blocks with no pixel point and in this case the computed area for this
    zone is considered to be 0. Looking into the structural patterns of the blocks
    for a sample like $, it can be stated that the produced features may play a useful
    role in classifying characters efficiently. The composite Simpson''s rule, in
    Equation 9.2, has been used to find the zone-wise area.


    ```

    Area = \sum_{k=1}^{n-1} \left(\frac{h}{3}\right)^*(y_{k} + 4*y_{middle} + y_{k+1})
    \quad (9.2)

    ```


    Where $n$ denotes the number of pen points in each block from $y_1$ to $y_n$.
    ($y_{k+1}$) are the $y$ coordinate values of the consecutive pen points in block.
    The measurement of $h$ and $y_{middle}$ are computed by evaluating Equations 9.3
    and 9.4.


    ```

    h = \frac{mod(x_{k+1} - x_k)}{2} \quad (9.3)

    ```'
