    # 8.4 Conclusion and Future Work


    After-in-depth discussion of the two major aspects, aggression identification
    and author profiling, the following conclusion is derived.

    In the case of aggression identification, plain/normal dense architecture outperforms
    other state-of-the-art architectures. The only downfall is that dense architecture
    could only be used in comparatively smaller datasets due to the indexing of each
    word encountered the larger the matrix representation, resulting in higher usage
    of computational resources. Apart from that, words not seen in the dictionary
    the larger representation/index are discarded. This could be tackled in future
    work. Moreover, the model does not capture the semantic meaning of the sentences
    like part of speech and morphology. This could also be considered in future work.


    In the case of author profiling, looking over the PAN 2015 dataset, we can conclude
    that using a standard TFIDF can still outperform other features in terms of English
    classification tasks. A combination of various features, however, is better for
    the Spanish classification task. Meanwhile, regression over personality gives
    results that are close to each other. Using an average of word vectors as features
    for the PAN 2016 dataset for a classifier could have comparable results, although
    it is not accurate since we are using different datasets. Finally, using a CNN
    architecture in conjunction with word vectors seems to yield a higher accuracy
    on average depending on the vector size as well as vector traction. However, we
    should have better tests for this in the future since the setups are currently
    different.


