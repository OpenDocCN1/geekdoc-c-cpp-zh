  md: "# 2.2.2 Feature Extraction\n\nThe feature extraction stage of this proposed\
    \ work is comprised of the 64-dimensional contour chain code-based feature, which\
    \ is extracted from isolated gray images of characters/numerals. The computational\
    \ technique of 64-dimensional feature is provided in the following:\n\nFirstly,\
    \ binaryization of the input image is done and the bounding boxes are computed.\
    \ After this, the contour points of each bounding box are considered. Then, $7\t\
    imes7$ blocks are created out of the bounding box by dividing them equally. The\
    \ four directional chain codes are computed for each contour point in each of\
    \ these blocks along their frequency. In this way, for each block, four integer\
    \ values representing the frequencies of chain code of four directions which produces\
    \ a $7\times7\times4=196$ dimensional feature. Then, the Gaussian filter is applied\
    \ on each of the blocks to down-sample these blocks to $4\times4$ blocks, which\
    \ finally produces the $4\times4\times4=64$-dimensional chain code feature.\n\n\
    | Database | Total Writers | Total Characters |\n| Our own database | 250 | 89,815\
    \ |\n| ISI handwritten character database [17] | 20 | 1,500 |\n| CMATERdb 3.1.2\
    \ [8] | 240 | 12,000 |\n\n# 2.2.3 Attribute Selection and Classification\n\nAttribute\
    \ selection: Attribute selection is important for improving the performance of\
    \ a system in terms of computational complexity. Also, it reduces some redundant\
    \ attributes which may reduce accuracy. In this work, the filter type feature\
    \ selection method is used as it will not modify the given feature set to some\
    \ reduced feature set that is tuned for any particular classifier. The feature\
    \ reduction is used for only CMATERdb 3.1.2. A filtered correlation-based feature\
    \ selection method is applied with a greedy search to reduce dimensionality. The\
    \ selection method is more effective than wrapper methods due to its less computational\
    \ overhead and generalized selection of features that are already available. In\
    \ this work, the feature reduction has reduced the feature dimension from 64 to\
    \ 47. The details of attribute selection and filtered correlation-based feature\
    \ subset method can be found in [18].\n\nClassification: Three different classification\
    \ approaches are applied for these three databases. Random forest, simple logistic\
    \ and instance-based"
