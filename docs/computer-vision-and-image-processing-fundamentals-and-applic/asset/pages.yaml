  md: "# The Extreme Learning Machine and Its Applications\n\nwhere the hidden layer\
    \ output matrix is H.\n\n```\n$H = \\begin{bmatrix} G(w_1, b_1, x_1) & \\dots\
    \ & G(w_L, b_L, x_1) \\ G(w_1, b_1, x_M) & \\dots & G(w_L, b_L, x_M) \\end{bmatrix}$\n\
    ```\n\n```\n$B = \\begin{bmatrix} \\beta_1 \\ : \\ \\beta_L \\end{bmatrix}$\n\
    ```\n\n```\n$Y = \\begin{bmatrix} Y_1 \\ : \\ Y_M \\end{bmatrix}$\n```\n\nwhere\n\
    $(x_i, y_i)_{i\\in\\{1,2,\\dots,M}$ is the training set.\n$x_i = (x_1, x_2, \\\
    dots, x_M)$ is supposed to be the input vector.\n$y_i = (y_1, y_2, \\dots, y_o)$\
    \ is the output vector.\n\nFor a training set $(x_i, y_i)$ the count of hidden\
    \ neurons $L$ and the activation or transfer function $g()$, the algorithm of\
    \ ELM is represented in three steps.\n\n+   1. Randomly assign the input weight\
    \ $w_i$ and bias $b_i$, for the hidden layer.\n2. Determine the hidden layer to\
    \ output layer $G(w_y, b_y, x)$.\n3. Lastly, calculate $\beta$ according to the\
    \ previously mentioned Equations 4.3 and 4.4.\n\n# 4.3 Activation Functions of\
    \ ELM\n\nThe activation function is one of the most formidable features of an\
    \ ANN, a single layer feedforward neural network for learning and justifying really\
    \ complex material. The main purpose of the activation function is to transfer\
    \ the input neuron to the output signal. Now the question is, what if we don't\
    \ use this function? Without it, the output function is just a simply linear function,\
    \ and the ANN becomes just a linear regression model that is not able to learn\
    \ any complicated data set.\n\nMostly, ELM deals with the 'sigmoid', 'sine', 'hardlimit',\
    \ 'tribas' and 'rad-bas' activations. The following is a brief discussion of these."
