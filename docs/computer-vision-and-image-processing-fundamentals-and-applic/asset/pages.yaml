    # 7.3.3 Feature Extraction and techniques used in text categorization.


    There are a number of common and widely used approaches is called a ‘bag of words’.
    This method is basically effortlessly to represent and accomplish, yet in NLP
    a simple method takes a long time to produce an encouraging outcome. The approach
    is also flexible enough to be used in innumerable procedures for extracting features
    from texts. The bag of words can be described as the occurrence of words within
    a text document. It is a procedure of expressing textual knowledge with machine
    learning algorithms. In natural language processing, the vectors are developed
    from text data that represent different linguistic characteristics of the texts.
    The approach only considers whether the particular term is present in the text
    document, not where in document. In this approach, a histogram of the tokens within
    the text is considered a certain concept is that a text document is said to be
    similar to another text document if both have similar content. The bagof model
    can be simple or complex depending on the problem. The complex scenario arises
    while determining the design of the vocabulary of the tokens and the procedures
    of scoring the presence of those tokens.


    In the present experiment, a UBoWs was developed and the proximity between two
    text categories was considered for the extraction of features, which could then
    be used for training the model classifier. Each distinct token in the UBoWs represents
    a descriptive feature. The bag-of-words method has proved to be an achievement
    in tasks like language and document categorization. As normally done in a bag-of-words
    model, all the words in every text document were considered, and the frequencies
    of each token were counted. After getting the number of occurrences each term,
    a certain number of tokens appearing more often were chosen. Prior to the implementation
    of machine learning algorithms, the raw texts needs to be converted into a vector
    of numbers. The weight of each unique term was determined by Equation 7.1. The
    percentage of unique terms of all text categories/domains are presented in Table
    7.2. The trend of the features for the eight distinct text classes for the present
    experiment is graphically depicted in Figure 7.2. Scoring was performed to determine
    the level of proximity of a text document to a text category using Equation 7.2.
    Table 7.3 provides the percentage of proximity among different domains, estimated
    by considering the overlapping of unique terms text documents of the domains considered
    in the present experiment.


    ```

    W(t_x) = (1+log2(1+O_x))*O(t_x,d)  (7.1)

    ```'
