    # ## 7.1 Introduction


    In the few years, text document management systems based on content gained tremendous
    attention in the field of computer and information science. The reasons behind
    this demand are the availability of digital documents at a huge scale and the
    need to access these documents in more efficient manner. Thus, the emergence of''text
    categorization'' (TC), which can also be referred to as ''text classification''
    or ''topic spotting''. Text categorization is a dynamic research domain of text
    mining that refers to the task of assigning documents to their respective categories
    using classification techniques for efficiently managing information. If the text
    document is categorized, then searching and retrieving information from these
    texts will be quick and effective. The prime goal of text categorization is to
    classify a random text document to its category. Text categorization can be either
    single-label or multi-label: in the former case the document will be classified
    with only one class, whereas in the latter it will fit into more than one category.'
  merge: -1
  pgno: 99
- img_proc: true
  md: '# Document Processing Using Machine Learning


    There are now various applications of TC in numerous frames. Some of the applications
    are document indexing depending on vocabulary, document filtering, word sense
    disambiguation and hierarchical classification of online resources. Normally,
    in recent scenarios, TC serves multiple purposes that require flexible access
    to selection, organization and modification of the documents. It is also applicable
    where web automation is associated with the search and retrieval of data in the
    mode of text.


    In the 1990s, machine learning approaches to text classification gained popularity.
    TC has a deep past. Several techniques have been explored in this field to enhance
    the performance in several languages, but very few approaches have been proposed
    for Indian languages, especially for Bangla. The common and widely used text representation
    is a bag-of-words approach that sometimes uses phrases, sequences of words or
    N-grams. While working with texts, the prime focus is on words or N-grams that
    need to be extracted from the dataset before the application of feature selection
    or feature weighting schemes. Instead of classifying the text documents manually
    or being based on handcrafted rules, text categorization uses machine learning
    techniques which are trained by classification rules based on labeled documents.


    Here, in the present experiment, the unique bag of words (UOWs) and the proximity
    between the text categories have been considered in order to increase the efficiency
    of a system for classifying Bangla text documents automatically. The proximity
    of categories is determined based on the UOW model. Then, a scoring algorithm
    is employed to assign different scores to the proximity of domains based on the
    frequency of the closeness in the corpus. After developing the feature set, a
    naive Bayes multinomial (NBM) text documents acquired from various online news
    corpora, magazines and webpages from eight domains, namely Business, Travel, Food,
    State News, Entertainment, Sports, Medical and Science and Technology. The experiment
    was evaluated on a database of 9000


    The rest of this chapter has the following structure. Related work is described
    briefly in Section 7.2, followed by the proposed methodology in Section 7.3, which
    includes discussion on data collection, pre-processing techniques, feature extraction
    and selection approach and classifiers being used. In Section 7.4, the results
    are analyzed along with comparative various classification algorithms and a comparison
    of the proposed methodology to existing methods. In Section 7.5, the paper is
    concluded showing some future directions in this field.


