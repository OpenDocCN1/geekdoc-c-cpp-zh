    # 1.2.2 Segmentation


    Segmenting a text [16–20] into individual tokens is critical in the case of OCR.
    Segmenting handwritten texts for different Indic languages is a difficult task
    [21, 22] because of commonalities among different characters. There are also non-connected
    components in characters like ”. When observed in isolation, the "'' seems to
    be noisy when with the entire character presents a meaning. Handling these issues
    is very challenging and although researchers have proposed different techniques
    for segmentation of characters, lines and words in Indic languages [23–25], a
    fully-flegged segmentation scheme has yet to be developed. Segmentation is also
    is difficult due to intra-writer variation as discussed in the previous section.
    The same is illustrated in Figure 1.8.


    # 1.2.3 Applications


    Optical character recognition is a vast field with a huge number of applications.
    One can find OCR systems using state-of-the-art approaches to different languages
    such as Bangla, English, Latin, Cyrillic, Arabic, Hebrew, Indic, Bengali (Bengali),
    Devanagari, Tamil, Chinese, Japanese, Korean and many more. Some widely used applications
    can be seen in the following fields:'
