    # 5.2.5 Bangla


    The state of evolution of text classification approaches in this field is in a
    sorry state for Bangla. The lack of information for this field shows that an extended
    journey is waiting for us before we notice the need for more research in this
    language. Some of the works performed in this language are reported here. Mansur
    et al. [21] applied the N-gram method for text classification including only one
    year of data from the Pratham Alo of Bangla newspaper corpus. In another experiment,
    Mandal and Sen [22] experimented with supervised learning methods for classifying
    1000 labeled documents comprised of 22,218 tokens into five categories. They achieved
    a maximum accuracy of 89.14% with the SVM method. On the other hand, a stochastic
    gradient descent (SGD) classifier was used by Kabir et al. [23] to classify text
    documents of nine text categories and achieved an accuracy of 93.85%, which is
    better compared to the previous one. In another work [24], an accuracy of 92.57
    was observed based on TF-IDF and SVM algorithms for classifying Bangla text domains.
    Cosine similarity and Euclidean distance algorithms were used by Dhar et al. [25]
    to categorize 1000 text documents from five domains: Business, State, Medical,
    Sports and Science based on a TF-IDF weighting scheme; they attained a maximum
    accuracy of 95.80% for the cosine similarity measure. In another study, a new
    scheme of reduction technique was proposed by Dhar et al. [26] in which the top
    40% of terms were taken into consideration from the total set of tokens extracted
    from the training documents conducted on 1960 text documents from five domains
    and attained encouraging outcomes using a LIBLINEAR classifier. The brief survey
    clearly shows that there is a pressing to develop automatic text categorization
    systems at least for Bangla users to serve their purposes in a more refined and
    efficient manner.'
