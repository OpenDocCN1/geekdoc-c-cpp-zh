  md: "# Figure 19.3    Employees and assets\n\n![](img/5f9368899ebf8d92fc145f8def1e89f8_128_0.png)\n\
    \nThis is often called a “parent-child” relationship: The parent (an instance\
    \ of **Employee**) has a collection of children (an `NSMutableArray` of **Asset**\
    \ objects).\n\n# # Creating the Asset class\n\nCreate a new file: an Objective-C\
    \ subclass of `NSOobject`. Name it **Asset**. Open **Asset.h** and declare two\
    \ instance variables and two properties:\n\n```\n#import <Foundation/Foundation.h>\n\
    \n@interface Asset : NSObject\n{\n    NSString *label;\n    unsigned int resaleValue;\n\
    }\n@property (strong) NSString *label;\n@property unsigned int resaleValue;\n\
    @end\n```\n\nNotice the **strong** modifier on the `@property` declaration for\
    \ **label**. That says, “This is a pointer to an object upon which I claim ownership.”\
    \ (We’ll talk about other options for this property attribute in Chapter 20.)\n\
    \nRemember that when an object doesn’t have any owners, it is deallocated. When\
    \ an object is being deallocated, it is sent the message **dealloc**. (Every object\
    \ inherits the **dealloc** method from `NSOobject`.) You are going to override\
    \ **dealloc** so that you can see when instances of **Asset** are being deallocated.\n\
    \nTo make it clear which particular instance of **Asset** is being deallocated,\
    \ you’ll also implement another `NSOobject` method, **description**. This method\
    \ returns a string that is a useful description of an instance of the class. For\
    \ **Asset**, you’re going to have **description** return a string that includes\
    \ the instance’s **label** and **resaleValue**.\n\nOpen **Asset.m**. Synthesize\
    \ the accessors for your instance variables and then override **description**\
    \ and **dealloc**."
