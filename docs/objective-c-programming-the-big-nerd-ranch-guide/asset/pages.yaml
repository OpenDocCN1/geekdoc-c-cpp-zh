    code we’ve written. The more difficult the programming problem you are trying
    to solve, the more comments will help document how you solved the problem. That
    becomes especially important when you return to your work months later, look at
    code you forgot to comment, and think, “I’m sure this solution is brilliant, but
    I have absolutely no memory of how it works.”


