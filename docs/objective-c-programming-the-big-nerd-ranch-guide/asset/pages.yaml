    Remember that a function is like a recipe card. If I began to execute the “Baked
    Chicken” card, I would discover that the second instruction is “Make Seasoned
    Bread Crumbs,” which is explained on another card. A programmer would say “the
    Baked Chicken function *calls* the Seasoned Bread Crumbs function.”'
