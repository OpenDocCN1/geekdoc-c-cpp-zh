  md: "# Property Lists\n\nSometimes you need a file format that can be read by both\
    \ computers and people. For example, let’s say that you want to keep a description\
    \ of your stock portfolio in a file. As you add new stocks, it would be nice to\
    \ be able to edit that file easily by hand. But, it might also be handy for one\
    \ of your programs to be able to read it. When facing this problem, most Objective-C\
    \ programmers use a *property list*.\n\nA property list is a combination of any\
    \ of the following things:\n\n+   - NSArray\n- NSMutableDictionary\n- NSString\n\
    - NSData\n- NSDate\n- NSNumber (integer, float or Boolean)\n\nFor example, an\
    \ array of dictionaries with string keys and date objects is a property list (or\
    \ just a \"P-list\").\n\nReading and writing a property list to a file is really\
    \ easy. In Xcode, create a new project: a Foundation Command Line Tool named stockz\
    \ and add the following code:\n\n```\n```\n#import <Foundation/Foundation.h>\n\
    \nint main(int argc, const char * argv[])\n{\n    @autoreleasepool {\n\n     \
    \   NSMutableArray *stocks = [[NSMutableArray alloc] init];\n        NSMutableDictionary\
    \ *stock;\n\n        stock = [NSMutableDictionary dictionary];\n        [stock\
    \ setObject:@\"AAPL\"\n                 forKey:@\"symbol\"];\n        [stock setObject:[NSNumber\
    \ numberWithInt:200]\n                 forKey:@\"shares\"];\n        [stocks addObject:stock];\n\
    ```\n```"
