  md: "# # 4  \nif/else\n\nAn important idea in programming is taking different actions\
    \ depending on circumstances. Have all the billing fields in the order form been\
    \ filled out? If so, enable the Submit button. Does the player have any lives\
    \ left? If so, resume the game. If not, show the picture of the grave and play\
    \ the sad music. This sort of behavior is implemented using *if* and *else*, the\
    \ syntax of which is:\n\n```\n```\nif (conditional) {\n    // execute this code\
    \ if the conditional evaluates to true\n} else {\n    // execute this code if\
    \ the conditional evaluates to false\n}\n```\n```\n\nYou won't create a project\
    \ in this chapter. Instead, consider the code examples carefully based on what\
    \ you've learned in the last two chapters. Here's an example of code using *if*\
    \ and *else*:\n\n```\n```\nfloat truckWeight = 34563.8;\n// Is it under the limit?\n\
    if (truckWeight < 40000.0) {\n    printf(\"It is a light truck\\n\");\n} else\
    \ {\n    printf(\"It is a heavy truck\\n\");\n}\n```\n```\n\nIf you don't have\
    \ an *else* clause, you can just leave that part out:\n\n```\n```\nfloat truckWeight\
    \ = 34563.8;\n// Is it under the limit?\nif (truckWeight < 40000.0) {\n    printf(\"\
    It is a light truck\\n\");\n}\n```\n```\n\nThe conditional expression is always\
    \ either true or false. In C, it was decided that 0 would represent false, and\
    \ anything that is not zero would be considered true.\n\nIn the conditional in\
    \ the example above, the < operator takes a number on each side. If the number\
    \ on the left is less than the number on the right, the expression evaluates to\
    \ 1 (a very common way of expressing trueneess). If the number on the left is\
    \ greater than or equal to the number on the right, the expression evaluates to\
    \ 0 (the only way to express falseness).\n\nOperators often appear in conditional\
    \ expressions. Table 4.1 shows the common operators used when comparing numbers\
    \ (and other types that the computer evaluates as numbers):"
