  md: "# 11\n\n# The Heap\n\nSo far, your programs have only used memory that has\
    \ been in frames on the stack. This memory is automatically allocated when the\
    \ function starts and automatically destroyed when the function ends. (In fact,\
    \ local variables are often called *automatic variables* because of this convenient\
    \ behavior.)\n\nSometimes, however, you need to explicitly claim a long line of\
    \ bytes of memory and use it in many functions. For example, you might read a\
    \ file of text into memory and then call a function that would count all the vowels\
    \ in that memory. Typically, once you were finished with the text, you would let\
    \ the program know you were all done so the program could reuse that memory for\
    \ something else.\n\nProgrammers often use the word *buffer* to mean a long line\
    \ of bytes of memory. (This explains the term “buffering” to describe the wait\
    \ for YouTube to send you enough bytes for that cat video to get started.)\n\n\
    You claim a buffer of memory using the function **malloc()**. The buffer comes\
    \ from a region of memory known as the *heap*, which is separate from the stack.\
    \ When you’re done using the buffer, you call the function **free()** to release\
    \ your claim on that memory and return it to the heap. Let’s say, for example,\
    \ I needed a chunk of memory big enough to hold 1,000 floats.\n\n```\n#include\
    \ <stdio.h>\n#include <stdlib.h> // malloc and free are in stdlib\n\nint main(int\
    \ argc, const char * argv[]) {\n    // Declare a pointer\n    float *startOfBuffer;\n\
    \    \n    // Ask to use some bytes from the heap\n    startOfBuffer = malloc(1000\
    \ * sizeof(float));\n    \n    // ...use the buffer here...\n    \n    // Relinquish\
    \ your claim on the memory so it can be reused\n    free(startOfBuffer);\n   \
    \ \n    // Forget where that memory is\n    startOfBuffer = NULL;\n    \n    return\
    \ 0;\n}\n```\n\n*startOfBuffer* would be a pointer to the first floating point\
    \ number in the buffer."
  merge: -1
