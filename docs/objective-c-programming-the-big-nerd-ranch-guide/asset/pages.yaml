    \ $34 in assets>\",\n\t\"<Employee 8: $0 in assets>\",\n\t\"<Employee 9: $136\
    \ in assets>\"\n\t)\n\tGiving up ownership of one employee\n\tGiving up ownership\
    \ of array\ndeallocating <Employee 0: $0 in assets>\ndeallocating <Employee 4:\
    \ $0 in assets>\ndeallocating <Employee 8: $0 in assets>\n```\n\nNotice that now\
    \ none of the employees with assets are getting deallocated properly. Also, none\
    \ of the assets are being deallocated, either. Why?\n\n# # Retain cycles\n\nThe\
    \ asset owns the employee and the employee owns the assets array, and the assets\
    \ array owns the asset. It is an island of garbage created by this circle of ownership.\
    \ These objects should be getting deallocated to free up memory, but they aren’t.\
    \ This is known as a *retain cycle*. Retain cycles are a very common source of\
    \ memory leaks.\n\nTo find retain cycles in your program, you can use Apple’s\
    \ profiling tool, Instruments. When you profile a program, you monitor it while\
    \ it runs to see what’s happening behind the scenes with your code and the system.\
    \ However, your program runs and exits very, very quickly. To give you time to\
    \ profile, put in a hundred seconds of sleep( ) at the end of your main( ) function:\n\
    \n```\n... }\nsleep(100);\nreturn 0;\n}\n```\n\nIn Xcode, choose **Product → Profile**\
    \ in the menu. Instruments will launch. When the list of possible profiling instruments\
    \ appears, choose *Leaks*:"
