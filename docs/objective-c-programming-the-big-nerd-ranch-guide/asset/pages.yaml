  md: "# # Addresses and Pointers\n\nYour computer is, at its core, a processor (the\
    \ Central Processing Unit or CPU) and a vast meadow of switches (the Random-Access\
    \ memory or RAM) that can be turned on or off by the processor. We say that a\
    \ switch holds one *bit* of information. You’ll often see 1 used to represent\
    \ “on” and 0 used to represent “off.”\n\nEight of these switches make a *byte*\
    \ of information. The processor can fetch the state of these switches, do operations\
    \ on the bits, and store the result in another set of switches. For example, the\
    \ processor might fetch a byte from here and another byte from there, add them\
    \ together, and store the result in a byte way over someplace else.\n\n![](img/5f9368899ebf8d92fc145f8def1e89f8_65_0.png)\n\
    \nThe memory is numbered, and we typically talk about the *address* of a particular\
    \ byte of data. When people talk about a 32-bit CPU or a 64-bit CPU, they are\
    \ usually talking about how big the address is. A 64-bit CPU can deal with much,\
    \ much more memory than a 32-bit CPU.\n\n# ## Getting addresses\n\nIn Xcode, create\
    \ a new project: a C Command Line Tool named Addresses.\n\nThe address of a variable\
    \ is the location in memory where the value for that variable is stored. To get\
    \ the variable’s address, you use the & operator:\n\n```\n```\n#include <stdio.h>\n\
    \nint main(int argc, const char * argv[])\n{\n    int i = 17;\n    printf(\"i\
    \ stores its value at %p\\n\", &i);\n}\n```\n```"
  merge: -1
  img_proc: true
- pgno: 66
  md: "```\n    return 0;\n}\n```\n\nNotice the `%p` token. That's the token you can\
    \ replace with a memory address. Build and run the program. You'll see something\
    \ like:\n\n```\ni stores its value at 0xbffff738\n```\n\nalthough your computer\
    \ may put `i` at a completely different address. Memory addresses are nearly always\
    \ printed in hexadecimal format.\n\nIn a computer, everything is stored in memory,\
    \ and thus everything has an address. For example, a function starts at some particular\
    \ address. To get that address, you just use the function's name:\n\n```\nint\
    \ main(int argc, const char * argv[])\n{\n    int i = 17;\n    printf(\"i stores\
    \ its value at %p\\n\", &i);\n    printf(\"this function starts at %p\\n\", main);\n\
    \    return 0;\n}\n```\n\nBuild and run the program.\n\n# ## Storing addresses\
    \ in pointers\n\nWhat if you wanted to store an address in a variable? You could\
    \ stuff it into an unsigned integer that was the right size, but the compiler\
    \ will help you catch your mistakes if you are more specific when you give that\
    \ variable its type. For example, if you wanted a variable named `ptr` that holds\
    \ the address where a float can be found, you would declare it like this:\n\n\
    ```\nfloat *ptr;\n```\n\nWe say that `ptr` is a variable that is a *pointer* to\
    \ a float. It doesn't store the value of a float; it points to an address where\
    \ a float may be stored.\n\nDeclare a new variable named `addressOfI` that is\
    \ a pointer to an `int`. Assign it the address of `i`.\n\n```\nint main(int argc,\
    \ const char * argv[])\n{\n    int i = 17;\n    int *addressOfI = &i;\n    printf(\"\
    i stores its value at %p\\n\", addressOfI);\n    printf(\"this function starts\
    \ at %p\\n\", main);\n    return 0;\n}\n```\n\nBuild and run the program. You\
    \ should see no change in its behavior.\n\nWe're using integers right now to be\
    \ simple. But if you're wondering what the point of pointers is, I hear you. It\
    \ would be just as easy to pass the integer value assigned to this variable as\
    \ it is to pass its address. Soon, however, your data will be much larger and\
    \ much more complex than single integers. That's why we pass addresses. It's not\
    \ always possible to pass a copy of data you want to work with, but you can always\
    \ pass the *address* of where that data begins. And it's easy to access data once\
    \ you have its address."
