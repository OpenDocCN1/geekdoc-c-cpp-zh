- pgno: 237
  md: "# # 32\nBlocks\n\nIn Chapter 24, you learned about the callback mechanisms\
    \ delegation and notifications. Callbacks allow other objects to call methods\
    \ in your object in response to events. While perfectly functional, these approaches\
    \ break up your code. Pieces of your program that you’d like to be close together\
    \ for clarity’s sake usually aren’t.\n\nFor example, in your Callbacks program\
    \ from Chapter 24, you added code to register your object for a notification when\
    \ the user’s time zone changes and to set zoneChange: to be triggered when this\
    \ notification is received. But now I’m reading your code and curious about what\
    \ this zoneChange: method does when it is triggered, so I go looking for the implementation\
    \ of this method. In the Callbacks example, the code that registers the object\
    \ for a notification and the implementation of the method that is triggered are\
    \ right next to each other, but you can imagine that in a larger, more complex\
    \ application, these two pieces of code could be hundreds of lines away from each\
    \ other.\n\nMac OS X 10.6 and iOS 4 introduced a new feature called blocks. An\
    \ Objective-C block is just a chunk of code like a C function, but it can be passed\
    \ around as data. We’ll see shortly how this keeps relevant code together.\n\n\
    Blocks and block syntax are definitely an advanced Objective-C topic and can be\
    \ confusing at first. However, Apple’s APIs are using blocks more and more. In\
    \ this chapter, we’ll step through a couple of simple examples so that you’ll\
    \ be ready when you encounter blocks in the wild.\n\nIf you have a background\
    \ in another programming language, you might know blocks as anony- mous functions,\
    \ closures, or lambdas. If you’re familiar with function pointers, blocks may\
    \ appear to be similar, but you’ll soon see that proper use of blocks allows for\
    \ more elegant code than can be written with function pointers.\n\n# ## Defining\
    \ blocks\n\nThis is a block:\n\n```\n^{  \n    NSLog(@\"I’m a log statement within\
    \ a block!\");\n}\n```\n\nThis looks like a function, but it has a caret (^) instead\
    \ of a function name. The caret identifies this bit of code as a block. Also,\
    \ like a function, a block can take arguments:\n\n```\n^(double dividend, double\
    \ divisor) {\n    double quotient = dividend / divisor;\n    return quotient;\n\
    }\n```"
  merge: -1
  img_proc: true
- pgno: 238
  md: "This block takes two doubles as arguments. A block can have a return value\
    \ as well, but we'll come back to that.\n\nDo these blocks have names? Not yet.\
    \ These blocks are values, like the number 5 is a value. To be able to access\
    \ a block by a name, we have to assign it to a *block variable*.\n\n# Using blocks\n\
    \nTo see how this works, we're going to dive right into some code. In this exercise,\
    \ you're going to use a block to remove all of the vowels from each of the strings\
    \ in an array.\n\nCreate a new Foundation Command Line Tool and call it VowelMovement.\
    \ In this program, you will use a block to iterate over an array of strings, transforming\
    \ each one. First, you're going to create three arrays: one to store the original\
    \ strings, one to store the “devowelized” strings, and a third to store the characters\
    \ to strip from the strings. In main.m, replace the code inside of the @autoreleasepool's\
    \ curly braces:\n\n```\nint main (int argc, const char * argv[]) \n{\n    @autoreleasepool\
    \ {\n        \n        // Create the array of strings to devowelize and a container\
    \ for new ones\n        NSArray *oldStrings = [NSArray arrayWithObjects:\n   \
    \                            @\"Sauerkraut\", @\"Raygun\", @\"Big Nerd Ranch\"\
    , @\"Mississippi\", nil];\n        NSLog(@\"Old strings: %@\", oldStrings);\n\
    \        NSMutableArray *newStrings = [NSMutableArray array];\n        \n    \
    \    // Create a list of characters that we'll remove from the string\n      \
    \  NSArray *vowels = [NSArray arrayWithObjects:\n                           @\"\
    a\", @\"e\", @\"i\", @\"o\", @\"u\", nil];\n    }\n    return 0;\n}\n```\n\nNothing\
    \ new here; you're just setting up arrays. Build and run your program. You can\
    \ ignore the warnings about unused variables for now.\n\n# Declaring a block variable\n\
    \nNow comes the code for the block. Although blocks look like functions, they\
    \ can be stored in variables. Like other variables, block variables are declared\
    \ and then assigned values. Add the following code to main.m to declare your block\
    \ variable.\n\n```\nint main (int argc, const char * argv[]) \n{\n    @autoreleasepool\
    \ {\n        \n        // Create the array of strings to devowelize and a container\
    \ for new ones\n        NSArray *oldStrings = [NSArray arrayWithObjects:\n   \
    \                            @\"Sauerkraut\", @\"Raygun\", @\"Big Nerd Ranch\"\
    , @\"Mississippi\", nil];\n        NSLog(@\"Old strings: %@\", oldStrings);\n\
    \        NSMutableArray *newStrings = [NSMutableArray array];\n```"
  merge: -1
  img_proc: true
- pgno: 239
  md: "```\n// Create a list of characters that we'll remove from the string\nNSArray\
    \ *vowels = [NSArray arrayWithObjects:\n@\"a\", @\"e\", @\"i\", @\"o\", @\"u\"\
    , nil];\n\n// Declare the block variable\nvoid (^devowelizer)(id, NSUInteger,\
    \ BOOL *);\n}\nreturn 0;\n}\n```\n\nLet's break down this declaration to see what's\
    \ going on.\n\n# Figure 32.1  Block variable declaration\n\n![](img/5f9368899ebf8d92fc145f8def1e89f8_239_0.png)\n\
    \nWhen declaring a primitive variable, you give its type and then its name, like\
    \ int i. For a block variable, however, the name is in the middle of the declaration\
    \ right after the caret. The type of the block variable is dependent on how the\
    \ block is constructed. In this case, devowelizer's type is “a block that takes\
    \ an object, an integer, and a BOOL pointer, and returns nothing.”\n\n# Assigning\
    \ a block\n\nNow let's assign a value to our new variable. For a block variable,\
    \ the value is always a set of instructions inside curly braces. In main.m, add\
    \ the following assignment:\n\n```\nint main (int argc, const char * argv[])\n\
    {\n    @autoreleasepool {\n        // Create the array of strings to devowelize\
    \ and a container for new ones\n        NSArray *oldStrings = [NSArray arrayWithObjects:\n\
    \        @\"Sauerkraut\", @\"Raygun\", @\"Big Nerd Ranch\", @\"Mississippi\",\
    \ nil];\n        NSLog(@\"old strings: %@\", oldStrings);\n        NSMutableArray\
    \ *newStrings = [NSMutableArray array];\n        \n        // Create a list of\
    \ characters that we'll remove from the string\n        NSArray *vowels = [NSArray\
    \ arrayWithObjects:\n        @\"a\", @\"e\", @\"i\", @\"o\", @\"u\", nil];\n \
    \       \n        // Declare the block variable\n        void (^devowelizer)(id,\
    \ NSUInteger, BOOL *);\n\n```"
  merge: -1
  img_proc: true
- pgno: 240
  md: "```\n```\n// Assign a block to the variable\ndevowelizer = ^(id string, NSUInteger\
    \ i, BOOL *stop) {\n\n    NSMutableString *newString = [NSMutableString stringWithString:string];\n\
    \n    // Iterate over the array of vowels, replacing occurrences of each\n   \
    \ // with an empty string.\n    for (NSString *s in vowels) {\n        NSRange\
    \ fullRange = NSMakeRange(0, [newString length]);\n        [newString replaceOccurrencesOfString:s\n\
    \                                       withString:@\"\"\n                   \
    \                      options:NSCaseInsensitiveSearch\n                     \
    \                      range:fullRange];\n    }\n\n    [newStrings addObject:newString];\n\
    }; // End of block assignment\n}\nreturn 0;\n}\n```\n```\n\nBuild your program\
    \ again to check your typing. The warnings about unused variables should disappear.\
    \ Now you’ve composed a block – a set of instructions – and assigned the block\
    \ to the block variable devowelizer. Notice that the block assignment ends with\
    \ a semi-colon just like any variable assignment would.\n\nAs with any variable,\
    \ you can perform the declaration and assignment of devowelizer together:\n\n\
    ```\n```\nvoid (^devowelizer)(id, NSUInteger, BOOL *) = ^(id string, NSUInteger\
    \ i, BOOL *stop) {\n\n    NSMutableString *newString = [NSMutableString stringWithString:string];\n\
    \n    // Iterate over the array of vowels, replacing occurrences of each\n   \
    \ // with an empty string.\n    for (NSString *s in vowels) {\n        NSRange\
    \ fullRange = NSMakeRange(0, [newString length]);\n        [newString replaceOccurrencesOfString:s\n\
    \                                       withString:@\"\"\n                   \
    \                      options:NSCaseInsensitiveSearch\n                     \
    \                      range:fullRange];\n    }\n\n    [newStrings addObject:newString];\n\
    };\n```\n```\n\nJust like before, here we declare a block variable that takes\
    \ three arguments, returns nothing, and is called devowelizer. Then we compose\
    \ an actual block and store it in devowelizer.\n\n# ### Passing in a block\n\n\
    Because devowelizer is a variable, you can pass it as an argument. **NSArray**\
    \ has a method called **enumerateObjectsUsingBlock:**. This method expects a block\
    \ as its sole argument. It will execute that block once for each object in the\
    \ array.\n\nIn main.m, add the following code to call **enumerateObjectsUsingBlock:**\
    \ with devowelizer and then print out the devoweIized strings."
