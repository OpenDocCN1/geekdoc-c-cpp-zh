    Discussing the frames and the stack is usually not covered in a beginning programming
    course, but I''ve found the ideas to be exceedingly useful to new programmers.
    First, it gives you a more concrete understanding of the answers to questions
    like "What happens to my local variables when the function finishes executing?"
    Second, it helps you understand what the *debugger*. The debugger is a program
    that helps you understand what your program is actually doing, which, in turn,
    helps you find and fix "bugs" (problems in your code). When you build and run
    a program in *Xcode*, the debugger is *attached* to the program so that you can
    use it.


    # Looking at the frames in the debugger


    You can use the debugger to browse the frames on the stack. To do this, however,
    you have to stop your program in mid-execution. Otherwise, **main()** will finish
    executing, and there won''t be any frames left'
