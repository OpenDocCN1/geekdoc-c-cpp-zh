  md: "```\n#include <stdio.h>\nint main (int argc, const char * argv [])\n{\n   \
    \ printf(\"3 \\* 3 \\+ 5 \\* 2 = %d\\n\", 3 \\* 3 \\+ 5 \\* 2);\n    printf(\"\
    11 / 3 = %d remainder of %d \\n\", 11 / 3, 11 % 3);\n    return 0;\n}\n```\n\n\
    What if you *want* to get 3.666667? You convert the int to a float using the *cast\
    \ operator*. The cast operator is the type that you want placed in parentheses\
    \ to the left of the variable you want converted. Cast your denominator as a float\
    \ before you do the division:\n\n```\nint main (int argc, const char * argv [])\n\
    {\n    printf(\"3 \\* 3 \\+ 5 \\* 2 = %d\\n\", 3 \\* 3 \\+ 5 \\* 2);\n    printf(\"\
    11 / 3 = %d remainder of %d \\n\", 11 / 3, 11 % 3);\n    printf(\"11 / 3.0 = %f\\\
    n\", 11 / (float)3);\n    return 0;\n}\n```\n\nNow, floating point division will\
    \ be done instead of integer division, and you’ll get 3.666667. Here’s the rule\
    \ for integer vs. floating-point division: */* is integer division only if both\
    \ the numerator and denominator are integer types. If either is a floating-point\
    \ number, floating-point division is done instead.\n\n# Operator shorthand\n\n\
    All the operators that you’ve seen so far yield a new result. So, for example,\
    \ to increase x by 1, you would use the + operator and then assign the result\
    \ back into x:\n\n```\nint x = 5;\nx = x + 1; // x is now 6\n```\n\nC programmers\
    \ do these sorts of operations so often that operators were created that change\
    \ the value of the variable without an assignment. For example, you can increase\
    \ the value held in x by 1 with the *increment operator* (++):\n\n```\nint x =\
    \ 5;\nx++; // x is now 6\n```\n\nThere is also a *decrement operator* (- -) that\
    \ decreases the value by 1:\n\n```\nint x = 5;\nx--; // x is now 4\n```\n\nWhat\
    \ if you want to increase x by 5 instead of just 1? You could use addition and\
    \ assignment:\n\n```\nint x = 5;\nx = x + 5; // x is 10\n```\n\nBut there is a\
    \ shorthand for this, too:"
