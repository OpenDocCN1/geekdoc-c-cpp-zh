    The blue indicator shows that you’ve set a *breakpoint*. A breakpoint is a location
    in code where you want the debugger to pause the execution of your program. Run
    the program again. It will start and then stop right before it executes the line
    where you set the breakpoint.


    Now your program is temporarily frozen in time, and you can examine it more closely.
    In the navigator area, click the ≡ icon to open the *debug navigator*. This navigator
    shows all the frames currently on the stack, also called a *stack trace*.


    In the stack trace, frames are identified by the name of their function. Given
    your program consists almost entirely of a recursive function, these frames have
    the same name and you must distinguish them by the value of *oneFewer* that gets
    passed to them. At the bottom of the stack, you will, of course, find the frame
    for **main()**.


    You can select a frame to see the variables in that frame and the source code
    for the line of code that is currently being executed. Select the frame for the
    first time **singTheSong** is called.'
