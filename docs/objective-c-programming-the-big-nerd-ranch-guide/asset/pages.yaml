  md: "# # 23\n# Writing Files with NSString and NSData\n\nThe Foundation framework\
    \ gives the developer a few easy ways to read from and write to files. In this\
    \ chapter, you'll try a few of them out.\n\n# ## Writing an NSString to a file\n\
    \nFirst, let's see how you would take the contents of an **NSString** and put\
    \ it into a file. When you write a string to a file, you need to specify which\
    \ *string encoding* you are using. A string encoding describes how each character\
    \ is stored as an array of bytes. ASCII is a string encoding that defines the\
    \ letter 'A' as being stored as 01000001. In UTF-16, the letter 'A' is stored\
    \ as 0000000001000001.\n\nThe Foundation framework supports about 20 different\
    \ string encodings. UTF can handle an incredible collection of writing systems.\
    \ It comes in two flavors: UTF-16, which uses two or more bytes for every character,\
    \ and UTF-8, which uses one byte for the first 128 ASCII characters and two or\
    \ more for other characters. For most purposes, UTF-8 is a good fit.\n\nCreate\
    \ a new project: a Foundation Command Line Tool called Stringz. In **main()**,\
    \ use methods from the **NSString** class to create a string and write it to the\
    \ filesystem:\n\n```\n```\n#import <Foundation/Foundation.h>\n\nint main (int\
    \ argc, const char * argv[])     {\n    @autoreleasepool {\n        NSMutableString\
    \ *str = [[NSMutableString alloc] init];\n        for (int i = 0; i < 10; i++)\
    \ {\n            [str appendString:@\"Aaron is cool!\\n\"];\n        }\n     \
    \   [str writeToFile:@\"/tmp/cool.txt\"\n              atomically:YES\n      \
    \         encoding:NSUTF8StringEncoding\n                  error:NULL];\n    \
    \    NSLog(@\"done writing /tmp/cool.txt\");\n    }\n    return 0;\n}\n```\n```\n\
    \nThis program will create a text file that you can read and edit in any text\
    \ editor. The string /tmp/cool.txt is known as the file path. File paths can be\
    \ absolute or relative: absolute paths start"
  merge: -1
  img_proc: true
