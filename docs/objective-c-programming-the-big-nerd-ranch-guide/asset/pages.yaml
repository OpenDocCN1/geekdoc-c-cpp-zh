  md: "# 31\n\n# Categories\n\nCategories let a programmer add methods to any existing\
    \ class. For example, Apple gave us the class *NSString*. We don’t get the source\
    \ code to that class, but categories give us the ability to add new methods to\
    \ *NSString*.\n\nCreate a new Foundation Command Line Tool called VowelCounter.\
    \ Then create a new file that is an Objective-C category. Name the category VowelCounting\
    \ and make it a category on NSString.\n\nNow open NSString+VowelCounting.h and\
    \ declare a method that you want to add to the **NSString** class:\n\n```\n#import\
    \ <Foundation/Foundation.h>\n@interface NSString (VowelCounting)\n- (int)vowelCount;\n\
    @end\n```\n\nNow implement the method in NSSring+VowelCount.m:\n\n```\n#import\
    \ \"NSString+VowelCounting.h\"\n@implementation NSString (VowelCounting)\n\n-\
    \ (int)vowelCount\n{\n    NSCharacterSet *charSet =\n    [NSCharacterSet characterSetWithCharactersInString:@\"\
    aeiouyAEIOUY\"];\n\n    NSUInteger count = [self length];\n    int sum = 0;\n\
    \    for (int i = 0; i < count; i++) {\n        unichar c = [self characterAtIndex:i];\n\
    \        if ([charSet characterIsMember:c]) {\n            sum++;\n        }\n\
    \    }\n    return sum;\n}\n\n@end\n```\n\nNow use the new method in main.m:"
  merge: -1
  img_proc: true
