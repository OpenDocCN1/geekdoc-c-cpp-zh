- pgno: 224
  md: "# Figure 29.3  Initializer chain\n\n![](img/5f9368899ebf8d92fc145f8def1e89f8_224_0.png)\n\
    \nNotice that Figure 29.3 shows one shaded initializer for each class. This initializer\
    \ is the designated *initializer* for that class. **init** is the designated initializer\
    \ for **NSObject**. **initWithProductName:** is the designated initializer for\
    \ **Appliance**, and **initWithProductName: firstOwnerName:** is the designated\
    \ initializer for **OwnedAppliance**. A class has only one designated initializer\
    \ method. If the class has other initializers, then the implementation of those\
    \ initializers must call (directly or indirectly) the designated initializer.\
    \ Thus, the designated initializer acts as a funnel-point.\n\nWhen you create\
    \ a class whose designated initializer has a different name than its superclass's\
    \ designated initializer (as you did in **Appliance** and **OwnedAppliance**),\
    \ you have a responsibility to document that in the header file. Add the appropriate\
    \ comment in **Appliance.h**:\n\n```\n#import <Foundation/Foundation.h>\n\n@interface\
    \ Appliance : NSObject {\n    NSString *productName;\n    int voltage;\n}\n@property\
    \ (copy) NSString *productName;\n@property int voltage;\n\n// The designated initializer\n\
    - (id)initWithProductName:(NSString *)pn;\n\n@end\n```\n\nand in **OwnedAppliance.h**:\n\
    \n```\n#import \"Appliance.h\"\n\n@interface OwnedAppliance : Appliance {\n  \
    \  NSMutableSet *ownerNames;\n}\n// The designated initializer\n- (id)initWithProductName:(NSString\
    \ *)pn\n              firstOwnerName:(NSString *)n;\n- (void)addOwnerNamesObject:(NSString\
    \ *)n;\n- (void)removeOwnerNamesObject:(NSString *)n;\n\n@end\n```"
  merge: -1
  img_proc: true
- pgno: 225
  md: "Thus, we arrive at the rules that all stylish Objective-C programmers follow\
    \ when writing initializers:\n\n+   If a class has several initializers, only\
    \ one should do the real work. That method is known as the designated initializer.\
    \ All other initializers should call, either directly or indirectly, the designated\
    \ initializer.\n\n+   The designated initializer will call the superclass's designated\
    \ initializer before initializing its instance variables.\n\n+   If the designated\
    \ initializer of your class has a different name than the designated initializer\
    \ of its superclass, you must override the superclass's designated initializer\
    \ so that it calls the new designated initializer.\n\n+   If you have several\
    \ initializers, clearly document which is the designated initializer in the header.\n\
    \n# # Deadly init methods\n\nEvery once in a while, however, you can't safely\
    \ override the superclass's designated initializer. Let's say that you are creating\
    \ a subclass of `NSObject` called `WallSafe`, and its designated initializer is\
    \ `initWithSecretCode:`. However, having a default value for `secretCode` is not\
    \ secure enough for your application. This means that the pattern we have been\
    \ using – overriding `init` to call the new class's designated initializer with\
    \ default values – is not acceptable.\n\nSo what do you do? An instance of `WallSafe`\
    \ will still respond to an `init` message. Someone could easily do this:\n\n```\n\
    ```objective-c\nWallSafe *ws = [[WallSafe alloc] init];\n```\n```\n\nThe best\
    \ thing to do is to override the superclass's designated initializer in a way\
    \ that lets developers know that they have made a mistake and tells them how to\
    \ fix it:\n\n```\n```objective-c\n- (id)init\n{\n    @throw [NSException exceptionWithName:@\"\
    WallSafeInitialization\"\n                                   reason:@\"Use initWithSecretCode:,\
    \ not init\"\n                                 userInfo:nil];\n}\n```\n```"
  merge: -1
  img_proc: true
