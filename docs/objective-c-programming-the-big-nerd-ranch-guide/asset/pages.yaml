- pgno: 285
  md: '# **ON-SITE TRAINING**


    ![](img/5f9368899ebf8d92fc145f8def1e89f8_285_0.png)


    ![](img/5f9368899ebf8d92fc145f8def1e89f8_285_1.png)


    # ## OUR NERDS, YOUR LOCATION


    Through our on-site training program you can affordably and conveniently have
    our renowned classes come to you. Our expert instructors will help your team advance
    through nerd-based instructional support that is fresh, engaging and allows for
    unencumbered hands-on learning.


    Clients around the globe have praised our on-site instruction for some of the
    following reasons:


    # ### Flexibility


    +   - *Classes can be booked when the timing is right for your team.*

    - *We can tailor our existing syllabi to ensure our training meets your organization''s
    unique needs.*

    - *Post-class mentorship is available to support your team as they work on especially
    challenging projects.*


    # ### Affordability


    +   - *No need for planes, trains and automobiles for all of your staff; our Nerds
