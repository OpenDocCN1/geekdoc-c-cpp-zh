  md: "# Chapter 32 Blocks\n\n```\n2011-09-03 10:27:02.618 VowelMovement[787:707]\
    \ new strings: (\n    Srkrt,\n    Rygn,\n    \"Bg Nrd Rnch\",\n    Msssspp\n)\n\
    ```\n\nIt’s important to note that `enumerateObjectsUsingBlock:` won’t accept\
    \ just any block as its argument. This method requires “a block that takes an\
    \ object, an integer, and a BOOL pointer and returns nothing.” That’s why we constructed\
    \ the block that we assigned to devowelizer as we did. Its three arguments are\
    \ specifically designed for going through an array.\n\nThe first argument is a\
    \ pointer to the current object. Notice that this pointer’s type is id so that\
    \ it will work no matter what kind of objects the array contains. The second argument\
    \ is an `NSUInteger` that is the index of the current object. The third object\
    \ is a pointer to a **BOOL**, which defaults to NO. We can change it to YES if\
    \ we want the array to stop after the current iteration.\n\nAdd a check at the\
    \ beginning of the block assignment:\n\n```\ndevowelizer = ^(id string, NSUInteger\
    \ i, BOOL *stop){\n    NSRange yRange = [string rangeOfString:@\"y\"\n       \
    \             options:NSCaseInsensitiveSearch];\n\n    // Did I find a y?\n  \
    \  if (yRange.location != NSNotFound) {\n        *stop = YES; // Prevent further\
    \ iterations\n        return;     // Stop this iteration\n    }\n\n    NSMutableString\
    \ *newString = [NSMutableString stringWithString:string];\n\n    // Iterate over\
    \ the array of vowels, replacing occurrences of each\n    // with an empty string.\n\
    \    for (NSString *s in vowels) {\n        NSRange fullRange = NSMakeRange(0,\
    \ [newString length]);\n        [newString replaceOccurrencesOfString:s\n    \
    \                               withString:@\"\"\n                           \
    \           options:NSCaseInsensitiveSearch\n                                \
    \        range:fullRange];\n    }\n\n    [newStrings addObject:newString];\n};\
    \ // End of block assignment\n```\n\nThis will check to see if the string for\
    \ the current iteration contains an uppercase or lowercase ‘y’ character. If it\
    \ does, the pointer is set to YES (which will prevent the block from performing\
    \ any more iterations) and then the current iteration is halted.\n\nBuild and\
    \ run the program. Again, two arrays are logged to the debugger output, but this\
    \ time, the array enumeration was cancelled during the second iteration when the\
    \ block encountered a word with the letter ‘y’ in it. All you get is Srkrt.\n\n\
    Now that you’ve had some practice with blocks, let’s return to how blocks help\
    \ solve the problem of far-flung code bits in your programs. When you use a callback,\
    \ such as in Chapter 24 where you had this line of code:"
