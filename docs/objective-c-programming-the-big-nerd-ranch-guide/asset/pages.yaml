  md: '# ## 2


    # # Your First Program


    Now that we know how this book is organized, it''s time to see how programming
    for the Mac and for iPhone and iPad works. To do that, you will


    +   - install Apple''s Developer Tools


    +   - create a simple project using those tools


    +   - explore how these tools are used to make sure our project works


    At the end of this chapter, you will have successfully written your first program
    for the Mac.


    # ## Installing Apple''s developer tools


    To write applications for Mac OS X (the Macintosh) or iOS (the iPhone and iPad),
    you will be using Apple''s developer tools. You can download these tools from
    `http://developer.apple.com/` or purchase them from the Mac App Store.


    After you''ve installed the tools, find the `/Developer` folder at the root level
    of your hard drive. This folder contains what you need to develop applications
    for Mac OS X desktops and iOS mobile devices.


    Our work in this book is going to be conducted almost entirely with one application
    – **Xcode**, which is found in the `/Developer/Applications` folder. (It is a
    good idea to drag the **Xcode** icon over to the dock; you''ll be using it an
    awful lot.)


    # ## Getting started with Xcode


    **Xcode** is Apple''s *Integrated Development Environment*. That means that everything
    you need to write, build, and run new applications is in **Xcode**.


    A note on terminology: anything that is executable on a computer we call a *program*.
    Some programs have graphical user interfaces; we will call these *applications*.


    Some programs have no graphical user interface and run for days in the background;
    we call these *daemons*. Daemons sound scary, but they aren''t. You probably have
    about 60 daemons running on your Mac right now. They are waiting around, hoping
    to be useful. For example, one of the daemons running on your system is called
    *pboard*. When you do a copy and paste, the *pboard* daemon holds onto the data
    that you are copying.'
