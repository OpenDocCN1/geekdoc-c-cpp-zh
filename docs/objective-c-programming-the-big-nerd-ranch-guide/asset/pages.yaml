    ![](img/5f9368899ebf8d92fc145f8def1e89f8_86_0.png)


    Files containing Objective-C code are typically given the suffix .m. Find and
    open main.m and type in these two lines of code:


    ```

    #import <Foundation/Foundation.h>


    int main (int argc, const char * argv[]) {

    @autoreleasepool {

    NSDate *now = [NSDate date];

    NSLog(@"The new date lives at %p", now);

    }

    return 0;

    }

    ```


    Voilà! Your first message send. You sent the message date to the NSDate class.
    The date method asks the NSDate class to create an instance of NSDate, initialize
    it to the current date/time, and return the address where the new object starts.
    You then stored the returned address in the variable now. This variable is a pointer
    to an NSDate object.


    NSLog() is an Objective-C function not unlike printf(); it takes a format string,
    replaces % tokens with actual values, and writes the result to the console. However,
    its format string always begins with an @, and it does not require a \n at the
    end.


    Build and run the program. You should see something like:


    2011-08-05 11:53:54.366 TimeAfterTime[4862:707] The new date lives at 0x001114dc0


    Unlike printf(), NSLog() prefices its output with the date, time, program name,
    and process ID. From now on when I show output from NSLog(), I’ll skip this data
    – the page is just too narrow.


    In NSLog(), %p printed out the location of the object. To print out something
    more date-like, you can use %@, which asks the object to describe itself as a
    string:'
