    \ the delegate gets informed that the fetch is complete.\n\nHere are the rules,\
    \ so far, for callbacks: When sending one callback to one object, Apple uses target-action.\
    \ When sending an assortment of callbacks to one object, Apple uses a helper object\
    \ with a protocol. (We'll talk more about protocols in the next chapter.) These\
    \ helper objects are typically called delegate or data source.\n\nWhat if the\
    \ callback needs to go to multiple objects?\n\n# ## Notifications\n\nWhen the\
    \ user changes the time zone on a Mac, many objects in your program might want\
    \ to know that the change has occurred. Each one of them can register as an observer\
    \ with the notification center. When the time zone is changed, the notification\
    \ `NSSystemTimeZoneDidChangeNotification` will be posted to the center, and the\
