- pgno: 219
  md: "+   * The **init** method figures out a clever optimization that it can do,\
    \ deallocates the original object, allocates a different object, and returns the\
    \ new object.\n\n+   * The **init** method fails, deallocates the object, and\
    \ returns `nil`.\n\nTo deal with the first case, Apple requires that you set `self`\
    \ to point to the object returned from the superclass's **init** method. You did\
    \ this in the first line of your **init** method.\n\nTo deal with the second case,\
    \ Apple recommends that you check that your superclass's initializer returns a\
    \ valid object and not `nil`. After all, there's no point in performing custom\
    \ set-up on an object that doesn't exist. Change your **init** method to match\
    \ Apple's recommendation:\n\n```\n```objective-c\n- (id)init\n{\n    // Call NSObject's\
    \ init method\n    self = [super init];\n\n    // Did it return something non-nil?\n\
    \    if (self) {\n        // Give voltage a starting value\n        voltage =\
    \ 120;\n    }\n    return self;\n}\n```\n```\n\nTruthfully, these sorts of checks\
    \ are only necessary in a couple of very specific cases. Thus, in practice, many\
    \ Objective-C programmers often skip the extra checks. In this book, however,\
    \ we will always do the checks because it is the Apple-approved way to implement\
    \ **init** methods.\n\n# ## Using accessors\n\nSo far you have a perfectly good\
    \ **init** method for `Appliance`, but I want to show you a variation that you\
    \ will see in other people's code. I typically do a plain assignment in an **init**\
    \ method, but many programmers will use the accessor method. Change your **init**\
    \ method to do this:\n\n```\n```objective-c\n- (id)init\n{\n    // Call NSObject's\
    \ init method\n    self = [super init];\n\n    // Did it return something non-nil?\n\
    \    if (self) {\n        // Give voltage a starting value\n        [self setVoltage:120];\n\
    \    }\n    return self;\n}\n```\n```\n\nIn most cases, there is little reason\
    \ to do one over the other, but it makes for a great argument. The argument goes\
    \ like this: The assign guy says, \"You can't use an accessor method in an **init**\
    \ method! The accessor assumes that the object is ready for work, and it isn't\
    \ ready for work until *after* the **init** method is complete.\" Then the accessor\
    \ method guy says, \"Oh, come on. In the real world that"
