  md: "# # 21\n# Collection Classes\n\nYou have already used two collection classes:\
    \ **NSArray** and its subclass **NSMutableArray**. As you know, an array holds\
    \ a collection of pointers to other objects. The pointers are ordered, so you\
    \ use an index (an integer) to access the objects in the collection. In this chapter,\
    \ we will delve deeper into arrays and look at some other collection classes:\
    \ **NSSet**/**NSMutableSet** and **NSDictionary**/**NSMutableDictionary**.\n\n\
    # ## NSArray/NSMutableArray\n\nWhen you add an object to an array, the array claims\
    \ ownership of it. When you remove the object from the array, the array gives\
    \ up ownership. Open **BMITime**, and take a look at how you are using the employees\
    \ array. If we ignore all the other stuff, you see something like this:\n\n```\n\
    ```objectivec\n// Create an array of Employee objects\nNSMutableArray *employees\
    \ = [[NSMutableArray alloc] init];\nfor (int i = 0; i < 10; i++) {\n    // Create\
    \ an instance of Employee\n    Employee *person = [[Employee alloc] init];\n \
    \   // Put the employee in the employees array\n    [employees addObject:person];\n\
    }\n[employees removeObjectAtIndex:5];\nemployees = nil;\n```\n```\n\nYou typically\
    \ create an empty mutable array using **alloc/init** or the class method **array**.\
    \ For example, you could have created the mutable array like this:\n\n```\n```objectivec\n\
    NSMutableArray *employees = [NSMutableArray array];\n```\n```\n\nNote that the\
    \ **addObject:** method adds the object to the end of the list. As objects are\
    \ added, an array will grow as big as necessary to hold them.\n\n# ## Immutable\
    \ objects\n\nWhen you create an instance of **NSArray**, you assign all its objects\
    \ to it when it is created. This typically looks like this:\n\n```\n```objectivec\n\
    NSArray *colors = [NSArray arrayWithObjects:@\"Orange\", @\"Yellow\", @\"Green\"\
    , nil];\n```\n```"
