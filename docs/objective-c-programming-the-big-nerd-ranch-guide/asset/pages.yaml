    \ {\n    BlenderSpeedStir = 1,\n    BlenderSpeedChop = 2,\n    BlenderSpeedLiquify\
    \ = 5,\n    BlenderSpeedPulse = 9,\n    BlenderSpeedIceCrush = 15\n};\n\n@interface\
    \ Blender : NSObject\n{\n    // speed must be one of the five speeds\n    enum\
    \ BlenderSpeed speed;\n}\n\n// setSpeed: expects one of the five speeds\n- (void)setSpeed:(enum\
    \ BlenderSpeed)x;\n@end\n```\n```\n\nDevelopers get tired of typing `enum BlenderSpeed`,\
    \ so they often use `typedef` to create a shorthand for it:"
