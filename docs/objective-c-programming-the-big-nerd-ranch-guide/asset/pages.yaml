    \ x is ff.\n\n(We’ll return to hexadecimal numbers in Chapter 33.)\n\nWhat if\
    \ the integer has lots of bits? You slip an l (for long) or an ll (for long long)\
    \ between the % and the format character. Change your program to use a long instead\
    \ of an int:\n\n```\n```c\n#include <stdio.h>\nint main (int argc, const char\
    \ * argv[])\n{\n    long x = 255;\n    printf(\"x is %ld.\\n\", x);\n    printf(\"\
    In octal, x is %lo.\\n\", x);\n    printf(\"In hexadecimal, x is %lx.\\n\", x);\n\
