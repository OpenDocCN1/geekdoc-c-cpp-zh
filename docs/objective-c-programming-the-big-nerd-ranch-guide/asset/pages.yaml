  md: "# 37\n# Switch Statements\n\nIt is not uncommon to check a variable for a set\
    \ of values. Using *if*-*else* statements, it would look like this:\n\n```\nint\
    \ yeastType = . . . ;\n\nif (yeastType == 1) {\n\tmakeBread();\n} else if (yeastType\
    \ == 2) {\n\tmakeBeer();\n} else if (yeastType == 3) {\n\tmakeWine();\n} else\
    \ {\n\tmakeFuel();\n}\n```\n\nTo make this sort of thing easier, C has the *switch*\
    \ statement. The code above could be changed to this:\n\n```\nint yeastType =\
    \ . . . ;\n\nswitch (yeastType) {\n\tcase 1:\n\t\tmakeBread();\n\t\tbreak;\n\t\
    case 2:\n\t\tmakeBeer();\n\t\tbreak;\n\tcase 3:\n\t\tmakeWine();\n\t\tbreak;\n\
    \tdefault:\n\t\tmakeFuel();\n\t\tbreak;\n}\n```\n\nNotice the *break* statements.\
    \ Without the *break*, after executing appropriate case clause, the system would\
    \ execute all the subsequent case clauses. For example, if I had this:\n\n```\n\
    int yeastType = 2;\n\nswitch (yeastType) {\n\tcase 1:\n\tcase 2:\n\t\tmakeBeer();\n\
    ```"
