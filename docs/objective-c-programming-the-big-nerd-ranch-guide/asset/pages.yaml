  md: 'This is done with the \^ operator. Add to main.c:


    ```

      unsigned char e = a ^ b;

      printf("Hex: %x ^ %x = %x\n", a, b, e);

      printf("Decimal: %d ^ %d = %d\n", a, b, e);

