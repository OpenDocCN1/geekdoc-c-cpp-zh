- pgno: 25
  md: 'Betty Crocker’s cooking instructions are in English. In the first part of this
    book, your functions will be written in the C programming language. However, a
    computer processor expects its instructions in machine code. How do we get there?


    When you write a program in C (which is relatively pleasant for you), *the compiler*
    converts your program’s functions into machine code (which is pleasant and efficient
    for the processor). The compiler is itself a program that is run by *Xcode* when
    you press the *Run* button. Compiling a program is the same as building a program,
    and we’ll use these terms interchangeably.


    When you run a program, the compiled functions are copied from the hard drive
    into memory, and the function called **main** is executed by the processor. The
    **main** function usually calls other functions. For example, your **main** function
    called the **printf** function. (We’ll see more about how functions interact in
    Chapter 5.)


    # ## Don’t stop


    At this point, you’ve probably dealt with several frustrations: installation problems,
    typos, and lots of new vocabulary. And maybe nothing you’ve done so far makes
    any sense. That is completely normal. As I write this, my son Otto is six. Otto
    is baffled several times a day. He is constantly trying to absorb knowledge that
    doesn’t fit into his existing mental scaffolding. Bafflement happens so frequently,
    that it doesn’t really bother him. He never stops to wonder, “Why is this so confusing?
    Should I throw this book away?”


    As we get older, we are baffled much less often – not because we know everything,
    but because we tend to steer away from things that leave us bewildered. For example,
    reading a book on history is quite pleasant because we get nuggets of knowledge
    that we can hang from our existing mental scaffolding. This is easy learning.


    Learning a new language is an example of difficult learning. You know that there
    are millions of people who work in that language effortlessly, but it seems incredibly
    strange and awkward in your mouth. And when people speak it to you, you are often
    flummoxed.


    Learning to program a computer is also difficult learning. You will be baffled
    from time to time – especially here at the beginning. This is fine. In fact, it’s
    kind of cool. It is a little like being six again. Stick with this book; I promise
    that the bewilderment will cease before you get to the final page.'
