  md: "```\n\t[[NSNotificationCenter defaultCenter]\n\t addObserver:logger\n\t selector:@selector(zoneChange:)\n\
    \t name:NSSystemTimeZoneDidChangeNotification\n\t object:nil];\n```\n\nyou identify\
    \ a method (typically using @selector()), and then you implement that method somewhere\
    \ else in the file:\n\n```\n- (void)zoneChange:(NSNotification *)note\n{\nNSLog(@\"\
    The system time zone has changed!\");\n}\n```\n\nYou could use the NSNotificationCenter\
    \ method addObserverForName:object:queue:usingBlock: and pass a block instead.\
    \ With this method, you hand the NSNotificationCenter the instructions right then,\
    \ so you don’t have to put the code for the callback somewhere else. Anyone reading\
    \ your code will see the instructions and the message send to the NSNotificationCenter\
    \ in the same chunk of code. (You’ll get to make exactly this change to your Callbacks\
    \ program in a challenge at the end of the chapter.)\n\n# ## typedef\n\nBlock\
    \ syntax can be confusing, but you can make it friendlier using the typedef keyword\
    \ that you learned about in Chapter 10. Remember that typedefs belong at the top\
    \ of the file or in a header, outside of any method implementations. In main.m,\
    \ add the following line of code:\n\n```\n#import <Foundation/Foundation.h>\n\
    ```\n\n```\ntypedef void (^ArrayEnumerationBlock)(id, NSUInteger, BOOL *);\nint\
    \ main (int argc, const char * argv[])\n{\n```\n\nNotice that this looks identical\
    \ to a block variable declaration. However, here we are defining a type rather\
    \ than a variable, so we put an appropriate type name next to the caret. This\
    \ allows us to simplify declarations of similar blocks. Instead of declaring devowelizer\
    \ this way\n\n```\nvoid (^devowelizer)(id, NSUInteger, BOOL *);\n```\n\nyou can\
    \ replace that line with the following declaration:\n\n```\nArrayEnumerationBlock\
    \ devowelizer;\n```\n\nThis makes your block variable declaration a bit more familiar.\
    \ Note that the block type itself only defines the block’s arguments and return\
    \ types; it has no bearing on the set of instructions within a block of that type.\n\
    \n# ## Return values\n\nFinally, when a block returns a value, you can call its\
    \ block variable like a function.\n\n```\ndouble (^divBlock)(double,double) =\
    \ ^(double k, double j) {\nreturn k/j;\n}\n```"
