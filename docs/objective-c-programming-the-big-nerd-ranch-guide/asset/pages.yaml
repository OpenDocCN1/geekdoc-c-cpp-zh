  md: "# Figure 35.1 Pointers on the stack to a buffer of floats\n\n![](img/5f9368899ebf8d92fc145f8def1e89f8_264_0.png)\n\
    \n**malloc**() allocates a buffer on the heap, so you need to make sure that you\
    \ free it when you are done. Wouldn’t it be great if you could declare that buffer\
    \ as part of the frame (on the stack) so that it would be deallocated automatically\
    \ when the function is done executing? You can. Change **main.c**:\n\n```\n```\n\
    import <stdio.h>\n\nfloat averageFloats(float *data, int dataCount)\n{\n    float\
    \ sum = 0.0;\n    for (int i = 0; i < dataCount; i++) {\n        sum = sum + data[i];\n\
    \    }\n    return sum / dataCount;\n}\n\nint main (int argc, const char * argv[])\
    \ {\n    \n    // Declares the array as part of the frame\n    float gradeBook[3];\n\
    \    \n    gradeBook[0] = 60.2;\n    gradeBook[1] = 94.5;\n    gradeBook[2] =\
    \ 81.1;\n    \n    // Calculate the average\n    float average = averageFloats(gradeBook,\
    \ 3);\n    \n    // No need to free the array!\n    // Cleanup happens automatically\
    \ when the function returns\n    \n    printf(\"Average = %.2f\\n\", average);\n\
    \    \n    return 0;\n}\n```\n```\n\nBuild and run it.\n\nThe string literal made\
    \ it easy to pack an array with characters. There are also array literals. Use\
    \ one to initialize *gradeBook*:"
