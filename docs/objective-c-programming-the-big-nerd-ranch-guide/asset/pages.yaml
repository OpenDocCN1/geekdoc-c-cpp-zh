    When you run it you will see:


    Hex: 3c ^ a9 = 95

    Decimal: 60 ^ 169 = 149


    This operator sometimes causes beginners some confusion. In most spreadsheet programs,
    the \^ operator is exponentiation: 2^3 means 2³. In C, we use the **pow()** function
    for exponentiation:


    ```

    double r = pow(2.0, 3.0); // Calculate 2 raised to the third power

