    \ the wall.\\n\",\n               oneFewer);\n        singTheSong(oneFewer); //\
    \ This function calls itself!\n        printf(\"Put a bottle in the recycling,\
    \ %d empty bottles in the bin.\\n\",\n               numberOfBottles);\n    }\n\
    }\n```\n\n```\nint main(int argc, const char * argv[])\n{\n    singTheSong(99);\n\
    \    return 0;\n}\n```\n\nBuild and run the program. The output looks like this:"
