  md: "```\nint x = 5;\nx += 5; // x is 10\n```\n\nYou can think of the second line\
    \ as “assign x the value of x + 5.” In addition to +=, there is also -=, *=, /=,\
    \ and %=.\n\nTo get the absolute value of an int, you use a function instead of\
    \ an operator. The function is **abs()**. If you want the absolute value of a\
    \ long, use **labs()**. Both functions are declared in stdlib.h:\n\n```\n#include\
    \ <stdio.h>\n#include <stdlib.h>\n\nint main(int argc, const char * argv[])\n\
    {\n    printf(\"3 * 3 + 5 * 2 = %d\\n\", 3 * 3 + 5 * 2);\n    printf(\"11 / 3\
    \ = %d remainder of %d \\n\", 11 / 3, 11 % 3);\n    printf(\"11 / 3.0 = %f\\n\"\
    , 11 / (float)3);\n    printf(\"The absolute value of -5 is %d\\n\", abs(-5));\n\
    \    return 0;\n}\n```\n\n# Floating-point numbers\n\nIf you need a number with\
    \ a decimal point, like 3.2, you use a floating-point number. Most programmers\
    \ think of a floating-point number as a mantissa multiplied by 10 to an integer\
    \ exponent. For example, 345.32 is thought of as 3.4532 x 10². And this is essentially\
    \ how they are stored: a 32-bit floating number has 8 bits dedicated to holding\
    \ the exponent (a signed integer) and 23 bits dedicated to holding the mantissa\
    \ with the remaining 1 bit used to hold the sign.\n\nLike integers, floating-point\
    \ numbers come in several sizes. Unlike integers, floating-point numbers are *always*\
    \ signed:\n\n```\nfloat g;      // 32-bits\ndouble h;    // 64-bits\nlong double\
    \ i; // 128-bits\n```\n\n# Tokens for displaying floating-point numbers\n\n**printf()**\
    \ can also display floating point numbers, most commonly using the tokens %f and\
    \ %e. In main.c, replace the integer-related code:\n\n```\nint main(int argc,\
    \ const char * argv[])\n{\n    double y = 12345.6789;\n    printf(\"y is %f\\\
    n\", y);\n    printf(\"y is %e\\n\", y);\n    return 0;\n}\n```\n\nWhen you build\
    \ and run it, you should see:\n\n```\ny is 12345.678900\ny is 1.234568e+04\n```\n\
    \nSo %f uses normal decimal notation, and %e uses scientific notation."
