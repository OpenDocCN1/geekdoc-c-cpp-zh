- pgno: 37
  md: "# 5\n\nFunctions\n\nBack in Chapter 3, I introduced the idea of a variable:\
    \ a name associated with a chunk of data. A function is a name associated with\
    \ a chunk of code. You can pass information to a function. You can make the function\
    \ execute code. You can make a function return information to you.\n\nFunctions\
    \ are fundamental to programming, so there’s a lot in this chapter – three new\
    \ projects, a new tool, and many new ideas. Let’s get started with an exercise\
    \ that demonstrates what functions are good for.\n\n# When should I use a function?\n\
    \nSuppose you are writing a program to congratulate students for completing a\
    \ Big Nerd Ranch course. Before worrying about retrieving the student list from\
    \ a database or about printing certificates on spiffy Big Nerd Ranch paper, you\
    \ want to experiment with the message that will be printed on the certificates.\n\
    \nTo do that experiment, create a new project: a C Command Line Tool named ClassCertificates.\
    \ Your first thought in writing this program might be:\n\n```\nint main (int argc,\
    \ const char * argv[]) \n{\n    printf(\"Mark has done as much Cocoa Programming\
    \ as I could fit into 5 days\\n\");\n    printf(\"Bo has done as much Objective-C\
    \ Programming as I could fit into 2 days\\n\");\n    printf(\"Mike has done as\
    \ much Python Programming as I could fit into 5 days\\n\");\n    printf(\"Ted\
    \ has done as much 105 Programming as I could fit into 5 days\\n\");\n\n    return\
    \ 0;\n}\n```\n\nDoes the thought of typing all this in bother you? Does it seem\
    \ annoyingly repetitive? If so, you have the makings of an excellent programmer.\
    \ When you find yourself repeating work that is very similar in nature (in this\
    \ case, the words in the `printf` statement), you want to start thinking about\
    \ a function as a better way of accomplishing the same task.\n\n# How do I write\
    \ and use a function?\n\nNow that you’ve realized that you need a function, you\
    \ need to write one. Open `main.c` in your ClassCertificates project and add a\
    \ new function before the `main` function. Name this function `congratulateStudent`."
  merge: -1
  img_proc: true
- pgno: 38
  md: "# # Chapter 5 Functions\n\n```\n#include <stdio.h>\n\nvoid congratulateStudent(char\
    \ *student, char *course, int numDays)\n{\n    printf(\"%s has done as much %s\
    \ Programming as I could fit into %d days.\\n\",\n           student, course,\
    \ numDays);\n}\n```\n\n(Wondering what the %s and %d mean? Hold on for now; we'll\
    \ talk about those in the next chapter.)\n\nNow edit main to use your new function:\n\
    \n```\nint main(int argc, const char *argv[])\n{\n    congratulateStudent(\"Mark\"\
    , \"Cocoa\", 5);\n    congratulateStudent(\"Bo\", \"Objective-C\", 2);\n    congratulateStudent(\"\
    Mike\", \"Python\", 5);\n    congratulateStudent(\"Ted\", \"iOS\", 5);\n\n   \
    \ return 0;\n}\n```\n\nBuild and run the program. You will probably get a *warning*\
    \ marked by an exclamation point inside a small yellow triangle. A warning in\
    \ Xcode will not prevent your program from running; it just draws your attention\
    \ to a possible problem. The text of the warning is to the right of the code.\
    \ This warning says something like `No previous prototype for function 'congratulateStudent'`.\
    \ Ignore this warning for now, and we'll come back to it at the end of this section.\n\
    \nFind your output in the log navigator. It should be identical to what you would\
    \ have seen if you had typed in everything yourself.\n\n```\nMark has done as\
    \ much Cocoa Programming as I could fit into 5 days.\nBo has done as much Objective-C\
    \ Programming as I could fit into 2 days.\nMike has done as much Python Programming\
    \ as I could fit into 5 days.\nTed has done as much iOS Programming as I could\
    \ fit into 5 days.\n```\n\nThink about what you have done here. You noticed a\
    \ repetitive pattern. You took all the shared characteristics of the problem (the\
    \ repetitive text) and moved them into a separate function. That left the differences\
    \ (student name, course name, number of days). You handled those differences by\
    \ adding three *parameters* to the function. Let's look again at the line where\
    \ you name the function.\n\n```\nvoid congratulateStudent(char *student, char\
    \ *course, int numDays)\n```\n\nEach parameter has two parts: the type of data\
    \ the argument represents and the name of the parameter. Parameters are separated\
    \ by commas and placed in parentheses to the right of the name of the function.\n\
    \nWhat about the `void` to the left of our function name? That is the type of\
    \ information returned from the function. When you do not have any information\
    \ to return, you use the keyword `void`. We'll talk more about returning later\
    \ in this chapter.\n\nYou also used, or *called*, your new function in **main**.\
    \ When you called **congratulateStudent**, you passed it values. Values passed\
    \ to a function are known as *arguments*. The argument's value is then assigned\
    \ to the corresponding parameter name. That parameter name can be used inside\
    \ the function as a variable that contains the passed-in value."
