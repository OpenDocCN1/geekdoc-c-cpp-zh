    # # Complement


    If you have a byte, the complement is the byte that is the exact opposite: each
    0 becomes a 1 and each 0 becomes a 1.


    ![](img/5f9368899ebf8d92fc145f8def1e89f8_253_0.png)


    This is done with the ~ operator. Add a few lines to main.c:


    ```

      unsigned char f = ~b;

      printf("Hex: The complement of %x is %x\n", b, f);

      printf("Decimal: The complement of %d is %d\n", b, f);

       return 0;

    }

    ```


    You should see:


    Hex: The complement of a9 is 56

    Decimal: The complement of 169 is 86


    # # Left-shift


    If you left-shift the bits, you take each bit and move it toward the most significant
    bit. The ones that are on the left side of the number are forgotten, and the holes
    created on the right are filled with zeros.'
