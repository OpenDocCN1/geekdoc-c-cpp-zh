  md: "# 35\nC Arrays\n\nIn the last chapter, we worked with C strings, and a C string\
    \ turned out to be a list of characters packed one next to the other in memory.\
    \ C arrays are lists of other data types packed one next to the other in memory.\
    \ Just as with strings, you deal with the list by holding onto the address of\
    \ the first one.\n\nImagine that you wanted to write a program that would calculate\
    \ the average of 3 grades. Create a new C Command Line Tool project and name it\
    \ **gradeInTheShade**.\n\nEdit main.c:\n\n```\n```\n#include <stdio.h>\n#include\
    \ <stdlib.h> // malloc(), free()\n\nfloat averageFloats(float *data, int dataCount)\n\
    {\n    float sum = 0.0;\n    for (int i = 0; i < dataCount; i++) {\n        sum\
    \ = sum + data[i];\n    }\n    return sum / dataCount;\n}\n\nint main( int argc,\
    \ const char * argv[]) \n{\n    // Create an array of floats\n    float *gradeBook\
    \ = malloc(3 * sizeof(float));\n    gradeBook[0] = 60.2;\n    gradeBook[1] = 94.5;\n\
    \    gradeBook[2] = 81.1;\n    \n    // Calculate the average\n    float average\
    \ = averageFloats(gradeBook, 3);\n    \n    // Free the array\n    free(gradeBook);\n\
    \    gradeBook = NULL;\n    \n    printf(\"Average = %.2f\\n\", average);\n  \
    \  \n    return 0;\n}\n```\n```\n\nBuild and run it."
