  md: '# # Acknowledgments


    It is a great honor that I get to work with such amazing people. Several of them
    put a lot of time and energy into making this book great. I’d like to take this
    moment to thank them.


    +   - Mikey Ward wrote several chapters of this book including *Your First iOS
    Application*, *Your First Cocoa Program*, and *Blocks*. If I were a nicer boss,
    I would have put his name on the cover.


