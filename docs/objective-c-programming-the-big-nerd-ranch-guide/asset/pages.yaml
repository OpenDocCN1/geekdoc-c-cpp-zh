    \ that does nothing but wait a number of seconds. In your **main** function, add\
    \ a call to **sleep**.\n\n```\nint main (int argc, const char * argv[]) \n{ \n\
    \    congratulateStudent(\"Mark\", \"Cocoa\", 5); \n    sleep(2); \n    congratulateStudent(\"\
    Bo\", \"Objective-C\", 2); \n    sleep(2); \n    congratulateStudent(\"Mike\"\
    , \"PHP and PostgreSQL\", 5); \n    sleep(2); \n    congratulateStudent(\"Ted\"\
    , \"iOS\", 5); \n \n    return 0; \n}\n```\n\nBuild and run the program. (Ignore\
    \ the warning about an implicit declaration for now.) You should see a 2-second\
    \ pause between each message of congratulations. That’s because the **main** function\
    \ stops running until the **sleep** function is done sleeping.\n\nNotice that\
    \ when you call a function, you use its name and a pair of parentheses for its\
    \ arguments. Thus, when we talk about functions, we usually include a pair of\
    \ empty parentheses. From now on, we will say **main()** when we talk about the\
    \ **main** function.\n\nYour computer came with many functions built-in. Actually,\
    \ that is a little misleading – here is the truth: Before Mac OS X was installed\
