  md: "In this book, we will generally use 0 instead of `EXIT_SUCCESS`.\n\n# # Global\
    \ and static variables\n\nIn this chapter, we talked about local variables that\
    \ only exist while a function is running. There are also variables that can be\
    \ accessed from any function at any time. We call these *global variables*. To\
    \ make a variable global, you declare it outside of a particular function. For\
    \ example, you could add a lastTemperature variable that holds the temperature\
    \ that was converted from Celsius. Add a global variable to the program:\n\n```\n\
    ```c\n#include <stdio.h>\n#include <stdlib.h>\n\n// Declare a global variable\n\
    float lastTemperature;\n\nfloat fahrenheitFromCelsius(float cel)\n{\n    lastTemperature\
    \ = cel;\n    float fahr = cel * 1.8 + 32.0;\n    printf(\"%f Celsius is %f Fahrenheit\\\
    n\", cel, fahr);\n    return fahr;\n}\nint main(int argc, const char * argv[])\n\
    {\n    float freezeInC = 0;\n    float freezeInF = fahrenheitFromCelsius(freezeInC);\n\
    \    printf(\"Water freezes at %f degrees Fahrenheit\\n\", freezeInF);\n    printf(\"\
    The last temperature converted was %f\\n\", lastTemperature);\n    return EXIT_SUCCESS;\n\
    }\n```\n```\n\nAny complex program will involve dozens of files containing different\
    \ functions. Global variables are available to the code in every one of those\
    \ files. Sometimes sharing a variable between different files is what you want.\
    \ But, as you can imagine, having a variable that can be accessed by multiple\
    \ functions can also lead to great confusion. To deal with this, we have *static\
    \ variables*. A static variable is like a global variable in that it is declared\
    \ outside of any function. However, a static variable is only accessible from\
    \ the code in the file where it was declared. So you get the non-local, “exists\
    \ outside of any function” benefit while avoiding the “you touched my variable!”\
    \ issue.\n\nYou can change your global variable to a static variable, but because\
    \ you have only one file, `main.c`, it will have no effect whatsoever.\n\n```\n\
    ```c\n// Declare a static variable\nstatic float lastTemperature;\n```\n```\n\n\
    Both static and global variables can be given an initial value when they are created:\n\
    \n```\n```c\n// Initialize lastTemperature to 50 degrees\nstatic float lastTemperature\
    \ = 50.0;\n```\n```\n\nIf you don’t give them an initial value, they are automatically\
    \ initialized to zero.\n\nIn this chapter, you have learned about functions. When\
    \ we get to Objective-C in Part III, you will hear the word *method* – a method\
    \ is very, very similar to a function."
