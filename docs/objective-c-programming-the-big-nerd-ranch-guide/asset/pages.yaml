  md: '# ## 29

    # init


    In the class *NSObject*, there is a method named **init**. After an object has
    been allocated, you send the **init** message to the new instance so that it can
    initialize its instance variables to usable values. So **alloc** creates the space
    for an object, and **init** makes the object ready to work. Using **init** looks
    like this:


    ```

    NSMutableArray *things = [[NSMutableArray alloc] init];

    ```


    Notice that **init** is an instance method that returns the address of the initialized
    object. It is the *initializer* for *NSObject*. This chapter is about how to write
    initializers.


    # ## Writing init methods


    Create a new project: a Foundation Command Line Tool called Appliance. In this
    program, you are going to create two classes: **Appliance** and **OwnedAppliance**
    (a subclass of **Appliance**). An instance of **Appliance** will have a productName
    and a voltage. An instance of **OwnedAppliance** will also have a set containing
    the names of its owners.


    # **Figure 29.1 Appliance and its subclass, OwnedAppliance**


    ![](img/5f9368899ebf8d92fc145f8def1e89f8_217_0.png)


    Create a new file: an **NSObject** subclass named **Appliance**. In **Appliance.h**,
    create instance variables and property declarations for productName and voltage:'
  merge: -1
  img_proc: true
- pgno: 218
  md: "```\n#import <Foundation/Foundation.h>\n\n@interface Appliance : NSObject {\n\
    \nNSString *productName;\nint voltage;\n}\n\n@property (copy) NSString *productName;\n\
    @property int voltage;\n\n@end\n```\n\n(We’ll talk about the copy property attribute\
    \ in Chapter 30.)\n\nIn Appliance.m, synthesize the properties to create the accessor\
    \ methods for the instance variables:\n\n```\n#import \"Appliance.h\"\n\n@implementation\
    \ Appliance\n\n@synthesize productName, voltage;\n...\n```\n\nYou would create\
    \ an instance of Appliance like this:\n\n```\nAppliance *a = [[Appliance alloc]\
    \ init];\n```\n\nNote that because Appliance doesn’t implement an init method,\
    \ it will execute the init method defined in NSObject. When this happens, all\
    \ the instance variables specific to Appliance are zero-ed out. Thus, the productName\
    \ of a new instance of Appliance will be nil, and voltage will be zero.\n\n# A\
    \ basic init method\n\nIn some cases, an initial value of zero for your instance\
    \ variables may work fine. In others, however, you’ll need instances of your class\
    \ to come into the world with their instance variables initialized to non-zero\
    \ values.\n\nLet’s say that every instance of Appliance should start its life\
    \ with a voltage of 120. In Appliance.m, override NSObject’s init method by adding\
    \ a new implementation of init.\n\n```\n- (id)init\n{\n    // Call the NSObject's\
    \ init method\n    self = [super init];\n\n    // Give voltage a starting value\n\
    \    voltage = 120;\n\n    // Return a pointer to the new object\n    return self;\n\
    }\n```\n\nNow when you create a new instance of Appliance, it will have a voltage\
    \ of 120 by default. (Note that this doesn’t change anything about the accessor\
    \ methods. After the instance is initialized, it can be changed just as before\
    \ using setVoltage:.)\n\nNotice that you called the superclass’s init method,\
    \ which initializes the instance variables declared in the superclass and returns\
    \ a pointer to the initialized object. Most of the time, this works flawlessly.\
    \ However, a few classes have deviant init methods. Here are the two possible\
    \ forms of deviation:"
