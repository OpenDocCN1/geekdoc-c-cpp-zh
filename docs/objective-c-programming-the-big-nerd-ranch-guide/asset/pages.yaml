  md: '# Figure 27.2 Creating a new iOS Application


    ![](img/5f9368899ebf8d92fc145f8def1e89f8_188_0.png)


    Xcode’s project templates exist to make your job easier. They contain boilerplate
    code that can speed up development. However, here we intentionally choose the
    Empty Application template, which is as close to a blank template as you can get.
    Allowing Xcode to generate too much boilerplate code at this point gets in the
    way of your learning how things work.


    In addition, the names of these templates often change with new Xcode releases,
    so don’t worry if the templates you see don’t exactly match Figure 27.2. Look
    for the simplest-sounding template and then make changes to align your code with
    the book’s code. If you have trouble reconciling your code or project templates,
    visit the Big Nerd Ranch forum for this book at forums.bignerdranch.com for help.


    After choosing the Empty Application template, click Next and name this project
    iTahDoodle. The Company Identifier and Bundle Identifier are related to keeping
    each app on the App Store unique. Both are strings in reverse-domain notation.
    Big Nerd Ranch uses com.bignerdranch as its Company Identifier.'
