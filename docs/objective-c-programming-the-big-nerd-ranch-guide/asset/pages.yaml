- pgno: 34
  md: "Table 4.1 Comparison operators\n\n| < | Is the number on the left less than\
    \ the number on the right? |\n| > | Is the number on the left greater than the\
    \ number on the right? |\n| <= | Is the number on the left less than or equal\
    \ to the number on the right? |\n| >= | Is the number on the left greater than\
    \ or equal to the number on the right? |\n| == | Are they equal? |\n| != | Are\
    \ they *not* equal? |\n\nThe == operator deserves an additional note: In programming,\
    \ the == operator is what’s used to check for equality. We use the single = to\
    \ *assign* a value. Many, many bugs have come from programmers using = when they\
    \ meant to use ==. So stop thinking of = as “the equals sign.” From now on, it\
    \ is “the assignment operator.”\n\nSome conditional expressions require logical\
    \ operators. What if you want to know if a number is in a certain range, like\
    \ greater than zero and less than 40,000? To specify a range, you can use the\
    \ logical AND operator (&&):\n\n```\nif ((truckWeight > 0.0) && (truckWeight <\
    \ 40000.0)) {\n    printf(\"Truck weight is within legal range.\\n\");\n}\n```\n\
    \nTable 4.2 shows the three logical operators:\n\nTable 4.2 Logical operators\n\
    \n| && | Logical AND -- true if and only if both are true |\n| || | Logical OR\
    \ -- false if and only if both are false |\n| ! | Logical NOT -- true becomes\
    \ false, false becomes true |\n\n(If you are coming from another language, note\
    \ that there is no logical exclusive OR in Objective-C, so we won’t discuss it\
    \ here.)\n\nThe logical NOT operator (!) negates the expression contained in parentheses\
    \ to its right.\n\n```\n// Is it not in the legal range?\nif (!((truckWeight >\
    \ 0.0) && (truckWeight < 40000.0))) {\n    printf(\"Truck weight is not within\
    \ legal range.\\n\");\n}\n```\n\n# Boolean variables\n\nAs you can see, expressions\
    \ can become quite long and complex. Sometimes it is useful to put the value of\
    \ the expression into a handy, well-named variable.\n\n```\nBOOL isNotLegal =\
    \ !((truckWeight > 0.0) && (truckWeight < 40000.0));\nif (isNotLegal) {\n    printf(\"\
    Truck weight is not within legal range.\\n\");\n}\n```\n\nA variable that can\
    \ be true or false is a *boolean* variable. Historically, C programmers have always\
    \ used an int to hold a boolean value. Objective-C programmers typically use the\
    \ type BOOL for boolean variables, so that’s what we use here. (BOOL is just an\
    \ alias for an integer type.)"
  merge: -1
  img_proc: true
- pgno: 35
  md: "A variable that can be true or false is a *boolean* variable. Historically,\
    \ C programmers have always used an `int` to hold a boolean value. Objective-C\
    \ programmers typically use the type `BOOL` for boolean variables, so that’s what\
    \ we use here. (`BOOL` is just an alias for an integer type.) To use `BOOL` in\
    \ a C function, you will need to include the appropriate header:\n\n```\n#include\
    \ <objc/objc.h>\n```\n\nA syntax note: if the code that follows the conditional\
    \ expression consists of only one statement, then the curly braces are optional.\
    \ So the following code is equivalent to the previous example.\n\n```\nBOOL isNotLegal\
    \ = !((truckWeight > 0.0) && (truckWeight < 40000.0));\nif (isNotLegal)\n    printf(\"\
    Truck weight is not within legal range.\\n\");\n```\n\nHowever, the curly braces\
    \ are necessary if the code consists of more than one statement.\n\n```\nBOOL\
    \ isNotLegal = !((truckWeight > 0.0) && (truckWeight < 40000.0));\nif (isNotLegal)\
    \ {\n    printf(\"Truck weight is not within legal range.\\n\");\n    printf(\"\
    Impound truck.\\n\");\n}\n```\n\nWhy? Imagine if you removed the curly braces.\n\
    \n```\nBOOL isNotLegal = !((truckWeight > 0.0) && (truckWeight < 40000.0));\n\
    if (isNotLegal)\n    printf(\"Truck weight is not within legal range.\\n\");\n\
    \    printf(\"Impound truck.\\n\");\n```\n\nThis code would make you very unpopular\
    \ with truck drivers. In this case, every truck gets impounded regardless of weight.\
    \ When the compiler doesn’t find a curly brace after the conditional, only the\
    \ next statement is considered part of the `if` construct. Thus, the second statement\
    \ is always executed. (What about the indentation of the second statement? While\
    \ indentation is very helpful for human readers of code, it means nothing to the\
    \ compiler.)\n\n# ## else if\n\nWhat if you have more than two possibilities?\
    \ You can test for them one-by-one using `else if`. For example, imagine that\
    \ a truck belongs to one of three weight categories: floating, light, and heavy.\n\
    \n```\nif (truckWeight <= 0) {\n    printf(\"A floating truck\\n\");\n} else if\
    \ (truckWeight < 40000.0) {\n    printf(\"A light truck\\n\");\n} else {\n   \
    \ printf(\"A heavy truck\\n\");\n}\n```\n\nYou can have as many `else if` clauses\
    \ as you wish. They will each be tested in the order in which they appear until\
    \ one evaluates as true. The “in the order in which they appear” part is important.\
    \ Be sure to order your conditions so that you don’t get a false positive. For\
    \ instance, if you swapped the first two tests in the above example, you would\
    \ never find a floating truck because floating trucks are also light trucks. The\
    \ final `else` clause is optional, but it’s useful when you want to catch everything\
    \ that did not meet the earlier conditions."
  merge: -1
  img_proc: true
- pgno: 36
  md: "# For the More Curious: Conditional (ternary) operator\n\nIt is not uncommon\
    \ that you will use if and else to set the value of an instance variable. For\
    \ example, you might have the following code:\n\n```\n```\nint minutesPerPound;\n\
    if (isBoneless)\n    minutesPerPound = 15;\nelse\n    minutesPerPound = 20;\n\
    ```\n```\n\nWhenever you have a scenario where a value is assigned to a variable\
    \ based on a conditional, you have a candidate for the *conditional operator*,\
    \ which is ?. (You will sometimes see it called the *ternary operator*.)\n\n```\n\
    ```\nint minutesPerPound = isBoneless ? 15 : 20;\n```\n```\n\nThis one line is\
    \ equivalent to the previous example. Instead of writing if and else, you write\
    \ an assignment. The part before the ? is the conditional. The values after the\
    \ ? are the alternatives for whether the conditional is found to be true or false.\n\
    \nIf this notation strikes you as odd, there is nothing wrong with continuing\
    \ to use if and else instead. I suspect over time you will embrace the ternary\
    \ operator as a concise way to do conditional value assignment. More importantly,\
    \ you will see it used by other programmers, and it will be nice to understand\
    \ what you see!\n\n# Challenge\n\nConsider the following code snippet:\n\n```\n\
    ```\nint i = 20;\nint j = 25;\n\nint k = ( i > j ) ? 10 : 5;\n\nif ( 5 < j - k\
    \ ) { // first expression\n    printf(\"The first expression is true.\");\n} else\
    \ if ( j > i ) { // second expression\n    printf(\"The second expression is true.\"\
    );\n} else {\n    printf(\"Neither expression is true.\");\n}\n```\n```\n\nWhat\
    \ will be printed to the console?"
  merge: -1
