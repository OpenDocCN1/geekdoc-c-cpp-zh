  md: '# ## NSNotificationCenter


    In Chapter 24, you used NSNotificationCenter’s addObserver:selector:name:object:
    method to register to receive callbacks via your zoneChange: method. Update that
    exercise to use the addObserverForName:object:queue:usingBlock: method instead.
    Look up its details in the developer documentation.


    This method takes a block as an argument and then executes the block instead of
    calling back to your object when the specified notification is posted. This means
    that your zoneChange: method will never be called. The code inside this method
    will instead be in the block.


    The passed-in block should take a single argument (an NSNotification *) and return
    nothing, just as the zoneChange: method does.


    You can pass nil as the argument for queue:; this argument is used for concurrency,
    a topic we won’t cover in this book.'
