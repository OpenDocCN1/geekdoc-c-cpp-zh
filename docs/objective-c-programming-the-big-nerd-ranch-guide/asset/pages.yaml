  md: "To look for retain cycles, change to the Leaks instrument and choose the Cycles\
    \ view from the menu bar above the table. Select a particular cycle to see an\
    \ object graph of it:\n\n# Figure 20.4 \t Leaks instrument\n\n![](img/5f9368899ebf8d92fc145f8def1e89f8_139_0.png)\n\
    \n# Weak references\n\nHow do you fix a retain cycle? Use a weak reference. A\
    \ *weak reference* is a pointer that *does not* imply ownership. To fix our retain\
    \ cycle, an asset should not own its holder: Edit `Asset.h` to make holder a weak\
    \ reference:\n\n```\n```c\n#import <Foundation/Foundation.h>\n@class Employee;\n\
    \n@interface Asset : NSObject\n{\n    NSString *label;\n    __weak Employee *holder;\n\
    \    unsigned int resaleValue;\n}\n@property (strong) NSString *label;\n@property\
    \ (weak) Employee *holder;\n@property unsigned int resaleValue;\n@end\n```\n```\n\
    \nBuild and run the program. Note that all the objects are now being deallocated\
    \ correctly.\n\nIn a parent-child relationship, the general rule for preventing\
    \ this type of retain cycle is the parent owns the child, but the child should\
    \ not own the parent."
