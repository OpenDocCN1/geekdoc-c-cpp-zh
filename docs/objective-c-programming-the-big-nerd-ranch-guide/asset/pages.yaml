  md: "In Xcode, create yet another new project: a C Command Line Tool named Coolness.\n\
    \nThe first program I ever wrote printed the words, “Aaron is Cool”. (I was 10\
    \ at the time.) Write that program now:\n\n```\n#include <stdio.h>\n\nint main(int\
    \ argc, const char * argv[])\n{\n    **printf(\"Aaron is Cool\\n\");**\n    return\
    \ 0;\n}\n```\n\nBuild and run the program.\n\nLet’s suppose for a moment that\
