- pgno: 167
  md: '# ## 24

    # Callbacks


    Thus far, your code has been the boss. It has been sending messages to standard
    Foundation objects, like instances of `NSString` and `NSArray`, and telling them
    what to do. Thus far, your programs have run and exited in milliseconds.


    You have been living a sweet and simple existence. In the real world, applications
    run for hours and your objects act as slaves to the stream of events pouring in
    from the user, the clock, the network, etc.


    In a real-world application, there needs to be an object that waits for events
    like mouse movements, touch events, timers, and network activity. On Mac OS X
    and iOS, this object is an instance of `NSRunLoop`. The run loop sits and waits,
    and when something happens, it sends a message to another object.


    We say that when something happens, the run loop causes a *callback* to occur.
    For Objective-C programmers, there are three forms that a callback can take. (Because
    these are very general ideas, I am going to use *x* for “a specific something”
    that happens. I’ll fill in the details in the sections that follow.)


    +   -   ***Target-action***: Before the wait begins, you say “When *x* happens,
    send this particular message to that particular object.” The object receiving
    the message is the *target*. The selector for the message is the *action*.


    +   -   ***Helper objects***: Before the wait begins, you say “Here is a helper
    object that conforms to your protocol. Send it messages when things happen.” (More
    on protocols in Chapter 25.) Helper objects are often known as *delegates* or
    *data sources*.


    +   -   ***Notifications***: There is an object called the notification center.
    Before the wait begins, you say to the notification center “This object is waiting
    for these sorts of notifications. When one of those notifications arrives, send
    the object this message.” When *x* happens, an object posts a notification to
    the notification center, and the center forwards it on to your object.


    In this chapter, you will implement all three types of callbacks and learn which
    to employ in which circumstances.


    # ### Target-action


    Timers use a target-action mechanism. You create a timer with a delay, a target,
    and an action. After that delay, the timer sends the action message to its target.


    You are going to create a program with a run loop and timer. Every two seconds,
    the timer will send the action message to its target. You will create a class,
    and an instance of that class will be the target.'
