- pgno: 142
  md: "```\n[anObject release]; // anObject loses an owner\n[anObject retain]; //\
    \ anObject gains an owner\n```\n\nYou would see these sorts of calls primarily\
    \ in accessor methods (where the new value was retained and the old value was\
    \ released) and in dealloc methods (where all the previously retained objects\
    \ were released). The setHolder: method for Asset would have looked like this:\n\
    \n```\n- (void)setHolder:(Employee *)newEmp\n{\n    [newEmp retain];\n    [holder\
    \ release];\n    holder = newEmp;\n}\n```\n\nThe dealloc method would have looked\
    \ like this:\n\n```\n- (void) dealloc\n{\n    [label release];\n    [holder release];\n\
    \    [super dealloc];\n}\n```\n\nWhat about the description method? It creates\
    \ and returns a string. Should Asset claim ownership of it? That wouldn't make\
    \ sense; the asset is giving away the string it created. When you autorelease\
    \ an object, you are marking it to be sent release in the future. Before ARC,\
    \ the description method for Asset would look like this:\n\n```\n- (NSString *)description\n\
    {\n    NSString *result = [[NSString alloc] initWithFormat:@\"<%@: $%d >\",\n\
    \                     [self label], [self resaleValue]];\n    [result autorelease];\n\
    \    return result;\n}\n```\n\nWhen would it be sent release? When the current\
    \ autorelease pool was drained:\n\n```\n// Create the autorelease pool\nNSAutoreleasePool\
    \ *arp = [[NSAutoreleasePool alloc] init];\nAsset *asset = [[Asset alloc] init];\n\
    \nNSString *d = [asset description];\n// The string that d points to is in the\
    \ autorelease pool\n\n[arp drain]; // The string is sent the message release\n\
    ```\n\nARC uses the autorelease pool automatically, but you must create and drain\
    \ the pool. When ARC was created, we also got a new syntax for creating an autorelease\
    \ pool. The code above now looks like this:\n\n```\n// Create the autorelease\
    \ pool\n@autoreleasepool {\n    Asset *asset = [[Asset alloc] init];\n\n    NSString\
    \ *d = [asset description];\n    // The string that d points to is in the autorelease\
    \ pool\n}\n// The pool is drained\n```"
