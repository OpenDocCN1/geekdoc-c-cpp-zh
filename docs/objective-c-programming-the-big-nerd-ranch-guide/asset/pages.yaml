- pgno: 133
  md: 'When **employees** is set to **nil**, the array no longer has an owner. So
    it is deallocated, which sets up an even larger chain reaction of memory clean-up
    and deallocation when, suddenly, none of the **employees** has an owner.


    Tidy, right? As the objects become unnecessary, they are being deallocated. This
    is good. When unnecessary objects don’t get deallocated, you are said to have
    a *memory leak*. Typically a memory leak causes more and more objects to linger
    unnecessarily over time. The memory footprint of your application just gets bigger
    and bigger. On iOS, the operating system will eventually kill your application.
    On Mac OS X, the performance of the entire system will suffer as the machine spends
    more and more time swapping data out of memory and onto disk.


