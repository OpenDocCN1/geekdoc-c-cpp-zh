  md: 'You’ve sized your views nicely, but what will happen when the user resizes
    the windows in your application? You can make the table view resize with the window.
    Actually, you are going to make the *scroll* view that contains the table view
    resize with the window. Control-Shift-click on the table view, and select **NSScrollView**
    from the list. At the top of the inspector pane, click the 📁 button to reveal
    the *size inspector*. Then find the section called **Autosizing**.


    The autosizing section contains the autosizing mask – a control that lets you
    configure how the selected view object will react when its superview is resized.
    Views exist in a hierarchy much like classes do. So views can have superviews
    and subviews. The **NSScrollView**’s superview is the instance of **NSWindow**.


    The autosizing mask contains four *struts* that look like I-beams and two *springs*
    shown as double-headed arrows. Enabling one of the springs allows the selected
    view object to expand in the indicated direction as its superview expands. Enabling
    a strut anchors the selected view object to the indicated edge of its superview.
    Fortunately, there is a handy animation right next to the autosizing mask that
    lets you preview the effect a combination of springs and struts will have on the
    selected view object.


    Set all four struts and both springs in the autosizing mask. This will anchor
    all four sides of the scroll view to their respective edges of the window and
    allow the scroll view (and the table view within it) to expand horizontally and
    vertically as the window is resized.


    # Figure 28.7  Setting the autosizing mask


    ![](img/5f9368899ebf8d92fc145f8def1e89f8_206_0.png)


    Now let’s move from the table view and turn to the button. Head back to the object
    library. Find and drag an instance of **NSButton** onto the window object. You
    can choose any of the button styles listed in the library; Rounded Rect Button
    is a classic. Once you’ve dragged the button onto the window, you can change its
    label by double-clicking on the button’s text and typing. Make it an **Insert**
    button.'
