  md: "you call the **Seasoned Bread Crumbs** recipe, you need a new blackboard. Where\
    \ are you going to put it? Right on top of the blackboard for Baked Chicken. After\
    \ all, you’ve suspended execution of Baked Chicken to make Seasoned Bread Crumbs.\
    \ You won’t need the Baked Chicken frame until the Seasoned Bread Crumbs recipe\
    \ is complete and its frame is discarded. What you have now is a stack of frames.\n\
    \n# Figure 5.3 Two blackboards in a stack\n\n![](img/5f9368899ebf8d92fc145f8def1e89f8_43_0.png)\n\
    \nProgrammers say, “When a function is called, its frame is created on top of\
    \ *the stack*. When the function finishes executing, its frame is popped off the\
    \ stack and destroyed.”\n\nLet’s look more closely at how the stack works by putting\
    \ **showCookTimeForTurkey()** into a hypothetical program:\n\n```\n```c\nvoid\
    \ showCookTimeForTurkey(int pounds)\n{\n int necessaryMinutes = 15 + 15 * pounds;\n\
    \ printf(\"Cook for %d minutes.\\n\", necessaryMinutes);\n}\n\nint main(int argc,\
    \ const char * argv[\\])\n{\n int totalWeight = 10;\n int gibletsWeight = 1;\n\
    \ int turkeyWeight = totalWeight - gibletsWeight;\n showCookTimeForTurkey(turkeyWeight);\n\
    \ return 0;\n}\n```\n```\n\nRecall that **main()** is always executed first. **main()**\
    \ calls **showCookTimeForTurkey()**, which begins executing. What, then, does\
    \ this program’s stack look like just after *pounds* is multiplied by 15?"
