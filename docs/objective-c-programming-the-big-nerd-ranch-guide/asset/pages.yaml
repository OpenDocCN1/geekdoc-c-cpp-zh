- pgno: 197
  md: "In order for the table view's data source to do its job, it must implement\
    \ methods in the\nUITableViewDataSource protocol. First, update BNRAppDelegate.h\
    \ to declare that **BNRAppDelegate**\nconforms to this protocol:\n\n```\n@interface\
    \ BNRAppDelegate : UIResponder\n<UIApplicationDelegate, UITableViewDataSource>\n\
    {\n    UIView *taskTable;\n    UITextField *taskField;\n    UIButton *insertButton;\n\
    \n    NSMutableArray *tasks;\n}\n- (void)addTask:(id)sender;\n```\n\nThe UITableViewDataSource\
    \ protocol has two required methods that **BNRAppDelegate** must now\nimplement.\
    \ At a minimum, a table view's data source must be prepared to tell the table\
    \ view how many\nrows are in a given section of the table, and what the cell in\
    \ a given row should be.\n\nImplement the callbacks accordingly:\n\n```\n#pragma\
    \ mark - Table View management\n\n- (NSInteger)tableView:(UITableView *)tableView\n\
    numberOfRowsInSection:(NSInteger)section\n{\n    // Because this table view only\
    \ has one section,\n    // the number of rows in it is equal to the number\n \
    \   // of items in our tasks array\n    return [tasks count];\n}\n\n- (UITableViewCell\
    \ *)tableView:(UITableView *)tableView\n    cellForRowAtIndexPath:(NSIndexPath\
    \ *)indexPath\n{\n    // To improve performance, we reconfigure cells in memory\n\
    \    // that have scrolled off the screen and hand them back\n    // with new\
    \ contents instead of always creating new cells.\n    // First, we check to see\
    \ if there's a cell available for reuse.\n    UITableViewCell *c = [taskTable\
    \ dequeueReusableCellWithIdentifier:@\"Cell\"];\n\n    if (!c) {\n        // ...and\
    \ only allocate a new cell if none are available\n        c = [[UITableViewCell\
    \ alloc] initWithStyle:UITableViewCellStyleDefault\n            reuseIdentifier:@\"\
    Cell\"];\n    }\n\n    // Then we (re)configure the cell based on the model object,\n\
    \    // in this case our todoItems array\n    NSString *item = [tasks objectAtIndex:[indexPath\
    \ row]];\n    [[c textLabel] setText:item];\n\n    // and hand back to the table\
    \ view the properly configured cell\n    return c;\n}\n```"
