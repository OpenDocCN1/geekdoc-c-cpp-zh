    # So what is a program?


    Now that you’ve built and run your program, let’s take a look inside. A program
    is a collection of functions. A function is a list of operations for the processor
    to execute. Every function has a name, and the function that you just wrote is
    named **main**. There was also another function – **printf**. You didn’t write
    this function, but you did use it. (We’ll find out where **printf** comes from
    in Chapter 5.)


    To a programmer, writing a function is a lot like writing a recipe: “Stir a quart
    of water slowly until it boils. Then mix in a cup of flour. Serve while hot.”


    In the mid-1970’s, Betty Crocker started selling a box containing a set of recipe
    cards. A recipe card is a pretty good metaphor for a function. Like a function,
    each card has a name and a set of instructions. The difference is that you execute
    a recipe, and the computer executes a function.


    Figure 2.5 A recipe card named Baked Chicken


