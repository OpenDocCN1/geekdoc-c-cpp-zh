  md: "common proper names that are also regular words. For example, “Glen” is a guy’s\
    \ name, and “glen” is a narrow valley. In the word files, proper names are capitalized.\n\
    \nWhen a computer orders strings, it typically considers uppercase letters as\
    \ coming before lowercase letters. To do a comparison that ignores the case, use\
    \ the method `caseInsensitiveCompare:`.\n\n```\n```objectivec\nNSString *a = @\"\
    ABC\";\nNSString *b = @\"abc\";\nif ([a caseInsensitiveCompare:b] == NSOrderedSame)\
    \ {\n    NSLog(@\"a and b are equal\");\n}\n\nif ([a caseInsensitiveCompare:b]\
    \ == NSOrderedAscending) {\n    NSLog(@\"a comes before b\");\n}\n\nif ([a caseInsensitiveCompare:b]\
    \ == NSOrderedDescending) {\n    NSLog(@\"b comes before a\");\n}\n```\n```"
