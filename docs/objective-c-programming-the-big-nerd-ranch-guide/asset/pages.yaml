- pgno: 272
  md: "```\n```\ncase 3:\nmakeWine();\ndefault:\nmakeFuel();\n}\n```\n\n```\n\nThe\
    \ program would run `makeBeer()`, `makeWine()`, and `makeFuel()`. This is primarily\
    \ so that you can have multiple possible values trigger the same code:\n\n```\n\
    ```\nint yeastType = ...;\n\nswitch (yeastType) {\n    case 1:\n    case 4:\n\
    \        makeBread();\n        break;\n    case 2:\n    case 5:\n        makeBeer();\n\
    \        break;\n    case 3:\n        makeWine();\n        break;\n    default:\n\
    \        makeFuel();\n        break;\n}\n```\n\n```\n\nAs you can imagine, forgetting\
    \ to put the break at the end of the case clause is a common programmer error,\
    \ and it is only discovered when your program starts acting strangely.\n\nIn C,\
    \ switch statements are for a very specific situation: the case can only be a\
    \ constant integer. As such, you don’t see a lot of switch statements in most\
    \ Objective-C programs. Which is why I snuck it in here just before the book ends."
