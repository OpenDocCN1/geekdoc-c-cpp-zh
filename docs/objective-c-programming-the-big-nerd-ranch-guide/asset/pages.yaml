    \ in the calls to **printf()**: %zu. The **sizeof()** function returns a value\
    \ of type size_t, for which %zu is the correct placeholder token. This one’s not\
    \ very common in the wild. Build and run the program. If your pointer is 4 bytes\
    \ long, your program is running in 32-bit mode. If your pointer is 8 bytes long,\
    \ your program is running in 64-bit mode.\n\n**sizeof()** will also take a variable\
    \ as an argument, so you could have written the previous program like this:\n\n\
    ```\n```\nint main(int argc, const char * argv[])\n{\n    int i = 17;\n    int\
    \ *addressOfI = &i;\n    printf(\"i stores its value at %p\\n\", addressOfI);\n\
    \    *addressOfI = 89;\n    printf(\"Now i is %d\\n\", i);\n    printf(\"An int\
    \ is %zu bytes\\n\", sizeof(i));\n    printf(\"A pointer is %zu bytes\\n\", sizeof(addressOfI));\n\
    \    return 0;\n}\n```\n```\n\n# ## NULL\n\nSometimes you need a pointer to nothing.\
    \ That is, you have a variable that can hold an address, and you want to store\
    \ something in it that makes it explicit that the variable is not set to anything.\
    \ We use NULL for this:\n\n```\n```\nfloat *myPointer;\n// Set myPointer to NULL\
    \ for now, I’ll store a pointer there\n// later in the program\nmyPointer = NULL;\n\
    ```\n```\n\nWhat is NULL? Remember that an address is just a number. NULL is zero.\
    \ This is very handy in if statements:\n\n```\n```\nfloat *myPointer;\n...\n//\
    \ Has myPointer been set?\nif (myPointer) {\n    // myPointer is not NULL\n  \
    \  ...do something with the data at myPointer...\n} else {\n    // myPointer is\
    \ NULL\n}\n```\n```\n\nLater, when we discuss pointers to objects, we will use\
    \ nil instead of NULL. They are equivalent, but Objective-C programmers use nil\
    \ to mean the address where no object lives."
