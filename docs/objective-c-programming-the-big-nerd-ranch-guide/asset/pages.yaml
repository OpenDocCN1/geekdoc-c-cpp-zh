  md: "heater. Among the things that were installed as part of Mac OS X were files\
    \ containing a collection of precompiled functions. These collections are called\
    \ the standard libraries. sleep() and printf() are included in these standard\
    \ libraries.\n\nAt the top of main . c, you included the file stdio . h. This\
    \ file contains a declaration of the function printf() and lets the compiler check\
    \ to make sure that you are using it correctly. The function sleep() is declared\
    \ in stdlib . h. Include that file, too, so that the compiler will stop complaining\
    \ that sleep() is implicitly declared:\n\n```\n```\n#include <stdio.h>\n#include\
    \ <stdlib.h>\n\nvoid congratulateStudent(char *student, char *course, int numDays)\n\
    {\n    ...\n```\n\n```\n\nThe standard libraries serve two functions:\n\n+   \
    \   - They represent big chunks of code that you don’t need to write and maintain.\
    \ Thus, they empower you to build much bigger, better programs than you would\
    \ be able to do otherwise.\n   - They ensure that most programs look and feel\
    \ similar.\n\nProgrammers spend a lot of time studying the standard libraries\
    \ for the operating systems that they work on. Every company that creates an operating\
    \ system also has documentation for the standard libraries that come with it.\
    \ You’ll learn how to browse the documentation for iOS and Mac OS X in Chapter\
    \ 16.\n\n# Local variables, frames, and the stack\n\nEvery function can have local\
    \ variables. Local variables are variables declared inside a function. They exist\
    \ only during the execution of that function and can only be accessed from within\
    \ that function. For example, imagine that you were writing a function that computed\
    \ how long to cook a turkey. It might look like this:\n\n```\n```\nvoid showCookTimeForTurkey(int\
    \ pounds)\n{\n    int necessaryMinutes = 15 + 15 * pounds;\n    printf(\"Cook\
    \ for %d minutes.\\n\", necessaryMinutes);\n}\n```\n\n```\n\nnecessaryMinutes\
    \ is a local variable. It came into existence when showCookTimeForTurkey() started\
    \ to execute and will cease to exist once that function completes execution. The\
    \ parameter of the function, pounds, is also a local variable. A parameter is\
    \ a local variable that has been initialized to the value of the corresponding\
    \ argument.\n\nA function can have many local variables, and all of them are stored\
    \ in the frame for that function. Think of the frame as a blackboard that you\
    \ can scribble on while the function is running. When the function is done executing,\
    \ the blackboard is discarded.\n\nImagine for a moment that you are working on\
    \ the Baked Chicken recipe. In your kitchen, all recipes get their own blackboards,\
    \ so you have a blackboard for the Baked Chicken recipe ready. Now, when"
