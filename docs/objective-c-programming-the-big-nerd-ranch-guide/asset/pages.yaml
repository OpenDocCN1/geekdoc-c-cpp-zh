    # C primitive types


    The collections covered in this chapter only hold objects. What if you want a
    collection of floats or ints or pointers to structures? You can wrap common C
    primitive types in an object. There are two classes that are designed specifically
    for this purpose. `NSnumber` holds C number types. `NSValue` can hold a pointer
    and some types of structs.


    For instance, if you wanted to put the numbers 4 and 5.6 into an array, you would
    use `NSNumber`:


    ```

    ```objective-c

    NSMutableArray *numList = [[NSMutableArray alloc] init];

    [numList addObject:[NSNumber numberWithInt:4]];

    [numList addObject:[NSNumber numberWithFloat:5.6]];

    ```

    ```


    # Collections and nil


    You are not allowed to add `nil` to any of the collection classes we have covered.
    What if you need to put that idea of nothingness, a “hole,” into a collection?
    There is a class called `NSNull`. There is exactly one instance of `NSNull`, and
    it is an object that represents nothingness. Here’s an example:'
