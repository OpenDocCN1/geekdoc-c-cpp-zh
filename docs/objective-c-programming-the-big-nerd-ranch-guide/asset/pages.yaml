    ![](img/5f9368899ebf8d92fc145f8def1e89f8_104_0.png)


    It would be difficult to overstate how important these reference pages will be
    to you and how important they are for programmers of all levels. Apple has worked
    really hard to create huge libraries of code for your convenience. You will learn
    about these libraries primarily through reference pages. As you go through this
    book, take a moment to look up the reference pages for new classes as you use
    them'
