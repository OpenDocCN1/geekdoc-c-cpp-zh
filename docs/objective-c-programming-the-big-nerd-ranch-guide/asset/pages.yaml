- pgno: 169
  md: '# Figure 24.2  The search for a method with the right name


    ![](img/5f9368899ebf8d92fc145f8def1e89f8_169_0.png)


    As you can imagine, this search has to happen very, very quickly. If we used the
    actual name of the method (which could be very long), method lookup would be really
    slow. To speed things up, the compiler assigns a unique number to each method
    name it encounters. At runtime, we use that number instead of the method name.


    # Figure 24.3  How it really works


    ![](img/5f9368899ebf8d92fc145f8def1e89f8_169_1.png)


    That unique number that represents a particular method name is known as a *selector*.
    To create a timer that sends the message **sayOuch:** to our **Logger**, you must
    ask the compiler to look up its selector. This is done with the `@selector` compiler
    directive.


    In **main.m**, create an instance of **Logger** and make it the target of an instance
    of **NSTimer**. Set the action to be the selector for **sayOuch:**.'
