    \ \"Employee.h\"\n\nint main(int argc, const char * argv[])\n{\n    @autoreleasepool\
    \ {\n\n        // Create an instance of Person\n        Employee *person = [[Employee\
    \ alloc] init];\n\n        // Give the instance variables interesting values\n\
    \        [person setWeightInKilos:96];\n        [person setHeightInMeters:1.8];\n\
    \        [person setEmployeeID:15];\n\n        // Call the bodyMassIndex method\n\
    \        float bmi = [person bodyMassIndex];\n        NSLog(@\"Employee %d has\
    \ a BMI of %f\", [person employeeID], bmi);\n\n    }\n    return 0;\n}\n```\n\n\
    # Overriding methods\n\nTo review, when a message is sent, the search for the\
    \ method of that name starts at the object’s class and goes up the inheritance\
    \ hierarchy. The first implementation that is found is the one that gets executed.\
    \ Thus, you can *override* inherited methods with a custom implementation. Let’s\
    \ say, for example, that you decided that employees always have a Body Mass Index\
    \ of 19. In this case, you might override the **bodyMassIndex** method in **Employee**.\
    \ Open *Employee.m* and do so:\n\n```\n#import \"Employee.h\"\n@implementation\
    \ Employee\n\n@synthesize employeeID;\n\n- (float)bodyMassIndex\n{\n    return\
    \ 19.0;\n}\n@end\n```\n\nBuild and run the program and note that your new implementation\
    \ of **bodyMassIndex** is the one that gets executed – not the implementation\
    \ from *Person*.\n\nNotice that you implemented **bodyMassIndex** in *Employee.m*,\
    \ but you didn’t declare it in *Employee.h*. Declaring a method in the header\
    \ file advertises the method so that instances of other classes can call it. However,\
    \ because **Employee** inherits from *Person*, everyone already knows that instances\
    \ of **Employee** have a **bodyMassIndex** method. There is no need to advertise\
    \ it again."
