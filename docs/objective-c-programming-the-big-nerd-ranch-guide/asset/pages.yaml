    \ int *addressOfI = &i;\n    printf(\"i stores its value at %p\\n\", addressOfI);\n\
    \    *addressOfI = 89;\n    printf(\"Now i is %d\\n\", i);\n    printf(\"An int\
    \ is %zu bytes\\n\", sizeof(int));\n    printf(\"A pointer is %zu bytes\\n\",\
