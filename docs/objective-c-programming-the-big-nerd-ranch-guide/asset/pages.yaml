  md: "What if you wanted to write a function that converted a point in Cartesian\
    \ coordinates to polar coordinates? It would need to read two floating point numbers\
    \ and return two floating point numbers. The declaration of the function would\
    \ look like this:\n\n```\nvoid cartesianToPolar(float x, float y, float *rPtr,\
    \ float *thetaPtr)\n```\n\nThat is, when the function is called, it will be passed\
    \ values for x and y. It will also be supplied with locations where the values\
    \ for radius and theta can be stored.\n\nNow write the function near the top of\
    \ your main.c file and call it from main():\n\n```\n#include <stdio.h>\n#include\
    \ <math.h>\n```\n\n```\nvoid cartesianToPolar(float x, float y, double *rPtr,\
    \ double *thetaPtr)\n{\n    // Store the radius in the supplied address\n    *rPtr\
    \ = sqrt(x * x + y * y);\n\n    // Calculate theta\n    float theta;\n    if (x\
    \ == 0.0) {\n        if (y == 0.0) {\n            theta = 0.0; // technically\
    \ considered undefined\n        } else if (y > 0) {\n            theta = M_PI_2;\n\
    \        } else {\n            theta = - M_PI_2;\n        }\n    } else {\n  \
    \      theta = atan(y/x);\n    }\n\n    // Store theta in the supplied address\n\
    \    *thetaPtr = theta;\n}\n```\n\n```\nint main(int argc, const char * argv[])\n\
    {\n    double pi = 3.14;\n    double integerPart;\n    double fractionPart;\n\n\
    \    // Pass the address of integerPart as an argument\n    fractionPart = modf(pi,\
    \ &integerPart);\n\n    // Find the value stored in integerPart\n    printf(\"\
    integerPart = %.0f, fractionPart = %.2f\\n\", integerPart, fractionPart);\n\n\
    \    double x = 3.0;\n    double y = 4.0;\n    double radius;\n    double angle;\n\
    \n    cartesianToPolar(x, y, &radius, &angle);\n    printf(\"(%.2f, %.2f) becomes\
    \ (%.2f radians, %.2f)\\n\", x, y, radius, angle);\n\n    return 0;\n}\n```\n\n\
    Build and run the program."
