- pgno: 85
  md: '# ## 12  Objects


    Many computer languages have the idea of *objects*. An object is like a structure
    in that it holds data. However, unlike a structure, an object also contains a
    set of functions that act upon that data. To trigger one of these functions, you
    send a *message* to the object. To use the correct word, a function that is triggered
    by a message is known as a *method*.


    In the early 1980’s, Brad Cox and Tom Love decided to add object-oriented ideas
    to the C language. For objects, they built upon the idea of structs allocated
    on the heap and added a message-sending syntax. The result was the language Objective-C.


    Objects are very chatty by nature. They do work and send and receive messages
    about the work they are doing. A complex Objective-C program can have hundreds
    of objects in memory all at once, doing work and sending messages to each other.


    A *class* describes a particular type of object. This description includes methods
    and *instance variables* where an object of this type stores its data. You ask
    a class to create an object of its type for you on the heap. We say that the resulting
    object is an *instance* of that class.


    For example, an iPhone ships with many classes, one of which is **CLLocation**.
    You can ask the **CLLocation** class to create an *instance* of **CLLocation**.
    Inside this **CLLocation** object are several instance variables that hold location
    data, like longitude, latitude, and altitude. The object also has several methods.
    For example, you can ask one instance of **CLLocation** how far it is from another
    **CLLocation** object.


    # ### Creating and using your first object


    Now you’re going to create your first Objective-C program. Create a new project:
    a Command Line Tool, but instead of C, make its type Foundation. Name it TimeAfterTime.'
