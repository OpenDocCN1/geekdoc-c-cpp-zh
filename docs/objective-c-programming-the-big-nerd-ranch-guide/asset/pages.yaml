  md: "# 17\n# Your First Class\n\nSo far, you have only used classes created by Apple.\
    \ Now you get to write your own class. Remember that a class describes objects\
    \ in two ways:\n\n+   - methods (both instance methods and class methods) implemented\
    \ by the class\n\n+   - instance variables within each instance of the class\n\
    \nYou're going to write a **Person** class, similar to the `struct Person` you\
    \ wrote in Chapter 10. Your class will be defined in two files: `Person.h` and\
    \ `Person.m`. `Person.h`, known as the *header* or *interface file*, will contain\
    \ the declarations of instance variables and methods. `Person.m` is known as the\
    \ *implementation file*. This is where you write out the steps for, or *implement*,\
    \ each method.\n\nCreate a new project: a Foundation Command Line Tool named **BMITime**.\n\
    \nTo create a new class, select **File → New → New File....** From the Mac OS\
    \ X section on the left, select **Cocoa** and choose the **Objective-C class template**.\
    \ Name your class **Person** and make it a subclass of **NSObject**. Finally,\
    \ make sure the **BMITime** target is checked and click **Save**.\n\nNotice that\
    \ the new class files, `Person.h` and `Person.m`, now appear in the project navigator.\
    \ Open `Person.h`. Declare two instance variables and three instance methods:\n\
    \n```\n```objectivec\n#import <Foundation/Foundation.h>\n// The class Person inherits\
    \ all the instance variables\n// and methods defined by the class NSObject\n@interface\
    \ Person : NSObject\n{\n    // It has two instance variables\n    float heightInMeters;\n\
    \    int weightInKilos;\n}\n// You will be able to set those instance variables\
    \ using these methods\n- (void)setHeightInMeters:(float)h;\n- (void)setWeightInKilos:(int)w;\n\
    // This method calculates the Body Mass Index\n- (float)bodyMassIndex;\n@end\n\
    ```\n```\n\nNotice that you declared the instance variables inside of curly braces\
    \ and you declared the methods after the variables and outside of the curly braces."
  merge: -1
  img_proc: true
- pgno: 112
  md: "To the compiler, this code says “I am defining a new class called **Person**\
    \ that has all the methods and instance variables of the class **NSObject**. Furthermore,\
    \ I’m adding in two new instance variables: a float called heightInMeters and\
    \ an int called weightInKilos. Also, I’m going to add three instance methods,\
    \ which will be implemented in Person.m.”\n\n**Notice** that setHeightInMeters:\
    \ expects a float argument and does not return a value, setWeightInKilos: expects\
    \ an int argument and does not return a value, and bodyMassIndex takes no arguments\
    \ and returns a float.\n\nNow open Person.m. Delete any existing methods and implement\
    \ the methods you declared:\n\n```\n```objective-c\n#import “Person.h”\n\n@implementation\
    \ Person\n- (void)setHeightInMeters:(float)h\n{\n    heightInMeters = h;\n}\n\
    - (void)setWeightInKilos:(int)w\n{\n    weightInKilos = w;\n}\n- (float)bodyMassIndex\n\
    {\n    return weightInKilos / (heightInMeters * heightInMeters);\n}\n@end\n```\n\
    ```\n\nNote that **Xcode** imported Person.h for you. Also note that the names\
    \ of the methods you implement must exactly match the ones you declared in the\
    \ header file. In **Xcode**, this is easy: as you start typing a method in the\
    \ implementation file, **Xcode** will suggest names of methods you’ve already\
    \ declared.\n\nNow that you’ve implemented all the methods you declared in Person.h,\
    \ your class is complete. Edit main.m to exercise it a bit:\n\n```\n```objective-c\n\
    #import <Foundation/Foundation.h>\n#import “Person.h”\n\nint main(int argc, const\
    \ char * argv[])\n{\n    @autoreleasepool {\n        // Create an instance of\
    \ Person\n        Person *person = [[Person alloc] init];\n        \n        //\
    \ Give the instance variables interesting values\n        [person setWeightInKilos:96];\n\
    \        [person setHeightInMeters:1.8];\n        \n        // Call the bodyMassIndex\
    \ method\n        float bmi = [person bodyMassIndex];\n        NSLog(@\"person\
    \ has a BMI of %f\", bmi);\n    }\n    return 0;\n}\n```\n```"
  merge: -1
  img_proc: true
- pgno: 113
  md: "Build and run the program. Notice that you imported Person.h so that the compiler\
    \ will know how your methods are declared before they are used in main().\n\n\
    # Figure 17.1 Object diagram for BMITime\n\n![](img/5f9368899ebf8d92fc145f8def1e89f8_113_0.png)\n\
    \n# Accessor methods\n\nNote that when we did this same exercise with structs\
    \ instead of objects, we accessed the data members of the structure directly in\
    \ main():\n\n```\nperson.weightInKilos = 96;\nperson.heightInMeters = 1.8;\n```\n\
    \nIn object-oriented thinking, we do our best to keep the instance variables of\
    \ an object private; that is, they are known and accessed only by the object itself.\
    \ However, because we want to give methods and functions outside of Person the\
    \ ability to set a person’s weight and height, we created the methods setWeightInKilos:\
    \ and setHeightInMeters:. We call these setter methods.\n\nA setter method allows\
    \ other methods to set the value of an instance variable. A getter method allows\
    \ other methods to read the value of an instance variable. Setter and getter methods\
    \ are also known as accessor methods, or just accessors.\n\nAdd declarations for\
    \ the getter methods to Person.h:\n\n```\n#import <Foundation/Foundation.h>\n\n\
    @interface Person : NSObject\n{\n    float heightInMeters;\n    int weightInKilos;\n\
    }\n\n// You will be able to set those instance variables\n- (float)heightInMeters;\n\
    - (void)setHeightInMeters:(float)h;\n- (int)weightInKilos;\n- (void)setWeightInKilos:(int)w;\n\
    \n- (float)bodyMassIndex;\n@end\n```\n\nYou might wonder why the names of the\
    \ getter methods don’t include get to match the setter method names. This is an\
    \ Objective-C naming convention. The name of the method for reading an instance\
    \ variable is simply the name of that instance variable.\n\nNow return to Person.m\
    \ and implement your getter methods:"
  merge: -1
  img_proc: true
- pgno: 114
  md: "```\n@implementation Person\n- (float)heightInMeters\n{\n    return heightInMeters;\n\
    }\n- (void)setHeightInMeters:(float)h\n{\n    heightInMeters = h;\n}\n- (int)weightInKilos\n\
    {\n    return weightInKilos;\n}\n- (void)setWeightInKilos:(int)w\n{\n    weightInKilos\
    \ = w;\n}\n- (float)bodyMassIndex\n{\n    return weightInKilos / (heightInMeters\
