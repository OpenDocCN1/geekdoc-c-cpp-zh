- pgno: 164
  md: "# # Writing an NSData object to a file\n\nAn `NSData` object represents a buffer\
    \ of bytes. For example, if you fetch some data from a URL, you get an instance\
    \ of `NSData`. And you can ask an `NSData` to write itself to a file. Create a\
    \ new Foundation Command Line Tool named ImageFetch that fetches an image from\
    \ the Google website into an instance of `NSData`. Then ask the `NSData` to write\
    \ its buffer of bytes to a file:\n\n```\n```objc\n#import <Foundation/Foundation.h>\n\
    \nint main (int argc, const char * argv\\[)\\]\n{\n    @autoreleasepool {\n  \
    \      NSURL *url = [NSURL URLWithString:\n                     @\"http://www.google.com/images/logos/ps_logo2.png\"\
    ];\n        NSURLRequest *request = [NSURLRequest requestWithURL:url];\n     \
    \   NSError *error = nil;\n        NSData *data = [NSURLConnection sendSynchronousRequest:request\n\
    \                returningResponse:NULL\n                    error:&error];\n\n\
    \        if (!data) {\n            NSLog(@\"fetch failed: %@\", [error localizedDescription]);\n\
    \            return 1;\n        }\n\n        NSLog(@\"The file is %lu bytes\"\
    , [data length]);\n\n        BOOL written = [data writeToFile:@\"/tmp/google.png\"\
    \n                                  options:0\n                              \
    \      error:&error];\n\n        if (!written) {\n            NSLog(@\"write failed:\
    \ %@\", [error localizedDescription]);\n            return 1;\n        }\n\n \
    \       NSLog(@\"Success!\");\n    }\n    return 0;\n}\n```\n```\n\nBuild and\
    \ run the program. Open the resulting image file in Preview.\n\nNote that the\
    \ `writeToFile:options:error:` method takes a number that indicates options to\
    \ be used in the saving process. The most common option is `NSDataWritingAtomic`.\
    \ Let’s say that you’ve already fetched an image, and you’re just re-fetching\
    \ and replacing it with a newer version. While the new image is being written,\
    \ the power goes off. A half-written file is worthless. In cases where a half-written\
    \ file is worse than no file at all, you can make the writing atomic. Add this\
    \ option:\n\n```\n```objc\nNSLog(@\"The file is %lu bytes\", [data length]);\n\
    \nBOOL written = [data writeToFile:@\"/tmp/google.png\"\n                options:NSDataWritingAtomic\n\
    \                    error:&error];\n```\n```"
