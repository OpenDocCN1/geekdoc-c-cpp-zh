- pgno: 163
  md: "Why not? You want to avoid creating an unnecessary error object if there's\
    \ no error. If there is an error, writeToFile:atomically:encoding:error: will\
    \ be responsible for creating a new NSERROR instance and then modifying the error\
    \ pointer you declared to point to the new error object. Then you can ask that\
    \ object what went wrong via your error pointer.\n\nThis conditional creation\
    \ of the NSERROR requires you to pass a reference to error (&error) because there's\
    \ no object yet to pass. However, unlike the passing by reference you did in Chapter\
    \ 9 where you passed the reference of a primitive C variable, here you're passing\
    \ the address of a pointer variable. In essence, you're passing the address of\
    \ another address (which may become the address of an NSERROR object).\n\nTo revisit\
    \ our international espionage analogy from Chapter 9, you might tell your spy,\
    \ \"If anything goes wrong, make a complete report (much too large to put in the\
    \ steel pipe) and hide it in a book at the library. I need to know where you hid\
    \ it, so put the call number of the book in the steel pipe.\" That is, you are\
    \ giving the spy a location where she can put the address of an error report she\
    \ created.\n\nHere's a look inside the NSSTRING class where writeToFile:atomically:encoding:error:\
    \ is declared:\n\n```\n- (BOOL)writeToFile:(NSString *)path\n              atomically:(BOOL)useAuxiliaryFile\n\
    \              encoding:(NSStringEncoding)enc\n                 error:(NSERROR\
    \ **)error\n```\n\nNotice the double asterisk. When you call this method, you\
    \ are supplying a pointer to a pointer to an instance of NSERROR.\n\nMethods that\
    \ pass an NSERROR by reference always return a value that indicates whether there\
    \ was an error or not. This method, for example, returns NO if there is an error.\
    \ Don't try to access the NSERROR unless the return value indicates that an error\
    \ occurred; if the NSERROR object doesn't actually exist, trying to access it\
    \ will crash your program.\n\n# ## Reading files with NSSTRING\n\nReading a file\
    \ into a string is very similar:\n\n```\n#import <Foundation/Foundation.h>\n\n\
    int main(int argc, const char * argv[])    {\n    @autoreleasepool {\n       \
    \ \n        NSERROR *error = nil;\n        NSSTRING *str = [[NSSTRING alloc] initWithContentsOfFile:@\"\
    /etc/resolv.conf\"\n                encoding:NSASCIIStringEncoding\n         \
    \       error:&error];\n\n        if (!str) {\n            NSLOG(@\"read failed:\
    \ %@\", [error localizedDescription]);\n        } else {\n            NSLOG(@\"\
    resolv.conf looks like this: %@\", str);\n        }\n    }\n    return 0;\n}\n\
    ```"
