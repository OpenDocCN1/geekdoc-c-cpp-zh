- pgno: 244
  md: "In this code, you’ve declared `divBlock` as a block variable that returns a\
    \ `double` and expects two `double`s as arguments. Then you assigned it a value\
    \ which includes the instruction to return the result of dividing the two arguments.\n\
    \nYou can use this block like so:\n\n```\n```\ndouble quotient = divBlock(42.0,\
    \ 12.5);\n```\n```\n\n# ## Memory management\n\nLike primitive variables, blocks\
    \ are created and stored on the stack. That is, the block will be destroyed along\
    \ with the stack frame when the function or method that created the block returns.\
    \ Sometimes, however, your block needs to live longer than that. For example,\
    \ it could become an instance variable of an object. In this case, you must copy\
    \ your block from the stack to the heap.\n\nTo copy a block from the stack to\
    \ the heap, you send it the **copy** message:\n\n```\n```\nArraryEnumerationBlock\
    \ iVarDevovelizer = [devoelizer copy];\n```\n```\n\nNow a copy of your block exists\
    \ on the heap. It is now a *heap-based block* instead of a *stack-based block*,\
    \ and the new block variable is a pointer to the block.\n\nMethods that take blocks\
    \ as arguments, such as `NSArray`’s `enumerateObjectsUsingBlock:` or `NSNotificationCenter`’s\
    \ `addObserverForName:object:queue:usingBlock:`, are expected to copy blocks passed\
    \ to them to keep them around. In doing so, they create pointers – and strong\
    \ references – to those blocks.\n\nSo we’ve seen blocks be declared, assigned\
    \ values, and passed like variables. We’ve also seen that they look like functions.\
    \ Now we’re sending a block a message as if it were an object.\n\nA heap-based\
    \ block behaving like an object comes with some memory management issues:\n\n\
    *What about variables that are used with the block?*\n\nA block typically uses\
    \ other variables (both primitive and pointers to objects) within its code that\
    \ were created outside of it. To make sure these *external variables* will be\
    \ available for as long as the block needs them, the variables are *captured*\
    \ by the block when the copy is made.\n\nFor primitive variables, this means the\
    \ values are copied and stored as local variables within the block. For pointers,\
    \ the block itself will keep a strong reference to any objects it references.\
    \ That means that any objects referred to by the block are guaranteed to live\
    \ at least as long as the block itself. (If you’ve been wondering about the difference\
    \ between blocks and function pointers, it’s right here. Let’s see a function\
    \ pointer do that!) \n\nAs an example, take a look at our VowelMovement program.\
    \ The devoelizer block mentions two objects that were created outside of the block:\
    \ `newStrings` (an array for storing the modified versions of `strings`) and `string`\
    \ (the current string to be copied for modification). devoelizer will keep strong\
    \ references to both of these objects, keeping them alive as long as the block\
    \ itself exists. *Can these strong references lead to retain cycles/circular references?*\n\
    \nYou bet. The fix is the same: one of the references needs to become a weak reference.\
    \ To do this, declare a `__weak` pointer outside the block and then reference\
    \ this pointer within the block instead."
  merge: -1
