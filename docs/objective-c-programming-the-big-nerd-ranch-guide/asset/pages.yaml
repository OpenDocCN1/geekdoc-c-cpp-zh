    \ argc, const char \\* argv[]) \n{\n    @autoreleasepool {\n\n        Logger *logger\
    \ = [[Logger alloc] init];\n\n        NSURL \\*url = [NSURL URLWithString:\n \
    \                      @\"http://www.gutenberg.org/cache/epub/205/pg205.txt\"\
    ];\n```"
