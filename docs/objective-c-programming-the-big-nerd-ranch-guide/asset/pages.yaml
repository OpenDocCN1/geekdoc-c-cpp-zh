- pgno: 283
  md: '# **THE BIG Nerd STORY**


    Big Nerd Ranch exists to broaden the minds of our students and the businesses
    of our clients. Whether we are training talented individuals or developing a company''s
    mobile strategy, our core philosophy is integral to everything we do.


    The brainchild of CEO Aaron Hillegass, Big Nerd Ranch has hosted more than 2,000
    students at the Ranch since its inception in 2001. Over the past ten years, we
    have had the opportunity to work with some of the biggest companies in the world
    such as Apple, Samsung, Nokia, Google, AOL, Los Alamos National Laboratory and
    Adobe, helping them realize their programming goals. Our team of software engineers
    are among the brightest in the business and it shows in our work. We have developed
    dozens of innovative and flexible solutions for our clients.


    # **The Story Behind the Hat**


    Back in 2001, Big Nerd Ranch founder, Aaron Hillegass, showed up at WWDC (World
    Wide Developers Conference) to promote the Big Nerd Ranch brand. Without the money
    to buy an expensive booth, Aaron donned a ten-gallon cowboy hat to draw attention
    while passing out Big Nerd literature to prospective students and clients. A week
    later, we landed our first big client and the cowboy hat has been synonymous with
    the Big Nerd brand ever since. Already easily recognizable at 6''5, Aaron can
    be spotted wearing his cowboy hat at speaking engagements and conferences all
    over the world.


    # **The New Ranch – Opening 2012**


    In the continuing effort to perfect the student experience, Big Nerd Ranch is
    building its own facility. Located just 20 minutes from the Atlanta airport, the
    new Ranch will be a monastic learning center that encompasses Aaron Hillegass''
    vision for technical education featuring a state-of-the-art classroom, fine dining
    and exercise facilities.


    **www.bignerd ranch.com**'
  merge: -1
  img_proc: true
- pgno: 284
  md: '![](img/5f9368899ebf8d92fc145f8def1e89f8_284_0.png)


    # TRAINING


    # ACHIEVE NERDVANA


    Since 2001, Big Nerd Ranch has offered intensive computer programming courses
    taught by our expert instructors in a retreat environment. It is at our Ranch
    where we think our students flourish. Classes, accommodations and dining all take
    place within the same building, freeing you to learn, code and discuss with your
    programming peers and instructors. At Big Nerd Ranch, we take care of the details;
    your only job is to learn.


    # Our Teachers


    Our teachers are leaders in their respective fields. They offer deep understanding
    of the technologies they teach, as well as a broad spectrum of development experience,
    allowing them to address the concerns you encounter as a developer. Big Nerd Ranch
    instructors provide the necessary combination of knowledge and outstanding teaching
    experience, enabling our students to leave the Ranch with a vastly improved set
    of skills.


    # The Big Nerd Way


    We have developed “The Big Nerd Ranch Way”. This methodology guides the development
    and presentation of our classes. The style is casual but focused, with brief lectures
    followed by hands-on exercises designed to give you immediate, relevant understanding
    of each piece of the technology you are learning.


    # Your Stay At The Ranch


    One fee covers tuition, meals, lodging and transportation to and from the airport.
    At the Big Nerd Ranch, we remove the distractions inherent in standard corporate
    training by offering classes in quiet, comfortable settings in Atlanta, Georgia
    and Frankfurt, Germany.


    # Available Classes


    +   * Advanced Mac OS X

    * Android

    * Beginning Cocoa

    * Beginning iOS (iPhone/iPad)

    * Beginning Ruby on Rails

    * Cocoa Commuter Class in Spanish

    * Cocoa I

    * Cocoa II

    * Commuter iOS Class

    * Django

    * iOS (iPhone/iPad)

    * OpenGL

    * Python Mastery

    * Ruby on Rails I

    * Ruby on Rails II


    **Interested in a class?**

    Register online at www.bignerdranch.com or call 404.478.9005 for more information.

    Full class schedule, pricing and availability also online.'
