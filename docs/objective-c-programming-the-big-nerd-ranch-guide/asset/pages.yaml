  md: "Every time you right-shift a number one place, you half its value. (If it is\
    \ odd, round down.)\n\n# # Using enum to define bit masks\n\nOften you will want\
    \ to define a list of constants, each representing an integer with one bit turned\
    \ on. Then, these integers can be bitwise-ORed together and tested for using bitwise-AND,\
    \ as described above.\n\nThe elegant way to do this is to define an enum that\
    \ uses the left-shift operator to define the values. Here is how the constants\
    \ for the **UIDataDetector** are defined:\n\n```\n``` \nenum { \n    UIDataDetectorTypePhoneNumber\
    \   = 1 << 0,\n    UIDataDetectorTypeLink          = 1 << 1,\n    UIDataDetectorTypeAddress\
    \       = 1 << 2,\n    UIDataDetectorTypeCalendarEvent = 1 << 3,\n    UIDataDetectorTypeNone\
    \          = 0,\n    UIDataDetectorTypeAll           = NSUIntegerMax \n};\n```\n\
    ```\n\n# ## More bytes\n\nIn this chapter, we worked with unsigned char, which\
    \ is one 8-bit byte. Any unsigned integer type will work the same way. For example,\
    \ NSTextCheckingTypePhoneNumber is actually declared uint64_t, a 64-bit unsigned\
    \ number.\n\n# ## Challenge\n\nWrite a program that creates an unsigned 64-bit\
    \ integer such that every other bit is turned on. (There are actually two possible\
    \ resulting numbers: one is even, the other is odd. Create the odd one.) Display\
    \ the number."
