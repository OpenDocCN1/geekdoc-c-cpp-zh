- pgno: 245
  md: '*Can I change the variables that the block has copied?*


    By default, the variables captured by a block are constant within the block, and
    you cannot change their values. Object pointer variables, for example, are constant
    within the scope of the block. (Although you can still send the object messages
    that can change its contents, you cannot modify the pointer itself.)


    Sometimes, however, you want to be able to modify an external variable within
    a block. To do this, you must declare the external variable using the `__block`
    keyword. For instance, in the following code, you increment the external variable
    counter.


    ```

    ```objectivec

    __block int counter = 0;

    void (^counterBlock)() = ^{ counter++; };

    counterBlock(); // Increments counter to 1

    counterBlock(); // Increments counter to 2

    ```

    ```


    Without the `__block` keyword, you would get a compilation error in the block
    definition, indicating that the value of counter cannot be changed.


    # ## The block-based future


    Blocks can be difficult to understand and to use. However, they are extremely
    useful and powerful in heavily event-driven applications common in Mac and iOS
    programming. Apple’s APIs are using blocks more and more. For instance, the `ALAssetLibrary`
    and `GameKit` frameworks use many block-based methods. It’s a good idea to use
    Apple’s block-based methods whenever they are available to become more comfortable
    with blocks.


    # # Challenges


    # ## Anonymous block


    The example in this chapter puts the block declaration, assignment, and usage
    on three separate lines of code for readability.


    When you need to pass an integer into a method, such as `NSNumber`’s `numberWithInt:`,
    you can pass the int anonymously:


    ```

    ```objectivec

    // Option 1: Totally break it down

    int i;

    i = 5;

    NSNumber *num = [NSNumber numberWithInt:i];


    // Option 2: Skip the variable declaration

    NSNumber *num = [NSNumber numberWithInt:5];

    ```

    ```


    Because blocks are variables, you can do this with blocks as well. In fact, this
    is the most common way to use blocks. You will rarely declare a block variable
    so that you can pass the block into methods; you’ll usually use them anonymously.


    Modify the exercise in this chapter to pass the block anonymously as an argument
    to `enumerateObjectsUsingBlock:`. That is, keep the block, but get rid of the
    block variable.'
