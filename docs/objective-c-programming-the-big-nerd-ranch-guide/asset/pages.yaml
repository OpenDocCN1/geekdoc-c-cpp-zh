    \ are surprised by how integer division works. Try it:\n\n```\n#include <stdio.h>\n\
    \nint main(int argc, const char * argv[])\n{\n\tprintf(\"3 * 3 + 5 * 2 = %d\\\
    n\", 3 * 3 + 5 * 2);\n\tprintf(\"11 / 3 = %d\\n\", 11 / 3);\n\t\n\treturn 0;\n\
    }\n```\n\nYou'll get 11 / 3 = 3.66667, right? Nope. You get 11 / 3 is 3. When\
    \ you divide one integer by another, you always get a third integer. The system\
    \ rounds off toward zero. (So, -11 / 3 is -3)\n\nThis actually makes sense if\
    \ you think \"11 divided by 3 is 3 with a remainder of 2.\" And it turns out that\
    \ the remainder is often quite valuable. The modulus operator (%) is like /, but\
    \ it returns the remainder instead of the quotient:"
