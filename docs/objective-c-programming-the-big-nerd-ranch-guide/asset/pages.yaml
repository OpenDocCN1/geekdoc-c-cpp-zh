- pgno: 199
  md: "# ## Adding new tasks\n\nWhen you created the **UIButton** instance in application:didFinishLaunchingWithOptions:,\
    \ you gave it a target/action pair:\n\n```\n```\n[insertButton addTarget:self\n\
    \               action:@selector(addTask:)\n     forControlEvents:UIControlEventTouchUpInside];\n\
    ```\n```\n\nThe target is **self**, and the action is **addTask:**. So the Insert\
    \ button sends the **BNRAppDelegate** the **addTask:** message. Thus, we need\
    \ to implement the **addTask:** method in BNRAppDelegate.m.\n\n```\n```objective-c\n\
    - (void)addTask:(id)sender\n{\n    // Get the to-do item\n    NSString *t = [taskField\
    \ text];\n\n    // Quit here if taskField is empty\n    if ([t isEqualToString:@\"\
    \"]) {\n        return;\n    }\n\n    // Add it to our working array\n    [tasks\
    \ addObject:t];\n    // Refresh the table so that the new item shows up\n    [taskTable\
    \ reloadData];\n    // And clear out the text field\n    [taskField setText:@\"\
    \"];\n    // Dismiss the keyboard\n    [taskField resignFirstResponder];\n}\n\
    ```\n```\n\nWhat’s this **resignFirstResponder** business? Here’s the short version:\n\
    \nSome view objects are also *controls* – views that the user can interact with.\
    \ Buttons, sliders, and text fields are examples of controls. When there are controls\
    \ on the screen, one of them can be the *first responder*. Having first responder\
    \ status means that the control gets dibs on handling any text input from the\
    \ keyboard or any shake events (such as “Shake to Undo”).\n\nWhen the user taps\
    \ a control that can accept first responder status, that control is sent the **becomeFirstResponder**\
    \ message. Until another control becomes the first responder or the current control\
    \ is sent the **resignFirstResponder** message, that control will keep this status\
    \ and receive keyboard and shake input.\n\nWhen a text input control (like a text\
    \ field) becomes the first responder, the keyboard materializes on the screen.\
    \ As long as the current first responder is a control that accepts text input,\
    \ the keyboard will remain on the screen. At the end of **addTask:**, we tell\
    \ the text field to resign its status, which causes the keyboard to dematerialize.\n\
    \nBuild and run the application. Now you can add tasks!\n\n# ## Saving task data\n\
    \nThere is one final feature that you’ll add to iTahDoodle. Naturally, when users\
    \ quit the app, they’d like their to-do lists to stick around for later."
  merge: -1
  img_proc: true
- pgno: 200
  md: "When a Cocoa Touch application quits or is sent to the background, it sends\
    \ its delegate a message from the `UIApplicationDelegate` protocol so that the\
    \ delegate can take care of business and respond to these events gracefully. In\
    \ BNRAppDelegate .m, fill in the stubs of these two application delegate callbacks\
    \ to save the to-do list:\n\n```\n    - (void)applicationDidEnterBackground:(UIApplication\
    \ *)application\n    {\n        // This method is only called in iOS 4.0+\n\n\
    \        // Save our tasks array to disk\n        [tasks writeToFile:docPath()\
    \ atomically:YES];\n    }\n\n    - (void)applicationWillTerminate:(UIApplication\
    \ *)application\n    {\n        // This method is only called in iOS versions\
    \ prior to 4.0\n\n        // Save our tasks array to disk\n        [tasks writeToFile:docPath()\
    \ atomically:YES];\n    }\n```\n\nNow build and run your completed application.\
    \ This exercise was intended to give you a taste of iOS development. There's much,\
    \ much more out there to do and learn.\n\n# ## For the More Curious: What about\
    \ `main()`?\n\nWhen you began learning C and Objective-C, you learned that the\
    \ entry point into your program's code is the `main()` function. It's absolutely\
    \ true in Cocoa / Cocoa Touch development as well, although it's extremely rare\
    \ to edit this function in Cocoa and Cocoa Touch applications. Open main .m, and\
    \ you'll see why:\n\n```\n    return UIApplicationMain(argc, argv, nil,\n    \
    \                          NSStringFromClass([BNRAppDelegate class]));\n```\n\n\
    Well, that was anti-climactic. Only one line of actual code.\n\nThe `UIApplicationMain()`\
    \ function creates the necessary objects for your application to run. First, it\
    \ creates a single instance of the `UIApplication` class. Then, it creates an\
    \ instance of whatever class is denoted by the fourth and final argument and sets\
    \ it to be the application's delegate, so that it can send its delegate messages\
    \ when memory gets low, when the application is quit or backgrounded, or when\
    \ it finishes launching.\n\nAnd that's the trail from `main()` to `application:didFinishLaunchingWithOptions:`\
    \ and your custom code."
