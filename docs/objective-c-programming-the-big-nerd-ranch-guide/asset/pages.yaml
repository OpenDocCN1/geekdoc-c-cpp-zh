  md: '# # 25

    # Protocols


    At this point, I need to talk about a slightly abstract concept. Someone once
    said, “It is important to remember that who you are is different from what you
    do.” The same is true of objects: the class of an object is different from its
    *role* in a working system. For example, an object may be an instance of `NSMutableArray`,
    but its role in an application may be as a queue of print jobs to be run.


    Like the array-as-print-queue example, really great classes are more general than
    the role they may play in any particular application. Thus, instances of that
    class can be used in several different ways.


    We’ve talked about how to specify a class. Is it possible to specify a role? To
    some degree, we can specify a role using the `@protocol` construct.


    For example, in an iOS application, you frequently display data in an instance
    of the class `UITableView`. However, the `UITableView` object does not contain
    the data it displays; it has to get data from another source. You have to tell
    it “Here is the object that will fulfill the role of your data source.”


    Figure 25.1   UITableView datasource


    ![](img/5f9368899ebf8d92fc145f8def1e89f8_177_0.png)


    How did the developer who created the `UITableView` class specify the role of
    `UITableView`’s data source? He created a *protocol*. A protocol is a list of
    method declarations. Some methods are required, and some are optional. If your
    object is to fulfill the role, it must implement the required methods and may
    choose to implement the optional methods.


    The data source protocol for `UITableView` is named `UITableViewDataSource`, and
    here it is (comments are mine):'
  merge: -1
  img_proc: true
- pgno: 178
  md: "```\n\n// Just like classes, protocols can inherit from other protocols.\n\
    // This protocol inherits from the NSObject protocol\n@protocol UITableViewDataSource\
    \ <NSObject>\n\n// The following methods must be implemented by any table view\
    \ data source\n@required\n\n// A table view has sections, each section can have\
    \ several rows\n- (NSInteger)tableView:(UITableView *)tv numberOfRowsInSection:(NSInteger)section;\n\
    \n// This index path is two integers (a section and a row)\n// The table view\
    \ cell is what the user sees in that section/row\n- (UITableViewCell *)tableView:(UITableView\
    \ *)tv\n    cellForRowAtIndexPath:(NSIndexPath *)ip;\n\n// These methods may (or\
    \ may not) be implemented by a table view data source\n@optional\n\n// If data\
    \ source doesn't implement this method, table view has only one section\n- (NSInteger)numberOfSectionsInTableView:(UITableView\
    \ *)tv;\n\n// Rows can be deleted and moved\n- (BOOL)tableView:(UITableView *)tv\
    \ canEditRowAtIndexPath:(NSIndexPath *)ip;\n- (BOOL)tableView:(UITableView *)tv\
    \ canMoveRowAtIndexPath:(NSIndexPath *)ip;\n- (void)tableView:(UITableView *)tv\n\
    \    commitEditingStyle:(UITableViewCellEditingStyle)editingStyle\n    forRowAtIndexPath:(NSIndexPath\
    \ *)ip;\n- (void)tableView:(UITableView *)tv\n    moveRowAtIndexPath:(NSIndexPath\
    \ *)sourceIndexPath\n    toIndexPath:(NSIndexPath *)destinationIndexPath;\n//\
    \ To save ink and paper, I'm leaving out a few optional method declarations.\n\
    @end\n\n```\n\n(Like classes, protocols have reference pages in Apple's developer\
    \ documentation, which you can search for and browse to see the methods a protocol\
    \ contains.)\n\nWhen you create a class to fulfill the role of UITableView's data\
    \ source, you explicitly say, \"This class conforms to the UITableViewDataSource\
    \ protocol\" in the header file. It looks like this:\n\n```\n@interface TerrificViewController\
    \ : UIViewController <UITableViewDataSource>\n...\n@end\n\n```\n\nThat is, \"\
    TerrificViewController is a subclass of UIViewController and conforms to the UITableViewDataSource\
    \ protocol.\"\n\nIf your class conforms to several protocols, list them within\
    \ the angle brackets:\n\n```\n@interface TerrificViewController : UIViewController\
    \ <UITableViewDataSource, UITableViewDelegate, UITextFieldDelegate>\n\n```\n\n\
    Then, in the TerrificController.m file, you need to implement the required methods\
    \ in each protocol. If you forget to implement one of the required methods, you\
    \ will get a stern warning from the compiler."
