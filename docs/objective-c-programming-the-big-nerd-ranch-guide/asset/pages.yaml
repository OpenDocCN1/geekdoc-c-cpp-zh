  md: "# Helper objects\n\n**NSURLConnection** made up a *protocol* – a list of method\
    \ declarations – that the helper object can implement. Here are some of the methods\
    \ in that protocol:\n\n+   - (NSURLRequest \\*)connection:(NSURLConnection \\\
    *)c\n   willSendRequest:(NSURLRequest \\*)req\n   redirectResponse:(NSURLResponse\
    \ \\*)res;\n- (void)connection:(NSURLConnection \\*)sender\n   didReceiveAuthenticationChallenge:(NSURLAuthenticationChallenge\
    \ \\*)ch;\n- (void)connection:(NSURLConnection \\*)sender\n   didReceiveData:(NSData\
    \ \\*)data;\n- (void)connectionDidFinishLoading:(NSURLConnection \\*)sender;\n\
    - (void)connection:(NSURLConnection \\*)sender didFailWithError:(NSError \\*)error;\n\
    - (NSCachedURLResponse \\*)connection:(NSURLConnection \\*)sender\n   willCacheResponse:(NSCachedURLResponse\
    \ \\*)cachedResponse;\n\nAs you can see, an **NSURLConnection** lives a much richer\
    \ life than an **NSTimer**. Now you are going to create an object that implements\
    \ some or all of these methods and then introduce that object to the **NSURLConnection**\
    \ as its helper object. In particular, the **NSURLConnection** has a pointer called\
    \ *delegate*.\n\nFigure 24.4    **Logger** is the delegate of the **NSURLConnection**\n\
    \n![](img/5f9368899ebf8d92fc145f8def1e89f8_171_0.png)\n\nIn **main()**, create\
