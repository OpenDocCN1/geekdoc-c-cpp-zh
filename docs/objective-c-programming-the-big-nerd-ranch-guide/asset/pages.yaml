- pgno: 267
  md: "# # Command-Line Arguments\n\nYou know the arguments to `main()` that I’ve\
    \ been carefully avoiding discussing?\n\n```\n```\nint main (int argc, const char\
    \ * argv[])\n{\n…\n```\n\n```\n\nNow you are ready to learn about them. `argv`\
    \ is an array of C strings. `argc` tells you how many strings are in the array.\
    \ What do these string represent? Command-line arguments.\n\nThe command-line\
    \ tools that you’ve been creating can be run from Terminal. The Terminal app is\
    \ just a pretty interface to what is called a *shell*. There are a few different\
    \ shells with catchy names like `csh`, `sh`, `zsh`, and `ksh`, but nearly all\
    \ Mac users use `bash`. When you run a program from `bash`, after you type in\
    \ the program name, you can supply any number of arguments separated by whitespace.\
    \ Those arguments are packed into `argv` before `main()` is called.\n\nTruthfully,\
    \ Cocoa and iOS programmers seldom use `argv` and `argc`. However, if you ever\
    \ write a handy command-line tool, you will almost certainly need to know how\
    \ to utilize them.\n\nIn Xcode, create a new C Command Line Tool project called\
    \ Affirmation. Affirmation will take two arguments, a person’s name and a number\
    \ *n*. When you run it, that person will be declared cool *n* times.\n\n```\n\
    ```\n$ Affirmation Mikey 3\nMikey is cool.\nMikey is cool.\nMikey is cool.\n```\n\
    \n```\n\nBefore we do that, change `main()` to just print out each of the arguments\
    \ in `argv`:\n\n```\n```\n#include <stdio.h>\nint main (int argc, const char *\
    \ argv[])\n{\n    for (int i = 0; i < argc; i++) {\n        printf(\"arg %d =\
    \ %s\\n\", i, argv[i]);\n    }\n    return 0;\n}\n```\n\n```\n\nIf you are running\
    \ this from `bash`, you could just type in the arguments on the command line.\n\
    \n```\n```\n$ Affirmation Aaron 4\n```\n\n```"
