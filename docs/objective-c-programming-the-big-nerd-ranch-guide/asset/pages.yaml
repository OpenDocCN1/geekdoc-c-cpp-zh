  md: "This brings us to a rather deep question: what does *equal* mean? The class\
    \ `NSObject` defines a method called `isEqual:`. To check if two objects are equal,\
    \ you use the `isEqual:` method:\n\n```\n```\nif ([myDoctor isEqual:yourTennisPartner])\
    \ {\n    NSLog(@\"my doctor is equal to your tennis partner\");\n}\n```\n```\n\
    \n`NSObject` has a simple implementation of `isEqual:`. It looks like this:\n\n\
    ```\n```\n- (BOOL)isEqual: (id)other\n{\n    return (self == other);\n}\n```\n\
    ```\n\nThus, if you haven't overridden `isEqual:`, the code snippet is equivalent\
    \ to:\n\n```\n```\nif (myDoctor == yourTennisPartner) {\n    NSLog(@\"my doctor\
    \ is equal to your tennis partner\");\n}\n```\n```\n\nSome classes override `isEqual:`.\
    \ For example, in `NSSString`, `isEqual:` is overridden to compare the characters\
    \ in the string. For these classes, there is a difference between *equal* and\
    \ *identical*. Let's say I have two pointers to strings:\n\n```\n```\nNSSString\
    \ *x = ...\nNSSString *y = ...\n```\n```\n\nx and y are *identical* if they contain\
    \ the exact same address. x and y are *equal* if the strings they point to contain\
    \ the same letters in the same order.\n\nThus, identical objects are always equal.\
    \ Equal objects are not always identical.\n\nDoes this difference matter? Yes.\
    \ For example, `NSMutableArray` has two methods:\n\n```\n```\n- (NSUInteger)indexOfObject:\
    \ (id)anObject;\n- (NSUInteger)indexOfObjectIdenticalTo: (id)anObject;\n```\n\
    ```\n\nThe first steps through the collection asking each object “isEqual:anObject?”\
    \ The second steps through the collection asking each object “== anObject”?\n\n\
    # # NSDictionary/NSMutableDictionary\n\nAs you know, arrays are indexed by a number;\
    \ it is easy to ask “Give me object 10.” Dictionaries are indexed by a string;\
    \ it is easy to ask “Give me the object stored under the key *favoriteColor*.”\
    \ More precisely, a dictionary is a collection of key-value pairs. The key is\
    \ typically a string, and the value can be any sort of object. These key-value\
    \ pairs are not kept in any particular order.\n\nLet's make a dictionary of executives.\
    \ The key will be an executive title, and the value will be an instance of `Employee`.\
    \ The first employee will be put in the dictionary under @\"CEO\"; the second\
    \ under @\"CTO\". Change your main.m to create and populate the `NSMutableDictionary`.\
    \ Then, print out the dictionary of executives. Finally, set the pointer to the\
    \ dictionary to `nil` so that you can see the dictionary being deallocated."
  merge: -1
  img_proc: true
