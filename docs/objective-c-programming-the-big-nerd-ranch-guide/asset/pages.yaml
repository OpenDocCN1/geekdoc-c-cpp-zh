  md: '# 27


    # Your First iOS Application


    In this chapter, you are going to create an iOS application: a simple to-do list
    application called iTahDoodle that stores its data as a property list. Here’s
    what iTahDoodle will look like when you’re done.


    ![](img/5f9368899ebf8d92fc145f8def1e89f8_187_0.png)


    All iOS applications are event-driven applications. The run loop waits for events.
    The waiting application then responds to events generated by the user (like a
    button tap) or the system (like a low-memory warning).


    # ## Getting started with iTahDoodle


    In Xcode, choose File → New → New Project…. Under the iOS section (not the Mac
    OS X section), click on Application. From the template choices that appear, select
    Empty Application.'
