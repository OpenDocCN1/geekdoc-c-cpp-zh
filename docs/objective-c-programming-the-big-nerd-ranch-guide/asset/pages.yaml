  md: "# 30\nProperties\n\nIn the last chapter, you created a class called **Appliance**\
    \ that had two properties: *productName* and *voltage*. Let’s review how those\
    \ properties work.\n\nIn *Appliance.h*, you declared two instance variables to\
    \ hold the data:\n\n```\n{\n    NSString *productName;\n    int voltage;\n}\n\
    ```\n\nYou also declared accessor methods for them. You *could* have declared\
    \ the accessors like this:\n\n```\n- (void)setProductName:(NSString *)s;\n- (NSString\
    \ *)productName;\n- (void)setVoltage:(int)x;\n- (int)voltage;\n```\n\nHowever,\
    \ you used the `@property` construct instead:\n\n```\n@property (copy) NSString\
    \ *productName;\n@property int voltage;\n```\n\nIn *Appliance.m*, you *could*\
    \ have implemented the accessor methods explicitly like this:\n\n```\n- (void)setProductName:(NSString\
    \ *)s\n{\n    productName = [s copy];\n}\n\n- (NSString *)productName\n{\n   \
    \ return productName;\n}\n\n- (void)setVoltage:(int)x\n{\n    voltage = x;\n}\n\
    \n- (int)voltage\n{\n    return voltage;\n}\n```"
  merge: -1
  img_proc: true
- pgno: 228
  md: "However, you used the @synthesize construct to implement them:\n\n```\n@synthesize\
    \ productName, voltage;\n```\n\nObjective-C compiler trivia: When compiling for\
    \ iOS or a 64-bit Mac OS X program, you don’t need to declare the instance variables.\
    \ The @property/@synthesize calls are sufficient to make the space for the data.\n\
    \nOpen up Appliances and comment out the instance variables in Appliance.h:\n\n\
    ```\n{\n    // NSString *productName;\n    // int voltage;\n}\n```\n\nRebuild\
    \ and run the program.\n\nIn this book, we always declare the instance variables.\
    \ It is a nice form of documentation and makes your code usable within 32-bit\
    \ Mac OS X programs. Uncomment the instance variables.\n\n# Property attributes\n\
    \nNow let’s take a closer look at the different attributes you can use to control\
    \ how the accessors for a property will be created.\n\n# Mutability\n\nA property\
    \ can be declared readwrite or readonly. The default is readwrite, which means\
    \ that both a setter and a getter method are created. If you don’t want a setter\
    \ method to be created, you mark the property as readonly:\n\n```\n@property (readonly)\
    \ int voltage;\n```\n\n# Lifetime specifiers\n\nA property can also be declared\
    \ unsafe_unretained, strong, weak, or copy. This option determines how the setter\
    \ handles its memory management.\n\nunsafe_unretained is the default and the simplest:\
    \ it just assigns the passed-in value to the property. Imagine this declaration\
    \ and definition:\n\n```\n@property (unsafe_unretained) int averageScore;\n//\
    \ \"@property int averageScore\" would also work here\n...\n@synthesize averageScore;\n\
    ```\n\nThis would result in a setter method that’s pretty much equivalent to:\n\
    \n```\n- (void)setAverageScore:(int)d\n{\n    averageScore = d;\n}\n```\n\nIn\
    \ Appliance, voltage is an unsafe, unretained property. You will always use unsafe_unretained\
    \ for properties that hold non-objects."
  merge: -1
  img_proc: true
- pgno: 229
  md: "strong, as you learned in Chapter 20, will ensure that a strong reference is\
    \ kept to the passed-in object. It will also let go of ownership of the old object\
    \ (which will then deallocate itself if it has no other owners). For properties\
    \ that hold objects, you will usually use strong.\n\nweak does not imply ownership\
    \ of the object pointed to. It will synthesize a setter that sets the property\
    \ to the passed-in object. If this object is deallocated, the property will be\
    \ set to nil. (Note that if the pointer is unsafe_unretained and the object it\
    \ points to is deallocated, you will have a “dangling pointer.” Sending a message\
    \ to a dangling pointer usually crashes your program.)\n\ncopy forms a strong\
    \ reference to a copy of the object passed in. But, there is a detail in this\
    \ that most people misunderstand...\n\n# ### copy\n\nThe copy option makes a copy\
    \ of an object and then changes the pointer to refer to this copy. Imagine you\
    \ had a property declaration and definition like this:\n\n```\n```\n@property\
    \ (copy) NSString *lastName;\n@synthesize lastName;\n```\n```\n\nThe generated\
    \ setter method would look somewhat like this:\n\n```\n```\n- (void)setLastName:\
    \ (NSString *)d\n{\n    lastName = [d copy];\n}\n```\n```\n\nUse of the copy attribute\
    \ is most common with object types that have mutable subclasses. For example,\
    \ **NSString** has a subclass called **NSMutableString**. You can imagine that\
    \ your **setLastName:** method might be passed a mutable string:\n\n```\n```\n\
    // Create a mutable string\nNSMutableString *x = [[NSMutableString alloc] initWithString:@\"\
    Ono\"];\n\n// Pass it to setLastName:\n[myObj setLastName:x];\n\n// 'copy' prevents\
    \ this from changing the lastName\n[x appendString:@\" Lennon\"];   \n```\n```\n\
    \nWhat if the object passed in is *not* mutable? It seems wasteful to make a copy\
    \ of an immutable object. The **copy** method just calls **copyWithZone:** and\
    \ passes **nil** as the argument. For example, in **NSString**, the **copyWithZone:**\
    \ method is overridden to look like this:\n\n```\n```\n- (id)copyWithZone: (NSZone\
    \ *)z\n{\n    return self;\n}\n```\n```\n\nThat is, it doesn’t make a copy at\
    \ all. (Note that **NSZone** and memory zoning in general are all but deprecated,\
    \ vestigial features of Cocoa programming, so we won’t go further into them here.\
    \ **copyWithZone:** still has some use, however, and has not been entirely phased\
    \ out.)\n\nFor objects that come in mutable and immutable versions, the **copy**\
    \ method returns an immutable copy. For example, **NSMutableString** has a **copy**\
    \ method that returns an instance of **NSString**. If you want the copy to be\
    \ a mutable object, use the **mutableCopy** method."
  merge: -1
  img_proc: true
- pgno: 230
  md: "There is no property lifetime specifier called *mutableCopy*. If you wish for\
    \ your setter to set the property to be a mutable copy of an object, you must\
    \ implement the setter yourself so that it calls the *mutableCopy* method on the\
    \ incoming object. For example, in *OwnedAppliance*, you might create a *setOwnerNames:*\
    \ method:\n\n```\n- (void)setOwnerNames: (NSSet *)newNames\n{\n\townerNames =\
    \ [newNames mutableCopy];\n}\n```\n\n# More about copying\n\nMost Objective-C\
    \ classes have no *copyWithZone:* method at all. Objective-C programmers make\
    \ fewer copies than you might think.\n\nCuriously, the *copy* and *mutableCopy*\
    \ methods are defined in *NSObject* like this:\n\n```\n- (id)copy\n{\n\treturn\
    \ [self copyWithZone:NULL];\n}\n\n- (id)mutableCopy\n{\n\treturn [self mutableCopyWithZone:NULL];\n\
    }\n```\n\nThus, if you have some code like this:\n\n```\nAppliance *b = [[Appliance\
    \ alloc] init];\nAppliance *c = [b copy];\n```\n\nYou will get an error like this:\n\
    \n```\n-[Appliance copyWithZone:]: unrecognized selector sent to instance 0x100110130\n\
    ```\n\n# Advice on atomic vs. nonatomic\n\nThis is an introductory book on programming,\
    \ and the *atomic/nonatomic* option relates to a relatively advanced topic known\
    \ as multithreading. Here is what you need to know: the *nonatomic* option will\
    \ make your setter method run a tiny bit faster. If you look at the headers for\
    \ Apple’s UIKit, every property is marked as *nonatomic*. You should make your\
    \ properties *nonatomic*, too.\n\n(I give this advice to everyone. In every group,\
    \ however, there is someone who knows just enough to be a pain. That person says,\
    \ “But when I make my app multithreaded, I’ll need the protection that atomic\
    \ setter methods get me.” And I *should* say, “I don’t think you will write multithreaded\
    \ code anytime soon. And when you do, I don’t think atomic setter methods are\
    \ going to help.” But what I really say is “OK, then you should leave your setters\
    \ *atomic*.” Because you can’t tell someone something they aren’t ready to hear.)\n\
    \nIn *Appliance.h*, make your accessors non-atomic:\n\n```\n@property (copy, **nonatomic**)\
    \ NSStr ing *productName;\n@property (**nonatomic**) int voltage;\n```\n\nSadly,\
    \ at this time, the default for properties is *atomic*, so you do have to make\
    \ this change."
  merge: -1
  img_proc: true
- pgno: 231
  md: "# # Key-value coding\n\nKey-value coding is the ability to read and set a property\
    \ using its name. The key-value coding methods are defined in *NSObject*, and\
    \ thus every object has this capability.\n\nOpen main.m and find the line:\n\n\
    ```\n    [a setProductName:@\"Washing Machine\"];\n```\n\nRewrite the same line\
    \ to use key-value coding:\n\n```\n    [a setValue:@\"Washing Machine\" forKey:@\"\
    productName\"];\n```\n\nIn this case, the setValue:forKey: method, as defined\
    \ in *NSObject*, will go looking for a setter method named setProductName:. If\
    \ the object doesn't have a setProductName: method, it will access the instance\
    \ variable directly.\n\nYou can also read the value of a variable using key-value\
    \ coding. Add a line to main.m that prints out the product name:\n\n```\n```\n\
    int main (int argc, const char * argv[])\n{\n    autorelease {\n\n        Appliance\
    \ *a = [[Appliance alloc] init];\n        NSLog(@\"a is %@\", a);\n        [a\
    \ setValue:@\"Washing Machine\" forKey:@\"productName\"];\n        [a setVoltage:240];\n\
    \        NSLog(@\"a is %@\", a);\n\n        NSLog(@\"the product name is %@\"\
    , [a valueForKey:@\"productName\"]);\n    }\n    return 0;\n}\n```\n```\n\nIn\
    \ this case, the valueForKey: method, as defined in *NSObject*, goes looking for\
    \ an accessor named productName. If there is no productName method, the instance\
    \ variable is accessed directly.\n\nIf you type the name of the property wrong,\
    \ you won't get warning from the compiler, but there will be a runtime error.\
    \ Make this mistake in main.m:\n\n```\n    NSLog(@\"the product name is %@\",\
    \ [a valueForKey:@\"productNammme\"]);\n```\n\nWhen you build and run it, you\
    \ will see an error:\n\n```\n```\n*** Terminating app due to uncaught exception\
    \ 'NSUnknownKeyException',\nreason: '<Appliance 0x100108ddd0> valueForKeyForUndefinedKey:]'\
    \ this class is not key value coding-compliant for the key productNammme.'\n```\n\
    ```\n\nFix the error before you go on.\n\nWhy is key-value coding interesting?\
    \ Anytime a standard framework wants to push data into your objects, it will use\
    \ setValue:forKey:. Anytime a standard framework wants to read data from your\
    \ objects, it will use valueForKey:. For example, Core Data is a framework that\
    \ makes it easy to save your objects to a SQLite database and then bring them\
    \ back to life. It manipulates your custom data-bearing objects using key-value\
    \ coding."
  merge: -1
  img_proc: true
- pgno: 232
  md: "# Chapter 30   Properties\n\nTo prove that key-value coding will manipulate\
    \ your variables even if you have no accessors, comment out the @property declaration\
    \ for productName in Appliance.h:\n\n```\n```text\n#import <Foundation/Foundation.h>\n\
    \n@interface Appliance : NSObject {\n    NSString *productName;\n    int voltage;\n\
    }\n// @property (copy) NSString *productName;\n@property (nonatomic) int voltage;\n\
    \n// The designated initializer\n- (id)initWithProductName:(NSString *)pn;\n\n\
    @end\n```\n```\n\nAlso, remove all use of the methods setProductName: and productName\
    \ from Appliance.m:\n\n```\n```text\n@implementation Appliance\n\n@synthesize\
    \ voltage;\n\n- (id)initWithProductName:(NSString *)pn\n{\n    self = [super init];\n\
    \    if (self) {\n        productName = [pn copy];\n        [self setVoltage:120];\n\
    \    }\n    return self;\n}\n\n- (id)init\n{\n    return [self initWithProductName:@\"\
    Unknown\"];\n}\n\n- (NSString *)description\n{\n    return [NSString stringWithFormat:@\"\
    <%d volts>\", productName, voltage];\n}\n\n@end\n```\n```\n\nBuild and run the\
    \ program. Note that even though you have no accessor methods for productName,\
    \ the variable can still be set and read from other methods. This is an obvious\
    \ violation of the idea of object encapsulation – methods of an object are public,\
    \ but the instance variables are delicate and should be kept private. If key-value\
    \ coding weren’t astonishingly useful, no one would tolerate it.\n\n# ### Non-object\
    \ types\n\nThe key-value coding methods are designed to work with objects, but\
    \ some properties hold a non-object type, like an int or a float. For example,\
    \ voltage is an int. How do you set voltage using key-value coding? You use an\
    \ NSNumber."
  merge: -1
  img_proc: true
