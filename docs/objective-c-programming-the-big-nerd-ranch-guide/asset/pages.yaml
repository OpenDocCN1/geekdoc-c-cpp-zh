  md: "# ## Getting the data at an address\n\nIf you have an address, you can get\
    \ the data stored there using the * operator. Have the log display the value of\
    \ the integer stored at `addressOfI`.\n\n```\n```\nint main(int argc, const char\
    \ * argv[])\n{\n    int i = 17;\n    int *addressOfI = &i;\n    printf(\"i stores\
    \ its value at @%p\\n\", addressOfI);\n    printf(\"this function starts at @%p\\\
    n\", main);\n    printf(\"the int stored at addressOfI is %d\\n\", *addressOfI);\n\
    \    return 0;\n}\n```\n```\n\nNotice that the asterisk is used two different\
    \ ways The first is in the declaration where you declare the variable `addressOfI`\
    \ to be an int *. That is, it is a pointer to a place where an int can be stored.\n\
    \nThe second is where you read the int value that is stored at the address stored\
    \ in `addressOfI`. (Pointers are also called references. Thus, using the pointer\
    \ to read data at the address is sometimes called *dereferencing* the pointer.)\n\
    \nYou can also use the * operator on the left-hand side of an assignment to store\
    \ data at a particular address:\n\n```\n```\nint main(int argc, const char * argv[])\n\
    {\n    int i = 17;\n    int *addressOfI = &i;\n    printf(\"i stores its value\
    \ at @%p\\n\", addressOfI);\n    *addressOfI = 89;\n    printf(\"Now i is %d\\\
    n\", i);\n    return 0;\n}\n```\n```\n\nBuild and run your program.\n\nDon’t worry\
    \ if you don’t have pointers squared away in your mind just yet. We’ll spend a\
    \ lot of time working with pointers in this book, so you’ll get plenty of practice.\n\
    \nNow let’s make a common programming mistake. Remove the * from the fourth line\
    \ of `main()` so that it reads\n\n```\n```\naddressOfI = 89;\n```\n```\n\nNotice\
    \ Xcode pops up a warning that says Incompatible integer to pointer conversion\
    \ assigning to ‘int *’ to ‘int’. Fix the problem.\n\n# ## How many bytes?\n\n\
    Given that everything lives in memory and that you now know how to find the address\
    \ where data starts, the next question is “How many bytes does this data type\
    \ consume?”\n\nUsing `sizeof()` you can find the size of a data type. For example,"
