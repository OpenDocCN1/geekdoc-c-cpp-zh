    \ = 'o';\nstart[2] = 'v';\nstart[3] = 'e';\nstart[4] = '\\0';\n\nprintf(\"%s has\
    \ %zu characters\\n\", start, strlen(start));\nprintf(\"The third letter is %c\\\
    n\", start[2]);\n\nfree(start);\nstart = NULL;\n\nreturn 0;\n}\n```\n```\n\nBuild\
    \ and run it.\n\nIt should be mentioned that this works with any data type. Here,\
    \ for example, I can make a list of my favorite 3 floating point numbers and print\
    \ them out:\n\n```\n```\nint main ( int argc, const char * argv[ ])\n{\n    //\
    \ Claim a chunk of memory big enough to hold three floats\n    float *favorites\
    \ = malloc(3 * sizeof(float));\n\n    // Push values into the locations in that\
    \ buffer\n    favorites[0] = 3.14158;\n    favorites[1] = 2.71828;\n    favorites[2]\
    \ = 1.41421;\n\n    // Print out each number on the list\n    for (int i = 0;\
    \ i < 3; i++) {\n        printf(\"%.4f is favorite %d\\n\", favorites[i], i);\n\
    \    }\n\n    // Free the memory so that it can be reused\n    free(favorites);\n\
    \    favorites = NULL;\n\n    return 0;\n}\n```\n```\n\nThe only interesting difference\
    \ here is that `favorites` is typed as a `float *`. A float is 4 bytes. Thus `favorites\
    \ + 1` is 4 bytes further in memory than `favorites`.\n\n# ## String literals\n\
