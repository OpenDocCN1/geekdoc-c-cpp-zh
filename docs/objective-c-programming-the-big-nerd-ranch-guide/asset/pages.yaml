    never-ending stream of suggestions and corrections. They are Scott Ritchie, Mark
    Fenoglio, Brian Hardy, Christian Keur, and Alex Silverman.


    +   - My tireless editor, Susan Loper, took my stream-of-consciousness monologue
    that stumbled across everything a programmer needs to know and honed it into an
    approachable primer.


