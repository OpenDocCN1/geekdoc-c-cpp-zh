- pgno: 130
  md: "```\n#import \"Person.h\"\n@class Asset;\n\n@interface Employee : Person\n\
    {\n    int employeeID;\n    NSMutableArray *assets;\n}\n@property int employeeID;\n\
    - (void)addAssetsObject:(Asset *)a;\n- (unsigned int)valueOfAssets;\n\n@end\n\
    ```\n\nNotice the line that says `@class Asset;`. As the compiler is reading this\
    \ file, it will come across the class name `Asset`. If it doesn't know about the\
    \ class, it will throw an error. The `@class Asset;` line tells the compiler “There\
    \ is a class called `Asset`. Don't panic when you see it in this file. That's\
    \ all you need to know for now.”\n\nUsing `@class` instead of `#import` gives\
    \ the compiler less information, but makes the processing of this particular file\
    \ faster. You can use `@class` with `Employee.h` and other header files because\
    \ the compiler doesn't need to know a lot to process a file of declarations.\n\
    \nNow turn your attention to `Employee.m`. With a to-many relationship, you need\
    \ to create the collection object (an array, in our case) before you put anything\
    \ in it. You can do this when the original object (an employee) is first created,\
    \ or you can be lazy and wait until the collection is needed. Let's be lazy.\n\
    \n```\n#import \"Employee.h\"\n#import \"Asset.h\"\n\n@implementation Employee\n\
    \n@synthesize employeeID;\n\n- (void)addAssetsObject:(Asset *)a\n{\n    // Is\
    \ assets nil?\n    if (!assets) {\n\n        // Create the array\n        assets\
    \ = [NSMutableArray alloc] init];\n    }\n    [assets addObject:a];\n}\n\n- (unsigned\
    \ int)valueOfAssets\n{\n    // Sum up the resale value of the assets\n    unsigned\
    \ int sum = 0;\n    for (Asset *a in assets) {\n        sum += [a resaleValue];\n\
    \    }\n    return sum;\n}\n```"
