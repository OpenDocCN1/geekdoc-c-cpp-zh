  md: '# ## 16

    # Developer Documentation


    In the last chapter, I gave you some useful tidbits about the class NSArray. When
    you begin programming without my guidance (including taking on Challenges in this
    book), you will need to find such tidbits yourself. This is where Apple''s documentation
    comes in.


    To see the documentation in Xcode, bring up the Organizer (click the [icon] button
    at the top right of the Xcode window) and choose the Documentation tab.


    ![](img/5f9368899ebf8d92fc145f8def1e89f8_103_0.png)


    There are essentially five types of documentation that Apple provides:


    +   - *References:* Every Objective-C class and every C function is tersely documented
    in these pages.


    +   - *Guides and Getting Started:* Guides are less terse and group ideas conceptually.
    For example, there is an *Error Handling Programming Guide* that describes the
    myriad of ways that Mac and iOS developers can be informed that something has
    gone wrong.'
  merge: -1
  img_proc: true
- pgno: 104
  md: '+   * **Sample Code:** These are small, complete projects that demonstrate
    how Apple expects its technology to be used. For example, there is a WeatherMap
    project that shows how to make custom annotations on iOS map views.

    * **Release Notes:** Every time a new version of Mac OS or iOS comes out, it is
    accompanied by a set of release notes. The release notes tell developers what
    has changed since the last version.

    * **Technical notes, Articles, Coding How-to’s, and Technical Q&A’s:** These are
    bite-sized documents that address specific issues.


    You can browse the documentation, but there is a lot of it. More commonly, you
    will access the documentation via search.


    # Reference pages


    At the top of the lefthand pane in Organizer, click the 🚀 button to bring up the
    search panel. Type NSArray into the search field, and the search results will
    appear below the search field. In the Reference section, click on NSArray to see
    the *reference page* for *NSArray*.


