- pgno: 127
  md: '![](img/5f9368899ebf8d92fc145f8def1e89f8_127_0.png)


    ![](img/5f9368899ebf8d92fc145f8def1e89f8_127_1.png)


    +   - You end up with a lot of distinct objects using up your program’s memory.
    You need the objects being used to stay around, but you want the unnecessary ones
    to be deallocated (have their memory returned to the heap) so that their memory
    can be reused. Reusing memory keeps your program’s memory footprint as small as
    possible, which will make your entire computer feel more responsive. On a mobile
    device (like an iPhone), the operating system will kill your program if its memory
    footprint gets too big.


    # ## Object ownership and ARC


    To manage these issues, we have the idea of *object ownership*. When an object
    has an object instance variable, the object with the pointer is said to *own*
    the object that is being pointed to.


    From the other end of things, an object knows how many *owners* it currently has.
    For instance, in the diagram above, the instance of **Person** has three owners:
    the **Employee** object and the two **Child** objects. When an object has zero
    owners, it figures no one needs it around anymore and deallocates itself.


    The owner count of each object is handled by Automatic Reference Counting. ARC
    is a recent development in Objective-C. Before Xcode 4.2, we managed ownership
    manually and spent a lot of time and effort doing so. (There’s more about manual
    reference counting and how it worked in the final section of Chapter 20. All the
    code in this book, however, assumes that you are using ARC.)


    Let’s expand the **BMITime** project to see how ownership works in practice. It
    is not uncommon for a company to keep track of what assets have been issued to
    which employee. We are going to create an **Asset** class, and each **Employee**
    will have an array containing his or her assets.'
