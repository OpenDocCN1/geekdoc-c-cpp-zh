  md: '![](img/5f9368899ebf8d92fc145f8def1e89f8_189_0.png)


    Whatever you enter as the Class Prefix will be prepended to the name of the initial
    class that the template creates for you. This two- or three-letter prefix will
    keep your class names distinct from Apple’s or anyone else’s. (Use BNR for now
    to keep our code in sync.)


    Notice that Apple’s code includes prefixes. All of Apple’s classes that you’ve
    seen so far begin with the prefix **NS**, which stands for NeXTSTEP, the platform
    for which the Foundation framework was originally designed. In this chapter, you’ll
    also use classes from the UIKit framework, and they will begin with **UI**.


    Finally, make **iTahDoodle** an iPhone (as opposed to iPad or Universal) application.
    iTahDoodle will use Automatic Reference Counting but not use Core Data or unit
    tests.


    # # BNRAppDelegate


    When Xcode created your project via the Empty Application template, it created
    one class for you: **BNRAppDelegate**. Your “app delegate” is the starting point
    of your application, and every iOS application has one. The single instance of
    **BNRAppDelegate** is responsible for processing events and coordinating the work
    of other objects in the application.


    Open BNRAppDelegate.h. Add four instance variables and an instance method. The
    first three instance variables are pointers to objects that the user can see and
    interact with – a table view that will display all the tasks to be done, a text
    field where you can enter a new task, and a button that will add the new task
    to the table. The fourth object is a mutable array. This is where you will store
    the tasks as strings.'
