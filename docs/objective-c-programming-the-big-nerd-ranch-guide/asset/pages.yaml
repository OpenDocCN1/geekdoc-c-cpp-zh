  md: '# ## FINELY-CRAFTED APPLICATIONS


    Big Nerd Ranch is a leading developer of downloadable mobile and desktop Mac applications.
    Several of our most intriguing iPhone and desktop apps are available for purchase
    in the iTunes store.


    # **Mobile Applications**


    Smartphones have started to take over the mobile phone market. Since the inception
    of the iPhone, we have created dozens of apps for our clients and now have a roster
    of our own applications including games, utilities, music and educational apps.
    As an ever-evolving frontier of technology, Big Nerd Ranch is committed to staying
    ahead of the curve.


    # **Mobile Apps**


    The world has gone mobile. If your company doesn’t have a mobile application,
    you are behind the curve. As of early 2011, the iTunes app store has grown to
    nearly 400,000 apps and the Android market has climbed to more than 250,000 applications.
    Google has unveiled its Android platform with an app store of its own and dozens
    of smartphone manufacturers have announced Android-powered devices. RIM has launched
    App World, Palm has its Palm Store, Nokia launched Ovi (its online store) and
    Microsoft has unveiled Windows Marketplace.


    While still leading the way, the iOS market has put up some staggering statistics:


    +   - Total iOS app store downloads: 10.3 billion

    - iPhone apps are being downloaded at a rate of 30 million per day.

    - As of early 2011, when the app store hit 10 billion downloads, it did so in
    half the time (31 months versus 67 months) that it took for songs in the iTunes
    store to hit the same mark.

    - The average number of apps downloaded for iPhone/iPad/iPod touch is currently
    at more than 60.'
