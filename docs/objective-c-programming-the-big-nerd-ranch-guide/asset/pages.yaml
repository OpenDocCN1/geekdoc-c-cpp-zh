- pgno: 51
  md: "# 6 Numbers\n\nWe've used numbers to measure and display temperature, weight,\
    \ and how long to cook a turkey. Now let's take a closer look at how numbers work\
    \ in C programming. On a computer, numbers come in two flavors: integers and floating-point\
    \ numbers. You have already used both. This chapter is an attempt to codify what\
    \ a C programmer needs to know about these numbers.\n\n# printf()\n\nBut before\
    \ we get to numbers, let's take a closer look at the `printf()` function you've\
    \ been using. `printf()` prints a *string* to the log. A string is a string of\
    \ characters. Basically, it's text.\n\nReopen your ClassCertificates project.\
    \ In main.c, find **congratulateStudent()**.\n\n```\nvoid congratulateStudent(char\
    \ *student, char *course, int numDays)\n{\n    printf(\"%s has done as much %s\
    \ Programming as I could fit into %d days.\\n\", student, course, numDays);\n\
    }\n```\n\nWhat does this call to `printf()` do? Well, you've seen the output;\
    \ you know what it does. Now let's figure out how.\n\n`printf()` is a function\
    \ that accepts a string as an argument. You can make a *literal string* (as opposed\
    \ to a string that's stored in a variable) by surrounding text in double quotes.\n\
    \nThe string that `printf()` takes as an argument is known as the *format string*,\
    \ and the format string can have *tokens*. The three tokens in this string are\
    \ %s, %s, and %d. When the program is run, the tokens are replaced with the values\
    \ of the variables that follow the string. In this case, those variables are *student*,\
    \ *course*, and *numDays*. Notice that they are replaced in order in the output.\
    \ If you swapped *student* and *course* in the list of variables, you would see\n\
    \nCocoa has done as much Mark Programming as I could fit into 5 days.\n\nHowever,\
    \ tokens and variables are not completely interchangeable. The %s token expects\
    \ a string. The %d expects an integer. (Try swapping them and see what happens.)\n\
    \nNotice that *student* and *course* are declared as type *char \\** . For now,\
    \ just read *char \\** as a type that is a string. We'll come back to strings\
    \ in Objective-C in Chapter 14 and back to *char \\** in Chapter 34.\n\nFinally,\
    \ what's with the \\n? In `printf()` statements, you have to include an explicit\
    \ new-line character or all the log output will run together on one line. \\n\
    \ represents the new-line character.\n\nNow let's get back to numbers."
  merge: -1
  img_proc: true
- pgno: 52
  md: '# Integers


    An integer is a number without a decimal point – a whole number. Integers are
    good for problems like counting. Some problems, like counting every person on
    the planet, require really large numbers. Other problems, like counting the number
    of children in a classroom, require numbers that aren''t as large.


    To address these different problems, integer variables come in different sizes.
    An integer variable has a certain number of bits in which it can encode a number,
    and the more bits the variable has, the larger the number it can hold. Typical
    sizes are: 8-bit, 16-bit, 32-bit, and 64-bit.


    Similarly, some problems require negative numbers, while others do not. So, integer
    types come in signed and unsigned varieties.


    An unsigned 8-bit number can hold any integer from 0 to 255. How did I get that?
    2⁸ = 256 possible numbers. And we choose to start at 0.


    A signed 64-bit number can hold any integer from -9,223,372,036,854,775,808 to
    9,223,372,036,854,775,807. One bit for the sign leaves. 2⁶³ = 9,223,372,036,854,775,808.
    There is only one zero.


    When you declare an integer, you can be very specific:


    ```

    UInt32 x; // An unsigned 32-bit integer

    SInt16 y; // An signed 16-bit integer

    ```


    However, it is more common for programmers just to use the descriptive types that
    you learned in Chapter 3.


    ```

    char a;        // 8 bits

    short b;       // Usually 16 bits (depending on the platform)

    int c;         // Usually 32 bits (depending on the platform)

    long d;        // 32 or 64 bits   (depending on the platform)

    long long e;  // 64 bits

    ```


    Why is char a number? Any character can be described as an 8-bit number, and computers
    prefer to think in numbers. What about sign? char, short, int, long, and long
    long are signed by default, but you can prefix them with unsigned to create the
    unsigned equivalent.


    Also, the sizes of integers depend on the platform. (A platform is a combination
    of an operating system and a particular computer or mobile device.) Some platforms
    are 32-bit and others are 64-bit. The difference is in the size of the memory
    address, and we''ll talk more about that in Chapter 8.


    Apple has created two integer types that are 32-bit on 32-bit platforms and 64-bit
    on 64-bit platforms:


    ```

    NSInteger g;

    NSUInteger h;

    ```


    In much of Apple''s code, you will see these types used. They are, for all intents
    and purposes, the same as long and unsigned long.


    # Tokens for displaying integers


    Create a new project: a C Command Line Tool called Numbers. In main.c, create
    an integer and print it out in base-10 (as a decimal number) using printf():'
