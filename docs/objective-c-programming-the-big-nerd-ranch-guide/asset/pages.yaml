  md: "# self\n\nInside any method, you have access to the implicit local variable\
    \ `self`. `self` is a pointer to the object that is running the method. It is\
    \ used when an object wants to send a message to itself. For example, many Objective-C\
    \ programmers are quite religious about accessor methods; they never read or write\
    \ to an instance variable except using its accessor methods. Update your `bodyMassIndex`\
    \ method to please the purists:\n\n```\n- (float)bodyMassIndex\n{\n    float h\
    \ = [self heightInMeters];\n    return [self weightInKilos] / (h * h);\n}\n```\n\
    \nHere an instance of `Person` sends itself two messages, `heightInMeters` and\
    \ `weightInKilos`, to get the values of its instance variables.\n\nYou can also\
    \ pass `self` as an argument to let other objects know where the current object\
    \ is. For example, your `Person` class might have a method `addYourselfToArray:`\
    \ that would look like this:\n\n```\n- (void)addYourselfToArray:(NSMutableArray\
    \ *)theArray\n{\n    [theArray addObject:self];\n}\n```\n\nHere you use `self`\
    \ to tell the array where the instance of `Person` lives. It is literally its\
    \ address.\n\n# Multiple files\n\nNotice that your project now has executable\
    \ code in two files: `main.m` and `Person.m`. (`Person.h` is a declaration of\
    \ a class, but there is no executable code in it.) When you build the project,\
    \ these files are compiled separately and then linked together. It is not uncommon\
    \ that a real-world project will consist of hundreds of files of C and Objective-C\
    \ code.\n\nYou can also link in libraries of code. For example, you might find\
    \ a great library for parsing data from digital telescopes on the Internet. If\
    \ your program needed this capability, you would compile that library and add\
    \ it to your project. When Xcode built your program, it would link in all the\
    \ functions and classes defined in that library.\n\n# Challenge\n\nCreate new\
    \ Foundation Command Line Tool called Stocks. Then create a class called `StockHolding`\
    \ to represent a stock that you have purchased. It will be a subclass of `NSObject`.\
    \ For instance variables, it will have two floats named `purchaseSharePrice` and\
    \ `currentSharePrice` and one int named `numberOfShares`. Create accessor methods\
    \ for the instance variables. Create two other instance methods:\n\n+   - (float)costInDollars;\
    \ // purchaseSharePrice * numberOfShares\n- (float)valueInDollars; // currentSharePrice\
    \ * numberOfShares\n\nIn `main()`, fill an array with three instances of `StockHolding`.\
    \ Then iterate through the array printing out the value of each."
