    \ (same as **NULL**, which was discussed in Chapter 8).\n\nIn most object-oriented\
    \ languages, sending a message to *nil* is not allowed. As a result, you have\
    \ to check for non-nil-ness before accessing an object. So you see this sort of\
    \ thing a lot:"
