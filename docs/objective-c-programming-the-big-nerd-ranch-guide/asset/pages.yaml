- pgno: 22
  md: '# Chapter 2 Your First Program


    +   - If you put // at the beginning of a line of code, everything from those
    forward slashes to the end of that line is considered a comment. You can see this
    used in Apple’s “insert code here...” comment.

    - If you have more extensive remarks in mind, you can use /\* and \*/ to mark
    the beginning and end of comments that span more than one line.


    These rules for marking comments are part of the syntax of C. Syntax is the set
    of rules that governs how code must be written in a given programming language.
    These rules are extremely specific, and if you fail to follow them, your program
    won’t work.


    While the syntax regarding comments is fairly simple, the syntax of code can vary
    widely depending on what the code does and how it does it. But there’s one feature
    that remains consistent: every statement ends in a semicolon. (We’ll see examples
    of code statements in just a moment.) If you forget a semicolon, you will have
    made a syntax error, and your program won’t work.


    Fortunately, Xcode has ways to warn you of these kinds of errors. In fact, one
    of the first challenges you will face as a programmer is interpreting what Xcode
    tells you when something goes wrong and then fixing your errors. You’ll get to
    see some of Xcode’s responses to common syntax errors as we go through the book.


    Let’s make some changes to *main.c*. First, we need to make some space. Find the
    curly braces ({ and }) that mark the beginning and the end of the **main** function.
    Then delete everything in between them.


    Now update *main.c* to look like the code below. You’ll add a comment, two lines
    of code, and another comment to the **main** function. For now, don’t worry if
    you don’t understand what you are typing. The idea is to get started. You have
    an entire book ahead to learn what it all means.


    ```

    #include <stdio.h>

    int main (int argc, const char * argv[]) {

    // Print the beginning of the novel

    printf("It was the best of times.\n");

    printf("It was the worst of times.\n");

    /* Is that actually any good?

    Maybe it needs a rewrite. */

    return 0;

    }

    ```


    (Notice that the new code you need to type in is shown in a bold font. The code
    that isn’t bold is code that is already in place. That’s a convention we’ll use
    for the rest of the book.)


    As you type, you may notice that Xcode tries to make helpful suggestions. This
    feature is called *code completion*, and it is very handy. You may want to ignore
    it right now and focus on typing things in all yourself. But as you continue through
    the book, start playing with code completion and how it can help you write code
    more conveniently and more accurately. You can see and set the different options
    for code completion in Xcode’s preferences, which are accessible from the Xcode
    menu.


    In addition, keep an eye on the font color. Xcode uses different font colors to
    make it easy to identify comments and different parts of your code. (For example,
    comments are green.) This comes in handy, too: after a while of working with Xcode,
    you begin to intuitively notice when the colors don’t look right. Often, this
    is a clue that there is a syntax error in what you’ve written (like a forgotten
    semicolon). And the sooner you know that you’ve made a syntax error, the easier
    it is to find and fix it.'
  merge: -1
