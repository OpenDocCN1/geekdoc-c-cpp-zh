  md: "# ## Multiple arguments\n\nSome methods take several arguments. For example,\
    \ an **NSDate** object doesn’t know what day of the month it is. If you needed\
    \ this information, you would use an **NSCalendar** object. The **NSCalendar**\
    \ method that can tell you the day of the month takes three arguments. Create\
    \ an **NSCalendar** object and use it in *main.m*:\n\n```\n```\n#import <Foundation/Foundation.h>\n\
    \nint main (int argc, const char * argv[])\n{\n    @autoreleasepool {\n      \
    \  NSDate *now = [[NSDate alloc] init];\n        NSLog(@\"The date is %@\", now);\n\
    \n        double seconds = [now timeIntervalSince1970];\n        NSLog(@\"It has\
    \ been %f seconds since the start of 1970.\", seconds);\n\n        NSDate *later\
    \ = [now dateByAddingTimeInterval:100000];\n        NSLog(@\"In 100,000 seconds\
    \ it will be %@\", later);\n\n        NSCalendar *cal = [NSCalendar currentCalendar];\n\
    \        NSUInteger day = [cal ordinalityOfUnit:NSDayCalendarUnit\n          \
    \                       inUnit:NSMonthCalendarUnit\n                         \
    \      forDate:now];\n        NSLog(@\"This is day %lu of the month\", day);\n\
    \    }\n    return 0;\n}\n```\n```\n\nThe method’s name is **ordinalityOfUnit:inUnit:forDate:**,\
    \ and it takes three arguments. You can tell because the method name includes\
    \ three colons. Notice that I split that message send into three lines. This is\
    \ fine; the compiler does not mind the extra whitespace. Objective-C programmers\
    \ typically line up the colons so that it is easy to tell the parts of the method\
    \ name from the arguments. (Xcode should do this for you: every time you start\
    \ a new line, the previous line should indent properly. If that isn’t happening,\
    \ check your Xcode preferences for indentation.)\n\nThe first and second arguments\
    \ of this method are the constants **NSDayCalendarUnit** and **NSMonthCalendarUnit**.\
    \ These constants are defined in the **NSCalendar** class. They tell the method\
    \ that you want to know what day it is within the month. The third argument is\
    \ the date you want to know about.\n\nIf you wanted to know the hour of the year\
    \ instead of the day of the month, you’d use these constants:\n\n```\n```\nNSUInteger\
    \ hour = [cal ordinalityOfUnit:NSHourCalendarUnit\n                          \
    \  inUnit:NSYearCalendarUnit\n                          forDate:now];\n```\n```\n\
    \n# ## Sending messages to nil\n\nNearly all object-oriented languages have the\
