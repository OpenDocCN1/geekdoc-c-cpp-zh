  md: "# Figure 5.4 Two frames on the stack\n\n![](img/5f9368899ebf8d92fc145f8def1e89f8_44_0.png)\n\
    \nThe stack is always last-in, first-out. That is, the **showCookTimeForTurkey**()\
    \ will pop its frame off the stack before **main**() pops its frame off the stack.\n\
    \nNotice that pounds, the single parameter of **showCookTimeForTurkey**(), is\
    \ part of the frame. Recall that a parameter is a local variable that has been\
    \ assigned the value of the corresponding argument. For this example, the variable\
    \ *turkeyWeight* with a value of 9 is passed as an argument to **showCookTimeForTurkey**().\
    \ Then that value is assigned to the parameter *pounds* and copied to the function’s\
    \ frame.\n\n# Recursion\n\nCan a function call itself? You bet! We call that *recursion*.\
    \ There is a notoriously dull song called “99 Bottles of Beer.” Create a new C\
    \ Command Line Tool named **BeerSong**. Open *main.c* and add a function to write\
    \ out the words to this song and then kick it off in **main**():\n\n```\n#include\
