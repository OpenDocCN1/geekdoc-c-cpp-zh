  md: "# 34\n\n# C Strings\n\nGiven the choice, an Objective-C programmer will always\
    \ choose to work with **NSString** objects rather than C strings. However, sometimes\
    \ we don’t have a choice. The most common reason we end up using C strings? When\
    \ we access a C library from within our Objective-C code. For example, there is\
    \ a library of C functions that lets your program talk to a PostgreSQL database\
    \ server. The functions in that library use C strings, not instances of **NSString**.\n\
    \n# char\n\nIn the last section, we talked about how a byte could be treated as\
    \ a number. We can also treat a byte as a character. As mentioned earlier, there\
    \ are many different string encodings. The oldest and most famous is ASCII. ASCII\
    \ (American Standard Code for Information Interchange) defines a different character\
    \ for every byte. For example, 0x4b is the character ‘K’.\n\nCreate a new C Command\
    \ Line Tool and name it yostirng. In this program, you are going to list some\
    \ of the characters in the ASCII standard. Edit *main.c*:\n\n```\n```\n#include\
    \ <stdio.h>\n\nint main (int argc, const char * argv[])\n{\n    char x = 0x21;\
    \ // The character '!'\n\n    while (x <= 0x7e) { // The character '~'\n     \
    \   printf(\"%x is %c\\n\", x, x);\n        x++;\n    }\n\n    return 0;\n}\n\
    ```\n```\n\nYou may be wondering “Hey, a byte can hold any one of 256 numbers.\
    \ You just printed out 94 characters. What happened to the to the rest?” It is\
    \ important to realize that ASCII was written to drive old teletype-style terminals\
    \ that printed to paper instead of to a screen. For example, the number 7 in ASCII\
    \ makes the terminal bell ring. In fact, the characters 0 – 31 in ASCII are unprintable\
    \ control codes. Number 32 is the space character. Number 127 is the delete –\
    \ it causes the previous character to disappear. What about characters 128 – 255?\
    \ ASCII only uses 7 bits. There is no ASCII character for the number 128.\n\n\
    You can use ASCII characters as literals in code. Just put them inside single\
    \ quotes. Change your code to use these:"
