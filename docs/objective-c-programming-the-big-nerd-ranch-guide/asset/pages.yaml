  md: "# Figure 24.1  Logger is the target of the NSTimer\n\n![](img/5f9368899ebf8d92fc145f8def1e89f8_168_0.png)\n\
    \nIn Xcode, create a new project: a Foundation Command Line Tool named Callbacks.\
    \ As a goof, first you are just going to get a run loop and start it running.\
    \ Edit main.m:\n\n```\n```\n#import <Foundation/Foundation.h>\n\nint main (int\
    \ argc, const char * argv[])\n{\n    @autoreleasepool {\n        [[NSRunLoop currentRunLoop]\
    \ run];\n    }\n    return 0;\n}\n```\n```\n\nBuild and run the program. Notice\
    \ that the method run never returns. The run loop is in an infinite loop waiting\
    \ for something to happen. You'll need to terminate the program. (Choose Product\
    \ \\u2192 Stop.)\n\nNow you are going to create a custom class to act as the target\
    \ of the timer. Create a new file: an Objective-C class called **Logger** that\
    \ is a subclass of **NSObject**. (Remember, to get to the class template, choose\
    \ File \\u2192 New \\u2192 New File....) In Logger.h, declare the action method:\n\
    \n```\n```\n#import <Foundation/Foundation.h>\n\n@interface Logger : NSObject\n\
    - (void)sayOuch: (NSTimer *)t;\n@end\n```\n```\n\nNotice that the action method\
    \ takes one argument \\u2013 the object that is sending the action message. In\
    \ this case, it is the timer object.\n\nImplement a simple **sayOuch:** method\
    \ in Logger.m:\n\n```\n```\n#import \"Logger.h\"\n\n@implementation Logger\n\n\
    - (void)sayOuch: (NSTimer *)t\n{\n    NSLog(@\"Ouch!\");\n}\n\n@end\n```\n```\n\
    \nAt this point, we need to take a short detour and discuss *selectors*. Remember\
    \ that when you send a message to an object, the object's class is asked if it\
    \ has a method with that name. The search goes up the inheritance hierarchy until\
    \ a class responds with \\u201cYeah, I've got a method with that name.\\u201d"
