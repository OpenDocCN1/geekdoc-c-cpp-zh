  md: "is almost never an issue. My accessor method might be taking care of other\
    \ stuff for me. I use my accessor anytime I set that variable.\" In reality, either\
    \ approach will work in the vast majority of cases.\n\n# init methods that take\
    \ arguments\n\nSometimes an object can't be initialized properly without some\
    \ information from the method that is calling it. For example, imagine that an\
    \ appliance can't function without a name. (nil doesn't count.) In this case,\
    \ you need to be able to pass the initializer a name to use.\n\nYou can't do this\
    \ with **init** because, for now and always, **init** has no arguments. So you\
    \ have to create a new initializer instead. Then, when another method creates\
    \ an instance of **Appliance**, it would look like this:\n\n```\n`Appliance *a\
    \ = [[Appliance alloc] initWithProductName:@\"Toaster\"];`\n```\n\nThe new initializer\
    \ for **Appliance** is **initWithProductName**, and it accepts an **NSString**\
    \ as an argument. Declare this new method in Appliance.h:\n\n```\n`#import <Foundation/Foundation.h>\n\
    \n@interface Appliance : NSObject {\n    NSString *productName;\n    int voltage;\n\
    }\n@property (copy) NSString *productName;\n@property int voltage;\n- (id)initWithProductName:\
    \ (NSString \\*)pn;\n\n@end`\n```\n\nIn Appliance.m, find the implementation of\
    \ **init**. Change the name of the method to **initWithProductName**: and set\
    \ productName using the passed-in value.\n\n```\n`- (id)initWithProductName: (NSString\
    \ \\*)pn\n{\n    // Call NSObject's init method\n    self = [super init];\n\n\
    \    // Did it return something non-nil?\n    if (self) {\n\n        // Set the\
    \ product name\n        [self setProductName:pn];\n\n        // Give voltage a\
    \ starting value\n        [self setVoltage:120];\n    }\n    return self;\n}`\n\
    ```\n\nBefore you continue, build the project to make sure the syntax is right.\n\
    \nNow you can create an instance of **Appliance** with a given name. However,\
    \ if you give Appliance.h and Appliance.m to another programmer, she may not realize\
    \ she needs to call **initWithProductName**: What if she creates an instance of\
    \ **Appliance** in the most common way?"
