  md: "# # 10 Structs\n\n\nSometimes you need a variable to hold several related chunks\
    \ of data. For example, imagine that you were writing a program that computed\
    \ a person’s Body Mass Index. (What is your BMI? It is your weight in kilograms\
    \ divided by the square of your height in meters. A BMI under 20 suggests that\
    \ you may be underweight. A BMI over 30 suggests that you may be obese. It is\
    \ a very imprecise tool for measuring a person’s fitness, but it makes a fine\
    \ programming example.) A person, for your purposes, consists of a float that\
    \ represents height in meters and an int that represents weight in kilograms.\n\
    \n\nNow you’re going to create your own Person type. A variable of type Person\
    \ will be a structure and will have two members: a float called heightInMeters\
