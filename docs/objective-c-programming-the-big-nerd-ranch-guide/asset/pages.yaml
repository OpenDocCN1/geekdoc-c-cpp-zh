    ```\n\n# # enum\n\nOften you will need to define a set of constants. For example,\
    \ imagine that you were developing a blender with five speeds: Stir, Chop, Liquify,\
    \ Pulse, and Ice Crush. Your class **Blender** would have a method called **setSpeed:**.\
    \ It would be best if the type indicated that only one of the five speeds was\
