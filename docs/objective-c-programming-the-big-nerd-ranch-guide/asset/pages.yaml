  md: "# # Pass By Reference\n\nThere is a standard C function called **modf**().\
    \ You give **modf**() a double, and it calculates the integer part and the fraction\
    \ part of the number. For example, if you give it 3.14, 3 is the integer part\
    \ and 0.14 is the fractional part.\n\nYou, as the caller of **modf**() want both\
    \ parts. However, a C function can only return one value. How can **modf**() give\
    \ you both pieces of information?\n\nWhen you call **modf**(), you will supply\
    \ an address where it can stash one of the numbers. In particular, it will return\
    \ the fractional part and copy the integer part to the address you supply. Create\
    \ a new project: a C Command Line Tool named PBR.\n\nEdit main.c:\n\n```\n```\n\
    #include <stdio.h>\n#include <math.h>\n\nint main(int argc, const char * argv[])\n\
    {\n    double pi = 3.14;\n    double integerPart;\n    double fractionPart;\n\
    \    \n    // Pass the address of integerPart as an argument\n    fractionPart\
    \ = modf(pi, &integerPart);\n    \n    // Find the value stored in integerPart\n\
    \    printf(\"integerPart = %.0f, fractionPart = %.2f\\n\", integerPart, fractionPart);\n\
    \    \n    return 0;\n}\n```\n```\n\nThis is known as *pass-by-reference*. That\
    \ is, you supply an address (also known as \"a reference\"), and the function\
    \ puts the data there."
  merge: -1
  img_proc: true
- pgno: 72
  md: '![](img/5f9368899ebf8d92fc145f8def1e89f8_72_0.png)


    Here’s another way to think about pass-by-reference. Imagine that you give out
    assignments to spies. You might tell one, “I need photos of the finance minister
    with his girlfriend. I’ve left a short length of steel pipe at the foot of the
    angel statue in the park. When you get the photos, roll them up and leave them
    in the pipe. I’ll pick them up Tuesday after lunch.” In the spy biz, this is known
    as a *dead drop*.


    **modf()** works just like a dead drop. You are asking it to execute and telling
    it a location where the result can be placed so you can find it later. The only
    difference is that instead of a steel pipe, you are giving it a location in memory
    where the result can be placed.


    # Writing pass-by-reference functions


    There are two popular ways to describe the location of a point in 2-dimensional
    space: Cartesian coordinates and polar coordinates. In Cartesian coordinates,
    `(x, y)` indicates that you should go to the right *x* and then up *y*. In polar
    coordinates, `(theta, radius)` indicates that you should turn to the left by *theta*
    radians and go forward *radius*.


    ![](img/5f9368899ebf8d92fc145f8def1e89f8_72_1.png)'
