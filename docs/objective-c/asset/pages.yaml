    \ attributes of child objects of the primary object that you are accessing.\n\n\
    This may seem a bit confusing at first, and you may wonder why you need to know\
    \ this. For most of your day-to-day coding, using Key Value Coding methods to\
    \ set and access your properties probably will wind up being more typing, and\
    \ more error-prone than simply accessing the setters and getters on your class\
    \ directly. However, a small number of edge cases where being able to access these\
