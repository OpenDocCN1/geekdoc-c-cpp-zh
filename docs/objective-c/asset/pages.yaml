- pgno: 247
  md: "# Listing 9.5 (continued)\n\n```\nNSLog(@\"%@s %@s\", __DATE__, __TIME__);\n\
    LOG_LINE\n\n[pool drain];\nreturn 0;\n}\n```\n\nIn this code, I first defined\
    \ a function called LOG_LINE. This function, when it is expanded in your code,\
    \ turns into NSLog(@\"%@s:%ld\", __FILE__, __LINE__) ;. This causes your program,\
    \ when it runs, to log the filename and line number where the LOG_LINE function\
    \ has been placed. The built-in macros __FILE__ and __LINE__ are provided by the\
    \ compiler itself, and expand to the current source file name and the current\
    \ line number. When you run this program notice that the line number changes between\
    \ the two different calls to LOG_LINE. This is only possible because of this in-line\
    \ expansion capability that macros have. Another illustration of this is shown\
    \ by looking at the output of the line in between the LOG_LINE calls. The built-in\
    \ macros __DATE__ and __TIME__ expand to the date and time that the preprocessor\
    \ was run to compile this program. In other words, this is the date and time that\
    \ your program was compiled. If you compile the program once and then run it multiple\
    \ times, you'll find that the date and time shown here do not change on subsequent\
    \ launches. This is because the date and time that are being expanded in your\
    \ source code are effectively being hardcoded by the expansion of these macros\
