- pgno: 147
  md: 'If you are converting an existing application from a non-garbage collected
    environment to a garbage collected environment, you should know that all of the
    methods specific to the non-garbage collected memory management model will no
    longer apply. Your initializer will still be called, but your `dealloc` method
    will not. You should thus re-factor your dealloc method, either removing any sort
    of resource deallocation you may have had before or moving it into a `finalize`
    method.


    # Using Frameworks in a Garbage Collected Project


    When using garbage collection for your application, you must also ensure that
    any libraries or frameworks that you link to are compiled to support garbage collection.
    As I showed you before, when compiling a framework or library for garbage collection,
    you can choose to enable it exclusively, inclusively (allowing your framework
    to be used both in a garbage collected application and a non-garbage collected
    application), or to disallow garbage collection altogether. In the latter case,
    the library or framework will not be able to be linked with your application.


    Fortunately, all of the Cocoa frameworks fully support garbage collection. The
    only cases where you may run into situations where libraries or frameworks do
    not support garbage collection are in the cases of third-party libraries. Garbage
    collection has been around in Objective-C on MacOS X for quite some time now,
    so libraries that don’t support it are few and far between.


    # Exploring Key Garbage Collector Patterns


    There are a few design patterns that you will inevitably run into when working
    on a garbage-collected application. Recognizing these patterns and understanding
    the ways that you should deal with the problems that they solve can be helpful.


    # Managing finite resources


    One often-used design pattern in object oriented programming languages is the
    practice of writing an object wrapper for a finite resource. Using object wrappers
    is a common practice when working with files, sockets, and so on. The advantage
    of this pattern is that the resource can be allocated in the initializer of the
    object and deallocated in the dealloc method for the object. This provides a nice
    mental model for ensuring that the resource that has been allocated gets deallocated.


    There are several problems with this design pattern in a garbage collected environment.
    The first, of course, is that the dealloc method is no longer called. Therefore,
    if you make no changes to your application other than enabling garbage collection,
    the finite resource that you are attempting to wrap and ensure is deallocated
    will never be deallocated. This can'
  merge: -1
  img_proc: true
- pgno: 148
  md: "become especially problematic if, for example, the item in question is an operating\
    \ system resource, such as a socket. It might seem tempting to simply move the\
    \ deallocation from your dealloc method to a finalize method. (I've already discussed\
    \ how your goal should be to have no finalize method at all.) Remember that in\
    \ a garbage collected environment, your object may be deallocated at an arbitrary\
    \ point in the future. In other words, you can't count on your finalize method\
    \ to be called at any particular point in time in the execution of your application.\
    \ Therefore, it is possible that the resource that you are expecting to be deallocated\
    \ in your finalize method is not going to be deallocated until much later in your\
    \ program's execution than you previously expected.\n\nThese two problems combined,\
    \ result in a situation that requires you to rethink this design pattern and to\
    \ do a little bit of extra work, both in the object itself, and objects that use\
    \ that object to ensure that resources allocated by that object are closed properly\
    \ before allowing the object to be garbage collected.\n\nThe easiest way to demonstrate\
    \ this concept is probably to show you some code. Listing 4.17 shows a typical\
    \ file wrapper class, which is allocating a resource, a file handle, its initializer,\
    \ and then deallocating that resource in dealloc method.\n\n# Listing 4.17\n\n\
    # A typical file wrapper class\n\n```\n@interface Foo : NSObject\n{\n    int fileHandle;\n\
    }\n\n@end\n\n@implementation Foo\n\n-(id)init\n{\n    if(self = [super init])\n\
    \    {\n        fileHandle = open(...);\n    }\n    return self;\n}\n```"
  merge: -1
