- pgno: 301
  md: 'Therefore, Foundation also provides mutable versions of all of these classes.
    The names of the mutable versions of the classes are NSMutableArray, which corresponds
    to NSArray, NSMutableDictionary, corresponding to NSDictionary, and NSMutableSet
    that corresponds to NSSet. Each of these classes provides additional methods,
    in addition to the read-only methods of their immutable counterparts for the purposes
    of adding, removing, and replacing objects within the collections.


    NSMutableArray provides the method -addObject: for placing an object at the end
    of the array, -insertObject:atIndex: for inserting an object at a specific index,
    -removeLastObject for removing the last object in the array, -removeObjectAtIndex:
    for removing an object at a given index, and -replaceObjectAtIndex:withObject:
    for replacing a given object at a specified index with another object. Listing
    13.11 shows some examples of using these methods on an NSMutableArray.


    # Listing 13.11


    # Manipulating the elements of an NSMutableArray


    ```

    NSMutableArray *array = [NSMutableArray array];


    [array addObject:@"foo"];

    [array addObject:@"baz"];

    [array insertObject:@"bar" atIndex:1];

    // now [@"foo", @"bar", @"baz"]


    [array removeLastObject];

    // now [@"foo", @"bar"]


    [array removeObjectAtIndex:0];

    // now [@"bar"]


    [array replaceObjectAtIndex:0 withObject:@"boz"];

    // now [@"boz"]

    ```


    There are naturally plural forms of each of these methods that perform the same
    operations with arrays of objects or ranges of indexes.


    Similarly, NSMutableDictionary provides methods for manipulating its contents
    as well. For example, to add an object into the dictionary, you use the method
    -setObject:forKey:. To remove an object, you use the method -removeObjectForKey:.
    Listing 13.12 shows an example of manipulating an NSMutableDictionary.'
