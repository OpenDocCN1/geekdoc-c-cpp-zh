- pgno: 170
  md: 'Some classes in Cocoa take blocks as parameters for performing operations,
    typically on elements of collections that they manage. Notable classes that do
    this include NSArray, NSDictionary, NSIndexSet and NSSet. Additionally, NSString
    and NSAttributed String provide methods for enumerating over lines and attributes
    using blocks, as well.


    A collection of the most commonly used methods in Cocoa that use blocks is shown
    in Table 5.1.


    # Table 5.1


    | Class | Method | Purpose |

    |---|---|---|

    | NSNotificationCenter | addObserverForName:object:queue:usingBlock: | Executes
    the given block when the notification is sent. |

    | NSIndexSet | enumerateIndexesInRange:options:usingBlock:, enumerateIndexesUsingBlock:,
    enumerateIndexesWithOptions:usingBlock: | Enumerates over the indices of the set,
    executing the given block, and passing the index to the block. |

    | NSDictionary | enumerateKeysAndObjectsUsingBlock:, enumerateKeysAndObjectsWithOptions:usingBlock:
    | Enumerates over the keys and objects of the dictionary, executing the given
    block, with the keys and objects passed to it as parameters. |

    | NSString | enumerateLinesUsingBlock:, enumerateSubstringsInRange:options:usingBlock:
    | Enumerates the lines of a string, calling the given block with the line as a
    parameter... |

    | NSArray | enumerateObjectsAtIndexes:options:usingBlock:, enumerateObjectsUsingBlock:,
    enumerateObjectsWithOptions:usingBlock: | Enumerates the elements of the array,
    passing each item to the given block. |

    | NSSet | enumerateObjectsUsingBlock:, enumerateObjectsWithOptions:usingBlock:
    | Enumerates the elements of the set, passing each item to the given block. |

    | NSOperationQueue | addOperationWithBlock: | Adds the given block to the queue.
    |

    | NSBlockOperation | +blockOperationWithBlock: | Creates a new NSOperation using
    the given block. |


    Of particular interest are the methods on NSOperationQueue and NSBlockOperation,
    which enable you to utilize NSOperation objects with blocks. This is a higher
    level API than the GCD functions I showed you earlier in the section entitled
    "Using GCD to Dispatch Blocks in Threads." I show you how to use these APIs in
    Chapter 16.'
