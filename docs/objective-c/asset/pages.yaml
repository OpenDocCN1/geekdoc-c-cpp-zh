    refer to it throughout the rest of this text, the Editor panel. Selecting files
    in the File Browser panel causes them to display in the Editor panel on the right.
    Additionally, the Editor panel has several different modes. The detail mode shows
    a summary of the files that are selected in the File Browser. The Project Find
    mode shows a find panel that enables you to do a search through all the files
    in your project for an arbitrary text string. If you enable the All-In-One layout
