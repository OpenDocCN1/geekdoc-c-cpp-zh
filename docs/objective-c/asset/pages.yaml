- pgno: 107
  md: "# Listing 3.8\n\n# A class method declaration\n\n```\n@interface Foo : NSObject\n\
    {\n    NSMutableArray *memberVariable;\n    NSString *anotherMemberVariable;\n\
    }\n@property (nonatomic, retain) NSMutableArray * memberVariable;\n@property (nonatomic,\
    \ retain) NSString * anotherMemberVariable;\n\n-(id)init;\n-(id)initWithArray:(NSMutableArray\
    \ *)inArray;\n\n// a class method\n+(id)fooWithArray:(NSMutableArray *)inArray;\n\
    \n@end\n```\n\nThe implementation of a class method is identical to the implementation\
    \ of an object method. However, class methods do not have access to any of the\
    \ object’s member variables. To understand why, remember that a class method is\
    \ called directly off the class itself, not off an instance of that class. Therefore,\
    \ there is no object that the data can be stored within in order to operate on\
    \ that data. Listing 3.9 shows an example of a class method implementation.\n\n\
    # Listing 3.9\n\n# A class method definition\n\n```\n@implementation Foo\n\n+(id)fooWithArray:(NSMutableArray\
    \ *)inArray\n{\n    return [[[self alloc] initWithArray:inArray] autorelease];\n\
    }\n\n@end\n```"
