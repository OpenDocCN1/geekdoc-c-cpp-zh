  md: "# Listing 3.3\n\n# Object method declaration\n\n```\n- (BOOL) someOtherMethodWithArg:\
    \ (NSString *) param1\n    andAnotherArg: (int) param2\n```\n\nAll object methods\
    \ are prefixed with a hyphen character to differentiate them from class methods,\
    \ which are prefixed with a plus character.\n\n# NOTE\n\nClass methods are methods\
    \ that can be called using an uninstantiated class instead of an object.\n\nThe\
    \ method’s return type is specified within parentheses. After the return type,\
