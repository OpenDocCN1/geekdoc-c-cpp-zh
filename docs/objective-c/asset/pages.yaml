  md: '# Applying Blocks to an Embarrassingly Parallel Task


    Now that I’ve shown you everything you need to know about how to use blocks in
    your code, you can apply this knowledge. Though blocks are certainly not limited
    to their uses in parallelization and threading, they are uniquely good at these
    tasks.


    In programming circles, they are known as embarrassingly parallel problems, —
    problems that are uniquely well suited to parallelization.


    An example of this kind of problem is that of calculating prime numbers. Although
    you can use other ways to calculate prime numbers that are faster than brute force,
    for the purposes of the following example, I show how you can improve the performance
    of a brute force solution. Therefore, I’m going to have you write a simple program
    to calculate all of the prime numbers between 2 and 150,000. Then you will rewrite
    the application two different ways. The first way uses a block and an NSArray,
    to demonstrate encapsulating the determination of the primeness of a given number.
    The second form takes advantage of Grand Central Dispatch to parallelize the calculation.
    The sample code has the ability to print out the prime numbers it finds. Feel
    free to uncomment this code if you want to see it working. The important thing
    for you, however, is to note how long it takes to calculate each of these. The
    program will print out the time it takes for each program. You should see that
    the naive, plain approach and the array filtering approach should take about the
    same amount of time, whereas, the parallel version should be much faster.


    # Creating the project


    The first thing you need to do is create the project. (You’ve already done this
    several times, so I won’t belabor it here.) Make sure to create a new command
    line Foundation project. Although it’s not really necessary, I’m going to have
    you create a class for actually doing prime number calculations. The vast majority
    of programming you do using Objective-C uses objects and classes. Therefore, becoming
    familiar with them and using them in your day-to-day work even now is a good idea.


    After you’ve created the new project, modify the main source file so that it looks
    like Listing 5.13.


    # Listing 5.13


    # The main source file for the prime number calculator


    ```

    #import <Foundation/Foundation.h>

    #import "PrimeFinder.h"

    ```'
