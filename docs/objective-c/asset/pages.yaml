    \ before that NSValue is used for storing arbitrary data types. To create an NSValue,\
    \ you provide it with a pointer to the value that you want to store, and a C string\
    \ indicating the data type. Telling the NSValue instance about the type of the\
    \ data is important because that tells it how many bytes it needs to read in order\
    \ to get all of the data. Fortunately, Objective-C provides a special directive,\
