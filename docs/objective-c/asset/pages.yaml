    \        {\n            NSDictionary *errorInfo =\n            [NSDictionary dictionaryWithObject:@\"\
    Permission Error.\"\n                                        forKey:NSLocalizedDescriptionKey];\n\
    \n            *outError = [NSError errorWithDomain:@\"FileWrapper\"\n        \
    \                                    code:500\n                              \
    \          userInfo:errorInfo];\n```"
