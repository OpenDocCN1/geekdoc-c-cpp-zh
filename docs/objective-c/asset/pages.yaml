- pgno: 160
  md: 'You may find it easier to think of this like declaring a pointer variable.
    Just like when declaring a pointer variable, the ^ character is used to indicate
    that the variable in question is a pointer. In the case of a block, however, the
    ^ character is used.


    Following the ^ character, the variable name that stores the block (myBl ock)
    is given. This variable name is enclosed within parentheses to separate it from
    its arguments afterwards.


    The variable name follows the same conventions of variable names in the rest of
    the language; it must contain only alphanumeric characters, and cannot begin with
    a number.


    Following the closing parenthesis of the block variable name, the arguments that
    need to be passed to the block when it is used are listed separated by commas
    and enclosed in an additional set of parentheses (here, this is (NSString *x)).
    When listing these arguments, you do not need to provide the variable names for
    the arguments themselves. Doing so is up to you, but it’s not required. A good
    way to think about this is that you are not actually declaring the body of the
    function at this time. Therefore, providing the variable names for the arguments
    serves no purpose, because they would not be used at this time. Instead, you simply
    have to tell the compiler what types of arguments to expect. You simply provide
    the types of the arguments separated by commas. A lot of block documentation omits
    this argument name in declarations. I choose not to, because I think that it makes
    the code confusing, particularly for new developers.


    As always, you terminate the statement with a semicolon. At this point, you have
    declared a variable, which can store a block that returns the value type that
    you specified, and takes the arguments that you specified. The name of that variable
    is, in our example above, myBlock.


    Just declaring the variable, as we know, is not sufficient. You also have to store
    the block in order to use it. Initializing your new variable with a block is done
    simply by using the assignment operator, and then, again, a special syntax indicates
    that you are creating the actual block that you will store into the variable.


    The definition of the block again uses the ^ character to tell the compiler that
    what follows is a block definition. You can omit the return type in the definition,
    because the compiler can determine the return type by looking at the variable
    that the block is being stored within. You must, however, provide the argument
    specification for the block, again, inside parentheses. In this case, you must
    also provide the variable names for the arguments that are being passed. This
    makes sense, because you are declaring the variable names for the arguments as
    they will be used within the body of your block.


    After the closing parenthesis of your argument list, you then provide the actual
    body of the block. This body of code takes a form that is nearly identical to
    declaring a normal function. You enclose the block code within curly braces, execute
    whatever operations you choose, utilize your arguments as needed, and return whatever
    value is appropriate after you finish. Just like when defining a standard function,
    the code inside a block can be spread over multiple lines, though normal white
    space rules do apply.'
  merge: -1
  img_proc: true
