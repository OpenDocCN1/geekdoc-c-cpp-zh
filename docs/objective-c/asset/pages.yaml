    \ = [self string];\n    [ret appendGuid];\n    return ret;\n}\n\n@end\n```\n\n\
    # Exploring category limitations\n\nCategories do have certain limitations associated\
    \ with them. Categories cannot add any member variables to the extended class.\
    \ They can absolutely declare and use local variables within the scope of the\
    \ category methods, and they can certainly use global variables, or any variables\
    \ passed into them as parameters, but they cannot add any member variables to\
    \ the class.\n\nCategories can call superclass methods by using the super keyword.\
    \ However, there is no mechanism in place to allow a category to call the original\
    \ implementation of a method that the category itself is overriding. In other\
    \ words, if you override an existing object method by using a category, there\
    \ is no way for you to call the original existing object method.\n\nRecall that\
    \ when I talked about the dangers of multiple inheritance when I described how\
    \ to create protocols, that the problem was that if two superclasses defined implementations\
    \ of the same method, the compiler would have difficulty in determining which\
    \ implementation to call in a given circumstance. This problem does not affect\
    \ protocols, because the protocol is simply a declaration of an interface and\
    \ not an implementation. Categories on the other hand are not so lucky.\n\nJust\
    \ like in the case of multiple inheritance, if two categories define the same\
    \ method on the same class, which method actually gets called at runtime is undefined.\
    \ As a result, you should"
