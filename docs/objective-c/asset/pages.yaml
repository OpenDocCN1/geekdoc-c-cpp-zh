- pgno: 96
  md: 'You might also want to capture the fact that the cat’s eyes are yellow. Some
    cats have gray eyes, some cats have green eyes, but this cat’s eyes are yellow.
    Perhaps you also want to capture the weight of the cat. All of these things are
    attributes of the cat. If you can imagine dealing with this in a procedural application,
    all of these properties would have to be stored in some sort of global variables.
    You could probably alleviate some of the problem by using structures for those
    global variables, but even so, after you move beyond one, managing bunches of
    structures would quickly get out of hand.


    Using object-oriented programming, you can represent the state of the cat and
    its attributes using an object. In the same way that a given instance of a cat
    is a physical representation of the more generic, ideal “Cat” concept, you can
    say that there is a generic version of cats called, generically, Cat. This is
    called the “class” of the object. Another way to think of this is to think of
    this class of an object as sort of the platonic representation of the concept
    of a cat. This platonic ideal representation of a cat acts as a sort of conceptual
    template that you can then use to create instances of our actual individual cats.
    My specific, individual cat (named George) is the “object,” or “instance,” of
    a cat “class.”


    Putting this a different way, our Cat class represents the definition of all the
    attributes that make up what a cat is, including all the potential variety of
    different kinds of cats. Using that template, you can create an individual instance
    of a cat that describes your particular cat. The Cat class might define that cats
    are small, furry animals with pointy ears, sharp teeth, and a tendency for attacking
    their owners’ legs. The class might also define that cats have eyes or fur of
    different colors. The fur color of your particular instance of cat would be a
    variable that you define in order to differentiate your cat from the generic concept
    of the cat.


    In addition to defining the attributes of both the generic concept of a cat as
    well as the specific attributes of your particular cat, a class can also encapsulate
    the behavior of the cat. For example, it might be said that a cat vocalizes by
    meowing. You could create code in your Cat template that represents the instructions
    required to make that cat meow, this is called a “method.” Similarly, you might
    have a method on the cat that represents the process of cleaning itself. The cat
    might have a temporary state that represents “dirty.” The “clean” method might
    represent the behaviors necessary to change the cat from dirty to clean. In this
    way, the methods defined on the class Cat define the instructions necessary to
    alter the data in your particular instance of cat.


    Moving away from our metaphor, and returning back to actual Objective-C, the takeaway
    here is that Objective-C defines programming constructs that give you the ability
    to define these concepts and relationships.


    In Objective-C, a class represents the definition or template for a particular
    type of object. When working with objects, you create classes. In those classes,
    you define both the data that the object encapsulates and the methods that are
    used to manipulate that data.


    An object is a particular instance of a class. Objects are also often referred
    to as instances, and I use these two terms interchangeably.'
