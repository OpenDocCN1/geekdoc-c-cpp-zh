- pgno: 142
  md: '# Using Garbage Collection


    If the idea of manually managing your memory in your application sounds like a
    chore, then you will be glad to hear that recently Apple added garbage collection
    to Objective-C. If you are unfamiliar with the concept of garbage collection,
    garbage collection is a means by which an application’s runtime dynamically determines
    objects that are no longer being used or referenced inside of your application,
    and automatically deallocates those objects. Applications that use garbage collection
    need not worry about releasing objects, retain cycles, or, for the most part,
    memory leaks. When used appropriately, garbage collection can help you avoid some
    of the most common pitfalls that beginning programmers run into.


    Unfortunately, garbage collection does have a down side. Garbage collection is
    only available on MacOS X Version 10.5 or above. It is not available, currently,
    on iPhone, iPad, or any of the less common platforms, such as Linux or Windows.
    Because of this limitation, learning how to write proper Objective-C code for
    manual memory managed environments is important.


    Also, although garbage collection solves a great many problems with regard to
    memory management, it also presents additional challenges that you must understand
    in order to use garbage collection effectively.


    # Understanding the Garbage Collector


    If you’re coming to Objective-C from another language, such as Java, Python, or
    Ruby, you are probably already familiar with the concept of garbage collection.
    Understanding how the Objective-C garbage collector works, however, can be useful
    in aiding you to write correct code for the specifics of the Objective-C environment.


    Understanding the basics of how the Objective-C garbage collector functions is
    essential. For any application that has a run loop built into it, for example
    Cocoa or Cocoa Touch applications, when the main run loop executes, the garbage
    collector kicks in and searches for objects that have no active references to
    them. When the garbage collector finds some, it deallocates them.


    How this works is that the garbage collector looks at a set of root objects within
    your application and searches all of the references that contain those root objects.
    Any object that cannot be reached from one of those root objects is considered
    to be “garbage” and will be collected. Root objects are defined to be global variables,
    stack variables, and external references.


    So, for example, any object reference from the main application global instance,
    or any object referenced by any object referenced by the main application global
    instance would not be considered to be garbage references. However, if an object
    is allocated in a method assigned to a variable within that method and then never
    referred to again after that method has exited, the original variable that held
    it has gone out of scope. The object reference is now held in memory and has no
    reachable reference from a root object. That object can be collected.'
  merge: -1
  img_proc: true
- pgno: 143
  md: '# Introducing Objective-C


    When an object is collected, its memory is freed, but its dealloc method is not
    called. In a garbage collected environment dealloc methods are considered obsolete
    and are no longer used. Instead, a new object method has been introduced called
    finalize. The finalize method shares many similarities with the dealloc method,
    in that it is the last method that is called before your object is deleted, and
    it is, for the most part, considered to be the correct place to do whatever cleanup
    is necessary for your object. However, because of the way that garbage collection
    works, the finalize method has certain limitations that the dealloc method does
    not share. Having a finalize method for your object is entirely optional. In fact,
    arguably, you should actually strive not to have a finalize method at all.


    Recall that the dealloc methods primary purpose is to manually release the memory
    allocated for your member variables. Because you do not need to do that in a garbage
    collected environment, this is not necessary in your finalize method. Therefore,
    the only reason to have a finalize method, is for freeing other finite resources.
    (Unfortunately, for reasons I explain later, finalize is actually a really poor
    place to free finite resources.)


    Because the garbage collector is relatively nondeterministic in terms of when
    it will actually call your finalize method, you can’t determine when it will be
    called. Therefore, if the resources that you need to free are important, you probably
    want to put the code for freeing those resources in another method that can be
    called deterministically by your code rather than relying on the garbage collector
    and when it may get around to deallocating your object.


    The order in which garbage objects are collected is also nondeterministic. Therefore,
    any case in which you might be calling other objects in your finalize method has
    potential for failure depending on whether your object or the objects you are
    calling are deallocated first.


    Because of these reasons, avoid using a finalize method. If no other choice is
    available to you, I discuss the appropriate way to write a finalize method and
    how to manage your finite resources in that method later in this chapter.


    Recall that any application containing a run loop, again, Cocoa or Cocoa Touch
    applications, automatically has a garbage collector (assuming that you have enabled
    garbage collection for your project). However, if you’re writing a foundation-only
    application, such as the applications that you’ve written so far in this book,
    you must manually instantiate and launch the garbage collector as part of your
    application’s main function.


    For the most part, in the remainder of this book, I intend to use Cocoa GUI applications
    for the example projects. However, I wanted to show you how you launch the garbage
    collector in a Foundation application. To do so, you call the function objc_startCollectorThread()
    as shown in Listing 4.15.'
  merge: -1
  img_proc: true
- pgno: 144
  md: "# Listing 4.15\n\n# Using the garbage collector in a foundation application\n\
    \n```\nint main (int argc, const char * argv[])\n{\n    objc_startCollectorThread();\n\
    \n    // ...\n\n    return 0;\n}\n```\n\n# Understanding reference types\n\nTo\
    \ effectively understand how to use garbage collection in your applications, you\
    \ need to understand two fundamental concepts that impact how garbage collection\
    \ works within your application. These concepts are strong and weak references.\n\
    \nAll object pointers in Objective-C are references, meaning that they refer to\
    \ memory allocated for an object. A reference can be either strong or weak. By\
    \ default, all references in Objective-C are strong references. A strong reference\
    \ is the kind of reference that the garbage collector will follow to determine\
    \ that an object is alive and should not be collected. Weak references, on the\
    \ other hand, are references that are assignable and valid references to objects,\
    \ but which are allowed to be garbage collected if the object that they refer\
    \ to does not have an otherwise strong reference elsewhere.\n\nThis concept is\
    \ useful when you want to have a reference to an object but if that object is\
    \ marked to be deallocated, you don’t want to hold onto it. For example, the NSNotificationCenter\
    \ uses weak references for observers that are registered with it. Remember that\
    \ in a reference counted environment, objects that are registered as an observer\
    \ with the NSNotificationCenter must remove themselves as an observer in their\
    \ dealloc methods. In a garbage collected environment this requirement is not\
    \ necessary because when the object is deallocated, the weak reference to that\
    \ object in the NSNotificationCenter becomes invalid and is set to nil. Therefore,\
    \ the NSNotificationCenter no longer attempts to send notifications to that object."
  merge: -1
  img_proc: true
- pgno: 145
  md: "Now, you may be reading this, and thinking that this would be an appropriate\
    \ pattern to use when creating a delegate. Remember that in a reference counted\
    \ environment, when an object has a delegate, it uses the assign property attribute\
    \ to effectively create a “weak” reference to the delegate. The reason this is\
    \ done in that environment is to prevent retain cycles. In a garbage collected\
    \ environment, however, the garbage collector is able to detect and prevent retain\
    \ cycles, and as a result, using a weak reference for delegates is unnecessary.\n\
    \nAs I said before, the default for all references in Objective-C is to be strong.\
    \ To define a reference as weak, you use the __weak keyword. An example of this\
    \ is shown in Listing 4.16.\n\n# Listing 4.16\n\n# Defining a weak reference\n\
    \n```\n```objective-c\n@interface Foo : NSObject\n{\n    __weak NSString *memberVariable;\n\
    }\n\n@end\n```\n```\n\nIn addition to being able to manually specify a given reference\
    \ as being weak, there are also specialized container classes that can be used\
    \ to store lists of weak references. You might use these classes in place of such\
    \ classes as NSArray or NSDictionary in cases where you want to store weak references\
    \ instead of strong references.\n\nThese classes are NSMapTable, NSHashTable and\
    \ NSPointerArray. When you use these classes, if an element of these arrays is\
    \ deallocated, the reference to that element is simply removed from the array.\
    \ Normally, if you use an NSArray, or similar, the strong reference within the\
    \ array keeps the objects alive.\n\n# Configuring your project for garbage collection\n\
    \nConfiguring a project for garbage collection is relatively straightforward.\
    \ All that’s really necessary is to configure your build settings, and change\
    \ the setting for Objective-C garbage collection. As shown in Figure 4.1, if you\
    \ search for this setting in your build settings you can pull down a drop-down\
    \ list of possible values. These include the following:\n\n+   - Unsupported:\
    \ Use the retain-count memory management system.\n+   - Supported: Specifies that\
    \ your project supports garbage collection but does not require it.\n+   - Required:\
    \ Garbage Collection is required for this application and all frameworks it uses."
