  md: '# CAUTION


    NSArray as well as all collections in Objective-C is zero based. This means the
    first element starts at index 0, and the last element has an index of one less
    than the length of the array. If you try to access an element outside of these
    index boundaries, you will get an exception.


    In addition to the methods that return individual items at individual indexes,
    you can also use other methods that return groups of objects based on ranges of
    indexes. These methods, such as -objectsAtIndexes: and -indexesOfObjects: work
    similarly to the methods that are used for accessing individual elements, except
    that they take an NSIndexSet, specifying the items you want. These calls return
    a new NSArray containing the subset of objects matching the indexes passed in.
    Listing 13.4 shows examples of these methods.


    # Listing 13.4


    # Accessing groups of elements


    ```

    NSArray *array = [NSArray arrayWithObjects:@"foo", @"bar", @"baz", nil];

    NSRange range;

    range.location = 1;

    range.length = 2;


    NSIndexSet *indexSet = [NSIndexSet indexSetWithIndexesInRange:range];


    // this should get indexes for [@"bar", @"baz"]

    NSArray *subItems = [array objectsAtIndexes:indexSet];

    ```


    The access time for an element of an NSArray, while not strictly specified as
    such, can be assumed to be at worst, O(lg N), but is often O(1) for most operations.
    Linear search operations can have a worst-case complexity of O(N*lg N). The NSArray
    class is useful for storing virtually any collection of Objective-C objects, including
    objects that are not of the same class. However, NSArray is incapable of holding
    either nil values, structs, or scalars. If you feel the need to store a nil value
    in an NSArray, instead consider using an instance of NSNull. This class was made
    specifically for cases where you needed to store a "non-value" in a container
    class. When it comes to storing structs, you should wrap the struct in an NSValue.
    The same goes for storing scaler values, NSNumber provides a convenient wrapper
    object which you can use to store a scalar value.


