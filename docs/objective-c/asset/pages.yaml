- pgno: 259
  md: 'to gain access to the resource and fail because another program or part of
    your program are already accessing that resource. In this case, you want to know
    that accessing the resource failed, and you want to simply retry accessing the
    resource again. This category is a minor type of error condition. You know exactly
    what to do when the call fails and exactly what might have caused the failure.


    Return codes are uniquely suited for this kind of error. Ideally, the return code
    can be as simple as a Boolean value. The return code can return YES if the call
    succeeded or NO if the call failed. In some languages that lack some of the more
    complex error handling mechanisms that I am about to introduce to you, error codes
    are the only option that you have for returning invalid conditions. In these languages,
    error codes are often overloaded with meaning. Often these languages require that
    the error code be set to particular values to mean particular error conditions.
    Typically, Objective-C does not do this because other mechanisms are in place
    that enable you to give better more descriptive error messages than plain old
    error codes provides.


    The second category of errors is on the opposite spectrum from the first. This
    type of error, if not handled, causes data loss or an application failure. These
    errors are obviously much more serious than the first and consist of things like
    failure to open resources that are absolutely required for your application to
    continue running, consistency errors in your data storage, and so on. Imagine
    that these errors are so important that if you don’t do something about them you
    would rather the application crash than continue running in order to avoid causing
    more damage than has already been done. These errors are, not to put too fine
    a point on it, exceptional conditions, so it makes sense that the error handling
    mechanism best suited to handling them are called Exceptions. Fortunately, errors
    of this kind are few and far between in Objective-C. Nevertheless, I show you
    how to handle them, and how to recover from them later in this chapter.


    Finally, the third category of errors is somewhere in between the first two in
    terms of severity. This type of error is serious enough that you really need to
    pass more contextual information back up the stack to the person who is calling
    your function, but not so serious that it cannot be recovered from.


    This is by far the most common type of runtime error that occurs in Objective-C
    programs. It’s so common that Apple has provided a standardized error mechanism
    for handling these kinds of errors. It uses a combination of a return code to
    indicate success, and a specialized NSError object to provide contextual information
    in the case of failures. Working with NSError can be tricky, but by the end of
    this chapter you’ll be able to handle errors such as this like a pro.


    # Understanding how to interrupt program flow


    Knowing when to interrupt program flow is important.'
