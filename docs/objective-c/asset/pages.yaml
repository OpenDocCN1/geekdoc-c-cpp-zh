  md: '# Table 10.1


    | Key | Purpose |

    |---|---|

    | NSLocalizedDescriptionKey | A localized description of the error condition,
    such as "File could not be opened because it does not exist." Also accessible
    via the NSError object method -localizedDescription. |

    | NSLocalizedFailureReasonKey | A localized reason for the error, such as "File
    does not exist." Also accessible via the NSError object method -localizedFailureReason.
    |

    | NSLocalizedRecoverySuggestionErrorKey | A localized description of what the
    user might do to try to resolve the problem. Also accessible via the NSError method
    -localizedRecoverySuggestion. |

    | NSLocalizedRecoveryOptionsErrorKey | An array of strings to be used for buttons
    in a dialog box when presenting the error to the user. The first string will be
    used as the right most button, and then sequentially left from there. |

    | NSRecoveryAttemptErrorKey | An object which conforms to the NSErrorRecoveryAttempting
    protocol, which can be used to attempt to recover from the error. (Mac OS X only)
    |

    | NSUnderlyingErrorKey | Another NSError object representing the actual underlying
    error. |


    # Working with a recovery attempter


    The recovery attempter is a little-known and rarely used component of NSError.
    Available only on Mac OS X, it provides an object that can be used to automatically
    attempt to recover from the error that has occurred.


    The object provided must conform to the NSErrorRecoveryAttempting protocol, which
    defines two methods, -attemptRecoveryFromError:optionIndex: which is invoked exclusively
    in applications using a modal, non-document centric user interface, and -attemptRecoveryFromError:optionIndex:delegate:didRecoverSelector:contextInfo:
    which is invoked by applications with a document-centric user interface.


    Recovery attempters work hand-in-hand with the OS X responder chain. To cause
    the recovery attempter to be used, you call either -presentError: or -presentError:modalForWindow:delegate:didPresentSelector:contextInfo:
    on any object in the responder chain. These two methods correspond to presenting
    an error for a modal application in the former case, and a document-based application
    in the latter case. When you call them, they will present an alert to the user,
    displaying the information from the NSError. When the user clicks a button, the
    appropriate recovery attempt method will be called on the recovery attempter,
    passing the index of the clicked button as the optionIndex parameter.


    The -attemptRecoveryFromError:optionIndex: method returns a BOOL value if the
    error is able to be recovered from. The -presentError:modalForWindow:delegate:didPresentSelector:contextInfo:
    method is expected to call the selector provided on the delegate object. That
    selector should take a form similar to Listing 10.9.'
