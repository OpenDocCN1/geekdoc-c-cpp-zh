- pgno: 105
  md: "The real purpose of the initializer, aside from creating self, is to initialize\
    \ any data members in the object. So, after you have verified that self is not\
    \ nil, you can initialize your variables. Having initialized your variables, you\
    \ then return self from your initializer method.\n\nIn some cases, it may make\
    \ sense to provide multiple initializers for your class. For example, if there\
    \ are different ways to create an object and different parameters need to be passed\
    \ to the initializer in these different states. In these cases, you can create\
    \ multiple, different initializers that take different parameters. To avoid duplication\
    \ in your code, however, it makes sense to call other initializers from within\
    \ your initializer. Doing this allows you to keep specific initialization in one\
    \ place and only one place.\n\nIn addition to the concept of an initializer, there\
    \ is also the concept of the designated initializer. Typically it takes the fewest\
    \ number of parameters of all your initializers, and it is the final initializer\
    \ that all your other initializers will call to set up the initial state of your\
    \ object.\n\nAn example of this is shown in Listing 3.6.\n\n# Listing 3.6\n\n\
    # An example showing different initializers is calling the designated initializer\n\
    \n```\n-(id)init\n{\n    if((self = [super init]))\n    {\n        memberVariable\
    \ = [[NSMutableArray alloc] init];\n    }\n    return self;\n}\n\n-(id)initWithArray:(NSMutableArray\
    \ *)inArray\n{\n    if((self = [self init]))\n    {\n        memberVariable =\
    \ [inArray retain];\n    }\n    return self;\n}\n```\n\nThe second kind of special\
    \ method that you need to be familiar with is the dealloc method. The dealloc\
    \ method is the opposite of the init method. It enables you to free up resources\
    \ that were allocated in your commit method or elsewhere in your object. You must\
    \ be sure to call the superclass dealloc method before the method exits. Listing\
    \ 3.7 shows an example of a dealloc method."
  merge: -1
  img_proc: true
- pgno: 106
  md: "# Listing 3.7\n\n# An example showing a different initializer calling the designated\
    \ initializer\n\n```\n-(void)dealloc\n{\n    [memberVariable release]; memberVariable\
    \ = nil;\n    [super dealloc];\n}\n```\n\n# CAUTION\n\nYou should be sure not\
    \ to call the super dealloc method before releasing your own variables. This can\
    \ cause a crash.\n\nI discuss initializer and dealloc methods in greater detail\
    \ in Chapter 4. For now, it’s important that you simply be familiar with the methods\
    \ because you will be using these methods in the upcoming example code.\n\n# Writing\
    \ class methods\n\nIn Objective-C, classes themselves also have many of the same\
    \ capabilities as objects. For example, classes have the ability to have static\
    \ methods declared upon them that can be called directly from the class itself.\
    \ When using these kinds of methods, you don’t need to have instantiated an instance\
    \ of the class that you’re working with. This can be convenient for methods that\
    \ are used for creating instances of your class, such as factories and singletons.\
    \ In fact, the Cocoa frameworks utilize class methods for many of the built-in\
    \ classes for the purposes of creating instances of the class. In other languages,\
    \ such as C++ or Java, class methods are often referred to as “static methods.”\
    \ If you are familiar with these languages, you may be familiar with this terminology.\n\
    \n# NOTE\n\nA factory method in Objective-C is a class method that is used as\
    \ a convenience for constructing an object. It always returns an autoreleased\
    \ object. Factory methods are covered more in Chapter 4.\n\n# CROSS-REFERENCE\n\
    \nSingletons are covered in Chapter 17.\n\nDeclaring a class method is very similar\
    \ to declaring an object method; the only difference is that instead of using\
    \ a hyphen in front of the method declaration, instead you use a plus sign. Listing\
    \ 3.8 shows an example of a class method declaration."
