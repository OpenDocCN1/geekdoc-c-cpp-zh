  md: "```\nfor(int n = 0; n < [eqParts count]; n++)\n{\n    NSString *argString =\
    \ [eqParts objectAtIndex:n];\n    char firstChar = [argString characterAtIndex:0];\n\
    \n    if(isAnOperator(firstChar))\n    {\n        operator = firstChar;\n    \
    \    continue;\n    }\n\n    double newValue = [argString doubleValue];\n\n  \
    \  switch (operator)\n    {\n        case '+':\n            result = add(result,\
    \ newValue);\n            break;\n        case '-':\n            result = subtract(result,\
    \ newValue);\n            break;\n        case '*':\n            result = multiply(result,\
    \ newValue);\n            break;\n        case '/':\n            result = divide(result,\
    \ newValue);\n            break;\n        default:\n            result = add(result,\
    \ newValue);\n            break;\n    }\n}\n\nNSLog(@\"% .3f\", result);\n\n[pool\
    \ drain];\nreturn 0;\n}\n```\n\n# NOTE\n\nI said earlier that switch statements\
    \ only work with integers, and yet, here I am using chars. Recall when talking\
    \ about scalars that chars are represented internally as integers. Using the single\
    \ quote characters, ‘ ’, the compiler automatically converts the character inside\
    \ the single quotes to the integer representation of the value of that character.\n\
    \nNext, create a new C source file, name it MathOperations.m, and make it look\
    \ like Listing 2.42."
