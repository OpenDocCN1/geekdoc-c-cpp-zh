- pgno: 108
  md: 'The most common use of class methods is in the use of factories, like this
    method. Many classes in Cocoa and Cocoa Touch have factory methods defined on
    classes to make creation of objects easier. For example, the NSArray class includes
    the factory method [NSArray array] which returns a properly constructed NSArray
    object. (I discuss some special memory management rules in Chapter 4.) When creating
    class methods, you can use the self object to refer to the class itself, as in
