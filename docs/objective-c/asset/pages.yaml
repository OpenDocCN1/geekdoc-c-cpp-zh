  md: "| Function | Purpose |\n|---|---|\n| @unionOfArrays/@distinctUnionOfArrays\
    \ | Given a collection of arrays returns an array containing all of the arrays\
    \ in the collection. In the case of the distinct aversion, it returns only unique\
    \ arrays. |\n| @unionOfSets/@distinctUnionOfSets | Given a collection of sets\
    \ returns a set containing all of the sets together. In the case of the distinct\
    \ version, it returns only unique sets. |\n| @unionOfObjects/@distinctUnionOfObjects\
    \ | Given a collection of sets or arrays, returns all of the elements of all of\
    \ the collections as a single array. The distinct aversion returns only unique\
    \ elements. |\n\n# Writing KVC compliant accessors\n\nThe Objective-C runtime\
    \ accomplishes all of this magic partially through capabilities of the underlying\
    \ frameworks and partially thanks to coding style conventions. Although the Objective-C\
    \ runtime does the heavy lifting as far as the functionality of KVC, it relies\
    \ upon you, the developer, to write accessors for your properties that follow\
    \ specific conventions so that it can retrieve and set values by using KVC.\n\n\
    The KVC standard for setters and getters is to use setters that follow a pattern\
    \ of set<Value>: and getters that follow the pattern of simply <value>. In both\
    \ of these cases, the <value> part of the pattern should be replaced with the\
    \ name of the property that you are accessing. This property should be a member\
    \ variable whose name is specified using camel case.\n\n> NOTE\n> The term camel\
    \ case refers to a standard for variable naming in which the words in a variable\
    \ are packed together into one long string. In this string, the first letter of\
    \ each word, with the exception of the first word, is capitalized. For example,\
    \ to write a variable name called \"some variable name,\" you would write it as\
    \ someVariableName. Notice, when looking at the variable name, that the capital\
    \ letters in the inner part of the variable name resemble the hump on a camel.\
    \ This is where it derives its name.\n\nSo, given a class definition as shown\
    \ in Listing 6.7, you might write accessors as shown in Listing 6.7.\n\n# Listing\
    \ 6.7\n\n# Class definition with member variables.\n\n```\n@interface MyClass\
