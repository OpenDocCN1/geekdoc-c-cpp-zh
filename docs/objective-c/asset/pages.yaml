  md: "# Listing 9.3 (continued)\n\n```\n[[NSUserDefaults standardUserDefaults] setObject:someValue\
    \ forKey:THE_KEY];\n\n// do stuff...\n\nNSString *theValue = [[NSUserDefaults\
    \ standardUserDefaults] stringForKey:THE_KEY];\n\n[pool drain];\nreturn 0;\n}\n\
    ```\n\nAs you can see, at the top of this new source listing we are defining a\
    \ macro called THE_KEY. This macro is being defined to be @ \"MY_IMPORTANT_DATA\"\
    \ . Everywhere in the subsequent code where the words THE_KEY are located will\
    \ be replaced with the string @ \"MY_IMPORTANT_DATA\" when the program is compiled.\
    \ This will happen transparently as part of the compilation process but the end\
    \ result is that this code, when compiled, will actually wind up being exactly\
    \ the same as the listing that we saw previously. The only difference is that\
    \ when you are writing the source code you can take advantage of Xcode’s built-in\
    \ code completion, and the compiler will detect if you have any instances of THE_KEY\
    \ that were typed incorrectly. For example, if you accidentally wrote THE_KEY\
    \ instead of THE_KEY, the compiler can check for that condition and issue an error.\n\
    \nListing 9.4 shows another example where the program is taking different actions\
    \ depending on whether the given macro value (DEBUGGING) is defined.\n\n# Listing\
    \ 9.4\n\n# Optional compilation based on a macro\n\n```\n#import <Foundation/Foundation.h>\n\
    \n#define DEBUGGING 1\n\nint main (int argc, const char * argv[])\n{\n    NSAutoreleasePool\
    \ * pool = [[NSAutoreleasePool alloc] init];\n#ifde f DEBUGGING\n```"
