- pgno: 255
  md: "# Listing 9.12\n\n# The expanded code\n\n```\n#import <Foundation/Foundation.h>\n\
    \nint main (int argc, const char * argv[])\n{\n    NSAutoreleasePool * pool =\
    \ [[NSAutoreleasePool alloc] init];\n\n    NSString *someVar = @\"This is the\
    \ value.\";\n\n    NSLog(@\"%s: %@\", \"someVar\", someVar);\n\n    [pool drain];\n\
    \    return 0;\n}\n```\n\n# NOTE\n\nThis code is deliberately simplistic for the\
    \ purposes of example. In the case where you would actually want to create a macro\
    \ like this you probably need to do something to determine the data type of the\
    \ variable that’s passed in so that you can use a correct format string when printing\
    \ it out.\n\n# Handling conditional switching\n\nYou can choose to conditionally\
    \ compile particular parts of your code by using the conditional preprocessor\
    \ directives, #if, #ifdef, #ifndef, and their cohorts, #else, #elif, and #endif.\
    \ You can optionally choose to include or not include entire chunks of your code\
    \ based on whether something is defined, not defined, or whether an expression\
    \ evaluates to true.\n\nThe first of these directives is the #if directive. The\
    \ #if directive is used to allow or prevent a particular portion of your code\
    \ from compiling based on the result of an expression. The expression can be any\
    \ valid expression, using other macros, constants, variables from the code surrounding\
    \ the macro expansion, or whatever. The key is that it must evaluate to true in\
    \ order for the block following the #if directive to be compiled. You terminate\
    \ the #if statement with a #end statement. If you want to provide an additional\
    \ block of code to be compiled in the case that the expression evaluates to false,\
    \ you put a #else directive inside the #if block, before the #end directive. Alternatively,\
    \ you can place a #elif directive inside the #if block."
