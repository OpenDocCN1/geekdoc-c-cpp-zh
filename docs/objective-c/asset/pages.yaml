  md: 'Similarly, when returning values from functions, you have to be careful to
    not return pointers or references to variables that will be out of scope when
    the function exits. For example, if you return the address of a value inside of
    your function, when the calling function tries to access that value, that variable
    will have been deallocated and therefore will no longer be available — this causes
    a crash.


    When I talk about objects in Chapter 3 and memory management in Chapter 4, I will
    show you how you can return pointers created in your functions to other functions.
    For now, however, stick with simple values.


    # Understanding implementation versus interface


    Collections of functions can be grouped together into separate source files so
    that you don’t have to clutter your main source with all your programming logic.
    These source files are typically called units.


    When you separate your source code into units, a unit consists of two files: One
    of them contains declarations of your functions, the other one contains definitions
    for those declarations. Understanding the difference between declarations and
    definitions is an important concept that you need to understand.


    You’ve already seen function definitions. The functions that you’ve worked with
    so far have all been fully defined. A function definition is where you actually
    write the code that makes up the function itself. A function declaration declares
    the function signature for your function including the return type, the function
    name, and its parameters. It does not include the actual definition of what the
    function does.


    Function declarations can be said to be declaring the interface to your function.
    This is a loose definition, but later, when we discuss object-oriented programs,
    you will see that this concept of interfaces is heavily used.


    Extending this idea, the function definition can therefore be said to be the implementation
    of the interface that you declared.


    To declare a function that can be used in other units, you use the extern keyword
    and then the function signature just like your function definition. Because a
    function declaration is a statement, just like declaring a variable, you also
    need to include an additional semicolon at the end of your function signature.
    Knowing when to place the semicolon and when not to is a common mistake new programmers
    make. Be sure to remember that the semicolon comes after the declaration but not
    after the definition.


    So, imagine that we wanted to encapsulate our factorial calculation method in
    its own unit.'
