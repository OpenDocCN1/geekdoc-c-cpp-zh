- pgno: 319
  md: 'that you want to read as its parameter. To do the same thing but with a resource
    from the Internet, you use the factory method +dataWithContentsOfURL:. This method
    will access the Internet using the provided protocol from the provided URL and
    download the resource and make the raw data of that resource available as the
    raw data of the NSData object. As usual, as in most cases with these kinds of
    convenience methods, the download process will block the current thread until
    it completes so use this method with caution. NSData also provides methods for
    writing data to disk using the methods -writeToFile:atomically: and -writeToURL:atomically:.
    The latter of these methods only supports writing to local file URLs. Each of
    these takes as a secondary parameter one which specifies whether to write the
    file atomically. In cases where the data that you are writing is especially large,
    it may be possible for your application to terminate in the middle of writing
    the data. This can result in a corrupted file on disk. The atomic parameter specifies
    that the file will first be written to a scratch file and when the file operation
    is complete the scratch file will then be copied over to the final location. By
    using this flag, you know that your original file will only be overwritten if
    the replacement file has been able to be completely written successfully.


    # Accessing the raw bytes in an NSData object


    The NSMutableSet class provides an object-oriented interface for an NSData object
    containing bytes that you want to be able to manipulate. You can add bytes to
    it by using the methods -appendBytes:length: and -appendData:; you can replace
    bytes using the method -replaceBytesInRange:withBytes:; and you can also truncate
    or expand the NSMutable Data buffer by using the method -setLength:. If you want
    to simply zero out a particular portion of the buffer (setting it''s bytes to
    0''s) you can use the method -resetBytesInRange:. This provides you with all the
    tools you need to manipulate raw data from files and structures at will. Listing
    14.6 shows how you can use this capability to read a file from disk, modify specific
    bytes, and then write it back out to disk. In this case, the file in question
    is a legacy game data save file, which uses a hard-coded file format wherein particular
    values are stored at particular locations in the data.


    Listing 14.6


    # Modifying the raw bytes of a game save file


    ```

    int goldOffset = 617; // at location 617 in the file

    int goldLength = 4; // 4 bytes are used for storing the gold


    NSRange goldRange = NSMakeRange(goldOffset, goldLength);

    NSMutableData *gameData = [NSMutableData dataWithContentsOfFile:@"..."];


    [gameData replaceBytesInRange:goldRange withBytes:newGoldValue]; [gameData writeToFile:@"..."
    atomically:YES];

    ```'
