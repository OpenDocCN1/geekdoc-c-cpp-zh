  md: '# Using NSData and NSMutableData


    When working with chunks of binary data, foundation provides you with the NSData
    and NSMutableData classes to be used for an object-oriented interface in manipulating
    that data. These classes can manage the allocation and deallocation of buffers
    and also provide an object wrapper for the purposes of storing the data in collection
    classes. They also provide an interface for writing data to files and transmitting
    data through socket communication.


    # Creating NSData objects


    You can create NSData objects either by using an existing low-level data structure
    that you have previously allocated or by copying data from any of the other types
    of Objective-C objects that support the NSCopying protocol.


    To create an NSData object using raw bytes from a C data structure, you use the
    factory method +dataWithBytes:length:, which takes a pointer to a data buffer
    and then copies the bytes from that data buffer into the NSData object. If you
    prefer to access the bytes inside the buffer directly, without copying them, you
    can use the factory method +dataWithBytesNoCopy:length:, which also constructs
    an NSData object but without copying the data, thus resulting in an NSData object
    with a buffer directly accessing the raw memory that you provide. In this case,
    the bytes provided must have been allocated by using malloc because the NSData
    object when released will free the bytes using the free function. Because NSMutableData
    allows you to make modifications to the data within it, doing so while pointing
    to an externally allocated buffer would lead to problems, therefore, when using
    NSMutableData, the object will copy the bytes regardless of whether you specify
    whether or not to copy them. Listing 14.5 shows an example of creating an NSData
    object using a preallocated buffer of bytes.


    # Listing 14.5


    # Creating an NSData object


    ```

    char *buf = malloc(1024);


    NSData *data = [NSData dataWithBytes:buf length:1024];

    ```


    One of the more common uses for NSData objects is to access the bytes stored in
    files or resources on the Internet. You can easily create an NSData object with
    the contents of a file by using the factory method +dataWithContentsOfFile:, which
    takes the path to the file'
  merge: -1
