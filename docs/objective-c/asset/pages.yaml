- pgno: 22
  md: '# Introducing Objective-C


    The year was 1986. Halley’s Comet was the closest to the sun that it had been
    in 75 years. The United Kingdom and France announced plans to construct the Channel
    Tunnel. Polaroid was all the rage and had just recently forced Kodak to leave
    the instant camera business. The C programming language had been in use for about
    15 years, but C++ was a newcomer to the field, and barely known. The Smalltalk
    programming language had been making the rounds in the technology industry and
    getting people excited about a new concept in programming called object-oriented
    programming, or OOP for short.


    Two developers, Tom Love and Brad Cox had been exposed to Smalltalk while at ITT
    Corporation’s Programming Technology Center. Cox thought that it would be interesting
    to add object-oriented features to the C programming language, enabling object-oriented
    programming in C. In fact, he called his extension to COOPC, which stood for object-oriented
    programming in C. Eventually, the two formed a company to commercialize these
    extensions and market them as a language to developers. The name of this new language
    was changed to Objective-C. A few years later, a tiny startup headed by Steve
    Jobs, called NeXT, licensed and standardized Objective-C as the primary language
    that they wanted to use to develop a new operating system called NeXTstep. NeXT
    computer was eventually purchased by Apple, resulting in the absorption of the
    NeXTstep operating system, and its eventual evolution into Mac OS X.


    Few people realize that Objective-C is as old as it is, and that it has in fact
    influenced many other programming technologies. For example, the Java programming
    language shares a great deal in common with Objective-C. The reason for this is
    that early in Objective-C’s history, NeXT computer partnered with Sun Microsystems
    to develop the OpenStep platform. The language that they used to develop this
    technology was Objective-C. When NeXT computer did not do as well as they had
    hoped, and the company began to fail, Sun decided to develop their own language
    and cross-platform development kit, Java. The engineers that worked on Java were
    intimately familiar with Objective-C because Objective-C is the language that
    they had been using prior to developing Java. As a result, they copied many of
    the better features of Objective-C to the new language they created.


    # In This Chapter


    +   - Learning about Objective-C history

    +   - Exploring Xcode for writing Objective-C Code

    +   - Configuring your development environment'
  merge: -1
  img_proc: true
- pgno: 23
  md: 'Today, Objective-C is the language of choice for developing both on Mac OS
    X and iPhone OS. It has evolved to become an elegant solution, fitting just right
    between fully statically typed languages and dynamically typed languages. It is
    one of the few languages that is typically compiled, thus benefiting from the
    compile time syntax checking of languages like C and C++ while at the same time
    benefiting from a dynamic runtime, which enables dynamic object typing.


    In addition to Mac OS X and iPhone OS, Objective-C has grown quite a following
    on other platforms as well and can be used to develop applications on Linux, Windows,
    and anywhere else that the GNU compiler collection has been ported. Its use on
    the iPhone OS has especially increased the popularity of this language, and brought
    many new developers to it. It could even be argued that Objective-C is experiencing
    a new renaissance today — hundreds of thousands of new developers are flocking
    to this language, making it one of the hottest new sensations in technology today.


    In this book, I hope to introduce you to Objective-C and show you why I think
    it is a first-class language deserving a place among the best programming languages
    in the world. I like to say that a good programmer needs three languages under
    his belt. The first is a workflow automation language. Typically, this is a scripting
    language. One that he can use to automate his workspace and to build ad hoc tools
    to help optimize his workflow. The second is an editor macro language. As developers,
    we spend 99 percent of our time crafting text into software. Having a tool that
    helps you to manipulate your editor is amazingly valuable. The last one is a language
    for building systems and applications — one that can be used to deploy applications
    that require high performance and high reliability. Usually these languages are
    compiled so that you can squeeze the most performance out of your platform of
    choice. Their most important feature, however, is the ability to leverage system
    libraries to their fullest extent.


    My hope is that by the end of this book, Objective-C will become your application
    language of choice. There is no task that this language cannot perform as well
    as or better than any other compiled language out there.


    # Using Xcode for Development


    In this book, I assume that you will be using the Xcode development environment
    for your coding. Xcode is an excellent IDE provided by Apple for free by simply
    signing up for the Apple developer program. It supports C, Objective-C, C++, Java,
    and several other languages natively, but we’re only going to use it for Objective-C
    here.


    # Starting a project


    When you first start Xcode, you are given the choice to open a recently opened
    project or to create a new one. For the purposes of our discussion here, choose
    to start a new project at this time so you can follow along. This brings up the
    New Project dialog box, as shown in Figure 1.1.'
  merge: -1
  img_proc: true
- pgno: 24
  md: '# Figure 1.1


    New Project dialog box


    ![](img/aaee977487e7a3eefe7b1dd596e0f6fb_24_0.png)


    In this dialog box, you can choose to create various kinds of projects, including
    command line applications to desktop graphical applications. You can find templates
    for virtually anything. Additionally, if you have the iPhone SDK installed, there
    are also project templates for various kinds of iPhone and iPad applications.
    Because you are primarily interested in simply understanding the Objective-C language,
    choose the project that is the simplest of all of these.


    +   1. From the Mac OS X group, choose Application and then choose Command Line
    Tool.

    +   2. Under the Type drop-down list, choose Foundation.

    +   3. Click the Choose button, choose a location to save your new project, and
    click Finish.


    Over the next few sections, I''m going to give you a brief introduction to the
    Xcode development environment so that you can become familiar with it. To begin
    with, look at the Xcode window. It is shown in Figure 1.2.'
  merge: -1
  img_proc: true
- pgno: 25
  md: '# Figure 1.2


    The main Xcode window


    ![](img/aaee977487e7a3eefe7b1dd596e0f6fb_25_0.png)


    The main Xcode window consists of two panels. The first one, shown on the left,
    contains all the files in your project. Selecting one of these files brings up
    that file in the Editor panel, located on the right-hand side of the window. Project
    files can be grouped in Xcode by moving them into folders within your project.
    For the most part, these groups are strictly for your benefit during development
    and have little or no impact on the final completed project.


    In addition to your source files, the frameworks that you are linking your project
    with are also shown.


    Below the project files are a set of Smart groups. These encapsulate things such
    as the targets that your project will make, search results, and breakpoints.


    The Targets group contains the targets that your project will compile. By modifying
    the settings on the objects within this group, you override the project-wide settings
    for your compilation. This is also where you can add and edit custom compilation
    steps for your projects. Figure 1.3 shows the build settings from this group.'
