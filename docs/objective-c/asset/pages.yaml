  img_proc: true
- pgno: 46
  md: 'There are actually two primary Objective-C runtimes. The “modern runtime,”
    which is used on 64-bit machines and on the iPhone, and the “legacy runtime,”
    which is used on 32-bit Mac OS X and everywhere else. There are several features
    in the “modern runtime” that are very advantageous for development, but because
    of its lack of widespread use, the code samples that I show in this book will
    be written for the legacy runtime. The modern runtime is completely backwards
    compatible with the legacy runtime, so this will not present any problems for
    you in writing code. In cases where there are significant advantages to the modern
    runtime, I will try to make a note in the text for your reference.


    The Objective-C runtime is automatically added to your application when you compile
    it. Using it is completely transparent, unless you need to use some of its advanced
    features. For now, however, the important thing to understand is simply the capabilities
    that the runtime gives you in terms of dynamic typing and static typing. This
    is a unique capability that Objective-C has in comparison to other programming
    languages.


    One of the side effects of this capability is the introduction of the `id` data
    type. The `id` data type is a special type of object in Objective-C that can actually
    be any type of object. I discuss more details in Chapter 3.


    # Summary


    In this chapter, I’ve introduced you to the Xcode integrated development environment,
    which you use throughout this book for developing your applications. I’ve shown
    you how to configure it to your tastes, how to organize your files within it,
    how to build your applications, and how to read its output to find errors in your
    code. I also explained the compilation process and the format of application bundles,
    as well as explained a bit about the Objective-C runtime.'
