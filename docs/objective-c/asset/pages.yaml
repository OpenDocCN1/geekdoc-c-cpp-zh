- pgno: 341
  md: "calculated. To do this, from your background thread you simply use the NSObject\
    \ method -performSelectorOnMainThread:withObject:waitUntilDone:. This method takes\
    \ three parameters. The first is the name of the selector to call. This selector\
    \ will be called on whatever object the -performSelector method is being called\
    \ on. The second parameter is an optional object that will be passed to the method\
    \ that’s called. Finally, the third parameter specifies whether you want the current\
    \ thread to block until the method that you’re calling on the main thread has\
