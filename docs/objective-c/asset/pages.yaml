  md: '# Listing 2.29


    # Calling the function


    ```

    #import <Foundation/Foundation.h>

    #import "Factorial.h"


    int main (int argc, const char * argv[])

    {

    NSLog(@"5!: %ld", calculateFactorial(5));

    NSLog(@"10!: %ld", calculateFactorial(10));

    NSLog(@"15!: %ld", calculateFactorial(15));

    NSLog(@"20!: %ld", calculateFactorial(20));


    return 0;

    }

    ```


    The definition of the function is now removed from this file and replaced with
    an import command.


    Import statements are used to include other units’ interfaces in your current
    unit. The import statement works by searching through the directories of your
    project and through the frameworks associated with your project for the interface
    file that you want to include. When you use angle brackets <> to enclose the filename,
    as in the case with the Foundation framework, it searches the system paths for
    the interface file. When you use quotes, the statement only searches the current
    directory of your project and any of its subdirectories.


    The rules concerning the search directories for interface files can be difficult
    to remember, so I suggest you simply remember these two rules of thumb: If an
    interface file is part of your project, and something that you created, then you
    want to use quotes when specifying it in an import statement; otherwise, if the
    interface file is part of a third-party framework or part of the frameworks provided
    by Apple, then you want to use angle brackets.


    # Linking with implementation files


    After you split your code into units and use those units in your code, you still
    have one more thing that you need to do. You need to ensure that the implementation
    file is linked to your executable. An executable is made up of multiple implementation
    files linked together with the Objective-C runtime. As you add more implementation
    files to your project, you have to make sure that they are also linked with your
    executable. Typically, when you create a new file, Xcode asks you if you want
    to include it in your project. In Figure 2.6, notice the check box indicating
    that this file will be added to the Listing 2.6 target.'
