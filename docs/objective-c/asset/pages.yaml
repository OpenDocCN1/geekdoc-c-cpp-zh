  md: 'The important changes here center around the fact that you can now check the
    return code of the -openFileAtPath:withError: method. If it’s NO, then the error
    object should now contain an initialized NSError object containing everything
    you need to display an error to the user.


    ![](img/aaee977487e7a3eefe7b1dd596e0f6fb_274_0.png)


    # CAUTION


    Some code examples with NSError call for you to set NSError to nil, and then check
    to see if NSError has been initialized to determine if an error occurred. This
    is absolutely wrong. There are parts of Cocoa that do manipulate the NSError object
    even though they succeed. The correct pattern to use with NSError is as shown
    here. Check the return code of the method, and if it’s NO or nil, then check the
    error object for more information.


    This method of error handling is the best of all worlds. It’s simple and informative,
    and it doesn’t force the user to handle the error. It provides enough flexibility
    for the user of the API to do the right thing while not pretending to know better
    than her.


    # Summary


    Error handling is a vital part of being an effective programmer, so it’s good
    that Objective-C gives you enough tools to handle error conditions gracefully
    and correctly. You have the tools available to you. Use them.'
