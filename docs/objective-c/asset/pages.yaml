- pgno: 197
  md: 'When setting a value for a particular key, the runtime first searches the class
    for any accessor that matches the standard accessor pattern I''ve mentioned before,
    that is, -set<ValueName>: . If no accessor is found, your class can also implement
    the optional method -accessInstanceVariablesDirectly, and return YES. In this
    example, the runtime then searches the class for any instance variables that follow
    the naming pattern of _<valueName>, _is<valueName>, <valueName>, or is <valueName>,
    in that order. If none of these apply, the method -setValue:forUndefinedKey: will
    be called. The default behavior for this method is to raise an exception.


    When getting a value by using Key Value Coding, the runtime follows a similar
    procedure in finding the variable that a given key represents. Specifically, first
    it searches your class for an accessor whose name matches the pattern -get<ValueName>,
    -<valueName>, or -is<ValueName>, in that order. If it finds such an accessor,
    then it retrieves the value using it. If no accessor following these specifications
    can be found, it next attempts to determine if the value that you are trying to
    access is instead an array. To do this, it checks for methods which match the
    pattern -countOf<ValueName> and -objectIn<ValueName>AtIndex: and -<valueName>AtIndexes:
    . The existence of these array KVC accessors, indicates that the value being accessed
    is an array stored in a member variable. If these accessors are found, the runtime
    returns a proxy NSArray object containing proxy methods correlating to all of
    the above accessors it found. Accessing any of these methods on the NSArray object
    causes the corresponding accessor on the original object to be called instead.


    Next, the runtime tries to determine if the value that you are trying to access
    is accessible as a set. To do this, it checks for the methods -countOf<ValueName>,
    -enumeratorOf<ValueName>, and -memberOf<ValueName>: . If all three of these methods
    are found, a proxy NSSet object is returned. When accessing this proxy object,
    if any of the aforementioned methods are called on the proxy object, they are
    automatically forwarded to the corresponding method on the original object.


    Again, just like when setting values, if the class method -accessInstanceVariablesDirectly
    is implemented and returns YES, the runtime will search for member variables following
    the standard naming convention of _<valueName>, _is<ValueName>, -<valueName>,
    or -is<ValueName> . Also, just like setters, if it finds any of these member variables,
    it will access them directly.


    Finally, if none of this works, the runtime will call the method -valueForUndefinedKey:
    just like when setting a value.


    # Observing Changes to KVC-Compliant Values


    One of the neat Objective-C technologies that builds on Key Value Coding is Key
    Value Observing. Key Value Observing allows you to register as an observer of
    a given object and'
