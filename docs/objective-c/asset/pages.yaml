- pgno: 211
  md: 'Figure 7.1 shows a class diagram describing the relationships between a class,
    which holds business logic and a class provided for network connectivity. This
    is a classic “compositional” design.


    The idea here is that the NetworkConnector class provides all the interaction
    with the network server. It connects, disconnects, and sends and receives data.
    The BusinessLogic class takes the data that the NetworkConnector receives, and
    it decides where in the application that data needs to go.


    # Figure 7.1


    Tightly coupled BusinessLogic and NetworkConnector.


    ![](img/aaee977487e7a3eefe7b1dd596e0f6fb_211_0.png)


    The problem arises when you have to talk from the NetworkConnector class back
    to the BusinessLogic class, for example when receiving data. Network connectivity
    is an incredibly generic concept. Something you could definitely reuse in other
    applications, or even in the same application in different locations. If you want
    to design the network class in a completely generic way so that the network class
    can be reused over and over again, you have to design it so that it is not in
    any way tightly coupled to its client classes, in other words the BusinessLogic
    class.


    You can’t have the NetworkConnector requiring the BusinessLogic class as a dependency
    because you can’t always count on the existence of the BusinessLogic class being
    the class that’s using your NetworkConnector.'
  merge: -1
  img_proc: true
- pgno: 212
  md: 'One way to solve this using inheritance is to force the `BusinessLogic` class
    to inherit from some parent class which the `NetworkConnector` class can rely
    upon. This is shown in Figure 7.2.


    # Figure 7.2


    `BusinessLogic` class inheriting from generic `NetworkClient` class.


    ![](img/aaee977487e7a3eefe7b1dd596e0f6fb_212_0.png)


    In this situation, you are limiting the developer of the client class by forcing
    them to inherit from a particular parent. If that parent class doesn’t smoothly
    fit into that developer’s object hierarchy, then this can present significant
    design problems. For example, imagine that the `BusinessLogic` class needed to
    both communicate with the network, as well as communicate with a disk I/O system
    that had a similar callback mechanism. Using straight inheritance such as this
    simply won’t work in that situation.


    # Understanding why you don’t need (or want) multiple inheritance


    Some languages, such as C++, solve this kind of problem through multiple inheritance.
    Figure 7.3 shows an example of how you might solve the network communication problem
    in C++.


    The problem with multiple inheritance is typically referred to as the “diamond
    problem” and is illustrated in Figure 7.4.'
  merge: -1
  img_proc: true
- pgno: 213
  md: '# Figure 7.3


    Using multiple inheritance.


    ![](img/aaee977487e7a3eefe7b1dd596e0f6fb_213_0.png)


    As you can see in the class diagram, the main problem with multiple inheritance
    arises from the fact that it is possible to inherit from two different classes
    (above, class D inheriting from classes B and C), which both inherit from a common
    superclass (class A). In this situation, an ambiguity can occur wherein a method
    on the class A is called on an instance of class D. In this situation, if class
    D has not overridden that method and provided its own implementation, which superclass
    method should be called, B or C?


    Because of this problem, multiple inheritance is simply not something that Objective-C
    provides. If you only have single inheritance, then you don’t have to worry about
    the diamond problem.


    # Understanding how protocols solve the problem


    Protocols solve the problem by enabling you to declare an interface, which a class
    implements without providing any default implementation of that interface. Protocols
    do not provide a mechanism for specifying the implementation of the methods within
    them. They only provide a mechanism for declaring the interface for those methods.
    Rather than making a reusable component depend on a specific class implementation,
    you can instead make that component depend on the existence of the interface in
    the form of a protocol. Classes that implement a given protocol are expected to
    provide their own implementations of the methods specified in the protocol declaration.
    By implementing protocols in this manner, you enable classes to be written so
    that they depend only on an interface existence while at the same time removing
    the ambiguity question because any class that declares that it implements a given
    interface must also implement the methods in question. There is no “diamond problem”
    because any protocol that you declare and support has to have an implementation
    in your class.'
  merge: -1
  img_proc: true
- pgno: 214
  md: '# Figure 7.4


    The diamond problem.


    ![](img/aaee977487e7a3eefe7b1dd596e0f6fb_214_0.png)


    From an object-oriented design point of view, the class diagram for this solution
    looks nearly identical to that of multiple-inheritance, but it doesn’t allow for
    the problems that multiple inheritance invariably brings with it.


    This solution is not unique to Objective-C. Java, which in a lot of ways was based
    on Objective-C, also implements a similar concept using its version of protocols
    called interfaces. If you are coming to Objective-C from a Java background, the
    concept of protocols and interfaces is very similar, and you should feel right
    at home.


    # Documenting an expected interface for others to implement


    Another way to think about protocols is to imagine that you are documenting an
    expected interface for others to implement. In the NetworkConnector example, we
    are documenting all of the different conditions for which the network class might
    need assistance from the developer in terms of determining what to do in these
    situations.'
  merge: -1
  img_proc: true
- pgno: 215
  md: "For example, if the NetworkConnector receives data from the network, it is\
    \ reasonable to assume that the application itself contains whatever knowledge\
    \ (the business logic) is necessary to determine what to do with that data. In\
    \ other words, there is no generic way to say “when I receive data, here’s what\
    \ I’m going to do with it.” You really have to ask the rest of the application\
    \ “I just got some data, what do you want me to do with it?” It’s these kinds\
    \ of situations where protocols are perfectly and uniquely suited. You can declare\
    \ a protocol for all of the different unresolved questions (“I got data, what\
    \ do I do with it?” - “I got disconnected should I reconnect?”) that your generic\
    \ component needs to be able to delegate to a higher authority.\n\nBy declaring\
    \ these different “questions,” you are establishing a clear and precise contract\
    \ that users of your class can then fulfill. When they fulfill this contract by\
    \ implementing the protocol, they will know all of the different situations that\
    \ they will need to be prepared to handle. This system is much more flexible than\
    \ any system involving return codes, exceptions, and so on. It’s even more powerful\
    \ than simply generic callbacks, because of the uniquely verbose nature of Objective-C\
    \ method declarations and how the act of declaring a clear and obvious protocol\
    \ becomes a self-documenting callback API for your reusable components. If you\
    \ think about it in this way, the term “protocol” actually makes more sense than\
    \ “interface” because a “protocol” can be thought of as an agreed upon code of\
    \ procedure or behavior, as in diplomacy and etiquette.\n\nSo, enough theory,\
    \ now you can get your hands dirty with some code.\n\n# Implementing Protocols\
    \ in Your Objects\n\nUsing protocols is very straightforward, and follows many\
    \ of the same syntax conventions that you’ve already seen when working with classes.\n\
    \nEssentially, you first have to create the protocol declaration. You can do this\
    \ in an existing interface file, in the case where you are declaring a protocol\
    \ for use with an already existing object, like in our previous discussion with\
    \ the NetworkClient, or in its own separate interface file in cases where you\
    \ might be using this protocol for many different purposes. The protocol itself\
    \ only declares an interface and does not provide an implementation whatsoever.\
    \ Because of this, if you are creating a separate .h file for your protocol declaration,\
    \ you do not need to provide any .m file at all. The interface in the .h file\
    \ is sufficient.\n\nAfter you have declared your protocol, for any classes which\
    \ implement that protocol, they should also declare that they implement it. This\
    \ is so that the compiler can verify that the class in question is implementing\
    \ all of the methods required for the program.\n\n> **NOTE**\n> \n> It is not\
    \ actually absolutely necessary to declare that your class implements a protocol\
    \ that it supports. As we discuss shortly, some types of protocols do not need\
    \ to be declared at all. Additionally, your class can choose simply to implement\
    \ the protocol methods rather than declaring its support. In these cases, the\
    \ compiler will not be able to determine if your class supports the protocol at\
    \ compile time, so you will have to do extra work at runtime to ensure that any\
    \ objects upon which you are calling the protocol methods actually implements\
    \ them. This can, however, result in a compiler warning if another class declares\
    \ that it expects your class to implement the protocol."
  merge: -1
