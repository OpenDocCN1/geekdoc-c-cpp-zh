- pgno: 378
  md: '# Looking Toward the Future


    One of the reasons that I wanted to write this book is because I feel that Objective-C
    is an underappreciated language. Its cousins, C++, Java, and others tend to receive
    much more attention. I think one of the reasons that this is so is because, traditionally,
    Objective-C has only been useful for developing on MacOS X.


    With the advent of the iPhone and now the iPad, Objective-C has received a tremendous
    amount of new attention and has been experiencing unprecedented growth in terms
    of new users learning the language. This has been both a blessing and a curse.


    It is a blessing because it ensures that the platform will survive for many years
    to come, but it is also a curse because it demonstrates the lack of adequate standardization
    and documentation for this outstanding language.


    Unlike C and C++, Objective-C does not have an ISO standards body driving its
    specification. Some would argue that this is actually a good thing. In fact, that
    may be one of the reasons that Objective-C is as elegant and perfectly suited
    to its task as it is. However, the problem is that due to this lack of standardization,
    there is very little adoption of Objective-C outside of its core platforms. This
    means that these new developers who are coming to the platform will be limited
    in the future to developing only on MacOS X or iPhone OS.


    No one knows what the future may bring in terms of new hardware and new platforms.
    When learning a language, you are making an intellectual investment in that language
    and in the platforms upon which that language runs. In order to ensure that an
    investment in Objective-C is an investment which will pay dividends long into
    the future, we need to push Objective-C as a language beyond its core platforms.
    It needs to gain greater support and greater adoption on other platforms such
    as UNIX and Windows. I can’t say that I advocate an Objective-C ISO standardization,
    but I would definitely like to see improvements in third party project support
    on these platforms.


    To be sure, some of the projects that I introduced you to in this chapter have
    these ideals as their goals. That’s excellent, and we should help support and
    promote those projects even if they are not on platforms that we ourselves may
    favor. Keeping Objective-C alive and a viable programming environment for different
    platforms helps to make your investment here more valuable in the future.


    # Summary


    In this chapter, I’ve introduced you to a couple of open source projects which
    enable you to compile and run your Objective-C applications on platforms other
    than MacOS X or iPhone OS. Though they are not perfect, they are good, and improving,
    and in the future they may provide viable development platforms. Even today, there
    are some developers who are using these'
  merge: -1
  img_proc: true
- pgno: 379
  md: 'third-party projects for porting commercial applications. In cases where developers
    run into difficulties using these third-party projects for porting, they can also
    work with the maintainers of the projects to help improve those projects. If possible,
    I encourage you to do this as well. Not only does it help in improving language
    support on these alternative platforms it also can help improve your understanding
    of the language as well. One of the best learning environments is in working with
    existing code and trying to improve it.


    By encouraging a thriving alternative platform ecosystem for Objective-C, we help
    ensure that our intellectual investment will continue to repay us long into the
    future.'
  merge: -1
  img_proc: true
