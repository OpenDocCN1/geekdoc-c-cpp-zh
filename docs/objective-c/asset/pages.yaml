    \n```\nNSMutableArray *employees = [...];\n\nNSSortDescriptor *descr =\n[NSSortDescriptor\
    \ sortDescriptorWithKey:@\"employmentDate\"\n    ascending:YES];\n\nNSArray *descriptors\
    \ = [NSArray arrayWithObject:descr];\n\n[employees sortUsingDescriptors:descriptors];\n\
    ```"
