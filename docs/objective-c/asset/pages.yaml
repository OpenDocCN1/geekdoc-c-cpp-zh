- pgno: 317
  md: "# Doing arithmetic with NSDecimalNumber\n\nThough you can easily get at the\
    \ underlying value stored inside an NSNumber for the purposes of mathematical\
    \ operations, sometimes you may want to just perform simple operations by using\
    \ the NSNumber object. For this, Foundation provides the NSDecimalNumber class.\n\
    \nThe NSDecimalNumber class is a subclass of NSNumber that provides methods for\
    \ performing simple, base-10 arithmetical operations. It has various methods such\
    \ as -decimalNumberByAdding:, -decimalNumberBySubtracting:, -decimalNumberByRaisingToPower:,\
    \ and so on. These methods make it easy to use NSArray methods such as -makeObjectsPerformSelector:withObject:\
    \ to do math operations on all members of a collection.\n\n# NOTE\n\nNSDecimalNumber\
    \ is immutable, so all the math operations reviewed here return their result as\
    \ a new NSDecimalNumber.\n\nTo see an example of how you might use these methods\
    \ to give a bonus to all the employees in an employee dataset, take a look at\
    \ Listing 14.4.\n\n# Listing 14.4\n\n# Giving a flat $5000 bonus to all employees\n\
    \n```\nNSArray *employees = ...;\n[employees makeObjectsPerformSelector:@selector(addToSalary:)\n\
    \ withObject:[NSDecimalNumber numberWithFloat:5000.0]];\n// the implementation\
    \ of addToSalary: might be this...\n\n-(void)addToSalary:(NSDecimalNumber *)inRaise\n\
    {\n self.salary = [self.salary decimalNumberByAdding:inRaise];\n}\n```\n\nBecause\
    \ NSDecimalNumber is capable of storing very large values (up to 38 digits x 10^+/−128)\
    \ it can also be convenient for some very large number calculations, however,\
    \ using the C-level scalar values directly, rather than through NSDecimalNumber\
    \ will almost always be faster, so choose this method with care. Generally speaking,\
    \ this is for use with collections exclusively."
