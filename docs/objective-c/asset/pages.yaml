- pgno: 283
  md: '# Including the headers


    Remember that simply linking with the framework is not enough to enable you to
    actually use the classes and code contained within it. You also need to be sure
    to include the appropriate header files into your source file. Recall when you
    learned about importing header files that you tell the compiler to search the
    linked framework directories by enclosing the name of the header file you are
    importing in <>. Doing so causes the compiler to search the system including directories
    as well as any framework directories.


    # Considering garbage collection


    An important consideration when linking with third-party frameworks is to ensure
    that the framework in question supports the memory management model that you have
    selected for your project. Not all frameworks support both garbage collection
    and reference counted memory management. So be sure when you are reviewing the
    documentation for the framework that you intend to link to your project that you
    are linking with the correct version of that framework for the memory management
    system that you have selected. Linking with the incorrect version will cause a
    compilation error.


    # Summary


    In this chapter, I have introduced you to the concept of frameworks and also talked
    about the Foundation framework which serves as the closest thing to a standard
    library that Objective-C has. The remainder of this part of the book will utilize
    the Foundation framework extensively and it is important that you have this conceptual
    introduction to the framework and what it provides. Now that you have this background
    information, you’ll be better prepared for the detailed coding examples to come.'
  merge: -1
  img_proc: true
- pgno: 284
  md: '# Using Strings


    Any good standard library needs a great string class, and Objective-C with Foundation
    is no exception. In fact, the foundation framework comes with an excellent string
    class, NSString. Like many of the low-level core classes in Foundation, an immutable
    version of NSString, as well as a mutable version called NSMutableString exists.
    These two classes give you a tremendous amount of functionality when working with
    string values.


    # Understanding the String Declaration Syntax


    Although NSString and NSMutableString have many types of initializers and factory
    methods available, strings are such a commonly used class in Objective-C, a special
    language construct has been created explicitly for the purposes of declaring a
    string easily. This construct is shown in Listing 12.1.


    # Listing 12.1


    # The Objective-C NSString shortcut syntax


    ```

    NSString *someString = @"this is a string";

    ```


    Essentially, the compiler knows that any time it encounters @ and then a string
    contained within double quotes, it should create a static const NSString object
    to contain the string provided.


    Any two declarations of the exact same string value, even if stored in different
    variable names, point to the same object. Therefore, you can use these strings
    for keys, for example, where the equality of the string as compared to another
    instance of that string will be considered to be equal, both using the -isEqual:
    object method as well as the == operator, which will compare the value of the
    pointers.


    # In This Chapter


    +   - Using the NSString and NSMutableString Classes

    +   - Understanding Format Strings

    +   - Using the Special Objective-C String Declaration Syntax'
