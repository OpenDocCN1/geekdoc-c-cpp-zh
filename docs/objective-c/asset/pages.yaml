  md: "# NOTE\n\nTo cause the debugger to break when an exception is thrown, you can\
    \ set a breakpoint in the Objective-C runtime method objc_exception_throw. If\
    \ you do this, when an exception is thrown, it will trigger your breakpoint and\
    \ stop your application. You have to be careful though, since some methods will\
    \ throw and catch an exception without allowing it to pass up the stack. This\
    \ is normal, and doesn't hurt anything.\n\n# Using NSError\n\nWhen designing the\
    \ Foundation framework, Apple recognized that they needed an error handling mechanism\
    \ that retained the simplicity of a simple return code, but also provided a mechanism\
    \ for specifying more information about what kind of error occurred. As a result,\
    \ it began introducing a new error handling system called NSError. Listing 10.7\
    \ shows the file wrapper class, updated to use one.\n\n# Listing 10.7\n\n# File\
    \ wrapper class using NSError\n\n```\n-(BOOL)openFileAtPath:(NSString *)inPath\
