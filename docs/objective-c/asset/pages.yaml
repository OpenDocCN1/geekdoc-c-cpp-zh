- pgno: 252
  md: '# Figure 9.1


    The build settings window.


    ![](img/aaee977487e7a3eefe7b1dd596e0f6fb_252_0.png)


    In this example, the MAX macro takes two arguments, X and Y. It then compares
    these two arguments by using the ternary operator. If X is greater than Y, it
    returns X, alternatively, if Y is greater than X, it returns Y.


    When using parameters with a macro the parameters are specified inside parentheses
    just as if you were defining parameters for procedures. There are, however, a
    few subtle differences.


    First, you do not need to provide a data type for the parameters. This code will
    not be compiled. Instead, the macro will be expanded where it is used in the parameters
    will be inserted directly into the expanded macro code. Therefore, variable types
    are not necessary here.'
  merge: -1
  img_proc: true
- pgno: 253
  md: 'Secondly, the opening parenthesis of the parameter list must come directly
    after the name of the macro. Notice when we have been defining other macros, that
    the value that we are defining for the macro is separated from the macro name
    by a space. Therefore, if you were to put a space between the macro name and the
    opening parenthesis of the parameter list, the preprocessor would assume that
    the parameter list is the beginning of the macro value instead of part of the
    macro name.


    Another subtle difference between procedures and macros with arguments is in the
    handling of the values inside the body of the macro value. Notice in the example
    above that there are a lot of extra parentheses being used in the body of the
    macro. Again, this has to do with the fact that the macro will be expanded in
    the code and that the values will be expanded inside the macro in the code. To
    illustrate this point, consider the expansion of the code NSLog (@"Max Value:
    %ld", MAX ( x & 20, 10 ) ); . Without the additional parentheses, this might expand
    to NSLog (@"Max Value: %ld", (x & 20 > 10 ? x & 20 : 10 ) ); . In this case, order
    of operations dictates that the greater than comparison has higher precedence
    than the bitwise-AND operation and therefore would be performed on the 20 and
    the 10 rather than on x & 20 and the 10. By including the extra parentheses inside
    the body of the macro, you ensure that the order of operations is performed in
    exactly the way that you expect them to be. In other words, this code would actually
    expand to NSLog (@"Max Value: %ld", ( (x & 20) > (10) ? (x & 20) : (10) ) ); .


    # Using stringification


    One of the macro tricks that I like to use in my own code is in logging values
    of particular variables as my application is running. Doing this can be useful
    because I can see what the state of my application is without necessarily stopping
    it in the debugger and looking at particular values one at a time.


    To do this, I have to create a macro that takes a variable as a parameter. Because
    I might use this macro in multiple locations on different variables I also need
    to get the variable name and print it alongside the value of that variable. To
    do this, I use a special macro capability called stringification.


    Stringification takes whatever code is passed to it and converts it to a C string
    by enclosing it in quotes. So, for example, if given ''x + 10'' as a parameter,
    it will turn it into " ''x + 10'' ". This makes it ideal for solving this kind
    of problem.


    Listing 9.10 shows the macro as I would define it.'
  merge: -1
  img_proc: true
- pgno: 254
  md: "# Listing 9.10\n\n# A macro to print the value of a variable\n\n```\n#define\
    \ LOGVAR(var) NSLog(@\"%s: %@\", #var, var);\n```\n\nThe key here is to prefix\
    \ the variable name itself with a # symbol. This invokes the stringification.\n\
    \nIf you use this macro in an application as shown in Listing 9.11, you can see\
    \ that it will first print the name of the variable, and then it will print the\
    \ value of that variable.\n\n# Listing 9.11\n\n# Using a macro to print the value\
    \ of a variable\n\n```\n#import <Foundation/Foundation.h>\n\n#define LOGVAR(var)\
    \ NSLog(@\"%s: %@\", #var, var);\n\nint main (int argc, const char * argv[])\n\
    {\n    NSAutoreleasePool * pool = [[NSAutoreleasePool alloc] init];\n\n    NSString\
    \ *someVar = @\"This is the value.\";\n\n    LOGVAR(someVar);\n\n    [pool drain];\n\
    \    return 0;\n}\n```\n\nThe LOGVAR(someVar) line gets expanded to something\
    \ like Listing 9.12."
