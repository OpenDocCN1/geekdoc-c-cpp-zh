- pgno: 60
  md: "The word `typedef` comes from the words *type definition*, and essentially\
    \ allows you to define your own types. Using it in conjunction with structures\
    \ enables you to define a custom type that represents your structure. You can\
    \ then use this custom type anywhere you’d normally have used your structure definition.\
    \ Listing 2.13 shows the `typedef` version of the `Point` structure example.\n\
    \n# Listing 2.13\n\n# Working with point structures and typedefs\n\n```\n#import\
    \ <Foundation/Foundation.h>\n\n// declaring the point structure.\ntypedef struct\n\
    {\n    float x;\n    float y;\n} Point;\n\nint main(int argc, const char *argv[])\n\
    {\n    // declaring the point variable...\n    Point p;\n    // assigning values\
    \ to the struct's members...\n    p.x = 20.0;\n    p.y = 50.0;\n\n    // ... then\
    \ to use the point...\n    moveCursorToPoint(p);\n\n    return 0;\n}\n```\n\n\
    As you can see, by simply adding the `typedef` keyword before the `struct` keyword,\
    \ and by moving the `struct` name to the end of the structure, it does something\
    \ amazing; it allows you to declare your p variable by simply doing Point p. Essentially,\
    \ Point becomes a first-class type, and you can use it anywhere you would be using\
    \ any other type.\n\nThe syntax to use the `typedef` keyword consists of `typedef\
    \ variable-definition new-type-name`. Where `variable-definition` is the actual\
    \ type you want inserted when you use the new type, and `new-type-name` is the\
    \ new type name that you will use in your program."
  merge: -1
  img_proc: true
- pgno: 61
  md: "Due to the way typedefs allow you to use type names that more clearly describe\
    \ the type of data that will be stored in a variable, typedefs are a nice addition\
    \ that makes your code more self-documenting than code that doesn’t use them.\
    \ I touch on using typedefs again in Chapter 5 when I discuss using blocks.\n\n\
    # Using enum\n\nAnother way to define a custom datatype is to use the enum keyword.\
    \ Enum is short for enumerated type, and it allows you to create a datatype, which\
    \ has a restricted list of possible values that can be stored in it. Enums are\
    \ often used in Cocoa and Cocoa Touch for parameters and return values where the\
    \ list of possible values falls within a specific limited set.\n\nTo define an\
    \ enum, you use the enum keyword, followed by a tag for the enum you are declaring,\
    \ then followed by {}, which contain a list of the possible values for the enum\
    \ separated by commas. Listing 2.14 shows an enum definition.\n\n# Listing 2.14\n\
    \n# Creating an enum\n\n```\nenum MyEnum\n{\n    Value1,\n    Value2,\n    Value2\n\
    };\n```\n\nTo use an enum in your code, you must declare a variable to be of type\
    \ enum, followed by the tag that you specified when defining your enum. Then,\
    \ to assign a value to it, you simply use one of the allowed values from your\
    \ enum definition. Listing 2.15 shows how this is done.\n\n# Listing 2.15\n\n\
    # Using an enum\n\n```\nenum MyEnum foo;\nfoo = Value1;\n\n// or for a function\n\
    enum MyEnum myFunction();\n\n// as a parameter to a function\nvoid myFunction(enum\
    \ MyEnum foo);\n```"
  merge: -1
  img_proc: true
- pgno: 62
  md: "The actual values of the enums themselves are determined by the compiler, but\
    \ they default to integers, starting at 0 for the first value, 1 for the second,\
    \ and so on. You can force an enum to assign a specific value to one of the values\
    \ by simply providing that value as part of the enum definition, as shown in Listing\
    \ 2.16.\n\n# Listing 2.16\n\n# Assigning values to the enum options\n\n```\nenum\
    \ MyEnum\n{\n    Value1 = 20,\n    Value2 = 13,\n    Value3 = 155\n};\n```\n\n\
    This can be useful when dealing with legacy code that expects a specific value.\n\
    \nTyping out enum whenever you use an enum can be inconvenient. So enums can be\
    \ typedef’d just like structures can. Listing 2.17 shows how this works.\n\n#\
    \ Listing 2.17\n\n# Using typedef with an enum\n\n```\nenum MyEnumType\n{\n  \
    \  Value1,\n    Value2,\n    Value3\n};\ntypedef enum MyEnumType MyEnum;\n\n//\
    \ Now this allows you to type...\nMyEnum foo;\nfoo = Value1;\n```\n\nCocoa and\
    \ Cocoa Touch use enums quite a bit. The nice thing about enums is that they allow\
    \ you to have a compile-time check to verify that the parameter passed to your\
    \ function is one of a limited set of values. If you accidentally pass the wrong\
    \ value, the compiler will generate an error."
