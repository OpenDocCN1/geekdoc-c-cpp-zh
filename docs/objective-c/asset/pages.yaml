- pgno: 31
  md: '# Figure 1.8


    File Navigation drop-down list


    ![](img/aaee977487e7a3eefe7b1dd596e0f6fb_31_0.png)


    # Understanding the Compilation Process


    Before we can begin a detailed introduction of the language features of Objective-C,
    you must have a thorough understanding of how the compilation process works. The
    process of compilation is the process by which the computer turns your typed code
    into instructions that the computer can actually execute. At the end of the day,
    computers are really only able to execute instructions in their native language.
    That language is typically extremely verbose and difficult for humans to understand
    and work with. Therefore, for humans to write instructions for the computer, we
    use higher-level languages, such as Objective-C. We write our programs in text
    editors, save the file to disk, and then run a compiler over the text file. The
    compiler then takes the text and turns it into instructions that the computer
    can execute.


    Most of this is Computer Science 101. If you are already familiar with programming,
    perhaps in another language, then you already know all this information. You can
    probably safely skip the next few sections. If, however, you are brand-new to
    programming, then this information will be useful to you. It''s instructional
    to understand this process even though, in practice, the process of compiling
    your code is very short.


    The first step in understanding the compilation process is in writing code.


    # Writing code


    As I said before, as a programmer, you will spend 99 percent of your time crafting
    text into software. All software development requires that a programmer enter
    the instructions for the computer into a text editor before it is compiled. This
    is typically referred to as writing code.'
  merge: -1
  img_proc: true
