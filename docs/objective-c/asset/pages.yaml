- pgno: 79
  md: '# Figure 2.7 The target check box


    ![](img/aaee977487e7a3eefe7b1dd596e0f6fb_79_0.png)


    # Controlling Program Flow


    Applications would be pretty dull if they could only do one thing. If you couldn''t
    have them branch and make decisions based on conditions at runtime, they wouldn''t
    be very useful. Fortunately, we don''t have to worry about that, because Objective-C
    provides us with a rich toolkit of flow control mechanisms.


    These flow control mechanisms fall under two broad categories.


    The mechanisms in the first category, conditional statements, enable you to change
    the execution path of your application based on runtime conditions. You can have
    a fork in the road, essentially, in the middle of your application. Which path
    your application takes can be determined based on the variables. Those variables
    can be set based on the parameters, user input, or any other condition that you
    want.


    The second category of flow control mechanisms is that of loops. Loops enable
    you to perform some set of operations repeatedly until some condition is met.
    This enables you to do things like iterating over items in a list, doing something
    for some set number of times, and so on.'
  merge: -1
  img_proc: true
- pgno: 80
  md: "We will spend the remainder of this chapter discussing both of these categories\
    \ and seeing how you can use these in your applications to drive the flow of execution.\n\
    \n# Using conditional statements\n\nTo reiterate, conditional statements enable\
    \ you to branch execution in your code between two or more different paths. Conditional\
    \ statements consist of three constructs.\n\n# Using if-else\n\nThe first construct\
    \ is the if-else construct. It is shown in Listing 2.30.\n\n```\nListing 2.30\n\
    If statement\n\nif (n > 75)\n{\n    NSLog(@\"%ld is greater than 75!\", n);\n\
    }\n```\n\nThe syntax for this construct consists primarily of an if statement\
    \ which is followed by the conditions for the if statement in parentheses, then\
    \ a code block to execute if the conditional statement is found to be true. If\
    \ the conditional statement is found to be false, an optional else block can also\
    \ be provided. This is provided after the code block for the if statement, as\
    \ shown in Listing 2.31.\n\n```\nListing 2.31\nIf with an else\n\nif (n > 75)\n\
    {\n    NSLog(@\"%ld is greater than 75!\", n);\n}\nelse\n{\n    NSLog(@\"%ld is\
    \ less than 75.\", n);\n}\n```"
  merge: -1
  img_proc: true
- pgno: 81
  md: "The else statement can also be followed by an if statement on the same line\
    \ as the else statement. In this case, the else block will be executed if the\
    \ initial if statement is false, but it will be skipped if the if that is currently\
    \ being evaluated is found to be true. In this case, you can have multiple else-if\
    \ conditionals one after another. Typically, this would be followed by a final\
    \ else statement which is executed in the case where none of the if conditions\
    \ have been met. This is shown in Listing 2.32.\n\n# Listing 2.32\n\n# If, else-if,\
    \ and an else.\n\n```\nif (n > 75)\n{\n    NSLog(@\"%ld is greater than 75!\"\
    , n);\n}\nelse if(n < 25)\n{\n    NSLog(@\"%ld is less than 25!\", n);\n}\nelse\n\
    {\n    NSLog(@\"%ld is between 24 and 76.\", n);\n}\n```\n\nIf the code block\
    \ to be executed after an if-else statement is restricted to only a single statement,\
    \ the curly braces may be omitted.\n\nThe conditional statement after the if or\
    \ the else if can be any statement that returns a Boolean value of YES or NO.\
    \ Additionally, for functions or statements that return something other than a\
    \ strict Boolean value, a return value of zero is considered to be a negative,\
    \ or NO, value, and a return value of anything else is considered to be positive,\
    \ or YES.\n\n# CAUTION\n\nThe fact that any statement can be placed into a conditional\
    \ statement for an if statement can lead to a very common error in code where\
    \ the programmer’s intention was to check for equality using the == operator but\
    \ instead they accidentally do an assignment using the = operator. In this case,\
    \ the assignment will always return true. Be very careful about this case in your\
    \ code.\n\n# Using the ternary conditional\n\nI prefer to use the if-else construct\
    \ for most of my conditional branching in applications. I find it to be clearer,\
    \ syntactically, then the ternary operator. That said, however, the ternary operator\
    \ has its place in certain cases, for example, in the case where you want to assign\
    \ a particular value based on another particular value to a variable. This example\
    \ is shown in Listing 2.33."
  merge: -1
  img_proc: true
- pgno: 82
  md: "# Listing 2.33\n\n# The ternary operator\n\n```\nint result = (x > y ? 10 :\
    \ 20);\n```\n\nThe ternary operator essentially works like a tiny if-else statement\
    \ that’s all on one line. You can break the ternary operator up based on its three\
    \ components which are separated by the ? and the : on the line. The item to the\
    \ left of the ? is the conditional statement. If the conditional statement evaluates\
    \ to be true, then the result of the ternary operator is the value between the\
    \ ? and the :. If the conditional statement evaluates to be false, then the result\
    \ of the ternary operator is the value on the right-hand side of the colon.\n\n\
    So in the case of Listing 2.26, if x > y, the result will be 10. Otherwise it’s\
    \ 20. As you can see, using the ternary operator can be a convenient, terse mechanism\
    \ for choosing one value versus another value for assignment and so on. Because\
    \ of its terseness, however, I find the ternary operator to be difficult to read,\
    \ and I prefer the greater clarity of the if-else statement. However, if you have\
    \ a state where the ternary operator produces cleaner, clearer code, then by all\
    \ means use it. It’s another tool in your toolbox.\n\n# Using switch statements\n\
    \nThe final type of conditional statement that I’m going to discuss here is the\
    \ switch statement. The switch statement is ideal for branching among several\
    \ different options. You can achieve essentially the same thing as a switch statement\
    \ if using an if-else construct, but the switch statement can often be clearer\
    \ and in some cases faster.\n\nAn example of a switch statement is shown in Listing\
    \ 2.34.\n\n# Listing 2.34\n\n# A switch statement\n\n```\nswitch(state)\n{\n \
    \   case 1:\n        doStateOneAction();\n        break;\n    case 2:\n      \
    \  doStateTwoAction();\n        break;\n    case 3:\n        doStateThreeAction();\n\
    \    default:\n        doDefaultAction();\n}\n```"
  merge: -1
  img_proc: true
- pgno: 83
  md: 'As you can see, a switch statement is constructed by using the keyword switch
    followed by the value upon which you want to branch in parentheses. This value
    is commonly known as the control variable. After the switch statement, a code
    block must be provided that contains the possible values that the control variable
    may contain and the instructions to execute for each of those possible values.
    These “cases” are written by including a case statement followed by a colon and
    then the instructions to execute in the case of that condition followed by a break
    statement.


    The break statement, which is optional, will stop evaluation of the switch at
    the point of the break and jump the program execution outside of the switch. If
    one is not provided, the subsequent case statements will continue to be evaluated
    until a break is encountered or until the exit of the switch statement.


    In addition to case statements being provided inside of the switch statement,
    you can also provide a default case. This is provided at the bottom of your switch
    statement, and is the case that occurs if no other cases have been met.


    # NOTE


    In Listing 2.34, case 3 is missing a break statement, so if case 3 is entered,
    both case 3 and the default case will be executed.


    It’s important to note that the control variable of a switch statement can only
    be an integer value. This is not a case where you can, for example, use a string
    or something of that nature to determine the different cases. Additionally, new
    variables cannot be declared inside of a switch statement.


    # Choosing among conditional statements


    Because of the additional constraints of switch statements, switch statements
    can be optimized by compilers to be more efficient and faster than if-else statements.
    However, for the vast majority of cases, if-else statements are probably going
    to be fast enough for most operations that you will need to perform. It is only
    in cases of extreme performance tuning that the difference between a switch statement
    and if-else statement become an issue. As is usually the case, you should measure
    your performance before prematurely optimizing for one type of conditional statement
    over another. Most of the time, you want to choose the conditional statement that
    best expresses the intent of the code that you are trying to write. Choose the
    conditional statement that is easiest for future developers looking at your code,
    including yourself, to read.


    For me, I personally prefer if-else statements over switch statements because
    I find them easier to read. Some would disagree, citing long if-else blocks as
    being difficult to follow. As with most things, your mileage may vary.


    # Working with loops


    Loops enable your program to perform a set of instructions repeatedly until some
    condition is met. As with conditional statements, you encounter three primary
    types of loops: the for loop, the while loop, and do-while loop, which is really
    a variation of the while loop.'
  merge: -1
  img_proc: true
- pgno: 84
  md: "With the introduction of Objective-C 2.0, and its fast enumeration capabilities,\
    \ the for loop has become really the primary loop choice when working in Objective-C.\
    \ However, the while and do-while loops serve important functions in the language.\n\
    \n# ## Working with for\n\nThe for loop is probably the most commonly used loop\
    \ in Objective-C. Using it, you can count over a range of numbers, iterate over\
    \ an array of items, and so on. Because of this flexibility, some variations in\
    \ its syntax can be confusing.\n\n# ## Traditional for loops\n\nThe first variation\
    \ of the for loop that I would like to introduce to you is the traditional form.\
    \ In this form, a for statement consists of the statement followed by the conditions\
    \ of the for loop in the form of three statements inside parentheses. These three\
    \ statements correspond to the three operations that are performed on the control\
    \ variable as the for loop executes. The first operation sets the initial conditions\
    \ of the control variable, and it is typically used to initialize the variable\
    \ to zero, or in the case where you don't want to start counting at zero, to some\
    \ other value. This first operation is only executed the first time the for loop\
    \ is entered.\n\nThe second operation is the conditional statement that is evaluated\
    \ upon each iteration of the loop to determine if the loop should be halted. If\
    \ the conditional statement is evaluated to be true, then the for loop is interrupted\
    \ and program execution continues after the for loop code block. If the conditional\
    \ statement is evaluated to be false, another iteration of the for loop code block\
    \ is executed.\n\nThe final operation is the counting expression. It is this expression\
    \ that is used to actually change the value of the control variable for each iteration\
    \ of the loop. During each iteration, the control variable can be incremented,\
    \ decremented, assigned to, and so on at will in the counting expression.\n\n\
    Listing 2.35 shows an example of a typical for loop.\n\n# ## Listing 2.35\n\n\
    # ### A for loop\n\n```\n```\nfor(int i = 0; i < 100; i++)\n{\n  Foo *foo = [array\
    \ objectAtIndex:i];\n  [foo doSomething];\n}\n```\n```"
  merge: -1
  img_proc: true
- pgno: 85
  md: "In this case, the first time that the for loop is entered, the control variable\
    \ (i) is created and assigned a value of zero. On each iteration of the loop,\
    \ the conditional expression is evaluated to determine if the control variable\
    \ has reached 100. If it has, execution will jump to the statement directly after\
    \ the for loop code block. If it has not, then the counting expression is executed;\
    \ in this case, the control variable is incremented by one.\n\n# NOTE\n\nYour\
    \ counting expression can be anything you want it to be. For example, to increment\
    \ a loop that counts by twos, you could simply increment your control variable\
    \ by two in each iteration of the loop instead of by one like we are doing here.\n\
    \n# NOTE\n\nThe x++ operator is the postfix increment operator. It increments\
    \ the value of x and stores it back into x. When doing so, it also returns the\
    \ value of x before it has been incremented. The ++x operator is the prefix increment\
    \ operator. It also increments the value of x and stores it into x, but the value\
    \ it returns is the value of x after the increment. The same goes for the post/pre\
    \ versions of the decrement operator, --. In some cases, you may want to assign\
    \ the return value of these operations to another variable. When doing so, be\
    \ aware of this behavior.\n\nThe control variable is available within the scope\
    \ of the for loop code block and can be used, for example, to reference indexes\
    \ within arrays or to drive conditional logic within the for loop code block.\
    \ Additionally, a for loop can be aborted at any time within the for loop code\
    \ block by executing a continue statement. The continue statement will stop execution\
    \ of the for loop immediately and reset execution back to the beginning of the\
    \ loop. An example of this is shown in Listing 2.36.\n\n# Listing 2.36\n\n# The\
    \ continue statement\n\n```\nfor(int n = 0; n < 100; ++n)\n{\n    if(n > 10 &&\
    \ n < 20)\n        continue; // this skips 11-19\n    // do something with n...\n\
    \    Foo *foo = [array objectAtIndex:i];\n    [foo doSomething];\n}\n```\n\n#\
    \ Using for for fast enumeration\n\nThe second form of for loops is a new addition\
    \ in Objective-C 2.0; it applies to enumerating over objects contained in collections.\
    \ You learn about collections and objects in the next chapter, but I want to introduce\
    \ you to the fast enumeration syntax here so you'll be familiar with it when we\
    \ come to it."
  merge: -1
  img_proc: true
- pgno: 86
  md: "In the previous form of the for loop, we had to use the control variable to\
    \ retrieve an element of the array in order to operate on it. The fast enumeration\
    \ form of the for loop obsoletes this mechanism by providing us with an ability\
    \ to specify, as part of the for statement itself, a temporary variable to store\
    \ the elements of the collection that is being iterated over. This is tremendously\
    \ convenient, because the vast majority of for loops are written specifically\
    \ for the purposes of iterating over the members of a collection and performing\
    \ an operation on each of the members individually.\n\nAn example of a fast enumeration\
    \ for loop is shown in Listing 2.37.\n\nAs you can see, a variable (object) is\
    \ declared as part of the for statement itself. As the for loop is executed, each\
    \ member of the collection (array) is assigned to the variable. It is then available\
    \ within the scope of the for loop code block.\n\n# Listing 2.37\n\n# For loop\
    \ with fast enumeration\n\n```\nfor(Foo *object in array)\n{\n    // the Foo object\
    \ is assigned to an element of the array\n    // do something with object\n}\n\
    ```\n\nYou’ll see a pattern with for loops in use a great deal when I describe\
    \ collection objects in Chapter 13. For now, simply be familiar with the form\
    \ of the for loop, and be prepared to return to this chapter again for review.\n\
    \n# Working with while\n\nWhile loops work similarly to for loops with the exception\
    \ of the fact that there are not multiple statements inside the parentheses after\
    \ the while statement. A while statement has a conditional statement which is\
    \ checked upon each iteration of the loop. When the conditional statement is found\
    \ to be false, execution continues at the next statement after the end of the\
    \ while code block.\n\nAn example of a while statement is shown in Listing 2.38."
  merge: -1
  img_proc: true
- pgno: 87
  md: "# Listing 2.38\n\n# While loop\n\n```\nint x = 0\nwhile(x < 10)\n{\n    NSLog(@\"\
    Value of x: %ld\", x);\n    x++;\n}\n```\n\nThe implication of this sort of control\
    \ flow is that whatever condition you are checking within the while’s conditional\
    \ statement needs to, at some point, change to false within the while’s code block.\
    \ If it doesn’t, your while statement will continue to loop forever. Whiles can\
    \ also be interrupted with a continue statement just like a for loop.\n\n# NOTE\n\
    \nIf the conditional statement is false upon the first run of the loop, the code\
    \ within the while code block will never execute.\n\nWhile statements are particularly\
    \ convenient in cases where you have complex iterative logic involved.\n\nOlder\
    \ versions of Objective-C did not have the fast enumeration capabilities that\
    \ are available today. As a result, the while statement is often used to iterate\
    \ over arrays using an NSEnumerator. An example of this is shown in Listing 2.39.\n\
    \n# Listing 2.39\n\n# Old-style enumeration\n\n```\nNSArray *someArray = [self\
    \ getArray];\nNSEnumerator *enumerator = [someArray objectEnumerator];\nwhile((NSObject\
    \ *obj = [enumerator nextObject]))\n{\n    // do something with obj...\n}\n```"
  merge: -1
  img_proc: true
- pgno: 88
  md: "You rarely see this pattern used today, but because it is so ubiquitous in\
    \ older code, familiarizing yourself with this concept is important. Each time\
    \ the conditional statement is checked, the enumerator returns the next object\
    \ from the array. When it reaches the end of the array, it returns nil. This causes\
    \ the while conditional to return false. This, in turn, causes execution to jump\
    \ to the next line of code after the while code block.\n\n# Using do\n\nThe final\
    \ type of loop that we are going to talk about in this section is the do-while\
    \ loop. This loop is similar to the while loop, with the exception of the fact\
    \ that the conditional is moved to the end of the loop so that no matter what,\
    \ at least one iteration through the loop is executed before the conditional is\
    \ checked. An example of this kind of loop is shown in Listing 2.40.\n\nThis loop\
    \ is one that is rarely used, but when it is, it’s usually an ideal solution to\
    \ the problem that you’re trying to solve.\n\n# Listing 2.40\n\n# do-while loop\n\
    \n```\nint x = 0;\ndo\n{\n    NSLog(@\"%ld\", x);\n    x++;\n}\nwhile(x < 10)\n\
    ```\n\nUsually, this loop is used in cases where you are dealing with some type\
    \ of control variable that is in a pre-existing state, which you do not want to\
    \ change until the loop has executed at least once. You may also use this loop\
    \ when calculating the control variable within the scope of the control block.\
    \ Again, you might be doing some kind of complex logic in order to arrive at the\
    \ value of the control variable. The do-while loop gives you an opportunity to\
    \ perform whatever complex logic you desire inside of its code block before the\
    \ while conditional is evaluated. Note, however, that the control variable must\
    \ be declared outside the scope of the do-while code block in order to be within\
    \ scope for the while conditional.\n\n# NOTE\n\nRemember, when dealing with a\
    \ switch, that it was possible to break out of the switch by using a break statement.\
    \ This is very common in switch usage. However, break can also be used with do-while,\
    \ while, and for loops. When used in these contexts, it causes the thread of execution\
    \ to jump out of the loop to the next line of the program after the loop’s code\
    \ block."
  merge: -1
  img_proc: true
- pgno: 89
  md: "# Applying What You Have Learned\n\nNow you can create a command line calculator\
    \ program. Although you may not understand everything in this program, you will\
    \ understand most of it, and the things you don’t yet understand I explain in\
    \ the next section.\n\nThis program takes a series of arguments on its command\
    \ line. It should be in the form of numbers separated by operators. So, for example,\
    \ you run the program as follows: ./Calculator '10 + 5 - 3'. The program then\
    \ sequentially adds, subtracts, multiplies, or divides the numbers. When finished,\
    \ it outputs the final result on the console. Just for the purposes of demonstration,\
    \ I’ve broken the program into two units: the main unit, which contains the logic\
    \ for the main functionality, and the MathOperations unit, which contains the\
    \ functions for addition, subtraction, and so on. To enter the program, start\
    \ Xcode and create a new Foundation-based Command Line application. Name it “Calculator.”\n\
    \n> NOTE\n> Don’t worry about the calls to NSString, NSArray, and so on; those\
    \ will be explained in the next chapter. After the project is created, open the\
    \ Calculator.m file and modify it to look like Listing 2.41.\n\n# Listing 2.41\n\
    \n# Calculator.m\n\n```\n#import <Foundation/Foundation.h>\n#import \"MathOperations.h\"\
    \n\nBOOL isAnOperator(const char value)\n{\n    return ((value == '+') || (value\
    \ == '-') || (value == '*') || (value ==\n    '/'));\n}\n\nint main (int argc,\
    \ const char * argv[])\n{\n    NSAutoreleasePool * pool = [[NSAutoreleasePool\
    \ alloc] init];\n\n    double result = 0;\n\n    char operator = '\\0';\n\n  \
    \  NSString *equation = [NSString stringWithUTF8String:argv[1]];\n    NSArray\
    \ *eqParts = [equation\n                        componentsSeparatedByCharactersInSet:\n\
    \                        [NSCharacterSet whitespaceCharacterSet]];\n```"
  merge: -1
