  md: 'If you are sure that you can match all of these requirements, then this is
    a much simpler version of the singleton implementation. Generally speaking, this
    is the implementation that I use in my code.


    The study of this particular design pattern in Objective-C is useful because of
    its use of the factory method for its implementation. Objective-C uses factory
    methods more than almost any other language that I know. Therefore, the use of
    a factory method to access the singleton is virtually second nature to most Objective-C
    developers. Sometimes, when working with other languages, you have to go out of
    your way to prevent the developers from simply creating an instance of your object
    using a standard constructor. You have to document the factory method, and post
    warnings in all of your code to ensure that the developers use the factory method.
    Most experienced Objective-C developers look first at the factory methods for
    ways to construct new objects because typically the factory methods are more convenient
    than using the standard initializes. Additionally, if you follow the “safe” singleton
    implementation, Objective-C provides you with sufficient tools to prevent the
    unwary developer from accidentally deallocating the singleton and causing bugs.


    # Delegating responsibility


    # Problem


    You have two objects, one of which needs to be notified of state changes in the
    other. Alternatively, one of the objects would like to give responsibility to
    another object for determining changes in behavior at runtime.


    # Solution


    The solution to this problem is the delegate pattern. The delegate pattern defines
    a solution wherein one object holds a reference to another object. The referenced
    object implements a previously determined interface, which is used to inform the
    referenced object of changes within the referencing object. Not only can this
    pattern be used to tell the referenced object about state changes within the referencing
    object, but it can also be used to delegate responsibility to the referenced object
    or for making decisions on behalf of the referencing object at runtime.


    For example, given our two objects Foo and Bar, Foo might choose to delegate responsibility
    to Bar for the purposes of determining how to behave in the event of an error.
