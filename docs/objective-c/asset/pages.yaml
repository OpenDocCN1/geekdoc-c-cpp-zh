- pgno: 167
  md: '# Using Blocks with Threads


    I’m sure that you can think of many different uses for blocks in your code. I’m
    going to touch on a couple of them in the next few sections.


    If you think about the way that blocks enable you to encapsulate functionality
    in your application in a nice neat package, functionality that can be easily reused,
    then it makes sense that one of the most commonly used design patterns for blocks
    in Objective-C is to provide code that can be run in parallel. In other words,
    threads.


    Indeed, one of the first use cases that Apple demonstrated when it introduced
    blocks in Objective-C was the ability to use them in its (at the time) brand-new
    parallelization framework, Grand Central Dispatch.


    # Working with Grand Central Dispatch


    Grand Central Dispatch is a framework that ships with Mac OS X version 10.6. It
    provides an easy-to-use abstraction layer that enables developers to take advantage
    of multiprocessor and multicore architectures without having to deal with lower-level
    thread management.


    Using GCD, developers need only provide blocks of code, which encapsulate functionality
    that can safely run in parallel. They hand these blocks off to GCD queues, which
    then handle all of the low-level details surrounding things such as the creation
    of threads, the management of those threads, even how many threads should be created
    to run the tasks provided on a given system. GCD knows how many cores a machine
    has and will only allocate enough threads to maximize performance over those cores.
    It completely handles queuing up the tasks provided to it and distributing those
    tasks to the threads that it creates.


    Tasks can be provided to Grand Central Dispatch as either functions or blocks.
    Obviously, given the topic of this chapter, we are going to focus on using blocks
    with Grand Central Dispatch.


    # Using GCD functions to dispatch code blocks in threads


    The core of the GCD API centers around the concept of queues. By using GCD, you
    can either select one of the pre-existing system queues, such as the global queue.
    You access it by using the method `dispatch_get_global_queue()`, which returns
    the global concurrent queue associated with your application, or you can create
    your own private serial queue by using the function `dispatch_queue_create`.


    Queues themselves can be either concurrent or serial, indicating that the objects
    placed within them can be run in parallel, relative to each other, in the case
    of a concurrent queue or sequentially, relative to each other in the case of a
    serial queue.'
  merge: -1
  img_proc: true
- pgno: 168
  md: '# NOTE


    Serial queues are often used when you require exclusive access to a given resource
    for a series of operations. Typically, you might utilize a thread lock to ensure
    the exclusive access to these resources. Using GCD, you can simply cue the different
    operations up into a serial queue. Each item can only run after the previous item
    has completed.


    Dispatching blocks into queues is simple. Listing 5.10 shows an example, using
    a block which performs some lengthy operation. In this case, we are dispatching
    this block onto the global concurrent queue. As you can see, we can dispatch multiples
    of these processes onto the queue. Grand Central Dispatch can handle scheduling
    and management of these tasks automatically for us with no intervention from us
    whatsoever.


    # Listing 5.10


    # Dispatching a block onto the global concurrent queue


    ```

    dispatch_async(dispatch_get_global_queue(0, 0), ^{ doSomethingSlow(); });

    ```


    You get the global queue with the method dispatch_get_global_queue, then you dispatch
    your block (^{ doSomethingSlow(); }) onto that queue. Here, if you wanted, you
    could use any of the previous block patterns I already showed you. Of course,
    normal thread safety requirements apply.


    # Working with Common Block Design Patterns


    I showed you how you can use blocks with GCD to dispatch units of work to threads.
    Now take a look at some other common block patterns. In these cases, there are
    examples of where you might use blocks with standard framework APIs to do things
    a bit more efficiently or cleanly than you would be able to do them without blocks.


    # Using code blocks for maps


    A common operation that is used to demonstrate the power of blocks in other languages
    is in implementing a map algorithm.


    A map, if you’re not aware, is a function that applies a given function to each
    element of an array, and returns a list of results. Implementing a map using blocks
    in Objective-C is trivially easy. First, you need to create your map function.
    The map function takes a block and your array of items as arguments. It’s shown
    in Listing 5.11.'
