- pgno: 239
  md: "# Listing 8.8 *(continued)*\n\n```\n```objc\n@end\n\n@implementation NSMutableDictionary\
    \ (SortedKeys)\n\n-(void)generateSortedKeys;\n{\n    NSMutableArray *keys = [NSMutableArray\
    \ arrayWithArray:[self allKeys]];\n    [keys sortUsingSelector:@selector(compare:)];\n\
    \    objc_setAssociatedObject(self, @\"KEYS\", keys, OBJC_ASSOCIATION_RETAIN);\n\
    }\n\n-(NSArray *)sortedKeys;\n{\n    return objc_getAssociatedObject(self, @\"\
    KEYS\");\n}\n\n-(void)dropSortedKeys;\n{\n    objc_setAssociatedObject(self, @\"\
    KEYS\", nil, OBJC_ASSOCIATION_RETAIN);\n}\n\n@end\n```\n```\n\nAs you can see,\
    \ when the sorted keys array is created, it’s stored as an associative reference\
    \ on self, or that is, the dictionary upon which we are operating, this is shown\
    \ in -generateSortedKeys. When finished with the sorted keys, the associative\
    \ reference can be removed using the -dropSortedKeys method.\n\nBecause you’re\
    \ not subclassing, you do need to make sure you explicitly call the -dropSortedKeys\
    \ (or whatever your cleanup method is) in order to release the memory associated\
    \ with the object before deallocating it.\n\n> **NOTE**\n> \n> If you use the\
    \ newer LLVM 1.5 compiler and the modern runtime, they include the ability to\
    \ declare instance variables in class extensions, so you can avoid most of this\
    \ rigmarole. To do so, you simply declare them as part of your extension interface,\
    \ just like if you were declaring them in a class. See the LLVM documentation\
    \ for the flags required to enable this behavior.\n\n> **NOTE**\n> \n> You can\
    \ use `NSString` constants (as I have used here) for keys, because they are defined\
    \ by the language to be static references to each other when defined inline like\
    \ I have done here."
