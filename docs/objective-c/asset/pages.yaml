- pgno: 97
  md: 'The data that is encapsulated within an object can be referred to as data,
    state, attributes, or properties. It’s important, however, to be aware that there
    is also another programming concept called properties, which I cover later in
    this chapter. All data is not necessarily a property, nor are all properties necessarily
    data.


    Finally, when talking about the behavior of an object, including behavior that
    changes its data, the instructions to the computer related to that behavior are
    referred to as methods. Objective-C developers also tend to adopt the Smalltalk
    convention of referring to methods as messages. This terminology is most often
    used when referring to using a method as an action. Some programming languages
    refer to this as “calling a method,” but Objective-C programmers tend to use the
    phrase “sending a message.” I, for one, happen to prefer to use the “method” oriented
    terms, but I may on occasion use the messaging terminology instead.


    # NOTE


    It is vital that you understand the terminology that is used for describing classes,
    objects, properties, and methods before you move on to the rest of this chapter.
    If you have any amount of confusion, please reread the Understanding objects section
    so that you understand the distinction between these items clearly.


    # Understanding inheritance


    Inheritance has two sides to it. One side represents the class design aspect of
    class inheritance, which affects how you design your classes and where you place
    behavior in your class definitions. The second aspect of class inheritance relates
    to how those classes look from an outside perspective and how you use the classes.
    (I cover this topic in the following section, “Using polymorphism.”)


    Returning to the Cat class, recall that the Cat class represents, sort of, the
    template for the creature that is your pet. You could also think of this as representing
    the species of your pet. Just like a species, the Cat class can be said to have
    descended from other species. In other words, the cat species is descended from,
    and inherits certain characteristics from, the classification known as mammals.
    Similarly, the classification mammals descends from and inherits characteristics
    from the classification vertebrates. Cats also have sister species, such as dogs.
    Each of these species has shared characteristics with each other as well as with
    their parent species. You can extend in either direction, becoming more specific
    (poodles, German shepherds, and so on). Or you can become less specific, moving
    up the inheritance tree to mammals, vertebrates, and so on. Figure 3.2 demonstrates
    this concept by roughly laying out the classification of several different creatures
    and how they relate to each other.


    Classes in Objective-C have the same kind of capability. In fact, Figure 3.2 could
    just as easily be used to describe a class inheritance tree as a species inheritance
    tree. In other words, classes in Objective-C can have parent classes from which
    they inherit behaviors and attributes. Additionally, any class that you create
    can have child classes that inherit your class’s attributes and behaviors.'
