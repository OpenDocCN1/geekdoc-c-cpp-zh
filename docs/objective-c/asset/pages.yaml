- pgno: 114
  md: '# Table 3.1 Property Attributes


    | Attribute | Purpose |

    |---|---|

    | getter=<name>, setter=<name> | Specifies the name of the accessor methods that
    will be used for this property. |

    | readwrite or readonly | Specifies whether this property will be able to be written
    to. Default is readwrite. |

    | assign, retain, or copy | Determines the type of setter generated for this property.
    Assign generates a setter with a plain assign to the variable. Retain generates
    a setter which retains the argument passed to it while assigning it to the variable.
    Copy generates an accessor which copies the passed in value to the member variable.
    The default is assign. |

    | nonatomic | Specifies that the generated accessor will be nonatomic, and therefore
    not threadsafe. The default value is atomic, or threadsafe. |


    Following the property attributes, you must specify the datatype for the property.
    Properties do not always have to map directly to a data member variable, but when
    they do, that data member’s datatype should match the data type of the property
    specified here. Finally, you have to specify the name of the property. It is possible
    to specify a property with a name that is different from the actual data member
    that the property represents. Most often, however, you won’t need to do this.
    Therefore, this name should match the name of the data member that this property
    maps to.


    As usual, things declared in your interface file also have a corresponding declaration
    in your implementation file. Properties are no different. To use the compiler-generated
    accessor methods, your properties must have a declaration inside of your implementation
    block in your implementation file. The possible types of property declarations
    in your implementation file can be either @synthesize declarations or @dynamic
    declarations. The @synthesize directive causes the compiler to completely generate
    all the necessary code to create the accessors for your property. Essentially,
    this directive is a "hands-off" method for using properties. If you use the @synthesize
    directive, no additional code needs to be written in your implementation file
    for your property.


    On the other hand, if you want to create your accessors yourself, by hand, either
    in your unit or later, by dynamically loading code at runtime, you can do this
    by using the @dynamic directive. When using the @dynamic directive, the compiler
    will expect that you have created an appropriate pair of accessors for your property.


    > CAUTION

    > When you create your own accessors using the @dynamic directive, ensure that
    your accessors fulfill the contract that you have specified in the property’s
    attributes. In other words, if you have specified a copy attribute, then you have
    to ensure that your accessor copies the value that’s passed in when setting the
    property.


    Listing 3.13 shows our employee class implementation. Note that there are different
    properties that are handled in different ways.'
