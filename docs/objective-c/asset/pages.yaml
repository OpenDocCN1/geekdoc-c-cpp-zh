    \ instead with an NSMutableArray, the relationship becomes a mutable one-to-many\
    \ relationship. When you need to implement a mutable one-to-many relationship,\
    \ where you can add, remove, or change elements in the indexed collection, you\
    \ must also implement either -insertObject:in<VariableName>AtIndex: or -insert<VariableName>:atIndexes:\
    \ for inserting items, -removeObjectFrom<VariableName>AtIndex: or -remove<VariableName>AtIndexes:\
    \ for removing items, or, for high performance replacement of objects, -replaceObjectIn<VariableName>AtIndex:withObject:\
    \ or -replace<VariableName>AtIndexes:with<VariableName>: . Replacing objects is\
    \ considered to be an optional operation that you only really need to implement\
    \ in cases where it is indicated by performance measurement. Often, simply replacing\
    \ an object at a given index, without removing the original object and then reinserting\
    \ a new one can be faster than the alternative. Implement these methods at your\
    \ discretion."
