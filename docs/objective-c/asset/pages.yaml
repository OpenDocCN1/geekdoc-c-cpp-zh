    NSString *item = nil;\nwhile((item = [enumerator nextObject]))\n{\n    NSLog(@\"\
    %@\", item);\n}\n```\n\nFoundation also provides a subclass of NSSet called NSCountedSet.\
    \ This nifty class allows you to add the same object to the set multiple times.\
