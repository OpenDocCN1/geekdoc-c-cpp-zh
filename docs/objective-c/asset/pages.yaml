    a value when they exit. You do this by using the return keyword. You declare the
    type of value that you return as part of your method signature and this determines
    what type of return value your method returns.


    Using this return value to indicate failure or success is one of the oldest error
    handling mechanisms in programming languages. In the C programming language of
    which Objective-C is a'
