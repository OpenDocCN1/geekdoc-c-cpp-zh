- pgno: 63
  md: "# Understanding pointers\n\nThe third type of variable I'm going to discuss\
    \ are pointers. Pointers can be a difficult concept to wrap your head around,\
    \ but fortunately, in Objective-C, the more complex aspects of pointers are rarely\
    \ used. However, understanding them is important.\n\nRecall that a typical variable\
    \ stores data in RAM. The computer looks up the variable by using an address in\
    \ RAM. Metaphorically speaking, if you can imagine a variable as being a house\
    \ where people (data) live, the street address of the house is the address of\
    \ that variable.\n\nA pointer is a variable that contains the address of another\
    \ variable. Declaring a pointer is similar to declaring a variable of whatever\
    \ type it is that you want to point to except that you also include the pointer\
    \ operator as part of your declaration. The pointer operator is an asterisk (*).\
    \ You can get the address of a variable by using the address-of operator (&).\n\
    \nListing 2.18 shows an example of declaring a pointer to an integer.\n\n# Listing\
    \ 2.18\n\n# Declaring pointers\n\n```\n#import <Foundation/Foundation.h>\n\nint\
    \ main(int argc, char *argv[])\n{\n    int x = 5;\n    int *y = &x;\n\n    NSLog(@\"\
    X:%ld - Y:%ld\", x, y);\n    return 0;\n}\n```\n\nIn this code, you are declaring\
    \ a variable, x, which is an int. Within this variable, you are storing the value\
    \ of 5. We are then declaring another variable, y, which is of type pointer to\
    \ an int, and within it, we are storing the address of x.\n\nPointers can be used\
    \ just like regular variables, but when you access them directly, such as what\
    \ we are doing on line 8 of this program, the value you get is a memory address.\
    \ In this case, when you run this program, you should see output, as shown in\
    \ Figure 2.2.\n\nYour value for y will probably vary from mine because your computer\
    \ may be storing your x value at a different address from mine. This is normal.\
    \ The asterisk operator (*) is also the pointer-dereferencing operator. The process\
    \ of dereferencing a pointer allows you to access the value of the variable that\
    \ the pointer points to. So in other words, in your program example, you want\
    \ to print the value that the white pointer was pointing to, in other words the\
    \ value of x, then you could rewrite your program to look like Listing 2.19."
