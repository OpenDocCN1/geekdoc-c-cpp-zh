- pgno: 292
  md: "# 13 Working with Collections\n\nWhile Foundation provides you with tons of\
    \ classes for all kinds of purposes, it's worthwhile to visit a few of the most\
    \ fundamental classes in depth because of the extent to which you are likely to\
    \ use them in your applications.\n\nAmong those fundamental classes is the group\
