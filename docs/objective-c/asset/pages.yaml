- pgno: 111
  md: '# NOTE

    If this method of declaring “private” methods seems a bit sketchy to you because
    of the dependency on the location of the definition of the methods in the file,
    see Chapter 8 for another way of declaring private methods using categories.


    # Working with Properties


    A recent addition to Objective-C is the concept of properties. Properties allow
    you to declaratively define accessor methods for the data members of your classes.
    They eliminate much of the boilerplate code that has been previously required
    for accessing those data members. They also enable you, the developer of a class,
    to define the contract for the state of your object. They are an important syntactical
    addition to Objective-C.


    # Understanding the differences between state and behavior


    In previous sections, I talked about objects as a mechanism for encapsulating
    attributes and behavior. In this section, I approach this topic in a bit more
    depth in order to explain some concepts that can help you in your use of properties
    in Objective-C.


    The purpose of properties in Objective-C is to assist you in exposing attributes
    of your object that represent your object’s state. Internally, properties compile
    down to actual methods that can be used to get and set the data in your objects.
    These are called accessors. You can choose to use the compiler-generated accessors,
    or you can choose to override the compiler and generate your own.


    # NOTE

    An accessor is a method which is defined specifically for the purpose of allowing
    users of your objects to set and get values in your object. They encapsulate the
    data members of your object and hide the implementation details of those objects
    from the outside. An accessor can allow direct access to a variable, or it can
    be nothing more than a calculation that is performed when accessed. Sometimes
    these methods are called setters and getters. Most people use properties instead
    of manually writing accessors, but in cases where you want to override the normal
    behavior of property accessors, you can easily override accessors and provide
    your own implementation. I show you how to do this shortly in the section on properties.


    Objects are composed of state and behavior. State consists of the data that makes
    up your object. When thinking about object state, a good design rule that most
    developers follow states that though an object’s state can be changed at any time,
    it is safe to consider that once an object’s state has been set, it will maintain
    that state until otherwise acted upon by your application. It is also considered
    to be bad form to have side effects occur when simply modifying'
  merge: -1
