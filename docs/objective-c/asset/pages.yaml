- pgno: 7
  md: '# About the Author


    Jiva DeVoe has been writing software for nearly 25 years, starting with his Commodore
    VIC-20 using BASIC and assembly language, and gradually working his way through
    C, C++, Python, Ruby, Java and finally Objective-C. In 2001, he founded Random
    Ideas, LLC, a software company dedicated to building great applications for the
    Mac. When the iPhone SDK was announced, he was honored to be selected as one of
    the earliest developers to have access to the SDK, and using it, he developed
    several applications that were available in the iTunes App Store when it launched
    on July 11, 2008. Since that time, his iPhone applications have received several
    awards, including being chosen as among the Top 100 apps and games in the App
    Store, and been featured as Apple Staff Picks and in Apple Advertisements. Today,
    Jiva continues to work full time for his company, Random Ideas, developing great
    iPhone and Mac applications. He lives with his wife, three children, and two basset
    hounds in the dusty desert of Arizona.'
