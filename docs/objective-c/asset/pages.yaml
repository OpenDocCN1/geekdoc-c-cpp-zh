- pgno: 235
  md: 'NSObject is a "special class" in that it provides certain functionality to
    the runtime that other classes do not. The end result of this is that the NSObject
    class, speaking about the class object itself and not the class definition, is
    capable of calling object methods. It is the only class in Objective-C that is
    able to do this. In order to do this, NSObject does some unusual voodoo with the
    self object. Therefore, self, when used within the context of a category defined
    on NSObject, they refer to the class or the object.


    Because of these hazards, generally speaking, you should only declare categories
    on NSObject in the form of interfaces alone and did not provide implementations.
    The category implementations should probably be limited to subclasses. Although
    the capability exists to provide implementations for NSObject categories, for
    the most part, expect that categories on NSObject will only be used for the purposes
    of declaring informal protocols.


    # Extending Classes using Anonymous Categories


    Although Objective-C does not have a mechanism for declaring private methods baked
    into the class declaration syntax, there is a way of defining a private API, which
    you exposed only to privileged users of your class and not to others using categories.


    The tool that you use to do this is called an anonymous category. Essentially,
    an anonymous category is a category declared on a given class without a name.
    That is, when you declare the category, rather than placing the name of the category
    inside parentheses after the category name, the parentheses are there, but they
    are left empty. When working with anonymous categories, you declare only the interface,
    but not the implementation as part of the category itself. Typically, you place
    this category declaration in another header file that can be imported by users
    of your class that have access to the private API. The implementation is done
    inside the implementation of the original class. You are simply creating a mechanism
    for accessing that implementation externally.


    What this gives you is the ability to have a method which is declared as part
    of the private API in the anonymous category but which is not part of your public
    API in your public class declaration. When the anonymous category interface is
    imported, the compiler will then expect that the methods declared in the anonymous
    category interface will be implemented by the extended class. Therefore, this
    also provides a method for you to have a declared, compilation time checked API,
    which is private and invisible to users of your class unless they know to include
    the private API category header.


    Listing 8.6 shows an example of an anonymous category declaration.'
  merge: -1
  img_proc: true
