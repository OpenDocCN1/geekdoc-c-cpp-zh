- pgno: 99
  md: "In our example, the cat class inherits from the mammal class. The mammal class\
    \ specifies that all its child classes have fur, give live birth, eat, sleep,\
    \ and have some kind of vocalization. As a result, it provides standard methods\
    \ for eating, sleeping, and vocalizing. The child classes of mammal inherit all\
    \ these attributes and behaviors automatically, but can override them in cases\
    \ where it is required. For example, the particular vocalization that a cat makes\
    \ is different from that a dog makes. A cat's vocalization is a meow, and a dog's\
    \ vocalization is a bark. To override behaviors in a parent class when implementing\
    \ a new subclass, you simply define the method in your subclass. Your new version\
    \ will replace the version in the parent class and will automatically be used\
    \ by the runtime when the method is called.\n\nAll these same customizable capabilities\
    \ are available when you are defining classes in object-oriented languages. In\
    \ Objective-C, a given class can inherit from any other given class. However,\
    \ it can only ever have one parent. The class itself will inherit all the attributes\
    \ and behaviors of its parent and all its parent's parents, but it cannot inherit\
    \ behavior from more than one direct parent. This concept is known as single parent\
    \ inheritance. Some languages, such as C++, enable classes to inherit from multiple\
    \ parents. This can result in ambiguity during compilation. As a result, Objective-C\
    \ chooses to remove this ambiguity by only allowing a single parent inheritance.\
    \ Our species inheritance tree eventually leads back to a single great, great,\
    \ great grandparent class that is the ancestor of all creatures; Objective-C also\
    \ has a single class that all classes eventually inherit from. This class is NSObject.\
    \ The NSObject class provides the most basic functionality that all classes in\
    \ Objective-C require, such as memory management routines, copying routines, and\
    \ so on.\n\n> NOTE\n> \n> In Objective-C, you can do some things that simulate\
    \ multiple parent inheritance without actually requiring multiple parents. I go\
    \ over how you do this when we look at protocols and categories.\n\n# # Using\
    \ polymorphism\n\nEarlier in this chapter, I introduced you to the concept of\
    \ class inheritance. Polymorphism means that any object that is created from a\
    \ given class can be assumed by users of that object to be an instance itself,\
    \ or any of its parent classes. What this means is that your code can be written\
    \ to utilize the bare minimum functionality required on classes it inherits from.\
    \ Because Objective-C classes all eventually inherit from NSObject, you can even\
    \ create code that only requires NSObject in order to function. It might not be\
    \ particularly useful, but it would be extremely flexible, in that you could pass\
    \ any object to it and it would work just fine.\n\nTo extend that back into our\
    \ animal analogy, you can imagine writing code that requires capabilities that\
    \ mammalian objects provide, for example, vocalization. How the particular instance\
    \ of mammal that you are currently working with implements the vocalization method\
    \ can vary, but when you call the vocalization method, it will determine what\
    \ type of actual animal you're working with and do the appropriate thing. For\
    \ example, the dog would bark, the cat would meow, or the lion would roar."
