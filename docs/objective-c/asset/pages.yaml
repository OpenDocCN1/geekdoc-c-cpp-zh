    \ 17.6.\n\n# Listing 17.6\n\n# The cheaters version of a singleton\n\n```\nstatic\
    \ MyClass *instance = nil;\n\n+(id)sharedInstance;\n{\n    if(!instance)\n   \
    \ {\n        instance = [MyClass new];\n    }\n    return instance;\n}\n```\n\n\
    This is really all you need to do to implement an unsafe singleton. All the other\
    \ methods that I described are really there to prevent you from hurting yourself\
    \ with your own code. Some things that are notably absent here are things such\
    \ as, overriding the memory management methods, thread safety, and so on. The\
    \ key here is that you have to know as a user of this singleton that it is, in\
    \ fact, a singleton and must not be released or retained. Additionally, you need\
    \ to be sure that when you are initializing your global instance that you are\
    \ doing it before you launch any external threads. Although reading the contents\
