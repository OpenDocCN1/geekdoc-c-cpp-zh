- pgno: 322
  md: '# Working with Times and Dates


    Working with dates on computers is traditionally a complex proposition. Dates,
    despite appearances, are not nearly as simple as they might seem. They''re filled
    with exceptions and edge conditions, such as leap years, calendar changes, and
    so on. A comprehensive consideration of the subject reveals that even taking into
    consideration these exceptions, there are still issues surrounding questions of
    how far back your calendar should go and what to do with dates that fall before
    that boundary, and so on. The CE/BCE standard which we are accustomed to is really
    a fairly ineffective kludge.


    If you need more proof of how difficult working with dates can be, recall the
    Y2K problem that the computing industry experienced at the beginning of this century.
    Naive programmers had previously thought that they could represent the year in
    dates using only two digits. When the century mark rolled over, millions of lines
    of code had to be rewritten.


    Even now, we face future problems with dates due to the fact that most computers
    store their dates using 32-bit integers as a count of seconds since January 1,
    1970. Unfortunately, this counter will roll over sometime in the year 2032. Although
    that may seem far away, I remind you that programmers said the same things about
    the year 2000 when they were writing their two-digit year handling code.


    Even if you ignore some of these larger questions, there is still the very practical
    point of how to handle dates and times properly in your application. For example,
    how do you handle determining the duration of a week in hours. Your first response
    to that maybe simply to multiply the number of hours in a day by seven. This would
    be a typical, albeit naïve response. But what if one of those days is the day
    upon which we change from daylight savings time to standard time, or vice versa?
    Now your calculation has suddenly become incorrect.


    These kinds of problems are very common in software development and have resulted
    in some very high profile bugs that cost millions of dollars in public relations
    damage and problems for customers. Don''t be that programmer.


    # In This Chapter


    +   - Manipulating dates with NSDate and NSCalendar

    +   - Working with time intervals

    +   - Localizing dates'
  merge: -1
  img_proc: true
- pgno: 323
  md: 'In this chapter, I introduce you to the NSDate class, which is used for constructing
    and manipulating data objects within your applications. I also introduce you to
    the NSCalendar class that allows you to specify the rules that are used in calculating
    dates. Finally, I''m going to introduce you to the NSDateFormatter class, which
    allows you to convert a date value into something that you can display to the
    user. These three classes, when used together, form an effective tool kit for
    all of your date handling needs. Using them is the preferred method of manipulating
    dates in Objective-C applications.


    # Constructing Dates


    NSDate is the class that encapsulates a given instant in time. It includes both
    the date and time. It can be used to represent the current time, by constructing
    a new NSDate object by using the class method +date, or you can construct an NSDate
    object representing any time in the past or future by constructing one using an
    NSTimeInterval. Listing 15.1 shows how to create an NSDate object representing
    the current time. It actually shows two different methods, the first using the
    +date factory method and the second using the standard initializer.


    # Listing 15.1


    # Constructing an NSDate object


    ```

    NSDate *now = [NSDate date];

    NSDate *alsoNow = [[NSDate alloc] init];

    ```


    # Working with Time Intervals


    An NSTimeInterval represents a slice of time in seconds. By using it, you can
    construct dates relative to other dates. For example, you can construct an NSDate
    object which represents “30 minutes from now” by constructing an NSDate object
    using the initializer -initWithTimeIntervalSinceNow: and passing the number of
    seconds in 30 minutes as the parameter.


    When representing time measurements in the future, the NSTimeInterval from now
    to that future time is represented as a positive integer. In other words, five
    seconds in the future is represented as the NSTimeInterval 5. Similarly, to represent
    a time in the past, you use a negative integer as your NSTimeInterval. So, to
    represent five seconds ago in the past you would create an NSTimeInterval with
    a value of -5. You can manipulate and create new dates relative to any other date
    by adding positive or negative NSTimeIntervals to that date. This is shown in
    Listing 15.2.'
  merge: -1
  img_proc: true
- pgno: 324
  md: '# Listing 15.2


    # Creating dates with time intervals


    ```

    NSDate *now = [NSDate date];

    NSDate *anHourAgo = [now dateByAddingTimeInterval:-3600];

    NSDate *anHourFromNow = [now dateByAddingTimeInterval:3600];

    ```


    # Comparing dates


    You can compare dates to determine whether one or the other is earlier, later,
    equal, or to determine how much of a time interval exists between two dates.


    To find out the time interval between two dates, you use the method -timeIntervalSinceDate:.
    You call this method on one of your dates, passing another day as the parameter.
    This method returns the time interval between the two dates. Just like when constructing
    a new NSDate object, the NSTimeInterval that is returned will be positive if the
    receiver of the call is after the given parameter and negative if the receiver
    is before the parameter. There is also the shortcut method -timeIntervalSinceNow,
    which simply gives you the time interval between the receiver and the current
    time. Listing 15.3 shows some examples of these methods in use.


    # Listing 15.3


    # Calculating the time interval between different dates


    ```

    NSDate *now = [NSDate date];

    NSDate *anHourAgo = [now dateByAddingTimeInterval:-3600];

    NSTimeInterval timeBetween = [now timeIntervalSinceDate:anHourAgo]; // 3600

    ```


    Additionally, the NSDate class also provides the methods -laterDate:, -earlierDate:,
    and compare: for the purposes of comparing dates. In the case of the methods -laterDate:
    and -earlierDate:, these methods return the later or earlier, respectively, date
    of the two dates being compared. Meanwhile, the -compare: method returns a standard
    NSComparisonResult, and is useful when sorting dates. Listing 15.4 shows these
    methods in action.'
