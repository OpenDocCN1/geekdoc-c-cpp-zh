    # Working with Functions


    So far, I’ve shown you how you can feed instructions to the computer so the computer
    will execute those instructions sequentially as it goes through your program.
    However, as your programs grow in size and complexity, you’ll quickly find that
    putting all your instructions sequentially one after another in your program will
    become extremely laborious. You want to reuse portions of your code, and cutting
    and pasting is a very poor method of reusing code.


    Fortunately, you can use several mechanisms to solve both of these problems. The
    first of these mechanisms, and the one I’m going to explain in this section, is
    the concept of using functions. Before object-oriented programming, procedural
    programming was the preferred method for breaking your program up into smaller
    chunks that could more easily be reused.


    Objective-C, of course, is a fully object-oriented programming language, and you
    will for the most part use object-oriented programming in your application development.
    However, procedural programming is a fundamental building block that is vital
    for you to understand because there are still parts of Objective-C that are procedural
    in nature.


    # Understanding functions


    The first question that you may be asking is, “What is a function?” And the answer
    is that a function, essentially, is a method for declaring a subroutine in your
    application. A function enables you to encapsulate a portion of your program’s
    instructions into something that can be named and then used as many times as needed,
    anywhere in your application.


    Look at an example; Listing 2.22 shows a program that calculates 5 factorial (it
    should yield a value of 120). It’s using a for loop to do the calculation, a concept
    I discuss in the next section, but you can ignore that for now and just try to
    understand that it’s doing a calculation, that’s all.


    # Listing 2.22


