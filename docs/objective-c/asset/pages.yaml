- pgno: 56
  md: "# Using special variable modifiers\n\nIn addition to the variable type and\
    \ the variable name, there are also a number of keywords that are used to modify\
    \ the type of variable that you are declaring. The most important of these modifier\
    \ keywords, and the ones that you will see in this book, are the static and const\
    \ keywords.\n\nAs I mention earlier, when declaring local variables, the memory\
    \ for your variable is normally allocated each time the scope of the local variable\
    \ is entered by your program and deallocated when you leave the local scope. This\
    \ class of storage is called automatic, or, by the default modifier keyword, auto.\n\
    \nThe static keyword modifies the memory allocation of the variable being declared\
    \ so that it will be allocated only once during the run of your program. Subsequent\
    \ accesses of the same variable in your application will in fact access the originally\
    \ allocated memory. This is important, because it gives you the ability to specify\
    \ a local variable which will maintain its contents indefinitely. This makes it\
    \ ideal for storing local variables which take a lot of resources to create, but\
    \ for which the contents of the variable do not change often. Listing 2.7 shows\
    \ how you might use the static keyword in association with a function to optimize\
    \ an expensive operation such as initializing a variable.\n\n# Listing 2.7\n\n\
    # Using static\n\n```\nvoid someFunction()\n{\n    // x will be created and initialized\
    \ only once,\n    // no matter how often you call this\n    static Expensive *x\
    \ = [[Expensive alloc] initWithData:...];\n    // do things with x here...\n \
    \   [x doSomeOperation];\n}\n\nint main(int argc, char *argv[])\n{\n    someFunction();\
    \ // x is created up in someFunction\n    someFunction(); // x already exists\
    \ and will not be created again.\n    return 0;\n}\n```\n\nGlobal variables, because\
    \ they are global in scope, by default, behave similarly to static variables.\
    \ That is, they are allocated only once, and they maintain their contents throughout\
    \ the run of the application. When you apply the static keyword to a global variable,\
    \ however, it modifies the scope of the global variable so that it can be accessed\
    \ only within the file in which it is"
  merge: -1
  img_proc: true
