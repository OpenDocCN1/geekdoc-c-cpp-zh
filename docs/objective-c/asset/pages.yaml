- pgno: 113
  md: "# Listing 3.12\n\n# The employee class interface\n\n```\n#import <Cocoa/Cocoa.h>\n\
    \n@interface Employee : NSObject\n{\n    NSString *firstName;\n    NSString *lastName;\n\
    \    NSDate *birthDate;\n    NSDate *dateOfEmployment;\n    Employee *manager;\n\
    \    NSString *ssn;\n\n    double salary;\n}\n@property (nonatomic, retain) NSString\
    \ * firstName;\n@property (nonatomic, retain) NSString * lastName;\n@property\
    \ (nonatomic, retain) NSDate * birthDate;\n@property (nonatomic, retain) NSDate\
    \ * dateOfEmployment;\n@property (nonatomic, assign) Employee * manager;\n@property\
    \ (nonatomic, retain) NSString * ssn;\n@property (nonatomic, readonly) NSTimeInterval\
    \ age;\n@property (nonatomic) double salary;\n\n-(id)initWithFirstName:(NSString\
    \ *)inFirstName lastName:(NSString *)inLastName birthDate:(NSDate *)inBirthDate\
    \ ssn:(NSString *)inSsn;\n-(id)init;\n-(void)giveRaise:(double)percentage;\n-(double)bonus;\n\
    \n@end\n```\n\nThe first thing to note is that almost all the properties specified\
    \ here have data members that they map to. A property declaration consists of\
    \ the @property directive followed by attributes that affect the type of accessor\
    \ that is created as part of this property. These attributes are specified inside\
    \ the parentheses after the @property directive. The different attributes that\
    \ can be specified for a given property are shown in Table 3.1."
