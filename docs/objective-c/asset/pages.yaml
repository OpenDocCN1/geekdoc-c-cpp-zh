    \    close(fileHandle);\n    [super dealloc];\n}\n@end\n```\n\nTo convert this\
    \ class to an appropriate garbage collectible class, you need to take the deallocation\
    \ of the file handle out of the dealloc method, and put it in another method that\
    \ can be called manually by users of your object. For example, a close method.\n\
    \nListing 4.18 shows the same class updated and able to be used in a garbage collected\
