- pgno: 256
  md: 'The `#elif` directive also takes an expression and will only compile the code
    between it and the next directive if that expression evaluates to true, just like
    the `#if` directive. Essentially, the whole `#if`, `#else`, `#elif`, `#endif`
    construct is very similar to the `if`, `else` construct, except that instead of
    affecting program flow during program execution, it affects what parts of your
    application are compiled. The `#ifdef` and `#ifndef` directives work just like
    `#if`, except that instead of using an expression, it simply tests to see if a
    value has been defined at all. In the case of `#ifdef`, the code is compiled if
    the value has been defined, and in the case of `#ifndef`, the code is compiled
    if the value is not defined.


    # Using built-in macros


    GCC, the underlying compiler that Xcode uses to compile your code has a variety
    of built-in macros already available for your use. You’ve already seen some of
    them in use in the examples in this chapter. Macros like `__FILE__`, `__LINE__`,
    and others. To find out more information, visit the GCC documentation located
    at: http://gcc.gnu.org/onlinedocs/cpp/.


    # Summary


    In this chapter, I’ve introduced you to the Objective-C preprocessor, a powerful
    tool which lets you write code that modifies your code as it compiles. Using it,
    you can do all sorts of things, from preventing syntax errors with constants,
    to printing out your variables, even to conditionally compiling portions of your
    code but not others. It’s a tool that you’ll probably not use often, but one which,
    when you need it, comes in very handy.'
