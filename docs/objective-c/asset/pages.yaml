- pgno: 202
  md: "The NSKeyValueChangeKindKey specifies the kind of change you are receiving.\
    \ The possible values are shown in Table 6.4.\n\n| Table 6.4 | |\n|---|---|\n\
    | Value | Purpose |\n| NSKeyValueChangeSetting | Specifies that the value is being\
    \ set. |\n| NSKeyValueChangeInsertion | Specifies that values are being inserted,\
    \ as in a collection or one-to-many relationship. |\n| NSKeyValueChangeRemoval\
    \ | Specifies that values are being removed from a one-to-many relationship. |\n\
    | NSKeyValueChangeReplacement | Specifies that values are being replaced in a\
    \ one-to-many relationship. |\n\n# Removing an observer\n\nRemember that after\
    \ you are done observing changes to an object, you have to remember to remove\
    \ yourself as an observer. If you don’t, your application may crash.\n\n> NOTE\n\
    > In a garbage-collected environment, crashes are not an issue if you forget to\
    \ remove yourself as an observer. However, they can still be a good practice to\
    \ do so anyway so that you get in the habit of it when you’re not working in a\
    \ garbage-collected environment.\n\nTo remove yourself as an observer, you simply\
    \ call the method -removeObserver:forKeyPath:, passing the Observer as the first\
    \ parameter, and the key path that you are observing as the second parameter.\
    \ Listing 6.16 shows an example doing this in the dealloc method of the observer.\n\
    \n# Listing 6.16\nRemoving an observer.\n\n```\n-(void)dealloc;\n{\n    [obj removeObserver:self\
    \ forKeyPath:@\"memberVariable\"];\n    [super dealloc];\n}\n```"
