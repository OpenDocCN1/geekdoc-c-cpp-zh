- pgno: 182
  md: "# Using Key Value Coding and Key Value Observing\n\nThe Objective-C runtime\
    \ provides you with a variety of advanced tools for not just interacting with\
    \ the operating system frameworks, but also for interacting with the attributes\
    \ of your code. One tool available to you is the concept I cover in this chapter\
    \ called Key Value Coding. Key Value Coding, or KVC as it is often referred to\
    \ in Objective-C circles.\n\n# Accessing Object Properties Using Key Value Coding\n\
    \nKey value coding gives you the ability to access attributes of your classes\
    \ using a set of standardized accessor methods in addition to your normal setter\
    \ and getters. You can use these accessor methods to get and set properties of\
    \ your classes by specifying string identifiers that represent the names of the\
    \ attributes you want to access. In addition to enabling you to access these attributes\
    \ using these string identifiers, you can also access object relationships and\
    \ sub objects by using a standardized syntax.\n\nTo give you an example of what\
    \ I'm talking about, take a look at Listing 6.1\n\n```\nSome example classes.\n\
    \n@interface Bar : NSObject\n{\n    NSArray *array;\n    NSString *stringOnBar;\n\
    }\n```\n\n# Listing 6.1\n\n![](img/aaee977487e7a3eefe7b1dd596e0f6fb_182_0.png)"
  merge: -1
