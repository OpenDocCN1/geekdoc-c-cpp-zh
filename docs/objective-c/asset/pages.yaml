    array. This can be difficult in some cases, and might even force you to make a
    category to extend third-party classes for this purpose.


    # Summary


    Collection classes are a vital part of any standard library. Objective-C, fortunately,
    has an excellent group of collection classes that make working with groups of
    objects easy. With NSArray for ordered collections, NSDictionary for associative
    collections, and NSSet for unordered collections, you have all the tools you need.'
