    {\n    return [bars objectAtIndex:inIndex];\n}\n\n// OR...\n\n-(NSArray *)barsAtIndexes:(NSIndexSet\
    \ *)inIndexes;\n{\n    return [bars objectsAtIndexes:inIndexes];\n}\n\n// OR ...\n\
    \n-(void)getBars:(Bar **)outBuffer range:(NSRange)inRange;\n{\n    [bars getObjects:outBuffer\
    \ range:inRange];\n}\n\n@end\n```\n\nIn addition to these accessors, you can also\
    \ implement the optional method -get<Variable Name>:range:, which can provide\
