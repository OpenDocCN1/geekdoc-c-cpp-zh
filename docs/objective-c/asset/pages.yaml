    \    struct Point p;\n    // assigning values to the struct's members...\n   \
    \ p.x = 20.0;\n    p.y = 50.0;\n\n    // ... then to use the point...\n    moveCursorToPoint(p);\n\
    \n    return 0;\n}\n```\n\nObjective-C and Cocoa use structures for storing things\
    \ such as points, rectangles, and so on. The nice thing about using structures\
    \ is that they are a very lightweight way to store groups of related variables.\
    \ In Chapter 3, you see how to use objects to also group related variables and\
    \ the methods that act on those variables. However, objects can have a fair amount\
    \ of overhead associated with them. Structures, on the other hand, have no more\
    \ overhead than the variables that make up their members. Therefore, they can\
    \ sometimes be used in performance-sensitive areas where objects would be too\
    \ heavy.\n\n# Using typedefs\n\nNaturally, typing struct Point every time you\
    \ want to declare a point can quickly become tedious. Fortunately, Objective-C\
    \ provides another construct that can help with this. This construct is called\
    \ typedef."
