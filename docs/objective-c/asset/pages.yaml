  md: "If you use properties to encapsulate your objects attributes, then it automatically\
    \ generates accessors that are KVC compliant. In other words, if you’re using\
    \ properties, you don’t have to do anything else. You’re done. That said, the\
    \ normal caveats apply. If you use properties and you choose to override the standard\
    \ property accessor naming conventions, then your accessors will not be KVC compliant,\
    \ and they won’t work with KVC.\n\n# Using KVC with arrays\n\nWhen talking about\
    \ object-oriented design, thinking about the relationships between your objects\
    \ is helpful. When one class has a member variable which is of another class type,\
    \ this relationship can be said to be a one-to-one relationship. Listing 6.8 shows\
    \ an example of a class interface of this type.\n\n# Listing 6.8\n\n# The class\
    \ Foo which has a one-to-one relationship with the class Bar\n\n```\n@interface\
    \ Foo : NSObject\n{\n    Bar *bar;\n}\n@property (retain) Bar * bar;\n@end;\n\
    ```\n\nFor example, if a given class contains a member variable that is actually\
    \ a collection of other objects, this relationship is said to be one-to-many.\
    \ A one-to-many relationship is typically implemented through the use of an NSArray\
    \ or NSSet member variable containing elements that are instances of whatever\
    \ the other class is.\n\nListing 6.9 shows an example of this type of relationship.\
    \ Note, however, that the array contains instances of the class Bar, but it is\
    \ not specified here.\n\n# Listing 6.9\n\n# A one to many relationship from the\
    \ class Foo to many instances of class Bar\n\n```\n@interface Foo : NSObject\n\
    {\n    NSArray *bars;\n}\n@property (retain) NSArray * bars;\n@end;\n```"
