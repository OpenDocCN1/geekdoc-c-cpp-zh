- pgno: 278
  md: '# 11 Understanding How the Frameworks Fit Together


    When working with Objective-C on MacOS X, iPhone, and iPad, the reusable libraries
    provided by the operating system are typically packaged as frameworks. These frameworks
    bundle together header files, documentation, and dynamic libraries to present
    a package containing all of the information and data necessary for using the code
    within them.


    How exactly frameworks are implemented is relatively platform specific. A framework
    could be packaged as a dynamic library like the one I just described, as is the
    case in MacOS X, or it could be a static library, as is the case occasionally
    on Linux or BSD. Because of the platform centric nature of the framework bundle
    itself, a detailed explanation of how to build a framework is beyond the scope
    of a language-centric book such as this one. However, that said, it is important
    that you understand what some of the key frameworks that are typically used with
    Objective-C are and what they provide. Therefore, this chapter focuses on giving
    you an overview of the available frameworks on some of the platforms upon which
    you can build your Objective-C programs. For reasons that will become obvious
    later, writing a strictly language-centric Objective-C book without including
    extensive coverage of at least the Foundation framework is almost impossible.
    Because of this, the remainder of this part of the book focuses on discussing
    some of the details of this key component.


    # Understanding the Foundation Framework


    You may not know it, but you have already been using frameworks in your applications
    if you have been following along with the example code from this book. Every example
    application that’s been shown so far has been a Foundation application, which
    means that it links with the Foundation framework.


    # 11 In This Chapter


    +   - Explaining frameworks

    +   - Learning where Foundation fits into other frameworks

    +   - Learning how to add frameworks to your projects'
  merge: -1
  img_proc: true
- pgno: 279
  md: 'Most languages have a standard library. The C programming language for example
    has the C. standard library. C++ extends the standard library to also include
    a standard template library. Java also has a standard library, and so on. In most
    cases, these standard libraries are specified as providing certain functionality,
    but implementation is left to the platform vendors.


    Objective-C as a language does not specify a standard library as such, but over
    time, the Foundation framework has evolved into the closest thing to a standard
    library that Objective-C has. It provides many of the same facilities — strings,
    collections, I/O, and so on that the standard libraries of these other languages
    provide.


    Though originally developed and supported by NeXT/Apple for NeXTstep and Mac OS
    X, it has become the gold standard by which other platforms must adhere to in
    order to realistically be considered a viable Objective-C platform. Foundation
    itself is a huge library, and a comprehensive list of every class and method that
    Foundation provides is way beyond the scope of what would be practical here. To
    give you just a taste of what’s available as part of this library, however, I
    have listed many of the more commonly used classes in Table 11.1.


    # Table 11.1


    | Class | Purpose |

    |---|---|

    | NSArchiver/NSUnarchiver | Used for serializing and deserializing objects that
    conform to the NSCoder protocol. |

    | NSArray/NSMutableArray | Ordered collections. |

    | NSAutoreleasePool | Implements the auto release pool used in retain count and
    memory management. |

    | NSBundle | Provides a dramatic interface for application bundles. |

    | NSCalendar | Provides classes for dealing with calendars. |

    | NSData | A class whose purpose is for storing generic data. |

    | NSDate | A class for creating and manipulating dates. |

    | NSDateFormatter | Provides localization and formatting for dates. |

    | NSDictionary/NSMutableDictionary | An associative collection. |

    | NSLock | Thread locking. |

    | NSError | Used to store error information. |

    | NSException | The base class for exceptions. |

    | NSEnumerator | Used for the purposes of enumerating over a collection. |

    | NSFileHandle | A wrapper class for dealing with file I/O. |'
  merge: -1
  img_proc: true
- pgno: 280
  md: '| Class | Purpose |

    |---|---|

    | NSFileManager | A class which encapsulates operations related to the file system
    such as creating directories and so on. |

    | NSGarbageCollector | A class for interacting in an object-oriented manner with
    the garbage collector. |

    | NSSet/NSMutableSet | An unordered set collection. |

    | NSNotification/NSNotificationCenter | Provides a means for sending and receiving
    arbitrary notifications through the runtime. |

    | NSObject | The base class or all other classes. |

    | NSTask | A class for interacting with operating system processes. |

    | NSThread | A class for creating and interacting with threads. |

    | NSURL | A class which encapsulates uniform resource locators. |

    | NSURLConnection | Networking classes enabling connection to resources located
    on the Internet utilizing supported protocols. |

    | NSString/NSMutableString | The Objective-C string class. |


    Perhaps the most important class that Foundation provides is NSObject, from which
    every other class in Objective-C inherits. In fact, it is NSObject which provides
    much of the functionality that we take for granted as part of Objective-C, things
    like Key Value Coding, reflection, and some aspects of dynamic dispatch. Without
    Foundation, Objective-C would be an absolutely crippled language. The two go hand
    in hand.


    Foundation is extremely comprehensive. For the most part, before considering inventing
    some low-level class yourself, check first to see if it already exists in Foundation.
    More than likely, it does.


    Even now, I find myself discovering new things in Foundation and other frameworks,
    and constantly being surprised at all the unusual edge cases Apple has anticipated.
    For a full listing of everything in the Foundation, or any other Apple framework,
    visit the Apple documentation at http://developer.apple.com.


    # Exploring other frameworks


    The Foundation framework does not stand alone on MacOS X. Apple provides many
    additional frameworks as part of the standard platform as well as hundreds of
    frameworks that you can download from third parties. Among the Apple provided
    frameworks are things like AppKit, which provides the classes necessary for building
    GUI applications on MacOS X, UIKit which'
  merge: -1
  img_proc: true
- pgno: 281
  md: 'provides the classes needed for building GUI applications on iPhone and iPad,
    and a slew of other frameworks which provide functionality specific to things
    such as network services, graphics, and so on. For the purposes of this book,
    we will focus exclusively on Foundation. This framework easily has the greatest
    cross-platform support of any of the frameworks on MacOS X. It is available in
    the official Apple versions on MacOS X, iPhone, and iPad, and in the form of open
    source third-party implementations on Linux, BSD UNIX, and even Windows. One type
    of implementation enables you to develop your application by using Xcode on MacOS
    X, and cross compile to build an executable for Windows. In many ways, the Foundation
    framework provides greater portability and power than some standard libraries
    that have been built specifically for that purpose.


    For now, however, since Apple platforms are by far the most popular platforms
    for Objective-C developers at this time, I focus primarily on features available
    there.


    # Using Frameworks in Your Projects


    Though it is specific to MacOS X, I am going to visit, briefly, the subject of
    using frameworks in your own projects so that you’ll know how to handle them when
    you need to.


    Frameworks provided by Apple are typically installed in the directory that you
    installed Xcode, by default /Developer. Under this directory, you’ll find a directory
    called Platforms. Inside the Platforms directory, you’ll find a directory for
    each of the different development platforms for which you have an SDK installed.
    For example, if you have installed the iPhone SDK, then you will see directories
    corresponding to iPhone OS. If you have not, then you will only see directories
    corresponding to MacOS X.


    Inside of the SDK directory, you’ll find a path leading to System/Library/Frameworks
    It is within this directory that all of the frameworks for this particular platform
    in this particular SDK located.


    # Adding frameworks


    Adding a framework to your project is very straightforward. You simply right-click
    or option click the target to which you intend to add the framework, and choose
    Add ⇧ Existing Frameworks. Doing this brings up the framework selection dialog
    box, as shown in Figure 11.1.


    This dialog box enables you to select from the list of installed frameworks whichever
    framework you wish to link with your currently selected target.'
