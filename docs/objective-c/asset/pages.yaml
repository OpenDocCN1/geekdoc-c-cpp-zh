    \ with bar...\n\nCFRelease(bar);\n}\n\n-(void)startLongOperation\n{\n    Bar *bar\
    \ = [[Bar alloc] init];\n    CFRetain(bar);\n    foo = [[Foo alloc] init];\n \
    \   [foo startLongOperationWithDelegate:self callbackMethod:\n        @selector(callbackMethodForObject:withUserInfo:)\n\
    \        userInfo:bar];\n}\n\n@end\n```\n\nEssentially, before passing your user\
    \ data pointer to the object which is going to call your callback, you manually\
    \ call a CFRetain, passing your user data pointer as its parameter. At this point,\
    \ a strong reference is established for the object in question.\n\nSubsequently,\
    \ when your callback is called, and passed the user data pointer, you should call\
    \ the CFRelease, again, passing the pointer as its parameter. This removes the\
    \ strong reference to the pointer and makes it so that the next time the garbage\
    \ collector executes, assuming you don’t establish another strong reference to\
    \ this object, it will be collected.\n\n# Using the object oriented interface\
    \ to the garbage collector\n\nIn addition to the functional interface of the garbage\
    \ collector, which is appropriate to use in low-level code, Apple also provides\
    \ a higher-level abstraction for working with the garbage collector the NSGarbageCollector\
    \ class.\n\nThe NSGarbageCollector class is a singleton that allows you to interact\
    \ with the garbage collector through an Objective-C interface. You can access\
    \ the current thread’s garbage collector by calling the defaultCollector method.\
    \ After you have the singleton instance of the garbage collector, you can use\
    \ it to disable or enable collection for specific pointers, or even for the entire"
