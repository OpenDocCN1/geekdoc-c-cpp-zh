  md: "# Listing 3.11\n\n# \"Private\" methods in Objective-C\n\n```\n@interface Foo\
    \ : NSObject\n{\n}\n\n+(id)fooWithArray:(NSMutableArray *)inArray;\n-(void)someOtherMethod;\n\
    \n@end\n\n@implementation Foo\n\n+(id)fooWithArray:(NSMutableArray *)inArray\n\
    {\n    return [[[self alloc] initWithArray:inArray] autorelease];\n}\n\n-(void)somePrivateMethod;\n\
    {\n    // do something private...\n}\n\n-(void)someOtherMethod;\n{\n    [self\
    \ somePrivateMethod]; // this is OK.\n    [self anotherPrivateMethod]; // this\
    \ generates a warning\n}\n\n-(void)anotherPrivateMethod;\n{\n    // do something\
    \ else private\n}\n\n@end\n```\n\nNotice that the first private method is physically\
    \ above the method that calls it in the file and in the listing. The second private\
    \ method is below the method that calls it. If you were to do this in your code,\
    \ the second private method generates a compiler warning just like if you were\
    \ calling a private method in another class."
