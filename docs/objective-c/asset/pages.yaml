- pgno: 41
  md: 'It is possible to use the command line utility xcodebuild to build your projects.
    This can be handy when automating builds. If you do this, the option at the bottom
    of this screen, “Command-line builds use,” controls which configuration will be
    used if you do not specify one.


    Most of these settings are things that you will typically not be changing for
    most of this book. That said, you can scroll through the settings, click on each
    of them, and view the information that it shows at the bottom of the screen describing
    each of the options if you are curious what they do. The third tab under the target
    build settings is the Rules tab, which enables you to configure the default compilation
    behavior for different types of files within your project. So, for example, if
    you have a particular kind of file that requires special processing as part of
    the build process, you can add that file here by pressing the plus button. Then
    configure whatever type of custom behavior you require. Additionally, if you want
    to change the default behavior for any of the built-in files, you can also do
    that here by simply changing the drop-down list options.


    For the most part, you will not need to make any changes to the settings. When
    building graphical Cocoa applications, one additional tab under the target build
    settings is the Properties tab. This tab allows you to configure options such
    as the executable name and the main bundle identifier for your project. Typically,
    you want to configure the identifier to match your company name as opposed to
    using the default. Additionally, if you have files that your application saves
    that you want to be able to double-click to launch, you can register and configure
    a document type for those files here. When your application is built, Mac OS X
    will detect the file type that you specify as associated with your application,
    and it will list your application as one that can open that particular type of
    file. This behavior is shown in Figure 1.12.


    > NOTE

    > For command line applications, you will not see a Properties tab. The Properties
    tab is actually configuring the information in your App bundle, which doesn’t
    exist in command line apps.


    You can also configure an icon for your application if it’s a graphical application.
    You do this by including the icon file as part of your application bundle and
    specifying its name in the Icon File setting.


    Again, for most of the development that you do in this book, you don’t need to
    change any of these options, but it’s good to know where they are for future reference.


    > NOTE

    > Xcode 4, which is still under development as this book goes to print, has moved
    the build settings around a bit, but the settings themselves remain mostly the
    same. See the Xcode 4 documentation for the latest information on this feature.'
  merge: -1
  img_proc: true
