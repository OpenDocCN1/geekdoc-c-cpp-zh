- pgno: 203
  md: "# Implementing manual notifications\n\nAll of these notifications happen automatically.\
    \ All you need to do is use KVC compliant accessors for your properties and everything\
    \ will work fine. Sometimes, you don’t necessarily want to take advantage of the\
    \ automatic notifications. Where you want to instead manually send notifications\
    \ that you’ve just changed a value or set of values. For example, if you are about\
    \ to make many changes at once, you may want to group up the notification and\
    \ only send one notification. In these cases, you want to use manual notifications.\n\
    \nTo use manual notifications, you must first override the class method +automaticallyNotifiesObserversForKey:\
    \ to tell Objective-C that you do not want it to automatically notify observers\
    \ of changes. You do this by returning NO for any keys for which you want to implement\
    \ manual notification. An example of this is shown in Listing 6.17.\n\n# Listing\
    \ 6.17\n\n# Overriding +automaticallyNotifiesObserversForKey:\n\n```\n+(BOOL)automaticallyNotifiesObserversForKey:(NSString\
    \ *)inKey;\n{\n    if([inKey isEqualToString:@\"memberVariable\"])\n        return\
    \ NO;\n    return YES;\n}\n```\n\nWhen you actually want to perform a manual notification\
    \ for change, you must call the method -willChangeValueForKey: prior to the change\
    \ and then -didChangeValueForKey: after. An example of this is shown in Listing\
    \ 6.18.\n\n# Listing 6.18\n\n# Implementing manual notifications\n\n```\n-(void)setMemberVariable:(CGFloat)inValue;\n\
    {\n    [self willChangeValueForKey:@\"memberVariable\"];\n    memberVariable =\
    \ inValue;\n    [self didChangeValueForKey:@\"memberVariable\"];\n}\n```"
  merge: -1
  img_proc: true
- pgno: 204
  md: "These calls can be nested when needed, in cases where you need to modify multiple\
    \ variables in one call. There are corresponding calls for one to many relationships.\
    \ These are -willChange:valuesAtIndexes:forKey: and -didChange:valuesForIndexes:forKey:.\n\
    \n# Understanding risks with KVO\n\nUsing KVO is not without problems. Any time\
    \ you let the computer just “do things” on its own, there’s always the possibility\
    \ that you might wind up with some unusual combination of factors that, once in\
    \ a blue moon, may cause problems. KVO is not immune to this.\n\nMore specifically,\
    \ the biggest risk factor that you have in using KVO is that, if observers are\
    \ watching your every move, those observers can sometimes have side effects, and\
    \ because you don’t control those observers, you can’t control those side effects\
    \ either.\n\nFor the most part, this isn’t an issue, but in one case this can\
    \ cause problems. This case is when you use your accessors to free your member\
    \ variables in your initializer or your dealloc method, as shown in Listing 6.19.\n\
    \n# Listing 6.19\n\n# Using accessors to release member variables in your dealloc\n\
    \n```\n-(void)dealloc\n{\n    [self setFoo:nil];\n    [self setBar:nil];\n   \
    \ [super dealloc];\n}\n```\n\nWriting your dealloc method like this is great!\
    \ You can simultaneously release your member variable and set it to nil, all in\
    \ one shot.\n\nThe problem is, when you’re calling those accessors, the KVO observers\
    \ will be receiving notifications of those changes. If they are not expecting\
    \ to receive nil, or if they are expecting to be able to manipulate the object\
    \ itself when the notification is received, bad things can happen.\n\nFurthermore,\
    \ if you can imagine an observer that when receiving a notification for a change\
    \ to the bar variable, expects to be able to access the foo variable obviously,\
    \ in this case, it would have a problem because the foo variable has already been\
    \ deallocated and set to nil.\n\nApple’s current recommendation is that you do\
    \ not use accessors for initializing or deallocating member variables in your\
    \ initializer or dealloc method. This is further complicated by the fact"
  merge: -1
  img_proc: true
- pgno: 205
  md: "that under the 64-bit runtime is possible to declare properties that do not\
    \ have member variables associated with them. In these cases, the only way to\
    \ initialize and deallocate as member variables is by using their accessors.\n\
    \nIn my code, I use accessors for initializing and deallocating member variables\
    \ unless I know that doing so in a given circumstance will cause a problem. Also,\
    \ when I implement a key value observer I ensure that the observer can properly\
    \ handle nil values and I try to minimize any side effects.\n\nIf you feel that\
    \ this is a risk worth taking, then feel free to write your initializers and dealloc\
    \ method by using your accessors. Just be aware of the potential hazards involved,\
    \ so that if and when you do encounter a problem, you know immediately where to\
    \ look.\n\nOn the other hand, if you don’t feel that you can ensure this with\
    \ your observers, follow Apple’s advice and do not use accessors in initializers\
    \ and destructors unless you must.\n\n# Applying Key Value Observing\n\nNow that\
    \ you understand all the details of Key Value Coding and Key Value Observing,\
    \ take a look at a small example application with a few classes. One of those\
    \ classes will observe the other classes, and as it receives notifications of\
    \ changes to the attributes on the observed classes, it will print out those changes\
    \ to the console.\n\nListing 6.20 shows the first class in this application. This\
    \ simple point class has a couple of properties, x, and y. Just put the interface\
    \ into the interface file, and the implementation in an implementation file.\n\
    \n```\n```objc\n// Interface - goes in MyPoint.h\n#import <Cocoa/Cocoa.h>\n\n\
    @interface MyPoint : NSObject\n{\n    CGFloat x;\n    CGFloat y;\n}\n@property\
    \ CGFloat x;\n@property CGFloat y;\n\n@end\n```\n```"
