- pgno: 55
  md: '# Table 2.1 Continued


    | Type | Description |

    |------|-------------|

    | long long | A 64-bit integer. |

    | char | A single character. Technically it''s represented as an int. |

    | BOOL | A boolean value, can be either YES or NO. |

    | NSInteger | When compiling for 32-bit architecture, same as an int, when compiling
    for 64-bit architecture, +/- 4,294,967,296. |

    | NSUInteger | When compiling for 32-bit architecture, same as an unsigned int,
    when compiling for 64-bit architecture, value between 0 and 2^64. |


    Most of these scalar types are also shared with C and C++, but there are a couple
    here that are unique to Objective-C.


    Apple has been very good about supporting 32-and 64-bit architectures with their
    operating system and libraries. Doing so, however, is no easy task from a programming
    point of view. For example, some values, such as array indices, may benefit from
    the increased upper limit of 64-bit integers. As a result, in an ideal world,
    we want our code to be able to seamlessly transition between 32-bit and 64-bit
    platforms. Therefore, Apple provides us with the NSInteger and NSUInteger types,
    which automatically will be either 32-bit or 64-bit depending on the architecture
    they are compiled under.


    Using scalar types is very straightforward. To declare a scalar variable, you
    simply tell the compiler the type and the name of the variable. You can also give
    it an initial value. For example, Listing 2.6 shows how some typical scalar variables
    might be declared.


    # Listing 2.6


    # Declaring Scalar Variables


    ```

    int foo = 10;

    double bar = 500.0;

    float baz;

    unsigned long n;

    NSInteger x;

    char a = ''a'';

    ```


    # NOTE


    Notice the variable a has been initialized with the value ''a''. Using single
    quotes around a character tells the compiler to take the value of that character
    as a char. This should not be confused with a string, which I will discuss later,
    and which is designated with the @"" construct.'
