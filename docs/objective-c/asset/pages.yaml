  md: 'that you have to edit this code at all. I want to teach you also how to write
    command line applications, so that’s why I’m showing you this code here.


    # NOTE


    What is a function? A function, essentially, is a subroutine in your program.
    It’s a branch to another piece of code that executes some task and then returns.
    You send data to your function by including arguments when you call the function
    (the things in parentheses). You get data back from your functions in several
    ways, but the primary way is by receiving a return value, which is a value returned
    from the function back to your calling code.


    All Objective-C applications have a main function. The main function is also where
    your program begins and ends. Your program begins executing by calling the main
    function from the operating system. The two arguments shown, argc and argv, contain
    the parameters given on the command line to your application. Your application
    begins executing each of the lines inside of the main function one after another,
    until it reaches a return statement. In this case, our return statement is simply
    returning zero. This indicates that our program has exited successfully.


    Line 5 contains a call to a function called NSLog. This function causes whatever
    string is passed to it to be printed to the console when the application is run.


    The curly braces on lines 4 and 7 indicate the scope of the main function. You
    see these used frequently. The semicolons at the end of lines 5 and 6 indicate
    the end of those statements, and they are used by the compiler to separate one
    statement from another. Statements in Objective-C can be split up over multiple
    lines. As a result, the compiler needs to have some indication when a statement
    has ended so that it can parse that statement. Knowing when to place a semicolon
    at the end of a line can be confusing for many beginners. Remember that any statement
    inside a function block, except for flow control statements, requires a semicolon
    at the end of the line. Additionally, declarations also require semicolons. Line
    1 is an import statement. Import statements allow you to load code from other
    files in your current file. In this case, we are including the interface declarations
    for the Foundation framework. (You can read more about the foundation framework
    in Part II of this book.) This line of code is required in order to load the code
    that will allow us to use the NSLog statement in line 5. The unusual @"Hello from
    Objective-C" is known as a string. Strings are literal text in your code; they
    are stored in a variable in your program and can be accessed later. In this particular
    case, this string will be sent as an argument to the NSLog function which will
    then display it on the console.


    Go ahead and compile and run this application and view the output. You should
    see something like Figure 2.1.'
