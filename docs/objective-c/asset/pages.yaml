  md: '# Figure 4.1


    Garbage Collection Build Settings


    ![](img/aaee977487e7a3eefe7b1dd596e0f6fb_146_0.png)


    Compiles code to use Garbage Collector write-barrier assignment primitives within
    the Objective-C runtime. Code is marked as being GC capable. An application marked
    GC capable will be started by the runtime with Garbage Collection enabled. All
    Objective-C code linked or loaded by this application must also be GC capable.
    Code compiled as GC Required is presumed to not use traditional Cocoa retain/release
    methods and may not be loaded into an application that is not running with Garbage
    Collection enabled. Code compiled as GC Supported is presumed to also contain
    traditional retain/release method logic and can be loaded into any application.
    Garbage


    The first setting, of course, is no garbage collection at all. You can enable
    this by choosing the Unsupported option. The second option is the Supported option.
    This option adds the flag -fobjc-gc, which specifies that your project supports
    garbage collection but does not require it. When using this setting, you can link
    your project with applications that have not been compiled for garbage collection.
    This setting is normally only used for libraries. When using this setting, your
    code is expected to implement both dealloc methods as well as finalize methods,
    so that it can be used regardless of whether the application that it is being
    linked with is compiled for garbage collection or not.


    The final setting, Required adds the compiler flag -fobjc-gc-only to your compile
    settings, and specifies that your code does not use retain/release methods and
    thus cannot be loaded into an application that does not support garbage collection.'
