- pgno: 191
  md: 'In these cases, when accessing these values through KVC, you may not necessarily
    want to simply access the array member variable, but instead access the elements
    of the array directly. In some cases, this can be more efficient, but at the very
    least, it more directly represents the actual relationship that exists between
    these two objects.


    KVC provides a special set of accessors specifically for these types of operations.
    They are used specifically to access the properties of one-to-many relationships
    as well as the individual elements involved in those relationships.


    These accessors fall into two broad categories. The first is that of indexed accessors.
    These accessors are used when you want to access an individual element in a one-to-many
    relationship represented as an array. An NSArray is an ordered collection and
    typically, this is the sort of container class that is used in this case. The
    second type of access for a one-to-many relationship is one that is used in the
    case when you’re relationship member variable is in an unordered collection, such
    as an NSSet. In this case, the accessors that are used to access the elements
    in this type of one-to-many relationship are known as unordered accessors. Both
    of these types of accessors have both mutable and immutable variations.


    # NOTE


    Though typically these relationships are modeled using NSArray and NSSet, technically,
    they can be modeled using any sort of collection that you choose. The key issue
    is that your accessors that you create must obey the contract specified for each
    of the types of access.


    # Using indexed accessors


    When working with indexed accessors for a one-to-many relationship, there is one
    method that you must implement for retrieving the count of elements, -countOf<VariableName>,
    and then several other methods which you must choose amongst to implement for
    retrieving the elements of the relationship. The methods for retrieving the elements
    in the indexed collection, are either -object<VariableName>AtIndex: or -<variableName>AtIndexes:.
    These methods are designed to enable users of your class to access a given element
    at the given index or indexes and should return the appropriate object accordingly.
    Examples of implementations of these accessors include the one-to-many relationship
    of Foo to Bar in Listing 6.10.


    # Listing 6.10


    # Implementation of immutable one-to-many indexed accessors


    ```

    @implementation Foo


    -(NSUInteger)countOfBars

    {

    ```'
