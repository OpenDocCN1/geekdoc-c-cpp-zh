- pgno: 141
  md: 'Inside the dealloc method, you should free any resources that were allocated
    by your object, including any memory associated with any of its member variables.
    You do this by calling release on any member variables. After releasing a member
    variable, you should always make a point to assign the pointer which previously
    held the data for that member variable to nil.


    Objective-C, unlike other languages, such as Java or C++, specifies that methods
    called on nil objects result in no operations at all (a “no-op” in comp-sci speak).
    Therefore, setting your pointers to nil after releasing them is always a good
    idea. When you release a member variable, though its memory may be freed, its
    pointer still points to the location in memory where that object once existed.
    Other data may immediately be written to that same location in memory. When this
    occurs, accessing that variable again may result in a crash or unexpected, undefined,
    behavior. If you fail to set the member variable to nil, access to that member
    variable will be accessing unknown values in memory. This is known as a “dangling
    pointer”.


    When working with objects that are using your object as a delegate, special care
    must be taken as well. When you assign your object as a delegate for another object,
    the delegating object, according to Cocoa standards, should not retain the assigned
    object (the delegate).


    The reason is that if your object allocates an object for which it is a delegate,
    the result could be a circular retain cycle, wherein your object retains the sub
    object, which in turn retains your object as a delegate. In this case, deallocating
    either object will still result in both objects remaining allocated, because they
    contain references to each other. Because of this, the object with the delegate
    always has the delegate variable specified to be assigned rather than retained.
    Therefore, when deallocating an object that is the delegate for another object,
    always set the sub objects delegate property to nil in your dealloc method to
    prevent the sub object from trying to make calls on a delegate that has been deallocated.


    Another common situation, similar to that of the delegates issue occurs when using
    the observer pattern, or the more Objective-C specific implementation of the observer
    pattern, the NSNotificationCenter. When using the NSNotificationCenter to have
    your object notified of certain events while your application is running, you
    should always be sure to remove yourself as an observer of the NSNotificationCenter
    when your object is deallocated. Failure to do so can result in a crash. The same
    also applies when having your object observe Key Value notifications for other
    objects. You should always remove yourself as a Key Value Observer from any objects
    for which you previously set yourself as an observer. I cover this topic in Chapter
    6.


    After you have deallocated your resources, and removed your object from any observing
    or delegation responsibilities that it may have had, then the last thing that
    you should always make sure to do is call the superclass dealloc method. This
    gives your superclasses an opportunity to free their resources.. If you fail to
    call your superclass dealloc method, your application will leak memory. The call
    to [super dealloc] should always be the last line of your dealloc method so that
    it comes after you’ve cleaned up your own memory allocations.'
