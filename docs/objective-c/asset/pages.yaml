- pgno: 43
  md: "The errors detected by the analyzer are displayed just like regular compilation\
    \ warnings. However, when you click on an error in your source code, you get additional\
    \ contextual information in the form of graphical code flow arrows. These arrows\
    \ show you the predicted code path that the analyzer expects will be used when\
    \ your code is run. This information can help you to understand in greater detail\
    \ the exact circumstances that the analyzer is considering when detecting your\
    \ error.\n\nTake a look at how the analyzer handles some common coding mistakes.\
    \ Again, much of what I’m discussing here is an advanced topic that you learn\
    \ more about in later chapters. For now, skim over this section, but return to\
