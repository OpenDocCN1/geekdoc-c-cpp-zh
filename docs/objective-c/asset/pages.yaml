    \        unarchiveObjectWithFile:inPath] retain];\n}\n```\n\nAgain, here NSKeyedUnarchiver\
    \ will open the file and call initWithCoder on the root object in that file. This\
    \ causes all of the subobjects in the object graph to be thawed out again.\n\n\
    # Working with Archiver File Formats and Legacy Data\n\nThe archives written by\
    \ NSKeyedArchiver can be either XML or Binary. To configure the file format, use\
    \ the method -setOutputFormat: on the NSKeyedArchiver object you create before\
    \ writing the data to disk. (This will require you to use the standard alloc/init\
    \ method for creating the archiver). You can set this value to NSPropertyListXMLFormat_v1_0\
    \ for XML or NSPropertyListBinaryFormat_v1_0 for binary formats. Binary formats\
    \ tend to be slightly faster and smaller than XML, but are, of course, less portable.\n\
    \nThe NSCoder system is designed for modern object graphs made up primarily of\
    \ Objective-C objects. If you have legacy binary file formats, you can always\
    \ fall back to using standard C file I/O routines to read and write them."
