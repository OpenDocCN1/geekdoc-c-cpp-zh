  md: "Declaring a struct is a two-stage affair. First you have to tell the compiler\
    \ about the struct itself, and then you can use the struct to declare variables\
    \ that are of the type of the struct you have defined. Continuing our example\
    \ of declaring a variable for a point, Listing 2.9 shows how this structure might\
