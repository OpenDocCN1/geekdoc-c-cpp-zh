- pgno: 362
  md: '# NOTE


    Another big limitation with notifications vs. delegation is that delegates can
    have a return value from their methods while notifications cannot.


    The Observer pattern and its Objective-C implementation, the NSNotificationCenter,
    presents an interesting design pattern to study in Objective-C because of the
    fact that it is implemented almost entirely through the framework classes rather
    than through implementation details of the Objective-C language itself. In other
    words, the fact that this design pattern is implemented simply by using a standard
    class, NSNotificationCenter, and some standards agreed upon between the observed
    object and the observers make this an interesting pattern to study. Consider the
    idea that as you discover design patterns in your own code, you might be able
    to leverage your knowledge of this pattern and how it is implemented to create
    more reusable components yourself, which can be integrated into your own code
    as easily.


    # Summary


    In this chapter, I have shown you how to implement three different design patterns
    in Objective-C. This is by no means a comprehensive listing of the vast catalog
    of potential design patterns available. My intent was simply to introduce you
    to a representative few design patterns so that you could get a feel for how Objective-C
    as a language impacts the implementation of those design patterns as compared
    to C++ or Java. My recommendation, for further research on the subject, is to
    pick up a book on design patterns. There are several available, including at least
    one which specifically addresses design patterns in Cocoa. No matter how you approach
    design patterns, I do suggest that you make an effort to study them.'
