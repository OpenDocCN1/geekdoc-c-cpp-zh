- pgno: 109
  md: '# # Introducing Objective-C


    In Objective-C, methods are called on classes and objects by surrounding them
    in square brackets. You put the opening square bracket at the beginning of the
    object or class that the method relates to, and then you place the closing square
    bracket at the end of the method invocation. Thus, looking at the code above,
    you can see that in the initialization of our object variable, we actually have
    two method calls in both of the initialization code snippets. The first one is
    a call to alloc. This method is actually being called on the class. The second
    method call is for the method init. This method is actually being called on the
    object that is returned from the alloc call. It''s important to recognize when
    looking at this code that the alloc call is in fact returning an object and that
    the init method is being called on that object. This is not uncommon whatsoever
    in Objective-C code to see nested calls like this where calls are made on objects
    returned from prior method calls.


    Initializing an Objective-C object is actually a two-step process. The first step
    is used to allocate the memory that will be used to store the data and the methods
    that make up the object. This is what the alloc call is for. This is why the init
    and method can be called on the object that is returned from alloc. I cover this
    in more detail in the chapter on memory management, but it is important to note
    that any object that you allocate, using an alloc method, like shown here, must
    also be released. To release an object, you simply call the method release on
    the object. Release is a method that is defined on NSObject.


    # ## Making calls on objects


    After you have declared and created an instance of your class, you will, likely,
    want to make calls on that instance. You can call any of the methods that you
    have declared in your class as object methods, using the square bracket syntax
    I showed you in the previous section. However, only methods that are declared
    in the interface file of your class definition should be called from modules other
    than the class itself. Although it is technically possible to call methods that
    are not declared in the interface file, the compiler will issue a warning when
    you compile your code. Additionally, the compiler will be unable to determine
    the types of arguments and return values that the method requires, and thus it
    may not be able to catch errors that it would normally be able to catch.


    In some cases, you may want to create methods in your class which are only for
    internal use to your class. Meaning, you don''t want to expose their functionality
    to outside classes. In other languages such as C++ or Java, you might think of
    these methods as "private" methods. Objective-C has no syntax for declaring private
    methods, but if you do not expose the method in your interface file, then it is
    considered bad form by other classes to call those methods. Part of this is for
    the reasons that I mentioned in the previous paragraph, and part of it is because
    of social norms. You don''t have to expose methods that you use strictly in your
    class to users of your class. You can declare methods in your implementation file
    alone, and they will be available for use in your implementation file. The only
    important thing to keep in mind when doing so is that the compiler still needs
    to know about your method signature before you use it. Therefore, methods that
    you use only in your implementation file, that you don''t want to expose externally,
    should be placed above any methods that reference those methods. Listing 3.11
    shows an example of what I mean.'
