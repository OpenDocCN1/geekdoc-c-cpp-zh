- pgno: 112
  md: 'the state of an object. When you are tempted to have the act of changing the
    state of an object have an outside side effect, you should think carefully about
    the design decisions that have led you to that result.


    Behavior, on the other hand, can be thought of as your object taking action. Behavior
    can be used to update other objects, and thus have side effects, or it can be
    used to change the internal data of your object or trigger other operations on
    your object.


    Some schools of object-oriented design state that objects should only expose behavior
    to external entities. With the Objective-C 2.0 property notation, the designers
    of Objective-C decided that it is acceptable to expose the internal state of your
    objects as well. The property notation enables you to expose your object’s state
    while still providing accessors through which the access to that state goes. Properties,
    similarly, should be used only for accessing and manipulating your object’s state.
    To be clear, when writing properties, you should not create properties that have
    far-ranging external consequences. This is the kind of thing that should be limited
    to behaviors on your objects.


    To give you an example, consider a class that represents an engine. This engine
    class might expose a property for specifying its throttle. Your property to specify
    the throttle setting should only set the throttle value. If you want to additionally
    expose behavior that causes the engine to change its behavior based on the throttle
    value, then you should additionally expose a method (a behavior) called something
    like updateEngineSpeedFromThrottle. This method would take no parameters, and
    it would return a Boolean value indicating whether or not it was able to successfully
    update the engine’s speed based off of the throttle value.


    By separating the state and behavior of your class, you are preventing potential
    side effects and dependencies between your behaviors and your object attributes.


    # Using properties to declare object state


    For the purposes of this example, I’d like you to imagine that you’re writing
    an HR application. This application will be used to track employee benefits, including
    salary, insurance, and so on. Therefore, you need to create an Employee class
    that will be used to encapsulate this data.


    I’m sure that you can imagine the kinds of attributes and properties that an employee
    class would have to encapsulate. Typically, these would include things like the
    employee’s first name, their last name, their Social Security number, their employee
    number, their salary, and perhaps a reference to another employee who is their
    manager. All these items can be represented as properties of the employee class.


    Listing 3.12 shows an example of how you might create the employee class interface.
    It includes the listing of the data members that I just specified as well as properties
    for accessing each of those data members. As we explore each of these properties,
    it should help you to understand how properties work and which attributes properties
    can have.'
