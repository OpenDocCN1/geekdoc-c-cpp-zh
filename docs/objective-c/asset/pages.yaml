    # Figure 2.3


    Output of the dereferencing example code


    ![](img/aaee977487e7a3eefe7b1dd596e0f6fb_65_0.png)


    The interesting thing about pointers is that they can be manipulated just like
    regular variables. This means that you can increment them, you can decrement them,
    you can add to them, and you can subtract from them. You can do all these things,
    but what you’re really doing is changing the location in RAM where the pointer
    is pointing. Consequently, you can then dereference the pointer at the new location
    and access a different value than where it was originally pointing.


    Most of this discussion of pointers is relatively advanced subject matter. In
    day-to-day Objective-C, you typically don’t have the need to dereference many
    pointers. (There are a couple exceptions to this rule, and I will point them out
    as we go through this book.) For a deeper understanding of low-level pointers,
    I suggest picking up a good book on the C programming language.


    Typical Objective-C use of pointers is primarily limited to the declaration of
    objects. Objects in Objective-C are in fact pointers. Fortunately, for the most
    part, even though they are pointers, you rarely have to think of them in that
    way. The most important thing that you do need to remember is that anytime you
    are declaring an object, it needs to be declared as a pointer. For example, look
    at Listing 2.20.'
