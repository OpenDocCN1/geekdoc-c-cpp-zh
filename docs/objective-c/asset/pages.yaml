  md: "declared. This is in contrast to the normal behavior of a global variable.\
    \ Normal global variables are in scope anywhere in your program.\n\nThe static\
    \ keyword is known as a storage modifier. There are several of these types of\
    \ modifiers available in Objective-C. There is the register modifier, which can\
    \ be used to provide a hint to the compiler that the data being stored will be\
    \ accessed often and so could benefit from being stored in a register on the CPU.\
    \ This keyword is rarely used. Another, more commonly used, keyword is the extern\
    \ keyword. This modifier indicates that a variable or function declaration is\
    \ referencing an actual variable or function that is defined or allocated in another\
    \ compilation unit in your application. You'll see the extern keyword in use later\
    \ in this chapter when I talk about functions.\n\nThe const keyword similarly\
    \ modifies the memory behavior of the variable being declared, but in the case\
    \ of const, the variable is made to be read-only. This means that once the variable\
    \ is initialized, its contents cannot be changed. This is useful in cases where\
    \ you are declaring variables that should never be modified, such as constants.\
    \ By declaring such variables to be const, the compiler will enforce that behavior.\
    \ If you accidentally later attempt to modify one of these variables, this would\
    \ be a bug, and the compiler would generate an error. Listing 2.8 shows how the\
    \ const keyword can be used to avoid overwriting a constant.\n\n# Listing 2.8\n\
    \n# Using the const keyword\n\n```\nint main(int argc, char *argv)\n{\n    const\
    \ NSString *foo = @\"MY_CONSTANT\";\n\n    // do things here....\n\n    foo =\
    \ @\"SOME_OTHER_VALUE\"; // this will generate a compiler error.\n\n    if([foo\
    \ isEqualToString:@\"MY_CONSTANT\"])\n    {\n        // take action here...\n\
    \    }\n}\n```\n\n# Understanding structures\n\nStructures, or structs for short,\
    \ are types that you yourself define, which can contain multiple subvariables\
    \ within them. For example, if you wanted to declare a variable which grouped\
    \ x and y coordinates together to represent a point, you might declare that variable\
    \ using a struct. You do this using the struct keyword."
