- pgno: 320
  md: 'As you can see, `NSData` makes a very convenient low-level interface for accessing
    raw data. It also provides a convenient wrapper for storing that data inside collection
    classes as well, just like with `NSNumber` and `NSValue`.


    # Summary


    The purpose of this chapter was to introduce you to a few classes that make working
    with non-standard Objective-C data easier. They are particularly convenient when
    working with collections, which as you saw in Chapter 13 work only with Objective-C
    objects. These classes provide a very simple wrapper for that low level data so
    that you can then use them in collection classes and leverage the object-oriented
    capabilities of Objective-C with them. We live in a world filled with edge conditions
    and legacy data. Objective-C provides one of the cleanest, most integrated interfaces
    for that legacy data of any language out there. Its C language roots make it especially
    well suited to this task.'
