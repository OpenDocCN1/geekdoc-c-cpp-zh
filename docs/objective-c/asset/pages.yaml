- pgno: 187
  md: 'As I discuss earlier, you can traverse relationships between objects and access
    attributes on sub objects by using a key path. A key path is the key in which
    the relationships between different objects are spanned by using dots, as in the
    example above @"someMember.someAttributeOnMember". The key path accesses the someMember
    attribute on the foo object, finds the someAttributeOnMember attribute on whatever
    class someMember is, and it returns the value stored there. A variety of syntactical
    sugar has been provided in the specification of these key paths. In addition to
    being able to traverse these relationships, you can even access functions that
    operate on collections of objects, such as their count, and so on. For example,
    Listing 6.6 shows some of the built-in functions that you can use as part of these
    key paths.


    # Listing 6.6


    # Using functions inside key paths.


    ```

    [anArrayOfProducts valueForKeyPath:@"@avg.price"];

    [anArrayOfProducts valueForKeyPath:@"@sum.cost"];

    [store valueForKeyPath:@"products.@count"];

    ```


    Functions operate only on arrays and sets of objects. In the example, the first
    two lines are accessing product objects. Those products have attributes, such
    as price and cost. The functions given take the values specified for the attributes
    on each object in the array and then perform the specified function on those values.
    In other words, the first item iterates over each of the items in the array of
    products, collects the price from each of those products, and then averages them.


    The syntax for using these functions consists of prefixing the name of the function
    with the @ sign, then the name of the function, a "." and then the attribute on
    which to operate. The one exception to the requirement for the attribute on which
    to operate is the "@count" function, which simply returns the count of items in
    the collection.


    Table 6.1 shows a list of these functions.


    | Function | Purpose |

    |---|---|

    | @avg | Returns the average of all elements of the array or set. |

    | @count | Returns the count of elements in the array or set. |

    | @max | Returns the max value of all of the elements in the array or set. |

    | @min | Returns the minute value of all of the elements in the array or set.
    |

    | @sum | Returns a sum of all of the values of all of the elements in the array
    or set. |'
