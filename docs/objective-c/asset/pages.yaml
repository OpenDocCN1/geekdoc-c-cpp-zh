  img_proc: true
- pgno: 328
  md: 'To handle all of the complications in formatting dates, Foundation provides
    you with the NSDateFormatter class. This class allows you to specify the type
    of behavior you require and then converts the given NSDate object into a string
    representation of that date matching the behavior you requested. For example,
    to display a date using the short, numeric-only style, such as 09/20/10, you would
    use the NSDateFormatterShortStyle, as shown in Listing 15.9.


    # Listing 15.9


    # Formatting the date for short numerical format


    ```

    NSDate *date = [NSDate date];

    NSDateFormatter *f = [[NSDateFormatter alloc] init];

    [f setDateStyle:NSDateFormatterShortStyle];

    NSString *dateStr = [f stringFromDate:date]; // yields MM/DD/YY

    ```


    This goes both ways, in that you can also use an NSDateFormatter to convert a
    natural language string representing a given date to an actual NSDate object.
    This example is shown in Listing 15.10.


    # Listing 15.10


    # Converting a natural language string into an NSDate object


    ```

    NSDateFormatter *f = [[NSDateFormatter alloc] init];

    [f setDateStyle:NSDateFormatterShortStyle];

    NSDate *date = [f dateFromString:@"02/25/10"];

    ```


    Constructing an NSDateFormatter for virtually any date format that you need to
    work with is impossible, but typically you will use one of the standard sets of
    formatters that are provided by the system.


    # Summary


    Working with dates is a complex subject filled with details that can trap the
    unwary developer. Over the years, Apple and others have put a lot of thought and
    care into the NSDate and NSCalendar classes to make dates less of a problem for
    developers. You should avoid manipulating dates manually, and instead use these
    classes. Doing so saves time.'
