- pgno: 218
  md: "# Listing 7.3\n\n# A class implementing the NetworkClient protocol\n\n```\n\
    @class BusinessLogic : NSObject <NetworkClient>\n{\n    // member variables\n\
    \    NSString *someMemberVariable;\n}\n- (id)init;\n@end\n```\n\nClasses can implement\
    \ more than one protocol simultaneously. When doing this, you simply list the\
    \ different protocols inside the angle brackets separated by commas, as shown\
    \ in Listing 7.4.\n\n# Listing 7.4\n\n# A class implementing multiple protocols\n\
    \n```\n@class BusinessLogic : NSObject <NetworkClient, DiskClient>\n{\n    //\
    \ member variables\n    NSString *someMemberVariable;\n}\n- (id)init;\n@end\n\
    ```\n\nIn this case, the BusinessLogic is being said to implement both the NetworkClient\
    \ and DiskClient protocols.\n\nThough you must import the header file for the\
    \ protocol declaration, you do not need to declare the protocol methods in your\
    \ interface as well. Simply declaring that you implement the protocol is enough\
    \ information to tell the compiler what methods to expect to find in your implementation.\n\
    \n# NOTE\n\nCategories, which are described in Chapter 8, can also declare that\
    \ they implement a protocol, just like classes."
