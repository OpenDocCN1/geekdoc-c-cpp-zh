  md: "# Listing 1.5\n\n# Correct Code\n\n```\n```objective-c\n#import <Foundation/Foundation.h>\n\
    \nint main (int argc, const char * argv[])\n{\n    NSAutoreleasePool * pool =\
    \ [[NSAutoreleasePool alloc] init];\n    NSDate *date = [[NSDate alloc] init];\n\
    \    NSLog(@\"The time is: %@\", date);\n    [date release];\n    [pool drain];\n\
    \    return 0;\n}\n```\n```\n\nIf you recompile the app, you see that the Clang\
    \ Static Analyzer no longer flags the errors.\n\n# Understanding the Objective-C\
    \ Runtime\n\nThe first and most basic idea to understand about Objective-C is\
    \ that Objective-C is a compiled language with a dynamic runtime. What this means\
    \ is that the language is compiled using a compiler, enabling static, compile\
    \ time type checking, but it is also linked with a runtime, which enables dynamic\
    \ dispatch of methods. This dynamic runtime gives you the ability to do many things\
    \ that are only found in scripting languages such as “duck typing” and introspection\
    \ of objects.\n\nDuck typing refers to a type of language type safety where it\
    \ is assumed that if an object “looks like a duck, and quacks like a duck, it\
    \ must be a duck.” This is as opposed to static typing, where an object must be\
    \ the type that it is declared to be in order for the language to resolve methods\
    \ on it. There are advantages and disadvantages to both techniques, but in the\
    \ case of Objective-C, duck typing enables many of the cool features in the language."
