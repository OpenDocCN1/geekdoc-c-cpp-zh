  md: 'If, however, you forget to do so, or if you add another target and need to
    include an existing implementation file in that target as well, then it’s important
    for you to also know how to manually link an existing implementation file with
    your current target.


    To do so, simply select the implementation file that you want to include in your
    current target, click on the Detail tab above the editor, and ensure that the
    check box under the bull’s-eye column is selected, as shown in Figure 2.7.


    Again, notice the bull’s-eye check box, which is unchecked for our “NewFile.m”
