  md: 'If necessary you can add multiple execution blocks to a single NSBlockOperation
    by using the method -addExecutionBlock: . The operation will execute each block
    in sequence and will not be considered complete until all blocks have been executed.


    # CAUTION


    Some calls that take blocks as parameters will automatically execute the block
    in a background thread. This is not always documented. Therefore, you should always
    assume that any block you pass to an API you didn’t write will be executed in
    another thread and should be written with thread safety in mind. This includes
    being careful not to mutate objects outside the block that you may have access
    to.


    # Summary


    All of the thread tools I have shown you in this chapter give you tremendous power
    when it comes to building applications that take advantage of multi-processor
    and multi-core machines. As always, with great power comes great responsibility,
    and you have to make sure you architect your applications appropriately when using
    these tools.


    When possible, if you have the choice, I encourage you to use single-threaded
    designs in your code rather than introducing threads. Use threads only when it
    is absolutely appropriate for your problem domain.


    When you do use threads, use the highest level of abstraction that will accomplish
    your goals, and, as always, be sure to use appropriate thread locking and synchronization
    to prevent multiple threads from stomping on each other in memory. This chapter
    has provided you with all the tools you need to write high performance multi-threaded
    applications in Objective-C.'
