    Note that the directory Contents/MacOS contains the Xcode executable. This executable
    is the same as one that you would produce if you were making a command line application.
    The difference here is that it is packaged inside of an application bundle and
    contains code to load the resources from that bundle. Some other interesting directories
    inside this application include the PlugIns directory, which has bundles inside
    of it as well. The Spotlight directory also contains bundles in the form of the
    SourceCode.mdimporter and uuid.mdimporter directories. The Foundation framework,
    which we will visit in Part II of this book, includes methods that enable you
    to read application bundles, and it allows access to these sorts of embedded bundles.


    The important thing for you to know at this time is that when you create a graphical
    application for Mac OS X, iPhone, or iPad, Xcode creates an application bundle
    for your application. In the future, if you have the need to include compartmentalized
    groupings of resources within your application, you may want to create an application
    bundle yourself. Xcode also gives you the ability to do exactly that. For now,
    however, you don''t need to worry about that.


    # Working with build settings


    There are two locations in Xcode where build settings for your projects are configured.
    The first and primary location is the project information window, which you access
    by choosing Project ▷ Edit Project Settings. In this section, I cover these windows
    in detail because the information is useful and instructional. Because of where
    this is falling within the book, you may not understand many of the things that
    I''m going to talk about. I suggest that you skim through this section to begin
    with and then return to it later after you''ve worked through Chapter 2. The first
    panel of the Project Settings window, shown in Figure 1.9, shows the general settings
    for the project. Most of these you won''t need to change, with the exception of
    configuring your source code management by using the Configure Roots and SCM button.'
  merge: -1
  img_proc: true
- pgno: 38
  md: '# Figure 1.9


    # Project settings


    ![](img/aaee977487e7a3eefe7b1dd596e0f6fb_38_0.png)


    The Place Build Products In settings configure where in your project your executable
    will be placed after it is compiled. Again, this is another setting that you probably
    don''t need to change, but it''s useful to make a note of it at this time to be
    aware of where your executable will be placed. This directory is where you will
    find your executable.


    The setting beneath this setting, the Place Intermediate Build Files In setting,
    configures where the object files for your source code will be placed while your
    application is building.


    The next setting, Build Independent Targets in Parallel, affects how the compiler
    builds targets for different independent platforms, for example PPC and Intel.
    If it is enabled, the separate targets will be built in parallel. If not, they
    will be built serially — one after the other.


    One of the most frequently asked questions about Xcode, is “How do I change the
    organization name that''s placed automatically in my source code headers after
    my copyright notice?” The next setting, Organization Name, is for exactly that
    purpose. By configuring an organization name here, when you add new files to your
    project, the copyright listing will list the organization name that you put here
    as the owner of the copyright. Configure this to be the name of your company or
    your name.'
  merge: -1
  img_proc: true
- pgno: 39
  md: 'The next setting, Base SDK for All Configurations, configures the SDK that
    your application will be compiled and linked against by default. The SDK used
    defines the code completion and frameworks available for your project. For the
    purposes of this book and the projects that you will work on while going through
    it, you can configure the base SDK for your current Mac OS version. However, if
    you are doing development for other platforms, such as iPhone OS, and so on, you
    should configure this setting appropriately. You also should modify this setting
    in the cases where you may want to compile your application for an older version
    of Mac OS.


    # NOTE


    > The term SDK refers to Software Development Kit. An SDK is a collection of libraries,
    tools, documentation, and source files which is used to build applications for
    a specific platform. Xcode comes with SDKs for Mac OS X and iOS.


    The final setting on this panel relates to rebuilding the Code Sense Index. You
    may encounter some rare cases when the Code Sense Index can become corrupt. In
    these cases, you may want to choose to rebuild the Code Sense Index by using this
    button. These cases are rare, but if you ever need it, this is where you’ll need
    to do it.


    There are two primary locations where all build settings for your projects are
    configured. The first is at the project level, and the second is at an individual
    target level. If you can think of your project level settings as being the base
    settings for building your application, then the target level settings are the
    items that you want to change for specific targets. For example, you may have
    a project for a given application that has both a debug target and a release target.
    In this case, you would have all your project level settings the same for both
    targets, but you would vary a few things, such as whether you want to strip your
    executable and so forth on a target-by-target basis. Xcode supports this by having
    the project level settings and the target level settings as two separate windows.
    You can configure the project level settings, which cascade down into your targets
    unless you make a change on a particular target’s settings. When you make a change
    to the settings for a particular target, this change overrides the settings from
    the project level. Figure 1.10 shows an example of how this works.


    In this example, you are looking at both the project level settings and the target
    level settings. The example application being shown has configured two different
    targets that share code but build different executables. As you can see, the items
    that are different between the project versus the target are shown in bold on
    the target-level settings. If you choose to delete that setting, then the bold
    goes away, and the default value, which it gets from the project level settings,
    take its place.


    The drop-down list at the top of the screen allows you to choose what configuration
    you are editing, for example, whether you are working with a debug build versus
    a release build, as well as to filter the list for specific settings. The configuration
    options shown are set by using the Configurations tab at the project level. Figure
    1.11 shows a typical project in which a debug and release build are configured.


    You can think of the configurations as being different builds of the same target.
    Besides debug and release, another typical example might be a case where you have
    different architectures that you want to build for, for example PowerPC versus
    Intel.'
  merge: -1
  img_proc: true
