- pgno: 268
  md: "```\n}\n@catch (NSException *e)\n{\n    // ...\n}\n@finally\n{\n    [wrapper\
    \ release];\n    [pool drain];\n}\nreturn retCode;\n}\n```\n\nWhen catching exceptions\
    \ in this manner, you should list the exceptions in order from most specific to\
    \ least specific, because the runtime will execute the first catch block match\
    \ that it finds.\n\nBecause of the ability for an exception to interrupt program\
    \ flow at any time, it can be difficult for your application to do appropriate\
    \ cleanup of allocated memory and resources when an exception occurs. Fortunately,\
    \ in addition to the try/catch constructs, there is an additional feature built\
    \ into Objective-C exception handling, the @finally directive.\n\nThe @finally\
    \ block works just like a @catch block except that it is always executed regardless\
    \ of whether or not an exception occurs. This makes it the perfect place to clean\
    \ up memory or free other resources that are allocated as part of the @try block.\
    \ You can always rely on your @finally block being executed no matter what happens\
    \ inside your try or catch blocks.\n\nThe advantages of this kind of error handling\
    \ is that you can group your code and let it just run until something bad happens,\
    \ and then handle that error condition. Additionally, errors can be very descriptive.\
    \ You can put all sorts of things into the NSException object, and be as verbose\
    \ as needed.\n\nTry/catch/finally blocks can even be nested within each other\
    \ in cases where you have complex processing requirements with complex error conditions.\
    \ This allows you to have multiple levels of exception handling if needed.\n\n\
    # NOTE\n\nThe use of exceptions for error handling in Objective-C is relatively\
    \ rare compared to some other languages that use exceptions much more extensively.\
    \ If you’re coming from a language such as Java and are tempted to use exceptions\
    \ yourself as extensively, I urge you to think twice, and instead, look at the\
    \ next error handling mechanism that I’m going to visit, NSError."
