- pgno: 216
  md: 'When you reference objects in your code, which are expected to implement a
    given protocol, there is a special syntax that you can use in the type declaration
    of that object to show that, although you may not know what the actual class of
    the object is, you expect it to implement a given protocol. If the protocol is
    a formal protocol, any object that is stored in that variable is checked at compile
    time to determine if it implements all of the required methods for that protocol.
    If it does not, a warning is raised.


    Protocols can have both required and optional methods. In cases where you have
    optional methods, an object that implements the protocol may not necessarily implement
    one of its optional methods. In this situation, you are expected to check to verify
    that the object in question is implementing the optional method before you attempt
    to call it. If you attempt to call an optional method and the object does not
    implement that method, then you will get an exception.


    # Declaring a protocol


    Declaring the protocol follows many of the same syntactical standards that you''ve
    already come to recognize. Superficially, it most resembles declaring a class.
    You begin a protocol declaration by using the keyword @protocol, followed by the
    name of the protocol you are declaring. Protocols do not by default inherit from
    each other or from classes, but if you want to inherit from another protocol you
    can, optionally, by providing the name of protocols that you inherit from enclosed
    in angle brackets <> after the name of the protocol you are declaring. When you
    do this, classes implementing your protocol must implement not only the protocol
    methods that you declare but also the protocol methods of any protocols that you
    inherit from. After the @protocol declaration, you then declare any methods that
    are required for your protocol. Declare these just as if you were declaring methods
    on a class.


    Inside the protocol definition itself, where you are declaring your protocol methods,
    two key words can be used. The first is the @required key word. This keyword dictates
    that all of the following methods are required methods for implementations of
    this protocol. This is the default behavior of a formal protocol, so if you do
    not specify the @required key word, then all methods declared in the protocol
    default to required status.


    The second keyword that is usable within the @protocol declaration is the @optional
    keyword. This is used to indicate methods that are optional for the implementing
    classes to implement. Classes that implement this protocol can choose not to implement
    any methods declared after the @optional keyword.


    At the end of the protocol declaration, just like with the class, you end the
    protocol declaration with the @end keyword. An example protocol declaration for
    our NetworkClient class that we discussed previously is shown in Listing 7.1'
  merge: -1
  img_proc: true
- pgno: 217
  md: '# Listing 7.1


    # Example protocol declaration


    ```

    @protocol NetworkClient

    -(void)networkConnector:(NetworkConnector *)inNetConnector

    gotData:(NSData *)inData;


    optional

    -(void)networkConnectorDisconnected:(NetworkConnector *)inNetConnector;

    @end

    ```


    # NOTE


    This protocol shows the delegate pattern at work, which is why the first parameter
    is the object sending the message. I go over more about that in Chapter 17.


    Again, if you wanted to derive your protocol from another preexisting protocol,
    for example, to extend that preexisting protocol, you can do that by having your
    protocol extend or inherit from that preexisting protocol, as shown in Listing
    7.2.


    # Listing 7.2


    # NetworkClient extending the IOClient protocol


    ```

    @protocol NetworkClient <IOClient>

    -(void)networkConnector:(NetworkConnector *)inNetConnector

    gotData:(NSData *)inData;


    optional

    -(void)networkConnectorDisconnected:(NetworkConnector *)inNetConnector;

    @end

    ```


    Protocols are incapable of having member variables. Therefore, there is no place
    in the protocol declaration to declare member variables. Do not confuse this with
    the idea that a protocol can''t access member variables, it certainly can, but
    that''s a detail that is specific to the implementation of the protocol and not
    part of declaring the protocol itself. When you implement the methods of the protocol
    on whatever class has adopted it, you can certainly use any member variables declared
    in the header of that particular class.


    # Declaring that a class implements a protocol


    To declare that a class implements a specific protocol you simply place the protocol
    name inside angle brackets after the superclass in the class declaration. For
    example, Listing 7.3 shows an example class implementing the protocol from the
    previous section.'
  merge: -1
