- pgno: 219
  md: '# Declaring an object that must implement a protocol


    When declaring an instance variable that is expected to implement a given protocol,
    typically you use the id datatype so that any object can be stored in the variable.
    If you want to have the compiler verify that the required protocol methods are
    in fact implemented on whatever object you are actually storing in the variable,
    then you must also tell this to the compiler by specifying the protocol type information
    along with the datatype. To do this, in addition to the id datatype, you also
    specify the protocol you expect the object to adhere to after the id keyword,
    in angle brackets, as shown in Listing 7.5.


    Listing 7.5


    # Declaring a variable which implements a specific protocol


    ```

    id<NetworkClient> *delegate;

    ```


    In this case, the delegate object is being defined as adopting the NetworkClient
    protocol, and thus will be expected, by the compiler, to implement the appropriate
    required methods from that protocol.


    Anywhere you are expected to declare a variable datatype, you can use this syntax.
    This includes method declarations, variable declarations, return types, and so
    on.


    # NOTE


    In those rare cases where you have not declared that your variable must implement
    a specific protocol, but you do require it, you can force the compiler to assume
    that a given object does implement a given protocol by typecasting it. To typecast
    a given variable to a given protocol, you actually typecast it to (id<SomeProtocol>).
    This isn’t required if you specify your protocols as part of your variable declarations,
    as is generally recommended.


    # Exploring formal and informal protocols


    I’ve mentioned it briefly before, but it bears further discussion here before
    we deal with how you handle optional methods.


    There are, in fact, two different kinds of protocols, formal and informal. Informal
    protocols are the older style of protocols that are still used in part of cocoa
    and Objective-C. Informal protocols do not require a formal protocol declaration
    as I’ve shown you so far in this chapter. Informal protocols are typically declared
    as categories on the NSObject class. I discuss categories in the next chapter,
    so I won’t go into a great amount of detail here.


    Because of the greater type safety that formal protocols provide and because of
    the fact that formal protocols have the @optional keyword that enables you to
    selectively mark individual methods as optional, generally speaking, formal protocols
    are the preferred way to create new protocols in your code.'
  merge: -1
  img_proc: true
- pgno: 220
  md: "Typically, the only place that you are likely to run into informal protocols\
    \ today is when you are working with older frameworks, such as portions of the\
    \ Cocoa frameworks themselves.\n\nYou can recognize these circumstances, because\
    \ rather than the documentation pointing you to a formal document declaring and\
    \ documenting the interface that you are expected to implement, typically you\
    \ will see these protocol methods documented as part of the class that you are\
    \ actually using. For example, the Cocoa class NSURLConnection uses an informal\
    \ protocol for its delegate methods. If you look at the documentation for that\
    \ class, you’ll see that the delegate methods themselves are actually documented\
    \ in the documentation on the NSURLConnection class itself. They are marked “delegate.”\
    \ Contrast this with the Cocoa Touch class, SKPaymentQueue, which was recently\
    \ added for in-app purchase support iPhone. It separates its delegate methods\
    \ into a formal protocol by using the SKPaymentTransactionObserver protocol.\n\
    \nWhen needing to implement an informal protocol in one of your classes, you do\
    \ not need to declare that your class implements the protocol in its declaration\
    \ as you would normally with a formal protocol. Instead, you simply implement\
    \ the methods that you choose to implement, and if they are available, classes\
    \ that need to use your object will call them.\n\nWhen working with informal protocols,\
    \ all the methods in the protocol are optional, so you need to verify that the\
    \ object in question implements them before you call them. I explain how to do\
    \ this in the next section.\n\n# Determining if an object implements optional\
    \ methods\n\nWithin your code, you can determine if a given class implements a\
    \ specific protocol by using the object method -conformsToProtocol: . The method,\
    \ which is called using the object in question, takes one parameter, which is\
    \ expected to be a protocol object. To get the protocol object for a specific\
    \ protocol, you use the built-in Objective-C directive @protocol ( ). This is\
    \ different from the @protocol directive that you used in declaring your protocol,\
    \ in that it takes a parameter inside parentheses, which is the name of the protocol\
    \ that you want to get the object for.\n\nSo, for example, to determine if a given\
    \ object adheres to our NetworkClient protocol, you would do something like Listing\
    \ 7.6.\n\n# Determining if an object adheres to the NetworkClient protocol at\
    \ runtime.\n\n```\n- (void)receivedData:(NSData *)inData;\n{\n\tif (![delegate\
    \ conformsToProtocol:@protocol(NetworkClient)])\n\t\t[delegate networkConnector:self\
    \ gotData:inData];\n\t// else do something else...\n}\n```"
  merge: -1
  img_proc: true
- pgno: 221
  md: "Typically, you would only need to do this in cases where you did not specify\
    \ the type of the protocol as part of the datatype for the variable in question.\
    \ If you had specified the protocol is part of the datatype for the variable then\
    \ the compiler would have flagged this variable for you if it did not implement\
    \ the protocol required.\n\n# NOTE\n\nThe -conformsToProtocol: method shown in\
    \ Listing 7.6 only works with formal protocols. If you're using an informal protocol,\
    \ use the NSObject method -respondsToSelector: as shown in Listing 7.7 instead.\n\
    \nEven when you are certain that a given object implements a given protocol, there\
    \ is still the possibility that the object may not implement any of the optional\
    \ methods of the protocol.\n\nRemember, if an object does not implement an optional\
    \ method and you call that method on that object, then your application will crash.\
    \ Therefore, you need a way to determine if that object actually implements an\
    \ optional method before you attempt to call it.\n\nFortunately, NSObject, which\
    \ all objects inherit from, has a method which does exactly this. This method\
    \ is -respondsToSelector: and it takes as a parameter a selector object.\n\nJust\
    \ like with the protocol object, a special directive can be used to convert a\
    \ method signature into a selector object. That directive is the @selector() directive.\
    \ Its use, along with the -respondsToSelector: method, is shown in Listing 7.7.\n\
    \n# Listing 7.7\n\n# Testing to determine if an object implements an optional\
    \ method\n\n```\n-(void)disconnected;\n{\n    if ([delegate respondsToSelector:@selector(networkConnectorDisconnected:)])\n\
    \        [delegate networkConnectorDisconnected:self];\n\n    // else implement\
    \ some default behavior...\n}\n```\n\nIn this example, you first check to see\
    \ if the object which implements the protocol in fact implements one of the optional\
    \ methods using the call -respondsToSelector:. If it does, then it goes ahead\
    \ and calls that method. If it does not, you can choose to either do nothing,\
    \ or to implement some kind of default behavior instead."
