    for your class or call the superclass’ designated initializer.


    To call the designated initializer for your current class, you call it by using
    the special variable, self, like so: [self init]. To call the superclass’s designated
    initializer, you use the special variable super, and call the superclass’s designated
    initializer by calling [super init]. Both'
