  md: 'Objective-C differs from other languages in its implementation of these particular
    patterns. My goal here is not a full catalog of patterns, but instead a sampling
    of patterns that are particularly illustrative, and which will help you approach
    other design pattern books more comfortably as an Objective-C programmer.


    # Describing Design Patterns in Objective-C


    Most design pattern books follow a specific format in the description of their
    patterns. Typically, these books begin by stating a particular type of problem.
    They then follow the problem statement with a description of the solution, including
    code for the solution, and then finally a discussion about the solution. For the
    purposes of the design patterns I am going to discuss here I intend to follow
    this pattern.


    # Using Singletons


    # Problem


    You need to ensure that there is one and only one instance of a particular class
    in your application and provide a global point of access to it. This may be due
    to design constraints or for the purposes of controlling access to a finite resource.


    # Solution


    The solution to this problem is called a singleton. A singleton is a class that
    ensures that you cannot create more than one instance of it. Normally, this is
    accomplished by creating a single instance of that class the first time the constructor
    for your class is called. Subsequent calls to the constructor check for the existence
    of the global instance, and if it exists, returns a reference to the global instance
    rather than creating a new one.


    Implementing a singleton in Objective-C consists of several steps. First, you
    have to create the global instance. The global instance is typically stored in
    a global variable. One important aspect of this global instance is that you should
    be sure to set the instance to nil. You will later be checking whether this variable
    is set to nil when your initializer is called. Listing 17.1 shows a typical declaration
    of a global singleton instance. Typically, this declaration is put into the implementation
    file for the class that you are turning into a singleton.


    Listing 17.1


    # The global instance definition


    ```

    static MyClass *instance = nil;

    ```'
