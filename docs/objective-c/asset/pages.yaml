- pgno: 116
  md: "# Using the nonatomic attribute\n\nOne of the important attributes that you\
    \ can specify as part of your property declaration is that of your property’s\
    \ accessor’s atomicity. The atomicity of a property has to do with how it behaves\
    \ in a multithreaded environment. An accessor that is atomic ensures that its\
    \ value is completely set or retrieved in the thread that is accessing it. Therefore,\
    \ an atomic accessor is considered to be thread safe. Essentially, the code generated\
    \ by an atomic accessor look something like the code in Listing 3.14.\n\n# Listing\
    \ 3.14\n\n# An atomic accessor\n\n```\n- (NSString *)firstName\n{\n    [threadLock\
    \ lock];\n    NSString *result = [[firstName retain] autorelease];\n    [threadLock\
    \ unlock];\n    return result;\n}\n```\n\nAccessors that are not atomic are not\
    \ considered to be thread safe. A nonatomic accessor generated by the @synthesize\
    \ directive might look like Listing 3.15.\n\n# Listing 3.15\n\n# A nonatomic accessor\n\
    \n```\n- (NSString *)firstName\n{\n    return [[firstName retain] autorelease];\n\
    }\n```\n\nYou may choose to use nonatomic accessors in applications in which you\
    \ are certain there will only ever be one thread accessing your object.\n\nUsing\
    \ nonatomic accessors can result in a slight performance boost because of the\
    \ lack of necessity for the locking of the thread locks in atomic accessors."
  merge: -1
  img_proc: true
