- pgno: 249
  md: 'For the purposes of this book, I will focus primarily on the #define, #ifdef,
    and other more commonly used preprocessor directives. The directives #pragma,
    #warning, #include, and #error are better served by viewing the GCC documentation.


    # NOTE


    One very common use of the #pragma directive is in adding IDE directives to your
    code for use by the IDE in labels. Apple uses this extensively in its own templates.
    In many of their templates, you’ll see the directive: #pragma mark Something.
    This will cause the IDE to display “Something” in the method name listing drop
    down list. Additionally, the special directive #pragma mark – causes a horizontal
    rule to be placed in the list.


    # Defining constants


    The first type of macro that I showed you in this chapter was used for the purposes
    of defining a constant that would then be reused in multiple places in your application.
    Indeed, this is perhaps one of the most common uses of macros. I myself use macros
    in this form for defining keys for accessing NSUserDefaults just like they showed
    in the previous example.


    To define a constant, you use the preprocessor directive #define followed by the
    name of the constant you are defining the value for. After the name, separated
    by a space, you then provide the value you want the preprocessor to expand your
    macro to in your source code. The preprocessor expands the macro by using all
    of the remaining text in your line until it encounters the end of the line.


    In cases where you want to make a macro such as this and spread its definition
    out over multiple lines, you can do this by entering a backslash and then pressing
    enter. This causes the compiler to consider the next line to be part of the current
    line for the purposes of evaluating this macro.


    Listing 9.7 shows an example of several different constants being defined using
    the #define preprocessor directive.


    # Listing 9.7


    # Defining constants with #define


    ```

    #define FOO 1

    #define BAR @"this is bar"

    #define BAZ @"THIS IS A VERY LONG STRING \

    AND IT CONTINUES DOWN HERE \

    AND HERE."

    #define BOZ BAR

    ```'
  merge: -1
  img_proc: true
- pgno: 250
  md: "An unspoken rule is to always name your macros using all capital letters. Doing\
    \ this helps to distinguish macros in your source code from normal statements\
    \ and makes your code easier to read. In the previous section, I mentioned that\
    \ you should not use the double underscores for your own macro names. Additionally,\
    \ you should not use underscores at the beginning or end of your macro names either\
    \ because this is reserved for the compiler. It's perfectly safe to use underscores\
    \ inside your macro names, and in fact, this is again another unspoken standard:\
    \ separating multiple words in your macro names by using underscores instead of\
    \ spaces since spaces are not legal anywhere in a macro name. Macro names must\
    \ also begin with an alphabetic letter. Numbers are not allowed. You are free\
    \ to use numbers after the first letter of the macro name but they cannot be used\
    \ for the first letter.\n\nAs you found out in the previous section, macros can\
    \ refer to other macros within their definition. In these cases, your macro will\
    \ first be expanded to whatever you have defined, and then any macros inside of\
    \ your macro definition will be expanded in place from there. For example, the\
    \ macro BOZ above will ultimately expand to BAR, and then BAR will be expanded\
    \ to @\"this is bar\".\n\nThe exception to this rule is that macros are not recursive.\
    \ Meaning, you cannot refer to the macro that you are defining in its definition.\
    \ For example, the macro #define FOO FOO won't work.\n\n# Passing constants by\
    \ compilation\n\nI mention earlier in this chapter how you can define macros as\
    \ part of your build settings. Listing 9.8 shows an example of an application\
    \ that needs to be compiled to connect to a test server when it is being debugged\
    \ and compiled to connect to the production server when it is not being debugged.\n\
    \nListing 9.8\n\n# Conditional compilation based on build settings\n\n```\n#import\
    \ <Foundation/Foundation.h>\n\nint main (int argc, const char * argv[])\n{\n \
    \   NSAutoreleasePool * pool = [[NSAutoreleasePool alloc] init];\n\n    NetworkConnection\
    \ *conn = [[NetworkConnection alloc] init];\n#ifdef DEBUGGING\n    [conn connectToServer:@\"\
    http://develop.nowhere.com\"];\n#else\n    [conn connectToServer:@\"http://production.nowhere.com\"\
    ];\n```"
  merge: -1
  img_proc: true
- pgno: 251
  md: "# Listing 9.8 (continued)\n\n```\n#endif\n\n    [pool drain];\n    return 0;\n\
    }\n```\n\nNotice that the DEBUGGING macro is not actually being defined in this\
    \ source file. In this particular case, I’m relying on the build settings to pass\
    \ in that value when I do a debug build. If that value has been defined, then\
    \ the application connects to the development server. If it is not, then it connects\
    \ to the production server.\n\nFigure 9.1 shows the build settings window and\
    \ the parameter that you set in order to define values as part of your build settings.\n\
    \nThe build setting that you use to define these preprocessor macros is the Preprocessor\
    \ Macros setting. This particular setting takes a list of macro names and values\
    \ separated by =. So, in other words, to define the preprocessor macro DEBUGGING,\
    \ you would set this build setting to DEBUGGING=1. The given value here, 1, is\
    \ more or less just setting it to any value (even 0 would be OK) so that the #ifdef\
    \ statement returns true. If we used a #if with an expression, like #if DEBUGGING\
    \ > 10 then we could have variable levels of debugging based on the compilation\
    \ flag.\n\nBy setting this build setting on the debug build, the DEBUGGING macro\
    \ will be set when the source code is compiled. When you switch to the Release\
    \ build, which does not have this setting, then the normal, production code will\
    \ be compiled and included.\n\n# Using variables in macros\n\nAlthough the syntactical\
    \ capabilities of macros is much more primitive, macros are capable of taking\
    \ parameters just like if when working with functions or methods. This enables\
    \ you to create complex macros that actually do creative things with the contextual\
    \ information available when the macro is being expanded.\n\nFor example, if you\
    \ wanted to create a MAX macro to return the greater value of two parameters,\
    \ you might create a macro such as Listing 9.9.\n\n# Listing 9.9\n\n# A macro\
    \ for printing the value of a variable\n\n```\n#define MAX(X, Y): ((X) > (Y) ?\
    \ (X) : (Y))\n```"
