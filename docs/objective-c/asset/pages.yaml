  md: "If an exception is thrown, program flow is interrupted immediately, and it\
    \ jumps to the exception handlers that are designated by the @catch directive.\n\
    \nThe @catch directives allow you to catch exceptions of particular types. When\
    \ an exception occurs, the code jumps to the @catch directives and looks for the\
    \ closest match to the exception that has been thrown. It then begins executing\
    \ again the code inside of the catch block.\n\nIn this particular case, the catch\
    \ block is simply printing out the error message and then setting the applications\
    \ return code to an error status. By catching the generic NSException, as shown\
    \ in Listing 10.5, you are effectively catching all exceptions.\n\nYou could even\
    \ catch the id data type instead of NSException. This would enable you to catch\
    \ any object that’s thrown at all.\n\nIn cases like the earlier example where\
    \ different kinds of exceptions are thrown for different kinds of error conditions,\
    \ you would list separate catch blocks for each of the different kinds of exceptions\
    \ that you needed to handle. An example of this is shown in Listing 10.6.\n\n\
    # Listing 10.6\n\n# Catching different kinds of exceptions\n\n```\nint main (int\
    \ argc, const char * argv[])\n{\n    int retCode = 0;\n    @try\n    {\n     \
    \   NSAutoreleasePool * pool = [[NSAutoreleasePool alloc] init];\n\n        FileWrapper\
    \ *wrapper = [[FileWrapper alloc] init];\n        [wrapper openFileAtPath:@\"\
    ...\"];\n\n        // do stuff with the file here...\n    }\n    @catch (FilePermissionException\
    \ *e)\n    {\n        // ...\n    }\n    @catch (FileMissingException *e)\n  \
    \  {\n        // ...\n```"
