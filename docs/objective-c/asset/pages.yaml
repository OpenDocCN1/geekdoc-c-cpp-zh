- pgno: 178
  md: 'After your candidate array is created, you have to modify the start method.
    In this version, you take your isPrime: method, and instead of creating it as
    an object method on your PrimeFinder class, you actually create it as a block.


    You also have to create the filter method which will be called with your candidate
    array and your block and which will return your filtered array containing only
    numbers for which the block returns true. In the code listing above, this method
    is called -filterArray:withBlock:.


    The cool part of this particular code, is that you can pass any kind of block
    to this filter function that you want. It will iterate over the members of the
    array, and simply call the block for each one of those elements, passing the element
    as the parameter to the block. The block can do anything it wants. All it needs
    to do is return true if the element in question should be in the result array
    and return false if it should not. The ability to decouple this logic from the
    iteration of the array is very powerful and can be very useful in certain circumstances.


    # Using Grand Central Dispatch


    The final version of our PrimeFinder class utilizes GCD to actually run the prime
    number calculations in parallel. Again, I discuss GCD in much greater depth later.
    For now, simply understand that we are going to dispatch instances of our block
    on to the GCD global queue for each number that we want to test for primeness.


    In order to do this, we have to do a little bit of jockeying to make sure that
    our access to any variables that are shared among the different threads is safe.
    There are a couple of things that this impacts. First, you are going to store
    all of your results, that is, the prime numbers, into an array, called result.
    Because that array is going to be shared among all of your blocks, you’re going
    to declare it inside the scope of the start method itself. Recall that when the
    block is declared, it receives all of the scoped variables and state from the
    stack within which it is created. However, recall also that those variables are
    all read-only, that includes our result array. We don’t have to use the __block
    directive however, because though the result variable itself is read-only, the
    contents of result, through it’s pointer reference, are not. This is a subtle
    but important nuance to note.


    In addition to making the result array writable, we also have to ensure that no
    two blocks attempt to write to that array at the same time. We do this by using
    a simple thread safety mechanism built into Objective-C, the @synchronized key
    word.


    Finally, in order to actually dispatch your blocks onto GCD, you need to create
    a dispatch group, which allows you to put your blocks into a global queue that
    will be completely managed by Grand Central Dispatch. It will automatically spawn
    an appropriate number of threads for the number of cores and processors on the
    machine that you run it on, and then remove blocks from the queue one by one,
    sending them out onto these threads to do their work.


    Listing 5.18 shows how you need to modify your PrimeFinder implementation to do
    all this. Go ahead and modify your class to match it.'
