  md: "```\nNSString *someValue = @\"foobar\";\n[[NSUserDefaults standardUserDefaults]\
    \ setObject:someValue forKey:@\"MY_IMPORTANT_DATA\"];\n\n// do stuff...\n\nNSString\
    \ *theValue = [[NSUserDefaults standardUserDefaults] stringForKey:@\"MY_IMPORTANT_DATA\"\
    ];\n\n[pool drain];\nreturn 0;\n}\n```\n\nThe biggest problem with this code is\
    \ that I’m using a constant string for the key in this code, you open yourself\
    \ up to syntax errors that won’t be caught by the compiler. If you make a mistake\
    \ in typing the string, the compiler will not be able to tell that it was a mistake\
    \ and instead will allow it to go all the way to win your application is running.\
    \ This makes for bugs that are difficult to track down.\n\nIt would be nice if\
    \ you could create some kind of macro that the compiler will expand to your string\
    \ but which it can check for syntax errors when it goes to compile. This is exactly\
    \ the kind of thing for which macros are made. Listing 9.3 shows the same code,\
    \ written using a macro instead of the string.\n\n# Listing 9.3\n\n# Using a macro\n\
    \n```\n#import <Foundation/Foundation.h>\n\n#define THE_KEY @\"MY_IMPORTANT_DATA\"\
    \n\nint main (int argc, const char * argv[])\n{\n    NSAutoreleasePool * pool\
    \ = [[NSAutoreleasePool alloc] init];\n\n    NSString *someValue = @\"foobar\"\
    ;\n```"
