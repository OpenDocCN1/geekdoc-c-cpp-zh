    # Declaring objects


    I’ve now shown you how to declare classes, including their data, their methods,
    and so on, but all of this would be useless if you couldn’t declare instances
    of your classes and use them. So now, let’s take a look at how you declare an
    instance of your class in your code.


    Listing 3.10 shows an example of code where I’ve taken the class that we created
    in the previous section and now I want to use that class in my code to do something
    useful.


    Listing 3.10


    # Creating an instance of your class


    ```

    { // plain old initializer Foo *object; object = [[Foo alloc] init]; [object doSomethingWithParameter:arg];
    // all on one line Foo *object = [[Foo alloc] initWithArray:[NSMutableArray array]];
    [object doSomethingWithParameter:arg]; // using a class method factory Foo *object
    = [Foo fooWithArray:[NSMutableArray array]]; [object doSomethingWithParameter:arg];
    }

    ```


    As you can see, declaring an instance of your class is very straightforward. First,
    you use your class name, filed by the pointer operator (*). Then you place the
    name of the variable that will hold the instance of your class, in this case “object”.
    You can, if you choose, initialize the object variable immediately, on the same
    line, as its declaration. To do this, you simply use the equal operator to assign
    the initialized value to your object variable. In the example code above, I’ve
    shown it both ways, first not initializing the variable, and then initializing
    the variable all on one line. I’m introducing an important new syntax in this
    code. You’ve seen it before in other sections of this book, and now I’m going
    to explain exactly what it’s all about. The syntax I’m referring to here is the
    use of the square bracket operators ([]).'
