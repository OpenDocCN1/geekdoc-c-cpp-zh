- pgno: 183
  md: "# Listing 6.1 (continued)\n\n```\n@property (retain, nonatomic) NSArray * array;\n\
    @property (retain, nonatomic) NSString * stringOnBar;\n@end\n\n@interface Foo\
    \ : NSObject\n{\n    Bar *bar;\n    NSString *stringOnFoo;\n}\n@property (retain,\
    \ nonatomic) Bar * bar;\n@property (retain, nonatomic) NSString * stringOnFoo;\n\
    @end\n```\n\nGiven the two classes shown, as you can see, we have a class called\
    \ Foo. This class has a string attribute, as well as another attribute defining\
    \ a relationship between Foo and the class Bar. This relationship is defined by\
    \ virtue of the bar property on Foo.\n\nI've already shown you how by defining\
    \ properties for the attributes of a given class, Objective-C gives you setters\
    \ and getters for each of those properties. In addition to those standard setters\
    \ and getters, it also provides you a set of Key Value Coding accessors as well.\n\
    \nThe most commonly used of these key value coding accessors are the ones that\
    \ enable you to access the attributes of a given class directly. These are the\
    \ calls -valueForKey:, which allows you to read an attribute by specifying a parameter\
    \ representing the name of the attribute you wish to access as a string, set -setValueForKey:,\
    \ which allows you to set the value of a given attribute, also by specifying the\
    \ name of the attribute as a string.\n\nWhen working with more complicated relationships,\
    \ where you want to access an attribute of an attribute, you can specify a more\
    \ complex key path using dot notation. So, for example, if you have an object\
    \ with an attribute of type Bar called bar, which additionally has an attribute\
    \ called stringOnBar, you can use the method -valueForKeyPath:, specifying the\
    \ dot notation path to the attribute, \"bar.stringOnBar\". Additionally, there's\
    \ the -setValue:forKeyPath: method as well.\n\nAgain, looking at code may be the\
    \ easiest way to describe what I'm talking about. The Objective-C runtime automatically\
    \ generates for you code that enables you to read and write to the attributes\
    \ of those classes by using the calls that I just talked about, as shown in Listing\
    \ 6.2"
