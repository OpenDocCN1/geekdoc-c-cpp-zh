    \ run]; // ..\n        }\n    }\n\n    return 0;\n}\n```\n\n# Working with objects\
    \ in nib files\n\nAn uncommon but difficult to debug problem can occur when working\
    \ with objects in nib files that have no reference from an instantiated object\
    \ in your application. Again, the garbage collector searches for any objects which\
    \ have no references from global objects or objects on the current stack. In some\
    \ rare cases, you may create a nib file, which contains objects that don’t have\
    \ references to them, for example, view controllers with no external reference.\
    \ Under normal conditions, these objects are garbage collected. The solution to\
    \ this problem is to create an IBOutlet in the object that owns your nib, and\
    \ connect this outlet to the object in question. This provides a strong reference\
    \ to the object and prevents it from being garbage collected.\n\n# NOTE\n\nNib\
    \ files, or “NeXT Interface Builder” files are used in defining interfaces on\
    \ iOS and Mac OS. I don’t discuss them in this book other than here since it’s\
    \ specific to Cocoa and Cocoa Touch. For more information, see the Wiley books\
    \ Cocoa Developer Reference or Cocoa Touch for iPhone OS 3 Developer Reference."
