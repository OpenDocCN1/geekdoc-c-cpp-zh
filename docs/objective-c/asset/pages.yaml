    # Notifying objects of changes


    # Problem


    You need to notify multiple objects of changes in state.


    # Solution


    The Delegate pattern is an excellent choice in cases where you have a one-to-one
    relationship between the delegating object and the delegate. But what about circumstances
    where you need to notify multiple observers of your state changes? In these cases,
    instead of implementing a one-to-one relationship such as the Delegate pattern,
    you want to implement something like the Observer pattern.


    The Observer pattern defines a pattern wherein objects may register with another
    object as an observer of that object. Once an object has registered as an observer,
    then any events that the Observer is interested in will be sent to the Observer
    when they occur.


    The implementation of the Observer pattern in Objective-C is done using the NSNotificationCenter
    class. This class provides a global dispatch system for observers and events.
    Observers can register with the NSNotificationCenter to observe specific events
    in the system. Observable objects, when these events occur, can then post notifications
    to the NSNotificationCenter. When they do, any observers of those notifications
    will then be notified, and can take whatever action they deem appropriate.


    Implementing the Observer pattern by using the NSNotificationCenter consists of
    two parts.


