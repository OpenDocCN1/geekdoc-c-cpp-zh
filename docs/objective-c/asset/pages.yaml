- pgno: 199
  md: "# Listing 6.14\n\n# Adding an observer\n\n```\n```objc\n[obj addObserver:self\n\
    \        forKeyPath:@\"memberVariable\"\n           options:(NSKeyValueObservingOptionNew\
    \ |\n                    NSKeyValueObservingOptionOld)\n           context:NULL];\n\
    ```\n```\n\nThe Observer parameter is usually self, and is the object that receives\
    \ the notification when the observed value changes. The key path parameter specifies\
    \ the key path to the attribute for which you want to observe changes. The options\
    \ parameter specifies a set of flags that tell KVO how you want changes to be\
    \ sent to you. These values are or'd together using the '|' operator. The possible\
    \ values that can be passed here are shown in Table 6.2.\n\n| Value | Purpose\
    \ |\n|---|---|\n| `NSKeyValueObservingOptionNew` | Send the new value as part\
    \ of the change information. |\n| `NSKeyValueObservingOptionOld` | Send the old\
    \ value as part of the change information. |\n| `NSKeyValueObservingOptionInitial`\
    \ | Send an initial update as soon as the observer is registered. |\n| `NSKeyValueObservingOptionPrior`\
    \ | Send separate updates before and after the change is made rather than only\
    \ one update after the value has changed. |\n\nThe context parameter is a void\
    \ * parameter is passed unchanged through the KVO system and back to your object\
    \ when the change notification occurs. Essentially, as far as KVO is concerned,\
    \ this parameter is an opaque blob of data that is entirely implementation dependent.\
    \ Whatever you want to pass in here is passed through unchanged.\n\n![](img/aaee977487e7a3eefe7b1dd596e0f6fb_199_0.png)\n\
    \n# NOTE\n\nRemember when working with void * context parameters that there are\
    \ special rules that apply for garbage collection and that is up to you to make\
    \ sure that whatever data that void * is pointing to is still allocated and valid\
    \ when you later need to access it. In other words, don't pass things that are\
    \ stored on the stack into this parameter. That will cause a crash."
  merge: -1
  img_proc: true
- pgno: 200
  md: "After you register as an observer, if you passed the flag NSKeyValueObservingOption\
    \ Initial, you can get an initial notification of the initial value for the attribute\
    \ that you’re observing. Additionally, as the value changes over time, you receive\
    \ notifications of those changes.\n\nIn order to receive those notifications,\
    \ you have to implement the callback method shown in the next section.\n\n# Defining\
    \ callbacks for KVO\n\nThe next step in using KVO is in writing the callback method\
    \ for the Observer. Listing 6.15 shows an example implementation of the method\
    \ -observeValue:forKeyPath:ofObject:change:context:.\n\n# Listing 6.15\n\n# An\
    \ example implementation of the KVO callback method.\n\n```\n-(void)observeValueForKeyPath:(NSString\
    \ *)inKeyPath\n    ofObject:(id)inObject\n    change:(NSDictionary *)inChange\n\
    \    context:(void *)inCtx;\n{\n    if([inKeyPath isEqualToString:@\"memberVariable\"\
    ])\n    {\n        NSString *newValue = [inChange\n            objectForKey:NSKeyValueChangeNewKey];\n\
    \        // do something with the new value...\n    }\n    else if([inKeyPath\
    \ isEqualToString:@\"...\"]) // etc...\n    {\n    }\n    [super observeValueForKeyPath:inKeyPath\n\
    \        ofObject:inObject\n        change:inChange\n        context:inCtx];\n\
    }\n```"
  merge: -1
  img_proc: true
- pgno: 201
  md: 'As you can see in this method, the first thing that you have to do is to find
    out what attribute of the observed object is changed. The method is automatically
    passed an object parameter, which tells you what object is sending you the notification.
    By using the -isEquals method with the passed in value for the key path, you can
    determine exactly what attribute it was on the object that changed. The key parameter
    is nothing but a string, just like when you are using it with KVC. Therefore,
    you can use the NSString method -isEqualToString: to determine which key path
    this notification is for.


    When you have determined what attribute on the object has changed, you can then
    take whatever appropriate action is necessary. The actual change is passed to
    you by the change parameter. This parameter is an NSDictionary, containing keys
    and values associated with whatever change information you requested when you
    registered as an observer. Those keys and values are shown in Table 6.3.


    # Table 6.3


    | Key | Value |

    |---|---|

    | NSKeyValueChangeKindKey | An NSNumber specifying the type of change. |

    | NSKeyValueChangeNewKey | The new value. |

    | NSKeyValueChangeOldKey | The old value. |

    | NSKeyValueChangeIndexesKey | When NSKeyValueChangeKindKey is one of NSKeyValueChangeInsertion,
    NSKeyValueChangeRemoval, or NSKeyValueChangeReplacement, this value contains the
    indexes of the values changed. |

    | NSKeyValueChangeNotificationIsPriorKey | Used in conjunction with the NSKeyValueChangeOptionPrior
    to indicate the "prior" notification. |


    As you can see, if you chose to receive both the old value and the new value,
    they are both provided to you inside the change parameter, accessible using the
    appropriate key. After you have retrieved the value from the change dictionary,
    you can use it in your object to do whatever is necessary.


    Remember that KVC has to use objects for sending values — it cannot use scalars
    and structures directly. Therefore, if the value that you are observing is a scalar
    or a structure, the value that you will receive here will be an NSNumber or an
    NSValue, respectively. Therefore, you must use that value and extract the actual
    scale or value or structure value that you require, as needed. The example code
    shown above demonstrates this.'
