- pgno: 33
  md: "# Listing 1.2\n\n# Implementation File\n\n```\n#include \"MyModule.h\"\n\n\
    @implementation MyClass\n@synthesize foo;\n\n- (void) someMethod\n{\n    NSLog(@\"\
    some method got called\");\n}\n@end\n```\n\nAgain, there’s no need to worry about\
    \ understanding this code right now, but I will take this opportunity to point\
    \ out a few interesting features of these listings.\n\nFirst, notice that the\
    \ interface file clearly states the fact that it is an interface by including\
    \ the @interface directive. The @interface directive delineates the entire interface\
    \ and continues until you see the @end directive. Within these lines, there are\
    \ several subsections.\n\nThe first subsection is delineated by the curly braces\
    \ ({ }) at the top of the interface. This is the member variable declaration area.\
    \ Member variables store data related to your module.\n\nThe second subsection\
    \ is where properties and methods are declared. Properties document and allow\
    \ access to state and data in your objects. Methods are instructions to the computer\
    \ for operating on that data. The code shown above is typical of an object-oriented\
    \ module. You will learn more about object-oriented programming, classes, member\
    \ variables, properties, and methods in Chapter 3.\n\n# NOTE\n\n> Objective-C\
    \ retains its C programming language roots. Therefore, creating modules in Objective-C\
    \ that are pure C is impossible. In these cases, the modules might have had file\
    \ extensions of .h to indicate the interface and .c to indicate the implementation.\
    \ Additionally, Xcode can compile C++ if you name your implementation with a .cc\
    \ file extension and Objective-C++ (an Objective-C/C++ hybrid) if you name your\
    \ implementation with a .mm file extension. In this book, you’re here to learn\
    \ Objective-C, however, so we won’t be doing this.\n\nYou can use any text editor\
    \ that can save plain text files to write Objective-C code. However, Apple provides\
    \ the excellent Xcode integrated development environment on Mac OS X expressly\
    \ for the purpose of creating applications for Mac OS X, iPhone, and iPad. It\
    \ is a superb tool, and one that you use in this book. On the other hand, if you\
    \ are developing on platforms other than Mac OS X, you need to find a suitable\
    \ text editor for your platform of choice."
  merge: -1
