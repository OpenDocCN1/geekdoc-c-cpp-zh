- pgno: 403
  md: '# Developers, this book belongs on your desk!


    Once you understand Objective-C and object-oriented programming, you can create
    apps for the hottest devices on the market—Macs, iPhones, and iPads. And with
    this detailed guide, top Mac developer and author Jiva DeVoe will have you coding
    in no time, even if you’re a programming newbie. Coverage ranges from a thorough
    introduction to Objective-C basics to advanced techniques used by professional
    coders. You’ll learn Objective-C memory management, how frameworks fit together,
    the tricky business of thread safety, where Xcode fits in, and much more.


    +   - Understand Objective-C syntax, runtimes, and Xcode®—and write your first
    program

    +   - Create classes, work with properties, and learn about objects

    +   - Use code blocks, threads, KVO, and protocols

    +   - Define and write macros, handle errors, and use frameworks in your projects

    +   - Untangle threads, start using design patterns, and master advanced techniques

    +   - Read and write data with NSCoder

    +   - Write code for Windows®, Linux®, and other platforms


    # Access the latest information on Apple development


    Visit www.wileydevreference.com for the latest on tools and techniques for Apple
    development, as well as code and project files from the book.


    Jiva DeVoe is the founder of Random Ideas, LLC, a software company specializing
    in iPhone and Mac OS X applications. He has been writing software for nearly 25
    years. His iPhone apps have been featured as Apple staff picks and in Apple ads.
    He is also the author of Cocoa Touch for iPhone OS 3 Developer Reference. Contact
    Jiva through his blog at www.random-ideas.net.'
