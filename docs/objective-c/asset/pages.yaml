  md: "```\n}\n-(void)close;\n{\n    if(fileHandle != -1)\n        close(fileHandle);\n\
    \    fileHandle = -1;\n}\n\n-(void)finalize;\n{\n    [self close];\n    [super\
    \ finalize];\n}\n@end\n```\n\n# Writing foundation applications with garbage collection\n\
    \nI touched on the subject of Foundation command line applications written with\
    \ garbage collection briefly before. You already know that to create a commandline\
    \ Foundation application that uses garbage collection, you must manually start\
    \ the garbage collector at the beginning of your main function, before you allocate\
    \ any objects. However, another detail is important for you to understand.\n\n\
    The way that the Objective-C garbage collector works is that it searches for pointers\
    \ that refer to objects in both the global scope and the current local stack.\
    \ When it does this, it looks at all of the currently active variables in the\
    \ local stack. When doing so, it doesn’t take into account whether the local stack\
    \ variable has been initialized or not. Remember that a variable, before it is\
    \ initialized, is pointing to memory locations which previously may have contained\
    \ initialized data for objects or variables that have been previously deleted.\
    \ In other words, an uninitialized variable in your current stack may be pointing\
    \ to an object that you allocated in a previous function call but subsequently\
    \ is no longer referenced. Therefore, the garbage collector may mistakenly think\
    \ that your local variable may be referencing an object which should be garbage\
    \ collected.\n\nTo prevent this problem from happening, you need to clear the\
    \ local stack on a regular basis. The low-level Objective-C runtime method you\
    \ use to do this is objc_clear_stack(OBJC_CLEAR_RESIDENT_STACK). Typically, in\
    \ a command line Foundation application, one without a run loop provided by the\
    \ frameworks, you would be providing your own run loop for your own application\
    \ events to be processed. The top of this run loop is considered to be an ideal\
    \ location to clear the local stack and prevent this problem from occurring."
