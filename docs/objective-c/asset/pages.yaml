  md: "# Understanding Basic Syntax\n\nIn this chapter, I show you how to write a\
    \ basic Objective-C program. This very simple command line application will print\
    \ a short message to the console. Using this basic program, you will explore some\
    \ of the essentials of Objective-C, beginning first with how to actually write\
    \ the code, moving into working with variables and functions, and finally, controlling\
    \ the flow of your program by using conditional statements and loops. These concepts\
    \ are fundamental to learning the language, and you should study this chapter\
    \ thoroughly before moving on to the next one.\n\nGo ahead and type in the code\
    \ from Listing 2.1 into the Xcode project you created in Chapter 1. This code\
    \ should be entered into the source file which is named after your project name,\
    \ located in the Source group.\n\n# Listing 2.1\n\n# Your first program\n\n```\n\
    #import <Foundation/Foundation.h>\n\nint main(int argc, const char *argv[])\n\
    {\n    NSLog(@\"Hello from Objective-C\");\n    return 0;\n}\n```\n\nI’m going\
    \ to jump around in this code a bit because it makes it easier to explain that\
    \ way.\n\nStart with line 3, which is the declaration of the main function. All\
    \ Objective-C applications have a main function. Typically you don’t see it because\
    \ it’s usually created by your template when you create your project; when working\
    \ with graphical applications, it’s rare\n\n# In This Chapter\n\n+   - Writing\
    \ your first program\n+   - Declaring variables\n+   - Working with functions\n\
    +   - Using flow control statements\n+   - Using loops"
