- pgno: 226
  md: '# Extending Existing Class Capabilities


    No matter how well designed a class or framework is, inevitably, there will always
    be circumstances that you will encounter that the framework designer did not anticipate.
    Some developers go so far as to say that you should not plan for reusability in
    your code because at the end of the day, it is so difficult to achieve true universal
    reusability. I disagree with this notion, and I think that Objective-C provides
    some of the best tools for fostering reusability of any language available today.


    In this chapter, I’m going to delve into some of the most powerful of those tools.
    While not completely unique to Objective-C, they are certainly examples of how
    the dynamism of Objective-C enables more flexibility and reuse than almost any
    other compiled language.


    The technologies that I explain in this chapter center on the ability to extend
    the functionality of existing classes.


    # Working with Third-Party Frameworks and Classes


    If you’ve worked with any kind of programming frameworks at all in the past, you’ve
    probably run into a situation in which existing classes that are provided by the
    standard library of the language give you about 90 percent of the functionality
    that you’re looking for, but not the final 10 percent of the functionality that
    you really need. For example, you might have a string class, which doesn’t provide
    a regular expression search.


    Because these frameworks are built by a third-party, usually you don’t have access
    to the source code of those frameworks. Because of this, changing the existing
    framework itself to add that additional 10 percent of functionality is not an
    option. Even in cases in which you do have access to the source code, it would
    be an extremely bad practice to have to distribute a modified, custom version
    of a standard library with your application.


    ![](img/aaee977487e7a3eefe7b1dd596e0f6fb_226_0.png)'
  merge: -1
  img_proc: true
- pgno: 227
  md: 'Another option that you might consider, would be to inherit from the existing
    class, creating your own custom version of whatever class is that you need to
    change. By doing this, you could add whatever functionality you wanted to in your
    custom version of that class.


    On the surface, this seems like it might be a good idea, and indeed, many new
    object oriented developers would jump on this opportunity as being the logical
    way to solve this problem. However, in practice, this actually leads to other
    problems. Specifically, other readers of your code may have difficulty grasping
    your intent. They might ask themselves why you created a custom string class.
    If you are only adding a few methods, creating a custom subclass is probably overkill.


    The amount of confusion caused by your custom string class probably outweighs
    the benefit. Additionally, merging disparate subclasses from different code bases
    can be complicated and fraught with error. Imagine two different code bases with
    two slightly different subclasses of `NSString`. Imagine now that you want to
    use part of the functionality from the first code base and part of the functionality
    from the second code base. Aside from just the difficulty of merging the two `NSString`
    subclasses, if the two classes have different names then one or the other of the
    two code bases will have to be extensively edited in order to use the new, combined
    `NSString` class.


    Metaphorically speaking, using subclasses in order to extend existing classes,
    in some cases, is akin to requiring that someone have a completely custom-built
    automobile delivered directly from the factory whenever the customer simply requires
    a different type of hubcaps.


    I’m not trying to say that subclassing is inappropriate in all cases. In certain
    cases, subclassing is absolutely the right solution to a reusability problem.
    However, revisiting the object oriented development axiom that I mentioned in
    the last chapter, “favor composition over inheritance,” it’s easy to see that
    classes, when designed like automobiles, with reusable and replaceable parts,
    results in greater flexibility and greater customizability for anyone who has
    to reuse that class.


    So, all that being said, let me introduce you to some parts of Objective-C that
    enable you to bolt on functionality from outside the classes without having access
    to source code and without subclassing.


    # Working with Categories


    The first technology that I want to talk about is called categories. Categories
    enable you to extend the functionality of existing classes by declaring and implementing
    methods on those classes, which then become usable throughout your application
    anywhere the original class is used.'
  merge: -1
  img_proc: true
- pgno: 228
  md: 'This may sound cool, just on the surface, but what makes it even cooler is
    that when declaring a category, you do not need to have access to the original
    source code of the class that you are extending. Furthermore, a category is not
    a subclass. Meaning, the methods that you are adding are actually being added
    to the implementation of the class that you are directly manipulating. Any users
    of that class in your application will have access to those methods on instances
    of that class simply by virtue of you declaring a category on it.


    Although it is considered poor form to do so, you can use categories to override
    existing methods. When doing this, even third-party libraries will call your modified
    method when referencing the class in question instead of the original.


    If you’re coming to Objective-C from another dynamic language such as Ruby or
    Smalltalk, you may be familiar with the concept of mixins. Mixins and categories
    share a lot in common, and you could even say that categories are the Objective-C
    version of a mixin.


    # Declaring categories


    Categories are declared similarly to how you declare class interfaces. Meaning,
    you declare a category by first typing @interface and then the class name that
    you wish to modify. After the class name, instead of the superclass, as in the
    case of declaring a class, you put the name of the category that you are declaring
    inside parentheses. Listing 8.1 shows an example category declared on the NSMutableString
    class.


    Listing 8.1


    An example category on NSMutableString adding the ability to insert a GUID into
    the string


    ```

    #import <Foundation/Foundation.h>


    @interface NSMutableString (GUID)


    - (void)appendGuid;


    @end

    ```


    In this particular code, I’m adding a category to the NSMutableString class that
    will generate a globally unique identifier (GUID). For now, this category simply
    appends the GUID onto the end of whatever string is there.'
  merge: -1
  img_proc: true
- pgno: 229
  md: "# Implementing category methods\n\nUnlike protocols, simply declaring the interface\
    \ of the category is not enough, because you are actually adding the implementation\
    \ of the method to the class that you are modifying. This means that in addition\
    \ to declaring the interface of your category, you must also add the implementation\
    \ for the methods in question. Listing 8.2 shows the implementation for the methods\
    \ that I just declared for the NSMutableString class in the previous section.\
    \ Notice that the @implementation line, just like when declaring a class, tells\
    \ the class name that you are creating an implementation for, in this case, NSMutableString,\
    \ again followed by the category name in parentheses.\n\n```\n```objective-c\n\
    #import \"NSMutableString+GUID.h\"\n\n@implementation NSMutableString (GUID)\n\
    \n-(void)appendGuid\n{\n    CFUUIDRef uuid = CFUUIDCreate(kCFAllocatorDefault);\n\
    \    NSString *str =\n        (NSString *)CFUUIDCreateString(kCFAllocatorDefault,\
    \ uuid);\n    [self appendString:str];\n    CFRelease(uuid);\n}\n\n@end\n```\n\
    ```\n\nJust like defining methods on a class implementation, you define methods\
    \ in a category inside the implementation block. These methods have access to\
    \ all member variables in the class, can call other methods on the class using\
    \ self, and can even call methods on the superclass using the super keyword.\n\
    \nThe only limitation is that you cannot declare new member variables as part\
    \ of your category. There is a way to add variables to existing classes, which\
    \ I will show you later in this chapter, but categories are not able to do so."
  merge: -1
