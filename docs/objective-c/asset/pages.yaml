- pgno: 332
  md: '# Multiprocessing with Threads


    Threads. Probably no other computing subject strikes more fear and trepidation
    into the hearts of experienced programmers. It should. Threads cause bugs that
    are difficult to track down, difficult to reproduce, and maddeningly frustrating
    to fix. At the same time, however, they promise to unlock more of our multi-computing
    potential than any other modern software technology. This dual nature makes them
    a complex subject worthy of an entire chapter dedicated to handling them properly.


    Every program has at least one thread, usually called the main thread. The main
    thread begins execution in your main function and then is responsible for executing
    the rest of your application unless you explicitly create another thread.


    Conceptually, you can think of a thread as a single line of execution through
    your application by which instructions are executed sequentially. When you create
    another thread, you actually have two separate threads of execution, running through
    your application in parallel. If your application is running on a single core,
    single CPU machine, your threads may appear to be running simultaneously, however,
    they are actually given different time slices on the CPU. On the other hand, if
    your application is running on a multicore, or multi-CPU machine, then it is entirely
    possible for two threads in your application to actually be executing simultaneously.


    When two threads are executing simultaneously in this manner, it is possible that
    the two threads may both try to access the same chunk of memory at the same time.
    When this occurs, the exact behavior is undefined and as a result, this can cause
    an error in your program. This circumstance is called an unsafe thread condition.
    These circumstances only occur when the code which is executing is written without
    thread safety in mind.


    To prevent these kinds of circumstances, you have to prevent one thread from accessing
    the same memory or data that another thread is accessing at the same time. This
    is called making your code thread safe. It is vitally important that whenever
    you use threads you make sure that all of the code that you write is thread safe.


    # In This Chapter


    +   - Understanding the causes of thread errors

    +   - Learning how to prevent thread errors with locks

    +   - Using @synchronize

    +   - Creating threads with NSThread

    +   - Using NSOperation and NSOperationQueue'
  merge: -1
  img_proc: true
- pgno: 333
  md: 'safe. Debugging problems in threads is extremely difficult because often the
    bug only occurs in very specific very narrow race conditions. This means that
    a bug might appear on a particular user’s computer because of the speed and configuration
    of their computer and never show itself on your computer. Additionally, because
    the debugger specifically can stop your application at particular points and because
    it narrows the execution of your application down to a specific thread, threading
    bugs often won’t show up in a debugger at all. It is because of these issues that
    threading bugs are sometimes known as “heisenbugs”. They get this nickname because
    you know that they occur, but when you try to observe them they disappear.


    Many developers see all of the wonderful thread related tools that they have available
    in Objective-C, and their first reaction is to think that somehow threads are
    going to solve all of their design problems. It can be very tempting to fire off
    threads into the background for various tasks, leaving your main thread free to
    handle user interface interaction; but doing this is a bad idea. Even in cases
    like network code, where other languages might encourage you to use threads to
    prevent blocking I/O, 99 percent of the time, when it comes to Objective-C, using
    a thread is going to be the wrong tool for the job. Using threads is a technique
    that should be reserved for narrow requirements, for example situations where
    you have CPU intensive calculations. Even in these cases, properly written, thread-safe
    code can be in danger of being blocked by shared resources such as GUI interaction.
    These problems can cause multithreaded code to, in some cases, actually be slower
    than the single-threaded alternative.


    Objective-C provides a variety of tools for creating and manipulating threads
    as well as for writing thread safe code. In this chapter, I review some of the
    key technologies that are required for writing thread-safe code, and then introduce
    you to some of the classes that make creating and using threads in Objective-C
    simple.


    CAUTION

    One note of warning, the Cocoa UI frameworks (UIKit and AppKit) are not, in fact,
    thread safe. Any interaction with any GUI element in your application at any time
    must always be done on the main thread. If you must update a GUI element from
    a background thread, you can dispatch a method to be called on the main thread
    by using the NSObject method -performSelectorOnMainThread:withObject:... methods
    to do so.


    CAUTION

    A common bug which some programmers encounter is in the use of notifications using
    NSNotificationCenter. Notifications are sent on the thread upon which they are
    posted. This means that if you post a notification from a background thread that
    then updates a GUI component, you are in danger of a thread safety issue. Therefore,
    take care when working with notifications in a threaded application.


    # Synchronizing Code


    The key to writing thread-safe code is to remember that no thread is ever safe
    reading or writing a particular chunk of memory that might simultaneously get
    written to by another thread. If the memory that is being read or written to is
    also simultaneously changing from underneath the thread, the behavior of the application
    is undefined. Anything could happen. So the key'
  merge: -1
  img_proc: true
- pgno: 334
  md: "then is to ensure that when you are writing to a particular block of memory\
    \ or variable that no other thread will be able to read from it until you are\
    \ finished.\n\nThe most common way to prevent another thread from accessing memory\
    \ that you’re writing to while you’re writing it is the use of a mutually exclusive\
    \ lock, or mutex.\n\n# Using Locks\n\nA mutually exclusive lock, or mutex, is\
    \ an object which prevents the simultaneous access of a common resource (usually\
    \ memory). It’s called a mutually exclusive lock because it locks out access to\
    \ the resource and allows exclusive access to only one thread at a time.\n\nThe\
    \ Objective-C foundation framework provides two main types of mutually exclusive\
    \ locks. The first, and simplest, is the NSLock class. The NSLock class represents\
    \ a simple mutex that you can instantiate and then lock prior to writing to a\
    \ particular variable or memory location. Other threads, which want to write to\
    \ or read from the same variable, should attempt to lock the same NSLock object\
    \ before initiating their data access. Attempting to lock the NSLock blocks the\
    \ thread until the lock is unlocked and can be locked again. In this way, the\
    \ attempt to lock the NSLock will prevent access to the data until the first thread\
    \ is finished with its access.\n\nTo create an instance of an NSLock, you simply\
    \ instantiate one using the standard alloc/init pattern. Listing 16.1 shows an\
    \ example of how you do this. Typically, you hold the instance of your NSLock\
    \ as a member variable of whatever class is accessing the data. It is important\
    \ that the lock be maintained and available as a variable that both threads can\
    \ access so that they can acquire the lock accordingly.\n\n# Listing 16.1\n\n\
    # Creating an instance of an NSLock\n\n```\n-(id)init\n{\n    if((self = [super\
    \ init]))\n    {\n        lock = [[NSLock alloc] init];\n    }\n    return self;\n\
    }\n```\n\nTypically, you would create your instance of NSLock as I’ve shown here\
    \ in the initializer of the class. Then, within the accessors of the data that\
    \ you want to protect, you would simply acquire a lock on the NSLock instance\
    \ before attempting to access the data. Listing 16.2 shows an example of some\
    \ accessors written using this technique."
  merge: -1
  img_proc: true
- pgno: 335
  md: "# Listing 16.2\n\n```\n-(void)setSomeVar:(id)inValue\n{\n    [inValue retain];\n\
    \    [lock lock];\n    id originalValue = someVar;\n    someVar = inValue;\n \
    \   [lock unlock];\n    [originalValue release];\n}\n\n-(id)someVar\n{\n    id\
    \ ret = nil;\n    [lock lock];\n    ret = [someVar retain];\n    [lock unlock];\n\
    \    return [ret autorelease];\n}\n```\n\nRemember that attempting to lock an\
    \ instance of NSLock, which is already locked results in your thread blocking\
    \ until the lock can be acquired. If this presents a problem, NSLock provides\
    \ two convenience methods for you to help. The first is the -tryLock method. This\
    \ method attempts to acquire a lock, but if it cannot, it immediately returns\
    \ with a result of NO. If it is able to acquire the lock, it returns a result\
    \ of YES. This can be convenient to use in cases where you may want to attempt\
    \ to acquire a lock before doing something, but if you can’t acquire the lock,\
    \ you can perform some other operation while waiting to attempt again.\n\nThe\
    \ second convenience method that NSLock provides is the -lockBeforeDate: method.\
    \ Just like the -tryLock method, this one also returns a Boolean, yes or no, depending\
    \ on whether or not he was able to lock the instance of NSLock. In this case,\
    \ however, this method will block for a period of time until the date specified.\
    \ When this method expires, if it has not been able to achieve the lock, it will\
    \ return NO.\n\nThe biggest problem with NSLock is that if you mistakenly attempt\
    \ to lock a lock already locked by the thread from which you are attempting to\
    \ lock it again, this results in what’s known as “deadlock.” Because the act of\
    \ attempting to lock the lock will block the current thread, you can wind up in\
    \ a situation in which you are waiting for a lock to be unlocked but it will never\
    \ get unlocked because the thread responsible for unlocking it is the thread which\
    \ is waiting for it to be unlocked. This may sound incredibly contorted and complex,\
    \ but this does in fact happen in complex applications."
  merge: -1
  img_proc: true
- pgno: 336
  md: "To solve this problem, there is another kind of lock called NSRecursiveLock.\
    \ This lock keeps track of the thread which has locked it, and if that thread\
    \ attempts to lock it again, it simply returns immediately. You do not need to\
    \ be concerned about accessing the data which you are yourself locking from your\
    \ existing thread. Therefore, attempting to lock a lock which you already have\
    \ a lock on doesn’t make any sense. Using an NSRecursiveLock in these cases resolves\
    \ this problem.\n\n# Using the @synchronize keyword\n\nUsing locks is a simple\
    \ and efficient way to ensure that your code is thread safe. However, you may\
    \ find, after you’ve written a certain amount of NSLock based code, certain patterns\
    \ begin to emerge.\n\nThe first pattern is that you often want to lock access\
    \ to specific variables, or all member variables of a particular object, and so\
    \ you have instances of locks that are associated with these specific variables.\
    \ Often, you have a lock that uses a member of a given class as its lock object.\
    \ You might lock this lock whenever you need to access any of the data in that\
    \ class. Alternatively, you might have particular locks associated with particular\
    \ variables, and you want to make sure that you lock those locks whenever those\
    \ particular variables are accessed. In other words, you are trying to protect\
    \ the coupling between the data. Ideally, you’d like to have some kind of language\
    \ construct that enabled you to express this relationship in your code.\n\nThe\
    \ second pattern that tends to emerge when working with thread locks is the fact\
    \ that it is easy to forget to unlock your locks. When this occurs, you wind up\
    \ with deadlock situations that can really ruin your day. This can be especially\
    \ problematic when exceptions are introduced, causing situations where normal\
    \ execution of the call stack might be interrupted. Because of these problems,\
    \ Objective-C introduced a built-in language directive called @synchronized. This\
    \ directive provides a built in low-level mutually exclusive lock mechanism which\
    \ also includes specific scoping and variable parameters. What this means is that\
    \ the @synchronized directive gives you the ability to specify a lock for a specific\
    \ variable and to specify that lock exists for a particular scope of code. Listing\
    \ 16.3 shows an example of the @synchronized directive in use.\n\n# Listing 16.3\n\
    \n# Using @synchronized\n\n```\n- (void)setSomeVar: (id) inValue\n{\n    [inValue\
    \ retain];\n    @synchronized(someVar)\n    {\n```"
  merge: -1
  img_proc: true
- pgno: 337
  md: "```\nid originalValue = someVar;\nsomeVar = inValue;\n[originalValue release];\n\
    }\n}\n```\n\nAs you can see, the @synchronized directive takes a single parameter,\
    \ specifying the variable upon which the lock is intended. Additionally, it takes\
    \ a block of code, specified within curly braces, that specifies the scope within\
    \ which the lock will be locked. Essentially, you can think of this as a scoped\
    \ lock. The lock exists only within the scope of the code bracketed within the\
    \ curly braces.\n\nOften, the @synchronized directive is used with the self variable\
    \ to specify that an entire object is locked within the scope of the @synchronized\
    \ block. Listing 16.4 is an example of this.\n\n# Listing 16.4\n\n# Using self\
    \ as the variable to be synchronized.\n\n```\n- (void)setSomeVar:(id)inValue\n\
    {\n    [inValue retain];\n    @synchronized(self)\n    {\n        id originalValue\
    \ = someVar;\n        someVar = inValue;\n        [originalValue release];\n \
    \   }\n}\n```\n\nOne nice feature about @synchronized is that, because it specifies\
    \ the scope of the lock, if anything, including an exception, causes it to exit\
    \ that scope, the lock is released.\n\nUsing @synchronized rather than NSLock\
    \ or NSRecursiveLock is considered to be the more modern and more correct form\
    \ of ensuring thread safety. When possible, you should use this technique in your\
    \ applications."
  merge: -1
  img_proc: true
- pgno: 338
  md: "# NOTE\n\nThe immutable Foundation classes, such as NSString, NSArray, NSDictionary,\
    \ and NSSet, are naturally thread safe because they cannot be modified once created.\
    \ However, the variable you store them in is not, and therefore should be protected\
    \ with a lock if you will be modifying it.\n\n# Understanding atomicity\n\nAnother\
    \ tool available to you for ensuring that your code is thread safe relates to\
    \ the use of properties. The atomic property flag specifies that no matter how\
    \ many threads may be accessing a given property, setting or getting its value,\
    \ you'll always get a “whole” value, versus a partial value. Essentially, it ensures\
    \ that the accessor created by the @synthesize directive for your property utilizes\
    \ an @synchronized(self) block within the generated accessor prior to assignment\
    \ or retrieval of the value. When you specify the nonatomic flag, no such @synchronized\
    \ block is used.\n\nBy specifying the atomic flag (which is the default), you\
    \ are specifying that the property accessor itself is thread safe. Which is to\
    \ say, if two threads are simultaneously accessing that particular member variable\
    \ through its property accessors, the operations will be thread safe. However,\
    \ it does not ensure thread safety across your entire object or across subsequent\
    \ calls to multiple different accessors on the same object. To do this, you would\
    \ need to implement some form of object-wide lock.\n\n# Using NSThread\n\nThere\
    \ are several different ways of creating new threads in Objective-C. The first\
    \ of these is using the NSThread object.\n\n# Creating threads\n\nTo use the NSThread\
    \ class to create a thread, you can either use the factory method +detachNewThreadSelector:toTarget:withObject:,\
    \ or you can use the standard initializer, -initWithTarget:selector:object:. In\
    \ the case of the former method, the thread will be created and launched running\
    \ the code provided by the selector and target. In the case of the latter method,\
    \ the thread will be initialized but won’t actually be launched until you call\
    \ the -start method. Listing 16.5 shows an example of creating a thread using\
    \ the factory method.\n\n# Listing 16.5\n\n# Creating a new thread\n\n```\n[NSThread\
    \ detachNewThreadSelector:@selector(work:)\n    toTarget:self withObject:someData];\n\
    ```"
  merge: -1
  img_proc: true
- pgno: 339
  md: "In this case, the selector that we are calling is the -work: method which is\
    \ defined on the current object from where this method is being called (in other\
    \ words self). The -work: method takes one argument. We provide this argument\
    \ with the someData parameter. What this code will actually do is create a new\
    \ thread, in that thread will then call the -work: method on self, passing the\
    \ someData parameter to it. Once the thread is launched, the method returns.\n\
    \n# Manipulating Running Threads\n\nAfter a thread has been created and detached,\
    \ it will continue to run until the selector used to launch the thread exits.\
    \ If you need to have control over stopping the thread, you should typically include\
    \ a check inside the run loop of the selector for some variable that you will\
    \ set in your main thread. In other words, if you take for example a case where\
    \ you want to have some job running continually in the background until the user\
    \ pushes a stop button, you need to have some variable that can be set on the\
    \ foreground thread and checked in the background thread. An example of this is\
    \ shown in Listing 16.6.\n\n# Listing 16.6\n\n# A typical background thread run\
    \ loop\n\n```\n- (void)work:(NSDictionary *)somData\n{\n    while([self continueRunning])\n\
    \    {\n        // do some work...\n\n        [self doSomethingWith:someData];\n\
    \    }\n}\n```\n\nIn this particular case, this is a relatively brute force technique.\
    \ There’s nothing occurring outside of this method, and nothing tricky going on\
    \ with the run loop.\n\nThere are some rare cases where you may want to allow\
    \ the run loop of the current thread to actually get some processing time inside\
    \ your thread. For example, some classes, such as NSURLConnection, can be scheduled\
    \ to run on the current run loop rather than launching their own threads.\n\n\
    To make sure that these classes and methods get appropriate time on the run loop,\
    \ you need to make sure that you give the run loop an opportunity to run inside\
    \ your thread run loop. Listing"
  merge: -1
