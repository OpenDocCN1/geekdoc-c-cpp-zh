    \ char * argv[])\n{\n    NSAutoreleasePool * pool = [[NSAutoreleasePool alloc]\
    \ init];\n    NSDate *date = [[NSDate alloc] init];\n    NSLog(@\"The time is:\
    \ %@\", date);\n    [pool drain];\n    return 0;\n}\n```\n\nIn this case, the\
    \ NSDate object that is allocated is not being released. The static analyzer output\
