- pgno: 196
  md: '# Using KVC with structures and scalars


    An important limitation when working with KVC is that all of the methods, -valueForKey:,
    -setValueForKey:, and so on, all take id as the type for both parameters and return
    values. For most attributes, this isn’t a problem, because, for the most part,
    you work with objects when defining these attributes, and they can be manipulated
    by using the id datatype. However, when you have attributes that are structures
    or scalar types, variables like ints, floats, and so on, this presents a bit of
    a problem.


    Specifically, the Objective-C runtime can’t actually use these types of variables
    directly when using Key Value Coding. It actually has to convert these values
    from their native types into types that are full-fledged Objective-C objects.


    Thankfully, Objective-C, for the most part, handles this for you. When accessing
    KVC attributes that are not objects, the Objective-C runtime automatically and
    transparently looks at the type of the variable being accessed, and will create
    an NSNumber or NSValue to wrap the value so that it can be used with KVC.


    I discuss NSNumbers and NSValues in Part III of this book, however, for now, simply
    understand that these are special classes that enable you to wrap scalars and
    structures within them and treat them as Objective-C objects. This enables you
    to do things like storing them in arrays, storing them in dictionaries, and using
    them in KVC.


    Again, Objective-C handles this for you automatically, but there is one edge condition
    that you need to be aware of. In the case where you use a KVC accessor to set
    a scalar value, but you pass nil as the value, there isn’t a generic way that
    this can be handled in all cases automatically. As a result, in this specific
    case, the Objective-C runtime will instead call the method -setNilValueForKey:.
    This method, by default, throws an exception. If needed, however, you can override
    this method in your class to do whatever may be appropriate. For example, you
    might define that passing a nil value for a particular variable on your class
    means that the value should be -1.0. In this case, you would simply override the
    -setNilValueForKey: method, check to see what the key is that’s being passed in,
    if it matches the variable that you have defined should be -1.0 in the case of
    a nil, you can then simply create your own NSNumber instance and set the value
    yourself manually by using the -setValue:forKey: method.


    Again, this is simply an edge condition. For the most part, the wrapping and unwrapping
    of scalars and structures to NSNumbers and NSValues is totally transparent. Even
    your own structures are handled automatically by using NSValue’s -getValue: capability.


    # Searching objects for attributes


    When accessing your KVC-compliant attributes, the runtime follows a specific set
    of rules to attempt to find the correct accessor for a given key path. Those rules
    are as follows.'
