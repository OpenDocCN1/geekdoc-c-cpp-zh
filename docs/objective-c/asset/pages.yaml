- pgno: 374
  md: '# Using Objective-C on Other Platforms


    Although by far the best platforms for coding Objective-C are the ones that come
    from Apple, they are, by no means, exclusive. Objective-C has quite an extensive
    history on other platforms such as Linux, BSD, and even Windows. Depending upon
    your exact needs, you’ll find that there are open source communities that support
    these alternative platforms quite well. In this chapter, I’d like to give you
    a brief introduction to some of these other platforms and tell you where you can
    find more information about them.


    The biggest challenge when looking at Objective-C on other platforms is in the
    support of the frameworks that make Objective-C powerful. Porting the actual Objective-C
    language is a reasonably trivial affair. Since the GNU compiler collection (gcc)
    began including support for Objective-C, it has become available on virtually
    all of the platforms that gcc supports. However, porting the core frameworks is
    a much more daunting task.


    To be sure, the Foundation framework has the greatest cross-platform support.
    Since I have focused almost exclusively on the foundation framework in this book,
    that means that any of the examples in this book should, with a few exceptions,
    compile and run on any of these other platforms.


    When it comes to Cocoa and some of the other higher-level frameworks, they are
    generally not available on other platforms. There are exceptions to this rule,
    but to be perfectly honest, you need to be very careful when thinking about working
    with the GUI frameworks if your code needs to run on platforms other than OS X.


    That said, the best support for all of the frameworks that are typically used
    with Objective-C come from two primary projects. They are GNUstep and Cocotron.
    These two open source projects take drastically different approaches to their
    portability technique, but the end result is the same in both cases, the ability
    to write and compile Objective-C code with Cocoa and Foundation support on Linux,
    Windows, BSD, and other platforms.


    # In This Chapter


    +   - Using Objective-C on Windows, Linux, and other platforms

    +   - Understanding Objective-C framework maturity

    +   - Working with Other Libraries'
  merge: -1
  img_proc: true
- pgno: 375
  md: '# Using GNUstep


    The first and oldest of these projects is the GNUstep project, which can trace
    its history all the way back to the original NeXTstep days. In fact, this project
    was originally developed to provide an open source alternative to the closed source
    NeXTstep platform. In that regard, it has done a decent job of re-creating the
    NeXTstep desktop environment, including the icons, the file browser, the mail
    client, and so on. See Figure 19.1.


    Figure 19.1


    The GNUstep environment running on Unix.


    ![](img/aaee977487e7a3eefe7b1dd596e0f6fb_375_0.png)


    Because of its extensive history, the GNUstep project has some of the best support
    for Foundation and Cocoa. However, because their goal was really to replicate
    the NeXTstep environment, rather than emulating either MacOS X or the native widget
    set of the platform upon which applications run, they actually include an entire
    NeXTstep widget set instead. This means that if you choose to use this project
    to port your GUI application to Windows, your application will actually look like
    a NeXTstep application when it runs on Windows. This includes everything right
    down to the types of menus used. Additionally, there are issues related to the
    filesystem required for running GNUstep applications. At last check, in order
    to run a GNUstep application on Windows, you had to have a full-on GNUstep filesystem
    installed as well as numerous support libraries.'
  merge: -1
  img_proc: true
- pgno: 376
  md: 'All this can be disconcerting for a typical user. For the purposes of completeness,
    I will mention here that there have been efforts over the last few years to add
    skinning support to the GNUstep project. This would enable you to at least create
    an application for windows and then skin that application with the Windows widget
    set. In other words, the GNUstep project is working on its portability when it
    comes to graphical applications, and improving it over time, but it’s not perfect
    yet. All that said, when it comes to the Foundation framework, the GNUstep project
    has some of the best, most extensive support available anywhere. I would say that
    if your application is a commandline application, such as a server, and your intent
    is to port the application to Windows or Linux, that the GNUstep project will
    very likely enable you to do exactly that. Arguably, a good way to leverage existing
    Objective-C code that’s been written on MacOS X and which you want to port to
    Windows might be to port the backend, underlying non-GUI code using Objective-C
    and GNUstep. You can then write a native GUI that runs on top of that backend
    code, communicating with it using interprocess communication or linking with it
    as a library. By doing this, you get the best of both worlds. You get to port
    your business logic code, while still providing a familiar native user interface
    to the user.


    For more information about the GNUstep project visit their website at http://www.gnustep.org.


    # Using Cocotron


    Another more recent attempt at cross-platform Objective-C has been the creation
    of the Cocotron project. The Cocotron project has taken a different approach with
    regard to porting applications to platforms other than MacOS X. Cocotron provides
    a cross compiler environment for Xcode so that you can cross compile your application
    inside Xcode on your MacOS X desktop. Using this cross compiler, you can build
    for Windows, Linux, or other desktop UNIX. The applications cross compiled in
    this manner look, feel, and behave exactly like native applications.


    The way the Cocotron project works is by leveraging the Xcode ability to have
    multiple toolchains and SDKs installed and usable for compiling your code. The
    same technology that lets you click a button and compile your code for iPhone
    OS or Mac OS X allows Cocotron to work its magic.


    Cocotron is an ideal solution if you feel most comfortable with MacOS X and Xcode
    as your development environment. It allows you to do all of your development on
    MacOS X and then simply change your SDK and recompile your application for your
    target platform.


    As if this capability weren’t enough, Cocotron also has some of the best third
    party support for the Cocoa and Foundation frameworks. Its implementation is good
    enough that there are actually commercial quality applications that use Cocotron
    today to simultaneously deploy on MacOS X and Windows.


    The biggest areas that Cocotron tends to lag behind are in networking, threading,
    and some higher level framework support. These are being actively worked on however,
    and if you have a sufficient budget, you can even contract the Cocotron maintainers
    for the purposes of improving specific parts of the libraries, which your application
    requires.


    Figure 19.2 shows an example application written using Cocotron running on Windows
    and MacOS X.'
  merge: -1
  img_proc: true
