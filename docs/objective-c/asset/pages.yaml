    Unknown error.\"\n                         forKey:NSLocalizedDescriptionKey];\n\
    \n    *outError = [NSError errorWithDomain:@\"FileWrapper\"\n                \
    \                    code:501\n                                userInfo:errorInfo;\n\
    }\nreturn NO;\n}\nreturn YES;\n}\n```\n\nNSError is a formalized design pattern\
    \ that is being implemented across the Cocoa and Cocoa Touch frameworks.\n\nTo\
    \ use it, you extend your method signature to take an indirect reference to an\
    \ NSError object. This object is provided by the caller. An indirect reference\
    \ is essentially a pointer to a pointer. In other words, it’s a pointer that points\
    \ to another pointer; in this case, it is a pointer to a variable allocated inside\
    \ the stack of the caller. When you assign something to that variable, you dereference\
    \ the indirect reference and thus are actually assigning to the variable to which\
    \ it points.\n\n![](img/aaee977487e7a3eefe7b1dd596e0f6fb_270_0.png)\n\n> **NOTE**\n\
    > \n> Some programmers will refer to indirect references as “pointer to a pointer”,\
    \ “pass by reference”, or “a reference”. I prefer the term “indirect reference”\
    \ to distinguish it from a plain reference, which you might encounter when using\
    \ Objective-C++. “Pointer to a pointer” would probably be the most accurate description,\
    \ but I feel the phrase “pointer to a pointer” is confusing for new programmers.\n\
    \nThis concept of an indirect reference probably sounds very confusing. If so,\
    \ then good, you’re perfectly normal. Fortunately, the underlying details are\
    \ mostly unimportant as long as you understand the syntax that you have to use\
    \ when creating and returning the NSError object.\n\nWhen declaring the NSError\
    \ indirect reference in your method’s parameter list, you will declare it using\
    \ the syntax \"(NSError **)\". The double * signs mark this as an indirect reference.\n\
    \n# Creating an NSError Object\n\nOnce inside your method, if an error occurs,\
    \ before you return NO from the method, you must first create your NSError objects\
    \ and assign it to the dereferenced NSError indirect reference. To do this, go\
    \ ahead and create your NSError object just like you would normally, but"
