  md: "The return value type is specified to the left of the function name. The return\
    \ value does not have a variable name associated with it as part of the declaration.\
    \ You define what value is returned from your function by using the return keyword\
    \ inside your function body. This should be the last statement of your function.\n\
    \nIn Objective-C, parameters and return values are passed using what’s called\
    \ “pass by value.” What this means is that when you pass a parameter to a function,\
    \ the runtime will actually make a copy of the value that you are passing. This\
    \ means that changes made to those values inside of your function will not affect\
    \ the value in the calling function. If, however, you pass a pointer to your value\
    \ instead, then changes made to the dereferenced variable will be sent back to\
    \ the original variable in the calling function.\n\nListing 2.26 demonstrates\
    \ this concept.\n\n# Listing 2.26\n\n# Working with pointers\n\n```\n#import <Foundation/Foundation.h>\n\
    \nvoid myFunction(int a, int *b)\n{\n    a = 20;\n    *b = 20; // de-reference\
    \ the pointer to access the original\n}\n\nint main(int argc, const char *argv[])\n\
    {\n    int a = 10;\n    int b = 10;\n\n    myFunction(a, &b); // using the & operator\
    \ changes b into a pointer\n\n    NSLog(@\"a: %ld\", a);\n    NSLog(@\"b: %ld\"\
    , b);\n\n    return 0;\n}\n```"
