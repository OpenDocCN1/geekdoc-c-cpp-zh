    \ in place. For the purposes of discussion here, I focus primarily on NSMutableArray,\
    \ but you should know that you can access any of the non-mutating methods through\
    \ NSArray as well.\n\nSorting an array can be done with the methods -sortUsingDescriptors:,\
    \ -sortUsingFunction:context:, or my personal favorite, -sortUsingSelector:, each\
    \ of which takes a different type of sorting object as an argument to use for\
    \ performing the sort.\n\nThe first of these, -sortUsingDescriptors: takes an\
    \ instance of NSSortDescriptor as an argument. To create one of these, you specify\
