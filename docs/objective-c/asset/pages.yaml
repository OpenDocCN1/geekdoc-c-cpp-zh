    \        compare:[employee2 employmentDate]];\n}\n\nNSMutableArray *employees\
    \ = [...];\n\n[employees sortUsingFunction:sortByEmploymentDate context:nil];\n\
    ```\n\nThe third technique, using the method -sortUsingSelector: takes a selector\
