- pgno: 289
  md: '# Listing 12.5


    # Appending a formatted string


    ```

    NSMutableString *str = [...] ;


    [str appendFormat:@"Your change is: %.2f.", change];

    ```


    You can also split a string into separate components by using the method -components
    SeperatedByString:. This method will search for instances of the given string
    within the receiver, and then returned and NSArray containing the parts of the
    string separated by that string. Listing 12.6 shows example of this.


    # Listing 12.6


    # Splitting a string into its components


    ```

    NSString *str = @"This is a string of words.";


    NSArray *words = [str componentsSeperatedByString:@" "];


    // words is now [@"This", @"is", ... ]

    ```


    Similarly, the corollary to this is the NSArray method -componentsJoinedByString:
    which will do the opposite operation. It will take an array of strings and combine
    them into a single string with each component separated by the given string.


    You can perform string searching and replacement using methods like -rangeOfString:
    to find the range of a given string within the receiver, or -stringByReplacingOccurrences
    OfString:withString: to do string replacement. NSString even has some limited
    regular expression matching support as well.


    Overall, NSString is an amazingly powerful and comprehensive class with a lot
    of functionality much more than can be covered here. My advice is to visit the
    NSString documentation, and review all the methods it provides you.'
  merge: -1
  img_proc: true
- pgno: 290
  md: '# Using NSString categories


    Because `NSString` is such a comprehensive class already, Apple has chosen to
    extract into separate category files that are used in conjunction with `NSString`.
    These are the `NSString (AppKitAdditions)` and `NSString (UIStringDrawing)` categories.
    These are not strictly part of the Foundation framework; however, they are part
    of the GUI toolkit frameworks Cocoa, and Cocoa Touch. They provide methods used
    for drawing strings on windows and views. Because they are not part of Foundation,
    I won’t cover them here, for more information on them, please visit the Apple
    Documentation, or pick up one of the other books in this series on those subjects.


    # Summary


    The `NSString` and `NSMutableString` classes are a vital component of Objective-C.
    I could write chapters and chapters about all of the different methods and how
    you can use them in your code. However, the best thing you can do is simply to
    be familiar with the `NSString` and `NSMutableString` class documentation. Usually,
    if there’s something you need on `NSString`, the functionality is going to be
    there. You just need to find it.'
