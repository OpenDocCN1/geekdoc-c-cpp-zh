- pgno: 299
  md: '# Working with sets


    The NSArray class provides a collection for use with an ordered collection of
    objects, and the NSSet provides a class for working with unordered collections
    of objects. Using an NSSet, you can store objects that do not have to be stored
    in a particular order. The fact that an NSSet is unordered enables it to be slightly
    faster when accessing individual elements, though they cannot be accessed by index
    or key.


    Again, creating an NSSet is done by using either an initializer or one of the
    numerous NSSet class factory methods. Listing 13.9 shows how to create an NSSet
    using a factory method and how to manipulate the members of the set.


    # Listing 13.9


    # Creating an NSSet


    ```

    NSSet *set = [NSSet setWithObjects:@"foo", @"bar", @"baz"];


    NSLog(@"%@", [set member:@"foo"]); // outputs foo


    NSLog(@"%@", [set anyObject]); // prints one of them, no idea which


    NSLog(@"%@", [set allObjects]); // [@"foo", @"bar", @"baz"]


    NSLog(@"%d", [set containsObject:@"baz"]); // prints ''1''

    ```


    Object stored in an NSSet must respond to the NSObject methods -isEqual: and -hash.
    If the -hash method of an object stored in an NSSet depends on the internal state
    of the object, the stored object must not change while it is in the set.


    Accessing objects in the set can be done by using the methods -allObjects, which
    returns an array containing all of the objects in the set, -anyObject which returns
    a non-deterministic object from the set, or -member: which returns the member
    of the set that matches the passed in parameter determined by using the method
    -isEqual:. Finally, the method -anyObject returns a non-deterministic member of
    the set.


    You can iterate over the objects of the NSSet by using fast enumeration or an
    NSEnumerator.


    Listing 13.10 shows accessing objects in an NSSet and enumerating over an NSSet.'
  merge: -1
