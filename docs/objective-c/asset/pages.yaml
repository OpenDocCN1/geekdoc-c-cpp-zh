- pgno: 231
  md: 'Once I''ve included the header file, I can simply use the methods just like
    if they were actually declared on the original class.


    # Breaking up functionality using categories


    Another convenience that categories provide you is the ability to extract components
    of functionality from classes that have grown too large. In these cases, you might
    have a class containing a lot of code. Large class code can quickly become unwieldy
    when you need to modify them. Searching through lots of source code to find the
    method that you need to change can be made easier by extracting discrete parts
    of the functionality of the class into categories. In this way, when you go to
    make a change to a given class that impacts just a portion of its functionality,
    you can have all of the methods relating to that functionality in one category
    file, making it easier to make your changes.


    Obviously, you should try to keep your classes as simple as possible. You shouldn''t
    use a category as an excuse for adding excessive extra features to a given class.
    However, classes do have a tendency to grow orthogonally, and it''s nice to know
    that you have this tool available to you when the time comes for refactoring.


    # Extending class methods


    Categories are not limited to object methods. You can also use them to add class
    methods. For example, if you wanted to add a factory method to NSMutableString
    for the GUID category, you could simply add the factory method as shown in Listing
    8.4.


    # Listing 8.4

    Adding a factory method to NSMutableString


    ```

    #import <Foundation/Foundation.h>


    @interface NSMutableString (GUID)

    - (void)appendGUID;

    + (id)stringWithGUID;

    @end


    @implementation NSMutableString (GUID)

    - (void)appendGUID

    {

    }


    ```'
