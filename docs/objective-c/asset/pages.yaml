    # Understanding Collections and Memory Management


    You have to be careful when working with collections in a non-garbage collected
    memory environment. When an object is removed from the collection, it is released.
    This has several implications for you as a developer.


    First and foremost, because the collection will be retaining objects that are
    added to it, you do not need to retain those objects outside of the collection
    if you don’t have some other good reason to do so. You can assume that by placing
    the object into the collection, that the collection then owns it. When the collection
    is deallocated, it sends a release to each of the objects in'
  merge: -1
  img_proc: true
- pgno: 303
  md: 'the collection, so you do not need to be concerned about the potential for
    memory leaks, because the collection fulfills that part of the memory management
    contract.


    Secondly, because objects are released when removed from a collection, the possibility
    that a given object that you intend to continue to use but which is being removed
    from a collection, may be released without your being aware of it. Listing 13.13
    shows an example of this problem when using an NSMutableArray.


    # Listing 13.13


    # Error when removing an object from an NSMutableArray


    ```

    NSMutableArray *array = [NSMutableArray arrayWithObjects:@"foo", @"bar", @"baz",
    nil];


    NSString *item = [array objectAtIndex:1];


    [array removeObjectAtIndex:1]; // item is released here.


    NSLog(@"%@", item); // error!!

    ```


    The error in this code occurs because although you have retrieved the object from
    the array, you have not retained it. As long as you do not remove the object from
    the array, it is still retained by the array and therefore can be manipulated
    at will. However, if you remove the object from the array, it is immediately released.
    Therefore, accessing the method on the object as shown here causes an error.


    The correct way to write this code is to retain the object that you have retrieved
    from the array prior to removing it from the array. Listing 13.14 shows the same
    code corrected.


    # Listing 13.14


    # The correct way to remove an object you wish to continue using


    ```

    NSMutableArray *array = [NSMutableArray arrayWithObjects:@"foo", @"bar", @"baz",
    nil];


    NSString *item = [array objectAtIndex:1];


    [item retain]; // keep it around!

    ```'
