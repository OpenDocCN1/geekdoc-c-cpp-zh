  md: 'thread. Additionally, you can use it to force a collection by using the methods
    collectExhaustively or collectIfNeeded.


    A list of the methods available on the NSGarbageCollector class are shown in Table
    4.1


    | Table 4.1 Commonly Used NSGarbageCollector Methods |

    | Method | Purpose |

    | +defaultCollector | Returns the NSGarbageCollector singleton for the current
    thread. |

    | -disable/-enable | Disables or enables garbage collection temporarily. |

    | -isEnabled | Returns YES if garbage collection is currently enabled, otherwise
    NO. |

    | -collectExhaustively | Triggers an exhaustive collection of garbage objects.
    |

    | -collectIfNeeded | Triggers a collection, but only if memory consumption has
    grown beyond thresholds since the last collection. |

    | -disableCollectionForPointer: | Causes the given pointer to become a root object,
    and thus ineligible for collection. |

    | -enableCollectionForPointer: | Removes the given pointer from the list of root
    objects, making it eligible for collection. |


    # Understanding What Memory Management Model to Use for Your Projects


    Perhaps the most important thing to understand about garbage collection is when
    it’s appropriate to be used and when it’s not appropriate to be used. For certain,
    in many cases garbage collection is not a good choice for your application. As
    I’ve mentioned before, it’s only available on MacOS X Versions 10.5, and later.
    If your code needs to run on any other platform, including iPhone or iPad, garbage
    collection isn’t even an option for you. In addition to this, however, if you
    have an application that does not use garbage collection, and which has a large
    existing code base that is using reference counted memory management, it probably
    doesn’t make sense to convert it to garbage collection. The effort required to
    do so may be prohibitive.


    Finally, because the garbage collector is slightly less efficient with regard
    to how many objects are actively alive in the application at any given time, the
    deallocated objects aren’t truly deallocated until the collector finds them. Additionally,
    the garbage collector itself must utilize CPU cycles in order to do its work.
    If either of these are a consideration for you, then using garbage collection
    in your application may not be an appropriate choice.


    However, using garbage collection in your application can also have significant
    advantages. For example, generally speaking, applications using garbage collection
    are easier to make thread safe. This is because accessors can become simple assignment
    operations that no longer require thread locks to be thread-safe.'
  merge: -1
  img_proc: true
- pgno: 155
  md: 'Garbage collected applications typically are also easier to code. The lack
    of necessity for maintaining weak references to delegates, and so on results in
    simpler code that is easier to maintain.


    Finally, and most obviously, the ability to practically ignore the typical boilerplate
    code required for reference counted memory management is a huge win. They say
    that the best code, and the most bug free code, is code that you don’t have to
    write at all. Certainly, garbage collection helps to reduce the opportunities
    for bugs in your code by reducing the amount of code you have to write.


    Remember that you should use the highest level of abstraction that will achieve
    your goals while working within the performance parameters that you require. Meaning,
    if you can use garbage collection, and it will perform adequately for your problem
    domain, then you should. If garbage collection results in subpar performance for
    your particular problem domain, then don’t use it. One of the greatest advantages
    that Objective-C provides developers is the ability to easily move up and down
    the framework stack and use the level of abstraction that most easily solves the
    problems that need solving.


    # Summary


    This chapter may be one of the most important chapters in this book. An understanding
    of memory management technologies and proper use of both reference counting and
    garbage collection is a vital skill for all Objective-C programmers. In this chapter,
    I introduced you first to the traditional memory management model of Objective-C,
    reference counting. I’ve shown you how to allocate memory in your objects, and
    how to free that memory when you’re no longer using it. I also show you how to
    use the new technology available on MacOS X, garbage collection. Garbage collection
    can make your code simpler and less bug-prone than traditional reference counted
    memory management. You must decide for yourself which memory management technology
    is appropriate for your project. However, I hope that I have given you sufficient
    tools to be able to make that decision effectively.'
  merge: -1
  img_proc: true
