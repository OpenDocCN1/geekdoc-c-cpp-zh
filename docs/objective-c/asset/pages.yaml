    # Using specialized collections


    A few collection classes serve specific narrow purposes. Although they are rarely
    used, it’s nice to know that they exist, if you need them; these are NSPointerArray,
    NSHashTable, and NSMapTable. They are primarily used in garbage collected environments
    for specialized collections requiring weak relationships.


    Each of them provides an interface that is similar to, but does not inherit from
    a specific type of collection. NSPointerArray for NSArray, NSHashTable for NSSet,
    and NSMapTable for NSDictionary.


    Because of their similarity of purpose and their rarity of use, I won’t belabor
    this subject by going into a great amount of detail on every one of these, however,
    it can be useful to look at one of these three, NSPointerArray, for the purposes
    of example since the design pattern used in its construction is similar enough
    to the other two as to not require additional explanation.


    The class NSPointerArray is probably one of the most powerful of these specialized
    collection classes. It specifies an NSArray like interface but allows for the
    insertion of null values and arbitrary pointers. Additionally, by specifying certain
    options when creating an instance of NSPointerArray, you can configure your array
    to have specific memory management policies with regard to the objects stored
    within it. For example, you can specify that objects that get reclaimed by the
    garbage collector get replaced by a NULL value. To do this, you create a zeroing
    weak memory configuration by using the NSPointerFunctionsZeroingWeakMemory option.


    You specify the options for your instance of NSPointerArray when you create it
    using the methods -initWithOptions: or -initWithPointerFunctions:. When using
    the method -initWithOptions:, you are specifying that the array that you are creating
    will obey the policies set forth by the options that you are passing as a parameter.
    The options, which are specified using a bitwise-or, set specific policies or
    “personalities” for the array. For example, to create an array to store standard
    C-style strings that require strcmp to compare them and malloc/free for memory
    management, you do something like Listing 13.15.'
