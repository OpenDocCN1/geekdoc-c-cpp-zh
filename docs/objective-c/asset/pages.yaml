    \ *string2 = [foo valueForKeyPath:@\"bar.stringOnBar\"];\n```\n\nSo, as you can\
    \ see, literally speaking, you can specify the name of the attribute that you\
    \ want to access using a string, and you can read its value or you can write its\
    \ value. You can even, as shown in the case where you are accessing the attributes\
