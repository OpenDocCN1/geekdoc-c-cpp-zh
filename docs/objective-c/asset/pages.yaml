- pgno: 210
  md: '# Working with Protocols


    Objective-C does not feature multiple inheritance, which has advantages as well
    as disadvantages. It is advantageous because multiple inheritance results in complicated
    issues that can be difficult to resolve. However, it is also a disadvantage because
    there are times when you want to have a class, which implements a specific interface
    without necessarily inheriting from the class that specifies that interface. Thankfully,
    the designers of Objective-C included a feature to address exactly this situation,
    protocols.


    Essentially, a protocol defines an interface that can be implemented by multiple
    other classes without the use of inheritance. This enables you to mix and match
    functionality on a given class so that the class can be adapted to different uses.


    # Favoring Composition Over Inheritance


    An object oriented design axiom known as "favor composition over inheritance"
    means that rather than always turning to inheritance as a tool for extending functionality
    of a given class, you should instead first try to solve the problem by using other
    classes compositionally within your class. For example, if you needed to implement
    a class that provided an interface between a network service and your application,
    instead of inheriting from a socket class (a class that gives you access to network
    resources), you should include another object in your class, which provides that
    network connectivity. You should "compose" your design from other reusable components.
    Building your designs in this way results in more flexibility, because those bits
    and pieces that you are composing together to solve a given problem can later
    be swapped out and changed to solve another problem. This is an incredibly powerful
    design philosophy and one which you should strive for in your code.


    It is certainly possible to follow this design philosophy simply by using standard
    object oriented techniques. However, designing components for reuse causes complications.


    # In This Chapter


    +   - Solving object-oriented design problems with protocols

    +   - Implementing protocols for your classes

    +   - Adopting protocols

    +   - Working with optional methods

    +   - Understanding formal versus informal protocols'
  merge: -1
