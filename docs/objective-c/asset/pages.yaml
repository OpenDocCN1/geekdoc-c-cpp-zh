- pgno: 237
  md: 'would want to use this for the purposes of actually hiding private methods
    from users of your class. Considering the fact that I just demonstrated to you
    that using categories, if a developer were sufficiently motivated, he or she could
    easily crack open your class and access any private methods they so desired, I
    think any attempt to prevent such access is kind of futile.


    However, I can think of cases where you may want to expose particular methods
    to particular users of your classes and simply not include it as part of your
    documented public API. For example, if you are a proponent of unit testing, you
    may want to be able to test “non-public” methods without having to expose them
    in the public class declaration. Non-public methods might be methods that simply
    have no place in the public API, or no use outside of the class. In this case,
    anonymous categories may be an excellent solution for you.


    # Associating Variables with Existing Classes


    Categories are incapable of adding new member variables to the class that they
    are extending. While this may seem like a limitation in categories, in practice
    it’s not so bad. In cases where you really need to add member variables to a class
    that you’re extending, you can easily subclass class and do it that way. However,
    there are cases where you really don’t want to subclass but you really do need
    to add some additional variables to the class that you are extending. Fortunately,
    as of MacOS X version 10.6 and iOS 3.2, there is a low-level capability built
    into the Objective-C runtime for doing exactly this. It is a capability which
    is leveraged by the runtime itself, and one which you can use in extreme cases
    when you need to associate a variable with an existing object without subclassing
    and without changing the class declaration of that object. This technique is called
    associative references. It is available regardless of whether it’s through a category
    or not. I will show you how to use it, and then show you how to implement a category
    for cached sorted keys on the NSMutableDictionary class using it.


    Before I get too deeply into this, I want to clear up any confusion that may occur.
    When working with associative references, you will not actually be adding a member
    variable to the class itself. It will not have a property associated with it.
    It will not have an accessor associated with it. At its heart, associative references
    are simply storage associated with a specific instance of your class. Notice that
    I didn’t say that its storage associated with the class. If you do not explicitly
    associate a reference with a given instance of your class it will not have it.


    To add an associative reference to an instance of your class you simply use the
    Objective-C runtime function objc_setAssociatedObject. This function takes four
    arguments, the object you wish to associate the data with, a key so that you can
    retrieve the data later, the value you want to store the reference, and finally
    an association policy, which defines how the stored values memory is managed.


    After an association is created, you can access the value stored in the Association
    by using the Objective-C runtime function objc_getAssociatedObject. This function
    takes two parameters, the first is the object with which the data is associated,
    and the second is the key that you specified when associating the data in the
    first place.'
  merge: -1
