  md: "# Listing 9.1\n\n# Some preprocessor directives or macros\n\n```\n#define FOO\
    \ 1\n#ifde f BAR\n#endif\n#define BAZ(X, Y) NSLog(@\"%s - %s\", (X), (Y));\n#import\
    \ <Foundation/Foundation.h>\n```\n\nEach of these items is a preprocessor directive.\
    \ The #define is defining a constant called FOO with a value of 1. The #ifdef\
    \ and #endif are defining a conditional block of code that will only be compiled\
    \ if BAR has been defined. #define BAZ(X, Y) NSLog(@\"%s - %s\", (X), (Y)); is\
    \ a preprocessor function, which takes parameters and logs them. Finally, the\
    \ #import directive, which you have seen before, loads the given header file and\
    \ puts its source code inline into this source file.\n\nThese directives are expanded\
    \ during the compilation process, not at runtime. Therefore, the things they do\
    \ impact the source code before it’s actually compiled. In some ways, you can\
    \ think of preprocessor macros as a means for writing programs that manipulate\
    \ your source code when it’s compiling.\n\n# Understanding how macros work\n\n\
    This idea of manipulating your source code while it’s being compiled is an interesting\
    \ concept. Take a look at Listing 9.2. In this code, there is a particular string\
    \ constant, @\"MY_IMPORTANT_DATA\", which is used over and over again to access\
    \ items from NSUserDefaults.\n\n# Listing 9.2\n\n# Code that uses a string to\
    \ access an item from NSUserDefaults\n\n```\n#import <Foundation/Foundation.h>\n\
    \nint main (int argc, const char * argv[])\n{\n    NSAutoreleasePool * pool =\
    \ [[NSAutoreleasePool alloc] init];\n```"
