- pgno: 100
  md: 'This is a tremendously powerful capability, and one that you will leverage
    continually in your programming career. Polymorphism gives object-oriented programming
    its real power.


    # Using the id datatype


    I want to introduce one more concept to you before we actually start looking at
    real code in this chapter. It is the concept of the id datatype. The id datatype
    is a special data type in Objective-C that essentially means any object. It can
    be used in any location where an object type would normally be used.


    For the most part, you will not need to use the id datatype directly in your code.
    However, you will probably see cases where the id datatype is used in the Cocoa
    or Cocoa Touch libraries. Particularly, in areas such as arrays, dictionaries,
    and so on. In these cases, it is the use of the id datatype, and the fact that
    it can masquerade as any class at all, that give Objective-C its dynamic typing
    capabilities.


    You might ask yourself, “Why not use id all the time? Then I don’t have to worry
    about declaring my actual object types.” Unfortunately, because the compiler can’t
    know at compile time what type of object you’re working with when you use an id
    datatype in place of a more specific type name, it opens up the possibility for
    errors within your code that could have been caught by the compiler otherwise.
    Also, the additional overhead required to look up the data type at runtime can
    cause method calls to objects declared as an id datatype to be slightly slower
    than those with more specific data types. Therefore, generally speaking, it is
    better for you to declare your objects to be of a specific type rather than using
    the id datatype. That said, however, it is important for you to understand the
    concept of the id datatype so that you can use it in those rare occasions when
    you need it.


    > NOTE

    > You use the id datatype for your initialization methods.


    # Creating classes


    Now that I’ve introduced you to the general concepts of object-oriented programming,
    classes, inheritance, and polymorphism, in the following sections, I show you
    how to actually create classes and how to use them in your code.


    # Working with class files


    Classes are defined by using two separate files. The first is the interface file.
    Interface files are created with an extension of .h. Within this file you declare
    the interface of your class. An example of this is shown in Listing 3.1.'
