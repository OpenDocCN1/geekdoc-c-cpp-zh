- pgno: 260
  md: 'Each of the three categories of errors I previously mentioned call for different
    design patterns in terms of how you handle interrupting program flow when the
    errors occur. When designing an API that has the potential to return an error,
    think of the users of the API and how the handling of the potential errors that
    can occur will impact the design of the code required to call your API. Ideally,
    you want to design your API so that the developer using it can do so while providing
    the smallest amount of infrastructure possible while at the same time being capable
    of capturing and handling any potential error conditions that might occur.


    If your errors are minor and obvious and require little external (developer side)
    support or intervention, then you might consider using a return code to indicate
    that a particular call has failed. On the other hand, if the error condition that
    has occurred is so extreme that you absolutely have to completely bring the application
    to a halt in order to avoid more damage to the system, then using an exception
    may be the way to go. You have to assume that if the exception is not handled
    by users of your API that the application will crash, because that''s exactly
    what an exception does. Looking at exceptions from this point of view, that is,
    by viewing an un-handled exception as a crash, really puts this sort of error
    condition into perspective and may help you to think about when exceptions are
    really justified (clue: very rarely).


    Finally, for most other error conditions — the ones that fall between extremely
    minor and extremely serious — the NSError mechanism is probably the right choice.
    It communicates easily the fact that a call failed up the stack to the caller,
    but at the same time puts the responsibility for deciding how serious the error
    is where it belongs, in the hands of that very same caller.


    # Using the Different Mechanisms for Error Handling


    So, let’s get down to the nitty-gritty of how to use these three different error
    handling techniques. In the following sections, I cover how to use the three different
    error handling capabilities built into Objective-C, how they work in your code,
    and what you need to do to handle errors that occur in other people’s code.


