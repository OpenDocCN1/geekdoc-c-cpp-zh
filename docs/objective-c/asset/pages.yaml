  md: "arbitrary dynamic data as well. This class is the NSData class. This class\
    \ provides an object-oriented interface for a dynamically allocated byte buffer.\
    \ You can use it to store any arbitrary chunk of bytes either directly or by copying\
    \ the bytes from an allocated buffer. You can also use it to write that data out\
    \ to disk as well.\n\n# Using NSValue and NSNumber\n\nNow that I’ve introduced\
    \ you to each of these classes, in the next sections, I show you how to use them.\
    \ I start with the NSValue and NSNumber classes, and then proceed on to NSData\
