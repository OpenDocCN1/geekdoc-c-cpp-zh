  md: "# Declaring code blocks\n\nIn this section, I introduce you to what block looks\
    \ like in Objective-C. Listing 5.2 shows an example of a simple block.\n\nListing\
    \ 5.2\n\n# A simple block in Objective-C\n\n```\nint main (int argc, const char\
    \ * argv[])\n{\n    NSAutoreleasePool * pool = [[NSAutoreleasePool alloc] init];\n\
    \    \n    void (^myBlock)(NSString *x);\n    \n    myBlock = ^(NSString *x)\n\
    \    {\n        NSLog(@\"%@\", x);\n    };\n    \n    [pool drain];\n    return\
    \ 0;\n}\n```\n\nA block, at its heart, is a variable like any other variable.\
    \ What makes blocks different is that the data stored inside the block is the\
    \ body of a function. When using a block, you can call the function just like\
    \ any standard function, passing it arguments and receiving a return value from\
    \ it.\n\nIn the case of this code, the variable that holds the block is called\
    \ \"myBlock\". First, you declare the variable with the line void (^myBlock) (NSString\
    \ *). Normal variables, when declared, are relatively simplistic. Normal variables\
    \ do not need to have arguments passed to them, nor do they return values. A block,\
    \ on the other hand, is stored in a variable and does have to have its arguments\
    \ and return type declared. Therefore, its declaration is more complex than that\
    \ of a traditional variable.\n\nA block declaration consists of its return type\
    \ (in this case, void). The return type of the block is placed at the location\
    \ where you normally expect to see the type definition of the variable you are\
    \ declaring. In a block declaration, however, you are declaring the value type\
    \ that will be returned from the block when it is executed.\n\nFollowing the return\
    \ type definition, there is a special operator that is used to tell the compiler\
    \ that you are defining a block instead of another type of variable. This operator\
    \ is the ^ character."
