  md: "# Listing 3.2\n\n# An example implementation file\n\n```\n#import \"Foo.h\"\
    \n\n@implementation\n@synthesize someVariable;\n@synthesize someOtherVariable;\n\
    \n-(void)someMethod\n{\n    // body of method\n}\n\n-(BOOL)someOtherMethodWithArg:(NSString\
    \ *)param andAnotherArg:(int)param2\n{\n    // body of method\n}\n\n@end\n```\n\
    \nAgain, we have a special syntax that tells the compiler that we are creating\
    \ an implementation. This syntax is the @implementation directive. Just like the\
    \ @interface directive, you include the name of the class that we are defining\
    \ after it. Between the @implementation and the @end directive is where we define\
    \ all the methods that will be used in our class.\n\nJump back into the interface\
    \ file and take a closer look at how we encapsulate data in our class.\n\n# Writing\
    \ object methods\n\nObject methods are methods that are defined as part of a class\
