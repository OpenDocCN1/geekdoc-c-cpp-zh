  md: "objects. To encode an object into an NSCoder, you use the NSCoder methods -encodeObject:\
    \ or -encodeObject:forKey:. Not all NSCoder instances work the same. Some support\
    \ keyed archiving and some do not. To determine if your instance of NSCoder supports\
    \ keyed archiving, use the method -allowsKeyedCoding. This method returns YES\
    \ if the instance of NSCoder supports keyed archiving. Any object which supports\
    \ the NSCoding protocol can be encoded using the -encodeObject... methods. Most\
    \ low level Foundation classes such as NSString, NSArray, and NSDictionary all\
    \ do. An example implementation of an -encodeWithCoder: method encoding objects\
    \ is shown in Listing 18.1.\n\n# Listing 18.1\n\n# A simple -encodeWithCoder:\
    \ implementation\n\n```\n@interface MyClass : NSObject <NSCoding>\n{\n    Foo\
    \ *memberVariable;\n    Bar *anotherVariable;\n    NSArray *someMemberArray;\n\
    }\n@end\n\n@implementation MyClass\n...\n-(void)encodeWithCoder:(NSCoder *)inCoder\n\
    {\n    if([inCoder allowsKeyedCoding])\n    {\n        [inCoder encodeObject:memberVariable\
    \ forKey:@\"memberVariable\"];\n        [inCoder encodeObject:anotherVariable\
    \ forKey:@\"anotherVariable\"];\n        [inCoder encodeObject:someMemberArray\
    \ forKey:@\"someMemberArray\"];\n    }\n    else\n    {\n        [inCoder encodeObject:memberVariable];\n\
