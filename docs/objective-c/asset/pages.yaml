  md: 'code that you used in the previous solution. A design pattern is a generalized,
    reusable solution to a specific programming problem that can be reused and reapplied
    within the scope of widely varying application architectures. Typically, experienced
    developers find themselves faced with the same general types of problems within
    the context of different applications. Often, the solution to these general problems
    can be applied in these different contexts, leveraging the knowledge and code
    that already exists. Typically, this is not a case where you reuse the code exactly
    from a previous solution, but instead, you use the same ideas that you used to
    solve the problem previously.


    As an example of a typical design pattern, imagine a situation where you might
    have two objects, object Foo and object Bar. Bar wants to be notified whenever
    a particular event occurs inside of object Foo. How would you approach this problem?


    What you might do in this circumstance is give Foo a reference to the Bar object
    such that whenever the event in question occurs, it knows to then call a method
    on Bar to tell Bar about it. This is a very common problem and a very common solution.
    The two of these together make up a design pattern. In fact, this particular design
    pattern is called the Delegate design pattern. Bar is becoming the delegate to
    the object Foo.


    There are usually two different states where a developer recognizes that it would
    be appropriate to use a particular design pattern. The first is in the design
    phase of an application. Studying design patterns can be useful because it enables
    developers when discussing abstract ideas about application design to have a sort
    of “lingua franca” with which to discuss particular solutions. In other words,
    instead of going to the trouble of describing the details of a given solution
    a developer, you can simply say, “Here we will use a Delegate to address this
    particular problem.” The other developer knows immediately what you’re talking
    about and could probably implement the solution with no additional information.
    This makes design patterns an absolutely vital tool in the expert developer’s
    arsenal.


    The second place that design patterns typically come up is when a developer is
    busy working away at a particular problem. The developer often finds himself faced
    with complex problems, which on the surface require complex solutions.


    Design Patterns train your mind to immediately respond with the correct solution
    to whatever programming problem is at hand.


    Because of these reasons, a detailed study of Design Patterns is almost always
    a good use of your time. If possible, you should strive to study design patterns
    by using resources specific to the language that you are using. In other words,
    study design patterns in Objective-C and Cocoa. However, there are probably more
    resources available for the generic study of Design Patterns using pseudocode
    than there is specific to Objective-C. Do not let this discourage you. Most of
    these resources are just as applicable in Objective-C.


