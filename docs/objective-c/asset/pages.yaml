  md: "# Listing 3.1\n\n# An interface file\n\n```\n#import <Foundation/Foundation.h>\n\
    \n@interface Foo : NSObject\n{\n    NSString *someVariable;\n    NSString *someOtherVariable;\n\
    \    NSArray *someArray;\n}\n@property (nonatomic, retain) NSString *someVariable;\n\
    @property (nonatomic, retain) NSString *someOtherVariable;\n\n- (void)someMethod;\n\
    - (BOOL)someOtherMethodWithArg:(NSString *)param andAnotherArg:(int)param2;\n\n\
    @end\n```\n\nAs you can see, the interface is declared by using a special syntax\
    \ of @interface Classname. Where Classname represents the name of the class that\
    \ you are defining. If your class is inheriting from some other class, you place\
    \ the name of the class you are inheriting from after your class name. In this\
    \ case, you are simply inheriting from NSObject.\n\nAfter the @interface line,\
    \ there is a block of code bracketed by curly braces. Within these curly braces\
    \ is where you define your class’s data. Variables defined within these curly\
    \ braces are considered to be within scope in any method defined as part of your\
    \ class.\n\nThe older runtime requires that all your member variables have to\
    \ be defined here, but the modern, 64-bit runtime, which is available in Mac OS\
    \ X 10.6 and iOS, does not. You can declare your member variables by simply declaring\
    \ them as properties. It doesn’t hurt anything to declare them additionally here,\
    \ however, so there’s nothing wrong with being in the habit of doing so.\n\nAfter\
    \ the curly braces, you define the method signatures for the methods that are\
    \ part of your class. Finally, you declare the end of your interface by using\
    \ the @end directive.\n\nAfter you have created the interface definition for your\
    \ class, you must also implement it. The implementation of your class is created\
    \ in a file with an .m extension. An example implementation for the class that\
    \ we just saw is shown in Listing 3.2."
