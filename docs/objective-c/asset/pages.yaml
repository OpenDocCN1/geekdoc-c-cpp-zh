  md: "```\nNSString *formatStr = @\"%s\";\n\nvoid (^myBlock)(char *x) = ^(char *x)\
    \ { NSLog(formatStr, x); };\n\ndoIt(myBlock);\n\n[pool drain];\nreturn 0;\n}\n\
    ```\n\nAs you can see, the block accesses a variable (formatStr) that is not passed\
    \ to it, but which comes from the environment from within which the block is created.\n\
    \nAgain, these variables are read-only inside the block. However, you can explicitly\
    \ make a variable read-write inside of any referencing blocks by using the special\
    \ language directive __block when declaring the variable.\n\nBecause of the ability\
    \ for blocks to “take a snapshot” of your application state, and make it available\
    \ to other parts of your application in this way, it provides an incredibly powerful\
    \ mechanism for encapsulating and manipulating your data.\n\nI will show you momentarily\
    \ some other cool uses for blocks, but before I do that, there is a small amount\
    \ of housekeeping that needs to be addressed.\n\n# Managing code block memory\n\
    \nIn Objective-C, blocks are objects, just like anything else. The data that makes\
    \ up a block is allocated on the stack just like normal variables. Therefore,\
    \ if you pass a block to another function or object, and that object needs to\
    \ store that block for later use, the receiving object must retain the block,\
    \ as though it were receiving an object passed to it.\n\nListing 5.8 shows an\
    \ example of how this works.\n\n# Listing 5.8\n\n# An object which stores a block\
    \ in a member variable\n\n```\n@interface Foo : NSObject\n{\n    void (^myBlock)(NSString\
    \ *);\n```"
