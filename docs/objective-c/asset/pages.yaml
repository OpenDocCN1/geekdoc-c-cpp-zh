    \ counts may seem complicated, but memorizing them can make working with Objective-C\
    \ much easier.\n\n+   Any object you create using a method call containing the\
    \ word alloc, copy, or create, is an object, and thus memory, that you own. You\
    \ are responsible for sending a release to that same object at some point in the\
