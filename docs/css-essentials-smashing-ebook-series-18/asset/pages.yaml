    ```\n\n# OVERRIDE INLINE STYLES IN USER-GENERATED CONTENT\n\nOne frustrating aspect\
    \ of CSS development is when user-generated content includes inline styles, as\
    \ would occur with WYSIWYG editors in CMS. In the CSS cascade, inline styles will\
    \ override regular styles, so any undesirable styling that occurs through generated\
    \ content will be difficult, if not impossible, to change using custom CSS rules.\
    \ You can circumvent this problem using an !important declaration, because a CSS\
    \ rule with !important in an author stylesheet will override inline CSS.\n\n#\
    \ FOR PRINT STYLESETS\n\nAlthough this wouldn't be necessary in all cases, and\
    \ might be discouraged in some cases for the same reasons mentioned earlier, you\
    \ could add !important declarations to your print-only stylesheets to help override\
    \ specific styles without having to repeat selector specificity."
