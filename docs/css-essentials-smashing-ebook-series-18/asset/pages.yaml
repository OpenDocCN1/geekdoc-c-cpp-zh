- img_proc: true
  md: "# What Does A Pseudo-Element Do?\n\nA pseudo-element does exactly what the\
    \ word implies. It creates a phony element and inserts it before or after the\
    \ content of the element that you've targeted.\n\nThe word \"pseudo\" is a transliteration\
    \ of a Greek word that basically means \"lying, deceit, false.\" So, calling them\
    \ pseudo-elements is appropriate, because they don't actually change anything\
    \ in the document. Rather, they insert ghost-like elements that are visible to\
    \ the user and that are style-able in the CSS.\n\n# Basic Syntax\n\nThe :before\
    \ and :after pseudo-elements are very easy to code (as most CSS properties that\
    \ don't require a ton of vendor prefixes). Here is a simple example:\n\n```\n\
    #example:before {\n  content: \"#\";\n}\n#example:after {\n  content: \".\";\n\
    }\n```\n\nThere are two things to note about this example. First, we're targeting\
    \ the same element using #example:before and #example:after. Strictly speaking,\
    \ they are the pseudo-elements in the code.\n\nSecondly, without the content property,\
    \ which is part of the generated content module in the specification, pseudo-elements\
    \ are useless. So, while the pseudo-element selector itself is needed to target\
    \ the element, you won't be able to insert anything without adding the content\
    \ property."
  merge: -1
  pgno: 226
- img_proc: true
  md: "In this example, the element with the id example will have a hash symbol placed\
    \ “before” its content, and a period (or full stop) placed “after” its content.\n\
    \n# SOME NOTES ON THE SYNTAX\n\nYou could leave the content property empty and\
    \ just treat the pseudo-element content-less box, like this:\n\n```\n#example:before\
    \ {\n  content: \"\"\n  display: block;\n  width: 100px;\n  height: 100px;\n}\n\
    ```\n\nHowever, you can't remove the content property altogether. If you did,\
    \ the pseudo-element wouldn't work. At the very least, the content property needs\
    \ empty quotes as its value.\n\nYou may have noticed that you can also code pseudo-elements\
    \ using the double-colon syntax (::before and ::after), which I've discussed before\
    \ that there is no difference between the two syntaxes; it's just a way to differentiate\
    \ pseudo-elements (double colon) from pseudo-classes (single colon) in CSS3.\n\
    \nOne final point regarding the syntax. Technically, you could implement a pseudo-element\
    \ universally, without targeting any element, like this:\n\n```\n:before {\n \
    \ content: \"#\"\n}\n```\n\nWhile the above is valid, it's pretty useless. The\
    \ code will insert a hash symbol before the content in each element in the DOM.\
    \ Even if you"
  merge: -1
  pgno: 227
- img_proc: true
  md: 'removed the <body> tag and all of its content, you''d still see two hash symbols
    on the page: one in the <html> element, and one in the <body> tag, which the browser
    automatically constructs.


    # Characteristics Of Inserted Content


    As mentioned, the content that is inserted is not visible in the page''s source.
    It''s visible only in the CSS.


    Also, the inserted element is by default an inline element (or, in HTML5 terms,
    in the category of text-level semantics). So, to give the inserted element a height,
    padding, margins and so forth, you''ll usually have to define it explicitly as
    a block-level element.


    This leads well into a brief description of how to style pseudo-elements. Look
    at this graphic from my text editor:'
  merge: -1
  pgno: 228
- img_proc: true
  md: "```\n#element:before {\n  content: \"#\";\n  display: block;\n  width: 200px;\n\
    \  height: 200px;\n}\n#element:after {\n  content: \".\";\n  display: block;\n\
    \  width: 200px;\n  height: 200px;\n}\n```\n\nIn this example, I've highlighted\
    \ the styles that will be applied to the elements inserted before and after the\
    \ targeted element’s content. Pseudoelements are somewhat unique in this way,\
    \ because you insert the content and the styles in the same declaration block.\n\
    \nAlso note that typical CSS inheritance rules apply to the inserted elements.\
    \ If you had, for example, a font stack of Helvetica, Arial, sans-serif applied\
    \ to the <body> element of the document, then the pseudo-element would inherit\
    \ that stack that are the same as any other element.\n\nLikewise, pseudo-elements\
    \ don’t inherit styles that aren’t naturally inherited from parent elements (such\
    \ as padding and margins)."
  merge: -1
  pgno: 229
- img_proc: true
  md: "# Before Or After What?\n\nYour hunch on seeing the :before and :after pseudo-elements\
    \ might be that the inserted content will be injected before and after the targeted\
    \ element. But, as alluded to above, that's not the case.\n\nThe content that's\
    \ injected will be child content in relation to the targeted element, but it will\
    \ be placed “before” or “after” any other content in that element.\n\nTo demonstrate\
    \ this, look at the following code. First, the HTML:\n\n```\n<p class=\"box\"\
    >Other content.</p>\n```\n\nAnd here's the CSS that inserts a pseudo-element:\n\
    \n```\np.box {\n  width: 300px;\n  border: solid 1px white;\n  padding: 20px;\n\
    }\n\np.box:before {\n  content: \"#\";\n  border: solid 1px white;\n  padding:\
    \ 2px;\n  margin: 0 10px 0;\n}\n```\n\nIn the HTML, all you would see is a paragraph\
    \ with a class of box, with the words “Other content” inside it (the same as what\
    \ you would see if you viewed the source on the live page). In the CSS, the paragraph\
    \ is given a set width, along with some padding and a visible border."
  merge: -1
  pgno: 230
- img_proc: true
  md: 'Then we have the pseudo-element. In this case, it''s a hash symbol inserted

    “before” the paragraph’s content. The subsequent CSS gives it a border,

    along with some padding and margins.


    Here’s the result viewed in the browser:


    ![](img/736c504465a39c9f3caa50d5252a3998_231_0.png)


    The outer box is the paragraph. The border around the hash symbol

    denotes the boundary of the pseudo-element. So, instead of being inserted

    “before” the paragraph, the pseudo-element is placed before the “Other

    content” in the paragraph.


    # Inserting Non-Text Content


    I mentioned briefly that you can leave the content property’s value as an

    empty string or insert text content. You basically have two additional options

    of what to include as the value of the content property.


    First, you can include a URL that points to an image, just as you would do

    when including a background image in the CSS:'
  merge: -1
  pgno: 231
- img_proc: true
  md: "```\np:before {\n  content: url(image.jpg);\n}\n```\n\nNotice that the quotes\
    \ are missing. If you wrapped the URL reference in quotes, then it would become\
    \ a literal string and insert the text “url(image.jpg)” as the content, instead\
    \ of inserting the image itself.\n\nNaturally, you could include a Data URI in\
    \ place of the image reference, just as you can with a CSS background.\n\nYou\
    \ also have the option to include a function in the form of attr(X). This function,\
    \ according to the spec, “returns a string as the value of attribute X for the\
    \ subject of the selector.\n\nHere’s an example:\n\n```\na:after {\n  content:\
    \ attr(href);\n}\n```\n\nWhat does the attr() function do? It takes the value\
    \ of the specified attribute and places it as text content as a pseudo-element.\n\
    \nThe code above would cause the href value of every <a> element on the page to\
    \ be placed immediately after each respective <a> element. This could be used\
    \ in a print style sheet to include full URLs next to all links when a document\
    \ is printed.\n\nYou could also use this function to grab the value of an element’s\
    \ title attribute, or even micro data values. Of course, not all of these examples\
    \ would be practical in and of themselves; but depending on the situation, a specific\
    \ attribute value could be practical as a pseudo-element."
