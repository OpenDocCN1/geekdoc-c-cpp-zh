  md: "What we've done is limited the scope of our CSS and isolated two visual patterns\
    \ into separate blocks of CSS: one for our navigation list and one for our menu\
    \ list. We've taken a small step towards modularizing our code and a step towards\
    \ decoupling the HTML from the CSS.\n\n# Classifying Code\n\nLimiting the depth\
    \ of applicability helps to minimize the impact that a style might have on a set\
    \ of elements much deeper in the HTML. However, the other problem is that as soon\
    \ as we use an element selector in our CSS, we are depending on that HTML structure\
