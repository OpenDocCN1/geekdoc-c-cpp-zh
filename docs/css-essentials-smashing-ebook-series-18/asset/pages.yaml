- img_proc: true
  md: "# GETNAMEDFLOW\n\nThis returns the flow that that particular region is associated\
    \ with. The properties available are:\n\n+   - overflow\n  A read-only boolean\
    \ that tells you whether all of the content of the named flow fits within the\
    \ regions that are part of the flow or whether it overflows.\n\n+   - contentNodes\n\
    \  A NodeList of all the content elements that belong to the flow.\n\n+   - getRegionsByContentNode\n\
    \  This returns all of the regions that a particular content element would flow\
    \ through. A very long paragraph might flow through more than one region; with\
    \ this method, you can retrieve all of the regions that that paragraph element\
    \ flows through.\n\n+   - regionLayoutUpdate\n  This event gets triggered every\
    \ time an update is made to the layout of a region. If the region's dimensions\
    \ are altered, then the child elements that are part of that region might alter,\
    \ too (for example, a few might move to another region, or more child elements\
    \ might become part of the region).\n\n# Exclusions\n\n+   - Draft specification\
    \ (a combination of two proposals: “Exclusions” and “Positioned Floats\")\n\n\
    +   - Demo\n\n+   - Browser support: IE 10+"
