  md: '+   * Efficient CSS Development Practices

    * CSS Performance

    * Font Embedding and Replacement


    # CSS3


    CSS3, the newest version of CSS supported by most browsers, is the primary thing
    you need to know in order to create modern CSS web sites, of course. CSS is a
    styling language, so it''s no surprise that most of what''s new in CSS3 is all
    about visual effects. But CSS3 is about more than progressive enhancement and
    pretty typography. It can also aid usability by making content easier to read,
    as well as improve efficiency in development and page performance.


    There are too many CSS3 techniques to cover in a single article, let alone an
    article that isn''t just about CSS3! So, we''ll go through the basics of the most
    important or supported CSS3 techniques and point you to some great resources to
    learn in-depth.'
  merge: -1
  pgno: 113
- img_proc: true
  md: '# CSS3 VISUAL EFFECTS


    # Semi-transparent Color


    Aids in: progressive enhancement, efficiency


    RGBA allows you to specify a color by not only setting the values of red, green,
    and blue that it''s comprised of, but also the level of opacity it should have.
    An alternative to RGBA is HSLA, which works the same way, but allows you to set
    values of hue, saturation, and lightness, instead of values of red, green, and
    blue. The article Color in Opera 10 — HSL, RGB and Alpha Transparency explains
    how HSLA can be more intuitive to use RGBA.


    ![](img/736c504465a39c9f3caa50d5252a3998_114_0.png)


    The 24 Ways web site makes extensive use of RGBA to layer semi-transparent boxes
    and text over each other.'
  merge: -1
  pgno: 114
- img_proc: true
  md: 'RGBA or HSLA isn’t just about making things look cool; it can also improve
    your web site’s efficiency. You don’t have to take time to make alpha-transparent
    PNGs to use as backgrounds, since you can just use a color in the CSS, and the
    user agent doesn’t have to download those images when loading the site.


    # Styling Backgrounds and Borders


    Aids in: progressive enhancement, efficiency


    CSS3 offers a whole host of new ways to style backgrounds and borders, often without
    having to use images or add extra divs. Most of these new techniques already have
    good browser support, and since they’re mainly used for purely cosmetic changes,
    they’re a good way to get some progressive enhancement goodness going in your
    sites right away.


    Here are some of the new things CSS3 lets you do with backgrounds:


    +   - Multiple backgrounds on a single element: You can now add more than one
    background image to an element by listing each image, separated by commas, in
    the background-image property. No more nesting extra divs just to have more elements
    to attach background images onto!


    +   - More control over where backgrounds are placed: The new background-clip
    and background-origin properties let you control if backgrounds are displayed
    under borders, padding, or just content, as well as where the origin point for
    background-position should be.'
  merge: -1
  pgno: 115
- img_proc: true
  md: '+   Background sizing: You can scale background images using the new background-size
    property. While scaling won''t look good on many background images, it could be
    really handy on abstract, grunge-type backgrounds, where tiling can be difficult
    and where some image distortion would be unnoticeable.


    +   Gradients: While just part of a CSS draft spec, Safari, Chrome and Firefox
    support declaring multiple color and placement values in the background-image
    property to create gradients without images. This allows the gradients to scale
    with their container — unlike gradients — and eliminates the need for page users
    to download another image while viewing your site.


    CSS3 lets you to do the following with borders:


    +   Rounded corners: Use the border-radius-property to get rounded corners on
    divs, buttons, and whatever else your heart desires — all without using images
    or JavaScript.


    +   Images for borders: With CSS 2.1, the only way to create a graphic border
    was to fake it with background images, often ones pierced together on multiple
    divs. You can add new borders without having to use background images by adding
    the images to the borders directly, using the new border-image property, which
    allows you to control how the images scale and tile.'
  merge: -1
  pgno: 116
- img_proc: true
  md: '![](img/736c504465a39c9f3caa50d5252a3998_117_0.png)


    The border-radius property can be used to round corners and even create circles
    out of pure CSS, with no images needed. (Stunning CSS3 web site)


    # # Drop Shadows


    Aids in: progressive enhancement, adaptability, efficiency


    Drop shadows can provide some visual polish to your design, and now they''re possible
    to achieve without images, on both boxes and on text.


    The **box-shadow property** has been temporarily removed from the CSS3 spec, but
    is supposed to making its re-appearance soon. In the meantime, it''s still possible
    to get image-free drop shadows on boxes in Firefox and Safari/Chrome using the
    **-moz-box-shadow** and **-webkit-box-shadow** properties, respectively, and in
    Opera 10.5 using the regular **box-shadow** property with no prefix. In the property,
    you set the shadow''s horizontal and vertical offsets from the box, color, and
    can optionally set blur radius and/or spread radius.'
  merge: -1
  pgno: 117
- img_proc: true
  md: '![](img/736c504465a39c9f3caa50d5252a3998_118_0.png)


    The Cherry web site uses drop shadows created with box-shadow on many boxes and
    buttons.


    The **text-shadow property** adds drop shadows on — you guessed it — text. It''s
    supported by all the major browsers except — you guessed it — Internet Explorer.
    This makes it the perfect progressive enhancement candidate — it''s simply a visual
    effect, with no harm done if some users don''t see it. Similarly to box-shadow,
    it takes a horizontal offset, vertical offset, blur radius and color.'
  merge: -1
  pgno: 118
- img_proc: true
  md: 'Using text-shadow keeps you from resorting to Flash or images for your text.
    This can speed up the time it takes you to develop the site, as well as speed
    up your pages. Avoiding Flash and image text can also aid accessibility and usability;
    just make sure your text is still legible with the drop shadow behind it, so you
    don''t inadvertently hurt usability instead!


    # Transforms


    Aids in: progressive enhancement, adaptability, efficiency


    CSS3 makes it possible to do things like rotate, scale, and skew the objects in
    your pages without resorting to images, Flash, or JavaScript. All of these effects
    are called "transforms." They’re supported in Firefox, Safari, Chrome, and Opera
    10.5.


    You apply a transform using the transform property, naturally (though you''ll
    need to use the browser-specific equivalents: -moz-transform, -webkit-transform,
    and -o-transform). You can also use the transform-origin property to specify the
    point of origin from which the transform takes place, such as the center or top
    right corner of the object.


    In the transform property, you specify the type of transform (called “transform
    functions”), and then in parentheses write the measurements needed for that particular
    transform. For instance, translate(10px, 20px) would move the element 10 pixels
    to the right and 20 pixels down from its original location in the flow. Other
    supported transform functions are scale, rotate, and skew.'
  merge: -1
  pgno: 119
- img_proc: true
  md: '![](img/736c504465a39c9f3caa50d5252a3998_120_0.png)


    The BeerCamp SXSW 2010 site scales and rotates the sponsor logos on hover.


    # Animation and Transitions


    Aids in: progressive enhancement, efficiency


    Animation is now no longer the solely the domain of Flash or JavaScript — you
    can now create animation in pure HTML and CSS. Unfortunately, CSS3 animation and
    transitions do not have very good browser support, but with most of the effects
    we''ve talked about so far, they''re great for adding a little non-essential flair.


    CSS3 transitions are essentially the simplest type of animation. They smoothly
    ease the change between one CSS value to another over a specified duration of
    time. They''re triggered by changing element states, such as hovering. They''re
    supported by Safari, Chrome, and Opera 10.5.


    To create a transition, you all have to do is specify which elements you want
    to apply the transition to and which CSS properties will transition, using the
    **transition-property** property. You''ll also need to add a'
  merge: -1
  pgno: 120
- img_proc: true
  md: 'transition-duration value in seconds ("s" is the unit), since the default time
    a transition takes is 0 seconds. You can add them both in the transition shorthand
    property. You can also specify a delay or a timing function to more finely tune
    how the two values switch.


    Beyond transitions, full-fledged animations with multiple keyframes are also possible
    with CSS3 (but currently only supported in Safari/Chrome). First, you give the
    animation a name and define what the animation will do at different points (keyframes,
    indicated with percentages) through its duration. Next, you apply this animation
    to an element using the animation-name, animation-duration, and animation-interaction-count
    properties. You could also set a delay and timing function, just like with transitions.


    # CSS3 USABILITY / READABILITY ENHANCEMENTS


    Most the CSS3 techniques we''ve gone over so far have been purely cosmetic effects
    that aid progressive enhancement. But CSS3 can also be used to improve the usability
    of your pages.


    # Creating Multiple Columns of Text


