  md: "+   • Browser support: IE 10+\n\nGrid properties allow you to throw block-level\
    \ elements into a grid cell, irrespective of the flow of content within the grid\
    \ parent element. An element becomes a grid when display is set to grid. You can\
    \ then set the number of columns and rows with the grid-columns and grid-rows\
    \ properties, respectively. You can then declare each child selector itself as\
    \ part of a grid cell, like so:\n\n```\n#title {\n  grid-column: 1; grid-row:\
    \ 1;\n}\n\n#score {\n  grid-column: 2; grid-row: 1;\n}\nnYou can also use a template\
    \ to plan the grid:\nbody {\n  grid-template: \"ta\"\n    \"sa\"\n    \"bb\"\n\
    \    \"cc\";\n}\n```\n\nIn this syntax, each string refers to a row, and each\
    \ character refers to a grid cell. In this case, the content of grid cell represented\
    \ by the character a spans two rows but just one column, and the content represented\
    \ by b spans two rows but just one row.\n\nNow you can set any of the child element’s\
    \ grid-cell position:\n\n```\n#title {\n  grid-cell: 't';\n}\n```"
  merge: -1
  pgno: 274
- img_proc: true
  md: 'This will make the element with the ID title within the body element to be
    positioned in the grid cell represented by the character t in the grid-template
    property.


    If you are not using grid-template, you can also declare how many columns or rows
    a particular element should occupy with the grid-row-span and grid-column-span
    properties.


    # Flexbox


    +   - W3C Editor’s Draft

    - Demo

    - Browser support: WebKit Nightlies


    Flexbox allows you to distribute child elements anywhere in the box (giving us
    the much-needed vertical centering), along with flexible units that let you control
    the fluidity of the child elements'' dimensions.


    Note that this specification has changed substantially since it was first proposed.
    Previously, you would invoke Flexbox for an element with display: box, but now
    you would use display: Flexbox to do so. Child elements can be vertically aligned
    to the center with flex-pack:center and horizontally aligned to the center with
    flex-align:center. Also note that all elements that obey the Flexbox need to be
    block-level elements.


    # How Do Various Properties Interact With Each Other?


    You might wonder how to use these properties in combination. The following table
    shows which of these features can be combined.'
  merge: -1
  pgno: 275
- img_proc: true
  md: '| Paged Media | Multiple Columns | Regions | Exclusions | Grid | Flexbox |

    | --- | --- | --- | --- | --- | --- |

    | Paged Media | ✓ | | | | |

    | Multiple Columns | ✓ | ✓ | ✓ | ✓ | |

    | Regions | | ✓ | ✓ | ✓ | |

    | Exclusions | | ✓ | ✓ | ✓ | |

    | Grid | | | | | ✓ |

    | Flexbox | | | | | | |


    As you can see, the multiple-column properties can be used in conjunction with
    generated content for paged media, regions and exclusions. But grid, Flexbox and
    regions are mutually exclusive (i.e. if an element is a grid, it cannot be a Flexbox
    or a region). Do note that, while Alan Stearns says in the comments, while a grid
    container cannot be a Flexbox or a region, a grid cell could become a region,
    or a Flexbox item could be a region.


    # A NOTE BEFORE YOU RUSH OUT USE THEM IN CLIENT PROJECTS


    The specifications are always changing, so be careful with them. Except for multiple
    columns, I would recommend using these strictly in personal projects and demos.
    The syntaxes and properties used in some of the demos are different from what
    you would find in the actual specifications, because they have changed since the
    builds that support a previous version'
  merge: -1
  pgno: 276
- img_proc: true
  md: 'of the specification came out. Also, because they are still unstable, all of
    these properties are vendor-prefixed, which means you have to add support for
    each prefix as support is added.


    If you use these features, just make sure that the content is readable in browsers
    that do not support them. The easiest way to do this would be to use feature detection
    and then use CSS to make the content readable when the feature is unsupported.


    # Help The Working Group!


    Do these layout sponsals sound exciting to you? Jump on the [www-style mailing
    list]() to provide feedback on them! Just note that the mailing list will flood
    your inbox, and you should carefully filter the emails so that you pay attention
    only to the drafts you are interested in.


    Write demos and test how these work, and if you find bugs in the builds that have
    these properties, provide feedback to the browser vendors and submit bug reports.
    If you have suggestions for changing or adding properties to these proposals,
    do write in in the mailing list (or you can [bug me on Twitter](!)


    These are exciting times, and within a few years the way we lay out Web pages
    will have changed dramatically! Perhaps this will finally sound the death knell
    of print. (Just kidding.)'
