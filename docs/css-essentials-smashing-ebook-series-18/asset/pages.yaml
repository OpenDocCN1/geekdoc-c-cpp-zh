    # The box-sizing Property


    Aids in: efficiency


    In addition to the div-conserving properties we''ve already talked about, the
    box-sizing property can also help limit your div use in certain situations.


    In the traditional W3C box model of CSS 2.1, the value you declare for a width
    or height controls the width or height of the content area only, and then the
    padding and border are added onto it. (This is called the contentbox model.) If
    you''ve worked with CSS for a while, you''re probably used to the content-box
    box model and don''t really think about it. But, it can lead you to add extra
    divs from time to time. For instance, if you want to set a box''s width and padding
    in different units of measurement from each other, like em for the width and pixels
    for the padding, it''s often easiest to nest another div and apply the padding
