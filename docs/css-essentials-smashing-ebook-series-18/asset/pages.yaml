  md: '# Backgrounds In CSS: Everything You Need To Know


    Michael Martin


    Backgrounds are a core part of CSS. They are one of the fundamentals you simply
    need to know. In this article, we will cover the basics of using CSS backgrounds,
    including properties such as background-attachment. We will show some common tricks
    that can be done with the background as well as what''s in store for backgrounds
    in CSS 3 (including four new background properties!).


    # Working With Backgrounds in CSS 2


    OVERVIEW


    We have five main background properties to use in CSS 2. They are as follows:


    +   - background-color: specifies the solid color to fill the background with.

    - background-image: calls an image for the background.

    - background-position: specifies where to place the image in the element''s background.

    - background-repeat: determines whether the image is tiled.'
  merge: -1
  pgno: 5
- img_proc: true
  md: '+   - background-attachment: determines whether the image scrolls with the
    page.


    These properties can all be merged into one short-hand property: background. One
    important thing to note is that the background accounts for the contents of the
    element, including the padding and border. It does not include an element’s margin.
    This works as it should in Firefox, Safari and Opera, and now in IE8. But in IE7
    and IE6 the background does not include the border, as illustrated below.


    ![](img/736c504465a39c9f3caa50d5252a3998_6_0.png)


    Background does not extend to the borders in IE7 and IE6.'
  merge: -1
  pgno: 6
- img_proc: true
  md: '# BASIC PROPERTIES


    # Background color


    The **background-color** property fills the background with a solid color. There
    are a number of ways to specify the color. The follow commands all have the same
    output:


    ```

    background-color: blue;

    background-color: rgb(0, 0, 255);

    background-color: #0000ff;

    ```


    The **background-color** property can also be set to **transparent**, which makes
    any elements underneath it visible.


    # Background image


    The **background-image** property allows you to specify an image to be displayed
    in the background. This can be used in conjunction with **background-color**,
    so if your image is not tiled, then any space that the image doesn''t cover will
    be set to the background color. Again, the code is very simple. Just remember
    that the path is relative to the style sheet. In the following snippet, the image
    is in the same directory as the style sheet:


    ```

    background-image: url(image.jpg);

    ```


    But if the image was in a sub-folder named *images*, then it would be:


    ```

    background-image: url(images/image.jpg);

    ```


    # Background repeat


    By default, when you set an image, the image is repeated both horizontally and
    vertically until the entire element is filled. This may be what you want, but
    sometimes you want an image to be displayed only once or be tiled in only one
    direction. The possible values (and their results) are as follows:


    ```

    background-repeat: repeat;      /* The default value. Will tile the image in both
    directions. */

    ```'
  merge: -1
  pgno: 7
- img_proc: true
  md: '```

    background-repeat: no-repeat; /* * No tiling. The image will be

    used only once. */

    background-repeat: repeat-x; /* * Tiles horizontally (i.e.

    along the x-axis) */

    background-repeat: repeat-y; /* * Tiles vertically (i.e.

    they-axis) */

    background-repeat: inherit; /* * Uses the same background-

    repeat property of the element''s parent. */

    ```


    # Background position


    The **background-position** property controls where a background image is located
    in an element. The trick with **background-position** is that you are actually
    specifying where the top-left corner of the image will be positioned, relative
    to the top-left corner of the element.


    In the examples below, we have set a background image and are using the **background-position**
    property to control it. We have also set **background-repeat** to **no-repeat**.
    The measurements are all in pixels. The first digit is the x-axis position (horizontal)
    and the second is the y-axis position (vertical).


    ```

    /* Example 1: default. */

    background-position: 0 0; /* i.e. Top-left corner of element. */


    /* Example 2: move the image to the right. */

    background-position: 75px 0;

    /* Example 3: move the image to the left. */

    background-position: -75px 0;

    /* Example 4: move the image down. */

    background-position: 0 100px;

    ```'
  merge: -1
  pgno: 8
- img_proc: true
  md: '![](img/736c504465a39c9f3caa50d5252a3998_9_0.png)


