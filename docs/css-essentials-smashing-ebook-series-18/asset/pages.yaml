  md: "# CHILD SELECTORS\n\nOne tool for limiting the scope of CSS is the child selector\
    \ (>). If you no longer have to worry about Internet Explorer 6 (and, thankfully,\
    \ many of us don't), then the child selector should be a regular part of your\
    \ CSS diet.\n\nChild selectors limit the scope of selectors. Going back to our\
    \ navigation example, we can use the child selector to limit the scope of the\
    \ navigation so that it does not affect the menu.\n\n```\n#nav {\n  margin: 0;\n\
    \  padding: 0;\n  list-style: none;\n}\n#nav > li {\n  float: left;\n}\n#nav >\
    \ li > a {\n  display: block;\n  padding: 5px 10px;\n  background-color: blue;\n\
    }\n```\n\nFor the menu, let's add a class name to it. This will make it more descriptive\
    \ and provide a base for the rest of our styles.\n\n```\n.menu {\n  margin: 0;\n\
    \  padding: 0;\n  list-style: none;\n}\n.menu > li > a {\n  display: block;\n\
    \  padding: 2px;\n  background-color: red;\n}\n```"
  merge: -1
