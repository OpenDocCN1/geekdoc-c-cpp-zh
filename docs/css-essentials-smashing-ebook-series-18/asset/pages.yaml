  md: 'The bonus of this is that each of these rules affects only a single element:
    the element that the class is applied to. Our CSS is easier to read and easier
    to debug, and it’s clear what belongs to what and what it does.


    # It’s All Coming Undone


    We''ve just seen two ways to decouple HTML from CSS:


    +   1. Using child selectors,

    2. Using class selectors.


    In addition, we''ve seen how naming conventions allow for clearer, faster, simpler
    and more understandable code.


    These are just a couple of the concepts I cover in “Scalable and Modular Architecture
    for CSS,” and I invite you to read more.


