  md: '# Efficient CSS Development Practices


    Aids in: modularity, efficiency


    Layout grids and many of the CSS3 techniques we''ve gone over have the side benefit
    of making your CSS more modular and helping you write and maintain CSS more efficiently.
    There are also a few CSS development practices that you can use with any of the
    techniques we''ve already covered in order to reduce the time it takes you to
    write the CSS for those techniques in the first place, as well as save you time
    reusing components in your pages.


    # CSS FRAMEWORKS


    A CSS framework is a library of styles that act as building blocks to create the
    standard pieces you might need in your site. While CSS frameworks differ greatly
    in depth and breadth, most popular, publicly-distributed frameworks contain some
    sort of layout grid, as well as standard styles for text, navigation, forms, images,
    and more. It''s a good idea to create your own CSS framework, perhaps based on
    one of the most popular ones; it can be as simple as standardizing the IDs and
    classes you tend to use on every project and creating a starter style sheet for
    yourself.'
  merge: -1
  pgno: 135
- img_proc: true
  md: 'Good CSS frameworks provide you with a solid starting point for your designs,
    cutting down your time spent developing, testing, tweaking, and updating. They
    can also reduce the time others (your team members or those who inherit your sites)
    spend modifying your CSS, as everyone is working from a standard set of conventions.
    Frameworks can make your designs more modular by giving you a standard set of
    classes that can be reused from page to page easily, breaking the styles down
    into separate sheets that can be applied independently to pages on an as-needed
    basis, or allowing you to plug in various types of content without needing to
    invent new classes for it.


    But, frameworks have their share of problems too. For instance, publicly-distributed
    (as opposed to your own private) frameworks tend to have large file sizes, as
    they need to work for any type of site with any type of content; if they''re separated
    into multiple sheets, they can further damage page speed since every HTTP request
    takes time. We won''t get into the full list of pros and cons, but there are ways
    to work around many of them, so check out the following articles for the details.


    # OBJECT-ORIENTED CSS (OOCSS)


    Nicole Sullivan coined the term object-oriented CSS (OOCSS) for her method of
    creating self-contained chunks of HTML (modules) that can be reused anywhere in
    the page or that any class can be applied to. Some of the main principles of OOCSS
    are:


    +   - using primarily classes instead of IDs


    +   - creating default classes with multiple, more specific classes added on to
    elements


    +   - avoiding dependent selectors and class names that are location-specific'
