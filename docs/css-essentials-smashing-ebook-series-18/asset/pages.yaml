  md: "# 3. PADDED IMAGES\n\nThe third and final use case comes up when text isn't\
    \ allowed to wrap around a sprite image. Typical examples are list items that\
    \ span multiple lines, and all kinds of visual notifications that bare cores.\
    \ Whenever you want to reserve space on a multi-line element to make sure the\
    \ lines up neatly next to the image, this is the method you'll want to use.\n\n\
    ```\n.spritePadded(@x, @y) {\n  .sprite(@x, @y);\n  position: absolute;\n  content:\
    \ \"\";\n}\n.spritePadded(@x, @y, @width, @height) {\n  .sprite(@x, @y);\n  position:\
    \ absolute;\n  content: \"\";\n  width: @width;\n  height: @height;\n}\n```\n\n\
    Again we'll try our luck with pseudo-elements; this time, though, we'll be performing\
    \ some positioning tricks. By applying a position: absolute to the pseudo-element,\
    \ we can place it inside the space reserved by its parent element (usually by\
    \ applying padding to the parent—hence the name of the mixin). The actual position\
    \ of the image (the left, right, top and bottom properties) is not added to the\
    \ spritePadded mixin and should be done in the selector to keep things clean and\
    \ simple as possible (in this case, by maintaining a low parameter count).\n\n\
    Because we're using absolute positioning, either the :before or :after pseudo-element\
