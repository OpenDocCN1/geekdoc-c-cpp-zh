  md: '# IMPROPER USE OF SPRITES AFFECTS ACCESSIBILITY


    Because of the strong emphasis placed on using CSS sprites, some beginning developers
    intending on saving HTTP requests may incorrectly assume that all sliced images
    should be placed as backgrounds — even images that convey important information.
    The results would be a less accessible site, and would limit the potential benefits
    of the title and alt attributes in the HTML.


    So, while CSS sprites and in of them themselves are not wrong, and do not cause
    accessibility problems (in fact, when used correctly, they improve accessibility),
    the over-promotion of sprites without clearly identifying drawbacks and correct
    use could hinder the progress the web has made in areas of accessibility and productivity.


    # What About HTTP Requests?


    Many will argue, however (and for good reason) that the most important part of
    improving a site''s performance is minimizing HTTP requests. It should also be
    noted that one study conducted showed that 40-60% of daily website visitors come
    with an empty browser cache. Is this enough to suggest that mega sprites should
    be used in all circumstances? Possibly. Especially when you consider how important
    a user''s first visit to a website is.'
  merge: -1
