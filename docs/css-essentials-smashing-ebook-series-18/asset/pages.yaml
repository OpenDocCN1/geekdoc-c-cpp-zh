  md: '# Six CSS Layout Features To Look Forward To


    Divya Manian


    A few concerns keep bobbing up now and then for Web developers, one of which relates
    to how to lay out a given design. Developers have made numerous attempts to do
    so with existing solutions. Several articles have been written on finding the
    holy grail of CSS layouts, but to date, no single solution works without major
    caveats. At the W3Conf, I gave a talk on how the CSS Working Group is attempting
    to solve the concerns of Web developers with multiple proposals. There are six
    layout proposals that are relevant to us, all of which I described in the talk:


    Here is a little more about these proposals and how they will help you in developing
    websites in the future.


    # Generated Content For Paged Media


    +   * W3C Editor’s Draft

    * Demo

    * Browser support: Opera Labs Build only


    This proposal outlines a set of features that would modify the concerns of any
    element to flow as pages, like in a book. A video demonstration shows how to use
    paged media to generate HTML5 slideshows (look at the demo for GCPM in the Opera
    Labs Build to play with the features more). To make the content of an element
    be paged, you would use this syntax:'
  merge: -1
  pgno: 259
- img_proc: true
  md: "```\n@media paged {\n  html {\n    width: 100%;\n    overflow-style: paged-x;\n\
    \    padding: 5%;\n    height: 100%;\n    box-sizing: border-box;\n  }\n}\n```\n\
    \nThis would make the content look something like this:\n\n![](img/736c504465a39c9f3caa50d5252a3998_260_0.png)"
  merge: -1
  pgno: 260
- img_proc: true
  md: 'Here, @media paged indicates that the browser understands paged media and that
    all of the selectors specified for it should have their styles applied when paged
    media is supported. Then, you indicate which selector you want to be paged (in
    the above example, the selector is the html element itself by specifying the property
    overflow-style: paged-x. This will simply make the content paged; if you paged
    controls to be visible, you need to specify overflow-style: paged-x-controls.


    The properties break-before, break-after break-inside can be used to control where
    the content falls within the pages. For example, if you want headings to only
    appear with their corresponding content and never at the end of the page or standing
    alone, you can specify that:


    ```

    h3, h2 {

    break-after: avoid;

    }

    ```


    This ensures that if a heading occurs on the last line of a page, it will be pushed
    to the next page with the content that it introduces.


    # API


    Two properties are available on an element whose content is paged: currentPage
    and pageCount. You can set the currentPage property via JavaScript, which would
    trigger a page change on that element. This would trigger an onchange event on
    that element, which you could use to run other scripts that are required when
    the page changes. The pageCount property stores the total number of pages in the
    paged element. These properties are useful for implementing callbacks that should
    be triggered on page change; for example, to render notes for a particular slide
    in a slide deck.'
  merge: -1
  pgno: 261
