  md: '# Writing CSS For Others


    Harry Roberts


    I think a lot of us CSS authors are doing it wrong. We are selfish by nature;
    we get into our little bubbles, writing CSS (as amazing as it may be) with only
    ourselves in mind. How many times have you inherited a CSS file that''s made you
    say “WTF” at least a dozen times?


    ![](img/736c504465a39c9f3caa50d5252a3998_143_0.png)


    (Image: Toca Boca)'
  merge: -1
  pgno: 143
- img_proc: true
  md: 'HTML has a standard format and syntax that everyone understands. For years,
    programmers have widely agreed on standards for their respective languages. CSS
    doesn''t seem to be there yet: everyone has their own favorite format, their own
    preference between single-line and multi-line, their own ideas on organization,
    and so on.


    # A New Way of Thinking


    Recently, I have begun to think that CSS authors could take a leaf from the programmers''
    book. We need to write CSS that others can understand and use with ease. Programmers
    have been writing sharable code since day one, and it''s high time that CSS be
    written with as much organization and openness.


    In inuit.css and working on a huge front-end framework at my job, it has become
    more apparent to me that writing code that can be easily picked up by others is
    extremely important. I wouldn''t say that I''ve nailed everything yet, but I''ll
    share with you some things that I think are vital when writing code, specifically
    CSS, that will be used by others.


    First, the reasoning: my number one tip for developers is to always code you''re
    working in a team, even when you''re not. You may be the only developer on your
    project right now, but it might not stay that way:


    +   Your project could be taken to another developer, agency or team. Even though
    this is not the best situation to find yourself in, handing over your work smoothly
    and professionally to others is ideal.


    +   If you''re doing enough work to warrant employing someone else or expanding
    the team at all, then your code ceases to be yours and becomes the team''s.'
