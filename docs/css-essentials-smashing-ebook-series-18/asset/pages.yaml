  md: '# 3.1 OBJECT-ORIENTED PROGRAMMING INHERITANCE


    Though beyond the scope of this article, CSS inheritance shouldn’t be confused
    with object-oriented programming (OOP) inheritance. Here is the definition of
    OOP inheritance from Wikipedia, and it makes clear that we are not talking about
    the same thing:


    In object-oriented programming (OOP), inheritance is a way to form new classes
    [...] using classes that have already been defined. Inheritance is employed to
    help reuse existing code with little or no modification. The new classes [...]
    inherit attributes and behavior of the pre-existing classes. ...


    # 3.2 HOW INHERITANCE WORKS


    When an element inherits a value from its parent, it is inheriting its computed
    value. What does this mean? Every CSS property goes through a four-step process
    when its value is being determined. Here’s an excerpt from the W3C specification:


    > The final value of a property is the result of a four-step calculation: the
    value is determined through specification (the “specified value”), then resolved
    into a value that is used for inheritance (the “computed value”), then converted
    into an absolute value if necessary (the “used value”), and finally transformed
    according to the limitations of the local environment (the “actual value”).'
  merge: -1
  pgno: 176
- img_proc: true
  md: '# IN OTHER WORDS:


    +   1. Specified value

    nThe user agent determines whether the value of the property comes from a style
    sheet, is inherited or should take its initial value.


    +   2. Computed value

    The specified value is resolved to a computed value and exists even when a property
    doesn''t apply. The document doesn''t have to be laid out for the computed value
    to be determined.


    +   3. Used value

    The used value takes the computed value and resolves any dependencies that can
    only be calculated after the document has been laid out (like percentages).


    +   4. Actual value

    This the value used for the final rendering, after any approximations have been
    applied (for example, converting a decimal to an integer).


    If you look at any CSS property''s specification, you will see that it defines
    its initial (or default) value, the elements it applies to, its inheritance status
    and its computed value (among others). For example, the background-color specification
    states the following:


    > Name: background-color

    Value: <color>

    Initial: transparent

    Applies to: all elements

    Inherited: no

    Percentages: N/A'
