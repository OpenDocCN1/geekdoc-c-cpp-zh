    # MULTIPLE CSS FILES FOR SECTIONS, OR ONE BIG FILE WITH ALL SECTIONS?


    A lot of people separate their sections into multiple files, and then use the
    @import rule to put them all back together in one meta file. For example:


    ```

    @import url(main.css)

    @import url(type.css)

    @import url(images.css)

    @import url(tables.css)

    @import url(misc.css)

    @import url(responsive.css)

    ```


    This is fine, and it keeps everything in sections, but it does lead to more HTTP
    requests than is necessary; and minimizing requests is one of the most important
    rules for a high-performance website.


    Compare this...


    | URL | Status | Domain | Size | Timeline |

    |---|---|---|---|--|

    | GET main.css | 304 Not Modified | | 83 B | 311ms |

    | GET reset.css | 304 Not Modified | | 722 B | | |

