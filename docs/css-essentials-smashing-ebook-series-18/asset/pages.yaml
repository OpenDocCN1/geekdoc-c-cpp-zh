- img_proc: true
  md: "Let's take a look at what exactly these kinds of declarations are all about,\
    \ and when, if ever, you should use them.\n\n# A Brief Primer on the Cascade\n\
    \nBefore we get into it **important** declarations and exactly how they work,\
    \ let's give this discussion a bit of context. In the past, Smashing Magazine\
    \ covered CSS specificity in-depth, so please take a look at that article if you\
    \ want a detailed discussion on the CSS cascade and how specificity ties in.\n\
    \nBelow is a basic outline of any given CSS-styled document will decide how much\
    \ weight to give to different styles it encounters. This is a general summary\
    \ of the cascade as discussed in the spec:\n\n+   - Find all declarations that\
    \ apply to the element and property\n- Apply the styling to the element based\
    \ on importance and origin using the following order, with the first item in the\
    \ list having the least weight:\n  - Declarations from the user agent\n  - Declarations\
    \ from the user\n  - Declarations from the author\n  - Declarations from the author\
    \ with **important** added\n  - Declarations from the user with **important**\
    \ added\n- Apply styling based on specificity, with the more specific selector\
    \ \"winning\" over more general ones\n- Apply styling based on the order in which\
    \ they appear in the stylesheets (i.e., in the event of a tie, last one “wins\"\
    )"
  merge: -1
  pgno: 201
- img_proc: true
  md: "With that basic outline, you can probably already see how !important declarations\
    \ weigh, and what role they play in the cascade. Let's look at !important in more\
    \ detail.\n\n# Syntax and Description\n\nAn !important declaration provides a\
    \ way for a stylesheet author to give a CSS value weight than it naturally has.\
    \ It should be noted here that the phrase !important declaration\" is a reference\
    \ to an entire CSS declaration, including property and value, with !important\
    \ added (thanks to Brad Czerniak for pointing out this discrepancy). Here is a\
    \ simple code example that clearly illustrates how !important affects the natural\
    \ way that styles are applied:\n\n```\n#example {\n  font-size: 14px !important;\n\
    }\n#container #example {\n  font-size: 10px;\n}\n```\n\nIn the above code sample,\
    \ the element with the id of \"example\" will have text sized at 14px, due to\
    \ the addition of !important.\n\nWithout the use of !important, there are two\
    \ reasons why the second declaration block should naturally have more weight than\
    \ the first: The second block is later in the stylesheet (i.e. it listed second).\
    \ Also, the second block has more specificity followed by #container by #example\
    \ instead of just #example). But with the inclusion of !important, the first font-size\
    \ rule now has more weight."
  merge: -1
  pgno: 202
- img_proc: true
  md: 'Some things to note about !important declarations:


    When !important was first introduced in CSS1, an author rule with an !important
    declaration held more weight than a user rule with an !important declaration;
    to improve accessibility, this was reversed in CSS2


    +   - If !important is used on a shorthand property, this adds "importance" to
    all the sub-properties that the shorthand property represents


    +   - The !important keyword (or statement) must be placed at the end of the line,
    immediately before the semicolon, otherwise it will have no effect (although a
    space before the semicolon wont break it)


    +   - If for some particular reason you have to write the same property twice
    in the same declaration block, add !important to the end of the first one, the
    first will have more weight in every browser except IE6 (this works as an IE6-only
    hack, but doesn''t invalidate your CSS)


    +   - In IE6 and IE7, if you use a different word in place of !important (like
    !hotdog), the CSS rule will still be given extra weight, while other browsers
    will ignore it


    # When Should !important Be Used?


    As with any technique, there are pros and cons depending on the circumstances.
    So when should it be used, if ever? Here''s my subjective overview of potential
    valid uses.


    # NEVER


    !important declarations should not be used unless they are absolutely necessary
    after all other avenues have exhausted. If you use !important out of laziness,
    to avoid proper debugging, or to rush a project'
  merge: -1
  pgno: 203
- img_proc: true
  md: 'to completion, then you''re abusing it, and you (or those that inherit your
    projects) will suffer the consequences.


    If you include it even sparsely in your stylesheets, you will soon find that parts
    of your stylesheet will be harder to maintain. As discussed above, CSS property
    importance happens naturally through the cascade and specificity. When you use
    **!important**, you''re disrupting the natural flow of your rules, giving more
    weight to rules that are undeserving of such weight.


    If you never use **!important**, that''s a sign that you understand CSS and give
    proper forethought to your code before writing it.


    That being said, the old adage "never say never" would certainly apply here. So
    below are some legitimate uses for **!important**.


    # TO AID OR TEST ACCESSIBILITY


    As mentioned, user stylesheets can include **!important** declarations, allowing
    users with special ability to give weight to specific CSS rules that will aid
    their ability to read and access content.


    A special needs user can add **!important** to typographic properties **font-size**
    to make text larger, or to color-related rules in order to increase the contrast
    of web pages.


    In the screen grab below, Smashing Magazine’s home page is shown with a user-defined
    stylesheet overriding the normal text size, which can be done using Firefox’s
    Developer Toolbar:'
