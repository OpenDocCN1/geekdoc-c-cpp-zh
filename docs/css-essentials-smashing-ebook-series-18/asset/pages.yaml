  md: '# NEW PROPERTY: BACKGROUND CLIP


    This brings us back to the issue discussed at the beginning of this article, about
    backgrounds being shown beneath the border. This is described as the “background
    painting area.”


    The background-clip property was created to give you more control over where backgrounds
    are displayed. The possible values are:


    +   - **background-clip: border-box;** backgrounds displayed beneath the border.

    - **background-clip: padding-box;** backgrounds displayed beneath the padding,
    not the border.

    - **background-clip: content-box;** backgrounds displayed only beneath content,
    not border or padding.


    # NEW PROPERTY: BACKGROUND ORIGIN


    This is used in conjunction with **background-position**. You can have the **background-position**
    calculated from the border, padding or content boxes (like **background-clip**).


    +   - **background-origin: border-box;** background-position is calculated from
    the border.

    - **background-origin: padding-box;** background-position is calculated from the
    padding box.

    - **background-origin: content-box;** background-position is calculated from the
    content.'
  merge: -1
  pgno: 19
- img_proc: true
  md: 'A good explanation of the differences between **background-clip** and **background-origin**
    is available on CSS3.info.


    # NEW PROPERTY: BACKGROUND SIZE


    The **background-size** property is used to resize your background image. There
    are a number of possible values:


    +   - **background-size: contain;**

    scales down image to fit element (maintaining pixel aspect ratio).

    - **background-size: cover;**

    expands image to fill element (maintaining pixel aspect ratio).

    - **background-size: 100px 100px;**

    scales image to the sizes indicated.

    - **background-size: 50% 100%;**

    scales image to the sizes indicated. Percentages are relative to the size of containing
    element.


    You can read up on some examples of special cases on the CSS 3 specifications
    website.'
  merge: -1
  pgno: 20
- img_proc: true
  md: '# NEW PROPERTY: BACKGROUND BREAK


    In CSS 3, elements can be split into separate boxes (e.g. to make an inline element
    span across several lines). The background-break property controls how the background
    is shown across the different boxes.


    The possible values are:


    +   - Background-break: continuous; the default value. Treats the boxes as if
    no space is between them (i.e. as they are all in one box, with the background
    image applied to that).

    - Background-break: bounding-box; takes the space between boxes into account.

    - Background-break: each-box; treats each box in the element separately and re-draws
    the background individually for each one.


    # CHANGES TO BACKGROUND COLOR


    The background-color property has a slight enhancement in CSS 3. In addition to
    specifying the background color, you can specify a “fall-back color” that is used
    if the bottom-layer background image of the element cannot be used.


    This is done by adding a forward slash before the fall-back color, like so:


    ```

    background-color: green / blue;

    ```'
  merge: -1
  pgno: 21
- img_proc: true
  md: 'In this example, the background color would be green. However, if the bottom-most
    background image cannot be used, then blue would be shown instead of green. If
    you do not specify a color before the slash, then it is assumed to be transparent.


    # CHANGES TO BACKGROUND REPEAT


    When an image is repeated in CSS 2, it is often cut off at the end of the element.
    CSS 3 introduces two new properties to fix this:


    +   - **space**: an equal amount of space is applied between the image tiles until
    they fill the element.


    +   - **round**: the image is scaled down until the tiles fit the element.


    An example of **background-repeat: space;** is available on the CSS 3 specifications
    website.


    # CHANGES TO BACKGROUND ATTACHMENT


    The **background-attachment** has a new possible value: **local**. This comes
    into play with elements that can scroll (i.e. are set to **overflow:scroll;**).
    When **background-attachment** is set to **scroll**, the background image will
    not scroll when the element’s content is scrolled.


    With **background-attachment:local** now, the background scrolls when the element’s
    content is scrolled.'
  merge: -1
  pgno: 22
