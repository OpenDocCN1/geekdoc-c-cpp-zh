    >Smashing Magazine</a></li>\n    <li><a href=\"http://smacss.com/\">SMACSS</a></li>\n\
    \  </ul>\n</div>\nLet's give it some styles.\n.box {\n  margin: 0;\n  padding:\
    \ 5px 10px;\n  border-bottom: 1px solid #333;\n  background-color: #CCC;\n}\n\
    .box h2 {\n```"
