    \ old site as a case study. Floats were used prominently in his mock overhaul\
    \ of the Microsoft layout.\n\n# SYNTAX\n\nThe float CSS property can accept one\
    \ of 4 values: left, right, none, and inherit. It is declared as shown in the\
    \ code below.\n\n```\n#sidebar {\n  float: left;\n}\n```\n\nThe most commonly-used\
