  md: '# # Taming Advanced CSS Selectors


    Inayail de Leon


    CSS is one of the most powerful tools that is available to web designers (if not
    the most powerful). With it we can completely transform the look of a website
    in just a couple of minutes, and without even having to touch the markup. But
    despite the fact that we are all aware of its usefulness, CSS selectors are still
    not used to their full potential and we sometimes have the tendency to litter
    our HTML with excessive and unnecessary classes and ids, divs and spans.


    The best way to avoid these plagues spreading in your markup and keep it clean
    and semantic, is by using more CSS selectors, ones that can target specific elements
    without the need of a class or an id, and by doing that keep our code and our
    stylesheets flexible.


    # ## CSS Specificity


    Before delving into the realms of advanced CSS selectors, it''s important to understand
    how CSS specificity works, so that we know how to properly our selectors and to
    avoid spending hours debugging for a CSS issue that could be easily fixed if we
    had only paid attention to the specificity.


    When we are writing our CSS we have to keep in mind that some selectors will rank
    higher than others in the cascade, the latest selector that we wrote will not
    always override the previous ones that we wrote for the same elements.'
  merge: -1
  pgno: 235
- img_proc: true
  md: 'So how do you calculate the specificity of a particular selector? It''s fairly
    straightforward if you take into account that specificity will be represented
    as four numbers separated by commas, like: 1, 1, 1, 1 or 0, 2, 0, 1


    +   1. The first digit (a) is always zero, unless there is a style attribute applied
    to that element within the markup element


    +   2. The second digit (b) is the sum of the number of IDs in that selector


    +   3. The third digit (c) is the sum of other attribute selectors and pseudo-classes
    in that selector. (.example) and attribute selectors (eg. li[id=red]) are included
    here.


    +   4. The fourth digit (d) counts the elements (like table, p, div, etc.) and
    pseudo-elements (like :first-line)


    +   5. The universal selector (*) has a specificity of zero


    +   6. If two selectors have the same specificity, the one that comes last on
    the stylesheet will be applied


    Let''s take a look at a few examples, to make it easier to understand:


    +   #sidebar h2 — 0, 1, 0, 1


    +   h2.title — 0, 0, 1, 1


    +   h2 + p — 0, 0, 0, 2


    +   #sidebar p:first-line — 0, 1, 0, 2


    From the following selectors, the first one is the one who will be applied to
    the element, because it has the higher specificity:


    +   #sidebar p#first { color: red; } — 0, 2, 0, 1


    +   #sidebar p:first-line { color: blue; } — 0, 1, 0, 2'
  merge: -1
  pgno: 236
- img_proc: true
  md: 'It''s important to have at least a basic understanding of how specificity works,
    but tools like Firebug are useful to let us know which selector is being applied
    to a particular element by listing all the CSS selectors in order of their specificity
    when you are inspecting the element.


    ![](img/736c504465a39c9f3caa50d5252a3998_237_0.png)


    Firebug lets you easily see which selector is being applied to an element.


    # 1. Attribute selectors


    Attribute selectors let you target an element based on its attributes. You can
    specify the element''s attribute only, so all the elements that have that attribute
    — whatever the value — within the HTML will be targeted, or more specific and
    target elements that have particular values on their attributes — this is where
    attribute selectors show their power.


    There are 6 different types of attribute selectors:


    +   - **[att=value]**nThe attribute has to have the exact value specified.'
  merge: -1
  pgno: 237
- img_proc: true
  md: "+   * [att~=value]\nThe attribute's value needs to be a whitespace separated\
    \ list of words (for example\n\n+   * [att|=value]\nThe attribute's value is exactly\
    \ \"value\" or starts with the word \"value\" and is immediately followed by \"\
    -\"\n\n+   * [att^=value]\nThe attribute's value starts with the specified value.\n\
    \n+   * [att$=value]\nThe attribute's value ends with the specified value.\n\n\
    +   * [att*=value]\nThe attribute's value contains the specified value.\n\nFor\
    \ example, if you want to change the background color of all the div elements\
    \ that are posts on your blog, you can use the attribute selector that targets\
    \ every div whose class attribute starts with \"post-\":\n\n```\ndiv[class*=\"\
    post\"] {\n  background-color: #333;\n}\n```\n\nThis will match all the div elements\
    \ whose class attribute contains the words \"posts\", in any position.\n\nAnother\
    \ useful usage of attribute selectors is to target different types of input elements.\
    \ For example, if you want your text inputs to have a different width from the\
    \ others, you can use a simple attribute selector:"
