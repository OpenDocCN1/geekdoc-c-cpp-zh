  pgno: 232
- img_proc: true
  md: 'While being able to grab the title alt text of an image and display it on the
    page as a pseudo-element would be practical, this isn’t possible. Remember that
    the pseudo-element must be a child of the element to which it is being applied.
    Images, which are void (or empty) elements, don’t have child elements, so it wouldn’t
    work in this case. The same would apply to other void elements, such as <input>.


    # Dreaded Browser Support


    As with any front-end technology that is gaining momentum, one of the first concerns
    is browser support. In this case, that’s not as much of a problem.


    Browser support for :before and :after pseudo-elements stacks up like this:


    +   * Chrome 2+

    * Firefox 3.5+ (3.0 had partial support),

    * Safari 1.3+,

    * Opera 9.2+,

    * IE8+ (with some minor bugs),

    * Pretty much all mobile browsers.


    The only real problem (no surprise) is IE6 and IE7, which have no support. So,
    if your audience is in the Web development niche (or another market that has low
    IE numbers), you you can probably go ahead and use pseudo-elements freely.'
  merge: -1
  pgno: 233
- img_proc: true
  md: '# PSEUDO-ELEMENTS AREN''T CRITICAL


    Fortunately, a lack of pseudo-elements will not cause huge usability issues. For
    the most part, pseudo-elements are generally decorative (or helper-like) content
    that will not cause problems in unsupported browsers. So, even if your audience
    has high IE numbers, you can still use them to some degree.


    # A Couple Of Reminders


    As mentioned, pseudo-element content does not appear in the DOM. These elements
    are not real elements. As such, they are not accessible to most assistive devices.
    So, never use pseudo-elements to generate content that is critical to the usability
    or accessibility of your pages.


    Another thing to keep in mind is that developer tools such as Firebug do not show
    the content generated by pseudo-elements. So, if overused, pseudo-elements cause
    maintainability headaches and make debugging a much slower process.


    (Update): you can use Chrome’s developer tools to view the styles associated with
    a pseudo-element, but the element will not appear in the DOM. Also, Firebug is
    adding pseudo-element support in version 1.8.)


    That covers all of the concepts you need in order to create something practical
    with this technique. In the meantime, for further reading on CSS pseudo-elements,
    be sure to check out some of the articles that we’ve linked to this piece.'
  merge: -1
