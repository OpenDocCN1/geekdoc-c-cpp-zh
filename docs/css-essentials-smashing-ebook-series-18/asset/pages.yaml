- img_proc: true
  md: '![](img/736c504465a39c9f3caa50d5252a3998_212_0.png)


    CSS sprites in the wild: Amazon, Google and Facebook.


    # Preparing The Sprite


    If you look online for examples of CSS sprites, you''ll see that most are

    optimized for an ideal use of real estate—gaps between images are kept to

    a minimum in order to keep the load of the entire sprite as low as possible.

    This reduces loading time considerably when the image is first downloaded,

    but it also introduces those horrible image coordinates that we mentioned

    erlier. So, why not take a slightly different approach? Let''s look for an

    easier way to target images while making sure the resulting sprite is not

    substantially bigger than the sum of its individual images.'
  merge: -1
  pgno: 212
- img_proc: true
  md: 'Rather than try to stack the images in such a way that makes the resulting
    sprite as small as possible, let''s try a different layout. Instead of a random
    grid, we''re going to build a new square grid, reserving the space of each square
    for one image (although larger images might cover multiple squares). The goal
    is to be able to target the starting point of every image (top-left corner) with
    a very simple mathematical function.


    The size of the grid squares will depend on the average dimension of the images
    that you''ll be spriting. For my website, I used a 32×32 pixel grid (because only
    one image exceeds this dimension), but grid sizes will vary according to the situation.
    Another thing to take into account is the image bleeding that can occur when zooming
    a page; if you want to play it safe, add a little padding to each image within
    the sprite. For extra optimization, you could also use a rectangular grid instead
    of a square grid, further reducing any wasted space; while a tad more complex,
    this isn''t different from what we''ll be doing. For this article, though, we''ll
    stick with the square grid.


    # Preparing The Sprite: A Photoshop Bonus


    I''m no designer, so I''m not sure how applicable this section is beyond the realm
    of Photoshop, but there are some noteworthy improvements that can be made before
    we get to the actual code. First of all, visualizing the grid can be of great
    help. Photoshop has guides to do this (so you don''t actually have to include
    the markers in your sprite), with the added bonus layers that will snap to these
    guides (making pixel-perfect positioning of each individual image much easier).


    Manually adding these guides can be somewhat of a drag, though. Luckily, a colleague
    of mine (hats off to Filip Van Tendeloo) was kind enough to write and share a
    little Photoshop script that builds this grid of guides'
  merge: -1
  pgno: 213
- img_proc: true
  md: 'automatically based on the base size of your square. Pretty convenient, no?

    Just download the script, save it in the Presets\Scripts directory, and choose
    File -> Scripts -> Sprite Grid from the Photoshop menu.


    Finally, to really finish things off, you can add numbers to the x and y axes
    of your grid so that you can easily pinpoint every square in the grid. Don''t
    add these numbers to the actual sprite, though; just copy the sprite into a new
    image and add them there. These numbers are just for reference—but trust me, they
    will definitely come in handy in a minute.


    ![](img/736c504465a39c9f3caa50d5252a3998_214_0.png)


    Example of a reference image.


    If you can''t (or don''t want to) use preprocessing languages such as LESS and
    Sass, just add the coordinates of each square instead.'
  merge: -1
