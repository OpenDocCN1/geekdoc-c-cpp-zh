    \ a PDF file, a Word document, etc. This can be done by using an attribute selector:\n\
    \n```\na[href=\".jpg\"] {\n  background: url(jpeg.gif) no-repeat left 50%;\n \
    \ padding: 2px 0 2px 20px;\n}\n```\n\n```\na[href=\".pdf\"] {\n  background: url(pdf.gif)\
    \ no-repeat left 50%;\n  padding: 2px 0 2px 20px;\n}\n```\n\n```\na[href=\".doc\"\
    ] {\n  background: url(word.gif) no-repeat left 50%;\n  padding: 2px 0 2px 20px;\n\
    }\n```\n\nIn this example, we’ve used an attribute selector that will target all\
    \ the links **a** whose **href** attribute ends ($) with .jpg, .pdf or .doc.\n\
    \n# Notes on browser support\n\nApart from Internet Explorer 6, all major browsers\
    \ support attribute selectors. This means that when you are using attribute selectors\
    \ on your stylesheets, you should make sure that IE6 users will still be provided\
    \ with a usable site. Take our third example: adding an icon to your links adds"
