  md: '# # The Mystery Of The CSS Float Property


    Louis Lazaris


    Years ago, when developers first started to make the transition to HTML layouts
    without tables, one CSS property that suddenly took on a very important role was
    the **float** property. The reason that the **float** property became so common
    is, by default, block-level elements would not line up beside one another in a
    column-based format. Since columns are necessary in virtually every CSS layout,
    this property started to get used — and even overused — prolifically.


    The CSS **float** property allows a developer to incorporate table-like columns
    in an HTML layout without the use of tables. If it were not not for the CSS **float**
    property, CSS layouts would not be possible except using absolute and relative
    positioning — which would be messy and would the layout unmaintainable.


    In this chapter, we''ll discuss exactly how the **float** property is and how
    it affects elements in particular contexts. We''ll also take a look at some of
    the differences that can occur in connection with this property in the most commonly-used
    browsers. Finally, we''ll showcase a few practical uses for the CSS **float**
    property. This should provide a well-rounded and thorough discussion of this property
    and its impact on CSS development.'
  merge: -1
  pgno: 24
- img_proc: true
  md: '# Definition and Syntax


    The purpose of the CSS float property is, generally speaking, to push a block-level
    element to the left or right, taking it out of the flow in relation to other block
    elements. This allows naturally-flowing content to wrap around the floated element.
    This concept is similar to what you see every day in print literature, where photos
    and other graphic elements are aligned to one side while other content (usually
    text) flows naturally around the left- or right-aligned element.


    ![](img/736c504465a39c9f3caa50d5252a3998_25_0.png)'
  merge: -1
  pgno: 25
- img_proc: true
  md: 'The photo above shows the “Readers’ sites” section of .net magazine, which
    displays 3 readers’ photos each aligned left in their respective columns with
    text wrapping around the aligned images. That is the basic idea behind the float
    property in CSS layouts, and demonstrates one of the ways it has been used in
    table-less design.


    The effectiveness of using floats in multi-columned layouts was explained by Douglas
    Bowman in 2004 in his classic presentation No More Tables:


    # Floats on Stopdesign


    ![](img/736c504465a39c9f3caa50d5252a3998_26_0.png)


    No More Tables'
  merge: -1
  pgno: 26
