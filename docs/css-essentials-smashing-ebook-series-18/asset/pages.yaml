  md: "# Reusing Styles\n\nIn the old days, we wrapped font tags and applied background\
    \ attributes to every HTML element that needed styling. This was, of course, very\
    \ impractical, and thus CSS was born. CSS enabled us to reuse styles from one\
    \ part of the page on another.\n\nFor example, a navigation menu has a list of\
    \ items that all look the same. Repeating inline styles on each item wouldn't\
    \ be practical. As a result, we begin to see CSS like this:\n\n```\n#nav {\n \
    \ margin: 0;\n  padding: 0;\n  list-style: none;\n}\n#nav li {\n  float: left;\n\
    }\n#nav li a {\n  display: block;\n  padding: 5px 10px;\n  background-color: blue;\n\
    }\n```\n\nSure beats adding float:left to every list item and display:block; padding:5px\
    \ to every link. Efficiency, for the win! Just looking at this, you can see the\
    \ HTML structure that is expected:\n\n```\n<ul id=\"nav\">\n  <li><a href=\"/\"\
    >Home</a></li>\n  <li><a href=\"products\">Products</a></li>\n  <li><a href=\"\
    contact\">Contact Us</a></li>\n</ul>\n```"
  merge: -1
  pgno: 161
- img_proc: true
  md: "Now, the client comes back and says, “I want a drop-down menu to appear when\
    \ the user clicks on ‘Products.’ Give them easy access to each of the pages!”\
    \ As a result, our HTML changes.\n\n```\n<ul id=\"nav\">\n  <li><a href=\"/\"\
    >Home</a></li>\n  <li><a href=\"/products\">Products\n    <ul>\n      <li><a href=\"\
    /products/shoes\">Shoes</a></li>\n      <li><a href=\"/products/jackets\">Jackets</a></li>\n\
    \    </ul>\n  </li>\n  <li><a href=\"/contact\">Contact Us</a></li>\n</ul>\n```\n\
    \nWe have a list item within a list item, and links within it. Our menu has a\
    \ horizontal navigation when the client wants a vertical list, so we add some\
    \ rules to style the inner list to match what the client wants.\n\n```\n#nav ul\
    \ {\n  margin: 0;\n  padding: 0;\n  list-style:none;\n}\n#nav li {\n  float: none;\n\
    }\n#nav li li a {\n  padding: 2px;\n  background-color: red;\n}\n```\n\nProblem\
    \ solved! Sort of."
