  md: '# Regions


    +   - W3C Editor’s Draft

    - Demo

    - Browser support: IE 10+, Chrome 15+, Safari 6+


    The closest equivalent to regions would be InDesign’s linking of text frames.
    With the properties in this proposal, you can make the content of selected elements
    flow through another set of elements. In other words, your content need not be
    tied to the document flow any longer.


    To begin, you need to select elements whose content will be part of “named flow,”
    like this:


    ```

    article.news { flow-into: article_flow; }

    ```


    Here, all of the content in the **article** element with the class name **news**
    will belong to the flow named **article_flow**.


    Then, you select elements that will render the contents that are part of this
    named flow:


    ```

    #main {

    flow-from: article_flow;

    )

    ```


    Here, the element with the ID **main** will be used to display the content in
    the flow named **article_flow**. This element has become a region that renders
    the content of a named flow. Note that any element that is a region establishes
    new “block-formatting contexts” and “stacking contexts.” For example, if a child
    element is part of a flow and is absolutely positioned, it will now only be absolutely
    positioned with respect to the region it belongs to, and not to the whole viewport.'
  merge: -1
  pgno: 264
- img_proc: true
  md: "You can also tweak the styles of content that flows through a region:\n\n```\n\
    @region #main {\n  p { color: indianred; }\n}\n```\n\n# Introduction This is an\
    \ example that shows how content can be made to flow between multiple regions.\
    \ The image is displayed in the\n\nability to associate a flow of content to a\
    \ set of regions and effectively getting that content to be threaded from one\
    \ region to the next.\n\nbox 'A'. The 'article' is different style. flowed from\
    \ region '1', to region '2', to region '3' and finally to region '4'. Note how\
    \ the content that is laid out in region '1' can be subject to a\n\nMore Details\
    \ This illustrates some of the features of CSS Regions. First, the Then, the example\
    \ illustrates the concept of 'region styling', where the content falls into a\
    \ specific region is subject to additional style rule, in the same spirit as inline\
    \ content falling in the 'first line' can be subject to additional styling defined\
    \ by the ::first-line pseudo element selector.\n\n![](img/736c504465a39c9f3caa50d5252a3998_265_0.png)\n\
    \nFinally, this initial example shows that the concept of region is orthogonal\
    \ to the layout of regions. This means regions can be created and positioned using\
    \ existing CSS and HTML layout (such as multi-column, flex box or grid layout).\
    \ The CSS Regions specification defines how these regions can be the recipients\
    \ of a 'named flow'.\n\n# API\n\nAn interface named getNamedFlow and an event\
    \ named regionLayoutUpdate are available for elements that are regions."
  merge: -1
