- img_proc: true
  md: '```

    background-image: url(test-image.jpg);

    background-position: 0 100%;

    background-repeat: no-repeat;

    background-attachment: fixed;

    ```


    ![](img/736c504465a39c9f3caa50d5252a3998_15_0.png)


    Part of the image has been cut off because it begins outside of the element.


    # The Background Shorthand Property


    Instead of writing out of these rules each time, we can combine them into a single
    rule. It takes the following format:


    ```

    background: <color> <image> <position> <attachment> <repeat>

    ```'
  merge: -1
  pgno: 15
- img_proc: true
  md: 'For example, the following rules...


    ```

    background-color: transparent;

    background-image: url(image.jpg);

    background-position: 50% 0

    background-attachment: scroll;

    background-repeat: repeat-y;

    ```


    ... could be combined into the following single line:


    ```

    background: transparent url(image.jpg) 50% 0 scroll repeat-y;

    ```


    And you don''t have to specify every value. If you leave a property out, its default
    value is used instead. For example, the line above has the same output as:


    ```

    background: url(image.jpg) 50% 0 repeat-y;

    ```


    # Common Uses Of Backgrounds


    Aside from their obvious use of making elements more attractive, backgrounds can
    be used for other purposes.


    # FAUX COLUMNS


    When using the CSS property of float to position layout elements, ensuring that
    two (or more) columns are the same length can be difficult. If the lengths are
    different, then the background of one of the columns will be shorter than the
    background of the other, spoiling your design.


    Faux columns is a very simple background trick that was first written up on A
    List Apart. The idea is simple: instead of applying a separate background for
    each column, apply one background image to the parent element of the columns with
    that image containing the designs for each column.'
  merge: -1
  pgno: 16
