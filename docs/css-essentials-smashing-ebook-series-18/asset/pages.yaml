  md: '# Conclusion


    Enough with the boring talk, now it''s time for you to grab the information on
    this post and go try it for yourself: start by creating an experimental page and
    test all of these selectors, come back here when in doubt and make sure to always
    refer to the W3C specs, but don''t just sit there thinking that because these
    selectors aren''t yet widely supported you might as well ignore them.


    If you''re a bit more adventurous, or if you''re not afraid of letting go of the
    past filled with useless and non-semantic classes and ids, why not sneak one or
    two of these powerful CSS selectors into your next project? We promise you''ll
    never look back.'
