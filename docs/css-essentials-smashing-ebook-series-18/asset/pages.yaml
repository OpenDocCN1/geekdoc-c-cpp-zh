  md: 'Consider factors such as these when creating CSS layouts:


    +   * Browser

    Is the design attractive and usable with the most current and popular browsers?
    Is it at least usable with old browsers?


    +   * Platform

    Does the design work on PC, Mac and Linux machines?


    +   * Device

    Does the design adapt to low-resolution mobile devices? How does it look on mobile
    devices that have full resolution (e.g. iPhones)?


    +   * Screen resolution

    Does the design stay together at multiple viewport (i.e. window) widths? Is it
    attractive and easy to read at different widths? If the design adapt to different
    viewport widths, does it correct for extremely narrow or wide viewports (e.g.
    by using the **min-width** and **max-width** properties)?


    +   * Font sizes

    Does the design accommodate different font sizes? Does the design hold together
    when the font size is changed on the fly? Is it attractive and easy to read at
    different font sizes?


    +   * Color

    Does the design make sense and is the content readable in black and white? Would
    it work if you are color blind or have poor vision or cannot detect color contrast?


    +   * JavaScript presence

    Does the page work without JavaScript?'
  merge: -1
  pgno: 100
- img_proc: true
  md: '+   * Image presence

    Does the content make sense and is it readable without images (either background
    or foreground)?


    +   * Assistive technology/disability

    Does the page work well in screen readers? Does the page work without a mouse?


    This is not a comprehensive list; and even so, you would not be able to accommodate
    every one of these variations in your design. But the more you can account for,
    the more user-friendly, robust and successful your website will be.


    # Modular


    Modern websites are no longer collections of static pages. Pieces of content and
    design components are reused throughout a website and even shared between websites,
    as content management systems (CMS), RSS aggregation and user-generated content
    increase in popularity. Modern design components have to be able to adapt to all
    of the different places they will be used and the different types and amount of
    content they will contain.'
  merge: -1
  pgno: 101
- img_proc: true
  md: '![](img/736c504465a39c9f3caa50d5252a3998_102_0.png)


    livepage.apple.comObject Oriented CSS is Nicole Sullivan’s attempt to create a
    framework that would allow developers to write fast, maintainable, standards-based,
    modular front end code.


    Modular CSS, in a broad sense, is CSS that can be broken down into chunks that
    work independently to create design components that can themselves be reused independently.
    This might mean separating your style into multiple sheets, such as layout.css,
    type.css, and color.css. Or it might mean creating a collection of universal CSS
    classes for form layout that you can apply to any form on your website, rather
    than to style each form individually. CMS'', frameworks, layout grids and other
    tools all help you create more modular Web pages.'
  merge: -1
  pgno: 102
- img_proc: true
  md: 'Modular CSS offers these benefits (depending on which techniques and

    tools you use):


    +   - Smaller file sizes

    When all of the content across your website is styled with only a handful

    of CSS classes, rather than an array of CSS IDs that only work on

    particular pieces of content on particular pages, your style sheets will

    have many fewer redundant lines of code.


    +   - Reduced development time

    Using frameworks, standard classes and other modular CSS tools keeps

    You from having to re-invent the wheel every time you start a new

    website. By using your own or other developers'' tried and true CSS

    classes, you spend less time testing and tweaking in different browsers.


    +   - Reduced maintenance time

    When your style sheets include broad, reusable classes that work

    anwhere on your website, you don''t have to come up with new styles

    when you add new content. Also, when your CSS is lean and well

    organized, you spend less time tracking down problems in your style

    sheets when browser bugs pop up.


    +   - Easier maintenance for others

    In addition to making maintenance less time-consuming for you, well-

    organized CSS and smartly named classes also make maintenance

    easier for developers who weren''t involved in the initial development of

    the style sheets. They''ll be able to find what they need and use it more

    easily. CMS'' and frameworks also allow people who are not as familiar

    with your website to update it easily, without screwing anything up.'
  merge: -1
  pgno: 103
- img_proc: true
  md: '+   More design flexibility

    Frameworks and layout grids make it easy, for instance, to switch between different
    types of layout on different pages or to plug in different types of content on
    a single page.


    +   More consistent design

    By reusing the same classes and avoiding location-specific styling, you ensure
    that all elements of the same type look the same throughout the website. CMS''
    and frameworks provide even more insurance against design inconsistency.


    # Efficient


    Modern CSS-based websites should be efficient in two ways:


    +   Efficient for you to develop,


    +   Efficient for the server and browser to display to users.


    As Web developers, we can all agree that efficiency on the development side is
    a good thing. If you can save time while still producing high-quality work, then
    why wouldn''t you adopt more efficient CSS development practices? But creating
    pages that perform efficiently for users is sometimes not given enough attention.
    Even though connection speeds are getting faster and faster, page load times are
    still very important to users. In fact, as connection speeds increase, users might
    expect all pages to load quickly, so making sure your website can keep up is important.
    Shaving a couple of seconds off the loading time can make a big difference.


    We''ve already discussed how modular CSS reduces development and maintenance time
    and makes your workflow a faster and more efficient. A myriad of tools are out
    there to write CSS quickly, which we''ll cover in part 2 of this article. You
    can also streamline your CSS development'
  merge: -1
  pgno: 104
- img_proc: true
  md: 'process by using many of the new effects offered by CSS 3, which cut down on
    your time spent creating graphics and coding usability enhancements.


    Some CSS 3 techniques also improve performance and speed. For instance, traditional
    rounded-corner techniques require multiple images and DIVs for just one box. Using
    CSS 3 to create rounded corners requires no images, thus reducing the number of
    HTTP calls to the server and making the page load faster. No images also reduces
    the number of bytes the user has to download and speeds up page loading. CSS 3
    rounded-corners also do not require multiple DIVs, which reduces page size and
    speeds up page loading again. Simply switching to CSS 3 for rounded corners can
    give your website a tremendous performance boost, especially if you have many
    boxes with rounded corners on each page.


    Writing clean CSS that takes advantage of shorthand properties, grouped selectors
    and other efficient syntax is of course just important as ever for improving performance.
    Many of the more advanced tricks for making CSS-based pages load faster are also
    not new but are increasing in usage and importance. For instance, the CSS Sprites
    technique, whereby a single file holds many small images that are each revealed
    using the CSS background-position property, was first described by Dave Shea in
    2004 but has been improved and added to a great deal since. Many large enterprises
    now rely heavily on the technique to minimize HTTP requests. And it can improve
    efficiency for those of us working on smaller websites, too. CSS compression techniques
    are also increasingly common, and many automated tools make compressing and optimizing
    your CSS a breeze, as you''ll also learn in part 2 of this article (next chapter).'
