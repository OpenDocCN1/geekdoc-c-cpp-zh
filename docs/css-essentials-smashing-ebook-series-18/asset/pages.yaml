    # CLARIFYING INTENT


    Different elements on the page could have a heading and a body. They’re “protected”
    in that’re a child selector of box. But this isn’t always evident when we’re looking
    at the HTML. We should clarify that particular hd and bd classes are for the box
    module.


    With this improved naming convention, we don’t need to combine the selectors anymore
    in an attempt to namespace our CSS. Our final CSS looks like this:


    ```

    .box {

    border: 1px solid #333;

    }

    box-hd {

    margin: 0;

    padding: 5px 10px;

    border-bottom: 1px solid #333;

    background-color: #CCC;

    }

    box-bd {

    margin: 10px;

    }

    ```'
