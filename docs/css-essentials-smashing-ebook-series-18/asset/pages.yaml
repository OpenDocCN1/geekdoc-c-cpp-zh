  md: '# CSS Specificity And Inheritance


    Inayili de Leon


    CSS’ barrier to entry is extremely low, mainly due to the nature of its syntax.
    Being clear and easy to understand, the syntax makes sense even to the inxperienced
    Web designer. It''s so simple, in fact, that you could style a simple CSS-based
    website within a few hours of learning.


    But this apparent simplicity is deceitful. If after a few hours of work, your
    perfectly crafted website looks great in Safari, all might break loose if you
    haven''t taken the necessary measures to make it work in Internet Explorer. In
    a panic, you add hacks and filters where only a few tweaks or a different approach
    might do. Knowing how to deal with these issues comes with experience, with trial
    and error and with failing massively and then learning the correct way.


    Understanding a few often overlooked concepts is also important. The concepts
    may be hard to grasp and look boring at first, understanding them and knowing
    how to take advantage of them is important.


    Two of these concepts are specificity and inheritance. Not common words among
    Web designers, are they? Talking about border-radius and text-shadow is a lot
    more fun; but specificity and inheritance are fundamental concepts that any person
    who wants to be good at CSS understand. They will help you create clean, maintainable
    and flexible style sheets. Let’s look at what they mean and how they work.'
  merge: -1
  pgno: 169
- img_proc: true
  md: 'The notion of a "cascade" is at the heart of CSS (just look at its name). It
    ultimately determines which properties will modify a given element. The cascade
    is tied to three main concepts: importance, specificity and source order. The
    cascade follows these three steps to determine which properties to assign to an
    element. By the end of this process, the cascade has assigned a weight to each
    rule, and this weight determines which rule takes precedence, when more than one
    applies.


    # 1. Importance


    Style sheets can have a few different sources:


    +   1. **User agent**nFor example, the browser''s default style sheet.


    +   2. **User**nSuch as the user''s browser options.


    +   3. **Author**nThis is the CSS provided by the page (whether inline, embedded
    or external)


    By default, this is the order in which the different sources are processed, the
    author''s rules will override those of the user and user agent, and so on.'
  merge: -1
  pgno: 170
- img_proc: true
  md: 'There is also the **important** declaration to consider in the cascade. This
    declaration is used to balance the relative priority of user and author style
    sheets. While author style sheets take precedence over user ones, if a user rule
    has **important** applied to it, it will override even an author rule that also
    has **important** applied to it.


    Knowing this, let''s look at the final order, in ascending order of importance:


    +   1. User agent declarations,

    2. User declarations,

    3. Author declarations,

    4. Author **important** declarations,

    5. User **important** declarations.


    This flexibility in priority is key because it allows users to override styles
    that could hamper the accessibility of a website. (A user might want a larger
    font or a different color, for example.)


    # 2. Specificity


    Every CSS rule has a particular weight (as mentioned in the introduction), meaning
    it could be more or less important than the others or equally important. This
    weight defines which properties will be applied to an element when there are conflicting
    rules.


    Upon assessing a rule’s importance, the cascade attributes a specificity to it;
    if one rule is more specific than another, it overrides it.


    If two rules share the same weight, source and specificity, the later one is applied.'
  merge: -1
  pgno: 171
- img_proc: true
  md: "# 2.1 HOW TO CALCULATE SPECIFICITY?\n\nThere are several ways to calculate\
    \ a selector's specificity.\n\nThe quickest way is to do the following. Add 1\
    \ for each element and pseudo-element (for example\n\nLet's calculate the specificity\
    \ of the following selectors using this method:\n\n+   * p.note\n  class + 1 element\
    \ = 11\n* #sidebar p[lang=\"en\"]\n  1 ID + 1 attribute + 1 element = 111\n* body\
    \ #main .post ul:last-child\n  1 ID + 1 class + 1 pseudo-class + 3 elements =\
    \ 123\n\nA similar method, described in the W3C's specifications, is to start\
    \ with a=0,nb=0, c=0 and d=0 and replace the numbers accordingly:\n\n+   * a =\
    \ 1 if the style is inline,\n* b = the number of IDs,\n* c = the number of attribute\
    \ selectors, classes and pseudo-classes,\n* d = the number of element names and\
    \ pseudo-elements.\n\nLet's calculate the specificity of another set of selectors:\n\
    \n+   * <p style=\"color:#000000\">\n  a=1, b=0, c=0 -> 1000"
