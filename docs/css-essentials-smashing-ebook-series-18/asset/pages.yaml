  md: Like the attribute selectors, the child selector is not supported by Internet
    Explorer 6. If the effect you are trying to achieve by using it is crucial for
    the website’s usability or overall aesthetics, you can consider using a class
    selector with it, or on a IE-only stylesheet, but that would detract from the
    purpose of using child selectors.
