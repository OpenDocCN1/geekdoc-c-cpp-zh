    ```\n\nThat'll do that the content never changes. However, the point of this exercise\
    \ is to recognize that websites can and do change. Therefore, we have to be proactive\
    \ and recognize that there are alternative elements we might want to use.\n\n\
    For greater flexibility, let's use classes to define the different parts of this\
    \ module:\n\n```\n.box .hd { } /* this is our box heading */\n.box .bd { } /*\
    \ this is our box body */\n```\n\nWhen applied to the HTML, it looks like this:\n\
    \n```\n<div class=\"box\">\n  <h2 class=\"hd\">About the Site</h2>\n```"
