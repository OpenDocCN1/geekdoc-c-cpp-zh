  md: "# !important CSS Declarations: How And When To Use Them\n\nLouis Lazaridis\n\
    \nWhen the CSS1 specification was drafted in the mid to late 90s, it introduced\
    \ !important declarations that would help developers and users easily override\
    \ normal specificity when making changes to their stylesheets. For the most part,\
    \ !important declarations have remained the same, with only one change in CSS2.1\
    \ and nothing new added or altered in the CSS3 spec in connection with this unique\
    \ declaration.\n\n```\n.smashtabs.smashui .ui-tabs-nav default.include.3610348578.css:1\
    \ li, #smashtabs.smashui .ui-tabs-nav li a, #smashtabs.smashui .ui-tabs-nav li\
    \ strong, #smashtabs.smashui .ui-tabs-nav li span {\nbackground-image: none;\n\
    height: auto;\nwidth: auto;\n}\nsmashui .ui-tabs-nav li.ui-tabs-nav default.include.3610348578.css:1\
    \ selected a strong {\n  background-position: -1550px -415px !important;\n  outline:\
    \ none;\n}\nsmashui .ui-tabs-nav li a strong default.include.3610348578.css:1\
    \ {\n```"
