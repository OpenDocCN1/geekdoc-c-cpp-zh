  md: '# Modern CSS Layouts, Part 2: The Essential Techniques


    Zoe Mickley Gillenwater


    In the previous chapter “Modern CSS Layouts, Part 1: The Essential Characteristics”,
    you learned that modern, CSS-based web sites should be progressively enhanced,
    adaptive to diverse users, modular, efficient and typographically rich. Now that
    you know what characterizes a modern CSS web site, how do you build one? Here
    are dozens of essential techniques and tools to learn and use to achieve the characteristics
    of today’s most successful CSS-based web pages.


    Just as in the previous chapter, we’re not going to be talking about design trends
    and styles; these styles are always changing. Instead, we’re focusing on the specific
    techniques that you need to know to create modern CSSbased pages of any style.
    For each technique or tool, we’ll indicate which of the five characteristics it
    helps meet. To keep this shorter than an encyclopedia, we’ll also just cover the
    basics of each technique, then point you some useful, hand-picked resources to
    learn the full details.


    You can jump straight to:


    +   - CSS3

    - HTML5

    - IE Filtering

    - Flexible Layouts

    - Layout Grids'
