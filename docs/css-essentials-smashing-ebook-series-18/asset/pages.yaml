  md: '# SPECIFICS ON FLOATED ELEMENTS


    Following is a list of exact behaviors of floated elements according to CSS2 Specifications:


    +   - A left-floated box will shift to the left until its leftmost margin edge
    (or border edge if margins are absent) touches either the edge of the containing
    block, or the edge of another floated box

    - If the size of the floated box exceeds the available horizontal space, the floated
    box will be shifted down

    - Non-positioned, non-floated, block-level elements act as if the floated element
    is not there, since the floated element is out of flow in relation to other block
    elements

    - Margins of floated boxes do not collapse with margins of adjacent boxes

    - The root element (<html>) cannot be floated

    - An inline element that is floated is converted to a block-level element'
  merge: -1
  pgno: 28
