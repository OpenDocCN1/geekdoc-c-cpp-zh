  md: "The CSS applied to the image in the box above is as follows:\n\n```\nimg {\n\
    \  float: left;\n  margin: 0 15px 5px 0;\n  border: solid 1px #bbb;\n}\n```\n\n\
    The only property required to make this effect work is the **float** property.\n\
    The other properties (margin and border) are there for aesthetic reasons.\nThe\
    \ other elements inside the box (the <p> tags with text inside them) do not need\
    \ any styles applied to them.\n\nAs mentioned earlier, floated elements are taken\
    \ out of flow in relation to other block elements, and so other block elements\
    \ remain in flow, acting as if the floated element is not even there. This is\
    \ demonstrated visually below:\n\n![](img/736c504465a39c9f3caa50d5252a3998_30_0.png)"
  merge: -1
  pgno: 30
- img_proc: true
  md: 'In the above example, the <p> element is a block-level element, so it ignores
    the floated element, spanning the width of the container (minus padding). All
    non-floated, block-level elements will behave in like manner.


    The text in the paragraph is inline, so it flows around the floated element. The
    floated box is also given margin settings to offset it from the paragraph, making
    it visually clear that the paragraph element is ignoring the floated box.


    # Clearing Floats


    Layout issues with floats are commonly fixed using the CSS clear property, which
    lets you “clear” floated elements from the left or right side, or both sides,
    of an element.


    Let’s take a look at an example that commonly occurs — a footer wrapping to the
    right side of a 2-column layout:'
  merge: -1
  pgno: 31
- img_proc: true
  md: "If you view this page in IE6 or IE7, you won't see any problems. The left and\
    \ right columns are in place, and the footer is nicely tucked underneath. But\
    \ in Firefox, Opera, Safari, and Chrome, you'll see the footer jump up beside\
    \ the left column. This is caused by the float applied to the columns. This is\
    \ the correct behavior, even though it is a more problematic one. To resolve this\
    \ issue, we use the aforementioned clear property, applied to the footer:\n\n\
    ```\n#footer {\n  clear: both;\n}\n```"
  merge: -1
  pgno: 32
- img_proc: true
  md: 'The result is shown below:


