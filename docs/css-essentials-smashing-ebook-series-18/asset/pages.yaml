  md: '# The Problem With CSS Sprites


    While Photoshop is booting, take a moment to consider why CSS sprites have had
    such a hard time getting widespread acceptance and support. I''m always struggling
    to find the correct starting position for each image within a sprite. I''ll usually
    forget the exact coordinates by the time I need to write them down in the style
    sheet, especially when the image is located at **x: 259, y: 182** and measures
    17×13 pixels.


    I''m always switching back and forth between Photoshop and my CSS editor to write
    down the correct values, getting more and more frustrated with every switch. I
    know software is out there specifically tailored to help deal with this, I''ve
    never found an application that lets me properly structure its CSS output so I
    can just copy and paste it into my CSS file.


    Another important thing to realize is that CSS sprites are meant to be one part
    of our website optimization toolkit. Many of the people who write and blog about
    CSS sprites are comfortably wearing their optimization hats while laying out best
    practices, often going a little overboard and losing track of how much effort
    it requires to implement their methods of choice.


    This is fine if you''re working on an optimization project, but it becomes counterproductive
    when you need to build a website from scratch fighting tight deadlines. If you
    have time to truly focus on implementing a CSS sprite, it''s really not all that
    hard; but if you have to juggle 50 other priorities at the same time, does it
    turn into a nuisance for many developers. With these two factors in mind, we''ll
    try to find a way to make image targeting easier, while coming to terms with the
    fact that sometimes we have to sacrifice full optimization in the name of ease
    of development.'
