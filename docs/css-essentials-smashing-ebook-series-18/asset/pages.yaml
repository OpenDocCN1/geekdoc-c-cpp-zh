  md: 'This goes 100% of the way across the image (i.e. the very right-hand edge)
    and 100% of the way across the element (remember, the starting point is always
    the top-left corner), and the two line up there. It then goes 50% of the way down
    the image and 50% of the way down the element to line up there. The result is
    that the image is aligned to the right of the element and exactly half-way down
    it.


    ![](img/736c504465a39c9f3caa50d5252a3998_11_0.png)


    The smiley face is aligned as it would be if it was set to right center.'
