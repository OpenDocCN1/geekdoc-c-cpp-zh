  md: "# 3. Sibling combinators\n\nThere are two types of sibling combinators: adjacent\
    \ sibling combinators and general sibling combinators.\n\n# ADJACENT SIBLING COMBINATOR\n\
    \nThe adjacent sibling combinator can be very useful, for example, when dealing\
    \ with text. Lets say you want to add a top margin to all the h2 tags that follow\
    \ a paragraph (you don't need to add a top margin if the heading comes after an\
    \ h1 tag or if it's the first element on that page):\n\n```\np + h2 {\n  margin-top:\
    \ 10px;\n}\n```\n\nYou can be even more specific and say that you only want this\
    \ rule applied if the elements are within a particular div:\n\n```\ndiv.post p\
    \ + h2 {\n  margin-top: 10px;\n}\n```\n\nOr you can add another level of complexity:\
    \ say you want the first line of the paragraphs of every page to be in small caps.\n\
    \n```\n.post h1 + p:first-line {\n  font-variant: small-caps;\n}\n```"
  merge: -1
  pgno: 241
- img_proc: true
  md: 'Because you know that the first paragraph of every post immediately follows
    an h1 tag, you can refer to the h1 on your selector.


    # GENERAL SIBLING COMBINATOR


    The general sibling combinator works pretty much the same as the adjacent sibling
    combinator, but with the difference that the second selector doesn''t have to
    immediately follow the first one.


    So if you need to target all the p tags that are within a particular div and that
    follow the h1 tag (you may want those p tags to be larger than the ones that come
    before the title of your post), you can use this selector:


    ```

    .post h1 ~ p {

    font-size: 13px;

    }

    ```


    Notes on browser support

    Internet Explorer 6 doesn''t understand sibling combinators, but, as for the other
    cases, if your audience includes a small percentage of IE6 users, and if the website''s
    layout isn''t broken or severely affected by its lack of support, this is a much
    easier way of achieving lots of cool effects without the need of cluttering your
    HTML with useless classes and ids.


    # 4. Pseudo-classes


    # DYNAMIC PSEUDO-CLASSES


    These are called dynamic pseudo-classes because they actually do not exist within
    the HTML: they are only present when the user is or has interacted with the website.'
  merge: -1
  pgno: 242
- img_proc: true
  md: "There are two types of dynamic pseudo-classes: link and user action ones. The\
    \ link are :link and :visited, while the user action ones are :hover, :active\
    \ and :focus.\n\nFrom all the CSS selectors mentioned in this post, these will\
    \ probably be the ones that are most commonly used.\n\nThe :link pseudo-class\
    \ applies to links that haven't been visited by the user, while the :visited pseudo-class\
    \ applies to links that have been visited, so they are mutually exclusive.\n\n\
    The :hover pseudo-class applies when the user moves the cursor over the element,\
    \ without having to activate or click on it. The :active pseudo-class applies\
    \ when the user actually clicks on the element. And finally the :hover pseudo-class\
    \ applies when that element is on focus — the most common application is on form\
    \ elements.\n\nYou can use more than one user action dynamic pseudo-class in your\
    \ stylesheets, so you can have, for example, a different background color for\
    \ an input field depending on whether the user's cursor is only hovering over\
    \ it or hovering over it while in focus:\n\n```\ninput:focus {\n  background:\
    \ #D2D2D2;\n  border: 1px solid #5E5E5E;\n}\n```\n\n```\ninput:focus:hover {\n\
    \  background: #C7C7C7;\n}\n```\n\n# Notes on browser support\n\nThe dynamic pseudo-classes\
    \ are supported by all modern browsers, even IE6. But bear in mind that IE6 only\
    \ allows the :hover pseudo-class to be"
  merge: -1
  pgno: 243
- img_proc: true
  md: "applied to link elements (a) and only IE8 accepts the :active state on elements\
    \ other than links.\n\n# :FIRST-CHILD\n\nThe :first-child pseudo-class allows\
    \ you to target an element that is the first child of another element. For example,\
    \ if you want to add a top margin to the first li element of your unordered lists,\
    \ you can have this:\n\n```\nul > li:first-child {\n  margin-top: 10px;\n}\n```\n\
    \nLet's take another example: you want all your h2 tags in your sidebar to have\
    \ a top margin, to separate them from whatever comes before them, but the first\
    \ one doesn't need a margin. You can use the following code:\n\n```\n#sidebar\
    \ > h2 {\n  margin-top: 10px;\n}\n#sidebar > h2:first-child {\n  margin-top: 0;\n\
    }\n```\n\nNotes on browser support\nIE6 doesn't support the :first-child pseudo-class.\
    \ Depending on the design that the pseudo-class is being applied to, it may not\
    \ be a major concern for concern. For example, if you are using the :first-child\
    \ selector to remove top or bottom margins from headings or paragraphs, your layout\
    \ probably not break in IE6, it will only look slightly different. But if you\
    \ are using the :first-child selector to remove left and right margins from, divs,\
    \ that may cause more disruption to your designs."
  merge: -1
  pgno: 244
- img_proc: true
  md: '# THE LANGUAGE PSEUDO-CLASS


    The language pseudo-class, :lang(), allows you to match an element based on its
    language.


    For example, lets say you want a specific link on your site to have a different
    background color, depending on that page''s language:


    ```

    :lang(en) > a#flag {

    background-image: url(english.gif);

    }

    :lang(fr) > a#flag {

    background-image: url(french.gif);

    }

    ```


    The selectors will match that particular link if the page''s language is either
    equal to "en" or "fr" or if it starts with "en" or "fr" and is immediately followed
    by an "-",


    # Notes on browser support


    Not surprisingly, the only version of Internet Explorer that supports this selector
    is 8. All other major browsers support the language pseudo-selector.


    # 5. CSS 3 Pseudo-classes


    # :TARGET


    When you''re using links with fragment identifiers (for example, http://www.smashingmagazine.com/2009/08/02/bauhaus-ninety-years-of-inspiration/#comments,
    where "#comments" is the fragment identifier), you can style the target by using
    the :target pseudo-class.'
  merge: -1
  pgno: 245
- img_proc: true
  md: "For example, lets imagine you have a long page with lots of text and h2 headings,\
    \ and there is an index of those headings at the top of the page. It will be much\
    \ easier for the user if, when clicking on a particular link within the index,\
    \ that heading would be highlighted in some way, when the page scrolls down. Easy:\n\
    \n```\nh2:target {\n  background: #F2EBD6;\n}\n```\n\n# Notes on browser support\n\
    \nThis time, Internet Explorer is really annoying and has no support at all for\
    \ the :target pseudo-class. Another glitch is that Opera doesn't support this\
    \ selector when using the back and forward buttons. Other than that, it has support\
    \ from the other major browsers.\n\n# THE UI ELEMENT STATES PSEUDO-CLASSES\n\n\
    Some HTML elements have an enable or disabled state (for example, input fields)\
    \ and checked or unchecked states (radio buttons and checkboxes). These states\
    \ can be targeted by the :enabled, :disabled or :checked pseudo-classes, respectively.\n\
    \nSo you can say that any input that is disabled should have a light grey background\
    \ and dotted border:\n\n```\ninput:disabled {\n  border:1px dotted #999;\n  background:#F2F2F2;\n\
    }\n```\n\nYou can also say that all checkboxes that are checked should have a\
    \ left margin (to be easily seen within a long list of checkboxes):"
  merge: -1
  pgno: 246
- img_proc: true
  md: "```\ninput[type=\"checkbox\"]:checked {\n  margin-left: 15px;\n}\n```\n\n#\
    \ Notes on browser support\n\nAll major browsers, except our usual suspect, Internet\
    \ Explorer, support the UI element states pseudo-classes. If you consider that\
    \ you are only adding an extra level of detail and improved usability to your\
    \ visitors, this can still be an option.\n\n# 6. CSS 3 structural pseudo-classes\n\
    \n# :NTH-CHILD\n\nThe :nth-child() pseudo-class allows you to target one or more\
    \ specific children of a parent element.\n\nYou can target a single child, by\
    \ defining its value as an integer:\n\n```\nul li:nth-child(3) {\n  color: red;\n\
    }\n```\n\nThis will turn the text on the third li item within the ul element red.\
    \ Bear mind that if a different element is inside the ul (not a li), it will also\
    \ be counted as its child.\n\nYou can target a parent's children using expressions.\
    \ For example, the following expression will match every li element starting from\
    \ the fourth:\n\n```\nul li:nth-child(3n+4) {\n  color: yellow;\n}\n```"
  merge: -1
  pgno: 247
- img_proc: true
  md: "In the previous case, the first yellow **li** element will be the fourth. If\
    \ you just want to start counting from the first **li** element, you can use a\
    \ simpler expression:\n\n```\nul li:nth-child(3n) {\n  color: yellow;\n}\n```\n\
    \nIn this case, the first yellow **li** element will be the third, and every other\
    \ third after it. Now imagine you want to target only the first four **li** elements\
    \ within the list:\n\n```\nul li:nth-child(-n+4) {\n  color: green;\n}\n```\n\n\
    The value of :nth-child can also be defined as \"even\" or \"odd\", which are\
    \ the same as using \"2n\" (every second child) or \"2n+1\" (every second child\
    \ starting from the first), respectively.\n\n# :NT-LAST-CHILD\n\nThe :nth-last-child\
    \ pseudo-class works basically as the :nth-child pseudo-class, but it starts counting\
    \ the elements from the last one.\n\nUsing one of the examples above:\n\n```\n\
    ul li:nth-child(-n+4) {\n  color: green;\n}\n```\n\nInstead of matching the first\
    \ four **li** elements in the list, this selector will match the /last four elements."
  merge: -1
  pgno: 248
- img_proc: true
  md: "You can also use the values “even” or “odd”, with the difference that in this\
    \ case they will count the children starting from the last one:\n\n```\nul li:nth-last-child(odd)\
    \ {\n  color: grey;\n}\n```\n\n# :NTH-OF-TYPE\n\nThe **nth-of-type** pseudo-class\
    \ works just like the **nth-child**, with the difference that it only counts children\
    \ that match the element in the selector.\n\nThis can be very useful if we want\
    \ to target elements that may contain different elements within them. For example,\
    \ let’s imagine we want to turn every second paragraph in a block of blue text,\
    \ but we want to ignore other elements such as images or quotations:\n\n```\n\
    p:nth-of-type(even) {\n  color: blue;\n}\n```\n\nYou can use the same values as\
    \ you would use for the **nth-child** pseudo-class.\n\n# :NTH-LAST-OF-TYPE\n\n\
    You guessed it! The **nth-last-of-type** pseudo-class can be used exactly like\
    \ the aforementioned **nth-last-child**, but this time, it will only target the\
    \ elements that match our selector:\n\n```\nul li:nth-last-of-type(-n+4) {\n \
    \ color: green;\n}\n```"
  merge: -1
  pgno: 249
- img_proc: true
  md: "We can be even more clever, and combine more than one of these pseudo-classes\
    \ together on a massive selector. Let's say all images within a post div to be\
    \ floated left, except for the first and last one (let's image these full width,\
    \ so they shouldn't be floated):\n\n```\n.post img:nth-of-type(n+2):nth-last-of-type(n+2)\
    \ {\n  float: left;\n}\n```\n\nSo in the first part of this selector, we are targeting\
    \ every image starting from the second one. In the second part, we are targeting\
    \ every image except for the last one. Because the selectors aren't mutually exclusive,\
    \ we can use them both on one selector thus excluding both the first and last\
    \ element at once!\n\n# :LAST-CHILD\n\nThe :last-child pseudo-class works just\
    \ as the :first-child pseudo-class, but instead targets the last child of a parent\
    \ element.\n\nLet's image you don't want the last paragraph within your post div\
    \ to have a bottom margin:\n\n```\n.post > p:last-child {\n  margin-bottom: 0;\n\
    }\n```\n\nThis selector will target the last paragraph that is a direct and the\
    \ last child of an element with the class of “post”.\n\n# :FIRST-OF-TYPE AND :LAST-OF-TYPE\n\
    \nThe :first-of-type pseudo-class is used to target an element that is the first\
    \ of its type within its parent."
  merge: -1
  pgno: 250
- img_proc: true
  md: "For example, you can target the first paragraph that is a direct child of a\
    \ particular **div**, and capitalize its first line:\n\n```\n.post > p:first-of-type:first-line\
    \ {\n  font-variant: small-caps;\n}\n```\n\nWith this selector you make sure that\
    \ you are targeting only paragraphs that are direct children of the “post” **div**,\
    \ and that are the first to match our **p** element.\n\nThe: **last-of-type**\
    \ pseudo-class works exactly the same, but targets the **last** child of its type\
    \ instead.\n\n# :ONLY-CHILD\n\nThe: **only-child** pseudo-class represents an\
    \ element that is the only child of its parent.\n\nLet’s say you have several\
    \ boxes (“news”) with paragraphs of text inside them. When you have more than\
    \ one paragraph, you want the text to be smaller than when you have only one:\n\
    \n```\ndiv.news > p {\n  font-size: 1.2em;\n}\ndiv.news > p:only-child {\n  font-size:\
    \ 1.5em;\n}\n```\n\nIn the first selector, we are defining the overall size of\
    \ the **p** elements that are direct children of a “news” **div**. On the second\
    \ one, we are overriding the previous font-size by saying, if the **p** element\
    \ is the only child of the “news” **div**, its font size should be bigger."
  merge: -1
  pgno: 251
- img_proc: true
  md: "# :ONLY-TYPE\n\nThe **only-of-type** pseudo-class represents an element that\
    \ is the only child of its parent with the same element.\n\nHow can this be useful?\
    \ Image you have a sequence of posts, each one represented by a **div** with the\
    \ class of “post”. Some of them have more than one image, but others have only\
    \ one. You want the image within the later ones to be aligned to the center, while\
    \ the images on posts with more than one image to be floated. That would be quite\
    \ easy to accomplish with this selector:\n\n```\n.post > img {\n  float: left;\n\
    }\n.post > img:only-of-type {\n  float: none;\n  margin: auto;}\n```\n\n# :EMPTY\n\
    \nThe **empty** pseudo-class represents an element that has no content within\
    \ it.\n\nIt can be useful in a number of ways. For example, if you have multiple\
    \ boxes in your “sidebar” **div**, but don't want the empty ones to appear on\
    \ the page:\n\n```\n#sidebar .box:empty {\n  display: none;\n}\n```\n\nBeware\
    \ that even if there is a single space in the “box” **div**, it will not be treated\
    \ as empty by the CSS, and therefore will not match the selector."
  merge: -1
  pgno: 252
- img_proc: true
  md: "# Notes on browser support\n\nInternet Explorer (up until version 8) has no\
    \ support for structural pseudo-classes. Firefox, Safari and Opera support these\
    \ pseudo-classes on their latest releases. This means that if what's being accomplished\
    \ with these selectors is fundamental for the website’s usability and accessibility,\
    \ or if the larger part of the website’s audience is using IE and you don't want\
    \ to deprive them of some design details, it is better to keep using classes and\
    \ simpler selectors to cater for those browsers. If not, you can just go crazy!\n\
    \n# 7. The negation pseudo-class\n\nThe negation pseudo-class, :not(), lets you\
    \ target elements that do not match the selector that is represented by its argument.\n\
    \nFor example, this can be useful if you need to style the input elements within\
    \ a form, but you don't want your input elements with the type submit to be styled\
    \ — you want them to be styled in a different way —, to look more like buttons:\n\
    \nAnother example: you want all the paragraphs within your div to have a larger\
    \ font-size, except for the one that indicates the time and date:\n\n```\n.post\
    \ p:not(.date) {\n  font-size: 13px;\n}\n```"
  merge: -1
  pgno: 253
- img_proc: true
  md: "Can you image the number of possibilities this selector brings with it, and\
    \ the amount of useless selectors you could strip out of your CSS files were widely\
    \ supported?\n\n# Notes on browser support\nInternet Explorer is our usual party\
    \ pooper here: no support at all, not even on IE8. This probably means that this\
    \ selector will still have to wait a while before some developers lose the fear\
    \ of adding them to their stylesheets.\n\n# 8. Pseudo-elements\n\nPseudo-elements\
    \ allow you to access elements that don’t actually exist in the HTML, like the\
    \ first line of a text block or its first letter.\n\nPseudo-elements exist in\
    \ CSS 2.1, but the CSS 3 specifications state that they should be used with the\
    \ double colon “:\\”, to distinguish them from pseudoclasses. In CSS 2.1, they\
    \ are used with only one colon, \":\". Browsers should be able accept both formats,\
    \ except in the case of pseudo-elements may be introduced only in CSS 3.\n\n#\
    \ ::FIRST-LINE\n\nThe ::first-line pseudo-element will match the first line of\
    \ a block, inline-block, table-caption or table-cell element.\n\nThis is particularly\
    \ useful to add subtle typographical details to your text blocks, like, for example,\
    \ transforming the first line of an article into small caps:\n\n```\nhl + p::first-line\
    \ {\n  font-variant: small-caps;\n}\n```"
  merge: -1
  pgno: 254
- img_proc: true
  md: 'If you''ve been paying attention, you''ll know that this means the paragraph
    that comes immediately after an h1 tag (“+\”) should have its first line in small
    caps.


    You could also refer to the first line of a particular div, without having to
    refer to the actual paragraph tag:


    ```

    div.post p::first-line { font-variant: small-caps; }

    ```


    Or go one step farther and target specifically the first paragraph within a particular
    div:


    ```

    div.post > p:first-child::first-line { font-variant: small-caps; }

    ```


    Here, the ">" symbol indicates that you are targeting a direct child the post
    div, so if the paragraph were to be inside a second div, it wouldn''t match this
    selector.


    # ::FIRST-LETTER


    The ::first-letter pseudo-element will match the first letter of a block, unless
    it''s preceded by some other content, like an image, on the same line.


    The ::first-line pseudo-element, ::first-letter is commonly used to add typographical
    details to text elements, like drop caps or initials.


    Here is how you could use the ::first-letter pseudo-element to create a drop cap:


    ```

    p { font-size: 12px; }

    ```'
  merge: -1
  pgno: 255
- img_proc: true
  md: "```\np::first-letter {\n  font-size: 24px;\n  float: left;\n}\n```\n\nBear\
    \ in mind that if you use both ::first-line and ::first-letter in the same element,\
    \ the ::first-letter properties will override the same properties inherited from\
    \ ::first-line.\n\nThis element can produce unexpected results, if you're not\
    \ aware of the W3C specs: it's actually the CSS selector with the longest spec!\
    \ So it's a good idea to read them carefully if you're planning on using it (as\
    \ it is for all the other selectors).\n\n# ::BEFORE AND ::AFTER\n\nThe ::before\
    \ and ::after pseudo-elements are used to insert content before or after an element's\
    \ content, purely via CSS.\n\nThese elements will inherit many of the properties\
    \ of the elements that they are being attached to.\n\nImage you want to the words\
    \ \"Graphic number x:\" before the descriptions of graphs and charts on your page.\
    \ You could achieve this without having to write the words \"Graphic number\"\
    , or the number yourself:\n\n```\n.post {\n  counter-reset: image;\n}\np.description::before\
    \ {\n  content: \"Figure number \" counter(image) \": \"\"\n  counter-increment:\
    \ image;\n}\n```\n\nWhat just happened here?"
  merge: -1
  pgno: 256
- img_proc: true
  md: 'First, we tell the HTML to create the "image" counter. We could have added
    this property to the body of the page, for example. Also, we can call this counter
    whatever name we want to, as long as we always reference it by the same name:
    try it for yourself!


    Then we say we want to add, before every paragraph with the class "description",
    this piece of content: "Figure number " — notice that only we wrote between quotes
    will be created on the page, so we need to add the spaces as well!


    After that, we have `counter(image)` : this will pick up the property we''ve already
    defined in the `.post` selector. It will by default start with the number one
    (1).


    The next property is there so that the counter knows for each `p.description`,
    it needs to increment the image counter by `1 (counter-increment: image).`


    It''s not as complicated as it looks, and it can be quite useful.


    The `::before` and `::after` pseudo-elements are often only used with the content
    property, to add small sentences or typographical elements, but here''s shown
    how we can use it in a more powerful way in conjunction with the `counter-reset`
    and `counter-increment` properties.


    Fun fact: the `::first-line` and `::first-letter` pseudo-elements match the content
    added by the `::before` pseudo-element, if present.


    # Notes on browser support


    These pseudo-elements are supported by IE8 (not IE7 or 6), if the single colon
    format is used (for example, `:first-letter`, not `::first-letter`). All the other
    major browsers support these selectors.'
