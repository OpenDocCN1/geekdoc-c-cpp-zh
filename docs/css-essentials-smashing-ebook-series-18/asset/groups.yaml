    # # The Z-Index CSS Property: A Comprehensive Look


    Louis Lazaris


    Most CSS properties are quite simple to deal with. Often, applying a CSS property
    to an element in your markup will have instant results — as soon as you refresh
    the page, the value set for the property takes effect, and you see the result
    immediately. Other CSS properties, however, are a little complex and will only
    work under a given set of circumstances.


    The **z-index** property belongs to the latter group. **z-index** has undoubtedly
    caused as much confusion and frustration as any other CSS property. Ironically,
    when **z-index** is fully understood, it is a very easy property to use, and offers
    an effective method for overcoming many layout challenges.


    In this article, we''ll explain exactly what **z-index** is, how it has been misunderstood
    and we will discuss some practical uses for it. We''ll also describe some of the
    browser differences that can occur, particularly in previous versions of Internet
    Explorer and Firefox. This comprehensive look at **z-index** should provide developers
    with an excellent foundation to be able to use this property confidently and effectively.'
  - '[PAGE 52]


    # What is it?


    The **z-index** property determines the stack level of an HTML element. The “stack
    level” refers to the element’s position on the Z axis (as opposed to the X axis
    or Y axis). A higher **z-index** value means the element will be closer to the
    top of the stacking order. This stacking order runs perpendicular to the display,
    or viewport.


    # 3-DIMENSIONAL REPRESENTATION OF THE Z AXIS:


    ![](img/736c504465a39c9f3caa50d5252a3998_52_0.png)'
  - '[PAGE 53]


    In order to clearly demonstrate how z-index works, the image above exaggerates
    the display of stacked elements in relation to the viewport.


    # The Natural Stacking Order


    In an HTML page, the natural stacking order (i.e. the order of elements on the
    Z axis) is determined by a number of factors. Below is a list showing the order
    that items fit into a stacking context, starting with the bottom of the stack.
    This list assumes none of the items has z-index applied:


    +   - Background and borders of the element that establish stacking context


    +   - Elements with negative stacking contexts, in order of appearance


    +   - Non-positioned, non-floated, block-level elements, in order of appearance


    +   - Non-positioned, floated elements, in order of appearance


    +   - Inline elements, in order of appearance


    +   - Positioned elements, in order of appearance'
  - '[PAGE 54]


    The z-index property, when applied correctly, can change this natural stacking
    order.


    Of course, the stacking order of elements is not evident unless elements are positioned
    to overlap one another. Thus, to see the natural stacking order, negative margins
    can be used as shown below:


    ![](img/736c504465a39c9f3caa50d5252a3998_54_0.png)'
  - '[PAGE 55]


    The boxes above are given different background and border colors, and the last
    two are indented and given negative top margins so you can see the natural stacking
    order. The grey box appears first in the markup, the blue box second, and the
    gold box third. The applied negative margins clearly demonstrate this fact. These
    elements do not have z-index values set; their stacking order is the natural,
    or default, order. The overlaps that occur are due to the negative margins.


    # Why Does it Cause Confusion?


    Although z-index is not a difficult property to understand, due to false assumptions
    it can cause confusion for beginning developers. This confusion occurs because
    z-index will only work on an element whose position property has been explicitly
    set to absolute, fixed, or relative.


    To demonstrate that z-index only works on positioned elements, here are the same
    three boxes with z-index values applied to attempt to reverse their stacking order:'
  - '[PAGE 56]


    ![](img/736c504465a39c9f3caa50d5252a3998_56_0.png)'
  - '[PAGE 57]


    The grey box has a z-index value of "9999"; the blue box has a z-index value of
    "500"; and the gold box has a z-index value of "1". Logically, you would assume
    that the stacking order of these boxes should now be reversed. But that is not
    the case, because none of these elements has the position property set.


    Here are the same boxes with position: relative added to each, and their z-index
    values maintained:'
  - '[PAGE 58]


    ![](img/736c504465a39c9f3caa50d5252a3998_58_0.png)


