  - '[PAGE 31]


    In the above example, the <p> element is a block-level element, so it ignores
    the floated element, spanning the width of the container (minus padding). All
    non-floated, block-level elements will behave in like manner.


    The text in the paragraph is inline, so it flows around the floated element. The
    floated box is also given margin settings to offset it from the paragraph, making
    it visually clear that the paragraph element is ignoring the floated box.


    # Clearing Floats


    Layout issues with floats are commonly fixed using the CSS clear property, which
    lets you “clear” floated elements from the left or right side, or both sides,
    of an element.


    Let’s take a look at an example that commonly occurs — a footer wrapping to the
    right side of a 2-column layout:'
  - "[PAGE 32]\n\nIf you view this page in IE6 or IE7, you won't see any problems.\
    \ The left and right columns are in place, and the footer is nicely tucked underneath.\
    \ But in Firefox, Opera, Safari, and Chrome, you'll see the footer jump up beside\
    \ the left column. This is caused by the float applied to the columns. This is\
    \ the correct behavior, even though it is a more problematic one. To resolve this\
    \ issue, we use the aforementioned clear property, applied to the footer:\n\n\
    ```\n#footer {\n  clear: both;\n}\n```"
  - '[PAGE 33]


    The result is shown below:


    ![](img/736c504465a39c9f3caa50d5252a3998_33_0.png)'
  - '[PAGE 34]


    The **clear** property will clear only floated elements, so applying **clear:
    both** to both columns would not cause the footer to drop down, because the footer
    is not a floated element.


    So use **clear** on non-floated elements, and even occasionally on floated elements,
    to force page elements to occupy their intended space.


    # # Fixing the Collapsed Parent


    One of the most common symptoms of float-heavy layouts is the “collapsing parent”.
    This is demonstrated in the example below:


    ![](img/736c504465a39c9f3caa50d5252a3998_34_0.png)'
  - '[PAGE 35]


    Notice that the bottom of the floated image appears outside its parent. The parent
    does not fully expand to hold the floated image. This is caused by what we discussed
    earlier: the floated element is out of the flow in relation to other block elements,
    will render as if the floated element is not even there. This is not a CSS bug;
    it''s in line with CSS specifications. All browsers render the same in this example.
    It in this example, adding a width to the container prevents the issue from occurring
    in IE, so this would normally be something you would have to resolve in Firefox,
    Opera, Safari, or Chrome.


    # SOLUTION 1: FLOAT THE CONTAINER


    The easiest way to fix this problem is to float the containing parent element:


    ![](img/736c504465a39c9f3caa50d5252a3998_35_0.png)'
  - "[PAGE 36]\n\nNow the container expands to fit all the child elements. But unfortunately\
    \ this fix will only work in a limited number of circumstances, since floating\
    \ the parent may have undesirable effects on your layout.\n\n# SOLUTION 2: ADDING\
    \ EXTRA MARKUP\n\nThis is an outdated method, but it is an easy option. Simply\
    \ add an extra element at the bottom of the container and “clear” it. Here’s how\
    \ the HTML would look after this method is implemented:\n\n```\n<div id=\"container\"\
    >\n<img src=\"http://media.smashingmagazine.com/wp-content/uploads/2009/10/lifesaver.jpg\"\
    \ width=\"200\" height=\"222\" alt=\"\" />\n<p>Pellentesque habitant morbi tristique\
    \ senectus et netus malesuada fames ac turpis egestas. Vestibulum tortor quam,\
    \ feugiat vitae, ultricies eget, tempor sit amet, ante. Donec eu libero sit amet\
    \ quam egestas semper.</p>\n<div class=\"clearfix\"></div>\n</div>\n```\n\nAnd\
    \ the resulting CSS applied to the new element:\n\n```\n.clearfix {\n  clear:\
    \ both;\n}\n```"
  - "[PAGE 37]\n\nYou could also do this by means of a <br /> tag with an inline style.\
    \ In any case, you will have the desired result: the parent container will expand\
    \ to enclose all of its children. But this method is not recommended since it\
    \ adds nonsemantic code to your markup.\n\n# SOLUTION 3: THE :AFTER PSEUDO-ELEMENT\n\
    \nThe :after pseudo-element adds an element to the rendered HTML page. This method\
    \ has been used quite extensively to resolve float-clearing issues. Here is how\
    \ the CSS looks:\n\n```\n.clearfix:after {\n  content: \".\";\n  display: block;\n\
    \  height: 0;\n  clear: both;\n  visibility: hidden;\n}\n```\n\nThe CSS class\
    \ \"clearfix\" is applied to any container that has floating children and does\
    \ not expand to enclose them.\n\nBut this method does not work in Internet Explorer\
    \ up to version 7, so an IE-only style needs to be set with one of the following\
    \ rules:\n\n```\n.clearfix {\n  display: inline-block;\n}\n.clearfix {\n  zoom:\
    \ 1;\n}\n```"
  - "[PAGE 38]\n\nDepending on the type of issue you're dealing with, one of the above\
    \ two solutions will resolve the issue in Internet Explorer. It should be noted\
    \ that the zoom property is a non-standard Microsoft proprietary property, and\
    \ will cause your CSS to become invalid.\n\nSo, because the: :after pseudo-element\
    \ solution does not work in IE6/7, a little bit bloated code-wise, and requires\
    \ additional invalid IE-only styles, this solution is not the best method, but\
    \ is probably the best we've considered so far.\n\n# SOLUTION 4: THE OVERFLOW\
    \ PROPERTY\n\nBy far the best, and easiest solution to resolve the collapsing\
    \ parent issue is to add overflow: hidden or overflow: auto to the parent element.\
    \ It's clean, easy to maintain, works in almost all browsers, and does not add\
    \ extra markup.\n\nYou'll notice I said “almost” all browsers. This is because\
    \ it does not work in IE6. But, in many cases, the parent container will have\
    \ a set width, which fixes the issue in IE6. If the parent container does not\
    \ have a width, you can add an IE6-only style with the following code:\n\n```\n\
    // This fix is for IE6\n.clearfix {\n  height: 1%;\n  overflow: visible;\n}\n\
    ```"
  - '[PAGE 39]


    In IE6, the **height** property is incorrectly treated as **min-height**, so this
    forces the container to enclose its children. The **overflow** property is then
    set back to "visible", to ensure the content is not hidden or scrolled.


    The only drawback to using the **overflow** method (in any browser) is the possibility
    that the containing element will have scrollbars or hide content. If there are
    any elements with negative margins or absolute positioning inside the parent,
    they will be obscured if they go beyond the parent’s borders, so this method should
    be used carefully. It should also be noted that if the containing element has
    to have a specified **height**, or **min-height**, you would definitely not be
    able to use the **overflow-height** method.


    So, really is no simple, cross-browser solution to the collapsing parent issue.
    But almost any float clearing issue can be resolved with one of the above methods.


    # Float-Related Bugs in Internet Explorer


    Over the years, there have been numerous articles published online that discuss
    common bugs in connection with floats in CSS layouts. All of these, not surprisingly,
    deal with problems specific to Internet Explorer.'
  - '[PAGE 40]


    # Changing the Float Property with JavaScript


    To change a CSS value in JavaScript, you would access the style object, converting
    the intended CSS property to “camel case”. For example, the CSS property “margin-left”
    becomes marginLeft; the property background-color becomes backgroundColor, and
    so on. With the float property, it''s different, because float is already a reserved
    word in JavaScript. So, the following would be incorrect:


    ```

    myDiv.style.float = "left";

    ```


    Instead, you would use one of the following:


    ```

    // For Internet Explorer

    myDiv.style.styleFloat = "left"

    // For all other browsers

    myDiv.style.cssFloat = "left";

    ```'
