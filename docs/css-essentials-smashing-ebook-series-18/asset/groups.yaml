    # NEW PROPERTY: BACKGROUND SIZE


    The **background-size** property is used to resize your background image. There
    are a number of possible values:


    +   - **background-size: contain;**

    scales down image to fit element (maintaining pixel aspect ratio).

    - **background-size: cover;**

    expands image to fill element (maintaining pixel aspect ratio).

    - **background-size: 100px 100px;**

    scales image to the sizes indicated.

    - **background-size: 50% 100%;**

    scales image to the sizes indicated. Percentages are relative to the size of containing
    element.


    You can read up on some examples of special cases on the CSS 3 specifications
    website.'
- md: "\n## NEW PROPERTY: BACKGROUND BREAK\n\nIn CSS 3, elements can be split into\
    \ separate boxes (e.g. to make an inline element span across several lines). The\
    \ background-atach-break property controls how the background is shown across\
    \ the different boxes.\n\nThe possible values are:\n\n- Background-break: continuous;\
    \ the default value. Treats the boxes as if no space is between them (i.e. as\
    \ they are all in one box, with the background image applied to that).\n- Background-break:\
    \ bounding-box; takes the space between boxes into account.\n- Background-break:\
    \ each-box; treats each box in the element separately and re-draws the background\
    \ individually for each one.\n\n## CHANGES TO BACKGROUND COLOR\n\nThe background-color\
    \ property has a slight enhancement in CSS 3. In addition to specifying the background\
    \ color, you can specify a “fall-back color” that is used if the bottom-layer\
    \ background image of the element cannot be used.\n\nThis is done by adding a\
    \ forward slash before the fall-back color, like so:\n\n```\nbackground-color:\
    \ green / blue;\n```\n\nIn this example, the background color would be green.\
    \ However, if the bottom-most background image cannot be used, then blue would\
    \ be shown instead of green. If you do not specify a color before the slash, then\
    \ it is assumed to be transparent.\n\n## CHANGES TO BACKGROUND REPEAT\n\nWhen\
    \ an image is repeated in CSS 2, it is often cut off at the end of the element.\
    \ CSS 3 introduces two new properties to fix this:\n\n- **space**: an equal amount\
    \ of space is applied between the image tiles until they fill the element.\n-\
    \ **round**: the image is scaled down until the tiles fit the element.\n\nAn example\
    \ of **background-repeat: space;** is available on the CSS 3 specifications website.\n\
    \n## CHANGES TO BACKGROUND ATTACHMENT\n\nThe **background-attachment** has a new\
    \ possible value: **local**. This comes into play with elements that can scroll\
    \ (i.e. are set to **overflow:scroll;**). When **background-attachment** is set\
    \ to **scroll**, the background image will not scroll when the element’s content\
    \ is scrolled.\n\nWith **background-attachment:local** now, the background scrolls\
    \ when the element’s content is scrolled.\n\n## Conclusion\n\nTo sum up, there\
    \ is a lot to know about backgrounds in CSS. But once you wrap your head around\
    \ it, the techniques and naming conventions all make good sense and it quickly\
    \ becomes second nature.\n\nIf you're new to CSS, just keep practicing and you'll\
    \ get the hang of backgrounds fast enough. If you're a seasoned pro, I hope you're\
    \ looking forward to CSS 3 as much as I am!\n\n## The Mystery Of The CSS Float\
    \ Property\n\nLouis Lazaris\n\nYears ago, when developers first started to make\
