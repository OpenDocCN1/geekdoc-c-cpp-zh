  - '[PAGE 213]


    Rather than try to stack the images in such a way that makes the resulting sprite
    as small as possible, let''s try a different layout. Instead of a random grid,
    we''re going to build a new square grid, reserving the space of each square for
    one image (although larger images might cover multiple squares). The goal is to
    be able to target the starting point of every image (top-left corner) with a very
    simple mathematical function.


    The size of the grid squares will depend on the average dimension of the images
    that you''ll be spriting. For my website, I used a 32×32 pixel grid (because only
    one image exceeds this dimension), but grid sizes will vary according to the situation.
    Another thing to take into account is the image bleeding that can occur when zooming
    a page; if you want to play it safe, add a little padding to each image within
    the sprite. For extra optimization, you could also use a rectangular grid instead
    of a square grid, further reducing any wasted space; while a tad more complex,
    this isn''t different from what we''ll be doing. For this article, though, we''ll
    stick with the square grid.


    # Preparing The Sprite: A Photoshop Bonus


    I''m no designer, so I''m not sure how applicable this section is beyond the realm
    of Photoshop, but there are some noteworthy improvements that can be made before
    we get to the actual code. First of all, visualizing the grid can be of great
    help. Photoshop has guides to do this (so you don''t actually have to include
    the markers in your sprite), with the added bonus layers that will snap to these
    guides (making pixel-perfect positioning of each individual image much easier).


    Manually adding these guides can be somewhat of a drag, though. Luckily, a colleague
    of mine (hats off to Filip Van Tendeloo) was kind enough to write and share a
    little Photoshop script that builds this grid of guides'
  - '[PAGE 214]


    automatically based on the base size of your square. Pretty convenient, no?

    Just download the script, save it in the Presets\Scripts directory, and choose
    File -> Scripts -> Sprite Grid from the Photoshop menu.


    Finally, to really finish things off, you can add numbers to the x and y axes
    of your grid so that you can easily pinpoint every square in the grid. Don''t
    add these numbers to the actual sprite, though; just copy the sprite into a new
    image and add them there. These numbers are just for reference—but trust me, they
    will definitely come in handy in a minute.


    ![](img/736c504465a39c9f3caa50d5252a3998_214_0.png)


    Example of a reference image.


    If you can''t (or don''t want to) use preprocessing languages such as LESS and
    Sass, just add the coordinates of each square instead.'
  - "[PAGE 215]\n\n# LESS And Sass To The Rescue\n\nWith all of the images on the\
    \ same square grid, we can now easily compute the top-left coordinate of each\
    \ image (this coordinate is the exact match needed for the background-position\
    \ values to reposition the sprite). Just take the base size of the grid and multiply\
    \ it by the numbers that you just added to your reference image. Say you need\
    \ to target the image at a position of (5,3), and your grid size is 32 pixels;\
    \ the top-left position of your image will be 32 × (5,3) = (160,96). To add these\
    \ values to your CSS file, just use their negative equivalents, like so:\n\n```\n\
    background-position: -160px -96px;\n```\n\nLeave your calculator when it is for\
    \ the time, because it would be too much of a hassle. If computers are good at\
    \ anything, it's doing calculations, so we're going to make good of that power.\
    \ Plain CSS doesn't allow us to do calculations (yet), but languages like LESS\
    \ and Sass were made to do just that. If you need more background information,\
    \ check out the “An Introduction to LESS and Comparison to Sass.\\ While both\
    \ languages offer similar functionality, their syntaxes are slightly different.\
    \ I'm LESS man myself, but if you're used to Sass, converting the following examples\
    \ to Sass code won't be too hard. Now for some advanced CSS magic:\n\n```\n@spriteGrid:\
    \ 32px;\n.sprite(@x, @y) {\n  background: url(img/sprite.png) no-repeat;\n  background-position:\
    \ (@x*@spriteGrid) (@y*@spriteGrid);\n}\n```\n\nNothing too exciting so first.\
    \ We've defined the grid size using a LESS variable (@spriteGrid). Then, we made\
    \ a mixin that accepts the numbers we added to the reference image earlier. This\
    \ mixin uses the grid variable and the image's coordinates to calculate the base\
    \ position of the image"
  - "[PAGE 216]\n\nwe want to target. him not look fancy, but it makes the basic use\
    \ of sprites a lot easier already. From now on, you can just use .sprite(1,5),\
    \ and that's all there is to it. No more annoying calculations or finding random\
    \ start coordinates.\n\nOf course, the mixin above works in our somewhat simplified\
    \ example (using a square grid and just one sprite). Some websites out there are\
    \ more complex and require different sprites using rectangular grids for additional\
    \ optimization. This isn't exactly impossible to fix with LESS, though:\n\n```\n\
    .spriteHelper(@image, @x, @y, @spriteX, @spriteY) {\n  background: url(\"/{@image}.png\"\
    ) no-repeat;\n  background-position: - (@x*spriteX) - (@y*spriteY);\n}\n.sprite(@image,\
    \ @x, @y) when (@image = sprite1), (@image = sprite3) {\n  @spriteX: 32px;\n \
    \ @spriteY: 16px;\n  .spriteHelper(@image, @x, @y, @spriteX, @spriteY);\n}\n.sprite(@image,\
    \ @x, @y) when (@image = sprite2) {\n  @spriteX: 64px;\n  @spriteY: 32px;\n  .spriteHelper(@image,\
    \ @x, @y, @spriteX, @spriteY);\n}\n```\n\nYes, this looks a bit daunting, but\
    \ it's still pretty basic if you take a minute to understand what's going on.\
    \ Most importantly, the added complexity is safely hidden away inside the LESS\
    \ mix, and we're still able to use the same sprite mixin as before, now only with\
    \ three parameters in total. We've just added an image parameter so that we can\
    \ easily determine which sprite to use each time we call our mixin.\n\nDifferent\
    \ sprites might have different grid dimensions, though; so, for each grid dimension,\
    \ we need to write a separate LESS mixin. We match each"
  - '[PAGE 217]


    sprite to its specific dimension (the example above handles three different sprites
    and matches it to two different grid dimensions), and we define the dimensions
    (@spriteX) and @spriteY) locally in each mixin. Once that is done, we offload
    the rest of the work to a little .spriteHelper mixin that does all of the necessary
    calculations and gives us the same result as before.


    The “guards” (as LESS calls them—characterized by the keyword “when”) are quite
    new to the LESS vocabulary, so make sure you''re using the latest version of the
    LESS engine if you attempt to run this yourself. It does offer a great way to
    keep the sprite mixin as clear and concise as possible, though. Just pass the
    sprite you want to use to the sprite mixin, and LESS will figure out the rest
    for you.


    # Common CSS Sprite Use Cases


    With these mixins at our disposal, let''s see what different CSS sprite use cases
    we can identify and find out whether these use cases in additional LESS mixins
    is possible. Once again, in order to minimize complexity in the upcoming sections,
    we''ll assume you''re working with a square grid sprite. If you need a rectangular
    grid, just add the image’s parameter to the LESS mixins we''ll be working with,
    and everything will be fine.


    For each use case, we''ll define two mixins: one with and without height and width
    parameters. If you''re like me and you keep misspelling the height and width keywords,
    the second mixin might come in handy. It leave you the responsibility of learning
    the correct order of the parameters, though LESS allows you to define these mixins
    in the same document, however, so there’s really no harm in listing them both,
    picking whichever is easiest for you.'
  - "[PAGE 218]\n\n# 1. REPLACED TEXT\n\nThis is probably the easiest use case, occurring\
    \ when we have an html element at our disposal that can be given a fixed dimension\
    \ (in order to ensure we can hide the unwanted parts of the sprite). We'll be\
    \ hiding the text inside the html element, replacing it with an image from our\
    \ sprite. Typical examples of this use case are action links (think delete icons,\
    \ print links, RSS icons, and headings (although CSS3 and Web fonts are quickly\
    \ making this technique obsolete).\n\n```\n.hideText {\n  text-indent: -999em;\n\
    \  letter-spacing: -999em;\n  overflow: hidden;\n}\n.spriteReplace(@x, @y) {\n\
    \  sprite(@x, @y);\n  .hideText;\n}\n.spriteReplace(@x, @y, @width, @height) {\n\
    \  sprite(@x, @y);\n  .hideText;\n  width: @width;\n  height: @height;\n}\n```\n\
    \nThe spriteReplace mixin simply wraps our former sprite mixin and adds a smaller\
    \ helper mixin to hide the text from view. It's pretty basic, but it does save\
    \ us the trouble of adding the .hide mixin manually for every instance of this\
    \ use case.\n\n![](img/736c504465a39c9f3caa50d5252a3998_218_0.png)\n\nUsing sprites\
    \ for replaced elements."
- md: "\nIn the example above, we have a list of sharing options. For whatever reason\
    \ (theming or just personal preference), let's say we decide to use CSS backgrounds\
    \ instead of HTML images. Nothing to it with the mixins we just created. Here's\
    \ the code (assuming we're using the reference image shown earlier):\n\n```less\n\
    <ul class=\"sharing\">\n  <li class=\"twitter\"><a href=\"#\">Share [article's\
    \ title] on Twitter</a></li>\n  ...\n</ul>\n.sharing .twitter a {\n  .spriteReplace(0,\
    \ 0, 32px, 32px); display:block;\n}\n```\n\n## ## INLINE IMAGES \n\nFor the second\
    \ case, we'll tackle inline images. The main problem we're facing here is that\
    \ we won't be able to put fixed dimensions on the html element itself because\
    \ we're dealing with variable-sized content. Typical uses of inline images for\
    \ icons next to text links (for example, external links, download links, etc.),\
    \ but this method can also be used for any other item that text to be wrapped\
    \ around a sprite image.\n\n```less\n.spriteInline(@x, @y) {\n  .sprite(@x, @y);\n\
    \  display: inline-block;\n  content: \"\"\n}\n.spriteInline(@x, @y, @width, @height)\
    \ {\n  .sprite(@x, @y);\n  display: inline-block;\n  content: \"\"\n  width: @width;\n\
    \  height: @height;\n}\n```\n\nWe might be lacking a structural element to visualize\
    \ our image, but 2011 taught us that pseudo-elements are the perfect hack to overcome\
    \ this problem (Nicolas Gallagher’s eye-opening article on using pseudo-elements\
    \ for background images explain everything in detail). This is why the spriteInline\
    \ mixin was especially developed to be used within a: :before or :after selector\
    \ (depending on where the image needs to appear). We will add an inline-block\
    \ declaration to the pseudo-element so that it behaves like an inline element\
    \ while still allowing us to add fixed dimensions to it, and we'll add the content\
    \ property, which is needed just for visualizing the pseudo-element.\n\n- Buy\
    \ on amazon.com\n- Buy on play.com\n- Buy on yesasia.com\n- Buy on cdjapan.co.jp\n\
    \nUsing sprites for inline images.\n\nThe example above shows a list of affiliate\
    \ links. The design demands that each link be limited to one line, so we can safely\
    \ use the .spriteInline mixin to display the icons in front of each link:\n\n\
    ```less\n<ul class=\"affiliates\">\n  <li class=\"amazon\"><a href=\"#\">Buy on\
    \ Amazon.com</a>a></li>\n</ul>\n.affiliates .amazon a:before {\n  .spriteInline(4,\
    \ 1, 22px, 16px);\n}\n```\n\n## 3. PADDED IMAGES \n\nThe third and final use case\
    \ comes up when text isn't allowed to wrap around a sprite image. Typical examples\
    \ are list items that span multiple lines, and all kinds of visual notifications\
    \ that bare cores. Whenever you want to reserve space on a multi-line element\
    \ to make sure the lines up neatly next to the image, this is the method you'll\
    \ want to use.\n\n```less\n.spritePadded(@x, @y) {\n  .sprite(@x, @y);\n  position:\
    \ absolute;\n  content: \"\";\n}\n.spritePadded(@x, @y, @width, @height) {\n \
    \ .sprite(@x, @y);\n  position: absolute;\n  content: \"\";\n  width: @width;\n\
    \  height: @height;\n}\n```\n\nAgain we'll try our luck with pseudo-elements;\
    \ this time, though, we'll be performing some positioning tricks. By applying\
    \ a position: absolute to the pseudo-element, we can place it inside the space\
    \ reserved by its parent element (usually by applying padding to the parent—hence\
    \ the name of the mixin). The actual position of the image (the left, right, top\
    \ and bottom properties) is not added to the spritePadded mixin and should be\
    \ done in the selector to keep things clean and simple as possible (in this case,\
    \ by maintaining a low parameter count).\n\nBecause we're using absolute positioning,\
    \ either the :before or :after pseudo-element will do the job. Keep in mind, that\
    \ the :after element is a likely candidate for CSS clearing methods, so if you\
    \ want to avoid future conflicts (because the clearing fix won't work if you add\
    \ a position: absolute to the :after pseudo-element), you'd be safest applying\
    \ the sprite style to the :before element.\n\n> Translation available in the following\
    \ language(s): 日本語\n\nUsing sprites for padded elements.\n\nLet's assume we need\
    \ to indicate that our article is available in other languages (probably on a\
    \ different page or website). We'll add a little notification box, listing the\
    \ different translations of the current article. If the text breaks onto a second\
    \ line, though, we do not want to crawl below our little icon, so we'll use the\
    \ spritePadded mixin:\n\n```less\n<section class=\"notification translated\">\n\
    <p>Translation available...</p>\n</section>\n.translated p {\n  padding-left:\
    \ 22px;\n  position: relative;\n}\n.translated p:before {\n  spritePadded(5, 5,\
    \ 16px, 14px);\n  left: 0;\n  top: 0;\n}\n```\n\n## The Ideal Sprite\n\nSo, we\
    \ have achieved CSS. If you've been paying attention, you might have noticed the\
    \ experiments above have given pseudo-elements quite a bit of attention. Specifically,\
    \ Nicolas Gallagher used pseudo-elements to create GUI icons from semantic HTML.\n\
    \nTo complement this exposure (and take advantage of a growing trend), I've put\
    \ together what I hope is a comprehensive run-down of pseudo-elements. This article\
    \ is aimed primarily at those of you who have seen some of the cool things done\
    \ with pseudo-elements but want to know what this technique is all about. Although\
    \ the CSS specification contains other pseudo-elements, I'll focus on :before\
    \ and :after. So, for brevity, I'll say “pseudo-elements” to refer generally to\
    \ these two.\n"
  mdcn: "\n在上面的示例中，我们有一个分享选项列表。出于某种原因（主题主题或只是个人喜好），假设我们决定使用 CSS 背景而不是 HTML 图片。这与我们刚刚创建的混入（mixins）无关。以下是代码（假设我们使用的是之前显示的参考图像）：\n\
    \n```less\n<ul class=\"sharing\">\n  <li class=\"twitter\"><a href=\"#\">在 Twitter\
    \ 上分享 [article's title]</a></li>\n  ...\n</ul>\n.sharing .twitter a {\n  .spriteReplace(0,\
    \ 0, 32px, 32px); display:block;\n}\n```\n\n## 内联图像\n\n对于第二种情况，我们将处理内联图像（inline\
    \ images）。我们在这里面临的主要问题是，由于无法为 html 元素本身设置固定尺寸，因为我们处理的是变尺寸的内容。内联图像的典型用法是文本链接旁边的图标（例如外部链接、下载链接等），但这种方法也适用于任何其他文本环绕在精灵图周围的项目。\n\
    \n```less\n.spriteInline(@x, @y) {\n  .sprite(@x, @y);\n  display: inline-block;\n\
    \  content: \"\"\n}\n.spriteInline(@x, @y, @width, @height) {\n  .sprite(@x, @y);\n\
    \  display: inline-block;\n  content: \"\"\n  width: @width;\n  height: @height;\n\
    }\n```\n\n我们可能缺少一个结构性元素来可视化我们的图像，但 2011 年告诉我们，伪元素是克服这个问题的完美黑科技（Nicolas Gallagher\
    \ 关于使用伪元素制作背景图像的开阔眼界的文章详细解释了一切）。这就是为什么 `spriteInline` 混入被专门开发用于：:before 或 :after\
    \ 选择器中（取决于图像出现的位置）。我们将为伪元素添加一个 `inline-block` 声明，使其行为像一个内联元素，同时仍然允许我们为其添加固定尺寸，并且我们将添加\
    \ `content` 属性，这只是为了可视化伪元素所需要的。\n\n- 在 amazon.com 购买\n- 在 play.com 购买\n- 在 yesasia.com\
    \ 购买\n- 在 cdjapan.co.jp 购买\n\n使用精灵图内联图像。\n\n上面的示例显示了一个联盟链接列表。设计要求每个链接限制在一行，因此我们可以安全地使用\
    \ `.spriteInline` 混入在每个链接前面显示图标：\n\n```less\n<ul class=\"affiliates\">\n  <li\
    \ class=\"amazon\"><a href=\"#\">在 Amazon.com 购买</a>a>a></li>\n</ul>\n.affiliates\
    \ .amazon a:before {\n  .spriteInline(4, 1, 22px, 16px);\n}\n```\n\n## 3. 带内边距的图像\n\
    \n第三种也是最后一种用例出现在不允许文本环绕精灵图的情况中。典型示例是跨越多行的列表项，以及各种带有核心视觉通知。当你想在多行元素上留出空间以确保行与图像整齐对齐时，这就是你想使用的方法。\n\
    \n```less\n.spritePadded(@x, @y) {\n  .sprite(@x, @y);\n  position: absolute;\n\
    \  content: \"\";\n}\n.spritePadded(@x, @y, @width, @height) {\n  .sprite(@x,\
    \ @y);\n  position: absolute;\n  content: \"\";\n  width: @width;\n  height: @height;\n\
    }\n```\n\n我们再次尝试在伪元素上碰运气；但这次，我们将执行一些定位技巧。通过对伪元素应用 `position: absolute`，我们可以将其放置在父元素留出的空间内（通常通过对父元素应用\
    \ `padding`——这就是该混入命名的由来）。图像的实际位置（左、右、上、下属性）没有添加到 `spritePadded` 混入中，而应该在选择器中完成，以保持尽可能简单清晰（在这种情况下，通过保持低参数数量）。\n\
    \n由于我们使用了绝对定位，:before 或 :after 伪元素都可以完成工作。请记住，:after 元素可能是 CSS 清除浮法的候选对象，因此如果你想避免未来的冲突（因为如果你向\
    \ :after 伪元素添加了 `position: absolute`，清除修复将不起），那么将精灵样式应用到 :before 元素是最安全的。\n\n\
    > 可在以下语言提供翻译：日本語\n\n使用精灵图处理带内边距的元素。\n\n假设我们需要指示文章有其他语言版本（可能在不同的页面或网站上）。我们将添加一个小小的通知框，列出当前文章的不同翻译。然而，如果文本折行到第二行，我们不希望它爬到我们小图标下方，因此我们将使用\
    \ `spritePadded` 混入：\n\n```less\n<section class=\"notification translated\">\n\
    <p>翻译可用...</p>\n</section>\n.translated p {\n  padding-left: 22px;\n  position:\
    \ relative;\n}\n.translated p:before {\n  spritePadded(5, 5, 16px, 14px);\n  left:\
    \ 0;\n  top: 0;\n}\n```\n\n## 理想的精灵图\n\n所以，我们实现了 CSS。如果你一直在关注，可能会注意到上面的实验给予了伪元素大量的关注。具体来说，Nicolas\
    \ Gallagher 使用伪元素从语义化 HTML 创建了 GUI 图标。\n\n为了补充这些接触（并利用日益增长的趋势），我整理了一份希望是全面的伪元素综述。\n"
