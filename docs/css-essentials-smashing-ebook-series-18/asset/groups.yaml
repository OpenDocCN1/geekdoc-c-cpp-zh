    \ 只是告诉元素跟随父元素的 **background-attachment** 属性。\n\n要正确理解 **background-attachment**，我们首先需要页面和视口（viewport）是如何交互的。视口是浏览器显示网页的部分（把它想象成不带所有工具栏的浏览器）。视口的位置是固定的，永远移动。\n\
