- md: "\n# !important CSS Declarations: How And When To Use Them\n\nLouis Lazaridis\n\
    \nWhen the CSS1 specification was drafted in the mid to late 90s, it introduced\
    \ !important declarations that would help developers and users easily override\
    \ normal specificity when making changes to their stylesheets. For the most part,\
    \ !important declarations have remained the same, with only one change in CSS2.1\
    \ and nothing new added or altered in the CSS3 spec in connection with this unique\
    \ declaration.\n\n```css\n.smashtabs.smashui .ui-tabs-nav default.include.3610348578.css:1\
    \ li, #smashtabs.smashui .ui-tabs-nav li a, #smashtabs.smashui .ui-tabs-nav li\
    \ strong, #smashtabs.smashui .ui-tabs-nav li span {\nbackground-image: none;\n\
    height: auto;\nwidth: auto;\n}\nsmashui .ui-tabs-nav li.ui-tabs-nav default.include.3610348578.css:1\
    \ selected a strong {\n  background-position: -1550px -415px !important;\n  outline:\
    \ none;\n}\nsmashui .ui-tabs-nav li a strong default.include.3610348578.css:1\
    \ {\n```\n\nLet's take a look at what exactly these kinds of declarations are\
    \ all about, and when, if ever, you should use them.\n\n# A Brief Primer on the\
    \ Cascade\n\nBefore we get into it **important** declarations and exactly how\
    \ they work, let's give this discussion a bit of context. In the past, Smashing\
    \ Magazine covered CSS specificity in-depth, so please take a look at that article\
    \ if you want a detailed discussion on the CSS cascade and how specificity ties\
    \ in.\n\nBelow is a basic outline of any given CSS-styled document will decide\
    \ how much weight to give to different styles it encounters. This is a general\
    \ summary of the cascade as discussed in the spec:\n\n- Find all declarations\
    \ that apply to the element and property\n- Apply the styling to the element based\
    \ on importance and origin using the following order, with the first item in the\
    \ list having the least weight:\n  - Declarations from the user agent\n  - Declarations\
    \ from the user\n  - Declarations from the author\n  - Declarations from the author\
    \ with **important** added\n  - Declarations from the user with **important**\
    \ added\n- Apply styling based on specificity, with the more specific selector\
    \ \"winning\" over more general ones\n- Apply styling based on the order in which\
    \ they appear in the stylesheets (i.e., in the event of a tie, last one “wins\"\
    )\n\nWith that basic outline, you can probably already see how !important declarations\
    \ weigh, and what role they play in the cascade. Let's look at !important in more\
    \ detail.\n\n# Syntax and Description\n\nAn !important declaration provides a\
    \ way for a stylesheet author to give a CSS value weight than it naturally has.\
    \ It should be noted here that the phrase !important declaration\" is a reference\
    \ to an entire CSS declaration, including property and value, with !important\
    \ added (thanks to Brad Czerniak for pointing out this discrepancy). Here is a\
    \ simple code example that clearly illustrates how !important affects the natural\
    \ way that styles are applied:\n\n```css\n#example {\n  font-size: 14px !important;\n\
    }\n#container #example {\n  font-size: 10px;\n}\n```\n\nIn the above code sample,\
    \ the element with the id of \"example\" will have text sized at 14px, due to\
    \ the addition of !important.\n\nWithout the use of !important, there are two\
    \ reasons why the second declaration block should naturally have more weight than\
    \ the first: The second block is later in the stylesheet (i.e. it listed second).\
    \ Also, the second block has more specificity followed by #container by #example\
    \ instead of just #example). But with the inclusion of !important, the first font-size\
    \ rule now has more weight.\n\nSome things to note about !important declarations:\n\
    \nWhen !important was first introduced in CSS1, an author rule with an !important\
    \ declaration held more weight than a user rule with an !important declaration;\
    \ to improve accessibility, this was reversed in CSS2\n\n- If !important is used\
    \ on a shorthand property, this adds \"importance\" to all the sub-properties\
    \ that the shorthand property represents\n- The !important keyword (or statement)\
    \ must be placed at the end of the line, immediately before the semicolon, otherwise\
    \ it will have no effect (although a space before the semicolon wont break it)\n\
    - If for some particular reason you have to write the same property twice in the\
    \ same declaration block, add !important to the end of the first one, the first\
    \ will have more weight in every browser except IE6 (this works as an IE6-only\
    \ hack, but doesn't invalidate your CSS)\n- In IE6 and IE7, if you use a different\
    \ word in place of !important (like !hotdog), the CSS rule will still be given\
    \ extra weight, while other browsers will ignore it\n\n# When Should !important\
    \ Be Used?\n\nAs with any technique, there are pros and cons depending on the\
    \ circumstances. So when should it be used, if ever? Here's my subjective overview\
    \ of potential valid uses.\n\n# NEVER\n\n!important declarations should not be\
    \ used unless they are absolutely necessary after all other avenues have exhausted.\
    \ If you use !important out of laziness, to avoid proper debugging, or to rush\
    \ a project to completion, then you're abusing it, and you (or those that inherit\
    \ your projects) will suffer the consequences.\n\nIf you include it even sparsely\
    \ in your stylesheets, you will soon find that parts of your stylesheet will be\
    \ harder to maintain. As discussed above, CSS property importance happens naturally\
    \ through the cascade and specificity. When you use **!important**, you're disrupting\
    \ the natural flow of your rules, giving more weight to rules that are undeserving\
    \ of such weight.\n\nIf you never use **!important**, that's a sign that you understand\
    \ CSS and give proper forethought to your code before writing it.\n\nThat being\
    \ said, the old adage \"never say never\" would certainly apply here. So below\
    \ are some legitimate uses for **!important**.\n\n# TO AID OR TEST ACCESSIBILITY\n\
    \nAs mentioned, user stylesheets can include **!important** declarations, allowing\
    \ users with special ability to give weight to specific CSS rules that will aid\
    \ their ability to read and access content.\n\nA special needs user can add **!important**\
    \ to typographic properties **font-size** to make text larger, or to color-related\
    \ rules in order to increase the contrast of web pages.\n\nIn the screen grab\
    \ below, Smashing Magazine’s home page is shown with a user-defined stylesheet\
    \ overriding the normal text size, which can be done:\n\n# Common Security Mistakes\
    \ in Web Applications\n\nBy Philip Tells October 18th, 2010 Coding | 47 Comments\
    \ Publishing Policy\n\nWeb application developers today need to be skilled of\
    \ disciplines. It's necessary to build an application friendly, highly performant,\
    \ accessible and secure executing partially in an untrusted environment, developer,\
    \ have no over. I speak, of code User Agent. Most commonly seen in the form of\
    \ but in reality, one never knows what's on the HTTP connection.\n\n| HI, THIS\
    \ IS YOUR SCHOOL | OH, DEAR - DID HE BREAK SOMETHING? | DID YOU REALLY NAME YOUR\
    \ | WELL, WE'VE STUDY |\n\nIn this case, the text size was adjustable without\
    \ using **important**, because a user-defined stylesheet will override an author\
    \ stylesheet regardless of specificity. If, however, the text size for body copy\
    \ was set in the author stylesheet using an **important** declaration, the user\
    \ stylesheet could not override the text-size setting, even with a more specific\
    \ selector. The inclusion of **important** resolves this problem and keeps the\
    \ adjustability of text size within the user’s power, even if the author has abused\
    \ :important.\n\n# TO TEMPORILY FIX AN URGENT PROBLEM\n\nThere will be times when\
    \ something bugs out in your CSS on a live client site, and you need to apply\
    \ a fix very quickly. In most cases, you should be able to use Firebug or another\
    \ developer tool to track down the CSS code that needs to be fixed. If the problem\
    \ is occurring on IE6 or another browser that doesn't have access to debugging\
    \ tools, you may need to do a quick fix using **important.**\n\nAfter you move\
    \ the temporary fix to production (thus making the client happy), you can work\
    \ on fixing the issue locally using a more maintainable method that doesn't muck\
    \ up the cascade. When you've figured out a better solution, you can add it to\
    \ the project and remove **important** — and the client will be none the wiser.\n\
    \n# TO OVERRIDE STYLES WITHIN FIREBUG OR ANOTHER DEVELOPER TOOL\n\nInspecting\
    \ an element in Firebug or Chrome’s developer tools allows you to edit styles\
    \ on the fly, to test things out, debug, and so on — without affecting the real\
    \ stylesheet. Take a look at the screen grab below, showing some of Smashing Magazine’s\
    \ styles in Chrome’s developer tools:\n"
  mdcn: "\n\n# !important CSS 声明：何时以及如何使用\n\nLouis Lazaridis\n\n当 CSS1 规范在 90 年代中后期被草拟时，它引入了\
    \ !important 声明，这可以帮助开发者和用户在更改样式表时轻松覆盖常规的优先级（specificity）。在大多数情况下，!important 声明保持不变，仅在\
    \ CSS2.1 中发生过一次变化，且在 CSS3 规范中没有针对这一独特声明添加任何新内容或更改。\n\n```css\n.smashtabs.smashui\
    \ .ui-tabs-nav default.include.3610348578.css:1 li, #smashtabs.smashui .ui-tabs-nav\
    \ li a, #smashtabs.smashui .ui-tabs-nav li strong, #smashtabs.smashui .ui-tabs-nav\
    \ li span {\nbackground-image: none;\nheight: auto;\nwidth: auto;\n}\nsmashui\
    \ .ui-tabs-nav li.ui-tabs-nav default.include.3610348578.css:1 selected a strong\
    \ {\n  background-position: -1550px -415px !important;\n  outline: none;\n}\n\
    smashui .ui-tabs-nav li a strong default.include.3610348578.css:1 {\n```\n\n让我们具体看看这类声明到底是怎么回事，以及你（如果用的话）应该在什么时候使用它们。\n\
    \n# 级联（The Cascade）简要入门\n\n在深入讨论 **important** 声明及其具体工作原理之前，让我们为这个讨论提供一些背景。在过去，Smashing\
    \ Magazine 曾深入探讨过 CSS 优先级，所以如果你想对 CSS 级联以及优先级如何关联进行详细讨论，请查看该文章。\n\n下面是任何给定 CSS\
    \ 样式文档的基本大纲，它决定了如何对遇到的不同样式赋予多少权重。这是对规范中讨论的级联的通用总结：\n\n- 找到所有适用于元素和属性的声明\n- 根据重要（importance）和来源（origin），按照以下顺序对元素应用样式，列表中的第一项权重最小：\n\
    \  - 来自用户代理（user agent）的声明\n  - 来自用户的声明\n  - 来自作者（author）的声明\n  - 添加了 **important**\
    \ 的作者声明\n  - 添加了 **important** 的用户声明\n  - 根据优先级应用样式，更具体的选择器“胜过”更通用的选择器\n  - 根据它们在样式表中出现的顺序应用样式（即：后者“胜出”）\n\
    \n通过这个基本大纲，你可能已经看到 !important 声明的权重情况，以及它们在级联中扮演的角色。让我们详细查看 !important。\n\n# 语法与描述\n\
    \n!important 声明为样式表作者提供了一种使其权重超过其自然权重的方法。这里应该注意，“important 声明”指的是整个 CSS 声明（包括属性和值）都添加了\
    \ !important（感谢 Brad Czerniak 指出这一差异）。这是一个简单的代码示例，说明了 !important 如何影响样式的应用方式：\n\
    \n```css\n#example {\n  font-size: 14px !important;\n}\n#container {\n  font-size:\
    \ 10px;\n}\n```\n\n在上面的代码中，由于添加了 !important，id 为 \"example\" 的元素字体大小将为 14px。\n\
    \n如果不使用 !important，第二个声明的权重自然比第一个高，原因有两个：第二个块在样式表中出现得较晚（即：列在后面）；此外，第二个块具有更高的优先级（由\
    \ #container 而非只是 #example）。但如果包含了 !important，第一个 font-size 规则现在具有更高的权重。\n\n关于\
    \ !important 声明的一些注意事项：\n\n- 当 !important 首次在 CSS1 中引入时，带有 !important 的作者规则权重高于用户规则；为了提高可访问性，这在\
    \ CSS2 中被反转\n- 如果在简写属性上使用 !important，这将为简写代表的所有子属性添加“权重”\n- !important 关键字（或语句）必须放在行末尾，分号之前，否则将不起作用（尽管分号前的空格不会破坏它）\n\
    - 如果由于某些原因必须在同一个声明块中编写两次相同的属性，为第一个添加 !important，除 IE6 外，第一个权重更高（这是一种针对 IE6 的 hack，但不会失效你的\
    \ CSS）\n- 在 IE6 和 IE7 中，如果你使用不同的词代替 !important（例如 !hotdog），该 CSS 规则仍将获得额外权重，而其他浏览器将忽略它\n\
    \n# 应该何时使用 !important？\n\n与任何技术一样，它的优缺点取决于具体情况。那么什么时候该使用它，如果用的话？以下是我对潜在合法用途的主观概述。\n\
    \n# 绝不\n\n除非在用尽所有其他途径后，否则不应使用 !important 声明。如果你因为懒惰、避免适当调试或为了赶进度而使用 !important，那么你就是在滥用它，你以及你项目的继承者将承担后果。\n\
    \n即使在样式表中少量包含它，你很快就会发现样式表的某些变得难以维护。正如上面提到的，CSS 属性的重要性通过级联和优先级自然产生。当你使用 **!important**\
    \ 时，你正在破坏规则的自然流，赋予不配拥有权重的规则更高的权重。\n\n如果你从不使用 **!important**，说明你理解并在并在编写之前进行了合理的思考。\n\
    \n尽管如此，“永远不要”的老话在这里同样适用。以下是 !important 的一些合法用途。\n\n# 为了辅助或测试可访问性\n\n提到，用户样式表可以包含\
    \ !important 声明，允许特殊能力的用户为特定的 CSS 规则赋予权重，帮助他们阅读和访问内容。\n\n特殊需求的用户可以在字体属性 **font-size**\
    \ 上添加 **important** 使字体变大，或者在颜色相关的规则上添加以增加网页的对比度。\n\n在下面的截图中，显示了 Smashing Magazine\
    \ 的主页使用用户定义的样式表覆盖了常规字体大小，这是可以实现的：\n\n# Web 应用中常见的安全错误\n\n作者 Philip Tells 2010年10月18日\
    \ 编码 | 47条评论 发布政策\n\n如今的 Web 应用开发者需要精通许多领域。构建一个应用程序友好、高性能、可访问且安全的程序是必要的，部分在不受信的环境中执行，开发者无法控制。我指的是代码\
    \ User Agent。最常见的形式是……，但实际上，人们永远不知道 HTTP 连接上会有什么。\n\n| 嗨，这是你的学校 | 噢天哪 - 他弄坏了什么吗？\
    \ | 你真的把你的命名为…… | 噢，我们在学习 |\n\n在这种情况下，不使用 **important**，字体大小是可以调整的，因为用户定义的样式表无论优先级如何都会覆盖作者样式表。然而，如果正文的字体大小是在作者样式表中使用\
    \ **important** 声明设置的，用户样式表将无法覆盖字体大小设置，即使使用更具体的选择器也是如此。important 的引入解决了这个问题，并将字体大小的可调节性保留在用户手中，即使作者滥用了\
    \ :important。\n\n# 为了临时解决一个紧急问题\n\n有时会出现这样的情况：你在线客户网站上的 CSS 出现了 Bug，你需要非常快速应用修复。在大多数情况下，你应该能够使用\
    \ Firebug 或其他开发者工具来追踪需要修复的 CSS 代码。如果问题发生在 IE6 或无法访问调试工具的浏览器上，你可能需要使用 **important**\
    \ 进行快速修复。\n\n当你将临时修复程序部署到生产环境后（从而让客户满意），你可以在本地使用更具维护性的方法来修复问题，而不会弄乱级联。当你想出更好的解决方案时，可以将其添加到项目中并移除\
    \ **important** —— 客户将一无所知。\n\n# 在 Firebug 或另一个开发者工具中覆盖样式\n\n在 Firebug 或 Chrome\
    \ 开发者工具中检查元素允许你即时修改样式、进行测试、调试等——而不会影响真实的样式表。看看下方的截图，显示了在 Chrome 开发者工具中某些 Smashing\
    \ Magazine 的样式：\n\n"
