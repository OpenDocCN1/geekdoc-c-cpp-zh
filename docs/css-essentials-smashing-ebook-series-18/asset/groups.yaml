- md: "\nRather than try to stack the images in such a way that makes the resulting\
    \ sprite as small as possible, let's try a different layout. Instead of a random\
    \ grid, we're going to build a new square grid, reserving the space of each square\
    \ for one image (although larger images might cover multiple squares). The goal\
    \ is to be able to target the starting point of every image (top-left corner)\
    \ with a very simple mathematical function.\n\nThe size of the grid squares will\
    \ depend on the average dimension of the images that you'll be spiting. For my\
    \ website, I used a 32×32 pixel grid (because only one image exceeds this dimension),\
    \ but grid sizes will vary according to the situation. Another thing to take into\
    \ account is the image bleeding that can occur when zooming a page; if you want\
    \ to play it safe, add a little padding to each image within the sprite. For extra\
    \ optimization, you could also use a rectangular grid instead of a square grid,\
    \ further reducing any wasted space; while a tad more complex, this isn't different\
    \ from what we'll be doing. For this article, though, we'll stick with the square\
    \ grid.\n\n## Preparing The Sprite: A Photoshop Bonus\n\nI'm no designer, so I'm\
    \ not sure how applicable this section is beyond the realm of Photoshop, but there\
    \ are some noteworthy improvements that can be made before we get to the actual\
    \ code. First of all, visualizing the grid can be of great help. Photoshop has\
    \ guides to do this (so you don't actually have to include the markers in your\
    \ sprite), with the added bonus layers that will snap to these guides (making\
    \ pixel-perfect positioning of each individual image much easier).\n\nManually\
    \ adding these guides can be somewhat of a drag, though. Luckily, a colleague\
    \ of mine (hats off to Filip Van Tendeloo) was kind enough to write and share\
    \ a little Photoshop script that builds this grid of guides automatically based\
    \ on the base size of your square. Pretty convenient, no?\n\nJust download the\
    \ script, save it in the Presets\\Scripts directory, and choose File -> Scripts\
    \ -> Sprite Grid from the Photoshop menu.\n\nFinally, to really finish things\
    \ off, you can add numbers to the x and y axes of your grid so that you can easily\
    \ pinpoint every square in the grid. Don't add these numbers to the actual sprite,\
    \ though; just copy the sprite into a new image and add them there. These numbers\
    \ are just for reference—but trust me, they will definitely come in handy in a\
    \ minute.\n\n![](img/736c504465a39c9f3caa50d5252a3998_214_0.png)\n\nExample of\
    \ a reference image.\n\nIf you can't (or don't want to) use preprocessing languages\
    \ such as LESS and Sass, just add the coordinates of each square instead.\n\n\
    ## LESS And Sass To The Rescue\n\nWith all of the images on the same square grid,\
    \ we can now easily compute the top-left coordinate of each image (this coordinate\
    \ is the exact match needed for the background-position values to reposition the\
    \ sprite). Just take the base size of the grid and multiply it by the numbers\
    \ that you just added to your reference image. Say you need to target the image\
    \ at a position of (5,3), and your grid size is 32 pixels; the top-left position\
    \ of your image will be 32 × (5,3) = (160,96). To add these values to your CSS\
    \ file, just use their negative equivalents, like so:\n\n```\nbackground-position:\
    \ -160px -96px;\n```\n\nLeave your calculator when it is for the time, because\
    \ it would be too much of a hassle. If computers are good at anything, it's doing\
    \ calculations, so we're going to make good of that power. Plain CSS doesn't allow\
    \ us to do calculations (yet), but languages like LESS and Sass were made to do\
    \ just that. If you need more background information, check out the “An Introduction\
    \ to LESS and Comparison to Sass.\\ While both languages offer similar functionality,\
    \ their syntaxes are slightly different. I'm LESS man myself, but if you're used\
    \ to Sass, converting the following examples to Sass code won't be too hard. Now\
    \ for some advanced CSS magic:\n\n```\n@spriteGrid: 32px;\n.sprite(@x, @y) {\n\
    \  background: url(img/sprite.png) no-repeat;\n  background-position: (@x*@spriteGrid)\
    \ (@y*@spriteGrid);\n}\n```\n\nNothing too exciting so first. We've defined the\
    \ grid size using a LESS variable (@spriteGrid). Then, we made a mixin that accepts\
    \ the numbers we added to the reference image earlier. This mixin uses the grid\
    \ variable and the image's coordinates to calculate the base position of the image\
    \ we want to target. him not look fancy, but it makes the basic use of sprites\
    \ a lot easier already. From now on, you can just use .sprite(1,5), and that's\
    \ all there is to it. No more annoying calculations or finding random start coordinates.\n\
    \nOf course, the mixin above works in our somewhat simplified example (using a\
    \ square grid and just one sprite). Some websites out there are more complex and\
    \ require different sprites using rectangular grids for additional optimization.\
    \ This isn't exactly impossible to fix with LESS, though:\n\n```\n.spriteHelper(@image,\
    \ @x, @y, @spriteX, @spriteY) {\n  background: url(\"/{@image}.png\") no-repeat;\n\
    \  background-position: - (@x*spriteX) - (@y*spriteY);\n}\n.sprite(@image, @x,\
    \ @y) when (@spriteX, @spriteY) {\n  @spriteX: 32px;\n  @spriteY: 16px;\n}\n.sprite(@image,\
    \ @x, @y) when (@spriteX, @spriteY) {\n  @spriteX: 64px;\n  @spriteY: 32px;\n\
    }\n.sprite(@image, @x, @y) {\n  @spriteX: 32px;\n  @spriteY: 32px;\n}\n```\n\n\
    Yes, this looks a bit daunting, but it's still possible. It's not fancy, but it\
    \ makes the basic use of sprites a lot easier already. From now on, you can just\
    \ use .sprite(1,5), and that's all there is to it. No more annoying calculations\
    \ or finding random start coordinates. (Wait, re-aligning flow).\n\n## Common\
    \ CSS Use Cases\n\nWith these mixins at our disposal, let's see what different\
    \ CSS use cases we can identify. Once again, in order to minimize complexity in\
    \ the upcoming sections, we'll assume you're working with a square grid. If you\
    \ need a rectangular grid, just add the image parameter to the mixins. For each\
    \ use case, we'll define two mixins: one with and without height and parameters.\
    \ If you're like me and you keep misspelling the height and width keywords, the\
    \ second mixin might come in handy.\n\n### 1. REPLACED TEXT\n\nThis is probably\
    \ the easiest use case, occurring when we have an html element at our disposal\
    \ that can be given a fixed dimension (in order to ensure we can hide the unwanted\
    \ parts of the sprite). We'll be hiding the text inside the html element, replacing\
    \ it with an image from our sprite. Typical examples of this use case are action\
    \ links (think delete icons, print links, RSS icons, and headings (although CSS3\
    \ and Web fonts are quickly making this technique obsolete)).\n\n```\n.hideText\
    \ {\n  text-indent: -999em;\n  letter-spacing: -999em;\n  overflow: hidden;\n\
    }\n.spriteReplace(@x, @y) {\n  sprite(@x, @y);\n  .hideText;\n}\n.spriteReplace(@x,\
    \ @y, @width, @height) {\n  sprite(@x, @y);\n  .hideText;\n  width: @width;\n\
    \  height: @height;\n}\n```\n\nThe spriteReplace mixin simply wraps our former\
    \ sprite mixin and adds a smaller helper mixin to hide the text from view. It's\
    \ pretty basic, but it does save us the trouble of adding the .hide mixin manually\
    \ for every instance of this use case.\n"
  mdcn: "\n与其尝试通过堆叠图像来使生成的精灵图（sprite）尽可能小，不如尝试一种布局。我们不再使用随机网格，而是要构建一个新的正方形网格，为每个网格留出存放图像的空间（尽管较大的图像可能会覆盖多个网格）。目标是能够用一个简单的数学函数来定位每个图像的起始点（左上角）。\n\
    \n网格单元的大小取决于你将分割的图像的平均尺寸。对于我的网站，我使用了 32×32 像素网格（因为只有一张图像超过了这个尺寸），但网格大小会根据情况而异。另一个需要考虑的因素是缩放页面时可能出现的图像溢出；如果你想稳妥起，可以在精灵图中的每个图像添加一些内边距（padding）。为了进一步优化，你可以使用矩形网格代替正方形网格，以进一步减少浪费的空间；虽然稍微复杂一点，但这与我们要做的没有区别。不过，对于本文，我们将坚持正方形网格。\n\
    \n## 准备精灵图：Photoshop 额外加分\n\n我不是设计师，所以我不确定这一节在 Photoshop 之外的适用性如何，但在编写实际代码之前，有一些值得关注的改进。首先，将网格可视化将非常有帮助。Photoshop\
    \ 拥有可以实现此点的参考线（这样你实际上不需要在精灵图中包含标记），并且有额外的图层可以吸附到这些参考线上（这使得每个单独图像的像素级定位变得简单得多）。\n\
    \n不过，手动添加这些参考线可能相当麻烦。幸运的是，我的一个同事（向 Filip Van Tendeloo 致敬）非常心心地编写并分享了一个小的 Photoshop\
    \ 脚本，它可以根据你正方形的基础大小自动构建此参考线网格。这非常方便，对吧？\n\n只需下载脚本，将其保存在 `Presets\\Scripts` 目录，然后在\
    \ Photoshop 菜单中选择 `File -> Scripts -> Sprite Grid`。\n\n最后，为了彻底完成所有工作，你可以为网格的 x\
    \ 轴和 y 轴添加数字，这样你就可以轻松地定位网格中的每个单元。但不要将这些数字添加到实际精灵图中；只需将精灵图复制到新图像中并在那里添加即可。这些数字仅供参考——但相信我，它们在稍后大有用场。\n\
    \n![](img/736c504465a39c9f3caa50d5252a3998_214_0.png)\n\n参考图像示例。\n\n如果你无法（或不想）使用\
    \ LESS 和 Sass 等预处理语言，只需添加每个单元格的坐标即可。\n\n## LESS 和 Sass 来救援\n\n由于所有图像都在同一个正方形网格上，我们现在可以轻松地计算每个图像的左上角坐标（此坐标是\
    \ `background-position` 值重新定位精灵图所需的精确匹配）。只需获取网格的基础尺寸并乘以你刚刚添加到参考图像中的数字即可。假设你需要定位位于\
    \ (5,3) 位置的图像，你的网格大小为 32 像素；你的图像左上角位置将是 32 × (5,3) = (160,96)。要将这些值添加到你的 CSS 文件中，只需使用它们的负等值，如下所示：\n\
    \n```\nbackground-position: -160px -96px;\n```\n\n暂时放下你的计算器吧，因为那样太太麻烦了。如果说计算机擅长什么事情，那就是计算，所以我们将利用这种力量。纯\
    \ CSS（目前）还不允许我们进行计算，但 LESS 和 Sass 这样的语言正是为此而生的。如果你需要更多背景信息，请查看“LESS 简介与 Sass 的比较”。虽然两种语言都提供了类似的功能，但它们的语法略有不同。我本人是\
    \ LESS 党，但如果你习惯了 Sass，将以下示例转换为 Sass 代码也不会太困难。现在来看一些高级 CSS 魔法：\n\n```less\n@spriteGrid:\
    \ 32px;\n.sprite(@x, @y) {\n  background: url(img/sprite.png) no-repeat;\n  background-position:\
    \ (@x*@spriteGrid) (@y*@spriteGrid);\n}\n```\n\n起初没有什么特别的。我们使用 LESS 变量 (`@spriteGrid`)\
    \ 定义了网格大小。然后，我们创建了一个 mixin，它接收我们之前添加到参考图像中的数字。这个 mixin 使用网格变量和图像的坐标来计算我们想要定位的图像的基础位置。它看起来并不酷，但它已经让精灵图的基本使用变得简单许多。从现在起，你只需要使用\
    \ `.sprite(1,5)`，就够了。不再有恼人的计算或寻找随机的起始坐标。\n\n当然，上面的 mixin 在我们这个有些简化的示例中有效（使用正方形网格且只有一个精灵图）。现有的一些网站更复杂，需要使用矩形网格使用不同的精灵图进行额外优化。但这并不是无法用\
    \ LESS 来修复：\n\n```less\n.spriteHelper(@image, @x, @y, @spriteX, @spriteY) {\n\
    \  background: url(\"/{@image}.png\") no-repeat;\n  background-position: - (@x*spriteX)\
    \ - (@y*spriteY);\n}\n.sprite(@image, @x, @y) when (@spriteX, @spriteY) {\n  @spriteX:\
    \ 32px;\n  @spriteY: 16px;\n}\n.sprite(@image, @x, @y) when (@spriteX, @spriteY)\
    \ {\n  @spriteX: 64px;\n  @spriteY: 32px;\n}\n.sprite(@image, @x, @y) {\n  @spriteX:\
    \ 32px;\n  @spriteY: 32px;\n}\n```\n\n是的，这看起来有点吓，但仍然可行。它并不华丽，但已经让精灵图的基本使用变得简单许多。从现在起，你只需要使用\
    \ `.sprite(1,5)`，就够了。不再有恼人的计算或寻找随机的起始坐标。（等等，重新对齐）。\n\n## 常见的 CSS 用例\n\n有了这些 mixins\
    \ 可用，让我们看看可以识别出哪些 CSS 用例。再次，为了减少后续部分的复杂性，我们假设你正在使用正方形网格。如果你需要矩形网格，只需将图像参数添加到 mixins\
    \ 中。对于每个用例，我们都会定义两个 mixin：一个带高度参数，一个不带。如果你像我一样经常写错 height 和 width 关键字，第二个 mixin\
    \ 可能会大派用场。\n\n### 1. 替换文本\n\n这可能是最简单的用例，发生在我们有一个可以给定固定尺寸的 HTML 元素（以确保我们可以隐藏精灵图中不需要的部分）。我们将隐藏\
    \ HTML 元素内部的文本，用精灵图中的图像进行替换。这种用例的典型示例是操作链接（例如删除图标、打印链接、RSS 图标以及标题（尽管 CSS3 和网络字体正在让这种技术过时））。\n\
    \n```css\n.hideText {\n  text-indent: -999em;\n  letter-spacing: -999em;\n  overflow:\
    \ hidden;\n}\n.spriteReplace(@x, @y) {\n  sprite(@x, @y);\n  .hideText;\n}\n.spriteReplace(@x,\
    \ @y, @width, @height) {\n  sprite(@x, @y);\n  .hideText;\n  width: @width;\n\
    \  height: @height;\n}\n```\n\n`spriteReplace` mixin 简单地封装了我们之前的 `sprite` mixin，并添加了一个较小的辅助\
    \ mixin 来隐藏文本。这非常基础，但它确实节省了我们在每个此类用例实例中手动添加 `.hide` mixin 的麻烦。\n\n"
