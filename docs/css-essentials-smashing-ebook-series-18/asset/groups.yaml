    # 高效 CSS 开发实践


    有助于：模块化、效率


    布局网格和我们学过的许多 CSS3 技术都有一个间接好处，即能让你的 CSS 更具模块化，并帮助你更高效地编写和维护 CSS。此外，还有一些 CSS 开发实践可以应用到我们已经涵盖的任何技术中，以从源上减少你为这些技术编写
    CSS 的时间，并节省你在你在页面中复用组件的时间。


    # CSS 框架


    CSS 框架是一个样式库，作为构建块，用于创建你网站中可能需要的标准组件。虽然不同的 CSS 框架在深度和广度上差异很大，但大多数流行的、公发布的框架都包含某种形式的布局网格，以及针对文本、导航、表单、图像等的标准样式。创建一个你自己的
    CSS 框架是一个好主意，也许基于最流行的框架之一；它可以简单到只需标准化你在每个项目中倾向于使用的 ID 和类（class），并为自己创建一个启动样式表。


    良好的 CSS 框架可以为你的设计提供一个坚实的起点，减少你在开发、测试、调优和更新上花费的时间。它们还 reality减少他人（你的团队成员或继承你网站的人）修改你的
    CSS 所花费的时间，因为大家都在根据一套标准的规范工作。框架可以通过提供一组可以轻松在页面间复用的标准类，使你的设计变得更具模块化；通过将样式拆分为单独的表，以便根据需要独立地应用到页面上；或者允许你插入各种类型的内容，而无需为其发明新类。


    但是，框架也有它们自身的问题。例如，公发布的框架（与你私有的框架相比）往往文件大小较大，因为它们需要适用于任何类型的网站和任何类型的内容；如果它们被拆分成多个样式表，可能会进一步损害页面速度，因为每个
    HTTP 请求都需要时间。我们这里不详细列出完整的优缺点列表，但有很多方法可以规避许多此类问题，请查看以下文章以获取详情。


    # 面对象 CSS (OOCSS)


    Nicole Sullivan 创造了“面向对象的 CSS (OOCSS)”这一术语，用于她创建自包含 HTML 块（模块的方法，这些模块可以在页面的任何地方复用，或者应用到任何类上。OOCSS
    的一些主要原则是：


    - 主要使用类（classes）而不是 ID

    - 创建默认类，并在元素上添加多个更具体的类

    - 避免依赖性选择器和特定位置的类名

    - 移除模块样式中的尺寸，以便模块可以移动到任何地方并适配

    - 将容器与内容分离进行样式设计


    OOCS 旨在让你的 CSS 开发更高效，并让 CSS 本身更具模块化且减少冗余，从而减小文件大小并提高速度。


    - 面向对象的 CSS（原始博客文章、演示和框架，位于 stubbornella.com）

    - 面向对象的 CSS (OCSS): 深度解析 (TYPESETTING)

    - 面向对象的 CSS：是什么、如何以及为什么 (Nettuts)


    # CSS 生成


    谈到快速编写 CSS，还有什么比让某些软件为你编写它更快呢？现在，请不要认为我是在提倡不要学习 CSS 而让工具为你编写一份完整的样式表。那是一个糟糕、极其糟糕的主意。但是，市上有一些高质量的工具可以为你的
    CSS 提供领先优势，仅仅为了缩短你 CSS 开发流程前端的一些时间。大多数良好的 CSS 生成器专注于为你的设计中的某个特定区域创建样式，例如布局结构或字体样式，而不是整个样式表。


    工具太多，无法在这里逐一列出，所以当你寻找自己的工具时，请仔细检查它输出的 CSS。如果它是无效的、臃肿的或仅仅是很丑，不要使用该工具！


    # CSS 性能


    有助于：效率


    你高效创建的基于 CSS 的网站需要为用户尽可能高效地运行。我们涵盖的许多 CSS3 技术可以减小文件大小和 HTTP 请求，以提高页面速度。还有一些额外的
    CSS 技术可以用来提升性能。


    # CSS 压缩


    编写利用简写属性、分组选择器和其他高效语法的整洁 CSS 是新的要求，但它对于提高性能仍然非常重要。一些 CSS 开发者还采用了一些技巧来进一步减小 CSS
    文件的大小，例如将每个文件写在一行内以减少所有的换行符。虽然你可以手动完成一些工作，但有很多工具可以优化并压缩你的 CSS。


    # CSS 嵌入


    编写利用简写属性、分组选择器和其他高效语法的整洁 CSS 是新的要求，但它对于提高性能仍然非常重要。一些 CSS 开发者还采用了一些技巧来进一步减小 CSS
    文件的大小，例如将每个文件写在一行内以减少所有的换行符。虽然你可以手动完成一些工作，但有很多工具可以优化并压缩你的 CSS。


    # CSS 雪精灵 (SPRITES)


    CSS 雪精灵是一种技术，通过将许多（或所有）图像合并为一张大图，然后使用 background-position 移动图像，一次只显示一张。这极大地提高了页面性能，因为大大减少了向服务器的
    HTTP 请求。


    | Store | Mac | iPhone |

    |---|---|---|

    | Store | Mac | iPhone |

    | Store | Mac | iPhone |

    | Store | Mac | iPhone |

    | Store | Mac | iPhone |


    这种技术由 Dave 命名。Apple 网站使用了 CSS 雪精灵处理其各种状态。


    并不是所有人都喜欢 CSS 雪精灵。然而，对于减少 HTTP 请求的某些替代方法，请查看：


    - CSS 雪精灵是愚蠢的——让我们使用替代方案！（Firefox Demo) (kaia.com)

    - 如何减少 HTTP 请求 (Robert''s talk)


    # 字体嵌入与替换


    有助于：渐进增强、丰富的排版


    在最近之前，网页设计师受限于用户机器上安装的字体。我们现在有了许多技术可以实现美观且可读的字体。


    # @FONT-FACE 规则


    @font-face 规则是 CSS3 的一部分，它允许你链接服务器上的字体（称为“网络字体”），并在你的网站上以这种字体显示文本。你现在可以使用精美的独特字体，而不是大多数人机器上已安装的字体。幸运的是
    @font-face 有良好的浏览器支持。但遗憾的是，并非如此简单。不同浏览器支持不同的字体，不同平台和浏览器的抗锯效果也不同，字体加载前可能会出现无样式文本闪烁，你的字体许可证可能不允许
    @font-face 嵌入，等等。


    ![](img/736c504465a39cf3caa50d252a3998_140_0.png)


    # HTML5 爱 iPad


    iPad 正在以惊人的速度增加对 HTML 的关注，让我们大多数网页标准感到羡慕。


    在过去的 10 年里，我一直在观察 HTML 的发展——Jeffery Zeldman 花了多年时间让商业界理解标准。


    Sam How 的网站使用 @font-face 在标题和文本块中引入非标准字体。


    # 你不是千篇一律的。


    我们打造引人入胜、独一无二的简历，让你脱颖而出。


    Blue Sky Resumes 在标题、特色文案和主导航栏广泛使用 @font-face。


    # 其他字体嵌入和替换技术


    如果纯 CSS 的 @font-face 解决方案让你头晕脑胀，你可以使用字体嵌入服务或字体替换技术。


    - 字体嵌入服务：市上有许多第三方字体嵌入服务使用 @font-face，例如 Typekit 和 Kernest，但通过帮助你解决浏览器差异来简化实现。它们还通过提供授权用于此类用途的字体，规避了字体嵌入的法律问题，这些字体终端用户难以窃取。大多数此类服务不是免费的，但有些提供免费选项，让你访问有限的字体集。


