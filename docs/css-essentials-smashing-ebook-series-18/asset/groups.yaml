  - '[PAGE 174]


    Remember that non-CSS presentational markup is attributed with a specificity of
    0, which would apply, for example, to the font tag.


    Getting back to the **important** declaration, keep in mind that using it on a
    shorthand property is the same as declaring all of its sub-properties as **important**
    (even if that would revert them to the default values).


    If you are using import stylesheets (@import) in your CSS, you have to declare
    them before all other rules. Thus, they would be considered as coming before all
    the other rules in the CSS file.


    Finally, if two selectors turn out to have the same specificity, the last one
    will override the previous one(s).


    # 2.2 MAKING SPECITY WORK FOR YOU


    If not carefully considered, specificity can come back to haunt you and lead you
    to unwittingly transform your style sheets into a complex hierarchy of unnecessarily
    complicated rules.


    You can follow a few guidelines to avoid major issues:


    +   * When starting work on the CSS, use generic selectors, and add specificity
    as you go along;

    * Using advanced selectors doesn''t mean using unnecessarily complicated ones;

    * Rely more on specificity than on the order of selectors, so that your style
    sheets are easier to edit and maintain (especially by others).'
  - '[PAGE 175]


    A good rule of thumb can be found in Jim Jeffers’ article, “The Art and Zen of
    Writing CSS":


    Refactoring CSS selectors to be less specific is exponentially more difficult
    than simply adding specific rules as situations arise.


    # 3. Inheritance


    A succinct and clear explanation of inheritance is in the CSS3 Cascading and Inheritance
    module specifications (still in “Working draft” mode):


    > Inheritance is a way of propagating property values from parent elements to
    their children.


    Some CSS properties are inherited by the children of elements by default. For
    example, if you set the body tag of a page to a specific font, that font will
    be inherited by other elements, such as headings and paragraphs, without you having
    to specifically write as much. This is the magic of inheritance at work.


    The CSS specification determines whether each property is inherited by default
    or not. Not all properties are inherited, but you can force ones to be by using
    the inherit value.'
  - '[PAGE 176]


    # 3.1 OBJECT-ORIENTED PROGRAMMING INHERITANCE


    Though beyond the scope of this article, CSS inheritance shouldn’t be confused
    with object-oriented programming (OOP) inheritance. Here is the definition of
    OOP inheritance from Wikipedia, and it makes clear that we are not talking about
    the same thing:


    In object-oriented programming (OOP), inheritance is a way to form new classes
    [...] using classes that have already been defined. Inheritance is employed to
    help reuse existing code with little or no modification. The new classes [...]
    inherit attributes and behavior of the pre-existing classes. ...


    # 3.2 HOW INHERITANCE WORKS


    When an element inherits a value from its parent, it is inheriting its computed
    value. What does this mean? Every CSS property goes through a four-step process
    when its value is being determined. Here’s an excerpt from the W3C specification:


    > The final value of a property is the result of a four-step calculation: the
    value is determined through specification (the “specified value”), then resolved
    into a value that is used for inheritance (the “computed value”), then converted
    into an absolute value if necessary (the “used value”), and finally transformed
    according to the limitations of the local environment (the “actual value”).'
  - '[PAGE 177]


    # IN OTHER WORDS:


    +   1. Specified value

    nThe user agent determines whether the value of the property comes from a style
    sheet, is inherited or should take its initial value.


    +   2. Computed value

    The specified value is resolved to a computed value and exists even when a property
    doesn''t apply. The document doesn''t have to be laid out for the computed value
    to be determined.


    +   3. Used value

    The used value takes the computed value and resolves any dependencies that can
    only be calculated after the document has been laid out (like percentages).


    +   4. Actual value

    This the value used for the final rendering, after any approximations have been
    applied (for example, converting a decimal to an integer).


    If you look at any CSS property''s specification, you will see that it defines
    its initial (or default) value, the elements it applies to, its inheritance status
    and its computed value (among others). For example, the background-color specification
    states the following:


    > Name: background-color

    Value: <color>

    Initial: transparent

    Applies to: all elements

    Inherited: no

    Percentages: N/A'
  - '[PAGE 178]


    Media: visual

    Computed value: the computed color(s)


    Confusing? It can be. So, what do we need to understand from all this? And why
    is it relevant to inheritance?


    Let''s go back to the first sentence of this section, which should make sense
    now. **When an element inherits a value from its parent, it inherits its computed
    value.** Because the computed value exists even if it isn''t specified in the
    style sheet, a property can be inherited even then: the initial value can be used.
    So, you can make use of inheritance even if the parent doesn''t have a specified
    property.


    # 3.3 USING INHERITANCE


    The most important thing to know about inheritance is that it''s there and how
    it works. If you ignore the jargon, inheritance is actually very straightforward.


    Imagine you had to specify the **font-size** or **font-family** of every element,
    instead of simply adding it to the **body** element? That would be cumbersome,
    which is why inheritance is so helpful.


    Don''t break it by using the universal selector (*) with properties that inherit
    by default. Bobby Jack wrote an interesting post about this on his Five-Minute
    Argument blog. You don''t have to remember all of the properties that inherit,
    but you will in time.


    Rarely does a CSS-related article not bring some kind of bad news about Internet
    Explorer. This article is no exception. IE supports the inherit value only from
    version 8, except for the **direction** and **visibility** properties. Great.'
  - '[PAGE 179]


    # 4. Using Your Tools


    If you use tools Firebug or Safari''s Web Inspector, you can see how a given cascade
    works, which selectors have higher specificity and how inheritance is working
    on a particular element.


    For example, here below is Firebug in action, inspecting an element on the page.
    You can see that some properties are overridden (i.e. crossed out) by other more
    specific rules:


    | Style | Computed | Layout | DOM |

