    So, while there could be a benefit using CSS sprites beyond just button states,
    in the future, as internet connection speeds increase and newer browser versions
    make performance improvements, the benefits that come from using mega sprites
    could become almost irrelevant.


    ## What About Sprite Generators?


    Another argument in favor of mega sprites is the apparent ease with which sprites
    can be created using a number of sprite generators. A detailed discussion and
    review of such tools is well beyond the scope of this article, so I''ll avoid
    that here. But from my research of these, the help they provide is limited, and
    maintenance of the sprites will still take a considerable amount of work, which
    again should be weighed against the benefits.


    ![](img/736c504465a39c9f3caa50d5252a3998_90_0.png)


    ## Sprinting made easy


    Background images make pages look good, but also make them slower. Each is an
    extra HTTP request. There''s a fix: combine background images into one. Creating
    sprites is hard, requiring arcane knowledge and lots of trial and error, which
    removes the hassles with the click of a button.


    Some tools, like the one by Project Fondue, offer CSS output options. Steve Souders’
    tool SpriteMe is another one that offers CSS coding options. SpriteMe will convert
    an existing website’s background images into a single sprite image (what I’ve
    been referring to as a “mega” sprite) that you can download and insert into your
    page with necessary CSS code. While this tool will assist with the creation of
    sprites, it doesn’t seem to offer much help in the area of sprite maintenance.
    Souders’ tool seems to be useless for a website that is redesigned or realigned,
    and only seems to provide benefit to an existing design that has not yet used
    the mega sprite method.


    ![](img/736c504465a39c9f3caa50d5252a3998_91_0.png)


    ## CSS Sprite Generator


    Improvements to current tools could be made, and newer tools could appear in the
    future. But is it possible, due to some of the drawbacks mentioned above, that
    developers are focusing a lot of effort on a very minimal gain?


    ## Focus Should be on Multiple Performance Issues


    As mentioned, the number of HTTP requests is an important factor to consider in
    website performance. But there are other ways to lower that number, including
    combining scripts and stylesheets, and using remote locations for library files.


    There are also areas outside of HTTP requests that a developer can focus on to
    improve site performance. These might include GZipping, proper placement of external
    scripts, optimizing CSS syntax, minifying large JavaScript files, improving Ajax
    performance, avoiding JavaScript syntax that''s known to cause performance issues,
    and much more.


