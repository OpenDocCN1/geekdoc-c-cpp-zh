    # # Taming Advanced CSS Selectors


    Inayail de Leon


    CSS is one of the most powerful tools that is available to web designers (if not
    the most powerful). With it we can completely transform the look of a website
    in just a couple of minutes, and without even having to touch the markup. But
    despite the fact that we are all aware of its usefulness, CSS selectors are still
    not used to their full potential and we sometimes have the tendency to litter
    our HTML with excessive and unnecessary classes and ids, divs and spans.


    The best way to avoid these plagues spreading in your markup and keep it clean
    and semantic, is by using more CSS selectors, ones that can target specific elements
    without the need of a class or an id, and by doing that keep our code and our
    stylesheets flexible.


    # ## CSS Specificity


    Before delving into the realms of advanced CSS selectors, it''s important to understand
    how CSS specificity works, so that we know how to properly our selectors and to
    avoid spending hours debugging for a CSS issue that could be easily fixed if we
    had only paid attention to the specificity.


    When we are writing our CSS we have to keep in mind that some selectors will rank
    higher than others in the cascade, the latest selector that we wrote will not
    always override the previous ones that we wrote for the same elements.'
  - '[PAGE 236]


    So how do you calculate the specificity of a particular selector? It''s fairly
    straightforward if you take into account that specificity will be represented
    as four numbers separated by commas, like: 1, 1, 1, 1 or 0, 2, 0, 1


    +   1. The first digit (a) is always zero, unless there is a style attribute applied
    to that element within the markup element


    +   2. The second digit (b) is the sum of the number of IDs in that selector


    +   3. The third digit (c) is the sum of other attribute selectors and pseudo-classes
    in that selector. (.example) and attribute selectors (eg. li[id=red]) are included
    here.


    +   4. The fourth digit (d) counts the elements (like table, p, div, etc.) and
    pseudo-elements (like :first-line)


    +   5. The universal selector (*) has a specificity of zero


    +   6. If two selectors have the same specificity, the one that comes last on
    the stylesheet will be applied


    Let''s take a look at a few examples, to make it easier to understand:


    +   #sidebar h2 — 0, 1, 0, 1


    +   h2.title — 0, 0, 1, 1


    +   h2 + p — 0, 0, 0, 2


    +   #sidebar p:first-line — 0, 1, 0, 2


    From the following selectors, the first one is the one who will be applied to
    the element, because it has the higher specificity:


    +   #sidebar p#first { color: red; } — 0, 2, 0, 1


    +   #sidebar p:first-line { color: blue; } — 0, 1, 0, 2'
  - '[PAGE 237]


    It''s important to have at least a basic understanding of how specificity works,
    but tools like Firebug are useful to let us know which selector is being applied
    to a particular element by listing all the CSS selectors in order of their specificity
    when you are inspecting the element.


    ![](img/736c504465a39c9f3caa50d5252a3998_237_0.png)


    Firebug lets you easily see which selector is being applied to an element.


    # 1. Attribute selectors


    Attribute selectors let you target an element based on its attributes. You can
    specify the element''s attribute only, so all the elements that have that attribute
    — whatever the value — within the HTML will be targeted, or more specific and
    target elements that have particular values on their attributes — this is where
    attribute selectors show their power.


    There are 6 different types of attribute selectors:


    +   - **[att=value]**nThe attribute has to have the exact value specified.'
  - "[PAGE 238]\n\n+   * [att~=value]\nThe attribute's value needs to be a whitespace\
    \ separated list of words (for example\n\n+   * [att|=value]\nThe attribute's\
    \ value is exactly \"value\" or starts with the word \"value\" and is immediately\
    \ followed by \"-\"\n\n+   * [att^=value]\nThe attribute's value starts with the\
    \ specified value.\n\n+   * [att$=value]\nThe attribute's value ends with the\
    \ specified value.\n\n+   * [att*=value]\nThe attribute's value contains the specified\
    \ value.\n\nFor example, if you want to change the background color of all the\
    \ div elements that are posts on your blog, you can use the attribute selector\
    \ that targets every div whose class attribute starts with \"post-\":\n\n```\n\
    div[class*=\"post\"] {\n  background-color: #333;\n}\n```\n\nThis will match all\
    \ the div elements whose class attribute contains the words \"posts\", in any\
    \ position.\n\nAnother useful usage of attribute selectors is to target different\
    \ types of input elements. For example, if you want your text inputs to have a\
    \ different width from the others, you can use a simple attribute selector:"
  - "[PAGE 239]\n\n```\ninput[type=\"text\"] {\n  width: 200px;\n}\n```\n\nThis will\
    \ target all the **input** elements whose **type** attribute is exactly “text\"\
    .\n\nNow let's say you want to add a different icon next to each different type\
    \ of file your website is linking to, so your website's visitors know when they’ll\
    \ get an image, a PDF file, a Word document, etc. This can be done by using an\
    \ attribute selector:\n\n```\na[href=\".jpg\"] {\n  background: url(jpeg.gif)\
    \ no-repeat left 50%;\n  padding: 2px 0 2px 20px;\n}\n```\n\n```\na[href=\".pdf\"\
    ] {\n  background: url(pdf.gif) no-repeat left 50%;\n  padding: 2px 0 2px 20px;\n\
    }\n```\n\n```\na[href=\".doc\"] {\n  background: url(word.gif) no-repeat left\
    \ 50%;\n  padding: 2px 0 2px 20px;\n}\n```\n\nIn this example, we’ve used an attribute\
    \ selector that will target all the links **a** whose **href** attribute ends\
    \ ($) with .jpg, .pdf or .doc.\n\n# Notes on browser support\n\nApart from Internet\
    \ Explorer 6, all major browsers support attribute selectors. This means that\
    \ when you are using attribute selectors on your stylesheets, you should make\
    \ sure that IE6 users will still be provided with a usable site. Take our third\
    \ example: adding an icon to your links adds"
  - '[PAGE 240]


    Like the attribute selectors, the child selector is not supported by Internet
    Explorer 6. If the effect you are trying to achieve by using it is crucial for
    the website’s usability or overall aesthetics, you can consider using a class
    selector with it, or on a IE-only stylesheet, but that would detract from the
    purpose of using child selectors.'
  - "[PAGE 241]\n\n# 3. Sibling combinators\n\nThere are two types of sibling combinators:\
    \ adjacent sibling combinators and general sibling combinators.\n\n# ADJACENT\
    \ SIBLING COMBINATOR\n\nThe adjacent sibling combinator can be very useful, for\
    \ example, when dealing with text. Lets say you want to add a top margin to all\
    \ the h2 tags that follow a paragraph (you don't need to add a top margin if the\
    \ heading comes after an h1 tag or if it's the first element on that page):\n\n\
    ```\np + h2 {\n  margin-top: 10px;\n}\n```\n\nYou can be even more specific and\
    \ say that you only want this rule applied if the elements are within a particular\
    \ div:\n\n```\ndiv.post p + h2 {\n  margin-top: 10px;\n}\n```\n\nOr you can add\
    \ another level of complexity: say you want the first line of the paragraphs of\
    \ every page to be in small caps.\n\n```\n.post h1 + p:first-line {\n  font-variant:\
    \ small-caps;\n}\n```"
  - '[PAGE 242]


    Because you know that the first paragraph of every post immediately follows an
    h1 tag, you can refer to the h1 on your selector.


    # GENERAL SIBLING COMBINATOR


    The general sibling combinator works pretty much the same as the adjacent sibling
    combinator, but with the difference that the second selector doesn''t have to
    immediately follow the first one.


    So if you need to target all the p tags that are within a particular div and that
    follow the h1 tag (you may want those p tags to be larger than the ones that come
    before the title of your post), you can use this selector:


    ```

    .post h1 ~ p {

    font-size: 13px;

    }

    ```


    Notes on browser support

    Internet Explorer 6 doesn''t understand sibling combinators, but, as for the other
    cases, if your audience includes a small percentage of IE6 users, and if the website''s
    layout isn''t broken or severely affected by its lack of support, this is a much
    easier way of achieving lots of cool effects without the need of cluttering your
    HTML with useless classes and ids.


    # 4. Pseudo-classes


    # DYNAMIC PSEUDO-CLASSES


    These are called dynamic pseudo-classes because they actually do not exist within
    the HTML: they are only present when the user is or has interacted with the website.'
- md: "\nThere are two types of dynamic pseudo-classes: link and user action ones.\
    \ The link are :link and :visited, while the user action ones are :hover, :active\
    \ and :focus.\n\nFrom all the CSS selectors mentioned in this post, these will\
    \ probably be the ones that are most commonly used.\n\nThe :link pseudo-class\
    \ applies to links that haven't been visited by the user, while the :visited pseudo-class\
    \ applies to links that have been visited, so they are mutually exclusive.\n\n\
    The :hover pseudo-class applies when the user moves the cursor over the element,\
    \ without having to activate or click on it. The :active pseudo-class applies\
    \ when the user actually clicks on the element. And finally the :focus pseudo-class\
    \ applies when that element is on focus — the most common application is on form\
    \ elements.\n\nYou can use more than one user action dynamic pseudo-class in your\
    \ stylesheets, so you can have, for example, a different background color for\
    \ an input field depending on whether the user's cursor is only hovering over\
    \ it or hovering over it while in focus:\n\n```css\ninput:focus {\n  background:\
    \ #D2D2D2;\n  border: 1px solid #5E5E5E;\n}\n```\n\n```css\ninput:focus:hover\
    \ {\n  background: #C7C7C7;\n}\n```\n\n## Notes on browser support\n\nThe dynamic\
    \ pseudo-classes are supported by all modern browsers, even IE6. But bear in mind\
    \ that IE6 only allows the :hover pseudo-class to be applied to link elements\
    \ (a) and only IE8 accepts the :active state on elements other than links.\n\n\
    ## :FIRST-CHILD\n\nThe :first-child pseudo-class allows you to target an element\
    \ that is the first child of another element. For example, if you want to add\
    \ a top margin to the first li element of your unordered lists, you can have this:\n\
    \n```css\nul > li:first-child {\n  margin-top: 10px;\n}\n```\n\nLet's take another\
    \ example: you want all your h2 tags in your sidebar to have a top margin, to\
    \ separate them from whatever comes before them, but the first one doesn't need\
    \ a margin. You can use the following code:\n\n```css\n#sidebar > h2 {\n  margin-top:\
    \ 10px;\n}\n#sidebar > h2:first-child {\n  margin-top: 0;\n}\n```\n\n### Notes\
    \ on browser support\nIE6 doesn't support the :first-child pseudo-class. Depending\
    \ on the design that the pseudo-class is being applied to, it may not be a major\
    \ concern. For example, if you are using the :first-child selector to remove top\
    \ or bottom margins from headings or paragraphs, your layout probably not break\
    \ in IE6, it will only look slightly different. But if you are using the :first-child\
    \ selector to remove left and right margins from divs, that may cause more disruption\
    \ to your designs.\n\n## THE LANGUAGE PSEUDO-CLASS\n\nThe language pseudo-class,\
    \ :lang(), allows you to match an element based on its language.\n\nFor example,\
    \ lets say you want a specific link on your site to have a different background\
    \ color, depending on that page's language:\n\n```css\n:lang(en) > a#flag {\n\
    \  background-image: url(english.gif);\n}\n:lang(fr) > a#flag {\n  background-image:\
    \ url(french.gif);\n}\n```\n\nThe selectors will match that particular link if\
    \ the page's language is either equal to \"en\" or \"fr\" or if it starts with\
    \ \"en\" or \"fr\" and is immediately followed by an \"-\",\n\n### Notes on browser\
    \ support\n\nNot surprisingly, the only version of Internet Explorer that supports\
    \ this selector is 8. All other major browsers support the language pseudo-selector.\n\
    \n## 5. CSS 3 Pseudo-classes\n\n## :TARGET\n\nWhen you're using links with fragment\
    \ identifiers (for example, http://www.smashingmagazine.com/2009/08/02/bauhaus-ninety-years-of-inspiration/#comments,\
    \ where \"#comments\" is the fragment identifier), you can style the target by\
    \ using the :target pseudo-class.\n\nFor example, lets imagine you have a long\
    \ page with lots of text and h2 headings, and there is an index of those headings\
    \ at the top of the page. It will be much easier for the user if, when clicking\
    \ on a particular link within the index, that heading would be highlighted in\
    \ some way, when the page scrolls down. Easy:\n\n```css\nh2:target {\n  background:\
    \ #F2EBD6;\n}\n```\n\n### Notes on browser support\n\nThis time, Internet Explorer\
    \ is really annoying and has no support at all for the :target pseudo-class. Another\
    \ glitch is that Opera doesn't support this selector when using the back and forward\
    \ buttons. Other than that, it has support from the other major browsers.\n\n\
    ## THE UI ELEMENT STATES PSEUDO-CLASSES\n\nSome HTML elements have an enable or\
    \ disabled state (for example, input fields) and checked or unchecked states (radio\
    \ buttons and checkboxes). These states can be targeted by the :enabled, :disabled\
    \ or :checked pseudo-classes, respectively.\n\nSo you can say that any input that\
    \ is disabled should have a light grey background and dotted border:\n\n```css\n\
    input:disabled {\n  border:1px dotted #999;\n  background:#F2F2F2;\n}\n```\n\n\
    You can also say that all checkboxes that are checked should have a left margin\
    \ (to be easily seen within a long list of checkboxes):\n\n```css\ninput[type=\"\
    checkbox\"]:checked {\n  margin-left: 15px;\n}\n```\n\n### Notes on browser support\n\
    \nAll major browsers, except Internet Explorer, support the UI element states\
    \ pseudo-classes.\n\n## 6. Structural pseudo-classes\n\n## :nth-child\n\nThe :nth-child\
    \ pseudo-class allows you to target an element based on its position among its\
    \ siblings. You can use a number, a keyword, or even a formula. \n\n```css\nli:nth-child(2)\
    \ {\n  color: red;\n}\n```\n\nYou can also use formulas like even or odd to target\
    \ every other element. \n\n```css\nli:nth-child(odd) {\n  color: blue;\n}\n```\n\
    \n## :nth-last-child\n\nThe :nth-last-child pseudo-class works just like :nth-child,\
    \ but it counts from the end of the sibling group.\n\n```css\nli:nth-last-child(2)\
    \ {\n  color: green;\n}\n```\n\n## :nth-of-type\n\nThe :nth-of-type pseudo-class\
    \ is used to target an element based on its position among siblings of the same\
    \ type.\n\n```css\np:nth-of-type(2) {\n  color: orange;\n}\n```\n\n## :nth-last-of-type\n\
    \nThe :nth-last-of-type pseudo-class works just like :nth-last-child, but it counts\
    \ from the end among siblings of that type.\n\n```css\np:nth-last-of-type(2) {\n\
    \  color: purple;\n}\n```\n\n## :last-child\n\nThe :last-child pseudo-class is\
    \ used to target an element that is the last child of its parent.\n\n```css\n\
    p:last-child {\n  margin-bottom: 0;\n}\n```\n\n## :first-of-type\n\nThe :first-of-type\
    \ pseudo-class is used to target an element that is the first of its type within\
    \ its parent.\n"
  mdcn: "\n\n动态伪类分为两类：链接类和用户操作类。链接类包括 `:link` 和 `:visited`，而用户操作类包括 `:hover`、`:active`\
    \ 和 `:focus`。\n\n在本文提到的所有 CSS 选择器中，这些可能是最常用的几个。\n\n`:link` 伪类适用于用户未访问过的链接，而 `:visited`\
    \ 伪类适用于用户已访问过的链接，因此它们是互斥的。\n\n`:hover` 伪类在用户将光标移动到元素上时生效，而无需激活或点击它。`:active` 伪类在用户实际点击元素时生效。最后，`:focus`\
    \ 伪类在该元素处于焦点状态时生效——最常见的应用是用于表单元素。\n\n你可以在样式表中使用多个用户操作动态伪类，例如，你可以根据用户的光标仅悬停在输入框上，还是在获得焦点时悬停在上，为输入框设置不同的背景颜色：\n\
    \n```css\ninput:focus {\n  background: #D2D2D2;\n  border: 1px solid #5E5E5E;\n\
    }\n```\n\n```css\ninput:focus:hover {\n  background: #C7C7C7;\n}\n```\n\n## 浏览器支持说明\n\
    \n动态伪类被所有现代浏览器支持，甚至是 IE6。但请记住，IE6 只允许将 `:hover` 伪类应用于链接元素 (a)，并且只有 IE8 接受除链接以外元素上的\
    \ `:active` 状态。\n\n## :FIRST-CHILD\n\n`:first-child` 伪类允许你定位作为另一个元素的第一个子元素。例如，如果你想为无序列表第一个\
    \ `li` 元素添加上外边距，可以这样写：\n\n```css\nul > li:first-child {\n  margin-top: 10px;\n\
    }\n```\n\n再来看另一个例子：你希望侧边栏中所有的 `h2` 标签都有上外边距，以便将它们与之前的内容隔开，但第一个不需要边距。你可以使用以下代码：\n\
    \n```css\n#sidebar > h2 {\n  margin-top: 10px;\n}\n#sidebar > h2:first-child {\n\
    \  margin-top: 0;\n}\n```\n\n### 浏览器支持说明\nIE6 不支持 `:first-child` 伪类。取决于该伪类应用的设计，这可能不是一个主要问题。例如，如果你使用\
    \ `:first-child` 选择器来移除标题或段落的上下边边距，你的布局在 IE6 中可能不会崩溃，只是看起来略有不同。但如果你使用 `:first-child`\
    \ 选择器来移除 `div` 的左右边边距，这可能会对你的设计造成更大的影响。\n\n## 语言伪类 (THE LANGUAGE PSEUDO-CLASS)\n\
    \n语言伪类 `:lang()` 允许你根据元素的语言进行匹配。\n\n例如，假设你希望网站上的某个特定链接根据页面语言具有不同的背景颜色：\n\n```css\n\
    :lang(en) > a#flag {\n  background-image: url(english.gif);\n}\n:lang(fr) > a#flag\
    \ {\n  background-image: url(french.gif);\n}\n```\n\n如果页面语言等于 \"en\" 或 \"fr\"\
    ，或者以 \"en\" 或 \"fr\" 开头且紧跟一个 \"-\"，则这些选择器将匹配该特定链接。\n\n### 浏览器支持说明\n\n不出意外，支持此选择器的\
    \ Internet Explorer 版本只有 8。所有其他主流浏览器都支持语言伪选择器。\n\n## 5. CSS 3 伪类\n\n## :TARGET\n\
    \n当你使用带有片段标识符的链接时（例如 http://www.smashingmagazine.com/2009/08/02/bauhaus-ninety-years-of-inspiration/#comments，其中\
    \ \"#comments\" 就是片段标识符），你可以使用 `:target` 伪类来为目标元素设置样式。\n\n例如，假设你有一个包含大量文本和 `h2`\
    \ 标题的长页面，页面顶部有这些标题的索引。如果用户点击索引中的特定链接时，页面向下滚动且该标题能以某种方式高亮，对用户来说将方便得多。实现很简单：\n\n\
    ```css\nh2:target {\n  background: #F2EBD6;\n}\n```\n\n### 浏览器支持说明\n\n这一次，Internet\
    \ Explorer 真的非常烦人，它完全不支持 `:target` 伪类。另一个问题是 Opera 在使用后退和前进按钮时不支持此选择器。除此之外，其他主流浏览器都支持它。\n\
    \n## UI 元素状态伪类 (THE UI ELEMENT STATES PSEUDO-CLASSES)\n\n某些 HTML 元素具有启用或禁用状态（例如输入框）以及选中或未选中的状态（单选按钮和复选框）。这些状态分别可以通过\
    \ `:enabled`、`:disabled` 或 `:checked` 伪类进行定位。\n\n因此，你可以设置任何禁用的输入具有浅灰色背景和虚线边框：\n\
    \n```css\ninput:disabled {\n  border:1px dotted #999;\n  background:#F2F2F2;\n\
    }\n```\n\n你还可以设置所有选中的复选框具有左边距（在长复选框列表中以便识别）：\n\n```css\ninput[type=\"checkbox\"\
    ]:checked {\n  margin-left: 15px;\n}\n```\n\n### 浏览器支持说明\n\n除了 Internet Explorer\
    \ 外，所有主流浏览器都支持 UI 元素状态伪类。\n\n## 6. 结构伪类\n\n## :nth-child\n\n`:nth-child` 伪类允许根据元素在其同级元素中的位置进行定位。你可以使用数字、关键字甚至公式。\n\
    \n```css\nli:nth-child(2) {\n  color: red;\n}\n```\n\n你也可以使用 `even` 或 `odd` 这样的公式来定位隔一个元素。\n\
    \n```css\nli:nth-child(odd) {\n  color: blue;\n}\n```\n\n## :nth-last-child\n\n\
    `:nth-last-child` 伪类的原理与 `:nth-child` 相同，但从同级组的末尾计数。\n\n```css\nli:nth-last-child(2)\
    \ {\n  color: green;\n}\n```\n\n## :nth-of-type\n\n`:nth-of-type` 伪类用于根据元素与其相同类型的同级元素的位置进行定位。\n\
    \n```css\np:nth-of-type(2) {\n  color: orange;\n}\n```\n\n## :nth-last-of-type\n\
    \n`:nth-last-of-type` 伪类的原理与 `:nth-last-child` 相同，但它是从该类型的同级元素末尾计数。\n\n```css\n\
    p:nth-last-of-type(2) {\n  color: purple;\n}\n```\n\n## :last-child\n\n`:last-child`\
    \ 伪类用于定位作为父元素最后一个子元素的元素。\n\n```css\np:last-child {\n  margin-bottom: 0;\n}\n```\n\
    \n## :first-of-type\n\n`:first-of-type` 伪类用于定位作为父元素中同类型第一个元素。\n\n"
