    # ALIGNING AN <INPUT> FIELD WITH A BUTTON


    Default styling on form elements across different browsers can be a pain to deal
    with. Often times, in a single-field form like a search form, it is necessary
    to place the `<input>` element next to the submit button. Here is a simple search
    form, with an image used for the submit button:


    In every browser, the result is the same: The button appears slightly higher than
    the input field. Changing margins and padding does nothing. The simple way to
    fix this is to float the input field left, and add a small right margin. Here
    is the result:


    # Conclusion


    As was mentioned at the outset, without the CSS float property, table-less layouts
    would be, at worst, impossible, and at best, unmaintainable. Floats continue to
    be prominent in CSS layouts, even as CSS3 begins to gain prominence — even though
    there have been a few discussions about layouts without the use of floats.


    Hopefully this discussion has simplified some of the mysteries related to floats,
    and provided some practical solutions to a number of issues faced by CSS developers
    today.'
- md: "\n# The Z-Index CSS Property: A Comprehensive Look\n\nLouis Lazaris\n\nMost\
    \ CSS properties are quite simple to deal with. Often, applying a CSS property\
    \ to an element in your markup will have instant results — as soon as you refresh\
    \ the page, the value set for the property takes effect, and you see the result\
    \ immediately. Other CSS properties, however, are a little complex and will only\
    \ work under a given set of circumstances.\n\nThe **z-index** property belongs\
    \ to the latter group. **z-index** has undoubtedly caused as much confusion and\
    \ frustration as any other CSS property. Ironically, when **z-index** is fully\
    \ understood, it is a very easy property to use, and offers an effective method\
    \ for overcoming many layout challenges.\n\nIn this article, we'll explain exactly\
    \ what **z-index** is, how it has been misunderstood and we will discuss some\
    \ practical uses for it. We'll also describe some of the browser differences that\
    \ can occur, particularly in previous versions of Internet Explorer and Firefox.\
    \ This comprehensive look at **z-index** should provide developers with an excellent\
    \ foundation to be able to use this property confidently and effectively.\n\n\
    ## What is it?\n\nThe **z-index** property determines the stack level of an HTML\
    \ element. The “stack level” refers to the element’s position on the Z axis (as\
    \ opposed to the X axis or Y axis). A higher **z-index** value means the element\
    \ will be closer to the top of the stacking order. This stacking order runs perpendicular\
    \ to the display, or viewport.\n\n## 3-DIMENSIONAL REPRESENTATION OF THE Z AXIS:\n\
    \n![](img/736c504465a39c9f3caa50d5252a3998_52_0.png)\n\nIn order to clearly demonstrate\
    \ how z-index works, the image above exaggerates the display of stacked elements\
    \ in relation to the viewport.\n\n## The Natural Stacking Order\n\nIn an HTML\
    \ page, the natural stacking order (i.e. the order of elements on the Z axis)\
    \ is determined by a number of factors. Below is a list showing the order that\
    \ items fit into a stacking context, starting with the bottom of the stack. This\
    \ list assumes none of the items has z-index applied:\n\n- Background and borders\
    \ of the element that establish stacking context\n- Elements with negative stacking\
    \ contexts, in order of appearance\n- Non-positioned, non-floated, block-level\
    \ elements, in order of appearance\n- Non-positioned, floated elements, in order\
    \ of appearance\n- Inline elements, in order of appearance\n- Positioned elements,\
    \ in order of appearance\n\nThe z-index property, when applied correctly, can\
    \ change this natural stacking order.\n\nOf course, the stacking order of elements\
    \ is not evident unless elements are positioned to overlap one another. Thus,\
    \ to see the natural stacking order, negative margins can be used as shown below:\n\
    \n![](img/736c504465a39c9f3caa50d5252a3998_54_0.png)\n\nThe boxes above are given\
    \ different background and border colors, and the last two are indented and given\
    \ negative top margins so you can see the natural stacking order. The grey box\
    \ appears first in the markup, the blue box second, and the gold box third. The\
    \ applied negative margins clearly demonstrate this fact. These elements do not\
    \ have z-index values set; their stacking order is the natural, or default, order.\
    \ The overlaps that occur are due to the negative margins.\n\n## Why Does it Cause\
    \ Confusion?\n\nAlthough z-index is not a difficult property to understand, due\
    \ to false assumptions it can cause confusion for beginning developers. This confusion\
    \ occurs because z-index will only work on an element whose position property\
    \ has been explicitly set to absolute, fixed, or relative.\n\nTo demonstrate that\
    \ z-index only works on positioned elements, here are the same three boxes with\
    \ z-index values applied to attempt to reverse their stacking order:\n\n![](img/736c504465a39c9f3caa50d5252a3998_56_0.png)\n\
    \nThe grey box has a z-index value of \"9999\"; the blue box has a z-index value\
    \ of \"500\"; and the gold box has a z-index value of \"1\". Logically, you would\
    \ assume that the stacking order of these boxes should be reversed. But that is\
    \ not the case, because none of elements has position property set. Here are the\
    \ same boxes with position: relative added to each:\n\n![](img/736c504465a39c9f3caa50d5252a3998_58_0.png)\n\
    ![](img/736c504465a39c9f3caa50d5252a3998_58_1.png)\n![](img/736c504465a39c9f3caa50d5252a3998_58_2.png)\n\
    \nNow the result is as expected: the stacking order of the elements is reversed;\
    \ the grey box overlaps the blue box, and the blue box overlaps the gold.\n\n\
    ## Syntax\n\nThe z-index property can affect the stack order of both block-level\
    \ and inline elements, and is declared by a positive or negative integer, or a\
    \ value of auto. A value of auto gives the element the same stack order as its\
    \ parent. Here is the CSS code for the example above, where z-index property applied\
    \ correctly:\n\n```css\n#grey_box {\n  width: 200px;\n  height: 200px;\n  border:\
    \ solid 1px #ccc;\n  background: #dddd;\n  position: relative;\n  z-index: 9999;\n\
    }\n#blue_box {\n  width: 200px;\n  height: 200px;\n  border: solid 1px #4a7497;\n\
    \  background: #8daac3;\n  position: relative;\n  z-index: 500;\n}\n#gold_box\
    \ {\n  width: 200px;\n  height: 200px;\n  border: solid 1px #8b6125;\n  background:\
    \ #ba945d;\n  position: relative;\n  z-index: 1;\n}\n```\n\nAgain, it cannot be\
    \ stressed, especially for beginning developers, that the z-index property will\
    \ not work unless it is applied to a positioned element.\n\n## JavaScript Usage\n\
    \nIf you want to affect the z-index value of an element via JavaScript, the syntax\
    \ is similar to how other CSS properties are accessed, using \"camel casing\"\
    \ to replace hyphenated properties, as in the code below:\n\n```javascript\nvar\
    \ myElement = document.getElementById(\"gold_box\");\nmyElement.style.position\
    \ = \"relative\";\nmyElement.style.zIndex = \"9999\";\n```\n\nIn the above code,\
    \ the CSS syntax \"z-index\" becomes \"zIndex\". Similarly, \"background-color\"\
    \ becomes \"backgroundColor\", \"font-weight\" becomes \"fontWeight\", and so\
    \ on. Also, the position property is changed using the above code to again emphasize\
    \ that z-index only works on elements that are positioned.\n\n## Improper Implementations\
    \ in IE and Firefox\n\nUnder certain circumstances, there are some small inconsistencies\
    \ in Internet Explorer version 6 and 7 and Firefox version 2 with regards to the\
    \ implementation of the z-index property.\n\n### ELEMENTS IN IE6\n\nIn Internet\
    \ Explorer 6, the <select> element is a windowed control, so it will always appear\
    \ at the top of the stacking order regardless of natural stack order, position\
    \ values, or z-index. This problem is illustrated in the screen capture below:\n\
    \n![](img/736c504465a39c9f3caa50d5252a3998_61_0.png)\n\nThe <select> element appears\
    \ first in the natural stack order and is given a z-index value of \"1\" along\
    \ with a position value of \"relative\". The gold box appears second in the stack\
    \ order, and is given a z-index value of \"9999\". Because of natural stack order\
    \ and z-index values, the gold box should appear on top, which it does in all\
    \ currently used browsers except IE6:\n\n![](img/736c504465a39c9f3caa50d5252a3998_62_0.png)\n\
    \nUnless you're viewing this page with IE6, you'll see the gold box above overlapping\
    \ the <select> element. This bug in IE6 has caused problems with drop-down menus\
    \ that fail to overlap <select> elements. One solution is to use JavaScript to\
    \ temporarily hide the <select> element, then make it reappear when the overlapping\
    \ menu disappears. Another solution involves using an <iframe>.\n\n### POSITIONED\
    \ PARENTS IN IE6/7\n\nInternet Explorer versions 6 and 7 incorrectly reset the\
    \ stacking context in relation to the nearest positioned ancestor element. To\
    \ demonstrate this somewhat complicated bug, we'll display two of the boxes again,\
    \ but this time we'll wrap the first box in a “positioned” element:\n\n![](img/736c504465a39c9f3caa50d5252a3998_64_0.png)\n\
    \nThe grey box has a **z-index** value of “9999”; the blue box has a **z-index**\
    \ value of “1” and both elements are positioned. Therefore, the correct implementation\
    \ is to display the grey box on top of the blue box.\n\nIf you view this page\
    \ in IE6 or IE7, you'll see the blue box overlapping the grey box. This is caused\
    \ by the positioned element wrapping the grey box. Those browsers incorrectly\
    \ “reset” the stacking context in relation to the positioned parent, but this\
    \ should not be the case. The grey box has a higher **z-index** value, and should\
    \ therefore be overlapping the blue box.\n"
  mdcn: "\n\n# Z-Index CSS 属性：全面解析\n\nLouis Lazaris\n\n大多数 CSS 属性的处理都非常简单。通常情况下，在标记语言的元素上应用\
    \ CSS 属性会立即产生效果——只要你刷新页面，为该属性设置的值就会生效，你就能立即看到结果。然而，其他 CSS 属性则稍微复杂一些，只有在特定的情况下才会起作用。\n\
    \n**z-index** 属性属于后者。毫无疑问，**z-index** 造成的困惑和挫败感比其他 CSS 属性都要多。讽刺的是，当完全理解了 **z-index**\
    \ 后，它是一个非常容易使用的属性，为克服许多布局挑战提供了有效的方法。\n\n在本文中，我们将解释 **z-index** 到底是什么，它是如何被误解的，并讨论它的一些实际用途。我们还将描述一些可能出现的浏览器差异，特别是在旧版本的\
    \ Internet Explorer 和 Firefox 中。对 **z-index** 的全面解析将为开发者提供一个极佳的基础，使其能够自信且有效地使用该属性。\n\
    \n## 它是什么？\n\n**z-index** 属性决定了 HTML 元素的堆叠层级（stack level）。“堆叠层级”指的是元素在 Z 轴上的位置（相对于\
    \ X 轴或 Y 轴）。较高的 **z-index** 值意味着元素更靠近堆叠顺序的顶部。这种堆叠顺序垂直于显示区域，即视口（viewport）。\n\n\
    ## Z 轴的三维表示：\n\n![](img/736c504465a39c9f3caa50d5252a3998_52_0.png)\n\n为了清晰地演示\
    \ z-index 的工作原理，上面的图片放大了堆叠元素相对于视口的分显示情况。\n\n## 自然堆叠顺序\n\n在 HTML 页面中，自然堆叠顺序（即元素在\
    \ Z 轴上的顺序）由多个因素决定。以下列表显示了项目进入堆叠上下文的顺序，从堆栈底部开始。此列表假设没有任何项目应用了 z-index：\n\n- 建立堆叠上下文的元素的背景和边框\n\
    - 具有负堆叠上下文的元素，按出现顺序排序\n- 非定位、非浮动的块级元素，按出现顺序排序\n- 非定位、浮动的元素，按出现顺序排序\n- 内联元素（inline\
    \ elements），按出现顺序排序\n- 定位元素（positioned elements），按出现顺序排序\n\nz-index 属性如果应用正确，可以改变这种自然堆叠顺序。\n\
    \n当然，除非元素被定位并相互重叠，否则元素的堆叠顺序是不显而见的。因此，为了看到自然堆叠顺序，可以使用所示的负边距：\n\n![](img/736c504465a39c9f3caa50d5252a3998_54_0.png)\n\
    \n上面的盒子被赋予了不同的背景和边框颜色，最后两个缩进并设置了负的上外边距，以便你可以看到自然堆叠顺序。灰色框在标记中首先出现，蓝色框其次，金色框第三。所采用的负边距清楚地证明了这一事实。这些元素没有设置\
    \ z-index 值；它们的堆叠顺序是自然或默认的。发生的重叠是由于负边距引起的。\n\n## 为什么它会引起困惑？\n\n尽管 z-index 不是一个难以理解的属性，但由于错误的假设，它可能会给初学者带来困惑。这种困惑的发生是因为\
    \ z-index 只对那些 `position` 属性被显式设置为 `absolute`、`fixed` 或 `relative` 的元素有效。\n\n\
    为了证明 z-index 只对定位元素有效，这里是相同的三个盒子，应用了 z-index 值以尝试反转它们的堆叠顺序：\n\n![](img/736c504465a39c9f3caa50d5252a3998_56_0.png)\n\
    \n灰色框的 z-index 值为 \"9999\"；蓝色框的 z-index 值为 \"500\"；金色框的 z-index 值为 \"1\"。逻辑上你会假设这些盒子的堆叠顺序应该是反转的。但并非如此，因为没有元素设置\
    \ `position` 属性。以下是为每个盒子添加 `position: relative` 后的相同盒子：\n\n![](img/736c504465a39c9f3caa50d5252a3998_58_0.png)\n\
    ![](img/736c504465a39c9f3caa50d5252a3998_58_1.png)\n![](img/736c504465a39c9f3caa50d5252a3998_58_2.png)\n\
    \n现在结果如预期所示：元素的堆叠顺序反转了；灰色框重叠蓝色框，蓝色框重叠金色框。\n\n## 语法\n\nz-index 属性可以影响块级元素和内联元素的堆叠顺序，通过正整数、负整数或\
    \ `auto` 值声明。`auto` 值赋予元素与其父元素相同的堆叠顺序。以下是上述示例的 CSS 代码，其中 z-index 属性应用正确：\n\n```css\n\
    #grey_box {\n  width: 200px;\n  height: 200px;\n  border: solid 1px #ccc;\n  background:\
    \ #dddd;\n  position: relative;\n  z-index: 9999;\n}\n#blue_box {\n  width: 200px;\n\
    \  height: 200px;\n  border: solid 1px #4a7497;\n  background: #8daac3;\n  position:\
    \ relative;\n  z-index: 500;\n}\n#gold_box {\n  width: 200px;\n  height: 200px;\n\
    \  border: solid 1px #ccc;\n  background: #dddd;\n  position: relative;\n  z-index:\
    \ 1;\n}\n```\n\n## JavaScript 使用\n\n如果你想通过 JavaScript 影响元素的 z-index 值，其语法类似于访问其他\
    \ CSS 属性，使用驼峰命名法（camel casing）：\n\n```javascript\nvar myElement = document.getElementById(\"\
    gold_box\");\nmyElement.style.position = \"relative\";\nmyElement.style.zIndex\
    \ = \"9999\";\n```\n\n在上面的代码中，z-index 变成了 zIndex；同样，background-color 变成了 backgroundColor，font-weight\
    \ 变成了 fontWeight，以此此类推。这再次强调了 z-index 只对定位的元素有效。\n\n## IE 和 Firefox 的实现差异\n\n\
    在某些情况下，Internet Explorer 和 Firefox 在 z-index 属性上存在一些不一致之处，特别是第 6 和 7 版本。\n\n###\
    \ IE6 中的元素\n\n在 Internet Explorer 6 中，`<select>` 元素是一个窗口控件，因此无论自然堆叠顺序、位置值或 z-index\
    \ 如何，它总是出现在顶部。这个问题在下面的屏幕截图中所示：\n\n![](img/736c504465a39c9f3caa50d5252a3998_61_0.png)\n\
    \nselect 元素在自然堆叠顺序中首先出现，被赋予 z-index 值为 \"1\"，并带有相对定位值。金色框在堆叠顺序中第二个出现，被赋予 z-index\
    \ 值为 \"999\"。由于自然堆叠顺序和 z-index 值，金色框应该在上方，在除 IE6 以外的所有浏览器中都是如此：\n\n![](img/736c504465a39c9f3caa50d5252a3998_62_0.png)\n\
    \n除非你使用 IE6 此，否则你会看到金色框重叠在 select 元素之上。IE6 的这个 bug 导致下拉菜单无法重叠 select 元素。一种解决方案是使用\
    \ JavaScript 临时隐藏 select 元素，然后在重叠菜单消失时让它重新出现。另一种解决方案涉及 `<iframe>`。\n\n### IE6/7\
    \ 中的定位父元素\n\nInternet Explorer 第 6 和 7 版本错误地相对于最近的定位祖元素重置了堆叠上下文。为了演示这个相当复杂的 bug，我们将再次显示两个盒子，但这次我们将第一个盒子封装在一个“定位的”元素中：\n\
    \n![](img/736c504465a39c9f3caa50d5252a3998_64_0.png)\n\n灰色框的 z-index 值为 \"9999\"\
    ；蓝色框的 z-index 值为 \"1\"，且两个元素都是定位的。因此，正确的实现是让灰色框显示在蓝色框上方。\n\n如果你在 IE6 或 IE7 中查看此页面，你会看到蓝色框重叠灰色框。这是由于封装灰色框的定位元素造成的。这些浏览器错误地相对于定位父元素重置了堆叠上下文，但不应该是如此。灰色框具有更高的\
    \ z-index 值，因此应该重叠蓝色框。\n\n"
