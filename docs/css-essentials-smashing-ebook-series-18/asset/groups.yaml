  mdcn: '

    读者可以使用这些元素来帮助用户在页面上跳转，直接获取重要内容，而无需“跳过导航（skip nav）”链接。


    虽然这些收益中的许多在未来某个无法预料的时间内才能实现，但你现在就可以开始添加这些新元素，这样一旦充分利用这些元素的工具出现，你就准备就绪了。即使你的浏览器不识别某个元素，你仍然可以对其设置样式——这是浏览器的标准行为。嗯，除了
    IE 以外的所有都是如此。幸运的是，你可以使用 Remy Sharp 提供的非常简单的 JavaScript 代码轻松地欺骗 IE 为这些元素设置样式。


    当然，你通常无法假设所有用户都启用了 JavaScript，因此最安全、最保守的选项是暂时不要使用这些新的结构化元素，而是使用带有相应类名的 `div`，就像它们是新元素一样。例如，在需要使用
    `article` 元素的地方，使用一个类名为“article”的 `div`。你仍然可以使用 HTML5 文档声明——只要你不使用新元素，HTML5 页面在
    IE 中也能运行良好。如果需要，你之后可以轻松地转换为新的 HTML5 元素，在此期间，你可以利用更详细的 HTML5 验证器。此外，使用这些标准类名可以让你和团队中的其他人员更新样式变得更容易，而且在站点之间保持一致的命名规范有助于特殊需求的用户设置用户样式表，以便所需的方式对某些元素进行渲染。


    ## 减少对 JavaScript 和插件的依赖


    有助于：适应性、效率


    HTML5 中的许多新元素和特性使得纯标记即可实现某些效果，而这些效果以前只能通过 JavaScript 或各种第三方插件（如 Flash 或 Java）来实现。通过消除对
    JavaScript 和插件的需求，你可以让你的页面适用于更广泛的设备和更广泛的用户。你还可能让你的开发过程更快速、更高效，因为你不需要花时间寻找正确的脚本或插件并完成所有设置。最后，这些技术可能会提高页面的速度，用户不需要下载额外的文件。另一方面，如果内置浏览器版本比第三方版本慢，某些可能会降低性能。我们必须观察浏览器现在和未来如何处理每种选项。）


    减少 JavaScript 和插件依赖的一些特性包括：


    -   **新的表单元素和属性。** HTML5 提供了一系列新的 **input** 类型，例如 **email**、**url** 和 **date**，它们可以在不需要
    JavaScript 的情况下进行客户端验证。还有许多新的表单属性可以完成以前需要 JavaScript 完成的工作，如使用 **placeholder**向字段添加性占位符文本，或使用
    **autofocus** 让浏览器跳转到某个字段。在不支持它们的浏览器中，新的 **input** 类型会降级为普通输入，而新属性会被忽略，因此开始使用它们不会对不支持的浏览器造成伤害。


    当然，你必须为不支持的浏览器编写回退 JavaScript，这在暂时抵消了“无 JavaScript”的优势。（或者，依赖服务器端验证——无论如何，你都应该有一个作为客户端验证备份的验证来捕获来自不支持浏览器的提交。）尽管如此，它们为使用最新浏览器的用户提供了良好的可用性提升，因此它们非常适合渐进式增强。


    -   **canvas 元素。** `canvas` 元素在屏幕上创建一个空白区域，你可以用 JavaScript 在上面进行绘制。所以，它*确实*需要使用
    JavaScript，*但*它消除了对 Flash 或 Java 插件的需求。它受 IE 之外的所有主流浏览器支持，但你可以使用 ExplorerCanvas
    脚本轻松地让它在 IE 中运行。


    -   **video 和 audio 元素。** HTML5 可以直接嵌入 **video** 和 **audio** 文件，就像在页面上添加图像一样简单，无需任何额外的插件。


