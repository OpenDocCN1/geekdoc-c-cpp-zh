    - 演示\n- 浏览器支持：WebKit 预览版\n\nFlexbox 允许你在框内分布元素（提供了我们需要的垂直居中功能），并带有弹性单位来控制元素的尺寸。注意，该规范自提议以来发生了巨大变化。以前你会使用\
