    \ {\n  font-style: italic;\n  color: #c00;\n}\n```\n\n... you would write this:\n\
    \n```\n/*------------------------------------*\n$TYPE\n*/------------------------------------*/\n\
    h1 {\n  font-size: 2em;\n}\nh2 {\n  font-size: 1.5em;\n}\na {\n  font-weight:\
    \ bold;\n}\n#tagline {\n  font-style: italic;\n}\n/*------------------------------------*\n\
    $SHARED\n*/------------------------------------*/\nh1, h2, a, #tagline {\n  color:#c00;\n\
    }\n```"
  - '[PAGE 152]


    This way, if the brand color of #c00 ever changes, a developer would only ever
    need to change that value once. This is essentially using variables in CSS.


    # MULTIPLE CSS FILES FOR SECTIONS, OR ONE BIG FILE WITH ALL SECTIONS?


    A lot of people separate their sections into multiple files, and then use the
    @import rule to put them all back together in one meta file. For example:


    ```

    @import url(main.css)

    @import url(type.css)

    @import url(images.css)

    @import url(tables.css)

    @import url(misc.css)

    @import url(responsive.css)

    ```


    This is fine, and it keeps everything in sections, but it does lead to more HTTP
    requests than is necessary; and minimizing requests is one of the most important
    rules for a high-performance website.


    Compare this...


    | URL | Status | Domain | Size | Timeline |

    |---|---|---|---|--|

    | GET main.css | 304 Not Modified | | 83 B | 311ms |

    | GET reset.css | 304 Not Modified | | 722 B | | |

    | GET typography.css | 304 Not Modified | | 2 KB | 329ms |

    | GET layout.css | 304 Not Modified | | 1.8 KB | 342ms |

    | GET entries.css | 304 Not Modified | | 1 KB | 349ms |

    | GET thickness.css | 304 Not Modified | | 8.7 KB (8.7 KB from cache) | 861ms
    (onload: 2.52s) |'
  - '[PAGE 153]


    If you section and comment your CSS well enough, using a table of contents

    and so forth, you avoid the need to split your CSS files, thus keeping

    those requests down.


    If you really want to break up your CSS into multiple style sheets, you can

    that—just combine them into one at build time. This way, your developers

    work across multiple files, but your users will download one

    catenated file.


    # Learning From Programmers


    Programmers have been doing this for ages, and doing it well. Their job is to

    write code that is as readable as it is functional. We front-end developers

    could learn a lot from how programmers deal with code.


    The code of my good friend (and absolutely awesome chap) Dan Bentley

    really struck a chord with me. It''s beautiful. I don''t understand what it is

    most of the time, but it''s so clean and lovely to look at. So much white

    space, so neat and tidy, all commented and properly looked after. His PHP,

    Ruby, Python or whatever-he-decides-to-use-that-day always looks so nice.

    It made me want to write my CSS the same way.'
  - "[PAGE 154]\n\nWhite space is your friend. You can remove it before you go live\
    \ if you like, but the gains in cleanliness and readability are worth the few\
    \ extra bytes (which you could always cut back down by Gzip’ing your files anyway).\n\
    \nMake the code readable and maintainable first and foremost, then worry about\
    \ file size later. Happy developers are worth more than a few kilobytes in saved\
    \ weight.\n\n# Code Should Take Care Of Itself\n\nSo far, we’ve talked about people\
    \ maintaining your code, but what about actually using it?\n\nYou can do a number\
    \ of things to make the life of whoever inherits your code much easier—and to\
    \ make you look like a saint. I can’t think of generic examples, but I have a\
    \ few specific ones, mainly from inuit.css.\n\n# INTERNATIONALIZE YOUR SELECTORS\n\
    \nInuit.css has a class named .centered, which is spelt in US English. CSS is\
    \ written in US English anyway, so we’re used to this; but as an English developer,\
    \ I always end up typing UK English at least once in a project. Here is the way\
    \ I have accounted for this:\n\n```\n.centered, .centered {\n  [style]\n}\n```"
  - '[PAGE 155]


    Both classes do the same thing, but the next developer doesn’t have to remember
    to be American!


    If your selectors include words that have US and UK spelling variants, include
    both.


    # LET THE CODE DO SINGLE THE HEAVY LIFTING


    Also in inuit.css, I devised a method to not need class="end" for the last column
    in a row of grids. Most frameworks require this class, or similar, to omit the
    margin-right on the last item in a list and thus prevent the grid system from
    breaking.


    Remembering to add this class isn''t a big deal, but it’s still one thing to remember.
    So, I worked out a way to remove it.


    In another major inuit.css update, I removed a .grid class that used to be required
    for every single grid element. This was a purely functional class that developers
    had to add to any <div> that they wanted to behave like a grid column. For example:


    ```

    <div class="grid grid-4">

    ...\n</div>

    ```


    This .grid class, in conjunction with the .grid-4 class, basically says, “I want
    <div> to be a grid item and to span four columns. This isn’t a huge burden on
    developers, but again, it’s one more thing that could be removed to make their
    lives easier.'
  - '[PAGE 156]


    The solution was to use a regex CSS attribute selector: [class^="grid-\]. This
    says, "Select any element whose class begins with .grid-", and it allows the developer’s
    mark-up to now read as follows:


    ```

    <div class="grid-4">

    ...

    </div>

    ```


    CSS attribute selectors may be less efficient than, say, classes, but not to the
    point that you''d ever notice it (unless you were working on a website with massive
    traffic, like Google). The benefits of making the mark-up leaner and the developer’s
    life easier far outweigh the performance costs.


    The hard work once and reap the benefits later. Plus, get brownie points from
    whoever picks up your project from you.


    # BE PRE-EMPTIVE, THINK ABOUT EDGE CASES


    An example of being pre-emptive in inuit.css is the grid system. The grids are
    meant to be used in a series of sibling columns that are all contained in one
    parent, with a class of 5.


    This is their intended use. But if someone wants a standalone grid? That''s not
    their intended use, but let''s account for it it should happen.


    **Note:** inuit.css has changed since this was written, but the following is true
    as of version 2.5.'
  - '[PAGE 157]


    Another and perhaps better example uses the 12-column grid system in inuit.css.
    By default, the framework uses a 16-column grid, with classes .grid-1 through
    .grid-16 for each size of column.


    A problem arises, though, when you attempt to switch from the 16-column system
    to the 12-column system. The .grid-15 class, for example, doesn''t exist in a
    12-column layout; and even if it did, it would be too big.


    What I did here was to make .grid-13 through .grid-16 use the exact properties
    as .grid-12. So, if you switch from a 16-column layout to a 12-column one, .grid-13
    through .grid-16 wouldn''t break it—they would all just become .grid-12s.


    This means that developers can switch between them, and inuit.css will take care
    of everything else.


    Pre-empt the developer’s next problem, and solve it for them.


    # Addendum


    A few people have mentioned that some of these practices lead to a bloated CSS
    file. Bloat is where unnecessary code makes its way into a file, and your comments
    should be anything but unnecessary. It will lead to a larger CSS file, but not
    a bloated one.


    If you are worried about increased file size then you should minify and gzip your
    stylesheets, but this is best practice (particularly for highly trafficked websites)
    anyway.'
- md: "\n# That’s It\n\nThere you have it: a few humble suggestions on how CSS authors\
    \ can write code that is perfect for other developers to inherit, understand,\
    \ maintain, extend and enjoy.\n\n# Decoupling HTML From CSS\n\nJonathan Snook\n\
    \nFor years, the Web standards community has talked about the separation of concerns.\
    \ Separate your CSS from your JavaScript from your HTML. We all do that, right?\
    \ CSS goes into its own file; JavaScript goes in another; HTML is left by itself,\
    \ nice and clean.\n\nCSS Zen Garden proved that we can alter a design into a myriad\
    \ of permutations by changing the CSS. However, we've rarely seen the flip side\
    \ of this — the side that is more likely to occur in a project: the HTML changes.\
    \ We modify the HTML and then have to go back and revise any CSS that goes with\
    \ it.\n\nIn this way, we haven't really separated the two, have we? We have to\
    \ make our changes in two places.\n\n## Exploring Approaches\n\nOver the course\
    \ of my career, I've had the pleasure and privilege to work on hundreds of different\
    \ websites and Web applications. For the vast majority of these projects, I was\
    \ the sole developer building out the HTML and CSS. I developed a way of coding\
    \ websites that worked for me.\n\nMost recently, I spent two years at Yahoo working\
    \ on Mail, Messenger, Calendar and other projects. Working on a much larger project\
    \ with a much larger team was a great experience. A small team of prototypes worked\
    \ to build out all of the HTML and CSS for multiple teams of engineers.\n\nIt\
    \ was the largest-scale project I had worked on in many aspects:\n\n- Yahoo’s\
    \ user base is massive. Mail alone has about 300 million users.\n- Hundreds of\
    \ people spread across multiple teams were working with the HTML and CSS.\n- We\
    \ were developing a system of components to work across multiple projects.\n\n\
    It was during my time at Yahoo that I began to really examine how I and the team\
    \ at Yahoo build websites. What pain points did we keep running into, and how\
    \ could we avoid them?\n\nI looked to see what everyone else was doing. I looked\
    \ at Nicole Sullivan’s Object-Oriented CSS, Jina Bolton’s presentation on “CSS\
    \ Workflow” and Natalie Downe’s “Practical, Maintainable CSS,” to name just a\
    \ few.\n\nI ended writing my thoughts as a long-form style guide named “Scalable\
    \ and Modular Architecture for CSS.” That sounds wordy, so you can just call it\
    \ SMACS (pronounced “smacks”) for short. It’s a guide that continues to evolve\
    \ as I refine and expand on ways to approach CSS development.\n\nAs a result of\
    \ this exploration, I noticed that designers (including me) traditionally write\
    \ CSS that is deeply tied to the HTML that it is designed to style. How do we\
    \ begin to decouple the two for more flexible development with less refactoring?\n\
    \nIn other words, how do we avoid throwing **important** at everything or falling\
    \ into selector hell?\n\n# Reusing Styles\n\nIn the old days, we wrapped font\
    \ tags and applied background attributes to every HTML element that needed styling.\
    \ This was, of course, very impractical, and thus CSS was born. CSS enabled us\
    \ to reuse styles from one part of the page on another.\n\nFor example, a navigation\
    \ menu has a list of items that all look the same. Repeating inline styles on\
    \ each item wouldn't be practical. As a result, we begin to see CSS like this:\n\
    \n```css\n#nav {\n  margin: 0;\n  padding: 0;\n  list-style: none;\n}\n#nav li\
    \ {\n  float: left;\n}\n#nav li a {\n  display: block;\n  padding: 5px 10px;\n\
    \  background-color: blue;\n}\n```\n\nSure beats adding float:left to every list\
    \ item and display:block; padding:5px to every link. Efficiency, for the win!\
    \ Just looking at this, you can see the HTML structure that is expected:\n\n```html\n\
    <ul id=\"nav\">\n  <li><a href=\"/\">Home</a></li>\n  <li><a href=\"products\"\
    >Products</a></li>\n  <li><a href=\"contact\">Contact Us</a></li>\n</ul>\n```\n\
    \nNow, the client comes back and says, “I want a drop-down menu to appear when\
    \ the user clicks on ‘Products.’ Give them easy access to each of the pages!”\
    \ As a result, our HTML changes.\n\n```html\n<ul id=\"nav\">\n  <li><a href=\"\
    /\">Home</a></li>\n  <li><a href=\"/products\">Products\n    <ul>\n      <li><a\
    \ href=\"/products/shoes\">Shoes</a></li>\n      <li><a href=\"/products/jackets\"\
    >Jackets</a></li>\n    </ul>\n  </li>\n  <li><a href=\"/contact\">Contact Us</a></li>\n\
    </ul>\n```\n\nWe have a list item within a list item, and links within it. Our\
    \ menu has a horizontal navigation when the client wants a vertical list, so we\
    \ add some rules to style the inner list to match what the client wants.\n\n```css\n\
    #nav ul {\n  margin: 0;\n  padding: 0;\n  list-style:none;\n}\n#nav li {\n  float:\
    \ none;\n}\n#nav li li a {\n  padding: 2px;\n  background-color: red;\n}\n```\n\
    \nProblem solved! Sort of.\n\n# Reducing The Depth Of Applicability\n\nProbably\
    \ the most common problem with CSS is managing specificity. Multiple CSS rules\
    \ compete in styling a particular element on the page. With our menu, our initial\
    \ rules were styling the list items and the links in the navigation and the menu.\
    \ Not good.\n\nBy adding more element selectors, we were able to increase specificity\
    \ and have our menu styles win out over the navigation styles.\n\nHowever, this\
    \ can become a game of cat and mouse as a project increases in complexity. Instead,\
    \ we should be limiting the impact of CSS. Navigation styles should apply to and\
    \ affect only the elements that pertain to it, and menu styles should apply to\
    \ and affect only the elements that pertain to it.\n\nI refer to this impact in\
    \ SMACS as the “depth of applicability.\" It's the depth at which a particular\
    \ rule set impacts the elements around it. For example, a style like #nav li a,\
    \ when given an HTML structure that includes our menus, has a depth of 5: from\
    \ the ul to the li to the ul to the li to the a.\n\nThe deeper level of applicability,\
    \ the more impact the styles can have on the HTML and the more tightly coupled\
    \ the HTML is to the CSS.\n\nThe goal of more manageable CSS — especially in larger\
    \ projects — is to limit the depth of applicability. In other words, write CSS\
    \ to affect only the elements that we want them to affect.\n\n# CHILD SELECTORS\n\
    \nOne tool for limiting the scope of CSS is the child selector (>). If you no\
    \ longer have to worry about Internet Explorer 6 (and, thankfully, many of us\
    \ don't), then the child selector should be a regular part of your CSS diet.\n\
    \nChild selectors limit the scope of selectors. Going back to our navigation example,\
    \ we can use the child selector to limit the scope of the navigation so that it\
    \ does not affect the menu.\n\n```css\n#nav {\n  margin: 0;\n  padding: 0;\n \
    \ list-style: none;\n}\n#nav > li {\n  float: left;\n}\n#nav > li > a {\n  display:\
    \ block;\n  padding: 5px 10px;\n  background-color: blue;\n}\n```\n\nFor the menu,\
    \ let's add a class name to it. This will make it more descriptive and provide\
    \ a base for the rest of our styles.\n\n```css\n.menu {\n  margin: 0;\n  padding:\
    \ 0;\n  list-style: none;\n}\n.menu > li > a {\n  display: block;\n  padding:\
    \ 2px;\n  background-color: red;\n}\n```\n\nWhat we've done is limited the scope\
    \ of our CSS and isolated two visual patterns into separate blocks of CSS: one\
    \ for our navigation list and one for our menu list. We've taken a small step\
    \ towards modularizing our code and a step towards decoupling the HTML from the\
    \ CSS.\n\n# Classifying Code\n\nLimiting the depth of applicability helps to minimize\
    \ the impact that a style might have on a set of elements much deeper in the HTML.\
    \ However, the other problem is that as soon as we use an element selector in\
    \ our CSS, we are depending on that HTML structure never to change. In the case\
    \ of our navigation and menu, it's always a list with a bunch of list items, with\
    \ a link inside each of those. There's no flexibility to these modules.\n\nLet's\
    \ look at an example of something we see in many designs: a box with a heading\
    \ and a box of content after it.\n\n```html\n<div class=\"box\">\n<h2>Sites I\
    \ Like</h2>\n  <ul>\n    <li><a href=\"http://smashingmagazine.com/\">Smashing\
    \ Magazine</a></li>\n    <li><a href=\"http://smacss.com/\">SMACSS</a></li>\n\
    \  </ul>\n</div>\n```\nLet's give it some styles.\n```css\n.box {\n  margin: 0;\n\
    \  padding: 5px 10px;\n  border-bottom: 1px solid #333;\n  background-color: #CCC;\n\
    }\n.box h2 {\n```\n"
  mdcn: "\n\n# 就这样\n\n这就是全部内容：关于 CSS 作者如何编写出让其他开发者易于继承、理解、维护、扩展和享受的代码，这里提供了一些谦微的建议。\n\
    \n# 将 HTML 与 CSS 解耦\n\nJonathan Snook\n\n多年年来，Web 标准社区一直在谈论“关注点分离”（separation\
    \ of concerns）。将你的 CSS 与 JavaScript 以及 HTML 分隔开。我们都做到了这一点，对吧？CSS 放在它自己的文件中；JavaScript\
    \ 放在另一个文件中；HTML 则保持独立，既整洁又清晰。\n\nCSS Zen Garden 证明了我们可以通过更改 CSS 将一个设计转变为无数种变体。然而，我们很少看到这种现象的另一面——即在项目中更容易发生的一面：HTML\
    \ 发生了变化。我们修改了 HTML，然后必须回过头修改与之相关的 CSS。\n\n通过这种方式，我们并没有真正将两者隔离开来，不是吗？我们必须在两个地方进行更改。\n\
    \n## 探索方法\n\n在我的职业生涯中，我有幸也有荣参与了数百个不同的网站和 Web 应用的开发。对于绝大多数项目，我是构建 HTML 和 CSS 的唯一开发者。我开发出了一套适合我自己的网站编码方法。\n\
    \n最近，我在 Yahoo 工作了两年，负责 Mail、Messenger、Calendar 以及其他项目。在一个规模更大、团队更强大的项目上工作是一次非常棒的经历。一个小组型的原型团队为多个工程师团队构建了所有的\
    \ HTML 和 CSS。\n\n这是我在许多方面都参与过的、规模最大的项目：\n\n- Yahoo 的用户群非常庞大。仅 Mail 一项就有约 3 亿用户。\n\
    - 分散在多个团队的数百人都在同时处理 HTML 和 CSS。\n- 我们正在开发一套组件系统，以便跨项目使用。\n\n在我在 Yahoo 工作期间，我开始认真审视\
    \ Yahoo 团队是如何构建网站的。我们不断遇到哪些痛点？我们如何避免它们？\n\n我开始观察其他人在做什么。我研究了 Nicole Sullivan 的面向对象\
    \ CSS（OCSS）、Jina Bolton 关于“CSS 工作流”的演讲，以及 Natalie Downe 的《实用且可维护的 CSS》，这只是其中之一。\n\
    \n最后，我将自己的想法写成了一个长篇风格指南，命名为“CSS 可扩展模块化架构”（Scalable and Modular Architecture for\
    \ CSS）。这听起来很啰嗦，所以你可以简称为 SMACS（发音为“smacks”）。这是一个指南，随着我不断完善和扩展处理 CSS 开发的方法，它也在不断进化。\n\
    \n通过这次探索，我注意到设计师（包括我在内）传统上编写的 CSS 与其设计的 HTML 是深度耦合的。我们该如何开始将两者解耦，以实现更灵活的开发并减少重构？\n\
    \n换句话说，我们该如何避免在所有元素上乱加 **important**，或者掉入选择器地狱？\n\n# 重用样式\n\n在过去，我们包裹 `font` 标签，并对每个需要样式的\
    \ HTML 元素应用背景属性。这显然非常不实际，因此 CSS 诞生了。CSS 允许我们将页面的某部分的样式复用到另一个部分。\n\n例如，导航菜单有一组外观相同的列表项。在每个项目上重复内联样式是不切实际的。因此，我们开始看到这样的\
