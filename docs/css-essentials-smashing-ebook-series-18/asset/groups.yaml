    # 关于作者


    ## Divya Manian


    Divya Manian 是西雅图 Opera Software 的 Web 启动者。她的职业从为摩托罗拉手机开发设备驱动程序转变为设计网站，并自此以后再也没有回头。她认真履行其作为开放
    Web 守望者的职责，这促成了诸如 HTML5 Boilerplate 等合作项目。


    ## Harry Roberts


    Harry Roberts 是来自英国的 BSkyB 高级 UI 开发人员，也是一位字体发热者。他充满热情、富有激情且直有直言，他是一位作家、设计师，也是
    Smashing Magazine 专家小组的成员。他在 Twitter 上的账号是 @cssswizardry。


    ## Inayili de León


    Inayili de León 是一位定居在伦敦的葡萄牙网页设计师，专长跨浏览器、语义化 HTML 和 CSS 以及简洁功能型的设计。她经常为知名的在线和纸质出版物撰稿，并在自己的网页设计博客
    Web Designer Notebook 上发表文章。2011年5月，她出版了《高流量网站的 Pro CSS》（Pro CSS for High Traffic
    Websites）一书，并经常在当地和国际会议及聚会上发表演讲。她目前在 Canonical 的设计团队担任网页设计师。


    ## Jonathan Snook


    Jonathan Snook 在他的博客 Snook.ca 上分享技巧、窍门和书签。他还曾为 A List Apart、24ways 和 .net magazine
    撰稿，并合著了两本书：《CSS 的艺术与科学》（The Art and Science of CSS）和《加速 DOM 脚本》（Accelerated DOM
    Scripting）。Snook 目前在 Shopify 的设计团队工作。


    ## Louis Lazaris


    Louis Lazaris 是一位位于加拿大多伦伦的自由职业网页开发人员。他在 Impressive Webs 上编写前端代码博客，是 SitePoint
    出版的《实战 HTML5 和 CSS3》一书的合著者。你可以在 Twitter 上关注 Louis，或通过他的网站与他联系。


    ## Michael Martin


    Michael Martin 在 Pro Blog Design 编写关于网页设计、WordPress 和编码的文章。你可以在那里订阅以获取关于充分利用博客设计的建议，或在
    Twitter 上关注他。


    ## Niels Matthijs


    Niels Matthijs 利用闲余时间通过他的笔名 Onderhoud 将奢华生活与写博客的巨大压力相结合。作为一名前端开发人员，他在 Internet
    Architects 工作，投入了大量时间让网络变得更加易用和愉悦的地方。


    ## Thierry Koblentz


    Thierry 对网页设计和 CSS 充满热情。他热爱解决问题的挑战，并构思原创的想法，这些想法让他每天早晨起床，并让他工作到深夜。他是 Yahoo! 的前端工程师，并拥有
    TJK Design 和 ez-css.org。


    ## Zoe Mickley Gillenwater


    Zoe Mickley Gillenwater 是一位自由职业平面和网页设计师、开发者兼顾问。她是书籍《灵活网页设计：使用 CSS 创建流体和弹性布局》（Flexible
    Web Design: Creating Liquid and Elastic Layouts with CSS）以及 lynda.com 视频课程《网络可访问性原则》（Web
    Accessibility Principles）的作者，目前正在编写即将出版的新书《惊艳的 CSS3：最新 CSS 项目型指南》（Stunning CSS3:
    A Project-based Guide to the Latest in CSS）。Zoe 目前是网页标准项目 (WaSP) Adobe 任务组的成员，曾是流行的
    css-discuss 邮件列表管理员。你可以在她的博客和作品集网站上了解更多关于 Zoe 的信息，或在 Twitter 上关注她。


