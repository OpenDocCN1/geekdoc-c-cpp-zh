    [content]

    readers could use the elements to help users jump around the page to get straight
    to the important content without needing “skip nav” links.


    Although many of these benefits won’t be realized until some unforeseen time in
    the future, you can start adding these new elements now, so that as soon as tools
    pop up that take full advantage of them, you’ll be ready. Even if your browser
    doesn’t recognize an element, you can still style it — that’s standard browser
    behavior. Well, in every browser but IE. Luckily, you can easily trick IE into
    styling these elements using a very simple piece of JavaScript, handily provided
    by Remy Sharp.


    Of course, you usually can depend on all your users having JavaScript enabled,
    so the very safest and most conservative option is not to use these new structural
    elements just yet, but use divs with corresponding class names as if they were
    new elements. For instance, where you would use an article element, use a div
    with a class name of “article.” You can still use the HTML5 doct — HTML5 pages
    work fine in IE, as long as you don’t use the new elements. You can then convert
    to the new HTML5 elements easily if desired, and in the meantime, you can take
    advantage of the more detailed HTML5 validators. Also, using these standardized
    class names can make updating the styles easier for you and others in your team,
    and having consistent naming conventions across sites makes it easier for users
    with special needs to set up user style sheets that can style certain elements
    in a needed way.


    ## REDUCING JAVASCRIPT AND PLUG-IN DEPENDENCE


    Aids in: adaptability, efficiency


    A number of the new elements and features in HTML5 make effects possible with
    pure markup that to be possible only with JavaScript or various third-party plug-ins,
    like Flash or Java. By removing the need for JavaScript and plug-ins, you can
    make your pages work on a wider variety of devices and for a wider variety of
    users. You may also make your development process quicker and more efficient,
    since you don''t have to take the time to find the right script or plug-in and
    get it all set up. Finally, these techniques may be able to boost the speed of
    your pages, extra files don''t have to be downloaded by the users. (On the other
    hand, some may decrease performance, if the built-in browser version is slower
    than a third-party version. We''ll have to wait and see how browsers handle each
    option now and in the future.)


    Some of the features that reduce JavaScript and plug-in dependence:


    - **New form elements and attributes.** HTML5 offers a bunch of new **input**
    types, such as **email**, **url**, and **date**, that can come with client-side
    validation without the need for JavaScript. There are also many new form attributes
    that can accomplish what JavaScript used to be required, like **placeholder**
    to add suggestive placeholder text to a field or **autofocus** to make the browser
    jump to a field. The new **input** types degrade to regular inputs in browsers
    that don''t support them, and the new attributes are just ignored, so it doesn''t
    hurt unsupported browsers to start using them.


    Of course, you''ll have to put in fallback JavaScript for unsupporting browsers,
    negating the “no JavaScript” benefits for the time being. (Or, depend on server-side
    validation—which you always ought to have in place as a backup behind client-side
    validation anyway—to catch the submissions from unsupporting browsers.) Still,
    they offer a nice usability boost for users with the most up to date browsers,
    so they''re good for progressive enhancement.


    - **The canvas element.** The canvas element creates a blank area of the screen
    that you can create drawings on with JavaScript. So, it *does* require the use
    of JavaScript, *but* it removes the need for Flash or Java plug-ins. It''s supported
    in every major browser but IE, but you can make it work in IE easily using the
    ExplorerCanvas script.


    - **The video and audio elements.** HTML5 can embed **video** and **audio** files
    directly, just as easily as you would add an image to a page, without the need
    for any additional plug-ins.


