    # That’s It


    There you have it: a few humble suggestions on how CSS authors can write code
    that is perfect for other developers to inherit, understand, maintain, extend
    and enjoy.'
  - '[PAGE 159]


    # # Decoupling HTML From CSS


    Jonathan Snook


    For years, the Web standards community has talked about the separation of concerns.
    Separate your CSS from your JavaScript from your HTML. We all do that, right?
    CSS goes into its own file; JavaScript goes in another; HTML is left by itself,
    nice and clean.


    CSS Zen Garden proved that we can alter a design into a myriad of permutations
    by changing the CSS. However, we''ve rarely seen the flip side of this — the side
    that is more likely to occur in a project: the HTML changes. We modify the HTML
    and then have to go back and revise any CSS that goes with it.


    In this way, we haven''t really separated the two, have we? We have to make our
    changes in two places.


    # ## Exploring Approaches


    Over the course of my career, I''ve had the pleasure and privilege to work on
    hundreds of different websites and Web applications. For the vast majority of
    these projects, I was the sole developer building out the HTML and CSS. I developed
    a way of coding websites that worked for me.


    Most recently, I spent two years at Yahoo working on Mail, Messenger, Calendar
    and other projects. Working on a much larger project with a much larger team was
    a great experience. A small team of prototypes worked to build out all of the
    HTML and CSS for multiple teams of engineers.'
  - '[PAGE 160]


    It was the largest-scale project I had worked on in many aspects:


    +   - Yahoo’s user base is massive. Mail alone has about 300 million users.

    - Hundreds of people spread across multiple teams were working with the HTML and
    CSS.

    - We were developing a system of components to work across multiple projects.


    It was during my time at Yahoo that I began to really examine how I and the team
    at Yahoo build websites. What pain points did we keep running into, and how could
    we avoid them?


    I looked to see what everyone else was doing. I looked at Nicole Sullivan’s Object-Oriented
    CSS, Jina Bolton’s presentation on “CSS Workflow” and Natalie Downe’s “Practical,
    Maintainable CSS,” to name just a few.


    I ended writing my thoughts as a long-form style guide named “Scalable and Modular
    Architecture for CSS.” That sounds wordy, so you can just call it SMACS (pronounced
    “smacks”) for short. It’s a guide that continues to evolve as I refine and expand
    on ways to approach CSS development.


    As a result of this exploration, I noticed that designers (including me) traditionally
    write CSS that is deeply tied to the HTML that it is designed to style. How do
    we begin to decouple the two for more flexible development with less refactoring?


    In other words, how do we avoid throwing **important** at everything or falling
    into selector hell?'
  - "[PAGE 161]\n\n# Reusing Styles\n\nIn the old days, we wrapped font tags and applied\
    \ background attributes to every HTML element that needed styling. This was, of\
    \ course, very impractical, and thus CSS was born. CSS enabled us to reuse styles\
    \ from one part of the page on another.\n\nFor example, a navigation menu has\
    \ a list of items that all look the same. Repeating inline styles on each item\
    \ wouldn't be practical. As a result, we begin to see CSS like this:\n\n```\n\
    #nav {\n  margin: 0;\n  padding: 0;\n  list-style: none;\n}\n#nav li {\n  float:\
    \ left;\n}\n#nav li a {\n  display: block;\n  padding: 5px 10px;\n  background-color:\
    \ blue;\n}\n```\n\nSure beats adding float:left to every list item and display:block;\
    \ padding:5px to every link. Efficiency, for the win! Just looking at this, you\
    \ can see the HTML structure that is expected:\n\n```\n<ul id=\"nav\">\n  <li><a\
    \ href=\"/\">Home</a></li>\n  <li><a href=\"products\">Products</a></li>\n  <li><a\
    \ href=\"contact\">Contact Us</a></li>\n</ul>\n```"
  - "[PAGE 162]\n\nNow, the client comes back and says, “I want a drop-down menu to\
    \ appear when the user clicks on ‘Products.’ Give them easy access to each of\
    \ the pages!” As a result, our HTML changes.\n\n```\n<ul id=\"nav\">\n  <li><a\
    \ href=\"/\">Home</a></li>\n  <li><a href=\"/products\">Products\n    <ul>\n \
    \     <li><a href=\"/products/shoes\">Shoes</a></li>\n      <li><a href=\"/products/jackets\"\
    >Jackets</a></li>\n    </ul>\n  </li>\n  <li><a href=\"/contact\">Contact Us</a></li>\n\
    </ul>\n```\n\nWe have a list item within a list item, and links within it. Our\
    \ menu has a horizontal navigation when the client wants a vertical list, so we\
    \ add some rules to style the inner list to match what the client wants.\n\n```\n\
    #nav ul {\n  margin: 0;\n  padding: 0;\n  list-style:none;\n}\n#nav li {\n  float:\
    \ none;\n}\n#nav li li a {\n  padding: 2px;\n  background-color: red;\n}\n```\n\
    \nProblem solved! Sort of."
  - '[PAGE 163]


    # Reducing The Depth Of Applicability


    Probably the most common problem with CSS is managing specificity. Multiple CSS
    rules compete in styling a particular element on the page. With our menu, our
    initial rules were styling the list items and the links in the navigation and
    the menu. Not good.


    By adding more element selectors, we were able to increase specificity and have
    our menu styles win out over the navigation styles.


    However, this can become a game of cat and mouse as a project increases in complexity.
    Instead, we should be limiting the impact of CSS. Navigation styles should apply
    to and affect only the elements that pertain to it, and menu styles should apply
    to and affect only the elements that pertain to it.


    I refer to this impact in SMACS as the “depth of applicability." It''s the depth
    at which a particular rule set impacts the elements around it. For example, a
    style like #nav li a, when given an HTML structure that includes our menus, has
    a depth of 5: from the ul to the li to the ul to the li to the a.


    The deeper level of applicability, the more impact the styles can have on the
    HTML and the more tightly coupled the HTML is to the CSS.


    The goal of more manageable CSS — especially in larger projects — is to limit
    the depth of applicability. In other words, write CSS to affect only the elements
    that we want them to affect.'
  - "[PAGE 164]\n\n# CHILD SELECTORS\n\nOne tool for limiting the scope of CSS is\
    \ the child selector (>). If you no longer have to worry about Internet Explorer\
    \ 6 (and, thankfully, many of us don't), then the child selector should be a regular\
    \ part of your CSS diet.\n\nChild selectors limit the scope of selectors. Going\
    \ back to our navigation example, we can use the child selector to limit the scope\
    \ of the navigation so that it does not affect the menu.\n\n```\n#nav {\n  margin:\
    \ 0;\n  padding: 0;\n  list-style: none;\n}\n#nav > li {\n  float: left;\n}\n\
    #nav > li > a {\n  display: block;\n  padding: 5px 10px;\n  background-color:\
    \ blue;\n}\n```\n\nFor the menu, let's add a class name to it. This will make\
    \ it more descriptive and provide a base for the rest of our styles.\n\n```\n\
    .menu {\n  margin: 0;\n  padding: 0;\n  list-style: none;\n}\n.menu > li > a {\n\
    \  display: block;\n  padding: 2px;\n  background-color: red;\n}\n```"
  - "[PAGE 165]\n\nWhat we've done is limited the scope of our CSS and isolated two\
    \ visual patterns into separate blocks of CSS: one for our navigation list and\
    \ one for our menu list. We've taken a small step towards modularizing our code\
    \ and a step towards decoupling the HTML from the CSS.\n\n# Classifying Code\n\
    \nLimiting the depth of applicability helps to minimize the impact that a style\
    \ might have on a set of elements much deeper in the HTML. However, the other\
    \ problem is that as soon as we use an element selector in our CSS, we are depending\
    \ on that HTML structure never to change. In the case of our navigation and menu,\
    \ it's always a list with a bunch of list items, with a link inside each of those.\
    \ There's no flexibility to these modules.\n\nLet's look at an example of something\
    \ we see in many designs: a box with a heading and a box of content after it.\n\
    \n```\n<div class=\"box\">\n<h2>Sites I Like</h2>\n  <ul>\n    <li><a href=\"\
    http://smashingmagazine.com/\">Smashing Magazine</a></li>\n    <li><a href=\"\
    http://smacss.com/\">SMACSS</a></li>\n  </ul>\n</div>\nLet's give it some styles.\n\
    .box {\n  margin: 0;\n  padding: 5px 10px;\n  border-bottom: 1px solid #333;\n\
    \  background-color: #CCC;\n}\n.box h2 {\n```"
- md: "\n```css\n.box ul {\n    margin: 10px;\n}\n```\n\nThe client comes back and\
    \ says, \"That box is great, but can you add another one with a little blurb about\
    \ the website?\"\n\n```html\n<div class=\"box\">\n  <h2>About the Site</h2>\n\
    \  <p>This is my blog where I talk about only the bestest things in the whole\
    \ wide world.</p>\n</div\n```\n\nIn the previous example, a margin was given to\
    \ the list to make it line up with the heading above it. With the new code example,\
    \ we need to give it similar styling.\n\n```css\n.box ul, .box p {\n    margin:\
    \ 10px;\n}\n```\n\nThat'll do that the content never changes. However, the point\
    \ of this exercise is to recognize that websites can and do change. Therefore,\
    \ we have to be proactive and recognize that there are alternative elements we\
    \ might want to use.\n\nFor greater flexibility, let's use classes to define the\
    \ different parts of this module:\n\n```css\n.box .hd { } /* this is our box heading\
    \ */\n.box .bd { } /* this is our box body */\n```\n\nWhen applied to the HTML,\
    \ it looks like this:\n\n```html\n<div class=\"box\">\n  <h2 class=\"hd\">About\
    \ the Site</h2>\n  <p class=\"bd\">This is my blog where I talk about only the\
    \ bestest things in the whole wide world.</p></div>\n```\n\n# CLARIFYING INTENT\n\
    \nDifferent elements on the page could have a heading and a body. They’re “protected”\
    \ in that they’re a child selector of box. But this isn’t always evident when\
    \ we’re looking at the HTML. We should clarify that particular hd and bd classes\
    \ are for the box module.\n\nWith this improved naming convention, we don’t need\
    \ to combine the selectors anymore in an attempt to namespace our CSS. Our final\
    \ CSS looks like this:\n\n```css\n.box {\nborder: 1px solid #333;\n}\n.box-hd\
    \ {\nmargin: 0;\npadding: 5px 10px;\nborder-bottom: 1px solid #333;\nbackground-color:\
    \ #CCC;\n}\n.box-bd {\nmargin: 10px;\n}\n```\n\nThe bonus of this is that each\
    \ of these rules affects only a single element: the element that the class is\
    \ applied to. Our CSS is easier to read and easier to debug, and it’s clear what\
    \ belongs to what and what it does.\n\n# It’s All Coming Undone\n\nWe've just\
    \ seen two ways to decouple HTML from CSS:\n\n- 1. Using child selectors,\n- 2.\
    \ Using class selectors.\n\nIn addition, we've seen how naming conventions allow\
    \ for clearer, faster, simpler and more understandable code.\n\nThese are just\
    \ a couple of the concepts I cover in “Scalable and Modular Architecture for CSS,”\
    \ and I invite you to read more.\n\n# POSTSCRIPT\n\nIn addition to the resources\
    \ linked to above, you may wish to look into BEM, an alternative approach to and\
    \ framework for building maintainable CSS. Mark Otto has also been documenting\
    \ the development of Twitter Bootstrap, including the recent article “Stop the\
    \ Cascade,” which similarly discusses the need to limit the scope of styles.\n\
    \n# CSS Specificity And Inheritance\n\nInayili de Leon\n\nCSS’s barrier to entry\
    \ is extremely low, mainly due to the nature of its syntax. Being clear and easy\
    \ to understand, the syntax makes sense even to the inexperienced Web designer.\
    \ It's so simple, in fact, that you could style a simple CSS-based website within\
    \ a few hours of learning.\n\nBut this apparent simplicity is deceitful. If after\
    \ a few hours of work, your perfectly crafted website looks great in Safari, all\
    \ might break loose if you haven't taken the necessary measures to make it work\
    \ in Internet Explorer. In a panic, you add hacks and filters where only a few\
    \ tweaks or a different approach might do. Knowing how to deal with these issues\
    \ comes with experience, with trial and error and with failing massively and then\
    \ learning the correct way.\n\nUnderstanding a few often overlooked concepts is\
    \ also important. The concepts may be hard to grasp and look boring at first,\
    \ understanding them and knowing how to take advantage of them is important.\n\
    \nTwo of these concepts are specificity and inheritance. Not common words among\
    \ Web designers, are they? Talking about border-radius and text-shadow is a lot\
    \ more fun; but specificity and inheritance are fundamental concepts that any\
    \ person who wants to be good at CSS understand. They will help you create clean,\
    \ maintainable and flexible style sheets. Let’s look at what they mean and how\
    \ they work.\n\nThe notion of a \"cascade\" is at the heart of CSS (just look\
    \ at its name). It ultimately determines which properties will modify a given\
    \ element. The cascade is tied to three main concepts: importance, specificity\
    \ and source order. The cascade follows these three steps to determine which properties\
    \ to assign to an element. By the end of this process, the cascade has assigned\
    \ a weight to each rule, and this weight determines which rule takes precedence,\
    \ when more than one applies.\n\n# 1. Importance\n\nStyle sheets can have a few\
    \ different sources:\n\n- 1. **User agent**: For example, the browser's default\
    \ style sheet.\n- 2. **User**: Such as the user's browser options.\n- 3. **Author**:\
    \ This is the CSS provided by the page (whether inline, embedded or external)\n\
    \nBy default, this is the order in which the different sources are processed,\
    \ the author's rules will override those of the user.\n\nThe specificity of a\
    \ selector is the weight of a selector relative to other selectors. It is used\
    \ to determine which style is applied when multiple rules apply to the same element.\
    \ The rule with the highest specificity wins. If two rules have the same specificity,\
    \ the one that appears last in the CSS wins.\n\nThe specificity of a selector\
    \ is calculated as a triplet of numbers: (id, class, element).\n- id: The number\
    \ of IDs.\n- class: The number of classes, attributes, and pseudo-classes.\n-\
    \ element: The number of elements and pseudo-elements.\n\nFor example:\n- `p`\
    \ has a specificity of (0, 0, 1).\n- `.class` has a specificity of (0, 1, 0).\n\
    - `#id` has a specificity of (1, 0, 0).\n- `p.class` has a specificity of (0,\
    \ 1, 1).\n- `#id.class` has a specificity of (1, 1, 0).\n- `p[type=\"text\"]`\
    \ has a specificity of (0, 1, 1).\n\nThe `!important` declaration is used to override\
    \ the specificity of any rule. It should be used sparingly.\n\n# 2. Inheritance\n\
    \nInheritance is the mechanism by which certain properties are passed from parent\
    \ elements to their children. Not all properties are inherited. Most inherited\
    \ properties can be overridden. For example, `font-family` and `color` are inherited,\
    \ but `border` and `margin` are not.\n\nThe cascade is the process that determines\
    \ which CSS rules are applied to an element when multiple rules match. The cascade\
    \ follows an order of priority:\n1. Importance\n2. Specificity\n3. Source order\n\
    \nIf two rules have the same specificity and importance, the one that appears\
    \ later in the CSS wins.\n"
  mdcn: "\n\n```css\n.box ul {\n    margin: 10px;\n}\n```\n\n客户回来说了：“那个盒子太棒了，但你能再加一个吗？带上一点关于网站的简短介绍。”\n\
    \n```html\n<div class=\"box\">\n  <h2>关于网站</h2>\n  <p>这是我的博客，我在这里只谈论整个世界上最棒最棒的事情。</p>\n\
    </div>\n```\n\n在上一个示例中，为列表设置了外边距（margin），以便它与上方的标题对齐。在新的代码示例中，我们需要为它提供类似的样式。\n\
    \n```css\n.box ul, .box p {\n    margin: 10px;\n}\n```\n\n这样可以确保内容永远改变。然而，这次练习的意义在于意识到网站可以并且确实会发生变化。因此，我们必须主动，并意识到我们可能想要使用的替代元素。\n\
    \n为了获得更大的灵活性，让我们使用类（classes）来定义此模块的不同部分：\n\n```css\n.box .hd { } /* 这是我们盒子的标题\
    \ */\n.box .bd { } /* 这是我们盒子的主体 */\n```\n\n当应用于 HTML 时，它看起来如下：\n\n```html\n<div\
    \ class=\"box\">\n  <h2 class=\"hd\">关于网站</h2>\n  <p class=\"bd\">这是我的博客，我在这里只谈论整个世界上最棒最棒的事情。</p></div\n\
    ```\n\n# 明确意图\n\n页面上的不同元素可以有标题和正文。它们被“保护”着，因为它们是 `box` 的子选择器。但在查看 HTML 时，这并不总是显而易见的。我们应该明确特定的\
    \ `hd` 和 `bd` 类是用于盒子模块的。\n\n通过这种改进的命名规范，我们不再需要通过组合选择器来尝试为 CSS 命名空间。我们最终的 CSS 看起来如下：\n\
    \n```css\n.box {\nborder: 1px solid #333;\n}\n.box-hd {\nmargin: 0;\npadding:\
    \ 5px 10px;\nborder-bottom: 1px solid #333;\nbackground-color: #CCC;\n}\n.box-bd\
    \ {\nmargin: 10px;\n}\n```\n\n这样做的好处是，这些规则中的每一个都只影响单个元素：即应用了该类的元素。我们的 CSS 更容易阅读，也更容易调试，并且清楚什么属于什么，以及它们起什么作用。\n\
    \n# 一切都在崩解\n\n我们刚刚看到了两种将 HTML 与 CSS 解耦的方法：\n\n- 1. 使用子选择器，\n- 2. 使用类选择器。\n\n此外，我们还看到了命名规范如何实现更清晰、更快速、更简单且易理解的代码。\n\
    \n这些只是我在《CSS 的可扩展和模块化架构》中涵盖的几个概念，我邀请你阅读更多。\n\n# 后记\n\n除了上述链接的资源外，你可能还想研究 BEM，这是一种构建可维护\
    \ CSS 的替代方法和框架。Mark Otto 还在记录 Twitter Bootstrap 的开发过程，包括最近的文章《停止级联》（Stop the Cascade），该文章同样讨论了限制样式范围的必要性。\n\
    \n# CSS 权重与继承\n\nInayili de Leon\n\nCSS 的入门门槛极低，主要归功于其语法的性质。由于清晰且易懂，这种语法对于没有经验的\
    \ Web 设计师来说也是合理的。事实上，它是如此简单，以至于你在学习几小时后就能为一个简单的基于 CSS 的网站设置样式。\n\n但这种表面上的简单是欺骗性的。如果在工作几小时后，你精心设计的网站在\
    \ Safari 中看起来很棒，但如果你没有采取必要的措施让它在 Internet Explorer 中运行，那么一切可能会崩溃。在恐慌中，你添加了黑科技（hacks）和过滤器（filters），而实际上只需要一些微调或一种不同的方法就能解决。知道如何处理这些问题需要经验、试错，以及在经历过性失败后学习正确的方法。\n\
    \n理解一些经常被忽视的概念同样重要。这些概念起初可能难以掌握且看起来很无聊，但理解它们并知道如何利用它们是非常重要的。\n\n其中两个概念是权重（specificity）和继承（inheritance）。这些在\
    \ Web 设计师之间来说不是常用词汇，对吧？讨论圆角（border-radius）和文本阴影（text-shadow）要有趣得多；但权重和继承是任何想要精通\
    \ CSS 的人必须理解的基础概念。它们将帮助你创建干净、可维护且灵活的样式表。让我们看看它们意味着什么以及如何工作。\n\n“级联”（cascade）的概念是\
    \ CSS 的核心（看它的名字就知道）。它最终决定了哪些属性将修改给定的元素。级联与三个主要概念相关：优先级（importance）、权重（specificity）和源顺序（source\
    \ order）。级联遵循这三个步骤来确定为元素分配哪些属性。在这个过程结束时，级联已为每个规则分配了权重，这个权重决定了当有多个规则适用时哪个规则优先。\n\
    \n# 1. 优先级\n\n样式表可以有几个不同的来源：\n\n- 1. **用户代理（User agent）**：例如浏览器的默认样式表。\n- 2. **用户（User）**：例如用户的选项。\n\
    - 3. **作者（Author）**：页面提供的 CSS（无论是内联、嵌入还是外部）\n\n默认情况下，这是不同来源处理的顺序，作者的规则将覆盖用户的规则。\n\
    \n选择器的权重（specificity）是选择器相对于其他选择器的权重。它用于确定当多个规则应用于同一个元素时应用哪种样式。权重最高的规则获胜。如果两个规则权重相同，则出现在\
    \ CSS 中位置的规则获胜。\n\n选择器的权重计算为一组三元组：(id, class, element)。\n- id: ID 的数量。\n- class:\
    \ 类、属性和伪类的数量。\n- element: 元素和伪元素的数量。\n\n例如：\n- `p` 的权重为 (0, 0, 1)。\n- `.class`\
    \ 的权重为 (0, 1, 0)。\n- `#id` 的权重为 (1, 0, 0)。\n- `p.class` 的权重为 (0, 1, 1)。\n- `#id.class`\
    \ 的权重为 (1, 1, 0)。\n- `p[type=\"text\"]` 的权重为 (0, 1, 1)。\n\n`!important` 声明用于覆盖任何规则的权重。它应该谨慎使用。\n\
    \n# 2. 继承\n\n继承（inheritance）是将某些属性从父元素传递给子元素的机制。并不是所有属性都是继承的。大多数继承属性都可以被覆盖。例如，`font-family`\
    \ 和 `color` 是继承的，但 `border` 和 `margin` 则不是。\n\n"
