    # Conclusion


    Stacking contexts in CSS are a complex topic. This article did not attempt to
    discuss every detail on that topic, but instead has attempted to provide a solid
    discussion of how a web page’s stacking contexts are affected by z-index, which,
    when fully understood, becomes a powerful CSS property.


    Beginning developers should now have a good understanding of this property and
    avoid some of the common problems that arise when trying to implement it. Additionally,
    advanced developers should have a stronger understanding of how proper use of
    z-index can provide solutions to countless layout issues and open doors to a number
    of creative possibilities in CSS design.


    # CSS Sprites: Useful Techniques, Or Potential Nuisance?


    Louis Lazaridis


    Ah, the ubiquitous CSS sprites — one of the few web design techniques that was
    able to bypass "trend" status almost instantly, planting itself firmly into the
    category of best practice CSS. Although it didn''t really take off until well
    after A Apart established and endorsed it, it was discussed as a CSS solution
    as early as July 2003 by Petr Staník.


    Most web developers today have a fairly strong grasp of this technique, and there
    have been countless tutorials and articles written on it. In almost every one
    of those tutorials, the claim is made that designers and developers should be
    implementing CSS sprites in order to minimize HTTP requests and save valuable
    kilobytes. This technique has been taken so far that many sites, including Amazon,
    now use mega sprites.


    Is this much-discussed benefit really worthwhile? Are designers jumping on the
    CSS sprite bandwagon without a careful consideration of all the factors? In this
    article, I''m going to discuss some of the pros and cons of using CSS sprites,
    focusing particularly on the use of "mega" sprites, and why such use of sprites
    could in many cases be a waste of time.


    # Browsers Cache All Images


    One of the benefits given by proponents of the sprite method is the load time
    of the images (or in the case of mega sprites, the single image). It’s argued
    that a single GIF image comprising all the necessary image states will be significantly
    lower in file size than the equivalent images all sliced up. This is true. A single
    GIF image has only one color table associated with it, whereas each image in the
    sliced GIF method will have its own color table, adding up the kilobytes. Likewise,
    a single JPEG or PNG sprite will likely save on file size over the same image
    sliced-up into multiple images. But is this really such a significant benefit?


    By default, image-based browsers will cache all images — whether the images are
    sprites or not. So, while it is certainly true that bandwidth will be saved with
    the sprite technique, this only occurs on the initial page load, and the caching
    will extend to secondary pages that use the same image URLs.

