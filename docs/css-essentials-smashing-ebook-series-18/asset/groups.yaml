    \ and dotted border:\n\n```\ninput:disabled {\n  border:1px dotted #999;\n  background:#F2F2F2;\n\
    }\n```\n\nYou can also say that all checkboxes that are checked should have a\
    \ left margin (to be easily seen within a long list of checkboxes):"
  - "[PAGE 247]\n\n```\ninput[type=\"checkbox\"]:checked {\n  margin-left: 15px;\n\
    }\n```\n\n# Notes on browser support\n\nAll major browsers, except our usual suspect,\
    \ Internet Explorer, support the UI element states pseudo-classes. If you consider\
    \ that you are only adding an extra level of detail and improved usability to\
    \ your visitors, this can still be an option.\n\n# 6. CSS 3 structural pseudo-classes\n\
    \n# :NTH-CHILD\n\nThe :nth-child() pseudo-class allows you to target one or more\
    \ specific children of a parent element.\n\nYou can target a single child, by\
    \ defining its value as an integer:\n\n```\nul li:nth-child(3) {\n  color: red;\n\
    }\n```\n\nThis will turn the text on the third li item within the ul element red.\
    \ Bear mind that if a different element is inside the ul (not a li), it will also\
    \ be counted as its child.\n\nYou can target a parent's children using expressions.\
    \ For example, the following expression will match every li element starting from\
    \ the fourth:\n\n```\nul li:nth-child(3n+4) {\n  color: yellow;\n}\n```"
  - "[PAGE 248]\n\nIn the previous case, the first yellow **li** element will be the\
    \ fourth. If you just want to start counting from the first **li** element, you\
    \ can use a simpler expression:\n\n```\nul li:nth-child(3n) {\n  color: yellow;\n\
    }\n```\n\nIn this case, the first yellow **li** element will be the third, and\
    \ every other third after it. Now imagine you want to target only the first four\
    \ **li** elements within the list:\n\n```\nul li:nth-child(-n+4) {\n  color: green;\n\
    }\n```\n\nThe value of :nth-child can also be defined as \"even\" or \"odd\",\
    \ which are the same as using \"2n\" (every second child) or \"2n+1\" (every second\
    \ child starting from the first), respectively.\n\n# :NT-LAST-CHILD\n\nThe :nth-last-child\
    \ pseudo-class works basically as the :nth-child pseudo-class, but it starts counting\
    \ the elements from the last one.\n\nUsing one of the examples above:\n\n```\n\
    ul li:nth-child(-n+4) {\n  color: green;\n}\n```\n\nInstead of matching the first\
    \ four **li** elements in the list, this selector will match the /last four elements."
  - "[PAGE 249]\n\nYou can also use the values “even” or “odd”, with the difference\
    \ that in this case they will count the children starting from the last one:\n\
    \n```\nul li:nth-last-child(odd) {\n  color: grey;\n}\n```\n\n# :NTH-OF-TYPE\n\
    \nThe **nth-of-type** pseudo-class works just like the **nth-child**, with the\
    \ difference that it only counts children that match the element in the selector.\n\
    \nThis can be very useful if we want to target elements that may contain different\
    \ elements within them. For example, let’s imagine we want to turn every second\
    \ paragraph in a block of blue text, but we want to ignore other elements such\
    \ as images or quotations:\n\n```\np:nth-of-type(even) {\n  color: blue;\n}\n\
    ```\n\nYou can use the same values as you would use for the **nth-child** pseudo-class.\n\
    \n# :NTH-LAST-OF-TYPE\n\nYou guessed it! The **nth-last-of-type** pseudo-class\
    \ can be used exactly like the aforementioned **nth-last-child**, but this time,\
    \ it will only target the elements that match our selector:\n\n```\nul li:nth-last-of-type(-n+4)\
    \ {\n  color: green;\n}\n```"
  - "[PAGE 250]\n\nWe can be even more clever, and combine more than one of these\
    \ pseudo-classes together on a massive selector. Let's say all images within a\
    \ post div to be floated left, except for the first and last one (let's image\
    \ these full width, so they shouldn't be floated):\n\n```\n.post img:nth-of-type(n+2):nth-last-of-type(n+2)\
    \ {\n  float: left;\n}\n```\n\nSo in the first part of this selector, we are targeting\
    \ every image starting from the second one. In the second part, we are targeting\
    \ every image except for the last one. Because the selectors aren't mutually exclusive,\
    \ we can use them both on one selector thus excluding both the first and last\
    \ element at once!\n\n# :LAST-CHILD\n\nThe :last-child pseudo-class works just\
    \ as the :first-child pseudo-class, but instead targets the last child of a parent\
    \ element.\n\nLet's image you don't want the last paragraph within your post div\
    \ to have a bottom margin:\n\n```\n.post > p:last-child {\n  margin-bottom: 0;\n\
    }\n```\n\nThis selector will target the last paragraph that is a direct and the\
    \ last child of an element with the class of “post”.\n\n# :FIRST-OF-TYPE AND :LAST-OF-TYPE\n\
    \nThe :first-of-type pseudo-class is used to target an element that is the first\
    \ of its type within its parent."
- md: "\nFor example, you can target the first paragraph that is a direct child of\
    \ a particular **div**, and capitalize its first line:\n\n```\n.post > p:first-of-type:first-line\
    \ {\n  font-variant: small-caps;\n}\n```\n\nWith this selector you make sure that\
    \ you are targeting only paragraphs that are direct children of the “post” **div**,\
    \ and that are the first to match our **p** element.\n\nThe: **last-of-type**\
    \ pseudo-class works exactly the same, but targets the **last** child of its type\
    \ instead.\n\n## :ONLY-CHILD\n\nThe **only-child** pseudo-class represents an\
    \ element that is the only child of its parent.\n\nLet’s say you have several\
    \ boxes (“news”) with paragraphs of text inside them. When you have more than\
    \ one paragraph, you want the text to be smaller than when you have only one:\n\
    \n```\ndiv.news > p {\n  font-size: 1.2em;\n}\ndiv.news > p:only-child {\n  font-size:\
    \ 1.5em;\n}\n```\n\nIn the first selector, we are defining the overall size of\
    \ the **p** elements that are direct children of a “news” **div**. On the second\
    \ one, we are overriding the previous font-size by saying, if the **p** element\
    \ is the only child of the “news” **div**, its font size should be bigger.\n\n\
    ## :ONLY-TYPE\n\nThe **only-of-type** pseudo-class represents an element that\
    \ is the only child of its parent with the same element.\n\nHow can this be useful?\
    \ Imagine you have a sequence of posts, each one represented by a **div** with\
    \ the class of “post”. Some of them have more than one image, but others have\
    \ only one. You want the image within the later ones to be aligned to the center,\
    \ while the images on posts with more than one image to be floated. That would\
    \ be quite easy to accomplish with this selector:\n\n```\n.post > img {\n  float:\
    \ left;\n}\n.post > img:only-of-type {\n  float: none;\n  margin: auto;\n}\n```\n\
    \n## :EMPTY\n\nThe **empty** pseudo-class represents an element that has no content\
    \ within it.\n\nIt can be useful in a number of ways. For example, if you have\
    \ multiple boxes in your “sidebar” **div**, but don't want the empty ones to appear\
    \ on the page:\n\n```\n#sidebar .box:empty {\n  display: none;\n}\n```\n\nBeware\
    \ that even if there is a single space in the “box” **div**, it will not be treated\
    \ as empty by the CSS, and therefore will not match the selector.\n\n## Notes\
    \ on browser support\n\nInternet Explorer (up until version 8) has no support\
    \ for structural pseudo-classes. Firefox, Safari and Opera support these pseudo-classes\
    \ on their latest releases. This means that if what's being accomplished with\
    \ these selectors is fundamental for the website’s usability and accessibility,\
    \ or if the larger part of the website’s audience is using IE and you don't want\
    \ to deprive them of some design details, it is better to keep using classes and\
    \ simpler selectors to cater for those browsers. If not, you can just go crazy!\n\
    \n## 7. The negation pseudo-class\n\nThe negation pseudo-class, :not(), lets you\
    \ target elements that do not match the selector that is represented by its argument.\n\
    \nFor example, this can be useful if you need to style the input elements within\
    \ a form, but you don't want your input elements with the type submit to be styled\
    \ — you want them to be styled in a different way —, to look more like buttons:\n\
    \nAnother example: you want all the paragraphs within your div to have a larger\
    \ font-size, except for the one that indicates the time and date:\n\n```\n.post\
    \ p:not(.date) {\n  font-size: 13px;\n}\n```\n\nCan you imagine the number of\
    \ possibilities this selector brings with it, and the amount of useless selectors\
    \ you could strip out of your CSS files were widely supported?\n\n## Notes on\
    \ browser support\n\nInternet Explorer is our usual party pooper here: no support\
    \ at all, not even on IE8. This probably means that this selector will still have\
    \ to wait a while before some developers lose the fear of adding them to their\
    \ stylesheets.\n\n## 8. Pseudo-elements\n\nPseudo-elements allow you to access\
    \ elements that don’t actually exist in the HTML, like the first line of a text\
    \ block or its first letter.\n\nPseudo-elements exist in CSS 2.1, but the CSS\
    \ 3 specifications state that they should be used with the double colon “::”,\
    \ to distinguish them from pseudoclasses. In CSS 2.1, they are used with only\
    \ one colon, \":\". Browsers should be able to accept both formats, except in\
    \ the case of pseudo-elements may be introduced only in CSS 3.\n\n## ::FIRST-LINE\n\
    \nThe ::first-line pseudo-element will match the first line of a block, inline-block,\
    \ table-caption or table-cell element.\n\nThis is particularly useful to add subtle\
    \ typographical details to your text blocks, like, for example, transforming the\
    \ first line of an article into small caps:\n\n```\nh1 + p::first-line {\n  font-variant:\
    \ small-caps;\n}\n```\n\nIf you've been paying attention, you'll know that this\
    \ means the paragraph that comes immediately after an h1 tag (“+”) should have\
    \ its first line in small caps.\n\nYou could also refer to the first line of a\
    \ particular div, without having to refer to the actual paragraph:\n\n```\ndiv::first-line\
    \ {\n  font-variant: small-caps;\n}\n```\n\nOr go one step farther,\n```css\n\
    div > p::first-line {\n  font-variant: small-caps;\n}\n```\nThe \">\" symbol indicates\
    \ that you are targeting the direct child.\n\n## ::FIRST-LETTER\n\nThe ::first-letter\
    \ pseudo-element will match the first letter of a block, inline-block, table-caption\
    \ or table-cell element.\n\nThis is particularly useful to add subtle typographical\
    \ details to your text blocks, like, for example, transforming the first line\
    \ of an article into small caps:\n\nThe ::first-letter pseudo-element will match\
    \ the first letter of a block, inline-block, table-caption or table-cell element.\n\
    \nThis is particularly useful to add subtle typographical details to your text\
    \ blocks, like, for example, transforming the first line of an article into small\
    \ caps:\n\nThe ::first-letter pseudo-element will match the first letter of a\
    \ block, inline-block, table-caption or table-cell element.\n\nThis is particularly\
    \ useful to add subtle typographical details to your text blocks, like, for example,\
    \ transforming the first line of an article into small caps:\n\n```css\np::first-letter\
    \ {\n  font-size: 200%;\n  float: left;\n  margin-right: 5px;\n}\n```\n\n## ::BEFORE\
    \ AND AFTER\n\nThe ::before and ::after pseudo-elements are used to insert content\
    \ before or after an element, purely via CSS.\n\nImagine you want to add the words\
    \ \"Figure number:\" before the descriptions of graphs.\n\n```css\n.post {\n \
    \ counter-reset: image;\n}\np.description::before {\n  content: \"Figure number\
    \ \" counter(image) \": \";\n  counter-increment: image;\n}\n```\n"
  mdcn: "\n例如，你可以针对特定 **div** 的直接子元素第一个段，并将其第一行设置为小型大写字母：\n\n```\n.post > p:first-of-type:first-line\
    \ {\n  font-variant: small-caps;\n}\n```\n\n通过这个选择器，你可以确保只针对是“post” **div** 的直接子元素，且是第一个匹配我们的\
    \ **p** 元素的段落进行操作。\n\n**:last-of-type** 伪类的工作方式完全相同，但它针对的是同类型的**最后一个**子元素。\n\n\
    ## :ONLY-CHILD\n\n**only-child** 伪类表示它是其父元素唯一子元素的元素。\n\n假设你有几个盒子（“news”），里面包含段落文本。当一个盒子内有多个段落时，你希望字体比比只有一个段落时要小一些：\n\
    \n```\ndiv.news > p {\n  font-size: 1.2em;\n}\ndiv.news > p:only-child {\n  font-size:\
    \ 1.5em;\n}\n```\n\n在第一个选择器中，我们定义了作为“news” **div** 直接子元素的 **p** 元素的整体大小。在第二个选择器中，我们通过这种方式覆盖之前的字体大小：如果\
    \ **p** 元素是“news” **div** 的唯一子元素，它的字体应该更大。\n\n## :ONLY-TYPE\n\n**only-of-type**\
    \ 伪类表示它是其父元素中同类型的唯一子元素。\n\n这有什么用呢？假设你有一系列文章，每个文章由一个类为“post”的 **div** 表示。其中某些文章包含多张图片，而另一些只有一张。你希望后期文章中的图片居中对齐，而包含多图片的文章中的图片则浮动。使用这个选择器可以很容易地实现：\n\
    \n```\n.post > img {\n  float: left;\n}\n.post > img:only-of-type {\n  float:\
    \ none;\n  margin: auto;\n}\n```\n\n## :EMPTY\n\n**empty** 伪类表示一个内部没有内容的元素。\n\n\
    它可以在很多方面发挥作用。例如，如果你在“sidebar” **div** 中有多个盒子，但你不希望空盒子出现在页面上：\n\n```\n#sidebar\
    \ .box:empty {\n  display: none;\n}\n```\n\n注意，即使“box” **div** 中只有一个空格，CSS 也不会将其视为为空，因此不会匹配该选择器。\n\
    \n## 关于浏览器支持的说明\n\nInternet Explorer（版本 8 及之前的版本）不支持结构化伪类。Firefox、Safari 和 Opera\
    \ 在其最新版本中支持这些伪类。这意味着，如果这些选择器实现的功能对于网站的可用性和可访问性至关重要，或者网站的大部分用户在使用 IE 而你不想剥夺他们某些设计细节，那么继续使用类（classes）和更简单的选择器来适配这些浏览器会更好。否则，你尽管尽情发挥吧！\n\
    \n## 7. 否定伪类\n\n否定伪类 `:not()` 允许你针对不匹配其参数所代表的选择器的元素。\n\n例如，如果你需要为表单内的输入元素设置样式，但你不希望对类型为\
    \ `submit` 的输入元素设置样式——你希望它们以不同的方式进行样式化，使其看起来更像按钮——这就会非常有用：\n\n另一个例子：你希望 div 内部的所有段落都具有较大的字体，但指示时间和日期的那一个除外：\n\
    \n```\n.post p:not(.date) {\n  font-size: 13px;\n}\n```\n\n你能想象这个选择器带来了多少种可能性，以及如果这些选择器被广泛支持，你可以从\
    \ CSS 文件中剔除掉多少无用的选择器吗？\n\n## 关于浏览器支持的说明\n\nInternet Explorer 是我们这这里的常见扫兴者：完全不支持，甚至在\
    \ IE8 上也不支持。这可能意味着这个选择器还需要等一段时间，一些开发者才会消除对将它们添加到样式表中的恐惧。\n\n## 8. 伪元素\n\n伪元素允许你访问\
    \ HTML 中实际上并不存在的元素，例如文本块的第一行或其第一个字母。\n\n伪元素存在于 CSS 2.1 中，但 CSS 3 规范规定应使用双冒号“::”，以将它们与伪类（pseudoclasses）区分开。在\
    \ CSS 2.1 中，它们仅使用单冒号\":\"”。浏览器应该能够接受两种格式，但仅在 CSS 3 中引入的伪元素除外。\n\n## ::FIRST-LINE\n\
    \n::first-line 伪元素将匹配块、行内块（inline-block）、表格标题（table-caption）或表格单元格（table-cell）元素的第一行。\n\
    \n这对于为你的文本块添加细微的排版细节特别有用，例如，将文章的第一行转换为小型大写字母：\n\n```\nh1 + p::first-line {\n \
    \ font-variant: small-caps;\n}\n```\n\n如果你一直很关注，就会这意味着紧跟在 h1 标签之后的段落（“+”）的第一行应该是小型大写字母。\n\
    \n你也可以引用特定 div 的第一行，而无需引用实际段落：\n\n```\ndiv::first-line {\n  font-variant: small-caps;\n\
    }\n```\n\n或者更进一步，\n```css\ndiv > p::first-line {\n  font-variant: small-caps;\n\
    }\n```\n\">\" 符号表示你正在针对直接子元素。\n\n## ::FIRST-LETTER\n\n::first-letter 伪元素将匹配块、行内块、表格标题或表格单元格元素的第一个字母。\n\
    \n这对于为你的文本块添加细微的排版细节特别有用，例如，将文章的第一行转换为小型大写字母：\n\n::first-letter 伪元素将匹配块、行内块、表格标题或表格单元格元素的第一个字母。\n\
    \n这对于为你的文本块添加细微的排版细节特别有用，例如，将文章的第一行转换为小型大写字母：\n\n::first-letter 伪元素将匹配块、行内块、表格标题或表格单元格元素的第一个字母。\n\
    \n这对于为你的文本块添加细微的排版细节特别有用，例如，将文章的第一行转换为小型大写字母：\n\n```css\np::first-letter {\n \
    \ font-size: 200%;\n  float: left;\n  margin-right: 5px;\n}\n```\n\n## ::BEFORE\
    \ AND AFTER\n\n::before 和 ::after 伪元素用于通过纯 CSS 在元素之前或之后插入内容。\n\n假设你想在图表的描述之前插入“Figure\
    \ number:”字样。\n\n```css\n.post {\n  counter-reset: image;\n}\np.description::before\
    \ {\n  content: \"Figure number \" counter(image) \": \";\n  counter-increment:\
    \ image;\n}\n```\n"
