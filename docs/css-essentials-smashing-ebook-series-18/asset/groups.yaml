    \ 10px;\n  margin-bottom: 1em;\n}\n```\n\nPlease note that the comments above\
    \ are not intended to go into your CSS file, but are just to illustrate my point\
    \ in the article.\n\n# Ordering CSS Files\n\nOrdering CSS files is always tricky,\
    \ and there is no right or wrong way. A good idea, though, is to section the code\
    \ into defined groups, with headings, as well as a table of contents at the top\
    \ of the file. Something like this:\n\n```css\n/*--------------------------------------*/\n\
    /* CONTENTS\n/*--------------------------------------**/\n/*\nMAIN\nTYPE\nIMAGES\n\
    TABLES\nMISC\nRESPONSIVE\n*/\n/*--------------------------------------*/\n```\n\
    \n```css\n$MAIN\n/*--------------------------------------*/\nhtml {\n  styles\n\
    }\nbody {\n  styles\n/*--------------------------------------*/\n$TYPE\n/*--------------------------------------*/\n\
    ```\n\nAnd so on.\n\nThis way, you can easily read the contents and jump straight\
    \ to a particular section by performing a quick search (Command/Control + F).\
    \ Prepending each heading with a dollar sign makes it unique, so that a search\
    \ will yield only headings.\n\n# THE “SHARED” SECTION\n\nAll CSS files have a\
    \ section for sharing, where you tether selectors to a single declaration, rather\
    \ than write the same declaration over and over.\n\nSo, instead of writing this...\n\
    \n```css\n/*--------------------------------------*/\n$TYPE\n/*--------------------------------------*/\n\
    h1 {\n  font-size: 2em;\n  color: #c00;\n}\nh2 {\n  font-size: 1.5em;\n  color:\
    \ #c00;\n}\n```\n\n```css\n}\na {\n  color: #c00;\n  font-weight: bold;\n}\n#tagline\
    \ {\n  font-style: italic;\n  color: #c00;\n}\n```\n\n... you would write this:\n\
    \n```css\n/*------------------------------------*\n$TYPE\n*/------------------------------------*/\n\
    h1 {\n  font-size: 2em;\n}\nh2 {\n  font-size: 1.5em;\n}\na {\n  font-weight:\
    \ bold;\n}\n#tagline {\n  font-style: italic;\n}\n/*------------------------------------*\n\
    $SHARED\n*/------------------------------------*/\nh1, h2, a, #tagline {\n  color:#c00;\n\
