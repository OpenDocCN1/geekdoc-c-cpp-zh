    # Modern CSS Layouts: The Essential Characteristics


    Zoe Mickley Gillenwater


    Now is an exciting time to be creating CSS layouts. After years of what felt like
    the same old techniques for the same old browsers, we’re finally seeing browsers
    implement CSS 3, HTML 5 and other technologies that give us cool new tools and
    tricks for our designs.


    But all of this change can be stressful, too. How do you keep up with all of the
    new techniques and make sure your Web pages look great on the increasing number
    of browsers and devices out there? In part 1 of this article, you''ll learn the
    five essential characteristics of successful modern websites. In part 2 of this
    article, you''ll learn about the techniques and tools that you need to achieve
    these characteristics.


    We won''t talk about design trends and styles that characterize modern CSSbased
    layouts. These styles are always changing. Instead, we''ll focus on the broad
    underlying concepts that you need to know to create the most successful CSS layouts
    using the latest techniques. For instance, separating content and presentation
    is still a fundamental concept of CSS Web pages. But other characteristics of
    modern CSS Web pages are new or more important than ever. A modern CSS-based website
    is: progressively enhanced, adaptive to diverse users, modular, efficient and
    typographically rich.


    +   * Progressively enhanced,

    * Adaptive to diverse users,'
  - '[PAGE 95]


    +   - Modular,


    +   - Efficient,


    +   - Typographically rich.


    # # Progressive Enhancement


    Progressive enhancement means creating a solid page with appropriate markup for
    content and adding advanced styling (and perhaps scripting) to the page for browsers
    that can handle it. It results in web pages that are usable by all browsers but
    do not look identical in all browsers. Users of newer, more advanced browsers
    get to see more cool visual effects and nice usability enhancements.


    The idea of allowing a design to look different in different browsers is not new.
    CSS gurus have been preaching this for years because font availability and rendering,
    color, pixel calculations and other technical factors always varied between browsers
    and platforms. Most Web designers avoid "pixel perfection" and have accepted the
    idea of designs looking slightly different in different browsers. But progressive
    enhancement, which has grown in popularity over the past few years, takes a step
    further. Designs that are progressively enhanced may look more than slightly different
    in different browsers; they might very different.


    For example, the tweetCC website has a number of CSS 3 properties that add attractive
    visual touches, like drop-shadows behind text, multiple columns of text and different-colored
    background "images" (without there having to be actually different images). These
    effects are seen to various extents in different browsers, with old browsers like
    IE 6 looking the "plainest." However, even in IE 6, the text is perfectly readable,
    and the design is perfectly usable.'
