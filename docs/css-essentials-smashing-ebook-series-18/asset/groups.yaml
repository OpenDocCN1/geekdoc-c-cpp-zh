    \ face is aligned as it would be if it was set to right center.\n\n## Background\
    \ attachment\n\nThe **background-attachment** property determines what happens\
    \ to an image when the user scrolls the page. The three available properties are\
    \ **scroll**, **fixed** and **inherit**. *Inherit* simply tells the element to\
    \ follow the **background-attachment** property of its parent.\n\nTo understand\
    \ **background-attachment** properly, we need to first think of how the page and\
    \ view port interact. The view port is the section of your browser that displays\
    \ the Web page (think of it like your browser without all the toolbars). The view\
    \ port is set in its position and never moves.\n\nWhen you scroll down a Web page,\
    \ the view port does not move. Instead, the content of the page scrolls upward.\
    \ This makes it seem as if the view port is scrolling down the page. Now, when\
    \ we set background-attachment:scroll; we are telling the background that when\
    \ the element scrolls, the background must scroll with it. In simpler terms, the\
    \ background sticks to the element. This is the default setting for **background-attachment**.\n\
    \nLet's see an example to make it clearer:\n\n```\nbackground-image: url(test-image.jpg);\n\
    background-position: 0 0;\nbackground-repeat: no-repeat;\nbackground-attachment:\
    \ scroll;\n```\n\n![](img/736c504465a39c9f3caa50d5252a3998_13_0.png)\n\nAs we\
    \ scroll down the page, the background scrolls up until it disappears.\n\nBut\
    \ when we set the **background-attachment to fixed**, we are telling the browser\
    \ that when the user scrolls down the page, the background should stay fixed where\
    \ it is — i.e. not scroll with the content.\n\nLet's illustrate this with another\
    \ example:\n\n```\nbackground-image: url(test-image.jpg);\nbackground-position:\
    \ 0 100%;\nbackground-repeat: no-repeat;\nbackground-attachment: fixed;\n```\n\
    \n![](img/736c504465a39c9f3caa50d5252a3998_14_0.png)\n\nWe have scrolled down\
    \ the page here, but the image remains visible.\n\nThe important thing to note\
    \ however is that the background image only appears in areas where its parent\
    \ element reaches. Even though the image is positioned relative to the view port,\
    \ it will not appear if it’s parent element is not visible. This can be shown\
    \ with another example. In this one, we have aligned the image to the bottom-left\
    \ of the view port. But only the area of the image inside the element is visible.\n\
    \nSmashing eBook #18 | CSS Essentials | 15\n\n```\nbackground-image: url(test-image.jpg);\n\
    background-position: 0 100%;\nbackground-repeat: no-repeat;\nbackground-attachment:\
    \ fixed;\n```\n\n![](img/736c504465a39c9f3caa50d5252a3998_15_0.png)\n\nPart of\
    \ the image has been cut off because it begins outside of the element.\n\n## The\
    \ Background Shorthand Property\n\nInstead of writing out of these rules each\
    \ time, we can combine them into a single rule. It takes the following format:\n\
    \n```\nbackground: <color> <image> <position> <attachment> <repeat>\n```\n\nFor\
    \ example, the following rules...\n\n```\nbackground-color: transparent;\nbackground-image:\
    \ url(image.jpg);\nbackground-position: 50% 0\nbackground-attachment: scroll;\n\
    background-repeat: repeat-y;\n```\n\n... could be combined into the following\
    \ single line:\n\n```\nbackground: transparent url(image.jpg) 50% 0 scroll repeat-y;\n\
    ```\n\nAnd you don't have to specify every value. If you leave a property out,\
    \ its default value is used instead. For example, the line above has the same\
    \ output as:\n\n```\nbackground: url(image.jpg) 50% 0 repeat-y;\n```\n\n## Common\
    \ Uses Of Backgrounds\n\nAside from their obvious use of making elements more\
    \ attractive, backgrounds can be used for other purposes.\n\n## FAUX COLUMNS\n\
    \nWhen using the CSS property of float to position layout elements, ensuring that\
    \ two (or more) columns are the same length can be difficult. If the lengths are\
    \ different, then the background of one of the columns will be shorter than the\
    \ background of the other, spoiling your design.\n\nFaux columns is a very simple\
    \ background trick that was first written up on A List Apart. The idea is simple:\
    \ instead of applying a separate background for each column, apply one background\
    \ image to the parent element of the columns with that image containing the designs\
    \ for each column.\n\n## TEXT REPLACEMENT\n\nOur choice of fonts on the Web is\
    \ very limited. We could get custom fonts by using tools such as siFR, but they\
    \ require users to have JavaScript enabled. An easier solution that works on any\
    \ browser is to create an image of the text in the font you want and use it as\
    \ the background instead. This way, the text still appears in the markup for search\
    \ engines and screen readers, browsers will show your preferred font.\n\nFor example,\
    \ your HTML markup could look like this:\n\n```\n<h3 class=\"blogroll\">Blogroll</h3>\n\
    ```\n\nIf we have a 200 by 75 pixel image of this text in a nicer font, we could\
    \ display that instead using the CSS as follows:\n\n```\nh3.blogroll {\n  width:\
    \ 200px;\n  height: 75px; /* So that the element will show the whole\n  image.\
    \ **/\n  background:url(blogroll-text.jpg) 0 0 no-repeat; /* Sets\n  the background\
    \ image -99px; /*\n  text-indent: -9999px; /* Hides the regular text;\n}\n```\n\
    \n## EASIER BULLET POINTS\n\nBullet in an unordered list can look clunky. Instead\
    \ of dealing with all properties, we can simply replace them with an image. Here,\
    \ we turn an unordered list into:\n\n```\nul {\n  list-style: none; /* Removes\
    \ default bullets. */\n}\n\nul li {\n  padding-left: 40px; /* Indents list items,\
    \ leaving room for background. */\n  background: url(bulletpoint.jpg) 0 0 no-repeat;\n\
    }\n```\n\n## Backgrounds in CSS 3\n\nCSS 3 has many changes in store for backgrounds.\
    \ The most obvious is the option for multiple backgrounds, but it also comes with\
    \ four new properties as well.\n\n## MULTIPLE BACKGROUND IMAGES\n\nIn CSS 3, you\
    \ will be able to use more than one image.\n\n## BACKGROUND CLIP\n\nThis brings\
    \ us back to the issue discussed at the beginning of this article, about backgrounds\
    \ being shown beneath the border. This is described as the “background painting\
    \ area.”\n\nThe background-clip property was created to give you more control\
    \ over where backgrounds are. The possible values are:\n\n- **background-clip:\
    \ border-box;** backgrounds displayed beneath the border.\n- **background-clip:\
    \ padding-box;** backgrounds displayed beneath the padding, not the border.\n\
    - **background-clip: content-box;** backgrounds displayed only beneath content,\
    \ not border or padding.\n\n## BACKGROUND ORIGIN\n\nThis is used in conjunction\
    \ with **background-position**. You can have the **background-position** calculated\
    \ from the border, padding or content boxes (like **background-clip**).\n\n- **background-origin:\
    \ border-box;** background-position is calculated from the border.\n- **background-origin:\
    \ padding-box;** background-position is calculated from the padding box.\n- **background-origin:\
    \ content-box;** background-position is calculated from content.\n\n## BACKGROUND\
    \ SIZE\n\nThe **background-size** property is used to resize your background image.\
    \ There are a number of possible values:\n\n- **background-size: contain;** scales\
    \ down image to fit element (maintaining pixel aspect ratio).\n- **background-size:\
    \ cover;** expands image to fill element (maintaining pixel aspect ratio).\n-\
    \ **background-size: 100px 100px;** scales image to the sizes indicated.\n- **background-size:\
    \ 50% 100%;** scales image to the sizes indicated. Percentages are relative to\
    \ the size of containing element.\n\nYou can read up on some examples of special\
    \ cases on the CSS 3 specifications website.\n"
  mdcn: "\n这横跨了图片的 100% 宽度（即最右边缘）以及元素的 100% 宽度（记住，起点始终是左上角），并且这两线在那里对齐了。然后，它向下延伸了图片的\
