  mdcn: "\n\n## 新属性：背景断开 (BACKGROUND BREAK)\n\n在 CSS 3 中，元素可以被拆分为独立的盒子（例如，让内联元素跨越多行）。`background-atach-break`\
    \ 属性控制背景在不同盒子之间的显示方式。\n\n可能的值有：\n\n-   Background-break: continuous; 默认值。将盒子视为彼此之间没有空间（即它们都在同一个框中，背景图像应用到该框上）。\n\
    -   Background-break: bounding-box; 考虑盒子之间的空间。\n-   Background-break: each-box;\
    \ 独立处理元素中的每个盒子，并为每个盒子单独绘制背景。\n\n## 背景颜色的更改 (CHANGES TO BACKGROUND COLOR)\n\n`background-color`\
    \ 属性在 CSS 3 中有了微小的增强。除了指定背景颜色外，你还可以指定一个“回退颜色”（fall-back color），当元素的底层背景图像无法使用时将使用该颜色。\n\
    \n这是通过在回退颜色之前添加一个正斜杠实现的，如下：\n\n```\nbackground-color: green / blue;\n```\n\n在这个示例中，背景颜色将是绿色。然而，如果无法使用最底层的背景图像，则将显示蓝色而不是绿色。如果你在斜杠之前没有指定颜色，则假设它是透明的。\n\
    \n## 背景重复的更改 (CHANGES TO BACKGROUND REPEAT)\n\n在 CSS 2 中，当图像重复时，通常会在元素末尾被截断。CSS\
    \ 3 了两个新属性来修复这个问题：\n\n-   **space**: 在图像平铺之间应用等量的空间，直到它们填满元素。\n-   **round**:\
    \ 缩小图像，直到平铺适应元素。\n\nCSS 3 规范网站上提供了一个 **background-repeat: space;** 的示例。\n\n##\
    \ 背景附件的更改 (CHANGES TO BACKGROUND ATTACHMENT)\n\n**background-attachment** 有了一个新的可能的值：**local**。这适用于可以滚动的元素（即设置了\
    \ **overflow:scroll;** 的元素）。当 **background-attachment** 设置为 **scroll** 时，当元素内容滚动时，背景图像不会随之滚动。\n\
    \n现在使用 **background-attachment:local** 时，当元素内容滚动时，背景会随之滚动。\n\n## 结论 (Conclusion)\n\
    \n总而言之，关于 CSS 背景有很多需要了解的。但一旦你理解了它，这些技术和命名规范都会非常有道理，并且很快就会变成你的本能。\n\n如果你是 CSS 新手，只需继续练习，你很快就能掌握背景知识。如果你是一个老练专家，我希望你像我一样期待\
    \ CSS 3！\n\n## CSS 浮动属性的谜团 (The Mystery Of The CSS Float Property)\n\nLouis Lazaris\n\
    \n年前，当开发者开始过渡到不使用表格的 HTML 布局时，有一个 CSS 属性突然承担了非常重要的角色，那就是 **float** 属性。**float**\
    \ 属性变得如此常见的原因是因为默认情况下，块级元素不会以列的格式并排排列。由于列在几乎每个 CSS 布局中都是必需的，该属性开始被大量使用——甚至被过度使用。\n\
    \nCSS **float** 属性允许开发者在不使用表格的情况下在 HTML 布局中引入类似表格的列。如果没有 CSS **float** 属性，除了使用绝对定位和相对定位外，CSS\
    \ 布局将无法实现——这会让布局变得杂乱且无以维护。\n\n在这一章中，我们将详细讨论 **float** 属性究竟是什么，以及它是如何影响特定上下文中的元素的。我们还将查看在最常用的浏览器中与此属性相关的可能出现的差异。最后，我们将展示\
    \ CSS **float** 属性的几个实际用途。这应该是对该属性及其对 CSS 开发的影响提供一个全面且深入的讨论。\n\n## 定义与语法 (Definition\
    \ and Syntax)\n\n通常情况下，CSS float 属性的目的是将块级元素推向左侧或右侧，脱离文档流。这种方法允许自然流动的内容绕过浮动元素。这种概念类似于我们每天看到的，即当元素在某侧对齐时，内容会流过它。\n\
    \n![](](img/736c504465a399f3caa5d5252a3998_24.png)\n\n上述图像显示了浮动元素在某些情况下如何对齐，使得自然流动的内容绕过它。\n\
    \n## 浮动元素 (Floats)\n\n在在布局中使用浮动的有效性是由 Douglas Bowman 在 2004 年解释的，为了实现无表格设计。\n\n\
    ![](](img/736c504465a399f3caa5d5252a3998_25.png)\n\n## 语法 (SYNTAX)\n\nfloat 属性可以接受以下值之一：left、right、none\
    \ 和 inherit。如下代码所示：\n\n```\n#sidebar {\n  float: left;\n}\n```\n\n最常用的值是 left\
    \ 和 right。none 是默认值。为了让 float 正常工作，通常情况下，浮动元素应该有一个一个显式设置的宽度（除非它是替换元素，如图像）。这确保了\
    \ float 能按预期方式工作。\n\n```\n#sidebar {\n  float: left;\n}\n```\n\n## 浮动元素的细节 (SPECIFICS\
    \ ON FLOATED ELEMENTS)\n\n以下是根据 CSS2 规范列出的浮动元素的确切行为列表：\n\n-   左浮动的盒子将向左移动，直到碰到容器边缘（如果没有边距则为框边缘）。\n\
    -   如果浮动盒子的大小超过了可用空间，浮动盒子将向下移动。\n-   非定位、非浮动的元素表现得就像浮动元素不存在一样。\n-   浮动盒子的边距不会与相邻盒子合并。\n\
    -   根元素 (<html>) 不能被浮动。\n-   浮动的内联元素会转换为块级元素。\n\n## 实践中的浮动 (Float in Practice)\n\
    \nfloat 属性常用的用途之一是让文字环绕浮动的图像。这是一个示例：\n\n![](](img/736c504465a399f3caa5d5252a3998_29.png)\n\
    \nPellentesque habitant morbi tristique senectus et netus et malesuada fames ac\
    \ turpis egestas Vestibulum tortor quam, feugiat vitae, ultricies eget, tempor\
    \ sit amet, ante. Donec nec libero sit amet quam egestas semper。\n\n```css\nimg\
    \ {\n  float: left;\n  margin: 0 15px 5px 0;\n  border: solid 1px #bbb;\n}\n```\n\
    \n实现这种效果的唯一属性是 **float** 属性。其他属性（边距和边框）是为了美观考虑的。框内的其他元素（包含文本的 <p> 标签）不需要任何样式。\n\
    \n正如之前提到的，浮动元素相对于其他块元素被脱离了流，因此其他块元素留在流中，表现得就像浮动元素根本不存在一样。这在下图中直观地展示：\n\n![](](img/736c504465a399f3caa5d5252a3998_30.png)\n\
    \n"
