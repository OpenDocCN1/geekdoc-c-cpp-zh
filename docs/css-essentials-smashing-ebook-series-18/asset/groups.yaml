    # IE Filtering


    Aids in: progressive enhancement'
  - '[PAGE 132]


    IE 6 doesn’t seem to be going away anytime soon, so if you want to really make
    sure your pages are progressively enhanced, you’re going to have to learn how
    to handle it. Beyond ignoring the problem or blocking IE 6 altogether, there are
    a number of stances you can take:


    +   - Use conditional comments to fix IE''s bugs: You can create separate style
    sheets for each version of IE you''re having problems with and make sure only
    that version sees its sheet. The IE sheets contain only a few rules with hacks
    and and workarounds that the browser needs.


    +   - Hide all main styles from IE and feed it minimal styles only: This is another
    conditional comment method, but instead of fixing the bugs, it takes the approach
    of hiding all the CSS from IE 6 to begin with, and only feeding it very simple
    CSS to style text and the like. Andy calls this Universal Internet Explorer 6
    CSS.


    +   - Use JavaScript to “fix” IE: There are a number of scripts out there that
    make IE 6 emulate CSS3, alpha-transparent PNGs, and other things that IE 6 doesn’t
    support. Some of the most popular are ie7-js, Modernizr, and ie-css3.js.


    # Flexible Layouts


    Aids in: adaptability


    One of the ways you can make your sites adaptable to your users’ preferences is
    to create flexible instead of fixed-width layouts. We’ve already gone over how
    media queries can make your pages more adaptable to different viewport widths,
    but creating liquid, elastic, or resolution-dependent layouts can be used instead
    of or in conjunction with media'
  - '[PAGE 133]


    queries to further optimize the design for as large segment of your users as possible.


    +   **Liquid layouts:** Monitor sizes and screen resolutions cover a much larger
    range than they used to, and mobile devices like the iPhone and iPad let the user
    switch between portrait and landscape mode, changing their viewport width on the
    fly. Liquid layouts, also called fluid, change in width based on the user’s viewport
    (eg, window) width that the entire design always fits on the screen without horizontal
    scrollbars appearing. The **min-width** and **max-width** properties and/or media
    queries can and should be used to keep the design from getting stretched out or
    too squished at extreme dimensions.


    +   **Elastic layouts:** If you want to optimize for a particular number of text
    characters per line, you can use an elastic layout, which changes in width based
    on the user’s text size. Again, you can use **min-** and **max-width** and/or
    media queries to limit the degree of elasticity.


    +   **Resolution-dependent layouts:** This type of layout, also called adaptive,
    is similar to media queries, but uses JavaScript to switch between different style
    sheets and rearrange boxes to accommodate different viewport widths.


    # Layout Grids


    Aids in: modularity, efficiency


    Designing on a grid of (usually invisible) consistent horizontal and vertical
    lines is not new — it goes back for centuries — but its application to web design
    has gained in popularity in recent years. And for good reason: a'
  - '[PAGE 134]


    layout grid can create visual rhythm to guide the user''s eye, make the design
    look more clean and ordered, and enforce design consistency.


    nGrids can also make your designs more modular and your development more efficient
    because they create a known, consistent structure through which you can easily
    drop new elements and rearrange existing ones without as much thought and time
    as it would take in a non-grid layout. For instance, all of your elements must
    be as wide as your grid''s column measurement, or so you can easily move an element
    to another spot on the page or to another page and be assured that it will fit
    and look consistent with the rest of the design. At worst, you''ll need to adjust
    the other elements'' widths around it to a different multiple of the column measurements
    to get the new element to fit, but even this is not too work-intensive, as there
    is only half of pre-determined widths that any element can have.


