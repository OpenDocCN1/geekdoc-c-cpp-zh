    | html[xmlns~.clearfix { | | | static...8107831 (line 224) |

    | display: block; | | | |

    | ul.postmetadata { | | | static...8107831 (line 248) |

    | list-style: none outside none; | | | |

    | margin: 4px 0 9px; | | | |

    | .post ul { | | | static...8107831 (line 49) |

    | list-style-type: square; | | | |

    | .postmetadata { | | | static...8107831 (line 253) |

    | clear: both; | | | |

    | margin: 0 0 15px; | | | |

    | .clearfix { | | | static...8107831 (line 224) |

    | display: inline-block; | | | |


    Firebug in action, informing you how specificity is working.'
  - '[PAGE 180]


    In the next shot, Safari''s Web Inspector shows the computed values of an element.
    This way, you can see the values even though they haven''t been explicitly added
    to the style sheet:


    | Styles |

    | Computed Style | Show inherited |

