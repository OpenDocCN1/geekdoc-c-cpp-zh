  - "[PAGE 227]\n\nIn this example, the element with the id example will have a hash\
    \ symbol placed “before” its content, and a period (or full stop) placed “after”\
    \ its content.\n\n# SOME NOTES ON THE SYNTAX\n\nYou could leave the content property\
    \ empty and just treat the pseudo-element content-less box, like this:\n\n```\n\
    #example:before {\n  content: \"\"\n  display: block;\n  width: 100px;\n  height:\
    \ 100px;\n}\n```\n\nHowever, you can't remove the content property altogether.\
    \ If you did, the pseudo-element wouldn't work. At the very least, the content\
    \ property needs empty quotes as its value.\n\nYou may have noticed that you can\
    \ also code pseudo-elements using the double-colon syntax (::before and ::after),\
    \ which I've discussed before that there is no difference between the two syntaxes;\
    \ it's just a way to differentiate pseudo-elements (double colon) from pseudo-classes\
    \ (single colon) in CSS3.\n\nOne final point regarding the syntax. Technically,\
    \ you could implement a pseudo-element universally, without targeting any element,\
    \ like this:\n\n```\n:before {\n  content: \"#\"\n}\n```\n\nWhile the above is\
    \ valid, it's pretty useless. The code will insert a hash symbol before the content\
    \ in each element in the DOM. Even if you"
  - '[PAGE 228]


    removed the <body> tag and all of its content, you''d still see two hash symbols
    on the page: one in the <html> element, and one in the <body> tag, which the browser
    automatically constructs.


    # Characteristics Of Inserted Content


    As mentioned, the content that is inserted is not visible in the page''s source.
    It''s visible only in the CSS.


    Also, the inserted element is by default an inline element (or, in HTML5 terms,
    in the category of text-level semantics). So, to give the inserted element a height,
    padding, margins and so forth, you''ll usually have to define it explicitly as
    a block-level element.


    This leads well into a brief description of how to style pseudo-elements. Look
    at this graphic from my text editor:'
  - "[PAGE 229]\n\n```\n#element:before {\n  content: \"#\";\n  display: block;\n\
    \  width: 200px;\n  height: 200px;\n}\n#element:after {\n  content: \".\";\n \
    \ display: block;\n  width: 200px;\n  height: 200px;\n}\n```\n\nIn this example,\
    \ I've highlighted the styles that will be applied to the elements inserted before\
    \ and after the targeted element’s content. Pseudoelements are somewhat unique\
    \ in this way, because you insert the content and the styles in the same declaration\
    \ block.\n\nAlso note that typical CSS inheritance rules apply to the inserted\
    \ elements. If you had, for example, a font stack of Helvetica, Arial, sans-serif\
    \ applied to the <body> element of the document, then the pseudo-element would\
    \ inherit that stack that are the same as any other element.\n\nLikewise, pseudo-elements\
    \ don’t inherit styles that aren’t naturally inherited from parent elements (such\
    \ as padding and margins)."
  - "[PAGE 230]\n\n# Before Or After What?\n\nYour hunch on seeing the :before and\
    \ :after pseudo-elements might be that the inserted content will be injected before\
    \ and after the targeted element. But, as alluded to above, that's not the case.\n\
    \nThe content that's injected will be child content in relation to the targeted\
    \ element, but it will be placed “before” or “after” any other content in that\
    \ element.\n\nTo demonstrate this, look at the following code. First, the HTML:\n\
    \n```\n<p class=\"box\">Other content.</p>\n```\n\nAnd here's the CSS that inserts\
    \ a pseudo-element:\n\n```\np.box {\n  width: 300px;\n  border: solid 1px white;\n\
    \  padding: 20px;\n}\n\np.box:before {\n  content: \"#\";\n  border: solid 1px\
    \ white;\n  padding: 2px;\n  margin: 0 10px 0;\n}\n```\n\nIn the HTML, all you\
    \ would see is a paragraph with a class of box, with the words “Other content”\
    \ inside it (the same as what you would see if you viewed the source on the live\
    \ page). In the CSS, the paragraph is given a set width, along with some padding\
    \ and a visible border."
  - '[PAGE 231]


    Then we have the pseudo-element. In this case, it''s a hash symbol inserted

    “before” the paragraph’s content. The subsequent CSS gives it a border,

    along with some padding and margins.


    Here’s the result viewed in the browser:


    ![](img/736c504465a39c9f3caa50d5252a3998_231_0.png)


    The outer box is the paragraph. The border around the hash symbol

    denotes the boundary of the pseudo-element. So, instead of being inserted

    “before” the paragraph, the pseudo-element is placed before the “Other

    content” in the paragraph.


    # Inserting Non-Text Content


    I mentioned briefly that you can leave the content property’s value as an

    empty string or insert text content. You basically have two additional options

    of what to include as the value of the content property.


    First, you can include a URL that points to an image, just as you would do

    when including a background image in the CSS:'
  - "[PAGE 232]\n\n```\np:before {\n  content: url(image.jpg);\n}\n```\n\nNotice that\
    \ the quotes are missing. If you wrapped the URL reference in quotes, then it\
    \ would become a literal string and insert the text “url(image.jpg)” as the content,\
    \ instead of inserting the image itself.\n\nNaturally, you could include a Data\
    \ URI in place of the image reference, just as you can with a CSS background.\n\
    \nYou also have the option to include a function in the form of attr(X). This\
    \ function, according to the spec, “returns a string as the value of attribute\
    \ X for the subject of the selector.\n\nHere’s an example:\n\n```\na:after {\n\
    \  content: attr(href);\n}\n```\n\nWhat does the attr() function do? It takes\
    \ the value of the specified attribute and places it as text content as a pseudo-element.\n\
    \nThe code above would cause the href value of every <a> element on the page to\
    \ be placed immediately after each respective <a> element. This could be used\
    \ in a print style sheet to include full URLs next to all links when a document\
    \ is printed.\n\nYou could also use this function to grab the value of an element’s\
    \ title attribute, or even micro data values. Of course, not all of these examples\
    \ would be practical in and of themselves; but depending on the situation, a specific\
    \ attribute value could be practical as a pseudo-element."
  - '[PAGE 233]


    While being able to grab the title alt text of an image and display it on the
    page as a pseudo-element would be practical, this isn’t possible. Remember that
    the pseudo-element must be a child of the element to which it is being applied.
    Images, which are void (or empty) elements, don’t have child elements, so it wouldn’t
    work in this case. The same would apply to other void elements, such as <input>.


    # Dreaded Browser Support


    As with any front-end technology that is gaining momentum, one of the first concerns
    is browser support. In this case, that’s not as much of a problem.


    Browser support for :before and :after pseudo-elements stacks up like this:


    +   * Chrome 2+

    * Firefox 3.5+ (3.0 had partial support),

    * Safari 1.3+,

    * Opera 9.2+,

    * IE8+ (with some minor bugs),

    * Pretty much all mobile browsers.


    The only real problem (no surprise) is IE6 and IE7, which have no support. So,
    if your audience is in the Web development niche (or another market that has low
    IE numbers), you you can probably go ahead and use pseudo-elements freely.'
  - '[PAGE 234]


    # PSEUDO-ELEMENTS AREN''T CRITICAL


    Fortunately, a lack of pseudo-elements will not cause huge usability issues. For
    the most part, pseudo-elements are generally decorative (or helper-like) content
    that will not cause problems in unsupported browsers. So, even if your audience
    has high IE numbers, you can still use them to some degree.


    # A Couple Of Reminders


    As mentioned, pseudo-element content does not appear in the DOM. These elements
    are not real elements. As such, they are not accessible to most assistive devices.
    So, never use pseudo-elements to generate content that is critical to the usability
    or accessibility of your pages.


    Another thing to keep in mind is that developer tools such as Firebug do not show
    the content generated by pseudo-elements. So, if overused, pseudo-elements cause
    maintainability headaches and make debugging a much slower process.


    (Update): you can use Chrome’s developer tools to view the styles associated with
    a pseudo-element, but the element will not appear in the DOM. Also, Firebug is
    adding pseudo-element support in version 1.8.)


    That covers all of the concepts you need in order to create something practical
    with this technique. In the meantime, for further reading on CSS pseudo-elements,
    be sure to check out some of the articles that we’ve linked to this piece.'
- md: "\n# Taming Advanced CSS Selectors\n\nInayail de Leon\n\nCSS is one of the most\
    \ powerful tools that is available to web designers (if not the most powerful).\
    \ With it we can completely transform the look of a website in just a couple of\
    \ minutes, and without even having to touch the markup. But despite the fact that\
    \ we are all aware of its usefulness, CSS selectors are still not used to their\
    \ full potential and we sometimes have the tendency to litter our HTML with excessive\
    \ and unnecessary classes and ids, divs and spans.\n\nThe best way to avoid these\
    \ plagues spreading in your markup and keep it clean and semantic, is by using\
    \ more CSS selectors, ones that can target specific elements without the need\
    \ of a class or an id, and by doing that keep our code and our stylesheets flexible.\n\
    \n## CSS Specificity\n\nBefore delving into the realms of advanced CSS selectors,\
    \ it's important to understand how CSS specificity works, so that we know how\
    \ to properly our selectors and to avoid spending hours debugging for a CSS issue\
    \ that could be easily fixed if we had only paid attention to the specificity.\n\
    \nWhen we are writing our CSS we have to keep in mind that some selectors will\
    \ rank higher than others in the cascade, the latest selector that we wrote will\
    \ not always override the previous ones that we wrote for the same elements.\n\
    \nSo how do you calculate the specificity of a particular selector? It's fairly\
    \ straightforward if you take into account that specificity will be represented\
    \ as four numbers separated by commas, like: 1, 1, 1, 1 or 0, 2, 0, 1\n\n- 1.\
    \ The first digit (a) is always zero, unless there is a style attribute applied\
    \ to that element within the markup element\n- 2. The second digit (b) is the\
    \ sum of the number of IDs in that selector\n- 3. The third digit (c) is the sum\
    \ of other attribute selectors and pseudo-classes in that selector. (.example)\
    \ and attribute selectors (eg. li[id=red]) are included here.\n- 4. The fourth\
    \ digit (d) counts the elements (like table, p, div, etc.) and pseudo-elements\
    \ (like :first-line)\n- 5. The universal selector (*) has a specificity of zero\n\
    - 6. If two selectors have the same specificity, the one that comes last on the\
    \ stylesheet will be applied\n\nLet's take a look at a few examples, to make it\
    \ easier to understand:\n\n- #sidebar h2 — 0, 1, 0, 1\n- h2.title — 0, 0, 1, 1\n\
    - h2 + p — 0, 0, 0, 2\n- #sidebar p:first-line — 0, 1, 0, 2\n\nFrom the following\
    \ selectors, the first one is the one who will be applied to the element, because\
    \ it has the higher specificity:\n\n- #sidebar p#first { color: red; } — 0, 2,\
    \ 0, 1\n- #sidebar p:first-line { color: blue; } — 0, 1, 0, 2\n\nIt's important\
    \ to have at least a basic understanding of how specificity works, but tools like\
    \ Firebug are useful to let us know which selector is being applied to a particular\
    \ element by listing all the CSS selectors in order of their specificity when\
    \ you are inspecting the element.\n\n![](img/736c504465a39c9f3caa50d5252a3998_237_0.png)\n\
    \nFirebug lets you easily see which selector is being applied to an element.\n\
    \n# 1. Attribute selectors\n\nAttribute selectors let you target an element based\
    \ on its attributes. You can specify the element's attribute only, so all the\
    \ elements that have that attribute — whatever the value — within the HTML will\
    \ be targeted, or more specific and target elements that have particular values\
    \ on their attributes — this is where attribute selectors show their power.\n\n\
    There are 6 different types of attribute selectors:\n\n- **[att=value]**: The\
    \ attribute has to have the exact value specified.\n- **[att~=value]**: The attribute's\
    \ value needs to be a whitespace separated list of words (for example)\n- **[att|=value]**:\
    \ The attribute's value is exactly \"value\" or starts with the word \"value\"\
    \ and is immediately followed by \"-\"\n- **[att^=value]**: The attribute's value\
    \ starts with the specified value.\n- **[att$=value]**: The attribute's value\
    \ ends with the specified value.\n- **[att*=value]**: The attribute's value contains\
    \ the specified value.\n\nFor example, if you want to change the background color\
    \ of all the div elements that are posts on your blog, you can use the attribute\
    \ selector that targets every div whose class attribute starts with \"post-\"\
    :\n\n```\ndiv[class*=\"post\"] {\n  background-color: #333;\n}\n```\n\nThis will\
    \ match all the div elements whose class attribute contains the words \"posts\"\
    , in any position.\n\nAnother useful usage of attribute selectors is to target\
    \ different types of input elements. For example, if you want your text inputs\
    \ to have a different width from the others, you can use a simple attribute selector:\n\
    \n```\ninput[type=\"text\"] {\n  width: 200px;\n}\n```\n\nThis will target all\
    \ the **input** elements whose **type** attribute is exactly “text\".\n\nNow let's\
    \ say you want to add a different icon next to each different type of file your\
    \ website is linking to, you can use the attribute selector that targets every\
    \ div whose class attribute starts with \"post-\":\n\n```\ndiv[class*=\"post\"\
    ] {\n  background-color: #333;\n}\n```\n\nThis will match all the div elements\
    \ whose class attribute contains the words \"posts\", in any position.\n\nAnother\
    \ useful usage of attribute selectors is to target different types of input elements.\
    \ For example, if you want your text inputs to have a different width from the\
    \ others, you can use a simple attribute selector:\n\n```\ninput[type=\"text\"\
    ] {\n  width: 200px;\n}\n```\n\nThis will target all the **input** elements whose\
    \ **type** attribute is exactly “text\".\n\nNow let's say you want to add a different\
    \ icon next to each different type of file your website is linking to, you can\
    \ use the attribute selector that targets every div whose class attribute starts\
    \ with \"post-\":\n\n```\ndiv[class*=\"post\"] {\n  background-color: #333;\n\
    }\n```\n\nThis will match all the div elements whose class attribute contains\
    \ the words \"posts\", in any position.\n\nAnother useful usage of attribute selectors\
    \ is to target different types of input elements. For example, if you want your\
    \ text inputs to have a different width from the others, you can use a simple\
    \ attribute selector:\n\n```\ninput[type=\"text\"] {\n  width: 200px;\n}\n```\n\
    \nThis will target all the **input** elements whose **type** attribute is exactly\
    \ “text\".\n\nNow let's say you want to add a different icon next to each different\
    \ type of file your website is linking to, you can use the attribute selector\
    \ that targets every div whose class attribute starts with \"post-\":\n\n```\n\
    div[class*=\"post\"] {\n  background-color: #333;\n}\n```\n\nThis will match all\
