    # Controlling Text Wrapping and Breaking


    Aids in: adaptability


    CSS3 gives you more control over how blocks of text and individual words break
    and wrap if they’re too long to fit in their containers. Setting word-wrap to
    break-word will break a long word and wrap it onto a new line (particularly handy
    for long URLs in your text). The text-wrap property gives you a number of options
    for where breaks and may not occur between words in your text. The CSS2 white-space
    property has now now in CSS3 become a shorthand property for the new white-space-collapse
    and text-wrap properties, giving you more control over what spaces and line breaks
    are preserved from your markup to the rendered page. Another property mentioning,
    even though it’s not currently in the CSS3 specification, is text-overflow, which
    allows the browser to add an ellipsis character (...) to the end of a long string
    of text instead of letting it overflow.


    # Media Queries


    Aids in: adaptability, efficiency


    CSS2 let you apply different styles to different media types — screen, print,
    and so on. CSS3’s media queries take this step further by letting you customize
    styles based on the user’s viewport width, display aspect ratio, whether or not
    his display shows color, and more. For instance, you could detect the user’s viewport
    width and change a horizontal nav bar into a vertical menu on wide viewports,
    where there is room for an extra column. Or you could change the colors of your
    text and backgrounds on non-color displays.


    ![](img/736c504465a39c9f3caa50d5252a3998_123_0.png)


    ![](img/736c504465a39c9f3caa50d5252a3998_124_0.png)


    This demo file from Opera uses media queries to rearrange elements and resize
    text and images based on viewport size.


    Media queries couldn''t come at a better time — there is more variety in the devices
    and settings people use to browse the web than ever before. We can now optimize
    your designs more precisely for these variations to provide a more usable and
    attractive design, but without having to write completely separate style sheets,
    use JavaScript redirects, and other less efficient development practices.


    Media queries are supported to some degree by all the major browsers except IE.
    Also, media queries are particularly helpful in serving alternate styles to small-screen
    mobile devices. IMPROVING EFFICIENCY THROUGH CSS3


    Many of the visual effect properties of CSS3 that we''ve gone over have a great
    bonus in addition to making your design look great: they can improve efficiency,
    both in your development process and in the performance of the pages themselves.


    Any CSS3 property that keeps you from having to create and add extra images is
    going to reduce the time it takes to create new pages as well as re-skin existing
    ones. Less images also mean less stuff for the server to send out and less stuff
    for the users to download, both of which increase page loading speed.


    CSS3 properties that keep you from having to add extra divs or extra classes can
    also reduce your development time as well as file size. We''ve already gone over
    some great techniques that help with this, but there are a few more worth mentioning.


    # The box-sizing Property


    Aids in: efficiency


    In addition to the div-conserving properties we''ve already talked about, the
    box-sizing property can also help limit your div use in certain situations.


    In the traditional W3C box model of CSS 2.1, the value you declare for a width
    or height controls the width or height of the content area only, and then the
    padding and border are added onto it. (This is called the content-box model.)
    If you''ve worked with CSS for a while, you''re probably used to the content-box
    box model and don''t really think about it. But, it can lead you to add extra
    divs from time to time. For instance, if you want to set a box''s width and padding
    in different units of measurement from each other, like em for the width and pixels
    for the padding, it''s often easiest to nest another div and apply the padding
    to this instead, to make you know how much total space the box will take up. In
    small doses, nesting additional divs simply to add padding or borders is not a
    great sin. But in complicated designs, the number of extra divs can really add
    up, which adds to both your development time and the file size of the HTML and
    CSS.


    Setting the new **box-sizing** property to **border-box** instead of **content-box**
    solves this problem so you can get rid of all those extra **divs**. When a box
    is using the border-box box model, the browser will *subtract* the padding and
    border from the width of the box instead of adding it. You always know that the
    total space the box takes up equals the value you''ve declared.


    ![](img/736c504465a39c9f3caa50d5252a3998_126_0.png)


    ![](img/736c504465a39c9f3caa50d5252a3998_126_1.png)


    In the traditional box model (bottom image), padding and border are added onto
    the declared width. By setting **box-sizing** to **border-box** (top image), the
    padding and border are subtracted from the declared width.


    The box-sizing property has good browser support, with the exception of IE 6 and
    IE 7. Unlike the more decorative CSS3 properties, however, lack of support for
    box-sizing could cause your entire layout to fall apart. You''ll have to determine
    how serious the problem would be in your particular case, whether it''s worth
    living with or hacking, or whether you should avoid using box-sizing for now.


    # CSS3 Pseudo-Classes and Attribute Selectors


    Aids in: progressive enhancement, efficiency, modularity, rich typography


    CSS has several really useful selectors that are only now coming into common use.
    Many of these are new in CSS3, but others have been around since CSS2, just not
    supported by all browsers (read: IE) until recently, and largely ignored. IE still
    doesn''t support them all, but they can be used to add non-essential visual effects.


