- md: "\nNote: there is no need to use clear on the footer since #wrapper contains\
    \ both floats.\n\n- Rather than using overflow/zoom, we use inline-block to create\
    \ a new block formatting context (this declaration also triggers hasLayout). The\
    \ left border will paint a background color behind #sidebar.\n- Negative margin\
    \ is used to bring #sidebar outside the content box of the parent's container\
    \ (to make it overlap the border of #wrapper).\n\nThe case of IE6: If the above\
    \ rules use position: relative (twice), it is because of IE6. It is applied on\
    \ #wrapper to prevent #sidebar from being clipped outside of its content box.\
    \ It is also applied on #sidebar to make sure the elements are “always” painted\
    \ with the proper offset.\n\nIf you look at this first step, you'll see that we\
    \ have everything working, the vertical border is in between the columns. You\
    \ should also notice that in browsers other than IE 6 and 7, there is a small\
    \ gap at the bottom of #sidebar (at the bottom #wrapper actually). This is because\
    \ #wrapper is styled with inline-block it is sitting on the baseline of the line\
    \ box. The gap you see is the “descender space” (the space reserved for descenders\
    \ in lowercase letters).\n\nSo these are the rules to remove the gap and create\
    \ the vertical border:\n\n```\n#wrapper {\n  vertical-align: bottom;\n}\n#sidebar\
    \ {\n  margin-right: -1px;\n  border-right: 1px solid #888;\n}\n#main {\n  border-left:1px\
    \ solid #888;\n}\n```\n\n## What do these rules do?\n\nvertical-align: bottom\
    \ makes #wrapper sit at the bottom of the line box rather than the baseline.\n\
    \nthe two borders (for #sidebar and #main) overlap because of the negative right\
    \ margin set on #sidebar. This overlap guarantees that this \"common\" border\
    \ will be as tall as the column.\n\nIf you look at step two, things look much\
    \ better. The last things to do is to add the base styles sheet and the same rules\
    \ we used at the end of the first demo:\n\n```\n<link rel=\"stylesheet\" type=\"\
    text/css\" href=\"http://tjkdesign.com/ez-css/css/base.css\">\n```\n\nand then\
    \ add these rules:\n\n```\nhtml {\n  height: auto;\n}\nbody {\n  border: 1px solid\
    \ #efefef;\n}\n#header,\n#main,\n#sidebar,\n#footer {\n  padding-bottom: 2em;\n\
    }\n```\n\n## 3. Creating a three column layout with a border in between the columns\n\
    \nWe'll build a layout with a single #main-wrapper, one containing all the divs.\
    \ This approach complicates things a bit, but it also allows to tackle new challenges.\
    \ Please note that with this layout, the vertical borders will not show in IE\
    \ 6 and 7.\n\n![](img/736c504465a39c9f3caa50d5252a3998_193_0.png)\n\n### THE BASICS\n\
    \nWe use the wrapper to create the background of the three columns. The left and\
    \ right borders of the wrapper will be used for the two side bars while its background\
    \ will be used for the main content.\n\n### THE MARKUP\n\n```\n<div id=\"wrapper\"\
    >\n  <div id=\"header\"><h2><a href=\"#\">Header</a></h2><p>Lorem ipsum...</p></div>\n\
    \  <div id=\"sidebar\"><h2><a href=\"#\">Sidebar</a></h2><p>Lorem ipsum...</p></div>\n\
    \  <div id=\"aside\"><h2><a href=\"#\">Aside</a></h2><p>Lorem ipsum...</p></div>\n\
    \  <div id=\"main\"><h2><a href=\"#\">Main</a></h2><p>Lorem ipsum...</p></div>\n\
    \  <div id=\"footer\"><h2><a href=\"#\">Footer </a></h2><p>Lorem ipsum...</p></</div>>\n\
    </div>\n```\n\n### CSS\n\nWe start with the generic rules from the previous demos:\n\
    \n```\nhtml {\n  background: #45473f;\n}\n\nbody {\n  width: 80%;\n  margin: 20px\
    \ auto;\n  background: #ffe3a6;\n}\n\n#header,\n#footer {\n  overflow: hidden;\n\
    \  zoom: 1;\n  background: #9c9965;\n}\n\n#sidebar {\n  float: left;\n  width:\
    \ 200px;\n}\n```\n\n```\n#main {\n    float: left;\n}\n```\n\nTo which we add:\n\
    \n```\n#wrapper {\n    border-left: 200px solid #D4C7B;\n    background: #ffe3a6;\n\
    \    border-right: 200px solid #D4C7B;\n}\n```\n\nThis code sets the background\
    \ color for the three columns. In the same sequence as the above declarations.\n\
    \nIf you look at this first step, you'll see that we have achieved the background\
    \ we are looking for, but things look broken inside the wrapper's content box.\n\
    \nNext rules should fix the display of the three columns (**zoom: 1** for #wrapper\
    \ and **position: relative** for #sidebar and #aside): #aside is a given width\
    \ and floated to the right. **Note:** IE 6 and 7 needs #wrapper to have a layout,\
    \ hence the use of zoom. The negative margins pull each side over the wrapper's\
    \ border.\n\nIf you look at step two, you'll see that #header does not stretch\
    \ across the entire layout and that #footer is nowhere to be found. These two\
    \ rules should take care of everything.\n\n```\n#header,\n#footer {\n    margin-left:\
    \ -200px;\n    margin-right: -200px;\n    position: relative;\n}\n#footer {\n\
    \  clear: both;\n}\n```\n\nThe negative margin on both sides of #header and #footer\
    \ stretches the two boxes outside of the wrapper's content box. clear:both clears\
    \ the columns. This is step three. Once again, the position declaration is for\
    \ IE 6. Just remember to always position elements that offset.\n\n## WHAT'S NEXT?\n\
    \nYou know the drill. We insert a base styles sheet in the document:\n\n```\n\
    <link rel=\"stylesheet\" type=\"text/css\" href=\"http://tjkdesign.com/ez-css/css/base.css\"\
    >\n```\n\nand add the usual:\n\n```\nhtml {\n  height: auto;\n}\nbody {\n  border:\
    \ 1px solid #efefef;\n}\n#header,\n#main,\n#sidebar,\n#footer {\n  padding-bottom:\
    \ 2em;\n}\n```\n\nStep four shows how things look before we tackle the vertical\
    \ borders.\n\n## ADDING VERTICAL BORDERS\n\nThe following technique is inspired\
    \ from the companion columns technique (Ingo Chao) and the Nicolas Gallagher method.\
    \ To get the effect we want (two borders touching each other), we use generated\
    \ content to which we apply a background color and a border.\n\n```\nhtml:before\
    \ {\n  content: \".\";\n  position: absolute;\n  height: 20px;\n  background:\
    \ #45473f;\n  left: 0;\n  right: 0;\n  z-index: 2;\n}\nbody {\n  border-top: 0;\n\
    }\n#header {\n  border-top: 1px solid #fff;\n}\n#wrapper {\n  position: relative;\n\
    }\n#header,\n#footer {\n  z-index: 1;\n}\n#wrapper:before,\n#wrapper:after {\n\
    \  content: \".\";\n  position: absolute;\n  width: 1px;\n  height: 2000px;\n\
    \  background: #9c9965;\n  bottom: 0;\n}\n#wrapper:before {\n  left: 0;\n  border-left:\
    \ 1px solid #fff;\n}\n#wrapper:after {\n  right: 0;\n  border-right: 1px solid\
    \ #fff;\n}\nbody {\n  position: relative\\9;\n  z-index: -1;\n}\n```\n\nOK, so\
    \ what's going on here?\n\n- The fake borders get out of the container (at the\
    \ top), so the first rule paints generated content on top of them. Note that we\
    \ would need this rule if the color of the fake borders was the same as the page's\
    \ background (html), or if there was no gap between the top of the viewport and\
    \ the layout.\n- Because these borders are painted over the border around body,\
    \ we move the top border from body to #header.\n- To properly position the fake\
    \ borders, we need to make the wrapper the containing block for the generated\
    \ content.\n- We bring #header #footer above the stack so they hide the fake borders\
    \ which are painted inside the wrapper (from bottom to top).\n- This is the generated\
    \ content we use to create the columns.\n\n**The case of IE 8:** The last rule\
    \ is for IE 8. Without this, IE 8 would not paint the generated content over the\
    \ borders that escape the wrapper (at the top). If this declaration is sandboxed\
    \ via the \"9\" hack, it is because Gecko browsers would make everything unclickable/unselectable.\n\
    \n**Note:** these pseudo-classes are not supported by IE 6 and 7, so in these\
    \ browsers, there are no borders between the columns.\n\n## Things to consider\n\
    \nThe third layout uses one *main* wrapper, but it would make more sense to use\
    \ a *inner* wrapper instead to hold only the columns. In this route taken here,\
    \ then it was only for those of you who are stuck with this type of construct,\
    \ but want to implement this solution for equal height columns.\n\nWhen absolutely\
    \ positioning elements inside a containing block with wide columns like in the\
    \ last two demos, remember that the reference is the padding box, so **0** for\
    \ **right** or **left** may not be the value you want to use.\n"
  mdcn: "\n\n注意：页脚（footer）不需要使用 `clear`，因为 #wrapper 包含了浮动元素。\n\n- 我们没有使用 `overflow/zoom`，而是使用\
