    # 3-col layout via CSS


    Lists, no absolute positioning (or all), no floats; the left and right columns
    have fixed width (150px), the middle one is elastic. Any (or none) margins of
    the body may be used. It works (WAKLY) in any modern browser - I tested it in
    IE8, Opera, IE6, Safari, and Chrome. It doesn''t work in old browsers barely supporting
    CSS (IE4, IE5 etc.).


