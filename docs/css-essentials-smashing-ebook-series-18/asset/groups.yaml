    \ est laborum. Lorem ipsum\n\n## Grid\n\nGrid properties allow you to throw block-level\
    \ elements into a grid cell, irrespective of the flow of content within the grid\
    \ parent element. An element becomes a grid when display is set to grid. You can\
    \ then set the number of columns and rows with the grid-columns and grid-rows\
    \ properties, respectively. You can then declare each child selector as part of\
    \ a grid cell, like so:\n\n```\n#title {\n  grid-column: 1; grid-row: 1;\n}\n\n\
    #score {\n  grid-column: 2; grid-row: 1;\n}\n```\n\nYou can also use a template\
    \ to plan the grid:\n```css\nbody {\n  grid-template: \"ta\"\n    \"sa\"\n   \
    \ \"bb\"\n    \"cc\";\n}\n```\n\nIn this syntax, each string refers to a row,\
    \ and each character refers to a grid cell. In this case, the content of grid\
    \ cell represented by the character a spans two rows but just one column, and\
    \ the content represented by b spans two rows but just one row.\n\nNow you can\
    \ set any of the child element’s grid-cell position:\n\n```css\n#title {\n  grid-cell:\
    \ 't';\n}\n```\n\nThis will make the element with the ID title within the body\
    \ element to be positioned in the grid cell represented by the character t in\
    \ the grid-template property.\n\nIf you are not using grid-template, you can also\
    \ declare how many columns or rows a particular element should occupy with the\
    \ grid-row-span and grid-column-span properties.\n\n## Flexbox\n\n- W3C Editor’s\
    \ Draft\n- Demo\n- Browser support: WebKit Nightlies\n\nFlexbox allows you to\
    \ distribute child elements anywhere in the box (giving us the much-needed vertical\
    \ centering), along with flexible units that let you control the fluidity of the\
    \ child elements' dimensions. Note that this specification has changed substantially\
    \ since it was first proposed. Previously, you would invoke Flexbox for an element\
    \ with display: box, but now you would use display: Flexbox to do so. Child elements\
    \ can be vertically aligned to the center with flex-pack:center and horizontally\
    \ aligned to the center with flex-align:center. Also note that all elements that\
    \ obey the Flexbox need to be block-level elements.\n\n## How Do Various Properties\
    \ Interact With Each Other?\n\nYou might wonder how to use these properties in\
    \ combination. The following table shows which of these features can be combined.\n\
    \n| Paged Media | Multiple Columns | Regions | Exclusions | Grid | Flexbox |\n\
    | :--- | :---: | :---: | :---: | :---: | :---: |\n| Paged Media | ✓ | | | | |\n\
    | Multiple Columns | ✓ | ✓ | ✓ | ✓ | |\n| Regions | | ✓ | ✓ | ✓ | |\n| Exclusions\
    \ | | ✓ | ✓ | ✓ | |\n| Grid | | | | | ✓ |\n| Flexbox | | | | | | |\n\nAs you can\
    \ see, the multiple-column properties can be used in conjunction with generated\
    \ content for paged media, regions and exclusions. But grid, Flexbox and regions\
    \ are mutually exclusive (i.e. if an element is a grid, it cannot be Flexbox or\
    \ region). Do note that, while Alan Stearns says in the comments, while a grid\
