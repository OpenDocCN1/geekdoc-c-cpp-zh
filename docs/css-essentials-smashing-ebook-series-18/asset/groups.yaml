    \nForemost Canada 的页面（上方）以网格格式显示他们的产品，位于左侧边栏。所有 `<li>` 元素都设置为左浮动并在无序列表中显示。这种方法比表格的网格更好，因为画廊中的图片数量变化不会影响布局。\n\
    \n## 床\n\nimg/736c504465a39c9f3caa50d5252a3998_48_0.png\nimg/736c504465a39c9f3caa50d5252a3998_48_1.png\n\
