    # NEGATIVE VALUES IN FIREFOX 2


    In Firefox version 2, a negative z-index value will position an element behind
    the stacking context instead of in front of the background and borders of the
    element that established the stacking context. Here is a screen capture displaying
    this bug in Firefox 2:


    ![](img/736c504465a39c9f3caa50d5252a3998_65_0.png)


    Below is the HTML version of the above screen capture, so if you view this page
    in Firefox 3 or another currently-used browser, you’ll see the proper implementation:
    The background of the grey box (which is the element that establishes the stacking
    context) appears below everything else, and the grey box’s inline text appears
    above the blue box, which agrees with the “natural stacking order” rules outlined
    earlier.


    ![](img/736c504465a39c9f3caa50d5252a3998_66_0.png)


