    ![](img/736c504465a39c9f3caa50d5252a3998_58_2.png)'
  - "[PAGE 59]\n\nNow the result is as expected: The stacking order of the elements\
    \ is reversed; the grey box overlaps the blue box, and the blue box overlaps the\
    \ gold.\n\n# Syntax\n\nThe z-index property can affect the stack order of both\
    \ block-level and inline elements, and is declared by a positive or negative integer\
    \ value, or a value of auto. A value of auto gives the element the same stack\
    \ order as its parent.\n\nHere is the CSS code for the third example above, where\
