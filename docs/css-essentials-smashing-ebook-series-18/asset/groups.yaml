  - "[PAGE 149]\n\n```\n}\nh1 {\n  /* Font */\n  font-size: 2em;\n  font-weight: bold;\n\
    \  /* Color */\n  color: #c00;\n  background: #fff;\n  /* Box model */\n  padding:\
    \ 10px;\n  margin-bottom: 1em;\n}\n```\n\nPlease note that the comments above\
    \ are not intended to go into your CSS file, but are just to illustrate my point\
    \ in the article.\n\n# # Ordering CSS Files\n\nOrdering CSS files is always tricky,\
    \ and there is no right or wrong way. A good idea, though, is to section the code\
    \ into defined groups, with headings, as well as a table of contents at the top\
    \ of the file. Something like this:\n\n```\n/*--------------------------------------*/\n\
    /* CONTENTS\n/*--------------------------------------**/\n/*\nMAIN\nTYPE\nIMAGES\n\
    TABLES\nMISC\nRESPONSIVE\n*/\n/*--------------------------------------*/\n```"
  - "[PAGE 150]\n\n```\n$MAIN\n/*--------------------------------------*/\nhtml {\n\
    \  styles\n}\nbody {\n  styles\n/*--------------------------------------*/\n$TYPE\n\
    /*--------------------------------------*/\n```\n\nAnd so on.\n\nThis way, you\
    \ can easily read the contents and jump straight to a particular section by performing\
    \ a quick search (Command/Control + F). Prepending each heading with a dollar\
    \ sign makes it unique, so that a search will yield only headings.\n\n# THE “SHARED”\
    \ SECTION\n\nAll CSS files have a section for sharing, where you tether selectors\
    \ to a single declaration, rather than write the same declaration over and over.\n\
    \nSo, instead of writing this...\n\n```\n/*--------------------------------------*/\n\
    $TYPE\n/*--------------------------------------*/\nh1 {\n  font-size: 2em;\n \
    \ color: #c00;\n}\nh2 {\n  font-size: 1.5em;\n  color: #c00;\n}\n```"
