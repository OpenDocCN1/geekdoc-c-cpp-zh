    ```

    background: #ba945d;

    position: relative;

    z-index: 1;

    }

    ```


    Again, it cannot be stressed enough, especially for beginning CSS developers,
    that the z-index property will not work unless it is applied to a positioned element.


    # JavaScript Usage


    If you want to affect the z-index value of an element dynamically via JavaScript,
    the syntax is similar to how most other CSS properties are accessed, using "camel
    casing" to replace hyphenated CSS properties, as in the code shown below:


    ```

    var myElement = document.getElementById("gold_box");

    myElement.style.position = "relative";

    myElement.style.zIndex = "9999";

    ```'
  - '[PAGE 61]


    In the above code, the CSS syntax "z-index" becomes "zIndex". Similarly,

    "background-color" becomes "backgroundColor", "font-weight" becomes

    "fontWeight", and so on.


    Also, the position property is changed using the above code to again

    emphasize that z-index only works on elements that are positioned.


    # Improper Implementations in IE and Firefox


    Under certain circumstances, there are some small inconsistencies in

    Internet Explorer version 6 and 7 and Firefox version 2 with regards to the

    implementation of the z-index property.


    <SELECT> ELEMENTS IN IE6


    In Internet Explorer 6, the <select> element is a windowed control, so

    will always appear at the top of the stacking order regardless of natural

    stack order, position values, or z-index. This problem is illustrated in the

    screen capture below:


    ![](img/736c504465a39c9f3caa50d5252a3998_61_0.png)'
  - '[PAGE 62]


    The <select> element appears first in the natural stack order and is given a z-index
    value of “1” along with a position value of “relative”. The gold box appears second
    in the stack order, and is given a z-index value of “9999”. Because of natural
    stack order and z-index values, the gold box should appear on top, which it does
    in all currently used browsers except IE6:


    ![](img/736c504465a39c9f3caa50d5252a3998_62_0.png)'
  - '[PAGE 63]


    Unless you''re viewing this page with IE6, you''ll see the gold box above overlapping
    the <select> element.


    This bug in IE6 has caused problems with drop-down menus that fail to overlap
    <select> elements. One solution is to use JavaScript to temporarily hide the <select>
    element, then make it reappear when the overlapping menu disappears. Another solution
    involves using an <iframe>.


    # POSITIONED PARENTS IN IE6/7


    Internet Explorer versions 6 and 7 incorrectly reset the stacking context in relation
    to the nearest positioned ancestor element. To demonstrate this somewhat complicated
    bug, we''ll display two of the boxes again, but this time we''ll wrap the first
    box in a “positioned” element:'
  - '[PAGE 64]


    ![](img/736c504465a39c9f3caa50d5252a3998_64_0.png)


    The grey box has a **z-index** value of “9999”; the blue box has a **z-index**
    value of “1” and both elements are positioned. Therefore, the correct implementation
    is to display the grey box on top of the blue box.


    If you view this page in IE6 or IE7, you''ll see the blue box overlapping the
    grey box. This is caused by the positioned element wrapping the grey box. Those
    browsers incorrectly “reset” the stacking context in relation to the positioned
    parent, but this should not be the case. The grey box has a higher **z-index**
    value, and should therefore be overlapping the blue box. All other browsers render
    this correctly.'
