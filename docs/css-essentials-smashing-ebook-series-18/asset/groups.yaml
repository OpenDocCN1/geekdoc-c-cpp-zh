    \ Here’s an excerpt from the W3C specification:\n\n> The final value of a property\
    \ is the result of a four-step calculation: the value is determined through specification\
    \ (the “specified value”), then resolved into a value that is used for inheritance\
    \ (the “computed value”), then converted into an absolute value if necessary (the\
    \ “used value”), and finally transformed according to the limitations of the local\
    \ environment (the “actual value”).\n\n## IN OTHER WORDS:\n\n- 1. Specified value\n\
    The user agent determines whether the value of the property comes from a style\
