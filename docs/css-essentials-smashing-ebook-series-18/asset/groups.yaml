    4699.post.hentry.category-coding.tag-css h2 a |


    With Safari''s Web Inspector (and Firefox), you can view the computed values of
    a particular element.


    # 5. Conclusion


    Hopefully this article has opened your eyes to (or has refreshed your knowledge
    of) CSS inheritance and specificity. We encourage you to read the articles cited
    below, as well as Smashing Magazine''s previous article on the topic.


    Even if you don''t think about them, these issues are present in your daily work
    as a CSS author. Especially in the case of specificity, it''s important to know
    how they affect your style sheets and how to plan for them so that they cause
    only minimal (or no) problems.'
- md: "\n# Equal Height Column Layouts With Borders And Negative Margins In CSS\n\n\
    Thierry Koblentz\n\n“What? Another \"Equal Height Columns\" article? Enough already!”\
    \ If this is what you think, then think again because this solution is different.\
    \ It does not rely on any of the usual tricks. It does not use images, nor extra\
    \ markup, nor CSS3, nor pseudo-classes, nor Javascript, nor absolute positioning.\
    \ All it uses is border and negative margin. Please note that this article will\
    \ also demonstrate different construct techniques and will brush up on a few concepts.\n\
    \n## 1. Centering columns without a wrapper div\n\nThis layout will be built without\
    \ a wrapper div:\n\n## Two column layout\n\n![](img/736c504465a39c9f3caa50d5252a3998_182_0.png)\n\
    \n### THE BASICS\n\nWe use the background of **body** and the border of one of\
    \ the columns to create background colors that vertically fill the \"row\".\n\n\
    ### THE MARKUP\n\n```html\n<div id=\"header\">\n  <h2><a href=\"#\">Header</a>a</h2>\n\
    \  <p>Lorem ipsum...</p>\n</div>\n<div id=\"sidebar\">\n  <h2><a href=\"#\">Sidebar</a>a</h2>\n\
    \  <p>Lorem ipsum...</p>\n</div>\n<div id=\"main\">\n  <h2><a href=\"#\">Main</a>a</h2>\n\
    \  <p>Lorem ipsum...</p>\n</div>\n<div id=\"footer\">\n  <h2><a href=\"#\">Footer</a>a</h2>\n\
    \  <p>Lorem ipsum...</p>\n</div>\n```\n\n**Tip:** always include links within\
    \ your dummy text to spot stacking context issues.\n\nAbout using body as a wrapper:\n\
    \n- always style html with a background to prevent the background of body from\
    \ extending beyond its boundaries and be painted across the viewport.\n- never\
    \ style html with height: 100% or the background of body will be painted no taller\
    \ than the viewport.\n\n### THE CSS\n\n```css\nhtml {\n  background: #9c9965;\n\
    }\nbody {\n  width: 80%;\n  margin-margin: 20px auto;\n  background: #ffe3a6;\n\
    }\n#header {\n  background: #9c9965;\n}\n#sidebar {\n  float: left;\n  width:\
    \ 200px;\n  background: #d4c37b;\n}\n#main {\n  border-left: 200px solid #d4c37b;\n\
    }\n#footer {\n  clear: left;\n  background: #9c9965;\n}\n```\n\nWhat do these\
    \ rules do exactly?\n\n- We style html with a background to prevent the browser\
    \ from painting the background color of body outside our layout.\n- We style body\
    \ with auto margin to center the layout; the width is set using percentage. The\
    \ background declaration is for #main.\n- We style the background of #header to\
    \ mask the background color of body (the same goes for #footer).\n- The background\
    \ color of #sidebar matches the border color of #main. This is the trick we use\
    \ to make our columns appear as being of equal height.\n- The footer clears any\
    \ previous float so it stays below the columns, at the bottom of the layout.\n\
    \nIf you take a look at this first step, you'll notice that the heading in #sidebar\
    \ is not vertically aligned with the heading in #main and that we have some gap\
    \ at the top and bottom of the #sidebar. This is because of these two containers,\
    \ only one is a block formatting context. So margins do not collapse in #sidebar\
    \ while they do in #main. This also means #main will not contain floats and that\
    \ applying clear:left to any nested element there will clear #sidebar as well.\n\
    \nSo to prevent any float and margin collapsing issues we make all the main boxes\
    \ block formatting contexts.\n\n```css\n#header,\n#footer {\n  overflow: hidden;\n\
    \  zoom: 1;\n}\n#main {\n  float: left;\n}\n#sidebar {\n  margin-right: -200px;\n\
    }\n```\n\nNote: if things look a bit different in IE 6 and 7 it is because in\
    \ these browsers default margins do collapse inside block-formatting contexts.\
    \ The following should also be considered:\n\n- **overflow and zoom** on **#header**\
    \ and **#footer** make these elements new block formatting contexts.\n- For **#main**\
    \ we use **float** rather than **overflow** to prevent potential issues if we\
    \ had to offset some nested content.\n- The negative margin keeps **#main** into\
    \ place because now that it is a float, its border box connects **next** to the\
    \ margin box of **#sidebar** (the negative value must match the dimension of the\
    \ said box).\n\nIf you look at the second step, you'll see that the border of\
    \ **#main** hides **#sidebar**. This is because of the stacking context. In the\
    \ flow (tree order), **#main** comes after **#sidebar** so the former overlaps\
    \ the latter.\n\nPositioning **#sidebar** brings it up in the stack.\n\n```css\n\
    #sidebar {\n  position: relative;\n}\n```\n\n**Note:** if you make #main a new\
    \ containing block you'll revert to the original order. In this case, you'll need\
    \ to use z-index to keep #sidebar on top of #main.\n\nIf you look at step three,\
    \ you'll see that we are almost there. The last things to do are cosmetic.\n\n\
    ## 2. Creating a 2-col-layout with borders\n\nWe'll build this one with a single\
    \ wrapper, and we want to paint the vertical border between the columns. The background\
    \ of the wrapper is used to paint the background of one column, while its left\
    \ border is used to paint the background of the other column. This is done by\
    \ overlapping the right border of the left column with the left border of the\
    \ right column. Note: if you have a fixed width layout (vs. fluid like here),\
    \ then the wrapper can be used to create the two backgrounds as well. This means\
    \ the content box is one pixel wide and negative margins are used to pull the\
    \ columns into place.\n\n```html\n<div id=\"header\">\n  <h2><a href=\"#\">Header</a>a</h2>\n\
    \  <p>Lorem ipsum...</p>\n</div>\n<div id=\"wrapper\">\n  <div id=\"sidebar\"\
    >\n    <h2><a href=\"#\">Sidebar</a>a</h2>\n    <p>Lorem ipsum...</p>\n  </div>\n\
    \  <div id=\"main\">\n    <h2><a href=\"#\">Main</a>a</h2>\n    <p>Lorem ipsum...</p>\n\
    \  </div>\n</div>\n<div id=\"footer\">\n  <h2><a href=\"#\">Footer</a>a</h2>\n\
    \  <p>Lorem ipsum...</p>\n</div>\n```\n\nTo which we added a stylesheet link to\
    \ \"base.css\" and then added these rules:\n\n```css\nhtml {\n  height: auto;\n\
    }\nbody {\n  width: 80%;\n  margin: 20px auto;\n  background: #ffe3a6;\n}\n#header,\n\
    #footer {\n  padding-bottom: 2em;\n  background: #9c9965;\n}\n#wrapper {\n  display:\
    \ inline-block;\n  border-left: 200px solid #d4c37b;\n  position: relative;\n\
    }\n#sidebar {\n  margin-left: -200px;\n  position: relative;\n}\n#main {\n  float:\
    \ left;\n}\n```\n"
  mdcn: "\n\n# 使用 边框和负边距实现等高列布局\n\nThierry Koblentz\n\n“什么？又另一篇关于‘等高列’的文章？够了！”如果你是这么想的，请重新考虑，因为这个解决方案是不同的。它不依赖于任何常用的技巧。它没有使用图片、额外的标记、CSS3、伪类、JavaScript\
    \ 或是绝对定位。它所使用的仅仅是边框和负边距。请注意，本文还将演示不同的构建技术，并复习几个概念。\n\n## 1. 在不使用包装 div 的情况下居中列\n\
    \n此布局将在不使用包装 div 的情况下构建：\n\n## 两栏布局\n\n![](img/736c504465a39c9f3caa50d5252a3998_182_0.png)\n\
    \n### 基础知识\n\n我们使用 **body** 的背景和其中一列的边框来创建垂直填充“行”的背景颜色。\n\n### 标记结构\n\n```html\n\
    <div id=\"header\">\n  <h2><a href=\"#\">Header</a>a</h2>\n  <p>Lorem ipsum...</p>\n\
    </div>\n<div id=\"sidebar\">\n  <h2><a href=\"#\">Sidebar</a>a</h2>\n  <p>Lorem\
    \ ipsum...</p>\n</div>\n<div id=\"main\">\n  <h2><a href=\"#\">Main</a>a</h2>\n\
    \  <p>Lorem ipsum...</p>\n</div>\n<div id=\"footer\">\n  <h2><a href=\"#\">Footer</a>a</h2>\n\
    \  <p>Lorem ipsum...</p>\n</div>\n```\n\n**提示：** 始终在你的虚拟文中包含链接，以便发现堆叠上下文（stacking\
    \ context）问题。\n\n关于使用 body 作为包装器：\n\n- 始终为 html 设置背景，以防止 body 的背景超出其边界并绘制在整个视口上。\n\
    - 永远不要为 html 设置 `height: 100%`，否则 body 的背景高度将不会超过视口。\n\n### CSS\n\n```css\nhtml\
    \ {\n  background: #9c9965;\n}\nbody {\n  width: 80%;\n  margin-margin: 20px auto;\n\
    \  background: #ffe3a6;\n}\n#header {\n  background: #9c9965;\n}\n#sidebar {\n\
    \  float: left;\n  width: 200px;\n  background: #d4c37b;\n}\n#main {\n  border-left:\
    \ 200px solid #d4c37b;\n}\n#footer {\n  clear: left;\n  background: #9c9965;\n\
    }\n```\n\n这些规则具体的作用是什么？\n\n- 我们为 html 设置了背景，以防止浏览器在我们的布局之外绘制 body 的背景颜色。\n- 我们为\
    \ body 设置自动外边距来居中布局；宽度使用百分比设置。背景声明是给 #main 使用的。\n- 我们设置 #header 的背景以遮盖 body 的背景颜色（#footer\
    \ 也是如此）。\n- #sidebar 的背景颜色与 #main 的边框颜色匹配。这是我们用来让列看起来等等高的技巧。\n- 页脚清除除了任何之前的浮动元素，使其保持在列的下方，位于布局的底部。\n\
    \n如果你看这一步，你会发现 #sidebar 中的标题与 #main 中的标题没有在垂直对齐，并且我们在 #sidebar 的顶部和底部有一些间隙。这是因为这两个容器中，只有一个是块级格式化上下文（block\
    \ formatting context）。因此，边距在 #sidebar 中不会塌陷，而在 #main 中会塌陷。这意味着 #main 不包含浮动元素，且在其中任何嵌套元素上应用\
    \ `clear:left` 也会清除 #sidebar。\n\n所以，为了防止任何浮动和边距塌陷，我们对 #main 使用了块级格式化上下文。\n\n```css\n\
    #header,\n#footer {\n  zoom: 1;\n}\n#main {\n  overflow: hidden;\n  float: left;\n\
    }\n```\n\n注意：在 IE 6 和 7 中，由于这些块级格式化上下文，看起来会有所不同。使用负边距将 #main 移位。\n\n```css\n#sidebar\
    \ {\n  margin-right: -200px;\n}\n```\n\n如果你看第二步，你会发现 #main 的边框遮盖了 #sidebar。这是因为堆叠上下文（stacking\
    \ context）。\n\n```css\n#sidebar {\n  position: relative;\n}\n```\n\n如果你看第三步，你会发现我们已经快完成了。最后剩下的工作是装饰性的。\n\
    \n## 2. 使用边框创建两栏布局\n\n我们将使用单个包装器来构建这个，并希望绘制列之间的垂直边框。包装器的背景用于绘制一列的背景，而其左边框用于绘制另一列的背景。这是通过让左列的右边框与右列的左边框叠加来实现。注意：如果你使用的是固定宽度布局（而不是这里的流式），那么包装器也可以创建两个背景。这意味着内容框是单宽的，并使用负边距将列拉到到位。\n\
    \n```html\n<div id=\"header\">\n  <h2><a href=\"#\">Header</a>a</h2>\n  <p>Lorem\
    \ ipsum...</p>\n</div>\n<div id=\"wrapper\">\n  <div id=\"sidebar\">\n    <h2><a\
    \ href=\"#\">Sidebar</a>a</h2>\n    <p>Lorem ipsum...</p>\n  </div>\n  <div id=\"\
    main\">\n    <h2><a href=\"#\">Main</a>a</h2>\n    <p>Lorem ipsum...</p>\n  </div>\n\
    </div>\n<div id=\"footer\">\n  <h2><a href=\"#\">Footer</a>a</h2>\n  <p>Lorem\
    \ ipsum...</p>\n</div>\n```\n\n我们向其添加了指向 \"base.css\" 的样式表链接，然后添加了这些规则：\n\n```css\n\
    html {\n  height: auto;\n}\nbody {\n  width: 80%;\n  margin: 20px auto;\n  background:\
    \ #ffe3a6;\n}\n#header,\n#footer {\n  padding-bottom: 2em;\n  background: #9c9965;\n\
    }\n#wrapper {\n  display: inline-block;\n  border-left: 200px solid #d4c37b;\n\
    \  position: relative;\n}\n#sidebar {\n  margin-left: -200px;\n  position: relative;\n\
    }\n#main {\n  float: left;\n}\n```\n\n"
