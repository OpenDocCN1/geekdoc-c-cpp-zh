    \ li span {\n  background-image: none;\n  height: auto;\n  width: auto;\n}\n.smashui\
    \ .ui-tabs-nav li ui-tabs-default.include.361034857.css:1\nselected a strong {\n\
    \  background-position: -1550px -415px !important;\n  outline: none;\n}\n.smashui\
    \ .ui-tabs-nav li a strong default.include.361034857.css:1\n```\n\n# OVERRIDE\
    \ INLINE STYLES IN USER-GENERATED CONTENT\n\nOne frustrating aspect of CSS development\
    \ is when user-generated content includes inline styles, as would occur with WYSIWYG\
    \ editors in CMS. In the CSS cascade, inline styles will override regular styles,\
    \ so any undesirable styling that occurs through generated content will be difficult,\
    \ if not impossible, to change using custom CSS rules. You can circumvent this\
    \ problem using an !important declaration, because a CSS rule with !important\
    \ in an author stylesheet will override inline CSS.\n\n# FOR PRINT STYLESETS\n\
    \nAlthough this wouldn't be necessary in all cases, and might be discouraged in\
    \ some cases for the same reasons mentioned earlier, you could add !important\
    \ declarations to your print-only stylesheets to help override specific styles\
    \ without having to repeat selector specificity.\n\n# FOR UNIQUELY-DESIGNED BLOG\
    \ POSTS\n\nIf you've dabbled in uniquely-designed blog posts (many designers take\
    \ issue with using “art direction” for this technique, and rightly so), as showcased\
    \ on Heart Directed, you'll know that such an undertaking each uniquely-designed\
    \ article to have its own stylesheet, or else you need to use inline styles. You\
    \ can give an individual page its own styles using the code presented in this\
    \ article on the Digging Into WordPress blog.\n\nThe use of **important** can\
    \ come in handy in such instance, allowing you to easily override the default\
    \ styles in order to create a unique experience for a single blog post or page\
    \ on your site, without having to worry about natural CSS specificity.\n\n# Conclusion\n\
    \n**important** declarations are best reserved for special needs and users who\
    \ want to make web content more accessible by easily overriding default user agent\
    \ or author stylesheets. So you should do your best to give your CSS proper foresight\
    \ and avoiding using **important** wherever possible. Even in many of the users\
    \ described above, the inclusion of **important** is not always necessary.\n\n\
    Nonetheless, **important** is valid CSS. You might inherit a project wherein the\
    \ previous developers used it, or you might have to patch something quickly —\
    \ so it could come in handy. It’s certainly beneficial to understand better and\
    \ be prepared to use it should the need arise.\n\nDo you ever use **important**\
    \ in your stylesheets? When do you do so? Are there any other circumstances you\
    \ can think of that would require its use?\n\n# CSS Sprites Revisited\n\nNiels\
    \ Matthijs\n\nI'm pretty confident that I won't surprise anyone here by saying\
    \ that CSS sprites have been around for quite a while now, rearing their somewhat\
    \ controversial heads in the Web development sphere as early as 2003.\n\nStill,\
    \ the CSS sprite hasn't truly found its way into the everyday toolkit of the common\
    \ Web developer. While the theory behind CSS sprites is easy enough and its advantages\
    \ are clear, they still prove to be bothersome to implement, especially when time\
    \ is short and deadlines are looming. Barriers exist to be breached, though, and\
    \ we're not going to let a couple of tiny bumps in the road spoil the greater\
    \ perks of the CSS sprite.\n\nIf you want more background information on best\
    \ practices and practical cases, definitely read \"The Mystery of CSS Sprites:\
    \ Techniques and Practical Cases.\" If you're the defensive type, I would recommend\
    \ \"CSS Sprites: Useful Technique or Potential Nuisance?\" which discusses why\
    \ CSS sprites have such a hard time getting acceptance.\n\nSo, let's look for\
    \ an easier way to target images while making sure the resulting sprite is not\
    \ substantially bigger than the sum of its individual images.\n\n# The Problem\
    \ With Sprites\n\nIf you look online for examples of CSS sprites, you'll see that\
    \ most are optimized for an ideal use of real estate—gaps between images are kept\
    \ to a minimum in order to keep the load of the entire sprite as low as possible.\
    \ This reduces loading time considerably when the image is first downloaded, but\
    \ it also introduces those horrible image coordinates that we mentioned earlier.\
    \ So, why not take a slightly different approach? Let's look for an easier way\
    \ to target images while making sure the resulting sprite is not substantially\
    \ bigger than the sum of its individual images.\n\nI'm always struggling to find\
    \ the correct position within a sprite, especially when the image is at **x: 259,\
    \ y: 182** and measures 17×13 pixels. I'm always switching back and forth between\
    \ Photoshop and my CSS editor to write down the values, getting more and frustrated\
    \ with every switch. I know software is out there specifically tailored to help\
    \ deal with this, I've never found an application that lets me properly structure\
    \ its output so I can just copy and paste it into my file.\n\nAnother important\
    \ thing to realize is that CSS sprites are meant to be one part of our optimization\
    \ toolkit. Many of the people who write and blog about CSS sprites are comfortably\
    \ wearing their optimization hats while laying out best practices, often going\
    \ a little overboard and losing track of how much effort it requires to implement\
    \ their methods.\n\nThis is fine if you're working on an optimization project,\
    \ but it becomes counterproductive when you need to build a website from scratch\
    \ fighting tight deadlines. If you have time to truly focus on implementing a\
    \ CSS sprite, it's really not all that hard; but if you have to juggle 50 other\
