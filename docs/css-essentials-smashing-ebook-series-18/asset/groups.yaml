    \n- **background-clip: border-box;** 背景显示在边界下方。\n- **background-clip: padding-box;**\
    \ 显示在内边距下方，不包括边界。\n- **background-clip: content-box;** 仅显示在内容下方，不包括边界或内边距。\n\n\
    ## 背景起点 (BACKGROUND ORIGIN)\n\n这与 **background-position** 配合使用。你可以让 **background-position**\
