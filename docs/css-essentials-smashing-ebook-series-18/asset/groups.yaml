- md: "\n- **Font replacement techniques**: These free techniques, such as sIFR and\
    \ Cuf, do not make use of `@font-face`, but instead use scripting and/ or Flash\
    \ to display fonts that are not on the user’s machine. None of them directly address\
    \ the licensing issue, but none of them link directly to ready-to-use fonts, so\
    \ copyright legality is not clear-cut.\n\n# Conclusion\n\nYou're now equipped\
    \ with the basic knowledge and a slew of links to create modern CSS-based web\
    \ pages that are progressively enriched, adaptive to diverse users, modular, efficient,\
    \ and typographically rich. Go out and create great, modern work!\n\n# Writing\
    \ CSS For Others\n\nHarry Roberts\n\nI think a lot of us CSS authors are doing\
    \ it wrong. We are selfish by nature; we get into our little bubbles, writing\
    \ CSS (as amazing as it may be) with only ourselves in mind. How many times have\
    \ you inherited a CSS file that's made you say “WTF” at least a dozen times?\n\
    \n![](img/736c504465a39c9f3caa50d5252a3998_143_0.png)\n\n(Image: Toca Boca)\n\n\
    HTML has a standard format and syntax that everyone understands. For years, programmers\
    \ have widely agreed on standards for their respective languages. CSS doesn't\
    \ seem to be there yet: everyone has their own favorite format, their own preference\
    \ between single-line and multi-line, their own ideas on organization, and so\
    \ on.\n\n# A New Way of Thinking\n\nRecently, I have begun to think that CSS authors\
    \ could take a leaf from the programmers' book. We need to write CSS that others\
    \ can understand and use with ease. Programmers have been writing sharable code\
    \ since day one, and it's high time that CSS be written with as much organization\
    \ and openness.\n\nIn inuit.css and working on a huge front-end framework at my\
    \ job, it has become more apparent to me that writing code that can be easily\
    \ picked up by others is extremely important. I wouldn't say that I've nailed\
    \ everything yet, but I'll share with you some things that I think are vital when\
    \ writing code, specifically CSS, that will be used by others.\n\nFirst, the reasoning:\
    \ my number one tip for developers is to always code you're working in a team,\
    \ even when you're not. You may be the only developer on your project right now,\
    \ but it might not stay that way:\n\n- Your project could be taken to another\
    \ developer, agency or team. Even though this is not the best situation to find\
    \ yourself in, handing over your work smoothly and professionally to others is\
    \ ideal.\n\n- If you're doing enough work to warrant employing someone else or\
    \ expanding the team at all, then your code ceases to be yours and becomes the\
    \ team's.\n\n- You could leave the company, take a vacation or be off sick, at\
    \ which point someone else will inherit your code, even if only temporarily.\n\
    \n- Someone will inevitably poke through your source code, and if they've never\
    \ met you, this could be the only basis on which they judge your work. First impressions\
    \ count!\n\n# Comments Are King!\n\nOne thing I've learned from building a massive\
    \ front-end framework at and from producing inuit.css is that comments are vital.\
    \ Comments, comments, comments. Write one line of code, then write about it. N.B.\
    \ This is not meant to write about every line of code, as that would be overkill.\
    \ Only comment where it helps/is useful.\n\nIt might seem like overkill at first,\
    \ but write about everything you do. The code might look simple to you, but there's\
    \ bound to be someone out there who has no idea what it does. Write it down. I\
    \ had already gotten into this habit when I realized that this was the same technique\
    \ as a good friend and incredibly talented developer, Nick Payne, told me about.\
    \ That technique is “rubber-duck debugging”\n\n> an unnamed expert programmer\
    \ would keep a rubber duck by his desk at all times, and debug his code by forcing\
