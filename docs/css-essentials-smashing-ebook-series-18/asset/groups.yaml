    \n如你所示，多列属性可以与分页媒体生成内容、区域和排除项结合使用。但网格、Flexbox 和区域是互斥的（即如果一个元素是网格，它就不能是 Flexbox\
    \ 或区域）。请注意，正如 Alan Stearns 在评论中所说，虽然网格容器不能是 Flexbox 或区域，但网格单元可以变成区域。\n\n## 在你急于在客户端项目中使用之前的注意事项\n\
    \n规范一直在不断变化，所以在使用它们时要小心。除了多列之外，我建议仅在个人项目和演示中使用这些属性。此外，由于它们仍然不稳定，所有这些属性都带有厂商前缀，这意味着你需要根据支持情况添加每个前缀。\n\
