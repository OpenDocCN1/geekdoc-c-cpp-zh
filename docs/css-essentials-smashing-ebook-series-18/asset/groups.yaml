    \nThe photo above shows the “Readers’ sites” section of .net magazine, which displays\
    \ 3 readers’ photos each aligned left in their respective columns with text wrapping\
    \ around the aligned images. That is the basic idea behind the float property\
    \ in CSS layouts, and demonstrates one of the ways it has been used in table-less\
    \ design.\n\nThe effectiveness of using floats in multi-columned layouts was explained\
    \ by Douglas Bowman in 2004 in his classic presentation No More Tables:\n\n##\
    \ Floats on Stopdesign\n\n![](img/736c504465a39c9f3caa50d5252a3998_26_0.png)\n\
    \nNo More Tables\n\nBowman explained the principles behind table-less design,\
    \ using Microsoft's old site as a case study. Floats were used prominently in\
    \ his mock overhaul of the Microsoft layout.\n\n## SYNTAX\n\nThe float CSS property\
    \ can accept one of 4 values: left, right, none, and inherit. It is declared as\
    \ shown in the code below.\n\n```\n#sidebar {\n  float: left;\n}\n```\n\nThe most\
    \ commonly-used values are left and right. A value of none the default, or initial\
    \ float value for any element in an HTML page. The value inherit, which can be\
    \ applied to nearly any CSS property, does not work in Internet Explorer versions\
    \ up to and including 7.\n\nThe float property does not require the application\
    \ of any other property on a CSS element for float to function correctly, however,\
    \ float will work more effectively under specific circumstances.\n\nGenerally,\
    \ a floated element should have an explicitly set width (unless it is a replaced\
    \ element, like an image). This ensures that the float behaves as expected and\
    \ helps to avoid issues in certain browsers.\n\n```\n#sidebar {\n  float: left;\n\
    \  width: 350px;\n}\n```\n\n## SPECIFICS ON FLOATED ELEMENTS\n\nFollowing is a\
    \ list of exact behaviors of floated elements according to CSS2 Specifications:\n\
    \n- A left-floated box will shift to the left until its leftmost margin edge (or\
    \ border edge if margins are absent) touches either the edge of the containing\
    \ block, or the edge of another floated box\n- If the size of the floated box\
    \ exceeds the available horizontal space, the floated box will be shifted down\n\
    - Non-positioned, non-floated, block-level elements act as if the floated element\
    \ is not there, since the floated element is out of flow in relation to other\
    \ block elements\n- Margins of floated boxes do not collapse with margins of adjacent\
    \ boxes\n- The root element (<html>) cannot be floated\n- An inline element that\
