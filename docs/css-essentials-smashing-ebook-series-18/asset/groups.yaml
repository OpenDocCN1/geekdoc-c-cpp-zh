    Nicolas Gallagher used pseudo-elements to create 84 GUI icons created from semantic
    HTML.


    To complement this exposure (and take advantage of a growing trend), I''ve put
    together what I hope is a fairly comprehensive run-down of pseudo-elements. This
    article is aimed primarily at those of you who have seen some of the cool things
    done with pseudo-elements but want to know what this CSS technique is all about
    before trying it.


    Although the CSS specification contains other pseudo-elements, I''ll focus on
    :**before and :**after. So, for brevity, I''ll say “pseudo-elements” to refer
    generally to these particular two.'
  - "[PAGE 226]\n\n# What Does A Pseudo-Element Do?\n\nA pseudo-element does exactly\
    \ what the word implies. It creates a phony element and inserts it before or after\
    \ the content of the element that you've targeted.\n\nThe word \"pseudo\" is a\
    \ transliteration of a Greek word that basically means \"lying, deceit, false.\"\
    \ So, calling them pseudo-elements is appropriate, because they don't actually\
    \ change anything in the document. Rather, they insert ghost-like elements that\
    \ are visible to the user and that are style-able in the CSS.\n\n# Basic Syntax\n\
    \nThe :before and :after pseudo-elements are very easy to code (as most CSS properties\
    \ that don't require a ton of vendor prefixes). Here is a simple example:\n\n\
    ```\n#example:before {\n  content: \"#\";\n}\n#example:after {\n  content: \"\
    .\";\n}\n```\n\nThere are two things to note about this example. First, we're\
    \ targeting the same element using #example:before and #example:after. Strictly\
    \ speaking, they are the pseudo-elements in the code.\n\nSecondly, without the\
    \ content property, which is part of the generated content module in the specification,\
    \ pseudo-elements are useless. So, while the pseudo-element selector itself is\
    \ needed to target the element, you won't be able to insert anything without adding\
    \ the content property."
- md: "\nIn this example, the element with the id example will have a hash symbol\
    \ placed “before” its content, and a period (or full stop) placed “after” its\
    \ content.\n\n## SOME NOTES ON THE SYNTAX\n\nYou could leave the content property\
    \ empty and just treat the pseudo-element content-less box, like this:\n\n```\n\
    #example:before {\n  content: \"\"\n  display: block;\n  width: 100px;\n  height:\
    \ 100px;\n}\n```\n\nHowever, you can't remove the content property altogether.\
    \ If you did, the pseudo-element wouldn't work. At the very least, the content\
    \ property needs empty quotes as its value.\n\nYou may have noticed that you can\
    \ also code pseudo-elements using the double-colon syntax (::before and ::after),\
    \ which I've discussed before that there is no difference between the two syntaxes;\
    \ it's just a way to differentiate pseudo-elements (double colon) from pseudo-classes\
    \ (single colon) in CSS3.\n\nOne final point regarding the syntax. Technically,\
    \ you could implement a pseudo-element universally, without targeting any element,\
    \ like this:\n\n```\n:before {\n  content: \"#\"\n}\n```\n\nWhile the above is\
    \ valid, it's pretty useless. The code will insert a hash symbol before the content\
    \ in each element in the DOM. Even if you removed the body> tag and all of its\
    \ content, you'd still see two hash symbols on the page: one in the <html> element,\
    \ and one in the <body> tag, which the browser automatically constructs.\n\n##\
    \ Characteristics Of Inserted Content\n\nAs mentioned, the content that is inserted\
    \ is not visible in the page's source. It's visible only in the CSS.\n\nAlso,\
    \ the inserted element is by default an inline element (or, in HTML5 terms, in\
    \ the category of text-level semantics). So, to give the inserted element a height,\
    \ padding, margins and so forth, you'll usually have to define it explicitly as\
    \ a block-level element.\n\nThis leads well into a brief description of how to\
    \ style pseudo-elements. Look at this graphic from my text editor:\n\n```\n#element:before\
    \ {\n  content: \"#\";\n  display: block;\n  width: 200px;\n  height: 200px;\n\
    }\n#element:after {\n  content: \".\";\n  display: block;\n  width: 200px;\n \
    \ height: 200px;\n}\n```\n\nIn this example, I've highlighted the styles that\
    \ will be applied to the elements inserted before and after the targeted element’s\
    \ content. Pseudoelements are somewhat unique in this way, because you insert\
    \ the content and the styles in the same declaration block.\n\nAlso note that\
    \ typical CSS inheritance rules apply to the inserted elements. If you had, for\
    \ example, a font stack of Helvetica, Arial, sans-serif applied to the body> element\
    \ of the document, then the pseudo-element would inherit that stack that are the\
    \ same as any other element.\n\nLikewise, pseudo-elements don’t inherit styles\
    \ that aren’t naturally inherited from parent elements (such as padding and margins).\n\
    \n## Before Or After What?\n\nYour hunch on seeing the :before and :after pseudo-elements\
    \ might be that the inserted content will be injected before and after the targeted\
    \ element. But, as alluded to above, that's not the case.\n\nThe content that's\
    \ injected will be child content in relation to the targeted element, but it will\
    \ be placed “before” or “after” any other content in that element.\n\nTo demonstrate\
    \ this, look at the following code. First, the HTML:\n\n```\n<p class=\"box\"\
    >Other content.</p>\n```\n\nAnd here's the CSS that inserts a pseudo-element:\n\
    \n```\np.box {\n  width: 300px;\n  border: solid 1px white;\n  padding: 20px;\n\
    }\n\np.box:before {\n  content: \"#\";\n  border: solid 1px white;\n  padding:\
    \ 2px;\n  margin: 0 10px 0;\n}\n```\n\nIn the HTML, all you would see is a paragraph\
    \ with a class of box, with the words “Other content” inside it (the same as what\
    \ you would see if you viewed the source on the live page). In the CSS, the paragraph\
    \ is given a set width, along with some padding and a visible border.\n\nThen\
    \ we have the pseudo-element. In this case, it's a hash symbol inserted “before”\
    \ the paragraph’s content. The subsequent CSS gives it a border, along with some\
    \ padding and margins.\n\nHere’s the result viewed in the browser:\n\n![](img/736c504465a39c9f3caa50d5252a3998_231_0.png)\n\
    \nThe outer box is the paragraph. The border around the hash symbol denotes the\
    \ boundary of the pseudo-element. So, instead of being inserted “before” the paragraph,\
    \ the pseudo-element is placed before the “Other content” in the paragraph.\n\n\
    ## Inserting Non-Text Content\n\nI mentioned briefly that you can leave the content\
    \ property’s value as an empty string or insert text content. You basically have\
    \ two additional options of what to include as the value of the content property.\n\
    \nFirst, you can include a URL that points to an image, just as you would do when\
    \ including a background image in the CSS:\n\n```\np:before {\n  content: url(image.jpg);\n\
    }\n```\n\nNotice that the quotes are missing. If you wrapped the URL reference\
    \ in quotes, then it would become a literal string and insert the text “url(image.jpg)”\
    \ as the content, instead of inserting the image itself.\n\nNaturally, you could\
    \ include a Data URI in place of the image reference, just as you can with a CSS\
    \ background.\n\nYou also have the option to include a function in the form of\
    \ attr(X). This function, according to the spec, “returns a string as the value\
    \ of attribute X for the subject of the selector.\n\nHere’s an example:\n\n```\n\
    a:after {\n  content: attr(href);\n}\n```\n\nWhat does the attr() function do?\
    \ It takes the value of the specified attribute and places it as text content\
    \ as a pseudo-element.\n\nThe code above would cause the href value of every <a>\
    \ element on the page to be placed immediately after each respective <a> element.\
    \ This could be used in a print style sheet to include full URLs next to all links\
    \ when a document is printed.\n\nYou could also use this function to grab the\
    \ value of an element’s attribute. While being able to grab the title text of\
    \ an image and display it on the page as a pseudo-element remember that the pseudo-element\
    \ must be a child of the element to which it is applied. Images, which are void\
    \ (empty) elements, don’t have child elements, so it wouldn’t work in this case.\
    \ The same would apply to other void elements, such as <input>.\n\n## Dreaded\
    \ Browser Support\n\nAs with any front-end technology that is gaining momentum,\
    \ one of the first concerns is browser support. In this case, that’s not much\
    \ of a problem.\n\nBrowser support for :before and :after pseudo-elements stacks\
    \ up like this:\n\n- Chrome 2+\n- Firefox 3.5+ (3.0 had partial support)\n- Safari\
    \ 1.3+\n- Opera 9.2+\n- IE8+ (with some minor bugs)\n- Pretty all mobile browsers\n\
    \nThe only real problem (no surprise) is IE6 and IE7, which have no support. So,\
    \ if your audience is in the Web development niche (or another market that has\
    \ low IE numbers), you can probably go ahead and use pseudo-elements freely.\n\
    \n## PSEUDO-ELEMENTS ARE'T CRITICAL\n\nAs mentioned, pseudo-element content does\
    \ not appear in the DOM. These elements are not real elements. As such, they are\
    \ not accessible to most assistive devices. So, never use pseudo-elements to generate\
    \ content that is critical to the usability or accessibility of your pages.\n\n\
    Another thing to keep in mind is that developer tools such as Firebug do not show\
    \ the content generated by pseudo-elements. So, if overused, pseudo-elements cause\
    \ maintainability headaches and make debugging a much slower process.\n\n(Update):\
    \ you can use Chrome’s developer tools to view the styles associated with a pseudo-element,\
    \ but the element will not appear in the DOM. Also, Firebug is adding pseudo-element\
    \ support in version 1.8.)\n\nThat covers all of the concepts you need in order\
    \ to create something practical with this technique. In the meantime, for further\
    \ reading on CSS pseudo-elements, be sure to check out some of the articles that\
    \ we’ve linked to this piece.\n"
  mdcn: "\n在这个示例中，id 为 `example` 的元素将在其内容“之前”放置一个哈希符号（#），并在内容“之后”放置一个句号（或全角点）。\n\n\
    ## 关于语法的若干注意事项\n\n你可以将 `content` 属性留空，并仅将伪元素视为一个没有内容的框，如下所示：\n\n```\n#example:before\
    \ {\n  content: \"\"\n  display: block;\n  width: 100px;\n  height: 100px;\n}\n\
    ```\n\n但是，你不能完全删除 `content` 属性。如果你删除了，伪元素将无法生效。至少，`content` 属性需要一个空引号作为其值。\n\n\
    你可能已经注意到，你也可以使用双冒号语法（`::before` 和 `::after`）来编写伪元素，正如我之前讨论过的，这两种语法之间没有区别；它只是在\
    \ CSS3 中区分伪元素（双冒号）和伪类（单冒号）的一种方式。\n\n关于语法的最后一点。从技术上讲，你可以通用地实现一个伪元素，而不针对任何特定元素，如下所示：\n\
    \n```\n:before {\n  content: \"#\"\n}\n```\n\n虽然上面的代码是有效的，但它几乎毫无用处。代码会在 DOM 中每个元素的内容之前插入一个哈希符号。即使你删除了\
    \ `<body>` 标签及其所有内容，你仍然会在页面上看到两个哈希符号：一个在 `<html>` 元素中，另一个在浏览器自动构建的 `<body>` 标签中。\n\
    \n## 插入内容的特征\n\n如前所述，所插入的内容在页面的源代码中是不可见的。它只在 CSS 中可见。\n\n此外，插入的元素默认是行内元素（或者说，在\
    \ HTML5 术语中，属于文本级语义分类）。因此，为了给插入的元素设置高度、内边距（padding）、外边距（margins）等，通常需要显式地将其定义为块级元素。\n\
    \n这正好引出了如何为伪元素设置样式的简单描述。看看我编辑器中的这张图：\n\n```\n#element:before {\n  content: \"\
    #\";\n  display: block;\n  width: 200px;\n  height: 200px;\n}\n#element:after\
    \ {\n  content: \".\";\n  display: block;\n  width: 200px;\n  height: 200px;\n\
    }\n```\n\n在这个示例中，我突出了将应用到目标元素内容之前和之后插入的元素的样式。伪元素在这一方面是相当独特的，因为你在同一个声明块中插入了内容和样式。\n\
    \n同时请注意，典型的 CSS 继承规则也适用于插入的元素。例如，如果你对文档的 `<body>` 元素应用了 `Helvetica, Arial, sans-serif`\
    \ 字体族，那么伪元素将继承该字体族，这与其他任何元素都是一样的。\n\n同样，伪元素不会继承那些无法从父元素自然继承的样式（如内边距和外边距）。\n\n\
    ## 在什么之前或之后？\n\n当你看到 `:before` 和 `:after` 伪元素时，你的直觉可能是插入的内容将注入到目标元素之前和之后。但正如上面提到的，事实并非如此。\n\
    \n注入的内容相对于目标元素来说是子内容，但它会被放置在该元素元素内任何其他内容的“之前”或“之后”。\n\n为了演示这一点，请看以下代码。首先是 HTML：\n\
    \n```html\n<p class=\"box\">其他内容。</p>\n```\n\n这里是插入伪元素的 CSS：\n\n```css\np.box\
    \ {\n  width: 300px;\n  border: solid 1px white;\n  padding: 20px;\n}\n\np.box:before\
    \ {\n  content: \"#\";\n  border: solid 1px white;\n  padding: 20px;\n}\n\np.box:after\
    \ {\n  content: \".\";\n  border: solid 1px white;\n  padding: 20px;\n}\n```\n\
    \n当你看到 `:before` 和 `:after` 伪元素时，你的直觉可能是正确的。上面的代码会在 DOM 中每个元素的内容之前插入一个哈希符号。即使你删除了\
    \ `<body>` 标签及其所有内容，你仍然会在页面上看到两个哈希符号：一个在 `<html>` 元素中，一个在浏览器自动构建的 `<body>` 标签中。*（注：此处原文似乎有重复，已根据语意整合翻译）*\n\
    \n插入的内容将注入到目标元素之前和之后。但正如上面提到的，事实并非如此。\n\n注入的内容相对于目标元素来说是子内容，但它会被放置在该元素内任何其他内容的“之前”或“之后”。\n\
    \n为了演示这一点，请看以下代码。首先是 HTML：\n\n```html\n<p class=\"box\">其他内容。</p>\n```\n\n这里是插入伪元素的\
    \ CSS：\n\n```css\np.box {\n  width: 300px;\n  border: solid 1px white;\n  padding:\
    \ 20px;\n}\n\np.box:before {\n  content: \"#\";\n  border: solid 1px white;\n\
    \  padding: 20px;\n}\n\np.box:after {\n  content: \".\";\n  border: solid 1px\
    \ white;\n  padding: 20px;\n}\n```\n\n在这个示例中，我突出了将应用到目标元素内容之前和之后插入的元素的样式。伪元素在这一方面是相当独特的，因为你在同一个声明块中插入了内容和样式。\n\
    \n同时请注意，典型的 CSS 继承规则也适用于插入的元素。例如，如果你对文档的 `<body>` 元素应用了 `Helvetica, Arial, sans-serif`\
    \ 字体族，那么伪元素将继承该字体族，这与其他任何元素都是一样的。\n\n同样，伪元素不会继承那些无法从父元素自然继承的样式（如内边距和外边距）。\n\n\
    ## 在什么之前或之后？\n\n当你看到 `:before` 和 `:after` 伪元素时，你的直觉可能是插入的内容将注入到目标元素之前和之后。但正如上面提到的，事实并非如此。\n\
    \n注入的内容相对于目标元素来说是子内容，但它会被放置在该元素内任何其他内容的“之前”或“之后”。\n\n为了演示这一点，请看以下代码。首先是 HTML：\n\
    \n```html\n<p class=\"box\">其他内容。</p>\n```\n\n这里是插入伪元素的 CSS：\n\n```css\np.box\
    \ {\n  width: 300px;\n  border: solid 1px white;\n  padding: 20px;\n}\n\np.box:before\
    \ {\n  content: \"#\";\n  border: solid 1px white;\n  padding: 20px;\n}\n\np.box:after\
    \ {\n  content: \".\";\n  border: solid 1px white;\n  padding: 20px;\n}\n```\n\
    \n*(注：由于提供的待翻译文本存在大量段落重复，作为高级文档工程师，我根据“不要重复输出原文”的原则，在下方最终译文中进行了去重处理，确保逻辑通顺且不冗余)*\n\
    \n**译文：**\n\n[content]\n在这个示例中，id 为 `example` 的元素将在其内容“之前”放置一个哈希符号（#），并在其内容“之后”放置一个句号。\n\
    \n## 关于语法的若干注意事项\n\n你可以将 `content` 属性留空，并仅将伪元素视为一个没有内容的框，如下所示：\n\n```css\n#example:before\
    \ {\n  content: \"\"\n  display: block;\n  width: 100px;\n  height: 100px;\n}\n\
    ```\n\n但是，你不能完全删除 `content` 属性。如果你删除了，伪元素将无法生效。至少，`content` 属性需要一个空引号作为其值。\n\n\
    你可能已经注意到，你也可以使用双冒号语法（`::before` 和 `::after`）来编写伪元素，正如我之前讨论过的，这两种语法之间没有区别；它只是在\
    \ CSS3 中区分伪元素（双冒号）和伪类（单冒号）的一种方式。\n\n关于语法的最后一点。从技术上讲，你可以通用地实现一个伪元素，而不针对任何特定元素，如下所示：\n\
    \n```css\n:before {\n  content: \"#\"\n}\n```\n\n虽然上面的代码是有效的，但它几乎毫无用处。代码会在 DOM\
    \ 中每个元素的内容之前插入一个哈希符号。即使你删除了 `<body>` 标签及其所有内容，你仍然会在页面上看到两个哈希符号：一个在 `<html>` 元素中，一个在浏览器自动构建的\
    \ `<body>` 标签中。\n\n## 插入内容的特征\n\n如前所述，所插入的内容在页面的源代码中是不可见的。它只在 CSS 中可见。\n\n此外，插入的元素默认是行内元素（或者说，在\
    \ HTML5 术语中，属于文本级语义分类）。因此，为了给插入的元素设置高度、内边距（padding）、外边距（margins）等，通常需要显式地将其定义为块级元素。\n\
    \n这正好引出了如何为伪元素设置样式的简单描述。看看我编辑器中的这张图：\n\n```css\n#element:before {\n  content:\
    \ \"#\";\n  display: block;\n  width: 200px;\n  height: 200px;\n}\n#element:after\
    \ {\n  content: \".\";\n  display: block;\n  width: 200px;\n  height: 200px;\n\
    }\n```\n\n在这个示例中，我突出了将应用到目标元素内容之前和之后插入的元素的样式。伪元素在这一方面是相当独特的，因为你在同一个声明块中插入了内容和样式。\n\
    \n同时请注意，典型的 CSS 继承规则也适用于插入的元素。例如，如果你对文档的 `<body>` 元素应用了 `Helvetica, Arial, sans-serif`\
    \ 字体族，那么伪元素将继承该字体族，这与其他任何元素都是一样的。\n\n同样，伪元素不会继承那些无法从父元素自然继承的样式（如内边距和外边距）。\n\n\
    ## 在什么之前或之后？\n\n当你看到 `:before` 和 `:after` 伪元素时，你的直觉可能是插入的内容将注入到目标元素之前和之后。但正如上面提到的，事实并非如此。\n\
    \n注入的内容相对于目标元素来说是子内容，但它会被放置在该元素内任何其他内容的“之前”或“之后”。\n\n为了演示这一点，请看以下代码。首先是 HTML：\n\
    \n```html\n<p class=\"box\">其他内容。</p>\n```\n\n这里是插入伪元素的 CSS：\n\n```css\np.box\
    \ {\n  width: 300px;\n  border: solid 1px white;\n  padding: 20px;\n}\n\np.box:before\
    \ {\n  content: \"#\";\n  border: solid 1px white;\n  padding: 20px;\n}\n\np.box:after\
    \ {\n  content: \".\";\n  border: solid 1px white;\n  padding: 20px;\n}\n```\n\
    \n## 插入非文本内容\n\n如前所述，插入的内容在页面的源代码中是不可见的。它只在 CSS 中可见。\n\n此外，你可以将 `content` 属性留空，并仅将伪元素视为一个没有内容的框。\n\
    \n在 CSS 中，你可以看到所示：\n\n```css\np.box:before {\n  content: \"#\";\n  border: solid\
    \ 1px white;\n  padding: 20px;\n}\n```\n\n*(注：由于原始文本存在大量段落重复，上述译文已根据要求进行了去重处理)*\n"
