    h1, h2, a, #tagline {\n  color:#c00;\n}\n```\n\n通过这种方式，如果 #c00 品牌颜色发生变化，开发者只需要更改该值一次。这本质上是在\
    \ CSS 中使用变量。\n\n# 分成多个 CSS 文件，还是用一个包含所有部分的大文件？\n\n许多人将部分拆分为多个文件，然后使用 `@import`\
    \ 规则将它们全部合并回到一个元文件中。例如：\n\n```css\n@import url(main.css)\n@import url(type.css)\n\
    @import url(images.css)\n@import url(tables.css)\n@import url(misc.css)\n@import\
    \ url(responsive.css)\n```\n\n这样做是可以的，它保持了内容的分段状态，但确实会导致比需要更多的 HTTP 请求；而减少请求是高性能网站最重要规则之一。\n\
    \n对比一下这个\n\n| URL | Status | Domain | Size | Timeline |\n|---|---|---|---|---|\n\
    | GET main.css | 304 Not Modified | | 83 B | 311ms |\n| GET reset.css | 304 Not\
    \ Modified | | 722 B | | |\n| GET typography.css | 304 Not Modified | | 2 KB |\
    \ 329ms |\n| GET layout.css | 304 Not Modified | | 1.8 KB | 342ms |\n| GET entries.css\
    \ | 304 Not Modified | | 1 KB | 349ms |\n| GET thickness.css | 304 Not Modified\
    \ | | 8.7 KB (8.7 KB from cache) | 861ms (onload: 2.52s) |\n\n如果你对 CSS 进行了良好的分段和注释，使用目录等，你就可以避免拆分\
    \ CSS 文件的需要，从而减少这些请求。\n\n如果你真的想将 CSS 拆分成多个样式表，你可以这样做——只需在构建时将它们合并为一个。通过这种方式，你的开发者可以在多个文件之间工作，但你的用户将下载一个合并后的文件。\n\
    \n# 从程序员身上学习\n\n程序员已经这样做很多年了，而且做得很好。他们的工作是编写既具有可读性又有功能的代码。我们前端开发者可以从程序员处理代码的方式中学到很多。\n\
    \n我的好朋友（一位绝对非常棒的家伙）Dan Bentley 的代码引起了我的共鸣。它太美了。大多数时候我不理解它是什么，但它看起来如此整洁又悦眼。有这么多留白，如此整洁有序，全部都有注释并得到了妥善维护。他的\
    \ PHP、Ruby、Python 或无论他那天决定使用什么语言，看起来总是那么干净。\n"
