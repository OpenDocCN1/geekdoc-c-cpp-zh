    \ #header 并没有跨越整个区域。最后要做的工作是添加基础样式表以及我们在第一个演示结束时使用的相同规则：\n\n```html\n<link rel=\"\
    stylesheet\" type=\"text/css\" href=\"http://tjkdesign.com/ez-css/css/base.css\"\
    >\n```\n\n然后添加这些规则：\n\n```css\nhtml {\n  height: auto;\n}\nbody {\n  border: 1px\
    \ solid #efefef;\n}\n#header,\n#main,\n#sidebar,\n#footer {\n  padding-bottom:\
    \ 2em;\n}\n```\n\n## 3. 创建一个列之间之间有边框的三栏布局\n\n我们将构建一个包含单个 #main-wrapper 的布局，它包含所有的\
    \ div。这种方法让情况变得复杂了一些，但也允许我们应对新的挑战。请注意，在这种布局中，垂直边框在 IE 6 和 7 中不会显示。\n\n![](img/736c504465a39c9f3caa50d5252a3998_193_0.png)\n\
    \n### 基础\n\n我们使用 wrapper 来创建三列的背景。wrapper 的左、右边框将用于两个侧边栏，而它的背景将用于主内容。\n\n### HTML\
    \ 标记\n\n```html\n<div id=\"wrapper\">\n  <div id=\"header\"><h2><a href=\"#\"\
    >Header</a></h2><p>Lorem ipsum...</p></div>\n  <div id=\"sidebar\"><h2><a href=\"\
    #\">Sidebar</a></h2><p>Lorem ipsum...</p></div>\n  <div id=\"aside\"><h2><a href=\"\
    #\">Aside</a></h2><p>Lorem ipsum...</p></div>\n  <div id=\"main\"><h2><a href=\"\
    #\">Main</a></h2><p>Lorem ipsum...</p></div>\n  <div id=\"footer\"><h2><a href=\"\
    #\">Footer </a></h2><p>Lorem ipsum...</p></div>\n</div>\n```\n\n### CSS\n\n我们从之前演示中的通用规则开始：\n\
    \n```css\nhtml {\n  background: #45473f;\n}\n\nbody {\n  width: 80%;\n  margin:\
    \ 20px auto;\n  background: #ffe3a6;\n}\n\n#header,\n#footer {\n  overflow: hidden;\n\
    \  zoom: 1;\n  background: #9c9965;\n}\n\n#sidebar {\n  float: left;\n  width:\
    \ 200px;\n}\n```\n\n```css\n#main {\n    float: left;\n}\n```\n\n我们对其添加：\n\n```css\n\
    #wrapper {\n    border-left: 200px solid #D4C7B;\n    background: #ffe3a6;\n \
    \   border-right: 200px solid #D4C7B;\n}\n```\n\n这段代码为三列设置了背景颜色。顺序与上述声明相同。\n\n\
    如果你看第一步，你会发现我们已经实现了我们想要的背景，但 wrapper 内容区域框内部的内容看起来看起来坏了。\n\n接下来的规则应该修复三列的显示（#wrapper\
    \ 使用 **zoom: 1**，#sidebar 和 #aside 使用 **position: relative**）：#aside 有了固定的宽度并向右浮动。**注意：**\
    \ IE 6 和 7 需要 #wrapper 拥有布局，因此使用了 `zoom`。负外边距将两侧都拉到 wrapper 边框之外。\n\n如果你看第二步，你会发现\
    \ #header 并没有跨越整个区域。最后要做的工作是添加基础样式表以及我们在第一个演示结束时使用的相同规则：\n\n```html\n<link rel=\"\
    stylesheet\" type=\"text/css\" href=\"http://tjkdesign.com/ez-css/css/base.css\"\
    >\n```\n\n然后添加这些规则：\n\n```css\nhtml {\n  height: auto;\n}\nbody {\n  border: 1px\
    \ solid #efefef;\n}\n#header,\n#main,\n#sidebar,\n#footer {\n  padding-bottom:\
    \ 2em;\n}\n```\n\n## 添加垂直边框\n\n以下技术灵感来自 companion technique（伙伴技术）和 Nicolas Gallagher\
    \ 方法。为了获得我们想要的效果（边框相互接触），我们使用了生成内容并对其应用了背景颜色。\n\n```css\nhtml:before {\n  content:\
    \ \".\";\n  position: absolute;\n  height: 20px;\n  background: #45473f;\n  left:\
    \ 0;\n  right: 0;\n  z-index: 2;\n}\nbody {\n  border-top: 0;\n}\n#header {\n\
    \  border-top: 1px solid #fff;\n}\n#wrapper {\n  position: relative;\n}\n#header,\n\
    #footer {\n  z-index: 1;\n}\n#wrapper:before,\n#wrapper:after {\n  content: \"\
    .\";\n  position: absolute;\n  width: 1px;\n  height: 2000px;\n  background: #9c9965;\n\
    \  bottom: 0;\n}\n#wrapper:before {\n  left: 0;\n  border-left: 1px solid #fff;\n\
    }\n#wrapper:after {\n  right: 0;\n  border-right: 1px solid #fff;\n}\nbody {\n\
    \  position: relative\\9;\n  z-index: -1;\n}\n```\n\nOK，所以这里发生了什么？\n\n- 伪边框超出了容器（在顶部），因此第一条规则在它们上方绘制生成内容。注意，如果伪边框的颜色与页面背景（html）相同，或者视口顶部与布局之间没有间隙，我们需要这条规则。\n\
    - 因为这些边框绘制在 body 边框上，我们将顶部框从 body 移动到 #header。\n- 为了正确定位伪边框，我们需要让 wrapper 成为生成内容的容器。\n\
    - 我们将 #header #footer 带到堆栈上方，以隐藏在 wrapper 内部从底部到上绘制的伪边框。\n- 这是我们用于创建列的生成内容。\n\n\
    **IE8 的情况：** 最后一条规则是为 IE 8 设计的。如果没有这条规则，IE 8 不会在超出 wrapper 的边框上方绘制生成内容。如果此声明通过“9”黑科技进行沙箱，是因为\
    \ Gecko 浏览器会使所有内容变得不可点击/不可选择。\n\n**注意：**这些伪类不受 IE 6 和 7 支持，因此在这些浏览器中，列之间没有边框。\n\
    \n## 需要考虑的事项\n\n第三种布局使用了单个 *main* wrapper，但使用一个 *inner* wrapper 来仅包含列会更合理。我们这里采取的路线，是为了那些被困于这种结构、但希望为等高列实现此解决方案的人。\n\
    \n在像最后两个演示那样具有宽列的容器中绝对定位元素时，请记住参考是内边距框（padding box），因此 **right** 或 **left** 的\
    \ **0** 可能不是你想要使用的值。\n\n"
