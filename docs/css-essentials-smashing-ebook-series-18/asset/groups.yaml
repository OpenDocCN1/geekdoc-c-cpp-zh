    All of the content of The New York Times site falls into a grid of five columns,
    plus a thin column for the navigation.'
- md: '

    # Efficient CSS Development Practices


    Aids in: modularity, efficiency


    Layout grids and many of the CSS3 techniques we''ve gone over have the side benefit
    of making your CSS more modular and helping you write and maintain CSS more efficiently.
    There are also a few CSS development practices that you can use with any of the
    techniques we''ve already covered in order to reduce the time it takes you to
    write the CSS for those techniques in the first place, as well as save you time
    reusing components in your pages.


    # CSS FRAMEWORKS


    A CSS framework is a library of styles that act as building blocks to create the
    standard pieces you might need in your site. While CSS frameworks differ greatly
    in depth and breadth, most popular, publicly-distributed frameworks contain some
    sort of layout grid, as well as standard styles for text, navigation, forms, images,
    and more. It''s a good idea to create your own CSS framework, perhaps based on
    one of the most popular ones; it can be as simple as standardizing the IDs and
    classes you tend to use on every project and creating a starter style sheet for
    yourself.


    Good CSS frameworks provide you with a solid starting point for your designs,
    cutting down your time spent developing, testing, tweaking, and updating. They
    can also reduce the time others (your team members or those who inherit your sites)
    spend modifying your CSS, as everyone is working from a standard set of conventions.
    Frameworks can make your designs more modular by giving you a standard set of
    classes that can be reused from page to page easily, breaking the styles down
    into separate sheets that can be applied independently to pages on an as-needed
    basis, or allowing you to plug in various types of content without needing to
    invent new classes for it.


    But, frameworks have their share of problems too. For instance, publicly-distributed
    (as opposed to your own private) frameworks tend to have large file sizes, as
    they need to work for any type of site with any type of content; if they''re separated
    into multiple sheets, they can further damage page speed since every HTTP request
    takes time. We won''t get into the full list of pros and cons, but there are ways
    to work around many of them, so check out the following articles for the details.


    # OBJECT-ORIENTED CSS (OOCSS)


    Nicole Sullivan coined the term object-oriented CSS (OOCSS) for her method of
    creating self-contained chunks of HTML (modules) that can be reused anywhere in
    the page or that any class can be applied to. Some of the main principles of OOCSS
    are:


    - using primarily classes instead of IDs

    - creating default classes with multiple, more specific classes added on to elements

    - avoiding dependent selectors and class names that are location-specific

    - leaving dimensions off module styles so the modules can be moved anywhere and
    fit

    - styling containers separately from content


    OOCS aims to make your CSS development more efficient, as well as to make the
    CSS itself more modular and less redundant, which reduces file sizes and loading
    speed.


    - Object Oriented CSS (the original blog post, presentation, and framework, at
    stubbornella.com)

    - Object Oriented CSS (OCSS): The Lowdown (TYPESETTING)

    - Object-Oriented CSS: What, How, and Why (Nettuts)


    # CSS GENERATION


    When it comes to writing CSS quickly, what could be quicker than having some piece
    of software write it for you? Now, please don''t think that I''m advocating not
    learning CSS and having a tool write a complete style sheet for you. That is a
    bad, bad idea. But, there are some quality tools out there that can give you a
    headstart with your CSS, just to shave a little time off the front of your CSS
    development process. Most good CSS generators are focused on creating styles for
    one particular area of your design, as the the layout structure or type styles,
    not the whole style sheet.


    There are far too many tools to link to individually here, so remember when you''re
    finding your own tools to carefully review the CSS it outputs. If it''s invalid,
    bloated, or just plain ugly, don''t use the tool!


    # CSS Performance


    Aids in: efficiency


    Your efficiently created CSS-based web sites need to perform as efficiently as
    possible for your users. Many of the CSS3 techniques we''ve covered can reduce
    file sizes and HTTP requests to increase the speed of your pages. There are some
    additional CSS techniques you can use to boost performance.


    # CSS COMPRESSION


    Writing clean CSS that takes advantage of shorthand properties, grouped selectors,
    and other efficient syntax is new, but it remains very important for improving
    performance. There are also tricks some CSS developers employ to further reduce
    CSS file sizes, such as writing each on one line to reduce all the line breaks.
    Although you can do some of this manually, there are a number of tools that can
    optimize and compress your CSS for you.


    # CSS SPRITES


    CSS Sprites is a CSS technique named by Dave Shea of combining many (or all) of
    your site''s images into one big master image and then using background-position
    to shift the image around to show only a single image at a time. This greatly
    improves your pages'' performance because it greatly reduces the number of HTTP
    requests to your server. This is not a new technique, but it''s increasingly important
    in modern CSS-based web sites as page performance becomes more and more important.


    | Store | Mac | iPod | iPhone |

    |---|---|---|---|

    | Store | Mac | iPod | iPhone |

    | Store | Mac | iPod | iPhone |

    | Store | Mac | iPod | iPhone |

    | Store | Mac | iPod | iPhone |

    | Store | Mac | iPod | iPhone |


    The Apple site uses CSS sprites for various states of its navigation bar.


    Not everyone is a fan of CSS sprites, however. For some opposing arguments, as
    well as alternative methods of reducing image HTTP requests, see:


    - CSS Sprites are Stupid – Let''s Use Archives Instead! (Firefox Demo) (kaia.com)

    - How to reduce the number of HTTP requests (Robert''s talk)


    # Font Embedding and Replacement


    Aids in: progressive enhancement, rich typography


    Until recently, web designers were limited to working with the fonts on their
    end users’ machines. We now have a number of technologies that make unique but
    still readable and accessible text possible.


    # THE @FONT-FACE RULE


    The @font-face rule, part of CSS3, allows you to link to a font on your server,
    called a "web font," just as you can link to images, and displays text on your
    site in this font. You can now make use of your beautiful, unique fonts instead
    of just the fonts that most people already have installed on their machines. Fortunately,
    @font-face has good browser support. But alas, it''s not as simple as that. Different
    browsers support different types of fonts, different platforms and browsers anti-alias
    very differently, you can get a flash of unstyled text before the font loads,
    your font may not allow @-face embedding in its license, and on and on it goes.


    ![](img/736c504465a39cf3caa50d5252a3998_140_0.png)


    # HTML5 Hearts iPad


    The iPad is increasing the mind-share of HTML to the businesses, and tech-minds
    at breakneck speed that we most enduring web-standard jealous.


    I''ve been watching HTML develop over the last 10 years – at a Jeffery Zeldman
    spent years developing the standards communoling the business community into understanding
    the


    Sam How’s site uses @font-face to get attractive non-standard fonts into the headings
    and intro blocks of text.


    # You''re not cookie cutter.


    We craft compelling, one-of-a-kind resumes that get you noticed.


    Blue Sky Resumes uses @font-face extensively in headings, feature copy, and the
    main nav bar.


    # OTHER FONT EMBEDDING AND REPLACEMENT TECHNIQUES


    If the pure CSS solution of @font-face is making your head spin, you can use a
    font embedding service or font replacement technique.


    - Font embedding services: There are a number of third-party font embedding services
    available that make use of @font-face, such as Typekit and Kernest, but make implementation
    easier by helping you work around the browser differences. They also get all around
    the legal issue of font embedding by providing you with a set of fonts that are
    licensed for this type of use and impossible or difficult for end users to steal.
    Most of these services are not free, but some have free options that give you
    access to a limited set of fonts.

