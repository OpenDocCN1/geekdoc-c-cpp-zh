    \ h2 a | | | |\n\n## 5. 结论\n\n希望这篇文章开启（或刷新了）你对 CSS 继承和权重的认知。我们鼓励你阅读引用的文章，以及 Smashing\
    \ Magazine 之前关于该主题的文章。\n\n即使你没有考虑它们，这些问题也存在于你作为 CSS 作者的日常工作中。特别是对于权重，了解它们如何影响你的样式表以及如何为它们做计划，以便它们只产生最小（或没有）问题是非常重要的。\n"
