    # About The Authors


    # Divya Manian


    Divya Manian is a web opener for Opera Software in Seattle. She made the jump
    from developing device drivers for Motorola phones to designing websites and has
    not looked back since. She takes her duties as an Open Web vigilant seriously
    which has resulted in collaborative projects such as HTML5 Boilerplate.


    # Harry Roberts


    Harry Roberts is a Senior UI Developer for BSkyB and type nerd from the UK. Enthusiastic,
    passionate and often outspoken, he is a writer, designer and member of Smashing
    Magazine’s Experts Panel. He tweets at @cssswizardry.


    # Inayili de León


    Inayili de León is a London-based Portuguese web designer, specialist in cross-border,
    semantic HTML and CSS, and clean, functional design. She writes frequently for
    well-known online and print publications and also on her web design blog. Web
    Designer Notebook. In May 2011, she published a book, Pro CSS for High Traffic
    Websites, and she speaks frequently at local and international conferences and
    meetups. She is currently working as a web designer on Canonical’s Design team.'
  - '[PAGE 279]


    # Jonathan Snook


    Jonathan Snook writes tips, tricks, and bookmarks on his blog at Snook.ca. He
    has also written for A List Apart, 24ways, and .net magazine, and has co-authored
    two books, The Art and Science of CSS and Accelerated DOM Scripting. Snook currently
    works on the design team at Shopify.


    # Louis Lazaris


    Louis Lazaris is a freelance web developer based in Toronto, Canada. He blogs
    about front-end code on Impressive Webs and is a coauthor of HTML5 and CSS3 for
    the Real World, published by SitePoint. You can follow Louis on Twitter or contact
    him through his website.


    # Michael Martin


    Michael Martin writes about web design, WordPress and coding at Pro Blog Design.
    You can subscribe there for advice on making the most of your blog’s design, or
    follow him on Twitter.


    # Niels Matthijs


    Niels Matthijs spends his spare time combining his luxury life with the agonizing
    pressure of blogging under his Onderhoud moniker. As a frontend developer he is
    raised at Internet Architects, investing plenty of time in making the web more
    accessible and pleasant place.


    # Thierry Koblentz'
  - '[PAGE 280]


    Thierry is passionate about Web Design and CSS. He loves the challenge of solving
    problems and dreaming up original ideas that get him out of bed in the morning
    and keep him working late at night. He is a front-end engineer at Yahoo! and owns
    TJK Design and ez-css.org.


    # Zoe Mickley Gillenwater


    Zoe Mickley Gillenwater is a freelance graphic and web designer, developer and
    consultant. She is the author of the book Flexible Web Design: Creating Liquid
    and Elastic Layouts with CSS and the video training title Web Accessibility Principles
    for lynda.com, and is working on the upcoming book Stunning CSS3: A Project-based
    Guide to the Latest in CSS. Zoe is currently a member of the Web Standards Project
    (WaSP) Adobe Task Force and was previously a moderator of the popular css-discuss
    mailing list. Find out more about Zoe on her blog and portfolio site or follow
    her on Twitter.'
