    # IMPROPER USE OF SPRITES AFFECTS ACCESSIBILITY


    Because of the strong emphasis placed on using CSS sprites, some beginning developers
    intending on saving HTTP requests may incorrectly assume that all sliced images
    should be placed as backgrounds — even images that convey important information.
    The results would be a less accessible site, and would limit the potential benefits
    of the title and alt attributes in the HTML.


    So, while CSS sprites and them themselves are not wrong, and do not cause accessibility
    problems (in fact, when used correctly, they improve accessibility), the over-promotion
    of sprites without clearly identifying drawbacks could hinder the progress the
    web has made in areas of accessibility and productivity.


    # What About HTTP Requests?


    Many will argue, however (and for good reason) that the most important part of
    improving a site''s performance is minimizing HTTP requests. It should also be
    noted that one study conducted showed 40-60% of daily visitors come with an empty
    browser cache. Is this enough to suggest that sprites should be used in all circumstances?
