    # Learning To Use The :before And :after Pseudo-Elements In CSS


    Louis Lazaris


    If you''ve been keeping tabs on various Web design blogs, you''ve probably noticed
    that the :before and :after pseudo-elements have been getting quite a bit of attention
    in the front-end development scene — and for good reason. In particular, the experiments
    of one blogger —namely, London-based developer Nicolas Gallagher —have given pseudo-elements
    quite a bit of exposure of late.'
