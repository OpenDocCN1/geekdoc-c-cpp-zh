    # CSS3 视觉效果


    ## 半透明颜色


    作用：渐进式增强、效率


    RGBA 允许你通过不仅设置颜色包含的红、绿、蓝值，还设置它应该具有的透明度来指定颜色。RGBA 的替代方案是 HSLA，它的工作方式相同，但它允许你设置色调、饱和度和亮度的值，而不是红、绿、蓝的值。《Opera
    10 中的颜色 —— HSL、RGB 和 Alpha 透明度》一文解释了 HSLA 如何比 RGBA 更加直观易使用。


    ![](img/736c504465a39c9f3caa50d5252a3998_114_0.png)


    24 Ways 网站大量使用 RGBA 来将半透明的框和文本层叠在彼此之上。


    RGBA 或 HSLA 不仅仅是为了让事物看起来很酷；它们还可以提高你网站的效率。你不需要花时间制作具有 alpha 透明度的 PNG 图片作为背景，因为你只需要在
    CSS 中使用颜色即可，用户代理在加载网站时不需要下载这些图像。


    # 背景和边框的样式


    作用：渐进式增强、效率


    CSS3 提供了一系列全新的新的背景和边框样式化方法，通常不需要使用图像或添加额外的 `div`。这些新技术中的大多数已经具有了良好的浏览器支持，而且由于它们主要用于纯视觉的更改，因此它们是立即在你的网站中实现一些渐进式增强效果的好方法。


    以下是 CSS3 允许你在背景上完成的一些新功能：


    - 单个元素上的多个背景：你现在可以通过在 `background-image` 属性中列出每个图像（用逗号隔开），为元素添加多个背景图像。再也不需要为了有更多元素可以挂载背景图像而嵌套额外的
    `div` 了！

    - 对背景放置位置有更精细的控制：新的 `background-clip` 和 `background-origin` 属性允许你控制背景是显示在边框下方、内边距下方还是仅内容区域，以及
    `background-position` 的起始点在哪里。

    - 背景尺寸控制：你可以使用新的 `background-size` 属性缩放背景图像。虽然缩放在许多背景图像上看起来并不理想，但在抽象的、做旧类型的背景上可能非常有用，因为在这些情况下平铺很困难，而且某些图像失真是察觉不到的。

    - 渐变：虽然这只是 CSS 草案规范的一部分，但 Safari、Chrome 和 Firefox 支持在 `background-image` 属性中声明多个颜色和位置值，以创建无需图像的渐变。这允许渐变随其容器缩放——与传统的渐变不同——并消除了用户在查看你的网站时下载另一张图像的需求。


    CSS3 允许你在边框上执行以下操作：


    - 圆角：使用 `border-radius` 属性让 `div`、按钮以及任何你心所欲的元素获得圆角——这一切都不需要使用图像或 JavaScript。

    - 边框图像：在 CSS 2.1 中，创建图形边框唯一的方法是使用背景图像伪造，通常是在多个 `div` 上缝合在一起。你可以通过使用新的 `border-image`
    属性直接将图像添加到边框，从而无需使用背景图像即可添加新边框，该属性允许你控制图像如何缩放和和平铺。


    ![](img/736c504465a39c9f3caa50d5252a3998_117_0.png)


    `border-radius` 属性可以用于圆角处理，甚至可以用纯 CSS 创建圆形，而不需要任何图像。（惊艳的 CSS3 网站）


    # 投影


    作用：渐进式增强、适应性、效率


    投影投影可以为你的设计提供一些视觉上的润色，现在你可以在不使用图像的情况下，在框和文本上实现它们。


    **box-shadow 属性** 已暂时从 CSS3 规范中移除，但预计很快就会重新出现。在此期间，你仍然可以在 Firefox 和 Chrome 中通过
    `-moz-box-shadow` 和 `-webkit-box-shadow` 使用它，而在 Opera 中则使用 `box-shadow`。在 `box-shadow`
    属性中，你可以设置水平偏移、垂直偏移、颜色和模糊半径。


    ![](img/736c504465a39c9f3caa50d5252a3998_18_0.png)


    `border-radius` 属性可以用于圆角处理，甚至可以用纯 CSS 创建圆形，而不需要任何图像。（惊艳的 CSS3 网站）


    # 变换 (Transforms)


    作用：渐进式增强、适应性、效率


    CSS3 允许你在不使用 Flash 或 JavaScript 的情况下旋转、缩放和倾斜等。这些效果被称为“变换”，在大多数浏览器中都支持（你需要使用浏览器特定的前缀：`-moz-transform`、`-webkit-transform`
    和 `-o-transform`）。你还可以使用 `transform-origin` 属性指定变换的起始点。


    在 `transform` 属性中，你可以指定变换的类型，例如，`translate(10px, 20px)` 会向右移动 10 像素并向下移动 20 像素。其他支持的变换函数还有缩放、旋转。


    ![](img/736c504465a39c9f3caa50d5252a3998_120_0.png)


    该网站在悬停时缩放并旋转 logo。


    # 动画与过渡


    作用：渐进式增强、效率


    动画现在不再仅仅是 Flash 或 JavaScript 的领域——你现在可以用纯 CSS 创建动画。遗憾的是，CSS3 动画和过渡并没有非常良好的浏览器支持，但对于我们目前为止讨论的大多数效果，它们是添加一些非必要的装饰效果。


    CSS3 过渡本质上是最简单的动画。它们在指定的持续时间内平滑地从一个 CSS 值变为另一个值。它们由元素的状态触发，如悬停。它们在 Safari 和 Chrome
    中支持。


