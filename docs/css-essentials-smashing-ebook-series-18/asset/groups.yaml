    When you combine that with the fact that internet speeds are higher on average
    today than they were when this technique was first expounded upon in 2003-2004,
    then there may be little reason to use the mega sprite method. And just to be
    clear, as already mentioned, I''m not saying sprites should never be used; I''m
    saying they should not be overused to attain limited benefits.


    # Time Spent Slicing a Design Will Increase


    Think about how a simple 3-state image button sprite is created: The different
    states need to be placed next to one another, forming a single image. In your
    Photoshop mockup (or other software), you don''t have the different states adjacent
    to each other in that manner; they need to be sliced and combined into a new separate
    image, outside of the basic website mockup.


    If any changes are required for any one of the image states, the entire image
    needs to be recompiled and re-saved. Some developers may not have a problem with
    this. Maybe they keep their button states separate from the mockup in a raw original,
    making it easier to access them. But this complicates things, and will never be
    as simple as slicing a single image and exporting it.


    For the minimal benefit of a few kilobytes and server requests saved (which only
    occurs on initial page load), is the mega sprite method really a practical solution
    for anything other than a 3-state button?


    # Time Spent Coding and Maintaining Will Increase


    After an image is sliced and exported, the trouble doesn''t end there. While button
    sprites are simple to code into your CSS once you''re accustomed to the process,
    other kinds of sprites are not so simple.


    A single button will usually be a `<ul>` element that has a set width. If the
    sprites for the button are separate for each button, it''s simple: The width and
    height of the `<ul>` will be the same as the width and height of the list item
    and anchor, with the sprite aligned accordingly for each state. The position of
    the sprite is easily calculated based on the height and/or width of each button.


    But what about mega sprite, like the one used by Amazon, mentioned earlier, or
    the one used by Google? Can you imagine maintaining such a file, and making changes
    to the position of the items in the CSS? And what about the initial creation of
    the CSS code? Far from being a simple button whose state positions are easily
    calculated, the mega sprite will often require continuous testing and realignment
    of the mega sprite.


    ![](img/736c504465a39c9f3caa50d5252a3998_85_0.png)


    Some of the CSS used to position Google''s sprite


    It''s true that the Amazon sprite saves about 30 or more HTTP requests, and that
    is definitely a significant improvement in performance. But when the benefit is
    weighed against the development and maintenance costs, and the caching and internet
    speed factored in, the decision to go with sprites in the mega format may not
    be so convincing.


    # DO SPRITES REALLY REQUIRE “MAINTENANCE”?


    Of course, some may feel that sprites do not cause a major headache for them.
    In many cases, after a sprite is created and coded, it''s rarely touched again,
    and isn''t affected by any ongoing website maintenance. If you feel that sprite
    maintenance won''t be an issue for you, then the best choice is to use the mega
    sprite method.


    # Not Everything Should be a Background


    Another reason not to promote the overuse of CSS sprites is that it could cause
    developers to use background images incorrectly. Experienced developers who consider
    accessibility in their projects understand that not every image should be a background.
    Images that convey important content should be implemented through inline images
    in the XHTML, whereas background images should be reserved for buttons and decorative
    elements.


