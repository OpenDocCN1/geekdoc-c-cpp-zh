  - "[PAGE 30]\n\nThe CSS applied to the image in the box above is as follows:\n\n\
    ```\nimg {\n  float: left;\n  margin: 0 15px 5px 0;\n  border: solid 1px #bbb;\n\
    }\n```\n\nThe only property required to make this effect work is the **float**\
    \ property.\nThe other properties (margin and border) are there for aesthetic\
    \ reasons.\nThe other elements inside the box (the <p> tags with text inside them)\
    \ do not need any styles applied to them.\n\nAs mentioned earlier, floated elements\
    \ are taken out of flow in relation to other block elements, and so other block\
    \ elements remain in flow, acting as if the floated element is not even there.\
    \ This is demonstrated visually below:\n\n![](img/736c504465a39c9f3caa50d5252a3998_30_0.png)"
- md: "\nIn the above example, the <p> element is a block-level element, so it ignores\
    \ the floated element, spanning the width of the container (minus padding). All\
    \ non-floated, block-level elements will behave in like manner.\n\nThe text in\
    \ the paragraph is inline, so it flows around the floated element. The floated\
    \ box is also given margin settings to offset it from the paragraph, making it\
    \ visually clear that the paragraph element is ignoring the floated box.\n\n##\
    \ Clearing Floats\n\nLayout issues with floats are commonly fixed using the CSS\
    \ clear property, which lets you “clear” floated elements from the left or right\
    \ side, or both sides, of an element.\n\nLet’s take a look at an example that\
    \ commonly occurs — a footer wrapping to the right side of a 2-column layout:\n\
    \nIf you view this page in IE6 or IE7, you won't see any problems. The left and\
    \ right columns are in place, and the footer is nicely tucked underneath. But\
    \ in Firefox, Opera, Safari, and Chrome, you'll see the footer jump up beside\
    \ the left column. This is caused by the float applied to the columns. This is\
    \ the correct behavior, even though it is a more problematic one. To resolve this\
    \ issue, we use the aforementioned clear property, applied to the footer:\n\n\
    ```css\n#footer {\n  clear: both;\n}\n```\n\nThe result is shown below:\n\n![](img/736c504465a39c9f3caa50d5252a3998_33_0.png)\n\
    \nThe **clear** property will clear only floated elements, so applying **clear:\
    \ both** to both columns would not cause the footer to drop down, because the\
    \ footer is not a floated element.\n\nSo use **clear** on non-floated elements,\
    \ and even occasionally on floated elements, to force page elements to occupy\
    \ their intended space.\n\n## Fixing the Collapsed Parent\n\nOne of the most common\
    \ symptoms of float-heavy layouts is the “collapsing parent”. This is demonstrated\
    \ in the example below:\n\n![](img/736c504465a39c9f3caa50d5252a3998_34_0.png)\n\
    \nNotice that the bottom of the floated image appears outside its parent. The\
    \ parent does not fully expand to hold the floated image. This is caused by what\
    \ we discussed earlier: the floated element is out of the flow in relation to\
    \ other block elements, will render as if the floated element is not even there.\
    \ This is not a CSS bug; it's in line with CSS specifications. All browsers render\
    \ the same in this example. In this example, adding a width to the container prevents\
    \ the issue from occurring in IE, so this would normally be something you would\
    \ have to resolve in Firefox, Opera, Safari, or Chrome.\n\n### SOLUTION 1: FLOAT\
    \ THE CONTAINER\n\nThe easiest way to fix this problem is to float the containing\
    \ parent element:\n\n![](img/736c504465a39c9f3caa50d5252a3998_35_0.png)\n\nNow\
    \ the container expands to fit all the child elements. But unfortunately this\
    \ fix will only work in a limited number of circumstances, since floating the\
    \ parent may have undesirable effects on your layout.\n\n### SOLUTION 2: ADDING\
    \ EXTRA MARKUP\n\nThis is an outdated method, but it is an easy option. Simply\
    \ add an extra element at the bottom of the container and “clear” it. Here’s how\
    \ the HTML would look after this method is implemented:\n\n```html\n<div id=\"\
    container\">\n<img src=\"http://media.smashingmagazine.com/wp-content/uploads/2009/10/lifesaver.jpg\"\
    \ width=\"200\" height=\"222\" alt=\"\" />\n  <p>Pellentesque habitant morbi tristique\
    \ senectus et netus malesuada fames ac turpis egestas. Vestibulum tortor quam,\
    \ feugiat vitae, ultricies eget, tempor sit amet, ante. Donec eu libero sit amet\
    \ quam egestas semper.</p>\n  <div class=\"clearfix\"></div>\n</div>\n```\n\n\
    And the resulting CSS applied to the new element:\n\n```css\n.clearfix {\n  clear:\
    \ both;\n}\n```\n\nYou could also do this by means of a <br /> tag with an inline\
    \ style. In any case, you will have the desired result: the parent container will\
    \ expand to enclose all of its children. But this method is not recommended since\
    \ it adds nonsemantic code to your markup.\n\n### SOLUTION 3: THE :AFTER PSEUDO-ELEMENT\n\
    \nThe :after pseudo-element adds an element to the rendered HTML page. This method\
    \ has been used quite extensively to resolve float-clearing issues. Here is how\
    \ the CSS looks:\n\n```css\n.clearfix:after {\n  content: \".\";\n  display: block;\n\
    \  height: 0;\n  clear: both;\n  visibility: hidden;\n}\n```\n\nThe CSS class\
    \ \"clearfix\" is applied to any container that has floating children and does\
    \ not expand to enclose them.\n\nBut this method does not work in Internet Explorer\
    \ up to version 7, so an IE-only style needs to be set with one of the following\
    \ rules:\n\n```css\n.clearfix {\n  display: inline-block;\n}\n.clearfix {\n  zoom:\
    \ 1;\n}\n```\n\nDepending on the type of issue you're dealing with, one of the\
    \ above two solutions will resolve the issue in Internet Explorer. It should be\
    \ noted that the zoom property is a non-standard Microsoft proprietary property,\
    \ and will cause your CSS to become invalid.\n\nSo, because the :after pseudo-element\
    \ solution does not work in IE6/7, a little bit bloated code-wise, and requires\
    \ additional invalid IE-only styles, this solution is not the best method, but\
    \ is probably the best we've considered so far.\n\n### SOLUTION 4: THE OVERFLOW\
    \ PROPERTY\n\nBy far the best, and easiest solution to resolve the collapsing\
    \ parent issue is to add overflow: hidden or overflow: auto to the parent element.\
    \ It's clean, easy to maintain, works in almost all browsers, and does not add\
    \ extra markup.\n\nYou'll notice I said “almost” all browsers. This is because\
    \ it does not work in IE6. But, in many cases, the parent container will have\
    \ a set width, which fixes the issue in IE6. If the parent container does not\
    \ have a width, you can add an IE6-only style with the following code:\n\n```css\n\
    /* This fix is for IE6\n.clearfix {\n  height: 1%;\n  overflow: visible;\n}\n\
    ```\n\nIn IE6, the **height** property is incorrectly treated as **min-height**,\
    \ so this forces the container to enclose its children. The **overflow** property\
    \ is then set back to \"visible\", to ensure the content is not hidden or scrolled.\n\
    \nThe only drawback to using the **overflow** method (in any browser) is the possibility\
    \ that the containing element will have scrollbars or hide content. If there are\
    \ any elements with negative margins or absolute positioning inside the parent,\
    \ they will be obscured if they go beyond the parent’s borders, so this method\
    \ should be used carefully. It should also be noted that if the containing element\
    \ has to have a specified **height**, or **min-height**, you would definitely\
    \ not be able to use the **overflow-height** method.\n\nSo, really is no simple,\
    \ cross-browser solution to the collapsing parent issue. But almost any float\
    \ clearing issue can be resolved with one of the above methods.\n\n## Float-Related\
    \ Bugs in Internet Explorer\n\nOver the years, there have been numerous articles\
    \ published online that discuss common bugs in connection with floats in CSS layouts.\
    \ All of these, not surprisingly, deal with problems specific to Internet Explorer.\n\
    \n## Changing the Float Property with JavaScript\n\nTo change a CSS value in JavaScript,\
    \ you would access the style object, converting the intended CSS property to “camel\
    \ case”. For example, the CSS property “margin-left” becomes marginLeft; the property\
    \ background-color becomes backgroundColor, and so on. With the float property,\
    \ it's different, because float is already a reserved word in JavaScript. So,\
    \ the following would be incorrect:\n\n```javascript\nmyDiv.style.float = \"left\"\
    ;\n```\n\nInstead, you would use one of the following:\n\n```javascript\n// For\
    \ Internet Explorer\nmyDiv.style.styleFloat = \"left\"\n// For all other browsers\n\
    myDiv.style.cssFloat = \"left\";\n```\n\n## Practical Uses for Float\n\nFloats\
    \ can be used to resolve a number of design challenges in CSS layouts. Some examples\
    \ are discussed here.\n\n### 2-COLUMN, FIXED-WIDTH LAYOUT\n\nRoger Johansson of\
    \ 456 Berea Street outlines an 8-step tutorial to create a simple, cross-browser,\
    \ 2-column, horizontally centered layout. The float property is integral to the\
    \ chemistry of this layout.\n\n> “The layout consists of a header\n"
  mdcn: "\n在上面的示例中，`<p>` 元素是一个块级元素，因此它会忽略浮动元素，跨越容器的宽度（减去内边距）。所有非浮动的块级元素都具有相似的行为。\n\
    \n段落中的文本是内联的，因此它会绕过浮动元素流动。浮动框也设置了外边距以与段落隔开，这在视觉上清晰地表明段落元素忽略了浮动框。\n\n## 清除浮动\n\n\
    浮动布局问题通常使用 CSS 的 `clear` 属性来修复，它允许你从元素的左侧、右侧或两侧“清除”浮动元素。\n\n让我们来看一个常见的示例——页脚（footer）环绕到\
    \ 2 列布局的右侧：\n\n如果你在 IE6 或 IE7 中查看此页面，将不会看到任何问题。左列和右列都已就位，页脚整齐地嵌套在下方。但在 Firefox、Opera、Safari\
    \ 和 Chrome 中，你会看到页脚跳到了左列旁边。这是由于应用在列上的浮动属性 引起的。这是正确的行为，尽管它更具问题性。为了解决这个问题，我们使用上述的\
    \ `clear` 属性并将其应用于页脚：\n\n```css\n#footer {\n  clear: both;\n}\n```\n\n结果所示：\n\n\
    ![](img/736c504465a39c9f3caa50d5252a3998_33_0.png)\n\n**clear** 属性只会清除浮动元素，因此在两个列上都应用\
    \ **clear: both** 不会导致页脚掉落，因为页脚不是浮动元素。\n\n因此，在非浮动元素上使用 **clear**，甚至偶尔在浮动元素上使用，以强制页面元素占据其预期的空间。\n\
    \n## 修复塌陷的父元素\n\n浮动密集布局最常见的症状之一是“父元素塌陷”。下方的示例演示了这一点：\n\n![](img/736c504465a39c9f3caa50d5252a3998_34_0.png)\n\
    \n注意，浮动图片的底部出现在其父元素之外。父元素没有完全扩展以容纳浮动图片。这是由我们之前讨论的内容引起的：浮动元素相对于其他块元素脱离了文档流，渲染时就像该浮动元素根本不存在一样。这并不是\
    \ CSS 错误；它符合 CSS 规范。所有浏览器在这个示例中的渲染结果都是相同的。在这个示例中，为容器添加宽度可以防止问题在 IE 中发生，因此在正常情况下，你可能需要在\
    \ Firefox、Opera、Safari 或 Chrome 中解决这个问题。\n\n### 解决方案 1：让容器浮动\n\n修复此问题的最简单方法是让包含的父元素浮动：\n\
