  - Q2. 正表达式的用途。我们在线性序列中从语法上描述它的能力在许多应用中非常有用。Unix 工具如 awk、grep 利用这一事实。文本编辑器以各种方式使用正则表达式。编程语言内置了许多运算符。
- - '###'
  - '0.1.5 引理 我们考虑一个自然问题：是否存在非正规语言？我们如何证明某些语言不是正规的？考虑语言 $L_1 = \{w \in \{0,1\}^* :
    \#(0) = \#(1)\}$，$L_2 = \{w \in \{0,1\}^* : \#(0)=2\}$。函数 $\#(v)$ 计算 $v$ 在 $w$
    中出现的次数（$v$ 的出现可能会重叠）。例如 $\#(010) = 2$。我们可能会认为 $L_1$ 是非正规的，因为任何 dfa 只有有限状态。这种非正式的论证可能是有力的，但对于
    $L_2$ 采用相同的方法证明是错误的。我们需要非正规性的正式工具。最重要的工具是泵引理。'
