  - 归约性的选择。对于许多未解决的问题，共识意见通常给出否定答案。利用变换的相似性（例如用 DLOG 代替 $P$）来定义归约，为我们提供了证明这些问题否定答案的工具。假设
    $L$ 在 $\leq_m$ 下是 NP-完全的，且 $P$ 是封闭的（在应用基本包含引理的前提下）。要证明 NP 不是 P-完全的，只需证明 $L$ 不是
    $\leq_m$ 到 $P$-完全语言 $L'$（在这种背景下，我们可以证明 $P$ 有完全语言）。如果 $L$ 小于 $\leq_m^P$，则证明这一点非常容易。然而，这种细化存在内在局限性，正如
    [6] 所示。
- - '#'
  - 归约与包含的选择。此引理在对数速度以下被削弱了，那么它对于区分 $P$ 就有用。通过前面的归约，我们展示了归约的强度应该根据包含适当选择。我们可能关注的标准列表中的问题，最对数空间归约
    $\leq_m$ 足够大多数需求。
