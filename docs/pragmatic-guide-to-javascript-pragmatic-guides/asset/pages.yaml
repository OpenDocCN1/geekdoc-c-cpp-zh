  md: "# B.5 IE8 and Developer Tools\n\nThere’s no question about it: Internet Explorer\
    \ 8 is a great step forward in the IE world. Aside from the notable improvements\
    \ in web standards support (although it still lags far behind modern browsers,\
    \ it’s certainly not stuck in the Cretaceous anymore), these points are of immediate\
    \ interest to us JavaScripters:\n\n+   - The JScript engine in IE8 is on average\
    \ seven times slower than other JavaScript engines in released browsers. This\
    \ peaks at a factor of almost twelve against Chrome’s v8 or the latest builds\
    \ of Safari’s Squirrelfish Extreme and Firefox’s Tracemonkey.\n+   \n+   Why is\
    \ that a good news? IE7 used to be up to *ninety times* slower. And IE6 couldn’t\
    \ live with the shame of its own factor figure. So, the IE team managed to improve\
    \ its JScript engine by a factor of about thirteen, which has to be declared awesome,\
    \ like it or not.\n\n+   - The DOM performance in IE8, which is our second major\
    \ pain point when scripting, has also received some significant love and is now\
    \ lagging by an average factor of “only” four, which is also a major improvement.\n\
    \n+   - IE8 has built-in “Developer Tools,” which are a cleaned-up, snappier version\
    \ of the IE Developer Toolbar we use in IE6 and IE7, with an actual *JavaScript\
    \ debugger* thrown in. One that actually works and doesn’t entail incessant glitches\
    \ between IE and an external debugging app.\n\nSo, not only can we start thinking\
    \ about reenabling our fancy effects and Ajax operations in the IE world, but\
    \ we can also do so knowing debugging got a whole lot easier!\n\nIncidentally,\
    \ IE8 also explores ways to reduce the perceived performance impact of script\
    \ loading. You still should use generic optimizations such as “load scripts at\
    \ the bottom of the ”³ and, even more importantly, script concatenation (for example,\
    \ through Sprockets⁴) and gzip’ping.⁵\n\nThe IE8 Developer Tools pane with its\
    \ Script tab opened and a debugging session going on is shown in Figure B.9, on\
    \ the following page, with our now-familiar breakpoint. Toggling the debugger\
    \ on and off is simply a matter of clicking the large button in the toolbar, and\
    \ we get the usual stepping\n\n3. http://developer.yahoo.com/performance/rules.html#js_bottom\n\
    4. http://getsprockets.com\n5. For lots of great advice about web page loading\
    \ and rendering performance, get Thomas Fuchs and Amy Hoy’s excellent *JavaScript\
    \ Performance Rocks!* [HF09], and check out the Performance tips on the Yahoo!\
    \ Developer Network at http://developer.yahoo.com/performance/rules.html."
