- pgno: 13
  md: 'For “nonbasic” tasks, I went mostly with my personal favorite, Prototype,⁴
    except for one task (the lightbox one), where the solution I deem superior ends
    up being a jQuery plug-in. But really, once you master the basic tasks, you can
    rewrite or adapt my solutions using your framework of choice. And indeed, to facilitate
    this, we’re putting the entire codebase for this book up in a public GitHub repository.⁵
    This way, creating a variant favoring another framework (say, jQuery) is as easy
    as clicking GitHub’s Fork button, and finding such derived versions of the codebase
    becomes a snap.


    Also note that all the code for this book, besides being available in a neatly
    packaged code archive on the book’s website,⁶ is available live for your testing
    and tweaking pleasure at http://demos.pocketjavascript.com/.


    # This Book at a Glance


    This book is divided into theme-oriented parts, each with a number of tasks. It
    concludes with a few appendixes, some of which you may want to read before the
    main body of the book (especially the cheat sheet and the one about debugging
    JavaScript).


    +   - Part 1 covers a few critical JavaScript code patterns that are too often
    ignored by JavaScript developers. They’re just about the language, so they’re
    framework-agnostic but indispensible for good coding on a daily basis. Be sure
    to start here!

    +   - Part 2 is mostly about what I refer to as “basic” tasks, focusing on fundamental
    DOM and CSS manipulations, plus event handling and timers. Because of their “basic”
    status, I took care to list the relevant code for all major frameworks, so you
    can pick whatever suits you best. You should also check out Appendix C, on page
    116, when reading this part so you get a good picture of the framework landscape
    and make informed decisions.

    +   - Part 3 is all about the user interface, especially visual effects and neat
    UI ideas: good-looking tooltips, lightboxes, image preloading, infinite scrolling,
    and the like.

    +   - Part 4 is complementary to Part 3, because it focuses on forms, a critical
    part of most web applications. Among other things, a number of tools are there
    to assist, simplify, and validate input.

    +   - Part 5 is all about the client-server relationship, with topics such as
    cookies, JSON, and Ajax (same- and cross-domain).


    4. Full disclosure: I’m a member of Prototype Core.

    5. http://github.com/tdb/pragmatic-javascript

    6. http://pragprog.com/titles/pg_js'
