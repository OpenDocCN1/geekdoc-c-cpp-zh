  md: "# Pocket Guide To JavaScript's\nJavaScript Cheat Sheet\nIntentionally not exhaustive,\
    \ but with all the choiciest bits and plenty of advice and tips. v1.0.\n\n# Built-in\
    \ types & literals\n\n| Number | 0, 42, 0.15, 3e10, -3.12e-2 |\n| String | \"\
    Hello\", 'hello' (both allow escapes)\nCommon escapes: \\r \\n \\t \\\\ \"' \\\
    uXXXX (hex) \\0ooo (octal) |\n| Boolean | true, false |\n| Array | [], [1, 2,\
    \ 3], [[[]], 2, 1]... |\n| Date | new Date(...) (no literal notation) |\n| RegExp\
    \ | /pattern/flags (see dedicated pad) |\n| Function | function(...) {...} (see\
    \ dedicated pad) |\n| Object | { prop: value, prop2: value2... } |\n\ntypeof expression\
    \ -> type name, lower-cased\n\nBoolean conversions: 0, '' (empty string), null\
    \ and undefined are deemed false. Everything else is considered true.\n\n# Regular\
    \ expression redux\n\n| Classes (sets of matching characters) | \\d \\D \\w \\\
    W \\s \\S [...] [...] (literal hyphen must be at end) |\n| Boundaries | \\A \\\
    Z ^ $ \\b \\B |\n| Greedy quantifiers (largest match) | * (0+) ? (0-1) + (1+)\
    \ {min,} {max} {min,max} |\n| Reluctant quantifiers (smallest match) | *? ?? +?\
    \ |\n| Grouping | (...) captures (back-refable), (?:...) doesn't capture (faster)\
    \ |\n| Look-aheads | (?=...) requires a match, (?!...) requires a nonmatch |\n\
    | Back-references | \\1...\\9 (captures groups), \\& (entire match) |\n| Alternative\
    \ | | (if inside a group, limited to it) |\n\n# Flags:\n\n| g | Global: matches\
    \ not just the first occurrence, but all of them. |\n| i | Case-insensitive (Unicode-aware,\
    \ too!) |\n| m | Multiline: the dot class . matches any character, including line\
    \ breaks |\n\n+   - Compiling a regex again and again is slow: pre-compile in\
    \ a constant.\n+   - If you just need to test whether there is a match but don't\
    \ care about the details (groups, etc.), use regex.test(str) instead of str.match(regex).\n\
    +   - If you don't need to capture a group for later reference, but just need\
    \ to apply a quantifier to a group, mark the group as non-captured: (?:...).\n\
    \n# Functions\n\n+   - Declaration: function fName(...) { ... }\n+   - Expression:\
    \ function(...) { ... }\n\nDeclarations are \"hoisted\" within their scope: any\
    \ of them can use any other one, regardless of their order (no \"prototype declarations\"\
    \ needed).\n\n+   - \"return x;\" exits the function with return value x.\n+ \
    \  - \"return;\" exits with return value undefined.\n\nFunctions are objects like\
    \ any other, so they have methods of their own (e.g. apply, call) and can be passed\
    \ around by reference (but you'll lose their binding: their original meaning for\
    \ the \"this\" keyword). This means you can assign them to variables and pass\
    \ them as arguments, for instance.\n\nArgument lists don't specify types, and\
    \ just serve as \"hints\" that auto-assign names to the first few actual arguments\
    \ passed. But any JS function is \"varargs\": you can pass as many arguments as\
    \ you want, and access them through the built-in arguments variable, which behaves\
    \ quite like an Array (it has length and []).\n\n# Special values\n\n| undefined\
    \ | variable with no value yet, parameter with no matching argument passed. |\n\
    | null | not quite undefined; often the value of a \"no result\" DOM call, and\
    \ a way to programmatically assign \"no value\" to something. |\n| false, true\
    \ | the two boolean literals. |\n| Infinity | Numeric infinity (can be signed,\
    \ e.g. -Infinity). |\n| NaN | Result of a Not-a-Number expression, such as a failed\
    \ number parse. Not equal to any numeric, including itself. Use isNaN(n) for proper\
    \ detection. |\n\n# Operators\n\n# Arithmetics: + - * / % ++ --\n\nRemember: there's\
    \ no int/float, just Numbers!\n* % = modulo/remainder. Unary minus inverts sign:\
    \ -42.\n++ and -- increment/decrement. Unless there's a clear reason to use them\
    \ as suffixes (x++), favor prefixes (++x).\n\n# Comparisons: == === < <= > >=\
    \ !==\n\n== only compares values, using \"conversion protocols.\" So 5 == \"5\"\
    .\n0 == false, null == undefined.\n=== does strict comparison: value + type. Great\
    \ for testing undefined === x.\n!= means not-equal-to (like VB/SQL's <>).\n\n\
    # Boolean logic: && (and) || (or)\n\nJust remember:\n&& has priority over ||\n\
    a || b short-circuits (doesn't evaluate) b if a (...converts to true)\na && b\
    \ short-circuits unless a\n\n# Arithmetic shortands: += -= *= /= %= \n\na += b\
    \ behaves like a = a + b, and so on. More concise!\n\n# Member selection: [..]\n\
    \n+   - Array selection by index: array[5] (starts at 0).\n+   - Dynamic member\
    \ selection:\n+     obj[\"propName\"] <=> obj.propName\n+     obj[\"methodName\"\
    ](...) <=> obj.methodName(...)\n+     e.g. node[visible ? 'show' : 'hide']();\n\
    \n# Priorities: mostly like C++/Java/Ruby's...\n\n+   - * / % over +\n+   - &&\
    \ over ||\n+   - (...) forces priority\n+   (5 * 3) + (6 / 2) <=> 5 * 3 + 6 /\
    \ 2\n+   (a & b) || (c & d) <=> a & b || c & d && d\n\n# Bitwise ops (rarely needed):\
    \ & | ^ << >> >>>\n\n^ is XOR, << and >> shift bits (>>> with sign loss / zero-filling)\n\
    \n# Variables and scopes\n\n```\nvar x, y = 42, z, t = y * z;\n```\n\nLocal variables\
    \ must be declared using var.\nYou should strive not to use/leak global variables.\n\
    \nVariables can be assigned on-the-fly at declaration. They're accessible from\
    \ anywhere in their containing scope (mostly means: the current function).\n\n\
    If your code needs to hide some of its identifiers, be they variables or functions,\
    \ use the module pattern:\n\n```\n(function() {\n  // what's in here stays in\
    \ here unless you explicitly\n  // bring it out by return or direct assignment.\n\
    })();\n```"
