- pgno: 29
  md: '# # 6 Changing an Element’s Contents


    You may ask, why not just use innerHTML to change an element’s contents?


    It is often tempting to just go and assign the desired markup to the innerHTML
    property of the container element. Indeed, this orders of magnitude faster than
    other methods. However, on many browsers, innerHTML chokes on various bits of
    markup. Libraries switch to other mechanisms (such as manual DOM building or markup
    preprocessing) when necessary. When dealing with content injection instead of
    full-on replacement—or when the markup includes inline scripts, as discussed a
    couple paragraphs later—using libraries also proves easier, more concise, and
    less error-prone than manually tweaking markup.


    Be careful not to confuse updating with replacing. Most methods do updating by
    default—for example, the only position for dojo.place(). Updating changes the
    inside of the element, but replacing changes the element itself, thereby invalidating
    its ID and any event listeners attached to it. It is equivalent to setting the
    outerHTML property, when available.


    Fortunately, several libraries provide a wealth of special-case methods supplementing
    the basic update/insert need, such as element wrapping, selector-based multiple-element
    operations, cleanup of superfluous empty text nodes, and the like. Be sure to
    check your preferred library’s API documentation for details.


    But if you’re injecting <script> tags, watch out! By default, embedded <script>
    tags in natively injected markup will not run, and this is sometimes an issue.
    Whenever you can, work around this by leveraging event delegation. But this need
    is common enough that several libraries specifically address it:


    +   • Prototype actually runs inline <scripts> by default in update(), replace(),
    and insert(). (For Ajax updates, you’ll need to set the evalScripts option to
    true.)


    +   • jQuery’s html() method also runs inline scripts by default.


    +   • Ext’s update() method accepts a second argument that, when true, runs inline
    scripts.


    These script runnings sometimes operate within a special evaluation context for
    security purposes. Check out your preferred library’s documentation for details.


    > See Task 9, Leveraging Event Delegation, on page 36 for details.'
  merge: -1
  img_proc: true
