- pgno: 56
  md: 'Forms are a key part of web applications now. We are always gathering information
    from our users to fill in profiles, set up tasks and services, send messages,
    and whatnot. Yet most of the forms you encounter online are in a sorry state of
    usability and ergonomics. This part attempts to provide a number of recipes to
    make user experience (increasingly known as UX) better when dealing with forms.


    The key idea behind useful forms is this: don’t waste your users’ time.


    +   - Save them from double submits, using Task 18, *Temporarily Disabling a Submit
    Button.*

    +   - Let them know how much text they can still type in, thanks to Task 19, *Providing
    Input Length Feedback.*

    +   - Allow them to toggle choices on and off en masse, as shown in Task 20, *(Un)checking
    a Whole Set of Checkboxes at Once.*

    +   - Validate immediately as much of their input as possible, with Task 21, *Validating
    Forms: The Basics;* Task 22, *Validating Forms: Going Further;* and Task 23, *Validating
    Forms: The Whole Nine Yards.* Do you know anybody who likes to discover belatedly
    that their username is already taken or that their password does not comply with
    security requirements?

    +   - Provide extra help for filling in particular fields, as illustrated in Task
    24, *Providing On-the-Fly Help Tooltips on Forms.*

    +   - Suggest alternative inputs or completions; you’ll see how in Task 25, *Autocompleting
    Input As It’s Typed.*

    +   - Let them upload multiple files in one pass, a trick that’s demonstrated
    in Task 26, *Using Dynamic Multiple File Uploads.*


    Those are just a few examples of what you can do to make your forms more pleasant
    to use. We will explore how to achieve such things in the following tasks.


    Still, never forget that you cannot take JavaScript for granted. All your forms
    should still work with no JavaScript whatsoever; perhaps they will be less nifty
    to use, but they must work. The server side must validate everything no matter
    what, no links should lead nowhere when they are not intercepted by scripts, and
    so on. When putting up forms, *progressive enhancement* is paramount. Make sure
    they work without scripting or CSS, and then you can add layers of extra comfort
    through whatever technologies are available—and enabled.'
