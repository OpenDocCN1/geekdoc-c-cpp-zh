  md: '# 14 Preloading Images


    When your page offers user interaction that changes what images are displayed
    (perhaps providing a zoom, a close-up, a front/back view, or whatever), you do
    not want the user to see a momentary blank screen because the image you suddenly
    need takes an instant to load. You may want to preload such images.


    In essence, there are only three ways to preload images:


    +   - *With JavaScript, using dynamically created Image objects with appropriate
    src properties*: Doing so lets you detect when preloaded images are indeed loaded.

    +   - *With CSS, hiding preloaded images*: This boils down to using hidden <img>
    tags for the images to preload. You hide either the <img> tags themselves or a
    common container (which I prefer).

    +   - *With CSS sprites*: When you want to preload stuff like rollovers or a bunch
    of related images (backgrounds, borders, and corners, for instance), this should
    definitely be your preferred approach.¹⁹


    The CSS approach is fairly straightforward, but it does not provide you with as
    much potential control as the JavaScript approach. The markup and script on the
    facing page make the assumption that image tags with a rel="preloadZoom" attribute
    have a close-up version with the same URI—with a _closeup name suffix—preloaded
    for rollover close-ups.


    This is typically the kind of situation where the JavaScript option is preferable
    to the CSS ones. Since the rollover depends on JavaScript, we should preload in
    JavaScript too. (If no JavaScript is available, we won’t preload stuff that can’t
    be shown later.) Moreover, preloading in JavaScript avoids markup/styling bloat.


    With JavaScript, we can avoid the risk of a temporarily blank/incomplete render
    by toggling to an image only when we’re sure it’s preloaded. The nonsprite CSS
    approach runs a (admittedly low) risk of toggling to an image that is not loaded
    yet.


    For more hardcore techniques on fast image loading, take a look at Steve Souder’s
    May 2009 presentation: 14 rules for faster-loading images.²⁰


    19. Check out the seminal http://www.alistapart.com/articles/sprites and the more
    recent http://css-tricks.com/css-sprites/. Steve Souders also maintains the SpriteMe
    tool: http://spriteme.org/.

    20. http://stevesouders.com/docs/wordcamp-20090530.ppt'
