  md: '![](img/544d515106a3758d5f58491594755dce_103_0.png)


    Figure B.1: Firebug’s basic Script view on our debug bench


    The Script tab is the actual debugger. It lets you browse all the JavaScript parts
    of your page (loaded files, inline event attributes, and so on), set breakpoints,
    step through your code, keep an eye on specific expressions or variables (on the
    Watch subtab), and look at the current stack trace (in the Stack subtab). It’s
    all we need for scrutinizing our JavaScript code as it runs.


    The basic view of the script debugger for our test bench is shown in Figure B.1.


    There are basically two ways to get code running here: either drop into the console
    and type away JavaScript that triggers the code we intend to examine or cause
    events in the page that trigger the same code.¹ In our debug bench page, our fibo()
    function is called with argument 20 when a button is pressed. You can verify this
    works by clicking the button—you should get a dialog box with the result (6,765).
    There are a number of things you can do in the debugger to dig into the details
    of this function’s execution:


    +   - Choose a script file (or HTML page with inline scripts): click the arrow
    next to the filename above the source pane, and select your file.


