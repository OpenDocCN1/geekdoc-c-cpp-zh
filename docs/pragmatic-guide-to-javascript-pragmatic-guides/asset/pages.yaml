- pgno: 118
  md: 'jQuery’s focus is mostly on lowering the perceived barrier-to-entry for people
    wanting to spruce up their web pages with a bit of JavaScript without prior knowledge
    of the language (or sometimes of programming in general). Its API provides a lot
    of quick shortcuts targeted at the most common use cases, and a number of plug-ins
    (some of them grouped in the jQuery UI project) take care of the rest. Recently
    I’ve been hearing people describe jQuery as “a DSL for DOM manipulation” or state
    that “jQuery comes from selectors to code, allowing people who know CSS to use
    JavaScript.” Although not entirely accurate (as in, a bit reductionist), such
    characterizations do capture the essence of jQuery.


    The major driving force behind jQuery is its astounding team. Aside from almost
    two dozen people working on plug-ins projects, the core, the UI, and the website,
    its force very much lies with the half-dozen people who nurture the jQuery community
    through conferences, events, meetups, and the like. Having a number of corporate
    sponsors doesn’t hurt, but the project itself remains open source, using a dual
    GPL/MIT license, hosted at GitHub, and allowing bug reports through Trac.


    Around the core jQuery project and the jQuery UI, you’ll find a number of magazines
    and conferences, meetups, user groups, and online forums. Several jQuery books
    have been published, including jQuery for Dummies [Bei10], jQuery in Action [BK10],
    jQuery: Novice to Ninja [CS10], and jQuery Cookbook [Lin09].


    As I mentioned, I believe jQuery and Prototype address somewhat different need
    sets. I cannot deny the many merits of jQuery, and I certainly see how appealing
    it is to large categories of users, such as those needing JavaScript as a mere
    tool toward quick ends, who don’t want to have to learn too much API to get common
    tasks done in a snap. The teeming life of the jQuery community is also a big plus,
    because it inspires confidence in the project’s longevity and level of support.
    jQuery is, at the time of this writing, at version 1.4.2.


    Here’s a list of the URLs you’re likely to need or want to check out:


    +   - The official website is http://jquery.com/.

    +   - The official website for jQuery UI is http://jqueryui.com/.

    +   - Source code is hosted at GitHub: http://github.com/jquery/jquery.

    +   - Bug tracking can be found at http://dev.jquery.com/.

    +   - All official forums can be found at http://docs.jquery.com/Discussion.


    2. This goes to show how widely known the framework has become!'
