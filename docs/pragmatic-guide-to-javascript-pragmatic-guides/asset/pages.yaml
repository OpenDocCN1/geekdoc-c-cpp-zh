- pgno: 91
  md: '# 33 Syndicating Your Twitter Updates


    Fetching your recent tweets is a piece of cake, as is using most of Twitter’s
    API. It’s just a simple JSON-P call, really!


    We won’t fetch retweets, mentions, or whatnot here. This is because most Twitter
    syndication happens in a business context, where your Twitter account is used
    as an extra marketing channel and you’re not interested much in showing retweets,
    replies, or mentions alongside your own messages. Moreover, the Twitter API does
    not provide a straightforward way to grab, say, retweets alongside tweets—you’d
    need two separate calls, one of them authenticated, which means that authentication
    to your own account would be available on the client side in your visitors’ browsers.
    And we don’t want that. (The other option is syndication on the server side, which
    falls outside the scope of this book.)


    In the code on the facing page, the actual fetching takes only a couple of lines,
    in the loadTwitterStream() method. Twitter gives you read access to any username’s
    direct tweets through a URL, 30 and we’re interested in a JSON format here.


    What you get back is an array of tweet objects with a wealth of properties, such
    as created_at, geo, in_reply_to_status_id, source, and text.31


    The twitterCallback() function on the facing page illustrates simple tweet formatting:
    linking up a reply mention and URLs in general. In the online example code for
    this task, you’ll get an augmented version that also handles hash tags and mentions
    and shows author information (avatar, name, tweet count, and so on).


    Before you do too much with Twitter’s API, you should go through Twitter’s nice
    API documentation32 and also be careful about rate limits enforced on parts of
    the API to avoid overtaxing the system as your usage scales up.


    30. http://twitter.com/statuses/user_timeline/username.format

    31. You’ll get full details at http://apiwiki.twitter.com/Return-Values.

    32. http://apiwiki.twitter.com/'
  merge: -1
