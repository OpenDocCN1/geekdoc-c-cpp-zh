- pgno: 124
  md: '# Getting Help


    Well, I certainly hope you found this book useful. Still, you’ll need to find
    some solutions yourself, or you may need someone to confirm you’re on track. So,
    where can you get more help and engage with other people about all this?


    # D.1 Help on JavaScript in General


    Having great frameworks around is no excuse for not knowing your JavaScript. Sometimes
    you actually need to dive in and write some actual code, or perhaps you can’t
    make use of your usual framework for various reasons (performance on mobile devices,¹
    anyone?).


    # Newsgroups


    Remember the time before DSL was (almost) everywhere? Before Google Groups? Before
    Google, actually? Well, perhaps you weren’t developing back then, but we had Usenet.
    It’s still around, and recently, a new generation has discovered how good it can
    be at, say, sharing binary files. Better still, it has newsgroups for every programming
    language known to man.


    Every ISP provides newsgroup access; it’s that weird “NNTP server” thing you saw
    on your subscription papers. And most aggregators, feed readers, and even email
    clients—Thunderbird, Entourage, Outlook, and, yes, even Outlook Express—let you
    connect to an NNTP server and subscribe to newsgroups of your choice. (Depending
    on your ISP, you’ll have your pick of thousands.)


    Heck, even if you don’t want to access these groups that way, Google Groups maintains
    bridges to most useful newsgroups, including the following ones:


    +   - The core of all the action is at comp.lang.javascript. (The address is short
    for COMPuter LANGuage JavaScript.) It’s been around for ages and remains the main
    location for all online discussions related


    1. Except if you’re using the awesome, just-released zepto.js library by Thomas
    Fuchs: http://github.com/madrobot/zepto. Or even go fastest-ever with vapor.js:
    http://github.com/madrobot/vapor.js.'
  merge: -1
