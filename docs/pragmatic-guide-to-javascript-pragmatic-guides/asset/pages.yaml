- pgno: 16
  md: 'It’s time to get started. This part serves as a warm-up with a couple fundamental
    pieces of know-how about bare-bones JavaScript. The code samples in the following
    tasks do not rely on any framework or library.


    +   - You’ll learn how to access object properties and methods dynamically (once
    your code decides what their name is) in Task 1, *Dynamically Selecting a Method/Property*.

    +   - In Task 2, *Achieving Code Privacy with the Module Pattern*, you’ll find
    out how to keep internals of your code enclosed in a private scope to avoid “polluting”
    other code and keep your stuff self-contained.

    +   - Finally, you’ll be able to create functions that can be called with a wide
    variety of arguments, using Task 3, *Using Optional, Variable, and Named Arguments*.


    Remember that you can get a full source code archive for this book on its online
    page.⁷ You can also access them directly at the demo site.⁸ Finally, don’t forget
    that a simple empty web page (later, with whatever libraries or frameworks you
    need loaded in), with a JavaScript console open, is all you need to test this
    stuff interactively.'
