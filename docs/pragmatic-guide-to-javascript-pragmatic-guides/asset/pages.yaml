- pgno: 11
  md: '# Introduction


    If you’ve been paying even minimal attention to JavaScript these past few years,
    you’ve heard this before: it’s the Next Big Language. Once the province of half-baked
    implementations and useless scrolling messages, it has become a world-class, dynamic,
    object-oriented language with super-fast implementations on the client and server
    sides.


    On the one hand, JavaScript’s designers are endowing it with a new healthy dose
    of power, through the EcmaScript 5 (ES5) specification. On the other hand, kick-ass
    engines (such as V8, JavaScriptCore, SpiderMonkey, Rhino, and Carakan) and emergent
    standards and technologies (with CommonJS¹ and Node² in the lead) make it usable
    both in browsers and as stand-alone, powerful architectures on the server. Even
    the upcoming Internet Explorer 9 is upping its JavaScript game with the promise
    of huge speed boosts.


    Not only is JavaScript a powerful, dynamic language, but it now has a rich ecosystem
    of professional-grade development tools, infrastructures, frameworks, and tool
    kits. It is versatile, fast, and very well suited to a wide range of programming
    tasks, especially when it comes to web-based applications and services.


    It’s time to dive in!


    # What’s This Book About, and Who Is It For?


    This book is not really intended to teach you “JavaScript the language.” For one
    thing, the language itself is not very complicated, so if you have prior experience
    in programming any reasonably common language—even if it’s just the basics (variables,
    loops, and so on)—you’ll get your bearings easily enough. You don’t need to actually
    know some JavaScript already (although it could help), and you certainly don’t
    need to be any sort of programming guru.


    Actually, if you’re looking for the nitty-gritty and the hardcore technical details
    of JavaScript, you’ll be better off reading a dedicated resource, such as


    +   1. http://commonjs.org/

    +   2. http://nodejs.org/'
  merge: -1
  img_proc: true
- pgno: 12
  md: 'the “JavaScript core skills” section of Opera’s excellent Web Standards Curriculum.³
    Should you ever need even more intricate, implementation-level details, you could
    then head to either the official specs of the language or one of the massive “bible”
    books such as David Flanagan’s JavaScript: The Definitive Guide [Fla06].


    This book aims to provide you with quick yet qualitative solutions to common client-side
    JavaScript-based tasks, from low-level stuff (such as getting a reference to a
    DOM element) to intricate features (such as Ajax-based autocompletion). This means
    we’ll tackle JavaScript, CSS, the DOM, Ajax, JSON, and more. We won’t go deep
    into the server side; this book is mostly on the client side of things (most often
    the browser). You’ll encounter a couple of tiny PHP scripts along the way, for
    illustration purposes, but you could write your server side any way you like—including
    in JavaScript, for instance, with Node!


    It’s not just for copying and pasting, either. The text for each task takes care
    to highlight the key concepts, the potential gotchas, and the technical tricks
    you should take away from the task. Ultimately, you should step away from this
    book as a better JavaScript programmer.


    # This Book and JavaScript Libraries


    Let’s speak plainly here. If you’re doing any sort of nontrivial JavaScript programming
    and you’re not relying heavily on good, established frameworks for it, You’re
    Doing It Wrong. On the browser side, effectively pulling off web page scripting
    is a challenge. You face obstacles from all sides: DOM inconsistencies, faulty
    language implementations, CSS quirks, weird Ajax bugs, and more. On the server
    side, once you have a runtime ready, you still face the enormous task of putting
    together the basic bricks of an application server such as a datastore, a network
    stack, a module system, and so on.


    Fortunately, great people already solved these challenges for you. There’s a wealth
    of options, too, especially on the client side; take a look at Appendix C, on
    page 116, for details on the main JavaScript frameworks.


    Because any competent and pragmatic JavaScript developer will rely on one or more
    good frameworks, this book takes care to illustrate all the major client-side
    frameworks in what I think of as “basic” tasks. I selected Prototype, jQuery,
    MooTools, YUI, Dojo, and ExtJS, which should cover most of the “developer mind
    share” in this business.


    > 3. http://www.opera.com/company/education/curriculum/'
  merge: -1
