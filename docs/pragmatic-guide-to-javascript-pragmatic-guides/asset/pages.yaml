- pgno: 61
  md: '# 20 (Un)checking a Whole Set of Checkboxes at Once


    It happens time and time again: you have a list, and there are operations your
    users would like to do en masse. The tasks of deleting, moving, archiving, and
    changing a given property for a number of them all boil down to letting your users
    check specific items.


    And sometimes, all of them. That can be a pain in the butt when the list is long,
    and that is why mass toggling is a nice UI feature.


    ![](img/544d515106a3758d5f58491594755dce_61_0.png)


    The markup is simple. Let’s just put a checkbox in the table’s head section to
    act as a toggler. This scopes it automatically, letting our script navigate to
    the matching <tbody> as a container for checkboxes of interest.


    The script itself is fairly concise: react to clicks on the toggler by looking
    up checkboxes in the matching <tbody> and updating their checked= attribute to
    reflect our togglers.


    Now, as an exercise, you could try to adapt this code to achieve two goals:


    +   - Allow multiple tables in the page, with a toggler each. This mostly means
    you’ll replace an id= with a class and use event delegation to avoid registering
    too many listeners.

    +   - Cater to the more complex tables by allowing more than one <tbody> in a
    table. Yes, that is valid markup (one body per semantic section of the table,
    when you group data in some way). Interestingly, if you add more than one <tbody>,
    you’ll end up simplifying the script!'
  merge: -1
  img_proc: true
