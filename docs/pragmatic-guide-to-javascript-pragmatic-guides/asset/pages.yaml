  md: "# Use vars inside anonymous functions.\n\n```\n(function() {\n  var privateField\
    \ = 42;\n\n  function innerFunc() {\n    notSoPrivate = 43;\n    return notSoPrivate;\n\
    \  }\n\n  alert(privateField); // => 42\n  innerFunc();\n  alert(notSoPrivate);\
    \ // => 43\n})();\nalert(typeof privateField); // => undefined\nalert(notSoPrivate);\
    \ // => 43 (ouch!)\n```\n\n# Try this example: \"private properties.\"\n\n```\n\
    var obj = (function() {\n  var privateField = 42;\n  var publicField = 'foobar';\n\
    \n  function processInternals() { alert('Internal stuff: ' + privateField); }\n\
    \n  function run() {\n    processInternals();\n    alert('Still private stuff:\
    \ ' + privateField);\n    alert('Public stuff: ' + publicField);\n  }\n\n  return\
    \ {\n    publicField: publicField,\n    run: run\n  };\n})();\n\nobj.run() //\
    \ three alerts: Internal, still private, public\nobj.publicField // foobar\nobj.processInternals()\
    \ // Undefined\nobj.privateField // Undefined\n```"
