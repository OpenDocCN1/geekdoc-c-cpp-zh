- pgno: 87
  md: '# 32 Cross-Domain “Ajax” (Take 2)


    There are a few other ways to access other-domain, remote contents behind the
    scenes. For starters, you can use our trusty JSON-P friend. One interesting use
    of JSON-P—to access a treasure trove of services, APIs, and contents—is the YQL
    service by Yahoo! YQL lets you read (and sometimes write to) data tables that
    map onto just about every possible resource you could dream of: well-known websites
    and services (search, maps, geolocation, social networks, Flickr, music data,
    weather, feeds and microformats, and so on). If you haven’t played with it yet,
    head over there now.26


    When it comes to accessing a random resource and returning its raw HTML response,
    YQL provides two awesome “tables” named html and htmlpost (the latter one is a
    community table provided by Chris Heilmann and is hence full of win). These let
    you GET or POST to an HTML-returning resource and will even extract contents for
    you based on an XPath selector!


    I also want to mention a rather nifty approach, dubbed CSSHttpRequest. It does
    require a server side, though. This relies on the data: URI scheme to embed random
    contents inside special-name CSS rules. Because CSS files are not subject to the
    same-origin policy, this works. A small open source library provides the CSSHttpRequest
    JavaScript object and also server-side code for Ruby, Python, and PHP (which are
    fairly easy to adapt to other languages). You can get the details online.27


    The code example for this task in the book’s codebase lets you play with all the
    approaches listed previously.


    I’ll wrap up with two ways I intentionally didn’t include here so you won’t say
    I forgot them. (Ha!) First, you could use a Flash bridge; although this requires
    some form of CORS information on the server side, there’s a library called fIXHR
    that makes this a snap. But Flash is a proprietary technology that I happen to
    dislike, and even this aside, loading Flash for this is way overkill.


    Finally, you could also use a “web bug,” a server-side call to a dynamically selected
    image, through a regular <img> tag (that you would generate with your script).
    The thing is, the only response you can derive is based on the image dimensions,
    and properly detecting these after load is, surprisingly, a can of worms. Balancing
    how limited the response is versus how much jumping-through-flames is required,
    I avoid this technique.


    26. http://developer.yahoo.com/yql/

    27. http://nb.io/hacks/csshttprequest'
