- pgno: 65
  md: '# 22 Validating Forms: Going Further


    The previous task had us check that required fields are indeed filled in or checked.
    Good. However, we’ll often want text fields to obey a given format, such as phone
    numbers, email addresses, integers, or more general numbers. Such fields can be
    filled in but incorrect, and we should do our best to check that up front. As
    always, this is a *complement* to the truly mandatory checks, which are the ones
    on the server side.


    The general way to go about this, which is fairly concise and efficient, is a
    regular expression. Now, if at this point in your developer career you’re not
    comfortable with regular expressions, do yourself a big favor and set aside a
    couple of hours to dive into them. Although they can look inscrutable to the novice,
    they are built on very few syntactic rules (about a dozen, half of which are usually
    sufficient), and knowing “regexes” will save you countless coding hours over and
    over again. You can find plenty of good, interactive tutorials online.


    On the facing page, the idea of the code is to detect CSS classes on form fields
    that match a regex-based check. I just put three regexes in there, but you can
    extend features by simply adding new key-value pairs to the FIELD_PATTERNS dictionary.
    But let me fend off the purists’ teeth-grinding right now. Yes, the patterns I
    show do not cover nondecimal numbers, exponential float notation, and about 0.1
    percent of the email addresses in use today. Big deal. But this task is about
    field validation, not regex-fu. Feel free to tweak the patterns to suit your needs!


    This code is fairly short and straightforward; there are just two bits of interest
    I’d like to shine some light on here. First, the $(element) function is just a
    shorthand notation for element.getValue().


    Second, if you’ve ever used regexes in JavaScript, odds are you went with the
    all-purpose myString.match(myPattern) way. This works, because it returns either
    null for no match or an Array of matches (or match groups) otherwise. However,
    when all you need to know is whether a match was found or not and you don’t care
    about the match’s specifics, you should invert the question and ask the pattern
    to test() the String, which just returns a Boolean.


    Indeed, the test() approach is more robust: it will not break if passed something
    else than a String, while attempting to call match() on a non-String would fail.
    As an added benefit, test() is slightly more efficient. I like to use such bits
    of performance as a matter of course, especially when they don’t carry a code
    readability (or code weight) penalty.'
  merge: -1
  img_proc: true
