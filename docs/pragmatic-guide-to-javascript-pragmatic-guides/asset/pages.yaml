  md: "# Deciding what path to take\n\n```\nif (condition) {\n  code\n}\n\nif (condA)\
    \ {\n  codeA\n} else if (condB) {\n  codeB\n} else {\n  codeC\n}\n```\n\n```\n\
    switch (expr) {\n  case valueA:\n    codeA\n    break;\n  case valB1:\n  case\
    \ valB2:\n    codeB\n    break;\n  default:\n    codeC\n}\n```\n\nProtip: early\
    \ tests with returning code let you avoid nesting the rest in an else block and\
    \ keep your indentation sane!\n\n# Looping around\n\n```\nfor (decl; test; incr)\
    \ {\n  code\n}\n\ndo {\n  codeRunAtLeastOnce\n} while (cond)\n```\n\n```\nwhile\
    \ (cond) {\n  codePerhapsNeverRun\n}\n\nwhile (true) {\n  codeRunAtLeastOnce\n\
    \  if (!skipRestOfTurn)\n    continue;\n  if (justStopLooping)\n    break;\n \
    \ remainderCode\n}\n```\n\n\"Fast array loop\":\n\n```\nfor (var i = 0, l = arr.length;\
    \ i < l; ++i)\n  code\n```\n\n# Array stuff you should know\n\n```\nvar arr =\
    \ [2, 3, 4, 5, 6];\n\narr.length                 // => 5\narr.concat([7, 8, 9])\
    \      // => [2,7,9]\narr                        // => [2,9]\narr.push(10)   \
    \            // => [2,10]\narr.unshift(1)             // => [1,10]\narr.pop()\
    \                  // => 10\narr.shift()                // =>\narr.slice(4, -2)\
    \           // => [6, 7, 8]\narr.join('')               // => '23456789'\n\narr.sort(function(a,\
    \ b) {\n  return b - a;\n}) // => [9, 8, 7, 6, 5, 4, 3, 2]\narr.sort()       \
    \          // => [2, 3, 4, 5, 6, 7, 8, 9]\narr.splice(5)              // => [7,\
    \ 8, 9]\narr                        // => [2, 3, 4, 5, 6]\n```\n\n# Really useful\
    \ String stuff\n\nFirst, there's a length property (characters, not bytes).\n\n\
    ```\n'yay'.charAt(1)                // => 'a'\n'hello'.indexOf('l')          \
    \  // => 2\n'hello'.indexOf('l', 3)         // => 3 (specified min pos)\n'hello'.lastIndexOf('l')\
    \        // => 3\n'hello'.lastIndexOf('l', 2)     // => 2 (specified max pos)\n\
    'hello'.replace(/l/, 'L')       // => 'heLlo'\n'hello'.replace(/[aeiou]/g, '-')\
    \ // => 'h-ll-'\n\n'hello'.replace(/C(/I/g, function(s) {\n  return s.toUpperCase();\n\
    }) // => 'HELLO'\n\n'a b c'.split(' ')              // => ['a','b','c']\n'a b\
    \ c'.split(/\\s+/)           // => ['a','b','c']\n'abc'.split('')            \
    \     // => ['a','b','c']\n'a b c'.split(' ', 2)           // => ['a','bc'] (specific\
    \ max count)\n'hello'.substring(2)            // => 'llo'\n'hello'.substring(2,\
    \ 4)         // => 'll' (specified end boundary)\n'hello'.slice(-3)          \
    \     // => 'llo' (start 3 from end)\n'hello'.slice(3, -1)            // => 'll'\
    \ (specified end boundary, 2 from end)\n'Elodie'.toLowerCase()          // =>\
    \ 'elodie'\n'déjà ça'.toUpperCase()         // => 'DÉJÀ ÇA'\n'hello'.match(/C(/I)\
    \            // => ['l','l']\n† full match at index 0, captured group 1 at index\
    \ 1, etc.\n```\n\n# Exception/error handling\n\n```\ntry {\n  thisCodeMayExplode\n\
    } catch(e) {\n  thisCodeRunsOnlyOnErrors // e refers to the error object\n} finally\
    \ {\n  thisCodeRunsWhetherOrNotThereIsAnError\n}\n```\n\nYou can raise your own\
    \ errors (any object will do) with raise exceptionObject\n\n# Math functions\n\
    \n# A few global goodies\n\n# Asynchronous code: using timeouts\n\n# Poor man's\
    \ debugger\n\n# Identifiers and reserved words"
