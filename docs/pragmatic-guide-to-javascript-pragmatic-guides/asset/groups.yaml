  - '[PAGE 76]


    The previous part showed us, among other things, how we could go about validating
    as much input as we could on the client side. It also started dipping into server-provided
    data for more involved validations, completions, and so on. Most web apps rely
    on a back end to do their thing; how they “talk” with that back end is the topic
    of this part.


    +   - We’ll first talk about cookies, one of the earliest ways of persisting state
    across requests, allowing us to create a *session* of navigation for our users
    so we can remember what they’ve done, remember who they are, and so on. This is
    covered in Task 27, *Reading/Writing Cookies*. Permanent cookies, stored on the
    user’s disk, let us “remember” them across visits, too, which can have useful
    applications. Unfortunately, native cookie manipulation in JavaScript is rather
    poor; we’ll see how to deal with them more easily.

    +   - We’ll then focus on the Big Boy of Web 2.0 applications and services: Ajax.
    First, we’ll cover the basics of how to talk with our server without reloading
    the page; this is in Task 28, *Loading Stuff Through Ajax (Same Domain)*.

    +   - Then we’ll get a good look at JSON in Task 29, *Using JSON*, and its cousin
    JSON-P in Task 30, *Using JSON-P*. These are a great way of exchanging data between
    a JavaScript-driven client and any server (so much easier to wield than XML).

    +   - Finally, as an opening path toward mashups, we’ll cover most of the (numerous)
    ways of talking with third-party services located on domains other than ours.
    This is available in Task 31, *Cross-Domain "Ajax" (Take 1)*, and Task 32, *Cross-Domain
    "Ajax" (Take 2)*.


    Debugging Ajax or JSON-P calls can be pretty tricky. If you haven’t read through
    it yet, be sure to check Appendix B, on page 102. You’ll get all the tools you
    need there to comfortably pry into whatever client-server exchanges your code
    is doing; there’s just no point in needlessly wasting hours and pulling your hair.'
  - '[PAGE 77]


    # 27 Reading/Writing Cookies


    Directly tweaking cookies on the client side is often useful. We can use them
    to spare our users the need to redefine their settings at every page load by persisting
    stuff such as pagination size, active tab (in a tabbed UI) across post-and-redirect,
    collapsed/expanded nodes in a tree, and so on.


    Regardless of how we set up these cookies (in scope or expiry), the only native
    interface to the cookie subsystem we get is the “DOM Level 0” document.cookie
    property. This property acts as a getter when read and as a setter/deleter when
    written to. Unfortunately, it didn’t go out of its way to provide a neat interface
    for individual cookie settings. It feels like we’re reading and writing raw HTTP
    headers!


    So, to spare us this tedium, most frameworks provide, either directly or through
    well-known plug-ins, more comfortable access to cookies. Cookie management is
    a small enough matter, though, that you should not have to depend on a framework
    for it. Even if you do use a framework already—which you should!—and it has cookie-related
    features, you may not like its API for it.


    That’s why, as I show on the facing page, I wrote a stand-alone cookies JavaScript
    helper. It does not require any framework and attempts to provide a handy API
    (especially when it comes to options). It’s well tested and documented; you may
    want to give it a shot!


    Finally, you should keep in mind a few facts about cookies:


    +   - They reside on the client side, so they’re pretty much naked in the wild.
    You should never put sensitive data in there, unless you’re encrypting and tamper-proofing
    them in some robust way.

    +   - They’re severely limited in size (4KB) and should therefore not be used
    for storing large items of data (such as history, complex cart contents, text
    drafts, and so on).

    +   - They might not be available, although this is a very rare phenomenon. What’s
    a bit more frequent, however, is for set-expiry cookies not to persist across
    sessions, because of security policies in the browser (either because of company
    security policies or because your user configured their browser that way out of
    privacy concerns).


    So, try to use cookies only for extra comfort, especially persistent cookies.'
