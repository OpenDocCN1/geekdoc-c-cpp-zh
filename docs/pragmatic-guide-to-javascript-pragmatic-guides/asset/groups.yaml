    \n![](img/544d515106a3758d5f58491594755dce_112_0.png)\n\n图 B.9：IE8 开发者工具：Script\
    \ 选项卡\n\n选项、局部变量、监视、调用堆栈检查、某种控制台（我希望微软别再叫它们“即时窗口”……），以及可禁用或删除的断点（不过不能对断点设置条件）。\n\
    \n这些真的就是我们需要的全部了！整个工具用起来响应很快，从来没有让我的 IE8 卡死。说真的！\n\n# B.6 Opera 与 Dragonfly\n\n\
    Opera 在提供开发者工具方面采用了一种不同寻常的方式。它的 Dragonfly 工具“既可离线也可在线”，因为当你在 Opera 中打开它的窗格时，它会通过互联网自动下载并更新。这意味着第一次使用时需要联网，这应该不算什么问题。不过，就我个人经验来看，我发现它似乎必须联网才能正常工作。离线时，即使我之前已经下载过它，它通常也会启动失败，因为它无法连接到\
