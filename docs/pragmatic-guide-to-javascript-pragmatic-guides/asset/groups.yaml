  - '[PAGE 9]


    # Acknowledgments


    Writing a book is never easy. A technical book doesn’t need a plot and spares
    the author the anguish of the blank page, but it subjects the author to a world
    of pressure from peers and the duties to be technically accurate and to convey
    best practices. This is why writing a book remains a significant endeavor and
    why authors can use all the help they can get.


    In writing this book, I am first and foremost indebted to the amazing creators
    of the frameworks I mention and use. Not only did they grace the world with their
    praiseworthy work, but many also took the time to review this book and make sure
    I didn’t unintentionally disgrace their brainchildren. I owe heartfelt thanks
    to Sam Stephenson, Thomas Fuchs, John Resig, Alex Russell, Jack Slocum, and a
    large number of core developers and contributors who I couldn’t possibly have
    enough space to name here. I am even more indebted to the members of the Prototype
    Core team. They’ve been a helpful, highly skilled bunch with whom I’ve learned
    so much, especially Andrew Dupont, Tobie Langel, and Juriy Zaytsev.


    In the search for technical accuracy and overall book bettering, a number of people,
    some of whom I mentioned already, gracefully agreed to review this book and reduce
    the chances of my making a fool of myself. And I was indeed graced with an outstanding
    list of reviewers! I bow with respect and gratitude to Dion Almaer, Arnaud Berthomier,
    Aaron Gustafson, Christian Heilmann, Dylan Schiemann, and Sam Stephenson.


    This is my second book with the Pragmatic Programmers. Once again, Dave Thomas
    and Andy Hunt opened their virtual doors to me and let me work with their wonderful
    staff on this new series of books, the Pragmatic Guides. It’s been a thrill to
    work with the series editor, Susannah Davidson Pfalzer; my editor, David McClintock
    (making his Prag debut); the keen-eyed Kim Wimpsett for copyediting; the wizardly
    Sara Lynn Eastler for producing a Pragmatic-quality index; and the skillful Steve
    Peter, whose typesetting makes the book look good.'
