    \ '_closeup$1');\n  } else {\n    trigger.src = trigger.src.replace('_closeup',\
    \ '');\n  }\n}\n\ndocument.observe('mouseover', togglePreloaded).\n  observe('mouseout',\
    \ togglePreloaded);\n```\n\n## 15 Creating a Lightbox Effect\n\nLightboxing is\
    \ the act of bringing up some content while shadowing the rest of the page behind\
    \ a mouse-inhibiting overlay. Most of the time, the lightbox UI is centered on\
    \ the page. Lightboxes usually feature images and are launched from linked text\
