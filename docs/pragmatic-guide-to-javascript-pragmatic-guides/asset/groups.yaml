    # Decode/encode a JSON string barehanded.


    ```

    // Fast but only as secure as jsonString

    var data = eval(''('' + jsonString + '')'');


    // Native JSON support or json2.js; more secure

    var data = JSON.parse(jsonString);


    JSON.stringify(obj); // Native JSON support

    ```


    # Decode/encode a JSON string with frameworks.


    ```

    // Prototype has toJSON() instance methods plus these:

    Object.toJSON(obj)

    someJsonString.evalJSON([sanitize = false])

    // jQuery

    $.parseJSON(someJsonString)

    // MooTools

    JSON.decode(someJsonString[, secure = false])

    JSON.encode(obj)

    // YUI

    Y.JSON.parse(someJsonString)

    Y.JSON.stringify(obj)

    // Dojo

    dojo.fromJson(someJsonString)

    dojo.toJson(obj[, prettyPrint = false])

    // Ext

    Ext.util.JSON.decode(someJsonString)

    Ext.util.JSON.encode(obj)

    ```


    # Related Tasks


    +   - Task 30, Using JSON-P, on the next page'
  - '[PAGE 83]


    # 30 Using JSON-P


    Using JSON-P is the predominant way to get remote, structured data into a JavaScript-based
    client. The main transport for it relies on dynamically generated <script> tags,
    and this has an interesting side effect: the transport is not restricted by the
    same-origin policy. A growing number of web services and APIs (especially the
    RESTful ones) provide a JSON output format and JSON-P support.


    The simple idea behind it is this: you get back a JavaScript source that passes
    a regular JSON literal to a callback function you provided. This means that the
    callback function was defined beforehand by your own code and made globally available
    (which is not so great, but we can’t work around that).


    Now, depending on your mind-set and how much you can trust the remote resources
    you intend to use with JSON-P, this can be either a relief (this is a great way
    of emulating cross-domain Ajax) or a concern (JSON-P essentially runs JavaScript
    generated by a third-party in your page).


    If you’re targeting your own server and resources, you’re in the clear, and it’s
    all rainbows and unicorns. But if you’re targeting third-party resources you do
    not entirely trust, there could be trouble. Because of the mechanism involved
    (a <script> tag), you cannot preparase the returned JavaScript to make sure it’s
    a safe JSON-P callback invocation. To get that intermediary step, you’d have to
    use actual Ajax to get the script, which won’t work on all browsers for a third-party
    resource, as we’ll see in the next task.


    At any rate, measuring trustworthiness and reliability of your remote JSON-P providers
    is up to you.


    I should point out that the transport we’re using—dynamic <script> tags—restricts
    JSON-P to GET requests and, consecutively, to payloads at about 4KB (a traditional
    GET limitation). Although there’s no magic cure for the latter, with some help
    from the server side, we can easily turn a GET request into anything else, as
    we’ll see in Task 32, Cross-Domain “Ajax” (Take 2), on page 88.'
