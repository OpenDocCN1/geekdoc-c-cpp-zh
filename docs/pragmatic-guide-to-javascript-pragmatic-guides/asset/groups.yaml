    for Dummies》[Bei10]、《jQuery in Action》[BK10]、《jQuery: Novice to Ninja》[CS10] 和《jQuery
    Cookbook》[Lin09]。


    正如我所提到的，我认为 jQuery 和 Prototype 针对的是略有不同的需求集合。我不能否认 jQuery 的诸多优点，也完全理解它为何对大量用户有吸引力，比如那些仅仅把
    JavaScript 当作快速达成目的的工具、不想为了快速完成常见任务而学习太多 API 的人。jQuery 社区充满活力也是一大加分项，因为它让人对该项目的持久性和支持水平充满信心。在撰写本书时，jQuery
    的版本是 1.4.2。


