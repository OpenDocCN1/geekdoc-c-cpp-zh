    \ value[, options]);\nYAHOO.util.Cookie.get(name[, typeOrDecoderCallback]);\n\
    YAHOO.util.Cookie.remove(name[, options]);\n// YUI >= 3\nY.Cookie.set(name, value[,\
    \ options]);\nY.Cookie.get(name[, typeOrDecoderCallback]);\nY.Cookie.remove(name[,\
    \ options]);\n// Dojo\ndojo.cookie(name, value[, options])\ndojo.cookie(name)\n\
    dojo.cookie(name, null, { expires: -1 });\n// Ext\nExt.util.Cookies.set(name,\
    \ value[, expires][, path][, domain][, secure])\nExt.util.Cookies.get(name)\n\
    Ext.util.Cookies.clear(name)\n```\n\n使用我的独立 cookies.js 助手。\n\n```javascript\n\
    // Helper available at http://github.com/tdd/cookies-js-helper\nCookie.get(name)\n\
    Cookie.list([nameRegExp])\nCookie.set(name, value[, options])\nCookie.remove(name[,\
    \ options])\nCookie.test()\n```\n\n## 28 通过 Ajax 加载内容（同域）\n\n执行 Ajax 请求，尤其是在与当前页面相同域上，是当今\
    \ Web 应用如此基础的构建块，以至于我必须说明如何在所有主要框架中执行它。然而，我不可能指望在这一页甚至十页中容纳所有细节。每个框架都提供大量围绕 Ajax\
    \ 行为的选项、设置和调整，涵盖起来需要大量篇幅。\n\n因此，我只会用对面页上的通用签名为你指明正确的方向，并提供一些进一步探索的途径：\n\n- 所有框架都允许你使用四种基本\
    \ HTTP 动词——GET、POST、PUT 和 DELETE——以及调整后的 HTTP 头发送 Ajax 请求，因此你可以顺畅地与例如 REST 服务交互。\n\
    - 所有框架都提供许多回调——因此你可以对 Ajax 响应应用自定义处理，或在请求生命周期中参与（开始、成功/失败、完成等）。常见的 Ajax 响应格式如\
    \ JavaScript、JSON、JSON-P、XML 和 HTML 通常享有内置的自动解码（有时还有自动处理，尤其是 JavaScript 和 JSON-P）。\n\
    - 若干框架允许你为 Ajax 选项指定通用默认值（例如 jQuery 有 $.ajaxDefaults）并注册全局回调（通常用于在页面所有 Ajax 请求中维护单个\
    \ Ajax 指示器——例如著名的“旋转器”）。\n- 若干框架提供用于“Ajax 化”表单的特殊快捷方式，要么使用 HTML 规定的序列化，要么让你调整它。例如，YUI\
    \ 3 有一个 form 选项，而 Prototype 为 <form> 元素配备了 request() 快捷方式。\n- 每个框架都提供一些特定功能，例如文件上传能力、HTTP\
    \ 基本身份验证支持、重入控制和请求链、响应缓存等。\n- 你应始终确保为 Ajax 调用的成功和失败提供有用的行为。失败情况经常被忽略或处理不当。\n\n\
    最后一条建议：以同步模式使用 Ajax 请求大致相当于在你的网页中召唤一个凶恶的恶魔。如果你想要同步，就承认这一点，直接进行常规页面重新加载！\n\n###\
    \ 发出一个简单的 Ajax 请求。\n\n```javascript\n// Prototype\nnew Ajax.Request(url[, options])\n\
    new Ajax.Updater(container, url[, options])\n// jQuery\n$.ajax([settings])\n//\
    \ MooTools\nnew Request([options])\n// YUI < 3\nYUI.util.Connect.asyncRequest(method,\
    \ url, callback, postData)\n// YUI >= 3\nY.io(url[, config])\n// Dojo\ndojo.xhrGet(settings)\
    \ // or xhrPost, xhrPut, xhrDelete.\n// ExtJS\nExt.Ajax.request(settings)\n```\n\
    \n### 使用更复杂的、基于 Prototype 的功能，略作尝试。\n\n```javascript\nAjax.Responders.register({\n\
    \  onCreate: function() { $('spinner').show(); },\n  onComplete: function() {\n\
    \    if (0 == Ajax.activeRequestCount)\n      $('spinner').hide();\n  }\n});\n\
    \nnew Ajax.Updater({ success: 'latestUsers' }, '/users/latest', {\n  method: 'get',\n\
    \  parameters: { mode: 'summary', threshold: 'auto' },\n  evalScripts: true,\n\
    \  onFailure: function() {\n    logError(\"We could not fetch the latest logged-in\
    \ users, sorry.\");\n  }\n});\n```\n\n"
