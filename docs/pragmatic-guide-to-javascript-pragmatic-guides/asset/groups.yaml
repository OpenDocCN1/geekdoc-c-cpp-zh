    Y.fire('event', arg1, arg2, arg3)\n// Dojo\ndojo.publish('event')\ndojo.publish('event',\
    \ [arg])\n\n## 相关任务\n\n- 任务8，监听事件（及停止），第34页\n\n## 11 模拟后台处理\n\n假设你需要在网页中执行长时间处理的业务；也许你打算为表中的大型数据集提供计算密集型的图形化表示。你希望在处理数字和绘制内容时保持浏览器响应。这就需要后台处理。\n\
    \n这是因为 JavaScript 引擎执行代码的方式：\n\n- JavaScript 本质上是*单线程的*。\n- 无论从哪个角度看，你的 JavaScript\
    \ 运行线程都与页面其余行为共享。直接后果是，当你的 JavaScript 代码运行时，*不会发生任何渲染*。没有新内容，没有重排，没有重绘被另一个窗口部分遮挡的页面……什么都没有。\n\
    \n因此，如果你运行一些密集型处理，页面将冻结，直到处理完成。这通常意味着你的*整个浏览器*都会冻结。这就是为什么现在一些浏览器内置了“中止长时间脚本”机制。而其他浏览器，如\
    \ Chrome，通过让每个页面在自己的进程中运行来缓解这个问题。\n\n除非你使用 Web Workers（目前肯定不是跨浏览器选项），否则你需要借助伪并行技巧，而主要技巧依赖于全局\
    \ window 对象提供的一对方法——setTimeout() 和 clearTimeout()。\n\n思路是将一个大任务分成任意多个小步骤，跟踪进度，知道何时停止，并按固定间隔调度各个块。当一个块完成时，它会安排下一个块在稍后执行；与此同时，浏览器重新获得控制权，从而能够处理页面活动以及任何其他需要运行的脚本。\n\
    \n虽然调用 clearTimeout() 并清理你在 setTimeout() 调用中存储的定时器句柄并非严格必需，但这两个操作都是良好实践，可以减少内存泄漏，而且几乎没有性能开销。\n\
    \n这种技术非常适合处理大型任务，但对于要求平滑推进的行为（如视觉效果）来说却很糟糕，因为定时器精度变化很大（25–500 毫秒）。在这种情况下，你应该使用单个固定间隔的定时器，并依靠时间差进行精确测量。¹¹\n\
    \n> 11. 关于此的真实示例，请查看 Thomas Fuchs 出色的 Émile 的主循环，这是一个 50 行的视觉效果库，地址为 http://github.com/madrobot/emile。\n\
    \n## 第三部分\n\n## UI 技巧\n\n操作 DOM 类似于我们的基本工具。归根结底，其他一切都归结为 DOM 调整。但我们的大多数实际需求都高于此，包括创建有用的用户界面（UI）效果、行为和组件；以有用的方式处理表单；以及更多内容。在这一部分中，我们将从普遍有用的\
    \ UI 行为开始。\n\n- 任务12《*实现优雅的工具提示*》将探讨如何提供漂亮的、上下文相关的信息“气泡”。\n- 有时弹出窗口*是*可以的；在这种情况下，缺乏\
    \ JavaScript 不应阻止访问目标内容。请参阅任务13《*制作不突兀的弹出窗口*》，了解如何两全其美。\n- 预加载图像并不总能通过 CSS 精灵图实现（例如，用户提供的图像）；对于这种情况，任务14《*预加载图像*》展示了如何求助于\
    \ JavaScript。\n- 正确使用灯箱（通过调暗页面其余部分来凸显的伪对话框）能创造整洁的体验；任务15《*创建灯箱效果*》展示了一流的解决方案。\n\
    - 浏览大型数据集有时通过智能滚动更好，如任务16《*实现“无限滚动”*》所示。\n- 有时你需要加载新内容*在*触发加载的页面位置*上方*；为避免破坏视觉行为的稳定性，请查看任务17《*加载内容时保持视口*》。\n\
    \n在本书接下来的部分中，我们将依赖框架和库来简化我们的工作；大多数时候，我会使用 Prototype（不过灯箱任务将使用 jQuery 插件，因为它似乎是完成该特定任务的最佳工具）。\n\
    \n不过，Prototype 不一定能吸引每一位前端开发人员，所以请查看本书代码库的 GitHub 仓库。¹² 我希望人们能创建它的 fork，以适应他们最喜欢的任何\
    \ JavaScript 框架。这样，你可以用自己喜欢的任何框架获得这些任务的代码。如果还没有，何不自己动手写一个呢？\n\n12. http://github.com/tdd/pragmatic-javascript\n\
    \n## 12 实现优雅的工具提示\n\n原生工具提示（通过 title= 获得）充其量是不可靠的。文本换行与拉伸与截断、换行和出现延迟都取决于浏览器或用户。此外，它们的内容是纯文本——没有样式，当然也没有丰富的标记。\n\
    \n为了重新获得控制，我们需要实现自己的工具提示，定位元素，当鼠标进入或离开页面特定区域（或用户按 Tab 键遍历时，为了更好的可访问性）时显示或隐藏。\n\
    \n由于本书是关于 JavaScript 的，我不会深入探讨 CSS 部分。此外，我会将设计方法限制在简单的事情上：不覆盖触发元素，不跟随鼠标光标移动，不在工具提示中提供基于鼠标的\
    \ UI，等等。\n\n因此，就我们的目的而言，实现的关键在于：使用 CSS 默认隐藏工具提示，并在容器元素（不必是链接）上添加 :hover 选择器来恢复其可见性。\n\
    \n![](img/544d515106a3758d5f58491594755dce_43_0.png)\n\n然而，这种实现方式在 IE6 中无效，IE6\
    \ 只对 <a> 元素遵循 :hover。你必须使用脚本手动响应 mouseover 和 mouseout。在这里，由于 Prototype 实现 show()\
    \ 和 hide() 的方式，我们不能通过 CSS 规则预隐藏工具提示——这解释了我在对面页面示例 CSS 中展示的小型 IE6 hack。\n\n对于高级需求，你很可能会在众多工具提示库中找到合适的，无论是直接内置于框架中还是基于框架的。就个人而言，我最喜欢的基于\
    \ Prototype 的库是强大的 Prototip2。¹³\n\n> 13. http://www.nickstakenburg.com/projects/prototip2/\n\
    \n### 标记工具提示。\n\n```\nDownload ui/tooltip/index.html\n<li tabindex=\"1\">\n  <span\
    \ class=\"name\">Capacity: 1.5 TB</span>\n  <div class=\"tooltip\" >\n    <p><strong>1.5\
    \ Terabyte = 1,536 Gigabytes</strong></p>\n    <p>Enough for 50,000 songs, 1,000\
    \ DivX movies, 100,000 high-definition photos, hundreds of iDVD projects and plenty\
    \ of backup space left.</p>\n  </div>\n</li>\n```\n\n### 样式化工具提示。\n\n```\nDownload\
    \ ui/tooltip/tooltip.css\n#files li { position: relative; }\n#files li .tooltip\
    \ {\n  position: absolute; top: 8px; left: 120px; width: 24em;\n  z-index: 1;\
    \ display: none;\n  /* IE6 doesn't know li:hover, so we need to toggle via JS,\
    \ therefore avoiding in-rule display: none */\n  _display: block;\n  border: 1px\
    \ solid gray;\n  background: #fffdc3 url(bg_tooltip.png) top left repeat-x;\n\
    }\n#files li:hover .tooltip,\n#files li:focus .tooltip { display: block; }\n```\n\
    \n### 用于 IE6 的脚本（IE6 不会对非链接元素响应 :hover）。\n\n```\nDownload ui/tooltip/tooltip.js\n\
    function toggle(reveal, e) {\n  var trigger = e.findElement('li'),\n      tooltip\
    \ = trigger && trigger.down('.tooltip');\n  if (!tooltip) return;\n  tooltip[reveal\
    \ ? 'show' : 'hide']();\n}\n\ndocument.observe('dom:loaded', function() {\n  var\
    \ isIE6 = Prototype.Browser.IE && undefined === document.body.style.maxHeight;\n\
    \  if (!isIE6) return;\n  var files = $('files'), tooltips = files && files.select('.tooltip');\n\
