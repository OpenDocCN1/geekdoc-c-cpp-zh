    # C.6 Dojo


    We will complete this tour of the most popular frameworks with Dojo. It was created
    in 2004 through the arduous and joint efforts of Alex Russell, Dylan Schiemann,
    and David Schontzler while at Informatica, and it released in big one-oh on November
    5, 2007, getting split into Dojo (the core), Dijit (the UI widgets), and DojoX
    (the plug-ins and extended features).


    Dojo plays in much the same space as ExtJS now. It’s a major RIA framework with
    huge corporate backing. It is now nurtured by the Dojo Foundation, which includes
    corporate sponsors such as IBM, Google, AOL, Thomson Reuters, TIBCO, Zend, and
    Sitepen, to name only a few. Its current release at the time of this writing is
    1.5.0. Unlike ExtJS though, Dojo is actually open source, being dual-licensed
    under the Academic Free License 2.1 and the new BSD license, and maintaining public
    GitHub, Subversion, and Bazaar repositories and an online bug tracking system.


    Dojo is also close to projects that are now also under the umbrella of the Dojo
    Foundation, the most well-known ones being cometD and DWR, two early—and still
    relevant—systems for doing push notifications from the server to the browser (not
    to forget Sizzle, Persevere, and General Interface).


    Dojo is very active at web development conferences (with T-shirts, subconferences,
    meetups, the works!) and in general maintains a lively community with dedicated
    forums. As far as community strength goes, it’s probably second only to jQuery.
    You’ll find a number of good books, too, including Mastering Dojo [RGR08], Dojo:
    the Definitive Guide [Rus08], Practical Dojo Projects [Zam08], and more recently
    Getting StartED with Dojo [Hay10].


    The online docs are very good, split among a Quick Start Guide, a Reference Guide,
    and the API documentation, plus a cross point of entry using “popular solutions”
    that are task-oriented (for example, “Create charts from datasets”).'
