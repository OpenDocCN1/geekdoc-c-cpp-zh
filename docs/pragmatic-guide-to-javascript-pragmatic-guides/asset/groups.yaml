    # 9 Leveraging Event Delegation


    Learn this by heart, and make it yours: event delegation is the better way.


    You see, most events bubble, such as mouse or keyboard events. When they happen
    somewhere in the DOM, they trigger on every element along the ancestor line, up
    to the document element, from the inside out (that is, unless one of these elements
    has a listener that stops the bubbling).


    Suppose we have a large number of elements that should share a behavior. If the
    triggering event for that behavior bubbles, we’re much better off listening for
    it higher up in the DOM, at the level of the elements’ nearest common ancestor
    or perhaps directly at the document level. This saves some significant memory
    and CPU time.


    Listening higher up in the DOM is also great for behaviors on Ajax-loaded contents.
    Because you listen “outside” the loaded content, freshly added elements leverage
    your behavior automatically, without requiring post-load listener attachment.


    However, sometimes we have to resort to hacks or abandon delegation entirely,
    because our triggering events do not bubble. Unbelievably, submit, change, focus,
    and blur do not bubble—this is infuriating when dealing with shared form/field
    behavior. Although workaround code exists to simulate bubbling for at least part
    of these, their inability to bubble is a hassle.


    I should mention that only since jQuery 1.4 did live() become flexible enough
    for event delegation per se, without performance issues. With that version, it
    also gained the ability to work on many nonbubbling events. On the other hand,
    Dojo’s behavior() seems like it would use event delegation, but it doesn’t. It’s
    just nice syntactic sugar.


    Note the findElement() call in the code sample, on line 2. Currently, our links
    just contain a simple text, so clicking within the link means clicking the link
    itself. But imagine you jazz things up and add an icon (such as a plus/minus icon).
    Then clicks could, technically, happen on the icon but still within the link.
    So with Prototype, when you attach a delegation-based event listener, be sure
    to always use the event’s findElement() method instead of its less witty element()
    counterpart.'
