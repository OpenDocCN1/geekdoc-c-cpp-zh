    # 26 Using Dynamic Multiple File Uploads


    The file upload feature currently built into HTML (as in, pre-HTML5) basically
    blows. It’s single-file, it has no upload progress feedback, it cannot filter
    on size or file type constraints, and so on. And it uses Base64 encoding, which
    means every file sent is blown up by 33 percent. Unless we use stuff like WebSockets
    or SWFUpload, we are stuck with most of these limitations.


