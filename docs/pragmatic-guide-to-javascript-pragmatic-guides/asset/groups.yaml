    - Is there good documentation, preferably official?

    - Does its API design work with my own sense of aesthetics? When I use this framework,
    do I end up with code I like to read and write?

    - Does the framework serve a particular set of goals? Is it targeted at a specific
    developer audience? If so, do my goals, or my profile, fit?


