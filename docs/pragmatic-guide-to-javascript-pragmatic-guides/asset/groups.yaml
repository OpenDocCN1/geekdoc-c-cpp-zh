    ## C.3 MooTools


    MooTools 由 Valerio Proietti 于 2006 年创建，就像一个精挑细选的功能子集——它涵盖了 Prototype 的大部分功能，再加上视觉效果和少数领域专用工具（如
    cookie 管理、用于加载 Flash 的 SWFObject 包装器等）。它的最初目标是提供传统的、基于类的面向对象编程特性，并保持紧凑（诚然，在如今这个
    Google Ajax API、脚本合并和 gzipping 流行的时代，后一点不再那么有吸引力）。


    该项目分为 MooTools Core（框架本身）和 MooTools More（插件库）。


    MooTools 由十三人的核心团队支持，是一个开源、采用 MIT 许可证的项目，目前版本为 1.2.4。它托管在 GitHub 上，bug 跟踪和功能请求通过
    Lighthouse 进行，并通过 Google 群组和专门论坛提供支持。


    关于 MooTools 的重要书籍是《MooTools Essentials》[New08]。


    看起来，至少到目前为止，MooTools 在本附录所述的框架中受欢迎程度/影响力最低。尽管如此，它在开发者心中仍占有不容忽视的份额。


    以下是一些你可能需要的信息：


    - MooTools 的官方网址是 http://mootools.net/。

    - 源代码位于 http://github.com/mootools/mootools-core。

    - bug 跟踪和功能请求可在 https://mootools.lighthouseapp.com/ 找到。

    - 你可以通过 http://groups.google.com/group/mootools-users 的 Google 群组和 http://mooforum.net/
    的论坛获得支持与新闻。此外，http://mootorial.com/ 上也有大量文档和教程，帮助你快速上手。


    ## C.4 YUI


    Yahoo! 用户界面库（通常称为 YUI，据我所知，它的发音是逐个字母拼读）是 Yahoo! 开发者网络（YDN）维护的一组更大规模开发者资源的一部分。该项目始于
    2005 年，并于 2006 年初首次发布。它是一个非常强大、模块化、功能丰富的框架，但最初的学习曲线可能有些陡峭。其核心 JavaScript 功能位于“YUI
    3”中，而其他模块中还有大量额外功能，不一定都与 JavaScript 相关。YUI 被广泛应用于 Yahoo! 的“资产”（Yahoo! 拥有的网站和在线服务），因此它确实有可靠的稳定性和性能记录。


    你应该知道，初始化框架以及访问其模块和功能的约定在版本 2 和 3 之间发生了巨大变化，所以请警惕旧文档和教程。任何以 YAHOO. 开头的调用基本上都是版本
    2。不过请注意，从 YUI 3.1 开始，你可以更简单地集成旧式解决方案和代码。


    虽然对 YUI 核心的贡献并非完全开源（尽管采用 BSD 许可证，但对该部分代码库的实际贡献似乎仅限于 YDN），但 YUI Gallery 允许人们贡献模块。你也可以提交
    bug 报告和功能请求。


    关于 YUI 的高质量文档大多在线，要么在框架的官方网站上，要么在非常社区化的 YUI Library 网站上。你还会发现 YDN 布道师 Christian
    Heilmann 撰写的大量文章，散布在许多流行的 Web 开发在线杂志上。文档中包含数百个带有分步说明的示例。文档的高质量或许解释了为什么目前关于 YUI
    的书籍少之又少。我找到的唯一一本比较重要的书要追溯到 YUI2：《Learning the Yahoo! User Interface Library》[Wel08]。


    YUI 相当受欢迎。然而，与 Dojo 一样，YUI 主要用于富互联网应用（RIA）领域，因为对于 UI 密集度不高的用例来说，它显得有点大材小用（而且过于庞大）。在这方面，它经常与
    YDN 的其他有用资源（如“reset”和“grid”样式表）配合使用。社区互动集中在官方 YUI Library 网站上。


    YUI 拥有几个非常好的“卖点”：


    - 它拥有非常连贯的 API（其风格始终保持一致）。

    - 它经过了极为充分的测试，文档也很完善。

    - 它特别关注可访问性（例如对 ARIA 的支持）。

    - 其模块化、按需加载的方式，再加上庞大的 CDN，使它在轻量级环境中也非常易用。

    - 它由一家大公司（Yahoo!）正式维护和支持，因此在构建项目的技术栈时，选择它是一个风险相当低的选择。


    不过，我确实认为，在轻量级库就够用的情况下，你应该优先选择它。这样可以减少需要吸收和消化的内容。也让你更容易通过修复或扩展自己所需的功能来快速做出贡献。


    你应该了解以下四个 URL：


    - 官方网址是 http://developer.yahoo.com/yui/3/。

    - 源代码仓库位于 http://github.com/yui。

    - 可在 http://yuilibrary.com/projects/yui3/report 提交 bug 报告和反馈。

    - 社区资源总体在 http://yuilibrary.com/。


    ## C.5 ExtJS


    ExtJS 是一个成熟的 RIA 框架，专注于富桌面风格 UI 组件，如树视图、数据网格和对话框。它始于 2006 年（我想），最初是 Jack Slocum
    编写的一个附加组件，你可以将其用于 Prototype、jQuery 或 YUI 之上。此后，它发展成为一个独立的、大型的框架，专门用于构建丰富的桌面风格用户界面；例如，ExtJS
    早期就在数据网格、树和 Ajax 特性上表现出色，因此成为构建网站管理页面的热门工具。


    ExtJS 是同名公司的产品，该公司还提供相关工具，如 Ext Designer 和 Ext GWT bridge。它采用三重许可证：GPLv3、商业许可证和
    OEM 许可证。这种许可证拆分在发布时引起了不小的轰动，尤其是因为它基本上阻止了在非 GPL 兼容的开源项目中使用。另一方面，这意味着你可以从库创造者那里获得商业技术支持、培训和订阅。遗憾的是，代码仓库是封闭的，只能通过自定义下载页面上的发布快照获取。我也找不到一个突出的
    bug 跟踪系统，所以总而言之，尽管有 GPLv3 选项，项目源代码看起来并不那么开放。


    就像所有拥有全职公司员工团队的优秀项目一样，ExtJS 也在快速推进。在撰写本书时，它的版本是 3.1.1，预计 2010 年会有几个主要版本发布，最终达到
    4.0。


    文档相当不错，有一个易于浏览（虽然有时过于简洁）的 API 参考，显然是用 ExtJS 构建的，还有大量完整、有用的应用示例。你还会找到几本书，其中最著名的是
    2009 年底出版的 *ExtJS 3.0 食谱* [Ram09]，以及预计 2010 年夏季出版的 *ExtJS 实战* [Gar10]。


    3. ExtJS 有一个六人的管理团队和一个规模未知的全职开发团队。

