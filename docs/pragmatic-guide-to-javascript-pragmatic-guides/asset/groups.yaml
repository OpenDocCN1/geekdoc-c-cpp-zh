    # 11 Simulating Background Processing


    Say you need to carry out lengthy processing in your web page; perhaps you intend
    to provide a computationally intensive, graphical representation of a large dataset
    from a table. You want to keep the browser responsive while crunching numbers
    and drawing stuff. This calls for background processing.


    This is because of how JavaScript engines execute your code:


    +   - JavaScript is essentially *single-threaded.*

    +   - Your JavaScript-running thread is, for all intents and purposes, shared
    with the rest of your page’s behavior. The immediate consequence is that when
    your JavaScript code runs, *no rendering happens*. No new content, no reflow,
    no redrawing of a page partially obscured by another window…nothing.


    So, if you run some intensive processing, your page will freeze until that processing
    completes. That usually means your *entire browser* will freeze. That’s why several
    browsers nowadays have “abort lengthy script” mechanisms in place. Others, such
    as Chrome, mitigate this issue by running every page in its own process.


    Unless you go with Web Workers (which is certainly not a cross-browser option
    for now), you need to resort to pseudo-parallel tricks, and the main trick relies
    on a pair of methods—setTimeout() and clearTimeout()—provided by the global window
    object.


    The idea is to partition a big job into any number of smaller steps, keeping track
    of our progress, knowing when to stop, and scheduling chunks at regular intervals.
    When a chunk is done, that chunk schedules the next one for a short time later;
    in the meantime, the browser regains control, thereby being able to handle page
    activity and any other scripting that needs to run.


    Although calling clearTimeout() and cleaning up the timer handle you stored from
    your setTimeout() call are not strictly required, both actions are good practice,
    reduce memory leaks, and have virtually no performance cost.


    This technique is great for going through a large processing job, but it’s terrible
    for behaviors demanding a smooth progression—such as visual effects—since timer
    precision varies wildly (25–500 ms). In such situations, you should use a single
    fixed-interval timer and rely on time differences for accurate measurement.¹¹


    > 11. For a real example of this, check out the main loop of Thomas Fuchs’s awesome
    Émile, a 50-line visual effects library at http://github.com/madrobot/emile.'
