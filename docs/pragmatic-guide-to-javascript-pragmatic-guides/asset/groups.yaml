  - '[PAGE 95]


    # 35 Geocoding a Location and Getting Photos For It


    Geolocation has become a very common need, mostly thanks to the rise of the mobile
    Web, so we’re going to illustrate the two main aspects of it:


    +   - First, turning a textual location (address, city, region or state, country)
    into a geolocation (which essentially boils down to a latitude and a longitude)³³

    +   - Second, searching data based on these geocoordinates


    A lot of APIs are available, including prominent “geocoders” from Google, Yahoo!,
    Geonames, and others. For our purposes, I’ll use a very simple, straightforward,
    and useful tool: Yahoo’s Placemaker API and Christian Heilmann’s JavaScript wrapper
    for it, JS-Placemaker. This API lets us analyze any text to extract one or more
    potential geolocations for it, and we’ll use that to turn a location name (say,
    something typed into a form field) into latitude and longitude coordinates.


    Like all Yahoo! Developer Network APIs, Placemaker requires a Yahoo! AppID; the
    sample code on the facing page includes a working one, but you should get your
    own AppIDs to play with.³⁴ Then all you need to do is provide the JavaScript wrapper
    with it and call its getPlaces() method with the text to analyze, a callback to
    process the results, and optionally the text’s locale (for instance, en-US or
    fr-FR) to help Placemaker analyze it correctly.


    Notice a tiny trick in the code to “normalize” the resultset toward a guaranteed
    array of places. Because a one-match case has a single match property and a multiple-match
    case returns an array named matches, we use a (matches || [match]) construct to
    access both situations as an array.


    On the Flickr side of things, we just use the flickr.photos.search method with
    its geo-related parameters lat and lon, through a JSON-P call very much like in
    the previous task. Because we’re doing a global search here, we don’t need to
    specify a user ID this time.


    If you’re interested in georelated tricks and hacks that are on the client side
    and JavaScript-based—including GeoIP and the W3C Geo API—you can find a wealth
    of info, demos, and cool stuff on the page maintained by evangelist extraordinaire
    Christian Heilmann.³⁵


    33. Often you’ll also want to use extra data such as accuracy and the resulting
    bounding box.


    34. Get those at https://developer.apps.yahoo.com/wsregapp/.


    35. http://isithackday.com/hacks/geo/'
