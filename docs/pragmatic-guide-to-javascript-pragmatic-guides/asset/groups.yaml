    \ *九十倍*。而 IE6 面对自己的倍数简直无地自容。因此，IE 团队成功地将 JScript 引擎提升了约 13 倍，不管你喜欢与否，都必须承认这很了不起。\n\
    \n+   - IE8 中的 DOM 性能——我们脚本开发中的第二大痛点——也得到了大力优化，现在平均只慢“四倍”，这也是一大改进。\n\n+   - IE8\
    \ 内置了“开发人员工具”，这是我们在 IE6 和 IE7 中使用的 IE 开发者工具栏的精简、更灵敏版本，并附带了一个真正的 *JavaScript 调试器*。这个调试器确实能用，而且不会在\
