    - The source code is at http://github.com/mootools/mootools-core.

    - Bug tracking and feature requests can be found at https://mootools.lighthouseapp.com/.

    - You can get support and news on the Google Group at http://groups.google.com/group/mootools-users
    and the forum at http://mooforum.net/. There are also a number of docs and tutorials
    to get you up to speed on http://mootorial.com/.


    ## C.4 YUI


    The Yahoo! User Interface library, commonly dubbed YUI (which, as far as I know,
    is pronounced by spelling it), is part of a larger set of developer resources
    maintained by the Yahoo! Developer Network (YDN). The project started in 2005
    and had its first release in early 2006. It is a very strong, modular, powerful
    framework, with perhaps a somewhat steep initial learning curve. Its core JavaScript
    functionality lies in “YUI 3,” and there are numerous extra features, not necessarily
    JavaScript-related, in other modules. YUI is used intensively on Yahoo! “properties”
    (websites and online services Yahoo! owns), so it certainly has a proven track
    record of stability and performance.


    You should know that the convention for initializing the framework and accessing
    its modules and features changed drastically between versions 2 and 3, so be wary
    of old documentation and tutorials. Any calls starting with YAHOO. are basically
    version 2. Note, however, that since YUI 3.1 you can integrate older-style solutions
    and code more simply.


    Although contribution to the core of YUI is not quite open source (despite a BSD
    license, actual contribution to this part of the codebase seems restricted to
    YDN), the YUI Gallery lets people contribute modules. You can also contribute
    bug reports and feature requests.


    Most of the quality documentation about YUI is online, either at the official
    website for the framework or on the YUI Library website, which is very community-oriented.
    You’ll also find a treasure trove of articles by Christian Heilmann, an evangelist
    at YDN, sprinkled across a number of popular web development online magazines.
    The docs contain hundreds of examples with step-by-step instructions. The quality
    of the docs perhaps explains why, at this point, there are precious few books
    about YUI, though. The only book I found of some significance dates back to YUI2:
    Learning the Yahoo! User Interface Library [Wel08].


    YUI is fairly popular. However, YUI is mostly used in the rich Internet application
    (RIA) space, like Dojo, because it is perceived to be rather overkill (and overweight)
    for less-UI-intensive use cases. In that respect, it’s often used in conjunction
    with other useful YDN resources such as the “reset” and “grid” style sheets. The
    community interaction is centralized at the official YUI Library website.


    YUI sports a few very good “selling points”:


    - It has a very cohesive API (its style is consistent throughout).

    - It’s extremely well-tested and well-documented.

    - It pays special attention to accessibility (for example, ARIA support).

    - Its modular, load-on-demand approach, coupled with its massive CDN, keeps it
    very usable even in lightweight environments.

    - It is officially maintained and supported by a large corporation (Yahoo!), which
    makes it a fairly low-risk bet when building your project’s technology stack.


    I do believe that you should favor a lighter-weight library for anything where
    that’s sufficient, though. It makes for less stuff to absorb and digest. It also
    makes it easier for you to contribute quickly by fixing or extending stuff you
    need.


    These are four URLs you should know:


    - The official website is at http://developer.yahoo.com/yui/3/.

    - The source code repository is at http://github.com/yui.

    - Bug reports and feedback are found at http://yuilibrary.com/projects/yui3/report.

    - Community resources in general are at http://yuilibrary.com/.


    ## C.5 ExtJS


    ExtJS is a full-blown RIA framework focusing on rich, desktop-like UI widgets
    such as tree views, datagrids, and dialog boxes. It started out in 2006 (I think)
    as an add-on by Jack Slocum, which you could use over Prototype, jQuery, or YUI.
    Since then, it has evolved into a stand-alone, large framework targeted specifically
    at building rich, desktop-style user interfaces; for instance, having nailed great
    datagrid, tree, and Ajax features early on, ExtJS is a popular tool for building
    website administration pages.


    ExtJS is a product of the eponymous company, which provides related tools such
    as Ext Designer and the Ext GWT bridge. It is available under a triple license:
    GPLv3, commercial, and OEM. This license split caused quite a stir when it launched,
    not least because it essentially prevented use in non-GPL-compatible open source
    projects. On the other hand, it means you can get commercial tech support, training,
    and subscriptions from the library creators. It’s too bad the repository is closed,
    accessible only through release snapshots on a custom download page. I couldn’t
    find a prominent bug-tracking system, either, so all in all, despite a GPLv3 option,
    the project source doesn’t look that open.


    Like all good projects with a full-time, corporate workforce behind them, ExtJS
    is moving apace. At the time of this writing, it’s at version 3.1.1, and 2010
    is expected to see several major releases leading up to 4.0.


    Documentation is rather good, with an easily browsable—if sometimes terse—API
    reference, obviously built with ExtJS, and numerous complete, useful application
    samples. You’ll also find a few books, most notably *ExtJS 3.0 Cookbook* [Ram09],
    released in late 2009, and *ExtJS in Action* [Gar10], due in summer 2010.


    3. ExtJS has a six-person management team and a full-time developer team of unknown
    size.

