    text number\" />\n</p>\n```\n\n### Check special-syntax fields.\n\n```javascript\n\
    var FIELD_PATTERNS = {\n  integer: /^\\d+$/,\n  number: /^\\d+(?:\\.\\d+)?$/,\n\
    \  email: /^[A-Z0-9._%+-]+@[A-Z0-9.-]+\\.[A-Z]{2,6}$/i\n};\n\nfunction checkField(field)\
    \ {\n  var value = $F(field).toString().strip();\n  for (var pattern in FIELD_PATTERNS)\
