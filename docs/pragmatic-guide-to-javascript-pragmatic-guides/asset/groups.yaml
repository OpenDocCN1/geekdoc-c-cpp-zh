  - '[PAGE 49]


    # 15 Creating a Lightbox Effect


    Lightboxing is the act of bringing up some content while shadowing the rest of
    the page behind a mouse-inhibiting overlay. Most of the time, the lightbox UI
    is centered on the page. Lightboxes usually feature images and are launched from
    linked text or a linked thumbnail image on the page.


    ![](img/544d515106a3758d5f58491594755dce_49_0.png)


    In the example for this book, we’re using the FancyBox jQuery plug-in by Janis
    Skarnelis to make thumbnail images lightbox to larger versions. It’s unobtrusive,
    is fairly lightweight, is drop-in easy, and looks gorgeous out of the box. Still,
    check out the bottom of the book’s demo page for alternatives, if you’d like.


    FancyBox is not limited to image contents—it can bring up anything, including
    <iframe> stuff. It defaults to just-in-time Ajax loading when the link’s target
    URI neither “looks like an image file” nor uses iframes. So, fat images can load
    on-demand through an extensionless URL, for example.


    Like most UI-related libraries, FancyBox needs to load at least one script and
    one CSS file. It assumes its images are in the style sheet’s folder, avoiding
    tedious CSS tweaking. FancyBox makes no image URL requirements.


    To make links lightbox, we just grab them and call their fancybox() method, as
    demonstrated on the facing page. It works without any options, but it provides
    a number of possible tweaks. I really like to see my thumbnails zoom in to their
    larger versions, so I set it up that way.'
