    # C.2  jQuery and jQuery UI


    jQuery originated in August 2005 when John Resig, having played with Prototype,
    decided that although he loved the features, the API, and the general feel of
    the code, it didn’t quite suit his own taste. So, he went and tried something
    different. John is a friendly JavaScript guru working at Mozilla, so his undertaking
    the development of a framework was, you could say, in the natural order of things.
    After a version 1.0 release in June 2006, jQuery has enjoyed a rapid uptake in
    the last two years, thanks to massive community-driven work. The jQuery project
    was formally founded in September 2009, and its version 1.4 was released in January
    2010 amid a two-week online celebration and coding fest. (The current version
    at the time of this writing is 1.4.2.)'
