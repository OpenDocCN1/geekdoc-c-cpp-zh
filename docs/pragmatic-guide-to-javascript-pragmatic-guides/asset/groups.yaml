    </html>\n```\n\n下面是我们将要使用的 JavaScript 源码：\n\n```javascript\nfunction fibo (base)\
    \ {\n  if (base <= 2)\n    return 1;\n  return fibo (base - 1) + fibo (base -\
    \ 2);\n}\n```\n\n## B.2 Firefox 与 Firebug\n\n你可以从 http://getfirebug.com 或 Mozilla\
    \ 附加组件目录 http://addons.mozilla.org 获取 Firebug。在撰写本文时，Firebug 正在加紧发布 1.4 版本；几个\
