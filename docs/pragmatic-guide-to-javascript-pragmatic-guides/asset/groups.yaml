    \ 1.2 到 1.3 时代离开了它，绝对值得再给它一次机会。\n\n默认情况下，Firebug 的功能在你浏览的任何地址（包括本地文件）上都是禁用的。这是出于性能考虑，你只需点击状态栏右侧的\
    \ bug 图标即可打开 Firebug 面板，并为当前域名、页面或文件启用你想要的功能。\n\nFirebug 功能非常丰富，但本书最关注的是“控制台”和“脚本”标签页。控制台是一个实时\
    \ JavaScript 命令行和一个日志区域，你的脚本可以使用全局 console 对象及其内置方法（如 log()、debug()、error() 和\
    \ group() 等）向其写入内容。（你可以在 Firebug 的网站上了解完整的控制台 API。）\n\n“脚本”标签页是实际的调试器。它可以让你浏览页面中的所有\
    \ JavaScript 部分（加载的文件、内联事件属性等），设置断点，单步执行代码，监视特定表达式或变量（在“监视”子标签页中），并查看当前堆栈跟踪（在“堆栈”子标签页中）。这正是我们审查运行中的\
    \ JavaScript 代码所需的一切。\n\n我们的调试台的脚本调试器基本视图如图 B.1 所示。\n\n![](img/544d515106a3758d5f58491594755dce_103_0.png)\n\
    \n图 B.1：Firebug 在调试台上的脚本基本视图\n\n基本上有两种让代码运行起来的方法：要么进入控制台输入触发我们要检查的代码的 JavaScript，要么在页面中触发相同代码的事件。[^1]\
    \ 在我们的调试台页面中，当按下按钮时，fibo() 函数会以参数 20 被调用。你可以通过点击按钮来验证这一点——你应该会看到一个带有结果（6,765）的对话框。在调试器中，你可以做很多事情来深入研究这个函数的执行细节：\n\
    \n-   选择一个脚本文件（或带有内联脚本的 HTML 页面）：点击源文件窗格上方的文件名旁边的箭头，选择你的文件。\n-   在特定代码行上切换断点：只需点击源文件窗格左侧装订线中该行的位置。\n\
    -   要求断点在满足给定条件时才触发：右键单击装订线中的断点圆点，输入条件的 JavaScript 表达式。\n-   暂时禁用断点，而不会丢失其位置和条件：转到“断点”子标签页，取消选中断点的复选框。\n\
    -   一旦命中断点，单步执行代码：源文件窗格上方的图标允许你“步入”（也就是说，如果当前行调用了一个函数，则进入该函数内部）、“步过”（直接运行此类函数调用而不进入其内部）和“步出”（运行当前函数，并在返回调用函数后恢复手动单步执行）。\n\
    -   任何时候，都可以关注局部变量以及你之前设置的任何感兴趣表达式的值：只需查看“监视”子标签页。\n\n[^1]: 严格来说，许多调试器允许你在抛出异常（即发生错误）时进入单步模式。在\
    \ Firebug 中，点击“脚本”标签页标签旁边的箭头即可使用此类功能。\n\n这里我们将手动完成其中一些步骤，作为你可以在其他浏览器上复制的示例操作，以掌握要领。首先，假设我们希望在\
    \ fibo() 函数被一个足够小的参数（比如小于 5）调用时进入单步模式。要做到这一点，我们首先需要在函数的第一行设置断点，然后为这个断点配置合适的条件。\n\
    \n1.  点击源文件窗格左侧装订线中与函数第一行（第 2 行）对应的位置。\n2.  右键单击出现表示断点的红点，在工具提示中输入你需要的条件：base\
    \ < 5。你应该会看到类似下一页图 B.2 的内容。确认。\n\n![](img/544d515106a3758d5f58491594755dce_105_0.png)\n\
    \n图 B.2：在 Firebug 中设置条件断点\n\n一切就绪！现在点击网页中的 Fibo(20) 按钮；函数将开始递归下降，你应该会命中断点。点击右侧窗格中的“堆栈”子标签页，查看你所在的位置；你应该会看到类似下一页图\
    \ B.3 的内容，它让你看到当前递归状态：已经深入了 15 层（如果向下滚动，你会看到初始的 onclick= 处理程序调用）。\n\n通过点击“监视”子标签页，你可以看到所有局部变量，包括当前绑定（当前引用的对象）和参数。在图\
    \ B.4（第 107 页）中，你可以看到我们正在作为全局函数运行（this 当前引用全局 window 对象），base 参数为 4。请注意，你也可以使用“监视”子标签页来*更改*这些值：只需双击列表中的值行并输入新值即可。\n\
    \n![](img/544d515106a3758d5f58491594755dce_105_1.png)\n\n图 B.3：Firebug 中的堆栈跟踪视图\n\
    \n![](img/544d515106a3758d5f58491594755dce_106_0.png)\n\n图 B.4：Firebug 中的监视视图\n\
    \n现在让我们探索各种单步方式。此刻你应该停留在 fibo() 函数的第一个内部行（第 2 行）。点击一次“步入”图标（紧挨着用于恢复执行的蓝色播放图标右侧的那个）。由于条件为假，下一行会被跳过，你到达\
    \ **return** 行。再次点击同一个图标。由于这是一个函数调用，而且你正在*步入*，你将下潜一层，递归进入同一个函数，这次 base 为 3（查看“监视”子标签页以确认这一点）。\n\
    \n假设你现在不想再深入下去，只想运行代码直到回到刚才离开的那一层（base 等于 4）。要做到这一点，请按照以下步骤操作：\n\n1.  你首先需要移除或至少禁用之前设置的断点。否则，每当代码以小于\
    \ 5 的参数调用 fibo() 时，它都会打断你的节奏。切换到“断点”子标签页，取消选中你的断点以禁用它。\n2.  然后点击“步出”图标（源文件窗格上方的最后一个），让代码继续运行，直到再次到达上一个堆栈层级。你应该会发现自己回到了之前离开的\
    \ **return** 行，且 **base** 再次等于 4。\n3.  重复该操作会让你一次又一次地沿堆栈向上运行（这意味着 **base** 监视值会越来越高），所以过不了多久，你会注意到右侧“堆栈”子标签页中的堆栈跟踪正在变薄。\n\
    4.  当你厌倦了手动单步，想要恢复正常执行时，点击播放按钮（蓝色的右箭头）。\n\n请注意，所有这些单步/运行图标都有快捷键，但根据你运行 Firebug\
    \ 的平台而大不相同。这些快捷键通常会在图标的工具提示中提及，所以只需将鼠标悬停在它们上面即可找出这些快捷键。\n\n近年来，Safari 一直在打磨其 Web\
    \ 检查器，4.0 版本配备了一套相当不错的功能。（我听说当前的“每晚构建版”也取得了很好的进展。）虽然它在 DOM 修改方面目前有点不尽如人意（相对于 Firebug），但其控制台和\
    \ JavaScript 调试器绝对是同等级别的。\n\nWeb 检查器的“脚本”部分（控制台窗格打开时）如图 B.5 所示（下一页）（你可以使用底部行的一个图标在控制台和“脚本”视图之间切换）。\n\
    \n"
