    # Grab an element by its ID.


    ```

    document.getElementById(''elementId'')  // Plain W3C DOM

    $(''elementId'')                     // Prototype, MooTools

    $(''#elementId'')                    // jQuery

    Y.one(''#elementId'')                // YUI 3

    dojo.byId(''elementId'')             // Dojo

    Ext.getDom(''elementId'')            // Ext JS 3

    ```


    # Grab elements by XPath/CSS selection.


    Supported syntaxes vary depending on the library, and the W3C Selectors API is
    available (but blazingly fast) only in recent-enough browsers: Firefox 3.1+, Safari
    3.1+, IE8+ (standards mode), Chrome, and Opera 10+.


    Also, note that all libraries provide some way to specify the context, the root
    node within which to explore (by default the entire document). Narrowing the context
    down whenever possible speeds up your code and reduces memory usage.


    ```

    document.querySelectorAll(''selectors'')  // Native (see above)

    $$(''selectors'')                        // Prototype, MooTools

    someRootElement.select(''selectors'')    // Prototype

    $(''selectors'')                         // jQuery

    Y.all(''selectors'')                     // YUI 3

    dojo.query(''selectors'')                // Dojo

    Ext.query(''selectors'')                 // Ext JS 3

    ```


    # Move around (DOM traversals).


    Here are a couple of quick Prototype-based examples. For context and extra information,
    check out the facing page.


    ```

    // From element with id=some..., get the nearest <h2> container with class

    // "category", then walk along its later sibling elements until one has a

    // "summary" class.

    $(''someDeeplyNestedElement'').up(''h2.category'').next(''.summary'');


    // Set the text-indent CSS property for every immediate container of

    // links with a "sifr" class.

    $$(''a.sifr'').invoke(''up'').invoke(''setStyle'', ''text-indent: -9999px'');

    ```'
  - '[PAGE 27]


    # 5 Dynamically Styling Content


    The ability to get the current value (specified or computed) of a CSS property
    for an element—and even more importantly to *change* that styling—is of paramount
    importance when creating a web UI. Unfortunately, browsers and W3C specs leave
    us pretty much in the dark here. All libraries provide more or less the same API,
    as you can see on the facing page.


    The answer, for dynamic styling, is to use *classes*.


    Being able to tweak styles manually is useful for developing your own visual effects,
    but that’s an exercise best left to library authors and JavaScript ninjas. I believe
    that you, as a front-end developer, should cleanly separate the specific styling
    from your JavaScript code and rely only on toggling CSS class names for your own
    stuff and built-in effects provided by your library of choice.


    Indeed, all libraries provide a uniform API to add, remove, and check the presence
    of CSS class names from an element. MooTools, jQuery, YUI, Dojo, and Ext all use
    `addClass()`, `hasClass()`, `removeClass()`, and `toggleClass()`. Prototype just
    appends a Name suffix to those (that is, `hasClassName()`).


    *But don’t forget the shortcuts!*


    All libraries provide various shortcuts for common use cases, both on the get
    and the set sides, such as visibility (hide/show/toggle), opacity (as per CSS’s
    spec, even on IE), dimensions, and so on. Check the docs—the method names are
    often obvious.'
