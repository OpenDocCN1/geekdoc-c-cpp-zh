    # 24 Providing On-the-Fly Help Tooltips on Forms


    Sometimes we put complex forms online. Fields have advanced semantics or nontrivial
    input rules. For instance, we may enforce complexity requirements on password
    fields, in which case it’s best practice (and just plain polite) to warn our users
    up front. But when multiple fields require detailed warnings and instructions,
    our forms can get cluttered.


    ![](img/544d515106a3758d5f58491594755dce_69_0.png)


    A useful approach is to put such details in per-field tooltips and make them visible
    only when needed—when the field has focus. In short, it’s a form-related variation
    on what we did in Task 12, Pulling Off Classy Tooltips, on page 44.


    Note that the best place for it would be inside the labels, not just in the same
    paragraph. This way, such information is available to, say, blind users regardless
    of their screen reader’s current mode.


    Styling—especially in terms of positioning the tooltips—is very important to this
    task, so I show a bit of CSS on the facing page. But that’s admittedly a trivial
    example. It can be enhanced, both code-wise and performance-wise, if you use a
    library that simulates bubbling for the focus and blur events, so you don’t have
    to explicitly register event listeners for every relevant field. At the time of
    this writing, the latest jQuery does this out of the box, and you’ll find more
    or less official plug-ins for your most popular JavaScript frameworks to fit the
    same bill.'
