    \  var that = this;\n  (function() { that.submit(); }).delay(0.1);\n}\n```\n\n\
    ```\n<form id=\"commentForm\" action=\"post_comment.php\">\n<label for=\"edtText\"\
    >Your text</label>\n<textarea id=\"edtText\" name=\"text\" cols=\"40\" rows=\"\
    5\"></textarea>\n<p><input type=\"submit\" class=\"submit\" value=\"Send\" /></p>\n\
    </form>\n```"
  - '[PAGE 59]


    # 19 Providing Input Length Feedback


    A common source of frustration when filling in forms is to suddenly see the text
    input stop dead, even when there was some text warning us of the maximum length.
    Not only that, but did you know that <textarea> has no maxlength= attribute? Seriously.
    It’s not valid HTML and will be blissfully ignored (unless you’re fortunate enough
    to be able to use HTML5).


    So, to provide a unified way to specify maximum lengths, we can rely on dedicated
    CSS classes for, er, “data storage.” They will use a two-part name: first a maxLength
    prefix, then a positive integer, stating the maximum length we want. See the markup
    on the facing page.


    Then we can use JavaScript to do the following:


    +   1. Dynamically decorate the form zones (I’ll assume paragraphs, for the sake
    of brevity) containing these elements (the facing code adds a class to the paragraph),
    and then dynamically create the placeholder for remaining-length feedback.

    +   2. Initialize the feedback zone to the current state.

    +   3. Bind appropriate event listeners for as-you-type feedback.

    +   4. Position the feedback zone (I put it under the bottom-right corner of its
    matching field here) and add it to the document, now that it’s ready for prime
    time!


    Now whenever typing occurs, we just need to update the feedback, and if we hit
    or exceed the maximum length (something impossible on a <textarea>), we’ll backpedal
    to the maximum allowed length.


    Note a couple of tricks in this code:


    +   - We listen for both keyup and keypress in order to react to noncharacter
    keys (deletions, cuts, and pastes, mostly) and character keys. Listening to keydown
    would be useless because it occurs before the text changes, and we have no reliable
    way of determining across browsers and keyboard layouts whether the text will
    change.

    +   - To avoid recomputing the maximum length at every keystroke, we cache it
    during setup. To associate maximum lengths with our fields, we use a JavaScript-based
    associative array between the fields’ id= attributes²² and the fields themselves.
    This is lighter weight than using expand o properties.


    22. We use Prototype’s identify() here to make sure our element has an id=.'
  - "[PAGE 60]\n\n# Specify maximum lengths through markup.\n\n```\nDownload form/feedback/index.html\n\
    \n<p>\n    <label for=\"edtDescription\">Description</label>\n    <textarea id=\"\
    edtDescription\" name=\"description\" cols=\"40\"\n    rows=\"5\" class=\"maxLength200\"\
    ></textarea>\n</p>\n```\n\n# Set up feedback for maximum-length fields.\n\n```\n\
    Download form/feedback/feedback.js\n\nvar maxLengths = {};\n\nfunction bindMaxLengthFeedbacks()\
    \ {\n    var mlClass, maxLength, feedback;\n    $('.maxLength').each(function(field)\
    \ {\n        field.up('p').addClass('lengthFeedback');\n        mlClass = field.className.match(/\\\
    bmaxLength(\\d+)\\b/)[0];\n        maxLength = parseInt(mlClass.replace(/\\D+/g,\
    \ ''), 10);\n\n        feedback = new Element('span', { 'class': 'feedback' });\n\
    \        maxLengths[field.identify()] = [maxLength, feedback];\n        updateFeedback(field);\n\
    \        field.observe('keyup', updateFeedback).\n            observe('keypress',\
    \ updateFeedback);\n\n        feedback.clonePosition(field, { setHeight: false,\n\
    \            offsetTop: field.offsetHeight + 2 });\n        field.insert({ after:\
    \ feedback });\n    });\n}\n```\n\n# Give feedback on the fly.\n\n```\nDownload\
    \ form/feedback/feedback.js\n\nfunction updateFeedback(e) {\n    var field = e.tagName\
    \ ? e : e.element();\n    var current = field.getValue().length,\n        data\
    \ = maxLengths[field.id], max = data[0],\n        delta = current < max ? max\
    \ - current : 0;\n    data[1].update('Remaining: ' + delta);\n    if (current\
    \ > max) {\n        field.setValue(field.getValue().substring(0, max));\n    }\n\
    }\n```"
  - '[PAGE 61]


    # 20 (Un)checking a Whole Set of Checkboxes at Once


    It happens time and time again: you have a list, and there are operations your
    users would like to do en masse. The tasks of deleting, moving, archiving, and
    changing a given property for a number of them all boil down to letting your users
    check specific items.


    And sometimes, all of them. That can be a pain in the butt when the list is long,
    and that is why mass toggling is a nice UI feature.


    ![](img/544d515106a3758d5f58491594755dce_61_0.png)


    The markup is simple. Let’s just put a checkbox in the table’s head section to
    act as a toggler. This scopes it automatically, letting our script navigate to
    the matching <tbody> as a container for checkboxes of interest.


    The script itself is fairly concise: react to clicks on the toggler by looking
    up checkboxes in the matching <tbody> and updating their checked= attribute to
    reflect our togglers.


    Now, as an exercise, you could try to adapt this code to achieve two goals:


    +   - Allow multiple tables in the page, with a toggler each. This mostly means
    you’ll replace an id= with a class and use event delegation to avoid registering
    too many listeners.

    +   - Cater to the more complex tables by allowing more than one <tbody> in a
    table. Yes, that is valid markup (one body per semantic section of the table,
    when you group data in some way). Interestingly, if you add more than one <tbody>,
    you’ll end up simplifying the script!'
