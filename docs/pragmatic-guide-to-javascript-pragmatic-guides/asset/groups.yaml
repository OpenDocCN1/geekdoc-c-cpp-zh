    \ Tasks\n\n- Task 8, Listening for Events (and Stopping), on page 34\n\n## 11\
    \ Simulating Background Processing\n\nSay you need to carry out lengthy processing\
    \ in your web page; perhaps you intend to provide a computationally intensive,\
    \ graphical representation of a large dataset from a table. You want to keep the\
    \ browser responsive while crunching numbers and drawing stuff. This calls for\
    \ background processing.\n\nThis is because of how JavaScript engines execute\
    \ your code:\n\n- JavaScript is essentially *single-threaded.*\n- Your JavaScript-running\
    \ thread is, for all intents and purposes, shared with the rest of your page’s\
    \ behavior. The immediate consequence is that when your JavaScript code runs,\
    \ *no rendering happens*. No new content, no reflow, no redrawing of a page partially\
    \ obscured by another window…nothing.\n\nSo, if you run some intensive processing,\
    \ your page will freeze until that processing completes. That usually means your\
    \ *entire browser* will freeze. That’s why several browsers nowadays have “abort\
    \ lengthy script” mechanisms in place. Others, such as Chrome, mitigate this issue\
    \ by running every page in its own process.\n\nUnless you go with Web Workers\
    \ (which is certainly not a cross-browser option for now), you need to resort\
    \ to pseudo-parallel tricks, and the main trick relies on a pair of methods—setTimeout()\
    \ and clearTimeout()—provided by the global window object.\n\nThe idea is to partition\
    \ a big job into any number of smaller steps, keeping track of our progress, knowing\
    \ when to stop, and scheduling chunks at regular intervals. When a chunk is done,\
    \ that chunk schedules the next one for a short time later; in the meantime, the\
    \ browser regains control, thereby being able to handle page activity and any\
    \ other scripting that needs to run.\n\nAlthough calling clearTimeout() and cleaning\
    \ up the timer handle you stored from your setTimeout() call are not strictly\
    \ required, both actions are good practice, reduce memory leaks, and have virtually\
    \ no performance cost.\n\nThis technique is great for going through a large processing\
    \ job, but it’s terrible for behaviors demanding a smooth progression—such as\
    \ visual effects—since timer precision varies wildly (25–500 ms). In such situations,\
    \ you should use a single fixed-interval timer and rely on time differences for\
    \ accurate measurement.¹¹\n\n> 11. For a real example of this, check out the main\
    \ loop of Thomas Fuchs’s awesome Émile, a 50-line visual effects library at http://github.com/madrobot/emile.\n\
    \n## Part III\n\n## UI Tricks\n\nManipulating the DOM is akin to our basic tools.\
    \ Ultimately, everything else boils down to DOM tweaking. But most of our actual\
    \ needs are higher level than that, including creating useful user interface (UI)\
    \ effects, behaviors, and widgets; handling forms in a useful manner; and much\
