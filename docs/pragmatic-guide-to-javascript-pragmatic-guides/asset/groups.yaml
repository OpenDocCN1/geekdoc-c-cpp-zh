    \ Events (and Stopping)*, on page 34\n\n## 10 使用自定义事件解耦行为\n\n当你的代码库变得足够大，或者当你想在完全不同的上下文中重用其中的一部分时，你可能会遇到这样的情况：“我希望这段代码可以以任何方式触发，而不是对我的\
