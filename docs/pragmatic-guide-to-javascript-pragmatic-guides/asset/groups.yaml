    \ *are* OK; and when they are, lack of JavaScript should not prevent access to\
    \ the target contents. See how to get the best of both worlds in Task 13, *Making\
    \ Unobtrusive Pop-Ups*.\n- Preloading images cannot always be done with CSS spriting\
    \ (for instance, with user-provided images); for such situations, Task 14, *Preloading\
    \ Images*, shows you how to resort to JavaScript.\n- Proper use of lightboxes\
    \ (pseudo-dialogs standing out by dimming the remainder of the page) creates a\
    \ neat experience; Task 15, *Creating a Lightbox Effect*, shows a top-notch solution.\n\
    - Browsing large datasets is sometimes better done through smart scrolling, as\
    \ illustrated in Task 16, *Implementing an \"Infinite Scroll\"*.\n- There are\
    \ times when you need to load new content *above* the position in the page that\
    \ triggers such loading; to avoid destabilizing visual behavior, check out Task\
    \ 17, *Maintaining Viewport When Loading Content*.\n\nFrom then on in this book,\
    \ we will rely on frameworks and libraries to ease our work; almost all of the\
    \ time, I will go with Prototype (the lightbox task will use a jQuery plug-in,\
    \ though, because it seemed like the best tool for that particular job).\n\nStill,\
    \ Prototype does not necessarily appeal to every front-end developer out there,\
