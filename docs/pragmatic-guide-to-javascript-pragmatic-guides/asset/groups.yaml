    // Ext JS\nExt.onReady(fx)\n```\n\n### 相关任务\n\n- Task 8, *Listening for Events\
    \ (and Stopping)*, on the next page\n\n### 监听一个元素上的事件。\n\n```\n// Prototype\n\
