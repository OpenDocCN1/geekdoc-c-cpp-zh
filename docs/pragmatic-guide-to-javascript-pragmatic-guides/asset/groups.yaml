  - '[PAGE 114]


    SSD drives, making their overall experience snappy. On the heels of that phenomenon,
    virtual machines are getting a place of honor in any serious web developer’s toolkit.
    VM software is cheap, even sometimes free, and options are quite numerous: Parallels
    Desktop⁷ (on OS X, Windows, and Linux), VMware Fusion⁸ (on OS X) or VMware Workstation⁹
    (on Windows), Sun’s VirtualBox¹⁰ (on just about any major OS), and many more still.


    This commoditization of virtual machines lets us set up separate VMs to replicate
    all the browser situations we need to test for: IE6 to IE9, various versions of
    Safari, Chrome, Firefox, Opera, and so on. Most browsers will not let you run
    multiple versions of them on a single OS, or if they do, you will not get 100
    percent identical behavior with that of said browser being the only version installed
    (case in point: the third-party MultipleIE package on Windows XP). VMs let you
    isolate successive versions in distinct OS images. Best of all, they let you run
    all this on a single computer. Typically, the host OS of choice is OS X; this
    is because of many factors, but the most relevant one to me is this: it’s easy
    to set up a Linux or Windows in a VM, but it’s very hard to run OS X inside a
    VM hosted on a non-Mac platform.


    So by all means, go VM! This is so much more convenient than having to use multiple
    boxes or remote desktops where you keep colliding with other web developers using
    them at the same time.


    # B.8 The Network May Be Your Enemy


    Sometimes you run into bugs that feel like heisenbugs:¹¹ they happen only when
    you don’t look. As soon as you start stepping through your code or try to reproduce
    this on your development box, the elusive behavior is nowhere to be found. What
    gives?


    This typically happens with Ajax stuff and high-latency or flaky connections (such
    as dial-ups or your corporate proxy barely keeping its head above water). To reproduce
    this kind of situation, you can use software known as slow proxies. My favorite
    tool in this area, and perhaps the most well-known, is Charles,¹² a Java-based
    tool (hence running on all major platforms). Not only does it let you throttle
    your perceived bandwidth, adjust your latency, and generally tweak your perceived
    network behavior, but it can also record and replay network sessions, and it provides
    detailed HTTP/HTTPS monitoring. Such tools are a godsend!'
