    \ JavaScript 的客户端中的主要方式。其主要传输方式依赖于动态生成的 `<script>` 标签，这有一个有趣的副作用：传输不受同源策略的限制。越来越多的网络服务和\
    \ API（尤其是 RESTful 的）提供 JSON 输出格式和 JSON-P 支持。\n\n其背后的简单想法是这样的：你会得到一段 JavaScript\
    \ 源代码，它将常规的 JSON 字面量传递给你提供的回调函数。这意味着回调函数事先由你自己的代码定义并使其全局可用（这并不理想，但我们无法绕过这一点）。\n\
    \n现在，取决于你的心态以及你对打算与 JSON-P 一起使用的远程资源信任程度，这可能是一种解脱（这是一种模拟跨域 Ajax 的好方法）或一种担忧（JSON-P\
    \ 本质上在你的页面中运行由第三方生成的 JavaScript）。\n\n如果你针对的是自己的服务器和资源，你就没问题，一切都很美好。但如果你针对的是你不完全信任的第三方资源，就可能出现问题。由于所涉及的机制（一个\
    \ `<script>` 标签），你无法预先解析返回的 JavaScript 以确保它是一个安全的 JSON-P 回调调用。要获得该中间步骤，你必须使用真正的\
    \ Ajax 获取脚本，但对于第三方资源，这在所有浏览器上都无法工作，正如我们在下一个任务中将看到的那样。\n\n无论如何，衡量你的远程 JSON-P 提供商的可信度和可靠性是你的责任。\n\
    \n我应该指出，我们使用的传输方式——动态 `<script>` 标签——将 JSON-P 限制为 GET 请求，从而限制有效负载约为 4KB（传统的 GET\
    \ 限制）。虽然后者没有灵丹妙药，但借助服务器端的帮助，我们可以轻松地将 GET 请求转换为其他任何请求，正如我们在第 88 页的任务 32《跨域“Ajax”（第二版）》中将看到的那样。\n\
    \n### 使用最基本的代码实现 JSON-P。\n\n在最简单的形式中，它就是这样：\n\n```\ndocument.documentElement.firstChild.appendChild(\n\
    \  new Element('script', { type: 'text/javascript',\n    src: this.href + '&r='\
    \ + Math.random() }));\n```\n\n之前的代码在链接点击处理程序的上下文中执行，因此 **this** 是正在激活的 `<a>`\
    \ 元素。\n\n随机参数用于规避浏览器缓存；在生产代码中，你应该检查 URI 以决定是否用 & 或 ? 作为前缀。\n\n更高级的方法是为此类脚本使用动态\
    \ `id` 属性，并在加载后将其移除以避免 DOM 泛滥。动态 `id` 可以充当随机参数：\n\n```\nvar script = new Element('script',\
    \ { type: 'text/javascript',\n  src: this.href });\nscript.src += '&r=' + script.identify();\n\
    script.observe('load', Element.remove.curry(script));\ndocument.documentElement.firstChild.appendChild(script);\n\
    ```\n\n### 使用框架的 JSON-P 设施。\n\n一些框架提供了特定于 JSON-P 的函数，总是派上用场：\n\n```\n// jQuery\n\
    $.getJSON(url[, data][, callback])\n// MooTools\nnew Request.JSONP({ url: ...,\
    \ onComplete: function(data) {...} })\n// Dojo\ndojo.io.script.get({ url: ...,\
    \ jsonp: function(data) {...} })\n```\n\n### 相关任务\n\n- 第 82 页的任务 29，*使用 JSON*\n\
    - 第 88 页的任务 32，*跨域“Ajax”（第二版）*\n\n## 31 跨域“Ajax”（第一版）\n\n向第三方服务发送数据或从第三方服务检索数据是一个日益常见的需求。在这个\
    \ Mashup 时代，我们经常需要我们的网页与服务和内容提供商通信，最好不要给我们自己的服务器带来负担。\n\n有许多方法可以在幕后跨域加载内容。我将向你展示更重要的方法并坚持可靠的东西；这对于你的实际用例来说应该足够了。\n\
    \n让我快速描述一下现状：\n\n- 所谓的服务器端代理每次都有效，适用于每个 URL。如果这对你可行，你应该这样做。如果你处理文件上传、内容类型、POST\
    \ 请求等，可能需要一些调整（不过始终要清理和检查传入请求；你不想无意中成为垃圾邮件网关）。\n- 未来在于 *跨源资源共享*（CORS），即 W3C 用于跨域请求的规范，XHR2\
    \ 使用它。目前，这仅适用于 Firefox 3.5+、Safari 4+ 和 Chrome。IE8 实现了基础功能（仅 GET、无自定义头、无凭据等），但要求你使用自定义对象\
    \ XDomainRequest。\n- 如果这两种方法都不可用，那么你的选择就是 JSON-P 或动态/隐藏表单和 `<iframe>`。\n- 没有万能的解决方案可以在不使用服务器端代理的情况下向另一个域\
    \ POST 复杂内容。有半解决方案（见下一个任务），但没有一刀切的解决方案。\n\n在对面的页面上，本书对此任务的代码说明了一个不错的 CORS 方法（无需额外代码；只需使用\
    \ XMLHttpRequest），一个服务器端代理方法，以及两种基于表单的动态方法，其中一种使用了 `<iframe>`（其中一种返回 204 响应代码，这让我们可以跳过隐藏的\
    \ `<iframe>` 目标，因为浏览器不会尝试导航）。\n\n我应该强调，你只有在不想依赖外部服务时才需要费心使用表单和 `<iframe>`；否则，YQL（在下一个任务中回顾）绝对是你的最佳选择。\n\
    \n"
