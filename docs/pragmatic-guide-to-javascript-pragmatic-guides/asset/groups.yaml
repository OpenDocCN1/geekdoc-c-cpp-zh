    Manipulating the DOM is akin to our basic tools. Ultimately, everything else boils
    down to DOM tweaking. But most of our actual needs are higher level than that,
    including creating useful user interface (UI) effects, behaviors, and widgets;
    handling forms in a useful manner; and much more still. In this part, we will
    start with generally useful UI behaviors.


    +   - Task 12, *Pulling Off Classy Tooltips*, will explore how to provide nice-looking,
    contextual information "bubbles" in our pages.

    +   - Sometimes pop-up windows *are* OK; and when they are, lack of JavaScript
    should not prevent access to the target contents. See how to get the best of both
    worlds in Task 13, *Making Unobtrusive Pop-Ups*.

    +   - Preloading images cannot always be done with CSS spriting (for instance,
    with user-provided images); for such situations, Task 14, *Preloading Images*,
    shows you how to resort to JavaScript.

    +   - Proper use of lightboxes (pseudo-dialogs standing out by dimming the remainder
    of the page) creates a neat experience; Task 15, *Creating a Lightbox Effect*,
    shows a top-notch solution.

    +   - Browsing large datasets is sometimes better done through smart scrolling,
    as illustrated in Task 16, *Implementing an "Infinite Scroll"*.

    +   - There are times when you need to load new content *above* the position in
    the page that triggers such loading; to avoid destabilizing visual behavior, check
    out Task 17, *Maintaining Viewport When Loading Content*.


    From then on in this book, we will rely on frameworks and libraries to ease our
    work; almost all of the time, I will go with Prototype (the lightbox task will
    use a jQuery plug-in, though, because it seemed like the best tool for that particular
    job).


    Still, Prototype does not necessarily appeal to every front-end developer out
    there, so check out the GitHub repository for this book’s codebase.¹² I intend
    for people to create forks of it adapted for whatever JavaScript framework they
    like best. This way, you can get the code for these tasks in whatever framework
    you prefer. And if it’s not there yet, why not go ahead and author it yourself?


