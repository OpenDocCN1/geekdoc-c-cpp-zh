    # 13 Making Unobtrusive Pop-Ups


    Whether you’re using “actual” pop-ups (distinct windows) or pseudo pop-ups (elements
    on the current page, styled to look window-like), the problem remains: how do
    you provide access to this content for users who can’t—or don’t want to—open a
    window? Think disabled window opening, screen readers, search engines, and so
    on.


    There’s only one way: have the link actually link to the pop-up’s contents, and
    apply progressive enhancement from there.


    If your content is intended as an HTML fragment displayed in a pseudo pop-up (perhaps
    loaded through Ajax, too), you’ll need to make sure you can serve it distinctly,
    with or without a containing document markup. That way, users accessing it through
    a regular link, as a stand-alone document, get something nice.


    The gist of the practice here is this: link to the target content natively (href=
    and, perhaps, target="_blank"), and then use JavaScript to hook into these links
    and jazz ’em up. Baking your own window-opening code is fairly easy—it’s all about
    the built-in window.open() method.


    If you’re adding a pseudo pop-up or lightbox, do use a good existing library and
    spare yourself the living hell of cross-browser issues and positioning algorithms.
    Here are a few pointers:


    +   - Scripty2’s UI¹⁴

    +   - jQuery UI¹⁵

    +   - Dijit (based on Dojo)¹⁶

    +   - YUI’s Overlay module¹⁷

    +   - Ext.Window¹⁸


    Also keep in mind that small pop-up content may qualify for a click-triggered
    rich tooltip instead of a full-on pop-up zone. In such a situation, check out
    tooltip libraries and modules.


    14. http://github.com/madroobby/scripty2

    15. http://jqueryui.com/

    16. http://dojotoolkit.org/projects/dijit

    17. http://developer.yahoo.com/yui/3/overlay/

    18. http://www.extjs.com/deploy/dev/docs/?class=Ext.Window'
