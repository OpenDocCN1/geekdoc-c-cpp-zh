    \n第一个任务专注于最基本的验证类型：必填字段，即验证特定字段是否有非空文本或是否被勾选等等。我们将使用一种约定：用 `required` CSS 类标记这些字段，并依靠样式来对缺失字段提供视觉反馈。\n\
