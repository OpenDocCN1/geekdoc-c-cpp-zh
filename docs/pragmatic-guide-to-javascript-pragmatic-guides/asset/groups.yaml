    its current version is 1.8.3, and development is basically frozen, because focus
    shifted to Scriptaculous2.

    - Scriptaculous2 can be found at [http://scriptly2.com/](http://scriptly2.com/).
    It is currently in Alpha release 6.

    - PDoc is at [http://pdoc.org/](http://pdoc.org/).

    - Sprockets is at [http://getsprockets.org/](http://getsprockets.org/).

    - Scripteka is at [http://scripteka.com/](http://scripteka.com/).

    - The support mailing list is found at [http://groups.google.com/group/prototype-scriptaculous](http://groups.google.com/group/prototype-scriptaculous).
    You can also try the #prototype IRC channel on Freenode.

    - The feedback mailing list is found at [http://groups.google.com/group/prototype-core](http://groups.google.com/group/prototype-core).
    Do not ask for help there—use the support list!

    - The official repository is on GitHub: [http://github.com/sstephenson/prototype](http://github.com/sstephenson/prototype).

    - If you have bugs to report, first read the guide at [http://prototypejs.org/contribute](http://prototypejs.org/contribute),
    prepare your report with care, and then head over to [https://prototype.lighthouseapp.com/](https://prototype.lighthouseapp.com/).


    ## C.2 jQuery and jQuery UI


    jQuery originated in August 2005 when John Resig, having played with Prototype,
    decided that although he loved the features, the API, and the general feel of
    the code, it didn’t quite suit his own taste. So, he went and tried something
    different. John is a friendly JavaScript guru working at Mozilla, so his undertaking
    the development of a framework was, you could say, in the natural order of things.
    After a version 1.0 release in June 2006, jQuery has enjoyed a rapid uptake in
    the last two years, thanks to massive community-driven work. The jQuery project
    was formally founded in September 2009, and its version 1.4 was released in January
    2010 amid a two-week online celebration and coding fest. (The current version
    at the time of this writing is 1.4.2.)

