  - "[PAGE 17]\n\n# 1 Dynamically Selecting a Method/Property\n\nOften you find yourself\
    \ wanting to call one of two methods (functions associated with an object) depending\
    \ on the situation. Or instead of functions to call, this could be about reading,\
    \ or writing, to one of two possible properties (variables associated with an\
    \ object). The code for this would look something like what follows:\n\n```\n\
    if (condition) {\n    myObj.method1(someArg);\n} else {\n    myObj.method2(someArg);\n\
    }\n```\n\nJavaScript offers a simple syntax for dynamically selecting methods\
    \ and properties, all relying on the square brackets ([]) operator. You see, JavaScript\
    \ has two interchangeable syntaxes for member access (that is a common dynamic\
    \ language trait):\n\n```\nobj[expressionResultingInMemberName] == obj.memberName\n\
    ```\n\nIf you’ve ever plucked a value from an Array cell using its integer index,\
    \ you’ve already used the square brackets operator for dynamic member selection!\
    \ This is because Array objects have properties named after their numerical indices\
    \ (plus the length property). However, in this case, JavaScript won’t let you\
    \ use the dot operator (.) for direct access. myArray.0 is invalid syntax (too\
    \ bad, that would have made a good nerd trick).\n\nHere’s why using the square\
    \ brackets operator ([]) is more powerful than dot notation: you can put anything\
    \ in between the brackets to obtain the name of the member (property or method)\
    \ that you want to access. Common cases include literals, variables holding the\
    \ member name, name composition expressions (mostly string concatenations), and\
    \ quick if/then choices in the form of a ternary operator (condition ? valueIfTrue\
    \ : valueIfFalse). It’ll all be turned into a string first and then used to look\
    \ up the member you want to use.\n\nIn JavaScript, functions are objects too and\
    \ can be referenced like any other value. When an expression results in a function,\
    \ you can call it by using parentheses, possibly with arguments, just like you\
    \ would on a function you’re calling straight by its name.\n\nNote that if the\
    \ arguments you want to pass to the method vary depending on which technique you\
    \ select, using parentheses may quickly become too cluttered for easy reading.\
    \ In that case, going for a regular if/else structure is a wiser move."
