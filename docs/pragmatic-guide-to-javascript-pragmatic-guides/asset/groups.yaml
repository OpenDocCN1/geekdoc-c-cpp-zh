    最后，鉴于该项目具有一定的专有性，其生态系统主要局限于官方网站、论坛和一个基于 wiki 的优秀学习中心，提供演示、截屏视频、教程等。


    以下是一些必备链接：


    - 这是 ExtJS 官方网站：http://extjs.com/。

    - 下载地址：http://www.extjs.com/products/extjs/download.php。

    - 论坛地址：http://www.extjs.com/forum/。

    - 学习中心主页：http://www.extjs.com/learn/Main_Page。


    ## C.6 Dojo


    接下来我们以 Dojo 来完成最流行框架的巡礼。Dojo 于 2004 年由 Alex Russell、Dylan Schiemann 和 David Schontzler
    在 Informatica 公司共同努力创建，并于 2007 年 11 月 5 日发布了 1.0 版本，同时被拆分为 Dojo（核心）、Dijit（UI 控件）和
    DojoX（插件与扩展功能）。


    Dojo 如今与 ExtJS 的定位差不多。它是一个拥有强大企业支持的主流 RIA 框架，目前由 Dojo 基金会维护，其企业赞助商包括 IBM、Google、AOL、Thomson
    Reuters、TIBCO、Zend 和 Sitepen 等。在撰写本书时，其最新版本是 1.5.0。与 ExtJS 不同的是，Dojo 是真正的开源软件，采用
    Academic Free License 2.1 和 new BSD license 双重许可，并维护公开的 GitHub、Subversion 和 Bazaar
    仓库，以及在线 bug 跟踪系统。


    Dojo 还与现在同属 Dojo 基金会旗下的项目关系密切，其中最著名的是 cometD 和 DWR，这两个早期但仍然相关的系统用于实现从服务器到浏览器的推送通知（更不用说
    Sizzle、Persevere 和 General Interface 了）。


    Dojo 在 Web 开发大会上非常活跃（有 T 恤、分会、聚会等等），并且总体上维持着一个拥有专门论坛的活跃社区。就社区实力而言，它可能仅次于 jQuery。你也可以找到不少好书，包括《Mastering
    Dojo》[RGR08]、《Dojo: the Definitive Guide》[Rus08]、《Practical Dojo Projects》[Zam08]，以及较新的《Getting
    StartED with Dojo》[Hay10]。


    在线文档非常出色，分为快速入门指南、参考指南、API 文档，以及一个以“常用解决方案”为入口的交叉入口，这些方案面向任务（例如“从数据集创建图表”）。


    在我看来，如果你需要基于 Web 标准创建 RIA 类型、类似桌面应用程序的应用，Dojo 应该是你的首选。


    我们将以下面这个 Dojo 重要 URL 列表来结束本附录：


    - 官方网站：http://www.dojotoolkit.org/。

    - 你可以通过 http://svn.dojotoolkit.org/src/ 访问仓库（可惜他们不用 Git）。

    - 你可以在 http://bugs.dojotoolkit.org/ 进行 bug 跟踪和报告。

    - 你可以在 http://www.dojotoolkit.org/community/ 参与社区。


    ## 获取帮助


    当然，我希望这本书对你有用。不过，你仍然需要自己解决问题，或者可能需要别人确认你没有偏离方向。那么，你可以在哪里获得更多帮助，并与其他围绕这些内容的人交流呢？


    ## D.1 JavaScript 通用帮助


    拥有强大的框架绝不是不掌握 JavaScript 的借口。有时你确实需要深入研究并编写一些实际代码，或者由于各种原因（比如移动设备上的性能问题¹）你无法使用常用的框架。


    ### 新闻组


    还记得 DSL 还没有（几乎）普及的时代吗？在 Google Groups 之前？实际上在 Google 之前？嗯，也许那时你还没在开发，但我们有 Usenet。它至今仍然存在，而且最近新一代人已经发现了它在比如共享二进制文件方面有多好用。更重要的是，它有面向人类已知的每一种编程语言的新闻组。


    每个 ISP 都提供新闻组访问；那就是你在订阅单上看到的奇怪的“NNTP 服务器”东西。而大多数聚合器、feed 阅读器甚至电子邮件客户端——Thunderbird、Entourage、Outlook，是的，甚至
    Outlook Express——都能让你连接到 NNTP 服务器并订阅你选择的新闻组。（根据你的 ISP，你可以从数千个中选择。）


    甚至，即使你不想以那种方式访问这些组，Google Groups 也维护着通往大多数有用新闻组的桥梁，包括以下这些：


    - 所有活动的核心在 comp.lang.javascript。（这个地址是 COMPuter LANGuage JavaScript 的缩写。）它已经存在很久了，并且仍然是所有在线讨论的主要场所，这些讨论与…


    1. 除非你正在使用 Thomas Fuchs 刚刚发布的出色 zepto.js 库：http://github.com/madrobot/zepto。或者用
    vapor.js 创下最快纪录：http://github.com/madrobot/vapor.js。


    - jQuery 名人 John Resig 最近在 Sitepoint 写了一本看起来很棒的小书：*Secrets of the JavaScript Ninja*
    [Res09]。

    - 同样在 Sitepoint，虽然略显过时，还有一本由多位作者合著的优秀书籍：*The Art and Science of JavaScript* [AEH+07]。

    - 特使级的布道者 Chris Heilmann 撰写了《Beginning JavaScript with DOM Scripting and Ajax:
    From Novice to Professional》[Hei06]，这也是一本很棒的书。

    - 如果不提 Thomas Fuchs 和 Amy Hoy 的最新宝石，那将是我的失职，它真正是面向性能、性能、性能的 Companion 工具：*JavaScript
    Performance Rocks!* [HF09]。


