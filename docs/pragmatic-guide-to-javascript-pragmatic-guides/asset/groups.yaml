  md: "\n## 13 Making Unobtrusive Pop-Ups\n\nWhether you’re using “actual” pop-ups\
    \ (distinct windows) or pseudo pop-ups (elements on the current page, styled to\
    \ look window-like), the problem remains: how do you provide access to this content\
    \ for users who can’t—or don’t want to—open a window? Think disabled window opening,\
    \ screen readers, search engines, and so on.\n\nThere’s only one way: have the\
    \ link actually link to the pop-up’s contents, and apply progressive enhancement\
    \ from there.\n\nIf your content is intended as an HTML fragment displayed in\
    \ a pseudo pop-up (perhaps loaded through Ajax, too), you’ll need to make sure\
    \ you can serve it distinctly, with or without a containing document markup. That\
    \ way, users accessing it through a regular link, as a stand-alone document, get\
    \ something nice.\n\nThe gist of the practice here is this: link to the target\
    \ content natively (href= and, perhaps, target=\"_blank\"), and then use JavaScript\
    \ to hook into these links and jazz ’em up. Baking your own window-opening code\
    \ is fairly easy—it’s all about the built-in window.open() method.\n\nIf you’re\
    \ adding a pseudo pop-up or lightbox, do use a good existing library and spare\
    \ yourself the living hell of cross-browser issues and positioning algorithms.\
    \ Here are a few pointers:\n\n- Scripty2’s UI¹⁴\n- jQuery UI¹⁵\n- Dijit (based\
    \ on Dojo)¹⁶\n- YUI’s Overlay module¹⁷\n- Ext.Window¹⁸\n\nAlso keep in mind that\
    \ small pop-up content may qualify for a click-triggered rich tooltip instead\
    \ of a full-on pop-up zone. In such a situation, check out tooltip libraries and\
    \ modules.\n\n14. http://github.com/madroobby/scripty2\n15. http://jqueryui.com/\n\
    16. http://dojotoolkit.org/projects/dijit\n17. http://developer.yahoo.com/yui/3/overlay/\n\
    18. http://www.extjs.com/deploy/dev/docs/?class=Ext.Window\n\n### Tag for progressive\
    \ enhancement.\n\nDownload ui/popups/index.html\n\n```\n<p>\n  The great thing\
    \ about <a class=\"popup\" target=\"_blank\" href=\"http://pragprog.com/titles/pg_js\"\
    >Pocket Guide to JavaScript</a>\n  is that it focuses on a bunch of specific,\
    \ useful tasks.</p>\n```\n\n### Script a plain window.open().\n\nDownload ui/popups/popups.js\n\
    \n```\nvar POPUP_FEATURES = 'status=yes,resizable=yes,scrollbars=yes,' +\n'width=800,height=500,left=100,top=100';\n\
    \nfunction hookPopupLink(e) {\n  var trigger = e.findElement('a.popup');\n  if\
    \ (!trigger) return;\n  e.stop(); trigger.blur();\n  var wndName = trigger.readAttribute('target')\
    \ ||\n    ('wnd' + trigger.identify());\n  window.open(trigger.href, wndName,\
    \ POPUP_FEATURES).focus();\n}\n\ndocument.observe('click', hookPopupLink);\n```\n\
    \n### Related Tasks\n\n- Task 12, Pulling Off Classy Tooltips, on page 44\n- Task\
    \ 15, Creating a Lightbox Effect, on page 50\n\n## 14 Preloading Images\n\nWhen\
    \ your page offers user interaction that changes what images are displayed (perhaps\
    \ providing a zoom, a close-up, a front/back view, or whatever), you do not want\
    \ the user to see a momentary blank screen because the image you suddenly need\
    \ takes an instant to load. You may want to preload such images.\n\nIn essence,\
    \ there are only three ways to preload images:\n\n- *With JavaScript, using dynamically\
    \ created Image objects with appropriate src properties*: Doing so lets you detect\
    \ when preloaded images are indeed loaded.\n- *With CSS, hiding preloaded images*:\
    \ This boils down to using hidden <img> tags for the images to preload. You hide\
    \ either the <img> tags themselves or a common container (which I prefer).\n-\
    \ *With CSS sprites*: When you want to preload stuff like rollovers or a bunch\
    \ of related images (backgrounds, borders, and corners, for instance), this should\
    \ definitely be your preferred approach.¹⁹\n\nThe CSS approach is fairly straightforward,\
    \ but it does not provide you with as much potential control as the JavaScript\
    \ approach. The markup and script on the facing page make the assumption that\
    \ image tags with a rel=\"preloadZoom\" attribute have a close-up version with\
    \ the same URI—with a _closeup name suffix—preloaded for rollover close-ups.\n\
    \nThis is typically the kind of situation where the JavaScript option is preferable\
    \ to the CSS ones. Since the rollover depends on JavaScript, we should preload\
    \ in JavaScript too. (If no JavaScript is available, we won’t preload stuff that\
    \ can’t be shown later.) Moreover, preloading in JavaScript avoids markup/styling\
