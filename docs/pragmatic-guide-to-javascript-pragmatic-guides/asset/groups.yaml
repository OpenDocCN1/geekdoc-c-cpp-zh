  mdcn: "\n\n### 1 动态选择方法/属性\n\n经常你会想要根据情况调用两个方法之一（与对象关联的函数）。或者不是调用函数，而是读取或写入对象关联的两个可能属性之一（与对象关联的变量）。这种代码看起来会像下面这样：\n\
    \n```\nif (condition) {\n    myObj.method1(someArg);\n} else {\n    myObj.method2(someArg);\n\
    }\n```\n\nJavaScript 提供了用于动态选择方法和属性的简单语法，全部依赖于方括号（[]）运算符。你看，JavaScript 有两种可互换的成员访问语法（这是一个常见的动态语言特性）：\n\
    \n```\nobj[expressionResultingInMemberName] == obj.memberName\n```\n\n如果你曾经使用整数索引从数组单元中取出一个值，那么你已经使用过方括号运算符进行动态成员选择了！这是因为数组对象具有以其数字索引命名的属性（加上\
    \ length 属性）。然而，在这种情况下，JavaScript 不允许你使用点运算符（.）进行直接访问。myArray.0 是无效语法（太糟糕了，那本可以成为一个不错的极客技巧）。\n\
    \n这里使用方括号运算符（[]）比点符号更强大的原因在于：你可以在括号之间放入任何内容来获得想要访问的成员（属性或方法）的名称。常见情况包括字面量、保存成员名称的变量、名称组合表达式（主要是字符串拼接），以及以三元运算符形式出现的快速\
    \ if/then 选择（condition ? valueIfTrue : valueIfFalse）。它都会先被转换为字符串，然后用于查找你想要使用的成员。\n\
    \n在 JavaScript 中，函数也是对象，可以像任何其他值一样被引用。当表达式得到一个函数时，你可以使用括号（可能带参数）调用它，就像你直接按名称调用函数一样。\n\
    \n请注意，如果你想要传递给方法参数取决于你选择的技术，使用括号可能会很快变得过于杂乱而难以阅读。在这种情况下，采用常规的 if/else 结构是更明智的选择。\n\
    \n#### 使用方括号（[]）运算符。\n\n```\nobject['propertyName']  // => object.propertyName\n\
    object['methodName'](arg1)  // => object.methodName(arg1)\n```\n\n#### 切换行为。\n\
    \n```\n// 根据 shouldBeVisible 调用 show() 或 hide()\n// 避免在 IE 上使用“重量级”动画以利于立即重排\n\
    // （假设我们已经有一个设置正确的 isIE 变量）\nelement[shouldBeVisible ? 'show' : 'hide']();\n```\n\
    \n#### 组合方法名。\n\n```\nelement[(enable ? 'add' : 'remove') + 'ClassName']('enabled');\n\
    ```\n\n#### 在任意窗口中尝试此示例代码。\n\n```\nvar love = { firstName: 'Élodie', lastName:\
    \ 'Porteneuve' };\nvar useFirstName = true;\nalert(love[useFirstName ? 'firstName'\
    \ : 'lastName']); // => \"Élodie\"\n```\n\n### 2 使用模块模式实现代码私有性\n\n你的代码库中 JavaScript\
    \ 越多，全局作用域就越可能被“污染”，其中包含大量函数和变量，这些本应更好地保持为使用它的代码集的私有。由此带来的风险是名称冲突，一个脚本无意中覆盖了另一个脚本的标识符。这会导致错误。\n\
    \n我们需要能够创建自包含、不透明的 JavaScript 代码批，这些代码只会向外部世界暴露选定的标识符（如果有的话）。事实上，这对于“大规模编程”来说是一个主要要求，能够在任何页面中引入框架和库而不会冒冲突的风险。这就是模块模式的作用。\n\
    \n模块模式的整个想法是为使用 var 声明的标识符和函数创建一个私有作用域，只有在其中定义的函数才能访问该作用域。为了使这些定义中的一些对外部世界可访问，我们的外层函数有两个选择。它可以返回一个包含这些选定值作为属性的对象（参见对面页）；我们只需要将返回的对象赋给外部作用域中的一个变量。另一种方法是向外层函数传递一个作用域对象，由它向其写入属性（要使其变为全局，只需传递\
    \ window）。\n\n在 JavaScript 中，首次使用 var 声明关键字使用的标识符是局部的。（它们属于当前定义的函数。）首次未使用 var\
    \ 使用的标识符是全局的。（它们被 graft 到当前默认作用域上，这大多数时候意味着全局 window 对象。）\n\n在某些特定情况下，当前默认作用域实际上不是全局的，因此有方法可以在非\
    \ var 标识符不会泄漏到全局命名空间的上下文中执行代码——但这有点超出本任务的范围。\n\n技术上，你不必将“公共属性”命名为与私有标识符完全相同。事实上，你可以在返回的对象字面量中使用匿名函数即时定义公共方法。但这种做法会导致代码更晦涩（或误导）地阅读——也许更重要的是——调试。作为经验法则，只要可能，尽量使用命名函数表达式定义你的函数：\n\
    \n```\nfunction myFunctionName(...) { ... }\n```\n\n#### 在匿名函数内部使用 vars。\n\n```\n\
    (function() {\n  var privateField = 42;\n\n  function innerFunc() {\n    notSoPrivate\
    \ = 43;\n    return notSoPrivate;\n  }\n\n  alert(privateField); // => 42\n  innerFunc();\n\
    \  alert(notSoPrivate); // => 43 (ouch!)\n})();\nalert(typeof privateField); //\
    \ => undefined\nalert(notSoPrivate); // => 43 (ouch!)\n```\n\n#### 尝试此示例：“私有属性。”\n\
    \n```\nvar obj = (function() {\n  var privateField = 42;\n  var publicField =\
    \ 'foobar';\n\n  function processInternals() { alert('Internal stuff: ' + privateField);\
    \ }\n\n  function run() {\n    processInternals();\n    alert('Still private stuff:\
    \ ' + privateField);\n    alert('Public stuff: ' + publicField);\n  }\n\n  return\
    \ {\n    publicField: publicField,\n    run: run\n  };\n})();\n\nobj.run() //\
    \ three alerts: Internal, still private, public\nobj.publicField // foobar\nobj.processInternals()\
    \ // Undefined\nobj.privateField // Undefined\n```\n\n#### 声明参数（命名参数）。\n\n```javascript\n\
    function repeat(rant, times) {\n    while (--times >= 0)\n        alert(rant);\n\
    }\nrepeat('IE6 must die!', 5); // => 5 alert boxes in a row\n```\n\n#### 获取参数（无论多少）。\n\
    \n```javascript\nfunction repeat(times) {\n    while (--times >= 0) {\n      \
    \  for (var index = 1, len = arguments.length; index < len; ++index) {\n     \
    \       alert(arguments[index]);\n        }\n    }\n}\nrepeat(2, 'IE6 must die!',\
    \ 'So should IE7...'); // => 4 alert boxes\n```\n\n#### 使用默认值接收可选参数。\n\n```javascript\n\
    function repeat(times, rant) {\n    if (undefined === rant) {\n        rant =\
    \ 'IE6 must die!';\n    }\n    while (--times >= 0) {\n        alert(rant);\n\
    \    }\n}\nrepeat(3); // => 3 IE6 alert boxes\nrepeat(3, 'So should IE7...');\
    \ // => 3 IE7 alert boxes\n```\n\n#### 使用字面量对象作为伪命名参数。\n\n```javascript\nfunction\
    \ repeat(options) {\n    options = options || {};\n    for (var opt in (repeat.defaultOptions\
    \ || {})) {\n        if (!(opt in options)) {\n            options[opt] = repeat.defaultOptions[opt];\n\
    \        }\n    }\n    for (var index = 0; index < options.times; ++index) {\n\
    \        alert(options.rant);\n    }\n}\nrepeat.defaultOptions = { times: 2, rant:\
    \ 'IE6 must die!' };\n\nrepeat(); // 2 IE6 alert boxes\nrepeat({ times: 3 });\
    \ // 3 IE6 alert boxes\nrepeat({ times: 2, rant: 'Flash must die!' }); // 2 Flash\
    \ alert boxes\n```\n\n## Part II\n\n### The DOM, Events, and Timers\n\n"
