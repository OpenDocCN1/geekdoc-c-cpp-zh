    files in a nice way. When I say “nice” here, I basically mean “without as many
    visible file controls as there are files.” I like how 37signals presents lists
    of files-to-be-uploaded in their products: a flat, icon-decorated list of filenames
    with the option to remove them from the upload “queue.”


    ![](img/544d515106a3758d5f58491594755dce_73_0.png)


