  - '[PAGE 1]


    # What Readers Are Saying About Pragmatic Guide to JavaScript


    I wish I had owned this book when I first started out doing JavaScript! Pragmatic
    Guide to JavaScript will take you a big step ahead in programming real-world JavaScript
    by showing you what is going on behind the scenes in popular JavaScript libraries
    and giving you no-nonsense advice and background information on how to do the
    right thing. With the condensed years of experience of one of the best JavaScript
    developers around, it’s a must-read with great reference to everyday JavaScript
    tasks.


    Thomas Fuchs

    Creator of the script.aculo.us framework


    An impressive collection of very practical tips and tricks for getting the most
    out of JavaScript in today’s browsers, with topics ranging from fundamentals such
    as form validation and JSON handling to application examples such as mashups and
    geolocation. I highly recommend this book for anyone wanting to be more productive
    with JavaScript in their web applications.


    Dylan Schiemann

    CEO at SitePen, cofounder of the Dojo Toolkit


    There are a number of JavaScript books on the market today, but most of them tend
    to focus on the new or inexperienced JavaScript programmer. Porteneuve does no
    such thing, and this Pragmatic Guide is a better book for it. If you’re a novice,
    go elsewhere first, and then when you have some scripting under your belt, come
    back; if you’ve worked with JavaScript before, then Pragmatic Guide to JavaScript
    takes a set of techniques that you may have heard about or seen and makes them
    useful to you. Recommended.


    Stuart Langridge

    kryogenix.org, @sil'
