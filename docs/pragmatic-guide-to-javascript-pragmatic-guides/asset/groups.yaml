    \ 所示。瞧！\n\n# B.5 IE8 与开发者工具\n\n毫无疑问：Internet Explorer 8 是 IE 世界向前迈出的一大步。除了在 Web\
    \ 标准支持方面的显著改进（尽管它仍远落后于现代浏览器，但至少不再停留在白垩纪了），下面这几点对我们 JavaScript 开发者有直接利害关系：\n\n\
