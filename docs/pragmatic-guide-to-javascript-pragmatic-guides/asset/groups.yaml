    \ people to create forks of it adapted for whatever JavaScript framework they\
    \ like best. This way, you can get the code for these tasks in whatever framework\
    \ you prefer. And if it’s not there yet, why not go ahead and author it yourself?\n\
    \n12. http://github.com/tdd/pragmatic-javascript\n\n## 12 Pulling Off Classy Tooltips\n\
    \nNative tooltips (obtained through title=) are unreliable at best. Text wrapping\
    \ vs. stretching vs. truncation, line breaks, and appearance delays are all browser-\
    \ or user-dependent. Plus, their content is plain text—no styling and certainly\
    \ no rich markup.\n\nTo reclaim control, we need to implement our own tooltips,\
    \ positioning elements that get shown or hidden when the mouse enters or exits\
    \ specific areas of the page (or when the user tabs through, for better accessibility).\n\
    \nSince this book is about JavaScript, I won’t delve into the CSS parts. Also,\
    \ I’ll limit the design approach to simple stuff: not overlaying the trigger element,\
    \ not moving alongside the mouse cursor, not providing in-tooltip mouse-based\
    \ UI, and so on.\n\nSo, for our purposes, the crux of the implementation is this:\
    \ use CSS to hide the tooltip by default, and add a :hover selector on the container\
    \ element (which doesn’t have to be a link) to restore its visibility.\n\n![](img/544d515106a3758d5f58491594755dce_43_0.png)\n\
    \nHowever, that implementation won’t work with IE6, which only obeys :hover on\
    \ <a> elements. You must use a script to react to mouseover and mouseout manually.\
    \ Here, because of the way Prototype implements show() and hide(), we can’t prehide\
    \ tooltips through CSS rules—this explains the small IE6 hack I show in the sample\
    \ CSS on the facing page.\n\nFor advanced needs, odds are you’ll find your fit\
    \ among the host of tooltip libraries out there, either directly in frameworks\
    \ or based on them. Personally, my favorite Prototype-based library is the kick-ass\
    \ Prototip2.¹³\n\n> 13. http://www.nickstakenburg.com/projects/prototip2/\n\n\
    ### Tag the tooltip.\n\n```\nDownload ui/tooltip/index.html\n<li tabindex=\"1\"\
    >\n  <span class=\"name\">Capacity: 1.5 TB</span>\n  <div class=\"tooltip\" >\n\
    \    <p><strong>1.5 Terabyte = 1,536 Gigabytes</strong></p>\n    <p>Enough for\
    \ 50,000 songs, 1,000 DivX movies, 100,000 high-definition photos, hundreds of\
    \ iDVD projects and plenty of backup space left.</p>\n  </div>\n</li>\n```\n\n\
    ### Style the tooltip.\n\n```\nDownload ui/tooltip/tooltip.css\n#files li { position:\
