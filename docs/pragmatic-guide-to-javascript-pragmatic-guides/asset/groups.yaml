  mdcn: "\n\n# 务实程序员\n\n# JavaScript 实用指南\n\nChristophe Porteneuve\n\n编辑：David McClintock\n\
    \n![](img/544d515106a3758d5f58491594755dce_0_0.png)\n\n# 读者对《JavaScript 实用指南》的评价\n\
    \n我希望自己在刚开始学习 JavaScript 时就拥有这本书！《JavaScript 实用指南》通过展示流行 JavaScript 库背后的运作机制，提供直截了当的建议和背景信息，让你在编写真实世界的\
    \ JavaScript 程序时领先一大步。这本书凝聚了一位顶级 JavaScript 开发者多年的经验，是日常 JavaScript 任务的必读参考。\n\
    \nThomas Fuchs\nscript.aculo.us 框架的创建者\n\n这是一本令人印象深刻的实用技巧合集，能够帮助你在当今的浏览器中充分发挥\
    \ JavaScript 的作用，内容涵盖从表单验证、JSON 处理等基础主题，到 mashup 和地理位置等应用示例。我强烈推荐任何希望在 Web 应用中更高效地使用\
    \ JavaScript 的人阅读此书。\n\nDylan Schiemann\nSitePen 首席执行官，Dojo Toolkit 联合创始人\n\n\
    如今市面上有很多 JavaScript 书籍，但大多数都面向新手或经验不足的程序员。Porteneuve 没有这样做，而这本《实用指南》反而因此更好。如果你是新手，请先去别处学习，等掌握了一些脚本知识后再回来；如果你以前接触过\
    \ JavaScript，那么《JavaScript 实用指南》会把你可能听说过或见到过的一系列技巧变得对你真正有用。强烈推荐。\n\nStuart Langridge\n\
    kryogenix.org，@sil\n\n# JavaScript 实用指南\n\nChristophe Porteneuve\n\n# Pragmatic\
