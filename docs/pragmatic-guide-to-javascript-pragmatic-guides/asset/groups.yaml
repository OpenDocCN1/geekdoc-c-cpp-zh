    \ CSS approach runs a (admittedly low) risk of toggling to an image that is not\
    \ loaded yet.\n\nFor more hardcore techniques on fast image loading, take a look\
    \ at Steve Souder’s May 2009 presentation: 14 rules for faster-loading images.²⁰\n\
    \n19. Check out the seminal http://www.alistapart.com/articles/sprites and the\
    \ more recent http://css-tricks.com/css-sprites/. Steve Souders also maintains\
    \ the SpriteMe tool: http://spriteme.org/.\n20. http://stevesouders.com/docs/wordcamp-20090530.ppt\n\
