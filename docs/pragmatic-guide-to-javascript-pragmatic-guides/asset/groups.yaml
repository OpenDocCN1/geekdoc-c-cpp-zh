  md: "\n## 24 Providing On-the-Fly Help Tooltips on Forms\n\nSometimes we put complex\
    \ forms online. Fields have advanced semantics or nontrivial input rules. For\
    \ instance, we may enforce complexity requirements on password fields, in which\
    \ case it’s best practice (and just plain polite) to warn our users up front.\
    \ But when multiple fields require detailed warnings and instructions, our forms\
    \ can get cluttered.\n\n![](img/544d515106a3758d5f58491594755dce_69_0.png)\n\n\
    A useful approach is to put such details in per-field tooltips and make them visible\
    \ only when needed—when the field has focus. In short, it’s a form-related variation\
    \ on what we did in Task 12, Pulling Off Classy Tooltips, on page 44.\n\nNote\
    \ that the best place for it would be inside the labels, not just in the same\
    \ paragraph. This way, such information is available to, say, blind users regardless\
    \ of their screen reader’s current mode.\n\nStyling—especially in terms of positioning\
    \ the tooltips—is very important to this task, so I show a bit of CSS on the facing\
    \ page. But that’s admittedly a trivial example. It can be enhanced, both code-wise\
    \ and performance-wise, if you use a library that simulates bubbling for the focus\
    \ and blur events, so you don’t have to explicitly register event listeners for\
    \ every relevant field. At the time of this writing, the latest jQuery does this\
    \ out of the box, and you’ll find more or less official plug-ins for your most\
    \ popular JavaScript frameworks to fit the same bill.\n\n### Put tooltips where\
    \ they’re useful.\n\nDownload form/tooltips/index.html\n\n```html\n<p>\n  <label\
    \ for=\"user_login\">\n    Login*\n    <span class=\"tooltip\" style=\"display:\
    \ none;\">\n      Logins must be unique, at least 3 characters long,\n      and\
    \ may only use letters, numbers, white space,\n      hyphens, underscores and\
    \ periods.\n    </span>\n  </label>\n  <input type=\"text\" id=\"user_login\"\
    \ name=\"user[login]\" class=\"required text\" />\n</p>\n```\n\n### Style for\
    \ uniform, clean appearance.\n\nDownload form/tooltips/tooltips.css\n\n```css\n\
    #registration label { float: left; width: 6em; position: relative; zoom: 1; }\n\
    #registration input.text { width: 14em; }\n#registration .tooltip {\n  display:\
    \ block; position: absolute; left: 24em; top: 0;\n  padding: 0.35em 0.5em 0.35em\
    \ 2em; width: 15em;\n  border: 1px solid silver;\n  color: gray; font-size: 80%;\n\
    \  background: #ffc url(lightbulb.png) 0.5em 0.3em no-repeat;\n}\n```\n\n### Show\
    \ on focus, hide on blur.\n\nDownload form/tooltips/tooltips.js\n\n```javascript\n\
    document.observe('dom:loaded', function() {\n  var attr = Prototype.Browser.IE\
    \ ? 'htmlFor' : 'for';\n  function showTooltip() {\n    var tooltip = $$('label['+attr+'=\"\
    '+this.id+'\"] .tooltip').first();\n    tooltip && tooltip.show();\n  }\n  function\
    \ hideTooltip() {\n    var tooltip = $$('label['+attr+'=\"'+this.id+'\"] .tooltip').first();\n\
    \    tooltip && tooltip.hide();\n  }\n\n  $('registration').getInputs().invoke('observe',\
    \ 'focus', showTooltip).\n    invoke('observe', 'blur', hideTooltip);\n});\n```\n\
    \n## 25 Autocompleting Input As It’s Typed\n\nWhat’s even better than validating\
    \ input before it’s sent to the server? Validating input as the user types! By\
    \ matching users’ ongoing input against a database of valid/useful inputs, we\
    \ can make suggestions that not only help them correct, say, spelling errors,\
    \ but also save them from manually typing long stuff that is common enough to\
    \ show up in our suggestions list.\n\n![](img/544d515106a3758d5f58491594755dce_71_0.png)\n\
    \nThis is traditionally referred to as autocompletion. The only question is whether\
    \ your reference datasource is prefetched on the client side (as a simple Array\
    \ or perhaps a more richly structured object, such as a JSON literal) or is stored\
    \ on the server, repeatedly queried as typing progresses.\n\nHere’s a good rule\
    \ of thumb: if your datasource is small enough (such as a reference list of states,\
    \ currencies, or model names within a single brand), prefetch it inside the script\
    \ (for instance, generate the JavaScript literal for it when rendering the page).\
    \ Otherwise, go Ajax, and be sure to tune the query frequency so you get good\
    \ user experience even with slow connections or quick typists.\n\nScript.aculo.us\
    \ 1.8 has a good autocompletion control with a ton of customization options, which\
    \ we’ll use here, along with its Prototype substrate. Depending on your datasource\
    \ location, you go with either Autocompleter.Local or Ajax.Autocompleter. (I know,\
    \ the naming isn’t very consistent; sorry about that.) In the first case, you\
    \ just specify your datasource Array and can tweak match behavior with a handful\
    \ of options (fullSearch, partialSearch, partialChars, and ignoreCase). In the\
    \ Ajax case, you provide the base URI and regular Ajax-related options, including\
    \ extra parameters to send.\n\n### Mark up a field for autocompletion.\n\nDownload\
    \ form/autocompletion/index.html\n\n```html\n<div class=\"p\" id=\"local\">\n\
    \  <label for=\"edtCachedSearch\">Local search:</label>\n  <input type=\"text\"\
    \ id=\"edtCachedSearch\" name=\"search\" />\n  <div class=\"completions\"></div>\n\
    </div>\n```\n\n### Style for readability.\n\nDownload form/autocompletion/autocompletion.css\n\
    \n```css\n.completions {\n  border: 1px solid silver; background: white; font-size:\
    \ 80%; z-index: 2;\n}\n.completions ul { margin: 0; padding: 0; list-style-type:\
    \ none; }\n.completions li { line-height: 1.5em; white-space: nowrap;\n  overflow:\
    \ hidden; }\n.completions li.selected { background: #ffa; }\n.completions strong\
    \ { color: green; }\n```\n\n### Autocomplete from a client-side datasource.\n\n\
    Download form/autocompletion/autocompletion.js\n\n```javascript\nvar FREQUENT_SEARCHES\
    \ = [\n  'JavaScript', 'JavaScript frameworks', 'Prototype', 'jQuery', 'Dojo',\n\
    \  'MooTools', 'Ext', 'Ext JS', 'script.aculo.us', 'Scripty2', 'Ajax',\n  'XHR',\
    \ '42'\n];\n\nfunction initLocalCompletions() {\n  var field = $('#edtCachedSearch'),\
    \ zone = field.next('.completions');\n  new Autocompleter.Local(field, zone, FREQUENT_SEARCHES,\n\
    \    { fullSearch: true });\n}\n```\n\n### Autocomplete with Ajax.\n\nDownload\
    \ form/autocompletion/autocompletion.js\n\n```javascript\nfunction initAjaxCompletions()\
    \ {\n  var field = $('#edtAjaxSearch'), zone = field.next('.completions');\n \
    \ new Ajax.Autocompleter(field, zone, 'autocomplete.php', {\n    method: 'get',\
    \ paramName: 'search' });\n}\n```\n\n### Related Tasks\n\n- Task 23, Validating\
    \ Forms: The Whole Nine Yards, on page 68\n\n## 26 Using Dynamic Multiple File\
    \ Uploads\n\nThe file upload feature currently built into HTML (as in, pre-HTML5)\
    \ basically blows. It’s single-file, it has no upload progress feedback, it cannot\
    \ filter on size or file type constraints, and so on. And it uses Base64 encoding,\
    \ which means every file sent is blown up by 33 percent. Unless we use stuff like\
    \ WebSockets or SWFUpload, we are stuck with most of these limitations.\n\nHowever,\
    \ we can improve the user experience a bit by letting users pick multiple files\
    \ in a nice way. When I say “nice” here, I basically mean “without as many visible\
    \ file controls as there are files.” I like how 37signals presents lists of files-to-be-uploaded\
    \ in their products: a flat, icon-decorated list of filenames with the option\
    \ to remove them from the upload “queue.”\n\n![](img/544d515106a3758d5f58491594755dce_73_0.png)\n\
    \nThe trick is to clone the file field every time its value is set, move the original\
    \ file field—hidden—in the “queue,” and reset the clone’s value so the field appears\
    \ blank again. The facing code uses a <ul> for the queue, synthesizing a <li>\
    \ to hold the file field, filename, and removal icon every time a file is selected.\
    \ It just feels nicer that way. The next great step would be to exert more control\
    \ of the input (multiple files at once, size/type constraint enforcement, and\
    \ so on), but that just isn’t possible with the current <input type=\"file\">;\
    \ go look up SWFUpload for such nifty features.\n\nThe final bit of script shown\
    \ here gets CSS class names from file extensions using a nice little mapping and\
    \ handles queue item removal when links in the queue are clicked.\n\n### Create\
    \ the initial markup for your form.\n\nDownload form/uploads/index.html\n\n```html\n\
    <form method=\"post\" action=\"server.php\" enctype=\"multipart/form-data\">\n\
    \    <ul id=\"uploads\"></ul>\n    <p><input type=\"file\" name=\"files[]\" id=\"\
    filSelector\" /></p>\n    <p><input type=\"submit\" value=\"Send these files\"\
    \ /></p>\n</form>\n```\n\n### Queue up file uploads.\n\nDownload form/uploads/uploads.js\n\
    \n```javascript\nfunction queueFile() {\n    var fileName = $F(this), clone =\
    \ this.cloneNode(true);\n    var item = new Element('li', { 'class': getFileClass(fileName)\
    \ });\n    $(clone).observe('change', queueFile).setValue('');\n    this.parentNode.appendChild(clone);\n\
    \    item.appendChild(this);\n    item.appendChild(document.createTextNode(fileName));\n\
    \    item.insert('<button><img src=\"remove.png\" alt=\"Remove\" /></button>');\n\
    \    $('uploads').appendChild(item);\n}\n\ndocument.observe('dom:loaded', function()\
    \ {\n    $('filSelector').observe('change', queueFile);\n    $('uploads').observe('click',\
    \ handleQueueRemoval);\n});\n```\n\n### Add some flair: per-extension styling\
    \ and queue removal.\n\nDownload form/uploads/uploads.js\n\n```javascript\nvar\
    \ ICONS = $H({ word: $w('doc docx'), image: $w('jpg jpeg gif png') });\n\nfunction\
    \ getFileClass(fileName) {\n    var ext = (fileName.match(/\\.([^.]+)$/) || [,''])[1].toString().toLowerCase();\n\
    \    var icon = ICONS.detect(function(pair) { return pair[1].include(ext); });\n\
    \    return (icon || [,''])[0];\n}\n\nfunction handleQueueRemoval(e) {\n    var\
    \ trigger = e.findElement('button');\n    trigger && trigger.up('li').remove();\n\
    }\n```\n"
  mdcn: "\n\n## 24 在表单上提供即时帮助工具提示\n\n有时我们会将复杂的表单放在网上。字段具有高级语义或非平凡的输入规则。例如，我们可能对密码字段强制执行复杂度要求，在这种情况下，最佳实践（也是礼貌的做法）是提前警告用户。但当多个字段需要详细警告和说明时，我们的表单会变得杂乱。\n\
    \n![](img/544d515106a3758d5f58491594755dce_69_0.png)\n\n一种有用的方法是为每个字段放置工具提示，并在需要时才显示——当字段获得焦点时。简而言之，这是在表单相关的变体上，我们在第\
    \ 12 节《Pulling Off Classy Tooltips》中所做的，见第 44 页。\n\n请注意，最佳位置是在标签内部，而不仅仅是在同一段落中。这样，这些信息对盲用户来说是可用的，无论他们的屏幕阅读器当前处于何种模式。\n\
    \n样式——尤其是在定位工具提示方面——对本任务非常重要，因此我在对面页面上展示了一些 CSS。但这坦率地说是一个微不足道的例子。如果使用模拟焦点和模糊事件冒泡的库，可以在代码和性能方面都得到增强，这样你就不必为每个相关字段显式注册事件监听器。在撰写本文时，最新版的\
    \ jQuery 已内置此功能，你会为最流行的 JavaScript 框架找到或多或少官方的插件来满足相同需求。\n\n### 将工具提示放在有用的地方。\n\
    \nDownload form/tooltips/index.html\n\n```html\n<p>\n  <label for=\"user_login\"\
    >\n    Login*\n    <span class=\"tooltip\" style=\"display: none;\">\n      Logins\
    \ must be unique, at least 3 characters long,\n      and may only use letters,\
    \ numbers, white space,\n      hyphens, underscores and periods.\n    </span>\n\
    \  </label>\n  <input type=\"text\" id=\"user_login\" name=\"user[login]\" class=\"\
    required text\" />\n</p>\n```\n\n### 样式以获得统一、整洁的外观。\n\nDownload form/tooltips/tooltips.css\n\
    \n```css\n#registration label { float: left; width: 6em; position: relative; zoom:\
    \ 1; }\n#registration input.text { width: 14em; }\n#registration .tooltip {\n\
    \  display: block; position: absolute; left: 24em; top: 0;\n  padding: 0.35em\
    \ 0.5em 0.35em 2em; width: 15em;\n  border: 1px solid silver;\n  color: gray;\
    \ font-size: 80%;\n  background: #ffc url(lightbulb.png) 0.5em 0.3em no-repeat;\n\
    }\n```\n\n### 获得焦点时显示，失去焦点时隐藏。\n\nDownload form/tooltips/tooltips.js\n\n```javascript\n\
    document.observe('dom:loaded', function() {\n  var attr = Prototype.Browser.IE\
    \ ? 'htmlFor' : 'for';\n  function showTooltip() {\n    var tooltip = $$('label['+attr+'=\"\
    '+this.id+'\"] .tooltip').first();\n    tooltip && tooltip.show();\n  }\n  function\
    \ hideTooltip() {\n    var tooltip = $$('label['+attr+'=\"'+this.id+'\"] .tooltip').first();\n\
    \    tooltip && tooltip.hide();\n  }\n\n  $('registration').getInputs().invoke('observe',\
    \ 'focus', showTooltip).\n    invoke('observe', 'blur', hideTooltip);\n});\n```\n\
    \n## 25 在输入时自动补全\n\n比在发送到服务器之前验证输入更好的是在用户输入时验证输入！通过将用户的持续输入与有效/有用的输入数据库进行匹配，我们可以提供建议，不仅可以帮助他们纠正拼写错误，还可以让他们免于手动输入那些常见到足以出现在建议列表中的长内容。\n\
    \n![](img/544d515106a3758d5f58491594755dce_71_0.png)\n\n这传统上被称为自动补全。唯一的问题是你的参考数据源是在客户端预取的（作为简单的\
    \ Array 或更丰富的结构化对象，例如 JSON 字面量），还是存储在服务器上，随着输入的进行反复查询。\n\n这里有一个经验法则：如果你的数据源足够小（例如州、货币或单一品牌内型号名称的参考列表），就在脚本中预取它（例如在渲染页面时生成\
    \ JavaScript 字面量）。否则，使用 Ajax，并确保调整查询频率，以便即使在连接缓慢或打字快速的情况下也能获得良好的用户体验。\n\nScript.aculo.us\
    \ 1.8 具有一个功能强大的自动补全控件，具有大量自定义选项，我们将在此处使用它，以及它的 Prototype 底层。根据你的数据源位置，你可以使用 Autocompleter.Local\
    \ 或 Ajax.Autocompleter。（我知道命名并不很一致；对此抱歉。）在第一种情况下，你只需指定数据源 Array，并可以使用几个选项微调匹配行为（fullSearch、partialSearch、partialChars\
    \ 和 ignoreCase）。在 Ajax 情况下，你提供基本 URI 和常规 Ajax 相关选项，包括要发送的额外参数。\n\n### 标记一个字段以进行自动补全。\n\
    \nDownload form/autocompletion/index.html\n\n```html\n<div class=\"p\" id=\"local\"\
    >\n  <label for=\"edtCachedSearch\">Local search:</label>\n  <input type=\"text\"\
    \ id=\"edtCachedSearch\" name=\"search\" />\n  <div class=\"completions\"></div>\n\
    </div>\n```\n\n### 样式以提高可读性。\n\nDownload form/autocompletion/autocompletion.css\n\
    \n```css\n.completions {\n  border: 1px solid silver; background: white; font-size:\
    \ 80%; z-index: 2;\n}\n.completions ul { margin: 0; padding: 0; list-style-type:\
    \ none; }\n.completions li { line-height: 1.5em; white-space: nowrap;\n  overflow:\
    \ hidden; }\n.completions li.selected { background: #ffa; }\n.completions strong\
    \ { color: green; }\n```\n\n### 从客户端数据源自动补全。\n\nDownload form/autocompletion/autocompletion.js\n\
    \n```javascript\nvar FREQUENT_SEARCHES = [\n  'JavaScript', 'JavaScript frameworks',\
    \ 'Prototype', 'jQuery', 'Dojo',\n  'MooTools', 'Ext', 'Ext JS', 'script.aculo.us',\
    \ 'Scripty2', 'Ajax',\n  'XHR', '42'\n];\n\nfunction initLocalCompletions() {\n\
    \  var field = $('#edtCachedSearch'), zone = field.next('.completions');\n  new\
    \ Autocompleter.Local(field, zone, FREQUENT_SEARCHES,\n    { fullSearch: true\
    \ });\n}\n```\n\n### 使用 Ajax 自动补全。\n\nDownload form/autocompletion/autocompletion.js\n\
    \n```javascript\nfunction initAjaxCompletions() {\n  var field = $('#edtAjaxSearch'),\
    \ zone = field.next('.completions');\n  new Ajax.Autocompleter(field, zone, 'autocomplete.php',\
    \ {\n    method: 'get', paramName: 'search' });\n}\n```\n\n### 相关任务\n\n- Task\
    \ 23, Validating Forms: The Whole Nine Yards, on page 68\n\n## 26 使用动态多文件上传\n\n\
    目前内置于 HTML 中的文件上传功能（即 HTML5 之前）基本上很糟糕。它是单文件上传，没有上传进度反馈，不能按大小或文件类型约束进行过滤，等等。而且它使用\
    \ Base64 编码，这意味着每个发送的文件都会膨胀 33%。除非我们使用 WebSockets 或 SWFUpload，否则我们被困在大多数这些限制中。\n\
    \n然而，我们可以通过让用户以一种不错的方式选择多个文件来改善用户体验。当我说“不错”时，我基本上是指“没有与文件数量一样多的可见文件控件”。我喜欢 37signals\
    \ 在其产品中展示待上传文件列表的方式：一个平坦的、带图标装饰的文件名列表，并有选项将其从上传“队列”中移除。\n\n![](img/544d515106a3758d5f58491594755dce_73_0.png)\n\
    \n诀窍是每次其值被设置时克隆文件字段，将原始文件字段（隐藏）移入“队列”，并重置克隆的值，使字段再次显示为空。对面代码使用 <ul> 作为队列，每次选择文件时合成一个\
    \ <li> 来保存文件字段、文件名和删除图标。这样感觉更自然。下一步的改进将是更好地控制输入（一次多个文件、大小/类型约束强制执行等），但这只是用当前的\
    \ <input type=\"file\"> 不可能实现的；去查阅 SWFUpload 以获取此类精美功能。\n\n这里展示的最后一段脚本使用一个不错的小映射根据文件扩展名获取\
    \ CSS 类名，并在队列中的链接被点击时处理队列项的移除。\n\n### 为你的表单创建初始标记。\n\nDownload form/uploads/index.html\n\
    \n```html\n<form method=\"post\" action=\"server.php\" enctype=\"multipart/form-data\"\
    >\n    <ul id=\"uploads\"></ul>\n    <p><input type=\"file\" name=\"files[]\"\
    \ id=\"filSelector\" /></p>\n    <p><input type=\"submit\" value=\"Send these\
    \ files\" /></p>\n</form>\n```\n\n### 排队文件上传。\n\nDownload form/uploads/uploads.js\n\
    \n```javascript\nfunction queueFile() {\n    var fileName = $F(this), clone =\
    \ this.cloneNode(true);\n    var item = new Element('li', { 'class': getFileClass(fileName)\
    \ });\n    $(clone).observe('change', queueFile).setValue('');\n    this.parentNode.appendChild(clone);\n\
    \    item.appendChild(this);\n    item.appendChild(document.createTextNode(fileName));\n\
    \    item.insert('<button><img src=\"remove.png\" alt=\"Remove\" /></button>');\n\
    \    $('uploads').appendChild(item);\n}\n\ndocument.observe('dom:loaded', function()\
    \ {\n    $('filSelector').observe('change', queueFile);\n    $('uploads').observe('click',\
