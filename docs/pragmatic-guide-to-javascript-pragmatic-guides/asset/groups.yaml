  mdcn: "\n\n## 第五部分\n## 与服务器端对话\n\n上一部分向我们展示了（其中之一）如何在客户端尽可能多地验证输入。它还开始深入使用服务器提供的数据进行更复杂的验证、补全等。大多数\
    \ Web 应用都依赖后端来完成其功能；它们如何与该后端“对话”是本部分的主题。\n\n- 我们首先将讨论 cookie，这是跨请求持久化状态的最早方法之一，使我们能够为用户创建\
    \ *会话* 式的导航，以便记住他们所做的事情、记住他们是谁等等。这在任务 27 中有所涉及，*读取/写入 Cookie*。永久 cookie 存储在用户的磁盘上，也能让我们在多次访问之间“记住”他们，这可能有有用的应用。不幸的是，JavaScript\
    \ 中原生的 cookie 操作相当糟糕；我们将看到如何更轻松地处理它们。\n- 然后我们将聚焦于 Web 2.0 应用和服务的重量级选手：Ajax。首先，我们将介绍如何在不重新加载页面的情况下与服务器通信的基础知识；这在任务\
    \ 28 中，*通过 Ajax 加载内容（同域）*。\n- 然后我们在任务 29 中对 JSON 进行深入了解，*使用 JSON*，以及其表亲 JSON-P\
    \ 在任务 30 中，*使用 JSON-P*。这些是在 JavaScript 驱动的客户端和任何服务器之间交换数据的好方法（比使用 XML 容易得多）。\n\
    - 最后，作为通向 mashup 的开端，我们将介绍与位于我们域之外的第三方服务通信的大多数（众多）方式。这在任务 31 中可用，*跨域“Ajax”（第一版）*，以及任务\
    \ 32，*跨域“Ajax”（第二版）*。\n\n调试 Ajax 或 JSON-P 调用可能相当棘手。如果你还没有阅读过，请务必查看第 102 页的附录 B。你将在那里获得所需的所有工具，以便舒适地探查你的代码所进行的任何客户端-服务器交换；没有必要浪费数小时并徒劳地抓头发。\n\
    \n## 27 读取/写入 Cookie\n\n直接在客户端调整 cookie 通常很有用。我们可以使用它们来免除用户在每次页面加载时重新定义其设置的需求，通过在发布后重定向时持久化诸如分页大小、活动标签（在标签式\
    \ UI 中）、树中折叠/展开的节点等内容。\n\n无论我们如何设置这些 cookie（作用域或过期时间），我们得到的唯一原生 cookie 子系统接口是“DOM\
    \ Level 0” document.cookie 属性。该属性在读取时充当 getter，在写入时充当 setter/deleter。不幸的是，它并没有费心提供一个整洁的单个\
    \ cookie 设置接口。感觉我们正在读写原始 HTTP 头！\n\n因此，为了免除这种繁琐，大多数框架要么直接提供，要么通过知名插件提供，对 cookie\
    \ 的更舒适访问。Cookie 管理是一件很小的事情，因此你不应该为此依赖框架。即使你已经在使用框架——你应该！——并且它具有与 cookie 相关的功能，你可能也不喜欢它的\
    \ API。\n\n这就是为什么，如我在对面页所示，我编写了一个独立的 cookies JavaScript 助手。它不需要任何框架，并试图提供一个方便的\
    \ API（尤其是在选项方面）。它经过充分测试并有文档记录；你可能想试试！\n\n最后，你应该牢记关于 cookie 的几个事实：\n\n- 它们驻留在客户端，因此在野外几乎是裸露的。你绝不应该在其中放置敏感数据，除非你以某种稳健的方式对其进行加密和防篡改。\n\
    - 它们在大小上受到严重限制（4KB），因此不应用于存储大型数据项（例如历史记录、复杂的购物车内容、文本草稿等）。\n- 它们可能不可用，尽管这是一种非常罕见的现象。然而，更频繁发生的是，设置过期时间的\
    \ cookie 因浏览器中的安全策略而无法在会话之间持久化（要么是由于公司安全策略，要么是用户出于隐私考虑而这样配置了浏览器）。\n\n因此，尽量只将 cookie\
    \ 用于额外便利，尤其是永久 cookie。\n\n使用框架或插件。\n\n```javascript\n// jQuery Cookies plug-in\
    \ (http://code.google.com/p/cookies/)\n$.cookies.set(key, value[, options])\n\
