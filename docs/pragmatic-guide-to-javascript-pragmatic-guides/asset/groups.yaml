    \    <!-- Potentially lots more elements here... -->\n</ul>\n```\n\nHere’s a Prototype-based\
    \ script for it:\n\nDownload dom/delegation.js\n\n```\n$('items').observe('click',\
    \ function(e) {\n    var trigger = e.findElement('a.toggler');\n    if (!trigger)\
    \ return;\n    e.stop();\n    var content = trigger.up('p').next('div');\n   \
    \ if (!content) return;\n    content.toggle();\n    trigger.update(content.visible()\
    \ ? 'Close' : 'Open');\n    trigger.blur();\n});\n\n$('items').select('li').each(function(item)\
    \ {\n    item.insert({ top: '<p><a class=\"toggler\" href=\"#\">Open</a></p>'\
    \ });\n    item.down('div').hide();\n});\n```\n\n### Use a delegation-specific\
    \ API in libraries.\n\n```\n// Prototype 1.7\n$('items').on('click', 'a.toggler',\
    \ handlerFx);\n// jQuery 1.4\n$('a.toggler', '#items').live('click', handlerFx);\n\
    // YUI 3\nY.delegate('click', handlerFx, '#items', 'a.toggler');\n// Ext\nExt.get('items').on('click',\
    \ handlerFx, this, { delegate: 'a.toggler' });\n```\n\n### Related Tasks\n\n-\
    \ Task 8, *Listening for Events (and Stopping)*, on page 34\n\n## 10 Decoupling\
    \ Behaviors with Custom Events\n\nWhen your codebase grows large enough or when\
    \ you want to reuse part of it in a totally different context, you may encounter\
    \ situations where you say, “I wish this code could be triggered any which way,\
    \ instead of making assumptions about my DOM.”\n\nMost of the time, this relates\
    \ to how widgets can interact with each other. For instance, some background chat\
    \ polling engine notifies the chat widget that new messages are coming in, or\
    \ a photo viewer and its zoom-preloading facility both get notified when a photo\
    \ carousel has one of its pictures clicked.\n\nThis is what custom events are\
    \ for. There are several aspects about custom event behavior that will vary depending\
    \ on which framework you’re using:\n\n- *DOM-like behavior:* You listen for and\
    \ trigger custom events on DOM nodes (including document). They bubble, can get\
    \ stopped, and so on. This is what Prototype, jQuery, and MooTools do. When events\
    \ do not propagate, they must be fired on the object listening for them.\n- *Namespacing:*\
    \ Some frameworks will require you to namespace your events, usually with a colon-based\
    \ prefix, to distinguish them from native events. Prototype mandates this; other\
    \ frameworks will let you name custom events any way you like.\n- *Custom payload:*\
    \ Frameworks let you pass extra data to the event handler when you trigger the\
    \ custom event. Prototype accepts a single extra argument (which can obviously\
    \ be a richly structured object) that will be provided as the event’s memo property.\
    \ jQuery will pass along any extra arguments to the handler, after its initial\
    \ event object argument. All other frameworks will pass these arguments to the\
    \ handler without any prefixing. Dojo systematically requires such arguments as\
    \ a single array, even if there is only one value.\n- *Common event API:* Only\
    \ Dojo seems to require that you use the specific publish/subscribe API for custom\
    \ events, reserving its usual events API for native DOM events. This also means\
    \ there is no DOM-like behavior (for instance, bubbling).\n- *Declaration:* MooTools\
    \ lets you define custom events as special variations of predefined events (say,\
    \ a click requiring the Alt key be pressed), yet its facility for declaring such\
    \ events is mandatory for custom events, even if you should just declare their\
    \ name. Any undeclared custom event will not be fired.\n"
  mdcn: "\n\n## 7 在 DOM 加载时运行代码\n\n能够在页面的 DOM 加载后立即运行代码，是让页面从一开始就具有响应性的关键部分。\n\n如果你只在窗口的\
    \ load 事件触发时才启动，你的代码必须等待每一个资源都加载完毕——样式表、图片，以及诸如 Google Analytics 跟踪器之类的脚本，这些都可能令人恼火地缓慢。\
    \ 这在初始页面渲染之后可能意味着很长一段时间。\n\n所有库都以相当相似的方式自然地处理这个问题。 你最终会将一个函数附加到它们提供的自定义触发器上，通过自定义方法或自定义事件（例如\
    \ Prototype、MooTools 和 YUI 3 中的情况）。\n\n顺便说一下，这里有一个相关的良好实践：如果你的 UI 部分依赖于 JavaScript，你应该以这样的方式设计页面，使非\
    \ JavaScript 的替代方案默认可见，而与 JavaScript 相关的 UI 则隐藏。 然后在 DOM 加载事件中，你只需向文档的 body 添加一个与\
    \ JavaScript 相关的类，并让你的 CSS 相应地切换可见性。 这比通过 JavaScript 隐藏无关 UI 要好得多，因为它避免了在页面加载期间此类\
    \ UI 闪烁的风险。\n\n现在来谈一个相当技术性的旁注：想象一下你的初始化代码位于某个实例方法中，并且该方法需要保留其绑定。 它内部使用 this，并且需要它引用其正确的包含实例。\
    \ 尽管大多数库让你可以随意使用常规的方法绑定（例如使用 Prototype 的 bind()），Dojo 和 Ext JS 则提前解决了这个问题，允许你为方法的实例提供一个显式的引用。\
    \ 这样，它们就可以直接在其正确的上下文中调用该方法：\n\n```\n// Dojo\ndojo.addOnLoad(binding, fx)\n// Ext\
    \ JS\nExt.onReady(fx, binding)\n```\n\n你还应该检查你的初始化代码是否真的可以在 DOM 加载时运行；在少数情况下，这实际上太早了。\
    \ 例如，你可能依赖特定的图片已加载，以便根据其尺寸设置 UI，或者类似地，你可能需要 CSS 样式表已加载并应用，以获得正确的元素尺寸、颜色或诸如此类。\
    \ 那么你可能需要等待窗口的 load 事件。 大多数时候，DOM 加载已经“足够晚”，并且是一个完美的设置位置。\n\n### 在 DOM 加载时触发。\n\
    \n```\n// Prototype\ndocument.observe('dom:ready', fx)\n// jQuery\n$(fx)\n// MooTools\n\
