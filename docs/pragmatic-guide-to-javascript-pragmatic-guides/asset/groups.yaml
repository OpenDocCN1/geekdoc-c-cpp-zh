    \n# 图 B.8：使用断点调试 IE7\n\n+   6. 选择“空网站”选项，然后浏览到你想设置的任意虚拟目录。单击“确定”。\n+   7. 单击“启动调试”菜单选项或图标（绿色箭头）。\n\
