  - '[PAGE 57]


    # 18 Temporarily Disabling a Submit Button


    Sometimes our forms take a while to be processed on the server side. Perhaps we’re
    uploading a large file using a good ol’ <input type="file"... /> field, or the
    server is just busy for some reason. At any rate, we do not want our user to resubmit
    the form while we’re processing it already. Double-submits are just irritating,
    you know?


    To avoid this, we can react to our form being submitted by disabling any UI means
    of submitting it, which boils down to <input> or <button> tags with type="submit"
    or type="image" attributes. Because a few browsers (such as our beloved MSIE)
    do not handle CSS attribute selectors well, we should “tag” those elements with
    a specific class, say submit, and use it to select elements we intend to disable.


    On the facing page, the first script shows the minimum Prototype-based code for
    that. It’s fairly straightforward.


    You will likely want to go the extra mile and add some further UI decoration to
    your form as it is submitting; not all browsers render disabled fields in a clear
    visual style, and perhaps you also want to stress the fact that something is going
    on. (You’re not just disabling that thing to be obnoxious, are you?)


    The second script illustrates adding a custom class to our disabled <input> tags.
    Because the UI update that results from applying CSS is not as “built-in” as a
    disabling call, we also want to make sure our browser can “take a breath” before
    we have it submit the form (at which time it’s likely to ignore any further visual
    update and just plow ahead with the submission). To solve this common problem,
    we delay() the submit() call by just a tenth of a second.


    Also notice the that = this closure trick in our JavaScript code here. As you
    may know, calling a function (in this case, the one we end up delay()ing) can
    lose our current binding—the value this refers to. Instead of forcing such a binding,
    which requires an extra layer of function wrapping and is therefore pretty costly,
    we rely on closures to let the code inside our ad hoc anonymous function retain
    a reference to our original this (the form being submitted) in order to call submit()
    on it in due time.21


    21. Queasy about JS function bindings? Check out my ALA article at http://www.alistapart.com/articles/getoutbindingsituations/
    for details. Not too sure about closures and how they’re useful? My pal Jury “Kangax”
    Zaytsev wrote a great article about it at http://msdn.microsoft.com/en-us/scriptjunkie/ff696765.aspx.'
