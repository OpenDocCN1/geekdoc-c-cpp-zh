    http://www.flickr.com/photos/97027332@N00/4105961623/\",\n    \"media\": {\n \
    \     \"m\":\"http://farm3.static.flickr.com/2638/4105961623_ec0ca9c164_m.jpg\"\
    \n    },\n    \"date_taken\": \"2009-11-12T15:38:21-08:00\",\n    // ...\n   \
    \ \"published\": \"2009-11-15T18:54:21Z\",\n    // ...\n  },\n  // ...\n  ]\n\
    })\n```\n\n## 35 Geocoding a Location and Getting Photos For It\n\nGeolocation\
    \ has become a very common need, mostly thanks to the rise of the mobile Web,\
    \ so we’re going to illustrate the two main aspects of it:\n\n- First, turning\
    \ a textual location (address, city, region or state, country) into a geolocation\
    \ (which essentially boils down to a latitude and a longitude)³³\n- Second, searching\
    \ data based on these geocoordinates\n\nA lot of APIs are available, including\
    \ prominent “geocoders” from Google, Yahoo!, Geonames, and others. For our purposes,\
    \ I’ll use a very simple, straightforward, and useful tool: Yahoo’s Placemaker\
    \ API and Christian Heilmann’s JavaScript wrapper for it, JS-Placemaker. This\
    \ API lets us analyze any text to extract one or more potential geolocations for\
    \ it, and we’ll use that to turn a location name (say, something typed into a\
    \ form field) into latitude and longitude coordinates.\n\nLike all Yahoo! Developer\
    \ Network APIs, Placemaker requires a Yahoo! AppID; the sample code on the facing\
    \ page includes a working one, but you should get your own AppIDs to play with.³⁴\
    \ Then all you need to do is provide the JavaScript wrapper with it and call its\
    \ getPlaces() method with the text to analyze, a callback to process the results,\
    \ and optionally the text’s locale (for instance, en-US or fr-FR) to help Placemaker\
    \ analyze it correctly.\n\nNotice a tiny trick in the code to “normalize” the\
    \ resultset toward a guaranteed array of places. Because a one-match case has\
    \ a single match property and a multiple-match case returns an array named matches,\
    \ we use a (matches || [match]) construct to access both situations as an array.\n\
    \nOn the Flickr side of things, we just use the flickr.photos.search method with\
    \ its geo-related parameters lat and lon, through a JSON-P call very much like\
    \ in the previous task. Because we’re doing a global search here, we don’t need\
    \ to specify a user ID this time.\n\nIf you’re interested in georelated tricks\
    \ and hacks that are on the client side and JavaScript-based—including GeoIP and\
    \ the W3C Geo API—you can find a wealth of info, demos, and cool stuff on the\
    \ page maintained by evangelist extraordinaire Christian Heilmann.³⁵\n\n33. Often\
    \ you’ll also want to use extra data such as accuracy and the resulting bounding\
    \ box.\n\n34. Get those at https://developer.apps.yahoo.com/wsregapp/.\n\n35.\
    \ http://isithackday.com/hacks/geo/\n\n### Fetch geolocations for any given text.\n\
    \n(The following code actually assumes only the first resulting geolocation is\
    \ relevant.)\n\n```\nDownload mashups/geo/geo.js\n\n// Use your *own* API key\
    \ for your own code :-)\nvar YAHOO_APPID = 'KwWEZW_V34GVYNWW0LZm6NT.' +\n'XfIWnR9ysko8qu6sDuE6Sbehu\
    \ ptUZQp6jKF130V25hFTMr rdrbQe04-';\n\nfunction getGeoLocationFor(text) {\n  Placemaker.config.appID\
    \ = YAHOO_APPID;\n  $('indicator').addClassName('loading').update('Getting geolocation\
    \ for ' + text.escapeHTML() + '...').show();\n  Placemaker.getPlaces(text, function(places)\
    \ {\n    if (places.error) {\n      $('indicator').removeClassName('loading').update(places.error.escapeHTML());\n\
    \    } else {\n      var loc = (places.matches || [places.match])[0].place;\n\
    \      $('indicator').update('Loading ' + loc.name + ' pics (' + loc.type + '...)');\n\
    \      getGeoPhotos(loc.centroid.latitude, loc.centroid.longitude);\n    }\n \
    \ }, 'en-US');\n}\n```\n\n### Fetch geolocated photos from Flickr.\n\n```\nDownload\
    \ mashups/geo/geo.js\n\n// flickrCallback is very similar to the Flickr syndication\
    \ task's code.\n// Get full example code at http://pragprog.com/titles/pg_js/source_code\n\
    \nfunction getGeoPhotos(lat, lon) {\n  $('indicator').addClassName('loading').show();\n\
    \  var uri = FLICKR_ENDPOINT + '?' + Object.toQueryString({\n    method: 'flickr.photos.search',\
    \ api_key: FLICKR_API_KEY,\n    extras: 'date_taken,url_sq,description', lat:\
    \ lat, lon: lon,\n    per_page: 50, format: 'json', jsoncallback: 'flickrCallback'\n\
    \  });\n  document.documentElement.firstChild.appendChild(\n    new Element('script',\
    \ { type: 'text/javascript',\n      src: uri + '&amp;r=' + Math.random() }));\n\
    }\n```\n"
  mdcn: "\n\n## 获取你最近的推文。\n\n下面的代码在某些地方依赖 Prototype（如 `$()`、`each()`、`escapeHTML()`、`insert()`\
    \ 等），但可以很容易地转换为其他框架。\n\n```javascript\nvar REGEXP_URL = new RegExp('https?://(.)*?(\\\
    W?|\\s|$)'\n```\n\n### 查看 JSON 编码推文的一部分。\n\n（实际返回的数据集要详细得多，URL 显然不会被截断——这里只是让你了解一下。）\n\
    \n```json\n{\n  \"in_reply_to_screen_name\": null,\n  \"user\": {\n    \"friends_count\"\
    : 27, \"statuses_count\": 622,\n    \"name\": \"Christophe Porteneuve\",\n   \
    \ \"followers_count\": 215,\n    \"profile_image_url\": \"http://a3.twimg.com/.../headshot_tdd_normal.jpg\"\
    \n  },\n  \"id\": 9531762839, \"created_at\": \"Tue Feb 23 18:35:22 +0000 2010\"\
    ,\n  \"in_reply_to_status_id\": null,\n  \"text\": \"15' pour 850m. Sympa av Saint-Ouen\
    \ + av Clichy aux heures de...\"\n}\n```\n\n## 34 同步你的 Flickr 更新\n\nFlickr 提供了一个相当庞大的、符合\
    \ REST 的 API，但其有用的部分通常需要身份验证，这可能很麻烦，无论如何也不太适合面向公众的聚合内容。\n\n你可以通过 YQL 更轻松地获得大部分有用的查询功能。然而，在这个特定实例中，我们可以直接利用\
    \ Flickr 为大多数页面（包括用户页面）提供的 Atom 馈送的 JSON 变体。生成的数据集包含我们需要的所有信息，包括预构建的图像和用户资料 URL、尺寸和发布日期。这样的馈送仅限于最新的二十张图片更新，但这仍然非常适合“Flickr\
    \ 更新”的聚合。\n\n对面页面上的 JSON 片段说明了我们得到的结果集类型。这里我们主要对照片缩略图 URL 和发布日期感兴趣。我们也可以多花点功夫获取原始尺寸和拍摄日期。不过，为了简单起见，我们将坚持单次请求，不做太多调整。\n\
    \n我们获取的图像 URL 指向照片的中等尺寸版本，而我们需要更小的方形缩略图。只需将图像 URL 后缀从 `_m` 改为 `_s` 即可修复。\n\n对面的代码也很好地展示了\
    \ Prototype 中的 Template 类，它允许我们以可重复的方式高效地生成“格式化字符串”。\n\n同样，你可以使用 Flickr 的 YQL\
    \ 表以未认证的方式获取更多信息（先用一个请求获取原始结果集，然后每张照片再额外查询以获取更多详细信息）。如果你需要获取更多信息，或实际更新数据，API 也在那里。\n\
    \n### 获取某人的公开照片。\n\n```javascript\nDownload mashups/flickr/flickr.js\n\nvar FLICKR_ENDPOINT='http://api.flickr.com/services/feeds/photos_public.gne';\n\
    var FLICKR_USER_ID = '97027332@N00'; // That's me!\nvar item = new Template(\n\
    \  '<li><a href=\"#{target}\"><img src=\"#{src}\" title=\"#{title}\" /></a></li>');\n\
    \nfunction jsonFlickrFeed(data) {\n  var stream = $('flickrStream'), d, dateStr;\n\
    \  data.items.each(function(photo) {\n    d = photo.published.split(/\\D/);\n\
    \    dateStr = d[1] + '/' + d[2] + '/' + d[0];\n    stream.insert(item.evaluate({\n\
    \      src: photo.media.m.replace('_m', '_s'), target: photo.link,\n      title:\
    \ 'Published on ' + dateStr + ' GMT'\n    }));\n  });\n  $('indicator').removeClassName('loading').update('Loaded!');\n\
    }\n\nfunction loadFlickrPhotostream() {\n  var uri = FLICKR_ENDPOINT + '?format=json&id='\
    \ + FLICKR_USER_ID;\n  document.documentElement.firstChild.appendChild(\n    new\
    \ Element('script', { type: 'text/javascript',\n      src: uri + '&r=' + Math.random()\
    \ }));\n}\n```\n\n### 查看部分 JSON-P 响应。\n\n```json\njsonFlickrFeed({\n  // ...\n\
    \  \"items\": [\n  {\n    \"title\": \"P1010071\",\n    \"link\": \"http://www.flickr.com/photos/97027332@N00/4105961623/\"\
    ,\n    \"media\": {\n      \"m\":\"http://farm3.static.flickr.com/2638/4105961623_ec0ca9c164_m.jpg\"\
    \n    },\n    \"date_taken\": \"2009-11-12T15:38:21-08:00\",\n    // ...\n   \
    \ \"published\": \"2009-11-15T18:54:21Z\",\n    // ...\n  },\n  // ...\n  ]\n\
    })\n```\n\n## 35 对位置进行地理编码并获取相关照片\n\n地理位置信息已经成为非常普遍的需求，主要得益于移动 Web 的兴起，因此我们将说明它的两个主要方面：\n\
    \n- 首先，将文本位置（地址、城市、地区或州、国家）转换为地理位置（基本上归结为纬度和经度）³³\n- 其次，基于这些地理坐标搜索数据\n\n有很多 API\
    \ 可用，包括来自 Google、Yahoo!、Geonames 等知名“地理编码器”。为了我们的目的，我将使用一个非常简单、直接且有用的工具：Yahoo\
    \ 的 Placemaker API 和 Christian Heilmann 为它编写的 JavaScript 包装器 JS-Placemaker。这个\
    \ API 允许我们分析任何文本，提取一个或多个潜在的地理位置，我们将利用它把位置名称（例如，在表单字段中输入的内容）转换为经纬度坐标。\n\n与所有 Yahoo!\
    \ Developer Network API 一样，Placemaker 需要一个 Yahoo! AppID；对面页面上的示例代码包含一个可用的 AppID，但你应该获取自己的\
    \ AppID 来使用。³⁴ 然后你只需要将 AppID 提供给 JavaScript 包装器，并使用 `getPlaces()` 方法，传入要分析的文本、一个处理结果的回调，以及可选的文本区域设置（例如\
    \ `en-US` 或 `fr-FR`），以帮助 Placemaker 正确分析。\n\n注意代码中有一个小技巧，将结果集“规范化”为有保证的 places\
    \ 数组。因为单匹配情况有一个 `match` 属性，而多匹配情况返回一个名为 `matches` 的数组，我们使用 `(matches || [match])`\
    \ 结构将两种情况都作为数组访问。\n\n在 Flickr 方面，我们使用 `flickr.photos.search` 方法及其与地理位置相关的参数 `lat`\
    \ 和 `lon`，通过 JSON-P 调用，就像之前的任务一样。因为这里我们做的是全局搜索，所以这次不需要指定用户 ID。\n\n如果你对基于客户端和 JavaScript\
    \ 的地理相关技巧和黑客技术感兴趣——包括 GeoIP 和 W3C Geo API——你可以在 evangelist extraordinair Christian\
    \ Heilmann 维护的页面上找到大量信息、演示和很酷的东西。³⁵\n\n33. 通常你还会想使用额外的数据，如精度和结果边界框。\n\n34. 可在\
    \ https://developer.apps.yahoo.com/wsregapp/ 获取。\n\n35. http://isithackday.com/hacks/geo/\n\
    \n### 获取任意给定文本的地理位置。\n\n（以下代码实际上假设只有第一个产生的地理位置是相关的。）\n\n```javascript\nDownload\
    \ mashups/geo/geo.js\n\n// Use your *own* API key for your own code :-)\nvar YAHOO_APPID\
    \ = 'KwWEZW_V34GVYNWW0LZm6NT.' +\n'XfIWnR9ysko8qu6sDuE6Sbehu ptUZQp6jKF130V25hFTMr\
    \ rdrbQe04-';\n\nfunction getGeoLocationFor(text) {\n  Placemaker.config.appID\
    \ = YAHOO_APPID;\n  $('indicator').addClassName('loading').update('Getting geolocation\
    \ for ' + text.escapeHTML() + '...').show();\n  Placemaker.getPlaces(text, function(places)\
    \ {\n    if (places.error) {\n      $('indicator').removeClassName('loading').update(places.error.escapeHTML());\n\
    \    } else {\n      var loc = (places.matches || [places.match])[0].place;\n\
    \      $('indicator').update('Loading ' + loc.name + ' pics (' + loc.type + '...)');\n\
    \      getGeoPhotos(loc.centroid.latitude, loc.centroid.longitude);\n    }\n \
    \ }, 'en-US');\n}\n```\n\n### 从 Flickr 获取地理定位照片。\n\n```javascript\nDownload mashups/geo/geo.js\n\
    \n// flickrCallback is very similar to the Flickr syndication task's code.\n//\
    \ Get full example code at http://pragprog.com/titles/pg_js/source_code\n\nfunction\
    \ getGeoPhotos(lat, lon) {\n  $('indicator').addClassName('loading').show();\n\
    \  var uri = FLICKR_ENDPOINT + '?' + Object.toQueryString({\n    method: 'flickr.photos.search',\
    \ api_key: FLICKR_API_KEY,\n    extras: 'date_taken,url_sq,description', lat:\
    \ lat, lon: lon,\n    per_page: 50, format: 'json', jsoncallback: 'flickrCallback'\n\
    \  });\n  document.documentElement.firstChild.appendChild(\n    new Element('script',\
    \ { type: 'text/javascript',\n      src: uri + '&amp;r=' + Math.random() }));\n\
    }\n```\n\n"
