    - 官方网址是 http://jquery.com/。

    - jQuery UI 的官方网址是 http://jqueryui.com/。

    - 源代码托管在 GitHub：http://github.com/jquery/jquery。

    - 可在 http://dev.jquery.com/ 查找 bug 跟踪。

    - 所有官方论坛可在 http://docs.jquery.com/Discussion 找到。


