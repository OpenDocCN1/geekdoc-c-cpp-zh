    # 10 Decoupling Behaviors with Custom Events


    When your codebase grows large enough or when you want to reuse part of it in
    a totally different context, you may encounter situations where you say, “I wish
    this code could be triggered any which way, instead of making assumptions about
    my DOM.”


    Most of the time, this relates to how widgets can interact with each other. For
    instance, some background chat polling engine notifies the chat widget new messages
    are coming in, or a photo viewer and its zoom-preloading facility both get notified
    when a photo carousel has one of its pictures clicked.


    This is what custom events are for. There are several aspects about custom event
    behavior that will vary depending on which framework you’re using:


    +   - *DOM-like behavior:* You listen for and trigger custom events on DOM nodes
    (including document). They bubble, can get stopped, and so on. This is what Prototype,
    jQuery, and MooTools do. When events do not propagate, they must be fired on the
    object listening for them.

    +   - *Namespacing:* Some frameworks will require you to namespace your events,
    usually with a colon-based prefix, to distinguish them from native events. Prototype
    mandates this; other frameworks will let you name custom events any way you like.

    +   - *Custom payload:* Frameworks let you pass extra data to the event handler
    when you trigger the custom event. Prototype accepts a single extra argument (which
    can obviously be a richly structured object) that will be provided as the event’s
    memo property. jQuery will pass along any extra arguments to the handler, after
    its initial event object argument. All other frameworks will pass these arguments
    to the handler without any prefixing. Dojo systematically requires such arguments
    as a single array, even if there is only one value.

    +   - *Common event API:* Only Dojo seems to require that you use the specific
    publish/subscribe API for custom events, reserving its usual events API for native
    DOM events. This also means there is no DOM-like behavior (for instance, bubbling).

    +   - *Declaration:* MooTools lets you define custom events as special variations
    of predefined events (say, a click requiring the Alt key be pressed), yet its
    facility for declaring such events is mandatory for custom events, even if you
    should just declare their name. Any undeclared custom event will not be fired.'
