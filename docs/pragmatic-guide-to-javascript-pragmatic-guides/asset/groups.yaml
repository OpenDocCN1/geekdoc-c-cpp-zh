  - '[PAGE 51]


    # 16 Implementing an “Infinite Scroll”


    Gmail introduced us to infinite scroll, spelling doom for pagination in a number
    of scenarios. Many people (certainly not all, though) find it more efficient to
    scroll through a boatload of items and use visual pattern matching rather than
    pointing to and clicking pagination link after pagination link.


    Pagination mostly arose for technical reasons alone:


    +   - Older browsers render slowly, forcing us to keep our pages “light enough.”

    +   - Bandwidth may be limited anywhere between client and server, encouraging
    us to stay lean.

    +   - Server-side processing time grows as the data grows. Rendering the entire
    dataset all at once is not only unnecessary from a consumption standpoint but
    is infeasible for our servers (or at the very least impractical and unwieldy),
    especially if they want to keep handling enough concurrent requests.


    Still, pagination was just one way—the non-JavaScript way. But as soon as JavaScript
    is enabled, you can hide any pagination links and replace them with infinite scroll
    when that makes sense. I leave that decision to your usability experts—and to
    your good sense.


    As you can see on the facing code, infinite scroll is nothing too fancy. The only
    tricky part is jumping through a couple of hoops to get our metrics right, across
    browsers, as evidenced in the lowEnough() method code.


    We check, essentially, that the bottom of the document is not too far below the
    bottom of our viewport. Then it’s just a matter of looking at the current state
    of vertical scrolling often enough—ten times per second is certainly snappy!—and
    loading more content through Ajax.


    From an accessibility (and failover) perspective, you may want to also offer pagination
    and perhaps hide Next links at setup time and then restore these links if your
    Ajax fetching fails so users get an alternative.


    A note for those of you without a working PHP setup handy: you’ll just end up
    loading more stuff instantaneously; the PHP code simulates load time by waiting
    half a second before returning static content.'
  - "[PAGE 52]\n\n# Check whether we scrolled low enough.\n\nDownload ui/infinite/infinite.js\n\
    \n```\nfunction lowEnough() {\n    var pageHeight = Math.max(document.body.scrollHeight,\n\
    \        document.body.offsetHeight);\n    var viewportHeight = window.innerHeight\
    \ ||\n        document.documentElement.clientHeight ||\n        document.body.clientHeight\
    \ || 0;\n    var scrollHeight = window.pageYOffset ||\n        document.documentElement.scrollTop\
    \ ||\n        document.body.scrollTop || 0;\n    // Trigger for scrolls within\
    \ 20 pixels from page bottom\n    return pageHeight - viewportHeight - scrollHeight\
    \ < 20;\n}\n```\n\n# Keep an eye on scroll level and fetch more.\n\nDownload ui/infinite/infinite.js\n\
    \n```\nfunction checkScroll() {\n    if (!lowEnough()) return pollScroll();\n\
    \    $('spinner').show();\n    new Ajax.Updater('posts', 'more.php', {\n     \
    \   method: 'get', insertion: 'bottom',\n        onComplete: function() { $('spinner').hide();\
    \ },\n        onSuccess: pollScroll\n    });\n}\n\nfunction pollScroll() { setTimeout(checkScroll,\
    \ 100); }\n\npollScroll();\n```"
  - '[PAGE 53]


    # 17 Maintaining Viewport When Loading Content


    At times, you may want to maintain the contents of the user’s viewport—all that’s
    visible inside the browser window—even as the user clicks to load more content
    above it. For example, a user clicks to view previous comments, but you don’t
    want to push the user’s scroll position down as the comments load from above.


    In cases like this, you’ll find yourself facing a small obstacle. Intuitively,
    users expect that their position on the page will not move. But by loading content
    above, you’ll push the rest of the document, including the clicked zone, farther
    down the viewport and quite possibly outside of it.


    The solution is to preserve the scrolling position relative to the viewport. To
    do that, we need to grab the viewport’s “scrolling offset”—the viewport position
    prior to loading content above some of what it displays—and restore that offset
    once the content has been injected. Offsets are typically a messy business, full
    of cross-browser hairiness, but thanks to libraries such as Prototype and their
    position-related features, this can actually be solved rather concisely.


    The facing code is adapted from Gist by Sam Stephenson. Before loading extra content,
    we grab the trigger link’s in-document position (its cumulativeOffset()) and subtract
    from it the viewport’s current scrolling, which tells us how far down this trigger
    appears in the viewport. Then, after the new content is injected, we determine
    what the viewport’s new offset should be, by using the converse subtraction.


    Readers familiar with Prototype may wonder why I went with Ajax.Request here,
    instead of the more specific Ajax.Updater. I did so because this lets me grab
    the original scrolling position as late as possible, specifically after the Ajax
    request completes, avoiding a weird “scroll reset” effect if the user scrolls
    during the Ajax request.


    This makes for a fairly nice user experience, with very little code.'
  - "[PAGE 54]\n\n# Preserve the viewport position.\n\nDownload ui/viewport/index.html\n\
    \n```\n<h2>Comments</h2>\n\n<div id=\"extraComments\">\n    <a id=\"loadKnownComments\"\
    \ href=\"?with_known_comments\">See previous comments you already know about</a>\n\
    </div>\n\n<h3>Comment 5</h3>\n<p>Lorem ipsum dolor sit amet, consectetur adipisicing\
    \ elit, sed do eiusmod tempor incididunt ut labore et dolore magna aliqua. Ut\
    \ enim ad minim veniam, quis nostrud exercitation ullamco laboris nisi ut aliquip\
    \ ex ea commodo consequat.</p>\n```\n\n# Grab the scroll before Ajax, and adjust\
    \ after it.\n\nDownload ui/viewport/viewport.js\n\n```\nfunction loadKnownComments(e)\
    \ {\n    e.stop();\n    var zone = $('extraComments'), ref = zone.next('h3');\n\
    \    var upd = new Ajax.Request('known_comments.html', {\n        method: 'get',\n\
    \        onSuccess: function(res) {\n            var orig = ref.cumulativeOffset().top\
    \ - document.viewport.getScrollOffsets().top;\n            zone.insert({ before:\
    \ res.responseText });\n            window.scrollTo(0, ref.cumulativeOffset().top\
    \ - orig);\n        }\n    });\n}\n```"
