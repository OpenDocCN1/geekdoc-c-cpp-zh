    # 25 Autocompleting Input As It’s Typed


    What’s even better than validating input before it’s sent to the server? Validating
    input as the user types! By matching users’ ongoing input against a database of
    valid/useful inputs, we can make suggestions that not only help them correct,
    say, spelling errors, but also save them from manually typing long stuff that
    is common enough to show up in our suggestions list.


    ![](img/544d515106a3758d5f58491594755dce_71_0.png)


    This is traditionally referred to as autocompletion. The only question is whether
    your reference datasource is prefetched on the client side (as a simple Array
    or perhaps a more richly structured object, such as a JSON literal) or is stored
    on the server, repeatedly queried as typing progresses.


    Here’s a good rule of thumb: if your datasource is small enough (such as a reference
    list of states, currencies, or model names within a single brand), prefetch it
    inside the script (for instance, generate the JavaScript literal for it when rendering
    the page). Otherwise, go Ajax, and be sure to tune the query frequency so you
    get good user experience even with slow connections or quick typists.


    Script.aculo.us 1.8 has a good autocompletion control with a ton of customization
    options, which we’ll use here, along with its Prototype substrate. Depending on
    your datasource location, you go with either Autocompleter.Local or Ajax.Autocompleter.
    (I know, the naming isn’t very consistent; sorry about that.) In the first case,
    you just specify your datasource Array and can tweak match behavior with a handful
    of options (fullSearch, partialSearch, partialChars, and ignoreCase). In the Ajax
    case, you provide the base URI and regular Ajax-related options, including extra
    parameters to send.'
