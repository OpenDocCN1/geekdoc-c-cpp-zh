    Finally, given the somewhat proprietary nature of the project, the ecosystem is
    mostly limited to the official website, sporting forums and a good wiki-based
    Learning Center offering demos, screencasts, tutorials, and more.


    These are the mandatory links:


    - This is the ExtJS official website: http://extjs.com/.

    - Download it at http://www.extjs.com/products/extjs/download.php.

    - You can find the forum at http://www.extjs.com/forum/.

    - The Learning Center’s home is at http://www.extjs.com/learn/Main_Page.


    ## C.6 Dojo


    We will complete this tour of the most popular frameworks with Dojo. It was created
    in 2004 through the arduous and joint efforts of Alex Russell, Dylan Schiemann,
    and David Schontzler while at Informatica, and it released in big one-oh on November
    5, 2007, getting split into Dojo (the core), Dijit (the UI widgets), and DojoX
    (the plug-ins and extended features).


    Dojo plays in much the same space as ExtJS now. It’s a major RIA framework with
    huge corporate backing. It is now nurtured by the Dojo Foundation, which includes
    corporate sponsors such as IBM, Google, AOL, Thomson Reuters, TIBCO, Zend, and
    Sitepen, to name only a few. Its current release at the time of this writing is
    1.5.0. Unlike ExtJS though, Dojo is actually open source, being dual-licensed
    under the Academic Free License 2.1 and the new BSD license, and maintaining public
    GitHub, Subversion, and Bazaar repositories and an online bug tracking system.


    Dojo is also close to projects that are now also under the umbrella of the Dojo
    Foundation, the most well-known ones being cometD and DWR, two early—and still
    relevant—systems for doing push notifications from the server to the browser (not
    to forget Sizzle, Persevere, and General Interface).


    Dojo is very active at web development conferences (with T-shirts, subconferences,
    meetups, the works!) and in general maintains a lively community with dedicated
    forums. As far as community strength goes, it’s probably second only to jQuery.
    You’ll find a number of good books, too, including Mastering Dojo [RGR08], Dojo:
    the Definitive Guide [Rus08], Practical Dojo Projects [Zam08], and more recently
    Getting StartED with Dojo [Hay10].


    The online docs are very good, split among a Quick Start Guide, a Reference Guide,
    and the API documentation, plus a cross point of entry using “popular solutions”
    that are task-oriented (for example, “Create charts from datasets”).


    In my opinion, should you need to create RIA-type, desktop-like applications based
    on web standards, Dojo should be your primary choice.


    We’ll wrap up this appendix with a quick list of Dojo’s important URLs:


    - This is the official website: http://www.dojotoolkit.org/.

    - You can access the repository at http://svn.dojotoolkit.org/src/ (pity they
    don’t use Git).

    - You can find bug tracking and reporting at http://bugs.dojotoolkit.org/.

    - You can engage with the community at http://www.dojotoolkit.org/community/.


    ## Getting Help


    Well, I certainly hope you found this book useful. Still, you’ll need to find
    some solutions yourself, or you may need someone to confirm you’re on track. So,
    where can you get more help and engage with other people about all this?


    ## D.1 Help on JavaScript in General


    Having great frameworks around is no excuse for not knowing your JavaScript. Sometimes
    you actually need to dive in and write some actual code, or perhaps you can’t
    make use of your usual framework for various reasons (performance on mobile devices,¹
    anyone?).


    ### Newsgroups


    Remember the time before DSL was (almost) everywhere? Before Google Groups? Before
    Google, actually? Well, perhaps you weren’t developing back then, but we had Usenet.
    It’s still around, and recently, a new generation has discovered how good it can
    be at, say, sharing binary files. Better still, it has newsgroups for every programming
    language known to man.


    Every ISP provides newsgroup access; it’s that weird “NNTP server” thing you saw
    on your subscription papers. And most aggregators, feed readers, and even email
    clients—Thunderbird, Entourage, Outlook, and, yes, even Outlook Express—let you
    connect to an NNTP server and subscribe to newsgroups of your choice. (Depending
    on your ISP, you’ll have your pick of thousands.)


    Heck, even if you don’t want to access these groups that way, Google Groups maintains
    bridges to most useful newsgroups, including the following ones:


    - The core of all the action is at comp.lang.javascript. (The address is short
    for COMPuter LANGuage JavaScript.) It’s been around for ages and remains the main
    location for all online discussions related


    1. Except if you’re using the awesome, just-released zepto.js library by Thomas
    Fuchs: http://github.com/madrobot/zepto. Or even go fastest-ever with vapor.js:
    http://github.com/madrobot/vapor.js.


    - John Resig, of jQuery fame, recently wrote what seems to be a great little book
    at Sitepoint: *Secrets of the JavaScript Ninja* [Res09].

    - Still at Sitepoint, although slightly more dated, is a great book by several
    authors: *The Art and Science of JavaScript* [AEH+07].

    - Evangelist extraordinaire Chris Heilmann authored *Beginning JavaScript with
    DOM Scripting and Ajax: From Novice to Professional* [Hei06], which is also a
    great read.

    - I would be remiss if I did not add Thomas Fuchs and Amy Hoy’s latest jewel,
    which is really a companion tool for performance, performance, and performance:
    *JavaScript Performance Rocks!* [HF09].


