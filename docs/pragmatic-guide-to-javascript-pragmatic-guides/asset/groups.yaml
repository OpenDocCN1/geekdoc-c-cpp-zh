    \ this.href,\n  target: '__blackhole' });\nform.submit();\n```\n\n# 在 204 资源上使用动态生成的表单。\n\
    \n下载 server/crossdomain1/crossdomain1.js\n\n```\nvar form = new Element('form',\
    \ { method: 'post', action: this.href });\nform.submit();\nElement.insert.defer('responses',\
    \ '<p>OK, posted.</p>');\n```\n\n# 相关任务\n\n- 任务 32，跨域“Ajax”（第二回），在下一页\n\n# 32\
    \ 跨域“Ajax”（第二回）\n\n还有其他几种方式可以在后台访问跨域、远程内容。首先，你可以使用我们信赖的老朋友 JSON-P。JSON-P 的一个有趣用途——访问大量服务、API\
    \ 和内容——是 Yahoo! 的 YQL 服务。YQL 允许你读取（有时还能写入）那些映射到几乎所有你能想到的资源的数据表：知名网站和服务（搜索、地图、地理定位、社交网络、Flickr、音乐数据、天气、供稿和微格式等等）。如果你还没试过，现在就去看看吧。26\n\
    \n当需要访问任意资源并返回其原始 HTML 响应时，YQL 提供了两个超棒的“表”：html 和 htmlpost（后者是 Chris Heilmann\
    \ 提供的社区表，因此非常出色）。这些表允许你对返回 HTML 的资源执行 GET 或 POST，甚至还能根据 XPath 选择器为你提取内容！\n\n我还想提一个相当巧妙的方法，名为\
    \ CSSHttpRequest。不过它确实需要服务器端支持。它利用 data: URI 方案将任意内容嵌入到特殊命名的 CSS 规则中。由于 CSS 文件不受同源策略限制，这种方法可行。一个小型开源库提供了\
    \ CSSHttpRequest JavaScript 对象，同时还有 Ruby、Python 和 PHP 的服务器端代码（这些代码很容易移植到其他语言）。你可以在网上找到详细信息。27\n\
    \n本书代码库中针对该任务的代码示例让你可以尝试前面提到的所有方法。\n\n最后我再提两种我故意没有包含在这里的方法，免得你说我忘了。（哈！）首先，你可以使用\
    \ Flash 桥接；虽然这需要服务器端提供某种 CORS 信息，但有一个名为 fIXHR 的库能让这件事变得轻而易举。但 Flash 是一种我碰巧不喜欢的专有技术，即使撇开这一点，为此加载\
    \ Flash 也实在大材小用。\n\n最后，你还可以使用“网络信标”——通过一个普通的 <img> 标签（你可以用脚本生成）对动态选择的图片进行服务器端调用。问题是，你能得到的唯一响应是基于图片尺寸的，而在加载完成后正确检测这些尺寸，出乎意料地麻烦。考虑到响应信息非常有限，而所需要的折腾却不少，我选择避开这种技术。\n\
    \n26. http://developer.yahoo.com/yql/\n27. http://nb.io/hacks/csshttprequest\n\
    \n# 使用普通的 JSON-P。\n\n```\nwindow.jsonpCallback = function jsonpCallback(data)\
    \ {\n  $('responses').update(data.payload.escapeHTML());\n};\ndocument.documentElement.firstChild.appendChild(\n\
    \  new Element('script', { type: 'text/javascript',\n    src: this.href + '?r='\
    \ + Math.random() + '&callback=jsonpCallback' }));\n```\n\n# 配合 JSON-P-X 使用 YQL\
    \ 的 html 表。\n\n```\nfunction yqlCallback(data) {\n  // data.results is an array\
    \ of matching elements' HTML fragments.\n};\nvar url = \"http://github.com/languages/Ruby/updated\"\
    ,\n    xpath = \"//*[@class='title']\",\n    yql = 'select * from html where url=\"\
    '+url+'\" and xpath=\"'+xpath+'\"',\n    data = { q: yql, format: 'xml', callback:\
    \ 'yqlCallback' };\ndocument.documentElement.firstChild.appendChild(\n  new Element('script',\
    \ { type: 'text/javascript',\n    src: 'http://query.yahooapis.com/v1/public/yql?'\
    \ +\n      Object.toQueryString(data) + '&r=' + Math.random() }));\n```\n\n# 配合\
    \ JSON-P 使用 YQL 的 htmlpost 表。\n\n```\nfunction yqlCallback(data) {\n  // data.query.results.postresult.p\
    \ == array of matching elements' contents.\n};\nvar yql = 'use \"http://datatables.org/data/htmlpost.xml\"\
    \ as htmlpost;\\n  select * from htmlpost\\n  where url=\"http://demos.pocketjavascript.com/server/jsonp/postdemo.php\"\
    \\n    and postdata=\"foo=foo&bar=bar\" and xpath=\"//p\"',\n    data = { q: yql,\
    \ format: 'json', callback: 'yqlCallback' };\ndocument.documentElement.firstChild.appendChild(\n\
    \  new Element('script', { type: 'text/javascript',\n    src: 'http://query.yahooapis.com/v1/public/yql?'\
    \ +\n      Object.toQueryString(data) + '&r=' + Math.random() }));\n```\n\n# 使用\
    \ CSSHttpRequest。\n\n```\nCSSHttpRequest.get(this.href, function(res) {\n  $('responses').insert('<p>'\
    \ + res.escapeHTML() + '</p>');\n});\n```\n\n# 相关任务\n\n- 任务 31，跨域“Ajax”（第一回），见第\
    \ 86 页\n- 任务 30，使用 JSON-P，见第 84 页\n\n# 第六部分\n\n# 制作混搭应用\n\n本书的最后一部分提供了具体示例，展示如何让你位于自己域名上的网页与第三方服务对话。这里不会有自定义服务器代理或\
    \ XML，只有 JSON-P 和 YQL，因此代码是自包含的，可以在任何地方运行！\n\n不过，在本书的代码页中，你可能只会看到最精华的部分。有时还需要一些最后的修饰才能完成演示。因此，请务必在源代码存档28或在线演示站点29中查看这些内容，以了解它们是如何组合在一起的。\n\
    \n- 在网页上聚合你的 Twitter 信息流如今是一项常见功能，而如果你本来对托管页面进行了大量缓存，那么在客户端进行聚合会很有帮助。任务 33“聚合你的\
    \ Twitter 更新”可以帮你实现。\n- 把你最近上传的 Flickr 照片放到页面某个区块中同样很常见，任务 34“聚合你的 Flickr 更新”对此进行了讲解。\n\
    - 第三个任务，任务 35“对位置进行地理编码并获取其照片”，探讨了 Web 中一个日益重要的方面：地理编码（不要与地理定位混淆；地理定位也是一个重要的新兴趋势，但只会在最新、最前沿的浏览器上有效）。本质上，它是将地名和地址转换为实际的地理坐标，以便你在地图上精确定位它们、将它们与其他数据（比如\
    \ Flickr 上的照片或推文！）关联起来，并创建各种将多个数据集联结在一起的有用混搭应用。如今的 Web 及其数据比以往任何时候都更易于改造，我们利用这一点可以做的事情潜力巨大！\n\
    \n# 33 聚合你的 Twitter 更新\n\n获取你最近的推文是小菜一碟，使用 Twitter 的大部分 API 也是如此。其实这只是一个简单的 JSON-P\
    \ 调用！\n\n我们这里不获取转推、提及或诸如此类的内容。这是因为大多数 Twitter 聚合发生在商业场景中，你的 Twitter 账户被用作额外的营销渠道，而你不太希望在展示自己消息的同时显示转推、回复或提及。此外，Twitter\
    \ API 并没有提供一种直接的方式让你在获取推文时同时获取转推——你需要两次单独的调用，其中一次需要身份验证，这意味着对你自己账户的身份验证将在访问者浏览器的客户端可用。而我们不想要那样。（另一种选择是在服务器端进行聚合，但这超出了本书的范围。）\n\
    \n在下一页的代码中，实际的获取操作只需几行代码，就在 loadTwitterStream() 方法中。Twitter 允许你通过一个 URL 读取任意用户名的直接推文，30\
    \ 而我们这里需要 JSON 格式。\n\n你会得到一个推文对象数组，其中包含大量属性，例如 created_at、geo、in_reply_to_status_id、source\
    \ 和 text。31\n\n下一页的 twitterCallback() 函数演示了简单的推文格式化：将回复提及和 URL 链接起来。在本任务的在线示例代码中，你会得到一个增强版，它还能处理话题标签和提及，并显示作者信息（头像、名字、推文数量等）。\n\
    \n在你大量使用 Twitter API 之前，应该先仔细阅读 Twitter 的出色 API 文档32，并注意 API 某些部分实施的速率限制，以免随着使用量增长而给系统造成过大负担。\n\
    \n30. http://twitter.com/statuses/user_timeline/username.format\n31. 你可以在 http://apiwiki.twitter.com/Return-Values\
    \ 查看完整详情。\n32. http://apiwiki.twitter.com/\n\n"
