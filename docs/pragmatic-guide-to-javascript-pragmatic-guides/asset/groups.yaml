  - '[PAGE 109]


    ![](img/544d515106a3758d5f58491594755dce_109_0.png)


    # Figure B.7: Visual Web Developer 2008 Express edition: Welcome


    There are essentially two rules we must abide by here:


    +   - We must have a VWDE project set up and with debugging enabled.

    +   - We must set IE7 as our default browser so that it is the one launched by
    the “Start debugging” feature.


    Both requirements need only be dealt with once (unless you’re testing this on
    the machine where you also surf on a regular basis and therefore need to switch
    your default browser back and forth between IE and whatever elected browser you
    have). Let’s address these requirements:


    +   1. Open IE6 or IE7, and click Tools > Internet Options....

    +   2. Go to the Advanced tab, and scroll to the Browsing section.

    +   3. Make sure “Display a notification about every script error” is checked
    and both “Disable script debugging...” are unchecked.

    +   4. Close IE entirely.

    +   5. Click File > New Web Site....'
  - '[PAGE 110]


    ![](img/544d515106a3758d5f58491594755dce_110_0.png)


    # Figure B.8: Debugging IE7 with breakpoints


    +   6. Select the Empty Web Site option, and browse to whatever dummy directory
    you want to set it up in. Click OK.

    +   7. Click the “Start debugging” menu option or icon (the green arrow).

    +   8. This first time around, VWDE detects your project is not yet set up for
    debugging. It lacks a special Web.config file. A dialog box offers to create it
    for you or continue without debugging—obviously, leave the first option checked,
    and click OK.

    +   9. You should see a development server on a dynamic port started in the taskbar,
    and your IE opens up on an empty directory listing named after your project’s
    directory (a warning bar may tell you the browser is working using the Intranet
    security zone, which is fine with us). You’re set to go!


    Now that we’re all set up, just browse to our debugbench.html file any which way.
    Once opened, look into VWDE. On the right, in the Solution Explorer panel, you
    should see a Running documents branch with debugbench.html and debugbench.js listed.
    Double-click the latter.


    You’re there! You can now set your breakpoint on line 2 the usual way (click in
    the gutter), switch back to your IE, and click the Fibo(20) button. You drop back
    to the debugger in stepping mode, as shown in Figure B.8. Voila!'
  - "[PAGE 111]\n\n# B.5 IE8 and Developer Tools\n\nThere’s no question about it:\
    \ Internet Explorer 8 is a great step forward in the IE world. Aside from the\
    \ notable improvements in web standards support (although it still lags far behind\
    \ modern browsers, it’s certainly not stuck in the Cretaceous anymore), these\
    \ points are of immediate interest to us JavaScripters:\n\n+   - The JScript engine\
    \ in IE8 is on average seven times slower than other JavaScript engines in released\
    \ browsers. This peaks at a factor of almost twelve against Chrome’s v8 or the\
    \ latest builds of Safari’s Squirrelfish Extreme and Firefox’s Tracemonkey.\n\
    +   \n+   Why is that a good news? IE7 used to be up to *ninety times* slower.\
    \ And IE6 couldn’t live with the shame of its own factor figure. So, the IE team\
    \ managed to improve its JScript engine by a factor of about thirteen, which has\
    \ to be declared awesome, like it or not.\n\n+   - The DOM performance in IE8,\
    \ which is our second major pain point when scripting, has also received some\
    \ significant love and is now lagging by an average factor of “only” four, which\
    \ is also a major improvement.\n\n+   - IE8 has built-in “Developer Tools,” which\
    \ are a cleaned-up, snappier version of the IE Developer Toolbar we use in IE6\
    \ and IE7, with an actual *JavaScript debugger* thrown in. One that actually works\
    \ and doesn’t entail incessant glitches between IE and an external debugging app.\n\
    \nSo, not only can we start thinking about reenabling our fancy effects and Ajax\
    \ operations in the IE world, but we can also do so knowing debugging got a whole\
    \ lot easier!\n\nIncidentally, IE8 also explores ways to reduce the perceived\
    \ performance impact of script loading. You still should use generic optimizations\
    \ such as “load scripts at the bottom of the ”³ and, even more importantly, script\
    \ concatenation (for example, through Sprockets⁴) and gzip’ping.⁵\n\nThe IE8 Developer\
    \ Tools pane with its Script tab opened and a debugging session going on is shown\
    \ in Figure B.9, on the following page, with our now-familiar breakpoint. Toggling\
    \ the debugger on and off is simply a matter of clicking the large button in the\
    \ toolbar, and we get the usual stepping\n\n3. http://developer.yahoo.com/performance/rules.html#js_bottom\n\
    4. http://getsprockets.com\n5. For lots of great advice about web page loading\
    \ and rendering performance, get Thomas Fuchs and Amy Hoy’s excellent *JavaScript\
    \ Performance Rocks!* [HF09], and check out the Performance tips on the Yahoo!\
    \ Developer Network at http://developer.yahoo.com/performance/rules.html."
