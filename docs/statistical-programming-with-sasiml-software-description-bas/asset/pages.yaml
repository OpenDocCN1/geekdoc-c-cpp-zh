  md: '# 208 Chapter 9: Drawing on Graphs


    # 9.3 Adjusting Graph Margins


    As discussed previously, there are two main areas in IMLPlus graph. The plot area
    displays the data; the graph area displays tick marks, axis labels, and titles.
    In Figure 9.15, the plot area is the white region and the graph area is the gray
    area. If you draw a legend that is positioned outside of the plot area, the DrawLegend
    module automatically increases the graph area in order to fit it. If you are drawing
    your annotations outside of the plot area, you might need to increase the graph
    area margins to make room for the annotations. You can also decrease the graph
    area margins to suit your preferences. This section describes how to set margins
    in a graph.


    Both the plot area and graph area contain margins. Plot area margins add space
    around the display while margins in the graph area add space outside of the plot
    area so that there is room for axes and titles. Figure 9.15 shows the default
    margins for a scatter plot. The margins are specified as a proportion of the height
    or width of the graph. For example, in Figure 9.15 the left margin of the graph
    area occupies 15% of the width of the graph and the top margin of the plot area
    occupies 5% of the height of the plot area.


    Figure 9.15 Margins in the Plot Area and Graph Area


    ![](img/148549d50632967f185e36a8bcda3de8_213_0.png)


    You can increase or decrease the graph margins using the SetGraphAreaMargins method
    in the Plot class. The method takes four arguments: the percentage of the graph
    that the margin should occupy the left, right, top, and bottom of the graph, respectively.
    You can pass the value of -1 for an argument to indicate that the method should
    not change the corresponding margin. You can use the GetGraphAreaMargins method
    to retrieve the current settings for the margins. For example, the following statements
    create a scatter plot, print the default margins, and change three of the margins:'
  merge: -1
