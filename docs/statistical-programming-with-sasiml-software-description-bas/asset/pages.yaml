    # 15.1 Overview of Timing Computations


    In a complex language such the SAS/IML language, there is often more than one
    way to accomplish a given task. Furthermore, in statistical literature there are
    often competing algorithms for computing the same statistic. In choosing which
    algorithm to implement, you can consider various characteristics:


    +   * the time and effort to implement each algorithm

    * the memory requirements for each algorithm

    * the performance of the algorithm


    In this chapter, the performance of an algorithm means the time required for it
    to run on typical data, and also how it changes with the size or characteristics
    of the data. For many cases, the memory requirements are either unimportant or
    equivalent. Therefore, given two or more algorithms implemented in the SAS/IML
    language that perform the same task, it is useful to know how to measure the performance
    of the algorithms.'
  merge: -1
