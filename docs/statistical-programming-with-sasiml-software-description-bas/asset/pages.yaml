    | | 6 |


    If m is an n x p matrix, it is an error to refer to m[i,j] when i > n or j > p.
    It is also an error to use nonnegative indices.


    It is an error to refer to a subscript of an undefined matrix. For example, the
    following statements show that you cannot assign elements of a vector that the
    vector has not been created:


    ```

    /* ERROR: subscribing a matrix that has not been created */

    z[1] = 0; /* z is undefined */

    ```


    The error message for this mistake is displayed in the SAS log, which is shown
    in Figure 2.18.'
