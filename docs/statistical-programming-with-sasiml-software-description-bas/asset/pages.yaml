  md: '# 68 Chapter 3: Programming Techniques for DATA Analysis


    The observer reader who is familiar with DATA step programming might ask “Can’t
    exclude those observations when you read the data using a WHERE clause?” Yes,
    you can. You can specify the WHERE clause on the READ statement, by the following
    statement:


    ```

    read all var "World_Gross" where (World_Gross ^= .);

    ```


    However, this does not eliminate the need for the technique of this section. For
    example, suppose you want to read several variables (say X and Y) in a single
    READ statement. Do you want to exclude observations from some X variable because
    a value is missing in the Y variable? The answer is often “yes” for a multivariate
    analysis, but it is “no” for univariate analyses. One way to handle both situations
    is to read in all of the data but exclude missing values in a way that makes sense
    for a particular analysis.


    A second consideration is that much of SAS/IML programming is done inside a module
    (modules are introduced in the section “Defining SAS/IML Modules”). A module typically
    receives a matrix as an argument, and has no control over whether or not contains
    missing values. Consequently, the module has handling missing values.


    A third consideration is that a matrix may be created from many sources: SAS data
    sets on a server, data residing in a Microsoft Excel worksheet, an R data frame,
    or values resulting from SAS/IML computation. These situations are discussed in
    Chapter 6, “Understanding IPlus Classes.” In general, an IMLPlus programmer cannot
    control whether matrices contain missing values, so it is best to write programs
    that handle them.


    **Programming Tip:** Write programs that handle missing values in the data.


    # 3.3.5 Analyzing Observations by Categories


    The LOC function is often used in concert with the UNIQUE function when you are
    analyzing categorical variables. The UNIQUE function returns a vector that contains
    a sorted list of unique values. The LOC and UNIQUE functions return their results
    as vectors. You can use the NCOL function to count how many unique values are
    there, and also use the NCOL function to count how many observations are associated
    with each unique value.


    For example, the simplest use of UNIQUE and LOC is to carry out a frequency analysis
    of a variable. The following statements count the number of categories in the
    MPAARating variable in the data set:


    ```

    /* count the number of observations in each category */

    use Saser.Movies;

    read all var "MPAARRating";              /* 1 */

    close Saser.Movies;


    categories = unique(MPAARRating);           /* 2 */

    count = j(ncol(categories), 1, 0);          /* 3 */

    doi i = 1 to ncol(categories);

    idx = loc(MPAARating = categories[i]);      /* 4 */

    count[i] = ncol(idx);                    /* 5 */

    end;

    print count[rowname=categories];

    ```'
