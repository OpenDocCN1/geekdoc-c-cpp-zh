  md: '# 9.2. Drawing Legends and Insets 203


    You should also be aware of the effect of resizing a window on objects drawn in
    user-defined coordinates. If you resize the window in Figure 9.11, you will observe
    that the simple legend does rescale the rest of the window. This is shown in Figure
    9.12.


    Figure 9.12 Resizing a Window That Has Text in the Graph


    ![](img/148549d50632967f185e36a8bcda3de8_208_0.png)


    The size of the window has shrunk, the left side of the window is still drawn
    at 80% along the width of the graph. Since the size of the window has changed,
    the entire text is no longer visible. The same behavior occurs if you change the
    graph margins. The text is not aware of the area margins, it is merely displayed
    at a certain percentage of the window''s width.


    The lesson to learn is this: when you draw objects such as legends and insets
    that are in the GRAPHFOREGROUND region, they do not rescale as the window resizes.
    Therefore, you should strive to set the size of a window prior to drawing in a
    user-coordinate system.


    > Programming Tip: Adjust the size of a window before drawing a legend or inset.
    After drawing, avoid resizing the window or changing the graph margins.


    # 9.2 Drawing Legends and Insets


    As mentioned previously, SAS/IML Studio distributes several modules that make
    it easy to create legends. This section provides an overview of the DrawLegend
    and DrawInset modules. For more information, see the SAS/IML Studio online Help.


    Both of these modules use the IMLPlus drawing subsystem to place text on a graph
    in a user-defined coordinate system. Consequently, they are affected by the issues
    discussed in Section 9.1.5.'
  merge: -1
