    \ 433\n  - C.5.5 Scatter Plot Methods . . . . . . . . . . . . . . . . 433\n- C.6\
    \ Calling SAS Procedures . . . . . . . . . . . . . . . . . 433\n- C.7 Calling\
    \ R Functions . . . . . . . . . . . . . . . . . . . 434\n\n# ## C.1 Overview of\
    \ IMLPlus Classes, Methods, and Statements\n\nThe programming language of SAS/IML\
    \ is called IMLPlus. IMLPlus is an extension of SAS/IML that contains additional\
    \ programming features. IMLPlus combines the flexibility of programming in the\
    \ SAS/IML language with the power to call SAS procedures and to create and dynamically\
    \ linked statistical graphs. The IMLPlus language is described in Chapter 5.\n\
    \nThe IMLPlus language is object-oriented. For example, to create a scatter plot,\
    \ you instantiate an object of the ScatterPlot class. To modify the scatter plot,\
    \ you call methods that are in the ScatterPlot class or in any base class. Classes\
    \ and methods are described in Chapter 6; creating an IMLPlus graph is described\
    \ in Chapter 7.\n\nThis appendix presents tables that contain IMLPlus methods\
    \ discussed in this book and also functions that were not explicitly used in this\
    \ book but are also used in practice. This appendix also contains a section that\
    \ summarizes how to submit SAS statements or R statements from SAS/IML Studio."
  merge: -1
  pgno: 432
- img_proc: true
  md: '# C.2 The DataObject Class


    The most important class in the IMLPl language is the DataObject class. The DataObject
    class is used to manage an in-memory copy of data. The DataObject class contains
    methods that query, retrieve, and manipulate the data. The class also manages
    graphical information about observations such as the shape and color of markers,
    the selected of observations, and where observations are displayed in plots or
    are excluded.


    Table C.1 lists frequently used methods in the DataObject class. You can view
    the complete set of DataView methods from the SAS/IML studio online. Choose Help
    ->Help Topics and then expand the IMLPl Class Reference ->DataObject Class section.


    Table C.1 Frequently UsedDataObject Class Methods

    | Method | Description |

    |---|---|

    | AddVar | Adds a new variable to the data object |

    | AddVars | Adds new variables to the data object |

    | Create | Instantiates a data from SAS/IML matrices |

    | CreateFromFile | Instantiates a data from a SAS data set available on the local
    computer |

    | CreateFromR | Instantiates a data from an R frame data |

    | CreateFromServerDataSet | Instantiates a data from a SAS data set in a libref
    |

    | GetNumObs | Returns the number of observations in the data object |

    | GetNumVar | Returns the number of variables in the data object |

    | GetSelectedObservations | Gets the indices of selected observations |

    | GetVarData | Gets the values of a variable |

    | GetVarNames | Gets the names of variables |

    | IncludeInAnalysis | Specifies whether an observation should be included in statistical
    analyses |

    | IncludeInPlots | Specifies whether an observation should be included in IMLPl
    graphs |

    | IsNominal | Returns true if a variable is nominal and false otherwise |

    | IsNumeric | Returns true if a variable is numeric and false otherwise |

    | SelectObs | Selects observations |

    | SelectWhere | Selects observations that satisfy a one-variable criterion |

    | SetMarkerColor | Sets the color of markers that represent an observation in
    a plot |

    | SetMarkerShape | Sets the shape of markers that represent an observation in
    a plot |

    | SetNominal | Specifies that a variable is a classification variable |

    | SetRole | Specifies that a variable is used in a certain role, such as to label
    observations in a plot |

    | SetVarFormat | Sets the SAS format associated with a variable |

    | WriteToServerDataSet | Writes the data into a SAS data set in a libref |

    | WriteVarsToDataSet | Writes the specified variables into a SAS data set in a
    libref |'
  merge: -1
  pgno: 433
- img_proc: true
  md: '# C.3. The DataView Class 429


    # C.3 The DataView Class


    The DataView class is the base class for the DataTable class and the Plot class.
    You cannot instantiate a DataView object, since there is not a “Create” method
    in the class, but you can call methods in this class from any data table and any
    plot.


    The most frequently used methods in this class are related to positioning or showing
    a window. Less common methods include the methods related to action menu, which
    are discussed in Chapter 16, “Interactive Techniques.” Table C.2 lists frequently
    used methods.


    Table C.2 Frequently Used DataView Class Methods


    | Method | Description |

    | ActivateWindow | Displays a window in the foreground |

    | AppendActionMenuItem | Attaches a menu item to a data view. The menu is displayed
    when you press the F1 key |

    | GetDataObject | Returns the data associated with the data view |

    | GetInitiator | Returns the data whose action menu was selected |

    | IsInstance | Determines whether a plot is an object of a certain class |

    | SetWindowPosition | Positions a data view within the main SAS/IML Studio window
    |

    | ShowWindow | Displays |


    You can view the complete set of DataView methods from the SAS/IML Studio Help.
    Choose Help Topics and expand the IMPlus Class Reference DataView section.


    # C.4 The Plot Class


    The Plot class is a base class for all plots. You cannot instantiate a Plot object,
    since there is not a “Create” method in the class, but you can call methods in
    this class from any plot.


    The most frequently used methods in this class are related to modifying plot attributes
    or to draw a plot, as discussed in Chapter 9, “Drawing on Graphs.” You can view
    the complete set of DataView methods from the SAS/IML Studio online Help. Choose
    Help Topics and expand the IMPlus Class Reference DataView section.


    Table C.3 lists methods that are associated with getting and setting properties
    of a graph’s axis. The first argument to each method is a keyword that specifies
    the axis. Valid values are XAXIS, YAXIS, or (in some cases) ZAXIS. Except for
    the SetAxisSizeRange method (which is defined in the Plot2 class), these methods
    are all in the Plot class.'
  merge: -1
  pgno: 434
- img_proc: true
