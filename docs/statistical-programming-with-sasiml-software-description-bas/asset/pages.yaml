    later in the program. A clear format is created by empty the SetVarFormat method.


    A copy of the data is now in the R data frame named df. The following statements
    load the KernSmooth package and compute the smoother:


    ```

    * compute kernel regression by calling an R package */

    YVar = "Budget";

    XVar = "ReleaseDate";

