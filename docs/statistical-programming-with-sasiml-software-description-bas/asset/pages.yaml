  md: '# Running a Program in SAS/IML Studio 11


    # 1.3.5 Running a Program in SAS/IML Studio


    The program in Section 1.3.2 also runs in SAS/IML Studio. The SAS/IML application
    assumes that the program is an IMLplus program, and therefore you do not need
    to use PROC IML statement. In other words, you can run the program in a SAS/IML
    studio window:


    ```

    / convert temps: no need for PROC IML statement in SAS/IML Studio *

    / Celsius = (-40, 0, 20, 37, 100); /* * some interesting temperatures *

    / Fahrenheit = 9/5 * Celsius + 32; /* * convert to Fahrenheit scale *

    / Kelvin = Celsius + 273.15; /* * convert to Kelvin scale */

    ```


    **Programming Tip:** Run programs from SAS/IML Studio do not require the PROC
    IML statement.


    In SAS/IML Studio, you run a program by choosing **Program→Run** from the main
    menu, as shown in Figure 1.6. The keyboard shortcut is to press F5. You can click
    the Run icon (►) beneath the menu. The icon is circled in Figure 1.6. To run a
    portion of a program, you can highlight several statements in the program editor
    and press F5 or click the Run icon; only the highlighted statements will be executed.


    Figure 1.6 Running a Program from the SAS/IML Studio Interface


    ![](img/148549d50632967f185e36a8bcda3de8_16_0.png)


    This book uses the SAS/IML Studio syntax and omits the PROC IML statement. The
    first two chapters of this book describe syntax and features of the SAS/IML language.
    These statements are valid in both PROC IML and IMLPlus. Later chapters introduce
    graphs and features that are not supported by PROC IML.


    **Programming Tip:** Run the programs in this book in SAS/IML Studio. Type the
    statements in a program window and select **Program→Run** or press F5 to run the
    program.'
  merge: -1
  pgno: 16
- img_proc: true
  md: '# 12 Chapter 1: An Introduction to SAS/IML Software


    # 1.3.6 Using SAS/IML Studio for Exploratory Data Analysis


    The SAS/IML Studio provides menus and dialog boxes for point-and-click analysis.
    By the graphical user interface (GUI) you can explore data by using dynamically
    linked statistics. You can use a mouse pointer to select observations in a graph
    or data table. You can choose menus or in dialog boxes to change properties of
    graph, such as the placement of axis ticks or the title of the graph. You can
    change properties of a marker such as the shape and color.


    You can use the menu system to do the following:


    +   - compute descriptive statistics and model the distribution of univariate
    data

    - compute smoothers for bivariate scatter plots

    - fit various regression models, including linear regression, robust regression,
    logistic regression, and generalized linear regression

    - analyze multivariate data with principal component analysis, exploratory factor
    analysis, discriminant analysis, and correspondence analysis


    All of these graphical and built-in analyses are available when you use SAS/IML
    Studio, and all of these GUI techniques are described in the SAS/IML Studio User''s
    Guide.


    Some of the exploratory techniques that are described in the SAS/IML Studio documentation
    are used in this book. They augment and enhance the programming techniques of
    this. Often you will use a program to run an analysis and to create graphs, but
    then you will use interactive techniques to examine the results of the analysis.
    The regression diagnostics presented in Chapter 12, "Regression Diagnostics,"
    are canonical examples of using interactive techniques to examine the fit of a
    statistical model.


    If you are not familiar with the dynamically linked graphs in SAS/IML Studio,
    consider reading Chapters 8–11 of the SAS/IML User''s Guide.


    # 1.4 Who Should Read This Book?


    The goal of this book is to introduce SAS/IML to a wide range of statistical programmers.
    The examples in this book show how SAS/IML and Im programs enable you to analyze
    your data in new and innovative ways. In short, this book intends to show you
    how writing programs in SAS/IML software enables you to implement analytic techniques
    that would be difficult or impossible with other SAS software.


    The audience for this book is analysts and statistical programmers who use SAS/STAT
    procedures and the DATA step to explore and model data. It is also intended for
    programmers who want an introduction to the SAS/IML and ImPlus languages. The
    book does not presume prior knowledge of the SAS/IML language, but does presume
    some familiarity with DATA concepts such as'
  merge: -1
  pgno: 17
- img_proc: true
  md: '# 1.5. Overview of This Book 13


    missing values, formats, and the length of a character variable. The book also
    presumes familiarity with basic statistical ideas as you might encounter by the
    UNIVARIATE, CORR, and GLM procedures. For example, this book discusses quantiles,
    distributions, density estimation, and regression. Only a few sections of the
    book premiere familiarity with basic concepts of linear algebra as matrix multiplication
    and solving a system of linear equations.


    # 1.5 Overview of This Book


    Depending upon your programming background, your knowledge of statistical programming,
    and your experience with SAS, you might be able to skip chapters of this book.
    The following list summarizes each chapter of the book:


    +   **Chapter 2** A basic introduction to the SAS/IML language. The chapter describes
    how to define matrices, core quantities, and call functions and subroutines. It
    describes basic programming statements such as IF-THEN/ELSE and the iterative
    DO statement. If you are an experienced SAS/IML programmer, you can skip this
    chapter.


    +   **Chapter 3** An introduction to using the SAS/IML language in data analysis.
    Even experienced SAS/IML programmers should familiarize themselves with the technique
    presented in the chapter "Analyzing Observations by Categories" on page 68.


    +   **Chapter 4** How to call SAS procedures from a SAS/IML program.


    +   **Chapter 5** An overview of features in SAS/IML Studio that are not found
    in PROC IML.


    +   **Chapter 6–Chapter 7** These chapters introduce IMLPlus classes and describe
    how to create graphs.


    +   **Chapter 8** This chapter describes how to manage data in IMLPlus.


    +   **Chapter 9–Chapter 10** These chapters describe intermediate-level programming
    techniques for modifying graphs, including drawing on graphs and changing the
    color and style of observation markers.


    +   **Chapter 11** How to call R functions and packages from a SAS/IML program.


    +   **Chapter 12–Chapter 14** Applications of SAS/IML programming to selected
    modern statistical topics such as regression diagnostics, simulation and sampling,
    and bootstrap methods.


    +   **Chapter 15** How to measure the time required for an algorithm to run in
    SAS, and also to investigate how time changes with the size or characteristics
    of the data.


    +   **Chapter 16** How to write programs that use interactive features of IMLPlus,
    such as creating dialog boxes and attaching menus to graphs.


    The sections titled "Case Study" describe programs that implement some statistical
    analysis and are longer or more complicated than the simpler examples found elsewhere
    in the book.'
