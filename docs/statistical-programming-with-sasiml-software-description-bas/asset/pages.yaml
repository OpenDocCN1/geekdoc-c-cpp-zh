    (WMF). If no filename is specified, the output is copied to the Windows clipboard.
    No writing occurs until the file is closed.

    2. The dev.off function closes the current graphics device, which results in the
    graph being written to the clipboard.

    3. The contents of the clipboard are pasted into the output document. This is
