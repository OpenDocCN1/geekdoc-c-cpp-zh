  md: "# 15.3. Comparing the Performance of Algorithms 375\n\n# 15.3 Comparing the\
    \ Performance of Algorithms\n\nSome algorithms are more efficient than others.\
    \ For example, the previous section showed that less time is required to solve\
    \ a linear equation by using the SOLVE function than by using the INV function.\
    \ You can use this timing technique to compare the performance among different\
    \ algorithms. For example, Chapter 13, “Sampling and Simulation,” describes several\
    \ algorithms for sampling and simulation, and mentions some that are faster than\
    \ others.\n\nThis section describes how to compare two or more algorithms and\
    \ how to investigate how algorithms perform as you modify modifications of the\
    \ data in a systematic manner. However, you should keep in mind that sometimes\
    \ there is a trade-off between speed and accuracy or ease-of-programming. How\
    \ an algorithm runs is only one criterion in determining the best way to write\
    \ a statistical program.\n\n# 15.3.1 Two Algorithms That Delete Missing Values\n\
    \nSection 3.3.4 describes how to remove missing values from a SAS/IML vector.\
    \ The SAS/IML program that creates Figure 3.11 consists of two steps: find observations\
    \ in a vector that are not missing, and use an alternative way to form a vector\
    \ of the missing values: find the observations that are missing, and use the REMOVE\
    \ function to create the vector from deleting them.\n\nThe following statements\
    \ define two SAS/IML modules that perform the same task: given a vector x of length\
    \ n that contains k missing values, return the vector, y, of length n - k results\
    \ from deleting the missing values from x. These modules will be used to illustrate\
    \ how to time algorithms and profile.\n\n```\n* Remove missing values from a vector.\
    \ */\n/* Investigate the relative speeds of each algorithm. */\n/* Algorithm 1:\
    \ use subscripts to remove missing values */\nstart DeleteMissBySubscript(x);\n\
    \  do i = 1 to 100                    /* repeat computation 1000 times */\n  \
    \  idx = loc(x=.);                   /* find elements NOT missing */\n    if ncol(idx)>0\
    \ then\n      y = x[idx];                   /* extract them */\n  end;\n  return\
    \ ( y );\nfinish;\n```\n\n```\n/* Algorithm 2: use the REMOVE function to remove\
    \ missing values */\nstart DeleteMissByRemove(x);\n  do i = 1 to 100         \
    \           /* repeat computation 1000 times */\n    idx = loc(x=.);         \
    \          /* find elements that ARE missing */\n    if ncol(idx)>0 then\n   \
    \   y = remove(x, idx);           /* remove them; assign what is left */\n  end;\n\
    \  return ( y );\nfinish;\n```"
