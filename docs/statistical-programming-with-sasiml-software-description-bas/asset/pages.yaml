  md: "# 9.5 Case Study: A Module to Draw a Rug Plot on a Graph\n\nSection 6.11 shows\
    \ how you can define a module that accepts an object of the Plot class. Because\
    \ the Plot class is the base class for multiple graph types, you can call the\
    \ module on a wide variety of graphs: scatter plots, bar charts, and so on.\n\n\
    It is also possible to write a module that examines the typing of the incoming\
    \ object and methods based on whether the object is a member of a specific derived\
    \ class. For example, suppose you want to draw little tick marks that indicate\
    \ the distribution of the X variable in the distribution of histograms and scatter\
    \ plots, as in Figure 9.18. (This is sometimes called a “rug plot.”) This sounds\
    \ relatively simple, but there are some implementations to consider:\n\n+   *\
    \ How the module determine if a graph is an object of the Histogram or ScatterPlot\
    \ class? The answer is the Instanceof of the DataView class true if the argument\
    \ to the method is an object of a specified class\n\n+   * What should the module\
    \ draw if a variable in the scatter plot is a nominal? In this case, the following\
    \ module returns without drawing the plot.\n\n+   * The scatter plot has, by default,\
    \ a nonzero margin at the bottom of the area, whereas the histogram does not.\
    \ How does that affect the placement of the tick marks for the rug plot? The following\
    \ module overlays tick marks on the histogram bars, but for a scatter plot it\
    \ draws the ticks in the plot margin\n\nThe following statements implement the\
    \ RugPlot module, which adds a rug plot to a histogram or a scatter plot:\n\n\
    ```\n/* argument of module can be scatter plot or histogram */\nstart RugPlot(Plot2D\
    \ p);\n/* draw a \"rug plot\" for the X variable */\nif !Histogram.IsInstance(p)\
    \ &\n    !ScatterPlot.IsInstance(p) then\n    return;\n/* 1 */\n\ndeclare DataObject\
    \ dobj;\ndobj = p.GetDataObject();\np.GetVars(ROLE_X, xName);\ndobj.GetDataVar(xName,\
    \ x);\n/* 2 */\n/* 3 */\n/* 4 */\n\n/* for scatter plot, check for nominal variables\
    \ */\\nif ScatterPlot.IsInstance(p) then do;\n    p.GetVars(ROLE_Y, yName);\n\
    \    if dobj.IsNominal(xName) |\n        dobj.IsNominal(yName) then\n        \
    \    return;\n/* 5 */\nend;\n\np.GetAxisViewRange(YAXIS, yMin, yMax);\n/* 6 */\n\
    ```"
  merge: -1
