    \ the performance of a program, use the TIME function to profile the program.\
    \ After you identify the blocks of code that use the most time, you can try to\
    \ improve the performance of those blocks.\n\nAfter you identify the portion of\
    \ the program that takes the most time, you can focus on optimizing that portion.\
    \ Sometimes you can improve performance by rewriting the way that you implement\
    \ an algorithm; in the previous program, you can replace the INV function with\
    \ a call to the SOLVE function to dramatically decrease the running time, as shown\
    \ in Figure 15.2.\n\n```\n/* measure time spent solving linear system with the\
    \ SOLVE function */\nt0 = time(); /* begin SOLVE */\nb = solve(x, y); /* solve\
    \ linear equation directly */\nt3 = time() - t0; /* end timing */\nprint \"Elapsed\
    \ time SOLVE: %n=1000:\", t3;\n```\n\nFigure 15.2 Time Required to Solve a Linear\
    \ System with the SOLVE Function\n\n| Elapsed time SOLVE (n=1000): | |\n|---|---|\n\
    | 1.312 |\n\nFigure 15.2 shows that the SOLVE function solves the linear system\
    \ in about 40% of the time for the INV function.\n\n**Programming Technique:**\
    \ The statements show how you can use the TIME function to determine the length\
    \ of time for a computation:\n\n```\nt0 = time(); /* begin timing */\n/* - put\
    \ the computation here - */\nElapsedTime = time() - t0; /* end timing */\n```\n\
    \nYou can use this to determine the length of time for most computations. Under\
    \ the Windows operating system, this technique is limited to computations taking\
    \ more than 15 milliseconds. This is the frequency at which the Windows operating\
    \ system updates a certain time stamp (see Nilsson (2004) and references therein).\
    \ Consequently, on Windows operating system the TIME function returns the time\
    \ of day to the nearest 15 milliseconds.\n\nFor example, you can try to time how\
    \ long it takes to solve a linear system with 50 rows and columns by setting n=50\
    \ in the previous program. The resulting output is shown in Figure 15.3:"
