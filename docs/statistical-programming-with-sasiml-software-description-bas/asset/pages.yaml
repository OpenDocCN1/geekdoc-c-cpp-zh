    # 11.7 Calling R Packages


    Because the SAS/IML language (like the R language) is a matrix-vector language
    with a rich library of statistics, the SAS/IML programmer will not typically need
    to use R for basic computations. Both languages enable the programmer to iterate,
    locate certain elements in a matrix, and so on. However, as mentioned previously,
    R supports packages that add functionality in specialized areas of statistics.
    The SAS programmer might want to call these packages from a SAS/IML program in
    order to take advantage of these computational methods.


    This section describes how to functions in a package from SAS/IML programs. The
    package used in this section is the *KernSmooth* package by M. Wand, which implements
    kernel smoothing that are associated with the core *Kernel Smoothing* (Wand and
    1995).


    In the 1970s, "kernel regression" became a popular method for smoothing a scatter
    plot. In kernel regression, the prediction at a point *x* is determined by a weighted
    mean of *y* values near *x*, with the weight given by a kernel function such as
    the normal distribution. The bandwidth of the kernel determines how much weight
    is given to points near x. This is similar to loess regression, except kernel
    regression uses all observations within a certain distance from x, whereas loess
    uses a fixed number of neighbors regardless of their distance.


    SAS/STAT software does not have a procedure that computes kernel regression, so
    this is a good candidate for an R package to compute a kernel estimator. Furthermore,
    the KernSmooth package is distributed with the R distribution as a “recommended”
    package, so you do not need to download this package from CRAN.


    # 11.7.1 Installing a Package


    For packages that are not contained in the core R distribution, the R Project
    Web site (http://cran.r-project.org/web/packages/) gives instructions for installing
    packages. The R software contains commands that automatically download and install
    packages. You can also install a package manually if the automatic installation
    does not succeed.


    # 11.7.2 Calling Functions in a Package


    Calling a function in a package is easy. First, load the package into R by using
    the **library** function in R. Then call any function in the package. The example
    in this section uses the **KernSmooth** package, which is distributed with the
    core R software. Be aware that the **KernSmooth** functions'
