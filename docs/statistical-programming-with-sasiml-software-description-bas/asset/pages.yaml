    SAS/STAT software to carry out the resampling portion of the bootstrap method.
    You can call any SAS procedure to compute the statistics.


    > **Programming Tip:** You can call SAS procedures as part of the bootstrap computation.
    This is especially useful when the statistic that you are bootstrapping is itself
    computed by SAS procedures.


    # 14.4.1 Resampling by Using the SURVEYSELECT Procedure


    Some programmers use the DATA step for everything, generating random samples from
    data. The DATA step can sample reasonably fast. But it is even faster to use the
    SURVEYSELECT procedure for generating a random sample.


    The SURVEYSELECT procedure can generate B random samples of the input data, and
    there is ideal for bootstrap resampling (Cassell 2007, 2010; Winkler 2008). It
    implements many different sampling techniques, but this section focuses on random
    sampling with replacement. The SURVEYSELECT procedure refers to "sampling with
    replacement" as "unrestricted random sampling" (URS).


    As an example, suppose your data consists of four values: A, B, C, and D. The
    following statements create a data set BootIn that contains the data:


    ```

    /* create small data set */

    x = {A,B,C,D};

    create BootIn var ("x");

    append;

    close BootIn;

    ```


    Suppose you want to generate B bootstrap resamples from the data in the BootIn
    data set. The following statements use the SUBMIT statement to call the SURVEYSELECT
    procedure and to pass in two parameters to the procedure. The procedure reads
    data from BootIn and writes the resamples into the BootSam data set.


    ```

    /* Use the SURVEYSELECT procedure to generate bootstrap resamples */

    n = nrow(x);

    b = 5;

    ubmit B;

    proc surveyselect data=BootIn out=BootSam noprint

    seed = 12345 /* * 1 */

    method = urs /* * 2 */

    n = &N /* * 3 */

    rep = &B /* * 4 */

    OUTPUTS/* * 5 */

    run;

    endsubmit;

    ```


    The following list describes the options to the SURVEYSELECT procedure:


    +   1. Set the seed for the random number generator used by the SURVEYSELECT procedure.'
