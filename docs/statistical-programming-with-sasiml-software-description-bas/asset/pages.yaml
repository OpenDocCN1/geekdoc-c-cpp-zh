    # 6.11 Using a Base Class in a Module


    The signature of the module argument determines what kind of object can be passed
    to it. If you want to accept several different kinds of graphs, it is often useful
    to specify that the module argument is an object of the Plot class. Because Plot
    is a base class for all classes, the module argument on any graph provided that
    the module calls only methods in the Plot class. For example, the following statements
    define a module with a Plot parameter and then call the module twice, once with
    a scatter plot and once with a bar chart.


    ```

    /* define what module argument is a base-class object */

    start ConfigPlot(Plot p)

    np.ShowReferenceLines();

    np.SetAxisLabel(XAXIS, AXISLABEL_VARIABLE);

    np.SetAxisLabel(YAXIS, AXISLABEL_VARIABLE);

    finish;

    ```'
