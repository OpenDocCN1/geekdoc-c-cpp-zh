    # 14.3 Comparing Two Groups


    In the previous example, you can replace the mean statistic with any other statistic
    such as the variance or a trimmed mean. If you choose a set of variables in the
    Sample data set, you can bootstrap the standard errors and confidence intervals
    for regression coefficients or correlation coefficients.


    You can also use the bootstrap method to compare statistics between two subpopulations.
    For example, you can compare the mean budgets of PG-13 and the R-rated movies
    in the Sample data set and ask whether they are significantly different. The statistics
    are straightforward:


    +   1. Given two groups, resample B times from each group (with replacement) to
    form bootstrap samples.

    2. Compute the difference between the means for each of the B resamples. This
    creates the bootstrap distribution for the difference of means.

    3. Determine whether the 95% percentile confidence intervals contain zero. If
    so, conclude that there is no evidence that the means of the two groups are different.


    The following statements compute the bootstrap estimate:


    ```

    / compute bootstrap estimate for difference between means of two groups */

    use Sample (MPAARating="PG-13\ /* read data from group 1 */

    read all (Budget) into x1;

    use Sample (MPAARating="R\ /* read data from group 2 */

    read all (Budget) into x2;

    close Sample;


    /* 1. compute bootstrap distribution for difference between means */

    call randseed(12345);

    load module=SampleWithReplace; /* not required in IMLPlus */

    B = 1000;

    ```'
