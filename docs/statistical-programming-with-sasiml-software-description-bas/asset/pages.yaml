    # 3.5.3 Case Study: Standardizing the Columns of the Matrix


    The CorrCoef in the section “Defining SAS/IML Modules” on page 72 calls the standard
    module in the IMLMIB library library. This section describes how you can write
    statements that reproduce the results of that module.


    The following statements standardize each column in a numeric format to mean zero
    and unit standard deviation:


    ```

    /* standardize data: assume no missing values and no constant column */nx = [7,
    7, 8, 9, 7, 5, 7, 8];

    cc = x - xc(:,:); /* 1. center the data */nss = xc**[]; /* 2. sum of squares for
    columns of xc */nn = row(xc); /* 3. assume no missing values */nstd = sqrt(ss/(n-1));
    /* 4. sample standard deviation */nstd_x = xc / std; /* 5. divide each column
    (standardize) */

    print std_x;

    ```


    The output from the program is in Figure 3.23. Each statement is explained in
    the following list:


    +   1. The row vector x[:,:] contains the mean of each column of x. Consequently,
    the matrix xc contains the centered data: the mean of column is subtracted from
    the data in that column.


    +   2. The row vector ss contains the sum of squares for each centered column.


    +   3. Assuming that there are no missing values, the scalar quantity n contains
    the number of nonmissing values in each column.


    +   4. The row vector std contains the standard deviation of each column. Each
    element of std is nonzero, provided that no column of x is constant (that is,
    contains the same value for all observations).


    +   5. The matrix std_x contains the standardized results from dividing the matrix
    xc by the row vector std.


    Figure 3.23 Standardized Columns of a Matrix


    | std_x |

    |---||

    | 0 | -1 |

    | 0.8164966 | 1 |

    | 0 | 1 |

    | -1.632993 | -1 |

    | 0.8164966 | 0 |


    You can relax the assumption that the data do not contain missing values: count
    the number of nonmissing observations in each column and compute the standard
    deviation for each column using the number of nonmissing values for that column.
    This is left as an exercise for the reader.'
