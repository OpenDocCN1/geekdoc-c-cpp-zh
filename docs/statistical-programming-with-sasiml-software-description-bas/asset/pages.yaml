  md: '# 10.2 Changing Marker Properties


    The shape and color of observation markers can be used to visually indicate the
    value of a third variable that does not appear on the graph. The shape of a marker
    often encodes the value of a categorical variable with a small number of categories,
    whereas color often encodes the value of a continuous variable. For example, if
    you have data about patients in a drug trial, you might want to use shape to represent
    male versus female, or to distinguish individuals in a test group from individuals
    in the control group. In the same study, you might use color to indicate a continuous
    variable such as the age or weight of a patient.


    This section describes how to use methods in the DataObjectClass to set properties
    for markers based on values of other variables.


    # 10.2.1 Using Marker Shapes to Indicate Values of a Categorical Variable


    Suppose that you want to set the shape of markers to reflect the MPAA rating of
    movies in the Movies data set. For definiteness, suppose you want to create a
    scatter plot of the US_Gross variable versus the ReleaseDate variable for the
    data in the Movies data set. You decide to encode the marker shapes according
    to the following table:


    Table 10.1 Movie Ratings, Marker Symbols, and IMPlus Constant

    | MPAA Rating | Symbol | IMPlus Constant |

    |---|---|---|n| G | □ | MARKER_SQUARE |

    | NR | × | MARKER_X |

    | PG | △ | MARKER_TRIANGLE |

    | PG-13 | + | MARKER_PLUS |

    | R | ▽ | MARKER_INTRIANGLE |


    The last column in the table is the IMPlus constant that specifies a marker shape
    in the SetMarkerShape of the DataObjectClass. The SetMarkerShape method enables
    you to specify the marker shape to use when plotting observations. The following
    program finds the observations that are associated with each MPAA rating category
    using the technique presented in Section 3.3.5.


    ```

    /* use marker shape to encode category */

    declare DataObject dobj;

    dobj = DataObject.CreateFromServerDataSet("Sasuser.Movies");

    dobj.SetRoleVar(ROLE_LABEL, "Title");

    /* * 1 */

    ```'
  merge: -1
