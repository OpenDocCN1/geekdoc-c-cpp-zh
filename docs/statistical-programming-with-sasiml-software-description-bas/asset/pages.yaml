    a character variable.)


    **Programming Technique:** The following statements sort the values of a vector
    u according to the values of a numeric vector x:


    ```

    r = rank(x);                              /* compute permutation that sorts x
    */

    sorted_u = u;                           /* same dim and attributes (num/char)
    as u */

    sorted_u[r] = u;                        /* permute categories into sorted order
    */

    ```


    The statements correctly sort u regardless of whether u is numeric or character,
    or whether it is a row vector or a column vector.


    # 10.4 Selecting Observations


    Selecting observations in IMLPlus graphics is a major reason to use SAS/IML Studio
    in data analysis. You can discover relationships among variables in your data
    by selecting observations in one graph and seeing those same observations highlighted
    in other graphs.'
  merge: -1
  pgno: 246
- img_proc: true
  md: '# 242 Chapter 10: Marker Shapes, Colors, Other Attributes of Data


    You can select observations interactively by clicking on a bar or by using a selection
    rectangle to select several observations in a scatter plot. However, sometimes
    it is useful to select observations by running a program. Selecting observations
    with a program can be useful if the criterion that the selected observations is
    complicated. It is also useful for selecting observations during a presentation
    or as part of an analysis that you run frequently, or for highlighting observations
    that have missing values in a certain variable.


    The following program selects observations in a data object created from the Movies
    data set for which the World_Gross variable has a missing value:


    ```

    / select observations containing a missing value for a variable */

    declare DataObject dobj;

    dobj = DataObject.CreateFromDataSet("Sasuser.Movies")

    dobjj.GetVarData("World_Gross", wGross);

    / find observations with missing values */

    idx = loc(wGross.)

    if ncol(idx)>0 then

    dobjj.SelectObs(idx);

    ```


    The SelectObs method selects observations. The observation numbers are specified
    by the first argument to the method. The SelectObs method has an optional second
    argument that specifies whether to deselect all observations prior to selecting
    new observations. By default, new selections do not deselect any existing selections,
    so you can call the SelectObs method several times to build up the union of observations
    that satisfy any of several criteria. For example, the following statements (which
    continue the preceding program) find all movies for which the world gross revenues
    are more than ten times the US revenue. These movies (which did far better internationally
    than in the US) are added to the set of selected observations:


    ```

    / select observations that satisfy a formula */

    dobj.GetVarData("US_Gross", usGross);

    idx = loc(wGross>10*usGross);

    if ncol(idx)>0 then

    dobj.SelectObs(idx); /* add to previous selection */

    ```


    The results of the previous statements are shown in Figure 10.11. The size of
    the observed observations is increased relative to the unselected observations
    so that they are more visible. You can increase the size difference between selected
    and unselected observations by clicking ALT+UP ARROW in the plot. As SAS/IML Studio
    3.3, there is no method to increase this size difference.'
  merge: -1
  pgno: 247
