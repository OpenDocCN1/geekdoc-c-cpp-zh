  md: '# 374 Chapter 15: Time Computations and the Performance of Algorithms


    Figure 15.3 Time to Solve a $50 \times 50$ Linear System


    | Elapsed time SOLVE (n=50): | t3 |

    | --- | --- |

    | 0 |


    Because the TIME function measures the time of day to the nearest 15 milliseconds,
    a computation finishes too quickly, the interval between calls to the TIME function
    is too short to measure, as shown in Figure 15.2. A solution to this problem is
    to repeat the computation many times (say, 1000 times) so that the total elapsed
    time is large enough to measure, as shown in the following statements:


    ```

    /* measure time solving linear system 1000 times */

    n = 50; /* size of Matrix */

    x = rannor(n, n, 1); /* n x n matrix */

    y = rannor(j, n, 1); /* n x 1 vector */


    nt0 = time(); /* begin timing */

    doi i = 1 to 1000; /* repeat computations many times */

    b = solve(x, y); /* solve linear equation directly */

    end;

    t3 = time() - nt0; /* end timing */

    print "Elapsed time 1000 SOLVE (n=50):\", t3;

    print "Average time for SOLVE (n=50):\", t3/1000);

    ```


    Figure 15.4 Time Required to Solve a $50 \times 50$ Linear System 1000 Times


    | Elapsed time 1000 SOLVE (n=50): | t3 |

    | --- | --- |

    | 0.141 |

    | Average time for SOLVE (n=50): | 0.000141 |


    The elapsed time for solving $50\times 50$ linear system 1000 times is shown in
    Figure 15.4. If necessary, you can determine the average time required for each
    solution by dividing the cumulative times by 1000.


    **Programming Tip:** When timing a computation that does not take very long (for
    example, less than 0.1 seconds), repeat the computation many times and measure
    the total elapsed time. The average time more accurately represents the true time
    required for each computation.'
