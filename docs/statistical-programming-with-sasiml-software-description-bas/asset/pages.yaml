    # 13.9 Case Study: The Birthday Matching Problem for Real Data


    It is interesting to examine one of the main assumptions of the birthday matching
    problem, namely, are birthdays really distributed uniformly throughout the year?


    This is discussed briefly in Trumbo, Suess, and Schupp (2005), and the article
    notes that data for US births are available from the National Center for Health
    Statistics (NCHS) at the Centers for Disease Control and Prevention (CDC) Web
    site. The data for live US births by day in 2002 is available in the data set
    Birthdays2002.


    > **Programming Tip:** Simulation enables you to estimate probabilities for which
    an exact solution is difficult or complicated.


    # 13.9.1 An Analysis of US Births in 2002


    Figure 13.20 shows data for the 4,021,726 live births for the year 2002. The mean
    number of live births each day in 2002 was 11,018, and the plot shows the percentage
    of births for each day, relative to the mean: $100 \times \text{births}/(\text{mean
    births})$. The NCHS calls this quantity the *index of occurrence_*. The data range
    from a minimum value of 6,629 births (an index of about 60) on 25DEC2002, to a
    maximum value of 13,982 births (an index of 127) on 12SEP2002.'
