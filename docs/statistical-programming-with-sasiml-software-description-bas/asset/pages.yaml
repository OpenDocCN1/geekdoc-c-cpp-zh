    | 116.76681 |


    The value for the mean (116.77) is wrong. Missing values are the reason. The SUM
    function skips values as it adds the elements in the World_Gross vector, but the
    NOW function counts all of the rows, even with those missing values.


    There are two ways to get the correct answer: use functions that account for the
    missing values, delete the missing values from the data. There are several functions
    that account for missing values, as shown in the following statements:'
