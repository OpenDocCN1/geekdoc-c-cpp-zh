    # 16.1 Overview of Interactive Techniques


    This chapter describes IMLPlus features that enable programmers to add interactive
    features to IMLPlus programs. This includes the following:


    +   * pausing a program so the person who is running the program can interact
    with the data

    * attaching a menu to a graph that calls a module when the menu is selected

    * creating dialog boxes that prompt the user for input


    # 16.2 Pausing a Program to Enable Interaction


    The PAUSE statement is described in Section 5.9.4. By default, when the PAUSE
    statement is executed, the Auxiliary Input window appears. However, if the text
    string in the PAUSE'
  merge: -1
  pgno: 390
- img_proc: true
  md: '# 386 Chapter 16: Interactive Techniques


    begins with the word "NoDialog"; then the Auxiliary Input window is not displayed,
    but the program pauses its execution. The remainder of the message is displayed
    in the SAS/IML Studio status bar, which is located in the lower left corner of
    the SAS/IML Studio application.


    When a program is paused, you can still interact with the SAS/IML Studio GUI.
    In particular, you can interact with plots and data tables, which means you can
    select the selected observations. Consequently, when the program resumes, the
    program can select the observations and use them in computation. Alternatively,
