  md: '# 14.3. Comparing Two Groups 357


    ```

    n1 = nrow(x1)

    n2 = nrow(x2)

    EQUAL = . ;

    /* resample B times * */

    Boot1 = SampleWithReplace(x1, B|n1, EQUAL); /* from each group */

    Boot2 = SampleWithReplace(x2, B|n2, EQUAL); /* difference of means */


    /* 2. difference between the B means computes for each resample */

    s1 = Boot1[,]; /* means of B resample from x1 */

    s2 = Boot2[,]; /* means of B resample from x2 */

    s = s1 - s2; /* difference of means */


    /* 3. Compute bootstrap estimate for 95% C.I. */

    alpha = 0.05;

    prob = alpha/2 || 1-alpha/2;

    call qnt(CIBoot, s, prob);

    print CIBoot;

    ```


