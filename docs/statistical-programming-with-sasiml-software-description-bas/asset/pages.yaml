    \ 436\n\n# ## D.1 Overview of SAS/IML 9.22 Modules\n\nThis book presents a few\
    \ examples that use functions that were introduced in SAS/IML 9.22. If you have\
    \ not yet upgraded to SAS/IML 9.22 or SAS 9.3, you might want to define and run\
    \ the following modules, which implement portions of the functionality of the\
    \ MEAN and VAR functions and the QNTL subroutine.\n\nThe function definitions\
    \ will fail if you are running SAS/IML 9.22 or later because the SAS/IML language\
    \ does not permit you to redefine built-in functions.\n\n# ## D.2 The Mean Module\n\
    \n```\n/* Mean: return sample mean of each column of a data matrix */\n/* For\
    \ this module\n  * x is a matrix that contains the data\n */\nstart Mean(x);\n\
    \  mean = x[:];\n  return { mean };\nfinish;\n```"
