    > Programming Tip: You can write an R graph to the Windows clipboard and paste
    the graph to the SAS/IML Studio output window.


    The statement that uses the OutputDocument class might look strange to readers
    who are not experienced with object-oriented programming techniques. The following
    statements might look more familiar, but are equivalent:


    ```

    declare OutputDocument doc;

    doc = OutputDocument.GetDefault();ndoc.PasteGraphic(GRAPHICTYPE_WMF);

    ```


    This formulation declares that doc is an object of the OutputDocument class. The
    OutputDocument class enables you to programmatically control a SAS/IML Studio
    output window. The GetDefault method returns the current output document if it
    exists, or creates a new output document if one does not exist. The second formulation
    is preferred when you intend to use the output document several times. The shorthand
    in the module is sometimes used to save typing when you only call a single OutputDocument
