    \ LogUS_Gros = LogBudget AANomin / solution;\n  output=CLMout2\n    PE= CLM LCLM\
    \ UCLM UCLM  /* predictions and CLM */\n    RSTUDENT=ExtStudr                \
    \     /* student residuals */\n    COOKD=CookD HLeverage;                  /*\
    \ influence diagnostics */\n```\n\nNotice that you need to include the SOLUTION\
    \ option on the MODEL statement if you want to see the parameters estimates.\n\
