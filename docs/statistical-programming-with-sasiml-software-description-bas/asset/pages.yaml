  md: '# 15.3.2 Performance as the Size of the Data Varies


    A common question in statistical programming "How does the time required by an
    algorithm scale with the size of the input data?” To answer this question, you
    can systematically increase the size of the input data and graph the time required
    by an algorithm as a function of the data size. The graph will indicate whether
    the time required by your implementation is linear in the size of the data, quadratic,
    or has some other relationship.


    The time required to run the DeleteMissBySubscribe and DeleteMissByRemove modules
    certainly depend on the length of the input vector x: more data means more time
    is required to search for delete missing values. Figure 15.6 shows the relationship
