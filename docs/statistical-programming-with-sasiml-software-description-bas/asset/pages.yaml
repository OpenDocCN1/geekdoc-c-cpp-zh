    # 3.3.2 Locating Observations That Satisfy a Criterion


    A frequent task in data analysis is to locate observations that satisfy some criterion.
    For example, you might want to locate all of the males in your data, or all of
    the events that happened prior to some target. The LOC function is the key to
    efficiently finding these observations.


    Many experienced SAS programmers are not familiar with the LOC function. That
    is unfortunately, because it is a powerful function. The reason for its obscurity
    is that it does not have an analogue in the DATA step. Or perhaps the SAS/IM documentation
    is partly to blame, since the documentation states that the LOC function "finds
    nonzero elements of a matrix". The casual reader can be for overlooking the power
    of a seemingly blind function.


    The power of the LOC function is best understood by looking first at the SAS/IML
    comparison operators (less than, equal to, greater than, and so forth) as described
    in the section "Comparison Operators" on page 36. The SAS/IML comparison operators
    create a matrix of zeros and ones,'
