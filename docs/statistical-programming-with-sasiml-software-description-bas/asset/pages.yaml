    # 6.9. The DataView Class: A Base Class for Graphs and Tables


    The DataView class is the base class for the DataTable and the Plot class. You
    cannot instantiate a DataView object, but you can call methods in this class from
    any data table and any graph.


    The most used methods in this class are related to positioning or showing a window.
    Less common methods include the methods related to action menu, which are discussed
    in Chapter 16, "Interactive Techniques.\ Appendix C lists used methods for the
    DataView.


    # 6.10 Passing Objects to IMLModules


