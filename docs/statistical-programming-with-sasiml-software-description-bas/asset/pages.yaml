- img_proc: true
  md: '# 5.11. Differences between IMLPlus and the IML Procedure 127


    Another major difference is that IMLPlus programs do not intrinsically support
    SAS System global statements. For example, the following statements are not supported
    in IMLPlus:


    +   - Global SAS statements as LIBNAME, FILENAME, and TITLE.


    +   - The OPTIONS statement.


    +   - The ODS statement.


    +   - Macro language statements. This includes using %let to define macro variables
    and using %macro to define macro functions, in addition to making calls to macro
    functions. Use the SYMGET and SYMP functions in Base SAS software to create macro
    variables from SAS/IML matrices, and vice versa.


    You can still use these statements provided that you use them in a SUBMIT block.
    You can also submit these statements by using the @ symbol, as described in Chapter
    3, “Programming Techniques for Data Analysis."


    **Programming Tip:** In IMLPlus, you can submit a single SAS statement (for example,
    a global statement such as a LIBNAME, OPTIONS, or ODS statement) by preceding
    the statement with the @ symbol. For example, the following statement is valid
    in IMLPlus:


    ```

    @ods trace on;

    ```


    IMLPlus does not support PROC IML low-level drawing routines such as GSTART, GOPEN,
    GPOLY, GPOINT, and GSHOW. Instead, IMLPlus provides high-level statistical graphs
    such as scatter plots, histograms, and box plots. IMLPlus also provides methods
    for drawing markers, lines, polygons, text, and other graphical objects on a plot.
    Section 9.10 provides a comparison between drawing in IMLPlus and drawing in PROC
    IML.'
  merge: -1
