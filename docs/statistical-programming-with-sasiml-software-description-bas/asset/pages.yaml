    \ as sampling with equal probability. Alternatively, you could have a jar that\
    \ contains marbles of various colors. The probability of pulling a particular\
    \ color is equal to the proportion of marbles of color. This is known as sampling\
    \ with unequal probabilities.\n\nA random sample is a sample of n elements that\
    \ chosen randomly from a population according to some scheme. If a given element\
    \ can be selected more than once, the scheme is known as random sampling with\
    \ replacement; otherwise, the scheme is known as random sampling without replacement.\
    \ The term \"replacement\" means drawing a particular element does not change\
    \ the probability of choosing that element for the next. A classic example is\
