    # 14.4.2 Computing Bootstrap Statistics with a SAS Procedure


    The preceding section described how to use the SURVEYSELECT procedure to generate
    B bootstrap resamples. This section shows how to use the BY statement (and, if
    desired, the FREQ statement) of a SAS procedure to generate the bootstrap distribution
    of a statistic.


    This section duplicates the example in Section 14.2.2 creating a bootstrap distribution
    for the mean statistic. However, instead of computing the means of each resample
    in the SAS/IM language, use the MEANS procedure to do the same analysis.


    Assume that the data set contains the Budget variable for a subset of movies,
    as described in Section 14.2.2. The following program uses the SURVEYSELECT procedure
    to generate bootstrap resamples and uses the MEANS procedure to generate the bootstrap
    distribution for the mean statistic:'
  merge: -1
