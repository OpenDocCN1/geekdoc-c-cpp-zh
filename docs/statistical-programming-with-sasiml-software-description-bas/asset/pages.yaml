    # 12.10 Viewing ODS Statistical Graphics


    Many of the SAS procedures can produce their own diagnostic plots by using ODS
    statistics. These plots are not dynamically linked to each other, but still can
    help you to analyze the fit of a statistical model.


    The output window in SAS/IML Studio displays the listing destination for Tables.
    As of SAS/IML Studio 3.3, there is not a way to display HTML output from SAS procedures
    within SAS/IML Studio. However, if SAS/IML Studio and SAS Foundation are both
    running on the same PC, you can easily write the HTML output to a file, and use
    a Web browser to view the tables and graphs.


    The following program demonstrates this. Suppose you want to create and view the
    ODS graphics that are produced by the REG procedure. One way to do this is to
    specify a Windows path and file name (say, Output.html) for the ODS output on
    the ODS HTML statement. You can run one or more procedures and view the HTML output
    (including any graphs that you requested) by opening the Output.html file in a
    browser. You can use the Windows operating system to navigate to the file and
    open it, or programmatically launch a browser to view the file, as shown in the
    following example:


    ```

    /* write ODS output (including graphics) to HTML */

    run GetPersonalFilesDirectory(path);

    htmlfile = "Output.html";

    ```'
