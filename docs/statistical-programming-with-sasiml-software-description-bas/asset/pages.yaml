    # 1.1 Overview of the SAS/IML Language


    The IML stands for "interactive matrix language." The SAS/IML language enables
    you to read data into vectors and matrices to quantify these computations using
    high-level-vector computations. The language enables you to formulate and solve
    mathematical and statistical problems by using functions that are similar to those
    found in textbooks and in research journals. You can write programs that analyze
    and visualize data or implement custom algorithms that are not built into any
    SAS procedure.


    The SAS/IML language contains over 300 built-in functions and subroutines. There
    are also hundreds of functions in Base SAS software that you can call. These functions
    provide the building blocks for writing statistical analyses. You can write SAS/IML
    programs by using either of two SAS products: the IML procedure (also called PROC
    IML) and the SAS/IML Studio application. These two products are discussed in Section
    1.3.'
  merge: -1
