- img_proc: true
  md: '# 9.2.1 Drawing a Legend


    You can use the DrawLegend to associate markers or lines in a graph with descriptive
    text. For example, the following statements extend the ideas in Section 8.7 to
    create a scatter plot in which hybrid-electric vehicles are represented by markers
    of one shape and color, whereas traditional gasoline engines are represented by
    another shape and color:


    ```

    / set markers shape and color based on whether hybrid-electric */

    declare DataObject dob;

    dobj = DataObject.CreateFromServerDataSet("Sasuser", "vehicles");


    /* traditional = black circle; hybrid = blue star */

    dobj.GetVarData("Hybrid", h);

    dobj.SetMarkerShape(loc(h=h), MARKER_CIRCLE);

    dobj.SetMarkerShape(loc(h=1), MARKER_STAR);

    dobj.SetMarkerColor(loc(h=1), BLUE);

    ```


    ```

    declare ScatterPlot p;

    p = ScatterPlot.Create(dob, "Mpg_City", "Mpg_Rwy");

    p.SetMarkerSize(6);

    ```


    You can use the Plot.DrawPenAttributes and Plot.DrawLine methods to add regression
    lines to the graph, as shown in Section 9.4. The final graph is shown in Figure
    9.13. Although the person that created this graph would have problem understanding
    it, it needs a legend if it is going to be understood by others who do not know
    which observations represent hybrid-electric vehicles.


    Figure 9.13 A Scatter Plot with Multiple Marker Shapes and Line Styles


    ![](img/148549d50632967f185e36a8bcda3de8_209_0.png)'
  merge: -1
  pgno: 209
- img_proc: true
  md: '# Drawing a Legend 205


    The DrawLegend module has several arguments. The syntax is:


    ```

    DrawLegend(Plot plot, Labels, Size, Color, Style, Symbol, BGColor, Loc);

    ```


    The first argument specifies the Plot object on which to draw the legend. The
    Labels argument specifies the entries in the legend, and the Size argument determines
    the size of the text. The next three arguments determine the line color, linestyle,
    and symbol shape of graphical elements that are associated with each text item.
    The BGColor argument determines the fill-color of the rectangle that defines the
    legend, or you can specify -1 to only draw the boundary of the rectangle.


    The last argument specifies where the legend should be placed in the graph. This
    is a three-character string. Each character specifies a location according to
    the following rules:


    First Character As described in Section 9.1.3, a graph has two main areas: the
    plot area and the graph area. The valid options are:


    +   - I specifies that the legend is drawn inside the plot area.


    +   - O specifies that the legend is drawn outside the plot area. That is, in
    the graph area.


    Second Character The second character specifies the horizontal placement of the
    legend. The valid options are:


    +   - L specifies that the legend is drawn near the left side of the plot or graph
    area.


    +   - C specifies that the legend is drawn in the center of the plot or graph
    area.


    +   - R specifies that the legend is drawn near the right side of the plot or
    graph area.


    Third Character The third character specifies the vertical placement of the legend.
    The valid options are:


    +   - T specifies that the legend is drawn near the top of the plot or graph area.


    +   - C specifies that the legend is drawn in the center of the plot or graph
    area.


    +   - B specifies that the legend is drawn near the bottom of the plot or graph
    area.


    The following statements call the DrawLegend module to create a legend for Figure
    9.13. The legend is shown in the lower right of Figure 9.14.


    ```

    /* define arguments for DrawLegend module */

    Labels = "Traditional" "Hybrid-Electric";

    LabelSize = 12;                               /* size of font */

    LineColor = BLACK || BLUE;

    LineStyle = SOLID | DASHED;

    Symbol = MARKER_CIRCLE | MARKER_STAR;

    BGColor = -1;                               /* -1 means "transparent background"
    */

    Location = "IRB";                               /* Inside, Right, Bottom */

    ```


    ```

    run DrawLegend(p, Labels, LabelSize, LineColor, LineStyle,

    Symbol, BGColor, Location);

    ```'
  merge: -1
  pgno: 210
- img_proc: true
  md: '# 9.2.2 Drawing an Inset


    An inset is often used to display descriptive statistics: the name of a statistic
    appears in the left column and the right column. Common statistics suitable for
    an inset include the number of observations, a correlation coefficient, parameter
    estimates, and so on.


    You can use the DrawInset module to draw a rectangle that contains two columns
    of text. The DrawInset module is similar to the syntax for the DrawLegend module.
    The syntax is:


    ```

    DrawInset(Plot plot, Labels, Values, Properties, Typeface, BGColor, Loc)

    ```


    The first argument to the module is the Plot on which to draw the inset. The second
    and third arguments to the DrawInset module specify the labels and the values
    that appear in each column of the inset. The values can be numeric (in which case
    an ANBESTw.format is applied to the values), or you can specify character strings.


    The Properties argument is a vector of properties that describe the typeface used
    for the inset. For default value, a single value means "use default value". If
    you want to override some default value, allocate a vector of them values and
    override the element that corresponds to the option you want to change. For example,
    the following statements create the LabelProps as a vector of five values, but
    then override the default font size by assigning a value to the first element:


    ```

    LabelProps = j(5, 1, .);              /* use default values for labels

    LabelProps[1] = 12;                               /* override size of font

    ```


    The Typeface argument specifies the name of a typeface such as "Arial". You can
    specify the default typeface by specifying an empty matrix or a zero-length string
    for this argument, as shown in the following statements. The remaining arguments
    for the DrawInset module are identical to the final arguments for the DrawLegend
    module.


    ```

    /* define arguments for DrawInset module */

    Labels = {"Slope: Traditional", "Slope: Hybrid-Electric"};

    Values = {1, 0.2 0.74};                                 /* values associated with
    labels

    LabelProps = j(5, 1, .);                               /* use default values for
    labels

    LabelProps[1] = 12;                                     /* override size of font

    ```


    ```

    Typeface = "";                               /* empty string means "default typeface"
    /\nBGColor = -1;                                 /* -1 means "transparent background"
    /\nLocation = "ILT";                               /* Inside, Left, Top

    ```


    ```

    run DrawInset(p, Labels, Values, LabelProps, LabelType, BGColor, Location);

    ```


    The inset is shown in the upper left of Figure 9.14.'
  merge: -1
