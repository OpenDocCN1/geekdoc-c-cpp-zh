  md: '# 7.1 Overview of Creating Statistical Graphs


    This chapter introduces some of the statistical graphs available in IMLPlus. It
    describes how to create these graphs from SAS/IML vectors and from a data object.
    The chapter also introduces the concept of calling methods in order to modify
    simple attributes of graphs.


    The chapter uses object-oriented terminology that is described in Chapter 6, "Understanding
    IMLPlus Classes.\ However, you do not need to master object-oriented programming
    in order to follow the examples in this chapter. By imitating the syntax in the
    examples, you can create and use simple graphs in your own IMLPlus programs. The
    following lists important terms and concepts:


    +   - A class is a "template" that defines a graph, including what data are required
    to create it and what functions can be used to modify the graph. A bar chart is
    defined by the BarChart class, a histogram is defined by the Histogram class,
    and so on.

    - Graphs are created and modified by functions called methods. Each class has
    its own methods, although some methods are common to several classes.

    - An object is a programming variable that refers to a class. In IMLPlus, you
    can use the declare keyword to specify that variable in your program is an object
    of some class. For example, the following statement declares that bar is an object
    of the BarChart class:


    ```

    declare BarChart bar;

    ```


    Each graph is attached to an in-memory copy of the data. This in-memory copy is
    known as a "data object" since it is an object of the DataObject class. Graphs
    that are attached to the same data object are dynamically linked to each other.
    The DataObject class is discussed in Chapter 8, "Managing Data in IMLPlus."


    The examples in this chapter do not run in PROC IML, so be sure you are using
    SAS/IML Studio.


    # 7.2 The Source of Data for a Graph


    In general, there are two ways to create a graph in IMLPlus: from SAS/IML vectors
    and from an object of the DataObject class. The DataObject class is introduced
    in Chapter 6 and is described more fully in Chapter 8.


    If you already have the data in SAS/IML vectors and just want a quick and convenient
    way to visualize the data, you can create graphs directly from the vectors. However,
    if you want to create several graphs that are dynamically linked to each other,
    you should create the graphs from a common data object.'
  merge: -1
  pgno: 149
- img_proc: true
  md: '# Creating a Bar Chart from a Vector 145


    **Programming Tip:** You can create IMLPlus graphs from SAS/IML vectors to quickly
    visualize the contents of the vectors.


    # 7.3 Bar Charts


    The section "Analyzing Observations by Categories" on page 68 shows how to read
    a categorical variable from a SAS data set and how to use the LOC and UNIQUE functions
    to count and display a table that shows the frequency of each category in the
    variable. A bar chart is a graphical representation of the same information. For
    example, Figure 7.1 displays the number of movies in the Movies data set for each
    rating category. This graphically displays the tabular data shown in Figure 3.13.


    **Figure 7.1** Bar Chart of Movie Ratings


    ![](img/148549d50632967f185e36a8bcda3de8_150_0.png)


    # 7.3.1 Creating a Bar Chart from a Vector


    You can create Figure 7.1 from a vector that contains the Motion Picture Association
    of America (MPAA) rating for each movie. The following program shows one way to
    create the bar chart:


    ```

    /* create a bar chart from a vector of data * /

    use Sasuser.Movies;

    read all ("MPAAARating");

    close Sasuser.Movies;


    declare BarChart;

    bar = BarChart.Create("Ratings", MPAARating);

    ```'
  merge: -1
  pgno: 150
- img_proc: true
  md: 'The program contains three main steps:


