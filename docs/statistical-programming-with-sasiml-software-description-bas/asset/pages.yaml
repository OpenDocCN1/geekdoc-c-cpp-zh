    The first argument of the SetMarkerShapeByGroup module is an object of the DataObject
    class. To pass objects to a module, you must specify the name of the class in
    the name of the argument when you list the arguments in the START statement. Any
    arguments that are not preceded by a class name are assumed to be SASIML matrices.


    # 10.2.2 Using Marker Colors to Indicate Values of a Continuous Variable


    The graph in Figure 10.1 displays a great deal of information. It displays two
    continuous variables and one categorical variable. However, the markers in the
    graph are all black. The SetMarkerColor method in the DataObject class enables
    you to color for given observations.


    The SetMarkerColor method can be used directly to color individual markers. It
    is also used indirectly when you call any of several modules with SAS/IML Studio.
    These methods enable you to manipulate markers and easily color observations according
    to the value of a variable. The subsequent subsections discuss colors and how
    to perform common tasks with colors in SAS/IML Studio. This section begins with
    a description of how to specify colors in IMLPlus.


    # 10.2.2.1 Color Representation in IMLPlus


    This section describes how colors are represented in IMLPlus. This is an advanced
    topic that can be omitted during an initial reading. The key point of this section
    is that there are two ways of representing colors: as ordered triples or as integers.
    There are two modules distributed with SAS/IML Studio that enable you to convert
    between representations: the RGBToInt and ToRGB modules.


    There are many ways to specify colors. IMLPlus represents colors by using the
    RGB coordinate system, which represents a color as an additive mixture of three
    primary colors: red, green, and blue.


    One way to represent a color in RGB coordinates is an ordered triple: the first
    coordinate represents the amount of red in the color, the second coordinate represents
    the amount of blue, and the'
  merge: -1
  pgno: 234
- img_proc: true
  md: '# 230 Chapter 10: Marker Shapes, Colors, and Other Attributes of Data


    third coordinate represents the amount of green. A popular representation of colors
    assigns eight bits (byte) to each of the three colors. This means each coordinate
    in the RGB system is an integer between zero and 255. In these coordinates, a
    value of 0 means absence and a value of 255 the color is fully present. Thus (0,0,0)
    represents black and (255, 255, 255) represents white. Red is (255,0,0), whereas
    blue is (0,0,255). A mixture of primary colors such as (65, 105, 225) is a bluish
    shade that some might call "royal blue."


    A second representation of colors packs the three RGB coordinates into a single
    integer. This is a very compact representation, although not intuitive! The packing
    is accomplished by writing the integer in hexadecimal notation: use the two place-values
    to store the value of blue in the color, use the third and fourth place-values
    to store the amount of green, and use the fifth and sixth place-values to store
    the red component.


    In this representation, a value of 0 in the appropriate place-values means the
    absence of color, whereas a value of FF means the color is fully present. In SAS
    you can represent a hexadecimal value by prefixing it with ''0'' and appending
    an ''x'' to the end of the number. Thus 00000000 represents black, whereas FFFFFFFF
    represents white. Red is 0FF0000x, whereas blue is 00000FF. The royal blue with
    RGB values (65, 105, 225) is compactly represented as 04169E1.


    SAS/IML Studio comes with two modules that convert ordered triples and integers.
    The RGBToInt module converts ordered triples to integers, and the IntToRGB module
    converts in the other direction. These modules are demonstrated by the following
    statements:


    ```

    / convert colors between different representations +

    RoyalBlueRGB = (65, 105, 225);              /* input as ordered triple *

    IntColor = RGBToInt(RoyalBlueRGB);         nprint IntColor[format=hex6];               /*
    print as hexadecimal */


    RoyalBlueInt = 04169E1;                    /* input as hexadecimal *

    TripletColor = IntToRGB(RoyalBlueInt);

    print TripletColor;                        /* print as ordered triple */

    ```


    The output is shown in Figure 10.2. Note that the base-10 representation of the
    IntColor integer (which is 4268945) is never displayed. The hexadecimal representation
    of the integer is printed by using the FORMAT=HEX6 option. Similarly, the integer
    stored in RoyalBlueInt is specified by its hexadecimal value by using the ''0''
    prefix and the ''x'' suffix.


    Figure 10.2 Color Represented as Ordered Triple and Integer


    | IntColor |

    | 4169E1 |

    | TripletColor |

    | 65 105 225 |


    **Programming Tip:** Use the RGBToInt and IntToRGB modules to convert colors between
    the ordered triples and hexadecimal (integer) representations.'
  merge: -1
