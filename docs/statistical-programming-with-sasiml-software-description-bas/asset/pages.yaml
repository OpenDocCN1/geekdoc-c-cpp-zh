  md: '# 380 Chapter 15: Timing Computations and the Performance of Algorithms


    When you run a program like the one that creates Figure 15.7, the times you see
    for each trial are only estimates of some theoretical "minimum time" that the
    program could achieve on a dedicated CPU. In reality, the CPU is multitasking
    while the program runs. The operating system might be checking if you have received
    a new email. Or it might be scanning for viruses or performing one of a dozen
    system administration tasks that occur in the background while you are working.
    In short, the computer is not devoting all of its computational resources to your
    SAS/IML program, and is, in fact, busy running other programs as well. This makes
    the precise timing of algorithms difficult.


    This section describes one to deal with the imprecise measurements: repeat the
    measurements several times until you obtain multiple times associated with each
    trial. Then you can use statistical models to predict the mean time for each trial.


    The basic idea is simple: in order to obtain multiple times for each trial, put
    a loop around the program in the previous section that it runs several times.
    In practice, it is more efficient to put the new loop around the calls to the
    modules, since you can therefore reuse the input vector for each call. This is
    implemented by the following statements, which run trial five times:


    ```

    * time each algorithm multiple times as a parameter is varied *

