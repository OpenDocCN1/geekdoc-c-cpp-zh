  md: '# Chapter 9: Drawing on Graphs


    Figure 9.11 A Graph with Features Drawn in Three Drawing Regions


    ![](img/148549d50632967f185e36a8bcda3de8_207_0.png)


    You do not need to draw legends by using low-level drawing commands: SAS/IML Studio
    attributes several modules that make it easy to create legends. The DrawInset
    and DrawLegend modules are discussed in Section 9.2 and are documented in the
    online Help. You can view the documentation in the chapter titled "IMLPlus Module
    Reference," in the section titled "Graphics."


    **Programming Tip:** Use the DrawLegend module to draw legends.


    # 9.1.5 Practical Differences between the Coordinate Systems


    There are important differences between the data coordinate system and a user-defined
    coordinate system. Objects drawn in the data coordinate system respond to zooming
    and panning in the plot area, whereas a user-defined coordinate system does not.
    (Try panning the box plot in Figure 9.6 and see what happens! Pan right-click
    in the plot area and select Pan Tool from the pop-up menu.)


    Consequently, the coordinates are best for plotting regression lines, reference
    lines, confidence regions, and similar objects. For some reason, a user-defined
    coordinate system is best for drawing legends, inserts, and similar annotations
    because you typically do not want a legend to disappear when you zoom or pan in
    a graph. Unfortunately, there is no way (of SAS/IML Studio 3.3) to draw in the
    coordinate system of the data for a graph that displays a categorical variable.


    **Programming Tip:** Whenever possible, use the data coordinate system to display
    statistical curves and regions.'
