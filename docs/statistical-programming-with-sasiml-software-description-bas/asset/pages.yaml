  md: "# 22 Chapter 2: Getting Started with the SAS/IML Matrix Programming Language\n\
    \n> Programming Tip: A matrix is either numeric or character or undefined; you\
    \ cannot create a matrix that contains both numbers and character strings.\n\n\
    # 2.2.4 The Length of a Character Matrix\n\nSAS/IML matrix characters share certain\
    \ similarities with character variables in the DATA step. In the DATA step, the\
    \ length of a character variable is determined when the variable is initialized:\
    \ either explicitly using the LENGTH statement or implicitly by the length of\
    \ the first value for the variable. Similarly, every element in a SAS/IML character\
    \ matrix has the same number of characters: the longest element. This length is\
    \ determined when the matrix is initialized. Strings shorter than the longest\
    \ element are padded with blanks.\n\nFor example, the following statements define\
    \ a character matrix with length 4:\n\n```\nc = \"Low\" \"Med\" \"High\";    \
    \  / maximum length is 4 characters\n```\n\nThe matrix is initialized to have\
    \ length 4, the length of its longest character. Shorter strings such as \"Low\"\
    \ are padded on the right so that the first element of c is stored as Low□ indicates\
    \ a blank character.\n\n> Programming Tip: The length of a character matrix is\
    \ determined by the length of its longest element at time it is created.\n\nYou\
    \ can find the length of a character matrix using the NLENG function, which returns\
    \ a single number. You can find the number of characters for each element of a\
    \ character matrix by using the LENGTH function, which returns a number for each\
    \ element. These functions are shown in the following statements:\n\n```\n* find\
    \ the length of a character matrix and of each element *\nlen = nleng(c);    \
    \          / length of matrix       *\nlen = length(c);             / number of\
    \ characters in each element *\nprint nlen len;\n```\n\nFigure 2.7 Lengths of\
    \ Elements in a Character Matrix\n\n| nlen | | | | |\n|---|---|---|---||\n | 4\
    \ | 3 | 3 | 4 |\n\nNotice that the LENGTH function returns a numeric matrix that\
    \ is the same dimension as its input argument. For example, the ij element of\
    \ len is the number of characters in the ij element of c. (Strictly speaking,\
    \ both functions return numbers that represent bytes. Because each English character\
    \ is one byte long, the numbers also give the number of characters for matrices\
    \ that contain English strings.)"
