    # 3.2.2 Creating SAS Data Sets from Matrices


    You can use the CREATE and APPEND statements to write a SAS data set from the
    vectors or matrices. The following statements create a data set MyData in the
    Work library:


    ```

    / create SAS data set from vectors */

    /* set for RANDGEN */

    call randseed(12345);      /* allocate 10 x 1 vector */

    x = j(10, 1);              /* allocate 10 x 1 vector */

    e = x;                     /* fill x */

    call randgen(e, "Uniform");/* fill values from uniform dist */

    call randgen(e, "Normal");/* fill e values from normal dist */

    y = 3*x + 2;               /* linear response plus normal error */


    create MyData var (x y); /* create Work.MyData for writing */

    append;                    /* write data in x and y */

    close MyData;              /* close the data set */

    ```


    The CREATE statement opens Work.MyData for writing. The variables x and y are
    created; the type of the variables (numeric or character) is determined by the
    type of the SAS vectors of the same name. The APPEND statement writes the values
    of the vectors listed in the VAR clause of the CREATE statement. The CLOSE statement
    closes the data set. It is a good programming practice to close data sets when
    you are finished reading or writing the data because it frees up memory and system
    resources, and also prevents corruption of the data in the event that your program
    terminates prematurely. (For example, you might need to terminate a program if
    a computation is taking longer than you expected.)


    **Programming Tip:** Always close your data sets in the same way when you are
    finished reading or writing the data.


    You can write character vectors in the same way. Row vectors are written to data
    sets as if they were columns. If the x and y vectors do not contain the same number
    of elements, the shorter vector is padded with missing values.


    If you want to create a data set from a matrix of values, you can use the FROM
    clause on the CREATE and APPEND statements. If you do not explicitly specify names
    for the data set, the default names are COL1, COL2, and so on. You can explicitly
    specify names for the data sets by using the COLNAME= option to the FROM clause,
    as shown in the following statements:


    ```

    / create SAS data set from a matrix */

    /* set for RANDGEN */

    call randseed(12345);      /* * */

    x = j(10, 3);              /* allocate 10 x 3 matrix */

    call randgen(x, "Normal");/* fill x */ values from normal dist * */

    ```


    ```

    create MyData2 from x[colname={"Random1" "Random2" "Random3"}]

    append x;

    close MyData2;

    ```'
