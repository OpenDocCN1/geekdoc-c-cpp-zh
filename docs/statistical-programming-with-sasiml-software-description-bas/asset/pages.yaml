  md: '# 366 Chapter 14: Bootstrap Methods


    # 14.5.1 Plotting Confidence Intervals on a Scree Plot


    You can create a scatter plot that consists of all the B scree plots generated
    by the principal component analysis computed on the B resamples:


    ```

    / create union of scree plots for bootstrap resamples */

    declare DataObject dobj;

    dobj = DataObject.CreateFromServerDataSet("Work.BootEVals");

    dobj.SetFormat("Proportion", "BEST5.");


    declare ScatterPlot p;

    p = ScatterPlot.Create(dobj, "Number", "Proportion");

    p.SetMarkerSize(3);

    ```


    That scatter plot can overlay the PVE for the original sample, in addition to
    confidence intervals for the underlying parameter in the population of peoples.
    The following statements overlay the quantities; the result is shown in Figure
    14.14.


    ```

    / overlay statistics of the original data */

    use EigenValues;

    /* 1. read PVE for data */

    read all var (Number Proportion);

    close EigenValues;

    p.DrawUseDataCoordinates(); /* define coordinate system */

    p.DrawMarker(Number, Proportion, MARKER_X); /* plot plot proportions */

    ```


    ```

    use BootEVals; /* 2. read stats for resamples */

    read all var (Number Proportion);

    close BootEVals;

    ```


    ```

    NumPC = ncol(VarNames); /* number of principal components */

    s = shape(Proportion, 0, NumPC); /* 3. reshape results */


    mean = s[:]; /* 4. compute mean of each column */

    alpha = 0.05; /* significance level for C.I. */

    prob = alpha/2 || 1-alpha/2; /* lower/upper values for quantiles */

    call qnt(ci, s, prob); /* compute C.I. for each column */

    print mean, CI[rowname(LCI)] label="Confidence Intervals";

    ```


    ```

    p.DrawSetRegion(PLOTBACKGROUND);

    p.DrawSetBrushColor(0xC8C8C8); /* light gray */

    dx = 0.1; /* half-width of rectangles */

    di = 1 to NumPC; /* 5. draw rectangles and mean line */

    p.DrawRectangle(i-dx, CI[1], i+dx, CI[2], true);

    p.DrawLine(i-dx, mean[i], i+dx, mean[i]);

    end;

    ```


    The program consists of the following main steps:


    +   1. Read the statistics for the PVE of the original data. Those proportions
    are indicated on the scatter plot by large markers (x).


    +   2. Read the Proportion variable that contains the PVE for each bootstrap resample.
    The vector Proportion has 5B elements.'
