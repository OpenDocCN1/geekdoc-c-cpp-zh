  md: '# 11.3. Calling Functions from IMLPlus 253


    difference is to call R functions, you use the R in the SUBMIT statement as shown
    in the following example:


    ```

    * call R functions */

    submit / R;

    n <- 100 # seed for pseudorandom number generation

    set.seed(1) # seed is pseudorandom uniform of length n

    x <- runif(n) # y is linearly related to x

    y <- 3x + 2 + rnorm(n) # model y as a function of x

    model <- lm(y-x) # print summary of linear model

    summary(model)

    endsubmit;

    ```


    The statements in the SUBMIT block are set for R interpreting. The left-pointing
    arrow, <- is the assignment operator. The first four R statements create a vector
    y that is linearly related to x, but contains errors randomly generated from the
    standard normal distribution. The seed function sets a value for the random number
    generator used by the rnorm and runif functions.(See the section "Using Matrices"
    on page 24 for analogous SAS/IML statements.) The lm function uses least squares
    to model the response y as the explanatory variable x. The summary function displays
    relevant statistics for the model, as shown in Figure 11.1. In SAS/IML, R output
    is output in the current output window; PROC IML, R output is sent to all open
    destinations.


    ![](img/148549d50632967f185e36a8bcda3de8_258_0.png)


    **Programming Tip:** Use the SUBMIT and ENDSUBMIT statements with the R option
    to call functions from an IMLPlus program.'
