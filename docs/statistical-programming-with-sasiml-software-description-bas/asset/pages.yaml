  md: '| Table 7.4 Frequently Used Methods in the BoxPlot Class |

    | Method | Description |

    | BoxPlot.Create | Creates a bar chart |

    | SetWhiskkerLength | Specifies the length of the box plot whiskers as a multiple
    of the interquartile range |

    | ShowMeanMarker | Whether to overlay the mean and standard deviation of the box
    plot |

    | ShowNotches | Whether to display a notched box plot. This variation of the box
    plot indicates that medians of two box plots are significantly different at approximately
    the 0.05 significance level if the corresponding notches do not overlap. |


    The complete set of BoxPlot methods are documented in the SAS/IML Studio online
    Help.


    You can use the SetWhiskkerLength method to control which observations are plotted
    as outliers. The default multiplier is 1.5. If you set the whisker length to zero,
    all observations in the first and fourth quartiles are plotted. In contrast, if
    you set the whisker length to 3, then only extreme outliers are plotted.


    A box plot shows the median and IQR for the data, but sometimes it is useful to
    compare these statistics to their robust counterparts, the mean and the standard
    deviation. You can use the ShowMeanMarker method to overlay a line segment that
    represents the mean of the data, and an ellipse (or diamond) that indicates the
    standard deviation.


    The box plot displays the sample median. You can use a notched box plot to compare
    the median values of two groups: the medians are different (at approximately a
    0.05 significance level) if their notched regions do not overlap.


