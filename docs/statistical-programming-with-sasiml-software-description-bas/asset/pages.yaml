    # 6.1 Overview of Understanding IMLPlus Classes


    This chapter describes how to programmatically create, manipulate, and modify
    the graphs and data tables that are available in SAS/IML Studio. Because the “Plus”
    portion of the IMLPlus language is object-oriented, the chapter begins by introducing
    object-oriented terms such as class, object, method, signature, base class, and
    derived class. The remainder of the chapter describes several important IMLPlus
    classes such as the DataObject class and the Plot class, and shows how you can
    pass objects of these classes to IMLPlus modules.


    You can run the programs in this chapter only from the SAS/IML Studio environment.
    PROC IML does not support classes.


    > Programming Tip: You must use SAS/IML Studio to run IMLPlus programs.'
  merge: -1
