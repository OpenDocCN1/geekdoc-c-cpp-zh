    # 8.1 Overview of Managing Data in IMLPlus


    As introduced in Section 6.3, the most important class in the IMLPlus language
    is the DataObject class. The DataObjectClass manages an in-memory copy of data.
    The class also manages information about observations such as the shape and color
    of markers, the selected state of observations, and whether observations are displayed
    in plots or are excluded.


    As shown in Chapter 7, “Creating Statistical Graphs,” it is the DataObject class
    that enables you to dynamically create linked graphs. Graphs that are created
    from the data object are automatically linked to each other.


    This chapter describes how to create a data object from a source of data and how
    to create a SAS data set or a SAS/IML matrix from a data object. The chapter also
    describes how to modify a data object by adding new variables such as predicted
    values, residual values, and transformed variables.'
  merge: -1
  pgno: 178
- img_proc: true
  md: '# 8.2 Creating a Data Object


    The Data class has several "Create" methods that instantiate a data object. A
    data object can be instantiated from any several sources of data: from a SAS/IML
    matrix, from a Microsoft Excel worksheet, from an R data frame, from a SAS data
    set, or from a SAS data set stored on the client PC. A server data set is one
    that is in a SAS library such as Work, Sashhelp, or in a libref that you defined
    using the LIBNAME statement. A client data set is one that can be accessed by
    the operating system of the computer running SAS/IML Studio. For example, this
    could be a data set on a hard drive or USB drive of the local PC, or any data
    set that is accessible through a mounted, networked drive.


    The following table lists methods that create a data object from various data
    sources:


    | Table 8.1 Creating a Data Object |

    | Method | Source |

    | --- | --- |

    | Create | SAS/IML matrix |

    | CreateFromExcelFile | Microsoft Excel workbook |

    | CreateFromFile | SAS data set on local PC or networked drive |

    | CreateFromR | Data frame or matrix in R |

    | CreateFromServerDataSet | SAS data set in libref |


    # 8.3 Creating a Data Object from a SAS Data Set


    Most SAS programmers store data in a SAS data set. The CreateFromFile method instantiates
    a data object from a SAS data set on the client PC (the file has a sas7dat extension).
    The CreateFromDataSet method instantiates a data object from a SAS data set on
    a SAS server, which is typically located in Work, Sasuser, or a user-defined libref
    such as MyLib.


    Creating a data object from a SAS data set is easy: you need to declare the name
    of the data object and then instantiate it, as shown in the following statements:


    ```

    /* create a data object from a SAS data set */

    declare DataObject dobj;

    dobj = DataObject.CreateFromServerDataSet("Sasuser.Movies");

    ```


    The data object is invisible, the statements do not produce any windows. If you
    want a tabular view of the data, you can create an instance of the DataTable class,
    as described in Section 6.8.'
  merge: -1
  pgno: 179
- img_proc: true
  md: '# 8.4. Creating Linked Graphs from a Data Object 175


    # 8.4 Creating Linked Graphs from a Data Object


    TheDataObject class provides a uniform interface to setting properties of the
    data, for retrieving data, and for creating dynamically linked graphs. By using
    the Data class, you can read data from various sources and manipulate the data
    without regard the details of how the data are stored.


    The following statements (which continue the program in the previous section)
    create a scatter plot and a bar chart. The first argument to create Method is
    a data object. Subsequent arguments name variables in that data object. Because
    the scatter plot and the bar chart are created from a common data object, they
    are automatically linked to each other and to any other graphical or tabular view
    of the same data object.


    ```

    /* create plots from a common data object */

    declare ScatterPlot;

    plot = ScatterPlot.Create(dobj, "ReleaseDate", "Budget");

    declare BarChart;

    bar = BarChart.Create(dobj, "MPARating");

    ```


    The results graphs are shown in Figure 8.1. The figure shows the graphs after
    clicking the PG category in the bar chart. Note that the 66 movies that are rated
    PG are selected. These observations are displayed as highlighted—both in the bar
    chart and also in the scatter plot.


    # Figure 8.1 Linked Graphs


    ![](img/148549d50632967f185e36a8bcda3de8_180_0.png)


    > Programming Tip: Create graphs from a common data object. All graphs that share
    the same data object are dynamically linked to each other.


    It is sometimes useful to label observers in a scatter plot by using values of
    a particular variable. You can tell the data object which variable is the "label
    variable" by using the SetRoleVar method in the DataObject class, as shown in
    the following statement:


    ```

    dobj.SetRoleVar(ROLE_LABEL, "Title");

    ```'
