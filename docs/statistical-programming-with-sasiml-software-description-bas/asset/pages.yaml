- img_proc: true
  md: '# 6.2 Object-Oriented Terminology


    The IMLPlus programming language borrows ideas from object-oriented programming,
    particularly Java. An object is a variable that refers to a class. The class is
    a "template" for the object: it specifies the data and the functions (called methods)
    that query, retrieve, and manipulate the data. In IMLPlus, a variable is implicitly
    assumed to be a SAS/IML matrix unless you use the declare keyword to specify that
    the variable is an object.


    To call class methods in IMLPlus, you use a "dot notation" syntax in which the
    method is appended to the object, such as ObjectName.MethodName(). Class names,
    object names, and method names are case-sensitive, which is the Java convention.
    The declare keyword is also case-sensitive.


    > **Programming Tip:** In IMLPlus, the classes, objects, and methods are case-sensitive.
    You use the declare keyword to specify that a variable is an object. The declare
    keyword must be in lowercase characters.


    IMLPlus includes many classes that are useful in data analysis such as the classes
    that define statistical graphs: ScatterPlot, Histogram, BarChart, and so on. In
    addition, you can call any other Java classes from IMLPlus.


    > **Programming Tip:** IMLPlus programs support classes and objects. You can instantiate
    objects, call their methods, and even pass them to IMLPlus modules.


    In IMLPlus, the names of classes are written in mixed case and begin with a capital
    letter. Often the name of a method is formed by concatenating a verb and a direct
    object. For example, SetAxisLabel, DrawLine, and GetVarData are all names of IMLPlus
    methods.


    > **Programming Tip:** In IMLPlus, the names of classes are written in mixed case
    and begin with a capital letter.


    The calling syntax for a method (that is, the number and order of arguments) is
    a signature. Java methods can have multiple signatures. Often a short signature
    is identical to a longer signature, with default values for certain parameters.


    IMLPlus classes obey most of the same conventions as Java classes. The SAS/IML
    Studio online Help chapter "The IML Language" contains a section "Java-oriented
    Language Extensions" that documents the similarities and differences between IMLPlus
    and Java. You can display the online Help by selecting Help► Help Topics from
    the main menu.'
  merge: -1
  pgno: 135
- img_proc: true
  md: '# 6.3 The DataObject Class


    The most important class in the IMPlus language is the DataObject class. The DataObject
    class manages an in-memory copy of data. An object of the DataObject class is
    typically created (or instantiated) from a SAS set, but it can also be created
    from SAS/IML matrix, an R data frame, an Excel spreadsheet, or other sources.
    When you use the SAS/IML GUI to open a data set, SAS/IML Studio reads the entire
    set into memory. This enables dynamically linked graphs and tables: selecting
    observations in one graph is quickly reflected in other views of the same data
    because the data are in memory.


    The DataObject class contains methods that query, retrieve, and manipulate the
    data. The class also manages graphical information about observations such as
    the shape and color of markers, the selected state of observations, and whether
    observations are displayed in plots or are excluded.


    > **Programming Tip:** You can instantiate an object of the DataObject class from
    several formats: a SAS data set, a SAS/IML matrix, an R data frame, an Excel spreadsheet,
    and so on. The DataObject class provides a uniform interface to the data, regardless
    of the data source.


    The first chapter of the SAS/IML Studio for SAS/STAT Users documentation devotes
    several pages and diagrams explaining the DataObject class and its role in coordinating
    graphical and tabular views of the data. It is well worth reading. Figure 6.1
    shows a schematic description of the three primary roles of the DataObject class:


    +   - to read data into memory from various sources

    - to be a uniform interface to data by providing methods that set and get data
    and properties of observations and variables

    - to coordinate the display of data in dynamically linked graphs and tables'
  merge: -1
  pgno: 136
- img_proc: true
  md: '# 132 Chapter 6: Understanding IMLPlus Classes


    Figure 6.1 Schematic Description of the Roles of the DataObject Class


    ![](img/148549d50632967f185e36a8bcda3de8_137_0.png)


    This book refers to "object of the DataObject class" as a *data object*. The example
    creates a data object from the Movies data set and calls methods in the DataObject
    class:


    ```

    /* create data object and call methods */

    declare DataObject dob;

    dobj = DataObject.CreateFromDataSet("Sasuser.Movies");n/* 1 */

    /* 2 */

    dobj.GetVarNames(varNames)

    print varNames


    /* 3 */

    dobj.GetVarData("Budget", b);

    budgetSummary = quartile(b);

    print budgetSummary("Q1" "Median" "Q3" "Max");n/* 4 */

    /* 5 */

    ```


    The following list describes each step of the program:


    +   1. Use the **declare** keyword to specify that the variable **dobj** is an
    object of the DataObject class. The variable **dobj** is not yet created.


    +   2. Instantiate the variable dobj from the SAS data set Sasuser.Movies. (You
    can also use methods to create a data object from other sources of data, as described
    in Chapter 8, "Managing Data in IMLPlus.") You can now call all methods in the
    DataObject class on the object, **dobj**.


    +   3. Call the GetVarNames method in the DataObject class using the **ObjectName.MethodName()**
    syntax. The argument to this method is the name of a SAS/IML vector, **varNames**.
