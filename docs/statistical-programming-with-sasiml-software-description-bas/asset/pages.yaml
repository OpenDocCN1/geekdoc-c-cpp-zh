  md: '# 1.8. Data and Programs Used in This Book 15


    present the program in its entirety, and then discuss the details of the implementation.
    Comments in the program call attention to the main steps and important statements
    that are explained later in the text. The advantage of this approach is that the
    reader can see the program in its entirety and read the description of the program
    after the statements are presented.


    For example, the simple SAS/IML program and subsequent explanation demonstrate
    how programs in this book are documented and described:


    ```

    /* Present a simple example with comments.

    /* The PROC IML statement is not required in SAS/IML Studio.

    x = 3; /* 1 */ /* NUMBERS indicate steps that

    y = 2; /* are described in a list */

    z = x + y; /* 2 */ /* AFTER the program. */

    print z; /* display result */ /* Other statements are briefly */ /* described
    WITHIN the program. */

    ```


    The program begins with a short comment that explains the purpose of the program.
    A number that appears in a comment means that the program is explained in an enumerated
    list that appears after the program list. The previous program consists of the
    following main steps:


    +   1. Assign the value 3 to the x variable. Notice that the statement ends with
    a semicolon, as do all SAS statements. The variable y is assigned similarly.


    +   2. Define the variable x as the sum of the x and y variables. The result of
    this assignment is shown in Figure 1.7.


    Figure 1.7 The Output from a Simple Program


    | z |

    | 5 |


    For simple or short programs (such as the one above), the program is often described
    in paragraph form, rather than with an enumerated list.


