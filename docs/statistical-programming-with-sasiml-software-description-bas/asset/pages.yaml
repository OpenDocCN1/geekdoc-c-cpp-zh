  md: '# 12.9. Logistic Regression Diagnostics 303


    # 12.9 Logistic Regression Diagnostics


    As shown in the previous sections, the dynamically linked graphics in SAS/IML
    Studio make it easy to identify influential observations. After you create graphs
    of diagnostic statistics (Cook’s D, leverage, and so forth), you can click on
    the highly influential observations in order to reveal more information about
    those observations. This technique is not limited to least squares regression.
    You can also apply the ideas to logistic models, mixed models, nonparametric models,
    and so forth. This section briefly describes how to create and examine diagnostic
    statistics for a logistic model.


    This section uses the *Vehicles* data set, which contains an indicator variable
    named *Hybrid*. The *Hybrid* variable has the value $⁠1$ for hybrid-electric vehicles
    and the value $⁤0$ for other vehicles.


    A distinguishing characteristic of hybrid-electric vehicles is that they achieve
    better gas mileage during city driving than on the highway. This is shown in Figure
    12.14, where the hybrid-electric vehicles are indicated by stars (*). The graph
    might lead you to suspect that you can predict whether a vehicle is hybrid-electric
    based on comparing values of the *Mpg_Hwy* and *Mpg_City* variables.


    Figure 12.14 Mileage for Various Vehicles. Stars Represent Hybrid-Electric Vehicles.


    ![](img/148549d50632967f185e36a8bcda3de8_308_0.png)


    A particularly simple model is to consider only the difference between the *Mpg_Hwy*
    and *Mpg_City* variables. This quantity is contained in the *Mpg_Hwy_Minus_City*
    variable in the *Vehicles* data set.


    The process of fitting a logistic model, displaying the results in SAS/IML Studio,
    and using graphics to identify influential observations is very similar to the
    process described in the section “Fitting a Regression Model” on page 280. The
    main steps of the process are as follows:'
