- img_proc: true
  md: '# 66 Chapter 3: Programming Techniques for Data Analysis


    reasons such as nonresponse in a survey or because no measurement was taken. Missing
    values can occur for mathematical or statistical reasons. For example, the logarithm
    of a nonpositive value or the skewness of constant data are both often represented
    by a missing value.


    There are two common techniques for dealing with missing values during data analysis:
    excluding observations with any missing variable from the analysis or imputing
    values to replace the missing value. Most SAS procedures (for example, UNIVARIATE,
    REG, and RECOMP) exclude the entire observation if the observation has a missing
    value in any relevant variable. The MI and ANALYZE procedures in SAS/STAT use
    multiple imputation to handle missing values. This book does not discuss multiple
    imputation methods.


    Many SAS/IMP built-in routines and matrix operators handle missing values by omitting
    them from a computation. For example, you can compute the sum of the elements
    in a matrix by using the SUM function or by using subscript reduction operator
    (+), which is described in “Use Subset Reduction Operators” on page 80. If the
    matrix contains missing values, those values are excluded from the arithmetic
    operations. Similarly, the Median value (which is distributed with SAS/IMP the
    IMLIB library) excludes missing values when computing the median of each column
    of a matrix.


    However, some SAS/IMP routines and operators cannot check for missing values without
    correspondingly identifying them. For example, matrix and vector multiplications
    with an error if there are missing values in either factor. Other SAS/IMP statistical
    and mathematical functions report errors if they are called with containing missing
    values. Consequently, if you want to write robust, reusable programs, you should
    write programs that explicitly handle missing values in your data.


    For example, suppose you wanted to compute the mean of the worldwide revenue in
    the Movies data set as part of the. The following statements look correct upon
    a first glance:


    ```

    /* incorrect computation for data that contains missing values *

    use Saseruser.Movies;      /* read data */

    read all var {World_Gross};

    close Saseruser.Movies;

    ```


    ```

    /* mean is wrong because of missing values */

    wrong_mean = sum(World_Gross) / nrow(World_Gross);

    print wrong_mean;

    ```


