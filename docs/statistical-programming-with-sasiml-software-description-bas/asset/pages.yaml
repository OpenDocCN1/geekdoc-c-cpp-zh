    # 9.1.2 Graph Coordinate Systems and Drawing Regions


    In the previous section, the example program calls the DrawUseDataCoordinates
    method prior to drawing a curve on the screen. The method specifies that future
    commands will use coordinates consistent with the graph''s data and axes. This
    section discusses the various coordinate systems you can use with ImPlus graphics.


    # 9.1.2.1 Drawing in the Coordinate System of the Data


    Suppose you want to draw a rectangle on a scatter plot in order to draw attention
    to certain observers. To make it concrete, suppose you want to draw a rectangle
    around the vehicles in Figure 9.1 that get less than 20 miles per gallon on the
    highway in order to emphasize that these vehicles are not fuel efficient.


    The method in the Plot class that draws a rectangle is called DrawRectangle. The
    arguments to the Draw method specify the location of the lower left and upper
    right corners of the rectangle. Specifically, if you call the DrawRectangle(x1,
    y1, x2, y2), then the graph displays a rectangle with lower left corner (x1, y1)
    and upper right corner (x2, y2). Consequently, you might have written the following
    statements:


    ```

    /* draw a rectangle on a scatter plot */

    declare DataObject dob;

    dobj = DataObject.CreateFromDataSet("Sasuser.Vehicles");


    declare ScatterPlot p;

    p = ScatterPlot.Create(dobj, "Engine_Liters", "Mpg_Hwy");

    p.DrawRectangle(1, 12, 7, 2, 20); /* wr wrong coordinate system! */

    ```


    The resulting scatter plot in Figure 9.4 contains a rectangle, but notice that
    the rectangle does not contain the vehicles that get less than 20 miles per gallon
    on the highway. What happened?'
  merge: -1
  pgno: 196
- img_proc: true
  md: '# 192 Chapter 9: Drawing on Graphs


    Figure 9.4 An Incorrect Attempt to Draw a Rectangle on a Scatter Plot


    ![](img/148549d50632967f185e36a8bcda3de8_197_0.png)


    What has happened is that the DrawRectangle method drew the rectangle correctly,
    but drew it in a different coordinate system than the data it uses. The default
    coordinate system for IMLPlus graphics is a coordinate system with (0,0) near
    the lower left of the plot area, and (100,100) near the upper right corner. In
    this coordinate system, the coordinates represent a percentage of the data range.
    (The plot area also contains margins that surround the data, as shown in Figure
    9.15.) Consequently, the horizontal dimension of the rectangle in Figure 9.4 starts
    at 1% of the range for the Engine_Liters variable and ends at 7.2% of the range.
    Similarly, the vertical dimension starts at 12% of the range of the Mpg_Hwy variable
    and ends at 20% of the range.


    To correctly draw the rectangle, you need to specify a coordinate system that
    corresponds to the data ranges of the variables in the graph. The way to do that
    is to call the DrawUseDataCoordinates method prior to calling the DrawRectangle
    method. This is shown in the following statements:


    ```

