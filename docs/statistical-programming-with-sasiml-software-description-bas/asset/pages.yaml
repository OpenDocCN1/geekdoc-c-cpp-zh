    The SUBMIT block consists of the following steps:


    +   1. The LOESS procedure to create a model of Budget by ReleaseDate. The SELECT-option
    is to select a value of the smoothing parameter that minimizes the AICC statistic.
    The PRESEARCH subjection helps find a global minimum of the AICC statistic. This
    sub improves the likelihood that the parameter value found by the LOESS procedure
    is a global minimum of the AICC.

    2. The SCORE statement specifies that the model will be evaluated at the values
    of the explanatory variables in the input data set.

