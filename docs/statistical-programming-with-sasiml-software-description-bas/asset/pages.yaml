    # 4.6 Creating Names for Output Variables


    One use for parameter substitution in the SUBMIT statement is to pass in the names
    of variables for the OUTPUT statement of a SAS procedure.


    For example, suppose you use the GLM procedure to output the predicted values
    and the lower and upper confidence limits for mean predictions. The P= option
    to the OUTPUT statement specifies a variable that will contain the predicted values.
    The LCLM= and UCL= specify the confidence limits. A useful convention is to name
    the corresponding output variable P_Y, where Y'
