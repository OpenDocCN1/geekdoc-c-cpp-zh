  md: "# 16.6 Creating a Dialog Box with Java\n\nThis example shows how to call Java\
    \ classes to create a modal dialog box. This feature might be useful to the statistical\
    \ programmer who wants to create dialog boxes as part of an IMLplus. This section\
    \ does not attempt to explain how to program in Java, but rather assumes that\
    \ the reader is familiar with Java programming.\n\nThis book describes the Java\
    \ classes that are presented as part of SAS/IML Studio, such as those in com.sas.imlplus.client.graphics.\
    \ However, you can call any public method in any Java class, regardless of its\
    \ origin. The documentation of a class lists provides the public methods for the\
    \ class.\n\nFor example, if you are interested in using Java Swing components\
    \ to create a GUI for an IMLplus program, you can run the following statements\
    \ directly from a SAS/IML program window:\n\n```\n/* create a modal dialog by\
    \ using Java classes */\nimport java.swing.JOptionPane; /* import statements MUST\
    \ be first */\n\n/* Text for the buttons */\ndeclare String[] distrib = {\"Normal\"\
    , \"Uniform\", \"Exponential\"};\n\nresponse = JOptionPane.showOptionDialog(/*\
    \ parent component */\n    null,\n    \"Sample from what distribution\", /* message\
    \ */\n    \"Pseudandom Sampling\", /* title of dialog boxes */\n    JOptionPane.DEFAULT_OPTION,\
    \ /* option type */\n    JOptionPane.PLAIN_MESSAGE, /* messageType */\n    null,\
    \ /* no icon */\n    distrib, /* text for buttons */\n    distrib[0] ); /* default\
    \ selection */\n```\n\n```\nmsg = \"Note: Modal dialog. Program is blocked until\
    \ the dialog is closed.\";\nprint msg;\nprint \"The selected choice was \" response\
    \ = \" dist distrib[response];\ncall randseed(12345) /* set seed */\nx = j(5,\
    \ 1); /* allocate vector */\ncall randgen(x, distrib[response]); /* generate from\
    \ chosen distr */\nprint x;\n```\n\nThe program uses the import statement to import\
    \ the JOptionPane class in the java.swing package. The import statement enables\
    \ you to refer to Java classes without always specifying the package that contains\
    \ the class. Let the declare keyword, the import keyword must be specified in\
    \ lowercase characters. An import statement must precede other IMLplus statements.\n\
    \nThe String class is used to create an array of character strings. Because IMLplus\
    \ automatically imports the java.lang package (which contains the String class),\
    \ you do not need to explicitly import the package that contains the String class.\n\
    \nThe arguments to the Java showOptionsDialog method are explained in comments\
    \ in the previous program. A simple internet search readily provides links to\
    \ the documentation and examples for the JOptionPane class."
  merge: -1
