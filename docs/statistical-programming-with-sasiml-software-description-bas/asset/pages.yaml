    \ */\nblank32 = subpad(\", 1, 32); /* string with 32 blanks */\nvarNames = j(k,\
    \ 1, blank32); /* allocate result vector */\ncount = 0; /* keep count of numeric\
    \ vars */\ndo i = 1 to /* for each variable... */\n name = dobj.GetVarName(i);\
    \ /* for the name */\n if dobj.IsNumeric(name) then /* if the variable is numeric\
