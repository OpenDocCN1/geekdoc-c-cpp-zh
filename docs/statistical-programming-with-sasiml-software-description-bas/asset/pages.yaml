    \ output=GLMout P=P R=Resid;\nquit;\nendsubmit;\n```\n\n```\nprintnow; /* flush\
    \ any pending output */\n```\n\nThe last statement is the PRINTNOW, which is an\
    \ IML Statement that ensures that any output buffered by the SAS server is transferred\
