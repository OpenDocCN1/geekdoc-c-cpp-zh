    # 16.4 Linking Related Data


    This book primarily focuses on analyzing and displaying one data set at a time.
    However, it is also possible to use the interactive graphics of SAS/IML Studio
    to analyze several related data sets in a single program. This section describes
    how to link graphics from related data sets by using the action menus that are
    described in Section 16.3.


    The example in this section involves comparing different nonparametric smoothing
    for scatter plot data. When you fit a model to data, you choose a single model
    from a family of possible models. It is common to choose the model that optimizes
    some criterion that measures the agreement between the data and the model. For
    example, choosing among several loess models, it is common to choose the model
    that minimizes the corrected Akaike’s information criterion (AICC).'
