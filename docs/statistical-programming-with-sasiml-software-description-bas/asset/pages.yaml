  md: '# Coloring by Values of a Continuous Variable 235


    **Programming Tip:** To interpolate colors, represent them as triples of RGB values.
    The IntToRGB module might be useful for this.


    The scatter plot shown in Figure 10.4 displays US_Gross on the vertical axis.
    Even though the image in this book is monochromatic, the gradient of colors from
    a light color to a dark color is apparent. In practice, it is common to use color
    to depict a variable that is *not* present in the graph.


    # Figure 10.4 A Color Ramp


    ![](img/148549d50632967f185e36a8bcda3de8_240_0.png)


    The ideas of this section can be extended to color ramps with more than two colors.
    Suppose you have a vector $v$ and want to color observations by using a color
    ramp with $k$ colors $c_1, c_2, \dots, c_k$. Divide the range of $v$ into $k-1$
    equal intervals defined by the evenly-spaced values $L_1, L_2, \dots, L_k$, where
    $L_1 = \min(v)$ and $L_k = \max(v)$. To the interval $[L_i, L_{i+1}]$, associate
    the two-color ramp with colors $c_i$ and $c_{i+1}$. For an observation that has
    a value $v$ in the interval $[L_i, L_{i+1}]$, color it according to the algorithm
    for two-color ramps. In this way, you reduce the problem to one already solved:
    to handle a color ramp with $k$ colors, simply handle $k-1$ color ramps with two
    colors.


    SAS/IML Studio distributes several modules that help you interpolate colors and
    color-code observations. The modules are briefly described in Table 10.3.'
