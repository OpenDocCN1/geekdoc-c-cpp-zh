  md: '# Drawing in the Foreground and Background 197


    # 9.1.3 Drawing in the Foreground and Background


    The IMLPlus graphs enable you to draw in three distinct areas of a graph: the
    plot area foreground, the plot area background, and the graph area. Whenever possible,
    you should draw data-related curves and figures in the plot area in the data coordinate
    system, as shown in the previous sections.


    You can change the drawing region by calling the DrawSetRegion method. The method
    takes a single argument; valid values are PLOTFOREGROUND, PLOTBACKGROUND, and
    GRAPHFOREGROUND. The three regions are illustrated in Figure 9.9.


    **Figure 9.9** Three Drawing Regions


    ![](img/148549d50632967f185e36a8bcda3de8_202_0.png)


    If you specify the PLOTFOREGROUND parameter, anything you draw on the graph appears
    in the plot area in front of others, whether they are represented by markers,
    bars, or boxes. For example, if you draw a rectangle or polygon in this area,
    it might obscure observation markers that are behind it. In contrast, the PLOTBACKGROUND
    parameter specifies that drawn objects appear behind observation markers, bars,
    and boxes. The plot foreground and plot background share a common coordinate system.
    For example, if you set the coordinate system for the plot foreground using the
    DrawUserDataCoordinates method and use DrawSetRegion to set the drawing area to
    the plot background, you do not need to call DrawUserDataCoordinates a second
    time.


    > **Programming Tip:** The plot foreground and plot background share a common
    coordinate system.


    If you specify the GRAPHFOREGROUND parameter as an argument to DrawSetRegion,
    objects can be drawn anywhere in the graph. When you draw in this region, the
    objects will obscure axes, axis labels, and anything in the plot area. Consequently,
    it is best to draw in the margins of the graph area. (Margins are described in
    Section 9.3.) The graph area supports only the normalized coordinate system.'
  merge: -1
  pgno: 202
- img_proc: true
  md: '# 198 Chapter 9: Drawing on Graphs


    Programming Tip: The graph area supports only a normalized coordinate system.


    In general, adhere to the following recommendations:


    +   - Draw data-related lines and curves in the PLOTFOREGROUND. For example, regression
    curves or density estimates.

    - Draw filled polygons in the PLOTBACKGROUND (for example, confidence bands, bivariate
    confidence bands, and regions under a probability curve).

    - Display text, notes, and legends in the GRAPHFOREGROUND or PLOTFOREGROUND regions.
    If necessary, you can make room for drawing by calling the SetGraphAreaMargins
    or SetPlotAreaMethods in the Plot class, as described in Section 9.3.


    Programming Tip: Draw lines and curves in the PLOTFOREGROUND region. Draw regions
    in the PLOTBACKGROUND region. Draw legends in the GRAPHFOREGROUND regions.


    # 9.1.4 Case Study: Adding a Prediction Band to a Scatter Plot


    To illustrate the different regions, this section describes a program that extends
    the example in Section 9.1. The program creates a scatter plot of the Mpg_Hwy
    variable using Engine_Liters variable in the Vehicles data set. It adds a regression
    curve. The new features of the program are to add a band in the plot area background
    that indicates a region of 95% confidence for individual predictions, and to create
    a simple legend in the graph area foreground.


    The following re-state the plot and overlay the curve, as previously shown in
    Figure 9.3.


    ```

    / create a scatter plot; overlay curve +/

    submit;

    ods exclude ModelANOVA;

    proc glm data=Sauser.Vehicles;

    model Mpg_Hwy = Engine_Liters | Engine_Liters;

    output out=GLMOUT=Pred lcl=Lower ucl=Upper;

    quit;

    /* 1 */

    ```


    ```

    / need to sort data by explanatory (X) variable before plotting +/

    proc sort data=GLMOUT;

    by Engine_Liters;

    run;

    endsubmit;

    /* 2 */

    ```


    ```

    use GLMOUT;

    read all var ("Engine_Liters" "Mpg_Hwy"

    "Pred" "Lower" "Upper");

    close GLMOUT;

    /* 3 */

    ```'
