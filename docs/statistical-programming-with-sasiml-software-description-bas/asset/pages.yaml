    # 12.5 Examining the Distribution of Residuals


    A quantile-quantile (Q-Q) plot shows whether univariate data approximately follows
    some distribution. The most common Q-Q plot is the normal Q-Q plot, which graphically
    quantiles of data to quantiles of a normal distribution. The normal Q-Q plot is
    often used to check whether the residuals of a regression are normally distributed.


    There are several ways to compare the quantiles of data with the quantiles of
    a theoretical distribution. The UNIVARI procedure follows Blom (1958) recommends
    the following approach:


    +   1. Order $n$ nonincreasing data values: $x_{(1)} \le x_{(2)} \le \dots \le
    x_{(n)}$. These are the quantiles of the empirical cumulative distribution function
    (ECDF).

    2. For each $x_{(i)}$, compute the standardized quantity $v_i = (i - 0.375)/(n
    + 0.25).

    3. Compute the associated quantiles from the theoretical distribution: $q_i =
    F^{-1}(v_i)$, where $F$ is the theoretical distribution function with unit scale
    and zero location parameter.

    4. Plot the ordered pairs $(q_i, v_i)$ for $i = 1, \dots, n$.'
