    # ## 5.1 Overview of the IMLPlus Language


    The programming language of SAS/IML Studio is called *IMLPlus*. IMLPlus is an
    extension of SAS/IML that contains additional programming features. IMLPlus combines
    the flexibility of programming in the SAS/IML language with the power to call
    SAS procedures and to create and modify dynamically linked statistical graphics.
    Consequently, IMLPlus contains all of the capabilities of PROC IML that are described
    in earlier chapters, but it can also do much, much more.'
  merge: -1
  pgno: 114
- img_proc: true
  md: '# 110 Chapter 5: IMLPlus: Programming in SAS/IML Studio


    This chapter describes statements and features of the IMLPlus language that are
    not supported in the IML procedure in SAS 9.2. You can use these features from
    the SAS/IML Studio environment, but not from PROC IML. Consequently, this chapter
    also answers the question, “What are the advantages to using SAS/IML Studio instead
    of PROC IML?”


    Many of these features are described elsewhere in the book, but are collected
    and summarized here for easy reference. These IMLPlus statements and features
    enable you to use SAS/IML Studio to do the following:


    +   * Call SAS procedures from within IMLPlus and pass parameters to a SAS procedure
    from SAS/IML matrices

    * Call R functions from within IMLPlus

    * Create dynamically linked statistical graphs

    * Query, manipulate, and modify data that are stored in memory

    * Read and write data by using expressions for data set names

    * Define and use modules that are automatically loaded at run time, have local
    variables, and can be defined anywhere in the program

    * Dynamically define an alias for a module name

    * Access a rich library of modules, including dialog boxes that prompt for user
    input

    * Jump directly to the location of a programming error

    * Debug your program or interact with your data by using the PAUSE statement


    Some IMLPlus features have proved to be very popular and so might be implemented
    in future releases of the IML procedure. For example, the 9.22 and 9.3 releases
    of SAS/IML software include a SUBMIT block for submitting SAS statements and calling
    R functions from PROC IML.


    When you run an IML program, you are implicitly “in IML,” meaning that you do
    not need to use the PROC IML statement at the top of your program, nor do you
    need to end your program with the QUIT statement.


    > Programming Tip: IMLPlus programs do not require the PROC IML or QUIT statements.


    Although not required, the PROC IML and the QUIT statements are supported in IMLPlus.
    The PROC IML statement frees all matrices, clears user module definitions, closes
    any open data sets and files, and resets all SAS/IML options. The QUIT statement
    stops the execution of the program.'
  merge: -1
  pgno: 115
- img_proc: true
  md: '# 5.2. Calling SAS Procedures 111


    # 5.2 Calling SAS Procedures


    A powerful feature in SAS/IML Studio is the ability to call SAS procedures from
    within an IML program. This enables your IMLPlus programs to compute and use any
    statistic from any SAS procedure, a DATA step, and any macro program. You can
    call SAS procedures and DATA steps by writing SAS statements between a SUBMIT
    and ENDSUBMIT statement. The SAS statements in between are called a SUBMIT block.
    The statements in the SUBMIT block are sent to the SAS System for execution.


    This feature is described in Chapter 4, “Calling SAS Procedures."


    You should also use the SUBMIT statement for global SAS statements as the LIBENAME
    statement, FILENAME statement, the TITLE statement, the OPTIONS statement, and
    so on. In IMLPlus, statements executed in a SUBMIT block also persist outside
    the SUBMIT block. For example, if you define a lib by using a LIBENAME inside
    a SUBMIT block, you can use that lib in IMLPlus statements that are executed after
    the END.


    **Programming Tip:** Use the SUBMIT and ENDSUBMIT statements to send statements
    to SAS from within an IMLPlus program.


    # 5.2.1 Passing Parameters to a SAS Procedure


    It is possible to pass parameters to a SAS procedure from SAS/IML matrices. In
    this way, you can specify names of variables, data sets, and options to the procedure.
    To pass the contents of a matrix to a SAS procedure, list the name of the matrix
    on the SUBMIT statement. Inside the SUBMIT block, refer to the contents of the
    matrix by matching the name of matrix with an ampersand (&). IMLPlus substitutes
    the values of the matrix (converted to a row vector, with spaces between consecutive
    elements) before sending the SUBMIT block to the SAS System for processing.


    This feature is described in Chapter 4, “Calling SAS Procedures."


    # 5.2.2 Checking the Return Code from a SAS Procedure


    If there is an error in a SUBMIT block, your IMLPlus program will stop unless
    you handle the error. You can handle an error using the OK-option on the SUBMIT
    statement. The OK=option enables you to specify the name of a SAS/IML matrix that
    contains a return code from the procedure. The matrix contains the value 0 if
    there was an error in the SUBMIT block; otherwise, the matrix contains a nonzero
    value.


    This feature is described in Chapter 4, “Calling SAS Procedures."


    You can also determine the cause of an error in many situations by examining certain
    SAS macro variables that are created by the procedures. This feature is described
    in Section 4.8.'
  merge: -1
  pgno: 116
- img_proc: true
  md: '# 5.3 Calling Functions


    You can call built-in or user-written functions in the R statistical programming
    language from within an IMLPlus program. You can load user-defined packages and
    call functions in those packages. You exchange data between R and various SAS
    data formats. This feature is described in Chapter 11, “Calling Functions in the
    R Language.”


    # 5.4 IMLPlus Graphs


    The most powerful function in SAS/IML Studio is the ability to call SAS procedures
    from within an IMLPlus program, but SAS/IML also provides richness for creating
    and modifying statistical graphs.


    The IMLPlus graphs have several characteristics that appeal to data analysts:


    +   1. The graphs are easy to create. You can create a graph with a single programming
    statement, or by using the SAS/IML GUI through the Graph menu. SAS/IML automatically
    handles the details of laying out the graph, including axes, labels, and margins.
    Graphs are introduced in Chapter 7, “Creating Statistical Graphs.”

    2. The graphs are dynamically linked to each other. Observations that are selected
    in one graph are shown in all other graphs that view the same data. This topic
    is introduced in Section 6.6.

    3. You can modify the default graph attributes, such as the placement of ticks
    and margins. This feature is described in Chapter 10, “Marker Shapes, Colors,
    and Other Attributes of Data.”

    4. You can draw markers, lines, polygons, and other objects on a graph. This enables
    you to overlay the results of a statistical computation onto a scatter plot, histogram,
    or other graph. Collectively, the methods that draw on a plot are referred to
    as Draw methods because the names of the methods begin with the “Draw” prefix.
    This feature is described in Chapter 9, “Drawing on Graphs.”


    # 5.5 Managing Data in Memory


    The dynamically linked graphs in SAS/IML Studio are possible because SAS/IML Studio
    maintains an in-memory version of the data. You can programmatically query, manipulate,
    and modify these data. The data are managed by a class known as the DataObject
    class. You can use methods in the DataObject class to get or set properties of
    variables and observations. For details on the DataObject class, see Chapter 8,
    “Managing Data in IMLPlus,”'
  merge: -1
  pgno: 117
- img_proc: true
  md: '# 5.6 Using Expressions When Reading or Writing Data


    In the IML procedure, the names of data sets on the CREATE and USE statements
    have to be specified at the time that statement is written. For example, the following
    statement is valid:


    ```

    use Sashel.Class; /* valid statement */

    ```


    In the preceding statement, the data set is resolved at the time that the statement
    is parsed. In PROC IML, it is not valid to use a character matrix to define a
    data name at runtime. The following statements are not valid:


    ```

    DataName = "Sashel.Class"; /* invalid statement */

    DataName =

    ```


    In the second set of statements, the USE statement tries to find the Work.DataName
    data set instead of recognizing that DataName is a character matrix that contains
    the string "Sashel.Class." In IML procedure, you can work around this by using
    the SAS Macro Language Facility.


    In IMLPlus, the traditional syntax is supported, but you can also refer to the
    contents of a character matrix by placing parentheses around the matrix, as shown
    in the following statement:


    ```

    use (DataName); /* valid IMLPlus statement */

    ```


    Consequently, the names of data sets can be resolved at runtime, rather than at
    parse time.

    The statements in the following table are enhanced in IMLPlus to accept matrix
    expressions.


    # Table 5.1 Data Set Sets That Support Expressions in IMLPlus


    | CLOSE | CREATE | EDIT | SETIN |

    | SETOUT | SORT | USE |


    Furthermore, in IMLPlus, you can use a matrix expression (enclosed in parentheses)
    for the WHERE clause of any SAS/IML statement that has a WHERE clause. For example,
    the following statements are also valid in IMLPlus:


    ```

    whereName = "Mpg_City";

    DataName = "Sasuser.Vehicles";

    ```


    ```

    use (DataName) where((whereName)>=33); /* valid IMLPlus statement */

    read all var ("Make", "Model");

    close (DataName);

    ```'
  merge: -1
  pgno: 118
- img_proc: true
  md: '# Chapter 5: IMLPlus: Programming in SAS/IML Studio


    # 5.7 IMLPlus Modules


    IMLPlus modules have the basic syntax as modules in PROC IML (see Section 3.4).
    In particular, IMLPlus modules are defined with the START and FINISH statements.
    However, IMLPlus modules differ from modules in PROC IML in several important
    ways:


    +   - Not only do IMLPlus accept SAS/IML matrices as arguments, but they also
    accept Java objects as plots and data objects. This feature is described in Chapter
    6, “Understanding IMLPlus Classes."


    +   - Although PROC IML modules must be defined before calling, you can define
    an IMLPlus module anywhere in your program. For example, you can put all your
    modules at the end of your program. This is possible because the IMLPlus parser
    parses the entire program before executing the module.


    +   - In PROC IML you can load a module using the LOAD statement prior to calling
    the module. This is not required in IMLPlus. IMLPlus modules are stored in directories
    on your Windows PC. If you add these directories to your module search path, the
    modules are automatically loaded whenever they are called from a program.


    +   - You can dynamically define an alias for a module name. An alias is an alternative
    name for a module. It is similar to a function pointer in the C programming language.


    These features are described in the following sections.


    # 5.7.1 Storing and Loading IMLPlus Modules


    A module is a group of statements that can be called from programs. In IMLPlus,
    the module can be defined anywhere in your program: at the top of the program,
    at the bottom, or anywhere in the middle.


    If you write a module that you want to call from multiple programs, then you need
    to store the module. In SAS/IML Studio, modules are stored in directories of the
    Windows PC that is running SAS/IML Studio. This is different from PROC IML, which
    stores modules in a catalog on a SAS Workspace Server. To store a module, you
    use the STORE statement. But in what directory is the module stored? The module
    is stored in the default module storage directory (DMSD) on your Windows PC. To
    find the DMSD, select Tools►Options from the SAS/IML Studio main menu. Of the
    Options dialog box, select the Directories tab, as shown in Figure 5.1.'
  merge: -1
  pgno: 119
- img_proc: true
  md: '# Storing and Loading IMLPlus Modules 115


    Figure 5.1 The Module Search Path


    ![](img/148549d50632967f185e36a8bcda3de8_120_0.png)


    The Directories tab shows the directories that are automatically searched when
    IMLPlus tries to find a module. They are searched in the order shown in the Search
    Path list.


    When you use the STORE statement, IMLPlus writes two files to the directories
    specified in the Default Storage Directory field. The root name for the file is
    the same as the name of the module. The source code defines how the module is
    written to with the extension .sxs. The executable form of the module is stored
    in a file with the extension .xxs.


    What is potentially confusing is that IMLPlus stores the source code in the DMSD
    *even if you are editing that code in a different file!* This could result in
    two versions of the module source code.


    For example, suppose you are writing a module called MyModule that is defined
    in the file C:\MyProgram.sx (The .sx extension is used for SAS/IML Studio programs.)
    When you run the statement `module=MyModule`, IMLPlus creates a MyModule.xxs file
    and a My-Module.xxs file in your DMSD. If there is a run-time error in the module,
    SAS/IML Studio displays the version of the source code that is on the module path,
    not the source code in C:\MyProgram.sx. This might cause you to edit the copy
    in the DMSD instead of fixing the error in C:\MyProgram.sx.'
