    > **Programming Tip:** Use a line plot to compare the timing of each algorithm
    as a single parameter varied.


    # 15.4 Replicating Timings: Measuring Mean Performance


    Every time you run the program that creates Figure 15.7, you will get a slightly
    different graph. At first this might seem surprising. After all, there are no
    random numbers being used in the computation; the numerical computations are exactly
    the same time you run the program. Nevertheless, if you run the program on the
    same computer, you will observe different times.


    The resolution to this paradox is to recall that the operating system of a modern
    computer enables many applications to run “simultaneously.” However, the applications
    are not really running, spending a fraction of a second processing the computational
    needs of one application before moving on to the next.'
