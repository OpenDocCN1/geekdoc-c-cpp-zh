    # 11.2 Introduction to the R Language


    R is an open-source language and environment for statistical computing. The R
    language has many similarities with SAS/IML: it supports matrix-vector computations,
    it has a rich library of statistical functions, and it is intended primarily for
    researchers and statistical programmers. R supports the creation and distribution
    of packages: user-written functions, data, and documentation that can be added
    to the R library.


    These packages are sometimes written by leading researchers in the academic statistical
    community. In fields of statistics, it is common for authors of journal articles
    and books to create an R package that accompanies the publication. The R package
    includes functions that implement the main ideas of the publication and also provides
    data for the publication. In this way, researchers disseminate not only their
    statistical results but also a practical implementation of their ideas.


    There are over 2,400 Packages. Some packages are purpose libraries that implement
    functions in a particular statistical area. For example, the boot package (Canty
    and Ripley 2009) contains "functions and datasets for bootstrapping from the Bootstrap
    Methods and Their Applications by A. C. Davidson and D. V. Hinkley" (Davison and
    Hinkley 1997). Other packages contain a few functions (sometimes just one!) that
    implement particular computations from a journal article or from someone''s class
    project, masters thesis, or PhD dissertation.


    SAS/IML Studio 3.2 (released in July 2009) was the first SAS product to offer
    an interface to the R language. Beginning in SAS/IML 9.2, you can also call R
    from PROC IML. This chapter describes how to exchange data between R and various
    SAS formats, and how to call functions in the R language. This chapter does not
    teach you how to program in R, but how to incorporate knowledge of R into your
    SAS programs.


    The chapter assumes that a 32-bit Windows version of R is installed on the same
    PC that SAS/IML Studio runs. You can download R from CRAN: The Comprehensive R
    Archive http://cran.r-project.org. The SAS/IML Studio online lists versions of
    R that are supported.


    # 11.3 Calling R Functions from IMPLPlus


    You can call R functions from an IMPLPlus program using the SUBMIT and ENDSUBMIT
    statements. These are the same statements that are used to run SAS statements
    and procedures. The'
