    SAS: **coplot** produces a scatter plot for each level of $C$. The **coplot**
    function also graphically indicates the levels of $C$ next to the panel of scatter
    plots. This is shown in Figure 11.21, which is produced by the following statements:


    ```

    submit / R;

    coplot(Budget ~ ReleaseDate | MPAARating, data=MovieFrame)

    endsubmit;

    ```'
