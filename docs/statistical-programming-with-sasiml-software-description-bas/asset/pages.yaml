  md: '# 4.4. Passing Parameters to SAS Procedures


    # 4.4 Passing Parameters to SAS Procedures


    The previous section uses a SAS data set to communicate information between SAS/IML
    vectors and a SAS procedure. However, there are occasions in which it is convenient
    to pass information directly from a SAS/IML vector to a SAS procedure. For example,
    you might want to communicate with the name of a data set or the name of a variable
    to a SAS procedure.


    You can pass the contents of a SAS/IML vector as a parameter for a SUBMIT block
    by listing the name of the vector in the SUBMIT statement. You refer to the contents
    of the vector by preceding the vector name with an ampersand (&), as shown in
    the following program:


    ```

    /* pass the contents of character matrices to a procedure */

    VarName = "Budget"

    DSName = "Sasuser.Movies";


    submit VarName DName; /* IMLPlus statement */

    proc univariate data=$DSName;

    var &VarName;

    ods select Moments;

    run;

    endsubmit;

    ```


    Figure 4.3 Result of Passing Parameters to the UNIVARIATE Procedure


    | The UNIVARIATE Procedure |

    | Variable: Budget (million USD) |

    | Moments |

    | N | 359 | Sum Weights | 359 |

    | Mean | 44.8273677 | Sum Observations | 16093.025 |

    | Std Deviation | 41.9658513 | Variance | 1761.13267 |

    | Skewness | 1.76633581 | Kurtosis | 3.4916391 |

    | Uncorrected SS | 135193.45 | Corrected SS | 630485.497 |

    | Coeff Variation | 93.6165861 | Std Error Mean | 2.21487292 |


    In this program, the VarName and DName variables are used in the SUBMIT statement.
    Inside the SUBMIT block, the contents of these vectors are substituted for the
    tokens &VarName and &DSName. Consequently, the SAS System receives the following
    statements:


    ```

    proc univariate data=$Sasuser.Movies;

    var Budget;\ods select Moments;

    run;

    ```


    Although the use of the ampersand to refer to the contents of a variable is reminiscent
    of string substitution in the SAS macro language, this example does not create
    any macro variables. The substitution is made by IMLPlus before the statement
    is sent to the SAS system.'
  merge: -1
