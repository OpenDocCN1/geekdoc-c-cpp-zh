    \ Residuals\n\n| Honda | Civic Hybrid | Residual | Hybrid |\n|---|---|---|---|\n\
    | Nissan | Altima Hybrid | -15.39 | 1 |\n| Toyota | Camry Hybrid | -20.94 | 1\
    \ |\n| Toyota | Prius Hybrid | -16.24 | 1 |\n| Ford | Escape Hybrid FWD | -30.24\
    \ | 1 |\n| Lexus | 40X 2WWD | -17.84 | 1 |\n| Ford | Highlander Hybrid 2WD | -16.64\
    \ | 1 |\n| Lexus | Escape Hybrid 4WD | -14.44 | 1 |\n| Mercury | 40X 4WWD | -15.09\
    \ | 1 |\n| Toyota | Mariner Hybrid 4WD | -14.44 | 1 |\n| | Highlander Hybrid 4WD\
    \ | -15.09 | 1 |\n\nNotice the value of the Hybrid indicator is 1 for all of these\
    \ observations. This indicates that the hybrid vehicles do not satisfy the same\
    \ linear relationship as the others. A revised model might incorporate the Hybrid\
    \ variable as a classification variable in the model.\n\nThere is a potential\
    \ problem with each of the previous examples: what happens if there are no observations\
    \ that satisfy the specified criterion? In that case, the LOC function returns\
    \ an empty matrix that has zero rows and zero columns. It is invalid to use an\
    \ empty matrix as an index. In other words, it is an error to form an expression\
