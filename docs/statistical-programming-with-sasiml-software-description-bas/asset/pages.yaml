  md: '# 4.9. Calling SAS Functions That Require Lists of Values


    ```

    * define a module PROC IML that calls the IRR function in Base SAS.

    * This technique works for any Base SAS function that

    * is expecting a list of arguments instead of a vector.

    */

    start MyIRR(freq, c);

    /* convert numeric values in a matrix into a single string */

    args = strip(putn(freq, "BEST12.\));                                 /* string
    of the freq value */

    cc = putn(c, "BEST12.\);                                            /* character
    value of c */

    do i = 1 to nrow(ncol(c))

    /* concatenate all values */

    args = concat(args, " ", cc(i));

    do

    end;

    cmd = "rate" + args + " ";                                        /* function
    call as string */

    print cmd;                                                          /* optional:
    print command */


    call execute(cmd);                                                  /* execute
    the string */

    return (rate);                                                       /* return
    result */

    finish;


    freq = c = {-400, 100, 200, 300};

    /* call Base SAS function with vector arg */

    rate = MyIRR(freq, c);

    print rate;

    ```


    The module converts the numerical arguments into a comma-separated list. The matrix
    args is created as a character matrix that contains the first argument to text.
    The cc matrix contains the value of cash payments, converted to text. The DO loop
    concatenates all of these values into a comma-separated list. The cmd matrix is
    then created and contains the SAS/IML statement that calls the IRR with a list
    of arguments. The EXECUTE subroutine executes that command, and the value returned
    by IRR (in rate) is returned as the return value of MyIRR module.


    Figure 4.13 Result of a Module That Calls a Base SAS Function


