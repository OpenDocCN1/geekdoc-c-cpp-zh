  md: "# Appendix A: Description of Data Sets\n\nEngine_Cylinders the number of cylinders\
    \ in the engine\nMpg_City the EPA miles-per-gallon (MPG) estimate for city driving\n\
    Mpg_Hwy the EPA MPG estimate for highway driving\nMpg_Hwy_Minus_City the difference\
    \ between the MPG estimates for city and highway driving\n\n+   - Hybrid: an indicator\
    \ variable that contains the value 1 if the vehicle is a hybrid-electric vehicle\n\
    \n+   - Notes: a variable that indicates whether the vehicle is one of the following\
    \ vehicles:\n  - E85: the MPG estimates for this vehicle were measured for E85\
    \ fuel\n  - Gas: the MPG estimates for this vehicle were measured for gasoline\n\
    \  - HEV: the vehicle is a hybrid-electric vehicle\n  - Tax: the vehicle is subject\
    \ to a “gas guzzler” tax as required by the Energy Tax Act of 1978. The tax does\
    \ not apply to light trucks.\n\n# A.3 Movies Data\n\nThe movies data sets contain\
