  md: "# 12.8. Case Study: Comparing Least Squares and Robust Regression Models 297\n\
    \n+   6. Create a scatter plot of the Data and overlay regression lines for both\
    \ models.\n\n+   7. Create a scatter plot to compare residuals.\n\n+   8. Create\
    \ other interactive plots as needed for further analysis.\n\nThe program begins\
    \ by programmatically positioning the default output window and by clearing previous\
    \ output it contains. This is accomplished by using the OutputDocument class that\
    \ is described in the SAS/IML Studio online Help. The program proceeds as in Section\
    \ 12.2 by transforming the data and running the GLM procedure, as shown in the\
    \ following statements:\n\n```\n* compare regression models *\n/* 1. first window\
