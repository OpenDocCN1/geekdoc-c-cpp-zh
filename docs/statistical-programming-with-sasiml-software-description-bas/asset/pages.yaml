    # 2.2.2 The Dimensions of a Matrix


    You can determine the dimensions of a matrix by using NROW and NCOL functions,
    as shown in the following statements:


    ```

    /* dimensions of a matrix */

    n_x = nrow(w);

    p_x = ncol(w);

    print n_x p_x;

