    | Function | Description |

    | --- | --- |

    | SETDIF | Returns the elements of a set that are not in another set |

    | UNION | Returns the elements in the union of sets |

    | UNIQUE | Returns a sorted list of unique values |

    | XSECT | Returns the elements in the intersection of sets |


    # B.3.8 Formating Functions


    Table B.9 lists functions that are useful for formatting data and for manipulating
    character strings. Many of these functions are documented in the SAS Language
    Reference: Dictionary.


    Table B.9 Formatting Functions


    | Function | Description |

    | --- | --- |

    | CHAR | Returns the result of applying a w.d format to a numeric matrix |

