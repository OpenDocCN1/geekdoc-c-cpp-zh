    # 4.1 Overview of Calling SAS Procedures


    The SAS/IML language is very powerful and enables you to compute many statistical
    quantities. However, the SAS System has hundreds of procedures that compute thousands
    of statistics. If you want to compute a statistic that is already produced by
    a SAS procedure, why not call procedure directly?


    For example, you might want to compute the sample skewness of univariate data,
    which is a statistic produced by the UNIVARIATE procedure. or you might want to
    fit a linear model as implemented by the GLM procedure, or fit a kernel density
    estimate as computed by the KDE procedure. In these cases, it makes sense to take
    advantage of SAS procedures and their output, rather than duplicate the computation
    with SAS/IML statements.


    This chapter describes how to call a SAS procedure from an IMLPlus program. The
    SUBMIT and ENDSUBMIT statements are the only IMLPlus statements in this chapter.
    All other statements are standard SAS/IML statements. Beginning in SAS/IML 9.22,
    the SUBMIT and ENDSUBMIT statements are also available in PROC IML, although not
    all features of the IMLPlus implementation are'
