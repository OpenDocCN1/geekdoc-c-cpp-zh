    What can be learned from this example? First, by calling R functions in SAS/IML
    programs you can in, increase the SAS/IML library of functions. Second, by wrapping
    R statements in a SAS/IML module, you can encapsulate the R code; the program
    that can ignore the fact that R is used internally by the module. Third, the interface
    to R provided by SAS/ML Studio gives you tremendous flexibility to take advantage
    of algorithms in either software language. You can continue to use all of your
    existing knowledge about SAS programming while you evaluate statistical techniques
    implemented in R packages.


    # 11.9 Creating Graphics in R


    Advocates of R software often point to the graphics as a major reason for using
    R. In R, there is a graphical window that you can partition in order to create
    multiple plots in a single window. There are built-in high-level functions as
    plot and hist that create graphs, and other functions such as lines and points
    that overlay markers or curves onto an existing graph. There are also several
    graphical packages that you can use to create special graph types or to add functionality
    to the R graphics.


    You do not have to do anything special to use R from SAS/IML Studio. When you
    call an R graphical function, that creates a graphical window and draws to it.
    The graphical window is not part of the SAS/IML Studio workspace: it is owned
    and managed by the R process.


    The following statements create an R graph from an IMLPlus program:


    ```

    / create an R graph */

    run ExportDataSetToR("Sasuser.Movies", "MovieFrame");

    submit / R;

    plot(Budget ~ ReleaseDate, data=MovieFrame)

    endsubmit;

    ```


    A window appears the R graph, as shown in Figure 11.20. In contrast to the SAS/IML
    Studio graphics, the default graphics in R are not dynamically linked—either to
    each other nor to IMLPlus graphics of the same data. In particular, as explained
    in Section 11.4.2, the R graphs do not reflect any attributes that are associated
    with marker shape, color, or selection state, even if the data are transferred
    to R from an IMLPlus data object.'
