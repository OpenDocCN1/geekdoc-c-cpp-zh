  md: "# 9.4 A Module to Add Lines to a Graph 211\n\n```\nstart abline(Plot2D p, a,\
    \ b, attrib);\nif nrow(a)!=nrow(b) then\n    Runtime.Error(\"abline: incompatible\
    \ intercepts and slopes\")\n\np.GetAxisViewRange(XAXIS, xMin, xMax); /* get range\
    \ of x */\nx0 = xMin - (xMax-xMin);\nxf = xMax + (xMax-xMin)\np.GetAxisViewRange(YAXIS,\
    \ yMin, yMax); /* get range of y */\ny0 = yMin - (yMax-yMin)\nyf = yMax + (yMax-yMin)\n\
    \np.DrawUseDataCoordinates();\nif attrib then\n    p.DrawSetPenAttributes(BLUE,\
    \ DASHED,1);/* default attributes */\nelse if ncol(attrib)==1 then\n    p.DrawSetPenColor(attrib);\
    \ /* set color */\nelse if ncol(attrib)==3 then\n    p.DrawSetPenAttributes(attrib[1],\
    \ attrib[2], attrib[3]);\nelse if ncol(attrib)==4 then\n    p.DrawSetRegion(attrib)\n\
    d i = 1 to nrow(a);\nif b[i] then /* vertical line */\n    p.DrawLine(a[i], y0,\
    \ a[i], yf); /* horiz or diag line */\nelse\n    p.DrawLine(x0, a+b[i]*x0, xf,\
    \ a+b[i]*xf)\nend;\nfinish;\nstore module=abline;\n```\n\nThe details of the module\
    \ are straightforward. Notice that the default line is a thin, blue, dashed line.\
    \ Those are the attributes that are used if you place in a missing value for the\
    \ attrib attribute.\n\n> **Programming Tip:** Use the abline module to draw lines\
    \ (in the data coordinate system) on scatter plots, line plots, and histograms.\n\
    \nAs an example, consider Figure 9.13 which features two lines. One line is a\
    \ solid black line; the other is blue and dashed. You can draw these lines on\
    \ the scatter plot, p, by using the following statements:\n\n```\ndeclare ScatterPlot\
    \ p;\np = ScatterPlot.Create(dob, \"Mpg_City\", \"Mpg_Hwy\");\np.SetMarkerSize(6);\n\
    ```\n\n```\n/* regression lines for traditional and hybrid-electric */\nattrib\
    \ = BLACK || SOLID || 1; /* traditional = solid black line */\nrun abline(p, 2.71,\
    \ 1.20, attrib); /* y = 2.71 + 1.20*x */\n```\n\n```\nattrib = BLUE || DASHED\
    \ || 1; /* hybrid = dashed blue */\nrun abline(p, 7.36, 0.74, attrib); /* y =\
    \ 7.36 + 0.74*x */\n```"
