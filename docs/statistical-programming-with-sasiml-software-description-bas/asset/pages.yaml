  md: '# 372 Chapter 15: Timing Computations and the Performance of Algorithms


    # 15.2 Timing a Computation


    If a program is taking more time to run than you think it should, you can measure
    the time required by various portions of the program. This is sometimes called
    profiling the program. Suppose you have written a program that generates a random
    1000×1000 matrix, inverts it, and uses the inverse to solve a linear system, as
    shown in the following statements:


    ```

    * use the INV function to solve a linear system; not efficient *

    n = 1000;                                     /* size of matrix */nx = rannor(n,
    n, 1);                                 /* n x n matrix */ny = rannor(j, n, 1);                                 /*
    n x 1 vector */

    xInv = inv(x);                                     /* compute inverse of x */nb
    = xInv+y;                                     /* solve linear equation x+b=y */

    ```


    It takes several seconds to run this program, so you might want to identify where
    the bulk of the time is spent: allocating the matrices with random numbers or
    solving the linear system. The key to timing a computation is to use the TIME
    function in Base SAS software. The TIME function returns the time of day as a
    SAS value, which is the number of seconds since midnight. Therefore, if you call
    the TIME function immediately before and after a computation, the difference between
    those two times is the elapsed time (in seconds) for the computation. The following
    statements employ this technique to each portion of the computation:


    ```

    * time portions of the program to identify where time is spent *

    n = 1000;                                     /* size of matrix */

