    Depending upon your experience and interests, there are several paths through
    this book. Some readers might identify themselves with one or more of the following
    personas:


    **SAS/STAT Programmer:** This reader is familiar with the DATA step and with calling
    SAS/STAT procedures, but has no experience writing SAS/IML programs. This reader
    is interested in using SAS/IML software in conjunction with SAS/STAT procedures
    to perform statistical models.


    **Novice SAS/IML Programmer:** This reader has little or no experience writing
    SAS/IML programs, but wants to learn the basics of PROC IML and SAS/IML Studio.


    **Intermediate SAS/IML Programmer:** This reader is familiar with the basics of
    the SAS/IML language and wants to improve his programming skills and learn about
    the features in SAS/IML Studio.


    **Advanced SAS/IML Programmer:** This reader is proficient in SAS/IML programming
    and is interested in developing new algorithms and writing modules that implement
