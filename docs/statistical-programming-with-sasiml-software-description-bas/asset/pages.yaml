    To create the criterion plot, you must call the LOESS procedure and use the SMOOTH-option
    in the MODEL statement to fit models for lists of smoothing values, as shown in
    the following module:


    ```

    /* AICC criterion for a range of smoothing values */

    startComputeLinkedCriterion(ScatterPlot CritPlot, ScatterPlot p);

    /* 1. write data to server */

    p.GetVars(RCLE, XVarName);

    p.GetVars(RCLE, YVarName);

    declare DataObject dobj;

    dobj.WriteVarsToServerDataSet(XVarName//YVarName, "Work", "LoessIn", true);

    /* 2. call Loess to compute for criterion plot */

    submit XVarName YVarName

    proc loess data=&XVarName / select = AICC

    smooth = 0.05 to 0.9 by 0.01;

    ods output ModelSummary=LoessCriteria;

    run;

    endsubmit;

    /* 3. create object from SmoothingCriterion table */

    declare DataObject CritDobj;

    CritDobj = Data.CreateFromServerDataSet("Work.LoessCriteria");

    CritPlot = ScatterPlot.Create(CritDobj, "Smooth", "AICC");

    /* 4. create the criterion link to the original scatter plot */

    CritPlot.AddAttachedObject("OBsPlot", p);

    /* 5. create an action menu */

    CritPlot.AppendActionMenuItem("Draw Loess Curves for Selected Parameters",

    "run OnDrawLoessParam(); ");

    finish;


    /* call the module to create the criterion plot */

    declare ScatterPlot CritPlot;

    run ComputeLinkedCriterionPlot(CritPlot, p);

    ```


    The ComputeLinkedCriterionPlot module takes two arguments. The first argument
