    # 3.2 Reading and Writing Data


    You can create a matrix by reading data from a SAS data set. You can also create
    a SAS data set from the contents of a matrix. This section discusses both of these
    techniques.


    # 3.2.1 Creating Matrices from SAS Data Sets


    This section describes how to read data from a SAS library into SAS/IML vectors
    and matrices. If you have not already done so, follow the directions in Section
    1.8 to install the data in your book. (The examples in this book read data from
    the Sasuser library. If you install the data in a different SAS library, use that
    instead of Sasuser.)


    The Sasuser.Vehicles data contains engine characteristics and fuel efficiency
    for 1,187 vehicles sold 2007. You can read data from a SAS data set using the
    USE and READ statements. You can read variables into individual vectors by specifying
    a character matrix that contains the names of the variables you want to read.
    The READ statement creates column vectors with those names, as shown in the following
    statements:


    ```

    /* read variables from a SAS data set into vectors */

    varNames = ["Make" "Model" "Mpg_City" "Mpg_Hwy"];

    use Sasuser.Vehicles;

    /* open data set for reading */

    /* create four vectors: Make...,Mpg_Hwy */

    close Sasuser.Vehicles;

    /* */

    idx = 1:3;

    /* print only the first 3 observations */

    print (Make[idx]

    (Model[idx])

    (Mpg_City[idx])[label="Mpg_City"]

    (Mpg_Hwy[idx])[label="Mpg_Hwy"]);*/

    ```


