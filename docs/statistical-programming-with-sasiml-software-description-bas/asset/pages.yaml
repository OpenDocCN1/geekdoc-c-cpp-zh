    # 3.6 Case Study: Finding the Minimum of a Function


    This section shows how you can write a SAS/IML module to minimize a continuous
    function of one variable on a closed interval. To make the problem easier, assume
    that the function is unimodal, meaning that it has a minimum on the interval.


    There are many techniques for finding the minimum of a continuous function on
    a closed interval. The technique presented in this section is known as the golden
    section search (Thisted 1998). The basic idea is to bracket the minimum, meaning
    that you must find three points $a < x_1 < b$ such that the value $f(x_1)$ is
    less than the function evaluated at either endpoint. In the golden section search,
    the initial interval $[a, x_1]$ is smaller than $[x_1, b]$. A new point $x_2 \in
    [x_1, b]$ is chosen and the function is evaluated at $x_2$. If $f(x_1) < f(x_2)$,
    then $a < x_1 < x_2$ is a smaller interval that brackets the minimum. Otherwise,
    $x_1 < x_2 < b$ is a smaller interval that brackets the minimum. In either case,
    the process repeats with the new smaller interval. This process is schematically
    indicated in Figure 3.24.'
