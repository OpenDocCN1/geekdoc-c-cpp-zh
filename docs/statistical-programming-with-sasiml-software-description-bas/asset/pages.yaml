  md: '# 5.8. The IMLPlus Module Library 119


    Notice that MyFunc is not a module, since it is not defined by START and FINISH
    statements. Instead, it is an alias to a module. Some programming languages (such
    as C) have the concept of a function pointer. If you are familiar with function
    pointers, an alias is a similar concept.


    IMLPlus needs to know whether an alias is to a function or a subroutine, and needs
    to know how many arguments are in the function. Some programming calls call this
    *prototype* of a function. If you create an alias to a function (that is, to a
    module that returns a value), prefix the name of the alias with an asterisk:


    ```

    alias MyFunc(x) StatName;      /* the module returns a value */

    ```


    If, on the other hand, you create an alias to a subroutine (that is, to a module
    that does not return a value), then do not use an asterisk:


    ```

    alias MySubroutine(x) StatName;      /* the module is a subroutine */

    ```


