  md: "# 16.7 Creating a Dialog Box with R\n\nAs described earlier in this chapter,\
    \ SAS/IML Studio provides several simple dialog boxes that you can use to write\
    \ programs that present options and choices for users of the programs. However,\
    \ SAS/IML Studio does not provide a toolkit that enables you to design and build\
    \ arbitrary dialog boxes from within IMLplus. This section describes an advanced\
    \ technique: how to use R packages to build modal dialog boxes that can be incorporated\
    \ into IMLplus.\n\nThe examples in this section use the **tk** package (Dalgaugard\
    \ 2001), which is distributed with R. The Tel/Tk toolkit used by the **tk** package\
    \ is compatible with the Microsoft Windows versions of R by default. There are\
    \ other packages that have some of the low-level details of creating GUI components,\
    \ installing these packages can be a complicated undertaking. For example, R prefers\
    \ the gWidgets package, which uses the GTK toolkit. However, it is not trivial\
    \ to install the GTK2 toolkit, so this section uses the tk package.\n\nIf you\
    \ are not familiar with Tel and Tk, these tools are standards in building GUI\
    \ components. The Tool Command Language (Tel) is a scripting language often used\
    \ for building dialog boxes and even complete interfaces. The associated toolkit\
    \ of graphical user interface components is known as Tk.\n\n> **Programming Tip:**\
    \ The examples in this section use the **tk** package because it is distributed\
    \ with R. There are other packages (such as the gWidgets package) that you might\
    \ want to examine before deciding which package to use to create a dialog box.\n\
    \n# 16.7.1 The Main Idea\n\n```\n/ set default value to R; retrieve new value\
    \ *\nx = 0;\nrunExportMatrixR(x, \"Value\");\nsubmit / R;\n  # The user's choice\
    \ is recorded in the Value variable.\nValue <- 1\nendsubmit;\nrunImportMatrixFrom(x,\
    \ \"Value\");\nprint x;\n```\n\nThe main idea is to create one or more R variables\
    \ that contain the chosen options. These variables are imported into SAS/IML matrices,\
    \ and the algorithm continues based on the chosen options."
  merge: -1
  pgno: 409
- img_proc: true
  md: "# 16.7.2 A First Modal Dialog Box\n\nUsing the previous program as a template,\
    \ the following program creates a button on a Tk window. The window is created\
    \ as a modal dialog box, which means the user must dismiss the window before the\
    \ program continues. When the button is on pressed, the dialog dialog box sets\
    \ the Value to 1.\n\n```\n* create modal dialog box in R */\nx <- 0;\nrun ExportMatrixToR(x,\
    \ \"Value\");\nsubmit(R);\nlibrary(tcltk)\nwin <- tkoplevel() # 1. create a container\
    \ window\ntktitle(win) <- \"Main Window\" # 2. set title for container\n```\n\n\
    ```\nOnButton <- function() ( # 2. define handler for button\nValue <- 1 # set\
    \ value at global scope\ntkddestroy(win) # close the parent window\\)\n```\n\n\
    ```\nset.button <- tkbutton(\nwin,\n 3. create button\ntext = \"Set Return Value\"\
    , # specify parent window\ncommand = OnButton # button text\n) # func to call\
    \ upon button press\ntkgrid(set.button) # 4. add button to window\n```\n\n```\n\
    tkfocus(win) # 5. move the focus to the window\ntkwait(window) # wait until window\
    \ is closed\n```\n\n```\nrun ImportMatrixFromR(x, \"Value\");\nprint(x);\n```\n\
    \nThe window created by the program is shown in Figure 16.15. The following list\
    \ briefly describes the main R statements:\n\n+   1. The tkoplevel function creates\
    \ a window that contains a button. The variable win is an object that can be used\
    \ to set properties of the window. The tktitle function adds the title \"Main\
    \ Window\" to the window, although only the first few characters of the title\
    \ are visible in Figure 16.15.\n\n+   2. The button needs to call a function when\
    \ it is pressed. This function is called OnButton in the program. The function\
    \ does two things:\n\n+   a) It sets the Value to variable 1. Note that the <<-\
    \ operator sets the Value variable is set at the global scope of the program,\
    \ rather than being local to the OnButton function.\n\n+   b) It calls the tkdestroy\
    \ function which closes the main window.\n\n+   3. The tkgrid function arranges\
    \ the button with the text \"Set Return Value.\" When the button is pressed, the\
    \ OnButton function is called.\n\n+   4. The tkgrid function arranges the button\
    \ in the main window."
