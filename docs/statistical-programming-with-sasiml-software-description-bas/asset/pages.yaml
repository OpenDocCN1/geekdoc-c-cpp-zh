    values */

    NumMising = ceil(n<pct);                                        / number of missing
    values */

    x = x0;                                                           / copy original
    data */

    x[1:NumMising] = ;                                                / assign missing
    values */


    repl = 1 to Nplicates;                                         / repeat multiple
