    # 5.9.3 Using the Auxiliary Input Window as a Debugging Aid


    The Auxiliary Input window is a pop-up window in which you can execute program
    statements when your program is paused. A program is implicitly paused when it
    encounters a run-time error. You can explicitly pause a program by using the PAUSE
    statement (the next section). A common use of the Auxiliary Input window is to
    print the value of variables in order to better understand why a program has experienced
    a run-time error.


    In many situations, you can select View►Aux Input (or press F7) to display the
    Auxiliary Input window, as shown in Figure 5.5. You can type any valid IML statement
    into the Input area. Press the Execute button to run only those statements. The
    statements are executed at the scope of the innermost module that contains the
    error.


    Figure 5.5 The Auxiliary Input Window


    ![](img/148549d50632967f185e36a8bcda3de8_129_0.png)


    For example, after the previous example stops with an error, you can press F7
    to display the Auxiliary Input window, and then type the following statement in
    the Input area:


    ```

    print k x y;

    ```


    When you press Execute, the output from the PRINT statement is shown in the Auxiliary
    Input window. Notice that the variables k, x, and y are defined only in the module.
    This indicates that the Auxiliary Input window is executing statements within
    the scope of the MyMod module.'
