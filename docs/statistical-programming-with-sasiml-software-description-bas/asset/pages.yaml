  pgno: 429
- img_proc: true
  md: '# B.3.10 Control Statements


    A control statement enables you to iterate and conditionally execute certain statements.
    See Section 2.8 for more information. Table B.11 lists some of the important control
    statements.


    | Table B.11 Control Statements |

    | Statement | Description |

    | --- | --- |

    | DO | Iterates over a series of statements by incrementing a counter |

    | DO/UNTIL | Iterates over a series of statements until a condition is satisfied
    |

    | DO/WHILE | Iterates over a series of statements while a condition is satisfied
    |

    | IF-THEN/ELSE | Tests a condition and executes certain statements depending on
    whether the condition is true or false |

    | SUBMIT-ENDSUBMIT | Send statements to the SAS System or to R |


    The SUBMIT and ENDSUBMIT statements were introduced in SAS/IML 9.22.


    # B.3.11 Statements for Reading and Writing SAS Data Sets


    You can read data from a SAS data set into SAS/IML vectors. You can also read
    numerical (or character) data into a matrix. You can create SAS data sets from
    data that are in SAS/IML matrices. Table B.12 lists some of the statements that
    are useful for reading and writing data sets. See Chapter 3, “Programming Techniques
    for Data Analysis;” for details.


    | Table B.12 Statements for Reading and Writing Data |

    | Statement | Description |

    | --- | --- |

    | APPEND | Writes data from matrices |

    | CLOSE | Closes a SAS data set after reading or writing |

    | CREATE | Creates a SAS data set for writing |

    | READ | Reads data into matrices |

    | USE | Opens a SAS data set for reading |


    # B.3.12 Options for Printing Matrices


    You can print the values of one or more matrices by using the PRINT statement.
    You can list multiple matrices on a single print. If you separate the matrices
    with commas, each matrix is printed on a separate row. Table B.13 lists optional
    arguments that you can use to print matrices with headers or labels, or to format
    the data. See Section 2.2.1 for details.'
  merge: -1
  pgno: 430
