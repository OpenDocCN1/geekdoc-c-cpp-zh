  md: '# Chapter 14: Bootstrap Methods


    The starting point for the bootstrap example is a principal component analysis
    for several variables in the Sample subset of the Movies data set. The following
    program calls the PRINCOMP procedure to compute a principal component analysis
    of the variables Budget, US_Gross, Sex, Violence, and Profanity:


    ```

    * compute principal component analysis of data */

    DSName = "Sample";nVarNames = {"Budget" "US_Gross" "Sex "Violence" "Profanity"};


    submit DSName VarNames;

    ods select NobsVar EigenValues Eigenvectors;

    proc princomp data=DSName;

    var &VarNames;

    ods output Eigenvalues=EigenValues;

    run;

    endsubmit;

    ```


    Figure 14.11 Principal Component Analysis


    | The PRINCOMP Procedure |

    | Observations | |

    | Variables | 5 |

    | Eigenvalues of the Correlation Matrix |

    | Eigenvalue | Difference | Proportion | Cumulative |

    | 1 | 2.0804154 | 0.4417028 | 0.4162 | 0.4162 |

    | 2 | 1.69238376 | 0.94569316 | 0.3278 | 0.7440 |

    | 3 | 0.69356960 | 0.35620697 | 0.1387 | 0.8827 |

    | 4 | 0.3273642 | 0.08847516 | 0.0675 | 0.9502 |

    | 5 | 0.2488847 | | 0.0498 | 1.0000 |


    Let $P_i$ be the proportion of variance explained (PVE) for the $i$th principal
    component, $i=1\dots5$. This quantity is shown in the third column of the "Eigenvalues"
    table, shown in Figure 14.1. According to Figure 14.11, the first principal component
    explains 41.6% of the variance. But how much uncertainty is in that estimate?
    Is a 95% confidence interval for the PVE small (such as $[0.414,0.418]$) or large
    (such as $[0.32,0.52]$)? There is no analytic formula for estimating the confidence
    intervals for the PVE, but bootstrap methods provide a computational method to
    estimate the sampling distribution of $P_i$.


    A plot of the $P_i$ versus the component number, $i$, is called a scree plot.
    A scree plot for these data is shown in Figure 14.12. The goal of this section
    is to use bootstrap methods to estimate the variation in the Y coordinates of
    the scree plot.'
