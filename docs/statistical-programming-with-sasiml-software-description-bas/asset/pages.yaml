  md: "# 4.8. Handling Errors When Calling a Procedure 101\n\n# 4.8 Handling Errors\
    \ When Calling a Procedure\n\nIf you write an IMLPlus program that calls a SAS\
    \ procedure, you might need to know whether the procedure stopped with an error.\
    \ For example, the data could be degenerate in some way such as having too many\
    \ missing values or collinear variables. Or you could incorrectly specify an option.\
    \ You can use the OK= in the SUBMIT statement to determine whether a procedure\
    \ generated a SAS error and handle the error if one occurs.\n\nThe next program\
    \ is a variation of the example \"Passing Parameters to SAS Procedures\" on page\
    \ 93. In that program, an array of percentiles was passed into a SUBMIT block\
    \ and substituted into a call to the UNIVARIATE procedure. Recall that a value\
    \ per percentile (as specified in the PTCLTS=option in the OUTPUT statement of\
    \ the UNIVARIATE procedure) is a number in the range [0, 100]. If you specify\
    \ a number outside that range in the PTCLTS=option, the UNIVARIATE procedure generates\
    \ an error.\n\nThe next program intentionally substitutes a bad value into the\
    \ PTCLTS=option:\n\n```\n* use OK= option to check for errors in procedures /\n\
    percentiles = -1;                      /* intentionally cause an error! */\nsubmit\
    \ procedures / ok=mOK\nproc univariate data=Sasumer.Movies noprint;\nvar Budget;\n\
    output out=out ptclps=p ptclps=4percentiles;\nrun;\nendssubmit;\n```\n\n```\n\
    if mOK then do\n    errCode = symget(\"syserr\");\n    msg = symget(\"syserrortext\"\
    );\n    print errCode msg;\nend;\nelse do\n    /* process results /\nend;\n```\n\
    \nFigure 4.9 Error Codes and Messages from Procedures\n\n| errCode msg |\n| 2001\
    \ A percentile value is not within the required range of 0 to 100 |\n\nIn, the\
    \ value of the percentiles matrix is -1, which is an invalid percentile. The value\
    \ is substituted into the call to the UNIVARIATE procedure, which stops with an\
    \ error. Without the OK= option SUBMIT block that generates an error will stop\
    \ the execution of the IMLPlus program. By using the OK= option, the IMLPlus program\
    \ catches the error and sets the value of the mOK variable to 0. The program resumes\
    \ execution after the ENDSUBMIT statement.\n\nTypically, a procedure that generates\
    \ an error writes an error message to the SAS log, and"
  merge: -1
  pgno: 106
- img_proc: true
  md: "# 102 Chapter 4: Calling SAS Procedures\n\nsets two read-only automatic macro\
    \ variables. SYERR is set to zero if the procedure completes without error; otherwise,\
    \ it is set to a nonzero value. The macro variable SYSERRTEXT contains the last\
    \ error message written to the SAS log.\n\nIn the example, the IF-THEN statement\
    \ following the SUBMIT block handles errors by checking the value of the _error\
    \ variable. If the value is zero, the program uses SYMGET and SYGMGET functions\
    \ to get the values of the SYERR and SYSERRTEXT macro variables and prints those\
    \ Concepts. You can learn more about SAS processing in SAS Language Reference:\
    \ Concepts.\n\n**Programming Tip:** SAS procedures can terminate because of errors.\
    \ The OK= option in the SUBMIT statement when you run your IMLPlus program to\
    \ run, regardless of potential errors encountered in a SUBMIT block.\n\nBe aware\
    \ that interactive procedures such as DATASETS and REG behave differently from\
    \ noninteractive procedures regarding generating errors. An interactive procedure\
    \ is designed to execute when it reaches a RUN statement, and to stay running\
    \ even if an error occurs. Consequently, if you use an interactive procedure with\
    \ a RUN statement, the OK= value will always be nonzero, even if an error occurred.\
    \ To use the OK= option, use the QUIT statement to instruct an interactive procedure\
    \ to run and end.\n\n**Programming Tip:** Terminate interactive procedures with\
    \ the QUIT statement when you use the OK= option in the SUBMIT statement.\n\n\
    SAS procedures can also generate warnings. The OK= option does not help you to\
    \ detect and handle warnings because the OK= option returns nonzero (success)\
    \ even if the SUBMIT block generates a warning. However, there is a trick that\
    \ sometimes enables your IMLPlus program to detect and handle warnings. Many (though\
    \ not all!) SAS procedures set the value of the SYERR macro variable to the value\
    \ 4 when they write a warning message to the SAS log. You can use the following\
    \ program statements when it is important to handle warnings in a SUBMIT block:\n\
    \n```\n/* handle warnings in a SUBMIT block */\nerrorCode = symget(\"syserr\"\
    );\nif errorCode=4 then do;\n    msg = symget(\"syswarningtext\");\n    /* handle\
    \ warning */\nend;\nelse do;\n    /* process results */\nend;\n```\n\nThe read-only\
    \ macro variable SYWARNINGTEXT contains the last warning message written to the\
    \ SAS log. If a SUBMIT block generates a single warning, then you can obtain the\
    \ message though the SYWARNINGTEXT macro variable. Unfortunately, the SUBMIT block\
    \ generates multiple warnings, only the last warning is obtainable through the\
    \ SYWARNINGTEXT macro variable."
