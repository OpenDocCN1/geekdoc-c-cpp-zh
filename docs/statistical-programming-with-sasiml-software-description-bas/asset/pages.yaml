  md: "```\n/* use SURVEYSELECT to resample; use PROC to compute statistics */\nDSName\
    \ = \"Sample\"; /* 1 */\nVarName = \"Budget\";\nB = 1000;\n\nsubmit DSName VarName\
    \ B; /* 2 */\n/* generate bootstrap resamples */\nproc surveeselect data=DSName\
    \ out=BootSamp noprint\nseed=12345 method=urs rep=&B\n  rate = 1; /* 3 */\n\n\
    run;\n\n/* use procedure to compute statistic on each resample */ /* 4 */\nproc\
    \ means data=BootSamp noprint;\n  by Replicate; /* a */\n  freq NumberHits; /*\
    \ b */\n  var &VarName;\n  output out=BootDist mean=s; /* c */\nrun;\nendsubmit;\n\
    ```\n\nThe following list describes the main steps of the program:\n\n+   1. Define\
    \ SAS/IM variables that contain parameters for the analysis. These include the\
    \ name of the input data, the name of the variable in the bootstrap analysis,\
    \ and the number of bootstrap resamples to generate.\n2. Pass the parameters to\
    \ SAS procedures by listing the names of the SAS/IM variables on the SUBMIT statement.\n\
    3. Generate the bootstrap resamples by calling the SURVEYSELECT procedure. The\
