  md: '# 12.6. Regression Diagnostics for Models with Classification Variables 291


    The only additional modification to the program is in Step 10 where you need to
    adjust the value of p, the number of parameters in the model. You can manually
    code p=3 for this, but that is prone to error if you decide to add additional
    parameters to the model at a later date. A better idea is to obtain the degrees
    of freedom from one of the ODS tables created by the GLM procedure. Prior, to
    calling the GLM procedure, you can add the following statement:


    ```

    ods output ANOVA = ANOVA;

    ```


    This writes the ANOVA table to a SAS data set. The first element of the DF variable
    contains the degrees of freedom for the model. You can add 1 to the degrees of
    freedom to obtain the number of variables in the design matrix, as shown in the
    following statements:


    ```

    /* 10. draw reference lines on residual plot */

    use ANOVA;

    read point 1 var {DF}; /* first element is Model DF */

    close ANOVA;

    p = DF + 1; /* number of params (+1 for intercept) */

    ```


    You can use same technique (that is, reading relevant information from an ODS
    table created by PROC GLM) to read in the number of nonmissing observations from
    the NObs table. This is left as an exercise.


    **Programming Technique:** To ensure a robust analysis, read ODS tables created
    by procedures in order to obtain parameters used by the model, such as the number
    of observations, the model degrees of freedom, and so on. If you later change
    the model, the graphs and reference lines remain correct and do not require modification.


