  md: "# Coloring by Values of a Continuous Variable 233\n\nA naive implementation\
    \ would loop over all observations, and use the SetMarkerMethod to assign a color\
    \ for that observation based on the cutoff values for US_Gross. This is inefficient.\
    \ as pointed out in the section \"Writing SAS/IML Programs\" on page 79, you should\
    \ avoid looping over observations. It is always better to loop over categories\
    \ and use the LOC function to identify the observations that belong to each. The\
    \ following program loops over the four categories:\n\n```\n/ color each observation\
    \ based on value of a continuous variable */\ndeclare DataObject dob;\ndobj =\
    \ DataObject.CreateDataSet(\"Sasuser.Movies\");\ndobj.GetVarData(\"US_Gross\"\
    );\nEndpts = (25 100 200) || max(v);\nColor = BLUE || CYAN || ORANGE || RED;\n\
    do i = 1 to ncol(Color);\nidx = loc(Endpts[i]) & <=Endpts[i+1]);\nif ncol(idx)>0\
    \ then\n\tdobj.SetMarkerColor(idx, Color[i]);\nend;\n```\n\nThe following lists\
    \ the main steps of the program:\n\n+   1. The data in the US_Gross variable are\
