    # ## A.1 Installing the Data


    This book uses several data to illustrate the programming analyses and techniques.
    This appendix describes the data. The section “Data and Programs Used in This
    Book” on page 15 describes how to download and install the data sets used in this
    book.


    # ## A.2 Vehicles Data


    The Vehicles data set contains information about 1,187 passenger vehicles produced
    during 2007 as compiled by the US Environmental Protection Agency (EPA) Fuel Economy
    Guide. Each contains information about a vehicle. Some vehicles in the data are
    flexible-fuel vehicles (FFVs), which are vehicles that can run on gasoline or
    E85 (a mixture of 85% ethanol and 15% gasoline). These vehicles appear in the
    data twice, once with the MPG estimates for gasoline and once for the MPG estimates
    for E85. FFVs operating on E85 usually experience a 20-30% drop in miles per gallon
    due to ethanol''s lower energy content.


    The data set contains the following variables:


    | Category | a description of the vehicle type: compact car, large car, midsize
    car, and so forth |

    | Make | the vehicle’s manufacturer |

    | Model | the vehicle’s model designation |

    | Engine\_Liter | a measurement, in liters, of the size of the combustion chambers
    in the engine |'
