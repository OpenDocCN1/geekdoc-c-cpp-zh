  md: "# Chapter 5: IMLPlus: Programming in SAS/IML Studio\n\n# 5.7.1.1 Conventions\
    \ for Saving Modules\n\nOne way to avoid the previous problem is to carefully\
    \ adhere to the following conventions when you wrote a stored module. Assume the\
    \ name of your module is MyModule.\n\n+   1. Accept the current DMSD as shown\
    \ in Figure 5.1, or set a new DMSD. The DMSD will contain the source and executable\
    \ files for the module.\n2. Create a new program window in SAS/IML Studio (File→New→Workspace\
    \ or CTRL+N). Type or paste only the module definition and the STORE statement,\
    \ as shown in the following statements:\n\n```\nstart MyModule(/ ... arguments\
    \ ... */);\n  /* include all statements in the body of the module */\n  x = 1;\n\
    \  y = 2;\n  /* and so forth */\nfinish;\nstore module=MyModule;\n```\n\n+   3.\
    \ Save the program to a file named MyModule.sxs in your current DMSD. Note that\
    \ this file has the same name as the module.\n4. Run the program (Program→Run\
    \ or F5) to define and store the module.\n\nYou can now call the module from another\
    \ program. By creating a file called MyModule.sxs in the DMSD, prevent IMLPlus\
    \ from creating a copy of the module source code. The file Module.sxs contains\
    \ only the copy of the module source; if you need to update the module, edit that\
    \ .sxs\n\n> Programming Technique: Use the technique in this section to avoid\
    \ having multiple copies of the source code for a stored module.\n\n# 5.7.1.2\
    \ Loading IMLPlus Modules\n\nUnlike PROC IML, IMLPlus does not require that you\
    \ use the LOAD statement prior to running a userdefined module. Provided that\
    \ the module is on your module search path, the module does not need to be explicitly\
    \ loaded. You can refer to the section \"Summary of Module Storage Statements\"\
    \ in the online Help for other ways in which the LOAD, STORE, FREE, and REMOVE\
    \ statements are different in IMLPlus than in PROC IML.\n\n> Programming Tip:\
    \ SAS/IML Studio automatically finds and loads modules that are stored in directories\
    \ on the search path."
