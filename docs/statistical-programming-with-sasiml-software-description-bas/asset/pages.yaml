  md: '# R Functions and Missing Values 261


    # 11.6 Handling Missing Values


    When you transfer a SAS data set to R, missing values are automatically converted
    to the missing value in R, which is represented by NA. Similarly, an NA is converted
    to a SAS missing value when you transfer data from R into SAS software. There
    are some differences between the way that R statistical functions and SAS procedures
    handle missing values. This section describes these differences.


    # 11.6.1 R Functions and Missing Values


    The treatment of missing values in R varies from function to function. For example,
    the following statements compare the computation of a mean in SAS/IML to the same
    computation in R:


    ```

    /* compute mean in SAS/IML and in R */

    x = (., 2, 1, 4, 3);

    meanIML = x[:];

    print meanIML;

    run ExportMatrixToR(x, "x");

    submit / R;

    mean(x) # compute mean in R; this also prints the result

    endsubmit.

    ```


    Figure 11.9 Default Computation of Mean for Data Values


    | meanIML |

    | 2.5 |

    | [1] NA |


    Note that the result of the R mean function is NA because one of the elements
    of the x vector was missing. You can override this default behavior, as shown
    in the following statements:


    ```

    /* compute mean in R; omit missing values */

    submit / R;

    mean(x, na.rm=TRUE)

    endsubmit.

    ```


    Figure 11.10 Mean Computed by R after Removing Missing Values


    | [1] 2.5 |


    The na.rm= option specifies whether to remove missing values before the computation
