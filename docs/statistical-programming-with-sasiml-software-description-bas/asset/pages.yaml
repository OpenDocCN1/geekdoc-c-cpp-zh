    \ create bootstrap estimates for *any statistic*, $s$, even for which there are\
    \ no closed-form expression for the standard error and confidence intervals. However,\
    \ because the statistic in this example is the mean, we can use elementary statistical\
    \ theory to compute classical estimates (based on the sample) and compare the\
    \ bootstrap estimates to the classical estimates.\n\nThe sampling distribution\
    \ of the mean is well understood. The central limit theorem says that the sampling\
    \ distribution of the mean is approximately normally distributed with parameters\
    \ $(\\mu, \\sigma)$. The sample mean, $\bar{x}$, is an estimate for $\\mu$. An\
    \ estimate for $\\sigma$ is the quantity $\\sqrt{s^2/n}$, where $s^2$ is the variance\
    \ and $n$ is the size of the sample. Furthermore, the two-sided $100(1-\\alpha)\\\
