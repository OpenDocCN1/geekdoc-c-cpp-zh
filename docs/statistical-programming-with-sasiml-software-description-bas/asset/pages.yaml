    # 2.6 Extracting Data from Matrices


    This section describes various techniques for extracting or modifying the subsets
    of a matrix. The subsets include rows, columns, submatrices, and diagonal elements.


    You can specify elements of a matrix with one index or with two. For example,
    x[3] is the third element of the matrix x, specified in row-major order. Similarly,
    y[1,2] specifies the element in the first row and second column of the matrix
    y. You can use indices on either side of an assignment statement, as the following
    statements indicate:


    ```

    /* use indices on either side of assignment statements */

    x = { 1 2 3, 4 5 6 };

    y = x[2, 3]; /* set value of 2nd row, 3rd column */

