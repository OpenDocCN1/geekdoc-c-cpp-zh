    # 10.2.3 Coloring Variables by a Continuous Variable


    It is convenient to use marker shapes to indicate levels of a categorical variable.
    However, colors are better for encoding the values of continuous variables and
    discrete ordinal variables because you can associate one (say, blue) with low
    values and another (say, red) with high values. Often one or more colors are used
    to represent intermediate colors.


    The set of colors that represents values of a variable is called a color ramp
    (or sometimes a color map). A linear mapping is used to associate values of a
    variable to colors: the minimum value of the variable is mapped to the first color,
    the maximum value is mapped to the last, and some scheme is used to associate
    colors with intermediate values. Nonlinear schemes are sometimes used when the
    distribution of the values is highly skewed.


    The next two sections describe ways to associate colors with values. The simplest
    is for each color to represent a large range of values. (For example, you can
    divide the data into quarters.) In this scheme, there is no need to interpolate
    colors: each observation is placed into one bin, and each bin is assigned a color.
    The more complicated way to associate colors with values is to specify a small
    number of colors to interpolate colors so that only a small range of values is
    associated with a color.


    # One Color for a Large Range of Values


    Suppose you want to color observations in the Movies data set according to values
    of the US_Gross variable. You decide to use four colors to encode the US_Gross
    values: blue for movies with low values of US_Gross, cyan and orange for movies
    with intermediate values, and red for movies that generated large box-revenue
    offices. To be specific, suppose you want to associate revenue and colors by using
    the following rules:


    Table 10.2 Encoding Colors for Movie Revenue Ranges


    | US Gross | Color | Comment |

    | --- | --- | --- |

    | (0, 25] | BLUE | A flop |

    | (25, 100] | CYAN | A typical movie |

    | (100, 200] | ORANGE | A hit |

    | > 200 | RED | A blockbuster hit


    The values that divide one category from another are called cutoff values or sometimes
    break points. For this example, the cutoff values are 25, 100, and 200. The cutoff
    values, together with the minimum and maximum value of US_Gross, form endpoints
    of intervals. All values within an interval are assigned the same color.'
