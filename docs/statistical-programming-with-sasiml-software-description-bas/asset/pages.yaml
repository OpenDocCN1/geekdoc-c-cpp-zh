  md: '# Using the PAUSE Statement as a Debugging Aid 125


    If the source code for the module that contains the error is not in the same program
    window as the statement that calls the module, then SAS/IML Studio opens a new
    workspace that contains the module source code. This often happens when the error
    occurs within a saved module.


    # 5.9.4 Using the PAUSE Statement as a Debugging Aid


    The error log can help you determine where an error occurred, but the PAUSE statement
    can help you determine why a program is not getting correct answers. The PAUSE
    statement can be used to debug a program that gives wrong answers, but does not
    stop with an error. You can use the PAUSE statement in the main program and also
    inside modules.


    For example, suppose you want to monitor the values of variables in a loop. The
    following statements use a PAUSE statement at the end of a loop to pause the program
    and display the Auxiliary Input window:


    ```

    * pause program at the end of each iteration */

    do x = 5 to 1 by -1;

    y = log(x);

    z = log(y);

    pause "At the end of an iteration";nend;

    ```


    The Auxiliary Input window displays the string on the PAUSE statement. You can
    type any valid IMLPlus statements into the Input area and click Execute to execute
    the statements. Figure 5.6 shows the Auxiliary Input window that appears at the
    end of the first iteration. A PRINT statement was typed into the Input area; the
    values of the x, y, and z variables at the end of the first iteration are shown
    in the Output area. When you click Resume, the program continues from the statement
    following the PAUSE statement.


    If the text on the PAUSE statement begins with the string "NoDialog", then the
    Auxiliary Input window is not displayed, but the program still pauses its execution.
    The remainder of the message is displayed in the SAS/IML status bar (located in
    the lower left corner of the SAS/IML Studio application). This enables the person
    running the program to interact with the data before resuming the program, as
    described in Chapter 16, "Interactive Techniques."'
