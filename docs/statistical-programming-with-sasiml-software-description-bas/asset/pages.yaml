    You can call the DrawUseDataCoordinates method on a histogram, a scatter plot,
    a contour plot, a line plot, and a polygon plot, provided that these plots are
    not displaying any variables that contain categorical data.


    # 9.1.2.2 Drawing on a Graph That Displays a Categorical Variable


    Some graphs plot categorical data; others plot continuous data. Some graphs can
    handle both types of data. For example, a bar chart plots categorical data, although
    the vertical axis (which displays frequency or percentage) is continuous. A scatter
    plot can handle either type of data, although it is most often used to plot two
    continuous variables. The horizontal axis for a box plot is categorical, whereas
    the vertical axis is continuous.


    If your graph contains a categorical variable, then there is no "natural" coordinate
    system defined by the data. For example, Figure 7.13 shows a box plot for the
    US_Gross and MPAARating in the Movies data set. The horizontal axis for this plot
    does not have a numerical or maximum value. There is no intrinsic coordinate value
    that represents the center of the PG category. Nevertheless, you might want to
    draw on this box plot or on other graphs with a categorical axis. In this case,
    you would want to define your own convenient coordinate system for drawing.


    For example, suppose you want to model the dependence of US_Gross on MPAARating.
    You could modify Figure 7.13 so that it shows the mean revenue for each MPAA rating'
