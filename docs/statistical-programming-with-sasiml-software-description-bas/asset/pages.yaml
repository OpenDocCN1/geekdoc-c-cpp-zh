    # 9.7 Case Study: Plotting a Loess Curve


    The techniques presented in this chapter enable you to create dynamically linked
    statistical graphs, to call methods that change attributes of the graphs, to overlay
    curves or regions on the graph, and to draw text and figures in the plot area
    or in the margins of the graph. This section combines those techniques to overlay
    a curve on a scatter plot.


    The right side of Figure 9.18 shows a scatter plot of Budget versus ReleaseDate
    for the Movies data set. The graph suggests that movies released in the summer
    months and in the weeks before Christmas have larger budgets than those at other
    times. One way to model the relationship between these two variables is a nonparametric
    smoother.


    This section calls the LOESS procedure on data to determine how the mean budget
    of a movie is related to its release date. A loess model estimates the mean budget
    for a given release date, $t_0$, by local estimation: only the budgets for $k$
    movies released closest to $t_0$ are used to predict the budget at $t_0$. The
    parameter $k$ can be set explicitly, or the LOESS procedure can choose a value
    for'
