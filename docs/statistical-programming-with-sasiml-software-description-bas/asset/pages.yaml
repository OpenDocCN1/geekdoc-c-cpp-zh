    # 2.3.3 Pseudorandom Matrices


    Probability theory and statistics describe events that contain aspects of randomness.
    A **random number algorithm** is an algorithm that generates a sequence of numbers
    whose statistical properties are such that the sequence is indistinguishable from
    a truly random sequence. Of course, it is technically impossible to generate a
    random sequence, since by definition, a random process is not deterministic. Therefore,
    some people use the term *pseudorandom numbers* to describe a sequence of numbers
    that are generated by a computer and behave similarly to variates from a specified
    distribution.


    In SAS a pseudorandom sequence of numbers is initialized with a *seed value* that
    determines the sequence. If you use a different seed value, you get a different
    sequence of numbers.


    There are several SAS/IML functions and subroutines that generate pseudorandom
    variates. The UNIFORM and NORMAL functions generate randomates from the uniform
    distribution on [0, 1] and from the normal distribution respectively. For example,
    the following statements generate two variables that are linearly related to each
    other


    ```

    /* create pseudorandom vectors */

    seed = j0(10, 1, 1);           /* set seed (=1) and dimensions */

    x = uniform(seed);          /*10 x1 pseudorandom uniform vector */

    y = 3x + 2 + normal(seed);   /* linear response normal error */

    ```


    The UNIFORM and NORMAL functions are convenient for simple simulations and for
    quickly testing data. In the previous statements, the seed value is 1. The size
    and shape of the **seed matrix is a 10 x1 vector**, the column vector **x contains
    10 pseudorandom numbers in the interval [0, 1]. Similarly, the NORMAL function
    returns a normally distributed "error vector", so that the vector **y** is a linear
    function of **x** plus an error term.


    **Programming Tip:** Use the UNIFORM and NORMAL functions when you need to quickly
    generate a small random sample for an example or for testing purposes.


    The statistical properties of the pseudorandom numbers generated by the UNIFORM
    and NORMAL functions are not as good as those generated by the newer Mersenne-Twister
    random number'
