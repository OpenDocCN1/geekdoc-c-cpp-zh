    # 13.3.2 Compute Statistics for the Simulation


    The previous section simulated many outcomes for the coin-tossing game. If the
    simulation is correct, a statistic computed from the simulated outcomes is an
    estimate for a corresponding probability.


    # 13.3.2.1 What is the expected number of coin tosses in a game?


    If you play the coin game, what is the expected number of coin tosses in a game?


    For this problem it is possible to use elementary probability theory to compute
    the expected value. As stated earlier, the probability of a game consists of exactly
    $k$ flips is $2^{-k}$. Therefore, the expected value for the number of flips is
    $\sum_{k=1}^{\infty} k 2^{-k}$. You can use techniques from calculus to show that
    this series converges to the value 2.'
