  md: "# 2.1 Overview of the SAS/IML Language\n\nSAS/IML is a programming language\
    \ for high-level, matrix-vector computations. Matrices are rectangular-arrays\
    \ that usually contain numbers. A matrix that contains character data is often\
    \ explicitly called a *character matrix*. In statistical programming, matrices\
    \ often hold data for analysis. Each row of the matrix is an observation; each\
    \ column of the matrix is a variable.\n\nIf you are in a matrix, you can carry\
    \ out many statistical operations using matrix operations. The SAS/IML language\
    \ has functions and matrix operations that enable to manipulate matrices as a\
    \ unit, regardless of the number of rows or columns in the matrix. For an example,\
    \ the section “Case Study: Standardizing the Columns of a Matrix” on page 83.\n\
    \nOperations on numerical matrices are also used to describe a wide variety of\
    \ statistical techniques, including ordinary least squares (OLS) regression and\
    \ principal component analysis.\n\nThis chapter is an introduction to the SAS/IML\
    \ syntax. It includes basic information about how to define matrices, compare\
    \ values, and functions and subroutines. It includes a description of basic programming\
    \ statements such as IF-THEN/ELSE and the iterative DO statement.\n\n# 2.2 Creating\
    \ Matrices\n\nA matrix is an $n \times p$ array of numbers or character strings.\
    \ The integers $n$ and $p$ are the dimensions of the matrix. The row dimension\
    \ is $n$; the column dimension is $p$. A vector is a special case of a matrix.\
    \ An $n \times 1$ matrix is called a *column vector*, whereas a $1 \times n$ matrix\
    \ is called a *row vector*. A $1 \times 1$ matrix is called a *scalar*. In general,\
    \ this refers to any SAS/IML variable as a matrix, regardless of its dimensions.\n\
    \nIn a SAS/IML program, all variables are matrices, so you do not need to specify\
    \ the type of a variable. Furthermore, matrices are dynamically reassigned as\
    \ needed, so you do not need to specify the size or type (numeric or character)\
    \ of a matrix. For example, the following statements are valid:\n\n```\n/* create\
    \ matrices of various types and sizes */\nx = {1}; /* scalar */\nx = {1 2 3};\
    \ /* reassign to row vector */\ny = {1 2 3 4 5 6}; /* 2 x 3 numeric matrix */\n\
    y = {\"male \"female\" /* reassign to 1 x 2 character matrix */\n```\n\nSee the\
    \ section “Running a PROC IML Program” on page 7 for instructions on how to run\
    \ SAS/IML programs. The first statement creates x as a numerical scalar matrix.\
    \ The second statement redefines x as a row vector; spaces separate in different\
    \ columns. The third statement defines y as a $2 \times 3$ numerical matrix; commas\
    \ indicate a new row. The last statement redefines y as a $1 \times 2$ character\
    \ matrix."
  merge: -1
  pgno: 23
