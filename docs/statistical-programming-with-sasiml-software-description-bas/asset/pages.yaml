  md: '# Comparing Analyses in Different Workspaces 293


    Although this section presents techniques in the context of regression models,
    most of the ideas in this section apply equally well to other comparisons such
    as comparing density estimates or comparing multivariate analyses.


    # 12.7.1 Comparing Analyses in Different Workspaces


    SAS/IML Studio uses the concept of workspaces to help you organize your work.
    Every time you create a new program or a new data set, SAS/IML Studio application
    creates a new button to the workspace bar at the bottom of the new SAS/IML Studio
    window. You can see the workspace bar at the bottom of Figure 12.6.


    When you click on the workspace bar, all windows that are associated with the
    chosen become visible. By default, windows that are associated with other workspaces
    are hidden. This makes it difficult to compare, for, the output from two different
    programs. However, it is easy to SAS/IML Studio to display the output from different
    workspaces at the same time. Assume one of the workspaces is named A and another
    is named B. The following steps enable you to compare the output window in Workspace
    A with the output window in Workspace B:


    +   1. In Workspace A, click on the icon on the left side of the title bar. A
    menu appears, as shown in Figure 12.7. (When the output window is active, you
    can also press ALT+HYPHEN to display this menu.)


    +   2. Select Auto Hide from the menu. This toggles the Auto Hide property for
    the window. When the property is not selected, the window is visible regardless
    of the active workspace.


    +   3. Position the output window for easy comparison. For example, move it so
    that it occupies the entire left side of the SAS/IML Studio application.


    +   4. Click B on the workspace bar to activate Workspace B. Notice that the output
    window from Workspace A is still visible.


    +   5. On the output window for Workspace B, display the control menu and select
    Auto Hide. Now the output window for Workspace B is visible regardless of the
    active workspace.


    +   6. Position the output window for Workspace B for easy comparison. For example,
    move it so that it occupies the entire right side of the SAS/IML Studio application.'
  merge: -1
  pgno: 298
