  md: '# Chapter 1: An Introduction to SAS/IML Software


    Figure 1.5 Client-Server Architecture for SAS/IML Studio


    ![](img/148549d50632967f185e36a8bcda3de8_15_0.png)


    The bottom image indicates the scenario in which SAS Foundation is installed on
    a remote computer. In this case, SAS/IML Studio connects to the remote SAS Workspace
    Server. In fact, each workspace in SAS/IML Studio can connect to a different server.
    The remote computer can be running any operating systems that SAS software supports.
    You need to use the SAS Metadata Server Wizard (found under the Tools menu in
    the SAS/IML Studio main menu) to choose the remote SAS servers to which SAS/IML
    Studio can connect.


    The programs in this book run whether or not the SAS Foundation is installed on
    the same PC as the SAS/IML Studio application. However, many SAS administrators
    configure remote SAS servers so that the Sasuser library is read-only, whereas
    local SAS servers enable users to read and write to the Sasuser library. This
    affects the installation of the example data sets that are distributed with this
    book. See Section 1.8.


    # 1.3.4 Installing and Invoking SAS/IML Studio


    SAS/IML Studio requires SAS 9.2 and is distributed as part of the SAS/IML product.
    If SAS/IML Studio was not installed on your PC when the SAS System was installed,
    you can download and install SAS/IML Studio from support.sas.com/apps/demosdownloads/setupintro.jsp.


    After the software is installed, you can invoke SAS/IML Studio by selecting Start►Programs
    ►SAS SAS/IML Studio 3.3.


    You can create a new program window by clicking Create a New Program from the
    Welcome dialog box, or by selecting File►New►Workspace (or CTRL+N). When you create
    a new program window, you also create a new workspace.'
  merge: -1
