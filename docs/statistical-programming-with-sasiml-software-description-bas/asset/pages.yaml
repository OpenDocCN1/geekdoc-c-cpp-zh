    # 3.3.4 Handling Missing Values


    It is common to have missing values in data. For example, in the Sasuser.Movies
    data, there are 25 missing values for the World_Gross variable. Similarly, there
    are missing values for the Distributor variable for those movies that are "independent
    films". Missing values can occur for a variety of'
  merge: -1
