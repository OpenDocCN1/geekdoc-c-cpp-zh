  md: '# 162 Chapter 7: Creating Statistical Graphs


    data set. (The left graph shows the default appearance of a box plot in SAS/IM
    Studio.) The right graph shows a box plot for the same data, but labels important
    features of the box plot.


    A box plot enables you to find the five-number summary of the data: the minimum
    value, the 25th percentile, the 50th percentile, the 75th percentile, and the
    maximum value. (The 25th, 50th, and 75th percentiles are also the first quartile
    (Q1), the median, and the third quartile (Q3), respectively.) For example, Figure
    7.11 indicates the five-number summary for the US gross revenues for G-rated movies.
    The minimum value is about 8 million dollars. The quartiles of the data are approximately
    25, 55, and 85 million dollars. The maximum value is about 245 million dollars.


    A box plot has a wide central box that contains 50% of the data. The upper and
    lower edges of the box are positioned at the 25th and 75th percentiles of the
    data. A line segment inside the box indicates the median value of the data. The
    height of the box indicates the interquartile range (IQR), which is a rough estimate
    of the scale of the data.


    Above and below the main box are two thinner boxes that are called whiskers. The
    lengths of the whiskers are determined by the IQR. Specifically, the upper (respectively,
    lower) whisker extends to an observation whose distance from the 75th (respectively,
    25th) percentile does not exceed 1.5IQR. If there are observations whose distance
    to the main box exceeds 1.5IQR, these observations are plotted individually and
    called univariate outliers.


    Figure 7.11 Main Features of a Box Plot


    ![](img/148549d50632967f185e36a8bcda3de8_167_0.png)


    # 7.7.1 Creating a Box Plot


    You can create a box plot that schematically shows the distribution of a single
    variable. Figure 7.12 shows a box plot for the US_Gross variable for all movies
    in the Movies data set.'
