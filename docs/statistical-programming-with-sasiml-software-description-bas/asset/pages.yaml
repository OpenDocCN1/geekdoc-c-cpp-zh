    # 13.8 The Birthday Matching Problem


    The birthday matching problem is a well-known problem in elementary probability.
    A statement of the problem is "If there are N > 2 people in a room, what is the
    probability that two or more share the same birthday?" problem has been studied
    and presented in many places. The ideas in this section are inspired by the excellent
    presentation by Trumbo, Suess, and Schupp (2005).


    One of the reasons this problem is often discussed is because many people find
    the probabilities in the problem to be surprising. For example, if N = 25, the
    chance of at least two people sharing a birthday is about 57%%


    # 13.8.1 A Probability-Based Solution for a Simplified Problem


    The birthday matching problem is usually presented under the following assumptions:


    +   - The people in the room are randomly chosen

    - A year consists of 365 days; no one in the room was born on February 29

    - Birthdays are uniformly distributed throughout the year'
  merge: -1
  pgno: 337
- img_proc: true
  md: '# A Probability-Based Solution for a Simplified Problem 333


    This last assumption is called "uniformity assumption." Under these three assumptions,
    you can use elementary probability theory to compute the probaching of matching
    birthdays. (Actually, it is simpler to compute the complement: the probability
    that no one in the room has a matching birthday.) Number the people in the room
    $1,...,N$. The probability that the second person does not share a birthday with
    the first person is $364/365$.


    The probability that the third person''s birthday does not coincide with either
    of the first two people'' birthdays is $363/365$. In general, the probability
    that the $i$th person''s birthday does not coincide with any of the birthdays
    of the first $i-1$ people is $(365-i+1)/365 = 1-(i-1)/365, i=1,...,N$.


    Let $Q_N$ be the probability that no one in the room has a matching birthday.
    By the assumption that the people in the room are chosen randomly from the population,
    the birthdays are independent of each other, and $Q_N$ is just the product of
    the probabilities for each person:


    ```

    $Q_N = \prod_{i=1}^{N} (1 - (i - 1)/365)$

    ```


    If $R_N$ is the probability that two or more people share a birthday, then $R_N=1-Q_N$.


    You can use the index operator (*) to create a vector whose $i$th element is the
    probability that there is not a common birthday among the first $i$ individuals.
    It is easy to use the subscript product operator (#) to form the probabilities.
    For example, if $N=25$ people in a room, then the following statements compute
    $R_{25}$, the probability that at least two people share a birthday:


    ```

    /* compute probability that at least two people share a birthday

    in a room that contains N people */

    N = 25;                               /* number of people in room */

    i = 1:N;

    iQ = 1 - (i - 1)/365;                    /* individual probabilities */

    Q25 = iQ[#];                             /* product: prob of no match */

    R25 = 1 - Q25;                           /* probability of match */

    print R25;

    ```


    **Figure 13.14** Probability of a Shared Birthday ($N=25$)


    | R25 |

    | --- |

    | 0.5686997 |


    For 25 people in a room, the computation shows that there is about a 57% chance
    that two or more share a birthday. Notice the value of $Q_i$ is simply $(1-(i-1)/365)$
    times the value of $Q_{i-1}$.


    You can compute the quantity $Q_N$ for a variety of values for $N$. Therefore,
    you can compute the value of $Q_i$ iteratively, as shown in the following statements:'
