  md: '# 9.8 Changing Tick Positions for a Date Axis


    This section describes how the placement of ticks on a graph that displays a date
    variable.


    Although Figure 9.21 adequately displays the data and loses its fit of the data,
    the tick marks for the horizontal axis are less satisfactory. It is difficult
    to discern the location of Christmas day and of the summer months—dates that are
    important for the analysis of the data. This section describes how you can modify
    the placement of ticks on an axis using the SetAxisTicks method.


    The IMPlus graph draws numeric axes with evenly spaced tick marks. The two parameters
    that are used to control the placement of numeric tick marks are the anchor position,
    x0, and the axis unit, Δx. (The IMPlus methods that set these parameters are SetAxisTickAnchor
    and SetAxisTick.) This approach does not work well for date data because the months
    of the year have a different number of days, there is no value for Δx that results
    in, say, tick marks at the beginning of each month.


    The resolution to this difficulty is to use irregularly spaced ticks. You can
    use the SetTicks method to specify the positions and labels for tick marks.


    For definiteness, you want to modify Figure 9.21 to display a tick mark at the
    beginning of each month. How can you accomplish this? Recall that the ReleaseDate
    variable contains the unformatted numeric values, as discussed in Section 7.10.
    In particular, you can use SAS/IMM statements to find the minimum (earliest) and
    maximum (latest) release date. You can use values to enumerate each day between
    those values. You can then apply a DateW format to those numbers and use string
    matching functions to find the values that correspond to the first day of each
    month. The following statements carry out this algorithm:


    ```

    * plot ticks at beginning of each month when data has DATE format */

    xData = ReleaseDate;    /* 5 */

    fmt = "DATE7";


    allX = min(xData):max(xData);

    /* 6 */

    allText = putn(allX, fmt);    /* 7 */


    q = substr(allText, 1, 2);\  /* 8 */

    idx = loc(q="01");          /* 9 */

    pos = allText[idx];

    values = allText[idx];


    print (pos[1:5]) [label="pos"] (values[1:5]) [label="value"];    /* 10 */

    p.SetAxisTicks(XAXIS, pos, values);

    ```'
