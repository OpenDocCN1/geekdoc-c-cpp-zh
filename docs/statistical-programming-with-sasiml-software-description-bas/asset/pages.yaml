  md: '# 7.11 Summary of Creating Graphs


    You can create graphs in two ways: from SAS/IML vectors and from an object of
    the DataObject class. The DataObject class enables you to create dynamically linked
    graphs. Graphs that are created from the same data object are automatically linked
    to each other.


    Creating a graph from SAS/IML vectors is quick and often convenient, but it has
    the following drawbacks:


    +   1. The graphs that are created from vectors initially display “X” for the
    label of the horizontal axis. You use the SetAxis method to explicitly set a label,
    but this is somewhat inconvenient.


    +   2. If a variable contains a format, that format is lost when the variable
    is read into a SAS/IML vector. For example graphs in this chapter use the ReleaseDate
    variable must explicitly set a DATEw: format if the dates are to be displayed
    correctly.


    +   3. Any variable not specified when creating the graph is lost. For example,
    you cannot label observations by the names of movies in order to better identify
    interesting observations.


    +   4. Two graphs created from the same data are completely independent. When
    you create graphs from vectors, you cannot select PG-rated movies in a bar chart
    and show those same movies highlighted in a second graph, as shown in Figure 6.5.


    Graphs created from a data object do not suffer from these drawbacks. IMLPlus
    graphics created from a common data object are dynamically linked to each other
    and automatically display variable names and formats. Most of the graphs in this
    book are created from a data object.


