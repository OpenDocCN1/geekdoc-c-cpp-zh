  md: "# 210 Chapter 9: Drawing on Graphs\n\n# 9.4 A Module to Add Lines to a Graph\n\
    \nIn creating graphs, it is often useful to overlay reference lines. The simplest\
    \ reference line is a horizontal line. For example, you might want to add a reference\
    \ line at zero on a residual plot in order to separate positive residuals from\
    \ negative. It is often useful to display the identity line. In regression diagnostics\
    \ (see Chapter 12), it is useful to display lines that have statistical significance,\
    \ such as lines that indicate large residuals or high-leverage values for observations.\n\
    \nReference lines are used so frequently that it is worthwhile to construct a\
    \ SAS/IML subroutine to draw a reference line. A convenient syntax for a module\
    \ that overlays the line defined by the equation $y = a + bx$ is as follows:\n\
    \n```\nrun abline(plot, a, b, attrib);\n```\n\nwhere the arguments are as follows:\n\
    \n+   * plot: an object of the Plot2D class which is a ScatterPlot, LinePlot,\
    \ or Histogram. A line will be added to this graph.\n* a: specifies the intercept\
    \ of the line. If this argument is a $k \\times 1$ vector, then $k$ lines are\
    \ drawn.\n* b: specifies the slope of the line. To specify a vertical, you can\
    \ adopt the convention that the slope is a missing value and the $a$ parameter\
    \ specifies the x-intercept. If this argument is a $k \\times k$ vector, then\
    \ $k$ lines are drawn.\n* attrib: specifies the color, style, and width of the\
    \ line. You can adopt the convention that if this argument is a missing value,\
    \ default attributes are used. If this argument is a scalar integer, assume that\
    \ it specifies a color. If this argument contains four elements, assume that the\
    \ last element is either PLBACKGROUND or PLOTFORE.\n\nThe following statements\
    \ define a module that is used in subsequent section to add reference lines to\
    \ regression diagnostics plots:\n\n```\n/ Module to draw a vertical, horizontal,\
    \ and diagonal lines\n* on a scatter plot, line plot, or histogram.\n* The form\
    \ of the line is $y = a + bx$.\n* INPUT: p: a Plot2D object: ScatterPlot, LinePlot,\
    \ or Histogram\n* a: specifies the intercept for the line\n* b: specifies the\
    \ slope for the line\n* attrib: specifies line attributes\n* if attrib = ., use\
    \ default attributes\n* if attrib = 0XRGBB, it specifies a color\n* if ncol(attrib)=3,\
    \ attrib = {color, style, width}\n* if ncol(attrib)=4, attrib = {color, style,\
    \ width,PlotRegion}\n* \n* For a vertical line, a= x-intercept and b=. (MISSING).\n\
    * To specify multiple lines, the parameters a and b can be column vectors.\n*/\n\
    ```"
  merge: -1
  pgno: 215
