  md: "However, in general, the SAS/IML technique has value for several reasons:\n\
    \n+   1. You might be right writing the analysis in SAS/IML module (see Section\
    \ 3.4), or the data may not exist in any SAS data set. In these instances, it\
    \ might be more efficient to compute a desired analysis completely in the SAS/IML\
    \ language than to write the data to a data set, call a SAS procedure, and then\
    \ read the results into SAS/IML matrices.\n\n+   2. The goal of the technique\
    \ might not be to compute a statistic. In an IML program, you might want to color\
    \ observations according to their category, or exclude observations from an analysis\
    \ if some criterion is true.\n\n+   3. You can use the technique to compute statistics\
    \ that are not available in any SAS procedure. For example, you can use the technique\
    \ to implement a proprietary algorithm or to compute a new statistic that recently\
    \ appeared in a journal article.\n\n# 3.4 Defining SAS/IML Modules\n\nA powerful\
    \ programming feature in the SAS/IML language is the ability to define your own\
    \ module. A module is a user-defined function or subroutine that can be called\
    \ from programs. A module can return a value or not. A module that returns a value\
    \ is called a function module. You can use a function module as part of an expression.\
    \ A module that does not return a value is called a subroutine module. You can\
    \ call a subroutine using the CALL or RUN statement.\n\nA module enables you to\
    \ reuse and maintain related SAS/IML statements in a convenient way. You can pass\
    \ matrices from your program into the module to provide input data and control\
    \ the way module behaves.\n\n# 3.4.1 Function and Subroutine Modules\n\nYou define\
    \ a module using the START and FINISH statements. The START statement defines\
    \ the name of the module and the arguments.\n\nThere are two kinds of modules:\
    \ functions and subroutines. You can use the RETURN statement to return a value\
    \ from a function module. A subroutine usually modifies one or more matrices that\
    \ are passed into the module.\n\nFor example, the following statements define\
    \ a function module that returns the Pearson coefficient between two column vectors:\n\
    \n```\n/* module to compute Pearson correlation between two column vectors */\n\
    start Corr(x, y);      /* assume no missing values: */\nxStd = standard(x);  \
    \    /* standardize data */\nyStd = standard(y);\ndf = nrow(x) - 1;          \
    \     /* degrees of freedom */\nreturn ( xStd * yStd / df ); \nfinish;\n```"
