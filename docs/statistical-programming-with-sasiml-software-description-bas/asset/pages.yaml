  md: '# Appendix C: IMLPlus Classes, Methods, and Statements


    SAS/IML Studio online Help. Choose Help ► Help Topics and expand the IMLPlus Class
    Reference section.


    # C.5.1 Bar Chart Methods


    Table C.6 summarizes frequently used methods in the BarChart class. See Section
    7.3 for details.


    | Table C.6 Frequently Used Methods in the BarChart Class |

    | Method | Description |

    | --- | --- |

    | BarChart.Create | Creates a bar chart |

    | SetOtherThreshold | Specifies a cutoff percentage for determining which categories
    are combined into a generic category called "Others" |

    | ShowBarLabels | Shows or hides labels of the count or percentage for each category
    |

    | ShowPercentage | Specifies whether the graph''s vertical axis displays counts
    or percentages |


    # C.5.2 Box Plot Methods


    Table C.7 summarizes frequently used methods in the BoxPlot class. See Section
    7.7 for details.


    | Table C.7 Frequently Used Methods in the BoxPlot Class |

    | Method | Description |

    | --- | --- |

    | BoxPlot.Create | Creates a bar chart |

    | SetWhiskerLength | Specifies the length of the box plot whiskers as a multiple
    of the interquartile range |

    | ShowMeanMarker | Specifies whether to overlay the mean and standard deviation
    on the box |

    | ShowNotches | Specifies whether to display a notch box plot. This variation
    of the box plot indicates that medians of two box plots are significantly different
    at approximately the 0.05 significance level if the corresponding notches do not
    overlap.


    # C.5.3 Histogram Methods


    Each graph type has methods that control the appearance of the graph. Table C.8
    summarizes frequently used methods in the Histogram class. See Section 7.4 for
    details.'
