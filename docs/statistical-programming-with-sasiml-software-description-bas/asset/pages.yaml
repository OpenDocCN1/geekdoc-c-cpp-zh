  md: '# 352 Chapter 14: Bootstrap Methods


    5. Compute standard errors and confidence intervals.


    For the moves in the Sample data set, you can use bootstrap methods to examine
    the sampling distribution of the mean (or any statistic). Since the first step
    in the bootstrap method is to resample (with replacement) from the data, it is
    convenient to use the SampleWithReplace method that was developed in Chapter 13,
    "Sampling and Simulation.",


    The following statements use the SampleWithReplace module to carry out a bootstrap
    on the budgets for means:


    ```

    / bootstrap method: the statistic to bootstrap is the mean *

    /* 1. Compute the statistic on the original data */

    Mean = x[:];                                              */ sample mean


    /* 2. Resample B times from the data (with replacement)

    to form B bootstrap samples. */

    call randseed(12345)

    load module=SampleWithReplace;             /* not required in IMLPlus *

    B = 1000;

    n = now(x);

    EQUAL = =

    xBoot = SampleWithReplace(x, B|n, EQUAL);


    /* 3. Compute the statistic on each resample */

    s = xBoot[:];

    ```


    As indicated, the main steps of the bootstrap algorithm are as follows:


    +   1. Compute the statistic (in this case, the mean) on the data.

    2. Use the SampleWithReplace module to resample from the data. The module returns
    a matrix, xBoot, which contains B rows and n columns, where n is the number of
    observations in the data. Each row represents a resampling from the data.

    3. Compute the statistic on each resample. In this case, compute the mean of each
    row of xBoot. The resulting vector, s, contains B statistics (means).


    > **Programming Tip:** You can use the SampleWithReplace module in a bootstrap
    analysis as resampling from the data.


    The vector s in the previous program contains B statistics. The union of the statistics
    is an estimate for the sampling distribution of the statistic. A histogram of
    s is shown in Figure 14.2 and is created with following IMLPlus statements:


    ```

    / 4. If desired, graph the bootstrap distribution */

    declare Histogram hBoot

    hBoot = Histogram.Create("Means", s);

    hBoot.SetAxisLabel(XAXIS, "Means of Resamples");

    hBoot.ReBin(40, 1);

    attrib = BLACK || SOLID || 2;

    run awhile(hBoot, Mean, ., attrib);

    ```'
