    # 13.6 Random Sampling with Unequal Probability


    Previous sections have simulated events in which each event had the same probability
    of occurrence. For tossing a coin, the probability of either side appearing is
    1/2; for rolling a single six-sided die, the probability of any face appearing
    is 1/6. These are examples of random sampling with equal probability.


    However, sometimes the probability that one event is greater than the probability
    of another event. For example, suppose that you draw a sock from the drawer: five
    black, two are brown, and three are white. The probability of the sock being black
    is 0.5, the probability of brown is 0.2, and the probability of white is 0.3.
    This is an example of random sampling from the drawer *{Black, Brown, White}*
    with unequal probability.


    If you are not a sock lover, you may substitute other scenarios. For example,
    the ideas in this section also apply to political affiliation (for example, Democrats,
    Republicans, and Independents) and marital status (for example, married, separated/divorced).


    The following steps simulate the process of drawing socks (with replacement) from
    a drawer:


    +   1. Choose a sock at random. The probability of choosing a particular color
    is proportional to the number of socks with that color.

    2. Record the color of the sock.

    3. Replace the sock in the drawer.

    4. Repeat the process.


    How can you sample from the set *{Black, Brown, White}* with unequal probability?
    As shown in Section 13.4, you can use the RANDGEN subroutine to generate outcomes
    with specified probabilities. In this case, there are three outcomes with probabilities
    $p = \{0.5, 0.2, 0.3\}$. The RANDGEN'
