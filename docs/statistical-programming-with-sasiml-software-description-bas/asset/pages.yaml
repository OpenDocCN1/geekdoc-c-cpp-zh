  md: '# 302 Chapter 12: Regression Diagnostics


    Figure 12.12 compares residual values and enables you to examine whether an observation
    is an outlier for one model is also an outlier for the other. You can do a similar
    comparison for the leverage statistic displayed in Figure 12.4. The robust analogue
    to the leverage statistic is the robust distance (created by the RD= option in
    ROBUSTREG OUTPUT statement) because both statistics indicate how an observation
    is from the center of the data in the space of the explanatory variables. However,
    the leverage statistic is proportional to a squared distance, so it is desirable
    to directly compare these. However, recall that the square root of the leverage
    is proportional to the Mahalanobis distance (created by the MD= option in ROBUSTREG
    OUTPUT statement). Therefore, the distance-point slot measure in Figure 12.13
    compares the leverage of the least squares (measured by the Mahalanobis distance)
    to the leverage of the robust model (measured by the robust distance). The following
    statements compare Figure 12.13:


