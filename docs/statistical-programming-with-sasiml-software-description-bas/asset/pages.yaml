    The program in the previous section created a bar chart of the data in the MPAARating
    variable in a data object created from the Movies data set. It is simple to extend
    that program to create a second graph (say, a scatter plot) that is dynamically
    linked to the bar chart: merely create the second graph from the same data object,
    as shown in the following statements:'
