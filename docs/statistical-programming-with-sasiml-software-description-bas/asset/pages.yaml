    # 14.2.3 Computing Bootstrap Estimates


    This section shows how you can use the bootstrap distribution shown in Figure
    14.2 to compute bootstrap estimates for familiar quantities: the mean, the standard
    error of the mean (SEM), and the confidence intervals for the mean. The mean of
    the bootstrap distribution is an estimate of the mean of the original sample.
    The standard deviation of the bootstrap distribution is the bootstrap estimate
    of the standard error of \*. Percentiles of the bootstrap distribution are the
    simplest estimates for confidence intervals. The following statements (which continue
    the program in the previous section) compute these estimates:


    ```

    * 5. Compute standard errors and confidence intervals.*

    MeanBoot = s[1];                               /* a. mean of bootstrap dist */

    StdErrBoot = sqrt(var(s));                             /* b. std error */

    alpha = 0.05;

    prob = alpha/2 || 1-alpha/2;                          /* lower/upper percentiles
    */

    call = qntl1(CIBoot, s, prob);                        /* c. quantiles of sampling
    dist */

    print MeanBoot StdErrBoot CIBoot;

    ```'
