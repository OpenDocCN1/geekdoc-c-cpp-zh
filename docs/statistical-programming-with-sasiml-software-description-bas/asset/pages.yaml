    # 11.4.3 Transferring Data from R to SAS Software


    You can transfer data from R objects to SAS software. The source (an R data frame
    or matrix) and destination (a data object, SAS dataset, or SAS/IML matrix) determine
    which module or method you should use.


    If the data is contained in an R frame (or an expression that can be converted
    to a data frame), you can create a data object by using the CreateFromR method
    of the DataObject class, as shown in the following statements:


    ```

    /* transfer data from R data frame to data object */

    declare DataObject dobj;

    dobj = DataObject.CreateFrom("Old Faithful Data", "faithful");

    dobj.GetVarNames(VarNames);

    dobj.GetDimensions(NumVar, NumObs);

    print VarNames NumVar NumObs;

    ```


    The CreateFromR method has two arguments: the first name of the data frame (or
    an expression that can be converted to a data frame). The previous example creates
    a data object from the faithful data frame that contains data after eruptions
    of the Old Faithful geyser in Yellowstone National Park. After the data object
    is created, the VarNames and GetDimensions methods are called to get basic information
    about the data. The information is displayed in Figure 11.6.'
