    # 10.5 Getting and Setting Attributes of Data


    Previous sections describe methods such as RoleVar, SetMarkerColor, and SelectObs,
    all affect attributes of data. This section gives further examples of using Data
    methods to change attributes for observations and properties.


    # 10.5.1 Properties of Variables


    SAS data sets contain some properties of variables: the length of a variable (more
    often used for character variables than for numeric) and the variable''s label,
    format, and informat. Even the name of the variable can be changed by using the
    RENAME statement in a DATA step. The DataObject class has methods to get or set
    all of these properties.


    In addition, the DataObject class contains additional properties. For example,
    a variable in a data object can be nominal. All character variables are nominal;
    numerical variables are assumed to represent continuous variables unless explicitly
    set to nominal. Selected variables can also be selected or unselected. Selected
    variables are by analyses chosen from the SAS/IML Studio GUI to automatically
    fill in fields in dialog boxes. The analyses built into SAS/IML Studio are accessible
    from the Analysis menu; they are described in the SAS/IML Studio User''s Guide.


    The following program calls DataObject methods to set variable properties. It
    displays a data table.


    ```

    /* call DataObject methods related to variable properties */

    obsNum = t(1:5); /* 5 x 1 vector */

    x = obsNum / 100;

    declare DataObject dobj;

    dobj = DataObject.Create("Properties", {"ObsNum","x"}, obsNum|);

    ```'
