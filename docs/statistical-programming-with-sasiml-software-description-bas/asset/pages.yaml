    # 16.7.3 A Modal Dialog Box with a Checkbox


    The previous section showed how to create a modal dialog box using the tcltk package.
    This section extends the example by creating a checkbox and adding OK and Cancel
    buttons to the dialog box.


    Suppose you want to call the CORR procedure to examine the relationships between
    several variables. The CORR procedure has several options, one of which is the
    COW option that specifies whether to compute the variance-covariance matrix of
    the variables. You can write a program that displays a dialog box with a checkbox
    that gives the user the option of computing the covariance matrix. The dialog
    box might look like Figure 16.16. When the user clicks OK, the state of the checkbox
    determines whether to specify the COW option in the CORR procedure.


    > Figure 16.16 Modal Dialog Box with Checkbox


    ![](img/148549d50632967f185e36a8bcda3de8_411_1.png)


    The following statements use the tcltk package to create the dialog box in Figure
    16.16. The state of the checkbox is recorded in the cov.option variable in R:'
