    | | n_x | p_x |

    |---|---|---|

    | | 1 | 3 |

    | n_u | p_u |

    | | 0 | 0 |


    A matrix that contains no elements is called an *empty* matrix. There are several
    reasons why a matrix can be empty:


    +   * It has not been defined.

    * Its memory was freed by the FREE statement.

    * It is the result of a query that returned the empty set (such as the intersection
    of disjoint sets).


    The output from the following statements (see Figure 2.4) shows that each dimension
    of an empty matrix is zero.'
