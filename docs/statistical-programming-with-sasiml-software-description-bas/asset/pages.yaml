  md: "# 64 Chapter 3: Programming Techniques for Data Analysis\n\nBy now, the first\
    \ few statements in the program are familiar: define the variables of interest\
    \ and use the USE and READ statements to create vectors that contain the values\
    \ for the given variables. The subsequent statement creates predicted values based\
    \ on some regression model. The predicted values are used to form the residuals.\
