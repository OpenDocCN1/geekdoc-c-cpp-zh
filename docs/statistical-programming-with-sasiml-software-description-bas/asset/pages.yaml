  md: '# 14.4 Using SAS Procedures in Bootstrap Computations


    In many ways, the SAS/IML language is a natural language for programming simple
    bootstrap algorithms on small or medium-sized data sets. As shown in the previous
    sections, it is fast and easy to reshape the data and compute a mean or other
    descriptive statistic.


    However, it is also possible to implement bootstrap methods in IMLPlus by combining
    SAS/IML statements with SAS procedures. Procedures offer several advantages over
    implementing complicated bootstrapping algorithms entirely in SAS/IML software:


    More Resampling Methods. The bootstrap resampling is supposed to mimic the design
    that produced the original data. For random sampling with replacement, this is
    straightforward, as indicated in Chapter 13,"Sampling and Simulation." For complicated
    sampling schemes, it might be useful to use the SURVEYSELECT procedure to carry
    out the bootstrap resampling, as opposed to implementing the resampling entirely
    in SAS/IML statements.


    More Statistical Computations. Most of the functionality in SAS software is contained
    in procedures. The functionality available in SAS/STAT, SAS/ETS, and other products
    is much greater than the built-functionality of the SAS/IML statistical library.
    For example, consider the problem of estimating the accuracy of parameter estimates
    for a generalized linear model. It is straightforward to use the GENMOD procedure
    in SAS/STAT, whereas SAS/IML does not have an analogous built-function or module.


    Procedures Handling Missing Values. Not all SAS/IML operations support missing
    values (for example, matrix multiplication), but SAS procedures handle missing
    values without any effect from you.


    Procedures Handling Degenerate Data. Writing robust SAS/IML statements to perform
    a computation means you have to handle errors that arise in analyzing all possible
    data sets. For example, a SAS/IML module for regression should correctly handle
    single data such as collinear variables and constant data. SAS procedures do this
    already.


    Procedures Save Time. Writing your SAS/IML computation means spending time verifying
    that your program is computing the correct answers. A SAS/IML program that you
    yourself might have a subtle (or no subtle!) error, whereas the SAS procedures
    have been tested and validated. SAS procedures (which are implemented in compiled
    and optimized C code) can compute statistics more efficiently than an interpreted
    language such as SAS/IML language.


    Procedures Handle Large Data. SAS IML software requires that all vectors and matrices
    fit into RAM. One of the advantages of SAS procedures is the ability to compute
    with data sets so large that they do not fit in RAM. While bootstrapping is not
    memory-intensive, computing more statistics on large datasets might require more
    memory than is available on your computer.


    For all these reasons, this section describes how you can call SAS procedures
    to generate resamples and to compute statistics on the resamples. You can use
    the SURVEYSELECT procedure in'
  merge: -1
  pgno: 363
