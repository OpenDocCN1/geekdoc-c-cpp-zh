  md: '# 8.5 Creating a Data Object from a Matrix


    When the data you want to graph is in a SAS/IML matrix, you can create a data
    object directly from the matrix data. The Create method instantiates a data object
    from a SAS/IML matrix. For example, the following statements demonstrate how to
    create a data object from a matrix that contains random variables:


    ```

    /* create a data object from data in a matrix */

    x = jdrag(100, 3);                               /* 100 observations, 3 variables
    */

    call randgen(x, "Normal");                       /* 1 */

    varNames = ''x1'':''x3'';                             /* 2 */

    declare DataObject dobj;

    dobj = DataObject.Create("Normal Data", varNames, x);   /* 3 */

    ```


    The program contains the following steps:


    +   1. The matrix x, which contains 100 observations and three columns, is filled
    with pseudorandom numbers from the standard normal distribution.

    2. The character vector varNames contains names to assign to the columns of x.
    The notation ''x1'':''x3'' uses the index operator to generate a vector of names
    with a common prefix.

    3. A data object is created from x. The columns are named according to the values
    of varNames.


    The previous program does not create any output or graphs. However, you can see
    the contents of a data object by creating a table from the data object:


    ```

    DataTable.Create(dobj);

    ```


