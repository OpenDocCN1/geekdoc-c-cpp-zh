  md: '# 15.6 Tips for Timing Algorithms


    The following tips can help you to make accurate assessments of the performance
    of algorithms:


    +   * Encapsulate the algorithm into a module in order to make it easier to call
    and change parameters in the algorithm.

    * Use small quantities of data when you are developing and debugging your program.

    * Maintain a quiet machine when timing the algorithm. Close down e-mail and your
    Web browser. Do not start or run other applications during the timing (unless
    you want to examine how the algorithm timing varies under realistic conditions).

    * For long-running algorithms (say, greater than 15 seconds), it is not necessary
    to repeat each multiple times as described in Section 15.4. The variation in times
    will usually be small compared with the time required by the algorithm.

    * Notice that the nonparametric model used in Section 15.4 is a thin-plate spline,
    and not a loess model. The loess model is not a good choice for replicating measurements
    because of the way the loess algorithm chooses points to use for local estimation.

    * You can wrap the TIME function around a SUBMIT statement to measure the time
    required to call a SAS procedure or to call R functions.

    * The way that an algorithm varies according to the size of the data is not always
    easy to understand. The performance of an algorithm will vary from CPU to CPU,
    depending on the size of certain memory caches, buffers, and page sizes.


    # 15.7 References


    Nilsson, J. (2004), “Implement a Continuously Updating, High-Resolution Time Provider
    for Windows,” MSDN Magazine.


    URL http://msdn.microsoft.com/en-us/magazine/cc163996.aspx'
