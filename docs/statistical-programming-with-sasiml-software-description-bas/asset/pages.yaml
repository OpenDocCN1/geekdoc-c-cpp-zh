    When comparing two different models, it is often useful to compare the residual
    values for the models. It is sometimes the case that there are observations that
    have large residuals for one model but have small residuals or negative residuals
    for the other model. (This happens frequently with nonparametric models.) The
    following statements create a scatter plot of the residuals for each model and
    use the abline (see Section 9.4) to add a reference line:


    ```

    /* compare residuals */

    declare ScatterPlot resid;

    resplot = ScatterPlot.Create(dob, "Resid", "RobResid");

    resplot.SetMarkerSize(5);

    resplot.ShowReferenceLines();

    solidGray = 0xC8C8C8 // SOLID 1; /* define line attributes */

    run abline(resplot, 0, 1, solidGray); /* identity line */

    ```


    The results are shown in 12.12. All pairs of residuals from these two models lie
    near the identity line, which indicates that the two models are fairly similar.
    If a point in Figure 12.12 was far from the identity line, it would indicate an
    observation for which the predicted value from one model was vastly different
    than the predicted value from the other model. Notice that all of the points in
    Figure 12.12 are below the identity line. This indicates that every residual value
    for the least squares model is smaller than the corresponding residual value for
    the robust model. This is obvious from Figure 12.11, because the predicted values
    for the robust model are larger than the predicted values for the least squares
    model for every value of the explanatory variable.


