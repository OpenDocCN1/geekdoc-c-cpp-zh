    \ X variable for the graph.\n4. Get the data for the X variable. The x contains\
    \ the horizontal positions for the ticks in the rug plot.\n5. If the graph is\
    \ a scatter plot and variable is nominal, the module returns without drawing the\
    \ rug plot. This is done because the subsequent call to the DrawDataCoordinates\
    \ method fails unless axes are interval variables. (Alternatively, you could set\
    \ a user-defined coordinate system; see the documentation for the Plot.DrawUseNormalizedCoordinates\
    \ method.)\n6. Get the range of the Y axis. For a scatter plot, the minimum and\
    \ maximum values of the axis are the minimum and maximum values of the Y data.\
    \ For a histogram, the minimum value is zero and the maximum value is the height\
    \ of the tallest bar.\n\n+   7. Drawing the rug plot draws many lines that begin\
    \ at the same vertical position and have the same height. The vector y0 is a vector\
    \ of starting vertical positions; the vector y1 is a vector of ending vertical\
    \ positions. It differs from y0 by an amount up to 5% of the height of the vertical\
    \ axis. For a histogram, each tick begins at yMin and is drawn toward the center\
    \ of the histogram. For a scatter plot, each tick is drawn from the center (into\
    \ the plot area margin).\n8. Draw the rug plot with a single call to the DrawLine\
    \ method. The ith line is drawn from the point (x[i], y0[i]) to the point (x[i],\
    \ y1[i]). Notice that the module does not loop over all observations and the DrawLine\
    \ method once for each tick.\n\n**Programming Tip:** The DrawLine method in the\
    \ Plot class can draw many line segments in a single call.\n\nThe module could\
    \ be modified to support drawing a rug plot for the Y variable of a scatter plot\
    \ and even a box plot, but that modification is not shown here. The following\
    \ statements call the module on a scatter plot and a histogram."
