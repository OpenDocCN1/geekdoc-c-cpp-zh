    A log transformation is well-defined for data because the budget of movies is
    always positive. If some data, say y, is not positive, it is common to add a constant
    to all values in order to produce a vector that contains positive values. You
    can show that y + c > 0, provided that c > -min(y). The following statements exploit
    this to compute log10 transformation for nonpositive data:


    ```

    /* apply log10 transform to data with negative values */

    y = {10 -29 -20 27 70};

    /* (y + c) > 0 whenever c > -min(y) */

    log10Y = log10(y + c);

    /* apply log10 transformation */

    print log10Y;

    ```


