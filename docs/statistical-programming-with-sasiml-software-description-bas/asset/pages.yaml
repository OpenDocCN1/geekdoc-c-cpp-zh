- img_proc: true
  md: '# Comparing Analyses in the Same Workspace 295


    > **Programming Tip:** To compare the results of two analyses on the same data,
    create a scatter plot that graphs similarities against each other. For example,
    plot the residuals of one regression model against the residuals of a second regression
    model.


    In order to graph two against each other in SAS/IML Studio, those quantities should
    be in a common data object. Therefore, you should add predicted values, residual
    values, and other observation-statistics to a single data object. You can use
    the Data step to merge the results from several analyses into a single data set,
    and create a data object from merged data set.


    The previous sections describe how to compare the contents of output windows that
    are in different workspaces. You can use IMLPlus programming techniques to detect
    the output from two (or more) separate output windows in the same workspace. This
    enables you to compare results (for example, parameter estimates) side-by-side
    instead of scrolling an output window up and down to compare the output of two
    processes. You can use the OutputDocument class in SAS/IML Studio to create multiple
    output windows and control which window receives the output from an analysis.
    This technique is implemented and described in Section 12.8.


    In addition to sending text to an output window, you can also paste IMLPlus graphics
    into an output window. The pasted graph is not dynamically linked; it is merely
    a static image of an IMLPlus graph. You can copy and paste a graph manually by
    using the Standard Windows CTRL+C and CTRL+V as described in the section "Copying
    Plots to the Windows Clipboard" (Chapter 11, SAS/IML Studio User''s Guide). You
    can also write program statements to copy and paste a graph. For example, suppose
    you copy the graph shown in Figure 12.4 and paste it into the output document
    for the program in Section 12.2. You can accomplish this with the following statement,


    ```

    resid.CopyToOutputDocument();

    ```


    A static version of the image is pasted into the output window, as shown in Figure
    12.8. You can resize the graph in the output window, drag it to a different position
    within the output window, or copy and paste it to other Windows applications.


    > **Programming Tip:** Use the Plot.CopyToOutputDocument method to output (static)
    graphs, especially if you want to easily print multiple graphs as part of the
    output of some analysis.'
