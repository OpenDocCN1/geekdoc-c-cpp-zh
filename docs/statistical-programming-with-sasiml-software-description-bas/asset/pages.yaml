    \ By using max (v) as the fifth element of Endpts, the program avoids this error\
    \ and also avoids having to handle the case v > 200 differently than the other\
    \ cases.\n\nIt is left as an exercise for the reader to view the colored observations\
    \ by creating a scatter plot of any two variables in the Sasuser.Movies dataset.\n\
    \n# Color-Blending: Few Values for each Color\n\nThe previous section assigned\
    \ a single color to a range of values for US_Gross. In mathematical terms, the\
