- img_proc: true
  md: '# 4.6. Creating Names for Output Variables


    is the name of the response variable. In general, you can name an output variable
    by appending the name of the response variable to the option that specifies the
    output statistic.


    You can concatenate strings in the SAS/IML language by using the concatenation
    operator (+) or using the CONCAT function. The following statements demonstrate
    this approach by using SAS/IML to form the names of output variables that follow
    this convention:


    ```

    /* form the names of output variables */

    yVarName = ("Mpg_Rwy");

    Options = ("P", "LCM", "UCLM");

    blank32 = subpad=(1, 32);

    outputVariables = jnow(Options, 1, blank32);

    doi i = 1 to nrow(outputVariables)

    outputVariables[i] = strip(Options[i]) + "_" + yVarName;

    end;

    outputStats = Options + "_" + outputVariables;

    print outputStats;


    submit outputStats;

    proc glm data=Sasuser.Vehicles;

    model Mfg_Rwy = Engine_Liters | Engine_Liters;

    output out=GLOUT &outputStats;

    quit;

    endsubmit;

    ```


    use GLOUT;

    read all var outputVarNames into m;

    close GLOUT;


    ```

    print (m[1:5,1]) [colname=outputVarNames];

    ```


    The main steps of the program are as follows:


    +   1. Specify the name of the response variable and the options to the OUTPUT
    statement (P= LCLM= and UCLM=).

    2. SAS variable names cannot exceed 32 characters. Create a string with 32 characters
    (blank32) by using the SUBPAD function. This matrix is used in the subsequent
    statement to initialize a character vector.

    3. Initialize the outputVarNames vector to have a row for each option. The character
    vector has space to store up to 32 characters in each element.

    4. For each option, create the name for the corresponding variable: concatenate
    the option onto the name of the response variable, separating these strings with
    an underscore. You need a loop for this step because you need to strip trailing
    blanks from the prefix before you concatenate the prefix and the variable.

    5. Form the option-value pairs by concatenating the options with an equal sign
    and with the names of the output variables. Figure 4.6 shows the vector of option-value
    pairs.'
