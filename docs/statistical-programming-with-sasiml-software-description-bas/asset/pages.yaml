  md: "# 4 Chapter 1: An Introduction to SAS/IML Software\n\nAs implied by the IML\
    \ acronym, matrices are a fundamental part of the SAS/IML language. A matrix is\
    \ a rectangular array of numbers or characters. In the IML procedure, all variables\
    \ are matrices. Matrices are used to store many kinds of information. For example,\
    \ each row in a data matrix represents an observation, and each column a variable.\
    \ In a variance-covariance matrix, the $ij$ entry represents the sample covariance\
    \ between the $i$th and $j$th variable in a set of data.\n\nAs an example of the\
    \ power and convenience of the SAS/IML language, the following PROC IML statements\
    \ read certain numeric variables from a data set into a matrix, x. The program\
    \ computes robust estimates of location and scale for each variable. (The location\
    \ identifies the value of the data's center; the scale parameter tells you about\
    \ the spread of the data.) The SAS/IML statements are described in Chapter 2,\
    \ \"Getting Started with the SAS/IML Matrix Programming Language.\" The data from\
    \ a sample set in the Sashlep library contains age, height, and weight for a class\
    \ of students.\n\n```\n/* standardize data by using robust estimates of center\
    \ and scale */\nprociml;\n  use Sashlep.Class; /* open data set for reading */\n\
    \  read all var_ into x[columnNames]; /* read variables */\n  close Sashlep.Class;\
    \ /* close data set */\n\n/* estimate centers and scales of each variable */\n\
    c = median(x); /* centers = medians of each column */\ns = mad(x); /* scales =\
    \ MAD of each column */\\nstdx = (x - c) / s; /* standardize the data */\n\nprint\
    \ c[columnNames]; /* print statistics for each column */\nprint s[columnNames];\n\
    ```\n\n| Age | Height | Weight |\n|---|---|--|\n| 13 | 62.8 | 99.5 |\n| 1 | 3.7\
    \ | 14.5 |\n\nIn the PROC IML program, the location of each variable is estimated\
    \ by calling the MEDIAN function. The scale of each variable is estimated by calling\
    \ the MAD function, which computes the median absolute deviation (MAD) from the\
    \ mean. (The median is a robust alternative to the mean; the MAD is a robust alternative\
    \ to the standard deviation.) The data are then standardized (that is, centered\
    \ and scaled) by subtracting each center from the variable and dividing the result\
    \ by the scale for that variable. See Section 2.12 for details on how the SAS/IML\
    \ language interprets quantities such as (x-c)/s.\n\nThe previous program highlights\
    \ a few features of the SAS/IML language:"
  merge: -1
