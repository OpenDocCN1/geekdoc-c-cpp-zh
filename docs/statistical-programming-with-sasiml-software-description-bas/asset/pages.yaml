    # 10.2.2.2 Use Color to Mark Outliers


    In 8.8.2, you learned how to add residual values to a data object. It is often
    convenient to change the color or marker of observations whose residual values
    are far from zero. These observations that not well-predicted by the model are
    called outliers.


    The following statement assume that the residuals are in the data object in a
    variable called Resid. The statement sets the color of any observation with ten
    or more residuals:


    ```

    * set color of observations with large residual values */

    dobj.GetVarData("Resid", resid);

    idx = loc(resid<=-10 | resid>=10);

    if ncol(idx)>0 then

    dobj.SetMarkerColor(idx, RED);

    ```


    You can see the colored observations on a scatter plot (such as Figure 8.6) that
    includes the Resid variable.


    The definition of a “large” residual is dependent. In this example, an observation
    is colored red if the actual true_City value differs from the predicted value
    by ten or more miles per gallon.


    Although this example used an arbitrary value (10) to determine which residuals
    are considered'
