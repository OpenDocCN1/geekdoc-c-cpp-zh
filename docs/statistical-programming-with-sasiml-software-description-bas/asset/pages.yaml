    # 8.9 Review: The Purpose of the DataObject Class


    A data object serves the following purposes:


    +   - to read data into memory from various sources

    - to be a uniform programming interface by providing methods that set and get
    data and properties of observations and variables

    - to coordinate the display of data in dynamically linked graphs and data tables


    These roles of the DataObject class are shown schematically in Figure 6.1.


    You can use methods in the data object to manage the properties of observations
    and variables. For example, each observation is represented by a marker in scatter
    plots. The data object ensures that the properties of each observation marker
    (for example, color and shape) are the same in graphical or tabular views of data.
    The same is true for properties of variables: such as formats, labels, and are
    managed by the data object. Chapter 10,"Marker Shapes, Colors, and Other Attributes
    of Data," describes how to manage these and other properties of observations and
    variables.


    When you are exploring data, an important property of an observation is whether
    or not the observation is in a selected state. or an unselected state. The data
    object ensures that observations that are selected in one graph are highlighted
    in all other graphs. For example, in Figure 8.1, the PG-rated movies are selected
    in the'
