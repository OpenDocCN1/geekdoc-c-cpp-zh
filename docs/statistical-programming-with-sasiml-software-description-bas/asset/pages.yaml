    # 13.3 Simulate a Coin-Tossing Game


    In a game of chance, you can sometimes use probability theory to compute the expected
    gain (or loss) for playing the game. Sometimes the strategy you use and the choices
    you make while playing affect the game''s outcome; other times the outcome is
    completely determined by the rules of the game. Even if you cannot calculate the
    probabilities accurately, you can estimate the expected gain by simulating the
    game many times and averaging the gains and losses of the simulated games.


    This section analyzes a coin game with the following rules:


    +   * Toss a fair coin.

    * If the coin comes up heads, toss again.

    * If the coin comes up tails, the game is over.


    In a multiplayer version of this game, the player with the longest string of tosses
    wins. The next section outline the expected gain for playing the game when there
    are certain costs and rewards that are associated with each outcome.


    # 13.3.1 Distribution of Outcomes


    The simplest way to analyze this game is to determine the probability for each
    outcome, as shown in Table 13.1. In general, the probability of the game ending
    after $k$ tosses is $2^{-k}$, $k = 1, 2, \dots$'
  merge: -1
  pgno: 319
- img_proc: true
  md: '# **Table 13.1**  Outcomes and Associated Probabilities for a Coin Game


    | Outcome | Tosses | Probability |

    | --- | --- | --- |

    | | 1 | 1/2 |

    | HT | 2 | 1/4 |

    | HHT | 3 | 1/8 |

    | HHHT | 4 | 1/16 |

    | : | : | : |

    | H..HT | k | 1/2^k |


    A simulation of this game is straightforward and uses the TossCoin module developed
    in the previous section.


    ```

    /* Simulate a game: flip a coin until tails appears.

    Keep count of the number of tosses.

    First approach: not optimally efficient. */

    call randseed(1234); /* set random seed */

    NumGames = le5; /* repeat the game times */

    Results = j(NumGames, 1, .); /* number of tosses per game */

    do i = 1 to NumGames

    count = 1; /* number of tosses so far */

    toss = TossCoin(1);

    dow while (toss=)

    count = count + 1; /* continue until tails appears */

    toss = TossCoin(1);

    end;

    Results[i] = count; /* record the results */

    ```


    The program allocates the Results vector prior to the main loop. This vector holds
    the results of the simulation. The i/th element of the vector contains the number
    of tosses for the i/th game. If the simulation is accurate, the distribution of
    simulated tosses should approximate the distribution shown in Table 13.1.


    **Programming Technique:** You can program a simple simulation with the following
    pseudocode:


