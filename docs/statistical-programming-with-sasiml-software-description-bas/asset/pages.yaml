  md: '# 1.8.1 Installing the Example Data on a Local SAS Server


    When SAS Foundation and SAS/IML Studio are both installed on the same Windows
    PC, you can install the data sets in the Sasuser library. The book''s Web site
    includes instructions on how to download and install the data sets so that it
    is accessible from SAS/IML software.


    All of the examples in this book are written for this configuration. After you
    install the data, you can run the examples without modification.


    # 1.8.2 Installing the Example Data on a Remote SAS Server


    Many SAS System administrators configure remote SAS servers so that the Sasuser
    library is read-only. In this case, you cannot install the data sets in Sasuser.


    If your copy SAS/IML Studio is configured to connect to a SAS Workspace Server
    that runs on a remote computer, do the following:


    +   1. Ask your site administrator to use the SAS Management Console to set up
    a library name SPI which you can store the book''s data sets.

    2. When you download the data and programs from the book''s Web site, install
    the data sets in the SPI library.

    3. When a program in the book refers to the Sasuser library, replace the library
    name with SPI.


    For example, suppose that the book contains the following example that uses the
    Sasuser library:


    ```

    /* read data installed on local SAS server */

    proc iml;

    use Sasuser.Vehicles;           /* open data set for reading */

    read all var _NUM_ into x;      /* read numerical data */

    close Sasuser.Vehicles;            /* close the data set */

    ```


    If you want to run the preceding example, use the SPI library instead of the Sasuser
    library. This means that you will actually run the following program:


    ```

    /* read data installed on remote SAS server */

    proc iml;

    use SPI.Vehicles;               /* open data set for reading */

    read all var _NUM_ into x;      /* read numerical data */

    close SPI.Vehicles;                /* close the data set */

    ```'
