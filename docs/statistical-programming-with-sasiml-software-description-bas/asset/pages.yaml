    For example, none of the movies included in this data set are rated NC-17, but
    that is a valid (but rare) MPAA rating.


    One solution is to reuse shapes if there are more categories than shapes. The
    following statements use the SAS/IML MOD function to ensure that the index into
    the shape vector is always a number between 1 and the number of shapes, regardless
    of the value of i:


    ```

    * if more categories than shapes, reuse shapes */

    j = 1 + mod(i-1, ncol2(shapes));

    shape = shapes[j];

    dobj.SetMarkerShape(idx, shape);

    ```


    Recall that mod(s,t) gives the remainder after dividing s by t. Consequently,
    the expression 1+mod(l-1,n) is a number between 1 and n for all positive integers
    i.


    You can use this programming technique to write a module that sets the marker
    shapes of observations according to the categories of some variable, as shown
