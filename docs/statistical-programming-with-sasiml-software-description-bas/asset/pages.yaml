  md: "Programming Tip: When defining a matrix, use a comma to indicate a new row.\n\
    \n# 2.2.1 Printing a Matrix\n\nYou can use the PRINT statement to display the\
    \ value of one or more matrices. The following statement displays the values of\
    \ the matrices defined in the previous section:\n\n```\nprint x, y;\n```\n\nFigure\
    \ 2.1 Numeric and Character Matrices\n\n| | 1 | 2 | 3 |\n|---|---|---|---|\n|\
    \ y | | male female |\n\nNotice that a comma in the PRINT statement indicates\
    \ that the second matrix should be displayed on a new row. If you omit the comma,\
    \ the matrices are displayed side by side.\n\nThe PRINT statement has four useful\
    \ options that affect how a matrix is displayed:\n\nCOLNAME=matrix\n\nspecifies\
    \ a character matrix to be used for column headings.\n\nFORMAT=format\n\nspecifies\
    \ a valid SAS or user-defined format to use when printing matrix values.\n\nLABEL=label\n\
    \nspecifies a label for the matrix. If this option is not specified, the name\
    \ of the matrix is used as a label.\n\nROWNAME=matrix\n\nspecifies a character\
    \ matrix to be used for row headings.\n\nThese options are specified by enclosing\
    \ them in square brackets after the name of the matrix that you want to display,\
    \ in the following example:\n\n```\n/* print marital status of 24 people */\n\
    ageGroup = (\"<= 45\", \"> 45\"); /* headings for rows */\nstatus = (\"Married\"\
    , \"Divorced\"); /* headings for columns */\ncounts = ( 5 5 0, /* data to print\
    \ */\n\t 9 3 };\nprint counts=[status\n\nrowname=ageGroup\n\tlabel=\"Marital Status\
    \ by Age Group\"];\n```"
