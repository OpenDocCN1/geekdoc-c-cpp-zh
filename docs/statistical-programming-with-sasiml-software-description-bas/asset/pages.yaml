    # 3.4.2 Local Variables


    A module usually maintains its own set of variables. This means that names used
    for variables inside a module do not conflict with variables outside. Consequently,
    the matrix dx defined inside the CorrCoef module does not overwrite or conflict
    with any other variable of the same name that might exist in other module or in
    the main program.


    > **Programming Tip:** Variables defined in a module are local to that module.
    Local variables do not conflict with the main program that have the same name.


    If you use the SHOW NAMES statement inside a module, it displays the names, dimensions,
    and types of all matrices are local to the module.'
