    # 14.1 An Introduction to Bootstrap Methods


    The bootstrap method is a general technique for estimating unknown parameters,
    computing standard errors for statistics, and finding confidence intervals for
    parameters. Introductory references for bootstrap techniques include Efron and
    Tibshirani (1993) and Davison and Hinkley (1997).


    This chapter is an applied chapter that describes how to use the bootstrap method
    in SAS/IML and IMLPlus. IMPLPlus has several features that make the bootstrap
    method easier to implement. The chapter introduces resampling techniques and estimating
    variability with the bootstrap standard error and bootstrap confidence intervals.


    The basic bootstrap algorithm is as follows. Given data $x = (x_1, x_2, \dots,
    x_n)$ and a statistic $s(x)$, the bootstrap method generates a large number of
    independent bootstrap samples $x^*1, x^*2, \dots, x^*B$. Each sample is typically
    of size $n$. For each bootstrap sample, you compute $s(x^*)$, the statistic of
    the $i$th sample. In the simplest cases, the bootstrap samples are formed by randomly
    sampling from $x$ with replacement.


    The union of these forms the bootstrap distribution for $s$. The bootstrap distribution
    is an estimate for the sampling distribution of the statistic. The mean of the
    bootstrap distribution is'
