  md: "# 118 Chapter 5: IMLPlus: Programming in SAS/IML Studio\n\nAs a simple example,\
    \ this section describes how you might write a module you can use to estimate\
    \ the location parameter for univariate data. The mean is one estimator you can\
    \ use, but a robust estimator such as the median is sometimes a better choice.\
    \ You can define a module named Location that takes a string as argument. The\
    \ string determines whether to call a module that computes the mean or whether\
    \ to call a module that computes the median.\n\nThe ALIAS statement enables you\
    \ to do this. It enables you to specify the name of a module, and then call the\
    \ module with that name. The following statements implement an IMLPlus function\
    \ that\n\n```\n/* write an IMLPlus module that estimates a location parameter\
    \ */\nstart Mean(x);\n  return ( x[:]);\n  finish;\n```\n\n```\n/* The median\
    \ module already exists in IMLMIB\n* The syntax is Median(x).\n*/\n```\n\n```\n\
    /* module that calls either the MyMean or the Median module */\nstart Location(StatName,\
    \ x);\nalias MyFunc(x) StatName;\n  /* MyFunc is an ALIAS /\n  y = MyFunc(x);\n\
    \  /* call function that is passed in /\n  return (y);\n  /* value is returned\
    \ */\nfinish;\n```\n\n```\nx = ( 1 2 1, 1 4 3, 1 5 3, 1 5 18);\nmean = Location(\"\
    MyMean\", x);\nmedian = Location(\"Median\", x);\nprint mean, median;\n```\n\n\
    Statement in IMLPlus\n\n| | | |\n| 1 | 4 | 6.25 |\n| median | | |\n| | 4.5 | 3\
    \ |\n\nThe Location module uses the ALIAS statement to associate the module name\
    \ that is contained in the StatName matrix. When MyFunc(x) is executed, it can\
    \ call the MyMean or Median module—or any other function module that takes one\
    \ argument! Consequently, if you create a Trim10 module at some future that computes\
    \ the 10% trimmed mean, you can immediately call the following without making\
    \ any changes to the Location module:\n\n```\ntrimMean = Location(\"Trim10\",\
    \ x);\n```\n\nNotice that an alternative way to write the Location module would\
    \ be to use an IF-THEN/ELSE statement to look at the name of the StatName and\
