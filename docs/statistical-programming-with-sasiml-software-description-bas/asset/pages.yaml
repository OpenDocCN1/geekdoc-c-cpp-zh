  md: '# Chapter 3: Programming Techniques for Data Analysis


    The main steps of the program are as follows:


    +   1. Read the MPAARating variable.

    2. Initialize the matrix categories with the first category. When the program
    encounters a category that has not previously been observed, the categories vector
    will grow.

    3. Loop over all observations.

    4. Inside the loop, compare the current observation with the categories that have
    been seen previously. (Some beginning programmers replace this with a second loop
    over categories, leading to even worse performance!)

    5. If i is empty, then MPAARating[i] is a new category. Use vertical concatenation
    to add a new row to the vector that keeps track of categories and to the vector
    that keeps track of count for each category.

    6. If i is not empty, increment count [i], the number of observations encountered
    for this category.


    While the two algorithms compute the same quantity, the statements that produce
    Figure 3.13 are more efficient for the following reasons:


    +   * The efficient algorithm loops over the number of unique categories. This
    is typically a small number. The inefficient algorithm loops over the number of
    observations, which is typically a much larger number.

    * The efficient algorithm determines the size of all vectors before beginning
    the loop and relocates any storage need. The inefficient algorithm uses a vertical
    concatenation operator (l) to dynamically enhance the result every time a new
    category is encountered. This inefficient technique is discussed in the section
    “Concatenation Operators” on page 41.


    > Programming Tip: If a program contains a loop over all observations, you can
    make the program more efficient by eliminating the loop and using the LOC function
    instead.


    Not only is the program that produces Figure 3.13 more efficient than the program
    that produces Figure 3.20, but also the results of the former program are computed
    in a standard format. The categories of MPAARating are produced in alphabetical
    order, and therefore the results are independent of the way the Movies data set
    is sorted. In contrast, the second algorithm computes the results in the order
    that the category appears in the data set.


