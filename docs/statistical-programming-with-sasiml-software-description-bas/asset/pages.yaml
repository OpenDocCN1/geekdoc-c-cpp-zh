- img_proc: true
  md: 'In the program, the matrix x is defined prior to calling the UNIVARIATE procedure.
    After the UNIVARIATE procedure, the matrix is still available for further computations.
    This behavior is in contrast to the standard behavior in SAS programs where a
    new procedure (here, UNIVARIATE) causes the previous procedure (here, IML) to
    exit.


    The SUBMIT block enables you to call any SAS procedure, DATA step, or macro as
    if it were built-in SAS/IML subroutine. Any variables in your IML program in scope
    prior to calling the SUBMIT block are still in scope after calling the SUBMIT
    block.


    **Programming Tip:** Use the SUBMIT and ENDDSUBMIT statements to call a SAS procedure
    or DATA step from an IML program.


    The simple example in this section merely prints some statistics about the Budget
    variable; there is no interaction between the IML portion of the program and the
    call to the UNIVARIATE procedure. The next steps show how to transfer data from
    SAS/IML matrices and SAS procedures, and how to pass parameters from SAS/IML software
    into SAS procedures.


    # 4.3 Transferring Data between Matrices and Procedures


    The technique that is described in the previous section becomes more powerful
    when the SAS/IML program interact with the procedure. The following example modifies
    a program discussed on page 58.


    ```

    /* write data to SAS procedure; read results into matrix */

    /* generate bivariate sample * */

    call randseed(12345);       /* set seed for RANDGEN */

    x = j(100, 1);               /* allocate 100 x 1 vector */

    e = j(100, 1);               /* allocate 100 x 1 vector */

    call randgen(x, "Uniform");  /* fill x: values from uniform dist */

    call randgen(e, "Normal"); /* fill e: values from normal dist */


    beta = (2, 3);                  /* coefficients for model */

    d = j(100, 1, 1) || x;         /* append intercept column to data */

    y = beta + e;                  /* response normal error term */


    create MyData var("x" "y"); /* write sample to MyData set */

    append;

    close MyData;


    /* use GLM procedure to estimate parameters for regression model */

    submit;                      /* IMLPlus statement */

    proc glm data=MyData;

    model y = x;

    ods output ParameterEstimates=PE; /* write table to data set */

    run;

    endsubmit;                  /* IMLPlus statement */

    ```'
