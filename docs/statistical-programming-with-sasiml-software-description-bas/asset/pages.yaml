    \nThe ShowBarLabels and ShowPercentage methods in the Histogram class behave identically\
    \ to their counterparts in the Barchart and are discussed in Section 7.3.4. The\
    \ ShowDensity method scales the vertical axis so that the sum of the bar widths\
    \ is unity. This is useful when you want to overlay a parametric or kernel density\
    \ estimate on the histogram, as described in the section “Case Study: Placing\
    \ a Density Estimate” on page 214.\n\nThe SAS/Studio Users has a chapter on “Adjusting\
    \ Axes and Ticks” that describes how to use the ReBin method. The ReBin method\
    \ is useful when you want to specify a new bin width for the histogram. For example,\
    \ you might want bin widths for ages of adults to be an integer multiple of five.\
    \ Alternatively, you might want to choose a bin width that is optimal for exhibiting\
    \ features of the data density.\n\nThe following statements modify the histogram\
    \ in Figure 7.4, which corresponds to the hist object. The program compares the\
    \ default bin widths (computed according to an algorithm by Terrell and Scott\
    \ (1985)) with robust bin widths suggested by Freedman and Diaconis, as presented\
    \ in Scott (1992, p. 75). The robust bin widths are computed as 2.603 IQR n¹/³,\
    \ where the IQR is the range of the data and n is the number of observations in\
    \ the data.\n\nThe following statements modify the program in Section 7.4.1:\n\
    \n```\n/* create new histogram bins */\n/* get current anchor and bin width: Terrell\
    \ and Scott (1985) */\nx0 = hist.GetAxisTickAnchor(MAXIS); /* * 4 */\nh0 = hist.GetAxisTickUnit(MAXIS);\
    \ \n\n/* Freedman-Diaconis robust rule (1981) */\nnonMissing = sum(Budget^=);\n\
    q = quartile(Budget);\nIQR = q[4] - \nh = 2.603 * IQR * nonMissing##(-1/3);\n\
    print x0 h0;\n\n/* round to integer */\nh = round(h, 1);\nhist.ReBin(x0, h); /*\
