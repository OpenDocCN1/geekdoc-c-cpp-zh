  md: '# 6.7 The Plot Class: A Base Class for Graphs


    The Plot class is a base class for all plots. You cannot directly instantiate
    an object of the Plot class, but any graph can call the nearly 100 methods in
    this class.


    The most used methods in this class are related to modifying plot attributes or
    to drawing on a plot, as discussed in Chapter 9, “Drawing on Graphs.” Appendix
    C lists frequently used methods in the Plot class.


    # 6.8 The Data Table Class


    If you want to display a tabular view of data, you can create an object of the
    DataTable class. A data table is dynamically linked to any other graph or table
    that shares the same data object. For example, the following statements create
    a data table that is dynamically linked to the two graphs that are shown in Figure
    6.5:


    ```

    /* create tabular view of data */

    declare DataTable dt;

    dt = DataTable.Create(dobj);

    ```


    The data table might appear behind the program window because SAS/IML Studio tries
    to keep the program window in the foreground of a workspace. This can result in
    the program window obscuring tables or graphs. It can be confusing (and annoying)
    to create a data table that is obscured, so the following techniques are often
    useful:


    +   * nudge the programming window away from the upper left corner of the workspace,
    or

    * use the ActivateWindow method in the ViewData class to force the data table
    to display on top of other windows.


    The following statement displays the data table on top of all other windows:


    ```

    dt.ActivateWindow();           /* display on top; make active */

    ```


    The data table shows selected observations highlighted. For example, Figure 6.6
    shows a data table in which all PG-rated movies are selected.'
