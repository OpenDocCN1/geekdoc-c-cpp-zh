    7.4, but the new Freeman-Diaconis binwidth is substantially smaller than the default
    bin width, as shown in Figure 7.5. With the smaller bin width, the distribution
    appears to be bimodal, with one peak near 20 million dollars and another smaller
    peak near 150 million dollars.'
