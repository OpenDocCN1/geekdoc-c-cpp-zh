    ```

    * note: KernSmooth does not handle missing values */

    submit XVar YVar / R # load package

    library(KernSmooth) # make names of vars available

    attach(df)

    h <- dpill(&XVar, &YVar) # compute plug-in bandwidth

    model <- loctypic(&XVar, &YVar, bandwidth=h) # fit smoother

