    IMLPlus statements with a menu item, which means that SAS/IML Studio executes
    those statements when you select the menu item. In this way, you can attach an
    analysis to a data table or a graph. The menu is called an _action menu because
    it enables you to define some action that is applied to the data or to the graph.'
