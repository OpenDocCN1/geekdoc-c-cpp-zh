    PG are selected. These observations are displayed as highlighted—both in the bar
    chart and also in the scatter plot. From the scatter plot you can observe a few
    facts about the PG-rated movies in data: six PG-rated movies have budgets near
    over 150 million; there were no big-budget PG-rated movies in the spring or summer
    of 2006; and there were only two PG-rated movies in the spring of 2007.


    Figure 6.5 Linked Graphs


    ![](img/148549d50632967f185e36a8bcda3de8_142_0.png)


    You can also select observations in the scatter plot and see the MPAA ratings
    for those observations. You can use dynamically linked graphs such to investigate
    outliers or to explore relationships between movie ratings, budgets, and release
    dates. By creating graphs from a common data object, you enable exploratory analyses
    that are impossible with graphs that are not linked together.


    **Programming Tip:** Create graphs from a common data object. All graphs that
    share the same data object are dynamically linked to each other.'
