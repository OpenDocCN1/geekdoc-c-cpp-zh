    # 3.4.5 Evaluation of Arguments


    The SAS/IML language resolves all matrix expressions prior to calling a subroutine.
    For example, consider the following statements:


    ```

    /* pass temporary matrices to a function or subroutine */

    w = {1, 2, 2, 3, 3, 1, 4, 4, 5};

    r = CorrCoef(w[1], w[2]);

    ```


    The statements call the CorrCoef model defined in Section 3.4.1. The arguments
    to the module are matrix expressions that extract a column from the w matrix.
    When the SAS/IML language processes the CorrCoef function call, it occurs the
    following:


    +   1. The expression w[1] is evaluated. The results are placed in a temporary
    matrix called like _TEM0001.

    2. The expression w[2] is evaluated. The results are placed in a temporary matrix
    called like _TEM0002.

    3. The _TEM0001 and _TEM0002 are passed into the CorrCoef function as arguments
    to the module. The module computes the correlation coefficient for the centered
    data.

    4. When the CorrCoef module returns, the return value of copy is copied into the
    r matrix. The two temporary vectors, _TEM0001 and _TEM0002, are no longer needed,
    so they are deleted.


    In general, SAS/IML allocates temporary matrices when necessary to hold intermediate
    expressions. These temporary matrices are deleted when they are no longer needed.
    In most cases, you do not to worry about temporary matrices: SAS/IML software
    handles the creation and deletion without any intervention from you. However,
    if you use an expression as an argument to a module, SAS/IML creates a temporary
    matrix to hold the expression. If the module modifies argument, then it is the
    temporary matrix that is modified. This is usually not what you intend.


    For example, the following statements call the ReverseRows module defined in Section
    3.4.4:


    ```

    /* be careful when you pass a temporary matrix to a subroutine */

    w = {1, 2, 2, 3, 3, 1, 4, 4, 5};

    run ReverseRows(w[1]);                  /* w[1] creates a temporary matrix */

    print w;                               /* w is unchanged */

    ```'
