    # 2.13 Managing the SAS/IML Workspace


    The SAS/IML language enables you to view and manage the matrices that are kept
    in memory. At any point in your program, you can see the matrices that are defined,
    free the memory that is associated with matrices, and store matrices to a SAS
    catalog.


    You can use the SHOW statement to display the names, dimensions, and type of matrices
