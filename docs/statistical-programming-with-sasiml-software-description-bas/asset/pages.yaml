  md: '# 154 Chapter 7: Creating Statistical Graphs


    # 7.5.1 Creating a Scatter Plot from Vectors


    You can create a scatter plot from two vectors in the same way you can create
    a histogram. The data in a scatter plot is usually continuous numeric data. However,
    the IML scatter plot also supports categorical data (including data) for either
    axis.


    The following program shows one way to create a scatter plot of the Budget variable
    the US_Gross variable:


    ```

    / create a scatter plot from vectors of data */

    use Sasuser.Movies;

    read all "Budget" "US_Gross";

    close Sasuser.Movies;


    declare ScatterPlot p;

    p = ScatterPlot.Create("Scatter", Budget, US_Gross);

    p.SetAxisLabel(XAXIS, "Budget (million $)");

    p.SetAxisLabel(YAXIS, "US Gross (million $)");

    ```


    The program follows the same steps as the program in Section 7.4, except that
    this program creates an object of the ScatterPlot class. The resulting scatter
    plot is shown in Figure 7.7.


    The scatter plot shows that two variables are correlated: movies produced with
    modest budgets typically bring in modest revenues, whereas big-budget movies often
    bring in larger revenues. However, the graph shows movies generated revenue that
    is disproportionate to their budgets. Some movies with small budgets generated
    a relatively large revenue. Other movies were disappointments; their revenue was
    only a fraction of the cost of producing the movie.


    # 7.5.2 Creating a Scatter Plot from a Data Object


    If the data is in a data object, you can create a similar scatter plot.


    Create a data object from the Movies data by using the following statements:


    ```

    / create data object from SAS data set */

    declare DataObject dobj;

    dobj = DataObject.CreateFromServerDataSet("Sasuser.Movies");

    ```


    The following statements create a scatter plot:


    ```

    / create a scatter plot from a data object */

    declare ScatterPlot p2;

    p2 = ScatterPlot.Create(dobj, "Budget", "US_Gross");

    ```


    The program creates the ScatterPlot object, p2, from the data in the Budget and
    US_Gross variables. The first argument to this method is a data object; the second
    and third arguments are the name of the variables that contains the data.


    The scatter plot created in this way is linked to the data object and to all other
    graph and data tables that share the same data object.'
