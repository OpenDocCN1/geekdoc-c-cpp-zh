    Figure 12.7 Turning Off the Auto Hide Property


    ![](img/148549d50632967f185e36a8bcda3de8_299_0.png)


    When the Auto Hide property is turned off, you can see both output windows in
    order to compare parameter estimates, adjusted R square values, and other statistics.

    The same technique works for comparing the contents of program windows, data tables,
    and graphs.


    > **Programming Tip:** To compare the results of analyses in different workspaces,
    turn off the Auto Hide property in the windows you want to compare. This enables
    you to compare output windows, graphs, data tables, and even event statements
    from two different workspaces.


    # 12.7.2 Comparing Analyses in the Same Workspace


    The previous section describes how to compare results that are in different workspaces.
    SAS/IML Studio also enables you to use a single workspace to directly compare
    two different analyses of the same data.

    The main technique to compare two different analyses of the same data is to graph
    similar quantities against each other. For example, if you are comparing two regressions,
    you can create a scatter plot that shows the residuals of one regression model
    against the residuals of the other model. Similarly, you can plot predicted values
    against each other or, in the case of one regressor, overlay both models’ predicted
    values on a scatter plot of the data. This technique is implemented in Section
    12.8.'
  merge: -1
