    # 12.3 Identifying Influential Observations


    An influential observation is one that, according to some measure, has a large
    effect on a regression analysis. Intuitively, an influential observation is one
    for which the analysis would change substantially if the observation were deleted.
    There are many statistics to attempt to quantify aspects of the influence of an
    observation. For details, see Belsley, Kuh, and Welch (1980) or the documentation
    for the INFLUENCE option in the MODEL statement of the REG procedure in the SAS/Stat
    User''s Guide.


    In a regression analysis, there are two types of influential observations: outliers
    in the response variable and outliers in the explanatory variables. The outliers
    in the response variable (often called "outliers") are typically determined by
    the size of a residual or standardized residual. The residuals in the explanatory
    variables are often called "high-leverage points." Cook’s D is a popular statistic
    that incorporates both these notions of influence. An observation is often judged
    to be influential if the Cook’s D statistic exceeds 4/n, where n is the number
    of nonmissing observations (Rawlings, Pantula, and Tukey 1998).


    The program statements in this section are a continuation of the analysis in Section
    12.2 and use the abline module defined in Section 9.4. The standard Cook’ D plot
    is a graph of the Cook’s D statistic versus the observation number. The Cook’s
    D statistic is contained in the CookD variable in the dob data object. The data
    object also contains the ObsNumber variable. The Cook’s D statistic is also contained
    in the SAS/IML vector named CookD, so you can count the number of nonmissing values
    and use that to compute the cutoff value for the Cook’s D statistic. You can use
    the abline module to display the cutoff, as shown in the following statements:'
  merge: -1
  pgno: 289
