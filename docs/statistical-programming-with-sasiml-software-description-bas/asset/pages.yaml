    # 16.5 Dialog Boxes in SAS/IML Studio


    SAS/IML Studio is distributed with modules that create and display several simple
    dialog boxes. All of these modules begin with the prefix “DialogBox” or “MessageBox.”
    You can use these dialog boxes to query user input or to display information to
    the user. These dialog boxes are modal, meaning that the program halts until the
    dialog box is dismissed.


    All of the modules (and others) in this section are documented in the SAS/IML
    Studio online Help, in the chapter titled “IMLPlus Module Reference."


    # 16.5.1 Displaying Simple Dialog Boxes


    This section describes three simple dialog boxes that you can use to query user
    input. The three examples in this section are part of a single program that simulates
    rolling two six-sided dice a enables you to display a graph that shows the distribution
    of the values for the dice rolls.


    The simplest dialog box is a message box. This dialog box presents the user with
    information and then waits until the user clicks OK. The following statements
    use the DoMessageBoxOK module to display a message box with an OK button:


    ```

    title = "Rolling Dice";nmessage = "This game simulates rolling two six-sided dice.";

    DoMessageBoxOK(title, message);

    ```


    The message box is displayed in Figure 16.7. The DoMessageBoxOK has two arguments.
    The first is a string that appears in the title bar of the window. The second
    is the message that is displayed to the user.


    Figure 16.7 A Message Box That Contains an OK Button


    ![](img/148549d50632967f185e36a8bcda3de8_401_0.png)'
