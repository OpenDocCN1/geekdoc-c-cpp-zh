    # C.6 Calling SAS Procedures


    You can call any SAS procedure, DATA step, or macro from within an IMLPlus program.
    Simply enclose the SAS statements between the SUBMIT and ENDSUBMIT statements,
    as shown in the following example:'
  merge: -1
  pgno: 438
- img_proc: true
  md: "```\nsubmit;\ndata a;\n  do x = 1 to 10;\n    y = x + rannor(1);\n    output;\n\
    end;\nrun;\nproc reg data=a;\n  model y = x;\nquit;\nendsubmit;\n/* begin SUBMIT\
    \ block */\n/* run a DATA step */\n/* run a procedure */\n/* end SUBMIT block\
    \ */\n```\n\nYou can pass parameters into SUBMIT blocks as described in Section\
    \ 4.4.\n\n# C.7 Calling R Functions\n\nR is an open-source language and environment\
    \ for statistical computing. You can call R functions from an IMLPlus program\
    \ provided that you have installed a 32-bit Windows version of R on the same PC\
    \ that runs SAS/IML Studio. Enclose the R statements between the SUBMIT and ENDSUBMIT\
    \ statements. The SUBMIT statement must contain the R option, as shown in the\
    \ following example:\n\n```\nsubmit / R;\nlm(Height ~ Girth, data=trees)\nendsubmit;\n\
    ```\n\nYou can pass parameters into SUBMIT blocks as described in Section 4.4.\
    \ The mechanism is the same for calling R functions as it is for executing SAS\
    \ statements."
