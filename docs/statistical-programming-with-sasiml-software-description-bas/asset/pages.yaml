  md: '# 14.5.2 Plotting the Bootstrap Distributions


    If you want to view the bootstrap distributions of the PVE for each principal
    component, you can create a panel of histograms. The ith column of the s matrix
    (computed in the previous section) contains the data for the ith histogram. The
    mean and CI matrices contain the mean and 95%-confidence intervals for each PVE.
    The following statements create a data object from the s matrix. For each column,
    the program creates a histogram and overlays the mean and bootstrap percentile
    interval. The result of histograms is shown in Figure 14.15.


    ```

    /* create data object from bootstrap distribution;

    create histogram and overlay bootstrap mean and C.I. *

    names = "Proportion1"-"Proportion"-strip(char(NumPC))

    de DataObject dob2;

    dob2 = DataObject.Create("PVE", names, s);


    declare Histogram;

    attrib = BLACK || DASHED || 1 || PLOTGROUND;

    doi = 1 to NumPC;

    hist = Histogram.Create(dob2, names[i]);

    /* use a module distributed with SAS/IML Studio to compute

    t position of ith in an array of 6 plots *

    run CalPlotPosition(i, 6, left, top, width, height);

    hist.SetWindowPosition(left, top, width, height);


    /* mean and C.I. *

    run awhile(hist, mean[i]//CI[i], (,,), attrib);


    /* draw rectangle in background to indicate C.I. *

    hist.DrawUseDataCoordinates();

    hist.GetAxisViewRange(YAXIS, Ymin, YMax);

    hist.DrawSetBrushColor(0xC8C8);

    hist.DrawSetRectangle(CI[i, 0], CI[i], YMax-10, true);

    ```


    Figure 14.15 shows the bootstrap distributions for the proportion of variance
    explained by each principal component. The distributions are slightly skewed;
    this is especially noticeable for Proportion2.


    The figure also shows how the dynamically linked graphs in SAS/IML Studio can
    give additional insight into the fact that these five statistics are not independent,
    since the sum of the five proportions must equal unity. In particular, large values
    of the Proportion1 variable are selected. The selected observations correspond
    to bootstrap resamples for which the value of the Proportion1 variable is large.
    For these bootstrap resamples, the Proportion2 variable tends to be smaller than
    the mean taken over all bootstrap resamples. Similar relationships hold for the
    other variables, and also for the bootstrap resamples for which the Proportion1
    variable is small.'
