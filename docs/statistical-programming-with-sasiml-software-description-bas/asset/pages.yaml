  md: "# Drawing an Inset 207\n\nFigure 9.14 A Graph with a Legend and Inset\n\n![](img/148549d50632967f185e36a8bcda3de8_212_0.png)\n\
    \nThe DrawLegend and DrawInset modules share a common feature: you can pass in\
    \ missing values or empty matrices to order default behavior. Object-oriented\
    \ programming languages such as Java or C++ enable the programmer to provide default\
    \ values for unspecified arguments in a function. Unfortunately, the SAS/IML language\
    \ does not enable you to define a module with optional arguments. However, when\
    \ you write a module you can—and should—look at the type and value of an argument\
    \ and use a default value if the argument is an empty matrix or a missing value.\n\
    \n**Programming Tip:** When you write a module, write it so that the user can\
    \ pass in a missing value or an empty matrix in order to use a default value for\
    \ the argument.\n\nFor example, if `arg` is the name of a module argument, you\
    \ can use the following statements to determine whether to use a default value\
    \ for the argument:\n\n```\n/* determine whether to use default value for a module\
    \ argument */\nDefaultArgValue = 12345;\n/* define default value for argument\
    \ */\nif type(arg)='U' then\n    /* arg is empty matrix, use default */\n    argValue\
    \ = DefaultArgValue;\nelse if arg=. then\n    /* arg is missing value, use default\
    \ */\n    argValue = DefaultArgValue;\nelse\n    argValue = arg;/* use value passed\
    \ into module */\n```"
