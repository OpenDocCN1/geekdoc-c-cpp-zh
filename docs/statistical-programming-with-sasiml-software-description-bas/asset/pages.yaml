  md: "# 288 Chapter 12: Regression Diagnostics\n\nThe SAS documentation for the UNIVARIATE\
    \ procedure includes a section on how to interpret Q-Q plots. Briefly, if the\
    \ Q-Q plot lies a straight line, then there is graphical evidence to believe that\
    \ the Q-Q plots are well-described by the theoretical distribution.\n\nThe following\
    \ statements define a module that uses Blom's approach to compute the normal quantiles\
    \ that are associated with univariate data:\n\n```\n/* define module to compute\
    \ normal quantiles associated with data */\nstart GetNormalQuantiles(x);\n  nonMissing\
    \ = loc(x=);                /* locate nonmissing values */\n  numM = ncol(nonMissing);\
    \             /* count the nonmissing values */\n\n  if numM=0               \
    \              /* all values are missing */\n    return (jrow(x), ncol(x), .);\n\
    n  /* rank the observations; handle any missing values */\n  r = jrow(x, ncol(x),\
    \ .);\n  r[nonMissing] = rank(x[nonMissing]);\n```\n\n```\nv = (r-0.375);    \
    \                /* transform quantiles of ECDF */\nq = quantile(\"NORMAL\", v);\
    \           /* associated normal quantiles */\nreturn (q);\n```\n\nYou can call\
    \ the GetNormalQuantiles module on the residuals computed with the R option in\
    \ Section 12.2. These residuals are contained in the data object in the R variable.\
    \ The following statements retrieve the R variable and compute the normal quantiles\
    \ that are associated with the residuals. The DataObject.AddVar method adds those\
    \ normal quantiles to the data object. After adding the normal quantiles, you\
    \ can create a Q-Q plot that is linked to the other plots.\n\n```\n/* create QQ\
    \ plot of residuals */\ndobj.GetVarData(\"R\", r);\nq = GetNormalQuantiles(r);\n\
    dobj.AddVar(\"QN_R\", \"Normal Quantiles\", q);\n```\n\n```\ndeclare ScatterPlot\
    \ qq;\nqq = ScatterPlot.Create(dobj, \"QN_R\", \"R\");\nqq.SetLabel(AXIS, AXISLABEL_VARLABEL);\n\
    ```\n\n```\nmu = r[:];\nsigma = sqrt(var(r));\nrun abline(qq, mu, sigma, .);\n\
    ```\n\nThe graph is shown in Figure 12.5. The abline module adds a line to the\
    \ plot. The slope of the line is the sample standard deviation of the residuals;\
    \ the intercept is the mean of the residuals, which is zero."
