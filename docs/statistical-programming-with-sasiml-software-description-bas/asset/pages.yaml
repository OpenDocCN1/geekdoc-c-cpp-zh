  md: '# Displaying Simple Dialog Boxes 397


    Another simple dialog box is one that contains a single edit field, as shown in
    Figure 16.8. The DoDialogModify module takes a default numerical value and enables
    the user to accept or modify that value, as shown in the following statements:


    ```

    * prompt user for a value to use in an algorithm /

    message = "Please enter the number of times to roll the dice";

    N = 100; /* default number of rolls */

    rc = DoDialogModifyDouble(N, title, message); /* valid specification? */

    if rc = &1 then /* truncate to integer */

    nt = int(N); /* allocate Nx2 vector (2 dice) */

    d = j(N, 2); /* fill with values in (0,1) */

    call randgen(d, "uniform"); /* convert to integers in 1-6 */

    d = ceil(6*d); /* values of the N rolls */

    sum = d[+];

    else

    print "Good-bye"; /* canceled or invalid value */

    ```


    For this part of the program, the value 100 is the default number of dice rolls.
    You can modify that when the user clicks OK, the value in the dialog box is copied
    into the scalar matrix N. The value returned by the module (called the return
    code) is stored in the rc matrix. The return code indicates whether the user entered
    a value and clicked OK. A value of 0 indicates that you should not use the value
    of N; a nonzero value indicates a successful return from the dialog box module.


    ![](img/148549d50632967f185e36a8bcda3de8_402_0.png)


    The program uses the value from the dialog box to simulate rolling dice twice
    N times. The RANDGEN function returns an N × 2 matrix of values in the range (0,
    1). If you call this matrix t, then it is a matrix with values in the range (0,
    6). The CEIL function returns the closest integer than a given value, which results
    in uniformly distributed integers one through six. The subscript operator (+)
    sums the two columns of the matrix, as described in the section "Writing Efficient
    SAS/IML Programs" on page 79.


    The vector d contains the values of simulated dice rolls. The following statements
    use the DoMessageBoxYesNo module to ask the user whether the program should display
    a bar chart that shows the distribution of the values:


    ```

    * prompt user to determine the behavior of an algorithm /

    message = "Would you like to see the distribution of the results?",

    ```'
