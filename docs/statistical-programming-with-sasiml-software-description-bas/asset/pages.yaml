    #  13.8.2 Simulate the Birthday Matching Problem


    The birthday matching problem readily lends itself to simulation. To simulate
    the problem, represent the birthdays by the integers {1, 2, . . . 365} and do
    the following:


    +   1. Choose a random sample of size N (with replacement) from the set of birthdays.
    That sample is a "room.\n2. Determine whether any of the birthdays in the room
    match.

    3. Repeat this process for thousands of rooms and calculate the results.


    The following statements generate a single "room" with 25 people in it. The 25
    birthdays are randomly generated with uniform probability using the SampleWithReplace
    module that is described in Section 13.7:


    ```

    /* create room with 25 people; find number of matching birthdays */

    call randseed(123);

    load module=SampleWithReplace; /* not required in IMLPlus */

    N = 25; /* number of people in room */

    EQUAL = ; /* convention */

    bday = SampleWithReplace(1:365

    ```'
