  md: '# 6.4 Base and Derived Classes


    Some IMLPlus classes are derived from other classes, which means that the derived
    class inherits the methods and properties of the so-called base class. For example,
    the Histogram class is derived from the Plot2D class, which in turn is derived
    from the Plot class, which is derived from the DataView class. Methods available
    in a base class are (usually) available to a derived class.


    The class hierarchy of IMLPlus data views is shown in Figure 6.3. The classes
    listed in the right column are concrete classes, meaning that they can be instantiated.
    The other classes are abstract classes that cannot be directly instantiated. For
    example, you cannot instantiate an object for the DataView class, but you can
    call methods in the DataView class for data tables, bar charts, scatter plots,
    and any other objects of a class derived from the DataView class.


    # Figure 6.3 DataView Class Hierarchy


    ![](img/148549d50632967f185e36a8bcda3de8_139_0.png)


    Figure 6.3 is useful for finding documentation for class methods in the SAS/IML
    online Help. All IMLPlus methods (and an example of their use) are documented
    in the online Help, in the chapter “IMLPlus Class Reference.” To see which methods
    are available for any given type of graph (for example, a bar chart), you need
    to look not only in the documentation for the class itself (BarChart) but also
    in the documentation for all base classes (Plot2D, Plot, and DataView). Most methods
    for graphs are located in the Plot class, which contains nearly 100 methods. In
    contrast, the BarChart class has only six methods that are not defined in a base
    class.'
