    # 11.4.2 What Happens to the Data Attributes?


    Although SAS data (numbers and strings) can be sent to R, the properties that
    are associated with variables and the attributes associated with observations
    are not, in general, transferred to R. R does not support the same properties
    of variables that SAS software uses. For example, SAS data sets use formats, lengths,
    and labels with variables, but R does not. Similarly, IMLPlus data maintains attributes
    for observations, including color marker, and the observation. In general, these
    attributes are not transferred to R when the data are transferred.


    However, there are two variables that require special handling: variables with
    date or time formats, and IMLPlus normals.


    When the ExportDataToR module or the ExportToR method transfers a variable with
    a DATEw., TIMw., or DATETIME class, the corresponding variable is automatically
    assigned to a R class that contains the variable time or date information. A SAS
    variable with the DATEw. is transferred to an R variable with the “Date” class.
    A SAS variable with a TIMw., or DATETIME, is transferred to an R variable with
    the “POSIXct” class.


    **Programming Tip:** Use the DataObject.ExportTo method to create a R data frame
    from an IMLPlus object. Nominal variables in the data object are automatically
    converted to R factors. A variable with a DATEw., TIMw., or DATETIME format is
    automatically assigned to an appropriate R class.


    Similarly, when the ExportToR method of the DataObject class transfers a nominal
    variable to R, the corresponding R variable is automatically assigned the “factor”
    class. A factor is a storage class in R that is used for categorical variables.
    For statistical modeling, using a factor in R to represent a variable is similar
    to listing the variable in a CLASS statement in a SAS procedure. Factors are treated
    as classification variables in analyses.


    For example, the Movies data set, the variable ReleaseDate has a DATE9. When the
    Movies data set is used to create an R data frame, the corresponding ReleaseDate
    variable in R is automatically assigned the “Date” class. Similarly, the NumANomin
    is a numeric variable in the IMLPlus data object; the corresponding variable is
    assigned the “factor” class in R. This is shown in the following statements and
    in Figure 11:5:'
