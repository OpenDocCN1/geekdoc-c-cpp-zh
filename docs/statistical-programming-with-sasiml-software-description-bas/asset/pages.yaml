    # 11.8 Case Study: Optimizing a Smoothing Parameter


    9.7 describes how to call the LOESS procedure and add a smoother onto a scatter
    plot. The LOESS procedure used the SELECT=option to automatically select a smoothing
    parameter in the interval [0, 1] that minimizes the AICC statistic.


    There is also a loess function in R, but that function does not contain an option
    to automatically choose a bandwidth that optimizes some criterion. Section 3.6
    describes a SAS/IML module for optimizing a function of one variable over an interval.
    It is possible to use the golden search section module that is developed in SAS
    to choose a smoothing parameter for the R loess function?


    The answer is yes. Recall that the previously defined GoldenSection module requires
    that you define the module to be minimized. For the current example, the function
    must evaluate the loess model for a given parameter and compute the AICC statistic
    for that model.


    This section demonstrates how SAS and R software work together. The section consists
