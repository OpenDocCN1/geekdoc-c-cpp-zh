  md: "# 11.8.2 Computing an AICC Statistic in R\n\nThe second step in this example\
    \ is to compute the AICC statistic. The documentation for the LOESS procedure\
    \ specifies that the procedure uses the following formula for the AICC statistic:\n\
    \n```\nAICC = \\log(\\hat{\\sigma}^2) + 1 + \\frac{2(Trace(L) + 1)}{n - Trace(L)\
    \ - 2}\n```\n\nwhere $n$ is the number of nonmissing observations, $\\hat{\\sigma}^2$\
    \ is the error mean square, and $L$ is theloess matrix. Fortunately, the `loess.obj`\
    \ object returned by the function contains all of the essential information required\
    \ to compute the AICC statistic.\n\nTo compute the AICC statistic, look at the\
    \ contents of the `loess.obj` object by the `str` function, and see the following\
    \ statements. A partial listing of the structure is shown in Figure-11.\n\n```\n\
    * display structure of an R object */\nsubmit R;\nstr(loess.obj);\nendsubmit;\n\
    ```\n\nFigure 11.5 Partial Listing of the Structure of a Loess Object in R\n\n\
    List of 17\n$ n : 359\n$ fitted : num [1:359] 36.9 36.9 36.9 37.5 37.7 ...\n$\
    \ residuals : Named num [1:359] 8.15 28.15 -6.85 -7.49 -17.24 ...\n  - attr(\"\
    names\") = chr [1:359] \"1\" \"2\" \"3\" \"4\" ...\n$ emp : num 11.2\n$ s : num\
    \ 40.6\n$ one.delta : num 344\n$ two.delta : num 344\n$ trace.hat : num 13.3\n\
    \  more lines ...\n\nThe structure contains 17 components, including three components\
    \ that can be used to construct the AICC statistic. The $n$ component gives the\
    \ number of nonmissing observations. The residuals component can be used to form\
    \ the expression $\\hat{\\sigma}^2 = \\sum r_i^2/n$, where $r_i$ is the $i$/th\
    \ residual. The trace of the smoothing matrix, Trace(L), is given by trace.hat.\
    \ Consequently, the following statements create an R function named `aicc` that\
    \ computes the AICC statistic for a loess object:"
