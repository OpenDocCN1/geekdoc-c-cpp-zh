  md: '# 9.6. Case Study: Plotting a Density Estimate 215


    This section uses the ComputeKDE module to reproduce Figure 9.19. The module either
    be defined in the program window or must be stored in a directory in the IMLPlus
    search path, as described in Section 5.7.


    Recall that the following statements call the ComputeKDE module:


    ```

    DSName = "Sasuser.Vehicles";

    VarName = "Engine_Liters";

    Bandwidth = "MISE";

    run ComputeKDE(x, DSName, VarName, Bandwidth);

    ```


    After the results, the variable x contains evenly spaced values between the minimum
    and maximum values of Engine_Liters. The vector f contains corresponding values
    for the density of Engine_Liters. The following statements verify this information
    on a histogram of Engine_Liters:


    ```

    /* overlay density estimate on histogram */

    declare DataObject obj;

    dobj = DataObject.CreateSqlServerDataSet(DSName);                       /* 1 */

    ```


    ```

    declare Histogram hist;

    hist = Histogram.Create(dobj, VarName);                               /* 2 */

    ```


    ```

    hist.ShowDensity();/* display density instead of frequency */

    hist.DrawDataCoordinates();

    hist.DrawLine(x, f);                                                    /* 3 */

    ```


    The program consists of the following steps:


    +   1. Read the data set. Notice that the string in the DSName vector is passed
    to the DataObject method.


    +   2. Create the histogram. Notice that the variable name is not hard-coded,
    but is set to the value that is contained in VarName.


    +   3. The ShowDensity method is called so that the vertical axis of the histogram
    is on the same scale as the KDE. The KDE is overlaid on the histogram.


    The histogram is shown in Figure 9.19. Notice that this program is “reusable”
    in the following sense: you can change the value of DSName and VarName and the
    program creates a histogram and KDE of the new data.


    > Programming Tip: It is good programming practice to write reusable programs
    that are independent of the data being analyzed.'
