    # 12.6 Regression Diagnostics for Models with Classification Variables


    There have been many studies to determine whether movies are nominated for (or
    win) Academy Awards also enjoy greater box-office revenue as a result of the increased
    publicity (for example, Simonoff and Sparrow (2000); Nelson et al. (2001)). Most
    conclude that an Academy nomination does, in fact, result in increased revenue.


    The Movies data set contains an indicator variable, AANomin, that has value 1
    if the movie was nominated for an Academy Award. This section modifies the regression
    analysis in the previous sections to include this classification variable. The
    complete program is available from this book''s companion Web site


    The first step in the program (transforming variables) remains the same. However,
    in Step 2 of the program, you need to modify the call to the GLM procedure. Specifically,
    you need to add a CLASS statement to specify that AANomin is a classification
    variable, and also add AANomin and any interaction effects to the MODEL statement.
    It turns out that the interaction between LogBudget and AANomin is not significant
    (the p-value for the Type 3 statistic is 0.1223), so the following statements
    use only main effects:'
