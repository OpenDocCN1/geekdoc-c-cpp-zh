    # 11.4 Data Frames and Matrices: Passing Data to R


    In most cases, R function requires data in the form of an R matrix or an R data
    frame. A data frame is an R object that stores variables and observations. Like
    a SAS data set or an IMPPlus data object, a data frame can contain mixed types
    of variables (numeric or character), whereas a matrix can contain only a single
    type of data. This section describes how to transfer SAS data sets, objects, or
    matrices to an R matrix or data frame.


    # 11.4.1 Transferring SAS Data to R


    You can transfer data from three sources: a SAS data set in SAS (such as Work,
    Sasuser, and so on), a data object, and a SAS/IML.


    You can transfer a SAS data set by calling the ExportDataToR(filename) of the
    SAS data set. The first argument is the two-level name `libref.filename` of the
    SAS data set. The second argument is the name of data in R frame to contain the
    data. For example, the following statements create a data frame named MovieFrame
    that contains a copy of the data in the Sasuser.Movies data set:


    ```

    / transfer data from SAS data set to R data frame */

    run ExportDataToR("Sasuser.Movies", "MovieFrame");

    submit /;

    names(MovieFrame)

    summary(MovieFrame$Budget)

    end;

    ```


    The **names** functions displays the names of variables in a data frame. As the
    example indicates, you can use a dollar sign ($) to refer to a particular variable
    within a data frame. The **summary** function prints some descriptive statistics
    about the variable, as shown in Figure 11.2.


    Figure 11.2 Statistics from R (from a SAS Data Set)


    | [1] "Title" | *MPAARating* | *ReleaseDate* | "Budget" |

    |---|---|---||

    | [5] "US Gross" | *World_Gross* | *SexScore* | *ViolenceScore* |

    | [9] "ProficiencyScore" | *NumAAmin* | *NumAAWon* | *AANomin* |

    | [13] "AAWon" | *Notes* | *Distributor* | *Year* |

    | [17] "Sex" | *Violence* | *Profanity* | |


    | Min. | 1st Qu. | Mean | 3rd Qu. | Max. |

    |---|---|---|---|--|

    | 0.15 | 16.50 | 30.00 | 44.83 | 60.00 258.00 |


    > **Programming Tip:** R is case-sensitive. If you transfer a SAS data set (or
    object) to an R data frame, you must refer to the variables in the correct case.
    You can use the **names** function to display the names of variables in a data
    frame.'
