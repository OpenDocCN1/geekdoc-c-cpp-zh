    # 12.8 Case Study: Comparing Least Squares and Robust Regression Models


    This section shows how to compare a robust regression model to the least squares
    regression model that is described in Section 12.2. This comparison is useful
    if you know that there are outliers or high-leverage points in the data and you
    to investigate how the regression changes if you use robust statistics instead
    of least squares. If the robust regression model is similar to the least squares
    model, you can confidently use the least squares model, which is faster to compute.


    The program in this section consists of the following steps:


    +   1. Clear and position an output window that will receive output from the classical
    squares regression analysis.

    2. Run a least squares regression analysis by using the GLM procedure.

    3. Create a second output window that will receive output from the robust regression
    analysis.

    4. Run a robust regression on the same data by using the ROBUSTREG procedure.

    5. Create a single data object that contains the data and the results from both
    analyses.'
