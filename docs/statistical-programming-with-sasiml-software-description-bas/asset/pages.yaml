    # 3.3 Frequently Used Techniques in Data Analysis


    The SAS/IML language can be very useful in data analysis. This section describes
    SAS/IML statements and techniques that you can use to analyze your data. In particular,
    this section describes how to do the following:


    +   * transform variables

    * Locate observations that satisfy a criterion

    * handle missing values

    * analyze observations for each level of a categorical variable


    # 3.3.1 Applying a Variable Transformation


    It is common to transform data during exploratory data analysis and statistical
    modeling. For example, you can apply a linear transformation to scale or center
    a variable. If a variable is heavily skewed, it is common to apply a logarithmic
    transformation in an attempt to work with a more symmetric distribution.


    Logarithmic transformations are common when dealing with variables that describe
    how much something costs. For example, in the Movies® data set, the Budget and
    US_Gross variables are prime candidates for a log transformation. Natural logarithms
    and base-10 logarithms are frequently used in practice.


    Transforming variables in SAS/IML software is easy because the languages support
    common mathematical and algebraic expressions. In addition to logarithmic transformations,
    frequently used transformations in data analysis include square root transformations,
    inverse transformations, power transformations, and exponential transformations.
    All of these are easily programmed in'
