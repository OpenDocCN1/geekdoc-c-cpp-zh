  md: '# 12.4 Identifying Outliers and High-Leverage Observations


    The Cook''s D plot aims to identify observations that either have high leverage
    or are outliers in the response variable. However, if an observation has a large
    Cook''s D value, it is not clear (without further investigation) whether that
    point has high leverage, is an outlier, or. A plot that complements the Cook''s
    D plot is a plot of the studentized residuals versus the leverage statistic for
    each observation.


    These residual and leverage statistics were created in the output data set by
    the GLM procedure in Section 12.2. The program statements in this section are
    a continuation of the analysis in the preceding sections. For the residual-leverage
    plot, Belsley, Kuh, and Welch (1980) suggests adding a horizontal reference line
    at ±2 to identify observations with large studentized residuals, and a vertical
    line at 2p/n to identify points with high leverage, where p is the total number
    of parameters in the model, including the intercept. The following statements
    create the plot and use the abline defined in Section 9.4 to add reference lines:


    ```

    / 9. create plot of studentized residuals versus leverage /

    declare ScatterPlot resid;

    resid = ScatterPlot.Create(dobj, "Leverage", "ExtStudR");

    resid.SetMarkerSize(5);

    n/* 10. draw reference lines on residual-leverage plot * /* horiz line at y=0
    */

    run abline(resid, 0, 0, solidGray); /* outliers: horiz lines at +-2 */

    p = 2; /* number of params */

    leverage = 2*p / nomMiss;

    run abline(resid, leverage, ., ); /* high leverage: vertical line */

    ```


    The resulting plot is in Figure 12.4. The graph shows 10 points that have been
    manually selected and labeled:


    +   - The five movies (also in Figure 12.3) that have the largest Cook''s D: Once,
    Feast, Lonesome Jim, Mad Hot Ballroom, and Quiet. It is now apparent that all
    are high-leverage points and that Once and Feast are outliers.

    - Two movies with large positive residuals that are not high-leverage points:
    Juno and Saw II.

    - Two movies with large negative residuals: Fateless and DOA: Dead or Alive.

    - A movie with high leverage that has a most modest residual: Wordplay.'
