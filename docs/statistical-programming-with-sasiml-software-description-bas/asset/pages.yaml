    # 13.3.2.2 What is the expected gain (loss) for playing the game?


    For many games of chance, it is interesting to calculate the expected gain (or
    loss) for the game, given a particular cost to play and a reward for certain outcomes.


    Suppose a buckster approaches you on a street corner, describes the coin game,
    and offers you the following proposition:


    +   * It costs one dollar to play the game.

    * You keep tossing until the coin comes up on the tails side.

    * If the coin shows tails on the first or second toss, you lose.

    * If your tosses heads two or more times before it shows tails, you win a dollar
    for each head.


    Should you accept the bet? If the game is T or HT, you lose a dollar. If the outcome
    HHT, you get two dollars—but only one of that is a gain, since it costs a dollar
    to play. The outcome HHHT results in a net gain of two dollars, and so on, as
    shown in Table 13.2.'
