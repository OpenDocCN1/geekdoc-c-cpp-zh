  md: "# D.3 The Var Module\n\n```\n/* Var: return sample variance of each column\
    \ of a data matrix */\n/* For this module\n * x is a matrix that contains the\
    \ data\n */\nstart Var(x);\n  mean = x[.,];\n  count = j(i, ncol(x)); /* allocate\
    \ vector for counts */\n  do i = 1 to ncol(x); /* count nonmissing values */\n\
    \    count[i] = sum(x,[i]=); /* in each column */\n  end;\n  var = (x-mean) [##.]\
    \ / (count-1);\n  return ( var );\nfinish;\n```\n\n# D.4 The Qntl Module\n\n```\n\
    /* Qntl: compute quantiles Defn. 5 from the UNIVARIATE doc) */\n/* For this module\n\
    \ * q contains the specified quantiles of\ndata.\n * x is a matrix. The module\
    \ computes quantiles for each column.\n * p specifies the quantiles. For example,\
    \ 0.5 specifies the\nmedian, whereas (0.25 0.75) specifies the first and\nthird\
    \ quantiles.\n * This module does not handle missing values in the data.*/\nstart\
    \ Qntl(q, x, p);\n  n = row(x); /* definition 5 from UNIVARIATE doc */\n  q =\
    \ jncol(p, ncol(x)); /* assume nonmissing data */\n  do j = 1 to ncol(x);\n  \
    \  y = x[j,];\n    call sort(y,1);\n    do i = 1 to ncol(p);\n      k = npp(i);\
    \ /* position in ordered data */\n      k1 = int(k); /* indices into ordered data\
    \ */\n      k2 = k + 1;\n      g = k - k1;\n      if g > 0\n        q[i,j] = y[k2];\
    \ /* return a data value */\n        /* average adjacent data */\n      else\n\
    \    end\n  end\nfinish;\n```"
