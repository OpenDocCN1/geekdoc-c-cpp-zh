    \ four characters fit into the matrix element.\n\nYou cannot dynamically change\
    \ the length of a character matrix, but you can copy its contents to a vector\
    \ that has a longer (or shorter) length. The following statements use the PUTC\
    \ function in Base SAS software to copy a character of values:\n\n```\n/* copy\
    \ character strings to a matrix with a longer length *\nc = (\"Low\" \"Med\" \"\
    High\"); /* maximum length is 4 characters *\nd = put(c, \"$6.\"); /* copy into\
    \ vector with length 6 *\nd[2] = \"Medium\";    * value fits into d without truncation\
    \ *\nlen = len(d);\nprint len, d;\n```\n\nFigure 2.9 Result of Changing the Length\
    \ of a Character Vector\n\n| nlen |\n| 6 |\n| d |\n| Low Medium High |\n\nIn the\
    \ previous statements, the PUTC function applies the $6. format to every element\
    \ of c. The PUTC function returns a matrix with the same dimensions as c. This\
    \ matrix is stored in d.\n\nNotice that e contains a vector of character strings,\
