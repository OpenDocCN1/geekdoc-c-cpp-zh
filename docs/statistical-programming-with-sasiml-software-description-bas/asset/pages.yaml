  md: '# 4.7 Creating Macro Variables from Matrices


    This section describes how to create macro variables from SAS/IML matrices. This
    is an advanced topic that can be omitted during an initial reading.


    Section 4.4 describes how to pass values from a matrix into a SUBMIT block. The
    values of the matrix are substituted into the SUBMIT block before the code is
    sent to the SAS System for processing. The section mentioned that the syntax for
    this string substitution is the same as is used by the SAS macro language, no
    macro variable is actually created.


    It is possible to create a macro variable that contains the contents of a I ×
    1 character matrix, and this section describes how to create such a macro variable.
    The technique uses pure SAS/IML statements; it does not require IMPPlus.


    The macro variable is created using the SYMP subroutine in the SAS language. The
    following program shows an example that uses the SYMP subroutine:


    ```

    /* create a macro variable from a scalar character matrix */

    c = "My String";

    call symput("MyMacroVar", c);

    ```


    The program creates a macro variable that contains the contents of the scalar
    matrix. If c is not a scalar matrix, this approach does not work correctly.


    > Programming Tip: You can use the SYMP subroutine to store the value of a scalar
    SAS/IML character variable into a macro variable.


    If you want to ensure that the macro variable was correctly assigned, you can
    print the value to the SAS log with the %PUT statement. In the SAS/IML language,
    you can use the %PUT statement directly from a SAS/IML program, as shown in the
    following statements:


    ```

    proc iml;

    %put &MyMacroVar;      /* PROC IML statement */

    quit;

    ```


    In SAS/IML the %PUT statement must be inside a SUBMIT block, as shown in the following
    statements:


    ```

    submit;

    %put &MyMacroVar;

    endssubmit;

    ```


    IMLPlus has a shorthand notation for a SUBMIT block that contains a single statement.
    The previous SUBMIT block can also be specified with the following statement:


    ```

    @put &MyMacroVar;      /* IMPPlus statement */

    ```'
  merge: -1
  pgno: 104
- img_proc: true
  md: 'Programming Tip: In IMLPlus, you can send a single statement to the SAS System
    by preceding the statement with the @ symbol. This is useful for submitting global
    statements such as ODS, OPTIONS, or macro statements.


    It is possible, although unruly, to create a macro variable that contains the
    contents of a nonscalar matrix. You first need to concatenate the elements of
    the matrix into a long string, as shown in the following program:


    ```

    /* convert a matrix to a single string */

    c = ("a", "character", "matrix");

    s = "";

    doi = 1 to nrow(c);

    s = strip(concat(s, "", c[i]));

    end;

    print s;

    ```


    **Figure 4.8** Concatenated Matrix Elements


    | s |

    | a character matrix |


    The program uses the STRIP function to remove trailing blanks from each element
    of c, and concatenates the strings together with the CONCAT function. At the end
    of the program the variable s is a scalar matrix that contains each of the strings
    in the original matrix. Consequently, it can be placed into a macro variable as
    shown in the previous section. Notice, however, that this requires much more effort
    than use in the SUBMIT statement as shown in the following program:


    ```

    /* concatenate strings using parameter substitution */

    c = ("a", "character", "matrix");

    submit c;

    %put &c;

    endsubmit;

    ```


    In this example, (which does not create a macro variable), the SUBMIT block is
    equivalent to the following statement:


    ```

    %put a character matrix;

    ```


    In a similar manner, you can use the CHAR function or the PUTN function to convert
    numeric values into character values and store the converted values in a macro
    with the SYM subroutine. However, it is simpler to use substitution in the SUBMIT
    statement.


    Programming Tip: Pass the values of SAS/IML matrices into SAS procedures by listing
    the matrices in the SUBMIT statement and referring to them within the SUBMIT block.
    Rarely do you need to create a macro variable in IMLPlus programs.'
  merge: -1
  pgno: 105
