    # 5.10 Querying for User Input


    SAS/IML Studio distributes modules that create and display several simple dialog
    boxes. All of these modules begin with the prefix “DoDialog” or “DoMessageBox.”
    You can use these dialog boxes to query input or display information to the user.
    These dialog boxes are modal, meaning that the program halts execution until the
    dialog box is dismissed. These modules are described in Chapter 16, “Interactive
    Techniques.”


    # 5.11 Differences between IMLPlus and the IML Procedure


    This chapter primarily focuses on ways the IMLPlus programming language extends
    the SAS/IML language. Most computational modules and programs that run in the
    IML procedure also run in IMLPlus without modification. However, there are a small
    number of IML statements and functions that are not supported in IMLPlus. The
    differences are described in the online Help in the chapter “The IMLPlus Language.”


    Of these differences, the most important PROC IML statement that is not available
    in IMLPlus is the EXECUTE subroutine.'
