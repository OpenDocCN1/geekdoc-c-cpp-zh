  md: '# 6.5. Creating a Graph 135


    **Programming Tip:** Most of the methods you can call from a graph or data table
    are documented in base classes such as the Plot and ViewData classes.


    Notice that the class hierarchy in Figure 6.3 does not contain the DataObject
    class. The DataObject class is not part of the ViewData hierarchy. In fact, the
    hierarchy for the DataObject class is remarkably simple: the DataObject class
    does not have any base or derived classes.


    # 6.5 Creating a Graph


    Suppose you want to create a graph as a bar chart. In technical terms, you want
    to instantiate an object of the BarChart class. To do this, you need to call the
    BarChart.Create method. There are several signatures for the Create method, but
    the simplest way to create a bar chart is to create it from a variable in a data
    object.


    The following program creates a data object from the Movies data set. It initializes
    a bar chart and calls methods defined in several base classes. Each base class
    for the BarChart class is shown in Figure 6.3.


    ```

    /* call base class methods for object of BarChart class */

    declare DataObject obj;

    obj = DataObject.CreateFromDataSet("Sasuser.Movies");

    ```


    ```

    /* create a bar chart from a variable in a data object */

    declare BarChart bar;

    bar = BarChart.Create(obj, "MAAARating");

    /* call various methods that modify attributes of the bar chart */

    bar.ShowPercentage(); /* BarChart method */

    bar.SetAxisViewRange(YAXIS, 0, 50); /* Plot2D method */

    bar.ShowReferenceLines(); /* Plot method */

    bar.SetWindowPosition(50, 50, 50, 50); /* DataView method */

    ```


    The bar chart is shown in Figure 6.4. Of the four methods in the program, only
    one is defined in the BarChart class. The other three methods are defined in one
    of three base classes for the BarChart class (see Figure 6.3).


    **BarChart class method** The ShowPercentage method in the BarChart class specifies
    whether the Y axis of the bar displays frequencies or percentages.


    **Plot2D class method** The SetAxisViewRange method in the Plot2D base class enables
    you to explicitly set the range of an axis in a two-dimensional graph. All graphs
    except the rotating plot can call this method.


    **Plot class method** The ShowReferenceLines method in the Plot class (which adds
    reference lines to a graph) can be called by all graphs, but not by a data table.'
