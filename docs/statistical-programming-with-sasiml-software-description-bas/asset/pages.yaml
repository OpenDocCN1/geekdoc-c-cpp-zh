  md: '# Chapter 7: Creating Statistical Graphs


    Figure 7.5 Tick Anchor, Default Bin Width, and New Bin Width


    | x0 | h0 | h |

    | 0 | 25 | 15.93186 |


    The previous statements implement five new steps:


    +   4. Get the current histogram anchor (x0) and bin width (h0). The GetAxisTickAnchor
    and GetAxisTickUnit methods are provided by the Plot class, which is a base class
    of the Histogram class.

    5. Compute the number of nonmissing observations (nNonMissing). Although the Budget
    variable does not contain missing values, it is a good idea to write programs
    that handle missing missing values, as discussed in the section "Handling Missing
    Values" on page 65.

    6. Call the QUARTILE module (which is part of the IMLIBIB library) to compute
    the five-number summary of the data. The vector q contains the minimum, first
    quartile, second quartile (median), third quartile, and maximum values of the
    data. The interquartile range, IQR, is computed as q[4]-q[2].

    7. Compute the Freeman-Diaconis bin width. The bin width is approximately 15.9
    and is stored in the matrix h.

    8. Call the ReBin method with the existing anchor and the new bin width. For this
    example, the bin width is rounded to the nearest integer so that the axis tik
    labels look nicer.


