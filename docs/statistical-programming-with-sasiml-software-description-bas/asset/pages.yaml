    # 13.7 A Module for Sampling with Replacement


    In the previous sections, you used SAS/IML statements to choose from some set
    of events with some probability. For simulating a coin toss, you sample from the
    set {Heads, Tails} with equal probability 1/2. For simulating a roll of two dice,
    you sample twice (independently) from the set {1, 2, 3, 4, 5, 6} with equal probability
    1/6. For simulating a choice of socks, you sample from the set {Black, Brown,
    White} with associated probabilities {0.5, 0.2, 0.3}.


    Each of these examples is an instance of the general problem of sampling with
    replacement from a set of events. It is both useful and instructive to construct
    a SAS/IML module that samples with replacement from a given set. The module will
    be a function that returns a matrix that contains random samples from a given
    set. A convenient syntax for the module might be


    ```

    sample = SampleWithReplace(A, numSamples, prob);

    ```


    where the arguments are follows:


    +   * A

    is is the set of events from which to sample.


    +   * NumSamples

    s려서 the number of times to sample.


    +   * prob

    sifies the probabilities for sampling. Because sampling with equal probability
    is an important case, it is useful to adopt the convention that if this argument
    is a missing value, then the module should ensure that each element of A has equal
    probability of being selected.


    For example, simulating coin toss 1000 times, you could call the module as:


    ```

    EQUAL = ; /* convention: missing implies uniform probability */

    tosses = SampleWithReplace("H", 1000, EQUAL);

    ```


    In this call, EQUAL is explicitly set to be a missing value. The module must check
    whether the argument is a missing value. If so, it should sample from the events
    with equal probability.



    The following statements define the module SampleWithReplacement:




    +   * Random sampling with replacement. The arguments are:

    * A

    events (sample space)


    +   * numSamples

    is the number of times to sample from A.


    +   * numSamples[1]

    is the number of rows returned.


    +   * numSamples is a vector, then numSamples[2]


    +   * specifies the number of repeated draws from A

    that are contained in each sample.


    +   * prob

    sifies the probabilities that are associated with

    each element of A. If prob=. (missing), then equal

    probabilities are used.


    +   * The module returns a matrix that contains elements of A. The matrix

    * has numSamples[1] rows. or numSamples[2] columns.

    */'
