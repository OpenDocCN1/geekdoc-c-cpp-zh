    \ 425\n\n# ## B.1 Overview of the SAS/IML Language\n\nThe SAS/IML language contains\
    \ over 300 built-in functions and subroutines. There are also hundreds of functions\
    \ in Base SAS software that you can call from SAS/IML programs.\n\nThe best overview\
    \ of these functions is Chapter 23, “Language Reference” (*SAS/IML User’s Guide*).\
    \ The section “Overview” lists the SAS/IML functions according to their functionality;\
    \ the section “Base SAS Functions Accessible from SAS/IML Software” lists the\
