  md: '# 1.2. Comparing the SAS/IML Language and the DATA Step 5


    +   - You can read data from a SAS data set into a matrix.


    +   - You can pass matrices to functions.


    +   - Many functions act on the columns of a matrix by default.


    +   - You can perform mathematical operations on matrices and vectors by using
    a natural syntax.


    +   - You can analyze data and compute statistics without writing loops. Notice
    in the program that there is no explicit loop over observations, nor is there
    a loop over the variables.


    In general, the SAS/IML language enables you to create complex programs by using
    a syntax that is natural and convenient for statistical computations. The language
    is described in detail in Chapter 2, “Getting Started with the SAS/IML Matrix
    Programming Language."


    # 1.2 Comparing the SAS/IML Language and the DATA Step


    The statistical power of SAS procedures and the data manipulation capabilities
    of the DATA step are sufficient to satisfy the needs of many analysts. However,
    sometimes you need to implement a proprietary algorithm or an algorithm that has
    recently been published in a professional journal. Others, you need to use matrices
    to compute and extend results from procedures. In these situations, you can write
    a program in the SAS/IML language.


    The syntax of the SAS/IML language has much in common with the DATA step: neither
    language is case-sensitive, variable names can contain up to 32 characters, and
    statements must end with a semicolon. Furthermore, the syntax for control statements
    such as the IF-THEN/ELSE statement and the iterative DO loop is the same for both
    languages. The two languages use the same symbols to test a quantity (=), inequality
    (!=), and to compare quantities (for example, <=). The SAS/IML language enables
    you to call all the mathematical functions provided in the DATA step, such as
    LOG, SQRT, ABS, SIN, COS, CELL, and FLOOR.


    > Programming Tip: You can call DATA step functions from your SAS/IML programs.


    Conceptually, there are two main differences between the DATA step and a SAS/IML
    program. First, the DATA step implicitly loops over observations, whereas a typical
    SAS/IML program does not. The fundamental unit in the DATA step is an observation,
    whereas the fundamental unit in SAS/IML language is a matrix.


    In general, SAS/IML software is intended for statistical computation, whereas
    the DATA step is best for merging, extracting, and transforming data. This is
    a gross oversimplification, and the author has some impressive statistical accomplishments
    with the DATA step! However, in many cases, these computations would be shorter
    to read and simpler to execute if they were written in SAS/IML software. The reason
    is: SAS/IML functions can use all of the data to compute statistics, whereas the
    DATA step functions process one observation at a time. For example, computing
    the standard deviation of a variable in the DATA step is more difficult than computing
    the same quantity in PROC IML.'
  merge: -1
  pgno: 10
- img_proc: true
  md: '# 6 Chapter 1: An Introduction to SAS/IML Software


    # 1.3 Overview of SAS/IML Software


    To run SAS/IML programs, you need to use SAS/IML software. The software consists
    of two components: the IML procedure and the SAS/IML Studio application.


    The IML procedure has been a part of the SAS System since Version 6 in the early
    1980s. Traditionally, SAS programmers used PROC IML to implement computational
    algorithms that are not built into any SAS procedure.


    SAS/IML Studio is new. It is a programming environment for developing, running,
    and debugging SAS/IML programs. It includes the ability to call SAS procedures,
    DATA steps, and macro functions from SAS/IML programs. It also includes dynamically
    linked graphics. SAS/IML Studio is useful for developing programs and also for
    running programs that exploit interactive features of the software.


    SAS/IML Studio has undergone several name changes. The product was initially released
    as a Web download in 2001 under the name “SAS/IML Workshop.” In 2007, the product
    was renamed “SAS Stat Studio” and was distributed as part of the SAS/IML product
    in SAS 9.2. The product was renamed SAS/IML Studio in July 2009 to better emphasize
    its relationship to the SAS/IML programming language.


    SAS/IML continues to evolve. This book describes features of the IML procedure
    that are available in SAS 9.2 and mentions new features that are available in
    the 9.22 release of SAS/IML software. This book describes features of SAS/IML
    Studio 3.3.


    # 1.3.1 Overview of the IML Procedure


    The IML procedure implements the SAS/IML language. PROC IML is an interactive
    procedure in the sense that each statement is executed as it is submitted. You
    can submit several statements, examine the results, submit more statements, and
    so on. When you define a matrix, it persists until you quit the procedure, free
    the memory, or redefine it. This is different from many other SAS procedures,
    which do not execute any statements until a RUN statement is submitted. The RUN
    statement in the SAS/IML language is used to execute a module or subroutine, so
    do not attempt to use the RUN statement as the last statement in a PROC IML call!
    To exit from PROC IML, use the QUIT statement.


    > **Programming Tip:** Do not use a RUN statement at the end of a PROC IML program.
    In interactive mode, each statement is executed as it is submitted.


    You need a license for the SAS/IML product in order to run PROC IML. PROC IML
    executes on a SAS server.'
  merge: -1
  pgno: 11
- img_proc: true
  md: '# Running a PROC IML Program 7


    # 1.3.2 Running a PROC IML Program


    There are several ways to run a SAS program. The traditional way to run PROC IML
    is to use the SAS Display Manager. You type a program into the Enhanced Editor
    and choose Run►Submit from the main menu. You can also press F3 to run a program.


    A second traditional way is to use SAS Enterprise Guide. You type a program into
    a Program window and click Run on the Program menu.


    In both of these environments, you need to begin your program with the PROC IML
    statement, as shown in the following program:


    ```

    /* convert temperatures from Celsius to Fahrenheit scale */

    proc iml;

    Celsius = (-40, 0, 20, 30, 100);    /* some interesting temperatures */

    Fahrenheit = 9/5 * Celsius + 32; /* convert to Fahrenheit scale */

    print Celsius Fahrenheit;

    ```


    Figure 1.2 Some Temperatures in Celsius and Fahrenheit Scales


    | Celsius | Fahrenheit |

    |--- | --- |

    | -40 | -40 |

    | 0 | 32 |

    | 20 | 68 |

    | 37 | 98.6 |

    | 100 | 212 |


    The PRINT statement displays the value of variables to the current output destination
    (such as the SAS LISTING destination). You can submit additional statements that
    use the results of previous assignment statements, as shown in the following statements:


    ```

    /* convert to Kelvin scale */

    Kelvin = Celsius + 273.15;

    print Kelvin;

    ```


    Figure 1.3 Some Temperatures in the Kelvin Scale


    | Kelvin |

    |--- |

    | 233.15 |

    | 273.15 |

    | 293.15 |

    | 310.15 |

    | 373.15 |


    The variable Celsius, defined in the first set of statements, remains available
    until you quit the procedure or free the variable. When you use the IML procedure
    in this way, you are essentially using it as a massively powerful calculator.'
  merge: -1
  pgno: 12
- img_proc: true
  md: '# 1.3.3 Overview of SAS/IML Studio


    SAS/IML Studio is a programming environment for developing, running, debugging
    SAS/IML programs. It is available for no additional fee when you license SAS/IML
    and SAS/STAT software.


    The programming language of SAS/IML is called IMLPlus. IMLPlus is an extension
    of the SAS/IML language that contains additional programming features. IMLPlus
    combines the flexibility of programming in the SAS/IML language with the power
    to call SAS procedures and to dynamically modify listed graphs. Consequently,
    IMLPlus contains all of the capabilities of PROC IML, but it can do much more.
    The IMLPlus language is described in Chapter 5, “IMLPlus: Programming in SAS/IML
    Studio"


    > Programming Tip: An IMLPlus program must be run from SAS/IML Studio. You cannot
    create IMLPlus graphics or other IMLPlus features unless you use SAS/IML Studio.


    SAS/IML Studio is designed to serve the needs of SAS programmers who need a rich
    programming environment in which to develop algorithms, to explore data, to investigate
    relationships between variables, to formulate and compare statistical models,
    and to detect and understand outliers in the data.


    Figure 1.4 shows a SAS/IML Studio workspace with a program window, an output window,
    and two dynamically linked graph windows. The SAS/IML environment contains many
    features that assist the programmer in developing programs. For example, the environment
    is ideal for the programmer who loves to multitask. The environment is multithreaded,
    which means that you can develop and run several programs simultaneously. Each
    program environment (called a workspace) has its own program window, output window,
    error log, and windows that display graphs and data tables. While you are working
    on one program, the windows that belong to other programs are hidden so that you
    do not get confused about which windows are associated with which analysis. Each
    workspace also has its own Work library for storing temporary data sets.'
  merge: -1
  pgno: 13
