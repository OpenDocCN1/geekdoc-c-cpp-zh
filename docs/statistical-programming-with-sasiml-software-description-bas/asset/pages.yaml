  md: "# 5.7.2 Local Variables in Modules\n\nIn PROC IML, a module that has no arguments\
    \ uses variables in the global scope of the program. Inside the module, you can\
    \ access variables from the global scope. Also, any new variables that you define\
    \ in the module are accessible outside the module. For example, the following\
    \ statements define a module in PROC IML that has no arguments:\n\n```\n* define\
    \ PROC IML with no arguments */\nproc iml;\nx=1;\nstart MyMod;\n  /* module with\
    \ no arguments */\ny=x;\n  /* x and y are both global variables */\nfinish;\n\n\
    run MyMod;\nprint y;\n/* assigns y to the value of x */\n/* y is available outside\
    \ the module */\n```\n\n**Figure 5.2** A Variable That Is Global in Scope\n\n\
    | y |\n| 1 |\n\nNotice that the matrix x is defined in the main program. When\
    \ the MyMod module is run, the module uses matrix x to initialize the matrix y.\
    \ Even though y is created within the module, the matrix y is also available outside\
    \ the module.\n\nIn IMLPlus, you can use parentheses on the START statement to\
    \ declare that you want the module to have local variables. The following statements\
    \ define a module with local variables:\n\n```\n* define IMLPlus module with no\
    \ arguments */\nx=1; /* x is defined in the main program */\nstart MyFunc(); /*\
    \ no arguments; local variables */\nny=2; /* y is a local variable */\n  return\
    \ ( y ); /* return the value of y */\nfinish;\n\nt = MyFunc(); /* copies values\
    \ into t */\n```\n\nIn this program, the MyFunc module takes no arguments, but\
    \ the module contains local variables because parentheses are used on the START\
    \ statement. Inside the module, the matrix x is not available unless you explicitly\
    \ use a GLOBAL clause on the START statement. The local matrix y is defined in\
    \ the module; you cannot access y from the main program.\n\n# 5.7.3 Creating an\
