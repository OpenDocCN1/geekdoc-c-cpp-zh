  md: '# Chapter 9: Drawing on Graphs


    Plot the mean markers


    The fourth step is to compute the location of the markers and plot them.

    The horizontal position of the markers should be at the center of the boxes. There
    are NumGroups boxes, and each has the same width. Because the horizontal coordinates
    were chosen to be in [0, 1], the distance between each horizontal tick mark is
    1/NumGroups. It follows that the center of each box is located at the values contained
    in the XCenters vector in Figure 9.8. The vectors are computed in the following
    statistics:


    ```

    /* compute coordinates of horizontal centers of boxes */

    dx = 1/NumGroups;                       /* 1/5, in this example    */

    BinEdges = (0:NumGroups-1)+dX;         /* 0, 1/5, ..., 4/5      */

    XCenters = BinEdges + dX/2;             /* 1/10, 3/10, ..., 9/10 */

    print BinEdges, XCenters;

    ```


    Figure 9.8 Horizontal Coordinates for Each Category


    | BinEdges | | | | |

    |---|---|---|---||}{

    | 0 | 0.2 | 0.4 | 0.6 | 0.8 |

    | XCenters | | | | |

    | 0.1 | 0.3 | 0.5 | 0.7 | 0.9 |


    Figure 9.8 shows the values of the edges and centers of the categories in the
    [0, 1] coordinate system. Notice that the index operator (*) has lower precedence
    than arithmetic operators (+, -, *), so that: NumGroups-1 is equivalent to 0:4
    for this example.


    Programming Tip: Suppose a graph of a categorical variable contains N categories.
    If you use [0, 1] for the coordinates of that axis, then the center of the ith
    category is located at (i - 1/2)/N. If you use instead [0, N] for the coordinates
    of that axis, then the center of the ith category is located at i - 1/2.


    The program is almost complete. The horizontal coordinates of the markers are
    contained in the XCenters vector and the vertical coordinates are contained in
    the GrossMean vector, so you can draw the markers and set the title in Figure
    9.6 with the following statements:


    ```

    box.DrawMarker(XCenters, GrossMean, MARKER_CIRCLE, 8);

    box.SetTitleText(''Markers Indicate Mean US Revenue'', true);

    ```


    Notice that the DrawMarker method accepts vectors for the horizontal and vertical
    coordinates. Calling the method once is more efficient than writing a loop that
    plots a graph at XCenters[i] and GrossMean[i] for each appropriate value of i.


    You can use the SetTitleText to add a title to a graph. The optional second argument
    (true) causes the SetTitleText method to immediately display the title.'
