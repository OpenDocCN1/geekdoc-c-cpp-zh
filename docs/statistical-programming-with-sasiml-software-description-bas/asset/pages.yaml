    # 16.5.2 Displaying a List in a Dialog Box


    When we want to present the user with a list of possible choices, you can use
    the DoDialogListItem or DoDialogGetItems modules. The DoDialogListItem module
    enables the user to choose a single item from the list, the DoDialogGetItems module
    enables the user to select one or more items from the list.


    The two modules have a similar syntax. The first argument is a matrix that serves
    as an output argument. When the module returns, the matrix contains the indices
    of the items that the user selected. The second and third arguments are the title
    and message for the dialog box; these arguments are identical to the arguments
    for the DoMessageBox dialog box. The fourth is a character matrix; each row contains
    the text for the list. The last argument is a character matrix that labels the
    columns in the list.


    The following statements present the user with a list of all numeric variables
    in a data set, and run a correlation analysis on the variables that the user selects:


    ```

    * prompt user choose variables for an analysis */

    declare DataObject dob;

    dob = DataObject.CreateFromDataSet("Sasuser.Vehicles");

    ```


    ```

    * get vector of numeric variables */

    do = 1 to dob.GetNumVar(); /* 1 */

    name = dob.GetVar(i); /* get the name */

    if dob.IsNumeric(name) then /* if variable is numeric */

    varNames = varNames //; add it to the vector*/

    ```


    ```

    rc = DoDialogGetLength(selections, /* 2 */

    "Correlation Analysis",

    "Please select variables for correlation analysis.",

    varNames, "Name");

    ```


    ```

    if rc then do; /* 3 */

    vars = varNames[selections]; /* 4 */

    dob.WriteVarsToDataSet(vars, /* 5 */

    "Work", "In", true);

    ```


    ```

    submit vars; /* 6 */

    proc data=In simpleprob;

    var &vars;

    /* analyze selected vars */

    run;

    endsub;

    ```


