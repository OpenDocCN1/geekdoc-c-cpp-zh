  md: '# Chapter 11: Calling Functions in the R Language


    **Programming Technique:** To pass the contents of a SAS/IML matrix, m, into R
    statements, list the matrix in the SUBMIT statement and reference the matrix inside
    the SUBMIT block using an ampersand (&).


    The SUBMIT block contains R statements. The first statement loads the KernSmooth
    package. The next statement uses the attach statement to add df to a search path
    so variables in the data frame can be referred to by name. (Alternatively, you
    can refer to a variable as df&XVar, and so forth.) The dpill and lcopopy functions
    are provided by the KernSmooth package. The first function uses "plug-in" method
    to return a bandwidth for the kernel regression method. The bandwidth is stored
    in the variable h. The value is used in the lcopopy function, which actually computes
    the regression estimate. The last estimate in the SUBMIT block is a call to the
    detach function, which removes the df data frame from the search path.


    The model object is a simple structure that contains two vectors: modelx and modely.
    The next statements read the R structure directly into a SAS/IML matrix and plot
    the model on a scatter plot of the data:


