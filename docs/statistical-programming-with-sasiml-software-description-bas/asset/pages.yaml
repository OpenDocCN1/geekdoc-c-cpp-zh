  md: '# 3.6. Case Study: Finding the Minimum of a Function 85


    Figure 3.24 A Schematic Illustration of the Golden Section Search


    ![](img/148549d50632967f185e36a8bcda3de8_90_0.png)


    In the figure, $a = 0, b = 1, x_1 = 0.382, x_2 = 0.618$, and the function is minimized
    at the value indicated by the vertical dotted line. Because $f(x_1) < f(x_2)$,
    the algorithm chooses $[a, x_2]$ as the new bracketing interval. A new point is
    chosen in the larger of the intervals $[a, x_1]$ or $[x_1, x_2]$. For the example
    in the figure, the new point is $x_3 = 0.236$. Because $f(x_3) < f(x_1)$, the
    algorithm chooses $[a, x_1]$ as the new bracketing interval, and so forth.


    The golden section algorithm guarantees that the length of the bracketing interval
    decreases at a constant rate, and that rate is related to the "golden ratio" that
    gives the algorithm its name. The following statements define a SAS/ML module
    that implements the golden section search in order to find the value of $x$ that
    minimizes the function in the module Func:


    ```

    /* define module that implements the golden section search *

    start GoldenSection(a0,b0,eps);

    /* Find the value that minimizes the continuous unimodal function

    * f (defined by the module "Func") on the interval [a,b] by using

    * a golden section search. The algorithm stops when b-a < eps.

    *

    * Example:

    * start Func(x);

    * return\ x#(x-0.5)

    * finish;

    * x0 = GoldenSection(0,1,le-4);

    */

    w = (sqrt(5)-1)/2;

    a = a0; b = b0;

    x1 = w*a + (1-w)*b;

    x2 = (1-w)*a + w*b;

    fx1 = Func(x1);

    x2 = Func(x2);

    ```'
