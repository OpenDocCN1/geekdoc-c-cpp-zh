    # 10.3 Changing the Display Order of Categories


    An ordinal variable is a categorical variable for which the various categories
    can be ordered. For example, a variable that contains the days of the week has
    a natural ordering: Sunday, Monday, ... Saturday.


    By default, all graphs display categorical variables in alphanumeric order. This
    order might not be the most appropriate to display. For example, if you create
    a bar chart for days of the week or months of the year, the bar chart should present
    categories in a chronological order rather than in alphabetical order. Similarly,
    for values with “Low,” “Medium,” and “High,” the values of the variable suggest
    an order that is not alphabetical.


    Sometimes it is appropriate to order categories according to the values of statistic
    applied to the categories. For example, you might want to order a bar chart according
    to the frequency counts, or you might want to order a box plot according to the
    mean (or median) value of the categories.


    This section describes how to change the order in a graph which displays the levels
    of a categorical variable. For information about the SAS/IML Studio GUI to see
    the section “Ordering Categories of a Nominal Variable” (Chapter 11, SAS/IML Studio
    User’s Guide).


    # 10.3.1 Setting the Display Order of a Categorical Variable


    Suppose you want to create a bar chart showing how many movies in the Movies data
    set were released for each month, all years. You can determine the month each
    movie was released by applying the MONNAME format to the ReleaseDate variable.


    The following program creates a new variable (Month) in the data object that contains
    the month in which each movie was released. The program also creates a bar chart
    (shown in Figure 10.5) of the Month variable.'
