  md: "# 234 Chapter 10: Marker Shapes, Colors, and Other Attributes of Data\n\nstruct\
    \ a piecewise linear function that maps values to colors. Defining this mapping\
    \ requires linear interpolation between colors. Specifically, given two colors,\
    \ what are the colors between them?\n\nLinear interpolation of real numbers is\
    \ straightforward: given numbers $x$ and $y$, the numbers between them are parameterized\
    \ by $(1-t)x+ty$ for $t \\in [0,1]$. Linear interpolation of colors works similarly.\
    \ If two colors, $x = (x_r, x_g, x_b)$ and $y = (y_r, y_g, y_b)$, are represented\
    \ as triples of integers, for each $t \\in [0,1]$, the color $c=(1-t)x+ty$ is\
    \ between $x$ and $y$. In general, $c$ is not a triple of integers, so in practice\
    \ you must pick a color close to $c$, typically by using the INT, FLOOR, or ROUND\
    \ functions in Base software.\n\nColor interpolation makes it easy to color observations\
    \ by marks of a continuous variable. Let $v$ be the vector that contains the values.\
    \ Assume that you have a color ramp with two colors, $a$ and $b$ (represented\
    \ as triples). The idea is to assign the color $a$ to any observations with the\
    \ value $\\min(v)$ and any observations with the value $\\max(v)$. For intermediate\
    \ values, interpolate colors between $a$ and $b$. How can you do this? First,\
    \ normalize the values of $v$ by applying a linear transformation: for each element\
    \ of $v$, let $t_i = (v_i-\\min(v))/(\\max(v)-\\min(v))$. Notice that the values\
    \ of $t$ are in the interval $[0,1]$. Consequently, you can assign the observation\
    \ with value $v_i$ the color to $(1-t_i)a+t_ib.\n\nThe following program implements\
    \ these ideas for a two-color ramp that varies between light and dark brown. The\
    \ program uses linear interpolation to color observations according to values\
    \ of a continuous variable.\n\n```\n* linearly interpolate color of each observation\
    \ */\nobj.GetVarData(\"US.Group\", v);\na = IntToRGB(CREAM);\nb = IntToRGB(BROWN);\n\
    t = (v-min(v)) / (max(v)-min(v));\ncolors = (1-t)*a + t*b;\nobj.SetMarkerColor(1:row(v),\
    \ colors);\n```\n\nThe previous statements were not written to handle missing\
    \ values in $v$, which can be easily adapted. This is left to the reader to change\
    \ the program to use a color ramp that is formed by any pair of colors. The steps\
    \ of the program are as follows:\n\n+   1. Represent the two colors as RGB triples,\
    \ $a$ and $b$.\n2. Normalize the values of $v$. The new vector $t$ has values\
    \ in the interval $[0,1]$.\n3. Linearly interpolate between the colors. The **colors**\
    \ vector does not contain integer values, but you can use the INT, FLOOR, or ROUND\
    \ functions to the **colors** vector. If you do not explicitly truncate the values,\
    \ the SetMarkerColor method truncates the values (which is equivalent to applying\
    \ the INT function).\n4. Call the SetMarkerColor to set the colors of the observations.\n\
    \nIt is not immediately apparent that Step 3 involves matrix computations, but\
    \ here the vector $t$ is an $n \times 1$ vector, and the vectors $a$ and $b$ are\
    \ $1 \times 3$ row vectors. Therefore, the matrix product $t\\cdot b$ is an $n\
    \ \times 3$ matrix, and similarly for the product $(1-t)\\cdot a$."
