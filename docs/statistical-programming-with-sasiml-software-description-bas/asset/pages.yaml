  md: '# B.2 A Summary of Frequently Used SAS/IM Operators


    The SAS/iml language provides standard elementwise operators as addition, subtraction,
    multiplication, and division. See Section 2.12 for details. The following table
    lists frequently used SAS/iml operators:


    Table B.1 Frequently Used SAS/iml Operators

    | Statement | Description |

    |---|---|

    | & | Logical AND |

    | | | Logical OR |

    | ^ | Logical negation |

    | - | Elementwise unary negation |

    | + | Elementwise addition |

    | - | Elementwise subtraction |

    | # | Elementwise multiplication |

    | / | Elementwise division |

    | ## | Elementwise power |

    | * | Matrix multiplication |

    | ** | Matrix power |

    | | Matrix transpose |

    | || | Horizontal concatenation of matrices |

    | // | Vertical concatenation of matrices |


    A complete list of operators is available in the Chapter 23, “Language Reference”
    (SAS/iml User’s Guide).


    The SAS/iml language does not have bitwise logical operators; use the BAND, BNOT,
    BOR, and BXOR functions for bitwise operations.


    # B.3 A Summary of Functions and Subroutines


    This section lists many of the SAS/iml functions and subroutines that are used
    in statistical data analysis. For a complete list of functions, see the “Overiew”
    of the Chapter 23, “Language Reference” (SAS/iml User’s Guide).


    # B.3.1 Mathematical Functions


    The SAS/iml language contains all of the standard mathematical functions that
    are available in the SAS DATA step. If you call one of these functions with a
    matrix argument, the function returns a'
  merge: -1
  pgno: 425
- img_proc: true
  md: 'matrix of values. For example, the following statement applies the SQRT function
    to every element of a 1 × 4 matrix:


    Table B.2 indicates a few of the many mathematical functions that are available
    in the SAS/IML language.


    | Table B.2 Mathematical Functions |

    | Function | Description |

    | ARCOS, ARSIN, ATAN, ... | Inverse trigonometric functions |

    | COS, SIN, TAN, ... | Trigonometric functions |

    | EXP, LOG, SQRT, ... | Basic mathematical functions |

    | INT, FLOOR, CEIL, ... | Truncation functions |


    # B.3.2 Probability Functions


    Table B.3 indicates a few of probability functions that are available in the SAS/IML.


    | Table B.3 Probability Functions and Subroutines |

    | Function | Description |

    | CDF | Returns a value from a cumulative probability distribution |

    | NORMAL | Generates pseudorandom numbers from a normal distribution |

    | PDF | Returns a value from a probability density distribution |

    | QUANTILE | Returns a quantile from a distribution |

    | RANDGEN Call | Generates pseudorandom numbers from a distribution |

    | RANDSEED Call | Specifies the sequence for the RANDGEN subroutine |

    | UNIFORM | Generates pseudorandom numbers from a uniform distribution |


    You can use the NORMAL and UNIFORM functions for generating small samples. However,
    the RANDGEN subroutine implements a Mersenne-Twister random number generator that
    is preferred by experts in statistical computation. You should use the RANDGEN
    subroutine when you intend to generate random numbers.


    # B.3.3 Descriptive Statistical Functions


    Several functions for descriptive statistics were introduced in SAS/IML 9.22:
    COUNTMISS, COUNTN, MEAN, PROD, QNTL, and VAR. Table B.4 lists some of the SAS/IML
    functions and subroutines for computing descriptive statistics.'
  merge: -1
  pgno: 426
- img_proc: true
  md: '# 422 Appendix B: SAS/IML Operators, Functions, and Statements


    # **Table B.4** Descriptive Statistical Functions and Subroutines


    | Function | Description |

    | --- | --- |

    | COUNTMISS | Returns the number of missing elements |

    | COUNTN | Returns the number of nonmissing elements |

    | CUSUM | Returns the cumulative sum of the elements |

    | MIN, MAX | Returns the minimum or maximum elements |

    | MEAN | Returns various means of the elements |

    | PROD | Returns the product of the elements |

    | QNTL Call | Returns quantiles of the elements |

    | RANK | Returns the ranks of the elements |

    | RANTIE | Returns the tied ranks of the elements |

    | SSQ | Returns the sum of the squares of elements |

    | SUM | Returns the sum of the elements |

    | VAR | Returns the variance of the elements |


    # ## B.3.4 Matrix Query Functions


    A matrix query gives you information about a matrix. What are the dimensions of
    the matrix? Are the data numerical or character? Are any elements nonzero? What
    are the locations of the nonzero elements? Table B.5 lists some of the matrix
    query functions.


    # **Table B.5** Matrix Query Functions


    | Function | Description |

    | --- | --- |

    | ALL | Returns 1 if all elements are nonzero |

    | ANY | Returns 1 if any element is nonzero |

    | CHOOSE | Returns a value based on a criterion evaluated for each observation
    characters |

    | LENGTH | Returns a size for each element in a character matrix. For English
    characters, this size corresponds to the number of characters in each element
    |

    | LOC | Returns the indices that satisfies a criterion |

    | NCOL, NROW | Returns the number of columns and rows |

    | NLENG | Returns a scalar number that indicates the size (in bytes) of the elements
    of a matrix |

    | TYPE | Returns the type of matrix: ‘C’, ‘N’, ‘U’ |


    # ## B.3.5 Matrix Reshaping Functions


    Table B.6 lists functions that create, resize, or reshape a matrix. See Chapter
    2, “Getting Started with the SAS/IML Matrix Programming Language,” for details.'
  merge: -1
  pgno: 427
- img_proc: true
  md: '# B.3.6. Linear Algebra Functions 423


