    # 14.5 Case Study: Bootstrap Principal Component Statistics


    The bootstrap examples in this chapter have far been fairly simple: the statistic
    was either a mean or the difference of means. This section uses the bootstrap
    method to estimate confidence intervals for a statistic that occurs as part of
    a principal component analysis.'
