    # 4.9 Calling SAS Functions That Require Lists of Values


    In addition to calling SAS procedures from a SAS/IML program, the SAS/IML language
    enables you to call Base functions and subroutines. In most cases, you do not
    need to do anything special in order to use these functions from a SAS/IML program.
    For example, the LOG, CEIL, PUTN, and PDF functions are all part of Base SAS,
    but you can easily call them from SAS/IML programs. In fact, you can pass a vector
    of values to most Base functions. For example, log(x) returns the logarithms of
    x, whether x is a scalar value or a matrix.


    However, Base SAS functions require that you explicitly list arguments. For example,
    if you want to compute the harmonic mean of, 10 numbers, the HARMEAN function
    in Base SAS is available, but the documented syntax requires a comma-separated
    list of arguments, as shown in the following example:


    ```

    * find the harmonic mean of 10 numbers */

    /* First way: list numbers in call to Base SAS HARMEAN function */

    submit;

    data a;

    h = harmean(1,2,5,3,5,4,3,2,1,2);

    run;

    proc print;

    run;

    endsubmit;

    ```


    **Figure 4.10** Computing a Harmonic Mean in Base SAS


    | Obs | h |

    |---|---|

    | 1 | 2.076125 |


    This syntax is not convenient for a SAS/IML programmer who has a vector that contains
    the 10 values. Therefore, SAS/IML provides a vectorized version of the HARMEAN
    function:'
