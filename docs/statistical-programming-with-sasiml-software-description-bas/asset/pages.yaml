    # 11.6.2 Merging R Results with Data That Contain Missing Values


    By convention, an output data set created by a SAS regression procedure contains
    the same number of observations as the input data. In fact, the output data set
    created by most OUTPUT statements also contains a copy of the modeling variables
    from the input set. If some observation contains a missing value for any of the
    explanatory variables in the model, then the predicted value for that observation
    is also missing.


    This is not the default behavior for R regression functions. Instead, the default
    behavior is to drop observations that contain missing values. Consequently, if
    your explanatory variables contain missing values, the number of observations
    for fitted values and residuals is smaller than the number of observations in
    the data. This can be a problem if you want to merge the results from R into a
    SAS data set.


    The following statements demonstrate this behavior.


    ```

    / compute predicted values in R when the data contain missing values */

    x = (, 2, 1, 4, 3);

    y = (1, 2, 2, 4, 3);

    run ExportMatrixR(x, "x");

    run ExportMatrixR(y, "y");


    submit / R;

    lm.obj <- lm(y-x) # default behavior: omit obs with NA

    pred <- fitted(lm.obj) # predicted values from linear model

    print(pred)

    endsubmit;

    ```


    The output, shown in Figure 11.11, shows that the result of the **fitted** function
    is a vector of four numbers, whereas the input data contains five observations.
    The first row of numbers in Figure 11.11 represents the observations with nonnoning
    values. The predicted values for these observations are the second row of numbers.


