    # 12.1 Overview of Regression Diagnostics


    A regression diagnostic identifies observations that are unusual or highly influential
    in a regression analysis. It is a good idea to plot regression diagnostics when
    you perform such an analysis.


    The SAS/STAT regression procedure uses ODS Graphics to create diagnostic plots.
    However, it is also useful to create diagnostic plots by using the statistical
    graphics in SAS/IML Studio, as shown in this chapter. Because the graphs in SAS/IML
    Studio are interactive, it is easy to identify and investigate outliers and high-leverage
    points for a regression model. For example, you can click an outlier on a graph.
    This labels the outlier and highlights it in another graph. You can double-click
    on an observation to examine the values of other covariates. If there is a large
    group of outliers, you can select all of the outliers and determine whether others
    share some characteristic such as a high (or low) value of some covariate. If
    so, you can revise your model by incorporating covariate into the regression model.


    If used correctly, these plots can assist you in building statistical models and
    investigating outliers. For an explanation of the statistics that are associated
    with regression diagnostics, see Belsley, Kuh, and Welsch (1980).'
  merge: -1
  pgno: 284
- img_proc: true
  md: 'Programming Tip: Use interactive graphics to create diagnostic plots. Use the
    plots to identify and examine unusual or influential observations in a regression
    model.


    This chapter is an applied chapter that describes how to do the following:


    +   - Fit a regression model.

    - Add reference lines to a scatter plot.

    - Identify influential observations as outliers and high-leverage observations.

    - Compare two regression models.


    # 12.2 Fitting a Regression Model


    This section uses the techniques that are described in Chapter 4 to call the GLM
    procedure to perform a linear regression and create the graphs of the analysis
    in SAS/IML Studio. Techniques from Chapter 9 are used to add prediction bands
    and reference lines to the graphs in order to make the graphs interpretable.


    The regression model for this example uses variables from the Movies dataset.
    As seen in previous chapters, there appears to be a relationship between the Budget
    of a movie and the US_Gross variable (see Figure 7.7). However, neither variable
    is normally distributed (see Figure 7.6), so Atkinson (1985) and others suggest
    a normalizing transformation to these variables. For these data, it makes sense
    to apply a logarithmic transformation to each variable (see Figure 8.5) and to
    model the log-transformed variables.


    The analysis that begins in this section is continued in subsequent sections.
    The following list is an outline of the main steps in the analysis. The numbers
    used in the list are also used in comments in the program.


    +   1. Apply a logarithmic transformation to the US_Gross and Budget variables.

    2. Call PROC GLM to run a regression analysis.

    3. Read predicted values and confidence limits in SAS/IML vectors.

    4. Create a data object that contains the data and results.

    5. Create a plot of the data.

    6. Overlay the results of the regression analysis.

    7. Create Cook’s D diagnostic plot (Section 12.3).

    8. Overlay reference lines on Cook’s D plot.'
  merge: -1
  pgno: 285
- img_proc: true
  md: "# 12.2. Fitting a Regression Model 281\n\n9. Create a plot of studentized residuals\
    \ leverage (see Section 12.4).\n\n10. Overlay reference lines on the residual-leverage\
    \ plot.\n\nThe following statements transform the variables and use PROC GLM to\
    \ fit a regression model:\n\n```\n/* create regression diagnostic plots in SAS/IML\
    \ Studio */\nsubmit;\n/* 1. log transform of US_Gross and Budget variables */\n\
    data movies;\n    set Sasuser.Movies;\n    LogUS_Gross = log(Gross);\n    LogBudget\
    \ = log(Budget);\n    label LogUS_Gross = \"log (US Gross)\" LogBudget = \"log\
    \ (Budget)\";\nrun;\nn/* 2. run class regression analysis */\nproc glm data=movies;\n\
    \    model LogUS_Gross = LogBudget;\n    output=P LCLM=LCLM UCLM=UCLM /* predictions\
    \ and CLM */\n    R=R TSTUDENT=ExtStud /* residuals */\n    /* influence diagnostics\
    \ */\n    CookD=CookD H=Leverage;\nquit;\nendsubmit;\n```\n\nThe DATA step computes\
    \ the transformed variables named LogBudget and LogUS_Gross. Then the GLM procedure\
    \ is called to model LogBudget by LogUS_Gross. The output data set (called GLMOut)\
    \ contains the input data in addition to six new variables created by the procedure:\n\
    \nP contains the predicted values for the model\n\nLCLM contains the lower 95%\
    \ confidence limits for the mean of the predicted value\n\nUCLM contains the upper\
    \ 95% confidence limits for the mean of the predicted value\n\nR contains the\
    \ residual values for the model\n\nExtStud contains entirely studentized residuals,\
    \ which are studentized residuals with the current observation deleted. (Recall\
    \ that a studentized residual is a residual divided by its standard error.)\n\n\
    CookD contains Cook's D influence statistic\n\nLeverage contains the leverage\
    \ statistic\n\nThe output from the GLM procedure is shown in Figure 12.1."
