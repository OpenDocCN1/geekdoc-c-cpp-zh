    # 8.8.1 Variable Transformations


    As mentioned in Section 3.3.1, it is common to transform data during exploratory
    data analysis and statistical modeling. If a variable is highly skewed, it is
    common to apply a logarithmic transformation in an attempt to work with a more
    symmetric distribution.


    The program in this creates a data object from the Movies data set. Methods in
    the DataObjectClass are used to create the Budget variable into a SAS/IML vector.
    SAS/IML functions are used to transform the data, and then a DataObject method
    is used to create a new variable in the object that contains the transformed data.
    The program is as follows:


    ```

    /* transform data, add new variable, and create histogram */

    declare DataObject dobj;

    dobj = DataObject.CreateServerDataSet("Sasuser.Movies");

    dobj.GetVarData("Budget", b); /* 1 */


    /* apply log transform */

    log_b = log(b); /* 2 */

    dobj.AddVar("LogBudget", "log (Budget)", log_b); /* 3 */

    Histogram.Create(dobj, "LogBudget"); /* 4 */

    ```


    As usual, the object of the DataObjectClass is called dobj. It is instantiated
    from the Movies data. The program contains the following steps:


    +   1. The GetVarData retrieves the data in the Budget variable and puts the data
    into a vector called b.

    2. The LOG function applies a logarithmic transform to the data and stores the
    transformed data in the log_b vector.

    3. The AddVar method adds the transformed data to the data object. The first argument
    is the name of the new variable, in this case LogBudget. The second argument is
    the label for the new variable. The third argument is the vector that contains
    the data for the new variable.

    4. The Data object is invisible, so it is reassuring to create a data table or
    graph to make sure that the program worked. In this case, the program creates
    a histogram of the new variable.


    The result of the program is shown in Figure 8.5. The logarithmic transformation
    has created a new variable whose distribution is more symmetric than the distribution
    of the original data.'
