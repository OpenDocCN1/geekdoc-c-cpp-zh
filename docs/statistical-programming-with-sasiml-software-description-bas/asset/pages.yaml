  md: '# 5.9 Features for Debugging Programs


    Debugging a SAS/IML program in the SAS Enhanced Editor can be challenging. SAS/IML
    Studio has three features that make debugging programs easier. The first feature
    is that SAS/IML Studio has a program editor that colors keywords in the IMLPlus
    language. The second feature is that you can jump directly to the location of
    a programming error in the program window. The third feature is that you can use
    the PAUSE statement in conjunction with the Auxiliary Input window to debug your
    program.


    # 5.9.1 Jumping to the Location of an Error


    There are two kinds of errors that cause a program to report an error: the parse-time
    error and the run-time error. Common parse-time errors include mistyping a statement,
    forgetting a set of parentheses. In all cases, the syntax of the program is incorrect.
    In SAS/IML Studio, you can select **Program=Check Syntax** to check your program
    for parse-time errors.


    On the other hand, a run-time error does not occur until the program is actually
    run. Common run-time errors include adding matrices that are different sizes,
    taking logarithm of a negative value, and using the matrix index to specify indices
    that do not exist.


    If you run a program and SAS/IML Studio reports a parse-time error or run-time
    error, then the Error Log window appears. (The Error Log window appears automatically
    provided that the **Auto activate** property is not selected, you can view the
    Error Window by pressing the F8 key.) The Error message in the Error Log window
    typically ends with a pair of numbers that indicate the position (line number
    and column number) of the error in the program window, as shown in Figure 5.4.
    To jump directly to the location of the error in the program window, do the following:


    +   1. Position the cursor on the error message.

    2. Right-click the error message. A pop-up menu is displayed.

    3. Select the **Go to Source** menu item.


    The program window becomes active and SAS/IML Studio positions the cursor at the
    location of the error. You can also go to an error location by pressing CTRL+G.'
  merge: -1
  pgno: 126
