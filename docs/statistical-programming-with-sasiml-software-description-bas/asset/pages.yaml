  md: "# 4.2 Calling a SAS Procedure from IMLPlus\n\nWhen you run an IMLPlus program\
    \ in SAS/IML Studio, the IMLPlus interpreter knows how to make sense of two kinds\
    \ of statements: SAS/IML statements and IMLPlus statements. IMLPlus statements\
    \ are extensions to the SAS/IML language that run in SAS/IML Studio. This section\
    \ introduces two IMLPlus statements: the SUBMIT statement and the ENDSUBMIT statement.\n\
    \nSAS/IML Studio executes some IMLPlus statements (such as graphics commands)\
    \ on the client PC, and sends the other statements to the SAS Workspace Server\
    \ for execution. Statements from the SAS Workspace Server are assumed to be “pure”\
    \ SAS/IML statements. If you want to execute a global statement (an ODS, OPTIONS,\
    \ macro statement) or run a SAS procedure or DATA step, you need to precede the\
    \ SAS statements with a SUBMIT statement and follow them with an ENDSUBMIT statement.\
    \ The statements from the SUBMIT statement to the ENDSUBMIT statement are collectively\
    \ referred to as a SUBMIT block.\n\n**Programming Tip:** In IMLPlus, you must\
    \ enclose a global statement (for example, an ODS, OPTIONS, or macro statement)\
    \ in a SUBMIT block.\n\nThe following example shows how to call the UNIVARIATE\
    \ procedure on a SAS library from within an IMLPlus program. The program prints\
    \ descriptive statistics such as the skewness and kurtosis of the Budget variable\
    \ in the Movies data set.\n\n```\n/* UNIVARIATE procedure from an IMLPlus program\
    \ {}\n/* some matrices are defined before the call */\nx = 1:10;\n/* IMLPlus statement:\
    \ call a SAS procedure */\nproc univariate data=Saser.Movies;\n  var Budget;\n\
    \  ods select Moments;\nrun;\nendsubmit; /* return from the SAS procedure */\n\
    /* the matrices are still defined! /\ny = sum(x);\n```\n\n**Figure 4.1** Output\
    \ from the UNIVARIATE Procedure Called from an IMLPlus Program\n\n| N | 359 |\
    \ Sum Weights | 359 |\n|---|---|---|---|\n| Variable: | Budget (million USD) |\
    \ | |\n| Mean | 44.82277 | Sum Observations | 16093.025 |\n| Std Deviation | 41.9658513\
    \ | Variance | 1761.13267 |\n| Skewness | 1.76633581 | Kurtosis | 3.49160391 |\n\
    | Uncorrected SS | 135193.45 | Corrected SS | 630848.497 |\n| Coeff Variation\
    \ | 93.6165861 | Std Error Mean | 2.21487292 |"
  merge: -1
