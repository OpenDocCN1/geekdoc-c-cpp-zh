    # 8.8.3 A Module to Add Variables from a SAS Data Set


    The analysis in the previous section calls a SAS procedure (GLM) and writes the
    results of the procedure to an output data set. These results are then read into
    vectors and added to an IMLPlus data object. This sequence of operations occurs
    so frequently that SAS/IML Studio is distributed with a module that reads variables
    from a SAS data set in lib and adds those variables to a data object. The module
    is named CopyServerDataToDataObject; it is documented in the online Help "IMLPlus
    Module Reference."


    The module is implemented so that it not only adds variables but also preserves
    the formats of variables. For example, the following module call is an alternative
    way to add the Pred and Residual values from the GLM data set:


    ```

    // + add predicted and residual values to a data object /

    VarNamesInDataSet = ("Pred", "Resid");

    VarNamesDataObject = ("Pred", "Resid"); same for this example +

    Labels = ("Predicted", "Residual")

    ok = CopyServerDataToDataObject("work", "GLOut", dobj,

    VarNamesInDataSet, VarNamesDataObject, Labels);

    /* / replace if it already exists */);

    ```


    The module returns 1 if it succeeds and 0 if it already exists. Note that you
    can specify the names of the variables in the data object independently of the
    names of the variables in the SAS data set.


    **Programming Tip:** Use the CopyServerDataToDataObject module to add variables
    in a SAS data set to a data object.'
