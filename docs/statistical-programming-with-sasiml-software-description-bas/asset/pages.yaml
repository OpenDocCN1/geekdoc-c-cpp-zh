  md: "```\n/* create an R function that computes AICC for a loess model */\nsubmit\
    \ / R;\naicc <- function(loess.obj) {\n  n <- loess.obj$n\n  r <- loess.obj$residuals;\n\
    \  TraceL <- loess.obj$trace.hat\n  sigma.hat2 <- sum(r^2, na.rm=TRUE) / n\n \
    \ aicc <- log(sigma.hat2) + 1 + (2*(TraceL+1)) / (n-TraceL-2)\n  return(aicc)\n\
    }\nubmit;\n```\n\nNotice that defining a function in R is very similar to defining\
    \ a function in SAS/IML. The following statements call the function and display\
    \ the AICC value for the loess model with the smoothing parameter 0.15:\n\n```\n\
    submit / R;\naicc(loess.obj)\nendsubmit;\n```\n\nThe value computed by the aicc\
    \ function (shown in Figure 11.16) is close to the value reported in Figure 9.20.\n\
    \n# Figure 11.16 AICC Statistic Computed by an R Function\n\n[1] 8.448075\n\n\
    # 11.8.3 Encapsulating R Statements into a SAS/IML Module\n\nThe third step in\
    \ this example is to write a SAS/IML module that encapsulates the R code. Recall\
    \ that the GoldenSection module (defined in Chapter 3) calls a SAS/IML function\
    \ called Func. The Func module takes a single parameter and returns the function\
    \ evaluated at parameter. In this example, the parameter is the smoothing parameter\
    \ for the loess fit. The function is the AICC statistic for the fit. Consequently,\
    \ the following statements define a SAS/IML module that uses R to fit a loess\
    \ model and compute the AICC statistic for model:\n\n```\n/* module calls R to\
    \ compute a model and statistic */\nstart Func(alpha) global (Xvar, Yvar);\n/*\
    \ Fits a loess model in R for a value of a smoothing parameter, alpha.\n* Returns\
    \ the AICC statistic. */\nsubmit alpha Xvar Yvar / R;\nloess.obj <- loess(&XVar\
    \ &YVar, data=df, span=&alpha,\n  na.action=\"na.exclude\", degree=1, normalize=FALSE,\n\
    \  control=loess.control(iterations=1));\n\ncrit <- aicc(loess.obj);\nendsubmit;\n\
    run ImportFromR(aicc, \"crit\");\nreturn (aicc);\nfinish;\n```"
