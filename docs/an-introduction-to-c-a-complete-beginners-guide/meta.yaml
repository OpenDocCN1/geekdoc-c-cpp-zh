  md: "# Introduction to Switch Statements\n\nA switch statement which is also known\
    \ as a case statement is used to test a condition against a list of values. Each\
    \ value is called a case. A switch statement is a lot like if/else statement that\
    \ you have used before. Switch statements are more efficient and faster to use\
    \ than if/else statements. Switch statements are ideal for the use of menu systems.\n\
    \n# Activity 20: Creating your switch statement\n\nIn this program we are going\
    \ to create a simple grading program where a grade is entered a comment is output\
    \ to the user. Create a new C++ project called “Grade”, enter the below code,\
    \ save and compile.\n\n```\n#include <iostream>\nusing namespace std;\nint main\
    \ ()\n{\n    char grade;\n\n    cout<<\"Please enter the Students grade\";\n \
    \   cin>>grade;\n\n    switch(grade)\n    {\n        case 'A':\n            cout\
