    \            break;\n        case 'D':\n            cout<<\"Better try again\"\
    \ << endl;\n            break;\n        default:\n            cout<<\"Invalid\
    \ grade\" << endl;\n    }\n    cout << \"Your grade is \" << grade << endl;\n\
