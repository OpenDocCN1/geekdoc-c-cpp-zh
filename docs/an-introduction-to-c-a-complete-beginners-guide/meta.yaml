    }\n```\n\n## 活动 11 - 荚里的豆子\n\n在这个程序中，我们将声明一个全局变量和两个局部变量。其中一个是标准的局部变量，另一个被声明为常量。常量是在程序运行之前必须具有初始化值的变量，且它的值在整个程序过程中保持不变。常量的值在运行时不能更改。\n\
    \n```cpp\n#include <iostream>\nusing namespace std;\n\nint num1;// I am a global\
