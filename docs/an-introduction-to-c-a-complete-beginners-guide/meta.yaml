    ## The ASCII Table


    Computers can only understand binary language. Computers can only understand such
    characters like ‘@’ or ‘y’, they can only understand their binary equivalent.


    The ASCII (American standard code of information interchange) table shows the
    numerical representation of a character in decimal, which is then converted to
    binary by the compilers.


    - Character codes 0 – 31 of the ASCII table are non-printing characters.

    - Character codes 32–127 are printable characters and character’

    - Character codes 128–255 are the extended ASCII codes for printable characters.


