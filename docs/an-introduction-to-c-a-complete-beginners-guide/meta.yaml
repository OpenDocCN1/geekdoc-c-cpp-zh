  md: "# Introduction to C++\n\nC++ was developed by Bjarne Stroustrup at AT&T Bell\
    \ Laboratories in the early 1980's, and is based on the C language. The name is\
    \ a pun - \"++\" is a syntactic construct used in C (to increment a variable),\
    \ and C++ is intended to be an incremental improvement of C. Most of C++ is a\
    \ subset of C, so most C programs can be compiled (i.e. converted into a series\
    \ of low-level instructions that the computer can execute directly) using a C++\
    \ compiler.\n\nC++ is considered to be a multi paradigm language, as the way it\
    \ can be implemented can vary. This book will cover C++ as a procedural language,\
    \ and conforms to the ANSI (American national standard institute) and ISO (International\
    \ standards organisations). This means that you can take all the source code from\
    \ this book, and run it in any compiler.\n\nTo be able to successfully run the\
    \ source code in this book you will need the following:\n\n+   * A computer (Windows,\
    \ OSX, Linux)\n* An IDE (Integrated development environment)\n    * Windows (Visual\
    \ Studio)\n    * OSX (X code)\n    * Linux (Code Blocks)\n\nFor a free version\
    \ of this software, then please visit www.bcotcomputing.co.uk\n\nAll source code\
    \ in this guide has been implemented using Visual Studio 2013 professional and\
    \ can be found on the school's website. This software has been installed on all\
    \ of the machines in the school of computer science. It can also be downloaded\
    \ for free using your dreams spark account by clicking this link\n\n| Did you\
    \ know? | Many programming languages derive from C, such as C#, PHP, Objective-c.\
    \ If you can learn C++ you can easily transfer your knowledge and skills to other\
    \ programming languages. |"
