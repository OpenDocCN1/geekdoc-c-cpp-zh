    \ 是 C++ 中标准输出流的名称，整个语句的含义是将字符序列（在本例中为 Hello World 字符序列）插入到标准输出流（cout，通常对应于屏幕）中，被声明且我们需要包含特定的文件，并在代码稍早之前声明我们正在使用这个特定的命名空间。\n\
