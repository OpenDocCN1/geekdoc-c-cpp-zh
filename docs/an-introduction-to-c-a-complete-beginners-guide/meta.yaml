    cout<<\"Hello World\"<<endl;\nreturn 0;\n}\n```\n\n// 我的第一个 C++ 程序\n\n这是一行单行注释，它不会影响程序的性能。我们使用注释来对代码进行标注，解释程序的功能。显示注释有两种方式（//\
    \ 用于单行）。为了编写特定程序或源代码的描述，你可能希望跨越几行代码。为此，我们使用 (/* */)\n\n#include <iostream>\n\n\
    using namespace std;\n\n标准 C++ 库的所有元素都声明在一个称为命名空间（namespace）中，名为 std 的命名空间。因此，为了访问其功能，我们通过此表达式声明我们将使用这些实体。这行代码在使用标准库的\
    \ C++ 程序中非常常见。\n\n## int main()\n\n这一行对应于 main 函数定义的开始。main 函数是所有 C++ 程序开始执行的起点，无论它在源代码中的位置如何。在它之前或之后是否定义了其他同名函数并不重要——此函数定义中包含的指令将是任何\
    \ C++ 程序中第一个执行的指令。出于同样的原因，所有 C++ 程序都必须有一个 main 函数是至关重要的。\n\n代码中该单词后面跟着一对括号（()）。这是因为它是一个函数声明：在\
    \ C++ 中，函数声明与其他类型表达式的区别在于紧跟在它名称后面的这些括号。可选情况下，这些括号内部可以包含一个参数列表。\n\n紧接这些括号，我们可以找到用大括号\
    \ { } 包围的 main 函数体。这些大括号的内容就是函数执行时所的操作。\n\n```cpp\ncout<<\"Hello World\" << endl;\n\
