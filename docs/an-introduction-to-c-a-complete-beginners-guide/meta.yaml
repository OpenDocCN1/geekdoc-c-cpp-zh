    in C++ programs that use the standard library.


    # int main()


    This line corresponds to the beginning of the definition of the main function.
    The main

    function is the point by where all C++ programs start their execution, independently
    of its

    location within the source code. It does not matter whether there are other functions
    with

    names defined before or after it - the instructions contained within this function''s

    definition will be the first ones to be executed in any C++ program. For that
    same

    reason, it is essential that all C++ programs have a main function.


    The word is followed in the code by a pair of parentheses (()). That is because
    it is a

    function declaration: In C++, what differentiates a function declaration from
    other types of

    expressions are these parentheses that follow its name. Optionally, these parentheses
    may

    enclose a list of parameters within.


    Right after these parentheses we can find the body of the main function enclosed
    in braces

    {}. What this braces is what the function does when it is executed.


    ```

    cout<<"Hello World" <<endl;

    ```


    This line is a C++ statement. A statement is a simple or compound expression that
    can

    actually produce some effect. In fact, this statement performs the only action
    that

    generates a visible effect in our first program, cout is the name of the standard
    output

    stream in C++, and the meaning of the entire statement is to insert a sequence
    of

    characters (in this case the Hello World sequence of characters) into the standard
    output

    stream (cout, which usually corresponds to the screen), is declared and we need
    to include

    specific file and to declare that we were using this specific namespace earlier
    in

    our code.


    Notice that the statement ends with a semicolon character (:). This character
    is used to

    mark the end of the statement and in fact it must be included at the end of all
    expression

    statements in all C++ programs (one of the most common syntax errors is indeed
    to forget

    to include some semicolon after a statement). <<endl; is used after the output
    statement

    move any other statements onto its own line of the output window. As see

    above in the output window "Press key to continue" is on its own line. If the

    <<endl; was removed then the output statement "hello world" would be on the same
    line

    asas "press key to continue".


    # return 0;


