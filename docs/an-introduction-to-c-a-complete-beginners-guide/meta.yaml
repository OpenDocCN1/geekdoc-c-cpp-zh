    or number such as ‘A’, ‘b’, ‘$’, ‘1’. A simple char will use at least 1 byte (8
    bits) of storage space.


    # Float (Decimal)


    A float, which is short for floating point number is a way of storing a number,
    which has a decimal place such as 3.2, 6.8, 7.1 etc. Depending on the type of
    float used will depend on their precision. There are two types of floating point
    numbers which are Floats and doubles. Doubles have a greater precision and generally
    the preferable data type to be used within a C++ program.


    # Strings


    Strings are very powerful and used to not only store words, but are used to store
    a combination of words and numbers. Strings are useful when you want to capture
    information such as the full name of the person (First name and surname) street
    address etc.


    # Boolean


    Boolean in C++ is known as bool, which is represented in either two states; true
    or false. You may see that this data type is used with binary numbers, this again
    reflects the two states of Boolean. 0= false and 1 = true.'
