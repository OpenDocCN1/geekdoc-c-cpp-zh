    \ <<num2 << \" = \" <<(num3=num1+num2) <<endl;\n\n    return 0;\n}\n\n```"
- md: "\n## Intro conditional statements\n\n**Conditional Statements:** A condition\
    \ statement in C++ is when we check to see if a certain condition has been met.\
    \ Condition statements are great when you want to display different results depending\
    \ on what the user selects. In programming, a condition is also known as if/else\
    \ statements. In this exercise, you will cover if/else statements.\n\nThey are\
    \ also a great way to change the direction depending on what the user selects.\
    \ In programming, a condition is also known as if/else statements. In this exercise,\
    \ you will cover if/else statements. Conditional statements can have multiple\
    \ conditions, which are tested in order.\n\nAn example of a conditional statement\
    \ is:\n\nIf Joshua eats all his dinner, then he can go out and play. If not, then\
    \ he must go tidy his room. Depending on the result of Joshua eating his dinner\
    \ will depend on the outcome.\n\n| IF Joshua = Eat All dinner | This is condition\
    \ 1 |\n| :--- | :--- |\n| Then go out and play | |\n| Else IF Joshua = doesn’t\
    \ eat his dinner | This is condition 2 |\n| Then Tidy your room | |\n\nIn this\
    \ section of C++ you will be introduced to new symbols that you will need to familiarise\
    \ yourself with. The table below explains these symbols.\n\n| == too | && and\
    \ |\n| :--- | :--- |\n| != Not Equal to | || Or |\n| > Greater Than | >= More\
    \ than and equal too |\n| < Less than | <= Less than and equal |\n\n> Take Note!\n\
    > Be careful! The operator = (one equal sign) is not the same as the operator\
    \ == (two equal signs), the first one is an assignment operator (assigns the value\
    \ to a variable) and the other (==) is the equality operator that compares whether\
    \ both expressions in the two sides of it are equal to each other.\n\n## Activity\
    \ 13:\n\nIn this activity we are creating a simple if statement where a user is\
    \ prompted to enter a number between under 10. This program has two outcomes/condition,\
    \ depending on the number that the user enters it will depend on what condition\
    \ becomes true.\n\nCreate a new C++ project and call it “condition statements”.\
    \ Enter the below code, save and compile the program.\n\n```cpp\n#include <iostream>\n\
    using namespace std;\nint main ()\n{\n    int num;\n    cout<<\"Please enter a\
    \ number under 10 : \";\n    cin>>num;\n    if (num<=10) //outcome 1\n       \
    \ cout<<\"Your number was 10 or less\";\n    else //outcome 2\n        cout<<\"\
    Your number was greater than 10\";\n    return 0;\n}\n```\n\nWell done, you have\
    \ just created your first C++ program that uses a condition statements.\nIn the\
    \ next exercise, you will learn how to code a C++ with more than two outcomes,\
    \ which can develop a solution if the user enters a number of 10.\n\nCreate a\
    \ C++ program that uses a conditional statement for a teacher who wants to know\
    \ what action should be taken for a student who has not completed their homework.\
    \ The program will need to be called “Teacher Program” and have two conditions:\n\
    \n- The 1st condition being if the student does the homework\n- The 2nd condition\
    \ being if the student hasn’t done their homework.\n\n**Note: This program will\
    \ need to use a Char data type to check the condition, not an integer**\n\n##\
    \ Activity 14\n\nIn this activity you are going to create a C++ program that tests\
    \ for multiple conditions, using if and else statements. Create a new C++ Project\
    \ and call it “else if statement” and enter the following code below, save, compile\
    \ and run.\n\n```cpp\n#include <iostream>\nusing namespace std;\nint main()\n\
    {\n    int num;\n\n    cout << \"Please enter a number between 1 and 5 : \";\n\
    \    cin >> num;\n\n    if (num == 1)\n    {\n        cout << \"Your entered the\
    \ number 1\"<<endl;\n    }\n    else if (num == 2)\n    {\n        cout << \"\
    Your entered the number 2\" << endl;\n    }\n    else if (num == 3)\n    {\n \
    \       cout << \"Your entered the number 3\" << endl;\n    }\n    else if (num\
    \ == 4)\n    {\n        cout << \"Your entered the number 4\" << endl;\n    }\n\
    \    else if (num == 5)\n    {\n        cout << \"Your entered the number 5\"\
    \ << endl;\n    }\n    return 0;\n}\n```\n\nUsing the above code as a guide, create\
    \ a program that tells the user that they pressed specific set of letters 'Q',\
    \ 'W', 'E', 'R', 'T', 'Y'.\n\nRemember that when using letters in C++ that have\
    \ an impact on the state of the program, they need to be in single quotation marks,\
    \ as seen above.\n\n## Logical Operators and conditional statements\n\nThe logical\
    \ operators && and || are used when evaluating two expressions to obtain a single\
    \ relational result. The operator && corresponds with Boolean logical operation\
    \ AND. This operation results true if both expressions are true. The operator\
    \ || corresponds with Boolean logical operation OR, which results in true if at\
    \ least one of the expressions is true.\n\n## Activity 15 – OR Operator\n\nIn\
    \ this activity we will use the || operators so we can check either condition.\
    \ Create a new C++ project called “OR operator” and enter the below code, save\
    \ and compile.\n\n```cpp\n#include <iostream>\nusing namespace std;\nint main\
    \ () {\n\n    char answer;\n\n    cout<<\"Please enter the letter A : \";\n  \
    \  cin>>answer;\n\n    if ((answer == 'A') || answer == 'a'))// we check A or\
    \ a\n    {\n        cout<<\"well done you entered the letter A\";\n    }\n   \
    \ else\n    {\n        cout<<\"You did not enter the letter A\"<<endl;\n    }\n\
    \    return 0;\n}\n```\n\nCreate a C++ program that checks the condition of a\
    \ number, ask the user to enter a number such as 5 OR 10. Ensure that your program\
    \ compiles and runs and all code is annotated.\n\n## Activity 16 - AND Operator\n\
    \nIn this activity we will use the && operators so you can see how we can test\
    \ for both conditions being true.\n\nCreate a new C++ project called “And Operators”\
    \ and enter the following code below:\n\n```cpp\n#include <iostream>\nusing namespace\
    \ std;\nint main()\n{\n    int num1,num2;\n\n    cout<<\"Please enter the number\
    \ 5: \";\n    cin>>num1;\n\n    cout<<\"Please enter the number 3: \";\n    cin>>num2;\n\
    \n    if ((num1==5) && (num2==3));//if number 5 and 3 are entered then this statement\
    \ is True\n    {\n        cout<<\"Well done you entered the number 5 and 3 \"\
    ;\n    }\n    else\n    {\n        cout<<\"Oops you didnt do as your told\"<<endl;\n\
    \    }\n    return 0;\n}\n```\n"
  mdcn: "\n\n## 条件语句引言\n\n**条件语句：** C++ 中的条件语句是用于检查是否满足了某个特定条件的。当你想要根据用户的选择显示不同的结果时，条件语句非常有用。在编程中，条件也称为\
    \ if/else 语句。在练习中，你将涵盖 if/else 语句。\n\n它们也是一种根据用户选择来改变执行方向极极方法。在编程中，条件也称为 if/else\
    \ 语句。在练习中，你将涵盖 if/else 语句。条件语句可以包含多个条件，这些将按顺序进行测试。\n\n条件语句的一个示例是：\n\n如果 Joshua\
    \ 吃完了所有的晚餐，那么他就可以出去玩。如果没有，他就必须去收拾他的房间。Joshua 吃完晚餐的结果将决定结果的走向。\n\n| 如果 Joshua =\
    \ 吃完所有晚餐 | 这是条件 1 |\n| :--- | :--- |\n| 那么出去玩 | |\n| 或者如果 Joshua = 没吃晚餐 | 这是条件\
    \ 2 |\n| 那么收拾你的房间 | |\n\n在 C++ 的这部分中，你将接触一些你需要熟悉的新符号。下表解释了这些符号。\n\n| == 等于 | &&\
    \ 与 |\n| :--- | :--- |\n| != 不等于 | || 或 |\n| > 大于 | >= 大于等于 |\n| < 小于 | <= 小于等于\
    \ |\n\n> 注意！\n> 小心！运算符 =（单个等号）与运算符 ==（两个等号）不同，前者是赋值运算符（将值赋给变量），另一个（==）是相等性运算符，用于比较它两边的两个表达式是否相等。\n\
    \n## 活动 13：\n\n在本次活动中，我们正在创建一个简单的 if 语句，提示用户输入一个 10 以下的数字。该程序有两个结果/条件，取决于用户输入的数字将取决于哪一个条件变为真。\n\
    \n创建一个新的 C++ 项目并将其命名为“condition statements”（条件语句）。输入以下代码，保存并编译程序。\n\n```cpp\n\
    #include <iostream>\nusing namespace std;\nint main ()\n{\n    int num;\n    cout<<\"\
    Please enter a number under 10 : \";\n    cin>>num;\n    if (num<=10) //结果 1\n\
    \        cout<<\"Your number was 10 or less\";\n    else //结果 2\n        cout<<\"\
    Your number was greater than 10\";\n    return 0;\n}\n```\n\n干得好，你刚刚创建了第一个使用条件语句的\
    \ C++ 程序。\n在下一个练习中，你将学习如何编写具有两个以上结果的 C++ 代码，这在用户输入数字 10 时可以开发出一个解决方案。\n\n创建一个\
    \ C++ 程序，使用条件语句为一位老师服务，该老师想知道对于没有完成作业的学生应该采取什么行动。该程序需要命名为“Teacher Program”（老师程序）并包含两个条件：\n\
    \n- 第一个条件是：学生是否做完作业\n- 第二个条件是：学生是否没做作业\n\n**注意：此程序需要使用 Char 数据类型来检查条件，而不是整数**\n\
    \n## 活动 14\n\n在本次活动中，你将创建一个 C++ 程序，使用 if 和 else 语句来测试多个条件。创建一个新的 C++ 项目并将其命名为“else\
    \ if statement”（else if 语句），输入下方的代码，保存、编译并运行。\n\n```cpp\n#include <iostream>\n\
    using namespace std;\nint main()\n{\n    int num;\n\n    cout << \"Please enter\
    \ a number between 1 and 5 : \";\n    cin >> num;\n\n    if (num == 1)\n    {\n\
    \        cout << \"Your entered the number 1\"<<endl;\n    }\n    else if (num\
    \ == 2)\n    {\n        cout << \"Your entered the number 2\"<<endl;\n    }\n\
    \    else if (num == 3)\n    {\n        cout << \"Your entered the number 3\"\
    <<endl;\n    }\n    else if (num == 4)\n    {\n        cout << \"Your entered\
    \ the number 4\"<< endl;\n    }\n    else if (num == 5)\n    {\n        cout <<\
    \ \"Your entered the number 5\"<< endl;\n    }\n    return 0;\n}\n```\n\n以上面的代码为指导，创建一个程序，让用户输入特定的字母\
    \ 'Q', 'W', 'E', 'R', 'T', 'Y'。在 C++ 中使用影响程序状态的字母需要加单引号。\n\n## 逻辑运算符与条件语句\n\n\
    逻辑运算符 && 和 || 用于评估两个表达式以获得单一结果。运算符 && 对应逻辑“与”（AND）。当两个表达式都真时，该操作为真。运算符 || 对应逻辑“或”（OR），当至少有一个表达式为真时，结果为真。\n\
    \n## 活动 15 – OR 运算符\n\n在本次活动中，我们将使用 || 运算符，这样我们可以检查任一条件。创建一个名为“OR operator”（或运算符）的\
    \ C++ 项目并输入以下代码，保存并编译。\n\n```cpp\n#include <iostream>\nusing namespace std;\n\
    int main () {\n\n    char answer;\n\n    cout<<\"Please enter the letter A : \"\
    ;\n    cin>>answer;\n\n    if ((answer == 'A') || answer == 'a')//我们检查 A 或 a\n\
    \    {\n        cout<<\"well done you entered the letter A\";\n    }\n    else\n\
    \    {\n        cout<<\"You did not enter the letter A\"<<endl;\n    }\n    return\
    \ 0;\n}\n```\n\n创建一个检查数字条件的程序，要求用户输入5 或 10。确保你的程序可以编译和运行，并且所有代码都已注释。\n\n## 活动\
    \ 16 - AND 运算符\n\n在本次活动中，我们将使用 && 运算符，以便你可以看到如何测试两个条件都为真。\n\n创建一个名为“And Operators”（与运算符）的\
    \ C++ 项目并输入以下代码：\n\n```cpp\n#include <iostream>\nusing namespace std;\nint main()\n\
    {\n    int num1,num2;\n\n    cout<<\"Please enter the number 5: \";\n    cin>>num1;\n\
    \n    cout<<\"Please enter the number 3: \";\n    cin>>num2;\n\n    if ((num1==5)\
    \ && (num2==3));//如果输入 5 和 3，则此语句为真\n    {\n        cout<<\"Well done you entered\
    \ the number 5 and 3 \";\n    }\n    else\n    {\n        cout<<\"Oops you didnt\
    \ do as your told\"<<endl;\n    }\n    return 0;\n}\n```\n\n"
