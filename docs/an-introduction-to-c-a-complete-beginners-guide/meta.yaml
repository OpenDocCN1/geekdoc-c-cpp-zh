    \ A and B are true, then the statement is false |\n| false | false | False |\n\
    \nThe operator || corresponds with Boolean logical operation OR. This operation\
    \ results true if either one of its operands is true, thus false only when both\
    \ operands are false themselves. Here are the possible results of a || b:\n\n\
    || (OR) OPERATOR\n\n| a | b | a || b |\n|---|---|---||\n true | true | true The\
    \ operator is used to check if any condition has been met, despite the other statements.\
    \ example. if Joshua eats dinner (A) or does his homework (B) then he can go out\
    \ and play. |\n true | false | True |\n| false | true | True If A or B is true,\
    \ then the statement is true. |\n false | false | False |\n\nThe operator ! is\
    \ the C++ operator to perform the Boolean operation NOT, it has only one operand,\
    \ located at its right, and the only thing that it does is to inverse the value\
    \ of it, producing false if its operand is true and true if its operand is false.\
    \ Basically, it returns the opposite value of evaluating its operand. For example:\n\
    \n```\n!(5 == 5) // evaluates to false because the expression at its right (5\
    \ == 5) is true.\n!(6 <= 4) // evaluates to true because (6 <= 4) would be false.\n\
    !true // evaluates to false\n!false // evaluates to true.\n```"
