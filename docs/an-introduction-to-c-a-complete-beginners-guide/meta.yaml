  md: '# Glossary


    Below is some of the key terminology that is used in programming, it is essential
    that you familiarise yourself with this, as it will be used in lesson.


    | | |

    | Algorithm | A set of unambiguous steps to solve a given problem |

    | ASCII | American Standard code for information interchange is a character encoding
    scheme based on the English alphabet, which encodes 128 characters into 7 bit
    binary numbers |

    | Array | A group of data objects that have the same size and data type, in a
    contagious location in memory |

    | Boolean | A binary variable that can have one of two possible states, true or
    false |

    | Character | A single unit of data that could be a letter, symbol or number |

    | Compiler | A compiler is responsible for turning a programming language into
    machine code (binary) to be executed by the CPU. Remember the CPU does not understand
    anything binary |

    | Float | A float is a data type that is a |

    | Function | A block of code decimated to perform a particular task |

    | IDE | Integrated development environment is a set of tools to be able to develop
    software using a particular programming language. Normally they contain their
    own compiler |

    | Integer | A whole number that has no decimal places. |'
  merge: -1
  pgno: 120
- img_proc: true
  md: '| Iteration | Is the act of repeating a particular action |

    | --- | --- |

    | Loop | See definition of iteration |

    | Parameter | A parameter is a variable that is part of a function that receives
    an argument from another function. |

    | Selection | Also known a decision, is a type of logic structure that depending
    on the condition will depend on the action that is performed |

    | Sequence | A sequence is a set of steps that go in a particular order. Making
    a cup of tea is an example of a sequence of steps. |

    | String | A data type used to store a collection of characters, including symbols
    and numbers. |

    | Variable | Stores a particular type of data, used by a computer program. Depending
    on the conditions data can change within side the variable. |'
  merge: -1
