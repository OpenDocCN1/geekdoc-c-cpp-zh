    \ and, first first first++++++++ the the the the the, in C++\n\n![](img/c8f5e13994d7ec0488e1ed414a0d34f0_8.0)\n\
    \nNearly there, your file has been created, but we need to save it to the right\
    \ location otherwise any code placed inside your file will not work.\n\nTo move\
    \ the file to the correct location, click file, and at the bottom of the menu\
    \ will be an option called “Move source1.cpp into”, move your mouse over this\
    \ option and a new menu, will appear called “1 World”. Select this option to move\
    \ your C++ file into the correct location.\n\nYou will be prompted to name your\
    \ C++ file before you save it. Give it a name relevant to your program, but do\
    \ not give it the same name as your project as you could run into an errors when\
    \ compiling it.\n\nWell done, you have nowsetup your C++ file, and it’s ready\
    \ to code. You will have noticed that the file structure in the left hand side\
    \ pane, will now have your newly named C++ file in it.\n\n# Now you are ready\
    \ to code and compile your first C++ Program\n\nNow let’s code your first program\
    \ in C++. Using the C++ source code below, copy the code into your own Hello World\
    \ Project.\n\n```\n//My first C++ program\n#include <iostream>\nusing namespace\
    \ std;\nint main() {\n\n    cout << \"Hello world\" << endl;\n    return 0;\n\
    }\n\n\n![](img/c8f5e13994d7ec0488e1ed414a0d34f0_12_0.png)\n"
  mdcn: "\n\n# C++ 导论\n\n## 初学者完全指南\n\nMIC OLIVER\n\n![](img/c8f5e13994d7ec0488e1ed414a0d34f0_1_0.png)\n\
    \n# C++ 编程入门\n\n# C++ 编程基础\n\n| 关键字 | | | | | |\n| :--- | :--- | :--- | :--- |\
    \ :--- |\n| break | case | char | default | do |\n| double | else | float | for\
    \ | goto |\n| if | int | long | operator | signed |\n| static | switch | unsigned\
    \ | void | while |\n\n| 数据类型 | | |\n| :--- | :--- |\n| char | 单字符 |\n| int | 整数是一个整数\
    \ |\n| float | 浮点数，精确到六位小数 |\n| double | 浮点数，精确到十位小数 |\n| bool | 布尔值，真 (1) 或假\
    \ (0) |\n| string | 字符组 |\n\n| 库类 | | |\n| :--- | :--- |\n| <iostream> | 读取和写入控制台\
    \ |\n| <iomanip> | 操作输入输出 |\n| <fstream> | 读写文本文件 |\n| <string> | 存储和处理文本流 |\n\
    | <sstream> | 将字符串转换为其他数据类型 |\n| <vector> | 在向量数组元素中存储和处理数据 |\n| <stdexcept> |\
    \ 报告逻辑错误和运行时错误 |\n| <ctime> | 报告日期和时间 |\n\n# C++ 简介\n\n- 在 Visual studio 2013\
    \ 中创建你的第一个 C++ 项目\n- 理解你的第一个 C++ 程序\n- 解决 C++ 中的错误\n- 为你的代码添加注释\n- 添加多行代码\n- C++\
    \ 中的整数和字符初探\n- 在 C++ 中使用浮点数\n- 使用字符串\n- 获取用户输入\n- 变量算术\n- 全局变量和局部变量\n- 条件语句简介\n\
    - 逻辑运算符和条件语句\n- 使用条件语句创建一个计算器\n- 嵌套 If/Else 语句\n- Switch 语句简介\n- 嵌套 switch/case\
    \ 语句\n- 循环简介\n- While 循环\n- Do... While 循环\n- For 循环\n- 函数简介\n- 数组简介\n- 扩展活动\n\
    - ASCII 表\n- ASCII 表（二进制值 31-127）\n- 术语表\n- 延伸阅读\n\n# C++ 简介\n\nC++ 由 Bjarne Stroustrup\
    \ 在 20 世纪 80 年代初在 AT&T 实验室开发，基于 C 语言。这个名字是一个双关语——++”是 C 语言中的一种语法结构（用于变量递增），而 C++\
    \ 旨在是对 C 的增量改进。C++ 的大部分是 C 的子集，因此大多数 C 程序都可以使用 C++ 编译器进行编译（即转换为计算机可以直接执行的一系列低级指令）。\n\
    \nC++ 被认为是一种多范式语言，因为它的实现方式可以有所不同。本书将涵盖 C++ 作为一种过程化语言，并符合 ANSI（美国国家标准协会）和 ISO（国际标准组织）的标准。这意味着你可以获取书中的所有源代码并在任何编译器中运行。\n\
    \n为了能够成功运行书中的源代码，你需要以下条件：\n\n- 一台电脑（Windows, OSX, Linux）\n- 一个 IDE（集成开发环境）\n \
    \   - Windows (Visual Studio)\n    - OSX (X code)\n    - Linux (Code Blocks)\n\
    \n如需此软件的免费版本，请访问 www.bcotcomputing.co.uk\n\n本指南中的所有源代码均使用 Visual Studio 2013 专业版实现，可以在学校网站上找到。该软件已安装在计算机学院的所有机器上。你也可以点击此链接使用你的\
    \ dreams spark 账户免费下载\n\n| 你知道吗？ | |\n| :--- | :--- |\n| 许多编程语言源自 C，如 C#、PHP、Objective-c。如果你学会了\
    \ C++，就可以轻松地将知识和技能转移到其他编程语言。 |\n\n![](img/c8f5e13994d7ec0488e1ed414a0d34f0_6_0.png)\n\
    \n# 在 Visual studio 2013 中创建 C++ 项目\n\n本指南旨在展示如何设置、创建和编译你的第一个 C++ 程序“Hello world”。\n\
    \n在开始编写程序之前，你需要加载一个 IDE（集成开发环境）。为此，点击开始图标并输入 visual。你应该看到以下内容：\n\n![](img/c8f5e13994d7ec0488e1ed414a0d34f0_7_0.png)\n\
    \n点击“Visual Studio 2013”，Visual Studio 的加载界面将出现在桌面上：\n\n加载界面之后，将加载 Visual Studio\
    \ 启动页。在此界面中你可以创建新项目、打开现有项目甚至访问指南和资源。要创建一个新项目，我们需要点击“new project”（新建项目）。\n\n| Professional\
