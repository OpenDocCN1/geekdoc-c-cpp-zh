    # # Introduction to Arrays


    Arrays are a type of data structure that stores a set of a particular data, which
    has been placed in contagious memory location. Arrays should be looked at more
    than just a set of data, but a set of variables of the same data type. Each piece
    of data stored in array is known as an element and has its own unique identifier.
    Regardless of the length or type of array that is used the first element is always
    0. Take a look below at the below example.


    | Element | 0 | 1 | 2 | 3 | 4 |

    |---|---|---|---|---|---|


    In the above example, we have 5 blocks which store 5 sets of data of the same
    type. When we declare an array, we declare it like a variable as we have to give
    a data type and a name, but we also have to declare how many elements we expect
    our array to hold. We do this by using square brackets [] with a number inside.
    Based on the example above our array has 5 elements [5]. Below is example of how
    a simple array is declared in C++:


    ![](img/c8f5e13994d7ec0488e1ed414a0d34f0_102_0.png)


    Like variables arrays can either be generalised with predefined values when they
    are declared. To initialise an array with a set of values, we need to use a set
    {} to store that data. Based on the examples we have used so far, this is how
    you would initialise an array:


    ```

    int numbers[5] = {11, 22, 33, 44, 55};

    ```


    As we have initialised all elements of our array, this is how our array would
    look like based on the first example above:


    | int numbers[5] = | 11 | 22 | 33 | 44 | 55 |

    |---|---|---|---|---|---|


    You may find yourself in situation, where you only need to initialise a few elements
    of the array, for example you may initialise the array like below:


    ```

    int numbers[5] = {11, 22, 33};

    ```


    By organising the first 3 elements of the array, the other elements have been
    left undefined and as a result, will default to the value of 0. See the below
    example.


    | int numbers[5] = | 11 | 22 | 33 | 0 | 0 |

    |---|---|---|---|---|---|


