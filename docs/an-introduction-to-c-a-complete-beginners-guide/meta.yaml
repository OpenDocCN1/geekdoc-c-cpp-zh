  md: "# Global and local variables\n\nWe know how to use variables, but so far you\
    \ have been using local variables. variables are variables that are declared within\
    \ side a function, and are made only available to that function. The other type\
    \ of variable is a Global Variable, which is declared outside a function and is\
    \ made available to all functions in a C++ program.\n\nGlobal variables are useful,\
    \ but the value they hold can easily be manipulated by the different functions\
    \ that them. Many developers avoid using global variables and instead pass data\
    \ from one function to another to avoid the data being lost.\n\n# Activity 12\
    \ – Global and Local Variables\n\nIn this program, we are going to declare one\
    \ global variable, and two local variables. One of these will be a standard local\
    \ variable and the other will be declared as a constant. A constant is a variable\
    \ that must have a value initialised before the program runs, and its value will\
    \ remain the same throughout the program. Constants can't have their value changed\
    \ at runtime.\n\n```\n#include <iostream>\nusing namespace std;\n\nint num1;//\
    \ I am a global variable, I can be used by any function within C++\n\nint main()\n\
    {\n    const int num2=5; // I am a constant local variable. I can be used within\
    \ this function only and my value will\n    never change.\n    int num3;// I am\
    \ a local variable and can only be used within the \"main\" function\n\n    cout<<\"\
    Please enter a number for global variable num1: \" <<\";\n    cin>>num1;\n   \
    \ cout<<\"We are going to add \"<<num1 << \" + \" <<our constant variable, which\
    \ has the value of \"5\"<<endl;\n    cout<<num1 << \" \" + \" <<num2 << \" = \"\
