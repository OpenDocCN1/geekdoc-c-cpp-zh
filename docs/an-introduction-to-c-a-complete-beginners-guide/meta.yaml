    \  } while (loop == 1);\n    return 0;\n}\n```\n\n![](img/c8f5e13994d7ec0488e1ed414a0d34f0_89_0.png)\n\
    \n> 小贴士！\n命令行屏幕上杂乱太多。使用内置系统函数 `system (\"cls\");` 来清除屏幕上不需要的文本。\n\n你现在已经学习了两种类型的循环，创建一个你喜欢的程序，同时使用\
    \ `while` 循环和 `do` 循环。你可以使用之前的程序来帮助构建循环。\n\n## 活动 28：\n\n下面是一个根据你的出生年份和月份计算年龄并将其与当前月份对比对比的程序。修改此程序以适用于一家无酒执，当用户年龄小于\
    \ 18 岁时，用户不能购买任何酒精。\n\n```cpp\n#include<iostream>\nusing namespace std;\nint main()\
    \ {\n    int birthmonth, birthyear;\n    int currentmonth, currentyear;\n    int\
    \ agey, ag;\n    cout << \"The Age Calculator\" << endl;\n    cout << \"Enter\
    \ Birth Year(Eg:1993):\" << endl;\n    cin >> birthyear;\n    cout << \"Enter\
    \ Birth Month(Eg:5):\" << endl;\n    cin >> birthmonth;\n    if (birthmonth >\
    \ 12 || birthmonth < 1) {\n        cout << \"Enter Current Month(Eg:7):\" << endl;\n\
    \        cin >> currentmonth;\n        cout << \"Enter Current Year(Eg:2010):\"\
    \ << endl;\n        cin >> currentyear;\n        agey = currentyear - birthyear;\n\
    \        agem = currentmonth - birthmonth;\n        cout << \"Your Age is \" <<\
    \ agey << \" Years And \" << ag << \" Months\" << endl;\n    }\n    return 0;\n\
    }\n```\n\n## For 循环\n\n`for` 循环是一种特殊的循环，它会循环固定次数，这与 `while` 和 `do` 只有在条件为真时才会循环不同。`for`\
    \ 循环在处理数组等数据结构时非常有用（稍后介绍）。\n\n## 活动 8\n\n在这个程序中，我们将统计发生了多少次迭代。循环的迭代被称为循环执行的次数。\n\
    \n```cpp\n#include <iostream>\nusing namespace std;\nint main()\n{\n    int i;\n\
    \    for (i=1; i<10; i++)\n    {\n        cout << \"loop iteration: \" << i <<\
    \ endl;\n    }\n    return 0;\n}\n```\n\n![](img/c8f5e13994d7ec0488e1ed414a0d34f0_93_0.png)\
    \ 你得到了多少次迭代？如果代码正确，你应该得到 10 次。如果你将上述程序中的数字 10 改为另一个数字，你将会得到迭代。尝试一下看看你会得到什么。\n\n\
    ## 活动 9\n\n在这个活动中，我们更改了 `for` 循环的规则，从 10 开始倒数。对比之前的程序，而不是递增。创建一个名为“倒数（count down）”的新\
    \ C++ 项目，复制代码并编译。\n\n```cpp\n#include <iostream>\nusing namespace std;\nint main()\n\
    {\n    int i;\n    for (i = 10; i > 0; i--)\n    {\n        cout << \"loop iteration:\
    \ \" << i << endl;\n    }\n    return 0;\n}\n```\n\n注意事项！\n`for` 循环中使用的变量有两种声明方式：\n\
    `for (int i=1; i<4; i++)`\n或者\n`int i; for (i=1; i<4; i++)`\n两种方式都可以的，但当你的目标是让循环持续时，初始化变量。\n\
    \n`for (i = 1; i<10; i++)`\n{\n    cout << \"loop is running\";\n}\n\n## 理解 for\
    \ 循环的语法\n\n## 活动 10（嵌套循环）\n\n在这个程序中，你将创建一个使用嵌套 `for` 循环的程序。创建一个名为“嵌套 for 循环（nested\
    \ loops）”的项目，复制下面的代码，保存并编译。\n\n```cpp\n#include <iostream>\nusing namespace std;\n\
    int main()\n{\n    int i, j;\n    for (i=1; i<4; i++)\n    {\n        for(j=1;\
    \ j<4; j++)\n        {\n            cout << \"loop iteration: \" << i << endl;\n\
    \            cout << \"Inner loop iteration: \" << j << endl;\n        }\n   \
    \ }\n    return 0;\n}\n```\n\n## 函数简介\n\n> 你知道吗？\n从你编写第一个 C++ 程序开始就会使用函数了？`main`\
    \ 是函数的一种，并且是主函数。\n\n函数是执行特定任务的代码块。它们用于将代码分解成小部分，使程序更容易理解。函数提高了重用性，并对节省空间有用。\n\n\
    下面的活动展示了不同类型的函数以及它们如何在 C++ 环境中运行。\n\n## 活动 11\n\n在这个程序中，我们将创建一个使用 `void` 的简单函数。`void`\
    \ 只在函数不返回任何值时使用。例如，只打印语句的函数（如下）只需要 `void` 类型。创建一个名为“我的第一个函数（My first function）”的新程序，复制下面的代码，编译并运行。\n\
    \n```cpp\n#include <iostream>\nusing namespace std;\n\nvoid banner() //调用函数\n\
    {\n    cout << \"I am a simple function\" << endl;\n}\n\nint main()\n{\n    banner();\
    \ //调用函数\n    return 0;\n}\n```\n\n> 关键事实！\n记住，无论你有多少函数，无论它们的编码顺序如何，`main` 函数总是第一个被调用的。对于所有\
    \ C++ 都是如此。\n\n注意事项\n为了防止错误并节省代码行，请确保你的函数定义在 `main` 函数之前。\n\n创建一个使用从上一个程序中学到的\
    \ `void` 函数的程序。你的程序至少需要在程序的不同位置调用该函数三次。\n\n"
