  - '[PAGE 50]


    # Intro conditional statements


    **Conditional Statements:** A condition statement in C++ is when we check to if
    a certain condition has been met. Condition statements are great, when you want
    to display different results depending on what the user selects. In programming
    a condition is also known as if/else statements. In this exercise you will cover
    if/else statements.


    They are also a great way to change the direction depending on what the user selects.
    In programming a condition is also known as if/else statements. In this exercise
    you will cover if/else statements. Conditional statements can have multiple conditions,
    which are tested in order.


    An example of an conditional statement is:


    If Joshua eats all his dinner, then he can go out and play. If not then he must
    go tidy his room. Depending on the result of Joshua eating his dinner will depend
    on the outcome.


    | IF Joshua = Eat All dinner | This is condition 1 |

    | Then go out and play | |

    | Else IF Joshua = doesn’t eat his dinner | This is condition 2 |

    | Then Tidy your room | |


    In this section of C++ you will be introduced to new symbols that you will need
    to familiarise yourself with. The table below explains these symbols.


    | == too | && and |

    | != Not Equal to || Or |

    | > Greater Than | >= More than and equal too |

    | < Less than | <= Less than and equal |'
