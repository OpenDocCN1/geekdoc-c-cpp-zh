    | 27 | 01B | US (unit separator) | 91 | 67 | &#97; | 123 | 79 | &#123; |

    | 28 | 01C | NEL (end of transmission) | 92 | 68 | &#98; | 124 | 80 | &#124; |

    | 29 | 01D | ESC (escape) | 93 | 69 | &#99; | 125 | 81 | &#125; |

    | 30 | 01E | GS (group separator) | 94 | 70 | &#94; | 126 | 82 | &#126; |

    | 31 | 01F | RS (record separator) | 95 | 71 | &#95; | 127 | 79 | &#127; |


    The ASCII table is extremely important as it helps understand that two values
    have the same. See the example below:


    The character ‘A’ and ‘a’ to humans have the same meaning (one is a capital letter).
    To use a computer system they are completely different with two different meanings.


    ‘A’ has a value of 65 in binary of 01000001


    ‘a’ has a value of 97 in binary of 01100001


