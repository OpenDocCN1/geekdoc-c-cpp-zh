- md: "\n# AN INTRODUCTION TO C++\n\n## A complete beginners guide\n\nMIC OLIVER\n\
    \n![](img/c8f5e13994d7ec0488e1ed414a0d34f0_1_0.png)\n\n# Introduction to Programming\
    \ with C++\n\n# C++ Programming Essentials\n\n| Key Words | | | | |\n| :--- |\
    \ :--- | :--- | :--- | :--- |\n| break | case | char | default | do |\n| double\
    \ | else | float | for | goto |\n| if | int | long | operator | signed |\n| static\
    \ | switch | unsigned | void | while |\n\n| Data Types | |\n| :--- | :--- |\n\
    | char | A single character |\n| int | An integer is a whole number |\n| float\
    \ | A floating point number, correct to six decimal places |\n| double | A floating\
    \ point number, correct to ten decimal places |\n| bool | A Boolean value of true\
    \ (1) or false (0) |\n| string | A group of characters |\n\n| Library Classes\
    \ | |\n| :--- | :--- |\n| <iostream> | Reads and writes to the console |\n| <iomanip>\
    \ | Manipulates input and output |\n| <fstream> | Reads and writes to a text file\
    \ |\n| <string> | Stores and manipulates text streams |\n| <sstream> | Converts\
    \ strings to other data types |\n| <vector> | Stores and manipulates data in vector\
    \ array elements |\n| <stdexcept> | Reports logic errors and runtime errors |\n\
    | <ctime> | Reports date and time |\n\n# Introduction to C++\n\n- Creating your\
    \ first C++ project in Visual studio 2013\n- Understanding your 1st C++ Program\n\
    - Solving Errors in C++\n- Annotating Your Code\n- Adding Multiple Line of Code\n\
    - Introduction to Integers and Characters in C++\n- Using floats in C++\n- Using\
    \ strings\n- Getting User Input\n- Variable Arithmetic\n- Global and local variables\n\
    - Intro conditional statements\n- Logical Operators and Conditional statements\n\
    - Creating a calculator using conditional statements\n- Nesting If/Else statements\n\
    - Introduction to Switch Statements\n- Nesting switch/case statements\n- Introduction\
    \ to Loops\n- While loops\n- Do... While Loops\n- For Loops\n- Introduction to\
    \ Functions\n- Introduction to Arrays\n- Extension Activities\n- The ASCII Table\n\
    - ASCII Table (Binary values 31-127)\n- Glossary\n- Further Reading\n\n# Introduction\
    \ to C++\n\nC++ was developed by Bjarne Stroustrup at AT&T Bell Laboratories in\
    \ the early 1980's, and is based on the C language. The name is a pun - \"++\"\
    \ is a syntactic construct used in C (to increment a variable), and C++ is intended\
    \ to be an incremental improvement of C. Most of C++ is a subset of C, so most\
    \ C programs can be compiled (i.e. converted into a series of low-level instructions\
    \ that the computer can execute directly) using a C++ compiler.\n\nC++ is considered\
    \ to be a multi paradigm language, as the way it can be implemented can vary.\
    \ This book will cover C++ as a procedural language, and conforms to the ANSI\
    \ (American national standard institute) and ISO (International standards organisations).\
    \ This means that you can take all the source code from this book, and run it\
    \ in any compiler.\n\nTo be able to successfully run the source code in this book\
    \ you will need the following:\n\n- A computer (Windows, OSX, Linux)\n- An IDE\
    \ (Integrated development environment)\n    - Windows (Visual Studio)\n    - OSX\
    \ (X code)\n    - Linux (Code Blocks)\n\nFor a free version of this software,\
    \ then please visit www.bcotcomputing.co.uk\n\nAll source code in this guide has\
    \ been implemented using Visual Studio 2013 professional and can be found on the\
    \ school's website. This software has been installed on all of the machines in\
    \ the school of computer science. It can also be downloaded for free using your\
    \ dreams spark account by clicking this link\n\n| Did you know? | |\n| :--- |\
    \ :--- |\n| Many programming languages derive from C, such as C#, PHP, Objective-c.\
    \ If you can learn C++ you can easily transfer your knowledge and skills to other\
    \ programming languages. |\n\n![](img/c8f5e13994d7ec0488e1ed414a0d34f0_6_0.png)\n\
    \n# Creating your C++ project in Visual studio 2013\n\nThis guide has been created\
    \ to show how to setup, create and compile your first C++ program \"Hello world\"\
    .\n\nBefore you begin to code your program, you will need to load up an IDE (Integrated\
    \ development environment) To do this click the start icon, and type visual. You\
    \ should see the following:\n\n![](img/c8f5e13994d7ec0488e1ed414a0d34f0_7_0.png)\n\
    \nClick \"Visual Studio 2013\" and the Visual Studio loading screen will appear\
    \ on your desktop:\n\nAfter the loading screen, the Visual Studio start page should\
    \ load. In this screen you can create new projects, open existing projects or\
    \ even access guidance and resources. To create a new project we need to click\
    \ \"new project\".\n\n| Professional 2013 | Discover what's new in Professional\
