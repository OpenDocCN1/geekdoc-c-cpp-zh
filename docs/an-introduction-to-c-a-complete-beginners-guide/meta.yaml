- md: "\n# Activity 32\n\nIn this program, we are using functions to pass data between\
    \ each other. This method is in replacement of Global variables, and is the best\
    \ practice for allowing specific functions to access certain data, without compromising\
    \ its integrity. The program below, has a function called “add” that is responsible\
    \ for adding two values together and returning the sum of these two values to\
    \ the “main” function, which is then printed out to the screen.\n\nCreate a program\
    \ called “Function Addition”, copy the code below and compile.\n\n```cpp\n#include\
    \ <iostream>\nusing namespace std;\n\nint add(int num1, int num2)//code function\
    \ here with parameters\n{\n    int sum = num1 + num2; //\n    return sum;//value\
    \ of sum is the number that is returned to main\n}\n\nint main()\n{\n    int result\
    \ = add(2, 3); //pass the values of 2 and 3 to the add function\n    cout << \"\
    The result is \" << result << endl; //\n}\n```\n\n## Understanding what the program\
    \ is doing by line.\n\nThis program has two functions, one called “add”, and the\
    \ other called “main”. These functions have been declared as type integers, as\
    \ they are both dealing with numbers.\n\nadd int num1, int num2\n\nIn this line,\
    \ we are creating a function called “add” that is of type integer, which has two\
    \ parameters. A parameter is a variable that expects data to be passed to it from\
    \ another function, these are known as arguments. This function has two parameters\
    \ both of type integer num1 and num2.\n\nint sum = num1 + num2;\n\nA local variable\
    \ sum, has been created to add the values of num1 and num2 together. This is something\
    \ you should be comfortable with by now, as you have used this type of declaration\
    \ in previous C++ activities.\n\nreturn sum;\n\nLike result = 0; this ends the\
    \ “add function”, but instead it carries the total value of num1 and num2. The\
    \ value will be transferred to the function that called the “add” function. In\
    \ this program that value would be passed to the “main” function.\n\n```cpp\n\
    int result = add(2, 3);\n```\n\nIn this line of code we create a new variable\
    \ called result that uses type integer. We also call out function “add” and pass\
    \ two arguments to that function.\n\nThese arguments are the values 2 and 3, which\
    \ are stored in the variables num1 and num2 in our “add” function. In the last\
    \ line of return sum the total of 2 and 3 which is 5, is returned to the main\
    \ function. The value of 5 is stored in our variable called result. Result is\
    \ then printed to the screen.\n\n```cpp\nint add(int num1, int num2)\n{\n    int\
    \ sum = num1 + num2;\n    return sum; // Values of 2 and 3 get passed to their\
    \ respective variables in the \"add\" function\n}\n\nint main()\n{\n    int result\
    \ = add(2, 3); // Value of sum is returned to the result variable in the main\
    \ function\n    cout << \"The result is \" << result << endl;\n}\n```\n\nYou have\
    \ been shown, how to create two types of function, one a simple function that\
    \ uses void and the other that uses type integer. In this activity you will need\
    \ to create a C++ program that uses two functions. The program will need to ask\
    \ the user to enter two numbers, which will multiply them together and display\
    \ the final sum output.\n\n## Introduction to Arrays\n\nArrays are a type of data\
    \ structure that stores a set of a particular data, which has been placed in contiguous\
    \ memory location. Arrays should be looked at more than just a set of data, but\
    \ a set of variables of the same data type. Each piece of data stored in array\
    \ is known as an element and has its own unique identifier. Regardless of the\
    \ length or type of array that is used the first element is always 0. Take a look\
    \ below at the below example.\n\n| Element | 0 | 1 | 2 | 3 | 4 |\n|---|---|---|---|---|---|\n\
    \nIn the above example, we have 5 blocks which store 5 sets of data of the same\
    \ type. When we declare an array, we declare it like a variable as we have to\
    \ give a data type and a name, but we also have to declare how many elements we\
    \ expect our array to hold. We do this by using square brackets [] with a number\
    \ inside. Based on the example above our array has 5 elements [5]. Below is example\
    \ of how a simple array is declared in C++:\n\nLike variables, arrays can either\
    \ be generalised with predefined values when they are declared. To initialise\
    \ an array with a set of values, we need to use a set {} to store that data. Based\
    \ on the examples we have used so far, this is how you would initialise an array:\n\
    \n```cpp\nint numbers[5] = {11, 22, 33, 44, 55};\n```\n\nAs we have initialised\
    \ all elements of our array, this is how our array would look like based on the\
    \ first example above:\n\n| int numbers[5] = | 11 | 22 | 33 | 44 | 55 |\n|---|---|---|---|---|---|\n\
    \nIn the above example, you may find a situation where you only need to initialise\
    \ a few elements, for example below:\n\n```cpp\nint numbers[5] = {11, 22, 33};\n\
    ```\n\n## Activity 33: My Array\n\nIn this program, we are going to create a C++\
    \ program that asks the user to enter two numbers, which will multiply them together\
    \ and display the final sum output.\n\n```cpp\n#include <iostream>\nusing namespace\
    \ std;\n\nint main()\n{\n    int numbers[5];\n    int i;\n    cout << \"Please\
    \ enter five numbers: \";\n    for (i = 0; i < 5; i++)\n    {\n        cin >>\
    \ numbers[i];\n    }\n    cout << \"The numbers you entered: \";\n    for (i =\
    \ 0; i < 5; i++)\n    {\n        cout << numbers[i] << \" \";\n    }\n    cout\
    \ << endl;\n    return 0;\n}\n```\n\n## Activity 34: Entering Data into an array\n\
    \nIn this activity we are going to declare a new integer array and initialise\
    \ it at runtime. Create a new project called \"Array Input\", enter the code below,\
    \ save.\n\n```cpp\n#include <iostream>\nusing namespace std;\n\nint main()\n{\n\
    \    int numbers[5];\n    int i;\n    cout << \"Please enter five numbers: \"\
    ;\n    for (i = 0; i < 5; i++)\n    {\n        cin >> numbers[i];\n    }\n   \
    \ cout << \"The numbers you entered: \";\n    for (i = 0; i < 5; i++)\n    {\n\
    \        cout << numbers[i] << \" \";\n    }\n    cout << endl;\n    return 0;\n\
    }\n```\n\n> Key Fact!\nIn the event that you need to use advanced features in\
    \ arrays, you may need to use an array. This library can be declared at the top\
    \ of your C++ program by typing:\n\nHave you noticed that in this program the\
    \ variable \"i\" we used for the loops, was declared outside of the for loop?\
    \ This is because when coding you should consider memory space, and though you\
    \ are saving only several bytes, in a larger program it could save much more.\n"
  mdcn: "\n\n# 活动 32\n\n在这个程序中，我们正在使用函数在它们之间传递数据。这种方法取代了全局变量，是允许特定函数访问某些数据且不破坏其完整性的最佳实践。下方的程序有一个名为“add”的函数，它负责将两个值相加并将这两个值的和返回给“main”函数，然后由后者将其打印到屏幕上。\n\
    \n创建一个名为“Function Addition”的程序，复制下面的代码并编译。\n\n```cpp\n#include <iostream>\nusing\
    \ namespace std;\n\nint add(int num1, int num2)//在此处编写带参数的函数\n{\n    int sum =\
    \ num1 + num2; //\n    return sum;//sum 的值是返回给 main 的数字\n}\n\nint main()\n{\n\
    \    int result = add(2, 3); //将 2 和 3 的值传递给 add 函数\n    cout << \"The result\
    \ is \" << result << endl; //\n}\n```\n\n## 逐行理解程序在做什么。\n\n这个程序有两个函数，一个叫“add”，另一个叫“main”。这些函数被声明为整数类型，因为它们处理的都是数字。\n\
    \nadd int num1, int num2\n\n在这一行中，我们正在创建一个类型为整数的函数名为“add”，它有两个参数。参数是期望从另一个函数传递数据的变量，这些被称为参数（arguments）。该函数有两个参数，类型均为整数型\
    \ num1 和 num2。\n\nint sum = num1 + num2;\n\n创建了一个局部变量 sum，用于将 num1 和 num2 的值相加。到目前你应该已经熟悉这种操作了，因为你在之前的\
    \ C++ 活动中用过这种声明。\n\nreturn sum;\n\n就像 `result = 0;` 一样，这结束了“add 函数”，但它携带的是 num1\
