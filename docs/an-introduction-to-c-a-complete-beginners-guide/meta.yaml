    # Glossary


    Below is some of the key terminology that is used in programming, it is essential
    that you familiarise with:


    - Algorithm: A set of steps to solve a problem.

    - ASCII: American Standard Code for Information Interchange is a character encoding
    based on.

    - Array: A group of objects that have the same size.

    - Boolean: A variable can have two possible states: true or false.

    - Character: A single unit of data.

    - Compiler: Is responsible for turning code into machine language.

    - IDE: Integrated development environment is a set of tools for.

    - Integer: A whole number.

    - Iteration: The act of repeating a process.

    - Parameter: A value passed to a function.

    - Selection: A decision-making structure.

    - Sequence: The normal order of execution.

    - String: A data type used to store characters.

    - Variable: A location that can change.


