    # Declaring Variables in C++


    To declare a variable in C++, we need to declare the type of data that we expect
    the variable to hold, this can be done by typing the data type name in, as shown
    below in the table:


    | Data type''s: How to declare |

    |---|---|---|---|n| Integer | int | Float | double |

    | Character | char | string | string |

    | Float | float | Boolean | bool |


    When you type the data type in C++, you will notice that the text will change
    colour, this is to show that it will be used by the compiler for a variable assignment.


    Once you have chosen the data type for your variable, you will need to assign
    it a name. You can name the variable anything you like, as long as you follow
    the rules:


    # Variable Name Rules


    When variables are created, you give them a name such as num1, hostname, fname,
    etc. Variables are very flexible with names, however there are some golden rules
    for creating them:


    +   * A variable name consists of any combination of alphabets, digits and underscores.
    Some compiler allows variable names however length could be up to 247 characters.
    Still it will be safer to stick to the rule of 31 characters. Please avoid creating
    long variable name as it adds to your typing effort.

    * All variable names must begin with a letter of the alphabet or underscore (_
    For beginning programmers, it may be easier to begin all variable names with a
    letter of the alphabet. The first character must not be a number or any special
    symbol

    * After the first letter, variable names can also contain letters and numbers.
    No spaces or special characters, however are allowed.

    * Uppercase letters are distinct from lowercase letters. Using all uppercase letters
    is used primarily to identify constant variables.

    * You cannot use a C++ keyword (reserved word) as a variable name.


    # Examples of variable being assigned


    ```

    int num1; //num1 is the variable name I have chosen which expects an integer data
    type.

    float num2; // num2 is the variable name chosen which expects a float data type.

    ```'
