    \ `if-else-if` 语句链更简洁、更易读。\n\n## Switch 简介\n\n`switch` 语句也称为 `case` 语句。它是检查多个可能值的理想选择。\n\
    \n## 活动 20：创建 switch 语句\n\n在本次活动中，我们将创建一个简单的评分程序。创建一个名为“Grade”的新项目并输入以下代码，保存并编译。\n\
