  md: "# # Introduction to Loops\n\nIn programming we use loops to repeat an aspect\
    \ of a program until a certain condition has been met. Every pass through the\
    \ loop is known as iteration, which is one of the basic three structures of programming\
    \ (sequence, selection and iteration). In programming we use three types of loops\
    \ white, for, and do. While.\n\n# While Loops\n\nWhile loops will repeat a statement\
    \ while a condition is true. This loop is the only loop that will test the condition\
    \ before the loop command is executed. The flow diagram to the left shows how\
    \ a while loop works.\n\nWhile loops are based on Boolean conditions, just like\
    \ conditional statements\n\n![](img/c8f5e13994d7ec0488e1ed414a0d34f0_80_0.png)\n\
    \n```\nwhile (true) \n{\n\n  //do stuff\n\n}\n```\n\n# Do.. While Loops\n\nA do..\
    \ while loop is the opposite to a while loop as this will check the condition\
    \ after the code has been executed. Unlike a while loop, a do.. while loop is\
    \ guaranteed to be executed at least once. The flow chart to the left shows how\
    \ a do loop works.\n\n```\ndo {\n\n  //do stuff\n} while (condition);\n```\n\n\
    ![](img/c8f5e13994d7ec0488e1ed414a0d34f0_80_1.png)"
