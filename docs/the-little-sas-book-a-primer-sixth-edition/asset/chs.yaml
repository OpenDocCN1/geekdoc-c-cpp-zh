  | 9 | Cylinders | `Num` | 8 | | |\n| 5 | DriveTrain | `Char` | 5 | | |\n| 8 | EngineSize\
  \ | `Num` | 8 | | 引擎尺寸 (L) |\n| 10 | Horsepower | `Num` | 8 | | |\n| 7 | Invoice\
  \ | `Num` | 8 | `DOLLAR8.` | |\n| 15 | Length | `Num` | 8 | | 长度 (IN) |\n| 11 |\
  \ MPG_City | `Num` | 8 | | 每加仑油里程数 (城市) |\n| 12 | MPG_Highway | `Num` | 8 | | 每加仑油里程数\
