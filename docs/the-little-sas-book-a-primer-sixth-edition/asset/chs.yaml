  \ | 65536 | | | |\n| **数据集页数** | 2 |\n| **第一数据页** | 1 |\n| **每页最大观测值** | 430 |\n\
  | **第一数据页中的观测值** | 413 |\n| **数据集修复次数** | 0 |\n| `ExtendObsCounter` | YES |\n| **文件名**\
  \ | `C:\\Program Files\\SASHome\\SASFoundation\\9.4\\core\\sashelp\\cars.sas7bdat`\
