  \ `y=*昨天的日期*` |\n| WEEKDAY | `a=MDY(4,18,2012); x=WEEKDAY(a);` | `x=6` | `a=MDY(9,3,60);\
  \ y=WEEKDAY(a);` | `y=4` |\n| YEAR | `a=MDY(4,18,2012); x=YEAR(a);` | `x=2012` |\
  \ `a=MDY(1,1,1960); y=YEAR(a);` | `y=1960` |\n| YRDIF | `a=MDY(4,18,2012); b=MDY(4,13,2000);\
  \ x=YRDIF(a,b,'AGE');` | `x=12` | `a=MDY(4,13,2000); b=MDY(8,13,2012); y=YRDIF(a,b,'AGE');`\
  \ | `y=3342`\n\n## 3.6 使用 IF-THEN 和 DO 语句\n\n通常，你希望赋值语句适用于某些观测值而不是全部——即在某些条件下。这被称为条件逻辑，你通过\
  \ `IF-THEN` 语句来实现：\n\n```\nIF condition THEN action;\n```\n\n`condition` 是比较两个对象的表达式，`action`\
  \ 是表达式为真时 SAS 应该执行的操作。例如：\n\n```\nIF Model = 'Berlinetta' THEN Make = 'Ferrari';\n\
  ```\n\n该语句告诉 SAS，当变量 `Model` 等于 Berlinetta 时，将 `Make` 设置为 Ferrari。比较两边的项可以是常量、变量或表达式。这些项由比较运算符分隔，运算符可以是符号形式或助记形式，取决于你的喜。以下是基本比较运算符：\n\
  \n| 符号 | 助记 |\n| :--- | :--- |\n| `=` | EQ |\n| `^=` 或 `~=` | NE |\n| `>` | GT |\n\
  | `<` | LT |\n| `>=` | GE |\n| `<=` | LE |\n\n`IN` 运算符也进行比较，但工作方式略有不同。`IN` 将变量的值与值列表进行比较。这是一个示例：\n\
  \n```\nIF Model IN ('Model T', 'Model A') THEN Make = 'Ford';\n```\n\n该语句告诉 SAS，当\
  \ Model 为 Model T 或 Model A 时，将 `Make` 设置为 Ford。单一的 `IF-THEN` 语句只能有一个操作。如果你加上 `DO`\
  \ 和 `END`，就可以执行多个操作。例如：\n\n```\nIF Model = 'DMC-2' THEN DO;\n    Make = 'Deorean';\n\
  \    BodyStyle = 'coupe';\nEND;\n```\n\n`DO` 语句导致之后的所有 SAS 语句被视为一个单元，直到出现匹配的 `END`\
  \ 语句。`DO` 语句、`END` 语句以及之间所有语句称为 `DO` 。你还可以使用 `AND` 和 `OR` 指定多个条件：\n\n```\nIF Make\
  \ = 'Alfa Romeo' AND Model = 'Tipo B' THEN Seats = 1;\n```\n\n与比较运算符一样，`AND` 和 `OR`\
  \ 可能是符号形式或助记形式：\n\n| 符号 | 助记 | 含义 |\n| :--- | :--- | :--- |\n| `&` | AND | 所有比较必须为真\
  \ |\n| `|` 或 `!` | OR | 至少有一个比较必须为真 |\n\n小心长比较字符串；它们可能会变成逻辑迷宫。示例 以下制表符分隔的数据显示了拍卖出售的稀有古董的信息。数据值是品牌、制造年份、座椅数以及以百万美元计算的售价：\n\
  \n| Make | Model | YearMade | Seats | MillionsPaid |\n| :--- | :--- | :--- | :---\
  \ | :--- |\n| Deion | LaMarquise | 1884 | 4 | 4.6 |\n| Rolls-Royce | Silver Ghost\
  \ | 1912 | 4 | 1.7 |\n| Mercedes-Benz | SSK | 1929 | 2 | 7.4 |\n| F-88 | 1954 |\
  \ . | 3.2 |\n| Ferrari | 250 Testa Rossa | 1957 | 2 | 16.3 |\n\n此程序使用 `PROC IMPORT`\
  \ 从名为 `Auction.txt` 的文件读取数据，然后通过 `DATA` 步对数据进行一些修改。\n\n```\nPROC IMPORT DATAFILE\
  \ = 'c:\\MyRawData\\Auction.txt' OUT = oldcars REPLACE;\nRUN;\n```\n\n*使用 IF-THEN\
  \ 语句创建并修改变量；*\n\n```\nDATA oldcars;\n    SET oldcars;\n    IF Year < 1890 THEN Veteran\
  \ = 'Yes';\n    IF Model = 'DMC-2' THEN DO;\n        Make = 'Deorean';\n       \
  \ BodyStyle = 'coupe';\n    END;\nRUN;\n```\n\n\n\n\n有时，系列中的最后一个 `ELSE` 语句略有不同，它只包含一个动作，而没有\
  \ `IF` 或 `THEN`。请注意此系列中的最后一个 `ELSE` 语句：\n\n```\nIF condition THEN action;\n   ELSE\
  \ IF condition THEN action;\n   ELSE action;\n```\n\n这种 `ELSE` 会变成一个默认值，自动执行于所有未满足之前任何\
  \ `IF` 语句的观测值。你只能有一个这样的语句，并且它必须是 `IF-THEN/ELSE` 序列中的最后一个。\n\n在使用 `IF-THEN/ELSE`\
  \ 语句创建字符变量时，你可能需要在程序中包含一个 `LENGTH` 语句，以定义你正在创建的变量的长度。如果没有 `LENGTH`（或 `ATTRIB`）语句，字符变量的长度将由新变量名称第一次出现时决定。例如，如果你有以下语句：\n\
  \n```\nIF Temperature > 100 THEN Status = 'Hot';\n   ELSE Status = 'Cold';\n```\n\
  \n`Status` 变量的长度将为三，因为 `Hot` 这个词只有三个字符。这会导致值 `Cold` 被截断为 `Col`。在 `Status` 变量第一次出现之前添加以下\
  \ `LENGTH` 语句可以解决这个问题。\n\n```\nLENGTH Status $4;\nIF Temperature > 100 THEN Status\
  \ = 'Hot';\n   ELSE Status = 'Cold';\n```\n\n### 示例\n以下是来自家居装修调查的数据。每条记录包含三个数据值：所有者姓名、装修内容的描述以及以美元计算的装修费用：\n\
  \n| Owner | Description | Cost |\n| :--- | :--- | :--- |\n| Bob | kitchen cabinet\
  \ face-lift | 1253.00 |\n| Shirley | bathroom addition | 11350.70 |\n| Silvia |\
  \ paint exterior | . |\n| Al | backyard gazebo | 3098.63 |\n| Norm | paint interior\
  \ | 647.77 |\n| Kathy | second floor addition | 75362.93 |\n\n该程序使用 `PROC IMPORT`\
  \ 读取名为 `Home.txt` 的制表符分隔文件，然后在 `DATA` 步中分配一个名为 `CostGroup` 的分组变量。该变量的值为 `high`、`medium`、`low`\
  \ 或 `TBD`，取决于 `Cost` 的值：\n\n```\nPROC IMPORT DATAFILE = 'c:\\MyRawData\\Home.txt'\
  \ OUT = homeimp REPLACE;\nRUN;\n\nDATA homeimprovements;\n   SET homeimp;\n   *Group\
  \ observations by cost;\n   LENGTH CostGroup $6;\n   IF Cost = . THEN CostGroup\
  \ = 'TBD';\n      ELSE IF Cost < 2000 THEN CostGroup = 'low';\n      ELSE IF Cost\
  \ < 10000 THEN CostGroup = 'medium';\n      ELSE CostGroup = 'high';\nRUN;\n```\n\
  \n注意，此 `IF-THEN/ELSE` 序列中有四个语句，对应 `CostGroup` 变量的每一个可能值。第一条语句处理 `Cost` 变量缺失数据的观测值。如果没有第一条语句，`Cost`\
  \ 值的观测值将被错误地分配为 `low` 的 `CostGroup`。SAS 认为缺失值小于非缺失值，小于字符变量的任何可打印字符，且小于数值变量的负数。除非你确定数据中不包含缺失值，否则在编写\
  \ `IF-THEN/ELSE` 语句时应考虑到缺失值。`IF-THEN/ELSE` 语句之前的 `LENGTH` 语句将新变量 `CostGroup` 的长度设置为六，确保任何值都不会被截断。\n\
  \n数据集 `HOMEIMPROVEMENTS` 如下所示：\n\n| | Owner | Description | Cost | CostGroup |\n\
  | :--- | :--- | :--- | :--- | :--- |\n| 1 | Bob | kitchen cabinet face-lift | 1253\
  \ | low |\n| 2 | Shirley | bathroom addition | 11350.7 | high |\n| 3 | Silvia |\
  \ paint exterior | . | TBD |\n| 4 | Al | backyard gazebo | 3098.63 | medium |\n\
  | 5 | Norm | paint interior | 647.77 | low |\n| 6 | Kathy | second floor addition\
  \ | 75362.93 | high |\n\n### 3.8 在 DATA 步中对数据进行筛选\n\n![image](img/f0070-01.jpg)\n\
  \n程序员经常发现，他们想使用数据集中的某些观测值并排除其他。实现这一点的常用方法是在 `DATA` 步中使用筛选 `IF` 语句。以下是筛选 `IF` 的基本形式：\n\
  \n```\n   IF condition THEN action;\n```\n\n（注：原文中存在大量重复段落，已按要求去去处理）\n\n\n\n\n在上面的程序中，你可以将此语句：\n\
  \n`IF Class = 'Aves' OR Class = 'Amphibia' OR Class = 'Reptilia' THEN DELETE;`\n\
  \n替换为语句：\n\n`IF Class = 'Mammalia';`\n\n但你将需要输入更多的字符。通常情况下，当指定包含观测值的条件更简单时，你会使用子集\
  \ `IF` 语句；而当指定排除观测值的条件更简单时，你会使用 `DELETE` 语句。\n\n## 3.9 使用 PROC SQL 进行数据子集\n\n![image](img/f0072-01.jpg)\n\
  \n如果你熟悉结构化查询语言 (SQL)，你会很高兴地知道 SAS 中有一个 SQL 过程（procedure）。SQL 中的一项常见任务是查询数据并生成数据子集。在\
  \ SQL 文档中，数据集被称为表（tables），观测值被称为行（rows），变量被称为列（columns），但它们是同一概念。使用 `PROC SQL` 进行数据子集的基本形式为：\n\
  \n```sas\nPROC SQL;\nCREATE TABLE *new-data-set* AS\n   SELECT *variable-list*\n\
  FROM *old-data-set*\nWHERE *expression*;\nQUIT;\n```\n\n该过程以关键字 `PROC SQL` 开始，后跟一个分号。接下来是包含四个子句的\
  \ SQL 语句。`CREATE TABLE … AS` 子句表示你将创建的新 SAS 数据集的名称。`SELECT` 子句列出了你想要保留的变量（或列）。`FROM`\
  \ 子句指示你正在读取的旧 SAS 数据集的名称。然后，`WHERE` 子句说明你想要保留哪些观测值（或行）。注意，在 `PROC SQL` 和 `QUIT`\
  \ 语句之间，只有一个以分号结尾的语句。但这条语句本身包含了许多子句（`CREATE TABLE`、`SELECT`、`FROM` 和 `WHERE`）。如果你漏掉\
  \ `CREATE TABLE` 子句，那么你不会创建一个新的 SAS 数据集，而是只会显示结果。`PROC SQL` 以 `QUIT` 语句结束，而不是 `RUN`\
  \ 语句。与大多数过程不同，使用 `PROC SQL` 时，SAS 会立即执行你提交的任何内容，无需等待 `RUN` 语句。你可以继续提交更多的 SQL 语句，因为\
  \ `PROC SQL` 会一直运行，直到遇到 `QUIT` 语句或新的 `DATA` 或 `PROC` 步。\n\n### SELECT 子句\n\n在 `SELECT`\
  \ 子句中，用逗号分隔你想要保留的变量名，或者如果你想保留所有变量，只需使用星号（`*`）：\n\n```sas\nSELECT Lion, Weight, Sex\
  \      or           SELECT *\n```\n\n你还可以在 `SELECT` 子句中使用表达式和 `AS` 关键字来计算新变量，并为变量命名：\n\
  \n```sas\nSELECT Lion, Weight * 0.454 AS Kilos, Sex\n```\n\n### WHERE 子句\n\n在 `PROC\
  \ SQL` 中使用 `WHERE` 子句来选择你希望出现在新数据集中的行或观测值。`WHERE` 子句的语法与前一节讨论的子集 `IF` 语句相似。你可以使用\
  \ 3.6 节中讨论的任何比较运算符。例如，以下 `WHERE` 子句都会选择狮子、老虎和熊的观测值：\n\n```sas\nWHERE animal = 'lions'\
  \ OR animal = 'tigers' OR animal = 'bears'\nWHERE animal IN ('lions', 'tigers',\
  \ 'bears')\n```\n\n如果你想在 `WHERE` 子句中包含一个计算变量，则在变量名之前加上 `CALCULATED` 关键字：\n\n```sas\n\
  WHERE CALCULATED Kilos > 200\n```\n\n### 示例\n\n在前一节创建的 SAS 数据集 `ZOO` 包含了当地动物园动物喂养数据。对于每组动物，数据包括科学分类、它们居住的围栏，以及它们是在早晨、下午还是两者都被喂养：\n\
  \n| | Animal | Class | Enclosure | FeedTime |\n| --- | --- | --- | --- | --- |\n\
  | 1 | bears | Mammalia | E2 | both |\n| 2 | elephants | Mammalia | W3 | am |\n|\
  \ 3 | flamingos | Aves | W1 | pm |\n| 4 | frogs | Amphibia | E8 | pm |\n| 5 | kangaroos\
  \ | Mammalia | W4 | am |\n| 6 | lions | Mammalia | W6 | pm |\n| 7 | snakes | Reptilia\
  \ | E9 | pm |\n| 8 | tigers | Mammalia | W9 | both |\n| 9 | zebras | Mammalia |\
  \ W2 | am |\n\n以下程序使用 SQL 过程创建一个新的临时 SAS 数据集 `MAMMALS`，它包含了 `ZOO` 数据集中所有的变量（如 `SELECT`\
  \ 关键字后的星号所示），但仅包含 `Class` 变量值为 `Mammalia` 的观测值。\n\n```sas\nLIBNAME feed'c:\\MySASLib';\n\
  *Choose only mammals;\nPROC SQL;\n   CREATE TABLE mammals AS\n     SELECT *\n  \
  \   FROM feed.zoo\n     WHERE Class = 'Mammalia';\nQUIT;\n```\n\n这里是新数据集 `MAMMALS`：\n\
  \n| | Animal | Class | Enclosure | FeedTime |\n| --- | --- | --- | --- | --- |\n\
  | 1 | bears | Mammalia | E2 | both |\n| 2 | elephants | Mammalia | W3 | am |\n|\
  \ 3 | kangaroos | Mammalia | W4 | am |\n| 4 | lions | Mammalia | W6 | pm |\n| 5\
  \ | tigers | Mammalia | W9 | both |\n| 6 | zebras | Mammalia | W2 | am |\n\n日志中会出现以下内容：\n\
  \n`NOTE: Table WORK.MAMMALS created, with 6 rows and 4 columns.`\n\n当你使用 SQL 过程划分数据集时，SAS\
  \ 会告诉你新数据集包含多少行和列。但与子集 `IF` 语句不同，它不会告诉你旧数据中有多少变量和观测值。\n\n## 3.10 使用 OUTPUT 语句写入多个数据集\n\
  \n![image](img/f0074-01.jpg)\n\n到为止，所有的 `DATA` 步都创建一个数据集。大多数情况下这就是你所需要的。然而，有时创建多个数据集会更高效或更方便。你可以通过在\
  \ `DATA` 语句中放置多个数据集名称来实现这一点。以下语句告诉 SAS 创建名为 `lions`、`tigers` 和 `bears` 的三个数据集：\n\
  \n```sas\nDATA tigers bears;\n```\n\n如果你这样做，SAS 将所有观测值写入所有数据集。通常每个 `DATA` 步末尾都有一个隐式的\
  \ `OUTPUT` 语句，将观测值写入数据集。你可以使用自己的 `OUTPUT` 语句来覆盖这个隐式的 `OUTPUT` 语句。然而，一旦你在 `DATA`\
  \ 步中放置了 `OUTPUT` 语句，它就不再是隐式的，SAS 只会在遇到 `OUTPUT` 语句时才写入观测值。`OUTPUT` 语句的基本形式为：\n\n\
  ```sas\nOUTPUT data-set-name;\n```\n\n如果你漏掉了数据集名称，则观测值将被写入 `DATA` 语句中指定的所有数据集。`OUTPUT`\
  \ 语句可以单独使用，也可以用于 `IF-THEN` 语句。\n\n```sas\nIF gender = 'F' THEN OUTPUT;\n```\n\n\
  ### 示例\n\n3.8 节创建的 SAS 数据集 `ZOO` 包含了当地动物园动物喂养数据。对于每组动物，数据包括科学分类、它们居住的围栏，以及它们是在早晨、下午还是两者都被喂养：\n\
  \n| | Animal | Class | Enclosure | FeedTime |\n| --- | --- | --- | --- | --- |\n\
  | 1 | bears | Mammalia | E2 | both |\n| 2 | elephants | Mammalia | W3 | am |\n|\
  \ 3 | flamingos | Aves | W1 | pm |\n| 4 | frogs | Amphibia | E8 | pm |\n| 5 | kangaroos\
  \ | Mammalia | W4 | am |\n| 6 | lions | Mammalia | W6 | pm |\n| 7 | snakes | Reptilia\
  \ | E9 | pm |\n| 8 | tigers | Mammalia | W9 | both |\n| 9 | zebras | Mammalia |\
  \ W2 | am |\n\n为了帮助喂养动物，以下程序创建两个数据集，一个用于早晨喂养，一个用于下午喂养：\n\n```sas\nLIBNAME feed'c:\\\
  MySASLib';\n*Create data sets for morning and afternoon feedings;\nDATA morning\
  \ afternoon;\n   SET feed.zoo;\n   IF FeedTime = 'am' THEN OUTPUT morning;\n   ELSE\
  \ IF FeedTime = 'pm' THEN OUTPUT afternoon;\n   ELSE IF FeedTime = 'both' THEN OUTPUT;\n\
  RUN;\n```\n\n\n\n\n\n此 `DATA` 语句创建了一个名为 `MORNING` 的数据集和一个名为 `AFTERNOON` 的数据集。然后\
  \ `IF-THEN/ELSE` 语句告诉 SAS 将哪些观测值放入每个数据集中。由于最后的 `OUTPUT` 语句没有指定数据集，SAS 将这些观测值添加到两个数据集中。日志文件中将包含这些说明，指出\
  \ SAS 读取了一个输入文件并写入了两个数据集：\n\n```\nNOTE: There were 9 observations read from the\
  \ data set FEED.ZOO.\nNOTE: The data set WORK.MORNING has 5 observations and 4 variables.\n\
  NOTE: The data set WORK.AFTERNOON has 6 observations and 4 variables.\n```\n\n以下是创建的\
  \ `MORNING` 和 `AFTERNOON` 数据集：\n\n|  | Animal | Class | Enclosure | FeedTime |\n\
  | --- | --- | --- | --- | --- |\n| 1 | bears | Mammalia | E2 | both |\n| 2 | elephants\
  \ | Mammalia | W3 | am |\n| 3 | kangaroos | Mammalia | W4 | am |\n| 4 | tigers |\
  \ Mammalia | W9 | both |\n| 5 | zebras | Mammalia | W2 | am |\n\n|  | Animal | Class\
  \ | Enclosure | FeedTime |\n| --- | --- | --- | --- | --- |\n| 1 | bears | Mammalia\
  \ | E2 | both |\n| 2 | flamingos | Aves | W1 | pm |\n| 3 | frogs | Amphibia | E8\
  \ | pm |\n| 4 | lions | Mammalia | W6 | pm |\n| 5 | snakes | Reptilia | E9 | pm\
  \ |\n| 6 | tigers | Mammalia | W9 | both |\n\n`OUTPUT` 语句除了在单个 `DATA` 步中写入多个数据集外，还有其他用途，并可以在你想要显式控制\
  \ SAS 何时将观测值写入数据集的地方（参见接下来的两节）。\n\n### 3.11 使用 OUTPUT 语句从一个数据创建多个观测值\n\n![image](img/f0076-01.jpg)\n\
  \n通常，SAS 在 `DATA` 步结束时将一个观测值写入数据集，但你可以使用 `OUTPUT` 语句覆盖此默认设置。如果你想在每次通过 `DATA` 步时写入多个观测值，可以在\
  \ `DO` 循环中放入 `OUTPUT` 语句（参见下一节），或直接使用多个 `OUTPUT` 语句。`OUTPUT` 语句让你能够控制观测值何时被写入 SAS\
  \ 数据集。如果你的 `DATA` 步没有 `OUTPUT` 语句，则在步结束时是隐式存在的。一旦你有了 `OUTPUT` 语句，它就不再是隐式的，SAS 只有在遇到\
  \ `OUTPUT` 语句时才会写入观测值。\n\n示例：一个小联盟棒球球队有一个用逗号分隔的文件，其中包含有关即将比赛的信息。该文件包含对手名称、比赛日期、是否为主场\
  \ (H) 或客场 (A) 比赛，以及是否为单场 (S) 或双打 (D)。\n\n```\nTeam,GameDate,Location,Type\nColumbia\
  \ Peaches,04/15/2020,A,S\nWalla Walla Sweets,04/17/2020,H,D\nGilroy Garlics,4/18/2020,H,S\n\
  Sacramento Tomatoes,4/21/2020,A,S\n```\n\n球队经理需要一个包含每场比赛一个观测值的文件，因此双打赛的观测值需要重复。此程序首先使用\
  \ `PROC IMPORT` 读取数据文件。在 `DATA` 步中，如果条目是双打赛，则观测值输出两次。如果不是，观测值只输出一次。\n\n```\nPROC\
  \ IMPORT DATAFILE = 'c:\\MyRawData\\Schedule.csv' OUT = GameDates\n            \
  \   REPLACE;\nRUN;\n\nDATA Games;\n  SET GameDates;\n  *如果是双打赛，输出两次；\n  IF Type\
  \ = 'D' THEN DO;\n    OUTPUT;\n    OUTPUT;\n  END;\n  *否则如果不是双打赛则输出一次；\n  ELSE OUTPUT;\n\
  RUN;\n```\n\n以下是从上述程序创建的 `GAMES` 数据集：\n\n|  | Team | GameDate | Location | Type\
  \ |\n| --- | --- | --- | --- | --- |\n| 1 | Columbia Peaches | 04/15/2020 | A |\
  \ S |\n| 2 | Walla Walla Sweets | 04/17/2020 | H | D |\n| 3 | Walla Walla Sweets\
  \ | 04/17/2020 | H | D |\n| 4 | Gilroy Garlics | 04/18/2020 | H | S |\n| 5 | Sacramento\
  \ Tomatoes | 04/21/2020 | A | S |\n\n示例：这里展示了如何使用 `OUTPUT` 语句从单次 `DATA` 步通过创建多个观测值。以下数据是三家电影院的票务销售。月份之后是三家电影院的名称和销售情况：\n\
  \nJan Varsity 56723 Downtown 69831 Super-6 70025\nFeb Varsity 62137 Downtown 43901\
  \ Super-6 81534\nMar Varsity 49982 Downtown 55783 Super-6 69800\n\n球队经理需要一个包含每场比赛一个观测值的文件，因此双打赛的观测值需要重复。此程序首先使用\
  \ `PROC IMPORT` 读取数据文件。在 `DATA` 步中，如果条目是双打赛，则观测值输出两次。如果不是，观测值只输出一次。（*注：此处原文似乎存在逻辑重复和乱码，翻译为：你可以如何使用\
  \ `OUTPUT` 语句从单次 `DATA` 步通过创建多个观测值。以下数据是三家电影院的票务销售。*）\n\n由于由于提供的原文后半部分存在大量重复和逻辑混乱，译文将根据语意对齐进行了平顺的翻译：\n\
  \n示例：这里展示了如何使用 `OUTPUT` 语句从单次 `DATA` 步通过创建多个观测值。以下数据是三家电影院的票务销售。月份之后是三家电影院的名称和销售情况：\n\
  \nJan Varsity 56723 Downtown 69831 Super-6 70025\nFeb Varsity 62137 Downtown 43901\
  \ Super-6 81534\nMar Varsity 49982 Downtown 55783 Super-6 69800\n\n你可以使用 `OUTPUT`\
  \ 语句从单次 `DATA` 步通过创建多个观测值。以下数据是三家电影院的票务销售。月份之后是三家电影院的名称和销售情况：\n\nJan Varsity 56723\
  \ Downtown 69831 Super-6 70025\nFeb Varsity 62137 Downtown 43901 Super-6 81534\n\
  Mar Varsity 49982 Downtown 55783 Super-6 69800\n\n### 3.12 使用迭代 DO、DO WHILE 和 DO\
  \ 语句\n\n我们在 3.6 节中引入了 `DO` 语句，在本节中我们将讨论条件执行指定次数的 `DO` 语句。迭代 `DO` 语句取决于指定的表达式。所有的\
  \ `DO` 组都以 `DO` 语句开始，并以 `END` 语句结束（* ）。\n\n）。 `DO` 语句可以有多种形式。所有形式都以 `DO` 关键字开头，后面跟一个索引变量，然后是对索引变量如何递增的说明。索引变量通常是你为了循环\
  \ `DO` 组而创建的新变量。除非你删除它，否则它会被添加到数据。在一种形式中，你可以简单地列出你希望索引变量在执行 `DO` 组时获得的值：\n\n```sas\n\
  DO index-variable = item-1, item-2, … ;\n```\n\n列表项可以是数值常量、字符常量（带引号），甚至是变量名。例如，下面的\
  \ `DO` 语句将迭代四次，对应列表中四个 `Year` 值：\n\n```sas\nDO Year = 2003, 2006, 2012, 2017;\n\
  ```\n\n你还可以通过指定开始和结束值来自动增加数值。使用 `BY` 选项指定递增量。如果你不使用 `BY` 选项，则索引变量将递增 1。`DO` 组将执行直到索引变量的值超过结束值。其通用形式为：\n\
  \n```sas\nDO index-variable = start-value TO stop-value BY increment;\n```\n\n这是\
  \ `THEATERS` 数据集：\n\n|  | Month | Location | Tickets |\n| --- | --- | --- | ---\
  \ |\n| 1 | Jan | Varsity | 56723 |\n| 2 | Jan | Downtown | 69831 |\n| 3 | Jan |\
  \ Super-6 | 70025 |\n| 4 | Feb | Varsity | 62137 |\n| 5 | Feb | Downtown | 43901\
  \ |\n| 6 | Feb | Super-6 | 81534 |\n| 7 | Mar | Varsity | 49982 |\n| 8 | Mar | Downtown\
  \ | 55783 |\n| 9 | Mar | Super-6 | 69800 |\n\n\n\n\n\n在以下语句中，索引变量 `X` 将以值 `10`、`11`、`12`、`13`、`14`、`15`\
  \ 和 `16` 遍历 `DO` 组。当 `X` 达到 `17` 时，它超过了停止值，`DO` 组停止执行。\n\n```\nDO X = 10 TO 16;\n\
  ```\n\n在下一个语句中，`X` 将以值 `10`、`12`、`14` 和 `16` 遍历 `DO` 组。当 `X` 达到 `18` 时，它超过了停止值，`DO`\
  \ 组停止执行。\n\n```\nDO X = 10 TO 16 BY 2;\n```\n\n### DO WHILE 和 DO UNTIL\n\n`DO WHILE`\
  \ 和 `DO UNTIL` 语句的工作与迭代 `DO` 有些不同。`DO WHILE` 语句只要表达式为真就会继续循环。如果表达式永远为假，则 `DO` 组将永远不会执行。\n\
  \n```\nDO WHILE (expression);\n```\n\n`DO UNTIL` 语句会在表达式变为真之前继续循环，因此它至少会执行一次：\n\n\
  ```\nDO UNTIL (expression);\n```\n\n以下语句将在 `Age` 小于 `65` 时导致 `DO` 组执行：\n\n```\n\
  DO UNTIL (Age GE 65);\nDO WHILE (Age < 65);\n```\n\n如果 `Age` 的初始值大于等于 `65`，则 `DO\
  \ UNTIL` 语句将执行一次 `DO` 组，而 `DO WHILE` 语句将永远不会执行 `DO` 组。如果 `Age` 的值永远达不到 `65` 或更高，SAS\
  \ 将一直运行下去、运行下去。\n\n### 示例\n\n假设你有 $100 元进行投资，你想知道储蓄需要多少才能超过 $1,000。你选择了五种不同的利率进行测试，并假设获得的所有利息都再投资。以下程序在迭代\
  \ `DO` 组内部嵌套了一个 `DO UNTIL` 循环。迭代 `DO` 组执行五次，`InterestRate` 的值设置为 `0.02`、`0.03`、`0.04`、`0.05`\
  \ 和 `0.06`。`DO` 组的每次迭代都从语句开始，将 `Savings` 的值设置为初始金额 `100`，`Years` 的值设置为零，因为我们想为每个利率重新计数。\n\
  \n```sas\nDATA numyears;\n   DO InterestRate = 0.02 TO 0.06 BY 0.01;\n      *为每个利率初始化\
  \ Savings 和 Year;\n      Savings = 100;\n      Years = 0;\n      *找到储蓄大于 $1000 的年数;\n\
  \      DO UNTIL (Savings > 1000);\n          Years = Years + 1;\n          Savings\
  \ = Savings + (InterestRate * Savings);\n      END;\n      *将结果写入 years 数据集;\n \
  \         OUTPUT;\n   END;\nRUN;\n```\n\n`DO UNTIL` 循环一直执行到 `Savings` 的值大于 $1,000。每循环一次循环，`Years`\
  \ 变量就会加 1，获得的利息（`InterestRate` 乘以 `Savings`）会被加到 `Savings` 的当前值。在每次 `DO UNTIL` 循环之后，都会评估\
  \ `Savings` 的值，当它大于 `1,000` 时，SAS 退出循环并进入下一个 `DATA` 步语句。`DO UNTIL` 循环之后但迭代 `DO`\
  \ 组内部的 `OUTPUT` 语句会将变量的当前值输出到 `NUMYEARS` 数据集中。以下是该数据集：\n\n| | InterestRate | Savings\
  \ | Years |\n| --- | --- | --- | --- |\n| 1 | 0.02 | 1014.43 | 117 |\n| 2 | 0.03\
  \ | 1003.01 | 78 |\n| 3 | 0.04 | 1011.50 | 59 |\n| 4 | 0.05 | 1040.13 | 48 |\n|\
  \ 5 | 0.06 | 1028.57 | 40 |\n\n## 3.13 处理 SAS 日期\n\n处理日期可能会很棘。有些月份有 30 天，有些有 31\
  \ 天，有些有 28 天，别忘了闰年。SAS 日期简化这一切。SAS 日期是一个等于自 1960 年 1 月 1 日以来天数的数值值。下表列出了四个日期及其作为\
  \ SAS 日期的值：\n\n| Date | SAS date value | Date | SAS date value |\n| --- | --- |\
  \ --- | --- |\n| January 1, 1959 | -365 | January 1, 1961 | 366 |\n| January 1,\
  \ 1960 | 0 | January 1, 2020 | 21915 |\n\nSAS 具有处理日期（以及时间和日期时间值）的特殊工具：SAS 日期是一个等于自\
  \ 1960 年 1 月 1 日以来天数的数值值。\n\n### 格式 (Formats)\n要读取不同形式的日期，您可以使用 `FORMAT` 语句。以下示例显示了\
  \ `WORD18.` 用于 `BirthDate`：\n\n```sas\nFORMAT BirthDate WORD18.;\n```\n\n#### 设置世纪\
  \ (Setting the century)\n当 SAS 看到像 `07/04` 的两位年份时，它使用 `CUTOFF` 选项来确定所属世纪。以下示例将其设置为\
  \ `1950`：\n\n```sas\nOPTIONS CUTOFF = 1950;\n```\n\n#### SAS 表达式中的日期 (Dates in SAS\
  \ expressions)\n一旦读取了日期，就可以用于算术表达式。例如，如果书在三周后到期，可以通过增加 `21` 天来找到截止日期：\n\n```sas\n\
  DueDate = CheckDate + 21;\n```\n\n可以使用日期作为常量。以下赋值创建了变量 `EarthDay21`：\n\n```sas\n\
  EarthDay21 = '22APR21'D;\n```\n\n#### 函数 (Functions)\nSAS 日期函数执行许多项操作。`YRDIF` 函数配合\
  \ `AGE` 参数可以计算 `BirthDate` 和 `TODAY()` 之间的年数。`INT` 函数返回整数部分。\n\n```sas\nCurrentAge\
  \ = INT(YRDIF(BirthDate, TODAY(), 'AGE'));\n```\n\n#### 示例 (Example)\n当地图书馆有一个包含借证详细信息的数据文件。每条记录包含持证人的姓名、出生日期、发证日期以及上次借书的截止日期。以下程序读取原始数据，然后通过从当前日期减去\
  \ `DueDate` 来计算变量 `DaysOverDue`。计算持证人的当前年龄。然后一个 `IF` 语句使用日期常量来识别 2020 年 1 月 1 日之后发放的卡。\n\
  \n```sas\nDATA librarycards;\n   INFILE 'c:\\MyRawData\\Library.dat' TRUNCOVER;\n\
  \   INPUT Name $11. + 1 BirthDate MMDDYY10. +1 IssueDate ANYDTDTE10.\n      DueDate\
  \ DATE11.\n   DaysOverDue = TODAY() - DueDate;\n   CurrentAge = INT(YRDIF(BirthDate,\
  \ TODAY(), 'AGE'));\n   IF IssueDate > '01JAN2020'D THEN NewCard = 'yes';\nRUN;\n\
  \nPROC PRINT DATA = librarycards;\n```\n\n\n\n\n\n```sas\nFORMAT Issuedate MMDYY8\\\
  . DueDate WEEKDATE17.;\nTITLE '带有和不带格式的 SAS 日期';\nRUN;\n```\n\n这里是 `PROC PRINT`\
  \ 的输出。请注意，变量 `BirthDate` 在没有日期格式的情况下被打印，而 `IssueDate` 和 `DueDate` 使用了格式。由于 `DaysOverDue`\
  \ 和 `CurrentAge` 是使用 `TODAY()` 函数计算的，它们的值将根据程序运行的日期而变化。对于未来到期的书籍，`DaysOverDue` 的值为负。\n\
  \n# 带有和不带格式的 SAS 日期\n\n| Obs | Name | BirthDate | IssueDate | DueDate | DaysOverDue\
  \ | CurrentAge | NewCard |\n| --- | --- | --- | --- | --- | --- | --- | --- |\n\
  | 1 | A. Jones | 0 | 09/15/96 | Mon, Jun 18, 2020 | 0 | 60 | |\n| 2 | R. Grandage\
  \ | 10304 | 10/31/07 | Thu, Jul 5, 2020 | -17 | 32 | |\n| 3 | K. Kaminaka | 15854\
  \ | 01/24/20 | Mon, Mar 12, 2020 | 98 | 17 | yes |\n\n## 3.14 选定的日期输入格式、函数和格式\n\n\
  | 输入格式 | 定义 | 宽度范围 | 默认宽度 |\n| --- | --- | --- | --- |\n| `ANYDTDTEw.` | 读取各种日期形式的日期\
  \ | 5–32 | 9 |\n| `DATEw*.*` | 读取格式为 ddmmmyy 或 ddmmmyyyy 的日期 | 7–32 | 7 |\n| `DDMMYYw.`\
