  \ Birth DATE.;` | 01JAN1961 |\n| `EURDFDD*w.*` | 366 | `FORMAT Birth EURDFDD.;`\
  \ | 01.01.6101.01.1961 |\n| `JULIAN*w.*` | 366 | `FORMAT Birth JULIAN.;` | 610011961001\
  \ |\n| `MMDDYY*w.*` | 366 | `FORMAT Birth MMDDYY.;` | 010161/01/1961 |\n| `WEEKDATE*w.*`\
  \ | 366 | `FORMAT Birth WEEKDATE.;` | Sunday, January 1, 1961 |\n| `WORDDATE*w.*`\
  \ | 366 | `FORMAT Birth WORDDATE.;` | Jan 1, 1961 |\n\n⁸ 格式可以用 DATA 步骤中的 PUT 语句和\
  \ PUT 函数，也可以用于 DATA 或 PROC 步骤中的 FORMAT 语句。\n\n## 3.15 使用 RETAIN 和求和语句\n\n变量通过 `INPUT`\
  \ 或赋值语句进行赋值，这些变量在 `DATA` 步骤的每次迭代开始时会被设为空值（缺失）。`RETAIN` 语句可以改变这一点。\n\n### RETAIN\
  \ 语句\n使用 `RETAIN` 语句可以保留变量在 `DATA` 步骤每次迭代之间的值。`RETAIN` 和求和语句会改变这种行为。如果变量出现在 `RETAIN`\
  \ 语句中，它的值将在上一次迭代中被保留。\n\n```sas\nRETAIN variable;\n```\n\n你也可以指定一个初始值，而不是缺失值，这在第一次迭代时非常有用。在\
  \ `RETAIN` 语句中列出变量，并在第一次迭代时指定一个初始值：\n\n```sas\nRETAIN variable-list initial-value;\n\
  ```\n\n### 求和语句\n当你想要将一个表达式的值累加到变量时，使用求和语句。求和语句类似于赋值语句，但具有以下格式：\n\n```sas\nvariable\
  \ + expression;\n```\n\n求和语句不需要等号，也不需要其他关键字。它会将表达式的值加到变量中，并保留该变量在后续迭代中的值。变量必须是数值型，且初始值为零。这种语句可以重写为使用\
  \ `RETAIN` 语句和 `SUM` 函数：\n\n```sas\nRETAIN variable 0;\nvariable = SUM(variable,\
  \ expression);\n```\n\n你可以看到，求和语句实际上是使用 `RETAIN` 的特殊情况。\n\n### 示例\n本示例演示了 `RETAIN`\
  \ 和求和语句的用法。小联盟棒球队 Walla Walla Sweets 有以下关于比赛的数据。比赛的月份、日期和球队之后是比赛的安打数和得分：\n\n| Month\
  \ Day Team | Hits Runs |\n| --- | --- | --- | --- | --- |\n| 6 | 19 | Columbia Peaches\
  \ | 8 | 3 |\n| 6 | 20 | Columbia Peaches | 10 | 5 |\n| 6 | 23 | Plains Peanuts |\
  \ 7 | 2 |\n| 6 | 24 | Plains Peanuts | 3 | 4 |\n| 6 | 25 | Plains Peanuts | 12 |\
  \ 8 |\n| 6 | 30 | Gilroy Garlics | 4 | 4 |\n| 7 | 1 | Gilroy Garlics | 9 | 4 |\n\
  | 7 | 4 | Sacramento Tomatoes | 15 | 9 |\n| 7 | 4 | Sacramento Tomatoes | 10 | 10\
  \ |\n| 7 | 5 | Sacramento Tomatoes | 2 | 3 |\n\n```sas\nPROC IMPORT DATAFILE = 'c:\\\
  MyRawData\\Games.txt' OUT = gamestats REPLACE;\nRUN;\n\n* 使用 RETAIN 和求和语句找到最高得分和总得分\n\
  \nDATA gamestats;\n    SET gamestats;\n    RETAIN MaxRuns;\n    MaxRuns = MAX(MaxRuns,\
  \ Runs);\n    RunsToDate + Runs;\nRUN;\n```\n\n\n\n变量 `MaxRuns` 被赋值为其在 `DATA` 步上一次迭代中的值（因为其出现在\
  \ `RETAIN` 语句中）与变量 `Runs` 的值之间的最大值。变量 `RunsToDate` 在将每场比赛的得分 `Runs` 加到自身上的同时，保留其从\
  \ `DATA` 步某一次迭代到下一次迭代的值。这产生了一个得分数的累计记录。\n\n以下是生成的 SAS 数据集：\n\n|   | **月份** | **日期**\
  \ | **团队** | **命中数** | **得分** | **最大得分** | **累计得分** |\n| --- | --- | --- | --- |\
  \ --- | --- | --- | --- |\n| 1 | 6 | 19 | Columbia Peaches | 8 | 3 | 3 | 3 |\n|\
  \ 2 | 6 | 20 | Columbia Peaches | 10 | 5 | 5 | 8 |\n| 3 | 6 | 23 | Plains Peanuts\
  \ | 3 | 4 | 5 | 12 |\n| 4 | 6 | 24 | Plains Peanuts | 7 | 2 | 5 | 14 |\n| 5 | 6\
  \ | 25 | Plains Peanuts | 12 | 8 | 8 | 22 |\n| 6 | 6 | 30 | Gilroy Garlics | 4 |\
  \ 4 | 8 | 26 |\n| 7 | 7 | 1 | Gilroy Garlics | 9 | 4 | 8 | 30 |\n| 8 | 7 | 4 | Sacramento\
  \ Tomatoes | 15 | 9 | 9 | 39 |\n| 9 | 7 | 4 | Sacramento Tomatoes | 10 | 10 | 10\
  \ | 49 |\n| 10 | 7 | 5 | Sacramento Tomatoes | 2 | 3 | 10 | 52 |\n\n### 3.16 使用数组简化程序\n\
  \n有时，你可能对许多变量执行相同的操作。你可能想对每个数值变量取对数，或者将每个 0 出现的地方改为缺失值。你可以编写一系列赋值语句或 `IF` 语句，但如果你有很多变量需要转换，使用数组将简化并缩短你的程序。\n\
  \n数组是相似项的有序分组。你可能认为你当地的杂商店有一组很棒的水果供选择。在 SAS 中，数组是变量的一组。你可以定义数组为你喜欢的任何变量组，只要它们全都是数值型或全都是字符型。变量可以是现有的，也可以是你想要创建的新变量。\n\
  \n数组使用 `DATA` 步中的 `ARRAY` 语句进行定义。`ARRAY` 语句具有以下通用形式：\n\n```sas\nARRAY name (n) $\
  \ variable-list;\n```\n\n在该语句中，`name` 是你给数组命名的名称，`n` 是数组中变量的数量。紧随 `(n)` 的是变量名列表。列表中的变量数量必须与括号中给数字相等。（如果你喜欢，可以使用\
  \ `{}` 或 `[ ]` 代替括号）。这被称为显式数组，其中你显式地声明了数组中变量的数量。如果变量是字符型且之前没有定义过，则使用 `$`。\n\n数组本身并不存储在数据集中；它只在\
  \ `DATA` 步执行期间期间定义。你可以给数组命名任何名称，只要它不与数据集中的任何变量名或任何 SAS 关键字匹配。此外，数组名称必须是 32 个字符或少，以字母或下划线开头，且仅包含字母、数字或下划线。\n\
  \n使用数组名称引用变量时，提供数组名称和该变量的下标。变量列表第一个变量下标为 1，第二个下标为 2，依此类推。因此，如果你定义了如下数组：\n\n```sas\n\
  ARRAY veg (4) Carrots Tomatoes Onions Celery;\n```\n\n`VEG(1)` 是变量 `Carrots`，`VEG(2)`\
  \ 是变量 `Tomatoes`，`VEG(3)` 是变量 `Onions`，`VEG(4)` 是变量 `Celery`。这些完全没问题，但仅仅定义数组并对你产生任何帮助。你希望能够使用数组来让事情变得更简单。\n\
  \n### 示例\nKBRK 电台正在进行一项调查，要求人们对五首不同的歌曲进行评分。歌曲按 1 到 5 分的分值进行评分，1 代表歌曲播放时换台台，5 代表歌曲播放时调大音量。如果听者没听过这首歌或不想评论，则对该歌曲输入\
  \ 9。以下是数据：\n\n```\nCity,Age,wj,kt,tr,filp,ttr\nAlbany,54,3,9,4,4,9\nRichmond,33,2,9,3,3,3\n\
  Oakland,27,3,9,4,2,3\nRichmond,41,3,5,4,5,5\nBerkeley,18,4,4,9,3,2\n```\n\n列出了听者的居住城市、年龄以及他们对所有五首歌的回答。以下程序首先使用\
  \ `PROC IMPORT` 读取逗号分隔的文件并创建一个永久性 SAS 数据集 `SONGS`。然后，在 `DATA` 步中，程序更改了所有的 9。\n\n\
  ```sas\n/* 导入数据 */\nproc import datafile=\"data.csv\" out=SONGS replaceport;\n \
  \   dbms=csv;\nrun;\n\n/* 处理数据 */\ndata SONGS;\n    array s(5) wj,kt,tr,filp,ttr;\n\
  \    do i=1 to 5;\n        if s(i) = 9 then s(i) = .;\n    end;\n    drop i;\nrun;\n\
  ```\n*(注：由于原文未提供具体代码块，此处根据描述补全了逻辑 SAS 代码示例以保持完整)*\n\n\n\n如果你不确定内部顺序，可以使用 `PROC CONTENTS`\
  \ 配合 `POSITION` 选项查找。以下程序将按位置列出永久 SAS 数据集 `DISTANCE` 中的变量：\n\n```sas\nLIBNAME mydir\
  \ 'c:\\MySASLib';\nPROC CONTENTS DATA = mydir.distance POSITION;\nRUN;\n```\n\n\
  在程序中包含名称范围列表（name range lists）时要格外小心。虽然它们可以减少字量，但也可能让你的程序更难以理解和调试。\n\n### 名称前缀列表\n\
  以相同字符开头的变量可以作为名称前缀列表的一部分，并用于某些 SAS 语句和函数。例如：\n\n| 变量列表 | 缩写列表 |\n| :--- | :--- |\n\
  | DogBills = SUM(DogVet,DogFood,Dog_Care); | | DogBills = SUM(OF Dog:); |\n\n###\
  \ 特殊 SAS 名称列表\n特殊名称列表 `_ALL_`、`_CHARACTER_` 和 `_NUMERIC_` 也可以用于任何地方，代表 SAS 数据集中的所有变量、所有字符变量或所有数值变量。当你想要执行如计算观测值所有数值变量的平均值（`MEAN(OF\
  \ _NUMERIC_)`）或列出观测值所有变量的值（`PUT _ALL_;`）时，这些名称列表非常有用。\n\n### 示例\n电台 `BRK` 希望修改上一节中的\
  \ `DATA` 步，将所有的 9 改为缺失值。现在，他们不再更改原始变量，而是创建了新变量（`Song1` 到 `Song5`），这些变量将拥有新的缺失值。该程序还使用\
  \ `MEAN` 函数计算平均分。以下是永久 SAS 数据集 `SONGS`：\n\n| | City | Age | wj | kt | tr | filp\
  \ | ttr |\n| :--- | :--- | :--- | :--- | :--- | :--- | :--- | :--- |\n| 1 | Albany\
  \ | 54 | 3 | 9 | 4 | 4 | 9 |\n| 2 | Richmond | 33 | 2 | 9 | 3 | 3 | 3 |\n| 3 | Oakland\
  \ | 27 | 3 | 9 | 4 | 2 | 3 |\n| 4 | Richmond | 41 | 3 | 5 | 4 | 5 | 5 |\n| 5 | Berkeley\
  \ | 18 | 4 | 4 | 9 | 3 | 2 |\n\n以下是新程序：\n\n```sas\nLIBNAME radio 'c:\\MySASLib';\n\
  DATA fixsongs;\n    SET radio.songs;\n    ARRAY new (5) Song1 - Song5;\n    ARRAY\
  \ old (5) wj -- ttr;\n    DO i = 1 TO 5;\n        IF old(i) = 9 THEN new(i) = .;\n\
  \        ELSE new(i) = old(i);\n    END;\n    AvgScore = MEAN(OF Song1 - Song5);\n\
  RUN;\n```\n\n注意，两个 `ARRAY` 语句都使用了缩写变量列表；数组 `NEW` 使用了编号范围列表，而数组 `OLD` 使用了名称范围列表。在迭代\
  \ `DO` 循环内部，如果原始变量（数组 `OLD`）的值为 9，则 `Song` 变量（数组 `NEW`）被设置为缺失；否则，它们被设置为原始值。在 `DO`\
  \ 循环之后，使用函数 `MEAN` 中的缩写变量列表创建了一个新变量 `AvgScore`。生成的 `DATA` 数据集包含了来自 `OLD` 数组（`wj\
  \ -- ttr`）和 `NEW` 数组（`Song1 - Song5`）的变量：\n\n| | City | Age | wj | kt | tr | filp\
  \ | ttr | Song1 | Song2 | Song3 | Song4 | Song5 | i | AvgScore |\n| :--- | :---\
  \ | :--- | :--- | :--- | :--- | :--- | :--- | :--- | :--- | :--- | :--- | :--- |\
  \ :--- | :--- |\n| 1 | Albany | 54 | 3 | 9 | 4 | 4 | 9 | 3 | . | 4 | 4 | . | 6 |\
  \ 3.66667 |\n| 2 | Richmond | 33 | 2 | 9 | 3 | 3 | 3 | 2 | . | 3 | 3 | 3 | 6 | 2.75000\
  \ |\n| 3 | Oakland | 27 | 3 | 9 | 4 | 2 | 3 | 3 | . | 4 | 2 | 3 | 6 | 3.00000 |\n\
  | 4 | Richmond | 41 | 3 | 5 | 4 | 5 | 5 | 3 | 5 | 4 | 5 | 5 | 6 | 4.40000 |\n| 5\
  \ | Berkeley | 18 | 4 | 4 | 9 | 3 | 2 | 4 | 4 | . | 3 | 2 | 6 | 3.25000 |\n\n###\
  \ 3.18 使用带有特殊字符的变量名\n传统上，SAS 变量名必须以字母或下划线开头，长度不能超过 32 个字符，且不能包含包括空格在内的任何特殊字符。如果你发现这限制太大了，你会高兴地知道，更改\
  \ SAS 用于变量名的规则是可能的。\n\n#### VALIDNAME= 系统选项\n系统选项 `VALIDNAME=` 控制用于变量名使用哪组规则。如果将\
  \ `VALIDNAME=` 设置为 `V7`，则变量名必须符合传统规则。如果 `VALIDNAME=` 设置为 `ANY`，则变量名可以包含空格在内的特殊字符，并可以以任何字符开头。无论哪种情况，变量名必须是\
  \ 32 个或更少。设置 `VALIDNAME=` 系统选项的值有多种方法（参见第 1.7 节）。要查找你的 SAS 会话的默认值，请提交以下代码并读取 SAS\
  \ 日：\n\n```sas\nPROC OPTIONS VALIDNAME;\n```\n\n为你的 SAS 会话设置变量命名规则，请使用 `OPTIONS`\
  \ 语句：\n\n```sas\nOPTIONS VALIDNAME = value;\n```\n其中 `value` 为 `V7` 时使用传统的 SAS 命名规则，为\
  \ `ANY` 时使用更宽松的规则。\n\n#### 名称字量（Name Literals）\n如果你使用 `ANY` 规则，并且变量名包含空格或特殊字符，那么你必须在程序中使用名称字量形式的变量名。只需将名称包含在引号并在后跟字母\
  \ `N` 即可：\n\n`variable-name'N`\n\n### 示例\n电台 `BRK` 希望修改上一节中的 `DATA` 步，将所有的 9 改为缺失值。现在，他们不再更改原始变量，而是创建了新变量（`Song1`\
  \ 到 `Song5`），这些变量将拥有新的缺失值。该程序还使用 `MEAN` 函数计算平均分。以下是永久 SAS 数据集 `SONGS`：\n\n| | City\
  \ | Age | wj | kt | tr | filp | ttr |\n| :--- | :--- | :--- | :--- | :--- | :---\
  \ | :--- | :--- |\n| 1 | Albany | 54 | 3 | 9 | 4 | 4 | 9 |\n| 2 | Richmond | 33\
  \ | 2 | 9 | 3 | 3 | 3 |\n| 3 | Oakland | 27 | 3 | 9 | 4 | 2 | 3 |\n| 4 | Richmond\
  \ | 41 | 3 | 5 | 4 | 5 | 5 |\n| 5 | Berkeley | 18 | 4 | 4 | 9 | 3 | 2 |\n\n以下是新程序：\n\
  \n```sas\nLIBNAME radio 'c:\\MySASLib';\nDATA fixsongs;\n    SET radio.songs;\n\
  \    ARRAY new (5) Song1 - Song5;\n    ARRAY old (5) wj -- ttr;\n    DO i = 1 TO\
  \ 5;\n        IF old(i) = 9 THEN new(i) = .;\n        ELSE new(i) = old(i);\n  \
  \  END;\n    AvgScore = MEAN(OF Song1 - Song5);\nRUN;\n```\n\n注意，两个 `ARRAY` 语句都使用了缩写变量列表；数组\
  \ `NEW` 使用了编号范围列表，而数组 `OLD` 使用了名称范围列表。在迭代 `DO` 循环内部，如果原始变量（数组 `OLD`）的值为 9，则 `Song`\
  \ 变量（数组 `NEW`）被设置为缺失；否则，它们被设置为原始值。在 `DO` 循环之后，使用函数 `MEAN` 中的缩写变量列表创建了一个新变量 `AvgScore`。生成的\
  \ `DATA` 数据集包含了来自 `OLD` 数组（`wj -- ttr`）和 `NEW` 数组（`Song1 - Song5`）的变量：\n\n| | City\
  \ | Age | wj | kt | tr | filp | ttr | Song1 | Song2 | Song3 | Song4 | Song5 | i\
  \ | AvgScore |\n| :--- | :--- | :--- | :--- | :--- | :--- | :--- | :--- | :--- |\
  \ :--- | :--- | :--- | :--- | :--- | :--- |\n| 1 | Albany | 54 | 3 | 9 | 4 | 4 |\
  \ 9 | 3 | . | 4 | 4 | . | 6 | 3.66667 |\n| 2 | Richmond | 33 | 2 | 9 | 3 | 3 | 3\
  \ | 2 | . | 3 | 3 | 3 | 6 | 2.75000 |\n| 3 | Oakland | 27 | 3 | 9 | 4 | 2 | 3 |\
  \ 3 | . | 4 | 2 | 3 | 6 | 3.00000 |\n| 4 | Richmond | 41 | 3 | 5 | 4 | 5 | 5 | 3\
  \ | 5 | 4 | 5 | 5 | 6 | 4.40000 |\n| 5 | Berkeley | 18 | 4 | 4 | 9 | 3 | 2 | 4 |\
  \ 4 | . | 3 | 2 | 6 | 3.25000 |\n\n### 3.18 使用带有特殊字符的变量名\n传统上，SAS 变量名必须以字母或下划线开头，长度不能超过\
  \ 32 个字符，且不能包含包括空格在内的任何特殊字符。如果你发现这限制太大了，你会高兴地知道，更改 SAS 用于变量名的规则是可能的。\n\n#### VALIDNAME=\
  \ 系统选项\n系统选项 `VALIDNAME=` 控制用于变量名使用哪组规则。如果 `VALIDNAME=` 设置为 `V7`，则变量名必须符合传统规则。如果\
  \ `VALIDNAME=` 设置为 `ANY`，则变量名可以包含空格在内的特殊字符，并可以以任何字符开头。无论哪种情况，变量名必须是 32 个或更少。设置 `VALIDNAME=`\
  \ 系统选项的值有多种方法（参见第 1.7 节）。要查找你的 SAS 会话的默认值，请提交以下代码并读取 SAS 日：\n\n```sas\nPROC OPTIONS\
  \ VALIDNAME;\n```\n\n为你的 SAS 会话设置变量命名规则，请使用 `OPTIONS` 语句：\n\n```sas\nOPTIONS VALIDNAME\
  \ = value;\n```\n其中 `value` 为 `V7` 时使用传统的 SAS 命名规则，为 `ANY` 时使用更宽松的规则。\n\n#### 名称字量（Name\
  \ Literals）\n如果你使用 `ANY` 规则，并且变量名包含空格或特殊字符，那么你必须在程序中使用名称字量形式的变量名。只需将名称包含在引号并在后跟字母\
  \ `N` 即可：\n\n`variable-name'N`\n\n### 示例\n以下制表符分隔的文件包含关于设备的信息：项目名称、产地、在线价格和商店价格。注意某些表头包含空格或特殊字符。\n\
  \n| 项目名称 | 产地 | 在线价格 | 商店价格 |\n| :--- | :--- | :--- | :--- |\n| 三人帐篷 | 中国 | 308\
  \ | 359 |\n| 8 人帐篷 | 美国 | 399 | 399 |\n| 营地包 | 美国 | 119 | 129 |\n| 睡袋 | 中国 | 449\
  \ | 469 |\n| 豪华睡袋 | 加拿 | 169 | 179 |\n| 轻量睡垫 | 美国 | 69 | 74 |\n\n以下程序将 `VALIDNAME=`\
  \ 设置为 `ANY` 并使用 `PROC IMPORT` 读取文件。然后在 `DATA` 步中，它使用名称字量通过 `IF` 语句筛选数据，并创建一个计算商店价格差的新变量。\n\
  \n```sas\n*使用 ANY 规则读取变量名;\nOPTIONS VALIDNAME = ANY;\nPROC IMPORT DATAFILE = 'c:\\\
  MyData\\CampEquip.txt' \n    OUT = campeipment_any;\nRUN;\n\nDATA campeipment_any;\n\
  \    SET campeipment_any;\n    IF 'Country of Origin'N = 'USA';\n    PriceDiff =\
  \ 'Store$'N - 'Online$'N;\nRUN;\n```\n\n这是 `CAMPEQUIPMENT_ANY` 数据集。注意变量名中的空格和特殊字符。\n\
  \n| 项目名称 | 产地 | 在线价格 | 商店价格 | PriceDiff |\n| :--- | :--- | :--- | :--- | :--- |\n\
  | 三人帐篷 | 中国 | 308 | 359 | 51 |\n| 8 人帐篷 | 美国 | 399 | 399 | 0 |\n| 营地包 | 美国 | 119\
  \ | 129 | 10 |\n| 睡袋 | 中国 | 449 | 469 | 20 |\n| 豪华睡袋 | 加拿 | 169 | 179 | 10 |\n|\
  \ 轻量睡垫 | 美国 | 69 | 74 | 5 |\n\n如果你决定不使用名称字量，可以考虑重命名变量以符合 `V7` 规则。你可以使用 `RENAME`\
  \ 数据集选项。（参见第 6.10 节。）\n\n另一种选项是在创建数据集时使用 `V7` 命名规则。如果启用 `V7` 规则，`PROC IMPORT` 在创建变量名时会将表头的空格和特殊字符转换为下划线。以下程序与第一个程序类似，仅将\
  \ `VALIDNAME=` 设置为 `V7`。注意现在变量名不再包含空格和特殊字符，而是包含下划线，不需要名称字量。\n\n```sas\n*使用 V7 规则读取变量名;\n\
  OPTIONS VALIDNAME = V7;\nPROC IMPORT DATAFILE = 'c:\\LSB6\\Data\\CampEquip.txt'\
  \ \n    OUT = CampEquipment_V7 REPLACE;\nRUN;\n\nDATA CampEquipment_V7;\n    SET\
  \ CampEquipment_V7;\n    IF Country_of_Origin = 'USA';\n    PriceDiff = Store_ -\
  \ Online_;\nRUN;\n```\n\n这是 `CAMPEQUIPMENT_V7` 数据集。\n\n| Item | Country_of_Origin\
  \ | Online_ | Store_ | PriceDiff |\n| :--- | :--- | :--- | :--- | :--- |\n| 8 Person\
  \ Cabin Tent | USA | 399 | 399 | 0 |\n| Camp Bag | USA | 119 | 129 | 10 |\n| Ultra-light\
  \ Pad | USA | 69 | 74 | 5 |\n\n\n\n\n\n如果您正在读取数据文件（通过 `PROC IMPORT` 或 `XLSX LIBNAME`\
  \ 引擎），且文件中包含空格或特殊字符的标题，我们建议您始终在 `OPTIONS` 语句中指定您想要使用的 `VALIDVARNAME=` 规则。这样，无论您的系统上\
  \ `VALIDVARNAME=` 的默认值是什么，您的程序都能正常运行。\n\n> “偶尔，简单的事情也会直接运行良好。”\nPHIL GALLAGHER\n\
  \n摘自 SAS L 列表，1994 年。经作者许可转印。\n\n# 第 4 章：数据的数据的排序、打印和汇总\n\n## 4.1 使用 SAS 过程\n##\
  \ 4.2 使用 WHERE 语句在过程中进行子集划分\n## 4.3 使用 PROC SORT 排序数据\n## 4.4 更改字符数据的排序顺序\n## 4.5\
  \ 使用 PROC PRINT 打印数据\n## 4.6 使用格式更改数据值的显示外观\n## 4.7 常用标准格式\n## 4.8 使用 PROC FORMAT\
  \ 创建自定义格式\n## 4.9 将报告写入文本文件\n## 4.10 使用 PROC MEANS 汇总数据\n## 4.11 将汇总统计数据写入 SAS 数据集\n\
  ## 4.12 使用 PROC FREQ 生成单向频率\n## 4.13 使用 PROC FREQ 生成交叉表\n## 4.14 使用自定义格式对数据进行分组\n\
  ## 4.15 使用 PROC TABULATE 生成表格报告\n## 4.16 在 PROC TABULATE 输出中添加统计数据\n## 4.17 增强 PROC\
  \ TABULATE 输出的外\n## 4.18 更改 PROC TABULATE 输出中的表头\n## 4.19 使用 PROC REPORT 生成简单输出\n\
  ## 4.20 在 PROC REPORT 中使用 DEFINE 语句\n## 4.21 使用 PROC REPORT 创建摘要\n## 4.22 在 PROC\
  \ REPORT 输出中添加汇总中断\n## 4.23 在 PROC REPORT 输出中添加统计数据\n## 4.24 在 PROC REPORT 输出中添加计算变量\n\
  \n## 4.1 使用 SAS 过程\n\n![image](img/f0094-01.jpg)\n\n使用过程（也称为 `PROC`）就像填写表格。其他人设计了该表格，您只需要填写空白处并从选项列表中进行选择。每个\
  \ `PROC` 都有其独特的表格和相应的选项列表。虽然每个过程都是唯一的，但它们之间也有相似之处。本节将讨论其中一些相似之处。\n\n所有过程都有必需的语句，大多数过程都有可选语句。例如，`PROC\
  \ PRINT` 中唯一必需的语句是 `PROC` 语句：\n\n```\nPROC PRINT;\n```\n\n然而，通过添加可选语句，您可以让此过程变得长几十行甚至更长。\n\
  \n`PROC` 语句：所有过程都以关键字 `PROC` 开头，后面跟着过程名称，例如 `PRINT` 或 `CONTENTS`。如果有选项，则跟在过程名称之后。`DATA=`\
  \ 选项告诉 SAS 使用哪个数据集作为该过程的输入。`DATA=` 选项显然是可选的。如果您跳过它，则 SAS 将使用最近创建的数据集，这并不一定与最近使用的数据集相同。有时，直接指定您需要的数据集比推测\
  \ SAS 默认将使用哪个数据集要容易得多。在这种情况下，SAS 将使用一个名为 `BANANA` 的临时 SAS 数据集：\n\n```\nPROC CONTENTS\
  \ DATA = banana;\n```\n\n若要使用持久性 SAS 数据集，请在数据集名称前添加 `libref`。在这种情况下，SAS 将使用存储在名为\
  \ `TROPICAL` 的 SAS 数据库中名为 `BANANA` 的数据集：\n\n```\nPROC CONTENTS DATA = tropical.banana;\n\
  ```\n\n您也可以通过在引号之间放置操作系统环境中的名称直接引用持久性 SAS 数据集。\n\n```\nPROC CONTENTS DATA = 'c:\\\
  MySASLib\\banana';\n```\n\n`BY` 语句：`BY` 语句仅适用于 `PROC SORT` 需要。在 `PROC SORT` 中，`BY`\
  \ 语句告诉 SAS 如何排列观测值。在所有其他过程中，`BY` 语句都是可选的，它告诉 SAS 对每个值组合单独分析，而不是将所有观测视为整体。例如，此语句告诉\
  \ SAS 为每个州运行单独分析：\n\n```\nBY State;\n```\n\n`TITLE` 和 `FOOTNOTE` 语句：`TITLE` 语句指定过程顶部的标题。`FOOTNOTE`\
  \ 的原理相同，但打印在页面底部。这些全局语句在技术上不属于任何步骤。您可以将它们放在程序的任何位置，但由于它们适用于该过程，因此通常将它们与过程放在一起是有意义的。最基本的\
  \ `TITLE` 语句由关键字 `TITLE` 加上用引号括起来的标题组成。\n\n```\nTITLE 'This is a title';\n```\n\n\
  如果您发现标题中包含单引号，请在标题周围使用双引号，或者将单引号替换为两个连续单引号：\n\n```\nTITLE \"Here's another title\"\
  ;\n```\n```\nTITLE 'Here''s another title';\n```\n\n您可以通过向 `TITLE` 和 `FOOTNOTE`\
  \ 添加数字来指定最多十个标题或脚注：\n\n```\nFOOTNOTE3 'This is the third footnote';\n```\n\n当您指定新的标题或脚注时，它将用相同数字替换旧的标题或脚注，并取消编号更大的那些。例如，新的\
  \ `TITLE2` 会取消现有的 `TITLE3`（如果存在）。标题和脚注将一直有效，直到您用新的内容替换它们或使用空语句将其取消。下述空语句将取消所有标题：\n\
  \n```\nTITLE;\n```\n\n`LABEL` 语句：有时变量名并不符合您的要求。在这种情况下，您可以使用 `LABEL` 语句为每个变量创建描述性标签，长度可达\
  \ 256 个字符。此语句为变量 `ReceiveDate` 和 `ShipDate` 创建标签：\n\n```\nLABEL ReceiveDate = 'Date\
  \ order was received' ShipDate = 'Date merchandise was shipped';\n```\n\n如果您在 `DATA`\
  \ 步骤中放置 `LABEL` 语句，标签将随数据保存；但如果您在 `PROC` 中放置 `LABEL` 语句，则这些标签仅适用于该特定步骤。\n\n自定义输出：您对过程产生的输出有大量的控制权。使用系统选项，您可以设置许多功能，如居中、日期和纸张方向（参见第\
  \ 1.7 节）。通过输出交付系统（ODS），您还可以更改输出的整体样式，以 PDF 或 RTF 等格式生成输出，或更改输出的特定属性如字体或颜色（参见第 5\
  \ 章）。\n\n输出数据集：大多数过程都会生成某种类型的报告，但有时您可能希望将过程的结果保存为 SAS 数据集以便进行进一步分析。您可以使用 `ODS OUTPUT`\
  \ 语句从任何过程输出创建 SAS 数据集（第 5.13 节）。某些过程还可以通过 `OUTPUT` 语句或 `OUT=` 选项写入 SAS 数据集。\n\n\n\
  \n\n\n对于读取 SAS 数据集的 `PROC`，一个可选的语句是 `WHERE` 语句。`WHERE` 语句告诉过程使用数据的一个子集。正如你可能记得的，还有其他划分数据的方法，因此你可以在不使用\
  \ `WHERE` 语句的情况下完成工作。然而，`WHERE` 语句是一种快捷方法。虽然子集 `IF` 语句只在 `DATA` 步中有效，但 `WHERE` 语句在\
  \ `PROC` 步中同样有效。\n\n与 `DATA` 步中的子集处理不同，在过程中使用 `WHERE` 语句不会创建新的数据集。这就是为什么 `WHERE`\
  \ 语句有时比其他划分数据的方法更有效率的原因之一。（`WHERE=` 数据集选项与 `WHERE` 语句相似。更多信息请参见第 6.12 节。）\n\n`WHERE`\
  \ 语句的基本形式为：\n\n```\nWHERE condition;\n```\n\n`PROC` 将仅使用符合条件的观测值。这看起来可能很眼熟，因为它与子集\
  \ `IF` 相似。条件的左侧是变量名，右侧是变量名、常量或数学表达式。数学表达式可以包含标准的算术符号：加法 (`+`)、减法 (`-`)、乘法 (`*`)、除法\
  \ (`/`) 和幂 (`**`)。在表达式的两侧之间，你可以使用比较运算符逻辑运算符；这些运算符可以是符号性的或助性的：\n\n| 符号 | 助记 | 示例\
  \ |\n| :--- | :--- | :--- |\n| = | EQ | `WHERE Region = 'Spain';` |\n| ¬=, ~=, ^=\
  \ | NE | `WHERE Region ~= 'Spain';` |\n| > | GT | `WHERE Rainfall > 20;` |\n| <\
  \ | LT | `WHERE Rainfall < AvgRain;` |\n| >= | GE | `WHERE Rainfall >= AvgRain +\
  \ 5;` |\n| <= | LE | `WHERE Rainfall <= AvgRain / 1.25;` |\n| & | AND | `WHERE Rainfall\
  \ > 20 AND Temp < 90;` |\n| \\|, ¦, ! | OR | `WHERE Rainfall > 20 OR Temp < 90;`\
  \ |\n| | IS MISSING | `WHERE Region IS MISSING;` |\n| | IS NOT MISSING | `WHERE\
  \ Region IS NOT MISSING;` |\n| | BETWEEN AND | `WHERE Region BETWEEN 'Plain' AND\
  \ 'Spain';` |\n| ? | CONTAINS | `WHERE Region CONTAINS 'ain';` |\n| =* | | `WHERE\
  \ Region =* 'Spane';` |\n| | LIKE | `WHERE Region LIKE 'Sp%n';` |\n| | IN (list)\
  \ | `WHERE Region IN ('Rain', 'Spain', 'Plain');` |\n\n谐音运算符 `=*` 使用 `Soundex` 算法选择数据值在英语中音相似的观测值（例如\
  \ `Spain` 和 `Spane`）。`LIKE` 运算符选择匹配特定模式的观测值，其中百分号 (`%`) 作为充通配符，对应任意数量的字符。\n\n###\
  \ 示例 以下的逗号分隔值数据包含有关知名画家的信息。对于每位艺术家，数据都包含了画家的名字、主要风格和国籍：\n\n```\nName,Genre,Nationality\n\
  Mary Cassatt,Impressionism,U\nPaul Cezanne,Post-impressionism,F\nSalvador Dali,Surrealism,S\n\
  Henri Matisse,Post-impressionism,F\nClaude Monet,Impressionism,F\nBerthe Morisot,Impressionism,F\n\
  Pablo Picasso,Surrealism,S\nJackson Pollock,Abstract expressionism,U\nPierre Auguste\
  \ Renoir,Impressionism,F\nVincent van Gogh,Post-impressionism,N\n```\n\n假设你想得到一个印象派画家的列表。实现此点的快速简便方法是使用\
  \ `PROC PRINT` 和 `WHERE` 语句。在以下程序中，`PROC IMPORT` 从名为 `Artists.csv` 的文件读取数据，并使用 `LIBNAME`\
  \ 语句在名为 `MySASLib` 的目录下创建一个名为 `STYLE` 的永久 SAS 数据集。然后在 `PROC PRINT` 中，`WHERE` 语句仅选择印象派画家，`FOOTNOTE`\
  \ 语句解释了 `Nationality` 的代码。\n\n```sas\n* 艺术家的 CSV 文件;\nLIBNAME art 'c:\\MySASLib';\n\
  PROC IMPORT DATAFILE = 'c:\\MyRawData\\Artists.csv' OUT = art.style REPLACE;\nRUN;\n\
  \n* 打印印象派画家列表;\nPROC PRINT DATA = art.style;\n   WHERE Genre = 'Impressionism';\n\
  \   TITLE 'Impressionist Painters';\n   FOOTNOTE 'F = France U = USA';\nRUN;\n```\n\
  \n结果如下。请注意，由于数据在 `PROC PRINT` 中被划分，`Obs` 列中的数字反映了原始数据集中观测值的顺序。如果你不喜欢那样，可以告诉 SAS\
  \ 不要打印 `Obs` 列。（参见第 4.5 节。）\n\n**Impressionist Painters**\n\n| Obs | Name | Genre\
  \ | Nationality |\n| --- | :--- | :--- | :--- |\n| 1 | Mary Cassatt | Impressionism\
  \ | U |\n| 5 | Claude Monet | Impressionism | F |\n| 6 | Berthe Morisot | Impressionism\
  \ | F |\n| 9 | Pierre Auguste Renoir | Impressionism | F |\n\nF = France U = USA\n\
  \n### 4.3 使用 PROC SORT 排序你的数据\n\n![image](img/f0098-01.jpg)\n\n对数据排序有许多原因：为了报告组织数据、在合并数据集之前、或者在\
  \ `DATA` 步中使用 `BY` 语句之前。幸运的是，`PROC SORT` 非常简单。该过程的基本形式为：\n\n```sas\nPROC SORT;\n\
  \   BY variable-list;\n```\n\n在 `BY` 语句中的变量被称为 `BY` 变量。你可以指定任意多个 `BY` 变量。对于单个变量，SAS\
  \ 根据该变量进行排序。如果有多个变量，SAS 先按第一个变量排序，然后是第二个，依此类推。\n\n`DATA=` 和 `OUT=` 选项指定输入和输出数据集。如果不指定\
  \ `DATA=` 选项，SAS 将使用最近创建的数据集。如果不指定 `OUT=` 选项，SAS 将用新排序的版本替换原始数据集。\n\n```sas\nPROC\
  \ SORT DATA = messy OUT = neat;\n```\n\n`NODUPKEY` 选项删除了 `BY` 变量具有重复值的观测值。如果你想消除所有变量相同的观测值，你需要在\
  \ `BY` 语句中包含所有变量。`DUPOUT=` 选项告诉 SAS 将被删除的观测值放在该数据集中。\n\n```sas\nPROC SORT;\n;\n\
  ```\n\n升序与降序：默认情况下，SAS 按升序排序数据，从低到高。要以相反顺序排序数据，在每个需要反向排序的变量 `BY` 语句之前添加 `DESCENDING`\
  \ 关键字。此语句告诉 SAS 先按 `Country`（从 A 到 Z）排序，然后在每个 `Country` 内部按 `City`（从 Z 到 A）排序：\n\
  \n```sas\nBY Country DESCENDING City;\n```\n\n示例 以下数据显示了鲸鱼和鲨鱼的长度（英）。注意每行都包含多个动物的数据。\n\
  \n```\nbeluga whale 15\ndwarf shark 30\nhumpback .50\nsperm whale 60\nbasking shark\
  \ 40\ngray whale 50\nmako shark 12\nwhale 40\nblue whale 90\n```\n\n在以下程序中，`DATA`\
  \ 步读取名为 `Lengths.dat` 的原始数据文件并创建一个名为 `MARINE` 的 数据集。然后 `PROC SORT` 根据 `Family` 和\
  \ `Name` 对观测值排序。\n\n```sas\nDATA marine;\n   INFILE 'c:\\MyRawData\\Lengths.dat';\n\
  \   INPUT Name $ Family $ Length @@;\nRUN;\n\n* 排序数据并去重;\nPROC SORT DATA = marine\
  \ OUT = seasort NODUPKEY;\n   BY Family Name;\nRUN;\n\n* 打印排序后的数据;\nPROC PRINT DATA\
  \ = seasort;\n   TITLE 'Whales and Sharks';\nRUN;\n```\n\n`OUT=` 选项将排序后的数据写入名为 `SEASORT`\
  \ 的新数据集。`NODUPKEY` 选项删除了 `BY` 变量重复值的观测值。日志包含这些注释，显示排序后的数据集比原始数据集少两个观测值。\n\nNOTE:\
  \ 从数据集 WORK.MARINE 读取了 12 个观测值。\n\nNOTE: 2 个具有重复键值的观测值已被删除。\n\n\n\n\n\n注意：数据集 `WORK.SEASORT`\
  \ 包含 10 个观测值和 3 个变量。\n\n`PROC PRINT` 的输出如下：\n\n鲸鱼和鲨鱼\n\n| Obs | Name | Family |\
  \ Length |\n| --- | --- | --- | --- |\n| 1 | humpback | | 50.0 |\n| 2 | basking\
  \ | shark | 30.0 |\n| 3 | dwarf | shark | 0.5 |\n| 4 | mako | shark | 12.0 |\n|\
  \ 5 | whale | shark | 40.0 |\n| 6 | beluga | whale | 15.0 |\n| 7 | blue | whale\
  \ | 100.0 |\n| 8 | gray | whale | 50.0 |\n| 9 | killer | whale | 30.0 |\n| 10 |\
  \ sperm | whale | 60.0 |\n\n注意，大尾鲸的 `Family` 值为缺失，因此变成了观测值 1。这是因为对于数值型和字符变量，缺失值总是最低的。此外，`NODUPKEY`\
  \ 选项除了两个重复观测值，一个是鲸鲨，另一个是蓝鲸。由于 `BY` 变量是 `Family` 和 `Name`，SAS 忽略了 `Length` 变量，仅保留了每个\
  \ `Family` 和 `Name` 组合的第一观测值。\n\n## 4.4 更改字符数据的排序顺序\n\n初看之下，字符数据的排序似乎非常简单。毕竟，大家都知道\
  \ \"A\" 在 \"B\" 之前。然而，“A\" 是否在 \"a\" 之前就并不明显。SAS 提供了许多选项来控制字符数据的排序顺序（也称为排序序列）。本节描述了其中一些。\n\
  \n### ASCII 与 EBCDIC\nz/OS 操作环境的默认排序序是 EBCDIC。大多数其他操作环境的默认排序序是 ASCII。从低到高，字符数据的基本排序顺序为：\n\
  \n| ASCII | blank | numerals | uppercase letters | lowercase letters |\n| EBCDIC\
  \ | blank | lowercase letters | uppercase letters | numerals |\n\n如果你只在一个操作环境中工作，这对你来说可能并不重要。但是，如果你需要在\
  \ Windows 上创建一个将在 z/OS 上使用的数据集，反之亦然，那么你可能希望数据按照该环境预期的顺序进行排序。你可以使用选项 `SORTSEQ=EBCDIC`\
  \ 或 `SORTSEQ=ASCII` 来更改排序顺序：\n\n```\nPROC SORT SORTSEQ = EBCDIC;\n```\n\n`SORTSEQ=`\
  \ 选项的其他可能值包括 DANISH、FINNISH、ITALIAN、NORWEGIAN、POLISH、SPANISH 和 SWEDISH。\n\n### 语言类排序\n\
  默认情况下，大写字母和小写字母将分开排序，但这并不是人们通常排序的方式。你可以使用语言排序来产生一个更直观的顺序。`SORTSEQ=LINGUISTIC` 选项配合子选项\
  \ `STRENGTH=PRIMARY` 告诉 SAS 忽略大小写。要使用这些选项，请将它们添加到 `PROC SORT` 语句中：\n\n```sas\nPROC\
  \ SORT SORTSEQ = LINGUISTIC (STRENGTH = PRIMARY);\n```\n\n以下是未排序、按默认 ASCII 顺序排序以及忽略大小写排序的数据：\n\
  \n| Unsorted order | Default Sort | Linguistic Sort (STRENGTH=PRIMARY) |\n| eva\
  \ | ANNA | amanda |\n| amanda | Zenobia | ANNA |\n| Zenobia | amanda | eva |\n|\
  \ ANNA | eva | Zenobia |\n\n当数字作为字符数据排序时，值 \"10\" 会在 \"2\" 之前。`NUMERIC_COLLATION=ON`\
  \ 子选项告诉 SAS 将数字视为其数值等效值。\n\n```sas\nPROC SORT SORTSEQ = LINGUISTIC (NUMERIC_COLLATION\
  \ = ON);\n```\n\n以下是未排序、按默认排序以及使用数值校对排序的数据：\n\n| Unsorted order | Default Sort |\
  \ Linguistic Sort (NUMERIC_COLLATION=ON) |\n| 1500m freestyle | 100m backstroke\
  \ | 50m freestyle |\n| 200m breaststroke | 1500m freestyle | 100m backstroke |\n\
  | 100m backstroke | 200m breaststroke | 200m breaststroke |\n| 50m freestyle | 50m\
  \ freestyle | 1500m freestyle |\n\n### 示例\n以下数据包含姓名和地址：\n\nName   Street       \
  \   City        State\nSeiki  100 A St.      Anchorage  Alaska\nWong   2 A St. \
  \         honolulu    Hawaii\nShaw   10 A St. Apt. 10   juneau  Alaska\nSmith  10\
  \ A St. Apt. 2   Honolulu    Hawaii\nLee    100 A St.      Honolulu    hawaii\n\
  Jones  10 A St. Apt. 22   Juneau  alaska\n\n此程序导入制表符分隔的文件。然后按变量 `State`、`City` 和\
  \ `Street` 对数据进行排序，忽略大小写并使用数值排序。\n\n```sas\nPROC IMPORT DATAFILE = 'c:\\MyRawData\\\
  Mail.txt' OUT = addresses REPLACE;\nRUN;\n\n* 使用语言类排序和数值校对对地址排序;\nPROC SORT DATA\
  \ = addresses OUT = sortout\n      SORTSEQ = LINGUISTIC (STRENGTH = PRIMARY NUMERIC_COLLATION\
  \ = ON);\n    BY State City Street;\nRUN;\n\n* 打印语言类排序的数据;\nPROC PRINT DATA = sortout;\n\
  \    TITLE 'Addresses Sorted by State, City, and Street';\nRUN;\n```\n\n以下是结果：\n\
  \n按州、城市和街道排序的地址\n\n| Obs | Name | Street | City | State |\n| --- | --- | --- | ---\
  \ | --- |\n| 1 | Seiki | 100 A St. | Anchorage | Alaska |\n| 2 | Shaw | 10 A St.\
  \ Apt. 10 | juneau | Alaska |\n| 3 | Jones | 10 A St. Apt. 22 | Juneau | alaska\
  \ |\n| 4 | Wong | 2 A St. | honolulu | Hawaii |\n| 5 | Smith | 10 A St. Apt. 2 |\
  \ Honolulu | Hawaii |\n| 6 | Lee | 100 A St. | Honolulu | hawaii |\n\n## 4.5 使用\
  \ PROC PRINT 打印你的数据\n\n`PRINT` 过程可能是最常用的 SAS 过程。在最简单的形式下，`PROC PRINT` 输出 SAS 数据集中所有观测值的所有变量的值。SAS\
  \ 决定格式输出的最佳方式，因此你不需要担心一个页面能容纳多少变量等问题。但 `PROC PRINT` 还有你可能想要的功能。\n\n`PRINT` 过程以关键字\
  \ `PROC PRINT` 开始，后跟选项：\n\n```sas\nPROC PRINT *options*;\n```\n\n我们建议在程序中始终使用 `DATA=`\
  \ 选项以保持清晰。默认情况下，SAS 会打印观测值。如果你不需要观测值，请使用 `NOOBS` 选项。如果你使用 `LABEL` 语句定义变量标签，并希望打印标签而不是变量名，请添加\
  \ `LABEL` 选项。以下语句显示了这些选项：\n\n```sas\nPROC PRINT DATA = data-set NOOBS LABEL;\n```\n\
  \n以下是有时的可选语句：\n\n| BY variable-list | `BY` 语句为每个 `BY` 变量的值开启新章节，并在章节顶部打印 `BY` 变量的值。数据必须按\
  \ `BY` 变量预排序。 |\n| ID variable-list | 使用 `ID` 语句时不打印观测值。相反，`ID` 变量列表中的变量出现在页面左侧。\
  \ |\n| SUM variable-list | `SUM` 语句打印变量的和。 |\n| VAR variable-list | `VAR` 语句指定打印哪些变量及其顺序。如果没有\
  \ `VAR` 语句，将按照数据集中出现的顺序打印 SAS 数据中的所有变量。 |\n\n示例 两个四年级班的学生通过卖饼来为特别远足筹资金。以下是卖饼的数据。学生姓名后面是班级、交钱日期、饼干类型（薄荷饼或恐龙饼）以及销售盒数。注意每行数据包含两个学生的信息：\n\
  \n```text\nAdriana 21 3/21/2020 MP  7 Nathan 14 3/21/2020 CD 19\nMatthew  1 3/21/2020\
  \ CD 14 Claire 14 3/22/2020 CD 11\nIan      21 3/24/2020 MP 18 Chris  14 3/25/2020\
  \ CD 6\nAnthony 21 3/25/2020 MP 13 Erika  21 3/25/2020 MP 17\n```\n\n\n\n\n每卖出一盒饼干，班级就能获得\
  \ 2.50 美元。老师们想要一份报告，显示每个班获得的金额、每个学生获得的金额、销售的饼干类型以及学生交还钱的日期。以下程序读取数据，创建一个名为 `SALES`\
  \ 的永久 SAS 数据集，并计算收入（`Profit`）。然后 `PROC SORT` 按班对数据进行排序，并创建一个名为 `SALESSORT` 的临时数据集。`PROC\
  \ PRINT` 使用 `BY` 语句按 `Class` 打印数据，并使用 `SUM` 语句给出 `Profit` 的总量。`VAR` 语句列出了要打印的变量。\n\
  \n```sas\nLIBNAME class 'c:\\MySASLib';\n\nDATA class.sales;\n   INFILE 'c:\\MyRawData\\\
  CookieSales.dat';\n   INPUT Name $ Class DateReturned MMDDYY10\\. CookieType $ Quantity\
  \ @@;\n   Profit = Quantity * 2.5;\nRUN;\n\nPROC SORT DATA = class.sales OUT = salort;\n\
  \   BY Class;\nRUN;\n\nPROC PRINT DATA = salessort;\n   BY Class;\n   SUM Profit;\n\
  \   VAR Name DateReturned CookieType Profit;\n   TITLE 'Cookie Sales for Field Trip\
  \ by Class';\nRUN;\n```\n\n这里是结果。注意变量 `DateReturned` 的值是以 SAS 日期值的格式打印的。你可以使用下一节中介绍的格式（formats）来以可读的形式打印日期。\n\
  \n### 班级野外活动饼干销售\n\n### Class=14\n\n| **Obs** | **Name** | **DateReturned** | **CookieType**\
  \ | **Profit** |\n| --- | --- | --- | --- | --- |\n| **1** | Nathan | 21995 | CD\
  \ | 47.5 |\n| **2** | Matthew | 21995 | CD | 35.0 |\n| **3** | Claire | 21996 |\
  \ CD | 27.5 |\n| **4** | Chris | 21999 | CD | 15.0 |\n| **Class** | | | | **125.0**\
  \ |\n\n### Class=21\n\n| **Obs** | **Name** | **DateReturned** | **CookieType**\
  \ | **Profit** |\n| --- | --- | --- | --- | --- |\n| **5** | Adriana | 21995 | MP\
  \ | 17.5 |\n| **6** | Ian | 21998 | MP | 45.0 |\n| **7** | Anthony | 21999 | MP\
  \ | 32.5 |\n| **8** | Erika | 21999 | MP | 42.5 |\n| **Class** | | | | **137.5**\
  \ |\n| | | | | **262.5** |\n\n## 4.6 使用格式更改数据值的显示\n\n![image](img/f0104-01.jpg)\n\
  \n当 SAS 显示你的数据时，它会决定哪种格式最好——显示多少位小数、为每个值留出多少空间等。这非常方便并让你的工作变得简单得多，但 SAS 并不总是按照你的意这样做。幸运的是，你并不受限于\
  \ SAS 认为最好的格式。你可以使用 SAS 格式来更改数据值的显示。\n\nSAS 有许多针对字符、数值和日期值的格式。例如，你可以使用 `COMMAw.d`\
  \ 格式打印带有逗号的数字，使用 `$w.` 格式控制打印的字符数，使用 `MMDDYYw.` 格式将 SAS 日期值（自 1960 年 1 月 1 日以来的天数）以\
  \ `12/03/2023` 等可读形式打印。如果你喜欢，甚至可以使用更晦涩的格式（如十六进制、区域小数和压缩小数）来打印数据。使用 `FORMAT` 过程，你还可以创建自己的格式（第\
  \ 4.8 节）。\n\nSAS 格式的通用形式为：\n\n| 字符 | 数值 | 日期 |\n| --- | --- | --- |\n| `$formatw.`\
  \ | `formatw.d` | `formatw.` |\n\n其中 `$` 表示字符格式，`format` 是格式名称，`w` 是包括任何小数点在内的总宽度，`d`\
  \ 是小数位数。\n\n### FORMAT 语句\n你可以在 `FORMAT` 语句中将格式与变量关联联。`FORMAT` 语句以关键字 `FORMAT` 开始，后面跟着变量名（如果有多个变量要关联相同的格式，则跟随多个名称），然后是格式。例如，以下\
  \ `FORMAT` 语句将 `DOLLAR8.2` 格式与变量 `Profit` 和 `Loss` 关联，并将 `MMDDYY8.` 格式与变量 `SaleDate`\
  \ 关联：\n\n```sas\nFORMAT Profit Loss DOLLAR8.2 SaleDate MMDDYY8.;\n```\n\n`FORMAT`\
  \ 语句可以出现在 `DATA` 步或 `PROC` 步中。如果 `FORMAT` 语句位于 `DATA` 中，则格式关联是永久的，并存储在 SAS 数据集中。如果\
  \ `FORMAT` 语句位于 `PROC` 中，则它是临时的——只影响该过程的结果。\n\n### 示例\n在上一节中，使用 `PRINT` 过程打印了四年级饼干销售的结果。学生的姓名与他们交钱的日期、销售的饼干类型以及利润一起打印出来。你可能注意到打印的日期是如\
  \ `21995` 和 `21999` 这样的数字。在 `PRINT` 过程中使用 `FORMAT` 语句，我们可以以可读的形式打印日期。同时，我们可以使用 `DOLLAR6.2`\
  \ 格式打印变量 `Profit`，以便美元符号出现在数字之前。此示例使用了永久 SAS 数据集。数据是学生的姓名，随后是他们所在的班级、交钱的日期、销售的饼干类型（薄荷或巧克力恐龙形）、销售的盒数以及利润：\n\
  \n| Name | DateReturned | CookieType | Quantity | Profit |\n| --- | --- | --- |\
  \ --- | --- |\n| Adriana | 21995 | MP | 7 | 17.5 |\n| Nathan | 21995 | CD | 9 |\
  \ 47.5 |\n| Matthew | 21995 | CD | 4 | 35.0 |\n| Claire | 21996 | CD | 1 | 27.5\
  \ |\n| Ian | 21998 | MP | 8 | 45.0 |\n| Chris | 21999 | CD | 6 | 15.0 |\n| Anthony\
  \ | 21999 | MP | 13 | 32.5 |\n| Erika | 21999 | MP | 17 | 42.5 |\n\n以下程序使用了永久 SAS\
  \ 数据集。`FORMAT` 语句在 `PRINT` 过程中将 `DATE9.` 格式与 `DateReturned` 关联，并将 `DOLLAR6.2` 格式与变量\
  \ `Profit` 关联：\n\n```sas\nLIBNAME class 'c:\\MySASLib';\n\nDATA class.sales;\n \
  \  INFILE 'c:\\MyRawData\\CookieSales.dat';\n   INPUT Name $ Class DateReturned\
  \ MMDDYY10\\. CookieType $ Quantity @@;\n   Profit = Quantity * 2.5;\nRUN;\n\nPROC\
  \ SORT DATA = class.sales OUT = salessort;\n   BY Class;\nRUN;\n\nPROC PRINT DATA\
  \ = salessort;\n   BY Class;\n   SUM Profit;\n   VAR Name DateReturned CookieType\
  \ Profit;\n   TITLE 'Cookie Sales for Field Trip by Class';\nRUN;\n```\n\n这里是带有格式的\
  \ `DateReturned` 和 `Profit` 结果：\n\n| Obs | Name | DateReturned | CookieType |\n\
  | --- | --- | --- | --- |\n| 1 | Adriana | 01MAR95 | MP |\n| 2 | Nathan | 01MAR95\
  \ | CD |\n| 3 | Matthew | 01MAR95 | CD |\n| 4 | Claire | 02MAR96 | CD |\n| 5 | Ian\
  \ | 04MAR98 | MP |\n| 6 | Chris | 05MAR99 | CD |\n| 7 | Anthony | 05MAR99 | MP |\n\
  | 8 | Erika | 05MAR99 | MP |\n\n## 4.7 选定的格式\n\n| 格式 | 定义 | 宽度范围 | 默认宽度 |\n| ---\
  \ | --- | --- | --- |\n| **字符** | | | |\n| `$UPCASEw.` | 将字符转换为大写 | 1–3267 | 变量长度或\
  \ 8 |\n| `$w.` | 输出标准字符——不去除导空格（同 `$CHARw.`） | 1–3267 | 变量长度或 1 |\n| **日期、时间和日期时间**\
  \ | | | |\n| `DATEw.` | 以 `ddmmmyy` 或 `ddmmmyyyy` 格式输出 SAS 日期值 | 5–11 | 7 |\n| `DATETIMEw.d`\
  \ | 以 `ddmmmyy:hh:mm:ss.ss` 格式输出 SAS 日期时间 | 7–40 | 16 |\n| `DTDATEw.` | 以 `ddmmmyy`\
  \ 格式输出 SAS 日期 | 5–9 | 7 |\n| `EURDFDDw.` | 以 `dd.mm.yy` 或 `dd.mm.yyyy` 格式输出 SAS\
  \ 日期值 | 2–10 | 8 |\n| `JULIANw.` | 以儒略日期 `yyddd` 或 `yyyyddd` 格式输出 SAS 日期 | 5–7 |\
  \ 5 |\n| `MMDDYYw.` | 以 `mm/dd/yy` 或 `mm/dd/yyyy` 格式输出 SAS 日期值 | 2–10 | 8 |\n| `TIMEw.d`\
  \ | 以 `hh:mm:ss.ss` 格式输出 SAS 时间 | 2–20 | 8 |\n| `WEEKDATEw.` | 以 `day-of-week, month-name\
  \ dd, yy,* 或 `yyyy` 格式输出 SAS 日期 | 3–37 | 29 |\n\n| **数值** | | | |\n\n\n\n\n\n| 格式\
  \ | 说明 | 范围 (w) | 默认 |\n| :--- | :--- | :--- | :--- |\n| `BEST*w.*` | SAS 选择最佳格式——数值数据的默认格式\
  \ | 1–32 | 12 |\n| `COMMA*w.d*` | 使用逗号写入数字 | 1–32 | 6 |\n| `DOLLAR*w.d*` | 以前缀 $\
  \ 且每三位用逗号分隔写入数字 | 2–32 | 6 |\n| `E*w.*` | 使用科学计数法写入数字 | 7–32 | 12 |\n| `EUROX*w.d*`\
  \ | 以前缀 € 且每三位用点分隔写入数字 | 1–32 | 6 |\n| `PERCENT*w.d*` | 将数值数据以百分比形式写入 | 4–32 | 6\
  \ |\n| `*w.d*` | 标准数值数据 | 1–32 | 无 |\n\n^ SAS 日期值自 1960 年 1 月 1 日以来的天数。SAS 时间值自午夜以来的秒数，`datetime`\
  \ 值自 1960 年 1 月 1 日午夜以来的秒数。\n\n| 格式 | 输入数据 | FORMAT 语句 | 结果 |\n| :--- | :--- | :---\
  \ | :--- |\n| **字符** | | | |\n| `$UPCASE*w*` | my cat | `FORMAT Animal $UPCASE6.;`\
  \ | MY CAT |\n| `$*w.*` | my cat my snake | `FORMAT Animal $8.;` | my cat my snak\
  \ |\n| **日期、时间和日期/时间** | | | |\n| `DATE*w.*` | 8966 | `FORMAT Birth DATE7.; FORMAT\
  \ Birth DATE9.;` | 19JUL84 19JUL1984 |\n| `DATETIME*w.*` | 12182 | `FORMAT Start\
  \ DATETIME13.; FORMAT Start DATETIME18.1;` | 01JAN60:03:23 01JAN60:03:23:02.0 |\n\
  | `DTDATE*w.*` | 12182 | `FORMAT Start DTDATE7.; FORMAT Start DTDATE9.;` | 01JAN60\
  \ 01JAN1960 |\n| `EURDFDD*w*` | 8966 | `FORMAT Birth EURDFDD8.; Birth EURDFDD10.;`\
  \ | 19.07.8 19.07.1984 |\n| `JULIAN*w.*` | 8966 | `FORMAT Birth JULIAN5.; Birth\
  \ JULIAN7.;` | 4201 198401 |\n| `MMYY*w.*` | 8966 | `FORMAT Birth MMDYY8.; Birth\
  \ MMDYY6.;` | 7/19/8 07184 |\n| `TIME*w.d*` | 12182 | `FORMAT Start TIME8.; Start\
  \ TIME1.2;` | 3:23:02 3:23:02.0 |\n| `WEEKDATE*w.*` | 8966 | `FORMAT Birth WEEKDATE15.;\
  \ Birth WEEKDATE29.;` | Thu, Jul 19, 84 Thursday 19, 1984 |\n| `WORDDATE*w.*` |\
  \ 8966 | `FORMAT Birth WORDDATE12.; Birth WORDDATE18.;` | Jul 19, 1984 July 19,\
  \ 1984 |\n| **数值** | | | |\n| `BEST*w.*` | 1200001 | `FORMAT Value BEST6.; Value\
  \ BEST8.;` | 1.20E6 1200001 |\n| `COMMA*w.d*` | 1200001 | `FORMAT Value COMMA9.;\
  \ Value COMMA12.2;` | 1,200,001 1,200,001.00 |\n| `DOLLAR*w.d*` | 1200001 | `FORMAT\
  \ Value DOLLAR10.; Value DOLLAR13.2;` | $1,200,001 $1,200,001.00 |\n| `E*w.*` |\
  \ 1200001 | `FORMAT Value E7.;` | 1.2E+06 |\n| `EUROX*w.d*` | 1200001 | `FORMAT\
  \ Value EUROX13.2;` | €1.200.01,0 |\n| `PERCENT*w.d*` | 0.05 | `FORMAT Value9.2;`\
  \ | 5.00% |\n| `*w.d*` | 23.635 | `FORMAT Value 6.3; Value 5.2;` | 23.635 23 |\n\
  \n### 使用 PROC FORMAT 创建您自己的格式\n\n在某个时候，你可能想要创建自己的格式——特别是当你使用大量的编码数据时。假设你刚刚为你的公司完成了一项调查，为了节省磁盘空间和时间，调查的所有的所有回答都经过了编码。例如，`teen`、`adult`\
  \ 和 `senior` 类别被编码为数字 1、2 和 3。\n\n\n\n\n\n| 2 | 成人 | 男性 | $130,000 | 雨云灰 |\n| 3\
  \ | 老年人 | 女性 | $70,000 | 天空蓝 |\n| 4 | 成人 | 男性 | $88,000 | 旭日黄 |\n| 5 | 成人 | 女性 |\
  \ $166,000 | 月光白 |\n\n此示例创建了仅存在于当前作业或会话的临时格式。也可以创建永久格式。（详情请阅 SAS 文档。）格式还可以用于对数据进行分组。（见第\
  \ 4.14 节。）\n\n## 4.9 将报告写入文本文件\n\n`PROC PRINT` 灵活且易用。尽管如此，在某些情况下 `PROC PRINT` 无法满足需求：例如当你提交给政府机构的报告必须像他们的填空表那样对齐，或者当你的客户坚持报告包含完整的句子，又或者你希望每个观测值占页。在这些时候，你可以利用\
  \ `DATA` 步的灵活性来编写文本文件。文本文件虽然简单，但简单性带来了其他文件格式往往无法实现的控制水平。\n\n你可以在 `DATA` 步中以读取数据相同的方式写入数据——只不过方向相反。不是使用\
  \ `INFILE` 语句，而是使用 `FILE` 语句；不是使用 `INPUT` 语句，而是使用 `PUT` 语句。这与在 `DATA` 步中写入原始数据文件（第\
  \ 10.6 节）类似，但为了编写报告，你需要使用 `PRINT` 选项告诉 SAS 包含打印所需的换行符和分页。以下是创建报告的 `FILE` 语句的通用形式：\n\
  \n```\nFILE 'file-specification' PRINT;\n```\n\n与 `INPUT` 语句一样，`PUT` 语句可以是列表、列或格式样式，但由于\
  \ SAS 已经知道变量是数值型还是字符型，你不需要在字符变量后加上 `$`。如果你使用列表格式，SAS 会自动在每个变量之间插入空格。如果你使用列样式或格式化的\
  \ `PUT` 语句，SAS 将把变量放在你指定的任何位置。你可以使用与 `INPUT` 语句相同的指针控制来控制间距：`@n` 移动到第 `n` 列，`+n`\
  \ 移动 `n` 列，`/` 跳到下一行，`#n` 跳到第 `n` 行，`@` 保持当前行。除了打印变量外，你还可以通过引号插入文本字符串。\n\n### 示例\n\
  \n为了展示这与 `PROC PRINT` 的区别，本示例使用了第 4.5 节创建的永久数据集。两个四年级班通过卖饼干来筹集活动经费。数据包括学生的姓名、班级、提交日期、卖出的饼干种类（薄荷味或恐龙味）、数量和利润：\n\
  \n| | 姓名 | 班级 | 日期 | 饼干类型 | 数量 | 利润 |\n| --- | --- | --- | --- | --- | --- | ---\
  \ |\n| 1 | Adriana | 21 | 1995 | MP | 7 | 17.5 |\n| 2 | Nathan | 14 | 1995 | CD\
  \ | 19 | 47.5 |\n| 3 | Matthew | 14 | 1995 | CD | 14 | 35.0 |\n| 4 | Claire | 14\
  \ | 1996 | CD | 11 | 27.5 |\n| 5 | Ian | 21 | 1998 | MP | 18 | 45.0 |\n| 6 | Chris\
  \ | 14 | 1999 | CD | 6 | 15.0 |\n| 7 | Anthony | 21 | 1999 | MP | 13 | 32.5 |\n\
  | 8 | Erika | 21 | 1999 | MP | 17 | 42.5 |\n\n老师们希望每个学生都有一个报告显示他们赚了多少钱。他们希望每个学生的报告单独一页以便发放。最后，他们希望用完整的句子让四年级学生理解。以下是程序：\n\
  \n```sas\n* 使用 FILE 和 PUT 语句编写报告\nLIBNAME class 'c:\\MySASLib';\nDATA _NULL_;\n\
  \    SET class.sales;\n    FILE 'c:\\MyTextFiles\\Student.txt' PRINT;\n    TITLE;\n\
  \    PUT @5 'Cookie sales report for ' Name 'from classroom ' Class\n      / @5\
  \ 'Congratulations!  You sold ' Quantity 'boxes of cookies'\n      / @5 'and earned\
  \ ' Profit DOLLAR6.2 ' for our trip.';\n    PUT _PAGE_;\nRUN;\n```\n\n注意关键字 `_NULL_`\
  \ 出现在 `DATA` 语句而不是数据集名称处。它告诉 SAS 不要费于写入数据集（因为目标是创建文本文件而不是数据集），并使程序运行得更快。`FILE` 语句创建报告的输出文件，`PRINT`\
  \ 选项告诉 SAS 包含换行符和分页。空的 `TITLE` 语句消除任何自动标题。\n\n程序中的第一个 `PUT` 语句以指针 `@5` 开始，告诉 SAS\
  \ 到第 5 列。然后它告诉 SAS 打印“Cookie sales report for”，以及变量 `Name` 的当前值。变量 `Name`、`Class`\
  \ 和 `Quantity` 以列表样式打印，而 `Profit` 使用 `DOLLAR6.2` 格式打印。斜杠指针告诉 SAS 跳到下一行；两个斜杠跳过两行。你可以使用多个\
  \ `PUT` 语句代替斜杠来跳行，因为每当有一个新的 `PUT` 语句时，SAS 都会到新行。`PUT _PAGE_` 语句在每个学生的报告后插入分页符。当程序运行时，日志将包含这些注释：\n\
  \n```\nNOTE: 24 records were written to the file 'c:\\MyRawData\\Student.txt'.\n\
  NOTE: There were 8 observations read from CLASS.SALES.\n```\n\n报告的前三页如下：\n\n```\n\
  \    Cookie sales report for Adriana from classroom 21\n    Congratulations!  You\
  \ sold 7 boxes of cookies\n    and earned $17.50 for our field trip.\n    Cookie\
  \ sales report for Nathan from classroom 14\n    Congratulations!  You sold 19 boxes\
  \ of cookies\n    and earned $47.50 for our field trip.\n    Cookie sales report\
  \ for Matthew from classroom 14\n    Congratulations!  You sold 14 boxes of cookies\n\
  \    and earned $35.00 for our field trip.\n```\n\n## 4.10 使用 PROC MEANS 汇总你的数据\n\
  \n人们在读取并确保数据正确后，想做的第一件事就是查看某些统计数据。平均值、标准差和最大值等统计数据可以让你对数据有一个了解。这类信息还可以提醒你数据中的错误（例如，篮球比赛中得\
  \ 98 分就是可疑的）。`PROC MEANS` 过程为数值变量提供简单的统计数据。\n\n`PROC MEANS` 过程以关键字 `PROC MEANS`\
  \ 开始，后跟选项。某些选项控制如何汇总你的数据：\n\n`PROC MEANS options;`\n\n| MAX_DEC = n | 将值四舍五入 n 位小数\
  \ |\n| MISSING | 将缺失值视为有效 |\n| MAX | 最大值 |\n| MIN | 最小值 |\n| MEAN | 平均值 |\n| MEDIAN\
  \ | 中位数 |\n| MODE | 模式 |\n| N | 非缺失值数量 |\n| NMISS | 缺失值数量 |\n| RANGE | 范围 |\n| STDDEV\
  \ | 标准差 |\n| SUM | 总和 |\n\n如果不指定任何统计数据，SAS 将打印每个变量的非缺失值、平均值、标准差和最大值。`PROC MEANS`\
  \ 的更多选项见第 9.3 节。\n\n以下是一些可选语句：\n\n| BY variable-list | `BY` 语句对每个级别执行单独分析。数据必须先对这些变量进行排序（可以使用\
  \ `PROC SORT` 完成）。 |\n| CLASS variable-list | `CLASS` 语句也对每个级别执行单独分析，但其输出比 `BY`\
  \ 语句更紧凑，且数据不需要先排序。 |\n| VAR variable-list | `VAR` 语句指定分析中使用哪些数值变量。如果缺失，则使用所有数值变量。\
  \ |\n\n示例一家批发苗圃销售花园花卉，他们想按月份汇总销售额。数据包含客户 ID、销售日期以及牵牛草、金骨草和万盏菊的数量：\n\n```\n756-01\
  \ 05/04/2020 120 80 110\n834-01 05/12/2020 90 160 60\n901-02 05/18/2020 50 100 75\n\
  834-01 06/01/2020 80 60 100\n756-01 06/11/2020 100 160 75\n901-02 06/19/2020 60\
  \ 60 60\n756-01 06/25/2020 85 110 100\n```\n\n\n\n\n以下程序从名为 `Flowers.dat` 的文件中读取数据，并创建一个名为\
  \ `PLANTS` 的永久 SAS 数据集。然后，它计算一个新变量 `Month`（即销售月份），并使用 `PROC MEANS` 结合 `CLASS` 语句按\
  \ `Month` 对数据进行汇总。`MAXDEC` 选项被设置为零，因此不会打印任何小数位。\n\n```sas\nLIBNAME garden 'c:\\\
  MySASLib';\n\nDATA garden.plants;\n   INFILE 'c:\\MyRawData\\Flowers.dat';\n   INPUT\
  \ CustID $ @9 SaleDate MMDDYY10\\. Petunia SnapDragon\n         Marigold;\n   Month\
  \ = MONTH(SaleDate);\n   FORMAT SaleDate MMDDYY10;\nRUN;\n\n* 按月份计算花卉销售的平均值;\n\n\
  PROC MEANS DATA = garden.plants MAXDEC = 0;\n   CLASS Month;\n   VAR Petunia SnapDragon\
  \ Marigold;\n   TITLE 'Summary of Flower Sales by Month';\nRUN;\n```\n\n以下是 `PROC\
  \ MEANS` 的结果：\n\n**按月份汇总的花卉销售情况**\n\n| MEANS 过程 | | |\n| :--- | :--- | :--- |\n\
  | Month | N Obs | 变量 | N | 平均值 | 标准差 | 最小值 | 最大值 |\n| --- | --- | --- | --- | ---\
  \ | --- | --- | --- |\n| 5 | 3 | Petunia SnapDragon Marigold | 3 | 3 | 3 | 87 |\
  \ 113 | 82 | 35 | 42 | 26 | 50 | 80 | 60 | 120 | 160 | 110 |\n| 6 | 4 | Petunia\
  \ SnapDragon Marigold | 4 | 4 | 4 | 81 | 98 | 84 | 17 | 48 | 20 | 60 | 60 | 60 |\
  \ 100 | 160 | 100 |\n\n## 4.11 将汇总统计量写入 SAS 数据集\n\n![image](img/f0114-01.jpg)\n\n\
  有时你想将汇总统计量保存到 SAS 数据集中以进行进一步分析，或与其他数据合并。例如，你可能想绘制办公室的每小时温度图，以显示下午如何变热导致你睡着，但你拥有的仪器记录的是每分钟的数据。`MEANS`\
  \ 过程可以通过计算每小时的平均温度来压缩数据，然后将结果保存到 SAS 数据集中以便于绘图。\n\n`PROC MEANS` 中有两种方法可以将汇总统计量保存到\
  \ SAS 数据集中。你可以使用 `OUTPUT` 目标（在第 5.13 节介绍），或者使用 `OUTPUT` 语句。`OUTPUT` 语句的格式如下：\n\n\
  `OUTPUT OUT = data-set output-statistic-list;`\n\n在这里，`data-set` 是包含结果的 SAS 数据集的名称，`output-statistic-list`\
  \ 指定了你需要的统计量以及相关的变量名。你可以有多个 `OUTPUT` 语句和多个输出统计量列表。这是 `output-statistic-list` 的可能形式之一：\n\
  \n`statistic(variable-list) = name-list`\n\n在这里，`statistic` 可以是 `PROC MEANS` 中可用的任何统计量（例如\
  \ `SUM`、`N`、`MEAN`），`variable-list` 指定你想要输出的 `VAR` 语句中的变量，`name-list` 指定新汇总变量的名称。新变量名称的顺序必须与\
  \ `variable-list` 中对应的变量顺序相同。例如，以下 `PROC MEANS` 语句产生一个名为 `ZOOSUM` 的新数据集，其中包含一个观测值，变量为\
  \ `LionWeight`（狮子的重量平均值）和 `BearWeight`（熊的重量平均值）：\n\n```sas\nPROC MEANS DATA = zoo\
  \ NOPRINT;\n   VAR Lions Tigers Bears;\n   OUTPUT OUT = zoosum MEAN(Lions Bears)\
  \ = LionWeight BearWeight;\nRUN;\n```\n\n`PROC MEANS` 语句中的 `NOPRINT` 选项告诉 SAS 不需要产生任何打印结果，因为我们正在将结果保存到\
  \ SAS 数据集中。（使用 `PROC SUMMARY` 等于使用带有 `NOPRINT` 选项的 `PROC MEANS`。）\n\n`OUTPUT` 语句中创建的\
  \ SAS 数据集将包含 `output-statistic-list` 中定义的所有变量；`BY` 或 `CLASS` 语句中列出的任何变量；加上两个新变量：`_TYPE_`\
  \ 和 `_FREQ_`。如果没有 `BY` 或 `CLASS` 语句，则数据集将只有一个观测值。如果有 `BY` 语句，则数据集为每个 `BY` 分组的级别各有一个观测值。`CLASS`\
  \ 语句为类变量的每个交互级别产生一个观测值。`_TYPE_` 变量的值取决于交互级别。`_TYPE_` 值为 0 的观测值是总计。\n\n### 示例\n此示例使用了上一节中创建的永久\
  \ SAS 数据集。数据是批发苗圃的销售情况，包含客户 ID；销售日期；销售的长牵牛、金地鼠和金盏菊的数量以及销售月份。\n\n| CustID | SaleDate\
  \ | Petunia | SnapDragon | Marigold | Month |\n| :--- | :--- | :--- | :--- | :---\
  \ | :--- |\n| 1 | 756-01 | 05/04/2020 | 120 | 80 | 5 |\n| 2 | 756-02 | 05/12/2020\
  \ | 160 | 100 | 5 |\n| 3 | 756-03 | 05/18/2020 | 100 | 75 | 5 |\n| 4 | 756-04 |\
  \ 06/01/2020 | 80 | 60 | 6 |\n| 5 | 756-05 | 06/11/2020 | 120 | 110 | 6 |\n| 6 |\
  \ 756-06 | 06/19/2020 | 60 | 60 | 6 |\n\n\n\n\n| `NOPERCENT` | 抑制百分比的打印 |\n| `NOPRINT`\
  \ | 抑制频率表的打印 |\n| `OUT = data-set` | 写入包含频数的数据集 |\n\n例如，下面的语句告诉 SAS 将缺失值视为有效值，并将结果保存在名为\
  \ `EDFREQS` 的临时 SAS 数据集中：\n\n```sas\nTABLES YearsEducation / MISSING OUT = edfreqs;\n\
  ```\n\n`PROC FREQ` 还提供了许多统计选项。更多信息，请参阅第 9.6 节。\n\n### 示例\n咖啡店店主记录了销售情况。对于售出的每种饮料，她记录了咖啡的类型（卡布奇诺、浓缩咖啡、科纳咖啡或冰咖啡），以及客户是走进店内还是通过通道窗。以下是每行十个观测值的数据：\n\
  \n```\nesp w cap d cap w kon w ice w kon d esp d kon w ice d esp d\ncap w esp d\
  \ cap d Kon d .   d kon w esp d cap w ice w kon w\nkon w kon w ice d esp d w w esp\
  \ d esp w kon w cap w kon w\n```\n\n以下程序从名为 `Coffee.dat` 的文件中读取数据，并在名为 `MySASLib`（Windows）的目录中创建一个名为\
  \ `ORDERS` 的永久 SAS 数据集。然后为两个变量 `Window` 和 `Coffee` 生成单向频率：\n\n```sas\nLIBNAME drinks\
  \ 'c:\\MySASLib';\nDATA drinks.orders;\n    INFILE 'c:\\MyRawData\\Coffee.dat';\n\
  \    INPUT Coffee $ Window $ @@;\nRUN;\n\n* 打印 Window 和 Coffee 的表格;\nPROC FREQ DATA\
  \ = drinks.orders;\n    TABLES Window Coffee;\n    TITLE 'Coffee Sales by Window\
  \ and by Type of Drink';\nRUN;\n```\n\n输出包含两个表格。第一个是变量 `Window` 的单向频率表。你可以看到有 13\
  \ 名客户通过通道窗，而有 17 名客户进入餐厅。除了频率之外，表格还显示了变量 `Window` 每个值的百分比、累积频率和累积百分比。\n\n**按窗户和饮料类型的咖啡销售情况**\n\
  \n| FREQ 过程 | | |\n| Window | 频率 (Frequency) | 百分比 (Percent) | 累积频率 (Cumulative\
  \ Frequency) | 累积百分比 (Cumulative Percent) |\n| --- | --- | --- | --- | --- |\n|\
  \ d | 13 | 43.33 | 13 | 43.33 |\n| w | 17 | 56.67 | 30 | 100.00 |\n| Coffee | 频率\
  \ (Frequency) | 百分比 (Percent) | 累积频率 (Cumulative Frequency) | 累积百分比 (Cumulative\
  \ Percent) |\n| --- | --- | --- | --- | --- |\n| Kon | 1 | 3.45 | 1 | 3.45 |\n|\
  \ cap | 6 | 20.69 | 7 | 24.14 |\n| esp | 8 | 27.59 | 15 | 51.72 |\n| ice | 4 | 13.79\
  \ | 19 | 65.52 |\n| kon | 10 | 34.48 | 29 | 100.00 |\n| 缺失频率 = 1 | | | | |\n\n第二个表格是\
  \ `Coffee` 的单向频率表。你可以看到有多少客户订了每种饮料。注意，缺失值记录在底部，但没有包含在统计中。（如果你想将缺失值包含在计数中，请使用 `MISSING`\
  \ 或 `MISSPRINT` 选项）。此外，有一个观测值的 `Coffee` 值为 `Kon`。数据值是对大小写敏感的。这是一个数据录入错误；它应该为 `kon`。\n\
  \n## 4.13 使用 PROC FREQ 生成交叉表\n\n单向频率是一个很好的开始，但你通常想知道特定变量之间是如何相互作用的。你可以交叉任意数量的变量来获取双向频率、三向频率等，直到\
  \ n 向频率。组合两个或多个变量的表格也称为交叉表或列联表。\n\n要生成交叉表，请用星号 `*` 分隔变量。该语句生成一个双向表，显示 `YearsEducation`\
  \ 和 `Sex` 变量每个值组合的频率：\n\n```sas\nTABLES YearsEducation * Sex;\n```\n\n该语句生成一个三向表：\n\
  \n```sas\nTABLES YearsEducation * Sex * Age;\n```\n\n但要小心；读取三个或更多层级的交叉表感觉就像在没有三维棋盘的情况下玩三维井井字游戏。\n\
  \n你可以使用括号来分组变量。该语句生成两个双向表：一个是 `YearsEducation` 按 `Sex` 分类的表，另一个是 `YearsEducation`\
  \ 按 `Age` 分类的表：\n\n```sas\nTABLES YearsEducation * (Sex Age);\n```\n\n你可以在单个 `TABLES`\
  \ 语句中指定任意数量的表格请求，并且可以拥有任意多个 `TABLES` 语句。\n\n如果有选项，它们将出现在 `TABLES` 语句的斜杠 `/` 之后。可能的选项包括上一节列出的（`MISSPRINT`、`MISSING`、`NOPERCENT`、`NOPRINT`\
  \ 和 `OUT=`）以及专门适用于交叉表的选项：\n\n| CROSSLIST | 以列表格式显示带合计的交叉表 |\n| LIST | 以列表显示显示带合计的交叉表\
  \ |\n| NOCOL | 抑制交叉表的列百分比 |\n| NOROW | 抑制交叉表的行百分比 |\n\n例如，下面的语句告诉 SAS 忽略所有百分比：\n\
  \n```sas\nTABLES YearsEducation / NOPERCENT;\n```\n\n**示例** 咖啡店店主记录了销售情况。对于售出的每种饮料，她记录了咖啡的类型（卡布奇诺、浓缩咖啡、科纳咖啡或冰咖啡），以及客户是走进店内还是通过通道窗。\n\
  \n以下程序从名为 `Coffee.dat` 的文件中读取数据，并在名为 `MySASLib`（Windows）的目录中创建一个名为 `ORDERS` 的永久\
  \ SAS 数据集。然后为两个变量 `Window` 和 `Coffee` 生成单向频率：\n\n```sas\nLIBNAME drinks 'c:\\MySASLib';\n\
  DATA drinks.orders;\n    INFILE 'c:\\MyRawData\\Coffee.dat';\n    INPUT Coffee $\
  \ Window $ @@;\nRUN;\n\n* 打印 Window 和 Coffee 的表格\nPROC FREQ DATA = drinks.orders;\n\
  \    TABLES Window Coffee;\n    TITLE 'Coffee Sales by Window and by Type of Drink';\n\
  RUN;\n```\n\n输出包含两个表格。第一个是变量 `Window` 的单向频率表。你可以看到有 13 名客户通过通道窗，而有 17 名客户进入餐厅。除了频率之外，表格还显示了变量\
  \ `Window` 每个值的百分比、累积频率和累积百分比。\n\n**按窗户和饮料类型的咖啡销售情况**\n\n| FREQ 过程 | | | | |\n|\
  \ Window | 频率 (Frequency) | 百分比 (Percent) | 累积频率 (Cumulative Frequency) | 累积百分比\
  \ (Cumulative Percent) |\n| --- | --- | --- | --- | --- |\n| d | 13 | 43.33 | 13\
  \ | 43.33 |\n| w | 17 | 56.67 | 30 | 100.00 |\n| Coffee | 频率 (Frequency) | 百分比 (Percent)\
  \ | 累积频率 (Cumulative Frequency) | 累积百分比 (Cumulative Percent) |\n| --- | --- | ---\
  \ | --- | --- |\n| Kon | 1 | 3.45 | 1 | 3.45 |\n| cap | 6 | 20.69 | 7 | 24.14 |\n\
  | esp | 8 | 27.59 | 15 | 51.72 |\n| ice | 4 | 13.79 | 19 | 65.52 |\n| kon | 10 |\
  \ 34.48 | 29 | 100.00 |\n| 缺失频率 = 1 | | | | |\n\n第二个表格是 `Coffee` 的单向频率表。你可以看到有多少客户订了每种饮料。注意，缺失值记录在底部，但没有包含在统计中。（如果你想将缺失值包含在计数中，请使用\
  \ `MISSING` 或 `MISSPRINT` 选项）。此外，有一个观测值的 `Coffee` 值为 `Kon`。数据值是对大小写敏感的。这是一个数据录入错误；它应该为\
  \ `kon`。\n\n下面的语句告诉 SAS 忽略所有百分比：\n\n```sas\nTABLES YearsEducation * Sex / NOPERCENT;\n\
  ```\n\n\n\n\n\n### 示例\n\n当地图书馆的工作人员希望按年龄段查看人们借出的书籍类型。他们拥有读者的年龄（以岁为单位）和书籍类型（小说、推理、科幻、传记、非虚构类或参考书）。以下是每行九个观测值的数据：\n\
  \n```\n17 sci  9 bio 28 fic 50 mys 13 fic 32 fic 67 fic 81 non 38 non\n53 non 16\
  \ sci 15 bio 61 fic 52 ref 22 mys 76 bio 37 fic 86 fic\n49 mys 78 non 45 sci 64\
  \ bio  8 fic 11 non 41 fic 46 ref 69 fic\n34 fic 26 mys 23 sci 74 ref 15 sci 27\
  \ fic 23 mys 63 fic 78 non\n40 bio 12 fic 29 fic 54 mys 67 fic 60 fic 38 sci 42\
  \ fic 80 fic\n```\n\n以下是创建三个自定义格式的程序：一个用于书籍类型，另外两个以不同的方式对年龄分组。\n\n```sas\nPROC FORMAT;\n\
  \    VALUE $typ\n        'bio','non','ref' = 'Non-Fiction'\n        'fic','mys','sci'\
  \ = 'Fiction';\n    VALUE agegpa\n          0-18    = '0 to 18'\n          19-25\
  \   = '19 to 25'\n          26-49   = '26 to 49'\n          50-HIGH = '  50+ ';\n\
  \    VALUE agegpb\n          0-25    = '0 to 25'\n          26-HIGH = '  26+ ';\n\
  RUN;\n\nDATA books;\n    INFILE 'c:\\MyRawData\\LibraryBooks.dat';\n    INPUT Age\
  \ Book $ @@;\n    BookType = PUT(Book,$typ.);\nRUN;\n\n*创建一个年龄分组为四类的交叉表；\nPROC FREQ\
  \ DATA = books;\n    TITLE 'Patron Age by Book Type: Four Age Groups';\n    TABLES\
  \ BookType * Age / NOPERCENT NOROW NOCOL;\n    FORMAT Age agegpa.;\nRUN;\n\n*创建一个年龄分组为两类的交叉表；\n\
  PROC FREQ DATA = books;\n    TITLE 'Patron Age by Book Type: Two Age Groups';\n\
  \    TABLES BookType * Age / NOPERCENT NOROW NOCOL;\n    FORMAT Age agegpb.;\nRUN;\n\
  ```\n\n在 `DATA` 步中，`PUT` 函数使用 `$TYP.` 格式来创建一个名为 `BookType` 的新变量，将书籍分组为“小说（Fiction）”或“非虚构类（Non-Fiction）”。然后，第一个\
  \ `PROC FREQ` 使用 `AGEGPA.` 格式将年龄分成了四类，而第二个 `PROC FREQ` 使用 `AGEGPB.` 格式将年龄分成了两类。由于由于在\
  \ `TABLES` 语句中添加了 `NOPERCENT`、`NOROW` 和 `NOCOL` 选项，结果中只会显示频数。\n\n### 按书籍类型划分读者年龄：四个年龄组\n\
  FREQ 过程\n\n| 按年龄划分的 BookType 表 |\n| --- |\n| BookType | Age |\n| --- | --- |\n|\
  \  Frequency | 0 to 18 | 19 to 25 | 26 to 49 | 50+ | Total |\n| --- | --- | ---\
  \ | --- | --- | --- |\n| Fiction | 6 | 3 | 12 | 10 | 31 |\n| Non-Fiction | 3 | 0\
  \ | 3 | 8 | 14 |\n| Total | 9 | 3 | 15 | 18 | 45 |\n\n### 按书籍类型划分读者年龄：两个年龄组\nFREQ\
  \ 过程\n\n| 按年龄划分的 BookType 表 |\n| --- |\n| BookType | Age |\n| --- | --- |\n|  Frequency\
  \ | 0 to 25 | 26+ | Total |\n| --- | --- | --- | --- |\n| Fiction | 9 | 22 | 31\
  \ |\n| Non-Fiction | 3 | 11 | 14 |\n| Total | 12 | 33 | 45 |\n\n## 4.15 使用 PROC\
  \ TABULATE 生成表格化报告\n\n![image](img/f0122-01.jpg)\n\n`TABULATE` 过程计算的每个汇总统计量也可以 `PRINT`、`MEAN`\
  \ 等其他过程生成，但 `PROC TABULATE` 之流行是因为它生成的报告非常美观。如果 `PROC TABULATE` 是一个盒子，它会被精精美的包装。`PROC\
  \ TABULATE` 如此强大，以至于有整本书都在专门介绍它，但它也非常简洁，让你可能觉得像在读象形文字。如果你觉得 `PROC TABULATE` 的语法有点难习惯，那可能是因为它的根源在\
  \ SAS 之外。`PROC TABULATE` 部分是基于美国劳工部开发的 Table 语言的。\n\n`PROC TABULATE` 的通用形式如下：\n\n\
  ```sas\nPROC TABULATE;\n    CLASS classification-list;\n    TABLE page-dimension,\
  \ row-dimension, column-dimension;\n```\n\n`CLASS` 语句告诉 SAS 哪些变量包含用于将观测值划分为组的分类数据，而\
  \ `TABLE` 语句告诉 SAS 如何组织你的表格以及计算哪些数字。每个 `TABLE` 语句只定义一个表，但你可以定义多个表格。`TABLE` 语句定义了一个一个表，但你可以有多个\
  \ `TABLE` 语句。如果一个变量列在 `TABLE` 语句中，默认情况下，`PROC TABULATE` 会生成该变量的计数。`PROC TABULATE`\
  \ 提供了许多统计信息。\n\n### 维度\n每个 `TABLE` 语句可以指定三个维度。用逗号分隔的维度告诉 SAS 哪些是用于页（page）、行（row）和列（column）的维度。如果你指定一个维度，它将成为列维度。指定的维度告诉\
  \ SAS 哪些是用于行的的维度。如果你指定两个维度，你会得到行和列。如果你指定三个维度，你会得到页、行和列。\n\n### 示例\n默认情况下，如果 `CLASS`\
  \ 语句中的变量有缺失值，它们会被排除在表格之外。如果你想保留这些观测值，只需在你的过程语句中添加 `MISSING` 选项，如下：\n\n```sas\nPROC\
  \ TABULATE MISSING;\n```\n\n这里是关于游船的港口、类型（帆船或动力）、价格以及长度（英尺）的数据。\n\n| Name | Port\
  \ | Type | Price | Length |\n| --- | --- | --- | --- | --- |\n| Silent Lady | Maalea\
  \ | sail | 95.00 | 64 |\n| America II | Maalea | sail | 72.95 | 65 |\n| Aloha Anai\
  \ | Lahaina | sail | 112.00 | 60 |\n| Ocean Spirit | Maalea | power | 62.00 | 65\
  \ |\n| Anuenue | Maalea | sail | 177.50 | 52 |\n| Hana Lei | Maalea | power | 88.99\
  \ | 110 |\n| Leilani | Maalea | power | 99.99 | 45 |\n| Kalakaua | Maalea | power\
  \ | 69.50 | 70 |\n| Reef Runner | Lahaina | power | 59.95 | 50 |\n| Blue Dolphin\
  \ | Maalea | sail | 92.95 | 65 |\n\n假设你想要一个显示每个港口按类型和船只划分的数量的报告。以下程序使用 `PROC IMPORT`\
  \ 读取制表符文件并创建一个名为 `BOATS` 的永久 SAS 数据集。然后 `PROC TABULATE` 使用 `Port` 作为页、`Type` 作为行、`Vessel`\
  \ 作为列创建一个三维报告。\n\n```sas\nLIBNAME trips 'c:\\MySASLib';\nPROC IMPORT DATAFILE =\
  \ 'c:\\MyRawData\\Boats.txt' OUT = trips.boats REPLACE;\nRUN;\n\n* 三维汇总；\nPROC TABULATE\
  \ DATA = trips.boats;\n    CLASS Port Type Vessel;\n    TABLE Port, Type, Vessel;\n\
  \    TITLE 'Number of Boats by Port, Type, and Vessel';\nRUN;\n```\n\n此报告有两个页，对应页维度的每个值。这里其中之一：\n\
  \n按港口、类型和船只的数量\n\n| **Port Maalea** |\n| --- |\n|  | Vessel |\n| --- | --- |\n|\
  \ cat | sch | yac |\n| --- | --- | --- |\n| N | N | N |\n| --- | --- | --- |\n|\
  \ Type | 3 | . | 1 |\n| power | | |\n| sail | 1 | 2 | 1 |\n\n## 4.16 为 PROC TABULATE\
  \ 输出添加统计量\n\n当 `CLASS` 语句列出分类变量时，`VAR` 语句告诉 SAS 哪些变量包含连续数据。`PROC TABULATE` 的通用形式如下：\n\
  \n```sas\nPROC TABULATE;\n    VAR analysis-variable-list;\n```\n\n\n\n\n\n```\n\
  CLASS classification-variable-list;\nTABLE page-dimension, row-dimension, column-dimension;\n\
  ```\n\n虽然 `CLASS` 语句中的变量可以是数值或字符型，但 `VAR` 语句中的变量必须是数值。你可以同时使用 `CLASS` 语句和 `VAR`\
  \ 语句，或者只使用其中一个，但 `TABLE` 语句列出的所有变量必须出现在 `CLASS` 或 `VAR` 语句中。\n\n### 关键字\n\n除了变量名，每个维度都可以包含关键字。以下是\
  \ `PROC TABULATE` 可以计算的一些值：\n\n| 关键字 | 描述 |\n| :--- | :--- |\n| ALL | 添加显示总计的行、列或页\
  \ |\n| MAX | 最高值 |\n| MIN | 最低值 |\n| MEAN | 算术平均值 |\n| MEDIAN | 中位数 |\n| MODE |\
  \ 数 |\n| N | 非缺失值的个数 |\n| NMISS | 缺失值的个数 |\n| PCTN | 该组观测值的百分比 |\n| PCTSUM | 该组占总和的百分比\
  \ |\n| STDDEV | 标准差 |\n| SUM | 总和 |\n\n### 连接、交叉和分组\n\n在一个维度内，变量和关键字可以进行连接、交叉或分组。要连接变量或关键字，只需用空格将它们列出；要交叉变量或关键字，用星号（`*`）将它们分隔；要对其进行分组，将变量或关键字括在括号中。关键字\
  \ `ALL` 通常是连接的。然而，要请求其他统计数据，可以将该关键字与变量名进行交叉。\n\n| 方法 | 示例 |\n| :--- | :--- |\n|\
  \ 连接： | `TABLE Type Vessel ALL;` |\n| 交叉： | `TABLE MEAN * Price;` |\n| 交叉、分组和连接：\
  \ | `TABLE PCTN *(Type Vessel);` |\n\n### 示例\n\n此示例使用了上一节创建的永久 SAS 数据集。数据包含每只船的名字、其母港、类型（帆船或动力船）、船种（大帆船、双体船或游艇）、远游价格以及船的长度。\n\
  \n| | 名称 | 港口 | 类型 | 船种 | 价格 | 长度 |\n| --- | --- | --- | --- | --- | --- | --- |\n\
  | 1 | Silent Lady | Maalea | sail | sch | 95 | 64 |\n| 2 | America II | Maalea |\
  \ sail | yac | 72.95 | 65 |\n| 3 | Aloha Anai | Lahaina | sail | cat | 112 | 60\
  \ |\n| 4 | Ocean Spirit | Maalea | power | cat | 62 | 65 |\n| 5 | Anuenue | Maalea\
  \ | sail | sch | 177.5 | 52 |\n| 6 | Hana Lei | Maalea | power | cat | 88.99 | 110\
  \ |\n| 7 | Leilani | Maalea | power | yac | 99.99 | 45 |\n| 8 | Kalakaua | Maalea\
  \ | power | cat | 69.5 | 70 |\n| 9 | Reef Runner | Lahaina | power | yac | 59.95\
  \ | 50 |\n| 10 | Blue Dolphin | Maalea | sail | cat | 92.95 | 65 |\n\n接下来的程序创建了另一个关于船的报告。然而，此\
  \ `PROC TABULATE` 包含一个 `VAR` 语句。该程序中的 `TABLE` 语句仅包含两个维度；但它对变量和统计数据进行了连接、交叉和分组。\n\
  \n```sas\nLIBNAME trips 'c:\\MySASLib';\n\n* 使用两个维度和统计数据的汇总\nPROC TABULATE DATA\
  \ = trips.boats;\n   CLASS Type Vessel;\n   VAR Price;\n   TABLE Type ALL, MEAN*Price*(Vessel\
  \ ALL);\n   TITLE 'Mean Price by Type and Vessel';\nRUN;\n```\n\n此表的行维度将分类变量 `Type`\
  \ 与 `ALL` 连接以产生总计。另一方面，列维度将 `MEAN` 与分析变量 `Price` 以及分类变量 `Vessel`（该恰好与 `ALL` 连接并分组）进行交叉。结果如下：\n\
  \n按类型和船种划分平均价格\n\n| | 平均值 |\n| --- | --- |\n| 价格 | |\n| --- | --- |\n| 船种 | 全部 |\n\
  | --- | --- |\n| cat | sch | yac |\n| --- | --- | --- |\n| Type | 73.50 | . | 79.97\
  \ | 76.09 |\n| power | |\n| sail | 102.48 | 136.25 | 72.95 | 110.08 |\n| All | 85.09\
  \ | 136.25 | 77.63 | 93.08 |\n\n## 4.17 增强 PROC TABULATE 输出的外观\n\n当你使用 `PROC TABULATE`\
  \ 时，SAS 会将你的数据封装在整齐的小方框中，但有时它们看起来并不对。通过使用三个简单的选项，你可以增强输出的外观。将其想象成更换包装纸。\n\n####\
  \ FORMAT= 选项\n\n要更改表格中所有数据单元格的格式，请在 `PROC` 语句中使用 `FORMAT=` 选项。例如，如果你表格中的数字带有逗号且没有小数位，可以使用此\
  \ PROC 语句：\n\n```sas\nPROC TABULATE FORMAT = COMMA8.0;\n```\n\n告诉 SAS 对所有数据单元格使用\
  \ `COMMA8.0` 格式。\n\n要对单个变量应用格式，请将其与变量名交叉，如下：\n\n```sas\nTABLE Region*FORMAT=DOLLAR10.2;\n\
  ```\n\n`TABLE` 语句对名为 `Sales` 的变量应用 `COMMA8.0` 格式。如果你在 `PROC` 和 `TABLE` 语句中均指定 `COMMA8.0`\
  \ 格式，则 `TABLE` 语句将覆盖 `PROC` 语句。\n\n`BOX=` 和 `MISEXT=` 选项可以放在 `PROC` 或 `TABLE` 语句中。`BOX=`\
  \ 选项允许你在表格右上角插入一个短语。相反，`MISEXT=` 选项指定了数据缺失时打印的内容。此语句：\n\n```sas\nTABLE Region, BOX='Mean\
  \ Sales' MISEXT='none';\n```\n\n`BOX=` 选项出现在表格的右上角，而 `MISEXT=` 指定了没有数据的单元格的内容。\n\
  \n\n\n\n\n注意，`Price` 的数据单元现在使用 `PROC` 语句指定的 `DOLLAR7.2` 格式，而 `Length` 的单元格则使用 `TABLE`\
  \ 语句指定的 `2.0` 格式。文本“Full Day Excursions”出现在左上角，这在之前的一个节中是空的。此外，一个没有数据的单元格显示单词“none”而不是句号。\n\
  \n## 4.18 更改 PROC TABULATE 输出中的表头\n\n`TABULATE` 过程产生的报告带有表头。有时表头太多，导致你的报告看起来杂乱无章；在其他时候，你可能觉得使用不同的表头更有意义。但在更改表头之前，你需要了解它属于哪种类型。`PROC\
  \ TABULATE` 报告有两种基本类型的表头：`CLASS` 语句列出的变量值作为表头，以及变量名和关键字作为表头。你使用不同的方法来更改不同类型的表头。\n\
  \n### CLASS 变量值\n要更改 `CLASS` 语句列出的变量值的表头，请使用 `FORMAT` 过程创建一个用户定义的格式。然后在使用 `FORMAT`\
  \ 语句中（第 4.8 节讨论）将该格式分配给变量。\n\n### 变量名和关键字\n你可以像第 4.1 节描述的那样，使用简单的 `LABEL` 语句更改变量名的表头，但这对关键字无效。还有另一种方法同时适用于变量名和关键字。在\
  \ `TABLE` 语句中，你在变量或关键字后放置一个等号，然后跟上用双引号括起来的新表头。你可以通过将其设为空白（两个之间没有任何内容的的引号）来完全消除某个表头，SAS\
  \ 将移除该表头的框。此 `TABLE` 语句告诉 SAS 移除 `Region` 和 `MEAN` 的表头，并将变量 `Sales` 的表头更改为“Mean\
  \ Sales by Region”。\n\n```sas\nTABLE Region='', MEAN=''Sales='Mean Sales by Region';\n\
  ```\n\n在某些情况下，当行表头被设置为空时，SAS 会留下一个空单元格。这发生在统计变量和分析变量上（但不是类变量）。要强制 SAS 移除空单元格，请在你的\
  \ `TABLE` 语句末尾添加 `ROW=FLOAT` 选项，如下：\n\n```sas\nTABLE MEAN=''Sales='Mean Sales by\
  \ Region', Region='' / ROW=FLOAT;\n```\n\n### 示例\n此示例使用了第 4.15 节创建的永久 SAS 数据集。数据包含每只船的名字、它的母港、类型（帆船或动力船）、船的种类（帆船、双体船或游艇）、远览的价格以及船的长度。\n\
  \n| | Name | Port | Type | Vessel | Price | Length |\n| --- | --- | --- | --- |\
  \ --- | --- | --- |\n| 1 | Silent Lady | Maalea | sail | sch | 95 | 64 |\n| 2 |\
  \ America II | Maalea | sail | yac | 72.95 | 65 |\n| 3 | Aloha Anai | Lahaina |\
  \ sail | cat | 112 | 60 |\n| 4 | Ocean Spirit | Maalea | power | cat | 62 | 65 |\n\
  | 5 | Anuenue | Maalea | sail | sch | 177.5 | 52 |\n| 6 | Hana Lei | Maalea | power\
  \ | cat | 88.99 | 110 |\n| 7 | Leilani | Maalea | power | yac | 99.99 | 45 |\n|\
  \ 8 | Kalakaua | Maalea | power | cat | 69.5 | 70 |\n| 9 | Reef Runner | Lahaina\
  \ | power | yac | 59.95 | 50 |\n| 10 | Blue Dolphin | Maalea | sail | cat | 92.95\
  \ | 65 |\n\n以下程序显示了如何更改表头。首先，通过 `FORMAT` 过程创建一个名为 `$VES` 的用户定义格式。然后使用 `FORMAT` 语句将\
  \ `$VES.` 格式分配给变量 `Vessel`，以便格式化后的数据值被用于列头。在 `TABLE` 语句中，更改了更多表头。`Type`、`MEAN` 和\
  \ `Vessel` 的表头都被设为空，而 `Price` 的表头被设置为“Mean Price by Kind of Vessel”。\n\n```sas\n\
  LIBNAME trips 'c:\\MySASLib';\n\n* Changing headers;\nPROC FORMAT;\n    VALUE $ves\
  \  'cat' = 'catamaran'\n               'sch' = 'schooner'\n               'yac'\
  \ = 'yacht';\nRUN;\n\nPROC TABULATE DATA = trips.boats FORMAT=DOLLAR7.2;\n    CLASS\
  \ Type Vessel;\n    VAR Price;\nFORMAT Vessel $ves.;\n    TABLE Type='' ALL,\n \
  \      MEAN=''Sales='Mean Price by Kind of Vessel'*(Vessel='' ALL)\n       /BOX='Full\
  \ Day Excursions' MISSTEXT='none';\n    TITLE;\nRUN;\n```\n\n此程序不需要 `ROW=FLOAT`\
  \ 选项，因为行维度中被设置为空的变量是类变量。如果你在行维度中放入分析变量或统计关键字并将其设为空，那么你就需要添加 `ROW=FLOAT` 来移除空单元格。以下是输出：\n\
  \n| Full Day Excursions | Mean Price by Kind of Vessel |\n| --- | --- |\n| catamaran\
  \ | schooner | yacht | All |\n| --- | --- |\n| catamaran | schooner | yacht | All\
  \ | (注：此处原文示例表格似乎有重复，已按逻辑翻译) \n* 修正：根据原文内容，此处为输出结果展示，保持原表格结构。\n\n\n\n (此处对应原文表格输出)\n\
  | Full Day Excursions | Mean Price by Kind of Vessel |\n| --- | --- |\n| catamaran\
  \ | schooner | yacht | All |\n| --- | --- |\n| catamaran | schooner | yacht | All\
