  \ Folsom\n\nDeanna Warner, Carol Linden, Anthony House, Robina G. Thornton\n\nCate\
  \ Parrish, Susan C. Tideman, Kevin Hobbs, Ted Meleky\n\nAllison McMahill, Sandy\
  \ McNeill, Darrell Barton, Candy Farrell, Sandy Owens\n\nMichael Williams, Heather\
  \ B. Dees, Kathy Kiraly, Mike Pezzoni\n\nCarole Beam, Jason Moore, Ginger Care,\
  \ Phil Gibbs, Morris Vaughan\n\nDavid Schlotauer, Missy Hannah, Janice Bloom, Jennifer\
  \ M. Ginn, Jan Squillace\n\nMary Beth Steinbach, Jake Jacobs, Nancy Mitchell, Linda\
  \ Walters, Dina Fiorentino\n\nLaurin Smith, Maggie Underberg, Julie McKnight, Patsy\
  \ J. Poole, Lorilyn Russell\n\nKaren Perkins, Paul Grant, Kent Reeve, Gina Repole,\
  \ Blanche W. Phillips, Elizabeth Maldonado\n\nMatthew R. Clark, Kris Rinne, Caroline\
  \ Brickley\n\nSAS 技术 Support Staff\n\nOur Families\n\nOur Readers\n\n\n\n\n\n# SAS\
  \ 软件被全球数百万用户使用——遍布 147 多个国家、83,000 多个站点。`SAS`（读作 sass）既是一家公司，也是一种软件。当人们谈到 `SAS`\
  \ 时，有时指的是运行在他们计算机上的软件，有时指的是 `SAS Institute`（公司。\n\n人们经常问 `SAS` 代表什么。最初，字母 `S-A-S`\
  \ 代表统计分析系统（Statistical Analysis System，注意不要与斯堪的纳维亚航空系统、圣安东尼奥制鞋匠或应用光谱学会混淆）。但由于 `SAS`\
  \ 产品迅速变得多样化，`SAS` 正式弃用了“统计分析系统”这一名称，简称为 `SAS`。\n\n## SAS 产品\n`SAS` 软件的根源可以追溯到 20\
  \ 世纪 70 年代，最初作为一个统计分析软件包出现，但 `SAS` 并未于此。到 20 世纪 80 年代中期，`SAS` 已经扩展到图形、在线数据输入以及 `C`\
  \ 编程语言的编译器。在 20 世纪 90 年代，`SAS` 家族树不断扩大，包含了数据可视化、数据仓库管理以及构建通万维网接口的工具。在新世纪，`SAS` 继续增长，其产品设计用于清理杂乱数据、发现和开发药物、检测洗钱，以及为人工智能和机器学习构建系统。\n\
  \n虽然 `SAS` 拥有多样化的产品家族，但这些产品大部分都是集成的。也就是说，它们可以像积木一样组合在一起，构建一个无缝的系统。例如，你可以使用 `SAS/ACCESS`\
  \ 软件读取存储在外部数据库（如 `Oracle`）中的数据，使用 `SAS/ETS` 软件（用于建模和预测的计量经济学和时间序列软件）进行分析，使用 `ODS\
  \ Graphics` 生成复杂的图表，然后通过电子邮件将结果发送给同事，而这一切都在一个计算机程序中完成。要了解更多关于 `SAS` 提供的产品，请访问网站：\n\
  \n[www.sas.com](http://www.sas.com)\n\n## 学习 SAS\n除了这本书和其他书籍外，还有用于学习 `SAS` 的在线资源。`SAS\
  \ Institute` 提供了许多操作教程和涵盖广泛主题的完整课程。其中一些是免费的，另一些则需要付费。如果你在工作场所或学校无法使用 `SAS` 软件，那么还有其他方法可以练习你学的内容。`SAS\
  \ University Edition` 可以免费下载并安装在你的个人计算机上。或者，你可以创建一个账户使用 `SAS OnDemand for Academics`，它运行在由\
  \ `SAS Institute` 托管的服务器上。`SAS University Edition` 和 `SAS OnDemand for Academics`\
  \ 仅供学术非商业用途。\n\n## 运行环境\n`SAS` 软件运行在各种运行环境中。你可以将在个人计算机上编写的程序在仅更改特定于每个运行环境的文件处理语句后，在\
  \ `UNIX` 服务器上运行。而且由于 `SAS` 程序具有尽可能的移植性，`SAS` 程序员也具有尽可能的移植性。如果你在一个运行环境中熟悉 `SAS`，就可以切换到另一个运行环境，而无需重新学习\
  \ `SAS`。\n\n## SASware 投票 (SASware Ballot)\n`SAS` 将其大部分收入投入研发中，每年 `SAS` 用户都通过参与“SASware\
  \ 投票”贡献想法，帮助决定这些资金将如何使用。该投票是一份关于新功能和增强的建议列表。任何人都可以提交想法，从而影响 `SAS` 软件的未来发展。要贡献你自己的想法或为你喜欢的想法投票，请在互联网上搜索“SASware\
  \ Ballot”。\n\n# 关于这本书\n\n### 谁需要这本书\n这本书适用于商业、政府和学术界的所有新 `SAS` 用户，以及任何将使用 `SAS`\
  \ 软件进行数据分析的人。你不需要预先拥有 `SAS` 经验，但如果你有一定的经验，可能仍然会发现这本书对于学习遗漏的技术或作为参考很有用。\n\n### 本书涵盖的内容\n\
  本书通过大量的实际示例、清晰简练的解释以及尽可能少量的技术术语，向你介绍 `SAS` 语言。这里涵盖的大部分功能都来自 `Base SAS`，它包含了所有 `SAS`\
  \ 程序员使用的核心功能。一个例外是第 9 章，它包含了来自 `SAS/STAT` 的过程。其他异常出现在第 2 章和第 10 章，涵盖了从其他类型的软件导入导出数据；某些方法需要\
  \ `SAS/ACCESS Interface to PC Files`。\n\n我们尝试包含了初学者可能需要的 `Base SAS` 的每一个功能。某些读者可能会某些主题（如\
  \ `macros`）被包含在内感到惊讶，因为它们通常被认为是高级内容。但它们出现在这里是因为有时新用户需要它们。然而，这并不意味着你需要了解书中的所有内容。相反，这本书的设计初衷是让你只阅读解决问题所需的特定章节。即使你从头到尾读完这本书，当新的编程挑战出现时，你可能仍发现自己会回到这里温习记忆。\n\
  \n### 本书未涵盖的内容\n使用这本书你不需要预先了解 `SAS` 知识，但你必须对你的本地计算机和运行环境有所了解。`SAS` 语言在不同的运行环境之间几乎是相同的，但某些差异是不可避免的。例如，每个运行环境都有存储和访问文件的不同方法。你的雇主可能有某些规则，例如对你可以打印的文件大小限制。本书在相关时会涉及运行环境，但没有一本书能回答关于你本地系统的所有问题。你必须对你的计算机系统有操作知识，或者有一个可以在有问题时请教的人。\n\
  \n作为一名 `SAS` 程序员，你可以选择使用哪种接口来编写程序以及如何运行程序。本版本的《Little SAS Book》设计适用于 `Base SAS`\
  \ 包含的所有接口：`SAS Studio`、`SAS Enterprise Guide` 以及窗口环境（也称为 Display Manager），此外批提交。（`SAS\
  \ University Edition` 和 `SAS OnDemand for Academics` 使用 `SAS Studio` 接口。）每种方法都有其独特的功能集。本书提到了一些差异，但并非全面的介绍。请见第\
  \ 1.5 节关于每种方法的简单描述和学习建议。\n\n本书不是 `SAS Documentation` 或许多 `SAS` 出版物的替代品。我们鼓励你查阅书中未涵盖的细节。你可以在\
  \ `SAS Institute` 的支持网站找到完整的 `SAS Documentation`：\n\n[support.sas.com](https://support.sas.com/en/support-home.html)\n\
  \n我们只涵盖了许多 `SAS` 统计过程。幸运的是，统计过程共享许多相同的语句、选项和输出，因此这几个可以作为其他过程的介绍。一旦你读了第 9 章，我们认为其他统计过程会让你感到熟悉。\n\
  \n遗憾的是，这类书籍无法对统计概念（如自由度或交叉和嵌套效应）提供深入介绍。为了使测试有效，你的数据必须满足某些底层假设。实验设计和仔细的模型选择至关重要。结果的解释往往是困难且主观的。我们假设对统计计算感兴趣的读者已经具备统计学知识。想使用统计过程但不熟悉这些概念的人应该咨询统计学家，寻找入门统计学书籍，或者更好，参加统计学课程。\n\
  \n\n\n\n\n# 模块化章节\n我们写这本书的目标是让学习 SAS 尽可能简单且愉快。面对现实吧——SAS 是一个庞大的话题。你可能已经花了一些时间盯着满屏幕的文档，直到眼睛变得模糊。我们无法将所有的\
  \ SAS 内容压缩到这本小书中，但可以将各个主题压缩成短小、易于阅读的章节。\n\n整本书由两页长度的章节组成，每个章节都是一个完整的主题。这样你就可以轻松跳过不适用于你的主题。当然，我们认为*每一个*章节都是重要的，否则我们不会将其包含在。不过，为了完成工作，你可能不需要了解书中的所有内容。通过将短小易于消化的章节呈现主题，我们相信学习\
  \ SAS 将变得更容易、更有趣——就像每天吃三餐，而不是一周吃一顿大餐。\n\n## 图形\n只要可能，图形插图要么标识章节内容，要么有助于解释主题。边缘粗糙的方框表示原始数据文件，边缘平滑的方框表示\
  \ SAS 数据集（data set）。框内的波浪线表示数据——任何旧数据——句号表示缺失值。这些类型框之间的箭头意味着该章节解释了如何从看起来像一个框的数据转换为看起来像另一个框的数据。某些章节带有描绘打印输出的图形。这些图形看起来像一叠纸，页面的顶部印有标题。\n\
  \n![image](img/f0xii-01.jpg)\n\n## 排版规范\nSAS 并不在乎你的程序是用大写还是小写写的，因此你可以按照自己喜欢的方式编写程序。在书中，我们使用大写和小写来提示某些信息。下方左侧的语句显示语法或通用形式，而右侧的语句显示了\
  \ SAS 程序中可能出现的实际语句示例。\n\n| 语法 | 示例 |\n| :--- | :--- |\n| `PROC PRINT DATA = data-set-name;\
  \ VAR variable-list;` | `PROC PRINT DATA = bigcats; VAR Lions Tigers;` |\n\n注意，关键字\
  \ `PROC PRINT`、`DATA` 和 `VAR` 在双方都是相同的，而语法侧的描述性术语 `data-set-name` 和 `variable-list`\
  \ 已被替换为实际数据集名称和变量名。\n\n在书中，所有的 SAS 关键字都以大写字母出现。关键字是 SAS 的指令，必须拼写正确。任何以小写斜体编写的内容都是对语句中该位置填写内容的描述，而不是你实际输入的内容。任何以小写或混合大小写字母编写（且非斜体）的内容都是程序员自定义的，例如变量名、SAS\
  \ 数据集名称、注释或标题。请参见第 1.2 节进一步讨论 SAS 名称中大小写的区分意义。\n\n## 缩进\n书中包含许多 SAS 程序，每个程序都是完整且可执行的。程序的格式化方式易于你阅读和理解。你不需要以这种格式编写你的程序，因为\
  \ SAS 非常灵活，但注意这些细节会让你的程序更容易读。当你需要在几个月或几年后回过解析程序时，易读的程序可以为你或每小时 200 美元的顾问节省时间。\n\n\
  程序的结构通过对步骤（step）之后的所有语句进行缩进来显示。这是一种提高程序可读性的简单方法，也是一种良好的习惯。SAS 并不在乎语句在哪里开始，甚至是否都在一行。在下面的程序中，`INFILE`\
  \ 和 `INPUT` 语句被缩进了，表示它们属于 `DATA` 语句：\n\n```\n* Read animals’ weights from file.\
  \ Print the results.;\n\nDATA animals;\n   INFILE 'c:\\MyRawData\\Zoo.dat';\n  \
  \ INPUT Lions Tigers;\nRUN;\n\nPROC PRINT DATA = animals;\nRUN;\n```\n\n## 书中使用的数据和程序\n\
  你可以通过链接到本书的作者页面来访问示例中使用的数据和程序：\n\n[support.sas.com/delwiche](https://support.sas.com/en/books/authors/lora-delwiche.html)\n\
  \n或者\n\n[support.sas.com/slaughter](https://support.sas.com/en/books/authors/susan-slaughter.html)\n\
  \n从那里，你可以选择“示例代码和数据”来下载包含书中数据和程序的文件。\n\n最后，我们努力让这本书尽可能易读，并且我们希望它是甚至是有趣的。一旦你掌握了这本小书的内容，你就不再是初级\
  \ SAS 程序员了。\n\n## 关于这些作者\n![image](img/f00xv-01.jpg)\n\nLora D. Delwiche（右侧）拥有超过\
  \ 25 年的经验，她喜欢向人们教授 SAS 软件，并喜欢使用 SAS 解决挑战性问题。她职业生涯的大部分时间都在加州大学戴维斯分校度过，使用 SAS 支持教学和研究。\n\
  \nSusan J. Slaughter（左侧）在 25 多年前的研究生阶段发现了 SAS 软件。从那时起，她在各种商业和学术环境中使用 SAS。她现在通过她的公司\
  \ Avocet Solutions 担任顾问。\n\n与合著者 Rebecca Ottesen 一起，Lora 和 Susan 还编写了《Exercises\
  \ and Projects for the Little SAS Book, Sixth Edition》，这是本书的伴读丛。\n\n通过访问他们的作者页面了解更多关于这些作者的信息，你可以在那里下载免费书籍节选、访问示例代码和数据、阅读最新评论、获取更新等：\n\
  \n[`support.sas.com/delwiche`](http://support.sas.com/en/books/authors/lora-delwiche.html)\n\
  \n[`support.sas.com/slaughter`](http://support.sas.com/en/books/authors/susan-slaughter.html)\n\
  \n“诚实的故事最好直白。”\n\n威廉·莎士比亚，《理查德三世》\n\n莎士比亚《理查德三世》，公有领域。\n\n\n\n\n请注意，你首先要说明你想做什么；然后提供告知者执行你的请求时所需的所有信息。后续语句的顺序可能并不重要，但你必须从对你想做的事情的概括性开始。例如，你不会走到银行柜台员面前说：“给我五张\
  \ 20 元的和两张 50 元的。”这不仅是不礼貌的，还可能让柜台员的心跳漏掉一两拍。你还必须确保所有的后续语句都与第一条语句是一致的。当你从支票账户中取款时，你不会说：“我要你们那儿最大的盒子”。那个陈述是属于“我想开一个储物箱”的。SAS\
  \ 程序是 SAS 语句的有序集合，就像你去银行时使用的有序指令集一样。\n\n## SAS 语句\n与任何语言一样，在编写 SAS 程序时有几条规则需要遵循。对我们来说，编写\
  \ SAS 程序的规则比英语的规则少得多，也简单得多。\n\n最重要的规则是\n\n**每个 SAS 语句都以分号结束。**\n\n这听起来足够简单。但虽然孩子通常会改掉在句末忘记句号的习惯，但\
  \ SAS 程序员似乎从未改掉在 SAS 语句末尾忘记分号的习惯。即使是经验最丰富的 SAS 程序员也会偶尔忘记分号。如果你能记住这个简单的规则，你就比别人领先了一步。\n\
  \n### SAS 程序的布局\n对于如何格式化你的 SAS 程序，实际上没有任何规定。虽然拥有一个整洁的程序（每个语句独占一行，并使用缩进来显示程序的各个部分）是有帮助的，但并不是必须的。\n\
  \n* SAS 语句可以是大写，也可以是小写。\n* 语句可以延续到下一行（只要你没有把一个单词拆散）。\n* 语句可以与其他语句在同一行。\n* 语句可以从任何一列开始。\n\
  \n所以你看，SAS 是如此灵活，以至于可能写出杂乱到没人能读懂的程序，甚至你自己也不行。（当然，我们不建议这样做。）\n\n### 注释\n为了让你的程序更易于理解，你可以在程序中插入注释。你在注释中写什么都无所谓——SAS\
  \ 不会看它。如果你愿意，甚至可以把你最喜欢的饼干配方放进去。然而，注释通常用于对程序进行注释说明，以便他人阅读你的程序并理解你做了什么以及为什么这样做。\n\n\
  有两种风格的注释可以使用。一种风格以星号（`*`）开头以分号（`;`）结束。另一种风格以斜杠星号（`/*`）开头以星号斜杠（`*/`）结束。下面的程序展示了两种注释风格：\n\
  \n```\n* 将英里转换为公里\nDATA distance;\n   Miles = 26.22;\n   Kilometers = 1.61 * Miles;\n\
  RUN;\n\nPROC PRINT DATA = distance;  /* 输出结果 */  \nRUN;\n```\n\n某些运行环境会将第一列的斜杠星号（`/*`）解释为作业的结束。出于这个原因，我们在书中选择了星号分号风格的注释。然而，使用斜杠星号风格的注释确实有一些优点。因为它们不用分号，所以可以包含嵌入的分号，并且可以放在\
  \ SAS 语句内部。\n\n### 编程技巧\n刚开始学习编程语言的人经常感到沮丧，因为他们的程序在第一次编写时并没有正常运行。编写程序应该分小步进行。不要试图一次性处理一个长而复杂的程序。如果你从小开始，在运行的基础上不断构建，并始终在过程中检查结果，你就会提高编程效率。有时，没有产生错误的程序仍然是错误的。这就是为什么即使没有错误，在过程中检查结果也是至关重要的。如果你确实遇到了错误，不要担心。大多数程序第一次运行都不行，不为其他别的原因，仅仅是因为你是人类。你会忘记分号，拼错一个单词，或者手指在键盘上的位置按错了。这种情况时有发生。通常，一个小小错误就能产生一整串错误。如果你是逐部分构建程序，一旦出现问题，程序将容易纠正得多。此外，在编写程序时，频繁保存是一个好习惯。这样，如果发生意外问题，你就不会丢失工作成果。\n\
  \n## 1.2 SAS 数据集\n在你运行分析之前、在你写报告之前、在你对数据进行任何操作之前，SAS 必须能够读取你的数据。通常来说，SAS 希望你的数据处于一种名为\
  \ SAS 数据集（SAS data set）的特殊形式。（异常情况见第 2.1 节。）将数据导入 SAS 数据集通常非常简单，因为 SAS 非常灵活，可以读取几乎任何数据。一旦你的数据被读入\
  \ SAS 数据集，SAS 就会跟踪内容在什么位置以及以什么形式存在。你只需要指定你想要的数据集的名称和位置，SAS 就会弄清楚里面包含什么。\n\n### 变量与观测值\n\
  数据当然是任何数据集的主要组成部分。在传统的 SAS 术语中，数据由变量（variables）和观测值（observations）组成。采用关系型数据库的术语，SAS\
  \ 数据集也被称为表，观测值也被称为行，变量也被称为列。下面是一个包含小型数据集的矩形表格。每一行代表一个观测值，而 `Id`、`Name`、`Height`\
  \ 和 `Weight` 是变量。数据点 Charlie 是 `Name` 的值之一。\n\n![image](img/f004-01.jpg)\n\n###\
  \ 数据类型\n原始数据以许多不同的形式出现，但 SAS 简化了这一点。在 Base SAS 中只有两种数据类型：数值型（numeric）和字符型（character）。数值型字段就是数字。它们可以进行加减运算，可以有任意位数的数字，也可以是负数。除了数字，数值型字段还可以包含加号（`+`）、减号（`-`）、小数点（`.`）以及用于科学计数法的\
  \ `E`。字符型数据是其他所有内容。它们可以包含数字、字母或特殊字符（如 `$` 或 `!`），且长度可达 32767 个字符。\n\n如果变量包含字母或特殊字符，它必须是字符变量。然而，如果它只包含数字，它可以是数值型或字符型。你应该根据将如何使用该变量来做出决定。有时，纯数字组成的数据作为字符数据比数值数据更合理。例如，美国五位邮编是由数字组成的，但对邮编进行加减没有意义。这些值作为字符数据更合适。在前面的数据集中，`Name`\
  \ 显然是一个字符变量，而 `Height` 和 `Weight` 是数值变量。`Id` 则可以是两者，这取决于你的选择。\n\n### 缺失数据\n有时尽管尽了努力，你的数据可能是不完整的。某些观测值的某个变量值可能缺失。在这种情况下，缺失的字符数据用空白表示，缺失的数值数据用单个句点（`.`）表示。在前面的数据集中，观测值\
  \ 5 的 `Weight` 缺失，它的位置被句点标记。观测值 6 的 `Name` 缺失并直接留空。\n\n### SAS 数据集的大小\n在 SAS 9.1\
  \ 之前，SAS 数据集最多包含 32767 个变量。从 SAS 9.1 开始，SAS 数据集中的最大变量数受计算机可用资源的限制——但超过 32767 个变量的\
  \ SAS 数据集无法在早版本的 SAS 中使用。无论使用哪个版本的 SAS，观测值的数量仅限于你计算机处理和存储它们的能力。\n\n\n\n\n\n# SAS\
  \ 数据库与数据集成员\n\nSAS 数据集通过 SAS 数据库（data libraries）进行存储和访问。SAS 数据库是存储一个或多个 SAS 数据集的集合，这些数据集被存储在相同的位置。某些\
  \ SAS 数据库是系统默认定义的，但你也可以定义自己的库。（参见第 2.2 节。）SAS 数据库内部的每一个数据集被称为其成员（members）。\n\n##\
  \ 变量、SAS 数据库和数据集成员的命名规则\n\n你可以为你的数据中的变量、SAS 数据库以及数据集成员本身命名。创建能够标识数据所含义的名称是有帮助的，特别是对于变量而言。虽然在编写程序时，变量名\
  \ `A`、`B` 和 `C` 看起来非常完美且易于输入，但当你六个月后回来查看程序时，`Sex`（性别）、`Height`（身高）和 `Weight`（体重）可能会更有帮助。\n\
  \n变量名的具体规则取决于系统中 SAS 系统选项 `VALIDVARNAME=` 的值。（有关系统选项的更多信息，请参见第 1.7 节。）但是，如果你遵循以下规则，你的变量名将始终是有效的：\n\
  \n- 变量名长度在 32 个字符或以内。\n- 名称以字母或下划线（`_`）开头。\n- 只包含字母、数字或下划线（`_`）。请不要使用 `%$%!*&#@`。\n\
  \n这些规则适用于 `VALIDVARNAME=V7..`。如果你使用的是 `VALIDVARNAME=ANY`，则规则相同，但变量名可以包含包括空格在内的任何字符。（如何使用包含特殊字符的变量名请参见第\
  \ 3.18 节。）SAS 数据库和数据集成员的命名遵循上述规则，但库的长度限制为 8 个字符。`VALIDVARNAME=` 系统选项对数据库和成员名称没有影响。未来这些规则中的某些可能会发生。\n\
  \n### SAS 名称的大小写\n\n另一个重要点是 SAS 对大小写不敏感，因此你可以使用大写、小写或混合大小——取决于你认为什么最好。SAS 并不在意。数据集名称\
  \ `heightweight` 与 `HEIGHTWEIGHT` 或 `HeightWeight` 是相同的。同样，变量名 `BirthDate` 与 `BIRTHDATE`\
  \ 和 `birThDaTe` 也相同。然而，变量名有一处不同：SAS 会记住每个变量名第一次出现时的大小写，并在打印结果时使用该大小写。这就是为什么在书中我们对变量名使用混合大小写，而对其他\
  \ SAS 名称使用小写。\n\n### 存储在 SAS 数据中的文档\n\n除了实际数据外，SAS 数据集还包含有关数据集的信息，例如名称、创建日期以及创建它时使用的\
  \ SAS 版本。SAS 还存储了每个变量的信息，包括名称、标签（如果有）、类型（数值或字符）、长度（或存储大小）以及在数据集中的位置。这些信息被称为数据集的描述部分（descriptor\
  \ portion），它使得 SAS 数据集具有自文档性。你可以使用 `PROC CONTENTS` 生成关于 SAS 数据集描述部分的报告。（参见第 2.3\
  \ 节。）\n\n# 1.3 DATA Step 和 PROC Step\n\n![image](img/f0006-01.jpg)\n\nSAS 程序由两个基本构建模块组成：DATA\
  \ 步（DATA steps）和 PROC 步（PROC steps）。一个典型的程序从 DATA 步开始，创建或修改 SAS 数据集，然后将数据传递到 PROC\
  \ 步进行处理。这里有一个简单的程序，在 DATA 步中将英里转换为公里，并用 PROC 步打印结果：\n\n![image](img/f0006-02.jpg)\n\
  \nDATA 步和 PROC 步由语句（statements）组成。一个步可能少至一条语句，也可以数百条。大多数语句只在一种类型的步中有效——在 DATA 步中有效但在\
  \ PROC 步中无效，反之亦然。初学者犯的一个常见错误是尝试在错误的步类型中使用语句。如果你记住通常情况下，DATA 步读取和修改数据，而 PROC 步分析数据、执行实用函数或打印报告，那么你犯这种错误的概率就会降低。\n\
  \nDATA 步以 `DATA` 语句开始，理所当然，它以关键字 `DATA` 开头。该关键字后面跟着你为 SAS 数据集起的名称。上面的 DATA 步产生了一个名为\
  \ `DISTANCE` 的 SAS 数据集。除了从外部原始数据文件读取数据外，DATA 步还可以修改现有的 SAS 数据集，并包含 `DO` 循环、`IF-THEN/ELSE`\
  \ 逻辑以及大量的数值和字符函数。DATA 步还可以以你想要的任何方式组合数据集，包括连接（concatenation）和匹配合并（match-merge）。\n\
  \n另一方面，过程（Procedures）以 `PROC` 语句开始，其中关键字 `PROC` 后面是过程的名称（例如 `PRINT`、`SORT` 或 `MEANS`）。大多数\
  \ SAS 过程只有少数几个可能的语句。就像遵循食谱一样，你每次基本上都使用相同的语句或原料。SAS 过程可以完成任何任务，从简单的排序和打印到方差分析和 3D\
  \ 图形。\n\n当 SAS 遇到新步（由 `DATA` 或 `PROC` 语句标记）、`RUN`、`QUIT`、`STOP` 或 `ABORT` 语句；或者如果你在批处理模式下运行，程序结束时，步就会结束。`RUN`\
  \ 语句告诉 SAS 执行该步之前的所有行，并且它们是那些不属于 DATA 步或 PROC 步的罕见全局语句之一。在步与步之间没有插入 `RUN` 语句，但包含它们是一个好习惯。在步之间保留\
  \ `RUN` 语句会让你的程序更易阅读和调试。\n\n当 SAS 遇到新步（由 `DATA` 或 `PROC` 语句标记）时，步结束；PROC 步以 `RUN`\
  \ 语句结束，这与程序的结束相重合。\n\n虽然典型的程序从 DATA 步开始输入或修改数据，然后将数据传递给 PROC 步，但这绝不是混合 DATA 步和 PROC\
  \ 步的唯一模式。就像你可以按任何顺序堆叠构建块一样，你也可以按任何顺序排列 DATA 步和 PROC 步。程序甚至可以只包含 DATA 步或只包含 PROC\
  \ 步。\n\n回顾一下，下表概述了 DATA 步和 PROC 步之间的基本差异：\n\n![image](img/f0007-01.jpg)\n\n阅读此表格时，请记住由于\
  \ SAS 非常灵活，它们者的差异实际上更加模糊。上面的表格并不是意味着 PROC 步从不创建 SAS 数据集（大多数都会），或者 DATA 步从不产生报告（它们可以）。尽管如此，如果你理解\
  \ DATA 步和 PROC 步的基本功能，编写 SAS 程序将容易得多。\n\n# 1.4 DATA 步的内置循环\n\nDATA 步读取并修改数据，它们以灵活的方式进行，赋予你对数据处理的大量控制。然而，DATA\
  \ 步也有一个底层结构，一个隐式的内置循环。你不需要告诉 SAS 执行这个循环：SAS 会自动执行。记住这一句：\n\nDATA 步逐行且逐观测值执行。\n\n\
  DATA 步逐行执行的想法非常直观且易于理解。这意味着默认情况下，SAS 在执行 DATA 步的第二行之前执行第一行，在执行第二行之前执行第三行，依此类推。这似乎是常识，但新用户经常因为在创建变量之前就尝试使用它而遇到问题。\n\
  \n\n\n\n\n并不显而易见的是，虽然 `DATA` 步骤逐行执行，但它们也是以观测值（observation）为单位执行的。这意味着 SAS 会获取第一个观测值并让其一直运行整个\
  \ `DATA` 步骤（当然是逐行运行），然后再循环读取第二个观测值。通过这种方式，SAS 每次只看到一个观测值。\n\n想象一下一个以慢动作运行的 SAS 程序：SAS\
  \ 从你的输入数据集中读取第一条观测值。然后，SAS 使用该观测值执行你的 `DATA` 步骤。如果 SAS 到达 `DATA` 步骤结束而没有遇到任何严重错误，那么\
  \ SAS 将当前观测值写入一个新的输出数据集，并返回 `DATA` 步骤的开头处理下一个观测值。在最后一个观测值写入输出数据集后，SAS 终止 `DATA`\
  \ 步骤并移动到下一个步骤（如果有的话）。慢动作结束；请恢复正常的千赫兹频率。\n\n此图说明了观测值是如何流过 `DATA` 步骤的：\n\n![image](img/f0008-01.jpg)\n\
  \nSAS 读取第一条观测值，并使用 `DATA` 步骤的第一行进行处理，然后是第二行，依此类推，直到 SAS 到达 `DATA` 步骤的结束。然后 SAS 将该观测写入输出数据集。此图显示了逐行循环的首次执行。一旦\
  \ SAS 完成对第一个观测值的处理，它就会跳回 `DATA` 步骤的顶部并获取第二个观测值。在 SAS 输出最后一个观测值后，它会自动停止。\n\n这是一个类比。`DATA`\
  \ 步骤的处理有点像投票。当你到达投票站时，你站在其他来投票的人后面。当你排到队首时，你会被问一些标准问题：“你的名字叫什么？你住在哪里？”然后你签名并投票。在这一类比中，人就是观测值，而投票过程就是\
  \ `DATA` 步骤。人们一次投一次票（或一个一个观测值地投）。每位选民的选择都是秘密的，偷看邻居的选票绝对是不被允许的。此外，每个人都以相同的顺序（逐行）完成过程的每一个步骤。你不能在给出姓名和地址之前投票。一切都必须按照正确的顺序进行。\n\
  \n如果这看起来有点太结构化了，不要担心。`DATA` 步骤非常灵活。SAS 提供了许多方法来覆盖逐行和逐观测值的结构。这些包括 `RETAIN` 语句（见第\
  \ 3.15 节）和 `OUTPUT` 语句（见第 3.10 和 3.11 节）。甚至可能不读取或修改现有数据的 `DATA` 步骤。这里是上一节中的 `DATA`\
  \ 步骤。如果你查看它，可能会发现一些有趣的东西。\n\n```\nDATA distance;\n   Miles = 26.22;\n   Kilometers\
  \ = 1.61 * Miles;\nRUN;\n```\n\n这个简单的 `DATA` 步骤没有输入数据集。因此，SAS 将执行一次 `DATA` 步骤，输出单个观测值，然后终止\
  \ `DATA` 步骤，因为没有更多的观测值需要处理了。`DATA` 步骤将在第 2、3 和 6 章中进行详细介绍。\n\n## 1.5 选择运行 SAS 的方法\n\
  \n到目前为止我们讨论了如何编写 SAS 程序，但仅仅编写程序并不能给你带来任何结果。就像给你的国会代表写信，除非寄出去，否则没用一样，SAS 程序在运行之前也无事于事。\n\
  \n近年来，运行 SAS 程序的方法层出不穷。以下方法包含在 Base SAS 中：SAS Enterprise Guide、SAS Studio、SAS 窗口环境以及批处理或后台模式。最适合你的方法取决于你的偏好和你的操作系统环境。如果你在一个有许多用户的大站点使用\
  \ SAS，那么请询问一下，看看哪种方法最受认可。如果你在自己的个人电脑上使用 SAS，请选择适合你的方法。\n\n![image](img/f0010-01.jpg)\n\
  \n### SAS Enterprise Guide\n通过 SAS Enterprise Guide 中的任务（tasks）和查询（queries），你无需编写单行代码即可编写并运行\
  \ SAS 程序。任务和查询是生成 SAS 代码的点击式窗口。然而，你也可以打开程序窗口（Program window）并编写自己的程序。SAS Enterprise\
  \ Guide 中的程序编辑器会对你的程序进行颜色编码，并在你输入时显示自动语法帮助。还有一个程序分析器，可以生成你的程序图，帮助你可视化各个步骤以及它们是如何结合的。如果你在多台计算机上安装了\
  \ SAS（可能在本地机器和服务器上），那么你可以选择 SAS 在何处运行你的代码。在 SAS Enterprise Guide 中，你可以将相关的程序、SAS\
  \ 日志、结果和数据引用存储在一个名为“项目”（project）的单文件中。SAS Enterprise Guide 以优雅的流程图显示项目，因此很容易看出各种数据集、程序和任务是如何协作的。你可以在数据网格（Data\
  \ Grid）中查看和编辑 SAS 数据集。如果你的程序创建新的 SAS 数据集，默认情况下 SAS Enterprise Guide 会自动显示它。SAS Enterprise\
  \ Guide 在 Windows 下运行。\n\n欲良好介绍 SAS Enterprise Guide，请在网上搜索视频“Getting Started with\
  \ SAS Enterprise Guide”。\n\n![image](img/f0010-02.jpg)\n\n### SAS Studio\nSAS Studio\
  \ 运行在网络浏览器中。通过 SAS Studio，你可以访问本地机器或服务器上的 SAS。与 SAS Enterprise Guide 类似，SAS Studio\
  \ 拥有可以生成代码的任务和查询，你也可以打开程序窗口并输入自己的程序。当你编写程序时，SAS Studio 会对程序进行颜色编码并显示自动语法帮助。你可以查看\
  \ SAS 数据集，如果你的程序创建了新的 SAS 数据集，默认情况下 SAS Studio 会自动显示它。\n\nSAS Studio 是 University\
  \ Edition 和 SAS OnDemand for Academics 的界面，这些适用于学术非商业用途。当你下载 University Edition\
  \ 时，它会在你的本地计算机上安装一个虚拟 Linux 服务器以及 SAS 软件。SAS OnDemand for Academics 运行在 SAS 托管的\
  \ Linux 服务器上。无论你的本地计算机运行什么操作系统（Windows、Linux 或 Mac 的 OS X），University Edition 和\
  \ SAS OnDemand for Academics 都在 Linux 服务器上运行。你通过本地的 SAS Studio 访问这些 Linux 服务器。\n\
  \n欲良好介绍 SAS Studio，请在网上搜索视频“Getting Started with SAS Studio”。\n\n![image](img/f0011-01.jpg)\n\
  \n### SAS 窗口环境\n也称为显示管理器（Display Manager），SAS 窗口环境是运行 SAS 最早的交互界面。它的功能少于 SAS Enterprise\
  \ Guide 或 SAS Studio，但你仍然可以编写和编辑 SAS 程序、运行程序并查看打印结果。SAS 窗口环境有一个语法敏感编辑器，会对程序进行颜色编码。有窗口用于执行任务，如管理\
  \ SAS 文件、访问 SAS 帮助和文档以及导入或导出数据。此外，你可以使用 Viewtable 窗口查看和编辑 SAS 数据集。SAS 窗口环境不会自动显示程序创建的新\
  \ SAS 数据集。但你可以通过 SAS Explorer 窗口（位于左侧）中导航并双击图标来手动打开数据集。\n\n欲良好介绍 SAS 窗口环境，请在网上搜索视频“Getting\
  \ Started with the SAS Windowing Environment”。\n\n\n\n\n\n# 批处理或后台模式\n\n在批处理或后台模式下，你将\
  \ SAS 程序保存在文件中。你可以使用上述任一 `SAS` 接口或使用 `Microsoft Notepad` 等文本编辑器创建该文件。然后，你提交该文件由\
  \ `SAS` 处理。你的 `SAS` 程序可能会立即开始执行，也可以在你指定的时间（例如午夜）开始，或者被置于其他任务的队列中。提交任务后，你可以处理其他事情，或者更好，是去看场棒球赛，一边玩一边让\
  \ `SAS` 在后台工作。批处理是设置生产作业以按计划自动运行的方便方法，例如每周一次或每月一次。当你的任务完成后，结果将存放在一个或多个文件中，你可以随时显示或打印这些文件。\n\
  \n要了解如何提交 SAS 程序进行批处理，请检查适用于你操作系统环境的 SAS 文档，或咨询你所在地的其他 SAS 用户。即使是具有相同操作系统环境的站点，也可能有不同的批处理模式提交方法。\n\
  \n## 1.6 读取 SAS 日志\n\n每当你提交 SAS 程序时，`SAS` 都会在你的日志中写入信息。许多 SAS 程序员忽略 SAS 日志而直接查看输出。这可以理解，但是有危险的。完全有可能——而且这种情况迟早会发生在我们每个人身上——得到看起来完全正常的虚假结果。知道它们很糟糕的唯一方法是检查\
  \ SAS 日志。仅仅程序运行了并不意味着它是正确的。\n\n### 在哪里找到 SAS 日志\n\nSAS 日志的位置取决于你使用的操作系统环境、提交程序的方法（`SAS\
  \ windowing environment`、`SAS Enterprise Guide`、`SAS Studio` 或 `batch`）以及本地设置。如果你在\
  \ `SAS windowing environment` 中提交程序，默认情况下你将在 `Log` 窗口看到 SAS 日志。在 `SAS Enterprise\
  \ Guide` 和 `SAS Studio` 中，默认情况下你会看到一个 `Log` 标签页。\n\n如果你以批处理模式提交程序，日志将写入一个文件，你可以使用操作系统的查看和打印命令来查看或打印它。日志文件的名称通常是你给原始程序命名称的某种组合。例如，如果你将\
  \ SAS 程序命名为 `Marathon.sas`，那么你的日志文件很有可能是 `Marathon.log`。\n\n### 日志包含的内容\n\n人们倾向于认为\
  \ SAS 日志要么是程序的重复，要么只是一堆乱码。好吧，我们承认，SAS 日志中确实有一些技术杂项，但也有许多重要信息。这是一个将英里转换为公米并打印结果的简单程序：\n\
  \n```sas\n* 创建一个名为 distance 的 SAS 数据集\n* 将英里转换为公米\nDATA distance;\n    Miles = 26.22;\n\
  \    Kilometers = 1.61 * Miles;\nRUN;\n* 打印结果\nPROC PRINT DATA = distance;\nRUN;\n\
  ```\n\n如果你运行这个程序，`SAS` 将产生一个类似下面的日志：\n\n```\n❶ NOTE: Copyright (c) 2016 by SAS Institute\
  \ Inc., Cary, NC, USA.\n  NOTE: SAS (r) Proprietary Software Version 9.4 (TS1M6\
  \ MBCS3170)\n      Licensed to XYZ Inc., Site 0099999001.\n  NOTE: This session\
  \ is executing on the W64_8HOME platform.\n  NOTE: SAS initialization used:\n  \
  \    real time            1.40 seconds\n      cpu time            0.96 seconds\n\
  ❶ 1   * Create a SAS data set named distance;\n   2    * Convert miles to kilometers;\n\
  \   3   DATA distance;\n   4        Miles = 26.22;\n   5        Kilometers = 1.61\
  \ * Miles;\n   6   RUN;\n❸ NOTE: The data set WORK.DISTANCE has 1 observations and\
  \ 2 variables.\n❹ NOTE: DATA statement used (Total process time):\n      real time\
  \            0.03 seconds\n      cpu time            0.03 seconds\n❷ 7   * Print\
  \ the results;\n   8    PROC PRINT DATA = distance;\n   9    RUN;\n  NOTE: There\
  \ were 1 observations read from the data set WORK.DISTANCE.\nNOTE: PROCEDURE PRINT\
  \ (Total process time):\n      real time            0.01 seconds\n      cpu time\
  \            0.00 seconds\n```\n\n上面的日志显示了各种类型的消息。\n\n`❶ NOTE`: 这些是信息性消息。\n`❷ NOTE`:\
  \ 这些表示已读取数据。\n`❸ NOTE`: 这些提供了关于数据集本身的信息。\n`❹ NOTE`: 这些提供了处理时间的信息。\n\n## 1.7 使用系统选项\n\
  \n系统选项是你可以更改的参数，它们会影响 SAS 的工作方式、输出外观、内存使用量、错误处理以及许多其他事项。SAS 对你希望它如何工作有许多假设。你并不希望每次都指定每个微小的细节。系统选项为你提供了改变这些假设的方法。\n\
  \n### OPTIONS 过程\n\n并不是所有的选项适用于所有的操作系统环境。你可以通过 `OPTIONS` 过程查看选项列表及其当前值。要使用 `OPTIONS`\
  \ 过程，请提交以下 SAS 程序并在 SAS 日志中查看结果：\n\n```sas\nPROC OPTIONS;\nRUN;\n```\n\n`PROC OPTIONS`\
  \ 产生的选项列表很长，可能会让人眼目缭乱。如果你知道特定的选项，可以只请求那些选项。此语句将只显示 `MISSING`、`VALIDVARNAME` 和 `YEARCUTOFF`\
  \ 系统选项：\n\n```sas\nPROC OPTIONS OPTION = (MISSING VALIDVARNAME YEARCUTOFF);\nRUN;\n\
  ```\n\n### 修改选项设置\n\n有多种方法指定系统选项：\n\n1. 创建包含系统选项设置的 SAS 配置文件。SAS 每次启动时都会访问该文件。配置文件由系统管理员创建（如果你使用个人电脑，则可能是你）。\n\
  2. 在从系统提示符（称为调用）启动 SAS 时指定系统选项。\n3. 在 autoexec 文件中指定系统选项，或者在 SAS Studio 的 Edit Autoexec\
  \ File 窗口中指定，或者在 SAS Enterprise Guide 的 autoexec 流程中指定。\n4. 在你的 SAS 程序中使用 `OPTIONS`\
  \ 语句。如果你使用的是 SAS 窗口环境，可以在 SAS 系统选项窗口中指定选项。\n\n这里按优先级递增列出了方法；方法 2 将覆盖方法 1，方法 3 将覆盖方法\
  \ 2，以此此类推。在 SAS 窗口环境中，SAS 系统选项窗口和 `OPTIONS` 语句会相互覆盖——因此最后使用的那个将生效。\n\n**OPTIONS\
  \ 语句**\n\n`OPTIONS` 语句以关键字 `OPTIONS` 开始，后面跟随着一系列选项及其值。例如：\n\n```sas\nOPTIONS LEFTMARGIN\
  \ = 1IN NODATE;\n```\n\n\n\n\n\n`OPTIONS` 语句是 SAS 特殊语句之一，它不属于任何 `PROC` 步或 `DATA`\
  \ 步。这个全局语句可以出现在 SAS 程序的任何位置，但通常让它位于程序的第一行是最合理的。这样你就可以轻松地看到哪些选项正在生效。如果 `OPTIONS`\
  \ 语句位于 `DATA` 或 `PROC` 步中，则它将影响该步以及随后的任何步。程序中随后的 `OPTIONS` 语句将覆盖之前的语句。通过这种方式设置的系统选项仅适用于你当前的程序或会话。一旦退出\
  \ SAS，系统选项将恢复为默认值。\n\n### 选定的通用选项\n以下是你可能想要使用的某些系统选项：\n\n| `CENTER | NOCENTER` |\
  \ 控制输出是居中还是左对齐。默认值为 `CENTER`。 |\n| `DATASTMTCHK = *value*` | 指定哪些 SAS 语句关键字被禁止指定为数据集名称，以防止覆盖输入数据集。示例请参见第\
  \ 11.3 节。可能的值包括 `COREKEYWORDS`（默认值）、`ALLKEYWORDS` 或 `NONE`。 |\n| `DATESTYLE = *value*`\
  \ | 当 `ANYDTDTE.` 格式不明确时，确定月、日、年的顺序。可能的值包括 `MDY`（默认值）、`DMY` 和 `YMD`。请参见第 3.13 节。\
  \ |\n| `MISSING = '*character*'` | 指定用于打印数值缺失数值的字符（可以是空格）。默认值是点（`..`）。 |\n| `YEARCUTOFF\
  \ = *n*` | 指定日期格式和函数在读取两位数年份时使用的 100 年跨度的起始年份。详情请参见第 3.13 节。默认值各异。 |\n| `VALIDVARNAME=\
  \ *value*` | 指定有效 SAS 变量名的规则。可能的值包括 `V7` 和 `ANY`。`V7` 的规则请参见第 1.2 节。使用 `ANY` 时，变量可以使用包括空格的特殊字符，但包含特殊字符的名称必须使用形式\
  \ `'*variable-name*'`N 的名称字面量。示例请参见第 3.18 节。默认值各异。 |\n\n### 选定的打印选项\n以下选项会影响用于打印格式的结果显示方式，例如\
  \ PDF 和 RTF（即非 HTML）：\n\n| `DATE | NODATE` | 控制今天的日期是否出现在每页输出的顶部。默认值是 `DATE`。 |\n\
  | `NUMBER | NONUMBER` | 控制每页 SAS 输出上是否显示页码。默认值为 `NUMBER`。 |\n| `ORIENTATION = orientation`\
  \ | 指定打印输出的横竖方向，可以是 `LANDSCAPE`（横向）或 `PORTRAIT`（竖向）。默认值为 `PORTRAIT`。 |\n| `PAGENO\
  \ = n` | 从 `n` 开始为输出页进行编号。默认值为 1。 |\n| `RIGHTMARGIN = n LEFTMARGIN = n TOPMARGIN\
  \ = n BOTTOMMARGIN = n` | 指定用于打印输出的边距大小（例如 0.75 英寸或 2 厘米）。默认值为 0.00 英寸。 |\n\n“实践是最好的老师。”\n\
  PUBLIUS SYRUS, 公元前 42 年\n\n“我们都是通过实践、通过实验（通常会失败）以及提问来学习的。”\nJAY JACOB WIND\n\n摘自\
  \ John Bartlett 编写的 *Bartlett’s Familiar Quotations* 第 13 版，版权所有 1955 Little Brown\
  \ & Company 所有。公有领域。\n摘自 SAS L Listserv，1994 年 3 月 15 日。经作者许可转印。\n\n# 第 2 章：访问你的数据\n\
  \n- 2.1 将数据导入 SAS 的方法\n- 2.2 SAS 数据库和数据集\n- 2.3 列出 SAS 数据集的内容\n- 2.4 使用 IMPORT 过程读取\
  \ Excel 文件\n- 2.5 使用 XLSX LIBNAME 引擎访问 Excel 文件\n- 2.6 使用 IMPORT 过程读取分隔符分隔的文件\n\
  - 2.7 告诉 SAS 在何处找到你的原始数据\n- 2.8 读取由空格分隔的原始数据\n- 2.9 读取按列排列的原始数据\n- 2.10 读取非标准格式的原始数据\n\
  - 2.11 选定的格式符 (Informats)\n- 2.12 混合输入样式\n- 2.13 读取混乱的原始数据\n- 2.14 每个观测值读取多行原始数据\n\
  - 2.15 每行原始数据读取多个观测值\n- 2.16 读取原始数据文件的部分\n- 2.17 通过 INFILE 语句中的选项控制输入\n- 2.18 使用\
  \ DATA 步读取分隔符分隔的文件\n\n## 2.1 将数据导入 SAS 的方法\n\n![image](img/f0018-01.jpg)\n\n数据以许多不同的形式存在。你的数据可能是手写在纸上的，也可能是输入到计算机的原始数据文件中。也许你的数据存储在你个人电脑的数据库文件中，或者在办公室服务器上的数据仓库中。无论你的数据存储在何处，SAS\
  \ 都有方法可以使用它们。你可能需要将数据从一种形式转换为另一种形式，或者 SAS 能够以当前形式使用你的数据。本节概述了将数据导入 SAS 的几种方法。这些方法中的大部分在书中都有介绍，但少数较高级的方法仅作提及，让你知道它们的存在。无论你的数据存储在何处，书中都至少有一种方法适用于你。\n\
  \n访问数据的方法可以分为五类：\n\n1. 使用 SAS 数据集\n2. 直接输入数据集\n3. 从原始数据文件创建 SAS 数据集\n4. 将其他软件的文件转换为\
  \ SAS 数据集\n5. 直接读取其他软件的文件\n\n### 使用 SAS 数据集\n如果你的数据已经存储为 SAS 数据集，你只需要告诉 SAS 使用哪个数据集。SAS\
  \ 数据集通过数据库（Libraries）存储和访问。SAS 数据库是存储在相同位置的数据集。某些 SAS 数据库是默认定义的，你也可以定义自己的。SAS 数据库中的单个数据集称为成员（Members）。关于数据库和成员的更多信息请参见下一节。\n\
  \n### 直接输入数据集\n有时获取数据的最佳方法是通过键盘直接输入 SAS 数据集。\n\n- `Viewtable` 窗口是 SAS 窗口环境的一部分，包含在\
  \ Base SAS 软件中。`Viewtable` 允许以表格格式输入数据。你可以定义变量（也称为列）并赋予它们名称、长度和类型（字符或数字）等属性。\n-\
  \ `Data Grid` 是 SAS Enterprise Guide 的一部分，Base SAS  适用于 Windows。与 `Viewtable` 一样，你可以定义变量、赋予属性，然后输入数据。\n\
  \n### 从原始数据文件创建 SAS 数据集\n本章的大部分致力于读取原始数据文件（也称为文本、ASCII、顺序或平面文件）。你始终可以使用 Base SAS\
  \ 软件读取原始数据文件。如果你的数据尚未以原始数据文件形式存在，你可以将其转换为原始数据文件。读取原始数据文件有两种通用方法：\n\n- `DATA` 步非常灵活，几乎可以读取任何类型的原始数据文件。该方法在本章中从第\
  \ 2.7 节开始介绍。\n- `IMPORT` 过程见第 2.6 节，适用于运行在 UNIX 和 Windows 操作系统上的 Base SAS。这是读取特定类型原始数据文件（包括制表符分隔和逗号分隔值\
  \ CSV 文件）的简便方法。\n\n\n\n\n\n# 将其他软件的数据文件转换为 SAS 数据集\n\n每个软件应用程序都有自己的数据文件格式。这对于软件开发人员很有用，但对于软件用户来说却很麻烦——当你的数据在一个应用程序中，但你需要用另一个应用程序进行分析时。转换数据有几种方法可用：\n\
  \n- `IMPORT` 过程适用于 UNIX 和 Windows 操作系统，可将 Microsoft Excel（在第 2.4 节介绍）、Lotus、dBase、Stata、SPSS、JMP、Paradox\
  \ 和 Microsoft Access 文件转换为 SAS 数据集。除了 JMP 之外，所有这些文件都要求你的 SAS 服务器上安装了 `SAS/ACCESS\
  \ Interface to PC Files`。\n- 如果你没有 `SAS/ACCESS` 软件，你始终可以从应用程序中创建一个原始数据文件，并使用 `DATA`\
  \ 步或 `IMPORT` 过程读取该原始数据文件。许多应用程序可以创建 CSV 文件，可以使用 `IMPORT` 过程（在第 2.6 节介绍）或 `DATA`\
  \ 步（在第 2.18 节介绍）轻松读取。\n\n## 直接读取其他软件的数据文件\n\n在某些情况下，你可能无需转换为 SAS 数据集即可读取数据。当你有许多人更新数据文件，并且你想确保自己使用的是最新数据时，这种方法特别有用。\n\
  \n- `SAS/ACCESS` 产品允许你在不将数据转换为 SAS 数据集的情况下读取数据。针对大多数流行的数据库管理系统（包括 Oracle、DB2、MySQL\
  \ 和 Teradata），都有 `SAS/ACCESS` 产品。这种数据访问方法本文未涵盖。\n- `SAS/ACCESS Interface to PC Files`\
  \ 也允许你直接读取某些 PC 文件类型而无需将其转换为 SAS 数据集，包括 Excel（在第 2.5 节介绍）、Access 和 JMP。SAS 使用原生格式访问\
  \ PC 文件的一种方法称为 `LIBNAME` 引擎。要告诉 SAS 你想要读取的文件类型，你需要指定一个包含特定引擎选项的 `LIBNAME` 语句。有关\
  \ `LIBNAME` 引擎的更多信息，请参考 SAS 文档。\n- 还有 `LIBNAME` 引擎允许你直接读取数据，它们 Base SAS 软件的一部分（因此你不需要\
  \ `SAS/ACCESS Interface to PC Files`）。存在针对 SPSS、OSIRIS、旧版本 SAS 数据集以及传输格式 SAS 数据集的引擎。请检查你操作环境的\
  \ SAS 文档以获取可用引擎的完整列表。\n\n鉴于所有这些将数据导入 SAS 的方法，你一定能找到至少一种适用于你的方法——很可能更多。\n\n## 2.2\
  \ SAS 数据库和数据集\n\n这并不总是显而易见的，但所有 SAS 数据集都有一个两级名称，例如 `WORK.BANANA`。第一级被称为 `libref`（SAS\
  \ 数据库引用的缩写），第二级是成员名，用于在库中唯一标识该数据集。SAS 数据库是存储在相同位置的 SAS 数据集的集合。因此，`libref` 就像是该位置的昵号。有时\
  \ `libref` 指的是物理位置，例如硬盘或闪存器。有时它指的是的是逻辑位置，如目录或文件夹。\n\n`libref` 和成员名都遵循 SAS 命名的标准规则。它们必须以字母或下划线开头，并且仅包含字母、数字或下划线。然而，`librefs`\
  \ 的长度不能超过 8 个字符，而成员名可以长 32 个字符。（有系统选项允许你违反这些规则，且默认值可能会发生，如果你有疑问，请检查 SAS 文档。）\n\n\
  ### 内置 SAS 数据库\n\nSAS 自带了一些内置库。你可以使用的具体库取决于你安装了哪些 SAS 产品以及你是否有任何本地定义的库，但始终会包含这些：\n\
  \n| 库 |  |\n| :--- | :--- |\n| `WORK` | 是用于临时 SAS 数据集的特殊库。退出 SAS 时，`WORK` 库会被擦除。如果你在数据集名称中没有指定\
  \ `libref`，`WORK` 就是默认库。 |\n| `SASHELP` | 包含你可以使用的示例数据集，且通常是只读的。 |\n| `SASUSER`\
  \ | 是提供给你保存数据集的库。该库在大多数系统上是永久的。但在 z/OS 和某些 UNIX 系统中，它可能是临时的或只读的。如果你有多个 SAS 服务器，那么每个服务器上都可能有一个\
  \ `SASUSER` 库。 |\n\n### 临时 SAS 数据\n\n如果你创建了一个以后不需要的数据集，将其设置为临时是一个好主意，这样你的磁盘就不会混乱。以下是第\
  \ 1 节所示的 `DATA` 步：\n\n```\nDATA distance;\n    Miles = 26.22;\n    Kilometers =\
  \ 1.61 * Miles;\nRUN;\n```\n\n此 `DATA` 步创建了一个临时数据集。注意数据集名称不包含 `libref` `WORK`。因为\
  \ `DATA` 语句使用单级名称，SAS 分配了默认库 `WORK`，并将 `DISTANCE` 作为该库中的成员名。日志包含显示完整两级名称的备注：\n\n\
  `NOTE: The data set WORK.DISTANCE has 1 observations and 2 variables.`\n\n### 使用直接引用的永久性\
  \ SAS 数据集\n\n通常，如果你使用一个数据集超过一次，将其保存为永久性 SAS 数据集比每次使用时都创建一个新的临时数据集要高效得多。\n\n以下是不同操作系统环境下直接引用的\
  \ `DATA` 语句的通用形式：\n\n- Windows: `DATA 'drive:\\filename';`\n- UNIX 或 Linux: `DATA\
  \ '/home/path/filename';`\n- z/OS: `DATA 'data-set-name';`\n\n此程序与之前的相同，只是它包含了带引号的文件路径和名称（使用\
  \ Windows 环境语法）：\n\n```\nDATA 'c:\\MySASLib\\distance';\n    Miles = 26.22;\n  \
  \  Kilometers = 1.61 * Miles;\nRUN;\n```\n\n这次日志包含显示文件路径的备注：\n\n`NOTE: The data\
  \ set c:\\MySASLib\\distance has 1 observations and 2 variables.`\n\nSAS 日志没有显示\
  \ `libref`，但如果你检查 SAS 库，你会发现 SAS 创建了一个 `WC00001` 的库，并包含一个名为 `DISTANCE` 的数据集。Librefs\
  \ 是临时的，但由于数据集不在 `WORK` 库中，它是永久的。\n\n### 使用 LIBNAME 语句的永久性 SAS 数据\n\n如果你在同一个 SAS\
  \ 数据库中读取或写入多个数据集，使用 `LIBNAME` 语句比反复输入文件路径和名称更容易且更不容易出错。以下是不同操作系统环境下 `LIBNAME` 语句的通用形式：\n\
  \n- Windows: `LIBNAME libref 'drive:\\directory';`\n- UNIX 或 Linux: `LIBNAME libref\
  \ '/home/path';`\n- z/OS: `LIBNAME libref 'data-set-name';`\n\n此程序与之前的两个相同，只是使用\
  \ `LIBNAME` 语句定义了一个 `libref`。注意 `DATA` 语句使用了两级名称 `MARATHON.DISTANCE`。\n\n```\nLIBNAME\
  \ marathon 'c:\\MySASLib';\n\nDATA marathon.distance;\n    Miles = 26.22;\n    Kilometers\
  \ = 1.61 * Miles;\nRUN;\n```\n\n这次日志包含显示两级数据集名称的备注：\n\n`NOTE: The data set MARATHON.DISTANCE\
  \ has 1 observations and 2 variables.`\n\n\n\n\n\n这是一个永久性 SAS 数据集，因为 `libref` 不为\
  \ `WORK`。如果你查看计算机上的文件目录，将不会看到一个名为 `MARATHON.DISTANCE` 的文件。这是因为操作系统环境有它们自己的文件命名系统。当在\
  \ Windows 或 UNIX 下运行时，此数据集将被命名为 `distance.sas7bdat`。在 z/OS 下，文件名将是 `LIBNAME` 语句中指定的\
  \ `data-set-name`。本节中的示例都创建了 SAS 数据集，下一节将展示一个示例，用于访问已存在的永久性 SAS 数据集。\n\n## 2.3 列出\
  \ SAS 数据集的内容\n\n要使用 SAS 数据集，你只需要告诉 SAS 你想要的数据集的名称和位置，SAS 就会识别出其中包含的内容。SAS 能够做到这一点是因为\
  \ SAS 数据集是自文档的，换句话说，SAS 会自动与数据同一起存储有关该数据集的信息（称为描述部分）。有一种简单的方法可以查看有关你数据集的信息，即使用 `PROC\
  \ CONTENTS`。\n\n`PROC CONTENTS` 是一个简单的过程。你只需要输入关键字 `PROC CONTENTS` 并使用 `DATA=` 指定你想要的数据集：\n\
  \n```\nPROC CONTENTS DATA = *data-set*;\n```\n\n示例：`SASHELP` 数据库包含示例数据集，并随 Base\
  \ SAS 直接提供。以下 `PROC CONTENTS` 将生成一个关于 `SASHELP` 数据库中 `CARS` 数据集的报告。由于 `SASHELP`\
  \ 库是默认定义的，因此不需要 `LIBNAME` 语句。\n\n* 使用 `PROC CONTENTS` 描述 `SASHELP` 库中的 `CARS` 数据集；\n\
  \n```sas\nPROC CONTENTS DATA = SASHELP.CARS;\nRUN;\n```\n\n`PROC CONTENTS` 的输出类似于你数据集的目录：\n\
  \n| **CONTENTS 过程** | | |\n| :--- | :--- |\n| ❶ **数据集名称** | `SASHELP.CARS` | ❷ **观测值**\
