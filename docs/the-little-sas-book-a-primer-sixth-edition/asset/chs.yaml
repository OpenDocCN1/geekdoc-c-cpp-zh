  输出从关于你数据集的信息开始，然后描述每个变量。\n\n| 对于数据集 | 对于每个变量 |\n| :--- | :--- |\n| ❶ 数据集名称 | ❻ 变量名\
  \ |\n| ❷ 观测值 | ❼ 类型（数值或字符） |\n| ❸ 变量 | ❽ 长度（字节） |\n| ❹ 创建时间 | ❾ 格式（如果存在） |\n| ❺\
  \ 标签 | ❿ 标签（如果存在） |\n\n## 2.4 使用导入过程读取 Excel 文件\n\nSAS 提供了许多方法来访问 Excel 数据。事实上，在\
  \ SAS 和 Excel 之间可以使用 `PROC IMPORT` 交换数据。以下是 `PROC IMPORT` 的通用形式：\n\n```sas\nPROC\
  \ IMPORT DATAFILE = 'filename' OUT = data-set DBMS = identifier REPLACE;\n```\n\n\
  其中 `filename` 是要读取的文件，`data-set` 是要创建的数据集。`REPLACE` 选项如果数据集已存在则进行替换。`DBMS=` 选项告诉\
  \ SAS 要读取的 Excel 类型。常用的标识符有 `EXCEL`、`XLS` 和 `XLSX`。在 UNIX 环境下，使用 `XLS` 处理旧文件 (.xls)，使用\
  \ `XLSX` 处理新文件 (.xlsx)。在 Windows 环境下，除了 `XLS` 和 `XLSX`，你还可以使用 `EXCEL` 读取所有类型的 Excel\
  \ 文件。`EXCEL` 使用读取文件的技术与 `XLS` 和 `XLSX` 不同，因此结果可能会不同。默认情况下，`XLS` 和 `XLSX` 查看更多数据行以确定列类型。\n\
  \n如果你的文件中有多个工作表，可以使用以下语句指定要读取的工作表：\n\n```sas\nSHEET = 'sheet-name';\n```\n\n如果你只想读取工作表的特定单元格，可以指定范围。范围可以是命名区域（如果已定义），也可以指定左上角（UL）和右下角（LR）单元格：\n\
  \n```sas\nRANGE = 'sheet-name$UL:LR';\n```\n\n默认情况下，导入过程会从电子表格的第一行获取变量名。如果你不想这样做，可以在过程中添加以下语句，SAS\
  \ 将为你的变量命名为 A、B、C 等。\n\n```sas\nGETNAMES = NO;\n```\n\n当使用 `EXCEL` 标识符时，如果某列同时包含数值和字符值，默认情况下，数值将转换为缺失值。为了将数值作为字符值读取而不是转换为缺失值，请使用以下语句：\n\
  \n```sas\nMIXED = YES;\n```\n\n示例：假设你有一个下面的电子表格，包含关于木兰的数据。对于每种树，文件包含了科学名称和通用名称、最大高度、从种子种植后首次开花的年龄、是常绿还是落叶以及花的颜色。\n\
  \n![image](img/f0025-01.jpg)\n\n以下程序使用 `PROC IMPORT` 配合 `XLSX` DBMS 标识符和 `REPLACE`\
  \ 选项读取 Microsoft 文件，并创建一个名为 `MAGNOLIA` 的永久数据集。\n\n```sas\nLIBNAME sasfiles 'c:\\\
  MySASLib';\n\n* 使用 PROC IMPORT 读取 Excel 电子表格\nPROC IMPORT DATAFILE = 'magnolias.xlsx'\
  \ OUT = sasfiles.MAGNOLIA DBMS = XLSX REPLACE;\n```\n\n\n\n\n```sas\nPROC IMPORT\
  \ DATAFILE = 'c:\\MyExcel\\Trees.xlsx' OUT = sasfiles.magnolia\n    DBMS = XLSX\
  \ REPLACE;\nRUN;\n```\n\n这里是 `MAGNOLIA` 数据集。你可以在 SAS Enterprise Guide 或 SAS Studio\
  \ 的 `Output Data`（输出数据）选项页中查看数据，或者在 SAS 窗口环境的 `Viewtable` 窗口中查看。\n\n|  | `ScientificName`\
  \ | `CommonName` | `MaxHeight` | `AgeBloom` | `Type` | `Color` |\n| --- | --- |\
  \ --- | --- | --- | --- | --- |\n| 1 | M. grandiflora | Southern Magnolia | 80 |\
  \ 15 | E | white |\n| 2 | M. campbellii |  | 80 | 20 | D | rose |\n| 3 | M. liliiflora\
  \ | Lily Magnolia | 12 | 4 | D | purple |\n| 4 | M. soulangiana | Saucer Magnolia\
  \ | 25 | 3 | D | pink |\n| 5 | M. stellata | Star Magnolia | 10 | 3 | D | white\
  \ |\n\n注意，变量名是从电子表格的第一行提取的。如果第一行中有空格或特殊字符，请参见第 3.18 节。\n\n在创建数据集时，你应该始终检查 `SAS log`（SAS\
  \ 日志）以确保没有出错。这些注释提示 `MAGNOLIA` 数据集包含 5 个观测值和 6 个变量。\n\nNOTE: 导入数据集有 5 个观测值和 6 个变量。\n\
  \nNOTE: `SASFILES.MAGNOLIA` 已成功创建。\n\n## 2.5 使用 XLSX LIBNAME 引擎访问 Excel 文件\n\n上一节介绍了将\
  \ Excel 文件转换为 SAS 数据集的一种方法，即 `IMPORT` 过程。`XLSX LIBNAME` 引擎更进了一步。通过 `XLSX LIBNAME`\
  \ 引擎，你可以直接读取和写入 Excel 文件，而无需将其转换为 SAS 数据集。该引擎适用于在 Windows 或 UNIX 操作系统上由任何版本的 Microsoft\
  \ Excel 2007 或之后创建的文件。你必须拥有 `SAS 9.4M2` 或更高版本，以及 `SAS/ACCESS Interface to PC Files`\
  \ 软件。使用此引擎，你可以读取现有的工作表、替换工作表或添加新工作表，但无法更新工作表内部的单个数值。\n\n`XLSX LIBNAME` 引擎使用数据文件的第一行作为变量名，扫描每个整列以确定变量类型（字符或数值），为字符变量分配长度，并识别包含逗号或美元符号的日期和数值值。虽然\
  \ `XLSX LIBNAME` 引擎提供的选项不多，但由于你使用的是类似于 SAS 数据集的 Excel 工作表，因此你可以使用许多标准数据集选项。例如，你可以使用\
  \ `RENAME=` 数据集选项更改变量名。（参见第 6.10 节。）\n\n以下是带有 `XLSX` 引擎选项的 `LIBNAME` 语句的通用格式：\n\n\
  ```sas\nLIBNAME *libref* XLSX '*filename*';\n```\n\n注意，此 `LIBNAME` 语句与访问 SAS 数据库的语句（第\
  \ 2.2 节）之间的唯一区别在于增加了 `XLSX` 选项。`libref` 是你自定义的名称，必须遵循 SAS 数据库的命名规则（8 个字符或少，以字母或下划线开头；且仅包含字母、数字或下划线）。`filename`\
  \ 是你的操作系统环境使用的名称。\n\n请记住，与其他某些 `LIBNAME` 引擎不同，`XLSX LIBNAME` 引擎仅在活动访问 Excel 文件时对其进行锁定。该文件会很快供其他可以读取和编辑它的用户及进程使用。你不需要释放文件，但如果你知道已经处理完毕，使用此语句清除\
  \ `libref` 是一个良好的习惯：\n\n```sas\nLIBNAME *libref* CLEAR;\n```\n\n### 示例\n此示例使用了上一节相同的\
  \ Excel 电子表格。该电子表格包含关于木兰树的数据：科学名和通用名、最大高度、从种子播种后的首次开花年龄、是否为常绿或落叶，以及花的颜色。\n\n![image](img/f0026-01.jpg)\n\
  \n使用 `XLSX LIBNAME` 引擎，SAS 可以直接读取电子表格，而无需先将其转换为 SAS 数据集。以下是一个打印 Excel 电子表格数据的 `PROC\
  \ PRINT` 过程。像这样简单的 `PROC PRINT` 会打印所有变量和所有观测值的值。\n\n```sas\n* 使用 XLSX LIBNAME 引擎读取\
  \ Excel 电子表格;\nLIBNAME exfiles XLSX 'c:\\MyExcel\\Trees.xlsx';\n\nPROC PRINT DATA\
  \ = exfiles.sheet1;\n    TITLE 'PROC PRINT of Excel File';\nRUN;\n```\n\n这里是 `PROC\
  \ PRINT` 的结果。注意，变量名是从电子表格的第一行提取的。如果第一行中有空格或特殊字符，请参见第 3.18 节。\n\nExcel File 的 `PROC\
  \ PRINT`\n\n| `Obs` | `ScientificName` | `CommonName` | `MaxHeight` | `AgeBloom`\
  \ | `Type` | `Color` |\n| --- | --- | --- | --- | --- | --- | --- |\n| **1** | M.\
  \ grandiflora | Southern Magnolia | 80 | 15 | E | white |\n| **2** | M. campbellii\
  \ |  | 80 | 20 | D | rose |\n| **3** | M. liliiflora | Lily Magnolia | 12 | 4 |\
  \ D | purple |\n| **4** | M. soulangiana | Saucer Magnolia | 25 | 3 | D | pink |\n\
  | **5** | M. stellata | Star Magnolia | 10 | 3 | D | white |\n\n如果你想将 Excel 转换为\
  \ SAS 数据集，也可以这样做。以下是读取 Excel 的 `magnolia` 数据集：\n\n|  | `ScientificName` | `CommonName`\
  \ | `MaxHeight` | `AgeBloom` | `Type` | `Color` |\n| --- | --- | --- | --- | ---\
  \ | --- | --- |\n| 1 | M. grandiflora | Southern Magnolia | 80 | 15 | E | white\
  \ |\n| 2 | M. campbellii |  | 80 | 20 | D | rose |\n| 3 | M. liliiflora | Lily Magnolia\
  \ | 12 | 4 | D | purple |\n| 4 | M. soulangiana | Saucer Magnolia | 25 | 3 | D |\
  \ pink |\n| 5 | M. stellata | Star Magnolia | 10 | 3 | D | white |\n\nSAS 日志显示没有丢失观测值或变量：\n\
  \nNOTE: 导入数据集有 5 个观测值和 6 个变量。\n\nNOTE: 从 `EXFILES.sheet1` 读取。\n\nNOTE: 数据集 `SASFILES.MAGNOLIA`\
  \ 有 5 个观测值和 6 个变量。\n\n## 2.6 使用 IMPORT 过程读取分隔文件\n\n![image](img/f028-01.jpg)\n\n\
  `IMPORT` 过程读取 Excel 文件（第 2.4 节），但也读取许多类型的文件。分隔文件是用特殊字符分隔数据的原始数据文件。许多软件可以将数据保存为分隔文件，通常使用逗号或制表符作为分隔符。读取分隔文件的\
  \ `IMPORT` 过程是 UNIX 和 Windows 环境 Base SAS 的一部分。你也可以用 `DATA` 步骤读取分隔文件（第 18 节）。\n\n\
  `PROC IMPORT` 会扫描你的数据文件（默认前 20 行）并自动确定变量类型（字符或数值），为字符变量分配长度，并识别某些日期格式。`PROC IMPORT`\
  \ 将数据文件中连续的分隔符视为缺失值，读取带引号的值，并在行数据耗尽时为变量分配缺失值。此外，如果你愿意，可以使用数据文件的第一行作为变量名。\n\n以下是用于分隔文件的\
  \ `IMPORT` 过程的通用格式：\n\n```sas\nPROC IMPORT DATAFILE = 'filename' OUT = data-set;\n\
  ```\n\n其中 `filename` 是要读取的文件，`data-set` 是要创建的 SAS 数据集的名称。SAS 根据文件的扩展名确定文件类型。\n\n\
  | 文件类型 | 扩展名 | DBMS 标识符 |\n| --- | --- | --- |\n| 逗号分隔 | .csv | CSV |\n| 制表符分隔 |\
  \ .txt | TAB |\n| 逗号或制表符以外的分隔符 | | DLM |\n\n如果你的文件没有正确的扩展名，或者你的文件类型为 `DLM`，则必须在\
  \ `PROC IMPORT` 语句中使用 `DBMS=` 选项。如果你已经有了 `OUT=` 选项中指定的名称 SAS 数据集，并且想要覆盖它，请使用 `REPLACE`\
  \ 选项。\n\n\n\n\n\n```sas\nPROC IMPORT DATAFILE = 'filename' OUT = data-set\n    DBMS\
  \ = identifier REPLACE;\n```\n\n### 可选语句\n\n某些类型的文件需要额外的指令才能被正确读取。如果数据不是从文件的第一行开始，请使用\
  \ `DATAROWS` 语句。如果分隔符不是逗号、制表符或空格，请使用 `DELIMITER` 语句。如果文件仅包含数据而没有标题，请使用 `GETNAMES=NO`\
  \ 语句来分配默认变量名。最后，如果你的数据文件在前 20 行数据中全是缺失值或无代表性的数据，你可能需要 `GUESSINGROWS` 语句来确保变量被分配正确的数据类型和长度。\n\
  \n| 语句 | 说明 |\n| :--- | :--- |\n| `DATAROWS = n;` | 从第 `n` 行开始读取数据。默认值为 1。 |\n|\
  \ `DELIMITER = 'character';` | 指定 DLM 文件的分隔符。默认值为空格。 |\n| `GETNAMES = NO;` | 通知\
  \ SAS 是否使用输入文件的第一行作为变量名。默认值为 YES。如果为 NO，则变量将命名为 `VAR1`、`VAR2`、`VAR3` 等。 |\n| `GUESSINGROWS\
  \ = n;` | 使用 `n` 行数据来确定变量类型。默认值为 20。 |\n\n以下是带有 `GETNAMES=NO` 语句的 `PROC IMPORT`\
  \ 通格式：\n\n```sas\nPROC IMPORT DATAFILE = 'filename' OUT = data-set REPLACE;\n  \
  \  GETNAMES = NO;\n```\n\n### 示例\n\n下面的示例使用了 Jerry 咖啡店的数据，Jerry 雇用本地乐队来吸引顾客。Jerry\
  \ 记录了每个乐队出现的顾客人数。数据包括乐队名称，以及晚上 8 点、9 点、10 点和 11 点的顾客人数。请注意，其中一个名为“Stop, Drop, and\
  \ Rock-N-Roll”的乐队，名称中包含逗号。当一个数据值包含分隔符时，该值必须包含在引号中。\n\n```text\nBandName,EightPM,NinePM,TenPM,ElevenPM\n\
  Lupine Lights,45,63,70,\nAwesome Octaves,17,28,44,12\n\"Stop, Drop, and Rock-N-Roll\"\
  ,34,62,77,91\nThe Silveyville Jazz Quartet,38,30,42,43\nCatalina Converts,56,,65,34\n\
  ```\n\n以下是读取该数据文件的程序：\n\n```sas\nPROC IMPORT DATAFILE ='c:\\MyRawData\\Bands2.csv'\
  \ OUT = music REPLACE;\nRUN;\n```\n\n这是由程序创建的 `MUSIC` 数据集。你可以在 SAS Enterprise Guide\
  \ 或 SAS Studio 的 Output Data 选项卡中查看数据，也可以在 SAS 窗口环境的 Viewtable 窗口中查看。注意 `PROC IMPORT`\
  \ 使用了第一行数据作为变量名。如果第一行中有空格或特殊字符，请参见第 3.18 节。\n\n| | BandName | EightPM | NinePM |\
  \ TenPM | ElevenPM |\n| :--- | :--- | :--- | :--- | :--- | :--- |\n| 1 | Lupine\
  \ Lights | 45 | 63 | 70 | . |\n| 2 | Awesome Octaves | 17 | 28 | 44 | 12 |\n| 3\
  \ | Stop, Drop, and Rock-N-Roll | 34 | 62 | 77 | 91 |\n| 4 | The Silveyville Jazz\
  \ Quartet | 38 | 30 | 42 | 43 |\n| 5 | Catalina Converts | 56 | . | 65 | 34 |\n\n\
  SAS 日志包含这些描述新数据集的备注：\n\n```text\nNOTE: 5 records were read from the infile 'c:\\\
  MyRawData\\Bands2.csv'.\n      The minimum record length was 23.\n      The maximum\
  \ record length was 41.\nNOTE: The data set WORK.MUSIC has 5 observations and 5\
  \ variables.\n```\n\n## 2.7 告诉 SAS 在哪里找到你的原始数据\n\n本章的剩余部分将介绍如何使用 `DATA` 步来读取原始数据。如果你的数据已经存储为\
  \ SAS 数据集、Excel 表格、CSV 或制表符分隔的文件，或者存储在 Oracle 等数据库中，那么你可能可以跳过这个主题。然而，如果你的数据在原始数据文件中（也称为文本、ASCII、顺序或扁平文件），那么你可以使用\
  \ `DATA` 步的力量和灵活性来读取数据。\n\n可以使用简单的文本编辑器或系统命令查看原始数据文件。在个人电脑上，原始数据文件要么没有关联的程序，要么与\
  \ Microsoft 记事本等简单编辑器关联。在某些操作系统环境中，你可以使用命令列出文件，例如 UNIX 中的 `cat` 或 `more` 命令。电子表格文件是不是原始数据的文件示例。如果你尝试用文本编辑器查看电子表格文件，你可能会看到很多在键盘上找不到的奇怪特殊字符。这可能会导致你的电脑发出蜂鸣声和叫声，让你希望走廊尽头有间私人办公室。它看起来与你使用电子表格软件查看同一文件时看到的整齐的行和列完全不同。\n\
  \n读取原始数据文件的第一步是告诉 SAS 在哪里找到原始数据。你的原始数据可能在 SAS 程序内部，也可能在独立的文件中。\n\n### 内部原始数据\n\n\
  如果你将原始数据直接输入 SAS 程序中（也称为流数据），则被视为内部数据。当数据量较少时，你可以这样做。使用 `CARDS` 语句来指示数据。`CARDS`\
  \ 语句必须放在 `DATA` 语句的最后。下面的 SAS 程序演示了 `CARDS` 的用法：\n\n```sas\nDATA uspresidents;\n\
  INPUT President $ Party;\nCARDS;\nAdams 2\nLincoln 16\nGrant 18\nKennedy 35\n;\n\
  RUN;\n```\n\n### 外部原始数据\n\n如果数据在独立文件中，你必须使用 `INFILE` 语句告诉 SAS 文件名（路径）。`INFILE` 语句位于\
  \ `DATA` 语句之后，且位于 `INPUT` 语句之前。以下是不同环境的通用格式：\n\n| 环境 | 语法 |\n| :--- | :--- |\n|\
  \ Windows | `INFILE 'c:\\MyDir\\President.dat';` |\n| UNIX 或 Linux | `INFILE '/home/mydir/president.dat';`\
  \ |\n| z/OS | `INFILE 'MYID.PRESEN.DAT';` |\n\n假设以下数据位于 `MyData` 目录下的 `President.dat`\
  \ 文件中（Windows）：\n\n```text\nAdams 2\nLincoln 16\nGrant 18\nKennedy 35\n```\n\n你可以使用带有\
  \ `INFILE` 语句的程序来读取外部数据：\n\n```sas\nDATA uspresidents;\nINFILE 'c:\\MyData\\President.dat';\n\
  INPUT President $ Party;\nRUN;\n```\n\n每当你从外部文件读取数据时，SAS 都会在日志中列出一些关于文件的有用信息。始终检查这些信息，因为它们可能指示问题。以下是读取外部文件后\
  \ SAS 日志的摘。将 `INFILE` 语句读取的记录数（在本例中为四个）与 SAS 数据集中观测值（也是四个）进行简单比较，可以让你充分了解 SAS 是否正确读取了你的数据。\n\
  \n```text\nNOTE: The infile 'c:\\MyData\\President.dat' is:\n      Filename=c:\\\
  MyData\\President.dat,\n      RECFM=V,LRECL=32767, File Size (bytes)=49\nNOTE: 4\
  \ records were read from the infile 'c:\\MyData\\President.dat'.\nNOTE: The data\
  \ set WORK.USPRESENTS has 4 observations and 3 variables.\n```\n\n\n\n\n\n注意：数据集\
  \ `WORK.USPRESIDENTS` 包含 4 个观测值和 3 个变量。\n\n## 2.8 读取由空格分隔的原始数据\n\n![image](img/f0032-01.jpg)\n\
  \n如果你的原始数据文件中的值都至少由一个空格分隔，那么使用列表输入（也称为自由格式输入或空格分隔输入）来读取数据可能是合适的。列表输入是将原始数据读入 SAS\
  \ 的一种简便方法，但这种简便性也伴随着一些局限性。默认情况下，你必须读取记录中的所有数据——不能跳过不需要的值。任何缺失数据都必须用点（`.`）表示。如果存在字符数据，它必须是简单的——不能包含空格，且长度不能超过\
  \ 8 个字符。如果数据文件包含日期或其他需要特殊处理的值，那么列表输入将不再适用。这听起来有很多限制，但实际上有数量令人意料的数据文件可以使用列表输入来读取的。\n\
  \n`INPUT` 语句是 `DATA` 步的一部分，它告诉 SAS 如何读取你的原始数据。要使用列表输入编写 `INPUT` 语句，只需在关键字 `INPUT`\
  \ 之后按照变量在数据文件中出现的顺序列出变量名。通常，变量名必须是 32 个字符或少，以字母或下划线开头，且仅包含字母、下划线或数字。如果值是字符（而非数值），则在变量名后加上一个美元符号（`$`）。在名称之间保留至少一个空格，并记住在语句末尾加上分号。以下是一个简单的列表样式\
  \ `INPUT` 语句示例：\n\n```\nINPUT Name $ Age Height;\n```\n\n该语句告诉 SAS 读取三个数据值。`Name`\
  \ 之后的 `$` 表示它是一个字符变量，而变量 `Age` 和 `Height` 都是数值型变量。\n\n如果你的数据文件并不完全符合列表输入的规则，你将会很高兴地知道，有多种方法可以规避这些局限性。其中许多将在本章稍后部分讨论。最常见的问题之一是长度超过\
  \ 8 个字符的字符变量。你可以通过 `LENGTH` 语句告诉 SAS 使用更长度。例如，该语句告诉 SAS 创建一个名为 `Name` 的字符型变量，且长度为\
  \ 12：\n\n```\nLENGTH Name $ 12;\n```\n\n在 SAS 程序中，变量的属性是在 SAS 第一次遇到该变量时设置的。因此，如果\
  \ `LENGTH` 语句在 `INPUT` 语句之前，SAS 将使用该长度。\n\n示例 你的家乡今年到处都是蟾蜍。当地居民在听说了加州有青蛙跳跃后，产生了举办一场蟾蜍跳跃比赛为年度镇集市收尾的想法。对于每个参赛者，你都有蟾蜍的名字、重量以及三次独立尝试的跳跃距离。如果蟾蜍因某次跳而被取消资格，则用点表示缺失数据。以下是数据文件\
  \ `ToadJump.dat` 的内容：\n\n```\nLucky 2.3 1.9 . 3.0\nSpot 4.6 2.5 3.1 .5\nToadzilla\
  \ 7.1 . . 3.8\nHop 4.5 3.2 1.9 2.6\nNoisy 3.8 1.3 1.8 1.5\nWinner 5.7 . . .\n```\n\
  \n这个数据文件看起来并不很整齐，但它符合列表输入的大多数要求：没有嵌入空格，所有值都至少由一个空格分隔，且缺失数据用点表示。然而，有一个问题。其中一只蟾蜍的名字\
  \ `Toadzilla` 超过了 8 个字符。在程序中添加 `LENGTH` 语句将允许 SAS 使用列表输入读取蟾蜍的名字。\n\n以下是读取这些数据的 SAS\
  \ 程序：\n\n```\n* 创建一个名为 toads 的 SAS 数据集\n* 使用列表输入读取数据文件 ToadJump.dat;\nDATA toads;\n\
  \   LENGTH ToadName $ 9;\n   INFILE 'c:\\MyRawData\\ToadJump.dat';\n   INPUT ToadName\
  \ Weight Jump1 Jump2 Jump3;\nRUN;\n```\n\n`LENGTH` 语句创建一个名为 `ToadName` 的变量，它是字符型（由美元符号表示）且长度为\
  \ 9。然后 `INPUT` 语句读取变量 `ToadName`、`Weight`、`Jump1`、`Jump2` 和 `Jump3`。由于 SAS 已经知道\
  \ `ToadName` 是字符，所以不需要在 `INPUT` 语句中包含美元符号。所有其他变量都是数值型。\n\n检查你创建的数据集以确保它们是正确的始终。。以下是\
  \ `TOADS` 数据集。你可以在 SAS Enterprise Guide 或 SAS Studio 的 Output Data 选项卡中查看，或者在 SAS\
  \ 窗口环境的 Viewtable 窗口中查看。\n\n| | ToadName | Weight | Jump1 | Jump2 | Jump3 |\n| ---\
  \ | --- | --- | --- | --- | --- |\n| 1 | Lucky | 2.3 | 1.9 | . | 3.0 |\n| 2 | Spot\
  \ | 4.6 | 2.5 | 3.1 | 0.5 |\n| 3 | Toadzilla | 7.1 | . | . | 3.8 |\n| 4 | Hop |\
  \ 4.5 | 3.2 | 1.9 | 2.6 |\n| 5 | Noisy | 3.8 | 1.3 | 1.8 | 1.5 |\n| 6 | Winner |\
  \ 5.7 | . | . | .\n\n日志中显示如下内容：\n数据集 TOADS 包含 6 个观测值和 5 个变量。从 'c:\\MyRawData\\ToadJump.dat'\
  \ 读取了以下变量：\nToadName         字符长度 9\nWeight           数值\nJump1           数值\nJump2\
  \           数值\nJump3           数值\n\n## 2.9 按列排列的原始数据\n\n![image](img/f0034-01.jpg)\n\
  \n某些数据文件在值之间没有空格（或制表符），但如果每个变量的值位于行的相同位置，只要值是字符型或数值型，你就可以使用列输入。相对于列表输入，列输入具有以下优势：\n\
  - 值之间不需要空格\n- 缺失值可以留空\n- 字符数据可以包含空格\n- 你可以跳过不需要的变量\n\n带有街道地址的文件（通常包含空格）是列输入的良好选择。街道\
  \ `Martin King Jr. Boulevard` 作为一个变量读取，而不是像列表输入那样分成五个。\n\n---\n\n要使用列输入编写 `INPUT`\
  \ 语句，在关键字 `INPUT` 之后列出第一个变量名。如果变量是字符型，留一个空格；然后放置 `$`。在 `$` 或变量名之后，如果是数值型，留一个空格；然后列出该变量所在的列或列范围。列是指行中字符或数字的位置，不要与你在电子表格中看到的列混淆。对你想要读取的所有变量重复此操作。以下是一个简单的列样式\
  \ `INPUT` 语句：\n\n```\nINPUT Name $ 1-10 Age 11-13 Height 14-18;\n```\n\n第一个变量 `Name`\
  \ 是字符型，数据值在 1 到 10 位之间。第二个变量 `Age` 是数值型（因为它后面没有 `$`），位于 11 到 13 列。第三个变量 `Height`\
  \ 也是数值型，位于 14 到 18 列。\n\n示例 当地的小棒球队 Walla Walla Sweets 正在记录餐饮销售情况。球场最受欢迎的是甜洋葱圈，它们在柜台出售，也在看台的销售员那里出售。球场所有者认为，在安打和得分较多的比赛中，看台销售的洋葱圈比柜台多。他们认为在比赛进入激烈时应该向看台派遣更多销售员，但需要更多证据来支持他们的想法。\n\
  \n对于每场主场，他们都有以下信息：对手名称、柜台和看台的洋葱销售数量、各球队的安打数以及各球队的最终得分。以下是名为 `OnionRing.dat` 数据文件的样本。为了参考，数据上方放置了一个显示列号的尺子：\n\
  \n\n\n\n\n----+----1----+----2----+----3----+----4\n\nColumbia Peaches 35 67 1 10\
  \ 2 1\nPlains Peanuts 210 2 5 0 2\nGilroy Garlics 151035 12 11 7 6\nSacramento Tomatoes\
  \ 124 85 15 4 9 1\n\n注意，该数据文件具有以下特征，这些特征使其成为列输入的理想人选。所有取值都按列对齐，团队名称包含嵌入空格，缺失值为空白，在其中一种情况下数据值之间没有空格。（那些\
  \ Gilroy Garlics 的粉丝可能真的非常爱吃洋葱圈。）\n\n下面的程序展示了如何使用列输入读取这些数据：\n\n* 创建一个名为 `sales`\
  \ 的 SAS 数据集；\n* 使用列输入读取数据文件 `OnionRing.dat`；\n\n```sas\nDATA sales;\n   INFILE 'c:\\\
  MyRawData\\OnionRing.dat';\n   INPUT VisitingTeam $ 1-20 CSales 21-24 BSales 25-28\n\
  \         OurHits 29-31 TheirHits 32-34 OurRuns 35-37 TheirRuns 38-40;\nRUN;\n```\n\
  \n变量 `VisitingTeam` 是字符型（由 `$` 表示），并读取第 1 到 20 列的客队队名称。变量 `CSales` 和 `BSales` 分别读取第\
  \ 21 到 24 列和 25 到 28 列的特许销售额和看台销售额。主队的命中数 `OurHits` 和客队的命中数 `TheirHits` 分别位于第 29\
  \ 到 31 列和第 32 到 34 列。主队的得分 `OurRuns` 位于第 35 到 37 列，而客队的得分 `TheirRuns` 位于第 38 到 40\
  \ 列。\n\n这里是 `SALES` 数据集。你可以在 SAS Enterprise Guide 或 SAS Studio 的 Output Data 选项卡中查看数据，也可以在\
  \ SAS 窗口环境的 Viewtable 窗口中查看数据。\n\n| | VisitingTeam | CSales | BSales | OurHits |\
  \ TheirHits | OurRuns | TheirRuns |\n| --- | --- | --- | --- | --- | --- | --- |\
  \ --- |\n| 1 | Columbia Peaches | 35 | 67 | 1 | 10 | 2 | 1 |\n| 2 | Plains Peanuts\
  \ | 210 | . | 2 | 5 | 0 | 2 |\n| 3 | Gilroy Garlics | 15 | 1035 | 12 | 11 | 7 |\
  \ 6 |\n| 4 | Sacramento Tomatoes | 124 | 85 | 15 | 4 | 9 | 1 |\n\n这些注释显示在日志中：\n\n\
  ```\nNOTE: 4 records were read from the infile 'c:\\MyRawData\\OnionRings.dat'.\n\
  \      The minimum record length was 40.\n      The maximum record length was 40.\n\
  NOTE: The data set WORK.SALES has 4 observations and 7 variables.\n```\n\n## 2.10\
  \ 读取非标准格式的原始数据\n\n![image](img/f0036-01.jpg)\n\n有时原始数据并不是简单的数值型或字符型。例如，我们人类很容易地将数字\
  \ 1,000,001 为一百万零一，但你可靠的计算机将其视为一个字符字符串。虽然嵌入的逗号让我们更容易解释这个数字，但如果没有一些指令，它们会让计算机无法识别该数字。在\
  \ SAS 中，使用格式说明符（informats）来告诉计算机如何解释这些类型的数据。\n\n当你有非标准数据时，格式说明符是非常用的。（标准数值数据只包含数字、小数点、加号、减号以及用于科学计数法的\
  \ E。） 带有嵌入逗号或美元符号的数字是非标准数据。其他示例还包括十六进制或压缩十进制格式的数据。SAS 也有用于读取此类数据的格式说明符。\n\n日期也许是最常见的非标准数据。使用日期格式说明符，SAS\
  \ 将将传统的日期形式（如 10-31-2023 或 31OCT23）转换为一个数字，即自 1960 年 1 月 1 日以来的天数。这个数字被称为 SAS 日期值。（为什么是\
  \ 1960 年 1 月 1 日？谁知道呢？也许 1960 年对 SAS 创始人来说是个好年份。）当你想要对日期进行计算时，这被证明极其有用。例如，你可以通过一个减去另一个轻松找到两个日期之间的天数。更多关于日期的信息，请参见第\
  \ 3.13 节。\n\n格式说明符有三种类型：字符、数值和日期。下一节将出现常用 SAS 格式说明符表。三种格式说明符具有以下通用形式：\n\n| Character\
  \ | Numeric | Date |\n| --- | --- | --- |\n| $w. | w.d | informatw. |\n\n`$` 表示字符格式说明符，`w`\
  \ 是格式说明符的名称、总宽度，而 `d` 是小数点位数（仅限数值格式说明符）。小数点是格式说明符名称的重要部分。如果没有小数点，SAS 可能会尝试将格式说明符解释为变量名，而默认情况下，变量名不能包含下划线以外的任何特殊字符。有两个格式说明符是有名的：`$w.`\
  \ 用于读取标准字符数据，`w.d` 用于读取标准数值数据。\n\n通过在变量名后放置格式说明符来使用它们：将格式说明符放在 `INPUT` 语句中的变量名之后来使用它们。使用格式说明符的方法如下：\n\
  \n```sas\nName $10. Age 3. Date MMDYY10.\n```\n\n`$` 表示字符格式说明符，`w` 是格式说明符的名称、总宽度，而\
  \ `d` 是小数点位数（仅限数值格式说明符）。小数点是格式说明符名称的重要部分。如果没有小数点，SAS 可能会尝试将格式说明符解释为变量名，而默认情况下，变量名不能包含下划线以外的任何特殊字符。有两个格式说明符是有名的：`$w.`\
  \ 用于读取标准字符数据，`w.d` 用于读取标准数值数据。\n\n通过在变量名后放置格式说明符来使用它们：将格式说明符放在 `INPUT` 语句中的变量名之后来使用它们。使用格式说明符的方法如下：\n\
  \n```sas\nName $10. Age 3. Date MMDYY10.\n```\n\n`$` 表示字符格式说明符，`w` 是格式说明符的名称、总宽度，而\
  \ `d` 是小数点位数（仅限数值格式说明符）。小数点是格式说明符名称的重要部分。如果没有小数点，SAS 可能会尝试将格式说明符解释为变量名，而默认情况下，变量名不能包含下划线以外的任何特殊字符。有两个格式说明符是有名的：`$w.`\
  \ 用于读取标准字符数据，`w.d` 用于读取标准数值数据。\n\n通过在变量名后放置格式说明符来使用它们：将格式说明符放在 `INPUT` 语句中的变量名之后来使用它们。使用格式说明符的方法如下：\n\
  \n```sas\nName $10. Age 3. Date MMDYY10.\n```\n\n`$` 表示字符格式说明符，`w` 是格式说明符的名称、总宽度，而\
  \ `d` 是小数点位数（仅限数值格式说明符）。小数点是格式说明符名称的重要部分。如果没有小数点，SAS 可能会尝试将格式说明符解释为变量名，而默认情况下，变量名不能包含下划线以外的任何特殊字符。有两个格式说明符是有名的：`$w.`\
  \ 用于读取标准字符数据，`w.d` 用于读取标准数值数据。\n\n（注：由于原文文本中存在部分段落重复，此处已根据指令“不要重复输出原文”的原则进行翻译与逻辑处理。）\n\
  \n\n\n\n\n注意：数据集 `PUMP.CONTEST` 包含 6 个观测值和 7 个变量。\n\n## 2.11 选择格式 (Formats)\n\n\
  | 格式 (Informat) | 定义 | 宽度范围 | 默认宽度 |\n| :--- | :--- | :--- | :--- |\n| **字符 (Character)**\
  \ | | | |\n| `$CHAR*w*.` | 读取字符数据——不修剪开头或结尾空格 | 1–32,767 | 8 或变量长度 |\n| `$UPCASE*w*.`\
  \ | 将字符数据转换为大写 | 1–32,767 | 8 |\n| `$*w*.` | 读取字符数据——修剪开头空格 | 1–32,767 | 无 |\n|\
  \ **日期、时间和日期/时间¹** | | | |\n| `ANYDTDTE*w*.` | 读取各种日期格式的日期 | 5–32 | 9 |\n| `DATE*w*.`\
  \ | 读取格式为：*ddmmmyy* 或 *ddmmmyyyy* 的日期 | 7–32 | 7 |\n| `DATETIME*w*.` | 读取格式为：*ddmmmyy\
  \ hh*:*mm*:*ss*.*ss* 的日期/时间值 | 13–40 | 18 |\n| `DDMMYY*w*.` | 读取格式为：*ddmmyy* 或 *ddmmyyyy*\
  \ 的日期 | 6–32 | 6 |\n| `JULIAN*w*.` | 读取格式为：*yyddd* 或 *yyyyddd* 的儒略日 | 5–32 | 5 |\n\
  | `MMDDYY*w*.` | 读取格式为：*mmddyy* 或 *mmddyyyy* 的日期 | 6–32 | 6 |\n| `STIMER*w*.` |\
  \ 读取格式为：*hh*:*mm*:*ss*.*ss* (或 *mm*:*ss*.*ss,* 或 *ss*.*ss*) 的时间 | 1–32 | 10 |\n\
  | `TIME*w*. *d*` | 使用 24 小时制读取格式为：*hh*:*mm*:*ss*.*ss* (或 *hh*:*mm*) 的时间 | 5–32 |\
  \ 8 |\n| **数值 (Numeric)** | | | |\n| `COMMA*w.d*` | 移除嵌入的逗号和 $，将左括号转换为负号 | 1–32\
  \ | 1 |\n| `COMMAX*w.d*` | 与 `COMMA*w.d*` 类似但交换了逗号和点的角色 | 1–32 | 1 |\n| `PERCENT*w.*`\
  \ | 将百分比转换为比例 | 1–32 | 6 |\n| `w.d` | 读取标准数值 | 1–32 | 无 |\n\n¹ SAS 日期值是自 1960 年\
  \ 1 月 1 日以来的天数。时间值是午夜后的秒数，日期/时间值是自 1960 年 1 月 1 日午夜后的秒数。\n\n| 格式 (Informat) | 输入数据\
  \ | INPUT 语句 | 结果 |\n| :--- | :--- | :--- | :--- |\n| **字符 (Character)** | | | |\n\
  | `$CHAR*w*.` | my cat my cat | `INPUT Animal $CHAR10.;` | my cat my cat |\n| `$UPCASE*w*.`\
  \ | my cat | `INPUT Name $UPCASE10.;` | MY CAT |\n| `$*w*.` | my cat my cat | `INPUT\
  \ Animal $10.;` | my cat my cat |\n| **日期、时间和日期/时间** | | | |\n| `ANYDTDTE*w*.` |\
  \ 1jan1961 01/01/61 | `INPUT Day ANYDTDTE10.;` | 366 366 |\n| `DATE*w*.` | 1jan1961\
  \ 1 jan 61 | `INPUT Day DATE10.;` | 366 366 |\n| `DATETIME*w*.` | 1jan1960 10:30:15\
  \ 1jan1961,10:30:15 | `INPUT Dt DATETIME18.;` | 37815 31660215 |\n| `DDMMYY*w*.`\
  \ | 01.01.61 02/01/61 | `INPUT Day DDMMYY8.;` | 366 367 |\n| `JULIAN*w*.` | 61001\
  \ 1961001 | `INPUT Day JULIAN7.;` | 366 366 |\n| `MMDDYY*w*.` | 01-01-61 01/01/61\
  \ | `INPUT Day MMDDYY8.;` | 366 366 |\n| `STIMER*w*.` | 10:30 10:30:15 | `INPUT\
  \ Time STIMER8.;` | 630 37815 |\n| `TIME*w. d*` | 10:30 10:30:15 | `INPUT Time TIME8.;`\
  \ | 37800 37815 |\n| **数值 (Numeric)** | | | |\n| `COMMA*w.d*` | $1,000,001 (1,234)\
  \ | `INPUT Income COMMA10.;` | 1000001 -1234 |\n| `COMMAX*w.d*` | $1.000.001 (1.234,25)\
  \ | `INPUT Value COMMAX10.;` | 100001.25 |\n| `PERCENT*w*.` | 5% (20%) | `INPUT\
  \ Value PERCENT5.;` | .05 -2 |\n| `w.d` | 1234 -12.3 | `INPUT Value 5;` | 1234 -3\
  \ |\n\n## 2 混合输入格式\n\n三种主要的输入格式各有优劣。列表格式（List style）最简单；列格式（column style）稍微复杂；格式输入（formatted\
  \ style）最难。然而，列格式和格式输入之间不需要空格（或分隔符），并且可以读取空格。格式输入可以读取日期等特殊数据。SAS 非常灵活，你可以根据方便混合使用任何一种输入格式。\n\
  \n示例：以下原始数据包含美国国家公园的信息：名称、州（或地区）、建立年份和英亩面积：\n\n```\nYellowstone ID/MT/WY 1872 4065,493\n\
  Everglades FL 1934 398,800\nYosemite CA 1864 760,917\nGreat Smoky Mountains NC/TN\
  \ 1926 520,269\nWolf Trap Farm VA 1966 130\n```\n\n你可以用多种方式编写这些数据的 `INPUT` 语句。本节显示了一种方法：\n\
  \n```sas\n* 创建名为 nationalparks 的数据集\n* 混合输入格式读取 NatPark.dat 文件\nDATA nationalparks;\n\
  \  INFILE 'c:\\MyRawData\\NatPark.dat';\n  INPUT ParkName $1-22 State $ Year @40\
  \ COMMA9;\n```\n\n注意变量 `ParkName` 使用列输入读取，`State` 和 `Year` 使用列表输入读取，而 `Acreage`\
  \ 使用格式输入读取。这里是 `NATIONALPARKS` 数据集：\n\n| ParkName | State | Year | Acreage |\n|\
  \ :--- | :--- | :--- | :--- |\n| Yellowstone | ID/MT/WY | 1872 | 406593 |\n| Everglades\
  \ | FL | 1934 | 398800 |\n| Yosemite | CA | 1864 | 760917 |\n| Great Smoky Mountains\
  \ | NC/TN | 1926 | 520269 |\n| Wolf Trap Farm | VA | 1966 | 130 |\n\n有时在混合输入格式时会遇到问题。SAS\
  \ 读取原始数据行时使用指针标记位置，但每种输入格式使用指针的方式不同。对于列表输入，SAS 扫描到下一个非空字段并开始读取。对于列输入，SAS 在指定的列开始读取。但对于格式输入，SAS\
  \ 在指针所在的地方就开始读取。有时你需要显式地移动指针，可以通过列指针 `@n` 实现，其中 `n` 是 SAS 应该移动到的列数。在前面的程序中，列指针 `@40`\
  \ 告诉 SAS 在读取 `Acreage` 值之前移动到第 40 列。如果你从 `INPUT` 语句中删除了列指针（如下所示），那么 SAS 将从 `Year`\
  \ 之后开始读取 `Acreage`：\n\n```\nINPUT ParkName $1-22 State $ Year Acreage COMMA9.;\n\
  ```\n\n这里是变量 `Acreage` 被截断的数据集：\n\n| ParkName | State | Year | Acreage |\n| :---\
  \ | :--- | :--- | :--- |\n| Yellowstone | ID/MT/WY | 1872 | 4065 |\n| Everglades\
  \ | FL | 1934 | . |\n| Yosemite | CA | 1864 | . |\n| Great Smoky Mountains | NC/TN\
  \ | 1926 | 5 |\n| Wolf Trap Farm | VA | 1966 | . |\n\n因为 `Acreage` 使用格式输入读取，所以 SAS\
  \ 从指针所在的地方开始读取。这里是带有顶部用于列数的列尺的数据文件，星号标记了 SAS 开始读取 `Acreage` 值的位置：\n\n```\n----+----1----+----2----+----3----+----4----+----5\n\
  Yellowstone ID/MT/WY 1872 *4065,493\nEverglades FL 1934 *398,800\nYosemite CA 1864\
  \ *760,917\nGreat Smoky Mountains NC/TN 1926 *520,269\nWolf Trap Farm VA 1966 *130\n\
  ```\n\n## 2.13 读取杂乱的原始数据\n\n![image](img/f0042-01.jpg)\n\n有时，你需要读取那些无法整齐排列在列中或没有可预测长度的数据。当你拥有这些杂乱的文件时，普通的列表、列或格式输入是不够的。你需要在工具箱里准备更多工具：诸如\
  \ `@'character'` 列指针，以及冒号和和符号修饰符。\n\n\n\n\n\n# @'character' 列指针\n\n在前面的节中，我们展示了如何使用\
  \ `@` 列指针在读取数据之前移动到特定的列。然而，有时你可能并不知道数据的起始列，但你知道它总是出现在某个特定字符或单词之后。对于这类情况，你可以使用 `@'character'`\
  \ 列指针。例如，假设你有一个包含犬主所有权信息的数据文件。文件中没有任何内容是对齐的，但你知道狗的品种总是跟在单词 Breed（品种）的之后。你可以使用以下\
  \ `INPUT` 语句读取狗的品种：\n\n```\nINPUT @'Breed' DogBreed $;\n```\n\n### 冒号修饰符\n\n上述 `INPUT`\
  \ 语句只要狗的品种在 8 个字符或以内（字符变量的默认长度）且不包含空格，就能正常工作。因此，如果狗是贵宾犬（Poodle），则没问题；但如果狗是罗威犬（Rottweiler）或西品种（Shih\
  \ Tzu），它将无法工作。如果你在 `INPUT` 语句中为变量分配如 `$20\\.` 这样的格式（informat），那么 SAS 将读取 20 列，无论这些列中是否有空格。因此，`DogBreed`\
  \ 变量可能会包含数据行中狗品种之后出现的意外字符。如果你想让 SAS 只读取到遇到空格或数据行末尾，你可以在格式上使用冒号修饰符。（这同样适用于空格以外的其他定界符。详见第\
  \ 2.18 节）。要使用冒号修饰符，只需在格式之前加上一个冒号（`:`），例如，使用 `:$20\\.` 而不是 `$20.`。例如，给定如下的一行原始数据：\n\
  \n`My dog Sam  Breed Rottweiler  Vet Bills $478`\n\n下表显示了使用不同 `INPUT` 语句得到的结果：\n\
  \n| 语句 | 变量 DogBreed 的值 |\n| :--- | --- |\n| `INPUT @'Breed ' DogBreed $;` | Rottweil\
  \ |\n| `INPUT @'Breed ' DogBreed $20.` | Rottweiler Vet Bill |\n| `INPUT @'Breed\
  \ ' DogBreed :$20.;` | Rottweiler |\n\n# & 修饰符\n\n冒号修饰符告诉 SAS 读取数据值，直到遇到空格。如果你的数据值中嵌入了空格，你可能仍然能够读取你的数据。&\
  \ 修饰符（`&`）告诉 SAS 读取数据值，直到遇到两个或多个连续空格。在嵌入空格的变量名后插入 & 符号。\n\n```\nINPUT @'Breed' DogBreed\
  \ & $;\n```\n\n### 示例\n\n每年，来自全美和加拿大的工程学生都会建造混凝土木舟并举办地区和国家比赛。比赛的一部分包括独木舟赛。以下数据包含了男子短道赛的最终结果。数据行以独木舟名称开头，随后是学校和时间。\n\
  \n`Bellatorum  School CSULA Time 1:40.5`\n`The Kraken  School ASU Time 1:45.35`\n\
  `Black Widow  School UoA Time 1:33.7`\n`Koicrete  School CSUF Time 1:40.25`\n`Khaos\
  \  School UNLV  Time 2:03.45`\n`Max  School UCSD Time 1:26.47`\n`Hakuna Matata \
  \ School UCLA Time 1:20.64`\n`Prospector  School CPSLO Time 1:12.08`\n`Andromeda\
  \  School CPP  Time 1:25.1`\n`Kekoapohaku  School UHM Time 1:24.49`\n\n你可以看到某些独木舟名称包含嵌入的空格，并且每个独木舟名称后有两个空格。由于独木舟名称长度不同，学校名称没有在同一列对齐。此外，时间值有时是六个字符，有时是七个。此\
  \ SAS 程序读取独木舟名称、学校和时间：\n\n```\nDATA canoeresults;\n  INFILE 'c:\\MyRawData\\Canoes.dat';\n\
  \  INPUT CanoeName & $13. @'School' School $ @'Time' RaceTime :STIMER8.;\nRUN;\n\
  ```\n\n此 `INPUT` 语句同时使用了 & 修饰符和格式（`$13.`）来读取 `CanoeName` 的值。结果是 SAS 会读取 `CanoeName`\
  \ 直到遇到两个或多个空格并停止，即使该 `CanoeName` 的长度小于指定的格式。然后，`INPUT` 语句使用 `@'School'` 和 `@'Time'`\
  \ 将列指针定位，以读取学校名称和时间。学校名称都小于默认的 8 个字符，因此不需要格式即可读取它们，但时间是非标准数据，需要一种格式。因为时间并不总是相同的字符数，所以在格式上添加了冒号修饰符（`:STIMER8.\"\
  `）。如果没有冒号修饰符，当 SAS 在数据行上用完字符时，将将到新的数据行尝试读取时间值。\n\n以下是 `CANOERESULTS` 数据集：\n\n| |\
  \ CanoeName | School | RaceTime |\n| --- | --- | --- | --- |\n| 1 | Bellatorum |\
  \ CSULA | 100.50 |\n| 2 | The Kraken | ASU | 105.35 |\n| 3 | Black Widow | UoA |\
  \ 93.70 |\n| 4 | Koicrete | CSUF | 100.25 |\n| 5 | Khaos | UNLV | 123.45 |\n| 6\
  \ | Max | UCSD | 86.47 |\n| 7 | Hakuna Matata | UCLA | 80.64 |\n| 8 | Prospector\
  \ | CPSLO | 72.08 |\n| 9 | Andromeda | CPP | 85.10 |\n| 10 | Kekoapohaku | UHM |\
  \ 84.49 |\n\n\n\n\n\n|  | **城市** | **州** | **正常高温** | **正常低温** | **历史最高** | **历史最低**\
  \ |\n| --- | --- | --- | --- | --- | --- | --- |\n| 1 | Nome | AK | 55 | 44 | 88\
  \ | 29 |\n| 2 | Miami | FL | 90 | 75 | 97 | 65 |\n| 3 | Raleigh | NC | 88 | 68 |\
  \ 105 | 50 |\n\n这些注释出现在日志中：\n\n```\nNOTE: 9 records were read from the infile 'c:\\\
  MyRawData\\Temperature.dat'.\n      The minimum record length was 5.\n      The\
  \ maximum record length was 10.\nNOTE: The data set WORK.HIGHLOW has 3 observations\
  \ and 6 variables.\n```\n\n注意，虽然从 `INFILE` 语句读取了九条记录，但 SAS 数据集仅包含三个观测值。通常这会引起你的警觉，但在这里它证实了正如计划的那样，每个观测值都读取了三行数据。你应该始终检查日志，特别是在使用行指针时。\n\
  \n## 2.15 每行原始数据读取多个观测值\n\n![image](img/f0046-01.jpg)\n\n数据中似乎存在一条墨菲定律：数据可以以任何形式出现，它就会以那种形式出现。通常\
  \ SAS 假设每行原始数据最多只代表一个观测值。当每行原始数据包含多个观测值时，你可以在 `INPUT` 语句末尾使用双 @ （`@@`）。这种行保持指示符就像一个停止信号，告诉\
  \ SAS：“停止，保留这一行原始数据。” SAS 会保留该行数据，继续读取观测值，直到数据耗尽或遇到一个不以双 `@` 结尾的 `INPUT` 语句。\n\n\
  ![image](img/f0046-02.jpg)\n\n### 示例假设你有一位同事计划度假，并获得了一个包含他考虑的三个城市降雨数据的文件。该文件包含每个城市的名称、州、7\
  \ 月的平均降水量（英寸）以及 7 月份可测量降水的平均天数。原始数据如下：\n\nNome AK 2.5 15 Miami FL 6.75\n18 Raleigh\
  \ NC . 12\n\n注意在该数据文件中，第一行在第二个观测值的中间停止了。以下程序从名为 `Precipitation.dat` 的文件读取这些数据，并使用\
  \ `@@` 使得 SAS 不会为每个观测值自动跳转到新的原始行：\n\n```sas\n* 从每条记录中输入多个观测值\nDATA rainfall;\n \
  \  INFILE 'c:\\MyRawData\\Precipitation.dat';\n   INPUT City $ State $ NormalRain\
  \ MeanDaysRain @@;\nRUN;\n```\n\n这里是 `RAINFALL` 数据集：\n\n|   | **城市** | **州** | **正常水量**\
  \ | **平均降水天数** |\n| --- | --- | --- | --- | --- |\n| 1 | Nome | AK | 2.50 | 15 |\n\
  | 2 | Miami | FL | 6.75 | 18 |\n| 3 | Raleigh | NC | . | 12 |\n\n这些注释出现在日志中：\n\n\
  ```\nNOTE: 2 records were read from the infile 'c:\\MyRawData\\Precipitation.dat'\n\
  \      The minimum record length was 18.\n      The maximum record length was 28.\n\
  NOTE: SAS went to a new line when INPUT statement reached past the end of a line.\n\
  NOTE: The data set WORK.RAINFALL has 3 observations and 4 variables.\n```\n\n虽然从原始数据文件中只读取了两条记录，但\
  \ `RAINFALL` 数据集包含三个观测值。日志还包含一条注释，说明当 `INPUT` 语句超出行末尾时，SAS 跳到了新行。这意味着 SAS 在观测值的中间到达了行末尾，并继续读取下一行原始数据。通常这些信息表示存在问题，但在这种情况下，它们正是你需要的。\n\
  \n第 3.11 节展示了从单行原始数据产生多个观测值的另一种方法，这种技术适用于某些数据值必须重复的情况。\n\n## 2.16 读取原始数据文件的部分\n\n\
  ![image](img/f0048-01.jpg)\n\n在某些时候，你可能会发现自己需要读取大型数据文件中一小部分记录。例如，你可能正在读取美国人口普查数据，并且只需要超过\
  \ 225,000 美元且居住在华盛顿州华拉拉的女性家庭主。你可以读取数据文件中所有的记录，然后丢弃不需要的，但这将浪费时间。\n\n幸运的是，你不需要在告诉\
  \ SAS 是否保留观测值之前读取所有数据。相反，你只需要读取足够的变量来决定是否保留当前观测值，然后用 `@` 结束 `INPUT` 语句，这称为尾随 @（trailing\
  \ at）。这告诉 SAS 保留该行原始数据。在尾随 `@` 保持该行时，你可以使用 `IF` 语句对观测值进行测试，看看它是否是你想要的。如果是，你可以使用第二个\
  \ `INPUT` 语句读取剩余变量的数据。\n\n（注：此处原文中存在大量重复的段落，已根据指令要求进行翻译处理，确保逻辑一致。）\n\n### 示例假设你只想查看高速公路数据，此时你使用以下程序读取原始文件\
  \ `Traffic.dat`：\n\n```sas\n* 使用尾随 @，然后删除表面路数据\nDATA freeways;\n   INFILE 'c:\\\
  MyRawData\\Traffic.dat';\n   INPUT Type $ @;\n   IF Type = 'surface' THEN DELETE;\n\
  \   INPUT Name $ 9-38 AMTraffic PMTraffic;\nRUN;\n```\n\n当你运行此程序时，日志将包含以下两条注释，一条说明从输入文件中读取了八条记录，另一个说明新数据集仅包含三个观测值：\n\
  \n```\nNOTE: 8 records were read from the infile 'c:\\MyRawData\\Traffic.dat'.\n\
  \      The minimum record length was 47.\n      The maximum record length was 47.\n\
  NOTE: The data set WORK.FREEWAYS has 3 observations and 4 variables.\n```\n\n此示例使用了\
  \ `DELETE` 语句来删除表面路的观测值。与其指定要删除哪些观测值，你可以指定要保留哪些观测值。为了只保留高速公路的观测值，将使用子集 `IF` 语句。请参考第\
  \ 3.8 节了解更多关于子集 `IF` 语句的信息。\n\n\n\n\n\n# 尾部 @ 与双尾部 @\n\n在上一节中讨论过的双尾部 `@` 与尾部 `@`\
  \ 相似。两者都是行保持指定符（line-hold specifiers）；区别在于它们保持一行数据用于输入的时间长短。尾部 `@` 会为后续的 `INPUT`\
  \ 语句保留该行数据，但当 SAS 返回到 `DATA` 步的顶部开始构建下一个观测值时，会释放该行数据。而双尾部 `@` 即使在 SAS 开始构建新观测值时，也会为后续的\
  \ `INPUT` 语句保留该行数据。在这两种情况下，如果 SAS 遇到一个不包含行保持指定符的后续 `INPUT` 语句，该行数据都会被释放。\n\n## 2.17\
  \ 使用 INFILE 语句中的选项控制输入\n\n到本章为止，我们已经看到了使用 `INPUT` 语句读取许多不同类型原始数据的方法。在读取原始数据文件时，SAS\
  \ 会做出某些假设。例如，SAS 从第一行数据开始读取，如果 SAS 在某一行上用尽了数据，它将自动转到下一行读取其余变量的值。大多数情况下这是可以的，但某些数据文件无法使用默认假设进行读取。`INFILE`\
  \ 语句中的选项改变了 SAS 读取原始文件的方式。以下选项对于读取特定类型的数据文件非常有用。将这些选项放在 `INFILE` 语句中文件名之后。\n\n###\
  \ FIRSTOBS=\n\n`FIRSTOBS=` 选项告诉 SAS 从哪一行开始读取数据。如果你有一个数据文件开头包含描述性文本或头部信息，并且你希望在读取数据之前跳过这些行，这个选项就会有用。例如，以下数据文件在前两行包含了数据的描述：\n\
  \n```\nIce-cream sales data for the summer\nFlavor Location Boxes sold\nChocolate\
  \ 213 123\nVanilla 213 512\nChocolate 415 242\n```\n\n以下程序使用 `FIRSTOBS=` 选项告诉 SAS\
  \ 从文件的第三行开始读取数据：\n\n```\nDATA icecream;\n   INFILE 'c:\\MyRawData\\IceCreamSales.dat'\
  \ FIRSTOBS = 3;\n   INPUT Flavor $ 1-9 Location BoxesSold;\nRUN;\n```\n\n### OBS=\n\
  \n当你只想读取数据文件的一部分时，可以使用 `OBS=` 选项。它告诉 SAS 在到达原始数据文件中的某行时停止读取。注意，它并不一定对应于观测值的数量。例如，如果你为每个观测值读取两行原始数据，那么\
  \ `OBS=100` 将读取 100 行数据，生成的 SAS 数据集将会有 50 个观测值。`OBS=` 选项可以配合 `FIRSTOBS=` 选项从文件的中间部分读取行。例如，假设冰淇淋销售数据在文件末尾有一个不是数据的备注。\n\
  \n```\nIce-cream sales data for the summer\nFlavor Location Boxes sold\nChocolate\
  \ 213 123\nVanilla 213 512\nChocolate 415 242\nData verified by Blake White\n```\n\
  \n使用 `FIRSTOBS=3` 和 `OBS=5`，SAS 将从第三行数据开始读取此文件，并在第五行数据后停止读取。\n\n```\nDATA icecream;\n\
  \   INFILE 'c:\\MyRawData\\IceCreamSales2.dat' FIRSTOBS = 3 OBS=5;\n   INPUT Flavor\
  \ $ 1-9 Location BoxesSold;\nRUN;\n```\n\n### MISSOVER\n\n默认情况下，如果 SAS 到达数据行的末尾且\
  \ `INPUT` 语句中仍有更多变量未赋值，SAS 将转到下一行数据读取更多数据。`MISSOVER` 选项告诉 SAS 在数据用尽时不要转到下一行。相反，为任何剩余变量分配缺失值。以下数据文件说明了此选项可能有用的地方。该文件包含自学课程的成绩。由于并非所有学生都完成了所有测试，某些人的分数比别人多。\n\
  \n```\nNguyen 89 76 91 82\nRamos 67 72 80 76 86\nRobbins 76 65 79\n```\n\n以下程序读取五个测试成绩的数据，并为未完成的测试分配缺失值：\n\
  \n```\nDATA class102;\n   INFILE 'c:\\MyRawData\\AllScores.dat' MISSOVER;\n   INPUT\
  \ Name $ Test1 Test2 Test3 Test4 Test5;\nRUN;\n```\n\n### TRUNCOVER\n\n当你使用列输入或格式化输入读取数据，且某些数据行比其他行短时，你需要\
  \ `TRUNCOVER` 选项。如果变量的字段超过了数据行的末尾，默认情况下，SAS 将转到下一行。\n\n```\nJohn 85 90 78\nMaria\
  \ 92 85\nDavid 70\n```\n\n`TRUNCOVER` 选项允许 SAS 读取行末尾而不移动到下一行。这在数据行长度不相同时特别别有用。\n\
  \n## 2.18 使用 DATA 步读取分隔符文件\n\n我们认为你现在已经意识到实现相同结果的方法不止一种。第 2.6 节展示了如何使用 `IMPORT`\
  \ 过程读取分隔符文件；现在我们将展示如何使用 `DATA` 步读取分隔符文件。`INFILE` 语句有两个方便读取分隔符文件的选项：`DLM=` 选项和 `DSD`\
  \ 选项。\n\n### DLM=选项\n\n如果你使用列表输入读取数据，SAS 期望值之间有空格。`INFILE` 语句中的 `DELIMITER=` 或 `DLM=`\
  \ 选项允许你使用其他分隔符。要读取逗号分隔的数据，在 `INFILE` 语句中添加 `DLM=` 选项：\n\n```\nINFILE 'filename'\
  \ DLM = ',';\n```\n\n你也可以使用 `DLM=` 选项指定制表符作为分隔符。在 ASCII 中，09 是制表符的十六进制值，`'09'X`\
  \ 表示十六进制 09。\n\n![image](img/tab.jpg)\n\n如果计算机使用的是 EBCDIC（IBM 主机）而不是 ASCII，请使用 `DLM='05'X`。这是一个指定\
  \ ASCII 制表符的 `DLM=` 选项：\n\n```sas\nINFILE 'filename' DLM = '09'X;\n```\n\n逗号和制表符是数据的常用分隔符，但你可以通过在\
  \ `DLM=` 选项后将分隔符括在引号内使用任何字符（例如 `DLM='&'`）。如果分隔符是一个字符串，请使用 `DLMSTR=` 选项。\n\n### DSD\
  \ 选项\n\n`INFILE` 语句的 `DSD`（分隔符敏感数据）选项为你做了三件事：\n1. 第一，它忽略引号数据值中的分隔符。\n2. 第二，它不将引号作为数据值的一部分。\n\
  3. 第三，它将连续的两个分隔符视为缺失值。\n\n`DSD` 选项假设分隔符是逗号。如果你的分隔符不是逗号，你可以配合 `DSD` 选项使用 `DLM=` 选项来指定分隔符。例如，要读取两个连续制表符表示缺失值的制表符分隔\
  \ ASCII 文件，请使用：\n\n```\nINFILE 'filename' DLM = '09'X DSD;\n```\n\n\n\n\n\n逗号分隔值文件，或\
  \ `CSV` 文件，可以使用 `DSD` 选项读取的常用文件类型。许多程序（如 Microsoft Excel）可以将数据保存为 `CSV` 格式。这些文件使用逗号作为分隔符，连续逗号表示缺失值；如果任何数据值中包含逗号，则这些值将用引号括起来。\n\
  \n### 示例\n下面的示例说明了如何使用 `DSD` 选项读取 `CSV` 文件。Jerry 的咖啡店聘请本地乐队来吸引顾客。Jerry 记录了每个乐队在店里表演的每个晚上的客人数。乐队名称后面是晚上\
  \ 8 点、9 点、10 点和 11 点的客人数。\n\n```\nLupine Lights,45,63,70,\nAwesome Octaves,17,28,44,12\n\
  \"Stop, Drop, and Rock-N-Roll\",34,62,77,91\nThe Silveyville Jazz Quartet,38,30,42,43\n\
  Catalina Converts,56,,65,34\n```\n\n注意，其中一个乐队的名称包含逗号，并被引号括起来。此外，最后一个乐队在晚上 9 点有一个缺失的数据点，如两个连续的逗号所示。以下是读取此数据文件文件的程序：\n\
  \n```sas\nDATA music;\nINFILE 'c:\\MyRawData\\Bands.csv' DLM = ',' DSD MISSOVER;\n\
  INPUT BandName :$30\\. EightPM NinePM TenPM ElevenPM;\nRUN;\n```\n\n注意，对于 `BandName`，`INPUT`\
  \ 语句使用了带有冒号修饰符的格式（informat）。冒号修饰符告诉 SAS 读取到格式的长度为止（`BandName` 为 30），或者直到遇到分隔符为止，以先到者为准。\n\
  \n该数据文件在第一行的末尾缺少一个数据值。默认情况下，SAS 会跳到下一行数据来寻找最后一个数据值。`INFILE` 语句上的 `MISSOVER` 选项告诉\
  \ SAS 在值用尽时不要跳到下一行数据。在使用 `DSD` 选项时，如果你的数据行末尾可能存在数据值，添加 `MISSOVER` 选项是明智的。\n\n以下是\
  \ `MUSIC` 数据集：\n\n| | BandName | EightPM | NinePM | TenPM | ElevenPM |\n| --- |\
  \ --- | --- | --- | --- | --- |\n| 1 | Lupine Lights | 45 | 63 | 70 | . |\n| 2 |\
  \ Awesome Octaves | 17 | 28 | 44 | 12 |\n| 3 | Stop, Drop, and Rock-N-Roll | 34\
  \ | 62 | 77 | 91 |\n| 4 | The Silveyville Jazz Quartet | 38 | 30 | 42 | 43 |\n|\
  \ 5 | Catalina Converts | 56 | . | 65 | 34 |\n\nSAS 日志包含这些描述新数据集的注释：\n\n```sastext\n\
  NOTE: 5 records were read from the infile 'c:\\MyRawData\\Bands.csv'.\n      The\
  \ minimum record length was 23.\n      The maximum record length was 41.\nNOTE:\
  \ The data set WORK.MUSIC has 5 observations and 5 variables.\n```\n\n# 第 3 章：处理你的数据\n\
  \n## 3.1 使用 DATA 步修改数据\n## 3.2 创建和修改变量\n## 3.3 使用 SAS 函数\n## 3.4 选定的 SAS 字符函数\n\
  ## 3.5 选定的 SAS 数值函数\n## 3.6 使用 IF-THEN 和 DO 语句\n#### 3.7 使用 IF-THEN/ELSE 语句分组分组\n\
  ## 3.8 在 DATA 步中子集你的数据\n## 3.9 使用 PROC SQL 子集你的数据\n## 3.10 使用 OUTPUT 语句写入多个数据集\n\
  ## 3.11 使用 OUTPUT 语句从一个值创建多个观测值\n## 3.12 使用迭代 DO、DO WHILE 和 DO UNTIL 语句\n## 3.13\
  \ 处理 SAS 日期\n## 3.14 选定的日期格式、函数和显示格式\n## 3.15 使用 RETAIN 和 Sum 语句\n## 3.16 使用数组（Arrays）简化程序\n\
  ## 3.17 使用变量名列表的快捷方式\n#### 3.18 使用带有特殊字符的变量名\n\n## 1 使用 DATA 步修改数据\n`DATA` 步是处理数据的非常强大的工具。使用\
  \ `DATA` 步，你可以读取数据文件、修改现有数据集并合并数据集。你还可以利用许多操作符和 SAS 函数创建新变量，使用条件逻辑，子集数据以及许多其他功能。使用\
  \ `DATA` 步可以做的事情太多了，我们完全可以就这个主题写一本书。本章讨论了你可能想要对数据执行的许多常用操作。\n\n### 带有 INPUT 语句的\
  \ DATA 步\n我们在第 2 章已经看到了许多使用 `INPUT` 语句读取数据文件的示例。如果你想进行任何其他操作（例如创建新变量），可以在与 `INPUT`\
  \ 语句相同的 `DATA` 步中进行。只需记住 `DATA` 步是逐行执行的，因此其他语句需要放在 `INPUT` 语句之后。以下显示读取原始数据时 `DATA`\
  \ 步的通用形式：\n\n```sas\nDATA new-set;\nINFILE raw-data;\nINPUT variables;\n```sas\n\
  \n### 带有 SET 语句的 DATA 步\n当你的数据已经在 SAS 数据集中，但你想对数据进行更多处理时，使用 `SET` 语句。`SET` 语句一次将一个观测值带入\
  \ `DATA` 步。要读取一个数据集，从 `DATA` 语句开始，通过 `SET` 语句指定旧数据集的名称。如果你不想创建新数据集，可以在 `DATA` 和\
  \ `SET` 语句中指定相同的名称，这样会覆盖旧数据集。\n\n```sas\nDATA old-data;\nSET old-data;\n* Other\
  \ statements go\n```\n\n任何赋值、子集 `IF` 或其他 `DATA` 语句通常跟在 `SET` 语句后面。例如，以下创建一个新数据集\
  \ `FRIDAY`，它是 `SALES` 数据集的副本，但它有一个额外的变量 `Total`：\n\n```sas\nDATA friday;\nSET sales;\n\
  Total = Popcorn + Peanuts;\nRUN;\n```\n\n### 示例\n下面的原始数据提供了关于京都酒店的信息。酒店名称后面是人的每晚费率以及距离京都站的公里数。\n\
  \n```\nThe Grand West Arashiyama 32200 9.5\nKyoto Sharagram 48000 3.3\nThe Palace\
  \ Side Hotel 10200 3.8\nRin Fushinari 41000 2.9\nRin Nijo Castle 18000 3.3\nSuiran\
  \ Kyoto 10200 11.0\n```\n\n该程序读取原始数据文件 `KyotoHotels.dat` 并创建一个持久 SAS 数据集。`INPUT`\
  \ 语句之后是一个简单的赋值语句（将在下一节详细介绍），它创建一个新变量 `USD`，将 `Yen` 变量的值乘以汇率 `0.0089`。\n\n```sas\n\
  LIBNAME hotels 'c:\\MySASLib';\nDATA hotels.kyohotels;\nINFILE 'c:\\MyRawData\\\
  KyotoHotels.dat';\nINPUT Hotel $ 1-25 Yen Kilometers;\nUSD = Yen * 0.0089;\nRUN;\n\
  ```\n\n这是程序创建的 SAS 数据集 `KYOTOHOTELS`：\n\n| | Hotel | Yen | Kilometers | USD |\n\
  | --- | --- | --- | --- | --- |\n| 1 | The Grand West Arashiyama | 32200 | 9.5 |\
  \ 286.58 |\n| 2 | Kyoto Sharagram | 48000 | 3.3 | 427.20 |\n| 3 | The Palace Side\
  \ Hotel | 10200 | 3.8 | 90.78 |\n| 4 | Rin Fushimiinari | 41000 | 2.9 | 364.90 |\n\
  | 5 | Rin Nijo Castle | 18000 | 3.3 | 160.20 |\n| 6 | Suiran Kyoto | 102000 | 11.0\
  \ | 907.80 |\n\n\n\n\n\n### 示例\n\n此程序使用 `SET` 语句读取上一个示例中创建的 SAS 数据集 `KYOTOHOTELS`，并创建一个新的临时\
  \ SAS 数据集 `HOTELS`。然后，在 `SET` 语句之后，一个简单的赋值语句创建了一个新变量 `Miles`，它将变量 `Kilometers` 的值乘以\
  \ `0.62`。\n\n```sas\nLIBNAME hotels 'C:\\MySASLib';\n\nDATA hotels;\n  SET hotels.kyotohotels;\n\
  \  Miles = Kilometers * 0.62;\nRUN;\n```\n\n以下是 SAS 数据集 `HOTELS`：\n\n|  | **酒店**\
  \ | **日元** | **公里** | **美元** | **英里** |\n| --- | --- | --- | --- | --- | --- |\n\
  | 1 | The Grand West Arashiyama | 32200 | 9.5 | 286.58 | 5.890 |\n| 2 | Kyoto Sharagam\
  \ | 48000 | 3.3 | 427.20 | 2.046 |\n| 3 | The Palace Side Hotel | 10200 | 3.8 |\
  \ 90.78 | 2.356 |\n| 4 | Rinn Fushimiinari | 41000 | 2.9 | 364.90 | 1.798 |\n| 5\
  \ | Rinn Nijo Castle | 18000 | 3.3 | 160.20 | 2.046 |\n| 6 | Suiran Kyoto | 102000\
  \ | 11.0 | 907.80 | 6.820 |\n\n## 3.2 创建和修改变量\n\n如果有人要列出一份 SAS 软件最常用功能清单，那么创建和修改变量肯定名列前茅。幸运的是，SAS\
  \ 非常灵活，并使用符合直觉的方法处理这些任务。你使用以下基本形式的赋值语句创建和重新定义变量：\n\n`variable = expression;`\n\n\
  等号左侧是变量名，可以是新的也可以旧的。等号右侧可以是常量、另一个变量或数学表达式。以下是这些基本类型赋值语句的示例：\n\n| 表达式类型 | 赋值语句 |\n\
  | --- | --- |\n| 数值常量 | `Qwerty = 10;` |\n| 字符常量 | `Qwerty = 'ten';` |\n| 变量 | `Qwerty\
  \ = OldVar;` |\n| 加法 | `Qwerty = OldVar + 10;` |\n| 减法 | `Qwerty = OldVar - 10;`\
  \ |\n| 乘法 | `Qwerty = OldVar * 10;` |\n| 除法 | `Qwerty = OldVar / 10;` |\n| 幂 | `Qwerty\
  \ = OldVar ** 10;` |\n\n变量 `Qwerty` 是数值还是字符取决于定义它的表达式。当表达式是数值时，`Qwerty` 就是数值型。当它是字符时，`Qwerty`\
  \ 就是字符型。\n\n在决定如何解释你的表达式时，SAS 遵循标准的数学优先级规则：SAS 先执行幂，然后是乘法和除法，最后是加法和减法。你可以使用括号来覆盖该顺序。以下是两个相似的\
  \ SAS 语句，展示了括号可以产生巨大的差异：\n\n| 赋值语句 | 结果 |\n| --- | --- |\n| `x = 10 * 4 + 3 ** 2;`\
  \ | `x = 49` |\n| `x = 10 * (4 + 3 ** 2);` | `x = 130` |\n\n虽然 SAS 可以读取带或不带括号的表达式，但人们往往不能。如果你使用括号，你的程序将更易读。\n\
  \n### 示例\n以下逗号分隔值 (CSV) 数据来自一项对家庭园艺爱好者的调查。园艺爱好者被要求估计他们四种作物收获的磅数：西番茄、西葫芦、豌豆和葡萄子。\n\
  \n```csv\nName,Tomato,Zucchini,Peas,Grapes\nGregor,10,2,40,0\nMolly,15,5,10,1000\n\
  Luther,50,10,15,50\nSusan,20,0,.,20\n```\n\n此程序使用 `PROC IMPORT` 从名为 `Garden.csv`\
  \ 的文件中读取数据，然后在 `DATA` 步骤中修改数据：\n\n```sas\n* 使用 PROC IMPORT 读取 csv 文件;\nPROC IMPORT\
  \ DATAFILE = 'c:\\MyRawData\\Garden.csv' OUT = homegarden REPLACE;\nRUN;\n\n* 使用赋值语句修改\
  \ homegarden 数据集;\nDATA homegarden;\n  SET homegarden;\n  Zone = 14;\n  Type = 'home';\n\
  \  Zucchini = Zucchini * 10;\n  Total = Tomato + Zucchini + Peas + Grapes;\n  PerTom\
  \ = (Tomato / Total) * 100;\nRUN;\n```\n\n此程序包含五个赋值语句。第一个创建了一个新变量 `Zone`，等于数值常量\
  \ `14`。变量 `Type` 被设置为字符常量 `home`。变量 `Zucchini` 乘以 `10`，因为这对于多产的西葫芦来说似乎很自然。`Total`\
  \ 是所有类型植物的总和。`PerTom` 不是基因工程西番茄，而是收获中西番茄所占的百分比。SAS 数据集包含所有变量：\n\n|  | **名称** | **西番茄**\
  \ | **西葫芦** | **豌豆** | **葡萄** | **区域** | **类型** | **总计** | **西番茄占比** |\n| --- |\
  \ --- | --- | --- | --- | --- | --- | --- | --- |\n| Gregor | 10 | 2 | 40 | 0 |\
  \ | | | |\n| Molly | 15 | 5 | 10 | 1000 | | | | |\n| Luther | 50 | 10 | 15 | 50\
  \ | | | | |\n| Susan | 20 | 0 | . | 20 | | | | |\n\n*(注：由于原文文本似乎存在部分逻辑重复或乱码，此处已根据上下文语义进行了翻译对齐以确保逻辑连贯)*\n\
  \n## 3.3 使用 SAS 函数\n\n有时，仅使用算术运算符的简单表达式无法给你你需要的值。这时函数非常有用，它们简化了你的任务，因为 SAS 已经为你完成了编程。你只需要将值代入函数即可得到结果——就像把硬币投入投币机。\n\
  \nSAS 有数百个函数，涵盖以下领域：\n\n| 字符 | 宏 |\n| 字符串匹配 | 数学 |\n| 日期和时间 | 概率 |\n| 描述性统计 | 随机数\
  \ |\n| 距离 | ZIP 代码 |\n| 财务 | 变量信息 |\n\n接下来两个部分列出了常用的 SAS 函数。函数会对括号内的参数进行计算或转换。SAS\
  \ 函数的通用形式为：\n\n`函数名(参数, 参数, ...)`\n\n即使函数不需要参数也带有括号。参数之间用逗号分隔，可以是变量名、用引号括的常量值或表达式。以下语句使用\
  \ `MDY` 函数和变量 `MonthBorn`、`DayBorn` 以及 `YearBorn` 计算 SAS 日期 `DateOfBirth`。`MDY`\
  \ 函数接受三个参数，分别是月、日、年：\n\n```sas\nDateOfBirth = MDY(MonthBorn, DayBorn, YearBorn);\n\
  ```\n\n函数可以嵌套，即一个函数是另一个函数的参数。例如，以下语句使用两个嵌套函数 `INT` 和 `LOG` 计算 `NewValue`：\n\n```sas\n\
  NewValue = INT(LOG(10));\n```\n\n该示例的结果是 2，数值常量 10 的自然对数的整数部分 (2.3026)。在嵌套每个括号都有配对的函数时要格外小心。\n\
  \n### 示例南瓜雕刻比赛的示例数据展示了多个函数的使用。参赛者的姓名后面是他们的年龄、南瓜类型（雕刻或装饰）、参赛日期以及三位评审的评分。以下是在 2.10\
  \ 节中创建的 SAS 数据集 `CONTEST`：\n\n|    | **名称** | **年龄** | **类型** | **日期** | **评分 1**\
  \ | **评分 2** | **评分 3** |\n| --- | --- | --- | --- | --- | --- | --- | --- |\n|\
  \ 1 | Alicia Grossman | 13 | c | 22216 | 7.8 | 6.5 | 7.2 |\n\n\n\n\n\n| 2 | Matthew\
  \ Lee | 9 | D | 22218 | 6.5 | 5.9 | 6.8 |\n| 3 | Elizabeth Garcia | 10 | C | 22217\
  \ | 8.9 | 7.9 | 8.5 |\n| 4 | Lori Newcombe | 6 | D | 22218 | 6.7 | . | 4.9 |\n|\
  \ 5 | Jose Martinez | 7 | d | 22219 | 8.9 | 9.5 | 10.0 |\n| 6 | Brian Williams |\
  \ 11 | C | 22217 | 7.8 | 8.4 | 8.5 |\n\n以下程序读取了 SAS 数据集 `CONTEST`，创建了两个新变量（`AvgScore`\
  \ 和 `DayEntered`），并转换了另一个变量（`Type`）：\n\n```sas\nLIBNAME pump 'c:\\MySASLib';\n\n\
  *Use SAS functions to create and modify variables;\nDATA pumpkin;\n   SET pump.contest;\n\
  \   AvgScore = MEAN(Score1, Score2, Score3);\n   DayEntered = DAY(Date);\n   Type\
  \ = UPCASE(Type);\nRUN;\n```\n\n变量 `AvgScore` 是使用 `MEAN` 函数创建的，该函数返回非缺失参数的平均值。这与简单地将参数相加并除以数量不同，后者如果任何参数缺失，将返回缺失值。\n\
  \n变量 `DayEntered` 是使用 `DAY` 函数创建的，该函数返回月份中的几几。SAS 拥有各种处理日期的函数，其非常棒之处在于你不需要担心闰年等问题——SAS\
  \ 会为你处理好。\n\n变量 `Type` 是使用 `UPCASE` 函数转换的。SAS 在处理变量值时对大小写敏感；'d' 不等于 'D'。数据文件中变量\
  \ `Type` 既有小写字母也有大写字母，因此使用 `UPCASE` 函数将所有值转换为大写。\n\n以下是上述程序创建的 SAS 数据集 `PUMPKIN`：\n\
  \n| | Name | Age | Type | Date | Score1 | Score2 | Score3 | AvgScore | DayEntered\
  \ |\n| --- | --- | --- | --- | --- | --- | --- | --- | --- | --- |\n| 1 | Alicia\
  \ Grossman | 13 | C | 22216 | 7.8 | 6.5 | 7.2 | 7.16667 | 28 |\n| 2 | Matthew Lee\
  \ | 9 | D | 22218 | 6.5 | 5.9 | 6.8 | 6.40000 | 30 |\n| 3 | Elizabeth Garcia | 10\
  \ | C | 22217 | 8.9 | 7.9 | 8.5 | 8.43333 | 29 |\n| 4 | Lori Newcombe | 6 | D |\
  \ 22218 | 6.7 | . | 4.9 | 5.80000 | 30 |\n| 5 | Jose Martinez | 7 | D | 22219 |\
  \ 8.9 | 9.5 | 10.0 | 9.46667 | 31 |\n| 6 | Brian Williams | 11 | C | 22217 | 7.8\
  \ | 8.4 | 8.5 | 8.23333 | 29 |\n\n注意 `Date` 变量的值显示为自 1960 年 1 月 1 日以来的天数。第 4.6 节讨论了如何将这些值格式化为可读日期。\n\
  \n### 3.4 选用的 SAS 字符函数\n\n| 函数名 | 语法¹ | 定义 |\n| :--- | :--- | :--- |\n| **字符** |\
