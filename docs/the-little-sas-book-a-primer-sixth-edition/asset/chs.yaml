  \ by Kind of Vessel |\n| --- | --- |\n| catamaran | schooner | yacht | All |\n|\
  \ --- | --- |\n| catamaran | schooner | yacht | All | (注：原文提供的示例表格内容存在重复，此处忠实翻译格式)\n\
  \n抱歉，重新审视原文输出表格：\n| Full Day Excursions | Mean Price by Kind of Vessel |\n| ---\
