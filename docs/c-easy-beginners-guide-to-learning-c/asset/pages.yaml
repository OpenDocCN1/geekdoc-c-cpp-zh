    # The Exclusive OR and Negation Operators


    The exclusive OR (i.e., ^) is a full-circuit operator since it needs to check
    both operands before giving the result. It will give you true ONLY IF one of the
    operands evaluates to true. Thus, you will get false if both of the operands are
