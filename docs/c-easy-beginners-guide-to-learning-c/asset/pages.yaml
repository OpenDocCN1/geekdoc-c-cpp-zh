    in detail:


    The AND and OR Operators


    You can only use the logical AND (i.e., &&) & logical OR (i.e., ||) operators
    on expressions that involve Boolean values. The logical AND operator will give
    you “true" if both of the operands are true. For example:


    ```

    bool sample = (1 < 2) && (10 == 10);

    ```


    The expression will be true because one is less than 2, and 10 is equal to 10.
    Programmers refer to the logical AND operator as a "short-circuit operator" since
    it produces quick results without performing unnecessary analyses. This evaluation
    ends immediately if it is false. Due to the false operand, the expression can
    no longer be true.


    The logical OR (i.e., ||) operator, on the other hand, will give you true if at
    least one of your operands evaluates to true. For instance:


    ```

    bool sample = (1 < 2) || (10 > 100);

    ```'
