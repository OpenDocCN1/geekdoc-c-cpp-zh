  md: '# # Variables, Literals, and Data Types of C#


    The purpose of this chapter is to cover the variables and data types used in C#.
    After reading this material, you will learn what these objects are and how to
    write your programs.


    # ## Variables


    Different values are used during the execution of specific programs. Mathematical
    problems can be solved with a program. When you use such a program, you must enter
    different values. Programmers do not know what values users will enter. Therefore,
    they should make sure that any input that users provide is included in the resulting
    programs.


    It is possible to temporarily store a user''s value in the machine''s RAM (i.e.,
    random access memory). These values may change over time. Programmers call such
    values "variables" because of this.


    # ## Data Types


    A data type consists of a group of values whose attributes are similar. As an
    example,


    Among the "0 to 255" range of values, these are referred to as "byte" data. Attributes


    These are the attributes of data types:


    The name of the type of data (i.e., int, char, bool, etc.).


    The size of the file (e.g., 1 byte)


    This is the default value (for example, 1, 2, 3, etc.).


    # ## C# Data Types


    The following data types are supported by C#:


    +   - Boolean


    +   - Characters


    +   - Objects


    +   - Floating-Point'
