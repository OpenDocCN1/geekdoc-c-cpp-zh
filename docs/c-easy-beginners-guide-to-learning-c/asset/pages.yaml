  md: '# Method Implementations


    Declaring a method is not enough. You also need to implement your methods if you
    want

    them to run inside your programs. Programmers use the term "body" when referring
    to the implementation of a method.


    # The Body


    You will find the method''s body inside a pair of curly braces. This body consists
    of commands, expressions, and statements that you want to execute. Thus, the body
    is an important part of any method.


    Important Note: Keep in mind that you cannot nest methods in C#. Do not write
    methods inside other methods.


    # Method Invocations


    This is the process of running the statements within the method''s body. Invoking
    a method is easy and simple: you have to indicate its name, add a pair of curly
    braces, and terminate the line using a semicolon. Here is the syntax that you
    should use: name_of_method();'
