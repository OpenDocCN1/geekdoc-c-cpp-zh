    # Console


    This chapter aims to teach you how to use the console to collect and provide data.
    Using this tool, you will learn to perform I/O (Input/Output) operations in C#.


    # Console – The Basics


    You can connect to your computer''s console to interact with its programs. For
    this reason, consoles are viewed as a crucial part of any operating system.


    Users and programs interact in C# using standard output (e.g., screen) and/or
    input (e.g., keyboard strokes). They are referred collectively as I/O operations.
    A computer program''s text within the console provides useful data.


    I/O devices on the computer are linked to every console program installed through
    your computer''s OS (i.e., operating system). The default input and output devices
    on most computers are screens and keyboards. If you wish, you can easily redirect
    these channels to a particular file or device.


    # Programming Interfaces and User Interactions


    Users interact with most computer programs. Whenever a user interacts with a program,
    they must provide input and instructions. These days, there are many ways to interact:
    console-based, browser-based, internet-based, graphical, etc. As a result, the
    number of people using consoles to interact with programs is steadily decreasing.
    This is because the alternative options (e.g., browser-based) are more user-friendly
    and convenient.


    # Using the Console


    ```

    C:\Windows\system32\cmd.exe

