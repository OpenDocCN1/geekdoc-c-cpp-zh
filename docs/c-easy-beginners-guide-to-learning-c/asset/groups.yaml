    \n### AND 和 OR 运算符\n\n你只能在涉及布尔值的表达式上使用逻辑与（即 `&&`）和逻辑或（即 `||`）运算符。如果两个操作数都为真，逻辑与运算符将给你“true”。例如：\n\
