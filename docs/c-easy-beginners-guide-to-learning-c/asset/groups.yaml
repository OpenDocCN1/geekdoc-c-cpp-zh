    \ C#”。你无法运行它，因为它仍然是一个“原始”程序。此时，让我们看看它的结构。使用编程环境和命令提示符，你将通过编译和运行程序来完成以下部分。\n\n\
    ### 流程是什么？\n\n这个示例程序包含三个部分：\n\n- 1. 类的定义；\n- 2. 方法的定义；以及\n- 3. 方法的内容。\n\n以下是每个部分的详细说明：\n\
    \n该程序从第一行开始定义一个名为 HelloCSharp 的类。类定义通常分为两个部分：(1) 类名和(2) 它的描述。如下所示，类名为 HelloCSharp。有两个括号分隔了该类的内容（即\
    \ `{ }`）。\n\n在程序的第三行，你将找到方法定义。这是 `Main()` 方法。每个 C# 程序都从这个 `Main()` 方法开始。使用以下语法最好：\n\
    \n`Main()` 方法必须是 `static`（静态）和 `void`（空）。在任何情况下，参数（括号之间的部分）都是可选的。换句话说，它可以表述为：\n\
    \n```csharp\nclass HelloCSharp{static void Main()}{System.Console.WriteLine(\"\
    Hello C#!\");}\n\nclass HelloCSharp{\n    static void Main(){\n        System.Console.WriteLine(\"\
    Hello C#!\");\n    }\n}\n```\n\n错误地放置 `Main()` 方法会导致程序崩溃。\n\n### 方法的内容 –\n\n点击方法名后，你将看到它的内容。括号内的内容通常包含在其中。如前一行所示，第五行通过使用对象（即\
    \ `System.Console`）和方法（即 `WriteLine()`）在你的计算机控制台上显示一条消息。消息是“Hello, C#”。\n\n##\
    \ 编写代码的规则\n\n### 大小写敏感语言\n\nC# 代码是大小写敏感的。在编写 C# 时，必须注意大小写。\n\n### 正确格式化代码\n\n\
    如果你想让代码更易读，你应该这样做。\n\n## 代码的正确格式化\n\n代码格式化允许你在类定义中进行缩进。\n\n## 类的类型\n\n每个 C# 程序至少包含一个类定义。在编程中，类定义通常位于类名对应的文件中。文件扩展名也应该是\
    \ `.cs`。\n\n## C# 附加信息\n\nC# 是一种高级的、现代的、多功能的面向对象的语言。该语言在许多方面与 C、C++ 和 Java 相似。\n\
    \n数据类型和类定义包含在多个 .cs 文件中。为了生成可执行代码（例如以 `.dll` 或 `.exe` 结尾的文件），这些 `.cs` 文件需要编译。\n\
    \n## C# 编程需要这些\n\n编写 C# 程序需要两样东西：文本编辑器（例如记事本）和 .NET 框架。文本编辑器让编写和编辑代码变得简单。另一方面，你将使用\
    \ .NET 框架编译和运行你的程序。\n\n### .NET 框架是什么？\n\n作为一个框架，.NET 用于创建和运行程序。.NET 是所有 Windows\
    \ 系统的内置框架。在这种情况下，微软现代操作系统允许你在无需安装任何软件的情况下使用。\n\n旧的 Windows 操作系统需要安装 .NET 框架。\n\
    \n```csharp\nHelloCSharp.cs\nclass HelloCSharp\n{\n    static void Main()\n{\n\
    \        Console.WriteLine(\"Hello C#!\");\n    }\n}\n```\n\n## 文本编辑器\n\n为了编写、编辑和保存源代码，你应该使用文本编辑器。几乎每台计算机都自带了文本编辑器。如果你不想下载额外的程序，可以使用“记事本”（Windows\
    \ 默认文本编辑器）。\n\n## 运行和编译程序\n\n你之前看到的 HelloCSharp 程序现在需要编译和运行。请按照以下步骤操作：\n\n- 1.\
    \ 请创建一个 \".cs\" 文件并将其命名为 \"HelloCSharp\"。\n\n"
