    is a "short-circuit operator". The second operand will not be analyzed in the
    present example since the first is already true. As a result, the condition is
    already satisfied.


    # The Exclusive OR and Negation Operators


    The exclusive OR (i.e., ^) is a full-circuit operator since it needs to check
    both operands before giving the result. It will give you true ONLY IF one of the
    operands evaluates to true. Thus, you will get false if both of the operands are
    true. Check the following example: bool sample = (1 < 2) ^ (2 == 2);


    Since the two expressions are true, exclusive OR will give you false.


    However, the negation operator (i.e. !) reverses the Boolean value to which it
    is attached. For instance:


    ```

    bool sample = !(1 < 2);

    ```


    One is less than two. However, since "!" is attached to the Boolean expression,
    the result will be reversed. That means this expression evaluates to "false".'
