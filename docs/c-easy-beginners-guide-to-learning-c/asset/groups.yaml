    programs will be undesirable and/or unexpected if you forget to add a single semicolon.


    ## The Value Assigning Process


    A variable in C# can be assigned a value just like any other computer language.
    You must use the equals sign in this process called "value assignment". It is
    called the "assignment operator" by programmers. On the left side, write the name
    of the variable. On the right side, write the value you want to assign. See examples
    below:


    ```

    test = x;

    ```


    ```

    yourname = "John Doe";

    ```


    ## How to Initialize a Variable


    In coding, "initialization" refers to assigning a value to a variable.


    When you declare a variable, you will set the "initial value".


    ## Default Values of Variables


    If you do not assign one, no value will be assigned to the variable (i.e., A default
    value will be assigned to the variable). Here are the default values for each
    data type:


    Here is an example of declaring variables and assigning values.


    ```

    // This is an example

    byte years = 10;

    short days = 31;

    decimal pi = 3.14;

    bool isentity = true;

    char sample = ''x'';

    string animal = "dog";

    ```


    The lines starting with a forward slash (i.e., //) are considered "comments".
    The purpose of comments in programming is to make the code easier to read. Language
    compilers ignore these lines. This means comments will not interfere with your
    program''s functionality.


    ## Values and References


    There are two types of C# data: value types and reference types.


    In an executable program, a value type exists. In addition, the value type contains
    the value entered by the programmer. Booleans, Characters, and Integers comprise
    value types. By contrast, strings, arrays, and objects are termed "reference types"
    since they do not contain values. Rather, they serve as identifiers of the location
    of where the data is stored in computer memory.

