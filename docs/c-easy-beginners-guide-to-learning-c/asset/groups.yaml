    \ false，你的 C# 程序将不会运行 while 循环的主体。因此，如果启动程序时布尔值为 false，你的循环语句将永远不会被执行。\n\n以下示例将说明循环是如何工作的：\n\
    \n```csharp\nint timer = 10;\n\nwhile (timer >= 0)\n{\n    System.Console.WriteLine(\"\
    Time remaining: \" + timer);\n    timer--;\n}\n```\n\n如果你编译并执行此代码，你的命令提示符将打印以下数据：\n\
    Time remaining: 10\nTime remaining: 9\nTime remaining: 8\nTime remaining: 7\n\
    Time remaining: 6\nTime remaining: 5\nTime remaining: 4\nTime remaining: 3\nTime\
    \ remaining: 2\nTime remaining: 1\nTime remaining: 0\n\n## Break 运算符\n\n你可以使用\
    \ \"break\"（一种 C# 运算符）提前退出循环。当程序员不想等待循环自然结束时，会使用此运算符。一旦遇到 break 运算符，循环就会结束。这种情况强制程序跳转到循环后的代码片段。在\
    \ C# 中，你只能在循环主体内部使用此运算符。\"break\" 只有在循环运行时有效。\n\n## Do-While 循环\n\ndo-while 循环与\
    \ while 循环几乎相同。这些循环之间的唯一区别是前者在运行循环主体之后分析布尔值。因此，你可以确保即使布尔表达式为 false，你的代码至少也会运行一次。以下是\
    \ do-while 循环的语法：\n\n```csharp\ndo\n{\n  statements;\n} while (Boolean expression)\n\
    ```\n\nimg/a36030d08eb55309e54e07543b0a_50_0.png\n\ndo-while 循环按照此模式工作：\n\n程序将执行循环主体内的所有语句。然后，它将检查条件（即布尔表达式）。如果条件求值为\
    \ true，程序将再次执行循环主体并执行“值检查”。这个过程将一直持续直到条件变为 false。因此，如果你的赋值条件始终求值为 true，你的代码可能会无限运行。\n\
    \n## For 循环\n\n通常，“for\" 循环比 do-while 和 while 循环更复杂。然而，循环可以帮助你使用更少的 C# 代码完成困难的任务。\"\
    for\" 循环的语法为：\n"
