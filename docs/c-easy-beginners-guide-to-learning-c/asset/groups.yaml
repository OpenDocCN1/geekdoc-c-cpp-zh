    The console can also test a small code block before adding it to a complex program.
    It is very easy to isolate code blocks using the console since it is a simple
    tool. You will not have to use any buttons. In a few seconds, the console will
    provide you with the results that you need.


    # How to access the console


    Depending on the operating system you are using, you will have different ways
    to access the console. Here is what you need to do if you are using a Windows
    computer:


    +   1. Press the Start button.


    +   2. Click "Programs" and select "Accessories".


    +   3. Click the "Command Prompt" option.


    Your home directory will appear in the console, which is represented by your username.
    Let us look at an example: SARAH


    You can run the console by searching for "cmd" in Windows Vista, Windows 7, or
    Windows 8.


    # Here are some additional details regarding the console


    Consoles display text-based information in a black window. The cursor blinks,
    and characters appear in a string. Whenever you type a character, the cursor moves.


    Windows programs can run on desktops, browsers, Internet browsers, or consoles.
    These programs utilize consoles for input and output.


    For user-program interactions, desktop-based programs rely on their GUIs. Throughout
    this book, you will be entering data using your keyboard, and you will see the
    results in the command prompt.


    While working with a console-based program, you will use your keyboard a lot because
    some applications require text, numbers, characters, etc.


    # Basic Commands


    We will discuss the basic commands you will issue from the command prompt in this
    section. If you are interested in becoming a great C#'
  - '[PAGE 31]


    programmer, you should study this material carefully.


    Using the console commands


    You can change the active directory by using the command cd name_of_directory.


    The following command will take you to the Users folder in C::


    cd:\Users


    dir – This command allows you to view the files contained in an active directory.


    rmdir name_of_directory – You can delete a directory using this command. The command
    rmdir Sample, for example, deletes all files within the directory named "Sample".


    mkdir name_of_directory – It allows you to create a new directory in the active
    directory. When you run mkdir John inside the Users directory, a folder named
    "John" will be created.


    type_name_of_file – The contents of an existing file can be viewed by using this
    command. To see what is inside a .cs file, you might type "type HelloCSharp.cs".


    # Standard I/O


    For UNIX computers, Standard I/O is a mechanism. Special devices handle input
    and output.


    A cursor will appear on the console when a program waits for the user to provide
    information. When this happens, the system is in "waiting mode".


    # Input and Output


    User-program interactions require the definition of standard I/O mechanisms in
    operating systems. When launching a console application, the initialization code
    in the program must use I/O mechanisms assigned by the operating system. This
    code permits communication between the user and console-based program.


    The code in this program consists of a function that can read user input from
    a stream called a console.In, send information to a stream called console.Out,
    and report problematic situations using console.Error (the standard C# error'
  - '[PAGE 32]


    stream).

    C streams will be discussed later in this book. I/O mechanisms in C# will be discussed
    in this chapter.


    # I/O Devices


    Some programs accept Non-keyboard input. Creating programs in C# that use text
    files, barcode readers, microphones, and other data input sources are possible.
    Programs can also send their output to a screen, a hard drive, or a printer.


    # System.Console


    Text-based information can be read, displayed, or formatted using the system.Console
    class. Data entry and data visualization are three of the most popular attributes
    of the system.Console class. Console.In, Console.Out, Console.Error are these
    attributes.


    Data display, information reading, and error reporting are made possible by these
    attributes. They can be directly used in C#. There are other methods and attributes
    in the system.Console that has the potential to assist you in I/O operations.


    Note: Program streams can be modified in the C# language. Use the following methods
    to do this: Console.SetOut (for the Output stream), Console.SetIn (for the Input
    stream), and console.SetError (for the Error stream).


    # Console Input


    Computers have a console for entering information when programming languages are
    used.


    For example, the C# language uses "Console.In" to control its input stream.

    Using Console.In directly is not necessary. There are two methods in the Console
    class (i.e., Console.ReadLine and Console.Read) that work with Console.In. These
    methods allow you to read data from your command prompt.


