    \ 10 等于 10。程序员将逻辑与运算符称为“短路运算符”，因为它可以在不进行不必要分析的情况下产生快速结果。如果结果为假，评估将立即结束。由于假操作数的存在，表达式不再可能为真。\n\
    \n另一方面，逻辑或（即 `||`）运算符如果你的操作数中至少有一个为真，则将给你真。例如：\n\n```csharp\nbool sample = (1\
    \ < 2) || (10 == 10);\n```\n\n该表达式将为真，因为 1 小于 2，或者 10 等于 10。程序员将逻辑或运算符称为“短路运算符”，因为它可以在不进行不必要分析的情况下产生快速结果。如果结果为真，评估将立即结束。由于真操作数的存在，表达式不再可能为假。\n\
    \n# 异或和取反运算符\n\n异或运算符（即 `^`）仅当两个操作数中恰有一个为真时才返回真。如果两个为真或都为假，它将返回假。这在你希望两个条件存在差异时使用。例如：\n\
    \n```csharp\nbool sample = (1 < 2) ^ (10 == 10);\n```\n\n该表达式将为假，因为两个操作数均为真。\n\
    \n取反运算符（即 `!`）反转其所在的布尔值。例如：\n\n```csharp\nbool sample = !(1 < 2);\n```\n\n该表达式将为假，因为一个数小于二。\n\
    \n# 语句\n\n现在你已经知道如何使用比较运算符和逻辑运算符，，时候讨论条件语句的创建了。这些是帮助你实现逻辑强大工具。\n\n# If 语句\n\n\
    if 语句的语法为：\n\n```csharp\nif (条件表达式)\n{\n  语句体;\n}\n```\n\n如你所示，该语法有三个部分：\n\n-\
    \ \"if\" 子句 – 这部分表示 \"if\" 语句的开始。\n- 布尔表达式 – 这部分可以包含逻辑表达式或持有布尔数据的变量。与 C 不同，C#\
    \ 不在条件语句中接受整数表达式。\n- 语句体 – 你需要使用一对大括号来封装这部分。C# 允许在该部分内放置多个语句。\n\n如果布尔表达式评估为真，程序将运行语句体。如果评估为假，程序将忽略语句体并控制后续代码块。下面的示例将向你展示语句是如何工作的：\n\
    \n```csharp\nConsole.WriteLine(\"Please enter a number.\");\nint number1 = int.Parse(Console.ReadLine());\n\
    \nint number2 = 0;\nif (number1 > number2)\n{\n    Console.WriteLine(\"C# is an\
    \ excellent programming language.\");\n}\n```\n\n此代码需要用户提供数字。如果用户的输入大于零，程序将在命令提示符中打印“C#\
    \ is an excellent programming language.”。\n\n重要注意：如果条件语句体只有单行，你可以省略大括号。查看下面的示例：\n\
    \n```csharp\nint x = 10;\nif (x > 0)\n    System.Console.WriteLine(\"This variable\
    \ holds a positive number.\");\n```\n\n# If-Else 语句\n\n与其他编程语言一样，C# 支持 \"if-else\"\
    \ 条件语句。\n\n"
