    # Naming variables


    If you want to store a number or some text somewhere you do so in a variable.


    Variables should always be named with descriptive names. You should always start
    with a little letter. You can separate variables with underscores like this my_own_variable.


    # Getting user input


    Getting user input is surprisingly simple in Python. We use another supplied function
    input(). This function is very similar to the print() function in as much as it
    can be given a string which it sends to the screen. The difference is it can only
    take one string and it then waits for the return key on the keyboard to be pressed.
    This means it can be used to pause a program or wait until the user is ready.
    However it does one other thing: it returns, as a string, everything that is typed
    by the user until the return key is pressed. This can be collected in a string
    variable like this.


    ```

    keyboard_input = input("Enter some text please.")

    ```


    Python does not require that you name variables like this if you want the respect
    of other coders you will!


