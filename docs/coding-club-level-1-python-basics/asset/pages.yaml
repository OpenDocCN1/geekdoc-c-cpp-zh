  md: '# Coding


    **Coding is** writing instructions for a computer to perform a task. This code
    has to be in a form that the computer can **understand**. This is more more formally
    known as computer programming.


    Computers and coding have not been around for a long time but they have sure packed
    in some interesting history in in a short space of time. The first machine that
    stored instructions in a way that future computers could take advantage of was
    the Jacquard loom that used holes punched in cards and was invented in 1801. Charles
    Babbage is often credited with inventing the first computer which he described
    in 1837 but was not built until 100 years later. In 1989 Guido van Rossum started
    to create the Python programming language which he named after Monty Python''s
    Flying Circus, a BBC comedy sketch show.


    # Programming languages


    There are many programming languages currently used by coders around the world.
    Some are best in one situation, others in another.


    +   - HTML is good for producing web pages.


    +   - SQL is great at making databases do what what you want.


    +   - Python is brilliant for writing quick applications, running programming
    experiments and for building larger applications, including games.'
  merge: -1
  pgno: 10
- img_proc: true
  md: 'If you have previously programmed in Scratch (produced by MIT) you will find
    you can pick up Python very quickly. Scratch is great for learning how to think
    like a programmer and is very good for making games. If you have not tried Scratch
    before, you might enjoy trying that next because the ability to learn a new programming
    language is an important skill for coders. You will find it is a lot easier than
    learning a new human language.


    Once you have learned one modern programming language, you can quickly learn others.
    You simply have to find out how your new language handles variables, loops, etc.
    (You will know what these are by the end of the book.)


    # Python


    Python is a typed computer language. This makes writing short programs very fast
    and you can produce almost anything you can imagine.


    Python is a powerful, modern programming language used by many famous organisations
    such as YouTube and NASA. It is one of three programming languages that can be
    used to write Google Apps. Python is a great language. Enjoy!


    # IDLE


    You will start programming in IDLE which comes with Python. IDLE is a special
    text editor like Microsoft Word, except it understands Python and helps you get
    your code right. IDLE is itself, a Python application.


    Python is also one of the languages used by the European Particle Accelerator
    organisation, CERN.


    ![](img/fbaeb9cdecc73e46b84c17d0505a6ca3_11_0.png)'
