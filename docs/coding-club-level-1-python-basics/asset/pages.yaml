  md: '# Modules


    import random uses a new Python word – import – followed by the name of a Python
    module.


    A module is a Python file with special code that you do not have to write yourself
    but that you can use. There are many modules available and it is also possible
    to write your own. import random brings in to your application a selection of
    functions that you can use later in your program. (Chapter 4 is all about functions.)


    # String variables


    The last 8 lines of code are the variables where you store some strings (bits
    of text) that will be used later in the game. At this early stage you may be asking
    yourself, how do I know what to call my variables? Well within reason you can
    call them what you like. There are only 31 reserved words in Python.


    ![](img/fbaeb9cdecc73e46b84c17d0505a6ca3_32_0.png)


    There are 31 Python words that you cannot use as your variable names. and as assert
    class continue def elif else except finally from global if import is in lambda
    nonlocal or no pass print raise retry with yield


    You must also be careful to use only letters and underscores and no unusual characters
    such as & @ $ * () ?:; [ ] <^`={||}|/\. Spaces are not allowed either. Numbers
    are not allowed but at the beginning of your variable names.


    # Writing tidy code


    It is important to write your code so it is easy for you to read later, when you
    have forgotten how you did things. It also makes it easier, if your code is well
    written, for other coders to understand what you did.


    # White space


    Lots of computer languages like Java, PHP and C++ wrap chunks of code in curly
    brackets. Each statement has to end in a semicolon.'
