  md: '# self


    As this uses methods from tkinter, this function has to be supplied with the argument
    self.

    is is to do with tkinter''s methods being in classes. Functions in classes are
    called methods.

    (Remember though, that we are not covering classes in this book.) For now, just
    supply self.


    # global


    At the start of our script, we declared all our variables and gave them some default
    values.

    as they are outside any functions, they are global variables. This means that
    they are

    available throughout the program. However, any variables declared inside a function
    are

    called local variables, which means that they are not available outside their
    function and

    will be lost when the function call is over. As we want all functions to use our
    global

    variables we have to tell this function, by re-declaring them inside the function,
    using

    t keyword global. This is only required if the function is going to change the
    variable. By

    doing this the function is using the same variables as the rest of the program.


    # The create_line() method


    We are using the create_line() method from tkinter''s canvas class:


    ```

    canvas.create_line(arguments go here)

    ```


    The arguments required are shown in Table 5.2 on the next page.'
