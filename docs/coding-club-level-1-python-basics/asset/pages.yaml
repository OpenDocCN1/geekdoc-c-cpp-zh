- img_proc: true
  md: 'So a point on the screen is represented by two numbers:


    e.g. (100, 50) = a point 100 pixels along the x-axis and 50 pixels down the y-axis.


    # Keeping code organised


    The function to draw a vertical line requires a few more variables so that we
    can keep track of where we are up to. These should go at the top of your code
    with your other variable declarations. This is good coding style. Now if you want
    to adjust your program, you simply adjust the variables at the top and re-run
    it. You do not have to dig through your code to find where things happen. Also
    by choosing descriptive names for the variables you do not need excessive amounts
    of commenting.


    The functions should come next. They need to be before the main section that runs
    your application. That way it can use them! Therefore the code from Code Box 5.1
    has been split in Code Box 5.2 to make room for all functions.


    You can add the new code to your myEtchASketch.py file now. It will not do anything
    different yet. However the function works will be explained in the next analysis
    section.'
