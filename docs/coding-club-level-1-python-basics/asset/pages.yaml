  md: 'The backslash is used to ''escape'' characters that are used in Python. When
    we want to print some text to the screen we wrap it in speech marks. This now
    means there is a problem if you want to type some speech marks. Well, you know
    what to do about it – put a backslash before it. So what do you do if you want
    to actually print a backslash to the screen? Put a backslash before it!


    > Did you know that us-Coders call text, strings?


    # # Functions


    print() is called a function (these are covered in chapter 4, page 53). What print()
    will do, is print anything you throw at it inside the brackets. They must be separated
    by a comma, and strings (bits of text) must be put in speech marks. Everything
    inside the brackets will be printed out in order. The results sums can also be
    output, but you must not put the calculations in speech marks. What do you think
    would happen if you left in the speech marks? Don''t forget you can also add in
    escape sequences.


    # # Maths


    Using Python as a calculator is easy, if you remember two things:


    +   1 In Python, as in almost all programming languages, the multiplication symbol
    is an asterisk.

    2 The division symbol is a forward slash.


    ```

    >>> 10/4

    2.5

    >>> 3*3

    9

    >>>

    ```


    ![](img/fbaeb9cdecc73e46b84c17d0505a6ca3_20_0.png)'
  merge: -1
  pgno: 20
- img_proc: true
  md: 'There is another way of dividing. If you use two forward slashes instead of
    one, Python will produce an **integer** as an answer. An integer is a whole number
    (a decimal such as 2.5 is called a **float**). You can now find the remainder,
    with another **mathematical** operator called the **modulus**. This is represented
    by a % sign.


    ```

    >>> 11/4

    2.75

    >>> 11//4

    2

    >>> 11%4

    3

    >>>

    ```


    ![](img/fbaeb9cdecc73e46b84c17d0505a6ca3_21_0.png)


    Table 2.2 lists some more mathematical operators.


    | Operator | Name | Example | Answer |

    | --- | --- | --- | --- |

    | * | multiply | 2*3 | 6 |

    | / | divide (normal) | 20/8 | 2.5 |

    | // | divide (integer) | 20//8 | 2 |

    | % | modulus | 20%8 | 4 |

    | + | add | 2+3 | 5 |

    | - | subtract | 7-3 | 4 |


    Table 2.2 Maths operators.'
