  md: '# The plan


    Now you have a window in which to make your application and a canvas to draw on,
    it is time to start planning the rest of the application. To do this we break
    down the task into functions. First we need to be able to draw a vertical line
    a bit at a time and then horizontally. As these are going to be controlled by
    the up, down, left and right arrow keys on the keyboard it makes sense to have
    four functions that are all going to be similar and then attach those functions
    to the keys. So to start with, let''s just try and create a function that draws
    a line up when we press the up key. If we can achieve this we know that we will
    be able to complete this project.


    # The coordinates


    Unlike maths, tkinter and most computer languages use coordinates that count from
    the top left of the screen. So our canvas looks like this.


    ![](img/fbaeb9cdecc73e46b84c17d0505a6ca3_59_0.png)'
