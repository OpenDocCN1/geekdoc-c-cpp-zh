    \n## 猜数字游戏\n\n这是一个小游戏的完整代码。这是一个非常简单的游戏，计算机想出一个 1 到 100 之间的数字，玩家必须猜出那个数字。这个游戏再次使用了\
    \ Python 的随机数函数和 `while` 循环。在 IDLE 中打开一个新窗口，输入代码框 4.4 中的代码。将此文件保存为 `myNumber.py`\
    \ 并存放在你的 Python 代码文件夹中。在你输入时，尝试推断每一行代码的作用，并惊叹自己已经走了多远。\n\n第 4 章：函数 50\n\n## 代码框\
    \ 4.4\n\n```python\n# myNumber.py\n# 这个游戏使用了一个自定义函数\nimport random\n\n# 想一个数字\n\
    computer_number = random.randint(1, 100)\n\n# 创建函数 is_same()\ndef is_same(target,\
    \ number):\n    if target == number:\n        result=\"Win\"\n    elif target\
    \ > number:\n        result=\"Low\"\n    else:\n        result=\"High\"\n    return\
