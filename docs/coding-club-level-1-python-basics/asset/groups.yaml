    \ drawn by player 1 up the screen.\n\n# self\n\nAs this uses methods from tkinter,\
    \ this function has to be supplied with the argument self. This is to do with\
    \ tkinter's methods being in classes. Functions in classes are called.\n\n# global\n\
    \nAt the start of the script, we declared all variables and gave them some values.\
    \ This means that inside functions are local.\n\n# The create_line() method\n\n\
    As this uses methods from tkinter, this function has to be supplied with the argument\
    \ self. This is to do with tkinter's methods being in classes. Functions in classes\
