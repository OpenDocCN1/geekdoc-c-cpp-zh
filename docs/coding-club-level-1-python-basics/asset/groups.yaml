    ```\n\n# input 的两种用法\n\n`input()` 函数在程序中使用了两次。第一次，它获取用户输入并存储在名为 `question` 的变量中。\n\
    \n> 单独一个 `if` 语句是完全没问题的。`if` 语句后面跟着 `else` 也是可以的。但如果你使用 `elif` 语句，必须以 `else` 结尾。\n\
