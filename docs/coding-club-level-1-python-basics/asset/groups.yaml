    If you have previously programmed in Scratch (produced by MIT) you will find you
    can pick up Python very quickly. Scratch is great for learning how to think like
    a programmer and is very good for making games. If you have not tried Scratch
    before, you might enjoy trying that next because the ability to learn a new programming
    language is an important skill for coders. You will find it is a lot easier than
    learning a new human language.


    Once you have learned one modern programming language, you can quickly learn others.
    You simply have to find out how your new language handles variables, loops, etc.
    (You will know what these are by the end of the book.)


    ## Python


    Python is a typed computer language. This makes writing short programs very fast
    and you can produce almost anything you can imagine.


    Python is a powerful, modern programming language used by many famous organisations
    such as YouTube and NASA. It is one of three programming languages that can be
    used to write Google Apps. Python is a great language. Enjoy!


    ## IDLE


    You will start programming in IDLE which comes with Python. IDLE is a special
    text editor like Microsoft Word, except it understands Python and helps you get
    your code right. IDLE is itself, a Python application.


    Python is also one of the languages used by the European Particle Accelerator
    organisation, CERN.


    ![](img/fbaeb9cdecc73e46b84c17d0505a6ca3_11_0.png)


    ## Let''s look at IDLE:


    ![](img/fbaeb9cdecc73e46b84c17d0505a6ca3_12_0.png)


    It is important when learning a programming language to learn the special vocabulary
    that goes with it. This is because when you want to find something out, you know
    which keywords to search for. This is why new ''computer speak'' words appear
    in bold. This means that they will be explained in the glossary at the end of
    the book. Obviously will not appear in the glossary!


    IDLE when we started on an Apple Mac.


    The code you want to run is typed after the special entry prompt:


    ```

    >>> my code goes here

    ```


    To run the code we press the return key. This is how Python runs in IDLE''s interactive
    mode. Python can run files as well as to start with, this is all we need.


    Let''s see how IDLE looks on a Windows PC:


    ![](img/fbaeb9cdecc73e46b84c17d0505a6ca3_12_1.png)


    IDLE when we started on Windows 7.


    Chapter 1: Python, IDLE and your first program 11


    And finally, how IDLE looks on a Linux computer:


    ![](img/fbaeb9cdecc73e46b84c17d0505a6ca3_13_0.png)


    IDLE when started up on the Raspberry Pi computer.


    A great reason for learning Python and using IDLE as our IDE (Integrated Development
    Environment) is that it is very similar on all the different types of computers
    available.


    The text before the >>> prompt is unimportant at the moment. However, it is always
    useful to know what version of Python you are using.


    ## Hello World!


    Since the dawn of programming, when the first cave-coders booted their cave-computers,
    it has been a tradition that your first program when learning a new language is
    ''Hello World''. The aim is to try to make the computer say ''hello'' to the world.
    If you can do this you will have tested whether everything that was set up for
    you is working properly.


    - If it is not already started, start up IDLE.

    - After the >>> prompt write in the code from Code Box 1.1 and then press your
    return key to run the program.


    ### ### Code Box 1.1


    ```

    print("Hello World!")

    ```


    If all is well, you should get something like this:


    ![](img/fbaeb9cdecc73e46b84c17d0505a6ca3_14_0.png)


    > This might not seem much to you, but you have given your computer a direct instruction
    that you have written yourself and it has carried out your instruction. From this
    small seed, great applications will grow!


    Hello World!


    Python has followed your instruction and output ''Hello World!''


    You have written your first program. Well done!


    ![](img/fbaeb9cdecc73e46b84c17d0505a6ca3_14_1.png)


    ## Making mistakes


    ### Did you get a syntax error?


    Syntax errors are very common when typing in code (as are others). If you make
    one or two it is not your fault. It is because although computers are fast, they
    can also be bit stupid. If there are any tiny mistakes in your code, they panic
    and produce error messages. These messages try to explain to you what the problem
    is but they are often difficult to understand.


    Colons, brackets, speech marks and spelling of Python words have to be just right.
    Although we can read imperfect sentences, computers cannot.


    Whether or not you got any errors, try this Quick Quiz.


    ### Which of these lines of code are correct?

    1. Print("Hello world!")

    2. print("Hello world!")

    3. print("Hello world!")

    4. print("Hello world!")


    ![](img/fbaeb9cdecc73e46b84c17d0505a6ca3_15_0.png)

    ![](img/fbaeb9cdecc73e46b84c17d0505a6ca3_15_1.png)


    Notice how the coloured text helps you spot code that is not going to work. All
    the code in this book use the same text as IDLE''s standard display. This should
    help you to spot bugs in your code.


    ![](img/fbaeb9cdecc73e46b84c17d0505a6ca3_15_2.png)


    ## Chapter summary


    In this chapter you have learned:

    - that programming is writing instructions for computers

    - that there are many different languages

    - why Python is a great language to learn

    - how to use IDLE in interactive mode

    - how to write and run a simple program

    - that the print() command means ‘show on the screen’ – not to the printer


    ### Idea 1


    1. Write some new code so that a short message is displayed that says thank you
    to whoever got ready for you.

    2. Run your new code to display the message.

    3. Show your message. This will make them happy.


    > This is one of my favourite jokes!


    ### Idea 2


    1. Write some new code so that the computer will show the text for a joke.

    >>> print("Question: What goes?")

    Question: What goes?

    >>> print("Answer: A legged horse")

    >>>


    ![](img/fbaeb9cdecc73e46b84c17d0505a6ca3_16_0.png)


    ## Chapter 2: Some text, some maths and going loopy


    In this chapter you are going to:

    - learn how to do some more with text

    - get Python to do some maths for you

    - learn about how while loops work

    - learn lots of useful operators


    > Going loopy? I''ve got that covered!


    This is a fun chapter as we get to start some real programming!


    ![](img/fbaeb9cdecc73e46b84c17d0505a6ca3_17_0.png)


    ## Text


    ### Escape sequences


    Try opening IDLE in interactive mode and enter the code in Code Box 2.1.


    ```

    print("Question: What goes?\nAnswer: A legged horse.")

    ```


    If you have not pressed your return key yet, to see what happens, do so now.


    You should have discovered \n has a special purpose. It is an example of an escape
    sequence. Table 2.1 shows some more escape sequences.


    | Escape sequence | What it does |

    |---|---|

    | \n | creates a line return in a string of text |

    | \t | creates a tab style indent in a string of text |

    | \\ | allows a backslash to appear in a string of text |

    | \" | allows a speech mark to be used in a string of text |


    Table 2.1 Escape sequences.


    ## Experiment


    Try writing a variety of little programs in IDLE using the escape sequences in
    Table 2.1 until you feel you know what they all do.


    ## Backslashes


    Are you bit confused about the last two escape sequences? If so, type in and run
    the code from Code Box 2.2.


    ### Code Box 2.2


    ```

    print("Here is a speech mark: \" and here is a slash: \\")

    ```


    Try typing in the code from Code Box 2.3 to see how to avoid having to escape
    speech marks. This takes advantage of the fact that you can choose whether to
    surround strings in double speech marks or single ones. Watch out though, you
    will get a lot of syntax errors if you do not do this carefully.


    ### Code Box 2.3


    ```

    print(''I say "High", you say "Low". You say "Why?" and I say "I don\t know".
    Oh no.\'')

    ```


    The backslash is used to ''escape'' characters that are used in Python. When we
    want to print some text to the screen we wrap it in speech marks. This now means
    there is a problem if you want to type some speech marks. Well, you know what
    to do about it – put a backslash before it. So what do you do if you want to actually
    print a backslash to the screen? Put a backslash before it!


    > Did you know that us-Coder call text, strings?


    ## Functions


    print() is called a function (these are covered in chapter 4, page 53). What print()
    will do, is print anything you throw at it inside the brackets. They must be separated
    by a comma, and strings (bits of text) must be put in speech marks. Everything
    inside the brackets will be printed out in order. The results sums can also be
    output, but you must not put the calculations in speech marks.


    ## Maths


    Using Python as a calculator is easy, if you remember two things:


    1. In Python, as in almost all programming languages, the multiplication symbol
    is an asterisk.

    2 The division symbol is a forward slash.


    ```

    >>> 10/4

    2.5

    >>> 3*3

    9

    >>>

    ```


    ![](img/fbaeb9cdecc73e46b84c17d0505a6ca3_20_0.png)

