    or or will remain, accurate or appropriate.


    ## Contents


    - Introduction 4

    - Chapter 1: Python, IDLE and your first program 8

    - Chapter 2: Some text, some maths and going loopy 16

    - Chapter 3: Readable code and the MyMagic8Ball game 28

    - Chapter 4: Functions 45

    - Chapter 5: MyEtchASketch 55

    - Taking things further 73

    - Appendix 74

    - Glossary and Index 77

    - The Quick Quiz answers 81

    - Acknowledgements 82


    ## Introduction


    ### Why was this book written?


    This book is the first in a series of books for anyone with little or no knowledge
    of computer programming but for those who would like to give it a go.


    ### Who is this book for?


    One factor was the availability of a computer that any child could save up for
    or get for their birthday, such as the Raspberry Pi from www.raspberrypi.org.


    But my wish to produce a series of short books on coding goes back much further
    than that. When I grew up, computers were very different from the PCs we use today.
    To play a game or a word-processor, you had to run the program by typing green
    text into an empty black screen. But the great thing was, you could also type
    in your own commands and run them! It was not long before I had written my first
    text-based game in a language called BASIC.


    ![](img/fbaeb9cdecc73e46b84c17d0505a6ca3_5_0.png)


    Later on, I wanted to learn a more modern language, and set about teaching Java.
    I read four or five books and completed the examples, but at the end of each one
    I was left in a dreadful situation: I had all sorts of ideas for programs I wished
    to make, but still no idea how to start! I could make the exciting projects that
    were the focus of these books, but not much else. So with this series of books,
    I have taken a different approach. I hope it will teach you the skills you need
    to write any program you can imagine – eventually and many simple programs straight
    away.


    ### Why should you choose this book?


    After many years of looking, I finally found a great book on Java called Introducing
    Java by David Parsons, published by Thomas Learning. It was for university students.
    Suddenly I understood why we did certain things and how to start designing complex
    programs. If only I had started with this book to begin!


    I want you, the reader, to learn not only how to make the programs in this book
    but also to design your own. I want you to be able to write programs well, so
    that if you take it further and become the inventor of the next Google you will
    not have to unlearn bad programming habits. Unlearning things, I should add, is
    a lot more difficult than you might imagine.


    ### What needs to be installed?


    You do not have to do this! Please ask a responsible adult to read the Introduction
    for Adults page on the coding club website (www.codingclub.co.uk) so that they
    can get everything organised for you. If you are able to do this by yourself then
    full instructions can be found at http://python.org/download/. If you are going
    to learn to program on a Raspberry Pi, it will be very easy to get things ready
    as it comes pre-installed with everything you need. You do not have to use a Raspberry
    Pi to run Python. You can use Windows, Apple Mac and Linux systems.


    ## How to use this book


    It is hoped that you will read this book carefully and build all the main projects
    in order. At the end of each chapter there are further ideas, and challenges that
    you can think of as ‘mini quests’ in a video game. Some readers will want to work
    through all of them so that they understand all the time. Some of you will probably
    prefer to rush through and get to the end. When readers think: ‘What can I do
    now?’ One answer is to go back and look at some of the ideas at the end of each
    chapter. Which approach is best? The one you are most comfortable with. If you
    are being guided by a teacher though, then to enable them to help you the most
    you should trust their judgement.


    There are four ways in which this book tries to help you:


    - By copying the code – this is important as it helps you learn.

    - Finding and fixing errors – error messages give some clues as what has gone
    wrong.

    - Experimenting – feel free to experiment with the code, see what else you can
    make.

    - Finally, this book will not only provide cool projects but also teach how to
    design applications.


    ### A word of warning


    You may be tempted to simply get the code off the web instead of typing it yourself.
    If you do this you will probably find that you cannot remember how to write code
    so easily later. You will also understand every detail of your programs.


    ## Chapter 1: Python, IDLE and your first program


    In this chapter you are going to:


    - learn about computer programming and the different languages you can use

    - meet the Python programming language

    - learn how to use IDLE, which will help organise your programs and allow you
    to run them

    - check that your computer has been set up correctly

    - write and run your first program.


    > I am never IDLE, although I do get a bit sleepy...zzzz.


    ![](img/fbaeb9cdecc73e46b84c17d0505a6ca3_9_0.png)


    ### Coding


    Coding is writing instructions for a computer to perform a task. This code has
    to be in a form that the computer can understand. This is more formally known
    as computer programming.


    Computers and coding have not been around for a long time but they have sure packed
    in some interesting history in a short space of time. The first machine that stored
    instructions in a way that future computers could take advantage of was the Jacquard
    loom that used holes punched in cards and was invented in 1801. Charles Babbage
    is often credited with inventing the first computer which he described in 1837
    but was not built until 100 years later. In 1989 Guido van Rossum started to create
    the Python programming language which he named after Monty Python''s Flying Circus,
    a BBC comedy sketch show.


    ### Programming languages


    There are many programming languages currently used by coders around the world.
    Some are best in one situation, others in another.


    - HTML is good for producing web pages.

    - SQL is great at making databases do what you want.

    - Python is brilliant for writing quick applications, running programming experiments
    and for building larger applications, including games.

    '
