    # Making mistakes


    # Did you get a syntax error?


    Syntax errors are very common when typing in code (as are other errors). If you
    make one or two it is not your fault. It is because although computers are fast,
    they can also be a bit stupid. If there are any tiny mistakes in your code, they
    panic and produce error messages. These messages try to explain to you what the
    problem is but they are often difficult to understand.


    Colons, brackets, speech marks, apostrophes and spelling of Python words have
    to be just right. Although we can read imperfect sentences, computers cannot.


    Whether or not you got any errors, try this Quick Quiz.


