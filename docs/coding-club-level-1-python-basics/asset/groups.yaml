    # # Chapter summary


    In this chapter you have learned:


    +   - how to use the tkinter library

    - how to make your own MyEtchASk game

    - how to put an application in its own window

    - how to attach functions to keyboard presses

    - that ''copy and pasting'' hints at a better way of doing things

    - how to clear a canvas. (If you typed out the code you should have spotted an
    extra function that was sneaked in: erase_all(self) . This clears the screen when
    the user presses the key on her keyboard.)


