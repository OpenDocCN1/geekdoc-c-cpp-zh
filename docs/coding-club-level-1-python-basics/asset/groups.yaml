    ## 致谢


    虽然这是一本小书，但工作量比我预期的要得多。我的目标一直是编写一系列符合年轻人应得标准的书籍。为此，我寻找了一家声誉良好的出版社，并必须感谢 Claudia
    Bickford-Smith 对该项目的热情。我很高兴剑桥大学出版社能够录用我。Heather Mahy 和 Saul Sexton 的辛勤工作也深受感谢，他们这项工作不容易，在使项目落地的同时确保我不偏离正轨，我对此深表感谢。


    一本声称教青少年编程的书必须在青少年身上进行测试。因此，我必须感谢 Ewell Castle School 的 Coding Club 男孩以及我的小儿子
    Daniel，他们忍受了早期版本，并帮助我发现哪些是有效的，哪些（对他们来说遗憾）是不行的。


    当我意识到树莓派基金会的宗旨和核心动力和我一样时，那种感觉太棒了。Jack Lang 的鼓励以及 Alex Bradbury 的巨大帮助确保了我的代码和计算机科学知识在技术上是正确的，这些都是无价的。


    我还想亲自感谢 Ohio Art Company，他们拥有并销售奇妙的 Etch A Sketch 玩具，他们非常热情，并迅速许可我使用他们的注册商标。


    Fran，我喜欢这些插图。


    我的两个大儿子已经离家了，但得益于现代技术，他们也分享了这段旅程并做出了无价的贡献和建议。最后，在晚上和假期编写书籍和程序需要时间。我永远感谢我的妻子 Rita，她从未在这段时间里对我吝啬，也没有抱怨，即使是在听我谈论代码片段时！


    谢谢你们……大腿（们）。


