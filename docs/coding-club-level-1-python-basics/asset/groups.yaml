    \ 1 and 100.\")\n\n# Collect the user's guess as an integer\nguess = int(input(\"\
    Can you guess it? \"))\n# Use our function\nhigher_or_lower = is_same(computer_number,\
    \ guess)\n```\n\n(continues on the next page)\n\n```python\n# Run the game until\
    \ the user is correct\nwhile higher_or_lower != \"Win\":\n  if higher_or_lower\
    \ == \"Low\":\n    guess = int(input(\"Sorry, you are too low. Try again.\"))\n\
    \  else:\n      guess = int(input(\"Sorry, you are too high. Try again.\"))\n\n\
    higher_or_lower = is_same(computer_number, guess)\n```\n\n## End the game\n\n\
    input(\"Correct!\\nDone\\n\\nPress RETURN to exit.\")\n\nThere are two new things\
    \ to you in this game. The **return** keyword tells the **is_same() function**\
    \ what value should be sent back after it is called. We know functions can be\
    \ sent arguments, **well** they can also return data.\n\nIn this case it returns\
    \ the value stored in the variable **result**. So, if the two numbers are the\
    \ same it returns the **string Win**, if the supplied number is higher than the\
    \ target, the function returns the value **High** and if the supplied number is\
    \ lower than the target, **Low.**\n\nThe second new thing to you is converting\
    \ the user's input into an integer by wrapping it in **int( input goes here )**.\
    \ This is because anything coming from keyboard input is **strings**. The process\
    \ of converting one **data-type** into another data-type is called **casting.**\n\
