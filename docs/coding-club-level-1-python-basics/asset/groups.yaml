    \ to write fifty lines. Well no matter, Python can do that.\n\nTry opening IDLE\
    \ in interactive mode and then enter the code in Code Box 2.4. You will need to\
    \ press return twice at the end.\n\n![](img/fbaeb9cdecc73e46b84c17d0505a6ca3_23_0.png)\n\
    \n## Code Box 2.4\n\n```\n>>> lines=0\n>>> while lines < 50:\n    print(\"I will\
    \ not write code in history lessons.\")\n    lines = lines+1\n```\n\nHere is another\
    \ solution to the same problem:\n\n## Code Box 2.5\n\n```\n>>> print(\"I will\
    \ not write code in history lessons.\\n\" * 50)\n```\n\nChapter 2: Some text,\
    \ some maths and going loopy 22\n\nThe code in Code Box 2.5 is clever – look carefully\
    \ to see what is happening. Run it if you are not sure. Although the code in Code\
    \ Box 2.4 is longer, a while loop is often more useful as it can do far more complex\
    \ tasks. For example, with a while loop you can ask a computer to count to 100.\
    \ Try entering the code from Code Box 2.6 and running it.\n\n## Code Box 2.6\n\
    \n```\n>>> number=1\n>>> while number < 101:\n  print (number)\n  number = number+1\n\
    ```\n\n## How do while loops work?\n\n## Variables\n\nTo start with we create\
    \ a variable and assign a value to it. A variable is a space in the computer’s\
    \ memory where we can store, for example, a string or an integer. We create a\
    \ variable by naming it. In Code Box 2.6 we called our variable ‘number’ and with\
    \ the equals operator we give it the value ‘1’.\n\nThe next line of code >>> number<101:\
    \ says ‘while the variable called number is less than 101 do the following’. All\
    \ of the code that is indented after the colon is to be repeatedly performed by\
    \ the computer. That is, it loops through these two lines of code until number\
    \ is no longer less than 101.\n\ncreate a variable and assign it the value 1\n\
    \n```\nnumber=1\nwhile number < 1:\n    print (number)\n    number = number+1\n\
    ```\n\nthe colon says to run all of the indented code\n\nthere are no speech marks\
    \ here as we want the value\nof number not the word “number”\n\nthe variable number\
    \ is incremented by 1\n\nIDLE automatically indents for you:\n\nThe last line\
    \ of code number = number+1 is in the loop. It keeps adding 1 to number for\n\
    each passage through the loop. Don't forget the variable's value can be changed\
    \ with the\nequals operator at any time.\n\n> I like to think of\nnumber = 1 as\n\
    meaning: 'make the variable\ncalled number to 1,\nfor now...\n\n## Delving Deeper\n\
    \nThe equals sign is used differently to way it is used in maths. In computing,\
    \ the equals sign means 'point\nthis variable at this piece of data' (an integer\
    \ for example). So number=1 means 'create a variable\ncalled number and point\
    \ it at 1'. Another way of saying this is 'assign the value 1 to the\nvariable'.\
    \ Later we may assign another value to number.\n\n![](img/fbaeb9cdecc73e46b84c17d0505a6ca3_25_0.png)\n\
    \n## Operators\n\nThere are several operators you can use in while loop. Some\
    \ examples are given in Table 2.3. Note how we have another version of equals.\
    \ This form is more like the equals in maths. It is an example of a comparative\
    \ operator. Therefore, while number==1: ‘the variable called number is equal to\
    \ 1, do the following’\n\n| Operator | Meaning |\n|---|---|\n| == | equal to |\n\
    | != | not equal to |\n| > | greater than |\n| < | less than |\n| >= | greater\
    \ than or equal to |\n| <= | less than or equal to |\n\n**Table 2.3** Comparative\
    \ operators.\n\nWe use double equals sign to compare two values and a single equals\
    \ sign to assign a value to a variable.\n\n![](img/fbaeb9cdecc73e46b84c17d0505a6ca3_26_0.png)\n\
    \n## Chapter summary\n\nIn this chapter you have learned:\n\n- how the print()\
    \ function is very flexible\n- how to write and run simple maths\n- how to output\
    \ a mixture of strings, maths or numbers\n- how to write while loop and use comparative\
    \ operators\n\n## Puzzle 1\n\nWrite some code in IDLE so that the computer counts\
