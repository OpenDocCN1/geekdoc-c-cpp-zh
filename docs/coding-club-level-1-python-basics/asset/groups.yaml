    \ the 5 table like this:\n\n```\n1x5=5\n2x5=10\n3x5=15\n```\n\n**Hint:** You will\
    \ need a counter variable which could call `number`. Then you should find out\
    \ how to write one, and then make your loop do it 10 times.\n\n![](img/fbaeb9cdecc73e46b84c17d0505a6ca3_27_0.png)\n\
    \n## Puzzle 3\n\nSee if you can re-write the following code in three ways so that\
    \ each program still produces output which counts to a hundred.\n\n```\n>>> number=1\n\
    >>> while number < 101:\n    print (number)\n    number = number+1\n```\n\nIn\
    \ your new code, you are not allowed to use the less than operator. Instead you\
    \ should use one of these comparative operators in each program: <= !=\n\nAnswers\
    \ to all of these puzzles can be found on the companion website www.codingclub.uk.\n\
    \nIf you write some code that will not running, just close the IDLE window. When\
