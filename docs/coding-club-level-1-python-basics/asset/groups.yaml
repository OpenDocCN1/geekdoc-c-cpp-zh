    - loop: a piece of code that keeps repeating until a certain condition is met
    (22)

    - mathematical operator: an operator that performs some mathematical function
    on some numbers; e.g. multiplication or addition (20)

    - method: the name given to a function in a class (63)

    - module: a saved python file whose functions can be used by another program (31)

    - modulus: a mathematical operator that is used to return the remainder from a
    division calculation; e.g. 22%7 returns 1 (20)

    - operator: a symbol that performs a simple function on some code such as multiplying
    two numbers or comparing them to see if they are equal; see also comparative operator
    and mathematical operator (25)

    - output: data that is sent from a program to a screen or printer, etc (13)

    - return: (1) the value a function will produce after it has been run – it is
    also a Python keyword; (2) the ‘end of line’ key on a keyboard, sometimes called
    the enter key (52)

    - script mode: this is when we use IDLE to help us write code that we will save
    in a file (29)

    - # statement: used in this book to mean a snippet of code; strictly speaking
    it is a piece of code that represents a command or action; e.g. a print statement

    - # string: text data, which can be stored in a variable

    - # syntax error: an error produced when a computer fails to run a program because
    it cannot recognise the format of the code supplied; e.g. a syntax error would
    be produced if a bracket had not been closed

    - # tkinter: a package of classes that are often imported in to Python programs
    that give methods that are useful for producing windows, drawing images and producing
    animations

    - # variable: a name that refers to a place in a computer''s memory where data
