    # Operators


    There are several operators you can use in a while loop. Some examples are given
    in Table 2.3. Note how we now have another version of equals ==. This form is
    more like the equals in maths. It is an example of a comparative operator. Therefore,
    while number==1: means ‘the variable called number is equal to 1, do the following’


    | Operator | Meaning |

    |---|---|

    | == | equal to |

    | != | not equal to |

    | > | greater than |

    | < | less than |

    | >= | greater than or equal to |

    | <= | less than or equal to |


    **Table 2.3** Comparative operators.


    We use a double equals sign to compare two values and a single equals sign to
    assign a value to a variable.


