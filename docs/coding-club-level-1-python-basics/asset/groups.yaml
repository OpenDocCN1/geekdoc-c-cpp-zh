  mdcn: "\n\n还有另一种除法。如果你使用两个正斜杠而不是一个，Python 将产生一个**整数**（integer）作为答案。整数是一个整数（像 2.5\
    \ 这样的小数被称为**浮点数**float）。你现在可以使用另一种名为**取模**（modulus）的**数学**运算符找到余数。它用 % 符号表示。\n\
    \n```\n>>> 11/4\n2.75\n>>> 11//4\n2\n>>> 11%4\n3\n>>>\n```\n\n![](img/fbaeb9cdecc73e46b84c17d0505a6ca3_21_0.png)\n\
    \n表 2.2 列出了更多一些数学运算符。\n\n| 运算符 | 名称 | 示例 | 答案 |\n| --- | --- | --- | --- |\n|\
    \ * | 乘法 | 2*3 | 6 |\n| / | 除法（普通） | 20/8 | 2.5 |\n| // | 除法（整数） | 20//8 | 2 |\n\
    | % | 取模 | 20%8 | 4 |\n| + | 加法 | 2+3 | 5 |\n| - | 减法 | 7-3 | 4 |\n\n表 2.2 数学运算符。\n\
    \n## 实验\n\n在交互模式下，检查表 2.2 中的示例是否给出了正确答案，然后尝试一些你自己最喜欢的加法计算。你可能想看看如果如果在 print ()\
    \ 函数中将数学表达式包裹在引号内会发生什么。\n\n噢，数学！\n\n噢，字符串！\n\n![](img/fbaeb9cdecc73e46b84c17d0505a6ca3_22_0.png)\n\
    \n## 结合文本和数学\n\n在 print () 函数中，也可以将文本（或字符串）和数字结合。逗号在这里用作文本和数学之间的分隔符。\n\n```\n\
    >>> print(\"111 divided by 4 = \", 111/4)\n111 divided by 4 = 27.75\n>>>\n>>>\
    \ print(\"11 divided by 4 = \", 11/4)\n11 divided by 4 = 2.75\n>>>\n```\n\n##\
    \ 快速测试\n\n你能计算出这段代码的输出是什么吗？\n\n```\n>>> print(\"11 divided by 4 also equals: \"\
    , 11//4, \" remainder: \", 11%4)\n```\n\n## 进入循环\n\n计算机非常擅长重复性任务。人类也是如此。\n\n想象一下你正在学校的历史课上尝试写一些代码，而此时你本该在学历史。你的老师可能会让你写五十行代码。没关系，Python\
    \ 可以做到这一点。\n\n尝试在交互模式下打开 IDLE，然后输入代码框 2.4 中的代码。你需要在末尾按两次回车。\n\n![](img/fbaeb9cdecc73e46b84c17d0505a6ca3_23_0.png)\n\
    \n## 代码框 2.4\n\n```\n>>> lines=0\n>>> while lines < 50:\n    print(\"I will not\
    \ write code in history lessons.\")\n    lines = lines+1\n```\n\n这是解决同一个问题的另一种方法：\n\
    \n## 代码框 2.5\n\n```\n>>> print(\"I will not write code in history lessons.\\n\"\
    \ * 50)\n```\n\n第2章：一些文本，一些数学和进入循环 22\n\n代码框 2.5 中的代码非常聪明——仔细观察正在发生什么。如果不确定，就运行它。虽然代码框\
    \ 2.4 中的代码较长，但 while 循环通常更有用，因为它可以执行更复杂的任务。例如，通过 while 循环，你可以让计算机数到 100。尝试输入代码框\
    \ 2.6 中的代码并运行它。\n\n## 代码框 2.6\n\n```\n>>> number=1\n>>> while number < 101:\n\
    \  print (number)\n  number = number+1\n```\n\n## while 循环是如何工作的？\n\n## 变量\n\n\
    首先我们创建一个变量并给它分配一个值。变量是计算机内存中的空间，我们可以在其中存储例如一个字符串或一个整数。我们通过命名来创建变量。在代码框 2.6 中，我们将变量命名为‘number’，并用等号运算符给它赋值‘1’。\n\
    \n下一行代码 `>>> number<101:` 的意思是“当名为 number 的变量小于 101 时，执行以下操作”。冒号之后的所有缩进代码将由计算机重复执行。也就是说，它会循环这两行代码，直到\
    \ number 不再小于 101。\n\n创建一个变量并将其赋值为 1\n\n```\nnumber=1\nwhile number < 1:\n   \
    \ print (number)\n    number = number+1\n```\n\n冒号表示运行所有缩进的代码\n\n这里没有引号，因为我们想要\
    \ number 的值，而不是“number”这个单词\n\n变量 number 递增了 1\n\nIDLE 会自动为你缩进：\n\n最后一行代码 `number\
    \ = number+1` 位于循环中。在每次循环中，它都会给 number 加 1。不要忘记，变量的值随时可以使用等号运算符进行更改。\n\n> 我喜欢把\n\
    > number = 1 理解为\n> ：“让名为\n> number 的变量设置为 1，\n> 目前是……”\n\n## 深入探索\n\n等号的使用方法与数学中的用法不同。在计算中，等号意味着“让此变量指向此数据”（例如一个整数）。所以\
    \ `number=1` 意味着“创建一个名为 number 的变量并让它指向 1”。另一种说法是“将值 1 赋值变量”。稍后我们可以为 number 赋值另一个值。\n\
    \n![](img/fbaeb9cdecc73e46b84c17d0505a6ca3_25_0.png)\n\n## 运算符\n\n在 while 循环可以使用几种运算符。表\
    \ 2.3 给出了一些示例。注意我们另一种等号的形式。这种形式更像数学中的等号。因此，`while number==1:` 表示“当 number 等于 1\
    \ 时，执行以下操作”。\n\n| 运算符 | 含义 |\n|---|---|\n| == | 等于 |\n| != | 不等于 |\n| > | 大于 |\n\
    | < | 小于 |\n| >= | 大于等于 |\n| <= | 小于等于 |\n\n**表 2.3** 运算符。我们使用双等号比较两个值，使用单等号给变量赋值。(img/fbaeb9cdecc73e46b84c17d0505a6ca3_26_0.png)\n\
    \n## 本章总结\n\n在本章中，你学习了：\n\n- print() 函数非常灵活\n- 如何编写和运行简单的数学计算\n- 如何输出字符串、数学或数字\n\
    - 如何编写 while 循环并使用比较运算符\n\n## 题 1\n\n在 IDLE 中编写一些代码，让计算机按 2 数到 20。\n\n## 题 2\n\
    \n编写一些代码，让计算机输出如下表格：\n\n```\n1x5=5\n2x5=10\n3x5=15\n```\n\n**提示：** 你需要一个 `number`\
    \ 计数器变量。你应该找出如何编写它，然后让你的循环执行 10 次。(img/fbaeb9cdecc73e46b84c17d0505a6ca3_27_0.png)\n\
    \n## 题 3\n\n看看用三种方式重写以下代码，使每个程序都能产生数到百的输出。\n\n```\n>>> number=1\n>>> while number\
    \ < 101:\n    print (number)\n    number = number+1\n```\n\n在新代码中，不允许使用小于运算符。相反，你应该使用这些比较运算符之一：`<=`、`!=`。所有这些题目的答案都可以在网站\
