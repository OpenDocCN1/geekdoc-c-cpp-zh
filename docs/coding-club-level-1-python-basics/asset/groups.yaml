    canvas_width = 600\ncanvas_colour = \"black\"\n\n##### main:\nwindow = Tk()\n\
    window.title(\"MyEtchASk\")\ncanvas = Canvas(bg=canvas_colour, height=canvas_height,\
    \ width=canvas_width, highlightthickness=0)\ncanvas.pack()\n\nwindow.mainloop()\n\
    ```\n\nYou can try running myEtchASketch.py now. Although it is not very exciting,\
    \ it is the first time you have made a window! Notice how something also happens\
    \ in the interactive mode window. This is now acting as a console where we will\
    \ get, among other things, error messages.\n\n# The plan\n\nNow you have a window\
    \ in which to make your application and a canvas to draw on, it is time to start\
    \ planning the rest of the application. To do this we break down the task into\
    \ functions. First we need to be able to draw a vertical line a bit at a time\
    \ and then horizontally. As these are going to be controlled by the up, down,\
    \ left and right arrow keys on the keyboard it makes sense to have four functions\
    \ that are all going to be similar and then attach those functions to the keys.\
    \ So to start with, let's just try and create a function that draws a line up\
    \ when we press the up key. If we can achieve this we know that we will be able\
    \ to complete this project.\n\n# The coordinates\n\nUnlike maths, tkinter and\
    \ most computer languages use coordinates that count from the top left of the\
    \ screen. So our canvas looks like this.\n\n![](img/fbaeb9cdecc73e46b84c17d0505a6ca3_59_0.png)\n\
    \nSo a point on the screen is represented by two numbers:\n\ne.g. (100, 50) =\
    \ a point 100 pixels along the x-axis and 50 pixels down the y-axis.\n\n# Keeping\
    \ code organised\n\nThe function to draw a vertical line requires a few more variables\
    \ so that we can keep track of where we are up to. These should go at the top\
    \ of your code with your other variable declarations. This is good coding style.\
    \ Now if you want to adjust your program, you simply adjust the variables at the\
    \ top and re-run it. You do not have to dig through your code to find where things\
    \ happen. Also by choosing descriptive names for the variables you do not need\
    \ excessive amounts of commenting.\n\nThe functions should come next. They need\
    \ to be before the main section that runs your application. That way it can use\
    \ them! Therefore the code from Code Box 5.1 has been split in Code Box 5.2 to\
    \ make room for all functions.\n\nYou can add the new code to your myEtchASketch.py\
    \ file now. It will not do anything different yet. However the function works\
