    \ of the line |\n| x2 | x-coordinate of the end of the line |\n| y2 | y-coordinate\
    \ of the end of the line |\n\nTable 5.2 Arguments for MyEtchASk.\n\n# Adding keyboard\
    \ control\n\nWe simply use the bind() method from window class and it just takes\
    \ two arguments.\n\n```python\nwindow.bind(\"the key name\", our_function)\n```\n\
    \nIf we wanted a key we would supply the argument \"a\" but for the up arrow we\
