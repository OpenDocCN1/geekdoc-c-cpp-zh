    # myEtchASketch application from Coding Club: Python Basics\n\nfrom tkinter import\
    \ *\n\n##### Set variables:\ncanvas_height = 400\ncanvas_width = 600\ncanvas_colour\
    \ = \"black\"\n\np1_x = canvas_width/2\np1_y = canvas_height\np1_colour = \"green\"\
    \nline_width = 5\nline_length = 5\n\n##### Functions:\n# player controls\ndef\
    \ p1_move_N(self):\n    global p1_y\n```\n\n```python\n##### main:\n\nwindow =\
    \ Tk()\nwindow.title(\"MyEtchASketch\")\ncanvas = Canvas(bg=canvas_colour, height=canvas_height,\
    \ width=canvas_width, highlightthickness=0)\ncanvas.pack()\n\nwindow.mainloop()\n\
    ```\n\n# Code Box 5.2 analysis\n\nFirst, it must be noted that pl stands for player\
    \ 1. The reason for having a player 1 is that you never know what is going to\
    \ happen when you start out making a game. Ideas crop up and suddenly you want\
    \ another player. OK, probably not for a MyEtchASketch game.\n\n# The variables\n\
    \nInstead of adding lots of squares to make our lines, the code is simpler if\
    \ you draw lots of little lines. You make a square by setting the line_width equal\
    \ to the line_length. This works well because a line has a beginning and end coordinate,\
