- md: "\nThere is another way of dividing. If you use two forward slashes instead\
    \ of one, Python will produce an **integer** as an answer. An integer is a whole\
    \ number (a decimal such as 2.5 is called a **float**). You can now find the remainder,\
    \ with another **mathematical** operator called the **modulus**. This is represented\
    \ by a % sign.\n\n```\n>>> 11/4\n2.75\n>>> 11//4\n2\n>>> 11%4\n3\n>>>\n```\n\n\
    ![](img/fbaeb9cdecc73e46b84c17d0505a6ca3_21_0.png)\n\nTable 2.2 lists some more\
    \ mathematical operators.\n\n| Operator | Name | Example | Answer |\n| --- | ---\
    \ | --- | --- |\n| * | multiply | 2*3 | 6 |\n| / | divide (normal) | 20/8 | 2.5\
    \ |\n| // | divide (integer) | 20//8 | 2 |\n| % | modulus | 20%8 | 4 |\n| + |\
    \ add | 2+3 | 5 |\n| - | subtract | 7-3 | 4 |\n\nTable 2.2 Maths operators.\n\n\
    ## Experiment\n\nIn interactive mode, check that the examples in Table 2.2 do\
    \ give the correct answers and then try out some of your own favourite sums. You\
    \ might like to see what happens if you wrap a maths sum inside speech marks in\
    \ the print () function.\n\nOoh maths!\n\nOoh strings!\n\n![](img/fbaeb9cdecc73e46b84c17d0505a6ca3_22_0.png)\n\
    \n## Combining text and maths\n\nIt is also possible to combine text (or strings)\
    \ and numbers in the print () function. The comma is used here as a separator\
    \ between the text and the maths.\n\n```\n>>> print(\"111 divided by 4 = \", 111/4)\n\
    111 divided by 4 = 27.75\n>>>\n>>> print(\"11 divided by 4 = \", 11/4)\n11 divided\
    \ by 4 = 2.75\n>>>\n```\n\n## Quick Quiz\n\nCan you work out what the output from\
    \ this code will be?\n\n```\n>>> print(\"11 divided by 4 also equals: \", 11//4,\
    \ \" remainder: \", 11%4)\n```\n\n## Going loopy\n\nComputers are great at repetitive\
    \ tasks. So are humans\n\nImagine you were trying to write some code in a History\
