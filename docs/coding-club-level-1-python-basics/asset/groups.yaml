    \nChapter 4: Functions 50\n\n## Code Box 4.4\n\n```python\n# myNumber.py\n# This\
    \ game uses a home made function\nimport random\n\n# Think of a number\ncomputer_number\
    \ = random.randint(1, 100)\n\n# Create the function is_same()\ndef is_same(target,\
    \ number):\n    if target == number:\n        result=\"Win\"\n    elif target\
    \ > number:\n        result=\"Low\"\n    else:\n        result=\"High\"\n    return\
