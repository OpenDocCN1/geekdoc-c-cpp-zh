    \ = is_same(computer_number, guess)\n```\n\n## 结束游戏\n\ninput(\"Correct!\\nDone\\\
    n\\n按 RETURN 退出。\")\n\n在这个游戏中，对你来说有两个新知识点。**return** 关键字告诉 **is_same() 函数** 在被调用后应该返回什么值。我们知道函数可以发送参数，**而且**，它们也可以返回数据。\n\
    \n在这种情况下，它返回存储在变量 **result** 中的值。因此，如果两个数字相同，它返回**字符串 Win**；如果提供的数字大于目标，函数返回值\
