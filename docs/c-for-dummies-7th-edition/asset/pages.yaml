  md: '# 316 Part V: Security


    ```

    //for output we have:

    ostream& operator<< (ostream& dest, char *pSource);

    ostream& operator<< (ostream& dest, string &sDest);

    ostream& operator<< (ostream& dest, int source);

    ostream& operator<< (ostream& dest, double source);

    //...and so goes.

    ```


    When overloaded for I/O, operator() is called the extractor and operator<< is
    called the inserter. The class istream is the basic class for input from a file
    or a device such as the keyboard. C++ opens the istream object when the program
    starts. Similarly, ostream is the basic for output. The prototypes are for inserters
    and extractors for pointers to null terminated character strings (like “My name”),
    for string objects, for ints, and for doubles.


    # Default stream objects


    C++ adds a chunk of code to the front of your program that executes before main()
    gets control. Among other things, code creates the default input/output objects
    shown in Table 23-1.


    Table 23-1

    | Object | Class | Purpose |

    |---|---|--|

    | cin | istream | Standard char input |

    | wcin | wstream | Standard wchar_t"wide char" input |

    | cout | ostream | Standard char output |

    | wcout | wstream | Standard wchar_t"wide char" output |

    | cerr | ostream | Standard error output |

    | wcerr | wstream | Standard error wchar_t"wide char" output |

    | clog | ostream | Standard log |

    | wlog | ostream | Standard wchar_t"wide char" log |


    You''ve seen cin and cout as they read input from the keyboard and output to the
    display


    ```

    C:>MyProgram <InputFile.txt >DefaultOut.txt

    ```'
