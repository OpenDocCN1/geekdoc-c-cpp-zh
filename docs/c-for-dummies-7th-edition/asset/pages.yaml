  md: "# Chapter 6: Creating Functions\n\nThe main difference is the expression accumulatedValue\
    \ = sumSequence(); appears that the inner loop would have been. The sumSequence()\
    \ statement invokes the function of that name. The value of the expression sumSequence()\
    \ is the value returned by the function. This value is stored in the variable\
