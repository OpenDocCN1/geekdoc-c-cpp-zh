  md: "# Chapter 13: Point and Stare at Objects 199\n\nIn this example, C++ passes\
    \ a reference to s rather than a copy. The output from this version is identical\
    \ to the PassObjPtr program — changes made in someFn() are retained in main().\n\
    \n# # Why Bother with Pointers or References?\n\nOkay, so both pointers and references\
    \ provide relative advantages, but why bother with either one? Why not just pass\
    \ the object? I mentioned obvious earlier in this chapter: You can't modify the\
    \ object from a function that gets nothing but a copy of the structure object.\n\
    \nHere's a second reason: Some objects are large — I mean really large. An object\
    \ representing a screen can be many megabytes in length. Passing such an object\
    \ by value means copying the entire into the function's memory.\n\nThe object\
    \ will need to be copied again should that function call, and so on. After a while,\
    \ you can end up with dozens of copies of this object. That consumes memory, and\
    \ copying all the objects can make execution of your program slower booting up\
    \ Windows.\n\n![](img/b52206ee80ddcd0d5f11a03376f21b9d_214_0.png)\n\nThe problem\
    \ of copying objects gets worse. You see in Chapter 17 that making a copy of an\
    \ object can be even more painful than simply copying some around.\n\nPassing\
    \ a pointer (or a reference) is very fast. A pointer is 4 bytes, no matter how\
    \ big the object is being pointed at.\n\n# # Returning to the Heap\n\nThe problems\
    \ that exist for simple types of pointers plague class object pointers as well.\
    \ In particular, you must make sure that the pointer you are using actually points\
    \ to validate an object. For example, don't return a reference to an object defined\
    \ local to the function:\n\n```\nMyClass* myFunction() {\n  // the following does\
    \ not work\n  MyClass mc;\n  MyClass* pMC = &mc;\n  return pMC;\n}\n```\n\nwww.it-ebooks.info"
