    # Counting


    You cannot use floating-point variables in applications where counting is important.
    It needs C++ constructs that count. C++ can verify which number value is meant
    by a given floating-point number.


    For example, it''s clear to you and me that 1.0 is not so clear as C+. What about
    0.9 or 1.1? Should these also be considered as int? C++ simply avoids the problem
    by insisting on int when counting is involved.


    # Calculation speed


    Historically, a computer processor can process integer arithmetic quicker than
    it floating-point arithmetic. While a processor can add 1 million integer numbers
    in a given amount of time, the same processor may be able to perform only 200,000
    floating-point calculations during the same period.


    Calculation speed is becoming less of a problem as microprocessors get faster.
    In today, general-purpose microprocessors include special floating-point circuitry
    to increase the performance of these operations. However, on integer values it
    is just heck of a lot easier and faster than performing the same operation on
    floating-point values.


