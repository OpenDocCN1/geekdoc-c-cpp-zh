  md: "# Chapter 16: Making Constructive Arguments\n\n# Constructors as a Form of\
    \ Conversion\n\nC++ views constructors with a single argument as a way of converting\
    \ from one type to another. Consider a user-defined type designed to represent\
    \ complex numbers. Without getting too technical (for me, not for you), there\
    \ is a natural conversion between real numbers and complex numbers just like the\
    \ conversion from integers to real numbers, in the following example:\n\n```\n\
    double d = 1;      // this is legal\nComplex c = d;     // this should be allowed\
    \ as well\n```\n\nIn fact, C++ looks for ways to make sense out of statements\
    \ like this. The class Complex has a constructor that takes its argument as a\
    \ double. C++ will use that constructor as a form of conversion, as if the preceding\
    \ statement had written as follows:\n\n```\ndouble d = 1;\nComplex c(d);\n```\n\
    \nSome unexpected conversions do not make sense. For example, you may not use\
    \ C++ to convert an integer into a Student object just because Student(int) constructor\
    \ exists. Unexpected conversions can lead to strange run-time errors when C++\
    \ tries to make sense of simple coding mistakes.\n\n![](img/b52206ee80ddcd0d5f11a03376f21b9d_260_0.png)\n\
    \nThe programmer can use the keyword explicit to avoid creating unexpected and\
    \ unintended conversion paths. A constructor marked explicit cannot be used as\
    \ an implicit conversion path:\n\n```\nclass Student {\n    public:\n    // the\
    \ following \"No Name\" constructor cannot be used\n    // as an implicit conversion\
    \ path from int to Student\n    explicit Student(int nStudentID);\n}\n```\n\n\
    ```\nStudent s = 1;           // generates compiler error\nStudent t(123456);\
    \      // this is still allowed\n```\n\nThe declaration of s does not implicitly\
    \ invoke the Student(int) constructor because it is flagged \"explicitly invocable\
    \ only.\" The explicit invoking of the constructor to create the object t is still\
    \ ok.\n\nA complete TypeConversion to demonstrate this principle is included with\
    \ the online material at www.dummies.com/extras/cplusplus."
