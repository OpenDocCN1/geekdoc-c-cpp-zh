    # Examining the Exception Mechanism


    Take a closer look at the steps that the code goes through to handle an exception.
    When the throw occurs, C++ first copies the thrown object to some neutral place.
    It then begins looking for the end of the current try block.


    If a try block is not found in the current function, control passes to the calling
    function. A search is then made of that function. If no try block is found there,
    control passes to the function that called it, and so on up the stack of calling
    functions. This process is called unwinding the stack.


    An important feature of stack unwinding is that as each stack is unwound, objects
    that go out of scope are destroyed just as though the function had executed a
    return statement. This keeps the program from leaving assets dangling.


    When entering the try block, the code searches the first catch phase immediately
    following the closing brace of the catch block. If the thrown object matches the
    type of argument specified in the catch statement, control passes to that catch
    phrase. If not, a check of the next catch phrase. If no matching phrases are found,
    the code searches for the next higher level try block in an ever-outward spiral
    until an appropriate catch can be found. If no catch phrase is found, the program
    is terminated.


    Consider the following example:


    ```

    // CascadingException - the following program demonstrates

    // an example of stack unwinding

    #include <cstdio>

    #include <cstdlib>

    #include <iostream>

    using namespace std;


    // prototypes of some functions that we will need later

    void f1();

    void f2();

    void f3();


    class Obj {

    public:

    Obj(char c) : label(c) {

    cout << "Constructing object " << label << endl;

    }

    ~Obj() {

    cout << "Destructing object " << label << endl;

    }


    protected:

    char label;

    };

    ```'
