    The term botnet is a contract of "robot network," meaning a network of roboted
    (also called zombie) computers. A zombied computer runs just like normal as long
    as it''s not needed. It can run spreadsheets and Code:Blocks and whatever else,
    but sitting deep in the background is a backdoor that''s open to the person with
    the proper program and the passwords — the botnet.


    Goatherders, and you want to bring down their BAG site so that no one can read
    their lies. You try to swap the site with requests from your computer, but you
    can''t because the BAG''s computer is just as fast as yours. You buy four or five
    computers and have all of them Web site on. That works for a few minutes, but
    it doesn''t long enough to figure out that all these requests are coming from
    a few IP addresses, the system administrator for the Brotherhood (very unfairly)
    blocks requests from your PCs!


    When the mother botnet decides the zombie computer needs, he sends commands to
