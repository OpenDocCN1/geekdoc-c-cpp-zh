    \ such as Person, the constructor for that class would be invoked by the Student\
    \ constructor got control. Like a skyscraper, the object is constructed at the\
    \ \"base-ment\" class and working its way up the class structure one story at\
    \ a time.\n\nJust as with member objects, you often need to be able to pass arguments\
    \ to the base constructor. The example program declares the subclass constructor\
