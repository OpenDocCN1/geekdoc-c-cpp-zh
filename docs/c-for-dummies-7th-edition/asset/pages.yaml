  md: "# Chapter 16: Making Constructive Arguments 231\n\n```\nStudent() : Student(\"\
    No Name\", 0, 0.0) {\nStudent(const char *pName): Student(pName, 0, 0.0){\n\n\
    protected:\n    string name;\n    int semesterHours;\n    double gpa;\n//... rest\
    \ is the same as before...\n```\n\nThe declaration Student name invokes the no\
    \ argument constructor which turns around and calls the generic constructor, providing\
    \ default arguments. The Student freshman invokes the Default(const char*) constructor.\n\
    \nThis is more flexible because you can default arguments other than the last\
    \ one. In addition, you have more control over how arguments are defaulted. For\
    \ example, it makes no sense to construct a student with semester hours but no\
    \ GPA. This version would not allow such an object to be constructed since Student(const\
    \ char*, int) is provided.\n\n![](img/b52206ee80ddcd0d5f11a03376f21b9d_246_0.png)\n\
    \nThe somewhat bizarre syntax will seem a lot more reasonable by the time you\
    \ reach the end of this chapter.\n\n# Defaulting Default Constructors\n\nAs far\
    \ as C++ is concerned, every class must have a constructor; otherwise, you cannot\
    \ create objects of that class. If you don't provide a constructor for your class,\
    \ C++ should probably generate an error, but it doesn't. To provide compatibility\
    \ with existing code, which knows nothing about constructors, C++ automatically\
    \ provides a default constructor (sort of a default constructor).\n\nIf you define\
    \ a constructor for your class, C++ doesn't provide the automatic default constructor\
    \ on its own. By creating a constructor, the author is in telling C++ that the\
    \ default constructor is not good enough.\n\nThe following code snippets demonstrate\
    \ this point. This is legal:\n\n```\nclass Student\n{\n    string name;\n};\n\
    int main(int argc, char* pArgs[])\n```"
