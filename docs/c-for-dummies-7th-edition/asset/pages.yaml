  md: "# Using a constructor\n\nConceptually, the idea of adding an argument is simple.\
    \ A constructor is a member function, and member functions can have arguments.\
    \ Therefore, constructors can have arguments.\n\nRemember, though, that you don't\
    \ call the constructor like a normal function. Therefore, the only time to pass\
    \ arguments to the constructor is when the object is created. For example, the\
    \ following program creates an object of s class Student by calling the Student(const\
    \ char*) constructor. The object s is destroyed when the function main() returns.\n\
    \n```\n// ConstructorWarg - a class may pass along arguments\n// to the members'\
    \ constructors\n#include <stdio>\n#include <iostream>\nusing namespace std;\n\n\
    class Student {\npublic:\n    Student(const char* pName) {\n        cout << \"\
    constructing Student \" << pName << endl;\n        name = pName;\n        semesterHours\
    \ = 0;\n        gpa = 0.0;\n    }\n\n    // ...other public members...\nprotected:\n\
    \    string name;\n    int semesterHours;\n    double gpa;\n};\n\nint main(int\
    \ argc, char* pArgs[]) {\n    // create a student locally and one off of the heap\n\
    \    Student s1(\"Jack\");\n    Student* p2 = new Student(\"Scruffy\");\n\n  \
    \  // be sure to delete the heap student\n    delete p2;\n\n     // wait until\
    \ user is ready before terminating program\n    // to allow the user to see the\
    \ program results\n```"
