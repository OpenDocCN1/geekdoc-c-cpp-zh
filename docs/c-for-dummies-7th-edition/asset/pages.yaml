  md: "# Chapter 13: Point and Stare at Objects 203\n\n# Performing other operations\
    \ on a linked list\n\nAdding an object to the head of a list is the simplest operation\
    \ on a linked list. Moving through the elements in a list gives you a better idea\
    \ about how a linked list works:\n\n```\n// navigate through a linked list\nLinkableClass*\
    \ pL = pHead;\nwhile (pL) {\n    // perform some operation here\n    // get the\
    \ next entry\n    pL = pL->next;\n}\n```\n\nThe program initializes the pL pointer\
    \ to the first object of a list of LinkableClass objects through the pointer pHead.(Grab\
    \ the first kid's hand.) The program then enters the while loop. If the pL pointer\
    \ is non-null, it points to some LinkableClass object. Control the loop; the program\
    \ can perform whatever it wants on the object pointed at by pL.\n\nThe assignment\
    \ pL = pL->pNext \"moves\" to the next kid in the list of objects. The program\
    \ checks to see if it is null, meaning we've exhausted the list ... I run out\
    \ of luck, not exhausted all the kids.\n\n# Hooking up with a LinkedListData program\n\
    \nThe LinkedList program shown here implements a linked list of objects containing\
    \ a person's name. The program could easily contain whatever other data you might\
    \ like, such as Social Security number, grade average, height, weight, and bank\
    \ account balance. I've limited the information to just a name to keep the program\
    \ as possible.\n\n```\n// LinkedListData - store data in a linked list of objects\n\
    #include <stdio>\n#include <stdlib>\n#include <iostream>\n\nusing namespace std;\n\
    \n// NameDataSet - stores a person's name (these objects\nc easily store any other\
    \ information desired).\n```\n\nwww.it-ebooks.info"
