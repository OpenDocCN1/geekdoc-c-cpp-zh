  md: "# Chapter 20\n\n# Examining Virtual Member Functions: Are They for Real?\n\n\
    In This Chapter\n\n+   - Discovering polymorphism (a.k.a. late binding) works\n\
    - Finding out safe polymorphic nachos are\n- Overriding member functions in a\
    \ subclass\n- Checking out special considerations with polymorphism\n\nThe number\
    \ and type of a function's arguments are included in its full, extended, name.\
    \ This enables you to give two functions the same name as long as the extended\
    \ name is different:\n\n```\nvoid someFn(int);\nvoid someFn(char*);\nvoid someFn(char*,\
    \ double);\n```\n\nIn all three cases, the short name for these functions is someFn()\
    \ (hey!) this is some fun. The extended names for all three differ: someFn(int)\
    \ versus someFn(char*), and so on. C++ is left to figure out function is meant\
    \ by the arguments during the call.\n\nMember functions can be overloaded. The\
    \ number of arguments, the type of arguments, and the class are all part of the\
    \ extended name.\n\nInheritance introduces a whole new wrinkle, however. What\
    \ if a function in a base class has the same name as a function in the subclass?\
    \ Consider, for example, the following simple code snippet:\n\n```\nclass Student\n\
    {\npublic:\n    double calcTuition();\n};\n```"
