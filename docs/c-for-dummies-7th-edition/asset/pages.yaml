  md: '# Chapter 28: Writing Hacker-Proof Code 397


    The next block of code actually does nothing more than call the print(), which
    is located at 0x046A944. Unfortunately, the program cannot call this function
    directly since its address contains a null byte. The null byte would cause the
    copying of the block to terminate before overwriting the return address. To avoid
    this, I added a 1 to each byte of the address stored in memory, and I subtract
    this back before I use the address. The program copies 0xB474AA55 in the EAX register
    and subtracts 0x01010101 to calculate the desired address. The CALL EAX registers
    the ''You''ve been hacked!'' message.

    How did I know that print() was located at 0x0046A947? By examining the call to
    print() in main().nThe final block calls the exit() function using the same trick
    to terminate the program. Control does not return from exit().


    In file, the BO_File txt (which stands for Buffer Overflow, by the way) contains
    a small language program that outputs the message "You''ve been hacked" and calls
    exit(0) to exit normally. In addition, it''s crafted in just such a way that it
    overwrites the return address with the beginning of the buffer to cause this program
    to be executed when getString() attempts to return, just as described earlier.


    The details of a hack like this are very specific to exactly how the overflow
    feature is laid out in memory. This particular version of BO_File txt works on
    only versions of BufferOverflow built for Windows with a particular version of
    gcc. This is not a limitation of the overflow itself — I could create a version
    of BO_File txt for Linux or Macintosh and for a different version of gcc. Since
