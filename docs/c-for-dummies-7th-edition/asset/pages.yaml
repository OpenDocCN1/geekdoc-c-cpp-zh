  md: "# 76 Part I: Getting Started with C++ Programming\n\nAfter the code in the\
    \ body of the loop finishes executing, control passes to the increment clause\
    \ before returning to check the conditional clause — thereby repeating the process.\
    \ The increment clause normally handles the autoincrement or decrement statements\
    \ used to update the counter variables.\n\nThe for loop is best understood by\
    \ example. The ForDemo program is nothing more than the WhileDemo converted to\
    \ the for loop construct:\n\n```\n// ForDemo - input a loop. Loop while\n// outputting\
    \ astring arg number of times.\n#include <iostream>\n#include <stdlib>\n#include\
    \ <iostream>\nusing namespace std;\n\nint main(int nnumberArgs, char* pszArgs[])\
    \ {\n    // input the loop count\n    int nLoopCount;\n    cout << \"Enter loop\
    \ count: \";\n    cin >> nLoopCount;\n\n    // count up to the loop count limit\n\
    \    for (nLoopCount > 0) {\n        nLoopCount = nLoopCount - 1;\n        cout\
    \ << \" Only \" << nLoopCount << \" loops to go\" << endl;\n    }\n    // wait\
    \ until user is ready before terminating program\n    // to allow the user to\
    \ see the program results\n    cout << \"Press Enter to continue..\" << endl;\n\
    \    cin.ignore(10, '\\n');\n    cin.get();\n    return 0;\n}\n```\n\nThe for\
    \ loop reads a value from the keyboard into the variable. The for loop starts\
    \ by counting nLoopCount to 0. Control passes into the for loop if nLoopCount\
    \ is greater than 0. Once inside the for loop, the program increments nLoopCount\
    \ and displays the result. That, the program returns to the for loop control.\
    \ Control skips to the next line after the for loop as soon as nLoopCount has\
    \ been decreased to 0.\n\n![](img/b52206ee80ddcd0d5f11a03376f21b9d_91_0.png)\n\
    \nAll three sections of a for loop may be empty. An empty initialization or increment\
    \ section does nothing. An empty comparison section is treated like a comparison\
    \ that returns true."
