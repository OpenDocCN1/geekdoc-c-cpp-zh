  md: "# Chapter 18: Static Members: Can Fabric Softener Help? 265\n\nStudent objects.\
    \ Remember, however, this count reflects the number of Student objects (including\
    \ any temporaries) and not necessarily the number of students.\n\nA closely related\
    \ use for a static member is as a flag to indicate whether a particular action\
    \ has occurred. For example, a class Radio may need to initialize hardware before\
    \ sending the first command but not before subsequent tunes. A flag indicating\
    \ that the first tune is the first tune will save the ticket. This includes flagging\
    \ when an error has occurred.\n\nAnother common use is to provide space for the\
    \ pointer to the first member of a list — the so-called head pointer (see Chapter\
    \ 13 if this doesn't sound familiar). Static members can allocate bits of common\
    \ data that all objects in all functions share (overuse of this memory is a really\
    \ bad idea doing so making tracking errors difficult).\n\n# Declaring Static Member\
    \ Functions\n\nMember functions can be declared as static. Member functions are\
    \ useful when you want to associate an action to a class, but you don't need to\
    \ associate that action with a particular object. For example, the member function\
    \ Duck:fly() is associated with a particular duck, whereas the rather drastic\
    \ function Duck:goExtinct() is not.\n\nLike static members, static member functions\
    \ are associated with a class and not with a particular object of that class.\
    \ This means that, like a reference to a static member, a member function does\
    \ not require an object. If an object is present, only its type is used.\n\nThus,\
    \ both call to the static function number() in the following example are legal.\
    \ This brings us to our first static program — I mean our first program using\
