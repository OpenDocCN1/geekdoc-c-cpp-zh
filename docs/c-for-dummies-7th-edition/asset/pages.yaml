  md: '# 366 Part V: Security


    Second, a class template does not consume memory. Therefore, there is no penalty
    for creating class templates if they are never instantiated. On the other hand,
    a class template uses memory every time it is instantiated (except as noted in
    the next section). Thus, the code for Array<Student> consumes memory even if Array<int>
    already exists.


    Finally, a class template cannot be compiled and checked for errors until it is
    converted into a real class. Thus, a program that references the class template
    Array<T> might compile even though Array<T> contains obvious syntax errors. The
    errors won''t appear until a class such as Array<int> or Array-Student> is created.


    # External Template Instantiations


    The TemplateVector example program instantiated TemplateVector twice: once for
    integers and for Name objects. Once instantiated, other functions within main.cpp
    could refer to TemplateVector-int without incurring any further penalty. Now,
    suppose my program included a second module; say, secondModule.cpp. Now suppose
    secondModule.cpp also used one of TemplateVector-. This second module would instantiate
    its own copy of TemplateVector-int. For large programs, consisting of dozens of
    separate modules, this could mean replicating dozens of copies of the same code.
    This can mean a lot of overhead both in compile time and in the size of the result.


    The 2011 standard allows for the keyword extern to avoid this overhead. In this
    example, the programmer would include the following declaration near the beginning
    of secondModule.cpp.


    ```

    extern template class TemplateVector<int>;

    ```


    # Implementing an Initializer List


    Simple arrays can be initialized with an initializer list as shown here:


    ```

    int myArray[] = {10, 20, 30, 40, 50};

    ```'
