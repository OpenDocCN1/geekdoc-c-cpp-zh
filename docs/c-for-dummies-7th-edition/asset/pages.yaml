  md: "# 102 Part II: Becoming a Functional C++ Programmer\n\nThe first call uses\
    \ the default values for both the minimum and maximum age (18 and 65, respectively).\
    \ The second call uses the default maximum age of 65 but supplies a different\
    \ minimum age of 21. The third call provides both an explicit minimum and maximum\
    \ age.\n\nThe last call does not check whether age is between 18 and 60 as you\
    \ might expect. In this case, the call is made with a minimum age of 60 and a\
    \ maximum age of 65.\n\n![](img/b52206ee80ddcd0d5f11a03376f21b9d_117_0.png)\n\n\
    Default arguments can sometimes confuse C++ when combined with function overloading.\
    \ For example, the following is not legal:\n\n```\nbool isLegal(int age);\nboisLegal(int\
    \ age, int minAge = 21); // not allowed\n```\n\nThe problem is that if you call\
    \ isLegal(10), C++ wouldn't know which one of the functions to call: the first\
    \ function with just one argument or the second function with the second argument\
    \ defaulted.\n\n# Passing by Value and Passing by Reference\n\nC++ normally passes\
    \ arguments to functions by value. That is, if I call a function f(n), it is the\
    \ value of n that gets passed to the function. This allows me to make calls like\
    \ the following:\n\n```\nfn(a + b); // pass the value of a + b\n```\n\nWhat gets\
    \ passed in this snippet is the result of the expression a + b.\n\nThis has a\
    \ perhaps surprising side effect demonstrated by the following snippet:\n\n```\n\
    void multiplyByTwo(int m)\n{\n  m *= 2;\n}\n\nint n = 1;\nmultiplyByTwo(n);\n\n\
    cout << \"n = \" << n << endl;\n```"
