    \ gpa;\n}\n```\n\nThe destructor is invoked automatically when an object is destroyed,\
    \ or in C++ parlance, when an object is destructed. That sounds circular (the\
    \ destructor is invoked when an object is destroyed) so I've avoided the term\
    \ until now. For non-heap memory, you can also say, \"when the object goes out\
    \ of scope.\" A local object goes out of scope when the function returns. A global\
    \ or static object goes out of scope when the program terminates.\n\nBut what\
    \ about heap memory? An object that has been allocated off the heap is destroyed\
    \ when it's returned to the heap using the delete command. This is demonstrated\
