    \ class SavingsAccount.\n\nThe naming convention used here is common: Class names\
    \ are normally capitalized. In a class name with multiple words such as SavingsAccount,\
    \ each word is capitalized, and the words are jammed together without an underscore.\
    \ Object names follow the same rule of jamming multiple words together, but they\
    \ normally start with a small letter, as in mySavingsAccount. As always, these\
    \ norms (I hesitate to say rules) are to help out the human reader — C++ doesn't\
    \ care one way or the other."
