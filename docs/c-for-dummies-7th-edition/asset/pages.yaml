  md: "# 94 Part II: Becoming a Functional C++ Programmer\n\nBoth the arguments and\
    \ the return value are optional. If either is absent, the keyword void is used\
    \ instead. That is, if a function has a void argument list, the function does\
    \ not take any arguments when called (this was the case with the FunctionDemo\
    \ program). If the return type is void, the function does not return a value to\
    \ the caller.\n\n![](img/b52206ee80ddcd0d5f11a03376f21b9d_109_0.png)\n\nThe default\
    \ argument type to a function is void, meaning that it takes no arguments. A function\
    \ int fn(void) may be declared as int fn().\n\n# Understanding simple functions\n\
    \nThe simple function sumSequence() returns an integer value that it calculates.\
    \ Functions may return any of the intrinsic variable types described in Chapter\
    \ 2. For example, a function might return a double or a char. If a function returns\
    \ nothing, the return type of the function is void.\n\n![](img/b52206ee80ddcd0d5f11a03376f21b9d_109_1.png)\n\
    \nA function may be labeled by its return type — for example, a function that\
    \ returns an int is often known as an integer function. A function that returns\
    \ void is known as a void function.\n\nFor example, the following void function\
    \ performs an operation but returns value:\n\n```\nvoid echoSquare()\n{\n    int\
    \ value;\ncout << \"Enter a value:\";\ncin >> value;\ncout << \"\\nThe square\
    \ is: \" << (value * value) << \"\\n\";\n    return;\n}\n```\n\nControl begins\
    \ at the open brace and continues through the return statement. The return statement\
    \ in a void function is not followed by a value. The return statement in a void\
    \ function is optional. If it isn't present, execution returns to the calling\
    \ function when it encounters the close brace.\n\n# Understanding functions with\
    \ arguments\n\nFunctions without arguments are of limited use because the communication\
    \ from such functions is one-way — through the return value. Two-way communication\
    \ is through function arguments.\n\nwww-it-ebooks.info"
