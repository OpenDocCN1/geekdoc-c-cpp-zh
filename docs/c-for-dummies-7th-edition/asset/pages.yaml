  md: "# 100 Part II: Becoming a Functional C++ Programmer\n\nmain() doesn't know\
    \ the proper argument types of the function someFunc() at the time of the call.\
    \ C++ might surmise the call that the full function definition is someFunc(int,\
    \ int) and that its return type is void; however, the definition of the function\
    \ appears immediately after main() shows that the programmer wants the first argument\
    \ converted to a floating point and that the function returns an actual value.\n\
    \nI know, — C++ could be lazy and look ahead to determine the extended name of\
    \ someFunc() on its own, it doesn't. What is needed is some way to inform main()\
    \ of the full name of someFunc() before it is used. This is handled by what we\
    \ call a function prototype declaration.\n\nA prototype declaration appears the\
    \ same as a function with no body. In use, a prototype declaration looks like\
    \ this:\n\n```\nsomeFunc(double, int);\nmain(int nNumberOfArgs, char* pszArgs[])\
    \ {\n    someFunc(1, 2);\n    int someFunc(double dArg1, int nArg2)\n    // ...do\
    \ something\n}\n```\n\nThe prototype declaration tells the world (at least part\
    \ of the world after the declaration) that the extended name for someFunc() is\
    \ someFunction(double, int). The call in main() now knows to cast the 1 to a double\
    \ before making the call. Addition, main() knows that someFunc() returns an int\
    \ value to the caller.\n\nIt is common practice to include function prototypes\
    \ for every function in a module either at the beginning of the module, or more\
    \ often, in a separate file that can be included within other modules at compile-time.\
    \ That's the function of the include statements that appear at the beginning of\
    \ the Official C++ For Dummies template:\n\n```\n#include <cstd>\n#include <cstdlib>\n\
    #include <iostream>\n```\n\nThese three files cdio, cstdlib, and iostream include\
    \ prototype declarations for the common system functions that we've been using,\
    \ such as cout << \"string\". The contents of these files are inserted at the\
    \ part of the #include statement by the compiler as part of its normal duties.\n\
    \nChapter 10 is dedicated to include files and other so-called preprocessor commands.\n\
    \n![](img/b52206ee80ddcd0d5f11a03376f21b9d_115_0.png)"
