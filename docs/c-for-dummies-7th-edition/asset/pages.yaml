  md: '# 126 Part II: Becoming a Functional C++ Programmer


    Which you use is a matter of personal preference.


    The * is called the asterisk character (that''s logically enough), but because
    asterisk is hard to say, many programmers have come to call it the star, or less
    commonly, the splat character. Thus, they would say "star pVar" or "splat pVar".


    In an expression, the unary operator & means "the address of". Thus, we would
    read the assignment pVar = &nVar; as "nVar gets the address of nVar."


    # Using different types of pointers


    Every expression has a type as well as a value. The type of the expression nVar
    is, the type of &nVar is "pointer to an integer," written int*;. Comparing with
