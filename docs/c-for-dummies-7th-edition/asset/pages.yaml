    \ needlessly. To avoid this, C++ allows the programmer to \"remove\" the tests\
    \ when creating the version of the program to be shipped to users: #define the\
    \ constant DEBUG(for \"not debug mode\") This causes the preprocessor to convert\
    \ all the calls to assert() in your module to \"do nothing\" (universally known\
