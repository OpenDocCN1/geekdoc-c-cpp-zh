  md: '# 208 Part III: Introduction to Classes


    # # Why you need protected members


    To understand the role of protected, think about the goals of object-oriented
    programming:


    +   - To protect the internals of the class from outside functions. Suppose, for
    example, that you have a plan to build a software microwave (or whatever), provide
    it with a simple interface to the outside world, and put a box around it to keep
    others from messing with the insides. The protected keyword is that box.


    +   - To make the class responsible for maintaining its internal state. It''s
    not fair to ask the class to be responsible if others can reach in and manipulate
    its internals (any more than it is to ask a microwave designer to be responsible
    for the consequences of my mucking with a microwave''s internal wiring).


    +   - To limit the interface of the class to the outside world. It''s easier to
    figure out and use a class that has a limited interface (the public members).
    Protected members are hidden from the user and need not be learned. The interface
    becomes the class; this is called abstraction (Chapter 11 for more abstraction).


    +   - To reduce the level of interconnection between the class and other code.
    By limiting interconnection, you can easily replace one class with another or
    use the class in other programs.


    Now, I know what non-object types are out there saying: "You don''t need some
    fancy feature to do that all. Just make a rule that says certain members are publicly
    accessible and others are not."


    Although that is true in theory, it doesn''t work. People start out with all kinds
    of good intentions, but as long as the language doesn''t allow discourage direct
    access of protected members, these good intentions get crushed under the pressure
    to get the product out the door.


    # # Discovering how protected members work


    By default, the members of a class are protected, which means they are not accessible
    by nonmembers of the class. Adding the keyword public to a class makes subsequent
    members public, which means that they are accessible by nonmember functions. Adding
    the keyword protected makes subsequent members of the class protected. You can
    switch between public and protected as often you like.'
