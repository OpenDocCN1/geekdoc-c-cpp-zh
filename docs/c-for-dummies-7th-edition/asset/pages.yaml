  md: "# Making an Argument for Using Protected Members\n\nNow that you know a little\
    \ more about how to use protected members in an actual class, I can replay the\
    \ arguments for using protected members.\n\n# Protecting the internal state of\
    \ the class\n\nMaking the gpa member precludes the application from setting the\
    \ grade point average to some arbitrary value. The application can add courses,\
    \ but it can't change the grade point average directly.\n\nIf the application\
    \ has a legitimate need to set the grade point average directly, the class can\
    \ provide a member function for that purpose, as follows:\n\n```\nclass Student\
    \ {\npublic:\n    // same as before\n    double grade() { return gpa; }\n    //\
    \ we allow the grade to be changed\n    double grade(double newGPA)\n{\n     \
    \   double oldGPA = gpa;\n        // only if the new value is valid\n        if\
    \ (newGPA > 0 && newGPA <= 4.0)\n{\n            gpa = newGPA;\n        }\n   \
    \     return oldGPA;\n    }\n    // other stuff is the same including the data\n\
    members:\nprotected:\n    int semesterHours; // hours earned toward graduation\n\
    \    double gpa;\n}\n```\n\nThe member function grade(double) allows the application\
    \ to set the gpa. Notice, how the class still hasn't given up control completely.\
    \ The application can't set gpa to any old value, only a gpa in the legal range\
    \ of values (0 through 4.0) is accepted.\n\nThus, the Student class has provided\
    \ access to an internal member without abdicating its responsibility to make sure\
    \ the internal state of the class is valid."
