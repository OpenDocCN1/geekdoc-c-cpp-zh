    | char* strcpy(target, source) | Copies the string into a target array. |

    | char* strcat(target, source) | Concatenates the source string onto the end of
    the target string. |

    | char* strncpy(target, source, n) | Copies a string up to n characters from the
    source into a target array. |

    | char* strncat(target, source, n) | Concatenates the source string onto the end
    of the target string or n, whichever comes first. |

    | char* strstr(str, pattern) | Returns the address of the first occurrence of
    pattern in string. Returns a null if pattern is not found. |

    | int strcmp(source1, source2) | Compares two strings. Returns -1 if source1 occurs
    before source2 in the dictionary or 1 later. 0 if the two strings match exactly.
    |

    | int strncmp(source1, source2, n) | Compares the first n characters in two strings.
    |


    ![](img/b52206ee80ddcd0d5f11a03376f21b9d_133_0.png)


    You need to add the statement #include <cstring> to the beginning of any program
    that uses a str... function because this include file contains the prototype declarations
    that C++ requires to work on your work.


    The arguments to the str... functions appear backward to any reasonable individual
    (you might consider this an audit test for “reasonable”). For example, the function
    strcat(target, source) tracks the source string onto the end of the first argument
    target.


    The strncpy() and strcat() are similar to strcpy() and strcat() counterparts that
    they accept the length of the target buffer as one of their arguments. The call
    strcpy(szTarget, szSource, 128) “copy the characters in szSource into szTarget
    until a null character or until you''ve copied 128 characters, whichever comes
    first.” This avoids inadvertently writing beyond the end of the source string
    array.


