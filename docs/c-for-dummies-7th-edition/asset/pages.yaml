    \ name;\n}\n```\n\n# Constructing Class Members\n\nIn the previous examples, all\
    \ data members are of simple types, such as int and double. With simple types,\
    \ it is sufficient to assign a value to the variable within the constructor. Problems\
    \ arise when initializing certain types of data members, however.\n\n# Constructing\
    \ a complex data member\n\nMembers of a class have the same problems as any other\
    \ variable. It makes no sense for a Student object to have some default ID of\
    \ 0. This is true if the object is a member of a class. Consider the following\
    \ example that creates a new class, StudentId, to manage the student identification\
    \ numbers instead of relying on a plain of integer variable:\n\n```\n// ConstructingMembers\
    \ - a class may pass along arguments\n// to the members' constructors\n\n#include\
    \ <cstdio>\n#include <cstdlib>\n#include <iostream>\nusing namespace std;\n\n\
    int nextStudentId = 1000; // first legal Student ID\nclass StudentId {\npublic:\n\
    \    // default constructor assigns id's sequentially\n    StudentId() {\n   \
    \     value = nextStudentId++;\n        cout << \"Take next student id \" << value\
    \ << endl;\n    }\n```"
