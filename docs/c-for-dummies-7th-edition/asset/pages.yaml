  md: '# Chapter 28: Writing Hacker-Code 401


    This version of getString() creates a variable-size vector of char objects. The
    function sets the initial size of the vector to 64 characters, but buffer will
    grow automatically if necessary. Once in the loop, the function uses the push_back()
    to push each character to the end of the vector.


    The vector class overloads the bracket operator, so if I could have buffer [index]=c;
    however, in order to improve performance, the bracket operator does not check
    for buffer overflow. The push_back() method first checks that there is enough
    room in the buffer to handle the character being added. If not, push_back() allocates
    another buffer, twice as big as the first, and copies the contents of the smaller
    buffer into the larger. It repeats this every time it needs more room in the input
    buffer.


