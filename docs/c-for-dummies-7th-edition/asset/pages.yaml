  md: '# Chapter 3: Performing Mathematical Operations


    # Why define a separate increment operator?


    The authors of C++ noted that programmers add 1 more than any other constant.
    To provide some convenience, a special add 1 instruction was added to the language.
    In addition, most present-day processors have an increment instruction that is
    faster than the addition instruction. Back when C++ was created — with microprocessors
    being what they were — saving a big deal. Today, not so much.


    The increment and decrement operators are peculiar in both that come in two flavors:
    a prefix version and a postfix version (known as pre-increment and post-increment,
    respectively). Consider, for example, the increment operator (the works in the
    same way).


    Suppose the variable n has the value 5. Both ++n and n++ increment n the value
    6. The difference between the two is that ++n is the value after incrementing
    (6) while the value of n++ is the value after incrementing (5). The following
    example illustrates this difference:


    ```

    // declare three integer variables

    int n1, n2, n3;


    n1 = 5;

    n2 = ++n1; // the value of both n1 and n2 is now 6


    n1 = 5;

    n3 = n1++; // the value of n1 is 6 but the value of n3 is 5

    ```


    Thus n2 is given the value of n1 after it has been incremented (using the increment
    operator), whereas n3 gets the value of n1 before it is incremented using the
    post-increment operator.


