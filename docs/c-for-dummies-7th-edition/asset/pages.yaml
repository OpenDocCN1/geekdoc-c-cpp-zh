  md: "# 286 Part IV: Inheritance\n\nYou need to declare the function virtual only\
    \ in the base class. The \"virtual-ness\" is carried down to the subclass automatically.\
    \ In this book, however, I follow the coding standard of declaring the function\
    \ virtual everywhere (virtually).\n\n# When Is a Virtual Function?\n\nJust because\
    \ you think that a particular function call is bound late doesn't mean that it\
    \ is. If not declared with the same arguments in the subclasses, the member functions\
    \ are not overridden polymorphically, whether or not they are declared virtual.\n\
    \nOne exception to the identical declaration rule is that if the member function\
    \ in the base class returns a pointer or reference to a base class object, an\
    \ overridden member function in a subclass may return a pointer or reference to\
    \ an object of the subclass. In other words, the function makeCopy() is polymorphic,\
    \ even though the return type of the two functions differ:\n\n```\nclass Base\
