  md: '# Chapter 28


    # Writing Hacker-Proof Code


    In This Chapter


    +   - How to avoid becoming a soldier in someone''s botnet army

    - Getting a handle on SQL injection

    - Understanding buffer overflow hacks

    - Defensive programming against buffer overflows

    - Getting a little help from the operating system


    > In the interest of full disclosure, I should admit right now: I''m not sure
    that it''s possible to write hacker-proof code. Those slippery devils always seem
    to find a way. But by knowing some of their tricks and how to counter them, you
    can write programs that are very hacker resistant.


    There is more to hacker-proofing than just writing code. Program protection takes
    a multitude of forms which I describe in Chapter 30. However, since this book
    is about writing programs, after all, and since code writing is probably the most
    important component to hacker-proofing, let''s start there.


    # Understanding the Hacker''s Motives


    Why would a hacker want to break into one of the lowly C++ console programs presented
    in this book? The short answer is, "He wouldn''t." The programs in this book are
    all written to be executed from the keyboard as normal user privileges. If the
    user can use the keyboard to execute one of these programs, he can execute any
    other command that he wants. He doesn''t need to resort to hacks.


    Think a little further into the future, however. After you''ve finished this book
    and sharpened your C++ skills, you will really see that job you were looking for
    at the hmmm, at the bank. Yeah, that''s the ticket. You''re a big programmer at
    the bank, and you''ve just finished writing the back-end code for some awesome
    ledger application that customers use to balance their accounts. Performance is
    great because it''s C++, and the customers love it. You''re looking forward to
    that big bonus that''s surely coming your way.'
