    \ the range over which a variable is defined. Consider the following code snippet:\n\
    \n```\n// the following variable is accessible to\n// all functions and defined\
    \ as long as the\n// program is running (global scope)\nint intGlobal;\n\n// the\
    \ following variable intChild is accessible\n// only to the function and is defined\
