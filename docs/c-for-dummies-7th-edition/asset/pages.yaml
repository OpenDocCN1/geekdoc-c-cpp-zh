    # C++ collision with filenames


    Windows uses the backslash character to separate folder names in the path to a
    file. (This is a remnant of MS-DOS that Windows has not been able to shake.) Thus,
    Root\Folder\File within FolderA, which is a sub- of Root.


    Unfortunately, MS-DOS''s use of the backslash conflicts with the use of the backslash
    to indicate an escape character in C++. The character \ is a backslash in C++.
    The MS-DOS path Root\FolderA\File is represented in C++ as the string "Root\\FolderA\\File".


    The numerical forms allow you to specify any non-printing character that you like,
