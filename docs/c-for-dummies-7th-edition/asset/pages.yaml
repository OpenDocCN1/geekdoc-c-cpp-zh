    # Determining the Order of Operations


    All operators perform some defined function. In addition, every operator has a
    *precedence* — a specified order in which the expressions are evaluated. Consider,
    for example, how precedence affects solving the following problem:


    ```

    int var = 2 * 3 + 1;

    ```


    If the addition is performed before the multiplication, the value of the expression
    is 2, 4, or 8. If the multiplication is performed first, the value is 6 plus 1,
    or 7.


    The precedence of the operators determines who goes first. Table 3-1 shows multiplication
    has higher precedence than addition, so the result is 7. (The concept of precedence
    is also present in arithmetic. C++ adheres to the common precedence.)


    So what when two operators of the same precedence appear in the same expression?
    For example:


    ```

    int var = 8 / 4 / 2;

    ```


    When operators of the same precedence appear in the same expression, they are
    evaluated from left to right (the same rule applied in arithmetic). Thus, in this
    code snippet, *var* is equal to 8 divided by 4 (which is 2) divided by 2 (which
    is 1).'
