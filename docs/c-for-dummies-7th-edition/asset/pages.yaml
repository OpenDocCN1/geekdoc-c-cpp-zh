  md: '# 170 Part III: Introduction to Classes


    +   - I don''t look inside my microwave''s case.

    - Even if I were a microwave designer and knew all about the inner workings of
    my microwave, I would still use it the same way to heat nachos without thinking
    about all that inside.


    These are not profound observations. You can deal with only so much stress in
    your life. To reduce the number of things that you deal with, work at a certain
    level of detail.


    In-oriented (OO) computerese, the level of detail at which you work is called
    the level of abstraction. To introduce another OO term while I have the chance,
    I abstract away the details of the microwave''s innards.


    ![](img/b52206ee80ddcd0d5f11a03376f21b9d_185_0.png)


    When I''m working on nachos, I view my microwave oven as a box. (I can''t worry
    about the innards of the microwave oven and still follow the Cowboys on the tube.)
    As long as I operate the microwave only through its interface (the keypad), there
    should be nothing I can do to


    +   - Cause the microwave to enter an inconsistent state and crash.

    - Turn my nachos into a blackened, flaming mass.

    - Make the microwave (along with the surrounding house) burst into flames!


    #  Preparing functional nachos


    Suppose I were to ask my son to write an algorithm for how Dad makes nachos. If
    he understood what I wanted, he would probably write "open a can of beans, grate
    some cheese, the jalapeños," and so on. When it comes to the part about microwave
    the concoction, he would write something like "cook in the microwave for five
    minutes."


    That description is straightforward and complete. But it''s not the way a functional
    programmer would code a program to make nachos. Functional programmers in a world
    devoid of objects such as microwave ovens and other appliances. They tend to worry
    about flow charts with their myriad functional paths. In a functional solution
    to the nachos, the flow of control would pass through my finger to the front panel
    and then to the innards of the microwave. Pretty soon, flow would be winding around
    complex logic paths about how long to turn the microwave tube and whether to sound
    the "come and get it" tone.


    In a world like this, it''s difficult to think in terms of levels of abstraction.
    There are no objects, no abstractions behind to hide inherent complexity.'
