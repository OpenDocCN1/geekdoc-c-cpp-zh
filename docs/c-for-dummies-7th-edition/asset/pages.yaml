  md: '# Introduction


    Welcome to C++ For Dummies, 7th Edition. Think of this book as C++;

    Reader''s Digest Edition, bringing you everything you need to know to

    start programming without all the boring stuff.


    # About This Book


    C++ For Dummies is an introduction to the C++ language. I start from the

    beginning (where else?) and work my way from early concepts through more

    sophisticated techniques. I don''t assume that you have any prior knowledge

    (at least, not of programming).


    The book is full of examples. Every concept is documented in numerous snip-

    ets and several complete programs.


    Unlike C++ programming books, C++ For Dummies considers the "why"

    just as important as the "how". The features of C++ are like pieces of a jigsaw

    puzzle. Rather than just present the features, I think it''s important that you

    understand how they fit together. You can also use the book as a reference:

    If you want to understand what''s going on with all the template stuff, for

    example, flip to Chapter 26. Each chapter contains necessary references

    to earlier chapters in case you don''t read the readers in sequence.


    C++ For Dummies is not operating system-specific. It is just as useful to

    Macintosh or Linux programmers as is to Windows-based developers. The

    book doesn''t cover Windows or .NET programming.


    You have to master a powerful programming language, like C++, even if

    your plan is to complete an Windows application or .NET pro-\grammer. Once you''ve
    finished C++ For Dummies you will be in position to

    continue in your area of specialization, whatever it might be.


    In this modern era of hackerdom, learning defensive programming is important,

    even for beginners, so I cover important concepts to keep your program

    from being hacked.'
