- img_proc: true
  md: '# 10 Part I: Getting Started with C++


    The point of programming in C++ is to write a sequence of commands that can be
    converted into a machine-language program that *actually does what* we want. This
    conversion is called *compiling* and is the job of the compiler. The machine code
    you wrote must be combined with some setup and teardown instructions and some
    standard library routines in a process known as *linking*. Together, compiling
    and linking is known as *building*. The resulting *machine-executable* files carry
    the extension .EXE in Windows. They don''t carry any particular extension in Linux
    or Macintosh.


    That sounds easy enough — so what is the big deal? Keep going.


    To write a program, you need two specialized programs. One (an editor) is what
    you use to write your code as you build .CPP source file. The other (a compiler)
    converts your source file into a machine-executable file that carries your real-world
    commands (open spreadsheet, make rules, deflect incoming asteroids, whatever).


    Nowadays, tool developers generally combine compiler and editor into a single
    package — a development *environment*. After finishing the commands that make
    up your program, you only click a button to build the executable file.


    Fortunately, there are public-domain C++ environments. I use one of them in this
    book — the Code:Blocks environment. This editor will work with a lot of different
    compilers, but the version of Code:Blocks combined with the gcc compiler used
    to write this book is available for download for Windows, Macintosh, and various
    versions of Linux, as described in the section of this chapter.


    Although Code:Blocks is public domain, you''re encouraged to pay some small fee
    to support its further development. You don''t have to pay to use Code:Blocks,
    but you can contribute to the cause if you like. See


    I have tested the programs in this book with Code:Blocks 13.12 which comes bundled
    with gcc version 4.7.1. This version of gcc implements most of the C++ 2011 standard.


    You can use different versions of gcc or even different compilers if you prefer,
    but they may not implement the ''11 standard. For that reason, 2011-extensions
    are marked with the ''11 icon you see here.


    The gcc compiler does not implement any of the extensions added in the C++ 2014
    standard as of your writing, but I have included them, where applicable, because
    some day it will.


    Okay, I admit it: This book is somewhat Windows-centric, I have tested all of
    the programs in the book on Windows 2000/XP/Vista/7/8, Ubuntu Linux, and Macintosh
    OS X. I flag any differences between operating systems in the text.


    ![](img/b52206ee80ddcd0d5f11a03376f21b9d_25_0.png)


    ![](img/b52206ee80ddcd0d5f11a03376f21b9d_25_1.png)'
