    \n# Divide and conquer\n\nThe FunctionDemo has split the outer loop in main()\
    \ from the inner loop into a function sumSequence() and created a displayExplanation()\
    \ to get kicks kicked off. This division wasn't arbitrary; But functions in FunctionDemo\
    \ perform a logically separate operation.\n\n![](img/b52206ee80ddcd0d5f11a03376f21b9d_108_0.png)\n\
    \nA good function is easy to describe. You shouldn't have to use more than a single\
    \ sentence, with a minimum of such words as and, or, unless or but. For example,\
    \ here's a simple, straightforward definition: \"The sumSequence accumulates a\
    \ sequence of integer values entered by the user.\" This definition is concise\
    \ and clear. It's a world away from the NestedDemo program description: \"The\
    \ program explains to the user how the program works AND sums a sequence of positive\
    \ values AND displays the sum starts over again UNTIL the user enters a zero-length\
    \ sum.\"\n\nThe output of a sample run of this program appears identical to that\
    \ generated by the NestedDemo program.\n\n# Understanding the Details of Functions\n\
    \nFunctions are so fundamental to creating C++ programs that have a handle on\
    \ the details of creating, defining, and testing them is critical. Armed with\
    \ the example FunctionDemo program, consider the following definition of function:\
    \ A function is a logically separated block of C++ code.\n\nThe function construct\
    \ has the following:\n\n```\n<return type> name(<arguments to the function)>\n\
    \  // ...\n  return <expression>;\n```\n\nThe arguments to a function are values\
    \ that can be passed to the function to be used as input information. The return\
    \ value is a value that the function returns. For example, in the call to the\
    \ function square(10), the value 10 is an argument to the function square(). The\
    \ returned value is 100 (if it is not, this is not a poorly named function)."
