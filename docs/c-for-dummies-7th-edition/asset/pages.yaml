    # Protecting Members:

    Do Not Disturb


    +   In This Chapter

    - Declaring members protected

    - Accessing protected members from within the class

    - Accessing protected members from outside the class


    > Chapter 12 introduces the concept of the class. That chapter describes the public
    keyword as though it were part of the class declaration — just something you do.
    In this chapter, you find out about an alternative to public.


    # Protecting Members


    The members of a class can be marked protected, which makes them inaccessible
    outside class. The alternative is to make the members public. Public members are
    accessible to all.


    Please understand the term inaccessible in a weak sense. Any programmer can go
    into the source code, remove the protected keyword, and do whatever she wants.
    Further, any hacker will his salt code into a protected section of code. The protected
    keyword is designed to protect a programmer from herself by preventing inadvertent
    access.


    ![](img/b52206ee80ddcd0d5f11a03376f21b9d_222_0.png)'
  merge: -1
