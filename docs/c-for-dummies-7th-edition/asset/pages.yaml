    Each constructor is called in name as the TutorPair object is built up, starting
    from the smallest data member and working up to the TutorPair::TutorPair() constructor
    function.


    Two TutorPair objects are created. The first, tp, is defined locally to the function();
    the second, pTP, is allocated off the heap. tp goes out of scope and is destroyed
    when control passes out of the function. The memory whose address is returned
    from fn() is not destroyed until main() deletes it.


    When an object is destroyed, the sequence of destructors is invoked in the reverse
    order in which the constructors were called.


    C++ provides a separate keyword for deleting arrays, delete[]:


    ```

    * pS = new Student[5]; // construct 5 Students


    // ...later in the program...

    // delete heap memory and invoke

    delete[] pS; // destructor on each object

    ```


    Only the delete[] keyword knows to invoke the destructor for each object allocated.


