    # Inlining member functions


    | Member functions defined in the class default to inline (unless they have been
    specifically outlined by a compiler switch or for any number of technical reasons).
    Mostly, this is because a member function defined in the class is very small,
    and small functions are candidates for inlining. Remember that an inline function
    is expanded where it is invoked. (See Chapter 10 for comparison of inline functions
    and macros). An inline function executes faster because the processor doesn''t
    have to jump over where the function is defined — inline functions usually take
    more memory because they are copied into every call instead of being defined once.
    | There is another good but more technical reason to inline member functions defined
    within a class. Remember that C++ structures are normally defined in include files,
    which are then included in the CPP source file that need them. Such files should
    not contain data or functions because these files are compiled multiple times.
    Including an inline function is okay, however, because it (a macro) expands in
    the source file. The same applies to C++ classes. By defaulting member functions
    in classes inline, you avoid the preceding problem. |


