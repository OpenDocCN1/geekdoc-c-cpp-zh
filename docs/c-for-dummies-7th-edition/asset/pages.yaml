  md: "# Defaulting Arguments\n\nYou can provide default values for arguments in your\
    \ function declaration. Consider the following simple example:\n\n```\n// isLegal\
    \ return true if the age is greater\n// than or equal to the minimum age\n// which\
    \ defaults to 21\nbool isLegal(int age, int minAge = 21)\n{\n    return age >=\
    \ minAge;\n}\n```\n\nThis function returns true if the first argument passed,\
    \ age, is greater than the second argument, minAge, and the second argument defaults\
    \ to 21 if you don't say otherwise in the function call. The following calls are\
    \ both legal:\n\n```\nlegal = isLegal(age); // same as isLegal(age, 21)\nif (isLouisiana())\n\
    {\n    legal = isLegal(age, 18);\n}\n```\n\nThe call isLegal(age) is completely\
    \ equivalent to isLegal(age, 21). C++ just provides the default argument for you.\
    \ The call to isLegal(age, 18) ignores the default value.\n\nNormally the defaults\
    \ are provided in the prototype declarations.\n\nYou can default more than one\
    \ argument, but defaults must be defined from left to right and filled in right\
    \ to right:\n\n```\n// the following is legal\nbool isWorkingAge(int age, int\
    \ minAge=18, int maxAge=65)\nlegal = isWorkingAge(age);\n\n// check if the worker\
    \ is between 18 and 65\nlegal = isWorkingAge(age);\n\n// check if work is between\
    \ 21 and 60\nlegal = isWorkingAge(age, 21);\n\n// the following does NOT check\
    \ if the worker is\n// between 18 and 60\nlegal = isWorkingAge(age, 60);\n```\n\
    \n![](img/b52206ee80ddcd0d5f11a03376f21b9d_116_0.png)"
