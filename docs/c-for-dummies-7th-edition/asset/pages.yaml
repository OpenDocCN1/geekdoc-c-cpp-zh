  md: "98 Part II: Becoming a Functional C++ Programmer\n\n# # Overloading Function\
    \ Names\n\nC++ must have a way of telling functions apart. Thus, two functions\
    \ cannot share the same name and argument list, known as the extended name or\
    \ the signature. The following extended function names are all different and can\
    \ reside in the same program:\n\n```\nvoid someFunction(void)\n{\n    // ....perform\
    \ some function\n}\nvoid someFunction(int n)\n{\n    // ...perform some different\
    \ function\n}\nvoid someFunction(double d)\n{\n    // ...perform very different\
    \ function\n}\nvoid someFunction(int n1, int n2)\n{\n    // ...do something different\
    \ yet\n}\n```\n\nC++ knows that the functions someFunction(void), someFunction(int),\
    \ someFunction(double), and someFunction(int) are not the same.\n\nThis multiple\
    \ use of names is known as function overloading.\n\nProgrammers often refer to\
    \ functions by their shorthand name, which is the name of the function without\
    \ its arguments, such as someFunction(), in the same way that I the shorthand\
    \ name Stephen (actually, my nickname is Randy, with we on this one). But if there's\
    \ any doubt, I can be differentiated from other Stephens by including my family\
    \ name. In the same way, overloaded functions can be differentiated by their argument\
    \ lists.\n\nA typical application that uses overloaded functions with unique extended\
    \ names:\n\n```\nint int1, intVariable2;\ndouble doubleVariable;\n\n// functions\
    \ are distinguished by the type of\n// the argument passed\nsomeFunction();  \
    \        // calls someFunction(void)\n```\n\nwww.it-ebooks.info"
