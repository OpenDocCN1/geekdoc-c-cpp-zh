  md: "```\nprotected:\ndouble straw;\nint sticks;\nint bricks;\n;\n```\n\nSimilarly,\
    \ the copy constructor for a base class is invoked automatically.\n\n# Destructing\
    \ a subclass\n\nFollowing the rule that destructors are invoked in the reverse\
    \ order of the constructors, the destructor for *GraduateStudent* is given control.\
    \ After it's given its measure of destruction, control passes to the destructor\
    \ for *Advisor* and then to the destructor for *Student*. If *Student* the destructor\
    \ for *Person* would get control after *Student*.\n\nThis is logical. The blob\
    \ of memory is first converted to a *Student* object. Only then is it the job\
    \ of the *GraduateStudent* constructor to transform this simple *Student* into\
    \ a *GraduateStudent*. The destructor simply reverses the process.\n\n![](img/b52206ee80ddcd0d5f11a03376f21b9d_294_0.png)\n\
    \n# Inheriting constructors\n\nAs of the 2011 standard, subclass can inherit the\
    \ constructor of its base class as well, shown in the following snippet:\n\n```\n\
    class Student {\npublic:\n    Student(string name);\n}\nclass GraduateStudent\
    \ : public Student {\npublic:\n    using Student::Student; // inherit base constructors\n\
    }\n```\n\nThis creates a *GraduateStudent(string)* constructor exactly as if the\
    \ following had been entered:\n\n```\nclass GraduateStudent : public Student {\n\
    public:\n    GraduateStudent(string name) : Student(name) {}\n}\n```\n\nThe advantage\
    \ of inheriting the constructors of the base class is that the subclass inherits\
    \ all of the base class constructors. This is useful when building a subclass\
    \ that extends an important base class in some trivial way."
