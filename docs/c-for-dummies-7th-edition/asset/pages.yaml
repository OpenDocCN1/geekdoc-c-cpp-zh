  md: "# 106 Part II: Becoming a Functional C++ Programmer\n\nYou can see that this\
    \ approach can't handle sequences involving more than just a few numbers. Besides,\
    \ it's ugly. What we need is some type of structure that has a name like a variable\
    \ that can store more than one value. May I present to you, Ms. A. Ray.\n\nAn\
    \ array solves the problem of sequences nicely. For example, the following snippet\
    \ clears an array valueArray that has storage for up to 128 ints. It populates\
    \ the array with the numbers entered from the keyboard:\n\n```\nint nValue;\n\
    // declare an array capable of holding up to 128 ints\nint nArray[128];\n\n//\
    \ define an index used to access subsequent members\n// of the array; don't exceed\
    \ the 128 int limit\nfor (int i = 0; i < 128; i++) {\n    // exit the loop when\
    \ the user enters a negative\n    // number\n    if (nValue < 0) {\n        break;\n\
    \    }\n    nArray[i] = nValue;\n}\n```\n\nThe second line of this snippet clears\
    \ an array nArray. Array declaration begins with the type of the array members:\
    \ in this case, int. This is followed by the name of the array. The last elements\
    \ of an array declaration are closed brackets containing the maximum number of\
    \ elements that the array can hold. This snippet can store up to 128 integers.\n\
    \n![](img/b52206ee80ddcd0d5f11a03376f21b9d_121_0.png)\n\nThe size of an array\
