  md: "# Chapter 8: Taking a First Look at C++ Pointers\n\nThere is no requirement\
    \ that the C++ compiler pack variables in memory with no spaces between them.\
    \ In fact, you often see these gaps in memory when mixing variables of different\
    \ size.\n\nThe Code::Blocks/gcc compiler could be storing variables for its own\
    \ use in between variables. Or, more likely, a peculiarity in how the variables\
    \ are laid out in memory is causing the compiler to waste a small amount of space.\n\
    \n# Using Pointer Variables\n\nA pointer variable is a variable that contains\
    \ an address, usually the address of another variable. Returning to the analogy\
    \ of hotel room numbers, I might tell my son that I will be in 0x100 on my trip.\
    \ My son can act as a pointer variable of sorts. Anyone can ask him at any time,\
    \ \"Where's your father staying?\" Include $55 with that question, and he will\
    \ spill his guts out hesitation.\n\nBy the way, notice something about pointer\
    \ variables: No where your son is, and no matter how many he tells people of your\
    \ whereabouts, he is still in room 0x100.\n\nThe following pseudo-C++ demonstrates\
    \ how the two address operators shown in Table 8-1 are used:\n\n```\nmySon = &DadRoom;\
    \ // tell mySon the address of Dad's Room\nroom = *mySon; // \"Dad's room number\
    \ is 10\"\n```\n\nThe following C++ code snippet shows how these operators are\
    \ used correctly:\n\n```\nvoid fn() {\n  int nVar;\n  int* pVar;\n\n  pVar = &nVar;\
    \ // pVar now points to nVar\n  *pVar = 10; // stores 10 into the int location\n\
    \             // pointed by pVar\n}\n```\n\nThe function fn() begins the declaration\
    \ of nVar. The next statement declares the variable pVar to be a variable of pointer\
    \ type to an int.\n\nPointer variables are declared like normal variables except\
    \ for the addition of the unary * character. This * character can appear anywhere\
    \ between the base name — the following two declarations are equivalent:\n\n```\n\
    int*pVar1;\nint *pVar2;\n```"
