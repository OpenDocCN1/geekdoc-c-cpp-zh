  md: '# 390 Part V: Security


    are declared within the scope of a single function. The memory for these variables
    are allocated when the function is called and deallocated when the function returns.
    Computers do this through a mechanism known as the stack.


    The stack pointer (which in assembly language normally carries the name ESP) points
    to the next available location on the stack. A function can invoke a PUSH instruction
    to save a value in a register to the stack. This automatically decrements the
    ESP so that the memory isn''t used for something else. A POP instruction returns
    the value to the register and increments the back to its own pre-PUSH location.


    Another value that gets onto the stack is the return address when ever function
    is called. The 0xE8 instruction CALL getString() pushes the next address onto
    the stack and jumps to the getString() function. This is shown graphically as
    a busy intercept capturing from the Code::Blocks debugger in Figure 28.


