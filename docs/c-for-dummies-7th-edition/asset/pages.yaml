    # Executing Loops in a Program


    Branch statements allow you to direct the flow of a program''s execution one path
    or other. This is a big improvement but still not enough to write full-strength
    programs.


    Consider the problem of updating the computer display. The typical PC must update
    every a thousand pixels for each row as it paints an image from left to right.
    It repeats this process for each of the thousand or so rows on the screen. It
    does this by executing the small number of instructions, millions of times — once
    for each pixel.'
