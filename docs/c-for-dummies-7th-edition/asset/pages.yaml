    In this example, the program must both set the hexadecimal flags using setf()
    and unset (that is, the decimal flag using unsetf()) because the decimal, octal,
    and hexadecimal flags are mutually exclusive.


    The final call to flags() restores the format flags to their previous value. This
    is not necessary if the program is about to terminate anyway.


    Further control is provided by the setw() method that sets the minimum width of
    the next output operation. In the event that the field does not take up the full
    width, the inser adds the required quantity of characters. The default fill character
