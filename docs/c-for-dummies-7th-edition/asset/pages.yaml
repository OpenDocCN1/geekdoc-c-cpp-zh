  md: '# Chapter 24: Handling Errors — Exceptions


    Through a not-so-clever feature called an exception specification, you can add
    the type of objects that be factorial() throws to its declaration. At one time,
    some thought this would be a good idea, but times change. Exception specifications
    were never mandatory and have been deprecated in the 2011 standard. Exception
    specifications are not presented in this book.


    ![](img/b52206ee80ddcd0d5f11a03376f21b9d_354_0.png)


    # Justifying a New Error Mechanism


    What''s wrong with errors like FORTRAN used to make? I could have said something
    "Okay, if factorial() detects an error, it returns a negative number. The actual
    value indicates the source of the problem.. What''s wrong with that? That''s how
    it was done for ages. (''If it was good enough for grandpa..")


    Unfortunately, several problems arise. First, although it''s true that the result
    of a factorial can''t be negative, other functions aren''t so lucky. For example,
    you can''t take the log of a negative number either, or logarithms can be either
    negative or positive. There''s no value that a logarithm function can return.


    Second, there''s just so much information that you can store in an integer. Maybe
    you have -1 for "argument is negative" and -2 for "argument is too large". But,
    if the error is too large, you want to know what the argument is because that
    information might help you debug the problem. There''s no place to store that
    type of information.


    Third, the processing of errors is optional. Suppose someone writes factorial()
    that dutifulfully checks the argument and returns a negative number if the argument
    is out of range. If a function that calls factorial() doesn''t check the error,
    returning an error value doesn''t do any good. You can make all kinds of menacing
    threats, such as "You will check your error returns or else," the programmer may
    have the best of intentions, but you all know they get lazy and return to their
    old, non-checking ways.


    Even if you check the error from factorial() or any other function, what can the
    function do with the error? It probably does nothing more than output an error
    message of its own and return another error indication to the caller, which probably
    does the same. Pretty soon, there''s more error detection code and all mixed together.


    The exception mechanism addresses these problems by removing the error path from
    the normal code path. Furthermore, exceptions make error handling obligatory.
    If your function doesn''t handle the exception, control passes up the chain of
    calls until C++ finds a function to handle the error. This also gives you the
    flexibility to ignore errors that you can''t do anything about anyway. The functions
    that can actually handle the problem need to catch the exception.


