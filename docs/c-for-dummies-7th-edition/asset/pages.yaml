    \ calls (function scope)\nvoid child(void) {\n    int intChild;\n}\n\n// the following\
    \ variable intParent has function\n// scope\nvoid parent(void) {\n    int intParent\
    \ = 0;\n    child();\n\n    int intLater = 0;\n    intParent = intLater;\n}\n\n\
    int main(int nArgs, char* pArgs[]) {\n    parent();\n}\n```\n\nThis program fragment\
    \ starts with the declaration of a variable intGlobal. This variable exists from\
    \ the time the program begins executing until it terminates. We say that intGlobal\
    \ \"has program scope.\" We also say that the variable \"goes into scope\" even\
    \ before the function main() is called."
