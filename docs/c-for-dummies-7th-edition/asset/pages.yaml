    # Reading and writing streams directly


    The inserter and extractor operators provide a convenient mechanism for formatted
    input. However, sometimes you just want to say, "Give to me; I don''t care what
    the format is." Several methods are useful in this context.


    The simplest function, get(), just returns the next character in the input file.
    Its output equivalent is put(). The function getline() returns a string of characters
    up until one terminator — the default is a newline. getline() strips off the terminator
    but makes no attempt to refract or otherwise interpret the input.


    The function read() is even more basic. This function reads the number of characters
    that you specify, or less if the program encounters an end-of-file. The function
    gcount() always returns the actual number of characters read. The output equivalent
    is write().


