    # Using a subclass


    The class Student has been defined in the conventional fashion. The class GraduateStudent
    is a bit different, however. The colon followed by the phrase public Student at
    the beginning of the class definition defines GraduateStudent as a subclass of
    Student.


    The appearance of the keyword public implies that there is probably protected
    inheritance as well. All it''s true, but protected inheritance is rarely used
    and beyond the scope of this book.


    Programmers love inventing new terms or giving new meaning to existing terms.
    Heck, programmers even invent new terms and give them a second meaning. Here is
    a set of equivalent expressions that describes the relationship:


    +   * GraduateStudent is a subclass of Student.

    * Student is the base class or the parent class of GraduateStudent.

    * GraduateStudent inherits or is derived from Student.

    * GraduateStudent extends Student.


    As a subclass of Student, GraduateStudent inherits all its members. For example,
    GraduateStudent has a name even though that is declared up in the base class.
    However, a subclass can add its own members, for example qualifierGrade. After
    all, gs quite literally IS_A_Student plus a little bit more.


    The main() function declares two objects, ill of type Student and gs of type GraduateStudent.
    It proceeds to access the addCourse() member function for both types of students.
    main() then accesses the qualifier() function that is only a member of the subclass.'
