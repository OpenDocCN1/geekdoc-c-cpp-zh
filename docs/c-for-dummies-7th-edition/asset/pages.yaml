    # Understanding Code Injection


    Code injection occurs when the user enters your program to execute some piece
    of user-created code. "What? My program would never do that!" you say. Consider
    the most common and, fortunately for us, the easiest to understand variant of
    this little scale: SQL injection.


    # Examining an example SQL injection


