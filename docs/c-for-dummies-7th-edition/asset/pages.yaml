  md: '# Introduction 3


    open and close parentheses, such as myFavoriteFunction(). The arguments to the
    function are left off except when there''s a specific need to make them easier
    to read.


    Sometimes, I''ll tell you to use menu commands, as File:Open. This notation means
    to use the keyboard or mouse to open the File menu and then choose the Option
    option.


    Use of gender is always a tricky subject when writing a how-to book. I don''t
    want to appear be telling gentlemen how ignorant the ladies are while giving by
    using he and him all the time. In this book, I use the pronouns she and her when
    referring to the programmer and he when referring to the user of the program,
    she writes a program that can use.


    Each new feature is introduced by answering the following three questions:


    +   - What is this new feature?

    - Why was it introduced into the language?

    - How does it work?


    Small pieces of code are sprinkled liberally throughout the chapters. Each demonstrates
    some newly introduced feature or highlights some brilliant point I''m making.
    These snippets may not be complete and certainly don''t do anything meaningful.
    However, every concept is demonstrated in at least one program that you can execute
    and play with your computer.


    A real-world program can take up lots of pages. However, seeing such a program
    is an important didactic for any reader. I have included a series of programs
    along with explanation of how these programs work.


    I use one simple example program that I call BUDGET. The program starts with BUDGET1
    maintains a set of simple checking and savings accounts. The reader is encouraged
    to review this program at the end of Part II. The subsequent version, BUDGET2,
    adds the object-oriented concepts presented in Part III. The examples work their
    way using more and more features of the language, culminating in BUDGET5, which
    you should review after you master all the chapters in the book. The BUDGET programs
    are included with the book''s source code at www.dummies.com/extras/cplusplus.'
