- img_proc: true
  md: '# 418 Part VI: The Part of Tens


    Programmer''s tunnel vision is okay during the early development phase. At some
    point, however, the programmer (or, better yet, some other programmer having not
    anything to do with the development of the code) needs to sit back and forget
    about the immediate problem. She needs to ask herself, “How will this program
    react to illegal input?”


    For example, in the field for the username, suppose someone enters several thousand
    characters. How will the program react? Ideally, you want the program to respond
    with an error message like: “What the heck are these several thousand characters
    doing in the place I expected a name?” Barring that, a simple “I don''t understand
    what you mean” is fine.


    In fact, anything short of crashing or corrupting data is acceptable. This is
    because a crash creates a possible intrusion vector that a hacker can exploit
    to get your program to do something you don''t want it to.


    Not every crash is exploitable, but many are. In fact, throwing lots of garbage
    input into a program and looking for the crashes is fuzzing the program and often
    the first step to finding exploits in deployed applications.


    Here are some of the rules for checking input:


    +   - Make no assumptions about the length of the input

    - Don''t accept more input than you have room for your fixed-length buffers (or
    used variable-size buffers).

    - Check the range of every numerical value to make sure that it makes sense.

    - Check for and filter out characters that may be used by a hacker to inject code.

    - Don''t pass raw input onto another service, such as a database server.


    Perform all of the same checks on the values returned from remote services. The
    hacker may not be on the input side, he may be on the response side.


    # Handle Failures Gracefully


    By this, I don''t mean “Don''t be a sore loser.” What I mean is your program should
    respond reasonably to failures that occur within the program. For example, if
    your call to a library function returns a nullptr, the program should detect this
    and do something reasonable.


    Reasonable here is to be understood freely liberally. It does not necessarily
    that the program needs to sniff around to figure out exactly why the function
    didn''t return a reasonable address. It could be that the request was for


    ![](img/b52206ee80ddcd0d5f11a03376f21b9d_433_0.png)'
  merge: -1
