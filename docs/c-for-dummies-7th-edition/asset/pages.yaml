    return 0;\n```\n\nWhileDemo begins by retrieving a loop count from the user, which\
    \ it stores in the variable nLoopCount. The program executes a while loop. The\
    \ first tests nLoopCount. If nLoopCount is greater than 0, the program enters\
    \ the body of the loop (the body is the code between the braces), which decrements\
