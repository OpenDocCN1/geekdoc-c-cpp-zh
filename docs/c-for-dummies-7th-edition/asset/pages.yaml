  md: "# Chapter 5: Controlling Program Flow\n\nFor loop has two small problems. First,\
    \ it's destructive — not in the\nsense of what my puppy does to a slipper, but\
    \ in the sense that it changes\nthe value of nloopcount,\"destroying\" the original\
    \ value. Second, this for loop\ncounts backward from large values down to smaller\
    \ values. These two prob-\\lems are addressed by adding a dedicated counting variable\
    \ to the for loop.\nHere's what it looks like:\n\n```\n// ForDemo2 - input a loop\
    \ count. Loop while\n// outputting asring number of times.\n#include <stdio>\n\
    #include <stdlib>\n#include <iostream>\nusing namespace std;\n\nint main(int NumberArgs,\
    \ char* pszArgs[])\n{\n    // input the loop count\n    int nLoopCount;\n    cout\
    \ << \"Enter loop count: \";\n    cin >> nLoopCount;\n\n    // count up to the\
    \ loop count limit\n    for (int i = 1; i <= nLoopCount; i++) {\n        cout\
    \ << \"We've finished \" << i\n             << \" loops\" << endl;\n    }\n\n\
    \    // wait until user is ready before terminating program\n    // to allow the\
    \ user to see the program results\n    cout << \"Press Enter to continue...\"\
    \ << endl;\n    cin.ignore(10, '\\n');\n    cin.get();\n    return 0;\n}\n```\n\
    \nThis modified version of ForDemo loops the same as it did before. Instead of\n\
    mifying the value of nLoopCount, however, this ForDemo2 version uses a\ncounter\
    \ variable.\n\nThis for loop declares a counter i and initializes it to 0. It\
    \ com-\\pares this counter variable to nLoopCount. If i is less than nLoopCount,\
    \ con-\ntrol passes to the output statement within the body of the for loop. Once\
    \ the\nbody has completed executing, control passes to the increment clause\n\
    i is incremented and compared to nLoopCount again, and so it goes."
