  md: "# Chapter 18: Static Members: Can Fabric Softener?\n\nThis class keeps its\
    \ data members protected and provides access functions that allow outside (non-Student)\
    \ code to read but not modify them.\n\nDeclaring the return type of name() to\
    \ string& rather than string causes the function to return a reference to the\
    \ object's existing name rather than creating a temporary string object (See Chapter\
    \ 17 for a brilliant treatise on constructing and avoiding temporaries.) Adding\
    \ the const to the declaration keeps the caller from modifying the class name\
    \ member.\n\nNotice how the static member function number() can access the static\
    \ data noStudents. In fact, that only member of the class that it can access a\
    \ static member function is not associated with any object. To declare name()\
    \ to be static, I could refer to Student::name(), which would immediately be the\
    \ question, \"Which name?\"\n\nThe following snippet is only one that I am aware\
    \ of where a static member can refer directly to a non-static member:\n\n```\n\
    class Student\n{\n    public:\n        static int elementsInName()\n        {\n\
    \            int sizeOfArray = sizeof(name);\n            return sizeOfArray/sizeof(char);\n\
    \        }\n\n    protected:\n        char name[MAX_NAME_SIZE];\n};\n```\n\nThe\
