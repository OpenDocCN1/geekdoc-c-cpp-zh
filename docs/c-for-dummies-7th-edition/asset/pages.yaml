    ![](img/b52206ee80ddcd0d5f11a03376f21b9d_93_0.png)\n\n# Avoiding the dreaded infinite\
    \ loop\n\nAn infinite loop is an execution path that continues forever. An infinite\
    \ loop occurs any time the condition that would terminate the loop cannot occur\
    \ — usually the result of a coding error.\n\nConsider the following minor variation\
    \ of the earlier loop:\n\n```\nwhile (nLoopCount > 0)\n  cout << \"Only \" <<\
    \ nLoopCount\n    << \" loops to go\" << endl;\n```\n\nThe programmer forgot to\
    \ decrement the variable nLoopCount. The result is a loop counter that never changes.\
    \ The test condition is either always false or always true. The program executes\
    \ in a never-ending (infinite) loop.\n\nI realize nothing's infinite. Eventually\
    \ the power will fail, the computer will break, Microsoft will go bankrupt, and\
    \ dogs will sleep with cats. . . . Either the loop will stop executing, or you\
    \ won't care anymore. But an infinite loop will continue until something outside\
    \ the control of the program makes it stop.\n\n![](img/b52206ee80ddcd0d5f11a03376f21b9d_93_1.png)\n\
    \nYou can create an infinite loop in many more ways than shown here, most of which\
    \ are a lot more difficult to spot than this was."
