    # Do I Need My Inheritance?


    Inheritance was introduced into C++ for several reasons. Of course, the major
    reason is the capability of expressing the inheritance relationship. (I''ll return
    to that in a moment.) A minor reason is to reduce the amount of typing. Suppose
    you have a class Student and you''re asked to add a new class called GraduateStudent.
    Inheritance can drastically reduce the number of things you have to put in the
    class. All you need in the class GraduateStudent are things that describe the
    differences between students and graduate students.


    Another side effect is to do with software modification. Suppose you inherit from
    some existing class. Later, you find that the base class doesn''t exactly what
    the subclass needs. Or perhaps the class has a bug. Modifying the base class might
    break other code that uses that base class. Creating and using a new subclass
    that overflows the incorrect with a corrected version solves your problem without
    causing else problems.


