    > Chapter 28 describes things you should do in your code to avoid writing programs
    that are vulnerable to hackers. It also describes features you can enable if your
    operating system supports them, such as Space Layout Randomization (ASLR) and
    Data Execution Prevention (DEP). This chapter describes further steps you can
    take as part of the software development process to defend yourself from the “hackata.”


    # # Don’t Make Assumptions / about User Input


    The programmer has a frame of mind when writing a program. She’s thinking about
    the problem that she’s trying to solve. Given that a person can keep only many
    things in her mind at one time, she’s probably not thinking beyond the immediate
    problem.'
