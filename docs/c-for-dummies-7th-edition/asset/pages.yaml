    # # Intrinsically Defined Objects


    C++ defines a set of intrinsic constants, which are shown in Table 10-1. These
    are constants that C++ thinks are just too cool to without — and that you would
    have trouble defining for yourself anyway.

    Table 10-1 Predefined Preprocessor Constants

    | Constant | Type | Meaning |

    |---|---|---|

    | __FILE__ | const char * | The name of the source file. |

    | __LINE__ | const int | The current line number. |

    | __func__ | const char * | The name of the current function (C++ ''11 only).
    |

    | __DATE__ | const char * | The current date. |

    | __TIME__ | const char * | The current time. |

    | __TIMESTAMP__ | const char * | The current date and time. |

    | __STDC__ | int | Set to 1 if the C++ compiler is compliant with the standard.
    |

    | __cplusplus | int | Set to 1 if the compiler is a C++ compiler (as opposed to
    a C compiler). This includes files to be shared across environments.


    These internal macros are particularly useful when generating error messages.
    You would think C++ generates plenty of messages on its own and doesn''t need
    any more help, but sometimes you want to create your own custom errors. For you,
    C++ offers one, not two, but three options: #error, assert(), and static_assert().
    Each of these mechanisms works slightly differently.


    The #error command is a preprocessor directive (as you can tell by the fact that
    it starts with the # sign). It causes the preprocessor to stop and output a message.
    Suppose that your program won''t work with anything but standard C++. You could
    add the following to the beginning of your program:


    ```

    #if ! __cplusplus || ! __STDC

    #error This is a standard C++ program.

    #endif

    ```'
