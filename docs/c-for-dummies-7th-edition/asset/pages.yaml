  md: '# 394 Part V: Security


    But if you could engineer the text file so that it overwrote the return address
    not with crazy ASCII characters, but with the address of code that you wanted
    to force the program to execute? When getString() executed a RET, it wouldn''t
    crash, it would go off and execute the code you want to.


    But where could you put this extra code? What better place than within the text''s
    already been read into buffer? So the hack goes into this:


    +   1. Create a machine language program that does whatever you want the program
    to do and insert it into the input file first.

    2. Make sure that the buffer overflows just far enough that the return address
    gets overwritten with the address of buffer itself.

    3. When the program reads the text into the buffer, it will in effect the hacker
    code into buffer and then overwrite the return address.

    4. When getString() tries to run where it was called in main(), control will pass
    to the beginning of buffer, where the hacker code gets executed.


    This sounds pretty tricky, and actually, it is. But remember that the hacker can
    execute your program as often as he wants. When executed with a good debugger,
    he can figure out how big to make the buffer and what address to use for buffer.


    Just to show that such a thing is possible, check out the following run:


    ```

    C:\CPP_Programs\Chap28\BufferOverflow\BufferOverflow

    This program reads input from an input file

    Enter the name of the file:BO_File.txt

    You''ve been hacked!

    C:\CPP_Programs\Chap28\BufferOverflow>

    ```


    Here the program starts out normal by prompting the user for an input file. The
    time the user entered the name BO_File.txt. In response, the program didn''t output
    the contents of the file as you might expect, nor did it crash. Instead, in response
    to this file, the program output the ominous message "You''ve been hacked! Notice
    in particular that the program didn''t output the normal "Press Enter to continue
    . . .". This program went directly to Jail, didn''t pass Go, and didn''t collect
    $200! Control never returned from getString() back to main().


    ![](img/b52206ee80ddcd0d5f11a03376f21b9d_409_0.png)'
