  md: "# Chapter 7\n\n# Storing Sequences in Arrays\n\nIn This Chapter\n\n+   - Considering\
    \ the need for something like an array\n- Introducing the array data type\n- Using\
    \ an array\n- Using the most common type of array — the character string\n\nA\
    \ array is a sequence of variables that shares the same name and that is referenced\
    \ using an index. Arrays are useful little critters that allow you to store a\
    \ large number of values of the same type that are related in some way — for example,\
    \ the batting averages of all the players on the same team might be a good candidate\
    \ for storage within an array. Arrays can be multi-dimensional, allowing you,\
    \ for example, to store an array of batting averages within an array of months,\
    \ which allows you to work with the batting averages of the team as they occur\
    \ by month.\n\nIn this chapter, you will find out how to initialize and use arrays\
    \ for fun and profit. You will find find out an especially useful form of array\
    \ called a char string.\n\n# Arraying the Arguments for Arrays\n\nConsider the\
