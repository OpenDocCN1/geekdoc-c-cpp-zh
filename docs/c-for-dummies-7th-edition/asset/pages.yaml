  md: "# Chapter 8: Taking a First Look at C++ Pointers\n\nThis error is very common\
    \ because it can creep up in a number of ways. Unfortunately, this error does\
    \ not cause the program to instantly stop. In fact, the program may work fine\
    \ most of the time — that is, the program continues to work as long as the formerly\
    \ occupied by dLocalVariable is not reused immediately. Intermittent problems\
    \ are the most difficult ones to solve.\n\n![](img/b52206ee80ddcd0d5f11a03376f21b9d_148_0.png)\n\
    \n# Providing a solution using the heap\n\nThe scope problem originated because\
    \ C++ took the locally defined memory before the programmer was ready. What is\
    \ needed is a block of memory controlled by the programmer. She can allocate memory\
    \ and put it back when she wants — not because C++ thinks it's a good idea. Such\
    \ a block of memory is called the heap.\n\nHeap memory is allocated using the\
    \ new keyword followed by the type of object to allocate. The new command breaks\
    \ a chunk of the heap big enough to hold the specified type of object and returns\
    \ its address. For example, the following allows a double variable off the heap:\n\
    \n```\ndouble* child(void) {\n    double* pdLocalVariable = new double;\n    return\
    \ pdLocalVariable;\n}\n```\n\nThis now works properly. Although the variable pdLocalVariable\
    \ goes out of scope when the function child() returns, the memory to which pdLocalVariable\
    \ refers does not. A memory location returned by new does not go out of scope\
    \ unless it is explicitly returned to the heap using the key-\nword delete, which\
    \ is specifically designed for that purpose: \n\n```\nvoid parent(void) {\n  \
    \  // child() returns the address of a block\n    // of heap memory\n    double*\
    \ pdMyDouble = child();\n\n    // store a value there\n    *pdMyDouble = 1.1;\n\
    \n    // ...\n\n    // now return the memory to the heap\n    delete pdMyDouble;\n\
    \    pdMyDouble = 0;\n\n    // ...\n}\n```"
