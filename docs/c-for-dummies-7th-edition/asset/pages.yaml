  md: "# 282 Part IV: Inheritance\n\n```\nclass GraduateStudent : public Student\n\
    {\n    public:\n    double calcTuition();\n}\n```\n\n```\nint main(int argcs,\
    \ char* pArgs[])\n{\n    Student s;\n    GraduateStudent gs;\n    s.calcTuition();\
    \ //calls Student::calcTuition()\n    gs.calcTuition();//calls GraduateStudent::calcTuition()\n\
    \    return 0;\n}\n```\n\nAs with overloading situation, when the programmer refers\
    \ to calcTuition(). C++ has to decide which calcTuition() is intended. Obviously,\
    \ if the two functions differed in the type of arguments, there's no problem.\
    \ Even if the arguments were the same, the class name should be sufficient to\
    \ resolve the case, and this example is different. The call s.calcTuition() refers\
    \ to Student:calcTuition() because s is declared locally as a.Student, whereas\
    \ gs.calcTuition() refers to GraduateStudent:calcTuition().\n\nBut what if the\
    \ exact class of the object can't be determined at compile-time? To demonstrate\
    \ how this can occur, changing the program in a seemingly trivial way:\n\n```\n\
    // OverloadOverride - demonstrate when a function is\n// overloaded at compile\
    \ time vs. overridden at runtime\n#include <stdio>\n#include <cstdlib>\n#include\
    \ <iostream>\nusing namespace std;\nclass Student\n{\n    public:\n    // uncomment\
    \ one or the other of the next\n    // two lines; one binds calcTuition() early\
    \ and\n    // the other late\n    virtual void calcTuition()\n    {\n        cout\
    \ << \"We're in Student::calcTuition\" << endl;\n    }\n}\n```"
