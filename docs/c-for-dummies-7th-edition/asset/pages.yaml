  md: '# Chapter 7: Storing Sequences in Arrays


    The Concatenate program reads two character strings and appends them together
    with a " - " in the middle.


    The program begins by reading a string from the keyboard. The program does not
    use the normal cin >> szString for two reasons. First, the cin >> operation stops
    when any type of whitespace is encountered. Characters up to the first whitespace
    are read, the whitespace is tossed, and the remaining characters are left in the
    input buffer for the next cin >> statement. Thus, if we were to enter "the Dog",
    szString2 would be filled with "the" and the word "dog" would be left in the input
    buffer.


    The second reason is that the getline() allows the programmer to specify the size
    of the buffer. Call to getline(szString2, 128) will not read more than 128 bytes
    by how many characters are input.


    Instead, call to getline() inputs an entire line up to not including the newline
    at the end. We will review this function with file I/O functions in detail in
    Chapter 23.


    After reading the string into szString1], the program appends " - " onto the end
    by calling concatString(). It concatenates the second string by calling concatString()
    with szString2].


    The concatString() function accepts a target string, szTarget, and a source string,
    szSource. The function begins by scanning szTarget for the null character, which
    it stores in index. The function then enters a second loop in which it copies
    characters from the szSource intoTarget starting at the terminating null. The
    final statement in concatString() slaps a terminating null.


    An example output from the program appears as follows:


    ```

    Enter string #1:this is a string

    Enter string #2:THIS IS A STRING

    ```


    ```

    this is a string - THIS IS A STRING

    Press Enter to continue...

    ```


