    # Enumerating other options


    C++ provides a mechanism for defining constants of a separate, user-defined type.
    Suppose, for example, that I were writing a program that manipulated States of
    the Union. I could refer to the states by their name, such as "Texas" or North
    Dakota." In practice, this is not convenient since repetitive string comparisons
    are computationally intensive and subject to error.


    I could define a unique value for each state as follows:


    ```

    #define DC_OR_TERRITORY 0

    #define ALABAMA 1

    #define ALASKA 2

    #define ARKANSAS 3

    //...and so on...

    ```


    Not only does this avoid the clumsiness of comparing strings; it allows me to
    use the name of the state as an index into an array of properties such as:


    ```

    // increment the population of ALASKA (they need it)

    population[ALASKA]++;

    ```


    A statement as this is much easier to understand than the semantically identical
    population[2]+. This is a common thing to do that C++ allows the programmer to
    define what is an enumeration:


    ```

    enum STATE {DC_OR_TERRITORY,    // gets 0

    ALABAMA,                  // gets 1

    ALASKA,                   // gets 2

    ARKANSAS,

    // ...and so on..

    ```


    Each element of this enumeration is assigned a value starting at 0, DC_OR_TERRITORY
    is defined as 0, ALABAMA is defined as 1, and so on. You can override this incremental
    sequencing by using an assign statement as follows:


    ```

    enum STATE {DC,

    TERRITORIES = 0,

    ALABAMA,

    ALASKA,

    //...and so on..

    ```'
