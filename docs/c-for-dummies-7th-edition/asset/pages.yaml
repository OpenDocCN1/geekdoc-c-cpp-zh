  md: '# Naming the current object


    How does the member function know what the current object is? It''s not magic
    — the address of the object is passed to the member function as an implicit and
    hidden first argument. In other words, the following conversion is at taking place:


    ```

    s.addCourse(3, 2.5)

    ```


    is like


    ```

    Student::addCourse(&s, 3, 2, 5)

    ```


    (Note that you can''t actually use the explicit syntax, this is just the C++ sees.)

    Inside the function, this implicit pointer to the current object has a name, in
    case you need to refer to it. It is called this, as in "Which object? This object."
    Get the type of this is always a pointer to an object of the appropriate class.

    Anytime member function refers to another member of the same class without providing
    an object explicitly, C++ assumes that the programmer meant this. You can also
    refer to this explicitly, if you like. I could have written Student:addCourse()
    as follows:


    ```

    double Student::addCourse(int hours, double grade)

    {

    double weightedGPA;

    weightedGPA = this->semesterHours * this->gpa;


    // add in the new course

    this->semesterHours += hours;

    weightedGPA += hours * grade;

    this->gpa = weightedGPA / this->semesterHours;

    return this->gpa;

    }

    ```


    The effect is the same whether you include this, as in the preceding example,
    or leave it implicit, as you did before.


