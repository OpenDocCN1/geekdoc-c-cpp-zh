  md: "# Chapter 14: Protecting Members: Do Not Disturb\n\n# Using a class with a\
    \ limited interface\n\nA class provides a limited interface. To use a class, you\
    \ need to know only its public members as well as what they do and their arguments.\
    \ This can drastically reduce the number of things you need to master and remember\
    \ to use the class.\n\nAs conditions change or as bugs are found, you want to\
    \ be able to change the internal workings of a class. Changes to those details\
    \ are less likely to require changes in the external application code if you can\
    \ hide the internal workings of the class.\n\nA second, perhaps more important,\
    \ reason lies in the ability of humans (I can't speak for dogs and cats) to keep\
    \ a large number of things in their minds at any given instant. Using a strictly\
    \ defined class interface allows the programmer to forget the details that go\
    \ behind it. Likewise, a programmer building the class need not concentrate to\
    \ quite the same degree on exactly how each of the functions is being used.\n\n\
    # Giving Non-member Functions Access to Protected Members\n\nOccasionally, you\
    \ want a non-member function to have access to the protected members of a class.\
    \ You do so by declaring the function to be a friend of the class by the keyword\
    \ *friend*.\n\nThe friend declaration appears in the class that contains the protected\
    \ member. The friend declaration is a prototype declaration in that it includes\
    \ the extended name and the return type. In the following, the function initialize()\
    \ can now access anything it wants in *Student:*\n\n```\nclass Student {\n   \
    \ friend void initialize(Student*);\n    public:\n        // same public members\
    \ as before...\n        int semesterHours; // hours earned toward graduation\n\
    \        double gpa;\n    protected:\n    // the following function is a friend\
    \ of Student\n    // so it can access the protected members\n    void initialize(Student\
    \ *pS) {\n        pS->gpa = 0; // this is now legal...\n        pS->semesterHours\
    \ = 0; // ...when it wasn't before\n    }\n```\n\nwww.it-ebooks.info"
