    # Stream Input/Output


    The classes ifstream and ostream defined in the include fstream are subclasses
    of istream and ostream designed to perform stream input and output to disk files.
    You can use the same extractors and inserters as ifstream and ostream objects
    that you''ve been using on cin and cout.


    The ifstream is actually an instantiation of the template class basic_istream<T>
    with T set to char. In Chapter 26. The basic_istream<T> template class is instantiated
    with other types as well to provide different types of input classes. For example,
    the wide stream file ifstream is based on the same basic_istream<T> with T set
    to wchar_t. The ostream is the same as basic_ostream<char>-.


    The classes ifstream and ostream provide constructors used to open a file for
    input and output, respectively:


    ```

    ifstream::ifstream(const char *pszFileName,

    ios_base::openmode mode = ios_base::in);

    ostream::ostream(const char *pszFileName,

    ios_base::openmode mode = ios_base::out|ios_base::trunc);

    ```'
