    +   - SQL is used almost universally in accessing relational databases.

    - SQL is not the subject of this book.


    This bullet is important because I have no intent of teaching you SQL just so
    you can follow the examples presented here. If you don''t know SQL, it''s sufficient
    to say that SQL is interpreted at runtime. Very often, C++ statements will send
    an SQL query to a separate database server and process and wait the server sends
    back. A typical SQL query within a C++ program might like the following:


    ```

    char* query = "SELECT * FROM transactions WHERE\naccountID=''123456789'';";

    results = submit(query);

    ```


    This code says SELECT all the fields FROM the transactions table WHERE the accountID
    (presumably one of the fields in the transaction table) is equal to 123456789
    (the user''s account). The "Submit" library function sends this query off to the
    database server. The database server would respond with all of the data it has
    on every transaction that the user has made on this account, which would get stored
    into the collection results. The program would iterate through results, probably
    displaying the transactions in a table with each separate row.


    The user probably doesn''t need that data. Maybe just those transactions between
    startDate and endDate, two variables that the program reads from the user''s query
    page. This more selective C++ program might contain a statement like the following:


    ```

    char* query = "SELECT * FROM transactions WHERE\naccountID=''123456789''\nAND
    date > ''<'' + startDate + ''\'' AND date < ''<'' +\nendDate + ''\'' + ''";\'';";

    ```


    The user enters 2013/10 for a startDate and 2013/11 for an endDate, the resulting
    query that sends to the database is the following:


    ```

    SELECT * FROM transactions WHERE accountID=''123456789''\ndate > ''2013/10/1''
    AND date < ''2013/11/1'';

    ```


    In other words, show all the transactions in the month of October 2013. That makes
    sense. What''s the problem?


    The problem arises if the program accepts whatever the user enters as start and
    end dates and plugs them into the query. It doesn''t do any checking to make sure
    that the user is entering a date and not a data. This program is far too trusting.'
