  md: '# Accessing the Members of a Class


    The following syntax is used to access the property of a particular object:


    ```

    // Create a savings account object

    SavingsAccount mySave;

    mySave.accountNumber = 12346;

    mySave.balance = 0.0;


    // Input a second savings account from the keyboard

    cout << "Input your account number and balance " << endl;

    SavingsAccount urSave;

    cin >> urSave.accountNumber;

    cin >> urSave.balance;

    ```


    This code declares two objects of class SavingsAccount, mySave and urSave. The
    snippet initializes mySave by assigning a value to the account number and 0 to
    the balance (as usual for my savings account). It then creates a second object
    of the same class. The snippet reads the account number and balance from the keyboard.


    An important point to note in this snippet is that mySave and urSave are separate,
    independent objects. Manipulating the members of one has no effect on the members
    of the other (lucky for urSave).


    In addition, the name of the member without an associated object makes no sense.
    I cannot say either of the following:


    ```

    balance = 0.0; // illegal: no object

    SavingsAccount.balance = 0.0; // class but still no object

    ```


    Every account has its own unique account number and maintains a separate balance.
    (There may be properties that are shared by all savings accounts — we''ll get
    to those in Chapter 18 — but account and balance don''t happen to be among them.)


    # Activating Our Objects


    We use classes to simulate real-world objects. The Savings class tries to represent
    a savings account. This allows you to think in terms of objects rather than simply
    lines of code. The closer C++ objects are to modeling the real world, the easier
    it is to deal with them in programs. This sounds simple enough. However, the Savings
    class doesn''t do a very good job of simulating a savings account.'
