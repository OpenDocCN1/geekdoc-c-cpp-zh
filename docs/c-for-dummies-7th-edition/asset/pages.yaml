  md: "# Chapter 16: Making Constructive Arguments\n\nHere the constructor for Student\
    \ assigns a student ID. The constructor for Tutor records the ID of the student\
    \ to help. The program declares a student randy and then assigns that student\
    \ janet.\n\nThe problem is that the program makes the implicit assumption that\
    \ randy is constructed before jane. Suppose it were the other way around. Then\
    \ jane would be constructed with a block of memory that had not been turned into\
    \ a Student object and, therefore, had garbage for a student.\n\nThe preceding\
    \ example is not too difficult to figure out and more than a little contrived.\
    \ Nevertheless, problems deriving from global objects being constructed in no\
    \ particular order appear in subtle ways. To avoid this problem, don't allow the\
    \ constructor for one global object to refer to the contents of another global\
    \ object.\n\n![](img/b52206ee80ddcd0d5f11a03376f21b9d_258_0.png)\n\n# Members\
    \ construct in the order in which they are declared\n\nMembers of a class are\
    \ constructed according to the order in which they're declared within the class.\
    \ This isn't quite as obvious as it may sound. Consider the following example:\n\
    \n```\nclass Student {\npublic:\n    Student (int id, int age) : nAge(age), nID(id){\n\
    \    const int nID;\n    const int nAge;\n    double dAverage = 0.0;\n}\n```\n\
    \nIn this example, nld is constructed before nAge, even though nld appears second\
    \ in the constructor's initialization list because it appears nAge in the class\
    \ definition. The data member dAverage is constructed last for the same reason.\
    \ The only time you might detect a difference in the construction order is when\
    \ both data members are an instance of a class that has a constructor that has\
    \ some mutual side effect.\n\n# Destructors destruct in the reverse order of the\
    \ constructors\n\nFinally, no matter what order the constructors kick off, you\
    \ can be assured that the destructors are invoked in the reverse order. (It's\
    \ nice to know that at least one rule in C++ has no ifs, ands, or buts.)"
