  md: "# Chapter 16: Making Constructive Arguments\n\n```\ncout << \"Function fn passed\
    \ a value of \" << i << endl;\nstatic DoNothing dn(i);\n}\n```\n\n```\nint main(int\
    \ argcs, char* pArgs[]) {\n  fn(10);\n  fn(20);\n  cout << \"Press Enter to continue...\"\
    \ << endl;\n  cin.ignore(10, '\\n');\n  cin.get();\n  return 0;\n}\n```\n\nThis\
    \ program generates the following results:\n\n```\nFunction fn passed a value\
    \ of 10\nDoNothing constructed with a value of 10\nFunction fn passed a value\
    \ of 20\nPress Enter to continue...\nDoNothing object destroyed\n```\n\nNotice\
    \ the message from the function fn() appears twice, but the message for DoNothing\
    \ appears only the first time fn() is called. This indicates that the object is\
    \ constructed the first time that fn() is called but not thereafter. Also notice\
    \ that the destructor is not invoked until the program returns from main() as\
    \ part of the program shutdown process.\n\n# All global objects constructed before\
    \ main ()\n\nAll global variables go into scope as soon as the program starts.\
    \ Thus, all global objects are constructed before control is passed to main().\n\
    \nInitializing global variables can cause real debugging headaches. Debuggers\
    \ try to execute to main() as soon as the program is loaded and hand over to the\
    \ user. This can be a problem because the constructor for all global objects has\
    \ already been executed by the time you have control of them. If one of these\
    \ constructors has a fatal bug, you never get a chance to find the problem. In\
    \ this case, the program appears to die before it starts!\n\nThe best way I found\
    \ to detect this type of problem is to set a breakpoint in every constructor that\
    \ you even remotely suspect as well as the state in main(). You will hit a breakpoint\
    \ for each global object declared as soon as you start the program. Press Continue\
    \ after each breakpoint until the program crashes — now you know that you pressed\
    \ Once too often.\n\n![](img/b52206ee80ddcd0d5f11a03376f21b9d_256_0.png)\n\n![](img/b52206ee80ddcd0d5f11a03376f21b9d_256_1.png)\n\
    \nwww.it-ebooks.info"
