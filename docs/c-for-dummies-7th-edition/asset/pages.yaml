  md: "# 262 Part III: Introduction to Classes\n\nIt's easy enough to store this type\
    \ of information in a common, ordinary, garden-variety global variable. For example,\
    \ you could use a lowly int variable to keep track of the number of Student objects.\
    \ The problem with this solution, however, that global variables are outside the\
    \ class. It's like putting the voltage regulator for my microwave outside the\
    \ enclosure. Sure, I could do it, and it would work perfectly — the only problem\
    \ is that I wouldn't be too happy if my dog got the wires and I had to peel him\
    \ off the ceiling (the dog would be thrilled about it, either).\n\nIf a class\
    \ is going to be held responsible for its own state, objects such as global variables\
    \ must be brought inside the class, just as the voltage regulator must be inside\
    \ the microwave lid, away from prying paws. This is the idea behind static members.\n\
    \nYou may have static members referred to as class members; this is because all\
    \ objects in the class share them. By comparison, normal members are referred\
    \ to as instance members, or object members, because each object receives its\
    \ own copy of these members.\n\n![](img/b52206ee80ddcd0d5f11a03376f21b9d_277_0.png)\n\
    \n# Using static members\n\nA static data member is one that has been declared\
    \ with the static storage class, as shown here:\n\n```\nclass Student {\npublic:\n\
    \  Student(char *pName = \"no name\") : name(pName)\n{\n    noOfStudents++;\n\
    \  }\n  ~Student() { noOfStudents--; }\n\n  static int noOfStudents;\n  string\
    \ name;\n\n  Student s1;\n  Student s2;\n}\n```\n\nThe data member noOfStudents\
    \ is part of the class Student but is not part of either s1 or s2. That is, for\
    \ every object of class Student, there is a separate name, but there is only one\
    \ noOfStudents, which all Students must share."
  merge: -1
