    # # Okay, how about not #defining things?


    The times unexpected results from the preprocessor have created heartburn for
    the fathers (and mothers) of C++ almost from the beginning. C++ has included features
    over the years to make most uses of #define unnecessary.


    For example, C++ defines the inline function to replace the macro. This looks
    just like any other function declaration with the addition of the keyword inline
    to the tacked:


    ```

    inline int SQUARE(int x) { return x * x; }

    ```


    This inline function looks much like the previous macro definition for SQUARE()
    (I have written this definition on one to highlight the similarities). However,
    an inline function is processed by the C++ compiler rather than the preprocessor.
    This definition of SQUARE() does not suffer from any of the strange effects noted
    previously.


    ![](img/b52206ee80ddcd0d5f11a03376f21b9d_175_0.png)


    The inline keyword is supposed to suggest to the compiler that it "expand the
    inline function" rather than generate a call to some code somewhere for the operation.
    This was to satisfy the speed needs, and to avoid the overhead of performing a
    function call compared to a macro definition that generates no call. The best
    that can be said is that inline functions may be expanded in place, but may not.
    There''s no way to be sure without performing detailed timing analysis or examining
    the machine code by the compiler.


    ![](img/b52206ee80ddcd0d5f11a03376f21b9d_175_1.png)


    C++ allows programmers to use a declared const to take the place of a #define
    constant so long as the value of the constant is spelled out at compile:


    ```

    const int MAX_NAME_LENGTH = 512;

    int szName[MAX_NAME_LENGTH];

    ```


    ![](img/b52206ee80ddcd0d5f11a03376f21b9d_175_2.png)


    The ''11 standard goes so far as to allow you to declare a function to be constexpr


    ```

    constexpr int square(int n1, int n2)

    {return n1 * n1 + n2 * n2;};

    ```


    This makes a declaration like the following legal:


    ```

    int matrix[square(5)];

    ```


    However, ''11 puts a lot of significant restrictions on what you can go into a
    const expression. For example, such a function is pretty much limited to a single
    line.'
