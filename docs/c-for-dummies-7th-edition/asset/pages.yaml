    \ of list\nvoid add() {\n    this->pNext = pHead;\n    pHead = this;\n}\n\n//\
    \ access methods\nstatic NameDataSet* first() { return pHead; }\nstatic NameDataSet*\
    \ next() { return pNext; }\nconst string& name() { return sName; }\n\nprotected:\n\
    \    string sName;\n\n    // the link to the first and next member of list\n \
    \   static NameDataSet* pHead;\n    NameDataSet* pNext;\n    };\n\n    // allocate\
    \ space for the head pointer\nNameDataSet* NameDataSet::Head = nullptr;\n```\n\
    \nHere you can see that the pNext pointer to the beginning of the list has been\
    \ converted into a static data member because it applies to the entire class.\
    \ In addition, pNext has been made a data member and access methods have been\
    \ provided to give other programs access to the now protected members of the class.\n\
    \nThe add() method adds the current object to the list by first setting its pNext\
    \ pointer to the beginning of the list. The next statement causes the head pointer\
    \ to point to the current object via the assignment pHead = this."
