  md: '# Typedef


    The typedef keyword allows the programmer to create a shorthand name for a declaration.
    The careful application of typedef can make the resulting program easier to read.
    (Note that typedef is not actually a preprocessor command, but it''s largely associated
    with include files and the preprocessor.)


    ```

    typedef int* IntPtr;

    typef const IntPtr IntConstPtr;


    int i;

    *const ptr1 = &i;

    IntConstPtr ptr2 = ptr1; // ptr1 and ptr2 are the same type

    ```


    The two declarations in this snippet give a new name to existing types. Thus,
    the second declaration declares IntConstPtr to be another name for int const*.
    When this new type is used in the declaration of ptr2, it has the same effect
    as the more complicated declaration of ptr1.


    Although typedef does not introduce any new capability, it can make complicated
    declarations a lot easier to read.'
