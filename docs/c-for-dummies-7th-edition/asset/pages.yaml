  md: '# Chapter 11: Examining Object-Oriented Programming


    # Preparing object-oriented nachos


    In an object-oriented approach to making nachos, I would first identify the types
    of objects in the problem: chips, beans, cheese, and an oven. Then I would begin
    the task of modeling these objects in software, without regard to the details
    of how they will be used in the final program.


    While I am doing this, I''m said to be working (and thinking) at the level of
    the basic objects. I need to think about making a useful oven, but I don''t have
    to think about the logical process of making nachos yet. After all, the microwave
    designers didn''t think about the specific problem of making a snack. Rather,
    they set about the problem of designing and building a useful microwave.


    After the objects I have been successfully coded and tested, I can ratchet up
    to the next level of abstraction. I can start thinking about the nachos-level,
    rather than the microwave-level. At this point, I can pretty translate my son''s
    instructions directly into C++ code.


    # Classifying Microwave Ovens


    Critical to the concept of abstraction is that of classification. If I were to
    ask my son, “What’s a microwave?” he would probably say, “It’s an oven that ...”
    If I asked, “What’s an oven?” he might reply, “It’s a kitchen appliance that ...”
    (If I asked, “What’s a kitchen appliance?” he would probably say, “Why are you
    asking so stupid questions?”)


    The answers my son gave to my questions from his understanding of our particular
    microwave as an example of things called micro-wave ovens. In addition, my son
    sees microwaves as just a special type of oven, which itself is just a special
    type of kitchen appliance.


    In object-oriented computer, the microwave in my kitchen is an instance of the
    class microwave. The microwave is a subclass of the class oven, and the oven is
    a subclass of the class kitchen appliances. We say that microwaves inherit their
    cooking properties from oven.


    ![](img/b52206ee80ddcd0d5f11a03376f21b9d_186_0.png)


    Humans classify. Everything about our world is ordered in taxonomies. We do this
    to reduce the number of things we have to remember. Take, for example, the first
    time you saw a hybrid car. The advertisement probably called the hybrid “unique,
    the likes of which have never been seen.” But you and I know that just isn''t
    so. I like hybrids and I will grant you that they have a lot of differences under
    the hood, but hey, a hybrid is still a car. As such,


