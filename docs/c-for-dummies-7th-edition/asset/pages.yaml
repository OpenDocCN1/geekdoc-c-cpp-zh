  md: "# Chapter 13: Point and Stare at Objects\n\n# Calling a function with an object\
    \ value\n\nAs you, C++ passes arguments to functions by reference when the argument\
    \ type is flagged with the & property (see Chapter 8). However, by default, C++\
    \ passes arguments to functions by value. (You can check Chapter 6 on this, if\
    \ you wish.)\n\nComplex, user-defined classes are passed the same as simple int\
    \ values, as shown in the following PassObjVal program:\n\n```\n// PassObjVal\
    \ attempts to change the value of an object\n// in a function fail when the object\
    \ is\n// passed by value\n#include <cdef>\n#include <cstdlib>\n#include <iostream>\n\
    using namespace std;\nclass Student {\npublic:\n    int semesterHours;\n    double\
    \ gpa;\n}\nvoid someFn(Student copyS) {\n    copyS.semesterHours = 10;\n    copyS.gpa\
    \ = 3.0;\n    cout << \"The value of copyS.gpa \" <<copyS.gpa << endl;\n}\nint\
    \ main(int argc, char* pArgs[]) {\n    Student s;\n    s.gpa = 0.0;\n\n// display\
    \ the value of s.gpa before calling someFn()\n    cout << \"The value of s.gpa\
    \ \" << s.gpa << endl;\n\n// pass the address of the existing object\n    cout\
    \ << \"Calling someFn(Student)\" << endl;\n    someFn(s);\n    cout << \"Returned\
    \ from someFn(Student)\" << endl;\n\n// the value of s.gpa remains 0\n    cout\
    \ << \"The value of s.gpa \" << s.gpa << endl;\n```"
