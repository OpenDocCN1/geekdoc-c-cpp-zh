  md: '# Chapter 1: Writing Your First C++ Program


    Although C++ may ignore whitespace, it doesn''t ignore case. In fact, C++ is case
    sensitive to the point of obsession. The variable fullspeed and the variable Fullspeed
    have nothing to do with each other. The command int is completely understandable,
    C++ has no idea what INT means. See what I mean about fast stupid compilers?


    # Variable declarations


    The line int celsius: is a declaration statement. A declaration defines a variable.
    A variable is a "holding tank" for a value of some type. A variable contains a
    value, such as a number or a character.


    The term variable stems from algebra formulas of the following type:


    ```

    x = 10

    y = 3 * x

    ```


    In the second expression, y is set equal to 3 times x, but what is x? The variable_x
    acts as a holding tank for a variable. In this case, the value of x is 10, but
    we could have just as well set the value of x to 20 or 30 or -1. The second formula
    makes sense no matter what the value of x is.


    In algebra, you''re allowed but not required to bind x with a statement such as
    x = 10. In C++, the programmer must define the variable x before she can use it.


    In C++, a variable has a type and a name. The variable defined on line 11 is celsius
    and declared to hold an integer. (If they couldn''t just say integer instead of
    int, I''ll never know. It''s just one of those things you live with.)


    > The name of a variable has no particular significance to C++. A variable must
    begin with the letters A through Z, the letters a z, or an underscore (_). All
    subsequent characters must be a letter, a digit 0 through 9, or an underscore.
    Variable names can be as long as you want to make them.


    > It''s convention that variable names begin with a lowercase letter. Each new
    word within variable begins with a capital letter, as in myVariable.


    > Try to make variable names short but descriptive. Avoid names such as x because
    x has no particular meaning. A variable name such as lengthLineSegment is much
    more descriptive.


    ![](img/b52206ee80ddcd0d5f11a03376f21b9d_44_0.png)


    ![](img/b52206ee80ddcd0d5f11a03376f21b9d_44_1.png)'
