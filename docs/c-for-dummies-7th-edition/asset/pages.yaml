  md: '# 304 Part V: Security


    In fact, C++ gives each operator a function-style name. The functional name of
    an operator is the operator symbol preceded by the keyword operator and followed
    by the appropriate argument types. For example, the + operator that adds an int
    to an int generating an int is called operator+(int, int).


    Any existing operator can be defined for a user-class. Thus, I could create a
    Complex*(const Complex&, const Complex&) that would allow me to multiply two objects
    of type Complex. The new operator may have the same semantics as the operator
    it overloads, but it doesn''t have to. The following rules apply when overloading
    operators:


    +   The programmer cannot overload the . (dot), :: (colon), *, sizeof and ? (ternary)
    operators.

    The programmer cannot invent a new operator. For example, you cannot invent the
    operation x $ y.

    The syntax of an operator cannot be changed. Thus, you cannot define an operator
    % because % is already defined as a binary operator.

    The operator precedence cannot change. A program cannot force operator+ to be
    evaluated before operator*.

    The operators cannot be redefined when applied to intrinsic types — you cannot
    change the meaning of 1 + 2. Existing operators can be overloaded only for newly
    defined types.


    Overloading operators is one of those things that seems like a much better idea
    than it really is. In my experience, operator overloading introduces more problems
    than it solves, with three notable exceptions that are the subject of this chapter.


    # Inserting a New Operator


    The insertion and extraction operators << and >> are nothing more than the left
    and right shift operators overloaded for a set of input/output classes. These
    definitions are found in the file iostream (which is why every program includes
    that file). Thus, cout << "some string" becomes operator<<(cout, "some string").
    Our friends cout and cin are predefined objects that are tied to the console and
    keyboard, respectively. I discuss this in detail in Chapter 23.


    ![](img/b52206ee80ddcd0d5f11a03376f21b9d_319_0.png)'
