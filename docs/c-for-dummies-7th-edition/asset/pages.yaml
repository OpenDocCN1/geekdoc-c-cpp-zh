  md: "A single function can be declared friend of two classes at the same time. Although\
    \ this can be convenient, it tends to bind the two classes together. This binding\
    \ of classes is normally considered bad because it makes one class dependent on\
    \ the other. If the two classes belong together, however's not all bad, as shown\
    \ here:\n\n```\nclass Student; // forward declaration\nclass Teacher\n{\n    friend\
    \ void registration(Teacher& t, Student& s);\n    public:\n        void assignGrades();\n\
    \    protected:\n        int nStudents;\n        Student *pList[100];\n};\nclass\
    \ Student\n{\n    friend void registration(Teacher& t, Student& s);\n    public:\n\
    \        // same public members as before...\n    protected:\n        Teacher\
    \ *pT;\n        int semesterHours; // hours earned toward graduation\n       \
    \ double gpa;\n}\nvoid registration(Teacher& t, Student& s)\n{\n    // initialize\
    \ the Student object\n    s.gpa = 0;\n\n    // if there's room...\n    if (t.nStudents\
    \ < 100)\n    {\n        // ...add it onto the end of the list\n        t.pList[t.nStudents]\
    \ = &s;\n        t.nStudents++;\n    }\n}\n```\n\nIn this example, the registration()\
    \ function can reach into both the Student and Teacher classes to tie them together\
    \ at registration time, without being a member of either one.\n\nThe first line\
    \ in the example declares the class Student, but none of its members. This is\
    \ called a forward declaration and just defines the name of the class that other\
    \ classes, such as Teacher, can define a pointer to it. Forward declarations are\
    \ necessary when two classes refer to each other.\n\n![](img/b52206ee80ddcd0d5f11a03376f21b9d_227_0.png)"
