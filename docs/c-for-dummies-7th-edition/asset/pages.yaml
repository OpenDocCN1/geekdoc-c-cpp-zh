  md: "# 104 Part II: Becoming a Functional C++ Programmer\n\n# Variable Storage Types\n\
    \nVariables are assigned a storage type depending on where and how they are defined\
    \ in the function, as shown in the following example:\n\n```\nint globalVariable;\n\
    void fn() {\n    int localVariable;\n    static staticVariable = 1;\n}\n```\n\n\
    Variables declared within a function like localVariable are said to be local.\
    \ The variable localVariable doesn't exist until execution passes through its\
    \ declaration within the function fn(). localVariable ceases to exist when the\
    \ function returns. Upon return, whatever value is stored in localVariable is\
    \ lost. In addition, only fn() has access to localVariable — other functions cannot\
    \ reach into the function to access it.\n\nBy comparison, the variable globalVariable\
    \ is created when the program begins execution and exists as long as the program\
    \ is running. All functions have access to globalVariable all the time.\n\nThe\
    \ keyword static can be used to create a sort of mishling — something between\
    \ global and local variable. The static staticVariable is created when execution\
    \ reaches the declaration the first time that fn() is called, just like a local\
    \ variable. The static variable is not destroyed when program execution returns\
    \ from the function, however, it retains its value from one call to the next.\
    \ If fn() assigns a value to staticVariable once, it'll still be there the next\
    \ time fn() is called. The initialization portion of the declaration is ignored\
    \ every subsequent time execution passes through."
