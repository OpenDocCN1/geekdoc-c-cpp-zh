  md: '# 260 Part III: Introduction to Classes


    ```

    cout << "Press Enter to continue..." << endl;

    cin.ignore(10, ''\n'');

    cin.get();

    return 0;

    ```


    Notice how the move constructor assigns the pName pointer from the source

    object p and then zeroes out pointer so that the destructor does not

    return the memory when the temporary is destroyed. This is much more

    efficient than allocating yet another string object off the heap and copying

    the contents of p.pName to this new string.


    The output from this program appears as follows:


    ```

    Entering fn1

    Constructing Scruffy

    Copying Scruffy

    Entertering fn2

    Moving Copy of null object

    Destructing null object

    Press Enter to continue...


    Destructing Copy of Scruffy

    ```


    In this case, fn1() creates a Person object. It then copies this object in the

    call to fn2() using the copy constructor. The function fn2() does nothing

    more than return a copy of this object to fn1(); however, this copy is just a

    temporary object that fn1() returns to main(). Rather than use the copy-

    struct to create a "Copy of Scruffy," C++''11 invokes the move con-

    structor to take the contents of the temporary object. When this temporary

    is subsequently destroyed, it is a "null object" because its pName has been

    taken away and reassigned.


    You don''t have to create a move constructor. The program would have worked

    just fine, albeit a hair slower, with just the copy constructor. Move construc-

    tors should be considered an advanced topic. You will see examples that are

    less less contrived in Chapter 22.


    ![](img/b52206ee80ddcd0d5f11a03376f21b9d_275_0.png)'
