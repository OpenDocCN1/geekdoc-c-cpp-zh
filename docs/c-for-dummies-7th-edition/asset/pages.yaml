  md: "# 156 Part II: Becoming a Functional C++ Programmer\n\n# Playing in your own\
    \ name sandbox\n\n(This is truly technical, feel free to skip this sidebar and\
    \ come back to later.) The authors of the C++ standard worry a lot about name\
    \ collisions. For example, besides my mathematical log(x) that returns the logarithm\
    \ of x, suppose in another context I had written a function log(x) that writes\
    \ status to a system log. Clearly, two different functions with the same arguments\
    \ can't coexist in one program. This is known as a name collision.\n\nTo avoid\
    \ this, C++ allows the programmer to bundle declarations into a namespace using\
