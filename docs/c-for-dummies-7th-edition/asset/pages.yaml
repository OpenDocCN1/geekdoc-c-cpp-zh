  md: '# Chapter 29: Ten Ways to Avoid Bugs to Your Program 413


    # Single-Step Path at Least Once


    It may seem an obvious statement, but I''ll say it anyway: As a programmer, it''s
    important for you to understand what your program is doing. Nothing gives you
    a better feel for what''s going on under the hood than single-stepping the program
    with a good debugger. (Code::Blocks contains an integrated debugger.)


    Beyond that, as you write a program, you sometimes need raw material to figure
    out some bizarre behavior. Nothing gives you that material better than single-stepping
    new functions as they come into service.


    Finally, when a function is finished and ready to be added to the program, every
    logical path needs to be traveled at least once. Bugs are easier to find when
    the function is examined by itself rather than after it has been thrown into the
    pot with the rest of the functions — and your attention has gone on to new programming
    challenges.


    # Avoid Overloading Operators


    Other than using the assignment operator operator=(), you should hold off overloading
    operators until you feel comfortable with C++. Overloading operators to add to
    your debugging woes is almost never necessary and can significantly get the same
    effect by defining and using proper public member functions instead.


    After you''ve been C-plussing for a few months, feel free to return and start
    overloading operators to your heart''s content.


    # Manage the Heap Systematically


    As a general rule, programmers should allocate and release heap memory at the
    same "level". If a function MyClass::create() allocates a block of heap memory
    and returns it to the caller, there should be a member function MyClass::release()
    that returns the memory to the heap. Specifically, MyClass::create() should not
    require the parent function to release the memory. This certainly doesn''t avoid
    all memory problems — the parent function may forget to call MyClass::release()
    — but it reduces the possibility somewhat.'
