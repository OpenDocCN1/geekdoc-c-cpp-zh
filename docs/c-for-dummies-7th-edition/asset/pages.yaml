  md: '# Part I: Getting Started with C++ Programming


    # Generating output


    The lines beginning with cout and cin are known as input/output statements, often
    contracted to I/O statements. (Like all engineers, programmers love contractions
    and acronyms.)


    The first I/O statement says “Output the phrase Enter the temperature in Celsius
    to cout” (pronounced “see-out”), cout is the name of the standard C++ output device.
    In this case, the standard C++ output device is your monitor.


    The next line is exactly the opposite. It says, in effect, “Extract a value from
    the C++ input device and store it in the integer variable celsius.” C++ input
    device is normally the keyboard. What we have here is the C++ analog to the algebra
    formula x*=10 just mentioned. For the remainder of the program, the value of celsius
    is whatever the user enters there.


    # Calculating Expressions


    But all the most basic programs perform calculations of one type or another. In
    C++, an expression is a statement that performs a calculation. Said another way,
    an expression is a statement that has a value. An operator is a command that generates
    a value.


    For example, in the Conversion example program — specifically, in the two lines
    marked as a calculation expression — the program declares a variable and assigns
    it the value resulting from a calculation. This particular command calculates
    the difference of 21 and 32; the operator is the minus sign (−), and the expression
    is 21–32.


    # Storing the results of an expression


    The spoken language can be very ambiguous. The terms equals is one of those ambiguities.
    The word equals mean that two things have the same value as “a dollar equals one
    hundred cents.” Equals can also imply assignment, in math when we say “y equals
    3 times x.”


    To avoid ambiguity, C++ programmers call = assignment operator, which says (in
    effect), “Store the results of the expression to the right of the assignment sign
    in the variable to the left.” Programmers say that factor is assigned the value
    212 minus 32.” For short, you can say “factor gets 212 minus 32.”'
