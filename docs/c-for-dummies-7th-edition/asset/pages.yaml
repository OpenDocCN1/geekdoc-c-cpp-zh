  md: '# 92 Part II: Becoming a Functional C++ Programmer


    # Defining our first function


    The statement displayExplanation(void) is known as a function declaration — it
    introduces the function definition that immediately follows. A declaration always
    starts with the name of the function by the type of value the function returns
    and followed by a pair of open and closed parentheses containing any arguments
    to the function.


    The return type void that displayExplanation() does not return a value. The void
    within the argument list means that it doesn''t take any arguments either. (We''ll
    get to what matters very soon.) The body of the function is contained in the braces
    immediately following the function declaration.


    Function names are normally written as a multword description with all the words
    marked together. Start function names with lowercase but capitalize all intermediate
    words. Function names almost always appear followed by an open and close parenthesis
    pair.


    ![](img/b52206ee80ddcd0d5f11a03376f21b9d_107_0.png)


    A function doesn''t do anything until it is invoked. Our program starts executing
    the first line in main() just like always. The first non-comment line in main
    is the call to displayExplanation():


    ```

    displayExplanation();

    ```


    This passes program control to the first line in the displayExplanation() function.
    The computer continues to execute until it reaches the return statement at the
    end of displayExplanation() or until control reaches the closed brace at the end
    of the function.


    # Defining the sumSequence () function


    The declaration int sumSequence(void) begins the definition of the sumSequence()
    function. This declaration says that the function does not expect any arguments
    but returns a value of int to the caller. The body of this function contains the
    same code previously found in the loop of the NestedDemo example.


    The sumSequence() function also contains a return statement to exit the program.
    This return is not optional since it contains the value to be returned, accumulator.
    The type of value returned must match the type of the function in the declaration,
    in this case int.


    # Calling back the function sumSequence ()


    Return back to the main() function in FunctionDemo again. This section of code
    looks similar to the outer loop in NestedDemo.'
