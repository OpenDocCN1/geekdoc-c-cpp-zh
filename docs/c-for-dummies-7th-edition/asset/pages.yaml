    If virtual inheritance solves this problem so nicely, isn''t it the norm? The
    first reason is that virtually inherited base classes are handled internally much
    differently than normally inherited base classes, and these differences involve
    extra overhead. The second reason is that sometimes you want two copies of the
    base class.


    As an example of the latter, consider a *TeacherAssistant* who is both a *Student*
    and a *Teacher*, both of which are subclasses of Academician. If the university
    gives teaching assistants two IDs—a student ID and a separate teacher ID—the class
    *TeacherAssistant* will need to contain two copies of class Academician.


    # Constructing the Objects of Multiple Inheritance


    The rules for constructing objects need to be expanded to handle multiple inheritance.
    The constructors are invoked in the following order:


    +   1. First, the constructor for any virtual base classes is called in the order
    in which the classes are inherited.


    +   2. Then the constructor for all non-virtual base classes is called in the
    order in which the classes are inherited.'
