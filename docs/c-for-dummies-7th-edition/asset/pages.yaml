  md: "# Part I: Getting Started with C++ Programming\n\n# Looping while a condition\
    \ is true\n\nThe simplest form of looping statement is the while loop. Here's\
    \ what the while\nloop looks like:\n\n```\nwhile (condition)\n{\n    // repeatedly\
    \ executed as long as condition is true\n}\n```\n\nThe condition is tested. This\
    \ condition could be false if var > 10 or var1 == var2\nor any other exception\
    \ you might think of as it returns a value of\ntrue or false. If the condition\
    \ is true, the statements within the braces are\nexecuted. Upon encountering the\
    \ closed brace, C++ returns control to the\beginning, and the process starts over.\
    \ If the condition is false, control passes\nto the first statement after the\
    \ closed brace. The effect is that the C++ code\nwithin the braces is executed\
    \ repeatedly as long as the condition is true.\n(Kind of reminds me how I get\
    \ to walk around the yard with my dog until\ns... well, until we're done).\n\n\
    If the condition were the first time, what would make it false in the\nfuture?\
    \ Consider the following example program:\n\n```\n// WhileDemo    input a loop\
    \ count. Loop while\n//             outputting astr number of times.\n#include\
    \ <iostream>\n#include <cctype>\n#include <iostream>\nusing namespace std;\n\n\
    int main(int nnumberOfArgs, char* pszArgs[])\n{\n    // input the loop count\n\
    \    int nLoopCount;\n    cout << \"Enter loop count: \";\n    cin >> nLoopCount;\n\
    \n    // now loop that many times\n    while (nLoopCount > 0)\n    {\n       \
    \ nLoopCount = nLoopCount - 1;\n        cout << \"Only \" << nLoopCount << \"\
    \ loops to go\" << endl;\n    }\n}\n```"
