  md: '# 424 Part VI: The Part of the Tens


    # Why salt? It''s bad for the heart


    The salt value adds security to the process by making it difficult for a hacker
    to deduce the password, even if he intercepts the hashed value by salining the
    line. It does this in two ways:


    +   - One successful technique at guessing passwords is to construct a table of
    hashed passwords. This is known as a password dictionary.


    When hashed password comes over the line, the hacker looks up the hashed value
    in the dictionary—this is a very quick operation. If it is found, then the hacker
    knows the user''s password. However, this technique will not work, even if the
    user picks a common password, if a random salt value has been added.


    +   - A salt can make up passwords that are too short.


    For example, a hacker who knows what a user is and doesn''t use passwords with
    more than six characters has no trouble trying all possible six-letter combinations
    to


    reconstruct a password from its hash. A 6-letter password combined with a 30-letter
    hash cannot be calculated in advance. Lately, a random salt value will still generate
    two different users with the same password hash value.


    However, salts aren''t magic. The salt value is transmitted in the clear. If the
    user chooses a sufficiently short password (say, four characters) and the hacker
    knows this, the hacker can generate the hashes of all possible four-letter passwords
    combined with the salt string and break the user''s password.


    Remember that for a salt to be effective it needs to have three properties:


    +   - It must be generated separately for each user—using the same salt value
    over over doesn''t provide any security.


    +   - It must be sufficiently long (say 20 or 30 characters).


    +   - It must be random.


    When the user logs in, the application goes through the following steps to verify
    the user''s password:


    +   1. Uses the username to look up the salt values and the hashed password in
    the user table.


    +   2. Adds the salt string to the user''s password and calculates the secure
    hash.


    +   3. Compares this newly calculated value to the value stored in the table.
    If it matches the value stored in the table, then the user is authenticated.


    This algorithm has the advantage that if a hacker were to get hold of the password,
    it would still be difficult to create a password that matches one of the existing
    hashes.


    ![](img/b52206ee80ddcd0d5f11a03376f21b9d_439_0.png)


    It may be difficult but it''s not impossible to find a password that matches a
    given hash value, however—the MD5 algorithm, though, is particularly susceptible
    to this type of attack. If you suspect the password table has been compromised,
    you must invalidate all of the user accounts and people to securely register with
    the application.


    www.it-ebooks.info'
