  md: "# 176 Part III: Introduction to Classes\n\n# The Format of a Class\n\nA class\
    \ consists of the keyword class followed by a name and an open and closed brace.\
    \ A class used to describe a savings account including account number and balance\
    \ might appear as follows:\n\n```\nclass SavingsAccount {\n  public:\n    unsigned\
    \ accountNumber;\n    double balance;\n}\n```\n\nThe statement after the open\
