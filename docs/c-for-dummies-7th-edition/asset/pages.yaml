    called in the middle of a very time critical loop.


    Thus, the string or vector versions of getString() are the way to go for general
    use, but there may be conditions that justify the use of fixed-size buffers.


    There is no measurable difference in performance between the version of getString()
    that does not check for buffer overflow and the one that does. There is no justification
    for leaving yourself exposed to hanging by buffer overflow if you''re trying to
    save a few instructions off of the execution.


