  md: "# 256 Part III: Introduction to Classes\n\n# It’s a Long Way to Temporaries\n\
    \nPassing arguments by value to functions is the most obvious but not the only\
    \ example of the use of the copy constructor. C++ creates a copy of an object\
    \ under other conditions as well.\n\nConsider a function that returns an object\
    \ by value. In this case, C++ must create a copy using the copy constructor. This\
    \ situation is demonstrated in the following snippet:\n\n```\nStudent fn(); //\
    \ returns object by value\nint main(int argcs, char* pArgs[])\n{\n    Student\
    \ s;\n    s = fn(); // call to fn creates temporary\n    // how long does the\
    \ temporary returned by fn() last?\n    return 0;\n}\n```\n\nThe fn() returns\
    \ an object by value. Eventually, the returned object is copied to u, say, but\
    \ where does it reside until then?\n\nC++ creates a temporary object into which\
    \ it stuffs the returned object. \"Okay,\" you say. \"C++ creates the temporary,\
    \ but how does it know when to destroy it!\" Good question. In this example, it\
    \ doesn't make much difference because you're through with the copy constructor\
    \ copies it into s. But what if s is defined as a reference? It makes a big difference\
    \ how long temporaries live because refS exists for the entire function:\n\n```\n\
    int main(int argcs, char* pArgs[])\n{\n    Student& refS = fn();\n    // ...now\
    \ what?\n    return 0;\n}\n```\n\nTemporaries created by the compiler are valid\
    \ throughout the extended expression in which they were created and no further.\n\
    \nIn the following function, I mark the point at which the temporary is no longer\
    \ valid:\n\n```\nStudent fn1();\nint fn2(Student&);\nint main(int argcs, char*\
    \ pArgs[])\n{\n```"
