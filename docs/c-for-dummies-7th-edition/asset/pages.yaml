  md: '# Chapter 30: Ten Ways to Protect Your Programs from Hackers


    Once you''ve authenticated a user, your application should assign that user a
    role that specifies the types of things that he is allowed to do in the application.
    Consider a weekly status report application. A normal user should only be able
    to edit entries that he creates. He may or not be able to read other users'' entries.
    A person assigned the role of supervisor may be able to edit other users'' entries.
    Only the few users assigned the role of administrator should be able to edit the
    tables, register new users, or change the roles of other users.


    By keeping the number of administrators to a minimum, you reduce the number of
    vulnerabilities your application exposes. For example, if a hacker breaks into
    a normal user''s account, he can do little more than that user''s status information.
    But certainly not a disaster.


    And, finally, your application should keep statistics on user log-ins. You should
    consider deactivating the accounts of users that haven''t used the system in a
    long time. In addition, the application should automatically reset the system
    in attempts to log with the wrong password by either permanently, or at least
    temporarily, locking out the account. This will make it much difficult for a computer
    on the other end of a connection to run through thousands or millions of possible
    passwords attempting to brute-force guess.


    # Manage Remote Sessions


    You can make certain assumptions when all of your application runs on a single
    computer. For one thing, once the user has authenticated you don''t need to worry
    about him being transformed into a different person (unless your application is
    intended to run at Hogwarts Academy of Witchcraft and Wizardry). Applications
    that communicate with a remote server can prevent this assumption — a hacker who
    is listening on the line can wait until the user authenticates himself and hijack
    the session.


    What can the security-minded programmer do to avoid this situation? You don''t
    want to repeatedly ask the user for his password just to make sure that the connection
    hasn''t been hijacked. The alternative solution is to establish and maintain a
    session. You do this by having the server send the remote application session
    cookie once the user has successfully authenticated himself.


    ![](img/b52206ee80ddcd0d5f11a03376f21b9d_440_0.png)


    A cookie may include information such as a hash of the user''s password and the
    time that the session started. Throughout the session, the server periodically
    challenges the remote application for a copy of the cookie. As long'
  merge: -1
  pgno: 440
- img_proc: true
  md: '# 426 Part VI: The Part of Tens


    as the remote application presents a valid cookie, the server can be reasonably
    certain that the person on the other end of the connection is the same person
    who entered the correct password in the first place.


    If at any time the remote application cannot produce a cookie that matches the
    cookie provided to it at the beginning of the session, the server application
    automatically logs the user out and refuses to listen to the remote application
    until it can log in again with valid username and password. The connection between
    the server and the application is lost, the server invalidates the cookie, forcing
    the application to reauthenticate. When the user logs out, the session cookie
    is also invalidated.


    In this way we can be reasonably certain that some nefarious application hasn''t
    managed to hijack the user''s session. But what about the other direction? How
    does the application know whether it can trust the server? A way to solve this
    problem is for the remote application to generate a cookie back to the server
    that uniquely identifies it as a legitimate server.


    A second approach, which is much more secure, is to establish a secure session
    using a standard protocol like Secure Socket Layer (TLS) or Transport Layer Security
    (TLS). The details are well known beyond the scope of this book, these protocols
    allow the server and remote application to exchange passwords in a secure fashion.
    These passwords are then used to encrypt all communication between the two for
    the remainder of the session — without the password, the hacker can''t understand
    what the server is saying nor trick the server into accepting its output. Further,
    since the messages are encrypted with keys that are exchanged securely, a hacker
    can''t even understand what information is being exchanged between the server
    and the remote app if he happens to be listening on the line.


    # Obfuscate Your Code


    Code obfuscation is the act of making the executable as difficult for a hacker
    to understand as possible.


    To obfuscate means to make obscure or unclear.


    The logic is simple. The easier it is for a hacker to understand how your code
    works, the easier it will be for the hacker to figure out vulnerabilities.


    The single easiest step you can take is to make sure that only distribute a Release
    version of your program that does not include debug symbol information. When you
    first create the project file, be sure to select that both


