    \ to continue...\n```\n\nIf the user enters a negative loop count, the program\
    \ skips the loop entirely. That's because the condition is never true, so no control\
    \ enters the loop. In addition, if the user enters a large number, the program\
    \ loops for a long time before completing.\n\nA separate, less frequently version\
    \ of the while loop known as the do... while appears identical except the condition\
    \ is tested until the bottom of the loop:\n\n```\ndo {\n  //...the inside of the\
    \ loop\n} while (condition);\n```\n\nBecause the condition isn't tested until\
    \ the end, the body of the do... while is always executed at least once.\n\nThe\
    \ condition is checked only at the beginning of the while loop or at the end of\
    \ the do... while loop. Even if the condition ceases to be true at some time during\
    \ the execution of the loop, control does not exit the loop until the condition\
    \ is retested.\n\n![](img/b52206ee80ddcd0d5f11a03376f21b9d_88_0.png)"
