  md: "# 268 Part III: Introduction to Classes\n\n# # What Is this About Anyway?\n\
    \nHow does a non-static object method know what object it's referring to? In other\
    \ words, when I ask the Student object for its name, how does name() know which\
    \ sName to return?\n\nThe address of the current object is passed as an first\
    \ argument to every non-static method. When it is necessary to refer to this object,\
    \ C++ gives it the name this. this is a keyword in every object method \"the current\
    \ object.\" This is illustrated in the following code snippet:\n\n```\nclass SC\
    \ {\npublic:\n    void dyn(int a); // like SC::dyn(SC *this, int a)\n    static\
    \ void stat(int a); // like SC::stat(int a)\n}\nvoid fn(SC &s) {\n    s.dyn(10);\
    \ // -converts to-> SC::dyn(s, 10);\n    s.stat(10); // -converts to-> SC::stat(10)\n\
    ```\n\nThat is, function dyn() is invoked almost as though it were declared void\
    \ SC::dyn(*this, int a). The call to dyn() is converted by the compiler as shown,\
    \ with the address of s passed as the first argument. (You can actually write\
    \ call this way, but this is what the compiler is doing.)\n\nReferences to other\
    \ non-static members within SC::dyn() automatically use the argument as the pointer\
    \ to the current object. When SC::stat() is called, no object address was passed.\
    \ This, however, is why a static member function is not associated with any current\
    \ object.\n\nYou can see this explicitly in an object-oriented version of the\
    \ linked list program from Chapter 13; called LinkedListData. The entire program\
    \ is available with the online material at www.dummies.com/cplusplus/; the NameDataSet\
    \ class appears here:\n\n```\n// NameDataSet stores a person's name (these objects\n\
    // could easily store any other information\n// desired).\nclass NameDataSet {\n\
    public:\n    NameDataSet(string& refName)\n    : sName(refName), pNext(nullptr)\
    \ {}\n```\n\nwww.it-ebooks.info"
