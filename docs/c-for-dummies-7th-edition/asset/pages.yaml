  md: "# 242 Part III: Introduction to Classes\n\nRestart the program and repeat the\
    \ process, but stop on the constructor that caused the program to crash. You can\
    \ now single-step through the constructor until you find the problem. If you make\
    \ it all the way to the breakpoint in main(), the program did not crash while\
    \ constructing global objects.\n\n# Global objects construct\nin no particular\
    \ order\n\nFiguring out the order of construction of local objects is easy. An\
    \ order is implied by the flow of control. With globals, no such flow is available\
    \ to give order. All globals go into scope simultaneously — remember? Okay, you\
    \ argue, why can't the compiler start at the top of the file and work down the\
    \ list of global objects?\n\nThat would work for a single file (and I presume\
    \ that's what most programs do). Programs in the real world consist of several\
    \ files that are compiled separately and then linked. Because the compiler has\
    \ no control over the order in which these files are linked, it cannot affect\
    \ the order in which global objects are constructed from file to file.\n\nMost\
    \ of the time, the order of global construction is pretty homely stuff. Once in\
    \ a while, global variables generate bugs that are extremely difficult to track\
    \ down. (It happens often enough to make it worth mentioning in a book.)\n\nConsider\
    \ the following example:\n\n```\nclass Student\n    public:\n        Student (int\
    \ id) : studentID(id) {\n        const int studentID;\n    }\nclass Tutor\n  \
    \  public:\n        Tutor(Student& s) : tutoredID(s.studentID) {\n        int\
    \ tutoredID;\n    }\n\n// set up a student\n    Student randy(1234);\n\n// assign\
    \ that student a tutor\nTutor janet(randy);\n```"
  merge: -1
  pgno: 257
