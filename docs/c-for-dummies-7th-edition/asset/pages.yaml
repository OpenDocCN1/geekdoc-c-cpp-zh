    in hexadecimal, the same expression appears as follows:


    ```

    0110_2

    &

    0x3

    &

    0011_2

    0010_2

    ```


    In shorthand, we say that 0x6 & 0x3 equals 0x2 (pronounced "AND 3 equals 2")'
