    \ aren't getting\n    much better\n\n    return 0;\n}\n```\n\nWhen addCourse()\
    \ is invoked with the object s, all of the otherwise unqualified member references\
    \ in addCourse() refer to s as well. Thus, the reference to semesterHours and\
