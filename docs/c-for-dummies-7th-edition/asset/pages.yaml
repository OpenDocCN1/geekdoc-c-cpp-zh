    This sets n to 5 if nArg1 and nArg2 are equal and 0 otherwise.


    # Be careful performing logical operations on floating-point variables


    Round-off errors in floating-point computation can create havoc with logical operations.
    Consider the following example:


    ```

    float f1 = 10.0;

    float f2 = f1 / 3;

    bool b1 = (f1 == (f2 * 3.0)); // are these two equal?

    ```


    Even though it''s obvious to us that f1 is equal to f2 times 3, the resulting
    value of b1 is not necessarily true. A floating-point variable cannot hold an
    unlimited number of significant digits. F2 is not equal to the number we''d call
    "three-and-a-third," but rather to 3.333 . . . stopping after some number of decimal
    places.'
