    # Justifying pointer-based string manipulation


    The sometimes-cryptic nature of pointer-based manipulation of character strings
    might lead the reader to wonder, “Why?” That is, what advantage does the char*
    version have over the easier-to-read index version?


    The answer is partially (pre-)historic and partially human nature. When C, the
    progenitor to C++, compilers were very simplistic. Simple compilers could not
    perform the complicated optimizations that modern compilers can. As complicated
    as it might appear to the human reader, a statement such as *pszString— could
    be converted into an amazingly small number of machine-level instructions by a
    stupid compiler.


    Older computers were never as fast as today’s. In the early days of C, saving
    a few computer instructions was a big deal. This gave C a big advantage over other
    languages of the day, notably Fortran, which did not offer arithmetic.


    In addition to the efficiency factor, programmers like to generate clever gram
    statements. After C++ programmers learn how to write compact and efficient statements,
    there is no getting back to accessing arrays with indices.


    Do not generate complex C++ expressions to create a more efficient program. There
    is no obvious relationship between the number of C++ statements and the number
    of machine instructions generated.'
