  md: '# Chapter 23: Using Stream I/O


    The destructor for the file stream classes automatically close the associated
    file. In my simple example, the MyName.txt file was closed when the my object
    went out of scope returning from main(). Global objects are closed as part of
    program termination.


    # Open modes


    Table 23-2 shows the different modes that are possible when opening a file. However,
    you need to answer three basic questions every time you open a file:


    +   - Do want to read from the file or write to the file? Use ifstream to read
    and ofstream for writing. If you intend to write both and read from the same file,
    use the ifstream and set mode to inout, bout luck — it''s much better to write
    to a file completely and close it and reopen it for reading as a separate object

    - Are you intending to write to the file and it already exists, do you want to
    add to the existing contents (in which case, open with ate) or truncate the file
    and start over (in which case use trunc)

    - Are you reading text or binary data? Both ifstream and ofstream default to text
    mode. Use binary mode if you are reading or writing raw, non-text data.


    The primary difference between binary and text mode lies in the way that newlines
    are handled. The Unix operating system was written in the days when typewriters
    were still fashionable (when it was called “typing” instead of “keyboarding”).
    Unix ended sentences with a linefeed followed by a carriage return.


    Subsequent systems saw no reason to continue using two characters to a end, but
    they couldn''t agree on which character to use. Use some the carriage return,
    others used the linefeed, now renamed newline. The C++ standard is the single


    When a file is opened in text mode, the C++ library converts the new line character
    into what is appropriate for your operating system on output, whether it''s a
    carriage return plus linefeed, a carriage return, a linefeed, or something else
    entirely. It performs the opposite conversion while reading. The C++ library does
    no conversions for a file opened in binary mode.


    ![](img/b52206ee80ddcd0d5f11a03376f21b9d_334_0.png)


    Always use binary mode when manipulating a file that''s not in human-readable
    format. Otherwise, if a byte in the data just has to be the same as a carriage
    return or a linefeed, the file I/O library will modify it.'
