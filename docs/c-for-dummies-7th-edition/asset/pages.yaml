  md: '# Chapter 30: Ten Ways to Protect Your Programs from Hackers 419


    way too much memory due to unreasonable input. Or it could be that the constructor
    detected some type of illegal input. It doesn''t matter. The point is that the
    program should restore its state as best it can and set up for the next bit of
    input without crashing or corrupting existing data structures as the heap.


    In general this means the following:


    +   - Check for illegal input to interface functions and throw an exception when
    you detect it.

    - Catch and handle exceptions at the proper points.


    ![](img/b52206ee80ddcd0d5f11a03376f21b9d_434_0.png)


    Some programmers are good at checking for illegal input and throwing exceptions
    when problems occur, but they''re not so good at catching exceptions and handling
    them properly. I would give this type of programmer a B–. At least their programs
    are hard to exploit, they are easy to crash, making them vulnerable to the relatively
    less dangerous Denial of Service attacks.


    Another rule of thumb is to fail secure. For example, if you are trying to check
    someone''s password and the user inputs 2000 characters replete with embedded
    SQL statements, not only is it to reject this garbage, but you must also not approve
    this nonsense as if it were a valid password. Whenever you catch an exception,
    you should not assume anything about the state of the system (like the fact that
    the user has been identified and credentialed) that may be true. It is far better
    to require the user to reenter their credentials after a major failure than it
    would be to assume that an invalid user has already approved.


    # Maintain a Program Log


    Create and maintain runtime logs that allow someone to reconstruct what happened
    in the event of a security failure. (Actually, this is just true in the event
    of any type of failure.) For example, you probably want to log every time someone
    signs into or out of your system. You''ll definitely want to know who logged into
    your system when a security event occurred— this is the group''s most at risk
    of a security loss and who are most suspicious when looking for culprits. In addition,
    you''ll want to log any system errors which would include most exceptions.


    A real-world production program contains a large number of calls that look something
    like the following:


    ```

    log(DEBUG, "User %s entered legal password", sUser);

    ```'
