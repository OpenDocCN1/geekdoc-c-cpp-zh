  md: '# Part IV: Inheritance


    But now you have a problem. Because Savings inherits from Checking, Savings gets
    this new data member as well. It has no use for this member because the minimum
    balance does not affect savings accounts, so it just sits there. Remember that
    checking account object has this extra minimumbalance member. Extra data member
    may not be a deal, but it adds further confusion.


    Changes like this accumulate. Today''s an extra data member — tomorrow it''s a
    changed member function. Eventually, the savings account class is rearing a lot
    of extra baggage that is applicable only to checking accounts.


    Now the bank comes back and decides to change some savings account policy. This
    requires you to modify some function in Checking. Like in this base class automatically
    propagate to the subclass unless the function is already overwritten in the subclass
    Savings. For example, suppose the bank decides to give toasters for every deposit
    into the checking account. (Hey it could happen!) Without the bank (or its programmers)
    knowing it, deposits to checking accounts would automatically result in toaster
    donations. Unless you are very careful, changes to Checking may unexpectedly appear
    in Savings.


    How can you avoid these problems? Claiming that Checking is a special case of
    Savings changes but doesn''t solve our problem. What you need is a third class
    (call it Account, just for grins) that embodies the things that are common between
    Checking and Savings, as shown in Figure 21-3.


