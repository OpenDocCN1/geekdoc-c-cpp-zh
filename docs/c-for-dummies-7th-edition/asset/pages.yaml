  md: '# Chapter 2: Declaring Variables Constantly 35


    Integers are great for most calculations. I made it through most of elementary
    school with integers. It isn''t until I turned 11 or so that my teachers started
    mucking the waters with fractions. The same is true in C++: More than 90 percent
    of all variables in C++ are declared to be of type int.


    Unfortunately, int variables are not adapted to every problem. For example, if
    you worked through the temperature-conversion program in Chapter 1, you might
    have noticed that the program has a potential problem - it can cause late terms
    to the nearest degree. No fractions of a degree are allowed. This integer limitation
    wouldn''t affect daily use because it''s unlikely that someone (other than a meteorologist)
    would get excited about being off a fraction of a degree. There are plenty of
    cases, however, where this isn''t case — for example, you wouldn''t want to come
    a half mile short of the runway on your next airplane trip to a navigational round-off.


    # Reviewing the limitations

    of integers in C++


    The int variable is the C++ version of an integer. int variables suffer the same
    limitations as their counting-number equivalents in math.


    # Integer round-off


    Lopping off the part of a number is called truncation. Consider the problem of
    calculating the average of three numbers. Given three variables — nValue1, nValue2,
    and nValue3 — an equation for calculating the average is


    ```

    int nAverage; int nValue1; int nValue2; int nValue3;

