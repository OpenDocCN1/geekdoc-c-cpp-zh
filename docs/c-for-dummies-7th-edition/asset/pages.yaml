    You can see here that the return address is overwritten, but rather the value
    0x4645444D, which happens to be the ASCII characters “FEDC”, you can also see
    many of the other characters from BigFile.txt on the right of Figure 28-5.


    This doesn''t cause a problem as long as the program is processing getString(),
    but when the program tries to return, the return address that''s on the stack
    is not a return address at all. Instead, it points to some illegal address, and
    the program crashes as it executes the RET statement at the end of getString().


    # Hacking BufferOverflow


    The BufferOverflow program crashed because the content of BigFile.txt overflowed
    buffer and overwrote the return address within the function getString(). When
    the function attempted to execute a return instruction, control passed to some
    garbage address, and the program crashed.


