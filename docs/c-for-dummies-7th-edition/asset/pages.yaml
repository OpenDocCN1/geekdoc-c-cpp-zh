    \ '14 standard, they can also be a constant expression. I don't describe constant\
    \ expressions until Chapter 10.\n\nWhen the switch statement is encountered, the\
    \ expression is evaluated and compared to the various cases. Control branches\
    \ to the case that matches. If none of the cases matches, control passes to the\
    \ default clause.\n\nConsider the following example snippet:\n\n```\nint choice;\n\
    out << \"Enter a 1, 2 or 3\";\ncin >> choice;\n\nswitch(choice)\n{\n    case 1:\n\
    \    // do \"1\" processing\n    break;\n    case 2:\n    // do \"2\" processing\n\
    \    break;\n    case 3:\n    // do \"3\" processing\n    break;\n    default:\n\
    \    cout << \"You didn't enter a 1, 2 or 3\\n\";\n```\n\nOnce again, the switch\
    \ statement has an equivalent; in this case, multiple if statements. However,\
    \ when there are more than two or three cases, the switch structure is easier\
    \ to understand.\n\nThe break statements are necessary to exit the switch command.\
