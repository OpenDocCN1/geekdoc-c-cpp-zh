  md: "# Chapter 18: Static Members: Can Fabric Softener Help?\n\n\"Well then,\" you\
    \ ask, \"if the space for noOfStudents is not allocated in any of the objects\
    \ of class Student, where is it allocated?\" The answer is, \"It isn't.\"\nYou\
    \ have to specifically allocate space for it, as follows:\n\n```\nint Student::noOfStudents\
    \ = 0;\n```\n\nThis somewhat peculiar-looking syntax allocates space for the static\
    \ data member and initializes it to 0. (You don't have to initialize a static\
    \ member when you declare; C++ will invoke the destructor if you don't.) Static\
    \ data members are global — a static variable cannot be local to a function.\n\
    \n![](img/b52206ee80ddcd0d5f11a03376f21b9d_278_0.png)\n\nThe name of the class\
    \ is required for when it appears outside its class boundaries.\n\nThis business\
    \ of allocating space manually is somewhat confusing until you consider that class\
    \ definitions are designed to go into files that are included by multiple source\
    \ code modules. C++ has to know in which of .cpp source files to allocate space\
    \ for the static variable. This is not a problem with non-static variables because\
    \ space is allocated in every object created.\n\n# Referencing static data members\n\
    \nThe access rules for static members are the same as the access rules for normal\
    \ members. Within the class, static members are referenced like any other class\
    \ member. Public static members can be referenced from outside the class, where\
    \ well-protected static members can't. Both types of reference are shown in the\
    \ following code snippet using the declaration of Student from the previous section:\n\
    \n```\nvoid fn(Student& s1, Student& s2) {\n    // reference public static\n \
    \   cout << \"No of students \" << s1.noOfStudents // reference from outside\n\
    \         << // of the class;\n}\n```\n\nIn fn(), noOfStudents is referenced using\
    \ the object s1. But s1 and s2 share the same member noOfStudents. How did I know\
    \ to choose s1? Why didn't I use s2 instead? It doesn't make any difference. You\
    \ can reference a static member using any object of that class."
