  md: "# 228 Part III: Introduction to Classes\n\n# Placing Too Many Demands on the\
    \ Carpenter: Overloading the Constructor\n\nI can draw one more parallel between\
    \ constructors and other more normal member functions in this chapter: Constructors\
    \ can be overloaded.\n\nOverloading a function means to define two functions with\
    \ the same name but with different types of arguments. See Chapter 6 for the latest\
    \ news on overloading.\n\nC++ chooses the proper constructor based on the arguments\
    \ in the declaration. For example, the class Student can have all three constructors\
    \ in the following snippet at the same time:\n\n```\n```\n// OverloadConstructor\
    \ - provide the class multiple\n// ways to create objects by\n// overloading the\
    \ constructor\n\n#include <cdio>\n#include <cstdlib>\n#include <iostream>\n#include\
    \ <string.h>\n\nusing namespace std;\nclass Student {\npublic:\n    Student()\n\
    \    {\n        cout << \"constructing student No Name\" << endl;\n        name\
    \ = \"No Name\";\n        semesterHours = 0;\n        gpa = 0.0;\n    }\n    Student(const\
    \ char *pName)\n    {\n        cout << \"constructing student \" << pName << endl;\n\
    \        name = pName;\n        semesterHours = 0;\n        gpa = 0;\n    }\n\
