  md: '# 392 Part V: Security


    Figure 28-4 shows the situation immediately after a successful return from getString().
    The small yellow arrow in the disassembly shows that the instruction pointer is
    pointing to the instruction immediately after the CALL and the ESP has returned
    to its value of 0x0028FDC0.


    That''s very nice, but so what? C++ also stores locally defined variables on the
    stack. For example, the 64-byte buffer in getString() is on the stack. As the
    program writes only 64 bytes (or less) into buffer, everything is fine; if the
    program tries to write more data than buffer can hold, the remaining data spills
    over and overwrites other data. If the program writes far enough, it will eventually
    overwrite the return address. This is exactly what happened when getString() overrode
    the Big_File.txt shown in Figure 28-5.


    Figure 28-4 The ESP and the stack memory immediately after the return from getString().


