    put any comment you want in a comment. A comment may be as long as you want, but
    it''s customary to keep lines to no more than 80 characters across. Back in the
    old days—“old” is relative here—screens were limited to 20 characters wide. Some
    printers default to 80 characters when printing text. These days, keeping a single
    line to fewer than 80 characters is a good practical idea (easier to read; less
    likely to cause strain; the usual).


    A newline was a carriage return back in the days of typewriters—when the act of
    entering characters into a machine was called typing and not keyboard-ing. A newline
    is the character that terminates a comment line.


