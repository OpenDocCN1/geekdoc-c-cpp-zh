  md: "# 80 Part I: Getting Started with C++ Programming\n\n# # Applying special loop\
    \ controls\n\nC++ defines two special flow-control commands known as break and\
    \ continue. Sometimes the condition for terminating a loop occurs at neither the\
    \ beginning nor the end of the loop, but in the middle. Consider a program that\
    \ accumulates values entered by the user. The loop terminates when the user enters\
    \ a negative number.\n\nThe challenge with this problem is that the program cannot\
    \ exit the loop until the user has entered a value but must exit before the value\
    \ is added to the sum.\n\nFor these cases, C++ defines the break command. When\
    \ encountered, the break causes control to exit the current loop immediately.\
    \ Control passes from the break statement to the statement immediately following\
    \ the closed brace at the end of the loop.\n\nThe format of the break commands\
    \ is as follows:\n\n```\nwhile(condition) // break works equally well in loop\n\
    {\n    if (some other condition)\n{\n        break;      // exit the loop\n  \
    \  }\n    // control passes here when the\n    // program encounters the break\n\
    }\n```\n\nArmed with this new break command, my solution to the accumulator problem\
    \ appears as the following BreakDemo:\n\n```\n// BreakDemo - input a series of\
    \ numbers.\n// Continue to accumulate the sum\n// of these numbers until the user\n\
    // enters a negative number.\n\n#include <stdio>\n#include <stdlib>\n#include\
    \ <iostream>\nusing namespace std;\n\nint main(int nNumberofArgs, char* pszArgs[])\n\
