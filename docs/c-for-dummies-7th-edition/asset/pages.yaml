  md: '# Chapter 8: Taking a First Look at C++ Pointers


    A variable intReader might be at address 0x100, whereas floatReader might be over
    location 0x180. (By convention, memory addresses are expressed in hexadecimal.)
    Of course, intReader and floatReader might be somewhere else in memory entirely—only
    the computer knows for sure and at the time the program is executed.


    This is somewhat analogous to a hotel. When you make your reservation, you may
    be assigned room 0x100. (I know that suite numbers are normally not expressed
    in hexadecimal, but bear with me.) Your buddy may be assigned 80 doors down in
    room 0x180. Each variable is assigned an address when it is created (more on that
    in this chapter when we talk about scope).


    # Address Operators


    The two pointer-related operators are shown in Table 8-1. The & operator says
    "tell me address," and * says "the value at the following address."


    | Table 8-1 | Pointer Operators |

    |---|---|

    | Operator | Meaning |

    | & (unary) | (In an expression) the address of |

    | & (unary) | (In a declaration) reference to |

    | * (unary) | (In an expression) the thing pointed by |

    | * (unary) | (In a declaration) pointer to |


    These are not to be confused with the binary & * operators discussed in Chapters
    3 and 4.


    The following Layout program demonstrates how the & operator can be used to display
    the layout of variables in memory:


    ```

    // Layout - this program tries to give the

