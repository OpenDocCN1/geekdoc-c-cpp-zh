    \n```\nvoid fn() {\n    MyStruct source, destination;\n    destination = source;\n\
    }\n```\n\nThe default assignment works for most classes; however, it is not correct\
    \ for classes that allocate resources, such as heap memory. The programmer must\
    \ overload operator() to handle the transfer of resources.\n\nThe assignment operator\
    \ is much like the constructor (see Chapter 17). In the two look identical:\n\n\
    ```\nvoid fn(MyClass& mc) {\n    MyClass newMC(mc); //of course, this uses the\n\
