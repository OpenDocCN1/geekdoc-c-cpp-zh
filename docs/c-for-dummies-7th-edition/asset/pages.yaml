  md: '# Part VI: The Part of Tens


    Okay, so when should I not declare the destructor virtual? Declaring any member
    in a class virtual means that C++ must add an extra pointer or two to each object
    of that class to keep track of its virtual members. Thus, if you were to declare
    a lot of Person objects, an extra few pointers per object might be a big deal.


    As a general rule, if you expect someone to inherit your class then declare its
    destructor virtual. And if you are about to inherit from an existing base class,
    make sure that its destructor is declared virtual as well.


    # Avoid Multiple Inheritance


    Multiple inheritance, like operator overloading, adds another level of complexity
    that you don''t need to deal with when you''re just starting out. Fortunately,
    most real-world relationships can be described with single inheritance.


    After you feel comfortable with your level of understanding of C++, experiment
    with setting up some multiple inheritance hierarchies. That way, you''ll be ready
    when the unusual situation that requires multiple inheritance to describe it accurately
    arises.'
