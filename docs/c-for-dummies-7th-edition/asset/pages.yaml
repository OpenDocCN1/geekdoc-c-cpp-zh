    # Let the operating system help


    CPU manufacturers and operating system vendors have combined to devise ways to
    avoid buffer overflows. Two of the most common are Address Layout Randomization
    (ASLR) and Data Execution Prevention (DEP).


    instructions that were stored in an area reserved for data (namely the machine
    code that got loaded into buffer). Most x86 processors have the ability known
    as Data Execution Prevention (DEP) to mark segments as non-executable (using the
    NX flag). Operating systems that support DEP memory segments by marking areas
    as executable only for data, such as the stack where buffer is stored as not executable.
    This buffer overflow would have been trapped by the processor as soon as control
    to the beginning of buffer: The CPU would fail while executing instructions stored
    in non-executable memory — a no-no of the first order. The operating system would
    catch the exception and immediately terminate the malicious program out of memory
    before any harm could be done.


    One of the Achilles heels of the properly hack is that it is hard to have code
    of buffer overflow on the stack. I could do this because Windows allows that particular
    program, BufferOverflow.exe, the same way. But what if it were varying every time
    it executed the program? What if the operating system added some constant to the
    stack pointer before executing the program? It would make no difference to the
    program, but it would make it impossible for the hacker to know what to overwrite
    the return address since the address of buffer would be slightly different every
    time the program executed. Memory is known as Space Layout Randomization (ASLR).


    Another vulnerability of this hack is that at least for a small period of time
    the processor was being asked to execute machine


