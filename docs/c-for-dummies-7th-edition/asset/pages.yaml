  md: "# 250 Part III: Introduction to Classes\n\nThe normal Student constructor generates\
    \ the first message from the declaration on the first line of main() about creating\
    \ scruffy. main() then outputs the Calling... message before calling fn(). As\
    \ part of the function call process, C++ invokes the copy constructor to make\
    \ a copy of scruffy to pass to fn(). The copy constructor prepares the string\
    \ \"Copy of\" to the student's name before displaying it on the console. The function\
    \ fn() outputs the In... message. The copied Student object is destroyed at the\
    \ return from fn(). You can tell it's the copy because of \"Copy of\" prepended\
    \ to the front). The original object, scruffy, is destroyed at the end of main().\n\
    \n# The Automatic Copy Constructor\n\nLike the default constructor, the copy constructor\
    \ is important; important enough that C++ thinks no class should be without one.\
    \ If you don't provide your own copy constructor, C++ generates one for you. (This\
    \ differs from the default constructor, C++ provides unless your class has constructors\n\
    \nThe copy constructor provided by C++ performs a member-by-member copy of each\
    \ data member. You can see this in the following DefaultCopyConstructor program.\
    \ (I left out the definition of the Student class to save space — it's identical\
    \ to that shown in the CopyCopyConstructor program is available online at www.dummies.com/\
    \ extras/cplusplus).\n\n```\nclass Tutor {\npublic:\n    Tutor(Student& s) : student(s),\
    \ id(0)\n    cout << \"Constructing Tutor object\" << endl;\nprotected:\n    Student\
    \ student;\n    int id;\n};\nvoid fn(Tutor tutor) {\n    cout << \"In function\
    \ fn()\" << endl;\n}\nint main(int argcs, char* pArgs[]) {\n    Student scruffy(\"\
    Scruffy\");\n    Tutor tutor(scruffy);\n}\n```"
