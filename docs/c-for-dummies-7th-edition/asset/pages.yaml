  md: '# 386 Part V: Security


    # # Avoiding code injection


    The first rule of avoiding code injection is never, ever, allow user input to
    be processed by a general-purpose language interpreter. The error with the SQL
    injection example was that the program accepted user input as if it always a date
    and inserted it into a SQL query that it shipped off to the database engine for
    processing.


    The safest and most user-friendly approach would have been to provide the user
    a calendar graphic from which he select the start and end dates. The program would
    then create a date based on what the user clicked. If this is not possible, the
    program should have carefully checked the input to make sure that the input was
    in the proper format for a date, in this case yyyy/mm/dd — in other words, four
    digits followed by a slash four digits and a slash followed by two more digits.
    Nothing should be considered acceptable.


    Sometimes you cannot be specific about the format. If you allow the user to enter
    text, then you can at least avoid special characters. For example, it is pretty
    impossible to do SQL code injection without either a single or double quote. You
    cannot insert HTML tags using a less (<) and greater than (>) sign. Or you could
    take the approach that anything other than ASCII text will not be tolerated:


    This code searches the string s for a character that''s not one of characters
    A through Z, through z, 0 through 9, or underscore. If it finds such character,
    the program rejects the input.


    If you allow only the Latin characters shown here, your application will not be
    usable in many foreign markets such as those that do not use English sets (as
    Arabic, Chinese, Hebrew, or Russian, to just a few). You may have to take the
    opposite approach and just look for the bad characters.


