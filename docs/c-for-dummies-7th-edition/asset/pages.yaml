  md: "# 70 Part I: Getting Started with C++ Programming\n\nIn C++, the branch statement\
    \ is implemented using the if statement:\n\n```\nif (m > n)\n{\n    // Path 1\n\
    \    // instructions to be executed if\n    // m is greater than n\n} else\n{\n\
    \    // Path 2\n    // instructions to be executed if not\n}\n```\n\nThe logical\
    \ expression m > n is evaluated. If the result of the expression is true, control\
    \ passes down the path Path 1 in the previous snippet. If the expression is false,\
    \ control passes to Path 2. The else clause is optional. It is not present, C++\
    \ acts as if it is present empty.\n\n![](img/b52206ee80ddcd0d5f11a03376f21b9d_85_0.png)\n\
    \nActually, the braces are not required if there's only one statement to execute\
    \ as part of the if. Originally, braces were used only if there were two or more\
    \ statements that you wanted to read as one. However, people quickly realized\
    \ that it was cleaner and less error prone you used braces every time, no matter\
    \ how many statements there are.\n\nThe following program demonstrates the if\
    \ statement (note all the lovely braces):\n\n```\n// BranchDemo - input numbers.\
    \ Go down one path of the\nprogram if the first argument is greater\nthan the\
    \ first or the other path if not\n\n#include <cctype>\n#include <cstdlib>\n#include\
    \ <iostream>\nusing namespace std;\n\nint main(int numberofArgs, char* pszArgs[])\n\
    {\n    // input the first argument...\n    int nArg1;\n    cout << \"Enter arg1:\
    \ \";\n    cin >> nArg1;\n\n    //...and the second\n    int nArg2;\n    cout\
    \ << \"Enter arg2: \";\n    cin >> nArg2;\n\n    // now decide what to do:\n \
    \   if (nArg1 > nArg2)\n```"
