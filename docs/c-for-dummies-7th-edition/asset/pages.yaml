    # Strings have me constantly confused


    You may have noticed that I slipped a const declaration in the earlier DisplayString
    example program. This was necessary to account for differences between an array
    and a pointer. A string as "this is a string" is considered a constant address
    of string characters. In other words, neither the address of the string nor the
    characters themselves can be changed. Why is that?


    One problem is that you don''t know how C++ stores its local strings nor do you
    know how many times it uses the string. Often C++ stores constant strings in the
    same memory locations as source code, and it very often uses the same string in
    several places in the program. For this reason, C++ often makes strings un


    The initialization of a pointer variable is similar to initializing any other
    variable:


    ```

    int i = 1;

    const char* pString = "this is a string";

    ```


    Both declarations initialize the variable on the left with the constant value
    on the right. However, since pString points directly at the immutable string "this
    is a string" it''s important that pString declared const char*, a pointer to constant
    characters.


    The equivalent array is more complex than it appears:


    ```

    char sChars[] = "this is a string"; // declare and init array

    ```


    This declares and allocates memory for an array sChars and then copies the initialization
    string into it. Thus, the letter t that the first character in sChars is not the
    same letter t makes up the initialization string


    In fact, the precede is shorthand for the longer-winded but descriptive


    ```

    char sChars[17];

    strcpy(sChars, "this is a string"); // ...then initialize it

    ```


    Remember that strcpy copies the string of characters represented by the second
    argument into the array pointed by the first argument. And also to allocate space
    for the terminating null.


    The expression pArray[10] is syntactically equivalent to charArray[10], but pArray
    has not been initialized so pArray[10] references some random (gar-bage) location
    in memory.


    ![](img/b52206ee80ddcd0d5f11a03376f21b9d_158_0.png)


    TIP The mistake of referencing memory with an uninitialized pointer variable is
    generally caused by the CPU when the program executes, resulting in the dreaded
    segmentation error that can time out issues from your applications during your
    favorite, or not-so-favorite, operating system. This problem is not generally
    the fault of the processor or the operating system, but of the application.


    ![](img/b52206ee80ddcd0d5f11a03376f21b9d_158_1.png)


    Another implication of this difference is that you can use a range-based loop
    on an array where the array is known but not on a pointer where the number of
    elements is known:


