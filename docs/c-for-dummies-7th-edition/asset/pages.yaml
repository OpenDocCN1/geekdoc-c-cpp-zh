  md: "# Chapter 13: Point and Stare at Objects\n\n# When memory is allocated for\
    \ you\n\nMany classes (particularly the containers described in Chapter 27) manage\
    \ heap memory for you. For example, the string class maintains a character string\
    \ in memory that it allocates off the heap. The authors of these classes are careful\
    \ to return heap memory in all the right places so that it's safe to write a function\
    \ like the following:\n\n```\nstring myFunc() {\n  string localString;\n  localString\
    \ << cin;\n  return localString;\n}\n```\n\nThe object localString allocates heap\
    \ memory when it is created but carefully returns said memory when it goes out\
    \ of scope at the end of the function. (You will see in Chapters 16 and 17 how\
    \ this magic is performed.)\n\n# Linking Up with Linked Lists\n\nThe second common\
    \ structure after the array is called a list. Lists come in different sizes and\
    \ types; however, the most common one is the linked list. In the linked list,\
    \ each object points to the next member in a sort of chain that extends through\
    \ memory. The program can simply point the last element in the list to add to\
    \ it. This means that the user doesn't have to declare the size of the linked\
    \ list at the beginning of the program — you can add and remove objects from the\
    \ list by unlinking them. In addition, you can change the members of a linked\
    \ list — without moving data objects — by changing the links.\n\nThe cost of such\
    \ flexibility is speed of access. You can't just reach in and grab the tenth element,\
    \ for example, like you would be in the case of an array. Instead, you have to\
    \ start at the beginning of the list and link ten times to get to the next.\n\n\
    A linked list has one feature besides its run-time expandability (that's good)\
    \ and its difficulty in accessing an object at random (that's bad): A linked list\
    \ makes use of pointers. These linked lists make a great tool for giving you experience\
    \ in manipulating pointer variables (that's very good).\n\n![](img/b52206ee80ddcd0d5f11a03376f21b9d_216_0.png)\n\
    \nTIP C++ standard library offers a number of different types of lists. You can\
    \ see them in action in Chapter 27; however, it's always good to implement first\
    \ linked list yourself to get practice in manipulating pointers."
  merge: -1
