    go further. Cars are a subclass of wheeled vehicles among other members, such
    as trucks and pickups. Maybe wheeled vehicles are a subclass of vehicles, which
    includes boats and planes. And on and on on.


    # Why Classify?


    Why we classify sounds a lot of trouble. Besides, people have been using the functional
    approach for so long, why change now?


    It may seem easier to design and build a microwave oven specifically for this
    one problem, rather than build a separate, more generic object. Subject, for example,
    that I want to build a microwave to cook nachos and nachos only. I wouldn''t need
    to put a front panel on, so I could dispense with all that Defrost and Temp Cook
    nonsense. I always cook nachos the same amount of time, My nachos-only microwave
    needs to hold only one flat plate. Three cubic feet of space would be wasted on
    nachos.


    For that matter, I could dispense with the concept of "microwave oven" altogether.
    All I really is the guests of the oven. In the recipe, I put the instructions
    to make work: "Put nachos in the box. Connect the red wire to the black wire.
    Bring the radar tube to about 3,000 volts. Notice a slight hum. Try not to stand
    close if you have to have children." Like with that.


    The functional approach has some problems:


    +   Too complex: I don''t want the details of oven building mixed into the details
    of nach building. If I can''t define the objects and pull them out of the morass
    of details to deal separately, I must deal with all the complexities of the problem
    at the same time.


    +   Not flexible: Someday I may need to replace the microwave oven with some other
    type of oven. I should be able to do so as long as its interface is the same.
    Without being clearly delineated and developed separately, it becomes impossible
    to cleanly remove any object type and replace it with another.


    +   Not reusable: Ovens are used to make lots of different dishes. I want to create
    a new oven every time I encounter a new recipe. Having solved a problem once,
    it would be nice to be able to reuse the solution in future programs.


