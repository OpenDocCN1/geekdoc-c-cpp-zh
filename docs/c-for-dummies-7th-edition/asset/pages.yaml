  md: "# Chapter 6: Creating Functions\n\nThis is essentially the same FunctionDemo\
    \ program, except that the sumSquare Sequence function accumulates the square\
    \ of the values entered and returns them as a double rather than an int. The function\
    \ square() returns the value of its one argument multiplied by itself. The change\
    \ to the sumSequence() function is simple: Rather than accumulate the value entered,\
    \ the function now accumulates the result returned from square().\n\n# Functions\
    \ with multiple arguments\n\nFunctions may have multiple arguments that are separated\
    \ by commas. Thus, the following function returns the product of its two arguments:\n\
    \n```\nint product(int arg1, int arg2)\n{\n    return arg1 * arg2;\n}\n```\n\n\
    # main() exposed\n\nThe \"keyword\" main() from our standard program template\
    \ is nothing more than a function — albeit a function with strange arguments but\
    \ a function nonetheless.\n\nWhen C++ builds a program from source code, (You\
    \ can't see this code with out digging into the bowels of the C++ library functions.)\
    \ This code sets up the environment in which your program operates. For example,\
    \ this boilerplate code opens the default input and output channels cin and out.\n\
    \nAfter the environment has been established, the C++ boilerplate code calls the\
    \ function main(), thereby beginning execution of your code. When your program\
    \ finishes, it exits from main(). This enables the C++ boilerplate to clean up\
    \ a few things before turning control over to the operating system that kills\
    \ the program.\n\nThe arguments to main() are complicated — we'll review those\
    \ later. The int returned from main() is a status indicator. The program returns\
    \ 0 if the program terminates normally. Any other value can be used to indicate\
    \ an error — the actual value returned indicates the nature of the error that\
    \ caused the program to quit."
