  md: "# Chapter 7: Storing Sequences in Arrays\n\nUnfortunately for the programmer,\
    \ C++ does not check to see whether the index you are using is within the range\
    \ of the array. C++ is perfectly happy giving you access to integerArray[200].\
    \ Our integerArray yard is 128 elements long—200 is 72 into someone else's yard.\
    \ No one tells him there and what he's storing at that location. Reading from\
    \ integerArray[200] will return some unknown and unpredictable value. Writing\
    \ to that location generates unpredictable results. If you do nothing—the house\
    \ may be abandoned and unused. On the other hand, it might overwrite some data,\
    \ troubling the neighbor and making the program in a seemingly random fashion.\
    \ Or it might crash the program.\n\nThe most common way to access an array is\
    \ to read or write location integerArray[128]. Although it's only one element\
    \ beyond the end of the array, reading or writing this location is just as dangerous\
    \ as using any other incorrect address.\n\n![](img/b52206ee80ddcd0d5f11a03376f21b9d_126_0.png)\n\
    \n# Arraying range-based for loops\n\nYou can access the elements of an array\
    \ using a range-based for loop in some cases. The following for loop initializes\
    \ all the members of nArray to 0:\n\n```\nint nArray[128];\nfor(int &n: nArray)\\\
    {\n    n = 0;\n}\n```\n\nThis for loop says the variable n to be a reference to\
    \ each element of nArray in turn. A 0 is assigned to each element in nArray through\
    \ the reference n.\n\nThe following range-based for loop has no effect:\n\n```\n\
    int nArray[128];\nfor(int n: nArray)\\{\n    n = 0;\n}\n```\n\nWithout the ampersand\
    \ (&), n is assigned the value of nArray in turn. The variable n is then overwritten\
    \ with a 0, leaving the value of nArray unchanged. Compare this to passing arguments\
    \ to functions by value versus passing by reference, as described in Chapter 6."
