  md: "# Chapter 15: “Why Do You Build Me Up, Just to Tear Me Down, Baby?” 221\n\n\
    The constructor for Student is called first because it is declared first. Then\
    \ the constructor for Teacher is called.\n\nThe member Teacher of class Course\
    \ is constructed as part of building the Teacher object gets a shot first. Each\
    \ object within a class must construct itself before the class constructor can\
    \ be invoked. Otherwise, the main constructor would not know the state of its\
    \ data members.\n\nAfter all data objects have been constructed, control returns\
    \ to the open brace, and the constructor for TutorPair is allowed to construct\
    \ the remainder of the object.\n\n# Dissecting a Destructor\n\nJust as objects\
    \ are created, so are they destroyed (ashes to ashes, dust to dust). If a class\
    \ has a constructor to set things up, it should also have a special member function\
    \ to take the object apart. This member is called the destructor.\n\n# Why you\
    \ need the destructor\n\nA class may allocate resources in the constructor; these\
    \ resources need to be deallocated before the object ceases to exist. For example,\
    \ if the constructor opens a file, the file needs to be closed before leaving\
    \ that or the program. Or, if the constructor allocates memory from the heap,\
    \ this memory must be freed before the object goes away. The destructor allows\
    \ the class to do these cleanup tasks automatically without relying on the application\
    \ to call the proper member functions.\n\n# Working with destructors\n\nThe destructor\
    \ member has the same name as the class but with a tilde (-) added at the front.\
    \ (C++ is being cute again — the tilde is the symbol for the logical NOT. Get\
    \ it? A destructor is a “not constructor.” Très clair.) Like a constructor, the\
    \ destructor has no return type. For example, the class Student with a destructor\
    \ appears as follows:\n\n```\nclass Student {\npublic:\n    Student()\n    {\n\
    \      semesterHours = 0;\n      gpa = 0.0;\n    }\n```\n\nwww.it-ebooks.info"
