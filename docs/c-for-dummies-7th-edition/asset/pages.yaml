  md: '# C++ For Dummies, 7th Edition


    # What is C++?


    | C++ is an object-oriented, low-level standard programming language. As a low-level
    language similar to and compatible with its predecessor C, C++ can generate efficient,
    very fast programs. It is often used to write games, graphics software, hardware
    control, and other applications where performance counts. | C++ has been certified
    as a 99.9 percent standard, which makes it a portable language. A standard C++
    compiler exists for every major operating system. Some versions —in particular,
    Visual Studio and Studio Express from Microsoft includes a C++ compiler that implements
    several extensions that allow the programs to interface with other .NET languages.
    Nevertheless, any student is better off the standard C++ first. Learning the extensions
    is easy once you''ve mastered the basics demonstrated here. |


    As an object-oriented, C++ has the power and extensibility to write large-scale
    programs. C++ is one of the most popular programming languages for all types of
    programs. Most of the programs you use on your PC every day are written in C++
    (or the subset, which is the C language).


    When I describe a message that you see onscreen, it appears like this:


    Hi mom!


    In addition, code listings appear as follows:


    ```

    // some program

    int main()

    {

    }

    ```


    If you enter these programs by hand, you must enter the text exactly as shown
    with one example: The amount of *whitespace* (spaces, tabs, and new-lines) is
    not critical. You can''t put a space in the middle of a keyword, but you don''t
    have to worry about entering one too many or too few spaces.


    Case IS critical however. If it says *int*, does it not mean INT or INT?


    ++ words are usually based on English words with similar meanings. This can make
    reading a sentence containing both English and C++ difficult without a little
    assistance. To help out, C++ commands and function names appear in a different
    font, *like this*. In addition, function names are always followed by


    ![](img/b52206ee80ddcd0d5f11a03376f21b9d_17_0.png)'
