  md: "# 78 Part I: Getting Started with C++ Programming\n\nThe following shows example\
    \ output from the program:\n\n```\nEnter loop count: 5\nWe've finished 1 loops\n\
    We've finished 2 loops\nWe've finished 3 loops\nWe've finished 4 loops\nWe've\
