    # # Using Stream I/O


    # In This Chapter


    +   - Performing input/output

    - Rediscovering stream I/O as an overloaded operator

    - Examining the other methods of the file class

    - Using buffer I/O


    Programs appearing before this chapter read from the cin input object and output
    through the cout output object. Perhaps you haven''t really thought about it,
    but this input/output technique is a subset of what is known as stream I/O.


    In this chapter, I describe I/O in more detail. I must warn you that stream I/O
    is too large a topic to be covered in a single chapter — entire books are devoted
    to this topic. Fortunately for both of us, there isn''t all that you need to know
    about stream I/O to write the vast majority of programs.


    # ## How Stream I/O Works


    Stream I/O is based on overloaded versions of operator>> and operator<<. The declaration
    of these overloaded operators is found in the include file iostream, which are
    included in all the programs in this book beginning with Chapter 1. The code for
    these functions is included in the standard library, which your C++ program links
    with.


    The following code shows just few of the prototypes appearing in iostream:


    ```

    // for input have:

    istream& operator>>(istream& source, char *pDest);

    istream& operator>>(istream& source, string &dDest);

    istream& operator>>(istream& source, int &dDest);

    istream& operator>>(istream& source, double &dDest);

    //... and so forth...

    ```'
