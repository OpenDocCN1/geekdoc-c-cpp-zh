  md: "# 258 Part III: Introduction to Classes\n\n![](img/b52206ee80ddcd0d5f11a03376f21b9d_273_0.png)\n\
    \nC++ '11 standard also allows the programmer to delete the copy constructor:\n\
    \n```\nclass Student {\n    Student(Student&) = delete;\n    // ...everything\
    \ else normal;\n};\n```\n\nEither declaring the copy constructor protected or\
    \ deleting it entirely excludes any external functions, including C++, from constructing\
    \ a copy of your Student objects. If no one can invoke the copy constructor, no\
    \ copies are generated. Voilà.\n\n# The move constructor\n\nUnder certain conditions,\
    \ C++ can create a copy of an object that is used only for the duration of a single\
    \ statement. Such objects, known as temporaries, are destroyed as the expression\
    \ is completed. It doesn't make sense to make copies of objects that are about\
    \ to be destroyed anyway.\n\n![](img/b52206ee80ddcd0d5f11a03376f21b9d_273_1.png)\n\
    \nC++ '11 allows the programmer to create a constructor known as a move constructor\
    \ rather than making unnecessary copies. Move constructors have the format X:X(X&&).\
    \ This is a new use of \"&&\".\n\nConsider the following highly-constrained example:\n\
    \n![](img/b52206ee80ddcd0d5f11a03376f21b9d_273_2.png)\n\nC++ '11 includes several\
    \ return optimizations to avoid the creation of unnecessary copies of objects\
    \ which this example has to demonstrate the move constructor. You'll see less\
    \ constrained examples in the discussion of overloading operators in Chapter 22.\n\
    \n```\n// MoveCopy demonstrate the principle of moving a\n// temporary rather\
    \ than creating a copy\n//#include <stdio>\n#include <cstdlibdef>\n#include <iostream>\n\
    using namespace std;\n\nclass Person {\n    public:\n```"
