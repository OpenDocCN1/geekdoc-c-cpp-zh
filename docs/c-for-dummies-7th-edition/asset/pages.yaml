    ```


    Alas, C++ is not flexible. (On the other hand, C++ can do things people can''t
    do, such as adding a billion numbers or so in a second, let''s not get too up.)
    To C++, there are different types of variables just as there are different types
    of storage bins. Some barge are so small that they can handle only a single number.
    It takes a larger bin to handle a sentence.


    ![](img/b52206ee80ddcd0d5f11a03376f21b9d_49_0.png)


    Some computer languages try harder to accommodate the program by allowing to place
    different types of data in the same variable. These languages are called weakly
    typed languages. C++ is a strongly typed language — it requires the programmer
    to specifically declare each variable along with its exact.


    The variable type is the C++ equivalent of an integer — a number that has no fractional
    part. (Integers are also known as counting numbers or whole numbers.)'
