    \ << \"Number of students \"\n         << Student::noOFStudents\n         << endl;\n\
    }\n```\n\nIf you do use object name when accessing a static member, C++ uses only\
    \ the declared class of the object.\n\nThis is a minor technique, but in the interest\
    \ of full disclosure: The object used to reference a static member is not evaluated\
    \ even if it's an expression. For example, consider the following case:\n\n```\n\
    class Student\n{\n    public:\n        static int noOFStudents;\n        Student&\
    \ nextStudent();\n        //...other stuff the same...\n};\n\nvoid fn(Student&\
    \ s)\n{\n    cout << s.nextStudent().noOFStudents << \"\\n\";n}\n```\n\n![](img/b52206ee80ddcd0d5f11a03376f21b9d_279_0.png)\n\
    \nThe member function nextStudent() is not actually called. All C++ needs to access\
    \ noOFStudents is the return type, and it can get that without bothering to evaluate\
    \ the expression. This is true even if nextStudent() should do other things, such\
    \ as wash windows or shine your shoes. None of these things will be done. Although\
