  md: "# 240 Part III: Introduction to Classes\n\nA static variable is a variable\
    \ that is local to a function but retains its value from one function invocation\
    \ to the next. A global variable is a variable declared outside a function.\n\n\
    Now we'll consider each of the preceding rules in turn.\n\n# Local objects construct\
    \ in order\n\nLocal objects are constructed in the order in which the program\
    \ encounters their declaration. Normally, this is the same as the order in which\
    \ the objects appear in the function, unless the function jumps around particular\
    \ declarations. (By the way, jumping around declarations is a bad thing. It confuses\
    \ the reader and the compiler.)\n\n# Static objects construct only once\n\nStatic\
    \ objects are similar to local variables, except that they are constructed only\
    \ once. C++ waits until the first time control passes through the static's declaration\
    \ before constructing the object. Consider the following ConstructStatic program:\n\
    \n```\n// ConstructStatic - demonstrate statics are only\n// constructed once\n\
    \n#include <stdio>\n#include <stdlib>\n#include <iostream>\nusing namespace std;\n\
    \nclass DoNothing {\npublic:\n\tDoNothing(int initial) : nValue(initial)\n\t{\n\
    \tcout << \"DoNothing constructed with a value of \"\n\t<< initial << endl;\n\t\
    }\n\t~DoNothing()\n\t{\n\tcout << \"DoNothing object destroyed\" << endl;\n\t\
    }\tintintValue;\n};\nvoid fn(int i)\n{\n```"
