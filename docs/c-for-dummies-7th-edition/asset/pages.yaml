    stream that has an error, but also the buffer comes unchanged. This program can
    easily lead to the false conclusion that it has just read the same value it previously
    read. Furthermore, eof() will never return a true on an input stream that has
    an error.


    # Don''t overflow that buffer!


    If you look closely at the open() method in the StreamInput example, you''ll see
    another way to make sure that the operator doesn''t overflow the character buffer.
    Let''s review I could have used something like the following:


    ```

    char szFileName[80]; // any array size is possible

    cin >> szFileName; // input the name of the file to open

    ```


    You can probably find code like this in the early chapters of this book (when
    you were still using C++ training wheels). The problem with the size of the buffer
    is that nothing tells the extractor that the buffer is only 80 characters long
    — it will continue to read until it sees a newline, which might be dozens of characters.


    Well, 80 characters is a bit small. But what if we increase the buffer size to
    256 characters? That sort of misses might happen; the implication you are making
    with this type of error that any buffer overflow is the result of an honest mistake
    (and a very long filename!). More and more this is not the case. Major worms have
    been launched on the backs of buffer overflow attacks (I will explain buffer overflows
    in Chapter 28).


    One approach to avoiding buffer overflow that you have seen in early chapters
    is to use the getline() method to limit the size of the buffer that the program
    will read:


    ```

    char szFileName[80]; // read not more than 80 characters

    cin.getline(szFileName, 80);

    ```


    This code segment reads a line of input (up to the next newline character) but
    not more than 80 characters since the size of the buffer. Any extra characters
    are not read for the next call to getline().


    Another approach is to make the buffer fit the number of available characters.
    For the string class is smart enough to dynamically resize the buffer to fit the
    available data:


    ```

    string szFileName;

    cin >> szFileName; // string sizes buffer to fit amount of data

    input

    ```'
