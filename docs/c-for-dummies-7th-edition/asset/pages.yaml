  md: '# Chapter 7: Storing Sequences in Arrays


    The program declares an array inputValues[] to be used to store the values input
    by the user. The main program passes this array to readArray(), along with the
    length of the array — readArray() can read more than 128 values if the user does
    not enter a negative number since that''s all the room allocated in the inputValues[]
    array.


    The array inputValues is declared as 128 integers. If you''re thinking that this
    must be more than enough, don''t count on it. No matter how large you make the
    array, always put a check to make sure you do not exceed the limits of the array.
    Writing more data than an array can cause your program to perform erratically
    and to crash. This is discussed in Chapter 28.


    ![](img/b52206ee80ddcd0d5f11a03376f21b9d_124_0.png)


    The main function calls displayArray() to print the contents of the array. Finally,
    the function calls sumArray() to add the elements in the array.


    The readArray() function takes two arguments: the integerArray[] into which to
    store the values it reads and maxNumElements, the maximum number of integer values
    for there is room at the inn. The function begins with a loop that reads integer
    values. Every non-negative value that saved into integerArray[]. The first element
    goes into integerArray[0], the second into integerArray[1], and so forth.


    Once the user enters a negative number, the program breaks out of the loop and
    returns the total numberOfInputs.


    The displayArray() function also uses a for loop to traverse the elements of the
    array, starting at 0 and continuing to the last element, which is numElements-1.
    The final function, sumArray(), also iterates through the array but stores the
    elements stored into accumulator, which it returns to the caller.


    Notice, yet that the index i in displayArray() and sumArray() functions is initialized
    to 0 and not to 1. In addition, notice how the for loop terminates as i reaches
