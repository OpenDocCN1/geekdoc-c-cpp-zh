    # Iterating through Lists


    The Standard Template Library provides a large number of containers — many more
    than I can describe in a single chapter. However, I provide here a description
    of one the more useful families of containers.


    The STL list contains objects by linking them like Lego blocks. (Chapter 13 shows
    a simplistic implementation of a linked list.) Objects can be snapped apart and
    snapped back together in any order. This makes the list ideal for inserting objects
    and sorting, merging, and otherwise rearranging objects. Table 27-2 shows some
    of the methods of the list containers.


    | Table 27-2 | Major Methods of the list Template Class |

    | --- | --- |

    | Method | Meaning |

    | list<T>() | Creates an empty list of objects of class T. |

    | ~list<T>() | Destroys the list, invoking the destructor on T objects remaining
    in the list. |

