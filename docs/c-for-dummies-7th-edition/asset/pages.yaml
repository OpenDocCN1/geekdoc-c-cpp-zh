  md: '# 110 Part II: Becoming a Functional C++ Programmer


    Just to keep non-programmers guessing, the term iterate means to traverse through
    a set of objects such as an array. Programmers say that the preceding functions
    iterate through that array.


    # Initializing an array


    A local variable does not start life with a valid value, not even the value 0.
    Said another way, a local variable contains garbage until you actually store something
    in it. Locally declared arrays are the same — each element contains garbage until
    you assign something to it. You should initialize local variables when you declare
    them. This rule is even truer for arrays. It is far too easy to access uninitialized
    array thinking that they are valid values.


    By "local variable", I''m talking about the normal variables declared within a
    function. C++ parses these automatic variables to differentiate from static variables
    (discussed in Chapter 18).


    Fortunately, a array may be initialized at the time it is declared with an initializer
    list. The following code snippet demonstrates how this is done:


    ```

    float floatArray[5] = {0.0, 1.0, 2.0, 3.0, 4.0};

    ```


    This initializes floatArray[0] to 0, floatArray[1] to 2, and so on.


    C++ pads the initialization with 0s if the number of elements in the list is less
    than the size of the array. In fact, an empty initializer list can be used to
    initialize an array to:


    ```

    int nArray[128] = {}; // initialize array to all 0''s

    ```


    The number of initialization constants can determine the size of the array. For
    example, you could have determined that floatArray has five elements by counting
    the values within the braces. C++ can count as well (here''s at one thing C++
    can do for itself).


    ```

    float floatArray[] = {0.0, 1.0, 2.0, 3.0, 4.0};

    ```


    # Accessing too far into an array


    Mathematicians start counting arrays with 1. Most program languages start with
    an offset of 1 as C++ arrays begin counting at 0. The first member of a C++ array
    is valueArray[0]. That makes the last element of a 128-integer integerArray[127]
    and not integerArray[128].'
