  \n### 重载拷贝赋值运算符 (`=`)\n\n有时你可能想要将一个类实例的内容赋值给另一个，如下所示：\n\n点击此处查看代码图片\n\n```cpp\n\
  Date holiday(12, 25, 2016);\nDate anotherHoliday(1, 1, 2017);\nanotherHoliday =\
  \ holiday; // 使用拷贝赋值运算符\n```\n\n当你没有提供运算符时，此赋值会调用编译器为你的类内置的默认拷贝赋值运算符。根据类的性质，默认拷贝赋值运算符可能是不足的，特别是当你的类管理着不会被拷贝的资源时。默认拷贝赋值运算符这个问题与\
  \ 第 9 节 中讨论的默认构造函数的问题相似。为了确保深拷贝（与拷贝构造函数一样），你需要指定一个相应的拷贝赋值运算符：\n\n点击此处查看代码图片\n\n\
  ```cpp\nClassType& operator= (const ClassType& copySource)\n{\n    if(this != &copySource)\
  \  // 防止拷贝到自身\n    {\n        // 拷贝赋值运算符实现\n    }\n    return *this;\n}\n```\n\n\
  如果你的类封装了原始指针，例如 列表 9.9 所示的 `class MyString`，那么深拷贝是非常重要的。为了在赋值期间确保深拷贝，请如 列表 12.8\
  \ 所示定义拷贝赋值运算符。\n\n**列表 12.8** 源自 列表 9.9 的改进版 `class MyString`，带有拷贝赋值运算符 `=`\n\n\
  点击此处查看代码图片\n\n```cpp\n0: #include <iostream>\n1: using namespace std;\n2: #include\
  \ <string.h>\n3: class MyString\n4: {\n5: private:\n6:     char* buffer;\n7:\n8:\
  \ public:\n9:     MyString(const char* initialInput)\n10:     {\n11:         if(initialInput\
  \ != NULL)\n12:         {\n13:             buffer = new char [strlen(initialInput)\
  \ + 1];\n14:             strcpy(buffer, initialInput);\n15:         }\n16:     \
  \    else\n17:             buffer = NULL;\n18:     }\n19:\n20:     // 拷贝赋值运算符\n\
  21:     MyString& operator= (const MyString& copySource)\n22:     {\n23:       \
  \  if ((this != &copySource) && (copySource.buffer != NULL))\n24:         {\n25:\
  \             if (buffer != NULL)\n26:                 delete[] buffer;\n27:\n28:\
  \             // 通过首先分配 buffer 确保深拷贝\n29:             buffer = new char [strlen(copySource.buffer)\
  \ + 1];\n30:\n31:             // 从源缓冲区拷贝到本地缓冲区\n32:             strcpy(buffer, copySource.buffer);\n\
  33:         }\n34:\n35:         return *this;\n36:     }\n37:\n38:     operator\
