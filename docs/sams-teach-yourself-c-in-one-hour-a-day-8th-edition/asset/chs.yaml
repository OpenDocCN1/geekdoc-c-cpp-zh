  \ –1，如输出所示。\n\n### 在排序集合中排序和搜索以及删除重复项\n\n对排序范围进行排序和搜索（为了性能）是实际应用中经常出现的需求。你通常有一组需要排序的信息，例如为了演示。你可以使用\
  \ STL 的 `sort()` 算法对容器进行排序：\n\n对排序范围进行排序和搜索（为了性能）是实际应用中经常出现的需求。你通常有一组需要排序的信息，例如为了演示。你可以使用\
  \ STL 的 `sort()` 算法对容器进行排序：\n\n`sort()` 的版本使用 `less<>` 作为谓词，由该类型实现的 `operator<`。你可以提供自己的谓词来更改排序顺序：\n\
  \n同样，重复项在显示集合之前需要删除。要删除相邻重复的值，使用 `unique()`：\n\n为了快速搜索，STL 提供了 `binary_search()`，它仅对排序后的容器是的：\n\
  \nListing 23.10 展示了 STL 算法：`sort()` 可以排序范围，`binary_search()` 可以搜索排序范围，而 `unique()`\
  \ 可以消除在 `sort()` 操作后相邻的重复元素。\n\n\n\n\n前面的代码首先在第 26 行对样本向量 `vecNames` 进行排序，然后使用第\
  \ 30 行的 `binary_search()` 在其中查找 `\"John\"`。同样地，第 39 行使用 `std::unique()` 来删除相邻重复元素的第二次出现项。请注意，`unique()`\
  \ 像 `remove()` 一样，不会调整容器的大小。它会导致值发生移动，但不会减少元素的总数。为了确保容器末尾不会出现意外或未知的数值，请务必在每次调用 `unique()`\
  \ 之后紧跟使用 `unique()` 返回的迭代器调用 `vector::erase()`，如第 40 行所示。\n\n### 注意事项\n如 `binary_search()`\
  \ 等算法仅在排序过的容器中有效。在未排序的向量上使用此算法可能会导致不人愿的后果。\n\n### 注意\n`stable_sort()` 的用法与你之前看到的\
  \ `sort()` 相同。`stable_sort()` 确保了排序后元素的相对顺序保持不变。保持相对顺序是以牺牲性能为代价的——这是一个需要考虑的因素，特别是当元素的相对顺序并非本质要求时。\n\
  \n### 分区范围\n`std::partition()` 有助于将输入范围划分为两个部分：一个满足一元谓词的部分以及另一个不满足该的部分：\n\n点击此处查看代码图像\n\
  \n```cpp\nbool IsEven (const int& num)  // 一元谓词\n\n{\n    return ((num % 2) == 0);\n\
  }\n\n...\n\npartition (numsInVec.begin(), numsInVec.end(), IsEven);\n```\n\n然而，`std::partition()`\
  \ 并不保证每个分区内元素的相对顺序。当相对顺序很重要时，为了保持这种顺序，你应该使用 `std::stable_partition()`：\n\n点击此处查看代码图像\n\
  \n```cpp\nstable_partition (numsInVec.begin(), numsInVec.end(), IsEven);\n```\n\n\
  列表 23.11 展示了这些算法的用法。\n\n**列表 23.11** 使用 `partition()` 和 `stable_partition()` 将整数范围划分为偶数和奇数值。\n\
  \n点击此处查看代码图像\n\n```cpp\n0: #include <algorithm>\n1: #include <vector>\n2: #include\
  \ <iostream>\n3: using namespace std;\n4:\n5: bool IsEven (const int& num) // 一元谓词\n\
  6: {\n7:     return ((num % 2) == 0);\n8: }\n9:\n10: template <typename T>\n11:\
  \ void DisplayContents(const T& container)\n12: {\n13:     for (auto element = container.cbegin();\n\
  14:             element != container.cend();\n15:             ++ element)\n16: \
  \        cout << *element << ' ';\n17:\n18:     cout << \"| Number of elements:\
  \ \" << container.size() << endl;\n19: }\n20:\n21: int main ()\n22: {\n23:     vector\
  \ <int> numsInVec{ 2017, 0, -1, 42, 10101, 25 };\n24:\n25:     cout << \"The initial\
  \ contents: \" << endl;\n26:     DisplayContents(numsInVec);\n27:\n28:     vector\
  \ <int> vecCopy (numsInVec);\n29:\n30:     cout << \"The effect of using partition():\"\
  \ << endl;\n31:     partition (numsInVec.begin (), numsInVec.end (), IsEven);\n\
  32:     DisplayContents(numsInVec);\n33:\n34:     cout << \"The effect of using\
  \ stable_partition():\" << endl;\n35:     stable_partition (vecCopy.begin (), vecCopy.end\
  \ (), IsEven);\n36:     DisplayContents(vecCopy);\n37:\n38:     return 0;\n39: }\n\
  ```\n\n输出 ![Image](img/arrow.jpg)\n点击此处查看代码图像\nInitial contents:\n2017 0 -1 42 10101\
  \ 25 | Number of elements: 6\nEffect of using partition():\n42 0 -1 2017 10101 25\
  \ | Number of elements: 6\nEffect of using stable_partition():\n0 42 2017 -1 10101\
  \ 25 | Number of elements: 6\n\n分析 ![Image](img/arrow.jpg)\n该代码将 `numsInVec` 包含的整数范围划分为偶值和奇值。这种分区首先通过\
  \ `std::partition()` 完成（如第 31 行所示），然后在第 35 行使用 `stable_partition()` 在副本上重复操作。为了方便比较，你将样本范围\
  \ `numsInVec` 复制到 `vecCopy` 中，前者使用 `partition()` 分区，后者使用 `stable_partition()` 分区。`stable_partition()`\
  \ 而非 `partition` 的效果在输出中显而易见。`stable_partition()` 保持了每个分区内元素的相对顺序。请注意，保持这种顺序是以性能为代价的——如果元素的相对顺序不是必需的，这一点需要牢心中的。\n\
  \n### 注意\n`stable_partition()` 比 `partition()` 慢，因此只有当元素的相对顺序很重要时才应该使用它。\n\n###\
  \ 在排序集合中插入元素\n为了在排序集合的正确位置插入元素，STL 提供了如 `lower_bound()` 和 `upper_bound()` 等函数来满足这一需求：\n\
  \n点击此处查看代码图像\n```cpp\nauto minPos = lower_bound(names.begin(), names.end(), \"Brad\"\
  );\n// 或者是：\nauto maxPos = upper_bound(names.begin(), names.end(), \"Brad\");\n\
  ```\n\n因此，`lower_bound()` 和 `upper_bound()` 返回指向排序范围内可以插入元素的最小最大位置的迭代器。\n\n列表 23.12\
  \ 展示了 `lower_bound()` 在在 `list` 中以最小位置插入元素的用法。\n\n**列表 23.12** 使用 `lower_bound()`\
  \ 和 `upper_bound()` 在排序集合中插入元素\n\n点击此处查看代码图像\n\n```cpp\n0: #include <algorithm>\n\
  1: #include <list>\n2: #include <string>\n3: #include <iostream>\n4: using namespace\
  \ std;\n5:\n6: template <typename T>\n7: void DisplayContents(const T& container)\n\
  8: {\n9:     for (auto element = container.cbegin();\n10:         element != container.cend();\n\
  11:             ++ element)\n12:         cout << *element << endl;\n13: }\n14:\n\
  15: int main ()\n16: {\n17:     list<string> names{ \"John\", \"Brad\", \"jack\"\
  , \"sean\", \"Anna\" };\n18:\n19:     cout << \"Sorted contents of the list are:\
  \ \" << endl;\n20:     names.sort ();\n21:     DisplayContents(names);\n22:\n23:\
  \     cout << \"Lowest index where \\\"Brad\\\" can be inserted is: \";\n24:   \
  \  auto minPos = lower_bound (names.begin(), names.end(), \"Brad\");\n25:     cout\
  \ << distance (names.begin (), minPos) << endl;\n26:\n27:     cout << \"The highest\
  \ index where \\\"Brad\\\" can be inserted is: \";\n28:     auto maxPos = upper_bound\
  \ (names.begin(), names.end(), \"Brad\");\n29:     cout << distance (names.begin\
  \ (), maxPos) << endl;\n30:\n31:     cout << endl;\n32:\n33:     cout << \"List\
  \ after inserting Brad in sorted order: \" << endl;\n34:     names.insert (minPos,\
  \ \"Brad\");\n35:     DisplayContents(names);\n36:\n37:     return 0;\n38: }\n```\n\
  \n输出 ![Image](img/arrow.jpg)\nAnna\nBrad\nJohn\njack\nsean\nLowest index where \"\
  Brad\" can be inserted is: 1\nHighest index where \"Brad\" can be inserted is: 2\n\
  List after inserting Brad in sorted order:\nAnna\nBrad\nBrad\nJohn\njack\nsean\n\
  \n\n\n元素可以插入到有序集合的两个潜在位置：一个由 `lower_bound()` 返回，它是最低位置（最接近集合起始位置的位置）；另一个是由 `upper_bound()`\
  \ 返回的迭代器，它是最高位置（距离集合起始位置最远的位置）。在列表 23.12 中，如果要插入到有序集合的字符串 `\"Brad\"` 已经存在于该集合中，则下界和上界是不同的（否则它们将是相同的）。这些函数的用法分别显示在第\
  \ 24 行和第 29 行。如输出所示，当使用 `lower_bound()` 返回的迭代器在第 35 行所示将字符串插入到 `list` 时，结果是 `list`\
  \ 保持其有序状态。因此，这些算法可以帮助你在集合的某处进行插入，而不破坏内容的有序性。使用 `upper_bound()` 返回的迭代器同样可以正常工作。\n\
  \n* * *\n\n## DO（要做）\n\n**务必**在使用算法 `remove()`、`remove_if()` 或 `unique()` 之后，使用容器的\
  \ `erase()` 成员方法来调整容器大小。\n\n**务必**在使用由 `find()`、`find_if()`、`search()` 或 `search_n()`\
  \ 函数返回的迭代器之前，始终通过与容器的 `end()` 进行比较来检查其有效性。\n\n**仅当**排序元素的相对顺序很重要时，才选择 `stable_partition()`\
  \ 代替 `partition()`，以及选择 `stable_sort()` 代替 `sort()`，因为稳定性版本可能会降低应用程序的性能。\n\n* *\
  \ *\n\n* * *\n\n## DON’T（不要）\n\n**不要**忘记在调用 `unique()` 移除相邻重复值之前，使用 `sort()` 对容器进行排序。`sort()`\
  \ 将确保所有具有相同值的元素相邻排列，从而使 `unique()` 有效。\n\n**不要**在随机选择的位置向有序容器中插入元素，而应使用由 `lower_bound()`\
  \ 或 `upper_bound()` 返回的位置进行插入，以确保元素的有序顺序不受扰动。\n\n**不要**忘记 `binary_search()` 仅用于有序容器。\n\
  \n* * *\n\n### 总结\n\n在本节中，你学习了 STL 最重要且最强大的方面之一：算法。你洞察了不同类型的算法，示例应该让你对算法的应用有更清晰的理解。\n\
  \n### 问答\n\n**Q 我会在关联容器（如 `std::set`）上使用变异算法（例如 `std::transform()`）吗？**\n\n**A**\
  \ 即使这是可行的，也不应该这样做。关联容器的内容应该被视为常数。这是因为关联容器在插入时会对其元素进行排序，且元素的相对位置在 `find()` 等函数中以及容器的效率中起着重要作用。因此，不应在\
  \ STL 集合上使用像 `std::transform()` 这样的变异算法。\n\n**Q 我需要将顺序容器中每个元素的内容设置为特定值。我会用 `std::transform()`\
  \ 完成这项任务吗？**\n\n**A** 虽然可以使用 `std::transform()` 完成这项任务，但 `fill()` 或 `fill_n()` 更适合该任务。\n\
  \n**Q `copy_backward()` 会反转目标容器中元素的内容吗？**\n\n**A** 不。STL 算法 `copy_backward()` 反转的是元素复制的顺序，而不是元素存储的顺序；也就是说，它从范围的末尾开始到达顶部。要反转集合的内容，你应该使用\
  \ `std::reverse()`。\n\n**Q 我应该在 list 上使用 `std::sort()` 吗？**\n\n**A** `std::sort()`\
  \ 可以像在任何顺序容器上一样用在 list 上。然而，list 需要维护一个特殊属性，即对列表的操作不会使现有的迭代器失效——这一属性是 `std::sort()`\
  \ 无法保证的。因此，STL `list` 以成员函数 `list::sort()` 的形式提供了 `sort()` 算法，应该使用它，因为它保证了即使元素在\
  \ list 中的相对位置发生了变化，指向元素的迭代器也不会失效。\n\n**Q 为什么向有序范围插入元素时，使用 `lower_bound()` 或 `upper_bound()`\
  \ 等函数很重要？**\n\n**A** 这些函数分别提供了第一个和最后一个位置，在这些位置可以将元素插入到有序集合而不扰乱排序。\n\n### 工作坊\n\n\
