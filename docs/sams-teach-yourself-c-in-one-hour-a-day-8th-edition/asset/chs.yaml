  \nLambda 表达式的通用语法\nLambda 表达式始终以方括号开始，并可以使用逗号配置多个状态变量：点击此处查看代码图像\n\n```cpp\nstate1,\
  \ state2 { // \n``` \n\n如果你想确保 lambda 内部可以修改状态变量，请添加 `mutable` 关键字：点击此处查看代码图像\n\n\
  ```cpp\nstate1, state2 mutable { //\n```\n\n如果你想让 lambda 对状态变量的修改在外部也有效，请使用引用：点击此处查看代码图像\n\
  \n```cpp\n&state1, &state2 { // \n```\n\nLambda 可以接受多个输入参数，并用逗号分隔：点击此处查看代码图像\n\n\
  ```cpp\nstate1, state2 { // \n```\n\n如果你想指定返回类型而不是让编译器推断，请使用 `->`，如下：点击此处查看代码图像\n\
  \n```cpp\nstate1, state2 -> ReturnType\n```\n\n最后，复合语句 `{}` 可以包含多个语句，每个语句之间用 `;`\
  \ 分隔，如下：点击此处查看代码图像\n\n```cpp\nstate1, state2 -> ReturnType\n{\n    Statement 1;\n\
  \    Statement 2;\n    return (value or expression);\n}\n```\n\n### 注意\n如果你的 lambda\
  \ 表达式跨越多行，你需要提供显式的返回类型。列表 22.5 在本节后面演示了一个指定返回类型并跨越多行的 lambda 函数。\n\n因此，lambda 函数是如下函数对象的紧凑且完全的功能替代品：点击此处查看代码图像\n\
  \n```cpp\ntemplate<typename Type1, typename Type2>\nstruct IsTooLong\n{\n    //\
  \ 状态变量\n    Type1 var1;\n    Type2 var2;\n    // 构造函数\n    IsTooLong(const Type1&\
  \ in1, Type2& in2): var1(in1), var2(in2) {};\n\n//实际用途\n    ReturnType operator()\n\
  \    {\n        Statement 1;\n        Statement 2;\n        return (value or expression);\n\
  \    }\n};\n```\n\n### 二元函数的 Lambda 表达式\n二元函数接受两个参数并可选地返回一个值。相同的 lambda 表达式为点击此处查看代码图像\n\
  \n```cpp\n... { // \n```\n\n使用 `std::transform()` 逐元素相乘两个大小相同的 vector 并结果存储在第三个\
  \ vector 中的 lambda 函数显示在列表 22.4 中。\n\n\n\n\n\n```cpp\n#include <vector>\n#include\
  \ <iostream>\n#include <algorithm>\n\nint main ()\n{\n    using namespace std;\n\
  \n    vector <int> vecMultiplicand{ 0, 1, 2, 3, 4 };\n    vector <int> vecMultiplier{\
  \ 100, 101, 102, 103, 104 };\n\n    // Holds the result of multiplication\n    vector\
  \ <int> vecResult;\n\n    // Make space for the result of the multiplication\n \
  \   vecResult.resize(vecMultiplier.size());\n\n    transform (vecMultiplicand.begin\
  \ (), // range of multiplicands\n              vecMultiplicand.end (), // end of\
  \ range\n              vecMultiplier.begin (),  // multiplier values\n         \
  \     vecResult.begin (), // range that holds result\n              [](int a, int\
  \ b) {return a * b; });  // lambda\n\n    cout << \"The contents of the first vector\
  \ are: \" << endl;\n    for (size_t index = 0; index < vecMultiplicand.size(); ++index)\n\
  \    cout << vecMultiplicand[index] << ' ';\n    cout << endl;\n\n    cout << \"\
  The contents of the second vector are: \" << endl;\n    for (size_t index = 0; index\
  \ < vecMultiplier.size(); ++index)\n    cout << vecMultiplier[index] << ' ';\n \
  \   cout << endl;\n\n    cout << \"The result of the multiplication is: \" << endl;\n\
  \    for (size_t index = 0; index < vecResult.size(); ++index)\n    cout << vecResult[index]\
  \ << ' ';\n\n    return 0;\n}\n```\n\n***\n\n输出 ![Image](img/arrow.jpg)\n\n点击此处查看代码图像\n\
  \n第一个向量的内容为：\n0 1 2 3 4\n\n第二个向量的内容为：\n100 101 102 103 104\n\n乘法结果为：\n0 101 204\
  \ 309 416\n\n### 分析 ![Image](img/arrow.jpg)\n\n上述 lambda 表达式在第 17 行作为 `std::transform()`\
  \ 的参数显示。该算法接受两个范围作为输入，并应用包含在二元函数中的转换算法。二元函数的返回值存储在目标容器中。这个二元函数是一个 lambda 表达式，它接受两个整数作为输入并通过返回值返回乘法结果。该返回值由\
  \ `std::transform()` 存储在 `vecResult` 中。输出了两个容器的内容以及它们逐个元素相乘的结果。\n\n***\n\n### 笔记\n\
  \n列表 22.4 展示了列表 21.5 中函数对象 `class Multiply<>` 的 lambda 等效实现。\n\n***\n\n### 用于二元谓词的\
  \ Lambda 表达式\n\n返回 `true` 或 `false` 以帮助决策的二元函数被称为 `二元谓词`。这些谓词被用于排序算法，例如 `std::sort()`，该算法会为容器中的任意两个值调用二元谓词，以确定哪一个应该放在另一个后面。二元谓词的通用语法为：\n\
  \n点击此处查看代码图像\n\n... { return bool; } 列表 22.5 展示了一个用于排序的 lambda 表达式。\n\n#### 列表 22.5\
  \ 作为 `std::sort()` 中的谓词实现忽略大小写排序的 Lambda 表达式\n\n点击此处查看代码图像\n\n```cpp\n#include <algorithm>\n\
  #include <string>\n#include <vector>\n#include <iostream>\nusing namespace std;\n\
  \ntemplate <typename T>\nvoid DisplayContents (const T& input)\n{\n    for (auto\
  \ element = input.begin(); element != input.cend(); ++ element )\n        cout <<\
  \ *element << endl;\n}\n\nint main ()\n{\n    vector <string> namesInVec{ \"jim\"\
  , \"Jack\", \"Sam\", \"Anna\" };\n\n    cout << \"按插入顺序的向量中的名称: \" << endl;\n  \
  \  DisplayContents(namesInVec);\n\n    cout << \"区分大小写排序后的顺序: \" << endl;\n    sort(namesInVec.begin(),\
  \ namesInVec.end());\n    DisplayContents(namesInVec);\n\n    cout << \"忽略大小写排序后的顺序:\"\
  \ << endl;\n    sort(namesInVec.begin(), namesInVec.end(),\n          [](const string&\
  \ str1, const string& str2) -> bool // lambda\n          {\n            string str1LC;\
  \ // LC = 小写\n\n            // 分配空间\n            str1LC.resize (str1.size()));\n\
  \n            // 将每个字符转换为小写\n            transform(str1.begin(), str1.end(), str1LC.begin(),::tolower);\n\
  \n            string str2LC;\n            str2LC.resize (str2.size()));\n      \
  \      transform(str2.begin(), str2.end(), str2LC.begin(),::tolower);\n\n      \
  \      return (str1LC < str2LC);\n          } // lambda 结束\n        ); // sort 结束\n\
  \n    DisplayContents(namesInVec);\n\n    return 0;\n}\n```\n\n***\n\n输出 ![Image](img/arrow.jpg)\n\
  \n按插入顺序的向量中的名称：\njim\nJack\nSam\nAnna\n\n区分大小写排序后的顺序：\nAnna\nJack\nSam\njim\n\n\
  忽略大小写排序后的顺序：\nAnna\nJack\njim\nSam\n\n\n\n\n\n在本节中，你学习了 C++11 引入的一项重要特性：lambda 表达式。你看到了\
  \ lambda 基本上是无名的函数对象，它们可以接受参数、拥有状态、有返回值，并且可以是多行的。你学习了如何在 STL 算法中使用 lambda 代替函数对象，从而帮助\
  \ `find()`、`sort()` 或 `transform()` 等函数。lambda 让 C++ 编程变得快速且高效，你应该在适用的地方尝试使用它们。\n\
  \n### 问答\n\n**Q：我应该总是优先使用 lambda 而不是函数对象吗？**\n\n**A** 正如 列表 22.5 所示，跨越多行的 lambda\
  \ 可能无法像易于重用的函数对象那样帮助提高编程效率。\n\n**Q：lambda 的状态参数是如何传递的？按值传递还是按引用传递？**\n\n**A** 当按照如下捕获列表编写\
  \ lambda 时：\n\n点击此处此处查看代码图像\n\n```cpp\nVar1, Var2, ... N { ...expression ;}\n```\n\
  \n状态参数 `Var1` 和 `Var2` 被拷贝了（而不是作为引用提供）。如果你想让它们作为引用参数，则使用此语法：\n\n点击此处查看代码图像\n\n```cpp\n\
  &Var1, &Var2, ... &N { ...expression ;}\n```\n\n在这种情况下，你需要格外小心，因为在捕获列表中提供的状态变量的修改会在\
  \ lambda 外部继续生效。\n\n**Q：我可以在 lambda 中使用函数中的局部变量吗？**\n\n**A** 你可以在捕获列表中传递局部变量：\n\n\
  点击此处查看代码图像\n\n```cpp\nVar1, Var2, ... N { ...expression ;}\n```\n\n如果你想捕获所有变量，可以使用此语法：\n\
  \n点击此处查看代码图像\n\n```cpp\n= { ...expression ;}\n```\n\n### 工作坊\n\n工作坊提供了测题，帮助你巩固对所涵盖内容的理解，并提供了练习以提供使用所学知识的经验。在检查\
