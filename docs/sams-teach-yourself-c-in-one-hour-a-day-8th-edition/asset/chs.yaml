  \ const*`，如第 38 行到 41 行所示。此运算符使得使用 `MyString` 更加容易，如第 55 行所示。\n\n### 警告\n\n在实现管理动态分配资源（如数组）的类时，务必确保你已经实现了（或评估了）拷贝构造函数和拷贝赋值运算符。除非你解决了拷贝时的所有权问题，否则你的类是不完整的，并危及程序的稳定性。\n\
  \n### 提示\n\n创建一个不可拷贝的类，可以将拷贝构造函数和拷贝赋值运算符声明为 `private`。声明为 `private` 就足够让编译器在通过值传递或将一个实例赋值另一个时报错。\n\
  \n#### 下标运算符 (`[]`)\n\n允许对类进行数组风格 `[]` 访问的运算符被称为下标运算符。下标运算符的典型语法为：\n\n点击此处查看代码图片\n\
  \n```cpp\nreturn_type& operator [] (subscript_type& subscript);\n```\n\n因此，当你创建一个像\
  \ `MyString` 这样封装在 `char* buffer` 中的动态字符数组的类时，下标运算符可以非常容易地随机访问缓冲区中的单个字符：\n\n点击此处查看代码图片\n\
  \n```cpp\nclass MyString\n{\n    // ... 其他类成员\npublic:\n    /*const*/ char& operator\
  \ [] (int index) /*const*/\n    {\n        // 返回缓冲区中位置为 index 的字符\n    }\n};\n```\n\
  \n列表 12.9 中的示例演示了下标运算符（`[]`）如何帮助用户使用标准的数组语义遍历 `MyString` 实例包含的字符。\n\n\n\n\n\n```cpp\n\
  using namespace std;\n\nclass MyString\n{\nprivate:\n    char* buffer;\n\n    //\
  \ 私有默认构造函数\n    MyString() {}\n\npublic:\n    // 构造函数\n    MyString(const char*\
  \ initialInput)\n    {\n        if(initialInput != NULL)\n        {\n          \
  \  buffer = new char [strlen(initialInput) + 1];\n            strcpy(buffer, initialInput);\n\
  \        }\n        else\n            buffer = NULL;\n    }\n\n    // 拷贝构造函数：在此处插入列表\
  \ 9.9\n    MyString(const MyString& copySource);\n\n    // 拷贝赋值运算符：在此处插入列表 12.8\n\
  \    MyString& operator= (const MyString& copySource);\n\n    const char& operator[]\
  \ (int index) const\n    {\n        if (index < GetLength())\n            return\
  \ buffer[index];\n    }\n\n    // 析构函数\n    ~MyString()\n    {\n        if (buffer\
  \ != NULL)\n            delete [] buffer;\n    }\n\n    int GetLength() const\n\
  \    {\n        return strlen(buffer);\n    }\n\n    operator const char*()\n  \
  \  {\n        return buffer;\n    }\n};\n\nint main()\n{\n    cout << \"Type a statement:\
  \ \";\n    string strInput;\n    getline(cin, strInput);\n\n    MyString youSaid(strInput.c_str());\n\
  \n    cout << \"Using operator[] for displaying your input: \" << endl;\n    for(int\
  \ index = 0; index < youSaid.GetLength(); ++index)\n        cout << youSaid[index]\
  \ << \" \";\n    cout << endl;\n\n    cout << \"Enter index 0 - \" << youSaid.GetLength()\
  \ - 1 << \": \";\n    int index = 0;\n    cin >> index;\n    cout << \"Input character\
  \ at zero-based position: \" << index;\n    cout << \" is: \" << youSaid[index]\
  \ << endl;\n    return 0;\n}\n```\n\n### 分析\n\n```\nType a statement: Hello\nUsing\
  \ operator[] for displaying your input: H e l l o \nEnter index 0 - 4: 2 is: l\n\
  ```\n\n这是一个简单的趣味程序，它接收句子作为输入，如第 61 行所示构造一个 `MyString` 对象，然后如第 64 行和 65 行所示，利用下标运算符（`[]`）通过\
  \ `for` 循环逐字符打印字符串。运算符（`[]`）本身定义在第 31 行到 35 行，并在确保请求的位置未超出 `buffer` 范围后，提供了直接访问指定位置字符的功能。\n\
  \n### 注意事项\n\n即使在编写运算符时，使用 `const` 关键字也是重要的。注意列表 12.9 如何将下标运算符 `[]` 的返回值限制为 `const\
  \ char&`。虽然该程序在没有 `const` 关键字的情况下也能运行和编译，但你之所以在那里使用它是为了避免此类代码的出现：\n\n```\nMyString\
  \ sayHello(\"Hello World\");\nsayHello[2] = 'k'; //错误：operator[] 是 const\n```\n\n\
  通过使用 `const`，你正在保护内部成员 `MyString::buffer` 不受外部通过 `operator []` 的直接修改。除了将返回值归类为 `const`\
  \ 之外，你还将将运算符函数类型限制为 `const`，以确保它无法修改类的属性。通常，请使用尽可能可能的 `const` 限制来避免无意的数据修改并增强对类属性的保护。\n\
  \n在实现下标运算符时，你可以对列表 12.9 显示的版本进行改进。该版本是单个下标运算符的实现，它同时适用于读取和写入动态数组中的槽位。然而，你可以实现两个下标运算符——一个作为\
  \ `const` 函数，另一个是非 `const` 函数：\n\n```cpp\nchar& operator [] (int index); // 用于写入/更改\
  \ index 处的 buffer\nconst char& operator [] (int index) const; //仅用于读取\n```\n\n编译器将为读取操作调用\
  \ `const` 函数，为写入操作调用非 `const` 版本。本节中未进一步讨论的其他二元运算符（如表 12.2 所示）也可以被重定义或重载，但它们的实现方式与已讨论的相似。\n\
  \n其他运算符，如逻辑运算符和位运算符，如果类的目的可以通过它们得到增强，则需要编写。显然，像 `Date` 这样的日历类并不一定需要逻辑运算符，而执行字符串和数字函数的类可能频繁需要。在重载运算符或编写新运算符时，请记住类的目标及其用途。\n\
  \n### 函数运算符 `()`\n\n使对象表现像函数的 `()` 运算符被称为函数运算符。它们在标准模板库 (STL) 中应用广泛，通常用于 STL 算法。它们的用法包括做出决策；根据它们处理的操作数数量，此类函数对象通常称为*一元谓词*或*二元谓词*。列表\
  \ 12.10 分析了一个非常简单的函数对象，以便你先理解为什么会有如此有趣的名称！\n\n**列表 12.10 使用运算符 `()` 创建的函数对象**\n\n\
  ```cpp\n#include <iostream>\n#include <string>\nusing namespace std;\n\nclass Display\n\
  {\npublic:\n    void operator () (string input) const\n    {\n        cout << input\
  \ << endl;\n    }\n};\n\nint main ()\n{\n    Display displayFuncObj;\n\n    // 等同于\
  \ displayFuncObj.operator () (\"Display this string!\");\n    displayFuncObj (\"\
  Display this string!\");\n\n    return 0;\n}\n```\n\n### 用于高性能编程的移动构造函数和移动赋值运算符\n\
  \n移动构造函数和移动赋值运算符是成为 C++11 标准的性能优化特性，确保了临时值（在语句结束后不再存在的*右值*）不会被被浪费地拷贝。这在处理管理动态分配资源的类（例如动态数组类或字符串类）时特别有用。\n\
  \n\n\n\n\n```cpp\nMyString Hello(\"Hello \");\nMyString World(\"World\");\nMyString\
  \ CPP(\" of C++\");\nMyString sayHello(Hello + World + CPP);  // operator+, 构造函数\n\
  MyString sayHelloAgain (\"overwrite this\");\nsayHelloAgain = Hello + World + CPP;\
  \  // operator+, 构造函数, 拷贝赋值运算符=\n```\n\n这种让三个字符串拼接变得简单的结构使用了二元加运算符 `operator+`：\n\
  \n点击此处查看代码图片\n\n```cpp\nMyString operator+ (const MyString& addThis)\n{\n    MyString\
  \ newStr;\n    if (addThis.buffer != NULL)\n    {\n        // 拷贝到 newStr\n    }\n\
  \    return newStr;  // 按值返回，调用拷贝构造函数\n}\n```\n\n虽然使字符串拼接变得简单，但加法运算符 `operator+`\
  \ 可能会导致性能问题。创建 `sayHello` 需要执行两次加法运算符。每次执行 `operator+` 都会导致创建一个临时副本，因为 `MyString`\
  \ 是按值返回的，从而导致了拷贝构造函数的执行。拷贝构造函数执行深拷贝——拷贝到一个在表达式执行后就不存在的临时值。因此，这个表达式产生了临时副本（对于纯主义者来说是右值），这些副本在语句后不再需要，因此是\
  \ C++ 强制导致的性能瓶颈。好吧，至少最近是如此。\n\n这个问题终于在 C++11 中得到了解决，编译器现在专门识别临时对象，并使用程序员提供的移动构造函数和移动赋值运算符。\n\
  \n### 声明移动构造函数和移动赋值运算符\n\n移动构造函数的语法如下：\n\n点击此处查看代码图片\n\n```cpp\nclass Sample\n{\n\
  private:\n    Type* ptrResource;\npublic:\n    Sample(Sample&& moveSource) // 移动构造函数，注意\
  \ &&\n    {\n        ptrResource = moveSource.ptrResource; // 获取所有权，开始移动\n     \
  \   moveSource.ptrResource = NULL;\n    }\n    Sample& operator= (Sample&& moveSource)//移动赋值运算符，注意\
  \ &&\n    {\n        if(this != &moveSource)\n        {\n            delete [] ptrResource;\
  \  //释放自己的资源\n            ptrResource = moveSource.ptrResource;  // 获取所有权，开始移动\n\
  \            moveSource.ptrResource = NULL;  // 释放移动源的所有权\n        }\n    }\n  \
  \  Sample(); // 默认构造函数\n    Sample(const Sample& copySource); // 拷贝构造函数\n    Sample&\
  \ operator= (const Sample& copySource); // 拷贝赋值\n};\n```\n\n因此，移动构造函数和赋值运算符的声明与普通的拷贝构造函数和拷贝赋值运算符的区别在于输入参数类型为\
  \ `Sample&&`。此外，由于输入参数是移动源，它不能是 `const` 参数，因为它会被修改。返回值保持，因为它们分别是构造函数和赋值运算符的重载版本。\n\
  \n符合 C++11 标准的编译器确保对于右值临时对象使用移动构造函数而不是拷贝构造函数，并调用移动赋值运算符而不是拷贝赋值运算符。在实现这两个函数时，你确保不是在拷贝，而是简单地将资源从源移动到目标。列表\
  \ 12.11 证明了这两项新特性在优化 `class MyString` 方面的有效性。\n\n**列表 12.11** 除了拷贝构造函数和拷贝赋值运算符外，还带有移动构造函数和移动赋值运算符的\
  \ `class MyString`\n\n点击此处查看代码图片\n\n```cpp\n0: #include <iostream>\n1: #include\
  \ <string.h>\n2: using namespace std;\n3: class MyString\n4: {\n5: private:\n6:\
  \     char* buffer;\n7:\n8:     MyString(): buffer(NULL) // 私有默认构造函数\n9:     {\n\
  10:         cout << \"Default constructor called\" << endl;\n11:     }\n12: \n13:\
  \ public:\n14:     MyString(const char* initialInput) // 构造函数\n15:     {\n16:  \
  \       cout << \"Constructor for: \" << initialInput << endl;\n17:         if(initialInput\
  \ != NULL)\n18:         {\n19:             buffer = new char [strlen(initialInput)\
  \ + 1];\n20:             strcpy(buffer, initialInput);\n21:         }\n22:     \
  \    else\n23:             buffer = NULL;\n24:     }\n25: \n26:     MyString(MyString&&\
  \ moveSrc) // 移动构造函数\n27:     {\n28:         cout << \"Move constructor moves: \"\
  \ << moveSrc.buffer << endl;\n29:         if(moveSrc.buffer != NULL)\n30:      \
  \   {\n31:             buffer = moveSrc.buffer; // 获取所有权，即“移动'\n32:            \
  \ moveSrc.buffer = NULL;  // 释放移动源\n33:         }\n34:     }\n35: \n36:     MyString&\
  \ operator= (MyString&& moveSrc) // 移动赋值.\n37:     {\n38:         cout << \"Move\
  \ assignment op. moves: \" << moveSrc.buffer << endl;\n39:         if((moveSrc.buffer\
  \ != NULL) && (this != &moveSrc))\n40:         {\n41:             delete[] buffer;\
  \ // 释放自己的 buffer\n42: \n43:             buffer = moveSrc.buffer; // 获取所有权，即“移动”\n\
  44:             moveSrc.buffer = NULL;  // 释放移动源\n45:         }\n46: \n47:     \
  \    return *this;\n48:     }\n49: \n50:     MyString(const MyString& copySrc) //\
  \ 拷贝构造函数\n51:     {\n52:         cout << \"Copy constructor copies: \" << copySrc.buffer\
  \ << endl;\n53:         if (copySrc.buffer != NULL)\n54:         {\n55:        \
  \     buffer = new char[strlen(copySrc.buffer) + 1];\n56:             strcpy(buffer,\
  \ copySrc.buffer);\n57:         }\n58:         else\n59:             buffer = NULL;\n\
  60:     }\n61: \n62:     MyString& operator= (const MyString& copySrc) // 拷贝赋值.\n\
  63:     {\n64:         cout << \"Copy assignment op. copies: \" << copySrc.buffer\
  \ << endl;\n65:         if ((this != &copySrc) && (copySrc.buffer != NULL))\n66:\
  \         {\n67:             if (buffer != NULL)\n68:             delete[] buffer;\n\
  69: \n70:             buffer = new char[strlen(copySrc.buffer) + 1];\n71:      \
  \       strcpy(buffer, copySrc.buffer);\n72:         }\n73: \n74:         return\
  \ *this;\n75:     }\n76: \n77:     ~MyString() // 析构函数\n78:     {\n79:         if\
  \ (buffer != NULL)\n80:             delete[] buffer;\n81:     }\n82: \n83:     int\
