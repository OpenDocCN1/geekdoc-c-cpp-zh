  \ `switch-case` 等效版本，它告诉星期几是用什么星命名的，并使用了枚举常量。\n\n**列表 6.5** 使用 `switch-case`、`break`\
  \ 和 `default` 查找星期几是用什么星命名的\n\n点击此处查看代码图像\n\n* *\n\n```cpp\n  0: #include <iostream>\n\
