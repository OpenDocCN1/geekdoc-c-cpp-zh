  \ `vector` 等容器中的值添加一个用户指定的值。\n\n## 第 23 节 STL 算法\n\n标准模板库 (STL) 的重要部分是一组通用函数，这些函数由头文件\
  \ `<algorithm>` 提供，帮助操作或处理容器的内容。在本节中，你将学习算法的用法，这些算法通过减少样板代码来帮助：\n\n- ![Image](img/square.jpg)\
  \ 对容器进行计数、搜索、查找、拷贝和删除元素\n- ![Image](img/square.jpg) 将范围内元素的值设置为生成器函数的返回值或预定义常量\n\
  - ![Image](img/square.jpg) 对范围内的元素进行排序或分区\n- ![Image](img/square.jpg) 在排序后的范围内的正确位置插入元素\n\
  \n### 什么是 STL 算法？\n\n查找、搜索、删除和计数是一些在广泛程序中都有应用的通用算法活动。STL 以通用模板函数的形式解决了这些以及许多其他需求，这些函数通过迭代器在容器上工作。要使用\
  \ STL 算法，程序员首先必须包含 `<algorithm>` 头文件。\n\n注意：虽然大多数算法都是通过容器上的迭代器运行的，但并非所有算法都一定在容器上运行，因此并非所有算法都需要迭代器。某些算法（例如\
  \ `swap()`）只需接受一对值并进行交换。同样，`min()` 和 `max()` 也直接对值进行操作。\n\n### STL 算法的分类\n\nSTL\
  \ 算法大致分为两类：非变算法和变异算法。\n\n#### 非变算法\n\n既不改变容器顺序也不改变内容的算法被称为 `非变算法`。一些主要的非变算法显示在 表\
  \ 23.1 中。\n\n![Image](img/23tab01.jpg)\n**表 23.1** 非变算法快速参考\n\n#### 变异算法\n\n变异算法是那些改变其所操作序列的内容或顺序的算法。STL\
  \ 提供的一些最有用的变异算法显示在 表 23.2 中。\n\n![Image](img/23tab02.jpg)![Image](img/square.jpg)\n\
  **表 23.2** 变异算法快速参考\n\n### STL 算法的用法\n\n查找、搜索、删除和计数是一些在广泛程序中都有应用的通用算法活动。STL 以通用模板函数的形式解决了这些以及许多其他需求，这些函数通过迭代器在容器上工作。要使用\
  \ STL 算法，程序员首先必须包含 `<algorithm>` 头文件。\n\n注意：虽然大多数算法都是通过容器上的迭代器运行的，但并非所有算法都一定在容器上运行，因此并非所有算法都需要迭代器。某些算法（例如\
  \ `swap()`）只需接受一对值并进行交换。同样，`min()` 和 `max()` 也直接对值进行操作。\n\nSTL 算法的用法\n\n在 23.1 和\
  \ 23.2 中提到的 STL 算法用法最好通过实践来学习。\n\n#### 给定值查找元素\n\n给定如 `vector` 的容器，STL 算法 `find()`\
  \ 和 `find_if()` 分别帮助你查找值或满足条件的元素。`find()` 的用法如下：\n\n```cpp\nauto element = find\
  \ (numsInVec.cbegin(), // 范围\n                    numsInVec.cend(),   // 结束\n  \
  \                  numToFind);          // 要查找元素\n```\n\n`find_if()` 类似，它要求提供一个一元谓词（返回\
  \ `true` 或 `false` 的函数）作为第三参数。\n\n```cpp\nauto evenNum = find_if (numsInVec.cbegin(),\
  \ // 范围\n                       numsInVec.cend(),    // 结束\n                   \
  \    [](int element) { return (element % 2) == 0; );\n```\n\n因此，两个查找函数都返回迭代器，你需要将其与容器的\
  \ `end()` 或 `cend()` 进行比较以验证查找操作是否成功。如果检查通过，你可以使用该迭代器。列表 23.1 展示了如何使用 `find()` 在\
  \ vector 中查找值，以及使用 `find_if()` 查找第一个偶数。\n\n**列表 23.1** 在 `vector` 中使用 `find()` 查找整数值，在\
  \ lambda 表达式中使用 `find_if` 根据一元谓词查找第一个数字\n\n```cpp\n#include <iostream>\n#include\
  \ <algorithm>\n#include <vector>\n\nint main()\n{\n    using namespace std;\n  \
  \  vector<int> numsInVec{ 2017, 0, -1, 42, 10101, 25 };\n\n    cout << \"在集合中查找数字：\"\
  ;\n    int numToFind = 0;\n    cin >> numToFind;\n\n    auto element = find (numsInVec.cbegin\
  \ (), // 范围开始\n                        numsInVec.cend(),   // 范围结束\n           \
  \             numToFind);          // 要查找元素\n\n    // 检查 find 是否成功\n    if (element\
  \ != numsInVec.cend ())\n        cout << \"找到值 \" << *element << \"!\" << endl;\n\
  \    else\n        cout << \"没有元素包含值 \" << numToFind << endl;\n\n    cout << \"\
  使用 find_if 查找第一个偶数: \" << endl;\n\n    auto evenNum = find_if (numsInVec.cbegin(),\
  \ // 范围开始\n                           numsInVec.cend(),    // 范围结束\n           \
  \                [](int element) { return (element % 2) == 0; });\n\n    if (evenNum\
  \ != numsInVec.cend())\n        cout << \"找到值 \" << *evenNum << \"!\" << endl;\n\
  }\n```\n\n\n\n\n\n```cpp\n[](int element) { return (element % 2) == 0; } );\n\n\
  if (evenNum != numsInVec.cend ())\n{\n    cout << \"Number '\" << *evenNum << \"\
  ' found at position [\";\n    cout << distance (numsInVec.cbegin (), evenNum) <<\
  \ \"]\" << endl;\n}\n\n    return 0;\n}\n```\n\n输出 ![Image](img/arrow.jpg)\n\n点击此处查看代码图像\n\
