  \ `u2` 用于存储一个 `char`（且 `char` 比 `int` 小）。这是因为编译器为联合体预留的内存量等于其包含的最大对象所消耗的内存量。第 9–25\
  \ 行定义的结构体 `ComplexType` 实际上包含一个枚举 `DataType`，它用于指示存储在联合体中的对象的性质，此外还有一个数据成员是一个名为\
  \ `Value` 的 `union`（联合体）。这种由用于存储类型信息的枚举的 `struct` 和用于存储值的 `union` 组成的组合是联合体的一种流行应用。例如，在\
  \ Windows 应用程序编程中广泛使用的 `VARIANT` 结构体遵循类似的方法。第 27–39 行定义的函数 `DisplayComplexType()`\
  \ 使用了这种组合，它在提供的 `switch-case` 结构中执行相应的 `case` 时使用了该枚举。例如，我们在联合体中包含了一个构造函数和析构函数——考虑到联合体包含简单旧数据类型（Plain-Old-Data\
  \ types），这些在 Listing 9.16 中可选的，但如果联合体包含另一个用户定义的类型（如 `class` 或 `struct`），则可能是需要的。\n\
