  \n第 22 到 55 行中包含了 `switch-case` 结构，根据用户输入的 `dayInput` 产生不同的输出。当用户输入 5 时，`switch`\
  \ 检查 `Sunday`（值 0）到 `Thursday`（值 4）的前四个标签，跳过了它们下面的代码。它到达 `Friday`，此时表达式 5 等于枚举常量\
  \ `Friday`。因此，它执行 `Friday` 下的代码，直到遇到 `break`。第二次运行时，当输入无效值时，执行到达 `default` 并运行其代码。\n\
  \n与列表 6.4 使用 `if-else-if` 结构产生的输出完全相同。然而，`switch-case` 版本看起来更有结构性，并且可能适用于不仅仅是在屏幕上写一行的情况（你可以在大括号内编写代码）。\n\
  \n### 使用 `?:` 进行条件执行\n\nC++ 有一种有趣强大的运算符运算符条件运算符，它类似于紧凑的 `if-else` 结构。条件运算符称为三元运算符，因为它有三个操作数：\n\
  \n点击此处查看代码图像\n\n```cpp\n(条件表达式求值为 bool) ? expression1 如果真 : expression2 如果假;\n```\n\
  \n这种运算符可以紧凑地评估两个数字的最大值，如下：\n\n点击此处查看代码图像\n\n```cpp\nint max = (num1 > num2)? num1\
  \ : num2; // max 包含 num1 和 num2 中的较大值\n```\n\n列表 6.6 是使用运算符 (`?:`) 进行条件处理的演示。\n\n\
  ```cpp\n  0: #include <iostream>\n  1: using namespace std;\n  2:\n  3: int main()\n\
  \  4: {\n  5:     cout << \"输入两个数字\" << endl;\n  6:     int num1 = 0, num2 = 0;\n\
  \  7:     cin >> num1;\n  8:     cin >> num2;\n  9:\n  10:    int max = (num1 >\
  \ num2)? num1 : num2;\n  11:    cout << \"The greater of \" << num1 << \" and \"\
  \ << num2 << \" is \" << max << endl;\n  12: }\n```\n\n\n\n\n\n```cpp\n12:     \
  \ << num2 << \" is: \" << max << endl;\n13:\n14:    return 0;\n15: }\n```\n\nOutput\
  \ ![Image](img/arrow.jpg)\n\n点击此处查看代码图像\n\n输入两个数字\n\n365\n-1\n\n365 和 -1 中的较大值是：365\n\
  \n分析 ![Image](img/arrow.jpg)\n\n第 10 行是重点关注的代码。它包含一个紧凑的语句，用于判断输入的两个数字中哪一个较大。这一行是用\
  \ `if-else` 实现以下代码的另一种方式：\n\n点击此处查看代码图像\n\n```cpp\nint max;\n\nif (num1 > num2)\n\
  \    max = num1;\nelse\n    max = num2;\n```\n\n因此，条件运算符节省了数行代码！然而，减少代码行数不应该是首要任务。有些程序员倾向于使用条件运算符，而另人则不然。以易于理解的方式编写条件运算符是非常重要的。\n\
  \n#### 应该 (DO)\n\n**应该**在 `switch` 表达式中使用枚举值来提高代码的可读性。\n\n**应该**记得处理 `default`，除非被认为完全没有必要。\n\
  \n**应该**检查是否无意中忘记在每个 `case` 语句中插入了 `break`。\n\n### 不要 (DON’T)\n\n**不要**添加两个具有相同标签的\
  \ `case` —— 这没有意义且无法通过编译。\n\n**不要**通过包含不带 `break` 的 `case` 并依赖其执行顺序来使你的 `case` 语句复杂化。当你将来移动这些\
  \ `case` 语句时，如果对执行顺序没有足够的关注，这将会破坏功能的完整性。\n\n**不要**在使用条件运算符（`?:`）时使用复杂的条件或表达式。\n\n\
  ### 提示 (Tip)\n\nC++17 预计引入使用 `if constexpr` 进行条件编译，以及在 `if` 和 `switch` 结构中的初始化。请在\
  \ 第 29  “向前展望.”中学习更多这些特性。\n\n### 在循环中执行代码\n\n到目前，你已经看到如何让程序在某些变量包含不同值时表现出不同的行为——例如在\
  \ 列表 6.1 中，当用户按下 *m* 时我们执行乘法；否则执行加法。然而，如果用户不想让程序直接结束呢？如果他想执行另一个加法或乘法运算，或者再执行五次呢？这时你需要重复执行已存在的代码。\n\
  \n这就是你需要编写一个循环的时候。\n\n#### 使用 `goto` 的初级循环\n\n如名所示，`goto` 指令执行从代码中特定的、带有标签的点继续。你可以使用它回回并重新执行某些语句。\n\
  \n`goto` 语句的语法为：\n\n点击此处查看代码图像\n\n```cpp\nSomeFunction()\n{\n    Start: // 称为标签\n\
  \    CodeThatRepeats;\n    goto Start;\n}\n```\n\n你声明了一个名为 `Start` 的标签，并使用 `goto`\
  \ 从此点开始重复执行，如 列表 6.7 所示。除非你在调用 `goto` 时提供的条件在某些情况下可以求值为 `false`，或者除非重复的代码中包含一个在特定条件下执行的\
  \ `return` 语句，否则 `goto` 命令与标签之间的代码段将无限重复，并使程序无法结束。\n\n**列表 6.7** 使用 `goto` 询问用户是否想要重复计算\n\
  \n点击此处查看代码图像\n\n```cpp\n0: #include <iostream>\n1: using namespace std;\n2:\n3:\
  \ int main()\n4: {\n5: Start:\n6:     int num1 = 0, num2 = 0;\n7:\n8:     cout <<\
  \ \"Enter two integers: \" << endl;\n9:     cin >> num1;\n10:     cin >> num2;\n\
  11:\n12:     cout << num1 << \" x \" << num2 << \" = \" << num1 * num2 << endl;\n\
  13:     cout << num1 << \" + \" << num2 << \" = \" << num1 + num2 << endl;\n14:\n\
  15:     cout << \"Do you wish to perform another operation (y/n)?\" << endl;\n16:\
  \     char repeat = 'y';\n17:     cin >> repeat;\n18:     if (repeat == 'y')\n19:\
  \     goto Start;\n20:     cout << \"Goodbye!\" << endl;\n21:     return 0;\n22:\
  \ }\n```\n\nOutput ![Image](img/arrow.jpg)\n\n点击此处查看代码图像\n\n输入两个整数:\n56\n25\n56\
  \ x 25 = 1400\n56 + 25 = 81\nDo you wish to perform another operation (y/n)?\ny\n\
  输入两个整数:\n95\n-47\n95 x -47 = -4465\n95 + -47 = 48\nDo you wish to perform another\
  \ operation (y/n)?\nn\nGoodbye!\n\n\n\n\n第 7–19 行中的 `while` 循环包含了程序中的大部分逻辑。注意 `while`\
  \ 是如何检查表达式 `(userSelection != 'x')` 的，只有当该表达式求值为为 `true` 时才会继续。为了能够首次运行，你在第 5 行中将字符变量\
  \ `userSelection` 初始化为 `'m'`。这个值可以是任何不是 `'x'` 的值（否则条件在第一次循环时就会失败，应用程序将退出而不会让用户进行任何建设性的操作）。第一次运行非常简单，但在第\
  \ 17 行会询问用户是否希望再次执行另一组计算。第 18 行包含用户的输入，这是你修改 `while` 所评估的表达式的地方，从而让程序有机会继续或终止。当第一次循环完成后，执行返回到第\
  \ 7 行 `while` 语句中评估 `expression`，如果用户没有按下 `x`，则重复执行。当用户在循环结束时按下 `x` 时，第 7 行对表达式的下一次求值结果为\
  \ `false`，执行退出 `while` 循环，最终在显示告别语句后结束应用程序。\n\n***\n\n### Note\n\n循环也被称为*迭代*（iteration）。涉及\
  \ `while`、`do...while` 和 `for` 的语句也被称为*迭代语句*（iterative statements）。\n\n***\n\n###\
  \ `do...while` 循环\n\n在某些情况下（如 Listing 6.8 中的所示），你需要确保某段代码在循环中重复，并且至少执行一次。这就是 `do...while`\
  \ 循环用用之处。\n\n`do...while` 循环的语法为：\n\n点击此处查看代码图像\n\n```cpp\ndo\n{\n    StatementBlock;\
  \ // 至少执行一次\n} while(condition); // 如果条件求值为 false 则结束循环\n```\n\n注意包含 `while(expression)`\
  \ 的该行以分号结尾。这与之前的 `while` 循环不同，在之前的循环中，`while` 后面跟着的分号将实际上在所在行就终止循环，导致一个空语句。\n\n\
  Listing 6.9 展示了如何通过至少执行一次执行语句来实现 `do...while` 循环。\n\n**LISTING 6.9** 使用 `do...while`\
  \ 重复执行代码块\n\n点击此处查看代码图像\n\n***\n\n```cpp\n0: #include <iostream>\n1: using namespace\
  \ std;\n2:\n3: int main()\n4: {\n5:     char userSelection = 'x';   // 初始值\n6: \
  \    do\n7:     {\n8:         cout << \"Enter the two integers: \" << endl;\n9:\
  \         int num1 = 0, num2 = 0;\n10:         cin >> num1;\n11:         cin >>\
  \ num2;\n12:\n13:         cout << num1 << \" x \" << num2 << \" = \" << num1 * num2\
  \ << endl;\n14:         cout << num1 << \" + \" << num2 << \" = \" << num1 + num2\
  \ << endl;\n15:\n16:         cout << \"Press x to exit(x) or any other key to recalculate\"\
  \ << endl;\n17:         cin >> userSelection;\n18:     } while (userSelection !=\
  \ 'x');\n19:\n20:     cout << \"Goodbye!\" << endl;\n21:\n22:     return 0;\n23:\
  \ }\n```\n\n***\n\n输出 ![Image](img/arrow.jpg)\n\n点击此处查看代码图像\n\n```text\nEnter the\
  \ two integers:\n654\n-25\n654 x -25 = -16350\n654 + -25 = 629\nPress x to exit(x)\
  \ or any other key to recalculate\nm\nEnter the two integers:\n909\n101\n909 x 101\
  \ = 91809\n909 + 101 = 1010\nPress x to exit(x) or any other key to recalculate\n\
  x\nGoodbye!\n```\n\n分析 ![Image](img/arrow.jpg)\n\n该程序的行为和输出与 Listing 6.8 。事实上，唯一的区别在于第\
  \ 6 行的 `do` 关键字和之后第 18 行对 `while` 的使用。代码的执行是串行的，逐行执行，直到到达第 18 行的 `while`。这就是 `while`\
  \ 评估表达式 `(userSelection != 'x')` 的地方。当表达式求值为 `true` 时（即用户没有按下字符 `x` 退出），循环的执行会重复。当表达式求值为\
  \ `false` 时（即用户按了 `x`），执行退出循环，并继续执行告别并结束应用程序。\n\n### `for` 循环\n\n`for` 语句是一种更复杂的循环，因为它允许一个执行一次的初始化语句（通常用于初始化计数器）、检查退出条件（通常使用此计数器），并在每次循环结束时执行某项操作（通常是递增或修改此计数器）。\n\
  \n`for` 循环的语法为：\n\n点击此处查看代码图像\n\n```cpp\nfor (initialization; condition; increment)\n\
  ```\n\n`for` 循环是一项功能，允许程序员定义一个带有初始值的计数器，在每次循环开始时检查退出条件，并在循环结束时更改该值。Listing 6.10\
  \ 展示了使用 `for` 循环访问数组元素的有效方法。\n\n**LISTING 6.10** 使用 `for` 为静态数组输入元素\n\n点击此处查看代码图像\n\
  \n```cpp\n0: #include <iostream>\n1: using namespace std;\n2: \n3: int main()\n\
  4: {\n5:     const int ARRAY_LENGTH = 5;\n6:     int myNums[ARRAY_LENGTH];\n7:\n\
