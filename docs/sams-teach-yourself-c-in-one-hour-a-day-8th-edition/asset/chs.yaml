  \ 建议\n- 当你的类包含原始指针成员时，始终编写拷贝构造函数和拷贝赋值运算符。\n- 始终使用 `const` 引用作为拷贝构造函数的参数。\n- 评估是否在声明构造函数时使用\
  \ `explicit` 关键字来避免隐式转换。\n- 使用如 `std::string` 的字符串类和智能指针类作为成员，而不是原始指针，因为它们实现了拷贝构造函数并节省了你的工作。\n\
  \n### 不要\n- 除非避免，不要使用原始指针作为类成员。\n\n### 注意\n\n具有原始指针成员 `char* buffer` 的 `MyString`\
  \ 类被用作解释拷贝构造函数所需的示例。\n\n如果你要编写一个需要包含名称等字符串数据的类，使用 `std::string` 而不是 `char*`，在没有原始指针的情况下，可能不需要拷贝构造函数。这是因为编译器插入的默认拷贝构造函数会确保成员对象（如\
  \ `std::string`）的所有可用拷贝构造函数。\n\n#### 移动构造函数有助于提高\n\n在某些情况下，由于语言的性质及其需求，对象会自动执行拷贝步骤。考虑以下内容：点击此处查看代码图像\n\
  ```cpp\nclass MyString\n{\n    // 取列表 9.9 中的实现\n};\n\nMyString Copy(MyString& source)\
  \ // 函数\n{\n    MyString copyForReturn(source.GetString());   创建拷贝\n    return copyForReturn;\
  \ // 返回值调用拷贝构造函数\n}\n\nint main()\n{\n    MyString sayHello (\"Hello World of C++\"\
  );\n    MyString sayHelloAgain(Copy(sayHello)); // 调用 2 次拷贝构造函数\n    return 0;\n\
  }\n```\n\n\n\n\n\n正如注释所示，在 `sayHelloAgain` 的实例化过程中，拷贝构造函数被调用了两次，因此由于我们调用了通过值传递返回\
  \ `MyString` 的函数 `Copy(sayHello)`，导致了两次深拷贝。然而，这个返回的值是非常临时的，并且在这一表达式之外是不可用的。因此，C++\
  \ 编译器出于善意调用的拷贝构造函数是对性能的负担。如果我们的类包含大型对象，这种影响将变得显著。\n\n为了避免这种性能瓶颈，从 C++11 开始的 C++\
  \ 版本除了拷贝构造函数外，引入了移动构造函数（move constructor）。移动构造函数的语法如下：\n\n点击此处查看代码\n\n```cpp\n//\
  \ move constructor\nMyString(MyString&& moveSource)\n{\n   if(moveSource.buffer\
  \ != NULL)\n   {\n      buffer = moveSource.buffer; // 获取所有权，即“移动”\n      moveSource.buffer\
  \ = NULL;   // 将移动源设置为 NULL\n   }\n}\n```\n\n当编写了移动构造函数时，编译器会自动选择这种方式来“移动”临时资源，从而避免了深拷贝步骤。实现移动构造函数后，注释应相应更改为如下：\n\
  \n点击此处查看代码\n\n```cpp\nMyString sayHelloAgain(Copy(sayHello)); // 调用 1 次拷贝构造函数，1\
  \ 次移动构造函数\n```\n\n移动构造函数通常配合移动赋值运算符实现，该运算符将在第 12 节中详细讨论。列表 12.11 是 `class MyString`\
  \ 的一个改进版本，它实现了移动构造函数和移动赋值运算符。\n\n### 构造函数与析构函数的不同用途\n\n在这一节中你学习了一些重要的基础概念，例如构造函数、析构函数的概念，以及通过\
  \ `public` 和 `private` 等关键字对数据和方法进行抽象。这些概念使你能够创建控制自身如何被创建、拷贝、销毁或暴露数据的类。\n\n让我们来看一些帮助解决许多重要设计问题的有趣模式。\n\
  \n#### 不允许拷贝的类\n\n你被要求为你国家的宪法建模。你的宪法允许一位总统。你的 `class President` 面临以下风险：\n\n点击此处查看代码\n\
  \n```cpp\nPresident ourPresident;\nDoSomething(ourPresident); // 按值传递时创建了重复对象\n\n\
  President clone;\nclone = ourPresident; // 通过赋值创建了重复对象\n```\n\n显然，你需要避免这种情况。除了建模特定的宪法外，你可能正在编写一个操作系统，并需要建模一个局域网、一个处理器等。你需要确保某些资源不能被拷贝或复制。如果你不声明拷贝构造函数，C++\
  \ 编译器会为你插入一个默认的公有拷贝构造函数。这破坏了你的设计并威胁了你的实现。然而，语言为你提供了一个解决这种设计范式的方案。\n\n你可以通过声明一个 `private`\
  \ 拷贝构造函数来确保你的类不能被拷贝。这确保了函数调用 `DoSomething(ourPresident)` 将导致编译失败。为了避免赋值，你声明了一个 `private`\
  \ 赋值运算符。\n\n因此，解决方案如下：\n\n点击此处查看代码\n\n```cpp\nclass President\n{\nprivate:\n   President(const\
  \ President&); // 私有拷贝构造函数\n   President& operator= (const President&); // 私有拷贝赋值运算符\n\
  \   // ... 其他属性\n};\n```\n\n不需要实现私有的拷贝构造函数或赋值运算符。只需将它们声明为私有，就足以实现你确保 `class President`\
  \ 的对象不可拷贝的目标。\n\n#### 允许单例实例的单例类\n\n之前讨论的 `class President` 很好，但它有一个缺点：它无法帮助通过实例化多个对象来创建多个总统：\n\
  \n```cpp\nPresident One, Two, Three;\n```\n\n得益于 `private` 拷贝构造函数，它们单独是不可拷贝的，但你理想上需要一个有一个且只有一个真实体现的\
  \ `class President`——也就是说，只有一个对象，并且禁止创建额外的对象。欢迎来到单例（singleton）概念，它使用私有构造函数、私有赋值运算符和静态实例成员来创建这种（争议性的）强大的模式。\n\
  \n***\n\n**提示**\n\n当在类数据成员上使用 `static` 关键字时，它确保该成员被所有实例共享。\n\n当在函数作用域内声明的局部变量上使用\
  \ `static` 时，它确保该变量在函数调用之间保留其值。\n\n当在成员函数（方法）上使用 `static` 时，该方法被类的所有实例共享。\n\n***\n\
  \n`static` 关键字是创建单例类的关键要素，正如列表 9.10 所示。\n\n**列表 9.10** 禁止拷贝、赋值和多实例实例创建的单例 `class\
  \ President`\n\n点击此处查看代码\n\n***\n\n```cpp\n#include <iostream>\n#include <string>\n\
  using namespace std;\n\nclass President\n{\nprivate:\n   President() {}; // 默认构造函数\n\
  \   President(const President&); // 拷贝构造函数\n   President& operator=(const President&);\
  \ //赋值运算符\n   string name;\n\npublic:\n   static President& GetInstance()\n   {\n\
  \      // 仅构造一次\n      static President onlyInstance;\n      return onlyInstance;\n\
  \   }\n\n   string GetName() { return name; }\n   void SetName(string InputName)\
  \ { name = InputName; }\n};\n\nint main()\n{\n   President& onlyPresident = President::GetInstance();\n\
  \   onlyPresident.SetName(\"Abraham Lincoln\");\n\n   // 取消注释以查看编译失败\n   // President\
  \ second; // 无法访问构造函数\n   // President* third= new President(); // 无法访问构造函数\n  \
  \ // President fourth = onlyPresident; // 无法访问拷贝构造函数\n   // onlyPresident = President::GetInstance();\
  \ // 无法访问运算符\n\n   cout << \"The name of the President is: \";\n   cout << President::GetInstance().GetName()\
  \ << endl;\n   return 0;\n}\n```\n\n***\n\n**输出**\n\n点击此处查看代码\n\nThe name of the\
  \ President is: Abraham Lincoln\n\n分析\n\n快速查看 `main()` 行中的 `main()`，那里有很多注释行显示了所有创建\
  \ `class President` 新实例或拷贝的无法编译组合。让我们逐一分析它们：\n\n点击此处查看代码\n\n34: // President second;\
  \ // 无法访问构造函数\n\n35: // President* third= new President(); // 无法访问构造函数\n\n行 34 和\
  \ 35 分别尝试在栈和堆上创建对象并使用默认构造函数，但因为在第 7 行被声明为 `private`，所以它是不可用的。\n\n点击此处查看代码\n\n36:\
  \ // President fourth = onlyPresident; // 无法访问拷贝构造函数\n\n行 36 是通过拷贝构造函数创建现有对象的拷贝（创建时的赋值会调用拷贝构造函数），这在\
  \ `main()` 中是不可用的，因为它在第 8 行被声明为 `private`：\n\n37: // onlyPresident = President::GetInstance();\
  \ // 无法访问运算符=\n\n\n\n\n第 37 行尝试通过赋值来创建副本，这是行不通的，因为赋值运算符在第 9 行被声明为 `private`。因此，`main()`\
  \ 永远无法创建 `class President` 的实例，唯一的选择是第 30 行所示的方法，即使用静态函数 `GetInstance()` 来获取 `class\
  \ President` 的实例。由于 `GetInstance()` 是一个静态成员，它就像一个全局函数，可以在没有对象句柄的情况下调用。`GetInstance()`\
  \ 实现在第 14–19 行，它使用一个静态变量 `onlyInstance` 来确保只创建一个且仅创建一个 `class President` 实例。为了更好地理解这一点，请设想第\
  \ 17 行只执行一次（静态初始化），因此无论 `President::GetInstance()` 被调用多少次，它都会返回那个唯一的现有的 `class President`\
  \ 实例。\n\n***\n\n### 注意事项\n\n仅在绝对必要的地方使用`单例模式（`singleton pattern`），并考虑到应用程序及其功能的未来增长。请注意，这种限制多个实例创建的特性，当出现需要该类的多个实例的用例时，可能会成为架构上的瓶颈。\n\
  \n例如，如果我们的项目从模拟国家转变为模拟联合国（目前由 193 个成员国组成，每个国家都有自己的主席），那么由于单例 `class President` 只允许存在一个实例，显而易见我们会遇到一个架构上的问题。\n\
  \n***\n\n## 禁止在栈上实例化的类\n\n栈空间通常是有限的。如果你正在编写一个内部结构中可能包含数 TBabytes 数据的数据库，你可能希望确保该类的客户端不能在栈上实例化它；相反，它被强制只能在自由存储（free\
  \ store）上创建实例。确保此点的关键是将析构函数声明为 `private`：\n\n点击此处查看代码图片\n\n```cpp\nclass MonsterDB\n\
  {\nprivate:\n   ~MonsterDB();  // 私有析构函数\n   //... 消耗大量数据的成员\n};\n```\n\n声明私有析构函数可以确保不允许像这样创建实例：\n\
  \n点击此处查看代码图片\n\n```cpp\nint main()\n{\n   MonsterDB myDatabase; // 编译错误\n   // ...\
  \ 更多代码\n   return 0;\n}\n```\n\n这个实例如果成功构造，将位于栈上。当栈回溯时，栈上的所有对象都会被弹出，因此编译器需要在 `main()`\
  \ 结束时编译并调用析构函数 `~MonsterDB()`。然而，由于该析构函数是私有的，因此无法访问，导致编译失败。\n\n`private` 析构函数并不会阻止你在堆（heap）上实例化：\n\
  \n点击此处查看代码图片\n\n```cpp\nint main()\n{\n   MonsterDB* myDatabase = new MonsterDB();\
  \ // 无错误\n   // ... 更多代码\n   return 0;\n}\n```\n\n如果你在那里看到了内存泄漏，那么你并没有看错。由于在 `main`\
  \ 中无法访问析构函数，你也无法执行 `delete`。`MonsterDB` 类需要支持一个 `public static` 成员函数，用于销毁实例（类成员有访问私有析构函数的权限）。请参见列表\
  \ 9.11。\n\n**列表 9.11** 仅允许在自由存储上（使用 `new`）创建对象的数据库 `class MonsterDB`\n\n点击此处查看代码图片\n\
  \n***\n\n```cpp\n0: #include <iostream>\n1: using namespace std;\n2:\n3: class MonsterDB\n\
  4: {\n5: private:\n6:     ~MonsterDB() {}; // 私有析构函数防止栈上实例化\n7:\n8: public:\n9:\
  \     static void DestroyInstance(MonsterDB* pInstance)\n10:     {\n11:        \
  \ delete pInstance; // 成员可以调用私有析构函数\n12:     }\n13:\n14:     void DoSomething()\
  \ {} // 示例空成员方法\n15: };\n16:\n17: int main()\n18: {\n19:     MonsterDB* myDB = new\
  \ MonsterDB(); // 在堆上\n20:     myDB->DoSomething();\n21:\n22:     // 取消下一行查看编译失败\n\
  23:     // delete myDB; // 私有析构函数无法调用\n24:\n25:     // 使用静态成员释放内存\n26:     MonsterDB::DestroyInstance(myDB);\n\
  27:\n28:     return 0;\n29: }\n```\n\n\n\n对输出没有贡献的代码行与有贡献的行同样重要。第 17–27 行中的 `main()`\
  \ 包含了 `class Human` 对象的实例化的各种变体，该类在第 8 行声明了一个带有 `explicit` 的构造函数。可以通过编译的行是显式转换的尝试，其中使用\
  \ `int` 来实例化 `Human`。第 23 行和第 24 行是涉及隐式转换的变体。这些被注释掉的行在我们移除第 8 行的 `explicit` 关键字后将能够通过编译。因此，此示例演示了\
  \ `explicit` 关键字如何防止隐式转换。\n\n***\n\n### 提示\n\n隐式转换问题以及使用 `explicit` 关键字避免转换的问题也适用于运算符。记住在编程\
  \ 第 12 节 中向你介绍的转换运算符时，注意 `explicit` 的用法。\n\n***\n\n### `this` 指针\n\nC++ 中的一个重要概念，`this`\
  \ 是一个保留关键字，适用于类的作用域，并包含对象的地址。换句话说，`this` 的值是 `&object`。在类成员方法内部，当你调用另一个成员方法时，编译器会将\
  \ `this` 指针作为一个隐式的、不可见的参数传递给函数调用：\n\n点击此处查看代码图像\n\n```cpp\nclass Human\n{\nprivate:\n\
  \    void Talk (string Statement)\n    {\n      cout << Statement;\n    }\npublic:\n\
  \    void IntroduceSelf()\n    {\n      Talk(\"Bla bla\"); // 等于 Talk(this, \"Bla\
  \ Bla\")\n    }\n};\n```\n\n你在这里看到的是 `IntroduceSelf()` 方法使用私有成员 `Talk()` 在屏幕上打印一条语句。实际上，编译器在调用\
  \ `Talk` 时嵌入了 `this` 指针，即它被调用为 `Talk(this, \"Bla bla\")`。\n\n从编程的角度来看，`this` 并没有很多应用，除了那些通常是可选的情况。例如，如\
  \ 列表 9.2 所示在 `SetAge()` 中访问 `age` 的代码可以有一个变体：\n\n点击此处查看代码图像\n\n```cpp\nvoid SetAge(int\
  \ humansAge)\n{\n    this->age = humansAge;   // 等于 age = humansAge\n}\n```\n\n\
  ***\n\n### 注意\n\n注意，`this` 指针不会传递给声明为 `static` 的类方法，因为静态函数与类的实例无关。相反，它们被所有实例共享。\n\
  \n要在静态函数中使用实例变量，你需要显式地声明一个参数并将 `this` 指针作为参数传递。\n\n***\n\n### 类的 `sizeof()`\n\n\
  你已经学习了使用 `class` 关键字定义自定义类型的基础知识，这使你能够封装数据属性和操作这些数据的方法。第 3 节 中介绍的 `sizeof()` 运算符“使用变量、声明常量，”用于确定特定类型的内存需求（以字节为单位）。该运算符也适用于类，基本上报告了类声明中包含的每个数据属性所消耗的字节总和。取决于你使用的编译器，`sizeof()`\
  \ 可能包含或不包含某些属性在字边界上的填充。注意，成员函数及其局部变量在定义类的 `sizeof()` 时不起作用。请参见 列表 9.13。\n\n**列表\
