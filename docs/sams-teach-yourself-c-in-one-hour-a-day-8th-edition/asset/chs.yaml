  **5.**](#app05.html_ch16ex05) 你的程序应该是：今天真美！\n\n## 第 17 节 STL 动态数组类\n\n与静态数组不同，动态数组为程序员提供了在未知确切大小的情况下存储数据的灵活性。这是一个频繁的需求，标准模板库（STL）以\
  \ `vector` 类的形式提供了现成的解决方案。\n\n在本节中，你学习\n\n![Image](img/arrow.jpg) `vector` 的特性\n\
  \n![Image](img/arrow.jpg) 典型的 `vector` 操作\n\n![Image](img/arrow.jpg) vector 大小容量的概念\n\
  \n![Image](img/arrow.jpg) STL `deque` 类\n\n### `std::vector` 的特性\n\n`vector` 是一个模板类，提供了泛型功能，并具有以下特性：\n\
  \n![Image](img/arrow.jpg) 常数时间内在数组末尾添加元素；也就是说，在末尾插入的时间不取决于数组的大小。对于在末尾删除元素也是如此。\n\
  \n![Image](img/arrow.jpg) 在中间插入或删除元素的时间与其后面的元素数量成正比。\n\n![Image](img/arrow.jpg)\
  \ 持有的元素数量是动态的，且 `vector` 类管理内存使用。\n\n*vector* 是一种动态数组，可以如图 17.1](#ch17.html_ch17fig01)\
  \ 所示所示。\n\n**图 17.1** vector 的内部结构\n\n\n\n\n点击此处查看代码图像\n\n`std::vector<int>::const_iterator\
  \ elementInVec;`\n\n如果你需要一个可以修改值或调用非 `const` 函数的迭代器，你应该使用 `iterator` 而不是 `const_iterator`。\n\
  \n鉴于 `std::vector` 有几个重载的构造函数，你还可以选择在实例化 vector 时告诉它应该开始包含的元素数量及其初始值，或者可以在实例化另一个\
  \ vector 时使用一个 vector 的部分或全部。\n\n列表 17.1 展示了常见的 vector 实例化方式。\n\n**列表 17.1** 实例化\
  \ `std::vector` 的不同形式：指定大小、初始值以及从另一个 vector 拷贝值\n\n点击此处查看代码图像\n\n```cpp\n0: #include\
