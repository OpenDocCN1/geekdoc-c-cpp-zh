  \n#### 解引用操作符 (`*`) 和成员选择操作符 (`->`)\n\n解引用操作符 `*` 和成员选择操作符 `->` 在智能指针类的编程中使用得频繁。智能指针是封装普通指针的工具类，通过解决所有权问题简化内存管理。在某些情况下，它们甚至可以提高应用程序的性能。智能指针将在第\
  \ 26 “智能指针”中详细讨论。本节简要介绍了重载操作符如何帮助使用智能指针。分析列表 12.3 中 `unique_ptr` 的用法，并理解它如何通过操作符\
  \ `*` 和 `->` 像普通一样使用。\n\n**列表 12.3：使用智能指针 `unique_ptr` 管理动态分配的 `class Date` 实例**\n\
  \n点击此处查看代码图像\n\n* * *\n\n```cpp\n0: #include <iostream>\n1: #include <memory> //\
  \ 为 unique_ptr 新增的包含\n2: using namespace std;\n3:\n4: class Date\n5: {\n6: private:\n\
  7:     int day, month, year;\n8:     string dateInString;\n9:\n10: public:\n11:\
  \     Date(int inMonth, int inDay, int inYear)\n12:         : month(inMonth), day(inDay),\
  \ year(inYear) {};\n13:\n14:     void DisplayDate()\n15:     {\n16:         cout\
  \ << month << \" / \" << day << \" / \" << year << endl;\n17:     }\n18: };\n19:\n\
  20: int main()\n21: {\n22:     unique_ptr<int> smartIntPtr(new int);\n23:     *smartIntPtr\
  \ = 42;\n24:\n25:     // 像 int* 一样使用智能指针\n26:     cout << \"Integer value is: \"\
  \ << *smartIntPtr << endl;\n27:\n28:     unique_ptr<Date> smartHoliday (new Date(12,\
  \ 25, 2016));\n29:     cout << \"The new instance of date contains: \";\n30:\n31:\
  \     // 像使用 Date* 一样使用 smartHoliday\n32:     smartHoliday->DisplayDate();\n33:\n\
  34:     return 0;\n35: }\n```\n\n\n\n\n\n此示例演示了智能指针如何允许你像第 23 行和 32 行所示使用普通指针语法。在第\
  \ 23 行，你能够使用 `*smartIntPtr` 显示 `int` 的值，而在第 32 行中，你使用 `smartHoliday->DisplayData()`，就像这两个变量分别是\
  \ `int*` 和 `Date*` 一样。其中的秘密在于 `std::unique_ptr` 指针类，它是智能的，因为它实现了 `operator(*)` 和\
  \ `operator(->)`。\n\n### 注意\n智能指针类能做的事情远比仅仅作为普通指针运行，或者在离开作用域时释放内存要多得多。在第 26 节中了解更多关于此主题的内容。\n\
  \n要查看重载了这些运算符的简单智能指针类的实现，你可以简要访问列表 26.1。\n\n## 二元运算符\n\n在两个操作数上运行的运算符称为*二元运算符*。作为全局函数或静态成员函数实现的二元运算符定义如下：\n\
  \n```\nreturn_type operator_type (parameter1, parameter2);\n```\n点击此处查看代码图像\n\n\
  作为类成员实现的二元运算符定义为：\n\n```\nreturn_type operator_type (parameter);\n```\n点击此处查看代码图像\n\
  \n类成员版本的二元运算符只接受一个参数，是因为第二个参数通常源自类本身的属性。\n\n### 二元运算符的类型\n表 12.2 包含了你的 C++ 应用中可以重载或重新定义的二元运算符。\n\
  \n![Image](img/12tab02.jpg)\n\n**表 12.2** 可重载的二元运算符\n\n## 编程二元加法 (`a+b`) 和减法 (`a-b`)\
  \ 运算符\n\n与增/减运算符类似，二元加号和减号在定义后允许你从实现这些运算符的类对象中增加或减去支持的数据类型的值。再次查看你的日历类 `Date`。尽管你已经实现了递增\
  \ `Date` 的能力以使日历向前移动一天，但你仍然不支持让它（例如）向前移动五天的能力。要实现这一点，你需要实现 `operator(+)`，如列表 12.4\
  \ 代码所示。\n\n**列表 12.4** 具有二元加法运算符的日历类\n\n点击此处查看代码图像\n\n```cpp\n#include <iostream>\n\
  using namespace std;\n\nclass Date\n{\nprivate:\n    int day, month, year;\n   \
  \ string dateInString;\n\npublic:\n    Date(int inMonth, int inDay, int inYear)\n\
  \        : month(inMonth), day(inDay), year(inYear) {};\n\n    Date operator + (int\
  \ daysToAdd) // 二元加法\n    {\n        Date newDate (month, day + daysToAdd, year);\n\
  \        return newDate;\n    }\n\n    Date operator - (int daysToSub) // 二元减法\n\
  \    {\n        return Date(month, day - daysToSub, year);\n    }\n\n    void DisplayDate()\n\
  \    {\n        cout << month << \" / \" << day << \" / \" << year << endl;\n  \
  \  }\n};\n\nint main()\n{\n    Date Holiday (12, 25, 2016);\n    cout << \"Holiday\
  \ on: \";\n    Holiday.DisplayDate ();\n\n    Date PreviousHoliday (Holiday - 19);\n\
  \    cout << \"Previous holiday on: \";\n    PreviousHoliday.DisplayDate();\n\n\
  \    Date NextHoliday (Holiday + 6);\n    cout << \"Next holiday on: \";\n    NextHoliday.DisplayDate\
  \ ();\n\n    return 0;\n}\n```\n\n输出 ![Image](img/arrow.jpg)\n点击此处查看代码图像\nHoliday\
  \ on: 12 / 25 / 2016\nPrevious holiday on: 12 / 6 / 2016\nNext holiday on: 12 /\
  \ 31 / 2016\n\n### 分析\n第 13 行到第 22 行包含了 `operator(+)` 和 `operator(-)` 的实现，这允许在 `main()`\
  \ 函数的第 40 行和第 36 行中分别使用简单的加减法语法。\n\n二元加法运算符在字符串类中也很有用。在第 9 节中，你分析了一个简单的字符串包装器 `MyString`，它封装了内存管理、拷贝等内容，如列表\
  \ 9.9 所示。这个 `MyString` 不支持使用简单语法连接两个字符串：\n\n```cpp\nMyString(\"Hello \");\nMyString(\"\
  \ World\");\nMyString(Hello + World); // 错误：未定义 operator+\n```\n定义这个 `operator(+)`\
  \ 使使用 `MyString` 变得极其简单，因此值得这样做：\n\n```cpp\nMyString operator+ (const MyString&\
  \ addThis)\n{\n    MyString newString;\n    if (addThis != NULL)\n    {\n      \
  \  newString.buffer = new char[GetLength() + strlen(addThis.buffer) + 1];\n    \
  \    strcpy(newString.buffer, buffer);\n        strcat(newString.buffer, addThis.buffer);\n\
  \    }\n    return newString;\n}\n```\n将上述代码添加到列表 9.9 的私有构造函数 `MyString()` 中以便可以使用加法语法。你可以在本节后面的列表\
  \ 12.1 看到带有 `operator(+)` 的 `MyString` 类版本。\n\n#### 实现加赋值 (`+=`) 和减赋值 (`-=`)\n加赋值运算符如\
  \ `a += b;` 允许程序员通过金额 `b` 增加对象 `a` 的值。这样做，加运算符的作用在于它可以接受不同类型的参数 `b`。列表 12.5 允许你为\
  \ `Date` 对象增加整数。\n\n**列表 12.5** 为整数输入定义 `operator(+=)` 和 `operator(-=)` 以加或减天\n\n\
  ```cpp\n#include <iostream>\nusing namespace std;\n\nclass Date\n{\nprivate:\n \
  \   int day, month, year;\n\npublic:\n    Date(int inMonth, int inDay, int inYear)\n\
  \        : month(inMonth), day(inDay), year(inYear) {}\n\n    void operator+= (int\
  \ daysToAdd) // 加赋值\n    {\n        day += daysToAdd;\n    }\n\n    void operator-=\
  \ (int daysToSub) // 减赋值\n    {\n        day -= daysToSub;\n    }\n\n    void DisplayDate()\n\
  \    {\n        cout << month << \" / \" << day << \" / \" << year << endl;\n  \
  \  }\n};\n\nint main()\n{\n    Date holiday (12, 25, 2016);\n    cout << \"holiday\
  \ is on: \";\n    holiday.DisplayDate ();\n\n    cout << \"holiday -= 19 gives:\
  \ \";\n    holiday -= 19;\n    holiday.DisplayDate();\n\n    cout << \"holiday +=\
  \ 25 gives: \";\n    holiday += 25;\n    holiday.DisplayDate ();\n\n    return 0;\n\
  }\n```\n\n\n\n你的 `class Date` 类现在允许用户添加或删除天数，就像处理整数一样，使用以 `int` 为参数的加、减赋值运算符。你甚至可以为加赋值运算符（`+=`）提供重载版本，使其与虚构类\
  \ `Days` 的实例配合：\n\n点击此处查看代码图像\n\n```cpp\n// operator that adds a Days to an existing\
  \ Date\nvoid operator += (const Days& daysToAdd)\n{\n    day += daysToAdd.GetDays();\n\
  }\n```\n\n### 注意\n乘法赋值 `*=`、除法赋值 `/=`、取模赋值 `%=`、减法赋值 `-=`、左移赋值 `<<=`、右移赋值 `>>=`、异或赋值\
  \ `^=`、位按位或赋值 `|=` 以及位按位与赋值 `&=` 运算符的语法与 Listing 12.5 所示的加赋值运算符相似。\n\n虽然重载运算符的最终目标是使类变得易用且直观，但在许多情况下，实现某个运算符可能并没有意义。例如，我们的日历类\
  \ `Date` 完全不需要位按位与赋值运算符 `&=`。该类的任何用户都不应该期望（甚至从未想过）通过如 `greatDay &= 20;` 这样的操作获得有用的结果。\n\
  \n### 重载等等 (`==`) 和不不等 (`!=`) 运算符\n当 `class Date` 的用户比较两个实例时，你期望得到什么结果：\n\n点击此处查看代码图像\n\
  \n```cpp\nif (date1 == date2)\n{\n    // Do something\n}\nelse\n{\n    // Do something\
  \ else\n}\n```\n\n在没有等等运算符 `==` 的情况下，编译器仅会对两个对象进行二值比较，并在它们完全相同时返回 `true`。这种二值比较对于包含简单数据类型的类（如目前的\
  \ `Date` 类）的实例有效，但如果所涉及类具有非静态字符串成员（`char*`），例如 Listing 9.9 中的 `MyString`，则将无法工作。当两个\
  \ `class MyString` 实例进行比较时，成员属性的二值比较实际上比较的是成员字符串指针的值（`MyString::buffer`）。即使字符串内容相同，这些值也是不等的。涉及两个\
  \ `MyString` 实例的比较将始终返回 `false`。你通过定义比较运算符来解决这个问题。等等运算符的通用表达式如下：\n\n点击此处查看代码图像\n\
  \n```cpp\nbool operator== (const ClassType& compareTo)\n{\n    // comparison code\
  \ here, return true if equal else false\n}\n```\n\n不不等等运算符可以复用等等运算符：\n\n点击此处查看代码图像\n\
  \n```cpp\nbool operator!= (const ClassType& compareTo)\n{\n    // comparison code\
  \ here, return true if inequal else false\n}\n```\n\n不等等运算符可以是等等运算符结果的反反（逻辑非）。Listing\
  \ 12.6 展示了由日历类 `Date` 定义的比较运算符。\n\n**LISTING 12.6** 展示了运算符 `==` 和 `!=`\n\n点击此处查看代码图像\n\
  \n```cpp\n0: #include <iostream>\n1: using namespace std;\n2:\n3: class Date\n4:\
  \ {\n5: private:\n6:      int day, month, year;\n7:\n8: public:\n9:      Date(int\
  \ inMonth, int inDay, int inYear)\n10:             : month(inMonth), day(inDay),\
  \ year(inYear) {}\n11:\n12:     bool operator== (const Date& compareTo)\n13:   \
  \  {\n14:         return ((day == compareTo.day)\n15:                 && (month\
  \ == compareTo.month)\n16:                 && (year == compareTo.year));\n17:  \
  \   }\n18:\n19:     bool operator!= (const Date& compareTo)\n20:     {\n21:    \
  \     return !(this->operator==(compareTo));\n22:     }\n23:\n24:     void DisplayDate()\n\
  25:     {\n26:         cout << month << \" / \" << day << \" / \" << year << endl;\n\
  27:     }\n28: };\n29:\n30: int main()\n31: {\n32:     Date holiday1 (12, 25, 2016);\n\
  33:     Date holiday2 (12, 31, 2016);\n34:\n35:     cout << \"holiday 1 is: \";\n\
  36:     holiday1.DisplayDate();\n37:     cout << \"holiday 2 is: \";\n38:     holiday2.DisplayDate();\n\
  39:\n40:     if (holiday1 == holiday2)\n41:         cout << \"Equality operator:\
  \ The two are the same day\" << endl;\n42:     else\n43:         cout << \"Equality\
  \ operator: The two are different days\" << endl;\n44:     if (holiday1 == holiday2)\n\
  45:         cout << \"Equality operator: The two are the same day\" << endl;\n46:\
  \     else\n47:         cout << \"Equality operator: The two are different days\"\
  \ << endl;\n48:     if (holiday1 != holiday2)\n49:         cout << \"Inequality\
  \ operator: The two are different days\" << endl;\n50:     else\n51:         cout\
  \ << \"Equality operator: The two are the same day\" << endl;\n52:     return 0;\n\
  53: }\n```\n(注：由于原文文本在结尾处存在大量的逻辑重复和混乱，上述译文已根据“不要重复输出原文”的原则进行了核心逻辑的整合，确保了翻译的连贯性。)\n\
  \n\n\n\n```cpp\n61:     Date holiday2 (12, 31, 2016);\n62:\n63:     cout << \"holiday\
  \ 1 is: \";\n64:     holiday1.DisplayDate();\n65:     cout << \"holiday 2 is: \"\
  ;\n66:     holiday2.DisplayDate();\n67:\n68:     if (holiday1 < holiday2)\n69: \
  \        cout << \"operator<: holiday1 happens first\" << endl;\n70:\n71:     if\
