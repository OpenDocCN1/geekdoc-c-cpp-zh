  \ C++ 概念\n\n## 第 26 节：理解智能指针\n\nC++ 程序员在管理堆内存（或自由存储区）时，并不一定需要使用原始指针类型；他们可以使用智能指针。\n\
  \n在本节中，你将学习到：\n\n- ![Image](img/square.jpg) 什么是智能指针以及你为什么需要它们\n- ![Image](img/square.jpg)\
  \ 智能指针是如何实现的\n- ![Image](img/square.jpg) 不同的智能指针类型\n- ![Image](img/square.jpg) 为什么你不应该使用已弃的\
  \ `std::auto_ptr`\n- ![Image](img/square.jpg) 标准库智能指针 `std::unique_ptr`\n- ![Image](img/square.jpg)\
  \ 流行的智能指针库\n\n### 什么是智能指针？\n\n简单来说，C++ 中的智能指针是一个重载了运算符的类，它的行为类似于传统的指针。然而，它通过确保动态分配的数据被正确且及时地销毁，并促进定义良好的对象周期周期提供了额外的价值。\n\
  \n#### 使用传统（原始）指针的问题\n\n与其他现代编程语言不同，C++ 在内存分配、释放和管理方面为程序员提供了完全的活性。遗憾的是，这种灵活性是一把双刃剑。一方面它让\
  \ C++ 变成了一种强大的语言，但另一方面它允许程序员创建内存相关问题，例如当动态分配的对象未被正确释放时产生的内存泄漏。\n\n例如：\n\n点击此处查看代码图片\n\
  \n```cpp\nSomeClass* ptrData = anObject.GetData ();\n\n/*\n   问题：由 ptrData 指向的对象是使用\
  \ new 动态分配的吗？\n   如果是，谁来调用 delete？调用者还是被调用者？\n   答案：不知道！\n*/\n\nptrData->DoSomething();\n\
  ```\n\n在前面的代码中，没有明显的方法可以判断 `ptrData` 所指向的内存：\n\n- ![Image](img/square.jpg) 是否在`heap`上分配的，因此最终需要被`deallocate`\n\
  - ![Image](img/square.jpg) 是否由调用者负责`deallocate`\n- ![Image](img/square.jpg) 是否由对象的`destructor`自动销毁\n\
  \n尽管插入注释和强制编码规范可以部分解决这些歧义，但这些机制太松了，无法有效避免由滥用动态分配的数据和指针引起的所有错误。\n\n#### 智能指针如何帮助？\n\
  \n鉴于使用传统指针和传统内存管理技术的问题，需要注意的是，C++ 程序员在需要管理堆/自由存储区的数据时并不被强制使用它们。程序员可以通过在程序中使用智能指针，选择一种更智能的方式来分配和管理动态数据：\n\
  \n点击此处查看代码图片\n\n```cpp\nsmart_pointer<SomeClass> spData = anObject.GetData ();\n\
  \n// 像传统指针一样使用智能指针！\n\nspData->Display ();\n\n(*spData).Display ();\n\n// 不需要担心释放\n\
  // (智能指针的析构函数会为你完成它)\n```\n\n因此，智能指针的行为类似于传统指针（我们现在称它们为*原始指针*），但通过它们的*重载运算符*和*析构函数*提供了有用的功能，以确保动态分配的数据被及时销毁。\n\
  \n### 智能指针是如何实现的？\n\n这个问题目前可以简化为“智能指针 `spData` 是如何像传统指针一样工作的？”答案是：智能指针类重载解引用运算符（`*`）和成员选择运算符（`->`），让程序员像使用传统指针一样使用它们。运算符重载在之前的第\
  \ 12 节中讨论过。\n\n此外，为了允许你在堆上管理某种类型的类型，几乎所有的良好的智能指针都是模板类，包含了其功能的通用实现。作为模板，它们是多用途的，并且可以特化以管理你选择的类型。\n\
  \n列表 26.1 智能指针的核心组成部分\n点击此处查看代码图片\n\n```cpp\ntemplate <typename T>\nclass smart_pointer\
  \ {\nprivate:\n    T* rawPtr;\npublic:\n    // 构造函数\n    smart_pointer (T* pData)\
  \ : rawPtr(pData) {}\n\n    // 析构函数\n    ~smart_pointer () {delete rawPtr;}\n\n\
  \    // 拷贝构造函数\n    smart_pointer (const smart_pointer &anotherSP);\n\n    // 赋值运算符\n\
  \    smart_pointer& operator= (const smart_pointer&anotherSP);\n\n    // 解引用运算符\n\
  \    T& operator () const {\n        return *(rawPtr);\n    }\n\n    // 成员选择运算符\n\
  \    T* operator-> () const {\n        return rawPtr;\n    }\n};\n```\n\n分析 ![](img/arrow.jpg)\n\
  \n前面的智能指针类展示了 `*` 和 `->` 运算符的实现（如 14–17 行和 19–22 行所示），这些运算符有助于该类在传统意义上作为“指针”工作。例如，要在\
  \ `class Tuna` 类型的对象上使用智能指针，你可以这样实例化：\n\n点击此处查看代码图片\n\n```cpp\nsmart_pointer<Tuna>\
  \ smartTuna (new Tuna);\n\nsmartTuna->Swim();\n\n// 或者：\n\n(*smartTuna).Display();\n\
  ```\n\n这个 `smart_pointer` 类还没有展示或实现任何让该指针类变得非常智能且使其优于传统指针的功能。构造函数（如第 7 行所示）接收一个指针并保存为智能指针类的内部指针对象。析构函数释放此指针，允许自动释放内存。\n\
  \n> 使智能指针真正“智能”的实现是拷贝构造函数、赋值运算符和析构函数的实现。它们决定了智能指针对象在跨函数传递、赋值或超出范围（即被析构）时的行为。\n\n\
  > 所以，在查看完整的智能指针实现之前，你应该了解一些智能指针类型。\n\n### 智能指针的类型\n\n\n\n\n\n内存资源的管理（即所实现的所有权模型）是智能指针类脱颖出的地方。智能指针决定了在被拷贝和赋值时对资源进行何种操作。最简单的实现往往会导致性能问题，而最快速的实现可能并不适用于所有应用程序。根结底，程序员在决定在应用程序中使用智能指针之前，必须理解智能指针是如何运作的。\n\
  \n智能指针的分类实际上是对其内存资源管理策略的分类。这些策略包括：\n\n![Image](img/square.jpg) 拷贝拷贝\n\n![Image](img/square.jpg)\
  \ 写时拷贝 (COW)\n\n![Image](img/square.jpg) 引用计数\n\n![Image](img/square.jpg) 引用链接\n\
  \n![Image](img/square.jpg) 破坏性拷贝\n\n在学习 C++ 标准库提供的智能指针——`std::unique_ptr` 之前，让我们简要回顾一下这些策略。\n\
  \n### 拷贝拷贝\n\n在实现深拷贝的智能指针中，每个智能指针实例都持有其所管理对象的完整拷贝。每当智能指针被复制时，所指向的对象也会被复制（因此是深拷贝）。当智能指针超出作用域时，它会通过析构函数释放它所指向的内存。\n\
  \n虽然基于深拷贝的智能指针似乎并没有按值传递对象提供任何价值，但它的优势在处理多态对象时变得显而易见，如下所示，它可以避免切片（slicing）问题：\n\n\
  点击此处查看代码图像\n\n```\n// 按值传递多态对象时产生切片的示例\n\n// Fish 是 Tuna 和 Carp 的基类，Fish::Swim()\
  \ 是虚函数\n\nvoid MakeFishSwim (Fish aFish)    // 注意参数类型\n{\n    aFish.Swim(); // 虚函数\n\
  }\n\n// ... 某些函数\n\nCarp freshWaterFish;\nMakeFishSwim (freshWaterFish);  // Carp\
  \ 将被“切片”为 Fish\n\n// 切片问题：只有 Carp 的 Fish 部分被发送到 MakeFishSwim()\n\nTuna marineFish;\n\
  MakeFishSwim(marineFish); // 再次发生切片\n```\n\n当程序员选择深拷贝智能指针时，切片问题就会得以解决，如列表 26.2 所示。\n\
  \n**列表 26.2** 使用基于深拷贝的智能指针通过基类型传递多态对象\n\n点击此处查看代码图像\n\n```\n0: template <typename\
  \ T>\n1: class deepcopy_smart_ptr\n2: {\n3: private:\n4:     T* object;\n5: public:\n\
  6:     //... 其他函数\n7:\n8:     // 深拷贝指针的拷贝构造函数\n9:     deepcopy_smart_ptr (const\
  \ deepcopy_smart_ptr& source)\n10:     {\n11:          // Clone() 是虚函数：确保派生类对象的深拷贝\n\
  12:          object = source->Clone ();\n13:     }\n14:\n15:     // 拷贝赋值运算符\n16:\
  \     deepcopy_smart_ptr& operator= (const deepcopy_smart_ptr& source)\n17:    \
  \ {\n18:         if (object)\n19:             delete object;\n20:\n21:         object\
  \ = source->Clone ();\n22:     }\n23: };\n```\n\n分析 ![Image](img/arrow.jpg)\n\n\
  如你所示，`deepcopy_smart_ptr` 在第 9–13 行实现了一个拷贝构造函数，允许通过类需要实现的 `Clone()` 函数实现多态对象的深拷贝。同样，它在第\
  \ 16–22 行实现了一个拷贝赋值运算符。为了简单起见，本示例假设基类 `Fish` 实现的虚函数名为 `Clone()`。通常，实现深拷贝模型的智能指针会将此函数作为模板参数或函数对象提供。\n\
  \n因此，当智能指针本身作为指向基类类型 `Fish` 的指针传递时：\n\n点击此处查看代码图像\n\n```\ndeepcopy_smart_ptr<Carp>\
  \ freshWaterFish(new Carp);\nMakeFishSwim (freshWaterFish);  // Carp 将不会被“切片”\n\
  ```\n\n`deepcopy_smart_ptr<Carp> freshWaterFish(new Carp);`\n`MakeFishSwim (freshWaterFish);\
  \ // Carp 将不会被“切片\"`\n\n### 写时拷贝 (COW)\n\n*写时拷贝*（通常称为 *COW*）尝试通过共享对象直到第一次尝试写入时来优化性能。关键点在于，当你选择遵循\
  \ COW 的实现时，请务必在继续操作之前理解实现细节。COW 有其相当可比例的拥护者。对于那些坚信 COW 的人来说，实现 `const` 是关键。\n\n\
  引用计数机制使得程序员仅在使用对象时才与智能指针操作变得非常重要。否则，你可能会遇到拷贝太少或拷贝太多的情况。\n\n### 引用计数智能指针\n\n泛而言之，引用计数是一种保持对象用户数量计数的机制。当计数减到零时，对象会被释放。因此，引用计数是一种在不需要拷贝对象的情况下共享对象的良好机制。如果你曾经接触过名为\
  \ COM 的技术，那么引用计数的概念至少遇到过你一次。\n\n此类智能指针在拷贝时，需要增加所涉及对象的计数。保持这种计数的至少有两种流行方法：\n\n![Image](img/square.jpg)\
  \ 在指向的对象内部维护引用计数\n\n![Image](img/square.jpg) 由指针类在共享对象中维护引用计数\n\n第一种引用计数维护在对象中的变体被称为*内入式引用计数*（intrusive\
  \ reference counting），因为对象需要被修改。在这种情况下，对象维护、增加并向管理它的任何智能指针类提供引用计数。顺便提一下，这是 COM 采用的方法。第二种在共享对象中维护引用计数的变体机制，智能指针类可以在空存储上（例如一个动态分配的整数）保留引用计数，并在拷贝时，由拷贝构造函数增加此值。\n\
  \n因此，引用计数机制使得程序员仅在使用对象时才与智能指针操作变得非常重要。管理对象的智能指针和指向该对象的原始指针是一个坏主意，因为智能指针会（智能地）在它维护的计数减到零时释放对象，但原始指针会继续指向不再属于你的应用程序的内存部分。同样，引用计数也会导致其特有的问题：两个互相持有指针的对象永远不会被释放，因为它们的循环依赖将它们的引用计数保持在至少\
  \ 1。\n\n### 引用链接智能指针\n\n*引用链接*智能指针是指并不主动计算使用对象的引用次数的指针；相反，它们只需要知道数量何时减到零，以便释放对象。\n\
  \n\n\n\n\n它们被称为 `reference-linked`（引用链接），因为它们的实现是基于双向链表的。当通过复制现有的智能指针来创建新的智能指针时，它会被添加到列表中。当智能指针超出作用范围或被销毁时，析构函数会将该智能指针从列表中取消索引。引用链接也会受到循环依赖引起的影响，这与引用计数指针的情况同样适用。\n\
  \n### 破坏性拷贝 (Destructive Copy)\n\n`destructive copy`（破坏性拷贝）是一种机制，智能指针在复制时，会将处理的对象的完整所有权转移给目标，并重置自身：\n\
  \n点击此处查看代码图像\n\n```cpp\ndestructive_copy_smartptr <SampleClass> smartPtr (new SampleClass\
  \ ());\n\nSomeFunc (smartPtr);    // 所有权转移到 SomeFunc\n\n// 不要再在调用者中使用 smartPtr 了！\n\
  ```\n\n尽管这种机制在用用上显然并不直观，但破坏性拷贝智能指针提供的优势在于，它们确保了在任何时间点，只有一个活跃指针指向一个对象。因此，它们是从函数返回指针的良好机制，并适用于你可以利用其“破坏性”属性来获得优势的场景。\n\
  \n破坏性拷贝指针的实现偏离了标准的推荐 C++ 编程技术，如列表 26.3 所示。\n\n### 注意事项\n\n`std::auto_ptr` 是目前遵循破坏性拷贝原则最流行的（取决于你怎么看，也可能是臭名昭著）指针。这种智能指针在传递给函数或复制到另一个对象之后就变得没用了。\n\
  \n`std::auto_ptr` 在 C++11 中被弃用。相反，你应该使用 `std::unique_ptr`，它由于具有私有的拷贝构造函数和拷贝赋值运算符，不能被按值传递。它只能作为引用参数传递。\n\
  \n#### 列表 26.3 一个示例破坏性拷贝智能指针\n\n点击此处查看代码图像\n\n```cpp\n0: template <typename T>\n\
  1: class destructivecopy_ptr\n2: {\n3: private:\n4:     T* object;\n5: public:\n\
  6:     destructivecopy_ptr(T* input):object(input) {}\n7:     ~destructivecopy_ptr()\
  \ { delete object; }\n8:\n9:     // 拷贝构造函数\n10:     destructivecopy_ptr(destructivecopy_ptr&\
  \ source)\n11:     {\n12:         // 拷贝时获取所有权\n13:         object = source.object;\n\
  14:\n15:         // 销毁源\n16:         source.object = 0;\n17:     }\n18:\n19:   \
  \  // 拷贝赋值运算符\n20:     destructivecopy_ptr& operator= (destructivecopy_ptr& source)\n\
  21:     {\n22:         if (object != source.object)\n23:         {\n24:        \
  \     delete object;\n25:             object = source.object;\n26:             source.object\
  \ = 0;\n27:         }\n28:     }\n29: };\n30:\n31: int main()\n32: {\n33:     destructivecopy_ptr<int>\
  \ num (new int);\n34:     destructivecopy_ptr<int> copy = num;\n35:\n36:     //\
  \ num 现在是无效的\n37:     return 0;\n38: }\n```\n\n### 分析\n\n列表 26.3 展示了基于破坏性拷贝的智能指针的实现。第\
  \ 10–17 行和 20–28 行分别包含拷贝构造函数和拷贝赋值运算符。这些函数在进行拷贝时会使源失效；即，拷贝构造函数在拷贝后将源所包含的指针设置为 `NULL`，因此证明了“破坏性拷贝”名称的。赋值运算符执行相同的操作。因此，`num`\
  \ 在第 34 行被赋值给另一个对象时实际上已经失效了。这种行为与赋值的操作是违直觉的。\n\n### 注意事项\n\n如列表 26.3 所示，对于破坏性拷贝指针实现至关重要的拷贝构造函数和拷贝赋值运算符引起了最大的批评。与大多数\
  \ C++ 类不同，这种智能指针类不能让拷贝构造函数和赋值运算符接受 `const` 引用，因为它需要在拷贝后使源失效。这不仅偏离了传统的拷贝构造函数和赋值运算符的语义，还使得智能指针的使用变得不符合直觉。很少有人期望在拷贝或赋值步骤之后源对象会被损坏。此类指针会销毁源对象的事实也使得它们不适用于\
  \ STL 容器（如 `std::vector`）或任何你可能使用的其他集合类。这些容器需要在内部拷贝你的内容，并最终导致指针失效。因此，出于由于及其他原因，建议在程序中避免使用破坏性拷贝指针。\n\
  \n### 提示\n\n`auto_ptr` 直到最近一直是 C++ 标准支持的基于破坏性拷贝的智能指针。它在 C++11 中最终被标记为弃用，你应该改用 `std::unique_ptr`。\n\
  \n#### 使用 std::unique_ptr\n\n`std::unique_ptr` 从 C++11 开始引入 C++，它与 `auto_ptr` 略有不同之处在于它不允许拷贝或赋值。\n\
  \n### 提示\n\n要使用类 `std::unique_ptr`，请包含头文件：\n```cpp\n#include <memory>\n```\n\n`std::unique_ptr`\
  \ 是一个简单的智能指针，类似于列表 26.1 所示，但由于具有私有的拷贝构造函数和赋值运算符，它不允许按值传递或赋值。列表 26.4 展示了这一点。\n\n\
  #### 列表 26.4 使用 std::unique_ptr\n\n点击此处查看代码图像\n\n```cpp\n0: #include <iostream>\n\
  1: #include <memory> // 使用 unique_ptr 需要包含\n2: using namespace std;\n3:\n4: class\
  \ Fish\n5: {\n6: public:\n7:     Fish() {cout << \"Fish: Constructed!\" << endl;}\n\
  8:     ~Fish() {cout << \"Fish: Destructed!\" << endl;}\n9:\n10:    void Swim()\
  \ const {cout << \"Fish swims in water\" << endl;}\n11: };\n12:\n13: void MakeFishSwim(const\
  \ unique_ptr<Fish>& inFish)\n14: {\n15:     inFish->Swim();\n16: }\n17:\n18: int\
  \ main()\n19: {\n20:     unique_ptr<Fish> smartFish (new Fish);\n21:\n22:     smartFish->Swim();\n\
  23:     MakeFishSwim(smartFish); // OK，因为 MakeFishSwim 接收引用\n24:\n25:     unique_ptr<Fish>\
  \ copySmartFish;\n26:     // copySmartFish = smartFish; // 错误：operator= 是私有的\n27:\n\
  28:     return 0;\n29: }\n```\n\n### 输出\n\n点击此处查看代码图像\n\n```\nFish: Constructed!\n\
  Fish swims in water\nFish: Destructed!\n```\n\n### 分析\n\n观察输出中的构造和析构顺序。注意尽管 `smartFish`\
  \ 指向的对象在 `main()` 中被构造（如预期的那样），但即使你没有调用 `delete` 运算符，它也被销毁了（而且是自动销毁的）。这是 `unique_ptr`\
  \ 的行为，当指针超出作用范围时通过析构函数释放它拥有的对象。\n\n\n\n\n\n点击此处查看代码图像\n\n```cpp\ncopySmartFish =\
  \ smartFish; // error: operator= is private\n```\n\n但它支持移动语义。因此，一个可行的方案是\n\n点击此处查看代码图像\n\
  \n```cpp\nunique_ptr<Fish> sameFish (std::move(smartFish));\n// smartFish 从此为空\n\
  ```\n\n如果你确实编写一个需要捕获 `unique_ptr` 的 lambda 表达式，那么你可以像 C++14 支持的那样在 lambda 捕获中使用\
  \ `std::move()`。\n\n点击此处查看代码图像\n\n```cpp\nstd::unique_ptr<char> alphabet(new char);\n\
  \n*alphabet = 's';\n\nauto lambda = [capture = std::move(alphabet)]()\n{ std::cout\
  \ << *capture << endl; };\n\n// 由于内容已被“移动”，alphabet 从此为空\n\nlambda();\n```\n\n如果觉得上面的代码看起来太奇特，不要感到沮丧——它确实很复杂，并且涵盖了大多数专业程序员可能永远不会遇到的用例。\n\
  \n* *\n\n* *\n\n### 注意事项\n\n在使用多线程编写应用程序时，请评估使用 C++11 兼容库提供的 `std::shared_ptr` 和\
  \ `std::weak_ptr`。这些有助于线程安全和引用计数的对象共享。\n\n* * *\n\n### 流行的智能指针库\n\n显而易见，C++ 标准库自带的智能指针版本无法满足每个程序员的需求。这正是为什么世界上有许多智能指针库。\n\
  \nBoost ([www.boost.org](http://www.boost.org)) 为你提供了一些经过良好测试且文档良好的智能指针类，以及许多其他有工具类。你可以在\
  \ [`www.boost.org/libs/smart_ptr/smart_ptr.htm`](http://www.boost.org/libs/smart_ptr/smart_ptr.htm)\
  \ 找到更多关于 Boost 智能指针的信息和下载。\n\n### 总结\n\n在本节中，你学习了如何使用正确的智能指针来编写使用指针的代码，同时有助于减少与分配和对象所有权相关的问题。你还学习了不同的智能指针类型，并了解到在应用程序中采用它之前了解智能指针类的行为是非常重要的。你现在知道你不应该使用\
  \ `std::auto_ptr`，因为它在拷贝或赋值期间会使源失效。你学习了从 C++11 开始提供的智能指针类 `std::unique_ptr`。\n\n\
  ### 问答\n\n**Q 我需要一个指针向量。我应该选择 `auto_ptr` 作为向量中持有的对象类型吗？**\n\n**A** 根据原则，你永远不应该使用\
  \ `std::auto_ptr`。它是被废弃的。单次拷贝或赋值操作就会导致源对象不可用。\n\n**Q 一个类总是需要加载哪两个运算符才能被称为智能指针类？**\n\
  \n**A** 如下：`operator*` 和 `operator->`。它们帮助以普通指针的语义使用该类的对象。\n\n**Q 我有一个应用程序，其中 `Class1`\
  \ 和 `Class2` 留有指向对方类型对象的成员属性。在这种情况下，我应该使用引用计数指针吗？**\n\n**A** 可能不会，因为循环依赖会导致引用计数无法降为零，从而导致这两个类的对象永久地留留在堆中。\n\
  \n**Q 字符串类也在空闲存储（free store）上动态管理字符数组。因此字符串类也是智能指针吗？**\n\n**A** 不是。这些类通常没有同时实现 `operator*`\
  \ 和 `operator->`，因此不能归类为智能指针。\n\n### 工作坊\n\n工作坊包含测验题，帮助巩固你对所涵盖内容的理解，并提供提供使用所学知识的机会。在检查\
  \ 附录 E 中的答案之前，尝试回答测验和练习题，并确保在进入下一节之前理解了答案。\n\n#### 测验\n\n**1.** 在为你的应用程序编写自己的智能指针之前，你会去哪里查看？\n\
  \n**2.** 智能指针会显著减慢你的应用程序速度吗？\n\n**3.** 引用计数智能指针可以在哪里存储引用计数数据？\n\n**4.** 引用链接指针使用的链表机制应该是单链还是双链？\n\
  \n### 练习\n\n**1. 找错:** 指出这段代码中的错误：\n\n点击此处查看代码图像\n\n```cpp\nstd::auto_ptr<SampleClass>\
  \ object (new SampleClass ());\n\nstd::auto_ptr<SampleClass> anotherObject (object);\n\
  \nobject->DoSomething ();\n\nanotherObject->DoSomething();\n```\n\n**2.** 使用 `unique_ptr`\
  \ 类实例化一个继承自 `Fish` 的 `Carp`。将对象作为 `Fish` 指针传递，并对任何切片（slicing）进行注释。\n\n**3. 找错:**\
  \ 指出这段代码中的错误：\n\n点击此处查看代码图像\n\n```cpp\nstd::unique_ptr<char> alphabet(new char);\n\
  \n*alphabet = 's';\n\nauto lambda = [capture = std::move(alphabet)]()\n\n{ std::cout\
  \ << *capture << endl; };\n\nlambda();\n```\n\n\n\n\nC++ 为你提供了一系列标准类和头文件，帮助你执行一些重要且频繁的\
  \ I/O 操作。表 27.1 列出了你经常使用的类列表。\n\n![Image](img/27tab01.jpg)\n\n**表 27.1** `std` 命名空间中常用的\
  \ C++ 流类\n\n* * *\n\n注意\n\n`cout`、`cin` 和 `cerr` 分别是流类 `ostream`、`istream` 和 `ostream`\
