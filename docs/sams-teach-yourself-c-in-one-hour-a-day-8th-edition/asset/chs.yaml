  \ to end, sorry!`\n\n列表 28.1 展示了 `try` 和 `catch` 块的使用。`catch(...)` 接受参数就像函数一样，而\
  \ `...` 表示此 `catch` 块接受各种异常。然而在这种情况下，我们可能想专门隔离类型为 `std::bad_alloc` 的异常，因为这些异常是在\
  \ `new` 失败时抛出的。捕获特定类型将帮助你专门处理该类型的问题，例如向用户显示一条告诉具体到底出了什么消息\n\n### 使用 `throw` 抛出特定类型的异常\n\
  \n当你在列表 28.2 中捕获 `std::bad_alloc` 时，它实际上是由 `new` 抛出的对象。你完全可以抛出你自己的异常。你只需要 `throw`\
  \ 关键字：\n\n点击此处查看代码图像\n\n```cpp\nvoid DoSomething()\n{\n    if(unwanted)\n      \
  \  throw object;\n}\n```\n\n让我们学习在列表 28.3 中对自定义异常使用 `throw`，它除法两个数字。\n\n**列表 28.3**\
  \ 在尝试除以零时抛出自定义异常\n\n点击此处查看代码图像\n\n```cpp\n0: #include<iostream>\n1: using namespace\
  \ std;\n2:\n3: double Divide(double dividend, double divisor)\n4: {\n5:     if(divisor\
  \ == 0)\n6:         throw \"Dividing by 0 is a crime\";\n7:\n8:     return (dividend\
  \ / divisor);\n9: }\n10:\n11: int main()\n12: {\n13:     cout << \"Enter dividend:\
  \ \";\n14:     double dividend = 0;\n15:     cin >> dividend;\n16:     cout << \"\
  Enter divisor: \";\n17:     double divisor = 0;\n18:     cin >> divisor;\n19:\n\
  20:     try\n21:     {\n22:         cout << \"Result is: \" << Divide(dividend,\
  \ divisor);\n23:     }\n24:     catch(const char* exp)\n25:     {\n26:         cout\
  \ << \"Exception: \" << exp << endl;\n27:         cout << \"Sorry, can't continue!\"\
  \ << endl;\n28:     }\n29:\n30:     return 0;\n31: }\n```\n\n输出 ![Image](img/arrow.jpg)\n\
  \nEnter dividend: 20\nEnter divisor: 0\nException: Dividing by 0 is a crime\nSorry,\
  \ can't continue!\n\n分析 ![Image](img/arrow.jpg)\n\n代码不仅展示了你能够捕获类型为 `char*` 的异常（如第\
  \ 24 行所示），还展示了你捕获了在调用函数 `Divide()` 中抛出的异常。此外注意你没有将整个 `main()` 包含在 `try {}` 中；你只包含了你预期会\
  \ `throw` 的部分。这通常是一个良好的习惯，因为异常处理也会降低代码的执行性能。\n\n\n\n\n\n在列表 28.3 中，你在 `Divide()`\
  \ 函数中抛出了类型为 `char*` 的异常，该异常在调用函数 `main()` 的 `catch(char*)` 处理器中被捕获。\n\n在抛出异常的地方（使用\
  \ `throw`），编译器会插入对兼容的 `catch(Type)` 的动态查找，以处理此异常。异常处理逻辑首先检查抛出异常的行是否在 `try` 块内。如果是，它将寻找可以处理该类型\
  \ `Type` 异常的 `catch(Type)`。如果 `throw` 语句不在 `try` 块内，或者没有与异常类型兼容的 `catch()`，则异常处理逻辑将在调用函数中进行查找。因此，异常处理逻辑会沿着栈向上，一个接一个调用函数，寻找可以处理该异常的合适的\
  \ `catch(Type)`。在栈展开过程的每一步，该函数的局部变量都会按照它们构造的反序被销毁。这在列表 28.4 中得到了演示。\n\n### 列表 28.4\
  \ 异常发生时局部对象的析毁顺序\n\n点击此处查看代码图像\n\n```cpp\n0: #include <iostream>\n1: using namespace\
  \ std;\n2:\n3: struct StructA\n4: {\n5:     StructA() {cout << \"StructA constructor\"\
  \ << endl; }\n6:     ~StructA() {cout << \"StructA destructor\" << endl;  }\n7:\
  \ };\n8:\n9: struct StructB\n10: {\n11:     StructB() {cout << \"StructB constructor\"\
  \ << endl; }\n12:     ~StructB() {cout << \"StructB destructor\" << endl; }\n13:\
  \ };\n14:\n15: void FuncB()  // throws\n16: {\n17:     cout << \"In Func B\" <<\
  \ endl;\n18:     StructA objA;\n19:     StructB objB;\n20:     cout << \"About to\
  \ throw up!\" << endl;\n21:     throw \"Throwing for the heck of it\";\n22: }\n\
  23:\n24: void FuncA()\n25: {\n26:     try\n27:     {\n28:         cout << \"In Func\
  \ A\" << endl;\n29:         StructA objA;\n30:         StructB objB;\n31:      \
  \   FuncB();\n32:         cout << \"FuncA: returning to caller\" << endl;\n33: \
  \    }\n34:     catch(const char* exp)\n35:     {\n36:         cout << \"FuncA:\
  \ Caught exception: \" << exp << endl;\n37:         cout << \"Handled it, will not\
  \ throw to caller\" << endl;\n38:         // throw;  // uncomment this line to throw\
  \ to main()\n39:     }\n40: }\n41:\n42: int main()\n43: {\n44:     cout << \"main():\
  \ Started execution\" << endl;\n45:     try\n46:     {\n47:         FuncA();\n48:\
  \     }\n49:     catch(const char* exp)\n50:     {\n51:         cout << \"Exception:\
  \ \" << exp << endl;\n52:     }\n53:     cout << \"main(): exiting gracefully\"\
  \ << endl;\n54:     return 0;\n55: }\n```\n\n输出 ![Image](img/arrow.jpg)\n点击此处查看代码图像\n\
  main(): Started execution\nIn Func A\nStructA constructor\nStructB constructor\n\
  In Func B\nStructA constructor\nStructB constructor\nAbout to throw up!\nStructB\
  \ destructor\nStructA destructor\nFuncA: Caught exception: Throwing for the heck\
  \ of it\nHandled it, will not throw to caller\nmain(): exiting gracefully\n\n###\
  \ 分析\n\n在列表 28.4 中，`main()` 调用 `FuncA()`，`FuncA()` 调用 `FuncB()`，后者在第 21 行抛出异常。两个调用函数\
  \ `FuncA()` 和 `main()` 都是异常安全的，因为它们都有一个 `catch(char*)` 块。抛出异常的 `FuncB()` 没有 `catch()`\
  \ 块，因此 `FuncA()` 中第 34–39 行的 `catch` 块是来自 `FuncB()` 抛出异常的第一个处理器，因为 `FuncA()` 是 `FuncB()`\
  \ 的调用者。`FuncA()` 决定此异常并不严重，没有将其传递给 `main()`。如果你取消第 38 行的注释，异常将抛出给 `FuncB()` 的调用者——即\
  \ `main()` 将接收到它。输出还指示了对象创建的顺序（与你编写实例化顺序相同）以及一旦抛出异常它们被销毁的顺序（实例化的反序）。这不仅发生在抛出异常的\
  \ `FuncB()` 中，也发生在调用 `FuncB()` 并处理异常的 `FuncA()` 中。\n\n### 注意\n\n列表 28.4 演示了当抛出异常时局部对象的析构函数是如何调用的。如果由于异常导致的对象析构函数也抛出了异常，将导致程序终止。\n\
  \n### `std::exception` 类\n\n在列表 28.2 中，你实际上捕获了 `bad_alloc` 类的对象，`bad_alloc` 是由 `new`\
  \ 抛出的。`std::exception` 是以下异常的基类：\n\n- `bad_alloc`——当 `new` 请求内存失败时抛出\n- `bad_cast`——尝试\
  \ `dynamic_cast` 错误类型时抛出\n- `ios_base::failure`——由 `iostream` 库中的函数抛出\n\n在列表 28.2\
  \ 中，`exp.what()` 提供关于问题性质的详细描述。你可以利用 `std::exception` 作为基类创建一个 `catch(const exception&)`，它可以捕获所有异常：\n\
  \n```cpp\nvoid SomeFunc()\n{\n    try\n    {\n        // code made safe\n    }\n\
  \    catch (const exception& exp)\n    {\n        cout << \"Exception encountered:\
  \ \" << exp.what() << endl;\n    \n```\n\n### 派自 `std::exception` 的自定义异常类\n\n你可以抛出任何类型的异常。然而，继承自\
  \ `std::exception` 有一个好处——现有的 `catch(const exception&)` 处理器对于 `bad_alloc`、`bad_cast`\
  \ 等会自动适用于你的新异常类，因为它们具有共同基类。这在列表 28.5 中进行了演示。\n\n#### 列表 28.5 派自 `std::exception`\
  \ 的自定义异常类\n\n点击此处查看代码图像\n\n```cpp\n0: #include <exception>\n1: #include <iostream>\n\
  2: #include <string>\n3: using namespace std;\n4:\n5: class CustomException: public\
  \ std::exception\n6: {\n7:     string reason;\n8: public:\n9:     // constructor,\
  \ needs reason\n10:    CustomException(const char* why):reason(why) {}\n11:\n12:\
  \    // 重写虚函数以返回 'reason'\n13:    virtual char* what() const throw()\n14:    {\n\
  15:        return reason.c_str();\n16:    }\n17: };\n18:\n19: double Divide(double\
  \ dividend, double divisor)\n20: {\n21:     if(divisor == 0)\n22:         throw\
  \ CustomException(\"CustomException: Dividing by 0 is a crime\");\n23:\n24:    \
  \ return (dividend / divisor);\n25: }\n26:\n27: int main()\n28: {\n29:     cout\
  \ << \"Enter dividend: \";\n30:     double dividend = 0;\n31:     cin >> dividend;\n\
  32:     cout << \"Enter divisor: \";\n33:     double divisor = 0;\n34:     cin >>\
  \ divisor;\n35:     try\n36:     {\n37:         cout << \"Result is: \" << Divide(dividend,\
  \ divisor);\n38:     }\n39:     catch(exception& exp)// catch CustomException, bad_alloc,\
  \ etc\n40:     {\n41:         cout << exp.what() << endl;\n42:         cout << \"\
  Sorry, can't continue!\" << endl;\n43:     }\n44:\n45:\n46:     return 0;\n47: }\n\
  ```\n\n\n\n\n\n点击此处查看代码图像\n\n输入被除数：2011\n\n输入除数：0\n\n`CustomException`: 除以 0 是一种犯罪\n\
  \n抱歉，无法继续！\n\n分析 ![Image](img/arrow.jpg)\n\n这是 列表 28.3 的一个版本，它在除以 0 时抛出了简单的 `char*`\
  \ 异常。然而，这一个版本实例化了第 5–17 行定义的 `class CustomException` 类对象，该类继承自 `std::exception`。注意我们的自定义异常类在第\
  \ 13–16 行实现了虚函数 `what()`，它本质上返回了抛出异常的原因。第 39–43 行 `main()` 函数中的 `catch(exception&)`\
  \ 逻辑不仅处理了 `class CustomException` 类，还处理了其他具有相同基类 `exception` 的 `bad_alloc` 类型异常。\n\
  \n***\n\n### 注意事项\n\n请注意 列表 28.5 第 13 行中虚方法 `CustomException::what()` 的声明：\n\n点击此处查看代码图像\n\
  \n```\nvirtual const char* what() const throw()\n```\n\n它以 `throw()` 结尾，这意味着该函数本身预计不会抛出异常——对于被用作异常对象的类来说，这是一个非常重要且相关的限制。如果你仍然在该函数内部插入\
  \ `throw`，你可能会遇到编译器警告。\n\n如果一个函数以 `throw(int)` 结尾，意味着该函数预计会抛出 `int` 类型的异常。\n\n***\n\
  \n### 应该做的（DO）\n\n- **务必**记得 `catch` 类型为 `std::exception` 的异常。\n- **务必**记得让你的自定义异常类（如果有）继承自\
  \ `std::exception`。\n- **务必**抛出异常，但要审慎使用。它们不是 `true` 或 `false` 等返回值的替代品。\n\n***\n\
  \n### 不应该做的（DON’T）\n\n- **切勿**在析构函数中抛出异常。\n- **切勿**认为内存分配是理所当然的；执行 `new` 的代码应该始终位于\
  \ `try` 块中并带有 `catch(std::exception&)`。\n- **切勿**在 `catch()` 块内部插入任何沉重的逻辑或资源分配。你不希望在处理某个异常时引发另一个异常。\n\
  \n### 总结\n\n在本节课程中，你学习了实用 C++ 编程中的一个重要部分。让你的应用程序在自己的开发环境之外保持稳定，对于客户满意度和直观的用户体验至关重要，这正是异常能帮助你做的。你发现分配资源或内存的代码可能会失败，因此需要使其具有异常安全性。你学习了\
  \ C++ 异常类 `std::exception`，并知道如果你需要编写自定义异常类，理想情况下应该继承这个类。\n\n### 问答（Q&A）\n\n**Q\
  \ 为什么要抛出异常而不是返回错误？**\n\n**A** 你可能并不总是拥有返回错误的权限。如果 `new` 调用失败，你需要处理由 `new` 抛出的异常以防止应用程序崩溃。此外，如果错误非常严重并导致你的应用程序未来的功能无法实现，你应该考虑抛出异常。\n\
  \n**Q 为什么我的异常类应该继承自 `std::exception`？**\n\n**A** 这当然不是强制性的，但它可以帮助你重用所有已经捕捉 `std::exception`\
  \ 类型异常的 `catch()` 块。你可以编写不继承自任何其他内容的异常类，但你必须在所有相关点插入新的 `catch(MyNewExceptionType&)`\
  \ 语句。\n\n**Q 我有一个抛出异常的函数。它需要在同一个函数中被捕获吗？**\n\n**A** 完全不需要。只需确保抛出的异常类型在调用栈中的某个调用函数被捕获即可。\n\
  \n**Q 构造函数可以抛出异常吗？**\n\n**A** 构造函数实际上没有选择！它们没有返回值，而抛出异常是表达不同意见的最佳方式。\n\n**Q 析构函数可以抛出异常吗？**\n\
  \n**A** 技术上可以。但这是一种坏做法，因为当异常导致栈回溯时，析构函数也会被调用。因此，由于抛出异常而调用的析构函数本身再次抛出异常，显然会导致尝试干净退出的已经不稳定应用程序的状态陷入非常糟糕的局面。\n\
