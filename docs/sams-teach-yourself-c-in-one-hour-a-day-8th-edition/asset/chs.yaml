  \ Human` 中的私有数据成员和方法。\n\n### `union`: 一种特殊的数据机制\n\n`union`（联合体）是一种特殊的类类型，其中非静态数据成员在同一时刻只有一个是活跃。因此，`union`\
  \ 可以像类一样容纳多个数据成员，区别在于实际上只有其中一个成员可以被使用。\n\n#### 声明联合体\n\n使用关键字 `union` 声明联合体，随后是联合体的名称以及在大括号内的数据成员：\n\
  \n点击此处查看代码图片\n\n```cpp\nunion UnionName\n{\n  Type1 member1;\n  Type2 member2;\n\
  \  ...\n  TypeN memberN;\n};\n```\n\n你可以像这样实例化并使用 `union`：\n\n点击此处查看代码图片\n\n```cpp\n\
  UnionName unionObject;\nunionObject.member2 = value; // 选择 member2 作为激活成员\n```\n\
  \n* * *\n\n注意：与 `struct` 类似，`union` 的成员默认是公有的。然而，与 `struct` 不同，`union` 不能用于继承体系。此外，`union`\
  \ 的 `sizeof()` 始终等于其包含的最大的成员的大小——即使该成员在实例中是非活跃的。\n\n* * *\n\n#### 你会使用 `union` 吗？\n\
  \n`union` 常作为 `struct` 的成员用于复杂数据类型。在某些实现中，利用 `union` 将内存解释为另一种类型用于类型转换——这种做法是有争议的。Listing\
  \ 9.16 展示了联合体的声明和用法。\n\n**列表 9.16** 声明、实例化和 `sizeof()` Union\n\n点击此处查看代码图片\n\n*\
