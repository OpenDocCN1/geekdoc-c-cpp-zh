  \n通过 operator< 进行字母顺序排序：\nAngi Merkel: +49 234565466\nBen Affleck: +1 745641314\n\
  Bill Gates: +1 97789787998\nDan Craig: +44 123641976\nJack Welsch: +1 7889879879\n\
  \n通过谓词按电话号码排序：\nAngi Merkel: +49 234565466\nBen Affleck: +1 745641314\nBill Gates:\
  \ +1 97789787998\nDan Craig: +44 123641976\nJack Welsch: +1 7889879879\nVlad Putin:\
  \ +7 6645456479\n\n从列表中删除 Putin：\n\n\n\n\n\n如示例所示，`forward_list` 的功能与 `list` 相似。由于\
  \ `forward_list` 不支持双向迭代，因此你可以对迭代器使用 `operator++`，但不能使用 `operator--`。此示例演示了第 23\
  \ 行中函数 `remove(2)` 的用法，用于删除所有值为 2 的元素。第 29 行演示了使用 `sort()` 函数，它使用了基于 `std::less<T>`\
  \ 的默认排序谓词。\n\n`forward_list` 的优势在于它是一个单链表，其内存消耗略低于 `list`（因为元素只需要知道下一个元素，而不需要上一个元素）。\n\
  \n***\n\n## Do (做到)\n\n**应当**在频繁插入或删除元素（尤其是中间部分）时，选择 `std::list` 而不是 `std::vector`——vector\
  \ 需要调整其内部缓冲区以允许数组语义，并会导致昂贵的拷贝操作，而 list 只需要连接或断开元素。\n\n**务必记住**，你可以使用 `push_front()`\
  \ 或 `push_back()` 成员方法分别在列表的开头或结尾插入元素。\n\n**务必记住**，对于要在 STL 容器（如 `list`）中类的类，要编写\
  \ `operator<` 和 `operator==`，以提供默认的排序或删除谓词。\n\n**务必记住**，像任何其他 STL 容器类一样，你始终可以使用\
  \ `list::size()` 方法确定 `list` 中的元素数量。\n\n**务必记住**，像任何其他 STL 容器类一样，你可以使用 `list::clear()`\
  \ 方法清空 `list`。\n\n***\n\n## Don't (避免)\n\n**不要**在仅在末端有少量插入或删除且中间没有插入删除操作的情况下使用 list；在这种情况下，`vector`\
  \ 或 `deque` 的速度会快得多。\n\n**不要**忘记，如果你想让列表使用非默认标准进行 `sort()` 或 `remove()`，请提供一个谓词函数。\n\
  \n***\n\n## Summary (总结)\n\n本节课程向你介绍了 `list` 的属性以及不同的 `list` 操作。你现在已经掌握了一些最实用的 `list`\
  \ 函数，并能够创建任何对象类型的 `list`。\n\n## Q&A (问答)\n\n**Q 为什么 list 提供了如 `sort()` 和 `remove()`\
  \ 这样的成员函数？**\n\n**A** STL `list` 类必须遵守这样一个属性：指向 `list` 中元素的迭代器无论元素在 `list` 中的位置如何，都应该保持有效。尽管\
  \ STL 算法也可以用于 `list`，但 `list` 的成员函数确保了上述属性得以维持，即在排序完成前指向 `list` 元素的迭代器在排序后仍然指向相同的元素。\n\
  \n**Q 你正在使用一个类型为类 `CAnimal` 的 list。为了让 `list` 成员函数能够准确处理它，`CAnimal` 应该定义哪些运算符？**\n\
  \n**A** 对于任何可以在 STL 容器类的类，你必须提供默认比较运算符 `==` 和默认的 `<` 运算符。\n\n**Q 如何在以下行中用显式类型声明替换关键字\
  \ `auto`：**\n\n点击此此处查看代码图片\n\n```\nlist<int> linkInts(10);  // 包含 10 个整数的列表\n\n\
  auto firstElement = linkInts.begin();\n```\n\n**A** 你将用以下显式类型声明替换 `auto`：\n\n点击此处查看代码图片\n\
  \n```\nlist<int> linkInts(10);  // 包含 10 个整数的列表\n\nlist<int>::iterator firstElement\
  \ = linkInts.begin();\n```\n\n## Workshop (工作坊)\n\n工作坊包含测验题以帮助巩固你对涵盖内容的理解，并提供提供使用所学知识的练习。在查看\
  \ 附录 E 中的答案之前，尝试回答测验和练习题，并在进入下一节之前确保你理解了答案。\n\n### Quiz (测验)\n\n**1.** 与在开头或末尾相比，在\
  \ STL list 中间插入项会有性能损失吗？\n\n**2.** 两个迭代器指向 STL list 对象中的两个元素，随后在它们之间插入了一个元素。这些迭代器会因为插入操作而失效吗？\n\
  \n**3.** 如何清空 std::list 的内容？\n\n**4.** 在 list 中插入多个元素可能吗？\n\n### Exercises (练习)\n\
  \n**1.** 编写一个短程序，接受用户输入的数字并插入到 list 的顶部。\n\n**2.** 使用短程序演示：指向 list 中元素的迭代器在在其元素之前插入了另一个元素（从而改变了原元素的相对位置）后，仍然继续保持有效。\n\
  \n**3.** 编写一个程序，使用 list 的 `insert()` 函数将 vector 的内容插入 STL list 中。\n\n**4.** 编写一个程序对字符串列表进行排序。\n\
  \n\n\n\n\n如果你需要一个可以用于修改值或调用非 `const` 函数的迭代器，你应该使用 `iterator` 而不是 `const_iterator`。\n\
  \n鉴于 `set` 和 `multiset` 都是在插入时对元素排序的容器，当你不提供排序标准时，它们会使用默认谓词 `std::less`。这确保了你的 `set`\
  \ 包含按升序排列的元素。\n\n你可以通过定义一个带有 `operator()` 的类来创建一个二元排序谓词，该运算符接受两个与 `set` 中包含类型相同的值作为输入，并根据你的标准返回\
  \ `true`。其中一个按降序排序的排序谓词如下：\n\n点击此处查看代码图像\n\n```cpp\n// used as a template parameter\
  \ in set / multiset instantiation\n\ntemplate <typename T>\nstruct SortDescending\n\
  {\n   bool operator()(const T& lhs, const T& rhs) const\n    {\n      return (lhs\
  \ > rhs);\n    }\n};\n```\n\n然后你按照如下方式在 `set` 或 `multiset` 的实例化中提供此谓词：\n\n点击此处查看代码图像\n\
