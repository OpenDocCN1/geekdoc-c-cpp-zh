  \  8:     string name;\n  9:\n  10: public:\n  11:     Human(string humansName =\
  \ \"Adam\", int humansAge = 25)\n  12:         :name(humansName), age(humansAge)\n\
  \  13:     {\n  14:         cout << \"Constructed a human called \" << name;\n \
  \ 15:         cout << \", \" << age << \" years old\" << endl;\n  16:     }\n  17:\
  \ };\n  18:\n  19: int main()\n  20: {\n  21:     Human adam;\n  22:     Human eve(\"\
  Eve\", 18);\n  23:\n  24:     return 0;\n  25: }\n```\n\n输出 ![Image](img/arrow.jpg)\n\
  \n点击此处查看代码图片\n\nConstructed a human called Adam, 25 years old\n\nConstructed a human\
  \ called Eve, 18 years old\n\n分析 ![Image](img/arrow.jpg)\n\n带有初始化列表的构造函数可见第 11–16\
  \ 行，你也可以看到参数为 `name` 给出了默认值 `\"Adam\"`，为 `age` 给出了 `25`。因此，当在第 21 行创建一个名为 `adam`\
  \ 的 `class Human` 实例且不带参数时，其成员会自动分配默认值。另一方面，`eve` 则如第 22 行所示提供了参数——这些参数在构造期间变为被赋值给\
  \ `Human::name` 和 `Human::age` 的值。\n\n### 注意\n\n也可以使用关键字 `constexpr` 将构造函数定义为常量表达式。在从性能角度看这种结构在特殊情况下是有用的时，在这种情况下，你会在构造函数声明处使用它。\n\
  \n点击此处查看代码图片\n\n```cpp\nclass Sample\n{\nconst char* someString;\npublic:\n   constexpr(const\
  \ char* input)\n       :someString(input) // constructor\n};\n```\n\n### 析构函数\n\n\
  析构函数像构造函数一样是一个特殊的函数。构造函数在对象实例化时被调用，而析构函数在对象销毁时自动被调用。\n\n#### 声明和实现析构函数\n\n析构函数看起来是一个以类名的函数，但在前面有一个波号\
  \ (`~`)。因此，`class Human` 会有一个如下声明的析构函数：\n\n点击此处查看代码图片\n\n```cpp\nclass Human\n{\n\
  \    ~Human(); // 析构函数的声明\n};\n```\n\n此析构函数可以在类内内联实现，也可以在类声明外部实现。类内部的实现或定义如下所示：\n\
  \n点击此处查看代码图片\n\n```cpp\nclass Human\n{\npublic:\n   ~Human()\n   {\n       // 析构函数代码\n\
  \   }\n};\n```\n\n在类外部定义析构函数的变体如下：\n\n点击此处查看代码图片\n\n```cpp\nclass Human\n{\npublic:\n\
  \   ~Human();\n};\n\n// 实现\nHuman::~Human()\n{\n}\n```\n\n你可以看到，析构函数的声明与构造函数的不同之处在于包含一个波号\
  \ (`~`)。然而，析构函数的作用与构造函数相反。\n\n#### 何时使用析构函数\n\n析构函数在对象离开范围或通过 `delete` 删除时总是被调用的。这使得析构成为释放内存和其他资源的理想位置。本书建议使用\
  \ `std::string` 而非 `char*`，这样你就不需要担心内存的分配和及时释放。\n\n**列表 9.7** 一个通过析构函数确保字符缓冲区释放的简单类\n\
  \n点击此处查看代码图片\n\n```cpp\n  0: #include <iostream>\n  1: #include <string.h>\n  2:\
  \ using namespace std;\n  3: class MyString\n  4: {\n  5: private:\n  6:     char*\
  \ buffer;\n  7:\n  8: public:\n  9:     MyString(const char* initString) // constructor\n\
  \  10:     {\n  11:         if(initString != NULL)\n  12:         {\n  13:     \
  \        buffer = new char [strlen(initString) + 1];\n  14:             strcpy(buffer,\
  \ initString);\n  15:         }\n  16:         else\n  17:             buffer =\
  \ NULL;\n  18:     }\n  19:\n  20:     ~MyString()\n  21:     {\n  22:         cout\
  \ << \"Invoking destructor, clearing up\" << endl;\n  23:         if (buffer !=\
  \ NULL)\n  24:             delete [] buffer;\n  25:     }\n  26:\n  27:     int\
  \ GetLength()\n  28:     {\n  29:         return strlen(buffer);\n  30:     }\n\
  \  31:\n  32:     const char* GetString()\n  33:     {\n  34:         return buffer;\n\
  \  35:     }\n  36: };\n  37:\n  38: int main()\n  39:     {\n  40:     MyString\
  \ sayHello(\"Hello from String Class\");\n  41:     cout << \"String buffer in sayHello\
  \ is \" << sayHello.GetLength();\n  42:     cout << \" characters long\" << endl;\n\
  \  43:\n  44:     cout << \"Buffer contains: \" << sayHello.GetString() << endl;\n\
  \  45: }\n```\n\n\n\n\n\n该类基本上在 `MyString::buffer` 中封装了一个 C 风格的字符串，并让你免于分配内存的任务；每当你需要使用字符串时，它都会释放该内存。我们最感兴趣的行是第\
  \ 9–18 行的构造函数 `MyString()` 以及第 20–25 行的析构函数 `~MyString()`。构造函数通过一个强制性的输入参数来强制执行带有输入字符串的构造，然后在第\
  \ 13 行使用 `new` 和 `strlen` 为其分配内存，然后将其拷贝到字符 `buffer` 中。`strlen` 是标准库提供的一个函数，有助于确定输入字符串的长度。`strcpy`\
  \ 是第 14 行中使用的标准库函数，用于从源 `initString` 拷贝到由 `buffer` 指向的新分配内存中。如果类的用户提供的 `initString`\
  \ 为 `NULL`，则 `MyString::buffer` 也被初始化为 `NULL`（以防止该指针包含随机值，这在用于访问内存位置时可能是危险的）。析构函数代码的作用是确保构造函数中分配的内存自动返回给系统。它检查\
  \ `MyString::buffer` 是否为 `NULL`，如果是，则对它执行 `delete[]`，以补充构造函数中的 `new`。注意，在 `main()`\
  \ 函数的任何地方，程序员从未执行过 `new` 或 `delete`。除了从用户那里抽象出内存管理的实现外，`class MyString` 还确保了释放分配内存的逻辑正确性。析构函数\
  \ `~MyString()` 在 `main` 结束时被自动调用，这在执行析构函数中的 `cout` 语句的输出中得到了证明。\n\n更好地处理字符串的类是析构函数的许多适用场景之一。第\
  \ 26 节，“理解智能指针” 演示了析构函数如何在以更智能的方式处理指针方面的工作中起着至关重要的作用。\n\n### 注意事项\n\n析构函数不能被重载。一个类只能有一个析构函数。如果你忘记实现析构函数，编译器会创建并调用一个虚拟析构函数，即一个空析构函数（不会对动态分配的内存进行清理）。\n\
  \n### 拷贝构造函数\n\n在 第 7 节，“用函数组织代码”中，你学习了传递给类似 `Area()` 函数（显示在 列表 7.1 中）的参数会被拷贝：\n\
  \n```cpp\ndouble Area(double radius);\n```\n\n因此，当调用 `Area()` 时，作为参数 `radius` 发送的内容会被拷贝。这一规则同样适用于对象，即类的实例。\n\
  \n#### 浅拷贝和相关问题\n\n如 列表 9.7 所示，`MyString` 等类包含一个指针成员 `buffer`，该指针指向动态分配的内存，该内是在构造函数中使用\
  \ `new` 分配，并在析构函数中使用 `delete[]` 释放的。当该类的对象被拷贝时，指针成员会被拷贝，但所指向的内存不会，这导致两个对象指向内存中同一个动态分配的缓冲区。当一个对象被析构时，`delete[]`\
  \ 会释放内存，从而使另一个对象持有的指针拷贝失效。这种拷贝是*浅拷贝*，对程序的稳定性构成了威胁，如 列表 9.8 所示。\n\n**列表 9.8** 按值传递类\
  \ `MyString` 类对象的问题\n\n点击此处查看代码图像\n\n```cpp\n0: #include <iostream>\n1: #include\
  \ <string.h>\n2: using namespace std;\n3: class MyString\n4: {\n5: private:\n6:\
  \     char* buffer;\n7:\n8: public:\n9:     MyString(const char* initString) //\
  \ 构造函数\n10:     {\n11:         buffer = NULL;\n12:         if(initString != NULL)\n\
  13:         {\n14:             buffer = new char [strlen(initString) + 1];\n15:\
  \             strcpy(buffer, initString);\n16:         }\n17:     }\n18:\n19:  \
  \   ~MyString() // 析构函数\n20:     {\n21:         cout << \"Invoking destructor, clearing\
  \ up\" << endl;\n22:     }\n```\n\n\n\n\n因此，拷贝构造函数接收一个同类对象的引用作为参数。该参数是源对象的别名，也是你在编写自定义拷贝代码时所使用的句柄。你会使用拷贝构造函数来确保源中所有缓冲区都进行深拷贝，如\
  \ 列表 9.9 所示。\n\n### 列表 9.9 定义拷贝构造函数以确保动态分配缓冲区的深拷贝\n\n点击此处查看代码图像\n\n```cpp\n0: #include\
  \ <iostream>\n1: #include <string.h>\n2: using namespace std;\n3: class MyString\n\
  4: {\n5: private:\n6:     char* buffer;\n7:\n8: public:\n9:     MyString(const char*\
  \ initString) // 构造函数\n10:     {\n11:         buffer = NULL;\n12:         cout <<\
  \ \"Default constructor: creating new MyString\" << endl;\n13:         if(initString\
  \ != NULL)\n14:         {\n15:             buffer = new char [strlen(initString)\
  \ + 1];\n16:             strcpy(buffer, initString);\n17:\n18:             cout\
  \ << \"buffer points to: 0x\" << hex;\n19:             cout << (unsigned int*)buffer\
  \ << endl;\n20:         }\n21:     }\n22:\n23:     MyString(const MyString& copySource)\
  \ // 拷贝构造函数\n24:     {\n25:         buffer = NULL;\n26:         cout << \"Copy constructor:\
  \ copying from MyString\" << endl;\n27:         if(copySource.buffer != NULL)\n\
  28:         {\n29:             // 分配自己的缓冲区\n30:             buffer = new char [strlen(copySource.buffer)\
  \ + 1];\n31:\n32:             // 从源对象深拷贝到本地缓冲区\n33:             strcpy(buffer, copySource.buffer);\n\
  34:\n35:             cout << \"buffer points to: 0x\" << hex;\n36:             cout\
  \ << (unsigned int*)buffer << endl;\n37:         }\n38:     }\n39:\n40:     // 析构函数\n\
  41:     ~MyString()\n42:     {\n43:         cout << \"Invoking destructor, clearing\
  \ up\" << endl;\n44:         delete [] buffer;\n45:     }\n46:\n47:     int GetLength()\n\
  48:     { return strlen(buffer); }\n49:\n50:     const char* GetString()\n51:  \
  \   { return buffer; }\n52: };\n53:\n54: void UseMyString(MyString str)\n55: {\n\
  56:     cout << \"String in MyString is \" << str.GetLength();\n57:     cout <<\
  \ \" characters long\" << endl;\n58:\n59:     cout << \"buffer contains: \" << str.GetString()\
  \ << endl;\n60:     return;\n61: }\n62:\n63: int main()\n64: {\n65:     MyString\
  \ sayHello(\"Hello from Class\");\n66:     UseMyString(sayHello);\n67:     return\
  \ 0;\n68: }\n```\n\n输出：点击此处查看代码图像\n```\nDefault constructor: creating new MyString\n\
  buffer points to: 0x123D9\nCopy constructor: copying from MyString\nbuffer points\
  \ to: 0x123D8\nString in MyString is 17 characters long\nbuffer contains: Hello\
  \ from Class\nInvoking destructor, clearing up\nInvoking destructor, clearing up\n\
  ```\n\n### 分析\n\n大部分代码与 列表 9.8 相似，不同之处在于第 23–38 行创建了一个新副本。首先，让我们关注 `main()`，它（和之前一样）在第\
  \ 65 行创建了对象 `sayHello`。创建 `sayHello` 导致了输出的第一行，它来自 `MyString` 的构造函数，位于第 12 行。为了方便起见，构造函数还显示了\
  \ `buffer` 指向的内存地址。`main()` 随后在第 66 行通过值传递将 `sayHello` 传递给函数 `UseMyString()`，这自动导致拷贝构造函数的调用，如输出所示。拷贝构造函数中的代码与构造函数中的代码相似。基本思想相同：在第\
  \ 30 行检查拷贝源中包含的 C 风格字符串 `buffer` 的长度，在自己的 `buffer` 实例中分配比例的内存， 然后在第 33 行使用 `strcpy`\
  \ 从源拷贝到目标地。这不是指针值的浅拷贝。这是一次深拷贝，其中所指向的内容被拷贝到属于该对象的新分配缓冲区中，如 图 9.4 所示。\n\n![图像](img/09fig04.jpg)\n\
  \n**图 9.4** 当调用函数 `UseMyString()` 时，将参数 `sayHello` 深拷贝到参数 `str` 的插图。\n\n列表 9.9 中的输出表明，所指向的内存地址是不同的。当\
