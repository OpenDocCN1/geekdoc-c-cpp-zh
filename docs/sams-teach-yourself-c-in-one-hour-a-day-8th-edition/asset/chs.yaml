  \n## 第 11 ：多态\n\n在学习了继承的基础、创建继承体系结构，并理解了公有继承本质上是在模拟一种“是一个”（is-a）的关系之后，是时候通过运用这些知识来学习面向对象编程的圣杯：多态了。\n\
  \n在本节中，你将了解到：\n\n- ![Image](img/square.jpg) 多态的真正含义\n- ![Image](img/square.jpg)\
  \ 虚函数的作用是什么以及如何使用它们\n- ![Image](img/square.jpg) 什么是抽象基类以及如何声明它们\n- ![Image](img/square.jpg)\
  \ 虚继承意味着什么以及你何时需要它\n\n### 多态的基础知识\n\n“Poly”在希腊语中意为*许多*，而“morph”意味着*形式*。多态是面向对象语言的一种特性，允许不同类型的对象以相似的方式被对待。本节重点关注可以通过\
  \ C++ 继承体系结构实现的多态行为，也称为*子类型多态*。\n\n### 多态行为的需求\n\n在第 10 节 “实现继承，(#ch10.html_ch10)”中，你你发现了\
  \ `Tuna` 和 `Carp` 如何从 `Fish` 继承公有方法 `Swim()`，如[列表 10.1 所示。然而，`Tuna` 和 `Carp` 也有可能提供自己的\
  \ `Tuna::Swim()` 和 `Carp::Swim()` 方法，以使它们成为不同的游泳者。但是，由于它们中的每一个也都是 `Fish`，如果一个拥有\
  \ `Tuna` 实例的用户使用基类类型来调用 `Fish::Swim()`，他最终只执行了通用的部分 `Fish::Swim()` 而不是 `Tuna::Swim()`，即使该基类实例\
  \ `Fish` 是 `Tuna` 的一部分。这个问题在列表 11.1 中得到了演示。\n\n---\n\n注意\n\n本节中的所有代码示例已精简到解释相关主题所需的核心内容，并尽可能减少代码行数以提高可读性。\n\
  \n当你编写程序时，你应该正确地编写类并创建有意义的继承结构，同时考虑到应用程序的设计和目的。\n\n---\n\n**列表 11.1** 使用属于 `Tuna`\
  \ 的基类 `Fish` 实例来调用方法\n\n点击此处查看代码图片\n\n---\n\n```cpp\n0: #include <iostream>\n1:\
  \ using namespace std;\n2:\n3: class Fish\n4: {\n5: public:\n6:     void Swim()\n\
  7:     {\n8:         cout << \"Fish swims! \" << endl;\n9:     }\n10: };\n11:\n\
  12: class Tuna:public Fish\n13: {\n14: public:\n15:     // override Fish::Swim\n\
  16:     void Swim()\n17:     {\n18:         cout << \"una swims!\" << endl;\n19:\
  \     }\n20: };\n21:\n22: void MakeFish(Fish& inputFish)\n23: {\n24:     // calling\
  \ Fish::Swim\n25:     inputFish.Swim();\n26: }\n27:\n28: int main()\n29: {\n30:\
  \     Tuna myDinner;\n31:\n32:     // calling Tuna::Swim\n33:     myDinner.Swim();\n\
  34:\n35:     // sending Tuna as Fish\n36:     MakeFish(myDinner);\n37:\n38:    \
  \ return 0;\n39: }\n```\n\n输出 ![Image](img/arrow.jpg)\nuna swims!\nFish swims!\n\
  \n分析 ![Image](img/arrow.jpg)\n`class Tuna` 通过公有继承特化了 `class Fish`，如第 12 行所示。它还重写了\
  \ `Fish::Swim()`。`main()` 直接调用了该方法。`main()` 实际上调用了 `Tuna::Swim()`（第 33 行），并将 `Tuna`\
  \ 作为 `Fish` 传递给 `MakeFish(myDinner)`（第 36 行）。如果拥有 `Tuna` 实例的用户使用基类类型来调用 `Fish::Swim()`，他最终只执行了通用的部分\
  \ `Fish::Swim()` 而不是 `Tuna::Swim()`，即使该基类实例 `Fish` 是 `Tuna` 的一部分。\n\n---\n\n###\
  \ 使用虚函数实现多态\n\n你通过指针或引用访问 `Fish` 类型的对象，如下：\n\n```cpp\npFish->Swim();\nmyFish.Swim();\n\
  ```\n\n你期望的是，如果 `Swim()` 被声明为虚函数，编译器将确保调用请求的基类的变体。因此，如果 `Swim()` 在基类 `Fish` 中声明为虚函数，调用\
  \ `myFish.Swim()`（`myFish` 类型为 `Fish&`）将导致执行 `Tuna::Swim()`。这种多态意味着在基类 `Fish` 中声明\
  \ `Swim()` 为虚函数：\n\n```cpp\nclass Base\n{\n   virtual void Method();\n};\n```\n\n\
  如果 `Derived` 继承自 `Base` 并重写了它：\n\n```cpp\nclass Derived : Base\n{\n   void Method()\
  \ override;\n};\n```\n\n使用 `using` 关键字在继承体系结构中如何帮助我？\n\n\n\n\n函数 `MakeFishSwim(Fish&)`\
  \ 的实现自 Listing 11.1 以来没有发生任何变化。然而，它产生的输出却大不相同。其中，`Fish::Swim()` 完全没有被调用，因为存在重写变\
  \ `Tuna::Swim()` 和 `Carp::Swim()`，这些变体的优先级高于 `Fish::Swim()`，因为后者被声明为 `virtual` 函数。这是一个非常重要的进展。它意味着即使在不知道正在处理的\
  \ `Fish` 准确类型的情况下，仅通过基类实例，实现 `MakeFishSwim()` 也能调用在不同派生类中定义的不同 `Swim()` 实现。\n\n\
  这就是多态：将不同的鱼视为一种共同类型 `Fish`，同时确保执行由派生类型提供的 `Swim()` 的正确实现。\n\n### 虚析构函数的必要性\n\nListing\
  \ 11.1 所展示的功能有一个更阴险的侧面——当有特化版本可用时，无意中调用了派生类型实例的基类功能。当一个函数使用类型为 `Base*` 的指针调用运算符\
  \ `delete`，而该指针实际上指向类型为 `Derived` 的实例时，会发生什么？\n\n将调用哪个析构函数？参见 Listing 11.3。\n\n\
  **LISTING 11.3** 在 `Base*` 上调用运算符 `delete` 的一个函数\n\n点击此处查看代码图像\n\n```cpp\n0: #include\
  \ <iostream>\n1: using namespace std;\n2:\n3: class Fish\n4: {\n5: public:\n6: \
  \    Fish()\n7:     {\n8:         cout << \"Constructed Fish\" << endl;\n9:    \
  \ }\n10:    ~Fish()\n11:    {\n12:         cout << \"Destroyed Fish\" << endl;\n\
  13:    }\n14: };\n15:\n16: class Tuna:public Fish\n17: {\n18: public:\n19:     Tuna()\n\
  20:     {\n21:         cout << \"Constructed Tuna\" << endl;\n22:     }\n23:   \
  \  ~Tuna()\n24:     {\n25:         cout << \"Destroyed Tuna\" << endl;\n26:    \
  \ }\n27: };\n28:\n29: void DeleteFishMemory(Fish* pFish)\n30: {\n31:     delete\
  \ pFish;\n32: }\n33:\n34: int main()\n35: {\n36:     cout << \"Allocating a Tuna\
  \ on the free store:\" << endl;\n37:     Tuna* pTuna = new Tuna;\n38:     cout <<\
  \ \"Deleting the Tuna: \" << endl;\n39:     DeleteFishMemory(pTuna);\n40:\n41: \
  \    cout << \"Instantiating a Tuna on the stack:\" << endl;\n42:     Tuna myDinner;\n\
  43:     cout << \"Automatic destruction as it goes out of scope: \" << endl;\n44:\n\
  45:     return 0;\n46: }\n```\n\n输出 ![Image](img/arrow.jpg)\n\n点击此处查看代码图像\n\nAllocating\
  \ a Tuna on the free store:\n\nConstructed Fish\nConstructed Tuna\n\nDeleting the\
  \ Tuna:\nDestroyed Fish\n\nInstantiating a Tuna on the stack:\n\nConstructed Fish\n\
  Constructed Tuna\n\nAutomatic destruction as it goes out of scope:\n\nDestroyed\
  \ Tuna\nDestroyed Fish\n\n分析 ![Image](img/arrow.jpg)\n\n`main()` 在第 37 行使用 `new`\
  \ 在自由存储区上创建了一个 `Tuna` 实例，并在第 39 行使用服务函数 `DeleteFishMemory()` 后立即释放了分配的内存。为了比较，另一个\
  \ `Tuna` 实例作为局部变量 `myDinner` 在栈上创建，并在 `main()` 结束时超出作用域。输出是由 `Fish` 和 `Tuna` 类构造函数和析构函数中的\
  \ `cout` 语句生成的。注意，虽然 `Tuna` 和 `Fish` 都由于 `new` 在自由存储区上被构造，但在 `delete` 期间，`Tuna`\
  \ 的析构函数没有被调用，而是调用了 `Fish` 的。这与局部变量 `myDinner` 的构造和析构形成鲜明对比，后者所有的构造函数和析构函数都被调用。第\
  \ 10 节 在 Listing 10.7 中展示了继承体系中类构造和析构的正确顺序，显示了所有析构函数都需要被调用，包括 `~Tuna`。显然，有些不对。\n\
  \n这个缺陷意味着，如果使用类型为 `Base*` 的指针调用 `delete`，那么使用 `new` 在自由存储区上实例化的派生类的析构函数将不会被调用。这可能导致资源未释放、内存泄漏等，这是一个不容轻视的问题。\n\
  \n为了避免这个问题，你使用了如 Listing 11.4 所示的 `virtual` 析构函数。\n\n**LISTING 11.4** 使用 `virtual`\
  \ 析构函数以确保在删除类型为 `Base*` 的指针时派生类中的析构函数被调用\n\n点击此处查看代码图像\n\n```cpp\n0: #include <iostream>\n\
  1: using namespace std;\n2:\n3: class Fish\n4: {\n5: public:\n6:     Fish()\n7:\
  \     {\n8:         cout << \"Constructed Fish\" << endl;\n9:     }\n10:    virtual\
  \ ~Fish() // 虚析构\n11:    {\n12:         cout << \"Destroyed Fish\" << endl;\n13:\
  \    }\n14: };\n15:\n16: class Tuna:public Fish\n17: {\n18: public:\n19:     Tuna()\n\
  20:     {\n21:         cout << \"Constructed Tuna\" << endl;\n22:     }\n23:   \
  \  ~Tuna()\n24:     {\n25:         cout << \"Destroyed Tuna\" << endl;\n26:    \
  \ }\n27: };\n28:\n29: void DeleteFishMemory(Fish* pFish)\n30: {\n31:     delete\
  \ pFish;\n32: }\n33:\n34: int main()\n35: {\n36:     cout << \"Allocating a Tuna\
  \ on the free store:\" << endl;\n37:     Tuna* pTuna = new Tuna;\n38:     cout <<\
  \ \"Deleting the Tuna: \" << endl;\n39:     DeleteFishMemory(pTuna);\n40:\n41: \
  \    cout << \"Instantiating a Tuna on the stack:\" << endl;\n42:     Tuna myDinner;\n\
  43:     cout << \"Automatic destruction as it goes out of scope: \" << endl;\n44:\n\
  45:     return 0;\n46: }\n```\n\n输出 ![Image](img/arrow.jpg)\n\n点击此处查看代码图像\n\nAllocating\
  \ a Tuna on the free store:\n\nConstructed Fish\nConstructed Tuna\n\nDeleting the\
  \ Tuna:\nDestroyed Tuna\nDestroyed Fish\n\nInstantiating a Tuna on the stack:\n\n\
  Constructed Fish\nConstructed Tuna\n\nAutomatic destruction as it goes out of scope:\n\
  \nDestroyed Tuna\nDestroyed Fish\n\n分析 ![Image](img/arrow.jpg)\n\nListing 11.4 相比于\
  \ Listing 11.3 的唯一改进是在第 10 行声明基类 `class Fish` 析构函数时增加了 `virtual` 关键字。注意这一微小的变化使得在对指向\
  \ `Tuna` 的 `Fish*` 调用 `delete` 时，编译器除了执行 `Fish::~Fish()` 外还执行了 `Tuna::~Tuna()`。\n\
  \n注意：始终将基类析构函数声明为 `virtual`：\n\n```cpp\nclass Base\n{\npublic:\n    virtual ~Base()\
  \ {};\n};\n```\n\n这确保了拥有 `pointer Base*` 的无法通过 `delete` 导致派生类实例无法被正确析构。\n\n\n\n\n\
  \n考虑一个声明了 `N` 个虚函数的 `class Base` 类：\n\n点击此处查看代码图片\n\n```cpp\nclass Base\n{\npublic:\n\
  \    virtual void Func1()\n    {\n      // Func1 implementation\n    }\n    virtual\
  \ void Func2()\n    {\n      // Func2 implementation\n    }\n    // ..以此此类推\n  \
  \  virtual void FuncN()\n    {\n      // FuncN implementation\n    }\n};\n```\n\n\
  继承自 `Base` 的 `class Derived` 类重写了 `Base::Func2()`，并直接暴露了 `class Base` 中的其他虚函数：\n\
  \n点击此处查看代码图片\n\n```cpp\nclass Derived: public Base\n{\npublic:\n    virtual void\
  \ Func1()\n    {\n      // Func2 overrides Base::Func2()\n    }\n    // no implementation\
  \ for Func2()\n    virtual void FuncN()\n    {\n      // FuncN implementation\n\
  \    }\n};\n```\n\n编译器看到了继承层次结构，并理解 `Base` 定义了某些在 `Derived` 中被重写的虚函数。编译器现在做的是为每个实现虚函数的类或重写了虚函数的派生类创建一个名为虚函数表（Virtual\
  \ Function Table, VFT）的表。也就是说，类 `Base` 和 `Derived` 得到了它们各自的虚函数表实例。当实例化这些类的对象时，一个隐藏的指针（我们称其为\
  \ `VFT*`）会被初始化为相应的 VFT。虚函数表可以可视化为包含函数指针的静态数组，每个指针都指向感兴趣的虚函数（或重写函数），如图 11.1 所示。\n\
  \n![Image](img/11fig01.jpg)\n\n**图 11.1** 类 `Derived` 和 `Base` 的虚函数表可视化。\n\n因此，每个表都由函数指针组成，每个指针都指向虚函数的可用实现。在\
  \ `class Derived` 的情况下，其 VFT 中除一个函数指针外，所有指针都指向 `Derived` 中虚方法的本地实现。`Derived` 没有重写\
  \ `Base::Func2()`，因此该函数指针指向 `class Base` 中的实现。\n\n这意味着当 `class Derived` 的用户调用\n\n\
  点击此处查看代码图片\n\n```cpp\nCDerived objDerived;\nobjDerived.Func2();\n```\n\n编译器会确保在\
  \ `class Derived` 的 VFT 中进行查找，并确保调用了 `Base::Func2()` 实现。这同样适用于使用已虚重写方法的调用：\n\n点击此处查看代码图片\n\
  \n```cpp\nvoid DoSomething(Base& objBase)\n{\n    objBase.Func1();   // invoke Derived::Func1\n\
  }\n\nint main()\n{\n    Derived objDerived;\n    DoSomething(objDerived);\n};\n\
  ```\n\n在这种情况下，尽管 `objDerived` 正在通过 `objBase` 被解释为 `class Base` 的实例，但该实例中的 VFT 指针仍然指向为\
  \ `class Derived` 创建的同一个表。因此，通过此 VFT 执行的 `Func1()` 无疑是 `Derived::Func1()`。\n\n这就是虚函数表如何帮助\
  \ C++ 中（子类型）多态的实现。隐藏虚函数表指针存在的证明由列表 11.5 所示，该列表比较了两个相同类的 `sizeof`——一个具有虚函数，另一个没有。\n\
  \n**列表 11.5** 通过比较两个完全相同但仅在一个函数上声明为虚函数的类，证明隐藏 VFT 指针的存在。\n\n点击此处查看代码图片\n\n```cpp\n\
  0: #include <iostream>\n1: using namespace std;\n2:\n3: class SimpleClass\n4: {\n\
  5:     int a, b;\n6:\n7: public:\n8:     void DoSomething() {}\n9: };\n10:\n11:\
  \ class Base\n12: {\n13:     int a, b;\n14:\n15: public:\n16:     virtual void DoSomething()\
  \ {}\n17: };\n18:\n19: int main()\n20: {\n21:     cout << \"sizeof(SimpleClass)\
  \ = \" << sizeof(SimpleClass) << endl;\n22:     cout << \"sizeof(Base) = \" << sizeof(Base)\
  \ << endl;\n23:     return 0;\n24: }\n```\n\n使用 32 位编译器的输出 ![Image](img/arrow.jpg)\
  \ 点击此处查看代码图片\n`sizeof(SimpleClass) = 8`\n`sizeof(Base) = 12`\n\n使用 64 位编译器的输出 ![Image](img/arrow.jpg)\
  \ 点击此处查看代码图片\n`sizeof(SimpleClass) = 8`\n`sizeof(Base) = 16`\n\n分析 ![Image](img/arrow.jpg)\n\
  这是一个被精简到极限的示例。查看两个相同的类，`SimpleClass` 和 `Base`。\n\n### 抽象基类与纯虚函数\n\n不能实例化的类被称为抽象基类。一个类如果包含至少一个纯虚函数，它就是抽象基类。抽象基类通常作为接口使用，强制派生类实现特定的方法。\n\
  \n一个类如果声明了纯虚函数，该基类如下所示：\n\n点击此处查看代码图片\n\n```cpp\nclass AbstractBase\n{\npublic:\n\
  \    // 定义一个纯虚函数\n    virtual void DoSomething() = 0;\n};\n```\n\n这本质上告诉编译器，`Derived`\
  \ 类必须实现：\n\n点击此处查看代码图片\n\n```cpp\nclass Derived: public AbstractBase\n{\npublic:\n\
  \    // 必须实现的虚函数\n    void DoSomething()\n    {\n      cout << \"Implemented function\"\
  \ << endl;\n    }\n};\n```\n\n因此，`AbstractBase` 所做的是强制 `Derived` 类提供虚方法的实现。这种基类可以强制派生类实现具有特定名称和签名的方法的功能这被称为接口。再次考虑\
  \ `Fish`。想象一个 `Tuna` 因为没有重写 `Fish::Swim()` 而无法快速游泳。将 `Fish` 设为抽象基类并将 `Swim` 设为纯虚函数，可以确保派自\
  \ `Fish` 的 `Tuna` 实现 `Tuna::Swim()` 并像 `Tuna` 一样游泳，而不是像任何 `Fish`。\n\n\n\n\n\n```cpp\n\
  36: Tuna myDinner;\n38: MakeFishSwim(myLunch);\n39: MakeFishSwim(myDinner);\n41:\
  \ return 0;\n42: }\n```\n\nOutput: ![Image](img/arrow.jpg)\n\n点击此处查看代码图像\n\n鲤鱼在湖里游得慢！\n\
  金枪在海里游得快！\n\n### 分析\n![Image](img/arrow.jpg)\n\n`main()` 函数中第 34 行的第一行（被注释掉）非常重要。它说明了编译器不允许你创建一个抽象基类（`ABC`）`Fish`\
  \ 的实例。它期望的是一个具体的类，例如 `Fish` 的特化类——例如 `Tuna`——这在现实世界的物体安排中是有意义的。得益于第 7 行声明的纯虚函数 `Fish::Swim()`，`Tuna`\
  \ 和 `Carp` 都被强制实现 `Tuna::Swim()` 和 `Carp::Swim()`。第 27–30 行实现 `MakeFishSwim(Fish&)`\
  \ 的部分说明，即使抽象基类不能实例化，你也可以将其作为引用或指针使用。因此，抽象基类是声明你期望派生类实现并满足的函数的非常好机制。如果派生自 `Fish`\
  \ 的类 `Trout` 忘记实现 `Trout::Swim()`，编译也会失败。\n\n**注意**\n抽象基类通常简单称为 ABCs。\n\nABCs 有助于对你的程序执行某些设计约束。\n\
  \n### 使用虚继承解决菱形问题\n在第 10 节中，你看到了一个鸭嘴兽的奇特案例，它部分是哺乳动物，部分鸟类，部分爬行动动物。这是一个 `class Platypus`\
