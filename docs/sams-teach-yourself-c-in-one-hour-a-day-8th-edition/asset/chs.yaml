  \ 181，然后演示了各种位操作的影响。\n\n### 位右移 (`>>`)、位左移 (`<<`) 运算符\n\n### 复合赋值运算符\n\n复合赋值运算符是赋值运算符，其中左侧的操作数被赋值为操作的结果。考虑以下代码：\n\
