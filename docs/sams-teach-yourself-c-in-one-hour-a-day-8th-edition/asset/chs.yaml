  ### 分析\n前面的代码包含了针对 `integer` 类型的 `vector` 类模板特化；换句话说，它实例化了一个整数类型的 `vector`。这个名为\
  \ `integers` 的 `vector` 使用了第 5 行中的默认构造函数，当你不知道容器的最小大小需求时这非常有用——即你不知道想要在其中存储多少个整数。第\
  \ 8 行所示的第二种实例化形式使用了 C++11 引入的列表初始化概念，将 `initVector` 初始化为包含三个元素的 vector，其值分别为 202、2017\
  \ 和 -1。如第 11 行和第 14 行所示的 `vector` 实例化是程序员知道他需要一个至少包含 10 个元素的 `vector`。请注意，这并没有限制容器的最终\
  \ `size`，而只是设置了初始 `size`。最后，第 17 行和第 20 行演示了如何使用一个 `vector` 来实例化另一个的内容——换句话说，创建一个另一个\
  \ vector 的拷贝或其部分的 `vector` 对象。这也是适用于所有 STL 容器的结构。最后一种形式是使用迭代器的。`partialCopy` 包含了来自\
  \ `vecWithTenElements` 的前五个元素。\n\n**注意**\n第四种结构仅适用于相同类型的对象。因此，你可以实例化一个 `vecArrayCopy`——使用另一个整数对象的\
  \ `vector` 来实例化一个整数对象的 `vector`。如果其中一个是例如 `float` 类型的 `vector`，则代码将无法编译。\n\n###\
  \ 使用 `push_back()` 在末尾插入元素\n在实例化一个整数 `vector` 后，显而易见的下一个任务是向其中插入元素（整数）。`vector`\
  \ 中的插入发生在数组的末尾，并使用成员函数 `push_back()` 将元素“推入”其后部：\n\n点击此处查看代码图像\n\n```cpp\nvector\
  \ <int> integers;  // 声明一个 int 类型的 vector\n\n// 向 vector 插入示例整数：\nintegers.push_back\
  \ (50);\nintegers.push_back (1);\n```\n\n列表 17.2 展示了在动态向 `std::vector` 添加元素时如何使用\
  \ `push_back()`。\n\n**列表 17.2** 使用 `push_back()` 在 Vector 中插入元素\n\n点击此处查看代码图像\n\n\
  ```cpp\n0: #include <iostream>\n1: #include <vector>\n2: using namespace std;\n\
  3:\n4: int main ()\n5: {\n6:     vector <int> integers;\n7:\n8:     // 向 vector\
  \ 插入示例整数：\n9:     integers.push_back (50);\n10:    integers.push_back (1);\n11:\
  \    integers.push_back (987);\n12:    integers.push_back (1001);\n13:\n14:    cout\
  \ << \"The vector contains \";\n15:    cout << integers.size() << \" Elements\"\
  \ << endl;\n16:\n17:    return 0;\n18: }\n```\n\n**输出**\nThe vector contains 4 Elements\n\
  \n点击此处查看代码图像\n\n`push_back()` 如第 9 行所示，是 `vector` 类在数组末尾插入元素的成员函数。注意 `size()`，它返回容器持有的元素数量。\n\
  \n### 列表初始化\nC++11 通过初始化列表提供了功能，这种功能允许你像初始化静态数组一样实例化 `vector`：\n\n点击此处查看代码图像\n\n\
  ```cpp\nvector<int> integers = {50, 1, 987, 1001};\n```\n\n### 使用 `insert()` 在指定位置插入\n\
  使用 `push_back()` 在末尾插入元素。如果你想在中间插入呢？许多 STL 容器包括 `vector` 都具有多个重载的 `insert()` 函数。\n\
  \n在其中一种形式中，你可以指定元素插入到序列的位置：\n\n点击此处查看代码图像\n\n```cpp\n// 在开头插入元素\nintegers.insert\
  \ (integers.begin(), 25);\n```\n\n在另一种形式中，你可以指定位置以及需要插入的元素数量：\n\n点击此处查看代码图像\n\n\
  ```cpp\n// 在末尾插入 2 个 45 的元素\nintegers.insert (integers.end(), 2, 45);\n```\n\n你还可以将一个\
  \ vector 的内容插入另一个的位置：\n\n点击此处查看代码图像\n\n```cpp\n// 另一个包含 2 个 30 的 vector\nvector\
  \ <int> another (2, 30);\n// 在位置 [1] 插入另一个的元素\nintegers.insert (integers.begin()\
  \ + 1, another.begin(), another.end());\n```\n\n你使用由 `begin()` 或 `end()` 返回的迭代器来告诉\
  \ `insert()` 函数放置新元素的位置。\n\n**提示**\n该迭代器也可以是 STL 算法的返回值，例如 `find()` 函数，它可以查找元素并在该位置插入另一个（插入会移动找到的元素）。`find()`\
  \ 等算法将在第 23 节 中详细讨论。\n\n这些 `vector::insert()` 形式在列表 17.3 中进行了演示。\n\n\n\n\n\n```cpp\n\
  23:     integers.insert (integers.begin (), 25);\n24:\n25:     // 在末尾插入两个值为 45 的数字\n\
  26:     integers.insert (integers.end (), 2, 45);\n27:\n28:     cout << \"Vector\
  \ after inserting elements at beginning and end: \";\n29:     DisplayVector(integers);\n\
  30:\n31:     // 另一个包含 2 个值为 30 元素的 vector\n32:     vector <int> another (2, 30);\n\
  33:\n34:     // 在位置 [1] 插入来自另一个容器的两个元素\n35:     integers.insert (integers.begin\
  \ () + 1,\n36:         another.begin (), another.end ());\n37:\n38:     cout <<\
  \ \"Vector after inserting contents from another vector: \";\n39:     cout << \"\
  in the middle:\" << endl;\n40:     DisplayVector(integers);\n41:\n42:     return\
  \ 0;\n43: }\n```\n\n输出 ![Image](img/arrow.jpg)\n\n点击此处查看代码图像\n\nvector 的初始内容：90\
  \ 90 90 90\n\n在开头和末尾插入元素后的 vector：25 90 90 90 90 45 45\n\n从另一个 vector 插入内容后的 vector：在中间：\n\
  \n25 30 30 90 90 90 90 45 45\n\n### 分析 ![Image](img/arrow.jpg)\n\n这段代码演示了 `insert()`\
  \ 函数的强大之处，它允许你将值存放在容器的中间。第 17 行中的 `vector` 包含四个个元素，它们都初始化为 90。以这个 vector 为起点，我们使用了\
  \ `vector::insert()` 成员函数的多种重载形式。在第 23 行中，你在开头添加了一个元素。第 26 行在末尾添加了两个值为 45 的元素。第\
  \ 35 行演示了如何将元素从一个 vector 插入另一个 vector 的中间（在本例中是偏移量为 1 的第二个位置）。\n\n尽管 `vector::insert()`\
  \ 是一个通用函数，但 `push_back()` 应该是向 vector 添加元素的首选方法。这是因为 `insert()` 向 vector 添加元素是一种低效的方法（当在序列末尾以外的位置添加时），因为在开头或中间添加元素会导致\
  \ `vector` 类将所有后续元素向后移动（在为末尾最后的元素留出空间之后）。因此，取决于序列中包含的对象类型，这种移动操作的代价在调用的拷贝构造函数或拷贝赋值运算符方面可能会是巨大的。在我们的小示例中，`vector`\
  \ 包含 `int` 类型的对象，移动起来相对便宜。在 `vector` 类的许多其他用法中情况可能并非如此。\n\n### 提示\n\n如果你的容器需要在中间非常频繁地插入，理想情况下你应该选择\
  \ 第 18 节解释的“STL `list` 和 `forward_list`”。\n\n### 使用数组语义访问 vector 中的元素\n\n可以通过以下方法访问\
  \ `vector` 中的元素：通过使用下标运算符（`[]`）的数组语义、使用成员函数 `at()` 或使用迭代器。\n\n列表 17.1 显示了如何创建一个初始化了\
  \ 10 个元素的 `vector` 实例：\n\n点击此处查看代码图像\n\n```cpp\nstd::vector <int> tenElements (10);\n\
  ```\n\n你可以使用类似数组的语法访问和设置单个元素：\n\n点击此处查看代码图像\n\n```cpp\ntenElements[3] = 2011; //\
  \ 设置第 4 个元素\n```\n\n列表 17.4 演示了如何使用下标运算符（`[]`）访问 vector 中的元素。\n\n**列表 17.4** 使用数组语义访问\
  \ `vector` 中的元素\n\n点击此处查看代码图像\n\n```cpp\n0: #include <iostream>\n1: #include <vector>\n\
  2:\n3: int main ()\n4: {\n5:     using namespace std;\n6:     vector <int> integers{50,\
  \ 1, 987, 1001 };\n7:\n8:     for (size_t index = 0; index < integers.size (); ++index)\n\
  9:     {\n10:         cout << \"Element[\" << index << \"] = \";\n11:         cout\
  \ << integers[index] << endl;\n12:     }\n13:\n14:     integers[2] = 2011; // 修改第\
  \ 3 个元素\n15:     cout << \"After replacement: \" << endl;\n16:     cout << integers[2]\
  \ << endl;\n17:\n18:     return 0;\n19: }\n```\n\n输出 ![Image](img/arrow.jpg)\n\n\
  点击此处查看代码图像\n\nElement[0] = 50\nElement[1] = 1\nElement[2] = 987\nElement[3] = 1001\n\
  After replacement:\nElement[2] = 2011\n\n*(注：由于原文代码块部分略有缺失或错位，翻译时已根据逻辑补全了输出内容)*\n\
  \n\n\n\n\n正如 `vector` 通过 `push_back()` 函数在末尾插入元素一样，它也通过 `pop_back()` 函数删除末尾的元素。使用\
  \ `pop_back()` 从 `vector` 中删除元素需要常数时间——这意味着所需的时间与存储在 `vector` 中的元素数量无关。接下来的代码列表\
  \ 17.6 所示，演示了如何使用函数 `pop_back()` 删除 `vector` 末尾的元素。\n\n**列表 17.6** 使用 `pop_back()`\
  \ 删除最后一个元素\n\n点击此处查看代码图像\n\n* * *\n\n```cpp\n0: #include <iostream>\n1: #include\
  \ <vector>\n2: using namespace std;\n3:\n4: template <typename T>\n5: void DisplayVector(const\
  \ vector<T>& inVec)\n6: {\n7:     for (auto element = inVec.cbegin(); // auto and\
  \ cbegin(): C++11\n8:             element != inVec.cend();  // cend() is new in\
  \ C++11\n9:             ++ element )\n10:        cout << *element << ' ';\n11:\n\
  12:     cout << endl;\n13: }\n14:\n15: int main ()\n16: {\n17:     vector <int>\
  \ integers;\n18:\n19:     // Insert sample integers into the vector:\n20:     integers.push_back\
  \ (50);\n21:     integers.push_back (1);\n22:     integers.push_back (987);\n23:\
  \     integers.push_back (1001);\n24:\n25:     cout << \"Vector contains \" << integers.size\
  \ () << \" elements: \";\n26:     DisplayVector(integers);\n27:\n28:     // Erase\
  \ one element at the end\n29:     integers.pop_back ();\n30:\n31:     cout << \"\
  After a call to pop_back()\" << endl;\n32:     cout << \"Vector contains \" << integers.size\
  \ () << \" elements: \";\n33:     DisplayVector(integers);\n34:\n35:     return\
  \ 0;\n36: }\n```\n\n* * *\n\n输出 ![Image](img/arrow.jpg)\n\n点击此处查看代码图像\n\nVector\
  \ contains 4 elements: 50 1 987 1001\n\nAfter a call to pop_back()\n\nVector contains\
  \ 3 elements: 50 1 987\n\n分析 ![Image](img/arrow.jpg)\n\n输出表明，第 29 行使用的 `pop_back()`\
  \ 函数通过删除最后插入的元素，减少了 `vector` 中的元素数量。第 32 行再次调用了 `size()` 以证明如输出所示，`vector` 中的元素数量减少了一个。\n\
  \n* * *\n\n注意\n\n与列表 17.3（仅接受整数型 `vector`）相比，第 4–13 行的函数 `DisplayVector()` 在列表 17.6\
  \ 中采用了模板形式。这有助于我们将此模板函数用于 `float` 类型的 `vector`（而不是 `int`）：\n\n点击此处查看代码图像\n\n```cpp\n\
  vector <float> vecFloats;\nDisplayVector(vecFloats); // 可以工作，作为一个通用函数\n```\n\n这种通用形式的\
  \ `DisplayVector()` 还可以支持任何具有可 `cout` 识别的返回值的运算符的类 `vector`。\n\n* * *\n\n### 理解大小和容量的概念\n\
  \n`vector` 的*size*（大小）是存储在 `vector` 中的元素数量。`vector` 的*capacity*（容量）是在 `vector` 重新分配内存以容纳更多元素之前可能存储的元素总数。因此，`vector`\
  \ 的大小小于或等于它的容量。\n\n你可以通过调用 `size()` 来查询 `vector` 的元素数量：\n\n点击此处查看代码图像\n\n```cpp\n\
  cout << \"Size: \" << integers.size ();\n```\n\n或者通过调用 `capacity()` 查询其容量：\n\n点击此处查看代码图像\n\
  \n```cpp\ncout << \"Capacity: \" << integers.capacity () << endl;\n```\n\n当 `vector`\
  \ 需要频繁重新分配内部动态数组的内存时，可能会导致一些性能问题。在很大程度上，这个问题可以通过使用成员函数 `reserve(number)` 来解决。`reserve()`\
  \ 的本质是增加为 `vector` 内部数组分配的内存量，以便容纳 `number` 个元素而无需重新分配。取决于存储在 `vector` 中的对象类型，减少重新分配次数也会减少对象复制的次数并节省性能。列表\
  \ 17.7 中的代码示例演示了 `size` 和 `capacity` 之间的区别。\n\n#### 列表 17.7 `size()` 和 `capacity()`\
  \ 的演示\n\n[点击此处查看代码图像]\n\n\n\n\n\n```cpp\n#include<deque>\n```\n\n`deque` 可以如图 17.2\
  \ 所示。\n\n![Image](img/17fig02.jpg)\n\n**图 17.2** `deque` 的内部结构。\n\n`deque` 与 `vector`\
  \ 相似之处在于，它支持通过 `push_back()` 和 `pop_back()` 函数在末尾进行元素的插入和删除。就像 `vector` 一样，`deque`\
  \ 也允许你通过运算符（`[]`）使用数组语义来访问它。`deque` 与 `vector` 的不同在于，它还允许你使用 `push_front()` 在头部插入元素，并使用\
  \ `pop_front()` 从头部删除，如列表 17.8 所示。\n\n**列表 17.8** 实例化一个 STL `deque` 并使用 `push_front()`\
  \ 和 `pop_front()` 函数在头部插入和删除元素\n\n点击此处查看代码图像\n\n```\n0: #include <deque>\n1: #include\
  \ <iostream>\n2: #include <algorithm>\n3:\n4: int main ()\n5: {\n6:     using namespace\
  \ std;\n7:\n8:     // 定义一个整数 deque\n9:     deque<int> intDeque;\n10:\n11:     //\
  \ 在数组底部插入整数\n12:     intDeque.push_back (3);\n13:     intDeque.push_back (4);\n\
  14:     intDeque.push_back (5);\n15:\n16:     // 在数组顶部插入整数\n17:     intDeque.push_front\
  \ (2);\n18:     intDeque.push_front (1);\n19:     intDeque.push_front (0);\n20:\n\
  21:     cout << \"The contents of the deque after inserting elements \";\n22:  \
  \   cout << \"at the top and bottom are:\" << endl;\n23:\n24:     // 在屏幕上显示内容\n\
  25:     for (size_t count = 0;\n26:         count < intDeque.size ();\n27:     \
  \    ++ count )\n28:     {\n29:         cout << \"Element [\" << count << \"] =\
  \ \";\n30:         cout << intDeque [count] << endl;\n31:     }\n32:\n33:     cout\
  \ << endl;\n34:\n35:     // 删除顶部的元素\n36:     intDeque.pop_front ();\n37:\n38:  \
  \   // 删除底部的元素\n39:     intDeque.pop_back ();\n40:\n41:     cout << \"The contents\
  \ of the deque after erasing an element \";\n42:     cout << \"from the top and\
  \ bottom are:\" << endl;\n43:\n44:     // 再次显示内容：这次使用迭代器\n45:     // 如果使用旧版编译器，请移除\
  \ auto 并取消下行的注释\n46:     // deque <int>::iterator element;\n47:     for (auto element\
  \ = intDeque.begin ();\n48:             element != intDeque.end ();\n49:       \
  \      ++ element )\n50:     {\n51:         size_t Offset = distance (intDeque.begin\
  \ (), element);\n52:         cout << \"Element [\" << Offset << \"] = \" << *element\
  \ << endl;\n53:     }\n54:\n55:     return 0;\n56: }\n```\n\n输出 ![Image](img/arrow.jpg)\n\
  点击此处查看代码图像\n在顶部和底部插入元素后 deque 内容为：\nElement [0] = 0\nElement [1] = 1\nElement [2]\
  \ = 2\nElement [3] = 3\nElement [4] = 4\n从顶部和底部删除元素后 deque 内容为：\nElement [0] = 1\n\
  Element [1] = 2\nElement [2] = 3\nElement [3] = 4\n\n### 分析\n\n第 9 行是实例化整数 `deque`\
  \ 的地方。注意这种语法与实例化整数 `vector` 是多么相似。第 12–14 行显示了 `deque` 成员函数 `push_back()` 的用法，随后在第\
  \ 17–19 行使用了 `push_front()`。后者使得 `deque` 于 `vector` 而言是独特的。正如第 36 行所示，`pop_front()`\
  \ 的用法也是如此。第 25–31 行中显示 `deque` 内容的第一种机制使用了类似数组的语法来访问元素，而第 47–53 行演示了迭代器的用法。第 51\
  \ 行使用了算法 `distance()` 来评估元素在 `deque` 中的偏移量，其方法与你已经在列表 17.5 中在 `vector` 中看到的方法是相同的。\n\
  \n### 提示\n\n当你需要清空一个 STL 容器（如 `vector` 或 `deque`）时，即删除其中包含的所有元素，你会使用成员函数 `clear()`。接下来的代码删除了列表\
  \ 17.7 中整数 `vector` 中的所有元素：\n\n```cpp\nintegers.clear();\n```\n要删除列表 17.8 中 `deque\
  \ intDeque` 中的所有元素，添加代码：\n```cpp\nintDeque.clear();\n```\n注意，`vector` 和 `deque`\
  \ 都具有一个成员函数 `empty()`，它在容器为空时返回 `true`。它并不会删除现有元素——像 `clear()` 那样。点击此处查看代码图像\n```cpp\n\
  intDeque.clear();\nif (intDeque.empty())\n    cout << \"The container is now empty\"\
  \ << endl;\n```\n\n### 应当\n\n- **务必**在不知道需要存储多少个元素时使用动态数组 `vector` 或 `deque`。\n\
  - **务必**记得 `vector` 只能通过函数 `push_back()` 在一端进行增长。\n- **务必**记得 `deque` 可以通过相关函数在两端增长。\n\
  \n### 不要做\n\n- **不要**在不知道需要存储多少个元素时不使用动态数组 `vector` 或 `deque`。（注：此处原文可能为重复或逻辑强调，此处意为强调应使用）\n\
  - **不要**忘记 `vector` 只能通过函数 `push_back()` 在一端进行增长。\n- **不要**忘记 `deque` 可以通过相关函数在两端增长。\n\
  - **不要**忘记 `pop_back()` 会删除最后一个元素。\n- **不要**忘记 `pop_front()` 会删除第一个元素。\n- **不要**越界访问动态数组。\n\
  \n### 总结\n\n在本节中，你学习了 `vector` 和 `deque` 作为动态数组的基础知识。解释了大小和容量的概念，并看到了如何优化 `vector`\
  \ 的用法以减少内存的重新分配以及对象的拷贝。`vector` 是 STL 容器中最简单的，也是最常用的，被认为是效率最高的容器。\n\n### 问答\n\n\
  **Q：`vector` 会改变存储的元素的顺序吗？**\nA：`vector` 是顺序容器，元素按照插入的顺序存储并访问。\n\n**Q：使用什么函数在 `vector`\
  \ 中插入元素？插入在哪里？**\nA：使用 `push_back()` 在末尾插入元素。\n\n**Q：什么函数获取 `vector` 中存储的元素数量？**\n\
  A：`size()` 返回存储的元素数量。顺便说，这对于所有 STL 容器都是如此。\n\n**Q：如果 `vector` 元素更多，在末尾插入或删除元素需要更长时间吗？**\n\
  A：不需要。在 `vector` 末尾插入和删除元素是常数时间操作。\n\n**Q：使用成员函数 `reserve()` 的优势是什么？**\nA：`reserve()`\
  \ 为 `vector` 分配空间，元素的插入不需要 `vector` 重新分配缓冲区并拷贝现有内容。取决于存储的对象的性质，为 `vector` 预留空间可以提高性能。\n\
  \n**Q：插入元素时，`deque` 的属性与 `vector` 有何不同？**\nA：在插入元素方面，`deque` 的属性与 `vector` 相似，在序列尾添加元素是常数时间操作，而在中间插入元素是线性时间操作。然而，`vector`\
  \ 只允许在末端（底部）插入。\n\n### 习题\n\n习题包含测试题，有助于巩固你对所涵盖内容的理解，并提供使用所学知识的练习。在查看附录 E 中的答案之前，尝试回答测试题和练习题，并在进入下一节之前确保理解了答案。\n\
  \n#### 测试题\n\n[](#app05.html_ch17ans01)**1.** 可以在常数时间内在 `vector` 的中间或开头插入元素吗？\n\n\
