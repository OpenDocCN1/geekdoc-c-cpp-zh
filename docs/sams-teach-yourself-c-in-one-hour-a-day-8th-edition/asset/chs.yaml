  \ 编写一个有助于按升序排序的二元谓词。\n\n## 课程 22. Lambda 表达式\n\nLambda 表达式是一种定义和构造无名函数对象的简洁方式。这些表达式是在\
  \ C++11 中引入的。在本节中，你将了解到\n\n![Image](img/square.jpg) 如何编写 lambda 表达式\n\n![Image](img/square.jpg)\
  \ 如何将 lambda 表达式作为谓词\n\n![Image](img/square.jpg) 什么是 C++14 通用 lambda 表达式\n\n![Image](img/square.jpg)\
  \ 如何编写可以持有并操作状态的 lambda 表达式\n\n### 什么是 Lambda 表达式？\n\nLambda 表达式可以可视化为具有公共 `operator()`\
  \ 的匿名 `struct`（或 `class`）的简洁版本。从这个意义上说，lambda 表达式是一个函数对象，类似于第 21 节 中的“理解函数对象”。在深入分析\
  \ lambda 函数的编程之前，先取列表 21.1（来自第 21 节）中的函数对象作为示例：\n\n点击此处查看代码图片\n\n```cpp\n// 行为类似于一元函数的\
  \ struct\ntemplate <typename elementType>\nstruct DisplayElement\n{\n    void operator\
  \ () (const elementType& element) const\n    {\n        cout << element << ' ';\n\
  \    }\n};\n```\n\n该函数对象使用 `cout` 在屏幕上显示对象 `element`，通常用于 `std::for_each()` 等算法：\n\
  \n点击此处查看代码图片\n\n```cpp\n// 显示 vector 中包含的每一个整数\nfor_each (numsInVec.cbegin (), \
  \  // 范围开始\n          numsInVec.cend (),      // 范围结束\n          DisplayElement\
  \ <int> ()); // 一元函数对象\n```\n\nLambda 表达式将包括函数对象定义在内的整个代码压缩为三行：\n\n点击此处查看代码图片\n\n\
  ```cpp\n// 使用 lambda 表达式显示 vector 中包含的每一个整数\nfor_each (numsInVec.cbegin (),   //\
  \ 范围开始\n          numsInVec.cend (),      // 范围结束\n          [](const int& element)\
  \ {cout << element << ' '; } );\n```\n\n当编译器看到这个 lambda 表达式时，在此例中\n\n点击此处查看代码图片\n\
  \n```cpp\n[](const int& element) {cout << element << ' '; }\n```\n\n它会自动将此表达式展开为与\
  \ struct `DisplayElement<int>` 类似的表示：\n\n点击此处查看代码图片\n\n```cpp\nstruct NoName\n{\n\
  \    void operator () (const int& element) const\n    {\n        cout << element\
  \ << ' ';\n    }\n};\n```\n\n***\n\n提示\nLambda 表达式也称为 Lambda 函数（Lambda Functions）。\n\
  \n***\n\n### 如何定义 Lambda 表达式\n\nlambda 表达式的定义必须以方括号 `[]` 开始。这些括号本质上告诉编译器 lambda\
  \ 表达式已经开始。它们后面是参数列表，这与在你不使用 lambda 表达式时为 `operator()` 的实现所提供的参数列表是相同的。\n\n### 用于一元函数的\
  \ Lambda 表达式\n\n一个接受一个参数的一元 `operator(Type)` 的 lambda 版本如下：\n\n点击此处查看代码图片\n\n```cpp\n\
  [](Type paramName) {  // 此处编写 lambda 表达式代码;  }\n```\n\n注意，如果你愿意，可以按引用传递参数：\n\n点击此处查看代码图片\n\
  \n```cpp\n[](Type& paramName) {  // 此处编写 lambda 表达式代码;  }\n```\n\n请使用列表 22.1 研究如何使用算法\
  \ `for_each()` 使用 lambda 函数来显示标准模板库（STL）容器的内容。\n\n**列表 22.1** 通过由 lambda 表达式而非函数对象调用的算法\
  \ `for_each()` 显示容器中的元素\n\n点击此处查看代码图片\n\n```cpp\n0: #include <algorithm>\n1: #include\
