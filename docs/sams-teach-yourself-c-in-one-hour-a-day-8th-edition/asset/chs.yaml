  \n### 提供自定义排序谓词\n\n`map` 和 `multimap` 模板定义包含第三个参数，该参数接受 `map` 正确运行所需的排序谓词。当未提供此第三参数时（如前面的示例所示），它会被\
  \ `std::less <>` 提供的默认排序标准替换，它本质上使用 `operator <` 比较两个对象。\n\n要提供不同于键类型本身支持的排序标准，你通常会以类或结构体的形式编写一个使用\
  \ `operator()` 的二元谓词：\n\n点击此处查看代码图片\n\n```cpp\ntemplate<typename keyType>\nstruct\
  \ Predicate\n{\n    bool operator()(const keyType& key1, const keyType& key2)\n\
  \    {\n        // 在此处编写你的排序优先级逻辑\n    }\n};\n```\n\n持有 `std::string` 类型作为键的 `map`，其默认排序标准基于\
  \ `std::string` 类定义的 `operator <`，通过默认排序谓词 `std::less<T>` 触发，因此它是区分大小敏感的。对于许多应用程序（例如电话簿），具有不区分大小敏感的插入和搜索操作是非常重要的。解决这一需求的方法是为\
  \ `map` 提供一个排序谓词，该谓词根据不区分大小敏感的比较返回 true 或 false：\n\n点击此处查看代码图片\n\n```cpp\nmap <keyType,\
  \ valueType, Predicate> mapObject;\n```\n\n列表 20.5 详细解释了这一点。\n\n**列表 20.5** 提供自定义排序谓词——电话簿\n\
  \n点击此处查看代码图片\n\n***\n\n```cpp\n0: #include<map>\n1: #include<algorithm>\n2: #include<string>\n\
  3: #include<iostream>\n4: using namespace std;\n5:\n6: template <typename T>\n7:\
  \ void DisplayContents (const T& cont)\n8: {\n9:     for (auto element = cont.cbegin();\n\
  10:             element != cont.cend();\n11:             ++ element )\n12:     \
  \    cout << element->first << \" -> \" << element->second << endl;\n13:\n14:  \
  \   cout << endl;\n15: }\n16:\n17: struct PredIgnoreCase\n18: {\n19:     bool operator()(const\
  \ string& str1, const string& str2) const\n20:     {\n21:             string str1NoCase(str1),\
  \ str2NoCase(str2);\n22:             transform(str1.begin(), str1.end(), str1NoCase.begin(),\
  \ ::tolower);\n23:             transform(str2.begin(), str2.end(), str2NoCase.begin(),\
  \ ::tolower);\n24:\n25:             return(str1NoCase < str2NoCase);\n26:     };\n\
  27: };\n28:\n29: typedef map<string, string> DIR_WITH_CASE;\n30: typedef map<string,\
  \ string, PredIgnoreCase> DIR_NOCASE;\n31:\n32: int main()\n33: {\n34:     // 字符串键的区分大小敏感目录起作用\n\
  35:     DIR_WITH_CASE dirWithCase;\n36:\n37:     dirWithCase.insert(make_pair(\"\
  John\", \"234564\"));\n38:     dirWithCase.insert(make_pair(\"JOHN\", \"234564\"\
  ));\n39:     dirWithCase.insert(make_pair(\"Sara\", \"4236726\"));\n40:     dirWithCase.insert(make_pair(\"\
  Jack\", \"3243538\"));\n41:\n42:     cout << \"Displaying contents of the case-sensitive\
  \ map:\"<< endl;\n43:     DisplayContents(dirWithCase);\n44:\n45:     // 字符串键的不区分大小敏感\
  \ map 影响插入与搜索\n46:     DIR_NOCASE dirNoCase(dirWithCase.begin(), dirWithCase.end());\n\
  47:\n48:     cout << \"Displaying contents of the case-insensitive map:\" << endl;\n\
  49:     DisplayContents(dirNoCase);\n50:\n51:     // 在两个 map 中搜索一个名称并显示结果\n52: \
  \    cout << \"Please enter a name to search\" << \";\n53:     string name;\n54:\
  \     cin >> name;\n55:\n56:     auto pairWithCase = dirWithCase.find(name);\n57:\
  \     if(pairWithCase != dirWithCase.end())\n58:         cout << \"Num in case-sens.\
  \ dir: \" << pairWithCase->second << endl;\n59:     else\n60:         cout << \"\
  Num not found in case-sensitive dir\" << endl;\n61:\n62:     auto pairNoCase = dirNoCase.find(name);\n\
  63:     if (pairNoCase != dirNoCase.end())\n64:         cout << \"Num found in CI\
  \ dir: \" << pairNoCase->second << endl;\n65:     else\n66:         cout << \"Num\
  \ not found in the directory\" << endl;\n67:\n68:     return 0;\n69: }\n```\n\n\
  ***\n\n输出 ![Image](img/arrow.jpg)\n\n点击此处查看代码图片\n\nDisplaying contents of the case-sensitive\
  \ map:\nJOHN -> 234564\nJack -> 3243538\nJohn -> 234564\nSara -> 4236726\nDisplaying\
  \ contents of the case-insensitive map:\nJack -> 3243538\nJOHN -> 234564\nSara ->\
  \ 4236726\nPlease enter a name to search\n> jack\nNum not found in case-sensitive\
  \ dir\nNum found in CI dir: 3243538\n\n\n\n\n\n未排序的 `vector` 在搜索时呈现出线性复杂度，这意味着如果它包含\
  \ 10,000 个元素而不是 100 个，它的运行速度将慢 100 倍。\n\n***\n\n因此，虽然对数复杂度看起来已经很不错，但应该记住，`map`（或\
  \ `multimap`、`set` 或 `multiset`）中的插入操作也会变慢，因为这些容器在插入时会排序。因此，对更快速容器的追求持续，数学家和程序员都在寻找具有常数时间插入和搜索能力的容器“圣杯”。`Hash\
  \ Table`（哈希表）就是这样一种容器，给定一个键，无论容器的大小，承诺常数时间的插入和接近常数时间的搜索。\n\n## STL 基于哈希表的键值容器\n\n\
  从 C++11 开始，STL 支持类 `std::unordered_map` 形式的哈希映射。要使用此模板容器类，需要包含：\n\n```cpp\n#include<unordered_map>\n\
  ```\n\n`unordered_map` 保证了容器内任意元素的插入、删除和查找具有平均常数时间复杂度。\n\n### 哈希表的工作原理\n\n虽然详细讨论这个主题不在本书的范围内（因为它已经是一个过多的博士论文的主题了），但让我们尝试理解一下哈希表工作的基本原理。\n\
  \n哈希表可以看作是一个键值对的集合，给定一个键，表可以找到对应的值。哈希表与简单 `map` 的区别在于，哈希表将键值对存储在桶（buckets）中，每个桶都有一个定义其在表中相对位置的索引（类似于数组）。该索引由一个使用键作为输入的\
  \ `hash-function`（哈希函数）决定：\n\n点击此处查看代码图片\n\n`Index = HashFunction(key, TableSize);`\n\
  \n在给定键执行 `find()` 时，会再次使用 `HashFunction()` 来确定元素的位置，表返回该位置的值，就像数组返回存储在其中的元素一样。在\
  \ `HashFunction()` 程序编写得优的情况下，多个元素可能会具有相同的 `Index`，并落在同一个桶中——该桶内部将是一个元素列表。在这种情况下，称为\
  \ *collisions*（冲突），搜索速度会变慢，且不再是常数时间。\n\n 使用 使用 `unordered_map` 和 `unordered_multimap`\n\
  \n从 C++11 开始引入的这两个实现哈希表的容器分别与 `std::map` 和 `std::multimap` 并不相似。实例化、插入和 `find` 遵循相似的模式：\n\
  \n点击此处查看代码图片\n\n```cpp\n// 实例化一个从 int 到 string 的 unordered_map:\nunordered_map<int,\
  \ string> umapIntToStr;\n\n// insert()\numapIntToStr.insert(make_pair(1000, \"Thousand\"\
  ));\n\n// find():\nauto pairFound = umapIntToStr.find(1000);\ncout << pairFound->first\
  \ << \" - \" << pairFound->second << endl;\n\n// 使用数组语义查找值:\ncout << \"umapIntToStr[1000]\
  \ = \" << umapIntToStr[1000] << endl;\n```\n\n然而，`unordered_map` 的一个重要特性是可以可以使用哈希函数，该函数负责决定排序：\n\
  \n点击此处查看代码图片\n\n```cpp\nunordered_map<int, string>::hasher hFn =\n    umapIntToStr.hash_function();\n\
  ```\n\n你可以通过调用键的哈希函数来查看分配给键的优先级：\n\n点击此处查看代码图片\n\n```cpp\nsize_t hashingVal = hFn(1000);\n\
  ```\n\n由于 `unordered_map` 将键值对存储在桶中，当 map 中的元素数量达到或接近桶的数量时，它会进行自动负载均衡：\n\n点击此处查看代码图片\n\
  \n```cpp\ncout << \"Load factor: \" << umapIntToStr.load_factor() << endl;\ncout\
  \ << \"Max load factor = \" << umapIntToStr.max_load_factor() << endl;\ncout <<\
  \ \"Max bucket count = \" << umapIntToStr.max_bucket_count() << endl;\n```\n\n`load_factor()`\
  \ 是 `unordered_map` 中桶填充程度的指标。当由于插入导致 `load_factor()` 超过 `max_load_factor()` 时，`map`\
  \ 会重新组织以增加可用桶的数量并重建哈希表，如列表 20.6 所示。\n\n***\n\n### 提示\n\n`std::unordered_multimap`\
  \ 与 `unordered_map` 类似，但支持具有相同键的多个对。\n\n***\n\n**列表 20.6** 实例化 STL 哈希表实现 `unordered_map`，使用\
  \ `insert()`、`find()`、`size()`、`max_bucket_count()`、`load_factor()` 和 `max_load_factor()`\n\
  \n点击此处查看代码图片\n\n***\n\n```cpp\n0: #include<iostream>\n1: #include<string>\n2: #include<unordered_map>\n\
  3: using namespace std;\n4: \n5: template <typename T1, typename T2>\n6: void DisplayUnorderedMap(unordered_map<T1,\
  \ T2>& cont)\n7: {\n8:     cout << \"Unordered Map contains: \" << endl;\n9:   \
  \  for (auto element = cont.cbegin();\n10:          element != cont.cend();\n11:\
  \          ++ element )\n12:         cout << element->first << \" -> \" << element->second\
  \ << endl;\n13:\n14:     cout << \"Number of pairs: \" << cont.size() << endl;\n\
  15:     cout << \"Bucket count = \" << cont.bucket_count() << endl;\n16:     cout\
  \ << \"Current load factor: \" << cont.load_factor() << endl;\n17:     cout << \"\
  Max load factor = \" << cont.max_load_factor() << endl;\n18: }\n19: \n20: int main()\n\
  21: {\n22:     unordered_map<int, string> umapIntToStr;\n23:     umapIntToStr.insert(make_pair(1000,\
  \ \"Thousand\"));\n24:     umapIntToStr.insert(make_pair(500, \"Five Hundred\"));\n\
  25:     umapIntToStr.insert(make_pair(300, \"Three Hundred\"));\n26:     umapIntToStr.insert(make_pair(200,\
  \ \"Two Hundred\"));\n27:     umapIntToStr.insert(make_pair(100, \"One Hundred\"\
  ));\n28:     umapIntToStr.insert(make_pair(50, \"Fifty\"));\n29:     umapIntToStr.insert(make_pair(25,\
  \ \"Twenty Five\"));\n30:     umapIntToStr.insert(make_pair(10, \"Ten\"));\n31:\
  \     umapIntToStr.insert(make_pair(5, \"Five\"));\n32:     umapIntToStr.insert(make_pair(1,\
  \ \"One\"));\n33:     DisplayUnorderedMap(umapIntToStr);\n34:\n35:     cout << \"\
  Enter key to find: \";\n36:     int Key;\n37:     cin >> Key;\n38:     auto pairFound\
  \ = umapIntToStr.find(Key);\n39:     if (pairFound != umapIntToStr.end())\n40: \
  \        cout << \"Found! pairs with value \" << pairFound->second << endl;\n41:\
  \     else\n42:         cout << \"Key has no corresponding value!\" << endl;\n43:\n\
  44:     return 0;\n45: }\n```\n\n\n\n\n### 注意事项\n\n不要依赖 `unordered_map` 中元素的顺序（这正是其名称的由来），无论键如何。map\
  \ 中某个元素相对于其他元素的顺序取决于许多因素，包括它的键、插入顺序以及桶（buckets）的数量等。\n\n这些容器针对搜索性能进行了优化，因此在遍历它们时，你不应该依赖于元素的排列顺序。\n\
  \n# 备注\n\n`std::unordered_map` 提供的插入和查找（在没有冲突的情况下）几乎是常数时间复杂度的，与所包含的元素数量无关。然而，这并不意味着\
  \ `std::unordered_map` 优于在所有情况下都提供对数复杂度的 `std::map`。该常数可能大得多，导致前者在包含元素数量较少的情况下运行速度反而较慢。\n\
  \n在进行模拟真实场景用法的某些基准测试后，根据测试结果来决定容器类型是非常重要的。\n\n# 做到（DO）\n\n-   在需要键是唯一的键值对的情况下，**务必**使用\
  \ `map`。\n-   在需要键可以重复的键值对（例如电话簿）的情况下，**务必**使用 `multimap`。\n-   **务必**记住 `map` 和\
  \ `multimap` 与其他 STL 容器一样，都具有成员方法 `size()`，它可以告诉你包含多少个对。\n-   当常数时间的插入和查找至关重要时（通常当元素数量非常多时），**务必**使用\
  \ `unordered_map` 或 `unordered_multimap`。\n\n# 不要（DON'T）\n\n-   **不要**忘记 `multimap::count(key)`\
  \ 可以告诉你容器中使用 `key` 索引的键对数量。\n-   **不要**忘记通过将 `find()` 操作的结果与容器的 `end()` 进行比较来检查结果。\n\
  \n### 总结\n\n在本节中，你学习了如何使用 STL 的 `map` 和 `multimap`、它们重要的成员函数以及它们的特性。你还学习了这些容器具有对数复杂度，并且\
  \ STL 以 `unordered_map` 和 `unordered_multimap` 的形式提供了哈希表容器。这些容器在 `insert()` 和 `find()`\
  \ 操作中的性能独立于于容器的大小。你还学习了使用谓词（predicate）来自定义排序标准的重要性，这在 Listing 20.5 的目录应用程序中得到了演示。\n\
  \n### 问答\n\n**Q: 如何声明一个按数值降序排序或按降序存储的整数 map？**\n\n**A** `map <int>` 定义了一个整数 `map`。它采用默认的排序谓词\
  \ `std::less <T>` 按升序大小排序项，也可以表示为 `map <int, less <int>>`。若要按降序排序，请将 `map` 定义为 `map\
  \ <int, greater <int>>`。\n\n**Q: 如果在字符串 map 中插入两次字符串 \"Jack\"，会发生什么？**\n\n**A**\
  \ `map` 的设计不用于插入非唯一值。因此，该 map 仍只会包含键名为 \"Jack\" 的对。\n\n**Q: 在前面的示例中，如果我想有两个 \"Jack\"\
  \ 实例，我应该修改什么？**\n\n**A** 从设计上来说，`map` 只持有唯一值。你需要将容器的选择改为 `multimap`。\n\n**Q: 哪个\
  \ multimap 成员函数返回容器中特定值的项计数？**\n\n**A** `count(value)` 是感兴趣的函数。\n\n**Q: 我使用 find()\
  \ 函数在 map 中找到了一个元素并获得了一个指向它的迭代器。我会使用这个迭代器来更改所指向的值吗？**\n\n**A** 不。某些 STL 实现可能允许用户通过\
  \ `find()` 返回的迭代器更改 `map` 内部元素的值。然而，这不是正确的做法。指向 `map` 中元素的迭代器应该作为 `const` 迭代器使用——即使你的\
  \ STL 实现没有强制要求这样做。\n\n**Q: 我正在使用一个不支持 auto 关键字的旧版编译器。我应该如何声明一个持有 map::find() 返回值的变量？**\n\
  \n**A** 迭代器始终使用以下语法定义：\n\n```cpp\ncontainer<Type>::iterator variableName;\n```\n\
  \n因此，整数 map 的迭代器声明如下：\n\n```cpp\nstd::map<int>::iterator pairFound = mapIntegers.find(1000);\n\
  \nif (pairFound != mapIntegers.end())\n{ // 执行某些操作 }\n```\n\n### 工作坊\n\n工作坊包含测验题，帮助你巩固对所涵盖内容的理解，以及练习题，为你提供使用所学知识的机会。在检查\
  \ 附录 E 中的答案之前，尝试回答测验和练习题，并在进入下一节之前确保你理解了答案。\n\n#### 测验\n\n1. 你声明了一个类型为 `map<int>`\
  \ 的整数 map。哪个函数提供了排序标准？\n2. 你会在 `multimap` 的哪里找到重复元素？\n3. 哪个 `map` 或 `multimap` 函数提供了容器中的元素数量？\n\
  4. 你会在 `map` 的哪里找到重复元素？\n\n#### 练习题\n\n1. 你需要编写一个电话电话的应用程序，其中人的名字不需要唯一。你会选择哪种容器？编写该容器的定义。\n\
  2. 以下是你的字典应用程序中的 `map` 模板定义：\n\n```cpp\nmap <wordProperty, string, fPredicate> mapWordDefinition;\n\
  ```\n\n其中 `wordProperty` 是一个结构：\n\n```cpp\nstruct WordProperty\n{\n    string word;\n\
  \    bool isBase;\n};\n```\n\n定义二进制谓词 `fPredicate`，帮助 map 根据其包含的字符串对 `WordProperty`\
  \ 键进行排序。\n3. 通过简单的程序演示 `map` 不能接受重复条目，而 `multimap` 可以。\n\n\n\n\n\n返回 `boolean` 类型的函数对象自然适用于用于辅助决策的算法。`find()`\
  \ 和 `sort()` 是你在之前的课程中学习过的两种此类算法。结合两个函数对象的函数对象被称为 `adaptive function object`（适应函数对象）。\n\
  \n## 函数对象的典型应用\n\n可以用数页的理论解释来解释函数对象。也可以通过微小的示例程序来理解它们的外观和工作原理。让我们采取实践的方法，直接进入 C++\
  \ 编程中函数对象或仿函数（functors）的世界！\n\n### 一元函数\n\n对单个参数的操作的操作称为一元函数。一元函数可以执行非常简单的操作——例如，在屏幕上显示一个元素。这可以编写如下：\n\
  \n点击此处查看代码图像\n\n```cpp\n// A unary function\ntemplate <typename elementType>\nvoid\
  \ FuncDisplayElement (const elementType& element)\n{\n    cout << element << ' ';\n\
  };\n```\n\n函数 `FuncDisplayElement` 接受一个模板化类型 `elementType` 的参数，并使用控制台输出语句 `std::cout`\
  \ 将其显示。该函数也可以有另一种表示形式，即函数的实现实际上包含 `class` 或 `struct` 的 `operator()` 中：\n\n点击此处查看代码图像\n\
  \n```cpp\n// Struct that can behave as a unary function\ntemplate <typename elementType>\n\
  struct DisplayElement\n{\n    void operator () (const elementType& element) const\n\
  \    {\n        cout << element << ' ';\n    }\n};\n```\n\n**提示**\n\n注意 `DisplayElement`\
  \ 是一个 `struct`。如果它是一个 `class`，则需要给 `operator()` 加上 `public` 访问修饰符。`struct` 类似于 `class`，其成员默认是\
  \ `public` 的。\n\n这两种实现中的任何一种都可以用于 STL 算法 `for_each()`，将集合的内容打印到屏幕上，一次一个元素，如 列表 21.1\
  \ 所示。\n\n**列表 21.1** 使用一元函数在屏幕上显示集合的内容\n\n点击此处查看代码图像\n\n```cpp\n0: #include <algorithm>\n\
  1: #include <iostream>\n2: #include <vector>\n3: #include <list>\n4: using namespace\
  \ std;\n5:\n6: // struct that behaves as a unary function\n7: template <typename\
  \ elementType>\n8: struct DisplayElement\n9: {\n10:     void operator () (const\
  \ elementType& element) const\n11:     {\n12:         cout << element << ' ';\n\
  13:     }\n14: };\n15:\n16: int main ()\n17: {\n18:     vector <int> numsInVec{\
  \ 0, 1, 2, 3, -1, -9, 0, -999 };\n19:      cout << \"Vector of integers contains:\
  \ \" << endl;\n20:\n21:     for_each (numsInVec.begin (),     // Start of range\n\
  22:                 numsInVec.end(),         // End of range\n23:              \
  \     DisplayElement<int> () ); // Unary function object\n24:\n25:     // Display\
  \ the list of characters\n26:     list <char> charsInList{ 'a', 'z', 'k', 'd' };\n\
  27:     cout << endl << \"List of characters contains: \" << endl;\n28:\n29:   \
  \  for_each (charsInList.begin(),\n30:                   charsInList.end(),\n31:\
  \                   DisplayElement<char> () );\n32:\n33:     return 0;\n34: }\n\
  ```\n\n输出 ![Image](img/arrow.jpg)\n点击此处查看代码图像\nVector of integers contains: 0 1\
  \ 2 3 -1 -9 0 -999\nList of characters contains: a k d\n\n分析 ![Image](img/arrow.jpg)\n\
  第 8–14 行包含函数对象 `DisplayElement`，它实现了 `operator()`。在第 21–23 行中通过 STL 算法 `std::for_each()`\
  \ 可以了该函数对象用法。`for_each()` 接受三个参数：第一个是范围的起始点，第二个是范围的结束点，第三个参数是为范围内每个元素调用的函数。换句话说，该代码为\
  \ `numsInVec` 中的每个元素调用了 `DisplayElement::operator()`。\n\n**注意**\n\n在 列表 21.1 中，你可以选择使用\
  \ `FuncDisplayElement` 代替 `struct DisplayElement` 以达到相同效果：\n\n点击此处查看代码图像\n```cpp\n\
  for_each (charsInList.begin(),\n          charsInList.end(),\n          FuncDisplayElement<char>);\n\
  ```\n\n**提示**\n\nC++11 引入了 lambda 表达式，它是无名的函数对象。来自 列表 21.1 的 `DisplayElement<T>`\
  \ 的 lambda 表达式版本压缩了整个代码，包括定义：\n\n点击此处查看代码图像\n```cpp\n// Display elements \nfor_each\
  \ (numsInVec.begin(), // Start of range\n          numsInVec.end(),         // End\
  \ of range\n          [](int& element) {cout << element << ' }); // Lambda expression\n\
  ```\n因此，lambda 表达式是 C++ 的一项伟大改进，你不应该错过 第 22 节 中的“Lambda 表达式”。列表 22.1 展示了使用 lambda\
  \ 在 `for_each()` 中显示容器的内容。\n\n使用 `struct` 实现函数对象的真正优势在于你可以使用 `struct` 存储信息。`DisplayElement`\
  \ 无法做到这一点，但 `struct` 可以拥有 `operator()` 之外属性。稍微修改的版本如下：\n\n点击此处查看代码图像\n```cpp\ntemplate\
  \ <typename elementType>\nstruct DisplayElementCount\n{\n    int count;\n    DisplayElementCount()\
  \ // constructor\n    {\n        count = 0;\n    }\n    void operator (const elementType&\
  \ element)\n    {\n        ++ count;\n        cout << element<< ' ';\n    }\n};\n\
  ```\n\n在上述代码段中，`DisplayElementCount` 是前一个版本的稍微修改。`operator()` 不再是 `const` 成员函数，因为它会增加（因此改变）成员变量\
  \ `count` 以记录调用的次数。该计数可以通过公共成员属性 `count` 获取。这种可以存储 `state` 的函数对象的优势在 列表 21.2 中所示。\n\
  \n\n\n\n\n此示例与 Listing 21.1 中的示例最大的区别在于将 `DisplayElementKeepCount()` 作为 `for_each()`\
  \ 的返回值。`struct DisplayElementKeepCount` 中实现的 `operator()` 会被算法 `for_each()` 为容器中的每个元素调用。它显示该元素并递增存储在成员属性\
  \ `count` 中的内部计数器。在 `for_each()` 完成后，你使用第 29 行中的对象来显示元素被显示的次数。请注意，在这种场景下，如果使用普通函数而不是在\
  \ `struct` 中实现的函数，将无法以这种直接的方式提供此项功能。\n\n### 一元谓词\n\n返回 `bool` 的一元函数称为谓词（predicate）。此类函数有助于为\
  \ STL 算法做出决策。Listing 21.3 是一个示例谓词，用于判断输入元素是否为初始值的倍数。\n\n**列表 21.3** 用于判断一个数字是否为另一个数字倍数的一元谓词\n\
  \n点击此处查看代码图像\n\n```cpp\n0: // 作为一元谓词的结构\n  1: template <typename numberType>\n \
  \ 2: struct IsMultiple\n  3: {\n  4:     numberType Divisor;\n  5:\n  6:     IsMultiple\
  \ (const numberType& divisor)\n  7:     {\n  8:         Divisor = divisor;\n  9:\
  \     }\n 10:\n  11:     bool operator () (const numberType& element) const\n  12:\
  \     {\n  13:         // 检查元素是否为除数的倍数\n  14:         return ((element % Divisor)\
  \ == 0);\n  15:     }\n  16: };\n```\n\n分析 ![Image](img/arrow.jpg)\n\n在这里，`operator()`\
  \ 返回 `bool` 并作为一元谓词工作。该结构有一个构造函数，并在第 8 行初始化为除数的值。存储在对象中的该值随后用于判断用于比较的元素是否能被其整除，正如\
  \ `operator()` 的实现所示，在第 14 行使用了数学运算 `%` 返回除法操作的余数。谓词将该余数与零比较，以确定该数字是否为倍数。\n\n在 Listing\
  \ 21.4 中，我们使用了之前在 Listing 21.3 中所示的谓词，来判断集合中的数字是否为用户输入的除数的倍数。\n\n**列表 21.4** 使用\
  \ `std::find_if()` 通过一元谓词 `IsMultiple` 在 `vector` 中查找用户提供的除数的倍数元素\n\n点击此处查看代码图像\n\
  \n```cpp\n  0: #include <algorithm>\n  1: #include <vector>\n  2: #include <iostream>\n\
  \  3: using namespace std;\n  4: // 在此处插入来自 Listing 21.3 的代码\n  5:\n  6: int main\
  \ ()\n  7: {\n  8:     vector <int> numsInVec{ 25, 26, 27, 28, 29, 30, 31 };\n \
  \ 9:     cout << \"The vector contains: 25, 26, 27, 28, 29, 30, 31\" << endl;\n\
  \ 10:\n  11:     cout << \"Enter divisor (> 0): \";\n  12:     int divisor = 2;\n\
  \  13:     cin >> divisor;\n  14:\n  15:     // 找到第一个是除数倍数的元素\n  16:     auto element\
  \ = find_if (numsInVec.begin (),\n  17:                                     numsInVec.end\
  \ (),\n  18:                                     IsMultiple<int>(divisor) );\n 19:\
  \     if (element != numsInVec.end ())\n 20:     {\n  21:         cout << \"First\
  \ element in vector by \" << divisor;\n  22:         cout << \": \" << *element\
  \ << endl;\n  23:     }\n  24:\n  25:     return 0;\n  26: }\n```\n\n输出 ![Image](img/arrow.jpg)\n\
  点击此处查看代码图像\nThe vector contains: 25, 26, 27, 28, 29, 30, 31\nEnter divisor (> 0):\
  \ 4\nFirst element in vector by 4: 28\n\n分析 ![Image](img/arrow.jpg)\n\n该示例从一个整数向量作为示例容器开始。一元谓词的使用在第\
  \ 16 行所示的 `find_if()` 中。在这里，函数对象 `IsMultiple()` 初始化为用户提供的除数并存储在 `Divisor` 中。`find_if()`\
  \ 的工作原理是为指定范围内的每个元素调用一元谓词 `IsMultiple::operator()`。当 `operator()` 返回 `true` 时（当元素除以\
  \ 4 且没有余数时发生这种情况），`find_if()` 返回指向该元素的迭代器 `element`。`find_if()` 操作的结果与容器的 `end()`\
  \ 进行比较，以验证是否找到了元素（如第 20 行所示），随后使用迭代器 `element` 显示该值（如第 23 行所示）。\n\n提示：要查看使用 lambda\
  \ 表达式如何紧凑 Listing 21.4 所示的程序，请查看第 22 节中的 Listing 22.3。\n\n一元谓词在许多 STL 算法中有应用，例如\
  \ `std::partition()` 可以使用谓词划分范围；`stable_partition()` 在执行相同操作的同时保持元素的相对顺序；`std::find_if()`\
  \ 等函数；以及帮助删除元素的函数 `std::remove_if()`，它可以删除范围范围内满足谓词的元素。\n\n### 二元函数\n\n类型为 `f(x,\
  \ y)` 的函数在根据输入返回结果时特别有用。此类二元函数可以用于涉及两个操作数的算术活动，例如加法、乘法等。一个返回参数倍数的二元函数可以如下所示编写：\n\
  \n点击此处查看代码图像\n\n```cpp\ntemplate <typename elementType>\nclass Multiply\n{\npublic:\n\
  \    elementType () (const elementType& elem1,\n                             const\
  \ elementType& elem2)\n    {\n        return elem1 * elem2;\n    }\n};\n```\n\n\
  感兴趣的实现再次是接受两个参数并返回它们倍数的 `operator()`。二元函数用于 `std::transform()` 等算法，其中它可以乘以两个容器的内容。Listing\
  \ 21.5 展示了此类函数在 `std::transform()` 中的用法。\n\n**列表 21.5** 使用二元函数乘以两个范围\n\n点击此处查看代码图像\n\
  \n```cpp\n  0: #include <vector>\n  1: #include <iostream>\n  2: #include <algorithm>\n\
  \  3:\n  4: template <typename elementType>\n  5: class Multiply\n  6: {\n  7: public:\n\
  \  8:     elementType () (const elementType& elem1,\n  9:                      \
  \       const elementType& elem2)\n 10:     {\n  11:         return (elem1 * elem2);\n\
  \ 12:     }\n 13: };\n  14:\n  15: int main ()\n  16: {\n  17:     using namespace\
  \ std;\n  18:\n  19:     vector <int> multiplicands{ 0, 1, 2, 3 };\n  20:     vector\
  \ <int> multipliers{ 100, 101, 102, 103 };\n  21:\n  22:     // 存储结果的容器\n  23: \
  \    vector <int> vecResult;\n  24:\n  25:     // 为乘法结果留空间\n  26:     vecResult.resize(multipliers.size());\n\
  \  27:     transform (multiplicands.begin (), // multiplicands 范围\n  28:       \
  \          multiplicands.end(), // 范围结束\n  29:                 multipliers.begin(),\
  \ // 乘数值\n  30:                 vecResult.begin(), // 存储结果\n  31:              \
  \   Multiply <int> );    // 乘法\n  32:\n  33:     cout << \"The contents of the first\
  \ vector are: \" << endl;\n  34:     for (size_t index = 0; index < multiplicands.size\
  \ (); ++ index)\n  35:         cout << multiplicands [index] << ' ';\n  36:    \
  \ cout << endl;\n  37:\n  38:     cout << \"The contents of the second vector are:\
  \ \" << endl;\n  39:     for (size_t index = 0; index < multipliers.size (); ++index)\n\
  \  40:         cout << multipliers [index] << ' ';\n  41:     cout << endl;\n  42:\n\
  \  43:     cout << \"The result of the multiplication is: \" << endl;\n  44:   \
  \  for (size_t index = 0; index < vecResult.size (); ++ index)\n  45:         cout\
  \ << vecResult [index] << ' ';\n  46: }\n```\n\n\n\n\n\n```cpp\n45:      cout <<\
  \ vecResult [index] << ' ';\n47:      return 0;\n48: }\n```\n\n输出 ![Image](img/arrow.jpg)\n\
  \n点击此处查看代码图像\n\n第一个向量的内容是：\n\n0 1 2 3 4\n\n第二个向量的内容是：\n\n100 101 102 103 104\n\n\
  乘法的结果是：\n\n0 101 204 309 416\n\n### 分析 ![Image](img/arrow.jpg)\n\n第 4–13 行包含了类 `Multiply`，如前面的代码段所示。在这一示例中，你使用算法\
  \ `std::transform()` 将两个范围的内容相乘并存储在第三个范围中。在这种情况下，相关的范围存储在 `std::vector` 中，分别为 `multiplicands`、`multipliers`\
  \ 和 `vecResult`。你在第 27–31 行中使用 `std::transform()` 将 `multiplicands` 中的每个元素与其对应的\
  \ `multipliers` 中的元素相乘，并将结果的结果存储在 `vecResult` 中。乘法本身是由二元函数 `Multiply::operator()`\
  \ 完成的，该函数会被构成源范围和目标范围的向量中的每个元素调用。`operator()` 的返回值存储在 `vecResult` 中。\n\n此示例演示了二元函数如何应用于\
  \ STL 容器元素之间的算术运算。下一个示例也使用了 `std::transform()`，但用于使用函数 `tolower()` 将字符串转换为小写。\n\n\
  ### 二元谓词\n\n接受两个参数并返回 `bool` 的函数是二元谓词。此类函数应用于 STL 函数中，例如 `std::sort()`。列表 21.6 展示了二元谓词的使用，该谓词在将两个字符串转换为小写后对其进行比较。例如，这种谓词可以用于对\
  \ `string` `vector` 执行不区分大小写的排序。\n\n**列表 21.6** 用于不区分大小写字符串排序的二元谓词\n\n点击此处查看代码图像\n\
  \n```cpp\n0: #include <algorithm>\n1: #include <string>\n2: using namespace std;\n\
  3:\n4: class CompareStringNoCase\n5: {\n6: public:\n7:     bool operator () (const\
  \ string& str1, const string& str2) const\n8:     {\n9:         string str1LowerCase;\n\
  10:\n11:         // 分配空间\n12:         str1LowerCase.resize (str1.size ());\n13:\n\
  14:         // 将每个字符转换为小写\n15:         transform (str1.begin (), str1.end (), str1LowerCase.begin\
  \ (),\n16:                             ::tolower);\n17:\n18:         string str2LowerCase;\n\
  19:         str2LowerCase.resize (str2.size ());\n20:         transform (str2.begin\
  \ (), str2.end (), str2LowerCase.begin (),\n21:                             ::tolower);\n\
  22:\n23:         return (str1LowerCase < str2LowerCase);\n24:     }\n25: };\n```\n\
  \n### 分析 ![Image](img/arrow.jpg)\n\n在 `operator()` 中实现的二元谓词首先通过第 15 行和第 20 行所示的算法\
  \ `std::transform()` 将输入字符串转换为小写，然后使用字符串比较运算符 `operator <` 返回比较结果。\n\n你可以将此二元谓词配合算法\
  \ `std::sort()` 对包含 `string` `vector` 的动态数组进行排序，如列表 21.7 所示。\n\n**列表 21.7** 使用函数对象\
  \ `class CompareStringNoCase` 对 `vector<string>` 执行不区分大小写的排序 点击此处查看代码图像\n\n```cpp\n\
  0: // 在列表 21.6 插入 classStringNoCase\n1: #include <vector>\n2: #include <iostream>\n\
  3:\n4: template <typename T>\n5: void DisplayContents (const T& container)\n6: {\n\
  7:     for (auto element = container.cbegin();\n8:          element != container.cend();\n\
  9:          ++ element )\n10:     cout << *element << endl;\n11: }\n12:\n13: int\
  \ main ()\n14: {\n15:     // 定义一个存储名称的 vector\n16:     vector <string> names;\n\
  17:\n18:     // 在 vector 中插入示例\n19:     names.push_back (\"jim\");\n20:     names.push_back\
  \ (\"Jack\");\n21:     names.push_back (\"Sam\");\n22:     names.push_back (\"Anna\"\
  );\n23:\n24:     cout << \"按插入顺序的 vector: \" << endl;\n25:     DisplayContents(names);\n\
  26:\n27:     cout << \"使用默认排序排序后的名称: \" << endl;\n28:     sort(names.begin(), names.end());\n\
  29:     DisplayContents(names);\n30:\n31:     cout << \"使用不区分大小写的谓词排序: \" << endl;\n\
  32:     sort(names.begin(), names.end(), CompareStringNoCase());\n33:     DisplayContents(names);\n\
  34:\n35:     return 0;\n36: }\n```\n\n输出 ![Image](img/arrow.jpg)\n\n点击此处查看代码图像\n\
  \n按插入顺序的 vector：\n\njim\nJack\nSam\nAnna\n\n使用默认排序后的名称：\n\nAnna\nJack\nSam\njim\n\
  \n使用不区分大小写的谓词排序：\n\nAnna\nJack\nSam\n\n### 分析 ![Image](img/arrow.jpg)\n\n输出分三个阶段显示\
  \ vector 的内容。第一个按插入顺序显示。第二个第 28 行的 `sort()` 使用默认排序谓词 `less<T>` 排序，由于 `string::operator<`\
  \ 是区分大小写的，`jim` 没有在 `Jack` 之后。最后一个版本使用第 32 行的排序谓词 `class CompareStringCase`（实现在列表\
  \ 21.6），无论大小写如何确保 `jim` 在 `Jack` 之后。\n\n多种 STL 算法都需要二元谓词。例如，删除相邻重复元素的 `std::unique()`、进行排序的\
  \ `std::sort()`、保持相对顺序排序的 `std::stable_sort()` 以及对两个范围执行操作的 `std::transform()`。\n\
  \n### 总结\n\n在本节中，你了解了算子（或函数对象）的世界。你学习了为什么函数对象在结构体或类中实现比简单函数更有，因为前者还可以用于持有状态相关的信息。你了解了谓词，它是函数对象的一种特殊类，并看到了一些展示其用途的示例。\n\
  \n### 问答\n\n**Q 谓词是函数对象的一种特殊类型。它的特殊之处在于？**\n**A 谓词始终返回 `boolean`。**\n\n**Q 调用 `remove_if()`\
  \ 等函数时应该使用什么样的函数对象？**\n**A 你应该使用一个单元谓词，通过构造函数获取要处理的值作为初始状态。**\n\n**Q `map` 应该使用什么样的函数对象？**\n\
  **A 你应该使用二元谓词。**\n\n**Q 无返回值的简单函数可以作为谓词吗？**\n**A 可以。没有返回值的函数仍然可以做有用的事。例如，它可以显示输入数据。**\n\
