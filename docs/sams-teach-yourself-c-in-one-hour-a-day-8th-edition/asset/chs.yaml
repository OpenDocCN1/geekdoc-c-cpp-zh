  输出所示，由于多重继承以及 `Platypus` 的三个基类都分别继承自 `Animal`，对于每个 `Platypus` 实例，都会自动创建三个 `Animal`\
  \ 实例，如第 38 行所示。这是很荒的，因为 `Platypus` 仍然是一个继承了 `Mammal`、`Bird` 和 `Reptile` 特定属性的动物。`Animal`\
  \ 实例数量的问题不仅限于内存消耗。`Animal` 有一个整数成员 `Animal::age`（为了解释保持为 public）。当你想要通过 `Platypus`\
  \ 实例访问 `Animal::age` 时（如第 42 行所示），你会得到编译错误，编译器根本不知道你是想设置 `Mammal::age` 还是 `Bird::age`\
  \ 还是 `Reptile::age`。情况甚至变得更荒——如果你愿意，你可以设置所有三个：\n\n```cpp\nduckP.Mammal::age = 25;\n\
  duckBilledP.Bird::age = 25;\nduckBilledP.Reptile::age = 25;\n```\n显然，单嘴鸭嘴兽应该只有一个\
  \ `age`。然而，你希望 `Platypus` 类只有一个 `age`。然而，对于你期望派生类来实现并满足的函数，解决方案是使用虚继承：\n\n```cpp\n\
  duckP.Mammal::age = 25;\nduckBilledP.Bird::age = 25;\nduckBilledP.Reptile::age =\
  \ 25;\n```\n显然，单嘴鸭嘴兽应该只有一个 `age`。然而，你希望 `Platypus` 类只有一个 `age`。然而，对于你期望派生类来实现并满足的函数，解决方案是使用虚继承：\n\
  \n```cpp\nclass Derived1 : virtual Base\n{\n// ... members and functions\n};\nclass\
  \ Derived2 : virtual Base\n{\n// ... members and functions\n};\n```\n这种 `virtual`\
  \ 是在列表 11.8 中。\n\n**列表 11.8** `virtual` 关键字如何帮助将基类 `Animal` 的实例数量限制\n\n点击此处查看代码图像\n\
  \n```cpp\n0: #include <iostream>\n1: using namespace std;\n3: class Animal\n{\n\
  5: public:\n6:     Animal()\n7:     {\n8:         cout << \"Animal constructor\"\
  \ << endl;\n9:     }\n11:     // sample member\n12:     int age;\n13: };\n15: class\
  \ Mammal:virtual Animal\n{\n17: };\n19: class Bird:virtual Animal\n{\n21: };\n23:\
  \ class Reptile:virtual Animal\n{\n25: };\n27: class Platypus:public Mammal, public\
  \ Bird, public Reptile\n{\n29: public:\n30:     Platypus()\n31:     {\n32:     \
  \    cout << \"Platypus constructor\" << endl;\n33:     }\n34: };\n36: int main()\n\
  {\n38:     Platypus duckBilledP;\n40:     // 因为现在只有一个 Animal 实例，所以 age 不再存在义\n41:\
  \     duckBilledP.age = 25;\n43:     return 0;\n44: }\n```\n\nOutput: ![Image](img/arrow.jpg)\n\
  Animal constructor\nPlatypus constructor\n\n### 分析\n```\n```\n\n\n\n\n声明为 `virtual`\
  \ 的函数意味着派生类中已有的覆盖函数将被调用。\n\n在类 `Derived1` 和 `Derived2` 之间使用关键字 `virtual` 声明继承关系（其中它们都继承自类\
  \ `Base`），意味着如果另一个继承自 `Derived1` 和 `Derived2` 的类 `Derived3` 在实例化 `Derived3` 类型时，仍然只会创建一个\
  \ `Base` 类的实例。\n\n因此，同一个关键字 `virtual` 被用于实现两个截然不同的概念。\n\n### 使用 `Override` 修饰符指示覆盖意图\n\
  \n我们之前版本的基类 `Fish` 包含一个名为 `Swim()` 的虚函数，代码所示：\n\n点击此处查看代码图像\n\n```cpp\nclass Fish\n\
  {\npublic:\n   virtual void Swim()\n   {\n      cout << \"Fish swims!\" << endl;\n\
  \   }\n};\n```\n\n假设派生类 `Tuna` 定义了一个函数 `Swim()`，但签名略有不同——由于一个程序员想要覆盖 `Fish::Swim()`，却在无意中插入了\
  \ `const`：\n\n点击此处查看代码图像\n\n```cpp\nclass Tuna:public Fish\n{\npublic:\n   void\
  \ Swim() const\n   {\n      cout << \"Tuna swims!\" << endl;\n   }\n};\n```\n\n\
  该函数 `Tuna::Swim()` 实际上并没有覆盖 `Fish::Swim()`。由于 `Tuna::Swim()` 中存在 `const`，它们的签名是不同的。然而，编译仍然会通过，程序员可能会错误地认为他已经成功覆盖了\
  \ `class Tuna` 中的函数 `Swim()`。C++11 及其以后的版本为程序员提供了一个 `override` 修饰符，它用于验证被覆盖的函数是否已在基类中被声明为虚函数：\n\
  \n点击此处查看代码图像\n\n```cpp\nclass Tuna:public Fish\n{\npublic:\n   void Swim() const\
  \ override // 错误：Fish 中没有此签名的虚函数\n   {\n      cout << \"Tuna swims!\" << endl;\n\
  \   }\n};\n```\n\n因此，`override` 提供了一种强大的方式，用来显式表达覆盖基类虚函数的意图，从而让编译器检查：\n\n![Image](img/square.jpg)\
  \ 基类函数是 `virtual` 的。\n\n![Image](img/square.jpg) 基类虚函数的签名与声明为 `override` 的派生类函数签名完全匹配。\n\
  \n### 使用 `final` 防止函数被覆盖\n\n`final` 修饰符在 C++11 中引入，首次在 第 10 节 中向你介绍过。声明为 `final`\
  \ 的 `class` 不能用作基类。同样，声明为 `final` 的 `virtual` 函数不能在派生类中被覆盖。\n\n因此，一个不允许对虚函数 `Swim()`\
  \ 进行任何进一步特化的 `class Tuna` 变体将如下所示：\n\n点击此处查看代码图像\n\n```cpp\nclass Tuna:public Fish\n\
  {\npublic:\n   // 覆盖 Fish::Swim 并将其设置为 final\n   void Swim() override final\n  \
  \ {\n      cout << \"Tuna swims!\" << endl;\n   }\n};\n```\n\n这个版本的 `Tuna` 可以被继承，但\
  \ `Swim()` 不能再被进一步覆盖：\n\n点击此处查看代码图像\n\n```cpp\nclass BluefinTuna final:public Tuna\n\
  {\npublic:\n   void Swim() // 错误：Swim() 在 Tuna 中是 final，不能覆盖\n   {\n};\n```\n\n\
  关于 `override` 和 `final` 修饰符的演示可以在 列表 11.9 中找到。\n\n### 注意\n\n我们在声明 `class BluefinTuna`\
  \ 时也使用了 `final`。这确保了 `class BluefinTuna` 不能被用作基类。因此，以下操作将导致错误：\n\n点击此处查看代码图像\n\n\
  ```cpp\nclass FailedDerivation:public BluefinTuna\n{\n};\n```\n\n### 虚拷贝构造函数？\n\n\
  嗯，章节标题末尾的问号是合理的。在 C++ 中，技术上是不存在虚拷贝构造函数的。然而，这种功能可以帮助你创建一个 `Base*` 类型的集合（例如静态数组），其中每个元素都是该类型的特化版本：\n\
  \n点击此处查看代码图像\n\n```cpp\n// Tuna, Carp 和 Trout 是继承自基类 Fish 的类\nFish* pFishes[3];\n\
  Fishes[0] = new Tuna();\nFishes[1] = new Carp();\nFishes[2] = new Trout();\n```\n\
  \n然后将它赋值给另一个相同类型的数组，由于虚拷贝构造函数确保了派生类的深拷贝，从而确保即使拷贝构造函数是在 `Fish*` 上操作的，`Tuna`、`Carp`\
  \ 和 `Trout` 也会作为 `Tuna`、`Carp` 和 `Trout` 被复制。\n\n好吧，那只是一个梦想。虚拷贝构造函数是不可能的，因为在“基类被派生类实现覆盖”的语境下，`virtual`\
  \ 关键字是关于运行时生成的多态行为。相反，构造函数不是多态的。\n\n\n\n\n\n除了通过虚函数 `Fish::Clone()` 展示虚拷贝构造函数外，Listing\
  \ 11.9 还演示了关键字 `override` 和 `final` 的用法——后者既可以应用于虚函数，也可以应用于类。它在第 8 行为 `class Fish`\
  \ 特有一个虚析构函数。`main()` 函数中的第 52–56 行演示了如何声明一个指向基类指针 `Fish*` 的静态数组，并将各个元素分别赋值给新创建的\
  \ `Tuna`、`Carp`、`Tuna` 和 `Carp` 类型的对象。注意这个数组 `myFishes` 如何能够收集看似不同的类型，而这些类型都通过共同的基类型\
  \ `Fish` 关联。与书中之前介绍的大多为简单单调类型 `int` 的数组相比，这已经很酷了。如果这还不够酷的话，你还可以在循环中使用虚函数 `Fish::Clone()`\
  \ 将其拷贝到一个名为 `myNewFishes` 的类型为 `Fish*` 的新数组中，如第 60 行所示。请注意，你的数组非常小，只有四个元素。它可以长得很多，但对拷贝逻辑没有多大影响，因为只需要调整循环结束条件参数即可。第\
  \ 64 行是实际检查处，你对新数组中的每个存储元素调用了虚函数 `Fish::Swim()`，以验证 `Clone()` 是否将 `Tuna` 拷贝为了 `Tuna`\
  \ 而不仅仅是一个 `Fish()`。输出结果证明，它确实如预期那样拷贝了 `Tuna` 和 `Carp`。另外注意，在 `BluefinTuna` 实例上使用的\
  \ `Swim()` 的输出与 `Tuna` 相同，因为 `Tuna::Swim()` 被声明为 `final`。因此，`BluefinTuna` 不允许重写\
  \ `Swim()`，编译器为它执行了 `Tuna::Swim()`。\n\n***\n\n## DO\n\n- **务必**记住将需要派生类重写的基类函数标记为\
  \ `virtual`。\n- **务必**记住纯虚函数会让你的类成为抽象基类（Abstract Base Class），这些函数必须由派生类实现。\n- **务必**在派生类中使用\
  \ `override` 关键字标记旨在重写基类功能的函数。\n- **务必**使用虚继承来解决菱形问题（Diamond Problem）。\n\n***\n\n\
  ## DON’T\n\n- **不要**忘记为你的基类提供一个虚析构函数。\n- **不要**忘记编译器不允许你创建抽象基类的独立实例。\n- **不要**忘记虚继承是为了确保菱形层次结构中的公共基类只有一个实例。\n\
  - **不要**混淆 `virtual` 关键字在创建继承层次结构时使用的功能与在声明基类函数时使用的功能之间的区别。\n\n### 总结\n\n在这节课程中，你学会了如何通过多态在\
  \ C++ 代码中利用创建继承层次结构的力量。你学习了如何声明和编写虚函数——以及它们如何确保即使使用基类实例来调用虚方法，派生类的实现也能重写基类中的实现。你目证了纯虚函数是虚函数的一种特殊类型，它们确保了基类本身不能被实例化，从而成为定义派生类必须满足的接口的完美位置。最后，你看到了由多重继承引起的菱形问题，以及\
  \ `virtual` 继承如何帮助你解决它。\n\n### 问答\n\n**Q 为什么代码在编译时不需要 `virtual` 关键字也要在基类函数上使用它？**\n\
  \n**A** 没有 `virtual` 关键字，你无法确保调用 `objBase.Function()` 的地方会被重定向到 `Derived::Function()`。此外，代码编译并不是衡量质量的唯一标准。\n\
  \n**Q 为什么编译器要创建虚函数表（Virtual Function Table）？**\n\n**A** 为了存储函数指针，确保调用正确版本的虚函数。\n\
  \n**Q 基类应该始终有一个虚析构函数吗？**\n\n**A** 理想情况下是。只有这样你才能确保当某人对\n\n点击此处查看代码图片\n\n```\nBase*\
  \ pBase = new Derived();\ndelete pBase;\n```\n\n类型为 `Base*` 的指针执行 `delete` 会导致析构函数\
  \ `~Derived()`。这在析构函数 `~Base()` 被声明为 `virtual` 时就会发生。\n\n**Q 当我甚至无法独立实例化时，抽象基类（Abstract\
  \ Base Class）有什么用？**\n\n**A** 抽象基类并不是为了作为独立对象实例化的；相反，它总是为了被派生。它包含了纯虚函数，定义了派生类需要实现的函数最小蓝图，从而充当了接口的角色。\n\
  \n**Q 给定一个继承层次结构，我需要在所有虚函数的声明处使用 `virtual` 关键字，还是只需要在基类中使用？**\n\n**A** 只需声明一次 `virtual`\
  \ 函数就足够了，但该声明必须在基类中。\n\n**Q 我可以在抽象基类中定义成员函数并拥有成员属性吗？**\n\n**A** 当然可以。记住，你仍然无法实例化抽象基类，因为它至少有一个需要由派生类实现的纯虚函数。\n\
