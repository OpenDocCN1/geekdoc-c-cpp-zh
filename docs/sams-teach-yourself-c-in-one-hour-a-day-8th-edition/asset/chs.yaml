  \n### 带有默认值的构造函数参数\n\n就像函数可以指定默认值一样，构造函数也可以。你在看到的代码是列表 9.5 第 11 行构造函数的稍微修改版本，其中\
  \ `age` 参数具有默认值 25：\n\n点击此处查看代码图像\n\n```cpp\nclass Human\n{\nprivate:\n   string\
  \ name;\n   int age;\npublic:\n   // 重载构造函数（无默认构造函数）\n   Human(string humansName,\
  \ int humansAge = 25)\n   {\n        name = humansName;\n        age = humansAge;\n\
  \        cout << \"Overloaded constructor creates \" << name;\n        cout << \"\
