  \ (value ^= 0x55) << endl;\n26:     cout << \"After &= 0x0F, value = \" << (value\
  \ &= 0x0F) << endl;\n27:\n28:     return 0;\n29: }\n```\n\n输出 ![Image](img/arrow.jpg)\n\
  \n点击此处查看代码图像\n\n```\nEnter a number: 440\nAfter += 8, value = 448\nAfter -= 2, value\
  \ = 446\nAfter /= 4, value = 111\nAfter *= 4, value = 444\nAfter %= 1000, value\
  \ = 444\nAfter <<= 1, value = 888\nAfter >>= 2, value = 222\nAfter |= 0x55, value\
  \ = 223\nAfter ^= 0x55, value = 138\nAfter &= 0x0F, value = 10\n```\n\n### 分析 ![Image](img/arrow.jpg)\n\
  \n注意 `value` 在整个程序中通过各种赋值运算符被不断修改。每个操作都是使用 `value` 执行的，并将操作的结果赋值回它。因此，在第 9 行，用户输入的\
  \ 440 加上了 8，结果为 448 并赋值回 `value`。在第 11 行的随后的操作中，从 448 中减去 2，得到 446，然后赋值回 `value`，依此类推。\n\
  \n### 使用运算符 `sizeof` 确定变量占用的内存\n\n该运算符告诉你特定类型或变量消耗的字节（bytes）内存量。`sizeof` 的用法如下：\n\
  \n```cpp\nsizeof (variable);\n```\n\n或\n\n```cpp\nsizeof (type);\n```\n\n### 注意\n\
  \n`sizeof(...)` 看起来像是一个函数调用，但它不是函数。`sizeof` 是一个运算符。有趣的是，这个运算符不能由程序员定义，因此不能重载。\n\n\
  你可以在第 12 Lesson，“运算符类型和运算符重载](#ch12.html_ch12)”中学习更多关于定义自定义运算符的知识。\n\n列表 5.10 展示了使用\
  \ `sizeof` 来确定数组占用的内存空间。此外，你可能想回顾列表 3.4 以分析 `sizeof` 在确定最熟悉的变量类型所消耗内存方面的用法。\n\n\
  ### 列表 5.10 使用 `sizeof` 确定 100 个整数数组以及每个元素占用的字节数\n\n点击此处查看代码图像\n\n```cpp\n0: #include\
  \ <iostream>\n1: using namespace std;\n2:\n3: int main()\n4: {\n5:     cout << \"\
  Use sizeof to determine memory used by arrays\" << endl;\n6:     int myNumbers [100]\
  \ = {0};\n7:\n8:     cout << \"Bytes used by an int: \" << sizeof(int) << endl;\n\
  9:     cout << \"Bytes used by myNumbers: \" << sizeof(myNumbers) << endl;\n10:\
  \     cout << \"Bytes used by an element: \" << sizeof(myNumbers[0]) << endl;\n\
  11:\n12:     return 0;\n13: }\n```\n\n输出 ![Image](img/arrow.jpg)\n\n点击此处查看代码图像\n\
  \n```\nUse sizeof to determine memory used by arrays\nBytes used by an int: 4\n\
  Bytes used by myNumbers: 400\nBytes used by an element: 4\n```\n\n\n\n\n\n你已经学习了运算符优先级，以及使用括号编写能够让其他程序员也能理解的代码是多么重要。你还了解了整数溢出的概述，以及避免溢出实际上是有多重要。\n\
  \n### 问答\n\n**问：为什么有些程序使用 `unsigned int`，而由于 `unsigned short` 占用的内存更少且也可以编译？**\n\
  \n**答** `unsigned short` 通常有一个 65535 的限制，如果对其进行自增操作，它会溢出为零。为了避免这种行为，编写良好的应用程序在不确定值是否会保持远低于此限制时，会选择\
  \ `unsigned int`。\n\n**问：我需要在一个数字被除以 3 之后计算它的两倍。那么，你认为以下代码有什么问题吗：**\n\n点击此处查看代码图像\n\
  \n```cpp\nint result = Number / 3 << 1;\n```\n\n**答** 有的！你为什么不直接使用括号让这行代码对其他程序员来说更易读呢？增加一两个注释也没有无妨。\n\
  \n**问：我的应用程序将两个整数值 5 和 2 相除：**\n\n点击此处查看代码图像\n\n```cpp\nint num1 = 5, num2 = 2;\n\
  int result = num1 / num2;\n```\n\n**执行时，结果的值为 2。这不对吗？**\n\n**答** 完全不对。整数并不是为了包含小数数据的。因此，该操作的结果是\
  \ 2 而不是 2.5。如果你的结果是 2.5，请将所有数据类型改为 `float` 或 `double`。这些是用于处理浮点（小数）运算的。\n\n### 工作坊\n\
  \n工作坊提供了测验题来帮助你巩固对所涵盖内容的理解，并提供了练习让你获得使用所学知识的经验。在检查 附录 E 中的答案之前，尝试回答测验和练习题，并确保在继续后续课程之前理解答案。\n\
  \n#### 测验\n\n**1.** 我正在编写一个用于除法的应用程序。哪种数据类型更合适：`int` 还是 `float`？\n\n**2.** `32 /\
  \ 7` 的值是多少？\n\n**3.** `32.0/7` 的值是多少？\n\n**4.** `sizeof(...)` 是一个函数吗？\n\n**5.**\
  \ 我需要计算一个数字的两倍，给它加 5，然后再再次加倍。这正确吗？\n\n点击此处查看代码图像\n\n```cpp\nint result = number\
  \ << 1 + 5 << 1;\n```\n\n**6.** 当异或操作的操作数都为真时，异或操作的结果是什么？\n\n### 练习\n\n**1.** 改进测验题\
  \ 5 中的代码，使用括号来提高清晰度。\n\n**2.** 由此表达式存储的 `result` 的值是多少：\n\n点击此处查看代码图像\n\n```cpp\n\
  int result = number << 1 + 5 << 1;\n```\n\n**3.** 编写一个程序，要求用户输入两个布尔值，并演示各种位运算符在它们上的结果。\n\
  \n## 第 6 节。控制程序流\n\n大多数应用程序在面对新情况或不同输入时会有不同的行为。为了让你的应用程序做出不同的反应，你需要编写条件语句，在不同情况下执行不同的代码段。\n\
  \n在本节中，你将了解到：\n\n![Image](img/square.jpg) 如何让你的程序在某些条件下有不同的行为\n![Image](img/square.jpg)\
  \ 如何在循环中重复执行一段代码\n![Image](img/square.jpg) 如何在循环中更好地控制执行流\n\n### 使用 `if ... else`\
  \ 进行条件执行\n\n你到目前为止看到和编写的程序都是按顺序执行的——从上到下。每一行都被执行了，没有任何一行被遗忽略。但在大多数应用程序中，按从到下的顺序执行所有代码行的情况很少见。\n\
  \n想象你需要一个程序，如果用户按下 *m*，则两个数字相乘；如果他按下其他键，则将数字相加。\n\n正如图 6.1 所示，并不是所有的代码路径在每次运行中都会执行。如果用户按下\
  \ *m*，就会执行乘以两个数字的代码。如果他输入 *m* 以外的任何内容，就会执行执行加法的代码。不存在两者都执行的情况。\n\n![Image](img/06fig01.jpg)\n\
  \n**图 6.1** 基于用户输入的条件处理示例。\n\n#### 使用 `if ... else` 进行条件编程\n\n代码的条件执行在 C++ 中通过 `if\
  \ ... else` 结构实现，如下所示：\n\n点击此处查看代码图像\n\n```cpp\nif (expression)\n    do something\
  \ when true;\nelse\n    do something when false;\n```\n\n所以，当用户按下 *m* 时，执行乘以两个数字的代码。如果他输入\
  \ *m* 以外的任何内容，就会执行执行加法的代码。永远不存在两者都执行的情况。\n\n![Image](img/06fig01.jpg)\n\n#### 使用\
  \ `if ... else` 进行条件编程\n\n代码的条件执行在 C++ 中通过 `if ... else` 结构实现，如下所示：\n\n点击此处查看代码图像\n\
  \n```cpp\nif (expression)\n    do something when true;\nelse\n    do something when\
  \ false;\n```\n\n所以，当用户输入 *m* 时执行乘法，否则加法的 `if ... else` 结构看起来如下：\n\n点击此处查看代码图像\n\
  \n```cpp\nif (userSelection == 'm')\n    result = num1 * num2;\nelse\n    result\
  \ = num1 + num2;\n```\n\n注意，在 C++ 中，当表达式为真时执行 `if`，当表达式为假时执行 `else`。\n\n让我们分析 列表\
  \ 6.1 中的这个结构，它允许用户决定是相乘还是相加。\n\n**列表 6.1** 根据用户输入进行整数加法\n\n```cpp\n#include <iostream>\n\
  using namespace std;\n\nint main() {\n    cout << \"Enter integers: \" << endl;\n\
  \    int num1 = 0, num2 = 0;\n    cin >> num1;\n    cin >> num2;\n    cout << \"\
  Enter 'm' to multiply, anything else to add: \";\n    char userSelection = '\\0';\n\
  \    cin >> userSelection;\n    int result = 0;\n    if (userSelection == 'm')\n\
  \        result = num1 * num2;\n    else\n        result = num1 + num2;\n    cout\
  \ << \"result is: \" << result << endl;\n    return 0;\n}\n```\n\n输出 ![Image](img/arrow.jpg)\n\
  \n点击此处查看代码图像\n\n```\nEnter integers:\n25\n56\nEnter 'm' to multiply, anything else\
  \ to add: m\nresult is: 1400\n```\n\n下次运行：\n\n点击此处查看代码图像\n\n```\nEnter integers:\n\
  25\n56\nEnter 'm' to multiply, anything else to add: a\nresult is:81\n```\n\n分析\
  \ ![Image](img/arrow.jpg)\n\n注意第 15 行的 `if` 和第 17 行的 `else`。我们指示编译器在 `if` 后面的表达式\
  \ `(userSelection == 'm')` 评估为真时执行乘法，或者在表达式评估为假时执行加法。`(userSelection == 'm')` 是一个在用户输入字符\
  \ *m*（区分大小写）时评估为真的表达式，否则评估为假。因此，这个简单的程序模拟了图 6.1 中的流程图，并演示了你的应用程序如何在不同情况下产生不同的行为。\n\
  \n注意 `if ... else` 结构的 `else` 部分是可选的，如果在失败情况下没有需要执行的内容，则不需要使用。\n\n警告\n\n如果在 列表 6.1\
  \ 中，第 15 行是\n\n点击此处查看代码图像\n\n```cpp\nif (userSelection == 'm');\n```\n\n那么 `if`\
  \ 结构就是毫无意义的，因为它在同一行被一个空语句（分号）终止了。请小心并避免这种情况，因为在这些情况下你不会得到编译错误。\n\n\n\n\n\n在在这种情况下，一些良好的编译器可能会向你警告一个“空控制语句”。\n\
  \n***\n\n### 条件执行执行多个语句\n\n如果你想在条件成功或失败时执行多个语句，你需要将它们封装在语句块中。这些语句块本质上是使用大括号 `{...}`\
  \ 包围了多个要作为代码块执行的语句。例如：\n\n点击此此处查看代码图像\n\n```cpp\nif (condition) \n{\n    // 条件成功块\n\
  \    Statement 1;\n    Statement 2;\n}\nelse\n{\n    // 条件失败块\n    Statement 3;\n\
  \    Statement 4;\n}\n```\n\n此类块也被称为 `compound`（复合）语句。\n\n列表 6.2 是 第 4  “管理数组和字符串”中\
  \ 列表 4.6 的更安全版本。它使用了一个复合语句，当用户输入的长度在数组范围内时，将用户输入复制到静态字符数组 `if` 中。\n\n**列表 6.2**\
  \ 在将字符串复制到 `char` 数组之前检查边界\n\n点击此此处查看代码图像\n\n***\n\n```cpp\n0: #include <iostream>\n\
  1: #include <string>\n2: #include <string.h>\n3: using namespace std;\n4: int main()\n\
  5: {\n6:      cout << \"Enter a line of text: \" << endl;\n7:      string userInput;\n\
  8:      getline (cin, userInput);\n9:\n10:      char copyInput[20] = { '\\0' };\n\
  11:      if (userInput.length() < 20) // 检查边界\n12:      {\n13:          strcpy(copyInput,\
  \ userInput.c_str());\n14:          cout << \"copyInput contains: \" << copyInput\
  \ << endl;\n15:      }\n16:      else\n17:          cout << \"Bounds exceeded: won't\
  \ copy!\" << endl;\n18:\n19:      return 0;\n20: }\n```\n\n***\n\n输出 ![Image](img/arrow.jpg)\n\
  \n点击此此处查看代码图像\n\n输入一行文本：\nThis fits buffer!\ncopyInput contains: This fits buffer!\n\
  \n下次运行：\n\n点击此此处查看代码图像\n\n输入一行文本：\nThis doesn't fit the buffer!\nBounds exceeded:\
  \ won't copy!\n\n分析 ![Image](img/arrow.jpg)\n\n注意在第 11 行中复制到缓冲区之前，是如何对字符串长度与缓冲区长度进行检查的。这个\
  \ `if` 检查的特殊之处在于，当检查结果为 `true` 时，第 12 行到第 15 行存在一个语句块（也称为复合语句）。\n\n### 嵌套 `if` 语句\n\
  \n通常你可能会遇到这样的情况：需要针对一组不同的条件进行验证，其中许多条件依赖于前一个条件的评估。C++ 允许你嵌套 `if` 语句来处理此类需求。\n\n\
  嵌套 `if` 语句类似于：\n\n点击此此处查看代码图像\n\n```cpp\nif (expression1)\n{\n    DoSomething1;\n\
  \    if(expression2)\n        DoSomething2;\n    else\n        DoSomethingElse2;\n\
  }\nelse\n    DoSomethingElse1;\n```\n\n考虑一个类似于 列表 6.1 的应用程序，用户可以通过按下命令字符 `d` 或 `m`\
  \ 来指示应用程序进行除法或乘法。现在，只有在除数不零时才允许除法。因此，除了检查用户输入的预图命令之外，当用户指示程序进行除法时，检查除数是否非零同样重要。列表\
  \ 6.3 使用了嵌套的 `if` 结构。\n\n**列表 6.3** 在数字乘法或除法中使用 `if` 语句\n\n点击此此处查看代码图像\n\n***\n\n\
  ```cpp\n0: #include <iostream>\n1: using namespace std;\n2:\n3: int main()\n4: {\n\
  5:   cout << \"Enter two numbers: \" << endl;\n6:   float num1 = 0, num2 = 0;\n\
  7:   cin >> num1;\n8:   cin >> num2;\n9:\n10:  cout << \"Enter 'd' to divide, anything\
  \ else to multiply: \";\n11:  char userSelection = '\\0';\n12:  cin >> userSelection;\n\
  13:\n14:  if (userSelection == 'd')\n15:  {\n16:     cout << \"You wish to divide!\"\
  \ << endl;\n17:     if (num2 != 0)\n18:         cout << num1 << \" / \" << num2\
  \ << \" = \" << num1 / num2 << endl;\n19:     else\n20:         cout << \"Division\
  \ by zero is not allowed\" << endl;\n21:  }\n22:  else\n23:  {\n24:     cout <<\
  \ \"You wish to multiply!\" << endl;\n25:     cout << num1 << \" x \" << num2 <<\
  \ endl;\n26:  }\n27:\n28:  return 0;\n29: }\n```\n\n***\n\n输出 ![Image](img/arrow.jpg)\n\
  \n点击此此处查看代码图像\n\n输入两个数字：\n45\n9\n输入 'd' to divide, anything else to multiply: m\n\
  You wish to multiply!\n45 x 9\n\n下次运行：\n\n点击此此处查看代码图像\n\n输入两个数字：\n22\n7\n输入 'd'\
  \ to divide, anything else to multiply: d\nYou wish to divide!\n22 / 7\n\n上次运行：\n\
  \n点击此此处查看代码图像\n\n输入两个数字：\n35\n0\n输入 'd' to divide, anything else to multiply: d\n\
  Division by zero is not allowed\n\n分析 ![Image](img/arrow.jpg)\n\n注意在第 11 行中复制到缓冲区之前，是如何对字符串长度与缓冲区长度进行检查的。这个\
  \ `if` 检查的特殊之处在于，当检查结果为 `true` 时，第 12 行到第 15 行存在一个语句块（也称为复合语句）。\n\n### 提示\n\n你插入代码的嵌套缩进是可选的，但它们极大地提高了\
  \ `if` 语句的可读性。现代 IDE 会自动缩进代码。\n\n***\n\n注意 `if...else` 语句也可以组合在一起。列表 6.4 是询问用户星期几，然后使用分组的\
  \ `if...else` 结构告诉他们那是几几程序。\n\n**列表 6.4** 使用分组的 `if...else` 结构\n\n点击此此处查看代码图像\n\n\
  ***\n\n```cpp\n0: #include <iostream>\n1: using namespace std;\n2:\n3: int main()\n\
  4: {\n5:   enum DaysOfWeek\n6:   {\n7:     Sunday = 0,\n8:     Monday,\n9:     Tuesday,\n\
  10:    Wednesday,\n11:    Thursday,\n12:    Friday,\n13:    Saturday\n14:  };\n\
  15:\n16:  cout << \"Find what days of the week are named after!\" << endl;\n17:\
  \  cout << \"Enter a number for a day (Sunday = 0): \";\n18:\n19:  int dayInput\
  \ = Sunday; // 初始化为 Sunday\n20:  cin >> dayInput;\n21:\n22:  if (dayInput == Sunday)\n\
  23:      cout << \"Sunday was named after the Sun\" << endl;\n24:  else if (dayInput\
  \ == Monday)\n25:      cout << \"Monday was named after the Moon\" << endl;\n26:\
  \  else if (dayInput == Tuesday)\n27:      cout << \"Tuesday was named after Mars\"\
  \ << endl;\n28:  else if (dayInput == Wednesday)\n29:      cout << \"Wednesday was\
  \ named after Mercury\" << endl;\n30:  else if (dayInput == Thursday)\n31:     \
  \ cout << \"Thursday was named after Jupiter\" << endl;\n32:  else if (dayInput\
  \ == Friday)\n33:      cout << \"Friday was named after Venus\" << endl;\n34:  else\
  \ if (dayInput == Saturday)\n35:      cout << \"Saturday was named after Saturn\"\
  \ << endl;\n36:\n37:  return 0;\n38: }\n```\n\n\n\n\n```cpp\n35:        cout <<\
  \ \"Saturday was named after Saturn\" << endl;\n36:    else\n37:        cout <<\
  \ \"Wrong input, execute again\" << endl;\n38:\n39:    return 0;\n40: }\n```\n\n\
  * *\n\n输出 ![Image](img/arrow.jpg)\n\n点击此处查看代码图像\n\n查找星期几是用什么星命名的！\n\n输入一个天的数字 (星期日\
  \ = 0): 5\n星期五是用金星命名的\n\n下次运行：\n\n点击此处查看代码图像\n\n查找星期几是用什么星命名的！\n\n输入一个天的数字 (星期日\
  \ = 0): 9\n输入无效，请重新执行\n\n### 分析\n\n![Image](img/arrow.jpg)\n\n注意第 22 到 37 行中使用的\
  \ `if-else-if` 结构，它用于检查用户输入并产生相应的输出。第二次运行的输出表明，当用户输入的数字超出预期范围 0–6 时（即不对应星期几中的任何一天），程序能够告知用户。这种结构的优势在于它非常适合验证互斥的条件，例如，星期一不可能是星期二，且无效输入不可能是任何星期几之一。该程序中另一个值得注意的有趣点是使用了在第\
  \ 5 行声明的名为 `DaysOfWeek` 的枚举，并在整个 `if` 语句中都使用了它。你可以简单地将用户输入与整数值（如代表星期日的 0 等）进行比较。然而，使用枚举常量\
  \ `Sunday` 使代码更具可读性。\n\n### 使用 `switch-case` 进行条件处理\n\n`switch-case` 的目标是允许你将特定表达式与一组可能的常量进行比较，并可能对这些不同值中的每一个执行不同的操作。你在这种结构中经常看到的新\
  \ C++ 关键字有 `switch`、`default` 和 `break`。\n\n以下是 `switch-case` 结构的语法：\n\n点击此处查看代码图像\n\
  \n```cpp\nswitch(expression)\n{\ncase LabelA:\n    DoSomething;\n    break;\ncase\
  \ LabelB:\n    DoSomethingElse;\n    break;\n// 等此类推...\ndefault:\n    DoStuffWhenExpressionIsNotHandledAbove;\n\
  \    break;\n}\n```\n\n发生的情况是，结果代码会评估 `expression` 并与其后的每个 `case` 标签进行等值检查。每个 `case`\
  \ 标签都需要一个常量。然后它执行该标签后的代码。当 `expression` 的值不等于 `LabelA` 时，它会检查 `LabelB`。如果该检查结果为\
  \ `true`，则会执行 `DoSomethingElse`。这种检查持续持续，直到遇到 `break`。这是我们第一次使用 `break` 关键字。`break`\
  \ 会导致执行退出代码块。`break` 不是强制性的；但是，如果没有 `break`，执行将将继续检查下一个标签，依此类推，而这正是你在这种情况下想要避免的。`default`\
  \ 也是可选的，当表达式不等于 `switch-case` 结构中的任何标签时，将执行 `default` 情况。\n\n* *\n\n### 提示\n\n`switch-case`\
