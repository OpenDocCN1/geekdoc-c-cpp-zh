  \ `vector` 类的缓冲区重新分配？\n\n**3.** `pop_back()` 函数的作用是什么？\n\n**4.** 如果 `vector<int>`\
  \ 是一个整数的动态数组，那么 `vector<Mammal>` 是一个什么种类型的动态数组？\n\n**5.** `vector` 中的元素可以被随机访问吗？如果可以，如何操作？\n\
  \n**6.** 什么类型的迭代器允许对 `vector` 阶元素进行随机访问？\n\n### 练习\n\n**1.** 编写一个交互式程序，接收用户的整数输入并将其保存到\
  \ `vector` 中。用户应该能够根据索引随时查询存储在 `vector` 中的某个值。\n\n**2.** 扩展练习 1 中的程序，使其能够告诉用户其查询的值是否已存在于\
  \ `vector` 中。\n\n**3.** 杰克（Jack）在 eBay 上销售罐子。为了帮助他包装和运输，编写一个程序，让他可以在其中输入每个物品的尺寸，将它们存储在\
  \ `vector` 中，并在屏幕上打印出来。\n\n**4.** 编写一个应用程序，将 `deque` 初始化为以下三个字符串：`“Hello”`、`“Containers\
  \ are cool!”` 和 `“C++ is evolving!”`。你必须使用适用于所有类型 deque 的泛型函数来显示它们。你的应用程序需要演示 C++11\
  \ 引入的列表初始化（List Initialization）以及 C++14 引入的 `operator \"\"s`。\n\n## 第 18 节：STL `list`\
  \ 和 `forward_list`\n\n标准模板库（STL）以模板类 `std::list` 的形式为程序员提供了双向链表。链表的主要优势在于元素的插入和删除是快速且常数时间内的。从\
  \ C++11 开始，你还可以使用 `std::forward_list` 形式的单向链表，它只能单向遍历。\n\n在本节中，你将学习：\n\n- 如何实例化\
  \ `list` 和 `forward_list`\n- 如何使用 STL list 类，包括插入和删除\n- 如何反转和排序元素\n\n### `std::list`\
  \ 的特性\n\n`linked list`（链表）是一个节点集合，其中每个节点除了包含感兴趣的值或对象外，还指向下一个节点；也就是说，每个节点都连接到下一个和上一个节点，如图\
  \ 18.1 所示。\n\n**图 18.1** 双向链表的视觉表示。\n\nSTL 对 `list` 类的实现允许在 `list` 的顶部、底部或中间进行常数时间的插入。\n\
  \n***\n\n提示\n要使用类 `std::list`，请包含头文件：\n\n```cpp\n#include <list>\n```\n\n#### 基本\
  \ `list` 操作\n\n要使用 STL 的 `list` 类，请包含头文件 `<list>`。存在于 `std` 命名空间中的模板类 `list` 是通用实现，在使用它的任何实用成员函数之前，需要先对其进行模板实例化。\n\
  \n#### 实例化 `std::list` 对象\n\n`list` 的模板实例化需要指定你想要在列表中收集的对象类型。因此，列表的初始化看起来如下：\n\n\
  ```cpp\nstd::list<int> linkInts;  // 包含整数的列表\nstd::list<float> listFloats;  // 包含浮点数的列表\n\
  std::list<Tuna> listTunas;  // 包含 Tuna 类型对象的列表\n```\n\n要声明一个指向列表中元素的迭代器，你会使用：\n\n\
  ```cpp\nstd::list<int>::const_iterator elementInList;\n```\n\n如果你需要一个可以修改值或调用非 `const`\
  \ 函数的迭代器，你应该使用 `iterator` 而不是 `const_iterator`。\n\n鉴于 `std::list` 的实现提供了一组重载构造函数，你甚至可以创建初始化为包含指定数量元素的列表，且每个元素都初始化为一个特定值，如列表\
  \ 18.1 所示。\n\n**列表 18.1** 实例化 `std::list` 的不同形式，指定元素数量和初始值\n\n```cpp\n0: #include\
  \ <list>\n1: #include <vector>\n2: \n3: int main ()\n4: {\n5:     using namespace\
  \ std;\n6: \n7:     // 实例化一个空列表\n8:     list <int> linkInts;\n9: \n10:    // 实例化一个包含\
  \ 10 个整数的列表\n11:    list<int> listWith10Integers(10);\n12: \n13:    // 实例化一个包含 4\
  \ 个整数的列表，每个值均为 99\n14:    list<int> listWith4IntegerEach (10, 99);\n15: \n16:  \
  \  // 创建现有列表的完全拷贝\n17:    list<int> listCopyAnother(listWith4Integer99);\n18: \n\
  19:    // 一个包含 10 个整数的 vector，每个均为 2017\n20:    vector<int> vecIntegers(10, 2017);\n\
  21: \n22:    // 使用另一个容器的值来实例化列表\n23:    list<int> listContainsOfAnother(vecIntegers.cbegin(),\n\
  24:             vecIntegers.cend());\n25: \n26:    return 0;\n27: }\n```\n\n该程序没有输出。在第\
  \ 8 行实例化了一个空列表，在第 11 行实例化了一个包含 10 个整数的列表，在第 14 行实例化了一个包含 4 个整数的列表，每个值均为 99。在第 17\
  \ 行创建了 `listWith4Integer99` 的完全拷贝。在第 20 行有一个包含 10 个整数的 `vector`，每个均为 2017。在第 23-24\
  \ 行使用 `vecIntegers.cbegin()` 和 `vecIntegers.cend()` 实例化了一个包含另一个容器元素的列表。\n\n***\n\
  \n注意\n通过对比列表 18.1 和第 17 节中的“STL 动态数组类”，你会注意到不同类型容器实例化方式具有明显的模式和相似性。使用的 STL 容器越多，发现的可复用模式越多，操作也越容易。\n\
  \n#### 在列表头部或尾部插入元素\n\n与 `deque` ，在头部（取决于你的视角）插入通过 `list` 成员函数 `push_front()` 实现。在尾部插入通过成员函数\
  \ `push_back()` 完成。这两个方法接受一个输入参数，即要插入的值：\n\n```cpp\nlinkInts.push_back (-1);\nlinkInts.push_front\
  \ (2001);\n```\n\n列表 18.2 展示了使用这两个方法处理整数 `list` 的效果。\n\n**列表 18.2** 使用 `push_front()`\
  \ 和 `push_back()` 在列表中插入元素\n\n```cpp\n0: #include <list>\n1: #include <iostream>\n\
  2: using namespace std;\n3: \n4: template <typename T>\n5: void DisplayContents\
  \ (const T& container)\n6: {\n7:     for (auto element = container.cbegin();\n8:\
  \          element != container.cend();\n9:          ++ element )\n10:        cout\
  \ << *element << ' ';\n11: \n12:    cout << endl;\n13: }\n14: \n15: int main ()\n\
  16: {\n17:     std::list <int> linkInts{ -101, 42 };\n18: \n19:     linkInts.push_front\
  \ (10);\n20: }\n```\n\n\n\n\n\n```cpp\n20:    linkInts.push_front (2011);\n21: \
  \   linkInts.push_back (-1);\n22:    linkInts.push_back (9999);\n23:\n24:    DisplayContents(linkInts);\n\
  25:\n26:    return 0;\n27: }\n```\n\n输出 !![Image](img/arrow.jpg)\n\n2011 10 -101\
  \ 42 -1 9999\n\n\n\n\n\n```cpp\n29:    linkInts.erase(linkInts.begin(), linkInts.end());\n\
  30:    cout << \"Number of elements after erasing range: \";\n31:    cout << linkInts.size()\
  \ << endl;\n32:\n33:    return 0;\n34: }\n```\n\n输出 ![Image](img/arrow.jpg)\n\n\
  点击此处查看代码图像\n\n列表初始内容：\n2 4 3 5 -1 2017\n\n删除元素 '2' 后：\n4 3 5 -1 2017\n\n删除范围后的元素数量:\
  \ 0\n\n### 分析\n![Image](img/arrow.jpg)\n\n当使用 `insert()` 插入值时（如第 20 行所示），它会返回一个指向新插入元素的迭代器。该指向值为\
  \ 2 的元素的迭代器被存储在变量 `val2` 中，供后在第 26 行调用 `erase()` 时使用，以从 `list` 中删除该元素。第 29 行演示了使用\
  \ `erase()` 删除范围元素的用法。你清除了从 `begin()` 到 `end()` 的范围，这实际上是清除了整个列表。\n\n### 提示\n清空\
  \ STL 容器（如 `std::list`）最短且最简单的方法是调用成员函数 `clear()`。\n\n因此，在列表 18.4 中，第 29 行的更简洁的写法可以写为：\n\
  \n```cpp\nlinkInts.clear();\n```\n\n### 注意事项\n列表 18.4 在第 31 行演示了 `std::list` 中的元素数量可以使用列表方法\
  \ `size()` 来确定，这与 vector 的方法非常相似。这种模式适用于所有的 STL 容器类。\n\n### 反转和排序列表中的元素\n\n`list`\
  \ 有一个特殊属性：指向 `list` 中元素的迭代器在元素重排或插入新元素等情况下仍然保持有效。为了保持这一重要属性完好无损，`list` 函数提供了 `sort()`\
  \ 和 `reverse()` 作为成员方法，尽管 STL 也提供了这些算法并在 `list` 类上已经并可以工作。这些算法的成员版本确保了当元素的相对位置被改变时，指向\
  \ `list` 中元素的迭代器不会失效。\n\n#### 使用 `list::reverse()` 反转元素\n\n`list` 有一个成员函数 `reverse()`，该函数不接受参数，并为程序员反转\
  \ `list` 中内容的顺序：\n\n点击此处查看代码图像\n\n```cpp\nlinkInts.reverse();  // 反转元素顺序\n```\n\n\
  `reverse()` 的用法在列表 18.5 中演示。\n\n**列表 18.5** 反转列表中的元素\n\n点击此处查看代码图像\n\n```cpp\n0:\
  \ #include <list>\n1: #include <iostream>\n2: using namespace std;\n3:\n4: template\
  \ <typename T>\n5: void DisplayContents(const T& container)\n6: {\n7:     for (auto\
  \ element = container.cbegin();\n8:             element != container.cend();\n9:\
  \             ++ element )\n10:        cout << *element << ' ';\n11:\n12:     cout\
  \ << endl;\n13: }\n14:\n15: int main()\n16: {\n17:     std::list<int> linkInts{\
  \ 0, 1, 2, 3, 4, 5 };\n18:\n19:     cout << \"Initial contents of list:\" << endl;\n\
  20:     DisplayContents(linkInts);\n21:\n22:     linkInts.reverse();\n23:\n24: \
  \    cout << \"Contents of list after using reverse():\" << endl;\n25:     DisplayContents(linkInts);\n\
  26:\n27:     return 0;\n28: }\n```\n\n输出 ![Image](img/arrow.jpg)\n\n点击此处查看代码图像\n\
  \n列表初始内容：\n0 1 2 3 4 5\n\n使用 reverse() 后的列表内容：\n5 4 2 1 0\n\n### 分析\n![Image](img/arrow.jpg)\n\
  \n如第 22 行所示，`reverse()` 仅反转了 `list` 中元素的顺序。这是一个不带参数的简单调用，确保了如果程序员保留了指向 `list` 中元素的迭代器，它们在反转后仍然有效。\n\
  \n#### 排序元素\n`list` 成员函数 `sort()` 有一个不接受参数的版本：\n\n```cpp\nlinkInts.sort(); // 按升序排序\n\
  ```\n\n另一个版本允许你通过二元谓词作为参数来定义你自己的排序优先级：\n\n```cpp\nbool SortPredicate_Descending(const\
  \ int& lhs, const int& rhs)\n{\n    // list::sort 的标准：对于期望的顺序返回 true\n    return\
  \ (lhs > rhs);\n}\n```\n\n使用谓词排序列表：\n```cpp\nlinkInts.sort(SortPredicate_Descending);\n\
  ```\n\n这两个变体在列表 18.6 中演示。\n\n**列表 18.6** 整数列表的升序和降序排序\n\n```cpp\n0: #include <list>\n\
  1: #include <iostream>\n2: using namespace std;\n3:\n4: bool SortPredicate_Descending(const\
  \ int& lhs, const int& rhs)\n5: {\n6:     // list::sort 的标准：对于期望的顺序返回 true\n7: \
  \    return (lhs > rhs);\n8: }\n9:\n10: template <typename T>\n11: void DisplayContents(const\
  \ T& container)\n12: {\n13:     for (auto element = container.cbegin();\n14:   \
  \          element != container.cend();\n15:             ++ element )\n16:     \
  \   cout << *element << ' ';\n17:\n18:     cout << endl;\n19: }\n20:\n21: int main()\n\
  22: {\n23:     list<int> linkInts{ 0, -1, 2011, 444, -5 };\n24:\n25:     cout <<\
  \ \"Initial contents of the list are - \" << endl;\n26:     DisplayContents(linkInts);\n\
  27:\n28:     linkInts.sort();\n29:\n30:     cout << \"Order after sort():\" << endl;\n\
  31:     DisplayContents(linkInts);\n32:\n33:     linkInts.sort(SortPredicate_Descending);\n\
  34:     cout << \"Order after sort() with a predicate:\" << endl;\n35:     DisplayContents(linkInts);\n\
  36:\n37:     return 0;\n38: }\n```\n\n输出 ![Image](img/arrow.jpg)\n\n点击此处查看代码图像\n\
  \n列表初始内容为 -\n0 -1 2011 444 -5\n\nsort 后的顺序：\n-5 -1 0 444 2011\n\n使用谓词后的 sort 顺序：\n\
  2011 444 0 -1 -5\n\n### 分析\n![Image](img/arrow.jpg)\n\n该示例演示了整数列表的 `sort()` 成员函数。第\
  \ 28 行演示了不带参数的 `sort()` 函数用法，它默认按升序排序元素，使用 `<` 比较整数（对于整数，这是编译器实现的）。然而，如果程序员想要覆盖这种默认行为，他必须为\
  \ `sort()` 提供一个二元谓词，如第 33 行所示。在第 4-8 行定义的函数 `SortPredicate_Descending()` 是二元谓词，帮助\
  \ `list` 的 `sort()` 函数判断一个元素是否小于另一个。如果不是，它就会交换它们的位置。换句话说，你告诉列表什么被解释为小于（在这种情况下，是第一个参数大于第二个参数）。\n\
  \n#### 对包含类实例的 list 进行排序和删除元素\n\n如果你的 `list` 包含类类型而不是简单的内置类型（如 `int`）怎么办？假设有一个地址簿列表，每个条目都是一个包含姓名、地址等的类。你如何确保这个列表按姓名排序？\n\
  \n答案是以下之一：\n\n![Image](img/square.jpg) 在 `list` 包含的类类型内实现 `operator <`。\n\n![Image](img/square.jpg)\
  \ 提供一个排序*二元谓词*——该函数接受两个值作为输入并返回一个指示第一个值是否小于第二个值的布尔值。\n\n\n\n大多数涉及 STL 容器的实际应用很少收集整数；相反，它们收集用户定义的类型，例如\
  \ `classes` 或 `structs`。列表 18.7 以联系人 `list` 为示例演示了这种用法。初看之下似乎很长，但大部分都是简单的代码。\n\n\
