  \n点击此处查看代码图片\n\n```\nclass Vehicle\n{\npublic:\n  Vehicle() {}\n  ~Vehicle()\n};\n\
  \nclass Car: public Vehicle\n{\npublic:\n  Car() {}\n  ~Car() {}\n};\n```\n\n**3.**\
  \ 在练习 2 的代码中，如果这样创建并销毁 `car` 实例，构造函数和析构函数的执行顺序是怎样的？\n\n点击此处查看代码图片\n\n```\nVehicle*\
  \ pMyRacer = new Car;\ndelete pMyRacer;\n```\n\n## 第 12 节运算符类型与运算符重载\n\n除了封装数据和方法外，类还可以封装*运算符*，使得对该类实例的操作变得容易。你可以使用这些运算符对类对象执行诸如赋值或加法的操作，就像你在第\
  \ 5 节](#ch05.html_ch05)“表达式、语句和运算符”中对整数的操作一样。就像函数一样，运算符也可以被重载。在这节课程中，你学习了：\n\n-\
  \ 使用 `operator` 关键字\n- 元运算符和二元运算符\n- 转换运算符\n- 移动赋值运算符\n- 不能重定义的运算符\n\n### C++ 中的运算符是什么？\n\
  \n在语法上，运算符与函数之间没有太大区别，在于使用了 `operator` 关键字。运算符的声明看起来与函数非常相似：\n\n点击此处查看代码图片\n\n```\n\
  return_type operator operator_symbol (...parameter list...);\n```\n\n\n\n\n在此例中，`operator_symbol`\
  \ 可以是程序员定义的几种操作符类型之一。它可以是 `+`（加法）或 `&&`（逻辑与）等。操作数帮助编译器区分不同的操作符。那么，既然 C++ 也支持函数，为什么还要提供操作符呢？\n\
  \n考虑一个封装了日、月、年的的工具类 `Date`：\n\n点击此处查看代码图像\n\n```cpp\nDate holiday (12, 25, 2016);\
  \  // 初始化为 2016 年 12 月 25 日\n```\n\n假设你想增加一天并让实例包含第二天——即 2016 年 12 月 26 日——以下两个选项中哪一个更直观？\n\
  \n![Image](img/square.jpg) 选项 1（使用递增运算符）：\n\n```cpp\n++ holiday;\n```\n\n![Image](img/square.jpg)\
  \ 选项 2（使用成员函数 `Increment()`）：\n\n点击此处查看代码图像\n\n```cpp\nholiday.Increment();  //\
  \ 2016 年 12 月 26 日\n```\n\n显然，选项 1 的得分优于 `Increment()` 方法。基于操作符的机制通过提供易用性和直观性方便了使用。在\
  \ `Date` 类中实现操作符（`<`）可以帮助你像这样比较两个 `class Date` 实例：\n\n点击此处查看代码图像\n\n```cpp\nif(date1\
  \ < date2)\n{\n    // 执行某些操作\n}\nelse\n{\n    // 执行其他操作\n}\n```\n\n操作符的使用场景不仅限于管理日期的类。在第\
  \ 9 节的列表 9.9“类与对象”中的字符串工具类 `MyString` 中，加法运算符（`+`）可以方便字符串的拼接：\n\n点击此处查看代码图像\n\n\
  ```cpp\nMyString sayHello (\"Hello \");\nMyString sayWorld (\" world\");\nMyString\
  \ sumThem (sayHello + sayWorld); // 如果 MyString\n// 支持 operator+ 的\n```\n\n***\n\
  \n注意\n实现相关操作符的努力将通过该类易于使用的特性获得回报。\n\n***\n\n在宏观上，C++ 中的操作符可以分为两类：一元操作符和二操作运算符。\n\
  \n### 一元操作符\n\n顾其实名，作用于单个操作数的运算符称为一元操作符。在全局命名空间中或作为类的静态成员函数实现的一元操作符使用以下结构：\n\n点击此处查看代码图像\n\
  \n```cpp\nreturn_type operator operator_type (parameter_type)\n{\n    // ... 实现\n\
  }\n```\n\n作为类的（非静态）成员的一元操作符具有类似的结构，但缺少参数，因为它作用的单一参数是类实例本身（`*this`）：\n\n点击此处查看代码图像\n\
  \n```cpp\nreturn_type operator operator_type ()\n{\n    // ... 实现\n}\n```\n\n####\
  \ 一元操作符的类型\n\n可以重载（或重定义）的一元操作符如表 12.1\n\n**表 12.1** 一元操作符\n\n#### 一元递增/递减运算符\n\n\
  在类声明内部可以使用以下语法编写一元前置递增运算符（`++`）：\n\n点击此处查看代码图像\n\n```cpp\n// 一元递增运算符（前置）\nDate&\
  \ operator ++ ()\n{\n    // 操作符实现代码\n    return *this;\n}\n```\n\n另一方面，后置递增运算符（`++`）具有不同的返回值和一个输入参数（该参数并不总是使用）：\n\
  \n点击此处查看代码图像\n\n```cpp\nDate operator ++ (int)\n{\n    // 在增加日期前，存储对象当前状态的副本\n \
  \   Date copy (*this);\n    // 增加实现代码\n    // 返回增加之前的状态（因为是后置）\n    return copy;\n\
  }\n```\n\n前置和后置递减运算符的语法与递增运算符相似，只是在声明中，看到 `++` 的地方要写 `--`。列表 12.1\n\n```cpp\n0:\
  \ #include <iostream>\n1: using namespace std;\n2: \n3: Date\n4: {\n5: private:\n\
  6:     int day, month, year;\n7: \n8: public:\n9:     Date (int inMonth, int inDay,\
  \ int inYear)\n10:        month (inMonth), day(inDay), year (inYear) {};\n11: \n\
  12:     Date& operator ++ () // 前置递增\n13:     {\n14:         ++day;\n15:       \
  \  return *this;\n16:     }\n17: \n18:     Date& operator -- () // 前置递减\n19:   \
  \  {\n20:         --day;\n21:         return *this;\n22:     }\n23: \n24:     void\
  \ DisplayDate()\n25:     {\n26:         cout << month << \" / \" << day << \" /\
  \ \" << year << endl;\n27:     }\n28: };\n29: \n30: int main ()\n31: {\n32:    \
  \ Date holiday (12, 25, 2016); // 2016 年 12 月 25 日\n33: \n34:     cout << \"The\
