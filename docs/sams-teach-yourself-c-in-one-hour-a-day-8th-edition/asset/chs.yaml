  \     }\n18: };\n19:\n20: class Tuna: public Fish\n21: {\n22: public:\n23:     void\
  \ Swim()\n24:     {\n25:         cout << \"Tuna swims real fast\" << endl;\n26:\
  \     }\n27: };\n28:\n29: int main()\n30: {\n31:     tuna myDinner;\n32:\n33:  \
  \   cout << \"About my food\" << endl;\n34:\n35:     // myDinner.Swim(false);//failure:\
  \ Tuna::Swim() 隐藏了 Fish::Swim(bool)\n36:     myDinner.Swim();\n37:\n38:     return\
  \ 0;\n39: }\n```\n\nOutput ![Image](img/arrow.jpg)\n\n点击此处查看代码图片\n\n关于我的食物\n金鱼游得真快\n\
  \n### 分析\n![Image](img/arrow.jpg)\n\n此版本的 `class Fish` 与之前看到的有所不同。除了是解释问题的简化版本外，`Fish`\
  \ 版本包含了两个重载的 `Swim()` 方法：一个不带参数（如第 6–9 行所示），另一个接受 `bool` 参数（如第 11–17 行所示）。由于 `Tuna`\
  \ 如第 20 行所示从 `Fish` 继承 `public`，期望通过 `class Tuna` 实例可以使用两个版本的 `Fish::Swim()` 方法并不是错误的。然而，`Tuna`\
  \ 实现自己的 `Tuna::Swim()`（如第 23–26 行所示）会导致编译器隐藏 `Fish::Swim(bool)`。如果你取消第 35 行的注释，就会看到编译失败。\n\
  \n因此，如果你想通过 `Tuna` 实例调用 `Fish::Swim(bool)` 函数，你有以下解决方案：\n\n![Image](img/arrow.jpg)\
  \ 解决方案 1：在 `main()` 中使用作用域解析符：\n\n```cpp\nmyDinner.Fish::Swim();\n```\n\n![Image](img/arrow.jpg)\
  \ 解决方案 2：在 `class Tuna` 中使用 `using` 关键字来取消 `class Fish` 中 `Swim()` 的隐藏：\n\n点击此处查看代码图片\n\
  \n```cpp\nclass Tuna: public Fish\n{\npublic:\n    using Fish::Swim;  // 取消 Fish\
  \ 类中所有 Swim() 方法的隐藏\n    void Swim()\n    {\n        cout << \"Tuna swims real fast\"\
  \ << endl;\n    }\n};\n```\n\n![Image](img/square.jpg) 解决方案 3：在 `class Tuna` 中重写所有重载的\
  \ `Swim()` 变体（如果你需要，调用 `Fish::Swim(...)` 方法）：\n\n点击此处查看代码图片\n\n```cpp\nclass Tuna:\
  \ public Fish\n{\npublic:\n    void Swim(bool isFreshWaterFish)\n    {\n       \
  \ Fish::Swim(isFreshWaterFish);\n    }\n    void Swim()\n    {\n        cout <<\
  \ \"Tuna swims real fast\" << endl;\n    }\n};\n```\n\n#### 构造顺序\n\n\n\n\n那么，当你创建一个派生自\
  \ `class Fish` 的 `class Tuna` 对象时，`Tuna` 的构造函数是在 `Fish` 类构造函数之前还是之后被调用的？此外，在类层次结构中的对象实例化过程中，像\
  \ `Fish::isFreshWaterFish` 这样的成员属性其各自顺序怎样的？幸运的是，实例化序列是标准化的。基类对象在派生类之前实例化。因此，`Tuna`\
  \ 的 `Fish` 部分首先构造，这样成员属性——尤其是 `class Fish` 中包含的受保护和公有属性——在 `class Tuna` 实例化时就已经准备就绪供其使用。在\
  \ `class Fish` 和 `class Tuna` 的实例化过程中，成员属性（如 `Fish::isFreshWaterFish`）在构造函数 `Fish::Fish()`\
  \ 被调用之前实例化，确保了成员属性在构造函数处理它们之前已经准备就绪。这同样适用于 `Tuna::Tuna()`。\n\n## 析构顺序\n\n当 `Tuna`\
  \ 的实例离开作用域时，析构顺序与构造顺序相反。列表 10.7 是一个展示构造和析构顺序的简单示例。\n\n**列表 10.7** 基类、派生类及其成员的构造与析构顺序\n\
  \n点击此处查看代码图像\n\n* *\n\n```cpp\n0: #include <iostream>\n1: using namespace std;\n\
  2:\n3: class FishDummyMember\n4: {\n5: public:\n6:     FishDummyMember()\n7:   \
  \  {\n8:         cout << \"FishDummyMember constructor\" << endl;\n9:     }\n10:\n\
  11:     ~FishDummyMember()\n12:     {\n13:         cout << \"FishDummyMember destructor\"\
  \ << endl;\n14:     }\n15: };\n16:\n17: class Fish\n18: {\n19: protected:\n20: \
  \    FishDummyMember dummy;\n21:\n22: public:\n23:     // Fish constructor\n24:\
  \     Fish()\n25:     {\n26:         cout << \"Fish constructor” << endl;\n27: \
  \    }\n28:\n29:     ~Fish()\n30:     {\n31:         cout << \"Fish destructor\"\
  \ << endl;\n32:     }\n33: };\n34:\n35: class TunaDummyMember\n36: {\n37: public:\n\
  38:     TunaDummyMember()\n39:     {\n40:         cout << \"TunaDummyMember constructor\"\
  \ << endl;\n41:     }\n42:\n43:     ~TunaDummyMember()\n44:     {\n45:         cout\
  \ << \"TunaDummyMember destructor\" << endl;\n46:     }\n47: };\n48:\n49:\n50: class\
  \ Tuna: public Fish\n51: {\n52: private:\n53:     TunaDummyMember dummy;\n54:\n\
  55: public:\n56:     Tuna()\n57:     {\n58:         cout << \"Tuna constructor\"\
  \ << endl;\n59:     }\n60:     ~Tuna()\n61:     {\n62:         cout << \"Tuna destructor\"\
  \ << endl;\n63:     }\n64:\n65: };\n66:\n67: int main()\n68: {\n69:     Tuna myDinner;\n\
  70: }\n```\n* *\n\n输出 ![Image](img/arrow.jpg)\n点击此处查看代码图像\nFishDummyMember constructor\n\
  Fish constructor\nTunaDummyMember constructor\nTuna constructor\nTuna destructor\n\
  TunaDummyMember destructor\nFish destructor\n\n为了理解成员变量是如何实例化和析构的，你定义了两个虚拟类 `FishDummyMember`\
  \ 和 `unaDummyMember`，并在它们的构造函数和析构函数使用了 `cout`。输出表明，当实例化 `class Tuna` 的对象时，实例化实际上是从层次结构的顶部开始的。因此，`class\
  \ Tuna` 的 `class Fish` 部分首先实例化，在此过程中，`Fish` 的成员——即 `Fish::dummy`——首先实例化。接着是构造函数\
  \ `Fish`，它理所当然地在 `dummy` 等成员属性构造完成后执行。基类构造完成后，`Tuna` 的实例化继续实例化 `Tuna::dummy`，最后执行构造函数\
  \ `Tuna::Tuna()`。如第 67–70 行所示，`main()` 函数相对于其生成的输出量来说非常短。输出证明了析构顺序恰恰相反的。\n\n## 私有继承\n\
  \n私有继承与公有继承（你目前所看到的这种）的区别在于，在派生类声明其从基类继承的行中使用了关键字 `private`：\n\n点击此处查看代码图像\n\n```cpp\n\
  class Base\n{\n    // ... 基类成员和方法\n};\n\nclass Derived: private Base\n{\n    //\
  \ ... 派生类成员和方法\n};\n```\n\n对基类进行私有继承，意味着基类的所有公 public 成员和属性对于任何拥有派生类实例的人来说都是私有的（即不可访问的）。对于派生类实例来说，基类的公有成员和属性都是私有的（不可访问的）。由于私有继承，基类的公有成员在派生类中变为私有成员，基类的受保护成员在派生类中变为私有成员。这意味着，派生类的实例无法直接访问基类的公有或受保护成员。但是，派生类的成员函数仍然可以访问基类的私有成员。\n\
  \n如果你尝试在 `main()` 中执行以下代码：\n\n点击此处查看代码图像\n\nmyDreamCar.PumpFuel(); // 无法访问基类的公共成员\n\
  \n这会导致编译失败，错误信息类似于 `error C2247: Motor::PumpFuel 不可访问，因为 'Car' 使用 'private' 继承自\
  \ 'Motor'`。私有继承允许基类的公有成员和方法仅供派生类内部使用，而对于拥有 `Fish` 实例（an instance of Fish）的人不可访问。由于私有继承，这种关系被称为“有一个”（has-a）关系。在日常生活中可以看到一些私有继承的例子，参见表格\
  \ 10.2。\n\n![Image](img/10tab02.jpg)\n\n**表格 10.2** 日生活中的私有继承示例\n\n让我们视觉化汽车与其引擎之间的私有继承关系。参见列表\
  \ 10.8。\n\n```cpp\n0: #include <iostream>\n1: using namespace std;\n2:\n3: class\
  \ Motor\n4: {\n5: public:\n6:     void SwitchIgnition()\n7:     {\n8:         cout\
  \ << \"Ignition ON\" << endl;\n9:     }\n10:\n11:     void PumpFuel()\n12:     {\n\
  13:         cout << \"Fuel in cylinders\" << endl;\n14:     }\n15:     void FireCylinders()\n\
  16:     {\n17:         cout << \"Vroooom\" << endl;\n18:     }\n19: };\n20:\n21:\
  \ class Car:private Motor\n22: {\n23: public:\n24:     void Move()\n25:     {\n\
  26:         SwitchIgnition();\n27:         PumpFuel();\n28:         FireCylinders();\n\
  29:     }\n30: };\n31:\n32: int main()\n33: {\n34:     Car myDreamCar;\n35:    \
  \ myDreamCar.Move();\n36:\n37:     return 0;\n38: }\n```\n* *\n\n分析 ![Image](img/arrow.jpg)\n\
  \n\n\n\n如果另一个 `class RaceCar` 继承自 `Car`，那么无论 `RaceCar` 和 `Car` 之间的继承性质如何，`RaceCar`\
  \ 都无法访问基类 `Motor` 的任何公有成员或函数。这是因为 `Car` 和 `Motor` 之间的关系是 `private` 继承，这意味着在使用 `Car`\
  \ 的实例时，除 `Car` 之外的所有实体对 `Base` 的 `public` 和 `protected` 成员都只有 `private` 权限（即无权限）。\n\
  \n换句话说，在编译器计算一个类是否应该访问基类的 `public` 或 `protected` 成员时，限制性最大的访问说明符占据主导地位。\n\n***\n\
  \n### 保护继承\n\n保护继承与公共继承的区别在于，在派生类声明继承基类的行中使用点击此处查看代码图片：\n\n```cpp\nclass Base\n\
  {\n   // ... 基类成员和方法\n};\n\nclass Derived: protected Base     // 保护继承\n{\n   //\
  \ ... 派生类成员和方法\n};\n```\n\n保护继承在以下方面与私继承相似：\n\n![Image](img/square.jpg) 它也表示一种“拥有”（has-a）的关系。\n\
  \n![Image](img/square.jpg) 它还允许派生类访问 `Base` 的所有 `public` 和 `protected` 成员。\n\n![Image](img/square.jpg)\
  \ 使用 `Derived` 实例的继承体系之外的实体无法访问 `Base` 的公有成员。\n\n然而，涉及到被继承的派生类时，保护继承又有些不同：\n\n点击此处查看代码图片\n\
  \n```cpp\nclass Derived2: protected Derived\n{\n   // 可以访问 Base 的 public & protected\
  \ 成员\n};\n```\n\n保护继承体系允许派生类的派生类（即 `Derived2`）访问 `Base` 的 `public` 和 `protected`\
  \ 成员，如列表 10.9 所示。如果 `Derived` 和 `Base` 之间的继承是 `private` 的，这将是不可能的。\n\n**列表 10.9**\
  \ `class RaceCar` 继承自 `class Car`，`class Car` 继承自 `class Motor`，并使用了 `protected`\
  \ 继承\n\n点击此处查看代码图片\n\n```cpp\n0: #include <iostream>\n1: using namespace std;\n\
  2:\n3: class Motor\n4: {\n5: public:\n6:     void SwitchIgnition()\n7:     {\n8:\
  \         cout << \"Ignition ON\" << endl;\n9:     }\n10:     void PumpFuel()\n\
  11:     {\n12:         cout << \"Fuel in cylinders\" << endl;\n13:     }\n14:  \
  \   void FireCylinders()\n15:     {\n16:         cout << \"Vroooom\" << endl;\n\
  17:     }\n18: };\n19:\n20: class Car:protected Motor\n21: {\n22: public:\n23: \
  \    void Move()\n24:     {\n25:         SwitchIgnition();\n26:         PumpFuel();\n\
  27:         FireCylinders();\n28:     }\n29: };\n30:\n31: class RaceCar:protected\
  \ Car\n32: {\n33: public:\n34:     void Move()\n35:     {\n36:         SwitchIgnition();\
  \  // RaceCar 有权访问基类 Motor 的成员\n37:         PumpFuel();  // 由于 \"protected\" 继承\n\
  38:         FireCylinders(); // 由于于 RaceCar & Car, Car & Motor 之间的继承\n39:      \
  \   FireCylinders();\n40:         FireCylinders();\n41:     }\n42: };\n43:\n44:\
  \ int main()\n45: {\n46:     RaceCar myDreamCar;\n47:     myDreamCar.Move();\n48:\n\
  49:     return 0;\n50: }\n```\n\n输出 ![Image](img/arrow.jpg)\n\n点击此处查看代码图片\n\n```\n\
  Ignition ON\nFuel in cylinders\nVroooom\nVroooom\nVroooom\n```\n\n分析 ![Image](img/arrow.jpg)\n\
  \n如第 20 行所示，`class Car` 使用 `protected` 继承自 `Motor`。如第 31 行所示，`class RaceCar` 使用\
  \ `protected` 继承自 `class Car`。如所见，尽管 `Car` 和 `Motor` 之间的继承不是公共的，但 `class Car` 的实现允许\
  \ `RaceCar` 访问 `Motor` 的方法。\n\n\n\n\n\nListing 10.10 展示了 `Platypus` 多重继承的一种实现。\n\
  \n**列表 10.10** 使用多重继承建模一个既是哺乳动物又是鸟类又是爬行动动物的鸭嘴兽\n\n点击此处查看代码图像\n\n***\n\n```cpp\n\
  0: #include <iostream>\n1: using namespace std;\n2:\n3: class Mammal\n4: {\n5: public:\n\
  6:     void FeedBabyMilk()\n7:     {\n8:         cout << \"Mammal: Baby says glug!\"\
  \ << endl;\n9:     }\n10: };\n11:\n12: class Reptile\n13: {\n14: public:\n15:  \
  \   void SpitVenom()\n16:     {\n17:         cout << \"Reptile: Shoo enemy! Spits\
  \ venom!\" << endl;\n18:     }\n19: };\n20:\n21: class Bird\n22: {\n23: public:\n\
  24:     void LayEggs()\n25:     {\n26:         cout << \"Bird: Laid my eggs, am\
  \ lighter now!\" << endl;\n27:     }\n28: };\n29:\n30: class Platypus: public Mammal,\
  \ public Bird, public Reptile\n31: {\n32: public:\n33:     void Swim()\n34:    \
  \ {\n35:         cout << \"Platypus: Voila, I can swim!\" << endl;\n36:     }\n\
  37: };\n38:\n39: int main()\n40: {\n41:     Platypus realFreak;\n42:     realFreak.LayEggs();\n\
  43:     realFreak.FeedBabyMilk();\n44:     realFreak.SpitVenom();\n45:     realFreak.Swim();\n\
  46:\n47:     return 0;\n48: }\n```\n\n***\n\nOutput ![Image](img/arrow.jpg)\n\n\
  点击此处查看代码图像\n\nBird: Laid my eggs, am lighter now!\nMammal: Baby says glug!\nReptile:\
  \ Shoo enemy! Spits venom!\nPlatypus: Voila, I can swim!\n\n### 分析 ![Image](img/arrow.jpg)\n\
  \n`class Platypus` 在第 30–37 行中定义得非常紧凑。它本质上只是继承了 `Mammal`、`Reptile` 和 `Bird` 三个类。第\
  \ 41–44 行中的 `main()` 函数能够通过一个名为 `realFreak` 的派生类 `class Platypus` 对象来调用这三个独立基类的特征。除了调用继承自\
  \ `Mammal`、`Bird` 和 `Reptile` 类的函数外，`main()` 在第 45 行调用了 `Platypus::Swim()`。该程序演示了多重继承的语法，并展示了派生类如何暴露其多个基类的所有公共属性（在本例中为公共成员函数）。\n\
  \n### 使用 `final` 避免继承\n\n从 C++11 开始，编译器支持限定符 `final`。它被用于确保声明为 `final` 的类不能作为基类使用。例如，在列表\
  \ 10.10 中`class Platypus` 代表一个演化良好的物种。因此，你可能希望确保该类是 `final` 的，从而阻止所有继承它的可能性。一个从列表\
  \ 10.10 中取自并声明为 `final` 的 `class Platypus` 版本如下：\n\n点击此处查看代码图像\n\n```cpp\nclass\
  \ Platypus final: public Mammal, public Bird, public Reptile\n{\npublic:\n    void\
  \ Swim() // 注意：原文省略了函数体，但根据上下文可以推断\n    {\n        cout << \"Platypus: Voila, I\
  \ can swim!\" << endl;\n    }\n};\n```\n\n除了调用继承自 `Mammal`、`Bird` 和 `Reptile` 类的函数外，`main()`\
  \ 在第 45 行调用了 `Platypus::Swim()`。（注：提供的源文本在末尾变得碎片化，但逻辑遵循标准继承）。\n\n*注：原文的后半部分包含大量的重复和碎片化。我已经清理了冗余的语言痕迹，同时保留了提供的核心技术概念。*\n\
  \n### 总结\n\n在本节中，你学习了 C++ 继承的基础知识。你学习了公共继承是一种“是一个（is-a）”的关系，而 `private` 和 `protected`\
  \ 继承创建了“包含一个（has-a）”的关系。你看到了了 `final` 防止继承的应用。你学习了重写方法以及通过 `using` 关键字隐藏它们。\n\n\
