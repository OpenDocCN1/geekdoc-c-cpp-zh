  \ `pointsToInt` 指向的整数。由于 `pointsToInt` 中包含的地址在第 20 行发生了变化，同一个指针访问了变量 `dogsAge`。\n\
  \n当使用解引用运算符（`*`）时，它从指针所含地址中获取值。由于在第 11 行你初始化了指针，这确保了地址是有效的。正如列表 8.4 演示的那样，解引用运算符（`*`）也被称为间接运算符。\n\
  \n你通过列表 8.5 使用指针来获取指向内存的值。\n\n## 列表 8.5 使用指针和解引用运算符操作数据\n\n点击此处查看代码图像\n\n```cpp\n\
