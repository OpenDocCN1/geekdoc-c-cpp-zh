  \n***\n\n#### 在 `multimap` 中查找元素\n如果 Listing 20.3 是一个 `multimap`，则容器可能包含具有相同键的多个对，你需要找到对应于重复键的值。因此，在\
  \ `multiset` 的情况下，你会使用 `multiset::count()` 来查找对应于键的值的数量，并递增迭代器以访问这些存储的值。\n\n点击此处查看代码图片\n\
  \n```cpp\nauto pairFound = mapIntToStr.find(key);\n// Check if find() succeeded\n\
  if(pairFound != mapIntToStr.end())\n{\n    // Find the number of pairs that have\
  \ the same key\n    size_t numPairsInMap = mapIntToStr.count(1000);\n    for(size_t\
  \ counter = 0; counter < numPairsInMap; ++ counter )\n    {\n        // stay within\
  \ bounds\n        cout << \"Key: \" << pairFound->first << \"] = \" << pairFound->second\
  \ << endl;\n    }\n}\nelse\n    cout << \"Element not found\";\n```\n\n删除元素\n`map`\
  \ 和 `multimap` 都有一个成员函数 `erase()`，它可以删除容器中的元素。通过键调用 `erase()` 来删除元素：`mapObject.erase(key);`。通过迭代器来删除特定的元素：`mapObject.erase(element);`。你可以使用迭代器来删除\
  \ `map` 或 `multimap` 中的范围元素：`mapObject.erase(lowerBound, upperBound);` Listing 20.4\
  \ 演示了 `erase()` 函数的用法。\n\n**列表 20.4** 从 `multimap` 中删除元素\n\n点击此处查看代码图片\n\n```cpp\n\
