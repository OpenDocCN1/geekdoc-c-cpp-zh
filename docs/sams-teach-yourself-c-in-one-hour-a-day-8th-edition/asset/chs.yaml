  \ `public` 继承。本节将从公有继承开始，以理解继承的概念以及最常见的继承形式，然后再介绍 `private` 或 `protected` 继承。\n\n\
  为了方便理解这一概念，请想象一个基类 `class Bird`（鸟）。派生自 `Bird` 的类有 `class Crow`（乌鸦）、`class Parrot`（鹦鹉）或\
  \ `class Kiwi`（奇异鸟）。`class Bird` 会定义鸟最基本的属性，例如“有羽毛”、“有翅膀”、“产蛋”、“会飞”等。`Crow`、`Parrot`\
  \ 或 `Kiwi` 等派生类继承了这些属性并对其进行了自定义（例如，一个代表不会飞的鸟的 `class Kiwi` 将不包含 `Fly()` 方法的实现）。表\
  \ 10.1 展示了更多关于继承的示例。\n\n![Image](img/10tab01.jpg)\n\n**表 10.1** 取自日常生活的公有继承示例\n\n\
  这些示例表明，当你戴上面向对象编程的眼镜时，你会在周围的许多对象中看到继承的例子。`Fish`（鱼）是 `Tuna`（金枪鱼）的基类，因为 `Tuna` 和 `Carp`（鲤鱼）都是\
  \ `Fish`，并且具有所有鱼类的特征，如冷血。然而，`Tuna` 与 `Carp` 在外观、游泳方式以及它是海水鱼这一点上有所不同。因此，`Tuna` 和\
  \ `Carp` 从共同的基类 `Fish` 继承共同特征，但通过特化基类属性来区分彼此。这在图 10.2 中所示。\n\n![Image](img/10fig02.jpg)\n\
  \n**图 10.2** 金枪鱼、鲤鱼和鱼之间的层次关系。\n\n鸭嘴兽游泳，但它是一种特殊的动物，具有哺乳动物特征（如用牛奶喂养幼崽）、鸟类特征（因为它产蛋）以及爬行动物特征（因为它有毒）。因此，可以想象一个\
  \ `class Platypus`（鸭嘴兽）继承自两个基类 `class Mammal` 和 `class Bird`，以继承哺乳动物和鸟类的特征。这种继承形式被称为多继承，将在本节稍后进行讨论。\n\
  \n### C++ 派生语法\n\n你如何从 `class Fish` 继承 `class Carp`，或者通地从 `class Base` 继承 `class\
  \ Derived`？C++ 实现此语法如下：\n\n点击此处查看代码图片\n\n```cpp\nclass Base\n{\n   // ... 基类成员\n\
  };\n\nclass Derived: access-specifier Base\n{\n   // ... 派生类成员\n};\n```\n\n`access-specifier`（访问修饰符）可以是以下之一：`public`（最常用），表示“派生类是一个基类”的关系；`private`\
  \ 或 `protected` 则表示“派生类有一个基类”的关系。\n\n派生自 `class Fish` 的 `class Carp` 的继承层次表示如下：\n\
  \n点击此处查看代码图片\n\n```cpp\nclass Fish // 基类\n{\n   // ... Fish 的成员\n};\n\nclass Carp:public\
  \ Fish // 派生类\n{\n   // ... Carp 的成员\n};\n```\n\n派生自 `class Fish` 的 `class Carp`\
  \ 和 `class Tuna` 的可编译声明如列表 10.1 所示。\n\n### 关于术语的说明\n\n在阅读继承的内容时，你会遇到如 *inherits\
  \ from*（继承自）或 *derives from*（派生自）等术语，它们的本质相同。\n\n同样，基类也被称为 `super class`（超类）。派生自基类的类也称为\
  \ `derived class`（派生类），也可以称为 `subclass`（子类）。\n\n**列表 10.1** 鱼类世界展示的简单继承层次\n\n点击此处查看代码图片\n\
