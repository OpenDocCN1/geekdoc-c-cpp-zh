  \ word longer than 20:\nThisIsAVeryLongWordThatExceeds\nLength of your input was:\
  \ 19\n\n***\n\n### 注意\n用 C 语言编写（或由具有深厚 C 背景的程序员用 C++ 编写）的应用程序通常使用 `strcpy()`、`strcat()`\
  \ 和 `strlen()` 等字符串函数来确定字符串长度。这些函数以 C 风格字符串作为输入，如果程序员没有确保终止空，就会越数组边界。\n\n### C++\
  \ 字符串：使用 `std::string`\nC++ 标准字符串是处理文本输入更高效、更安全的方法——以及执行拼接等字符串操作。`std::string` 的大小不像\
  \ C 风格的字符数组实现那样是静态的，当需要存储更多数据时，它可以扩展。使用 `std::string` 操作字符串数据见 Listing 4.7。\n\n\
  **Listing 4.7** 使用 `std::string` 初始化、存储用户输入、拷贝、拼接和确定字符串长度\n\n```cpp\n0: #include\
