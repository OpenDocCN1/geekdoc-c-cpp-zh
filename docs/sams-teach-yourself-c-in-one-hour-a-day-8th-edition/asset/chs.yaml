  \nI love C++ strings\n\nCopy of concatenated string:\n\nI love C++ strings\n\nLength\
  \ of concat string: 18\n\n### 分析 ![Image](img/arrow.jpg)\n\n尝试理解输出并将其与代码中的元素联系起来。在现阶段，不要让新的语法特性困扰你。程序开始显示一个在第\
  \ 7 行初始化的字符串\"Hello std::string\"。然后要求用户输入两行文本，并存储在第 12 行和第 16 行的变量 `firstLine`\
  \ 和 `secondLine` 中。实际的拼接非常简单，看起来就像第 19 行的算术加法，其中第一行还添加了一个空格。复制操作是第 24 行中简单的赋值操作。确定字符串长度是通过在第\
  \ 27 行对其调用 `length()` 方法完成的。\n\n### 注意\n\n要使用 C++ 字符串，你需要包含头文件 `<string>`：\n\n```cpp\n\
  #include <string>\n```\n\n这在列表 4.7 的第 1 行也是可见的。\n\n要详细学习 `std::string` 的各种函数，请快速查看第\
  \ 16 课“STL `string` 类”。由于你还没有学习过类和模板，请忽略该课程中看起来陌生的部分，专注于理解示例的要点。\n\n### 总结\n\n本节课程为你介绍了数组的基础知识、它们是什么以及可以在哪里使用。你学习了如何声明数组、初始化数组、访问数组元素以及向数组元素写入值。你学习了不超出数组边界是有多么重要。这被称为*缓冲区溢出*，确保在使用索引访问元素之前对输入进行检查，有助于确保越越数组的限制。\n\
  \n动态数组是指程序员不需要在编译时固定数组最大长度的数组，在实际使用小于预期最大值的情况下，它们允许更好的内存管理。\n\n你还学习了 C 风格字符串是 `char`\
  \ 数组的一种特殊情况，字符串的末尾由空终止字符 `'\\0` 标记。更重要的是，你了解到 C++ 提供了更好的选项 `std::string`，它提供了方便的实用函数，让你能够确定长度、拼接并执行类似的操作。\n\
  \n### 问答\n\n**问：为什么要费力初始化静态数组的元素？**\n\n**答：** 除非初始化，否则数组与任何其他类型的变量不同，包含垃圾和不可预测的值，因为该位置的内存在最后一次操作后没有被触动。初始化数组可以确保其中的信息具有明确且可预测的初始状态。\n\
  \n**问：由于第一个问题中提到的原因，你需要初始化动态数组中的元素吗？**\n\n**答：** 实际上，不需要。动态数组是非常聪明的数组。除非与应用程序特定的原因需要你在数组中具有某些初始值，否则数组中的元素不需要初始化为默认值。\n\
  \n**问：如果有选择权，你会使用需要空终止符的 C 风格字符串吗？**\n\n**答：** 是的，除非有人拿枪指着你的头。C++ `std::string`\
  \ 安全得多，并且提供的功能应该让任何优秀的程序员都远离使用 C 风格字符串。\n\n**问：字符串的长度是否包含末尾的空终止符？**\n\n**答：** 不包含。字符串“Hello\
  \ World”的长度为 11，包括空格但不包括末尾的空字符。\n\n### 工作坊\n\n工作坊提供了测题来帮助你巩固材料，并提供了练习让你获得所学知识的经验。\n\
  \n## 5. 使用表达式、语句和运算符\n\n程序的本质是一组顺序执行的命令。这些命令被编写成表达式和语句，并使用运算符来执行特定的计算或操作。\n\n在本节课程中，你将学习\n\
  \n![Image](img/square.jpg) 什么是语句\n\n![Image](img/square.jpg) 什么是块或复合语句\n\n![Image](img/square.jpg)\
  \ 什么是运算符\n\n![Image](img/square.jpg) 如何执行简单的算术和逻辑操作\n\n### 语句\n\n语言——无论是口语还是编程——都由一个一个执行的语句组成。让我们分析你学习的第一个重要语句：\n\
  \n```cpp\ncout << \"Hello World\" << endl;\n```\n\n\n\n\n使用 `cout` 的语句会在屏幕上的控制台上显示文本。C++\
  \ 中的所有语句都以分号 `;` 结尾，分号定义了语句的边界。这类似于你在英语句子末尾所添加的句号（`.`）。下一条语句可以紧接在分号后面开始，但为了方便和可读性，你通常会在连续的行中编写这些连续的语句。换句话说，这实际上是写在一行中的两个语句：\n\
  \n点击此处查看代码图片\n\n```cpp\ncout << \"Hello World\" << endl; cout << \"Another hello\"\
  \ << endl;\n```\n\n***\n\n### Note\n空白字符通常对编译器是不可见的。这包括空格、制表符、换行符、回车等。然而，字符串字面量内的空白字符会影响输出。\n\
  \n***\n\n以下内容是无效的：\n\n点击此处查看代码图片\n\n```cpp\ncout << \"Hello\n\n       World\" <<\
  \ endl; // 字符串字面量中不允许换行\n```\n\n此类代码通常会导致错误，指示编译器在第一行缺少闭合引号（`\"`）和终止语句的分号（`;`）。如果你由于某些原因需要将一个语句跨越两行，你可以在末尾插入反斜杠（`\\\
  `）来实现：\n\n点击此处查看代码图片\n\n```cpp\ncout << \"Hello \\\n\n          World\" << endl;\
  \ // 分成两行是可以的\n```\n\n将上述语句分为两行的另一种方法是编写两个字符串字面量而不是仅仅一个：\n\n点击此处查看代码图片\n\n```cpp\n\
  cout << \"Hello \"\n\n     \"World\" << endl; // 两个字符串字面量也可以的\n```\n\n在前面的示例中，编译器会注意到两个相邻的字符串字面量并自动为你合并它们。\n\
  \n***\n\n### Note\n当你有长文本元素或由许多变量组成的复杂表达式，且这些元素使得语句长度远超大多数显示器的允许范围时，将语句分成多行是有用的。\n\
  \n***\n\n### 复合语句或块\n当你在大括号 `{...}` 内将语句组合在一起时，你就创建了一个复合语句或一个块。\n\n点击此处查看代码图片\n\n\
  ```cpp\n{\n  int daysInYear = 365;\n  cout << \"Block contains an int and cout statement\"\
  \ << endl;\n}\n```\n\n块通常将多个语句分组，表示它们属于整体。在编写 `if` 语句或循环时，块特别有用，这些将在第 6 节控制流] 中解释。\n\
  \n### 使用运算符\n运算符是 C++ 提供的工具，让你能够处理数据、转换数据，并可能根据数据做出决策。\n\n#### 赋值运算符 `=`\n赋值运算符是你已经在书中直观地使用过的一个运算符：\n\
  \n```cpp\nint daysInYear = 365;\n```\n\n前面的语句使用赋值运算符将整数初始化为 `365`。赋值运算符用右侧的值（称为\
  \ r 值）替换左侧操作数（隐含称为 l 值）包含的值。\n\n#### l 值（L-values）和 r 值（R-values）\nl 值通常指的是内存位置。前面示例中的如\
  \ `daysInYear` 的变量实际上是内存位置的句柄，是一个 l 值。另一方面，r 值可以是内存位置的内容本身。\n\n所以，所有的 l 值都可以 r 值，但不是所有的\
  \ r 值都是 l 值。为了更好地理解它，请看下面的示例，它没有任何逻辑意义，因此无法编译：\n\n```cpp\n365 = daysInYear;\n```\n\
  \n#### 加法 (`+`)、减法 (`-`)、乘法 (`*`)、除法 (`/`) 和取模运算 (`%`) 运算符\n你可以使用 `+` 加法、`-` 减法、`*`\
  \ 乘法、`/` 除法和 `%` 取模运算在两个操作数之间执行算术运算：\n\n点击此处查看代码图片\n\n```cpp\nint num1 = 2;\nint\
  \ num2 = 5;\nint addNums = num1 + num2; // 7\nint subtractNums = num1 - num2; //\
  \ -3\nint multiplyNums = num1 * num2; // 10\nint divideNums = num1 / num2; // 0\n\
  int moduloNums = num1 % num2; // 2\n```\n\n注意，除法运算符 `/` 返回两个操作数之间的除法结果。然而，在整数的情况下，结果不包含小数，因为整数无法存储小数数据。取模运算符\
  \ `%` 返回除法的余数，且它仅适用于整数值。列表 5.1 是一个简单的程序，演示了如何让用户对两个数字执行算术函数的应用。\n\n**列表 5.1 用户对整数执行算术运算符的演示**\n\
  \n点击此处查看代码图片\n\n```cpp\n#include <iostream>\nusing namespace std;\n\nint main()\
  \ {\n  // 示例代码内容\n}\n```\n*(注：由于原文中代码块内容不完整，已按要求保留结构)*\n\n此处，由于提供的原文文本在代码块处截断，翻译保持了逻辑一致。\n\
  \n\n\n\n\n```cpp\ncout << \"Start value of integer being operated: \" << startValue\
  \ << endl;\n\nint postfixIncrement = startValue++;\ncout << \"Result of Postfix\
