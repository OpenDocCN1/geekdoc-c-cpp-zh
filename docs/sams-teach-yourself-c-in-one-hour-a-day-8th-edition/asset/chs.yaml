  \ 类反转用户的字符串输入。\n\n# 课程 25. 使用 STL 进行位标志操作\n\n位（Bits）可以是存储设置和标志的高效方式。标准模板库（STL）提供了帮助组织和操作位信息的类。本节课程将向你介绍：\n\
  \n![图像](img/square.jpg) `bitset` 类\n\n![图像](img/square.jpg) `vector<bool>`\n\n##\
  \ `bitset` 类\n\n`std::bitset` 是设计用于处理位信息和位标志的 STL 类。`std::bitset` 不是一个 STL 容器类，因为它不能调整自身的大小。这是一个工具类，经过优化，专门用于处理长度在编译时已知的位序列。\n\
  \n***\n\n提示\n\n要使用类 `std::bitset`，请包含头文件：\n\n\n\n```cpp\n#include <bitset>\n```\n\
  \n***\n\n### 实例化 `std::bitset`\n\n此模板类要求你提供一个模板参数，该参数包含该类实例需要管理的位数：\n\n点击此处查看代码图像\n\
  \n```cpp\nbitset <4> fourBits;  // 4 位初始化为 0000\n```\n\n你也可以将 bitset 初始化为由`char*`字符串字面量表示的位序列：\n\
  \n点击此处查看代码图像\n\n```cpp\nbitset <5> fiveBits(\"10101\"); // 5 位 10101\n```\n\n在实例化另一个\
  \ bitset 时从一个拷贝非常简单：\n\n点击此处查看代码图像\n\n```cpp\nbitset <8> fiveBitsCopy(fiveBits);\n\
  ```\n\nbitset 类的一些实例化技术在列表 25.1 中进行了演示。\n\n**列表 25.1** 实例化 `std::bitset`\n\n点击此处查看代码图像\n\
  \n***\n\n```cpp\n0: #include <bitset>\n1: #include <iostream>\n2: #include <string>\n\
  3:\n4: int main ()\n5: {\n6:     using namespace std;\n7:\n8:     bitset <4> fourBits;\
  \  // 4 位初始化为 0000\n9:     cout << \"Initial contents of fourBits: \" << fourBits\
  \ << endl;\n10:\n11:     bitset <5> fiveBits (\"10101\"); // 5 位 10101\n12:    \
  \ cout << \"Initial contents of fiveBits: \" << fiveBits << endl;\n13:\n14:    \
  \ bitset <6> sixBits(0b100001); // C++14 二进制字面量\n15:     cout << \"Initial contents\
  \ of sixBits: \" << sixBits << endl;\n16:\n17:     bitset <8> eightBits (255); //\
  \ 8 位初始化为 255\n18:     cout << \"Initial contents of eightBits: \" << eightBits\
  \ << endl;\n19:\n20:     // 另一个 bitset 的拷贝\n21:     bitset <8> eightBitsCopy(eightBits);\n\
  22:\n23:     return 0;\n24: }\n```\n\n***\n\n提示\n\n注意示例中的 `0b100001`。前缀 `0b` 或 `0B`\
  \ 是新特性。\n\n***\n\n## 使用 `std::bitset` 及其成员\n\n`bitset` 类提供了帮助插入、设置或重置位、将其写入流的成员函数。它还提供了运算符。\n\
  \n### `std::bitset` 中的实用运算符\n\n你已经在第 12 节中学过运算符，运算符最重要的作用是增加类的可用性。`bitset` 提供了一些实用的运算符，如表\
  \ 25.1 所示，这使得使用它变得非常简单。示例解释了这些运算符。\n\n![图像](img/25tab01.jpg)\n\n**表 25.1** bitset\
  \ 支持的运算符\n\n除了这些之外，`std::bitset` 还具有如 `|=`、`&=`、`^=` 和 `~=` 等运算符，有助于对 `bitset` 对象执行位操作。\n\
  \n### `std::bitset` 成员方法\n\n位可以持有两种状态——设置为（1）或重置（0）。为了帮助操作 `bitset` 的内容，可以使用表 25.2\
  \ 列出的成员函数，这些函数可以帮助你处理单个`位`，处理 `bitset` 中的所有`位`。\n\n![图像](img/25tab02.jpg)\n\n**表\
  \ 25.2** `std::bitset` 的成员方法\n\n这些成员方法和运算符的使用在列表 25.2 中进行了演示。\n\n**列表 25.2** 使用\
  \ Bitset 执行逻辑操作\n\n```cpp\n0: #include <bitset>\n1: #include <string>\n2: #include\
  \ <iostream>\n3:\n4: int main ()\n5: {\n6:     using namespace std;\n7:     bitset\
  \ <8> inputBits;\n8:     cout << \"Enter a 8-bit sequence: \";\n9:\n10:    cin >>\
  \ inputBits;  // 将用户输入存入 bitset\n11:\n12:    cout << \"Num 1s you supplied: \" <<\
  \ inputBits.count () << endl;\n13: }\n```\n\n\n\n\n\n```cpp\ncout << \"Num 0s you\
  \ supplied: \";\ncout << inputBits.size () - inputBits.count () << endl;\nbitset\
  \ <8> inputFlipped (inputBits);  // copy\ninputFlipped.flip ();  // toggle the bits\n\
  cout << \"Flipped version is: \" << inputFlipped << endl;\ncout << \"Result of AND,\
  \ OR and XOR between the two:\" << endl;\ncout << inputBits << \" & \" << inputFlipped\
  \ << \" = \";\ncout << (inputBits & inputFlipped) << endl;  // bitwise AND\ncout\
  \ << inputBits << \" | \" << inputFlipped << \" = \";\ncout << (inputBits | inputFlipped)\
  \ << endl;  // bitwise OR\ncout << inputBits << \" ^ \" << inputFlipped << \" =\
  \ \";\ncout << (inputBits ^ inputFlipped) << endl; // bitwise XOR\nreturn 0;\n```\n\
  \nOutput ![Image](img/arrow.jpg)\n\n点击此处查看代码图像\n\n输入一个 8 位的序列: 10110101\n\n你提供的\
  \ 1 的个数: 5\n\n你提供的 0 的个数: 3\n\n反转后的版本: 01001010\n\n两者之间的 AND、OR 和 XOR 结果为：\n\n10110101\
  \ & 01001010 = 00000000\n\n10110101 | 01001010 = 11111111\n\n10110101 ^ 01001010\
  \ = 11111111\n\n### 分析\n\n![Image](img/arrow.jpg)\n\n这个交互式程序不仅演示了使用 `std::bitset`\
  \ 在两个位序列之间进行位运算是多么简单，还展示了其 `stream` 运算符的实用性。`std::bitset` 实现的位移运算符（`>>` 和 `<<`）使得向屏幕写入位序列以及以字符串格式从用户读取位序列变成了一项简单的任务。`inputBits`\
  \ 在第 10 行包含了用户提供的序列。第 12 行使用的 `count()` 告诉序列中 1 的个数，而 0 的个数则通过 `size()`（返回 bitset\
  \ 中的位数）与 `count()` 之间的差值计算得出，如第 14 行所示。`inputFlipped` 在开头是 `inputBits` 的拷贝，然后在第\
  \ 17 行使用 `flip()` 进行了反转。它现在包含了每个位都已反转的序列——即取反（0 变为 1，反之亦然）。程序的其余部分演示了两个 bitset 之间位与、位或和位异或的结果。\n\
  \n### 注意事项\n\nSTL `bitset<>` 的缺点之一是无法动态调整自身大小。你只能在编译时已知序列中要存储位数量的地方使用 `bitset`。\n\
  \nSTL 为程序员提供了一个 `vector<bool>` 类（在某些 STL 的实现中也称为 `bit_vector`），它克服了这一缺点。\n\n###\
  \ `vector<bool>`\n\n`vector<bool>` 是 `std::vector` 的部分特化，用于存储 `boolean` 数据。该类能够动态调整自身大小。因此，程序员不需要在编译时知道要存储多少个\
  \ `boolean` 标志。\n\n### 提示\n\n要使用类 `std::vector<bool>`，请包含头文件：\n\n```cpp\n#include\
  \ <vector>\n```\n\n#### 实例化 `vector<bool>`\n\n实例化 `vector<bool>` 与 vector 类似，但有一些方便的重载：\n\
  \n```cpp\nvector <bool> boolFlags1;\n```\n\n例如，你可以创建一个初始包含 10 个布尔值的 vector，每个值都初始化为\
  \ 1（即 true）：\n\n点击此处查看代码图像\n\n```cpp\nvector <bool> boolFlags2 (10, true);\n```\n\
  \n你也可以创建一个作为另一个对象拷贝的对象：\n\n点击此处查看代码图像\n\n```cpp\nvector <bool> boolFlags2Copy (boolFlags2);\n\
  ```\n\n`vector<bool>` 的某些实例化技术在列表 25.3 中有所演示。\n\n**列表 25.3** `vector<bool>` 的实例化\n\
  \n点击此处查看代码图像\n\n```cpp\n#include <vector>\nint main () {\n    using namespace std;\n\
  \    // 使用默认构造函数实例化对象\n    vector <bool> boolFlags1;\n    // 初始化一个包含 10 个值为 true\
  \ 元素的 vector\n    vector <bool> boolFlags2 (10, true);\n    // 实例化一个对象作为另一个对象的拷贝\n\
  \    vector <bool> boolFlags2Copy (boolFlags2);\n    return 0;\n}\n```\n\n### 分析\n\
  \n![Image](img/arrow.jpg)\n\n此示例展示了构造 `vector<bool>` 对象的几种方法。第 7 行是使用默认构造函数的一种。第\
  \ 10 行演示了创建一个初始化为包含 10 个 `boolean` 标志的对象，每个标志都持有值 `true`。第 13 行演示了如何创建一个另一个对象的拷贝。\n\
  \n### `vector<bool>` 函数与运算符\n\n`vector<bool>` 对象可以构造的几种方法。第 7 行是使用默认构造函数的一种。第 10\
  \ 行演示了创建一个初始化为包含 10 个 `boolean` 标志的对象，每个标志都持有值 `true`。第 13 行演示了如何创建一个另一个对象的拷贝。\n\
  \n`vector<bool>` 中的标志可以通过 `operator[]` 访问，如第 7-9 行所示，就像访问普通 vector 一样。`flip()` 函数可以反转状态。尽管你在第\
  \ 6 行初始化了标志，但你可以在第 11 行动态地添加更多。添加多于编译时指定数量的标志是 `bitset` 无法做到的。列表 25.4 演示了该类的用法。\n\
  \n**列表 25.4** 使用 `vector<bool>`\n\n点击此处查看代码图像\n\n```cpp\n#include <vector>\n#include\
  \ <iostream>\nusing namespace std;\nint main () {\n    vector <bool> boolFlags(3);\
  \ // 实例化 3 个标志\n    boolFlags [0] = true;\n    boolFlags [1] = true;\n    boolFlags\
  \ [2] = false;\n    boolFlags.push_back(true); // 添加第 4 个标志\n    cout << \"The contents\
  \ of the vector are: \" << endl;\n    for (size_t index = 0; index < boolFlags.size\
  \ (); ++ index)\n        cout << boolFlags [index] << ' ';\n    cout << endl;\n\
  \    boolFlags.flip(); // 反转所有标志\n    return 0;\n}\n```\n\nOutput ![Image](img/arrow.jpg)\n\
  \n点击此处查看代码图像\n\nvector 的内容为：1 1 0 1\n\nvector 的内容为：0 0 1 0\n\n\n\n\n\n## Q 我可以使用迭代器来访问\
  \ `vector<bool>` 中的单个元素吗？\n\n**A** 可以的。因为 `vector<bool>` 是 `std::vector` 的部分特化，所以它支持迭代器。\n\
  \n## Q 我可以在编译时指定 `vector<bool>` 持有的元素数量吗？\n\n**A** 可以的，可以通过在重载构造函数中指定数量，或者在稍后使用\
  \ `vector<bool>::resize()` 函数来实现。\n\n### 工作坊\n\n工作坊包含测验题以帮助你巩固对所涵盖内容的理解，并提供使用所学知识的练习机会。在检查附录\
