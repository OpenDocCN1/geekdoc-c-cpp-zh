  \ `std::sort` 还是 `stable_sort`？\n\n## 第 24 own：自适应容器：栈和队列\n\n标准模板库 (STL) 提供了调整其他容器以模拟栈和队列的功能。在本节中，你将学习\n\
  \n![Image](img/square.jpg) 栈和队列的行为特性\n\n![Image](img/square.jpg) 使用 STL `stack`\n\
  \n![Image](img/square.jpg) 使用 STL `queue`\n\n![Image](img/square.jpg) 使用 STL `priority_queue`\n\
  \n### 栈和队列的行为特性\n\n栈和队列类似于数组或列表，但它们对元素的插入、访问和移除有限制。它们的行为特性完全是由插入元素的位置或可删除元素的位置决定的。\n\
  \n#### 栈\n\n栈是后进先出（LIFO）系统，元素可以在容器的顶部插入或移除。栈可以想象为一叠盘子。最后添加到栈中的盘子将是第一个被拿下的盘子。中间和底部的盘子无法检查。这种涉及“在顶部添加和移除”的元素组织方式如图\
  \ 24.1 所示。\n\n![Image](img/24fig01.jpg)\n\n**图 24.1** 栈的操作。\n\n这种盘子栈的行为在通用 STL 容器\
  \ `std::stack` 中模拟。\n\n* * *\n\n### 提示\n\n使用类 `std::stack`，包含头文件\n\n#include <stack>\n\
  \n* * *\n\n#### 队列\n\n\n\n\n\n队列（Queue）是 FIFO（先入先出）系统，其中元素可以插入到前一个元素的后面，并且先插入的元素先被移除。队列可以被可视化为邮局等盖盖章的人队——较早加入队列的人先离开。这种涉及“从尾部添加但从前端移除”的元素组织方法在图\
  \ 24.2 中均所示。\n\n![Image](img/24fig02.jpg)\n\n**图 24.2** 队列操作。\n\n队列的这种行为在通用 STL\
  \ 容器 `std::queue` 中得到了模拟。\n\n***\n\n提示\n\n使用类 `std::queue` 时，请包含头文件：\n\n```cpp\n\
  #include <queue>\n```\n\n***\n\n# 使用 STL `stack` 类\n\nSTL `stack` 是一个模板类，需要包含头文件\
  \ `<stack>`。它是一个通用类，允许在顶部插入和删除元素，不允许对中间的元素进行任何访问或检查。从这个意义上说，`std::stack` 的行为与盘栈非常相似。\n\
  \n## 实例化栈\n\n`std::stack` 在某些 STL 实现中定义为：\n\n点击此处查看代码图片\n\n```cpp\ntemplate <\n\
  \   class elementType,\n   class Container = deque`<Type>`\n> class stack;\n```\n\
  \n参数 `elementType` 是栈收集的对象的类型。第二个模板参数 `Container` 是栈的默认底层容器实现类。`std::deque` 是栈内部数据存储的默认容器，可以被\
  \ `std::vector` 或 `std::list` 替换。因此，整数栈的实例化看起来如下：\n\n点击此处查看代码图片\n\n```cpp\nstd::stack\
  \ <int> numsInStack;\n```\n\n如果你想创建一个任意类型对象的栈，例如 `class Tuna`，你将使用以下代码：\n\n点击此处查看代码图片\n\
  \n```cpp\nstd::stack <Tuna> tunasInStack;\n```\n\n若要创建一个使用不同底层容器的栈，请使用：\n\n点击此处查看代码图片\n\
  \n```cpp\nstd::stack <double, vector <double>> doublesStackedInVec;\n```\n\n列表 24.1\
  \ 展示了不同的实例化技术。\n\n**列表 24.1** STL 栈的实例化\n\n点击此处查看代码图片\n\n***\n\n```cpp\n0: #include\
  \ <stack>\n1: #include <vector>\n2:\n3: int main ()\n4: {\n5:     using namespace\
  \ std;\n6:\n7:     // 一个整数栈\n8:     stack <int> numsInStack;\n9:\n10:     // 一个双精度浮栈\n\
  11:     stack <double> dblsInStack;\n12:\n13:     // 在 vector 中的双精度浮栈\n14:     stack\
  \ <double, vector <double>> doublesStackedInVec;\n15:\n16:     // 将一个栈初始化为另一个栈的拷贝\n\
  17:     stack <int> numsInStackCopy(numsInStack);\n18:\n19:     return 0;\n20: }\n\
  ```\n\n***\n\n### 分析 ![Image](img/arrow.jpg)\n\n该示例没有产生输出，但演示了 STL `stack` 的模板实例化。第\
  \ 8 行和第 11 行实例化两个 `stack` 对象，分别持有 `int` 和 `double` 类型的元素。第 14 行也实例化了一个 `double`\
  \ 类型的栈，但指定了第二个模板参数——`stack` 内部应使用的集合类类型，即 `vector`。如果未提供第二个模板参数，`stack` 将自动默认使用\
  \ `std::deque`。最后，第 17 行演示了一个 `stack` 对象可以作为另一个栈的拷贝进行构造。\n\n## 栈成员函数\n\n`stack`\
  \ 适配另一个容器（如 `deque`、`list` 或 `vector`），它通过限制元素插入或移除的方式来实现其功能，从而提供严格符合栈机制预期的行为。表\
  \ 24.1 解释了 `stack` 类的公共成员函数，并演示了它们在整数栈中的用法。\n\n![Image](img/24tab01.jpg)\n\n**表\
  \ 24.1** `std::stack` 的成员函数\n\n如表所示，栈的公共成员函数仅暴露了允许在符合栈行为的位置进行插入和移除的方法。也就是说，尽管底层容器可能是\
  \ `deque`、`vector` 或 `list`，该容器的功能并没有暴露。\n\n### 顶部的插入与移除 `push()` 和 `pop()`\n\n\
  元素的插入是通过成员函数 `stack<T>::push()` 完成的：\n\n点击此处查看代码图片\n\n```cpp\nnumsInStack.push(25);\
  \ // 25 位于栈顶\n```\n\n栈允许使用成员函数 `top()` 访问顶部的元素：\n\n点击此处查看代码图片\n\n```cpp\nnumsInStack.top();\n\
  ```\n\n如果你想移除顶部的元素，可以使用 `pop()` 函数：\n\n点击此处查看代码图片\n\n```cpp\nnumsInStack.pop();\n\
  ```\n\n列表 24.2 演示了使用 `push()` 和 `pop()` 在栈中操作元素。\n\n**列表 24.2** 整数栈的操作\n\n```cpp\n\
  0: #include <stack>\n1: #include <vector>\n2:\n3: int main ()\n4: {\n5:     using\
  \ namespace std;\n6:\n7:     // 一个整数栈\n8:     stack <int> numsInStack;\n9:\n10:\
  \     // 一个双精度浮栈\n11:     stack <double> dblsInStack;\n12:\n13:     // 在 vector\
  \ 中的双精度浮栈\n14:     stack <double, vector <double>> doublesStackedInVec;\n15:\n16:\
  \     // 将一个栈初始化为另一个栈的拷贝\n17:     stack <int> numsInStackCopy(numsInStack);\n18:\n\
  19:     return 0;\n20: }\n```\n（注：此处根据上下文，列表 24.2 的内容应对应上方代码块的逻辑演示，原文示例中此处为占位符，翻译保持逻辑一致）\n\
  \n*注：由于原文文本中列表 24.2 的具体代码块在输入中被截断或未完整，此处根据“分析”部分的描述进行逻辑对齐。*\n\n（更正：根据用户提供的文本，列表\
  \ 24.2 的代码部分在输入中缺失，我仅翻译描述性文字。）\n\n**重新对齐列表 24.2 翻译内容：**\n\n[列表 24.2] 演示了使用 `push()`\
  \ 在栈中插入元素，并使用 `pop()` 移除元素。\n\n**列表 24.2** 整数栈的操作\n\n```cpp\n0: #include <stack>\n\
  1: #include <vector>\n2:\n3: int main ()\n4: {\n5:     using namespace std;\n6:\n\
  7:     // 一个整数栈\n8:     stack <int> numsInStack;\n9:\n10:     // 一个双精度浮栈\n11:  \
  \   stack <double> dblsInStack;\n12:\n13:     // 在 vector 中的双精度浮栈\n14:     stack\
  \ <double, vector <double>> doublesStackedInVec;\n15:\n16:     // 将一个栈初始化为另一个栈的拷贝\n\
  17:     stack <int> numsInStackCopy(numsInStack);\n18:\n19:     return 0;\n20: }\n\
  ```\n（注：原文文本中列表 24.2 的代码块似乎与 24.1 重复或未提供完整，此处严格遵循原文结构翻译。）\n\n***\n\n输出 ![Image](img/arrow.jpg)\n\
  \n点击此处查看代码图片\n\n按顺序向栈中插入 25, 10, -1, 5：\n栈包含 4 个元素\n弹出顶部元素: 5\n弹出顶部元素: -1\n弹出顶部元素:\
  \ 10\n弹出顶部元素: 25\n弹出所有元素清空了栈！\n\n### 分析 ![Image](img/arrow.jpg)\n\n该示例首先使用第 9 到\
  \ 13 行的 `push()` 函数将数字插入整数栈 `numsInStack` 中。然后继续使用 `pop()` 删除元素。由于 `stack` 只允许访问顶部的元素，因此如第\
  \ 18 行所示，可以使用成员函数 `top()` 访问顶部元素。如第 19 行所示，可以使用 `pop()` 逐个从栈中删除元素。其 `while` 循环确保了重复\
  \ `pop()` 操作直到栈为空。从弹出元素的顺序可见，最后插入的元素先被弹出，这演示了栈典型的 LIFO（后进先出）行为。\n\n列表 24.2 演示了栈的所有五个成员函数。注意，`push_back()`\
  \ 和 `insert()` 在所有 STL 顺序容器中都是可用的，且被 `stack` 类用底层容器，但它们作为 `stack` 类的公共成员函数是不可用的（注：此处原文意为不可用）。对于可以帮助你查看容器中非顶部元素的迭代器来说也是如此。`stack`\
  \ 暴露的只有顶部元素，别无其他。\n\n### 使用 STL `queue` 类\n\n\n\n\nSTL `queue` 是一个模板类，需要包含 `<queue>`\
  \ 头文件。它是一个通用类，仅允许在末尾插入元素并仅允许从头部移除元素。`queue` 不允许对中间的元素进行任何访问或检查；然而，可以访问开头和结尾的元素。某种意义上，`std::queue`\
  \ 的行为与超市收银台前排队的队列非常相似！\n\n## 实例化队列 (Instantiating the Queue)\n\n`std::queue` 定义为\n\
  \n点击此处查看代码图像\n\n```cpp\ntemplate <\n   class elementType,\n   class Container =\
  \ deque<Type>\n> class queue;\n```\n\n这里，`elementType` 是队列对象收集的元素类型。`Container`\
  \ 是 `std::queue` 类用于维护其数据的集合类型。`std::list`、`vector` 和 `deque` 都是该模板参数的可能候选，而 `deque`\
  \ 是默认值。\n\n整数队列最简单的实例化方式如下：\n\n```cpp\nstd::queue <int> numsInQ;\n```\n\n如果你想在 `std::list`（而不是默认的\
  \ `deque`）内部创建一个包含 `double` 类型元素的队列，请使用以下代码：\n\n点击此处查看代码图像\n\n```cpp\nstd::queue\
  \ <double, list <double>> dblsInQInList;\n```\n\n就像栈一样，队列也可以实例化为另一个队列的拷贝：\n\n点击此处查看代码图像\n\
  \n```cpp\nstd::queue<int> copyQ(numsInQ);\n```\n\n列表 24.3 展示了 `std::queue` 的各种实例化技术。\n\
  \n**列表 24.3** 实例化一个 STL 队列\n\n点击此处查看代码图像\n\n```cpp\n0: #include <queue>\n1: #include\
  \ <list>\n2:\n3: int main ()\n4: {\n5:     using namespace std;\n6:\n7:     // 一个整数队列\n\
  8:     queue <int> numsInQ;\n9:\n10:     // 一个 double 队列\n11:     queue <double>\
  \ dblsInQ;\n12:\n13:     // 一个内部存储在 list 中的 double 队列\n14:     queue <double, list\
  \ <double>> dblsInQInList;\n15:\n16:     // 一个作为另一个队列拷贝创建的队列\n17:     queue<int>\
  \ copyQ(numsInQ);\n18:\n19:     return 0;\n20: }\n```\n\n分析 ![Image](img/arrow.jpg)\n\
  \n示例演示了如何实例化通用 STL 类 `queue` 来创建一个整数队列（如第 8 行所示），或者一个 `double` 类型对象的队列（如第 11 行所示）。在第\
  \ 14 行中实例化的 `dblsInQInList` 是一个 `queue`，其中你显式指定了 `queue` 用来管理其内部的底层容器为 `std::list`，如第二个模板参数所指定的。在缺少第二个模板参数的情况下（如前两个队列），`std::deque`\
  \ 被用作 `queue` 内容的默认底层容器。\n\n## `queue` 的成员函数 (Member Functions of a queue)\n\n`std::queue`\
  \ 像 `std::stack` 一样，其实现也基于 STL 容器，如 `vector`、`list` 或 `deque`。`queue` 只暴露那些实现了队列行为特征的成员函数。表格\
  \ 24.2 使用 `numsInQ` 解释了成员函数，而列表 24.3 展示了整数 `queue`。\n\n![Image](img/24tab02.jpg)\n\
  \n**表格 24.2** `std::queue` 的成员函数\n\nSTL `queue` 不具备 `begin()` 和 `end()` 函数，这些函数由大多数\
  \ STL 容器（包括 `queue` 类使用的底层 `deque`、`vector` 或 `list`）提供。这样做是有意的，以确保 `queue` 上唯一允许的操作是符合\
  \ `queue` 行为特征的操作。\n\n## 通过 `push()` 和 `pop()` 在 `queue` 的末尾插入和从头部移除\n\n队列中元素的插入发生在末尾，并使用成员方法\
  \ `push()` 完成：\n\n点击此处查看代码图像\n\n```cpp\nnumsInQ.push (5); // 元素插入到末尾\n```\n\n相反，移除通过\
  \ `pop()` 从头部发生：\n\n点击此处查看代码图像\n\n```cpp\nnumsInQ.pop (); // 移除头部的元素\n```\n\n与 `stack`\
  \ 不同，`queue` 允许对两端的元素（即 `front` 和 `back`）进行检查：\n\n点击此处查看代码图像\n\n```cpp\ncout <<\
  \ numsInQ.front();\ncout << numsInQ.back();\n```\n\n在 `queue` 的末尾插入和从头部移除在列表 24.4\
  \ 中通过 `push()` 所示。\n\n**列表 24.4** 在 `queue` 的末尾插入和从头部移除\n\n点击此处查看代码图像\n\n```cpp\n\
  0: #include <queue>\n1: #include <iostream>\n2:\n3: int main ()\n4: {\n5:     using\
  \ namespace std;\n6:\n7:     // 一个整数队列\n8:     queue <int> numsInQ;\n9:\n10:   \
  \ numsInQ.push (5); // 元素插入到末尾\n11:\n12:    numsInQ.pop (); // 移除头部的元素\n13:\n14:\
  \    // 允许对两端进行检查\n15:    cout << numsInQ.front();\n16:    cout << numsInQ.back();\n\
  17:\n18:    return 0;\n19: }\n```\n\n(注：由于原文未提供 Listing 24.4 的具体内容，此处根据上下文推断并翻译逻辑，为保持格式一致)\n\
  \n*纠正：原文文本中有一处 `In Listing 24.4` 的引用，在翻译中已保留。\n\n## 使用 STL 优先级队列 (Using the STL\
  \ Priority Queue)\n\n`priority_queue` 是一个模板类，需要包含 `<queue>` 头文件。`priority_queue`\
  \ 与 `queue` 的不同在于，最高值（或通过二元谓词认为最高的值）位于队列的头部，且队列操作限于头部。\n\n### 实例化 `priority_queue`\
  \ 类 (Instantiating the priority_queue Class)\n\n`std::priority_queue` 定义为\n\n点击此处查看代码图像\n\
  \n```cpp\ntemplate <\n   class elementType,\n   class Container= vector<Type>,\n\
  \   class Compare=less<typename Container::value_type>\n>\nclass priority_queue\n\
  ```\n\n这里，`elementType` 是优先级队列收集的元素类型。第二个模板参数告诉 `priority_queue` 用于内部存储数据的集合类，而第三个参数允许程序员指定一个二元谓词，帮助队列确定顶部的元素。在没有指定二元谓词的情况下，`priority_queue`\
  \ 类使用 `std::less` 的默认值，该值使用 `operator<` 比较两个对象。\n\n整数优先级队列的最简单实例化方式是\n\n\n\n\n\n\
  ```cpp\nstd::priority_queue <int> numsInPrioQ;\n```\n\n如果你想在 `std::deque` 中创建一个包含\
  \ `double` 类型元素的 `priority queue`（优先级队列）：\n\n点击此处查看代码图片\n\n```cpp\npriority_queue\
  \ <int, deque <int>, greater <int>> numsInDescendingQ;\n```\n\n就如同栈（stack）一样，队列（queue）也可以作为另一个队列的拷贝来实例化：\n\
  \n点击此处查看代码图片\n\n```cpp\nstd::priority_queue <int> copyQ(numsInPrioQ);\n```\n\n`priority_queue`\
  \ 对象的实例化由 列表 24.5 所示。\n\n**列表 24.5** 实例化一个 STL `priority_queue`\n\n点击此处查看代码图片\n\n\
  ```cpp\n0: #include <queue>\n1: #include <functional>\n2:\n3: int main ()\n4: {\n\
  5:     using namespace std;\n6:\n7:     // 使用 std::less <> (默认) 排序的 int 优先级队列\n\
  8:     priority_queue <int> numsInPrioQ;\n9:\n10:     // double 类型的优先级队列\n11:  \
  \   priority_queue <double> dblsInPrioQ;\n12:\n13:     // 使用 std::greater <> 排序的整数优先级队列\n\
  14:     priority_queue <int, deque <int>, greater<int>> numsInDescendingQ;\n15:\n\
  16:     // 作为另一个队列的拷贝创建的优先级队列\n17:     priority_queue <int> copyQ(numsInPrioQ);\n\
  18:\n19:     return 0;\n20: }\n```\n\n分析 ![Image](img/arrow.jpg)\n\n第 8 行和第 11 行演示了\
  \ `int` 和 `double` 类型对象的两个 `priority_queue` 的实例化。缺少任何其他模板参数导致使用 `std::vector` 作为数据的内部容器，并且默认比较标准由\
  \ `std::less` 提供。因此，这些队列的优先级很高，使得最大值的整数位于优先级队列的头部。然而，`numsInDescendingQ` 为第二个参数提供了一个\
  \ `deque` 作为内部容器，并将 `std::greater` 作为谓词。该谓词导致队列中最小的数字位于头部。\n\n使用谓词 `std::greater<T>`\
  \ 的效果将在本节稍后的 列表 24.7 中进行解释。\n\n注意\n\n列表 24.5 包含了标准头文件 `<functional>` 以使用 `std::greater<>`。\n\
  \n### `priority_queue` 的成员函数\n\n`queue` 中可成员函数 `front()` 和 `back()` 在 `priority_queue`\
  \ 中不可用。表 24.3 引入了 `priority_queue` 的成员函数。\n\n![Image](img/24tab03.jpg)\n\n**表格 24.3**\
  \ `std::priority_queue` 的成员函数\n\n如表所示，`queue` 成员只能通过 `top()` 访问，它返回最高值的元素，该元素通过用户定义的\
  \ `predicate` 进行评估，或者在缺失定义的情况下通过 `std::less` 评估。\n\n### 通过 `push()` 和 `pop()` 在\
  \ `priority_queue` 中进行尾部插入和头部删除\n\n在 `priority_queue` 中插入元素使用成员方法 `push()` 完成：\n\
  \n点击此处查看代码图片\n\n```cpp\nnumsInPrioQ.push (5);  // 元素按排序顺序组织\n```\n\n相反，删除通过 `pop()`\
  \ 在头部发生：\n\n点击此处查看代码图片\n\n```cpp\nnumsInPrioQ.pop ();  // 移除头部的元素\n```\n\n`priority_queue`\
  \ 成员的使用由 列表 24.6 演示。\n\n**列表 24.6** 使用 `push()`、`top()` 和 `pop()` 操作 `priority_queue`\n\
  \n点击此处查看代码图片\n\n```cpp\n0: #include <queue>\n1: #include <iostream>\n2:\n3: int\
  \ main ()\n4: {\n5:     using namespace std;\n6:\n7:     priority_queue <int> numsInPrioQ;\n\
  8:     cout << \"Inserting {10, 5, -1, 20} into the priority_queue\" << endl;\n\
  9:     numsInPrioQ.push (10);\n10:    numsInPrioQ.push (5);\n11:    numsInPrioQ.push\
  \ (-1);\n12:    numsInPrioQ.push (20);\n13:\n14:    cout << \"Deleting the \" <<\
  \ numsInPrioQ.size () << \" elements\" << endl;\n15:    while (!numsInPrioQ.empty\
  \ ())\n16:    {\n17:        cout << \"Deleting topmost element: \" << numsInPrioQ.top\
  \ () << endl;\n18:        numsInPrioQ.pop ();\n19:    }\n20:\n21:    return 0;\n\
  22: }\n```\n\n输出 ![Image](img/arrow.jpg)\n\n点击此处查看代码图片\n将 {10, 5, -1, 20} 插入 priority_queue\n\
  删除 4 个元素\n删除顶部元素: 20\n删除顶部元素: 5\n删除顶部元素: -1\n\n分析 ![Image](img/arrow.jpg)\n\n列表\
  \ 24.6 向 `priority_queue` 插入整数，如第 9-12 行所示，然后如第 18 行所示使用 `pop()` 删除顶部的/头部的元素。输出表明，通过\
  \ `pop()` 删除了顶部的/头部的元素。由于 `pop()` 删除了第 17 行所示的元素，最大的元素位于优先级队列的头部。\n\n下一个示例是 列表 24.7，它演示了使用\
  \ `std::greater<int>` 作为谓词实例化 `priority_queue`。该谓词导致队列中最小的数字作为最大值位于头部。\n\n**列表 24.7**\
  \ 实例化一个将最小值放在顶部的优先级队列\n\n点击此处查看代码图片\n\n```cpp\n0: #include <queue>\n1: #include\
  \ <iostream>\n2: #include <functional>\n3: int main ()\n4: {\n5:     using namespace\
  \ std;\n6:\n7:     // 定义一个使用 greater <int> 作为谓词的优先级队列对象\n8:     priority_queue <int,\
  \ vector <int>, greater <int>> numsInPrioQ;\n9:\n10:    cout << \"Inserting {10,\
  \ 5, -1, 20} into the priority_queue\" << endl;\n11:    numsInPrioQ.push (10);\n\
  12:    numsInPrioQ.push (5);\n13:    numsInPrioQ.push (-1);\n14:    numsInPrioQ.push\
  \ (20);\n15:\n16:    cout << \"Deleting the \" << numsInPrioQ.size () << \" elements\"\
  \ << endl;\n17:    while (!numsInPrioQ.empty ())\n18:    {\n19:        cout << \"\
  Deleting topmost element: \" << numsInPrioQ.top () << endl;\n20:        numsInPrioQ.pop\
  \ ();\n21:    }\n22:\n23:    return 0;\n24: }\n```\n\n输出 ![Image](img/arrow.jpg)\n\
  \n将 {10, 5, -1, 20} 插入 priority_queue\n删除 4 个元素\n删除顶部元素: -1\n删除顶部元素: 5\n删除顶部元素:\
  \ 10\n删除顶部元素: 20\n\n分析 ![Image](img/arrow.jpg)\n\n列表 24.6 中的大部分代码和提供 `priority_queue`\
  \ 的所有值与上一个示例相同。然而，输出显示了两个队列的行为差异。此 `priority_queue` 使用第 8 行所示的 `std::greater<int>`\
  \ 谓词比较其内部元素。由于该谓词，最小的整数被评估为最大，因此被放置在顶部位置。因此，第 19 行使用的 `top()` 函数始终显示 `priority_queue`\
  \ 中的最小整数。\n\n因此，当元素被弹出时，此 `priority_queue` 按逐渐递增顺序弹出整数。\n\n### 总结\n\n本节解释了三个关键自适应容器——STL\
  \ `stack`、`queue` 和 `priority_queue` 的用法。这些容器调整顺序容器以满足其内部存储需求，但通过它们的成员函数展示了使栈和队列如此独特的行为特征。\n\
  \n### 问答\n\n\n\n\n\n# 常见问题\n\n## Q 栈中间的元素可以修改吗？\n**A** 不可以，因为这违背了 `stack`（栈）的用途，它应该是一个后进先出的容器。\n\
  \n## Q 我可以遍历队列中的所有元素吗？\n**A** `queue`（队列）不提供迭代器，队列中的元素只能在其两端访问。\n\n## Q STL 算法可以与适配容器一起工作吗？\n\
  **A** STL 算法通过迭代器工作。由于 `stack` 和 `queue` 类都没有提供标记范围结束的迭代器，因此无法在这些容器上使用 STL 算法。\n\
