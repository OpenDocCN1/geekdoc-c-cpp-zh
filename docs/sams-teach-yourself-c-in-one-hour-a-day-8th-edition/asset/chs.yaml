  \ 以下初始化代码有什么错误：\n\n```auto Integer;\n```\n\n# 第 4 节：管理数组与字符串\n\n在之前的课程中，你曾声明过用于包含单个\
  \ `int`、`char` 或 `string` 的变量（这仅仅是其中的几个例子）。然而，你可能想要声明一个对象集合，例如 20 个 `int` 或一个用于存储名字的字符串。\n\
  \n在本节中，你将学习：\n\n- ![Image](img/square.jpg) 什么是数组以及如何声明和使用它们\n- ![Image](img/square.jpg)\
  \ 什么是字符串以及如何使用字符数组来制作它们\n- ![Image](img/square.jpg) `std::string` 的简要介绍\n\n### 什么是数组？\n\
  \n`array` 的字典定义非常接近我们想要理解的内容。根据韦登-韦伯斯特词典，`array` 是“形成完整单元的元素组，例如一组太阳能电池板”。\n\n以下是数组的特征：\n\
  \n- ![Image](img/square.jpg) 数组是元素的集合。\n- ![Image](img/square.jpg) 数组中包含的所有元素都是相同类型。\n\
  - ![Image](img/square.jpg) 该集合形成了一个完整的整体。\n\n在 C++ 中，数组允许你以顺序有序的方式在内存中存储某种类型的数据元素。\n\
  \n#### 数组的必要\n\n假设你正在编写一个程序，用户可以输入五个整数，由你向他显示这些整数。一种方法是让你的程序声明五个独立且唯一的整数变量，并使用它们来存储和显示值。声明如下：\n\
  \n点击此处查看代码图片\n\n```\nint firstNumber = 0;\nint secondNumber = 0;\nint thirdNumber\
  \ = 0;\nint fourthNumber = 0;\nint fifthNumber = 0;\n```\n\n如果你的用户希望程序在稍后存储并显示 500\
  \ 个整数，你需要使用上述系统声明 500 个这样的整数。只要有足够的耐心和时间，这仍然可行。但是，想象用户要求你支持 500,000 个整数而不是 5 个——你会怎么做？\n\
  \n你应该正确且聪明地这样做，从声明一个包含五个整数的数组开始，每个整数初始化为零：\n\n```\nint myNumbers [5] = {0};\n```\n\
  \n因此，如果你被要求支持 500,000 个整数，你的数组可以迅速扩展，如下：\n\n点击此处查看代码图片\n\n```\nint manyNumbers [500000]\
  \ = {0};\n```\n\n一个五个字符的数组可以定义为：\n\n```\nchar myCharacters [5];\n```\n\n此类数组被称为`静态数组`（static\
  \ arrays），因为它们包含的元素数量以及数组消耗内存在编译时都是固定的。\n\n#### 声明和初始化静态数组\n\n在之前的几行代码中，你声明了一个名为\
  \ `myNumbers` 的数组，它包含五个 `int` 类型（即整数）的元素，且都初始化为值 0。因此，C++ 中的数组声明遵循简单的语法：\n\n点击此处查看代码图片\n\
  \n```\nElementType ArrayName [元素数量的常数] = {可选的初始值};\n```\n\n你甚至可以逐元素地声明数组并初始化其内容，就像这个整数数组一样，五个整数中的每个都被初始化为五个不同的整数值：\n\
  \n点击此处查看代码图片\n\n```\nint myNumbers [5] = {34, 56, -21, 5002, 365};\n```\n\n你可以让数组中的所有元素初始化为零（编译器为数值类型提供的默认值），如下所示：\n\
  \n点击此处查看代码图片\n\n```\nint myNumbers [5] = {}; // 将所有整数初始化为 0\n```\n\n你也可以部分初始化数组中的元素，如下所示：\n\
  \n点击此处查看代码图片\n\n```\nint myNumbers [5] = {34, 56};\n// 将前两个元素初始化为 34 和 56，其余的为 0\n\
  ```\n\n你可以将数组的长度（即数组中元素的数量）定义为一个常数，并在数组定义中使用该常数：\n\n点击此处查看代码图片\n\n```\nconst int\
  \ LENGTH = 5;\nint myNumbers [LENGTH] = {34, 56};\n```\n\n\n\n\n\n当要求访问索引为 `N` 的元素时，编译器使用第一个元素（位于索引零）的内存地址作为起始点，然后通过加上计算出的\
  \ `N*sizeof(element)` 偏移量来跳过 `N` 个元素，到达包含第 (N+1) 个元素的地址。C++ 编译器不会检查该索引是否在数组实际定义的边界内。你可以尝试在一个仅有\
  \ 10 个元素的数组中获取索引为 1001 的元素，这将使你的程序的安全性和稳定性面临风险。确保数组不越界访问的责任完全在于程序员。\n\n### 注意事项\n\
  \n越界访问数组会导致不可预知的行为。在许多情况下，这会导致你的程序崩溃。应该不计一切代价避免越界访问数组。\n\n列表 4.1 展示了如何声明一个整数数组，将其元素初始化为整数值，并访问它们将其显示在屏幕上。\n\
  \n**列表 4.1** 声明整数数组并访问其元素\n\n点击此处查看代码图像\n\n```cpp\n0:  #include <iostream>\n1:\n\
  2:  using namespace std;\n3:\n4:  int main ()\n5:  {\n6:      int myNumbers [5]\
  \ = {34, 56, -21, 5002, 365}; even7:\n8:      cout << \"First element at index \
  \ 0: \" << myNumbers [0] << endl;\n9:      cout << \"Second element at index  1:\
  \ \" << myNumbers [1] << endl;\n10:      cout << \"Third element at index  2: \"\
  \ << myNumbers [2] << endl;\n11:      cout << \"Fourth element at index  3: \" <<\
  \ myNumbers [3] << endl;\n12:      cout << \"Fifth element at index  4: \" << myNumbers\
  \ [4] << endl;\n13:\n14:      return 0;\n15:  }\n```\n\n输出 ![Image](img/arrow.jpg)\n\
  \n点击此处查看代码图像\n\nFirst element at index  0: 34\nSecond element at index  1: 56\n\
  Third element at index  2: -21\nFourth element at index  3: 5002\nFifth element\
  \ at index  4: 365\n\n分析 ![Image](img/arrow.jpg)\n\n第 6 行声明了一个包含五个整数的数组，并为每个元素指定了初始值。后续行简单地使用\
  \ `cout` 和带有适当索引的数组变量 `myNumbers` 来显示这些整数。\n\n### 注意\n\n为了让你熟悉访问数组元素时使用的“零基索引”概念，我们从列表\
  \ 4.1 及之后开始对代码行进行编号，第一行编号为第 0 行。\n\n### 修改数组中存储的数据\n\n在之前的代码列表中，你没有向数组中输入用户定义的数据。为该数组中的元素赋值整数的语法与给整数变量赋值整数值非常相似。\n\
  \n例如，给一个整数赋值值 2016 如下所示：\n\n```cpp\nint thisYear;\nthisYear = 2016;\n```\n\n给数组中的第四个元素赋值值\
  \ 2016 如下所示：\n\n点击此处查看代码图像\n\n```cpp\nmyNumbers [3] = 2016; // Assign 2016 to the\
  \ fourth element\n```\n\n列表 4.2 展示了在声明数组长度时使用常量，并展示了在程序执行期间如何为单个数组元素赋值。\n\n**列表\
  \ 4.2** 为数组中的元素赋值\n\n点击此处查看代码图像\n\n```cpp\n0: #include <iostream>\n1: using namespace\
  \ std;\n2: constexpr int Square(int number) { return number*number; }\n3:\n4: int\
  \ main()\n5: {\n6:     const int ARRAY_LENGTH = 5;\n7:\n8     // Array of 5 integers,\
  \ initialized using a const\n9:     int myNumbers [ARRAY_LENGTH] = {5, 10, 0, -101,\
  \ 20};\n10:\n11:     // Using a constexpr for array of 25 integers\n12:     int\
  \ moreNumbers [Square(ARRAY_LENGTH)];\n13:\n14:     cout << \"Enter index of the\
  \ element to be changed: \";\n15:     int elementIndex = 0;\n16:     cin >> elementIndex;\n\
  17:\n18:     cout << \"Enter new value: \";\n19:     int newValue = 0;\n20:    \
  \ cin >> newValue;\n21:\n22:     myNumbers[elementIndex] = newValue;\n23:     moreNumbers[elementIndex]\
  \ = newValue;\n24:\n25:     cout << \"Element \" << elementIndex << \" in myNumbers\
  \ is: \";\n26:     cout << myNumbers[elementIndex] << endl;\n27:     cout << \"\
  Element \" << elementIndex << \" in moreNumbers is: \";\n28:     cout << moreNumbers[elementIndex]\
  \ << endl;\n29:\n30:     return 0;\n31: }\n```\n\n输出 ![Image](img/arrow.jpg)\n\n\
  点击此处查看代码图像\n\nEnter index of the element to be changed: 3\nEnter new value: 101\n\
  Element 3 in myNumbers is: 101\nElement 3 in moreNumbers is: 101\n\n分析 ![Image](img/arrow.jpg)\n\
  \n第 6 行使用常量定义 `ARRAY_LENGTH`。第 9 行使用常量初始化了一个包含 5 个整数的数组 `myNumbers`。第 12 行使用 `constexpr`\
  \ 定义了一个包含 25 个整数的数组 `moreNumbers`。第 14-16 行要求用户输入要修改的元素索引。第 18-20 行要求用户输入新值。第 22-23\
  \ 行将新值赋给 `myNumbers` 和 `moreNumbers`。第 25-28 行输出 `myNumbers` 和 `moreNumbers` 中对应元素的值。（*注：原文提供的代码块在某些处不完整，翻译时根据逻辑进行了补全以保持可读性*\n\
  \n\n\n\n\n如你在图 4.3 中所示，六块太阳能电池板以二维方式排列，由两行三列组成。从一个角度来看，你可以将这种布局看作是一个包含两个元素的数组，而每个元素本身又是一个包含三个电池板的数组——换句话说，这是一个数组的数组。在\
  \ C++ 中，你可以模拟二维数组，但并不局限于两个维度。根据你的需求和应用程序的性质，你也可以在内存中模拟多维数组。\n\n## 声明和初始化多维数组\n\n\
  C++ 允许你通过指定每个维度上想要保留的元素数量来声明多维数组。因此，表示图 4.3 中太阳能电池板的二维整数数组如下\n\n```cpp\nint solarPanels\
  \ [2][3];\n```\n\n注意，在图 4.3 中，你还为太阳能电池阵列中的六块电池板每个分配了一个从 0 到 5 的 ID。如果你以相同的顺序初始化该整数数组，它看起来像下面：\n\
  \n点击此处查看代码图像\n\n```cpp\nint solarPanels [2][3] = {{0, 1, 2}, {3, 4, 5}};\n```\n\n\
  如你所见，使用的初始化语法实际上与初始化两个一维数组的语法相似。一个三行三列的数组看起来如下：\n\n点击此处查看代码图像\n\n```cpp\nint threeRowsThreeColumns\
  \ [3][3] = {{-501, 206, 2016}, {989, 101, 206}, {303, 456, 596}};\n```\n\n***\n\n\
  **注意**\n\n尽管 C++ 允许我们模拟多维数组，但数组所处的内存是一维的。因此，编译器将多维数组映射到内存空间中，该空间仅向一个方向扩展。\n\n如果你愿意，也可以像如下所示初始化名为\
  \ `solarPanels` 的数组，它在相应的元素中仍包含相同的值：\n\n点击此处查看代码图像\n\n```cpp\nint solarPanels [2][3]\
  \ = {0, 1, 2, 3, 4, 5};\n```\n\n然而，前面的方法提供了一个更好的例子，因为将多维数组理解为数组的数组更容易被想象和理解。\n\n\
  ***\n\n## 访问多维数组中的元素\n\n将多维数组想象成一个由数组作为元素组成的数组。因此，当处理一个包含三行三列且每个单元都包含整数的二维数组时，请将其想象为正在处理一个包含三个元素的数组，其中每个元素都是一个包含三个整数的数组。\n\
  \n当你需要访问此数组中的一个整数时，你需要使用第一个下标来定位该整数所在的数组，使用第二个下标来定位该数组中的该整数。考虑此数组：\n\n点击此处查看代码图像\n\
  \n```cpp\nint threeRowsThreeColumns [3][3] = {{-501, 205, 2016}, {989, 101, 206},\
  \ {303, 456, 596}};\n```\n\n它的初始化方式可以让你可视化地看到三个数组，每个数组包含三个整数。在这里，值为 `205` 的整数元素位于位置\
  \ `[0][1]`。值为 `456` 的元素位于位置 `[2][1]`。代码列表 4.3 解释了如何访问此数组中的整数元素。\n\n**代码段落 4.3**\
  \ 访问多维数组中的元素\n\n点击此处查看代码图像\n\n***\n\n```cpp\n0: #include <iostream>\n1: using namespace\
