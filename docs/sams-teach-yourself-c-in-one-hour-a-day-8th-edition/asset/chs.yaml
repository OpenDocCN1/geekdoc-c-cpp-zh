  \ 63 行演示了如何调用 `find()` 来定位在第 66 行使用 `erase()` 删除的该条目。\n\n* * *\n\n### 提示\n\n此电话录的实现基于\
  \ STL `set`，因此不允许包含具有相同值的多个条目。如果你需要你的电话录实现允许存储两个同名的人，你应该选择 STL 的 `multiset`。如果 `setContacts`\
  \ 变为一个 `multiset`，之前的代码仍然可以正常工作。为了进一步利用 `multiset` 存储多个相同值条目的的能力，你可以使用 `count()`\
  \ 成员函数来获取持有特定值的数量。\n\n* * *\n\n### 使用 STL `set` 和 `multiset` 的优缺点\n\nSTL `set` 和\
  \ `multiset` 在需要频繁查找的应用程序中具有显著优势，因为它们的内容是有序的，因此定位速度更快。然而，为了提供这种优势，容器需要在插入时对元素进行排序。因此，插入元素会有开销，因为元素是经过排序的——如果你经常需要使用\
  \ `find()` 等功能和函数，这种开销可能是值得的权衡。\n\n`find()` 利用了内部的二叉树结构。这种有序的二叉树结构导致了与 `vector`\
  \ 等顺序容器相比的另一个隐含劣势。在 `vector` 中，迭代器指向的元素（例如由 `std::find()` 操作返回的元素）可以被新值覆盖。但在 `set`\
  \ 中，元素由 `set` 类根据其各自的值进行排序，因此绝不应该使用迭代器覆盖元素，即使这在程序上是可行的。\n\n### STL 哈希集合实现 `std::unordered_set`\
  \ 和 `std::unordered_multiset`\n\nSTL 的 `std::set` 和 STL `std::multiset` 根据 `std::less<T>`\
  \ 或提供的谓词对元素（同时也是键）进行排序。在有序容器中搜索比在像 `vector` 这样的未排序容器中搜索更快，且 `std::sort()` 提供了对数级复杂度。这意味着在\
  \ `set` 中找到元素所花费的时间与 `set` 中的元素数量不是直接正比，而是与其对数成正比。因此，平均而言，在包含 10,000 个元素的集合中搜索的时间是搜索包含\
  \ 100 个元素的集合时间的两倍（因为 $100² = 10000$，或者 $\\log(10000) = 2 \\times \\log(100)$）。\n\
  \n然而，与未排序容器（搜索时间与元素数量直接正比）相比，这种性能的巨大提升有时是不够的。程序员和数学家都在寻求常数插入和排序的可能性，其中一种方法使用了基于哈希的实现，使用哈希函数来确定排序索引。插入到哈希集合中的元素首先由哈希函数评估，哈希函数生成一个唯一索引，即它们被放置的*桶*索引。\n\
  \nSTL 自 C++11 以来提供的哈希集合变体是容器类 `std::unordered_set`。\n\n* * *\n\n### 提示\n\n要使用 STL\
  \ 容器 `std::unordered_set` 或 `std::unordered_multiset`，请包含：\n\n```cpp\n#include<unordered_set>\n\
  ```\n\n* * *\n\n该类的用法与 `std::set` 相比没有太大变化：\n\n点击此处查看代码图像\n\n```cpp\n// 实例化：\nunordered_set<int>\
  \ usetInt;\n\n// 插入一个元素\nusetInt.insert(1000);\n\n// find():\nauto elementFound\
  \ = usetInt.find(1000);\n\nif (elementFound != usetInt.end())\n    cout << *elementFound\
  \ << endl;\n```\n\n然而，`unordered_set` 的一个非常重要的特征是提供了负责决定排序顺序的哈希函数：\n\n点击此处查看代码图像\n\
  \n```cpp\nunordered_set<int>::hasher HFn = usetInt.hash_function();\n```\n\n在考虑各自容器性能后再决定使用\
  \ `std::unordered_set` 或 `std::set` 是最佳的。使用 `std::unordered_set` 或 `std::set` 的决定最好在各自容器的性能之后做出，这涉及到对相似数据进行的测量。列表\
  \ 19.6 展示了 `unordered_set` 的常用方法。\n\n```cpp\n#include<unordered_set>\n#include <iostream>\n\
  using namespace std;\n\ntemplate <typename T>\nvoid DisplayContents(const T& cont)\
  \ {\n    cout << \"Unordered set contains \";\n    for (auto element = cont.begin();\
  \ element != cont.end(); ++element) {\n        cout << *element << \" \";\n    }\n\
  \    cout << \"\\nNumber of elements, size = \" << cont.size() << endl;\n    cout\
  \ << \"Bucket count = \" << cont.bucket_count() << endl;\n    cout << \"Max load\
  \ factor = \" << cont.max_load_factor() << endl;\n    cout << \"Load factor: \"\
  \ << cont.load_factor() << endl;\n}\n\nint main() {\n    unordered_set<int> usetInt{1,\
  \ -3, 989, -1, 2017, 300};\n    DisplayContents(usetInt);\n    usetInt.insert(999);\n\
  \    DisplayContents(usetInt);\n\n    cout << \"Enter int you want to check for\
  \ existence in set: \";\n    int input = 0;\n    cin >> input;\n    auto elementFound\
  \ = usetInt.find(input);\n    if (elementFound != usetInt.end())\n        cout <<\
  \ *elementFound << \" found in set\" << endl;\n    else\n        cout << input <<\
  \ \" not available in set\" << endl;\n\n    return 0;\n}\n```\n\n* * *\n\n输出 ![Image](img/arrow.jpg)\n\
  \n点击此处查看代码图像\n\nUnordered set contains: 1 -3 989 -1 2017 300 \nNumber of elements,\
  \ size = 8\nBucket count = 8\nMax load factor = 1\nLoad factor: 1\n\nUnordered set\
  \ contains: 1 -3 989 -1 2017 300 999 \nNumber of elements, size = 9\nBucket count\
  \ = 64\nMax load factor = 1\nLoad factor: 0.140625\nEnter int you want to check\
  \ for existence in set: -300\n-300 found in set\n\n\n\n\n\n由于哈希通常用于在哈希表中根据键查找值，请参阅第\
  \ 20 节（ch20.html_ch20）中关于 `std::unordered_map` 的“STL Map 类（类）”章节。\n\n`std::unordered_map`\
  \ 是 C++11 中引入的哈希表实现。\n\n## 应当 (DO)\n\n**请记住**，STL `set` 和 `multiset` 容器针对频繁搜索的情况进行了优化。\n\
  \n**请记住**，`std::multiset` 允许存在多个相同值的元素（键），而 `std::set` 仅允许唯一值。\n\n**请使用** `multiset::count(value)`\
  \ 来查找特定 `value` 的元素个数。\n\n**请记记**，`set::size()` 或 `multiset::size()` 可以给你容器中元素的数量。\n\
  \n### 不要 (DON’T)\n\n**不要忘记**为可以收纳在 `set` 或 `multiset` 等容器中的类编写 `operator<` 和 `operator==`。前者成为排序谓词，而后者则用于\
  \ `set::find()` 等函数。\n\n**不要**在频繁插入和低频搜索的场景中使用 `std::set` 或 `std::multiset`。`std::vector`\
  \ 或 `std::list` 更适合此类场景。\n\n## 总结 (Summary)\n\n在本节中，你学习了如何使用 STL `set` 和 `multiset`、它们的重要函数及其特性。你还看到了它们在一个具有搜索和删除功能的简单菜单电话簿中的应用。\n\
  \n## 问答 (Q&A)\n\n问：如何声明一个整数集合，使其按大小降序排序并存储？\n答：`set<int>` 是一个整数的 `set`。它使用默认谓词 `std::less<T>`\
  \ 按升序顺序排序项，可以表示为 `set<int, less<int>>`。要按降序排序，请将 `set` 定义为 `set<int, greater<int>>`。\n\
  \n问：如果在字符串集合中插入两次字符串 \"Jack\"，会发生什么？\n答：`set` 的设计并非用于包含非唯一值。字符串集合将只包含一个 \"Jack\"\
  \ 实例。\n\n问：在前面的示例中，如果我想有两个 \"Jack\" 实例，我应该修改什么？\n答：根据设计，`set` 仅持有唯一值。你需要将容器选择改为\
  \ `multiset`。\n\n问：哪个 `multiset` 成员函数返回特定值的项计数？\n答：`count(value)` 是感兴趣的函数。\n\n问：我使用\
  \ `find()` 函数在 `set` 中找到一个元素并获得指向它的迭代器。我会使用这个迭代器来更改值吗？\n答：不会。某些 STL 实现可能允许用户通过 `find`\
  \ 返回的迭代器更改 `set` 内部元素的值。但并不是正确的做法。指向 `set` 中元素的迭代器应该被视为 `const` 迭代器——即使 STL 实现没有强制执行。\n\
