  \n## 在类和结构体上使用聚合\n\n以下初始化语法被称为*聚合初始化*（aggregate initialization）语法：\n\n点击此处查看代码图像\n\
  \n`Type objectName = {argument1, ..., argumentN};`\n\n或者，从 C++11 开始：\n\n点击此处查看代码图像\n\
  \n`Type objectName {argument1, ..., argumentN};`\n\n聚合初始化可以应用于聚合体，因此理解哪些数据类型属于这一类别是非常重要的。\n\
  \n你已经在 第 4 课，“管理数组和字符串.#ch04.html_ch04)”中的数组初始化中看到过聚合初始化的示例。\n\n点击此处查看代码图像\n\n```cpp\n\
  int myNums[] = { 9, 5, -1 }; // myNums 是 int[3]\nchar hello[6] = { 'h', 'e', 'l',\
  \ 'l', 'o', ' \\0' };\n```\n\n然而，“聚合”（aggregate）一术语并不限于整数或字符等简单类型的数组，它也扩展到了类（因此包括结构体和联合体）。标准对可以称为聚合体的\
  \ `struct` 或 `class` 的规范施加了限制。这些限制根据你所引用的 C++ 标准版本而有所细微差别。尽管如此，可以说：包含公共和非静态数据成员、不包含私有或保护数据成员、不包含虚成员函数、具有无或仅公共继承（即没有私有、保护或虚继承）且没有用户定义构造函数的类/结构体也是聚合体，并可以像聚合体一样进行初始化。\n\
  \n> **提示**\n> 继承将在将在 第 10 Lesson，“实现继承.#ch10.html_ch10)”以及 第 11 Lesson，“多态.#ch11.html_ch11)”中进行详细解释。\n\
  \n因此，下面的 `struct` 符合作为聚合体的前提，因此可以作为聚合体进行初始化：\n\n点击此处查看代码图像\n\n```cpp\nstruct Aggregate1\n\
