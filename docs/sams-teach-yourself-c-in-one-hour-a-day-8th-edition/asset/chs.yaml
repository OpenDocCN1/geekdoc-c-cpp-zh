  \ 像字典一样工作。（提示：`multiset` 应该是一个包含两个字符串的结构：单词和它的含义。）\n3. 通过一个简单的程序演示 `set` 不能接受重复条目，而\
  \ `multiset` 可以。\n\n## 第 20 节. STL Map 类 (Lesson 20. STL Map Classes)\n\n标准模板库 (STL)\
  \ 为程序员提供了容器类，帮助实现需要频繁且快速搜索的应用程序。\n\n本节涵盖：\n- STL `map` 和 `multimap`、`unordered_map`\
  \ 和 `unordered_multimap` 容器如何对你有用\n- 元素的插入、删除和搜索\n- 提供自定义排序谓词\n- 哈希表工作原理的基础\n\n\
  ### STL Map 类简介 (An Introduction to STL Map Classes)\n\n`map` 和 `multimap` 是键值对容器，允许基于键进行查找，如图\
  \ 20.1 所示。\n\n图 20.1：对容器的视觉化说明，每个容器持有一个键和一个值。\n\n`map` 和 `multimap` 之间的区别在于后者允许重复，而前者只能存储唯一键。\n\
  \n为了便于快速搜索，STL 的 `map` 和 `multimap` 实现在内部类似于二叉树。这意味着插入 `map` 或 `multimap` 的元素在插入时就是经过排序的。这也意味着，与\
  \ `vector` 中位置元素可以被另一个元素替换不同，`map` 中给定位置的元素不能被替换。这是因为 `map` 倾向于根据值相对于内部树将其放置在不同的位置。\n\
  \n提示：使用 `std::map` 或 `std::multimap` 类包含头文件：\n\n```cpp\n#include<map>\n```\n\n###\
  \ std::map 和 std::multimap 操作 (Basic std::map and std::multimap Operations)\n\n\
  STL `map` 和 `multimap` 是模板类，在使用它们的任何成员函数之前需要实例化。\n\n#### 实例化 std::map 或 std::multimap\
  \ (Instantiating std::map or std::multimap)\n\n整数作为键、字符串作为值的 `map` 或 `multimap`\
  \ 需要模板类的特化。`map` 的模板实例化需要指定键类型、值类型以及可选的帮助 `map` 类在插入时排序元素的谓词。因此，典型的 `map` 语法如下：\n\
  \n```cpp\nmap <keyType, valueType, std::less<keyType>> mapObj;\nmultimap <keyType,\
  \ valueType, std::less<keyType>> mmapObj;\n```\n\n因此，第三个模板参数是可选的。当你只提供键类型值类型而忽略第三个模板参数时，`std::map`\
  \ 和 `std::multimap` 默认使用 `class::less<>` 定义排序标准。因此，映射整数到字符串的 `map` 或 `multimap`\
  \ 如下：\n\n```cpp\nstd::map<int, string> mapIntToStr;\nstd::multimap<int, string>\
  \ mmapIntToStr;\n```\n\n列表 20.1 更加详细地说明了实例化技术。\n\n列表 20.1：映射 int 键到 string 值的 map\
  \ 和 multimap 对象实例化\n\n```cpp\n#include<map>\n#include<string>\n\ntemplate<typename\
  \ keyType>\nstruct ReverseSort\n{\n    bool operator()(const keyType& key1, const\
  \ keyType& key2)\n    {\n        return (key1 > key2);\n    }\n};\n\nint main ()\n\
  {\n    using namespace std;\n}\n```\n\n\n\n\n```cpp\n// key 类型为 int，类型为 string 的\
  \ map 和 multimap\nmap<int, string> mapIntToStr1;\nmultimap<int, string> mmapIntToStr1;\n\
  \n// 作为另一个对象的拷贝构造 map 和 multimap\nmap<int, string> mapIntToStr2(mapIntToStr1);\n\
  multimap<int, string> mmapIntToStr2(mmapIntToStr1);\n\n// 给另一个 map 或 multimap 的部分构造\
  \ map 和 multimap\nmap<int, string> mapIntToStr3(mapIntToStr1.cbegin(),\n       \
  \                       mapIntToStr1.cend());\n\nmultimap<int, string> mmapIntToStr3(mmapIntToStr1.cbegin(),\n\
  \                                    mmapIntToStr1.cend());\n\n// 使用反向排序谓词的 map\
  \ 和 multimap\nmap<int, string, ReverseSort<int>> mapIntToStr4\n    (mapIntToStr1.cbegin(),\
  \ mapIntToStr1.cend());\n\nmultimap<int, string, ReverseSort<int>> mmapIntToStr4\n\
  \    (mapIntToStr1.cbegin(), mapIntToStr1.cend());\n\nreturn 0;\n}\n```\n\n### 分析\
  \ ![Image](img/arrow.jpg)\n\n首先，请关注第 12–39 行的 `main()` 函数。最简单的整数键到字符串值的 `map` 和\
  \ `multimap` 可以在第 17 行和第 18 行看到。第 25–28 行演示了如何使用另一个容器的值范围作为输入来初始化一个 `map` 或 `multimap`。第\
  \ 31–36 行演示了如何使用自定义的排序标准来实例化 `map` 或 `multimap`。注意，默认排序（在之前的实例化中）使用了 `std::less<T>`，它会按升序排列元素。如果你想更改此行为，可以提供一个实现了了\
  \ `operator()` 的 `class` 或 `struct` 类型的谓词。这样的谓词结构体 `struct ReverseSort` 位于第 3–10\
  \ 行，并已在第 32 行的 `map` 实例化第 35 行的 `multimap` 实例化中使用。\n\n### 在 STL `map` 或 `multimap`\
  \ 中插入元素\n\n`map` 和 `multimap` 中的大多数函数工作方式相似。它们接受相似的参数并返回相似的值类型。你可以通过 `insert` 成员函数在这两种容器中插入元素：\n\
  \n点击此处查看代码\n\n```cpp\nstd::map<int, std::string> mapIntToStr1;\n\n// 使用 make_pair\
  \ 函数插入键值值对\nmapIntToStr.insert (make_pair (-1, \"Minus One\"));\n```\n\n由于这两个容器以键-值对的形式维护元素，你也可以直接提供一个初始化为要插入的键和值的\
  \ `std::pair`：\n\n点击此处查看代码\n\n```cpp\nmapIntToStr.insert (pair <int, string>(1000,\
  \ \"One Thousand\"));\n```\n\n或者，你可以使用类似数组的语法进行插入，这种语法看起来非常用户友好，并通过下标运算符 `operator[]`\
  \ 支持：\n\n点击此处查看代码\n\n```cpp\nmapIntToStr [1000000] = \"One Million\";\n```\n\n你也可以将\
  \ `multimap` 实例化为 `map` 的拷贝：\n\n点击此处查看代码\n\n```cpp\nstd::multimap<int, std::string>\
  \ mmapIntToStr(mapIntToStr.cbegin(),\n                                         \
  \   mapIntToStr.cend());\n```\n\n列表 20.2 展示了各种实例化方法。\n\n## 列表 20.2 使用 `insert()`\
  \ 重载和通过 `operator[]` 的数组语义在 `map` 和 `multimap` 中插入元素\n\n点击此处查看代码\n\n```cpp\n#include\
  \ <map>\n#include <iostream>\n#include <string>\n\nusing namespace std;\n\n// 定义\
  \ map 和 multimap 类型以提高可读性\ntypedef map <int, string> MAP_INT_STRING;\ntypedef multimap\
  \ <int, string> MMAP_INT_STRING;\n\ntemplate <typename T>\nvoid DisplayContents\
  \ (const T& cont) {\n    for (auto element = cont.cbegin(); element != cont.cend();\
  \ ++ element) {\n        cout << element->first << \" -> \" << element->second <<\
  \ endl;\n    }\n    cout << endl;\n}\n\nint main () {\n    MAP_INT_STRING mapIntToStr;\n\
  \n    // 使用 value_type 向 map 插入键值对\n    mapIntToStr.insert (MAP_INT_STRING::value_type\
  \ (3, \"Three\"));\n\n    // 使用 make_pair 插入对\n    mapIntToStr.insert (make_pair\
  \ (-1, \"Minus One\"));\n\n    // 插入 pair 对象\n    mapIntToStr.insert (pair <int,\
  \ string>(1000, \"One Thousand\"));\n\n    // 使用类似数组的语法插入键值对\n    mapIntToStr [1000000]\
  \ = \"One Million\";\n\n    cout << \"The map contains \" << mapIntToStr.size();\n\
  \    cout << \" key-value pairs. They are: \" << endl;\n    DisplayContents(mapIntToStr);\n\
  \n    // 实例化一个作为 map 拷贝的 multimap\n    MMAP_INT_STRING mmapIntToStr(mapIntToStr.cbegin(),\n\
  \                                 mapIntToStr.cend());\n\n    // insert 函数对 multimap\
  \ 同样有效\n    // multimap 可以存储重复项 - 插入一个重复项\n    mmapIntToStr.insert (make_pair (1000,\
  \ \"Thousand\"));\n\n    cout << endl << \"The multimap contains \" << mmapIntToStr.size();\n\
  \    cout << \" key-value pairs. They are: \" << endl;\n    cout << \"The elements\
  \ in the multimap are: \" << endl;\n    DisplayContents(mmapIntToStr);\n\n    //\
  \ insert 函数对 multimap 同样有效\n    // multimap 可以存储重复项 - 插入一个重复项\n    // ... (此处省略重复的输出逻辑，保持与原文结构一致)\n\
  \    cout << endl << \"The multimap contains \" << mmapIntToStr.size();\n    cout\
  \ << \"The elements in the multimap are: \" << endl;\n    DisplayContents(mmapIntToStr);\n\
  \n    return 0;\n}\n```\n*(注：由于原文列表 20.2 存在大量完全重复的输出代码，译文已保留其结构并进行了对应翻译。)*\n\n###\
  \ 在 STL `map` 中查找元素\n\n关联式容器（如 `map` 和 `multimap`）提供了一个名为 `find()` 的成员函数，允许你根据键查找值。`find()`\
  \ 的结果的结果始终是一个迭代器：\n\n```cpp\nmultimap <int, string>::const_iterator pairFound =\
  \ mapIntToStr.find(key);\n```\n\n你会首先检查此迭代器以确认 `find()` 是否成功，然后使用它来访问找到的值：\n\n```cpp\n\
  if (pairFound != mapIntToStr.end())\n{\n    cout << \"Key \" << pairFound->first\
  \ << \" points to Value: \" << pairFound->second;\n}\n```\n\n\n\n\n\n```cpp\ncout\
  \ << pairFound->second << endl;\n}\nelse\n    cout << \"Sorry, pair with key \"\
  \ << key << \" not in map\" << endl;\n```\n\n***\n\n### 提示\n如果你使用的是符合 C++11 标准的编译器，迭代器的声明可以使用关键字\
  \ `auto` 来简化：\n\n点击此处查看代码图片\n\n```cpp\nauto pairFound = mapIntToStr.find(key);\n\
  ```\n\n编译器通过从 `map::find()` 声明的返回值中自动推断迭代器的类型。\n\n***\n\nListing 20.3 中的示例演示了 `multimap::find()`\
  \ 的用法。\n\n**列表 20.3** 使用 `find()` 成员函数在 `map` 中定位键值对\n\n点击此处查看代码图片\n\n***\n\n```cpp\n\
