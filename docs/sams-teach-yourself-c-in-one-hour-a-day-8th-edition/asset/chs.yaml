  \ 和位异或 (`^`) 运算符\n\n逻辑运算符与位运算符之间的区别在于，位运算符不返回布尔结果。相反，它们提供一个结果，其中每个位都通过在操作数的位上执行该运算符来控制。C++\
  \ 允许你在位模式下执行非、或、与和异或（即 XOR）操作，你可以通过使用 `~` 取反、使用 `|` 进行或运算、使用 `&` 进行与运算以及使用 `^` 进行异或运算来操作单个位。后三个是针对你选择的数字（通常是位掩码）执行的。\n\
  \n某些位操作在整数包含位位的情况下非常有用——例如，每个位可以指定某个标记的状态。因此，一个 32 位的整数可以用来携带 32 个布尔标记。列表 5.7 演示了位运算符的使用。\n\
  \n**列表 5.7** 演示使用位运算符对整数中的单个位执行非、与、或和异或\n\n点击此处查看代码图像\n\n* * *\n\n```\n0: #include\
  \ <iostream>\n1: #include <bitset>\n2: using namespace std;\n3:\n4: int main()\n\
  5: {\n6:     cout << \"Enter a number (0 - 255): \";\n7:     unsigned short inputNum\
  \ = 0;\n8:     cin >> inputNum;\n9:\n10:     bitset<8> inputBits (inputNum);\n11:\
  \     cout << inputNum << \" in binary is \" << inputBits << endl;\n12:\n13:   \
  \  bitset<8> bitwiseNOT = (~inputNum);\n14:     cout << \"Logical NOT ~\" << endl;\n\
  15:     cout << \"~\" << inputBits  << \" = \" << bitwiseNOT << endl;\n16:\n17:\
  \     cout << \"Logical AND, & with 00001111\" << endl;\n18:     bitset<8> bitwiseAND\
  \ = (0x0F & inputNum);// // 0x0F is hex for 0001111\n19:     cout << \"0001111 &\
  \ \" << inputBits  << \" = \" << bitwiseAND << endl;\n20:\n21:     cout << \"Logical\
  \ OR, | with 00001111\" << endl;\n22:     bitset<8> bitwiseOR = (0x0F | inputNum);\n\
  23:     cout << \"00001111 | \" << inputBits  << \" = \" << bitwiseOR << endl;\n\
  24:\n25:     cout << \"Logical XOR, ^ with 00001111\" << endl;\n26:     bitset<8>\
  \ bitwiseXOR = (0x0F ^ inputNum);\n27:     cout << \"00001111 ^ \" << inputBits\
  \  << \" = \" << bitwiseXOR << endl;\n28:\n29:     return 0;\n30: }\n```\n\n* *\
  \ *\n\n输出 ![Image](img/arrow.jpg)\n\n点击此处查看代码图像\n\n输入一个数字 (0 - 255): 181\n\n181\
