  \ (友元)\n\n类不允许外部访问其声明为 `private` 的数据成员和方法。对于声明为友元类或友元函数的类和函数，这一规则被豁免，如 Listing 9.14\
  \ 所示，使用了关键字 `friend`。\n\n**列表 9.14** 使用 `friend` 关键字允许外部函数 `DisplayAge()` 访问私有数据成员\n\
  \n点击此处查看代码图片\n\n* * *\n\n```cpp\n  0: #include <iostream>\n  1: #include <string>\n\
