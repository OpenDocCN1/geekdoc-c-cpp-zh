  \n### 分析 ![Image](img/arrow.jpg)\n\n尽管 列表 10.2 的输出与 列表 10.1 相同，但第 3–16 行定义的 `class\
  \ Fish` 发生了许多根本性的变化。第一个最明显的变化是，布尔成员 `Fish::isFreshWaterFish` 现在是一个 `protected`（保护）属性，因此如第\
  \ 51 行所示，无法通过 `main()` 访问（取消注释以查看编译器错误）。尽管如此，这个具有访问修饰符 `protected` 的 `Fish` 成员仍然被派生类\
  \ `Tuna` 和 `Carp` 访问，如第 23 行和第 32 行所示。这个小程序有效地演示了使用 `protected` 关键字，以确保需要被继承的基类属性不会从类层次结构外部访问。\n\
  \n这是面向对象编程的一个重要方面，它结合了数据抽象和继承，确保了派生类可以安全地继承基类属性，而这些属性不会被该层次系统之外的任何人篡改。\n\n#### 基类初始化——向基类传递参数\n\
  \n如果基类包含一个在实例化时需要参数的重载构造函数会怎样？在构造派生类时，如何实例化这样一个基类呢？线索在于使用初始化列表，并通过派生类的构造函数调用适当的基类构造函数，如代码代码所示：\n\
  \n点击此处查看代码图像\n\n```cpp\nclass Base\n{\npublic:\n    Base(int someNumber) // 重载构造函数\n\
  \    {\n        // 使用 someNumber\n    }\n};\n\nclass Derived: public Base\n{\npublic:\n\
  \    Derived(): Base(25)  // 使用参数 25 实例化 Base\n    {\n        // 派生类构造函数代码\n   \
  \ }\n};\n```\n\n这种机制在 `class Fish` 中非常有用，其中通过向 `Fish` 的构造函数提供一个布尔输入参数来初始化 `Fish::isFreshWaterFish`，这个`基类\
  \ Fish` 可以确保强制每个派生类都说明 `Fish` 是淡水鱼还是咸水鱼，如 列表 10.3 所示。\n\n**列表 10.3** 使用初始化列表的派生类构造函数\n\
  \n点击此处查看代码图像\n\n```cpp\n#include <iostream>\nusing namespace std;\n\nclass Fish\n\
  {\nprotected:\n    bool isFreshWaterFish; // 派生类可见\n\npublic:\n    // Fish 构造函数\n\
  \    Fish(bool isFreshWater) : isFreshWaterFish(isFreshWater){}\n\n    void Swim()\n\
  \    {\n        if (isFreshWaterFish)\n            cout << \"Swims in lake\" <<\
  \ endl;\n        else\n            cout << \"Swims in sea\" << endl;\n    }\n};\n\
  \nclass Tuna: public Fish\n{\npublic:\n    Tuna(): Fish(false) {} // 构造函数基类\n};\n\
  \nclass Carp: public Fish\n{\npublic:\n    Carp(): Fish(true) {}\n};\n\nint main()\n\
  {\n    Carp myLunch;\n    Tuna myDinner;\n\n    cout << \"About my food\" << endl;\n\
  \n    cout << \"Lunch: \";\n    myLunch.Swim();\n\n    cout << \"Dinner: \";\n \
  \   myDinner.Swim();\n\n    return 0;\n}\n```\n\n输出 ![Image](img/arrow.jpg)\n\n\
  点击此处查看代码图像\n\n关于我的食物\n\n午餐: 在湖中游泳\n\n晚餐: 在海洋中游泳\n\n### 分析 ![Image](img/arrow.jpg)\n\
  \n`Fish` 现在有了一个接受默认参数并初始化 `Fish::isFreshWaterFish` 的构造函数。因此，创建 `Fish` 对象的唯一可能是通过提供一个初始化该保护成员的参数。通过这种方式，`class\
  \ Fish` 确保了保护成员不会包含随机值，特别是当派生类忘记设置它时。派生类 `Tuna` 和 `Carp` 现在被强制定义一个构造函数，用正确的参数（true\
  \ 或 false，表示淡水或其他）来实例化基类 `Fish` 实例，分别如第 24 行和第 30 行所示。\n\n### 注意\n\n在 列表 10.3 中，你看到尽管布尔成员变量\
  \ `Fish::isFreshWaterFish` 是 `protected` 的，但派生类从未直接访问过它，因为该变量是通过 `Fish` 的构造函数设置的。\n\
  \n为了确保最大的安全性，如果派生类不需要访问基类属性，请记住将属性标记为 `private`。因此，列表 10.3 的优版本会将 `Fish::isFreshWaterFish`\
  \ 设置为 `private`，因为它仅供基类 `Fish` 使用。参见 列表 10.4。\n\n#### 派生类重写基类方法\n\n如果 `class Derived`\
  \ 实现了与与其继承的 `class Base` 相同的返回值和签名的函数，它实际上重写了 `class Base` 中的该方法，如下代码所示：\n\n点击此处查看代码图像\n\
  \n```cpp\nclass Base\n{\npublic:\n    void DoSomething()\n    {\n        // 实现代码...\
  \ 执行某事\n    }\n};\n\nclass Derived:public Base\n{\npublic:\n    void DoSomething()\n\
  \    {\n        // 实现代码... 执行其他事\n    }\n};\n```\n\n因此，如果使用 `Derived` 实例调用 `DoSomething()`，它将不会调用\
  \ `class Base` 中的功能。\n\n如果类 `Tuna` 和 `Carp` 实现了它们自己的且在基类 `Fish::Swim()` 中存在的 `Swim()`\
