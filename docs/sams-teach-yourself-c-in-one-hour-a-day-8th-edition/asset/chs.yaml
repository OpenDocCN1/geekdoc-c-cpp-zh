  \n\n\n\n![Image](img/pub.jpg)\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n来自 Visual\
  \ C++ 编译器的错误信息非常详细：它告诉你是哪个错误的文件名、缺失分号的行号（本例为 6），以及错误描述及其错误编号（本例为 C2143）。虽然标点符号是从第五行删除的，但报告的错误在另一行，因为编译器在分析\
  \ return 语句时才发现错误明显，该语句表明在前一个语句在 return 之前本应该结束。\n\n\n\n\n该语言最近的重大更新是作为 2011 年批准的\
  \ ISO 标准的一部分发布的，俗称为 `C++11`。2014 年发布的 `C++14` 相比 `C++11` 具有细微的改进和修正。\n\n首次在 `C++11`\
  \ 中引入的如 `auto` 等功能允许你定义一个类型由编译器自动推断的变量，在不牺牲类型安全的前提下精简了冗长的声明。`C++14` 将相同的功能也扩展到了返回类型。`Lambda\
  \ 函数`是没有名字的函数。它们允许你在不编写长类定义的情况下编写紧凑的函数对象，显著减少了代码行数。\n\nC++ 为程序员承诺了编写可移植、多线程且符合标准的\
  \ C++ 应用程序的能力。这些应用程序在正确构建后，支持并发执行范式，并且当用户通过增加 CPU 核心数来提升硬件配置能力时，在性能扩展方面处于良好的位置。这些是本书贯讨论的\
  \ C++ 众多改进中的一些。\n\n下一次重大修订（称为 `C++17`）中预期的新语言特性，将在书末的第 29 节 “展望未来”中介绍。\n\n### 总结\n\
  \n在本节中，你学习了如何编写、编译、链接和执行你的第一个 C++ 程序。本节还简要概述了 C++ 的演变，并展示了标准的有效性，证明同一个程序可以在不同的操作系统使用不同的编译器进行编译。\n\
  \n### 问答\n\n**Q 我可以忽略编译警告消息吗？**\n\n**A** 在某些情况下，编译器会发出警告消息。警告与错误的区别在于，涉及的行在语法上是正确的且可以编译的。然而，可能存在更好的写法，良好的编译器会发出警告并附带修复建议。\n\
  \n建议的修正可能意味着更安全的编程方式，或者让你的应用程序能够处理非拉丁语言的字符和符号。你应该重视这些警告并相应地改进你的程序。不要屏蔽警告消息，除非你确定它们误报。\n\
  \n**Q 解释型语言与编译语言有什么区别？**\n\n**A** 像 Windows Script 等语言是解释型的。没有编译步骤。解释型语言使用解释器直接读取脚本文本文件（代码）并执行所需的操作。因此，你需要在执行脚本的机器上安装解释器；结果性能通常会受到影响，因为解释器在微处理器和编写的代码之间充当运行时翻译器的角色。\n\
  \n**Q 什么是运行时错误？它们与编译时错误有什么区别？**\n\n**A** 在执行应用程序时发生的错误称为 `运行时错误`。你可能在旧版本的 Windows\
  \ 上遇到过臭名昭著的“访问冲突”（Access Violation），这就是运行时错误。编译时错误不会到达用户，它是语法问题的指示；它们阻止程序员生成可执行文件。\n\
  \n### 工作坊\n\n工作坊提供了测试题来帮助你巩固对所涵盖内容的理解，并提供了练习让你获得使用所学内容的经验。在查看附录 E 中的答案之前，尝试回答测试和练习题，并在继续下一节之前确保你理解了答案。\n\
  \n#### 测试题\n\n**1.** 解释器和编译器之间有什么区别？\n\n**2.** 链接器是做什么的？\n\n**3.** 正常开发周期中的步骤有哪些？\n\
  \n#### 练习题\n\n**1.** 查看以下程序，并在不运行它的情况下尝试猜测它的功能：\n\n点击此处查看代码图片\n\n```cpp\n1: #include\
  \ <iostream>\n2: int main()\n3: {\n4:    int x = 8;\n5:    int y = 6;\n6:    std::cout\
  \ << std::endl;\n7:    std::cout << x - y << \" \" << x * y << \" \" << x + y;\n\
  8:    std::cout << std::endl;\n9:    return 0;\n10: }\n```\n\n**2.** 输入练习 1 中的程序，然后进行编译和链接。它是做什么的？它的结果和你猜想的一样吗？\n\
  \n**3.** 你认为这个程序中的错误是什么：\n\n点击此处查看代码图片\n\n```cpp\n1: include <iostream>\n2: int\
  \ main()\n3: {\n4:     std::cout << \"Hello Buggy World \\n\";\n5:     return 0;\n\
  6: }\n```\n\n**4.** 修复练习 3 程序中的错误。\n\n## 2. C++ 程序的结构分析\n\nC++ 程序组织成包含成员变量的类。本书的大部分内容都在解释这些部分，但为了直整体感受，你必须看一个简单的程序。\n\
  \n在本节中，你将学习：\n- C++ 程序的组成\n- 各部分如何协同工作\n- 基础输入输出\n\n### Hello World 的组成\n\n这个 C++\
  \ 程序可以大致分为两部分：以 `#` 开头的预处理器指令和以 `main()` 开头的程序主体。\n\n**列表 2.1** `HelloWorld.cpp`：\n\
  \n```cpp\n1: // Preprocessor directive includes iostream\n2: #include <iostream>\n\
  3:\n4: // Start of your program: function main()\n5: int main()\n6: {\n7:     /*\
  \ Write to the screen */\n8:     std::cout << \"Hello World\" << std::endl;\n9:\n\
  10: // Return a value to the OS\n11: return 0;\n12: }\n```\n\n注意：第 1、4、7 和 10 行以\
  \ `//` 或 `/*` 开头，被称为*注释*，会被编译器忽略。注释将在下一节中进行详细讨论。\n\n### 预处理器指令 `#include`\n\n如名所示，*预处理器*是一个在实际开始之前运行的工具。预处理器指令是给预处理器的命令，始终以井号\
  \ `#` 开头。在列表 2.1 的第 2 行中，`#include <filename>` 告诉预处理器获取文件（在此情况下为 `iostream`）的内容并包含在指令所在的行。`iostream`\
  \ 是标准头文件，允许使用第 8 行中的 `std::cout` 从而在屏幕上显示“Hello World”。换句话说，编译器能够编译包含 `std::cout`\
  \ 的第 8 行，是因为我们指示预处理器在第 2 行包含 `std::cout` 的定义。\n\n注意：专业编写的 C++ 包含开发环境提供的标准头文件以及程序员创建的头文件。复杂的应用程序通常在多个文件中编写，其中某些文件需要其他文件。因此，如果\
  \ FileA 中声明的项需要在 FileB 中使用，你需要在 FileB 中包含前者。你通常通过在 FileA 中插入以下 `include` 语句来实现这一点：\n\
  \n```cpp\n#include \"...relative path to FileB\\FileB\"\n```\n\n\n\n\n在包含自编写的头文件时，我们在此例中使用引号而不是角括号。`<\
  \ >` 括号通常用于包含标准头文件。\n\n* * *\n\n### 程序的主体 `main()`\n\n在预处理器指令之后是程序的主体，其特征是函数 `main()`。C++\
  \ 程序的执行始终从这里开始。按照标准惯例，函数 `main()` 声明时前面会带有一个 `int`。`int` 是 `main()` 函数的返回值类型，代表整数（integer）。\n\
  \n* * *\n\n### 注意\n\n在许多 C++ 应用程序中，你会发现 `main()` 函数的变体，其形式如下：\n\n点击此处查看代码图像\n\n\
  ```\nint main (int argc, char* argv[])\n```\n\n这同样符合标准且是可以接受的，因为 `main` 返回 `int`。括号内的内容是提供给程序的“参数”。该程序允许用户通过命令行参数启动它，例如：\n\
  \n点击此处查看代码图像\n\n```\nprogram.exe /DoSomethingSpecific\n```\n\n`/DoSomethingSpecific`\
  \ 是操作系统作为参数传递给该程序的参数，将在 `main (int argc, char* argv[])` 中进行处理。\n\n* * *\n\n####\
  \ 我们来讨论第 8 行，它实现了此程序的实际目的！\n\n点击此处查看代码图像\n\n```\nstd::cout << \"Hello World\" <<\
  \ std::endl;\n```\n\n`cout`（“console-out”，读也读作 see-out）是将“Hello World”写入显示控制台（即屏幕）的语句。`cout`\
  \ 是定义在标准 `std` 命名空间中的一个流（stream），你在这一行中所做的操作是使用流插入运算符 `<<` 将文本 `\"Hello World\"\
  ` 放入此流中。`std::endl` 用于结束一行，将其插入流中类似于插入一个回车符。请注意，每当需要向流中插入一个新实体时，都将使用流插入运算符 `<<`。\n\
  \nC++ 流的优点是，不同类型的流支持相似的流语义，以便用相同的文本执行不同的操作。例如，插入到文件而不是控制台将对 `std::fstream` 上使用相同的插入运算符\
  \ `<<`，而不是 `std::cout`。因此，处理流变得非常直观，而且当你习惯了某种流（如 `cout`，它将文本写入控制台）时，你会发现处理其他流（如\
  \ `fstream`，它帮助将文件保存到磁盘）变得简单。\n\n流将在第 27 节](#ch27.html_ch27）“使用流进行输入和输出”中进行详细讨论。\n\
  \n* * *\n\n### 注意\n\n实际文本（包括引号 `\"Hello World\"`）被称为字符串字面量（string literal）。\n\n\
  * * *\n\n#### 返回值\n\n除非显式指定，否则 C++ 中的函数需要返回值。`main()` 也是一个函数，并且始终返回一个整数。这个整数值返回给操作系统（OS），取决于你的应用程序的性质，它可以非常有用，因为大多数操作系统都提供了查询自然结束的应用程序返回值的能力。在许多情况下，一个应用程序由另一个应用程序启动，父应用程序（启动方）想要知道子应用程序（被启动方）是否已成功完成任务。程序员可以使用\
  \ `main()` 的返回值向父应用程序传递成功或错误状态。\n\n* * *\n\n### 注意\n\n按照惯例，程序员在成功时返回 0，在错误时返回 -1。然而，返回值是一个整数，程序员有灵活性利用整数返回值的范围传递许多不同的成功或失败状态。\n\
  \n* * *\n\n* * *\n\n### 警告\n\nC++ 是区分大小大小的。因此，如果你写 `Int` 而不是 `int`，或者写 `Std::Cout`\
  \ 而不是 `std::cout`，预计编译将失败。\n\n* * *\n\n### 命名空间的概念\n\n你在程序中使用 `std::cout` 而不仅仅是\
  \ `cout` 的原因是你想要调用的对象（`cout`）位于标准（`std`）命名空间中。\n\n那么，命名空间到底是什么？\n\n假设你在调用 `cout`\
  \ 时没有使用命名空间限定符，并假设 `cout` 存在于知的两个位置——编译器应该调用哪一个？这会导致冲突，编译自然会失败。这正是命名空间派上用场的地方。命名空间是赋予代码部分的名称，有助于减少潜在的命名冲突。通过调用\
  \ `std::cout`，你是在告诉编译器使用 `std` 命名空间中提供的那个唯一的 `cout`。\n\n* * *\n\n### 注意\n\n你使用 `std`（读作“standard”）命名空间来调用由\
  \ ISO 标准委员会批准的函数、流和工具。\n\n* * *\n\n许多程序员发现，在使用 `cout` 以及其中包含的其他类似功能时，反复向代码中添加 `std`\
  \ 命名空间限定符是很繁琐的。列表 2.2](#ch02.html_ch02list02）所示的 `using namespace` 声明可以帮助避免这种重复。\n\
  \n**列表 2.2** `using namespace` 声明\n\n点击此处查看代码图像\n\n* * *\n\n```\n// 预处理器指令\n#include\
  \ <iostream>\n\n// 程序开始\nint main() {\n    // 告诉编译器使用命名空间\n    using namespace std;\n\
  \n    // 写入屏幕\n    cout << \"Hello World\" << std::endl;\n\n    // 返回给操作系统\n   \
  \ return 0;\n}\n```\n\n* * *\n\n分析 ![Image](img/arrow.jpg)\n\n列表 2.2](#ch02.html_ch02list02)\
  \ 中的第 8 行现在被列表 2.3](#ch02.html_ch02list03) 中的第 7 和 8 行取代，在那里没有包含命名空间。`using namespace\
  \ std` 和 `using std::cout` 的区别在于，前者允许 `std` 命名空间中的所有对象（`cout`、`cin` 等）无需显式包含即可使用。后者无需显式区分命名空间的便利性仅限于\
  \ `std::cout` 和 `std::endl`。\n\n### C++ 代码中的注释\n\n列表 2.3](#ch02.html_ch02list03）中的第\
  \ 1、4、10 和 13 行包含了语言文本（在本例中为英语），但不会影响程序的编译。它们也不会改变程序的输出。这些行被称为注释。编译器会忽略注释，程序员经常用它们来解释代码。\n\
  \nC++ 支持两种风格注释：\n\n![Image](img/square.jpg) `//` 表示注释的开始，有效到该行结束。例如：\n\n点击此处查看代码图像\n\
  \n```\n// 这是一个注释 – 不会被编译\n```\n\n![Image](img/square.jpg) `/*` 后面跟 `*/` 表示包含的文本是注释，即使它跨越了行：\n\
  \n点击此处查看代码图像\n\n```\n/* 这是一个注释\n\n它跨越了两行 */\n```\n\n\n\n\n\n程序员需要解释自己的代码这看起来可能很奇怪，但程序越大，或者参与某个特定模块的程序员越多，编写易于理解的代码就越重要。注释可以帮助程序员记录正在做什么，以及为什么要以这种特定的方式这样做。\n\
  \n* * *\n* * *\n\n## 要做的 (DO)\n\n- **务必**添加注释来解释复杂算法和程序中复杂部分的原理。\n- **务必**以其他程序员可以理解的风格编写注释。\n\
  \n* * *\n* * *\n\n### 不要 (DON’T)\n\n- **不要**使用注释来解释或重复显而易见的内容。\n- **不要**忘记，添加注释并为编写晦涩的代码辩护。\n\
  - **不要**忘记，当代码被修改时，注释可能也需要更新。\n\n* * *\n* * *\n\n### C++ 中的函数\n\n函数允许你将应用程序的内容划分为功能单元，并可以按照你选择的顺序调用这些单元。函数在被调用时，通常会向调用者/调用函数返回一个值。最著名的函数当然是\
  \ `int main()`。编译器将其识别为 C++ 应用程序的起点，并且必须返回一个 `int`（即整数）。\n\n作为程序员，你有选择且通常有需要编写你自己的函数。列表\
  \ 2.4\n\n* * *\n\n```\n1: #include <iostream>\n2: using namespace std;\n3:\n4: //\
  \ 一个函数\n5: int DemoConsoleOutput();\n6:\n7: int main()\n8: {\n9:     // 调用，即触发函数\n\
  10:     DemoConsoleOutput();\n11:\n12:     return 0;\n13: }\n14:\n15: // 定义，即实现之前声明的函数\n\
  16: int DemoConsoleOutput()\n17: {\n18:     cout << \"This is a simple string literal\"\
  \ << endl;\n19:     cout << \"Writing number five: \" << 5 << endl;\n20:     cout\
  \ << \"Performing division 10 / 5 = \" << 10 / 5 << endl;\n21:     cout << \"Pi\
  \ when approximated is 22 / 7 = \" << 22 / 7 << endl;\n22:     cout << \"Pi is 22\
  \ / 7 = \" << 22.0 / 7 << endl;\n23:\n24:     return 0;\n25: }\n```\n\n* * *\n\n\
  输出 ![Image](img/arrow.jpg)\n\n点击此处查看代码图像\n\nThis is a simple string literal\nWriting\
  \ number five: 5\nPerforming division 10 / 5 = 2\nPi when approximated is 22 / 7\
  \ = 3\nPi is 22 / 7 = 3.14286\n\n分析 ![Image](img/arrow.jpg)\n\n第 5 行、10 行以及 16 行到\
  \ 25 行是关注的重点。第 5 行被称为*函数声明*，它基本上告诉编译器你想要创建一个名为 `DemoConsoleOutput()` 的函数，它返回一个 `int`（整数）。此声明允许编译器编译第\
  \ 10 行，该行在 `main()` 中调用了 `DemoConsoleOutput()`。编译器假设*定义*（即函数的实现）将会出现，它在随后的第 16 行到\
  \ 25 行中出现了。\n\n此函数实际上演示了 `cout` 的功能。注意它不仅像在之前的示例中显示“Hello World”那样打印文本，还打印了简单算术运算的结果。第\
  \ 21 行和第 22 行都尝试显示 pi (22 / 7) 的结果，但后者更准确，这仅仅是因为通过将 22.0 除以 7，你告诉编译器将结果视为实数（在 C++\
  \ 术语中 `float`）而不是整数。\n\n注意，你的函数按照第 5 行声明的那样要求返回一个整数，并返回了 0。同样，`main()` 也返回了 0。鉴于\
  \ `main()` 已将其所有活动委托给了函数 `DemoConsoleOutput()`，更明智的做法是在从 `main()` 返回时使用函数的返回值，如\
  \ 列表 2.5 所示。\n\n**列表 2.5** 使用函数的返回值\n\n点击此处查看代码图像\n\n* * *\n\n```\n1: #include <iostream>\n\
  2: using namespace std;\n3:\n4: // 一个函数\n5: int DemoConsoleOutput();\n6:\n7: int\
  \ main()\n8: {\n9:     // 调用，即触发函数\n10:     DemoConsoleOutput();\n11:\n12:     return\
  \ 0;\n13: }\n14:\n15: // 定义，即实现之前声明的函数\n16: int DemoConsoleOutput()\n17: {\n18:\
  \     cout << \"This is a simple string literal\" << endl;\n19:     cout << \"Writing\
  \ number five: \" << 5 << endl;\n20:     cout << \"Performing division 10 / 5 =\
  \ \" << 10 / 5 << endl;\n21:     cout << \"Pi when approximated is 22 / 7 = \" <<\
  \ 22 / 7 << endl;\n22:     cout << \"Pi is 22 / 7 = \" << 22.0 / 7 << endl;\n23:\n\
  24:     return 0;\n25: }\n```\n（注：提供的文本包含重复/乱码。） 使用 `std::cin` 基础输入和使用 `std::cout`\
  \ 输出\n\n你的计算机允许你以各种形式与运行的应用程序交互，显示在屏幕上、打印在纸上或简单的保存到文件系统中。本节讨论了 C++ 最简单的输入输出——使用控制台。\n\
  \n你使用 `std::cout`（读作“standard out”）将文本数据写入控制台，并使用 `std::cin`（“standard in”）从控制台读取文本和数字。事实上，在屏幕上显示“Hello\
  \ World”时，你已经遇到过 `cout`，如 列表 2.1 所示：\n\n点击此处查看代码图像\n\n```\n8: std::cout << \"Hello\
  \ World\" << std::endl;\n```\n\n该语句显示 `cout` 后面跟着插入运算符 `<<`（有助于将数据插入输出流中），后面是待插入的字符串字面量“Hello\
  \ World”，最后是形式为 `std::endl`（读作“standard end line”）的换行。\n\n`cin` 的用法也很简单，由于 `cin`\
  \ 用于输入，因此它伴随着你想要存储输入数据的变量：\n\n```cpp\nstd::cin >> Variable;\n```\n\n因此，`cin` 后面跟着提取运算符\
  \ `>>`（从输入流中提取数据），其后面是需要存储数据的变量。如果用户输入需要存储在两个包含由空格分隔数据的变量中，那么可以使用一个语句完成：\n\n点击此处查看代码图像\n\
  \n```cpp\nstd::cin >> Variable1 >> Variable2;\n```\n\n注意，`cin` 也可以用于用户的文本以及数字输入，如\
  \ 列表 2.6 所示。\n\n### 使用函数组织代码\n\n这些概念将在 7 中更详细地介绍。\n\n\n\n\n\n```cpp\n#include <iostream>\n\
  #include <string>\nusing namespace std;\n\nint main()\n{\n    // 声明一个用于存储整数的变量\n\
  \    int inputNumber;\n\n    cout << \"Enter an integer: \";\n\n    // 存储用户输入的整数\n\
  \    cin >> inputNumber;\n\n    // 文本也是，即字符串数据\n    cout << \"Enter your name: \"\
  ;\n    string inputName;\n    cin >> inputName;\n\n    cout << inputName << \" entered\
  \ \" << inputNumber << endl;\n\n    return 0;\n}\n```\n\n### 输出 ![Image](img/arrow.jpg)\n\
  \n点击此处查看代码图像\n\nEnter an integer: 2017\nEnter your name: Siddhartha\nSiddhartha\
  \ entered 2017\n\n### 分析 ![Image](img/arrow.jpg)\n\n第 8 行显示了如何声明一个名为 `inputNumber`\
  \ 的变量来存储 `int` 类型的数据。第 10 行使用 `cout` 要求用户输入一个数字，第 13 行使用 `cin` 将输入的数字存储在整数变量中。同样的练习也用于存储用户的姓名，当然，它不能存储在整数中，而是存储在第\
  \ 17 行和第 18 行所示的名为 `string` 的不同类型中。在第 2 行中包含 `<string>` 的目的是为了稍后在 `main()` 函数中使用\
  \ `string` 类型。最后第 20 行，使用 `cout` 语句显示输入的名称、数字以及一段中间文本，以输出 `Siddhartha entered 2017`。\n\
  \n这是一个关于 C++ 中基本输入和输出如何运作的简单示例。如果你对变量的概念还不清楚，不要担心，因为它在接下来的第 3 节“使用变量、声明常量](#ch03.html_ch03)”中有详细的解释。\n\
  \n### 注意事项\n\n如果在执行列表 2.6 时，我输入了几个单词作为名字（例如：Siddhartha Rao），`cin` 仍然只会在字符串中存储第一个单词“Siddhartha”。要存储整行内容，请使用在第\
  \ 4 节“管理数组和字符串](#ch04.html_ch04)”中的列表 4.7 中讨论过的 `getline()` 函数。\n\n### 总结\n\n本节介绍了简单\
  \ C++ 程序的各个部分。你理解了 `main()` 是什么，接触了命名空间，并学习了控制台输入输出的基础。你可以在编写的每个程序中使用许多内容。\n\n###\
  \ 问答 \n\n**Q `#include` 的作用是什么？**\n\n**A** 这是一个给预处理器的指令，会在你调用编译器时运行。此特定指令会将 `#include`\
  \ 之后 `<>` 中指定的文件的内容插入到该行，就像在你的源代码该位置输入过的一样。\n\n**Q `//` 注释和 `/*` 注释之间有什么区别？**\n\n\
  **A** 双斜杠注释（`//`）在行尾结束。星号斜杠注释（`/*`）一直有效，直到出现结束注释标记（`*/`）。双斜杠注释也被称为单行注释，而星号斜杠注释通常被称为多行注释。记住，即使是函数的结束也不会终止星号斜杠注释；你必须放置结束注释标记，否则你将收到编译错误。\n\
  \n**Q 什么时候你需要编写命令行参数？**\n\n**A** 为了提供允许用户更改程序行为的选项。例如，Linux 中的 `ls` 命令或 Windows\
  \ 中的 `dir` 命令允许你查看当前目录或文件夹中的内容。要查看另一个目录中的文件，你可以使用命令行参数指定该目录的路径，如 `ls /` 或 `dir \\\
  `。\n\n### 工作坊\n\n工作坊提供了测验题来帮助你巩固对所涵盖内容的理解，并提供了练习让你获得使用所学知识的经验。在检查附录 E 中的答案之前，尝试回答测验和练习题，并在继续下一节之前确保你理解了答案。\n\
  \n#### 测验\n\n1. 声明 `Int main()` 有什么问题？\n\n2. `int` 和 `double` 之间有什么区别？\n\n### 练习\n\
  \n1. 编写一个程序，询问用户的年龄并打印出来。\n\n2. 编写一个程序，询问用户两个数字并打印它们的和。\n\n3. 编写一个程序，询问用户的全名并打印“Hello,\
  \ [name]”。\n\n\n\n\n\n变量类型属性告诉编译器变量可以存储的数据性质，编译器会为其预留必要的空间。程序员选择的名称是内存中存储变量值的地址的易读替代方案。除非分配了初始值，否则你无法确定该内存位置的内容，这对于程序可能是有害的。因此，初始化是可选的，但它通常是一个良好的编程习惯。列表\
  \ 3.1 展示了在一个乘法用户提供的两个数字的程序中如何声明、初始化和使用变量。\n\n### **列表 3.1** 使用变量存储数字及其乘法结果\n\n点击此处查看代码图像\n\
  \n* *\n\n```cpp\n1: #include <iostream>\n2: using namespace std;\n3:\n4: int main\
  \ ()\n5: {\n6:     cout << \"This program will help you multiply two numbers\" <<\
  \ endl;\n7:\n8:     cout << \"Enter the first number: \";\n9:     int firstNumber\
  \ = 0;\n10:     cin >> firstNumber;\n11:\n12:     cout << \"Enter the second number:\
  \ \";\n13:     int secondNumber = 0;\n14:     cin >> secondNumber;\n15:\n16:   \
  \  // Multiply two numbers, store result in a variable\n17:     int multiplicationResult\
  \ = firstNumber * secondNumber;\n18:\n19:     // Display result\n20:     cout <<\
  \ firstNumber << \" x \" << secondNumber;\n21:     cout << \" = \" << multiplicationResult\
  \ << endl;\n22:\n23:     return 0;\n24: }\n```\n\n* *\n\n输出 ![Image](img/arrow.jpg)\n\
  \n点击此处查看代码图像\n\n此程序将帮助你将两个数字相乘\n\n输入第一个数字：51\n\n输入第二个数字：24\n51 x 24 = 1224\n\n###\
  \ 分析 ![Image](img/arrow.jpg)\n\n该应用程序要求用户输入两个数字，程序对它们进行相乘并显示结果。为了使用用户输入的数字，需要将它们存储在内存中。第\
  \ 9 行和第 13 行声明的变量 `firstNumber` 和 `secondNumber` 负责临时存储用户输入的整数值的工作。你在第 10 行和第 14\
  \ 行中使用 `std::cin` 来接收用户输入并将其存储在两个整数变量中。第 21 行的 `cout` 语句用于在控制台上显示结果。\n\n#### 进一步分析变量声明：\n\
  \n```cpp\n9:     int firstNumber = 0;\n```\n\n这一行声明的是一个类型为 `int` 的变量，表示一个整数，名为 `firstNumber`。零被赋值给变量作为初始值。\n\
  \n编译器负责将此变量 `firstNumber` 映射到内存中的位置，并为你处理声明的所有变量相关的内存地址记录工作。因此，程序员可以使用人类友好的名称，而编译器则管理内存地址并为微处理器创建处理\
  \ RAM 时的指令。\n\n* *\n\n### 注意\n\n适当命名变量对于编写良好、易读且易于维护的代码非常重要。\n\nC++ 中的变量名可以是字母和数字，但不能以数字开头。它们不能包含空格，不能包含算术运算符（如\
  \ `+`、`–` 等）。变量名也不能是保留关键字。例如，名为 `return` 的变量将导致编译失败。\n\n变量名可以包含下划线字符 `_`，这通常用于描述性的变量命名。\n\
  \n* *\n\n### 声明和初始化同一类型的多个变量\n\n在列表 3.1 中，`firstNumber`、`secondNumber` 和 `multiplicationResult`\
  \ 都是相同类型——整数，并在三个单独的行声明。如果你愿意，可以将这三个变量的声明合并为一行代码，如下：\n\n点击此处查看代码图像\n\n```cpp\nint\
  \ firstNumber = 0, secondNumber = 0, multiplicationResult = 0;\n```\n\n* *\n\n###\
  \ 注意\n\n正如你看到的，C++ 允许同时声明多个同类型的变量并在函数开头声明变量。然而，在第一次需要时声明变量通常更好，因为这使代码具有可读性——当声明靠近第一次使用点时，人们就能注意到变量的类型。\n\
  \n* *\n\n* *\n\n### 注意\n\n存储在变量中的数据是存储在 RAM 中的数据。当应用程序终止时，这些数据将会丢失，除非程序员显式地将数据持久化到硬盘等存储介质上。存储到文件将在第\
  \ 27 “输入输出流”中讨论。\n\n* *\n\n### 理解变量的作用域\n\n像我们之前声明的普通变量具有定义良好的作用域，在该范围内它是有效且可以使用的。当在作用域之外使用时，该变量是一个编译器一无未知的实体。为了更好地理解变量的作用域，将列表\
  \ 3.1 重组为一个函数 `MultiplyNumbers()`，该函数对数字进行相乘并返回结果。参见列表 3.2。\n\n**列表 3.2** 演示变量的作用域\n\
  点击此处查看代码图像\n\n* *\n\n```cpp\n1: #include <iostream>\n2: using namespace std;\n3:\n\
  4: void MultiplyNumbers ()\n5: {\n6:     cout << \"This program will help you multiply\
  \ two numbers\" << endl;\n7:\n8:     cout << \"Enter the first number: \";\n9: \
  \    int firstNumber = 0;\n10:     cin >> firstNumber;\n11:\n12:     cout << \"\
  Enter the second number: \";\n13:     int secondNumber = 0;\n14:     cin >> secondNumber;\n\
  15:\n16:     // Multiply two numbers, store result in a variable\n17:     int multiplicationResult\
  \ = firstNumber * secondNumber;\n18:\n19:     // Display result\n20:     cout <<\
  \ firstNumber << \" x \" << secondNumber;\n21:     cout << \" = \" << multiplicationResult\
  \ << endl;\n22:\n23:     return 0;\n24: }\n25: int main ()\n26: {\n27:     // Call\
  \ the function that does all the work\n28:     MultiplyNumbers();\n29:\n30:    \
  \ // cout << firstNumber << \" x \" << secondNumber;\n31:     // cout << \" = \"\
  \ << multiplicationResult << endl;\n32:\n33:     return 0;\n34: }\n```\n\n\n\n\n\
  \n编译器将 `main()` 中的变量视为独立的实体，即使它们与另一个函数中声明的变量同名也是如此，因为这两个变量受限于它们的作用域。\n\n***\n\n\
  ### 全局变量\n\n如果将列表 3.2 函数 `MultiplyNumbers()` 中使用的变量声明在函数 `MultiplyNumber()` 的作用域之外而非其内部，那么它们在\
  \ `main()` 和 `MultiplyNumbers()` 中都是可用的。列表 3.3 展示了全局变量，全局变量是程序中作用域最大的变量。\n\n**列表\
  \ 3.3** 使用全局变量\n\n点击此处查看代码图像\n\n***\n\n```\n1: #include <iostream>\n2: using namespace\
  \ std;\n3:\n4: // three global integers\n5: int firstNumber = 0;\n6: int secondNumber\
  \ = 0;\n7: int multiplicationResult = 0;\n8:\n9: void MultiplyNumbers ()\n10: {\n\
  11:     cout << \"Enter the first number: \";\n12:     cin >> firstNumber;\n13:\n\
  14:     cout << \"Enter the second number: \";\n15:     cin >> secondNumber;\n16:\n\
  17:     // Multiply two numbers, store result in a variable\n18:     multiplicationResult\
  \ = firstNumber * secondNumber;\n19:\n20:     // Display result\n21:     cout <<\
  \ \"Displaying from MultiplyNumbers(): \";\n22:     cout << firstNumber << \" x\
  \ \" << secondNumber;\n23:     cout << \" = \" << multiplicationResult << endl;\n\
  24: }\n25: int main ()\n26: {\n27:     cout << \"This program will help you multiply\
  \ two numbers\" << endl;\n28:\n29:     // Call the function that does all the work\n\
  30:     MultiplyNumbers();\n31:\n32:     cout << \"Displaying from main(): \";\n\
  33:\n34:     // This line will now compile and work!\n35:     cout << firstNumber\
  \ << \" x \" << secondNumber;\n36:     cout << \" = \" << multiplicationResult <<\
  \ endl;\n37:\n38:     return 0;\n39: }\n```\n\n***\n\n输出 ![Image](img/arrow.jpg)\n\
  \n点击此处查看代码图像\n\nThis program will help you multiply two numbers\nEnter the first\
  \ number: 51\nEnter the second number: 19\nDisplaying from MultiplyNumbers(): 51\
  \ x 19 = 969\nDisplaying from main(): 51 x 19 = 969\n\n分析 ![Image](img/arrow.jpg)\n\
  \n列表 3.3 显示了两个函数中的乘法结果，这两个函数都没有声明变量 `firstNumber`、`secondNumber` 和 `multiplicationResult`。这些变量是全局的，因为它们被声明在第\
  \ 5–7 行，即任何函数的作用域之外。注意第 23 行和第 36 行使用了这些变量并显示了它们的值。特别注意 `multiplicationResult` 如何在\
  \ `MultiplyNumbers()` 中被首次赋值，但在 `main()` 中实际上被重用了。\n\n***\n\n### 注意事项\n\n不加区分地使用全局变量被认为是一种糟糕的编程习惯。因为全局变量可以在任何/所有函数中被赋值，并且可能包含不可预测的状态，特别是当修改它们的函数运行在不同的线程中，或者由团队中不同的程序员编写时。\n\
  \n在不使用全局变量的情况下列表 3.3 的优雅方法是让函数 `MultiplyNumbers()` 将乘法的整数结果返回给 `main()`。\n\n***\n\
  \n### 命名规范\n\n如果你还没有注意到，我们将函数命名为 `MultiplyNumbers()`，其中函数名中的每个单词的首字母都大写（称为*帕斯卡命名法*，Pascal\
  \ casing），而变量 `firstNumber`、`secondNumber` 和 `multiplicationResult` 的命名中第一个单词字母小写（称为*驼峰命名法*，camel\
  \ casing）。本书遵循一种约定：变量名遵循驼峰命名法，而其他制品（如函数名）遵循帕斯卡命名法。\n\n你可能会遇到 C++ 代码，其中变量名前缀有解释变量类型的字符。这种约定被称为*匈牙利记法*（Hungarian\
  \ notation），并且被频繁使用。\n\n\n\n\n\n`Sign`（符号）表示正或负。你使用计算机处理的所有数字以位（bits）和字节（bytes）的形式存储在内存中。一个大小为\
  \ 1 字节的内存位置包含 8 位。每个位可以是 `0` 或 `1`（也就是说，最多携带这两个值之一）。因此，一个大小为 1 字节的内存位置最多包含 2 的 8\
  \ 次方的值——即 256 个唯一值。同样，一个大小为 16 位的内存位置可以包含 2 的 16 次方的值——即 65,536 个唯一值。\n\n如果这些值是无符号的（假设仅为正数），那么一个字节可以包含\
  \ 0 到 255 之间的整数值，两个字节分别可以包含 0 到 65,535 之间的值。查看表 3.1，注意 `unsigned short`（无符号整型）是支持此范围的类型，因为它包含在\
  \ 16 位内存中。因此，用位和字节模拟正值是非常容易的（参见图 3.1）。\n\n![Image](img/03fig01.jpg)\n\n**图 3.1**\
  \ 16 位无符号短整数的位结构。\n\n如何在这个空间中模拟负数？一种方法是“牺牲”一个位作为符号位，用于指示其他位中包含的值是正是负（参见图 3.2）。符号位必须是最高位（MSB），因为最低位需要用于模拟奇数。所以，当\
  \ MSB 包含符号信息时，假设 0 表示正，1 表示负，而其他字节包含绝对值。\n\n![Image](img/03fig02.jpg)\n\n**图 3.2**\
  \ 16 位有符号短整数的位结构。\n\n因此，一个占据 8 位的有符号数可以包含从 –128 到 127 之间的值，而一个占据 16 位的有符号数可以包含从\
  \ –32,768 到 32,767 之间的值。如果你再次查看表 3.1，注意 `(signed) short` 是在 16 位空间内支持正、负整数值的的类型。\n\
  \n### 有符号整数类型 `short`、`int`、`long` 和 `long long`\n\n这些类型的大小不同，因此它们所能包含的值值范围也不同。`int`\
  \ 可能是最常用的类型，在大多数编译器上宽度为 32 位。根据你对该特定变量预期持有的最大值的预测，使用合适的类型。\n\n声明一个有符号类型的变量非常简单：\n\
  \n点击此处查看代码图像\n\n```\nshort int gradesInMath = -5; // 不是你的最高分\nint moneyInBank =\
  \ -70000; // 透支\nlong populationChange = -85000; // 人口减少\nlong long countryGDPChange\
  \ = -70000000000;\n```\n\n### 无符号整数类型 `unsigned short`、`unsigned int`、`unsigned\
  \ long` 和 `unsigned long long`\n\n与有符号对应类型不同，无符号整数变量类型不能包含符号信息，因此它们实际上可以支持两倍的正数值。\n\
  \n声明一个无符号类型的变量简单就像这样：\n\n点击此处查看代码图像\n\n```\nunsigned short int numColorsInRainbow\
  \ = 7;\nunsigned int numEggsInBasket = 24; // 始终为正数\nunsigned long numCarsInNewYork\
  \ = 700000;\nunsigned long long countryMedicareExpense = 70000000000;\n```\n\n>\
  \ 注意\n> 当你预计只有正值时，你应该使用无符号变量类型。所以，如果你在计算苹果的数量，不要使用 `int;`，要使用 `unsigned int`。后者在正范围内可以容的值是前者的两倍。\n\
  \n> 警告\n> 因此，无符号类型可能不适用于银行应用程序中的变量，用于存储账户余额，因为银行允许某些客户使用透支额度。要查看有符号和无符号类型差异的示例，请访问第\
  \ 5 节中的列表 5.3。\n\n### 通过选择正确的数据类型避免溢出错误\n\n如 `short`、`int`、`long`、`unsigned short`、`unsigned\
  \ int`、`unsigned long` 等数据类型包含数字的容量是有限。当你在算术运算中超过所选类型实施的限制时，就会产生溢出。\n\n以 `unsigned\
  \ short` 为例。数据类型 `short` 占用 16 位，因此可以包含从 0 到 65,535 之间的值。当在 `unsigned short` 中对\
  \ 65,535 加 1 时，值将溢出为 0。这就像汽车的里程表，当它只能支持五位数而汽车已经行驶了 99,999 英时，发生了机械溢出。\n\n在这种情况下，`unsigned\
  \ short` 永远不是这种计数器的正确类型。如果你使用这些值来分配内存，对于 `unsigned short`，当你实际需要是 65,536 时，你会得到零。\n\
  \n对于范围为 –32,768 到 32,767 的 `signed short`，在 32,767 加 1 可能会导致 –32,768。这种行为取决于编译器。\n\
  \n**列表 3.4** 演示有符号和无符号溢出\n\n```cpp\n#include <iostream>\nusing namespace std;\n\n\
  int main() {\n    unsigned short uShort = 65535;\n    cout << \"Incrementing unsigned\
  \ short \" << ++uShort << endl;\n\n    short signedShort = 32767;\n    cout << \"\
  Incrementing signed short \" << ++signedShort << endl;\n\n    return 0;\n}\n```\n\
  \n输出\n```\nIncrementing unsigned short 0\nIncrementing signed short -32768\n```\n\
  \n### 浮点类型 `float` 和 `double`\n\n浮点数可能是你在学校中学过的实数。这些是可以是正或负的数字。它们可以包含小数。所以，如果你想在\
  \ C++ 变量中存储圆周（22 / 7 或 3.14），你会使用浮点类型。\n\n这些这些类型的变量的模式与列表 3.1 中的 `int` 完全相同。所以，允许你存储小数的\
  \ `float` 声明如下：\n\n```\nfloat pi = 3.14;\n```\n\n而双精度浮点数（简单称为 double）定义为\n\n点击此处查看代码图像\n\
  \n```cpp\ndouble morePrecisePi = 22.0 / 7;\n```\n\n> 提示\n> C++14 增加了对单引号形式*分隔符*的支持。这提高了代码的可读性，如下面的初始化所示：\n\
  \n\n\n\n\n```cpp\nint moneyInBank = -70'000; // -70000\nlong populationChange =\
  \ -85'000; // -85000\nlong long countryGDPChange = -70'000'000'000; // -70 billion\n\
  double pi = 3.141'592'653'59; // 3.14159265359\n```\n\n### 注意\n迄为止提到的数据类型通常被称为 POD（普通旧数据）。POD\
  \ 类别包含了这些类型以及它们的聚合类型（结构体、枚举、联合体或类）。\n\n### 使用 `sizeof` 确定变量的大小\n\n大小（Size）是程序员在声明变量以存储分配给的数据时，编译器保留的内存量。变量的大小取决于它的类型，C++\
  \ 有一个非常方便的运算符 `sizeof`，它可以告诉你变量或类型以字节（bytes）为单位的大小。\n\n`sizeof` 的用法非常简单。要确定整数的大小，你可以调用\
  \ `sizeof` 并传入参数 `int`（类型），如列表 3.5 所示。\n\n点击此处查看代码图像\n\n```cpp\ncout << \"Size of\
  \ an int: \" << sizeof (int);\n```\n\n**列表 3.5** 查找标准 C++ 变量类型的大小\n\n点击此处查看代码图像\n\
  \n```cpp\n#include <iostream>\n\nint main()\n{\n    using namespace std;\n    cout\
  \ << \"Computing the size of some C++ inbuilt variable types\" << endl;\n\n    cout\
  \ << \"Size of bool: \" << sizeof(bool) << endl;\n    cout << \"Size of char: \"\
  \ << sizeof(char) << endl;\n    cout << \"Size of unsigned short int: \" << sizeof(unsigned\
  \ short) << endl;\n    cout << \"Size of short int: \" << sizeof(short) << endl;\n\
  \    cout << \"Size of unsigned long int: \" << sizeof(unsigned long) << endl;\n\
  \    cout << \"Size of long: \" << sizeof(long) << endl;\n    cout << \"Size of\
  \ int: \" << sizeof(int) << endl;\n    cout << \"Size of unsigned long long: \"\
  \ << sizeof(unsigned long long) << endl;\n    cout << \"Size of long long: \" <<\
  \ sizeof(long long) << endl;\n    cout << \"Size of unsigned int: \" << sizeof(unsigned\
  \ int) << endl;\n    cout << \"Size of float: \" << sizeof(float) << endl;\n   \
  \ cout << \"Size of double: \" << sizeof(double) << endl;\n\n    cout << \"The output\
  \ changes with compiler, hardware and OS\" << endl;\n\n    return 0;\n}\n```\n\n\
  输出 ![Image](img/arrow.jpg)\n\n点击此处查看代码图像\n\n```text\nComputing the size of some\
  \ C++ inbuilt variable types\nSize of bool: 1\nSize of char: 1\nSize of unsigned\
  \ short int: 2\nSize of short int: 2\nSize of unsigned long int: 4\nSize of long:\
  \ 4\nSize of int: 4\nSize of unsigned long long: 8\nSize of long long: 8\nSize of\
  \ unsigned int: 4\nSize of float: 4\nSize of double: 8\nThe output changes with\
  \ compiler, hardware and OS\n```\n\n### 分析 ![Image](img/arrow.jpg)\n\n列表 3.5 的输出揭示了各种类型以字节为单位的大小，并且特定于我的平台：编译器、操作系统和硬件。此输出特别结果是在\
  \ 64 位操作系统上以 32 位模式（由 32 位编译器编译）运行程序的结果。注意，64 位编译器可能会产生不同的结果，我选择 32 位编译器的原因是为了使该应用程序能够在\
  \ 32 位和 64 位系统上运行。输出表明变量的 `sizeof` 在无符号或有符号类型之间不会改变；两者之间的唯一区别是前者中带有符号信息的最高有效位（MSB）。\n\
  \n### 注意\n输出中看到的所有大小都是字节。类型的大小是一个需要考虑的重要参数，特别是对于用于存储数字的类型。`short int` 能够存储的范围比 `long\
  \ long` 小。因此，你不会使用 `short int` 来存储一个国家的人口，例如。\n\n### 提示\nC++11 引入了固定宽度整数类型，允许你指定整数的精确位宽。这些分别是用于\
  \ 8 位有符号和无符号整数的 `int8_t` 或 `uint8_t`。你也可以使用 16 位（`int16_t, uint16_t`）、32 位（`int32_t,\
  \ uint32_t`）和 64 位（`int64_t, uint64_t`）整数类型。要使用这些类型，请包含头文件 `<cstdint>`。\n\n### 使用列表初始化避免窄转换错误\n\
  \n当你使用另一个较大的类型（例如 `int`）初始化一个较小整数类型的变量（例如 `short`）时，你面临着窄转换错误的风险，因为你正在尝试将较大范围的数据存入较小的类型中。\n\
  \n窄转换（narrowing conversion）错误发生在尝试将一个大范围的类型转换为较小范围的类型时，这可能会导致数据丢失。C++11 引入了列表初始化（list\
  \ initialization）技术来防止这种问题。要使用这种技术，请在大括号 `{...}` 内初始化变量。例如：\n\n```cpp\nint largeNum\
  \ = 5000000;\nshort anotherNum{largeNum}; // 错误！\nint anotherNum{largeNum}; // 正确！\n\
  float someFloat{largeNum}; // 错误！\nfloat someFloat{5000000}; // 正确！\n```\n\n\n\n\
  \n\n看看你如何没有决定 `coinFlippedHeads` 应该是 `bool` 类型，或者决定 `largeNumber` 应该是 `long long`\
  \ 类型，而是在第 6 行和第 7 行声明这两个变量时使用了 `auto` 关键字。这会将变量类型的决策交给了编译器，编译器使用初始化值作为依据。你使用了 `sizeof`\
  \ 来实际检查编译器是否创建了你认为的类型，并可以与代码产生的输出进行对比，以验证它是否确实创建了。\n\n***\n\n### 注意\n使用 `auto` 要求你对变量进行初始化，因为编译器使用该初始值来决定变量类型可以是什么。\n\
  \n当你不初始化类型为 `auto` 的变量时，会得到编译错误。\n\n***\n\n即使 `auto` 初看起来似乎是一个微不足道的特性，但在变量类型是复杂类型的情况下，它会让编程变得简单得多。`auto`\
  \ 在编写更简单且类型安全的代码中的作用将在第 15 节“标准模板库介绍](#ch15.html_ch15)”及后续章节中再次讨论。\n\n### 使用 `typedef`\
  \ 替换变量类型\nC++ 允许将变量类型替换为你认为方便的类型。你使用 `typedef` 关键字来实现。这里有一个示例，程序员想要将 `unsigned int`\
  \ 命名为具有描述性的 `STRICTLY_POSITIVE_INTEGER`。\n\n点击此处查看代码\n\n```cpp\ntypedef unsigned\
  \ int STRICTLY_POSITIVE_INTEGER;\n\nSTRICTLY_POSITIVE_INTEGER numEggsInBasket =\
  \ 4532;\n```\n\n编译时，第一行告诉编译器 `STRICTLY_POSITIVE_INTEGER` 仅仅是一个 `unsigned int`。在随后的阶段中，当编译器遇到已经定义的类型\
  \ `STRICTLY_POSITIVE_INTEGER` 时，它会将其替换为 `unsigned int` 并继续编译。\n\n***\n\n### 注意\n\
  在处理具有繁琐语法的复杂类型时，`typedef` 或类型替换特别为方便，例如使用模板的类型。模板将在稍后的第 14 节““宏和模板介绍](#ch14.html_ch14)”中讨论。\n\
  \n***\n\n### 什么是常量？\n想象你正在编写一个计算圆的面积和周长的程序。公式如下：\n\n点击此处查看代码\n\n```cpp\nArea = pi\
  \ * Radius * Radius;\n\nCircumference = 2 * pi * Radius\n```\n\n在这个公式中，`pi` 是值为\
  \ `22 / 7` 的常量。你不希望 `pi` 的值在程序中的任何地方发生变化。你还希望避免向 `pi` 意外赋值任何可能的错误值。C++ 允许你将 `pi`\
  \ 定义为声明后不可更改的常量。换句话说，在定义之后，常量的值不能被修改。在 C++ 中对常量赋值会导致编译错误。\n\n因此，常量类似于 C++ 中的变量，不同之处这些不能被改变。与变量类似，常量也占用内存空间，并有一个名称来标识预留空间的地址。然而，该空间的内容不能被重写。C++\
  \ 中的常量可以是：\n\n![Image](img/square.jpg) 字面量常量\n\n![Image](img/square.jpg) 使用 `const`\
  \ 关键字声明的常量\n\n![Image](img/square.jpg) 使用 `constexpr` 关键字的常量表达式（C++11 新增）\n\n![Image](img/square.jpg)\
  \ 使用 `enum` 关键字的枚举常量\n\n![Image](img/square.jpg) 不推荐且已弃用的定义常量\n\n#### 字面量常量\n字面量常量可以是许多类型——整数、字符串等。在列表\
  \ 1.1 中你编写的第一个 C++ 程序中，你使用以下语句显示了“Hello World”：\n\n点击此处查看代码\n\n```cpp\nstd::cout\
  \ << \"Hello World\" << std::endl;\n```\n\n在这里，“Hello World”是一个字符串字面量常量。你实际上一直都在使用字面量常量！当你这样声明一个整数\
  \ `someNumber` 时：\n\n```cpp\nint someNumber = 10;\n```\n\n整数变量 `someNumber` 被赋予了初始值十。这里十进制的十是代码的一部分，被编译到应用程序中，是不可更改的，也是一个字面量常量。你可以使用八进制表示法的字面量来初始化整数，如下所示：\n\
  \n点击此处查看代码\n\n```cpp\nint someNumber = 012 // 八进制 12 评估为十进制 10\n```\n\n从 C++14 开始，你还可以使用二进制字面量，如下所示：\n\
  \n点击此处查看代码\n\n```cpp\nint someNumber = 0b1010; // 二进制 1010 评估为十进制 10\n```\n\n***\n\
  \n### 提示\nC++ 还允许你定义自己的字面量。例如，温度表示为 `32.0_F`（华氏）或 `0.0_C`（摄氏），距离表示为 `16_m`（英里）或\
  \ `10_km`（公里）。这些后缀 `_F`、`_C`、`_m` 和 `_km` 被称为自定义字面量，将在第 12 节“运算符重载](#ch12.html_ch12)”中解释。\n\
  \n#### 将变量声明为 const\nC++ 中最重要的常量类型是通过使用 `const` 声明的。通用声明形式如下：\n\n```cpp\nconst 类型名\
  \ = 值;\n```\n\n让我们看一个显示 `pi` 值的简单应用程序（参见列表 3.7）。\n\n**列表 3.7 声明常量 pi**\n\n```cpp\n\
  #include <iostream>\n\nint main() {\n    using namespace std;\n\n    const double\
  \ pi = 22.0 / 7;\n    cout << \"The value of constant pi is: \" << pi << endl;\n\
  \    // 取消下注释查看编译失败\n    // pi = 345;\n\n    return 0;\n}\n```\n\n***\n\n输出 ![Image](img/arrow.jpg)\n\
  \n点击此处查看代码\n\nThe value of constant pi is: 3.14286\n\n分析 ![Image](img/arrow.jpg)\n\
  \n注意第 7 行的常量 `pi`。我们使用 `const` 关键字告诉编译器 `pi` 是类型为 `double` 的常量。如果你取消第 11 行向定义为常量的变量赋值，你会看到一个编译失败，信息类似于“你不能向声明为\
  \ const 的变量赋值”。因此，常量是确保某些数据不被修改的一种有力方法。\n\n***\n\n 注意\n将不应改变值的变量定义为 `const` 是一种良好的编程习惯。`const`\
  \ 关键字的使用表明程序员考虑了在需要的地方确保数据的常量，并保护其应用程序免受对该常量的意外。这在多程序环境中特别有用。\n\n***\n\n常量在声明静态数组长度时非常有用，静态数组长度在编译时是固定的。第\
  \ 4 节中的列表 4.2“管理数组和字符串](#ch04.html_ch04)”包含一个演示如何使用 `const int` 定义数组长度的示例。\n\n####\
  \ 使用 constexpr 的常量表达式\n`constexpr` 关键字允许以函数的形式声明常量：\n\n```cpp\nconstexpr double\
  \ GetPi() {return 22.0 / 7;}\n```\n\n一个 `constexpr` 可以使用另一个：\n\n```cpp\nconstexpr\
  \ double TwicePi() {return 2 * GetPi()}\n```\n\n\n\n\n`constexpr` 看起来像一个函数，但从编译器和应用程序的角度来看，它提供了优化的可能。只要编译器能够将常量表达式求值为常量，它就可以在需要常量的语句和表达式中使用。在前面的示例中，`TwicePi()`\
  \ 是一个使用常量表达式 `GetPi()` 的 `constexpr` 函数。这可能会触发编译时优化，编译器会将 `TwicePi()` 的每次使用简单地替换为\
  \ `6.28571`，而不是在执行时运行计算 `2 x 22 / 7` 的代码。\n\nListing 3.8 展示了 `constexpr` 的用法。\n\n\
  **Listing 3.8** 使用 `constexpr` 计算 Pi\n\n点击此处查看代码图像\n\n```cpp\n1: #include <iostream>\n\
  2: constexpr double GetPi() { return 22.0 / 7; }\n3: constexpr double TwicePi()\
  \ { return 2 * GetPi(); }\n4: \n5: int main()\n6: {\n7:     using namespace std;\n\
  8:     const double pi = 22.0 / 7;\n9: \n10:     cout << \"constant pi contains\
  \ value \" << pi << endl;\n11:     cout << \"constexpr GetPi() returns value \"\
  \ << GetPi() << endl;\n12:     cout << \"constexpr TwicePi() returns value \" <<\
  \ TwicePi() << endl;\n13:     return 0;\n14: }\n```\n\n输出 ![Image](img/arrow.jpg)\n\
  \n点击此处查看代码图像\n\nconstant pi contains value 3.14286\nconstexpr GetPi() returns value\
  \ 3.14286\nconstexpr TwicePi() returns value 6.28571\n\n分析 ![Image](img/arrow.jpg)\n\
  \n程序演示了两种获取 `pi` 值的方法：一种是像第 8 行那样声明的常量变量 `pi`，另一种是像第 2 行那样声明的常量表达式 `GetPi()`。`GetPi()`\
  \ 和 `TwicePi()` 看起来像函数，但它们并非如此。函数是在程序执行时被调用的。但这些是常量表达式，编译器已经将 `GetPi()` 的每次使用替换为\
  \ `3.14286`，将 `TwicePi()` 的每次使用替换为 `6.28571`。与在函数中包含相同计算相比，`TwicePi()` 的编译时解析提高了程序的执行速度。\n\
  \n### 注意\n\n常量表达式需要包含返回简单类型（如整数、double 等）的简单实现。C++14 允许 `constexpr` 包含 `if` 和 `switch`\
  \ 语句等决策结构。这些条件语句将在第 6 节 “控制程序流.”中进行详细讨论。\n\n`constexpr` 的用法并不保证编译时优化——例如，如果你使用 `constexpr`\
  \ 表达式将用户提供的数字翻倍。此类表达式的结果无法由编译器计算，编译器可能会忽略 `constexpr` 的用法并将其编译为普通函数。\n\n要查看在编译器期望常量的地方使用常量表达式的演示，请参阅第\
  \ 4 节中 Listing 4.2 的代码示例。\n\n### 提示\n\n在之前的代码示例中，我们定义了自己的常量 `pi` 作为学习声明常量和 `constexpr`\
  \ 语法的练习。然而，大多数流行的 C++ 编译器已经在常量 `M_PI` 中提供了一个相当精确的 `pi` 值。在包含头文件 `<cmath>` 后，你可以在程序中使用该常量。\n\
  \n### 枚举\n\n在某些情况下，特定的变量应该只允许接受一组值。在这些情况下，你不希望彩虹的颜色包含“松石绿”（Turquoise），或者指南针的方向包含“左”。在这两种情况下，你需要一种值被限制为你定义的特定集合的变量类型。*枚举*（Enumerations）正是你这种情况需要的工具，并以关键字\
  \ `enum` 为特征。枚举由一组称为*枚举量符*（enumerators）的常量组成。\n\n在下面的示例中，枚举 `RainbowColors` 包含单个颜色如\
  \ `Violet` 作为枚举量符：\n\n点击此处查看代码图像\n\n```cpp\nenum RainbowColors\n{\n    Violet =\
  \ 0,\n    Indigo,\n    Blue,\n    Green,\n    Yellow,\n    Orange,\n    Red\n};\n\
  ```\n\n这是另一个基本方向的枚举：\n\n点击此处查看代码图像\n\n```cpp\nenum CardinalDirections\n{\n    North,\n\
  \    South,\n    East,\n    West\n};\n```\n\n`枚举` 被用作自定义类型。这种类型的变量可以分配枚举中包含的任何枚举量符。因此，如果你定义了一个类型为\
  \ `RainbowColors` 的变量，你可以将其限制在合法的颜色中。\n\n注意我们枚举了四个基本方向，但给第一个 `North` 赋予了一个初始值 25（见第\
  \ 6 行）。这自动确保后续常量被编译器赋值为 26、27 和 28。在第 20 行，你创建了一个类型为 `CardinalDirections` 的变量，并赋予其初始值\
  \ `South`。在第 21 行显示时，编译器派发了与 `South` 关联的整数值 26。\n\nListing 3.9 展示了枚举常量的用法。\n\n```cpp\n\
  1: #include <iostream>\n2: using namespace std;\n3: \n4: enum CardinalDirections\n\
  5: {\n6:     North = 25,\n7:     South,\n8:     East,\n9:     West\n10: };\n11:\
  \ \n12: int main()\n13: {\n14:     cout << \"Displaying directions and their symbolic\
  \ values\" << endl;\n15:     cout << \"North: \" << North << endl;\n16:     cout\
  \ << \"South: \" << South << endl;\n17:     cout << \"East: \" << East << endl;\n\
  18:     cout << \"West: \" << West << endl;\n19: \n20:     CardinalDirections windDirection\
  \ = South;\n21:     cout << \"Variable windDirection = \" << windDirection << endl;\n\
  22: \n23:     return 0;\n24: }\n```\n\n**LISTING 3.9** 使用枚举值指示方向\n\n\n\n\n`#define`\
  \ 是一个预处理器宏，在这里执行的是此后所有对 `pi` 的引用都将被替换为 `3.14286` 以供编译器处理。注意，这是由预处理器完成的文本替换（即：非智能替换）。编译器既不知道也不关心所涉及常量的实际类型。\n\
  \n### 注意事项\n\n通过 `#define` 使用预处理器定义常量已过时，不应使用。\n\n## 你不能作为变量或常量名使用的关键字\n\n某些词被 C++\
  \ 保留了，你不能将它们用作变量名。这些关键字对对 C++ 编译器具有特殊含义。关键字包括 `if`、`while`、`for` 和 `main`。C++ 定义的关键字列表可以在\
  \ 表 3.2 以及 附录 B 中的“C++ 关键字。”中找到。你的编译器可能还有额外的预留词，因此你应该查阅其手册以获取完整列表。\n\n![Image](img/03tab02.jpg)\n\
  \n**表 3.2** 主要 C++ 关键字\n\n## 要做\n\n**应该** 给变量起描述性的名称，即使这会让它们变得很长。\n\n**应该** 初始化变量，并使用列表初始化来避免窄转换错误。\n\
  \n**应该** 确保变量名能够解释它的用途。\n\n**应该** 设想自己是一个尚未见过你代码的人，并思考这个名称对他们来说是否有意义。\n\n**应该**\
  \ 检查你的团队是否遵循某些命名规范，并遵循这些规范。\n\n### 不要\n\n**不要** 给出过短或仅包含一个字符的名字。\n\n**不要** 使用只有你自己懂的奇特缩写来命名。\n\
  \n**不要** 使用预留的 C++ 关键字作为名称，因为这些将无法通过编译。\n\n### 总结\n\n在本节中，你学习了如何使用内存并在变量和常量中临时存储值。你学习了变量的大小由其类型决定，并且可以使用\
  \ `sizeof` 运算符确定它们的大小。你了解了不同类型的变量，如 `bool`、`int` 等，以及它们被用于包含不同类型的数据。在有效编程中，正确选择变量类型至关重要，如果选择的变量对于其目的太小，可能会导致回绕错误或溢出情况。你学习了\
  \ `auto` 关键字，你让编译器根据变量的初始化值来为你决定数据类型。\n\n你还学习了不同类型的常量，以及通过 `const`、`constexpr` 和\
  \ `enum` 关键字使用其中最重要的常量的方法。\n\n### 问答\n\n**Q 既然可以使用普通变量代替常量，为什么还要定义常量呢？**\n\n**A**\
  \ 常量，特别是使用 `const` 关键字声明的常量，是你告诉编译器特定变量的值应该是固定的且不允许更改的方式。因此，编译器始终确保常量变量不会被赋值另一个值，即使另一个程序员接手了你的工作并无意中尝试覆盖该值。所以，在你知道变量值不应该改变的地方声明常量是一种良好的编程实践，并可以提高你应用程序的质量。\n\
  \n**Q 我为什么应该初始化变量的值？**\n\n**A** 如果你不初始化，你就不知道变量的初始值是什么。初始值只是为变量预留的内存位置的内容。像这里所示初始化：\n\
  \n```\nint myFavoriteNumber = 0;\n```\n\n会将你选择的初始值（在本例中为 0）在变量 `myFavoriteNumber`\
  \ 创建时立即写入为其预留的内存位置。在某些情况下，根据变量的值进行条件处理（通常检查是否为非零）。如果没有初始化，这种逻辑无法可靠运行，因为未分配或未初始化的变量包含通常非零且随机的垃圾数据。\n\
  \n**Q 为什么 C++ 给我提供了使用 `short int`、`int` 和 `long int` 的选项？为什么不一直使用允许存储最大数值的整数类型呢？**\n\
  \n**A** C++ 是一种用于各种应用程序的编程语言，许多程序运行在计算能力或内存资源有限的设备上。简单的旧手机就是一个例子，其处理能力和可用内存都是有限的。在这种情况下，如果程序员不需要高数值，通常可以通过选择合适的变量类型来节省内存或速度或两者兼顾。如果你在普通的桌面电脑或高端智能手机上编程，那么选择一种整数类型而非另一种类型所带来的性能提升或内存节省很可能是微不足道的，在某些情况下甚至完全不存在。\n\
  \n**Q 我为什么不应该频繁使用全局变量？难道它们在我的应用程序中处处可用，并且可以节省在函数间传递值时所花费的时间吗？**\n\n**A** 全局变量可以在全局范围内读取和赋值。后者是问题所在，因为它们可以被全局修改。假设你正在与团队中的其他几个程序员合作一个项目。你将整数和其他变量声明为全局变量。如果你团队中的任何程序员在他们的代码中无意中更改了你的整数值——甚至可能是你正在使用的不同的\
  \ `.CPP` 文件——你的代码的可靠性就会受到影响。因此，节省几秒或几分钟不应作为标准，你不应该无差别地使用全局变量以确保代码的稳定性。\n\n**Q C++\
  \ 给我提供了包含正值和零的无符号整数选项。如果我减一个零值会发生什么？**\n\n**A** 你会看到回绕现象。查看表 3.2—你会发现 `unsigned\
  \ short` 可以包含从 0 到 65535 的值。所以，声明一个 `unsigned short` 并对其递减看看意想不到的结果：\n\n点击此处查看图像\n\
  \n```\nunsigned short myShortInt = 0; // 初始值\nmyShortInt = myShortInt - 1; // 递减\
  \ 1\nstd::cout << myShortInt << std::endl; // 输出：65535!\n```\n\n注意这不是 `unsigned\
  \ short` 本身的问题，而是你使用方法的问题。当规范允许负值时，不要使用无符号整数。如果 `myShortInt` 的内容用于动态分配相应字节数，一个允许零值递减的小错误会导致分配\
  \ 64KB！更糟糕，如果 `myShortInt` 用于访问内存位置的索引，你的应用程序可能会访问外部位置并崩溃！\n\n## 工作\n\n工作提供了问答来帮助你巩固对所涵盖内容的理解，并通过练习提供使用所学知识的。在查看附录\
