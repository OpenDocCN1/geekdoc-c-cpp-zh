  \ << endl;\n9:\n10:    cout << \"Enter a line of text: \" << endl;\n```\n\n\n\n\n\
  \n```cpp\nstring firstLine;\ngetline(cin, firstLine);\n\ncout << \"Enter another:\
  \ \" << endl;\nstring secondLine;\ngetline(cin, secondLine);\n\ncout << \"Result\
  \ of concatenation: \" << endl;\nstring concatString = firstLine + \" \" + secondLine;\n\
  cout << concatString << endl;\n\ncout << \"Copy of concatenated string: \" << endl;\n\
  string aCopy;\naCopy = concatString;\ncout << aCopy << endl;\n\ncout << \"Length\
  \ of concat string: \" << concatString.length() << endl;\n\nreturn 0;\n}\n```\n\n\
