  \ Rao\n\nAge = 101\n\nDate of Birth = May 1916\n\n\n\n\n\n### 使用 `std::stringstream`\
  \ 进行字符串转换\n\n你有一个字符串，它其中包含一个值为 `45` 的字符串。你如何将这个字符串值转换为值为 `45` 的整数？反之亦然？C++ 提供的最实用的工具之一是\
  \ `class stringstream`，它允许你执行一系列转换操作。\n\n### 提示\n\n要使用 `std::stringstream` 类，请包含头文件：\n\
  \n```cpp\n#include <sstream>\n```\n\nListing 27.11 展示了一些简单的 `stringstream` 操作。\n\
  \n**列表 27.11** 使用 `std::stringstream` 将整数值转换为字符串表示及反之操作\n\n点击此处查看代码图片\n\n```cpp\n\
  0: #include<fstream>\n1: #include<sstream>\n2: #include<iostream>\n3: using namespace\
  \ std;\n4:\n5: int main()\n6: {\n7:     cout << \"Enter an integer: \";\n8:    \
  \ int input = 0;\n9:     cin >> input;\n10:\n11:     stringstream converterStream;\n\
  12:     converterStream << input;\n13:     string inputAsStr;\n14:     converterStream\
  \ >> inputAsStr;\n15:\n16:     cout << \"Integer Input = \" << input << endl;\n\
  17:     cout << \"String gained from integer = \" << inputAsStr << endl;\n18:\n\
  19:     stringstream anotherStream;\n20:     anotherStream << inputAsStr;\n21: \
  \    int Copy = 0;\n22:     anotherStream >> Copy;\n23:\n24:     cout << \"Integer\
  \ gained from string, Copy = \" << Copy << endl;\n25:\n26:     return 0;\n27: }\n\
  ```\n\n输出 ![Image](img/arrow.jpg)\n\n点击此处查看代码图片\n\nEnter an integer: 45\n\nInteger\
  \ Input = 45\n\nString gained from integer = 45\n\nInteger gained from string, Copy\
  \ = 45\n\n### 分析 ![Image](img/arrow.jpg)\n\n你要求用户输入一个整数值。你首先使用 `operator<<` 将此整数插入\
  \ `stringstream` 对象中，如第 12 行所示。然后，你使用第 14 行的提取运算符 `operator>>` 将此整数转换为 `string`。之后，你使用此字符串作为起点，获取字符串\
  \ `inputAsStr` 中持有的数值的整数表示 `Copy`。\n\n#### 准则 (DO)\n\n- 当你只打算从文件中读取时，**务必**使用 `ifstream`。\n\
  - 当你只打算写入文件时，**务必**使用 `ofstream`。\n- **务必**记得在从流中插入或提取之前，通过 `is_open()` 检查文件流是否成功打开。\n\
  \n#### 避免 (DON'T)\n\n- **不要**忘记在使用完成文件流后使用 `close()` 方法将其关闭。\n- **不要**忘记通过 `cin\
  \ >> strData;` 从 `cin` 提取内容到 `string` 通常会导致 `strData` 仅包含到第一个空格之前的文本，而不是整行。\n- **不要**忘记函数\
  \ `getline(cin, strData);` 会从输入流中获取整行内容，包括空格。\n\n### 总结\n\n本节从实战角度教了你 C++ 流。你了解到从书的开始你一直在使用诸如\
  \ I/O 流 `cout` 和 `cin` 等流。你现在知道如何创建简单的文本文件，以及如何从中读取或写入。你学习了 `stringstream` 如何帮助你将整数等简单类型转换为字符串，反之亦然。\n\
  \n### 问答\n\n**Q 我看到 `fstream` 可以用于文件的写入和读取，那么我应该什么时候使用 `ofstream` 和 `ifstream` 呢？**\n\
  \n**A** 如果你的代码或模块只需要从文件中读取，你应该改用 `ifstream`。同样，如果它只需要写入文件，则使用 `ofstream`。在两种情况下，`fstream`\
  \ 都能正常工作，但为了确保数据和代码的完整性，最好采用类似于 `const` 的限制性策略（尽管 `const` 也强制强制）。\n\n**Q 我什么时候应该使用\
  \ `cin.get()`，什么时候应该使用 `cin.getline()`？**\n\n**A** `cin.getline()` 确保你捕获包括用户输入的空格在内的整行内容。\n\
  \n**Q 我什么时候应该使用 `stringstream`？**\n\n**A** `stringstream` 提供了一种将整数转换为字符串及反之的便捷方法。\n\
  \n\n\n\n\n异常可能由外部因素引起，例如资源不足的系统，也可能由应用程序内部因素引起，例如尽管指针包含无效值仍被使用，或者除零错误。某些模块被设计为通过向调用者抛出异常来传递错误。\n\
  \n> **注意**：为了保护你的代码免受异常影响，你需要“处理”异常从而使你的代码具有“异常安全性”。\n\n### 通过 `try` 和 `catch` 实现异常安全\n\
  \n在实现异常安全方面，`try` 和 `catch` 是 C++ 中最重要的关键字。要使语句具有异常安全，你应当将它们封装在 `try` 块中，并在 `catch`\
  \ 块中处理从 `try` 块抛出的异常：\n\n点击此处查看代码图像\n\n```cpp\nvoid SomeFunc()\n{\n    try\n   \
  \ {\n        int* numPtr = new int;\n        *numPtr = 999;\n        delete numPtr;\n\
  \    }\n    catch(...)  // ... 捕获所有异常\n    {\n        cout << \"Exception in SomeFunc(),\
  \ quitting\" << endl;\n    }\n}\n```\n\n#### 使用 `catch(...)` 处理所有异常\n\n记得在第 8 课\
  \ 的“指针与引用详解”中，我提到过 `new` 的默认形式在成功时返回指向内存位置的有效指针，但在失败时会抛出异常。列表 28.1 展示了你如何使用 `new`\
  \ 使内存分配具有异常安全，并处理计算机无法分配你请求的内存的情况。\n\n**列表 28.1** 在内存分配中使用 `try` 和 `catch` 确保异常安全\n\
  \n点击此处查看代码图像\n\n```cpp\n0: #include <iostream>\n1: using namespace std;\n2:\n3:\
  \ int main()\n4: {\n5:     cout << \"Enter number of integers you wish to reserve:\
  \ \";\n6:     try\n7:     {\n8:         int input = 0;\n9:         cin >> input;\n\
  10:\n11:         // 请求内存空间然后返回它\n12:         int* numArray = new int [input];\n\
  13:         delete[] numArray;\n14:     }\n15:     catch (...)\n16:     {\n17: \
  \        cout << \"Exception occurred. Got to end, sorry!\" << endl;\n18:     }\n\
  19:     return 0;\n20: }\n```\n\n输出 ![Image](img/arrow.jpg)\n\n点击此处查看代码图像\n\nEnter\
  \ number of integers you wish to reserve: -1\nException occurred. Got to end, sorry!\n\
  \n分析 ![Image](img/arrow.jpg)\n\n在这个示例中，我使用 `-1` 作为我想要保留的整数数量。这个输入是荒谬的，但用户总是会做荒谬的事情。在没有异常处理器的情况下，程序将遇到一个非常糟糕的结局。但多亏了异常处理器，你会看到输出显示了一条得体的的消息：`Got\
  \ to end, sorry!`\n\n列表 28.1 展示了 `try` 和 `catch` 块的使用。`catch(...)` 接受参数就像函数一样，而\
  \ `...` 表示此 `catch` 块接受各种异常。然而在这种情况下，我们可能想专门隔离类型为 `std::bad_alloc` 的异常，因为这些异常是在\
  \ `new` 失败时抛出的。捕获特定类型将帮助你专门处理该类型的问题，例如向用户显示一条告诉具体到底出了什么消息。\n\n#### 捕获类型异常\n\n列表\
  \ 28.1 中的异常是由 C++ 标准库抛出的。此类异常具有已知类型，捕获特定类型对你来说更好，因为你可以精确定位异常的原因，进行更好的清理工作，或者至少向用户显示一条精确的消息，如列表\
  \ 28.2 所示。\n\n**列表 28.2** 捕获类型为 `std::bad_alloc` 的异常\n\n点击此处查看代码图像\n\n```cpp\n0:\
  \ #include <iostream>\n1: #include <exception> // 包含此以捕捉 bad_alloc\n2: using namespace\
  \ std;\n3:\n4: int main()\n5: {\n6:     cout << \"Enter number of integers you wish\
  \ to reserve: \";\n7:     try\n8:     {\n9:         int input = 0;\n10:        \
  \ cin >> input;\n11:\n12:         // 请求内存空间然后返回它\n13:         int* numArray = new\
  \ int [input];\n14:         delete[] numArray;\n15:     }\n16:     catch (std::bad_alloc&\
  \ exp)\n17:     {\n18:         cout << \"Exception: \" << exp.what() << endl;\n\
  19:         cout << \"Got to end, sorry!\" << endl;\n20:     }\n21:     catch(...)\n\
  22:     {\n23:         cout << \"Exception occurred. Got to end, sorry!\" << endl;\n\
  24:     }\n25:     return 0;\n26: }\n```\n\n输出 ![Image](img/arrow.jpg)\n\n点击此处查看代码图像\n\
  \nEnter number of integers you wish to reserve: -1\nException: std_alloc\nGot to\
  \ end, sorry!\n\n分析 ![Image](img/arrow.jpg)\n\n对于这个示例，我使用 `-1` 作为我想要保留的整数数量。这个输入是荒谬的，但用户总是会做荒谬的事情。在没有异常处理器的情况下，程序将遇到一个非常糟糕的结局。但多亏了异常处理器，你会看到输出显示了一条得体的消息：`Got\
  \ to end, sorry!`\n\n列表 28.1 展示了 `try` 和 `catch` 块的使用。`catch(...)` 接受参数就像函数一样，而\
  \ `...` 表示此 `catch` 块接受各种异常。然而在这种情况下，我们可能想专门隔离类型为 `std::bad_alloc` 的异常，因为这些异常是在\
  \ `new` 失败时抛出的。捕获特定类型将帮助你专门处理该类型的问题，例如向用户显示一条告诉具体到底出了什么消息\n\n#### 捕获类型异常\n\n列表 28.1\
