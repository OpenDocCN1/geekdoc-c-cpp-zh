  \    case 3:\n    case 4:\n    cout << \"Valid input\" << endl;\n    default:\n\
  \        cout << \"Invalid input\" << endl;\n}\n```\n\n## 第 7 章 使用函数组织代码\n\n到为止，你看到的程序编程工作都包含\
  \ `main()` 中。这对于非常小的程序和应用程序很好。程序越复杂，`main()` 的内容就越长，除非你使用函数来结构化程序。\n\n函数提供了一种划分和组织程序执行逻辑的方法。它们允许你将应用程序的内容分成顺序调用的逻辑块。\n\
  \n函数是一个可选接收参数并返回值的子程序，它需要被调用来执行其任务。在本节中你将学习\n\n![图像](img/square.jpg) 函数的需求\n![图像](img/square.jpg)\
  \ 函数原型和函数定义\n![图像](img/square.jpg) 向函数传递参数并返回值\n![图像](img/square.jpg) 函数重载\n![图像](img/square.jpg)\
  \ 递归函数\n![图像](img/square.jpg) C++11 lambda 函数\n\n### 函数的需求\n\n想象一个让用户输入圆半径然后计算周长和面积的应用程序。一种方法将其全部放在\
  \ `main()` 中。另一种方法是将此程序分成逻辑块：特别是根据半径的两个。参见示例 7.1。\n\n**示例 7.1 给定半径计算圆面积和周长的两个函数**\n\
  \n点击此处查看代码\n\n```cpp\n  0: #include <iostream>\n  1: using namespace std;\n  2:\n\
  \  3: const double Pi = 3.14159265;\n  4:\n  5: // 函数声明 (原型)\n  6: double Area(double\
  \ radius);\n  7: double Circumference(double radius);\n  8:\n  9: int main()\n \
  \ 10: {\n  11:     cout << \"Enter radius: \";\n  12:     double radius = 0;\n \
  \ 13:     cin >> radius;\n  14:     cout << \"Area: \" << Area(radius) << endl;\n\
  \  15:     cout << \"Circumference: \" << Circumference(radius) << endl;\n  16:\
  \     return 0;\n  17: }\n  18:\n  19: double Area(double radius) {\n  20:     return\
  \ Pi * radius * radius;\n  21: }\n  22:\n  23: double Circumference(double radius)\
  \ {\n  24:     return 2 * Pi * radius;\n  25: }\n```\n\n\n\n\n调用函数（Calling a function）与执行函数（invoking\
  \ one）是相同的。当函数声明包含参数时，函数调用需要发送实参数（`arguments`）。实参数是函数在其参数列表中请求的值。让我们分析对列表 7.1 中\
  \ `Area()` 的调用：\n\n点击此处查看代码图像\n\n```\n16:     cout << \"Area is: \" << Area(radius)\
  \ << endl;\n```\n\n在这里，`Area(radius)` 是函数调用，其中 `radius` 是传递给函数 `Area()` 的实参数。当被调用时，执行流跳转到函数\
  \ `Area()`，该函数使用传递的 `radius` 来计算圆的面积。\n\n### 带有多个参数的函数编程\n\n假设你正在编写一个计算圆柱表面积的程序，如图图\
  \ 7.2 所示\n\n![Image](img/07fig02.jpg)\n\n**图 7.2** 一个圆柱。\n\n你使用的公式如下：\n\n点击此处查看代码图像\n\
  \n圆柱面积 = 顶圆面积 + 底圆面积 + 侧面面积\n= Pi * radius² + Pi * radius ² + 2 * Pi * radius *\
  \ height\n= 2 * Pi * radius² + 2 * Pi * radius * height\n\n因此，在计算圆柱面积时，你需要处理两个变量：`radius`\
  \ 和 `height`。在这种情况下，在编写计算圆柱表面积的函数时，你需要在函数声明的参数列表中指定至少两个参数。你通过如列表 7.2 所示，用逗号分隔各个参数来实现这一点。\n\
  \n**列表 7.2** 接受两个参数以计算圆柱表面积的函数\n\n点击此处查看代码图像\n\n```cpp\n0: #include <iostream>\n\
  1: using namespace std;\n2:\n3: const double Pi = 3.14159265;\n4:\n5: // Declaration\
  \ contains two parameters\n6: double SurfaceArea(double radius, double height);\n\
  7:\n8: int main()\n9: {\n10:     cout << \"Enter the radius of the cylinder: \"\
  ;\n11:     double radius = 0;\n12:     cin >> radius;\n13:     cout << \"Enter the\
  \ height of the cylinder: \";\n14:     double height = 0;\n15:     cin >> height;\n\
  16:\n17:     cout << \"Surface area: \" << SurfaceArea(radius, height) << endl;\n\
  18:\n19:     return 0;\n20: }\n21:\n22: double SurfaceArea(double radius, double\
  \ height)\n23: {\n24:     double area = 2 * Pi * radius * radius + 2 * Pi * radius\
  \ * height;\n25:     return area;\n26: }\n```\n\n输出 ![Image](img/arrow.jpg)\n\n\
  点击此处查看代码图像\n\nEnter the radius of the cylinder: 3\nEnter the height of the cylinder:\
  \ 6.5\nSurface Area: 179.071\n\n分析 ![Image](img/arrow.jpg)\n\n第 6 行包含了函数 `SurfaceArea()`\
  \ 的声明，带有两个参数：`radius` 和 `height`，它们的类型均为 `double`，并用逗号分隔。第 22–26 行显示了定义——即 `SurfaceArea()`\
  \ 的实现。如你所见，输入参数 `radius` 和 `height` 用于计算存储在局部变量 `area` 中的值，然后该值被返回给调用者。\n\n**注意**\n\
  函数参数类似于局部变量。它们仅在函数作用域内有效。因此，在列表 7.2 中，函数 `SurfaceArea()` 内部的 `radius` 和 `height`\
  \ 是 `main()` 中同名变量的副本。\n\n### 无参数或无返回值的函数编程\n\n如果你将说出“Hello World”的任务委托给一个只做这一件事而不做其他任何事情的函数，你可以使用不需要任何参数的函数（因为它除了打印“Hello”之外不需要做任何事情），可能还可以使用不需要返回任何值的函数（因为你不期望这样的函数能提供任何有用功能）。列表\
  \ 7.3 演示了这样一个函数。\n\n**列表 7.3** 无参数且无返回值的函数\n\n点击此处查看代码图像\n\n```cpp\n0: #include\
  \ <iostream>\n1: using namespace std;\n2:\n3: void SayHello();\n4:\n5: int main()\n\
  6: {\n7:     SayHello();\n8:     return 0;\n9: }\n10:\n11: void SayHello()\n12:\
  \ {\n13:     cout << \"Hello World\" << endl;\n14: }\n```\n\n输出 ![Image](img/arrow.jpg)\n\
  Hello World\n\n分析 ![Image](img/arrow.jpg)\n\n注意，第 3 行的函数声明显示 `SayHello()` 是 `void`\
  \ 类型，这意味着 `SayHello()` 没有返回值。在第 11 行的函数定义中没有 `return` 语句。有些程序员更喜欢在末尾插入 `return`：\n\
  \n```cpp\nvoid SayHello()\n{\n    cout << \"Hello World\" << endl;\n    return;\n\
  }\n```\n\n### 带有默认值的参数\n\n到目前为止，你假设 `Pi` 是固定的，从未给过更改它的机会。如何编写一个使用 `Pi` 作为默认值的函数呢？\n\
  \n一种方法是在函数声明中提供默认值，如列表 7.1 所示：\n\n```cpp\ndouble Area(double radius, double pi =\
  \ 3.14);\n```\n\n注意第二个参数 `pi` 被赋予了 `3.14` 的默认值。因此，当调用者不提供第二个参数时，函数可以这样调用：\n\n`Area(radius)`\n\
  \n在这种情况下，如果需要，同一个函数可以使用两个参数来调用：\n\n`Area(radius, 3.14159)` 列表 7.4 演示了如何编写带有默认值参数的函数，这些值可以用用户提供的的值来覆盖。\n\
  \n**列表 7.4** 使用带有默认值参数 Pi 计算圆面积的函数\n\n点击此处查看代码图像\n\n```cpp\n0: #include <iostream>\n\
  1: using namespace std;\n2:\n3: // 函数声明（原型）\n4: double Area(double radius, double\
  \ pi = 3.14);\n5:\n6: int main()\n7: {\n8:     cout << \"Enter radius: \";\n9: \
  \    double radius = 0;\n10:     cin >> radius;\n11:\n12:     cout << \"pi is 3.14,\
  \ do you wish to change this (y / n)? \";\n13:     char changePi = 'n';\n14:   \
  \  cin >> changePi;\n15:\n16:     double circleArea = 0;\n17:     if (changePi ==\
  \ 'y')\n18:     {\n19:         cout << \"Enter new pi: \";\n20:         double newPi\
  \ = 3.14;\n21:         cin >> newPi;\n22:         circleArea = Area(radius, newPi);\n\
  23:     }\n24:     else\n25:         circleArea = Area(radius); // 忽略第二个参数，使用默认值\n\
  26:\n27:     // 调用函数 \"Area\"\n28:     cout << \"Area is: \" << circleArea << endl;\n\
  29:\n30:     return 0;\n31: }\n32:\n33: // 函数定义（实现）\n34: double Area(double radius,\
  \ double pi)\n35: {\n36:     return pi * radius * radius;\n37: }\n```\n\n输出 ![Image](img/arrow.jpg)\n\
  \n点击此处查看代码图像\n\nEnter radius: 1\npi is 3.14, do you wish to change this (y / n)?\
  \ n\nArea is: 3.14\n\n下次运行：\n\n点击此处查看代码图像\n\nEnter radius: 1\nPi is 3.14, do you\
  \ wish to change this (y / n)? y\nEnter new pi: 3.1416\nArea is: 3.1416\n\n\n\n\n\
  在这两次运行中，用户输入的半径是相同的——都是 1。然而，在第二次运行中，用户选择了更改 Pi 的精度，因此计算出的面积略有不同。请注意，在两种情况下，如第 22\
  \ 行和 25 行所示，你调用了同一个函数。第 25 行调用 `Area()` 时没有提供第二个参数 `pi`。在这种情况下，`Area()` 中的参数 `pi`\
  \ 包含值 3.14，这是在第 4 行的声明中提供的默认值。\n\n### 注意\n你可以多个默认参数；但这些参数都应该位于参数列表的末尾。\n\n### 递归——调用自身的函数\n\
  在某些情况下，你实际上可以让一个函数调用自己。这样的函数被称为*递归函数*。注意，递归函数应该有一个定义非常的退出条件，在该条件下它将在不再次调用自身的情况下返回。\n\
  \n### 警告\n如果没有退出条件，或者退出条件出现错误，你的程序执行将卡在不会停止调用自身的递归函数中，这最终会在发生“栈溢出”时停止，导致应用程序崩溃。\n\
  \n递归函数在确定斐波那契数列中的数字时非常有用，如列表 7.5 所示。该序列从两个数字 0 和 1 开始：\n\n$F(0) = 0$\n$F(1) = 1$\n\
  \n序列中后续数字的值前两个数字之和。因此，第 n* 个值（当 n > 1 时）由（递归）公式确定：\n\n点击此处查看代码图像\n\n`Fibonacci(n)\
  \ = Fibonacci(n - 1) + Fibonacci(n - 2)`\n\n结果是，斐波那契数列扩展为\n\n点击此处查看代码图像\n\n$F(2)\
  \ = 1$\n$F(3) = 2$\n$F(4) = 3$\n$F(5) = 5$\n$F(6) = 8$，依此类推。\n\n**列表 7.5** 使用递归函数计算斐波那契数列中的数字\n\
  \n点击此处查看代码图像\n\n```cpp\n0: #include <iostream>\n1: using namespace std;\n2:\n3:\
  \ int GetFibNumber(int fibIndex)\n4: {\n5:     if (fibIndex < 2)\n6:         return\
  \ fibIndex;\n7:     else // 如果 fibIndex >= 2 则递归\n8:         return GetFibNumber(fibIndex\
  \ - 1) + GetFibNumber(fibIndex - 2);\n9: }\n10:\n11: int main()\n12: {\n13:    \
  \ cout << \"Enter 0-based index of desired Fibonacci Number: \";\n14:     int index\
  \ = 0;\n15:     cin >> index;\n16:\n17:     cout << \"Fibonacci number is: \" <<\
  \ GetFibNumber(index) << endl;\n18:     return 0;\n19: }\n```\n\n输出 ![Image](img/arrow.jpg)\n\
  \n点击此处查看代码图像\n\n输入所需的斐波那契数字的从 0 开始的索引: 6\n斐波那契数字是: 8\n\n分析 ![Image](img/arrow.jpg)\n\
  \n在第 3-9 行定义的函数 `GetFibNumber()` 是递归的，因为它在第 8 行调用了自己。在第 5 行和第 6 行编写的退出条件确保了如果 `fibIndex`\
  \ 小于二，函数将在不进行递归的情况下返回。因此，`GetFibNumber()` 以不断减小的 `fibIndex` 值递归地调用自己。它最终会达到满足退出条件的状态，递归结束，并确定一个斐波那契值并返回给\
  \ `main()`。\n\n### 具有多个返回语句的函数\n你不受限制在函数定义中只能有一个 `return` 语句。你可以从函数的任何点返回，并且如果你需要，甚至可以多次返回，如列表\
  \ 7.6 所示。根据逻辑和应用程序的需求，这可能是（也可能不是）一种糟糕的编程实践。\n\n**列表 7.6** 在一个函数中使用多个返回语句\n\n点击此处查看代码图像\n\
  \n```cpp\n0: #include <iostream>\n1: using namespace std;\n2: const double Pi =\
  \ 3.14159265;\n3:\n4: void QueryAndCalculate()\n5: {\n6:     cout << \"Enter radius:\
  \ \";\n7:     double radius = 0;\n8:     cin >> radius;\n9:\n10:    cout << \"Area:\
  \ \" << Pi * radius << endl;\n11:\n12:    cout << \"Do you wish to calculate circumference\
  \ (y/n)? \";\n13:    char calcCircum = 'n';\n14:    cin >> calcCircum;\n15:\n16:\
