  \ 中详细解释 Vector。\n\n***\n\n### C 风格字符串\nC 风格字符串是字符数组的一种特殊情况。你已经在代码中编写的字符串字面量形式看到了一些\
  \ C 风格字符串的示例：\n\n```cpp\nstd::cout << \"Hello World\";\n```\n\n这等同于使用数组声明：\n\n点击查看代码图像\n\
  \n```cpp\nchar sayHello[] = {'H', 'e', 'l', 'l', 'o', ' ', 'W', 'o', 'r', 'l', 'd',\
  \ '\\0'};\nstd::cout << sayHello << std::endl;\n```\n\n注意数组中的最后一个字符是空字符 `\\0`。这也被称为字符串终止符，因为它告诉编译器字符串已结束。此类\
  \ C 风格字符串是字符数组的一种特例，因为其最后一个字符总是位于终止符 `\\0` 之前。当你在代码中嵌入字符串字面量时，编译器会完成在其后添加 `\\0`。\n\
  \n如果你在数组中间的任何位置插入 `'\\0'`，不会改变数组的大小；它只意味着使用该数组作为输入进行字符串处理会在该点停止。Listing 4.5 演示了这一点。\n\
  \n***\n\n### 注意事项\n对你来说 `'\\0'` 看起来像两个字符，它确实是使用键盘输入的两个字符。然而，反斜杠是一个编译器理解的特殊转义代码，`\\\
  0` 表示空——即它要求编译器在该处插入一个空值或零。\n\n你不能直接写 `'0'`，因为它会被接受为字符零，其非零 ASCII 值为 48。\n\n请检查附录\
  \ D 中的表格“`ASCII 码，`”查看此值以及其他 ASCII 值。\n\n***\n\n**Listing 4.5** 分析 C 风格字符串中的空终止符\n\
  \n点击查看代码图像\n\n***\n\n```cpp\n0: #include <iostream>\n1: using namespace std;\n2:\n\
  3: int main()\n4: {\n5:     char sayHello[] = {'H','e','l','l','o',' ','W','o','r','l','d','\\\
  0'};\n6:     cout << sayHello << endl;\n7:     cout << \"Size of array: \" << sizeof(sayHello)\
  \ << endl;\n8:\n9:     cout << \"Replacing space with null\" << endl;\n10:     sayHello[5]\
  \ = '\\0';\n11:     cout << sayHello << endl;\n12:     cout << \"Size of array:\
  \ \" << sizeof(sayHello) << endl;\n13:\n14:     return 0;\n15: }\n```\n\n输出 ![Image](img/arrow.jpg)\n\
  \n点击查看代码图像\n\nHello World\nSize of array: 12\nReplacing space with null\nHello\n\
  Size of array: 12\n\n分析 ![Image](img/arrow.jpg)\n\n第 10 行我们用空终止符替换了“Hello World”中的空格。注意，数组现在有两个终止符，但是第一个终止符导致了第\
  \ 11 行字符串的显示。\n\n***\n\n### 注意\n如果你在 Listing 4.5 中声明并初始化数组时忘记添加 `'\\0'`，那么预计输出将包含乱码。`std::cout`\
  \ 可能会越过数组的边界。\n\nC 风格字符串充满了危险。Listing 4.6 演示了这一点。\n\n**Listing 4.6** 使用 C 风格的风险应用程序\n\
