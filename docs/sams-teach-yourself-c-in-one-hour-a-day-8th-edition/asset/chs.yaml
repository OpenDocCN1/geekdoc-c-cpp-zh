  \ 16 行中的实例 `another-Person` 未声明为常量，因此它的实例化或使用可能不会被编译器视为常量表达式。\n\n### 总结\n\n这节课你学习了\
  \ C++ 中最基础的关键字和概念之一：类（class）。你学习了类如何封装成员数据以及操作这些数据的成员函数。你看到了诸如 `public` 和 `private`\
  \ 等访问修饰符如何帮助你抽象类外部实体不需要看到的数据和功能。你学习了拷贝构造函数的概念，以及 C++11 引入的移动构造函数，它们有助于减少不必要的拷贝步骤。你还看到了一些特殊情况，在这些情况下，所有元素共同工作以帮助你实现单例模式（singleton）等设计模式。\n\
  \n### 问答\n\n**Q 类的实例（instance）和类的对象（object）有什么区别？**\n\n**A** 本质上没有。当你实例化一个类时，你得到一个也可以称为对象的实例。\n\
  \n**Q 访问成员更好的方法是什么：使用点运算符 (`.`) 还是使用指针运算符 (`->`) ？**\n\n**A** 如果你有一个指向对象的指针，指针运算符最为合适。如果你在栈上实例化了一个对象并作为局部变量，那么点运算符最为合适。\n\
  \n**Q 我应该总是编写拷贝构造函数吗？**\n\n**A** 如果你的类数据成员是编写良好的智能指针、字符串类或如 `std::vector` 等 STL\
  \ 容器，那么编译器插入的默认拷贝构造函数会确保调用它们各自的拷贝构造函数。然而，如果你的类有原始指针成员（例如用于动态数组的 `int*` 而不是 `std::vector<int>`），你需要提供一个编写良好的拷贝构造函数，以确保在按值传递该类对象的函数调用期间对数组进行深拷贝。\n\
  \n**Q 我的类只有一个定义了带有默认值参数的构造函数。这仍然是默认构造函数吗？**\n\n**A** 是的。如果类的实例可以在没有参数的情况下创建，则该类被称为具有默认构造函数。一个类只能有一个默认构造函数。\n\
  \n**Q 为什么本课中的某些示例使用 `SetAge()` 等函数来设置整数 `Human::age`？为什么不直接让 `age` 为公有并按需赋值？**\n\
  \n**A** 从技术角度来看，将 `Human::age` 变为 `public` 成员同样可行。但从设计角度来看，保持成员数据为私有是一个好主意。`GetAge()`\
  \ 或 `SetAge()` 等访问函数是访问这些私有数据的精细且可扩展的方法，允许你在设置或重置 `Human::age` 值之前对实例进行错误检查。\n\n\
  **Q 为什么拷贝构造函数的参数是通过引用传递拷贝源？**\n\n**A** 首先，编译器期望拷贝构造函数是。背后的原因是，如果拷贝构造函数按值接受拷贝源，它将调用自己，导致无限拷贝循环。\n\
  \n### 工作坊\n\n工作坊提供了测验题来帮助你巩固对所涵盖内容的理解，并提供了练习让你获得使用所学知识的经验。在检查 附录 E 中的答案之前，尝试回答测验和练习题，并在继续下一节之前确保你理解了答案。\n\
