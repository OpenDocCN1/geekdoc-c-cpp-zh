  \n点击此处查看代码图像\n\n`Human adam(\"Adam\");` // `adam.age` 被赋值默认值 25\n\n`Human eve(\"\
  Eve\", 18);` // `eve.age` 被赋值指定的 18\n\n### 注意\n\n注意，默认构造函数是不带参数实例化的构造函数，而不一定是不带参数的构造函数。因此，这个带有两个默认值的参数构造函数就是一个默认构造函数：\n\
  \n点击此处查看代码图像\n\n```cpp\nclass Human\n{\nprivate:\n   string name;\n   int age;\n\
  public:\n   // 两个参数都有默认值\n   Human(string humansName = \"Adam\", int humansAge =\
  \ 25)\n   {\n        name = humansName;\n        age = humansAge;\n   }\n};\n```\n\
  \n\n\n\n\n```cpp\n        cout << \"Overloaded constructor creates \";\n       \
  \ cout << name << \" of age \" << age;\n    }\n};\n```\n\n原因是 `class Human` 仍然可以在不带参数的情况下进行实例化：\n\
  \n点击此处查看代码图片\n\n`Human adam;` // `Human` 使用默认名称 \"Adam\"，`age` 为 25\n\n### 使用初始化列表的构造函数\n\
  \n你已经见过构造函数在初始化成员变量时是多么有用。初始化成员的另一种方法是使用*初始化列表*（initialization lists）。列表 9.5 中初始化列表的构造函数变体如下所示：\n\
  \n点击此处查看代码图片\n\n```cpp\nclass Human\n{\nprivate:\n   string name;\n   int age;\n\
  public:\n   // 两个用于初始化成员 age 和 name 的参数\n   Human(string humansName, int humansAge)\n\
  \       :name(humansName), age(humansAge)\n   {\n       cout << \"Constructed a\
  \ human called \" << name;\n       cout << \", \" << age << \" years old\" << endl;\n\
  \   }\n// ... 其他类成员\n};\n```\n\n因此，初始化列表的特征是在圆括号 `(...)` 中的参数声明后跟着一个冒号 (`:`)，随后是一个单独成员变量及其被初始化的值。该初始化值可以是如\
  \ `humansName` 这样的参数，甚至是一个固定值。初始化列表在带有特定参数调用基类构造函数时也有用。这些将在第 10 ，“实现继承.](#ch10.html_ch10)”中再次讨论。\n\
  \n你可以在列表 9.6 中看到一个具有带参数默认构造函数、默认值和初始化列表的 `class Human` 版本。\n\n**列表 9.6** 接受带有默认值的参数，并使用初始化列表设置成员的默认构造函数\n\
  \n点击此处查看代码图片\n\n```cpp\n  0: #include <iostream>\n  1: #include <string>\n  2: using\
