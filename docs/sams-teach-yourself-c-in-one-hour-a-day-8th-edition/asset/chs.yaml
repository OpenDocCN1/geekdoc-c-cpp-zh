  \ 26 行与 'x' 进行比对，如果是，则执行随后的 `break`，结束无限循环。\n\n注意\n\nListing 6.13 使用空的 `for(;;)`\
  \ 来创建一个无限循环。你可以用 `while(true)` 替换它，以便使用不同的循环类型生成相同的输出。\n\n#### 做\n- 当 `do...while`\
  \ 循环中的逻辑至少执行一次时使用 `do...while`。\n- 使用带有明确条件表达式的 `while`、`do...while` 或 `for` 循环。\n\
  - 缩进循环的代码以提高可读性。\n\n### 不要\n- 使用 `goto`。\n- 随意使用 `continue` 和 `break`。\n- 除非绝对必要，否则使用\
  \ `break` 终止无限循环。\n\n### 嵌套循环\n\n正如在本节开头你看到的嵌套 `if` 语句一样，你经常在一个循环下嵌套另一个循环。如果你想找到\
  \ `array1` 中每个数字乘以 `array2` 中每个数字的积，可以使用嵌套循环使编程变得简单。第一个循环遍历 `array1`，而第二个循环在第一个循环内部遍历\
  \ `array2`。\n\nListing 6.14 展示了嵌套循环的使用。\n\n**列表 6.14** 使用嵌套循环将数组中的元素与另一个数组的元素相乘\n\
  \n点击此处查看代码图片\n\n```cpp\n0: #include <iostream>\n1: using namespace std;\n2:\n3:\
  \ int main()\n4: {\n5:     const int ARRAY1_LEN = 3;\n6:     const int ARRAY2_LEN\
  \ = 2;\n7:\n8:     int myNums1[ARRAY1_LEN] = {35, -3, 0};\n9:     int myNums2[ARRAY2_LEN]\
  \ = {20, -1};\n10:\n11:     cout << \"Multiplying each int in myNums1 by each in\
  \ myNums2:\" << endl;\n12:\n13:     for(int index1 = 0; index1 < ARRAY1_LEN; ++index1)\n\
  14:         for(int index2 = 0; index2 < ARRAY2_LEN; ++index2)\n15:            \
  \ cout << myNums1[index1] << \" x \" << myNums2[index2] << \\\n16:             <<\
  \ \" = \" << myNums1[index1] * myNums2[index2] << endl;\n17:\n18:     return 0;\n\
  19: }\n```\n\n输出 ![Image](img/arrow.jpg)\n\nMultiplying each int in myNums1 by each\
  \ in myNums2:\n35 x 20 = 700\n35 x -1 = -35\n-3 x 20 = -60\n-3 x -1 = 3\n0 x 20\
  \ = 0\n0 x -1 = 0\n\n\n\n\n\n在第 4 节中，你学习了多维数组。实际上，在列表 4.3 中，你访问了一个三行三列的二维数组中的元素。你当时所做的是逐个访问数组中的每个元素，每行一个。这并没有自动化，而且如果需要扩大数组，除了更改数组的维度以访问其元素外，你还需要编写更多的代码。然而，使用循环可以改变这一切，如列表\
  \ 6.15 所示。\n\n### 列表 6.15 使用嵌套循环遍历整数二维数组中的元素\n\n点击此处查看代码图像\n\n* * *\n\n```cpp\n\
  0: #include <iostream>\n1: using namespace std;\n2:\n3: int main()\n4: {\n5:   \
  \  const int NUM_ROWS = 3;\n6:     const int NUM_COLUMNS = 4;\n7:\n8:     // 2D\
  \ array of integers\n9:     int MyInts[NUM_ROWS][NUM_COLUMNS] = { {34, -1, 879,\
  \ 22},\n10:                                     {24, 365, -101, -1},\n11:      \
  \                               {-20, 40, 90, 97} };\n12:\n13:     // iterate rows,\
  \ each array of int\n14:     for (int row = 0; row < NUM_ROWS; ++row)\n15:     {\n\
  16:         // iterate integers in each row (columns)\n17:         for (int column\
  \ = 0; column < NUM_COLUMNS; ++column)\n18:         {\n19:             cout << \"\
  Integer[\" << row << \"][\" << column \\\n20:                 << \"] = \" << MyInts[row][column]\
  \ << endl;\n21:         }\n22:     }\n23:\n24:     return 0;\n25: }\n```\n\n* *\
  \ *\n\n输出 ![Image](img/arrow.jpg)\n\n点击此处查看代码图像\n\nInteger[0][0] = 34\nInteger[0][1]\
  \ = -1\nInteger[0][2] = 879\nInteger[0][3] = 22\nInteger[1][0] = 24\nInteger[1][1]\
  \ = 365\nInteger[1][2] = -101\nInteger[1][3] = -1\nInteger[2][0] = -20\nInteger[2][1]\
  \ = 40\nInteger[2][2] = 90\nInteger[2][3] = 97\n\n### 分析 ![Image](img/arrow.jpg)\n\
  \n第 14–22 行包含两个 `for` 循环，你需要它们来访问并遍历整数二维数组。二维数组实际上是整数数组的数组。注意第一个 `for` 循环是如何访问行的（每行都是一个整数数组），而第二个循环是如何访问该数组中的每个元素——即访问其中的列。\n\
  \n* * *\n\n注意\n\n列表 6.15 使用大括号包裹嵌套的 `for` 仅是为了提高可读性。这种嵌套循环在不使用大括号的情况下也能正常工作，因为循环语句只是一个要执行的单一语句（而不是需要使用大括号封装的复合语句）。\n\
  \n* * *\n\n### 使用嵌套循环计算数字\n\n著名的斐波那契数列是一组从 0 和 1 开始的数字，数列中之后的每一个数字都是前两个数字之和。因此，一个斐波那契数列从如下序列开始：0,\
  \ 1, 1, 2, 3, 8, ... 等。列表 6.16 演示了如何创建任意数量数字的斐波那契数列（受限于存储最后一个数字的整数的数据位限制）。\n\n###\
  \ 列表 6.16 使用嵌套循环计算斐波那契数列\n\n点击此处查看代码图像\n\n* * *\n\n```cpp\n0: #include <iostream>\n\
  1: using namespace std;\n2:\n3: int main()\n4: {\n5:     const int numsToCalculate\
  \ = 5;\n6:     cout << \"This program will calculate \" << numsToCalculate \\\n\
  7:         << \" Fibonacci Numbers at a time\" << endl;\n8:\n9:     int num1 = 0,\
  \ num2 = 1;\n10:    char wantMore = '\\0';\n11:    cout << num1 << \" \" << num2\
  \ << \" \";\n12:\n13:    do\n14:    {\n15:         for (int counter = 0; counter\
  \ < numsToCalculate; ++counter)\n16:         {\n17:             cout << num1 + num2\
  \ << \" \";\n18:\n19:             int num2Temp = num2;\n20:             num2 = num1\
  \ + num2;\n21:             num1 = num2Temp;\n22:        }\n23:        cout << endl\
  \ << \"Do you want more numbers (y/n)? \";\n24:        cin >> wantMore;\n25:   \
  \ }while (wantMore == 'y');\n26:\n27:    cout << \"Goodbye!\" << endl;\n28:    return\
  \ 0;\n29: }\n```\n\n* * *\n\n输出 ![Image](img/arrow.jpg)\n\n点击此处查看代码图像\n\nThis program\
  \ will calculate 5 Fibonacci Numbers at a time\n0 1 1 2 3 \nDo you want more numbers\
  \ (y/n)? y\n13 21 34 55 89 \nDo you want more numbers (y/n)? y\n144 233 377 610\
  \ 987 \nDo you want more numbers (y/n)? y\n1597 2584 4181 6765 10946 \nDo you want\
  \ more numbers (y/n)? n\nGoodbye!\n\n### 分析 ![Image](img/arrow.jpg)\n\n第 13 行的外部\
  \ `do...while` 基本上是用户想要更多数字时的查询循环。第 15 行的内部 `for` 循环负责计算下一个斐波那契数并一次显示五个。在第 19 行，你将\
  \ `num2` 的值存储在临时变量 `num2Temp` 中，以便在第 21 行重用。注意，如果你没有存储这个临时值，你将把第 20 行修改后的值直接给 `num1`，这并不是你想要的。当用户按下\
  \ ‘y’ 以获取更多数字时，`do...while` 循环再次执行，从而再次执行生成五个斐波那契数的嵌套循环。\n\n### 总结\n\n本节教了你如何编写创建替代执行路径和让代码块循环的条件语句。你学习了\
  \ `if...else` 结构以及使用 `switch-case` 语句处理变量包含不同值时的情况。\n\n在理解循环方面，你学习了 `goto`——但同时也被警告不要使用它，因为它会产生无法理解的代码。你学习了使用\
  \ `while`、`do...while` 和 `for` 结构在 C++ 中进行循环编程。\n\n### 练习\n\n练习提供了测题来帮助你巩固对所涵盖内容的理解，并提供了练习让你获得使用所学知识的经验。在查看附录\
  \ E 中的答案之前，尝试回答测验和练习题，并在继续下一节之前确保你理解答案。\n\n#### 测验\n\n**1.** 为什么在没有缩进的情况下也能编译，却要在语句块、嵌套\
