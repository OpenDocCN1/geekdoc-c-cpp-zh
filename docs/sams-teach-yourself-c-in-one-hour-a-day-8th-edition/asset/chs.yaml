  \n有两个名为 `DisplayArray()` 的重载函数：一个用于显示整数数组的内容，另一个用于显示字符数组的内容。在第 22 行和第 25 行中，这两个函数分别使用整数数组和字符数组作为输入。请注意，在第\
  \ 24 行声明并初始化字符数组时，出于最佳实践和良好习惯，你已经包含了空字符——尽管该数组在 `cout` 语句中并没有被当作字符串使用（`cout << myStatement;`）。\n\
  \n#### 通过引用传递参数\n\n再次查看列表 7.1 中根据给定半径计算圆面积的函数：\n\n```cpp\n// 函数定义（实现）\ndouble Area(double\
  \ radius)\n{\n    return Pi * radius * radius;\n}\n```\n\n在这里，参数 `radius` 包含一个值，当在\
  \ `main()` 中调用函数时，该值会被复制进去：\n\n```cpp\n// 调用函数 \"Area\"\ncout << \"Area is: \" <<\
  \ Area(radius) << endl;\n```\n\n这意味着 `main()` 中的变量 `radius` 不受函数调用的影响，因为 `Area()`\
  \ 是在存储在 `radius` 中的值的副本上运行。在某些情况下，你可能需要函数作用于一个变量以修改函数外部可用的值。当你声明一个接受引用的参数以修改调用函数中的值时，就会这种情况。作为引用参数返回面积的\
  \ `Area()` 函数形式如下：\n\n```cpp\n// 输出参数\nvoid Area(double radius, double& result)\n\
  {\n    result = Pi * radius;\n}\n```\n\n注意这种形式的 `Area()` 接受两个参数。注意第二个参数 `result`\
  \ 旁边的取地址符 `&`。该符号指示编译器第二个参数不应被复制到函数中；相反，它是所传变量的引用。返回类型已更改为 `void`，因为函数不再作为返回值提供面积，而是作为输出参数。列表\
  \ 7.9 展示了通过引用返回值，它计算圆的面积。\n\n**列表 7.9** 作为参数而非返回值获取圆面积\n\n```cpp\n#include <iostream>\n\
  using namespace std;\n\nconst double Pi = 3.1416;\n\n// 输出参数\nvoid Area(double radius,\
  \ double& result)\n{\n    result = Pi * radius * radius;\n}\n\nint main()\n{\n \
  \   cout << \"Enter radius: \";\n    double radius = 0;\n    cin >> radius;\n\n\
  \    double areaFetched = 0;\n    Area(radius, areaFetched);\n\n    cout << \"The\
  \ area is: \" << areaFetched << endl;\n    return 0;\n}\n```\n\n输出 ![Image](img/arrow.jpg)\n\
  输入半径: 2\n圆面积为: 12.5664\n\n### 分析 ![Image](img/arrow.jpg)\n\n注意第 17 行和第 18 行，调用 `Area()`\
  \ 函数时使用了两个参数；第二个参数是包含结果的参数。由于 `Area()` 以引用接受第二个参数，`Area` 内部第 8 行使用的变量 `result` 与调用者\
  \ `main()` 中第 17 行声明的 `double areaFetched` 指向同一个内存位置。因此，在 `Area()` 函数第 8 行计算的结果在\
  \ `main()` 中可用，并在第 20 行显示在屏幕上。\n\n**注意**\n\n函数只能使用 `return` 语句返回一个值。因此，如果你的函数需要执行影响调用者处所需的多个值的操作，通过引用传递参数是让函数将这些许多修改提供回调用模块的一种方法。\n\
  \n\n\n\n\n虽然确切知道函数调用在微处理器层面上如何实现并非极端重要，但你可能会觉得很有趣。理解这有助于你理解为什么 C++ 提供了编程内联函数（inline\
  \ functions）的选项，这些将在本节稍后的部分进行解释。\n\n函数调用本质上意味着微处理器将跳转到非连续内存位置，开始执行属于被调用函数的下一条指令。在执行完函数中的指令后，它会返回到之前离开的地方。为了实现这一逻辑，编译器会将你的函数调用转换为微处理器的\
  \ `CALL` 指令。该指令附带了下一条指令需要跳转的内存地址——该地址属于你的函数例程。当微处理器遇到 `CALL` 时，它会将函数调用后要执行的指令位置保存在栈上，并跳转到\
  \ `CALL` 指令中包含的内存位置。\n\n## 理解栈（Stack）\n\n栈是一种后进先出（Last-In-First-Out）的内存结构，就像一叠盘子，你挑选最上面的那个盘子，而它正是最后被放在栈上的一个。将数据放入栈中称为\
  \ `push` 操作。从栈中取出数据称为 `pop` 操作。随着栈向上增长，栈指针始终随着增长而递增，并指向栈顶。请参见图 7.3。\n\n![Image](img/07fig03.jpg)\n\
  \n**图 7.3** 包含三个整数的栈的视觉化表示。\n\n栈的特性使其非常适合处理函数调用。当函数被调用时，所有局部变量都会在栈上实例化——也就是说，被推入栈。当函数结束时，它们被简单地从栈中弹出，栈指针返回原始位置。\n\
  \n该内存位置包含属于函数的指令。微处理器执行这些指令，直到遇到 `RET` 语句（你编写的用于微处理器的 `return` 代码）。`RET` 语句会导致微处理器从执行\
  \ `CALL` 指令期间存储的栈中弹出该地址。该地址包含了调用函数中执行需要继续执行的位置。因此，微处理器回到了调用者处，并从之前离开的地方继续执行。\n\n\
  ## 内联函数（Inline Functions）\n\n普通的函数调用会被翻译为 `CALL` 指令，这会导致栈操作以及微处理器的执行转移到函数，等等。这听起来可能有很多底层操作在发生，但在大多数情况下，它的运行非常快。然而，如果你的函数像下面这样非常简单呢？\n\
  \n点击此处查看代码图像\n\n```cpp\ndouble GetPi()\n{\n    return 3.14159;\n}\n```\n\n对于实际执行\
  \ `GetPi()` 所花费的时间来说，对该函数执行实际函数调用的开销（Overhead）可能太高了。这就是为什么 C++ 编译器允许程序员将此类函数声明为内联（inline）。`inline`\
  \ 关键字是程序员的请求，要求这些函数在调用处进行内联展开。\n\n点击此处查看代码图像\n\n```cpp\ninline double GetPi()\n\
  {\n    return 3.14159;\n}\n```\n\n执行诸如数字倍增等简单操作的函数也是内联的良好候选。列表 7.10 展示了这样一个案例。\n\
  \n**列表 7.10** 使用将整数倍增的内联函数\n\n点击此处查看代码图像\n\n```cpp\n0: #include <iostream>\n1: using\
  \ namespace std;\n2:\n3: // 定义一个数字翻倍的内联函数\n4: inline long DoubleNum (int inputNum)\n\
  5: {\n6:     return inputNum * 2;\n7: }\n8:\n9: int main()\n10: {\n11:     cout\
  \ << \"Enter an integer: \";\n12:     int inputNum = 0;\n13:     cin >> inputNum;\n\
  14:\n15:     // 调用内联函数\n16:     cout << \"Double is: \" << DoubleNum(inputNum) <<\
  \ endl;\n17:\n18:     return 0;\n19: }\n```\n\n输出 ![Image](img/arrow.jpg)\n\n点击此处查看代码图像\n\
  \nEnter an integer: 35\nDouble is: 70\n\n分析 ![Image](img/arrow.jpg)\n\n涉及的关键字是第\
  \ 4 行中的 `inline`。编译器通常将此关键字视为请求，将函数 `DoubleNum()` 的内容直接放置在函数调用的地方——第 16 行——这增加了代码的执行速度。\n\
  \n将函数分类为内联也会导致大量的代码膨胀（code bloat），特别是当被内联的函数执行许多复杂的处理时。使用 `inline` 关键字应保持极少。\n\n\
  注意\n\n大多数现代编译器提供各种优化选项。某些编译器（如微软）允许你针对大小或速度进行优化。当针对大小优化时，编译器可能会拒绝内联请求，因为这会导致代码膨胀。当针对速度优化时，编译器会在合适的地方利用。\n\
  \n## 自动返回类型（Automatic Return Type）\n\n从 C++14 开始，你可以省略返回类型，让编译器根据返回值进行推断。与其指定返回类型，不如使用你在变量、声明常量中学习过的\
  \ `auto`。\n\n依赖自动返回类型推的函数在调用之前需要定义（即实现）。这是因为编译器在调用点需要知道函数的返回类型。如果此类函数有多个返回语句，它们需要推断为相同的类型。递归调用至少遵循一个返回语句。\n\
  \n列表 7.11 展示了 `auto` 在函数中的用法。\n\n```cpp\n0: #include <iostream>\n1: using namespace\
  \ std;\n2:\n3: const double Pi = 3.14159265;\n4:\n5: auto Area(double radius)\n\
  6: {\n7:     return Pi * radius * radius;\n8: }\n9:\n10: int main()\n11: {\n12:\
  \     cout << \"Enter radius: \";\n13:     double radius = 0;\n14:     cin >> radius;\n\
  15:\n16:     // 调用函数 \"Area\"\n17:     cout << \"Area is: \" << Area(radius) <<\
  \ endl;\n18:\n19:     return 0;\n20: }\n```\n\n输出 ![Image](img/arrow.jpg)\n\nEnter\
  \ radius: 2\nArea is: 12.5664\n\n分析 ![Image](img/arrow.jpg)\n\n关注的行是第 5 行，它将 `auto`\
  \ 作为函数 `Area()` 的返回类型。编译器根据返回表达式推断返回类型。因此，尽管使用了 `auto`，列表 7.11 中的 `Area()` 编译结果与返回类型为\
  \ double 的 `Area()` 相比没有区别。\n\n## Lambda 函数\n\n本节只是对初学者来说并不容易掌握的概念的介绍。因此，请浏览一遍并尝试学习这个概念，不要因为完全理解而感到失望。Lambda\
  \ 函数将在第 22 节中进行深入讨论。\n\n\n\n\nLambda 函数是在 C++11 中引入的，有助于在使用 STL 算法时对数据进行排序或处理。通常，`sort`\
  \ 函数需要你提供一个二元谓词（binary predicate）。这是一个比较两个参数的函数，如果其中一个参数小于另一个，则返回 `true`，否则返回 `false`，从而帮助决定排序操作中元素的顺序。此类谓词通常被实现为类中的运算符，这会导致一些繁琐的代码工作。Lambda\
  \ 函数可以紧凑地定义谓词定义，如 列表 7.12 所示。\n\n**列表 7.12** 使用 Lambda 函数显示数组中的元素并对其排序\n\n点击此处查看代码图像\n\
  \n***\n\n```cpp\n0: #include <iostream>\n1: #include <algorithm>\n2: #include <vector>\n\
  3: using namespace std;\n4:\n5: void DisplayNums(vector<int>& dynArray)\n6: {\n\
  7:     for_each (dynArray.begin(), dynArray.end(), \\\n8:                 [](int\
  \ Element) {cout << Element << \" \";} );\n9:\n10:     cout << endl;\n11: }\n12:\n\
  13: int main()\n14: {\n15:     vector<int> myNums;\n16:     myNums.push_back(501);\n\
  17:     myNums.push_back(-1);\n18:     myNums.push_back(25);\n19:     myNums.push_back(-35);\n\
  20:\n21:     DisplayNums(myNums);\n22:\n23:     cout << \"Sorting them in descending\
  \ order\" << endl;\n24:\n25:     sort (myNums.begin(), myNums.end(), \\\n26:   \
  \          [](int Num1, int Num2) {return (Num2 < Num1); } );\n27:\n28:     DisplayNums(myNums);\n\
  29:\n30:     return 0;\n31: }\n```\n\n***\n\n输出 ![Image](img/arrow.jpg)\n\n点击此处查看代码图像\n\
  \n501 -1 25 -35\n\n正在按降序排序\n\n501 25 -1 -35\n\n### 分析 ![Image](img/arrow.jpg)\n\n\
  程序第 15–19 行包含了以 C++ 标准库提供的 `std::vector` 形式推入动态数组的整数。`DisplayNums()` 函数使用 STL 算法\
  \ `for_each` 遍历数组中的每个元素并显示其值。在此过程中，它在第 8 行使用了一个 Lambda 函数。第 25 行使用的 `std::sort`\
  \ 也使用了一个 Lambda 函数形式的二元谓词（第 26 行），该谓词在第二个数字小于第一个时返回 `true`，从而有效地对集合进行升序排序。\n\nLambda\
  \ 函数的语法如下：\n\n点击此处查看代码图像\n\n`可选参数{语句; }`\n\n***\n\n### 注意\n\n谓词及其在 `sort` 等算法中的用法在\
  \ 第 23 节 “STL 算法”中进行了详细讨论，特别是 列表 23.6 是在算法中使用 Lambda 和非 Lambda 变体的代码示例，从而允许你比较 Lambda\
  \ 函数引入的编程效率。\n\n***\n\n### 总结\n\n在本节中，你学习了模块化编程的基础。你学习了函数如何帮助你更好地组织代码，并帮助你重用编写的算法。你学习了函数可以接受参数并返回值，参数可以具有调用者可以覆盖的默认值，而且参数也可以包含通过引用传递的参数。你学习了如何传递数组，还学习了如何编写具有相同名称和返回类型但参数列表不同的重载函数。\n\
  \n最后但同样重要的是，你初步了解了 Lambda 函数。Lambda 函数自 C++11 以来是全新的，它们有潜力改变此后 C++ 程序的编程方式，特别是在使用\
  \ STL 时。\n\n### 问答\n\n**Q 如果我编写了一个不会结束的递归函数会发生什么？**\n\n**A** 程序执行不会结束。这本身可能并不坏，因为也有执行相同操作\
  \ `while(true)` 和 `for(;;)` 循环；然而，递归调用会消耗越来越多的栈空间，栈空间是有限的且会耗尽，最终导致由于栈溢出引起的应用程序崩溃。\n\
  \n**Q 为什么不对每个函数都内联？这会提高执行速度，对吧？**\n\n**A** 这取决于情况。然而，内联每个函数会导致在多处使用的函数被放置在调用点，这会导致代码膨胀。除此之外之外，大多数现代编译器能够更好地判断哪些调用可以内联，并根据编译器的性能设置为程序员完成工作。\n\
  \n**Q 我可以为函数中的所有参数提供默认参数值吗？**\n\n**A** 是的，这完全可行，并且在合理的情况下建议这样做。\n\n**Q 我有两个函数，都命名为\
  \ Area。一个接受半径，另一个接受高度。我想让其中一个返回 float，另一个返回 double。这可行吗？**\n\n**A** 函数重载需要函数也具有相同的返回类型。在这种情况下，编译器会报错。\n\
  \n### 工作坊\n\n工作坊提供了测试题来帮助你理解所涵盖的内容，以及练习题来提供使用经验。\n\n#### 测试题\n\n1. 在函数中声明的变量的作用范围是什么？\n\
  2. 传递给此函数的性质是什么？\n`int Func(&someNumber);`\n3. 我有一个调用自己的函数。这种函数称为什么？\n4. 我声明了两个名称相同参数列表不同的函数。这些被称为什么？\n\
  5. 栈指向顶部、中间还是底部？\n\n#### 练习题\n\n1. 编写重载函数计算球体和圆体的体积。公式如下：\n`球体体积 = (4 * Pi * radius\
  \ * radius) / 3`\n`圆体体积 = Pi * radius * height`\n\n2. 编写一个接受 double 数组作为输入的函数。\n\
  \n3. **找出** 以下代码有什么问题？\n```cpp\n#include <iostream>\nusing namespace std;\nconst\
  \ double Pi = 3.1416;\n\nvoid Area(double radius, double result)\n{\n    result\
  \ = Pi * radius * radius;\n}\n\nint main()\n{\n    cout << \"Enter radius: \";\n\
  \    double radius = 0;\n    cin >> radius;\n    double areaFetched = 0;\n    Area(radius,\
  \ areaFetched);\n    cout << \"The area is: \" << areaFetched << endl;\n    return\
  \ 0;\n}\n```\n\n4. **找出** 以下函数声明有什么问题？\n`double Area(double Pi = 3.14, double radius);`\n\
  \n5. 编写一个返回类型为 void 的函数，在提供半径时帮助调用者计算圆的面积和周长。\n\n## 第 8 节 指针与引用详解\n\nC++ 的最大优势之一是它既能让你编写与机器抽象的高层应用程序，也能编写接近硬件的程序。事实上，C++\
  \ 允许你在字节和位级别调优应用程序的性能。理解指针和引用的原理是编写高效利用系统资源的程序的一步。\n\n在本节中，你将了解到\n\n什么是指针\n\n什么是自由堆（free\
  \ store）\n\n\n\n\n\n![Image](img/square.jpg) 如何使用运算符 `new` 和 `delete` 来分配内存和释放内存\n\
  \n![Image](img/square.jpg) 如何使用指针和动态分配编写稳定的应用程序\n\n![Image](img/square.jpg) 什么是引用\n\
  \n![Image](img/square.jpg) 指针和引用的区别\n\n![Image](img/square.jpg) 何时使用指针，何时使用引用\n\n\
  ### 什么是指针？\n\n`pointer` 也是一种变量——它用于存储内存中的地址。就像 `int` 类型的变量用于存储整数值一样，指针变量被用于存储内存地址，如图\
  \ 8.1 所示。\n\n![Image](img/08fig01.jpg)\n\n**图 8.1** 指针的可视化。\n\n因此，指针是一个变量，和所有变量一样，指针占据着内存中的空间（在图\
  \ 8.1 中，地址为 `0x101`）。指针的特殊之处在于指针中所包含的值（在本例中为 `0x558`）被解释为一个内存地址。所以，指针是一个*指向*内存某个位置的特殊变量。\n\
  \n***\n\n注意\n\n内存位置通常使用*十六进制*表示法。这是一种 16 进制系统，即包含 16 个不同的符号，从 0–9 后面跟着 A–F。在显示十六进制数时，习惯做法是在前面加上前缀\
  \ `0x`。因此，`0xA` 是十进制 10 的十六进制；`0xF` 是十进制 15 的十六进制；`0x10` 是十进制 16 的十六进制。更多信息请参阅附录\
  \ A，“处理数字：二进制与十六进制。](#app01.html_app01)”\n\n***\n\n#### 声明指针\n\n指针作为一个变量也需要声明。你通常声明一个指向特定值类型的指针（例如，`int`）。这意味着指针中所包含的地址指向内存中存储整数的位置。你也可以指定一个指向内存块的指针（也称为空指针）。\n\
  \n指针作为一个变量，需要像所有变量一样进行声明：\n\n点击此处查看代码图像\n\n```\nPointedType * PointerVariableName;\n\
  ```\n\n与大多数变量一样，除非初始化了指针，否则它将包含一个随机值。你不希望访问随机的内存地址，因此你将指针初始化为 `NULL`。`NULL` 是一个可以检查的值，而且它不是一个内存地址：\n\
  \n点击此处查看代码图像\n\n```cpp\nPointedType * PointerVariableName = NULL; // 初始化值\n```\n\
  \n因此，声明一个指向整数的指针将是：\n\n```cpp\nint *pointsToInt = NULL;\n```\n\n***\n\n警告\n\n指针和你学过的所有数据类型一样，除非经过初始化，否则它包含一个垃圾值。这种垃圾值在指针情况下是特别危险的，因为指针的值预期包含一个地址。未初始化的指针会导致你的程序访问无效的内存位置，从而导致崩溃。\n\
  \n***\n\n#### 使用引用运算符 (`&`) 确定变量地址\n\n变量是语言提供的工具，用于你处理内存中的数据。这一概念在第 3 节，“使用变量、声明常量。](#ch03.html_ch03)”中有详细解释。\n\
  \n如果 `varName` 是一个变量，`&varName` 就会给出其值存放的内存地址。\n\n所以，如果你声明了一个整数，使用你非常熟悉的语法，例如：\n\
  \n```cpp\nint age = 30;\n```\n\n`&age` 将是该值（`30`）存放的内存地址。列表 8.1 演示了整数变量内存地址的概念，该地址用于存储其所包含的值。\n\
  \n**列表 8.1** 确定 `int` 和 `double` 的地址\n\n点击此处查看代码图像\n\n***\n\n```\n0: #include <iostream>\n\
  1: using namespace std;\n2:\n3: int main()\n4: {\n5:     int age = 30;\n6:     const\
  \ double Pi = 3.1416;\n7:\n8:     // 使用 & 找到内存中的地址\n9:     cout << \"Integer age\
  \ is located at: 0x\" << &age << endl;\n10:     cout << \"Double Pi is located at:\
  \ 0x\" << &Pi << endl;\n11:\n12:     return 0;\n13: }\n```\n\n***\n\n输出 ![Image](img/arrow.jpg)\n\
  \n点击此处查看代码图像\n\n```\nInteger age is located at: 0x...\nDouble Pi is located at:\
  \ 0x...\n```\n（注意：实际地址会有所不同）\n\n***\n\n#### 使用指针存储地址\n\n你学习了如何声明指针以及如何确定变量的地址。现在是时候将这些联系起来并使用指针存储地址了。\n\
  \n假设有一个变量：\n\n```cpp\nint age = 30;\n```\n\n要在指针中存储该变量的地址，你可以这样声明指针：\n\n```cpp\n\
  int* pointsToInt = &age;\n```\n\n在列表 8.2 中你可以你可以如何使用指针来存储通过引用运算符获取的地址。\n\n**列表 8.2**\
  \ 演示指针的初始化\n\n```\n\n0: #include <iostream>\n1: using namespace std;\n2:\n3: int\
  \ main()\n4: {\n5:     int age = 30;\n6:     int* pointsToInt = &age; // 初始化指针为\
  \ &age\n7:\n8:     // 显示指针的值\n9:     cout << \"Integer age is at: 0x\" << hex <<\
  \ pointsToInt << endl;\n10:\n11:     return 0;\n12: }\n```\n\n***\n\n输出 ![Image](img/arrow.jpg)\n\
  \n点击此处查看代码图像\n\n```\nInteger age is at: 0x0045FE00\n```\n\n***\n\n分析\n\n基本上，这段代码段的输出与之前的列表\
  \ 8.1 相同，因为两个示例显示的都是相同的内容——整数 `age` 存储的内存地址。这里的区别在于地址首先在第 6 行被赋值给指针，然后在第 9 行使用 `cout`\
  \ 输出指针的值（现在是地址）。\n\n***\n\n注意\n\n你的输出地址上可能与你在这些示例中看到的地址不同。事实上，在同一台计算机上每次运行应用程序时，变量的地址可能会发生变化。\n\
  \n***\n\n\n\n\n现在你已经学会了如何在指针变量中存储地址，很容易想象到同一个指针变量可以被重新赋予不同的内存地址，并使它指向不同的值，如列表 8.3\
  \ 所示。\n\n### 列表 8.3 将指针重新赋值给另一个变量\n\n点击此处查看代码图像\n\n```cpp\n0: #include <iostream>\n\
  1: using namespace std;\n2:\n3: int main()\n4: {\n5:     int age = 30;\n6:\n7: \
  \    int* pointsToInt = &age;\n8:     cout << \"pointsToInt points to age now\"\
  \ << endl;\n9:\n10:     // 显示指针的值\n11:     cout << \"pointsToInt = 0x\" << hex <<\
  \ pointsToInt << endl;\n12:\n13:     int dogsAge = 9;\n14:     pointsToInt = &dogsAge;\n\
  15:     cout << \"pointsToInt points to dogsAge now\" << endl;\n16:\n17:     cout\
  \ << \"pointsToInt = 0x\" << hex << pointsToInt << endl;\n18:\n19:     return 0;\n\
  20: }\n```\n\n输出 ![Image](img/arrow.jpg)\n\n点击此处查看代码图像\n\npointsToInt points to\
  \ age now\npointsToInt = 0x002EFB34\npointsToInt points to dogsAge now\npointsToInt\
  \ = 0x002EFB1C\n\n### 分析 ![Image](img/arrow.jpg)\n\n该程序演示了一个指向整数的指针 `pointsToInt`\
  \ 可以指向任何整数。在第 7 行中，它被初始化为 `&age`，因此包含了变量 `age` 的地址。在第 14 行，同一个指针被赋值为 `&dogsAge`，指向了内存中包含\
  \ `dogsAge` 的另一个位置。相应地，输出表明指针的值（即所指向的地址）发生了变化，因为两个整数 `age` 和 `dogsAge` 分别存储在内存中不同的位置，分别为\
  \ `0x002EFB34` 和 `0x002EFB1C`。\n\n#### 使用解引用运算符 (`*`) 访问指向的数据\n\n你有一个指向数据的指针，该指针包含一个有效地址。你如何访问该位置——即获取或设置该位置的数据？答案在于使用解引用运算符（`*`）。本质上，如果你有一个有效指针\
  \ `pData`，使用 `*pData` 来访问存储在指针所含地址的值。运算符（`*`）在列表 8.4 中进行了演示。\n\n### 列表 8.4 演示使用解引用运算符\
  \ (`*`) 访问整数值\n\n点击此处查看代码图像\n\n```cpp\n0: #include <iostream>\n1: using namespace\
  \ std;\n2:\n3: int main()\n4: {\n5:     int age = 30;\n6:     int dogsAge = 9;\n\
  7:\n8:     cout << \"Integer age = \" << age << endl;\n9:     cout << \"Integer\
  \ dogsAge = \" << dogsAge << endl;\n10:\n11:     int* pointsToInt = &age;\n12: \
  \    cout << \"pointsToInt points to age\" << endl;\n13:\n14:     // 显示指针的值\n15:\
  \     cout << \"pointsToInt = 0x\" << hex << pointsToInt << endl;\n16:\n17:    \
  \ // 显示指向位置的值\n18:     cout << \"*pointsToInt = \" << dec << *pointsToInt << endl;\n\
  19:\n20:     pointsToInt = &dogsAge;\n21:     cout << \"pointsToInt points to dogsAge\
  \ now\" << endl;\n22:\n23:     cout << \"pointsToInt = 0x\" << hex << pointsToInt\
  \ << endl;\n24:     cout << \"*pointsToInt = \" << dec << *pointsToInt << endl;\n\
  25:\n26:     return 0;\n27: }\n```\n\n输出 ![Image](img/arrow.jpg)\n\n点击此处查看代码图像\n\
  \nInteger age = 30\nInteger dogsAge = 9\npointsToInt points to age\npointsToInt\
  \ = 0x002F788\n*pointsToInt = 30\npointsToInt points to dogsAge now\npointsToInt\
