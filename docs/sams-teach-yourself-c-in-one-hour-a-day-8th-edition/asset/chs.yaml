  \n列表 8.6 显示指针的 `sizeof` 为 4 字节的输出可能与你在系统上看到的不同。该输出是在使用 32 位编译器编译代码时生成的。如果你使用 64\
  \ 位编译器并在 64 位系统上运行该程序，你可能会发现你的指针变量的 `sizeof` 是 64 位——即 8 字节。\n\n* *\n\n### 动态内存分配\n\
  \n当你编写一个包含数组声明的程序时，例如：\n\n点击此处查看代码图像\n\n```cpp\nint myNums[100]; // 一个包含 100 个整数的静态数组\n\
  ```\n\n你的程序存在两个问题：\n\n1. 你实际上限制了程序的容量，因为它无法存储超过 100 个数字。\n2. 在只需要存储 1 个数字的情况下，你却预留了\
  \ 100 个的空间，这降低了系统的性能。\n\n这些问题的存在是因为按之前声明的数组中的内存分配是静态的，并由编译器固定的。\n\n为了编写一个能够根据用户需求优化消耗内存资源的应用程序，你需要使用动态内存分配。这允许你在需要更多内存时分配更多内存，并释放你多余的内存。C++\
  \ 提供了两个运算符 `new` 和 `delete` 来帮助你更好地管理应用程序的内存消耗。指针作为包含内存地址的变量，在高效的动态内存分配中起着至关重要的作用。\n\
  \n#### 使用运算符 `new` 和 `delete` 动态分配和释放内存\n\n你使用 `new` 来分配新的内存块。`new` 最常用的形式在成功时返回一个指向请求内存的指针，否则将抛出异常。使用\
  \ `new` 时，你需要指定为所分配内存指定的数据类型：\n\n点击此处查看代码图像\n\n```cpp\nType* Pointer = new Type;\
  \ // 为一个元素请求内存\n```\n\n你还可以指定你想要为该内存分配的元素数量（当你需要为多个一个元素分配内存时）：\n\n点击此处查看代码图像\n\n\
  ```cpp\nType* Pointer = new Type[numElements]; // 为 numElements 请求内存\n```\n\n因此，如果你需要分配整数，请使用以下语法：\n\
  \n点击此处查看代码图像\n\n```cpp\nint* pointToAnInt = new int;  // 获取指向整数的指针\nint* pointToNums\
  \ = new int[10];  // 指向包含 10 个整数的块的指针\n```\n\n* *\n\n### 注意事项\n\n注意，`new` 表示对内存的请求。不能保证分配调用总是成功，因为这取决于系统状态和内存资源的可用性。\n\
  \n* *\n\n每个使用 `new` 进行的分配最终都需要通过等效且相反的释放操作 `delete` 来释放：\n\n点击此处查看代码图像\n\n```cpp\n\
  Type* Pointer = new Type; // 分配内存\ndelete Pointer;  // 释放上面分配的内存\n```\n\n此规则也适用于你为多个元素请求内存时：\n\
  \n点击此处查看代码图像\n\n```cpp\nType* Pointer = new Type[numElements]; // 分配一个块\ndelete[]\
  \ Pointer; // 释放上面分配的块\n```\n\n* *\n\n### 注意事项\n\n注意在使用 `new[...]` 分配块时使用 `delete[]`，在使用\
  \ `new` 分配单个元素时使用 `delete`。\n\n* *\n\n如果你在停止使用分配的内存后不释放它，该内存将保持保留并分配给你的应用程序。这反过来减少了供应用程序消耗的系统内存，甚至可能让你的应用程序运行变慢。这被称为*泄漏*（leak），应该不惜一切地避免。\n\
  \n列表 8.7 展示了内存动态分配。\n\n**列表 8.7** 使用 `new` 访问内存并通过 `delete` 释放\n\n点击此处查看代码图像\n\n\
  * *\n\n```cpp\n0: #include <iostream>\n1: using namespace std;\n2:\n3: int main()\n\
  4: {\n5:     // 为整数请求空间\n6:     int* pointsToAge = new int;\n7:\n8:     // 使用分配的内存存储数字\n\
  9:     cout << \"Enter your age: \";\n10:    cin >> pointsToAge;\n11:\n12:    //\
  \ 使用间接运算符访问值\n13:    cout << \"Age \" << *pointsToAge << \" is stored at 0x\" <<\
  \ hex << endl;\n14:\n15:    // 退出前释放\n16:    delete pointsToAge;\n17:\n18:    return\
  \ 0;\n19: }\n```\n\n* *\n\n输出 ![Image](img/arrow.jpg)\n\n点击此处查看代码图像\n\n输入你的年龄：9\n\
  年龄 存储在 0x38\n\n分析 ![Image](img/arrow.jpg)\n\n第 6 行展示了使用 `new` 请求存储整数的空间。注意 `new`\
  \ 返回的是一个指针，它被赋值给了一个变量。\n\n* *\n\n### 注意\n\n`delete` 运算符不能在任何地址上调用，只能在 `new` 返回的地址上调用。\n\
  \n因此，列表 8.6 中看到的指针包含有效地址，但不应使用 `delete` 释放，因为它们不是通过调用 `new` 返回的。\n\n* *\n\n### 注意事项\n\
  \n注意当你使用 `new[...]` 分配元素范围时，使用 `delete` 进行释放，如列表 8.8 所示。\n\n**列表 8.8** 使用 `new[...]`\
  \ 分配并使用 `delete` 释放\n\n点击此处查看代码图像\n\n* *\n\n```cpp\n0: #include <iostream>\n1: #include\
  \ <string>\n2: using namespace std;\n3:\n4: int main()\n5: {\n6:     cout << \"\
  How many integers shall I reserve memory for?\" << endl;\n7:     int numEntries\
  \ = 0;\n8:     cin >> numEntries;\n9:\n10:    int* myNumbers = new int[numEntries];\n\
  11:\n12:    cout << \"Memory allocated at: 0x\" << myNumbers << hex << endl;\n13:\n\
  14:    // 退出前释放分配\n15:    delete[] myNumbers;\n16:\n17:    return 0;\n18: }\n```\n\
  \n* *\n\n输出 ![Image](img/arrow.jpg)\n\n点击此处查看代码图像\n\n我应该为多少个整数预留内存？\n\n5001\n内存分配在：0xc71578\n\
  \n\n\n\n\n问题中最重要的行是分别在第 10 行和第 15 行使用的 `new[]` 和 `delete[]` 运算符。此示例与列表 8.7 的不同之处在于动态分配了一块内存，其可以容纳用户请求的任意数量的整数。在执行期间，我们请求了\
  \ `5001` 个整数的空间。在另一次运行中，它可能是 `20` 或 `55000`。该程序将根据用户输入在每次执行时分配不同数量的内存。对于元素数组的此类分配，完成后需要使用\
  \ `delete[]` 进行释放以释放内存。\n\n### 注意\n\n`new` 和 `delete` 运算符从空闲存储（free store）分配内存。空闲存储是一种以内存池形式存在的内存抽象，应用程序可以从这里分配（即预留）内存，并向其释放（即回收）内存。\n\
  \n### 增增和减运算符（`++` 和 `--`）对指针的影响\n\n指针包含一个内存地址。例如，列表 8.3 中指向整数的指针包含 `0x002EFB34`——该整数所处的地址。整数本身长度为\
  \ 4 字节，因此占据了从 `0x002EFB34` 到 `0x002EFB37` 的四个内存位置。使用运算符（`++`）增加此指针*不会*导致指针指向 `0x002EFB35`，因为指向整数的中间在字面上是毫无意义的。\n\
  \n指针的递增或递减操作被编译器解释为：你需要指向内存块中的下一个值（假设其具有相同类型），而*不是*指向下一个字节（除非值类型的大小为 1 字节，例如 `char`）。\n\
  \n因此，增加列表 8.3 中所示的如 `pointsToInt` 指针会使其增加 `4` 字节，即一个 `int` 的 `sizeof`。在对此指针上使用 `++`\
  \ 是告诉编译器你希望它指向下一个连续的整数。因此，在增加后，指针将指向 `0x002EFB38`。同样，将此指针加上 `2` 将使其向前移动 `2` 个整数，即向前移动\
  \ `8` 字节。随后你会发现指针显示的这种行为与数组中使用的索引之间存在关联。\n\n使用运算符（`--`）递减指针展示了相同的效果——指针包含的地址值减少了它所指向的数据类型的\
  \ `sizeof`。\n\n### 当你增加或递减指针时会发生什么？\n\n指针中包含的地址根据所指向类型的 `sizeof` 进行增加或递减（而不一定是一个字节）。通过这种方式，编译器确保指针永远不会指向内存中数据的中间或结尾；它只指向开头。\n\
  \n如果指针被声明为：\n\n`Type* pType = Address;`\n\n`++pType` 意味着 `pType` 包含（并指向）`Address\
  \ + sizeof(Type)`。\n\n请参阅列表 8.9，该列表解释了增加指针或在其上添加偏移量的影响。\n\n**列表 8.9** 使用偏移量值和运算符增加及递减指针\n\
  \n点击此处查看代码图像\n\n```cpp\n0: #include <iostream>\n1: using namespace std;\n2:\n3:\
  \ int main()\n4: {\n5:     cout << \"How many integers you wish to enter? \";\n\
  6:     int numEntries = 0;\n7:     cin >> numEntries;\n8:\n9:     int* pointsToInts\
  \ = new int [numEntries];\n10:\n11:     cout << \"Allocated for \" << numEntries\
  \ << \" integers\" << endl;\n12:     for(int counter = 0; counter < numEntries;\
  \ ++counter)\n13:     {\n14:         cout << \"Enter number \"<< counter << \":\
  \ \";\n15:         cin >> *(pointsToInts + counter);\n16:     }\n17:\n18:     cout\
  \ << \"Displaying all numbers entered: \" << endl;\n19:     for(int counter = 0;\
  \ counter < numEntries; ++counter)\n20:         cout << *(pointsToInts++) << \"\
  \ \";\n21:\n22:     cout << endl;\n23:\n24:     // return pointer to initial position\n\
  25:     pointsToInts -= numEntries;\n26:\n27:     // done with using memory? release\n\
  28:     delete[] pointsToInts;\n29:\n30:     return 0;\n31: }\n```\n\n输出 ![Image](img/arrow.jpg)\n\
  \n点击此处查看代码图像\n\nHow many integers you wish to enter? 2\nAllocated for 2 integers\n\
  Enter number 0: 8774\nEnter number 1: -5\nDisplaying all numbers entered:\n8774\
  \ -5\n\n另一次运行：\n\n点击此处查看代码图像\nHow many integers you wish to enter? 2\nAllocated\
  \ for 2 integers\nEnter number 0: 8774\nEnter number 1: -5\nDisplaying all numbers\
  \ entered:\n8774 -5\n\n\n\n\n\n![Image](img/square.jpg) 指针中包含的地址和所指向的值都是常量，且无法更改（最严格的变体）：\n\
  \n点击此处查看代码图像\n\n```cpp\nint hoursInDay = 24;\n\nconst int* const pHoursInDay = &hoursInDay;\n\
  \n*pHoursInDay = 25; // 不 OK! 不能更改所指向的数据\n\nint daysInMonth = 30;\n\npHoursInDay\
  \ = &daysInMonth; // 不 OK! 不能更改地址\n```\n\n这些不同形式的 `const` 在将指针传递给函数时特别有用。函数参数需要声明为支持最高可能（限制性最大）的\
  \ `const` 级别，以确保函数在不应该修改时不会修改所指向的值。这可以防止应用程序的程序员对指针值或数据进行无谓的更改。\n\n### 将指针传递给函数\n\
  \n指针是向函数传递包含相关数据的内存空间的有效方式。共享的内存空间也可以返回操作的结果。在函数中使用指针时，确保被调用的函数只允许修改你想让它修改的参数，而不允许修改其他参数变得非常重要。例如，一个通过指针传递半径并计算圆面积的函数不应该允许修改半径。这就是你使用\
  \ `const` 关键字来控制函数允许和不允许修改内容的地方，如列表 8.10 所示。\n\n**列表 8.10** 在计算圆面积中使用 `const` 关键字\n\
  \n点击此处查看代码图像\n\n```cpp\n#include <iostream>\nusing namespace std;\n\nvoid CalcArea(const\
  \ double* const ptrPi, // 指向常量数据的常量指针\n              const double* const ptrRadius,\
  \ // 即：不允许任何更改\n              double* const ptrArea)  // 可以更改所指向的数据\n{\n    // 使用前检查指针的有效性！\n\
  \    if (ptrPi && ptrRadius && ptrArea)\n        *ptrArea = (*ptrPi) * (*ptrRadius);\n\
  }\n\nint main()\n{\n    const double Pi = 3.1416;\n\n    cout << \"Enter radius\
  \ of circle: \";\n    double radius = 0;\n    cin >> radius;\n\n    double area\
  \ = 0;\n    CalcArea (&Pi, &radius, &area);\n\n    cout << \"Area is = \" << area\
  \ << endl;\n\n    return 0;\n}\n```\n\n输出 ![Image](img/arrow.jpg)\n\n点击此处查看代码图像\n\
  \nEnter radius of circle: 10.5\nArea is = 34.6\n\n分析\n\n第 3–5 行展示了两种 `const` 形式，`ptrRadius`\
  \ 和 `ptrPi` 都作为“指向常量数据的指针”提供，因此指针地址或所指向的数据都无法修改。`ptrArea` 显然是用于存储输出的参数。第 8 行显示了在使用指针参数之前检查有效性。你不希望调用者意外发送\
  \ NULL 指针让函数计算面积，因为会导致访问冲突导致程序崩溃。\n\n### 数组与指针之间的相似之处\n\n你不认为列表 8.9 示例中通过增加指针索引来访问内存中下一个整数的方法，与声明数组的方式有许多相似之处吗？当你声明一个整数数组时：\n\
  \n```cpp\nint myNumbers[5];\n```\n\n你告诉编译器分配固定数量的内存存放五个整数，并通过数组变量名给你该数组第一个元素的指针。换句话说，`myNumbers`\
  \ 是指向 `myNumbers[0]` 的指针。列表 8.11 强调了这一点。\n\n**列表 8.11** 数组变量是指向第一个元素的指针\n\n点击此处查看代码图像\n\
  \n```cpp\n#include <iostream>\nusing namespace std;\n\nint main()\n{\n    // 5 个整数的静态数组\n\
  \    int myNumbers[5];\n\n    // 赋值指针\n    int* pointToNums = myNumbers;\n\n   \
  \ // 显示指针的内容\n    cout << \"pointToNums = 0x\" << hex << pointToNums << endl;\n\n\
  \    // 数组第一个元素的地址\n    cout << \"&myNumbers[0] = 0x\" << hex << &myNumbers[0] <<\
  \ endl;\n\n    return 0;\n}\n```\n\n输出 ![Image](img/arrow.jpg)\n\n点击此处查看代码图像\n\n\
  pointToNums = 0x004FEC\n&myNumbers[0] = 0x004FEC\n\n分析 ![Image](img/arrow.jpg)\n\
  \n这个简单的程序证明数组变量可以赋值给相同类型的指针（如第 9 行所示），这确认了数组类似于指针。第 12 和 15 行显示指针存储的地址与数组中第一个元素（索引\
  \ 0）所在的地址相同。该程序证明数组是其第一个元素的指针。\n\n如果你需要通过表达式 `myNumbers[1]` 访问第二个元素，你也可以使用指针 `pointToNums`\
  \ 通过语法 `*(pointToNums + 1)` 访问相同的内容。静态数组通过 `myNumbers[2]` 访问第三个元素，而动态数组则通过语法 `*(pointToNums\
  \ + 2)` 访问第三个元素。\n\n由于数组变量本质上是指针，应该可以使用你在指针上使用的解引用运算符（`*`）来处理数组。同样，可以使用列表 8.12 所示的数组运算符（`[]`）来处理指针。\n\
  \n**列表 8.12** 使用解引用运算符（`*`）访问数组元素以及配合指针使用数组运算符（`[]`）\n\n点击此处查看代码图像\n\n```cpp\n#include\
  \ <iostream>\nusing namespace std;\n\nint main()\n{\n    const int ARRAY_LEN = 5;\n\
  \n    // 化的 5 个整数静态数组\n    int myNumbers[ARRAY_LEN] = {24, -1, 365, -999, 2011};\n\
  \n    // 初始化为数组第一个元素的指针\n    int* pointToNums = myNumbers;\n\n    // 使用指针语法运算符*\
  \ 显示数组\n    cout << \"Display array using pointer syntax, operator*\" << endl;\n\
  \    for (int index = 0; index < ARRAY_LEN; ++index)\n        cout << \"Element\
  \ \" << index << \" = \" << *(myNumbers + index) << endl;\n\n    // 使用指针数组语法运算符[]\
  \ 显示数组\n    cout << \"Display array using ptr with array syntax, operator[]\" <<\
  \ endl;\n    for (int index = 0; index < ARRAY_LEN; ++index)\n        cout << \"\
  Element \" << index << \" = \" << pointToNums[index] << endl;\n\n    return 0;\n\
  }\n```\n\n输出 ![Image](img/arrow.jpg)\n\n点击此处查看代码图像\n\nDisplay array using pointer\
  \ syntax, operator*\nElement 0 = 24\nElement 1 = -1\nElement 2 = 365\nElement 3\
  \ = -999\nElement 4 = 2011\n\nDisplay array using ptr with array syntax, operator[]\n\
  Element 0 = 24\nElement 1 = -1\nElement 2 = 365\nElement 3 = -999\nElement 4 = 2011\n\
  \n\n\n\n因此，该程序演示了数组 `myNumbers` 和指针 `pointToNums` 实际上都表现出指针行为。换句话说，数组声明类似于一个指针，该指针将在固定内存范围内进行操作。请注意，你可以像第\
  \ 11 行那样将数组赋值给指针，但不能将指针赋值给数组。这是因为从本质上讲，像 `myNumbers` 数组是静态的，不能作为左值（l-value）。`myNumbers`\
  \ 不能被修改。\n\n***\n\n### 注意事项\n\n记住，使用 `new` 运算符动态分配的指针仍然需要使用 `delete` 运算符释放，即使你使用了通常用于静态数组的语法来访问数据。\n\
  \n如果你忘记了这一点，你的应用程序就会内存泄漏，这是糟糕的。\n\n***\n\n### 使用指针时的常见编程错误\n\nC++ 允许你动态分配内存，以便优化和控制应用程序的内存消耗。与\
  \ C# 和 Java 等基于运行时环境的较新语言不同，C++ 并不具备自动垃圾回收器来清理程序分配但无法使用的内存。这种通过指针管理内存资源的令人惊叹的控制力，也伴随着许多犯错的机会。\n\
  \n#### 内存泄漏\n\n这可能是 C++ 应用程序中最常见的问题之一：运行时间越长，消耗的内存越多，系统运行得越慢。这通常发生在程序员没有确保应用程序在内存块不再需要后，通过匹配的\
  \ `delete` 调用来释放使用 `new` 动态分配的内存时。\n\n确保所有分配的内存都由你的应用程序释放是你的（——程序员）的责任。这种情况永远不应该发生：\n\
  \n点击此处查看代码图片\n\n```cpp\nint* pointToNums = new int[5]; // 初始分配\n\n// 使用 pointToNums\n\
  \n...\n\n// 忘记使用 delete[] pointToNums 释放\n\n...\n\n// 再次分配并覆盖\n\npointToNums = new\
  \ int[10]; // 导致了之前分配的内存\n```\n\n#### 当指针未指向有效的内存位置时\n\n当你使用运算符（`*`）解引用指针以访问所指向的值时，你需要确保指针包含一个有效的内存位置，否则你的程序将崩溃或运行异常。这在逻辑上似乎难以理解，但无效指针是应用程序崩溃的非常常见的原因。指针可能由于多种原因而无效，主要是由于糟糕的编程和内存管理导致。指针可能无效的典型案例如\
  \ 列表 8.13 所示。\n\n**列表 8.13** 使用指针存储布尔值的程序中糟糕的指针卫生\n\n点击此处查看代码图片\n\n***\n\n```cpp\n\
  0: #include <iostream>\n1: using namespace std;\n2:\n3: int main()\n4: {\n5:   \
  \  // 未初始化的指针（糟糕）\n6:     bool* isSunny;\n7:\n8:     cout << \"Is it sunny (y/n)?\
  \ \";\n9:     char userInput = 'y';\n10:     cin >> userInput;\n11:\n12:     if\
  \ (userInput == 'y')\n13:     {\n14:         isSunny = new bool;\n15:         *isSunny\
  \ = true;\n16:     }\n17:\n18:     // 如果用户输入 'n'，isSunny 包含无效值\n19:     cout <<\
  \ \"Boolean flag sunny says: \" << *isSunny << endl;\n20:\n21:     // 即使 new 没有调用也调用了\
  \ delete\n22:     delete isSunny;\n23:\n24:     return 0;\n25: }\n```\n\n***\n\n\
  输出 ![Image](img/arrow.jpg)\n\n点击此处查看代码图片\n\nIs it sunny (y/n)? y\n\nBoolean flag\
  \ sunny says: 1\n\n第二次运行：\n\nIs it sunny (y/n)? n\n\n<崩溃！>\n\n分析 ![Image](img/arrow.jpg)\n\
  \n程序中存在许多问题，其中一些已经在代码中注释过。注意第 14 行是如何分配内存并赋值给指针的，该行在用户按下‘y’表示是时条件执行的。对于用户的其他所有输入，此\
  \ `if` 块都不会执行，指针 `isSunny` 保持无效状态。因此，当用户在第二次运行中按下‘n’时，应用程序崩溃了，因为 `isSunny` 包含一个无效的内存地址，且在第\
  \ 19 行解引用无效指针会导致问题。\n\n同样，在第 22 行所示，对这个未通过 `new` 分配的指针调用 `delete` 同样是错误的。请注意，如果你有一个指针的副本，你只需要对其中一个副本调用\
  \ `delete`（你还需要避免让指针的副本在各处漂浮）。\n\n该程序的更佳（更安全、更稳定）的版本应该是：指针被初始化，仅在值有效的地方使用，并且仅在有效时释放一次。\n\
  \n#### 悬空指针（也称为野指针或无效指针）\n\n注意，任何有效指针在通过 `delete` 释放后都是无效的。换句话说，即使是 列表 8.13 中有效的指针\
  \ `isSunny` 在第 22 行调用 `delete` 后也会失效，并且之后不应再使用。\n\n为了避免这个问题，一些程序员遵循在初始化或删除后将指针赋值为\
  \ `NULL`。他们总是检查指针的有效性（通过与 `NULL` 比较）。\n\n学习了使用指针的问题后，是时候修正 列表 8.13 中的代码了，如 列表 8.14\
  \ 所示。\n\n**列表 8.14** 安全的指针编程，对 8.13 的修正\n\n***\n\n```cpp\n0: #include <iostream>\n\
  1: using namespace std;\n2:\n3: int main()\n4: {\n5:     // 定义并初始化指针\n6:     bool*\
  \ const isSunny = new bool;\n7:     *isSunny = true;\n8:\n9:     cout << \"Is it\
  \ sunny (y/n)? \";\n10:    char userInput = 'y';\n11:    cin >> userInput;\n12:\n\
  13:    if (userInput == 'n')\n14:        *isSunny = false;\n15:\n16:    cout <<\
  \ \"Boolean flag sunny says: \" << *isSunny << endl;\n17:\n18:    // 释放有效内存\n19:\
  \    delete isSunny;\n20:\n21:    return 0;\n22: }\n```\n\n***\n\n输出 ![Image](img/arrow.jpg)\n\
  \n点击此处查看代码图片\n\nIs it sunny (y/n)? y\n\nBoolean flag sunny says: 1\n\n下次运行：\n\n\
  点击此处查看代码图片\n\nIs it sunny (y/n)? n\n\nBoolean flag sunny says: 0\n\n（无论用户输入什么，都不会崩溃。）\n\
  \n#### 检查 `new` 分配请求是否成功\n\n\n\n\n在我们到目前为止的代码中，我们假设 `new` 会返回一个指向内存块的有效指针。事实上，`new`\
  \ 通常会成功，除非应用程序请求了异常大量的内存，或者系统处于某种关键状态，导致没有空闲内存。某些应用程序需要请求大块内存（例如，数据库应用程序）。此外，不简单地假设内存分配请求总是成功的是好的。C++\
  \ 为你提供了两种可能的方法，以在你在使用指针之前确保它是有效的。默认方法——我们迄今为止使用的方法——使用 `exceptions`（异常），其中分配失败会导致\
  \ `thrown`（抛出）一个类型为 `std::bad_alloc` 的异常。异常会导致应用程序的执行被中断，除非你编写了 `exception handler`（异常处理程序），否则你的程序将以错误消息“unhandled\
  \ exception”（未处理的异常）并不优雅的方式结束。\n\n异常在第 28 节“异常处理.ch28.html_ch28)”中进行了详细解释。列表 8.15\
  \ 让你预先了解如何使用异常处理来检查内存分配请求的失败。如果异常处理在这个阶段看起来很难以从心，不要太担心——在这里提到它只是为了内存分配主题的完整性。你可能可以在学习完第\
  \ 28 节后再次查看此示例。\n\n**列表 8.15** 处理异常，当 `new` 失败时优雅地退出\n\n点击此处查看代码图像\n\n```cpp\n#include\
  \ <iostream>\nusing namespace std;\n\n// 移除 try-catch 块以查看此应用程序崩溃\nint main()\n\
  {\n    try\n    {\n        // 请求大量的内存！\n        int* pointsToManyNums = new int\
  \ [0x1fffffff];\n        // 使用分配的内存\n\n        delete[] pointsToManyNums;\n    }\n\
  \    catch (bad_alloc)\n    {\n        cout << \"Memory allocation failed. Ending\
  \ program\" << endl;\n    }\n    return 0;\n}\n```\n输出 ![Image](img/arrow.jpg)\n\
  \n点击此处查看代码图像\n\nMemory allocation failed. Ending program\n\n分析 ![Image](img/arrow.jpg)\n\
  \n此程序在你的计算机上执行情况可能有所不同。我的环境无法成功为 536870911 个整数分配请求的空间！如果没有编写异常处理程序（你在第 14–17 行看到的\
  \ `catch` 块），程序将非常丢脸地结束。你可以通过注释掉第 6、7 和 13–17 行来实验在没有异常处理程序的情况下程序的行为。在使用 Microsoft\
  \ Visual Studio 构建的调试模式二进制文件时，程序执行结果如图 8.2\n\n**图 8.2** 列表 8.15 中缺少异常处理时的程序崩溃（使用\
  \ MSVC 编译器的调试版本）。\n\n异常处理的 `try-catch` 结构因此帮助应用程序在告知用户内存分配问题阻碍了正常执行后进行受控退出。\n\n\
  对于那些不想依赖异常的人，有一种 `new` 的变体称为 `new(nothrow)`。这种变体在分配失败时不会抛出异常，而是导致运算符 `new` 返回 `NULL`。因此，在使用赋值的指针之前，可以与\
  \ `NULL` 检查其有效性。查看列表 8.16。\n\n**列表 8.16** 使用 `new(nothrow)` 在分配失败时返回 `NULL`\n\n\
  点击此处查看代码图像\n\n```cpp\n#include <iostream>\nusing namespace std;\n\nint main()\n\
  {\n    // 请求大量的内存空间，使用 nothrow\n    int* pointsToManyNums = new(nothrow) int [0x1fffffff];\n\
  \n    if (pointsToManyNums) // 检查 pointsToManyNums != NULL\n    {\n        // 使用分配的内存\n\
  \        delete[] pointsToManyNums;\n    }\n    else\n    {\n        cout << \"\
  Memory allocation failed. Ending program\" << endl;\n    }\n    return 0;\n}\n```\n\
  输出 ![Image](img/arrow.jpg)\n\n点击此处查看代码图像\n\nMemory allocation failed. Ending program\n\
  \n分析 ![Image](img/arrow.jpg)\n\n列表 8.16 与列表 8.15 是同一个函数，区别在于它使用了 `new(nothrow)`。由于这种\
  \ `new` 变体在内存失败时返回 `NULL`，因此我们在第 8 行所示在使用之前检查指针。`new` 的两种变体都是好的，选择由你决定。\n\n### 指针最佳实践\n\
  \n在应用程序中使用指针时，有一些基本规则可以让你与之共处变得更容易。\n\n#### 应该\n**应该** 始终初始化指针变量，否则它们将包含垃圾值。\n**应该**\
  \ 确保在使用指针之前它是有效的，否则程序可能会崩溃。\n**应该** 记住释放已分配的内存，否则程序会导致内存泄漏。\n\n### 不要\n**不要** 在释放指针后访问它。\n\
  **不要** 多次调用 `delete`。\n**不要** 忘记释放已分配的内存，否则会导致内存泄漏。\n\n### 什么是引用？\n\n引用是变量的别名。当你声明引用时，你需要初始化它。因此，引用只是访问被引用变量的另一种方式。\n\
  \n你会通过以下语句使用引用运算符 (`&`) 来声明引用：\n\n```cpp\nVarType original = Value;\nVarType& ReferenceVariable\
  \ = original;\n```\n\n要进一步了解如何声明和使用引用，请查看列表 8.17。\n\n**列表 8.17** 证明引用是赋值值的别名\n\n\
  点击此处查看代码图像\n\n```cpp\n#include <iostream>\nusing namespace std;\n\nint main()\n\
  {\n    int original = 30;\n    cout << \"original = \" << original << endl;\n  \
  \  cout << \"original is at address: \" << hex << &original << endl;\n\n    int&\
  \ ref1 = original;\n    cout << \"ref1 is at address: \" << hex << &ref1 << endl;\n\
  \n    int& ref2 = ref1;\n    cout << \"ref2 is at address: \" << hex << &ref2 <<\
  \ endl;\n    cout << \"Therefore, ref2 = \" << dec << ref2 << endl;\n\n    return\
  \ 0;\n}\n```\n输出 ![Image](img/arrow.jpg)\n\n点击此处查看代码图像\n\noriginal = 30\noriginal\
  \ is at address: 0099F764\nref1 is at address: 0099F764\nref2 is at address: 0099F764\n\
  Therefore, ref2 = 30\n\n分析 ![Image](img/arrow.jpg)\n\n输出证明了引用无论是初始化为原始变量（如第 9 行所示）还是初始化为引用（如第\
  \ 12 行所示），都指向原始变量所在的内存位置。因此，引用是真正的别名——也就是说，`original` 的另一个名称。在第 14 行使用 `ref2` 显示的值与第\
  \ 6 行的 `original` 的值相同，因为 `ref2` 别名了 `original` 并且位于相同的内存位置。\n\n#### 为什么让引用有用？\n\
  \n\n\n\n引用允许你操作它们初始化时所处的内存位置。这使得引用在编写函数时特别有用。正如你在第 7 节中所学习的，“用函数组织代码](#ch07.html_ch07)”，一个典型的函数声明如下：\n\
  \n点击此处查看代码图像\n\n```\nReturnType DoSomething(Type parameter);\n```\n\n函数 `DoSomething()`\
  \ 的调用方式如下：\n\n点击此处查看代码图像\n\n```\nReturnType Result = DoSomething(argument); // function\
  \ call\n```\n\n前面的代码将导致 `argument` 被复制到 `Parameter`，然后由函数 `DoSomething()` 使用。如果涉及的\
  \ `argument` 消耗大量内存，这个复制步骤可能会产生相当的开销。同样，当 `DoSomething()` 返回一个值时，它会被再次复制到 `Result`\
  \ 中。如果我们能够避免或消除复制步骤，让函数直接操作调用者栈中的数据，那将是理想的。引用允许你做到这一点。\n\n一个没有复制步骤的函数版本如下：\n\n点击此处查看代码图像\n\
  \n```cpp\nReturnType DoSomething(Type& parameter); // 注意引用&\n```\n\n该函数的调用方式如下：\n\
  \n点击此处查看代码图像\n\n```cpp\nReturnType Result = DoSomething(argument);\n```\n\n由于参数是通过引用传递的，`Parameter`\
  \ 并不是 `argument` 的副本，而是后者的别名，就像列表 8.17 中的 `Ref` 一样。此外，接受引用作为参数的函数可以选择性使用引用参数返回值。请参列表\
  \ 8.18 以理解函数如何使用引用代替返回值。\n\n**列表 8.18** 通过引用参数返回平方值的函数\n\n点击此处查看代码图像\n\n***\n\n\
  ```cpp\n0: #include <iostream>\n1: using namespace std;\n2:\n3: void GetSquare(int&\
  \ number)\n4: {\n5:     number *= number;\n6: }\n7:\n8: int main()\n9: {\n10:  \
  \   cout << \"Enter a number you wish to square: \";\n11:     int number = 0;\n\
  12:     cin >> number;\n13:\n14:     GetSquare(number);\n15:     cout << \"Square\
  \ is: \" << number << endl;\n16:\n17:     return 0;\n18: }\n```\n\n***\n\n输出 ![Image](img/arrow.jpg)\n\
  \n点击此处查看代码图像\n\nEnter a number you wish to square: 5\nSquare is: 25\n\n分析 ![Image](img/arrow.jpg)\n\
  \n执行平方操作的函数位于第 3–6 行。注意它是将待平方的数字作为引用参数接收并在同一处返回结果的。如果你忘记将参数 `number` 标记为引用（`&`），结果将无法到达调用函数\
  \ `main()`，因为 `GetSquare()` 将会对 `number` 的本地副本执行操作，而该副本会在函数退出时被销毁。使用引用，你可以确保 `GetSquare()`\
  \ 在 `main()` 中定义 `number` 的相同地址空间内运行。因此，即使在函数 `GetSquare()` 后，操作结果在 `main()` 中可用。\n\
  \n在这个示例中，包含用户发送数字的输入参数被修改了。如果你两个值（原始值和平方值），可以让函数接受两个参数：一个包含输入，另一个提供平方值。\n\n### 在引用上使用\
  \ `const` 关键字\n\n你可能需要某些不允许更改所别名原始变量值的引用。在声明此类引用时使用 `const` 是实现该目标的方法：\n\n点击此处查看代码图像\n\
  \n```cpp\nint original = 30;\nconst int& constRef = original;\nconstRef = 40; //\
  \ Not allowed: constRef can’t change value in original\nint& ref2 = constRef; //\
  \ Not allowed: ref2 is not const\nconst int& constRef2 = constRef; // OK\n```\n\n\
  ### 通过引用传递参数给函数\n\n引用的主要优势之一是它们允许被调用函数操作未从调用函数复制的参数，从而显著提高性能。然而，由于被调用函数直接在调用函数的栈上参数上工作，因此确保被调用函数无法更改调用者端变量的值通常是重要的。\n\
  \n\n\n\n点击此处查看代码图像\n\n```cpp\nint* pointToAnInt = new int;\n\nint* pCopy = pointToAnInt;\n\
  ```\n\n**我难道不是对这两个者都调用 `delete` 来确保内存被释放会更好吗？**\n\n**A** 那将是错误的。你只允许对由 `new` 返回的地址调用一次\
  \ `delete`。此外，在理想情况下，你应该避免让两个指针指向同一个地址，因为对其中任何一个执行 `delete` 都会导致另一个失效。你的程序编写方式也不应该让你对对用用指针的有效性产生任何不确定性。\n\
  \n**Q 我应该在什么时候使用 `new(nothrow)`？**\n\n**A** 如果你不想处理异常 `std::bad_alloc`，你可以使用操作符\
  \ `new` 的 `nothrow` 版本，如果请求的分配失败，它将返回 `NULL`。\n\n**Q 我可以使用以下两种方法调用函数来计算面积：**\n\n\
  点击此处查看代码图像\n\n```cpp\nvoid CalculateArea (const double* const ptrRadius, double*\
  \ const ptrArea);\n\nvoid CalculateArea (const double& radius, double& area);\n\
  ```\n\n**我应该倾向于哪种体？**\n\n**A** 使用后者（使用引用），因为引用不会失效，而指针可以失效。此外，这种方式也更简单。\n\n**Q 我有一个指针：**\n\
  \n点击此处查看代码图像\n\n```cpp\nint number = 30;\n\nconst int* pointToAnInt = &number;\n\
  ```\n\n**我理解由于 `const` 声明，我无法通过指针 `pointToAnInt` 修改 `number` 的值。我可以将 `pointToAnInt`\
  \ 赋值给一个非 `const` 指针，然后用它来操作整数 `number` 中包含的值吗？**\n\n**A** 不，你不能改变指针的 `const` 属性：\n\
  \n点击此处查看代码图像\n\n```cpp\nint* pAnother = pointToAnInt; // 不能将 const 指针赋值给非 const\
  \ 指针\n```\n\n**Q 为什么我应该费心通过引用向函数传递值？**\n\n**A** 只要它不会显著影响你的程序性能，你就不需要这样做。然而，如果你的函数参数接收的是非常重的对象（字节数），那么按值传递将是非常昂贵的操作。使用引用会让你的函数调用效率高得多。记住要大量地使用\
  \ `const`，除非函数需要将结果存储在变量中。\n\n**Q 这两个声明 之间有什么区别：**\n\n点击此处查看代码图像\n\n```cpp\nint\
  \ myNumbers[100];\n\nint* myArrays[100];\n```\n\n**A** `myNumbers` 是一个整数数组——也就是说，`myNumbers`\
  \ 是一个指向存储 100 个整数的内存位置的指针，指向索引为 0 的第一个。它是以下代码的静态替代方案：\n\n点击此处查看代码图像\n\n```cpp\n\
  int* myNumbers = new int [100]; // 动态分配的数组\n\n// 使用 myNumbers\n\ndelete[] myNumbers;\n\
  ```\n\n另一方面，`myArrays` 是一个包含 100 个指针的数组，每个指针都可以指向一个整数或一个整数数组。\n\n### 工作坊\n\n工作坊提供了测验题来帮助你巩固对所涵盖内容的理解，并提供了练习让你获得使用所学知识的经验。在检查\
  \ 附录 E 中的答案之前，尝试回答测验和练习题，并在继续下一节之前确保你理解了答案。\n\n#### 测验\n\n**1.** 为什么你不能将 `const`\
  \ 引用赋值给非 `const` 引用？\n\n**2.** `new` 和 `delete` 是函数吗？\n\n**3.** 指针变量中包含的值的本质是什么？\n\
  \n**4.** 你应该使用哪个操作符来访问指针指向的数据？\n\n#### 练习题\n\n**1.** 执行这些语句时显示的内容是什么：\n\n点击此处查看代码图像\n\
  \n```cpp\n0: int number = 3;\n1: int* pNum1 = &number;\n2: *pNum1 = 20;\n3: int*\
  \ pNum2 = pNum1;\n4: number *= 2;\n5: cout << *pNum2;\n```\n\n**2.** 这三个重载函数之间的相似点和不同点是什么：\n\
  \n点击此处查看代码图像\n\n```cpp\nint DoSomething(int num1, int num2);\n\nint DoSomething(int&\
  \ num1, int& num2);\n\nint DoSomething(int* pNum1, int* pNum2);\n```\n\n**3.** 你将如何修改练习\
  \ 1 中第 1 行的 `pNum1` 声明，以便第 3 行的赋值无效？（*提示：这与确保 `pNum1` 无法更改指向的数据有关。）\n\n**4.** **找错：**\
  \ 这段代码哪里错了？\n\n点击此处查看代码图像\n\n```cpp\n#include <iostream>\n\nusing namespace std;\n\
  \nint main()\n{\n    int *pointToAnInt = new int;\n    pointToAnInt = 9;\n}\n```\n\
  \n**5.** **找错：** 这段代码哪里错了？\n\n点击此处查看代码图像\n\n```cpp\n#include <iostream>\n\nusing\
  \ namespace std;\n\nint main()\n{\n    int *pointToAnInt = new int;\n    int* pCopy\
  \ = pointToAnInt;\n    pointToAnInt = 30;\n    cout << \"The value at pointToAnInt:\
  \ \" << *pointToAnInt;\n}\n```\n\n**6.** 修正上述程序后，输出是什么？\n\n# 第二部分：面向对象编程基础\n\n##\
  \ 第 9 节：类与对象\n\n到目前为止，你探索了从 `main()` 开始、包含局部和全局变量、并具有带有参数和返回执行逻辑的简单程序。我们的编程风格一直是*过程化的*，我们还没有观察到面向对象的方法。也就是说，你现在需要学习\
  \ C++ 面向对象编程的基础。\n\n在本节中，你将学习\n\n- 什么是类和对象\n- 类如何帮助你将数据与构造函数和析构函数整合在一起\n- 什么是移动构造函数\n\
  - 面向对象的封装和抽象概念\n- `this` 指针是什么\n- `struct` 是什么以及它与 `class` 的区别\n\n### 类和对象的概念\n\n\
  想象你正在编写一个模拟人类的程序，就像你自己一样。这个人类需要一个身份：姓名、出生日期、出生地和性别——这些信息使他独特。此外，人类还可以执行某些功能，如说话和介绍自己等。因此，人类也可以像图\
  \ 9.1](#ch09.html_ch09fig01）所示进行建模。\n\n![Image](img/09fig01.jpg)\n\n**图 9.1** 人类的抽象表示。\n\
  \n要在程序中模拟人类，你现在需要一种构造，让你能够将定义人类的属性（数据）和人类可以执行的活动（函数）整合在一起。这种构造就是*类*。\n\n#### 类的声明\n\
  \n你使用 `class` 关键字跟随类名，然后是一个用大括号 `{...}` 包的语句块，其中包含成员属性和成员函数，最后以分号 `‘;’ 结束。\n\n类的声明告诉编译器关于该类的信息。类的声明本身对程序的执行没有影响，因为类需要像调用函数一样被使用。\n\
  \n模拟人类的类看起来如下（暂时忽略语法上的缺陷）：\n\n\n\n\n\n点击此处查看代码图像\n\n```cpp\nclass Human\n{\n   //\
  \ 成员属性：\n   string name;\n   string dateOfBirth;\n   string placeOfBirth;\n   string\
  \ gender;\n   // 成员函数：\n   void Talk(string textToTalk);\n   void IntroduceSelf();\n\
  \   ...\n};\n```\n\n不言说，`IntroduceSelf()` 使用了 `Talk()` 以及在 `class Human` 中定义的某些数据属性。因此，在\
  \ `class` 关键字中，C++ 为你提供了一种创建自定义数据类型的强大方式，允许你 `encapsulate`（封装）属性以及使用这些属性的功能。在这种情况下，类的所有属性（例如\
  \ `name`、`dateOfBirth`、`placeOfBirth` 和 `gender`）以及在其中声明的所有函数（即 `Talk()` 和 `IntroduceSelf()`）被称为类\
  \ `Human` 的成员。\n\n封装（Encapsulation）是指逻辑上分组数据和使用这些数据的功能，它是面向对象编程的一个重要特性。\n\n***\n\
  \n**注意**\n\n你经常会遇到 *method*（方法）这个词——它们本质上是作为 `class` 成员的函数。\n\n***\n\n### 作为类实例的对象\n\
  \n类就像一张蓝图，单独声明一个类对程序的执行没有影响。在程序执行时，类在现实世界的化身是 *object*（对象）。要使用类的特性，你通常会创建该类的实例，称为对象。你使用该对象来访问其成员方法和属性。\n\
  \n创建一个 `class Human` 类型的对象与创建另一个类型（例如 `double`）的实例相似：\n\n点击此处查看代码图像\n\n```cpp\n\
  double pi= 3.1415;  // 一个 double 类型的变量\nHuman  firstMan;  // firstMan: 一个 Human\
  \ 类的对象\n```\n\n或者，你可以使用 `new` 动态创建一个 `class Human` 的实例，就像处理另一种类型（例如 `int`）一样：\n\n\
  点击此处查看代码图像\n\n```cpp\nint* pointsToNum = new int;  // 动态分配的整数\ndelete pointsToNum;\
  \  // 使用完毕释放内存\nHuman* firstWoman = new Human(); // 动态分配的 Human\ndelete firstWoman;\
  \  // 释放内存\n```\n\n### 使用点运算符 (`.`) 访问成员\n\n人类的一个例子可以是 Adam，男性，1970 年出生于阿拉巴马州。实例\
  \ `firstMan` 是 `class Human` 的一个对象，是该类在现实中（即运行时）存在的化身：\n\n点击此处查看代码图像\n\n```cpp\n\
  Human  firstMan;  // 一个 Human 的实例即对象\n```\n\n正如类声明所示，`firstMan` 拥有如 `dateOfBirth`\
  \ 等属性，可以使用点运算符 (`.`) 进行访问：\n\n点击此处查看代码图像\n\n```cpp\nfirstMan.dateOfBirth = \"1970\"\
  ;\n```\n\n这是因为属性 `dateOfBirth` 属于类 `Human`，正如类声明中所示，它是其蓝图的一部分。该属性只有在对象被实例化后才在现实中（即运行时）存在。点运算符\
  \ (`.`) 帮助你访问对象的属性。\n\n对于 `IntroduceSelf()` 等方法也是如此：\n\n点击此处查看代码图像\n\n```cpp\nfirstMan.IntroduceSelf();\n\
  ```\n\n如果你有一个指向 `class Human` 实例的指针 `firstWoman`，你可以使用指针运算符 (`->`) 来访问成员（如下一节所述），或者使用间接运算符\
  \ (`*`) 在点运算符后引用对象。\n\n点击此处查看代码图像\n\n```cpp\nHuman* firstWoman = new Human();\n\
  (*firstWoman).IntroduceSelf();\n```\n\n***\n\n**注意**\n\n命名规范同样适用。类名和成员函数使用帕斯卡命名法（Pascal\
  \ case）声明，例如 `IntroduceSelf()`。类成员属性使用驼峰命名法（camel case），例如 `dateOfBirth`。\n\n当我们实例化一个类的对象时，我们声明一个类型为该类的变量。因此，我们使用驼峰命名法（这也是我们一直以来用于变量名的方法），例如\
  \ `firstMan`。\n\n***\n\n### 使用指针运算符 (`->`) 访问成员\n\n如果对象已使用 `new` 在自由存储区上实例化，或者你有一个指向对象的指针，那么你可以使用指针运算符\
  \ (`->`) 来访问成员属性和函数：\n\n点击此处查看代码图像\n\n```cpp\nHuman* firstWoman = new Human();\n\
  firstWoman->dateOfBirth = \"1970\";\nfirstWoman->IntroduceSelf();\ndelete firstWoman;\n\
  ```\n\nListing 9.1 展示了一个带有新关键字 `public` 的可编译形式的 `class Human`。\n\n**列表 9.1 可编译的\
  \ `Human`**\n点击此处查看代码图像\n\n***\n\n```cpp\n#include <iostream>\n#include <string>\n\
  using namespace std;\n\nclass Human\n{\npublic:\n    string name;\n    int age;\n\
  \n    void IntroduceSelf()\n    {\n        cout << \"I am \" << name << \" and \"\
  \ << age << \" years old\" << endl;\n    }\n};\n\nint main()\n{\n    Human firstMan;\n\
  \    firstMan.name = \"Adam\";\n    firstMan.age = 30;\n\n    Human firstWoman;\n\
  \    firstWoman.name = \"Eve\";\n    firstWoman.age = 28;\n\n    firstMan.IntroduceSelf();\n\
  \    firstWoman.IntroduceSelf();\n}\n```\n\n***\n\n**输出**\nI am Adam and 30 years\
  \ old\nI am Eve and 28 years old\n\n```\n\n\n\n\n假设有一个名为 `eve` 的 `Human` 类实例：\n\n\
  ```cpp\nHuman eve;\n```\n\n当该实例的用户尝试访问成员 `age` 时：\n\n点击此处查看代码图片\n\n```cpp\ncout\
  \ << eve.age; // 编译错误\n```\n\n此时该用户将得到一个编译错误，信息类似于“错误：`Human::age`——无法访问在类 `Human`\
  \ 中声明的私有成员。” 了解 `age` 的唯一允许方法是通过 `class Human` 提供的公共方法 `GetAge()` 来请求，而该方法的实现方式由类的程序员决定，认为这是暴露\
  \ `age` 的合适方式：\n\n点击此处查看代码图片\n\n```cpp\ncout << eve.GetAge(); // 正确\n```\n\n如果 `Human`\
  \ 类的程序员有此意，他可以使用 `GetAge()` 让 Eve 看起来比实际年龄更年轻！换句话说，这意味着 C++ 允许类控制它想要暴露的属性以及暴露这些相同属性的方式。如果\
  \ `class Human` 没有实现 `GetAge()` 公共成员方法，那么该类实际上确保了用户完全无法查询 `age`。这一特性在在本节稍后解释的情况下可能会非常有用。\n\
  \n同样，`Human::age` 也无法被直接赋值：\n\n点击此处查看代码图片\n\n```cpp\neve.age = 22; // 编译错误\n```\n\
  \n设置年龄的唯一允许方法是通过方法 `SetAge()`：\n\n```cpp\neve.SetAge(22); // 正确\n```\n\n这有许多优势。`SetAge()`\
  \ 的当前实现只是直接设置成员变量 `Human::age`。然而，你可以使用 `SetAge()` 来验证设置的 `age` 是否非零且非负，从而对外部输入验证：\n\
  \n点击此处查看代码图片\n\n```cpp\nclass Human\n{\nprivate:\n   int age;\npublic:\n   void\
  \ SetAge(int humansAge)\n   {\n      if (humansAge > 0)\n         age = humansAge;\n\
  \   }\n};\n```\n\n因此，C++ 使类的设计者能够控制类数据属性如何被访问和操作。\n\n#### 通过关键字 `private` 实现的数据抽象\n\
  \nC++ 在允许你将类设计成一个封装数据和操作这些数据的方法的容器的同时，通过 `private` 关键字赋予你权限决定哪些信息对外部世界是不可访问的（即在类外部不可用）。同时，你也可以通过声明为\
  \ `public` 的方法对即使声明为 `private` 的信息进行受控访问。因此，你对类的实现可以抽象出外部类和函数不需要访问的成员信息。\n\n回到关于\
  \ `Human::age` 是私有成员的示例，你知道即使在现实中，许多人也不喜欢透露真实年龄。如果要求 `class Human` 出一个比当前年龄小两岁的，它可以轻松地通过公共函数\
  \ `GetAge()` 实现，该函数使用 `Human::age` 参数，将其减二，并提供结果，如列表 9.2 所示。\n\n**列表 9.2** 类 `Human`\
  \ 的模型，其中真实的 `age` 对用户抽象化，并报告一个较年轻的 `age`\n\n点击此处查看代码图片\n\n```cpp\n0: #include <iostream>\n\
  1: using namespace std;\n2:\n3: class Human\n4: {\n5: private:\n6:     // 私有成员数据:\n\
  7:     int age;\n8:\n9: public:\n10:     void SetAge(int inputAge)\n11:     {\n\
  12:         age = inputAge;\n13:     }\n14:\n15:     // Human 对其年龄撒了谎（如果超过 30 岁）\n\
  16:     int GetAge()\n17:     {\n18:         if (age > 30)\n19:             return\
  \ (age - 2);\n20:         else\n21:             return age;\n22:     }\n23: };\n\
  24:\n25: int main()\n26: {\n27:     Human firstMan;\n28:     firstMan.SetAge(35);\n\
  29:\n30:     Human firstWoman;\n31:     firstWoman.SetAge(22);\n32:\n33:     cout\
  \ << \"Age of firstMan \" << firstMan.GetAge() << endl;\n34:     cout << \"Age of\
  \ firstWoman \" << firstWoman.GetAge() << endl;\n35:     return 0;\n36: }\n```\n\
  \n输出 ![Image](img/arrow.jpg)\n点击此处查看代码图片\nAge of firstMan 33\nAge of firstWoman\
  \ 22\n\n分析 ![Image](img/arrow.jpg)\n注意第 16 行的公共方法 `Human::GetAge()`。由于私有成员 `Human::age`\
  \ 中包含的实际年龄无法直接访问，该类的外部用户查询 `class Human` 对象的 `age` 属性的唯一途径就是通过 `GetAge()` 方法。因此，存储在\
  \ `Human::age` 中的实际年龄对外部世界是抽象的。诚然地，我们的 `Human` 对其年龄撒了谎，如第 18-21 行所示，`GetAge()` 对所有大于\
  \ 30 岁的人都返回一个减少后的值！抽象是面向对象语言中的一个重要概念。它赋予程序员权限决定类的哪些属性需要保持仅供类及其外部成员（除声明为“朋友”的除外）访问。\n\
  \n### 构造函数\n\n`构造函数`是一个特殊的函数（或方法），在类的实例化期间被调用以构造一个对象。和普通函数一样，构造函数也可以被重载。\n\n####\
  \ 声明和实现构造函数\n\n构造函数是一个取类名且没有返回值的特殊函数。因此，`class Human` 将有一个如下声明的构造函数：\n\n```cpp\n\
  class Human\n{\npublic:\n   Human(); // 构造函数的声明\n};\n```\n\n该构造函数可以在类内内联实现，也可以在类声明外部实现。类内部实现（也称为定义）如下：\n\
  \n```cpp\nclass Human\n{\npublic:\n   Human()\n   {\n      // 构造实现\n   }\n};\n```\n\
  \n在类外定义构造函数的变体如下：\n\n```cpp\nclass Human\n{\npublic:\n   Human(); // 声明\n};\n//\
  \ 构造函数实现\nHuman::Human()\n{\n   // 构造实现\n}\n```\n\n注意 `::` 被称为作用域解析运算符。例如，`Human::dateOfBirth`\
  \ 指的是类 `Human` 内部的 `dateOfBirth`。另一方面，`::dateOfBirth` 指的是全局作用域中的变量 `dateOfBirth`。\n\
  \n#### 何时以及如何使用构造函数\n\n构造函数在对象创建时总是总是被调用的。这使得构造函数成为你初始化整数、指针等类成员的理想场所。再次查看列表 9.2。如果你忘记调用\
  \ `SetAge()`，整数变量 `Human::age` 可能包含未知值，因为该变量未初始化（通过注释掉第 28 和 31 行尝试）。列表 9.3 使用构造函数实现了一个更好的\
  \ `class Human` 版本，其中变量 `age` 已经初始化。\n\n\n\n\n\n```cpp\n34: int main()\n35: {\n\
  36:     Human firstWoman;\n37:     firstWoman.SetName(\"Eve\");\n38:     firstWoman.SetAge\
  \ (28);\n39:\n40:     firstWoman.IntroduceSelf();\n41: }\n```\n\n输出 ![Image](img/arrow.jpg)\n\
  \n点击此处查看代码图像\n\n已创建 Human 类的实例\n\n我是 Eve，今年 28 岁\n\n分析 ![Image](img/arrow.jpg)\n\
  \n在输出中，你看到一个新行，表示对象的构造。现在，请查看第 34–41 行定义的 `main()` 函数。你会发现输出的第一行是第 36 行创建（构造）对象\
  \ `firstWoman` 的结果。第 11–15 行中的构造函数 `Human::Human()` 包含了产生此输出的 `cout` 语句。注意构造函数是如何将整数\
  \ `age` 初始化为零的。如果你忘记在 ways 构造的对象上调用 `SetAge()`，你可以放心，构造函数已经确保变量 `age` 中包含的值不是随机整数（那可能看起来是有效的），而是零。\n\
  \n### 注意\n\n不带参数调用的构造函数称为默认构造函数。编写默认构造函数是可选的。\n\n如果你没有编写任何构造函数，如列表 9.1 所示，编译器会为你创建一个（该构造函数会构造成员属性，但不会将\
  \ `int` 等简单旧数据类型初始化为任何特定的非零值）。\n\n### 构造函数重载\n\n构造函数可以像函数一样进行重载。因此，我们可以编写一个在实例化\
  \ `Human` 时需要以 `name` 作为参数的构造函数，例如：\n\n点击此处查看代码图像\n\n```cpp\nclass Human\n{\npublic:\n\
  \   Human()\n   {\n        // 此处为默认构造函数的代码\n   }\n   Human(string humansName)\n\
  \   {\n        // 此处为重载构造函数的代码\n   }\n};\n```\n\n重载构造函数的应用通过列表 9.4 所示，即在构造时提供名称来创建\
  \ `Human` 类的对象。\n\n**列表 9.4** 具有多个构造函数的 `Human` 类\n\n点击此处查看代码图像\n\n```cpp\n0: #include\
  \ <iostream>\n1: #include <string>\n2: using namespace std;\n3:\n4: class Human\n\
  5: {\n6: private:\n7:     string name;\n8:     int age;\n9:\n10: public:\n11:  \
