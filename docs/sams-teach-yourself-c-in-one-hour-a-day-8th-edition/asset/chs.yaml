  \ 9} 的首次出现。\n\n### 将容器中的元素初始化为特定值\n\n`fill()` 和 `fill_n()` 是 STL 算法，用于帮助将给定范围的内容设置为指定值。`fill()`\
  \ 根据给定的范围边界和要插入的值来重写范围内的元素：\n\n点击此处查看代码图片\n\n```cpp\nvector <int> numsInVec (3);\n\
  // 将容器中的所有元素填充为值 9\nfill (numsInVec.begin (), numsInVec.end (), 9);\n```\n\n正如名称所示，`fill_n()`\
  \ 重置指定的 n 个值。它需要一个起始位置、一个计数和填充的值：\n\n点击此处查看代码图片\n\n```cpp\nfill_n (numsInVec.begin\
  \ () + 3, /*count*/ 3, /*fill value*/ -9);\n```\n\n列表 23.4 演示了这些算法如何让 `vector<int>`\
  \ 中的元素初始化变得简单。\n\n**列表 23.4** 使用 `fill()` 和 `fill_n()` 设置容器中的初始值\n\n点击此处查看代码图片\n\
  \n```cpp\n0: #include <algorithm>\n1: #include <vector>\n2: #include <iostream>\n\
  3:\n4: int main ()\n5: {\n6:     using namespace std;\n7:\n8:     // 初始化带有 3 个元素的示例\
  \ vector\n9:     vector <int> numsInVec (3);\n10:\n11:     // 将容器中的所有元素填充为值 9\n\
  12:     fill (numsInVec.begin (), numsInVec.end (), 9);\n13:\n14:     // 增加 vector\
  \ 的大小以容纳 6 个元素\n15:     numsInVec.resize (6);\n16:\n17:     // 从偏移量 3 开始填充 3 个元素为值\
  \ -9\n18:     fill_n (numsInVec.begin () + 3, 3, -9);\n19:\n20:     cout << \"Contents\
  \ of the vector are: \" << endl;\n21:     for (size_t index = 0; index < numsInVec.size\
  \ (); ++ index)\n22:     {\n23:         cout << \"Element [\" << index << \"] =\
  \ \";\n24:         cout << numsInVec [index] << endl;\n25:     }\n26:\n27:     return\
  \ 0;\n28: }\n```\n\nOutput ![Image](img/arrow.jpg)\n\n点击此处查看代码图片\nvector 的内容为：\n\
  Element [0] = 9\nElement [1] = 9\nElement [2] = 9\nElement [3] = -9\nElement [4]\
  \ = -9\n\n分析 ![Image](img/arrow.jpg)\n\n列表 23.4](#ch23.html_ch23list04) 使用 `fill()`\
  \ 和 `fill_n()` 设置容器中的初始值。如第 12 行所示，`fill()` 和 `fill_n()` 函数将容器的内容设置为特定值。注意第 15 行的\
  \ `resize()` 函数让 vector 容纳 6 个元素。第 18 行使用 `fill_n()` 从偏移量 3 开始填充 3 个元素为值 -9。`fill()`\
  \ 作用于完整范围，而 `fill_n()` 作用于部分范围。\n\n提示\n\n你可能注意到列表 23.1](#ch23.html_ch23list01)、23.2](#ch23.html_ch23list02)\
  \ 和 23.3](#ch23.html_ch23list03) 使用常量迭代器；这是因为 `fill()` 的目的是修改容器的内容，而这不能通过常量迭代器实现。\n\
  \n使用 `generate()` 在运行时生成元素值\n\n正如 `fill()` 和 `fill_n()` 使用一个特定值，STL 算法如 `generate()`\
  \ 和 `generate_n()` 使用由一元函数返回的值。你可以使用 `generate()` 来填充范围：\n\n点击此处查看代码图片\n\n```cpp\n\
  generate (numsInVec.begin (), numsInVec.end (), // range\n          rand);  // generator\
  \ function\n```\n\n`generate_n()` 与 `generate()` 的区别在于你提供的是要赋值的数量而不是范围的边界：\n\n点击此处查看代码图片\n\
  \n```cpp\ngenerate_n(numsList.begin (), 5, rand);\n```\n\n因此，你可以使用这两个算法将容器的内容初始化为文件或随机值，如列表\
  \ 23.5](#ch23.html_ch23list05) 所示。\n\n**列表 23.5** `generate()` 和 `generate_n()`\
  \ 初始化集合为随机值\n\n点击此处查看代码图片\n\n```cpp\n0: #include <algorithm>\n1: #include <vector>\n\
  2: #include <iostream>\n3: #include <ctime>\n4: #include <list>\n5:\n6: int main\
  \ ()\n7: {\n8:     using namespace std;\n9:     srand(time(NULL)); // 设置随机生成器种子\n\
  10:\n11:     vector <int> numsInVec (5);\n12:     generate (numsInVec.begin (),\
  \ numsInVec.end (), // 范围\n13:           rand()); // 生成器函数\n14:\n15:     cout <<\
  \ \"Contents of the vector are: \" << endl;\n16:     for (size_t index = 0; index\
  \ < numsInVec.size (); ++ index)\n17:         cout << numsInVec [index] << \" \"\
  ;\n18:     cout << endl;\n19:\n20:     list <int> numsInList (5);\n21:     generate_n\
  \ (numsInList.begin (), 3, rand);\n22:\n23:     cout << \"Elements in the list are:\
  \ \";\n24:     for (auto element = numsInList.begin();\n25:           element !=\
  \ numsInList.end();\n26:           ++ element )\n27:         cout << *element <<\
  \ ' ';\n28:\n29:\n30:     return 0;\n31: }\n```\n\n\n\n\n\n如第 9 行所示，使用当前时间作为种子初始化随机数生成器意味着输出在每次运行应用程序时都可能不同。列表\
  \ 23.5 使用了第 12 行的 `generate()` 来填充 `vector` 中的所有元素，并使用第 21 行的 `generate_n()` 为 `list`\
  \ 的前三个元素填充了由生成器函数 `rand()` 提供的随机值。请注意，`generate()` 函数接受一个范围作为输入，并因此对范围内的每个元素调用指定的函数对象\
  \ `rand()`。相比之下，`generate_n()` 仅接受起始位置。它会根据 `count` 参数指定的次数调用指定的函数对象 `rand()`，以覆盖相应数量元素的内容。容器中超出指定偏移量的元素将保持不变。\n\
  \n### 使用 `for_each()` 处理范围内的元素\n\n  \n\n`for_each()` 算法将指定的一元函数对象应用于所给范围内的每个元素。`for_each()`\
  \ 的用法如下：\n\n点击此处查看代码图像\n\n```cpp\nfnObjType retValue = for_each (start_of_range,\n\
  \                               end_of_range,\n                               unaryFunctionObject);\n\
  ```\n\n该一元函数对象也可以是一个接受一个参数的 lambda 表达式。\n\n返回值表示 `for_each()` 返回了用于处理所给范围内每个元素的函数对象（也称为仿函数）。该规范的隐含含义是，使用\
  \ `struct` 或 `class` 作为函数对象有助于存储状态信息，你可以在 `for_each()` 完成后对对其进行查询。这在列表 23.6 中得到了演示，该列表使用函数对象显示范围内的元素，并使用它来统计已显示元素的数量。\n\
  \n**列表 23.6** 使用 `for_each()` 显示序列内容\n\n点击此处查看代码图像\n\n```cpp\n0: #include <algorithm>\n\
  1: #include <iostream>\n2: #include <vector>\n3: #include <string>\n4: using namespace\
  \ std;\n5:\n6: template <typename elementType>\n7: struct DisplayElementKeepcount\n\
  8: {\n9:     int count;\n10:     DisplayElementKeepcount (): count (0) {}\n11:\n\
  12:     void operator () (const elementType& element)\n13:     {\n14:         ++\
  \ count;\n15:         cout << element << ' ';\n16:     }\n17: };\n18:\n19: int main\
  \ ()\n20: {\n21:     vector <int> numsInVec{ 2017, 0, -1, 42, 10101, 25 };\n22:\n\
  23:     cout << \"Elements in vector are: \" << endl;\n24:     DisplayElementKeepcount<int>\
  \ functor =\n25:         for_each (numsInVec.cbegin(),   // Start of range\n26:\
  \                     numsInVec.cend (),     // End of range\n27:              \
  \       DisplayElementKeepcount<int> ());// functor\n28:     cout << endl;\n29:\n\
  30:     // Use the state stored in the return value of for_each!\n31:     cout <<\
  \ \"'\" << functor.count << \"' elements displayed\" << endl;\n32:\n33:     string\
  \ str (\"for_each and strings!\");\n34:     cout << \"Sample string: \" << str <<\
  \ endl;\n35:\n36:     cout << \"Characters displayed using lambda:\" << endl;\n\
  37:     int numChars = 0;\n38:     for_each (str.cbegin(),\n39:                \
  \ str.cend(),\n40:                 &numChars { cout << c << ' '; ++numChars; } );\n\
  41:     cout << endl;\n42:     cout << \"'\" << numChars << \"' displayed\" << endl;\n\
  43:\n44:     return 0;\n45: }\n```\n\n![Output](img/arrow.jpg)\n点击此处查看代码图像\nElements\
  \ in vector are: 2017 0 -1 42 10101 25\n'6' elements displayed\nSample string: for_each\
  \ and strings!\nCharacters displayed using lambda: for_each and strings!\n'21' characters\
  \ displayed\n\n![Analysis](img/arrow.jpg)\n\n代码示例演示了第 25 行和第 38 行调用的 `for_each()`\
  \ 的用处，`for_each()` 返回的函数对象 `functor` 被设计为将其调用次数存储在 `count` 中。代码包含两个示例范围，一个包含在整数向量\
  \ `numsInVec` 中，另一个是 `std::string` 对象 `str`。第一次调用 `for_each()` 使用 `DisplayElementKeepCount`\
  \ 作为一元谓词，第二次使用 lambda 表达式。`for_each()` 为所给范围内的每个元素调用 `operator()`，这反过来又会将元素打印在屏幕上并增加内部计数器。当\
  \ `for_each()` 完成后返回函数对象，成员 `count` 告知了调用次数。在 `for_each()` 返回值中存储的状态在 `for_each()`\
  \ 完成后是可查询的。第 38 行的 `for_each()` 与第 25 行的作用相同，只是使用了 lambda 表达式而不是函数对象。### 使用 `transform()`\
  \ 处理范围\n\n`for_each()` 和 `transform()` 的相似之处在于它们都对源范围内的每个元素调用函数对象。然而，`transform()`\
  \ 有两个版本。第一个版本接受一元函数，常用于使用 `toupper()` 或 `tolower()` 将字符串转换为大写或小写：点击此处查看代码图像\n\n\
  ```cpp\nstring str (\"THIS is TEst string!\");\ntransform (str.cbegin(), // start\
  \ range\n           str.cend(), // end source range\n           strLowerCase.begin(),\
  \ // start range\n           ::tolower); // unary function\n```\n\n第二个版本接受二元函数，允许\
  \ `transform()` 处理来自两个不同范围的：点击此处查看代码图像\n\n```cpp\n// elements from two vectors\n\
  transform (numsInVec1.cbegin(), // start of source range 1\n           numsInVec1.cend(),\
  \   // end of source range 1\n           numsInVec2.cbegin(),  // start of source\
  \ range 2\n           sumInDeque.begin(), // store result in a deque\n         \
  \  plus<int>()); // binary function plus\n```\n\n两个版本的 `transform()` 总是将指定转换的结果赋值给提供的目标范围，而\
  \ `for_each()` 作用于单一范围。`transform()` 的用法在列表 23.7 中演示。\n\n**列表 23.7** 使用一元和二元函数使用\
  \ `transform()`\n\n点击此处查看代码图像\n\n```cpp\n0: #include <algorithm>\n1: #include <string>\n\
  2: #include <vector>\n3: #include <iostream>\n4: #include <functional>\n5:\n6: int\
  \ main()\n7: {\n8:     using namespace std;\n9:\n10:    string str (\"THIS is a\
  \ TEst string!\");\n11:    cout << \"The string is: \" << str << endl;\n12:    string\
  \ strLowerCaseCopy;\n13:    strLowerCaseCopy.resize(str.size());\n14:\n15:    transform\
  \ (str.cbegin(), // start range\n16:               str.cend(), // end source range\n\
  17:               strLowerCaseCopy.begin(), // start range\n18:               ::tolower);\
  \ // unary function\n19:\n20:    cout << \"Result of 'transform' on the string with\
  \ 'tolower':\" << endl;\n21:    cout << \"\\\"\" << strLowerCaseCopy << \"\\\"\"\
  \ << endl << endl;\n22:\n23:    // Two sample vectors of integers...\n24:    vector<int>\
  \ numsInVec1{ 2017, 0, -1, 42, 10101, 25 };\n25:    vector<int> numsInVec2 (numsInVec1.size(),\
  \ -1);\n26:\n27:    // A destination range for holding the result of addition\n\
  28:    deque <int> sumInDeque (numsInVec1.size());\n29:\n30:    transform (numsInVec1.cbegin(),\
  \ // start of source range 1\n31:               numsInVec1.cend(),   // end of source\
  \ range 1\n32:               numsInVec2.cbegin(),  // start of source range 2\n\
  33:               sumInDeque.begin(), // store result in a deque\n34:          \
  \     plus<int>()); // binary function plus\n35: }\n```\n\n\n\n\n```cpp\nsumInDeque.begin(),\
  \   // 目标范围的起始\nplus<int>());              // 二元函数\n\ncout << \"Result of 'transform'\
  \ using binary function 'plus': \" << endl;\ncout << \"Index   Vector1 + Vector2\
  \ = Result (in Deque)\" << endl;\nfor (size_t index = 0; index < numsInVec1.size();\
  \ ++ index)\n{\n    cout << index << \"    \\t \" << numsInVec1 [index]   << \"\\\
  t+   \";\n    cout << numsInVec2 [index]  << \" \\t  =   \";\n    cout << sumInDeque\
  \ [index] << endl;\n}\n\nreturn 0;\n}\n```\n\n* * *\n\n输出 ![Image](img/arrow.jpg)\n\
  \n点击此处查看代码图片\n\n示例字符串为：THIS is a TEst string!\n\n对字符串使用 'tolower' 执行 'transform'\
  \ 的结果：\n\n\"this is a test string!\"\n\n使用二元函数 'plus' 执行 'transform' 的结果：\n\nIndex\
  \   Vector1 + Vector2 = Result (in Deque)\n\n0       2017   +   -1    =   2016\n\
  1       0      +   -1    =   -1\n2      -1     +   -1    =   -2\n3       42    \
  \ +   -1    =   41\n4       10101  +   -1    =   10100\n5       25     +   -1  \
  \  =   24\n\n分析 ![Image](img/arrow.jpg)\n\n该示例演示了 `std::transform()` 的两种版本：一种使用一元函数\
  \ `tolower()` 作用于单个范围，如第 20 行所示；另一种是作用于两个范围并使用二元函数 `plus()`，如第 36 行所示。第一种方法逐字符地将字符串的大小转换为小写。如果你使用\
  \ `toupper()` 代替 `tolower()`，则会实现大写转换。另一个 `std::transform()` 版本（见第 32–36 行）作用于从两个输入范围（在本例中为两个\
  \ vector）提取的元素，并使用 STL 函数 `plus()`（由头文件 `<functional>` 提供）形式的二元谓对其进行相加。`std::transform()`\
  \ 每次处理一对元素，将其提供给二元函数 `plus`，并将结果赋予目标范围中的元素——该元素恰好属于一个 `std::deque`。\n\n请注意，用于存储结果的容器更改纯粹是为了演示。它仅展示了迭代器如何很好地将容器及其实现与\
  \ STL 算法抽象分离；`transform()` 作为一种算法，处理的是范围，实际上不需要知道实现这些范围的容器细节。因此，输入范围恰好在 `vector`\
  \ 中，输出范围恰好在 `deque` 中，只要定义范围的边界（作为 `transform` 的输入参数提供）是有效的，一切就都能正常工作。\n\n### 复制与删除操作\n\
  \nSTL 提供了三个重要的复制函数：`copy()`、`copy_if()` 和 `copy_backward()`。`copy()` 可以按正向方向将源范围的内容赋值到目标范围：点击此处查看代码图片\n\
  \n```cpp\nauto lastElement = copy (numsInList.cbegin(), // 起范围\n               \
  \         numsInList.cend(), // 结束范围\n                        numsInVec.begin());\
  \ // 目标范围起始\n```\n\n`copy_if()` 是从 C++1 开始标准库中新增的，当你提供的一元谓词返回 `true` 时会复制元素：点击此处查看代码图片\n\
  \n```cpp\ncopy_if (numsInList.cbegin(), numsInList.cend(),\n         lastElement,\
  \ // 目标范围中的复制位置\n         [](int element){return ((element % 2) == 1);});\n```\n\
  \n`copy_backward()` 按反向方向将内容赋值到目标范围：点击此处查看代码图片\n\n```cpp\ncopy_backward (numsInList.cbegin(),\n\
  \               numsInList.cend(),\n               numsInVec.end()));\n```\n\n另一方面，`remove()`\
  \ 会删除容器中匹配指定值的元素：点击此处查看代码图片\n\n```cpp\nauto newEnd = remove (numsInVec.begin(),\
  \ numsInVec.end(), 0);\nnumsInVec.erase (newEnd, numsInVec.end()));\n```\n\n`remove_if()`\
  \ 使用一元谓词并从容器中移除所有谓词评估为 `true` 的元素：点击此处查看代码图片\n\n```cpp\nnewEnd = remove_if (numsInVec.begin(),\
  \ numsInVec.end(),\n                    [](int num) {return ((num % 2) == 1);} //\
  \ 谓词\nnumsInVec.erase (newEnd, numsInVec.end())); // 调整大小\n```\n\n列表 23.8 演示了复制和删除函数的用法。\n\
  \n**列表 23.8** 一个演示如何使用 `copy()`、`copy_if()`、`remove()` 和 `remove_if()` 将 `list`\
  \ 复制到 `vector` 并删除 0 和偶数的示例。\n\n点击此处查看代码图片\n\n```cpp\n#include <algorithm>\n#include\
  \ <vector>\n#include <list>\n#include <iostream>\nusing namespace std;\n\ntemplate\
  \ <typename T>\nvoid DisplayContents(const T& container)\n{\n    for (auto element\
  \ = container.cbegin();\n         element != container.cend();\n         ++ element)\n\
  \        cout << *element << ' ';\n\n    cout << \"| 元素数量: \" << container.size()\
  \ << endl;\n}\n\nint main()\n{\n    list <int> numsInList{ 2017, 0, -1, 42, 10101,\
  \ 25 };\n\n    cout << \"Source (list) contains:\" << endl;\n    DisplayContents(numsInList);\n\
  \n    // 初始化容纳 list 两倍元素的 vector\n    vector <int> numsInVec (numsInList.size()\
  \ * 2);\n\n    auto lastElement = copy (numsInList.cbegin(), // 起范围\n          \
  \                  numsInList.cend(), // 结束范围\n                            numsInVec.begin());\
  \ // 目标范围起始\n\n    copy_if (numsInList.cbegin(), numsInList.cend(),\n          \
  \   lastElement, // 目标范围中的复制位置\n             [](int element){return ((element %\
  \ 2) == 1);});\n\n    copy_backward (numsInList.cbegin(),\n                  numsInList.cend(),\n\
  \                  numsInVec.end()));\n\n    auto newEnd = remove (numsInVec.begin(),\
  \ numsInVec.end(), 0);\n    numsInVec.erase (newEnd, numsInVec.end()));\n\n    newEnd\
  \ = remove_if (numsInVec.begin(), numsInVec.end(),\n                        [](int\
  \ num) {return ((num % 2) == 1);} // 谓词\n    numsInVec.erase (newEnd, numsInVec.end()));\
  \ // 调整大小\n\n    cout << \"Destination (vector) after copy and copy_if:\" << endl;\n\
  \    DisplayContents(numsInVec);\n\n    cout << \"Destination (vector) after remove,\
  \ remove_if, erase:\" << endl;\n    DisplayContents(numsInVec);\n\n    return 0;\n\
  }\n```\n\n\n\n\nListing 23.8 展示了 `remove()` 和 `remove_if()` 都会返回一个指向容器新末尾的迭代器。然而，容器\
  \ `numsInVec` 尚未被调整大小。元素已被 `remove` 算法删除，且其他元素已向前移动，但 `size()` 保持不变，这意味着 vector\
  \ 的末尾仍然存在某些值。要调整容器的大小（这非常重要，否则末尾会有不想要的值），你需要在随后的 `erase()` 调用中使用中由 `remove()` 或\
  \ `remove_if()` 返回的迭代器，如第 41 行和第 46 行所示。\n\n***\n\n### 替换值和根据条件替换元素\n\n`replace()`\
  \ 和 `replace_if()` 是 STL 算法，它们可以分别替换集合中与给定值等效或满足给定条件的元素。`replace()` 根据比较操作符（`==`）的返回值替换元素：\n\
  \n点击此处查看代码图片\n\n```\ncout << \"Using 'std::replace' to replace value 5 by 8\" <<\
  \ endl;\nreplace (numsInVec.begin (), numsInVec.end (), 5, 8);\n```\n\n`replace_if()`\
  \ 期望一个用户指定的的一元谓词，该谓词对于每个需要替换的值返回 `true`：\n\n点击此处查看代码图片\n\n```\ncout << \"Using 'std::replace_if'\
  \ to replace even values by -1\" << endl;\nreplace_if (numsInVec.begin (), numsInVec.end\
  \ (),\n    [](int element) {return ((element % 2) == 0); }, -1);\n```\n\n这些函数的用法在\
  \ Listing 23.9 中所示。\n\n**列表 23.9** 使用 `replace()` 和 `replace_if()` 在指定范围内替换值\n\n\
  点击此处查看代码图片\n\n***\n\n```cpp\n0: #include <iostream>\n1: #include <algorithm>\n2:\
  \ #include <vector>\n3: using namespace std;\n4:\n5: template <typename T>\n6: void\
  \ DisplayContents(const T& container)\n7: {\n8:     for (auto element = container.cbegin();\n\
  9:             element != container.cend();\n10:             ++ element)\n11:  \
  \       cout << *element << ' ';\n12:\n13:     cout << \"| Number of elements: \"\
