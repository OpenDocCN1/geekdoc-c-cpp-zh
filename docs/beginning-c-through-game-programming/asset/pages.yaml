  md: "new value for again from the user in the loop body. Then I test again in the\
    \ loop expression. If again is equal to 'y', the loop repeats; otherwise, the\
    \ loop ends.\n\n# IRW\n\nEven though you can use while and do loops pretty interchangeably,\
    \ most programmers use the while loop. Although a do loop might seem more natural\
    \ in some cases, the advantage of a while loop is that its expression appears\
    \ right at the top of the loop; you don't have to go hunting to the bottom of\
    \ the loop to find it.\n\n# Trap\n\nIf you've ever had a game get stuck in the\
    \ same endless cycle, you might have experienced an infinite loop—a loop without\
    \ end. Here's a simple example of an infinite loop:\n\n```\nint test = 10;\nwhile\
    \ (test == 10)\n{\n    cout << test;\n}\n```\n\nIn this case, the loop is entered\
    \ because test is 10. But because test never changes, the loop will never stop.\
    \ As a result, the user will have to kill the running program to end it. The moral\
    \ of this story? Make sure that the expression of a loop can eventually become\
    \ false or that there's another way for the loop to end, such as described in\
    \ the following section, \"Using break and continue statements.\"\n\n# USING BREAK\
    \ AND CONTINUE STATEMENTS\n\nIt's possible to alter the behavior you've seen in\
    \ loops. You can immediately exit a loop with the break statement, and you can\
    \ jump directly to the top of a loop with a continue statement. Although you should\
    \ use these powers sparingly, they do come in handy sometimes.\n\n# Introducing\
    \ the Finicky Counter Program\n\nThe Finicky Counter program counts from 1 to\
    \ 10 through a while loop. It's finicky because it doesn't like the number 5—it\
    \ skips it. Figure 2.8 shows a run of the program.\n\nYou can download the code\
    \ for this program from the Course Technology website (www.courseptr.com/downloads).\
