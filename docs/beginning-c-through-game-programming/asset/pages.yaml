  md: "version, it's as if I've extended the definition of what it means for a boss\
    \ to attack. What I'm essentially saying is that when a boss attacks, the boss\
    \ does exactly what an enemy does and then laughs. When I call the member function\
    \ for a Boss object in main() with the following line, Boss' Attack() member function\
    \ is called because I've overloaded Attack().\n\n```\naBoss.Attack();\n```\n\n\
    The first thing that Boss' Attack() member function does is explicitly call Enemy's\
    \ Attack() member function, which displays the message Attack! Inflicts 30 damage\
    \ points. Then, Boss' Attack() member function displays the message And laughs\
    \ heartily at you.\n\n# Trick\n\nYou can extend the way a member function of a\
    \ base class works in a derived class by overriding the base class method and\
    \ then explicitly calling the base class member function from this new definition\
    \ in the derived class and adding some functionality.\n\n# USING OVERLOADED ASSIGNMENT\
    \ OPERATORS AND COPY CONSTRUCTORS IN DERIVED CLASSES\n\nYou already know how to\
    \ write an overloaded assignment operator and a copy constructor for a class.\
    \ However, writing them for a derived class requires a little bit more work because\
    \ they aren't inherited from a base class.\n\nWhen you overload the assignment\
    \ operator in a derived class, you usually want to call the assignment operator\
    \ member function from the base class, which you can explicitly call using the\
    \ base class name as a prefix. If Boss is derived from Enemy, the overloaded assignment\
    \ operator member function defined in Boss could start:\n\n```\nBoss& operator=(const\
    \ Boss& b)\n{\n    Enemy::operator=(b);    //handles the data members inherited\
    \ from Enemy\n    //now take care of data members defined in Boss\n}\n```\n\n\
    The explicit call to Enemy's assignment operator member function handles the data\
    \ members inherited from Enemy. The rest of the member function would take care\
    \ of the data members defined in Boss."
