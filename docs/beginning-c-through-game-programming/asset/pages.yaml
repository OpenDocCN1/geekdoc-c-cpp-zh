    \ associated with case 2 is executed and “You picked Normal” is displayed. If\
    \ the user enters 3, then code associated with case 3 is executed and “You picked\
    \ Hard” is displayed. If the user enters any other value, then default kicks in\
    \ and “You made an illegal choice” is displayed.\n\n> **Trap**\n> \n> You'll almost\
    \ always want to end each case with a `break` statement. Don't forget them; otherwise,\
    \ your code might do things you never intended.\n\n# USING WHILE LOOPS\n\nwhile\
    \ loops let you repeat sections of code as long as an expression is true. Here's\
    \ a generic form of the while loop:\n\n```\nwhile (expression)\n    statement;\n\
    ```\n\nIf expression is false, the program moves on to the statement after the\
    \ loop. If expression is true, the program executes statement and loops back to\
    \ test expression again. This cycle repeats until expression tests false, at which\
    \ point the loop ends.\n\n# Introducing the Play Again Program\n\nThe Play Again\
    \ program simulates the play of an exciting game. (Okay, by “simulates the play\
