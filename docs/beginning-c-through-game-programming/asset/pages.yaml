    \ produce an error). You can compare string objects and C-style strings using\
    \ the relational operators. And you can even use C-style strings as arguments\
    \ in string object member functions.\n\nC-style strings have the same shortcomings\
    \ as arrays. One of the biggest is that their lengths are fixed. So the moral\
    \ is: Use string objects whenever possible, but be prepared to work with C-style\
    \ strings if necessary."
