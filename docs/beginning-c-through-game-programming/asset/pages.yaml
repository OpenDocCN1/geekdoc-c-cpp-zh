  md: "# Declaring and Initializing Static Data Members\n\nA static data member is\
    \ a single data member that exists for the entire class. In the class definition,\
    \ I declare a static data member s_Total to store the number of Critter objects\
    \ that have been instantiated.\n\n```\nstatic int s_Total; //static member variable\
    \ declaration\n```\n\nYou can declare your own static data members just like I\
    \ did, by starting the declaration with the static keyword. I prefixed the variable\
    \ name with s_ so it would be instantly recognizable as a static data member.\n\
    \nOutside of the class definition, I initialize the static data member to 0.\n\
    \n```\nint Critter::s_Total = 0; //static member variable initialization\n```\n\
    \nNotice that I qualified the data member name with Critter::. Outside of its\
    \ class definition, you must qualify a static data member with its class name.\
    \ After the previous line of code executes, there is a single value associated\
    \ with the Critter class, stored in its static data member s_Total with a value\
    \ of 0.\n\n> Hint\n> \n> You can declare a static variable in non-class functions,\
    \ too. The static variable maintains its value between function calls.\n\n# Accessing\
    \ Static Data Members\n\nYou can access a public static data member anywhere in\
    \ your program. In main(), I access Critter::s_Total with the following line,\
    \ which displays 0, the value of the static data member and the total number of\
    \ Critter objects that have been instantiated.\n\n```\ncout << Critter::s_Total\
    \ << \"\\n\\n\";\n```\n\n> Hint\n> \n> You can also access a static data member\
    \ through any object of the class. Assuming that crit1 is a Critter object, I\
    \ could display the total number of critters with the following line:\n> \n> cout\
    \ << crit1.s_Total << \"\\n\\n\";\n\nI also access this static data member in\
    \ the Critter constructor with the following line, which increments s_Total.\n\
