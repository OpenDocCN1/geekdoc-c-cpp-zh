  md: "# Trick\n\nJust as you can with regular functions, you can inline member functions.\
    \ One way to inline a member function is to define it right inside of the class\
    \ definition, where you'd normally only declare the member function. If you include\
    \ a member function definition in a class, then of course you don't need to define\
    \ it outside of the class.\n\nAn exception to this rule is that when you define\
    \ a member function in a class definition using the keyword virtual, the member\
    \ function is not automatically inlined. You'll learn about virtual functions\
    \ in Chapter 10, “Inheritance and Polymorphism: Blackjack.”\n\nAt this point,\
    \ you might be wondering why you'd go to the trouble of making a data member private\
    \ only to grant full access to it through accessor functions. The answer is that\
    \ you don't generally grant full access. For example, take a look at the accessor\
    \ member function I defined for setting an object's m_Hunger data member, SetHunger():\n\
    \n```\nvoid Critter::SetHunger(int hunger)\n{\n    if (hunger < 0)\n    {\n  \
    \      cout << \"You can't set a critter's hunger to a negative number.\\n\\n\"\
    ;\n    }\n    else\n    {\n        m_Hunger = hunger;\n    }\n}\n```\n\nIn this\
    \ accessor member function, I first check to make sure that the value passed to\
    \ the member function is greater than zero. If it's not, it's an illegal value\
    \ and I display a message, leaving the data member unchanged. If the value is\
    \ greater than zero, then I make the change. This way, SetHunger() protects the\
    \ integrity of m_Hunger, ensuring that it can't be set to a negative number. Just\
    \ as I've done here, most game programmers begin their accessor member function\
    \ names with Get or Set.\n\n# Defining Constant Member Functions\n\nA constant\
    \ member function can't modify a data member of its class or call a non-constant\
    \ member function of its class. Why restrict what a member function can do? Again,\
    \ it goes back to the tenet of asking only for what you"
