  md: '# CHAPTER 7


    # Pointers: Tic-Tac-Toe 2.0


    Pointers are a powerful part of C++. In some ways, they behave like iterators
    from the STL. Often, you can use them in place of references. But pointers offer
    functionality that no other part of the language can. In this chapter, you''ll
    learn the basic mechanics of pointers and get an idea of what they''re good for.
    Specifically, you''ll learn to:


    +   - Declare and initialize pointers

    +   - Dereference pointers

    +   - Use constants and pointers

    +   - Pass and return pointers

    +   - Work with pointers and arrays


    # Understanding Pointer Basics


    Pointers have a reputation for being difficult to understand. In reality, the
    essence of pointers is quite simple—a pointer is a variable that can contain a
    memory address. Pointers give you the ability to work directly and efficiently
    with computer memory. Like iterators from the STL, they''re often used to access
    the contents of other variables. But before you can put pointers to good use in
    your game programs, you have to understand the basics of how they work.


    ![](img/c7e8651578bccd573227f684823b8754_245_0.png)'
  merge: -1
  img_proc: true
- pgno: 246
  md: '# Hint


    Computer memory is a lot like a neighborhood, but instead of houses in which people
    store their stuff, you have memory locations where you can store data. Just like
    a neighborhood where houses sit side by side, labeled with addresses, chunks of
    computer memory sit side by side, labeled with addresses. In a neighborhood, you
    can use a slip of paper with a street address on it to get to a particular house
    (and to the stuff stored inside it). In a computer, you can use a pointer with
    a memory address in it to get to a particular memory location (and to the stuff
    stored inside it).


    # Introducing the Pointing Program


    The Pointing program demonstrates the mechanics of pointers. The program creates
    a variable for a score and then creates a pointer to store the address of that
    variable. The program shows that you can change the value of a variable directly,
    and the pointer will reflect the change. It also shows that you can change the
    value of a variable through a pointer. It then demonstrates that you can change
    a pointer to point to another variable entirely. Finally, the program shows that
    pointers can work just as easily with objects. Figure 7.1 illustrates the results
    of the program.


    You can download the code for this program from the Course Technology website
    (www.courseptr.com/downloads). The program is in the Chapter 7 folder; the filename
    is pointing.cpp.


    ![](img/c7e8651578bccd573227f684823b8754_246_0.png)


    Figure 7.1

    The pointer pScore first points to the variable score and then to the variable
    newScore, while the pointer pStr points to the variable str.'
