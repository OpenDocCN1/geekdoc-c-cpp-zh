    \ the compiler. First, inside the class definition, I declare the copy constructor:\n\
    \n```\n```cpp\nCritter(const Critter& c);    //copy constructor prototype\n```\n\
    ```\n\nNext, outside the class definition, I define the copy constructor:\n\n\
    ```\n```cpp\nCritter::Critter(const Critter& c)    //copy constructor definition\n\
    {\n    cout << \"Copy Constructor called\\n\";\n    m_pName = new string(*c.m_pName);\n\
    \    m_Age = c.m_Age;\n}\n```\n```\n\nJust like this one, a copy constructor must\
    \ have the same name as the class. It returns no value, but accepts a reference\
    \ to an object of the class—the object that needs to be copied. The reference\
    \ should be made a constant reference to protect the original object from being\
    \ changed during the copy process.\n\nThe job of a copy constructor is to copy\
    \ any data members from the original object to the copy object. If a data member\
    \ of the original object is a pointer to a value on the heap, the copy constructor\
    \ should request memory from the heap, copy the original heap value to this new\
    \ chunk of memory, and then point the appropriate copy object data member to this\
    \ new memory.\n\nWhen I call testCopyConstructor() by passing crit to the function\
