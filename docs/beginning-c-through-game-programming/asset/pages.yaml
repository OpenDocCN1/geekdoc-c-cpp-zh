  md: "# Working with Nested Scopes\n\nYou can create a nested scope with a pair of\
    \ curly braces in an existing scope. That's what I do next in main(), with:\n\n\
    ```\n{\n    cout << \"In main() in a new scope var is: \" << var << \"\\n\\n\"\
    ;\n    \n    cout << \"Creating new var in new scope.\\n\";\n    int var = 10;\
    \ // variable in new scope, hides other variable named var\n    cout << \"In main()\
    \ in a new scope var is: \" << var << \"\\n\\n\";\n}\n```\n\nThis new scope is\
    \ a nested scope in main(). The first thing I do in this nested scope is display\
    \ var. If a variable hasn't been declared in a scope, the computer looks up the\
    \ levels of nested scopes one at a time to find the variable you requested. In\
    \ this case, because var hasn't been declared in this nested scope, the computer\
    \ looks one level up to the scope that defines main() and finds var. As a result,\
    \ the program displays that variable's value—5.\n\nHowever, the next thing I do\
    \ in this nested scope is declare a new variable named var and initialize it to\
    \ 10. Now when I send var to cout, 10 is displayed. This time the computer doesn't\
    \ have to look up any levels of nested scopes to find var; there's a var local\
    \ to this scope. And don't worry, the var I first declared in main() still exists;\
    \ it's simply hidden in this nested scope by the new var.\n\n# Trap\n\n> Although\
    \ you can declare variables with the same name in a series of nested scopes, it's\
    \ not a good idea because it can lead to confusion.\n\nNext, when the nested scope\
    \ ends, the var that was equal to 10 goes out of scope and ceases to exist. However,\
    \ the first var I created is still around, so when I display var for the last\
    \ time in main() with the following line, the program displays 5.\n\n```\ncout\
    \ << \"At end of main() var is: \" << var << \"\\n\";\n```"
