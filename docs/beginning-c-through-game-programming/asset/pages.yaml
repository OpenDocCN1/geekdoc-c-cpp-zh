    # UNDERSTANDING THE RELATIONSHIP BETWEEN POINTERS AND ARRAYS


    Pointers have an intimate relationship with arrays. In fact, an array name is
    really a constant pointer to the first element of the array. Because the elements
    of an array are stored in a contiguous block of memory, you can use the array
    name as a pointer for random access to elements. This relationship also has important
    implications for how you can pass and return arrays, as you''ll soon see.


    # Introducing the Array Passer Program


    The Array Passer program creates an array of high scores and then displays them,
    using the array name as a constant pointer. Next, the program passes the array
    name as a constant pointer to a function that increases the scores. Finally, the
