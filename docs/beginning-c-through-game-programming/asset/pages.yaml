- pgno: 57
  md: '# I Don''t Want to Kill You


    ARTHUR BRYANT, a young manager at GreenLeaf Industries, has a problem: his normally
    friendly, chatty boss Reginald has become withdrawn and hostile. After a tense
    morning meeting, Arthur discovers that Reginald is planning to fire him. When
    he overhears two police officers at the coffee shop mentioning the name "Reginald"
    and an investigation into a series of thefts at the company, Arthur realizes that
    his boss is the target of a criminal investigation. As Arthur watches Reginald
    across the room, the two share a moment of mutual understanding, and Arthur knows
    he must decide whether to expose his boss or protect the man he has come to respect.


    THAT EVENING, Arthur finds himself alone in his apartment, replaying the conversation
    he overheard. Was Reginald really a thief? It didn''t seem possible. The man had
    built GreenLeaf from the ground up, had poured his life into the company. Yet
    the evidence was there, sitting in the back of Arthur''s mind like a stone he
    couldn''t swallow.


    Arthur''s phone buzzes. It''s a text from Reginald: "You''re right. I''ve been
    unfair to you. Can we meet for coffee?" Arthur stares at the message, his finger
    hovering over the reply button. His gut tells him to trust Reginald, but his head
    reminds him of the officers'' words.


    He types: "Sure. The usual place, 7 p.m."


    At the coffee shop, Reginald looks older than Arthur remembers. His shoulders
    seem heavier under his jacket. They order, and for a long moment neither speaks.


    "I know about the investigation," Arthur says quietly. "I heard two officers talking."


    Reginald''s fork clatters against his plate. "Then you know. I was hoping to tell
    you myself before it got out. The company is in trouble, Arthur. Not just financial
    trouble - the kind that follows you home at night." He pauses, rubbing his temples.
    "I didn''t steal, not in the way they think. I made mistakes, bad ones, but I
    never meant to hurt anyone."


    Arthur watches his boss''s hands, the way they tremble around the cup of coffee.
    He thinks about the man who once stayed late to help him prepare a presentation,
    who sent a fruit basket when Arthur''s mother was in the hospital. This is the
    same man, he tells himself. The same hands that wrote him a birthday card last
    month.'
