    guess the number in as few attempts as possible. Each time the player enters a
    guess, the computer tells him whether the guess is too high, too low, or right
    on the money. Once the player guesses the number, the game is over. Figure 2.14
    shows Guess My Number in action. You can download the code for this program from
    the Course Technology website (www.courseptr.com/downloads). The program is in
    the Chapter 2 folder; the filename is guess_my_number.cpp.'
