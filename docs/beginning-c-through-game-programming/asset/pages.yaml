  md: "# The Critter Class\n\nThe Critter class is the blueprint for the object that\
    \ represents the player's critter. The class isn't complicated, and most of it\
    \ should look familiar, but it's long enough that it makes sense to attack it\
    \ in pieces.\n\n# The Class Definition\n\nAfter some initial comments and statements,\
    \ I begin the Critter class.\n\n```\n```cpp\n//Critter Caretaker\n//Simulates\
