    \ by a pair of parentheses. If a function returns a value, you can assign that\
    \ value to a variable. That's what I do here with my use of the assignment statement.\
    \ I assign the value returned by rand() (a random number) to randomNumber.\n\n\
    > **Hint**\n> \n> The rand() function generates a random number between 0 and\
    \ at least 32767. The exact upper limit depends on your implementation of C++.\
    \ The upper limit is stored in the constant RAND_MAX, which is defined in cstdlib.\
    \ So if you want to know the maximum random number rand() can generate, just send\
    \ RAND_MAX to cout.\n\nFunctions can also take values to use in their work. You\
    \ provide these values by placing them between the parentheses after the function\
    \ name, separated by commas. These values are called arguments, and when you provide\
    \ them, you pass them to the function. I didn't pass any values to rand() because\
    \ the function doesn't take any arguments.\n\n# Seeding the Random Number Generator\n\
    \nComputers generate pseudorandom numbers—not truly random numbers—based on a\
    \ formula. One way to think about this is to imagine that the computer reads from\
    \ a huge book of predetermined numbers. By reading from this book, the computer\
    \ can appear to produce a sequence of random numbers.\n\nBut there's a problem:\
    \ The computer always starts reading the book from the beginning. Because of this,\
    \ the computer will always produce the same series of “random” numbers in a program.\
    \ In games, this isn't something we'd want. We wouldn't, for example, want the\
    \ same series of dice rolls in a game of craps every time we played."
