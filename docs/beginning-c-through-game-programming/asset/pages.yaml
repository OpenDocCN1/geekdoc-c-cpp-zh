  md: '+   - You can use the `return` statement to return a value from a function.
    You can also use `return` to end a function that has `void` as its return type.

    +   - A variable''s scope determines where the variable can be seen in your program.

    +   - Global variables are accessible from any part of your program. In general,
    you should try to limit your use of global variables.

    +   - Global constants are accessible from any part of your program. Using global
    constants can make your program code clearer.

    +   - Default arguments are assigned to a parameter if no value for the parameter
    is specified in the function call.

    +   - Function overloading is the process of creating multiple definitions for
    the same function, each of which has a different set of parameters.

    +   - Function inlining is the process of asking the compiler to inline a function—meaning
    that the compiler should make a copy of the function everywhere in the code where
    the function is called. Inlining very small functions can sometimes yield a performance
    boost.


    # QUESTIONS AND ANSWERS


    Q: Why should I write functions?


    A: Functions allow you to break up your programs into logical pieces. These pieces
    result in smaller, more manageable chunks of code, which are easier to work with
    than a single monolithic program.


    Q: What’s encapsulation?


    A: At its core, encapsulation is about keeping things separate. Function encapsulation
    provides that variables declared in a function are not accessible outside the
    function, for example.


    Q: What’s the difference between an argument and a parameter?


    A: An argument is what you use in a function call to pass a value to a function.
    A parameter is what you use in a function definition to accept values passed to
    a function.'
