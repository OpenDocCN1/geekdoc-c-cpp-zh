  md: 'This results in an efficient and safe function call. It''s efficient because
    only a reference is passed; the vector is not copied. It''s safe because the reference
    to the vector is a constant reference; inventory can''t be changed by display().


    # Trap


    > You can''t modify a parameter marked as a constant reference. If you try, you''ll
    generate a compile error.


    Next, display() lists the elements in the vector using a constant reference to
    inventory. Then control returns to main() and the program ends.


    # DECIDING HOW TO PASS ARGUMENTS


    At this point you''ve seen three different ways to pass arguments—by value, as
    a reference, and as a constant reference. So how do you decide which method to
    use? Here are some guidelines:


    +   - **By value.** Pass by value when an argument variable is one of the fundamental
    built-in types, such as `bool`, `int`, or `float`. Objects of these types are
    so small that passing by reference doesn''t result in any gain in efficiency.
    You should also pass by value when you want the computer to make a copy of a variable.
    You might want to use a copy if you plan to alter a parameter in a function, but
    you don''t want the actual argument variable to be affected.

    +   - **As a constant reference.** Pass a constant reference when you want to
    efficiently pass a value that you don''t need to change.

    +   - **As a reference.** Pass a reference only when you want to alter the value
    of the argument variable. However, you should try to avoid changing argument variables
    whenever possible.


    # RETURNING REFERENCES


    Just like when you pass a value, when you return a value from a function, you''re
    really returning a copy of the value. Again, for values of the basic built-in
    types, this isn''t a big deal. However, it can be an expensive operation if you''re
    returning a large object. Returning a reference is an efficient alternative.'
