    # Trick


    > Self-documenting code is written in such a way that it''s easy to understand
    what is happening in the program independent of any comments. Choosing good variable
    names is an excellent step toward this kind of code.


    # Assigning Values to Variables


    In the next group of statements, I assign values to the six variables I declared.
    I''ll go through a few assignments and talk a little about each variable type.


    # Assigning Values to Integer Variables


    In the following assignment statement I assign the value of 0 to score. Now score
    stores 0. You assign a value to a variable by writing the variable name followed
    by the assignment operator (=) followed by an expression. (Yes, technically 0
    is an expression, which evaluates to, well, 0.)


    ```

    score = 0;

    ```


    # Assigning Values to Floating Point Variables


    In the statement I assign distance the value 1200.76. Because distance is of type
    double, I can use it to store a number with a fractional part, which is just what
    I do.


    ```

    distance = 1200.76;

    ```


    # Assigning Values to Character Variables


    In the following statement I assign playAgain the single-character value ''y''.
    As I did here, you can assign a character to a variable of type char by surrounding
    the character with single quotes.


    ```

    playAgain = ''y'';

    ```'
