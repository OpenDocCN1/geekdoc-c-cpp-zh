- pgno: 31
  md: 'I use the output operator (<<) to send the string to cout. You can think of
    the output operator like a funnel; it takes whatever’s on the open side and funnels
    it to the pointy side. So the string is funneled to the standard output—the screen.


    I use std to prefix cout to tell the compiler that I mean cout from the standard
    library. std is a namespace. You can think of a namespace like an area code of
    a phone number—it identifies the group to which something belongs. You prefix
    a namespace using the scope resolution operator (::).


    Finally, I send std::endl to the standard output. endl is defined in iostream
    and is also an object in the std namespace. Sending endl to the standard output
    acts like pressing the Enter key in the console window. In fact, if I were to
    send another string to the console window, it would appear on the next line.


    I understand this might be a lot to take in, so check out Figure 1.3 for a visual
    representation of the relationship between all of the elements I’ve just described.


    ![](img/c7e8651578bccd573227f684823b8754_31_0.png)


    Figure 1.3

    An implementation of Standard C++ includes a set of files called the standard
    library, which includes the file iostream, which defines various things, including
    the object cout.


    # Terminating Statements


    You’ll notice that the first line of the function ends with a semicolon (;). That’s
    because the line is a statement—the basic unit controlling the execution flow.
    All of your statements must end with a semicolon—otherwise, your compiler will
    complain with an error message and your program won’t compile.'
