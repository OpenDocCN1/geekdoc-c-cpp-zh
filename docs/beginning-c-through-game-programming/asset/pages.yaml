  md: "```\nreturn 0;\n}\n\ninline int radiation(int health)\n{\n    return (health\
    \ / 2);\n}\n```\n\n# Specifying Functions for Inlining\n\nTo mark a function for\
    \ inlining, simply put `inline` before the function definition. That's what I\
    \ do when I define the following function:\n\n```\ninline int radiation(int health)\n\
    ```\n\nNote that you don't use `inline` in the function declaration:\n\n```\n\
    int radiation(int health);\n```\n\nBy flagging the function with `inline`, you\
    \ ask the compiler to copy the function directly into the calling code. This saves\
    \ the overhead of making the function call. That is, program control doesn't have\
    \ to jump to another part of your code. For small functions, this can result in\
    \ a performance boost.\n\nHowever, inlining is not a silver bullet for performance.\
    \ In fact, indiscriminate inlining can lead to worse performance because inlining\
    \ a function creates extra copies of it, which can dramatically increase memory\
    \ consumption.\n\n> **Hint**\n> \n> When you inline a function, you really make\
    \ a request to the compiler, which has the ultimate decision on whether to inline\
    \ the function. If your compiler thinks that inlining won't boost performance,\
    \ it won't inline the function.\n\n# Calling Inlined Functions\n\nCalling an inlined\
    \ function is no different than calling a non-inlined function, as you see with\
    \ my first call to `radiation()`.\n\n```\nhealth = radiation(health);\n```\n\n\
    This line of code assigns `health` one half of its original value.\n\nAssuming\
    \ that the compiler grants my request for inlining, this code doesn't result in\
    \ a function call. Instead, the compiler places the code to halve `health`"
