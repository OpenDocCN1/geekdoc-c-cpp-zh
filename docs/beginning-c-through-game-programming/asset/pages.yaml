- pgno: 241
  md: 'Still others opt for int &ref = var:. The computer is fine with all three.
    There are cases to be made for each style; however, the most important thing is
    to be consistent.


    Q: Why can''t I initialize a non-constant reference with a constant value?

    A: Because a non-constant reference allows you to change the value to which it
    refers.


    Q: If I initialize a constant reference with a non-constant variable, can I change
    the value of the variable?

    A: Not through the constant reference because when you declare a constant reference,
    you''re saying that the reference can''t be used to change the value to which
    it refers (even if that value can be changed by other means).


    Q: How does passing a constant reference save overhead?

    A: When you pass a large object to a function by value, your program makes a copy
    of the object. This can be an expensive operation depending on the size of the
    object. Passing a reference is like only passing access to the large object; it
    is an inexpensive operation.


    Q: Can I make a reference to a reference?

    A: Not exactly. You can assign one reference to another reference, but the new
    reference will simply refer to the value to which the original reference refers.


    Q: What happens if I declare a reference without initializing it?

    A: Your compiler should complain because it''s illegal.


    Q: Why should I avoid changing the value of a variable that I pass through a reference?

    A: Because it could lead to confusion. It''s impossible to tell from only a function
    call whether a variable is being passed to change its value.


    Q: Does that mean I should always pass a constant reference?

    A: No. You can pass a non-constant reference to a function, but to most game programmers,
    this signals that you intend to change the argument variable''s value.'
