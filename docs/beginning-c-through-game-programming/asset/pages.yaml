- pgno: 193
  md: '# USING DEFAULT ARGUMENTS


    When you write a function in which a parameter almost always gets passed the same
    value, you can save the caller the effort of constantly specifying this value
    by using a default argument—a value assigned to a parameter if none is specified.
    Here’s a concrete example. Suppose you have a function that sets the graphics
    display. One of your parameters might be bool fullScreen, which tells the function
    whether to display the game in full-screen or windowed mode. Now, if you think
    the function will often be called with true for fullScreen, you could give that
    parameter a default argument of true, saving the caller the effort of passing
    true to fullScreen whenever the caller invokes this display-setting function.


    # Introducing the Give Me a Number Program


    The Give Me a Number program asks the user for two different numbers in two different
    ranges. The same function is called each time the user is prompted for a number.
    However, each call to this function uses a different number of arguments because
    this function has a default argument for the lower limit. This means the caller
    can omit an argument for the lower limit, and the function will use a default
    value automatically. Figure 5.5 shows the results of the program.


    ![](img/c7e8651578bccd573227f684823b8754_193_0.png)


    Figure 5.5

    A default argument is used for the lower limit the first time the user is prompted
    for a number.'
