    +   - Polymorphism is the quality whereby a member function will produce different
    results depending on the type of object for which it is called.

    +   - Virtual functions allow for polymorphic behavior.

    +   - Once a member function is defined as virtual, it''s virtual in any derived
    class.

    +   - A pure virtual function is a function to which you don''t need to give a
    definition. You specify a pure virtual function by placing an equal sign and a
    zero at the end of the function header.

    +   - An abstract class has at least one pure virtual member function.

    +   - An abstract class can''t be used to instantiate an object.


    # QUESTIONS AND ANSWERS


    Q: How many levels of inheritance can you have?

    A: Theoretically, as many as you want. But as a beginning programmer, you should
    keep things simple and try not to go beyond a few levels.


    Q: Is friendship inherited? That is, if a function is a friend of a base class,
    is it automatically a friend of a derived class?

    A: No.


    Q: Can a class have more than one direct base class?

    A: Yes. This is called *multiple inheritance*. It''s powerful, but creates its
    own set of thorny issues.


    Q: Why would you want to call a base class constructor from a derived class constructor?

    A: So you can control exactly how the base class constructor is called. For example,
    you might want to pass specific values to the base class constructor.


    Q: Are there any dangers in overriding a base class function?

    A: Yes. By overriding a base class member function, you hide all of the overloaded
    version of the function in the base class. However, you can'
