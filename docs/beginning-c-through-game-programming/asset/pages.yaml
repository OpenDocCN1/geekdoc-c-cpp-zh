- pgno: 67
  md: "inside another, it's called nesting. In the following code, the if statement\
    \ that begins if (score >= 1000) is nested inside the if statement that begins\
    \ if (score > 500).\n\n```\nif (score >= 500)\n{\n    cout << \"You scored 500\
    \ or more. Nice.\\n\\n\";\n    \n    if (score >= 1000)\n    {\n        cout <<\
    \ \"You scored 1000 or more. Impressive!\\n\";\n    }\n}\n```\n\nBecause score\
    \ is greater than 500, the program enters the statement block and displays the\
    \ message, \"You scored 500 or more. Nice.\" Then, in the inner if statement,\
    \ the program compares score to 1000. Because score is greater than or equal to\
    \ 1000, the program displays the message, \"You scored 1000 or more. Impressive!\"\
    \n\n# Hint\n\nYou can nest as many levels as you want. However, if you nest code\
    \ too deeply, it gets hard to read. In general, you should try to limit your nesting\
    \ to a few levels at most.\n\n# USING THE ELSE CLAUSE\n\nYou can add an else clause\
    \ to an if statement to provide code that will only be executed if the tested\
    \ expression is false. Here's the form of an if statement that includes an else\
    \ clause:\n\n```\nif (expression)\n    statement1;\nelse\n    statement2;\n```\n\
    \nIf expression is true, statement1 is executed. Then the program skips statement2\
