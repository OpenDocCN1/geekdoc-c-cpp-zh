    # UNDERSTANDING POINTERS AND CONSTANTS


    There are still some pointer mechanics you need to understand before you can start
    to use pointers effectively in your game programs. You can use the keyword const
    to restrict the way a pointer works. These restrictions can act as safeguards
    and can make your programming intentions clearer. Since pointers are quite versatile,
    restricting how a pointer can be used is in line with the programming mantra of
    asking for only what you need.


    # Using a Constant Pointer


    As you''ve seen, pointers can point to different objects at different times in
    a program. However, by using the const keyword when you declare and initialize
    a pointer, you can restrict the pointer so it can only point to the object it
    was initialized to point to. A pointer like this is called a constant pointer.
    Another way to say this is to say that the address stored in a constant pointer
    can never change—it''s constant. Here''s an example of creating a constant pointer:


    ```

    ```c

    int score = 100;

    int* const pScore = &score;  // a constant pointer

    ```

    ```


    The preceding code creates a constant pointer, pScore, which points to score.
    You create a constant pointer by putting const right before the name of the pointer
    when you declare it.


    Like all constants, you must initialize a constant pointer when you first declare
    it. The following line is illegal and will produce a big, fat compile error.


    ```

    ```c

    int* const pScore;  // illegal -- you must initialize a constant pointer

    ```

    ```


    Because pScore is a constant pointer, it can''t ever point to any other memory
    location. The following code is also quite illegal.


    ```

    ```c

    pScore = &anotherScore;  // illegal - pScore can''t point to a different object

    ```

    ```


    Although you can''t change pScore itself, you can use pScore to change the value
    to which it points. The following line is completely legal.


    ```

    ```c

    *pScore = 500;

    ```

    ```'
