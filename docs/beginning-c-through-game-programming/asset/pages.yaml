  md: 'The constant I access through string::npos represents the largest possible
    size of a string object, so it is greater than any possible valid position number
    in a string object. Informally, it means “a position number that can’t exist.”
    It’s the perfect return value to indicate that one string couldn’t be found in
    another.


    # Hint


    When using find(), you can supply an optional argument that specifies a character
    number for the program to start looking for the substring. The following line
    will start looking for the string literal "eggplant" beginning at position 5 in
    the string object phrase.


    ```

    location = phrase.find("eggplant", 5);

    ```


    # Using the erase() Member Function


    The erase() member function removes a specified substring from a string object.
    One way to call the member function is to specify the beginning position and the
    length of the substring, as I did in this code:


    ```

    phrase.erase(4, 5);

    ```


    The previous line removes the five-character substring starting at position 4.
    Because phrase is "Lame Over!!!", the member function removes the substring Over
    and, as a result, phrase becomes "Lame!!!".


    Another way to call erase() is to supply just the beginning position of the substring.
    This removes all of the characters starting at that position number to the end
    of the string object. That’s what I do next:


    ```

    phrase.erase(4);

    ```


    This line removes all of the characters of the string object starting at position
    4. Since phrase is "Lame!!!", the member function removes the substring !!! and,
    as a result, phrase becomes "Lame".


    Yet another way to call erase() is to supply no arguments, as I did in this code:


    ```

    phrase.erase();

    ```'
