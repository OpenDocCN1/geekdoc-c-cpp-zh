  md: '+   - Algorithms defined in the STL can be used with its containers and provide
    common functions for working with groups of objects.

    +   - Iterators are objects that identify elements in containers and can be manipulated
    to move among elements.

    +   - Iterators are the key to using containers to their fullest. Many of the
    container member functions require iterators, and the STL algorithms require them
    too.

    +   - To get the value referenced by an iterator, you must dereference the iterator
    using the dereference operator (*).

    +   - A vector is one kind of sequential container provided by the STL. It acts
    like a dynamic array.

    +   - It''s very efficient to iterate through a vector. It''s also very efficient
    to insert or remove an element from the end of a vector.

    +   - It can be inefficient to insert or delete elements from the middle of a
    vector, especially if the vector is large.

    +   - Pseudocode, which falls somewhere between English and a programming language,
    is used to plan programs.

    +   - Stepwise refinement is a process used to rewrite pseudocode to make it ready
    for implementation.


    # QUESTIONS AND ANSWERS


    Q: Why is the STL important?

    A: Because it saves game programmers time and effort. The STL provides commonly
    used container types and algorithms.


    Q: Is the STL fast?

    A: Definitely. The STL has been honed by hundreds of programmers to eke out as
    much performance as possible on each supported platform.


    Q: When should I use a vector instead of an array?

    A: Almost always. Vectors are efficient and flexible. They do require a little
    more memory than arrays, but this tradeoff is almost always worth the benefits.'
