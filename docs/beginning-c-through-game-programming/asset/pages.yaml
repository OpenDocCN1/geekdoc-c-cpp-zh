  md: "By using private:, I'm saying that any data member or member function that\
    \ follows (until another access level specifier) will be private. This means that\
    \ only code in the Critter class can directly access it. Since I declare m_Hunger\
    \ in this section, it means that only the code in Critter can directly access\
    \ an object's m_Hunger data member. Therefore, I can't directly access an object's\
    \ m_Hunger data member through the object in main() as I've done in previous programs.\
    \ So the following line in main(), if uncommented, would be an illegal statement:\n\
    \n```\n//cout << crit.m_Hunger; //Illegal, m_Hunger is private!\n```\n\nBecause\
    \ m_Hunger is private, I can't access it from code that is not part of the Critter\
    \ class. Again, only code that's part of Critter can directly access the data\
    \ member.\n\nI've only shown you how to make data members private, but you can\
    \ make member functions private, too. Also, you can repeat access modifiers. So\
    \ if you want, you could have a private section, followed by a public section,\
    \ followed by another private section in a class. Finally, member access is private\
    \ by default. Until you specify an access modifier, any class members you declare\
    \ will be private.\n\n# Defining Accessor Member Functions\n\nAn accessor member\
    \ function allows indirect access to a data member. Because m_Hunger is private,\
