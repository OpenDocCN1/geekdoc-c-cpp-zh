  md: "# Using the find() Algorithm\n\nAfter I display the contents of the vector\
    \ scores, I get a value from the user to find and store it in the variable score.\
    \ Then I use the find() algorithm to search the vector for the value:\n\n```\n\
    iter = find(scores.begin(), scores.end(), score);\n```\n\nThe find() STL algorithm\
    \ searches a specified range of a container's elements for a value. It returns\
    \ an iterator that references the first matching element. If no match is found,\
    \ it returns an iterator to the end of the range. You must pass the starting point\
    \ as an iterator, the ending point as an iterator, and a value to find. The algorithm\
    \ searches from the starting iterator up to but not including the ending iterator.\
    \ In this case, I passed scores.begin() and scores.end() as the first and second\
    \ arguments to search the entire vector. I passed score as the third argument\
    \ to search for the value the user entered.\n\nNext I check to see if the value\
    \ score was found:\n\n```\nif (iter != scores.end())\n{\n    cout << \"Score found.\\\
    n\";\n}\nelse\n{\n    cout << \"Score not found.\\n\";\n}\n```\n\nRemember, iter\
    \ will reference the first occurrence of score in the vector, if the value was\
    \ found. So, as long as iter is not equal to scores.end(), I know that score was\
    \ found and I display a message saying so. Otherwise, iter will be equal to scores.end()\
    \ and I know score was not found.\n\n# Using the random_shuffle() Algorithm\n\n\
    Next I prepare to randomize the scores using the random_shuffle() algorithm. Just\
    \ as when I generate a single random number, I seed the random number generator\
    \ before I call random_shuffle(), so the order of the scores might be different\
    \ each time I run the program.\n\n```\nsrand(static_cast<unsigned int>(time(0)));\n\
    ```\n\nThen I reorder the scores in a random way.\n\n```\nrandom_shuffle(scores.begin(),\
    \ scores.end());\n```"
