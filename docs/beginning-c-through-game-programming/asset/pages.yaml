    # Understanding Order of Operations


    Just like arithmetic operators, logical operators have precedence levels that
    affect the order in which an expression is evaluated. Logical NOT, !, has a higher
    level of precedence than logical AND, &&, which has a higher precedence than logical
    OR, ||.


    Just as with arithmetic operators, if you want an operation with lower precedence
    to be evaluated first, you can use parentheses. You can create complex expressions
    that involve arithmetic operators, relational operators, and logical operators.
    Operator precedence will define the exact order in which elements of the expression
    are evaluated. However, it’s best to try to create expressions that are clear
    and simple, not ones that require a mastery of the operator precedence list to
    decipher.


    For a list of C++ operators and their precedence levels, see Appendix B.'
