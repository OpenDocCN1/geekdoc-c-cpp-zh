    \ word2[] = \" Over\";\n\nstring phrase = word1 + word2;\n\nif (word1 != word2)\n\
    {\n    cout << \"word1 and word2 are not equal.\\n\";\n}\n\nif (phrase.find(word2)\
    \ != string::npos)\n{\n    cout << \"word2 is contained in phrase.\\n\";\n}\n\
    ```\n\nYou can concatenate string objects and C-style strings, but the result\
