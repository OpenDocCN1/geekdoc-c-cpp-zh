    \ string objects. A constant iterator is just like a regular iterator except that\
    \ you can't use it to change the element to which it refers; the element must\
    \ remain constant. You can think of a constant iterator as providing read-only\
    \ access. However, the iterator itself can change. This means you can move iter\
    \ all around the vector inventory as you see fit. You can't, however, change the\
    \ value of any of the elements through iter. With a constant iterator the Post-it\
    \ can change, but the thing it's stuck to can't.\n\nWhy would you want to use\
    \ a constant iterator if it's a limited version of a regular iterator? First,\
    \ it makes your intentions clearer. When you use a constant iterator, it's clear\
    \ that you won't be changing any element to which it refers. Second, it's safer.\
    \ You can use a constant iterator to avoid accidentally changing a container element.\
