- pgno: 101
  md: 'Q: If infinite loops are a bad thing, then isn''t a while (true) loop a bad
    thing?


    A: No. When a programmer creates a while (true) loop, he should provide a way
    for the loop to end (usually through a break statement).


    Q: Why would a programmer create a while (true) loop?


    A: while (true) loops are often used for the main loop of a program, like the
    game loop.


    Q: Why do some people feel that using a break statement to exit a loop is poor
    programming?


    A: Because indiscriminate use of break statements can make it hard to understand
    the conditions under which a loop ends. However, sometimes the use of a while
    (true) loop along with a break statement can be clearer than creating the same
    loop in a more traditional way.


    Q: What''s a pseudorandom number?


    A: A random number that''s usually generated by a formula. As a result, a series
    of pseudorandom numbers is not truly random, but good enough for most purposes.


    Q: What''s seeding a random number generator?


    A: It''s giving the random number generator a seed, such as an integer, which
    affects the way the generator produces random numbers. If you don''t seed a random
    number generator, it will produce the same series of numbers each time its run
    from the beginning of a program.


    Q: Don''t you always want to seed the random number generator before using it?


    A: Not necessarily. You might want a program to produce the exact same sequence
    of "random" numbers each time it runs for testing purposes, for example.


    Q: How can I generate more truly random numbers?


    A: There are third-party libraries that produce better pseudorandom numbers than
    the ones that typically come with C++ compilers.'
