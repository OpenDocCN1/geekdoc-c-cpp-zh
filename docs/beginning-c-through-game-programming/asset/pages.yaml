    # Dereferencing Pointers


    Just as you dereference an iterator to access the object to which it refers, you
    dereference a pointer to access the object to which it points. You accomplish
    the dereferencing the same way—with *, the dereference operator. I put the dereference
    operator to work with the following line, which displays 1000 because *pScore
    accesses the value stored in score.


    ```

    ```cpp

    cout << "*pScore is: " << *pScore << "\n"; //value pointed to by pointer

    ```

    ```


    Remember, *pScore means, “the object to which pScore points.”


    # Trap


    > > Don''t dereference a null pointer because it could lead to disastrous results.


    Next, I add 500 to score with the following line.


    ```

    ```cpp

    score += 500;

    ```

    ```


    When I send score to cout, 1500 is displayed, as you''d expect. When I send *pScore
    to cout, the contents of score are again sent to cout, and 1500 is displayed once
    more.'
