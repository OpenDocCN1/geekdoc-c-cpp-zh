- pgno: 251
  md: 'Next, I add 500 to the value to which pScore points with the following line.


    ```

    *pScore += 500;

    ```


    Because pScore points to score, the preceding line of code adds 500 to score.
    Therefore, when I next send score to cout, 2000 is displayed. Then, when I send
    *pScore to cout...you guessed it, 2000 is displayed again.


    # Trap


    Don''t change the value of a pointer when you want to change the value of the
    object to which the pointer points. For example, if I want to add 500 to the int
    that pScore points to, then the following line would be a big mistake.


    ```

    pScore += 500;

    ```


    The preceding code adds 500 to the address stored in pScore, not to the value
    to which pScore originally pointed. As a result, pScore now points to some address
    that might contain anything. Dereferencing a pointer like this can lead to disastrous
    results.


    # Reassigning Pointers


    Unlike references, pointers can point to different objects at different times
    during the life of a program. Reassigning a pointer works like reassigning any
    other variable. Next, I reassign pScore with the following line.


    ```

    pScore = &newScore;

    ```


    As the result, pScore now points to newScore. To prove this, I display the address
    of newScore by sending &newScore to cout, followed by the address stored in pScore.
    Both statements display the same address. Then I send newScore and *pScore to
    cout. Both display 5000 because they both access the same chunk of memory that
    stores this value.


    # Trap


    Don''t change the value to which a pointer points when you want to change the
    pointer itself. For example, if I want to change pScore to point to newScore,
    then the following line would be a big mistake.


    ```

    *pScore = newScore;

    ```


    This code simply changes the value to which pScore currently points; it doesn''t
    change pScore itself. If newScore is equal to 5000, then the previous code is
    equivalent to *pScore = 5000; and pScore still points to the same variable it
    pointed to before the assignment.'
