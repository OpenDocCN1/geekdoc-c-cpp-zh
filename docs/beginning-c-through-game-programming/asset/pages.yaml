  md: "```\nif (score >= 1000)\n{\n    cout << \"You scored 1000 or more. Impressive!\\\
    n\";\n}\n```\n\nHere's the twist. The else clause provides a statement for the\
    \ program to branch to if the expression is false. So if (score >= 1000) is false,\
    \ then the program skips the first message and instead displays the message, \"\
    You scored less than 1000.\"\n\n```\nelse\n{\n    cout << \"You scored less than\
    \ 1000.\\n\";\n}\n```\n\n# USING A SEQUENCE OF IF STATEMENTS WITH ELSE CLAUSES\n\
    \nYou can chain if statements with else clauses together to create a sequence\
    \ of expressions that get tested in order. The statement associated with the first\
    \ expression to test true is executed; otherwise, the statement associated with\
    \ the final (and optional) else clause is run. Here's the form such a series would\
    \ take:\n\n```\nif (expression1)\n    statement1;\nelse if (expression2)\n   \
    \ statement2;\n\n...\n\nelse if (expressionN)\n    statementN;\nelse\n    statementN+1;\n\
    ```\n\nIf expression1 is true, statement1 is executed and the rest of the code\
    \ in the sequence is skipped. Otherwise, expression2 is tested and if true, statement2\
    \ is executed and the rest of the code in the sequence is skipped. The computer\
    \ continues to check each expression in order (through expressionN) and will execute\
    \ the statement associated with the first expression that is true. If no expression\
    \ is true, then the statement associated with the final else clause, statementN+1,\
    \ is executed."
