    # Trap\n\n> Don't confuse override with overload. When you override a member function,\
    \ you provide a new definition of it in a derived class. When you overload a function,\
    \ you create multiple versions of it with different signatures.\n\n# Trap\n\n\
    > When you override an overloaded base class member function, you hide all of\
    \ the other overloaded versions of the base class member function—meaning that\
    \ the only way to access the other versions of the member function is to explicitly\
    \ call the base class member function. So if you override an overloaded member\
    \ function, it's a good idea to override every version of the overloaded function.\n\
    \n# Calling Base Class Member Functions\n\nYou can directly call a base class\
    \ member function from any function in a derived class. All you have to do is\
    \ prefix the class name to the member function name with the scope resolution\
    \ operator. That's what I do when I define the overridden version of Attack()\
    \ for the Boss class.\n\n```\nvoid Boss::Attack() const    //override base class\
    \ member function\n{\n    Enemy::Attack();           //call base class member\
    \ function\n    cout << \" And laughs heartily at you.\\n\";\n}\n```\n\nThe code\
    \ Enemy::Attack(); explicitly calls the Attack() member function of Enemy. Because\
    \ the Attack() definition in Boss overrides the class' inherited"
