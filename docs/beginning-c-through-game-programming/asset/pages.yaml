  md: '# Commenting Code


    The first two lines of the program are comments.


    ```

    // Game Over

    // A first C++ program

    ```


    Comments are completely ignored by the compiler; they’re meant for humans. They
    can help other programmers understand your intentions. But comments can also help
    you. They can remind you how you accomplished something that might not be clear
    at first glance.


    You can create a comment using two forward slashes in a row (//). Anything after
    this on the rest of the physical line is considered part of the comment. This
    means you can also include a comment after a piece of C++ code, on the same line.


    # Hint


    You can also use what are called C-style comments, which can span multiple lines.
    All you have to do is start the comment with /* and end it with */. Everything
    in between the two markers is part of the comment.


    # Using Whitespace


    The next line in the program is a blank line. The compiler ignores blank lines.
    In fact, compilers ignore just about all whitespace—spaces, tabs, and newlines.
    Like comments, whitespace is just for us humans.


    Judicious use of whitespace helps make programs clearer. For example, you can
    use blank lines to separate sections of code that belong together. I also use
    whitespace (a tab, to be precise) at the beginning of the two lines between the
    curly braces to set them off.


    # Including Other Files


    The next line in the program is a preprocessor directive. You know this because
    the line begins with the # symbol.


    ```

    #include <iostream>

    ```


    The preprocessor runs before the compiler does its thing and substitutes text
    based on various directives. In this case, the line involves the #include directive,
    which tells the preprocessor to include the contents of another file.'
