  md: '# Hint


    There are additional ways to declare a vector. You can declare one with a starting
    size by specifying a number in parentheses after the vector name.


    ```

    vector<string> inventory(10);

    ```


    The preceding code declared a vector to hold string object elements with a starting
    size of 10. You can also initialize all of a vector''s elements to the same value
    when you declare it. You simply supply the number of elements followed by the
    starting value, as in:


    ```

    vector<string> inventory(10, "nothing");

    ```


    The preceding code declared a vector with a size of 10 and initialized all 10
    elements to "nothing". Finally, you can declare a vector and initialize it with
    the contents of another vector.


    ```

    vector<string> inventory(myStuff);

    ```


    The preceding code created a new vector with the same contents as the vector myStuff.


    # Using the push_back() Member Function


    Next I give the hero the same three starting items as in the previous version
    of the program.


    ```

    inventory.push_back("sword");

    inventory.push_back("armor");

    inventory.push_back("shield");

    ```


    The push_back() member function adds a new element to the end of a vector. In
    the preceding lines I added "sword", "armor", and "shield" to inventory. As a
    result, inventory[0] is equal to "sword", inventory[1] is equal to "armor", and
    inventory[2] is equal to "shield".


    # Using the size() Member Function


    Next I display the number of items the hero has in his possession.


    ```

    cout << "You have " << inventory.size() << " items.\n";

    ```


    I get the size of inventory by calling the size() member function with inventory.size().
    The size() member function simply returns the size of a vector. In this case,
    it returns 3.'
