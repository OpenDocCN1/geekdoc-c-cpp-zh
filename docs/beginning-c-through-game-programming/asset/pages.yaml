    # Using Increment and Decrement Operators


    Next, I use the increment operator (++) which increases the value of a variable
    by one. I use the operator to increase the value of lives twice. First I use it
    in the following line:


    ```

    ++lives;

    ```


    Then I use it again in the following line:


    ```

    lives++;

    ```


    Each line has the same net effect; it increments lives from 3 to 4.


    As you can see, you can place the operator before or after the variable you’re
    incrementing. When you place the operator before the variable, the operator is
    called the prefix increment operator; when you place it after the variable, it’s
    called the postfix increment operator.


    At this point, you might be thinking that there’s no difference between the postfix
    and prefix versions, but you’d be wrong. In a situation where you only increment
    a single variable (as you just saw), both operators produce the same final result.
    But in a more complex expression, the results can be different.


