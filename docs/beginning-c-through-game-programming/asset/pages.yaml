- pgno: 240
  md: '+   - When you pass a variable to a function by value, you pass a copy of the
    variable to the function.

    +   - When you pass a variable to a function by reference, you pass access to
    the variable.

    +   - Passing by reference can be more efficient than passing by value, especially
    when you are passing large objects.

    +   - Passing a reference provides direct access to the argument variable passed
    to a function. As a result, the function can make changes to the argument variable.

    +   - A constant reference can''t be used to change the value to which it refers.
    You declare a constant reference by using the keyword `const`.

    +   - You can''t assign a constant reference or a constant value to a non-constant
    reference.

    +   - Passing a constant reference to a function protects the argument variable
    from being changed by that function.

    +   - Changing the value of an argument variable passed to a function can lead
    to confusion, so game programmers consider passing a constant reference before
    passing a non-constant reference.

    +   - Returning a reference can be more efficient than returning a copy of a value,
    especially when you are returning large objects.

    +   - You can return a constant reference to an object so the object can''t be
    changed through the returned reference.

    +   - A basic technique of game AI is to have the computer consider all of its
    legal moves and all of its opponent''s legal replies before deciding which move
    to take next.


    # QUESTIONS AND ANSWERS


    Q: Different programmers put the reference operator (&) in different places when
    declaring a reference. Where should I put it?


    A: Three basic styles exist with regard to using the referencing operator. Some
    programmers opt for `int& ref = var;`, while others opt for `int & ref = var;`.'
