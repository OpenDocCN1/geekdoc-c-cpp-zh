  md: "# Using the continue Statement to Jump Back to the Top of a Loop\n\nJust before\
    \ count is displayed, I included the lines:\n\n```\n//skip the number 5\nif (count\
    \ == 5)\n{\n    continue;\n}\n```\n\nThe continue statement means “jump back to\
    \ the top of the loop.” At the top of the loop, the while expression is tested\
    \ and the loop is entered again if it’s true. So when count is equal to 5, the\
    \ program does not get to the cout << count << endl; statement. Instead, it goes\
    \ right back to the top of the loop. As a result, 5 is skipped and never displayed.\n\
    \n# Understanding When to Use break and continue\n\nYou can use break and continue\
