  md: '# USING ITERATORS


    Iterators are the key to using containers to their fullest potential. With iterators
    you can, well, iterate through a sequence container. In addition, important parts
    of the STL require iterators. Many container member functions and STL algorithms
    take iterators as arguments. So if you want to reap the benefits of these member
    functions and algorithms, you''ve got to use iterators.


    # Introducing the Hero''s Inventory 3.0 Program


    The Hero''s Inventory 3.0 program acts like its two predecessors, at least at
    the start. The program shows off a list of items, replaces the first item, and
    displays the number of letters in the name of an item. But then the program does
    something new: It inserts an item at the beginning of the group, and then it removes
    an item from the middle of the group. The program accomplishes all of this by
    working with iterators. Figure 4.2 shows the program in action.


