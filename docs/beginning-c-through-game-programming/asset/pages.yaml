  md: "an example: Suppose I want to make a million dollars. A worthy goal, but what\
    \ do I do to achieve it? I need a plan. So I come up with one and put it in pseudocode.\n\
    \n```\nIf you can think of a new and useful product\nThen that's your product\n\
    Otherwise\n    Repackage an existing product as your product\n    Make an infomercial\
    \ about your product\n    Show the infomercial on TV\n    Charge $100 per unit\
    \ of your product\n    Sell 10,000 units of your product\n```\n\nEven though anyone,\
    \ even a non-programmer, can understand my plan, my pseudocode feels vaguely like\
    \ a program. The first four lines resemble an if statement with an else clause,\
    \ and that's intentional. When you write your plan, you should try to incorporate\
    \ the feel of the code that you're representing with pseudocode.\n\n# Using Stepwise\
    \ Refinement\n\nYour programming plan might not be finished after only one draft.\
    \ Often, pseudocode needs multiple passes before it can be implemented in programming\
    \ code. Stepwise refinement is one process used to rewrite pseudocode to make\
    \ it ready for implementation. Stepwise refinement is pretty simple. Basically,\
    \ it means, “Make it more detailed.” By taking each step described in pseudocode\
    \ and breaking it down into a series of simpler steps, the plan becomes closer\
    \ to programming code. Using stepwise refinement, you keep breaking down each\
    \ step until you feel the entire plan could be fairly easily translated into a\
    \ program. As an example, take a step from my master plan to make a million dollars:\n\
    \n```\nCreate an infomercial about your product\n```\n\nThis might seem like too\
    \ vague of a task. How do you create an infomercial? Using stepwise refinement,\
    \ you can break down the single step into several others. So it becomes\n\n```\n\
    Write a script for an infomercial about your product\nRent a TV studio for a day\n\
    Hire a production crew\nHire an enthusiastic audience\nFilm the infomercial\n\
    ```"
