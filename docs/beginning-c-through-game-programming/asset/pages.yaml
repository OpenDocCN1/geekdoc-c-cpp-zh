    ;\n```\n\nThe previous code creates a C-style string that can hold 80 printable\
    \ characters (plus its terminating null character).\n\nC-style strings don't have\
    \ member functions. But the cstring file, which is part of the standard library,\
    \ contains a variety of functions for working with C-style strings.\n\nA nice\
    \ thing about string objects is that they're designed to work seamlessly with\
    \ C-style strings. For example, all of the following are completely valid uses\
