    \n# Declaring and Defining Destructors\n\nOne problem that can occur when a data\
    \ member of an object points to a value on the heap is a memory leak. That's because\
    \ when the object is deleted, the pointer to the heap value disappears along with\
    \ it. If the heap value remains, it produces a memory leak. To avoid a memory\
    \ leak, the object should clean up after itself before it is destroyed by deleting\
    \ its associated heap value. Fortunately, there's a member function, the destructor,\
    \ that's called just before an object is destroyed, which can be used to perform\
    \ the necessary cleanup.\n\nA default destructor, which is created for you by\
    \ the compiler if you don't write your own, doesn't attempt to free any memory\
    \ on the heap that a data member might point to. This behavior is usually fine\
    \ for simple classes, but when you have a class with data members that point to\
    \ values on the heap, you should write your own destructor so you can free the\
    \ memory on the heap associated with an object before the object disappears, avoiding\
    \ a memory leak. That's what I do in the Critter class. First, inside the class\
    \ definition, I declare the destructor. Notice that a destructor has the name\
    \ of the class preceded by ~ (the tilde character) and does not have any parameters\
    \ or return a value.\n\n```\n```cpp\nCritter::~Critter()                     \
    \ //destructor definition\n{\n    cout << \"Destructor called\\n\";\n    delete\
    \ m_pName;\n}\n```\n```\n\nIn main(), I put the destructor to the test when I\
