  md: "# Writing the Pseudocode\n\nIt's back to your favorite language that's not\
    \ really a language—pseudocode. Because I'll be using functions for most of the\
    \ tasks in the program, I can afford to think about the code at a pretty abstract\
    \ level. Each line of pseudocode should feel like one function call. Later, all\
    \ I'll have to do is write the functions that the plan implies. Here's the pseudocode:\n\
    \n```\nCreate an empty Tic-Tac-Toe board\nDisplay the game instructions\nDetermine\
    \ who goes first\nDisplay the board\nWhile nobody's won and it's not a tie\n \
    \   If it's the human's turn\n        Get the human's move\n        Update the\
    \ board with the human's move\n    Otherwise\n        Calculate the computer's\
    \ move\n        Update the board with the computer's move\n    Display the board\n\
    \    Switch turns\nCongratulate the winner or declare a tie\n```\n\n# Representing\
    \ the Data\n\nAll right, I've got a good plan, but it is pretty abstract and talks\
    \ about throwing around different elements that aren't really defined in my mind\
    \ yet. I see the idea of making a move as placing a piece on a game board. But\
    \ how exactly am I going to represent the game board? Or a piece? Or a move?\n\
    \nSince I'm going to display the game board on the screen, why not just represent\
    \ a piece as a single character—an X or an O? An empty piece could just be a space.\
    \ Therefore, the board itself could be a vector of chars. There are nine squares\
    \ on a Tic-Tac-Toe board, so the vector should have nine elements. Each square\
    \ on the board will correspond to an element in the vector. Figure 6.6 illustrates\
