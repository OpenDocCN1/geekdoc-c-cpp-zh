  \n## 第 17 ：使用 jQuery UI 效果\n\n在本节中你将学习：\n\n![Image](img/image00767.jpeg) 使用 jQuery\
  \ UI 库应用效果的方法\n![Image](img/image00767.jpeg) 缓动（easing）效果如何使动画变化变化\n![Image](img/image00767.jpeg)\
  \ 在隐藏/显示元素时添加酷效果的方法\n![Image](img/image00767.jpeg) 如何在类变化时应用效果\n![Image](img/image00767.jpeg)\
  \ 在重新定位元素时应用动画效果\n\njQuery UI 提供了一系列丰富的动画类型效果，可以应用于你网页上的元素。元素动画是一件好事，有几个原因。其之一是给用户留下网站具有交互性且好用的印象。其二是帮助用户理解你的动态脚本中正在发生的视觉变化。\n\
  \n在本节中，你将看到 jQuery UI 在动画效果方面提供的改进。你可以直接将效果应用到元素，也可以在进行类、可见性或位置更改时应用效果。\n\n### 应用\
  \ jQuery UI 效果\n\n本节的目的是向你介绍 jQuery UI 提供的效果。本节讨论了每种效果以及如何使用 `.each()` 方法应用它们。你还被介绍了了许多缓动函数（easing\
  \ functions），这些函数为效果动画期间应用值的方式提供了多变性特性。\n\n#### 理解 jQuery UI 效果\n\njQuery UI 效果只是对\
  \ CSS 位置、大小和可见性属性的动画。动画变化以这种方式实现，从而为用户提供更好体验的视觉效果。\n\n例如，假设用户尝试用无效密码登录。除了表单验证消息外，你还可以使用\
  \ jQuery UI 效果让登录按钮抖动，这能更好地吸引用户的注意力，让用户知道登录失败。这些是网页的细微变化，但它们对用户体验可能会产生巨大影响。\n\n\
  表 17.1 列出了可以操作它们的效果及其值。这应该让你对 jQuery UI 可能的效果有一个直。。你将在本节稍后实现其中一些效果。\n\n![Image](img/image00953.jpeg)![Image](img/image00954.jpeg)![Image](img/image00955.jpeg)\n\
  \n**表 17.1 jQuery UI 效果**\n\n#### 设置效果动画缓动\n\n缓动函数设置了效果在动画时使用的值路径。你已经在 jQuery 动画中看过了线性（linear）和摆动（swing）缓动。jQuery\
  \ UI 添加了大量新的缓动函数，可以提供有趣的动画效果。\n\n说明缓动如何工作的最简单方法是向你展示在以下位置并在图 17.1 所示图中。将图表的水平轴设为持续时间，左侧为\
  \ 0，右侧为完成。将图表的垂直轴设为效果转换的完成程度。例如，在淡出转换中，底部将完全不透明，而顶部将完全透明：[http://api.jqueryui.com/easings/]\n\
  \n![Image](img/image00956.jpeg)\n\n**图 17.1** jQuery UI 缓动函数。\n\n#### 为 jQuery 对象添加效果\n\
  \n有多种方法可以将效果应用于 jQuery 对象。效果可以作为另一种转换的一部分，例如类变化或可见性变化。你也可以使用 `.effect()` 方法对元素应用效果。`.effect()`\
  \ 方法具有以下语法：\n\n点击此处查看代码图像\n\n```\n.effect( effect [, options ] [, duration ] [,\
  \ complete ] )\n```\n\n在 `.effect()` 方法中，`effect` 是效果名称，`options` 是一个对象。表 17.1 列出了你可以应用于每个效果的效果名称。`duration`\
  \ 的单位是毫秒，你可以添加一个可选的 `complete` 函数，该函数将在效果应用后执行。\n\n以下示例说明了向元素应用 `size` 效果的完整语法：\n\
  \n```\n(\"img\").effect(\"size\", {height:100, width:100}, origin:[\"right\",\"\
  top\"], 3000, function(){alert(\"effect\")})\n```\n\n#### 动手尝试：添加 UI 效果\n\n在这个示例中，你对\
  \ `<img>` 元素应用了多种效果。你在网页上添加图像，并在用户点击图像时应用不同的效果。该示例的目的是让你熟悉如何实现效果、设置 `options` 以及应用\
  \ `complete` 函数。\n\n代码位于代码列表 17.1、17.2 和 17.3。请使用以下步骤创建动态页面：\n\n1. 在 Eclipse 中，创建\
  \ `17`、`17/js` 和 `17/css` 文件夹，然后添加 HTML、JS 和 CSS 文件。\n2. 打开 JS 文件并为 `#img1` 添加 `click`\
  \ 处理程序。`click` 处理程序应用了一个基础抖动效果；首先向下方移动 20 像素，然后抖动 5 次。3000 毫秒意味着效果将持续 3 秒：\n\n```\n\
  $(\"#img1\").click(function(e) {\n  $(this).effect(\"shake\", {direction:\"down\"\
  , distance:20, times:5}, 3000);\n});\n```\n\n3. 为 `#img2` 添加以下 `click` 处理程序。`click`\
