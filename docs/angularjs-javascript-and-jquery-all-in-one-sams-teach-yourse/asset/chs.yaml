  \n## 第 14 ：在 jQuery 中创建高级网页元素\n\n本节你将学习到：\n\n![Image](img/image00767.jpeg) 创建带有滑块控件的图片画廊\n\
  \n![Image](img/image00767.jpeg) 为表格元素添加排序功能\n\n![Image](img/image00767.jpeg) 为表格元素添加过滤功能\n\
  \n![Image](img/image00767.jpeg) 如何创建多类型树视图\n\n![Image](img/image00767.jpeg) 如何实现自定义对话框\n\
  \n![Image](img/image00767.jpeg) 使用基础 HTML 和 jQuery 创建视觉元素\n\n![Image](img/image00767.jpeg)\
  \ 如何使用 jQuery 创建动态趋势线图（sparklines）\n\n在本节中，你将尝试创建一些更高级的页面元素。本节的目的是给你一个机会，将你在书中到为止中学到的所有内容以更高级的方式应用。你在本节中构建的元素包括图片画廊、交互式表格、树视图、覆盖层（overlays）、均衡器和趋势线图。\n\
  \n后续章节将以示例的形式编写，首先解释高级元素中使用的某些概念；然后你将亲手尝试实现它们。你将能够把本节中学到的概念应用于你自己的网页，实现各种类型的高级元素。\n\
  \n### 添加图片画廊\n\n图片画廊是网页中视觉交互性强的组件之一。一图胜于千言。图片允许用户比任何其他类型的视觉元素更快地做出决策。应用图片以让用户做出决策的最佳方法是提供一个交互式画廊。\n\
  \n交互式画廊应该让用户能够快速浏览几张图片，然后轻松选择其中一张进入网页的下一步。因此，必要的组件是图片缩略图和控件。缩略图应该是原始图片的小尺寸版本，允许你一次提供多个选项供选择。控件是你用于在缩略图之间导航的任何工具。\n\
  \n实现图片画廊最有效的方法是创建一个包含缩略图的滑块，并带有箭头，箭头会在缩略图上滑动，直到用户找到并点击了所需的图片为止。滑块是一个很好的选择，因为它们可以以垂直或水平方式实现，以适应网页的设计。\n\
  \n要实现滑块，你需要创建一个具有固定大小且溢出隐藏（hidden overflow）的容器 `div` 元素，然后是一个包含所有缩略图图片的子 `div` 元素。然后可以调整子\
  \ `div` 的位置，以显示滑块中不同的图片集。接下来的章节将描述这一过程。\n\n***\n\n### 尝试一下：添加基于滑块的图片画廊\n\n该练习的目的是提供一些关于如何实现带有滑块控件的图片画廊的思路。示例代码位于列表\
  \ 14.1、14.2 和 14.3 中。\n\n使用以下步骤创建动态网页：\n\n**1.** 在 Eclipse 中创建 `lesson14`、`lesson14/js`、`lesson14/css`\
  \ 和 `lesson14/images` 文件夹，然后添加 `lesson14/image_slider.html`、`lesson14/js/image_slider.js`\
  \ 和 `lesson14/css/image_slider.css` 文件。\n\n**2.** 将列表 14.1 和列表 14.3 所示的代码添加到 HTML\
  \ 和 CSS 文件中。HTML 布局了一组 `div` 元素，它们将包含图片滑块、控制按钮和显示的图片。CSS 代码对图片和 `div` 元素进行样式化。特别地，注意以下几行。这些行定义了具有特定宽度且溢出隐藏的滑动区域、包含所有图片的子\
  \ `div` 区域，以及图片的样式：\n\n```css\nselector {\n  max-width:640px;\n  height:140px;\n\
  \  overflow-x:hidden;\n  overflow-y:hidden;\n  background-color:DDDD;\n}\n#imageSlide\
  \ {\n  position:relative;\n  top:0px;\n  left:0px;\n  height:100px;\n}\n#imageSlide\
  \ img {\n  height:100px;\n  opacity:.7;\n  vertical-align:top;\n  margin:10px;\n\
  \  border:3px grey;\n}\n```\n\n**3.** 打开 `image_slider.js` 文件并添加你将用于实现所有处理器的 `.ready()`\
  \ 函数。\n\n**4.** 为 `#left` 和 `#right` 元素添加以下代码，以添加 `mouseenter` 和 `mouseleave` 事件处理器，提供悬停效果：\n\
  \n```javascript\n$(\"#left\").mouseenter(function(){\n  slide(50);\n});\n$(\"#left\"\
  ).mouseleave(function(){\n  $(\"#imageSlide\").stop(true);\n  return false;\n});\n\
  $(\"#right\").mouseenter(function(){\n  slide(-50);\n});\n$(\"#right\").mouseleave(function(){\n\
  \  $(\"#imageSlide\").stop(true);\n  return false;\n});\n```\n\n**5.** 添加以下代码，为\
  \ `#imageSlide` 元素中的缩略图添加悬停动画。悬停效果会对悬停图片的 `opacity` 和 `size` 进行动画处理，向用户指示该项目是可以点击的以及哪一个被选中。还添加了点击处理器，当用户点击缩略图时，它会设置主图：\n\
  \n```javascript\n$(\"#imageSlide img\").mouseenter(function(){\n  $(this).stop(true).animate({height:120,opacity:1},500);\n\
  \  return false;\n});\n$(\"#imageSlide img\").mouseleave(function(){\n  $(this).stop(true).animate({height:100,opacity:.5},500);\n\
  \  return false;\n});\n$(\"#imageSlide img\").click(setPhoto);\n```\n\n**6.** 添加以下行，调用第一张图片的\
  \ `click()` 处理器以初始化选择主图：\n\n```javascript\n$(\"#imageSlide img:first\").click();\n\
  ```\n\n**7.** 添加以下 `setPhoto()` 点击处理器，用于切换主图。注意代码会将图片淡出然后再淡入。此外，由于图片的宽高比不尽相同，因此使用缩略图的宽高比来决定设置\
