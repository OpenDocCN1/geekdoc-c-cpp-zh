  \ height:20, \"border-size\":1}, 500);\n}\nelse {\n    $(this).children(\"img\"\
  ).animate({opacity:1, height:40, \"border-size\":.5}, 500); \n}\n```\n\n\n\n\nWeb\
  \ 表单最重要的部分之一是对对所输入的信息进行验证。根据输入数据的不同，有许多不同类型和级别的验证。\n\n例如，某些元素是完全可选的，不需要验证。其他元素（如注释）可能是必填的，但内容实际上并不重要。另一些元素（如电子邮件地址或数据）可能是必填的，并且必须符合特定的格式要求，甚至可能范围数值范围。\n\
  \n通常，这是通过服务器端脚本完成的。这种方法的问题是所有数据必须发送到服务器，然后格式化错误并返回给用户。\n\n更好的选项是在表单数据提交到服务器之前，在你的\
  \ `jQuery` 代码中对其进行验证。接下来的章节描述了验证表单数据的不同方法。\n\n## 手动验证 Web 表单\n\n验证表单最基础的方法是访问它们的值，并将实际内容与要求进行比对。这可以在用户输入数据时完成，例如通过添加\
  \ `blur`、`change` 或 `keypress` 事件处理器来完成，然后在事件处理器内部检查数据的值。以下代码在 `keypress` 处理器中实现了验证，用于验证表单元素的值是否为数字，如果不是，则在标签上添加警告文本：\n\
  \n点击此处查看代码图像\n\n```javascript\n$(\"input:text\").keypress(function (){\n    if(!$.isNumeric($(this).val()))\
  \ {\n      $(\"#validLabel\").html(\"Not a Number\"));\n    }\n  });\n```\n\n你也可以通过将验证添加到\
  \ `submit` 处理器中，在用户提交表单时实现验证。例如，以下代码为提交处理器添加了验证函数，因此如果元素不是以文本 `\"vfx\"` 开头，则会显示\
  \ `alert` 且不提交表单：\n\n点击此处查看代码图像\n\n```javascript\n$(\"form\").submit(function (){\n\
  \    if (!$(\"#vfxField\").val().match(\"^vfx\")){\n      alert(\"Invalid vfx element\"\
  );\n      e.preventDefault();\n    }\n  });\n```\n\n## 获取 jQuery Validation 插件\n\
  \n使用上一节节中的技术，你可以验证几乎任何类型的表单元素。问题是添加验证需要大量的代码和时间。与其重造轮子，你可以使用 jQuery validation 插件，它可以处理大多数的验证需求。\n\
  \n作为一个插件，验证器是通过加载 `jQuery.js` 文件后加载 `.js` 文件来实现的。例如：\n\n点击此处查看代码图像\n\n```html\n\
  <script type=\"text/javascript\" src=\"../js/jquery.min.js\"></script>\n<script\
  \ type=\"text/javascript\" src=\"js/jquery.validate.min.js\"></script>\n```\n\n\
  可以从此处下载该插件：\n[`http://jqueryvalidation.org/`](http://jqueryvalidation.org/)\n\n\
  验证插件的文档可以在此处找到：\n[`http://docs.jquery.com/Plugins/Validation/`](http://docs.jquery.com/Plugins/Validation/)\n\
  \n## 使用 HTML 应用简单的 jQuery 验证\n\n可以使用类（class）和标题属性在 HTML 中实现验证器。验证器使用一组规则（如 `required`\
  \ 或 `email`）来验证表单元素。将 `class` 属性设置为这些规则中的一个或多个，当在表单上调用 `.validate()` 时就会应用验证。表 13.3\
  \ 列出了若干条验证规则。\n\n![Image](img/image00924.jpeg)![Image](img/image00925.jpeg)\n\n\
  **表 13.3 验证规则与用法**\n\n例如，要验证文本元素是否有文本并符合电子邮件格式，你可以使用以下代码：\n\nHTML:\n点击此处查看代码图像\n\
  \n```html\n<form id=\"myForm\">\n  <input type=\"text\" class=\"required email\"\
  \ />\n</form>\n```\n\njQuery:\n点击此处查看代码图像\n\n```javascript\n$(document).ready(function(){\n\
  \    $(\"#myForm\").validate();\n  });\n```\n\n`.ready()` 函数将验证添加到表单中，当用户在元素中输入时，如果元素为空，则会显示该元素是必填的消息；如果不包含有效的电子邮件地址，则会显示需要有效的电子邮件地址，如图\
  \ 13.6](#part0026.xhtml_ch13fig06) 所示。\n\n![Image](img/image00926.jpeg)\n\n**图 13.6**\
  \ 电子邮件元素的验证消息。\n\n你也可以添加自己的文本消息，而不是验证库提供的默认消息。这是通过将 `title` 属性设置为你想要的消息字符串来实现的。例如，以下输入语句添加了当元素无效时将显示的\
  \ title 元素：\n\n点击此处查看代码图像\n\n```html\n<input type=\"text\" class=\"required email\"\
  \ title=\"This is required\"/>\n```\n\n## 应用复杂的验证\n\n验证表单的更好方法是使用 `validate` 方法内部的对象。本节涵盖了\
  \ `rules` 和 `messages`。\n\n### 添加规则\n\n`rules` 方法允许你定义元素的规则。表 13.3 列出了若干条验证规则。例如，以下代码为元素添加\
  \ `required` 和 `email` 规则：\n\nHTML:\n点击此处查看代码图像\n\n```html\n<form id=\"myForm\"\
  >\n  <input type=\"text\" class=\"required email\" />\n</form>\n```\n\njQuery:\n\
  点击此处查看代码图像\n\n```javascript\n$(document).ready(function(){\n    $(\"#myForm\").validate({\n\
  \      rules: {\n        emailField: {\n          required: true,\n          email:\
  \ true\n        }\n      },\n      messages: { }\n    });\n  });\n```\n\n### 提示\n\
  `validate()` 方法接受 `debug` 选项，这将禁用表单提交，允许你在不向服务器提交数据的情况下测试表单。要实现表单调试模式，请使用：\n\n```javascript\n\
  $(form).validate({\n  debug: true\n});\n```\n\n### 添加消息\n\n验证对象的 `messages` 属性允许你指定应用于规则的自定义消息。以下代码说明了如何向验证添加消息：\n\
  \n点击此处查看代码图像\n\n```javascript\n$(document).ready(function(){\n  $(\"#simpleForm\"\
  ).validate({\n    rules: {\n      emailField: {\n        required: true,\n     \
  \   email: true,\n        accept: \"jpg|cvs\"\n      }\n    },\n    messages: {\n\
  \      emailField: {\n        required: \"Must add Email\",\n        email: \"Email\
  \ format = me@here.com\"\n      }\n    }\n  });\n});\n```\n\n`.validate()` 方法返回一个\
  \ `Validator` 对象，它提供了许多用于检查表单验证的方法。表 13.4 列出了 `Validator` 对象可用的方法。以下代码说明了如何通过调用\
  \ `.form()` 方法使用 `Validator` 对象来检查表单的有效性：\n\n点击此处查看代码图像\n\n```javascript\n$(document).ready(function(){\n\
  \  var validator = $(\"#simpleForm\").validate(...);\n  if(!validator.form()){ alert(\"\
  Form is not valid\"));\n});\n```\n\n**表 13.4 Validator 对象方法**\n\n当表单元素检测错误时，会在表单上添加一个标签来显示错误消息。插件会向该元素和新的消息标签添加名为\
  \ `error` 的类。这使得为消息和元素设置样式变得非常简单。\n\n\n\n\n要对元素进行样式设置，你可以为元素类型添加一条 CSS 规则并添加 `.error`。例如，为了让错误的\
  \ input 元素文本显示为红色，你可以使用以下 CSS 规则：\n\n```css\ninput.error { color:red; }\n```\n\n\
  你也可以使用相同的方法通过 `label.error` 选择器对显示的错误消息进行样式设置。例如，以下代码将错误消息的字体颜色设置为红色：\n\n```css\n\
  label.error { color:red; }\n```\n\n### 放置验证消息\n\n验证插件会将错误消息直接放置在经过验证的元素之后。这通常不是理想的位置。例如，你可能希望验证信息出现在某些元素之前，或者在完全不同的位置。\n\
  \n***\n\n注意\n\njQuery Validation 工具为 Web 表单验证提供了一种简单的本地化方法。如果你包含了在本地化文件夹中找到 `messages_##.js`\
  \ 文件，验证错误消息将会被本地化。`messages_##.js` 中的两位数字（`##`）代表两个字符的 ISO 国家代码。\n\n***\n\n一个很好的例子是单选框输入组。如果你对该组进行验证，消息将出现在第一个单选框输入元素之后，所示图\
  \ 13.7。这并不是理想的位置。相反，你希望错误消息出现在整组单选框输入及其标签之后。\n\n![Image](img/image00928.jpeg)\n\n\
  **图 13.7** 在 `.validate()` 方法中使用 `errorPlacement` 选项允许你定义错误消息的位置。\n\n这时 `Validation`\
  \ 对象的 `errorPlacement` 属性派上用场了。`errorPlacement` 属性的值是一个函数，该函数被调用以向 Web 表单添加错误元素。`errorPlacement`\
  \ 函数将传递两个参数：第一个参数是代表新错误消息的 jQuery 对象，第二个是代表验证失败元素的 jQuery 对象。使用这些参数，你可以定义自己的函数，将元素放置在任何你想要的地方。\n\
  \n为了说明这一点，请看下面的代码。`errorPlacement` 被设置为一个接收 `error` 和 `element` 参数的函数。通过对 `element`\
  \ 进行测试以检查它是否为单选框。如果 `element` 是单选框输入，则 `error` 将插入到表单中最后一个单选框之后的标签之后，所示图 13.7。如果\
  \ `element` 不是单选框输入，则 `error` 将紧接在 `element` 之后：\n\n点击此处查看代码\n\n```javascript\n\
  $(\"#simpleForm\").validate({\n  rules: {\n    gender: {required:true}\n  }\n  errorPlacement:\
  \ function(error, element){\n    if (element.is(\":radio\")){\n      error.insertAfter($(\"\
  input:radio:last\").next(\"label\"))\n    }\n    else {error.insertAfter(element)}\n\
  \  }\n});\n```\n\n***\n\n### 动手尝试：使用 jQuery 验证 Web 表单\n\n在这个示例中，你使用 jQuery 验证插件来验证基础\
