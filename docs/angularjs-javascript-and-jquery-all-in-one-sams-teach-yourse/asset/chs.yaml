  11        $scope.calcDiff();\n12      };\n13      $scope.dec = function() {\n14\
  \        $scope.current -= $scope.change;\n15        $scope.calcDiff();\n16    \
  \  };\n17      $scope.calcDiff = function() {\n18        $scope.difference = $scope.current\
  \ - $scope.start;\n19      };\n```\n\n6. 代码 列表 22.2 实现了一个 AngularJS 模板，该模板提供了一个数字输入来设置作用域中的\
  \ `change` 值，以及调用 `inc()` 和 `dec()` 来改变 `current` 值的 + 和 – 按钮。模板还使用简单的 AngularJS\
  \ 过滤器显示初始值、当前值和差值。图 22.1 显示了运行中的网页。你可以设置增/减值，然后点击 +/– 按钮来减少当前值并看到作用域中差值的变化。\n\n\
