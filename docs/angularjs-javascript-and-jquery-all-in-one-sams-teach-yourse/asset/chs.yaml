  \ 5px 5px #225588;\n28   opacity:1; }\n```\n\n* * *\n\n### 使用 Sortable 小部件排序元素\n\
  \njQuery UI 提供的酷酷交互之一是 `sortable` 小部件。`sortable` 小部件允许你拖动并重新排列在列表、表格或容器内流动的 HTML\
  \ 元素的顺序。\n\n当你拖动一个项目时，`sortable` 小部件会重新定位其他元素。你还可以将多个 sortable 容器连接起来，这样就可以项目从一个\
  \ sortable 容器拖到另一个中。\n\n表 18.10 描述了更常用的 sortable 选项。以下展示了在元素上挂载 `sortable` 小部件并将\
  \ `tolerance` 指定为 `fit` 的示例：\n\n点击此处查看代码图像\n\n```javascript\n$(\"#ul1\").sortable({tolerance:\"\
  fit\"});\n```\n\n#### 表 18.10 常用 Sortable 小部件选项\n\n注意：使用 `sortable` 排序表格行时，你需要让\
  \ `<tbody>` 可排序，而不是 `<table>`。\n\n`sortable` 小部件还提供了额外的事件，以便可以将处理程序挂载到 sortable\
  \ 元素或其子元素上。表 18.11 列出了你可以在项目上访问的事件。\n\n#### 表 18.11 Sortable 小部件事件\n\n提示：jQuery\
  \ UI 会为正在排序的辅助元素添加 `.ui-sortable-helper` 类。你可以在 CSS 中为辅助元素定义自己的设置，以控制在 `sortable`\
  \ 中移动时的外观。\n\n每个 `sortable` 事件都会传递 `event` 对象以及一个 `ui` 对象，该对象将附带以下值：\n\n- `helper`:\
  \ 代表正在被拖动的辅助对象的 jQuery 对象。\n- `item`: 代表实际排序对象的 jQuery 对象。\n- `offset`: 当前偏移量的 `{top,\
  \ left}` 对象。\n- `originalPosition`: 原始位置的 `{top, left}` 对象。\n- `position`: 当前位置的\
  \ `{top, left}` 对象。\n- `sender`: 从一个 sortable 拖动到另一个时，项目所属的 Sortable 对象。\n\n例如，以下代码将\
  \ `#list1` 连接到 `#list2`，然后添加了 `sortreceived` 事件，该事件将在发送方和接收方上添加 `pulsate` 效果：\n\n\
  ```javascript\n$(\"#list1\").sortable({connectWith:\"#list2\"});\n$(\"#list1\").on(\"\
  sortreceived\", function(e, ui){\n  ui.sender.effect(\"pulsate\");\n  $(this).effect(\"\
  pulsate\"); });\n```\n\n### 动手尝试：实现 Sortable 元素\n\n在这个示例中，你在列表和表格上实现了 `sortable`。有两个连接在一起的列表，你可以从一个列表排序到另一个。该示例的目的是提供使用\
  \ sortable 元素以及处理排序事件的一些实用示例。\n\n该示例的代码位于 列表 18.13、18.14 和 18.15 中。使用以下步骤创建动态网页：\n\
  \n1. 在 Eclipse 中，添加 `lesson18/sortable_elements.html`、`lesson18/js/sortable_elements.js`\
  \ 和 `lesson18/css/sortable_elements.css` 文件。\n2. 将 列表 18.13 和 列表 18.15 所示的代码添加到\
  \ HTML 和 CSS 文件中。注意列表 18.15](#part0032.xhtml_ch18lis15) 的第 13 行，添加了 `.ui-sortable-helper`\
  \ 类以便在排序时样式化元素。\n3. 打开 `sortable_elements.js` 文件并添加 `ready()` 函数。\n4. 添加 列表 18.14\
  \ 所示的带有 `name` 和 `src` 属性的 `images` 数组以及 `buildLists()` 函数来填充 `#sorter1` 和 `#sortTable`。\n\
  5. 添加以下行使 `#sorter1` 可排序并将其连接到 `#sorter2`：\n\n点击此处查看代码图像\n\n```javascript\n$(\"\
  #sorter1\").sortable(\n  {cursor:\"move\", connectWith:\"#sorter2\"});\n```\n6.\
  \ 添加以下代码以实现 `sortable` 并添加 `sortreceive` 事件处理程序。当项目从另一个列表添加到 `#sorter2` 时，该处理程序将在双方上添加\
  \ `pulsate` 效果：\n\n点击此处查看代码图像\n\n```javascript\n$(\"#sorter2\").sortable(\n  {cursor:\"\
  move\", connectWith:\"#sorter1\"});\n$(\"#sorter2\").on(\"sortreceive\", function(e,\
  \ ui){\n  ui.sender.effect(\"pulsate\");\n  $(this).effect(\"pulsate\"); });\n```\n\
  7. 添加以下代码在 `<tbody>` 元素上实现 `sortable`。注意排序 `axis` 被限制在 `y` 方向。此外添加了 `sortupdate`\
