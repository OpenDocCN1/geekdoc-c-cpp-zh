  \ 中的 CSS 添加到 CSS 文件中。\n\n**4.** 打开 `working_event.js` 文件并查看以下将用于处理点击事件的函数。该事件仅接受事件对象\
  \ `e` 作为参数。它依赖事件对象的数据部分来提供应添加文本的元素的 `objId`。它还使用 `e.target.id`、`e.screenX` 和 `e.data.answer`\
  \ 的值作为写入 `<h1>` 元素消息的一部分：\n\n点击此处查看代码图像\n\n```\n01 function clickHandler(e){\n02\
