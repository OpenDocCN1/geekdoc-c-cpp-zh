  \ 指令限制为 `E`。此外注意 `src` 属性被注入到 `scope` 中。`zoomit` 指令的功能位于 `controller` 函数中。创建的 `zInfo`\
  \ 对象包含了 `background-image` 和 `background-position` 属性。`zInfo` 值将用于设置 `zoomit.html`\
  \ 部分模板中缩放字段的 `ng-style` 属性。我们需要完整版本的 jQuery 来获取图像在页面上的 `height`、`width` 和当前 `offset`。然后我们可以根据鼠标点击相对于左侧的百分比\
  \ `posX` 和顶部的百分比 `posY`，并适当设置 `background-position` 样式。\n\n```javascript\nangular.module('myApp',\
  \ [])\n.controller('myController', ['$scope', function($scope) {\n}])\n.directive('zoomit',\
  \ function() {\n  return {\n    restrict: 'E',\n    scope: { src: '@'},\n    controller:\
  \ function($scope) {\n      $scope.zInfo = {\n        \"background-image\": \"url(\"\
  \ + $scope.src + \")\",\n        \"background-position\": \"top right\"\n      };\n\
  \      $scope.imageClick= function(event){\n        event.preventDefault();\n  \
  \      //Using full jQuery to get offset, width and height\n      };\n    }\n  };\n\
  });\n```\n\n\n\n\n\n```javascript\nvar elem = angular.element(event.target);\nvar\
  \ posX = Math.ceil((event.pageX - elem.offset().left) / elem.width() * 100);\nvar\
  \ posY = Math.ceil((event.pageY - elem.offset().top) / elem.height() * 100);\n$scope.pos\
  \ = posX + \"% \" + posY + \"%\";\n$scope.zInfo[\"background-position\"] = posX\
  \ + \"% \" + posY + \"%\";\n};\n},\nlink: function(scope, element, attrs) {\n},\n\
  templateUrl: 'zoomit.html'\n};\n});\n```\n\n### 3. 将 代码列表 29.8 中的代码添加到 `zoomit.html`\
