  # 引言\n\n## 为什么你应该读这本书\n![Image](img/image00767.jpeg) 如何实现丰富的用户界面 (UI) 组件，如可缩放图像和可展开列表\n\
  ![Image](img/image00767.jpeg) 如何构建提供丰富用户交互的动态浏览器视图\n我们决定将 `AngularJS`、`jQuery` 和\
  \ `JavaScript` 放在同一本书中是因为它们都是相互相关的。我们经常被问到诸这样的问题：“我应该用 `AngularJS` 还是 `jQuery`？”或“我应该用\
  \ `JavaScript` 还是 `jQuery`？”。我们认为它们是一个协作良好的技术栈。\n### 什么是 JavaScript?\n\n![Image](img/image00767.jpeg)\
  \ `支持`——Google 在这个项目投入了大量资金，这使其在其他类似计划失败的地方具有优势。\n![Image](img/image00767.jpeg)\
  \ CSS 是格式化网页元素的标准方法。你不仅学习如何编写 CSS 和 CSS3，还学习如何使用 `jQuery` 和 `JavaScript` 动态修改它们。\n\
  ![Image](img/image00767.jpeg) `HTML 代码`——在浏览器中提供网页框架所需的代码。\n\n**问。为什么有 HTML5 和 HTML\
  \ 4，而不是 HTML？我应该用哪一个？**\n\n**答。** 浏览器需要时间来适应新版本 HTML 的标准。许多 HTML5 功能在旧浏览器中无法运行，某些较新的浏览器只支持某些功能而不支持其他功能。这会导致\
  \ HTML 页面出现错误且用户体验非常糟糕。因此，在 HTML5 被所有 Web 浏览器完全支持之前，HTML 4 被作为一个不同的标准保留。你选择哪一个取决于谁将查看你的网页。如果网页是面向互联网上的所有人，那么你需要继续支持\
  \ HTML 4，直到浏览器完全支持 HTML5。如果网页仅供公司内部用户使用，并且你可以要求特定版本的浏览器，那么你可以选择一个完全支持 HTML5 的浏览器及其版本并运行新功能。\n\
  \n**问。既然可以用 JavaScript 动态创建元素，为什么还要费心创建带有元素的 HTML 文档呢？**\n\n**答。** 用于动态网页的最优范式是使用\
  \ HTML 构建基础骨架，使用 CSS 进行样式化，然后使用 `JavaScript` 添加交互。你应该使用带有完整骨架 HTML 文档的原因是，通过 HTML\
  \ 理解和调整网页结构要比在 JavaScript 中容易得多。此外，如果你对网页进行本地化处理，本地化 HTML 文档通常比本地化动态 JavaScript\
  \ 字符串更容易。\n\n### 工作坊\n\n工作坊由一组问答组成，旨在巩固你对本节涵盖内容的理解。在查看答案之前，尝试回答这些问题。\n\n#### 测验\n\
  \n**1。** 使用哪个 HTML 元素属性来更改元素的背景颜色和大小等内容？\n\n**2。** `<noscript>` 元素用于什么？\n\n**3。**\
  \ `<canvas>` 和 `<svg>` 元素之间有什么区别？\n\n**4。** 正确或错误：HTML 页面无法链接到同一页面的某个位置。\n\n**5。**\
  \ 块级（block）元素和行内（inline） HTML 元素之间有什么区别？\n\n#### 测验答案\n\n**1。** `style`。\n\n**2。**\
  \ 如果用户的 Web 浏览器未激活 JavaScript，则 `<noscript>` 允许你在 HTML 页面上显示一条消息。\n\n**3。** `<canvas>`\
  \ 元素以基于像素的图形显示图像，并支持 JPEG 和 PNG 等图像；`<svg>` 支持作为一系列路径的矢量图形，这些路径在缩放时仍保持清晰。\n\n**4。**\
  \ 错误。你可以使用 `<a href=\"#\"` 语法链接到网页上的本地锚点。\n\n**5。** 块级元素占据屏幕的整个宽度，因此其后的元素会流到下方；而多个行内元素可以显示在同一行，因为它们只占据自己所需的空间。\n\
  \n#### 练习\n\n**1.** 扩展 3.5 中的示例以包含一些额外的。\n\n**2.** 使用 3.8 中的示例以包含一些的。\n\n\n\n\n\n\
  接下来的章节将讨论如何使用每个选项来添加样式，以及何时使用它们。\n\n#### 从文件加载 CSS 样式\n\n通常，加载 CSS 样式的最佳方法是从单独的文件加载，这意味着你创建一个带有\
  \ `.css` 扩展的文件，然后将其添加到你的网站中。这具有几个优势：\n\n![Image](img/image00767.jpeg) 你可以将多个 HTML\
  \ 文档链接到同一个 CSS 文件。\n\n![Image](img/image00767.jpeg) 你的 HTML 文件将保持更加整洁，因为没有大量的额外\
  \ CSS 代码干扰它们。\n\n![Image](img/image00767.jpeg) 通过将 CSS 文件更换为另一个，可以轻松地重新设计你的网站皮肤。\n\
  \n要从单独的文件加载 CSS 样式，你需要将 `.css` 文件添加到你的网站中，然后在 HTML 的 `<head>` 元素添加一个 `<link>` 元素。当网页加载时，浏览器会解析\
  \ `<link>` 元素，从 Web 服务器请求 `.css` 文件，并在渲染 HTML 元素时应用样式。\n\n以下是 `<link>` 元素中用法的示例。注意\
  \ `rel` 属性被设置为 `stylesheet`，`type` 设置为 `text/css`，`href` 指向 Web 服务器上 `.css` 文件的位置：\n\
  \n点击此处查看代码图片\n\n```\n<link rel=\"stylesheet\" type=\"text/css\" href=\"css/test.css\"\
  >\n```\n\n#### Header 中添加 CSS 样式\n\n你也可以使用`<style>` 标签直接在网页的`<head>` 元素中添加 CSS 样式。`<style>`\
  \ 标签内部的所有文本将被视为 CSS，被读入浏览器，并在渲染元素时应用到它们。\n\n在头部中应用 CSS 样式确实具有某些优势，包括以下：\n\n![Image](img/image00767.jpeg)\
  \ 可以很容易地将它们应用到头部以测试网页，而无需管理额外的 `.css` 文件。\n\n![Image](img/image00767.jpeg) 你可以使用特定应用于该页面的样式来覆盖从\
  \ `.css` 文件加载的全局样式。\n\n以下是一个包含 CSS 的`<style>` 元素的 `<head>` 元素示例。注意 `type` 属性被设置为\
  \ `text/css`；这并不是必需的，但在浏览器支持其他样式类型的时代，这是一种良好的做法：\n\n点击此处查看代码图片\n\n```html\n<<html>\n\
  \  <head>\n    <meta charset=\"UTF-8\">\n    <style type=\"text/css\">\n      p{\n\
  \        background-color:#C0C0C0;\n        padding: 3px;\n      }\n      span{\n\
  \        font-weight:bold;\n      }\n    </style>\n  </head>\n...\n```\n\n#### 在\
  \ HTML Body 中使用 CSS 样式\n\n你也可以使用`<script>` 标签直接在 HTML `<body>` 元素内部添加 CSS 样式设置。这不是一个良好的做法，因为这可能会导致网页样式非常难以更改和修复。你应该将对这种方法的使用限制在为了测试目的而快速添加样式的时候。测试后，你应该始终将它们移动到\
  \ `<head>` 或单独的文件中。\n\n#### 在 HTML 元素中定义 CSS 样式\n\nHTML 元素提供了 `style` 属性，允许你直接在\
  \ HTML 语句中设置 CSS 样式。这提供了优势，但也有一个巨大的缺点。\n\n优势是你可以覆盖全局应用于网站或网页的 CSS 样式。这使得在不需要在其他位置包含特殊规则的情况下，自定义特定元素的视觉效果和感受成为可能。\n\
  \n缺点是，如果你经常这样做，那么当你决定使用不同的网页设计或品牌标识时，更新网站的样式将变得非常困难。\n\n下一行代码显示了在 `<span>` 元素内部直接添加\
  \ CSS `style` 的示例：\n\n点击此处查看代码图片\n\n```html\n<span style=\"background-color:blue;\
  \ color:white font-weight:bold\">Styled Text</span>\n```\n\n#### 为 HTML 元素添加 CSS\
  \ 样式\n\n你已经在本书之前的之前的示例中见过了一些应用 CSS 的简短示例。现在是时候向你介绍你可以通过 CSS 应用到 HTML 元素的语法和属性了。这一部分绝不是详尽的；然而，它将让你了解通过\
  \ CSS 对 HTML 元素可以做什么。\n\n当你阅读并尝试示例时，请记住你将通过 AngularJS、jQuery 和 JavaScript 访问 CSS\
  \ 属性，因此可以在用户与网页交互时动态地设置它们。\n\n#### 理解基础 CSS 语法\n\nCSS 由一组一个或多个规则组成，这些规则定义了 浏览器在渲染\
  \ HTML 元素时使用的属性值。每个规则都由一个选择器开头，选择器定义了将样式应用于哪些 HTML 元素。然后在 `{}` 括号内部是特定的属性设置。属性值使用\
  \ `property:value` 语法设置。每个属性设置之间用分号分隔。\n\n下面的列表显示了一个简单 CSS 规则的示例，它设置了 `<p>` 元素的字体样式、背景颜色和宽度：\n\
  \n```css\np {\n  font-style:italic;\n  background-color:#DDDDDD;\n  width:250px;\n\
  }\n```\n\n你应该为每个元素使用单独的一行，以使文件更可读、更整洁。只要它们在 `{}` 括号内，你可以将多个元素组合在同一行。例如：\n\n点击此处查看代码图片\n\
  \n```css\np { font-style:italic; background-color:#DDDDDD; width:250px; }\n```\n\
  \n***\n\n#### 注意事项\n\n多个 CSS 属性支持为单个属性设置多个值。这有助于让你的 CSS 文件更加简洁，同时保持可读性。例如，以下单个 CSS\
  \ 属性设置将字体设置为**加粗**、*斜体*、`12` 像素和 Times Roman。多个设置之间用空格分隔。指定了两种字体，Times Roman 和 serif，所以如果浏览器找不到第一个，它将使用第二个。注意由于\
  \ `Times Roman` 包含空格，它必须封装在引号中：\n\n```css\nfont:italic bold 12px \"Times Roman\"\
  ,serif;\n```\n\n***\n\n\n\n\n\nHTML 元素样式化中最重要的部分之一是 CSS 选择器。CSS 选择器用于定义 CSS 规则适用于哪些\
  \ HTML 元素。CSS 选择器初看起来可能有些令人生畏；然而，当你通过一些示例理解了基本概念后，其语法就会迎刃而解。\n\n接下来的系列示例将帮助你理解选择器。\n\
  \n要对所有 `<div>` 元素应用 CSS 规则，请使用以下代码（通过标签名引用 HTML 元素）：\n\n```css\ndiv {...}\n```\n\
  \n要对 `id` 属性等于 `myDiv` 的特定 HTML 元素应用 CSS 规则，请使用以下代码（在 CSS 中，`id` 属性使用 `#` 指定）：\n\
  \n```css\n#myDiv {...}\n```\n\n要对所有 `class` 属性等于 `container` 的 HTML 元素应用 CSS 规则，请使用以下代码（在\
  \ CSS 中，`class` 属性使用 `.` 指定）：\n\n```css\n.container {...}\n```\n\n要在鼠标悬停在 `<span>`\
  \ 元素上应用应用 规则，请使用以下代码（在 CSS 中，状态通过 `:state` 指定）：\n\n```css\nspan:hover {...}\n```\n\
  \n要对 `target` 属性设置为 `_blank` 的 `<a>` 元素应用 CSS 规则，请使用以下代码（在 CSS 中，属性通过 `[]` 括号指定）：\n\
  \n```css\na[target=_blank]\n```\n\n你还可以使用逗号将多个选择器链在一起。例如，对所有 `<div>`、`<span>`、`<p>`\
  \ 以及 `class=\"menu\"` 的元素应用 CSS 规则，你可以使用以下代码：\n\n```css\ndiv, span, p, .menu {...}\n\
  ```\n\n还要记住 CSS 代表层叠样式表（Cascading Style Sheets）。你可能会有不同的选择器应用于多个重叠的对象组。例如，考虑以下选择器。第一个适用于所有\
  \ `<div>` 元素，第二个仅适用于“`menu`”类元素——其中一些是 `<div>` 元素——而最后一个仅适用于当前处于鼠标光标下的“`menu`”类元素。`.menu`\
  \ 和 `.menu:hover` 规则中的属性设置将覆盖 `div` 规则中进行的设置：\n\n```css\ndiv {...}\n.menu {...}\n\
  .menu:hover{...}\n```\n\n表 4.1 提供了几种类型选择器的列表；它展示了一个示例并描述了选择器如何工作。你可以使用选择器实现比上述示例以及表\
  \ 4.1 中更丰富的功能，但这些应该让你对我们在书中后续练习中如何使用选择器有一个了解。\n\n![Image](img/image00825.jpeg)![Image](img/image00826.jpeg)\n\
  \n**表 4.1 常用 CSS 选择器列表**\n\n### 使用 CSS 设计属性\n\n大多数 CSS 属性都旨在更改 HTML 项目的外观。遗憾的是，默认的\
  \ HTML 元素看起来非常单调。然而，通过添加颜色、边框、背景、图像和其他设计属性，你只需要少量的 CSS 代码就能显著改变 HTML 元素的外观。\n\n\
  以下章节涵盖了改变 HTML 组件外观的 CSS 属性。\n\n#### CSS 颜色\n\n通过 CSS 应用的最频繁设置之一是颜色（color）属性。大多数元素都有颜色属性，用于定义浏览器渲染它们时使用的颜色——例如表格边框、列表项目符号或段落中的文本字符。\n\
  \n你可以使用几种方法设置精确的颜色，以支持定义颜色者的不同背景和情况。颜色值可以通过以下方法之一指定：\n\n![Image](img/image00767.jpeg)\
  \ **名称 (Name)**——CSS 颜色名称，如 `red`、`blue`、`green` 或 `yellow`。有 147 个预定义的颜色名称，如 `aqua`、`crimson`\
  \ 和 `silver`。你可以在 [www.w3.org/TR/css3-color/#svg-color](http://www.w3.org/TR/css3-color/#svg-color)\
  \ 找到颜色列表。\n\n![Image](img/image00767.jpeg) **十六进制 (Hex)**——你可以指定一个十六进制数表示颜色中的红色、绿色和蓝色量。语法为\
  \ `#RRGGBB`。值 `00` 表示不包含该颜色，值 `FF` 表示包含该颜色。例如，红色为 `#FF0000`，绿色为 `#00FF00`，青绿色为 `#00FFFF`。\n\
  \n![Image](img/image00767.jpeg) **RGB**——与十六进制类似，不同之处你可以指定 0 到 255 之间的值。例如，青绿色为\
  \ `rgb(0, 255, 255)`。\n\n![Image](img/image00767.jpeg) **RGBA**——与 RGB 相同；但你还可以指定一个控制透明度的\
  \ alpha 参数，其中 `0.0` 为完全透明，`1.0` 为不透明（不）。例如：`rgba(0, 255, 255, 0.5)` 是 50% 透明的青绿色。\n\
  \n![Image](img/image00767.jpeg) **HSL**——允许你根据色相/饱和度/亮度（Hue/Saturation/Lightness）色彩方案指定颜色。例如，色相为\
  \ `100`、饱和度为 `45%`、亮度为 `75%` 的颜色为 `hsl(100, 45%, 75%)`。\n\n![Image](img/image00767.jpeg)\
  \ **HSLA**——与 HSL 相同；但你还可以指定一个控制透明度的 alpha 参数，其中 `0.0` 为完全透明，`1.0` 为不透明。\n\n\n\n\
  \n\n![Image](img/image00767.jpeg) `line-height`—允许你控制行之间的间距。你可以指定一个数值（该数值将乘以文本高度）、一个使用带有\
  \ `em`/`px`/`pt`/`cm` 后缀的数值大小，或者使用 `%` 表示行高的百分比。[图 4.5 显示了使用以下 CSS 设置将行间距收紧到只有正常高度的\
  \ 50% 的示例：\n\n```css\n#half-height{line-height:50%}\n```\n\n![Image](img/image00830.jpeg)\n\
  \n**图 4.5** 将行高更改为 50% 使文本行变得紧凑。\n\n![Image](img/image00767.jpeg) `text-decoration`—允许你使用\
  \ `overline`、`underline` 或 `line-through` 值在文本下方、上方或穿过文本添加一条线。你也可以指定 `blink` 为值，使文本在浏览器中闪烁。以下几行\
  \ CSS 会使元素渲染出下划线和删除线，如图 4.6 所示：\n\n点击此处查看代码图片\n\n```css\n#underline{text-decoration:underline;}\n\
  #strike-through{text-decoration:line-through;}\n```\n\n![Image](img/image00831.jpeg)\n\
  \n**图 4.6** 将文本更改为下划线或删除线。\n\n![Image](img/image00767.jpeg) `text-indent`—允许你通过特定值（如\
  \ 20px）或元素宽度的百分比（如 20%）来指定文本第一行的缩进量。\n\n![Image](img/image00767.jpeg) `text-transform`—允许你使用\
  \ `capitalize` 将每个单词的首字母大写、使用 `uppercase` 将文本全部大写或使用 `lowercase` 去除所有大写字母来更改文本的大小写。\n\
  \n![Image](img/image00767.jpeg) `text-overflow`—允许你定义当文本宽元素允许的大小时发生的情况。选项有 `clip`（直接截断文本）、`ellipsis`（添加代表截断文本的\
  \ `...`）或一个用于替换被截断文本的字符串。例如，以下 CSS 代码会在文本过长时对其进行截断并在末尾附加字符串“`(more)`”：\n\n点击此处查看代码图片\n\
