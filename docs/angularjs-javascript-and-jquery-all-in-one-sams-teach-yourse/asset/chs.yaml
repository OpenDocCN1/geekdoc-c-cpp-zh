  \ width:100px;}\n08   </style>\n09 </head>\n10 <body>\n11   <div ng-controller=\"\
  myController\">\n12       <h2>Data Binding Directives</h2>\n13       <label ng-repeat=\"\
  color in colors\">\n14         {{color}}\n15        <input type=\"radio\" ng-model=\"\
  myStyle['background-color']\"\n16                   ng-value=\"color\" id=\"{{color}}\"\
  \ name=\"mColor\">\n17        </label>\n18        <span class=\"rect\" ng-style=\"\
  myStyle\"></span><hr>\n19        <li ng-repeat=\"day in days\">\n20           <span\
  \ ng-class-even=\"'even'\">{{day}}</span>\n21        </li><hr>\n22        显示消息：<input\
  \ type=\"checkbox\" ng-model=\"checked\" />\n23        <p ng-if=\"checked\" ng-bind=\"\
  msg\"> </p>\n24   </div>\n25  <script src=\"http://code.angularjs.org/1.3.8/angular.min.js\"\
  ></script>\n26  <script src=\"js/directive_bind.js\"></script>\n27 </body>\n28 </html>\n\
  ```\n\n* * *\n\n### 将页面事件绑定到控制器的指令\n\nAngularJS 模板允许你将浏览器事件绑定到控制器代码。这意味着你可以从作用域（scope）的角度处理用户输入。然后你可以直接为适当的作用域实现浏览器事件的句程序。`event`\
  \ 指令的工作方式与普通的浏览器事件处理程序非常相似，只是它们直接链接到作用域上下文。\n\n表 24.4 列出了将页面和设备事件绑定到 AngularJS 模型的指令。这些指令中的每一个都允许你指定一个表达式，该表达式通常是定义在作用域中的函数，正如第\
  \ 23 节“使用 AngularJS 模板创建视图”中所的。例如，以下是作用域中一个名为 `setTitle` 的函数：\n\n```javascript\n\
  $scope.setTitle = function(title){\n  $scope.title = title;\n};\n```\n\n![Image](img/image01024.jpeg)\n\
  \n**表 24.4 将页面/设备事件绑定到 AngularJS 功能的指令**\n\n你可以使用以下 `ng-click` 指令将作用域中的 `setTitle()`\
  \ 函数直接绑定到视图中的输入按钮：\n\n```html\n<input type=\"button\" ng-click=\"setTitle('New Title')\"\
  >\n```\n\n你可以使用 `$event` 关键字将 JavaScript `Event` 对象传递到事件表达式中。这允许你访问事件信息，并停止传播以及对\
  \ JavaScript `Event` 对象可以做的任何其他操作。例如，以下 `ng-click` 指令将鼠标事件传递给 `myClick()` 处理程序：\n\
  \n```html\n<input type=\"button\" ng-click=\"myClick($event)\">\n```\n\n后续章节提供了一些使用\
  \ AngularJS 事件与来自浏览器的事件交互的示例。\n\n* * *\n\n尝试尝试：使用聚焦（Focus）和失焦（Blur）\n\nAngularJS\
  \ 的 `ngBlur` 和 `ngFocus` 指令对于跟踪表单元素进入失去焦点非常有用。例如，当特定的输入元素进入或失去焦点时，你可能希望在控制器中执行某些代码——例如，在更新模型之前操作输入。\n\
  \n使用以下步骤构建利用 `ngBlur` 和 `ngFocus` 与元素交互的应用程序：\n\n1. 添加 `24/directive_focus_events.html`\
  \ 和 `24/js/directive_focus_events.js`。\n2. 将代码列表 24.9 和 24.10 添加到 HTML 和 JavaScript\
  \ 文件。\n3. 代码列表 24.9 实现了一个基础控制器。以下行在作用域中定义了一个名为 `inputData` 的对象，它将包含页面元素的值和状态：\n\n\
  ```javascript\n$scope.inputData = { \n  input1: {value: \"\", state: \"\"},\n  input2:\
  \ {value: \"\", state: \"\"} \n};\n```\n\n4. 以下行定义了 `focusGained()` 函数，该函数会在输入进入焦点时调用，并使用\
  \ `input` 参数将 `inputData` 中的该输入值设置为空字符串：\n\n```javascript\n$scope.focusGained =\
  \ function(input){\n  $scope.inputData[input]['value'] = '';\n  $scope.inputData[input]['state']\
  \ = 'Focus Gained';\n};\n```\n\n5. 以下行定义了 `focusLost()` 函数，它将接受 `event` 和 `input`\
  \ 作为输入，并使用 `event` 对象获取 `target`元素的值并更新 `inputData` 中对应的属性：\n\n```javascript\n$scope.focusLost\
  \ = function(event, input){\n  var element = angular.element(event.target);\n  var\
  \ value = element.val();\n  $scope.inputData[input]['value'] = value.toUpperCase();\n\
  \  $scope.inputData[input]['state'] = \"Focus Lost\";\n};\n```\n\n6. 代码列表 24.10\
  \ 实现两个 `<input>` 元素，并将 `focusGained()` 和 `focusLost()` 处理程序分配给 `ng-focus` 和 `ng-blur`\
  \ 属性：\n\n```html\n<input type=\"text\" ng-blur=\"focusLost($event, 'input1')\" ng-focus=\"\
  focusGained('input1')\">\n<br>\n<input type=\"text\" ng-blur=\"focusLost($event,\
  \ 'input2')\" ng-focus=\"focusGained('input2')\">\n```\n\n7. 在浏览器中打开 `directive_focus_events.html`\
  \ 文件。图 24.4 显示了基础示例的操作。注意，当你点击输入元素时，存储在 `inputData` 中的值会被设置为空字符串，而当你离开输入元素时，值将被更新。\n\
  \n\n\n\n\n```javascript\n$scope.inputData = { input1: {value: \"\", state: \"\"\
  }, input2: {value: \"\", state: \"\"} };\n$scope.focusGained = function(input){\n\
  \  $scope.inputData[input]['value'] = '';\n  $scope.inputData[input]['state'] =\
  \ 'Focus Gained';\n};\n$scope.focusLost = function(event, input){\n  var element\
  \ = angular.element(event.target);\n  var value = element.val();\n  $scope.inputData[input]['value']\
  \ = value.toUpperCase();\n  $scope.inputData[input]['state'] = \"Focus Lost\";\n\
  };\n```\n\n### 列表 24.10 directive_focus_events.html 一个实现了 ngFocus 和 ngBlur 指令的 AngularJS\
  \ 模板\n\n点击此处查看代码图片\n\n```html\n<!doctype html>\n<html ng-app=\"myApp\">\n<head>\n\
  \  <title>AngularJS Focus Event Directives</title>\n</head>\n<body>\n  <div ng-controller=\"\
  myController\">\n    <h2>Focus Event Directives</h2>\n    Input 1:<br>\n    <input\
  \ type=\"text\"\n      ng-blur=\"focusLost($event, 'input1')\"\n      ng-focus=\"\
  focusGained('input1')\"><br>\n    Input 2:<br>\n    <input type=\"text\"\n     \
  \ ng-blur=\"focusLost($event, 'input2')\"\n      ng-focus=\"focusGained('input2')\"\
  ><hr>\n    Input Data: {{inputData|json}}<br/>\n  </div>\n  <script src=\"http://code.angularjs.org/1.3.8/angular.min.js\"\
  ></script>\n  <script src=\"js/directive_focus_events.js\"></script>\n</body>\n\
  </html>\n```\n\n### 动手实练：在 AngularJS 中处理键盘事件\n\n你将最常用的键盘事件指令是 `ngkeydown` 和 `keyup`，它们分别在按键按下和释放时触发。键盘事件对于与用户在键盘上打字时进行紧密交互非常有用。最常见的键盘交互可能是用户按下键盘上的\
  \ Enter 键时执行某些操作。`Listing 24.11` 和 `24.12` 中的代码演示了 `ngkeydown` 和 `keyup` 指令的用法。\n\
  \n使用以下步骤构建利用 `ngkeydown` 和 `keyup` 指令与元素交互的应用程序：\n\n1. 添加 `lesson24/directive_keyboard_events.html`\
  \ 和 `lesson24/js/directive_keyboard_events.js`。\n2. 将 `Listing 24.11` 和 `Listing\
  \ 24.12` 所示的代码添加到 HTML 和 JavaScript 文件中。\n3. `Listing 24.11` 中的代码实现了一个控制器，该控制器为键按下和键释放事件提供了模型和键盘处理器。`storedString`\
  \ 变量用于在用户在输入框打字时按下 Enter 存储文本输入的值。`keyInfo` 变量存储上一次按键的 `keyCode`，而 `keyrokes` 数组记录了按键的之前的\
  \ `keyCodes`。\n4. `Listing 24.11` 中的以下几行代码实现了 `keyPressed()` 函数。当输入字段中按键时，将调用此函数。注意，我们检查\
  \ `keyCode` 是否为 13（意味着按了 Enter），如果是，我们记录 `storedString` 并重置其他变量。如果按键不是 Enter 键，我们存储\
  \ `keyCode`，将其添加到 `keyrokes` 数组并设置 `keyState`。\n5. `Listing 24.12` 中的以下几行代码将 `ngkeydown`\
  \ 和 `keyup` 指令分配给 `<input>` 元素。当 `ngkeydown` 触发时，更新作用域中的 `keyState` 变量；当 `keyup`\
  \ 触发时，则调用 `keyPressed()` 处理程序。\n6. 在浏览器中打开 `directive_keyboard_events.html` 文件并尝试在文本框中打字。`Figure\
  \ 24.5` 显示了运行中的 AngularJS 网页。注意，你在文本输入中输入每个字符时，模型中 `keyPressed` 的值都会更新，当按下 Enter\
  \ 键时，单词被存储并重置按键记录。\n\n![Image](img/image01026.jpeg)\n\n**图 24.5 在 AngularJS 模板视图中实现键盘事件指令。**\n\
  \n### 列表 24.11 directive_keyboard_events.js 实现一个带有作用域数据和事件处理器的控制器，以支持来自视图的键按下和释放事件\n\
  \n点击此处查看代码图片\n\n```javascript\nangular.module('myApp', []).\n  controller('myController',\
  \ function($scope) {\n    $scope.storedString = '';\n    $scope.keyInfo = {};\n\
  \    $scope.keyrokes = [];\n    $scope.keyState = 'Not Pressed';\n    $scope.keyPressed\
  \ = function(event){\n      if (event.keyCode == 13){\n        var element = angular.element(event.target);\n\
  \        $scope.storedString = element.val();\n        element.val('');\n      \
  \  $scope.keyInfo.keyCode = event.keyCode;\n        $scope.keyrokes = [];\n    \
  \    $scope.keyState = 'Enter Pressed';\n      } else {\n        $scope.keyInfo.keyCode\
  \ = event.keyCode;\n        $scope.keyrokes.push(event.keyCode);\n        $scope.keyState\
  \ = 'Not Pressed';\n      }\n    });\n```\n\n### 列表 24.12 directive_keyboard_events.html\
  \ 一个实现了 ngkeydown 和 ngup 指令的 AngularJS 模板\n\n```html\n<!doctype html>\n<html ng-app=\"\
  myApp\">\n<head>\n  <title>AngularJS Focus Event Directives</title>\n</head>\n<body>\n\
  \  <div ng-controller=\"myController\">\n    <h2>Focus Event Directives</h2>\n \
  \   <input type=\"text\"\n      ngkeydown=\"keyState='Pressed'\"\n      keyup=\"\
  keyPressed($event)\"><br>\n    Key State: {{keyState}}<br>\n    Last Key: {{keyInfo|json}}<br>\n\
  \    Stored String: {{storedString}}<br>\n    Recorded Key: {{keyrokes}}\n  </div>\n\
  \  <script src=\"http://code.angularjs.org/1.3.8/angular.min.js\"></script>\n  <script\
  \ src=\"js/directive_focus_events.js\"></script>\n</body>\n</html>\n```\n\n###AngularJS\
  \ 提供了多种鼠标事件指令，允许你轻松地增强应用程序的鼠标交互。你将最常用的鼠标事件指令是点击鼠标时的 `ngclick`。然而，你还有许多其他鼠标事件可以方便地创建丰富的组件。`Listing\
  \ 24.13` 和 `24.14` 中的代码演示了 `ngclick`、`mouseenter`、`mouseleave`、`mousedown`、`mouseup`\
  \ 和 `mousemove` 指令的用法。\n\n使用以下步骤构建利用 `ngkeydown` 和 `keyup` 指令与元素交互的应用程序：\n\n1. 添加\
  \ `lesson24/directive_mouse_events.html` 和 `lesson24/js/directive_mouse_events.js`。\n\
  2. 将 `Listing 24.13` 和 `Listing 24.14` 所示的代码添加到 HTML 和 JavaScript 文件中。\n3. `Listing\
  \ 24.13` 中的代码实现了一个控制器，将当前鼠标位置信息存储在 `mouseInfo` 中，并将最后点击的位置信息存储在 `lastClickinfo`\
  \ 中。\n4. `Listing 24.13` 中的以下几行代码定义了 `mouseClick()` 事件处理程序。注意，事件信息被传递到处理器并允许我们在\
  \ `lastClickInfo` 中设置 `clientX`、`clientY`、`screenX` 和 `screenY` 信息：\n\n```javascript\n\
  $scope.mouseClick = function(event){\n  $scope.lastClickInfo.clientX = event.clientX;\n\
  \  $scope.lastClickInfo.clientY = event.clientY;\n};\n```\n\n\n\n\n\n```javascript\n\
  $scope.lastClickInfo.screenX = event.screenX;\n$scope.lastClickInfo.screenY = event.screenY;\n\
  ```\n\n### 5. 列表 24.13 中的以下代码行定义了 `mouseMove()` 事件处理程序。注意，事件信息被传递到处理器中，并允许我们在 `mouseInfo`\
  \ 中设置 `clientX`、`clientY`、`screenX` 和 `screenY` 信息：\n\n点击此处查看代码图片\n\n```javascript\n\
  $scope.mouseMove = function(event){\n  $scope.mouseInfo.clientX = event.clientX;\n\
  \  $scope.mouseInfo.clientY = event.clientY;\n  $scope.mouseInfo.screenX = event.screenX;\n\
  \  $scope.mouseInfo.screenY = event.screenY;\n};\n```\n\n### 6. 列表 24.14 中的以下代码将\
  \ `ng-mouseenter`、`ng-mouseleave`、`ng-mouseclick`、`ng-mousedown` 和 `ng-mouseup`\
  \ 指令应用到 `<<img>>` 元素，并在事件触发时设置作用域中 `mouseState` 的值。还将 `ng-click` 和 `ng-mousemove`\
  \ 事件绑定到作用域中的 `mouseClick($event)` 和 `mouseMove($event)`。注意 `$event` 用于将浏览器的鼠标事件传递给处理器：\n\
  \n点击此处查看代码图片\n\n```html\n<img\n  src=\"/images/img3.jpg\"\n  ng-mouseenter=\"mouseState='Entered'\"\
  \n  ng-mouseleave=\"mouseState='Left'\"\n  ng-mouseclick=\"mouseState='Clicked'\"\
  \n  ng-mousedown=\"mouseState='Down'\"\n  ng-mouseup=\"mouseState='Up'\"\n  ng-click=\"\
  mouseClick($event)\"\n  ng-mousemove=\"mouseMove($event)\">\n```\n\n### 7. 在浏览器中打开\
  \ `directive_mouse_events.html` 文件，并尝试移动鼠标悬停并点击图片。图 24.6 展示了 AngularJS 的工作。注意当你进入、离开和点击图片时，鼠标状态会发生变化。同时注意，当你移动悬停和点击图片时，位置信息也会相应更新。\n\
  \n![Image](img/image0127.jpeg)\n**图 24.6 在 AngularJS 视图中实现点击和移动事件指令。**\n\n#### 列表\
  \ 24.13 directive_mouse_events.js 实现带有作用域和处理器的控制器，以支持来自视图的点击和移动\n\n点击此处查看代码图片\n\n\
  ```javascript\nangular.module('myApp', [])\n  controller('myController', function($scope)\
  \ {\n    $scope.mouseInfo = {};\n    $scope.lastClickInfo = {};\n    $scope.mouseClick\
  \ = function(event){\n      $scope.lastClickInfo.clientX = event.clientX;\n    \
  \  $scope.lastClickInfo.clientY = event.clientY;\n      $scope.lastClickInfo.screenX\
  \ = event.screenX;\n      $scope.lastClickInfo.screenY = event.screenY;\n    };\n\
  \    $scope.mouseMove = function(event){\n      $scope.mouseInfo.clientX = event.clientX;\n\
  \      $scope.mouseInfo.clientY = event.clientY;\n      $scope.mouseInfo.screenX\
  \ = event.screenX;\n      $scope.mouseInfo.screenY = event.screenY;\n    };\n  });\n\
  ```\n\n#### 列表 24.14 directive_mouse_events.html 实现 ngClick 以及其他点击与移动指令的 AngularJS\
  \ 模板\n\n点击此处查看代码图片\n\n```html\n<!doctype html>\n<html ng-app=\"myApp\">\n<head>\n\
  \  <title>AngularJS Event Directives</title>\n  <style>\n    img {\n      border:\
  \ 3px ridge black;\n      height: 200px; width: 200px;\n      display: inline-block;\n\
  \    }\n  </style>\n</head>\n<body>\n  <div ng-controller=\"myController\">\n  \
  \  <h2>Event Directives</h2>\n    <img\n      src=\"/images/img3.jpg\"\n      ng-mouseenter=\"\
  mouseState='Entered'\"\n      ng-mouseleave=\"mouseState='Left'\"\n      ng-mouseclick=\"\
  mouseState='Clicked'\"\n      ng-mousedown=\"mouseState='Down'\"\n      ng-mouseup=\"\
  mouseState='Up'\"\n      ng-click=\"mouseClick($event)\"\n      ng-mousemove=\"\
  mouseMove($event)\">\n    <hr>\n    Mouse State: {{mouseState}}<br/>\n    Mouse\
  \ Position Info: {{mouseInfo|json}}<br/>\n    Last Click Info: {{lastClickInfo|json}}<br/>\n\
  \  </div>\n  <script src=\"angular.js\"></script>\n  <script src=\"directive_mouse_events.js\"\
  ></script>\n</body>\n</html>\n```\n\n\n\n\n\n本节讨论了自定义指令（custom directives）的设计与实现。你还将看到一些扩展\
  \ HTML 能力的自定义指令的基础示例。\n\n### 理解自定义指令的定义\n\n你通过在 `Module` 对象上调用 `directive()` 方法来实现自定义指令。`directive()`\
  \ 方法的第一个参数是指令的名称，第二个参数是一个提供者函数，该函数返回一个包含构建指令对象所需的必要说明的对象。例如，以下是一个指令的基本定义：\n\n点击此处查看代码图片\n\
  \n```javascript\nangular.module('myApp', []).\n  directive('myDirective', function()\
  \ {\n    return {\n      template: 'Name: {{name}} Score: {{score}}'\n    };\n \
  \ });\n```\n\n表 25.1 列出了你可以应用于指令定义所返回的对象的属性列表，在前面的代码中返回了 `template` 属性。![Image](img/image01028.jpeg)![Image](img/image01029.jpeg)![Image](img/image01030.jpeg)\n\
  \n**表 25.1 定义 AngularJS 指令功能的指令定义属性**\n\n后续章节将更详细地讨论指令选项。\n\n#### 定义指令的视图模板\n\n\
  你可以包含 AngularJS 模板代码来构建显示在包含指令的 HTML 元素中的视图组件。你可以通过直接使用 `template` 属性来添加模板代码，如下例所示：\n\
  \n点击此处查看代码图片\n\n```javascript\ndirective('myDirective', function() {\n  return {\n\
  \    template: 'Name: {{name}} Score: {{score}}'\n  };\n});\n```\n\n你可以在自定义模板中指定一个根元素——但只能有一个元素。该元素将作为\
  \ AngularJS 模板中定义的任何子元素的根元素。此外，如果你使用了 `transclude` 标记，则该元素应该包含 `ngTransclude`。例如：\n\
  \n点击此处查看代码图片\n\n```javascript\ndirective('myDirective', function() {\n  return {\n\
  \    transclude: true,\n    template: '<div ng-transclude></div>'\n  };\n});\n```\n\
  \n你还可以使用 `templateUrl` 属性来指定位于 Web 服务器上的 AngularJS 模板的 URL，如下例所示：\n\n点击此处查看代码图片\n\
  \n```javascript\ndirective('myDirective', function() {\n  return {\n    templateUrl:\
  \ '/myDirective.html'\n  };\n});\n```\n\n模板 URL 可以包含任何标准的 AngularJS 模板代码。因此，你可以根据需要让指令变得简单或复杂。\n\
  \n#### 限制指令行为\n\n你可以将指令作为 HTML 元素、属性或两者两者应用。`restrict` 属性允许你限制自定义指令的应用方式。`restrict`\
  \ 属性可以设置为以下值：\n\n![Image](img/image00767.jpeg) **A:** 作为属性名应用。例如：\n\n`<my-directive></my-directive>`\n\
  \n![Image](img/image00767.jpeg) **E:** 作为元素名应用。例如：\n\n点击此处查看代码图片\n\n`<div my-directive=\"\
  expression\"></div>`\n\n![Image](img/image00767.jpeg) **C:** 作为类应用。例如：\n\n点击此处查看代码图片\n\
  \n`<div class=\"my-directive: expression;\"></div>`\n\n![Image](img/image00767.jpeg)\
  \ **M:** 作为注释应用。例如：\n\n点击此处查看代码图片\n\n`<!-- directive: my-directive expression -->`\n\
  \n![Image](img/image00767.jpeg) **AEC:** 作为属性、元素或类名应用。你也可以使用其他组合，例如 `AE` 或 `AC`。\n\
  \n例如，你可以将以下指令作为属性或元素应用：\n\n点击此处查看代码图片\n\n```javascript\ndirective('myDirective',\
  \ function() {\n  return {\n    restrict: 'AE',\n    templateUrl: '/myDirective.html'\n\
  \  };\n});\n```\n\n以下显示了如何将指令同时实现为元素和属性。注意，驼峰命名法被替换为带有连字符的名称：\n\n`<my-directive></my-directive>`\n\
  \n`<div my-directive></div>`\n\n#### 为指令添加控制器\n\n你可以通过使用指令定义的 `controller` 属性为指令添加自定义控制器。这允许你为指令模板提供控制器支持。例如，以下代码添加了一个简单的控制器：\n\
  \n```javascript\ndirective('myDirective', function() {\n  return {\n    scope: {title\
  \ '='},\n    controller: function ($scope) {\n      $scope.title = \"new\";\n  \
  \    $scope.myFunction = function(){\n    }\n  }\n});\n```\n\n你还可以使用 `require` 选项确保控制器可用。`require`\
  \ 选项使用 `^controller` 语法来向上查找直到找到控制器。\n\n```javascript\ndirective('myDirective',\
  \ function() {\n  return {\n    restrict: 'AE',\n    templateUrl: '/myDirective.html'\n\
  \  };\n});\n```\n\n以下显示了如何将指令同时实现为元素和属性。注意，驼峰命名法被替换为带有连字符的名称：\n\n`<my-directive></my-directive>`\n\
  \n`<div my-directive></div>`\n\n\n\n\n有时，你可能希望将指令（directive）内部的作用域与指令外部的作用域隔离开。这样做可以防止指令更改父控制器作用域中的值。指令定义允许你指定一个\
  \ `scope` 属性来创建一个隔离作用域（isolate scope）。隔离作用域将指令作用域与外部作用域隔离开，防止指令访问外部作用域，并防止外部作用域中的控制器更改指令作用域。例如，以下代码将指令作用域与外部作用域隔离开：\n\
  \n点击此处查看图像\n\n```javascript\ndirective('myDirective', function() {\n  return {\n\
  \    scope: { },\n    templateUrl: '/myDirective.html'\n  };\n});\n```\n\n使用此代码，指令拥有一个完全空的隔离作用域。然而，你可能仍然想将外部作用域中的某些项映射到指令的内部作用域。你可以使用以下前缀为属性命名，以使本地作用域变量在指令作用域中可用：\n\
  \n![Image](img/image00767.jpeg) `@`：将本地作用域字符串绑定到 DOM 属性的值。该属性的值将在指令作用域内部可用。\n\n\
  ![Image](img/image00767.jpeg) `=`：在本地 `scope` 属性和指令 `scope` 属性之间创建双向绑定。\n\n![Image](img/image00767.jpeg)\
  \ `&`：将本地作用域中的函数绑定到指令作用域。\n\n如果前缀后没有属性名，则使用指令属性的名称。例如：\n\n`title: '@'`\n\n等同于：\n\
  \n`title: '@title'`\n\n以下代码展示了如何实现每种方法将本地值映射到指令的隔离作用域：\n\n点击此处查看图像\n\n```javascript\n\
  angular.module('myApp', []).\n  controller('myController', function($scope) {\n\
  \    $scope.title=\"myApplication\";\n    $scope.myFunc = function(){\n      console.log(\"\
  out\");\n    };\n  }).\n  directive('myDirective', function() {\n    return {\n\
  \      scope: {title: '=', newFunc:\"&myFunc\", info: '@'},\n      template: '<div\
  \ ng-click=\"newFunc()\">{{title}}: {{info}}</div>'\n    };\n  });\n```\n\n以下代码展示了如何在\
  \ AngularJS 模板中定义指令，以提供映射属性所需的必要属性：\n\n```html\n<div my-directive\n      my-func=\"\
  myFunc()\"\n      title=\"title\"\n      info=\"SomeString\"></div>\n```\n\n###\
  \ 元素嵌套 (Transcluding Elements)\n\n嵌套起初是一个难以理解的概念。基本上，这个想法是你可以保留 AngularJS 模板中定义的自定义指令的内容，并将其绑定到作用域上。其工作原理是指令的链接函数接收一个预先绑定到当前作用域的嵌套函数（transclusion\
  \ function）。然后，指令内部的元素就可以访问指令外部的作用域。\n\n你可以将 `transclude` 选项设置为以下值：\n\n![Image](img/image00767.jpeg)\
  \ `true`：嵌套指令的内容。\n\n![Image](img/image00767.jpeg) `‘element'`：嵌套整个元素，包括在较低优先级定义的任何指令。\n\
  \n你还必须在指令模板内部的元素中包含 `ngTransclude` 指令。以下是一个实现 `transclude` 的示例，用于从 `myDirective`\
  \ 指令模板访问控制器作用域中的 `title` 变量：\n\n点击此处查看图像\n\n```javascript\nangular.module('myApp',\
  \ []).\n  directive('myDirective', function() {\n    return {\n      transclude:\
  \ true,\n      scope: {},\n      template: '<div ng-transclude>{{title}}</div>'\n\
  \    };\n  }).\n  controller('myController', function($scope) {\n    $scope.title=\"\
  myApplication\";\n  });\n```\n\n### 使用 Link Function 操作 DOM\n\n当 AngularJS HTML\
  \ 编译器遇到指令时，它会运行指令的编译函数（compile function），该函数返回 `link()` 函数。`link()` 函数被添加到 AngularJS\
  \ 指令列表中。在所有指令完成编译后，HTML 编译器会根据优先级顺序调用 `link()` 函数。\n\n如果你想修改自定义指令内部的 DOM，应该使用 `link()`\
  \ 函数。`link()` 函数接收与指令关联的 `scope`、`element`、`attributes`、`controller` 和 `transclude`\
  \ 函数，允许你直接在指令内部操作 DOM。嵌套函数是一个句柄。\n\n`link()` 函数接收与指令关联的 `scope`、`element`、`attributes`、`controller`\
