  , function(e, ui){\n  ui.item.effect(\"pulsate\"); });\n```\n8. 保存所有三个文件，然后在浏览器中打开\
  \ HTML 文档，如图 18.5](#part0032.xhtml_ch18fig05) 所示。你可以将元素从左侧的 div 拖动到中间的 div，反反之。你还可以重新排列表格中的元素。\n\
