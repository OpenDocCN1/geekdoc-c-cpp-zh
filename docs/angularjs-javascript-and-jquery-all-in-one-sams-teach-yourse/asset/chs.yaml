  \ scope。\n\n**2。** 正确。`'type'` 不仅可以用于 HTML，还可以用于 `svg` 和 `math` 元素。\n\n**3。** 在指令中使用\
  \ `require: '^controllerName'` 选项。\n\n**4。** `link` 和 `compile` 函数。\n\n#### 练习\n\
