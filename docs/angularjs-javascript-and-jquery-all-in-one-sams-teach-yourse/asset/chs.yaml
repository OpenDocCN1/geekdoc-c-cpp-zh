  \ 和 列表 17.12 所示的代码。`<img>` 元素被设置为 `fixed` 定位，这样可以通过更改 CSS 位置来对其移动进行动画处理。\n\n**3.**\
  \ 打开 `animation_effects.js` 文件并添加列表 17.11 所示的 `coords` 数组。该数组提供了定位坐标和缓动函数名称，它们将用于\
  \ `click` 处理器。\n\n**4.** 下面的 `.ready()` 函数为球添加了 `click` 处理器：\n\n点击此处查看代码图片\n\n```javascript\n\
  $(document).ready(function(){\n  $(\"#ball\").click(reposition);\n});\n```\n\n**5.**\
