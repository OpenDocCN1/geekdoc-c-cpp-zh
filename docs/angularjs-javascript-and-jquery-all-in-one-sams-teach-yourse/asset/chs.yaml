  7   border:5px groove;\n8 }\n```\n\n* * *\n\n* * *\n\n### 总结\n\n本节重点在于使用 JavaScript\
  \ 对象访问网页外部的数据。你学习了 `screen`、`window`、`browser`、`location` 和 `history` 对象，这些对象提供了关于物理屏幕、浏览器和客户端历史的大量细节，以及对\
  \ `cookies` 的访问。\n\n你看到了如何打开和关闭浏览器窗口。通过 JavaScript，你还学习了如何创建基本的弹出窗口，以便你与用户进行交互。\n\
  \n### 问答\n\n**问。有方法可以找到正在使用的操作系统和浏览器吗？**\n\n**答。]** 是的。`navigator` 对象会在 `window.navigator.appCodeName`\
  \ 属性中显示浏览器。你也可以使用 `window.navigator.platform` 获取操作系统。\n\n### 工作\n\n工作坊由一组问题和答案组成，旨在巩固你对本节所涵盖材料的理解。在看答案之前尝试回答问题。\n\
