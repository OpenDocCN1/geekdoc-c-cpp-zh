  \ 服务来提供检索和更新服务器数据的访问。\n\n### 总结\n\n\n\n\nAngularJS 自定义服务是单例对象，你可以将其注册到依赖注入器中。在注册到依赖注入器后，控制器（controllers）、指令（directives）以及其他的\
  \ AngularJS 组件（包括其他服务）都可以使用它们。AngularJS 提供了几种创建自定义服务的方法，其复杂程度不相同。`value` 和 `constant`\
  \ 方法创建简单的服务。另一方面，`factory` 和 `service` 方法允许你创建更复杂的服务。\n\n本节侧重于在当你需要为应用程序提供基于任务的功能时，能够让你实现自己的自定义\
  \ AngularJS 服务的工具。你学习了四种自定义 AngularJS 服务的方法或类型，包括 `value`、`constant`、`factory` 和\
  \ `service`。\n\n本节展示了实现每种类型自定义 AngularJS 服务的示例。你还看到了在多个控制器中实现自定义 AngularJS 服务的示例。本节的最后一个一个示例向你展示了如何实现一个使用\
  \ `$http` 与服务器交互的独立自定义 AngularJS 服务，以及如何在另一个模块中注入并使用它。\n\n### 问答\n\nQ. 在单元测试中可以模拟（mock）AngularJS\
  \ 服务吗？\n\nA. 可以。你可以使用类似 Jasmine 的测试驱动开发框架来模拟服务提供者。\n\nQ. value 服务和 constant 服务之间有什么区别？\n\
  \nA. 它们的行为几乎相同。唯一的真实区别是 value 服务不能被注入到模块的配置块（configuration block）中。\n\n### 工作坊\n\
  \n工作坊由一系列问题和答案组成，旨在巩固你对本小时涵盖内容的理解。在查看答案之前，尝试回答这些问题。\n\n#### 测验\n\n1. 如果你想为单个变量定义初始值，你会使用哪种\
  \ AngularJS 服务提供者？\n\n2. 共有多少类型的服务提供者？\n\n3. 对对错：服务在你的模块内只能使用一次。\n\n#### 测验答案\n\n\
  1. `value` 服务提供者。\n\n2. Value, constant, factory 和 service。\n\n3. 错误。服务可以被注入到模块的多个组件中。\n\
