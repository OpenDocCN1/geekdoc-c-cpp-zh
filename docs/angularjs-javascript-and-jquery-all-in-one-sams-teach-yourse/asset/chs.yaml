  \ }\n```\n\n### 添加弹窗\n\n窗口对象提供了几种方法，允许你启动可以进行交互的弹窗，用于警报、提示和通知。弹窗会显示出来，用户在继续访问网页之前，需要与弹窗进行交互。\n\
  \n**注意**\n\n通常情况下，创建一个带有覆盖层的固定位置 `<div>` 元素比使用这些弹窗要好得多，因为你对它们有更多的控制权。你将在书的稍后部分学习如何这样做。\n\
  \n#### 通知用户\n\n最常见的弹窗类型是警报（alert）弹窗，设计用于通知用户发生了某些事情。用户将看到消息；但提供的唯一选项是关闭该弹窗消息。\n\n\
  要创建一个简单的警报消息，使用如下所示的 `window.alert()` 方法，并在图 11.2 中显示：\n\n点击此处查看代码图像\n\n```javascript\n\
  window.alert(\"现在是 12/12/12 12:12:12!!!\");\n```\n\n![图像](img/image00909.jpeg)\n\
  \n**图 11.2** JavaScript 弹窗。\n\n#### 请求用户确认\n\n次次常见的弹窗类型是确认（confirmation）弹窗，设计用于通知用户即将发生某些事情。用户将看到消息，然后获得点击\
  \ OK 允许操作发生或点击取消拒绝操作的选项。\n\n要创建一个允许用户用“是”或“否”回答的确认对话框，使用 `window.confirm()` 方法，如下所示并在图\
  \ 11.2 中显示：\n\n点击此处查看代码图像\n\n```javascript\nvar response = window.confirm(\"你确定吗？\"\
  );\nif (response == true) { do something; }\nelse { don't do something; }\n```\n\
  \n#### 提示用户输入\n\n另一种类型的弹窗是提示（prompt）。提示显示一个文本框，允许用户在弹窗中输入文本字符串。该字符串将返回给 JavaScript\
  \ 代码，并可以多种方式使用。\n\n要创建一个允许用户输入单个文本字符串作为输入的提示对话框，使用 `window.prompt()` 方法，如下所示并在图\
  \ 11.2 中显示：\n\n点击此处查看代码图像\n\n```javascript\nvar response = window.prompt(\"未负载的燕子的空速速度是多少？\"\
  );\nif (response == \"African or European?\"){ pass }\nelse { no pass }\n```\n\n\
  ### 设置定时器\n\nJavaScript 的另一个有用功能是设置定时器的能力，可以在一定时间后或按特定间隔执行函数或评估表达式。\n\n使用定时器允许你推迟代码的执行，使其无需在事件被触发或页面加载的精确时刻发生。\n\
  \n#### 添加延迟定时器\n\n要延迟执行代码一段时间，请使用 `setTimeout(code, ms)` 方法，其中 `code` 是一个语句或在时间到期后执行的函数。`ms`\
  \ 是毫秒数。例如，要在 10 秒后执行名为 `myTimer()` 的函数，你将使用以下代码：\n\n点击此处查看代码图像\n\n```javascript\n\
  var timerId = setTimeout(myTimer, 10000);\n```\n\n在时间耗尽且代码执行之前的任何时候，你都可以使用 `setTimeout()`\
  \ 返回的 `id` 调用 `clearTimeout(id)` 方法来清除定时器。例如：\n\n```javascript\nclearTimeout(timerId);\n\
  ```\n\n#### 添加循环定时器\n\n你还可以使用 `setInterval(code, ms)` 方法启动一个在固定间隔上触发的定时器。该方法也接受\
  \ `code` 语句或函数名作为参数。例如，以下代码每分钟创建一个定时器并调用函数 `checkStatus()`：\n\n点击此处查看代码图像\n\n```javascript\n\
  var timerId = setInterval(checkStatus, 60000);\n```\n\n你可以使用 `clearInterval()` 方法关闭间隔定时器：\n\
  \n```javascript\nclearInterval(timerId);\n```\n\n### 尝试：定时器和对话框\n\n在这个练习中，你将创建一个每秒更新一次的网页，使用定时器显示。该网页会弹出一个提示询问用户是否想要接收通知。如果他们，定时器将重置，直到你停止它。\n\
  \n1.  在 Eclipse 中创建 `clock.html`、`clock.js` 和 `css.css` 文件。\n2.  在 `clock.html`\
  \ 中添加以下内容，11.4 所示：\n\n```html\n<!DOCTYPE html>\n<html>\n  <head>\n    <title>时钟</title>\n\
