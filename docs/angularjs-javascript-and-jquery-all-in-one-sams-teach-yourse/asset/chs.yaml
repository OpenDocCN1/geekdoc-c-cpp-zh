  34 </html\n```\n\n## 列表 25.7 my_photos.html 为 myPhotos 自定义指令提供根元素的部分 AngularJS 模板\n\
  \n点击此处查看代码图像\n\n```html\n01 <div>\n  <div class=\"imgList\">\n    <li ng-repeat=\"\
  photo in photos\" ng-class=\"{active:photo.selected}\">\n      <a href=\"\" ng-click=\"\
  select(photo)\">{{photo.title}}</a>\n    </li>\n  </div>\n  <div class=\"imgView\"\
  \ ng-transclude></div>\n</div>\n```\n\n### 总结\n\nAngularJS 最强大的功能之一是创建自定义自定义指令的能力。在\
  \ `Module` 对象上使用 `directive()` 方法在代码中实现自定义指令是非常简单的。然而，由于实现方式多种，指令也可能变得非常复杂。本节让你初步了解了在\
  \ AngularJS 中使用自定义指令可以做的事情。尝试花些时间研究这些示例并编写一些自己的代码，以尽可能地熟悉它们的工作原理。\n\n### 问答\n\n\
  **问。是否有方法可以确保我为自定义指令选择的名称不会被其他人使用？](#part0040.xhtml_ch25aa01)是否有方法可以确保我为自定义指令选择的名称不会被其他人使用？**\n\
  \n**答。** 目前没有强制执行此点的方法。最好的方法想出一个唯一的缩写，作为你自定义 AngularJS 指令的前缀。\n\n**问。将自定义指令实现为标签、属性、类还是注释名称更好？**\n\
  \n**答。** 最佳实践是在合适的情况下使用标签名或属性名，而不是注释名和类名。\n\n### 工作坊\n\n工作坊包含一组问答，旨在巩固你对本节所涵盖内容的理解。尝试在看答案之前回答这些问题。\n\
  \n#### 测验\n\n**1。** 正确或错误：在自定义指令中使用 scope 时，scope 必须与父级 scope 共享。\n\n**2。** 正确或错误：`'type'`\
