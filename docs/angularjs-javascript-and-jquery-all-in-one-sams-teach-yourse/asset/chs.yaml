  \n# 使用 jQuery AJAX 更新服务器数据\n\n在本次练习中，你有机会实现一个带有 `.get()` 和 `.post()` 请求以及不同 AJAX\
  \ 处理程序的复杂 AJAX 网页。生成的网页提供了你可以评分的不同度假地链接。度假数据位于 Node.js 服务器上的数据结构中。当你更改评分时，将发送 POST\
  \ 请求到 Node.js 服务器并更改服务器数据，只要服务器运行，该更改就是永久的。本次练习的目的是巩固 AJAX 概念。\n\n示例代码位于列表 15.17、15.18、15.19\
  \ 和 15.20 中。按照以下步骤创建动态网页：\n\n**1.** 在 Eclipse 中，创建 `lesson15/ajax_post.html`、`lesson15/js/ajax_post.js`\
