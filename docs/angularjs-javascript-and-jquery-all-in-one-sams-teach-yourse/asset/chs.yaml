  \n**LISTING 4.6** HTML 代码创建了一个网页布局\n\n***\n\n**LISTING 4.7** CSS 代码用于应用页面布局\n\n\n\
  \n\n在定义你的 CSS 样式规则时，请记住有几种方法可以动态应用样式。你可以这样设计 CSS，使得动态代码的实现变得简单得多。后续章节将描述你稍后将学习的一些方法。\n\
  \n## 准备动态向 HTML 元素添加类\n\n动态调整 HTML 元素样式的简单方法是更改与元素关联的 CSS 规则。更改 CSS 规则最简单的方法是针对你想使用的不同规则使用\
  \ `class` 选择器。这样，通过 `AngularJS`、`jQuery` 和 `JavaScript`，你可以通过添加一个 `class` 来应用样式，或移除一个\
  \ `class` 来移除样式。\n\n这提供了两个主要优势。首先，动态代码要简单得多，因为添加和移除类非常容易。其次是易于调整将应用的 CSS 样式，因为这些调整将在\
  \ `.css` 文件或 `<style>` 标签内完成。\n\n使用动态类规则要求类选择器的规则必须在加载到网页的 CSS 代码某处被完全定义。它还需要你对如何实现每个\
  \ CSS 规则进行思考。\n\n例如，考虑为一个样式化为按钮的 `<span>` 元素添加动态交互。你希望按钮能够具有四种不同的状态：升起、按下、未激活和状态切换。你可以为这些按钮状态的类创建一个带有选择器的不同\
  \ CSS 规则。当按钮升起时，分配给 `<span>` 的 `class` 属性为 `up`；当用户点击按钮时，你可以将 `class` 改为 `state\
  \ changing`，然后当鼠标释放时，将 `class` 改为 `down`。\n\n## 准备直接调整 CSS 属性\n\n你也可以通过 `AngularJS`、`jQuery`\
  \ 和 `JavaScript` 直接访问并修改元素或一组元素的特定 CSS 属性。它的优势是可以在 `.css` 文件或 `<style>` 标签中创建静态的\
  \ CSS 定义，然后动态更改属性值的子集。\n\n使用 JavaScript 处理 CSS 属性值的一个绝佳例子是在网页上移动项目。例如，假设你为一个水平滚动横幅定义了一个\
  \ HTML 图像元素，它应该在屏幕上水平滚动。你会定义静态 CSS 样式，将横幅设为浏览器窗口中的固定位置。然后，由于 CSS 已经定义了渲染固定横幅的所有必要属性，你在\
  \ `AngularJS`、`jQuery` 和 `JavaScript` 中需要做的只是调整 CSS 位置属性来滚动横幅。\n\n### 总结\n\n本课程讨论了使用\
  \ CSS 快速方便地更改网页的外观效果。理解这些概念对于实现 `JavaScript`、`jQuery` 和 `AngularJS` 以创建动态网页和丰富的互联网应用程序至关重要。\n\
  \n你学习了 CSS 规则的结构，以及如何定义将 CSS 规则应用于特定一组 HTML 元素的选择器。你接触到了 CSS 的一些常见设计和布局样式。\n\n你学习了如何为文本设置样式、应用颜色和背景图像，以及在\
  \ HTML 元素周围创建漂亮的边框。你还学习了如何理解和控制页面上 HTML 元素的流，以及如何应用固定定位。\n\n## 答\n\n**问. HTML 元素使用固定尺寸和位置更好，还是应该尝试使用更多基于内容大小的\
  \ HTML 流？**\n\n**答。** 这是一个很难的问题。对于大多数网页，考虑尽可能在元素内部使用带有相对定位的流。这样做的原因是因为查看网页的显示范围非常广。如果你需要支持高达\
  \ 36 英寸显示器的移动显示，流布局允许内容更容易地匹配浏览器大小。然而，如果你正在设计一个更像网络应用程序的动态网页，请使用更多支持平均尺寸显示器的固定尺寸，然后使用书中稍后学习的\
  \ `jQuery Mobile` 技术来实现移动版本。\n\n**问. 为什么要费心思用 CSS——我不能直接从 jQuery 和 JavaScript 应用\
  \ CSS 样式吗？**\n\n**答。** 当然，你用 CSS 能做的任何事情都可以通过 `JavaScript` 应用。然而，维护这些更为更为，特别是当有多人参与设计时。通常，一些优秀的网页设计师并不懂\
  \ `jQuery` 或 `JavaScript`。此外，考虑保留多个版本的 CSS 文件并对其进行调整以为网页应用不同的皮肤是多么简单。\n\n### 工作坊\n\
