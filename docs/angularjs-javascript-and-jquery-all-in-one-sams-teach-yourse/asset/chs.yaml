  \n在这个示例中，你使用一个自定义指令来提供一个缩放字段。其目的是展示 AngularJS 指令如何扩展图像。使用以下步骤构建项目：\n\n1. 创建以下结构：`zooming.html`、`zoomit.html`、`zooming.js`。\n\
