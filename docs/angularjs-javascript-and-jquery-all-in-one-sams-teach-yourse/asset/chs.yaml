  \n\n\n\n\n除了使用 `addEventListener()` 方法添加事件处理程序外，jQuery 还提供了允许你设置事件处理程序的辅助函数。这些辅助函数以事件类型命名，因此可以让你的代码看起来更整洁。\n\
  \n这些辅助函数使用了与 `addEventListener()` 相似的语法，但不需要指定事件类型：\n\n点击此处查看代码图片\n\n.<event type>(\
  \ [eventData], handler(eventObject))`\n\n`eventData` 参数是可选的，与 `addEventListener()`\
  \ 一样，它将为事件对象设置 `data` 值。`handler` 参数是必选的，用于指定要调用的函数。将 `<event type>` 替换为 表 9.3 中列出的事件名称。例如，以下两个\
  \ jQuery 语句是为点击事件分配处理程序的等效方式：\n\n点击此处查看代码图片\n\n```\nobj.click( dataObj, function\
  \ myHandler(e){...});\nobj.addEventListener(\"click\", dataObj, function myHandler(e){...});\n\
  ```\n\n除了基于事件类型名称的辅助函数外，jQuery 还提供了一个对鼠标悬停事件非常有用的辅助函数。`hover()` 辅助函数允许你同时设置 `mouseenter`\
  \ 和 `mouseleave` 事件的处理程序。例如：\n\n点击此处查看代码图片\n\n```\nobj.hover(function enterHandler(e){...},\
  \ function leaveHandler(e){...});\n```\n\n等同于\n\n点击此处查看代码图片\n\n```\nobj.addEventListener(\"\
  mouseenter\", function enterHandler(e){...});\nobj.addEventListener(\"mouseleave\"\
  , function leaveHandler (e){...});\n```\n\n你也可以通过只指定一个处理程序来为 `mouseenter` 和 `mouseleave`\
  \ 设置同一个处理程序。例如：\n\n点击此处查看代码图片\n\n```\nobj.hover(function hoverHandler(e){...});\n\
  ```\n\n### 手动触发事件\n\nJavaScript 和 jQuery 允许你手动触发事件。这具有许多优势，如模拟用户交互、将页面元素交互结合，或与自己的自定义事件进行交互。\n\
  \n以下章节描述了如何在 JavaScript 和 jQuery 中触发事件。\n\n#### 在 JavaScript 中触发事件\n\n在 JavaScript\
  \ 中触发事件的最简单方法是使用附加到 DOM 对象上的事件方法（如果有的话）。像 `click`、`select`、`blur` 和 `focus` 等简单事件在支持它们的\
  \ DOM 对象上都有相应的方法。例如，你可以使用以下语法在大多数 DOM 对象上触发 `click` 事件：\n\n```\nobj.click();\n```\n\
  \n在 JavaScript 中触发事件的更高级的方法是创建一个事件对象，然后使用 `document.dispatchEvent()` 调用来触发事件机制。这种方法对事件信息提供了更多的控制，并且是触发许多事件的唯一方法。`dispatchEvent()`\
  \ 方法涉及三个步过程。\n\n第一步是使用 `document.createEvent()` 方法创建一个事件对象。`createEvent()` 方法要求你为正在创建的对象指定事件\
  \ `type`。表 9.4 列出了 `createEvent()` 接受的一些常见事件类型。例如，要创建一个鼠标 `click` 事件对象，使用以下语句：\n\
  \n点击此处查看代码图片\n\n```\nvar clickEvent = document.createEvent(\"MouseEvents\");\n```\n\
  \n![Image](img/image00895.jpeg)\n\n**表 9.4 `createEvent()` 支持的常见事件类型**\n\n下一步是通过调用事件的初始化函数为事件对象初始化值。表\
  \ 9.4 列出了对应于事件类型的初始化函数以及支持的参数。\n\n例如，要初始化点击事件对象，使用以下语句。类型指定为 `\"click\"`，且 `bubbling`\
  \ 和 `cancelable` 属性均为 true。在这里，`window` 被用作 `view` 元素。坐标并不重要，所以它们保持为 0，额外的键盘键也不重要，因此它们被设置为\
  \ false。`button` 参数设置为 0（代表左键），且没有指定相关的 target：\n\n点击此处查看代码图片\n\n```\nclickEvent.initMouseEvent(\"\
  click\", true, true, window, 0, 0, 0, 0, 0, 0, false, false, false, false, 0, null);\n\
  ```\n\n在大多数情况下，初始化函数的参数应该是是不言自明的。不过，你可能需要检查某些特定的参数。你可以在 [www.w3.org/TR/DOM-Level-2-Events/events.html](http://www.w3.org/TR/DOM-Level-2-Events/events.html)\
  \ 事件对象和方法的定义。\n\n最后是在你想触发的元素上调用 `dispatchEvent()`。例如，以下代码触发了事件：\n\n```\nobj.dispatchEvent(clickEvent);\n\
  ```\n\n### 试一下：手动触发事件\n\n在这个示例中，你将使用 JavaScript 手动触发事件。这对于模拟用户交互或创建自定义逻辑有用。\n\n\
  1. **创建 HTML 文件**：创建一个包含两个复选框和两个按钮的 `manual_event.html`。\n\n```html\n<!DOCTYPE html>\n\
  <html>\n<head>\n    <title>Triggering Events</title>\n    <link rel=\"stylesheet\"\
  \ href=\"manual_event.css\">\n</head>\n<body>\n    <input type=\"checkbox\" id=\"\
  check1\"> Check 1\n    <input type=\"checkbox\" id=\"check2\"> Check 2\n    <button\
  \ id=\"btn1\">Trigger 1</button>\n    <button id=\"btn2\">Trigger 2</button>\n \
  \   <script src=\"manual_event.js\"></script>\n</body>\n</html>\n```\n\n2. **创建\
  \ CSS 文件**：创建 `manual_event.css` 来为元素设置样式。\n\n```css\nbody {\n    font-family: sans-serif;\n\
  \    margin: 20px;\n}\nbutton {\n    margin-top: 10px;\n}\n```\n\n3. **创建 JavaScript\
  \ 文件**：创建 `manual_event.js` 并添加 `onload` 函数来附加事件监听器。\n\n```javascript\nwindow.onload\
  \ = function() {\n    var btn1 = document.getElementById(\"btn1\");\n    var btn2\
  \ = document.getElementById(\"btn2\");\n    var check1 = document.getElementById(\"\
