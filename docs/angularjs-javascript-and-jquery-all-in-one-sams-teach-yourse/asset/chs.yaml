  valueArr\");\n    lineValues.shift();\n    lineValues.push(randInt(100));\n    $(this).children(\"\
  span\").html(lineValues[0]);\n    renderSpark($(this).children(\"canvas\").get(0),\
  \ lineValues);\n  });\n  setTimeout(adjValues, 1000);\n}\nfunction renderSpark(c,\
  \ lineValues){\n  c.width = c.width;\n  var xAdj = c.width/lineValues.length;\n\
  \  var ctx = c.getContext(\"2d\");\n  ctx.fillStyle = \"#000000\";\n  ctx.strokeStyle\
  \ = \"#00ffff\";\n  ctx.lineWidth = 3;\n  var x = 1;\n  ctx.moveTo(x,(c.height));\n\
  \  for (var idx in lineValues){\n    var value = parseInt(lineValues[idx]);\n  \
  \  ctx.lineTo(x+xAdj, (c.height - value));\n    x += xAdj;\n  }\n  ctx.stroke();\n\
  }\nfunction getRandomArray(){\n  var arr = new Array();\n  for(var x=0; x<20; x++){\
  \ arr.push(randInt(100)); }\n}\n$(document).ready(function(){\n  $(\"div\").each(function(){\n\
  \    $(this).data(\"valueArr\", getRandomArray());\n  });\n  adjValues();\n});\n\
  ```\n\n\n\n\n\n```javascript\n32   return arr;\n33 }\n34 $(document).ready(function(){\n\
