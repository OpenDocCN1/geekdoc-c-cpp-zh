  \n## 动手尝试：为 HTML 元素添加边框\n\n另一个可以修改以完全改变 HTML 组件外观和感受的 CSS 属性是 `border` 属性。所有的容器元素，如\
  \ `<div>`、`<span>` 和 `<p>` 都允许你通过 CSS 定义边框样式。\n\n表 4.2 描述了可以在 CSS 中修改以定义各种边框样式 CSS\
  \ 属性。\n\n![图像](img/image00838.jpeg)\n\n### 表 4.2 定义边框样式的 CSS 属性\n\n你可以使用以下语法在单个属性设置上指定\
  \ `border-width`、`border-color` 和 `border-style` 属性的不同值：\n\n点击此处查看代码图像\n\n```css\n\
  property: top right left;\nborder-width: 1px 2px 1px 2px;\nborder-color: red blue\
  \ blue;\n```\n\n你也可以使用位置（如 `border-top` 或 `border-top-width`）设置单个边框属性。例如，以下 CSS\
  \ 将仅对边框的顶部和左侧部分设置样式：\n\n```css\nborder-top: 1px black;\nborder-left-color: blue;\n\
  border-left-style: solid;\nborder-left-width: 2px;\n```\n\n以下步骤将引导你通过在 列表 4.4 和\
  \ 列表 4.5 中创建代码，为 `<div>` 元素添加多种类型的边框：\n\n1. 在 `lesson04` 中创建一个名为 `borders.html`\
  \ 的新 HTML 文档。\n2. 添加 列表 4.4 所示的代码。该代码链接一个名为 `css/borders.css` 的外部样式表，然后定义了一系列 `<div>`\
  \ 元素。\n3. 在 `lesson04/css` 中创建一个名为 `borders.css` 的新 CSS 文档。\n4. 在新 CSS 文件中添加以下行，为\
  \ `<div>` 元素设置基本间距和大小：\n\n点击此处查看代码图像\n\n```css\ndiv { width:200px; margin:5px; text-align:center}\n\
  ```\n\n5. 添加 列表 4.5 中的第 2–8 行，定义适用于 `<div>` 元素的多种边框样式。\n6. 添加以下 CSS 以在两个 `<div>`\
  \ 元素上创建圆角边框：\n\n点击此处查看代码图像\n\n```css\n#round { border: 1px solid; border-radius:5px;}\n\
  #veryround { border: 1px solid; border-radius:50%;}\n```\n\n7. 添加 列表 4.5 中的第 1–20\
  \ 行，定义适用于 `<div>` 元素的阴框样式。\n8. 添加以下 CSS 以创建阴影。这些代码为 `<div>` 元素添加了阴影。第一个是 `solid`，第二个是\
  \ `dotted`，第三个是 `inset`（内嵌），`inset` 描述了设置在右侧的阴影。\n\n点击此处查看代码图像\n\n```css\n#shadow\
  \ {\n  margin:10px;\n  border:1px solid;\n  box-shadow: 5px 5px 3px 2px;\n}\n```\n\
  \n9. 添加以下代码，使用 `outset` 值来创建一个具有良好的阴影效果：\n\n点击此处查看代码图像\n\n```css\n#button {\n  width:150px;\n\
  \  background-color: #2233FF;\n  color: white;\n  border:5px outset;\n  border-radius:50%;\n\
  }\n```\n\n10. 保存文件并在浏览器中打开。你应该看到类似于 图 4.12 的不同边框效果。\n\n![图像](img/image0839.jpeg)\n\
  \n### 图 4.12 为 HTML 元素添加多种边框\n\n### 列表 4.4](#part0015.xhtml_ch04lis04) 创建一系列 `<div>`\
  \ 样式的 HTML\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n    <title>Borders</title>\n\
  \    <meta charset=\"UTF-8\">\n    <link rel=\"stylesheet\" type=\"text/css\" href=\"\
  css/borders.css\">\n</head>\n<body>\n    <div id=\"simple\">Simple Border</div>\n\
  \    <div id=\"dashed\">Dashed Border</div>\n    <div id=\"dotted\">Dotted Border</div>\n\
  \    <div id=\"groove\">Groove Border</div>\n    <div id=\"inset\">Inset Border</div>\n\
  \    <div id=\"outset\">Outset Border</div>\n    <div id=\"ridge\">Ridge Border</div>\n\
  \    <div id=\"round\">Rounded Border</div>\n    <div id=\"veryround\">Rounder Border</div>\n\
  \    <div id=\"mixed\">Mixed Border</div>\n    <div id=\"shadow\">Shadow Border</div>\n\
  </body>\n</html>\n```\n\n### 列表 4.5](#part0015.xhtml_ch04lis05) 定义边框样式的 CSS\n\n\
  ```css\ndiv { width:200px; margin:5px; text-align:center}\n#simple { border:1px\
  \ solid black; }\n#dashed { border:1px dashed black; }\n#dotted { border:1px dotted\
  \ gray; }\n#groove { border:5px groove blue; }\n#inset { border:5px inset red; }\n\
  #outset { border:5px outset blue; }\n#ridge { border:5px ridge black; }\n#round\
  \ { border: 1px solid; border-radius:5px;}\n#veryround { border: 1px solid; border-radius:50%;}\n\
  #shadow {\n  margin:10px;\n  border:1px solid black;\n  box-shadow: 5px 5px 3px\
  \ 2px;\n}\n#mixed {\n  border-top: 1px solid;\n  border-top-radius:5px;\n  border-left:\
  \ 1px dotted;\n  border-bottom: 5px ridge;\n  border-bottom-radius: 10px;\n}\n```\n\
  \n\n\n\n浏览器与用户交互的一个重要部分是鼠标光标。你只需更改鼠标悬停在 HTML 元素上时的光标样式，让用户知道该元素的用途或行为。\n\n`cursor`\
  \ CSS 属性允许你定义当鼠标悬停在特定元素上时使用什么光标。以下显示了将 `cursor` 设置为 `pointer` 的示例：\n\n```css\ndiv\
  \ { cursor:pointer; }\n```\n\n你可以从几个 `cursor` 值中进行选择。图 4.13 显示了通过 `cursor` CSS 属性可用的一些\
  \ `cursor` 值示例。\n\n![Image](img/image00840.jpeg)\n\n图 4.13** 通过 `cursor` CSS 属性可某些光标类型示例。\n\
  \n## 不透明度 (Opacity)\n\n`opacity` CSS 属性允许你设置 HTML 元素及其内部包含的所有元素的透明度。`opacity` 被指定为\
  \ 0 到 1 之间的小数，其中 0 表示透明，1 表示不透明。\n\n更改 `opacity` 是让用户知道 HTML 元素处于非激活状态的一种极佳方法。例如，下面的\
  \ CSS 和 HTML 定义了两个按钮定义。`button2` 的定义包含了 .4 的不透明度，使其部分透明。结果所示图 4.14。\n\n![Image](img/image00841.jpeg)\n\
  \n图 4.14** 两个样式为按钮的 `<<span>>` 元素，其中一个元素的 `opacity` 设置为 .4。\n\nCSS 规则：\n\n点击此处查看代码图片\n\
  \n```css\n#button, #button2 {\n  margin: 5px; padding:3px;\n  text-align: center;\n\
  \  background-color: #2233FF;\n  color: white;\n  border:5px outset blue;\n  border-radius:50%;\n\
  }\n\n#button2 { opacity:.4; }\n```\n\nHTML 元素：\n\n点击此处查看代码图片\n\n```html\n<span id=\"\
  button\">Active</span>\n<span id=\"button2\">Inactive</span>\n```\n\n## 可性 (Visibility)\n\
  \n另一个属性 CSS 属性是 `visibility`。你可以将 `visibility` 设置为 `hidden`，此时 HTML 元素及其包含的所有元素将不会渲染到浏览器中。再次将其设置为\
  \ `visible`，它就会在浏览器窗口中显示。这种功能在 `jQuery` 和 `JavaScript` 中非常有用，允许你动态显示和隐藏页面元素。\n\n\
  ## 应用 CSS 布局属性\n\n创建 HTML 网页最大的挑战之一是 HTML 并不易于创建美观的布局。这就是为什么许多 CSS 属性旨在更改大小、位置以及与其他\
  \ HTML 元素之间的关系。\n\n使用 CSS 布局属性，你将能够在你的网页上正确地为项目定位，并且通过 `JavaScript`、`jQuery` 和 `AngularJS`，你可以高效地更改这些位置，为用户提供更多的应用程序体验，而不是一个简单的点击式网页。接下来的章节涵盖了更改\
  \ HTML 组件布局的 CSS 属性。\n\n## 理解盒模型 (Box Model)\n\nHTML 元素使用盒模型渲染到浏览器窗口中。在盒模型中，HTML\
  \ 元素的内容由图 4.15 所示的四个部分组成：\n\n![Image](img/image00767.jpeg) **内容 (Content)**——HTML\
  \ 组件内容本身\n\n![Image](img/image00767.jpeg) **内边距 (Padding)**——组件与边框之间的空间\n\n![Image](img/image00767.jpeg)\
  \ **边框 (Border)**——环绕 HTML 元素的边框\n\n![Image](img/image00767.jpeg) **外边距 (Margin)**——HTML\
  \ 元素与其周围元素之间的空间\n\n![Image](img/image00842.jpeg)\n\n图 4.15** CSS 盒模型包含四个部分：内容、内边距、边框和外边距。\n\
  \n每个部分在网页浏览器中占据的空间可以使用 CSS 设置。\n\n### 设置内容大小\n\n通过指定 `height` 和 `width` CSS 属性的大小值来设置内容。大小值可以指定为\
  \ `px`、`cm`、`auto`、`%` 等。你还可以使用 `max-height`、`max-width`、`min-height` 和 `min-width`\
  \ 属性指定最大和最小宽高。\n\n以下是设置 `<p>` 元素的高度和宽度属性的示例：\n\n```css\np {height:100px; width:\
  \ 50px;}\n```\n\n### 在 HTML 内容周围添加内边距\n\n内边距是元素布局的重要部分，特别是当你使用边框时。内边距防止 HTML 元素内部的内容触碰边框。\n\
  \n可以通过指定 `padding` 值为 HTML 元素的所有边添加内边距，例如：\n\n```css\npadding:3px;\n```\n\n你也可以为元素的每个侧面指定内边距，例如：\n\
  \n```css\npadding:1px 2px 1px 2px;\n```\n\n### 在 HTML 元素周围添加外边距\n\n外边距的作用与内边距类似，但它们位于元素的边框之外，并保持其他\
  \ HTML 元素不接触边框。可以为 HTML 元素的所有边添加外边距，例如：\n\n```css\nmargin:3px;\n```\n\n你也可以为元素的每个侧面指定外边距，例如：\n\
  \n```css\nmargin:1px 2px 1px 2px;\n```\n\n`margin` 属性还支持 `auto` 值。\n\n## 修改元素流\n\
  \n除非另有指定，否则元素是静态的并与文档中的其他元素一起流动。使用 `display` 属性可以将元素设置为 `block` 或 `inline`。另一个值得的\
  \ display 值是 `inline-block`。`inline-block` 允许元素内联；但你仍然可以设置块属性，如 `height` 和 `width`。例如：\n\
  \n```css\nspan {height:200px; width:200px; display:inline-block;}\n```\n\n另一种修改元素流的方法是使用\
  \ `float` 属性。`float` 允许元素浮元素的左侧或右侧。不浮动的元素将显示在浮动元素旁边。\n\n在使用 `float` 属性时，你需要使用 `clear`\
  \ 属性来定义哪些侧不允许流动。为了说明这一点，请考虑下面的 CSS 和 HTML。注意在图 4.16 中，未包含 `clear:both` 属性的段元素渲染在图像旁边。\n\
  \n![Image](img/image00843.jpeg)\n\n图 4.16** 将元素浮向左侧或右侧会修改流。然而，你需要 `clear` 你不想流动的属性。\n\
  \nCSS 规则：\n\n```css\n#image1 {float:left;}\n#image2 {float:right;}\n#cleared {clear:both;}\n\
  ```\n\nHTML 元素：\n\n```html\n<img id=\"image1\" src=\"images/lesson0302.jpg\" width=\"\
  100\" />\n<img id=\"image2\" src=\"images/lesson0303.jpg\" width=\"100\" />\n<p\
  \ id=\"uncleared\">Uncleared</p>\n<p id=\"cleared\">Cleared</p>\n```\n\n## 使用 CSS\
  \ 定位 HTML 元素\n\n`position` 属性允许你定义浏览器如何对元素定位。默认情况下，元素是静态的并与文档中的其他元素一起流动。但通过更改 `position`\
  \ 属性的值，你可以更改这种行为。\n\n以下列表描述了每个非静态位置值：\n\n![Image](img/image00767.jpeg) fixed——相对于浏览器窗口定位元素。\n\
  \n![Image](img/image00767.jpeg) absolute——相对于第一个非静态容器元素定位元素。元素的至少一个容器必须已经定义了非静态位置。\n\
  \n\n\n\n\n![Image](img/image00767.jpeg) 相对定位（relative）——将元素相对于其原本的正常位置进行定位。\n\n\
  当你将 `position` 属性更改为非静态（nonstatic）值后，可以使用 `top`、`left`、`bottom` 和 `right` 属性来设置定位。例如，要将元素的左上角设置为距离页面顶部\
  \ 50 像素、距离浏览器窗口左侧边缘 100 像素，你可以使用以下 CSS 代码：\n\n```css\nposition:fixed;\ntop:50px;\n\
  left:100px;\n```\n\n### Z-Index\n\n当你开始使用非静态定位对 HTML 元素时，可能会遇到一个元素重叠另一个元素的情况。`z-index`\
  \ 属性允许你指定哪个元素应该在前面。`z-index` 数值较大的元素位于 `z-index` 值较小的元素前面。以下 CSS `<div>` 元素将位于 `<p>`\
  \ 段落元素的前面：\n\n```css\ndiv { z-index:2; }\np { z-index:1; }\n```\n\n### Overflow\n\
  \n`overflow` CSS 属性用于解决在设计的网页区域中尝试显示比该区域过大的项目的问题。`overflow` 属性可以设置为以下值：\n\n![Image](img/image00767.jpeg)\
  \ 可见（visible）——默认行为。\n\n![Image](img/image00767.jpeg) 隐藏（hidden）——如果内容太大，将隐藏元素。\n\
  \n![Image](img/image00767.jpeg) 滚动（scroll）——底部和右侧添加滚动条。如果内容超过了尺寸限制，滚动条将激活，你可以查看容器的完整内容，而不影响页面其他部分的布局。\n\
  \n![Image](img/image00767.jpeg) 自动（auto）——必要时将添加滚动条，以保持元素符合它的尺寸限制。\n\n图 4.17 显示了一个列表示例，该列表被限制在一个\
  \ `<ul>` 元素内部，该元素具有带有 `overflow` 属性的以下 CSS 规则：\n\n```css\nul{\n  border:1px solid;\n\
  \  height:150px; width:300px;\n  overflow:auto;\n}\nli{ width:800px; }\n```\n\n\
  ![Image](img/image00844.jpeg)\n\n**图 4.17** 在 `<ul>` 元素上添加 `overflow` 属性会导致列表限制在滚动条内。\n\
