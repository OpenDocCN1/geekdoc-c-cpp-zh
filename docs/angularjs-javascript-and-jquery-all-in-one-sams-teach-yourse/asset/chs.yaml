  \    width: 20px;\n    margin: 5px;\n    padding: 5px;\n}\n```\n\n### 总结\n\n在本节中，你学习了如何使用\
  \ jQuery 对象来查找和遍历 DOM 元素。你学习了如何链式调用方法以对元素集合执行多个操作。你还学习了如何根据用户输入动态地更新 UI，这在构建交互式网页时非常有用。\n\
  \n### 问答\n\n**问：`$(\"div:eq(n)\")` 和 `$(\"div\").eq(n)` 有什么区别？**\n\n答：最大的区别是 `.eq()`\
  \ 允许负数并从后计数，例如 `.eq(-1)` 是最后一个元素。`:eq()` 不允许负索引。\n\n**问：应该链式调用多少 jQuery 选项？**\n\n\
  答：这是一个很好的问题，取决于情况。这实际上是性能与可读性之间的权衡。请记住，每个 jQuery 查询背后都有一些代码，因此尽可能复用同一个 jQuery 堆栈越好。在某些情况下，当前的堆栈会变得非常难以理解；在这种情况下，你应该为自己避免麻烦。更好的方法是将操作拆分为可以重用的组。\n\
  \n#### 练习\n\n练习题由一组问题组成，旨在巩固你对本节内容的理解。在查看答案之前，请尝试回答这些问题。\n\n#### 测试\n\n1.  使用哪种\
  \ jQuery 方法过滤出包含 `<p>` 元素的元素？\n2.  使用哪种 jQuery 方法获取 `id=\"middleEarth\"` 元素之前的所有兄弟\
  \ `<p>` 元素？\n3.  `.map()` 和 `.each()` 之间有什么区别？\n\n#### 测试答案\n\n1.  `.has(\"p\");`\n\
  2.  `$(\"#middleEarth\").prevAll(\"p\");`\n3.  `.map()` 返回一个新的 jQuery 集合，而 `.each()`\
  \ 用于对每个元素执行函数且通常返回原始集合。\n\n\n\n\n\n# 3. `.map()` 用于遍历元素集合并返回一个包含每次迭代中指定函数结果的新对象。`.each()`\
  \ 则仅遍历元素并应用指定的函数。\n\n#### 练习\n\n1. 扩展 `dom_manipulation.html` 中的 HTML 代码，以包含更多与其它部分类似的\
  \ `<<div>>` 段。请注意，相同的功能会自动应用到每个部分上。\n\n## 第 9 ：应用 JavaScript 和 jQuery 事件构建丰富的交互式\
  \ 页面\n\n你将在本节中学习到：\n\n![Image](img/image00767.jpeg) 用户和浏览器触发事件的方式\n![Image](img/image00767.jpeg)\
  \ 事件对象上可以访问的属性\n![Image](img/image00767.jpeg) 如何添加能够动态响应事件的处理器\n![Image](img/image00767.jpeg)\
  \ 向事件处理器传递额外数据的方法\n![Image](img/image00767.jpeg) 手动触发事件的方法\n![Image](img/image00767.jpeg)\
  \ 创建自定义事件的方法\n![Image](img/image00767.jpeg) 如何在代码中实现并触发回调函数\n\nAngularJS、jQuery\
  \ 和 JavaScript 的主要目标之一是为开发者提供创建极其复杂且交互丰富的网页的能力。交互式页面的核心是事件。事件基本上是浏览器环境中任何发生的任何事情，从页面加载、鼠标移动或点击，到键盘输入，再到窗口大小调整。\n\
  \n理解事件、代表事件的类以及如何在你的网页中应用它们，将使你能够创建出非常精彩的用户交互体验。在本节中，你将学习理解事件所需的概念，以及如何在构建丰富的交互式网页时利用这些概念。你将在全书的剩余部分反复使用本节中的概念。\n\
  \nAngularJS 利用了本节讨论的底层 JavaScript 和 jQuery 事件功能，但也提供了额外的功能（如数据监听），以实现更健壮的事件处理。这些概念将在课程的\
  \ AngularJS 部分进行介绍。\n\n### 理解事件\n\n你已经在本书的几个示例中使用过事件。然而，为了充分发挥它们的作用，你需要理解从物理交互到\
  \ AngularJS、jQuery 和 JavaScript 交互（这些交互会修改屏幕元素和数据）的整个过程中发生了什么。后续章节描述了事件过程、涉及的组件以及如何在网页中实现事件。\n\
  \n#### 理解事件过程\n\n从高层次来看事件处理的概念很容易理解：你点击网页上的一个按钮，事情就发生了。本节将深入探讨，以便你理解正在发生的情况。以下列表描述了当用户与网页或浏览器窗口交互时发生的重要事项。\n\
  \n1. **发生物理事件**——发生了一个物理事件；例如，用户点击或移动鼠标，或按下按键。\n\n2. **浏览器中触发事件**——用户交互导致 Web 浏览器触发事件——通常是同时触发多个事件。例如，当用户在键盘上输入一个按键时，会触发三个事件：`keypressed`、`keydown`\
  \ 和 `keyup` 事件。\n\n3. **浏览器为事件创建对象**——Web 浏览器为每个触发的事件创建一个独立对象。对象包含了事件的信息，可以被处理器使用。\n\
  \n4. **调用用户事件处理器**——调用用户定义的事件处理器。你有能力在 JavaScript 中创建处理器，这些处理器将与事件对象和/或页面元素交互，从而为\
  \ HTML 元素提供交互性。事件处理器可以在三个阶段中运行。以下描述了图 9.1 所示的三个阶段：\n\n![Image](img/image00767.jpeg)\
  \ **捕获 (Capturing)**——捕获阶段是从文档直接通过每个父元素向下到达目标 HTML 元素。默认情况下，捕获阶段事件处理器的行为是禁用的。\n\n\
  ![Image](img/image00767.jpeg) **目标 (Target)**——当事件位于最初触发它的 HTML 元素时，发生目标阶段。\n\n\
  ![Image](img/image00767.jpeg) **冒泡 (Bubbling)**——冒泡阶段是通过目标 HTML 元素的每个父元素向上，一直返回文档。默认情况下，事件的冒泡阶段是开启的。\n\
  \n![Image](img/image00887.jpeg)\n\n**图 9.1** 事件首先在从文档到目标的捕获阶段处理，然后在目标阶段处理，最后是在从目标到文档的冒泡阶段处理。\n\
  \n5. **调用浏览器处理器**——除了用户事件处理器外，浏览器还有默认处理器，会根据触发的事件执行不同的操作。例如，当用户点击链接时，浏览器会调用一个事件处理器，并导航到链接中指定的\
  \ `href` 位置。\n\n#### 查看事件对象\n\n当浏览器检测到事件发生时，它会创建事件对象。如果事件处理器是由 AngularJS 或 jQuery\
  \ 定义的，则事件对象会被转换为 jQuery 事件对象，它具有更多的属性和方法。因此，你需要意识到你正在处理的是哪种类型的事件对象。\n\n事件对象为你提供了有关事件的额外信息，例如事件的类型——例如\
  \ `click` 或 `keypress`——按了哪些键、鼠标位置、事件发生的 HTML 元素等。表 9.1 描述了你将用到的事件属性。\n\n![Image](img/image00888.jpeg)![Image](img/image00889.jpeg)\n\
  \n**表 9.1** JavaScript 和 jQuery 属性\n\n事件还提供了一些方法，允许你控制事件的行为——例如停止传播和默认行为。表 9.2 描述了事件对象上的重要方法。\n\
  \n![Image](img/image0090.jpeg)\n\n**表 9.2** JavaScript 和 jQuery 方法\n\n#### 回顾事件类型\n\
  \n事件类型是 JavaScript、jQuery 和 AngularJS 用于识别发生物理事件的关键字。这些关键字用于附加处理器以指定事件类型。此外，正如你之后将看到的，这些关键字用于方法名称中，以便附加事件处理器或手动触发事件。\n\
  \nJavaScript 提供了多种对应于动态交互期间发生的不同事件类型。jQuery 事件处理支持所有的 JavaScript 事件，并添加了一些自己的事件。表\
  \ 9.3 列出了 JavaScript 和 jQuery 支持的不同事件类型。\n\n![Image](img/image0091.jpeg)![Image](img/image0092.jpeg)\n\
  \n**表 9.3** JavaScript 和 jQuery 事件类型\n\n### 使用页面加载事件进行初始化\n\n当 HTML 文档加载时，`<script>`\
  \ 标签中指定的 JavaScript 代码将被加载并执行。通常，JavaScript 和 jQuery 逻辑将位于之后执行的函数内部。然而，会有一些代码负责执行初始化工作，例如为页面元素附加事件处理器，甚至向现有元素中添加额外的元素。\n\
  \n\n\n\n这正是 `load` 事件非常有用的地方。将初始化代码放置在页面加载时触发的事件处理器中，可以确保所有的 HTML 对象都已创建，且 DOM 已完全准备就绪。\n\
  \n## 使用 JavaScript onload 事件\n\n要在 JavaScript 中添加在页面加载时运行的初始化代码，请在 JavaScript 中创建一个执行初始化的函数。例如，考虑以下展示了简单骨架结构初始化函数的\
  \ JavaScript 代码：\n\n点击此处查看代码图像\n\n```javascript\nfunction onloadHandler(){\n  (initialization\
  \ code here...)\n}\n```\n\n现在，你有两种方式来在页面完全加载时触发 `onloadHandler()`。第一种是将你的初始化代码绑定到\
  \ HTML 中 `<body>` 元素的 `onload` 属性上。例如：\n\n点击此处查看代码图像\n\n```html\n<body onload=\"\
  onloadHandler()\">\n```\n\n第二种方法是在你的 JavaScript 代码中将其直接赋值给 `window` 对象。例如：\n\n点击此处查看代码图像\n\
  \n```javascript\nwindow.onload = onloadHandler;\n```\n\n## 在 jQuery 中添加初始化代码\n\n\
  在 jQuery 中，初始化代码可以在两个不同的时间触发并执行：当 DOM 就绪时，以及文档及其资源完全加载时。使用哪种选项取决于你的初始化代码需要执行什么操作。\n\
  \n使用 jQuery 的 `.ready()` 方法会在 DOM 完全就绪时触发初始化代码运行。此时，所有的 DOM 对象都已创建，页面将显示给用户。然而，此时所有页面资源（如图像）可能尚未完全下载。这种选项允许你尽早添加交互和功能。以下示例展示了使用\
  \ `.ready()` 绑定简单初始化函数的用法：\n\n点击此处查看代码图像\n\n```javascript\n$(document).ready(function(){\n\
  \  (initialization code here...)\n})\n```\n\n使用 jQuery 的 `.load()` 方法会在所有页面资源加载并渲染给用户后触发初始化代码运行。在偶尔，如果你需要在初始化代码中使用图像等资源，你可能会使用此选项。以下示例展示了使用\
  \ `load()` 绑定简单初始化函数的用法：\n\n点击此处查看代码图像\n\n```javascript\n$(window).load(function(){\n\
  \  (initialization code here...)\n})\n```\n\n> **注意**\n> `.ready()` 和 `.load()`\
  \ 方法与 `<body>` 标签中使用 `onload=\"...\"` 属性不兼容。如果你在使用 jQuery，请使用 `.ready()` 或 `.load()`；如果没有使用，请使用\
  \ `onload` 属性。\n\n## 为 DOM 元素添加和移除事件处理器\n\n为了给网页中发生的事件提供交互，必须为你想要交互的每个特定事件类型添加事件处理器。事件处理器是一个\
  \ JavaScript 函数，用于添加、删除或更改 DOM 元素，或完成交互所需的任何操作。例如，以下代码是一个事件处理器示例，它可以将 `<p>` 元素中显示的文本改为\
  \ `\"clicked\"`：\n\n```javascript\nfunction clickHandler(){\n  $(\"p\").html(\"\
  clicked\");\n}\n```\n\n有几种方法可以允许你向 DOM 元素添加事件处理器。本节将描述这些这些方法及其优缺点。\n\n### 在 HTML\
  \ 中分配事件处理器\n\n向 DOM 元素添加事件处理器的最基本方法是直接在 HTML 代码中进行。这种方法的优点是简单直接，并且易于查看哪个事件处理器被分配给特定的\
  \ DOM 对象。\n\n通过在标签语句中设置处理器属性的值，可以将事件处理器添加到 HTML 中的 DOM 对象中。对于元素支持的每个事件，都有一个以 \"\
  on\" 开头的属性，后跟着事件名称。例如，`click` 事件属性是 `onclick`，`load` 事件属性是 `onload`。要查看事件列表，请参阅\
  \ 表 9.1。\n\n以下示例展示了在 HTML 代码中为 DOM 元素添加 `click` 事件处理器有多简单：\n\n点击此处查看代码图像\n\n```html\n\
  <div onclick=\"clickHandler()\">Click Here</div\n```\n\n当 `<div>` 元素被点击时，将调用以下函数：\n\
  \n```javascript\nfunction clickHandler(){\n  $(\"div\").html(\"clicked\");\n}\n\
  ```\n\n你还可以使用 `event` 关键字将 DOM 事件对象作为参数传递给事件处理器。这允许你在事件处理器中访问事件信息；例如：\n\n点击此处查看代码图像\n\
  \n```html\n<div onclick=\"clickHandler(event)\">Click Here</div\n```\n\n当 `<div>`\
  \ 元素被点击时，将调用以下函数，并通过读取 `e.screenX` 将文本更改为显示鼠标光器的 `x` 坐标：\n\n点击此处查看代码图像\n\n```javascript\n\
  function clickHandler(e){\n  $(\"div\").html(\"clicked at X postion: \" + e.screenX);\n\
  }\n```\n\n你还可以定义传递给事件特定参数，允许你区分特定的功能。参数可以是数字或字符串。（原文在此处继续，但逻辑如下）：\n\n点击此处查看代码图像\n\
  \n```html\n<h1 id=\"heading\"></h1\n<div onclick=\"clickHandler(event,1,'Yes')\"\
  >Click Here</div\n<div onclick=\"clickHandler(event,2,'No')\">Or Here</div\n```\n\
  \n当点击时，元素将调用以下函数：\n\n点击此处查看代码图像\n\n```javascript\nfunction clickHandler(e,obj,num,msg){\n\
  \  obj.innerHTML = \"DIV \" + num + \" says \" + msg +\" at X postion: \" + e.screenX;\n\
  }\n```\n\n\n\n\n```javascript\ndocument.getElementById(\"div1\").addEventListener('click',\n\
  \  function(e){\n    clickHandler (e, \"heading\", 1, \"yes\");\n  },false);\n```\n\
  所以，这就是前面代码中 `addEventListener()` 调用所发生的情况。它指定了事件类型 `'click'`，然后定义了一个没有名的匿名新 `function`，它接受事件对象作为唯一参数，并用\
  \ `e` 表示。在包装函数内部，使用自定义参数调用了实际的事件处理器，包括用于传递事件对象的 `e` 变量。在示例中，使用 `false` 表示该处理器应在冒泡阶段（bubbling\
  \ phase）被调用。\n\n你也可以使用 DOM 对象上的 `removeEventListener()` 函数从事件中移除事件处理器。你需要指定事件类型和要移除的事件处理器的名称。例如，以下代码添加了一个事件处理器，然后将其移除：\n\
  \n点击此处查看代码图片\n\n```javascript\nvar obj = document.getElementById(\"div1\");\nobj.addEventListener('click',\
  \ clickHandler);\nobj.removeEventListener('click', clickHandler);\n```\n\n### 提示\n\
  你也可以使用 `handler` 属性在 DOM 对象本身上设置事件处理器。`handler` 属性将是“on”加上事件类型。例如，对于点击事件，属性为 `obj.onclick`。你可以使用\
  \ `obj.onclick()` 调用事件处理器，或直接使用 `obj.onclick= function handler(){ ...};` 为其赋值。\n\
  \n### 亲手一试：通过 JavaScript 为 DOM 对象添加事件处理器\n在示例中，你使用 JavaScript 方法动态地为 DOM 对象附加事件处理器。按照以下步骤创建\
  \ 列表 9.1、9.2 和 9.3 所示的文件：\n\n1. 在 Eclipse 中，创建 `lesson09`、`lesson09/js` 和 `lesson09/css`\
  \ 文件夹。\n2. 创建 `lesson09/broken_event.html`、`lesson09/js/broken_event.js` 和 `lesson09/css/broken_event.css`\
  \ 文件。\n3. 将 列表 9.1 所示的代码添加到 HTML 文件中。你应该能识别此文件中的几乎所有内容。注意 `<body>` 标签的 `onload`\
  \ 事件处理器被设置为 `onloadHandler()`。\n4. 将 列表 9.3 中的 CSS 添加到 CSS 文件中。现在你也应该识别这些 CSS 语句了。\n\
  5. 打开 `broken_event.js` 文件并查看将用于处理点击事件的后续函数。注意它接受多个参数。第一个参数是 DOM 事件对象，用于通过 `e.screenX`\
  \ 获取 x 坐标。它还接受一个对象 `id`，用于获取应该写入的目标对象。其余的参数用于向由 `objId` 指定的对象的 `innerHTML` 写入消息：\n\
  \n点击此处查看代码图片\n\n```javascript\n01 function clickHandler(e,objId,num,msg){\n02  \
  \ var obj = document.getElementById(objId);\n03   obj.innerHTML = \"DIV \" + num\
  \ + \" says \" + msg +\" at X postion: \" + e.screenX;\n04 }\n```\n\n6. 创建以下包装函数，将用于将参数传递给实际的事件处理器。包装函数只接受事件对象作为参数\
  \ `e`。然后它们使用适当的值调用 `clickHandler()` 函数。在示例中，通过调用 `removeEventListener()` 从目标对象中移除事件处理器。移除事件处理器并不常见，这只是为了提供一个示例：\n\
  \n点击此处查看代码图片\n\n```javascript\n05 function yesWrapper(e){\n06   clickHandler(e,\
  \ \"heading\", 1, \"yes\");\n07   e.target.removeEventListener('click', yesWrapper);\n\
  08 }\n09 function noWrapper(e){\n10   clickHandler(e, \"heading\", 1, \"no\");\n\
  11   e.target.removeEventListener('click', noWrapper);\n12 }\n```\n\n7. 添加以下 `onloadHandler()`\
  \ 函数，该函数调用 `addEventListener()` 为每个 `<div>` 元素添加 `click` 事件处理器：\n\n点击此处查看代码图片\n\n\
  ```javascript\n13 function onloadHandler(){\n14   document.getElementById(\"div1\"\
  ).addEventListener('click', yesWrapper, false);\n15   document.getElementById(\"\
  div2\").addEventListener('click', noWrapper, false);\n16 }\n```\n\n8. 保存所有三个文件，然后在网络浏览器中打开\
  \ HTML 文档，并尝试 图 9.2 显示的“Say Yes”和“Say No”按钮。注意，按钮只会起一次，因为处理器已被移除。如果我们没有移除处理器，`<h1>`\
  \ 元素将会改变。\n\n![Image](img/0089.jpeg)\n**图 9.2** 一个简单的网页，它为 `<div>` 元素附加了事件处理器并响应用户点击。\n\
  \n**列表 9.1 broken_event.html 加载了 jQuery、为 <div> 元素附加事件处理器并定义 <h1> 的 HTML 文件**\n\
  点击此处查看代码图片\n\n```html\n01 <!DOCTYPE html>\n02 <html\n03 <head>\n04   <meta charset=\"\
  utf-8\" />\n05   <title>Broken Event</title>\n06   <script type=\"text/javascript\"\
  \ src=\"https://code.jquery.com/jquery-2.1.3.min.js\"></script>\n07   <script type=\"\
  text/javascript\" src=\"js/broken_event.js\"></script>\n08   <link rel=\"stylesheet\"\
  \ type=\"text/css\" href=\"css/broken_event.css\">\n09 </head>\n10 <body onload=\"\
  onloadHandler()\">\n11   <div id=\"div1\">Say Yes</div>\n12   <div id=\"div2\">Say\
  \ No</div>\n13   <h1></h1>\n14 </body>\n15 </html>\n```\n\n**列表 9.2 broken_event.js\
  \ 定义事件处理器并动态将其附加到 <div> 的 JavaScript 代码**\n点击此处查看代码图片\n\n```javascript\n01 function\
  \ clickHandler(e,objId,num,msg){\n02   var obj = document.getElementById(objId);\n\
  03   obj.innerHTML = \"DIV \" + num + \" says \" + msg +\" at X postion: \" + e.screenX;\n\
