  58 });\n59 app.listen(80);\n```\n\n### 使用高级 jQuery AJAX\n\n本节已经涵盖的概念应该可以满足你大部分 AJAX\
  \ 请求。然而，它们并没有涵盖 jQuery AJAX 接口的所有威力。接下来的章节将讨论直接构建在 jQuery 中的一些额外 AJAX 功能。\n\n####\
  \ 回顾全局设置\n\njQuery 提供了 `.ajaxSetup()` 方法，允许你在整个脚本中全局指定用于配置 AJAX 请求的选项。表 15.3 出了出了调用\
  \ `.ajaxSetup()` 时可以指定的一些选项。例如，以下代码设置了请求的默认全局 URL：\n\n点击此处查看代码图片\n\n```javascript\n\
  $.ajaxSetup({url:\"service.php\", accepts:\"json\"})\n```\n\n#### 使用全局事件处理器\n\n\
  jQuery 提供了创建全局事件处理器的方法，这些处理器会在事件发生时被调用，例如所有 AJAX 请求的初始化或完成。全局事件会在每次 AJAX 请求时触发。表\
  \ 15.2 列出了你可以用于注册全局事件处理器的方法。\n\n![Image](img/image00943.jpeg)\n\n**表 15.2 jQuery\
  \ 全局 AJAX 事件处理器注册方法**\n\n下面展示了一个使用全局事件处理器设置表单类名的示例：\n\n点击此处查看代码图片\n\n```javascript\n\
  $(document).ajaxStart(function(){\n  $(\"form\").addClass(\"processing\");\n});\n\
  \n$(document).ajaxComplete(function(){\n  $(\"form\").removeClass(\"processing\"\
  );\n});\n```\n\n> 注意：无论全局变量的值如何，对于跨域脚本或 JSONP 请求，永远不会触发全局事件。\n\n#### 实现低级 Ajax 请求\n\
  \n你在本节中使用的所有 AJAX 请求封装方法在底层都是通过 `.ajax(url [, settings])` 接口处理的。这个接口稍微难用一些，但它赋予了你对\
  \ AJAX 请求更大的灵活性的控制力。\n\n`.ajax()` 方法的调用方式与 `.get()` 和 `.post()` 相同；但是，`settings`\
  \ 参数允许你设置在发起请求时各种配置。\n\n表 15.3 列出了可以应用于 `.ajax()` 方法的常用设置。\n\n![Image](img/image00944.jpeg)\n\
  \n**表 15.3 .ajax() 请求方法中的可用设置**\n\n以下代码展示了使用 `.ajax()` 接口的简单示例：\n\n点击此处查看代码图片\n\n\
  ```javascript\n$.ajax({\n  url:\"setEmail\",\n  type:\"get\",\n  accepts:\"json\"\
  ,\n  contentType: 'application/x-www-form-urlencoded; charset=UTF-8',\n  data: {\"\
  first\":\"Brad\", \"last\":\"Dayley\"}\n}).fail(function(){ alert(\"request Failed\"\
  ); });\n```\n\n`.ajax()` 方法返回一个 `jqXHR` 方法，该方法提供了一些额外的功能，特别是在处理响应时。表 15.4 列出了附加到\
  \ `jqXHR` 对象的一些方法和属性。\n\n![Image](img/image00945.jpeg)\n\n**表 15.4 .ajax() 返回的 jqXHR\
  \ 对象的常用方法和属性**\n\n### 总结\n\nAJAX 是 jQuery/JavaScript 与 Web 服务器之间基础通信框架。使用 AJAX 允许从\
  \ Web 服务器获取额外数据并用其动态更新网页，而不是完全重新加载。这让你能够为用户提供更好的体验。\n\n在本节中，你学习了 AJAX 的来来脉。你实现了几个示例，让你积累了处理\
  \ GET 和 POST 请求的经验，以及处理不同类型数据（如 HTML、JSON 和 XML）的经验。\n\n### 问答\n\n**问. 为什么既有 GET\
  \ 请求又有 POST 请求，而不是只有一个请求？**\n\n**答. 答案是优化。虽然你可以只用 POST 请求就能完成所有操作，但可以进行优化。**\n\n\
  \n\n\njQuery UI 由 JavaScript 和 CSS 两部分组成。jQuery UI 的 JavaScript 部分扩展了 jQuery，添加了用于添加\
  \ UI 元素或对这些元素应用效果的功能。jQuery UI 的 CSS 部分对页面元素进行样式处理，这样开发者就不需要每次为元素设置样式。\n\njQuery\
  \ UI 通过提供预构建的 UI 元素（如日历和菜单）以及交互功能（如拖放和调整大小），为开发者节省了时间。接下来的章节将为您介绍该库；您将学习如何下载并将其应用于项目中。\n\
  \njQuery UI 库由多个组件组成，用于构建、管理和与网页上的 UI 元素交互。这些元素可以分为以下几类：\n\n![Image](img/image00767.jpeg)\
  \ **JavaScript**——jQuery UI 自带一个 `.js` 文件，该文件挂载到主 jQuery 库上。必须与 jQuery 一起加载到你的网页中，以实现\
  \ jQuery UI 组件。\n\n![Image](img/image00767.jpeg) **CSS**——jQuery UI 包含了几个 css 文件。主文件是\
  \ `jquery-ui.css`。这些文件包含了与 jQuery UI 相关的所有 CSS 设置，特别是所代表的主题设置。\n\n![Image](img/image00767.jpeg)\
  \ **Images**——jQuery 还提供了几个图像，用于构建某些 UI 组件。\n\n## 获取 jQuery UI 库\n\n您可以通过两种方式之一在项目中实现\
  \ jQuery UI。如果您想使用已提供的特定主题，可以在 [`code.jquery.com`](https://code.jquery.com) 的 jQuery\
  \ CDN 路径的 jQuery UI 部分选择其中一个主题。\n\n例如，以下代码从 jQuery CDN 节点加载了 jQuery UI 库和 Smoothness\
  \ 主题：\n\n点击此处查看代码图像\n\n```html\n<script type=\"text/javascript\" src=\"https://code.jquery.com/jquery-2.1.3.min.js\"\
  ></script>\n\n<script type=\"text/javascript\" src=\"http://code.jquery.com/ui/1.11.2/jquery-ui.min.js\"\
  ></script>\n\n<link rel=\"stylesheet\" type=\"text/css\" href=\"http://code.jquery.com/ui/1.11.2/themes/smoothness/jquery-ui.css\"\
  >\n```\n\n您还可以下载自定义主题一起下载库，并将其存储在自己的 Web 服务器上。在这种情况下，您将使用自己的路径作为 `src` 和 `href`\
  \ 属性，而不是使用 CDN 路径的 `jquery-ui.js` 和 `jquery-ui.css` 文件。\n\n您可以从以下位置下载 jQuery 库，选择图\
  \ 16.1 所示的包含的选项，并点击底部的下载按钮。这将下载 jQuery UI 文件：\n\n[`http://jqueryui.com/download`](http://jqueryui.com/download)\n\
