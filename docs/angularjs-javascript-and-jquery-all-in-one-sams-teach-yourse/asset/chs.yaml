  \ 3px;\n  padding: 5px;\n  background-color:#C0C00;\n  border:3px;\n  display:inline-block;\n\
  \  cursor:pointer;\n}\n```\n\n#### 使用 jQuery 手动触发事件\n\n现在你已经有机会从 JavaScript 触发事件，你已经准备好发现如果能使用\
  \ jQuery，它将让你的生活变得多么简单了。jQuery 还支持两种触发事件的方法。与 JavaScript 类似，对象也有对应于你可以直接调用的许多事件类型的方法。例如，大多数元素都有\
  \ `click()` 和 `dblclick()` 方法。表单元素增加了额外的方法，如 `blur()`、`focus()`、`keypress()`、`keydown()`\
  \ 和 `keyup()`，可以通过调用来触发特定事件。例如，以下语句触发了所有 `<span>` 元素的 `click` 事件：\n\n```javascript\n\
  $(\"span\").click();\n```\n\njQuery 还提供了一种在使用 `trigger()` 方法在指定事件对象值的同时触发事件的方法。`trigger()`\
  \ 方法有两种不同的语法，如所示：\n\n```javascript\ntrigger(eventType [, extraParameters])\n```\n\
  ```javascript\ntrigger(eventObject)\n```\n\n以下是使用第一种方法为所有 `class=\"checkbox\"` 的元素触发\
  \ `click` 事件的示例：\n\n```javascript\n$(\".checkbox\").trigger(\"click\");\n```\n\n\
  以下是在所有具有 `class=\"bigText\"` 的 input 上使用第二种方法的示例。该方法为 `keypress` 事件传递了一个简单的对象对象，然后将事件对象的\
  \ `charCode` 属性设为 13，即回车键：\n\n```javascript\n$(\"input.bigText\").trigger({'type':'keypress',\
  \ 'charCode':13});\n```\n\n注意，这比 JavaScript 方法要简单得多，因为 `trigger()` 接受一个带有适当属性名的简单对象，以设置你可能想要传递到事件对象中的任何值。偶尔，你可能不得不使用\
  \ JavaScript 方法，但你应该尽可能多使用 jQuery。\n\n尝试一下：在 jQuery 中手动触发事件\n\n在此示例中，你将了通过 `<span>`\
  \ 元素的事件处理程序来触发 `<input>` 元素 `keypress` 事件的过程。结果是点击 `<span>` 会作为 `<input>` 元素的按键进行传递。使用以下步骤创建列表\
