  \ 项目文件夹。\n   - `./lesson29/tabbable.html`: 项目的模板。\n   - `./lesson29/tabs.html`:\
  \ 标签组的 AngularJS 部分模板。\n   - `./lesson29/panel.html`: 标签组中每个面板的 AngularJS 部分模板。\n\
  \   - `./lesson29/js/tabbable.js`: 支持自定义标签的 AngularJS 应用。\n\n2. 将 Listing 29.1 中的代码添加到\
  \ `tabbable.js` 文件中。这是一个定义了两个指令 `myTabs` 和 `myPane` 的 AngularJS 应用。注意 `directive`\
  \ 函数简单地返回一个定义指令的对象。AngularJS 在 HTML 中遇到指令时会使用该对象创建实例。\n\n此外注意，内部的 HTML 使用指令定义中的\
  \ `templateUrl` 选项来自部分文件。注意使用了 `transclude` 选项，这允许我们在 AngularJS 模板中保留 `myPane`元素的内容。\n\
  \n两个指令之间的通信通过在 `myPane` 的定义中要求 `myTabs` 指令来实现。这导致 `myTabs` 中定义的控制器被传递给 `myPane`\
  \ 的 link 函数。注意第 30 行，我们能够调用 `addPane()` 将 `myPane` 指令的范围添加到 `myTabs` 指令的列表中。可见的标签通过\
  \ `myTabs` 控制器函数中的 `select()` 方法进行更改。\n\n\n\n\n```javascript\n06      scope: {},\n\
  07      controller: function($scope) {\n08        var panes = $scope.panes = [];\n\
  09        $scope.select = function(pane) {\n10          angular.forEach(panes, function(pane)\
