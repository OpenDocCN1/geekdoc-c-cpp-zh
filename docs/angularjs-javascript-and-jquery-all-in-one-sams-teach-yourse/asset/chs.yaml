  \ id=\"progressbar\"></div>\n\n#### 注意\n`progressbar` 小件通常配合 jQuery Ajax 的 `beforeSend()`\
  \ 函数使用，以显示请求的进度。\n\n## 实现滑块（Slider Bars）\n`slider` 小件允许你创建通过拖动鼠标来调整值的滑块控件。滑块包含两个部分：滑轨（slide）和滑柄（handle）。滑轨由\
  \ `.ui-slider-range` 类进行样式设置，滑柄则由 `.ui-slider-handle` 类进行样式设置。\n\n### 提示\n你可以同时定义\
  \ `min` 和 `max` 滑柄，这允许你使用单个滑块控件来定义一个范围，而不是单个值。\n\nListing 19.8 中的代码提供了一个实现一组滑块的示例，这些滑块用于调整另一个元素的背景颜色。滑块被应用于第\
  \ 22–29 行的 `<div>` 元素，并设置了以下选项：\n\n![Image](img/image00767.jpeg) orientation——可以设置为\
  \ `\"horizontal\"`（水平）或 `\"vertical\"`（垂直）。\n\n![Image](img/image0076.jpeg) range——可以设置为\
  \ `true`、`\"min\"` 或 `\"max\"`。用于定义范围。`\"min\"` 从滑块最小值到滑块上的一个滑柄，而 `\"max\"` 从滑块上的一个滑柄到滑块最大值。\n\
  \n![Image](img/image0076.jpeg) max——指定最大值。\n\n![Image](img/image0076.jpeg) value——指定当前值。\n\
  \n![Image](img/image0076.jpeg) slide——当滑块移动时调用的事件处理器。\n\n![Image](img/image0076.jpeg)\
  \ change——当滑块值改变时调用的事件处理器。\n\n此外还要注意 CSS 中第 41–46 行的类设置。它们改变了滑块和滑柄的外观。视觉效果可以在 Figure\
  \ 19.8 所示。\n\n![Image](img/image00984.jpeg)\n\n**图 19.8** 用于根据 RGB 值选择颜色的滑块。\n\n\
  **列表 19.8 widgets_slider_bars.html 使用 jQuery、CSS 和 HTML 实现滑块**\n\n点击此处查看代码图片\n\n\
  ```javascript\n...jQuery...\n\n11      function cValue(selector){\n12        var\
  \ v = $(selector).slider(\"value\").toString( 16 );\n13        if (v.length ===1)\
  \ { v = \"0\" + v;}\n14        return v;\n15      }\n16      function refreshSwatch()\
  \ {\n17        $(\"#mix\").css(\"background-color\", \"#\" + cValue(\"#red\") +\n\
  18        cValue(\"#green\") + cValue(\"#blue\"));\n19        $(\"#mix\").html($(\"\
  #mix\").css(\"background-color\"));\n20      }\n21      $(document).ready(function(){\n\
  22        $(\"#red, #green, #blue\" ).slider({\n23          orientation: \"horizontal\"\
  ,\n24          range: \"min\",\n25          max: 255,\n26          value: 127,\n\
  27          slide: refreshSwatch,\n28          change: refreshSwatch\n29       \
