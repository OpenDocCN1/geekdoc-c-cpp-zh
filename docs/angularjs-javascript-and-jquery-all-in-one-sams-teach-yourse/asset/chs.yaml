  10     border:3px ridge white; box-shadow: 5px 5px 5px #888888;\n11     padding:3px;\
  \ cursor:pointer; }\n```\n\n## 使用 jQuery UI 定位 UI 元素\n\njQuery UI 提供的一个巨大优势是能够相对于其他元素进行定位并处理冲突的能力。这是通过扩展\
