  05   background:blue;\n06   cursor:pointer;\n07 }\n08 .label{\n09   font-size:25px;\n\
  10   margin:10px;\n11 }\n```\n\n### 总结\n在本节中，你学习了如何使用 jQuery 和 JavaScript 对象来查找和访问\
  \ DOM 元素。这是动态编程的关键部分，因为你必须能够高效地访问 DOM 元素才能对其进行操作。你学习了 JavaScript DOM 对象的的基本语法和结构，以及附加在这些对象上的一些方法和属性。\n\
  \n### 问答\n**Q 我什么时候应该使用 getById() 而不是 $((\"#id\"))？******\n\n**A 你可能很少使用 getById()。唯一可能使用它的时候是你不想花时间将\
  \ jQuery 库链接到你的 HTML 文档。jQuery 的扩展性要强得多。******\n\n### 工作坊\n工作坊由一组问答组成，旨在巩固你对本节所涵盖内容的理解。在查看答案之前，尝试回答问题。\n\
  \n#### 测验\n**1 如何将一个名为 `myDiv` 的 DOM 对象转换为 jQuery 对象？**\n\n**2 正确或错误：jQuery 选择器返回\
