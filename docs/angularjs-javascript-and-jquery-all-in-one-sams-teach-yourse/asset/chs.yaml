  \n### 第 19 章 使用 jQuery UI 组件为网页添加丰富的交互\n\n使用交互小组件，你可以轻松地为你的网页提供一些高级功能。在本节中，你通过使用\
  \ jQuery UI 的 `draggable` 和 `droppable` 组件将某些元素设置为可拖拽、某些元素设置为可放置，从而创建了一些拖放元素。添加\
  \ `selectable` 组件允许你在多个项目周围绘制边界框或套索框。你使用了 `selectable` 组件*allowed you to draw a\
  \ bounding box or lasso around multiple items.*\n\n\n\n\n\n本课程未包含“自己试一试”部分，因为示例非常基础且易于遵循。每个列表的代码以及支持的图片可以在书籍网站的\
  \ `code/lesson19` 处找到。\n\n## 复习小组件 (Widgets)\n\n在开始之前，本节将回顾如何在小组件元素上上访问选项（options）和属性值（attribute\
  \ values），因为这与普通的 jQuery 对象上略有不同。\n\n在创建小组件时，选项是在传递给构造函数的对象中指定的。例如，以下代码为滑块小组件设置了\
  \ `min` 和 `max` 选项：\n\n点击此处查看代码图像\n\n```javascript\n$(\"#mySlider\").slider({min:2,\
  \ max:10});\n```\n\n要稍后访问这些选项，你需要将 `\"options\"` 作为 `.slider()`调用的参数。例如，以下代码设置了然后获取了\
  \ `max` 选项：\n\n点击此处查看代码图像\n\n```javascript\nvar slider = $(\"#mySlider\").slider({min:2,\
  \ max:10});\nslider.slider(\"option\", \"max\", 100);\nvar currentMax = slider.slider(\"\
  option\", \"max\");\n```\n\n小组件的属性值以类似的方式访问。例如，以下代码获取了然后设置了滑块上 `value` 属性的值：\n\n\
  点击此处查看代码图像\n\n```javascript\nvar value = $(\"#mySlider\").slider(\"value\");\n$(\"\
  #mySlider\").slider(\"value\", value+5 );\n```\n\n事实上，`value` 和 `options` 是滑块小组件上的方法，当作为第一个参数传递时会被调用。\n\
  \n## 添加可展开的手风琴元素 (Accordion Element)\n\n手风琴小组件将标题和内容的对组合成一个可展开的手风琴视图。手风琴小组件应用于一个容器元素，并识别所有的标题。`header`\
