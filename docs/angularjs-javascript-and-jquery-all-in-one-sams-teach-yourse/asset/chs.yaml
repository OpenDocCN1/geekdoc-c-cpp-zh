  \ by c.make for c in cameras\">\n20      </select>\n21      {{camera|json}}\n```\n\
  \n**8.** 在浏览器中打开 `directive_form.html` 并尝试更改表单元素的值，如图 24.2 所示。\n\n![Image](img/image01017.jpeg)\n\
  \n**图 24.2** 在 AngularJS 模板视图中实现表单指令元素。\n\n**代码列表 24.5 directive_form.js 为表单指令实现控制器**\n\
  \n点击此处查看代码图片\n\n```javascript\n01 angular.module('myApp', []).\n02    controller('myController',\
  \ function($scope) {\n03      $scope.cameras = [\n04        {make:'Canon', model:'70D',\
  \ mp:20.2},\n05        {make:'Canon', model:'6D', mp:20},\n06        {make:'Nikon',\
  \ model:'D7100', mp:24.1},\n07        {make:'Nikon', model:'D5200', mp:24.1}];\n\
  08      $scope.cameraObj=$scope.cameras[0];\n09      $scope.cameraName = 'Canon';\n\
  10      $scope.cbValue = '';\n11      $scope.someText = '';\n12    });\n```\n\n\
  **代码列表 24.6 directive_form.html 实现多个表单元素指令的 AngularJS 模板**\n\n点击此处查看代码图片\n\n```html\n\
  01 <!doctype html>\n02 <html ng-app=\"myApp\">\n03 <head>\n04    <title>AngularJS\
  \ 表单指令</title>\n05 </head>\n06 <body>\n07    <div ng-controller=\"myController\"\
  >\n08      <h2>表单指令</h2>\n09      <input type=\"text\" ng-model=\"someText\"> {{someText}}<hr>\n\
  10      <input type=\"checkbox\" ng-model=\"cbValue\"\n11               ng-true-value=\"\
  'Checked'\" ng-false-value=\"'Not Checked'\">\n12      复选框: {{cbValue}}<hr>\n13\
  \      <input type=\"radio\"\n14        ng-model=\"cameraName\" value=\"Canon\"\
  > Canon<br/>\n15      <input type=\"radio\"\n16        ng-model=\"cameraName\" value=\"\
  Nikon\"> Nikon<br/>\n17      选中的相机: {{cameraName}} <hr>\n18      <select ng-model=\"\
  camera\"\n19        ng-options=\"c.model group by c.make for c in cameras\">\n20\
  \      </select>\n21      {{camera|json}}\n22      <script src=\"http://code.angularjs.org/1.3.8/angular.min.js\"\
  ></script>\n23      <script src=\"js/directive_form.js\"></script>\n24 </body>\n\
  25 </html>\n```\n\n#### 将模型绑定到页面元素的指令\n\nAngularJS 模板允许你将作用域中的数据直接绑定到 HTML 元素显示的内容上。你可以通过多种方式将数据绑定到视图，包括：\n\
  \n![Image](img/image00767.jpeg)\n\n**值：** 你可以直接在作用域中表示表单元素的值。例如，文本输入可以是作用域中的一个 `String`\
  \ 变量，但复选框将由 `Boolean` 值表示。\n\n![Image](img/image00767.jpeg)\n\n**HTML：** 你可以使用如下的表达式在元素的\
  \ HTML 输出中表示作用域中的数据值：\n`<p>{{myTitle}}</p>`\n\n![Image](img/image00767.jpeg)\n\n\
  **属性：** HTML 属性的值可以通过如下的表达式来反映作用域中的数据：\n点击此处查看代码图片\n`<a ng-href=\"/hash}}/index.html\"\
  >{{hash}}</a>`\n\n![Image](img/image00767.jpeg)\n\n**可见性：** 元素的可见性可以反映视图中的作用域。例如，当作用域的值为真时，元素是可见的。\n\
  \n![Image](img/image00767.jpeg)\n\n**存在性：** 你可以根据表达式在作用域中的数据来反映元素的存在性。例如，当作用域的值为假时，元素是不可见的。\n\
  \n\n\n\n\n22 显示消息：<input type=\"checkbox\" ng-model=\"checked\" />\n\n23  <p ng-if=\"\
  checked\" ng-bind=\"msg\"> </p>\n\n8. 在浏览器中打开 `directive_bind.html` 文件，并尝试更改单选按钮以观察矩形颜色的变化，查看列表中偶元素的样式，并通过复选框开启或关闭消息。图\
  \ 24.3 显示了生成的网页。\n\n![Image](img/image01023.jpeg)\n\n**图 24.3** 在 AngularJS 模板视图中实现数据绑定指令。\n\
  \n**代码列表 24.7 `directive_bind.js` 实现一个带有作用域模型的控制器以支持数据绑定指令**\n\n点击此处查看代码图片\n\n*\
  \ * *\n\n```javascript\n01 angular.module('myApp', []).\n02   controller('myController',\
  \ function($scope) {\n03    $scope.colors=['red','green','blue'];\n04    $scope.myStyle\
  \ = { \"background-color\": 'blue' };\n05    $scope.days=['Monday', 'Tuesday', 'Wednesday',\n\
  06                 'Thursday', 'Friday'];\n07    $scope.msg=\"Dynamic Message from\
  \ the model\";\n08   });\n```\n\n**代码列表 24.8 `directive_bind.html` 实现若干数据绑定指令的 AngularJS\
  \ 模板**\n\n点击此处查看代码图片\n\n* * *\n\n```html\n01 <!doctype html>\n02 <html ng-app=\"\
