  ```\n\n## 课程 18. 使用 jQuery UI 交互组件的高级交互\n\n**在本节中你将学习：**\n\n- 实现拖放功能\n- 让元素及其子元素可调整大小\n\
  - 如何使用边界框（bounding box）选择多个页面元素\n- 创建可排序的表格、列表和容器\n\n有一组特殊的 jQuery UI 组件旨在为各种元素提供通用交互。这些组件允许你让元素变得可拖拽和可放置，并为元素提供排序、框选和调整大小的功能。\n\
  \njQuery UI 交互组件可以附加到元素上，以提供一组丰富的预定义交互。以下章节将介绍不同的交互组件以及如何在你的网页中实现它们。\n\n### 介绍 jQuery\
  \ UI 交互\n\n所有的 jQuery UI 交互都基于两个主要组件：`jQuery.widget` 工厂和鼠标组件（mouse widget）。`jQuery.widget`\
  \ 工厂为所有组件提供了基准功能，包括创建、禁用、启用和选项设置。鼠标组件提供了与组件交互的基础鼠标交互，该组件捕获鼠标事件并允许组件与其交互。\n\n####\
  \ 复习 jQuery.widget 工厂\n\n`jQuery.widget` 工厂定义了一个所有 jQuery UI 组件都使用的接口。工厂的选项、方法和事件对所有组件都可用。[表\
  \ 18.1] 列出了工厂中定义并在所有组件中可用的方法和事件。\n\n**表格 18.1 所有 jQuery UI 组件可用的方法和事件**\n\n你可以在\
  \ [http://api.jqueryui.com/jQuery.widget/] 获得更多关于 `jQuery.widget` 工厂的信息。\n\n####\
  \ 理解鼠标交互组件\n\n鼠标交互组件会自动应用于所有组件上。通常情况下，你不需要与它进行大量交互。然而，它暴露了一些在某些情况下非常有选项。这些选项如下：\n\
  \n- `cancel`：取消特定元素的交互。例如，要取消 `#item1` 中 `class=\"label\"` 元素的鼠标交互，你可以使用以下代码：\n\n\
  ```\n$( \"#item1\" ).mouse( \"option\", \"cancel\", \".label\" );\n```\n\n- `delay`：延迟从\
  \ `mousedown` 事件发生后到交互发生之间的时间。例如，要为 `#item2` 的鼠标交互添加 1 秒的延迟，请使用以下代码：\n\n```\n$(\
  \ \"#item2\" ).mouse( \"option\", \"delay\", 1000 );\n```\n\n- `distance`：指定鼠标在\
  \ `mousedown` 事件发生后开始交互前必须移动的像素距离。例如，要为 `#item3` 的鼠标交互设置 10 像素的距离，请使用以下代码：\n\n```\n\
  $( \"#item3\" ).mouse( \"option\", \"distance\", 10 );\n```\n\n#### 使用拖放组件\n\n现在已经复习了组件接口和鼠标组件，准备好查看一些常用的\
  \ UI 组件——拖拽（draggable）和放置（droppable）。这些组件设计为协同工作。你可以定义一个元素为可拖拽，另一个元素为可放置。\n\n####\
  \ 使用 Draggable 组件拖拽元素\n\ndraggable 组件通过按住鼠标并移动将元素定义为可拖拽的。[表 18.2] 描述了更常用的选项。以下显示了在拖拽时带有\
  \ `cursor` 和 `opacity` 选项附加 `draggable` 组件的示例：\n\n```\n$(img1).draggable({cursor:\"\
  move\", opacity:.5});\n```\n\n**表格 18.2 常见的 Draggable 组件选项**\n\ndraggable 组件还提供了额外的事件，以便在拖拽开始、进行和停止时附加处理程序。[表\
  \ 18.3] 列出了你可以在 draggable 项目上访问的事件。以下显示了添加 `dragstop` 事件的示例，以便在项目掉落时应用 `bounce`\
  \ 效果：\n\n```\n$(drag1).on(\"dragstop\", function(){$(this).effect(\"bounce\", 1000);\
  \ });\n```\n\n**表格 18.3 Draggable 组件事件**\n\n### 动手尝试：在网页中添加拖拽图像\n\n在这个示例中，你实现了可拖拽的图像元素。每个图像的行为略有不同，如下步骤所示。该示例的目的是帮助你看到让元素变得可拖拽是多么简单。\n\
  \n1. 在 Eclipse 中创建 lesson18、lesson18/js 和 lesson18/css 文件夹，然后添加 lesson18/draggable_images.html、lesson18/js/draggable_images.js\
  \ 和 lesson18/css/draggable_images.css 文件。\n2. 将 [列表 18.1]、[18.2] 和 [列表 18.3] 所示的代码添加到\
  \ HTML 和 CSS 文件中。\n3. 打开 draggable_images.js 文件并添加 `.load()` 函数。\n4. 添加以下行。第 2 行向\
  \ `#drag1` 添加了 `draggable` 组件并设置拖拽时光标为移动；同时，拖拽时的不透明度（opacity）为 50%。第 3 行添加了一个 `dragstop`\
  \ 处理函数，在图像掉落时对其应用 `bounce` 效果：\n\n```\n$(\"#drag1\").draggable({cursor:\"move\"\
  , opacity:.5});\n$(\"#drag1\").on(\"dragstop\", function(){$(this).effect(\"bounce\"\
  , 1000); });\n```\n\n\n\n\n\n## 5. 添加以下行，在 `#drag2` 元素上实现 `draggable` 功能。将 `helper`\
  \ 选项设置为 `\"clone\"`，以便对象在拖动时保持在原位；添加一个 `dragstop` 事件处理器来通过动画实现从原始位置到 helper 克隆位置的位置改变。请注意\
  \ `offset` 是使用 `ui` 参数收集的：\n\n点击此处查看代码图片\n\n```javascript\n$(\"#drag2\").draggable({helper:\"\
  clone\"});\n$(\"#drag2\").on(\"dragstop\", function(e, ui){\n  $(\"#drag2\").animate(ui.offset);\
  \ });\n```\n\n## 6. 添加以下行，在 `#drag3` 元素上实现 `draggable` 功能。这次，你实现了一个 `drag` 处理器，在拖拽时用当前鼠标坐标更新段落元素。`dragstop`\
  \ 处理器将清除位置文本：\n\n点击此处查看代码图片\n\n```javascript\n$(\"#drag3\").draggable();\n$(\"#drag3\"\
  ).on(\"drag\", function(e){\n  $(this).children(\"p\").html(e.pageX+\", \"+e.pageY);\
  \ });\n$(\"#drag3\").on(\"dragstop\", function(e){\n  $(this).children(\"p\").html(\"\
  \"); });\n```\n\n## 7. 保存所有三个文件，然后在网络浏览器中打开 HTML 文档，如图图 18.1\n\n**图 18.1** 应用 jQuery\
  \ UI 拖拽组件在屏幕上移动图像。\n\n**代码列表 18.1 `draggable_images.html` 添加网页的 HTML 文档**\n\n点击此处查看代码图片\n\
