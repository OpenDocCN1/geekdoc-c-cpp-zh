  \ `<div>` 元素的位置来实现这一点。\n\n\n\n\n在本节中，你将学习 JavaScript 的基本结构和语法，以及如何使用 `jQuery` 来简化某些开发任务。本节的目的是帮助你熟悉\
  \ JavaScript 语言语法，这同时也也是 jQuery 的语言语法。\n\n## 在网页中添加 jQuery 和 JavaScript\n\n浏览器已经内置了对\
  \ JavaScript 的支持。这意味着你只需要将自己的 JavaScript 代码添加到网页中，即可实现动态网页。相比之下，jQuery 是一个额外的库，在添加\
  \ jQuery 脚本之前，你需要先将 jQuery 库添加到你的网页中。\n\n## 加载 jQuery 库\n\n由于 jQuery 库上是一个 JavaScript\
  \ 脚本，因此你使用 `<script>` 标签将 jQuery 加载到你的网页中。你可以将 jQuery 下载到你的代码目录并托管在你的 Web 服务器上，也可以使用在\
  \ [jQuery.com](http://jQuery.com) 提供的托管版本。以下语句显示了每种方法的示例；唯一的区别是第一个是从 jQuery CDN\
  \ 源加载的，而第二个是从 Web 服务器加载的：\n\n点击此处查看代码图像\n\n```html\n<script src=\"http://code.jquery.com/jquery-latest.min.js\"\
  ></script>\n<script src=\"includes/js/jquery-latest.min.js\"></script>\n```\n\n\
  * * *\n\n#### 注意事项\n\n记住，你需要在任何使用该库的脚本元素之前，放置用于加载 jQuery 库的 `<script>` 元素。否则，这些库将无法连接到\
  \ jQuery 代码。\n\n* * *\n\njQuery 库的下载可以在以下位置找到：\n\n[`http://jquery.com/download/`](http://jquery.com/download/)\n\
  \njQuery 库的托管链接可以在以下位置找到：\n\n[`http://code.jquery.com/`](http://code.jquery.com/)\n\
  \n## 实现你自己的 jQuery 和 JavaScript\n\njQuery 代码是作为 JavaScript 脚本的一部分实现的。要向你的网页中添加 jQuery\
  \ 和 JavaScript，首先添加一个加载 jQuery 库的 `<script>` 标签，然后添加带有你自定义代码的 `<script>` 标签。\n\n\
  JavaScript 代码可以添加到 `<script>` 元素内部，也可以让 `<script>` 标签的 `src` 属性指向独立 JavaScript 文档的位置。无论哪种方式，JavaScript\
  \ 都将以相同的方式加载。\n\n以下是一对加载 jQuery 然后后使用它的 `<script>` 语句示例。`document.write()` 函数只是将文本直接写入浏览器进行渲染：\n\
  \n点击此处查看代码图像\n\n```html\n<script src=\"http://code.jquery.com/jquery-latest.min.js\"\
  ></script>\n<script>\n  function writeIt(){\n    document.write(\"jQuery Version\
  \ \" + $().jquery + \" loaded.\");\n  }\n</script>\n```\n\n* * *\n\n### 备注\n\n`<script>`\
  \ 标签不需要添加到 HTML 文档的 `<head>` 部分；它们也可以添加到 `body` 中。将简单的脚本直接内联地添加到使用它们的 HTML 元素中是很有用的。\n\
  \n* * *\n\n## 访问 HTML 事件处理程序\n\n那么，在你将 JavaScript 添加到网页后，如何让它执行？答案是将其绑定到浏览器事件上。每当页面或元素加载、用户移动或点击鼠标或输入字符时，就会就会触发一个\
  \ HTML 事件。\n\n每个受支持的事件都是接收该事件的对象的属性。如果你将属性值设置为 JavaScript 函数，那么当事件触发时，浏览器将执行你的函数。\n\
  \n例如，以下代码将在 HTML 页面的 body 加载时执行 `writeIt()` 函数：\n\n```html\n<body onload=\"writeIt()\"\
  >\n```\n\n* * *\n\n### 自己尝试：实现 JavaScript 和 jQuery\n\n这些都是基本步骤。现在是时候亲自尝试了。使用以下步骤将\
  \ jQuery 添加到你的项目中并在网页中动态使用它：\n\n1. 在 Eclipse 中，创建一个名为 `lesson05` 的源文件夹。\n2. 在与 `lesson05`\
  \ 文件夹相同的目录下，添加一个名为 `js` 的额外目录。\n3. 现在在 `lesson05` 文件夹中创建一个名为 `jquery_version.html`\
  \ 的源文件。\n4. 添加常规的基本元素（html`, `head`, `body`）。\n5. 在 `<head>` 元素内部，添加以下行来加载你刚刚下载的库：\n\
  \n点击此处查看代码图像\n\n```html\n<script src=\"https://code.jquery.com/jquery-2.1.3.min.js\"\
  ></script>\n```\n\n6. 现在你可以添加你自己的 `<script>` 标签并带有以下代码，将 jQuery 版本打印到浏览器窗口中：\n\n\
  点击此处查看代码图像\n\n```html\n<script>\n  function writeIt(){\n    document.write(\"jQuery\
  \ Version \" + $().jquery + \" loaded.\");\n  }\n</script>\n```\n\n7. 为了让你的脚本在文档加载时执行，将\
  \ `writeIt()` 绑定到 `body` 事件。\n8. 在你的网络浏览器中打开该文件。输出应该与图 5.1 。\n\n点击此处查看代码图像\n\n```html\n\
  <!DOCTYPE html>\n<html\n<head>\n  <title>jQuery Version</title>\n  <meta charset=\"\
  utf-8\" />\n  <script src=\"https://code.jquery.com/jquery-2.1.3.min.js\"></script>\n\
  \  <script>\n    function writeIt(){\n      document.write(\"jQuery Version \" +\
  \ $().jquery + \" loaded.\");\n    }\n  </script>\n</head>\n<body onload=\"writeIt()\"\
  >\n</body>\n</html>\n```\n\n* * *\n\n* * *\n\n### 访问 DOM\n\nJavaScript（特别是 jQuery）最重要的方面之一是访问\
  \ DOM 的能力。访问 DOM 是你通过更改元素的样式、大小、位置和值来使网页动态化的。\n\n在接下来的章节中，你将学习如何通过传统的 JavaScript\
  \ 方法访问 DOM，以及使用 jQuery 使用更改进的方法。这些章节只是简要介绍。你将在后续中获得大量的练习。\n\n#### 使用传统 JavaScript\
  \ 访问 DOM\n\n传统上，JavaScript 使用全局 `document` 对象来访问网页中的元素。访问元素的简单方法是通过 `id` 直接引用它。例如，如果你有一个\
  \ `id=\"question\"` 的段落，可以通过以下 `getElementById()` 函数访问它：\n\n点击此处查看代码图像\n\n```javascript\n\
  var q = document.getElementById(\"question\");\n```\n\n...\n\n<p id=\"question\"\
  >你更倾向于哪种方法？</p>\n\n另一个访问 DOM 元素的有用 JavaScript 函数是 `getElementsByTagName()`。它返回一个与标签名称匹配的\
  \ DOM 元素数组。例如，要获取所有 `<p>` 元素的列表，请使用以下函数调用：\n\n```javascript\nvar paragraphs = document.getElementsByTagName(\"\
  p\");\n```\n\n#### 使用 jQuery 选择器访问 HTML 元素\n\n访问 HTML 元素是 jQuery 的最大优势之一。jQuery\
  \ 使用与 CSS 选择器非常相似的选择器来访问 DOM 中的一个或多个元素；因此才有了 jQuery。jQuery 返回的是单个元素或 jQuerified\
  \ 对象的数组。jQuerified 意味着 DOM 对象添加了额外的 jQuery 功能，使得操作更加容易。\n\n\n\n\n使用 jQuery 选择器的语法为\
  \ `$(selector).action()`，其中 `selector` 被替换为有效的选择器，而 `action` 被替换为附加到 DOM 元素上的 `jQueryified`\
  \ 动作。\n\n例如，以下命令可以找到 HTML 文档中所有的段落元素，并将 CSS `font-weight` 属性设置为 `bold`：\n\n点击此处查看代码图片\n\
  \n```javascript\n$(\"p\").css('font-weight', 'bold');\n```\n\n***\n\n### 动手尝试：使用\
  \ jQuery 和 JavaScript 访问 DOM 元素\n\n为了巩固概念，你将运行一个使用 jQuery 和 JavaScript 访问并修改 DOM\
  \ 元素的快速示例。按照以下步骤构建 Listing 5.2 所示的 HTML 文档：\n\n1. 在 `lesson05` 文件夹中创建一个名为 `dom_elements.html`\
  \ 的源文件。\n2. 添加基础元素（`html`、`head`、`body`）。\n3. 在 `<head>` 元素内部添加以下行来加载你刚刚下载的库：\n\
  \   点击此处查看代码图片\n   ```html\n   <script src=\"https://code.jquery.com/jquery-2.1.3.min.js\"\
  ></script>\n   ```\n4. 添加以下 `<script>` 元素，它同时使用 JavaScript 和 jQuery 方法访问 DOM。注意在使用\
  \ jQuery 时，两个动作是链式的。第一个动作设置 CSS `font-weight` 属性，第二个动作更改元素包含的文本。使用 JavaScript 时，你使用\
  \ `getElementById()` 方法，然后直接在 DOM 中设置 `innerHTML` 属性来更改浏览器中显示的文本：\n   点击此处查看代码图片\n\
  \   ```javascript\n   <script>\n     function writeIt(){\n       $(\"#heading\"\
  ).css('font-weight', 'bold').html(\"jQuery\");\n       var q = document.getElementById(\"\
  question\");\n       q.innerHTML = \"I Prefer jQuery!\";\n     }\n   </script>\n\
  \   ```\n5. 为了让脚本在文档加载时执行，使用以下行将 `writeIt()` 函数绑定到 `<body> onload` 事件上：\n   点击此处查看代码图片\n\
  \   ```html\n   <body onload=\"writeIt()\">\n   ```\n6. 在 `<body>` 中添加以下 `<p>` 元素，为\
  \ JavaScript 代码的访问提供容器：\n   点击此处查看代码图片\n   ```html\n   <p id=\"heading\">jQuery\
  \ or JavaScript</p>\n   <p id=\"question\">Which method to you prefer?</p>\n   ```\n\
  7. 保存文件并在浏览器中查看。输出应该与 Figure 5.2 类似。\n\n![Image](img/image00847.jpeg)\n\n**图 5.2**\
  \ 函数 `writeIt()` 在 body 加载时执行，并更改文本的内容和外观。\n\n**列表 5.2 使用 JavaScript 和 jQuery 访问\
  \ DOM 元素的非常基础示例**\n\n点击此处查看代码图片\n\n***\n\n```html\n<!DOCTYPE html>\n<html>\n  <head>\n\
  \    <title>DOM Changes</title>\n    <meta charset=\"utf-8\" />\n    <script src=\"\
  https://code.jquery.com/jquery-2.1.3.min.js\"></script>\n    <script>\n      function\
  \ writeIt(){\n        $(\"#heading\").css('font-weight', 'bold').html(\"jQuery\"\
  );\n        var q = document.getElementById(\"question\");\n        q.innerHTML\
  \ = \"I Prefer jQuery!\";\n      }\n    </script>\n  </head>\n  <body onload=\"\
  writeIt()\">\n    <p id=\"heading\">jQuery or JavaScript</p>\n    <p id=\"question\"\
  >Which method to you prefer?</p>\n  </body>\n</html>\n```\n\n***\n\n### 理解 JavaScript\
  \ 语法\n\n与其他任何语言一样，JavaScript 基于特定的单词，这些单词决定了代码的功能。\n\n**提示**：在 JavaScript 中，变量用于存储数据。\n\
  \n***\n\n### 创建变量\n\n从变量开始。变量用于存储数据。\n\n要定义变量，请使用 `var` 关键字并为其赋值一个值。例如：\n\n```javascript\n\
  var myData;\n```\n\n在声明变量后，你可以通过它的名称访问它。以下是一个示例：\n\n```javascript\nvar myString\
  \ = \"Some Text\";\nvar anotherString = \"Some Text\";\n```\n\n变量名应该以字母、`$` 或 `_`\
  \ 开头，且不能包含空格。还要记住变量名是区分大小写的。\n\n***\n\n### 理解数据类型\n\nJavaScript 使用数据类型来决定如何处理数据。\n\
  \n- **String（字符串）**：存储字符数据。字符数据通过单引号或双引号指定。\n  ```javascript\n  var myString = 'Some\
  \ Text';\n  var anotherString = \"Some Text\";\n  ```\n- **Number（数字）**：将数值数值数值。数字在计数、计算和比较中有用。\n\
  \  ```javascript\n  var myInteger = 1;\n  var cost = 1.33;\n  ```\n- **Boolean（布尔值）**：存储真或假的单个比特位。布尔值常用于标志位。\n\
  \  ```javascript\n  var yes = true;\n  var no = false;\n  ```\n- **Array（数组）**：索引数组是存储在单个变量名下的系列离散数据项。可以通过从零开始的索引\
  \ `[index]` 数组中的项。\n  ```javascript\n  var arr = [\"one\", \"two\", \"three\"];\n\
  \  var first = arr[0];\n  ```\n- **Associative Array/Objects（关联数组/对象）**：JavaScript\
  \ 确实支持关联数组的概念，即通过名称而不是索引值来访问数组中的项。然而，更好的方法是使用对象字面量。\n  ```javascript\n  var obj\
  \ = {\"name\":\"Brad\", \"occupation\":\"Hacker\", \"age\", \"Unknown\"};\n  ```\n\
  \n\n\n\n\n```javascript\nvar name = obj.name;\n```\n\n![Image](img/image0076.jpeg)\n\
  \n### Null (空)\n\n有时，你没有值要存储在变量中，可能是因为该变量尚未创建，或者你不再使用它。此时，你可以将变量设置为 `null`。这样，你就可以在代码中检查变量的值，并仅在它不为\
  \ `null` 时使用它：\n\n```javascript\nvar newVar = null;\n```\n\n***\n\n**注意** JavaScript\
  \ 是一种无类型语言，这意味着你不需要告诉浏览器变量是什么数据类型；解释器会自动为变量确定正确的数据类型。\n\n***\n\n## 使用运算符\n\nJavaScript\
  \ 运算符提供了修改变量值的能力。你已经对 `=` 运算符非常熟悉，因为你已经在书中多次使用过它。JavaScript 提供了几种运算符，它们可以分为两类——算术运算符和赋值运算符。\n\
  \n#### 算术运算符\n\n算术运算符用于在变量和直接值之间执行操作。表 5.1 显示了算术操作列表以及相应的的结果。\n\n![Image](img/image00848.jpeg)\n\
  \n**表 5.1 显示 JavaScript 的算术运算符以及以 y=4 为起始的结果**\n\n***\n\n**提示** `+` 运算符也可以用于将字符串或字符串与数字数字相加。这允许你快速拼接字符串并将数值数据加到输出字符串中。表\
  \ 5.1 显示，当相加数值值和字符串值时，数值值会被转换为字符串，然后两个字符串进行拼接。\n\n***\n\n#### 赋值运算符\n\n赋值运算符用于给变量赋值。你可能已经习惯了\
  \ `=` 运算符，但还有几种形式允许你在赋值时对数据进行处理。表 5.2 显示了赋值操作列表以及相应的的结果。\n\n![Image](img/image00849.jpeg)\n\
  \n**表 5.2 JavaScript 的赋值运算符以及以 x=10 为起始的结果**\n\n## 应用比较运算符和条件运算符\n\n条件判断是将逻辑应用于你的应用程序的一种方式，使得某些代码仅在正确的条件下才会执行。这是通过对变量值应用比较逻辑来实现的。以下章节描述了\
  \ JavaScript 中提供的比较方法以及如何在条件语句中使用它们。\n\n#### 比较运算符\n\n比较运算符评估两部分数据，如果评估正确则返回 `true`，如果评估错误则返回\
  \ `false`。比较运算符将运算符左侧的值与右侧的值进行比较。\n\n帮助理解比较的最简单方法是提供一个包含示例的列表。表 5.3 显示了比较运算符列表以及一些示例。\n\
  \n![Image](img/image00850.jpeg)\n\n**表 5.3 JavaScript 的比较运算符以及以 x=10 为起始的结果**\n\n\
  你可以使用逻辑运算符将多个比较链在一起。表 5.4 显示了逻辑运算符列表以及如何使用它们将比较链起来。\n\n![Image](img/image00851.jpeg)\n\
  \n**表 5.4 JavaScript 的比较运算符以及以 x=10 和 y=5 为起始的结果**\n\n### If\n\n`if` 语句允许你根据比较的评估结果来分离代码执行。语法在如下代码所示，其中条件运算符位于\
  \ `()` 括号中，如果条件为 `true` 则执行的代码位于 `{}` 括号中：\n\n```javascript\nif(x==5){\n  do_something();\n\
  }\n```\n\n除了执行 `if` 语句块内的代码外，你还可以指定一个 `else` 块，它仅在条件为 `false` 时被执行。例如：\n\n```javascript\n\
  if(x==5){\n  do_something();\n} else {\n  do_something_else();\n}\n```\n\n你还可以将\
  \ `if` 语句链在一起。要做到这一点，请添加一个条件语句以及 `else` 语句。例如：\n\n```javascript\nif(x<5){\n  do_something();\n\
  } else if(x<10) {\n  do_something_else();\n} else {\n  do_nothing();\n}\n```\n\n\
  #### switch\n\n另一种类型的条件逻辑是 `switch` 语句。`switch` 语句允许你对表达式进行一次，然后根据值执行多个代码段之一。\n\n\
  `switch` 语句的语法如下：\n\n点击此处查看代码图像\n\n```javascript\nswitch(expression){\n  case value:\n\
  \    <要执行的代码>\n    break;\n  case value2:\n    <要执行的代码>\n    break;\n  default:\n\
  \    <如果不是 value 或 value2 则执行的代码>\n}\n```\n\n这是正在发生的过程。`switch` 语句将完全评估表达式并获取一个值。该值可以是字符串、数字或对象。然后，`switch`\
  \ 值将通过 `case` 语句与每个值进行比较。如果值匹配，则执行 `case` 语句中的代码。如果没有匹配，则执行 `default` 代码。\n\n**注意**\
  \ 通常情况下，`switch` 语句将完全评估表达式并获取一个值。该值可能是字符串、数字或对象。这是 `switch` 语句的结果。\n\n### 尝试一下：在\
  \ JavaScript 中应用条件判断\n\n为了帮助你巩固 JavaScript 逻辑，请使用以下步骤将条件逻辑构建到网页中。最终的 HTML 文档位于 part0016_ch05tab03.getHours()`\
  \ 获取 `lesson` 值。该代码使用 `if` 语句判断时间并执行两件事：在屏幕上写入问候语并设置 `timeOfDay` 变量的值：\n\n点击此处查看代码图像\n\
  \n```javascript\n<script>\nfunction writeIt(){\n  var lesson = new Date().getHours();\n\
  \  var timeOfDay;\n  if(lesson>=7 && lesson<12){\n    document.write(\"早上好!\");\n\
  \    timeOfDay=\"morning\";\n  } else if(lesson>=12 && lesson<18) {\n    document.write(\"\
  你好!\");\n    timeOfDay=\"day\";\n  } else {\n    document.write(\"晚上好!\");\n   \
  \ timeOfDay=\"night\";\n  }\n}\n</script>\n```\n\n6. 现在添加如下 `switch` 语句，使用 `timeOfDay`\
  \ 的值来决定在网页上显示哪个图像：\n\n点击此处查看代码图像\n\n```javascript\nswitch(timeOfDay){\n  case \"\
  morning\":\n  case \"day\":\n    document.write(\"<img src='images/day.png' />\"\
  );\n    break;\n  case \"night\":\n    document.write(\"<img src='images/night.png'\
  \ />\");\n    break;\n  default:\n    document.write(\"<img src='images/day.png'\
  \ />\");\n}\n```\n\n7. 保存文件并在浏览器中查看。输出应该与 图 5.3 相似，取决于具体的时间。\n\n![Image](img/image00852.jpeg)\n\
  \n**图 5.3 writeIt() 函数在 body 加载时执行，并更改显示的问候语和图像**\n\n**列表 5.3 if_logic.html 在 JavaScript\
  \ 中使用条件逻辑的简单示例**\n\n点击此处查看代码图像\n\n***\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n\
  \  <title>If Logic</title>\n```\n\n\n\n\n\n```html\n<meta charset=\"utf-8\" />\n\
  <script>\n  function writeIt(){\n    var hour = new Date().getHours();\n    var\
  \ timeOfDay;\n    if(hour>=7 && hour<12){\n        document.write(\"Good Morning!\"\
  );\n        timeOfDay=\"morning\";\n    } else if(hour>=12 && hour<18) {\n     \
  \   document.write(\"Good Day!\");\n        timeOfDay=\"day\";\n    } else {\n \
  \       document.write(\"Good Night!\");\n        timeOfDay=\"night\";\n    }\n\
  \    switch(timeOfDay){\n      case \"morning\":\n      case \"day\":\n        document.write(\"\
  <img src='../images/day.png' />\");\n        break;\n      case \"night\":\n   \
  \     document.write(\"<img src='../images/night.png' />\");\n        break;\n \
  \     default:\n        document.write(\"<img src='../images/day.png' />\");\n \
  \   }\n  }\n</script>\n</head>\n<body onload=\"writeIt()\">\n</body>\n</html\n```\n\
  \n## 实现循环\n\n循环是一种多次执行同一段代码的方法。当你需要对一组 DOM 对象执行相同任务，或者当你动态创建一个项目列表时，这种方法非常有用。\n\n\
  JavaScript 提供了执行 `for` 和 `while` 循环的功能。接下来的章节将介绍如何在你的 JavaScript 中实现循环。\n\n## while\
  \ 循环\n\nJavaScript 中最基本的循环类型是 `while` 循环。`while` 循环测试一个表达式并继续执行其 `{}` 括号中的代码，直到该表达式求值为假。\n\
  \n例如，以下 `while` 循环将执行到 `i` 的值等于 5 为止：\n\n点击此处查看代码\n\n```javascript\nvar i = 1;\n\
  while (i<5){\n  document.write(\"Iteration \" + i + \"<br>\");\n  i++;\n}\n```\n\
  \n浏览器的输出如下：\n\nIteration 1\nIteration 2\nIteration 3\nIteration 4\n\n## do/while\
  \ 循环\n\n另一种 `while` 循环类型是 `do/while` 循环。如果你始终希望至少执行一次循环中的代码，并且在代码执行一次之前无法测试表达式，那么这种循环很有用。\n\
  \n例如，以下 `do/while` 循环将执行到 `day` 的值等于 Wednesday（周三）为止：\n\n点击此处查看代码\n\n```javascript\n\
  var days = [\"Monday\", \"Tuesday\", \"Wednesday\", \"Thursday\", \"Friday\"];\n\
  var i=0;\ndo{\n  var day=days[i++];\n  document.write(\"It's \" + day + \"<br>\"\
  );\n} while (day != \"Wednesday\");\n```\n\n浏览器的输出如下：\n\nIt's Monday\nIt's Tuesday\n\
  It's Wednesday\n\n## for 循环\n\nJavaScript `for` 循环允许你通过一个将三个语句合并为一个 `for` 语句来执行特定次数的代码：\n\
  \n点击此处查看代码\n\n```javascript\nfor (statement 1; statement 2; statement 3;){\n  code\
  \ to be executed;\n}\n```\n\n`for` 语句如下所示使用这三个语句：\n\n- `statement 1`：在循环开始前执行一次且不再执行。它用于初始化将在循环中使用的变量。\n\
  - `statement 2`：在循环的每次迭代之前评估的表达式。如果该表达式求值为真，则执行循环；否则，`for` 循环结束。\n- `statement 3`：在循环内代码执行后的每次迭代执行。这通常用于递增\
  \ `statement 2` 中使用的计数器。\n\n为了说明 `for` 循环，请查看以下示例。该示例不仅说明了基本的 `for` 循环，还说明了将一个循环嵌套在另一个循环内部的能力：\n\
  \n点击此处查看代码\n\n```javascript\nfor (var x=1; x<=3; x++){\n  for (var y=1; y<=3; y++){\n\
  \    document.write(x + \" X \" + y + \" = \" + (x*y) + \"<br>\");\n  }\n}\n```\n\
  \n网页浏览器的输出为：\n\n1 X 1 = 1\n1 X 2 = 2\n1 X 3 = 3\n2 X 1 = 2\n2 X 2 = 4\n2 X 3 = 6\n\
  3 X 1 = 3\n3 X 2 = 6\n3 X 3 = 9\n\n## for/in 循环\n\n另一种 `for` 循环类型是 `for/in` 循环。`for/in`\
  \ 循环可以在任何迭代的数据类型上执行。大多数情况下，你将在数组和对象使用 `for/in` 循环。下面的示例说明了在简单数组上 `for/in` 循环的语法和行为：\n\
  \n点击此处查看代码\n\n```javascript\nvar days = [\"Monday\", \"Tuesday\", \"Wednesday\"\
  , \"Thursday\", \"Friday\"];\nfor (var idx in days){\n  document.write(\"It's \"\
  \ + days[idx] + \"<br>\");\n}\n```\n\n注意 `idx` 变量从开始到调整。输出是：\n\nIt's Monday\nIt's\
  \ Tuesday\nIt's Wednesday\nIt's Thursday\nIt's Friday\n\n## 中断循环\n\n在处理循环时，有时我们需要中断执行。通过使用\
  \ `break` 和 `continue` 关键字有两种方法可以做到这一点。`break` 关键字会完全停止 `for` 或 `while` 循环的执行。而\
  \ `continue` 关键字则跳到下一次迭代。考虑以下示例：\n\n当 `day` 为 Wednesday 时使用 `break`：\n\n点击此处查看代码\n\
  \n```javascript\nvar days = [\"Monday\", \"Tuesday\", \"Wednesday\", \"Thursday\"\
  , \"Friday\"];\nfor (var idx in days){\n  if (days[idx] == \"Wednesday\")\n    break;\n\
  \  document.write(\"It's \" + days[idx] + \"<br>\");\n}\n```\n\n当值为 Wednesday 时，循环完全停止：\n\
  \nIt's Monday\nIt's Tuesday\n\n当 `day` 为 Wednesday 时使用 `continue`：\n\n点击此处查看代码\n\
  \n```javascript\nvar days = [\"Monday\", \"Tuesday\", \"Wednesday\", \"Thursday\"\
  , \"Friday\"];\nfor (var idx in days){\n  if (days[idx] == \"Wednesday\")\n    continue;\n\
  }\n```\n\n注意由于 `continue`，写入没有执行；但是循环执行执行了：\n\nIt's Monday\nIt's Tuesday\nIt's Thursday\n\
  It's Friday\n\n# 创建函数\n\nJavaScript 最重要的部分之一是让代码可重用。为了实现这一点，你将代码组合成执行特定任务的函数。函数是组合在一起的系列代码语句，并给了一个名称。\n\
  \n## 定义函数\n\n函数使用 `function` 关键字定义，后面紧跟函数的名称、`()` 括号中的零或多个参数，以及 `{}` 括号中的一个或多个代码语句。例如，以下是编写“Hello\
  \ World”的函数定义：\n\n点击此处查看代码\n\n```javascript\nfunction myFunction(){\n  document.write(\"\
  Hello World\");\n}\n```\n\n要执行 `myFunction()`，你只需要在主 JavaScript 或另一个函数内部添加以下行：\n\
  \n`myFunction()`\n\n## 向函数传递变量\n\n通常你需要向函数传递特定值以便在执行代码时使用。值以逗号分隔的形式传递给函数。函数定义在 `()`\
  \ 括号中需要一组与传递数量相匹配的变量名称。例如，以下函数接受两个参数 `name` 和 `city`，并使用它们来构建输出字符串：\n\n点击此处查看代码\n\
  \n```javascript\nfunction greeting(name, city){\n  document.write(\"Hello \" + name);\n\
  \  document.write(\". How is the weather in \" + city);\n}\n```\n\n\n\n\n\n要调用 `greeting()`\
  \ 函数，我们需要传入一个 `name` 值和一个 `city` 值。该值可以是一个直接值，也可以是之前定义的变量。为了说明这一点，以下代码将使用 `name`\
  \ 变量和 `city` 的直接字符串来执行 `greeting()` 函数：\n\n```javascript\nvar name = \"Brad\";\n\
  \ngreeting(name, \"Florence\");\n```\n\n### 函数的返回值\n\n通常，函数需要向调用它的代码返回一个值。添加 `return`\
  \ 关键字并后跟一个变量或值，将从函数中返回该值。例如，以下代码调用了一个函数来格式化字符串，将函数返回的值赋值给变量，然后将该值写入浏览器：\n\n点击此处查看代码图片\n\
  \n```javascript\nfunction formatGreeting(name, city){\n  var retStr = \"\";\n  retStr\
  \ += \"Hello <b>\" + name + \"</b><br>\";\n  retStr += \"Welcome to \" + city +\
  \ \"!\";\n  return retStr;\n}\n\nvar greeting = formatGreeting(\"Brad\", \"Rome\"\
  );\ndocument.write(greeting);\n```\n\n你可以在函数中包含多个 `return` 语句。当函数遇到 `return` 语句时，函数的代码执行立即停止。如果\
  \ `return` 语句包含要返回的值，则返回该值。以下示例显示了一个测试输入的函数，如果输入为零则立即返回：\n\n点击此处查看代码图片\n\n```javascript\n\
  function myFunc(value){\n  if (value == 0)\n    return;\n  code_to_execute_if_value_nonzero;\n\
  }\n```\n\n***\n\n### 动手尝试：创建 JavaScript 函数\n\n为了巩固函数，请按照以下步骤将一些函数集成到 JavaScript\
  \ 中。这些步骤将引导你完成创建函数、调用其执行代码以及处理返回的结果的过程：\n\n1. 在 `lesson05` 文件夹中创建一个名为 `js_functions.html`\
  \ 的源文件。\n2. 添加常用的基础元素（html, head, body）。\n3. 在 `<head>` 元素中添加 `<script>` 标签以存放 JavaScript\
  \ 代码。\n4. 在脚本开头插入以下对象字面量定义。该对象将行星名称作为属性，且每个英雄名称都是指向反派数组的引用：\n\n点击此处查看代码图片\n\n```javascript\n\
  var superData = {\"Super Man\":[\"Lex Luther\"],\n                 \"Bat Man\":[\"\
  Joker\", \"Riddler\",],\n                 \"Spider Man\":[\"Green Goblin\", \"Vulture\"\
  , \"Carnage\"],\n                 \"Thor\":[\"Loki\", \"Frost Giants\"]};\n```\n\
  \n5. 添加以下由 `onload` 事件调用的函数。在该函数中，你使用嵌套的 `for`/`in` 循环来遍历 `superData` 属性。外层循环获取英雄\
  \ `name`，内层循环遍历 `villains` 数组的索引：\n\n点击此处查看代码图片\n\n```javascript\nfunction writeIt(){\n\
  \  for (hero in superData){\n    var villains = superData[hero];\n    for (villainIdx\
  \ in villains){\n      var villain = villains[villainIdx];\n      var listItem =\
  \ makeListItem(hero, villain);\n      document.write(listItem);\n    }\n  }\n}\n\
  ```\n\n6. 注意在 `writeIt()` 函数的第 16 行是对 `makeListItem()` 的调用。该函数需要返回一个可以在第 17 行用于写入文档的值。添加以下代码来创建该函数。该函数接受两个参数：`name`\
  \ 和 `value`，然后生成一个 HTML 字符串来创建 `<li>` 并返回该字符串：\n\n点击此处查看代码图片\n\n```javascript\n\
  function makeListItem(name, value){\n  var itemStr = \"<li>\" + name + \":&nbsp;\"\
  \ + value + \"</li>\";\n  return itemStr;\n}\n```\n\n7. 保存文件并在网页浏览器中打开它。你应该能在 图\
  \ 5.4 中看到结果。你刚刚创建了 JavaScript 函数：一个不接受参数也不返回值的函数，另一个接受两个参数并返回格式化字符串的函数。\n\n**图 5.4**\
  \ 执行函数 `writeIt()`，它遍历 `superData` 对象并调用 `makeListItem()` 函数将行星名称格式化为 `<li>` 元素。\n\
  \n**列表 5.4 js_functions.html 简单的 JavaScript 函数示例**\n\n点击此处查看代码图片\n\n```html\n<!DOCTYPE\
  \ html>\n<html>\n<head>\n  <title>JavaScript Functions</title>\n  <meta charset=\"\
  utf-8\" />\n  <script>\n    var superData = {\"Super Man\":[\"Lex Luther\"],\n \
  \                    \"Bat Man\":[\"Joker\", \"Riddler\",],\n                  \
  \   \"Spider Man\":[\"Green Goblin\", \"Vulture\", \"Carnage\"],\n             \
  \        \"Thor\":[\"Loki\", \"Frost Giants\"]};\n    function writeIt(){\n    \
  \  for (hero in superData){\n        var villains = superData[hero];\n        for\
  \ (villainIdx in villains){\n          var villain = villains[villainIdx];\n   \
  \       var listItem = makeListItem(hero, villain);\n          document.write(listItem);\n\
  \        }\n      }\n    }\n    function makeListItem(name, value){\n      var itemStr\
  \ = \"<li>\" + name + \":&nbsp;\" + value + \"</li>\";\n      return itemStr;\n\
  \    }\n  </script>\n</head>\n<body onload=\"writeIt()\">\n</</body>>\n</html>\n\
  ```\n\n***\n\n***\n\n#### 理解变量作用域\n\n当你开始在 JavaScript 应用中添加条件、函数和循环后，你需要理解变量作用域。变量作用域简单来说就是：“在当前执行的代码行中，特定变量名的值是什么。”\n\
  \nJavaScript 允许你定义变量的全局和局部版本。全局版本定义在主 JavaScript 代码中，局部版本定义在函数内部。当你在函数内部定义局部版本时，内存中会创建一个新变量。在函数内部，将引用该局部版本。在函数外部，你将引用全局版本。\n\
  \n为了更好地理解变量作用域，请考虑以下代码：\n\n点击此处查看代码图片\n\n```javascript\n<script>\n  var myVar =\
  \ 1;\n  function writeIt(){\n    var myVar = 2;\n    document.write(myVar);\n  \
  \  writeMore();\n  }\n  function writeMore(){\n    document.write(myVar);\n  }\n\
  </script>\n```\n\n全局变量 `myVar` 定义在第 2 行。在第 4 行，在 `writeIt()` 函数中定义了一个局部版本。因此，第 5\
  \ 行将写入文档。然后于第 6 行，调用了 `writeMore()`。因为 `writeMore()` 中没有定义 `myVar` 的局部版本，第 9 行将写入全局\
  \ `myVar` 的值。\n\n#### 添加错误处理\n\nJavaScript 编码的重要部分是对可能问题的情况添加错误处理。默认情况下，如果由于 JavaScript\
  \ 中的问题导致发生代码异常，脚本将失败且停止加载。这通常不是期望的行为。\n\n#### Try/Catch 块\n\n为了防止你的代码完全崩溃，请使用 `try`/`catch`\
  \ 块来处理代码内部的问题。如果 JavaScript 在执行 `try/catch` 块中的代码时遇到错误，它将跳转并执行 `catch` 部分，而不是停止整个脚本。如果没有发生错误，则将执行所有的\
  \ `try` 内容。\n\n例如，以下 `try/catch` 块将执行替换 `your_code_here` 的任何代码。如果在执行该代码时发生错误，错误信息以及字符串“:\
  \ 发生在加载脚本时”将被写入文档：\n\n\n\n\n\n点击此处查看代码图片\n\n```\ntry {\n    your_code_here\n} catch\
  \ (err) {\n  document.write(err.message + \": happened when loading the script\"\
  );\n}\n```\n\n### 抛出你自己的错误\n\n你也可以使用 `throw` 语句抛出自己的错误。以下代码说明了如何在函数中添加 `throws`\
  \ 来 `throw` 一个错误，即使没有发生脚本错误：\n\n点击此处查看代码图片\n\n```javascript\n01 <script>\n02   function\
  \ sqrRoot(x) {\n03     try {\n04        if(x==\"\")    throw \"Can't Square Root\
  \ Nothing\";\n05        if(isNaN(x)) throw \"Can't Square Root Strings\";\n06  \
  \      if(x<0)      throw \"Sorry No Imagination\";\n07        return \"sqrt(\"\
  +x+\") = \" + Math.sqrt(x);\n08      } catch(err){\n09        return err;\n10  \
  \    }\n11    }\n12   function writeIt(){\n13      document.write(sqrRoot(\"four\"\
  ) + \"<br>\");\n14      document.write(sqrRoot(\"\") + \"<br>\");\n15      document.write(sqrRoot(\"\
  4\") + \"<br>\");\n16      document.write(sqrRoot(\"-4\") + \"<br>\");\n17   }\n\
  18 </script>\n```\n\n函数 `sqrRoot()` 接受参数 `x`。它会测试 `x` 以验证它是否为正数，并返回带有 `x` 平方的字符串。如果\
  \ `x` 不是正数，则会抛出相应的错误并返回给 `writeIt()`。\n\n### 使用 finally\n\n异常处理中的另一个有用工具是 `finally`\
  \ 关键字。`finally` 关键字可以添加到 `try`/catch` 块的末尾。在执行 `try`/catch` 块之后，`finally` 块始终会被执行。无论是否发生错误并捕获，或者\
  \ `try` 块是否完全执行，结果都是如此。\n\n以下是在网页中使用 `finally` 块的示例：\n\n点击此处查看代码图片\n\n```javascript\n\
  function testTryCatch(value){\n  try {\n    if (value < 0){\n      throw \"too small\"\
  ;\n    } else if (value > 10){\n      throw \"too big\";\n    }\n    your_code_here\n\
  \  } catch (err) {\n    document.write(\"The number was \" + err.message);\n  }\
  \ finally {\n    document.write(\"This is always written.\");\n  }\n}\n```\n\n###\
  \ 总结\n\n在本节中，你学习了将 jQuery 和 JavaScript 添加到网页中的基础知识。描述了 JavaScript（以及随 jQuery）中使用的基本数据类型。你学习了在\
  \ JavaScript 应用中应用条件逻辑的基本语法。你还学习了如何将 JavaScript 应用划分为可以在其他地方重用的函数。最后，你学习了在浏览器接收到异常之前在脚本中处理\
  \ JavaScript 错误的方法。\n\n### 问答\n\n**Q. 在字符串操作中，你何时应该使用正则表达式？**\n\n**A.** 这取决于你对正则表达式的理解。频繁使用正则表达式并良好理解语法的人几乎总是倾向于使用正则表达式，因为它们非常多功能。如果你不熟悉正则表达式，需要时间来研究语法，因此你只会在需要时才使用它们。底线是，如果你需要频繁处理字符串，那么学习正则表达式是绝对值得的。\n\
  \n**Q. 我可以同时加载多个版本的 jQuery 吗？**\n\n**A.** 可以，但实际上没有理由这么做。最后加载的将覆盖上一个版本的功能。第一个版本中任何未被覆盖的函数可能会因为库的不匹配而变得完全不可预测。最好的办法是针对特定版本进行开发和测试，然后更新到该版本。\n\
  \n\n\n\n\n```javascript\nvar x = new Number(\"5\");\n```\n\n### 访问对象属性\n\n几乎所有的\
  \ JavaScript 对象都有可以通过标准的点命名语法进行访问的值。例如，考虑一个变量名为 `user` 的对象，它包含一个名为 `firstName` 的属性。以下语句访问了\
  \ `user` 对象中 `firstName` 属性的值：\n\n`user.FirstName`\n\n### 访问对象方法\n\n许多 JavaScript\
  \ 对象还拥有方法。对象方法是以作为名称的形式附加到对象上的函数。可以使用点语法通过引用方法名来调用该函数。例如，如果一个名为 `user` 的对象有一个名为\
  \ `getFullName()` 的方法，则可以通过以下语句调用该函数：\n\n`user.getFullName()`\n\n### 为对象分配新值和方法\n\
  \nJavaScript 对象最酷的特性之一是，你可以在任何时候使用点命名语法为它们分配新的属性值和方法值。无论它是内置对象还是你自定义的某个对象。之后可以使用相同的点命名语法来访问该值。\n\
  \n以下是一个向我们在前几个示例中一直在使用的主文档对象添加一个方法和一个属性的示例。请注意，我们定义了一个简单的函数，将 `document.me` 属性写入浏览器。然后，我们将值分配给\
  \ `document.me` 以及不带 `()` 的函数 `writeMe()`，作为 `document.writeMe`。此时，我们可以调用 `document.writeMe`\
  \ 并访问属性 `document.me`：\n\n点击此处代码图片\n\n```html\n<script>\n  function writeMe(){\n\
  \    document.write(document.me);\n  }\n  document.me = \"Brad Dayley\";\n  document.writeMe\
  \ = writeMe;\n  document.writeMe();\n</script>\n```\n\n**注意**\n\n如果你为对象分配新值，同名的现有属性或方法将被覆盖。在为对象分配值时，请小心不要意外覆盖现有的属性或方法。\n\
  \n### 了解内置对象\n\nJavaScript 拥有几个提供特定功能的内置对象。使用这些内置对象将节省时间，因为它们提供了已经编写并测试的方法来处理数据。接下来的章节没有包含所有的\
  \ JavaScript 对象，但涵盖了本书中所需的那些。\n\n#### Number\n\n`Number` 对象提供了在处理数字时非常有用的功能。创建一个数字对象与仅仅给变量分配一个数字不同。当你创建一个\
  \ `Number` 对象时，你还获得了一组可以配合的方法。\n\n`Number` 对象提供了表 6.1 中列出的方法。根据以下对象的创建，参考表 6.1 中这些这些方法的输出结果：\n\
  \n点击此处代码图片\n\n```javascript\nvar x = new Number(\"5.55555555\");\n```\n\n![Image](img/image00854.jpeg)\n\
  \n**表 6.1 使用内置 Number 对象方法**\n\n我们选择将数字 `5.555555555` 作为字符串传入而不是数字，用以说明 `Number()`\
  \ 可以接受字符串、数字或代表字符串或数字的变量。该字符串必须是数字字符串，否则 `Number` 对象的值将为 `NaN`（不是数字）。\n\n在创建 `Number`\
  \ 对象之前测试值是一个好主意。若要测试一个值并判断它是否为数字，请使用 `isNaN()` 函数。如果该值是数字或可以转换为数字的字符串，`isNaN()`\
  \ 返回 `false`。\n\n**注意**\n\n在检查数字时，可以使用十六进制字符串。这在你处理十六进制颜色值（如 #e0ffff）时非常有用。在 JavaScript\
  \ 中使用的字符串格式为“0xe0ffff”。\n\n#### String\n\n`String` 对象是 JavaScript 中用得最频繁的。每当你定义一个具有字符串数据类型的变量时，JavaScript\
  \ 都会自动创建一个 `String` 对象。例如：\n\n```javascript\nvar myStr = \"Teach Yourself jQuery\
  \ & JavaScript in 24 Lessons\";\n```\n\n当你创建一个字符串时，某些特殊字符不能直接添加到字符串中。对于这些字符，JavaScript\
  \ 提供了一组在表 6.2 中描述的转义代码。\n\n![Image](img/image00855.jpeg)\n\n**表 6.2 JavaScript 字符串中使用的转义代码**\n\
  \n要获取字符串的长度，可以使用 `String` 对象的 `length` 属性，例如：\n\n```javascript\nvar numOfChars =\
  \ myStr.length;\n```\n\n`String` 对象有多个函数，允许你以各种方式访问和操作字符串。字符串操作的方法在表 6.3 中描述。\n\n\
  ![Image](img/image00856.jpeg)![Image](img/image00857.jpeg)\n\n**表 6.3 用于操作 JavaScript\
  \ 字符串的 String 对象方法**\n\n为了让你开始使用 `String` 对象提供的功能，接下来的章节描述了可以使用 `String` 对象完成的一些常见任务。\n\
  \n#### 合并字符串\n\n多个字符串可以通过 `+` 组合，也可以通过 `concat()` 函数组合。例如，在以下代码中，`sentence1` 和 `sentence2`\
  \ 是相同的：\n\n```javascript\nvar word1 = \"Today \";\nvar word2 = \"is \";\nvar word3\
  \ = \"tomorrow \";\nvar word4 = \"yesterday.\";\nvar sentence1 = word1 + word2 +\
  \ word3 + word4;\nvar sentence2 = word1.concat(word2, word3, word4);\n```\n\n####\
  \ 搜索字符串\n\n判断一个字符串是否是另一个的子字符串，可以使用 `indexOf()`。例如，以下代码仅在包含“think”时写入字符串：\n\n```javascript\n\
  var myStr = \"I think, therefore I am.\";\nif (myStr.indexOf(\"think\") != -1){\n\
  \  document.write(myStr);\n}\n```\n\n##### 替换单词\n\n另一个常见的 `String` 对象任务是替换子字符串。要替换字符串中的单词，使用\
  \ `replace()` 方法。以下代码将 `\"<username>\"` 替换为变量 `username`：\n\n```javascript\nvar\
  \ username = \"Brad\";\nvar output = \"<username> please enter your password: \"\
  ;\noutput = output.replace(\"<username>\", username);\n```\n\n#### 分割字符串\n\n字符串的一个常见任务是使用分隔符将其分割为数组。例如，以下代码使用\
  \ `\":\"` 分隔符分割时间字符串：\n\n```javascript\nvar t = \"12:10:36\";\nvar tArr = t.split(\"\
  :\");\nvar lesson = tArr[0];\nvar minute = tArr[1];\nvar second = tArr[2];\n```\n\
  \n### 实践：在 JavaScript 中操作字符串\n\n在本节中，你将逐步通过操作某些字符串来生成一个简单的填空游戏。这只是一个基础示例，但它应该有助于巩固对`String`对象的理解。完整代码见列表\
  \ 6.1，结果所示图 6.1。\n\n![Image](img/image0058.jpeg)\n\n**图 6.1** 输出的填空文本。\n\n1. 在 Eclipse\
