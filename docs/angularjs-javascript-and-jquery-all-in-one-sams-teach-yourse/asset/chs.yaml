  23 </html>\n```\n\n***\n\n***\n\n#### 作用域与模板之间的关系\n\n模板为 AngularJS 应用程序提供视图。HTML\
  \ 元素使用 `ng-controller` 属性定义为控制器。在控制器 HTML 元素及其元素内部，该控制器的作用域用于表达式和其他功能。\n\n作用域中的值可以通过\
  \ `ng-model` 指令直接链接到模板中的 `<input>`、`<select>` 和 `<textarea>` 元素。该指令将元素的值链接到作用域属性。当用户更改值时，作用域会自动更新。例如，以下代码将\
  \ `<input>` 元素的数字值链接到名为 `valueA` 的作用域：\n\n[点击此处查看代码图像\n\n```html\n<input type=\"\
  number\" ng-model=\"valueA\" />\n```\n\n你可以使用 `{{expression}}` 语法在模板中添加作用域属性甚至函数。括号内的代码将被求值，结果将在渲染视图中显示。例如，如果作用域包含\
  \ `valueA` 和 `valueB` 属性，你可以在表达式中引用这些属性：\n\n```html\n{{valueA + valueB}}\n```\n\n\
  \n\n\n\n在模板中定义 AngularJS 指令时，你可以使用作用域（scope）属性和函数。例如，`ng-click` 指令将浏览器点击事件绑定到名为\
  \ `addValues()` 的作用域中的函数，并将作用域中属性 `valueA` 和 `valueB` 的值传递过去：\n\n点击此处代码图片\n\n```html\n\
  <span ng-click=\"addValues(valueA, valueB)\">Add Values{{valueA}} & {{valueB}}</span>\n\
  ```\n\n注意，在这段代码中，`{{}}` 括号是必须的。然而，在调用 `addValues()` 函数时，并不需要。这是因为 `ng-click` 和其他\
  \ AngularJS 指令会自动求值为表达式。\n\n***\n\n## 动手一试：查看 AngularJS 模板中的作用域值\n\n在这个示例中，你将所有这些概念整合到一个非常基础的示例中，以便理解模型（model）与作用域之间的关系。列表\
