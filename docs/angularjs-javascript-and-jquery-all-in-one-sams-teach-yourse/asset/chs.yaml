  \ `cookies` 的访问。\n\n你看到了如何打开和关闭浏览器窗口。通过 JavaScript，你还学习了如何创建基本的弹出窗口，以便你与用户进行交互。\n\
  \n### 问答\n\n**问。有方法可以找到正在使用的操作系统和浏览器吗？**\n\n**答。** 是的。`navigator` 对象会在 `window.navigator.appCodeName`\
  \ 属性中显示浏览器。你也可以使用 `window.navigator.platform` 获取操作系统。\n\n### 工作\n\n工作坊由一组问题和答案组成，旨在巩固你对本节所涵盖材料的理解。在看答案之前尝试回答问题。\n\
  \n#### 测验\n\n**1。JavaScript 支持的三种弹出框类型是什么？**\n\n**2。如何使用 JavaScript 找到加载网页时完整 URL？**\n\
  \n**3。对或错：你可以在浏览器历史中向后退，但不能前进。**\n\n#### 测验答案\n\n**1。警告框（Alert）、确认框（confirmation）和提示框（prompt）。**\n\
  \n**2。访问 `location.href` 属性。**\n\n**3。错。你可以使用 `history.forward()` 或 `history.go(n)`\
  \ 向前进。**\n\n### 练习题\n\n**1.** 打开 列表 11.1、11.2 和 11.3 中的代码，并修改 `ready()` 函数以获取名为\
  \ `buttonColor` 的 cookie。如果设置了 `buttonColor` cookie，请使用以下 jQuery 代码更改按钮颜色：\n\n点击此此处查看代码图像\n\
  \n```javascript\n$(\"span\").css(\"color\", getCookie(\"buttonColor\"));\n```\n\n\
  **2.** 打开 列表 11.4、11.5 和 11.6 中的代码，并修改 prompt 以询问用户在下一次通知之前的秒数。如果用户输入 0，则终止通知。否则，使用\
  \ `setTimeout()` 调用中的值。记住，你需要将秒数乘以 1000 以得到毫秒。\n\n### 理解 jQuery 动画\n\njQuery 动画是修改属性的过程。本节侧重于过渡。\n\
  \n#### 动画 CSS 设置\n\njQuery 中的大部分动画都是通过 `.animate()` 方法完成的。`.animate()` 方法允许属性。请注意，`.animate()`\
  \ 只能动画具有数值值的属性。例如，你将无法动画边框样式，但可以动画边框尺寸。\n\n有几种方法可以调用 animate 方法。以下显示了两种者的语法：\n\n\
  ```javascript\n.animate(properties [, duration] [, easing] [, complete])\n\n.animate(properties,\
  \ options)\n```\n\n第一种允许你将 `duration`、`easing` 和 `complete` 函数作为可选参数。第二方法允许你将选项指定为单个选项映射。例如，以下调用带有\
  \ `duration` 和 `easing` 对象映射的 `.animate()`：\n\n```javascript\n$(\"img\").animate({height:100,\
  \ width:100}, {duration:1000, easing:\"linear\"});\n```\n\n提示\n\n你不能使用颜色名称来动画颜色变化；但你可以使用十六进制值（如\
  \ `#ff0000`）动画颜色变化。\n\n#### 动画队列\n\n动画与代码执行异步进行，这意味着在动画发生期间，代码继续执行。如果在第一个动画完成之前为对象指定另一个动画，会发生什么？答案是\
  \ jQuery 将动画排队，然后按顺序执行它们，一个接一个，直到全部完成；也就是说除非你在动画选项中指定了 `queue:false`。\n\n你必须理解动画队列，因为如果你允许用户通过移动鼠标或点击让用户排队了太多动画，动画将会迟缓并落后于用户的操作。\n\
  \n\n\n\n\n你必须留意触发动画的位置。请记住，事件会向上冒泡。如果你在冒泡阶段从所有层级执行同一个动画，可能会导致一些严重违背预期的结果。为了防止这种情况，你可以使用\
  \ `stopPropagation()` 和 `stopImmediatePropagation()` 方法。\n\n## 停止动画\n\njQuery 允许你停止在\
  \ jQuery 对象集包含的元素上当前正在执行的动画。`.stop([clearQueue] [, jumpToEnd])` 方法允许你通过几种方式停止动画。\n\
  \n不带任何参数调用 `.stop()` 会暂停队列中的动画。下一个开始的动画将再次开始执行队列中的动画任务。例如，以下代码会暂停所有动画：\n\n```javascript\n\
  $(\"*\").stop();\n```\n\n调用 `.stop(true)` 并将 `clearQueue` 选项设置为 `true`，会在当前点停止动画并从队列中移除所有动画。例如，以下代码会停止图像上的所有动画并从队列中移除它们：\n\
  \n```javascript\n$(\"img\").stop(true);\n```\n\n调用 `.stop(true, true)` 并将 `jumpToEnd`\
  \ 选项设置为 `true`，会导致当前正在执行的动画立即跳转到结束值，清空队列，然后停止所有动画。例如，以下代码会停止图像上的所有动画，但会完成当前动画做的调整，然后从队列中移除动画：\n\
  \n```javascript\n$(\"img\").stop(true, true);\n```\n\n`.stop()` 方法返回 jQuery 对象，因此你可以在末尾链调用其他方法。例如，以下代码停止图像上的所有动画，然后启动一个新动画将\
  \ `opacity` 设置为 `.5`：\n\n点击此处查看代码图片\n\n```javascript\n$(\"img\").stop(true, true).animate({opacity:.5},\
  \ 1000);\n```\n\n## 延迟动画\n\n在实现动画时，一个非常棒的选项是在动画添加到队列之前添加延迟。这可以用于以更高级的方式提供动画，因为你延迟了动画队列的执行，从而为用户提供了更好的视觉体验。\n\
  \n`.delay(duration, [, queueName])` 方法允许你指定以毫秒为单位的 `duration`，以及一个可选的 `queueName`，用于指定将延迟应用于哪个队列。例如，以下代码为图像添加了尺寸动画；在尺寸完成后，将会有\
  \ 2 秒的延迟，然后 `opacity` 将动画到 `1`：\n\n点击此处查看代码图片\n\n```javascript\n$(\"img\").animate({width:500},\
  \ 1000).delay(2000).animate({opacity:1} 1000);\n```\n\n#### 注意\n\n`.delay()` 方法非常适合在队列的\
  \ jQuery 效果之间延迟；然而，它不是 JavaScript `setTimeout()` 函数的替代品，后者可能更适用于某些用例——特别是那些你要求取消延迟能力的用例。\n\
  \n## 对动画应用 .promise()\n\n`.promise([type], [, target])` 方法允许你在所有绑定到 jQuery 对象集的操作完成后应用某些功能。它通过返回一个新对象来实现这一点，该对象将观察操作，并在操作完成之前不会执行任何附带的方法。\n\
  \n`.promise()` 返回一个类似于等待对象（deferred object）的对象。它拥有一个 `.done()` 方法，该方法允许你传入一个函数，函数将在\
  \ `.promise()` 功能执行后运行。\n\n例如，以下代码等待动画完成，然后将文本更改为“complete”：\n\n点击此处查看代码图片\n\n```javascript\n\
  $(\"span\").animate({opacity:0}, 30000).promise().done(function(){\n    $(\"p\"\
  ).html(\"complete\");\n});\n```\n\n`.promise()` 方法接受两个可选参数。第一个是 `type`，指定操作的类型。默认类型是\
  \ `fx`，适用于动画；因此对于动画，你不需要指定类型。第二个参数是 `target`，指定一个要返回的可选目标 jQuery 对象，而不是新创建的对象。\n\
  \n## 动画化显示和隐藏\n\n你已经已经在第 9 节中见过 `.show()` 和 `.hide()` 方法的作用。对这些功能进行动画化处理是常见做法，因此\
  \ jQuery 为这些方法提供了良好的动画选项，让你的工作更轻松。\n\n### 动画化 hide()\n\n`.hide( [duration] [, easing]\
  \ [, callback])` 方法提供了可选的 `duration`、`easing` 和 `callback` 选项，允许你动画化隐藏效果，使元素消失时不再那么突兀。\n\
  \n例如，以下代码在隐藏元素时应用了 1 秒的动画、使用 `linear` 缓动并执行了一个简单的回调函数：\n\n点击此处查看代码图片\n\n```javascript\n\
  $(\"#box\").hide(1000, \"linear\", function() { $(\"#label\").html(\"Hidden!\")\
  \ });\n```\n\n### 动画化 show()\n\n`.show( [duration] [, easing] [, callback])` 方法提供了可选的\
  \ `duration`、`easing` 和 `callback` 选项，允许你动画化显示效果，使元素出现时的过渡更平滑。\n\n例如，以下代码在显示元素时应用了\
  \ 1 秒的动画、使用 `linear` 缓动并执行了一个简单的回调函数：\n\n点击此处查看代码图片\n\n```javascript\n$(\"#box\"\
  ).show(1000, \"linear\", function() { $(\"#label\").html(\"Shown!\") });\n```\n\n\
  ### 动画化 toggle()\n\n`.toggle( [duration] [, easing] [, callback])` 方法提供了可选的 `duration`、`easing`\
  \ 和 `callback` 选项，允许你动画化切换效果。\n\n例如，以下代码应用了 1 秒的动画、使用 `linear` 缓动并在切换时执行了一个简单的回调函数：\n\
  \n点击此处查看代码图片\n\n```javascript\n$(\"#switch\").toggle(1000, \"linear\", function()\
  \ { $(\"#label\").html(\"Toggled!\") });\n```\n\n## 自己尝试：使用显示和隐藏动画创建展开/折叠元素\n\n\
  在这个示例中，你创建一个简单的 Web 元素，带有一个标题栏和一个折叠按钮，允许你展开和折叠图像。该练习的目的是让你有机会使用显示和隐藏动画。\n\n使用以下步骤：\n\
  \n1. 在 Eclipse 中创建 `lesson12`、`lesson12/js` 和 `lesson12/css` 文件夹，然后添加 `lesson12/image_hide.html`、`lesson12/js/image_hide.js`\
  \ 和 `lesson12/css/image_hide.css` 文件。\n\n**注意**：对于本节的练习，你可能需要自己的图片或从书籍网站获取图片。\n\n\
