  \n**代码列表 24.3 small_title.html 包含小标题的文件文件**\n\n```html\n01 <p class=\"small\">\n\
  02 这是小标题\n03 </p>\n```\n\n**代码列表 24.4 large_title.html 包含大标题的文件**\n\n```html\n01\
  \ <p class=\"large\">\n02 这是大标题\n03 </p>\n```\n\n***\n\n## 扩展表单的指令\n\nAngularJS\
  \ 与表单元素深度集成，为表单元素提供数据绑定和事件绑定。为了提供 AngularJS 功能，表单元素会被编译。表 24.2 列出了扩展的表单元素。\n\n![图像](img/image0103.jpeg)![图像](img/image0104.jpeg)![图像](img/image0105.jpeg)![图像](img/image0106.jpeg)\n\
  \n**表 24.2 支持 AngularJS 功能的扩展指令**\n\n***\n\n## 动手一试：使用 AngularJS 指令将表单元素绑定到作用域\n\
  \n代码列表 24.5 和 24.6 实现了了一些 AngularJS 表单元素与作用域的集成。代码列表 24.5 初始化了作用域。代码列表 24.6 实现了多个表单组件，包括文本框、复选框、单选按钮和\
  \ `select` 元素，以说明如何在模板中定义它们。\n\n按照以下步骤构建使用 AngularJS 表单元素到控制器作用域的应用程序：\n\n1. 添加\
  \ `lesson24/directive_form.html` 和 `lesson24/js/directive_form.js` 文件。\n2. 在 HTML\
  \ 和 JavaScript 文件中添加代码列表 24.5 和代码列表 24.6 中所示的代码。\n3. 代码列表 24.5 中的代码实现了一个基础作用域，其中包含一个名为\
  \ `cameras` 的对象数组，将用于动态填充模板中的 `<select>` 元素。它还提供了名为 `cameraObj`、`cameraName`、`cbValue`\
  \ 和 `someText` 的值，它们将绑定到模板中的各种表单元素。\n4. 代码列表 24.6 中的代码实现了几个与作用域交互以获取和设置值的 AngularJS\
  \ 表单元素。以下这行代码将文本输入框的值绑定到作用域中的 `someText` 变量，并在网页的 `input` 框旁边显示该值：\n\n点击此处查看代码图像\n\
  \n```html\n09      <input type=\"text\" ng-model=\"someText\"> {{someText}}<hr>\n\
  ```\n\n5. 以下代码将复选框元素的值绑定到作用域值 `cbValue` 上，并根据复选框是否选中将 `cbValue` 的值更改为不同的字符串：\n\n\
  点击此处查看代码图像\n\n```html\n10      <input type=\"checkbox\" ng-model=\"cbValue\"\n11\
  \             ng-true-value=\"'Checked'\" ng-false-value=\"'Not Checked'\">\n```\n\
  \n\n\n\n\n12 复选框：`{{cbValue}}`\n\n**6.** 下列代码定义了一个单选按钮组，其值被绑定到 `cameraName`，并在网页的单选按钮组之后显示该值：\n\
  \n点击此处查看代码图片\n\n```html\n13      <input type=\"radio\"\n14        ng-model=\"cameraName\"\
  \ value=\"Canon\"> Canon<br/>\n15      <input type=\"radio\"\n16        ng-model=\"\
  cameraName\" value=\"Nikon\"> Nikon<br/>\n17      选中的相机: {{cameraName}} \n```\n\n\
