  ` 的元素，你会使用什么 jQuery 选择器？**\n\n**5 使用什么 jQuery 选择器可以获取所有作为 `<div>` 元素元素的 `<p>` 元素？**\n\
  \n**6 如何获取 jQuery 对象表示的 DOM 元素的 JavaScript 数组？**\n\n#### 测验答案\n**1 使用 `$(myDiv)`\
