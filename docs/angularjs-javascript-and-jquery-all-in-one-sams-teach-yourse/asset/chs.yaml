  \   <span ng-click=\"hit()\">[+]</span>\n19       Hits: {{hits}}<br>\n20       <span\
  \ ng-click=\"miss()\">[+]</span>\n21       misses: {{misses}}<hr>\n22       Object:\
  \ {{myObj|json}} <br>\n23       Number of Changes: {{changes}}\n24     </div>\n\
