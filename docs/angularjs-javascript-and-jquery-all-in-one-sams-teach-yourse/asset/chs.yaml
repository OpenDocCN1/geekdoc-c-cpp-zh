  \   font-weight:bold;\n16 }\n```\n\n### 自己自己尝试：通过 CSS 添加背景\n\n更改元素的背景属性是完全改变外观和感受的极佳方法。你应该了解几个背景属性，如下：\n\
  \n![Image](img/image00767.jpeg) `background-attachment`—可以设置为 `scroll` 或 `fixed`，这将使背景随页面的其他部分滚动或保持固定。\n\
  \n![Image](img/image00767.jpeg) `background-color`—允许你使用标准的颜色命令定义背景颜色；例如：\n\n点击此处查看代码图片\n\
  \n```css\n#top-left {background-color:rgb(255,255,255);}\n```\n\n\n\n![Image](img/image00767.jpeg)\
  \ `background-size`—允许你指定元素背景的大小。值可以是以像素或百分比设置的宽度/高度、`cover`（它会将背景缩放以填充元素区域），或 `contain`（它将缩放图像以使整个图像适应元素）。请记住，使用\
  \ `cover` 时，如果尺寸比例不同，图像的部分可能不会在元素中显示。接下来的示例将尺寸设置为宽 200 像素高 100 像素、元素宽度的 20% 高高度的\
  \ 200%，以及完全包含在元素大小内：\n\n点击此处查看代码图像\n\n```css\n#top-left {background-size:200px 100px;}\n\
  #top-left {background-position:20% 100%;}\n#top-left {background-position:contain;}\n\
  ```\n\n![Image](img/image00767.jpeg) `background-position`—设置背景放置在元素中的位置，例如左上角、底部居中等。你也可以为背景图像的左上角指定像素或百分比的宽度和高度位置坐标。例如，以下代码将背景图像放置在中间、右侧\
  \ 10% 向 50%，以及右侧 100px 向 20px：\n\n点击此处查看代码图像\n\n```css\n#top-left {background-position:center\
  \ center;}\n#top-left {background-position:10% 50%;}\n#top-left {background-position:100px\
  \ 20px;}\n```\n\n![Image](img/image00767.jpeg) `background-image (url)`—允许你指定将作为背景应用的图像\
  \ `url`。例如：\n\n点击此处查看代码图像\n\n```css\n#rocs{background-image:url(\"images/rocks.png\"\
  );}\n```\n\n![Image](img/image00767.jpeg) `background-image (gradient)`—在 CSS3 中，你还可以指定渐变，用不同颜色之间的过渡来填充背景。在指定渐变时，你可以设置位置、大小和颜色。每个浏览器都有自己特定的属性名称。这很难描述，下面是几个示例。\n\
  \n以下是一个定义水平线性渐变的 CSS 示例。图 4.8 显示了如何应用该渐变。注意位置被设置为顶部（top）。它从顶部的蓝色开始，在 70% 处变为白色，然后在\
  \ 100% 处（即底部）变为绿色：\n\n点击此处查看代码图像\n\n```css\nbackground-image: -moz-linear-gradient(top,\
  \ blue 0%, white 70%, green 100%);\n```\n\n![Image](img/image00833.jpeg)\n\n**图\
  \ 4.8** 创建线性背景渐变。\n\n![Image](img/image00767.jpeg) 下面行 CSS 定义了图 4.9 所示的径向渐变。径变的中心设置为距离左侧\
  \ 50%，距离顶部 50%；`circle` 确保它不会被扭斜成椭圆，而 `contain` 将其缩放到合适的大小。颜色从中心的白色开始，在 75% 处变为蓝色，然后在外部回到透明白色，使用了\
  \ `rgba()` 颜色设置：\n\n点击此处查看代码图像\n\n```css\nbackground-image: -moz-radial-gradient(50%\
  \ 50%, circle contain,white,blue 75%,rgba(255,255,255,0));\n```\n\n![Image](img/image00834.jpeg)\n\
  \n**图 4.9** 创建径向背景渐变。\n\n![Image](img/image00767.jpeg) `background-repeat`—你可以使用此选项多次重复图像。其值为\
  \ `repeat`（在所有方向重复）、`repeat-y`（在垂直方向重复）和 `repeat-x`（在水平方向重复）。你也可以指定 `no-repeat`\
  \ 来显示一次图像。重复图像用于边框，并作为条和按钮的设计元素。图 4.10 显示了以下代码中不同 `background-repeat` 值的的结果：\n\n\
  点击此处查看代码图像\n\n```css\nbody{\n  background-size:50px 50px;\n  margin:5px;\n  background-image:\
  \ -moz-radial-gradient(20px 20px, circle contain,white,blue 75%);\n  background-repeat:repeat;\n\
  }\n```\n\n![Image](img/image0835.jpeg) **图 4.10** 在图像中使用重复图像。\n\n使用以下步骤创建 HTML 文档并将\
  \ CSS 添加到文本中。这些是包含几个 `<div>` 和 `<span>` 元素的基础知识。你将创建的文件完整版本位于列表 4.3 中：\n\n1. 在 `lesson04`\
