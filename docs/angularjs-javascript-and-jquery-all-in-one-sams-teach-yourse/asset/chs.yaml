  ```html\n<!DOCTYPE html>\n<html>\n<head>\n  <title>Backgrounds</title>\n  <meta\
  \ charset=\"UTF-8\">\n  <style>\n  ...\n</head>\n<body>\n  <div id=\"heading\">jQuery\
  \ Rules!</div>\n  <div id=\"content\">\n    <div id=\"menu\">\n      <span>Home</span>\n\
