  \ 23) + ':' + r(0, 59),\n      longitude: p(37, 25, t, x) + '\\u00B0 ' + r(0,59)\
  \ + ' N',\n      latitude: p(6, 77, t, x) + '\\u00B0 ' + r(0,59) + ' W'\n    };\n\
