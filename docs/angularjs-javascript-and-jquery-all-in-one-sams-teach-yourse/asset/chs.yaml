  \ jQuery UI 对 jQuery 增加的一些增强功能。本节涵盖了一些新功能以及对 jQuery 库的增强。jQuery UI 的核心——即效果、交互和控件——将在后续课程中介绍。\n\
  \n#### 理解增强的 jQuery UI 功能\n\njQuery UI 在许多方面都是 jQuery 的扩展。为了让您熟悉并开始实现 jQuery UI\
  \ 组件，接下来的章节将讨论来自 jQuery 的一些重要升级。\n\n##### 添加和移除唯一 ID\n\njQuery UI 为 jQuery 对象提供了几个额外的方法，允许您轻松地为一组元素添加和移除唯一\
  \ ID。当您动态创建了大量以后以后需要通过 ID 访问的新元素时，这非常有用。\n\n\n\n\n\n要添加唯一 ID，请使用 `.uniqueId()` 方法。该方法会检查集合中的每个元素，如果不存在\
  \ `id` 属性，则添加一个 `id` 属性。新 ID 将具有 `\"ui-id-\"` 前缀。如果元素已经具有 `id` 属性，则不会对其进行修改。\n\n\
  你稍后可以使用集合上的 `.removeUniqueId()` 方法删除这些唯一 ID。只有通过 `.uniqueId()` 创建了 ID 的元素会受到影响。\n\
  \n例如，以下代码为所有 `<div>` 元素添加了 `id` 值，随后将其移除：\n\n点击此处查看代码图片\n\n```javascript\nvar divs\
  \ = $(\"div\").uniqueId();\n\n...\n\ndo something\n\n...\n\n$(\"div\"). removeUniqueId\
  \ ();\n```\n\n## 获取滚动父元素 (ScrollParent)\n\njQuery UI 的另一个非常有用的扩展是 `.scrollParent()`\
  \ 方法。该方法会搜索元素的祖先，并返回第一个可滚动的父元素。此方法仅适用于集合中包含单个元素的 jQuery 对象。\n\n## 获取 zIndex\n\n\
  jQuery UI 的另一个非常有用的扩展是 `.zIndex()` 方法。该方法返回元素的数字型 `z-index` 值（如果存在），或者返回第一个具有该值的祖先。这使你能够快速确定页面上任何项的堆叠位置。\n\
  \n## 异步聚焦 (Async Focus)\n\njQuery UI 扩展了 jQuery 对象的 `.focus(delay [. callback])`\
  \ 方法，允许在设置焦点之前设置一个 `delay`，并包含一个 `callback` 回调函数，它会在元素获取焦点时执行。`delay` 以毫秒为单位。\n\n\
  此功能具有广泛的用途，从使用计时器、自动选择表单元素，到强制元素重新获取焦点。例如，以下代码在为元素 `#timedInput` 设置焦点之前添加了半秒的延迟：\n\
  \n点击此处查看代码图片\n\n```javascript\n$(\"#timedInput\").focus(500, function(){\n\n  $(this).val(\"\
  Enter Text Now\");\n});\n```\n\n## 在 jQuery UI 中使用新选择器\n\njQuery UI 的一个非常强大的功能是它能够扩展已经非常详尽的\
  \ jQuery 选择器。这些新选择器更容易根据特定的 UI 元素需求缩小选择范围。以下章节将讨论每一个新选择器。\n\n### 使用 :data() 选择器\n\
  \n我在 jQuery UI 中最喜欢的选择器之一是 `:data()` 选择器。该选择器允许你根据使用 jQuery 的 `.data()` 方法添加到元素上的特定键来过滤元素。例如，以下代码为所有\
  \ `<span>`、`<div>` 和 `<p>` 元素添加了 `color` 值，然后使用 `:data()` 选择器在这些元素上设置这些颜色：\n\n点击此处查看代码图片\n\
  \n```javascript\n$(p).data(\"color\", \"red\");\n\n$(span).data(\"color\", \"blue\"\
  );\n\n$(div).data(\"color\", \"green\");\n\n$(\":data(color)\").each(function(){\n\
  \n  $(this).css({color:$(this).data(\"color\")});\n});\n```\n\n### :focusable\n\n\
  `:focusable` 选择器允许将元素限制为仅可以接收焦点的元素。例如，以下语句将更改限制在那些可以接收焦点的表单元素上：\n\n点击此处查看代码图片\n\n\
  ```javascript\n$(\"form:focusable\").each(function(){\n\n  $(this).css({color:red});\n\
  });\n```\n\n### :tabbable\n\n`:tabbable` 选择器与 `:focusable` 选择器类似。它允许将元素限制为仅可以通过\
  \ Tab 键切换聚焦的元素。例如，以下语句将更改限制在那些可以通过 Tab 键切换聚焦的表单元素上：\n\n点击此处查看代码图片\n\n```javascript\n\
  $(\"form:tabbable\").each(function(){\n\n  $(this).css({color:red});\n});\n```\n\
  \n这种过滤器非常有用，尤其是当你试图排除被禁用的元素时。\n\n> 提示：具有负 tab index 的元素是 `:focusable` 但不是 `:tabbable`。\n\
  \n## 尝试：根据数据值应用 jQuery UI 选择器\n\n在示例中，你向网页添加了几个 `<div>` 元素。然后在 jQuery 中，你为其中一些元素添加了图像数据值。使用\
