  \n**5.** 创建以下 `ready()` 函数，它将在文档加载并就绪时自动调用：\n\n点击此处查看代码图像\n\n```\n05 $(document).ready(function(){\n\
  ...\n12 });\n```\n\n**6.** 添加以下 jQuery 代码，它找到 `#div1` 元素，然后使用 `on()` 添加事件处理程序。在此示例中，传递了一个\
  \ `events-map` 对象，为点击类型指定 `clickHandler()`。此外，传递了一个对象，会将标题和答案添加到事件对象中。这就是第 4 步中值的来源处：\n\
