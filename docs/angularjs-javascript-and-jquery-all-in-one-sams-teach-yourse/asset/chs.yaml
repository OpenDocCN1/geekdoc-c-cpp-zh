  43    <body onload=\"writeIt()\">\n44    </body>\n45 </html\n```\n\n### 总结\n\n在本节中，我们讨论了\
  \ JavaScript 对象如何提供创建更整洁、高效代码的方法。你学习了对象如何支持在单个变量名上附加属性和方法。\n\n你还接触了几个内置对象，如 `Array`\
  \ 和 `String`。这些内置对象提供了属性和方法，可以用极少的代码实现快速的功能——例如，使用 `Date` 对象来获取系统时间、比较时间以及向浏览器创建基于时间的输出。\n\
  \n最后，你还有机会创建并操作自己的带有属性和方法的自定义 JavaScript 对象。创建自定义对象将帮助你更高效地组织脚本。\n\n### 问答\n\n**Q。内置对象、自定义对象、DOM\
  \ 对象和 jQuery 对象之间的区别是什么？**\n\n**A。** 区别仅在于它们的定义方式。内置对象是自动定义的，有时作为语言的一部分直接可用；就像 `arrays`\
  \ 或 `strings` 一样，它们在赋值语句期间自动实例化。DOM 对象也是内置在 JavaScript 语言中的。你可以在 JavaScript 中创建它们的实例，但它们也会根据\
  \ HTML 文件中的标签被创建。jQuery 对象在 `jQuery` 库内部定义并创建。从底层来说，它们都只是 JavaScript 对象。每个对象都有用于简化\
  \ JavaScript 任务的属性和方法。\n\n**Q。`new` 关键字会创建一个对象的新实例，但我该如何移除对象实例以释放内存等资源呢？**\n\n**A。**\
  \ 当变量离开作用域时，JavaScript 会自动为你清理内存。要清理 JavaScript 对象的实例，只需让它离开作用域即可。例如，如果你使用一个不再需要的变量，内存就会被清理。\n\
  \n\n\n\n\njQuery 对象的最大优势是在 页面中搜索 HTML 元素非常简单。另一个优势是 jQuery 库专门封装了方法和属性，使得 JavaScript\
  \ 和 jQuery 开发人员能够更容易地操作和处理不同的对象组。在 jQuery 对象上调用方法可以同时应用于一个或多个 DOM 元素，而无需遍历列表。\n\n\
  表格 7.2 列出了你应该了解的某些 jQuery 对象的重要方法列表。该列表并不是详尽的；其目的是让你对可以从 jQuery 对象访问的内容有一个了解。\n\n\
  ![Image](img/image00866.jpeg)\n\n**表 7.2 附加到 jQuery 对象上的一些常用方法**\n\n### 判断对象是 DOM\
  \ 还是 jQuery\n\n有时，你可能会发现自己处于一种情况：你有一个对象，但不确定它是 jQuery 对象、DOM 对象还是其他 JavaScript 对象。这里有一个简单的方法可以区分它们。\n\
  \n要判断一个对象是否为 jQuery 对象，请使用以下 `if` 语法检查该对象是否具有 `jquery` 属性：\n\n```javascript\nif(\
  \ obj.jquery ) {\n  ...\n}\n```\n\n要判断一个对象是否为 DOM 对象，请使用以下 `if` 语法检查该对象是否具有 `nodeType`\
  \ 属性：\n\n```javascript\nif( obj.nodeType ) {\n  ...\n}\n```\n\n### 将对象从 DOM 转换为\
  \ jQuery 以及反之\n\n如果你有一个 jQuery 对象但想使用为 DOM 对象设计的代码，或者反之该怎么办？答案是将对象转换为另一种类型。\n\n\
  `.get()` 方法以 DOM 对象数组的形式返回 JavaScript 版本的 jQuery 元素集。使用以下代码调用 `get()` 函数，它将返回 jQuery\
  \ 对象所代表的 HTML 元素的 DOM 对象：\n\n点击此处查看代码图像\n\n```javascriptvar domObj = jqueryObj.get();\n\
  ```\n\n相反，`$()` 或 `jquery()` 方法可以从 JavaScript 创建新的 jQuery 对象。使用以下代码执行 `$()` 函数，将\
  \ DOM 对象封装为 jQuery 对象：\n\n```javascriptvar jqueryObj = $(domObj);\n```\n\n### 从\
  \ JavaScript 访问 DOM 对象\n\n为了能够从 JavaScript 操作 HTML 元素，你首先需要获取 DOM 对象的。你可以使用几种方法来实现这一点。\n\
  \n#### 通过 ID 查找 DOM 对象\n\n最简单的方法是使用 `getElementById(id)` 函数根据 `id` 属性的值来查找 HTML\
  \ 元素。`getElementById(id)` 在 DOM 中搜索具有匹配 `id` 属性的对象。\n\n例如，以下代码搜索了 `id=\"container\"\
  ` 的 HTML 元素：\n\n点击此处查看代码图像\n\n```javascriptvar containerObj = document.getElementById(\"\
  container\");\n```\n\n#### 通过类名查找 DOM 对象\n\n你也可以使用 `getElementsByClassName(class)`\
  \ 通过 `class` 属性搜索 HTML 元素。此函数返回一个包含具有匹配 `class` 属性的 DOM 列表。然后你可以使用 JavaScript 循环遍历该列表，并对每个\
  \ DOM 元素应用更改。\n\n例如，以下代码获取 `class=\"myClass\"` 的 HTML 元素列表并对其进行迭代：\n\n点击此处查看代码图像\n\
  \n```javascriptvar objs = document.getElementsByClassName(\"myClass\");\n\nfor (var\
  \ i=0; i<objs.length; i++){\n  var htmlElement = objs[i];\n  ...\n}\n```\n\n####\
  \ 通过标签名查找 DOM 对象\n\n搜索 HTML 元素的另一种方法是根据其 HTML 标签，使用 `getElementsByTagName(tag)`。此函数返回一个包含匹配\
  \ HTML 标签的 DOM 对象列表。然后你可以使用 JavaScript 循环遍历该列表，并对每个 DOM 元素应用更改。\n\n例如，以下代码获取了 `<div>`\
  \ HTML 元素列表并对其进行迭代：\n\n点击此处查看代码图像\n\n```javascriptvar objs = document.getElementsByTagName(\"\
  div\");\n\nfor (var i=0; i<objs.length; i++){\n  var htmlElement = objs[i];\n  ...\n\
  }\n```\n\n***\n\n### 动手尝试：使用 JavaScript 访问 DOM 对象\n\n在这个示例中，你使用 JavaScript 查找不同的元素并读取值以及向它们写入值。这是一个基础示例，旨在让你有机会使用\
  \ JavaScript 访问 DOM 对象。示例中使用的完整脚本显示在 代码 7.1、7.2 和 7.3 中：\n\n**1.** 在 Eclipse 中，创建一个名为\
  \ `lesson07` 的源文件夹。在 `lesson07` 文件夹内部，创建 `js` 和 `css` 文件夹。\n\n**2.** 在 `lesson07`\
  \ 文件夹中创建一个名为 `dom_objects.html` 的源文件。\n\n**3.** 添加常用的基础元素（`html`、`head`、`body`）。\n\
  \n**4.** 在 `<head>` 元素内部添加以下 `<script>` 和 `<link>` 元素，如 代码 7.1\n\n```html\n<script\
  \ type=\"text/javascript\" src=\"js/dom_objects.js\"></script>\n<link rel=\"stylesheet\"\
