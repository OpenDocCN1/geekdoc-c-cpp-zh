  07 label{color:white;}\n08 p{margin:5px;}\n09 span{display:block;}\n10 body{word-wrap:break;}\n\
  ```\n\n\n\n\n\n表单动态流控制的另一个重要方面是拦截 `submit` 和 `reset` 事件，并根据各种条件执行操作。例如，你可能想在允许提交表单之前验证表单值。\n\
  \n你通过在表单上附加 `submit` 事件处理程序来控制表单提交函数。在事件处理程序内部，你可以访问事件相关信息以及将提交的表单数据。你可以执行任何需要的任务，然后要么允许表单提交，要么重置，或者阻止浏览器的默认行为。\n\
  \n下面的代码说明了通过在事件上调用 `.preventDefault()` 来停止表单提交的示例：\n\n点击此处查看代码图片\n\n```javascript\n\
  $(\"form\").submit(function(e){\n    alert(\"Sorry. Not yet Implemented.\");\n \
  \   e.preventDefault();\n});\n```\n\n由于某些原因，jQuery 并没有为表单的 `reset` 事件提供事件处理器。要在\
  \ jQuery 中解决这个问题，可以将重置按钮的输入 `type` 从 `reset` 改为 `button`。然后为该按钮添加一个 `click` 事件处理器，在处理器中对表单的\
  \ DOM 元素 `.reset()`。下面的代码根据用户提示执行了这一操作：\n\n点击此处查看代码图片\n\n```javascript\n$(\"#resetB\"\
  ).click(function(e){\n    if(confirm(\"Are you sure?\")){ $(\"form\").get(0).reset();\
  \ }\n});\n```\n\n# 动手尝试：为表单添加动态流控制\n\n现在你已经有机会回顾了表单流控制的概念，准备好自己尝试一下了。在这个练习中，你将为一个接受付款的电子商务网页表单添加一些基础流控制。\n\
  \n该练习的目的是让你在用户与表单交互时，获得隐藏、显示、禁用和自动聚焦 Web 元素的经验。示例代码位于 列表 13.4、13.5 和 13.6。\n\n使用以下步骤创建动态网页：\n\
  \n1. 在 Eclipse 中，创建 `lesson13/form_flow.html`、`lesson13/js/form_flow.js` 和 `lesson13/css/form_flow.css`\
  \ 文件。\n2. 将列表 13.4 和列表 13.6 中所示的代码添加到 HTML 和 CSS 文件中。有很多 HTML 和 CSS 代码，但你现在应该能够理解它们了。代码定义并样式化了一个基础付款表单。\n\
  3. 打开 `form_flow.js` 文件并创建列表 13.4 所示的 `.ready()` 函数。你应该能识别出前几行只是添加点击处理器，这在后面会讨论。添加接下来显示的行并实现提交和重置表单的流控制。`submit`\
  \ 处理器显示一条表单提交尚未实现的消息并阻止默认提交。重置按钮的 `click` 处理器在调用 `.reset()` 重置表单之前会向用户提示消息：\n\n\
  点击此处查看代码图片\n\n```javascript\n40    $(\"form\").submit(function(e){\n41        alert(\"\
  Sorry. Not yet Implemented.\");\n42        e.preventDefault();\n43    });\n44  \
  \  $(\"#resetB\").click(function(e){\n45        if(confirm(\"Are you sure?\")){\
  \ $(\"form\").get(0).reset(); }\n46    });\n```\n4. 添加 `updateAddr()` 函数，该函数将账单地址更新为匹配配送地址，并在勾选框框时禁用账单元素。如果没有勾选框框，第\
  \ 22 行将移除 `disabled` 值，以便用户可以选择不同的账单地址：\n\n点击此处查看代码图片\n\n```javascript\n13 function\
  \ updateAddr(){\n14   var cb = $(\"#cbSame\");\n15   if (cb.prop(\"checked\")){\n\
  16      $(\"#nameB\").val($(\"#name\").val());\n17      $(\"#addrB\").val($(\"#addr\"\
  ).val());\n18      $(\"#cityB\").val($(\"#city\").val());\n19      $(\"#stateB\"\
