  \n**图 26.1** 使用 `$watch()`、`$watchGroup()` 和 `$watchCollection()` 处理器来监听范围变量的值。\n\
  \n**Listing 26.1 scope_watch.js 实现 $watch()、 $watchGroup()$, 和 $watchCollection()\
  \ 处理器以监听范围变量的值**\n\n点击此处查看代码图片\n\n***\n\n```javascript\n01 angular.module('myApp',\
  \ [])\n02 .controller('myController', function ($scope) {\n03   $scope.mColors =\
  \ ['red', 'green', 'blue'];\n04   $scope.myColor = '';\n05   $scope.hits = 0;\n\
  06   $scope.misses = 0;\n07   $scope.changes = 0;\n08   $scope.myObj = {color: '',\
  \ hits: '', misses: ''};\n09   $scope.setColor = function (color){\n10     $scope.myColor\
  \ = color;\n11   };\n12   $scope.hit = function (){\n13     $scope.hits += 1;\n\
  14   };\n15   $scope.miss = function (){\n16     $scope.misses += 1;\n17   };\n\
