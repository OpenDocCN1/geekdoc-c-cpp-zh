  \n## 数组 (Array)\n\n`Array` 对象提供存储和处理一组其他对象的方法。数组可以存储数字、字符串或其他 JavaScript 对象。你可以使用几种方法创建\
  \ JavaScript 数组；例如，以下语句创建了相同数组的三个版本：\n\n点击此处查看代码图像\n\n```javascript\nvar arr = [\"\
  one\", \"two\", \"three\"];\nvar arr2 = new Array();\narr2[0] = \"one\";\narr2[1]\
  \ = \"two\";\nvar arr3 = new Array();\narr3[2] = \"three\";\narr3.push(\"one\");\n\
  arr3.push(\"two\");\narr3.push(\"three\");\n```\n\n要获取数组中的元素数量，可以使用 `Array` 对象的\
  \ `length` 属性。例如：\n\n```javascript\nvar numOfItems = arr.length;\n```\n\n数组是基于零索引的，这意味着第一个项位于索引\
  \ 0，依此类推。你可以通过使用 `length` 属性进行减法来反向访问数组。例如，在下面的代码中，变量 `first` 的值将是 Monday（周一），变量\
  \ `last` 的值将是 Friday（周五）：\n\n点击此处查看代码图像\n\n```javascript\nvar week = [\"Monday\"\
  , \"Tuesday\", \"Thursday\", \"Friday\"];\nvar first = week[0];\nvar last = week[week.length-1];\n\
  ```\n\n`Array` 对象几个内置函数，允许你以各种方式访问和操作数组。表 6.4 描述了附加到 `Array` 对象上的、允许你操作数组的方法。\n\n\
  **表 6.4 用于操作数组的 Array 对象方法**\n\n为了让你开始使用 `Array` 对象的功能，以下章节描述了使用 `Array` 方法可以完成的一些常见任务。\n\
  \n### 组合数组\n\n你可以用像组合 `String` 对象的方法来组合数组，使用 `+` 语句或使用 `concat()` 方法。在下面的代码中，`arr3`\
  \ 最终变为 `arr4`：\n\n```javascript\nvar arr1 = [1,2,3];\nvar arr2 = [\"three\", \"\
  four\"];\nvar arr3 = arr1 + arr2;\nvar arr4 = arr1.concat(arr2);\n```\n\n**提示：**\
  \ 你可以组合一个数字数组和一个字符串数组。\n\n### 遍历数组\n\n你可以使用 `for` 循环、`for...in` 或 `forEach` 循环来遍历数组。下面的代码展示了使用\
  \ `for` 循环遍历数组中的项：\n\n点击此处查看代码图像\n\n```javascript\nvar week = [\"Monday\", \"Tuesday\"\
  , \"Thursday\", \"Friday\"];\nfor (var i=0; i<week.length; i++){\n    document.write(week[i]\
  \ + \"<br>\");\n}\nfor (dayIndex in week){\n    document.write(dayIndex + \"<br>\"\
  );\n}\n```\n\n### 将数组转换为字符串\n\n`Array` 对象的一个有用功能是可以使用特定的分隔符通过 `join()` 方法将元素组合成字符串。例如，下面的代码将时间组件组合成格式\
  \ 12:10:36：\n\n点击此处查看代码图像\n\n```javascript\nvar timeArr = [12,10,36];\nvar timeStr\
  \ = timeArr.join(\":\");\n```\n\n### 检查数组是否包含某项\n\n通常你需要检查数组是否包含某个项。你可以通过使用 `indexOf()`\
  \ 方法来实现。如果未找到项，将返回 -1。下面的函数在数组包含该项时写入消息：\n\n点击此处查看代码图像\n\n```javascript\nfunction\
  \ message(day){\n    var week = [\"Monday\", \"Tuesday\", \"Wednesday\", \"Friday\"\
  ];\n    if (week.indexOf(day) != -1){\n        document.write(\"Happy \" + day);\n\
  \    }\n}\n```\n\n### 向数组添加和移除项\n\n你可以使用几种内置方法向 `Array` 对象添加项或从中移除项。表 6.5 为你提供了书中用到的一些方法。\n\
  \n## 尝试一下：创建和操作数组\n\n在这个练习中，你将学习使用附加到 `Array` 对象上的各种方法创建并操作数组。按照以下步骤构建 列表 6.2 中的文件：\n\
  \n1. 在 `lesson06` 文件夹创建一个名为 `array_manipulation.html` 的源文件。\n2. 添加基本的元素（`html`,\
  \ `head`, `body`）。\n3. 在 `<head>` 元素内部添加 `<script>` 元素，其中包含名为 `writeIt()` 的函数，并将其链接到\
  \ `<body>` 元素的 `onload` 事件上，如下所示：\n\n点击此处查看代码图像\n\n```html\n<script>\n    function\
  \ writeIt(){\n        ...\n    }\n</script>\n</head>\n<body onload=\"writeIt()\"\
  >\n```\n\n4. 添加以下 JavaScript 函数，它接收一个消息和一个数组参数作为 `msg` 和 `arr`。数组使用 `join()` 方法转换为字符串。该方法还将消息和连接后的数组字符串写入浏览器，并带有\
  \ HTML 格式：\n\n点击此处查看代码图像\n\n```javascript\nfunction writeArray(msg, arr){\n    var\
  \ arrString = arr.join(\" | \");\n    document.write(\"<b>\"+ + msg + \": </b>\"\
  \ + arrString + \"<br><br>\");\n}\n```\n\n\n\n\n\n### 5. 将以下代码行添加到 `writeIt()` 函数中，以创建数组并调用\
  \ `writeArray()` 函数将它们写入浏览器。`weekDays` 数组是通过声明创建的；`weekEnd` 数组是通过创建一个空数组然后向其推入项目生成的：\n\
  \n点击此处查看代码图像\n\n```javascript\nvar weekDays = [\"Monday\", \"Tuesday\", \"Wednesday\"\
  , \"Thursday\", \"Friday\"];\nwriteArray(\"Week Days\", weekDays);\nvar weekEnd\
  \ = new Array();\nweekEnd.push(\"Saturday\");\nweekEnd.push(\"Sunday\");\nwriteArray(\"\
  Weekend\", weekEnd);\n```\n\n### 6. 使用以下行通过结合 `weekEnd` 创建一个包含全周数组的数组数组。在第 18 行中，`concat([])`\
  \ 是创建 `weekDays` 副本的一种方法。我们希望周日在最前面，周六在末尾，因此我们使用 `unshift()` 将周日推到数组开头，并使用 `push()`\
  \ 将周六附加到末尾：\n\n点击此处查看代码图像\n\n```javascript\nvar week = weekDays.concat([]);\nweek.unshift(weekEnd[1]);\n\
  week.push(weekEnd[0]);\nwriteArray(\"Week\", week);\n```\n\n### 7. 使用 `slice()`\
  \ 函数创建一个 `midWeek` 数组，如下：\n\n点击此处查看代码图像\n\n```javascript\nvar midWeek = week.slice(2,5);\n\
  writeArray(\"Mid Week\", midWeek);\n```\n\n### 8. 使用以下代码创建一个全周数组的排序版本，然后遍历 `sortedWeek`\
  \ 数组中的每个项目并将它们写入浏览器：\n\n点击此处查看代码图像\n\n```javascript\nvar sortedWeek = week.sort();\n\
  document.write(\"<b>Sorted Days :</b> <br>\");\nfor (dayIndex in sortedWeek){\n\
  \  document.write(sortedWeek[dayIndex] + \"<br>\");\n}\n```\n\n### 9. 在浏览器中打开页面，应该会显示你创建的数组输出，如图\
  \ 6.2 所示。\n\n![Image](img/image00861.jpeg)\n\n**图 6.2** 列表 6.2 的输出。\n\n**列表 6.2**\
  \ `array_manipulation.html` 在 JavaScript 中创建和操作 `Array` 对象的示例\n\n点击此处查看代码图像\n\n\
  ```html\n<!DOCTYPE html>\n<html>\n<head>\n  <title>Array Manipulation</title>\n\
  \  <meta charset=\"utf-8\" />\n  <script>\n    function writeArray(msg, arr){\n\
  \      var arrString = arr.join(\" | \");\n      document.write(\"<b>\"+ msg + \"\
  : </b>\" + arrString + \"<br><br>\");\n    }\n    function writeIt(){\n      var\
  \ weekDays = [\"Monday\", \"Tuesday\", \"Wednesday\", \"Thursday\", \"Friday\"];\n\
  \      writeArray(\"Week Days\", weekDays);\n      var weekEnd = new Array();\n\
  \      weekEnd.push(\"Saturday\");\n      weekEnd.push(\"Sunday\");\n      writeArray(\"\
  Weekend\", weekEnd);\n      var week = weekDays.concat([]);\n      week.unshift(weekEnd[1]);\n\
  \      week.push(weekEnd[0]);\n      writeArray(\"Week\", week);\n      var midWeek\
  \ = week.slice(2,5);\n      writeArray(\"Mid Week\", midWeek);\n      var sortedWeek\
  \ = week.sort();\n      document.write(\"<b>Sorted Days :</b> <br>\");\n      for\
  \ (dayIndex in sortedWeek){\n        document.write(sortedWeek[dayIndex] + \"<br>\"\
  );\n      }\n    }\n  </script>\n</head>\n<body onload=\"writeIt()\">\n</</body>>\n\
  </html>\n```\n\n### Date\n\n`Date` 对象提供了访问浏览器系统当前时间的接口。这在许多方面都非常有用。要获取系统当前时间，请使用以下代码：\n\
  \n点击此处查看代码图像\n\n```javascript\nvar currentTime = new Date();\n```\n\n例如，年、月、日，如下：\n\
  \n点击此处查看代码图像\n\n```javascript\nvar midWeek = week.slice(2,5);\n```\n\n例如，以下代码：\n\
  \n点击此处查看代码图像\n\n```javascript\nvar sortedWeek = week.sort();\n```\n\n### Date\n\n\
  `Date` 对象提供了访问浏览器系统当前时间的接口。这在许多方面都非常有用。要获取系统当前时间，请使用以下代码：\n\n点击此处查看代码图像\n\n```javascript\n\
  var currentTime = new Date();\n```\n\n例如，年、月、日，如下：\n\n点击此处查看代码图像\n\n```javascript\n\
  var midWeek = week.slice(2,5);\n```\n\n例如，以下代码：\n\n点击此处查看代码图像\n\n```javascript\n\
  var sortedWeek = week.sort();\n```\n\n\n\n\n\n前两个选项对于以后不需要重复使用的简单对象非常有效。更好的方法是将对象封装在它自己的函数块中。这样做的处是可以让你将所有与对象相关的代码都保持在对象内部。例如：\n\
  \n点击此处查看代码图像\n\n```javascript\nfunction User(first, last){\n  this.first = first;\n\
  \  this.last = last;\n}\n\nvar user = new User(\"Brad\", \"Dayley\");\n```\n\n这些方法的最终结果基本上是相同的。你拥有一个具有属性的对象，可以使用点语法进行引用，如下所示：\n\
  \n点击此处查看代码图像\n\n```javascript\ndocument.write(user.first + \" \" + user.last);\n\
  ```\n\n### 向 JavaScript 对象中添加方法\n\n如果有特定于自定义对象的代码，你希望将这些代码作为方法附加到对象本身。根据对象的创建方式，有几种方法可以实现这一点。\n\
  \n第一种是定义一个静态函数，然后将其赋值为对象的属性。以下是在动态定义对象时分配静态函数的示例：\n\n点击此处查看代码图像\n\n```javascript\n\
  var user = new Object();\nuser.first=\"Brad\";\nuser.last=\"Dayley\";\nuser.getFullName\
  \ = makeFullName;\n\nvar user2 = {'first':'Brad', 'last':'Dayley',\n           \
  \  'getFullName':makeFullName};\n\nfunction makeFullName(){\n  return this.first\
  \ + \" \" + this.last;\n}\n\ndocument.write(user.getFullName());\n```\n\n函数 `makeFullName()`\
  \ 将对象的第一个和最后一个属性合并并作为字符串返回。注意，该函数使用 `this` 关键字访问属性。`this` 指向对象的当前实例。还要注意将 `makeFullName()`\
  \ 赋值给 `getFullName` 时省略了括号 `()`；这会将 `user.getFullName` 设置为函数本身，而不是它返回的值。\n\n如果你使用更好的封装方法创建了对象，可以使用以下语法在对象内部定义函数。注意\
  \ `getFullName` 被设置为新定义的函数，该函数返回值的方式与静态函数 `makeFullName()` 相同：\n\n点击此处查看代码图像\n\n\
  ```javascript\nfunction User(first, last){\n  this.first = first;\n  this.last =\
  \ last;\n  this.getFullName = function(){\n      return this.first + \" \" + this.last;\n\
  \  };\n}\n```\n\n### 使用原型对象模式\n\n创建对象的更高级的方法是使用原型模式。原型模式通过在对象的 `prototype` 属性中定义函数而不是在对象本身中定义来实现。原型模式更好的原因是，原型中定义的函数在\
  \ JavaScript 加载时只创建一次，而不是每次创建新对象时都创建。\n\n以下示例显示了实现原型模式所需的代码。注意你定义了对象 `UserP`，然后设置\
  \ `UserP.prototype` 包含 `getFullName()` 函数。你可以根据意愿在 `prototype` 中包含任意数量的函数。每次创建新对象，这些函数都可用：\n\
  \n点击此处查看代码图像\n\n```javascript\nfunction UserP(first, last){\n  this.first = first;\n\
  \  this.last = last;\n}\n\nUserP.prototype = {\n  getFullName: function(){\n   \
  \   return this.first + \" \" + this.last;\n  }\n};\n```\n\n要调用 `getFullName()`\
  \ 函数，你将使用类似于下面的代码：\n\n点击此处查看代码图像\n\n```javascript\nvar me = UserP(\"Brad\", \"Dayley\"\
  );\nvar myFullName = me.getFullName();\n```\n\n***\n\n### 亲自尝试一下：创建和使用自定义对象\n\n\
  在本节中，你将使用原型模式创建并使用自定义 JavaScript 对象数组。按照以下步骤构建 列表 6.3 中的文件：\n\n**1.** 在 `lesson06`\
  \ 文件夹中创建一个名为 `custom_objects.html` 的源文件。\n\n**2.** 添加常规的基础元素（`html`、`head`、`body`）。\n\
  \n**3.** 在 `<head>` 元素内部添加一个名为 `writeIt()` 的 `<script>` 元素，并将其链接到 `body` 元素的 `onload`\
  \ 事件，如下所示：\n\n点击此处查看代码图像\n\n```html\n06 <script>\n07   function writeIt(){\n...\n\
