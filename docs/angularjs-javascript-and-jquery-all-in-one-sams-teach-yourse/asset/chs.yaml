  \ = true;\n14        };\n15        this.addPane = function(pane) {\n16         \
  \ if (panes.length == 0) {\n17            $scope.select(pane);\n18          }\n\
  19          panes.push(pane);\n20        };\n21      },\n22      templateUrl: 'tabs.html'\n\
  23    };\n24 });\n25 app.directive('myPane', function() {\n26   return { require:\
  \ '^myTabs', restrict: 'E',\n27     templateUrl: 'pane.html',\n28     transclude:\
  \ true, scope: { title: '@' },\n29     link: function(scope, element, attrs, tabsCtrl)\
  \ {\n30       tabsCtrl.addPane(scope);\n31     }\n32   };\n33 });\n```\n\n### 3.\
