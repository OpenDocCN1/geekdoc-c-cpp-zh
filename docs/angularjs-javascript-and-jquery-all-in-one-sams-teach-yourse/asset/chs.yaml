  \n**图 29.5** 使用 AngularJS scope 数据、控制器代码和模板视图在元素中实现简单的星级评分。\n\n### 总结\n\nAngularJS\
  \ 通过使用带有内置和自定义指令的模板，提供了许多扩展 HTML 能力的工具。在本节中，你学习了以简单且结构化的方式在网页中实现富交互元素的不同方法。\n\n\
  在本节中，你还了解了几个自定义指令。标签面板和可展开/折叠示例展示了实现相互嵌套并相互作用的指令的方法。拖放示例向你展示了与 HTML5 拖放事件交互的一种方法，以及如何在控制器和自定义指令之间共享\
  \ scope。星级评分示例向你展示了如何仅使用 AngularJS scope、控制器和模板构建交互性。缩放视图字段示例向你展示了如何扩展 HTML `<img>`\
  \ 元素，包含一个额外的缩放元素，该元素可以与图像中的鼠标点击交互。\n\n这本书到此结束。我们希望你像我们一样喜欢学习 AngularJS 和 jQuery。\n\
