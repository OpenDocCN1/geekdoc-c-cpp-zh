  \  </body>\n</html>\n```\n\n\n\n\n服务（Service）提供了一个可复用功能的容器，供 AngularJS 应用程序轻松使用。服务在\
  \ AngularJS 中通过依赖注入机制进行定义和注册。这允许你将服务注入到模块、控制器和其他服务中。\n\n### 顺便提一下\n\n第 21 节，“理解\
  \ AngularJS 应用动态” 讨论了依赖注入。在继续阅读本节之前，如果你还没有读过该节，应该先阅读一下它。\n\n### 使用内置服务\n\nAngularJS\
  \ 提供了几个内置服务。这些服务会自动注册到依赖注入器中；因此，你可以通过依赖注入轻松将它们整合到你的 AngularJS 应用中。\n\n表 27.1 描述了一些最常见的内置服务，以便你了解可用功能。接下来的章节将更详细介绍其中一些服务。\n\
  \n![Image](img/image01036.jpeg)![Image](img/image01037.jpeg)![Image](img/image01038.jpeg)\n\
  \n**表 27.1 AngularJS 内置常用服务**\n\n#### 使用 $http 服务发送 HTTP GET 和 PUT 请求\n\n`$http`\
  \ 服务允许你直接从 AngularJS 代码与 Web 服务器进行交互。`$http` 服务底层使用浏览器的 `XMLHttpRequest` 对象，但在 AngularJS\
  \ 框架的上下文中运行。\n\n使用 `$http` 服务有两种方法。最简单的是使用以下与标准 HTTP 请求对应的内置快捷方法之一：\n\n![Image](img/image00767.jpeg)\
  \ `delete(url, [config])`\n\n![Image](img/image00767.jpeg) `get(`url`, [`config`])`\n\
  \n![Image](img/image00767.jpeg) `head(`url`, [`config`])`\n\n![Image](img/image00767.jpeg)\
  \ `jsonp(`url`, [`config`])`\n\n![Image](img/image00767.jpeg) `post(`url`,` data`,\
  \ [`config`])`\n\n![Image](img/image00767.jpeg) `put(`url`,` data`, [`config`])`\n\
  \n![Image](img/image00767.jpeg) `patch(url, data, [config])`\n\n#### 配置 $http 请求\n\
  \n在这些方法中，`url` 参数是 Web 请求的 URL。可选的 `config` 参数是一个 JavaScript 对象，用于指定实现请求时使用的选项。表\
  \ 27.2 列出了你可以在 `config` 参数中设置的属性。\n\n![Image](img/image01039.jpeg)![Image](img/image01040.jpeg)\n\
  \n**表 27.2 $http 服务请求中 config 参数中可以定义的属性**\n\n你也可以通过直接将 `config` 参数发送到 `$http(`config`)`\
  \ 方法来指定请求、URL 和数据。例如，以下两行是相同的：\n\n点击此处查看代码图片\n\n```\n$http.get('/myUrl');\n$http({method:\
  \ 'GET', url:'/myUrl'});\n```\n\n#### 实现 $http 响应回调函数\n\n当你使用 `$http` 对象调用请求方法时，你将获得一个包含\
  \ `success()` 和 `error()` 承诺方法的对象。你可以向这些方法传递一个回调函数，当请求成功或失败时，该函数会被调用。这些方法接受以下参数：\n\
  \n![Image](img/image00767.jpeg) `data`: 响应数据。\n\n![Image](img/image00767.jpeg) `status`:\
  \ 响应状态。\n\n![Image](img/image00767.jpeg) `header`: 响应头。\n\n![Image](img/image00767.jpeg)\
  \ `config`: 请求配置。\n\n以下是在 `get()` 请求上实现 `success()` 和 `error()` 方法的简单示例：\n\n点击此处查看代码图片\n\
  \n```\n$http({method: 'GET', url: '/myUrl'})\n  .success(function(data, status,\
  \ config) {\n    // 处理成功\n  })\n  .error(function(data, status, config) {\n    //\
  \ 处理失败\n  });\n```\n\n### 动手实践一下：实现一个简单的 HTTP 服务器并使用 $http 服务访问它\n\n在例例中，你实现了一个使用\
  \ `$http` 服务访问和更新 Web 服务器上数据的 AngularJS 应用程序。这个练习的目的是让你熟悉使用 `$http.get()` 和 `$http.post()`\
  \ 请求。\n\n代码列表 27.1 到 27.3 中的代码实现了一个简单的 Node.js Web 服务以及访问它的 AngularJS 应用。Web 服务器包含一个简单的\
  \ JavaScript 对象，其中包含项目和数量，以模拟商店的库存。Web 应用允许用户告诉服务器为货商店并购买商品。该示例非常原始，因此代码易于理解，但它包含了\
  \ `GET` 和 `POST` 请求以及错误处理。\n\n使用以下步骤构建带有 `POST` 和 `GET` 请求处理程序的自定义 Web 服务器，并构建一个访问该服务器的\
  \ AngularJS 应用：\n\n1. 添加 `lesson27/service_http.html` 和 `lesson28/js/service_http.js`。\n\
  2. 将代码列表 27.2 和 代码列表 27.3 所示的代码添加到 HTML 和 JavaScript 文件中。\n3. 对于此示例，我们需要 Web 服务器提供一个模拟的数据库访问服务。代码列表\
  \ 27.5 实现了 Node.js Web 服务器，它处理以下 `GET` 和 `POST` 路由，用于获取和设置服务器上的数据：\n\n![Image](img/image00767.jpeg)\
  \ `/reset/data`: 一个 `GET` 路由，重新初始化商店中可用的项目。\n\n![Image](img/image00767.jpeg) `/buy/item`:\
  \ 一个 `POST` 路由，减少项目计数并返回商店数据（通常不需要返回完整数据，但为了示例这样了）。如果缺货，将返回 400 错误。\n\n![Image](img/image00767.jpeg)\
