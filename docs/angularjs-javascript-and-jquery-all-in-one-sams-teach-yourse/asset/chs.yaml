  );\n13   }\n14 });\n15 app.listen(80);\n```\n\n## 处理响应数据\n\n你已经学习了响应可以生成的不同数据类型。你将处理的四个主要类型是脚本、文本、JSON\
  \ 和 XML/HTML。脚本和文本可以通过 `.load()` 和 `.getScript()` 方法简单地处理。JSON 和 XML/HTML 可能会稍微复杂一些。\n\
  \n以下章节将引导你完成处理来自服务器响应中的 JSON 和 XML 数据的过程。\n\n### 试一试：处理 JSON 响应数据\n\nJSON 数据是 jQuery\
  \ AJAX 响应中是最容易处理的。这是因为响应数据是以对象形式存在的，所以你可以通过点命名法访问它。例如，来自服务器的的以下 JSON 响应：\n\n点击此处查看代码图像\n\
  \n```json\n{\"first\":\"Brad\", \"last\":\"Dayley\"}\n```\n\n可以通过如下方式在响应数据中访问：\n\
  \n点击此处查看代码图像\n\n```javascript\nvar name  = data.first + \" \" + data.last;\n```\n\
  \n即使响应数据对象是以字符串形式提供的，你也可以使用 `.parseJSON()` 来获取 JavaScript 对象。例如：\n\n点击此处查看代码图像\n\
  \n```javascript\nvar data = $.parseJSON('{\"first\":\"Brad\", \"last\":\"Dayley\"\
  }');\nvar name  = data.first + \" \" + data.last;\n```\n\n在此练习中，你将处理来自 AJAX 请求返回的\
  \ JSON 数据。生成的网页包含几张带有说明的图像。图像说明和图像文件名来自位于服务器上 `lesson15/data/images.json` 的 JSON\
  \ 文件。该练习的目的是让你熟悉使用从 AJAX 请求返回的 JSON 数据来动态填充页面。\n\n示例代码位于列表 15.9、`15.10`、`15.11`\
  \ 以及 `15.12`。使用以下步骤创建动态网页：\n\n1. 在 Eclipse 中，创建 `lesson15/load_json.html`、`lesson15/js/load_json.js`、`lesson15/css/load_json.css`\
