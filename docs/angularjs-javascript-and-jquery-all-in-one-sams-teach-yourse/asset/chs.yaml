  \ 和 `myObj.misses` 的值也会随。\n6. `Listing 26.1` 中的以下几行代码对范围中的 `myObj` 对象实现了 `$watchCollection`，以便每当\
  \ `myObj` 变化时，范围中的 `changes` 值就会增加，以跟踪 `myColor`、`hits` 和 `misses` 变化的次数。\n7. `Listing\
  \ 26.2` 中的代码实现了一个 AngularJS 模板，使用户可以使用鼠标选择颜色并增加 `hits` 和 `misses` 变量。对象和变化值显示在底部，展示了\
  \ `$watch` 方法如何检测并更新范围的变化。\n8. 在浏览器中打开 `scope_watch.html` 文件，更改颜色并增加 hits 和 misses，观察\
