  \ AngularJS 服务的工具。你学习了四种自定义 AngularJS 服务的方法或类型，包括 `value`、`constant`、`factory` 和\
  \ `service`。\n\n本节展示了实现每种类型自定义 AngularJS 服务的示例。你还看到了在多个控制器中实现自定义 AngularJS 服务的示例。本节的最后一个示例向你展示了如何实现一个使用\
  \ `$http` 与服务器交互的独立自定义 AngularJS 服务，以及如何在另一个模块中注入并使用它。\n\n### 动手实践：实现标签页视图\n\n在本示例中，你构建了两个\
  \ AngularJS 指令，一个作为标签组，另一个作为面板。本示例的目的是让你了解如何嵌套自定义 指令，以及它们之间的通信。\n\n使用以下步骤构建标签页视图\
  \ AngularJS 应用：\n\n1. 在你的代码位置创建以下文件夹和文件结构。`server.js` 文件和 images 文件夹是在第 1 节中的。你需要从书籍网站获取或提供自己的：\n\
