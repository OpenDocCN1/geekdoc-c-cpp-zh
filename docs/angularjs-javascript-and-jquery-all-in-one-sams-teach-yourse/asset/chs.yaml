  \ 文件并添加列表 7.6 中的内容，将 `<span>` 元素样式化为按钮并将`<p>`元素样式化为列表标题。\n\n7. 打开 `jquery_selectors.js`\
  \ 文件，以便为 `<span>` 元素添加事件处理器。\n\n8. 添加一个名为 `setEven()` 的 JavaScript 函数作为事件处理器。\n\n\
  9. 添加以下行，使用 jQuery 选择所有 `<li>` 和 `<span>` 元素并清除 CSS 的 `font-weight` 值：\n\n点击此处查看代码图片\n\
  \n```javascript\n02 $(\"li, span\").css(\"font-weight\",\"\");\n```\n\n10. 添加以下行，定义一个名为\
  \ `$evenItems` 的变量，其结果为选择所有 `<li>` 元素的选择器结果，然后过滤列表仅保留索引为偶数的项。第 3 行使用 `$evenItems`\
  \ 变量将这些项目的 CSS `font-weight` 属性设置为粗体：\n\n点击此处查看代码图片\n\n```javascript\n03 var $evenItems\
