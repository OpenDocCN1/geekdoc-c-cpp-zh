  \n本节的目的是帮助你了解如何将 HTML5 元素与动态 jQuery 和 JavaScript 交互结合，通过提供趋势数据的视觉指示器来提供丰富的用户体验。数据可以来自各种来源，包括在网页上运行的\
  \ JavaScript 或通过 AJAX 请求收集的外部服务。在本节中，你将实现一系列折线图。折线图是一种微型图表，根据来自服务器的最新值频繁更新。折线图元素为你提供了一种极佳的方法，展示如何使用新的\
  \ HTML 元素为用户提供数据的绝佳视觉指示器。\n\n***\n\n### 动手尝试：使用简单的 jQuery、JavaScript 和 CSS 创建折线图\n\
  \n该练习的目的是说明如何实现新的 HTML 图形元素，为你的网页渲染实用的组件。在练习中，你将使用 `<canvas>` 元素来实现折线图，并使用 jQuery\
  \ 和 JavaScript 动态更新它们。示例代码位于列表 `14.16`、`14.17` 和 `14.18` 中。\n\n使用以下步骤创建动态网页：\n\n\
  1. 在 Eclipse 中，创建 `lesson14/dynamic_sparkline.html`、`lesson14/js/dynamic_sparkline.js`\
  \ 和 `lesson14/css/dynamic_sparkline.css`。\n2. 在 HTML 和 CSS 文件中添加列表 `14.16` 和列表 `14.18`\
  \ 显示的代码。HTML 和 CSS 相当基础。注意，只有 `<div>`、`<span>` 和 `<canvas>` 元素。\n3. 打开 `dynamic_sparkline.js`\
  \ 文件并添加以下 `.ready()` 函数，该函数填充了折线图的数据并启动 `adjValues()` 函数。你还需要添加列表 `14.17` 中所示 `adjValues()`\
  \ 和 `getRandomArray()` 函数。这些函数填充并持续更新折线图的值。注意数据数组使用 `.data()` 方法存储在 `<div>` 元素中：\n\
  \n```javascript\n$(document).ready(function(){\n  $(\"div\").each(function(){\n\
  \    $(this).data(\"valueArr\", getRandomArray());\n  });\n  adjValues();\n});\n\
  ```\n\n4. 添加以下函数 `renderSpark()`，它使用一组值并在画布上绘制折线图。该函数使用设置的值数组在画布上绘制一系列线条，在绘制新的折线图之前擦除当前的折线图：\n\
  \n```javascript\nfunction renderSpark(c, lineValues){\n  c.width = c.width;\n  var\
  \ xAdj = c.width/lineValues.length;\n  var ctx = c.getContext(\"2d\");\n  ctx.fillStyle\
  \ = \"#000000\";\n  ctx.strokeStyle = \"#00ffff\";\n  ctx.lineWidth = 3;\n  var\
  \ x = 1;\n  ctx.moveTo(x,(c.height));\n  for (var idx in lineValues){\n    var value\
  \ = parseInt(lineValues[idx]);\n    ctx.lineTo(x+xAdj, (c.height - value));\n  \
  \  x += xAdj;\n  }\n  ctx.stroke();\n}\n```\n\n5. 保存所有文件，然后在浏览器中打开 HTML 文档，如图 14.6\
  \ 所示。你会看到折线图自动更新。\n\n![图像](img/0035.jpeg)\n\n**图 14.6** 带有自动更新折线图元素的网页\n\n### 列表\
