  \ (Overlay Dialogs)\n\n你已经学习了如何在你的网页中添加几种类型的对话框。问题是，内置的对话框在功能上非常有限。你可以打开一个新弹出窗口来获得更多控制权，但弹出窗口有它们自己的问题，其中最大的问题是用户讨厌它们，并且通常会在浏览器中禁用它们。\n\
  \n一个更好的选择是使用 `jQuery` 和 `JavaScript` 创建你自己的对话框。实现一个对话框需要两个元素：一个 `overlay`（覆盖层）元素，用于遮盖网页背后发生的一切；以及一个提供交互的\
  \ `dialog`（对话）组件。\n\n`overlay` 的 `z-index` 需要比主网页元素高。覆盖层还应该是透明的，这样用户可以看到网页，但无法点击网页的任何元素。\n\
  \n`dialog` 的 `z-index` 也需要比 `overlay` 高，以便在显示 `overlay` 时它是是可见的。`dialog` 还需要一种关闭方式，使得\
  \ `dialog` 和 `overlay` 元素被隐藏。你可以在对话框中包含任何你其他内容。\n\n`dialog` 和 `overlay` 需要处于固定位置并且初始状态为隐藏。当你想要显示对话框时，取消\
  \ `overlay` 和 `dialog` 的隐藏，然后在完成后将它们隐藏。接下来的章节将带你完成这一过程。\n\n## 动手尝试：使用 jQuery 和 JavaScript\
  \ 添加动态对话框\n\n该练习的目的是让你具备实现自己的自定义对话框的能力，并带有一个 `overlay` 来遮盖网页的其余部分。示例代码位于 14.10、14.11\
  \ 和 14.12。\n\n使用以下步骤创建动态网页：\n\n1. 在 Eclipse 中创建 `dynamic_dialog.html`、`dynamic_dialog.js`\
  \ 和 `dynamic_dialog.css`。\n2. 将 14.10 和 14.12 所示的代码添加到 HTML 和 CSS 文件中。这实现了一个基础网页。注意\
  \ `overlay` 和 `dialog` 元素。\n3. 打开 `dynamic_dialog.js` 文件，添加以下 `ready()` 函数，它可以隐藏\
  \ `overlay` 和 `dialog` 元素，并添加一个点击处理器来显示它们：\n\n```javascript\n$(document).ready(function(){\n\
