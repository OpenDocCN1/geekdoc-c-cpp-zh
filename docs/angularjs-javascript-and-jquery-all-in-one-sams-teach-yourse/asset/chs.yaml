  11   padding:3px;\n12   color:white;background-color:skyblue;\n13   font-size:30px;font-weight:bold;\n\
  14 }\n```\n\n***\n\n## 创建自定义事件\n\nJavaScript 和 jQuery 事件处理机制非常强大的方面是添加自定义事件。这解决了内置事件都绑定到\
  \ DOM 元素特定行为的问题。如果你希望在数组项大于 100 时触发事件怎么办？\n\n自定义事件允许你扩展元素的事件。自定义事件并不直接对应于用户的交互，而是根据用户执行的操作在代码中发生的事件。\n\
  \n创建自定义事件的优势在于，你可以使用现有的事件处理系统来添加/移除事件、冒泡事件并触发它们。\n\n以下章节描述了你可以在 JavaScript 和 jQuery\
  \ 中用于添加自定义事件的不同方法。\n\n### 使用 JavaScript 添加自定义事件\n\n在 JavaScript 中添加自定义事件与触发事件类似，你需要创建一个事件对象并对其进行初始化。以下代码显示了创建自定义事件的示例：\n\
  \n点击此处查看代码图片\n\n```javascript\nvar myEvent = document.createEvent(\"CustomEvent\"\
  );\n\nmyEvent .initCustomEvent(\n  \"worldEnds\",\n  true,\n  false,\n  {\n    \
  \  'fire': false,\n  }\n);\n```\n\n`var myEvent = document.createEvent(\"CustomEvent\"\
  );`\n\n`myEvent .initCustomEvent(\"worldEnds\", true, false, { 'fire': false, });`\n\
  \n第一个参数定义 `type`，第二个设置 `bubbles`，第三个设置 `cancelable`，第四个定义 `details`。\n\n`myEvent.dispatchEvent(myEvent);`\n\
  \n`document.addEventListener(\"worldEnds\", function() { console.log(\"Event triggered!\"\
  ); });`\n\n`document.addEventListener(\"worldEnds\", function() { console.log(\"\
  Event triggered!\"); });`\n\n`document.removeEventListener(\"worldEnds\", function()\
  \ { console.log(\"Event triggered!\"); });`\n\n`document.addEventListener(\"worldEnds\"\
  , function() { console.log(\"Event triggered!\"); });`\n\n`document.addEventListener(\"\
  worldEnds\", function() { console.log(\"Event triggered!\"); });`\n\n`document.removeEventListener(\"\
  worldEnds\", function() { console.log(\"Event triggered!\"); });`\n\n`document.addEventListener(\"\
  worldEnds\", function() { console.log(\"Event triggered!\"); });`\n\n`document.addEventListener(\"\
  worldEnds\", function() { console.log(\"Event triggered!\"); });`\n\n`document.removeEventListener(\"\
  worldEnds\", function() { console.log(\"Event triggered!\"); });`\n\n`document.addEventListener(\"\
  worldEnds\", function() { console.log(\"Event triggered!\"); });`\n\n`document.addEventListener(\"\
  worldEnds\", function() { console.log(\"Event triggered!\"); });`\n\n`document.removeEventListener(\"\
  worldEnds\", function() { console.log(\"Event triggered!\"); });`\n\n`document.addEventListener(\"\
  worldEnds\", function() { console.log(\"Event triggered!\"); });`\n\n`document.addEventListener(\"\
  worldEnds\", function() { console.log(\"Event triggered!\"); });`\n\n`document.removeEventListener(\"\
  worldEnds\", function() { console.log(\"Event triggered!\"); });`\n\n`document.addEventListener(\"\
  worldEnds\", function() { console.log(\"Event triggered!\"); });`\n\n注意：如果你想移除事件监听器，必须使用与添加它时相同的函数引用。使用匿名函数将无法进行移除。\n\
  \n### 使用 jQuery 添加自定义事件\n\njQuery 提供了更简单的方法，使用 `.on()` 和 `.trigger()` 方法处理自定义事件。\n\
  \n```javascript\n$(document).on(\"customEvent\", function(event) {\n  console.log(\"\
  Custom event received with data:\", event.data);\n});\n\n$(document).trigger(\"\
  customEvent\", { data: \"some value\" });\n```\n\n\n\n\n\njQuery 提供了一种非常有趣的方式来实现处理回调函数，即延迟对象（deferred\
  \ object）。延迟对象是一个包含一组函数的对象，这些函数可以在稍后的某个时间运行。传递给函数的实际参数直到延迟对象被解析（resolve）并执行这些函数时才会被添加。\n\
  \n这允许你将一组函数应用于单个对象上，并且这些函数可以在任何时间应用。\n\n以下代码演示了如何创建一个包含多个函数的简单延迟对象，然后执行这些函数：\n\n\
  点击此处查看代码图像\n\n```javascript\nvar resultString = \"\";\n\nfunction function1(n1,\
  \ n2, p3) { resultString += \"Problem: \"; }\n\nfunction function2(n1, n2) { resultString\
  \ += n1 + \" + \"; }\n\nfunction function3(n1, n2) { resultString += n2 + \" = \"\
  ; }\n\nvar deferredObj = $.Deferred();\n\ndeferredObj.done( [function1, function2],\
  \ function3).done(function(n1, n2) {\n    resultString += n1 + n2;\n    $(\"div\"\
  ).append(resultString);\n});\n\ndeferredObj.resolve(5,6);\n```\n\n上述代码中发生的情况如下：三个定义的函数都会向\
  \ `resultString` 变量添加内容。创建了一个名为 `deferredObj` 的新延迟对象。调用了 `.done(functions [, functions])`\
  \ 方法将函数添加到延迟对象中。这里使用了三种方式来添加函数：第一个参数是待执行的函数列表，第二个是单个函数，第三个是匿名函数。\n\n在调用 `.resolve(args)`\
  \ 之前，这些函数都不会执行。注意，`.resolve()` 的参数与函数所需的参数相匹配。每个函数按顺序执行。结果是将以下字符串追加到 `<div>` 元素中：\n\
  \nProblem: 5 + 6 = 11\n\n### 总结\n\n本节重点介绍了在网页页面中实现事件处理的不同方式。事件处理是交互式网页的核心。JavaScript\
  \ 和 jQuery 在创建事件和将事件添加到 DOM 元素的方法上有所不同。你已经学习了两者中用于添加事件处理程序的方法。\n\n你还学习了如何访问事件对象并将你自定义的对象传递到事件处理程序中，并学习了如何创建和触发自己的自定义事件。\n\
  \n### 问答\n\n**Q. 什么时候使用 JavaScript 创建和触发自定义函数比使用 jQuery 更好？**\n\n**A.** 永远不。好吧，不一定。目前\
  \ jQuery 在事件方面的跨浏览器支持要多得多。此外，创建必要的对象也要容易得多。出于这些原因，你应该几乎总是使用 jQuery。如果因为向兼容兼容或其他原因你的环境无法使用\
  \ jQuery，那么请使用 JavaScript。\n\n**Q. 你不能通过自定义事件完成所有回调函数能做的事情吗？**\n\n**A.** 并不容易。记住，你可以根据需要创建任意带有不同标记的回调列表，并且只触发与特定列表绑定的函数。在事件处理程序中尝试管理所有内容很快就会失控。\n\
  \n### 工作坊\n\n该工作坊由一组问答组成，旨在巩固你对本节涵盖内容的理解。在查看答案之前，尝试回答问题。\n\n#### 测验\n\n**1.** `<body>`\
  \ 标签的哪个 HTML 属性可以在页面加载完成后调用 JavaScript 代码？\n\n**2.** 正确或错误：事件只会为其发生的目标元素触发处理函数。\n\
  \n**3. 你在什么情况下会使用 `.ready()` 方法而不是 `.load()` 方法？**\n\n**4.** 正确或错误：鼠标事件只能通过鼠标移动或鼠标点击触发。**\n\
  \n#### 测验答案\n\n**1.** `onload`。\n\n**2.** 错误。大多数事件会通过祖先对象一直冒泡到文档对象。\n\n**3.** 当你只需要\
  \ DOM 加载完成时使用 `.ready()`。如果你还需要其他资源（如图像）也完成加载，则使用 `.load()`。\n\n**4.** 错误。鼠标事件可以在\
  \ jQuery 和 JavaScript 中被手动触发。\n\n### 练习题\n\n1. 扩展 示例 9.10、9.11 和 9.12 中的示例，为其他非标准字符添加额外的按钮。你需要从\
  \ Web 网上获取 Unicode 字符编码。\n\n2. 扩展 示例 9.7、9.8 和 9.9 中的示例，为其他非标准字符添加额外的按钮。\n\n## 第\
  \ 10 节。使用 JavaScript 和 jQuery 动态访问和操作网页\n\n本节你将学习：\n\n![图像](img/image0077.jpeg)\
  \ 跟踪鼠标位置和其他信息\n\n![图像](img/image0077.jpeg) 操作元素的大小和其他属性\n\n![图像](img/image0077.jpeg)\
  \ 如何动态显示和隐藏元素\n\n![图像](img/image0077.jpeg) 动态创建 DOM 元素并将其添加到网页\n\n![图像](img/image0077.jpeg)\
  \ 在 jQuery 中添加和删除类\n\n![图像](img/image0077.jpeg) 修改页面布局\n\n这一节内容非常丰富。到目前为止，你已经拥有大部分你需要的工具。在本节中，你将迈出一步，学习如何使用这些工具以及一些新工具来获取有关网页元素的信息。访问和修改元素属性及值的能力将允许你改变基础网页。\n\
  \n你将在本节中了解到，JavaScript 和 jQuery 的网页操作方法是开放的。你可以在 JavaScript 代码的任何地方操作页面元素。这种方法的优点是只需要少量的代码就能轻松转换页面。缺点是你需要自律以保持代码易于维护，以便你清楚自己在操作什么。AngularJS\
  \ 有完全不同的方法，你将在 AngularJS 部分学习。现在，请享受快速动态操作页面的乐趣吧。\n\n### 访问浏览器和元素值\n\njQuery 和 jQuery\
  \ 的一个核心基础是访问代表网页元素的 DOM 对象。本节将引导你访问属性值、位置、大小和其他属性，并向你展示如何修改其中的许多。\n\n#### 获取鼠标位置\n\
  \n鼠标移动是你将处理的最常见的网页交互之一。通常，你需要根据鼠标的位置对元素进行调整。\n\n当触发鼠标事件时，可以从事件对象访问鼠标位置。请记住事件指定了三个鼠标坐标。表\
  \ 10.1\n\n**表 10.1 指定鼠标位置的事件对象属性**\n\n以下代码展示了从名为 `e` 的事件对象获取鼠标坐标并将其应用于字符串变量的示例：\n\
  \n点击此处查看代码图像\n\n```javascript\nvar screenPosition = e.screenX + \", \" + e.screenY;\n\
  \nvar pagePosition = e.pageX + \", \" + e.pageY;\n\nvar browserPosition = e.clientX\
  \ + \", \" + e.clientY;\n```\n\n#### 获取和设置值\n\n\n\n\n\n若干 HTML 元素（特别是输入元素）具有与其关联的值。在\
  \ jQuery 和 JavaScript 中，访问这些元素的值都是很简单的事情。\n\n在 JavaScript 中，可以通过访问对象的 `value` 属性来直接获取值。例如：\n\
  \n点击此处查看代码图片\n\n```javascript\ndomObject.value = 5;\nvar value = domObject.value;\n\
  ```\n\n另一方面，jQuery 提供了 `.val()` 方法来获取和设置值。例如，下面的代码设置并获取了代表 `id=\"textInput\"` 的\
  \ HTML `<input>` 元素的 jQuery 对象的值：\n\n点击此处查看代码图片\n\n```javascript\n$(\"#textInput\"\
  ).val(5);\nvar value = $(\"#textInput \").val();\n```\n\n### 在 jQuery 中获取和设置属性和属性\n\
  \nDOM 对象可以直接访问它们所代表的 HTML 元素的 DOM 节点属性和 DOM 元素属性。这在 jQuery 中是不合理的，因为 jQuery 对象通常代表具有不同属性的多个元素。因此，jQuery\
  \ 提供了 `.attr()` 和 `.prop()` 方法来获取和设置这些元素的属性和属性。\n\n`.attr(attribute, [value])` 方法允许你仅指定属性名来获取当前值，也可以指定一个可选的值来设置当前值。例如，下面的代码获取了\
  \ `id=\"bannerImg\"` 的特定图像元素的 `src` 值：\n\n点击此处查看代码图片\n\n```javascript\nvar state\
  \ = $(\"#bannerImg\").attr(\"src\");\n```\n\n然后，下面的语句设置了所有 `<img>` 元素的 `src` 属性值：\n\
  \n点击此处查看代码图片\n\n```javascript\n$(\"img\").attr(\"src\",\"images/default.jpg\");\n\
  ```\n\n`.prop(property, [value])` 方法允许你指定属性来获取当前值，并指定一个可选的值来设置当前值。例如，下面的代码获取了 `id=\"\
  firstCheckbox\"` 的特定元素的勾选状态：\n\n点击此处查看代码图片\n\n```javascript\nvar state = $(\"#firstCheckbox\"\
  ).prop(\"checked\");\n```\n\n接下来的语句将把所有 `<input>` 元素的 `checked` 值设为 `true`：\n\n\
  点击此处查看代码图片\n\n```javascript\n$(\"input\").prop(\"checked\", true);\n```\n\n####\
  \ 注意\n\njQuery 中属性（attribute）和特性（property）之间的唯一区别在于：特性的是定义 HTML 结构的值，而属性是影响对象动态状态的值。例如，在\
  \ `<input>` 元素中，\"type\"` 是一个属性，因为它定义了结构；而 `\"checked\"` 是属性，因为它只影响状态。\n\n### 获取和设置\
  \ CSS 属性\n\n动态网页编程另一个重要方面是 CSS 的动态操作。\n\nJavaScript 允许你通过 DOM 对象的 style 属性访问 CSS\
  \ 属性。例如，你可以使用下面的代码从 DOM 对象中获取元素的 `color` 和 `background-color` CSS 属性。注意，你需要使用 `style[\"\
  background-color\"]` 语法，因为 `style.background-color` 在 JavaScript 中是无效的：\n\n点击此处查看代码图片\n\
  \n```javascript\nvar domObj = document.getElementById(\"banner\");\nvar color =\
  \ domObj.style.color;\nvar color = domObj.style.[\"background-color\"];\n```\n\n\
  另一个示例是你可以使用下面的代码为元素设置 `position`、`top` 和 `left` CSS 属性：\n\n点击此处查看代码图片\n\n```javascript\n\
  domObj.style.position = \"absolute\";\ndomObj.style.top = \"100px\";\ndomObj.style.left\
  \ = \"100px\";\n```\n\njQuery 也允许使用 `.css(property, [value])` 方法非常方便地获取和设置 CSS 值。例如，下面的代码获取元素的\
  \ `cursor` CSS 属性值：\n\n点击此处查看代码图片\n\n```javascript\n$(\"#buttonA\").css(\"cursor\"\
  );\n```\n\n然后，下面的语句设置了 `border-radius` 值：\n\n点击此处查看代码图片\n\n```javascript\n$(\"#buttonA\"\
  ).css(\"border-radius\", \"10px 15px\");\n```\n\n`.css()` 方法还允许你传递一个包含属性和值的对象。这允许你一次性设置多个配置。例如，下面的代码使用\
  \ `.css()` 同时设置 `margin`、`padding`、`float` 和 `font-weight` 属性：\n\n点击此处查看代码图片\n\n\
  ```javascript\n$(\"span\").css({margin:0, padding:2, float:\"left\", \"font-weight\"\
  :\"bold\"});\n```\n\n注意，属性名可以用引号括起来，也可以不。如果属性名包含 `–` 或其他在 JavaScript 对象名中无效的字符，则需要使用引号。\n\
  \n### 获取和设置大小\n\n动态网页编程另一个重要方面是动态操作 CSS。\n\nJavaScript 允许你通过 DOM 对象的 style 属性访问\
  \ CSS 属性。例如，你可以使用下面的代码从 DOM 对象中获取元素的 `color` 和 `background-color` CSS 属性。注意，你需要使用\
  \ `style[\"background-color\"]` 语法，因为 `style.background-color` 在 JavaScript 中是无效的：\n\
  \n点击此处查看代码图片\n\n```javascript\nvar domObj = document.getElementById(\"banner\");\n\
  var color = domObj.style.color;\nvar color = domObj.style.[\"background-color\"\
  ];\n```\n\n另一个示例是你可以使用下面的代码为元素设置 `position`、`top` 和 `left` CSS 属性：\n\n点击此处查看代码图片\n\
  \n```javascript\ndomObj.style.position = \"absolute\";\ndomObj.style.top = \"100px\"\
  ;\ndomObj.style.left = \"100px\";\n```\n\njQuery 也允许使用 `.css(property, [value])`\
  \ 方法非常方便地获取和设置 CSS 值。例如，下面的代码获取元素的 `cursor` CSS 属性值：\n\n点击此处查看代码图片\n\n```javascript\n\
  $(\"#buttonA\").css(\"cursor\");\n```\n\n然后，下面的语句设置了 `border-radius` 值：\n\n点击此处查看代码图片\n\
  \n```javascript\n$(\"#buttonA\").css(\"border-radius\", \"10px 15px\");\n```\n\n\
  `.css()` 方法还允许你传递一个包含属性和值的对象。这允许你一次性设置多个配置。例如，下面的代码使用 `.css()` 同时设置 `margin`、`padding`、`float`\
  \ 和 `font-weight` 属性：\n\n点击此处查看代码图片\n\n```javascript\n$(\"span\").css({margin:0,\
  \ padding:2, float:\"left\", \"font-weight\":\"bold\"});\n```\n\n注意，属性名可以用引号括起来，也可以不。如果属性名包含\
  \ `–` 或其他在 JavaScript 对象名中无效的字符，则需要使用引号。\n\n### 获取和设置大小\n\n处理 HTML 元素时的另一个重要方面是获取它们的尺寸。jQuery\
  \ 让这变得非常简单。表 10.2 显示了用于获取高度和宽度的方法。\n\n![Image](img/089.jpeg)\n\n**表 10.2 获取和设置大小的\
  \ jQuery 方法**\n\n#### 注意\n\n高度和宽度方法只返回第一个元素的尺寸。这并不是问题。只需记住其他对象可能有不同的尺寸。\n\n####\
  \ 获取和设置位置\n\n除了 HTML 元素的尺寸外，你通常还需要获取它们的位置。处理 HTML 元素时，有两种位置。第一种是相对于整个文档的位置。第二种是相对于作为父元素的\
  \ HTML 元素的位置。哪个元素取决于 CSS 的设置。\n\njQuery 提供了 `.position([position])` 方法来获取相对于父元素的位置。`.offset([position])`\
  \ 方法提供文档的位置。这两个方法都可以不带参数调用。它们返回一个包含 `left` 和 `right` 属性的简单对象，使用 `.offset()` 表示相对于文档的像素数，使用\
  \ `.position()` 表示相对于父元素的位置。它们也可以接受一个简单的 `position` 属性，这是一个具有 `left` 和 `right` 属性的对象。当带有\
  \ `position` 参数调用时，它们将设置元素的位置。\n\n例如，下面的代码将获取 `id=\"myElement\"` 元素相对于文档左上角和父元素的像素值。注意，为了在一行中获取这些语句，你直接引用调用后的\
  \ `top` 和 `left` 属性：\n\n点击此处查看代码图片\n\n```javascript\nvar pixelsFromPageTop = $(\"\
  #myElement\").offset().top;\nvar pixelsFromPageLeft = $(\"#myElement\"). offset\
  \ ().left;\nvar pixelsFromParentTop = $(\"#myElement\").position().top;\nvar pixelsFromParentLeft\
  \ = $(\"#myElement\"). position ().left;\n```\n\n要设置该元素距离文档左上角向下 10 像素、向右 10 像素的距离，请使用下面的语句定义一个包含\
  \ `left` 和 `top` 值的简单对象并传递给 `.offset()` 方法：\n\n```javascript\n$(\"#myElement\").offset({\"\
  top\":10,\"left\":10});\n```\n\n#### 访问类\n\n\n\n\n\n获取与 HTML 元素关联的类的简单方法是查看 DOM\
  \ 对象的 `className` 属性。`className` 属性是一个字符串，包含了附加到元素上的一个或多个类名。请记住，元素可能关联了多个类名。在这种情况下，这些名称将用空格分隔。\n\
  \n以下示例展示了如何使用 jQuery 获取 `id=\"mainList\"` 元素的 `className` 属性：\n\n点击此处查看代码图片\n\n\
  ```javascript\nvar class = $(\"#mainList\").get().className;\n```\n\n## 获取浏览器和屏幕尺寸及颜色信息\n\
  \n动态操作网页的一个重要部分是访问有关屏幕和浏览器信息的能力。本节侧重于尺寸和颜色能力。\n\n获取屏幕或浏览器窗口的大小允许你根据屏幕或浏览器窗口上的可用区域来调整\
  \ HTML 元素的大小。\n\n你可以使用 JavaScript 中的 `Screen` 对象来访问屏幕尺寸。`Screen` 对象提供了 `width` 和\
  \ `height` 属性，它们是屏幕分辨率的维度。例如，以下代码将屏幕的 `width` 和 `height` 存储在变量中：\n\n点击此处查看代码图片\n\
  \n```javascript\nvar sWidth = screen.width;\nvar sHeight = screen.height;\n```\n\
  \n要获取屏幕（以及 Web 浏览器）支持的颜色，请使用 `Screen` 对象的 `colorDepth` 属性。它返回支持的位数值——例如 8、16、24。以下是获取屏幕支持的颜色深度的示例：\n\
  \n点击此处查看代码图片\n\n```javascript\nvar colorBits = screen.colorDepth;\n```\n\n即使屏幕很大，浏览器窗口也可能没有占据整个屏幕。虽然浏览器为超出窗口大小的网页提供了滚动条，但随着浏览器尺寸的变化，调整页面元素的大小或调整布局通常看起来更好。\n\
  \n可以通过 JavaScript 中 `window` 对象的 `innerWidth`、`outerWidth`、`innerHeight` 和 `outerHeight`\
  \ 属性访问浏览器维度。`innerHeight` 和 `innerWidth` 值指的是网页实际可用的区域。`outerWidth` 和 `outerHeight`\
  \ 指的是包括浏览器菜单、边框和工具栏在内的总区域。以下是获取网页显示区域尺寸的示例：\n\n点击此处查看代码图片\n\n```javascript\nvar\
  \ pageWidth = window.innerWidth;\nvar pageHeight = window.innerHeight;\n```\n\n\
  ***\n\n## 动手一试：使用 jQuery 和 JavaScript 获取屏幕、浏览器、鼠标和元素信息\n\n现在是时候把所有内容整合在一起了。在这个示例中，你将构建一个包含不同\
