  \ \"there lived an [animal] that liked to \";\nvar line3 = \"[action] people.\"\
  ;\n```\n\n### 6. 添加以下三个字符串定义，用于填充 madlib（填空游戏）中的项目项：\n\n点击此处查看代码图像\n\n```javascript\n\
  var place = \"crater\";\nvar animal = \"elephant\";\nvar action = \"smell\";\n```\n\
