  ```\n\n**5.** 错误。元素可以被分配多个类。\n\n### 练习题\n\n**1.** 打开 Listings 10.1、10.2 和 10.3 中的代码，并添加一个带有\
  \ `target` 和 `href` 值的链接。然后修改 JavaScript，在网页的信息部分也显示这些值，这样你就可以悬停在链接上并看到它们。\n\n**2.**\
  \ 打开 Listings 10.7、10.8 和 10.9 中的代码，并添加四个新按钮。添加两个按钮来向上向下移动图像。然后添加两个按钮来将图像的透明度增加\
  \ .1 或减少 .1。你需要确保透明度停在 0 和 1 之间。\n\n## 第 11 节. 与窗口、浏览器及其他非网页元素交互\n\n在本节中你将学习到：\n\
  \n![Image](img/image00767.jpeg) 为网页添加定时器\n\n![Image](img/image00767.jpeg) 获取和设置\
  \ cookie\n\n![Image](img/image00767.jpeg) 创建弹出窗口\n\n动态网页通常需要你访问，并且在某些情况下甚至甚至操纵 HTML\
  \ 元素之外的内容。JavaScript 提供了一系列丰富的对象和函数，允许你访问有关屏幕、浏览器窗口、历史记录等信息。\n\n本节的第一部分描述了 `screen`、`window`、`location`\
  \ 和 `history` 对象，这些对象为 JavaScript 访问网页之外的信息提供了接口。第二部分涵盖了利用这些对象来实现 cookie、弹出窗口和定时器。\n\
  \n### 了解 screen 对象\n\n你已经在之前的课程中见过 screen 对象的用法。你曾使用 screen 对象来获取颜色深度以及屏幕的高度和宽度。随着向移动设备和平板电脑的转变，获取屏幕尺寸变得更加重要。\n\
  \n屏幕尺寸非常多；因此，你必须能够在设计网页和动态交互时考虑到屏幕尺寸。\n\nTable 11.1 描述了 screen 对象上可用的全部属性。\n\n![Image](img/image00904.jpeg)\n\
  \n**表 11.1 screen 对象属性**\n\n### 使用 window 对象\n\nwindow 对象是外部对象集中中最健壮的。window 对象提供了对浏览器窗口的访问，允许你获取如浏览器窗口的尺寸和位置等信息。\n\
  \n使用 window 对象，当你想要显示额外的网页内容但不想离开当前页面时，还可以创建并控制新的浏览器窗口。\n\n以下章节描述了附加到 window 对象的一些方法和属性。\n\
  \n#### 访问 window 对象属性\n\nwindow 对象提供了有关浏览器窗口的重要信息。你可以访问当前窗口甚至其父窗口的大小和位置。例如，以下代码获取了从屏幕左上角到浏览器左上角的像素向下和向左：\n\
  \n点击此处查看代码图片\n\n```\nvar fromTop = window.self.screenY;\nvar fromLeft = window.self.screenX;\n\
  ```\n\nTable 11.2 显示了一些较重要的 window 对象属性列表及其用途。\n\n![Image](img/image00905.jpeg)\n\
  \n**表 11.2 window 对象属性**\n\n#### 使用 window 方法\n\nwindow 对象还提供了一系列方法，允许你创建子窗口。例如，以下代码打开了一个新窗口：\n\
  \n点击此处查看代码图片\n\n```\nvar tempWindow = window.open(\"http://example.com\");\n```\n\
  \n随后，从原始页面，你可以使用以下代码关闭窗口：\n\n```javascript\ntempWindow.close();\n```\n\n### 使用 location\
  \ 对象\n\n浏览器 location 对象提供了对当前位置的访问。这允许你访问 URL 信息以及刷新当前页面或加载一个新的。\n\n例如，以下语句获取了 URL：\n\
  \n点击此处查看代码图片\n\n```\nvar oldURL = location.href;\nlocation.assign(\"http://example.com\"\
  );\n```\n\n此外，如果 URL 链接到网页上的特定锚点，你可以通过 `location.hash` 获取该部分。你可以使用锚点提供向后兼容性。\n\n\
  ```javascript\nvar anchor = location.hash;\n```\n\nTable 11.3 显示了 location 对象属性。\n\
  \n![Image](img/image00906.jpeg)\n\n**表 11.3 location 对象属性**\n\n### 使用 history 对象\n\
  \nhistory 对象提供了对浏览器历史记录的访问，允许你动态地移动，而无需用户点击浏览器的“前进”和“后退”按钮。\n\n#### 在浏览器历史记录中前进\n\
  \n要向前移动，你可以使用 `history.forward()` 移动历史记录中的下一个 URL，或者使用 `history.go(n)`，其中 `n` 是一个正数，表示前进的步数。例如，以下语句向前移动三个\
  \ URL：\n\n```\nhistory.go(3);\n```\n\n#### 在浏览器历史记录中后退\n\n要向后移动，你可以使用 `history.back()`\
  \ 到历史记录中的上一个 URL，或者使用 `history.go(n)`，其中 `n` 是一个负数，表示后退的步数。例如，以下语句向后移动两个 URL：\n\n\
  ```\nhistory.go(-2);\n```\n\n### 控制外部链接\n\n动态网页编程的重要部分还包括控制网页外的链接。以下章节描述了控制外部链接行为的一些方法，通过阻止其发生或强制其打开新的浏览器窗口。\n\
  \n#### 停止网页上的外部链接\n\n使用简单的 jQuery 脚本可以执行的一个有用任务是阻止外部链接的发生。这允许你通过内部的一个 `<a>` 元素来锁定离开网页的链接。\n\
  \n\n\n\n\n要锁定网页上的外部链接，你首先需要为链接外部的 `<a>` 标签添加一个点击事件处理程序，然后在点击事件对象上调用 `preventDefault()`。例如，以下代码使用了\
  \ jQuery 的 `^=` 选择器语法来查找 `href` 以 `http://` 开头的 `<a>` 标签，然后添加一个点击处理程序函数来阻止默认的浏览器行为：\n\
  \n点击此处查看代码图片\n\n```javascript\n$('ahref^=\"http://\"').click(function (e){\n   \
  \ any of your own handler code . . .\n    e.preventDefault();\n});\n```\n\n## 强制链接在新浏览器窗口中打开\n\
  \n你通过简单的 jQuery 脚本可以执行的另一个有用任务是强制外部链接在新窗口中打开。这可以使当前窗口保持可用状态。\n\n要强制外部链接在新窗口中打开，请为链接外部的\
  \ `<a>` 标签设置 `target` 属性为“_blank””。例如，以下代码查找 `href` 以 `http://` 开头的 `<a>` 标签，然后将\
  \ `target` 属性设置为“_blank”，强制链接在点击时在新浏览器窗口中打开：\n\n[点击此处查看代码图片\n\n```javascript\n$('ahref^=\"\
  http://\"').attr(\"target\", \"_blank\");\n```\n\n***\n\n## 动手尝试：获取和设置 Cookie\n\n\
  Cookies 允许你在客户端浏览器中静态存储少量信息，是 Web 范式的重要部分。Cookies 通常由服务器端脚本读取；但是如果你能够从 JavaScript\
  \ 获取并设置 Cookie 而不需要额外的服务器通信，那也将非常有帮助。\n\n你可以通过读取或写入 `document.cookie` 属性来获取和设置 Cookie。`document.cookie`\
  \ 是字符串格式，包含以下格式的 `name`、`value`、`expiration` 和 `path`：\n\n`name=value;expiration;path`\n\
  \n帮助你理解如何实现 Cookie 的简单方法是通过示例进行演示。以下示例将带你通过创建简单的 JavaScript 来从网页中获取和设置 Cookie 的过程。示例代码显示在\
  \ [Listing 11.1、11.2 和 11.3 中。使用以下步骤实现该示例：\n\n1. 在 Eclipse 中，创建 `lesson11/cookies.html`、`lesson11/js/cookies.js`\
  \ 和 `lesson11/css/cookies.css` 文件。\n\n2. 在 HTML 文件中添加 Listing 11.1、11.2 和 11.3 所示的代码。你应该能识别出这些\
  \ HTML 组件。HTML 代码包含几个 `<span>` 元素，它们被样式化为按钮、用于输入 Cookie 名称和值的文本输入框，以及一个 Cookie 列表。\n\
  \n3. 将 Listing 11.3 中的 CSS 添加到 CSS 文件中。这段代码对按钮进行了样式处理。\n\n4. 打开 `cookies.js` 文件并添加以下\
  \ `ready()` 函数，该函数为获取、设置和删除 Cookie 的按钮添加点击处理程序。注意，处理程序从名为 name `<input>` 的字段获取 Cookie\
  \ 名称：\n\n点击此处查看代码图片\n\n```javascript\n01 $(document).ready(function(){\n02    $(\"\
  #set\").click(function(e){setCookie($(\"#cookieName\").val(),\n03              \
  \                       $(\"#cookieValue\").val(), 1);});\n04    $(\"#get\").click(function(e){getCookie($(\"\
  #cookieName\").val());});\n05    $(\"#delete\").click(function(e){setCookie($(\"\
  #cookieName\").val(), \"\", -1);});\n06    displayCookies();\n07 });\n```\n\n5.\
  \ 添加以下 `setCookie()` 处理函数，该函数获取日期并使用它来创建过期时间字符串。代码随后使用 `name`、`value`、`expires`\
