  18 </html>\n```\n\n### 总结\n\n依赖注入允许你定义可以注入到其他 AngularJS 组件的提供者功能。提供者功能包含在模块内部，并在注入器服务（injector\
  \ service）注册。提供者定义了如何构建这些功能，以便当另一个组件定义对提供者的依赖时，可以创建并注入提供者对象的实例。\n\nAngularJS 提供了一个相当健壮的依赖注入模型，允许你定义不同类型的服务提供者。使用依赖注入而不是全局定义可以让你的代码更模块化且更于维护。在本节中，你学习了依赖注入模型，并了解了如何在模块和控制器组件中实现它。\n\
  \n### 问答\n\n**问。 AngularJS 应用的控制器和指令代码是在运行 块之前还是之后执行？**\n\n**答。** 执行顺序是：配置（config）、运行（run）、指令编译（directive.compile）、控制器（controller）和指令链接（directive\
  \ link）。\n\n### 工作坊\n\n工作坊包含了一组问答，旨在巩固你的理解。\n\n#### 测验\n\n**问。 AngularJS 应用的控制器和指令代码是在运行\
  \ 块之前还是之后执行？**\n\n**答。** 执行顺序是：配置（config）、运行（run）、指令编译（directive.compile）、控制器（controller）和指令链接（directive\
  \ link）。\n\n（注：提供的文本包含重复部分；已保留核心内容并进行了结构化处理。）\n\n\n\n\n控制器（Controllers）是通过扩展作用域（scope）来提供业务逻辑的代码段。你通过在应用程序的\
  \ `Model` 对象上使用 `controller()` 方法创建控制器。该函数将控制器注册为模块中的一个提供者（provider），但它不会创建控制器的实例。实例的是在\
  \ AngularJS 模板中 `ng-controller` 指令被绑定时发生的。\n\n`controller()` 方法接受控制器名称作为第一个参数，并将依赖项数组作为第二个参数。例如，以下代码定义了一个使用依赖注入来访问名为\
  \ `start` 的 `value` 构造者的控制器：\n\n点击此处查看代码图像\n\n```javascript\nangular.module('myApp',\
  \ []).\n  value('start', 200).\n  controller('Counter', ['$scope', 'start',\n  \
  \                             function($scope, startingValue) {\n  }]);\n```\n\n\
  注意，`value()` 和 `controller()` 方法是通过点符号 `.` 链式连接的。你会在 AngularJS 应用中经常看到这种用法。当 AngularJS\
  \ 中创建一个新的控制器实例时，还会创建一个特定于该控制器的新子作用域，并且可以通过注入到之前的 `Counter` 控制器的 `$scope` 服务进行访问。同样在之前显示的示例中，`start`\
  \ 提供者被注入到控制器，并作为 `startingValue` 传递给控制器函数。参数注入基于它们在传递给 `controller()` 函数的数组中的位置。\n\
  \n控制器必须初始化创建并添加到该作用域的状态。控制器还负责附加到该作用域的任何业务逻辑。这可能意味着处理作用域的更新更改、操纵作用域值，或根据作用域的状态发射事件。\n\
  \n***\n\n### 动手尝试：实现一个基础控制器\n\n在例示例中，你有机会稍微尝试一下控制器代码。列表 22.1 显示了如何实现一个利用依赖注入、初始化某些值并使用\
  \ `inc()`、`dec()` 和 `calcDiff()` 函数实现基础业务逻辑的控制器。列表 22.2 显示了一个基础的 AngularJS HTML\
  \ 模板，该模板提供了查看和操作存储在作用域中的值的视图。\n\n使用以下步骤构建应用程序并实现该应用程序和控制器：\n\n1. 添加 `lesson22/scope_controller.html`\
  \ 和 `lesson22/js/scope_controller.js` 文件。\n2. 在 HTML 和 JavaScript 文件中添加 列表 22.1\
  \ 和 列表 22.2 所示的代码。\n3. 来自 列表 22.1 的以下代码实现了一个 AngularJS 模块，并带名为 `Counter` 的控制器：\n\
  \n点击此处查看代码图像\n\n```javascript\n01 angular.module('myApp', []).\n02    value('start',\
  \ 200).\n03    controller('Counter', '$scope', 'start',\n04                    \
  \               function($scope, start) {\n```\n\n4. 随后，接下来的几行在 `Counter` 控制器的 `$scope`\
  \ 中定义了值：\n\n[点击此处查看代码图像\n\n```javascript\n05    $scope.start = start;\n06    $scope.current\
  \ = start;\n07    $scope.difference = 0;\n08    $scope.change = 1;\n```\n\n5. 注意在接下来的几行中，定义了\
