  \ elementInfo(e){\n18   e.stopPropagation();\n19   $(\"#elementId\").html(e.target.id);\n\
  20   $(\"#elementType\").html(e.target.tagName);\n21   $(\"#elementClass\").html(e.target.className);\n\
  22   $(\"#elementSize\").html(e.target.offsetWidth + \"x\" + e.target.offsetHeight);\n\
  23   $(\"#elementPosition\").html(e.target.offsetLeft + \", \" + e.target.offsetTop);\n\
  24   $(\"#elementValue\").html(e.target.value);\n25   $(\"#elementChecked\").html(e.target.checked);\n\
  26   $(\"#elementSource\").html(e.target.src);\n27   $(\"#elementColor\").html(window.getComputedStyle(e.target).color);\n\
  28 }\n29 function windowResize(){\n30   $(\"#browserSize\").html(window.innerWidth\
  \ + \"x\" + window.innerHeight);\n31 }\n```\n\n***\n\n**代码 10.3 web_page_manipulation.css\
  \ 用于设置 `div` 和其他元素的 CSS 代码**\n\n点击此处查看代码图片\n\n***\n\n```css\n01 .infoContainer{\n\
  02   border:3px ridge;\n03   padding:3px;\n04   position:fixed; display:inline-block;\n\
  05   top:10px;\n06   background-color:#C0C0C0;\n07   width:200px;\n08   height:280px;\n\
  09 }\n10 .infoContainer div{\n11   float:right;\n12 }\n13 .infoContainer span{\n\
  14   color:blue;\n15 }\n16 .infoContainer p{\n17   margin:10px;\n18 }\n19 #banner{\n\
  20   font-size:24px; /* Wait, original was font-size:24px */\n21   text-align:center;\n\
  22 }\n23 #menu{\n24   background-color:gray;\n25   padding:5px;\n26 }\n27 .menuItem{\n\
  28   font-size:20px;\n29   color:white;\n30 }\n31 .imageArea{\n32   color:firebrick;\n\
  33 }\n```\n\n### 动态操作页面元素\n\n在上一节中，你不仅学习了如何访问组件，还学习了如何更改值、属性和 CSS 设置。本节通过讨论添加和删除元素、更改类以及切换显示等额外方法来扩展这些概念。\n\
  \n#### 动态添加元素\n\n通常，在用户登录、从 Web 服务接收附加信息或进行其他交互之前，你并不知道页面上会有哪些元素。在这些情况下，你需要在 jQuery\
  \ 和 JavaScript 代码中动态添加元素。\n\n##### 在 JavaScript 中添加元素\n\n添加 HTML 元素有多种方法。最基础的方法是将容器对象的\
  \ `innerHTML` 属性设置为 HTML 字符串。例如，以下代码将现有对象的内容设置为一个新的 `<p>` 元素：\n\n```javascript\n\
  domObj.innerHTML = \"<p>Paragraph 1 goes here</p>\";\ndomObj.innerHTML += \"<p>Paragraph\
  \ 2 goes here</p>\";\n```\n\n这种方法的问题在于它会导致写出非常糟糕的字符串语句，以后可能会带来巨大的麻烦。因此，JavaScript\
  \ 提供了一种创建 DOM 对象并将其附加到父对象的方法。\n\n```javascript\nvar newP = createElement(\"p\");\n\
  ```\n\n\n\n```\nvar newT = createTextNode(\"Paragraph 1 goes here\");\nnewP.appendChild(newT);\n\
  domObj.appendChild(newP);\n```\n\n这需要的代码稍多，但流程要安全得多。此外，创建对象的优势在于，你拥有了一个真实的 DOM 对象，可以向该元素添加额外的值。例如，以下代码允许你在将元素添加到现有对象之前，添加一个\
  \ `<img>` 元素并设置 `src` 和 `height` 属性：\n\n点击此处查看图片\n\n```javascript\nvar newImg =\
  \ createElement(\"img\");\nnewImg.src = \"images/sunset.jpg\";\nnewImg.height =\
  \ 200;\ndomObj.appendChild(newImg);\n```\n\n### 在 jQuery 中添加页面元素\n\n现在你可以查看如何在 jQuery\
  \ 中添加新元素了。你可以通过使用 `.html()` 方法在 jQuery 中应用与 JavaScript 相同的 `innerHTML` 简写方法，该方法可以获取或设置\
  \ `innerHTML` 字符串。例如：\n\n点击此处查看图片\n\n```javascript\n$(\"#myDiv\").html(\"<p>Paragraph\
  \ 1 goes here</p>\");\n```\n\n然而，这种方法具有相同的限制性，应该谨慎使用。更好的方法是创建一个新的 jQuery 对象并将其追加。以下代码将带你完成该过程。第一步是通过向\
  \ jQuery 对象 `$` 传递标签名或 HTML 字符串来创建该对象。例如，以下语句创建了一个包含一个 `<p>` 元素的新 jQuery 对象：\n\n\
  ```javascript\nvar newP = $(\"<p></p>\");\n```\n\n然后你可以使用以下代码向段落添加文本：\n\n点击此处查看图片\n\
  \n```javascript\nnewP.html(\"Paragraph 1 goes here\");\n```\n\n然后你可以使用 `.append(jQueryObject)`\
  \ 将一个元素添加到一个或多个现有元素中。例如，以下代码将段落添加到所有的 `<div>` 元素中：\n\n```javascript\n$(\"div\").append(newP);\n\
  ```\n\n为了说明这一点，以下代码创建了一个包含 `<img>` 元素的新 jQuery 对象，并将其添加到所有 `<li>` 元素中：\n\n点击此处查看图片\n\
  \n```javascript\nvar newImg = $(\"<img></img>\");\nnewImg.attr(\"src\", \"images/sunset.jpg\"\
  );\nnewImg.height(30);\n$(\"li\").append(newImg);\n```\n\njQuery 还提供了 `.appendTo(target)`\
  \ 方法，允许你将一个对象追加到另一个对象。它的工作方式与 `.append()` 相同，但方向相反。该方法是从子对象调用的，而不是新的父对象。例如，上一个示例中的\
  \ `newImg` 对象可以使用以下语句追加：\n\n```javascript\nnewImg.appendTo(\"li\");\n```\n\n###\
  \ 移除页面元素\n\n页面元素可以通过几种方式移除。最基本的方法是获取父对象，然后对 DOM 对象设置 `domObj.innerHTML = \"\"`，或者对\
  \ jQuery 对象调用 `jObj.html(\"\")`。这将擦除父元素内部的所有内容，从而移除任何子元素。\n\n尝试设计你的 HTML 组件，以便你能够使用\
  \ `.html(\"\")` 方法移除元素，因为这样可以让清理代码非常简单。另一个优势是向容器中添加新元素变得更容易，因为你不需要处理已有的元素。\n\n在\
  \ JavaScript 中，你也可以在父元素上调用 `.removeElement(child)`。例如，以下代码获取一个 `id=\"container\"\
  ` 的元素，然后移除 `id=\"paragraphA\"` 的子元素：\n\n点击此处查看图片\n\n```javascript\nvar parent=document.getElementById(\"\
  container\");\nvar child=document.getElementById(\"paragraphA\");\nchild.parentNode.removeChild(child);\n\
  ```\n\njQuery 提供了两种移除元素的方法。第一个是 `.empty()`，它等同于 `.html(\"\")`。使用 `.empty()`，所有子元素和文本将被移除。第二个方法是\
  \ `.remove([selector])`，它仅根据原始查询和可选的 `selector` 移除元素。\n\n如果没有指定选择器，则移除来自原始查询的元素。例如，要移除所有的\
  \ `<div>` 元素，使用以下语句：\n\n```javascript\n$(\"div\").remove()\n```\n\n如果指定了选择器，则原始查询中匹配选择器的子元素将被移除。例如，要移除\
  \ `<div>` 元素内部的 `<p>` 元素，请使用以下代码：\n\n```javascript\n$(\"div\").remove(\"p\");\n\
  ```\n\njQuery 还提供了一个在移除元素时非常有用的额外方法：`.detach([selector])` 方法。detach 方法的工作方式与 `.remove([selector])`\
  \ 方法相同，但有一个重要的区别：即使元素从父元素中移除，实际的元素 DOM 数据也不会被删除。你可以在现有的 jQuery 对象中保留这些元素，并可以将它们重新插入\
  \ DOM 的另一个位置。\n\n例如，以下代码从一个元素中分离所有段落并将它们追加到另一个元素中：\n\n点击此处查看图片\n\n```javascript\n\
  var ps = $(\"#div1\").detach(\"p\");\nps.appendTo(\"#div2\");\n```\n\n### 在 jQuery\
  \ 中替换元素\n\n正如前面的节中所看到的，你可以通过 jQuery 轻松地添加和移除元素。你还需要具备将现有元素集合替换为其他元素集合。这在 jQuery\
  \ 中是必要的，因为移除元素后，你将无法再次执行相同的查询，因为元素已经消失了。\n\n你可以使用三种方法在 jQuery 中替换元素。最简单的是使用 `.html()`。jQuery\
  \ 中的 `.html()` 方法对于替换元素的内容非常有用。`.html()` 方法接受字符串或对象。例如，以下语句将所有 `<div>` 元素的内容替换为段落：\n\
  \n点击此处查看图片\n\n```javascript\n$(\"div\").html(\"<p>New Paragraph</p>\");\n```\n\n\
  另一种用新内容替换文档中元素集合的方法是 `.replaceAll(target)` 方法。该方法将匹配 `target` 选择器的元素集合替换为当前集合。例如，要将\
  \ `parentB` 中所有的 `<div>` 元素替换为 `parentA` 中的 `<span>` 元素，你可以使用以下代码：\n\n点击此处查看图片\n\
  \n```javascript\n$(\"#parentA span\").replaceAll(\"#parentB\");\n```\n\n最后一个方法是使用\
  \ `.replaceWith(newContent)`，它与 `.replaceAll()` 相反`.replaceWith()` 函数用指定的内容替换当前集合。例如，要将所有的\
  \ `<div>` 元素替换为一个空白 `<div>`，你可以使用以下代码：\n\n点击此处查看图片\n\n```javascript\n$(\"div\").replaceWith(\"\
  <div></div>\");\n```\n\n### 在 jQuery 中插入元素\n\njQuery 的另一个重要功能是能够轻松地向现有内容插入元素。你已经学会如何在末尾追加项目；但如果你想把内容放在中间呢？这时\
  \ `.before()` 和 `.after()` 方法就派上用场了。\n\n`.after(content [,content])` 方法允许你指定插入在当前\
  \ jQuery 对象集合之后的元素。例如，要在文档中第三个 `<p>` 元素之后插入新段落，你可以使用以下代码：\n\n点击此处查看图片\n\n```javascript\n\
  $(\"p:eq(2)\").after(\"<p>New Paragraph</p>\");\n```\n\n`.before(content [,content])`\
  \ 方法允许你指定插入在当前 jQuery 对象集合之前的元素。例如，在要在文档中第三个 `<p>` 元素之前插入新段落，你可以使用以下代码：\n\n点击此处查看图片\n\
  \n```javascript\n$(\"p:eq(2)\").before(\"<p>New Paragraph</p>\");\n```\n\n* * *\n\
  \n#### 注意\n\n这两个 `.after()` 和 `.before()` 方法都允许你传递多个要插入的对象，并用逗号分隔。这使得你能够准备好对象集合，然后一次性将它们插入正确的位置。\n\
  \n* * *\n\n#### 修改类\n\n\n\n\n\n富交互网页中一个非常重要的部分是良好的 CSS 设计。`JavaScript` 和 `jQuery`\
  \ 可以通过动态向元素添加和移除类名来增强 CSS 设计。\n\n`jQuery` 使添加、移除和切换类的开启状态变得极其简单。如果你将 CSS 代码设计得当，就可以非常容易地应用一些精妙的效果。\n\
  \n使用 `.addClass(className)` 方法添加类。例如，要为所有 `<span>` 元素添加名为 `active` 的类，你可以使用以下语句：\n\
  \n点击此处查看代码图片\n\n```\n$(\"span\").addClass(\"active\");\n```\n\n使用 `.removeClass([className])`\
  \ 方法移除类。例如，要从 `<span>` 元素中移除 `active` 类，调用以下代码：\n\n点击此处查看代码图片\n\n```\n$(\"span\"\
  ).removeClass(\"active\");\n```\n\n你也可以使用不带任何 `className` 的 `remove`，这会移除元素的所有类名。例如，以下语句会移除所有\
  \ `<p>` 元素上的类名：\n\n```\n$(\"p\").removeClass();\n```\n\n你还可以使用 `.toggleClass(className\
  \ , switch)` 方法切换类的开启和关闭。除了 `className` 之外，你还可以为可选的 `switch` 参数指定 `true` 或 `false`，指示开启或关闭类。\n\
  \n例如，要关闭所有 `<span>` 元素的 `active` 类和 `inactive` 类，代码如下：\n\n[点击此处查看代码图片\n\n```\n$(\"\
  span\").toggleClass(\"active\", true);\n$(\"span\").toggleClass(\"inactive\", false);\n\
  ```\n\n### 切换可见性\n\n改变网页视觉效果的一种简单方法是切换元素的可见性。你可以通过 `JavaScript` 将 `style.display`\
  \ 属性设置为 `\"none\"` 或 `\"\"` 来实现；然而，`jQuery` 提供了更加优雅且可扩展的解决方案。\n\n要使用 `jQuery` 显示元素，请对该对象调用\
  \ `.show()` 方法。要隐藏元素，则使用 `.hide()` 方法。这非常简单。例如，要隐藏名为 `jObj` 的对象，使用以下语句：\n\n```\n\
  jObj.hide();\n```\n\n要再次显示它，请使用以下代码：\n\n```\njObj.show();\n```\n\n`.hide()` 的一个问题是，应用后元素将不再占据任何页面空间。这可能是你想要的，但在某些情况下，你可能只希望元素不可见但仍占据空间。要让元素不可见，可以将\
  \ CSS 属性 `opacity` 设置为 0。例如：\n\n```\njObj.css(\"opacity\", \"0\");\n```\n\n让元素再次可见，将\
  \ `opacity` 回 1：\n\n```\njObj.css(\"opacity\", \"1\");\n```\n\n> 提示\n> 将透明度设置得低但不为\
  \ 0，是显示元素当前未激活但仍保持显示的好方法。例如，你可以将尚未实现和激活的菜单及按钮元素透明度设为 .5，这样它们仍然显示，但显然是不可点击的。\n\n\
