  \ </html>\n```\n\n#### 使用 $interval 和 $timeout 服务实现定时器\n\nAngularJS 的 `$interval`\
  \ 和 `$timeout` 服务允许你延迟执行代码。这些服务与 JavaScript 的 `setInterval` 和 `setTimeout` 功能交互，但在\
  \ AngularJS 框架内进行。\n\n`$interval` 和 `$timeout` 服务使用以下语法：\n\n点击此处查看代码图片\n\n```javascript\n\
  $interval(callback, delay, [count], [invokeApply]);\n\n$timeout(callback, delay,\
  \ [invokeApply]);\n```\n\n参数描述如下：\n\n![Image](img/image0767.jpeg) `callback`:**\
  \ 在延迟过期后执行。\n\n![Image](img/image0767.jpeg) `delay`:** 指定在执行回调函数之前等待的毫秒数。\n\n\n\n\
  \n\n![Image](img/image00767.jpeg) `count`: 表示间隔重复的次数。\n\n![Image](img/image00767.jpeg)\
  \ `invokeApply`: 是一个布尔值，如果为 `true`，会导致函数仅在 AngularJS 事件循环的 `$apply()` 块中执行。默认值为\
  \ `true`。\n\n当你调用 `$interval()` 和 `$timeout()` 方法时，它们会返回一个 promise 对象，你可以使用该对象来取消超时或间隔。要取消现有的\
  \ `$timeout` 或 `$interval`，请调用 `cancel()` 方法。例如：\n\n点击此处查看代码图片\n\n```javascript\n\
  var myInterval = $interval(function(){$scope.seconds++;}, 1000, 10, true);\n```\n\
  \n. . .\n\n```javascript\n$interval.cancel(myInterval);\n```\n\n如果你通过 `$timeout`\
  \ 或 `$interval` 创建了超时或间隔，必须在 `scope` 或 `elements` 指令被销毁时使用 `cancel()` 显式地销毁它们。最简单的方法是向\
  \ `$destroy` 事件添加监听器。例如：\n\n点击此处查看代码图片\n\n```javascript\n$scope.$on('$destroy',\
  \ function(){\n  $scope.cancel(myInterval);\n});\n```\n\n### 使用 $animate 服务\n\n\
  `$animate` 服务提供了动画检测钩子，可以在执行进入（enter）、离开（leave）和移动（move）DOM 操作，以及 `addClass` 和 `removeClass`\
  \ 操作时。你可以通过 CSS 类名或 AngularJS 中的 `$animate` 服务使用这些钩子。\n\n要实现动画，你需要在想要动画的元素上添加一个支持动画的指令。表\
  \ 27.3 列出了支持动画的指令以及它们支持的动画事件类型。\n\n![Image](img/image01043.jpeg)\n\n**表 27.3 支持动画的\
  \ AngularJS 指令**\n\n#### 在 CSS 中实现动画\n\n要在 CSS 中实现动画，你需要在想要动画的元素中包含 `ngClass` 指令。AngularJS\
  \ 使用 `ngClass` 的值作为额外 CSS 类的根名称，这些类会在动画期间被添加和从元素中移除。\n\n在定义了 `ngClass` 指令的元素上会调用动画事件。表\
  \ 27.4 列出了在动画过程中添加和移除的额外类。\n\n![Image](img/image01044.jpeg)\n\n**表 27.4 在动画期间自动添加和移除的\
  \ AngularJS 指令**\n\n要实现基于 CSS 的动画，你需要为 表 27.4 中列出的额外类添加适当的 CSS 过渡代码。为了说明这一点，以下代码段为名为\
  \ `.img-fade` 的用户定义类实现了添加类和移除类的过渡，该类会在 2 秒持续内将图像的 `opacity`（透明度）动画更改为 `.1`：\n\n\
  点击此处查看代码图片\n\n```css\n.img-fade-add, .img-fade-remove {\n  -webkit-transition:all\
  \ ease 2s;\n  -moz-transition:all ease 2s;\n  -o-transition:all ease 2s;\n  transition:all\
  \ ease 2s;\n}\n\n.img-fade, .img-fade-add.img-fade-add-active {\n  opacity:.1;\n\
  }\n```\n\n注意，过渡被添加到 `.img-fade-add` 和 `.img-fade-remove` 类中，但实际的类定义应用于 `.img-fade`。你还需要类定义\
  \ `.img-fade-add.img-fade-add-active` 来设置过渡结束的状态。\n\n#### 在 JavaScript 中实现动画\n\n\
  实现 AngularJS CSS 动画非常简单，你也可以使用 `jQuery` 在 JavaScript 中实现动画。JavaScript 动画对你的动画提供了更直接的控制。此外，JavaScript\
  \ 动画不需要浏览器支持 CSS3。\n\n要在 JavaScript 中实现动画，你需要在加载 `angular.js` 库之前在模板中包含 `jQuery`\
  \ 库。例如：\n\n点击此处查看代码图片\n\n```html\n<script src=\"http://code.jquery.com/jquery-1.11.0.min.js\"\
  ></script>\n```\n\n***\n\n顺便说一下\n\n如果你希望利用 `jQuery` 动画的所有功能，包含完整的 `jQuery` 库是必要的。如果你决定包含\
  \ `jQuery` 库，请确保它在 HTML 代码中于 AngularJS 库之前被加载。\n\n***\n\n你还需要在应用程序的 `Module` 对象定义中包含\
  \ `ngAnimate` 依赖。例如：\n\n点击此处查看代码图片\n\n```javascript\nvar app = angular.module('myApp',\
  \ ['ngAnimate']);\n```\n\n然后你可以在 `Module` 对象上使用 `animate()` 方法来实现动画。`animate()`\
  \ 方法返回一个对象，该对象提供了让你处理的 `enter`、`leave`、`move`、`addClass` 和 `removeClass` 事件的方法。这些函数将要动画的元素作为第一个参数传递。然后可以使用\
  \ `jQuery` 的 `animate()` 方法来动画元素。\n\n`jQuery` `animate()` 方法使用以下语法，其中 `cssProperties`\
  \ 是 CSS 属性变化的的对象，`duration` 以毫秒为单位，`easing` 是缓动方法，而 `callback` 是动画完成时执行的函数：\n\n\
  点击此处查看代码图片\n\n```javascript\nanimate(cssProperties, [duration], [easing], [callback])\n\
  ```\n\n例如，以下代码通过将 `opacity` 设置为 `0` 来为元素添加 `fadeClass` 类：\n\n点击此处查看代码图片\n\n```javascript\n\
  app.animation('.fadeClass', function() {\n  return {\n    addClass : function(element,\
  \ className, done) {\n      jQuery(element).animate({ opacity: 0}, 3000);\n    },\n\
  \  };\n});\n```\n\n***\n\n### 尝试一下：使用 AngularJS 制作元素动画\n\n在这个练习中，你有有机会使用 AngularJS\
  \ 以及 `jQuery` 实现动画。这个练习的目的是向你展示每种方法是如何工作的。\n\n27.7, 27.8 和 27.9 实现了一个基础动画，该动画使用\
  \ JavaScript 方法对图像应用淡入/淡出动画，并使用 CSS 过渡来对图像制作动画。\n\n使用以下步骤构建 AngularJS 应用程序：\n\n\
  1. 添加 `lesson27/service_animation.html`、`lesson27/js/service_animation.js` 和 `lesson27/js/service_animation.css`\
  \ 文件。\n2. 将 27.7、27.8 和 27.9 所示的代码添加到 HTML、JavaScript 和 CSS 文件中。\n3. 27.7 中的以下行代码将\
  \ AngularJS 服务注入到应用程序中，以便其使用：\n\n点击此处查看代码图片\n\n```javascript\nvar app = angular.module('myApp',\
  \ ['ngAnimate']);\n```\n\n4. 27.7 中的以下几行代码通过应用程序上的 `animate()` 方法实现了淡入和淡出动画。注意，同一个类\
  \ `.fadeOut` 通过钩入 `addClass` 和 `removeClass` 事件，然后对元素的透明度使用 `jQuery.animate()` 方法，同时应用于淡入和淡出动画。\n\
  \n点击此处查看代码图片\n\n```javascript\napp.animation('.fadeOut', function() {\n  return\
  \ {\n    enter : function(element, parentElement, afterElement, doneCallback) {},\n\
  \    leave : function(element, doneCallback) {},\n    move : function(element, parentElement,\
  \ afterElement, doneCallback) {},\n    addClass : function(element, className, done)\
  \ {\n      jQuery(element).animate({ opacity: 0}, 3000);\n    },\n    removeClass\
  \ : function(element, className, done) {\n      jQuery(element).animate({ opacity:\
  \ 1}, 3000);\n    }\n  };\n});\n```\n\n\n\n\n## 5. 以下来自代码列表 27.9 的 CSS 代码通过在为元素分配\
