  \ AngularJS 视图中实现指令\n\n本节你将学到：\n\n![Image](img/image00767.jpeg) AngularJS 指令与 HTML\
  \ 的关系\n\n![Image](img/image00767.jpeg) 在页面中实现 AngularJS 指令的方法\n\n![Image](img/image00767.jpeg)\
  \ 使用 AngularJS 指令与浏览器事件交互\n\n![Image](img/image00767.jpeg) 哪些元素被 AngularJS 扩展\n\n\
  ![Image](img/image00767.jpeg) 如何使用指令构建应用程序\n\nAngularJS 最强大的功能之一是指令（directives）。指令扩展了\
  \ HTML 的行为，允许你创建自定义元素、属性和类。AngularJS 提供了许多内置过滤器。事实上，AngularJS 库的大部分都是指令。\n\nAngularJS\
  \ 编译器遍历模板 DOM 并编译所有指令。然后，将指令与作用域（scope）绑定以生成新视图。活动视图包含了指令中定义的 DOM 元素和功能。\n\n###\
  \ 理解指令\n\n指令是 AngularJS 标记和 JavaScript 代码的结合。指令标记可以是 HTML 属性、元素名称或 CSS 类。JavaScript\
  \ 代码定义了元素的模板数据和行为。\n\n### 使用内置指令\n\n你在 HTML 元素中需要实现的大多数 AngularJS 功能都由内置指令提供。这些指令在\
  \ AngularJS 库加载时可用。\n\n指令为应用程序提供了各种支持。以下章节描述了大多数 AngularJS 指令，它们分为以下几类：\n\n![Image](img/image00767.jpeg)\
  \ 支持功能的指令\n\n![Image](img/image00767.jpeg) 扩展元素的指令\n\n![Image](img/image00767.jpeg)\
  \ 将元素绑定到作用域值的指令\n\n![Image](img/image00767.jpeg) 将事件绑定到控制器的指令\n\n后续每个章节都包含一个带有指令及其基本描述的表格。你现在不需要理解所有这些指令；表格更多是为了参考。随后的章节和课程提供了其中许多指令的示例代码。\n\
  \n#### 支持 AngularJS 功能的指令\n\n若干指令提供了 AngularJS 功能的支持。这些指令涵盖了从引导应用程序（bootstrapping）到确保所需的布尔表达式保留在\
  \ DOM 中的所有操作。\n\nTable 24.1 列出了这些指令，并描述了每个指令的行为和用法。\n\n![Image](img/01009.jpeg)![Image](img/01010.jpeg)![Image](img/01011.jpeg)\n\
  \n**表格 24.1 支持 AngularJS 模板功能的指令**\n\nTable 24.1 中的指令在代码的不同部分以不同的方式使用。你已经看到过其中的几个了，例如\
  \ `ngApp` 和 `ngController`，它们在之前的示例中出现过。有些非常直观，例如在模板中实现 `<img>` 元素时使用 `ng-src` 代替\
  \ `src`。其他的将在随后的各种示例中使用。\n\n\n\n\n\n我想在此处向你们展示一个使用 `ngInclude` 指令的示例。这个小指令易于使用，可以用于多种目的，特别是当你正尝试将\
  \ AngularJS 引入现有系统时。在这个示例中，我们使用 `ngInclude` 通过从服务器加载不同的部分 HTML 文件，来切换基础网页顶部的横幅栏。\n\
  \n***\n\n## 动手一试：使用 ng-include 动态更改内容\n\n代码列表 24.1 中的代码实现了一个基础 AngularJS 控制器，它将\
  \ HTML 文件名存储在名为 `titleBar` 的变量中。代码列表 24.2 中的代码实现了一个 AngularJS 模板，该模板在顶部包含两个用于切换页面的链接，并在第\
  \ 24 行的 `<div>` 元素使用了 `ng-include` 将 `div` 的内容更改为 `titleBar` 指定的文件。按照以下步骤构建一个使用\
  \ `ng-include` 在两个部分模板之间快速切换的应用程序：\n\n1. 添加 `lesson24/directive_angular_include.html`、`lesson24/large_title.html`、`lesson24/small_title.html`\
  \ 和 `lesson24/js/directive_angular_include.js` 文件。\n2. 在 HTML 和 JavaScript 文件中添加代码列表\
  \ 24.1、代码列表 24.2、代码列表 24.3 和 代码列表 24.4 中所示的代码。\n3. 代码列表 24.1 中的代码实现了一个简单的应用程序，将\
  \ `titleBar` 的作用域值设置为 `small_tile.html`，这是小横幅的 AngularJS 部分模板。\n4. 代码列表 24.2 中的代码实现了加载应用程序的\
  \ AngularJS 模板。代码列表 24.2 中的后续几行创建了链接，将作用域中 `titleBar` 的值设置为代码列表 24.3 和 24.4 中列出的两个模板部分文件之一：\n\
  \n点击此处查看代码图像\n\n```\n22      [<a ng-click=\"titleBar='large_title.html'\">让标题放大</a>]\n\
  23      [<a ng-click=\"titleBar='small_title.html'\">让标题缩小</a>]\n```\n\n5. 代码列表\
  \ 24.2 中的以下这行代码使用了 `ng-include` 指令，将 `<div>` 元素的内容填充为 `titleBar` 设置的任何模板部分：\n\n\
  点击此处查看代码图像\n\n```\n24      <div ng-include=\"titleBar\"></div>\n```\n\n6. 不同版本的标题栏位于代码列表\
  \ 24.3 和 24.4 所示的文件中。基本上，这些文件包含一个`<p>` 元素，该元素被分配了 `large` 或 `small` 类。这些类的定义位于代码列表\
  \ 24.2 的`<style>` 元素中。\n7. 在浏览器中打开 `directive_angular_include.html` 文件。图 24.1 显示了两个横幅。当点击链接切换横幅时，原始\
  \ `<div>` 元素的内容会被加载的新 HTML 文件替换。\n\n![图像](img/image0101.jpeg)\n\n**图 24.1 使用 ng-include\
  \ 指令通过不同的 HTML 文件动态更改视图。**\n\n**代码列表 24.1 directive_angular_include.js 在作用域中存储标题元素的文件名**\n\
  \n点击此处查看代码图像\n\n```\n01 angular.module('myApp', []).\n02    controller('myController',\
  \ function($scope) {\n03      $scope.titleBar = \"small_title.html\";\n04    });\n\
  ```\n\n**代码列表 24.2 directive_angular_include.html 通过切换 HTML 文件更改页面标题栏的 AngularJS\
  \ 模板**\n\n点击此处查看代码图像\n\n```html\n01 <!doctype html>\n02 <html ng-app=\"myApp\">\n\
  03 <head>\n04    <title>AngularJS Data Directive</title>\n05    <style>\n06    \
  \  .large{\n07        background-color: blue; color: white;\n08        text-align:\
  \ center;\n09        font: bold 50px/80px, serif;\n10        border: 6px black;\
