  \ },\n  }\n\n};\n```\n\n## 使用 Compile 函数操作 DOM\n\n`compile` 函数与 `link` 函数非常相似，但有一个主要的优势，同时也存在一些缺点。使用\
  \ `compile` 函数的优势和主要原因是性能。`compile` 方法只在编译模板时执行一次，而 `link` 函数则在每次元素被链接（linked）时都会执行；例如，当你在\
  \ `ng-repeat` 循环内部应用多个指令或者当模型发生变化时。如果你正在进行大量的 DOM 操作，这将是一个大问题。\n\n以下是 `compile`\
  \ 函数的局限性：\n\n![Image](img/image00767.jpeg) 任何操作都在克隆（clone）之前应用。这意味着当自定义指令在 `ng-repeat`\
  \ 中使用时，任何 DOM 操作将应用于所有生成的自定义指令上。\n\n![Image](img/image00767.jpeg) `compile()` 方法无法处理在自己的模板或\
  \ `compile()` 函数中递归使用自身的指令，因为这会导致无限循环。\n\n![Image](img/image00767.jpeg) `compile()`\
  \ 方法无法访问作用（作用）。\n\n![Image](img/image00767.jpeg) `transclude` 函数已被弃用并从 `compile`\
  \ 函数中移除，因此你无法链接到嵌入（transcluded）元素。\n\n`compile()` 方法的语法与 `link()` 方法非常相似。你可以指定单个\
  \ `postlink` 函数，如下所示：\n\n点击此处查看代码图像\n\n```javascript\ndirective('myDirective', function()\
  \ {\n  return {\n    compile: function compile(scope, elem, attr, controller){\n\
  \          //postlink code\n    }\n  };\n};\n```\n\n你也可以使用对象来指定 prelink 和 postlink\
  \ 函数，如下所示：\n\n点击此处查看代码图像\n\n```javascript\ndirective('myDirective', function() {\n\
  \  return {\n    compile: {\n      pre: function preLink(elem, attr){\n        \
  \    //prelink code\n      },\n      post: function postLink(elem, attr){\n    \
  \        //postlink code\n      },\n    }\n  }\n};\n```\n\n### 实现自定义指令\n\n你可以定义的自定义指令类型是无边际的，这使得\
  \ AngularJS 具有扩展性。自定义指令是 AngularJS 中最难解释和掌握的部分。最好的方法是向你展示一些自定义指令的示例，让你对如何实现它们以及它们如何相互交互有一个直观的感觉。\n\
  \n***\n\n### 实践：在自定义指令中操作 DOM\n\n你在自定义指令中执行的最常见任务之一就是操作 DOM。这应该是你的 AngularJS 应用中操作\
