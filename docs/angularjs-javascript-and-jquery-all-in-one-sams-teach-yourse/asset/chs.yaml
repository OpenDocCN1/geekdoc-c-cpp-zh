  />\n14     <img src=\"/images/falls.jpg\"/>\n15     <img src=\"/images/flower2.jpg\"\
  />\n16     <img src=\"/images/shadow_jump.jpg\"/>\n17     <img src=\"/images/beachhouse.jpg\"\
  />\n18   </div></div>\n19  </body>\n20 </html>\n```\n\n* * *\n\n**列表 12.5 image_fade.js\
  \ 实现图像选择淡入 jQuery 和 JavaScript 代码**\n\n点击此处查看代码图像\n\n* * *\n\n```javascript\n01\
  \ $(window).load(function(){\n02  $(\"img\").mouseover(function(){$(this).fadeTo(1000,\
  \ 1);});\n03  $(\"img\").mouseout(function(){$(this).fadeTo(1000, .3);});\n04 });\n\
  ```\n\n* * *\n\n**列表 12.6 image_fade.js 为图像选择元素设置样式 CSS 代码**\n\n* * *\n\n```css\n\
  01 div{padding:0px;}\n02 img{\n03    float:left;\n04    opacity:.3;\n05    height:\
  \ 100px;\n06 }\n```\n\n\n\n\n\n一种常见的动画是滑动效果。滑动效果使元素从不占用空间到占用空间，从起始边缘到结束边缘进行过渡。使用滑动动画可以为用户提供更丰富的体验，因为菜单、图像和其他元素可以在用户将鼠标悬停在上方或点击它们之前被“收起”起来。\n\
  \n你可以使用几种方法来创建滑动元素。一种方法是使用内置的 jQuery 滑动方法。另一种方法是对高度和宽度属性。接下来的章节将介绍这些每种方法。\n\n####\
  \ 动画 `slideUp()`、`slideDown()` 和 `slideToggle()`\n\n`.slideUp( duration [, easing]\
  \ [, callback])`、`.slideDown( duration [, easing] [, callback])` 和 `.slideToggle(\
  \ duration [, easing] [, callback])` 方法提供了持续时间、缓动和回调参数，允许你在垂直方向上制作滑动效果。\n\n例如，以下代码应用了\
  \ 1 秒的动画使元素向下滑动，然后应用了 3 秒的延迟并将元素向上滑动：\n\n点击此处查看代码图片\n\n```javascript\n$(\"#menu\"\
  ).slideDown(1000).delay(3000).slideUp(1000);\n```\n\n你也可以以类似的方式对 `.slideToggle()`\
  \ 方法进行动画。例如，以下代码使用滑动动画控制 `<div>` 元素的可见性：\n\n```javascript\n$(\"div\").slideToggle(1000);\n\
  ```\n\n#### 使用宽度和高度进行滑动\n\n我们也喜欢使用宽度和高度属性来创建滑动元素。你可以通过对高度进行动画处理创建垂直滑动动画，通过对宽度进行动画处理创建水平滑动动画。\n\
  \n这里有一些小技巧。如果你想获得完整的滑动效果而不仅仅是调整大小的效果，你需要为元素同时提供宽度值和高度值。此外，如果你想让元素在页面上保留空间，你就不能将值一直减到\
  \ 0。但是，你可以将其减到 `.1`，另一个维度将保留其空间。\n\n下面的示例展示了一个动画，该动画通过将 `height` 更改为 100 来向下滑动，然后通过将\
  \ `height` 更改为 `.1` 来向上滑动：\n\n点击此处查看代码图片\n\n```javascript\n$(\"img\").animate({height:100},\
  \ 1000);\n$(\"img\").animate({height:.1}, 1000);\n```\n\n* * *\n\n### 动手试试：使用滑动动画实现动态菜单\n\
  \n在这个示例中，你创建了一个简单的 Web 元素，提供了一个带有滑动效果的标题栏，可以显示图像菜单。当你悬停在菜单中的每个项目上时，图像会向下滑动，当你离开菜单时它又会向上滑动。该练习的目的是提供一个机会让你在本节讨论的一些滑动技术。示例代码位于\
  \ 列表 12.7、12.8 和 12.9 中。\n\n使用以下步骤创建动态网页页面：\n\n**1.** 在 Eclipse 中，创建 `lesson12/sliding_images.html`、`lesson12/js/sliding_images.js`\
  \ 和 `lesson12/css/sliding_images.css` 文件。\n\n**2.** 在 HTML 和 CSS 文件中添加 列表 12.7 和\
  \ 列表 12.9 所示的代码——这些只是基础内容：一个带有 `<p>` 标题栏的 `<div>`，以及包含用于菜单的 `<span>` 和 `<img>` 元素的内部\
  \ `<div>`。\n\n**3.** 打开 `sliding_images.js` 文件并编写一个基础的 `$(window).load()` 函数。在 `load()`\
  \ 函数内部，添加以下行来隐藏内部的 `<div>`：\n\n```javascript\n$(\"div div\").hide();\n```\n\n**4.**\
  \ 添加以下语句为 `<span>` 元素添加 `mouseover` 和 `mouseout` 处理器。在 `mouseover` 上，你获取 `<span>`\
  \ 的索引，然后使用它找到对应的 `<img>` 元素，并对将 `height` 设置为 100 执行动画，从而使图像向下滑动。在 `mouseout` 上，你执行相反的操作，将\
  \ `height` 设置为 1 以使其向上滑动：\n\n点击此处查看代码图片\n\n```javascript\n$(\"span\").mouseover(function(){\n\
  \  var i = $(this).index(\"span\");\n  $(\"img\").eq(i).animate({height:100}, 1000);\n\
  });\n$(\"span\").mouseout(function(){\n  var i = $(this).index(\"span\");\n  $(\"\
  img\").eq(i).animate({height:.1}, 1000);\n});\n```\n\n**5.** 添加以下语句为 `#container`\
  \ 元素添加 `mouseenter` 和 `mouseleave` 处理器。在 `mouseenter` 上，你首先停止传播，以便在冒泡期间只应用一次滑动切换。然后你停止\
  \ `#images` 元素上的所有动画，并使用 `slide()` 对整个菜单执行动画。`mouseleave` 发生相同的情况。结果是，当鼠标悬停在 `#container`\
  \ 上时，它会向下滑动，当鼠标离开时它会向上滑动：\n\n点击此处查看代码图片\n\n```javascript\n$(\"#container\").mouseenter(function(){\n\
  \  e.stopPropagation();\n  $(\"#images\").stop().slideToggle();\n});\n$(\"#container\"\
  ).mouseleave(function(){\n  e.stopPropagation();\n  $(\"#images\").stop().slideUp();\n\
  });\n```\n\n**6.** 保存所有三个文件，然后在浏览器中打开图 12.3 所示的 HTML 文档。你应该能看到当鼠标悬停在项目上时它向下滑动，鼠标离开时向上滑动：\n\
  \n\n\n\n\n与使用高度和宽度创建滑动效果类似，你也可以使用它们来创建缩放动画。滑动和缩放之间的区别在于，在缩放时，图片的纵横比会保持不变，这使得元素整体看起来是正在放大或缩小，而不是在被展开或收起。\n\
  \n创建缩放动画的技巧在于，你要么需要在 `.animate()` 语句中同时指定 `height` 和 `width`，或者在 CSS 设置中将其中一个设置为\
  \ `auto`，然后只对具有值的那个进行动画处理。\n\n例如，以下代码显示了图像在 1 秒内缩放到 500 像素，然后在 5 秒内缓慢地缩小回 400 像素：\n\
  \n点击此处查看代码图片\n\n```javascript\n$(\"img\").animate({height:500, width:500}, 1000).animate({height:500,\
  \ width:500}, 5000);\n```\n\n## 动手试试：使用缩放动画创建一个简单的图片库视图\n\n在这个示例中，你创建了一个简单的图片库视图，它可以在同一个动画中缩放图像并应用透明度变化。该练习的目的是为你提供一个机会，使用本节讨论的一些缩放技术。示例代码位于\
  \ 列表 12.10、12.11 和 12.12。\n\n使用以下步骤创建该动态网页：\n\n1. 在 Eclipse 中，创建 `lesson12/animated_resize.html`、`lesson12/js/animated_resize.js`\
  \ 和 `lesson12/css/animated_resize.css` 文件。\n\n2. 将 列表 12.10 和 列表 12.12 所示的代码添加到\
  \ HTML 和 CSS 文件中——只需一个带有 `<<img>>` 元素的基础 `<<div>``。在 CSS 文件中，`<img>` 元素的宽度被样式为 100px，但没有设置高度。这样我们就可以在不使用高度属性的情况下动画大小。\n\
  \n3. 现在打开 `animated_resize.js` 文件并编写一个基础的 `load()` 函数，该函数为 `<img>` 元素添加 `mouseover`\
  \ 和 `mouseout` 处理器。在 `mouseover` 时，通过增加 `width` 和 `opacity` 来实现动画，并在 `mouseout`\
  \ 时执行相反的操作：\n\n点击此处查看代码图片\n\n```javascript\n$(window).load(function(){\n    $(\"\
  img\").mouseover(function(){\n      $(this).animate({width:\"200px\", opacity:1},\
  \ 1000);\n    });\n    $(\"img\").mouseout(function(){\n      $(this).animate({width:\"\
  100px\", opacity:.3}, 1000);\n    });\n});\n```\n\n4. 保存所有三个文件，然后在网页浏览器中打开 HTML\
  \ 文档，如图图 12.4](#part0025.xhtml_ch12fig04) 所示。你应该能够悬停在图像上并看到缩放动画。\n\n![Image](img/image00915.jpeg)\n\
  \n**图 12.4** 简单的滑动菜单元素。\n\n**列表 12.10 animated_resize.html 用于显示图片的基础 Web HTML 文件**\n\
  \n点击此处查看代码图片\n\n```html\n<!DOCTYPE html>\n<html>\n  <head>\n    <title>Animated\
  \ Image Resizing</title>\n    <meta charset=\"utf-8\" />\n    <script type=\"text/javascript\"\
  \ src=\"https://code.jquery.com/jquery-2.1.3.min.js\"></script>\n    <script type=\"\
  text/javascript\" src=\"js/animated_resize.js\"></script>\n    <link rel=\"stylesheet\"\
  \ type=\"text/css\" href=\"css/animated_resize.css\">\n  </head>\n  <body>\n   \
  \ <div id=\"photos\">\n      <img src=\"/images/pool.jpg\"/>\n      <img src=\"\
  /images/peak.jpg\"/>\n      <img src=\"/images/shadow_jump.jpg\"/>\n      <img src=\"\
  /images/misty_mountains.jpg\"/>\n      <img src=\"/images/tiger.jpg\"/>\n    </div>\n\
  \  </body>\n</html>\n```\n\n**列表 12.11 animated_resize.js 实现缩放效果的 jQuery 和 JavaScript\
  \ 代码**\n\n点击此处查看代码图片\n\n```javascript\n$(window).load(function(){\n    $(\"img\"\
  ).mouseover(function(){\n      $(this).animate({width:\"175px\", opacity:1}, 1000);\n\
  \    });\n    $(\"img\").mouseout(function(){\n      $(this).animate({width:\"100px\"\
  , opacity:.3}, 1000);\n    });\n});\n```\n\n**列表 12.12 animated_resize.css 设置图片的样式\
  \ CSS 代码**\n\n```css\ndiv{padding:0}\nimg{\nwidth:100px;\nopacity:.3;\n}\n```\n\n\
  *(注：由于原文后半部分在输入文本中存在严重的乱码和重复片段错误，上述翻译已根据上下文逻辑进行了修复和顺顺处理，以确保文档的可读性。)*\n\n\n\n\n```javascript\n\
  01 var rightEdge = window.innerWidth;\n\n02 var bottomEdge = window.innerHeight;\n\
  \n03 $(window).load(function(){\n\n$(\"#ship\").offset({top:bottomEdge/2, left:rightEdge/2});\n\
  \n...\n\n22 });\n```\n\n\n\n\n2. 打开列表 12.10、12.11 和 12.12 中的代码。通过为图像添加点击事件处理器来修改代码。在点击处理程序中，停止所有动画而不完成当前动画。然后使用\
  \ `$(this).off(\"mouseover\");` 等方法关闭 `mouseover`  own `mouseout` 事件处理器。\n\n3. 打开列表\
  \ 12.13、12.14 和 12.15 中的代码。修改代码以添加四个用于对角移动的新按钮。你还需要为这些按钮添加处理器，在同一个动画中设置 `top` 和\
  \ `left` 属性以应用移动动画。\n\n## 课程 13. 在 jQuery 和 JavaScript 中交互 Web 表单\n\n在本课程中你将学习：\n\
  \n![Image](img/image00767.jpeg) 获取和设置表单元素的值\n\n![Image](img/image00767.jpeg) 动态构建表单元素\n\
  \n![Image](img/image00767.jpeg) 如何使用表单元素动画帮助用户导航表单\n\n![Image](img/image00767.jpeg)\
  \ 如何为用户自动聚焦元素\n\n![Image](img/image00767.jpeg) 创建基础电子商务 Web 表单\n\n![Image](img/image00767.jpeg)\
  \ Web 表单验证的简单方法\n\nWeb 表单是动态 Web 编程不可或缺的一部分。你可能只会在信用卡支付、在线注册等方面考虑到表单；然而，每当你需要从用户获取实际数据输入时，你都会使用\
  \ Web 表单来收集数据输入。\n\nWeb 表单对用户来说可能是正面或负面的体验。考虑一下：他们知道需要输入数据。如果因为表单笨拙或难以理解导致输入数据变得困难，他们会讨厌它并产生糟糕的体验。如果表单能够优雅地引导他们快速、高效地完成，他们会说：“哇！太简单了。”\n\
  \n那么，如何给用户提供良好的体验呢？\n\n1. 使用动态编程访问他们正在输入的数据，以提供符合其操作的动态工作流。\n2. 提供视觉效果（例如高亮或展开元素），帮助他们引导页面。\n\
  3. 提供内联验证，在他们开始偏离方向时尽快通知他们。\n\n接下来的章节将详细介绍每个概念。完成后，你将能够实现一些出的 Web 表单。\n\n注意\n\n\
  在处理 Web 表单时，jQuery 和 JavaScript 提供了很多强大的功能。AngularJS 为 JavaScript 和 jQuery 增加了将\
  \ Web 表单元素绑定到网页数据模型中值的功能。你将在课程的 AngularJS 部分学习更多内容。\n\n### 访问表单元素\n\n与 Web 表单交互最重要的部分是能够访问它们所代表的数据。访问表单数据允许你获取和设置值、更改选择并将数据序列化以供其他方式使用。\n\
  \n表单元素有很多类型。遗憾的是，没有单一的标准方法来获取和设置元素所代表的值。以下章节描述了访问每种类型表单元素数据的方法。\n\n#### 获取和设置表单元素的值\n\
  \n获取表单元素代表的值取决于表单元素的类型。例如，文本元素代表内部的文本，而 `select` 元素代表所选选元素的值。\n\n在接下来的章节中，将根据获取表单值的方法对表单元素分组。例如，无论类型如何，所有文本元素都以相同的方式访问。\n\
  \n##### 访问表单元素属性\n\n不同元素具有许多相同的属性，也有一些是元素类型特有的。在实现动态代码时，你需要访问以下几个属性：\n\n- `id`——用于查询和标识表单元素。\n\
  - `name`——用于多种方式。对于单选框输入，此属性被用于将元素分组在一起，以便一次只能选择一个。对于表单的序列化和提交，`name` 属性被用作赋予元素值的名称。\n\
  - `type`——用于识别 `<input>` 元素的类型。\n- `value`——存储与元素关联的值。对于文本元素，值显示在文本框中；对于按钮，值是按钮中的字符串；对于\
  \ `<option>` 元素，它是与选项关联的值。\n- `checked`——用于访问单选框或复选框 `<input>` 元素的选择状态。\n\n这些属性可以通过\
  \ JavaScript 中的属性名 `name` 直接访问。例如，要获取和设置值属性，你可以使用以下代码：\n\n```javascript\ndomObj.value\
  \ = \"New Text\";\nvar newValue = domObj.value;\n```\n\n在 jQuery 中，有三种方法获取表单对象的属性和特性：`.attr()`、`.prop()`\
  \ 和 `.val()`。`.attr()` 方法用于访问对应 HTML 属性的 DOM 对象属性（如 `id`、`name` 和 `type`），而 `.prop()`\
  \ 方法用于访问更具体的 DOM 对象属性，例如 `<select>` 元素的 `selectedIndex`。\n\n**注意**\n\n`.attr()`、`.prop()`\
  \ 和 `.val()` 方法仅获取第一个元素的值。如果你正在处理多个元素，可能需要使用 `.map()` 或 `.each()` 来获取所有值。\n\njQuery\
  \ 提供了 `.val()` 方法来访问表单元素表示的值。例如，以下语句设置所有 `type=\"text\"` 的 `<input>` 元素的值，然后获取第一个：\n\
  \n```javascript\n$(\"input:text\").val(\"New Text\");\nvar newValue = $(\"input:text\"\
  ).val();\n```\n\n##### 访问文本输入元素\n\n最常见的表单元素类型是文本输入。这些元素包括 `<textarea>` 元素以及具有以下\
  \ `type` 值的 `<input>` 元素：`color`、`date`、`datetime`、`datetime-local`、`email`、`month`、`number`、`password`、`range`、`search`、`tel`、`text`、`time`、`url`\
  \ 和 `week`。\n\n尽管所有元素的用法略有不同，但它们都渲染相同的 文本框并以相同的方式访问。每个元素都有一个 `value` 属性，可以在 HTML\
  \ 中设置。例如，以下代码显示了渲染带有初始值的文本表单元素的基本示例，如图 13.1 所示：\n\n```html\n<input type=\"text\"\
  \ value=\"Initial Text\"/>\n```\n\n![Image](img/image0917.jpeg)\n\n**图 13.1** 带有初始值的简单文本输入。\n\
  \n可以通过访问值属性直接从 JavaScript 获取该值。例如，以下代码设置文本输入元素的值并获取该值：\n\n```javascript\ntextDomObj.value\
  \ = \"New Text\";\nvar newValue = textDomObj.value;\n```\n\n##### 访问复选框输入\n\n\n\n\
  \n\n复选框（Check box）输入元素根据其是否被选中具有 `Boolean`（布尔）值。可以通过获取 `checked` 属性来访问该值。如果元素被选中，则\
  \ `checked` 的值类似于 `true` 或 `\"checked\"`；否则，该值是 `undefined` 或 `false`。\n\n你可以通过以下方式从\
  \ JavaScript 获取并设置复选框元素的状态：\n\n```javascript\ndomObj.checked = true;\ndomObj.checked\
  \ = false;\nvar state = domObj.checked;\n```\n\n使用 jQuery 判断项目是否被选中时，情况略有不同。请记住，在\
  \ jQuery 中，你可能同时处理多个复选框，因此查看 jQuery 对象是否代表一个已选中对象的最安全方法是使用 `.is()` 方法。例如：\n\n```javascript\n\
  jObj.is(\":checked\");\n```\n\n要将代表复选框的 jQuery 对象的状态设置为选中，你可以按照如下方式设置 `checked`\
  \ 属性：\n\n```javascript\njObj.prop(\"checked\", true);\n```\n\n将代表复选框的 jQuery 对象的状态设置为未选中的方法也类似。你需要使用\
  \ `prop()` 移除 `checked` 属性并将值设置为 `false`。例如：\n\n点击此处查看代码图片\n\n```javascript\njObj.prop(\"\
  checked\", false);\n```\n\n### 访问单选框输入\n\n单个单选框（Radio inputs）的工作方式与复选框相同。你可以相同地访问选中状态。\n\
  \n然而，单选框几乎总是成组使用的。单选组的值并不代表布尔值。相反，它是当前被选中元素的 `value` 属性。\n\n在提交表单或序列化表单数据时，单选组的值会自动填充。要在代码中获取单选组的值，你首先需要访问组中的所有元素，找到哪一个被选中了，然后从该对象获取\
  \ `value` 属性。以下代码将获取 jQuery 中通过 `name=\"myGroup\"` 分组的单选组的值：\n\n点击此处查看代码图片\n\n```javascript\n\
  var groupValue = $(\"input[name=myGroup]\").filter(\":checked\").val();\n```\n\n\
  该代码首先找到 `name=\"myGroup\"` 的 `<input>` 元素，然后过滤出被选中的元素，最后返回该值。\n\n### 访问选择框输入\n\n\
  选择框输入（Select inputs）实际上上是一系列 `<option>` 元素的容器输入元素。`select` 元素的值是当前选中选项（或选项）的值。再次，jQuery\
  \ 和 JavaScript 中的提交和序列化会自动为你处理这些。然而，要手动执行这些操作需要一些代码。\n\n***\n\n**注意**\n\n如果你没有为\
  \ `<option>` 元素指定 `value` 属性，返回的值将是 `innerHTML` 的值。例如，以下选项的值为 `\"one\"`：`<option>one</option>`\n\
  \n***\n\n在访问 `<select>` 元素时，你可能需要几个值。其中一个是元素代表的完整值。在 jQuery 中，使用 `.val()` 方法获取该值非常简单。例如，考虑以下代码：\n\
  \nHTML:\n\n点击此处查看代码图片\n\n```html\n<select id=\"mySelect\">\n  <option value=\"one\"\
  >One</option>\n  <option value=\"two\">Two</option>\n  <option value=\"three\">Three</option>\n\
  </select>\n```\n\njQuery:\n\n```javascript\n$(\"#mySelect\").val();\n```\n\n如果第一个选项被选中，jQuery\
  \ 语句返回的值如下：\n\n\"one\"\n\n对于多选择框（multiple selects），`.val()` 方法返回的是值的数组，而不是单个值。例如，在多选择框中，如果第一个选项被选中，jQuery\
  \ 语句返回的值如下：\n\n`[\"one\"]`\n\n在多选择框中，如果前三个选项被选中，jQuery 语句返回的值如下：\n\n`[\"one\", \"\
  two\", \"three\"]`\n\n你也可以使用 `.val()` 方法来设置选中的元素。例如，以下语句选择了列表中的第二个元素：\n\n```javascript\n\
  [\"one\", \"two\", \"three\"]\n$(\"#mySelect\").val(\"two\");\n```\n\n以下语句选中了多选择元素中的第二个和第三个选项：\n\
  \n点击此处查看代码图片\n\n```javascript\n[\"one\", \"two\", \"three\"]\n$(\"#mySelect\").val([\"\
  two\", \"three\"]);\n```\n\n### 访问按钮输入\n\n大多数情况下，你不需要访问按钮数据，除非是定义按钮上文本的 `value`\
  \ 属性。`adding`/`removing` 事件处理器和 CSS 属性与其他 HTML 元素完全相同。\n\n### 访问文件输入\n\n文件输入（File\
  \ input）是一种非常不同的表单元素类型。它提供了一个按钮和一个文本框。按钮链接到操作系统的文件浏览器，而文本框显示需要上传到 Web 服务器的文件路径。\n\
  \n文件输入的 `value` 属性将是文件名，因此你可以直接从 JavaScript 访问它，或通过 jQuery 中的 `.val()` 方法访问它。\n\n\
  在 Chrome 和 Firefox 中，DOM 对象还提供了一个 `files` 属性，它是一个文件对象数组，代表由该元素选择的文件。你可以通过 JavaScript\
  \ 访问用户选择的文件，代码如下：\n\nHTML:\n\n点击此处查看代码图片\n\n```html\n<input id=fileSelect type=\"\
  file\" />\n```\n\nJavaScript:\n\n```javascript\nvar fileSelector = document.getElementById(\"\
  fileSelect\");\nvar fileList = fileSelector.files;\n\nfor (var i in fileList){\n\
  \  var fileObj = fileList[i];\n  var fileName = fileObj.name;\n  var filePath =\
  \ fileObj.size;\n  var fileSize = fileObj.size;\n  var fileType = fileObj.type;\n\
  }\n```\n\n***\n\n**警告**\n\n在处理文件输入时必须小心，这似乎是恶意行为的重灾区。如果 Internet Explorer 检测到文件对象被篡改，将拦截页面的提交事件。此外，许多浏览器具有安全设置，防止某些文件信息可用。\n\
  \n***\n\n每个文件对象包含几个在动态编程中非常有用的属性。一些常用的属性列在表 13.1 中。\n\n![图片](img/image0918.jpeg)\n\
  \n[part0026.xhtml_ch13tab01]表 13.1 DOM 文件对象的属性**\n\n### 访问隐藏输入\n\n如果你需要为表单提供额外信息，隐藏输入（hidden\
  \ input）是一个非常好的 HTML 元素。隐藏输入不会显示在表单中；但它可以包含一个提交的名称-值对，或者只是你想存储在表单并在动态操作期间访问的值。\n\
  \n随表单发送的部分是 `name` 和 `value` 属性。然而，你可以使用 `.data(key [,value])` 方法向隐藏表单对象或任何 jQuery\
  \ 的 HTML DOM 对象附加额外值。该方法的作用类似于 `.attr()` 和 `.prop()`，如果你想获取值，则传递键；如果你想设置值，则传递一个键和一个值。例如，以下代码定义了一个简单的隐藏元素，然后使用\
  \ jQuery 分配了提交值以及一个扩展属性：\n\nHTML:\n\n点击此处查看代码图片\n\n```html\n<input id=\"invisibleMan\"\
  \ name=\"InvisibleMan\" type=\"hidden\" />\n```\n\njQuery:\n\n点击此处查看代码图片\n\n```javascript\n\
  $(\"#invisibleMan\").val(\"alive\");\n$(\"#invisibleMan\").data(\"hairColor\", \"\
  clear\");\nvar state $(\"#invisibleMan\").val();\nvar state $(\"#invisibleMan\"\
  ).data(\"hairColor\");\n```\n\n\n\n\n\n要对表单进行序列化，它需要两个要素：一个 `name` 属性和一个可以赋值给该名称的\
  \ `value` 属性。表 13.2 描述了不同类型属性的值来源。\n\n![Image](img/image0091.jpeg)\n\n**表格 13.2\
  \ DOM File 对象的属性**\n\n## 将表单转换为查询字符串\n\n最常见的序列化任务之一是将表单数据转换为序列化数组。jQuery 使用 `.serialize()`\
  \ 方法让这一过程变得轻而易举。`.serialize()` 方法将访问表单并将名称/值对转换为 URL 编码的字符串，准备好在网络上传输。\n\n例如，查看以下代码，它创建了一个表单并根据图\
  \ 13.2 中设置的值对其进行序列化：\n\nHTML:\n\n```html\n<form id=\"simpleForm\">\n  <input name=\"\
  title\" type=\"text\" /><br>\n  <select name=\"mySelection\" multiple size=3 id=\"\
  mySelect\">\n    <option value=\"one\">One</option>\n    <option value=\"two\">Two</option>\n\
  \    <option value=\"three\">Three</option>\n  </select><br>\n  <input type=\"radio\"\
  \ name=\"gender\" value=\"male\">Male</input>\n  <input type=\"radio\" name=\"gender\"\
  \ value=\"female\">Female</input><br>\n</form>\n```\n\n![Image](img/image00920.jpeg)\n\
  \n**图 13.2** 带有 `text`、`select` 和 `radio` 输入的简单表单。\n\njQuery:\n\n```javascript\n\
  var qString = $(\"#simpleForm\").serialize();\n```\n\n`qString` 的值：\n\n```text\n\
  title=Lumber+Jack&mySelection=one&mySelection=two&gender=male\n```\n\n## 将表单转换为\
  \ JavaScript 对象\n\n另一个非常有用的序列化技术是将表单数据转换为可以访问的 JavaScript 对象。jQuery 的 `.serializeArray()`\
  \ 方法正是此用。所有的名称/值对都会转换为一个可以通过你的代码访问的数组。\n\n例如，考虑在与图 13.2 所示相同的表单上运行的 jQuery 语句：\n\
  \n```javascript\nvar formArr = $(\"#simpleForm\").serializeArray();\n```\n\n`formArr`\
  \ 的结果值如下：\n\n```json\n{\n  0: {\"name\":\"title\", \"value\":\"Lumber Jack\"},\n\
  \  1: {\"name\":\"mySelection\", \"value\":\"one\"},\n  2: {\"name\":\"mySelection\"\
  , \"value\":\"two\"},\n  3: {\"name\":\"gender\", \"value\":\"male\"}\n}\n```\n\n\
  ***\n\n* *\n\n## 动手尝试：访问和操作表单元素数据\n\n现在你已经有机会回顾了访问和交互表单数据的方法，是时候亲手实践了。在这个练习中，你将创建两个表单：一个用于获取数据，另一个用于设置数据。结果是，当你更新一个表单时，另一个表单也会随之更新。\n\
  \n该练习的目的是让你有机会以多种方式获取和设置表单元素的值。示例代码位于列表 13.1、13.2 和 13.3 中。\n\n使用以下步骤创建动态网页：\n\n\
  1. 在 Eclipse 中，创建 `lesson13`、`lesson13/js` 和 `lesson13/css` 文件夹，然后添加 `lesson13/form_manipulation.html`、`lesson13/js/form_manipulation.js`\
  \ 和 `lesson13/css/form_manipulation.css` 文件。\n\n2. 在 HTML 和 CSS 文件中添加列表 13.1 和列表\
  \ 13.3 所示的代码。这里有很多 HTML 代码，但它们都只是在定义表单元素。注意有两个表单：`formA` 和 `formB`。\n\n3. 打开 `form_manipulation.js`\
  \ 文件并编写一个基础的 `.ready()` 函数，你将在其中添加代码行以实现事件处理程序，从 `formA` 的数据更新 `formB`。\n\n4. 添加以下行，为文本输入框绑定\
  \ `keyup` 处理程序，这样当 `formA` 中的值发生变化时，`formB` 中的值也会发生变化。值通过 `.val()` 方法获取和设置：\n\n\
  ```javascript\n$(\"#formA input:text\").keyup(function(){\n  $(\"#formB input:text\"\
  ).val($(this).val());\n});\n```\n\n5. 添加以下行，为文本和 `<textarea>` 输入绑定 `keyup` 处理程序，这样当\
  \ `formA` 中的值发生变化时，`formB` 中的值也会发生变化。值通过 `.val()` 方法获取和设置：\n\n```javascript\n$(\"\
  #formA textarea\").keyup(function(){\n  $(\"#formB textarea\").val($(this).val());\n\
  });\n```\n\n6. 添加以下行，为单选框（radio）输入绑定 `change` 处理程序。注意，为了获取另一个表单中相同的单选框，你需要通过 `$(\"\
  #formB input[value=\" + $(this).val() + \"]\");` 获取元素。使用 `.prop()` 方法设置：\n\n```javascript\n\
  $(\"#formA input:radio\").change(function(){\n  var radioB = $(\"#formB input[value=\"\
  \ + $(this).val() + \"]\");\n  radioB.prop(\"checked\", $(this).is(\":checked\"\
  ));\n});\n```\n\n7. 添加以下行，为复选框（checkbox）绑定 `click` 处理程序，当点击时使用 `.prop()` 方法选中 `formB`\
  \ 中相同的复选框：\n\n```javascript\n$(\"#formA input:checkbox\").click(function(){\n  $(\"\
  #formB input:checkbox\").prop(\"checked\", $(this).prop(\"checked\"));\n});\n```\n\
  \n8. 添加以下行，为选择框（select）绑定 `change` 处理程序，当选择发生变化时，调用 `.val()` 获取 `formA` 的值并设置 `formB`：\n\
  \n```javascript\n$(\"#formA select\").change(function(){\n  $(\"#formB select\"\
  ).val($(this).val());\n});\n```\n\n9. 添加以下行，为图像输入绑定 `click` 处理程序，当点击时，`formB` 中图像输入的\
  \ `src` 属性将更改为匹配：\n\n```javascript\n$(\"#formA input:image\").click(function(e){\n\
  \  $(\"#formB input:image\").attr(\"src\", $(this).attr(\"src\"));\n  e.preventDefault();\n\
  });\n```\n\n10. 为重置按钮添加以下点击处理程序。该处理程序通过 `$(\"#formB\").get(0)` 获取 `formB` DOM 元素并调用\
  \ `.reset()` 函数。然后移除所有已选中元素的 `checked` 属性并重置图像元素的 `src` 属性：\n\n```javascript\n$(\"\
  #resetB\").click(function(){\n  $(\"#formB\").get(0).reset();\n  $(\"#formB input:checked\"\
  ).prop(\"checked\", false);\n  $(\"#formB input:image\").attr(\"src\", \"\");\n\
  });\n```\n\n11. 为序列化按钮添加以下点击处理程序。该处理器首先对表单调用 `.serialize()` 并字符串写入序列化段元素。然后通过调用\
  \ `.serializeArray()` 获取序列化数组。使用 `jQuery.each()` 方法遍历数组，并在 `serializedA` 段落中添加一个包含名称/值对的新段落：\n\
  \n```javascript\n$(\"#serializeB\").click(function(e){\n  $(\"#serialized\").html($(\"\
  #formA\").serialize());\n  $(\"#serializedA\").empty();\n  var arr = $(\"#formA\"\
  ).serializeArray();\n  jQuery.each(arr, function(i, prop){\n    $(\"#serializedA\"\
  ).append($(\"<p>\" + prop.name + \" = \" + prop.value + \"</p>\"));\n  });\n});\n\
  ```\n\n\n\n\n\n## 12. 保存所有三个文件，然后在浏览器中打开 HTML 文档，如图图 13.3\n\n**图 13.3** 表单间的操作，展示了如何对表单读写数据以及对表单值进行序列化。\n\
