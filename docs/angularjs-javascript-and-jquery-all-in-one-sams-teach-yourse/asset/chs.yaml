  12  marginmargin-top:-5px\n13 }\n```\n\n* * *\n\n* * *\n\n### 可见性动画\n\njQuery 还为附加到\
  \ jQuery 对象的淡入方法提供了动画能力。最后，淡入方法等同于对 `opacity` 属性使用 `.animate()`。\n\n以下章节描述了如何将动画应用于各种淡入方法。\n\
  \n#### fadeIn()\n\n`.fadeIn( [duration] [, easing] [, callback])` 方法提供了可选的 `duration`、`easing`\
  \ 和 `callback` 选项，允许你对元素的 `opacity` 从其当前值到 1 执行淡入动画。\n\n例如，以下代码对所有图像元素应用了 1 秒钟且带有\
  \ `swing` 缓动的动画：\n\n点击此处查看代码图像\n\n```javascript\n$(\"img\").fadeIn(1000, \"swing\"\
  );\n```\n\n#### fadeOut()\n\n`.fadeIn( [duration] [, easing] [, callback])` 方法提供了可选的\
  \ `duration`、`easing` 和 `callback` 选项，允许你对元素的 `opacity` 从其当前值到 0 执行淡出动画。（注：原文意图可能是想引用\
  \ `fadeOut`）。\n\n例如，以下代码对所有图像元素应用了 1 秒钟且带有 `swing` 缓动的动画，并在完成后将它们淡入：点击此处查看代码图像\n\
  \n```javascript\n$(\"img\").fadeOut(1000, \"swing\", function() { $(this).fadeIn(1000);});\n\
  ```\n\n#### fadeToggle()\n\n`.fadeToggle( [duration] [, easing] [, callback])` 方法提供了可选的\
  \ `duration`、`easing` 和 `callback` 选项，允许你将元素的 `opacity` 从当前值切换到 0 或 1。\n\n例如，以下代码对所有图像元素应用了\
  \ 3 秒钟的 `swing` 缓动动画。当前可见的图像淡出，当前透明的图像淡入：点击此处查看代码图像\n\n```javascript\n$(\"img\"\
  ).fadeToggle(3000, \"swing\");\n```\n\n#### fadeTo()\n\n`.fadeTo( duration, opacity\
  \ [, callback])` 方法提供了 `duration` 和 `opacity` 选项，用于指定结束透明度以及动画持续的时间。还提供了可选的 `easing`\
  \ 和 `callback` 参数。\n\n例如，以下代码对所有图像从当前透明度变为 .5 应用了 2 秒的动画：\n\n```javascript\n$(\"\
  img\").fadeTo(2000, .5);\n```\n\n* * *\n\n### 动手尝试：使用淡入动画实现选择\n\n在此示例中，你对一组图像应用淡入动画，在鼠标悬停在图像上时更改透明度。练习的目的是让你使用本节讨论的一些淡入技术。示例代码位于\
  \ 2.4,2.5 和 2.6。\n\n按照以下步骤创建图像选择：\n\n1. 在 Eclipse 中创建 `12/image_fade.html`、`12/js/image_fade.js`\
  \ 和 `12/css/image_fade.css` 文件。\n2. 在 HTML 和 CSS 文件中添加列表 12.4 和 12.6 所示的代码——包含五个\
  \ `<img>` 元素的简单 `<div>`。\n3. 打开 `image_fade.js` 并添加以下 `load()` 函数，为所有 `<img>` 元素添加\
  \ `mouseover` 和 `mouseout` 处理器。`mouseover` 处理器将图像淡入到 `opacity` 1（即完全不透明）；`mouseout`\
  \ 在鼠标移出时将其淡回 .3：点击此处查看代码图像\n\n```javascript\n$(window).load(function(){\n  $(\"\
  img\").mouseover(function(){$(this).fadeTo(1000, 1);});\n  $(\"img\").mouseout(function(){$(this).fadeTo(1000,\
  \ .3);});\n});\n```\n4. 保存所有三个文件，然后在网络浏览器中打开 HTML 文档，如图 12.2 所示。你可以移动鼠标经过图像并看到透明度的变化。\n\
  \n![Image](img/image0013.jpeg)\n\n**图 12.2** 随鼠标经过图像时调整透明度的简单图像选择。\n\n**列表 12.4\
  \ image_fade.html 用于显示图像的基础 Web HTML 文件**\n\n点击此处查看代码图像\n\n* * *\n\n```html\n01\
