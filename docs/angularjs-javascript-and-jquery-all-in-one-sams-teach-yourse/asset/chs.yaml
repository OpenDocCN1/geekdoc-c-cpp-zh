  \ }\n```\n5. 添加以下函数，在用户选择信用卡或 PayPal 时更新付款部分。注意，当用户选择信用卡时，PayPal 信息会被隐藏，信用卡信息会显示；如果选择\
  \ PayPal，则发生反向操作。还要注意在这两种情况下焦点都切换到了用户开始输入付款信息的第一个文本元素。这样用户就不需要按 Tab 键点击下一个元素了：\n\
