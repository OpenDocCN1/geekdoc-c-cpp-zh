  , \"answer\":\"no\"},\n11                clickHandler);\n12 });\n```\n\n**列表 9.6\
  \ working_event.css 为 元素设置样式的 CSS 代码**\n\n点击此处查看代码图像\n\n```css\n01 div{\n02    border-radius:5px;\n\
