  \n**5.** `#mainContainer {...`\n\n#### 练习\n\n**1.** 修改你在列表 4.3](#part0015.xhtml_ch04aa03)\
  \ 中应用的代码，包含以下 CSS 规则，该规则适用于你定义的 span。该规则应该在鼠标悬停上方时更改 HTML 元素的样式，从而改变菜单项的外观：\n\n\
  ```css\nspan:hover {\n  width:150px;\n  background-color: #223FF;\n  color: white;\n\
  \  border:5px outset blue;\n  border-radius:50%;\n}\n```\n\n**2.** 修改列表 4.6](#part0015.xhtml_ch04aa06)\
