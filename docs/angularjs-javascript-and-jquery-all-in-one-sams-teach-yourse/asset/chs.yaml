  \ `window.location` 对象的封装。这使得 URL 在你的 AngularJS 应用中可以访问。你不仅可以获取有关 URL 的信息，还可以修改它，通过新\
  \ URL 更改位置或导航到特定的哈希标签（hash tag）。\n\n要向控制器或服务添加 `$location` 服务，你需要使用标准的依赖注入方法来注入它。例如：\n\
  \n点击此处查看代码图片\n\n```javascript\napp.controller('myController', ['$location', function($scope)\
  \ {\n  // ...\n}]);\n```\n\n表 27.5 $location 对象可用方法\n`$location` 服务提供了对 JavaScript\
  \ `window.location` 对象的封装。这使得 URL 在你的 AngularJS 应用中可以访问。你不仅可以获取有关 URL 的信息，还可以修改它，通过新\
  \ URL 更改位置或导航到特定的哈希标签。\n\n#### 试试：实现 $location 服务\n在这个示例中，你有机会在 AngularJS 应用中实现\
  \ `$location` 服务。使用以下步骤构建应用：\n\n1. 添加 `service_animate.html` 和 `js/service_animate.js`\
  \ 文件。\n2. 将 `$location` 服务引入控制器中。\n3. 控制器中的 `updateLocationInfo()` 函数为当前 URL 位置设置作用域中的值。\n\
  4. 以下函数 `changePath` 将 URL 中的 `path` 值更改为 `/new/path` 并更新位置。\n5. 以下函数 `changeHash`\
  \ 将 URL 中的 `hash` 值更改为 `newHash` 并更新位置。\n6. 以下函数 `changeSearch` 将 URL 中的路径值更改为 `?p1=newA`\
  \ 并更新位置。\n\n\n\n\n\n### 8. 列表 27.11 中的代码实现了一个 AngularJS 模板，用于显示获取的 `$location` 服务信息，并提供更改\
