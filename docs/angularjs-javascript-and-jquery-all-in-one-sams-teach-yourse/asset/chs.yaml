  \n**图 27.1 实现 $http 服务以允许 AngularJS 控制器与 Web 服务器交互。**\n\n#### 使用 $cacheFactory 服务\n\
  \n$cacheFactory 服务提供了一个非常实用的键值对存储库。由于是一个服务，多个控制器和其他 AngularJS 组件都可以使用它。\n\n在创建 $cacheFactory\
  \ 服务时，可以指定一个包含 `capacity` 属性的 `options` 对象，例如 `{capacity: 5}`。通过添加此 `capacity` 设置，你限制了缓存中元素的最大数量为五个。当添加新项目时，最旧的项目会被移除。如果没有指定容量，缓存将继续增长。列表\
  \ 27.4 展示了在 `Module` 对象中实现 `$cacheFactory` 的基本示例，然后从两个不同的控制器访问它。`factory()` 方法创建了一个可注入的\
  \ `$cacheFactory` 服务对象，并在 `myController` 和 `myController2` 控制器中实例化。\n\n**列表 27.4\
  \ service_cache.js 在 AngularJS 应用中实现 $cacheFactory 服务**\n\n点击此处查看代码图片\n\n```javascript\n\
  01 var app = angular.module('myApp', []);\n02 app.factory('MyCache', function($cacheFactory)\
  \ {\n03   return $cacheFactory('myCache', {capacity:5});\n04 });\n05 app.controller('myController',\
  \ ['$scope', 'MyCache',\n06                                  function($scope, cache)\
  \ {\n07     cache.put('myValue', 55);\n08   }\n09 app.controller('myController2',\
  \ ['$scope', 'MyCache',\n10                                  function($scope, cache)\
  \ {\n11   $scope.value = cache.get('myValue');\n12 }]);\n```\n\n#### 使用 $window\
  \ 服务实现浏览器告框\n\n$window 服务提供了浏览器 `window` 对象的 jQuery 封装，允许你像通常使用 JavaScript 那样访问\
  \ `window` 对象。为了说明这一点，以下代码使用 `window` 对象上的 `alert()` 方法弹出一个浏览器警告。告框的消息获取自浏览器 `window`\
  \ 对象的 `$window.screen.availWidth` 和 `$window.screen.availHeight` 属性：\n\n点击此处查看代码图片\n\
  \n```javascript\nvar app = angular.module('myApp', []);\n\napp.controller('myController',\
  \ ['$scope', '$window',\n                                  function($scope, window)\
  \ {\n  window.alert(\"Your Screen is: \\n\" +\n  window.screen.availWidth + \"X\"\
  \ + window.screen.availHeight);\n}]);\n```\n\n#### 使用 $cookieStore 服务与浏览器 Cookie\
  \ 交互\n\nAngularJS 提供了几个用于获取和设置 Cookie 的服务：`$cookie` 和 `$cookieStore`。Cookie 在浏览器提供了临时存储，即使在用户离开网页或关闭浏览器时它们依然存在。\n\
  \n`$cookie` 服务允许你通过点表示法获取和更改字符串 Cookie 值。例如，以下代码获取了名为 `appCookie` 的 Cookie 值，然后将其更改：\n\
  \n```javascript\nvar cookie = $cookies.appCookie;\n\n$cookies.appCookie = 'New Value';\n\
  ```\n\n\n\n\n\n`$cookieStore` 服务提供了 `get()`、`put()` 和 `remove()` 函数，用于获取、设置和删除 cookie。`$cookieStore`\
  \ 服务的一个非常好的特性是，它在设置 JavaScript 对象值之前会先将其序列化为 JSON 字符串，然后在获取时再将它们反序列化为对象。\n\n要使用\
  \ `$cookie` 和 `$cookieStore` 服务，你需要完成三件事。首先，在模板中于 `angular.js` 之后但`application.js`\
  \ 之前加载 `angular-cookies.js` 库。例如：\n\n点击此处查看代码图片\n\n```html\n<script src=\"http://code.angularjs.org/1.3.0/angular.min.js\"\
  ></script>\n<script src=\"http://code.angularjs.org/1.3.0/angular-cookies.min.js\"\
  ></script>\n```\n\n### 顺便一下\n\n你也可以从 AngularJS 网站 [`code.angularjs.org/`](http://code.angularjs.org/)/<version>/\
  \ 下载 `angular-cookies.js` 文件，其中 `<version>` 是你正在使用的 AngularJS 版本。根据你使用的 AngularJS\
  \ 版本，你可能还需要下载 `angular-cookies.min.js.map` 文件。\n\n### 第二，你将 `ngCookies` 添加到你的应用\
  \ `Module` 定义中所需的模块列表中。例如：\n\n点击此处查看代码图片\n\n```javascript\nvar app = angular.module('myApp',\
  \ ['ngCookies']);\n```\n\n第三，将 `$cookies` 或 `$cookieStore` 服务注入到你的控制器中。例如：\n\n点击此处查看代码图片\n\
  \n```javascript\napp.controller('myController', ['$scope', '$cookieStore',\n   \
  \                            function($scope, cookieStore) {\n\n}]);\n```\n\n###\
