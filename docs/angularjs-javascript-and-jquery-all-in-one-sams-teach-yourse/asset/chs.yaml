  #footer\").show();});\n        $(\"#handle\").html('-');\n    } else {\n       \
  \ $(\"#footer\").hide();\n    }\n}\n```\n\n\n\n\n\n```javascript\n10      $(\"#photo\"\
  ).hide(1000);\n11      $(\"#handle\").html('+');\n12    }\n13 }\n```\n\n5. 保存所有三个文件，然后在网络浏览器中打开\
