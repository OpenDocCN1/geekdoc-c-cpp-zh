  \n\n\n\n\n作用域（scopes）的一个强大特性是可以在作用域层级中发射和广播事件。事件允许你向作用域中的不同层级发送通知，告知某个事件已经发生。事件可以是你选择的任何内容，例如值改变或达到阈值。这在许多情况下非常有用，例如让子作用域知道父作用域中的值发生了变化，反之亦然。\n\
  \n### 向父级作用域层级发射自定义事件\n\n要从作用域中发射事件，你可以使用 `$emit()` 方法。该方法通过父级作用域层级向上发送事件。任何注册了该事件的祖作用域都会收到通知。`$emit()`\
  \ 方法使用以下语法，其中 `name` 是事件名称，`args` 是传递给事件处理函数的零或多个参数：\n\n点击此处查看代码图片\n\n```\nscope.$emit(name,\
  \ [args, . . .])\n```\n\n### 向子级作用域层级广播自定义事件\n\n你还可以使用 `$broadcast()` 方法通过子作用域层级向下广播事件。任何注册了该事件的后代作用域都会收到通知。`$broadcast()`\
  \ 方法使用以下语法，其中 `name` 是事件名称，`args` 是传递给事件处理函数的零或多个参数：\n\n点击此处查看代码图片\n\n```\nscope.$broadcast(name,\
  \ [args, . . .])\n```\n\n### 使用监听器处理自定义事件\n\n要处理发射或广播的事件，你可以使用 `$on()` 方法。`$on()`\
  \ 方法使用以下语法，其中 `name` 是要监听的事件名称：\n\n```\nscope.$on(name, listener)\n```\n\n`listener`\
  \ 参数是一个函数，它接收事件作为第一个参数，并将由 `$emit()` 或 `$broadcast()` 方法传递的任何参数作为后续参数。`event` 对象具有以下属性：\n\
  \n![Image](img/image00767.jpeg) **targetScope:** 调用 `$emit()` 或 `$broadcast()` 的作用域。\n\
  \n![Image](img/image00767.jpeg) **currentScope:** 当前正在处理该事件的作用域。\n\n![Image](img/image00767.jpeg)\
  \ **name:** 事件的名称。\n\n![Image](img/image00767.jpeg) **stopPropagation():** 一个停止事件在作用域层级中向上或向下传播的函数。\n\
  \n![Image](img/image00767.jpeg) **preventDefault():** 一个防止浏览器事件默认行为的函数，但只会执行你自己的自定义代码。\n\
  \n![Image](img/image00767.jpeg) **defaultPrevented:** 布尔值，如果调用了 `event.preventDefault()`，则为\
  \ `true`。\n\n***\n\n### 动手试试：在嵌套控制器中实现自定义事件\n\n在此示例中，你使用自定义事件在两个控制器之间通信变化，其中一个嵌套在另一个内部。列表\
  \ 26.3 和 列表 26.4 中的代码提供了一个 AngularJS 应用和模板，说明了如何使用 `$emit()`、`$broadcast()` 和 `$on()`\
  \ 在作用域层级中上下发送和处理事件。\n\n在示例中，父作用域中存储了一个角色列表。你可以轻松地点击列表中的角色来显示包含子作用域中的角色信息。你也可以删除子作用域中的角色，这将将其从父作用域的列表中移除。\n\
  \n使用以下步骤构建带有嵌套控制器和作用域的应用程序：\n\n1. 添加 `lesson26/scope_events.html` 和 `lesson26/js/scope_events.js`\
  \ 文件。\n\n2. 将列表 26.3 和 列表 26.4 所示的代码添加到 HTML 和 JavaScript 文件中。\n\n3. 列表 26.3 中的以下几行代码实现了名为\
  \ `Characters` 的父作用域控制器。作用域中定义了一个角色名称数组并将 `currentName` 值设置为该数组的第一个元素：\n\n点击此处查看代码图片\n\
  \n```\n02  controller('Characters', function($scope) {\n03    $scope.names = ['Frodo',\
  \ 'Aragorn', 'Legolas', 'Gimli'];\n04    $scope.currentName = $scope.names[0];\n\
  ...\n15  }).\n```\n\n4. 下面的 `changeName()` 函数更改了作用域中的 `currentName` 值，然后广播了 `CharacterChanged`\
