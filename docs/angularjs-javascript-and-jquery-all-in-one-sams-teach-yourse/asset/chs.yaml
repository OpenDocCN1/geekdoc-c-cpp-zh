  ### 应用可选择组件（Selectable Widget）\n\n用户的另一个频繁请求是，能够使用边界框在页面上轻松地选择多个项目。`selectable`\
  \ 组件提供了该功能，允许用户使用鼠标在可选择元素内部的可选择子元素周围绘制一个框框（或称为“套索”）。框内的项目将在列表中被选中。\n\n表 18.8 描述了更常见的可选择选项。以下展示了将\
  \ `selectable` 组件挂载到元素上并将 `tolerance` 指定为 `fit` 的示例：\n\n点击此处查看代码图像\n\n```javascript\n\
  $(\"#ul1\").selectable ({tolerance:\"fit\"});\n```\n\n![图像](img/image00971.jpeg)\n\
  \n**表 18.8 常见可选择组件选项**\n\nselectable 组件还提供了额外的事件，以便在更改选择时，可以将处理程序绑定到可选择元素或其子元素。表\
  \ 18.9 列出了你可以在可选择项目上访问的事件。\n\n![图像](img/image00972.jpeg)\n\n**表 18.9 可选择组件事件**\n\
  \n每个可选择事件都将传递事件对象连同一个 `ui` 对象，该对象将为每个事件提供一个值，代表可选择元素。例如，以下代码为一个元素添加了 `selectableselected`\
  \ 事件，然后访问了 `selected` 属性：\n\n点击此处查看代码图像\n\n```javascript\n$(\"#list1\").selectable();\n\
  $(\"#list1\").on(\"selectableselected\", function(e, ui){ ui.selected.effect(\"\
  shake\");\n});\n```\n\n* * *\n\n### 注释\n\n`.ui-selecting` 类会被添加到当前正在选中的子元素上。当一个子元素被选中后，`.ui-selected`\
  \ 类会被添加。这允许你在 CSS 中定义一些基础样式，而无需在可选择事件处理程序中手动添加/删除类。\n\n* * *\n\n* *\n\n### 动手实践：创建可选择集合\n\
