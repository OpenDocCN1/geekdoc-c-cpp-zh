  \n7. 我们添加到 body 的垂直重复图像是 200 像素宽的，因此更改容器的左边距，使内容位于图像的右侧：\n\n```css\n#menu {\n  padding:2px;\n\
  \  background-color:#294551;\n}\n```\n\n8. 通过将背景颜色更改为 `#55555` 并为组成选项 `<span>` 元素添加垂直渐变来样式菜单：\n\
  \n```css\n#menu{\n  padding:3px;\n  background-color:#55555;\n}\nspan {\n  padding:3px;\n\
  \  background-image: -moz-linear-gradient(top, #294551 0%, #AACCFF 85%, #0022ff\
  \ 100%);\n  background-image: -webkit-linear-gradient(top, #294551 0%, #AACCFF 85%,\
  \ #294551 100%);\n  background-image: -ms-linear-gradient(top, #294551 0%, #AACCFF\
