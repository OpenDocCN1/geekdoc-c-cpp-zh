  \ 对象。******\n\n**3 测试它是否设置了 `jquery` 属性。******\n\n**4 `$(\".heading\")`**\n\n**5\
  \ `$(div p)`**\n\n**6 在 jQuery 对象上使用 `get()` 方法。******\n\n#### 练习\n1. 在 jquery_selectors.html\
  \ 示例中添加一个额外的按钮，选择列表中第一个和最后一个项目。你需要添加实现此所需的 HTML 和 JavaScript 代码。\n\n## 第 8 章 使用\
  \ jQuery 导航和操作 jQuery 对象与 DOM 元素\n\n在本节中将学习：\n\n![Image](img/image0767.jpeg) 链式\
  \ jQuery 操作提高效率\n\n![Image](img/image0767.jpeg) 过滤 jQuery 对象中 DOM 元素的方法\n\n![Image](img/image0767.jpeg)\
  \ 使用 jQuery 对象遍历 DOM 的方法\n\n![Image](img/image0767.jpeg) 遍历 jQuery 对象集中的每个元素\n\n\
  jQuery 选择器返回一个代表零或多个匹配选择器定义的元素的 jQuery 对象。简单的选择器对于很多事情非常有用。但是，随着你的网页变得越来越复杂，你会发现选择器无法完成你需要的一切。\n\
  \n\n\n\njQuery 对象提供了额外的功能，通过允许你轻松地精炼所代表的 DOM 元素列表、导航 DOM 树以查找其他元素以及操作 HTML 元素的值，从而增强了选择器的结果。后续章节将介绍如何将\
  \ jQuery 操作链式组合，以便高效地在网页中查找、过滤和遍历 DOM 元素。\n\n### 链式 jQuery 对象操作\n\njQuery 对象的强大之处之一在于，你可以将多个\
  \ jQuery 操作链接到单条语句中。每个连续的语句都将在链中上一个操作的结果的基础上进行操作。这可以帮助减少并简化你的选择器，并减少 CSS 中所需的类名和\
  \ ID 定义。\n\n将链式 jQuery 操作的结果想象成一堆 jQuery 对象栈，其中每个对象代表一组 DOM 元素。链中的每个操作都会将一个 jQuery\
  \ 对象置于栈顶，但当前的操作将仅应用于栈顶的那个 jQuery 对象。\n\n为了帮助说明这一点，请考虑以下语句。代码首先找到 `id=\"content\"\
  ` 的 `<div>` 元素，然后找到其内部的第一个 `<p>` 元素并将 `font-weight` 改为 `bold`。接着，它找到 `<p>` 内部的 `<span>`\
  \ 元素并将 `color` 设置为 `red`：\n\n点击此处查看图片\n\n```javascript\nvar $contentDiv = $(\"div#content\"\
  );\nvar $firstP = $contentDiv.children(\"p:first\");\n$firstP.css(\"font-weight\"\
  ,\"bold\");\nvar $spans = $firstP.children(\"span\");\n$spans.css(\"color\",\"red\"\
  );\n```\n\n前面的代码用了五行来完成所有任务。而后续的单行链式 jQuery 操作仅需一行代码就实现了相同的功能：\n\n点击此处查看图片\n\n```javascript\n\
  $(\"div#content\").children(\"p:first\").css(\"font-weight\",\"bold\").children(\"\
  span\"). css(\"color\",\"red\");\n```\n\n由于每个操作都返回一个 jQuery 对象，你可以根据需要链接任意数量的 jQuery\
  \ 操作。即使 `.css()` 操作设计用于修改 DOM 对象而不是查找它们，它仍然会返回相同的 jQuery 对象，因此你可以对结果执行其他操作。\n\n\
  ### 过滤 jQuery 对象结果\n\njQuery 对象提供了一组很好的方法，允许你修改查询中代表的 DOM 对象。当你尝试在 jQuery 选择器结果中精确定特定的元素组时，减少结果是有帮助的。表\
  \ 8.1 提供了链式使用 jQuery 选择器的示例。\n\n![图像](img/image00878.jpeg)\n\n**表 8.1 过滤所代表 DOM\
  \ 元素的 jQuery 对象方法示例**\n\n***\n\n**提示**与 CSS 选择器相同的 jQuery 选择器可以使用原生的 DOM 方法 `querySelectorAll()`，该方法在\
  \ DOM 对象上有一些高级优化。其他 jQuery 选择器无法利用这种优化，因此最好先使用基于 CSS 的选择器，然后将过滤器作为链式选择器添加。例如，与其使用\
  \ `$(\"div:animated\")`，不如你应该使用 `$(\"div\").filter(\":animated\")`：[`api.jquery.com/category/selectors/jquery-selector-extensions/`](http://api.jquery.com/category/selectors/jquery-selector-extensions/)\n\
  \n***\n\n### 使用 jQuery 对象遍历 DOM\n\n附载到 jQuery 对象上的另一组重要方法是 DOM 遍历方法。DOM 遍历允许你根据元素与其他元素的关系来选择元素。\n\
  \nDOM 有时被称为 DOM 树，因为它以树形结构组织，以文档为根，节点可以同时具有父节点、兄弟节点和子节点。为了更好地视觉化，请查看以下 HTML 代码：\n\
  \n```html\n<body>\n  <div>\n    <p>Paragraph 1</p>\n    <p>Paragraph 2</p>\n   \
  \ <ul>\n      <li>Item 1</li>\n      <li>Item 2</li>\n    </ul>\n  </div>\n</body>\n\
  ```\n\n`<p>` 元素和 `<ul>` 元素是彼此的兄弟元素，且它们都是 `<div>` 元素的子元素。`<div>` 元素是 `<p>` 和 `<ul>`\
  \ 元素的父元素，而 `<ul>` 元素是 `<li>` 元素的父元素，依此类推。\n\njQuery DOM 遍历方法允许你从 DOM 的某一层移动到另一层以选择元素——例如，如果你想访问所有作为\
  \ `<div>` 元素元素的 `<p>` 元素，或者你想寻找作为 `<input>` 元素的兄弟 `<label>` 元素。\n\njQuery 对象提供了一组不可惊的方法，允许通过使用\
  \ jQuery 对象中当前 DOM 元素的选择来选择树中的其他 DOM 元素组，从而以无数方式遍历 DOM。表 8.2 列出了你可以用于遍历 DOM 的方法。\n\
  \n![图像](img/image00879.jpeg)![图像](img/image00880.jpeg)![图像](img/image00881.jpeg)![图像](img/image00882.jpeg)\n\
  \n**表 8.2 允许你遍历 DOM 选择元素的 jQuery 对象方法示例**\n\n### 查看一些额外的 jQuery 对象方法\n\n在过滤 jQuery\
  \ 对象或使用它遍历 DOM 时，你应该注意一些额外的方法。表 8.3 列出了你可以结合过滤和遍历使用的方法，以在 jQuery 对象中进行操作。随着代码的增加，你会发现越来越频繁地使用这些方法。\n\
  \n![图像](img/image0083.jpeg)![图像](img/image0084.jpeg)\n\n**表 8.3 用于处理 jQuery 对象的少量方法示例**\n\
  \n***\n\n**注意**在使用迭代 DOM 元素的 jQuery 函数时，你可以使用 `this` 关键字来访问当前迭代的 DOM 对象。这是一个 DOM\
  \ 对象而不是 jQuery 对象。如果你需要使用 jQuery 表单，请使用 `$(this)`。但请记住，这需要在渲染引擎中进行工作。\n\n***\n\n\
  #### 使用 .each()\n\n`.each(function)` 方法是最重要的 jQuery 方法之一，因为它允许遍历 jQuery 中的所有元素并对每个元素执行操作。这与仅仅对所有项执行相同的操作不同。\n\
  \n`.each()` 方法允许你指定一个为 jQuery 对象中的每个元素运行的函数。函数会将索引作为第一个参数传递。在函数内部，`this` 变量将指向当前的\
  \ DOM 元素。\n\n代码说明了使用 `.each()`。它遍历所有段元素并设置内容，包括元素的索引号：\n\n点击此处查看图片\n\n```javascript\n\
  $(\"p\").each(function (idx){\n  $(this).html(\"This is paragraph \" + idx);\n});\n\
  ```\n\n注意 `idx` 作为索引传入；第一个 `<p>` 元素为 0，第二个为 1，依此类推。还要注意 `this` 已通过 `$(this)` 转换为\
  \ jQuery 对象，以便调用 `.html()` 方法。\n\n#### 使用 .map()\n\n`.map(function)` 方法同样遍历 jQuery\
  \ 对象集合中的每个元素。虽然与 `.each()` 非常相似，但有一个巨大的区别，`.each()` 将返回相同的 jQuery 对象，而 `.map()`\
  \ 将返回一个带有每次迭代返回值的新 jQuery 对象。\n\n以下代码说明了使用 `.map()`。它将遍历所有的 `<li>` 元素并返回一个逗号分隔的元素文本字符串：\n\
  \n点击此处查看图片\n\n\n\n\n```javascript\nvar liValues = $(\"li\").map(function (idx){\n\
  \    return $(this).html();\n}).get().join(\",\");\n```\n注意，对于每次迭代，该函数会返回 `<li>`\
  \ 元素中的 HTML 内容。你调用 `.get()` 将 `.map()` 返回的新型 jQuery 对象转换为 JavaScript 数组版本，然后在该数组上调用\
  \ `.join(\",\")` 来构建一个以逗号分隔的字符串。\n\n***\n\n# 亲手试一试：使用 jQuery 的 .map() 和 .each()\
  \ 方法导航、访问和操作 DOM 元素\n\n在这个示例中，你将学习如何使用 jQuery 选择器找到所有段落（`<p>`）元素。然后，你将使用 `.map()`\
  \ 函数读取内容并用它创建一个新的 `<span>` 框。你还使用 `.each()` 遍历 `<p>` 元素并对它们进行重新样式。完整的示例文件可以在 代码列表\
  \ 8.1、8.2 和 8.3 中找到。使用以下步骤实现该示例：\n\n1. 在 Eclipse 中，创建一个名为 `lesson08` 的源文件夹。在 `lesson08`\
  \ 文件夹内部，创建 `js` 和 `css` 文件夹。\n2. 在 `lesson08` 文件夹中，创建名为 `dom_manipulation.html`、`js/dom_manipulation.js`\
  \ 和 `css/dom_manipulation.css` 的源文件。\n3. 打开 `dom_manipulation.html` 并添加常用的基础元素（html,\
  \ head, body）。\n4. 在 `<head>` 元素内部，添加如列表 8.1 所示的 `<script>` 和 `<link>` 元素，这些元素将用于加载\
  \ jQuery、JavaScript 和 CSS：\n\n点击此处查看代码\n\n```html\n06 <script type=\"text/javascript\"\
  \ src=\"https://code.jquery.com/jquery-2.1.3.min.js\"></script>\n07 <script type=\"\
  text/javascript\" src=\"js/dom_manipulation.js\"></script>\n08 <link rel=\"stylesheet\"\
  \ type=\"text/css\" href=\"css/dom_manipulation.css\">\n```\n\n5. 将列表 8.1 中第 11–19\
  \ 行的代码添加到 `css/dom_manipulation.css` 文件中。这段代码定义了两个输入按钮、一组 `<p>` 元素和一个用于放置内容的 `<div>`。\n\
  6. 将列表 8.3 中的样式代码添加到 `dom_manipulation.css` 文件中。该样式代码将为 `<span>` 元素设置样式，使其显示为 `inline-block`，这样你就可以设置它们的大小。\n\
  7. 打开 `js/dom_manipulation.js` 文件并添加以下行，这将将创建一个 `.ready()` 函数，该函数将在页面加载时执行：\n\n\
  点击此处查看代码\n\n```javascript\n01 $(document).ready(function (){\n...\n21 });\n```\n\
  \n8. 添加以下代码，将为第一个按钮添加一个 `click` 事件处理程序。该函数使用简单的 `.each()` 函数来遍历 `<p>` 元素；它获取字符串，将其拆分为颜色和大小，然后设置\
  \ `font-size` 和 `color` 属性：\n\n点击此处查看代码\n\n```javascript\n02 $(\"input:eq(0)\").click(function\
  \ (){\n03   $(\"p\").each(function(){\n04     var parts = $(this).html().split(\"\
  \ \");\n05     $(this).css({\"font-size\":parts[1]+\"px\", color:parts[0]});\n06\
  \   });\n07 });\n```\n\n9. 添加以下代码，将为第二个按钮添加一个 `click` 事件处理程序。该函数使用简单的 `.map()` 函数遍历\
  \ `<p>` 元素；它获取字符串并将其拆分为颜色和大小。然而，这次函数返回一个包含 `color` 和 `size` 属性的 JavaScript 对象。末尾的\
  \ `.get()` 将 `.map()` 的结果转换为名为 `items` 的 JavaScript 数组：\n\n点击此处查看代码\n\n```javascript\n\
  08 $(\"input:eq(1)\").click(function (){\n09   var items = $(\"p\").map(function(){\n\
  10     var parts = $(this).html().split(\" \");\n11     return {color:parts[0],\
  \ size:parts[1]};\n12  }).get();\n```\n\n10. 添加以下 `for` 循环，该循环遍历 `items` 并根据从 `<p>`\
  \ 元素读取的值创建具有相应颜色和大小的新 `<span>` 元素：\n\n点击此处查看代码\n\n```javascript\n13 for (var idx\
  \ in items){\n14   var item = items[idx];\n15   var span = $(\"<span>\" + item.color\
  \ + \"</span>\");\n16   var size = item.size*5;\n17   span.css({\"font-size\": item.size+\"\
  px\", width:size, height:size});\n18   $(\"div\").append(span);\n19 }\n```\n\n11.\
  \ 保存文件并在浏览器中打开 HTML。当你点击 `.each()` 按钮时，`<p>` 元素的文本会改变，如图 8.1 所示。当你点击 `.map()` 按钮时，`<div>`\
  \ 中将显示新的 `<span>` 元素。\n\n**图 8.1** 一个简单的 Web 页面，使用 `.map()` 和 `.each()` 读取 `<p>`\
  \ 元素的文本并对其进行动态更改。\n\n**列表 8.1** dom_manipulation.html 加载 jQuery、JavaScript 和 CSS\n\
  \n点击此处查看代码\n\n***\n\n```html\n01 <!DOCTYPE html>\n02 <html>\n03   <head>\n04   \
  \  <title>DOM Manipulation</title>\n05     <meta charset=\"utf-8\" />\n06     <script\
  \ type=\"text/javascript\" src=\"https://code.jquery.com/jquery-2.1.3.min.js\"></script>\n\
  07     <script type=\"text/javascript\" src=\"js/dom_manipulation.js\"></script>\n\
  08     <link rel=\"stylesheet\" type=\"text/css\" href=\"css/dom_manipulation.css\"\
  >\n09   </head>\n10   <body>\n11     <input type=\"button\" value=\".each()\">\n\
  12     <input type=\"button\" value=\".map()\">\n13     <p>red 10</p>\n14     <p>orange\
  \ 15</p>\n15     <p>yellow 20</p>\n16     <p>green 25</p>\n17     <p>blue 30</p>\n\
  18     <p>indigo 35</p>\n19     <p>violet 40</p>\n20     <div></div>\n21   </body>\n\
  22 </html>\n```\n\n***\n\n**列表 8.2** dom_manipulation.js JavaScript 获取 <p> 元素并遍历使用\
  \ .map() 和 .each() 为每个元素应用不同的更改\n\n点击此处查看代码\n\n***\n\n```javascript\n01 $(document).ready(function\
  \ (){\n02 $(\"input:eq(0)\").click(function (){\n03   $(\"p\").each(function(){\n\
  04     var parts = $(this).html().split(\" \");\n05     $(this).css({\"font-size\"\
  :parts[1]+\"px\", color:parts[0]});\n06   });\n07 });\n08 $(\"input:eq(1)\").click(function\
  \ (){\n09   var items = $(\"p\").map(function(){\n10     var parts = $(this).html().split(\"\
  \ \");\n11     return {color:parts[0], size:parts[1]};\n12  }).get();\n13  for (var\
  \ idx in items){\n14    var item = items[idx];\n15    var span = $(\"<span>\" +\
