  <img src=\"/images/someday.jpg\" alt=\"I'm going there\"/>\n```\n\n### 创建自定义组件\n\
  \n创建自定义组件是一个相当简单的过程`.widget()` 工厂需要一个名称，然后是原型对象。组件工厂将处理设置工作，以便组件可以应用于页面元素。\n\n代码清单\
  \ 19.12 中的代码显示了自定义组件的基本框架。要创建组件，请遵循以下步骤：\n\n1. 将 `custom.mywidget` 替换为你自己的名称。\n\
  2. 添加带有默认值的选项。\n3. 在 `_create()`、`_refresh()`、`_destroy()`、`_setOptions()` 和 `_setOption()`\
  \ 中添加额外代码。\n4. 向原型对象添加额外的属性或方法以实现该组件。\n\n**代码清单 19.12 widgets_custom.html 实现自定义组件的\
  \ jQuery 代码框架**\n\n点击此处查看代码图像\n\n```javascript\n$.widget(\"custom.mywidget\", {\n\
  \  options : {\n    // custom options\n  },\n  _create: function() {\n    //creation\
  \ code\n  },\n  _refresh: function() {\n    // 元素刷新时调用的刷新代码\n  },\n  _destroy: function()\
  \ {\n    // 组件销毁时调用的清理代码\n  },\n  _setOptions: function() {\n    // 保持正确的 this 上下文\
  \ _super 和 _superApply\n    this._superApply( arguments );\n    this._refresh();\n\
  \  },\n  _setOption: function( key, value ) {\n    // 设置单个选项值的代码\n    this._super(\
  \ key, value );\n  }\n});\n```\n\n### 总结\n\njQuery UI 包含了大量的内置组件，提供了传统 HTML 元素缺失的某些所需功能和样式。在本节中，你了解了组件以及如何在页面上实现它们，包括自动完成元素、按钮、日期选择器、对话框、菜单和工具提示。\n\
  \n### 问答\n\n问：什么是 Globalize 插件？我为什么要用它？\n\n答：Globalize 插件是一个旨在简化网页国际化过程的项目，处理货币、时间以及随地区变化的数值格式。如果你计划建立一个需要本地化的网站，最好检查一下。\n\
  \n### 工作坊\n\n工作坊由一组问题和答案组成，旨在巩固你对本节内容的理解。在查看答案之前，请尝试回答问题。\n\n#### 验\n\n1：如何获取滑块\
  \ `#mySlider` 的值？\n\n2：对或错：日期选择器组件必须附加到 `<input>` 元素。\n\n3：如何为由 jQuery UI 化的按钮、复选框或单选框附加事件处理程序？\n\
  \n4：如何为自动完成元素填充可能的值？\n\n#### 验答案\n\n1：`$(\"#mySlider\").slider(\"value\");`\n\n\
  2：错。\n\n3：像平常使用 jQuery 或 JavaScript 那样操作。\n\n4：将 source 选项的值设置为 JavaScript 数组。\n\
  \n### 练习题\n\n1. 打开代码清单 19.5 中的代码，向对话框添加一个 Input 元素。然后添加第二个按钮，获取该值并将其显示在网页某处。\n2.\
  \ 打开代码清单 19.10 中的代码，添加一个名为 Sliders 的新标签。让它链接到包含滑块示例的 `widgets_slider_bars.html`\
  \ 文件。\n\n\n\n\n\n本课程将向你介绍 AngularJS 以及 AngularJS 应用程序涉及的主要组件。在尝试实现 AngularJS 应用程序之前，理解这些组件至关重要，因为该框架与传统的\
  \ JavaScript Web 应用程序模式不同。\n\n在你良好掌握 AngularJS 应用程序的组件和生命周期后，你将学习如何逐步构建一个基础的 AngularJS\
  \ 应用程序。这将为你学习后续课程做好准备，后续课程将提供关于实现 AngularJS 的更多细节。\n\n#### 注意\n\n书中的示例基于 `AngularJS\
  \ 1.x`。Google 已经宣布了 `AngularJS 2` 并向我们展示了一些它的预览（尽管看起来距离发布还有很长的路要走）。`AngularJS 2`\
  \ 是 `AngularJS 1.x` 的重大升级。看起来影响开发者的最大变化将围绕自定义指令（custom directives），这是 `AngularJS\
  \ 1.x` 中复杂的部分。问题是：我仍然应该学习 `AngularJS 1.x` 吗？简单的答案是肯定的。根据我们的观察，`AngularJS 1.x` 的大部分知识将转化到\
  \ `AngularJS 2`，因为代码结构和关注点分离的核心概念是相同的。在此期间，为 `AngularJS 2` 做准备的一种良好方法是尽可能保持代码模块化。Google\
  \ 已经表示，你可以在 `AngularJS 2` 中运行封装好的 `AngularJS 1.x`，模块化的代码将允许你一次更新一部分。\n\n## 为什么选择\
  \ AngularJS？\n\nAngularJS 是一个基于 JavaScript 和轻量级 `jQuery` 的 MVC 框架。MVC 框架将代码中的业务逻辑与视图（View）和模型（Model）分离。如果没有这种分离，当你试图同时管理这三者以及复杂的函数迷时，基于\
  \ JavaScript 的 Web 应用程序可能会迅速失控。\n\nAngularJS 提供的所有功能你都可以使用 JavaScript 和 `jQuery`\
  \ 自行实现，甚至可以尝试使用另一个 MVC JavaScript 框架。然而，AngularJS 拥有许多功能，且 AngularJS 框架的设计使其能够以正确的方式实现\
  \ MVC。以下是选择 AngularJS 的一些原因。\n\nAngularJS 框架强制了 MVC 的正确实现，同时也易于正确实现 MVC：\n\n![Image](img/image00767.jpeg)\
  \ AngularJS HTML 模板的声明式使得 HTML 的意图更加直观，并让 HTML 更易维护。\n\n![Image](img/image00767.jpeg)\
  \ AngularJS 的模型部分是基础 JavaScript 对象，易于操作、访问和实现。\n\n![Image](img/image00767.jpeg)\
  \ AngularJS 使用声明式方法，通过在 HTML 声明与其背后的 JavaScript 功能之间建立直接链接来扩展 HTML 的功能。\n\n![Image](img/image00767.jpeg)\
  \ AngularJS 提供了一个非常简单且灵活的过滤器接口，允许你可以在数据从模型传递到视图时轻松对其进行格式化。\n\n![Image](img/image00767.jpeg)\
  \ AngularJS 应用程序使用的代码比传统的 JavaScript 应用程序少得多，因为你只需要关注逻辑，而不是所有细小的细节（例如数据绑定）。\n\n\
  ![Image](img/image00767.jpeg) AngularJS 需要的文档对象模型（DOM）操作远少于传统方法，并引导你将操作放置在应用程序的正确位置。基于数据展示来设计应用程序比基于\
  \ DOM 操作要容易得多。\n\n![Image](img/image00767.jpeg) AngularJS 提供了几个内置服务，并允许你以结构化和可重用的方式实现自己的服务。这使得你的代码更具可维护性且更于测试。\n\
  \n![Image](img/image00767.jpeg) 得益于 AngularJS 框架中职责的清晰分离，测试你的应用程序很容易，甚至可以使用测试驱动的方法进行开发。\n\
  \n## 理解 AngularJS\n\nAngularJS 提供了一个基于模型-视图-控制器（MVC）模型的非常结构化的框架。该框架允许你构建出健壮且易于理解和维护的结构化应用程序。如果你不熟悉\
  \ MVC 模型，下面的段落提供了一个快速的概述以帮助你理解基础。这绝不是完整的，仅旨在提供足够的参考，以查看 AngularJS 如何应用 MVC 原则。如果你想获取更多关于\
  \ MVC 的信息，维基百科网站是一个很好的资源。\n\n在 MVC 中有三个组件：`Model`（模型）是数据源，`View`（视图）是渲染的网页，而 `Controller`（控制器）处理两者之间的交互。其理念是当模型发生变化时，视图会自动用新数据进行更新。当用户与视图交互时，控制器处理这些交互，这通常会导致更新模型，从而再次更新视图。\n\
  \nMVC 的主要目的是将 JavaScript 代码中的职责分离，以保持其整洁和易于遵循。AngularJS 是可用最好的 MVC 框架之一，因为它使实现 MVC\
  \ 变得非常简单。\n\n要开始使用 AngularJS，你首先需要理解你将实现的各种组件以及它们如何相互作用。接下来的章节将讨论 AngularJS 应用程序涉及的各种组件、它们的用途以及每个组件负责的内容。\n\
  \n### 模块 (Modules)\n\nAngularJS 引入了 `module` 概念代表应用程序中的组件。`module` 提供了一个命名空间，允许你根据名称引用指令、作用域（scopes）和其他组件。这使得打包和复用应用程序的部分变得更容易。\n\
  \nAngularJS 中的每个视图或网页都通过 `ng-app` 指令分配了一个唯一的 `module`。（指令将在本节稍后讨论）。然而，你可以将其他模块作为依赖项添加到主模块，这提供了一个非常结构化和组件化的应用程序。主\
  \ AngularJS 模块的作用类似于 C# 和 Java 中的根命名空间。\n\n### 作用域 (Scopes) 与数据模型\n\nAngularJS 引入了\
  \ `scope` 的概念。`scope` 只是用于填充网页上显示的视图的数据 JavaScript 表示。数据可以来自任何源，例如数据库、远程 Web 服务或客户端\
  \ AngularJS 代码，也可以由 Web 服务器动态生成。\n\n作用域的一个极佳特性是它们仅仅是普通的 JavaScript 对象，这意味着你可以根据需要轻松地在\
  \ AngularJS 代码中操作它们。此外，你还可以嵌套作用域来组织数据，以匹配它们所处的上下文。\n\n### 带有模板和指令的视图 (Views with\
  \ Templates and Directives)\n\nHTML 网页基于 DOM，其中每个 HTML 元素由一个 DOM 对象表示。浏览器读取 DOM\
  \ 对象的属性，并根据 DOM 对象的属性知道如何在网页上渲染 HTML 元素。\n\n大多数动态 Web 应用程序使用 JavaScript 或基于 JavaScript\
  \ 的库（如 `jQuery`）来操作 DOM 对象，以更改用户视图渲染的 HTML 元素的行为和外观。\n\nAngularJS 引入了一个新的模板组合概念，其中包含指令，这些指令通过后台的\
  \ JavaScript 代码直接扩展 HTML 标签和属性，以扩展 HTML 的能力。指令有两个部分：第一部分是添加到 HTML 模板中的额外属性、元素和 CSS\
  \ 类；第二部分是扩展 DOM 正常行为的 JavaScript 代码。\n\n\n\n\n\n使用指令（directives）的优势在于，HTML 模板指明了视觉元素的预期逻辑，因此易于遵循，而不会隐藏在大量的\
  \ JavaScript 代码中。AngularJS 最强大的特性之一是其内置的 AngularJS 指令处理了大部分所需的 DOM 操作功能，使你能够直接将\
  \ `scope` 中的数据绑定到视图中的 HTML 元素上。\n\n你也可以创建自己的 AngularJS 指令，以实现 Web 应用程序中任何必要的自定义功能。事实上，你应该使用自定义指令来处理\
  \ Web 应用程序所需的任何直接 DOM 操作。\n\n## 表达式 (Expressions)\n\nAngularJS 的一个强大功能是在 HTML 模板中添加表达式的能力。AngularJS\
  \ 会求值表达式，然后将结果动态地添加到 页面中。由于表达式与 scope 绑定，因此你可以拥有一个利用 scope 中值的表达式，并且随着模型的变化，该表达式的值也会随之改变。\n\
  \n## 控制器 (Controllers)\n\nAngularJS 通过实现控制器完善了 MVC 框架。控制器通过在 scope 中设置初始状态或值，以及向\
  \ scope 添加行为来增强 scope。例如，你可以添加一个函数来求和 scope 中的值以提供总和，这样当 scope 后的后的模型数据发生变化时，总和值始终会变化。\n\
  \n你通过使用指令将控制器添加到 HTML 元素上，然后在后台作为 JavaScript 代码实现它们。\n\n## 数据绑定 (Data Binding)\n\
  \nAngularJS 最强大的特性之一是内置的数据绑定。数据绑定是将模型中的数据与网页上显示的内容链接起来的过程。AngularJS 提供了一个非常整洁的接口，将模型数据链接到网页中的元素。\n\
  \n在 AngularJS 中，数据绑定是一个双向过程：当网页上的数据发生变化时，模型会更新；当模型中的数据发生变化时，网页会自动更新。通过这种方式，模型始终是呈现给用户数据的唯一数据源，而视图是模型的投影。\n\
  \n## 服务 (Services)\n\n服务是 AngularJS 环境中的主要工作负载。服务是为 Web 应用提供功能的单例对象。例如，Web 应用的一项常见任务是对\
  \ Web 服务器执行 AJAX 请求。AngularJS 提供了一个 `HTTP` 服务，包含了访问 Web 服务器的所有功能。\n\n服务功能完全独立于上下文或状态，因此可以从应用程序组件中轻松消费。AngularJS\
  \ 提供了许多用于基础用途的内置服务组件，如 HTTP 请求、日志、解析和动画。你也可以创建自己的服务并在整个代码中复用它们。\n\n## 依赖注入 (Dependency\
  \ Injection)\n\n依赖注入是一个代码组件定义对其他组件依赖的过程。当代码初始化时，被依赖的组件将在组件内供访问。AngularJS 应用程序大量使用依赖注入。\n\
  \n依赖注入的一个常见用途是消费服务。例如，如果你正在定义一个需要通过 HTTP 请求访问 Web 服务器的模块，你可以将 `HTTP` 服务注入到模块中，该功能在模块代码中可用。此外，一个\
  \ AngularJS 模块通过依赖关系消费另一个模块的功能。\n\n## 编译器 (Compiler)\n\nAngularJS 提供了一个 HTML 编译器，它会发现\
  \ AngularJS 模板中的指令，并使用 JavaScript 指令代码构建扩展的 HTML 元素。当 AngularJS 库启动（bootstrap）时，编译器会被加载到浏览器中。加载后，编译器将搜索浏览器中的\
  \ HTML DOM，并将任何后端 JavaScript 代码链接到 HTML 元素上，然后最终的应用程序视图将渲染给用户。\n\n### AngularJS\
  \ 生命周期概述\n\n现在你已经了解了 AngularJS 应用程序涉及的组件，你需要了解生命周期期间发生了什么，生命周期包含三个阶段：启动（bootstrap）、编译（compilation）和运行（runtime）。理解\
  \ AngularJS 应用程序的生命有助于理解如何设计和实现你的代码。\n\nAngularJS 应用程序生命周期的三个阶段在每次在浏览器加载网页时都会发生。以下章节描述了\
  \ AngularJS 应用程序的这些阶段。\n\n### 启动阶段 (The Bootstrap Phase)\n\nAngularJS 生命周期的第一阶段是启动阶段，发生在\
  \ AngularJS JavaScript 库下载到浏览器时。AngularJS 初始化其自身的必要组件，然后初始化由 `ng-app` 指令指向的模块。模块被加载，任何依赖项都会被注入到你的模块中并供模块内的代码使用。\n\
  \n### 编译阶段 (The Compilation Phase)\n\nAngularJS 生命周期的第二阶段是 HTML 编译阶段。在加载网页初期，浏览器中会加载一个静态形式的\
  \ DOM。在编译阶段，静态 DOM 被替换为代表 AngularJS 视图的动态 DOM。\n\n此阶段涉及两个部分：遍历静态 DOM 并收集所有指令，然后将指令链接到\
  \ AngularJS 内置库或自定义指令代码中相应的 JavaScript 功能。指令与 scope 结合，产生动态或实时的视图。\n\n## 运行数据绑定阶段\
  \ (The Runtime Data Binding Phase)\n\nAngularJS 应用程序的最后一个阶段是运行阶段，它一直持续到用户重新加载或离开网页为止。此时，scope\
  \ 中的任何变化都会反映在视图中，视图中的任何变化都会直接更新到 scope 中，使 scope 成为视图数据的唯一源。\n\nAngularJS 的行为与传统的数据绑定方法不同。传统方法将模板与从引擎接收的数据结合，然后在每次数据变化时都操纵\
  \ DOM。AngularJS 仅编译一次 DOM，然后根据需要链接编译后的模板，这比传统方法效率得多。\n\n## 职责分离 (Separation of Responsibilities)\n\
  \n设计 AngularJS 应用程序一个至关重要的部分是职责分离。你选择结构化框架的完全是为了确保代码实现良好、易于遵循、可维护且可测试。Angular 提供了一个非常有结构化的框架供你工作，但你仍然需要确保以适当的方式实现\
  \ AngularJS。\n\n以下是实现 AngularJS 时需要遵循的一些规则：\n\n- 视图作为应用程序的官方展示结构。将任何展示逻辑作为指令指示在视图的\
  \ HTML 模板中。\n- 如果你需要执行任何 DOM 操作，请在内置或你自己的指令 JavaScript 代码中执行——不要在其他地方执行。\n- 将任何可复用的任务实现为服务，并使用依赖注入将它们添加到模块中。\n\
  - 确保 scope 反映模型的当前状态，并是视图所消费数据的唯一源。\n- 确保控制器代码仅起增强 scope 数据的作用，而不包含任何业务逻辑。\n- 在模块命名空间内定义控制器，而不是全局定义。这确保了你的应用程序可以被轻松打包，并防止全局命名空间过载。\n\
  \n### 将 AngularJS 与现有的 JavaScript 和 jQuery 集成\n\n\n\n\nAngularJS 基于 JavaScript 和\
  \ jQuery，这一事实使得人们很想尝试将其添加到到现有的应用程序中，以提供数据绑定或其他功能。这种方法几乎总是会导致难以维护的问题代码。然而，使用 AngularJS\
  \ 并不意味着你需要简单地抛弃现有的代码。通常情况下，你可以选择性地提取运行良好的 JavaScript/jQuery 组件，并将它们转换为指令（directives）或服务（services）。\n\
  \n这还引出了另一个问题：何时使用 jQuery 的完整版，而不是 AngularJS 提供的 jQuery 精量版（lite version）？我知道很多人对这两个方向都有强烈的见解。一方面，你希望保持实现尽可能清洁和简单。但另一方面，有时你可能需要只有\
  \ jQuery 完整版才具备的功能。我们的建议是视情况而定。如果你需要 AngularJS jQuery 精量版未提供的功能，请加载完整库。关于加载 jQuery\
  \ 而不是精量版的机制，将在本课稍后部分讨论。\n\n以下步骤提供了一种将 AngularJS 集成到你现有的 JavaScript 和 jQuery 应用程序中的方法：\n\
  \n1. 从头开始编写至少一个小型 AngularJS 应用，使用模型（model）、自定义 HTML 指令、服务和控制器。换句话说，在这个应用程序中，确保你对\
  \ AngularJS 的职责分离（separation of responsibilities）有了实际理解。\n2. 识别代码中的模型部分。具体来说，尝试将增强模型中数据的代码分离到控制器函数中，将访问后端模型数据的代码分离到服务中。\n\
  3. 识别视图中操作 DOM 元素的代码。尝试将 DOM 操作代码分离到定义良好的自定义指令组件，并为它们提供 HTML 指令。同时，识别任何 AngularJS\
  \ 已经提供内置支持的指令。\n4. 识别其他基于任务的函数并将它们分离到服务中。\n5. 将指令和控制器隔离到模块（modules）中以组织你的代码。\n6.\
  \ 使用依赖注入（dependency injection）恰当连接连接你的服务和模块。\n7. 更新 HTML 模板以使用新的指令。\n\n显然，在某些情况下，使用大量现有代码（如果有的话）是没有意义的。然而，通过执行上述步骤，你将进入使用\
  \ AngularJS 实现项目的设计阶段，然后做出明智的决定。\n\n### 在你的环境中添加 AngularJS\n\nAngularJS 是一个客户端 JavaScript\
  \ 库，这意味着要在你的环境中实现 AngularJS，你需要做的只需就是通过在 HTML 模板中使用 `<script>` 标签为客户端提供一种获取 `angular.js`\
  \ 库文件的方法。\n\n提供 `angular.js` 库的最简单方法是使用内容分发网络（CDN），它提供了从第三方下载库的 URL。这种方法的缺点是你必须依赖第三方来提供该库，如果客户端无法连接到该第三方\
  \ URL，你的应用程序将无法运行。例如，下面的 `<script>` 标签从 Google APIs CDN 加载 `angular.js` 库：\n\n```\n\
  <script src=\"https://ajax.googleapis.com/ajax/libs/angularjs/1.2.5/angular.min.js\"\
  ></script>\n```\n\n另一种提供 `angular.js` 库的方法是从 AngularJS 网站（`http://angularjs.org`）下载并使用你自己的\
  \ Web 服务器向客户端提供文件。这种方法需要更多努力，还需要你的 Web 服务器额外的带宽；但如果你想对客户端获取库的方式有更多控制，这可能是更好的选择。\n\
  \n### 在 HTML 文档中启动 AngularJS\n\n要在你的网页中实现 AngularJS，你需要对 HTML 文档进行启动（bootstrap）。启动包含两个部分：第一部分是用\
  \ `ng-app` 指令定义应用模块，第二部分是在 `<script>` 标签中加载 `angular.js` 库。\n\n`ng-app` 指令告诉 AngularJS\
  \ 编译器将该元素视为编译的根节点。`ng-app` 指令通常加载在 `<html>` 标签中，以确保整个网页包含在内；然而，你也可以将其添加到另一个容器元素，只有容器内部的元素会被包含在\
  \ AngularJS 编译中，从而在 AngularJS 应用功能中。\n\n可能的情况下，你应该将 `angular.js` 库作为 HTML `<body>`\
  \ 内部最后一个标签之一（如果不是最后一个标签的话）。当 `angular.js` 脚本加载时，编译器就会启动并开始寻找指令。最后加载 `angular.js`\
  \ 可以让网页加载更快。\n\n以下是在 HTML 文档中实现 `ng-app` 和 `angular.js` 启动的示例：\n\n```html\n<!doctype\
  \ html>\n<html ng-app=\"myApp\">\n  <body>\n    <script src=\"http://code.angularjs.org/1.3.8/angular.min.js\"\
  ></script>\n    <script src=\"/lib/myApp.js\"></script>\n  </body>\n</html>\n```\n\
  \n### 使用全局 API\n\n当你实现 AngularJS 应用程序时，你会发现有一些你需要经常执行的常用 JavaScript 任务，例如比较对象、深拷贝、遍历对象和转换\
  \ JSON 数据。AngularJS 在全局 API 中提供了许多此类基础功能。\n\n当 `angular.js` 库加载时，全局 API 是可用的，你可以通过使用\
  \ `angular` 对象访问它们。例如，创建一个名为 `myObj` 的对象的拷贝，你使用以下语法：\n\n```\nvar myCopy = angular.copy(myObj);\n\
  ```\n\n下面的代码展示了使用 `forEach()` 全局 API 遍历对象数组的示例：\n\n```javascript\nvar objArr = [{score:\
  \ 95}, {score: 98}, {score: 92}];\nvar scores = [];\nangular.forEach(objArr, function(value,\
  \ key){\n  this.push(key + '=' + value);\n}, scores);\n// scores == ['score=95',\
  \ 'score=98', 'score=92']\n```\n\n`表 20.1` 列出了全局 API 中提供的一些最实用程序。你将在本书的许多示例中看到它们。\n\
  \n**表 20.1 AngularJS 提供的有用全局 API 工具**\n\n### 动手实践：创建一个基础的 AngularJS 应用\n\n现在你已经理解了\
  \ AngularJS 框架中的基础组件、AngularJS 框架的意图和设计以及如何启动 AngularJS，你准备好开始实现一个 AngularJS 应用了。本节将引导你通过一个非常基础的\
  \ AngularJS 应用，它实现了 HTML 模板、AngularJS 模块、控制器、作用域（scope）和一个表达式。\n\n此示例的代码是一个 AngularJS\
  \ HTML 模板 `first.html` 和一个 AngularJS JavaScript 模块 `first.js`。以下步骤描述了为 AngularJS\
  \ 应用实现此代码的重要步骤。\n\n这些步骤中的每一个在随后的课程中都有更详细的描述，所以在这里不要纠结于细节。现在重要的是你理解实现模板、模块、控制器和作用域的过程以及它们通常是如何相互作用的：\n\
  \n1. 在 Eclipse 中，添加 `lesson20/first.html` 和 `lesson18/js/first.js` 文件。\n2. 在 `first.html`\
  \ 文件中，添加标准的网页元素 doctype, html, head 和 body。\n\n\n\n\n### 3. 接下来，你需要在 HTML 模板中加载库。添加列表\
  \ 20.1 中所示的以下行，加载 `angular.js` 库，然后加载 `first.js` JavaScript 自定义模块：\n\n点击此处查看代码图像\n\
  \n```\n<script src=\"http://code.angularjs.org/1.3.8/angular.min.js\"></script>\n\
  <script src=\"/js/first.js\"></script>\n```\n\n### 4. 下一步是在应用程序的根元素中定义 `ng-app`\
  \ 参数，以便 AngularJS 知道从哪里开始编译。添加列表 20.1 中所示的以下行，在 `<<html>` 元素中引导 AngularJS。注意 `ng-app`\
  \ 被分配了模块名 `firstApp`，这与列表 20.2 中所示的 JavaScript 代码中的模块相对应：\n\n```html\n<html ng-app=\"\
  firstApp\">\n```\n\n### 5. 在列表 20.2 中所示的 `first.js` 文件中添加以下行，以 `firstApp` 为名定义 AngularJS\
  \ 应用程序模块：\n\n点击此处查看代码图像\n\n```javascript\nvar firstApp = angular.module('firstApp',\
  \ []);\n```\n\n### 6. 为你想让 AngularJS 模块控制的 HTML 元素添加控制器。添加列表 20.1 中所示的以下行，为 `<div>`\
  \ 元素分配名为 `FirstController` 的控制器。这会将视图中的元素映射到特定的控制器，该控制器包含一个作用域（scope）：\n\n点击此处查看代码图像\n\
  \n```html\n<div ng-controller=\"FirstController\">\n```\n\n### 7. 通过添加列表 20.2 中所示的以下行在你的模块代码中定义控制器，在\
  \ `firstApp` 模块中定义 `FirstController`：\n\n点击此处查看代码图像\n\n```javascript\nfirstApp.controller('FirstController',\
  \ function($scope) {\n});\n```\n\n### 8. 定义控制器后，你可以实现 scope，这涉及到将 HTML 元素链接到作用域变量、初始化作用域中的变量，并提供处理作用域值更改的功能。在列表\
  \ 20.1 中添加以下行，使用 `ng-model` 指令定义两个 `<input>` 元素，将其绑定到作用域中的 `first` 和 `last` 值。当输入框的值改变时，作用域中\
  \ `first` 和 `last` 的值随之改变，反之亦然：\n\n点击此处查看代码图像\n\n```html\n<input type=\"text\" ng-model=\"\
  first\">\n<input type=\"text\" ng-model=\"last\">\n```\n\n### 9. 在列表 20.2 中添加以下行，定义作用域中\
  \ `first`、`last` 和 `heading` 的初始值：\n\n点击此处查看代码图像\n\n```javascript\n$scope.first\
  \ = 'Some';\n$scope.last = 'One';\n$scope.heading = 'Message: ';\n```\n\n### 10.\
  \ 添加以下行，将在 HTML 模板中定义一个按钮，该按钮使用 `ng-click` 将鼠标点击事件绑定到将在作用域中定义的 `updateMessage()`\
  \ 函数：\n\n点击此处查看代码图像\n\n```html\n<button ng-click='updateMessage()Message</button>\n\
  ```\n\n### 11. 在列表 20.2 中所示的控制器代码中添加以下行来定义 `updateMessage()` 函数。注意作用域中的变量 `message`\
  \ 被 设置为 `first` 和 `last` 值的组合：\n\n点击此处查看代码图像\n\n```javascript\n$scope.updateMessage\
  \ = function() {\n  $scope.message = 'Hello ' + $scope.first +' $scope.last + '!';\n\
  };\n```\n\n### 12. 在列表 20.1 中所示的模板文件中添加以下行，实现一个表达式，用于在 HTML 页面上显示作用域中 `heading`\
  \ 和 `message` 变量的值：\n\n```html\n{{heading + message}}\n```\n\n### 13. 现在，通过在需要启动\
  \ Web 服务器并在浏览器中加载 `first.html` 来测试 AngularJS 应用程序。你应该能够在文本框输入中输入字符串，然后点击 Message\
  \ 按钮并看到创建的动态消息。\n\n\n\n\n\n```html\n<script src=\"http://code.angularjs.org/1.3.8/angular.min.js\"\
  ></script>\n```\n\n## 顺带一提\n\n如果你决定在 AngularJS 中使用完整版本的 `jQuery`，请确保在 HTML 中将 `jQuery`\
  \ 库的 `<script>` 标签放在 AngularJS 库 `<script>` 标签之前。否则，AngularJS 将无法正确绑定到 `jQuery`\
  \ 库。\n\n无论加载的是 `jQuery` lite 还是完整的 `jQuery` 库，在 AngularJS 代码中通过 AngularJS 启动时可用的\
  \ `angular` 变量的 `element` 属性访问 jQuery。本质上，`angular.element` 将是 jQuery 应用程序中常用的 `jQuery`\
  \ 变量的别名。描述这种关系最佳方式之一如下：\n\n点击此处查看图片\n\n```\nangular.element() === jQuery() === $()\n\
  ```\n\n通常情况下，你会在 AngularJS 为你创建的 `jQuery` 对象中使用 `jQuery` 或 `jQuery` lite 功能。\n\n\
  例如，当你像本书后面稍后讨论的那样在 AngularJS 中创建指令（directive）时，一个元素会被传递给 `link` 函数。所示，该元素是一个 `jQuery`\
  \ 或 `jQuery` lite 对象，你可以相应地使用 `jQuery` 功能：\n\n点击此处查看图片\n\n```javascript\nangular.module('myApp',\
  \ [])\n  .directive('myDirective', function() {\n      . . .\n      link: function(scope,\
  \ elem, attrs, photosControl) {\n        //elem 是一个 jQuery lite 对象\n        elem.addClass(...);\n\
  \      }\n  };\n```\n\n另一个访问 `jQuery` 功能的示例是从在 AngularJS 绑定上触发的事件。例如，考虑以下代码，它使用\
  \ `ngClick` 绑定将 `<div>` 元素的浏览器点击事件绑定到 AngularJS 代码中的 `clicked()` 函数：\n\n点击此处查看图片\n\
  \n```html\n<div ng-click=\"clicked($event)\">Click Me</div\n```\n\n你可以使用以下 AngularJS\
  \ 代码访问对象的 `jQuery` 版本：\n\n点击此处查看图片\n\n```javascript\n$scope.clicked = function(event){\n\
  \  var jQueryElement = angular.element(event.target);\n};\n```\n\n注意，有必要使用 `angular.element()`\
  \ 方法将 `target` DOM 对象转换为 `jQuery` 对象。\n\n### 总结\n\nAngularJS 是一个 JavaScript 框架，提供了一种非常结构化的方法来创建网站和\
  \ Web 应用程序。AngularJS 将 Web 应用程序结构化为非常的 MVC 方法。AngularJS scope 为应用程序的数据模型提供上下文绑定，由基本的\
  \ JavaScript 对象组成。AngularJS 利用带有指令的模板来扩展 HTML 能力，让你能够实现完全自定义的 HTML 组件。\n\n在本节中，你看了\
  \ AngularJS 应用中不同的组件以及它们是如何相互作用的。你还学习了 AngularJS 应用的生命周期，它包括引导（bootstrap）、编译（compilation）和运行（runtime）阶段。在本节结束时，你通过了一个示例实现了一个基础的\
  \ AngularJS 应用，包括模板、模块、控制器和作用域。\n\n### 问答\n\n**Q。我可以去哪里学习更多关于开发 AngularJS 应用的内容？**\n\
  \n**A。** 位于 [`docs.angularjs.org/guide`](https://docs.angularjs.org/guide) 的 AngularJS\
  \ 开发者指南提供了关于 AngularJS 开发主题良好资源。\n\n**Q。有方法构建 AngularJS 应用的端端测试吗？**\n\n**A。** 你可以使用\
  \ Node.js 程序 `Protractor` 来运行端端测试。这在开发者指南的 [`docs.angularjs.org/guide/e2e-testing`](https://docs.angularjs.org/guide/e2e-testing)\
  \ 中描述。\n\n### 工作坊\n\n工作坊由一组问题和答案组成，旨在巩固你对本小时涵盖内容的理解。在查看答案之前尝试回答问题。\n\n#### 测验\n\n\
  **1。** 使用完整版本的 `jQuery` 时，`jQuery` 库应该在 AngularJS 库之前还是之后加载？\n\n**2。** AngularJS\
  \ 生命周期的三个阶段是什么？\n\n**3。** 全局 API 何时变得可用？\n\n**4。** 使用哪个 AngularJS 指令在 HTML 文件中引导\
  \ AngularJS 应用的应用？\n\n#### 测验答案\n\n**1。** 在 AngularJS 库之前。\n\n**2。** 引导（Bootstrapping）、编译（Compilation）和运行数据（Runtime\
  \ Data）。\n\n**3。** 当 AngularJS 库加载时。\n\n**4。** `ng-app`\n\n#### 练习\n\n**1.** 访问\
  \ [`docs.angularjs.org/api`](https://docs.angularjs.org/api) 查看当前文档，并审查一些全局函数，例如\
  \ `angular.copy` 和 `angular.element`。\n\n**2.** 访问 [`code.angularjs.org/`](https://code.angularjs.org/)\
  \ 查看 AngularJS 版本的索引，以便查看哪些版本是最新版本并知道在哪里加载它们。\n\n\n\n\n\n# 简介\n\n依赖注入（Dependency\
  \ injection）可能是一个难以理解的概念。然而，它是 AngularJS 中非常重要的一部分，在你理解了基础之后，AngularJS 的实现就会变得非常清晰。依赖注入是大多数服务端语言中一种的设计模式，但在\
  \ AngularJS 之前，它尚未广泛应用于 JavaScript 框架。\n\nAngularJS 依赖注入的想法是定义并动态地将依赖对象注入到另一个对象中，可以使用该依赖对象提供的所有功能。\n\
  \n我喜欢用来类比依赖注入的例子是“虚拟房间”。如果你只想创建一个虚拟房间，你会定义四面墙、一个地板和一个天花板作为基础。然而，这个房间对于大多数用途来说功能性并不强。如果你想让房间变成餐厅，你需要一张桌子和餐椅；但如果你想让房间变成客厅，你可能需要一个沙发和电视。\n\
  \n因此，在虚拟世界中，你会定义一种创建沙发、餐椅、餐桌、电视、灯、画、边几等的方法。请记住，这仅仅是创建这些对象的方法，而不是沙发或桌对象的实际实例。\n\n\
  然后，依赖注入允许你轻松定义你可能需要的任何类型的房间，只需说明在创建房间时应该将哪些类型的对象注入到房间中。\n\n例如，你可以定义类似 `LivingRoom`\
  \ 等于 `[sofa, table, TV]` 并注入到 `Room` 中。这只是一个定义，在你创建实例 `LivingRoom` 之前，不存在 `Room`、`sofa`、`table`\
  \ 或 `TV` 的实例；在此时，`sofa`、`table` 和 `TV` 对象将被创建并自动注入到新创建的 `LivingRoom` 中，以提供你坐下看虚拟电影所需的客厅功能。\n\
  \nAngularJS 通过提供者（providers）和注入器服务（injector service）提供依赖注入。提供者定义如何创建具有特定功能的注入对象。注入器服务创建注入对象的实例，并使其在使用它们的新创建对象可用。\n\
  \n## 提供者 (Providers)\n\n提供者本质上是如何创建一个具有所有必要功能的对象的定义。提供者应该作为 AngularJS 模块（module）的一部分定义。模块将提供者注册到注入器服务器。在\
  \ AngularJS 中，提供者的对象只会创建一个实例。\n\n## 注入器 (Injectors)\n\n注入器服务负责跟踪提供对象的实例。为每个注册了提供者的模块都会创建一个注入器服务实例。\n\
  \n当创建一个需要提供者的对象时，会针对提供者对象的实例发出依赖请求。注入器服务首先检查注入器缓存中是否已存在实例。如果是，则返回该实例。如果在缓存中没有找到实例，则将使用提供者定义创建一个新实例；将其存储在缓存中，然后返回。\n\
  \n## 定义 AngularJS 模块对象\n\n创建 AngularJS 模块是一个简单的过程，涉及调用 `angular.module()` 方法。该方法创建一个\
  \ `Module` 对象的实例，将其注册到注入器服务中，然后返回新创建的 `Module` 对象的实例，你可以使用该实例来实现提供者功能。`angular.module()`\
  \ 方法使用以下语法：\n\n点击此处查看代码图片\n\n```\nangular.module(name, [requires], [configFn])\n\
  ```\n\n`name` 参数是模块在注入器服务中注册的名称。`requires` 参数是一个模块名称数组，这些模块被添加到注入器服务中供该模块使用。如果你需要另一个模块的功能，你需要在\
  \ `requires` 列表中添加它。默认情况下，`ng`模块会自动添加到每个实例化的模块中，因此你无需在列表中显式指定 `ng` 即可访问 AngularJS\
  \ 提供者。\n\n所有依赖的实例都会自动注入到模块的实例中。依赖可以是模块、服务以及注入器服务中注册的任何其他对象。`configFn` 参数是另一个在模块配置阶段调用的函数。配置函数将在下一节中描述。\n\
  \n以下是一个创建一个依赖 `$window` 和 `$http` 服务的 AngularJS 模块的示例。该定义还包含一个配置函数，它添加了一个名为 `myValue`\
  \ 的 `value` 提供者：\n\n点击此处查看代码图片\n\n```javascript\nvar myModule = angular.module('myModule',\
  \ ['$window', '$http'], function(){\n    $provide.value('myValue', 'Some Value');\n\
  });\n```\n\n如果你没有指定 `requires` 参数，返回的不是 `Module` 对象，而是已经创建的实例。例如，以下代码将覆盖之前定义的实例：\n\
  \n点击此处查看代码图片\n\n```javascript\nvar myModule2 = angular.module('myModule', []);\n\
  ```\n\n然而，以下代码将返回之前创建的实例，因为参数列表 `require` 数组中没有列出依赖：\n\n点击此处查看代码图片\n\n```javascript\n\
  var myModule3 = angular.module('myModule');\n```\n\n## 在 AngularJS 模块中创建提供者\n\n\
  AngularJS 为各种对象和服务提供了许多内置提供者。例如，`$window` 服务有一个提供者，用于构建 AngularJS 服务对象，让你能够与 JavaScript\
  \ 中底层的 `Window` 对象进行交互。除了这些提供者，你还可以创建自己的提供者，将功能注入到 AngularJS 组件中。\n\n`Module` 对象提供了几个辅助方法，作为使用\
  \ `config()` 方法的替代方案来添加提供者。这些方法更简单，代码也更清晰。你可以向 AngularJS 模块添加两种类型的提供者对象。这些方法都接受两个参数：注册到依赖注入器的名称以及定义如何构建特定对象的提供函数。后续章节将详细介绍这些方法。\n\
  \n### 特定的 AngularJS 对象提供者\n\n`Module` 对象提供了特殊的构造方法，用于为你在模块中实现的 AngularJS 对象添加提供者。这些特殊方法允许你为以下类型的对象添加定义：\n\
  \n![Image](img/0067.jpeg) `animation(name, animationFactory)`\n\n![Image](img/0067.jpeg)\
  \ `controller(name, controllerFactory)`\n\n![Image](img/0067.jpeg) `filter(name,\
  \ filterFactory)`\n\n![Image](img/0067.jpeg) `directive(name, directiveFactory)`\n\
  \n这些是特殊方法，是因为 AngularJS 中为这些提供者方法了对应的 `animation`、`controller`、`filter` 和 `directive`\
  \ 对象。\n\n这些每个对象将在后的课程中进行详细介绍。现在，让我们看一下基础控制器的定义：\n\n点击此处查看代码图片\n\n```javascript\n\
  var mod = angular.module('myMod', []);\n\nmod.controller('myController', function($scope)\
  \ {\n    $scope.someValue = 'Some Value';\n});\n```\n\n创建一个名为 `mod` 的简单模块，然后调用 `controller()`\
  \ 方法并传入 `myController` 以及一个 `controllerFactory` 函数。`controllerFactory` 函数接受 `$scope`\
  \ 变量作为参数。这是因为 AngularJS 有内置的控制器对象，并且知道所有控制器对象都必须接收作用域对象作为第一个参数。\n\n\n\n\n\n服务提供者（service\
  \ providers）是一个特殊的供应商类别，因为对于生成的提供者对象还没有特定的格式。相反，提供者作为一种服务来提供功能。AngularJS 为构建服务提供了一些特定的创建方法，并通过以下方法将它们暴露：\n\
  \n![Image](img/image00767.jpeg) `value(name, object)`：这是所有提供者中最基础的。`object` 参数被简单赋值给\
  \ `name`，因此注入器（injector）中的 `name` 值与 `object` 值之间存在直接对应关系。\n\n![Image](img/image00767.jpeg)\
  \ `constant(name, object)`：这与 `value()` 方法类似，但值是不可更改的。此外，`constant()` 方法会在其他提供方法之前应用。\n\
  \n![Image](img/image00767.jpeg) `factory(name, factoryFunction)`：此方法使用 `factoryFunction`\
  \ 参数来构建一个由注入器提供的对象。\n\n![Image](img/image00767.jpeg) `service(name, serviceFactory)`：此方法为提供者对象增加了实现更面向对象的方法的概念。AngularJS\
  \ 的许多内置功能都是通过服务提供者提供的。\n\n![Image](img/image00767.jpeg) `provider(name, providerFactory)`：此方法是所有其他方法的核心。虽然它提供了最多的功能，但并不常用，因为其他方法更简单。\n\
  \n随后的课程将更详细地介绍这些对象。现在，这里有一些基础 `value` 和 `constant` 定义的快速示例：\n\n点击此处查看代码图片\n\n```\n\
  var mod = angular.module('myMod', []);\n\nmod.constant(\"cID\", \"ABC\");\n\nmod.value('counter',\
  \ 0);\n\nmod.value('image', {name:'box.jpg', height:12, width:20});\n```\n\n创建了一个名为\
  \ `mod` 的简单模块，然后定义了 `constant()` 和两个 `value()` 提供者。在这些方法中定义的值注册在 `myMod` 模块的注入器服务器中，然后可以通过名称进行访问。\n\
  \n### 实现提供者和依赖注入\n\n在定义模块和适当的提供者之后，你可以将该模块作为依赖项添加到其他模块、控制器以及各种其他 AngularJS 对象中。你可以设置依赖于提供者的对象的\
  \ `$inject` 属性值。`$inject` 属性包含一个应该注入到它的提供者名称数组。\n\n例如，下面的代码定义了一个接受 `$scope` 和 `appMsg`\
  \ 参数的基础基础控制器。然后将 `$inject` 属性设置为一个包含 `$scope` 的数组，`$scope` 是 AngularJS 作用域服务，提供对作用域和自定义\
  \ `appMsg` 的访问。`$scope` 和 `appMsg` 都被注入到 `myController` 函数中：\n\n点击此处查看代码图片\n\n```javascript\n\
  var myController = function($scope, appMsg) {\n\n  $scope.message = appMsg;\n};\n\
  \ncontroller['$inject'] = ['$scope', 'appMsg'];\n\nmyApp.myController('controllerA',\
  \ controller);\n```\n\n当你实现某些对象时，这种方法可能会变得笨拙，因此 AngularJS 还提供了一种更优雅的方法来注入依赖项，使用以下语法代替常规的构造函数：\n\
  \n点击此处查看代码图片\n\n```\n[providerA, providerB, . . ., function(objectA, objectB, .\
  \ . .) {} ]\n```\n\n例如，前面的代码也可以这样写成：\n\n点击此处查看代码图片\n\n```javascript\nmyApp.controller('controllerA',\
  \ ['$scope', 'appMsg', function($scope, appMsg) {\n\n  $scope.message = appMsg;\n\
  \n}]);\n```\n\n在继续之前，理解依赖注入至关重要，因此接下来的章节提供了在 AngularJS 应用中实现依赖注入的示例代码列表。\n\n***\n\
  \n### 动手尝试：将内置提供者注入到控制器中\n\n在本节中，你将学习如何将 AngularJS 内置的一些提供者注入到你的控制器中。列表 21.1 所示的代码实现了一个注入了\
  \ `$scope` 和 `$window` 提供者的基础控制器。列表 22.2 中的代码显示了加载 AngularJS 应用程序的 HTML 模板。\n\n\
  以下描述了使用依赖注入将 AngularJS 提供者的功能添加到控制器的重要方面：\n\n**1.** 添加 `lesson21/inject_builtin.html`\
  \ 和 `lesson21/js/inject_builtin.js` 文件。\n\n**2.** 将 列表 21.1 和 列表 21.2 所示的代码添加到 HTML\
  \ 和 JavaScript 文件中。\n\n**3.** 以下几行代码定义了一个使用 AngularJS 内置的 `$scope` 和 `$window` 提供者的控制器。注意在\
  \ `function()` 定义中，参数名也是 `$scope` 和 `$window`。这并不是必要的，但它可能会让代码更容易理解：\n\n点击此处查看代码图片\n\
  \n```javascript\n02 mod.controller('controllerA', '$scope', '$window',\n```\n\n\
  ```javascript\n03   function($scope, $window) {\n```\n\n**4.** [列表 21.1 中的以下行代码使用由\
  \ `$scope` 提供者创建的 `$scope` 在作用域中设置值：\n\n```javascript\n04   $scope.message = \"\
  My Module Loaded!\";\n```\n\n**5.** 列表 22.2 中的代码使用注入到控制器的 `$window` 显示警告：\n\n```javascript\n\
  05   $window.alert($scope.message);\n```\n\n**6.** 当你在浏览器中加载 `inject_builtin.html`\
  \ 时，你应该看到一个类似于 图 21.1 带有警告的页面。\n\n![Image](img/image094.jpeg)\n\n**图 21.1** 注入 `$window`\
  \ 服务\n\n**列表 21.1** `inject_builtin.js` 在控制器中实现依赖注入\n\n```javascript\n01 mod = angular.module('myMod',\
  \ []);\n02 mod.controller('controllerA', ['$scope', '$window',\n03   function($scope,\
  \ $window) {\n04   $scope.message = \"My Module Loaded!\";\n05   $window.alert($scope.message);\n\
  06 }]);\n```\n\n**列表 21.2** `inject_builtin.html` 使用 HTML 代码实现 AngularJS 模块\n\n\
  ```html\n01 <!doctype html>\n02 <html ng-app=\"myApp\">\n03  <head>\n04    <title>AngularJS\
  \ Dependency Injection</title>\n05  </head>\n06  <body>\n07    <div ng-controller=\"\
  controllerA\">\n08      <h2>This Page has an Alert</h2>\n09    </div><hr>\n10  \
  \  <script src=\"http://code.angularjs.org/1.3.8/angular.min.js\"></script>\n11\
  \    <script src=\"js/inject_builtin.js\"></script>\n12  </body>\n13 </html>\n```\n\
  \n\n\n\n\n### 3. 下面代码定义了 `myMod` 模块：\n\n点击此处查看代码图像\n\n```javascript\n01 var myMod\
  \ = angular.module('myMod', []);\n```\n\n### 4. 下面行代码为 `myMod` 定义了一个名为 `modMsg`\
  \ 的值提供者（value provider），包含一个简单的字符串：\n\n点击此处查看代码图像\n\n```javascript\n02 myMod.value('modMsg',\
  \ 'Hello from My Module');\n```\n\n### 5. 下面几行代码定义了 `controllerB`，并将 `$scope` 和\
  \ `modMsg` 提供者注入其中，然后设置了将在模板中显示的 `message` 的值：\n\n点击此处查看代码图像\n\n```javascript\n\
  03 myMod.controller('controllerB', ['$scope', 'modMsg',\n04                    \
  \           function($scope, msg) {\n05    $scope.message = msg;\n06 }]);\n```\n\
  \n### 6. 然后，下行代码定义了 `myApp`，并将 `myMod` 作为可注入的提供者。其余行与前面步骤定义的 `value` 提供者和控制器的定义类似：\n\
  \n点击此处查看代码图像\n\n```javascript\n07 var myApp = angular.module('myApp', ['myMod']);\n\
  ```\n\n### 7. 注意列表 21.4 中的后续几行，只有 `myApp` 模块被引导（bootstrapped），但来自 `myMod` 的 `controllerB`\
  \ 能够可以使用，因为它被注入了 `myApp` 中：\n\n点击此处查看代码图像\n\n```html\n02 <html ng-app=\"myApp\"\
  >\n. . .\n07      <div ng-controller=\"controllerA\">\n. . .\n11      <div ng-controller=\"\
  controllerB\">\n```\n\n### 8. 图 21.2 显示了生成的网页，每个模块的控制器都显示了不同的消息。\n\n![Image](img/image00995.jpeg)\n\
  \n**图 21.2** 实现依赖注入以为模块和控制器提供额外功能。\n\n**列表 21.3 inject_custom.js 在控制器和模块定义中实现依赖注入**\n\
  \n点击此处查看代码图像\n\n```javascript\n01 var myMod = angular.module('myMod', []);\n02 myMod.value('modMsg',\
  \ 'Hello from My Module');\n03 myMod.controller('controllerB', ['$scope', 'modMsg',\n\
  04                               function($scope, msg) {\n05    $scope.message =\
  \ msg;\n06 }]);\n07 var myApp = angular.module('myApp', ['myMod']);\n08 myApp.value('appMsg',\
  \ 'Hello from My App');\n09 myApp.controller('controllerA', ['$scope', 'appMsg',\n\
  10                                   function($scope, msg) {\n11    $scope.message\
  \ = msg;\n12 }]);\n```\n\n**列表 21.4 inject_custom.html 使用 HTML 代码实现依赖于另一个模块的 AngularJS\
  \ 模块**\n\n点击此处查看代码图像\n\n```html\n01 <!doctype html>\n02 <html ng-app=\"myApp\">\n\
  03    <head>\n04      <title>AngularJS Dependency Injection</title>\n05    </head>\n\
  06    <body>\n07      <div ng-controller=\"controllerA\">\n08          <h2>Application\
  \ Message:</h2> <!-- 此处修复了闭标签错误 -->\n09          {{message}}\n10      </div><hr>\n\
  11      <div ng-controller=\"controllerB\">\n12          <h2>Module Message:</h2>\n\
  13          {{message}}\n14      </div>\n15      <script src=\"http://code.angularjs.org/1.3.8/angular.min.js\"\
  ></script>\n16      <script src=\"/js/injector_custom.js\"></script>\n17 </body>\n\
  18</html>\n```\n\n***\n\n### 配置块与运行块（Configuration and Run Blocks）\n\n现在你已经理解了模块和依赖注入之间的关系，你需要查看实现\
  \ AngularJS 模块的过程。AngularJS 模块的实现分为阶段：配置阶段（configuration phase）和运行阶段（run phase）。接下来的章节将讨论这些阶段以及向模块添加提供者的基本过程。\n\
  \n#### 添加配置块\n\nAngularJS 模块的配置阶段在定义模块时执行。在此阶段，任何定义的提供者都会注册到依赖注入器中。你只应该在配置块内部放置配置代码和提供者代码。\n\
  \n你通过在 `Module` 对象的实例上调用 `config()` 方法来实现配置块，使用以下语法：\n\n点击此处查看代码图像\n\n```javascript\n\
  config(function([injectable, . .]))\n```\n\n传入一个带有可注入参数的函数。可注入参数通常是提供者服务，例如 `$provide`。\n\
  \n以下是基础配置块的示例：\n\n点击此处查看代码图像\n\n```javascript\nvar myModule = angular.module('myModule',\
  \ []).\nconfig(function($provide, $filterProvider) {\n  $provide.value(\"startTime\"\
  , new Date());\n  $filterProvider.register('myFilter', function(){});\n});\n```\n\
  \n注意 `$provide` 和 `$filterProvider` 服务被传递到了 `config` 函数。它们被用于向注入器注册一个名为 `startTime`\
  \ 的值提供者和一个名为 `myFilter` 的过滤器提供者。\n\n#### 添加运行块\n\n在整个配置块完成后，AngularJS 模块的运行阶段就可以执行。在此阶段，你可以实现实例化模块所需的任何代码。你不能在运行块期间实现任何提供者代码，因为到此时，整个模块应该已经配置完毕并注册到依赖注入器中。\n\
  \n运行块是放置需要在应用程序根级别执行的事件处理程序的好地方（例如，身份验证处理程序）。\n\n你通过调用 `Module` 对象的 `run()` 方法来实现\
  \ `run` 块，使用以下语法：\n\n点击此处查看代码图像\n\n```javascript\nrun(function([injectable, . .]))\n\
  ```\n\n传入一个带有可注入参数的函数。可注入参数应该是已经配置完成的实例。\n\n以下是 `run` 块的基础实现：\n\n点击此处查看代码图像\n\n\
  ```javascript\nmyModule.run(function(startTime) {\n  startTime.setTime((new Date()).getTime());\n\
  });\n```\n\n注意在 `config()` 部分中定义的 `startTime` 实例被传递到了 `run()` 函数。\n\n***\n\n###\
