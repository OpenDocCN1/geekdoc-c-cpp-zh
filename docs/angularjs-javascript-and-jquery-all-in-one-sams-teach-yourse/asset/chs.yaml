  img:hover{\n  cursor:move; }\n```\n\n### 使用 Droppable 组件创建投放目标\n\n`droppable` 组件通过\
  \ `draggable` 项目将元素定义为有效的投放容器。这允许你使用简单的鼠标控制提供元素之间的交互。`droppable` 组件允许你指定一个 `accept`\
