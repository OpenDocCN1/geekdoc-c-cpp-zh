  \ left:130px; top:30px; }\n```\n\n## 动手尝试：为动画添加效果\n\njQuery UI 中新的缓动功能也可以应用于 jQuery\
  \ 的 `.animation()` 方法。使用不同的 `easing`，你可以通过改变过渡发生的速率来改变动画的效果。这种方法的一个最佳示例是在一个改变元素位置的动画上应用弹跳（bounce）过渡。\n\
  \n通过示例来说说明是最好的方法。在这个示例中，你对图像的移动应用了多个动画效果。该图像是一个简单的球，点击它时它会在屏幕上移动。在最终位置，球会撞击一针并使用\
  \ `explode` 效果进行“炸裂”。该示例的目的是让你看到效果是如何应用于动画过程的。\n\n示例代码位于 列表 17.10、17.11 和 17.12。请使用以下步骤创建动态网页：\n\
  \n**1.** 在 Eclipse 中，添加 `lesson17/animation_effects.html`、`lesson17/js/animation_effects.js`\
