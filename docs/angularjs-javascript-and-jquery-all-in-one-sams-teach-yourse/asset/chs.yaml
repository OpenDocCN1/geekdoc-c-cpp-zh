  ></script>\n<script src=\"js/directive_custom_dom.js\"></script>\n```\n\n## 动手试一试：在自定义指令中实现事件处理器\n\
  \n自定义指令的另一个常见用途是实现事件处理器，以与自定义元素中发生的鼠标和键盘事件交互。这允许你为自定义元素提供增强的用户交互。\n\n在例示例中，你添加了鼠标事件处理器，允许你通过对图片进行拖放操作来调整大小和透明度。当鼠标向左拖动时，图片缩小；向右移动时，图片放大；向上移动时，图片变淡；向下移动时，透明度增加。为了这个示例，我在\
  \ AngularJS 模板中加载了完整版本的 jQuery。我之所以这样做是为了使用一些 jQuery lite 版本不具备的功能，例如获取图片的 `width()`。\n\
  \n请按照以下步骤使用操作 DOM 的自定义指令来构建此应用程序：\n\n1. **添加** `lesson25/directive_custom_zoom.html`\
  \ 和 `lesson25/js/directive_custom_zoom.js` 文件。\n2. **将** [代码列表 25.3] 和 [代码列表 25.4]\
  \ 所示的代码添加到 HTML 和 JavaScript 文件中。\n3. [代码列表 25.3] 的以下行代码定义了一个包含两个指令 `zoomit` 和 `fadit`\
  \ 的简单应用程序：\n\n```javascript\nangular.module('myApp', [])\n.directive('zoomit', function()\
  \ {\n  return {\n    link: function (scope, elem, attr){\n// . .\n    }\n})\n.directive('fadeit',\
  \ function() {\n  return {\n    link: function (scope, elem, attr){\n// . .\n  \
  \  }\n  };\n});\n```\n\n4. 第一个指令 `zoomit` 的 `link` 函数中的以下行监听了 `mousedown`、`mouseup`、`mouseleave`\
  \ 和 `mousemove` 事件。当按下鼠标按钮时，`dragging` 变量被设置为 `true`；当释放鼠标或鼠标离开元素时，`dragging` 被设置为\
  \ `false`。另注意，在 `mousedown` 中，默认事件行为被 `event.preventDefault()` 抑制了。这是为了消除拖拽时与浏览器默认行为的任何交互冲突：\n\
  \n```javascript\nelem.on('mouseup', function(){\n  dragging = false;\n});\nelem.on('mouseleave',\
  \ function(){\n  dragging = false;\n});\n```\n\n5. 在 `zoomit` 的以下行中，定义了一个 `mousemove`\
  \ 处理器来确定鼠标位置并递增或减少图片尺寸。注意，由于加载了完整版本的 jQuery，你可以使用 `width()` 和 `height()` 函数来获取和设置图片的尺寸：\n\
  \n```javascript\nelem.on('mousemove', function(event){\n  if(dragging){\n    var\
  \ adjustment = null;\n    if ( event.screenX > lastX+tolerance && elem.width() <\
  \ 300){\n      adjustment = 1.1;\n    } else if ( event.screenX < lastX-tolerance\
  \ && elem.width() > 100){\n      adjustment = .9;\n    }\n    if(adjustment){\n\
  \      //requires jQuery library\n      elem.width(elem.width()*adjustment);\n \
  \     elem.height(elem.height()*adjustment);\n      lastX = event.screenX;\n   \
  \ }\n  }\n});\n```\n\n6. **查看 `fadeit` 指令**，你可以发现它与 `zoomit` 指令非常相似，区别在于改变了图片的 `opacity`\
  \ 值。\n7. `fadeit` 和 `zoomit` 指令被用于 [代码列表 25.4] 所示的 AngularJS 模板中的以下 `<img>` 元素上。注意在第一张图片上添加了\
  \ `zoomit` 指令，在第二张图片上添加了 `fadeit` 指令，而在最后一张图片上两者都添加了。这向你说明同一个元素可以添加多个自定义指令：\n\n\
