  \ -webkit-linear-gradient(top, #2244ff 0%, #AACCFF 85%, #0022ff 100%);\n  background-image:\
  \ -ms-linear-gradient(top, #2244ff 0%, #AACCFF 85%, #0022ff 100%);\n  font:20px\
  \ bold;\n  cursor:pointer;\n}\n.active{ border:5px groove; }\n#docMenu span{ display:block;\
  \ margin-top:1px; }\n#content, iframe{\n  display:inline-block;\n  width:700px;\
  \ height:500px;\n}\n#container{ width:800px; background-color:#C0C0C0}\n#docMenu{\n\
  \  position:fixed; right:60px; top:60px;\n}\n#content{\n  padding:2px;\n  color:blue;\n\
  \  font-size:20px;\n}\n```\n\n### 动态重新排列页面元素\n\n你可以对网页执行的最酷的交互之一是根据用户交互重新排列元素。例如，你可以让元素变大或变小，或者改变位置。这些内容在本节的第一部分作为获取和设置元素属性时的一部分已经涵盖了。本节在此概念的基础上进一步扩展，讨论了使用\
  \ `z-index` 为页面元素定位的方法；然后通过一个示例展示了重新排列元素的不同方法。\n\n#### 调整 z-index\n\n`z-index` 是一种\
  \ CSS 属性，用于指定 HTML 元素相对于其他元素的位置，不是垂直或水平方向，而是向用户投影的，就像屏幕上堆叠在另一个之上的纸一样。当浏览器渲染页面时，`z-index`\
  \ 最高的元素显示在其他元素的上方。\n\n在 jQuery 中获取和设置 `z-index`，请使用 `.css()` 方法。例如，获取某个项目的 `z-index`，请使用以下代码：\n\
  \n点击此处查看代码图像\n\n```javascript\nvar zIndex = $(\"#item\").css(\"z-index\");\n```\n\
  \n将某个项目的 `z-index` 设置为 10，请使用以下语句：\n\n点击此处查看代码图像\n\n```javascript\n$(\"#item\").css(\"\
  z-index\", \"10\");\n```\n\n### 动手尝试：动态重新排列页面元素\n\n在这个示例中，你将学习使用 jQuery 和 JavaScript\
  \ 移动、调整大小和重新排列图像。你使用图像是因为它们是常用的重新排列元素之一。你可以将这些原理应用于任何 HTML 元素。示例代码显示在列表 10.7、10.8\
  \ 和 10.9 中。使用以下步骤实现示例：\n\n1. 在 Eclipse 中，创建 `lesson10/rearranging_elements.html`、`lesson10/js/rearranging_elements.js`\
  \ 和 `lesson10/css/rearranging_elements.css` 文件。\n2. 在 HTML 文件中添加列表 10.7 所示的代码。你应该识别出\
  \ `<span>` 元素。\n3. 在 CSS 文件中添加列表 10.8 所示的代码。此代码为图像设置了样式。\n4. 打开 `rearranging_elements.js`\
  \ 文件并添加以下全局定义，它们将稍后用于平铺和堆叠图像，以及当前图像的 `z-index`：\n\n```javascript\nvar startX = startY\
  \ = 60;\nvar topIndex, maxIndex;\n```\n5. 添加以下 `load()` 函数。第 3 和 4 行设置当前索引和最大索引为文件数量减\
  \ 1 以使其从零开始。第 6-12 行为每个按钮添加了点击处理器：\n\n点击此处查看代码图像\n\n```javascript\n$(window).load(function(){\n\
  \  topIndex = $(\".photo\").length-1;\n  maxIndex = topIndex;\n  $(\"#right\").click(function(e){move(e,\
  \ \"right\");});\n  $(\"#left\").click(function(e){move(e, \"left\");});\n  $(\"\
  #bigger\").click(function(e){resize(e, \"bigger\");});\n  $(\"#smaller\").click(function(e){resize(e,\
  \ \"smaller\");});\n  $(\"#stack\").click(stack);\n  $(\"#tile\").click(tile);\n\
  \  $(\"#flip\").click(flip);\n  stack();\n});\n```\n\n#### 注意\n\n你将需要 `$(window.load()`\
  \ 事件处理器而不是 `$(document).ready()`，以便在运行 `stack()` 函数之前已加载图像。\n\n6. 添加以下 resize 处理器，它接受一个方向并使用该值通过调整\
  \ `width()` 方法放大或缩小图像。注意 `topIndex` 变量用于确定要调整哪个图像：\n\n点击此处查看代码图像\n\n```javascript\n\
  function resize(e, direction){\n  var img = $(\"img:eq(\" + topIndex + \")\");\n\
  \  if (direction == \"bigger\"){ img.width(img.width()+20); }\n  else { img.width(img.width()-20);\
  \ }\n}\n```\n\n7. 添加以下 move 处理器，根据方向参数调整图像的 `offset()`。同时 `startX` 和 `startY` 也调整到新位置：\n\
  \n点击此处查看代码图像\n\n```javascript\nfunction move(e, direction){\n  var img = $(\"img:eq(\"\
  \ + topIndex + \")\");\n  var pos = img.offset();\n  if (direction == \"right\"\
  ){ pos.left += 10;}\n  else {pos.left -= 10;}\n  img.offset(pos);\n  startX = pos.left;\n\
  \  startY = pos.top;\n}\n```\n\n\n\n\n\n### 8. 添加以下 `stack()` 函数，该函数遍历所有的 `.photo`\
  \ 元素并在每次迭代中通过调整 `top` 和 `left` 偏移值将它们堆叠：\n\n点击此处查看代码图片\n\n```javascript\nfunction\
  \ stack(){\n    var x = startX,  y = startY;\n    $(\".photo\").each(function(indx){\n\
  \      $(this).offset({ top:y, left:x });\n      x += 20;\n      y += 20;\n    });\n\
  }\n```\n\n### 9. 添加以下 `tile()` 函数，该函数也会遍历所有的 `.photo` 元素并将它们并排放置，如果当前组超过了 400 像素，则换到下一行。注意，我在每次迭代中使用了几个变量来跟踪最大高度以及当前的\
  \ `x` 和 `y` 坐标：\n\n点击此处查看代码图片\n\n```javascript\nfunction tile(){\n    var x = startX,\
  \ y = currTop = startY;\n    var maxH = 0;\n    $(\".photo\").each(function(indx){\n\
  \      maxH = Math.max(maxH, $(this).outerHeight());\n      $(this).offset({ top:y,\
  \ left:x });\n      x += $(this).outerWidth();\n      if (x > 400){\n        y =\
  \ currTop + maxH;\n        x = startX;\n        maxH = 0;\n      }\n    });\n}\n\
  ```\n\n### 10. 添加 `flip()` 函数，它将调整 `z-index`，以便当图像相互叠时，你可以更改哪一个在上面：\n\n点击此处查看代码图片\n\
  \n```javascript\nfunction flip(){\n    topIndex++;\n    if (topIndex > $(\".photo\"\
  ).length-1){ topIndex=0; }\n    $(\".photo\").each(function(indx){\n      if (indx\
  \ <= topIndex){ z = maxIndex - (topIndex - indx); }\n      else { var z = indx -\
  \ topIndex - 1; }\n      $(this).css(\"z-index\", z);\n    });\n}\n```\n\n### 11.\
  \ 保存所有三个文件，然后在网络浏览器中打开 HTML 文档，如图图 10.3 所示。尝试操作按钮，观察图像的交互如何与点击处理函数实现的重新排列相匹配。\n\n\
