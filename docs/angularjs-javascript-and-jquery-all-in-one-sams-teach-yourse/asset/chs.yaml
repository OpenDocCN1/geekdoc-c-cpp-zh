  \n当尝试向用户展示大量选项时，树视图是最有组件之一。这就是为什么树视图在许多地方被使用。几乎所有用户在某种程度上都熟悉它们，因为它是操作系统显示文件和文件夹时最常用的元素。使用\
  \ `jQuery` 和 `JavaScript` 实现树视图非常简单。网页中树视图非常酷的一点在于它们可以包含任何你想显示的内容。本节将带你通过 `jQuery`\
  \ 和 `JavaScript` 实现树视图。\n\n* * *\n\n### 动手尝试：带有展开折叠功能的动态树视图\n\n该练习目的是让你实现具有不同类型的树视图。树中的每个节点由一系列元素组成：\n\
  \n点击此处查看代码图片\n\n```html\n<div class=\"tree\">\n  <span></span>\n  <label></label>\n\
  \  <div class=\"content\"></div>\n  <div class=\"tree\">更多子元素</div>\n</div>\n```\n\
  \n`<span>`元素用于显示折叠或展开的图像。`<label>`元素显示展开/折叠按钮旁文本。`<div class=\"content\">`元素可以包含任何你想包含的内容。你还可以添加额外的`<div\
  \ class=\"tree\">`元素作为子节点。\n\n示例代码位于列表 14.7、14.8 和 14.9。使用以下步骤创建动态网页：\n\n1. 在 Eclipse\
  \ 中添加 `lesson14/dynamic_tree.html`、`lesson14/js/dynamic_tree.js` 和 `lesson14/css/dynamic_tree.css`\
  \ 文件。\n2. 将代码列表 14.7 和 14.9 中的代码添加到 HTML 和 CSS 文件。\n3. 打开 `dynamic_tree.js` 并添加以下\
  \ `.ready()` 函数。添加列表 14.8 所示的 `addLevels()`、`getRandomItem()` 和 `randInt()` 函数。这用于用随机项目填充树。这显示内容可以是异质的：\n\
  \n点击此处查看代码图片\n\n```javascript\n$(document).ready(function(){\n  var root = addLevels($(\"\
  #treeContainer\"), 4);\n  root.show();\n});\n```\n\n4. 添加 `addItem()` 函数，用于向树添加新节点。此函数接受\
  \ `parentItem` 和 `item`。`item` 参数是一个带有标签和内容的 JavaScript 对象。这些用于构建完整结构：\n\n点击此处查看代码图片\n\
  \n```javascript\nfunction addItem(parentItem, item){\n  var newItem = $('<div class=\"\
  tree\">').hide();\n  newItem.append(\"<span></span>\").click(toggleItem());\n  newItem.append(\"\
  <label></label>\").html(item.label);\n  newItem.append('<div class=\"content\"></div>')\n\
  \    .append(item.content).hide());\n  parentItem.append(newItem);\n  return newItem;\n\
