  \n---\n\n### 使用 $q 服务\n\n`$q` 服务是处理异步操作的强大工具。其核心思想是使用 `$q` 来管理尚未可用的值。\n\n要使用 `$q`\
  \ 服务，你首先创建一个延迟对象（deferred object）：\n\n```javascript\nvar deferred = $q.defer();\n\
  ```\n\n然后你可以使用 `then()` 方法在操作成功或失败时注册回调函数：\n\n```javascript\ndeferred.then(function(result)\
  \ {\n    // 处理成功情况\n}, function(error) {\n    // 处理错误\n});\n```\n\n`$q` 服务允许你在无需使用嵌套回调的情况下处理异步任务，使你的代码更加整洁且易于维护。\n\
  \n---\n\n### 表 27.6 延迟对象上的可用方法\n\n**图 27.4** 在 AngularJS 应用中实现 `$location` 服务以与浏览器位置交互。\n\
  \n### 总结\n\nAngularJS 服务是单例对象，你可以将它们注册到依赖注入器中。控制器和其他组件可以消费它们。在本节中，你还学习了几个内置服务，例如\
  \ `$http`、`$q`、`$window`、`$location`、`$animate` 和 `$cacheFactory`。这些以及 AngularJS\
  \ 服务可以轻松地将功能注入到你的控制器、指令和自定义服务中。\n\n### 问答\n\n**问：** AngularJS 提供的内置服务是以单例运行的吗？\n\
  \n**答：** 是，但它们是懒性单例，意味着只有当组件依赖它时才会被实例化。\n\n#### 练习\n\n练习包含一组问题和答案，旨在巩固你对本节内容的理解。在查看答案之前，请尝试回答问题。\n\
  \n#### 测验\n\n1. `$rootElement` AngularJS 服务的作用是什么？\n2. 我应该使用哪个 AngularJS 服务从服务器发送和接收请求？\n\
  3. 你应该使用哪个 AngularJS 服务来从 URL 获取查询字符串？\n4. 哪个 AngularJS 服务允许你处理异步请求的延迟操作？\n\n####\
  \ 测验答案\n\n1. `$rootElement` 提供对 AngularJS 根元素的访问。\n2. `$http`\n3. `$location`\n\
  4. `$q`\n\n#### \n\n1. 修改 列表 27.5 和 27.6 中的代码，添加并管理另一个用于收藏蛋糕的 Cookie。你应该实现与之前 Cookie\
  \ 相同的单选按钮组样式。\n\n\n\n\n\n2. 修改 列表 27.7、27.8 和 27.9 中的代码以实现图像移动的动画。你需要将图像的位置更改为绝对定位（absolute），并添加一个名为\
  \ `.slideRight` 的新类。然后实现一个类似于 `.fadeOut` 的动画，使用 jQuery 动画位置而不是透明度。\n\n# 第 28 ：创建你自己的自定义\
  \ AngularJS 服务\n\n在本节中将学习：\n\n![Image](img/image00767.jpeg) 哪些方法可以创建 AngularJS 自定义服务\n\
  \n![Image](img/image00767.jpeg) 如何使用工厂提供者（factory provider）定义自定义服务\n\n![Image](img/image00767.jpeg)\
  \ 如何使用服务提供者（service provider）定义自定义服务\n\n![Image](img/image00767.jpeg) 如何使用所有四种自定义服务构建应用程序\n\
  \n![Image](img/image00767.jpeg) 如何实现异步数据库访问服务\n\nAngularJS 在内置服务中提供了许多功能；然而，你可能还需要能够实现自己的自定义服务，以提供你特定的功能。每当你需要为应用程序提供基于任务的功能时，都应该实现自定义服务。\n\
  \n在实现自定义服务时，你需要将服务视为一组执行一个或多个相关任务的可重用代码。然后，你可以将它们设计并组合到自定义模块中，这些模块可以被多个 AngularJS\
  \ 应用程序轻松调用。\n\n本节介绍了 AngularJS 自定义服务。随后，本节将提供几个自定义 AngularJS 服务实现示例，以便你更清楚地理解如何设计和构建自己的服务。\n\
  \n## 理解自定义 AngularJS 服务\n\nAngularJS 允许你创建自己的自定义服务，以便在需要它的 AngularJS 组件中提供功能。正如你在上一节中看到的，内置的\
  \ AngularJS 服务为 AngularJS 应用程序提供了各种功能。通过使用自定义服务，你可以以许多方式对定制、增强和扩展这些功能。\n\n你可能将在代码中实现四种主要类型的服务：`value`、`constant`、`factory`\
  \ 和 `service`。后续部分将介绍这些服务。\n\n### 定义 value 服务\n\n你使用非常简单的 `value` 服务来定义单个值，并将其作为服务提供者注入。`value`\
  \ 方法使用以下语法，其中 `name` 是服务名称，`object` 是你想提供的任何 JavaScript 对象：\n\n`value(name, object)`\n\
  \n例如：\n\n点击此处查看代码图像\n\n```javascript\nvar app = angular.module('myApp', []);\n\n\
  app.value('myValue', {color:'blue', value:'17'});\n```\n\n### 定义 constant 服务\n\n\
  `constant` 服务基本上与 `value` 服务相同，区别在于 `constant` 服务在构建 `Module` 对象的配置阶段（configuration\
  \ phase）可用，而 `value` 服务则。`constant` 方法使用以下语法，其中 `name` 是服务名称，`object` 是你想提供的任何 JavaScript\
  \ 对象：\n\n`constant(name, object)`\n\n例如：\n\n点击此处查看代码图像\n\n```javascript\nvar app\
  \ = angular.module('myApp', []);\n\napp.constant('myConst', \"Constant String\"\
  );\n```\n\n### 使用工厂提供者构建 factory 服务\n\n`factory` 方法提供了在服务中实现功能的能力。它还可以依赖于其他服务提供者，让你能够构建模块化的代码。`factory`\
  \ 方法使用以下语法，其中 `name` 是服务名称，`factoryProvider` 是构建工厂服务的提供者函数：\n\n点击此处查看代码图像\n\n`factory(name,\
  \ factoryProvider)`\n\n与 `value` 或 `constant` 服务不同，你可以向 `factory` 方法注入其他服务，它会返回一个具有相应功能的服务对象。该功能可以是复杂的\
  \ JavaScript 服务、一个值，或者一个简单的函数。例如，以下代码实现了一个 `factory` 服务，该服务返回一个将两个数字相加的函数：\n\n点击此处查看代码图像\n\
  \n```javascript\nvar app = angular.module('myApp', []);\n\napp.constant('myConst',\
  \ 10);\n\napp.factory('multiplier', ['myConst', function (myConst) {\n\n  return\
  \ function(value) { return value + myConst; };\n}]);\n```\n\n### 使用对象定义 service\
  \ 服务\n\n`service` 方法提供了在服务器中实现功能的能力。`service` 方法具有与 `factory` 方法相同的功能；但 `service`\
  \ 方法的实现方式与 `factory` 方法不同。选择其中一种取决于语义化。\n\n`service` 方法接受构造函数作为第二个参数，并使用它来创建对象的新实例。`service`\
  \ 方法使用以下语法，其中 `name` 是服务名称，`constructor` 是构造函数：\n\n`service(name, constructor)`\n\
  \n`service` 方法还可以接受依赖注入。以下代码实现了一个基础服务方法，提供 `add()` 函数和 `multiply()` 函数：\n\n点击此处查看代码图像\n\
  \n```javascript\nvar app = angular.module('myApp', []);\n\napp.constant('myConst',\
  \ 10);\n\nfunction MathObj(myConst) {\n\n  this.add = function(value){ return value\
  \ + myConst; };\n\n  this.multiply = function(value){ return value * myConst; };\n\
  }\n\napp.service('constMath', ['myConst', MathObj]);\n```\n\n注意首先创建了 `MathObj` 构造函数，然后\
  \ `service()` 方法调用它并注入 `myConst` 服务。\n\n## 将自定义服务集成到 AngularJS 应用程序\n\n当你开始为应用程序实现\
  \ AngularJS 服务时，你会发现某些非常简单，而另一些会变得复杂。服务的复杂度通常反映了其提供的底层数据和功能的复杂度。本节的目的是提供一些不同类型自定义服务的示例示例，说明如何实现和利用。\n\
  \n后续每个部分都包含一个说明自定义服务不同方面的示例。第一个旨在展示如何实现不同的服务；第二个展示了服务的重用性；第三个则让你了解服务的交互。\n\n***\n\
  \n### 动手尝试：实现一个使用四种服务的简单应用程序\n\n在这个示例中，你构建了 `constant`、`value`、`factory` 和 `service`\
  \ 服务。目的是学习如何实现每种服务，以及如何在应用程序中使用多种服务。\n\n列表 28.1 中的代码了将 `value`、`constant`、`factory`\
  \ 和 `service` 服务集成到单个模块的示例。列表 28.2 中的代码实现了加载并运行应用程序的 AngularJS 模板。\n\n使用以下步骤构建使用所有四种服务的应用程序：\n\
