  \n## 课程 26. 使用事件与模型中的数据交互\n\n你将在本节中学到：\n\n- 如何使用 `$watch` 跟踪 scope 变量\n- 如何使用 `$watchCollection`\
  \ 跟踪变化\n- 如何发布自定义事件\n- 如何处理自定义事件\n- 如何实现自定义事件\n\n事件是大多数 AngularJS 应用中最关键的组件之一。事件使用户能够与元素交互，并让应用程序知道何时执行某些任务。本节将讨论你在\
  \ AngularJS 应用中已经拥有并将将要处理的不同类型的事件。\n\n具体来说，本节讨论了四种事件，包括浏览器事件、用户交互事件、基于 scope 的事件以及自定义事件。你已经在之前的课程中接触到了其中一些。本节将讨论由浏览器触发的事件，包括以下内容。\n\
  \n### 浏览器事件\n\n某些事件是由浏览器触发的。在某些情况下，这些是实用的。浏览器事件包括文档加载时的 ready 事件以及当浏览器调整大时的 resize\
  \ 事件。\n\n这些事件在视图变化时非常有用。你已经看到过如何使用 `.on()` 函数为事件添加处理程序；问题是放在哪里。最好的解决方案是在整个应用程序中注册\
  \ handler。\n\n### 用户交互事件\n\n你已经接触了用户交互事件。这些包括鼠标和键盘事件，以及其他 focus 和 blur 事件。通常有两个地方可以实现用户事件交互：一个是使用\
  \ `ng` 事件指令（例如 `ng-click`），以及视图和控制器代码中的简单交互。另一个添加事件交互的地方是在自定义指令的 link 函数中。你已经在之前的课程中接触了这两种方法；在本节中，你会发现你可以选择使用哪一种。使用内置\
  \ `ng` 事件指令（如 `ngClick`）的优点是不为简单需求增加自定义指令的复杂度。\n\n然而，使用 `ng` 事件指令有两个缺点。之一是不要在控制器中进行\
  \ DOM 操作，而那里正是定义处理程序的地方。另一个缺点是，每当你需要时都在模板中实现 `ngClick` 代码。例如，考虑以下为元素添加鼠标事件处理程序的模板代码：\n\
  \n点击此处查看代码图像\n\n```html\n<span ng-mouseenter=\"mouseEntered(event)\"\n      ng-mouseleave=\"\
  mouseLeft(event)\"\n      ng-click=\"clicked(event)\">\n```\n\n代码不是太糟糕，但如果你在多个地方需要相同的功能呢？如果它们落在\
  \ `ng-repeat` 块中，情况就不那么糟，否则就会很麻烦。一个好的遵循的规则是：如果你想在多个地方使用该功能，特别是如果你确定会在多个应用程序中重用它，就应该定义一个实现\
  \ handler 的自定义指令。\n\n### 添加 $watches 以跟踪 scope 变化事件\n\n另一种常用的事件不是由浏览器触发的，而是由模型数据的变化触发的。这种能力让你能够对模型变化做出响应，而无需在每个可能改变值的地方添加代码。这种能力非常有用，因为模型中的数据可能会以各种方式变化——用户输入、服务更新等等。\n\
  \n#### 使用 $watch 跟踪 scope 变量\n\n\n\n\n\n要添加处理范围（scope）值变化的能力，你需要使用 AngularJS 内置的\
  \ `$watch` 功能为范围中的变量添加一个 `$watch`。范围中的 `$watch` 函数使用以下语法：\n\n点击此处查看代码图片\n\n```\n\
  $watch(watchExpression, listener, [objectEquality])\n```\n\n`watchExpression` 是范围中要监听的表达式。该表达式在每次执行\
  \ `$digest()` 时都会被调用，并返回被监听的值。`listener` 定义了一个函数，当 `watchExpression` 的值变为新值时，会调用该函数。如果\
  \ `watchExpression` 的值变为了它已设置的值，则不会调用 `listener`。`objectEquality` 是一个布尔值，当它为 `true`\
  \ 时，将使用 `angular.equals()` 函数来判断相等性，而不是使用更严格的 `==!` 运算符。在使用 `objectEquality` 时应小心，因为对于复杂对象，可能会导致内存消耗和性能消耗的增加。\n\
  \n以下显示了在作用域变量 `score` 上添加 `$watch` 的示例：\n\n点击此处查看代码图片\n\n```\n$scope.score = 0;\n\
  \n$scope.$watch('score', function(newValue, oldValue) {\n  if(newValue > 10){\n\
  \    $scope.status = 'win';\n  }\n});\n```\n\n#### 使用 $watchGroup 跟踪多个作用域变量\n\n\
  AngularJS 还提供了使用 `$watchGroup` 方法监听表达式数组的能力。`$watchGroup` 方法的工作方式与 `$watch` 相同，不同之处在于第一个参数是待监听的表达式数组。`listener`\
  \ 将接收一个包含所监听变量的新值和旧值的数组。例如，如果你想监听变量 `score` 和 `time`，可以使用以下代码：\n\n点击此处查看代码图片\n\n\
  ```\n$scope.score = 0;\n\n$scope.time = 0;\n\n$scope.$watchGroup(['score', 'time'],\
  \ function(newValues, oldValues) {\n  if(newValues[0] > 10){\n    $scope.status\
  \ = 'win';\n  } else if (newValues[1] > 5{\n    $scope.status = 'times up';\n  }\n\
  });\n```\n\n#### 使用 $watchCollection 跟踪作用域中对象属性的变化\n\n你也可以使用 `$watchCollection`\
  \ 方法监听对象的属性。`$watchCollection` 方法接受对象作为第一个参数，并监听该对象的属性。对于数组的情况下，会监听数组的每一个值。例如：\n\
  \n点击此处查看代码图片\n\n```\n$scope.scores = [5, 10, 15, 20];\n\n$scope.$watchGroup('scores',\
  \ function(newValue, oldValue) {\n  $scope.newScores = newValue;\n});\n```\n\n***\n\
  \n### 动手实践一下：在控制器中实现监听器\n\n在这个示例中，你有机会在控制器中实现监听器（watch）、监听组（watch group）和监听集合（watch\
  \ collection），以跟踪变化并更新视图。`Listing 26.1` 和 `Listing 26.2` 中的代码展示了一个实现 `$watch`、`$watchGroup`\
  \ 和 `$watchCollection` 方法的简单示例。\n\n`Listing 26.1` 中的代码实现了一个控制器，在范围中存储了值 `myColor`、`hits`、`misses`\
  \ 以及对象 `myObj`。`Listing 26.2` 中的代码实现了一个 AngularJS 模板，提供了更改值的交互功能。\n\n按照以下步骤构建监听范围中值的应用程序：\n\
  \n1. 添加 `lesson26/scope_watch.html` 和 `lesson26/js/scope_watch.js`。\n2. 将 `Listing\
  \ 26.1` 和 `Listing 26.2` 中的代码添加到 HTML 和 JavaScript 文件中。\n3. `Listing 26.1` 中的代码首先定义了几个范围值，包括\
  \ `myColor`、`hits` 和 `misses`，这些值将被监听。控制器还定义了 `setColor()`、`hit()` 和 `miss()` 函数，允许从浏览器更改这些值。\n\
  4. `Listing 26.1` 中的以下几行代码对范围中的 `myColor` 值实现了 `$watch`，以便每当 `myColor` 变化时，`myObj.color`\
