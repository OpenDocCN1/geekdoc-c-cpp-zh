  \ CSS 修改以让滑块器看起来正确。\n\n## 第 15 节 通过 JavaScript 和 jQuery AJAX 请求访问服务器端数据\n\n在本节中你将学习到：\n\
  \n![Image](img/image00767.jpeg) 使用 AJAX 请求将数据加载到页面元素中\n\n![Image](img/image00767.jpeg)\
  \ 使用 AJAX 请求加载数据\n\n![Image](img/image00767.jpeg) 向服务器端脚本发送 AJAX 请求\n\n![Image](img/image00767.jpeg)\
  \ 处理 AJAX 请求的 JSON 数据\n\n![Image](img/image00767.jpeg) 处理 AJAX 请求的完成事件\n\n在本节中，我们将探索使用\
  \ AJAX 与服务器进行通信。\n\n### 让 AJAX 变得简单尽管 AJAX 非常重要，但初学者可能会望而生畏。有了所有的通信术语，它看起来可能很简单。AJAX\
  \ 是 jQuery 或 JavaScript 向服务器的请求。\n\n### 澄清 AJAX 与页面请求\n\n第一步是定义 AJAX 与普通链接的区别。你已经熟悉页面链接；当你点击链接时，会出现新页面。通常情况下如此，即使所有的控件、表格等都是相同的，但数据发生了变化。在表单提交的情况下，数据没有变化，但必须刷新页面。\n\
  \n***\n\n注意\n\n不要将服务器端动态生成页面与 AJAX 混淆。动态生成页面仍然传统方法——只是更容易管理。每次请求仍然返回完整的页面。唯一的优点是页面是在内存中生成的，而不是从磁盘读取。\n\
  \n***\n\nAJAX 完全不同。AJAX 请求并不从服务器请求新页面。相反，AJAX 请求只发送和接收数据。如果从服务器接收的新数据需要更新页面，那么 jQuery\
  \ 和 JavaScript 可以更新页面元素，正如你已经看到的。\n\n下面的章节将澄清 AJAX，并提供一些实用示例。在本节结束时，你将能够使用非常易用的服务\
  \ `$http`。\n\n### 了解 Node.js、ASP、PHP 和 MySQL 等服务器端服务\n\n下一步是理解 AJAX 请求是如何处理的。不需要深入了解细节。你需要理解的是对于你发送到服务器的每个\
  \ AJAX 请求，一个进程都会读取该请求、执行工作，然后返回响应。\n\n\n\n\n后端处理过程可以是返回静态 HTML、文本、XML 或 JSON 文件的\
  \ Web 服务器。后端进程通常是运行在服务器上的 `ASP`、`JSP`、`PHP`、`Python` 或 `Node.js` 脚本，它们从内存、文件、数据库和其他源读取数据。后端处理过程也可以是集成到\
  \ Web 服务器中的许多其他框架。\n\n对于运行在浏览器中的 AJAX 脚本来说，这些其实并不重要。关心的只有服务器是否返回了状态和数据。\n\n### 理解异步通信\n\
  \n你必须明确什么是异步通信。当你从 Web 服务器请求网页时，这种通信对你的浏览器来说是同步的。这意味着浏览器会等待 HTML 文档从服务器下载完成后，才会开始渲染它并检索所需的额外资源。\n\
  \n提示：你可以同时使用 jQuery 和 JavaScript 进行同步 AJAX 请求。jQuery 的 `.ajax()` 方法和 JavaScript\
  \ 的 `send()` 函数都有一有一个允许此操作的布尔字段。尽管如此你不应该使用它，因为可能会导致浏览器死锁，从而产生一些非常不悦的用户。事实上，在 `jQuery`\
  \ 1.8 及更高版本中，该选项已被弃用。\n\n当你发送 AJAX 请求时，AJAX 通信会有所不同。控制权会立即返回给 `jQuery` 或 `JavaScript`，它可以执行其他操作。只有当请求完成或超时时，浏览器中才会触发事件，允许你处理请求数据。\n\
  \n### 理解跨域请求\n\n当你向来自不同领域的独立服务器发送 AJAX 请求时，就会发生跨域请求。浏览器会阻止这种行为，出于多种安全考虑，这样做是正确的。\n\
  \n阻塞跨域请求唯一的问题是，你通常想从当前网站外部的服务获取数据。你可以通过几种方法解决这个问题。\n\n克服跨域限制的第一种方法让 Web 服务器充当其他服务器或服务的代理，这意味着你不再通过\
  \ `JavaScript` 直接通信，而是将请求发送到服务器，由服务器为你完成。唯一的缺点是它需要额外的服务器端脚本，而且你需要支付额外的时间代价，因为数据必须先下载到\
  \ Web 服务器，然后再传输到 浏览器。\n\n另一个选项是使用所谓的“按需 JavaScript”，这通过 JSON 填充（JSONP）得以实现。这种方法利用了这样一个事实：你可以使用以下语法从另一个网站下载脚本作为资源：\n\
  \n点击此处查看代码图像\n\n```html\n<script type=\"text/javascript\" src=\"http://new.domain.com/getData?jsonp=parseData\"\
  >\n</script>\n```\n\n技巧在于，`src` 属性指定的地址不能直接返回 JSON 响应。如果浏览器检测到脚本中的数据是 JSON（如下所示它将抛出跨域错误：\n\
  \n点击此处查看代码图像\n\n```json\n{ \"title\": \"photoA\", \"rating\": 7 };\n```\n\n相反，第三方服务必须支持\
  \ JSONP，在这种情况下，它会根据请求指定的函数调用对响应进行填充，如下。通过这种方式，你将能够调用该函数从 `JavaScript` 访问数据：\n\n\
  点击此处查看代码图像\n\n```javascript\nparseData({ \"title\": \"photoA\", \"rating\": 7 });\n\
  ```\n\n注意：另一种可能实用的跨域通信方法是在响应头中包含 `ACCESS-CONTROL-ALLOW-ORIGIN:*` 标头。如果你正在搭建自己的服务器，可以轻松实现。\n\
  \n### 比较 GET 与 POST 请求\n\n本节将阐明 `GET` 和 `POST` 请求。发送到 Web 服务器的两种主要请求类型是 `GET` 和\
  \ `POST`。两者之间只有几处区别，但非常重要。`GET` 请求将参数作为 URL 的一部分传递，而 `POST` 请求将它们作为请求数据的一部分传递。\n\
  \n为了帮助你快速理解这一点，以下示例说明了在 `GET` 和 `POST` 请求中向服务器发送名和姓时涉及的基本 URL 和数据：\n\nGET 请求 URL：\n\
  \n点击此处查看代码图像\n\n```text\nhttp://localhost/code/example1.html?first=Brad&last=Dayley\n\
  ```\n\nGet 请求数据：\n\n`<empty>`\n\nPOST 请求 URL：\n\n点击此处查看代码图像\n\n```text\nhttp://localhost/code/example1.html\n\
  ```\n\nPOST 请求数据：\n\n```text\nfirst=Brad\nlast=Dayley\n```\n\n你应该使用哪种请求类型？基本规则是：使用\
  \ `GET` 从服务器检索信息，如果你要更改服务器上的数据，则使用 `POST`。\n\n### 理解响应数据：二进制、文本与 JSON\n\n明确从服务器返回的响应数据类型至关重要。从服务器返回的\
  \ AJAX 请求数据可以是二进制或文本、XML 或 JSON。通常，二进制用于图像、压缩文件等。而文本可能是 HTML、`XML` 或 `JSON`。当浏览器接收服务器的响应时，可能会变得有点复杂。\n\
  \n### 实现 AJAX\n\n现在你已经掌握了 AJAX 概念，准备好细节了。要在 `JavaScript` 中实现 AJAX 请求，你需要访问 `window.XMLHttpRequest`\
  \ 对象。表 15.1 描述了 `XMLHttpRequest` 对象的重要方法和属性。\n\n![Image](img/image037.jpeg)\n\n\
  **表 15.1 XMLHttpRequest 对象的重要方法和属性**\n\n为了说明这一点，查看以下发送 `GET` AJAX 请求的代码，根据名和姓参数获取邮箱：\n\
  \n点击此处查看代码图像\n\n```javascript\nvar xmlhttp = new XMLHttpRequest();\nxmlhttp.onreadystatechange=function()\
  \ {\n  if (xmlhttp.readyState==4 && xmlhttp.status==200) {\n    document.getElementById(\"\
  email\").innerHTML=xmlhttp.responseText;\n  }\n};\nxmlhttp.open(\"GET\",\"/getUserEmail?userid=brad\"\
  ,true);\nxmlhttp.send();\n```\n\n以下代码说明了如何发送基本的 `POST` AJAX 请求向服务器设置邮箱。注意对于 `POST`\
  \ 请求，添加的 `Content-length` 和 `Content-type` 标头确保数据在服务器端被正确处理。`Content-length` 被设置为\
  \ `params` 字符串的长度：\n\n点击此处查看代码图像\n\n```javascript\nvar xmlhttp = new XMLHttpRequest();\n\
  var params = \"first=Brad&last=Dayley&email=brad@dayleycreations.com\";\nxmlhttp.setRequestHeader(\"\
  Content-type\", \"text/plain\");\nxmlhttp.setRequestHeader(\"Content-length\", params.length);\n\
  xmlhttp.onreadystatechange=function() {\n  if (xmlhttp.readyState==4 && xmlhttp.status==200)\
  \ {\n    alert(\"Email Updated\");\n  }\n};\nxmlhttp.open(\"POST\",\"/setUserEmail\"\
  ,true);\nxmlhttp.send(params);\n```\n\n\n\n\n在 IE7 之前的版本的 Internet Explorer 浏览器中，你需要使用以下行来创建\
  \ `xmlhttp` 对象，因为 `window` 对象不支持 `XMLHttpRequest` 属性：\n\n点击此处查看代码图片\n\n```javascript\n\
  xmlhttp=new ActiveXObject(\"Microsoft.XMLHTTP\");\n```\n\n## 来自 jQuery 的 AJAX\n\n\
  本节介绍了如何从 jQuery 实现 AJAX 请求。jQuery 提供了非常易用的封装方法来实现 AJAX 请求，即 `.load()`、`.get()` 和\
  \ `.post()`。\n\n这些辅助函数是对 `.ajax()` 接口的封装，该接口将在稍后进行讨论。这些辅助函数如下：\n\n![Image](img/image00767.jpeg)\
  \ `.load(url [, data ] [, success(data, textStatus, jqXHR) ])`——此方法用于将数据直接加载到 jQuery\
  \ 对象表示的元素中。\n\n![Image](img/image00767.jpeg) `.getScript (url [, data ] , success(data,\
  \ textStatus, jqXHR) ) )`——此方法用于加载并立即执行 JavaScript/jQuery 脚本。\n\n![Image `.getJSON(url\
  \ [, data ] [, success(data, textStatus, jqXHR) ]) )`——此方法用于使用 JSONP 请求从不同域的服务器加载\
  \ JSON 格式的数据。\n\n![Image](img/image00767.jpeg) `.get(url [, data ] [, success(data,\
  \ textStatus, jqXHR) ] [, dataType ]) )`——此方法用于向服务器发送通用的 GET 请求。\n\n![Image](img/image00767.jpeg)\
  \ `.post(url [, data ] [, success(data, textStatus, jqXHR) ] [, dataType ]) )`——此方法用于向服务器发送通用的\
  \ POST 请求。\n\n这些方法都允许你指定请求的 `url`。`.load()` 方法用于将数据直接加载到 jQuery 对象表示的元素中`.get()`\
  \ 和 `.post()` 方法用于发送 GET 和 POST 请求。\n\n`data` 参数可以是字符串或基础 JavaScript 对象。例如，在下面的示例中，`obj`、`objString`\
  \ 和 `formString` 都是有效的数据参数：\n\n点击此处查看代码图片\n\n```javascript\nvar obj ={\"first\"\
  :\"Brad\", \"last\":\"Dayley\"};\nvar objString = $.param(obj);\nvar formString\
  \ = $(\"form\").serialize();\n```\n\n你也可以指定当服务器响应成功时执行的函数。例如，以下成功处理程序会将 `#email`\
  \ 元素的值设置为响应数据的值：\n\n点击此处查看代码图片\n\n```javascript\n$.get(\"/getEmail?first=Brad&last=Dayley\"\
  , null, function (data, status, xObj){\n  $(\"#email\").html(data);\n}));\n```\n\
  \n`.get()` 和 `.post()` 方法还允许你指定字符串形式的 `dataType` 参数，例如 `\"xml\"`、`\"json\"`、`\"\
  script\"`、`\"html\"` 等，用于格式化从服务器响应数据的预期格式。例如，要指定 JSON 响应类型，你可以使用以下代码：\n\n点击此处查看代码图片\n\
  \n```javascript\n$.get(\"/getUser?first=Brad&last=Dayley\", null, function (data,\
  \ status, xObj){\n  $(\"#email\").html(data.email);\n}), \"json\");\n```\n\n## 动手尝试：从\
  \ jQuery 发送 AJAX 请求\n\n在本次练习中，你将有机会使用 jQuery `.load()` 方法实现一些简单的 AJAX 请求。生成的网页包含一个左侧导航，它使用\
