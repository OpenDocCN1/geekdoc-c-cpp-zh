  \ (Custom Filters)\n\nAngularJS 允许你创建自己的过滤器提供程序，并在表达式、控制器和服务中使用它，就像它们是内置过滤器一样。AngularJS\
  \ 提供了 `filter()` 方法来创建过滤器提供程序并将其注册到依赖注入器中。`filter()` 方法接受过滤器的名称作为第一个参数，接受一个函数作为第二个参数。过滤器函数应该接受表达式输入作为第一个参数，以及任何其他额外参数。例如：\n\
  \n```javascript\nfilter('myFilter', function(){\n  return function(input, param2){\n\
  \    return input;\n  };\n});\n```\n\n在过滤器函数内部，你可以按任意的方式更改 `input` 的值。过滤器函数返回的任何值将作为表达式的结果返回。\n\
  \n#### 尝试一下：创建并实现一个自定义过滤器\n\n在此项练习中，构建并使用一个对单词进行审查的自定义 AngularJS 过滤器。此练习的目的是说明如何构建和使用自定义模板。23.1\
  \ 和 23.2 中的代码创建了一个过滤器函数，它可以对字符串中的单词进行审查，并允许将替换值作为可选参数。使用以下步骤构建创建并应用自定义过滤器的应用程序：\n\
  \n1.  添加 `lesson23/filter_custom.html` 和 `lesson23/filter_custom.js` 文件。\n2.  将\
  \ 23.1 和 23.2 所示的代码添加到 HTML 和 JavaScript 文件中。\n3.  23.1 中的以下代码定义了一个名为 `censor` 的过滤器。注意该过滤器返回一个函数，该函数接受输入和替换值，然后遍历被审查的单词并将文本替换为替换值：\n\
  \n```javascript\n02 .filter('censor', function() {\n03   return function(input,\
  \ replacement) {\n04     var cWords = ['bad', 'evil', 'dark'];\n05     var out =\
  \ input;\n06     for(var i=0; i<cWords.length; i++){\n07       var regex = new RegExp(cWords[i],\
  \ \"gi\");\n08       out = out.replace(regex, replacement);\n09     }\n10     return\
  \ out;\n11   };\n12 })\n```\n\n4.  以下代码实现了应用程序控制器。注意 `censor` 过滤器被注入到控制器中。手动调用 `filter()`\
  \ 函数来处理字符串：\n\n```javascript\n02 .filter('censor', function() {\n     var cWords\
  \ = ['bad', 'evil', 'dark'];\n     var out = input;\n     for(var i=0; i<cWords.length;\
  \ i++){\n       var regex = new RegExp(cWords[i], \"gi\");\n       out = out.replace(regex,\
  \ replacement);\n     }\n     return out;\n   });\n```\n\n5.  23.2 中的代码以两种方式使用了过滤器。23.2\
  \ 中的以下行通过传递 `censorText` 变量作为替换值实现了过滤器。\n6.  23.2 中的以下行通过传递替换值实现了字符串。\n7.  使用 `ng-click`\
  \ 在作用域中使用过滤器。\n8.  在浏览器中加载 `filter_custom.html` 以查看图 23.6 所示的行为。\n\n#### 列表 23.1\
  \ filter_custom.js 在 AngularJS 中实现自定义过滤器\n\n```javascript\n01 angular.module('App',\
  \ [])\n02 .filter('censor', function() {\n03   return function(input, replacement)\
  \ {\n04     var cWords = ['bad', 'evil', 'dark'];\n05     var out = input;\n06 \
  \    for(var i=0; i<cWords.length; i++){\n07       var regex = new RegExp(cWords[i],\
  \ \"gi\");\n08       out = out.replace(regex, replacement);\n09     }\n10     return\
  \ out;\n11   };\n12 })\n13 .controller('myController', ['$scope', 'censorFilter',\n\
  14   function($scope, myCensorFilter) {\n15     $scope.censorText = \"***\";\n16\
  \     $scope.phrase=\"This is a bad phrase.\";\n17     $scope.txt = \"Click to filter\
  \ out dark and evil.\";\n18   $scope.filterText = function(){\n19     $scope.txt\
  \ = myCensorFilter($scope.txt, '<<censored>>');\n20   };\n21 ]);\n```\n\n#### 列表\
  \ 23.12 filter_custom.html 使用自定义过滤器的 AngularJS 模板\n\n```html\n01 <!doctype html\n\
  02 <html ng-app=\"myApp\">\n03   <head>\n04     <title>AngularJS 自定义过滤器</title>\n\
  05   </head>\n06   <body>\n07     <div ng-controller=\"myController\">\n08     \
  \  <h2>排序与过滤</h2>\n09       {{phrase | censor:censorText}}<br>\n```\n\n\n\n\n\n\
  ```html\n10      {{\"This is some bad, dark, evil text.\" | censor:\"happy\"}}\n\
  11      <p ng-click=\"filterText()\">{{txt}}</p>\n12     <script src=\"http://code.angularjs.org/1.3.0/angular.min.js\"\
  ></script>\n13     <script src=\"js/filter_custom.js\"></script>\n</body>\n</html>\n\
  ```\n\n### Summary\n\nAngularJS 模板实现简单，但非常强大且广泛。本节讨论了 AngularJS 模板的组件以及它们如何协同工作以扩展\
  \ HTML DOM 的行为和功能。表达式是包含在 `{{}}` 括号内或 AngularJS 模板指令定义中的 JavaScript 代码。表达式可以访问作用域（scope），因此你可以将作用域的值渲染到视图中。\n\
  \n过滤器作为表达式的修饰符，允许你根据特定目的格式化表达式的结果。AngularJS 提供了许多内置过滤器，例如用于货币和日期格式化。你还可以创建自定义过滤器，在数据渲染到页面之前应用任何所需的格式化或修改。你将过滤器作为提供者（providers）注入到注入器服务（injector\
  \ service）中，因此可以使用依赖注入在控制器和模板内部访问它们。这意味着你在 JavaScript 代码中也可以访问过滤器。\n\n### Q&A\n\n\
  **Q. 为什么使用自定义过滤器而不是控制器中的简单函数？**\n\n**A.** AngularJS 的理念是尽可能允许在 HTML 模板中表达意图。这使得应用程序更容易设计和遵循。此外，重用一个过滤器比重用一个自定义函数要容易得多。\n\
  \n**Q. 为什么 HTML 标准没有将 AngularJS 提供的所有功能作为 HTML 规范的一部分采用？**\n\n**A.** 随着时间的推移，HTML\
  \ 可能会添加 AngularJS 提供的某些功能。然而，要以开发者所需的速度移动像 HTML 这样被大规模采纳的规范太困难了。AngularJS 是次优的方案。\n\
  \n### Workshop\n\n工作坊包含一组问题和答案，旨在巩固你对本小时涵盖内容的理解。在查看答案之前，尝试回答这些问题。\n\n#### Quiz\n\
