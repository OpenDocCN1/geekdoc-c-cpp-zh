  </html>\n```\n\n***\n\n### 列表 7.2 dom_objects.js JavaScript 文件包含了一个通过 id、标签和类属性访问变量示例函数\n\
  \n点击此处查看代码图像\n\n***\n\n```javascript\nfunction textChange(){\n  var inElement =\
  \ document.getElementById(\"textIn\");\n  var outElements = document.getElementsByTagName(\"\
  p\");\n  var headingElements = document.getElementsByClassName(\"heading\");\n \
  \ for(var i=0; i<outElements.length; i++){\n    var outItem = outElements[i];\n\
  \    headingElements[i].innerHTML = \"Updating \" + (i+1) + \" to \" + inElement.value;\n\
  \    outItem.innerHTML = inElement.value;\n  }\n}\n```\n\n***\n\n### 列表 7.3 dom_objects.css\
  \ 用于设置 <p> 元素的 CSS\n\n***\n\n```css\np{\n  font-weight:bold;\n  font-size:50px;\n\
  \  margin:5px;\n  color:blue;\n}\n```\n\n***\n\n### 使用 jQuery 选择器\n\n与 JavaScript\
  \ 不同，jQuery 允许你使用选择器以无数种方式查找 HTML 元素。是的，就像 CSS 选择器一样。事实上，大多数 jQuery 选择器都是取自 CSS，这为两者之间提供了更加无缝的过渡。\n\
  \n正如你将在后续章节中发现的，jQuery 选择器可以非常方便地选择任何一组 HTML 元素。但请记住，jQuery 选择器返回的是 jQuery 对象，而不是\
  \ DOM 对象。\n\njQuery 选择器语法非常直观。在加载 jQuery 库后，使用 `$(selector)`。例如：\n\n`$(\"#myElement\"\
  )`\n\n***\n\n#### 注意事项\n\njQuery 选择器语法中使用了几个元字符。如果你想将任何元字符（例如 ``!\"#$%&'()*+,./:;<=>?@[\\\
  ]^`{|}~ )``）作为类/id/名称的一部分，你需要使用两个双反斜杠 `\\\\` 对该字符进行转义。例如，如果你有一个 `id=\"my.element\"\
  ` 的元素，你将使用选择器 `$(\"#my\\\\.element\")`。\n\n***\n\n与 CSS 选择器一样，介绍 jQuery 选择器的最佳方法是向你展示一些示例。接下来的章节将带你了解不同类型的\
  \ jQuery 选择器的示例。这些章节仅触及表面。你有方便时，可以访问以下位置查看选择器文档：\n\n[`http://api.jquery.com/category/selectors/`](http://api.jquery.com/category/selectors/)\n\
  \n#### 应用基础选择器\n\n最常用的选择器是基础选择器。基础选择器关注 HTML 元素的 id 属性、类属性和标签名。表 7.3 列出了一些示例，向你展示如何定义一些基础选择器。\n\
  \n![图像](img/image00868.jpeg)\n\n**表格 7.3 使用基础 jQuery 选择器的示例**\n\n#### 应用属性选择器\n\n\
  使用 jQuery 选择器的另一种方法是根据它们的属性值选择 HTML 元素。这些可以是默认属性，也可以是你添加到 HTML 元素中的属性。属性值在选择器语法中使用\
  \ `[]` 括号表示。表 7.4 显示了属性选择器的一些用法。\n\n![图像](img/image00869.jpeg)![图像](img/image00870.jpeg)\n\
  \n**表格 7.4 使用属性 jQuery 选择器的示例**\n\n#### 应用内容选择器\n\n另一组常用的 jQuery 选择器是内容过滤选择器。这些选择器允许你根据\
  \ HTML 元素内部的内容来选择 HTML 元素。表 7.5 显示了一些示例。\n\n![图像](img/image00871.jpeg)\n\n**表格 7.5\
  \ 使用内容选择器的示例**\n\n#### 应用层级选择器\n\n一组重要的 jQuery 选择器是层级选择器。这些选择器允许你根据 HTML 元素的父元素、子元素或\
  \ DOM 中的其他元素来选择 HTML 元素。表 7.6 显示了一些示例。\n\n![图像](img/image00872.jpeg)\n\n**表格 7.6\
  \ 层级选择器的示例**\n\n***\n\n#### 笔记\n\n在设计选择器时，尽可能具体越好。例如，如果你想选择所有 `class=\"menu\"` 的\
  \ `div` 元素，那么 `$(\"div.menu\")` 会比 `$(\".menu\")` 更高效。\n\n***\n\n#### 应用表单选择器\n\n\
  在处理表单时，一组非常有用的选择器是表单选择器。这些选择器允许你根据网页的状态选择 HTML 元素。表 7.7 显示了一些示例。\n\n![图像](img/image00873.jpeg)\n\
  \n**表格 7.7 表单选择器的示例**\n\n#### 应用可见性选择器\n\n如果你使用可见性来控制流程，使用可见性选择器可以简单地选择隐藏或显示的 HTML\
  \ 元素。表 7.8 显示了一些示例。\n\n![图像](img/image00874.jpeg)\n\n**表格 7.8 可见性选择器的示例**\n\n####\
  \ 应用过滤选择器\n\n你通常需要将选择器缩小到更特定的子集。实现这一点的一种方法是使用过滤选择器。过滤选择器在选择器末尾附加过滤器，以限制选择器返回的结果。表\
  \ 7.9 显示了一些示例。\n\n![图像](img/image00875.jpeg)![图像](img/image00876.jpeg)\n\n**表格 7.9\
  \ 过滤选择器的示例**\n\n***\n\n### 尝试一下：使用 jQuery 访问对象在这个示例中，你使用 jQuery 查找元素并写入值。另一个基础示例，有助于巩固选择器如何让你访问\
