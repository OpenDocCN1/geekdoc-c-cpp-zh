  \ 28.4 中的 `service_custom_time.html` 文件。这实现了一个显示 `LAController`、`NYController`、`LondonController`\
  \ 和 `TimeController` 控制器的 AngularJS 模板。在 `TimeController` 的情况下，所有时间都使用 `ng-repeat`\
  \ 显示在表格中。图 28.2 展示了生成的 AngularJS 网页。注意代表不同的时间。\n\n**图 28.2** 在多个控制器中使用自定义 AngularJS\
  \ 服务来显示不同城市的时间。\n\n**列表 28.3 service_custom_time.js 在多个控制器中实现和使用自定义 AngularJS 服务**\n\
  \n点击此处查看代码图像\n\n* * *\n\n```javascript\n01 var app = angular.module('myApp', []);\n\
  02 function TimeService() {\n```\n\n\n\n```javascript\nvar cities = { 'Los Angeles':\
  \ -8, 'New York': -5, 'London': 0, 'Paris': 1, 'Tokyo': 9 };\nthis.getTZDate = function(city){\n\
  \  var localDate = new Date();\n  var utcTime = localDate.getTime() + localDate.getTimezoneOffset()\
  \ * 60*1000;\n  return new Date(utcTime + (60*60*1000 * cities[city]));\n};\nthis.getCities\
  \ = function(){\n  var cList = [];\n  for (var key in cities){\n    cList.push(key);\n\
  \  }\n  return cList;\n};\n}\napp.service('TimeService', [TimeService]);\napp.controller('LAController',\
  \ ['$scope', 'TimeService', function($scope, timeS) {\n  $scope.myTime = timeS.getTZDate(\"\
  Los Angeles\").toLocaleTimeString();\n }]);\napp.controller('NYController', ['$scope',\
  \ 'TimeService', function($scope, timeS) {\n  $scope.myTime = timeS.getTZDate(\"\
  New York\").toLocaleTimeString();\n }]);\napp.controller('LondonController', ['$scope',\
  \ 'TimeService', function($scope, timeS) {\n  $scope.myTime = timeS.getTZDate(\"\
  London\").toLocaleTimeString();\n }]);\napp.controller('TimeController', ['$scope',\
  \ 'TimeService', function($scope, timeS) {\n  $scope.cities = timeS.getCities();\n\
  \  $scope.getTime = function(cityName){\n    return timeS.getTZDate(cityName).toLocaleTimeString();\n\
  \  };\n }]);\n```\n\n列表 28.4 service_custom_time.html AngularJS 模板，展示了如何将自定义 AngularJS\
  \ 服务注入到多个控制器中\n\n点击此处查看代码图片\n\n```html\n<!doctype html>\n<html ng-app=\"myApp\"\
  >\n<head>\n  <title>AngularJS 自定义时间服务</title>\n  <style>\n    span {\n      color:\
  \ lightgreen; background-color: black;\n      border: 3px ridge; padding: 2px;\n\
