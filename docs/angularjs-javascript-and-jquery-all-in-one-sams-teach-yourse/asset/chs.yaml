  \n**图 4.11** 添加 CSS 背景样式极大提升了元素的外观。\n\n\n\n\n\n# 列表 4.3 backgrounds.html 为元素添加不同类型背景样式的\
  \ HTML 和 CSS 代码\n\n点击此处查看代码图像\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n    <title>Backgrounds</title>\n\
