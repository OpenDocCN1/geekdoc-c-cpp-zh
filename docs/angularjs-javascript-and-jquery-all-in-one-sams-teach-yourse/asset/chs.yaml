  \n### 总结\n在本节中，你学习了如何访问表单元素的数据。使用这些数据，你可以通过设置值、自动聚焦或隐藏元素来实现动态效果。你还学习了如何为元素应用一些视觉效果以引导用户。某些效果可以通过\
  \ CSS 实现，但 jQuery 提供了更多的变化。\n\n表单验证是 Web 开发中至关重要的部分之一。通过在浏览器中（在提交到服务器之前）拦截问题，你可以节省大量用户时间。\n\
  \n### 问答\n**问：可以使用 jQuery Validation 插件创建自己的验证规则吗？**\n**答：是的。你可以在 `.validate()`\
  \ 返回的对象上调用 `.addMethod(name, function(value, parameters) [,message])` 方法。你指定的 `name`\
  \ 将作为新规则；函数将被调用并将当前值和元素作为参数传递。如果元素值有效，函数应返回 `true`，否则返回 `false`。`message` 参数是将显示的消息。\n\
  \n**问：有什么方法可以隐藏 <select> 元素难看的滚动条吗？**\n**答：并没有。有很多通通方法，例如添加一个 `div` 来遮盖它。\n\n####\
  \ 练习\n练习包含一组问题，旨在巩固你对本节内容的理解。在查看答案之前，请尝试回答。\n\n#### 测验\n1.  如何通过 jQuery 获取 <select>\
  \ 元素的值？\n2.  如何通过 jQuery 禁用表单元素？\n3.  列出两种通过 jQuery 检查复选框是否被选中的方法。\n4.  以下语句做了什么？\n\
  \    `$(\"input:text\").blur();`\n\n#### 测验答案\n1. 对代表该元素的 jQuery 对象调用 `.val()` 方法。\n\
  \n\n\n\n\n[2]. 在代表该元素的 jQuery 对象上调用 `.prop(\"disabled\",\"disabled\")`。\n\n[3].\
  \ 在 jQuery 对象上调用 `.prop(\"checked\")` 或 `.is(\":selected\")`。\n\n[4]. 它会移除所有类型为\
  \ `text` 的 `<input>` 元素的焦点。\n\n### 练习题\n\n**1.** 打开列表 13.1、13.2 和 13.3 中的代码，并修改代码使得\
