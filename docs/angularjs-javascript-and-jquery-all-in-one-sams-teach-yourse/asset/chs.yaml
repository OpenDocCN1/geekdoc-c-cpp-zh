  \n**图 22.2** 一个实现了 AngularJS 控制器并将多个字段链接到作用域的模板，以提供值的输入和结果显示。\n\n**列表 22.3 scope_template.js\
  \ 实现支持功能的的基础控制器**\n\n点击此处代码图片\n\n```javascript\n01 angular.module('myApp', []).\n\
  02  controller('SimpleTemplate', function($scope) {\n03   $scope.valueA = 5;\n04\
  \   $scope.valueB = 7;\n05   $scope.valueC = 12;\n06   $scope.addValues = function(v1,\
  \ v2) {\n07     $scope.valueC = v1 + v2;\n08   };\n09 });\n```\n\n**列表 22.4 scope_template.html\
  \ 实现控制器及与作用域链接的各种字段的 HTML 代码**\n\n点击此处代码图片\n\n```html\n01 <!doctype html>\n02 <html\
  \ ng-app=\"myApp\">\n03  <head>\n04   <title>AngularJS Scope and Templates</title>\n\
  05  </head>\n06  <body>\n07   <div ng-controller=\"SimpleTemplate\">\n08     ValueA:\
  \ <input type=\"number\" ng-model=\"valueA\" /><br>\n09     ValueB: <input type=\"\
  number\" ng-model=\"valueB\" /><br><br>\n10     Expression: {{valueA}} + {{valueB}}<br><br>\n\
  11     Live Expression Value: {{valueA + valueB}}<br><br>\n12     <input type=\"\
  button\" ng-click=\"addValues(valueA, valueB)\"\n13       value =\"Click to Add\
  \ Values {{valueA}} & {{valueB}}\" /><br>\n14     Clicked Expression Value: {{valueC}}<br>\n\
  15   </div>\n16   <script src=\"http://code.angularjs.org/1.3.8/angular.min.js\"\
  ></script>\n17   <script src=\"js/scope_template.js\"></script>\n18 </body>\n19\
  \ </html>\n```\n\n\n\n\n\n在创建阶段，还会创建一个与浏览器事件循环（event loop）交互的消化循环（digest loop）。消化循环负责根据模型的更改更新\
  \ DOM 元素，并执行任何注册的监听器函数（watcher functions）。虽然你永远不需要手动执行消化循环，但可以通过在 scope 上执行 `$digest()`\
  \ 方法来实现。例如，以下代码会评估任何异步更改，然后执行 scope 上的监听函数：\n\n```\n$scope.$digest()\n```\n\n###\
  \ 监听器注册阶段 (The Watcher Registration Phase)\n\n监听器注册阶段对 scope 中在模板中表示的值进行监听。这些监听会将模型的变化自动传播到\
  \ DOM 元素。\n\n你还可以使用 `$watch()` 方法在 scope 属性值上注册自己的监听函数。该方法接受 scope 属性名作为第一个参数，并将回调函数作为第二个参数。当\
  \ scope 中的属性发生变化时，其旧值和新值将传递给回调函数。\n\n例如，以下代码为 scope 中的属性 `watchedItem` 添加了监听器，并在每次发生变化时增加计数器：\n\
  \n点击此处查看代码图像\n\n```\n$scope.watchedItem = 'myItem';\n$scope.counter = 0;\n$scope.$watch('watchedItem',\
  \ function(newValue, oldValue) {\n  $scope.watchedItem = $scope.counter + 1;\n});\n\
  ```\n\n### 模型变更阶段 (The Model Mutation Phase)\n\n模型变更阶段发生在 scope 中的数据发生变化时。当你从 AngularJS\
  \ 代码中进行更改时，一个名为 `$apply()` 的 scope 函数会更新模型并调用 `$digest()` 函数来更新 DOM 和监听器。这就是你在 AngularJS\
  \ 控制器或通过 `$http`、`$timeout` 和 `$interval` 服务所做的更改自动更新到 DOM 中的机制。\n\n你应该始终尝试在 AngularJS\
  \ 控制器或这些服务内部对 scope 进行更改。但是，如果你必须在 AngularJS 范围之外更改 scope，则需要在 scope 上调用 `scope.$apply()`\
  \ 以强制模型和 DOM 正确更新。`$apply()` 方法接受一个表达式作为唯一参数。该表达式会被求值并返回，然后调用 `$digest()` 方法更新 DOM\
  \ 和监听器。\n\n### 变更观察阶段 (The Mutation Observation Phase)\n\n变更观察阶段发生在消化循环执行、`$apply()`\
  \ 调用或手动执行 `$digest()` 方法时。当 `$digest()` 执行时，它会评估所有监听器的变化。如果值发生了变化，`$digest()` 会调用\
  \ `$watch` 监听器并更新 DOM。\n\n### Scope 销阶段 (The Scope Destruction Phase)\n\n`$destroy()`\
  \ 方法从浏览器内存中移除 scope。AngularJS 库在子 scope 不再需要时会自动调用此方法。`$destroy()` 方法会停止 `$digest()`\
  \ 调用并移除监听，允许浏览器垃圾回收回收内存。\n\n### 实现 Scope 层级结构 (Implementing Scope Hierarchy)\n\n\
  scope 的一个伟大特性是它们按层级结构组织的。层级结构有助于保持 scope 的组织有序，并与它们代表的视图上下文相关。AngularJS 模块级别有一个根作用（root\
  \ scope），然后在子组件（如控制器或指令）中实现子 scope。子 scope 可以相互嵌套，创建层级结构。\n\n***\n\n顺带一提 (By Way)\n\
  \n`$digest()` 方法利用 scope 层级结构将更改 传播到相应的监听器和 DOM 元素。\n\n***\n\nScope 层级结构是根据 AngularJS\
  \ 模板中 `ng-controller` 语句的位置自动创建的。例如，以下模板代码定义了两个 `<div>` 元素，它们创建了同级的控制器实例：\n\n点击此处查看代码图像\n\
  \n```\n<div ng-controller=\"controllerA\"> . . . </div>\n<div ng-controller=\"controllerB\"\
  > . . . </div>\n```\n\n然而，以下模板代码定义的控制器中 `controllerA` 是 `controllerB` 的父级：\n\n点击此处查看代码图像\n\
  \n```\n<div ng-controller=\"controllerA\">\n  <div ng-controller=\"controllerB\"\
  > . . . </div>\n</div>\n```\n\nScope 层级结构的工作方式类似于面向对象语言中的对象继承方式。你可以从控制器访问父级 scope\
  \ 的值，但无法访问兄弟或子 scope 的值。如果你在子 scope 中添加一个属性名，它不会覆盖父级，而是在子 scope 中创建一个同名的属性，其值与父级不同。\n\
  \n***\n\n### 动手尝试：实现嵌套控制器和 Scope (Try it Yourself: Implementing Nested Controllers\
  \ and Scopes)\n\n在这个示例中，你将观察嵌套控制器内 scope 的行为。列表 22.5 和 22.6 实现了一个基础的嵌套 scope 层级结构，以演示\
  \ scope 在层级结构中的运作方式。列表 22.5 创建了一个带有三个控制器的应用程序，每个控制器定义了两个 scope 项目。它们共享公共 scope 属性\
  \ `title` 以及属性 `valueA`、`valueB` 和 `valueC`。列表 22.6 在 AngularJS 模板中创建了这三个控制器。\n\n\
  使用以下步骤构建嵌套控制器和 scope 的应用程序：\n\n1. 添加 `lesson22/scope_hierarchy.html` 和 `lesson22/js/scope_hierarchy.js`\
  \ 文件。\n2. 将 列表 22.5 和 列表 22.6 中所示的代码添加到 HTML 和 JavaScript 文件中。\n3. 列表 22.5 中的代码实现了三个控制器：`LevelA`、`LevelB`\
  \ 和 `LevelC`。\n\n```javascript\n$scope('LevelA', function($scope) {\n  $scope.title\
  \ = \"Level A\";\n  $scope.valueA = 1;\n  $scope.inc = function() {\n    $scope.valueA++;\n\
  \  };\n});\n```\n\n4. 在 列表 22.6 中，三个 `<div>` 元素相互嵌套，这嵌套了控制器：\n\n```html\n<div ng-controller=\"\
  LevelA\">\n  <div ng-controller=\"LevelB\">\n    <div ng-controller=\"LevelC\">\n\
  ```\n5. `LevelA` `<div>` 中的以下模板显示来自 `LevelA` 的 `title` 和 `valueA` 值，并在点击按钮时调用 `LevelA`\
  \ 的 `inc()` 函数：\n\n```html\n{{title}}\n{{valueA}}\n<input type=\"button\" ng-click=\"\
  inc()\" value=\"+ />\n```\n\n6. `LevelB` `<div>` 中的以下模板显示来自 `LevelB` 的 `title` 和\
  \ `valueB` 值，但也显示来自 `LevelA` scope 的 `valueA` 值。此外，当此处定义的按钮时，调用的是 `LevelB` 的 `inc()`\
  \ 函数：\n\n```html\n{{title}}\n{{valueA}}\n{{valueB}}\n<input type=\"button\" ng-click=\"\
  inc()\" value=\"+ />\n```\n\n7. `LevelC` `<div>` 中的以下模板显示来自 `LevelB` 的 `title` 和\
  \ `valueC` 值，但也显示来自 `LevelA` scope 的 `valueA` 值和来自 `LevelB` scope 的 `valueB` 值。此外，当此处定义的按钮时，调用的是\
  \ `LevelC` 的 `inc()` 函数：\n\n```html\n{{title}}\n{{valueA}}\n{{valueB}}\n{{valueC}}\n\
  <input type=\"button\" ng-click=\"inc()\" value=\"+ />\n```\n\n\n\n\n\n## 8. 图 22.3\
  \ 显示了渲染后的 AngularJS 应用。注意所有三个 scope 中的 `title` 属性值都是不同的。这是因为为层级结构中的每一层都创建了新的 `title`\
  \ 属性。\n\n![Image](img/image00999.jpeg)\n\n**图 22.3** 实现一个控制器层级结构，渲染来自多层作用域的结果。\n\
  \n### 列表 22.5 `scope_hierarchy.js` 实现一个可以访问每一层属性的基础作用域层级\n\n点击查看代码图像\n\n```javascript\n\
  01 angular.module('myApp', []).\n02   controller('LevelA', function($scope) {\n\
  03     $scope.title = \"Level A\"\n04     $scope.valueA = 1;\n05     $scope.inc\
  \ = function() {\n06        $scope.valueA++;\n07      };\n08   ).\n09   controller('LevelB',\
  \ function($scope) {\n10     $scope.title = \"Level B\"\n11     $scope.valueB =\
  \ 1;\n12     $scope.inc = function() {\n13        $scope.valueB++;\n14      };\n\
  15   ).\n16   controller('LevelC', function($scope) {\n17     $scope.title = \"\
  Level C\"\n18     $scope.valueC = 1;\n19     $scope.inc = function() {\n20     \
  \   $scope.valueC++;\n21      };\n22   });\n```\n\n### 列表 22.6 `scope_hierarchy.html`\
  \ 实现控制器层级结构并渲染多层作用域结果的 HTML 模板代码\n\n点击查看代码图像\n\n```html\n01 <!doctype html>\n02\
  \ <html ng-app=\"myApp\">\n03 <head>\n04 <title>AngularJS Scope Hierarchy</title>\n\
  05 </head>\n06 <body>\n07   <div ng-controller=\"LevelA\">\n08     <h3>{{title}}</h3>\n\
  09     ValueA = {{valueA}} <input type=\"button\" ng-click=\"inc()\" value=\"+\"\
  \ />\n10     <div ng-controller=\"LevelB\"><hr>\n11         <h3>{{title}}</h3>\n\
  12         ValueA = {{valueA}}<br>\n13         ValueB = {{valueB}}\n14         <input\
  \ type=\"button\" ng-click=\"inc()\" value=\"+\" />\n15         <div ng-controller=\"\
  LevelC\"><hr>\n16           <h3>{{title}}</h3>\n17             ValueA = {{valueA}}<br>\n\
  18             ValueB = {{valueB}}<br>\n19             ValueC = {{valueC}}\n20 \
  \            <input type=\"button\" ng-click=\"inc()\" value=\"+\" />\n21      \
  \   </div>\n22     </div>\n23   </div>\n24   <script src=\"http://code.angularjs.org/1.3.8/angular.min.js\"\
  ></script>\n25   <script src=\"js/scope_hierarchy.js\"></script>\n26 </body>\n27\
  \ </html>\n```\n\n### 总结\n\nscope 是 AngularJS 应用中数据的确定源。scope 与模板视图、控制器、模块和服务之间有直接关系，并充当将应用程序绑定在一起的胶水。scope\
  \ 还可以作为数据库或其他服务器端数据源的表示。\n\nscope 的生命周期与浏览器的事件循环相关，因此浏览器的更改可以改变 scope，而 scope 的更改会反映在绑定到\
  \ scope 的 DOM 元素中。你还可以添加自定义的监听函数（watch functions），在 scope 变化时接收通知。\n\nscope 被组织成层级结构，根作用域（root\
  \ scope）定义在应用程序级别。每个控制器实例都会获得一个子 实例。通过子 scope，你可以访问存储在父 scope 层级中的数据。\n\n### 问答\n\
  \n**Q。scope 是否必须完全匹配数据模型——例如来自服务器的数据？**\n\n**A。** 不，AngularJS 应用的 scope 应该匹配应用本身所需。然而，尽可能保持与后端数据匹配可以使代码更于维护。\n\
  \n**Q。可以修改 scope 吗？**\n\n\n\n\n\n以下代码段展示了指令、表达式和过滤器的实现示例。`ng-model=\"msg\"`属性是一个指令，它将`<input>`元素的值绑定到作用域（scope）中的\
  \ `msg`。`{{}}` 括号中的代码是一个表达式，它应用了 `uppercase` 过滤器：\n\n```html\n<div>\n  <input ng-model=\"\
  msg\">\n  {{msg | uppercase}}\n</div>\n```\n\n当你在浏览器中加载 AngularJS Web 页面时，它是以原始状态加载的，包含了模板代码和\
  \ HTML 代码。初始 DOM 是根据该网页构建的。当 AngularJS 应用启动（bootstrapped）时，AngularJS 模板会编译为 DOM，动态地调整\
  \ DOM 元素的值、事件绑定和其他属性，使其与模板中的指令、表达式和过滤器相对应。\n\n在编译期间，HTML 标签和属性会被归一化处理，以支持 AngularJS\
  \ 是大小写敏感而 HTML 不是这一事实。归一化主要做了两件事：\n\n![Image](img/image00767.jpeg) 移除元素和属性前面的 `x-`\
  \ 和 `data-` 前缀。\n\n![Image](img/image00767.jpeg) 将带有 `:`、`-` 或 `_` 的名称转换为驼峰命名（camelCase）。\n\
  \n例如，以下所有内容都会归一化为 `ngModel`：\n\n- `ng-model`\n- `data-ng-model`\n- `x-ng:model`\n\
  - `ng_model`\n\n### 使用表达式\n\n使用表达式是在 AngularJS 视图中表示作用域数据最简单的方法。表达式是封装在括号内的代码块：`{{expression}}`。AngularJS\
  \ 会将表达式编译为 HTML 元素，以便将表达式的结果显示出来。例如，查看以下表达式：\n\n```html\n{{1+5}}\n{{'One' + 'Two'}}\n\
  ```\n\n根据这些表达式，网页显示了以下值：\n\n- 6\n- OneTwo\n\n表达式绑定到数据模型，这提供了两个巨大的益处。首先，你可以在表达式中使用作用域中定义的属性名和函数。其次，因为表达式绑定到作用域，当作用域中的数据发生变化时，表达式也会发生变化。例如，假设作用域包含以下值：\n\
  \n```javascript\n$scope.name='Brad';\n$scope.score=95;\n```\n\n你可以直接在模板表达式中引用 name\
  \ 和 score 值，如下：\n\n```html\nName: {{name}}\nScore: {{score}}\nAdjusted: {{score+5}}\n\
  ```\n\nAngularJS 表达式在许多方面与 JavaScript 表达式相似，但在这些方面有所不同：\n\n![Image](img/image00767.jpeg)\
  \ **属性评估：** 属性名是针对作用域模型进行评估的，而不是针对全局 JavaScript 命名空间评估。\n\n![Image](img/image00767.jpeg)\
  \ **容错性更高：** 表达式遇到未定义或空变量类型时不会抛出异常；相反，它们将这些视为没有值。\n\n![Image](img/image00767.jpeg)\
  \ **无流程控制：** 表达式不允许 JavaScript 条件判断或循环。此外，你不能在表达式内部抛出错误。\n\nAngularJS 将用于指令标签中定义属性值的字符串评估为表达式。这允许你在定义中包含表达式类型的语法。例如，当你在模板中设置\
  \ `ng-click` 指令的值时，你指定了一个表达式。在该表达式内部，你可以引用作用域变量并使用其他表达式语法，如下所示：\n\n点击此处查看代码图片\n\n\
  ```html\n<span ng-click=\"scopeFunction()\"></span>\n<span ng-click=\"scopeFunction(scopeVariable,\
  \ 'stringParameter')\"></span>\n<span ng-click=\"scopeFunction(5*scopeVariable)\"\
  ></span>\n```\n\n由于 AngularJS 模板表达式可以访问作用域，因此你也可以在 AngularJS 表达式内部更改作用域。例如，下面的 `ng-click`\
  \ 指令更改了作用域模型内部 `msg` 的值：\n\n点击此处查看代码图片\n\n```html\n<span ng-click=\"msg='clicked'\"\
  ></span>\n```\n\n后续章节将带你了解利用 AngularJS 表达式的一些示例。\n\n***\n\n### 动手尝试：使用基础表达式\n\n\
  在此练习中，你将看到 AngularJS 如何处理字符串和数字的渲染。此练习的目的是说明 AngularJS 如何评估包含字符串、数字以及基础数学运算符的表达式。\n\
  \nListing 23.1 中的代码是一个简单的 AngularJS 应用，其中包含一个名为 `myController` 的控制器。控制器是空的，因为没有任何表达式访问作用域。\n\
  \nListing 23.2 中的代码是一个 AngularJS 模板，其中包含了几种封装在 `{{}}` 括号中的不同类型的表达式。某些表达式是数字或字符串，某些包含\
  \ `+` 操作以组合字符串和/或数字，还有一个应用了 `===` 运算符来比较两个数字。\n\n使用以下步骤构建使用基础表达式的应用程序：\n\n1. 添加\
  \ `lesson23/expressions_basic.html` 和 `lesson23/js/expressions_basic.js` 文件。\n2.\
  \ 将 Listing 23.1 和 Listing 23.2 所示的代码添加到 HTML 和 JavaScript 文件中。\n3. Listing 23.1\
  \ 中的后续代码实现了一个基础 AngularJS 控制器：\n\n点击此处查看代码图片\n\n```javascript\n01 angular.module('myApp',\
  \ [])\n02    .controller('myController', function($scope) {\n03    });\n```\n\n\
  4. Listing 23.2 中的下一行代码使用表达式括号 `{{}}` 来显示一个数字：\n\n```html\n14      {{5}}<hr>\n```\n\
  \n5. Listing 23.2 中的下一行代码使用表达式括号 `{{}}` 来显示一个字符串：\n\n点击此处查看代码图片\n\n```html\n16 \
  \     {{'My String'}}<hr>\n```\n\n6. Listing 23.2 中的下一行代码使用表达式括号 `{{}}` 来显示字符串：\n\
  \n点击此处查看代码图片\n\n```html\n18      {{'String1' + 'String2'}}<hr>\n```\n\n7. Listing\
  \ 23.2 中的后续代码使用表达式括号 `{{}}` 通过相加显示数字：\n\n```html\n20      {{5+5}}<hr>\n```\n\n8.\
  \ Listing 23.2 中使用表达式括号 `{{}}` 通过相加显示字符串和数字：\n\n```html\n22      {{5 + '+' + 5}}<hr>\n\
  ```\n\n9. Listing 23.2 中使用表达式括号 `{{}}` 通过比较 5 来显示布尔值：\n\n```html\n24      {{5===5}}<hr>\n\
  ```\n\n10. 在浏览器中打开 `expressions_basic.html`。图 23.1 显示了渲染后的网页。注意数字和字符串直接显示在最终视图中。将字符串和数字相加允许你构建显示在视图中的文本字符串。还要注意使用比较运算符会在视图中渲染\
  \ `true` 或 `false`。\n\n![Image](img/image1100.jpeg)\n\n**图 23.1** 包含字符串、数字和数学运算的\
  \ AngularJS 表达式。\n\n\n\n\n\n```html\n<body>\n  <div ng-controller=\"myController\"\
  >\n    <h1>Expressions</h1>\n    Number:<br>\n    {{5}}<hr>\n    String:<br>\n \
  \   {{'My String'}}<hr>\n    将两个字符串相加:<br>\n    {{'String1' + ' ' + 'String2'}}<hr>\n\
  \    将两个数字相加:<br>\n    {{5+5}}<hr>\n    将字符串和数字相加:<br>\n    {{5 + '+' + 5 + '='}}{{5+5}}<hr>\n\
  \    对两个数字进行等比比较:<br>\n    {{5===5}}<hr>\n    <script src=\"http://code.angularjs.org/1.3.0/angular.min.js\"\
  ></script>\n    <script src=\"js/expressions_basic.js\"></script>\n  </div>\n</body>\n\
  </html>\n```\n\n* * *\n* * *\n* * *\n\n 动手尝试：在表达式中与 scope 交互\n\n现在你已经看到了一些基本的 AngularJS\
  \ 表达式，让我们来看看如何在 AngularJS 表达式内部与 scope 进行交互。在之前的示例中，表达式的所有输入都来自显式的字符串或数字。这个示例展示了\
  \ AngularJS 表达式通过与 scope 中的数据交互而产生的真正威力。\n\n使用以下步骤构建使用基本表达式的应用程序：\n\n**1.** 添加 `lesson23/expressions_scope.html`\
  \ 和 `lesson23/js/expressions_scope.js` 文件。\n\n**2.** 将代码列表 23.3 和代码列表 23.4 所示的代码添加到\
  \ HTML 和 JavaScript 文件中。\n\n**3.** 代码列表 23.3 中的后续代码使用所需的 `speed`、`vehicle`、`new-Speed`\
  \ 和 `newVehicle` 变量初始化 scope：\n\n点击查看代码图片\n\n```javascript\n$scope.speed = 'Slow';\n\
  $scope.vehicle = 'Train';\n$scope.newSpeed = 'Hypersonic';\n$scope.newVehicle =\
  \ 'Plane';\n```\n\n**4.** 后面的代码实现了两个函数，接受一个字符串并返回该字符串的大写或小写形式字符：\n\n点击查看代码图片\n\n\
  ```javascript\n$scope.upper = function(aString){\n  return angular.uppercase(aString);\n\
  };\n$scope.lower = function(aString){\n  return angular.lowercase(aString);\n};\n\
  ```\n\n**5.** 后面的代码创建了一个函数，根据传递的参数设置 `$scope.speed` 和 `$scope.vehicle` 的值：\n\n点击查看代码图片\n\
  \n```javascript\n$scope.setValues = function(speed, vehicle){\n  $scope.speed =\
  \ speed;\n  $scope.vehicle = vehicle;\n};\n```\n\n**6.** 来自代码列表 23.4 的后续代码是 AngularJS\
  \ 模板的一部分，允许你直接访问 scope 中的变量。\n\n点击查看代码图片\n\n```html\n{{speed}} {{vehicle}}<hr>\n\
  ```\n\n**7.** 下一段代码从 scope 中添加变量 `speed` 和 `vehicle` 并显示它们：\n\n点击查看代码图片\n\n```html\n\
  {{speed + ' ' + vehicle}}<hr>\n```\n\n**8.** 后面的代码显示了调用 scope 中 `lower()` 和 `upper()`\
  \ 函数的结果。注意，scope 中的 `speed` 被传递给 `lower()`，而字符串 `Jeep` 被传递给 `upper()`：\n\n点击查看代码图片\n\
  \n```html\n{{lower(speed)}} {{upper('Jeep')}}<hr>\n```\n\n**9.** 后几行代码使用 `ng-click`\
  \ 调用控制器中的 `setValues()`。第一个参数是字符串，第二个参数是来自 scope 的变量 `newVehicle`：\n\n点击查看代码图片\n\
  \n```html\n<a ng-click=\"setValues('Fast', newVehicle)\">Click to change to {{newVehicle}}</a>\n\
  ```\n\n**10.** 后几行代码使用 `ng-click` 调用控制器中的 `setValues()`。第一个参数是来自 scope 的变量 `newSpeed`，第二个参数是字符串\
  \ `Rocket`：\n\n点击查看代码图片\n\n```html\n<a ng-click=\"setValues(newSpeed, 'Rocket')\"\
  >Click to change to {{newSpeed}}</a>\n```\n\n**11.** 后几行代码在被点击时直接设置 scope 中的变量 `vehicle`：\n\
  \n点击查看代码图片\n\n```html\n<a ng-click=\"vehicle='Car'\">Click to change the vehicle\
  \ to a Car</a><hr>\n<a ng-click=\"vehicle='Enhanced ' + vehicle\">Click to Enhance\
