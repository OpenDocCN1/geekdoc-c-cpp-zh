  \ 会变得模糊。对于最佳的图表，你应该使用 `<svg>`，这样用户可以进行缩，且依然保持清晰。\n\n### 工作坊\n\n工作坊包含一组问题和答案，旨在巩固你对本节所涵盖内容的理解。在查看答案之前，请尝试回答这些问题。\n\
