  \ 为 <div> 元素样式 CSS 代码**\n点击此处查看代码图片\n\n```css\n1 div{\n2   border-radius:5px;\n\
  3   margin:3px;\n4   padding:5px;\n5   background-color:lightgrey;\n6   font-weight:bold;\n\
  7   display:inline-block;\n8   cursor:pointer;\n9 }\n```\n\n### 在 jQuery 中应用事件处理器\n\
  为 DOM 元素应用处理器的最佳方法是使用 jQuery。使用 jQuery 对象可以轻松地选择不同的对象集并同时为它们应用相同的事件处理器。\n\n在过去，jQuery\
  \ 有几种方法可以添加和移除事件处理器，包括 `bind()/unbind()` 和 `delegate()`/`undelegate()`。`bind()`\
  \ 方法模拟了 `addEventListener()` 的行为，而 `delegate()` 允许在 jQuery 对象上添加事件，然后当向事件处理器添加额外的子元素时，也会自动委托给这些元素。\n\
  \n从 jQuery 1.7 版本开始，这些方法都被简单的一对 `on()` 和 `off()` 所取代。使用 `on()` 方法将事件处理器附加到 jQuery\
  \ 对象。`on()` 方法可以用以下两种格式之一进行调用：\n\n点击此处查看代码图片\n\n```javascript\non(events [, selector]\
  \ [, data], handler(eventObject))\n\non(events-map [, selector][, data])\n```\n\n\
  \n\n\n\n以下列表描述了在 jQuery 对象上添加事件处理程序时，向 `on()` 方法添加的每个参数的用途：\n\n![Image](img/image00767.jpeg)\
  \ **events**——一个或多个用空格分隔的事件类型，以及用点语法表示的可选命名空间；例如，`\"click\"`、`\"mouseenter mouseleave\"\
  ` 或 `\"keydown.myPlugin\"`。事件类型列表可以在 表 9.1 中找到。\n\n![Image](img/image00767.jpeg)\
  \ **events-map**——一个映射对象，其中字符串键指定一个或多个用空格分隔的事件类型，而值指定当事件触发时将调用的处理函数；例如，`{'click':myhandler}`\
  \ 或 `{'click':function myHandler(e){return true;}}`。\n\n![Image](img/image00767.jpeg)\
  \ **selector**——可选。选择器字符串，用于指定当事件触发时，哪些后代元素也应该调用事件处理程序。这取代了 `delegate()` 方法的功能。如果你将事件处理程序添加到一组始终存在于页面中的父对象，那么任何匹配选择器的后代元素在事件触发时也会调用处理程序，即使它们是在事件绑定之后才添加的。\n\
  \n![Image](img/image00767.jpeg) **data**——可选。它可以是一个数字、字符串或对象，当事件触发时，将作为 `event`\
  \ 的数据部分通过 `event.data` 传递给处理程序。\n\n![Image](img/image00767.jpeg) **handler(eventObject)**——如果你没有使用\
  \ `events-map`，则需要指定在事件触发时执行的处理函数。\n\n要使用 jQuery 从元素中移除事件处理程序，请在 jQuery 对象上调用 `off()`\
  \ 方法。`off` 方法的语法为以下格式之一：\n\n点击此处查看代码图像\n\n```\noff(events [, selector] [, handler(eventObject]))\n\
  \noff(events-map [, selector])\n```\n\n如果没有指定处理程序，`off()` 函数将移除所有指定事件的事件处理程序。以下示例展示了如何使用\
  \ `on()` 为所有 `<div>` 元素添加事件处理程序，然后使用 `off()` 移除它：\n\n点击此处查看代码图像\n\n```\n$(\"div\"\
  ).on(\"click\",clickHandler);\n\n$(\"div\").off(\"click\",clickHandler);\n```\n\n\
  ***\n\n注意\n`on()` 和 `off()` 方法适用于所有 jQuery 事件类型，包括你自定义的事件。jQuery 之后在本节后面还会介绍了一些简单的辅助函数，以便于为某些事件附加处理程序。\n\
  \n***\n\n提示\n你通常希望事件处理程序只在事件发生第一次运行时运行。jQuery 提供了非常有用的 `one()` 方法，它会添加事件，并在首次触发后自动将其移除。`one()`\
  \ 方法与 `on()` 方法使用相同的语法。\n\n***\n\n### 自己尝试：使用 jQuery 添加事件处理程序\n\n在此示例中，你使用 jQuery\
  \ 方法动态地为 DOM 对象附加事件处理程序。请按照以下步骤创建 列表 9.4、9.5 和 9.6 所示的文件：\n\n**1.** 在 Eclipse 中创建\
  \ `lesson09/working_event.html`、`lesson09/js/working_event.js` 和 `lesson09/css/working_event.css`\
