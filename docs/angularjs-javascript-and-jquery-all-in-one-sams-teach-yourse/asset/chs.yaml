  \ `coord` 对象的 `easing` 属性设置。注意 `callback` 处理器会循环回 `reposition()` 函数。当没有更多剩余坐标时，将对球应用炸裂效果：\n\
  \n点击此处查看代码图片\n\n```javascript\nfunction reposition(){\n  if (coords.length){\n \
