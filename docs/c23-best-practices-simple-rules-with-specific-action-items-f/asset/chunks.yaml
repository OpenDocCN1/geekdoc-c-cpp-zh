    \   default: return \"unknown\";\n11   }\n12 }\n```\n\nFigure 104\\. `switch`\
    \ with `default` to avoid warnings\n\nBut this introduces a new problem\n\n```\n\
    \ 1 enum class Values {\n 2   val1,\n 3   val2,\n 4   val3 // added a new value\n\
    \ 5 };\n 6 \n 7 [[nodiscard]] constexpr std::string_view get_name(Values value)\
    \ {\n 8   switch (value) {\n 9   case Values::val1: return \"val1\";\n10   case\
    \ Values::val2: return \"val2\";\n11   default: return \"unknown\";\n12   }\n\
    13   // no compiler diagnostic that `val3` is unhandled\n14 }\n```\n\nFigure 105\\\
    . Unhandled case\n\nInstead, prefer code like this:\n\n```\n 1 enum class Values\
    \ {\n 2   val1,\n 3   val2,\n 4   val3 // added a new value\n 5 };\n 6 \n 7 [[nodiscard]]\
    \ constexpr std::string_view get_name(Values value) {\n 8   switch (value) {\n\
    \ 9   case Values::val1: return \"val1\";\n10   case Values::val2: return \"val2\"\
    ;\n11   } // unhandled enum value warning now\n12 \n13   return \"unknown\";\n\
    14 }\n```\n\nFigure 106\\. Prefered version\n\n| ![](styles/resources/leanpub_info-circle.png)\
    \ |  \n\nYou shouldn’t ever get an “unreachable code” warning in the above example\
    \ because the [range of valid values](#all_chapter_contents.xhtml_enum-range)\
    \ is nearly always larger than the values you have defined.\n\n |\n\n| ![](styles/resources/leanpub_key.png)\
    \ |  \n\nSome modern tools can detect these uses of `default` for you.\n\n |\n\
    \n| ![](styles/resources/leanpub_pencil.png) |  \n\n## Exercise: Look for `default:`\n\
    \n |\n\nWhat do you find in your code base? Did enabling warnings in previous\
    \ exercises find uses of `default:` for you already?\n\n| ![](styles/resources/leanpub_pencil.png)\
    \ |  \n\n## Exercise: Consider `std::unreachable.`\n\n |\n\n`std::unreachable`\
    \ (added in C++23) explicitly invokes Undefined Behavior if it is executed. It\
    \ can be used for the “unreachable” case of a switch statement, to ensure that\
    \ the compiler does the optimal thing.\n\nThis is potentially frightening. Do\
    \ you really want undefined behavior because it’s “impossible” for code to be\
    \ reached? Discuss this with your coworkers and consider where / when / if you\
    \ would use this tool. See the C++ Weekly episode in the resources for more details.\n\
    \n## 53.1: Resources\n\n*   [CppCon 2018: Jason Turner “Applied Best Practices”](https://youtu.be/DHOlsEd0eDE)\n\
    \n*   [C++ Weekly - Ep 393 - C++23’s std::unreachable](https://youtu.be/ohMyb4jPIAQ)*\
    \ [`-Wswitch-enum`](https://clang.llvm.org/docs/DiagnosticsReference.html#wswitch-enum)\n\
    \n*   [`-Wswitch`](https://clang.llvm.org/docs/DiagnosticsReference.html#wswitch)\n\
    \n# 54: Prefer Scoped `enums`\n\nC++11 introduced scoped enumerations, intended\
    \ to solve many of the common problems with `enum` inherited from C.\n\n```\n\
    \ 1 enum Choices {\n 2   option1 // value in the global scope\n 3 };\n 4 \n 5\
    \ enum OtherChoices {\n 6   option2\n 7 };\n 8 \n 9 int main() {\n10   int val\
    \ = option1;\n11   val = option2; // no warning\n12 }\n```\n\nFigure 107\\. C++98\
    \ `enum`s\n\n*   `enum Choices;`\n\n*   `enum OtherChoices;`\n\nThese two can\
    \ easily get mixed up, and they each introduce identifiers in the global namespace.\n\
    \n*   `enum class Choices;`\n\n*   `enum class OtherChoices;`\n\nThe values in\
    \ these enumerations are scoped and more strongly typed.\n\n```\n 1 enum class\
    \ Choices {\n 2   option1\n 3 };\n 4 \n 5 enum class OtherChoices {\n 6   option2\n\
    \ 7 };\n 8 \n 9 int main() {\n10   int val = option1; // cannot compile, need\
    \ scope\n11   int val2 = Choices::option1; // cannot compile, wrong type\n12 \
    \  Choices val = Choices::option1; // compiles\n13   val = OtherChoices::option2;\
    \ // cannot compile, wrong type\n14 }\n```\n\nFigure 108\\. C++11 scoped enumeration.\n\
    \nThese `enum class` versions cannot get mixed up without much effort, and their\
    \ identifiers are now scoped, not global.\n\n| ![](styles/resources/leanpub_pencil.png)\
    \ |  \n\n## Exercise: `enum struct` or `enum class`\n\n |\n\nDecide if you prefer\
    \ `enum struct` or `enum class` and develop a well-reasoned answer as to why.\n\
    \n| ![](styles/resources/leanpub_warning.png) |  \n\nMoving to scoped enumerations\
    \ will probably find many bugs in your code!\n\n |\n\n## 54.1: Resources\n\n*\
    \   [CppCon 2018: Victor Ciura “Better Tools in Your Clang Toolbox”](https://youtu.be/4X_fZkl7kkU)\
    \ (Discusses bugs found by moving to `enum class)`\n\n*   [cppreference.com Enumeration\
    \ Declaration](https://en.cppreference.com/w/cpp/language/enum)\n\n# 55: Prefer\
    \ `if constexpr` over SFINAE\n\nSFINAE is kind-of write-only code. `if constexpr`\
    \ doesn’t have the same flexibility, but use it when you can.\n\nLet’s take our\
    \ divide example last seen in [Prefer `auto` in Many Cases](#all_chapter_contents.xhtml_auto-return-divide-template):\n\
    \n```\n1 template<typename Numerator, typename Denominator>\n2 auto divide(Numerator\
    \ numerator, Denominator denominator)\n3 {\n4   return numerator / denominator;\n\
    5 }\n```\n\nFigure 109\\. C++14 divides template.\n\nWe now want to add different\
    \ behavior if we are doing integral division. Before C++17, we would have used\
    \ SFINAE (“Substitution Failure Is Not An Error”). Essentially this means that\
    \ if a function fails to compile, then it is removed from overload resolution.\n\
    \n```\n 1 #include <stdexcept>\n 2 #include <type_traits>\n 3 #include <utility>\n\
    \ 4 \n 5 template <typename Numerator, typename Denominator,\n 6           std::enable_if_t<std::is_integral_v<Numerator>\
    \ &&\n 7                            std::is_integral_v<Denominator>,\n 8     \
    \                       int> = 0>\n 9 auto divide(Numerator numerator, Denominator\
    \ denominator) {\n10   // is integer division\n11   if (denominator == 0) {\n\
    12     throw std::runtime_error(\"divide by 0!\");\n13   }\n14   return numerator\
    \ / denominator;\n15 }\n16 \n17 template <typename Numerator, typename Denominator,\n\
    18           std::enable_if_t<std::is_floating_point_v<Numerator> ||\n19     \
    \                       std::is_floating_point_v<Denominator>,\n20           \
    \                 int> = 0>\n21 auto divide(Numerator numerator, Denominator denominator)\
    \ {\n22   // is floating point division\n23   return numerator / denominator;\n\
    24 }\n```\n\nFigure 110\\. SFINAE `divide` function.\n\nThe `if constexpr` construct\
    \ in C++17 can simplify this code:\n\n```\n 1 import std;\n 2 \n 3 // note that\
    \ we could use `auto` for numerator and denominator\n 4 // but it would actually\
    \ complicate the if constexpr code\n 5 // by requiring that we use `decltype`\
    \ to get the type info\n 6 // back.\n 7 template <typename Numerator, typename\
    \ Denominator>\n 8 [[nodiscard]] constexpr auto divide(Numerator numerator, Denominator\
    \ de\\\n 9 nominator) {\n10   if constexpr (std::is_integral_v<Numerator> &&\n\
    11                 std::is_integral_v<Denominator>) {\n12     // is integral division\n\
    13     if (denominator == 0) {\n14         throw std::runtime_error(\"divide by\
    \ 0!\");\n15     }\n16   }\n17 \n18   return numerator / denominator;\n19 }\n\
    ```\n\nFigure 111\\. `if constexpr` option for compile time behavior change.\n\
    \n| ![](styles/resources/leanpub_key.png) |  \n\nConsider concepts over `if constexpr`\
    \ for readability in many cases\n\n |\n\n```\n 1 import std;\n 2 \n 3 // default\
    \ overload chosen\n 4 [[nodiscard]] constexpr auto divide(auto numerator, auto\
    \ denominator) {\n 5   return numerator / denominator;\n 6 }\n 7 \n 8 // version\
    \ called only if both parameters are integral\n 9 [[nodiscard]] constexpr auto\
    \ divide(\n10   std::integral auto numerator, std::integral auto denominator)\
    \ {\n11 \n12   // is integral division\n13   if (denominator == 0) {\n14     throw\
    \ std::runtime_error(\"divide by 0!\");\n15   }\n16 \n17   return numerator /\
    \ denominator;\n18 }\n```\n\nFigure 112\\. Constraints instead of `if constexpr`"
