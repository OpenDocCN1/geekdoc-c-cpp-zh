    ![](media/resources/title_page.png)


    ![C23 Best Practices](media/resources/title_page.png)


    # C23 Best Practices


    Jason Turner


    This book is for sale at `http://leanpub.com/cpp23_best_practices`. This version
    was published on 2024-01-01.


    [![publisher''s logo](media/resources/publisher-logo.png)](https://leanpub.com/)


    This is a `Leanpub` book. `Leanpub` empowers authors and publishers with the Lean
    Publishing process. `Lean Publishing` is the act of publishing an in-progress
    ebook using lightweight tools and many iterations to get feedback until you have
    the right book.


    ©2024 Jason Turner For my wife, Jen.


    ## Guide


    1. [Cover](text/cover.xhtml)


    # Part I: Introduction and Philosophy of Good C++


    ## Introduction To The C23 Edition


    It’s been about 3 years since I originally released the first edition of `Best
    Practices`. At the time of release, the book did not contain much information.
    I chose to release the `C++20` updates (known as `2nd Edition`) for free to anyone
    who purchased the `Leanpub` ebook.


    I considered releasing the `C++23` update as a free `3rd Edition`. However, as
    I considered the updates that needed to occur, I decided it was time for an entirely
    new release of the book. This new book is needed mainly because `C23` changes
    many fundamental things with how we use the language (such as standard library
    modules). The break from the previous version also allows me to reorganize the
    topics for better flow. I had avoided reorganization with any previous update
    (so coworkers would reference items and avoid confusion).


    I have updated every relevant section of this book to represent how code should
    look in `C23`, and reorganized many topics. Rest assured, this is a large update
    to the original `Best Practices` book!


    ## Introduction To The Original Edition


    My goal as a trainer and a contractor is to work myself out. I want everyone to:


    1. Learn how to experiment for themselves.

    2. Not just believe me, but test it.

    3. Learn how the language works.

    4. Stop making the same mistakes as the last generation.


    I’m thinking about changing my title from “C++ Trainer” to “C++ Guide.” I always
    adapt my courses and material to the class I currently have. We might agree on
    a class about `X`, but I change it to `Y` halfway through the first day to meet
    the organization’s needs.


    Along the way, we experiment and learn as a group. I often learn while teaching.
    Every group is unique; every class has new questions. Many of the questions I
    get in classes are the same ones repeatedly to the point where I get to look like
    a mind reader as I anticipate the next question that will be asked.


    Hence this book, and the Twitter thread that it came from, to help spread the
    word on the long-standing best practices.


    # About Best Practices


    Best Practices, quite simply, are about:


    1. Reducing common mistakes

    2. Finding errors quickly

    3. Without sacrificing (and often improving) performance


    ## Why Best Practices?


    ### Your Project Is Not Special


    If you are programming in `C++`, you, or someone at your company cares about performance.
    Otherwise, they’d probably be using some other programming language. I’ve been
    to many companies who all tell me they are special because they need to do things
    fast!


    Spoiler alert: they are all making the same decisions for the same reasons. There
    are very few exceptions. The outliers who make different decisions are the organizations
    that are already following the advice in this book.


    ## What’s The Worst That Can Happen?


    I don’t want to be depressing, but let’s take a moment to ponder the worst-case
    scenario if your project has a critical flaw.


    ### Game

    Serious flaws lead to remote vulnerabilities or attack vectors.


    ### Financial

    Serious flaws lead to [large amounts of lost money, accelerating trades, market
    crash](https://en.wikipedia.org/wiki/2010_flash_crash).


    ### Aerospace

    Serious flaws lead to lost spacecraft or [human life](https://spectrum.ieee.org/aerospace/aviation/how-the-boeing-737-max-disaster-looks-to-a-software-developer).


    ### Your Industry

    Serious flaws lead to… Lost money? Lost jobs? Remote hacks?


    ## Examples


    I don’t want to be depressing, but let’s take a moment to ponder the worst-case
    scenario if your project has a critical flaw.


