    \n# 38: Prefer Spaceships\n\nC++20 can generate any comparison operator for you\
    \ (colloquially knows as the “spaceship operator” because of its shape).\n\n*\
    \   If you define `==`, the compiler will automatically generate `!=`\n*   If\
    \ you define `<=>`, the compiler will generate all other comparisons (except for\
    \ `==` and `!=`)\n*   You can explicitly default any comparison operation\n\n\
    ```\n1 struct MyData\n2 {\n3   int i;\n4   int j;\n5 \n6   // provide all comparisons\n\
    7   friend auto operator<=>(const MyData &, const MyData &) = default;\n8 };\n\
    ```\n\nFigure 50. basic spaceship example\n\nThe C++ standard has started deprecating\
    \ explicit comparison operations, look to it for examples.\n\nNote that `std::string`,\
    \ for the sake of performance, has a custom implemented `operator==` (provides\
    \ `==` and `!=`) and `operator<=>` (provides the rest).\n\nhttps://en.cppreference.com/w/cpp/string/basic_string/operator_cmp\n\
    \n| ![](image) |  \n\nIf you provide a custom `operator<=>` for your type, the\
    \ compiler will not provide a `operator==` or `operator!=` for you! This is similar\
    \ to the “Rule of 0” and “Rule of 5” for special member functions.\n\n*   If you\
    \ provide a custom `operator<=>` you must provide your own `operator==`\n*   It\
    \ is unlikely that an explicitly defaulted `operator==` will do the correct thing\
    \ if you need a custom `operator<=>`\n\n| ![](image) |  \n\n## Exercise: Implement\
    \ a spaceship operator\n\n```\n 1 import std;\n 2 \n3 struct Container\n4 {\n\
    \ 5   // fixed-capacity container.\n6   std::array<int, 10> data;\n 7 \n8   //\
    \ size is the number of currently used elements\n 9   std::size_t size;\n10 \n\
    11   // what does the comparison operator need to look like?\n12   // will a defaulted\
    \ one work?\n13   // do we need a custom operator==?\n14 };\n```\n\nFigure 51.\
