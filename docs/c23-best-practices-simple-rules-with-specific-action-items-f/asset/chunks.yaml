  raw: "| ![](styles/resources/leanpub_info-circle.png) |  \n\nThe code inside the\
    \ `if constexpr` block must still be syntactically correct. `if constexpr` is\
    \ not the same as a `#define.`\n\n |\n\n| ![](styles/resources/leanpub_key.png)\
    \ |  \n\nCode that you might normally choose to put outside of the `if` block\
    \ might now need to live inside of the `else` to make sure it is not instantiated\
    \ with invalid types\n\n |\n\n| ![](styles/resources/leanpub_pencil.png) |  \n\
    \n## Exercise: Look into “design by introspection”\n\n |\n\nThe combination of\
    \ `if constexpr,` concepts, and `requires` results in a very powerful, almost\
    \ reflection-like capability.\n\n```\n 1 constexpr void add_values(auto &container,\
    \ auto first, auto second)\n 2 {\n 3   // we ask, at compile time, if this container\n\
    \ 4   // has a reserve and a size member.\n 5   if constexpr(requires {container.reserve(container.size()\
    \ + 2); }) {\n 6     // if this is a valid operation, then perform it at runtime\n\
    \ 7     container.reserve(container.size() + 2);\n 8   }\n 9 \n10   // either\
    \ way, add the values\n11   container.push_back(first);\n12   container.push_back(second);\n\
    13 }\n```\n\nFigure 113\\. 'Design by Introspection' example\n\n## 55.1: Resources\n\
    \n*   [C++ Weekly Special Edition: Using C++17’s constexpr if](https://youtu.be/_Ny6Qbm_uMI)\n\
    \n*   [C++ Weekly - Ep 122 - `constexpr` with `optional` and `variant`](https://youtu.be/2eCV_udkP_o)\n\
    \n*   [CppCon 2017: Jason Turner “Practical C++17”](https://youtu.be/nnY4e4faNp0)\n\
    \n*   [C++ Weekly - Ep 242 - Design By Introspection in C++20](https://youtu.be/sy32kAtsIKg)\n\
    \n*   [C++17 In Tony Tables: `constexpr if`](https://github.com/tvaneerd/cpp17_in_TTs/blob/master/if_constexpr.md)\n\
    \n# 56: De-template-ize Your Generic Code\n\nMove things outside of your templates\
    \ when you can. Use other functions. Use base classes. The compiler is still free\
    \ to inline them or leave them out of line.\n\nDe-template-ization will improve\
    \ compile times and reduce binary sizes. Both are helpful. It also eliminates\
    \ the thing that people think of as “template code bloat” (which IMO [doesn’t\
    \ exist](https://articles.emptycrate.com/2008/05/06/nobody_understands_c_part_5_template_code_bloat.html))\
    \ (article formatting got broken at some point, sorry).\n\n```\n1 template<typename\
    \ T>\n2 constexpr void do_things()\n3 {\n4   // this lambda must be generated\
    \ for each\n5   // template instantiation\n6   auto lambda = [](){ /* some lambda\
    \ that doesn't capture */ };\n7   auto value = lambda();\n8 }\n```\n\nFigure 114\\\
    . A new lambda for each function template instantiation.\n\nCompared to:\n\n```\n\
    1 constexpr auto some_function() { /* do things*/ }\n2 \n3 template<typename T>\n\
    4 constexpr void do_things()\n5 {\n6   auto value = some_function();\n7 }\n```\n\
    \nFigure 115\\. Shared logic between template instantiations.\n\nNow only one\
    \ version of the inner logic is compiled, and it’s up to the compiler to decide\
    \ if they should be inlined.\n\nSimilar techniques apply to base classes and templated\
    \ derived classes.\n\n| ![](styles/resources/leanpub_pencil.png) |  \n\n## Exercise:\
    \ Bloaty McBloatface and `-ftime-trace.`\n\n |\n\nWe’re getting more and more\
    \ tools available to look for bloat in our binaries and analyze compile times.\
    \ Look into these tools and other tools available on your platform.\n\nRun them\
    \ against your binary and see what you find.\n\nWhen using clang’s `-ftime-trace,`\
    \ also look into ClangBuildAnalyzer.\n\n## 56.1: Resources\n\n*   [Templight](https://github.com/mikael-s-persson/templight)\n\
    \n*   [C++ Weekly Ep 89: “Overusing Lambdas”](https://youtu.be/OmKMNQFx_8Y)\n\n\
    *   [C++ Weekly Christmas Class 2019 - Chapter 3](https://www.youtube.com/watch?v=VEqOOKU8RjQ&list=PLs3KjaCtOwSY_Awyliwm-fRjEOa-SRbs-&index=16)\
    \ (This is the first episode of chapter 3, and it introduces the question of how\
    \ and why two different [options differ](https://godbolt.org/z/b4znvK). The next\
    \ several episodes in that playlist give some background, and the start of chapter\
    \ 4 gives the answers. It is very much related to template bloat questions.)\n\
    \n*   Effective C++ (3rd Edition) Item 44 - Factor parameter-independent code\
    \ out of templates\n\n# 57: Use Lippincott Functions\n\nSame arguments as [de-template-izing](#all_chapter_contents.xhtml_de-template-ize-your-code)\
    \ your code: This is a do-not-repeat-yourself principle for exception handling\
    \ routines.\n\nIf you have many different exception types to handle, you might\
    \ have code that looks like this:\n\n```\n 1 void use_thing() {\n 2   try {\n\
    \ 3     do_thing();\n 4   } catch (const std::runtime_error &) {\n 5     // handle\
    \ it\n 6   } catch (const std::exception &) {\n 7     // handle it\n 8   }\n 9\
    \ }\n10 \n11 void use_other_thing() {\n12   try {\n13     do_other_thing();\n\
    14   } catch (const std::runtime_error &) {\n15     // handle it\n16   } catch\
    \ (const std::exception &) {\n17     // handle it\n18   }\n19 }\n```\n\nFigure\
    \ 116\\. Duplicated exception handling.\n\nA Lippincott function (named after\
    \ Lisa Lippincott) provides a centralized exception handling routine.\n\n```\n\
    \ 1 void handle_exception() {\n 2   try {\n 3     throw; // re-throw exception\
    \ already in flight\n 4   } catch (const std::runtime_error &) {\n 5   } catch\
    \ (const std::exception &) {  }\n 6 }\n 7 \n 8 void use_thing() {\n 9   try {\n\
    10     do_thing();\n11   } catch (...) {\n12     handle_exception();\n13   }\n\
    14 }\n15 \n16 void use_other_thing() {\n17   try {\n18     do_other_thing();\n\
    19   } catch (...) {\n20     handle_exception();\n21   }\n22 }\n```\n\nFigure\
    \ 117\\. Lippincott de-duplicated exception handling.\n\nThis technique is not\
    \ new - it has been available since the pre-C++98 days.\n\n| ![](styles/resources/leanpub_pencil.png)\
    \ |  \n\n## Exercise: Do You Use Exceptions?\n\n |\n\nIf your project uses exceptions,\
    \ there’s probably some ground for simplifying and centralizing your error handling\
    \ routines. If it does not use exceptions, then you likely have other types of\
    \ error handling routines that are duplicated. Can these be simplified?\n\n##\
    \ 57.1: Resources\n\n*   [C++ Secrets: Using a Lippincott Function for Centralized\
    \ Exception Handling](https://cppsecrets.blogspot.com/2013/12/using-lippincott-function-for.html)\n\
    \n*   [C++ Weekly Ep 91: Using Lippincott Functions](https://youtu.be/-amJL3AyADI)\n\
    \n# 58: No More `new!`\n\nYou’re already [avoiding the heap](#all_chapter_contents.xhtml_prefer-stack-over-heap)\
    \ and using smart pointers for resource management, right?!\n\nTake this to the\
    \ next level and be sure to use [`std::make_unique<>()`](https://en.cppreference.com/w/cpp/memory/unique_ptr/make_unique)\
    \ (C++14) in the rare cases that you need the heap.\n\nIn the very rare cases\
    \ you need shared ownership, use [`std::make_shared<>()`](https://en.cppreference.com/w/cpp/memory/shared_ptr/make_shared)\
    \ (C++11).\n\n| ![](styles/resources/leanpub_pencil.png) |  \n\n## Exercise: Do\
    \ you use Qt or some other widget library?\n\n |\n\nHave you ever thought about\
    \ writing your own `make_qobject` helper? Give it the semantics you need and be\
    \ sure to use `[[nodiscard]].`\n\nIn any case, you can limit your use of `new`\
    \ to a few core library helper functions.\n\n| ![](styles/resources/leanpub_pencil.png)\
    \ |  \n\n## Exercise: Use clang-tidy modernize fixes.\n\n |\n\nWith clang-tidy,\
    \ you can automatically convert `new` statements into `make_unique<>` and `make_shared<>`\
    \ calls. Be sure to use `-fix` to apply the change after it’s been discovered.\n\
    \n## 58.1: Resources\n\n*   [clang-tidy modernize-make-shared](https://clang.llvm.org/extra/clang-tidy/checks/modernize-make-shared.html)\n\
    \n*   [clang-tidy modernize-make-unique](https://clang.llvm.org/extra/clang-tidy/checks/modernize-make-unique.html)\n\
    \n# 59: Avoid `std::bind` and `std::function`\n\nWhile compilers continue to improve\
    \ and the optimizers work around these types’ complexity, it’s still very possible\
    \ for either to add considerable compile-time and runtime overhead.\n\nC++14 lambdas,\
    \ with generalized capture expressions, are capable of the same things that `std::bind`\
    \ is capable of.\n\n| ![](styles/resources/leanpub_key.png) |  \n\n`std::function`\
    \ is not `constexpr` enabled, which is another reason it might need to be avoided\
    \ in your code.\n\n |"
