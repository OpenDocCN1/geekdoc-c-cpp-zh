    \ see how much could be saved if build times were lessened.\n\n## 62.2: Resources\n\
    \n* [A guide to unity builds](https://onqtam.com/programming/2018-07-07-unity-builds/)\n\
    * [Unity builds with Meson](https://mesonbuild.com/Unity-builds.html)\n* [Unity\
    \ builds with CMake](https://cmake.org/cmake/help/latest/prop_tgt/UNITY_BUILD.html)\n\
    * [PCH with Meson](https://mesonbuild.com/Precompiled-headers.html)\n* [PCH with\
    \ CMake](https://cmake.org/cmake/help/latest/command/target_precompile_headers.html)\n\
    * [ccache](https://ccache.dev/)\n* [CMake Compiler Launcher](https://cmake.org/cmake/help/latest/prop_tgt/LANG_COMPILER_LAUNCHER.html?highlight=ccache)\n\
    * [Clang Build Analyzer](https://github.com/aras-p/ClangBuildAnalyzer)\n* [Getting\
    \ started with C++ Build Insights](https://docs.microsoft.com/en-us/cpp/build-insights/get-started-with-cpp-build-insights?view=vs-2019)\n\
    * [Introducing vcperf /timetrace for C++ build time analysis](https://devblogs.microsoft.com/cppblog/introducing-vcperf-timetrace-for-cpp-build-time-analysis/)\n\
    \n## 63: Continue Your C++ Education\n\nYou must continually learn if you want\
    \ to become better at what you do, and many resources are available to you to\
    \ continue your C++ education.\n\n### 63.1: Know How To Ask Questions\n\nKate\
    \ Gregory has published an [excellent article on how to ask questions](http://www.gregcons.com/KateBlog/HowToAskForCCodingHelp.aspx).\n\
    \nSome key points are:\n\n* Don’t use screenshots\n* Use good variable names\n\
    * Add some tests\n* Listen to what people are telling you\n\n### 63.2: Conferences\
    \ And Local User Groups\n\nThere is almost certainly one near you. It’s a great\
    \ way to network and learn new things. Check out the [ISO C++ Conferences Worldwide\
    \ List](https://isocpp.org/wiki/faq/conferences-worldwide) and [Meeting C++’s\
    \ User Groups List](https://meetingcpp.com/usergroups/).\n\nI am finishing this\
    \ book during the global COVID-19 pandemic. So conferences and user groups are\
    \ mostly on hold right now. But this presents an attractive new opportunity for\
    \ many.\n\nMany of those conferences and user groups are now meeting online. It’s\
    \ now possible for us all to attend each other’s user groups. The [North Denver\
