    \ this, and I won’t be the last. I think this concept is now well accepted, but\
    \ I still see learners of C++ focusing on “OOP.”\n\nBjarne Stroustrup in *The\
    \ C++ Programming Language 3rd Edition* states:\n\n> C++ is a general-purpose\
    \ programming language with a bias towards systems programming that\n\n> \n\n\
    > *   is a better C,\n> *   supports data abstraction,\n> *   supports object-oriented\
