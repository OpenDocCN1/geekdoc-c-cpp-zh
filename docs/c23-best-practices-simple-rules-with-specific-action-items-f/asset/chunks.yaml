    \n*   [C++Now 2017: Jonathan Müller “Type-safe Programming”](https://youtu.be/iihlo9A2Ezw)\n\
    \n# 29: Use `[[nodiscard]]` Liberally\n\n`[[nodiscard]]` is a C++ attribute that\
    \ tells the compiler to warn if a return value is ignored. It can be used on functions:\n\
    \n```\n1 [[nodiscard]] int get_value();\n2 \n3 int main()\n4 {\n5   // warning,\
    \ [[nodiscard]] value ignored\n6   get_value();\n7 }\n```\n\nFigure 22\\. `[[nodiscard]]`\
    \ example usage.\n\nAnd on types:\n\n```\n1 struct [[nodiscard]] ErrorCode{};\n\
    2 \n3 ErrorCode get_value();\n4 \n5 int main()\n6 {\n7   // warning, [[nodiscard]]\
    \ value ignored\n8   get_value();\n9 }\n```\n\nFigure 23\\. `[[nodiscard]]` on\
    \ types.\n\nC++20 adds the ability to provide a description.\n\n```\n1 [[nodiscard(\"\
    Ignoring this result leaks resources\")]]\n```\n\nFigure 24\\. C++20's `[[nodiscard]]`\
    \ with description.\n\nOur `divide` example is a straightforward application of\
    \ `[[nodiscard]].`\n\n```\n 1 import std;\n 2 \n 3 [[nodiscard]] constexpr auto\
    \ divide(std::integral auto numerator,\n 4                                   \
    \  std::integral auto denominator) {\n 5   // is integer division\n 6   if (denominator\
    \ == 0) {\n 7     throw std::runtime_error(\"divide by 0!\");\n 8   }\n 9   return\
    \ numerator / denominator;\n10 }\n11 \n12 [[nodiscard]] constexpr auto divide(auto\
    \ numerator, auto denominator) {\n13   // is floating point division\n14   return\
    \ numerator / denominator;\n15 }\n```\n\nFigure 25\\. `[[nodiscard]]` applied\
    \ to `divide` function.\n\nAnd constructor:\n\n```\n 1 struct Holder\n 2 {\n 3\
    \   // warn if the result of this constructor is unused\n 4   [[nodiscard]] Holder()\
