    \n## 29.1: Resources\n\n*   [“An Argument Pro Liberal Use Of nodiscard”](https://www.reddit.com/r/cpp/comments/9us7f3/an_argument_pro_liberal_use_of_nodiscard/)\n\
    \n*   [C++ Weekly Ep 30: C++17’s `[[nodiscard]]` Attribute](https://youtu.be/l_5PF3GQLKc)\n\
    \n*   [C++ Weekly Ep 199: C++20’s `[[nodiscard]]` Constructors And Their Uses](https://youtu.be/E_ROB_xUQQQ)\n\
    \n# 30: Forget Header Files Exist\n\nC++23 has full support for C++ modules, and\
    \ the standard library is now mandated to provide modules.\n\n```\n1 #include\
    \ <string>\n2 #include <vector>\n3 #include <map>\n4 \n5 int main()\n6 {\n7  \
    \ std::map<int, std::vector<std::string>> data;\n8   // do stuff\n9 }\n```\n\n\
    Figure 27\\. Before C++23 Modules\n\n```\n1 import std;\n2 \n3 int main()\n4 {\n\
    5   std::map<int, std::vector<std::string>> data;\n6   // do stuff\n7 }\n```\n\
    \nFigure 28\\. After C++23 Modules\n\nEvidence from Microsoft, who, at the time\
    \ of the writing of this section, has the most complete modules implementation,\
    \ shows that this is actually considerably faster than including header files.\n\
    \n| ![](styles/resources/leanpub_info-circle.png) |  \n\nImporting a module is\
    \ basically “free”\n\n |\n\nNo code has to be immediately parsed when a module\
    \ is included, so there’s effectively no cost, which is why it’s OK that the entire\
    \ standard library is now included under a single `import` directive\n\n| ![](styles/resources/leanpub_warning.png)\
    \ |  \n\nThis is a very basic (but complete) example of defining a C++20 module.\
    \ See the resources for more information about actually using modules.\n\n |\n\
    \n```\n 1 // my_module.ixx\n 2 export module my_module;\n 3 \n 4 import std;\n\
    \ 5 \n 6 // I'm only exporting the float overload\n 7 export constexpr [[nodiscard]]\
    \ float calc(float val) noexcept\n 8 {\n 9   return val * 10.1f;\n10 }\n11 \n\
    12 export void greet(std::string_view name);\n```\n\nFigure 29\\. Very basic .ixx\
    \ module interface file\n\n```\n1 // my_module.cpp\n2 module my_module;\n3 \n\
    4 import std;\n5 \n6 void greet(std::string_view name)\n7 {\n8   std::println(\"\
    Hello {}\", name};\n9 }\n```\n\nFigure 30\\. Very basic .cpp module implementation\
    \ file\n\n```\n1 import my_module;\n2 \n3 int main()\n4 {\n5   greet(\"Jason\"\
    );\n6 }\n```\n\nFigure 31\\. Very basic module usage\n\n## 30.1: Resources"
