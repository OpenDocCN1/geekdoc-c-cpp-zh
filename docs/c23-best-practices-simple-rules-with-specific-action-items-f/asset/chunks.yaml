  trans: "\n从技术上讲，导致未定义行为（UB）的并不是这个检查。但是这个检查永远是不可能失败的。如果 `this` 是 `nullptr`，你就会处于未定义行为状态。人们以前经常这样做，但它一直一直是\
    \ UB。你不能在对象的生命周期之外访问它。现在的编译器总是会移除这个检查。\n\n理论上，`this` 可能为 `null` 的唯一方法是当你直接在一个空指针对象上调用成员函数时。\n\
    \n| ![](img/leanpub_warning.png) |  \n\n后面是反面示例，请不要重复。\n\n```\n1 Type *obj = nullptr;\n\
    2 obj->do_thing(); // 永远不要这样做\n```\n\n图 3. 在 `nullptr` 上调用成员的错误示例。\n\n即使在（技术上可行，但永远不要这样做）的调用\
    \ `delete this` 场景下，也是如此。\n\n```cpp\n 1 struct S {\n 2   std::string data;\n 3\
    \ \n4   void delete_yourself() {\n5     // 执行一些操作\n6     delete this; // 技术上可行\n\
    \ 7 \n8     if (this) {\n9       // 这个块将始终被执行，没有任何变化\n10       // 我们对 `this` 的视图\n\
    11     }\n12     \n13     // 永远不要这样做\n14     data.size(); // UB，data 的生命周期已经结束\n\
    15   }\n16 };\n```\n\n图 4. `delete this` 的错误示例。\n\n在现代编译器上，不存在任何一种情况下对 `if (this)`\
    \ 的检查会返回 `false`。\n\n| ![](img/leanpub_pencil.png) |  \n\n## 练习：你会检查 `this` 是否为\
    \ `nullptr` 吗？\n\n对 `nullptr` 的检查可能伪装成对 `NULL` 的检查或对 `0` 的检查。对 `this` 是否为 `NULL`\
    \ 的检查可能只存在非常旧的代码库中。确保你开启了警告，然后寻找这些情况。\n\n在你的代码库中搜索 `this ==` 可能是很有趣的，看看那里存在什么奇怪的事情。\n\
    \n## 12.1: 资源\n\n*   [迁移到 GCC-6 优化移除了对 `this` 的空指针检查](https://www.gnu.org/software/gcc/gcc-6/porting_to.html#this-cannot-be-null)\n\
    \n# 13: 永远不要测试引用是否为 `nullptr`，那是 UB\n\n```cpp\n1 int get_value(int &thing) {\n\
    2   if (&thing == nullptr) {\n3     // 被编译器移除 \n4     return 42;\n5   } else {\n\
    6     return thing;\n7   }\n8 }\n```\n\n图 5. 对 `null` 引用的测试被移除了\n\n创建一个空引用是 UB，不要尝试。始终假设引用指向一个有效的对象。在设计\
    \ API 时，利用这一事实来让自己占优势（（#all_chapter_contents.xhtml_make-interfaces-hard-to-use-wrong）。\n\
    \n| ![](img/leanpub_pencil.png) |  \n\n## 练习：检查对象地址的检查\n\n使用 `&thing ==` 检查对象的特定地址有很多有效的用例，但也有许多方法可以让这种检查是错误的。\n\
    \n搜索你的代码中检查对象内存地址的语句，并理解它们在做什么以及是如何工作的（或者是否工作）。\n\n| ![](img/leanpub_question-circle.png)\
    \ |  \n\n除了 `==` 之外，还可以通过其他方法检查对象的地址？\n\n这个练习让你在使用各种搜索/grep 工具以及玩正则表达式方面获得很棒的经验。\n\
    \n## 13.1: 资源\n\n*   [-Wtautological-undefined-compare](https://clang.llvm.org/docs/Diagnostics.html#tautological-undefined-compare)\
    \ （注：此处原文链接可能不完整，已根据语境补全）\n\n# Part II: 使用工具\n\n# 14: 使用工具：自动化测试\n\n你需要一个命令来运行测试。如果你没有自动化测试，那么维护质量是不可能的。\n\
    \n以下是常用的测试框架：\n\n*   [Catch2](https://github.com/catchorg/catch2) - 流行的框架，源自 [Martin\
    \ Hoenestrup](https://github.com/hoenestrup) 和 [Petr Horenovský]。\n*   [doctest](https://github.com/doctest/doctest)\
    \ - 与 Catch2 类似，但更轻量。\n*   [Google Test](https://github.com/google/googletest)\
    \ - 谷歌出品。\n*   [Boost.Test](https://www.boost.org/doc/libs/1_84_0/libs/test_framework/index.html)\
    \ - Boost 标准。\n\n`ctest`(https://cmake.org/ctest.html) 是 CMake 的测试运行器，可以与上述任何框架配合使用。理想的\
    \ CMake 构建流程看起来像这样：\n\n```\n1 cmake -S src -B builddir -G <Generator>\n2 cmake\
    \ --build builddir --config <Configuration>\n3 cd builddir\n4 ctest -C <Configuration>\n\
    ```\n\n图 6. 可能的构建测试步骤。\n\n没有自动化测试，你无法维护项目质量。\n\n在我职业生涯处理过的 C++ 项目中，我不得不支持某些组合：\n\
    \n*   x86\n*   x64\n*   SPARC\n*   ARM\n*   MIPS\n\n*   Windows\n*   Solaris\n\
    *   MacOS\n*   Linux\n\n当你开始在多个平台组合多个编译器时，某个平台上的重大更改可能会破坏一个或多个平台。\n\n为了解决这个问题，为你的项目开启带有测试的持续构建。\n\
    \n*   测试你支持的所有平台\n*   分别测试 Debug 和 Release\n*   测试所有配置选项\n*   针对比你支持的新版本的编译器进行测试\n\
    \n| ![](img/leanpub_info-circle.png) |  \n\nSanitizers 只能对未被优化器移除的代码注入，但优化器有时会利用\
    \ UB，因此你至少需要 Debug、Debug + Sanitizers、Release、Release + Sanitizers，至少在一个平台上！\n\
    \n| ![](img/leanpub_key.png) |  \n\n如果你不要求 100% 的测试通过，你永远不知道代码的状态。\n\n| ![](img/leanpub_pencil.png)\
    \ |  \n\n## 练习：开启持续构建\n\n了解你组织目前的持续构建环境。如果不存在，建立它的障碍是什么？为你的项目设置类似 GitLab、GitHub\
    \ Actions、Appveyor 或 Travis 有多困难？\n\n# 16: 使用工具：编译器警告\n\n你有许多没有使用的警告，其中绝大多数是有益的。`-Wall`\
    \ 并不是 GCC 和 Clang 上的所有警告。`-Wextra` 仅仅是触及表面！\n\n| ![](img/leanpub_info-circle.png)\
    \ |  \n\n`/Wall` 在 MSVC 上是所有的警告。我们的编译器编写者建议在 MSVC 上使用 `/Wall` 或在 Clang 上使用 `-Weverything`，因为其中许多是不可操作的诊断性警告。GCC\
    \ 没有提供等效方案。\n"
- fmt: "\nStrongly consider `-Wpedantic` (GCC/Clang). This command line options disable\
    \ language extensions and get you closer to the C++ standard. The more warnings\
    \ you enable today, the easier time you will have with porting to another platform\
    \ in the future.\n\n| ![](styles/resources/leanpub_info-circle.png) |  \n\nAs\
    \ of C++20 mode in MSVC `/permissive-` is no longer necessary, it is now the default\
    \ setting for `cl.exe`.\n\n| ![](styles/resources/leanpub_pencil.png) |  \n\n\
    ## Exercise: Enable More Warnings\n\n1. Explore the set of warnings available\
    \ with your compiler. Enable as many as you can.\n2. Fix the new warnings generated.\n\
    3. Goto 1.\n\n| ![](styles/resources/leanpub_info-circle.png) |  \n\nMSVC has\
    \ an excellent set of warnings that can be enabled by warning level. You can start\
    \ with `/W1` and work your way up to `/W4` as you fix each set of warnings.\n\n\
    This process will feel tedious and meaningless, but these warnings will catch\
    \ real bugs.\n\n| ![](styles/resources/leanpub_pencil.png) |  \n\n## Exercise:\
    \ Discuss enabling `-Werror` or `-WX` on your CI to ensure warnings do not accumulate.\n\
    \nK> I’ve observed that you need “Warnings as Errors” enabled on both developer\
    \ machines and CI, otherwise developers treat the CI as their enemy, and they\
    \ disable more and more warnings!\n\n## 16.1: Resources\n\n* [C++ Best Practices\
    \ website curated list of warnings](https://github.com/lefticus/cppbestpractices/blob/master/02-Use_the_Tools_Available.md#compilers)\n\
    * [GCC’s full warning list](https://gcc.gnu.org/onlinedocs/gcc/Warning-Options.html)\n\
    * [Clang’s full warning list](https://clang.llvm.org/docs/DiagnosticsReference.html)\n\
    * [MSVC’s Compiler warnings that are off by default](https://docs.microsoft.com/en-us/cpp/preprocessor/compiler-warnings-that-are-off-by-default?view=vs-2019)\n\
    * [C++ Weekly Ep 168 - Discovering Warnings You Should Be Using](https://youtu.be/IOo8gTDMFkM)\n\
    \n# 17: Use the Tools: Static Analysis\n\nStatic analysis tools are tools that\
    \ analyze your code without compiling or executing it. Your compiler is one such\
    \ tool and your first line of defense.\n\nMany such tools are free and some are\
    \ free for open source projects.\n\n`cppcheck` and `clang-tidy` are two popular\
    \ and free tools with major IDE and editor integration.\n\n| ![](styles/resources/leanpub_pencil.png)\
    \ |  \n\n## Exercise: Enable More Static Analysis\n\nVisual Studio: look into\
    \ Microsoft’s static analyzer that ships with it. Consider using `Clang Power\
    \ Tools`. Download `cppcheck`’s addon for visual studio.\n\nCMake: Enable `cppcheck`\
    \ and `clang-tidy` integration\n\n| ![](styles/resources/leanpub_pencil.png) |\
    \  \n\n## Exercise: Enable Static Analysis in Your IDE\n\nMost modern IDEs have\
    \ built in support for `clang-tidy` and other static analysis tools. Investigate\
    \ how to enable that support and configure your `.clang-tidy` file to have the\
    \ analysis enabled that is appropriate for your project.\n\n## 17.1: Resources\n\
    \n* [cppbestpractices.com list of static analyzers](https://github.com/lefticus/cppbestpractices/blob/master/02-Use_the_Tools_Available.md#static-analyzers)\n\
    \n# 18: Use The Tools: Consider Custom Static Analysis\n\nRemember to focus on\
    \ [making your interface hard to use wrong](#all_chapter_contents.xhtml_make-interfaces-hard-to-use-wrong).\
    \ Then, as a second line of defense, consider writing your own static analysis.\n\
    \nThese might take the form of:\n\n* [custom clang-tidy analysis](https://clang.llvm.org/extra/clang-tidy/Contributing.html)\n\
    * using `clang-query` to query the [AST](https://clang.llvm.org/docs/LibASTMatchersReference.html)\
    \ of your project for common errors\n* writing a [custom rule](https://sourceforge.net/projects/cppcheck/files/Articles/)\
    \ for `cppcheck`\n* [CodeQL](https://codeql.github.com/) custom check\n\n| ![](styles/resources/leanpub_pencil.png)\
    \ |  \n\n## Exercise: Look for common coding errors.\n\nSimply discuss common\
    \ issues you see in your code base with other members of your team. See if you\
    \ can isolate one or two common issues that a custom analysis check would be able\
    \ to find. Implement a check with one of the above tools.\n\n## 18.1: Resources\n\
    \n* [Lightning Talk: Using Clang Query to Isolate AST Elements - Kristen Shaker\
    \ - C++ on Sea 2022](https://youtu.be/2LOxsfpCCyI)\n* [Database of custom cppcheck\
    \ rules to study](https://github.com/embeddedartistry/cppcheck-rules)\n* [CodeQL\
    \ Tutorials](https://codeql.github.com/docs/writing-codeql-queries/ql-tutorials/)\n\
    \n# 19: Use the Tools: Sanitizers\n\nThe sanitizers are runtime analysis tools\
    \ for C++ and are built into GCC, Clang, and MSVC.\n\nIf you are familiar with\
    \ Valgrind, the sanitizers provide similar functionality but many orders of magnitude\
    \ faster than Valgrind.\n\nAvailable sanitizers are:\n\n* Address (ASan)\n* Undefined\
    \ Behavior (UBSan) (More on Undefined Behavior later)\n* Thread\n* DataFlow (use\
    \ for code analysis, not finding bugs)\n* Lib Fuzzer (addressed in a later chapter)\n\
    \nAddress sanitizer, UB Sanitizer, Thread sanitizer can find many issues almost\
    \ like magic. Support is currently increasing in MSVC at the time of this book’s\
    \ writing, while GCC and Clang have more established support for the sanitizers.\n\
    \n[John Regehr](https://twitter.com/johnregehr) recommends always enabling ASan\
    \ and UBSan during development.\n\nWhen an error such as an out of bounds memory\
    \ access occurs, the sanitizer will give you a report of what conditions led to\
    \ the failure, often with suggestions for fixing the problem.\n\nYou can enable\
    \ Address and Undefined Behavior sanitizers with a command similar to:\n\n```\n\
    1 gcc -fsanitize=address,undefined <filetocompile>\n```\n\nFigure 7\n\nSanitizers\
    \ must also be enabled during the linking phase of the project build.\n\n| ![](styles/resources/leanpub_info-circle.png)\
    \ |  \n\nExamples for how to use sanitizers exist in the [C++ Template](https://github.com/cpp-best-practices/cmake_template).\n\
    \nK> Remember to combine Debug, Release, Sanitizers-on, and Sanitizers-off builds,\
    \ as each combination can expose different issues.\n\n| ![](styles/resources/leanpub_pencil.png)\
    \ |  \n\n## Exercise: Enable Sanitizers\n\n* Investigate how to add sanitizer\
    \ support for your existing project\n* Enable ASan first\n* Run the full test\
    \ suite and investigate any problems found\n* Enable UBSan second\n* Run full\
    \ test suite again\n\nEnd goal: get all tests running with ASan, and UBSan enabled\
    \ on your environment.\n\n| ![](styles/resources/leanpub_pencil.png) |  \n\n##\
    \ Exercise: Fallback to Valgrind or Dr Memory\n\nIf you are unable to run ASan\
    \ and UBSan on your environment, investigate running your test suite with either\
    \ Dr Memory (Windows/Linux/MacOS) or Valgrind (Linux/MacOS).\n\n## 19.1: Resources\n\
    \n* [AddressSanitizer (ASan) for Windows with MSVC](https://devblogs.microsoft.com/cppblog/addresssanitizer-asan-for-windows-with-msvc/)\n\
    * [Sanitizers source and documentation on GitHub](https://github.com/google/sanitizers)\n\
    * [Clang AddressSanitizer documentation](https://clang.llvm.org/docs/AddressSanitizer.html)\n\
    * [Clang UndefinedBehaviorSanitizer documentation](https://clang.llvm.org/docs/UndefinedBehaviorSanitizer.html)\n\
    \n# 20: Use The Tools: Hardening\n\nSafety is important in many industries, and\
    \ with many products. If safety and security are your main concerns, you should\
    \ consider shipping your binaries with hardening.\n\nTBD FILL OUT\n\n| ![](styles/resources/leanpub_pencil.png)\
    \ |  \n\n## Exercise: Consider UBSan Minimal Runtime\n\nThe “minimal runtime”\
    \ version of UBSan is designed for binary hardening.\n\n# 21: Use the Tools: Multiple\
    \ Compilers\n\nSupport *at least* 2 compilers on your platform. Each compiler\
    \ does different analyses and implements the standard in a slightly different\
    \ way.\n\nIf you use Visual Studio, you should be able to switch between `clang`\
    \ and `cl.exe` relatively easily. You can also use WSL and enable remote Linux\
    \ Builds.\n\nIf you use Linux, you should be able to switch between GCC and Clang\
    \ easily.\n\n| ![](styles/resources/leanpub_warning.png) |  \n"
