  trans: "\n\n如果你开启了所有的警告，那么你可能会在这里得到一个“并非所有代码路径都返回返回值”的警告。这在技术上是正确的。我们可以调用 `get_name(static_cast<Values>(15))`\
    \ 且不会违反 C++ `[dcl.enum/5]` 的任何部分，除了函数未返回值的导致的未定义行为（Undefined Behavior）之外。\n\n\
    你可能会忍不住想像这样修复这段代码：\n\n```cpp\n 1 enum class Values {\n 2   val1,\n 3   val2\n\
    \ 4 };\n 5 \n 6 [[nodiscard]] constexpr std::string_view get_name(Values value)\
    \ {\n 7   switch (value) {\n 8   case Values::val1: return \"val1\";\n 9   case\
    \ Values::val2: return \"val2\";\n10   default: return \"unknown\";\n11   }\n\
    12 }\n```\n图 104. 使用 `default` 的 `switch` 以避免警告\n\n但这引入了一个新问题\n\n```cpp\n 1 enum\
    \ class Values {\n 2   val1,\n 3   val2,\n 4   val3 // 添加了一个新值\n 5 };\n 6 \n 7\
    \ [[nodiscard]] constexpr std::string_view get_name(Values value) {\n 8   switch\
    \ (value) {\n 9   case Values::val1: return \"val1\";\n10   case Values::val2:\
    \ return \"val2\";\n11   default: return \"unknown\";\n12   }\n13   // 编译器没有对\
    \ `val3` 未被处理进行诊断\n14 }\n```\n图 105. 未处理的情况\n\n相反，优于如下代码：\n\n```cpp\n 1 enum class\
    \ Values {\n 2   val1,\n 3   val2,\n 4   val3 // 添加了一个新值\n 5 };\n 6 \n 7 [[nodiscard]]\
    \ constexpr std::string_view get_name(Values value) {\n 8   switch (value) {\n\
    \ 9   case Values::val1: return \"val1\";\n10   case Values::val2: return \"val2\"\
    ;\n11   } // 现在会产生枚举值未处理的警告\n12 \n13   return \"unknown\";\n14 }\n```\n图 106.\
    \ 优选版本\n\n在上面的示例中，你不应该得到“不可达代码”的警告，因为`有效值范围` 几乎总是大于你定义的值。\n\n一些现代工具可以为你检测出这些对\
    \ `default` 的使用。\n\n## 练习：寻找 `default:`\n\n你在代码库中发现了什么？在之前的练习中开启警告是否已经为你发现了对 `default:`\
    \ 的使用？\n\n## 练习：考虑 `std::unreachable.`\n\n`std::unreachable`（在 C++23 中添加）在被执行时会显式地触发未定义行为。它可以被用于\
    \ `switch` 语句的“不可达”情况，以确保编译器执行最优操作。\n\n这可能是令人生畏的。你真的想要因为代码“不可能”被到达而使用未定义行为吗？与你的同事讨论这一点，并考虑你在何、何时以及是否使用这个工具。更多信息请参见资源中的\
    \ C++ Weekly 剧集。\n\n## 53.1: 资源\n\n* [CppCon 2018: Jason Turner “Applied Best\
    \ Practices”](https://youtu.be/DHOlsEd0eDE)\n* [C++ Weekly - Ep 393 - C++23’s\
    \ std::unreachable](https://youtu.be/ohMyb4jPIAQ) [`-Wswitch-enum`](https://clang.llvm.org/docs/DiagnosticsReference.html#wswitch-enum)\n\
    * [`-Wswitch`](https://clang.llvm.org/docs/DiagnosticsReference.html#wswitch)\n\
    \n# 54: 优选作用域枚举\n\nC++11 引入了作用域枚举，旨在解决从 C 继承的 `enum` 的许多问题。\n\n```cpp\n 1 enum\
    \ Choices {\n 2   option1 // 在全局作用域\n 3 };\n 4 \n 5 enum OtherChoices {\n 6  \
    \ option2\n 7 };\n 8 \n 9 int main() {\n10   int val = option1; //\n12 }\n```\n\
    图 107. C98 的 `enum`\n\n* `enum Choices;`\n* `enum OtherChoices;`\n\n这两个很容易混淆，因为它们位于全局命名空间。\n\
    \n* `enum Choices;`\n* `enum OtherChoices;`\n\n作用域枚举的值是有作用域的且强类型的。\n\n```cpp\n\
    \ 1 enum class Choices {\n 2   option1\n 3 };\n 4 \n 5 enum class OtherChoices\
    \ {\n 6   option2\n 7 };\n 8 \n 9 int main() {\n10   int val = Choices::option1;\n\
    11   int val2 = OtherChoices::option2;\n12 }\n```\n图 108. C++11 的作用域。\n\n枚举的标识符现在是有作用域的。\n\
    \n## 练习：`enum` 或 `class`\n\n决定使用 `enum` 还是 `class`，迁移到作用域枚举可能会发现 bug！\n\n## 54.1:\
    \ 资源\n\n* [CppCon 2018: Victor Ciura “Better Tools”](https://youtu.be/4X_0)\n\
    * [Enumeration](https://en.cppreference.com/w/enum)\n\n# 55: 优选 `if constexpr`\
    \ 比 SFINAE\n\nSFINAE 意味着如果函数编译失败，它将从重载解析中移除。\n\n如果我们要在除法上添加不同的行为，在 C++17 之前，我们会使用\
    \ SFINAE：\n\n```cpp\n 1 #include <stdexcept>\n 2 #include <type_traits>\n 3 #include\
    \ <utility>\n 4 \n 5 template <typename Numerator, typename Denominator>\n 6 \
    \          std::enable_if_t<std::is_integral_v<Numerator> &&\n 7             \
    \               std::is_integral_v<Denominator>,\n 8                         \
    \   int = 0>\n 9 auto divide(Numerator, Denominator) {\n10   // 整数除法\n11   if\
    \ (denominator == 0) {\n12     throw std::runtime_error(\"divide by 0!\");\n13\
    \   }\n14   return numerator / denominator;\n15 }\n16 \n17 template <typename\
    \ Numerator, typename Denominator>\n18           std::enable_if_t<std::is_floating_point_v<Numerator>\
    \ ||\n19                            std::is_floating_point_v<Denominator>,\n20\
    \                            int = 0>\n21 auto divide(Numerator, Denominator)\
    \ {\n22   // 浮点除法\n23   return numerator / denominator;\n24 }\n```\n图 110. SFINAE\
    \ `divide` 函数。\n\nC++17 的 `if constexpr` 结构可以简化这段代码：\n\n```cpp\n 1 import std;\n\
    \ 2 3 // 注意我们可以对 numerator 和 denominator 使用 `auto`\n 4 // 但会使 if constexpr 代码复杂化\n\
    \ 5 // 因为我们需要使用 `decltype` 来获取类型信息。\n 6 template <typename Numerator, typename\
    \ Denominator>\n 7 [[nodiscard]] constexpr auto divide(Numerator numerator, Denominator\
    \ de\\\n8 notion) {\n9   if constexpr (std::is_integral_v<Numerator> &&\n10  \
    \               std::is_integral_v<Denominator>) {\n11     // 整数除法\n12     if\
    \ (denominator == 0) {\n13         throw std::runtime_error(\"divide by 0!\");\n\
    14     }\n15   }\n16 \n17   return numerator / denominator;\n18 }\n```\n图 111.\
    \ `if constexpr` 用于编译时行为。\n\n在许多情况下，使用概念（concepts）代替 `if constexpr` 以提高可读性。\n\n\
    ```cpp\n 1 import std;\n 2 3 // 默认重载\n 4 [[nodiscard]] constexpr auto divide(auto\
    \ numerator, auto denominator) {\n 5   return numerator / denominator;\n 6 }\n\
    \ 7 8 // 只有当两个参数都是整数时才调用的版本\n 9 [[nodiscard]] constexpr auto divide(\n10   std::integral\
    \ auto numerator, std::integral auto denominator) {\n11 \n12   // 整数除法\n13   if\
    \ (denominator == 0) {\n14     throw std::runtime_error(\"divide by 0!\");\n15\
    \   }\n16 \n17   return numerator / denominator;\n18 }\n```\n图 112. 使用约束代替 `if\
    \ constexpr`。\n\n"
- fmt: "\n| ![](styles/resources/leanpub_info-circle.png) |\n\nThe code inside the\
    \ `if constexpr` block must still be syntactically correct. `if constexpr` is\
    \ not the same as a `#define`.\n\n| ![](styles/resources/leanpub_key.png) |\n\n\
    Code that you might normally choose to put outside of the `if` block might now\
    \ need to live inside of the `else` to make sure it is not instantiated with invalid\
    \ types.\n\n| ![](styles/resources/leanpub_pencil.png) |\n\n## Exercise: Look\
    \ into “design by introspection”\n\nThe combination of `if constexpr`, concepts,\
    \ and `requires` results in a very powerful, almost reflection-like capability.\n\
    \n```cpp\n1 constexpr void add_values(auto &container, auto first, auto second)\n\
    \ 2 {\n 3   // we ask, at compile time, if this container\n 4   // has a reserve\
    \ and a size member.\n 5   if constexpr(requires {container.reserve(container.size()\
    \ + 2); }) {\n 6     // if this is a valid operation, then perform it at runtime\n\
    \ 7     container.reserve(container.size() + 2);\n 8   }\n 9 \n10   // either\
    \ way, add the values\n 11   container.push_back(first);\n 12   container.push_back(second);\n\
    \ 13 }\n```\n\nFigure 113. 'Design by Introspection' example.\n\n## 55.1: Resources\n\
    \n* [C++ Weekly Special Edition: Using C++17’s constexpr if](https://youtu.be/_Ny6Qbm_uMI)\n\
    * [C++ Weekly - Ep 122 - `constexpr` with `optional` and `variant`](https://youtu.be/2eCV_udkP_o)\n\
    * [CppCon 2017: Jason Turner “Practical C++17”](https://youtu.be/nnY4e4faNp0)\n\
    * [C++ Weekly - Ep 242 - Design By Introspection in C++20](https://youtu.be/sy32kAtsIKg)\n\
    * [C++17 In Tony Tables: `constexpr if`](https://github.com/tvaneerd/cpp17_in_TTs/blob/master/if_constexpr.md)\n\
    \n# 56: De-template-ize Your Generic Code\n\nMove things outside of your templates\
    \ when you can. Use other functions. Use base classes. The compiler is still free\
    \ to inline them or leave them out of line.\n\nDe-template-ization will improve\
    \ compile times and reduce binary sizes. Both are helpful. It also eliminates\
    \ the thing that people think of as “template code bloat” (which IMO [doesn’t\
    \ exist](https://articles.emptycrate.com/2008/05/06/nobody_understands_c_part_5_template_code_bloat.html)).\n\
    \n```cpp\n1 template<typename T>\n2 constexpr void do_things()\n 3 {\n 4   //\
    \ this lambda must be generated for each\n 5   // template instantiation\n 6 \
    \  auto lambda = [](){ /* some lambda that doesn't capture */ };\n 7   auto value\
    \ = lambda();\n 8 }\n```\n\nFigure 114. A new lambda for each function template\
    \ instantiation.\n\nCompared to:\n\n```cpp\n1 constexpr auto some_function() {\
    \ /* do things*/ }\n 2 \n3 template<typename T>\n4 constexpr void do_things()\n\
    \ 5 {\n 6   auto value = some_function();\n 7 }\n```\n\nFigure 115. Shared logic\
    \ between template instantiations.\n\nNow only one version of the inner logic\
    \ is compiled, and it’s up to the compiler to decide if they should be inlined.\n\
    \nSimilar techniques apply to base classes and templated derived classes.\n\n\
    | ![](styles/resources/leanpub_pencil.png) |\n\n## Exercise: Bloaty McBloatface\
    \ and `-ftime-trace.`\n\nWe’re getting more and more tools available to look for\
    \ bloat in our binaries and analyze compile times. Look into these tools and other\
    \ tools available on your platform.\n\nRun them against your binary and see what\
    \ you find.\n\nWhen using clang’s `-ftime-trace`, also look into ClangBuildAnalyzer.\n\
    \n## 56.1: Resources\n\n* [Templight](https://github.com/mikael-s-persson/templight)\n\
    * [C++ Weekly Ep 89: “Overusing Lambdas”](https://youtu.be/OmKMNQFx_8Y)\n* [C++\
    \ Weekly Christmas Class 2019 - Chapter 3](https://www.youtube.com/watch?v=VEqOOKU8RjQ&list=PLs3KjaCtOwSY_Awyliwm-fRjEOa-SRbs-&index=16)\
    \ (This is the first episode of chapter 3, and it introduces the question of how\
    \ and why two different [options differ](https://godbolt.org/z/b4znvK). The next\
    \ several episodes in that playlist give some background, and the start of chapter\
    \ 4 gives the answers. It is very much related to template bloat questions.)\n\
    * Effective C++ (3rd Edition) Item 44 - Factor parameter-independent code out\
    \ of templates\n\n# 57: Use Lippincott Functions\n\nSame arguments as [de-template-izing](#all_chapter_contents.xhtml_de-template-ize-your-generic-code).\
    \ This is a Lippincott function for de-template-izing your code.\n\nIf you have\
    \ many different exception types, you might have code that looks like this:\n\n\
    ```cpp\n1 void use_thing() {\n2   try {\n3     do_thing();\n4    } catch (const\
    \ runtime_error&) {\n5     // handle it\n6    } catch (const exception&) {\n7\
    \     // handle it\n8 }\n```\n\nFigure 116. Lippincott de-duplicated exception\
    \ handling.\n\nThis technique is not new - it has been available since C++98.\n\
    \n```cpp\n1 void use_thing() {\n2   try {\n3     do_thing();\n4    } catch (const\
    \ runtime_error&) {\n5     // handle it\n6    } catch (const exception&) {\n7\
    \     // handle it\n8 }\n```\n\nFigure 117. Lippincott de-duplicated exception\
    \ handling.\n\n| ![](styles/resources/leanpub_pencil.png) |\n\n## Exercise: Do\
    \ You Use Exceptions?\n\nIf your project uses exceptions, there’s some ground\
    \ for centralizing your handling. If it does not use exceptions, then you likely\
    \ have other types that are duplicated.\n\n## 57.1: Resources\n\n* [C++ Secrets:\
    \ Using Lippincott Function](https://cppsecrets.blogspot.com/2013/12/using-lippincott-function-for.html)\n\
    * [C++ Weekly Ep 91: Lippincott Functions](https://youtu.be/-amJL3Ay)\n\n# 58:\
    \ No More `new!`\n\nYou’re already [avoiding the heap](#all_chapter_contents.xhtml_prefer-stack-over-heap)\
    \ and using smart pointers for resource management, right?!\n\nTake this to the\
    \ next level and be sure to use `std::make_unique<>>(https://en.cppreference.com/w/memory/unique_ptr/make_unique)\
    \ (C++14) in the rare cases you need the heap.\n\nIn the very rare cases you need\
    \ shared ownership, `std::make_shared<`](https://en.cppreference.com/w/memory/shared_ptr/make_shared)\
    \ (C++11).\n\n| ![](styles/resources/leanpub_pencil.png) |\n\n## Exercise: Do\
    \ you use Qt or some other widget library?\n\nHave you ever thought about writing\
    \ your own `make_qobject` helper? Give it the semantics you need and be sure to\
    \ use `[[nodiscard]]`.\n\nIn any case, you can limit your use of `new` to a few\
    \ core library functions.\n\n| ![](styles/resources/leanpub_pencil.png) |\n\n\
    ## Exercise: Use clang-tidy modernize fixes.\n\nWith clang-tidy, you can automatically\
    \ convert `new` statements into `make_unique<>` and `make_shared<>` calls. Be\
    \ sure to use `-fix` to apply the change after it’s been discovered.\n\n## 58.1:\
