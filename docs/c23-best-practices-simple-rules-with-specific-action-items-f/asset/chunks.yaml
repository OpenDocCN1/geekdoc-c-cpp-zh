  raw: "This function could be `(x, y, width, height),` or `(x1, y1, x2, y2).` Less\
    \ likely, but still possible, is `(width, height, x, y).`\n\nWhat do you think\
    \ about an API that looks like this?\n\n```\n1 Rectangle(Position, Size);\n```\n\
    \nFigure 15\\. Strongly typed constructor.\n\nIn many cases, it only takes a little\
    \ effort to make more strongly typed APIs.\n\n```\n 1 struct Position {\n 2  \
    \ int x;\n 3   int y;\n 4 };\n 5 \n 6 struct Size {\n 7   int width;\n 8   int\
    \ height;\n 9 };\n10 \n11 struct Rectangle {\n12   Position position;\n13   Size\
    \ size;\n14 };\n```\n\nFigure 16\\. Stronger typed definitions.\n\nWhich can then\
    \ lead to other, logically composable statements with operator overloads such\
    \ as:\n\n```\n1 // Return a new rectangle that has been \n2 // moved by the offset\
    \ amount passed in\n3 Rectangle operator+(Rectangle, Position);\n```\n\nFigure\
    \ 17\\. Coupled type operator overload.\n\n| ![](styles/resources/leanpub_info-circle.png)\
    \ |  \n\nIt’s possible that making structs can *increase* performance in some\
    \ cases [C++ Weekly Ep 119, Negative Cost Structs](https://youtu.be/FwsO12x8nyM).\n\
    \n |\n\n## 28.1: Avoid Boolean Arguments\n\nThis chapter’s pre-release reader\
    \ pointed out that Steve Maguire says, “Make code intelligible at the point of\
    \ call. Avoid Boolean arguments,” in Chapter 5 of his book Writing Solid Code.\n\
    \nIn C++11, `enum class` gives you an easy way to add stronger typing, avoid boolean\
    \ parameters, and make your API harder to use wrong.\n\nConsider:\n\n```\n1 struct\
    \ Widget {\n2   // this constructor is easy to use wrong, we\n3   // can easily\
    \ transpose the parameters\n4   Widget(bool visible, bool resizable);\n5 }\n```\n\
    \nFigure 18\\. Non-obvious order of parameters.\n\nCompared to:\n\n```\n1 struct\
    \ Widget {\n2   enum struct Visible { True, False };\n3   enum struct Resizable\
    \ { True, False };\n4 \n5   // still possible to use this wrong, but MUCH harder\n\
    6   Widget(Visible visible, Resizable resizable);\n7 }\n```\n\nFigure 19\\. Stronger\
    \ typing with scoped enumerations.\n\n| ![](styles/resources/leanpub_pencil.png)\
    \ |  \n\n## Identify the problematic APIs in your existing code.\n\n |\n\nWhat\
    \ function call do you regularly get out of order? How can it be fixed?\n\n| ![](styles/resources/leanpub_pencil.png)\
    \ |  \n\n## Exercise: Research strong typedef libraries for C++.\n\n |\n\nThere\
    \ are existing libraries that simplify some of the boilerplate code for you when\
    \ making a strongly typed `int.` Jonathan Muller, Bjorn Fahller, and Peter Sommerlad\
    \ have each written one, and others are available.\n\n| ![](styles/resources/leanpub_pencil.png)\
    \ |  \n\n## Exercise: Consider `=deleteing` problematic conversions.\n\n |\n\n\
    ```\n1 double high_precision_thing(double);\n```\n\nFigure 20\\. Simple function\
    \ declaration.\n\nWhat if calling the above with a `float` is likely to be a bug?\n\
    \n```\n1 double high_precision_thing(double);\n2 double high_precision_thing(float)\
    \ = delete;\n```\n\nFigure 21\\. Deleting a problematic accidental promotion from\
    \ `float` to `double`.\n\nAny function or overload can be `=deleted` in C++11.\n\
    \n| ![](styles/resources/leanpub_pencil.png) |  \n\nEnable clang-tidy’s [Easily\
    \ Swappable Parameters](https://clang.llvm.org/extra/clang-tidy/checks/bugprone-easily-swappable-parameters.html)\
    \ check\n\n |\n\n## 28.2: Resources\n\n*   [C++ Weekly Ep 107: “The Power of `=delete`”](https://youtu.be/aAvjUU0m6AU)\n\
    \n*   [Adi Shavit and Björn Fahller “The Curiously Recurring Pattern of Coupled\
