    \ costs not discounted).\n\n## 65: Bonus: Understand The Lambda\n\nA surprising\
    \ complexity hides behind the simple. With each version of C++, the lambda becomes\
    \ flexible and powerful.\n\nIf you can [read standard](http://eel.is/c++draft),\
    \ you can dig into all of the features of C++20’s lambdas yourself.\n\n```\n1\
