    \ language. C++ supports effectively all of the programming paradigms that exist\
    \ today.\n\n*   Procedural\n*   Functional\n*   Object-Oriented\n*   Generic\n\
    *   Compile-Time (`constexpr` and template metaprogramming)\n\nKnowing when it\
