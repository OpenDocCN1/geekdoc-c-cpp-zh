- fmt: "\n*   [Modules the beginner’s guide - Daniela Engert - Meeting C++ 2019](https://youtu.be/Kqo-jIq4V3I)\n\
    *   [Contemporary C++ in Action - Daniela Engert - CppCon 2022](https://youtu.be/yUIFdL3D0Vk)\n\
    *   [So, You Want to Use C++ Modules … Cross-Platform? - Daniela Engert - C++\
    \ on Sea 2023](https://youtu.be/DJTEUFRslbI)\n\n# 31: Export Module Overloads\
    \ Consistently\n\nC++23 modules should be used (remember to [forget header files\
    \ exist](#all_chapter_contents.xhtml_forget-header-files-exist)), but they do\
    \ introduce a new challenge to making sure your library can be correctly used.\n\
    \nIf you are familiar with using `DLLs` and explicit library exports (generally\
    \ required with `MSVC`, but also necessary if you choose to not export all symbols\
    \ from a dynamic library on any operating system) then you may have seen code\
    \ like this:\n\n```cpp\n1 EXTERN_DLL_EXPORT int calculate(int input) {\n2   return\
    \ input * 10;\n3 }\n```\n\nFigure 32. Simple library export example\n\nIf you\
    \ are inconsistent with your exports you will get a link error:\n\n```cpp\n1 //\
    \ library.hpp\n2 [[nodiscard]] constexpr int calculate(int input) {\n3   return\
    \ input * 10;\n4 }\n5 \n6 EXTERN_DLL_EXPORT [[nodiscard]] constexpr int calculate(float\
    \ input) {\n7   return input * 10.1;\n8 }\n```\n\nFigure 33. Simple library incorrect\
    \ example\n\n```cpp\n 1 #include \"library.hpp\"\n 2 import std;\n 3 \n 4 int\
    \ main()\n 5 {\n 6   // this will compile but give link-time errors\n 7   // (either\
    \ at static linking time or runtime linking)\n 8   // because the float overload\
    \ was found at compile-time\n 9   // but not exported for library usage\n10  \
    \ std::println(\"{}\", calculate(3));\n11 }\n```\n\nFigure 34. Simple library\
    \ incorrect usage example\n\nC++20 modules present us with a similar, but different,\
    \ and potentially more insidious problem.\n\n```cpp\n 1 // library.ixx\n 2 export\
    \ module library;\n 3 \n 4 // I'm only exporting the float overload\n 5 export\
    \ [[nodiscard]] constexpr float calculate(float val) noexcept\n 6 {\n 7   return\
    \ val * 10.1f;\n 8 }\n 9 \n10 [[nodiscard]] constexpr int calculate(int val) noexcept\n\
    11 {\n12   return val * 10;\n13 }\n```\n\nFigure 35. Partially exported overload\
    \ set\n\n```cpp\n1 import library;\n2 import std;\n 3 \n 4 int main()\n 5 {\n\
    \ 6   // this will compile and link and issue no warnings, but will\n 7   // print\
    \ float \"30.3\" instead of the probably expected int \"30\"\n 8   std::println(\"\
    {}\", calculate(3));\n 9 }\n```\n\nFigure 36. Partially exported overload usage\n\
    \n# 32: Prefer Stack Over Heap\n\nStack objects (locally scoped objects that are\
    \ not dynamically allocated) are much more optimizer friendly, cache-friendly,\
    \ and may be entirely eliminated by the optimizer. As Björn Fahller [has said](#all_chapter_contents.xhtml_what-do-you-mean-by-cache-friendly),\
    \ “assume any pointer indirection is a cache miss.”\n\nIn the most simple terms:\n\
    \n```cpp\n1 std::string make_string() { return \"Hello World\"; }\n```\n\nFigure\
    \ 37. OK idea, uses stack and can be optimized.\n\n```cpp\n1 std::unique_ptr<std::string>\
    \ make_string() {\n2   return std::make_unique<std::string>(\"Hello World\");\n\
    3 }\n```\n\nFigure 38. Bad idea, uses the heap.\n\n```cpp\n1 void use_string()\
    \ {\n2   // This string lives on the stack\n3   std::string value(\"Hello World\"\
    );\n4 }\n```\n\nFigure 39. OK idea.\n\n```cpp\n1 void use_string() {\n2   // The\
    \ string lives on the heap\n3   std::string *value = new std::string(\"Hello World\"\
    );\n4 }\n```\n\nFigure 40. Really bad idea, uses the heap and leaks memory.\n\n\
    Remember, `std::string` itself might allocate internally, and use the heap. If\
    \ no heap usage at all is your goal, you will need to take other measures. The\
    \ goal is no *unnecessary* heap allocations.\n\nGenerally speaking, objects created\
    \ with `new` expressions (or via `make_unique` or `make_shared`) are heap objects,\
    \ and have *Dynamic Storage Duration*. Objects created in a local scope are stack\
    \ objects and have *Automatic Storage Duration*.\n\n> It’s much easier for the\
    \ compiler and tools to find reads of uninitialized stack values than heap values.\n\
    \n## Exercise: Look for heap usage\n\nSometimes developers with C and Java backgrounds\
    \ have a hard time with this. For Java, it’s because `new` is required to create\
    \ objects. For C, it is because the C compiler cannot perform the same kinds of\
    \ optimizations that the C++ compiler can because of differences in the language.\n\
    \nSo some of the `vectors` have ended up in your code.\n\n## Exercise: Run heap\
    \ usage\n\nThere are several tools to find potential heap usage.\n\n## 33: Don’t\
    \ return raw pointers\n\nReturning a raw pointer makes the reader think about\
    \ ownership. Is it my job to `delete` it when done?\n\n```cpp\n1 int *get_value();\n\
    ```\n\nFigure 41. Returning a raw pointer.\n\nIf you need ownership, return a\
    \ `std::unique_ptr` or `std::shared_ptr`.\n\n# 34: Know Your Containers\n\nPrefer\
    \ your containers in this order:\n\n*   `std::array`\n*   `std::vector`\n\n`std::array`\n\
    \nA fixed-size stack-based contiguous container. The data size must be known at\
    \ compile-time, and you must have enough stack space to hold the data. This container\
    \ helps us [prefer stack over heap](#all_chapter_contents.xhtml_prefer-stack-over-heap).\
    \ Known location and contiguousness results in `std::array` becoming a “negative\
    \ cost abstraction.”\n\n`std::vector`\n\nA dynamically-sized heap-based contiguous\
    \ container. While the compiler does not know where the data will ultimately reside,\
    \ it does know that the elements are laid out adjacent to each other in RAM. Contiguousness\
    \ gives the compiler more optimization opportunities and is [cache-friendly](#all_chapter_contents.xhtml_what-do-you-mean-by-cache-friendly).\n\
    \nAlmost anything else needs a comment and justification for why. A flat map with\
    \ linear search is likely better than an `std::map` for small containers.\n\n\
    But don’t be too enthusiastic about this. If you need key lookup, use `std::map`\
    \ and evaluate if it has the performance and characteristics you want.\n\n## Exercise:\
    \ Replace `vector` With `array`\n\nLook for fixed-size `vectors` and replace them\
    \ with `array` where possible. With C++17’s Class Template Argument Deduction,\
    \ this can be easier.\n\n```cpp\nconst std::vector<int> data{n+1, n+2, n+3, n+4};\n\
    ```\n\nFigure 42. `const std::vector` with fixed-size data.\n\ncan become\n\n\
    ```cpp\n1 const std::array<int, 4> data{n+1, n+2, n+3, n+4}; // C++11\n2 const\
    \ std::array data{n+1, n+2, n+3, n+4};         // C++17\n```\n\nFigure 43. `const\
    \ std::array` for fixed-size data.\n\nYou already made these `const,` now go back\
    \ to [`constexpr` them](#all_chapter_contents.xhtml_constexpr-opportunities) if\
    \ you can.\n"
  raw: "*   [Modules the beginner’s guide - Daniela Engert - Meeting C++ 2019](https://youtu.be/Kqo-jIq4V3I)\n\
    \n*   [Contemporary C++ in Action - Daniela Engert - CppCon 2022](https://youtu.be/yUIFdL3D0Vk)\n\
    \n*   [So, You Want to Use C++ Modules … Cross-Platform? - Daniela Engert - C++\
    \ on Sea 2023](https://youtu.be/DJTEUFRslbI)\n\n# 31: Export Module Overloads\
    \ Consistently\n\nC++23 modules should be used (remember to [forget header files\
    \ exist](#all_chapter_contents.xhtml_forget-header-files-exist)), but they do\
    \ introduce a new challenge to making sure your library can be correctly used.\n\
    \nIf you are familiar with using DLL’s and explicit library exports (generally\
    \ required with MSVC, but also necessary if you choose to not export all symbols\
    \ from a dynamic library on any operating system) then you may have seen code\
    \ like this:\n\n```\n1 EXTERN_DLL_EXPORT int calculate(int input) {\n2   return\
    \ input * 10;\n3 }\n```\n\nFigure 32\\. Simple library export example\n\nIf you\
    \ are inconsistent with your exports you will get a link error:\n\n```\n1 // library.hpp\n\
    2 [[nodiscard]] constexpr int calculate(int input) {\n3   return input * 10;\n\
    4 }\n5 \n6 EXTERN_DLL_EXPORT [[nodiscard]] constexpr int calculate(float input)\
    \ {\n7   return input * 10.1;\n8 }\n```\n\nFigure 33\\. Simple library incorrect\
    \ example\n\n```\n 1 #include \"library.hpp\"\n 2 import std;\n 3 \n 4 int main()\n\
    \ 5 {\n 6   // this will compile but give link-time errors\n 7   // (either at\
    \ static linking time or runtime linking)\n 8   // because the float overload\
    \ was found at compile-time\n 9   // but not exported for library usage\n10  \
    \ std::println(\"{}\", calculate(3));\n11 }\n```\n\nFigure 34\\. Simple library\
    \ incorrect usage example\n\nC++20 modules present us with a similar, but different,\
    \ and potentially more insidious problem.\n\n```\n 1 // library.ixx\n 2 export\
    \ module library;\n 3 \n 4 // I'm only exporting the float overload\n 5 export\
    \ [[nodiscard]] constexpr float calculate(float val) noexcept\n 6 {\n 7   return\
    \ val * 10.1f;\n 8 }\n 9 \n10 [[nodiscard]] constexpr int calculate(int val) noexcept\n\
    11 {\n12   return val * 10;\n13 }\n```\n\nFigure 35\\. Partially exported overload\
    \ set\n\n```\n1 import library;\n2 import std;\n3 \n4 int main()\n5 {\n6   //\
    \ this will compile and link and issue no warnings, but will\n7   // print float\
    \ \"30.3\" instead of the probably expected int \"30\"\n8   std::println(\"{}\"\
    , calculate(3));\n9 }\n```\n\nFigure 36\\. Partially exported overload usage\n\
    \n# 32: Prefer Stack Over Heap\n\nStack objects (locally scoped objects that are\
    \ not dynamically allocated) are much more optimizer friendly, cache-friendly,\
    \ and may be entirely eliminated by the optimizer. As Björn Fahller [has said](#all_chapter_contents.xhtml_what-do-you-mean-by-cache-friendly),\
    \ “assume any pointer indirection is a cache miss.”\n\nIn the most simple terms:\n\
    \n```\n1 std::string make_string() { return \"Hello World\"; }\n```\n\nFigure\
    \ 37\\. OK idea, uses stack and can be optimized.\n\n```\n1 std::unique_ptr<std::string>\
    \ make_string() {\n2   return std::make_unique<std::string>(\"Hello World\");\n\
    3 }\n```\n\nFigure 38\\. Bad idea, uses the heap.\n\n```\n1 void use_string()\
    \ {\n2   // This string lives on the stack\n3   std::string value(\"Hello World\"\
    );\n4 }\n```\n\nFigure 39\\. OK idea.\n\n```\n1 void use_string() {\n2   // The\
    \ string lives on the heap\n3   std::string *value = new std::string(\"Hello World\"\
    );\n4 }\n```\n\nFigure 40\\. Really bad idea, uses the heap and leaks memory.\n\
    \n| ![](styles/resources/leanpub_info-circle.png) |  \n\nRemember, `std::string`\
    \ itself might allocate internally, and use the heap. If no heap usage at all\
    \ is your goal, you will need to take other measures. The goal is no *unnecessary*\
    \ heap allocations.\n\n |\n\nGenerally speaking, objects created with `new` expressions\
    \ (or via `make_unique` or `make_shared)` are heap objects, and have *Dynamic\
    \ Storage Duration*. Objects created in a local scope are stack objects and have\
    \ *Automatic Storage Duration*.\n\nN> It’s much easier for the compiler and tools\
    \ to find reads of uninitialized stack values than heap values.\n\n| ![](styles/resources/leanpub_pencil.png)\
    \ |  \n\n## Exercise: Look for heap usage\n\n |\n\nSometimes developers with C\
    \ and Java backgrounds have a hard time with this. For Java, it’s because `new`\
    \ is required to create objects. For C, it is because the C compiler cannot perform\
    \ the same kinds of optimizations that the C++ compiler can because of differences\
    \ in the language.\n\nSo some of this unnecessary heap usage may have ended up\
    \ in your current code.\n\n| ![](styles/resources/leanpub_pencil.png) |  \n\n\
    ## Exercise: Run a heap profiler\n\n |\n\nThere are several heap profiling tools,\
    \ and there may even be one built into your IDE. Examine your heap usage and look\
    \ for potential abuses of the heap in your project. It’s possible that most of\
    \ your heap allocations come from accidental copies of containers such as `std::string`\
    \ or `std::vector.`\n\n## 32.1: Resources\n\n*   [Code::Dive 2018: Björn Fahller\
    \ “What Do You Mean By Cache Friendly?”](https://youtu.be/Fzbotzi1gYs)\n\n*  \
    \ [heaptrack - a heap memory profiler for Linux](https://github.com/KDAB/heaptrack)\n\
    \n*   [Massif: a heap profiler](https://valgrind.org/info/tools.html#massif)\n\
    \n# 33: Don’t return raw pointers\n\nReturning a raw pointer makes the reader\
    \ of the code and user of the library think too hard about ownership semantics.\
    \ Prefer a reference, smart pointer, non owning pointer wrapper, or consider an\
    \ optional reference.\n\n```\n1 int *get_value();\n```\n\nFigure 41\\. Function\
    \ returning a raw pointer.\n\nWho owns this return value? Do I? Is it my job to\
    \ `delete` it when I’m done with it?\n\nOr even worse, what if the memory was\
    \ allocated by `malloc` and I need to call `free` instead?\n\nIs it a single `int`\
    \ or an array of `int?`\n\nThis code has far too many questions, and not even\
    \ `[[nodiscard]]` can help us.\n\n| ![](styles/resources/leanpub_pencil.png) |\
    \  \n\n## Exercise: Find the potential leaks in your code\n\n |\n\nBy now, you’ve\
    \ done enough of these API related exercises to know what to do. Go and look for\
    \ these in your code! See if there’s a better way! Can you return a value, reference,\
    \ or `std::unique_ptr` instead?\n\n# 34: Know Your Containers\n\nPrefer your containers\
    \ in this order:\n\n*   `std::array<>`\n\n*   `std::vector<>`\n\n`std::array<>`\n\
    \nA fixed-size stack-based contiguous container. The data size must be known at\
    \ compile-time, and you must have enough stack space to hold the data. This container\
    \ helps us [prefer stack over heap](#all_chapter_contents.xhtml_prefer-stack-over-heap).\
    \ Known location and contiguousness results in `std::array<>` becoming a “negative\
    \ cost abstraction.” The compiler can perform an extra set of optimizations because\
    \ it knows the data’s size and location.\n\n`std::vector<>`\n\nA dynamically-sized\
    \ heap-based contiguous container. While the compiler does not know where the\
    \ data will ultimately reside, it does know that the elements are laid out adjacent\
    \ to each other in RAM. Contiguousness gives the compiler more optimization opportunities\
    \ and is more [cache-friendly](#all_chapter_contents.xhtml_what-do-you-mean-by-cache-friendly).\n\
    \nAlmost anything else needs a comment and justification for why. A flat map with\
    \ linear search is likely better than an `std::map` for small containers.\n\n\
    But don’t be too enthusiastic about this. If you need key lookup, use `std::map`\
    \ and evaluate if it has the performance and characteristics you want.\n\n| ![](styles/resources/leanpub_pencil.png)\
    \ |  \n\n## Exercise: Replace `vector` With `array`\n\n |\n\nLook for fixed-size\
    \ `vectors` and replace them with `array` where possible. With C++17’s Class Template\
    \ Argument Deduction, this can be easier.\n\n```\n1 const std::vector<int> data{n+1,\
    \ n+2, n+3, n+4};\n```\n\nFigure 42\\. `const std::vector` with fixed-size data.\n\
    \ncan become\n\n```\n1 const std::array<int, 4> data{n+1, n+2, n+3, n+4}; // C++11\n\
    2 const std::array data{n+1, n+2, n+3, n+4};         // C++17\n```\n\nFigure 43\\\
    . `const std::array` for fixed-size data.\n\nYou already made these `const,` now\
    \ go back to [`constexpr` them](#all_chapter_contents.xhtml_constexpr-opportunities)\
    \ if you can."
