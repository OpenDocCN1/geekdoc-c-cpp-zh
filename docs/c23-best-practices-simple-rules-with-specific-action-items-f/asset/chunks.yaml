    9 // Not allowed before C++17, because constexpr\n10 constexpr auto j = []{ return\
    \ 42; }();\n```\n\nFigure 130\\. Lambda grammar.\n\n```\n1 // generic lambda,\
    \ C++14\n2 [](auto x){ return x + 42; };\n3 // variadic lambda, C++14\n4 [](auto\
