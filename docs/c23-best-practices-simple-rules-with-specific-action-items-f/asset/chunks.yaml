    * [Fluent C++](https://www.fluentcpp.com/)\n\n## 64: 感谢\n\n### 64.1: 赞助\n\n如果你想在领域内做得更好，就必须不断学习，而且有很多资源可以供你继续\
    \ C++ 教育。\n\n### 64.2: 评审者\n\n如果你提到这本书，我将为你公司的上门培训费用为你提供 9 折优惠（差旅费不参与）。\n\n##\
    \ 65: 进阶：理解 Lambda\n\n简单的背后隐藏着惊人的复杂性。随着每个 C++ 版本的更新，Lambda 变得灵活而强大。\n\n如果你能[阅读标准](http://eel.is/c++draft)，就可以自己研究\
    \ C++20 lambda 的所有功能。\n\n```\n1 // 有效的空 lambda，什么都不做\n2 []{};\n // 参数列表可选\n4 [](){\n\
    \ // C++17 显式 constexpr 和 void 返回\n6 []() constexpr -> void {};\n // 立即调用 lambda\n\
    8 auto i = [](){ return 42; }();\n // C++17 之前不允许，因为 constexpr\n10 constexpr auto\
    \ j = []{ return 42; }();\n```\n\n图 130\\. Lambda 语法。\n\n```\n1 // 泛型 lambda,\
    \ C++14\n2 [](auto x){ return x + 42; };\n // 变长参数 lambda, C++14\n4 [](auto ...\
    \ x){ return std::vector<int>(x...); };\n // 按值捕获, C++11\n6 [i](){ return i +\
    \ 42; }; \n // 泛化捕获, C++14 (i 的类型是什么?)\n8 [i = 42]{ return i + 42; };\n // 有状态的\
    \ lambda, C++11\n10 [i]() mutable { return ++i; };\n // 显式模板, C++20\n12 []<typename\
    \ T>(T x){ return x + 42; };\n13 \n14 // C++14 泛型 lambda 返回一个 C++20 lambda，该 lambda\
    \ 使用变长\n15 // 捕获表达式并返回一个折叠表达式\n16 // 捕获值的求和。\n17 [](auto ... val){ return [...val\
    \ = val]{ return (val + ...); }; };\n```\n\n"
- fmt: "\n# Figure 131. Allowed lambdas as of C++20.\n\nIf you understand every aspect\
    \ of C++’s lambdas and how the compiler implements them, you know everything important\
    \ about C++.\n\nThis is why I put together my [C++ class on YouTube about lambdas](https://www.youtube.com/playlist?list=PLs3KjaCtOwSY_Awyliwm-fRjEOa-SRbs-).\n\
    \nIn 2018 when compilers first started supporting C++20’s new lambdas, I implemented\
    \ this mostly standards-compliant version of `std::bind` using lambdas.\n\n(Continued\
    \ on next page.)\n\n```cpp\n 1 template <std::size_t Idx>\n 2 struct Placeholder\
    \ {};\n 3 \n 4 template <typename T>\n 5 struct Bound {\n 6   constexpr decltype(auto)\
    \ operator()(auto &&...param) const {\n 7     return t(std::forward<decltype(param)>(param)...);\n\
    \ 8   }\n 9 \n10   T t;\n11 };\n12 \n13 template <typename T>\n14 Bound(T) ->\
    \ Bound<T>;\n15 \n16 template <std::size_t Idx, typename T>\n17 constexpr decltype(auto)\
    \ get_param(const Placeholder<Idx> &,\n18                                    T\
    \ &&t) {\n19   return std::get<Idx>(t);\n20 }\n21 \n22 template <typename Param,\
    \ typename T>\n23 constexpr decltype(auto) get_param(Param &&param, T &&) {\n\
    24   return std::forward<Param>(param);\n25 }\n26 \n27 template <typename Param,\
    \ typename T>\n28 constexpr decltype(auto) get_param(const Bound<Param> &b,\n\
    29                                    T &&t) {\n30   return std::apply(b, std::forward<T>(t));\n\
    31 }\n32 \n33 constexpr decltype(auto) bind(auto &&callable, auto &&...param)\
    \ {\n34   return Bound{\n35       [callable = std::forward<decltype(callable)>(callable),\n\
    36        ... xs = std::forward<decltype(param)>(param)]\n37       (auto &&...values)\
    \ {\n38         auto passed_params =\n39             std::forward_as_tuple(\n\
    40                std::forward<decltype(values)>(values)...);\n41         return\
    \ std::invoke(callable,\n42                            get_param(xs, passed_params)...);\n\
    43       }\n44   };\n45 }\n```\n\n# Figure 132. `std::bind` implemented with C++20\
    \ lambdas.\n\nI haven’t looked at this code in 2 years, but here is a Compiler\
    \ Explorer link for you to play with.\n\n[https://godbolt.org/z/hhde3P](https://godbolt.org/z/hhde3P)\n\
    \n| ![](styles/resources/leanpub_pencil.png) | |\n\n## Exercise: Understand the\
    \ given example and critique it.\n\nWhat should I have done differently with the\
    \ above example? Can it be constrained with concepts? Does it need better names?\
    \ What would you do differently?\n"
  raw: "Figure 131\\. Allowed lambdas as of C++20.\n\nIf you understand every aspect\
