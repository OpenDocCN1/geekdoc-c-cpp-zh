  trans: "\n\n*   [CppCon 2020: Barnabás Bágyi “Fuzzing Class Interfaces for Generating\
    \ and Running Tests with libFuzzer”](https://cppcon2020.sched.com/event/e7An/fuzzing-class-interfaces-for-generating-and-running-tests-with-libfuzzer?iframe=no)\
    \ - 关于以新方式使用模糊测试的启发性演讲。视频尚未上线 YouTube，但请在本书出版后尝试查找。\n*   [Autotest](https://gitlab.com/wilzegers/autotest/)\
    \ - 与“Fuzzing Class Interfaces for Generating and Running Tests with libFuzzer”演讲相关的库。\n\
    *   [FuzzTest](https://github.com/google/fuzztest) - Google 提供的模糊测试库。\n*   [DeepState](https://github.com/trailofbits/deepstate)\
    \ - TrailOfBits 提供的模糊测试工具。\n*   [oss-fuzz](https://github.com/google/oss-fuzz)\
    \ - 开源项目的持续模糊测试。\n*   [Mutate++](https://github.com/nlohmann/mutate_cpp) - 变异测试工具。\n\
    \n# 23: 使用工具：构建生成器\n\n*   [CMake](https://cmake.org)\n*   [Meson](https://mesonbuild.com/)\n\
    *   [Bazel](https://bazel.build/)\n*   [其他](https://github.com/lefticus/cppbestpractices/blob/master/02-Use_the_Tools_Available.md)\n\
    \n原始 Makefile 或 Visual Studio 项目文件会让实现上述任何一项都变得过于复杂。使用构建工具来帮助维护跨平台和编译器的可移植性。\n\
    \n像对待其他代码一样对待你的构建脚本。它们有自己的最佳实践，编写不可维护的构建脚本和编写不可维护的 C++ 一样容易。\n\n构建生成器还可以通过 `cmake\
    \ --build` 等工具抽象并简化你的持续构建环境，无论使用什么平台，它都能执行正确的操作。\n\n| ![](img/leanpub_pencil.png)\
    \ |  \n\n## 练习：调查你的构建系统。\n\n*   你的项目目前使用构建生成器吗？\n*   你的构建脚本有多久了？\n\n查看是否有你需要应用的当前最佳实践。是否有可以在你的构建脚本上运行的\
    \ tidy 或格式化工具？\n\n回本书书中之前的最佳实践，看看它们如何应用于你的构建脚本。\n\n*   你是否在重复造轮？\n*   是否存在更高级的抽象？\n\
    \n| ![](img/leanpub_info-circle.png) |  \n\n最新版本的 CMake 添加了如 `--profiling-output`\
    \ 等工具，帮助你查看生成器花费时间在哪里。\n\n## 23.1: 资源\n\n*   [Professional CMake: A Practical\
    \ Guide](https://crascit.com/professional-cmake/)\n*   [cmake-tidy](https://github.com/MaciejPatro/cmake-tidy)\n\
    *   [C++Now 2017: Daniel Pfeiffer “Effective CMake”](https://youtu.be/bsXLMQ6WgIk)\n\
    *   [CppCon 2017: Mathieu Ropert “Using Modern CMake Patterns to Enforce a Good\
    \ Modular Design”](https://youtu.be/eC9-iRN2b04)\n*   [CppCon 2018: Jussi Pakkanen\
    \ “Compiling Multi-Million Line C++ Code Bases Effortlessly with the Meson Build\
    \ System”](https://youtu.be/SCZLnopmYBM)\n*   [BazelCon 2019](https://www.youtube.com/playlist?list=PLxNYxgaZ8Rsf-7g43Z8LyXct9ax6egdSj)\n\
    *   [CppCon 2019: Mathieu Ropert “Cato the Elder”](https://youtu.be/D07iF4Lp4kM)\
    \ - 关于构建脚本质量的简短吐槽。\n*   [C++ Weekly Ep 218 - The Ultimate CMake / C++ Quick Start](https://youtu.be/YbgH7yat-Jo)\n\
    *   [Twitter 关于 CMake 资源的讨论](https://twitter.com/Cor3ntin/status/1310990444915032067)\n\
    \n# 24: 使用工具：包管理器\n\n近年来，人们对 C++ 包管理器的兴趣爆发式增长。以下这两个变得最受欢迎：\n\n*   [Vcpkg](https://github.com/Microsoft/vcpkg)\n\
    *   [Conan](https://conan.io/)\n\n使用包管理器有明确的优势。包管理器有助于可移植性并减轻开发者的维护负担。\n\n| ![](img/leanpub_info-circle.png)\
    \ |  \n\n我还想引起你关注 [CPM](https://github.com/cpm-cmake/CPM.cmake)。\n\nCPM 提供了一种简单直接的\
    \ CMake 集成方法，用于构建和链接到可以通过 `fetch_content` 获取的 CMake 项目。\n\n| ![](img/leanpub_pencil.png)\
    \ |  \n\n## 练习：你的依赖有哪些？\n\n花时间清理你项目的依赖项。将你的依赖项与上述包管理器提供的包进行比较。是否有某个包管理器包含了你所有的依赖项？你现在的软件包过时多久？你目前缺少哪些安全修复？\n\
    \n# 第三部分：API 和代码设计\n\n# 25: 让接口变得难以使用。\n\n接口是你的第一道防线。如果你提供一个易于使用的接口，用户就会使用它。如果你提供一个难以使用的接口，用户就会误用它。\n\
    \n## 25.1: 资源\n\n*   [The Little Manual of API Design](https://people.mpi.de/~blanche/api-design.pdf)\n\
    \n# 26: 考虑错误地使用 API\n\n考虑 POSIX `socket:` 的 API：\n\n```\n1 socket(int, int, int);\n\
    ```\n\n图 13. POSIX socket API。参数（以某种顺序）表示：\n*   类型 (type)\n*   协议 (protocol)\n\
    *   域 (domain)\n\n这种设计是有问题的，但我们的代码中潜伏着不那么明显的问题。你是否接受原始指针？是否有方法保证内部用户不会误用 API？\n\
    \n| ![](img/circle.png) |  \n\n是否有方法保证外部用户不会误用 API？\n\n| ![](img/circle.png) |\
    \  \n\n## 练习：检查类型\n\nC++ 指南支持库 (GSL) 有 `not_null` 指针类型，可以保证传递的指针永远为 `nullptr`。对于目前传递原始指针的\
    \ API，这种方法可行吗？\n\n`std::string_view` (C++17) 和 `std::span` (C++20) 是指针/长度对的极佳替代方案。\n\
    \n## 26.1: 资源\n\n*   [boost::safe_numerics](https://github.com/boostorg/safe_numerics)\n\
    \n# 27: 害怕全局状态\n\n推理全局状态很困难。任何非 `const` 的 `static` 值或 `shared_ptr` 都可能是全局状态。永远不知道谁会更新该值，以及这样做是否线程安全。\n\
    \n全局状态会导致微妙且难以追踪的错误：一个函数更改了全局状态，而另一个函数依赖该更改或受到其影响。\n\n| ![](img/leanpub_pencil.png)\
    \ |  \n\n## 练习：全局状态，剩下什么？\n\n如果你完成了之前的练习，你已经将所有的 `static` 变量变成了 `const`。这很好！你可能还将其中一些变为\
    \ `constexpr`，那更好！\n\n但你可能仍有全局状态潜伏。你有一个全局单例日志记录吗？日志是否会在系统的模块之间意外共享状态？其他单例呢？可以消除吗？它们是否存在线程初始化问题（如果两个线程尝试首次访问其中一个对象会发生什么）？\n\
    \n## 27.1: 资源\n\n*   [Retiring the Singleton Pattern - Peter Muldoon - Meeting\
    \ C++ 2019](https://youtu.be/f46jmm7r8Yg)\n\n# 28: 使用更强的类型\n\n考虑 `Rectangle` 的\
    \ API：\n\n```\n1 Rectangle(int, int, int, int);\n```\n\n定义不当。\n\n这种设计是有问题的，但我们的代码中潜伏着不那么明显的问题。\n\
    \n```\n1 Rectangle(int, int, int, int);\n```\n\n图 14. 定义不当的构造函数。\n\n"
- fmt: "\nThis function could be `(x, y, width, height)`, or `(x1, y1, x2, y2)`. Less\
    \ likely, but still possible, is `(width, height, x, y)`.\n\nWhat do you think\
    \ about an API that looks like this?\n\n```\n1 Rectangle(Position, Size);\n```\n\
    \nFigure 15. Strongly typed constructor.\n\nIn many cases, it only takes a little\
    \ effort to make more strongly typed APIs.\n\n```\n 1 struct Position {\n 2  \
    \ int x;\n 3   int y;\n 4 };\n 5 \n6 struct Size {\n 7   int width;\n 8   int\
    \ height;\n 9 };\n10 \n11 struct Rectangle {\n12   Position position;\n13   Size\
    \ size;\n14 };\n```\n\nFigure 16. Stronger typed definitions.\n\nWhich can then\
    \ lead to other, logically composable statements with operator overloads such\
    \ as:\n\n```\n1 // Return a new rectangle that has been \n2 // moved by the offset\
    \ amount passed in\n3 Rectangle operator+(Rectangle, Position);\n```\n\nFigure\
    \ 17. Coupled type operator overload.\n\n| ![](styles/resources/leanpub_info-circle.png)\
    \ |  \n\nIt’s possible that making structs can increase performance in some cases\
    \ [C++ Weekly Ep 119, Negative Cost Structs](https://youtu.be/FwsO12x8nyM). |\n\
    \n## 28.1: Avoid Boolean Arguments\n\nThis chapter’s pre-release reader pointed\
    \ out that Steve Maguire says, “Make code intelligible at the point of call. Avoid\
    \ Boolean arguments,” in Chapter 5 of his book Writing Solid Code.\n\nIn C++11,\
    \ `enum class` gives you an easy way to add stronger typing, avoid boolean parameters,\
    \ and make your API harder to use wrong.\n\nConsider:\n\n```\n1 struct Widget\
    \ {\n2   // this constructor is easy to use wrong, we\n3   // can easily transpose\
    \ the parameters\n4   Widget(bool visible, bool resizable);\n5 }\n```\n\nFigure\
    \ 18. Non-obvious order of parameters.\n\nCompared to:\n\n```\n1 struct Widget\
    \ {\n2   enum struct Visible { True, False };\n3   enum struct Resizable { True,\
    \ False };\n4 \n5   // still possible to use this wrong, but MUCH harder\n6  \
    \ Widget(Visible visible, Resizable resizable);\n7 }\n```\n\nFigure 19. Stronger\
    \ typing with scoped enumerations.\n\n| ![](styles/resources/leanpub_pencil.png)\
    \ |  \n\n## Identify the problematic APIs in your existing code.\n\nWhat function\
    \ call do you regularly get out of order? How can it be fixed?\n\n| ![](styles/resources/leanpub_pencil.png)\
