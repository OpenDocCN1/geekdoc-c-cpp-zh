  trans: "\n\n| ![](img/leanpub_info-circle.png) |\n\n`if constexpr` 块内部的代码在语法上必须是正确的。`if\
    \ constexpr`并不等同于 `#define`。\n\n| ![](img/leanpub_key.png) |\n\n某些你通常会选择放在 `if`\
    \ 块之外的代码，现在可能需要放在 `else` 块内部，以确保它们不会用无效类型进行实例化。\n\n| ![](img/leanpub_pencil.png)\
    \ |\n\n## 练习：深入研究“内省设计（design by introspection）”\n\n`if constexpr`、概念（concepts）和\
    \ `requires` 的结合产生了一种非常强大、几乎类似于反射的能力。\n\n```cpp\n1 constexpr void add_values(auto\
    \ &container, auto first, auto second)\n 2 {\n 3   // 我们在编译时询问这个容器\n 4   // 是否有\
    \ reserve 和 size 成员。\n 5   if constexpr(requires {container.reserve(container.size()\
    \ + 2); }) {\n 6     // 如果这是一个有效操作，则在运行时执行\n 7     container.reserve(container.size()\
    \ + 2);\n 8   }\n 9 \n10   // 无论如何，添加值\n 11   container.push_back(first);\n 12\
    \   container.push_back(second);\n 13 }\n```\n\n图 113. “内省设计”示例。\n\n## 55.1: 资源\n\
    \n* [C++ Weekly 特别版：使用 C++17 的 constexpr if](https://youtu.be/_Ny6Qbm_uMI)\n*\
    \ [C++ Weekly - Ep 122 - 配合 optional 和 variant 使用 constexpr](https://youtu.be/2eCV_udkP_o)\n\
    * [CppCon 2017: Jason Turner “实战 C++17”](https://youtu.be/nnY4e4faNp0)\n* [C++\
    \ Weekly - Ep 242 - C++20 中的内省设计](https://youtu.be/sy32kAtsIKg)\n* [Tony Tables\
    \ 中的 C++17：constexpr if](https://github.com/tvaneerd/cpp17_in_TTs/blob/master/if_constexpr.md)\n\
    \n# 56: 去模板化你的泛型代码（De-template-ize）\n\n尽可能将内容移出模板之外。使用其他函数。使用基类。编译器仍然可以对它们进行内联处理或保持不内联。\n\
    \n去模板化将缩短编译时间并减少二进制文件体积。这两者都有帮助。它还消除了人们认为的“模板代码膨胀”（在我看来，这[并不存在](https://articles.emptycrate.com/2008/05/06/nobody_understands_c_part_5_template_code_bloat.html)）。\n\
    \n```cpp\n1 template<typename T>\n2 constexpr void do_things()\n 3 {\n 4   //\
    \ 这个 lambda 必须为每个\n 5   // 模板实例化生成\n 6   auto lambda = [](){ /* 一个不捕获变量的 lambda\
    \ */ };\n 7   auto value = lambda();\n 8 }\n```\n\n图 114. 为每个函数模板实例化生成了一个新的 lambda。\n\
    \n相比之下：\n\n```cpp\n1 constexpr auto some_function() { /* 执行操作*/ }\n 2 \n3 template<typename\
    \ T>\n4 constexpr void do_things()\n 5 {\n 6   auto value = some_function();\n\
    \ 7 }\n```\n\n图 115. 模板实例化之间共享的逻辑。\n\n现在内部逻辑只有一个版本被编译，并且由编译器决定是否应该对其进行内联。\n\n\
    类似的技巧也适用于基类和模板化的派生类。\n\n| ![](img/leanpub_pencil.png) |\n\n## 练习：Bloaty McBloatface\
    \ 和 -ftime-trace。\n\n我们有越来越多的工具可以用来查找二进制文件中的膨胀问题并分析编译时间。研究这些工具以及你平台上其他工具。\n\n\
    在你的二进制文件上运行这些工具，看看你会发现什么。\n\n使用 clang 的 `-ftime-trace` 时，也要查看 ClangBuildAnalyzer。\n\
    \n## 56.1: 资源\n\n* [Templight](https://github.com/mikael-s-persson/templight)\n\
    * [C++ Weekly Ep 89: “过度使用 Lambda”](https://youtu.be/OmKMNQFx_8Y)\n* [C++ Weekly\
    \ Christmas Class 2019 - 第 3 章](https://www.youtube.com/watch?v=VEqOOKU8RjQ&list=PLs3KjaCtOwSY_Awyliwm-fRjEOa-SRbs-&index=16)\
    \ (这是第 3 章的第一集，它引入了为什么以及两个不同的[选项会有差异](https://godbolt.org/z/b4znvK)的问题。该列表中接下来的几集提供了背景，第\
    \ 4 章的开头给出了答案。与模板膨胀问题非常相关。）\n* Effective C++ (第 3 版) Item 44 - 从模板中提取与参数无关的代码\n\
    \n# 57: 使用 Lippincott 函数\n\n参数与去模板化 相同。这是一个用于对你的代码进行去模板化的 Lippincott 函数。\n\n如果你有许多不同的异常类型，你可能会有这样的代码：\n\
    \n```cpp\n1 void some_function() {\n2   try {\n3     do_something();\n4   } catch\
    \ (const exception_type1&) {\n5     // ...\n6   } catch (const exception_type2&)\
    \ {\n7     // ...\n8   }\n9 }\n```\n\n图 116. 异常处理。\n\n这种技术并不是新的——从 C++98 起就有了。\n\
    \n```cpp\n1 void some_function() {\n2   try {\n3     do_something();\n4   } catch\
    \ (const exception_type1&) {\n5     // ...\n6   } catch (const exception_type2&)\
    \ {\n7     // ...\n8   }\n9 }\n```\n\n图 117. 异常处理。\n\n| ![](img/leanpub_pencil.png)\
    \ |\n\n## 练习：你使用异常吗？\n\n如果你的项目使用异常，那么就有某些地方需要集中处理。如果不使用异常，那么你可能有其他重复的类型。\n\n##\
    \ 57.1: 资源\n\n* [C++ Secrets：使用 Lippincott 函数](https://cppsecrets.blogspot.com/2013/12/using-lippincott-function-for.html)\n\
    * [C++ Weekly Ep 91: Lippincott 函数](https://youtu.be/-amJL3Ay)\n\n# 58: 不再需要 new！\n\
    \n你已经在避免堆内存 并使用智能指针进行资源管理了，对吧？！\n\n更进一步，在需要堆内存的极少数情况下使用 `std::make_unique<>>(https://en.cppreference.com/w/memory/unique_ptr/make_unique)\
    \ (C++14)。\n\n在需要共享权的极少数情况下，使用 `std::make_shared<>>(https://en.cppreference.com/w/memory/shared_ptr/make_shared)\
    \ (C++11)。\n\n| ![](img/leanpub_pencil.png) |\n\n## 练习：你使用 Qt 或其他组件库吗？\n\n你考虑过编写自己的\
    \ `make_qobject` 辅助函数吗？赋予它需要的 `[[nodiscard]]`。\n\n在任何情况下，你都可以 `new` 的使用限制在少数核心库函数上。\n\
    \n| ![](img/leanpub_pencil.png) |\n\n## 练习：使用 clang-tidy 现代化修复。\n\n通过 clang-tidy，你可以自动将\
    \ `new` 语句转换为 `make_unique<>` 和 `make_shared<>` 调用。在发现后，务必使用 `-fix` 应用更改。\n\n\
    ## 58.1: 资源\n\n* [clang-tidy modernize-make-shared](https://clang.llvm.org/extra/clang-tidy/checks/modernize-make-shared.html)\n\
    * [clang-tidy modernize-make-unique](https://clang.llvm.org/extra/clang-tidy/checks/modernize-make-unique.html)\n\
    \n# 59: 避免 std::bind 和 std::function\n\n虽然编译器不断改进，且优化器在绕过这些类型的复杂性，但其中任何一种仍然可能增加显著的编译时间和运行时开销。\n\
    \nC++14 的 lambda 配合泛化捕获表达式，可以实现 `std::bind` 所能的功能。\n\n| ![](img/leanpub_key.png)\
    \ |\n\n`std::function` 不支持 `constexpr`，这是你可能可能在代码中避免使用它的另一个原因。\n\n"
- fmt: "\n```cpp\n import std;\n \n [[nodiscard]] constexpr double divide(double numerator,\
    \ double denominator) {\n   return numerator / denominator;\n }\n\n auto inverted_divide\
    \ = std::bind(divide,\n                                  std::placeholders::_2,\
    \ \n                                  std::placeholders::_1);\n```\n\nFigure 118.\
    \ `std::bind` to change parameter order\n\n```cpp\n import std;\n\n \n [[nodiscard]]\
    \ constexpr double divide(double numerator, double denominator) {\n   return numerator\
    \ / denominator;\n }\n\n auto inverted_divide = [](const auto numerator,\n   \
    \                        const auto denominator) {\n   return divide(denominator,\
    \ numerator)\n }\n```\n\nFigure 119. Lambda to change parameter order\n\n| ![](styles/resources/leanpub_pencil.png)\
    \ |  \n\n## Exercise: Compare the possibilities.\n\n|Take these options in Compiler\
    \ Explorer. How do the compile times and resulting assembly look?\n\n```cpp\n\
    \ import std;\n\n // std::function is not constexpr enabled, so this\n // cannot\
    \ be `constexpr`\n [[nodiscard]] std::function<int (int)> bind_3(auto func)\n\
    \ {\n   return std::bind(func, std::placeholders::_1, 3);\n }\n\n int main(int\
    \ argc, const char *[])\n {\n   return bind_3(std::plus<>{})(argc);\n }\n```\n\
    \nFigure 120. `std::function` and `std::bind`\n\n```cpp\n #include <functional>\n\
    \n // std::bind is constexpr enabled\n [[nodiscard]] constexpr auto bind_3(auto\
    \ func)\n {\n   return std::bind(func, std::placeholders::_1, 3);\n }\n\n int\
    \ main(int argc, const char *[])\n {\n   return bind_3(std::plus<>{})(argc);\n\
    \ }\n```\n\nFigure 121. `std::bind` only, for bonus points, what type is returned\
    \ from the function `bind_3`?\n\n```cpp\n #include <functional>\n\n [[nodiscard]]\
    \ constexpr auto bind_3(auto func)\n {\n   return [func](const int value){ return\
    \ func(value, 3); };\n }\n\n int main(int argc, const char *[])\n {\n   return\
    \ bind_3(std::plus<>{})(argc);\n }\n```\n\nFigure 122. Only lambdas, no std library\
    \ wrappers.\n\n| ![](styles/resources/leanpub_pencil.png) |  \n\n## Exercise:\
    \ Look at std::bind_front, std::bind_back\n\n|\n\n```cpp\n #include <functional>\n\
    \n [[nodiscard]] constexpr auto bind_3(auto func)\n {\n   return std::bind_back(func,\
    \ 3);\n }\n\n int main(int argc, const char *[])\n {\n   return bind_3(std::plus<>{})(argc);\n\
    \ }\n```\n\nFigure 123. C++23's `bind_back`\n\n## 59.1: Resources\n\n* [CppCon\
    \ 2015: Stephan T. Lavavej “: What’s New, And Proper Usage”](https://youtu.be/zt7ThwVfap0)\n\
    * [C++ Weekly Ep 16: “Avoiding `std::bind`”](https://youtu.be/ZlHi8txU4aQ)\n\n\
    # 60: Don’t Use `initializer_list` For Non-Trivial Types\n\n“Initializer List”\
    \ is an overloaded term in C++. “Initializer Lists” are used to directly initialize\
    \ values. `initializer_list` is used to pass a list of values to a function or\
    \ constructor.\n\n| ![](styles/resources/leanpub_pencil.png) |  \n\n## Exercise:\
    \ Understand the overhead `initializer_list` can bring\n\n|Use Andreas Fertig’s\
    \ awesome [cppinsights.io](http://cppinsights.io) to understand what these two\
    \ examples do\n\n```cpp\n#include <vector>\n#include <memory>\n\nstd::vector<std::shared_ptr<int>>\
    \ vec{\n   std::make_shared<int>(40), std::make_shared<int>(2)\n };\n```\n\nFigure\
    \ 124. `initializer_list` constructor with `shared_ptr`.\n\n```cpp\n#include <array>\n\
    #include <memory>\n\n std::array<std::shared_ptr<int>, 2> data{\n   std::make_shared<int>(40),\
    \ std::make_shared<int>(2)\n };\n```\n\nFigure 125. `std::array` construction\
    \ with `shared_ptr`.\n\nAnd explain the difference. If you can do this, you understand\
    \ more than most C++ developers.\n\n| ![](styles/resources/leanpub_pencil.png)\
    \ |  \n\n## Exercise: Understand why this doesn’t compile\n\n|\n\n```cpp\n#include\
    \ <vector>\n#include <memory>\n\nstd::vector<std::unique_ptr<int>> data{\n   std::make_unique<int>(40),\
    \ std::make_unique<int>(2)\n };\n```\n\nFigure 126. `initializer_list` construction\
    \ with `unique_ptr`.\n\n## 60.1: Resources\n\n* [C++Now 2018: Jason Turner “Initializer\
    \ Lists Are Broken, Let’s Fix Them”](https://youtu.be/sSlmmMFsXQ) (deep dive into\
    \ issues)\n* [C++ Insights](https://cppinsights.io/)\n\n# 61: Consider Designated\
    \ Initializers (C++20)\n\nDirect-Initialization provides a highly efficient way\
    \ of initializing public members.\n\n```cpp\n#include <string>\n\n struct Data\
    \ {\n   std::string first;\n   std::string second;\n };\n\n int main() {\n   //\
    \ directly-initialize the data `first` and `second`\n   // this has no copy or\
    \ move overhead\n   // how to write an efficient constructor for it.\n   Data\
    \ d{\"Hello\", \"World\"};\n }\n```\n\nFigure 127. direct-init example\n\nThe\
    \ downside is that this code is not readable. We’t know what those two parameters\
    \ `\"Hello\"` and `\"World\"` are initializing.\n\nC++20 added “designated initializers”\
    \ that allow you to specify the name of the object you are initializing.\n\n*\
    \ They must be initialized in order\n* Items may be skipped\n* Names must be consistently\
    \ provided\n\n```cpp\n#include <string>\n\n struct Data {\n   std::string first;\n\
    \   std::string second;\n };\n\n int main() {\n   Data d{.first = \"Hello\", .second\
    \ = \"World\"};\n }\n```\n\nFigure 128. designated-init example\n\n| ![](styles/resources/info-circle.png)\
    \ |\n\nImportant: compilers are inconsistent about warning if you have left out\
    \ a parameter when using designated initializers. Make sure you compile with multiple\
    \ compilers and high warning levels.\n\n| ![](styles/resources/leanpub_pencil.png)\
    \ |\n\n## Exercise: Discuss with your team what you prefer\n\n* Is being able\
    \ to skip a parameter an upside, or a downside?\n* How important is it that parameters\
    \ have a name?\n* Does it matter if you have strong typing as a discipline in\
    \ your system?\n\n| ![](styles/resources/leanpub_pencil.png) |\n\n## Exercise:\
    \ Compare a simple `struct` with public members to one with private and constructors.\n\
    \n```cpp\n#include <string>\n\n class Data {\n public:\n   // add constructor(s),\
    \ getters and setters\n   // Is this better?\n   // How much compile-time and\
    \ runtime overhead does it add?\n private:\n   std::string first;\n   std::string\
    \ second;\n };\n```\n\nFigure 129. implement a constructor and getters\n\n| ![](styles/resources/leanpub_key.png)\
    \ |\n\nIn many cases simple public structs are better than complex classes with\
    \ getters, setters, and constructors. But this is only true if there are no interdependencies\
    \ between the values (invariants).\n\n## 61.1: Resources\n\n* [C++ Weekly Ep 127:\
    \ C++20’s Designated Initializers](https://youtu.be/44rs_h1dxE)\n* [C++ Weekly\
    \ Ep 274 - Why Is My Pair 310x Faster Than `std::pair`](https://youtu.be/3LsRYRDSRA)\n\
    * [C++ Stories: C++20: Designated Initializers](https://www.cppstories.com/2021/designated-init-cpp20/)\n\
    * [Modernes C++: Designated Initializers](https://www.modernescpp.com/index.php/designated-initializers)\n\
    * [Abseil Tip of the Week #172: Designated Initializers](https://abseil.io/tips/172)\n\
    \n# Part V: Bonus Chapters\n\n# 62: Improving Build Time\n\nA few practical considerations\
    \ for making build time less painful\n\n* De-templatize your code where possible\n\
    * Use forward declarations where it makes sense to\n* Enable PCH (precompiled\
    \ headers) in your build system\n* Use `ccache` or similar (many other options\
    \ that change regularly, Google for them)\n* Be aware of unity builds\n* Know\
    \ the possibilities and limitations of `extern template`\n* Use a build analysis\
    \ tool to see where build time is spent\n\n## 62.1: Use an IDE\n\nThis is the\
    \ most surprising side effect of using a modern IDE that I have observed: IDE’s\
    \ do realtime analysis of the code. Realtime analysis means that you know as you\
    \ are typing if the code is going to compile. Therefore, you spend less time waiting\
    \ for builds.\n\n| ![](styles/resources/leanpub_pencil.png) |  \n\n## Exercise:\
    \ What are build times costing you?\n"
