    \ lengths. The test harness you write consumes these strings of data and processes\
    \ them in some way that is appropriate for your application. The fuzz tester analyzes\
    \ coverage data generated from your test’s execution and uses that information\
    \ to remove redundant tests and generate new novel and unique tests.\n\nIn theory,\
    \ a fuzz test will eventually reach 100% code coverage of your tested code, if\
    \ left to run long enough. Combined with AddressSanitizer, this makes a powerful\
    \ tool for finding bugs in your code. [One interesting article from 2015](https://blog.hboeck.de/archives/868-How-Heartbleed-couldve-been-found.html)\
    \ describes how the combination of a fuzz tester and AddressSanitizer could have\
    \ found the security flaw “heartbleed” in OpenSSL in less than 6 hrs.\n\n| ![](styles/resources/leanpub_info-circle.png)\
    \ |  \n\nThis 6 hrs is now drastically out of date. With modern fuzz testing tools\
    \ and newer computers, a vulnerability like heartbleed can be discovered in just\
    \ a few minutes.\n\n |\n\n| ![](styles/resources/leanpub_key.png) |  \n\nFuzz\
    \ testing primarily finds memory and security flaws.\n\n |\n\nMany different fuzzing\
    \ tools exist. For the sake of this section, I am going to focus on [LLVM’s libFuzzer](https://www.llvm.org/docs/LibFuzzer.html).\
    \ Most fuzz testers operate under the same premise.\n\nYou must provide some sort\
    \ of entry point. The entry point generally takes the form of a function like:\n\
    \n```\n1 extern \"C\" int LLVMFuzzerTestOneInput(const uint8_t *Data,\n2     \
    \                                  size_t Size);\n```\n\nFigure 8\\. libFuzzer\
    \ entry point.\n\nThe `Data` pointer is always valid, and the `Size` parameter\
    \ is >= 0.\n\nIf your library primarily parses input files (think libpng) then\
    \ your job is quite easy:\n\n```\n1 extern \"C\" int LLVMFuzzerTestOneInput(const\
    \ uint8_t *Data,\n2                                       size_t Size)\n3 {\n\
    4   parseInput(Data, Size);\n5 }\n```\n\nFigure 9\\. libFuzzer data being used.\n\
    \nIf your functions take data structures instead of input strings, your job is\
    \ slightly more complicated but doable.\n\n```\n 1 template<typename Type>\n 2\
    \ std::tuple<const uint8_t *, size_t, Type>\n 3     createStruct(const uint8_t\
    \ *Data, size_t Size)\n 4 {\n 5   // we're only allowed to do this with trivial\
    \ types\n 6   static_assert(std::is_trivial_v<Type>);\n 7   Type result{}; //\
    \ default initialize\n 8   const auto bytesToRead = std::min(sizeof(Type), Size);\n\
    \ 9   std::memcpy(&result, Data, bytesToRead);\n10   return {std::next(Data, bytesToRead),\
    \ Size - bytesToRead, result};\n11 }\n12 \n13 extern \"C\" int LLVMFuzzerTestOneInput(const\
    \ uint8_t *Data,\n14                                       size_t Size)\n15 {\n\
    16   // This example is meant as inspiration, it has not been\n17   // tested\
    \ in a real test\n18   auto [newDataPtr, remainingSize, Obj1]\n19     = createStruct<Type1>(Data,Size);\n\
    20   auto [lastDataPtr, lastSize, Obj2]\n21     = createStruct<Type2>(newDataPtr,\
    \ remainingSize);\n22 \n23   functionToTest(Obj1, Obj2);\n24 }\n```\n\nFigure\
    \ 10\\. Advanced libFuzzer data usage.\n\nThe fuzzer will quickly learn that any\
    \ new data input where `Size > sizeof(Type1) + sizeof(Type1)` does not generate\
    \ new code paths and will focus on the appropriate amount of data.\n\n| ![](styles/resources/leanpub_key.png)\
    \ |  \n\nLook into the newer (2022) fuzzing library from Google [FuzzTest](https://github.com/google/fuzztest)\
    \ designed to simplify the process of hooking up fuzz tests into your project.\n\
    \n |\n\n## 22.2: Mutating\n\nMutation testing works by modifying conditionals\
    \ and constants in the code being tested.\n\n```\n1 bool greaterThanFive(const\
    \ int value) {\n2     return value > 5; // comparison\n3 }\n4 \n5 void tests()\
    \ {\n6   assert(greaterThanFive(6));\n7   assert(!greaterThanFive(4));\n8 }\n\
    ```\n\nFigure 11\\. Pseudo code example.\n\nA mutation tester could modify the\
    \ constant `5` or the `>` so the resulting code might become\n\n```\n1 bool greaterThanFive(const\
    \ int value) {\n2     return value < 5; // mutated\n3 }\n```\n\nFigure 12\\. Mutated\
    \ code.\n\nAny test that continues to pass is a “mutant that has survived” and\
    \ may indicate either a flawed test or a bug in the code.\n\n| ![](styles/resources/leanpub_pencil.png)\
    \ |  \n\n## Exercise: Create a fuzz test harness.\n\n |\n\nApply the examples\
    \ demonstrated here to create fuzz testers for your code. What challenges do you\
    \ hit?\n\n| ![](styles/resources/leanpub_key.png) |  \n\nLook at [FuzzedDataProvider.h](https://github.com/llvm-mirror/compiler-rt/blob/master/include/fuzzer/FuzzedDataProvider.h)\
    \ for more helper functions\n\n |\n\n| ![](styles/resources/leanpub_pencil.png)\
    \ |  \n\n## Exercise: Investigate mutation testing.\n\n |\n\nThe author of this\
    \ book has no direct experience with mutation testing. Is it something you can\
    \ use in your project? What interesting resources do you find?\n\n| ![](styles/resources/leanpub_pencil.png)\
    \ |  \n\n## Exercise: Try FuzzTest if you can.\n\n |\n\nOnly very recent versions\
    \ of clang are supported by FuzzTest, look into the currently supported compilers\
    \ and see if you can try it with your code.\n\n## 22.3: Resources\n\n*   [C++Now\
    \ 2018: Marshall Clow “Making Your Library More Reliable with Fuzzing”](https://youtu.be/LlLJRHToyUk)\n\
    \n*   [C++ Weekly Ep 85: Fuzz Testing](https://youtu.be/gO0KBoqkOoU)\n\n*   [CppCast:\
    \ Alex Denisov “Mutation Testing With Mull”](https://cppcast.com/alex-denisov/)\n\
    \n*   [NDC TechTown 2019: Seph De Busser “Testing The Tests: Mutation Testing\
    \ for C++”](https://youtu.be/M-5_M8qZXaE)\n\n*   [CppCon 2017: Kostya Serebryany\
    \ “Fuzz or lose…”](https://youtu.be/k-Cv8Q3zWNQ)"
