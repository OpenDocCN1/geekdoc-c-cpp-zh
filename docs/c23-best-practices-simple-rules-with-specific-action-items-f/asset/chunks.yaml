    \ 7 };\n 8 \n 9 int main()\n10 {\n11   Data d{.first = \"Hello\", .second = \"\
    World\"};\n12 }\n```\n\nFigure 128\\. designated-init example\n\n| ![](styles/resources/leanpub_info-circle.png)\
    \ |  \n\nImportant: compilers are inconsistent about warning if you have left\
