    \ (deep dive into the issues around these topics)\n\n*   [C++ Insights](https://cppinsights.io/)\n\
    \n# 61: Consider Designated Initializers (C++20)\n\nDirect-Initialization provides\
    \ a highly efficient way of initializing public data members.\n\n```\n 1 #include\
    \ <string>\n 2 \n 3 struct Data\n 4 {\n 5   std::string first;\n 6   std::string\
    \ second;\n 7 };\n 8 \n 9 int main()\n10 {\n11   // directly-initialize the data\
    \ members `first` and `second`\n12   // this has no copy or move overhead nor\
    \ questions\n13   // about how to write an efficient constructor for it.\n14 \
    \  Data d{\"Hello\", \"World\"};\n15 }\n```\n\nFigure 127\\. direct-init example\n\
    \nThe downside is that this code is not very readable. We don’t know what those\
    \ two parameters `\"Hello\"` and `\"World\"` are initializing.\n\nC++20 added\
    \ “designated initializers” that allow you to specify the name of the object you\
    \ are initializing.\n\n*   They must be initialized in order\n\n*   Items may\
