    \ get();\n5 }\n```\n\nFigure 85\\. Ex5: what is the type of val?\n\n```\n1 const\
    \ int &get();\n2 \n3 int main() {\n4   const auto &&val = get();\n5 }\n```\n\n\
    Figure 86\\. Ex6: what is the type of val?\n\n| ![](styles/resources/leanpub_pencil.png)\
    \ |  \n\n## Exercise: Build your experiment library\n\n |\n\nThe above exercise\
    \ is perfect for building into a set of experiments that are saved in your GitHub\
    \ gists mentioned in [C++ Is Not Magic](#all_chapter_contents.xhtml_cpp-is-not-magic)\n\
    \n| ![](styles/resources/leanpub_pencil.png) |  \n\n## Exercise: Understand how\
    \ `auto` and `template` deduction relate\n\n |\n\nUnderstand the rules for type\
    \ deduction of templates and how they relate to `auto.`\n\nRead the section in\
    \ the C++ Programming Language Standard [dcl.spec.auto].\n\n## 47.1: Resources\n\
    \n*   [clang-tidy modernize-use-auto](https://clang.llvm.org/extra/clang-tidy/checks/modernize-use-auto.html)\n\
    \n*   [Almost Always Auto](https://herbsutter.com/2013/08/12/gotw-94-solution-aaa-style-almost-always-auto/)\n\
    \n# 48: Use Ranges and Views For Correctness and Readability\n\nAt their best\
    \ C++20’s ranges and views can drastically increase readability and correctness\
    \ of your code without impacting performance or compile times.\n\nAt their worst\
    \ C++20’s ranges and views can drastically increase compile times, runtimes, and\
    \ affect the readability of your code.\n\nBecause of some of the potential drawbacks\
    \ to ranges and views, there are some who recommend never using them. This book\
    \ does not call for that. Instead, we say that you should learn their strengths\
    \ and weaknesses.\n\nThis author considers the humble case of “loop over all elements\
    \ except for the first item” to be the “killer feature” of ranges and views.\n\
    \n```\n1 void print_all_but_first(const std::vector<int> &values) {\n2   // forget\
    \ this and you have UB with 0 element container\n3   if (values.empty()) { return;\
    \ }\n4 \n5   for (auto itr = next(begin(values)); itr != end(values); ++itr) {\n\
    6     std::println(\"{}\", *itr);\n7   }\n8 }\n```\n\nFigure 87\\. Skip first\
    \ element, without ranges.\n\n```\n1 void print_all_but_first(const std::vector<int>\
    \ &values) {\n2   for (const auto val : values | std::views::drop(1)) {\n3   \
    \  std::println(\"{}\", val);\n4   }\n5 }\n```\n\nFigure 88\\. Skip first element,\
    \ with ranges.\n\nBe aware of these very simple but very powerful use cases, besides\
    \ the much more complex and composable features of the ranges library.\n\n| ![](styles/resources/leanpub_pencil.png)\
    \ |  \n\n## Exercise: Read through the set of views available [https://en.cppreference.com/w/cpp/ranges](https://en.cppreference.com/w/cpp/ranges).\n\
    \n |\n\n| ![](styles/resources/leanpub_pencil.png) |  \n\n## Exercise: Use [compiler\
    \ explorer](https://compiler-explorer.com) to compare and contrast the two functions\
    \ above at different optimization levels.\n\n |\n\n## 48.1: Resources\n\n*   [C++\
    \ Weekly - Ep 391 - Finally! C++23’s std::views::enumerate](https://youtu.be/HuRbLPRh-Nk)\n\
    \n*   [C++ Weekly - Ep 398 - C++23’s zip_view](https://youtu.be/MVXGdwREo_E)"
