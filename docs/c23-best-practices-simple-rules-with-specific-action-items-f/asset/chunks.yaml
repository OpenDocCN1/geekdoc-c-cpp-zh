    \ best practices.\n\n# 3: About Best Practices\n\nBest Practices, quite simply,\
    \ are about\n\n1.  Reducing common mistakes\n\n2.  Finding errors quickly\n\n\
    3.  Without sacrificing (and often improving) performance\n\n## 3.1: Why Best\
    \ Practices?\n\nFirst and foremost, let’s get this out of the way:\n\n### 3.1.1:\
    \ Your Project Is Not Special\n\nIf you are programming in C++, you, or someone\
    \ at your company, cares about performance. Otherwise, they’d probably be using\
    \ some other programming language. I’ve been to many companies who all tell me\
    \ they are special because they need to do things fast!\n\nSpoiler alert: they\
    \ are all making the same decisions for the same reasons.\n\nThere are very few\
    \ exceptions. The outliers who make different decisions: they are the organizations\
    \ that are already following the advice in this book.\n\n## 3.2: What’s The Worst\
    \ That Can Happen?\n\nI don’t want to be depressing, but let’s take a moment to\
    \ ponder the worst-case scenario if your project has a critical flaw.\n\nGame\n\
    \nSerious flaws lead to remote vulnerabilities or attack vectors.\n\nFinancial\n\
    \nSerious flaws lead to [large amounts of lost money, accelerating trades, market\
    \ crash](https://en.wikipedia.org/wiki/2010_flash_crash).\n\nAerospace\n\nSerious\
    \ flaws lead to lost spacecraft or [human life](https://spectrum.ieee.org/aerospace/aviation/how-the-boeing-737-max-disaster-looks-to-a-software-developer).\n\
    \nYour Industry\n\nSerious flaws lead to… Lost money? Lost jobs? Remote hacks?\
    \ Worse?\n\n## 3.3: Examples\n\nExamples throughout this book use `struct` instead\
    \ of `class.` The only difference between `struct` and `class` is that `struct`\
    \ has all members and base classes by default `public.` Using `struct` makes examples\
    \ shorter and easier to read.\n\n## 3.4: Exercises\n\nEach section has one or\
    \ more exercises. Most do not have a right or wrong answer.\n\n| ![](styles/resources/leanpub_pencil.png)\
    \ |  \n\n## Exercise: Look for exercises\n\n |\n\nThroughout the following chapters,\
    \ you’ll see exercises like this one. Look for them!\n\nExercises are:\n\n*  \
    \ Practical, and apply to your current code base to see immediate value.\n\n*\
    \   Make you think and understand the language a little bit deeper by doing your\
    \ own research.\n\n## 3.5: Links and References\n\nI’ve made an effort to reference\
    \ those who I learned from and link to their talks where possible. If I’ve missed\
    \ something, please let me know.\n\n# 4: Slow Down\n\nDozens of solutions exist\
    \ in C++ for any given problem. Dozens of more opinions exist for which of these\
    \ solutions are the best. Copying and pasting from one application to another\
    \ is easy. Forging ahead with the solutions you are comfortable with is easy.\n\
    \nHow many times have you said, “wow, this is going to take a complicated class\
    \ hierarchy to implement this solution?” Or what about “I guess I need to add\
    \ macros here to implement these common functions.”\n\n*   If the solution seems\
    \ large or complex, stop.\n\n*   Now is a good time to go for a walk and ponder\
    \ the solution.\n\n*   When you’re done with your walk, discuss the design with\
    \ a coworker, pet, or [rubber duck](https://rubberduckdebugging.com/).\n\nStill\
    \ haven’t found a more straightforward solution you are happy with? Ask on Twitter\
    \ or Slack if you can.\n\nThe key point is to not forge ahead blindly with the\
    \ solutions with which you are comfortable. Be willing to stop for a minute. The\
    \ older I get, the less time I spend programming, and the more time I spend thinking.\
    \ In the end, I implement the solution as fast or faster than I used to and with\
    \ less complexity.\n\n# 5: Use AI Coding Assistants Judiciously\n\nAI coding assistants\
    \ are become ubiquitous, with nearly every IDE and tool having something built\
    \ in. They appear to be rather powerful and are able to generate convincing results.\
    \ However, these results are not necessarily correct. Therefore, I suggest these\
    \ Best Practices for using your AI coding assistant.\n\n1.  Always double check\
    \ the results you are given.\n\n2.  Use them mostly as a “[smart rubber duck](#all_chapter_contents.xhtml_rubber-duck)”.\n\
    \n3.  Always double check the results you are given.\n\n4.  Use them to “flatten\
    \ the learning curve.” If you ask the bot to generate an example of a certain\
    \ technique or API usage, you’ll likely get a meaningful answer, but one that\
    \ also has some mistakes in it.\n\n5.  Always double check the results you are\
    \ given.\n\n## 5.1: Resources\n\n*   [C++ Weekly - Ep 371 - Best Practices for\
    \ Using AI Code Generators](https://www.youtube.com/watch?v=I2c969I-KmM)\n\n#\
    \ 6: C++ Is Not Magic\n\nThis section is just a reminder that we can reason about\
    \ all aspects of C++. It’s not a black box, and it’s not magic.\n\nIf you have\
    \ a question, it’s usually easy to construct an experiment that helps you answer\
    \ the question for yourself.\n\nA favorite tool of mine is this simple class that\
    \ prints a debug message whenever a special member function is called."
