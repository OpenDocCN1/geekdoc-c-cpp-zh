  trans: "\n\n## 练习：在代码中寻找违反“五规则”的区域\n\n当你在定义特殊成员函数时，现有的代码中可能没有提供一致的生命周期语义。为了评估其影响，你可以快速对任何缺失的特殊成员函数使用\
    \ ``= delete;`` 并查看哪些部分会报错。\n\n## 40.1: 资源\n\n* [C++ 参考文档：三规则/五规则/零规则](https://en.cppreference.com/w/cpp/language/rule_of_three)\n\
    \n# 第四部分：代码实现指南\n\n## 41：不要复制粘贴代码\n\n如果你发现自己正准备选择一段代码并复制它：停下！\n\n后退一步，重新审视这段代码。\n\
    \n* 你为什么要复制它？\n* 源代码和目标代码有多相似？\n* 将其封装成函数有意义吗？\n* 记住，不要害怕模板\n\n我发现，这个简单的规则对我的代码质量产生了最直接的影响。\n\
    \n如果粘贴操作的结果是进入当前函数，请考虑使用 lambda。\n\nC++14 风格的 lambda 带有泛型（即 `auto`）参数，为你提供了一种简单易用的创建复用代码的方法，可以与不同的数据类型共享，而无需处理\
    \ `template` 语法。\n\n## 练习：尝试 CPD（重复代码检测）。\n\n有几种不同的复制粘贴检测工具可以查找代码库中的重复代码。\n\n\
    对于此练习，请下载 [PMD CPD 工具](https://pmd.github.io/latest/pmd_userdocs_cpd.html) 并在你的代码库上运行。\n\
    \n如果你使用 Arch Linux，可以通过 AUR 安装此工具。包名是 `pmd`；工具名是 `pmd-cpd`。\n\n你能识别出代码中被复制粘贴的关键部分吗？如果你在其中一个版本中发现了\
    \ bug 会发生什么？你能确定会看到所有同样需要更新的地方吗？\n\n## 41.1: 资源\n\n* [复制粘贴编程](https://www.viva64.com/en/t/0068/)\n\
    * [最后一行效应](https://www.viva64.com/en/b/0260/)\n* [我不会复制粘贴代码](https://twitter.com/bjorn_fahller/status/1072432257799987200)\n\
    \n## 42：优先使用 `format` 而非 `iostream` 或 C 格式化函数\n\nC++20 添加了 `<format>` 头文件，提供了\
    \ `std::format` 函数。\n\n`std::format` 接收字符串、参数并返回一个 `std::string` 对象。\n\n`format`\
    \ 的优点是：\n\n* 编译比 iostreams 快\n* 执行比 iostreams 快\n* 比 iostreams 更具可读性\n* 比 `printf`\
    \ 系列函数更类型安全\n\n```cpp\n1 import std;\n2 \n3 int main()\n4 {\n5   const auto result\
    \ = std::format(\"Hello {}!\", \"Jason\");\n6 }\n```\n图 57 简单的 format 使用\n\n遗憾的是，C++20\
    \ 的用例非常有限，以格式化为字符串为主机制，我们往往会写出这样的代码：\n\n```cpp\n1 // 使用 include 是因为这是 C++20\n\
    2 #include <format>\n3 \n4 int main()\n5 {\n6   std::cout << std::format(\"Hello\
    \ {}!\\n\", \"Jason\");\n7 }\n```\n图 58 format 使用\n\n为了解决这个问题，C++23 添加了 `<print>`\
    \ 头文件，我们可以通过模块使用它。\n\n```cpp\n1 import std;\n2 \n3 int main()\n4 {\n5   std::println(\"\
    Hello {}!\", \"Jason\");\n6 }\n```\n图 59 使用 `std::println`\n\n`std::print` 有多个重载版本，辅助函数\
    \ `std::println` 会在消息末尾自动添加换行符。\n\n这个例子过于复杂了！\n\n```cpp\n1 import std;\n2 \n3\
    \ int main()\n4 {\n5   std::print(std::cout, \"Hello\");\n6   std::println(stdout,\
    \ \" World\");\n7 }\n```\n图 60 使用 `std::print` 的重载\n\n## 练习：学习 `std::print` 的语法并开始将\
    \ `std::cout` 转换为 `print`。\n\n## 练习：使用 `clang-tidy` 的 `modernize-use-print` 升级你拥有的任何\
    \ `printf` 系列函数。\n\n## 练习：使用 `clang-tidy` 的 `modernize-use-print` 升级你拥有的任何 `printf`\
    \ 系列函数。\n\n## 练习：使用 `clang-tidy` 的 `modernize-use-print` 升级你拥有的任何 `printf` 系列函数。\n\
    \n## 练习：使用 `clang-tidy` 的 `modernize-use-print` 升级你拥有的任何 `printf` 系列函数。\n\n##\
    \ 练习：使用 `clang-tidy` 的 `modernize-use-print` 升级你拥有的任何 `printf` 系列函数。\n\n## 练习：使用\
    \ `clang-tidy` 的 `modernize-use-print` 升级你拥有的任何 `printf` 系列函数。\n\n## 练习：使用 `clang-tidy`\
    \ 的 `modernize-use-print` 升级你拥有的任何 `printf` 系列函数。\n\n## 练习：使用 `clang-tidy` 的 `modernize-use-print`\
    \ 升级你拥有的任何 `printf` 系列函数。\n\n## 练习：使用 `clang-tidy` 的 `modernize-use-print` 升级你拥有的任何\
    \ `printf` 系列函数。\n\n## 练习：使用 `clang-tidy` 的 `modernize-use-print` 升级你拥有的任何 `printf`\
    \ 系列函数。\n\n## 练习：使用 `clang-tidy` 的 `modernize-use-print` 升级你拥有的任何 `printf` 系列函数。\n\
    \n## 练习：使用 `clang-tidy` 的 `modernize-use-print` 升级你拥有的任何 `printf` 系列函数。\n\n##\
    \ 练习：使用 `clang-tidy` 的 `modernize-use-print` 升级你拥有的任何 `printf` 系列函数。\n\n## 43：`constexpr`\
    \ 掌控一切！\n\n在定义特殊成员函数时，你可能没有提供一致的生命周期语义。为了评估其影响，你可以快速对任何缺失的特殊成员函数使用 ``= delete;``\
    \ 并查看哪些部分会报错。\n\n`static` 变量比我以前任何时候更有理由使用 `constexpr`。\n\nC++23 和模块的结合消除了几乎所有使用\
    \ `static` 的理由。\n\n在模块头文件中，`constexpr` 应该成为默认值。\n\n* 在模块中，尽可能多地在编译时计算（constexpr）\n\
    * `constexpr` 开启了我们尚未考虑的用例\n* 只要是 `static`，尽可能在编译时计算\n* 标准库技术需要 `constexpr` 开启的\n\
    \n当你看到类似这样的内容时（我在真实代码中看到的）：\n\n```cpp\n1 static const std::vector<int> angles{-90,-45,0,45,90};\n\
    ```\n图 61 `static const` 在编译时已知。\n\n这真的应该是：\n\n```cpp\n1 static constexpr std::array\
    \ angles{-90,-45,0,45,90};\n```\n图 62 将 `static const` 转换为 `static constexpr`。\n\
    \n`static constexpr` 在这里是必要的确保对象不会在每次调用时重新初始化。使用 `static` 变量在整个程序生命周期内存在，且我们知道它会被初始化一次。\n\
    \n这种差异体现在：\n\n* 数组的大小现在在编译时已知\n* 我们消除了动态分配\n* 我们不再需要访问静态的\n\n对于头文件中的全局变量，优先使用\
    \ `inline constexpr` 而非 `static constexpr`，这样链接器可以合并数据结构并减少代码膨胀。\n\n主要的收益来自前两者，但我们需要\
    \ `constexpr` 思维来寻找这种机会。我们还需要 `constexpr` 知识来了解如何在更复杂的情况下应用它。\n\n有时，非静态 `constexpr`\
    \ 局部变量是最有效的选项，因为数据存储在栈上而不是二进制文件的其他部分。在你的优化阶段检查这是否重要。\n\n技术上，非静态 `constexpr` 变量并不非要在编译时计算。然而，它们几乎确定是在编译时计算的，将它们认为是在编译时计算是有用的。\n\
    \n## 练习：`constexpr` 你的 `const` 值\n\n阅读代码时，查看所有的 `const` 值。问：“这个值在编译时已知吗？”如果是，需要什么才能让值变为\
    \ `constexpr`？\n\n## 练习：`static constexpr` 你的 `static const`\n\n遍历你当前的代码库，寻找目前为\
    \ `static const` 的代码。你可能在某处有一些。\n\n* 如果目前是 `static const`，可能大小和数据在编译时已知\n* 这段代码可以变成\
    \ `constexpr` 吗？\n* 什么阻止了它变成 `constexpr`？\n\n"
- fmt: "\n*   How much work would it take to modify the functions populating the `static\
    \ const` data so that they are also `constexpr`?\n\n*   Remember that if it’s\
    \ a global in a header file, you should prefer `inline constexpr.`.\n\n## Exercise:\
    \ Make header code `constexpr`\n\nIf you have functions and types that are already\
    \ defined in header files, try to make those functions and types fully `constexpr`\
    \ enabled.\n\n## Exercise: Move header defined `constexpr` functions into module\
    \ interface files\n\nWe want to avoid continuing to re-parse `constexpr` functions,\
    \ and module interface files give us that way.\n\n## Exercise: Look for additional\
    \ non-IO functions to make `constexpr`\n\nAt this point in your journey basically\
    \ any non-IO function can be made into a `constexpr` function.\n\n*   Move these\
    \ functions into your module interface file.\n*   Make the functions `constexpr`.\n\
    \n## 43.1: Resources\n\n*   [C++Now 2017: Ben Deane & Jason Turner “`constexpr`\
    \ ALL the things](https://youtu.be/HMB9oXFobJc) (a bit out of date with modern\
    \ `constexpr` techniques)\n*   [C++ Weekly Ep 233: `constexpr` map vs `std::map`](https://youtu.be/INn3xa4pMfg)\n\
    *   [Meeting C++ 2017: Jason Turner “Practical `constexpr`”](https://youtu.be/xtf9qkDTrZE)\n\
    *   [C++ Russia 2019: Hana Dusíková “A state of сompile time regular expressions”](https://youtu.be/r_ZASJFQGQI)\n\
    *   [C++ Weekly Ep 312: Stop Using `constexpr` (And Use This Instead!)](https://youtu.be/4pKtPWcl1Go)\n\
    *   [C++ Weekly: `constexpr` vs `static constexpr`](https://youtu.be/IDQ0ng8RIqs)\n\
    *   [C++ Weekly: `static constexpr` vs `inline constexpr`](https://youtu.be/QVHwOOrSh3w)\n\
    *   [cons_expr: a compile-time capable scheme-like scripting language](https://github.com/lefticus/cons_expr)\n\
    \n# 44: Make globals in headers `inline constexpr`\n\n1.  Be afraid of global\
    \ state!\n2.  Forget header files exist!\n\nAll global data should be `constexpr`.\n\
    \nBut global `constexpr` values are perfectly safe. They cannot mutate and they\
    \ cannot affect “spooky action at a distance.”\n\nIf you still have header files\
    \ because you haven’t completely moved over to modules yet…\n\nAll global `constexpr`\
    \ values should be `inline constexpr`.\n\nInside of module interfaces, `constexpr`\
    \ globals and `inline constexpr` globals both have “external linkage” so we don’t\
    \ have to worry about that.\n\n```\n1 // my_library.hpp\n2 \n3 // the object `dataset`\
    \ will be duplicated in each .cpp\n4 // file that includes this .hpp file\n5 static\
    \ constexpr auto dataset = make_data();\n```\nFigure 63. static constexpr example\n\
    \n```\n1 // my_library.hpp\n2 \n3 // the object `dataset` will exist once in the\
    \ entire binary\n4 inline constexpr auto dataset = make_data();\n```\nFigure 64.\
    \ inline constexpr example\n\n# 45: `const` Everything That’s Not `constexpr`\n\
    \nMany people (like Kate Gregory and James McNellis) have said this many times.\
    \ Making objects `const` does two things:\n\n1.  It forces us to think about the\
    \ initialization and lifetime of objects, which affects performance.\n2.  Communicates\
    \ meaning to the readers of our code.\n\nAnd as an aside, if it’s a static object,\
    \ the compiler is now free to move it into the constants portion of the binary,\
    \ which can affect the optimizer.\n\n## Exercise: Look for `const` opportunities.\n\
    \nAs you read through your code, you should look for variables that are not `const`\
    \ and make them `const`.\n\n*   If a variable is not `const`, ask why not?\n*\
    \   Would using a lambda or adding a named function allow you to make the value\
    \ `const`?\n\n```\n1 const auto data = [](){ // no parameters\n2   std::vector<int>\
    \ result;\n3   // fill result with things.\n4   return result;\n5 }(); // immediately\
    \ invoked\n```\nFigure 65\n\nWould using a lambda or adding a named function allow\
    \ you to make the value `const`?\n\nBecause of RVO, using a lambda may increase\
    \ performance.\n\nHowever, it’s important to note that `constexpr` for values\
    \ can be fragile.\n\n```\n1 ReturnType some_function(int value)\n2 {\n3   // if\
    \ the types of result differ\n4   // and implicit conversion exists, you get\n\
    5   // implicit moves.\n6   // If they are the same, then guaranteed\n7   // applies\
    \ de-constexpr\n8   const auto result = get_value(42);\n9   return result;\n10\
    \ }\n```\nFigure 66\n\n```\n1 ReturnType some_function(int value)\n2 {\n3   //\
    \ if the types of result differ\n4   // and implicit conversion exists, you get\n\
    5   // implicit moves.\n6   // If they are the same, then guaranteed\n7   // applies\
    \ de-constexpr\n8   return get_value(42);\n9 }\n```\nFigure 67. Prefer not `naming`\
    \ temporaries\n\nThe clang-tidy [No Move](https://clang.llvm.org/extra/clang-tidy/checks/performance-automatic-move.html)\
    \ analysis is largely broken. It warns even when `constexpr` applies, and doesn’t\
    \ warn when it matters. See this analysis: [https://compiler-explorer.com/z/a476nb](https://compiler-explorer.com/z/a476nb).\n\
    \nYou probably don’t want to make `class` members `const`; it can break essential\
    \ things such as move.\n\n# 46: Always Initialize Your non-const, non-auto` Values\n\
    \nThe ideal is to `const` everything, which forces you to initialize. However,\
    \ that’s not always possible.\n\nSimilarly, if you use `auto,` you are forced\
    \ to initialize an object.\n\n*   The compiler will “throw away” operations on\
    \ uninitialized values\n*   Make sure you have your `-Wunitialized` style warnings\
    \ enabled\n\nBe aware that there can be a difference between default initialization\
    \ and initialization that appears empty in some cases.\n\nCompilers are not always\
    \ perfect at catching uninitialized value usage. For example, GCC (as of 2023-12-30)\
    \ requires optimizations enabled to catch this uninitialized variable access,\
    \ which is UB.\n\n```\n 1 #include <span>\n 2 \n3 float sum(std::span<float> values)\n\
    \ 4 {\n 5   float result;\n 6 \n 7   for (const auto f : values) {\n 8     result\
    \ += f;\n 9   }\n 10 \n11   return result;\n12 }\n```\nFigure 68. Uninitialized\
    \ variable read that GCC doesn't catch without optimizations enabled\n\n## Exercise:\
    \ Understand which constructor you are calling\n\nTake this example code and play\
    \ with it at various optimization levels in compiler-explorer.com to understand\
    \ the difference that each constructor call might perform.\n"
