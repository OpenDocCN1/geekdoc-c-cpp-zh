    \ auto inverted_divide = std::bind(divide,\n                                 \
    \ std::placeholders::_2, \n                                  std::placeholders::_1);\n\
    ```\n\n图 118. 使用 `std::bind` 更改参数顺序\n\n```cpp\n import std;\n\n \n [[nodiscard]]\
    \ constexpr double divide(double numerator, double denominator) {\n   return numerator\
    \ / denominator;\n }\n\n auto inverted_divide = [](const auto numerator,\n   \
    \                        const auto denominator) {\n   return divide(denominator,\
    \ numerator)\n }\n```\n\n图 119. 使用 Lambda 更改参数顺序\n\n| ![](img/leanpub_pencil.png)\
    \ |  \n\n## 练习：比较各种可能性。\n\n|在 Compiler Explorer 中尝试这些选项。编译时间和生成的汇编代码看起来是样的？\n\n\
    ```cpp\n import std;\n\n // std::function 没有开启 constexpr 支持，所以这个\n // 不能是 `constexpr`\n\
    \ [[nodiscard]] std::function<int (int)> bind_3(auto func)\n {\n   return std::bind(func,\
    \ std::placeholders::_1, 3);\n }\n\n int main(int argc, const char *[])\n {\n\
    \   return bind_3(std::plus<>{})(argc);\n }\n```\n\n图 120. `std::function` 和 `std::bind`\n\
    \n```cpp\n #include <functional>\n\n // std::bind 开启了 constexpr 支持\n [[nodiscard]]\
    \ constexpr auto bind_3(auto func)\n {\n   return std::bind(func, std::placeholders::_1,\
    \ 3);\n }\n\n int main(int argc, const char *[])\n {\n   return bind_3(std::plus<>{})(argc);\n\
    \ }\n```\n\n图 121. 仅使用 `std::bind`，作为加分项，函数 `bind_3` 返回什么类型？\n\n```cpp\n #include\
    \ <functional>\n\n [[nodiscard]] constexpr auto bind_3(auto func)\n {\n   return\
    \ func{ return func(value, 3); };\n }\n\n int main(int argc, const char *[])\n\
    \ {\n   return bind_3(std::plus<>{})(argc);\n }\n```\n\n图 122. 仅使用 lambda，没有标准库封装器。\n\
    \n| ![](img/leanpub_pencil.png) |  \n\n## 练习：观察 std::bind_front, std::bind_back\n\
    \n|\n\n```cpp\n #include <functional>\n\n [[nodiscard]] constexpr auto bind_3(auto\
    \ func)\n {\n   return std::bind_back(func, 3);\n }\n\n int main(int argc, const\
    \ char *[])\n {\n   return bind_3(std::plus<>{})(argc);\n }\n```\n\n图 123. C++23\
    \ 的 `bind_back`\n\n## 59.1: 资源\n\n* [CppCon 2015: Stephan T. Lavavej “：新特性与正确用法”](https://youtu.be/zt7ThwVfap0)\n\
    * [C++ Weekly Ep 16: “避免 `std::bind`”](https://youtu.be/ZlHi8txU4aQ)\n\n# 60:\
    \ 不要对非平凡类型使用 `initializer_list`\n\n“初始化列表（Initializer List）”是 C++ 中的一个重载术语。“初始化列表（Initializer\
    \ Lists）”用于直接初始化值。`initializer_list` 用于将一个值列表传递给函数或构造函数。\n\n| ![](img/leanpub_pencil.png)\
    \ |  \n\n## 练习：理解 `initializer_list` 可能会带来的开销\n\n|使用 Andreas Fertig 开发出的非常棒 [cppinsights.io](http://cppinsights.io)\
    \ 来理解这两个示例的作用\n\n```cpp\n#include <vector>\n#include <memory>\n\nstd::vector<std::shared_ptr<int>>\
    \ vec{\n   std::make_shared<int>(40), std::make_shared<int>(2)\n };\n```\n\n图\
    \ 124. 使用 `shared_ptr` 的 `initializer_list` 构造函数。\n\n```cpp\n#include <array>\n\
    #include <memory>\n\n std::array<std::shared_ptr<int>, 2> data{\n   std::make_shared<int>(40),\
    \ std::make_shared<int>(2)\n };\n```\n\n图 125. 使用 `shared_ptr` 的 `std::array`\
    \ 构建。\n\n并解释它们的区别。如果你能做到，说明你比大多数 C++ 开发者都懂得多。\n\n| ![](img/leanpub_pencil.png)\
    \ |  \n\n## 练习：理解为什么这无法编译\n\n|\n\n```cpp\n#include <vector>\n#include <memory>\n\
    \nstd::vector<std::unique_ptr<int>> data{\n   std::make_unique<int>(40), std::make_unique<int>(2)\n\
    \ };\n```\n\n图 126. 使用 `unique_ptr` 的 `initializer_list` 构造。\n\n## 60.1: 资源\n\n\
    * [C++Now 2018: Jason Turner “初始化列表坏了，让我们修复它们”](https://youtu.be/sSlmmMFsXQ) (深入探讨问题)\n\
    * [C++ Insights](https://cppinsights.io/)\n\n# 61: 考虑指定初始化 (C++20)\n\n直接初始化（Direct-Initialization）提供了一种初始化公共成员的高效方式。\n\
    \n```cpp\n#include <string>\n\n struct Data {\n   std::string first;\n   std::string\
    \ second;\n };\n\n int main() {\n   // 直接初始化 `first` 和 `second`\n   // 这没有拷贝或移动开销\n\
    \   Data d{\"Hello\", \"World\"};\n }\n```\n\n这种方式是 C++20 添加了“指定初始化（designated\
    \ initializers）”，允许你指定对象的名称。\n\n* 必须按顺序初始化\n* 名称必须是唯一的\n\n```cpp\n#include <string>\n\
    \n struct Data {\n   std::string first;\n   std::string second;\n };\n\n int main()\
    \ {\n   Data d{.first = \"Hello\", .second = \"World\"};\n }\n```\n\n图 127. 直接初始化示例\n\
    \n| ![](img/info-circle.png) |\n\n重要的是：编译器对指定初始化的支持是不一致的。确保在你的指定初始化时开启警告。\n\n\
    | ![](img/leanpub_pencil.png) |\n\n## 练习：与你的团队讨论你的偏好\n\n* 跳过参数是优势还是劣势？\n* 参数的名称重要吗？\n\
    * 在你的系统中强类型重要吗？\n\n| ![](img/leanpub_pencil.png) |\n\n## 练习：比较具有公共成员的简单 `struct`\
    \ 和带有构造函数的 `class`。\n\n```cpp\n#include <string>\n\n class Data {\n public:\n\
    \   // 添加构造函数、getter 和 setter\n   // 这更好吗？\n   // 它增加了多少编译时间和运行时开销？\n private:\n\
    \   std::string first;\n   std::string second;\n };\n```\n\n图 128. 实现构造函数和 getter\n\
    \n图 129.\n\n# 第 V 部分：附录章节\n\n# 62: 优化编译时间\n\n让编译时间不那么痛苦的一些实用考虑因素\n\n* 尽可能对代码去模板化\n\
    * 在适当使用前前声明\n* 在你的构建系统中启用 PCH（预编译头文件）\n* 使用 `ccache` 或类似的工具（有很多经常更新的选项，请自行搜索）\n\
    * 注意统一编译（unity builds）\n* 了解 `extern template` 的可能性和局限性\n* 使用构建分析工具查看编译时间花在哪里\n\
    \n## 62.1: 使用 IDE\n\n这是我观察到的使用现代 IDE 最令人意外的副作用：IDE 会对代码进行实时分析。实时分析意味着你在输入代码时就知道代码是否可以编译。因此，你减少了等待构建的时间。\n\
    \n| ![](img/leanpub_pencil.png) |  \n\n## 练习：编译时间让你付出了什么代价？\n\n"
