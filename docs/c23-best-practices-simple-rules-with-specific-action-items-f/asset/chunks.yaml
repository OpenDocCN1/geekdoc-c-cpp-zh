    \ |  \n\nTechnically non-`static` `constexpr` variables don’t have be calculated\
    \ at compile-time. However, it’s almost certain that they are, and it is handy\
    \ to think of them as calculated at compile-time.\n\n |\n\n| ![](styles/resources/leanpub_pencil.png)\
    \ |  \n\n## Exercise: `constexpr` Your `const` Values\n\n |\n\nWhile reading code,\
    \ look at all `const` values. Ask, “is this value known at compile time?” If it\
    \ is, what would it take to make the value `constexpr?`\n\n| ![](styles/resources/leanpub_pencil.png)\
    \ |  \n\n## Exercise: `static constexpr` Your `static const` Values\n\n |\n\n\
    Go through your current code base and look for code that is currently `static\
    \ const.` You probably have something, somewhere.\n\n*   If it’s currently `static\
    \ const,` it’s likely the size and data are known at compile time.\n\n*   Can\
    \ this code become `constexpr?`\n\n*   What is preventing it from being `constexpr?`"
