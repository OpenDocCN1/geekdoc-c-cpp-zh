  trans: "\n\n```\n 1 import std;\n 2 \n 3 int main()\n 4 {\n 5   // std::string is\
    \ not trivially constructible, so this calls\n 6   // the default constructor\
    \ and it is initialized to \"\"\n 7   std::string str;\n 8 \n 9   // explicitly\
    \ call the default constructor\n10   std::string str2{};\n11 \n12   // call the\
    \ constructor that takes a `const char *`\n13   // try commenting this out as\
    \ you play with various\n14   // optimization levels\n15   std::string str3 =\
    \ \"\";\n16 }\n```\n\n图 69 调用了哪个构造函数？\n\n| ![](img/leanpub_pencil.png) |    \n\
    \n## 练习：确保 `-Wuninitialized` 未禁用，并认真对待它。\n\n |\n\n## 46.1: 工具\n\n* [Valgrind 的\
    \ Memcheck](https://www.valgrind.org/info/tools.html#memcheck)\n\n* [Dr Memory](https://dynamorio.org/drmemory_docs/page-uninit.html)\n\
    \n## 46.2: 资源\n\n* [C++ Weekly - Ep 257 - 垃圾进，垃圾出 - 为什么初始化很重要](https://youtu.be/uYN6-YQPsGo)\n\
    \n* [COVID-19 研究与未初始化变量](https://www.viva64.com/en/b/0796/)\n\n* [Windows 中的图像解析模糊测试，第二部分：未初始化内存](https://www.fireeye.com/blog/threat-research/2021/03/fuzzing-image-parsing-in-windows-uninitialized-memory.html)\n\
    \n# 47: 在许多情况下优先使用 `auto`。\n\n我不是一个几乎总是自动（AAA）支持者，但让我问你这个问题：`std::count` 的结果类型是什么？\n\
    \n我的答案是，“我不在乎。”\n\n```\n1 const auto result = std::count( /* stuff */ );\n```\n\
    \n图 70 `const auto`\n\n或者，如果你喜欢的话：\n\n```\n1 auto const result = std::count( /*\
    \ stuff */ );\n```\n\n图 71 `auto const`\n\n| ![](img/leanpub_key.png) |    \n\n\
    使用 `auto` 可以避免不必要的转换和数据丢失。与范围循环（ranged-for loops）一样。`auto` 需要初始化，与 `const` 一样，其理由也是相同的。\n\
    \n```\n1 auto i; // 无法编译\n2 auto i = int; // 无法编译\n```\n\n图 72 auto 需要初始化\n\n\
    示例：\n\n```\n1 const std::string value = get_string_value();\n```\n\n图 73 可能的昂贵转换。\n\
    \n`get_string_value()` 的返回类型是什么？如果它是 `std::string_view` 或 `const char *`，我们将在所有编译器上获得一个潜在的昂贵转换，且没有任何诊断提示。\n\
    \n```\n1 // 避免转换\n2 const auto value = get_string_value();\n```\n\n图 74 没有可能性的昂贵转换。\n\
    \n此外，`auto` 返回类型实际上可以显著简化泛型代码。\n\n```\n1 // 我们来自“不要害怕模板”的示例\n2 template<typename\
    \ Arithmetic>\n3 Arithmetic divide(Arithmetic numerator, Arithmetic denominator)\
    \ {\n4   return numerator / denominator;\n5 }\n```\n\n图 75 C++ 98 模板用法。\n\n这段代码迫使我们对分子和分母使用相同的类型（尝试这样操作并看看你会得到的奇怪的编译错误）。\n\
    \n```\n1 template<typename Numerator, typename Denominator>\n2 /*返回类型是什么？*/\n\
    3 divide(Numerator numerator, Denominator denominator) {\n4   return numerator\
    \ / denominator;\n5 }\n```\n\n图 76 让 C++ 98 模板更具通用性？\n\nC++98 没有为这个问题提供解决方案，但\
    \ C++11 有。\n\n```\n1 // 使用尾随返回类型\n2 template<typename Numerator, typename Denominator>\n\
    3 auto divide(Numerator numerator, Denominator denominator)\n4   -> decltype(numerator\
    \ / denominator)\n5 {\n6   return numerator / denominator;\n7 }\n```\n\n图 77 C++11\
    \ 尾随返回类型。\n\n但在 C++14 中，我们可以完全省略返回类型（记得跳过 C++11）。\n\n```\n1 template<typename\
    \ Numerator, typename Denominator>\n2 auto divide(Numerator numerator, Denominator\
    \ denominator)\n3 {\n   return numerator / denominator;\n5 }\n```\n\n图 78 C++14\
    \ `auto` 返回类型。\n\n在 C++20 中，我们可以通过 `auto` 函数参数进一步简化这段代码（它为我们创建了隐式模板）\n\n```\n\
    1 auto divide(auto numerator, auto denominator)\n2 {\n3   return numerator / denominator;\n\
    4 }\n```\n\n图 79 C++20 `auto` 参数。\n\n如果这对你的应用程序有意义，考虑对这些参数进行约束\n\n```cpp\n1 //\
    \ 这应该是 constexpr 且带有 [[nodiscard]]\n2 std::floating_point auto divide(\n3    \
    \ std::floating_point auto numerator, std::floating_point auto denomi\\\n4 nator)\n\
    5 {\n6   return numerator / denominator;\n7 }\n```\n\n图 80 约束参数。\n\n| ![](img/leanpub_pencil.png)\
    \ |    \n\n## 练习：熟悉 `auto`\n\n```\n1 const int();\n2 \n3 main() {\n4   auto val\
    \ = get();\n5 }\n```\n\n# 48: 使用范围（Ranges）和视图（Views）提高正确性和可读性\n\n在最好情况下，C++20\
    \ 范围和视图可以在不影响性能或编译时间的情况下极大提高代码的可读性。\n\n在最坏的情况下，C++20 范围和视图可能会增加编译时间并影响代码的可读性。\n\
    \n由于某些缺点，有些人建议永远不要使用。本书没有那样建议。相反，我们应该学习它们的优缺点。\n\n作者认为“遍历第一个元素之外的所有元素”这一简单用例是范围和视图的“杀手级特性”。\n\
    \n```\n1 void print_all_but_first(const std::vector<int> &values) {\n2   // 忘记这个在\
    \ 0 个元素时会产生未定义行为（UB）\n3   if (values.empty()) { return; }\n4 \n5   for (auto itr\
    \ = next(begin(values)); itr != end(values); ++itr) {\n6     std::println(\"{}\"\
    , *itr);\n7   }\n8 }\n```\n\n图 87 不使用范围。\n\n```cpp\n1 void print_all_but_first(const\
    \ std::vector<int> &values) {\n2   for (const auto val : values | std::views::drop(1))\
    \ {\n3     std::println(\"{}\", val);\n4   }\n5 }\n```\n\n图 88 使用范围。\n\n除了范围库更复杂且可组合的功能外，请注意这些非常简单但强大的用例。\n\
    \n| ![](img/leanpub_pencil.png) |    \n\n## 练习：阅读 [`en.cppreference.com/w/cpp/ranges`](https://en.cppreference.com/w/cpp/ranges)\
    \ 可用的视图集。\n\n |\n\n| ![](img/leanpub_pencil.png) |    \n\n## 练习：使用 [compiler explorer](https://compiler-explorer.com)\
    \ 在不同的优化级别对比上述两个函数。\n\n |\n\n"
