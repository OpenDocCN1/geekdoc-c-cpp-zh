- fmt: "\nTechnically it isn’t the check that is Undefined Behavior (UB). But it’s\
    \ impossible for the check ever to fail. If the `this` were to be equal to `nullptr`,\
    \ you would be in a state of Undefined Behavior. People used to do this all the\
    \ time, but it’s always been UB. You cannot access an object outside its lifetime.\
    \ Compilers today will always remove this check.\n\nThe only way it’s theoretically\
    \ possible for `this` to be null is when you call a member directly on a null\
    \ object.\n\n| ![](styles/resources/leanpub_warning.png) |  \n\nBad examples lie\
    \ ahead, do not repeat them.\n\n```\n1 Type *obj = nullptr;\n2 obj->do_thing();\
    \ // never do this\n```\n\nFigure 3. Bad call of member on `nullptr`.\n\nEven\
    \ in the (technically OK, but never do this) scenario of calling `delete this`\
    \ .\n\n```\n 1 struct S {\n 2   std::string data;\n 3 \n 4   void delete_yourself()\
    \ {\n 5     // do things\n 6     delete this; // technically OK\n 7 \n 8     if\
    \ (this) {\n 9       // this block will always be executed, nothing changed\n\
    10       // our view of `this` \n11     }\n 12     \n 13     // never do this\n\
    \ 14     data.size(); // UB, data's lifetime has ended\n15   }\n 16 };\n```\n\n\
    Figure 4. Bad example of `delete this`.\n\nThere is no scenario in which a check\
    \ for `if (this)` will return false on a modern compiler.\n\n| ![](styles/resources/leanpub_pencil.png)\
    \ |  \n\n## Exercise: Do you check for `this` to be `nullptr`?\n\nA check for\
    \ `nullptr` can hide as a check for `NULL` or a check against `0`. A check for\
    \ `this` to be `NULL` is likely to only exist in very old code bases. Make sure\
    \ you have your warnings enabled, then look for these cases.\n\nIt’s probably\
    \ interesting in general to search for `this ==` in your codebase and see what\
    \ weird things are there.\n\n## 12.1: Resources\n\n*   [Porting to GCC-6 Optimizations\
    \ remove null pointer checks for `this`](https://www.gnu.org/software/gcc/gcc-6/porting_to.html#this-cannot-be-null)\n\
    \n# 13: Never Test for a Reference To Be `nullptr`, It’s UB\n\n```\n1 int get_value(int\
    \ &thing) {\n2   if (&thing == nullptr) {\n3     // removed by compiler \n4  \
    \   return 42;\n5   } else {\n6     return thing;\n7   }\n8 }\n```\n\nFigure 5.\
    \ Tests for `null` references are removed\n\nIt’s UB to make a null reference,\
    \ don’t try it. Always assume a reference refers to a valid object. Use this fact\
    \ to your advantage when designing API’s (`#all_chapter_contents.xhtml_make-interfaces-hard-to-use-wrong).\n\
    \n| ![](styles/resources/leanpub_pencil.png) |  \n\n## Exercise: Check for checking\
    \ the address of an object\n\nThere are many valid use cases for `&thing ==` to\
    \ check for a specific address of an object, but there are also many ways this\
    \ check can be wrong.\n\nSearch through your code for statements that check an\
    \ object’s memory address and understand what they are doing and how (or if) they\
    \ work.\n\n| ![](styles/resources/leanpub_question-circle.png) |  \n\nWhat other\
    \ ways might the address of an object be checked besides `==`?\n\nThis exercise\
    \ gives you some great experience working with various searching / grepping tools\
    \ and playing with regex.\n\n## 13.1: Resources\n\n*   [-Wtautological-undefined-compare](https://clang.llvm.org/docs/DiagnosticsReference.html#wtautological-undefined-compare)\n\
    \n# Part II: Use The Tools\n\n# 14: Use The Tools: Automated Tests\n\nYou need\
    \ a single command to run tests. If you don’t have that, no one will run the tests.\n\
    \n*   [Catch2](https://github.com/catchorg/Catch2) - popular and well supported\
    \ testing framework from [Phil Nash](https://twitter.com/phil_nash) and [Martin\
    \ Hořeňovský](https://twitter.com/horenmar_ctu)\n*   [doctest](https://github.com/onqtam/doctest)\
    \ - similar to catch2, but trimmed for compile-time performance\n*   [Google Test](https://github.com/google/googletest)\n\
    *   [Boost.Test](https://www.boost.org/doc/libs/1_74_0/libs/test/doc/html/index.html)\
    \ - testing framework, boost style.\n\n`ctest`(https://cmake.org/cmake/help/latest/manual/ctest.1.html)\
    \ is a test runner for CMake that can be used with any of the above frameworks.\
    \ It is utilized via the `add_test`(https://cmake.org/cmake/help/latest/command/add_test.html)\
    \ feature of CMake.\n\nAn ideal build / test scenario with CMake might look like\
    \ this:\n\n```\n1 cmake -S ../src/dir -B builddir -G <Generator>\n2 cmake --build\
    \ builddir --config <Configuration>\n3 cd builddir\n4 ctest -C <Configuration>\n\
    ```\n\nFigure 6. Possible easy build/test steps\n\nYou need to be familiar with\
    \ these tools, what they do, and pick from them.\n\nWithout automated tests the\
    \ rest of this book is pointless. You cannot apply the practical exercises if\
    \ you cannot verify that you did not break the existing code.\n\nOleg Rabaev on\
    \ CppCast stated:\n\n*   If a component is hard to test, it is not properly designed.\n\
    *   If a component is easy to test, it is a good indication that it is properly\
    \ designed.\n*   If a component is properly designed, it is easy to test.\n\n\
    | ![](styles/resources/leanpub_pencil.png) |  \n\n## Exercise: Can you run a single\
    \ command to run a suite of tests?\n\n*   Yes: Excellent! Run the tests and make\
    \ sure they all pass!\n*   No: Does your program produce output?\n    *   Yes:\
    \ Start with “[Approval Tests](https://cppcast.com/clare-macrae/),” which will\
    \ give you the foundation you need to get started with testing.\n    *   No: Develop\
    \ a strategy for how to implement some minimal form of testing.\n\n## 14.1: Resources\n\
    \n*   [CppCon 2018: Phil Nash “Modern C++ Testing with Catch2”](https://youtu.be/Ob5rFQH0)\n\
    *   [CppCon 2019: Clare Macrae “Quickly Testing Legacy Code with Approval Tests”](https://youtu.be/3GZHvcd3s)\n\
    *   [C++ on Sea 2020: Clare Macrae “Quickly and Effectively Testing C++ Code with\
    \ Approval Tests”](https://youtu.be/tXEuf_3RE)\n*   [CppCast Ep 263: Unit Testing\
    \ with Olegabaev](https://cppcast.com/testing-rabaev/)\n\n# 15: Use the Tools:\
    \ Continuous Builds\n\nWithout automated tests, it is impossible to maintain project\
    \ quality.\n\nIn the C++ projects I have worked on throughout my career, I’ve\
    \ had to support some combination of:\n\n*   x86\n*   x64\n*   SPARC\n*   ARM\n\
    *   MIPS On\n\n*   Windows\n*   Solaris\n*   MacOS\n*   Linux\n\nWhen you start\
    \ to combine multiple compilers across multiple platforms, it becomes increasingly\
    \ likely that a significant change on one platform will break one or more platforms.\n\
    \nTo solve this problem, enable continuous builds with continuous tests for your\
    \ projects.\n\n*   Test all possible platforms that you support\n*   Test Debug\
    \ and Release separately\n*   Test all configuration options\n*   Test against\
    \ newer compilers than you support\n\n| ![](styles/resources/leanpub_info-circle.png)\
    \ |  \n\nSanitizers can only instrument code not removed by the optimizer, but\
    \ the optimizer exploits some times of UB, so you need *at least* Debug, Debug\
    \ + Sanitizers, Release, Release + Sanitizers for *at least* one platform you\
    \ support!\n\n| ![](styles/resources/leanpub_key.png) |  \n\nIf you don’t require\
    \ 100% tests passing, you will never know the code’s state.\n\n| ![](styles/resources/leanpub_pencil.png)\
    \ |  \n\n## Exercise: Enable continuous builds\n\nUnderstand your organization’s\
    \ current continuous build environment. If one does not exist, what are the barriers\
    \ to getting it up? How hard would it be to get something like GitLab, GitHub\
    \ actions, Appveyor, or Travis set up for your projects?\n\n# 16: Use the Tools:\
    \ Compiler Warnings\n\nThere are many warnings you are not using, most of them\
    \ beneficial. `-Wall` is *not* all warnings on GCC and Clang. `-Wextra` is still\
    \ barely scratching the surface!\n\n| ![](styles/resources/leanpub_info-circle.png)\
    \ |  \n\n`/Wall` on MSVC is *all* of the warnings. Our compiler writers do not\
    \ recommend using `/Wall` on MSVC or `-Weverything` on Clang, because many of\
    \ these are diagnostic warnings that are not actionable. GCC does not provide\
    \ an equivalent.\n"
