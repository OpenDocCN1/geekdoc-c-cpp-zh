    \ Algorithms with explicit iterators\n\nNote that in some [rare cases](https://sourceforge.net/p/cppcheck/wiki/ListOfChecks/),\
    \ your [static analysis tools](#all_chapter_contents.xhtml_static-analysis) might\
    \ be able to suggest an algorithm to use.\n\n| ![](styles/resources/leanpub_pencil.png)\
    \ |  \n\n## Exercise: Study existing loops\n\n |\n\nNext time you are reading\
    \ through a loop in your codebase, cross-reference it with [the C++ `<algorithm>`\
    \ header](https://en.cppreference.com/w/cpp/algorithm) and try to find an algorithm\
    \ that applies instead.\n\n| ![](styles/resources/leanpub_info-circle.png) | \
    \ \n\nThis book only barely mentions C++20’s ranges. Compilers are just now getting\
    \ support for ranges as of the publication of this book. Ranges can be composed\
    \ and have full support for `constexpr.`\n\n |\n\n## 50.1: Resources\n\n*   [GoingNative\
    \ 2013: Sean Parent “C++ Seasoning”](https://channel9.msdn.com/Events/GoingNative/2013/Cpp-Seasoning)\n\
    \n*   [CppCon 2018: Jonathan Boccara “105 Algorithms in Less Than an Hour”](https://youtu.be/2olsGf6JIkU)\n\
    \n*   [C++ Now 2019: Conor Hoekstra “Algorithm Intuition”](https://youtu.be/48gV1SNm3WA)\n\
    \n*   [MeetingC++ 2019: Conor Hoekstra “Better Algorithm Intuition”](https://youtu.be/TSZzvo4htTQ)\n\
    \n*   [Conor Hoekstra “The Twin Algorithms”](https://www.youtube.com/live/NiferfBvN3s)\n\
    \n*   [C++ Weekly Ep 187 “C++20’s `constexpr` Algorithms”](https://youtu.be/9YWzXSr2onY)\n\
    \n*   [C++ Weekly Ep 105 “Learning “Modern” C++ 5: Looping And Algorithms](https://youtu.be/A0-x-Djey-Q)\n\
    \n*   [Algorithm Selection](https://codereport.github.io/Algorithm-Selection/)\n\
    \n# 51: Use Ranged-For Loops When Views and Algorithms Cannot Help\n\n(Carefully)\
    \ prefer ranges, views, and algorithms, but use ranged-for loops as your next\
    \ possible option.\n\n```\n1 for (int i = 0; i < container.size(); ++i) { \n2\
    \   // oops mismatched types\n3 }\n```\n\nFigure 96\\. `int` vs `std::size_t`\
    \ when looping.\n\n```\n1 for (auto itr = container.begin();\n2      itr != container2.end();\n\
    3      ++itr) { \n4   // oops, most of us have done this at some point\n5 }\n\
    ```\n\nFigure 97\\. Mismatched containers while looping.\n\n```\n1 for(const auto\
    \ &element : container) {\n2   // eliminates both other problems \n3 }\n```\n\n\
    Figure 98\\. Example of ranged-for loop.\n\n| ![](styles/resources/leanpub_warning.png)\
    \ |  \n\nNever mutate the container itself while iterating inside of a ranged-for\
    \ loop.\n\n |\n\n| ![](styles/resources/leanpub_pencil.png) |  \n\n## Exercise:\
    \ Modernize Your Loops\n\n |\n\nYou probably have old-style loops in your code.\n\
    \n1.  Apply clang-tidy’s modernize-loop-convert check.\n\n2.  Look for loops that\
    \ could not be converted.\n\n    *   Loops that could not be converted might represent\
    \ bugs in the code\n\n    *   Loops that could not be converted, but do not have\
    \ bugs, are good candidates for simplification\n\n## 51.1: Resources\n\n*   [clang-tidy\
    \ modernize-loop-convert](https://clang.llvm.org/extra/clang-tidy/checks/modernize-loop-convert.html)\n\
    \n# 52: Use `auto` in ranged for loops\n\nNot using `auto` can make it easier\
    \ to have silent mistakes in your code.\n\n```\n1 for (const int value : container_of_double)\
    \ {\n2   // accidental conversion, possible warning \n3 }\n```\n\nFigure 99\\\
    . Accidental conversions\n\n```\n1 for (const base value : container_of_derived)\
    \ { \n2   // accidental silent slicing\n3 }\n```\n\nFigure 100\\. Accidental slicing\n\
    \n```\n1 for (const auto &value : container) {\n2   // no possible accidental\
    \ conversion\n3 }\n```\n\nFigure 101\\. No problem\n\nPrefer:\n\n*   `const auto\
    \ &` for non-mutating loops\n\n*   `auto &` for mutating loops\n\n*   `auto &&`\
    \ only when you have to work with weird types like `std::vector<bool>,` or if\
    \ moving elements out of the container\n\n| ![](styles/resources/leanpub_pencil.png)\
    \ |  \n\n## Exercise: Understand `std::map` and ranged `for` loops\n\n |\n\nUnderstand\
    \ what this code is doing. Is it making a copy? Why and how?\n\n```\n1 std::map<std::string,\
    \ int> get_map();\n2 \n3 using element_type = std::pair<std::string, int>;\n4\
    \ \n5 for (const element_type & : get_map())\n6 {\n7 }\n```\n\nFigure 102\\. Accidental\
    \ copy?\n\n| ![](styles/resources/leanpub_info-circle.png) |  \n\nModern compilers\
    \ can directly catch the above issue, but you have to enable your warnings to\
    \ see it!\n\n |\n\n| ![](styles/resources/leanpub_pencil.png) |  \n\n## Exercise:\
    \ Enable ranged-loop related warnings\n\n |\n\nMake sure `-Wrange-loop-construct`\
    \ is enabled in your code, which is automatically included with `-Wall.`\n\n#\
    \ 53: Avoid `default` In `switch` Statements\n\nThis is an issue that is best\
    \ described with a series of examples. Starting from this one:\n\n```\n 1 enum\
    \ class Values {\n 2   val1,\n 3   val2\n 4 };\n 5 \n 6 [[nodiscard]] constexpr\
    \ std::string_view get_name(Values value) {\n 7   switch (value) {\n 8   case\
    \ Values::val1: return \"val1\";\n 9   case Values::val2: return \"val2\";\n10\
    \   }\n11 }\n```\n\nFigure 103\\. `switch` with warnings"
