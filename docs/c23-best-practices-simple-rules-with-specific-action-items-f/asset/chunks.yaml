  trans: "\n\n*   修改填充 `static const` 数据的函数需要多少工作量，以便它们也成为 `constexpr`？\n\n*   请记住，如果它是头文件中的全局变量，你应该优先使用\
    \ `inline constexpr`。\n\n## 练习：让头文件代码转为 `constexpr`\n\n如果你已经在头文件中定义了函数和类型，尝试让这些函数和类型完全启用\
    \ `constexpr` 属性。\n\n## 练习：将头文件中定义的 `constexpr` 函数移动到模块接口文件中\n\n我们希望避免继续重复解析 `constexpr`\
    \ 函数，而模块接口文件为我们提供了这种方法。\n\n## 练习：寻找额外的非 IO 函数并转为 `constexpr`\n\n在学习旅程的这个阶段，基本上任何非\
    \ IO 函数都可以转变为 `constexpr` 函数。\n\n*   将这些函数移动到你的模块接口文件中。\n*   将函数标记为 `constexpr`。\n\
    \n## 43.1: 资源\n\n*   [C++Now 2017: Ben Deane & JasonTurner “`constexpr` 全面体”](https://youtu.be/HMB9oXFobJc)（与现代\
    \ `constexpr` 技术相比稍显过时）\n*   [C++ Weekly Ep 233: `constexpr` map vs `std::map`](https://youtu.be/INn3xa4pMfg)\n\
    *   [Meeting C++ 2017: Jason Turner “实用的 `constexpr`”](https://youtu.be/xtf9qkDTrZE)\n\
    *   [C++ Russia 2019: Hana Dusíková “编译期正则表达式的状态”](https://youtu.be/r_ZASJFQGQI)\n\
    *   [C++ Weekly Ep 312: 停止使用 `constexpr`（改用这个！）](https://youtu.be/4pKtPWcl1Go)\n\
    *   [C++ Weekly: `constexpr` vs `static constexpr`](https://youtu.be/IDQ0ng8RIqs)\n\
    *   [C++ Weekly: `static constexpr` vs `inline constexpr`](https://youtu.be/QVHwOOrSh3w)\n\
    *   [cons_expr: 一种支持编译时的类 Scheme 脚本语言](https://github.com/lefticus/cons_expr)\n\
    \n# 44: 让头文件中的全局变量变为 `inline constexpr`\n\n1.  畏惧全局状态！\n2.  忘记头文件的存在吧！\n\n所有全局数据都应该是\
    \ `constexpr` 的。\n\n但全局 `constexpr` 值是完全安全的。它们不会变变，也不会影响“远处的神秘作用”。\n\n如果你还没有完全迁移到模块（modules），仍然在使用头文件……\n\
    \n所有的全局 `constexpr` 值都应该是 `inline constexpr`。\n\n在模块接口内部，`constexpr` 全局变量和 `inline\
    \ constexpr` 全局变量都具有“外部链接”（external linkage），所以我们不需要担心这个问题。\n\n```\n1 // my_library.hpp\n\
    2 \n3 // 对象 `dataset` 将在包含该 .hpp 文件的每个 .cpp\n4 文件中重复\n5 static constexpr auto\
    \ dataset = make_data();\n```\n图 63. static constexpr 示例\n\n```\n1 // my_library.hpp\n\
    2 \n3 // 对象 `dataset` 在整个二进制文件中存在一次\n4 inline constexpr auto dataset = make_data();\n\
    ```\n图 64. inline constexpr 示例\n\n# 45: 对所有非 `constexpr` 的内容使用 `const`\n\n许多人（如\
    \ Kate Gregory 和 James McNellis）已经多次说过这一点。将对象标记为 `const`可以起到两个作用：\n\n1.  它强制我们思考对象的初始化和生命周期，这会影响性能。\n\
    2.  向代码的阅读者传达语义。\n\n顺便提一下，如果是静态对象，编译器现在可以自由将其移动到二进制文件的常量部分，这会影响优化器。\n\n## 练习：寻找\
    \ `const` 机会。\n\n在阅读代码时，你应该寻找不是 `const` 的变量并将它们设为 `const`。\n\n*   如果一个变量不是 `const`，问问为什么不是？\n\
    *   使用 lambda 或添加命名函数是否可以让你让该值变为 `const` ？\n\n```\n1 const auto data = [](){ //\
    \ 无参数\n2   std::vector<int> result;\n3   // 用某些内容填充 result。\n4   return result;\n\
    5 }(); // 立即调用\n```\n图 65\n\n使用 lambda 或添加命名函数是否可以让你让该值变为 `const` ？\n\n由于 RVO（返回值优化），使用\
    \ lambda 可能会提高性能。\n\n然而，需要注意的是，值的 `constexpr` 可能是脆弱的。\n\n```\n1 ReturnType some_function(int\
    \ value)\n2 {\n3   // 如果结果的类型不同\n4   // 且存在隐式转换，你会得到\n5   // 隐式移动。\n6   // 如果它们相同，则保证\n\
    7   // 应用去 constexpr 化\n8   const auto result = get_value(42);\n9   return result;\n\
    10 }\n```\n图 66\n\n```\n1 ReturnType some_function(int value)\n2 {\n3   // 如果结果的类型不同\n\
    4   // 且存在隐式转换，你会得到\n5   // 隐式移动。\n6   // 如果它们相同，则保证\n7   // 应用去 constexpr 化\n\
    8   return get_value(42);\n9 }\n```\n图 67. 优先不要为临时变量`命名`\n\nclang-tidy 的 [No Move](https://clang.llvm.org/extra/clang-tidy/checks/performance-automatic-move.html)\
    \ 分析在很大程度上是失效的。它在 `constexpr` 适用时也会警告，而在需要的地方却不警告。参见此分析：[`compiler-explorer.com/z/a476nb`](https://compiler-explorer.com/z/a476nb)。\n\
    \n你可能不想让 `class` 成员成为 `const`；这会破坏移动 语义等基本功能。\n\n# 46: 始终初始化你的非 const、非 auto 值\n\
    \n理想情况是将所有内容 `const`，这会强制你进行初始化。然而，并非总是可行。同样，如果你使用 `auto`，你会被强制初始化对象。\n\n*   编译器将“丢弃”对未初始化值的操作\n\
    *   确保启用了 `-Wunitialized` 类的警告\n\n请注意，在某些情况下，默认初始化与看似空的初始化之间存在差异。\n\n编译器并不总是能完美捕捉未初始化值的使用。例如，GCC（截至\
    \ 2023-12-30）需要开启优化才能捕捉这种未初始化变量的访问，这是未定义行为（UB）。\n\n```\n 1 #include <span>\n2\
    \ \n3 float sum(std::span<float> values)\n4 {\n 5   float result;\n6 \n7   for\
    \ (const auto f : values) {\n8     result += f;\n9   }\n10 \n11   return result;\n\
    12 }\n```\n图 68. 在未开启优化时 GCC 无法捕捉的未初始化变量读取\n\n## 练习：理解你正在调用哪个构造函数\n\n获取此示例代码并在\
    \ compiler-explorer.com 中以不同的优化级别进行调试，以理解每次构造函数调用可能执行的差异。\n\n"
- fmt: "\n```\n 1 import std;\n 2 \n 3 int main()\n 4 {\n 5   // std::string is not\
    \ trivially constructible, so this calls\n 6   // the default constructor and\
    \ it is initialized to \"\"\n 7   std::string str;\n 8 \n 9   // explicitly call\
    \ the default constructor\n10   std::string str2{};\n11 \n12   // call the constructor\
    \ that takes a `const char *`\n13   // try commenting this out as you play with\
    \ various\n14   // optimization levels\n15   std::string str3 = \"\";\n16 }\n\
    ```\n\nFigure 69\\. which constructor is called?\n\n| ![](styles/resources/leanpub_pencil.png)\
    \ |    \n\n## Exercise: Make sure `-Wuninitialized` is not disabled, and take\
    \ it seriously.\n\n |\n\n## 46.1: Tools\n\n* [Valgrind’s Memcheck](https://www.valgrind.org/info/tools.html#memcheck)\n\
    \n* [Dr Memory](https://dynamorio.org/drmemory_docs/page-uninit.html)\n\n## 46.2:\
    \ Resources\n\n* [C++ Weekly - Ep 257 - Garbage In, Garbage Out - Why Initialization\
    \ Matters](https://youtu.be/uYN6-YQPsGo)\n\n* [COVID-19 Research and Uninitialized\
    \ Variable](https://www.viva64.com/en/b/0796/)\n\n* [Fuzzing Image Parsing in\
    \ Windows, Part Two: Uninitialized Memory](https://www.fireeye.com/blog/threat-research/2021/03/fuzzing-image-parsing-in-windows-uninitialized-memory.html)\n\
    \n# 47: Prefer `auto` in Many Cases.\n\nI’m not an [Almost Always Auto](#all_chapter_contents.xhtml_almost-always-auto)\
    \ (AAA) person, but let me ask you this: What is the result type of `std::count`?\n\
    \nMy answer is, “I don’t care.”\n\n```\n1 const auto result = std::count( /* stuff\
    \ */ );\n```\n\nFigure 70\\. `const auto`\n\nor, if you prefer:\n\n```\n1 auto\
    \ const result = std::count( /* stuff */ );\n```\n\nFigure 71\\. `auto const`\n\
    \n| ![](styles/resources/leanpub_key.png) |    \n\nUsing `auto` avoids unnecessary\
    \ conversions and data loss. Same as ranged-for loops. `auto` requires initialization,\
    \ the same as `const,`, the same reasoning for why that’s good.\n\n```\n1 auto\
    \ i; // cannot compile\n2 auto i = int; // cannot compile\n```\n\nFigure 72\\\
    . auto requires initializtion\n\nExample:\n\n```\n1 const std::string value =\
    \ get_string_value();\n```\n\nFigure 73\\. Possible expensive conversion.\n\n\
    What is the return type of `get_string_value()`? If it is `std::string_view` or\
    \ `const char *`, we will get a potentially costly conversion on all compilers\
    \ with no diagnostic.\n\n```\n1 // avoids conversion\n2 const auto value = get_string_value();\n\
    ```\n\nFigure 74\\. No possible expensive conversion.\n\nFurthermore, `auto` return\
    \ types actually can significantly simplify generic code.\n\n```\n1 // our example\
    \ from \"Don't Be Afraid of Templates\"\n2 template<typename Arithmetic>\n3 Arithmetic\
    \ divide(Arithmetic numerator, Arithmetic denominator) {\n4   return numerator\
    \ / denominator;\n5 }\n```\n\nFigure 75\\. C++ 98 template usage.\n\nThis code\
    \ forces us to use the same type for both the numerator and denominator (play\
    \ with this and see the weird compile errors you get).\n\n```\n1 template<typename\
    \ Numerator, typename Denominator>\n2 /*what's the return type*/\n3 divide(Numerator\
    \ numerator, Denominator denominator) {\n4   return numerator / denominator;\n\
    5 }\n```\n\nFigure 76\\. C++ 98 template made more generic?\n\nC++98 provides\
    \ no solution to this problem, but C++11 does.\n\n```\n1 // use trailing return\
    \ type\n2 template<typename Numerator, typename Denominator>\n3 auto divide(Numerator\
    \ numerator, Denominator denominator)\n4   -> decltype(numerator / denominator)\n\
    5 {\n6   return numerator / denominator;\n7 }\n```\n\nFigure 77\\. C++11 trailing\
    \ return types.\n\nBut in C++14, we can leave off the return type altogether (remember\
    \ to [Skip C++11](#all_chapter_contents.xhtml_skip-cpp-11)).\n\n```\n1 template<typename\
    \ Numerator, typename Denominator>\n2 auto divide(Numerator numerator, Denominator\
    \ denominator)\n3 {\n   return numerator / denominator;\n5 }\n```\n\nFigure 78\\\
    . C++14 `auto` return types.\n\nIn C++20 we can simplify this code further with\
    \ `auto` function parameters (which create implicit templates for us)\n\n```\n\
    1 auto divide(auto numerator, auto denominator)\n2 {\n3   return numerator / denominator;\n\
    4 }\n```\n\nFigure 79\\. C++20 `auto` parameters.\n\nConsider constraining these\
    \ parameters if it makes sense for your application\n\n```\n1 // this should also\
    \ be constexpr and [[nodiscard]]\n2 std::floating_point auto divide(\n3     std::floating_point\
    \ auto numerator, std::floating_point auto denomi\\\n4 nator)\n5 {\n6   return\
    \ numerator / denominator;\n7 }\n```\n\nFigure 80\\. Constrained parameters.\n\
    \n| ![](styles/resources/leanpub_pencil.png) |    \n\n## Exercise: Become familiar\
    \ with `auto`\n\n```\n1 const int();\n2 \n3 main() {\n4   auto val = get();\n\
    5 }\n```\n\n# 48: Use Ranges and Views For Correctness and Readability\n\nAt their\
    \ best C++20 ranges and views can drastically increase readability and correctness\
    \ of your code without impacting performance or compile times.\n\nAt their worst\
    \ C++20 ranges and views can drastically increase compile times, runtimes, and\
    \ affect the readability of your code.\n\nBecause of some the potential drawbacks\
    \ to ranges and views, there are some who recommend never using them. This book\
    \ does not call for that. Instead, we say you should learn their strengths and\
    \ weaknesses.\n\nThis author considers the humble case of “loop over all elements\
    \ except for the first” to be the “killer feature” of ranges and views.\n\n```\n\
    1 void print_all_but_first(const std::vector<int> &values) {\n2   // forget this\
    \ and you have UB with 0 element\n3   if (values.empty()) { return; }\n4 \n5 \
    \  for (auto itr = next(begin(values)); itr != end(values); ++itr) {\n6     std::println(\"\
    {}\", *itr);\n7   }\n8 }\n```\n\nFigure 87\\. Skip first element, without ranges.\n\
    \n```\n1 void print_all_but_first(const std::vector<int> &values) {\n2   for (const\
    \ auto val : values | std::views::drop(1)) {\n3     std::println(\"{}\", val);\n\
    4   }\n5 }\n```\n\nFigure 88\\. Skip first element, with ranges.\n\nBe aware of\
    \ these very simple but very powerful use cases, besides the much more complex\
    \ and composable features of the ranges library.\n\n| ![](styles/resources/leanpub_pencil.png)\
    \ |    \n\n## Exercise: Read through the set of views available [https://en.cppreference.com/w/cpp/ranges](https://en.cppreference.com/w/cpp/ranges).\n\
    \n |\n\n| ![](styles/resources/leanpub_pencil.png) |    \n\n## Exercise: Use [compiler\
    \ explorer](https://compiler-explorer.com) to compare and contrast the two functions\
    \ above at different optimization levels.\n\n |\n\n## 48.1: Resources\n\n* [C++\
    \ Weekly - Ep 391 - Finally! C++23’s std::views::enumerate](https://youtu.be/HuRbLPRh-Nk)\n\
    \n* [C++ Weekly - Ep 398 - C++23’s zip_view](https://youtu.be/MVXGdwREo_E)\n"
