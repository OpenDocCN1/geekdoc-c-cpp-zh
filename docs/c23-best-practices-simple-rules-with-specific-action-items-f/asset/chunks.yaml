  trans: "\n在 MacOS 上，请确保你使用的编译器确实是你所认为的那一个。`gcc` 命令很可能是 Apple 安装的 clang 的软链接。\n\n\
    ![](img/leanpub_warning.png)\n\n`apple-clang` 与主线 clang 不是一回事，它们的版本号也不匹配。通常很难知道\
    \ `apple-clang` 支持哪些功能。cppreference 的[编译器支持参考文档](https://en.cppreference.com/w/cpp/compiler_support)\
    \ 可能会有所帮助。\n\n要在你的平台上安装较新版本或不同的编译器，可以参考以下方法：\n\n### Ubuntu / Debian\n*   `GCC`\
    \ - [工具链 PPA](https://launchpad.net/~ubuntu-toolchain-r/+archive/ubuntu/ppa)\n\
    *   `Clang` - [apt 软件包](https://apt.llvm.org/)\n\n### Windows\n*   [GCC MinGW](http://mingw.org/)\n\
    *   [Clang 官方下载](https://releases.llvm.org/download.html)\n\n### MacOS\n*   Homebrew\
    \ / MacPorts\n\n![](img/leanpub_pencil.png)\n\n## 练习：添加另一个编译器\n\n既然你已经开启了系统的持续构建，现在是添加另一个编译器的时候了。\n\
    \n你当前需要的编译器的新版本总是个好主意。但如果你只支持 `GCC`，考虑添加 `Clang`。如果你只支持 `Clang`，请添加 `GCC`。如果你在\
    \ Windows 上，除了 `MSVC` 之外，添加 `MinGW` 或 `Clang`。\n\n![](img/leanpub_pencil.png)\n\
    \n## 练习：添加另一个操作系统\n\n希望你的项目至少部分可以移植到另一个操作系统。让项目部分在另一个操作系统和工具链上编译的练习将让你深入了解你代码的本质。\n\
    \n## 21.1: 资源\n\n*   [C++Now 2015: Jason Turner “思考移植性：如何以及为什么让你的 C++ 跨平台”](https://youtu.be/cb3WIL96N-o)\n\
    \n# 22：使用工具：模糊测试与变异\n\n你的想象力限制了你所创建的测试。在调用 API 时你会尝试进行恶意调用吗？你会故意向输入传递格式错误的数据吗？你会处理来自未知或不可信源的输入吗？\n\
    \n为所有可能的组合中的所有函数调用生成所有可能的输入是不可能的。幸运的是，有工具可以解决这个问题。\n\n## 22.1: 模糊测试 (Fuzzing)\n\
    \n模糊测试器生成各种长度的随机数据字符串。你编写的测试框架消耗这些数据字符串，并以适用于你的应用程序的方式进行处理。模糊测试器分析由测试执行生成的覆盖率数据，并利用这些信息移除冗余测试，生成新的新颖且独特的测试。\n\
    \n从理论上讲，如果运行足够的时间，模糊测试最终将达到被测试代码 100% 的覆盖率。结合 `AddressSanitizer`，这成为了一个发现代码中 bug\
    \ 的强大工具。[来自 2015 年的一篇有趣文章](https://blog.hboeck.de/archives/868-How-Heartbleed-couldve-been-found.html)\
    \ 描述了模糊测试器与 `AddressSanitizer` 的结合如何在不到 6 小时内发现 OpenSSL 中的“heartbleed”漏洞。\n\n\
    ![](img/leanpub-info-circle.png)\n\n这 6 小时现在已经完全过时了。使用现代的模糊测试工具和更新的计算机，像 heartbleed\
    \ 这样的漏洞可以在几分钟内被发现。\n\n![](img/leanpub_key.png)\n\n模糊测试主要发现内存和安全漏洞。\n\n存在许多不同的模糊测试工具。为了本节内容，我将关注\
    \ [LLVM 的 libFuzzer](https://www.llvm.org/docs/LibFuzzer.html)。大多数模糊测试器都在相同的前提下运行。\n\
    \n你必须提供某种入口。入口的形式通常如下函数：\n\n```cpp\nextern \"C\" int LLVMFuzzerTestOneInput(const\
    \ uint8_t *Data,\n                                     size_t Size);\n```\n\n\
    图 8. `libFuzzer` 入口。`Data` 指针总是有效的，`Size` 参数 >= 0。\n\n如果你的库主要解析文件（例如 `libpng`），那么你的工作非常简单：\n\
    \n```cpp\nextern \"C\" int LLVMFuzzerTestOneInput(const uint8_t *Data,\n     \
    \                                size_t Size)\n{\n  parseInput(Data, Size);\n\
    }\n```\n\n图 9. `libFuzzer` 的数据使用。\n\n如果你的函数接收的是数据结构而非输入字符串，你的工作会复杂一些，但可行：\n\n\
    ```cpp\ntemplate<typename Type>\nstd::tuple<const uint8_t *, size_t, Type>\n \
    \   createStruct(const uint8_t *Data, size_t Size)\n{\n  // 仅允许简单类型 (trivial types)\
    \ 执行此操作\n  static_assert(std::is_trivial_v<Type>);\n  Type result{}; // 初始化\n\
    \  const auto bytesToRead = std::min(sizeof(Type), Size);\n  std::memcpy(&result,\
    \ Data, bytesToRead);\n  return {std::next(Data, bytesToRead), Size - bytesToRead,\
    \ result};\n}\n```\n*(注：上述代码基于提供的文本逻辑的表示）*\n"
- fmt: "\n*   [CppCon 2020: Barnabás Bágyi “Fuzzing Class Interfaces for Generating\
    \ and Running Tests with libFuzzer”](https://cppcon2020.sched.com/event/e7An/fuzzing-class-interfaces-for-generating-and-running-tests-with-libfuzzer?iframe=no)\
    \ - Inspirational talk about using fuzzing in novel ways. Video is not yet on\
    \ YouTube, but look for it after this book is published.\n*   [Autotest](https://gitlab.com/wilzegers/autotest/)\
    \ - Library associated with “Fuzzing Class Interfaces for Generating and Running\
    \ Tests with libFuzzer” talk.\n*   [FuzzTest](https://github.com/google/fuzztest)\
    \ - Fuzz testing library from google.\n*   [DeepState](https://github.com/trailofbits/deepstate)\
    \ - Fuzz testing tools from TrailOfBits\n*   [oss-fuzz](https://github.com/google/oss-fuzz)\
    \ - Continuous Fuzzing for Open Source Projects\n*   [Mutate++](https://github.com/nlohmann/mutate_cpp)\
    \ - Mutation testing tool\n\n# 23: Use the Tools: Build Generators\n\n*   [CMake](https://cmake.org)\n\
    *   [Meson](https://mesonbuild.com/)\n*   [Bazel](https://bazel.build/)\n*   [Others](https://github.com/lefticus/cppbestpractices/blob/master/02-Use_the_Tools_Available.md)\n\
    \nRaw make files or Visual Studio project files make each of the things listed\
    \ above too tricky to implement. Use a build tool to help you with maintaining\
    \ portability across platforms and compilers.\n\nTreat your build scripts like\
    \ any other code. They have their own best practices, and it’s just as easy to\
    \ write unmaintainable build scripts as it is to write unmaintainable C++.\n\n\
    Build generators also help abstract and simplify your continuous build environment\
    \ with tools like `cmake --build`, which does the correct thing regardless of\
    \ the platform in use.\n\n| ![](styles/resources/leanpub_pencil.png) |  \n\n##\
    \ Exercise: Investigate your build system.\n\n*   Does your project currently\
    \ use a build generator?\n*   How old are your build scripts?\n\nSee if there\
    \ are current best practices you need to apply. Are there tidy-like or formatting\
    \ tools you can run on your build scripts?\n\nRead back over the previous best\
    \ practices from this book and see how they apply to your build scripts.\n\n*\
    \   Are you repeating yourself?\n*   Are there higher-level abstractions available?\n\
    \n| ![](styles/resources/leanpub_info-circle.png) |  \n\nRecent versions of CMake\
    \ have added tools like `--profiling-output` to help you see where the generator\
    \ is spending its time.\n\n## 23.1: Resources\n\n*   [Professional CMake: A Practical\
    \ Guide](https://crascit.com/professional-cmake/)\n*   [cmake-tidy](https://github.com/MaciejPatro/cmake-tidy)\n\
    *   [C++Now 2017: Daniel Pfeiffer “Effective CMake”](https://youtu.be/bsXLMQ6WgIk)\n\
    *   [CppCon 2017: Mathieu Ropert “Using Modern CMake Patterns to Enforce a Good\
    \ Modular Design”](https://youtu.be/eC9-iRN2b04)\n*   [CppCon 2018: Jussi Pakkanen\
    \ “Compiling Multi-Million Line C++ Code Bases Effortlessly with the Meson Build\
    \ System”](https://youtu.be/SCZLnopmYBM)\n*   [BazelCon 2019](https://www.youtube.com/playlist?list=PLxNYxgaZ8Rsf-7g43Z8LyXct9ax6egdSj)\n\
    *   [CppCon 2019: Mathieu Ropert “Cato the Elder”](https://youtu.be/D07iF4Lp4kM)\
    \ - Short rant about build script quality\n*   [C++ Weekly Ep 218 - The Ultimate\
    \ CMake / C++ Quick Start](https://youtu.be/YbgH7yat-Jo)\n*   [Twitter Discussion\
    \ on CMake Resources](https://twitter.com/Cor3ntin/status/1310990444915032067)\n\
    \n# 24: Use the Tools: Package Managers\n\nRecent years have seen an explosion\
    \ of interest in package managers for C++. These two have become the most popular:\n\
    \n*   [Vcpkg](https://github.com/Microsoft/vcpkg)\n*   [Conan](https://conan.io/)\n\
    \nThere is a definite advantage to using a package manager. Package managers help\
    \ with portability and reducing maintenance load on developers.\n\n| ![](styles/resources/leanpub_info-circle.png)\
    \ |  \n\nI also want to draw your attention to [CPM](https://github.com/cpm-cmake/CPM.cmake).\n\
    \nCPM provides a simple and straightforward direct integration into CMake for\
    \ building and linking to `fetch_content`-able CMake projects.\n\n| ![](styles/resources/leanpub_pencil.png)\
    \ |  \n\n## Exercise: What are your dependencies?\n\nTake time to inventory your\
    \ project’s dependencies. Compare your dependencies with what is available with\
    \ the package managers above. Does any one package manager have all of your dependencies?\
    \ How out of date are your current packages? What security fixes are you currently\
    \ missing?\n\n# Part III: API and Code Design\n\n# 25: Make interfaces hard to\
    \ use.\n\nYour interface is your first line of defense. If you provide an interface\
    \ that is easy to use, your users will use it. If you provide an interface that\
    \ is hard to use, your users will misuse it.\n\n## 25.1: Resources\n\n*   [The\
    \ Little Manual of API Design](https://people.mpi.de/~blanche/api-design.pdf)\n\
    \n# 26: Consider Using API Wrong\n\nConsider the API for POSIX `socket:`\n\n```\n\
    1 socket(int, int, int);\n```\n\nFigure 13. POSIX socket API. The parameters (in\
    \ some order) represent:\n*   type\n*   protocol\n*   domain\n\nThis design is\
    \ problematic, but there are less obvious ones lurking in our code. Do you accept\
    \ raw pointers? Is there any guarantee that internal users will never misuse the\
    \ API?\n\n| ![](styles/resources/leanpub-circle.png) |  \n\nIs there any guarantee\
    \ that external user will never invoke the API?\n\n| ![](styles/resources/leanpub-circle.png)\
    \ |  \n\n## Exercise: Checked Types\n\nThe C++ Guideline Support Library (GSL)\
    \ has `not_null` pointer type that guarantees the pointer passed is never `nullptr`.\
    \ Would that work for APIs that currently pass raw pointers (assuming that rearchitecting\
    \ the API is not option)?\n\n`std::string_view` (C++17) and `std::span` (C++20)\
    \ are great alternatives to pointer / length pairs.\n\n## 26.1: Resources\n\n\
    *   [boost::safe_numerics](https://github.com/boostorg/safe_numerics)\n\n# 27:\
    \ Be Afraid of Global State\n\nReasoning about global state is hard. Any non-const\
    \ `static` value, or `shared_ptr` could be global state. It is never known who\
    \ might update the value or if it is thread-safe to do.\n\nGlobal state can result\
    \ in subtle and difficult to trace bugs where one function changes global state,\
    \ and another function relies on that change or is adversely affected by it.\n\
    \n| ![](styles/resources/leanpub_pencil.png) |  \n\n## Exercise: Global State,\
    \ What’s Left?\n\nIf you’ve done the other exercises, you’ve already made all\
    \ of your `static` variables `const.` This is great! You’ve possibly made some\
    \ of them `constexpr`, which is even better!\n\nBut you probably have global state\
    \ still lurking. Do you have a global singleton logger? Could the logger be accidentally\
    \ sharing state between the modules of your system? What about other singletons?\
    \ Can they be eliminated? Do they have threading initialization issues (what happens\
    \ if two threads try to access one of the objects for the first time)?\n\n## 27.1:\
    \ Resources\n\n*   [Retiring the Singleton Pattern - Peter Muldoon - Meeting C++\
    \ 2019](https://youtu.be/f46jmm7r8Yg)\n\n# 28: Use Stronger Types\n\nConsider\
    \ the API for `Rectangle`:\n\n```\n1 Rectangle(int, int, int, int);\n```\n\nPoorly\
    \ defined4.\n\nThis design is problematic, but there are less obvious ones lurking\
    \ in our code.\n\n```\n1 Rectangle(int, int, int, int);\n```\n\nFigure 14. Poorly\
    \ defined constructor.\n"
