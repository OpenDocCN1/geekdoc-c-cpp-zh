    \ |  \n\nI also want to draw your attention to [CPM](https://github.com/cpm-cmake/CPM.cmake).\n\
    \n |\n\nCPM provides a simple and straightforward direct integration into CMake\
    \ for building and linking to “`fetch_content`-able” CMake projects.\n\n| ![](styles/resources/leanpub_pencil.png)\
    \ |  \n\n## Exercise: What are your dependencies?\n\n |\n\nTake time to inventory\
    \ your project’s dependencies. Compare your dependencies with what is available\
    \ with the package managers above. Does any one package manager have all of your\
    \ dependencies? How out of date are your current packages? What security fixes\
    \ are you currently missing?\n\n# Part III: API and Code Design Guidelines\n\n\
    # 25: Make your interfaces hard to use wrong.\n\nYour interface is your first\
    \ line of defense. If you provide an interface that is easy to use wrong, your\
    \ users *will* use it wrong.\n\nIf you provide an interface that’s hard to use\
    \ wrong, your users have to work harder to use it wrong. But this is still C++;\
    \ they will always find a way.\n\nInterfaces hard to use wrong will sometimes\
    \ result in more verbose code where we would maybe like more terse code. You have\
    \ to choose what is most important. Correct code or short code?\n\nThis is a high-level\
    \ concept; specific ideas will follow.\n\n## 25.1: Resources\n\n*   [The Little\
    \ Manual of API Design](https://people.mpi-inf.mpg.de/~jblanche/api-design.pdf)\n\
    \n# 26: Consider If Using the API Wrong Invokes Undefined Behavior\n\nDo you accept\
    \ a raw pointer? Is it an optional parameter? What happens if `nullptr` is passed\
    \ to your function?\n\nWhat happens if a value out of the expected range is passed\
    \ to your function?\n\nSome developers make the distinction between “internal”\
    \ and “external” APIs. They allow unsafe APIs for internal use only.\n\n| ![](styles/resources/leanpub_question-circle.png)\
    \ |  \n\nIs there any guarantee that an external user will never invoke the “internal”\
    \ API?\n\n |\n\n| ![](styles/resources/leanpub_question-circle.png) |  \n\nIs\
    \ there any guarantee that your internal users will never misuse the API?\n\n\
    \ |\n\n| ![](styles/resources/leanpub_pencil.png) |  \n\n## Exercise: Investigate\
    \ Checked Types\n\n |\n\nThe C++ Guideline Support Library (GSL) has a `not_null`\
    \ pointer type that guarantees, because of zero cost abstractions, that the pointer\
    \ passed is never `nullptr.` Would that work for your APIs that currently pass\
    \ raw pointers (assuming that rearchitecting the API is not an option)?\n\n`std::string_view`\
    \ (C++17) and `std::span` (C++20) are great alternatives to pointer / length pairs\
    \ passed to functions.\n\n## 26.1: Resources\n\n*   [boost::safe_numerics](https://github.com/boostorg/safe_numerics)\n\
    \n# 27: Be Afraid of Global State\n\nReasoning about global state is hard.\n\n\
    Any non-`const` `static` value, or `std::shared_ptr<>` could potentially be global\
    \ state. It is never known who might update the value or if it is thread-safe\
    \ to do so.\n\nGlobal state can result in subtle and difficult to trace bugs where\
    \ one function changes global state, and another function either relies on that\
    \ change or is adversely affected by it.\n\n| ![](styles/resources/leanpub_pencil.png)\
    \ |  \n\n## Exercise: Global State, What’s Left?\n\n |\n\nIf you’ve done the other\
    \ exercises, you’ve already made all of your `static` variables `const.` This\
    \ is great! You’ve possibly even made some of them `constexpr,` which is even\
    \ better!\n\nBut you probably have global state still lurking. Do you have a global\
    \ singleton logger? Could the logger be accidentally sharing state between the\
    \ modules of your system?\n\nWhat about other singletons? Can they be eliminated?\
    \ Do they have threading initialization issues (what happens if two threads try\
    \ to access one of the objects for the first time at the same time)?\n\n## 27.1:\
    \ Resources\n\n*   [Retiring the Singleton Pattern - Peter Muldoon - Meeting C++\
    \ 2019](https://youtu.be/f46jmm7r8Yg)\n\n# 28: Use Stronger Types\n\nConsider\
    \ the API for POSIX `socket:`\n\n```\n1 socket(int, int, int);\n```\n\nFigure\
    \ 13\\. POSIX socket API.\n\nThe parameters (in some order) represent:\n\n*  \
    \ type\n\n*   protocol\n\n*   domain\n\nThis design is problematic, but there\
    \ are less obvious ones lurking in our code.\n\n```\n1 Rectangle(int, int, int,\
    \ int);\n```\n\nFigure 14\\. Poorly defined constructor."
