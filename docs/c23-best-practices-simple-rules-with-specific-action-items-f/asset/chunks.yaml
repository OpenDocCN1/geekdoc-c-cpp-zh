  trans: "\n```cpp\nimport std;\n\nint main(const int argc, const char *[]) {\n  using\
    \ std::literals::string_literals;\n  using std::literals::string_view_literals;\n\
    \n  // 目前标准库提供的 `s` 字面量\n  // 不是 `consteval`。它应该是这样的吗？\n  const auto my_string\n\
    \    = \"Hello World\"s; // 创建了一个字符串\n\n  // 目前标准库提供的 `sv` 字面量\n  // 不是 `consteval`。它应该是这样的吗？\n\
    \  const auto my_string_view\n    = \"Hello World\"sv; // 创建了一个 string_view\n\
    }\n```\n\nFigure 48. `consteval` udl\n\n| ![](img/image) |  \n\n## 练习：如果函数*必须*在编译时调用意味着什么？\n\
    \n```cpp\nconsteval int get_value(const int input) {\n  return input * 42;\n}\n\
    \nint main(const int argc, const char *[]) {\n  // 这段代码能编译吗？\n  const auto value\
    \ = get_value(argc);\n}\n```\n\nFigure 49. `consteval` 练习\n\n## 37.1：资源\n\n* \
    \  [Andreas Fertig 的博客：“consteval 的一个小妙用”](https://andreasfertig.blog/2021/07/cpp20-a-neat-trick-with-consteval/)\n\
    *   [C++ Weekly 第 304 期：“C++23 的 `if consteval` 对比 C++20 的 `is_constant_evaluated`\
    \ 对比 C++17 的 `if constexpr`”](https://youtu.be/AtdlMB_n2pI)\n*   [C++ Weekly 第\
    \ 308 期：“`if consteval` - 还有更多故事”](https://youtu.be/y3r9l3LZi)\n\n# 38：优先使用飞船运算符\
    \ (Spaceships)\n\nC++20 可以为你生成任何比较运算符（因其形状，口俗被称为“飞船运算符”）。\n\n*   如果你定义了 `==`，编译器会自动生成\
    \ `!=`\n*   如果你定义了 `<=>`，编译器将生成所有其他比较（`==` 和 `!=` 除外）\n*   你可以显式地对任何比较操作使用默认\n\
    \n```cpp\nstruct MyData {\n  int i;\n  int j;\n\n  // 提供所有比较运算符\n  friend auto\
    \ operator<=>(const MyData &, const MyData &) = default;\n};\n```\n\nFigure 50.\
    \ 基础飞船运算符示例\n\nC++ 标准已经开始弃用显式的比较操作，请参考标准中的示例。\n\n注意，为了性能考虑，`std::string` 实现了自定义的\
    \ `operator==`（提供 `==` 和 `!=`）和 `operator<=>`（提供剩余）。\n\nhttps://en.cppreference.com/w/cpp/string/basic_string/operator_cmp\n\
    \n| ![](img/image) |  \n\n如果你为你的类型提供了自定义的 `operator<=>`，编译器将不会为你提供 `operator==`\
    \ 或 `operator!=`！这类似于针对特殊成员函数的“零之规则”和“五之规则”。\n\n*   如果你提供了自定义的 `operator<=>`，你必须提供自己的\
    \ `operator==`\n*   如果你需要自定义的 `operator<=>`，那么显式默认的 `operator==` 可能无法完成正确的工作\n\
    \n| ![](img/image) |  \n\n## 练习：实现飞船运算符\n\n```cpp\nimport std;\n\nstruct Container\
    \ {\n  // 固定容量的容器\n  std::array<int, 10> data;\n\n  // size 是当前使用的元素数量\n  std::size_t\
    \ size;\n\n  // 比较运算符应该什么样子的？\n  // 默认的有效吗？\n  // 我们需要自定义的 operator== 吗？\n};\n\
    ```\n\nFigure 51. 飞船运算符练习\n\n## 38.1：资源\n\n*   [cppreference.com 文档](https://en.cppreference.com/w/cpp/language/default_comparisons)\n\
    \n# 39：遵循零之规则 (Rule of 0)\n\n在正确的情况下，没有析构函数总是更好的。空析构函数会破坏性能：\n\n*   它们使类型不再是平凡的\
    \ (trivial)\n*   没有功能性用途\n*   可能会影响析构的联\n*   隐式禁用移动操作\n\n| ![](img/image) |  \n\
    \n如果你因为进行资源管理或定义带有虚函数的基类而需要析构函数，那么你需要遵循五之规则。\n\n如果你提供了自定义的删除器，`std::unique_ptr`\
    \ 可以帮助你应用零之规则。\n\n| ![](img/image) |  \n\n## 练习：在你的代码中寻找违反零之规则的行为\n\n寻找类似这样的代码（我保证你能找到）：\n\
    \n```cpp\nstruct S {\n  // 一堆\n  ~S();\n};\n```\n\nFigure 52. 空析构函数。\n\n```cpp\n\
    struct S {\n  ~S();\n};\n```\n\nFigure 53. 空析构函数。\n\n| ![](img/image) |  \n\n\
    存在析构函数吗？如果有，请删除它们。\n\n| ![](img/image) |  \n\n## 练习：使用零之规则\n\n```cpp\nstruct S\
    \ {\n  // 一些\n  ~S();\n};\n```\n\nFigure 54. 零之规则\n\n```cpp\nstruct S {\n  //\
    \ 没有影响\n  ~S() = default;\n};\n\nvoid some_func(std::vector<S>);\n```\n"
- fmt: "\n## Exercise: Look for Rule of 5 violations in your code\n\nYou are likely\
    \ not providing consistent lifetime semantics in your existing code when you are\
    \ defining the special member functions. To assess the impact, you can quickly\
    \ ``= delete;` any missing special member functions and see what breaks.\n\n##\
    \ 40.1: Resources\n\n* [C++ Reference: The rule of three/five/zero](https://en.cppreference.com/w/cpp/language/rule_of_three)\n\
    \n# Part IV: Code Implementation Guidelines\n\n## 41: Don’t Copy and Paste Code\n\
    \nIf you find yourself going to select a block of code and copy it: stop!\n\n\
    Take a step back and look at the code again.\n\n* Why are you copying it?\n* How\
    \ similar will the source be to the destination?\n* Does it make sense to make\
    \ a function?\n* Remember, [Don’t Be Afraid of Templates](#all_chapter_contents.xhtml_dont-be-afraid-of-templates)\n\
    \nI have found that this simple rule has had the most direct influence on my code\
    \ quality.\n\nIf the result of the paste operation was going in the current function,\
    \ consider using a lambda.\n\nC++14 style lambdas, with generic (aka `auto`) parameters,\
    \ give you a simple and easy to use method of creating reusable code that can\
    \ be shared with different data types while not having to deal with `template`\
    \ syntax.\n\n## Exercise: Try CPD.\n\nThere are a few different copy-paste-detectors\
    \ that look for duplicated code in your codebase.\n\nFor this exercise, download\
    \ the [PMD CPD tool](https://pmd.github.io/latest/pmd_userdocs_cpd.html) and run\
    \ it on your codebase.\n\nIf you use Arch Linux, this tool can be installed with\
    \ AUR. The package is `pmd`; the tool is `pmd-cpd`.\n\nCan you identify critical\
    \ parts of your code that have been copied and pasted? What happens if you find\
    \ a bug in one version? Will you be sure to see all of the locations that also\
    \ need to be updated?\n\n## 41.1: Resources\n\n* [Copy-Paste Programming](https://www.viva64.com/en/t/0068/)\n\
    * [The Last Line Effect](https://www.viva64.com/en/b/0260/)\n* [i will not copy-paste\
    \ code](https://twitter.com/bjorn_fahller/status/1072432257799987200)\n\n## 42:\
    \ Prefer `format` Over `iostream` Or c-formatting Functions\n\nC++20 added the\
    \ `<format>` header, which provides the function `std::format.`.\n\n`std::format`\
    \ takes a format string, parameters, and returns an `std::string` object.\n\n\
    `format` is:\n\n* faster to compile than iostreams\n* faster to execute than iostreams\n\
    * more readable than iostreams\n* more type safe than `printf` family of functions\n\
    \n```cpp\n1 import std;\n2 \n3 int main()\n4 {\n5   const auto result = std::format(\"\
    Hello {}!\", \"Jason\");\n6 }\n```\nFigure 57. Simple format usage\n\nUnfortunately,\
    \ C++20’s use cases were little limited, with formatting to strings being the\
    \ main mechanism, we tend end up with code that looks like this:\n\n```cpp\n1\
    \ // using include because this is C++20\n2 #include <format>\n3 \n4 int main()\n\
    5 {\n6   std::cout << std::format(\"Hello {}!\\n\", \"Jason\");\n7 }\n```\nFigure\
    \ 58. Format usage\n\nTo solve this problem, C++23 added the `<print>` header,\
    \ which we can use via modules.\n\n```cpp\n1 import std;\n2 \n3 int main()\n4\
    \ {\n5   std::println(\"Hello {}!\", \"Jason\");\n6 }\n```\nFigure 59. Using `std::println`\n\
    \nThere are several overloads for `std::print` and the helper `std::println` which\
    \ automatically adds newline to the end of the message.\n\nThis example is overly\
    \ complicated!\n\n```cpp\n1 import std;\n2 \n3 int main()\n4 {\n5   std::print(std::cout,\
    \ \"Hello\");\n6   std::println(stdout, \" World\");\n7 }\n```\nFigure 60. Using\
    \ `std::print`s overloads\n\n## Exercise: Learn the syntax for `std::print` and\
    \ begin converting `std::cout` to `print`.\n\n## Exercise: Use `clang-tidy`’s\
    \ `modernize-use-print` to upgrade any `printf` family functions you have.\n\n\
    ## Exercise: See if your AI assistant can convert `std::iostream` usage into `std::format`\
    \ and `std::print` (ChatGPT is known to be reasonably good).\n\n## 43: `constexpr`\
    \ All The Things!\n\nI’m using a much stronger argument for `constexpr` than I\
    \ ever before!\n\nC++23 and modules together eliminate almost every reason to\
    \ not be `constexpr`.\n\n`constexpr` functions declared in your module interface\
    \ should now be your default.\n\n* With modules it is truly “pay for what you\
    \ use” (almost 0 cost to the consumer of the module)\n* `constexpr` enables use\
    \ cases you have not considered for compile-time computation\n* A powerful technique\
    \ is to compute as much as possible at compile-time, then continue computation\
    \ at runtime from a known point\n* These techniques are only possible if our core\
    \ libraries are `constexpr` enabled.\n\nGone are the days of `#define`. `constexpr`\
    \ should be your new default! Unfortunately, people over-complicate `constexpr`,\
    \ so let’s break down the simplest thing.\n\nYou need C++26 to get `constexpr`\
    \ trig functions from your standard library.\n\nIf you see something like (I’ve\
    \ seen in real code):\n\n```cpp\n1 static const std::vector<int> angles{-90,-45,0,45,90};\n\
    ```\nFigure 61. `static const` data known at compile time.\n\nThis really needs\
    \ to be:\n\n```cpp\n1 static constexpr std::array angles{-90,-45,0,45,90};\n```\n\
    Figure 62. Moving `static const` to `static constexpr`.\n\n`static constexpr`\
    \ here is necessary to make sure the object is not reinitialized each time the\
    \ function / declaration is encountered. With `static` the variable lasts for\
    \ the lifetime of the program, and we know it will be initialized exactly once.\n\
    \nThe difference is threefold:\n\n* The size of the array is now known at compile\
    \ time\n* We’ve removed dynamic allocations\n* We no longer pay the cost of accessing\
    \ a static\n\nFor globals in header files, prefer `inline constexpr` over `static\
    \ constexpr` so that the linker merges data structures and reduces code bloat.\n\
    \nThe main gains come from the first two, but we need a `constexpr` mindset to\
    \ be looking for this kind of opportunity. We also need `constexpr` knowledge\
    \ to see how to apply it in the more complex cases. [The difference can be significant.](#\n\
    \nThere might be times where a non-static `constexpr` local variable is the most\
    \ efficient option, because the data lives on the stack instead of a different\
    \ section of the binary. Check if this matters during your optimization passes.\n\
    \nTechnically non-static `constexpr` variables don’t have to be calculated at\
    \ compile-time. However, it’s almost certain that they are, and it is handy to\
    \ think of them as calculated at compile-time.\n\n## Exercise: `constexpr` Your\
    \ `const` Values\n\nWhile reading code, look at all `const` values. Ask, “is this\
    \ value known at compile time?” If it is, what would it take to make the value\
    \ `constexpr?`\n\n## Exercise: `static constexpr` Your `static const` Values\n\
    \nGo through your current code base and look for code that is currently `static\
    \ const.` You probably have something, somewhere.\n\n* If it’s currently `static\
    \ const,` it’s likely the size and data are known at compile time.\n* Can this\
    \ code become `constexpr?`\n* What is preventing it from being `constexpr?`\n"
