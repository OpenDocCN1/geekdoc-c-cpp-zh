    8   return get_value(value + 42);\n9 }\n```\n\nFigure 67\\. Prefer not naming\
    \ temporaries\n\n| ![](styles/resources/leanpub_info-circle.png) |  \n\nThe clang-tidy\
    \ [No Automatic Move](https://clang.llvm.org/extra//clang-tidy/checks/performance-no-automatic-move.html)\
    \ analysis is largely broken. It warns even when NRVO copy elision applies, and\
    \ doesn’t warn when it matters! (as of 2022-02-23). See this analysis: [https://compiler-explorer.com/z/a4K76nbhq](https://compiler-explorer.com/z/a4K76nbhq).\n\
    \n |\n\n| ![](styles/resources/leanpub_warning.png) |  \n\nYou probably don’t\
    \ want to make `class` members `const;` it can break essential things such as\
    \ move construction and move assignment, and sometimes silently.\n\n |\n\n## 45.1:\
    \ Resources\n\n*   [CppCon 2014: James McNellis & Kate Gregory “Modernizing Legacy\
    \ C++ Code”](https://youtu.be/LDxAgMe6D18)\n\n*   [CppCon 2019: Jason Turner “C++\
    \ Code Smells”](https://youtu.be/f_tLQl0wLUM)\n\n*   [The implication of const\
    \ or reference member variables in C++](https://lesleylai.info/en/const-and-reference-member-variables/)\n\
    \n*   [C++Now 2018: Ben Deane “Easy to Use, Hard to Misuse: Declarative Style\
    \ in C++”](https://youtu.be/2ouxETt75R4) (Builds on techniques that make applying\
    \ `const` easier.)\n\n# 46: Always Initialize Your non-`const,` non-`auto` Values\n\
    \nThe ideal is to `const` everything, which forces you to initialize. However,\
    \ that’s not always possible.\n\nSimilarly, if you use `auto,` you are forced\
    \ to initialize an object.\n\n*   The compiler will “throw away” operations on\
    \ uninitialized values\n\n*   Make sure you have your `-Wunitialized` style warnings\
    \ enabled\n\n| ![](styles/resources/leanpub_info-circle.png) |  \n\nBe aware that\
    \ there can be a difference between default initialization and initialization\
    \ that appears empty in some cases.\n\n |\n\nCompilers are not always perfect\
    \ at catching uninitialized value usage. For example, GCC (as of 2023-12-30) requires\
    \ optimizations enabled to catch this uninitialized variable access, which is\
    \ UB.\n\n```\n 1 #include <span>\n 2 \n 3 float sum(std::span<float> values)\n\
    \ 4 {\n 5   float result;\n 6 \n 7   for (const auto f : values) {\n 8     result\
    \ += f;\n 9   }\n10 \n11   return result;\n12 }\n```\n\nFigure 68\\. Uninitialized\
    \ variable read that GCC doesn't catch without optimizations enabled\n\n| ![](styles/resources/leanpub_pencil.png)\
    \ |  \n\n## Exercise: Understand which constructor you are calling\n\n |\n\nTake\
    \ this example code and play with it at various optimization levels in compiler-explorer.com\
    \ to understand the difference that each constructor call might perform."
