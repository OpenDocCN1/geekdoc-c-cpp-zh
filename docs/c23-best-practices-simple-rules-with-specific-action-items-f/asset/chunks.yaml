    \ Reviewers of C++17/20 Edition\n\nCraig Scott and Alexander Roper, thank you\
    \ for extensive notes and feedback during prerelease.\n\n# 65: Bonus: Understand\
    \ The Lambda\n\nA surprising complexity hides behind the simple lambda of C++.\
    \ Initially added in C++11, it was initially constrained. With each version of\
    \ C++, the lambda becomes more flexible and powerful.\n\nLambdas reverse some\
    \ of the defaults from the rest of C++. Default `const` and automatically `constexpr`\
    \ when possible; they give us some of what we wish the rest of the language could\
    \ have.\n\n```\n 1 lambda-expression:\n 2   lambda-introducer lambda-declarator(opt)\
    \ compound-statement\n 3   lambda-introducer < template-parameter-list > requires-clause(opt)\n\
    \ 4        lambda-declarator(opt) compound-statement\n 5 lambda-introducer:\n\
    \ 6   [ lambda-capture(opt) ]\n 7 lambda-declarator:\n 8   ( parameter-declaration-clause\
    \ ) decl-specifier-seq(opt)\n 9        noexcept-specifier(opt) attribute-specifier-seq(opt)\n\
    10        trailing-return-type(opt) requires-clause(opt)\n```\n\nFigure 130\\\
    . Lambda grammar.\n\nIf you can [read standard-eze](http://eel.is/c++draft/expr.prim.lambda),\
    \ you can dig into all of the features of C++20’s lambdas yourself.\n\n```\n 1\
    \ // valid empty lambda, does nothing\n 2 []{}; \n 3 // optional to have parameter\
    \ list\n 4 [](){};\n 5 // C++17 explicit constexpr and void return\n 6 []() constexpr\
    \ -> void {}; \n 7 // immediately invoked lambda\n 8 auto i = [](){ return 42;\
    \ }();\n 9 // Not allowed before C++17, because constexpr\n10 constexpr auto j\
    \ = []{ return 42; }();\n11 // generic lambda, C++14\n12 [](auto x){ return x\
    \ + 42; };\n13 // variadic lambda, C++14\n14 [](auto ... x){ return std::vector<int>(x...);\
    \ };\n15 // capture by copy, C++11\n16 [i](){ return i + 42; }; \n17 // generalized\
    \ capture, C++14 (what's the type of i?)\n18 [i = 42]{ return i + 42; };\n19 //\
    \ stateful lambda, C++11\n20 [i]() mutable { return ++i; };\n21 // explicit template,\
    \ C++20\n22 []<typename T>(T x){ return x + 42; };\n23 \n24 // C++14 generic lambda\
    \ returning a C++20 lambda with variadic\n25 // capture expression which returns\
    \ a fold expression summation\n26 // of the captured values.\n27 [](auto ... val){\
    \ return [...val = val]{ return (val + ...); }; };\n```"
