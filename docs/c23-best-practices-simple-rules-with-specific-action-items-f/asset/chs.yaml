  \ }\n```\n\n图 123. C++23 的 `bind_back`\n\n## 59.1: 资源\n\n* [CppCon 2015: Stephan\
  \ T. Lavavej “：新特性与正确用法”](https://youtu.be/zt7ThwVfap0)\n* [C++ Weekly Ep 16: “避免\
  \ `std::bind`”](https://youtu.be/ZlHi8txU4aQ)\n\n# 60: 不要对非平凡类型使用 `initializer_list`\n\
  \n“初始化列表（Initializer List）”是 C++ 中的一个重载术语。“初始化列表（Initializer Lists）”用于直接初始化值。`initializer_list`\
  \ 用于将一个值列表传递给函数或构造函数。\n\n| ![](img/leanpub_pencil.png) |  \n\n## 练习：理解 `initializer_list`\
  \ 可能会带来的开销\n\n|使用 Andreas Fertig 开发出的非常棒 [cppinsights.io](http://cppinsights.io)\
  \ 来理解这两个示例的作用\n\n```cpp\n#include <vector>\n#include <memory>\n\nstd::vector<std::shared_ptr<int>>\
  \ vec{\n   std::make_shared<int>(40), std::make_shared<int>(2)\n };\n```\n\n图 124.\
  \ 使用 `shared_ptr` 的 `initializer_list` 构造函数。\n\n```cpp\n#include <array>\n#include\
  \ <memory>\n\n std::array<std::shared_ptr<int>, 2> data{\n   std::make_shared<int>(40),\
  \ std::make_shared<int>(2)\n };\n```\n\n图 125. 使用 `shared_ptr` 的 `std::array` 构建。\n\
  \n并解释它们的区别。如果你能做到，说明你比大多数 C++ 开发者都懂得多。\n\n| ![](img/leanpub_pencil.png) |  \n\n\
