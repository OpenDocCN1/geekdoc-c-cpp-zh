  \n## 42：优先使用 `format` 而非 `iostream` 或 C 格式化函数\n\nC++20 添加了 `<format>` 头文件，提供了 `std::format`\
  \ 函数。\n\n`std::format` 接收字符串、参数并返回一个 `std::string` 对象。\n\n`format` 的优点是：\n\n* 编译比\
  \ iostreams 快\n* 执行比 iostreams 快\n* 比 iostreams 更具可读性\n* 比 `printf` 系列函数更类型安全\n\n\
  ```cpp\n1 import std;\n2 \n3 int main()\n4 {\n5   const auto result = std::format(\"\
  Hello {}!\", \"Jason\");\n6 }\n```\n图 57 简单的 format 使用\n\n遗憾的是，C++20 的用例非常有限，以格式化为字符串为主机制，我们往往会写出这样的代码：\n\
  \n```cpp\n1 // 使用 include 是因为这是 C++20\n2 #include <format>\n3 \n4 int main()\n5\
  \ {\n6   std::cout << std::format(\"Hello {}!\\n\", \"Jason\");\n7 }\n```\n图 58\
  \ format 使用\n\n为了解决这个问题，C++23 添加了 `<print>` 头文件，我们可以通过模块使用它。\n\n```cpp\n1 import\
  \ std;\n2 \n3 int main()\n4 {\n5   std::println(\"Hello {}!\", \"Jason\");\n6 }\n\
  ```\n图 59 使用 `std::println`\n\n`std::print` 有多个重载版本，辅助函数 `std::println` 会在消息末尾自动添加换行符。\n\
  \n这个例子过于复杂了！\n\n```cpp\n1 import std;\n2 \n3 int main()\n4 {\n5   std::print(std::cout,\
  \ \"Hello\");\n6   std::println(stdout, \" World\");\n7 }\n```\n图 60 使用 `std::print`\
  \ 的重载\n\n## 练习：学习 `std::print` 的语法并开始将 `std::cout` 转换为 `print`。\n\n## 练习：使用 `clang-tidy`\
