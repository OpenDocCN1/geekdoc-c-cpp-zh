  \n## 练习：检查类型\n\nC++ 指南支持库 (GSL) 有 `not_null` 指针类型，可以保证传递的指针永远为 `nullptr`。对于目前传递原始指针的\
  \ API，这种方法可行吗？\n\n`std::string_view` (C++17) 和 `std::span` (C++20) 是指针/长度对的极佳替代方案。\n\
  \n## 26.1: 资源\n\n*   [boost::safe_numerics](https://github.com/boostorg/safe_numerics)\n\
  \n# 27: 害怕全局状态\n\n推理全局状态很困难。任何非 `const` 的 `static` 值或 `shared_ptr` 都可能是全局状态。永远不知道谁会更新该值，以及这样做是否线程安全。\n\
  \n全局状态会导致微妙且难以追踪的错误：一个函数更改了全局状态，而另一个函数依赖该更改或受到其影响。\n\n| ![](img/leanpub_pencil.png)\
  \ |  \n\n## 练习：全局状态，剩下什么？\n\n如果你完成了之前的练习，你已经将所有的 `static` 变量变成了 `const`。这很好！你可能还将其中一些变为\
  \ `constexpr`，那更好！\n\n但你可能仍有全局状态潜伏。你有一个全局单例日志记录吗？日志是否会在系统的模块之间意外共享状态？其他单例呢？可以消除吗？它们是否存在线程初始化问题（如果两个线程尝试首次访问其中一个对象会发生什么）？\n\
  \n## 27.1: 资源\n\n*   [Retiring the Singleton Pattern - Peter Muldoon - Meeting C++\
  \ 2019](https://youtu.be/f46jmm7r8Yg)\n\n# 28: 使用更强的类型\n\n考虑 `Rectangle` 的 API：\n\
  \n```\n1 Rectangle(int, int, int, int);\n```\n\n定义不当。\n\n这种设计是有问题的，但我们的代码中潜伏着不那么明显的问题。\n\
  \n```\n1 Rectangle(int, int, int, int);\n```\n\n图 14. 定义不当的构造函数。\n\n\n\n\n该函数的参数可能是\
  \ `(x, y, width, height)`，也可能是 `(x1, y1, x2, y2)`。另一种较小但仍可能的可能是是 `(width, height,\
  \ x, y)`。\n\n你对像 true 这样的 API 怎么看？\n\n```\n1 Rectangle(Position, Size);\n```\n\n\
  图 15. 强类型构造函数。\n\n在许多情况下，只需花一点精力就能编写出更强类型的 API。\n\n```\n 1 struct Position {\n2\
  \   int x;\n3   int y;\n4 };\n5 \n6 struct Size {\n7   int width;\n8   int height;\n\
  9 };\n10 \n11 struct Rectangle {\n12   Position position;\n13   Size size;\n14 };\n\
  ```\n\n图 16. 更强类型的类型定义。\n\n这可以导致其他在逻辑上可组合的语句，并带有运算符重载，例如：\n\n```\n1 // 返回一个通过传入的偏移量\n\
  2 // 移动的新矩形\n3 Rectangle operator+(Rectangle, Position);\n```\n\n图 17. 耦合类型的运算符重载。\n\
  \n| ![](img/leanpub_info-circle.png) |  \n\n在某些情况下，使用结构体可能会提高性能 [C++ Weekly Ep 119,\
  \ Negative Cost Structs](https://youtu.be/FwsO12x8nyM)。 |\n\n## 28.1: 避免布尔参数\n\n\
  本章的预发布读者指出，Steve Maguire 在他的书籍《Writing Solid Code》的第 5 章中提到：“在调用处使代码易于读懂。避免使用布尔参数。”\n\
  \n在 C++11 中，`enum class` 为你提供了一种简单的方法来增加强类型、避免布尔参数并让你的 API 更难被误用。\n\n考虑：\n\n```\n\
  1 struct Widget {\n2   // 这个构造函数很容易用错，我们\n3   // 很容易交换参数\n4   Widget(bool visible,\
  \ bool resizable);\n5 }\n```\n\n图 18. 不直观的参数顺序。\n\n相比之下：\n\n```\n1 struct Widget\
  \ {\n2   enum struct Visible { True, False };\n3   enum struct Resizable { True,\
  \ False };\n4 \n5   // 仍然可能用错，但困难得多\n6   Widget(Visible visible, Resizable resizable);\n\
  7 }\n```\n\n图 19. 使用作用域枚举的强类型。\n\n| ![](img/leanpub_pencil.png) |  \n\n## 识别你现有代码中存在问题的\
