- "# C++23 最佳实践：提升 C++ 的简单规则与具体行动项\n\n\n\n\n\n\n本书可在 `http://leanpub.com/cpp23_best_practices`\
  \ 购买。此版本出版于 2024-01-01。\n\n![出版商标志](https://leanpub.com/)\n\n这是一本 `Leanpub` 书。`Leanpub`\
  \ 通过精益出版（Lean Publishing）流程为作者和出版商赋能。精益出版是指使用轻量级工具和多次迭代来发布正在进行中的电子书，并不断获取反馈，直到拥有正确的书籍。\n\
  \n©2024 Jason Turner 献给我的妻子 Jen。\n\n## 指南\n\n1. 封面\n\n# 第一部分：优秀 C++ 的介绍与哲学\n\n##\
  \ C23 版本简介\n\n距离我最初发布第一版《最佳实践》已经过去大约 3 年了。在发布时，这本书的内容并不多。我选择向任何购买了 `Leanpub` 电子书的用户免费提供\
  \ `C++20` 更新（即“第二版”）。\n\n我曾考虑过将 `C++23` 更新作为免费的“第三版”发布。然而，当我考虑到需要进行的更新时，我决定是时候对这本书进行完全全新的发布了。之所以需要这本书，主要是因为\
  \ `C23` 改变了我们使用语言的许多基础方式（例如标准库模块）。与之前版本的区别也允许我重新组织主题以获得更好的流程。在之前的任何更新中，我都避免了重新组织（以便同事引用相关内容并避免混淆）。\n\
  \n我已经更新了书中所有的相关章节，以展示代码在 `C23` 中应有的样子，并重新组织了许多主题。放心，这是对原《最佳实践》的一次重大更新！\n\n## 原版简介\n\
  \n作为一名培训师和承包商，我的目标是让自己不再需要。我希望每个人都能：\n\n1. 学会如何进行实验。\n2. 不要仅仅相信我，而是去进行测试。\n3. 学习语言是如何运作的。\n\
  4. 不要再犯上一代人同样的错误。\n\n我正在考虑将我的头衔从“C++ 培训师”改为“C++ 指南”。我总是根据目前的课程来调整我的课程和材料。我们可能对一门关于\
  \ `X` 的课程达成一致，但在第一天途中我会将其改为 `Y` 以满足组织的需求。\n\n在此过程中，我们作为一个小组进行实验和学习。我经常在教学中学习。每个小组都是独特的；每个班都有新问题。我在课程中收到的很多问题都是重复的，以至于我看起来像个读心者，因为我能预判下一个被提出的问题。\n\
  \n因此，有了这本书，以及它所源的 Twitter 推文，以帮助传播长期以来的最佳实践。\n\n# 关于最佳实践\n\n简单来说，最佳实践关乎于：\n\n1.\
  \ 减少常见错误\n2. 快速发现错误\n3. 在不牺牲（且通常会提升）性能的情况下\n\n## 为什么要用最佳实践？\n\n### 你的项目并不特殊\n\n\
  如果你在用 `C++` 编程，那么你或你公司的某人就很在乎性能。否则，他们可能会使用其他编程语言。我去过很多公司，他们都告诉我他们很特殊，因为他们需要运行得飞快！\n\
  \n剧透一下：他们都在出于相同的原因做出相同的决定。极少数例外。那些做出不同决定的离群者，是那些已经在遵循书中建议的组织。\n\n## 最坏会发生什么？\n\n\
  我不想让气氛太沉闷，但让我们花时间思考一下，如果你的项目存在致命缺陷，最坏的情况会怎样。\n\n### 游戏\n严重的缺陷会导致远程安全漏洞或攻击向量。\n\n\
  ### 金融\n严重的缺陷会导致[巨额资金损失、交易加速、市场崩溃](https://en.wikipedia.org/wiki/2010_flash_crash)。\n\
  \n### 航空航天\n严重的缺陷会导致航天器丢失或[人类生命损失](https://spectrum.ieee.org/aerospace/aviation/how-the-boeing-737-max-disaster-looks-to-a-software-developer)。\n\
  \n### 你的行业\n严重的缺陷会导致……金钱损失？丢工作？远程黑客攻击？\n\n## 示例\n\n我不想让气氛太沉闷，但让我们花时间思考一下，如果你的项目存在致命缺陷，最坏的情况会怎样。\n\
