  # 54: 优选作用域枚举\n\nC++11 引入了作用域枚举，旨在解决从 C 继承的 `enum` 的许多问题。\n\n```cpp\n 1 enum Choices\
  \ {\n 2   option1 // 在全局作用域\n 3 };\n 4 \n 5 enum OtherChoices {\n 6   option2\n\
  \ 7 };\n 8 \n 9 int main() {\n10   int val = option1; //\n12 }\n```\n图 107. C98\
  \ 的 `enum`\n\n* `enum Choices;`\n* `enum OtherChoices;`\n\n这两个很容易混淆，因为它们位于全局命名空间。\n\
  \n* `enum Choices;`\n* `enum OtherChoices;`\n\n作用域枚举的值是有作用域的且强类型的。\n\n```cpp\n 1\
  \ enum class Choices {\n 2   option1\n 3 };\n 4 \n 5 enum class OtherChoices {\n\
  \ 6   option2\n 7 };\n 8 \n 9 int main() {\n10   int val = Choices::option1;\n11\
  \   int val2 = OtherChoices::option2;\n12 }\n```\n图 108. C++11 的作用域。\n\n枚举的标识符现在是有作用域的。\n\
  \n## 练习：`enum` 或 `class`\n\n决定使用 `enum` 还是 `class`，迁移到作用域枚举可能会发现 bug！\n\n## 54.1:\
  \ 资源\n\n* [CppCon 2018: Victor Ciura “Better Tools”](https://youtu.be/4X_0)\n* [Enumeration](https://en.cppreference.com/w/enum)\n\
  \n# 55: 优选 `if constexpr` 比 SFINAE\n\nSFINAE 意味着如果函数编译失败，它将从重载解析中移除。\n\n如果我们要在除法上添加不同的行为，在\
  \ C++17 之前，我们会使用 SFINAE：\n\n```cpp\n 1 #include <stdexcept>\n 2 #include <type_traits>\n\
  \ 3 #include <utility>\n 4 \n 5 template <typename Numerator, typename Denominator>\n\
  \ 6           std::enable_if_t<std::is_integral_v<Numerator> &&\n 7            \
  \                std::is_integral_v<Denominator>,\n 8                          \
  \  int = 0>\n 9 auto divide(Numerator, Denominator) {\n10   // 整数除法\n11   if (denominator\
  \ == 0) {\n12     throw std::runtime_error(\"divide by 0!\");\n13   }\n14   return\
  \ numerator / denominator;\n15 }\n16 \n17 template <typename Numerator, typename\
  \ Denominator>\n18           std::enable_if_t<std::is_floating_point_v<Numerator>\
  \ ||\n19                            std::is_floating_point_v<Denominator>,\n20 \
  \                           int = 0>\n21 auto divide(Numerator, Denominator) {\n\
  22   // 浮点除法\n23   return numerator / denominator;\n24 }\n```\n图 110. SFINAE `divide`\
  \ 函数。\n\nC++17 的 `if constexpr` 结构可以简化这段代码：\n\n```cpp\n 1 import std;\n 2 3 // 注意我们可以对\
  \ numerator 和 denominator 使用 `auto`\n 4 // 但会使 if constexpr 代码复杂化\n 5 // 因为我们需要使用\
  \ `decltype` 来获取类型信息。\n 6 template <typename Numerator, typename Denominator>\n\
  \ 7 [[nodiscard]] constexpr auto divide(Numerator numerator, Denominator de\\\n\
  8 notion) {\n9   if constexpr (std::is_integral_v<Numerator> &&\n10            \
  \     std::is_integral_v<Denominator>) {\n11     // 整数除法\n12     if (denominator\
  \ == 0) {\n13         throw std::runtime_error(\"divide by 0!\");\n14     }\n15\
  \   }\n16 \n17   return numerator / denominator;\n18 }\n```\n图 111. `if constexpr`\
  \ 用于编译时行为。\n\n在许多情况下，使用概念（concepts）代替 `if constexpr` 以提高可读性。\n\n```cpp\n 1 import\
  \ std;\n 2 3 // 默认重载\n 4 [[nodiscard]] constexpr auto divide(auto numerator, auto\
  \ denominator) {\n 5   return numerator / denominator;\n 6 }\n 7 8 // 只有当两个参数都是整数时才调用的版本\n\
  \ 9 [[nodiscard]] constexpr auto divide(\n10   std::integral auto numerator, std::integral\
  \ auto denominator) {\n11 \n12   // 整数除法\n13   if (denominator == 0) {\n14     throw\
  \ std::runtime_error(\"divide by 0!\");\n15   }\n16 \n17   return numerator / denominator;\n\
  18 }\n```\n图 112. 使用约束代替 `if constexpr`。\n\n\n\n\n\n| ![](img/leanpub_info-circle.png)\
  \ |\n\n`if constexpr` 块内部的代码在语法上必须是正确的。`if constexpr`并不等同于 `#define`。\n\n| ![](img/leanpub_key.png)\
  \ |\n\n某些你通常会选择放在 `if` 块之外的代码，现在可能需要放在 `else` 块内部，以确保它们不会用无效类型进行实例化。\n\n| ![](img/leanpub_pencil.png)\
  \ |\n\n## 练习：深入研究“内省设计（design by introspection）”\n\n`if constexpr`、概念（concepts）和\
  \ `requires` 的结合产生了一种非常强大、几乎类似于反射的能力。\n\n```cpp\n1 constexpr void add_values(auto\
  \ &container, auto first, auto second)\n 2 {\n 3   // 我们在编译时询问这个容器\n 4   // 是否有\
  \ reserve 和 size 成员。\n 5   if constexpr(requires {container.reserve(container.size()\
  \ + 2); }) {\n 6     // 如果这是一个有效操作，则在运行时执行\n 7     container.reserve(container.size()\
  \ + 2);\n 8   }\n 9 \n10   // 无论如何，添加值\n 11   container.push_back(first);\n 12 \
  \  container.push_back(second);\n 13 }\n```\n\n图 113. “内省设计”示例。\n\n## 55.1: 资源\n\
  \n* [C++ Weekly 特别版：使用 C++17 的 constexpr if](https://youtu.be/_Ny6Qbm_uMI)\n* [C++\
  \ Weekly - Ep 122 - 配合 optional 和 variant 使用 constexpr](https://youtu.be/2eCV_udkP_o)\n\
  * [CppCon 2017: Jason Turner “实战 C++17”](https://youtu.be/nnY4e4faNp0)\n* [C++ Weekly\
  \ - Ep 242 - C++20 中的内省设计](https://youtu.be/sy32kAtsIKg)\n* [Tony Tables 中的 C++17：constexpr\
  \ if](https://github.com/tvaneerd/cpp17_in_TTs/blob/master/if_constexpr.md)\n\n\
  # 56: 去模板化你的泛型代码（De-template-ize）\n\n尽可能将内容移出模板之外。使用其他函数。使用基类。编译器仍然可以对它们进行内联处理或保持不内联。\n\
  \n去模板化将缩短编译时间并减少二进制文件体积。这两者都有帮助。它还消除了人们认为的“模板代码膨胀”（在我看来，这[并不存在](https://articles.emptycrate.com/2008/05/06/nobody_understands_c_part_5_template_code_bloat.html)）。\n\
  \n```cpp\n1 template<typename T>\n2 constexpr void do_things()\n 3 {\n 4   // 这个\
  \ lambda 必须为每个\n 5   // 模板实例化生成\n 6   auto lambda = [](){ /* 一个不捕获变量的 lambda */\
  \ };\n 7   auto value = lambda();\n 8 }\n```\n\n图 114. 为每个函数模板实例化生成了一个新的 lambda。\n\
  \n相比之下：\n\n```cpp\n1 constexpr auto some_function() { /* 执行操作*/ }\n 2 \n3 template<typename\
  \ T>\n4 constexpr void do_things()\n 5 {\n 6   auto value = some_function();\n 7\
  \ }\n```\n\n图 115. 模板实例化之间共享的逻辑。\n\n现在内部逻辑只有一个版本被编译，并且由编译器决定是否应该对其进行内联。\n\n类似的技巧也适用于基类和模板化的派生类。\n\
  \n| ![](img/leanpub_pencil.png) |\n\n## 练习：Bloaty McBloatface 和 -ftime-trace。\n\n\
  我们有越来越多的工具可以用来查找二进制文件中的膨胀问题并分析编译时间。研究这些工具以及你平台上其他工具。\n\n在你的二进制文件上运行这些工具，看看你会发现什么。\n\
  \n使用 clang 的 `-ftime-trace` 时，也要查看 ClangBuildAnalyzer。\n\n## 56.1: 资源\n\n* [Templight](https://github.com/mikael-s-persson/templight)\n\
