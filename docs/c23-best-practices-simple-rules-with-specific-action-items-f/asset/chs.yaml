  \ Turner “初始化列表坏了，让我们修复它们”](https://youtu.be/sSlmmMFsXQ) (深入探讨问题)\n* [C++ Insights](https://cppinsights.io/)\n\
  \n# 61: 考虑指定初始化 (C++20)\n\n直接初始化（Direct-Initialization）提供了一种初始化公共成员的高效方式。\n\n```cpp\n\
  #include <string>\n\n struct Data {\n   std::string first;\n   std::string second;\n\
  \ };\n\n int main() {\n   // 直接初始化 `first` 和 `second`\n   // 这没有拷贝或移动开销\n   Data\
  \ d{\"Hello\", \"World\"};\n }\n```\n\n这种方式是 C++20 添加了“指定初始化（designated initializers）”，允许你指定对象的名称。\n\
  \n* 必须按顺序初始化\n* 名称必须是唯一的\n\n```cpp\n#include <string>\n\n struct Data {\n   std::string\
  \ first;\n   std::string second;\n };\n\n int main() {\n   Data d{.first = \"Hello\"\
  , .second = \"World\"};\n }\n```\n\n图 127. 直接初始化示例\n\n| ![](img/info-circle.png)\
  \ |\n\n重要的是：编译器对指定初始化的支持是不一致的。确保在你的指定初始化时开启警告。\n\n| ![](img/leanpub_pencil.png)\
  \ |\n\n## 练习：与你的团队讨论你的偏好\n\n* 跳过参数是优势还是劣势？\n* 参数的名称重要吗？\n* 在你的系统中强类型重要吗？\n\n| ![](img/leanpub_pencil.png)\
