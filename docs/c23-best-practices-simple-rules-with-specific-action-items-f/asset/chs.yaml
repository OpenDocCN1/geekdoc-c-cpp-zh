  \n看起来像 C 家族语言的语言可能会让你感到更自在。尝试寻找一种看起来不同的语言并挑战你的思维。\n\n## 8.1: 资源\n\n*   [在名词王国中执行](https://steve-yegge.blogspot.com/2006/03/execution-in-kingdom-of-nouns.html)\
  \ - 让你思考不同的编程范式。\n\n# 9: 了解你的标准库\n\nC++ 标准库正在不断增长。在 C++23 标准中，该库约为 1403 页，占标准的 66%。在\
  \ C++17 中，它只有 965 页。\n\n意识到到标准中发生的变化是关重要的。我们只触及部分内容，但 C++20 和 C++23 的一些亮点包括：\n\n\
  *   极大地扩展的时间处理（with calendar）\n*   并发的许多变化\n*   `std::format`\n*   ranges\n*   concepts\n\
  *   `<stacktrace>`\n\n| ![](img/leanpub_pencil.png) |  \n\n## 练习：浏览 C++23 看看哪些吸引了你\
  \ https://en.cppreference.com/w/cpp\n\n |# 10: 使用工具\n\n在本书中你会看到关于工具的引用，以及一个专门关于“使用工具”的章节。C++\
  \ 默认有很多陷阱和边缘情况。我们使用各种工具来缓解这些问题。这是 C++ 的核心原则：开启所有工具！\n\n11: 不要触发未定义行为\n\n好的，有很多未定义行为（UB），很难追踪，所以我们将在给出一些示例。你需要理解的关键是，UB\
  \ 的存在意味着你的整个程序.[[abstract](http://eel.is/c++draft/intro.abstract-5)]\n\n> 符合标准的实现执行良好的程序时，应产生与相同输入的一种可能的执行结果相同的观测行为。\n\
  \n>\n\n> 然而，如果任何此类执行包含未定义操作，本文档对执行该输入的实现不作任何要求（即使是第一个操作之前的操作）。\n\n注意这句话：“本文档对执行该输入的实现不作任何要求（即使是第一个操作之前的操作）”。\n\
  \n如果你有 UB，整个程序都是可疑的。\n\n| ![](img/leanpub_info-circle.png) |  \n\n接下来的几项讨论了减少项目中未定义行为的方法。\n\
  \n ![](img/leanpub_pencil.png) |  \n\n## 练习：使用 UBSan、ASan 和警告\n\n理解所有的未定义行为是不可能的。幸运的是，我们有工具帮助。希望你已经为代码开启了\
  \ UBSan、ASan 并开启了警告。现在是回去评估你的情况并看看是否有新发现的好机会。\n\n## 11.1: 资源\n\n*   [C++Now 2018:\
  \ John Regehr 闭场演讲：未定义行为与编译器优化](https://youtu.be/AeEwxtEOgH0)\n*   [CppCon 2018:\
  \ Barbara Geller & Ansel Sermersheim 未定义行为不是错误](https://youtu.be/XEXpwis_deQ)\n\n\
  # 12: 永远不要测试 `this` 是否为 `nullptr`,那是 UB\n\n```cpp\n1 int Class::member() {\n2  \
  \ if (this == nullptr) { \n3     // 会被编译器删除，如果这真的为空的话\n4     // 将是 UB\n5     return\
  \ 42; \n6   } else { \n7     return 0;\n8   }\n9 }\n```\n\n图 2. 检查 `this` 是否为 `nullptr`\
  \ 是无效的。\n\n\n\n\n从技术上讲，导致未定义行为（UB）的并不是这个检查。但是这个检查永远是不可能失败的。如果 `this` 是 `nullptr`，你就会处于未定义行为状态。人们以前经常这样做，但它一直一直是\
  \ UB。你不能在对象的生命周期之外访问它。现在的编译器总是会移除这个检查。\n\n理论上，`this` 可能为 `null` 的唯一方法是当你直接在一个空指针对象上调用成员函数时。\n\
  \n| ![](img/leanpub_warning.png) |  \n\n后面是反面示例，请不要重复。\n\n```\n1 Type *obj = nullptr;\n\
  2 obj->do_thing(); // 永远不要这样做\n```\n\n图 3. 在 `nullptr` 上调用成员的错误示例。\n\n即使在（技术上可行，但永远不要这样做）的调用\
  \ `delete this` 场景下，也是如此。\n\n```cpp\n 1 struct S {\n 2   std::string data;\n 3 \n\
  4   void delete_yourself() {\n5     // 执行一些操作\n6     delete this; // 技术上可行\n 7 \n\
  8     if (this) {\n9       // 这个块将始终被执行，没有任何变化\n10       // 我们对 `this` 的视图\n11 \
  \    }\n12     \n13     // 永远不要这样做\n14     data.size(); // UB，data 的生命周期已经结束\n15\
  \   }\n16 };\n```\n\n图 4. `delete this` 的错误示例。\n\n在现代编译器上，不存在任何一种情况下对 `if (this)`\
  \ 的检查会返回 `false`。\n\n| ![](img/leanpub_pencil.png) |  \n\n## 练习：你会检查 `this` 是否为\
  \ `nullptr` 吗？\n\n对 `nullptr` 的检查可能伪装成对 `NULL` 的检查或对 `0` 的检查。对 `this` 是否为 `NULL`\
  \ 的检查可能只存在非常旧的代码库中。确保你开启了警告，然后寻找这些情况。\n\n在你的代码库中搜索 `this ==` 可能是很有趣的，看看那里存在什么奇怪的事情。\n\
  \n## 12.1: 资源\n\n*   [迁移到 GCC-6 优化移除了对 `this` 的空指针检查](https://www.gnu.org/software/gcc/gcc-6/porting_to.html#this-cannot-be-null)\n\
  \n# 13: 永远不要测试引用是否为 `nullptr`，那是 UB\n\n```cpp\n1 int get_value(int &thing) {\n2\
  \   if (&thing == nullptr) {\n3     // 被编译器移除 \n4     return 42;\n5   } else {\n\
  6     return thing;\n7   }\n8 }\n```\n\n图 5. 对 `null` 引用的测试被移除了\n\n创建一个空引用是 UB，不要尝试。始终假设引用指向一个有效的对象。在设计\
  \ API 时，利用这一事实来让自己占优势（（#all_chapter_contents.xhtml_make-interfaces-hard-to-use-wrong）。\n\
  \n| ![](img/leanpub_pencil.png) |  \n\n## 练习：检查对象地址的检查\n\n使用 `&thing ==` 检查对象的特定地址有很多有效的用例，但也有许多方法可以让这种检查是错误的。\n\
  \n搜索你的代码中检查对象内存地址的语句，并理解它们在做什么以及是如何工作的（或者是否工作）。\n\n| ![](img/leanpub_question-circle.png)\
  \ |  \n\n除了 `==` 之外，还可以通过其他方法检查对象的地址？\n\n这个练习让你在使用各种搜索/grep 工具以及玩正则表达式方面获得很棒的经验。\n\
  \n## 13.1: 资源\n\n*   [-Wtautological-undefined-compare](https://clang.llvm.org/docs/Diagnostics.html#tautological-undefined-compare)\
  \ （注：此处原文链接可能不完整，已根据语境补全）\n\n# Part II: 使用工具\n\n# 14: 使用工具：自动化测试\n\n你需要一个命令来运行测试。如果你没有自动化测试，那么维护质量是不可能的。\n\
  \n以下是常用的测试框架：\n\n*   [Catch2](https://github.com/catchorg/catch2) - 流行的框架，源自 [Martin\
  \ Hoenestrup](https://github.com/hoenestrup) 和 [Petr Horenovský]。\n*   [doctest](https://github.com/doctest/doctest)\
  \ - 与 Catch2 类似，但更轻量。\n*   [Google Test](https://github.com/google/googletest) -\
  \ 谷歌出品。\n*   [Boost.Test](https://www.boost.org/doc/libs/1_84_0/libs/test_framework/index.html)\
  \ - Boost 标准。\n\n`ctest`(https://cmake.org/ctest.html) 是 CMake 的测试运行器，可以与上述任何框架配合使用。理想的\
  \ CMake 构建流程看起来像这样：\n\n```\n1 cmake -S src -B builddir -G <Generator>\n2 cmake --build\
  \ builddir --config <Configuration>\n3 cd builddir\n4 ctest -C <Configuration>\n\
  ```\n\n图 6. 可能的构建测试步骤。\n\n没有自动化测试，你无法维护项目质量。\n\n在我职业生涯处理过的 C++ 项目中，我不得不支持某些组合：\n\
  \n*   x86\n*   x64\n*   SPARC\n*   ARM\n*   MIPS\n\n*   Windows\n*   Solaris\n*\
  \   MacOS\n*   Linux\n\n当你开始在多个平台组合多个编译器时，某个平台上的重大更改可能会破坏一个或多个平台。\n\n为了解决这个问题，为你的项目开启带有测试的持续构建。\n\
  \n*   测试你支持的所有平台\n*   分别测试 Debug 和 Release\n*   测试所有配置选项\n*   针对比你支持的新版本的编译器进行测试\n\
  \n| ![](img/leanpub_info-circle.png) |  \n\nSanitizers 只能对未被优化器移除的代码注入，但优化器有时会利用\
  \ UB，因此你至少需要 Debug、Debug + Sanitizers、Release、Release + Sanitizers，至少在一个平台上！\n\n\
  | ![](img/leanpub_key.png) |  \n\n如果你不要求 100% 的测试通过，你永远不知道代码的状态。\n\n| ![](img/leanpub_pencil.png)\
  \ |  \n\n## 练习：开启持续构建\n\n了解你组织目前的持续构建环境。如果不存在，建立它的障碍是什么？为你的项目设置类似 GitLab、GitHub\
  \ Actions、Appveyor 或 Travis 有多困难？\n\n# 16: 使用工具：编译器警告\n\n你有许多没有使用的警告，其中绝大多数是有益的。`-Wall`\
  \ 并不是 GCC 和 Clang 上的所有警告。`-Wextra` 仅仅是触及表面！\n\n| ![](img/leanpub_info-circle.png)\
  \ |  \n\n`/Wall` 在 MSVC 上是所有的警告。我们的编译器编写者建议在 MSVC 上使用 `/Wall` 或在 Clang 上使用 `-Weverything`，因为其中许多是不可操作的诊断性警告。GCC\
  \ 没有提供等效方案。\n\n\n\n强烈建议使用 `-Wpedantic` (GCC/Clang)。此命令行选项会禁用语言扩展，并让代码更接近 C++ 标准。你今天开启的警告越多，未来迁移到其他平台时就越越容易。\n\
  \n| ![](img/leanpub_info-circle.png) |  \n\n在 MSVC 的 C++20 模式下，`/permissive-` 不再是必要的，它现在是\
  \ `cl.exe` 的默认设置。\n\n| ![](img/leanpub_pencil.png) |  \n\n## 练习：启用更多警告\n\n1. 探索你的编译器提供的可用警告集。尽可能开启所有警告。\n\
  2. 修复新生成的警告。\n3. 回到第 1 。\n\n| ![](img/leanpub_info-circle.png) |  \n\nMSVC 拥有一套非常出色的警告，可以通过警告级别启用。你可以从\
  \ `/W1` 开始，并在修复每组警告的过程中，逐步提升到 `/W4`。\n\n这个过程会让你觉得枯燥且毫无意义，但这些警告会捕捉真实的 Bug。\n\n| ![](img/leanpub_pencil.png)\
  \ |  \n\n## 练习：讨论在 CI 上启用 `-Werror` 或 `-WX` 以确保警告不累积。\n\nK> 我观察到，你需要在开发者机器和 CI 上都开启“警告视为错误”，否则开发者会将\
  \ CI 视为敌人，并会禁用越来多的警告！\n\n## 16.1: 资源\n\n* [C++ 最佳实践网站整理的警告列表](https://github.com/lefticus/cppbestpractices/blob/master/02-Use_the_Tools_Available.md#compilers)\n\
  * [GCC 完整警告列表](https://gcc.gnu.org/onlinedocs/gcc/Warning-Options.html)\n* [Clang\
  \ 完整警告列表](https://clang.llvm.org/docs/DiagnosticsReference.html)\n* [MSVC 默认关闭的编译器警告](https://docs.microsoft.com/en-us/cpp/preprocessor/compiler-warnings-that-are-off-by-default?view=vs-2019)\n\
  * [C++ Weekly 第 168 期 - 发现你应该使用的警告](https://youtu.be/IOo8gTDMFkM)\n\n# 17: 使用工具：静态分析\n\
  \n静态分析工具是在不编译或执行代码的情况下分析代码的工具。你的编译器就是此类工具之一，也是你的第一道防线。\n\n许多工具都是免费的，有些对开源项目免费。\n\
  \n`cppcheck` 和 `clang-tidy` 是两个流行且免费的工具，与主流 IDE 和编辑器有深度集成。\n\n| ![](img/leanpub_pencil.png)\
  \ |  \n\n## 练习：启用更多静态分析\n\nVisual Studio：查看随附的 Microsoft 静态分析器。考虑使用 `Clang Power\
  \ Tools`。下载 Visual Studio 的 `cppcheck` 插件。\n\nCMake：启用 `cppcheck` 和 `clang-tidy`\
  \ 集成\n\n| ![](img/leanpub_pencil.png) |  \n\n## 练习：在你的 IDE 中启用静态分析\n\n大多数现代 IDE\
  \ 都内置支持 `clang-tidy` 和静态分析工具。研究如何启用这些支持，并配置你的 `.clang-tidy` 文件，以开启适用于你项目的分析。\n\n\
  ## 17.1: 资源\n\n* [cppbestpractices.com 静态分析器列表](https://github.com/lefticus/cppbestpractices/blob/master/02-Use_the_Tools_Available.md#static-analyzers)\n\
  \n# 18: 使用工具：考虑自定义静态分析\n\n记住专注于让你的接口难以误用。然后，作为第二道防线，考虑编写自己的静态分析。\n\n这些可能以以下形式存在：\n\
  \n* [自定义 clang-tidy 分析](https://clang.llvm.org/extra/clang-tidy/Contributing.html)\n\
  * 使用 `clang-query` 查询项目的 [AST](https://clang.llvm.org/docs/LibASTMatchersReference.html)\
  \ 以查找常见错误\n* 为 `cppcheck` 编写[自定义规则](https://sourceforge.net/projects/cppcheck/files/Articles/)\n\
  * [CodeQL](https://codeql.github.com/)自定义检查\n\n| ![](img/leanpub_pencil.png) | \
  \ \n\n## 练习：寻找常见的编码错误。\n\n只需与团队其他成员讨论你在代码库中看到的常见问题。看看是否能隔离出一两个自定义分析检查就能发现的常见问题。使用上述工具之一实现一个检查。\n\
  \n## 18.1: 资源\n\n* [快速演讲：使用 Clang Query 隔离 AST 元素 - Kristen Shaker - C++ on Sea\
  \ 2022](https://youtu.be/2LOxsfpCCyI)\n* [供学习的自定义 cppcheck 规则数据库](https://github.com/embeddedartistry/cppcheck-rules)\n\
  * [CodeQL 教程](https://codeql.github.com/docs/writing-codeql-queries/ql-tutorials/)\n\
  \n# 19: 使用工具：Sanitizers (消毒器)\n\nSanitizers 是 C++ 的运行时分析工具，内置于 GCC、Clang 和 MSVC\
  \ 中。\n\n如果你熟悉 Valgrind，Sanitizers 提供了类似的功能，但速度比 Valgrind 快几个数量级。\n\n可用的 Sanitizers\
  \ 包括：\n\n* Address (ASan)\n* Undefined Behavior (UBSan) (更多信息见后文)\n* Thread\n* DataFlow\n\
  * Fuzzer\n\nAddress Sanitizer、Undefined Behavior Sanitizer 和 Thread Sanitizer 可以发现很多问题。\n\
  \n当发生内存越界等错误时，Sanitizer 会给出报告并提供修复建议。\n\n你可以通过以下命令启用 Address 和 Undefined Behavior\
  \ sanitizers：\n\n```\ngcc -fsanitize=address,undefined <file>\n```\n\nSanitizers\
  \ 在链接阶段也必须启用。\n\n| ![](img/leanpub_info-circle.png) |  \n\n使用 sanitizers 的示例可见 [C++\
  \ Template](https://github.com/cpp-best-practices/cmake_template)。\n\nK> 结合 Debug、Release、开启\
  \ sanitizer 和关闭 sanitizer 的构建，每种组合都能暴露不同的问题。\n\n| ![](img/leanpub_pencil.png) |\
  \  \n\n## 练习：启用 Sanitizers\n\n* 研究如何为你的项目添加 sanitizer 支持\n* 先启用 ASan\n* 运行测试套件并调查发现的问题\n\
  * 后启用 UBSan\n* 再次运行测试套件\n\n目标：在你的环境下运行所有 ASan 和 UBSan。\n\n| ![](img/leanpub_pencil.png)\
  \ |  \n\n## 练习：回到 Valgrind 或 Dr Memory\n\n如果你无法在环境中运行 ASan 和 UBSan，请研究使用 Dr Memory（Windows/Linux/MacOS）或\
  \ Valgrind（Linux/MacOS）运行测试套件。\n\n## 19.1: 资源\n\n* [MSVC 版 AddressSanitizer (ASan)](https://devblogs.microsoft.com/cppblog/addresssanitizer-asan-for-windows-with-msvc/)\n\
  * [GitHub 上的 Sanitizers 与文档](https://github.com/google/sanitizers)\n* [Clang AddressSanitizer\
  \ 文档](https://clang.llvm.org/docs/AddressSanitizer.html)\n* [Clang UndefinedBehaviorSanitizer\
  \ 文档](https://clang.llvm.org/docs/UndefinedBehaviorSanitizer.html)\n\n# 20: 使用工具：加固\n\
  \n安全对于许多行业和产品都很重要。如果安全是你关注的，你应该考虑在发布二进制时进行加固。\n\n待填充\n\n| ![](img/leanpub_pencil.png)\
  \ |  \n\n## 练习：考虑 UBSan 最小运行时\n\nUBSan 的“最小运行时”版本是为二进制加固设计的。\n\n# 21: 使用工具：多个编译器\n\
  \n在你的平台上支持*至少* 2 个编译器。每个编译器进行不同的分析，并且对标准的实现也略有不同。\n\n如果你使用 Visual Studio，你应该相对容易地在\
  \ `clang` 和 `cl.exe` 之间切换。你可以使用 WSL 并启用远程 Linux 构建。\n\n如果你使用 Linux，你应该轻松地在 GCC 和\
  \ Clang 之间切换。\n\n| ![](img/leanpub_warning.png) |  \n\n\n\n在 MacOS 上，请确保你使用的编译器确实是你所认为的那一个。`gcc`\
  \ 命令很可能是 Apple 安装的 clang 的软链接。\n\n![](img/leanpub_warning.png)\n\n`apple-clang`\
  \ 与主线 clang 不是一回事，它们的版本号也不匹配。通常很难知道 `apple-clang` 支持哪些功能。cppreference 的[编译器支持参考文档](https://en.cppreference.com/w/cpp/compiler_support)\
  \ 可能会有所帮助。\n\n要在你的平台上安装较新版本或不同的编译器，可以参考以下方法：\n\n### Ubuntu / Debian\n*   `GCC` -\
  \ [工具链 PPA](https://launchpad.net/~ubuntu-toolchain-r/+archive/ubuntu/ppa)\n*  \
  \ `Clang` - [apt 软件包](https://apt.llvm.org/)\n\n### Windows\n*   [GCC MinGW](http://mingw.org/)\n\
  *   [Clang 官方下载](https://releases.llvm.org/download.html)\n\n### MacOS\n*   Homebrew\
  \ / MacPorts\n\n![](img/leanpub_pencil.png)\n\n## 练习：添加另一个编译器\n\n既然你已经开启了系统的持续构建，现在是添加另一个编译器的时候了。\n\
  \n你当前需要的编译器的新版本总是个好主意。但如果你只支持 `GCC`，考虑添加 `Clang`。如果你只支持 `Clang`，请添加 `GCC`。如果你在 Windows\
  \ 上，除了 `MSVC` 之外，添加 `MinGW` 或 `Clang`。\n\n![](img/leanpub_pencil.png)\n\n## 练习：添加另一个操作系统\n\
  \n希望你的项目至少部分可以移植到另一个操作系统。让项目部分在另一个操作系统和工具链上编译的练习将让你深入了解你代码的本质。\n\n## 21.1: 资源\n\n\
  *   [C++Now 2015: Jason Turner “思考移植性：如何以及为什么让你的 C++ 跨平台”](https://youtu.be/cb3WIL96N-o)\n\
  \n# 22：使用工具：模糊测试与变异\n\n你的想象力限制了你所创建的测试。在调用 API 时你会尝试进行恶意调用吗？你会故意向输入传递格式错误的数据吗？你会处理来自未知或不可信源的输入吗？\n\
  \n为所有可能的组合中的所有函数调用生成所有可能的输入是不可能的。幸运的是，有工具可以解决这个问题。\n\n## 22.1: 模糊测试 (Fuzzing)\n\n\
  模糊测试器生成各种长度的随机数据字符串。你编写的测试框架消耗这些数据字符串，并以适用于你的应用程序的方式进行处理。模糊测试器分析由测试执行生成的覆盖率数据，并利用这些信息移除冗余测试，生成新的新颖且独特的测试。\n\
  \n从理论上讲，如果运行足够的时间，模糊测试最终将达到被测试代码 100% 的覆盖率。结合 `AddressSanitizer`，这成为了一个发现代码中 bug\
  \ 的强大工具。[来自 2015 年的一篇有趣文章](https://blog.hboeck.de/archives/868-How-Heartbleed-couldve-been-found.html)\
  \ 描述了模糊测试器与 `AddressSanitizer` 的结合如何在不到 6 小时内发现 OpenSSL 中的“heartbleed”漏洞。\n\n![](img/leanpub-info-circle.png)\n\
  \n这 6 小时现在已经完全过时了。使用现代的模糊测试工具和更新的计算机，像 heartbleed 这样的漏洞可以在几分钟内被发现。\n\n![](img/leanpub_key.png)\n\
  \n模糊测试主要发现内存和安全漏洞。\n\n存在许多不同的模糊测试工具。为了本节内容，我将关注 [LLVM 的 libFuzzer](https://www.llvm.org/docs/LibFuzzer.html)。大多数模糊测试器都在相同的前提下运行。\n\
  \n你必须提供某种入口。入口的形式通常如下函数：\n\n```cpp\nextern \"C\" int LLVMFuzzerTestOneInput(const\
  \ uint8_t *Data,\n                                     size_t Size);\n```\n\n图 8.\
  \ `libFuzzer` 入口。`Data` 指针总是有效的，`Size` 参数 >= 0。\n\n如果你的库主要解析文件（例如 `libpng`），那么你的工作非常简单：\n\
  \n```cpp\nextern \"C\" int LLVMFuzzerTestOneInput(const uint8_t *Data,\n       \
  \                              size_t Size)\n{\n  parseInput(Data, Size);\n}\n```\n\
  \n图 9. `libFuzzer` 的数据使用。\n\n如果你的函数接收的是数据结构而非输入字符串，你的工作会复杂一些，但可行：\n\n```cpp\ntemplate<typename\
  \ Type>\nstd::tuple<const uint8_t *, size_t, Type>\n    createStruct(const uint8_t\
  \ *Data, size_t Size)\n{\n  // 仅允许简单类型 (trivial types) 执行此操作\n  static_assert(std::is_trivial_v<Type>);\n\
  \  Type result{}; // 初始化\n  const auto bytesToRead = std::min(sizeof(Type), Size);\n\
  \  std::memcpy(&result, Data, bytesToRead);\n  return {std::next(Data, bytesToRead),\
  \ Size - bytesToRead, result};\n}\n```\n*(注：上述代码基于提供的文本逻辑的表示）*\n\n\n\n\n*   [CppCon\
  \ 2020: Barnabás Bágyi “Fuzzing Class Interfaces for Generating and Running Tests\
  \ with libFuzzer”](https://cppcon2020.sched.com/event/e7An/fuzzing-class-interfaces-for-generating-and-running-tests-with-libfuzzer?iframe=no)\
  \ - 关于以新方式使用模糊测试的启发性演讲。视频尚未上线 YouTube，但请在本书出版后尝试查找。\n*   [Autotest](https://gitlab.com/wilzegers/autotest/)\
  \ - 与“Fuzzing Class Interfaces for Generating and Running Tests with libFuzzer”演讲相关的库。\n\
  *   [FuzzTest](https://github.com/google/fuzztest) - Google 提供的模糊测试库。\n*   [DeepState](https://github.com/trailofbits/deepstate)\
  \ - TrailOfBits 提供的模糊测试工具。\n*   [oss-fuzz](https://github.com/google/oss-fuzz) -\
  \ 开源项目的持续模糊测试。\n*   [Mutate++](https://github.com/nlohmann/mutate_cpp) - 变异测试工具。\n\
  \n# 23: 使用工具：构建生成器\n\n*   [CMake](https://cmake.org)\n*   [Meson](https://mesonbuild.com/)\n\
  *   [Bazel](https://bazel.build/)\n*   [其他](https://github.com/lefticus/cppbestpractices/blob/master/02-Use_the_Tools_Available.md)\n\
  \n原始 Makefile 或 Visual Studio 项目文件会让实现上述任何一项都变得过于复杂。使用构建工具来帮助维护跨平台和编译器的可移植性。\n\n\
  像对待其他代码一样对待你的构建脚本。它们有自己的最佳实践，编写不可维护的构建脚本和编写不可维护的 C++ 一样容易。\n\n构建生成器还可以通过 `cmake\
  \ --build` 等工具抽象并简化你的持续构建环境，无论使用什么平台，它都能执行正确的操作。\n\n| ![](img/leanpub_pencil.png)\
  \ |  \n\n## 练习：调查你的构建系统。\n\n*   你的项目目前使用构建生成器吗？\n*   你的构建脚本有多久了？\n\n查看是否有你需要应用的当前最佳实践。是否有可以在你的构建脚本上运行的\
  \ tidy 或格式化工具？\n\n回本书书中之前的最佳实践，看看它们如何应用于你的构建脚本。\n\n*   你是否在重复造轮？\n*   是否存在更高级的抽象？\n\
