  \n一些关键点是：\n\n* 不要使用截图\n* 使用良好的变量名\n* 添加一些测试\n* 听别人告诉你的什么\n\n### 63.2: 会议与本地用户小组\n\
  \n你附近几乎肯定有一个。这是建立人脉和学习新事物的极佳方法。查看[全球 ISO C++会议列表](https://isocpp.org/wiki/faq/conferences-worldwide)\
  \ 和 [Meeting C++ 用户小组列表](https://meetingcpp.com/usergroups/)。\n\n我在全球 COVID-19 大疫情期间完成这本书。因此，目前会议和用户小组大多处于暂停状态。但这为许多人提供了一个极具吸引力的新机会。\n\
