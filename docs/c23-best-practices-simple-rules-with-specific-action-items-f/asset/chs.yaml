  \nC++20 可以为你生成任何比较运算符（因其形状，口俗被称为“飞船运算符”）。\n\n*   如果你定义了 `==`，编译器会自动生成 `!=`\n*  \
  \ 如果你定义了 `<=>`，编译器将生成所有其他比较（`==` 和 `!=` 除外）\n*   你可以显式地对任何比较操作使用默认\n\n```cpp\nstruct\
  \ MyData {\n  int i;\n  int j;\n\n  // 提供所有比较运算符\n  friend auto operator<=>(const\
  \ MyData &, const MyData &) = default;\n};\n```\n\nFigure 50. 基础飞船运算符示例\n\nC++ 标准已经开始弃用显式的比较操作，请参考标准中的示例。\n\
  \n注意，为了性能考虑，`std::string` 实现了自定义的 `operator==`（提供 `==` 和 `!=`）和 `operator<=>`（提供剩余）。\n\
  \nhttps://en.cppreference.com/w/cpp/string/basic_string/operator_cmp\n\n| ![](img/image)\
  \ |  \n\n如果你为你的类型提供了自定义的 `operator<=>`，编译器将不会为你提供 `operator==` 或 `operator!=`！这类似于针对特殊成员函数的“零之规则”和“五之规则”。\n\
  \n*   如果你提供了自定义的 `operator<=>`，你必须提供自己的 `operator==`\n*   如果你需要自定义的 `operator<=>`，那么显式默认的\
  \ `operator==` 可能无法完成正确的工作\n\n| ![](img/image) |  \n\n## 练习：实现飞船运算符\n\n```cpp\n\
