  \n# 第四部分：代码实现指南\n\n## 41：不要复制粘贴代码\n\n如果你发现自己正准备选择一段代码并复制它：停下！\n\n后退一步，重新审视这段代码。\n\
  \n* 你为什么要复制它？\n* 源代码和目标代码有多相似？\n* 将其封装成函数有意义吗？\n* 记住，不要害怕模板\n\n我发现，这个简单的规则对我的代码质量产生了最直接的影响。\n\
  \n如果粘贴操作的结果是进入当前函数，请考虑使用 lambda。\n\nC++14 风格的 lambda 带有泛型（即 `auto`）参数，为你提供了一种简单易用的创建复用代码的方法，可以与不同的数据类型共享，而无需处理\
  \ `template` 语法。\n\n## 练习：尝试 CPD（重复代码检测）。\n\n有几种不同的复制粘贴检测工具可以查找代码库中的重复代码。\n\n对于此练习，请下载\
