  \n# 59: 避免 std::bind 和 std::function\n\n虽然编译器不断改进，且优化器在绕过这些类型的复杂性，但其中任何一种仍然可能增加显著的编译时间和运行时开销。\n\
  \nC++14 的 lambda 配合泛化捕获表达式，可以实现 `std::bind` 所能的功能。\n\n| ![](img/leanpub_key.png)\
  \ |\n\n`std::function` 不支持 `constexpr`，这是你可能可能在代码中避免使用它的另一个原因。\n\n\n\n\n\n```cpp\n\
  \ import std;\n \n [[nodiscard]] constexpr double divide(double numerator, double\
  \ denominator) {\n   return numerator / denominator;\n }\n\n auto inverted_divide\
  \ = std::bind(divide,\n                                  std::placeholders::_2,\
  \ \n                                  std::placeholders::_1);\n```\n\n图 118. 使用\
  \ `std::bind` 更改参数顺序\n\n```cpp\n import std;\n\n \n [[nodiscard]] constexpr double\
  \ divide(double numerator, double denominator) {\n   return numerator / denominator;\n\
  \ }\n\n auto inverted_divide = [](const auto numerator,\n                      \
  \     const auto denominator) {\n   return divide(denominator, numerator)\n }\n\
  ```\n\n图 119. 使用 Lambda 更改参数顺序\n\n| ![](img/leanpub_pencil.png) |  \n\n## 练习：比较各种可能性。\n\
  \n|在 Compiler Explorer 中尝试这些选项。编译时间和生成的汇编代码看起来是样的？\n\n```cpp\n import std;\n\n //\
  \ std::function 没有开启 constexpr 支持，所以这个\n // 不能是 `constexpr`\n [[nodiscard]] std::function<int\
  \ (int)> bind_3(auto func)\n {\n   return std::bind(func, std::placeholders::_1,\
  \ 3);\n }\n\n int main(int argc, const char *[])\n {\n   return bind_3(std::plus<>{})(argc);\n\
  \ }\n```\n\n图 120. `std::function` 和 `std::bind`\n\n```cpp\n #include <functional>\n\
  \n // std::bind 开启了 constexpr 支持\n [[nodiscard]] constexpr auto bind_3(auto func)\n\
  \ {\n   return std::bind(func, std::placeholders::_1, 3);\n }\n\n int main(int argc,\
  \ const char *[])\n {\n   return bind_3(std::plus<>{})(argc);\n }\n```\n\n图 121.\
  \ 仅使用 `std::bind`，作为加分项，函数 `bind_3` 返回什么类型？\n\n```cpp\n #include <functional>\n\n\
  \ [[nodiscard]] constexpr auto bind_3(auto func)\n {\n   return func{ return func(value,\
  \ 3); };\n }\n\n int main(int argc, const char *[])\n {\n   return bind_3(std::plus<>{})(argc);\n\
  \ }\n```\n\n图 122. 仅使用 lambda，没有标准库封装器。\n\n| ![](img/leanpub_pencil.png) |  \n\n\
  ## 练习：观察 std::bind_front, std::bind_back\n\n|\n\n```cpp\n #include <functional>\n\
  \n [[nodiscard]] constexpr auto bind_3(auto func)\n {\n   return std::bind_back(func,\
