  # 57: 使用 Lippincott 函数\n\n参数与去模板化 相同。这是一个用于对你的代码进行去模板化的 Lippincott 函数。\n\n如果你有许多不同的异常类型，你可能会有这样的代码：\n\
  \n```cpp\n1 void some_function() {\n2   try {\n3     do_something();\n4   } catch\
  \ (const exception_type1&) {\n5     // ...\n6   } catch (const exception_type2&)\
  \ {\n7     // ...\n8   }\n9 }\n```\n\n图 116. 异常处理。\n\n这种技术并不是新的——从 C++98 起就有了。\n\
  \n```cpp\n1 void some_function() {\n2   try {\n3     do_something();\n4   } catch\
  \ (const exception_type1&) {\n5     // ...\n6   } catch (const exception_type2&)\
  \ {\n7     // ...\n8   }\n9 }\n```\n\n图 117. 异常处理。\n\n| ![](img/leanpub_pencil.png)\
  \ |\n\n## 练习：你使用异常吗？\n\n如果你的项目使用异常，那么就有某些地方需要集中处理。如果不使用异常，那么你可能有其他重复的类型。\n\n## 57.1:\
  \ 资源\n\n* [C++ Secrets：使用 Lippincott 函数](https://cppsecrets.blogspot.com/2013/12/using-lippincott-function-for.html)\n\
  * [C++ Weekly Ep 91: Lippincott 函数](https://youtu.be/-amJL3Ay)\n\n# 58: 不再需要 new！\n\
  \n你已经在避免堆内存 并使用智能指针进行资源管理了，对吧？！\n\n更进一步，在需要堆内存的极少数情况下使用 `std::make_unique<>>(https://en.cppreference.com/w/memory/unique_ptr/make_unique)\
  \ (C++14)。\n\n在需要共享权的极少数情况下，使用 `std::make_shared<>>(https://en.cppreference.com/w/memory/shared_ptr/make_shared)\
  \ (C++11)。\n\n| ![](img/leanpub_pencil.png) |\n\n## 练习：你使用 Qt 或其他组件库吗？\n\n你考虑过编写自己的\
  \ `make_qobject` 辅助函数吗？赋予它需要的 `[[nodiscard]]`。\n\n在任何情况下，你都可以 `new` 的使用限制在少数核心库函数上。\n\
