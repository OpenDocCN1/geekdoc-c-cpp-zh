    # A.1 C++ extensions for Concepts and ISO C++ 2014


    [diff.iso]


    1 This clause lists the differences between C++ with Concepts and ISO C++, by
    the chapters of this document.


    # A.1.1 Clause 2: lexical conventions


    [diff.lex]


    # 2.1 New Keywords


    **Change:** New keywords are added to C++ extensions for Concepts; see 2.1.


    **Rationale:** These new keywords were added in order to implement the semantics
    of the new features. In particular, the **requires** keyword is added to introduce
    constraints through a *requires-clause* or a *requires-expression*. The **concept**
    keyword is added to enable the definition of concepts (7.1.7), the normalization
    of constraints (14.10.2), and the semantic differentiation of *concept-names*
    from other identifiers.


    **Effect on original feature:** Change to semantics of well-defined feature. Any
    C++ programs that used any of these keywords as identifiers are not valid C++
    programs with Concepts.


    **Difficulty of converting:** Syntactic transformation. Converting one specific
    program is easy. Converting a large collection of related programs takes work.


    **How widely used:** Seldon.'
