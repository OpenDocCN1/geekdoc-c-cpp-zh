- pgno: 61
  md: '# # British Standards Institution (BSI)


    BSI is the national body responsible for preparing British Standards and standards-related
    publications, information and services.


    BSI is incorporated by Royal Charter. British Standards and other standardization
    products are published by BSI Standards Limited.


    # ## About us


    We bring together business, industry, government, consumers, innovators and others
    to share their combined expertise and experience into standards-based solutions.


    The knowledge embodied in our standards has been carefully assembled in a dependable
    format and refined through our open consensus process. Organizations of all sizes
    and across all sectors help them achieve their goals.


    # ## Information on standards


    We can provide you with the knowledge that your organization needs to succeed.
    Find out more about British Standards by visiting our website at bishop, or contacting
    our Customer Services team at


    # ## Buying standards


    You can download PDF versions of BSI publications, including British and adopted
    European and international standards, through our website at bishop, where hard
    copies can also be purchased.


    If you need specific or foreign standards from the British Standards Development
    Organizations, hard copies can be ordered from our Customer Services team.


    # ## Subscriptions


    Our range of subscriptions are designed to make standards easier for you. For
    further information on our subscription products go to


    With British Standards Online (BSO) you''ll have access to over 55,000 British
    and adopted European international standards from your desktop. It''s an easy
    way to stay up to date with the latest data and standards.


    PLUS is an updating service exclusive to BSI Subscription Members. You will automatically
    receive the latest hotlink standards when they''re released or revised.


    To find out more about becoming a BSI Subscription Member and the benefits of
    membership, visit bsi.com/shop.


    With a Multi-User Licence (MUNL) you''re able to host standards across your organisation.
    Licenses can cover as few or as many users as you wish. With updates supplied
    as soon as they''re available, you can be sure of your documentation is current.
    For further information, email bsimusales@bsigroup.com.


