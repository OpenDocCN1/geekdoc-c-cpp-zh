    # 14.10.7  Exception constraints


    An exception constraint is a constraint for an expression E that is satisfied
    if and only if the exception no(E) is true (5.3.7). [Note: Exception constraints
    are introduced by a compound-requirement that includes the specifier (5.1.4.3).
    — end note]


    An exception constraint is equivalent to another exception constraint B if and
    only if the expressions of A and B are equivalent using the rules described in
    14.6.6.1 to compare expressions.


    # 14.10.8  Parameterized constraints


    A parameterized constraint is a constraint that defines a sequence of parameters
    (8.3.5), constraint variables, and has a single operand. [Note: Parameterized
    constraints are introduced by requires-expressions (5.1.4). The constraint variables
    of a parameterized constraint correspond to the parameters in the requirement-list
    of a requires-expression, and the operand of the conjunction of constraints. —
    end note] [Note: Parameterized constraints have no corresponding C++ syntax. For
    the purpose of exposition, a parameterized constraint is written as, e.g., λ(x
    y) where x and y are constraint variables, and P(x,y) is the constraint''s operand
    in terms of x and y. — end note] [Example]:


    The concept Eq defines the parameterized constraint λ(T a, T b) P(a,b) where P(a,b)
    is the constraint that a == b and a! must be valid expressions (14.10.1.3). —
    end example


    A parameterized constraint is satisfied if and only if substitution into its constraints
    results in an invalid type, and the operand is satisfied. Template arguments are
    substituted into the declared constraint variables in the order in which they
    are declared. If substitution into a constraint variable fails, no more substitutions
    are performed, and the constraint is not satisfied.


    Two parameterized constraints A and B are equivalent if and only if they are equivalent.
    Two expressions involving constraint variables are equivalent if they are equivalent
    according to the rules for expressions described in 14.6.6.1, except that any
    identifiers referring to constraint variables are equivalent if and only if their
    types of corresponding declarations are equivalent (14.4).


    A constraint should not appear as an evaluated operand (5) of a predicate constraint
