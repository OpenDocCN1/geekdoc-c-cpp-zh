  md: '# PD ISO/IEC TS 19217:2015

    ISO/IEC TS 19217:2015(E)

    N4549


    There is a syntactic ambiguity when an ellipsis occurs at the end of a parameter-declaration-clause
    without a preceding comma. In this case, the ellipsis is parsed as part of the
    abstract-declarator the type of the parameter names a template pack that has not
    been expanded or contains a placeholder (7.1.6.4); otherwise, it is parsed as
    part of the parameter-declaration-clause.


    Add the following after paragraph 15:


    An abbreviated function template is a function declaration whose parameter-type-list
    includes one or more placeholders (7.1.6.4). An abbreviated function template
    is equivalent to a template template-parameter-list includes one invented template-parameter
    for each occurrence of a placeholder in the parameter-declaration-clause, in order
    of appearance, according to the rules. Note: Template parameters are also invented
    to deduce the type of a variable or the return type of a function whose declared
    type contains placeholders (7.1.6.4.1).


    Each template parameter is invented as follows:


    +   If the parameter is designated by the auto type-specifier, then the invented
    template parameter is a type template.


    +   Otherwise, if the parameter is designated by a constrained-type-specifier,
    and the invented parameter is a constrained-parameter (14.1) whose qualified-concept-name
    is that of the constrained-type-specifier.


    +   If the placeholder appears in the decl-spec-seg of a function parameter (14.6.3),
    or the type-spec-seg of a type-id that is a pack expansion, the invented template
    parameter is a template parameter pack.


    All placeholders designated by constrained-type-specifiers whose corresponding
    constrained-parameters would introduce constraint-expressions (14.1), using the
    rules for using expressions in 14.6.1, have the same invented template parameter.
    Example:


    ```

    namespace N {

    template<typename> concept bool C = true;

    template<typename> concept bool D = true;

    template<typename, int> concept bool G = true;

    template<typename, int = 0> concept bool E = true;

    }

    void abbr(C a, D<0>);

    ```


    The constrained-type-specifiers C and D<0> correspond to distinct invented template
    parameter in the declaration of abbr.


    void f0(C a, C b);


    The types of a and b are the same invented type parameter.


    void f1(C* a, C* b);


    The type of a is a reference to an invented template type parameter T, and the
    type of b is a pointer to T.


    ```

    void f2(T::C a, C b);

    void f3(D<0> a, D<1> b);

    ```


    In both functions, the a and b have different invented template type parameters.


    § 8.3.5


    22'
