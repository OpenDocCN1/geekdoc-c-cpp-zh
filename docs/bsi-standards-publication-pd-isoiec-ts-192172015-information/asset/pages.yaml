- pgno: 10
  md: "# PD ISO/IEC TS 19217:2015\nISO/IEC TS 19217:2015(E)\n\nN4549\n\n# 5 Expressions\
    \ [expr]\n\nModify paragraph 8 to include a reference to requires-expressions.\n\
    \n+   In some contexts, unevaluated operands appear (5.1.4, 5.2.8, 5.3.3, 5.3.7).\n\
    \n# 5.1 Primary expressions [expr.prim]\n\n# 5.1.1 General [expr.prim.general]\n\
    \nIn this section, the requires-expression to the rule for primary-expression.\n\
    \n```\nprimary-expression:\nliteral\n( expression )\nid-expression\nlambda-expression\n\
    fold-expression\nrequires-expression\n```\n\nIn paragraph 8, add auto and constrained-type-name\
    \ to nested-name-specifier:\n\n```\nnested-name-specifier:\n::\ntype-name ::\n\
    namespace-name ::\ndectype-specifier ::\nauto ::\nconstrained-type-name ::\nnested-name-specifier\
    \ identifier ::\nnested-name-specifier template_opt\n```\n\nAdd a new paragraph\
    \ after paragraph 11:\n\nIn a nested-name-specifier of the form auto:: or C::\
    \ where C is a constrained-type-name, nested-name-specifier designates a placeholder\
    \ that will be replaced later according to the rules for placeholder deduction\
    \ in 7.1.6.4. If a placeholder designated by a constrained-type-specifier is not\
    \ a placeholder, the program is ill-formed.[Note: A constrained-type-specifier\
    \ can designate a placeholder for a non-type or template (7.1.6.4). -- end note]\
    \ The replacement type for a placeholder should be a class or enumeration type.\
    \ [Example:\n\n```\ntemplate<typename T> const bool B = sizeof(T) == sizeof(int);\n\
    tint const B = true;\n```\n\n```\nstruct S1 { int n; };\nstruct S2 { char c; };\n\
    struct S3 { struct X { using Y = int; }; };\n```\n\n```\nint auto:* p1 = &S1::n;\
    \ // auto deduced as S1\n D:* p2 = &S1::n; // error: D does not designate a placeholder\
    \ type\n C::* p3 = &S1::n; // OK: C deduced as S1\nchar C::* p4 = &S2::c; // error:\
    \ deduction fails because constraints are not satisfied\n```"
