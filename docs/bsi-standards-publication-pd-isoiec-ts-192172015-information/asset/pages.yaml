- pgno: 14
  md: "# PD ISO/IEC TS 19217:2015\nISO/IEC TS 19217:2015(E)\n\nN4549\n\nused as notation\
    \ for the purpose of defining requirements. The parameter-declaration-clause of\
    \ a\nrequirement-parameter-list shall not terminate with an ellipsis. [Example:\n\
    \n```\ntemplate<typename T>\nconcept C1() {\n  requires(T, t ) { t; }; // error:\
    \ terminates with an ellipsis\n```\n\n```\ntemplate<typename T>\nconcept C2()\
    \ {\n  requires(T, void (*p)(T, ...)) // OK: the parameter-declaration-clause\
    \ of\n  // the requires-expression does not terminate\n  { p(t); }\n} // with\
    \ an ellipsis\n```\n\n+   - example\nThe requirement-body is comprised of a sequence\
    \ of requirements. These requirements may refer\nto local parameters, template\
    \ parameters, and any other declarations visible from the enabling\ncontext. Each\
    \ requirement asserts a constraint (14.10) to the conjunction of constraints defined\b\
    y the requires-expression. Constraints are assessed in the order in which they\
    \ are written.\n\n+   - The substitution of template arguments into a requires-expression\
    \ may result in the formation\nof invalid types or expressions in its requirements.\
    \ In such cases, the constraints corresponding\nto requirements are not satisfied;\
    \ it does not cause the program to be formed. If the\nubstitution of template\
    \ arguments into a requirement would always result in a substitution\nfailure,\
    \ the program is ill-formed; no diagnostic reported. [Example:\n\n```\ntemplate<typename\
    \ T> concept C =\nrequires {\n  new int-[size_tof(T)]; // ill-formed, no diagnostic\
    \ required\n};\n```\n\n+   - example\n5.1.4.1 Simple requirements [expr.prim.req.simple]\n\
    \nsimple-requirement:\nexpression;\n\nA simple-requirement introduces an expression\
    \ constraint (14.10.1.3) for its expression. [Note:\n expression constraint asserts\
    \ the validity of an expression. end note]\n[Example:\n\n```\ntemplate<typename\
    \ T> concept B =\nrequires (T a, b) {\n  a + b; // an expression constraint for\
    \ a + b\n```\n\n+   - example\n5.1.4.2 Type requirements [expr.prim.req.type]\n\
    \ntype-requirement: nested-name-specifier_opt type-name;\n\nA type-requirement\
    \ introduces a type constraint (14.10.1.4) for the type named by its optional\n\
    nested-name-specifier and type-name. [Note: A type requirement asserts the validity\
    \ of an\nassociated type, either as a member, a template specialization, or an\
    \ alias template.\nIt is not used to specify requirements for arbitrary type-specifiers.\
    \ end note] [Example:\n\n5.1.4.2 8"
