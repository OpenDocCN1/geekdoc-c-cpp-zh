    # 14.10 Partial ordering by constraints


    A constraint P is to subsum another constraint Q if, it can be determined that
    P implies up to the value of expressions in P and Q. [Example: Substitution does
    not determine if the predicate N > 0 (14.10.2) subsumes U > 0 for some template
    argument U] — end example


    In order to determine if a constraint P subsumes a constraint Q, transform P into
    disjunctive normal form, and Q respectively. Parameterized constraints may appear
    in conjunctive or disjunctive normal forms. For the purpose of this transformation,
    the constraint λ(T x) P(x) is equivalent to the constraint P(x). Then, P subsumes
    Q if and only if


    +   - for every disjunctive clause Pi, in the disjunctive normal form of P, Pi
    subsumes every conjunctive clause in the conjunctive normal form of Q, where

    - a disjunctive clause Pi subsumes a conjunctive clause Qj if and only if each
    atomic constraint Pi subsumes any atomic constraint Qj

    - an atomic constraint A subsumes another atomic constraint B if and only if the
    A and B are equivalent using the rules defined in 14.10.1 to compare constraints.


    > Example: Let A and B be atomic constraints (14.10.1.2). The constraint A ∧ B
    subsumes A, but A does not subsume A ∧ B. The constraint A ∨ B subsumes A, but
    A ∨ B does not subsum B. Also note that each constraint subsumes itself. — end
    example


    The subsum relation relation defines a ordering on constraints. This partial ordering
    is used to determine


