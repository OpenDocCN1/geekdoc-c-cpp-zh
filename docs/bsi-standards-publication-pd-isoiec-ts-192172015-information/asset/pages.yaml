- pgno: 11
  md: "# PD ISO/IEC TS 19217:2015\nISO/IEC TS 19217:2015(E)\n\nN4549\n\n```\nvoid\
    \ f(typename auto : <X:Y>);  // error: auto cannot be deduced from Si1\nf(S<1>());\
    \ // OK\nf<S<3>>(O); // OK\n```\n\nIn the declaration of f, the placeholder f\
    \ are satisfied even though f is a non-deduced context (14.8.2). It may be replaced\
    \ later through the explicit specification of template arguments. — end example\n\
    \nAdd a new parameter after paragraph 13\n\nA program that refers explicitly or\
    \ implicitly to a function with associated constraints that are not satisfied\
    \ (14.10.2), other than to declare, is ill-formed. [Example]:\n\n```\nvoid f()\
    \ requires false;\n\nf0(); // error: cannot call f\nvoid (*p1)(int) = f; // error:\
    \ cannot take the address of f\ndectype(f) p2 = nullptr; // error: type decltype(f)\
    \ is invalid\n```\n\nIn each case the associated constraints of f are not satisfied.\
    \ In the declaration of p2, constraints are required to be satisfied even an unvaluated\
    \ expression (Clause 5).\n\n# 5.1.2 Lambda expressions\n\n[expr.prim.lambda]\n\
    \nInsert the following after paragraph 4 to define the \"generic lambda\".\n\n\
    > A generic lambda is a lambda-expression where one or more placeholders (7.1.6.4)\
    \ appear in the parameter-type-list of the lambda-declarator.\n\nModify paragraph\
    \ 5 so that the meaning of a generic lambda is defined in terms of its abbreviated\
    \ member function call operator\n\nThe closure for a non-generic lambda-expression\
    \ has a public inline function call operator (13.5.4) which return the lambda-expression's\
    \ parameter-declaration-clause and trailing-return-type, respectively. For a generic\
    \ lambda, the closure consists of one type template for each occurrence of auto\
    \ in the lambda's parameter-template-declaration-clause, in order of appearance.\
    \ The inventype template parameter is a pack if the lambda has more than one auto\
    \ in its parameter-type (8.5.5).\n\nThe return type and function parameters of\
    \ the function call operator are derived from the lambda-expression's return-type\
    \ and parameter-declaration-clause by replacing each occurrence of auto in the\
    \ decl-specifiers of the parameter-declaration-clause. The closure for\n\na generic\
    \ lambda has a public inline template that is an abbreviated function template\
    \ with parameters and return type derived from the lambda-expression's parameter-declaration-clause\
    \ and trailing-return-type respectively.\n\nAdd the following after these paragraph\
    \ in the C++ Standard.\n\n[Example]:\n\n```\ntemplate<typename T> concept bool\
    \ C = true;\n\nauto g = (C& a, C* b) { *a = b; }; // OK: denotes a generic lambda\n\
    ```\n\n```\nstruct Fun {\n    auto operator()(C& a, C* b) const { *a = b; }\n\
    };\n```\n\n§ 5.1.2"
