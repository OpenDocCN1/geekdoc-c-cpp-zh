- pgno: 35
  md: '# PD ISO/IEC TIS 19217:2015

    ISO/IEC TS 19217:2015(E)


    If X is a non-type-parameter, the declared parameter is a non-type template-parameter
    having the same type as X.


    If X is a template-parameter, the declared X is a template-parameter having the
    same type template-list as X, excluding default template-arguments.


    If the qualified-name is followed by an ellipsis, the declared parameter is a
    template parameter pack (14.6.3).


    [Example]:

    ```cpp

    template<typename T> bool C1 = true;

    template<typenametype> class X bool C2 = true;

    template<int N> concept C3 = true;

    template<typename...> bool C4 = true;

    template<...> concept C5 = true;

    ```


    ```

    template<C1> void f1();    // OK if T is a type-parameter

    template<C2> void f2();    // OK if X is a template with one type-parameter

    template<C3> void f3();    // OK if N has int

    template<C4...> T void f4();(); // OK if Ta is a template parameter pack of types

    template<C5> T void f5(); // OK if T is a type-parameter

    template<C5...> Cs = f6(); // OK if Cs is a template parameter pack of chars

    ```


    A constrained-parameter introduces a constraint-expression (14.10.2). The expression
    is derived from the qualified-name Q in the constrained-parameter, its designated
    concept C, and its default-argument matches the declared parameter P.


    +   First, if a template argument A from P. If P declares a template parameter
    pack (14.6.3) and C is a variadic concept (7.1.7), then A is the pack expansion
    P.... Otherwise, A is the id-expression P.


    +   Then, if a template-id TT on the constrained-name Q. If Q is a concept-name,
    then TT is C<A>. Otherwise, Q is a partial-concept-id of the form C<A1, A2, ...,
    AN>, and TT is C<A, A1, A2, ..., AN>.


    +   Then, an expression E as follows. If C is a variadic concept (7.1.7), then
    E is the id-expression TT. Otherwise, E is the function call TT.


    +   Finally, if P declares a template parameter pack and C is not a variadic concept,
    E is adjusted to the fold-expression (E & ...). (5.1.3).


    E is the introduced constrained-expression. Example:

    ```cpp

    template<typename> bool C1 = true;

    template<typename...> T, typename concept C2() { return true; };

    template<typename> T concept C3 = true;

    ```


    ```

    template<C1> T struct s1; // associates C1<T>

    template<C1...> T struct s2; // associates C1<T> & ...

    template<C2...> T struct s3; // associates C2<T...>()

    template<C3<int>> T struct s4; // // associates C3,T, int

    ```


    [end example]


    Insert the following paragraph after paragraph 9 to require that the kind of default-argument
    matches the kind of its constrained-parameter.


    § 14.1


    29'
