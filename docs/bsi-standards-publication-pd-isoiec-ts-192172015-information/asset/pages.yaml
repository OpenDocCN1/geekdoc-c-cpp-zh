    \ the following paragraphs after paragraph 6.\n\nA template-declaration is written\
    \ in terms of its template parameters. These parameters are declared explicitly\
    \ in a template-parameter-list (14.1), or are introduced by a template-introduction\
    \ (14.2). The optional requires-clause following a template-parameter-list allows\
    \ the specification of constraints (14.10.2) on template arguments (14.4).\n\n\
    # 14.1 Template parameters\n\n```\ntemplate-parameter:\n  type-parameter\n  parameter-declaration\n\
    \  constrained-parameter:\n    qualified-name ... identifier_opt\n    qualified-concept-name\
    \ identifier_opt default-template-argument_opt\ndefault-template-argument:\n \
    \ = type-id\n  = id-expression\n  = initializer-clause\n```\n\nIn paragraph 1,\
    \ extend the grammar for template parameters to constrained template parameters.\n\
    \nInsert a new paragraph after paragraph 1.\n\nThere is an ambiguity in the syntax\
    \ of a template parameter between the declaration of a constrained-parameter and\
    \ a parameter-declaration. If the type-spec of a parameter-declaration is a constrained-type-specifier\
    \ (7.1.6.4), then the template-parameter is a constrained-parameter.\n\nInsert\
    \ the following paragraphs after paragraph 8. These paragraphs define the meaning\
    \ of a constrained template parameter.\n\nA constrained-parameter declares a template\
    \ parameter whose kind (type, non-type, template) and type match that of the prototype\
    \ parameter of the concept designated by the qualified-concept-name (7.1.6.4.2)\
    \ in the constrained-parameter. The designated concept is selected by the rules\
    \ for concept resolution resolved in 14.10.4. Let X be the prototype parameter\
