    # PD ISO/IEC TS 19217:2015

    ISO/IEC TS 19217:2015(E)


    N4549


    2


    Constraints can be associated with a declaration through use of template-introductions,
    constrained-parameters in a template-parameter-list, and constrained-type-specifiers
    in the parameter-type-list of a function template. Each of these forms introduces
    constraint-expressions that are used to constrain the declaration. A template''s
    associated constraints are defined as a single constraint-expression derived from
    the constrained-expressions using the following rules:


    (2.1)


    If there are no constrained-expressions, the declaration is unconstrained.


    (2.2)


    If there is a single constrained-expression, that is the associated constraint.


    (2.3)


    Otherwise, the associated constraints are formed as a logical AND expression (5.14)
    where operands are in the following order:


    +   - the constraint-expression introduced by a template-introduction (14.2),
    and


    +   - the constraint-expression introduced by each constrained-parameter (14.1)
    in the declaration-parameter-list, in order of appearance), and


    +   - the constraint-expression introduced by a requires-clause following a template-parameter-list
    (Clause 14), and


    +   - the constraint-expression introduced by each constrained-type-specifier
    (7.1.6.2) in the type of a parameter-declaration in a function (8.3.5) in order
    of appearance, and


    +   - the constraint-expression introduced by a requires-clause (Clause 8) of
    a function declaration (8.3.5).


    The associated constraints for a template declaration establishes the order in
    which the normalized constraints (defined below) will be for comparison (to determine
    when one replaces another), and the order in which constraints are instantiated
    when checking for satisfaction (14.10.1). The constraint-expressions introduced
    by constrained-type-specifiers in a variable type or in the return type of a function
    are not included in the associated constraints of the declaration. [Note: These
    constraints are checked during the instantiation of the declaration.—end note]
    A program containing two declarations whose associated constraints are functionally
    equivalent but not equivalent (14.6.6.1) is ill-formed, requiring diagnostic required.
    [Example]:


