- pgno: 15
  md: "# PD ISO/IEC TS 19217:2015\nISO/IEC TS 19217:2015(E)\n\nN4549\n\n```\ntemplate<typename\
    \ T> struct S ( );\ntemplate<typename T> using Ref = T;;\n\ntemplate<typename\
    \ T> concept bool C =\nrequires (\n    typename T::inner; // nested member name\n\
    \    typename S<T>; // nested class template specialization\n    typename Ref<T>;\
    \ // alias template substitution\n);\n\n// end example\n```\n\n# 5.1.4.3 Compound\
    \ requirements\n\n```\ncompound-requirement:\n{ expression } noexcept_opt trailing-return-type_opt\
    \ ;\n```\n\nA compound-requirement introduces a conjunction of one or more constraints\
    \ for the expression E. The order in which these constraints are introduced is:\n\
    \n+   (1.1) the compound-requirement introduces an expression constraint for E\
    \ (14.10.1.3);\n(1.2) if the noexcept specifier is present, the compound-requirement\
    \ appends an exception constraint for E (14.10.1.7);\n(1.3) if the trailing-return-type\
    \ is present, the compound-requirement appends one or more constraints derived\
    \ from the type T by the trailing-return-type:\n(1.3.1) if T contains one or more\
    \ placeholders (7.1.6.4), the requirement adds a deduction constraint (14.10.1.6)\
    \ of Against the type T;\n(1.3.2) otherwise, the requirement appends two constraints:\
    \ a type constraint on the formation of T (14.10.1.4) and an implicit conversion\
    \ constraint from E to T (14.10.1.5).\n\n```\n*Example:\ntemplate<typename T>\
    \ concept bool C1 =\nrequires(T x) {\n    (++);\n};\n```\n\nThe compound-requirement\
    \ in C1 introduces an expression constraint for x++. It is equivalent to a simple-requirement\
    \ with the same expression.\n\n```\ntemplate<typename T> concept bool C2 =\nrequires(T\
    \ x) {\n    (*x);\n};\n```\n\nThe compound-requirement in C2 introduces three\
    \ constraints: an expression constraint for *x, a type constraint on T::inner,\
    \ and a conversion constraint requiring *x to be implicitly convertible to T::inner.\n\
    \n```\ntemplate<typename T> concept bool C3 =\nrequires(T x) {\n    {g(x)} noexcept;\n\
    };\n```\n\nThe compound-requirement in C3 introduces two constraints: an expression\
    \ constraint for g(x) and an exception constraint for g(x).\n\n§ 5.1.4.3"
  merge: -1
  img_proc: true
- pgno: 16
  md: "# PD ISO/IEC TS 19217:2015\nISO/IEC TS 19217:2015(E)\nN4549\n\n```\ntemplate<typename\
    \ T> concept bool C() { return true; };\n```\n\n```\ntemplate<typename T> concept\
