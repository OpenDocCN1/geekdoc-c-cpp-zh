- pgno: 12
  md: "# PD ISO/IEC TS 19217:2015\nISO/IEC TS 19217:2015(E)\n\nN4549\n\nC is a constrained-type-specifier,\
    \ signifying that the lambda is generic. The generic lambda g1 and the function\
    \ object fun have equivalent behavior when called with the same arguments.— end\
    \ example]\n\n# 5.1.3 Fold expressions\n\n[expr.prim.fold]\n\nAdd this to 5.1.2.\n\
    \n+   A fold expression performs a template parameter pack (14.6.3) over a binary\
    \ operator.\nfold-expression:\n( cast-expression fold-operator ... )\n( fold-operator\
    \ cast-expression ...)\n( cast-expression fold-operator ... fold-expression ...)\n\
    fold-operator: one of\n+ = / % % & & << >>\n- += *= /= %=&= |= >>==\n! != < >\
    \ >= && | | .+ ->*\n\n+   An expression of the form (e op) where op is a fold-operator\
    \ is called a unary left fold.\nAn expression of the form (e op op) where op is\
    \ a fold-operator is called a unary right fold.\nUnary left folds and unary right\
    \ folds are collectively called unary folds. In a binary fold, the left fold.\
    \ If e2 contains an unexpanded parameter pack, e1 shall contain an unexpanded\
    \ parameter pack, but not both. If e1 contains an unexpanded parameter pack, the\
    \ expression is called a binary left fold. If e2 contains an unexpanded parameter\
    \ pack, the expression is called a binary right fold.\n\n+   An expression of\
    \ the form (e1 op1 op2) where op1 and op2 are fold-operators is called a binary\
    \ left fold. In a binary fold, op1 and op2 shall be the same fold-operator, and\
    \ either e1 contains an unexpanded parameter pack or e2 shall contain an unexpanded\
    \ parameter pack.\nExample:\n\n```\ntemplate<typename ...Args>\nbool f(Args ...\
    \ &args) {\n    return (args & & & args); // OK\n}\n\ntemplate<typename ...Args>\n\
    bool f(Args ... &args) {\n    return (args * + args); // error: both operands\
    \ contain unexpanded parameter packs\n}\n```\n\n— end example]\n\n# 5.1.4 Requires\
    \ expressions\n\n[expr.prim.req]\n\nAdd this to 5.1.\n\n+   A requires-expression\
    \ provides a concise way to express requirements on template arguments. A requirement\
    \ that one can be checked by name lookup (3.4) or by checking properties of types\
    \ and expressions."
  merge: -1
  img_proc: true
- pgno: 13
  md: "# PD ISO/IEC TS 19217:2015\nISO/IEC TS 19217:2015(E)\n\n```\nrequires-expression:\n\
    \  requires requirement-parameter-list_opt requirement-body\n  requirement-clause-list:\n\
    \    ( parameter-declaration-clause_opt )\n  requirement-body:\n    { requirement-seq\
    \ ? }\n  requirement-seq:\n    requirement\n    requirement-seq requirement\n\
    \  requirement:\n    simple-requirement\ntype-requirement\n    compound-requirement\n\
    \    nested-requirement\n```\n\n2 A-expression defines a constraint (14.10) based\
    \ on its parameters (if any) and nested requirements.\n\n3 A-expression has type\
    \ bool and is unevaluated (5). [Note: A requires-expression is transformed into\
    \ a constraint in order to determine if it is satisfied (14.10.2) — end note]\n\
    \n4 A requires-expression shall appear only within a concept definition (7.1.7),\
    \ or within the requires-clause of a template-declaration (Clause 14) or function\
    \ declaration (8.3.5). [Example: A common use of requires-expression is to define\
    \ requirements in concepts such as the one below:\n\n```\ntemplate<typename T>\n\
    concept bool R() {\n  requires (T i) {\n    typename T::;\n    (*) -> const T::type&;\n\
    \  }\n```\n\nA requires-expression can also be used in a requires-clause as a\
    \ writing of ad hoc constraints on template arguments such as the one below:\n\
    \n```\ntemplate<typename T>\nrequires (T x) { x + x; }\nTadd(T a, T b) { return\
    \ a + b; }\n```\n\nThe first introduces the requires-clause, and the second introduces\
    \ the requires-expression. [Note: Such requirements can also be written by defining\
    \ them within a concept.\n\n```\ntemplate<typename T>\nconcept C = requires (T\
    \ x) { x + x; }\n```\n\n```\ntemplate<typename T>\nrequires (T a, T b)\nTadd(T\
    \ a, T b) { return a + b; }\n```\n\n> - end note\nA requires-expression may introduce\
    \ local parameters using a parameter-declaration-clause (8.3.5). A local parameter\
    \ of a requires-expression shall not have a default argument. Each name introduced\
    \ by a local parameter is in scope from the point of its declaration until the\
    \ closing brace of the requirement-body. These parameters have no linkage, storage,\
    \ or lifetime; they are only\n\n§ 5.1.4\n\nN 459"
