    # 附录 A（信息）

    兼容性


    ## A.1 Concepts 和 ISO C++ 2014 的 C++ 扩展


    1 本节按章节列出了带有 Concepts 的 C++ 与 ISO C++ 之间的差异。


    ### A.1.1 第 2 节：词法约定


    ## 2.1 新关键字


    **更改：** 在 Concepts 的 C 扩展中添加了新关键字；见 2.1。


    **理由：** 添加这些新关键字是为了实现新功能的语义。特别是，添加了 **requires** 关键字以便通过 *requires 子句*（requires-clause）或
    *requires 表达式*（requires-expression）引入约束。添加了 **concept** 关键字以便定义概念（7.1.7）、约束的规范化（14.10.2）以及*概念名*与其他标识符的语义区分。


    **对原始功能的影响：** 修改了定义功能的语义。任何使用这些关键字作为标识符的 C++ 程序都不是带有 Concepts 的有效 C++ 程序。


    **转换难度：** 语法转换。转换一个特定的程序很容易。但转换大量相关程序需要一些工作。


    **使用广泛程度：** Seldon。


