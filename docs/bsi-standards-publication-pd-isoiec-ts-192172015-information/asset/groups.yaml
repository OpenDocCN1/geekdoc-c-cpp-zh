    # PD ISO/IEC TS 19217:2015

    ISO/IEC TS 19217:2015(E)


    N4549


    # [intro]


    # 1 General


    # 1.1 Scope


    [intro.scope]


    This Technical Specification describes extensions to the C++ Programming Language
    (1.2) that enable the specification and checking of constraints on template arguments,
    and the ability to overload specialize class templates based on those constraints.
    These extensions introduce new syntactic forms and modifications to existing language
    semantics.


    The International Standard, ISO/IEC 14882, provides important context and specification
    for this Technical Specification. Instructions to modify or add arguments are
    written as explicit instructions. Modifications to modify existing text from the
    International Standard underlining to represent added text and striethrough to
    represent deleted text.


    WG21 paper N419 defines “fold expressions”, which are used to define constraint
    expressions from the use of constrained parameter packs. This feature is not present
    in ISO/IEC 14882:2014, but it is planned to be included in the next revision of
    International Standard. The specification of such feature is included in this
    document.


    # 1.2 Normative references


    [intro.refs]


    The following references are indispensable for the application of this document.
    For cited references, the only cited edition applies. For updated references,
    the latest edition of the referenced document (including any amendments) applies.


    +   (1.1) ISO/IEC 14882:2014, Programming Languages—C++


    ISO/IEC 14882:2014 is hereafter called the C++ Standard. The numbering of Clauses,
    sections, and paragraphs in this document reflects the numbering in the C++ Standard.
    References to Clauses and sections not appearing in this Technical Specification
    refer to the original, unmodified text in the C++ Standard.


    # 1.3 Terms and definitions


    [intro.defs]


    Modify the definitions of “signature” to include associated constraints (14.10.2).
    This allows different translation units to contain definitions of functions with
    the same signature, excluding associated constraints, without violating the constraints
    in the signature, such functions would have the same mangled name, appearing as
    multiple definitions of the same function.


    # 1.3.1 signature


    [defs.signature]


    <template> name, parameter type list (8.3.5), and enclosing namespace (if any),
    and any associated constraints (14.10.2)


    > [Note: Signatures are used as a basis for name mangling and linking. — end note]


    # 1.3.2 signature


    [defs.signature.templ]


    <template> name, parameter type list (8.3.5), and enclosing namespace (if any),
    return type, and template parameter list, and any associated constraints (14.10.2)


    # 1.3.3


    [defs.signature.member]'
