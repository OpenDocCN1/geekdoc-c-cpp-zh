    # 14.10.1 Constraints


    [temp.constr.constr]


    A constraint is a sequence of logical operations and operands that specifies requirements
    on template arguments. [Note: The operands of logical operation are constraints.
    — end note] There are different kinds of constraints:


    +   (1.1) conjunctions (14.10.1.1),

    (1.2) disjunctions (14.10.1.1),

    (1.3) predicate constraints (14.10.1.2),

    (1.4) expression constraints (14.10.1.3),

    (1.5) type constraints (14.10.1.4),

    (1.6) implicit conversion constraints (14.10.1.5),

    (1.7) argument deduction constraints (14.10.1.6),

    (1.8) exception constraints (14.10.1.7),

    (1.9) parameterized constraints (14.10.1.8)


    For a constraint to be instantiated (14.8), its associated constraints shall be
    satisfied (14.10.2). [Note: The satisfaction of constraints on class templates,
    alias templates, and variables is required when referring to a template specification
    (14.3). The satisfaction of constraints on functions and template functions is
    required during overload resolution (14.3.2). The satisfaction of constraints
    introduced by constraint-type-specifiers (7.1.6.4.2) in the type of a variable
    or declared return type is required when valued for their corresponding placeholders
    of template arguments (7.1.6) — end note] Determining if a constraint is satisfied
    entails the substitution of template arguments for that constraint. The rules
    for determining the satisfaction of different kinds of constraints are defined
    in the following subsections:


    When one declaration is more specialized than another requires knowing when two
    constraints are equivalent (14.10.3). The rules for determining the difference
    of constraints are defined in the following subsections. Two constraints that
    are not equivalent are functionally equivalent, if for any set of template arguments,
    both constraints are satisfied or both constraints are unsatisfied.


    # 14.10.1.1 Logical operations


    [temp.constr.op]


    > There are binary logical operations on constraints: conjunction and disjunction.
    [Note: For the purpose of exposition, conjunction is satisfied using the symbol
    ∧ and disjunction is satisfied using the symbol ∨. The operands of these operations
    are called the left and right operands. In the constraint A ∧ B, A is the left
    operand, and B is the right operand. Grouping of constraints is shown using parentheses.
    — end note]


