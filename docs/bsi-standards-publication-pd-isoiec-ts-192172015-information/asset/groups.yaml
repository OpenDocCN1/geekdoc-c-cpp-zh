  mdcn: "\n\n# PD ISO/IEC TS 19217:2015\nISO/IEC TS 19217:2015(E)\n\nN4549\n\n作为一个概念，它将是该函数的唯一声明。具有概念限定符的变量定义被称为变量概念（variable\
