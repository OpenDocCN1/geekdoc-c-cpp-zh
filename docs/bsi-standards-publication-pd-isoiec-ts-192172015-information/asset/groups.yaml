    ## 14.10.1 Constraints [temp.constr]


    A constraint is a sequence of logical operations and operands that specifies requirements
    on template arguments. [Note: The operands of logical operation are constraints.
    — end note] There are different kinds of constraints:


    - (1) conjunctions (14.10.1)

    - (2) disjunctions (14.10.1)

    - (3) predicate constraints (14.10.2)

    - (4) expression constraints (14.10.3)

    - (5) type constraints (14.10.4)

    - (6) implicit conversion constraints (14.10.5)

    - (7) argument deduction constraints (14.10.6)

    - (8) exception constraints (14.10.7)

    - (9) parameterized constraints (14.10.8)


    For a constraint to be instantiated (14.8), its associated constraints shall be
    satisfied (14.10.2). [Note: The satisfaction of constraints on class templates,
    alias templates, and variables is required when referring to template specification
    (14.3). The satisfaction of constraints on functions and template functions is
    required during overload resolution (14.3.2). The satisfaction of constraints
    introduced by constraint-type-specifiers (7.6.4) in the type of a variable or
    declared return type (7.6) — end note] Determining if a constraint is satisfied
    entails the substitution of template arguments for that constraint. The rules
    for determining the satisfaction of different kinds of constraints are defined
    in the following: When one declaration is more specialized than another requires
    knowing two constraints are equivalent (14.10.3). The rules for determining the
    difference of constraints are defined in the following subsections. Two constraints
    that are not equivalent are functionally equivalent, if any set of template arguments,
    both constraints are satisfied or both constraints are unsatisfied.


