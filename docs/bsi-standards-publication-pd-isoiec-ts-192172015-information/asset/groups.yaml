    A parameterized constraint is a constraint that defines a sequence of parameters
    (8.3.5), constraint variables, and has a single operand. [Note: Parameterized
    constraints are introduced by requires-expressions (5.1.4). The constraint variables
    of a parameterized constraint correspond to the parameters in the requirement-list
