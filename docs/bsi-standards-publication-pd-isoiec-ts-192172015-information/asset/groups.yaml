    (14.10.2)、表达式约束 (14.10.3)、类型约束 (14.10.4)、隐式转换约束 (14.10.5)、参数析取 (14.10.6) 以及异常约束。表达式
    X 的范式定义如下：首先，通过将 X 中引用概念的替换替换为其对应的定义，创建一个新表达式 E。具体而言：


