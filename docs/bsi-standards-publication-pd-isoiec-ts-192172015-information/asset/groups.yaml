    > There are binary logical operations on constraints: conjunction and disjunction.
    [Note: For the purpose of exposition, conjunction is satisfied using the symbol
    ∧ and disjunction is satisfied using the symbol ∨. The operands of these operations
    are called the left and right operands. In the constraint A ∧ B, A is the left
    operand, and B is the right operand. Grouping of constraints is shown using parentheses.
    — end note]


    > A conjunction is a constraint taking two operands. A conjunction of constraints
    is satisfied if and only if both operands are satisfied. The satisfaction of a
    conjunction''s operations are evaluated left-to-right; if the left operand is
    not satisfied, template arguments are not substituted into the right operand,
    and the constraint is not satisfied. If the left and right operands of a conjunction
    of predicate constraints (14.10.2), let P and Q be the expressions of these constraints
    resulting from substitution. If the expression P && Q results in a user-declared
    operator&&, the program is ill-formed. Example:


