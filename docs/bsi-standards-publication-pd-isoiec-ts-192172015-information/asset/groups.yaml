    If X is a non-type-parameter, the declared parameter is a non-type template-parameter
    having the same type as X.


    If X is a template-parameter, the declared X is a template-parameter having the
    same type template-list as X, excluding default template-arguments.


    If the qualified-name is followed by an ellipsis, the declared parameter is a
    template parameter pack (14.6.3).


    [Example]:

    ```cpp

    template<typename T> bool C1 = true;

    template<typenametype> class X bool C2 = true;

    template<int N> concept C3 = true;

    template<typename...> bool C4 = true;

    template<...> concept C5 = true;

    ```


    ```

    template<C1> void f1();    // OK if T is a type-parameter

    template<C2> void f2();    // OK if X is a template with one type-parameter

    template<C3> void f3();    // OK if N has int

    template<C4...> T void f4();(); // OK if Ta is a template parameter pack of types

    template<C5> T void f5(); // OK if T is a type-parameter

    template<C5...> Cs = f6(); // OK if Cs is a template parameter pack of chars

