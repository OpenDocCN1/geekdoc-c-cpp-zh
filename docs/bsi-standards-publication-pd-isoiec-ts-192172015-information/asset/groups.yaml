    以及


    - 替换所有形式为 `C<A1, A2, ... AN>` 的 id-表达式，其中 C 是变量概念 D (7.1.7) 并根据约束解析规则 (14.10.4)
    替换，其结果是将 `A1, A2, ... AN` 替换到 D 的初始化器中；


