    如果一组模板参数满足了声明的关联约束，则这些关联约束被满足。


    ## 14.10 基于约束的偏序排序


    如果约束 P 涵盖（subsumes）另一个约束 Q，意味着在判断 P 是否涵盖 Q 时，它隐含了 P 和 Q 中表达式值的相等性。[示例：替换 (14.10.2)
    涵盖了某些模板参数 U] —— 示例结束


    为了确定约束 P 是否涵盖约束 Q，需将 P 和 Q 分别转换为析取标准范式。参数约束可能以合取或析取的形式出现。为了此转换，约束 `λ(T x) P(x)`
    等同于约束 `P(x)`。那么，P 涵盖 Q 当且仅当：


    - 对于 P 的析取范式中的每一个析取项 Pi，Pi 涵盖 Q 的合取范式；

    - 析取项 Pi 涵盖合取项 Q 当且仅当 Pi 是原子约束；

    - 原子约束 A 涵盖另一个原子约束 B 当且仅当 A 和 B 是等价的（14.10.1）。示例：设 A 和 B 为原子约束（14.10.1）。A 涵盖。注意每个约束涵盖自身。
    —— 示例结束


    涵盖关系定义了约束的偏序关系。这种偏序关系用于确定：


    - 函数模板的最佳候选者 (13.3)，

    - 非模板的地址 (13.4)，

    - 模板参数的匹配 (14.4)，

    - 类特化的偏序 (14.5)，

    - 函数模板的偏序 (14.6)。


    一个约束是析取范式，当它是原子项的析取，且每个项是合取范式的。同样，一个约束是合取范式，当它是原子项的合取，且每个项是析取范式的。[示例：设 A、B、C 为原子约束。A
    ∧ B 是合取范式，其项是 A ∧ B。A ∨ B 是析取范式，其析取项是 A ∧ B。] —— 示例结束


    ## 14.10.3


    当两个声明 D1 和 D2 通过其归一化约束（14.10.2）进行偏序排序时，D1 至少满足 D2，如果：


    - D1 和 D2 都是受约束声明，且 D1 的约束涵盖 D2 的约束；或

    - D2 是未约束的。


    ## 14.10.4 概念限定引用的解析 [temp.constr.resolve]


    概念解析是从由限定概念名称定义的概念集中选择概念的过程，或者是从由简单模板或其未限定 ID 为简单模板 ID 的包含一个或多个定义的声明集中选择概念。概念解析在类名称出现在以下位置时执行：


    - 受约束类型声明 (7.1.6.4.2)，

    - 受约束参数 (14.1)，

    - 模板引入 (14.2)，或

    - 在约束表达式内部 (14.10.2)。


    此类名称 C 是概念名称或模板名称，指向在该集中匹配一组参数和通配符的概念定义。该序列被称为概念参数列表，其元素称为概念参数。确定概念列表的方法取决于 C
    出现的上下文。


    - 如果 C 是受约束类型声明或受约束参数的一部分，那么

    - 如果 C 是约束命名类型，则概念参数列表由单个通配符组成，

    - 如果 C 是部分概念 ID 的概念名称，则概念参数列表由单个通配符以及该部分概念 ID 的模板参数组成。


