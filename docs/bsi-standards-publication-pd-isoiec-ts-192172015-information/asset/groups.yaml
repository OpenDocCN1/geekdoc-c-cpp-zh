    # PD ISO/IEC TS 19217:2015

    ISO/IEC TS 19217:2015(E)


    (3.2) If C is the concept-name in a template-introduction, the concept argument
    list is a sequence of wildcards of the same length as the introduction-list of
    the template-introduction.


    (3.3) If C appears as a template-name of a simple-template-id, the concept argument
    list is the sequence-template-arguments of that simple-template-id.


    4 The selection of a concept from the set referred to by C is done by making the
    argument list against the parameter lists of each concept in set. For a concept
    CC to be a viable selection, each argument in the argument list is matched against
    the corresponding parameters of CC. Default template arguments of CC (if any)
    are instantiated for each template parameter that does not correspond to a concept
    argument. Instantiated defaults are appended to the argument list. If the last
    template parameter is not a parameter pack and the number of template parameters
    of CC is greater than the number of arguments, CC is a viable selection. Otherwise,
    concept arguments are matched to template parameters using the following:


    +   - a template argument matches a template if and only if it matches in kind
    (type, non-type, type) and according to the rules in 14.4;

    - a wildcard matches a template parameter of any kind;

    - a template parameter pack (14.6.3), matches zero or more concepts, provided
    that each of those arguments match the pattern of the parameter pack using the
    rules above for matching concept arguments and template parameters.


    If any arguments do not match a corresponding template parameter, the concept
    CC is not a viable selection. The concept selected by concept resolution shall
    be the single selection in the set of concepts referred by C. Example:


    ```

    template T concept bool C1() { return true; } // #1

    templatetypename T concept bool C2() { return true; } // #2

    templateint T concept bool C3() { return true; }

    templatetypename.. T concept bool C4() = true;

    ```


    ```

    void f1(const C1+); // OK selects C1 #1

    void f2(const C1<char>); // OK selects C1<char> #2

    ```


    ```

    template<C2> struct S1; // error: no matching concept for C2<0>

    // mismatched arguments

    // resolution of C2 is ambiguous,

    template<C2> struct S2; // both concepts are viable

    ```


    ```

    C3(..Ts) void q1(); // OK: selects C3

    C3(T) void q2(); // OK: selects C3

    ```


    - end example]'
