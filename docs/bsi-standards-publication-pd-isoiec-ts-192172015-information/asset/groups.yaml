    template<typename T>\n    concept bool F3() { return true; } // error: 将函数重重声明为概念\n\
    \    concept bool V1 = true; // OK 声明了一个变量\ntemplate<typename T>\n    concept\
    \ bool V2; // error: 没有初始化值的变量概念\nstruct S {\n    template<typename T>\n    static\
    \ bool C = true; // error: 在类作用域内声明概念\n}\n```\n\n-- 示例结束\n\n每个概念都隐式定义为 constexpr\
    \ (7.1.5)。概念定义不应使用 `thread_local`、`inline`、`friend` 或 `constexpr` 限定符声明，且概念定义不具有关联约束\
    \ (14.10.2)。\n\n函数概念的定义或变量概念的初始化器不应包含对被声明概念引用。[示例：\n\n```cpp\ntemplate<typename\
    \ T>\n    concept bool F() { F<typename>::type(); } // error\ntemplate<typename\
    \ T>\n    concept bool W = V<T>; // error\n```\n\n-- 示例结束\n\n概念定义的第一个模板参数是其原型参数（prototype\
    \ parameter）。变长概念（variadic concept）是指原型参数为模板包的概念。\n\n函数概念具有以下限制：\n\n- (5.1) 其声明中不应出现任何函数限定符\
    \ (7.1.2)。\n- (5.2) 声明的类型应具有类型体。\n- (5.3) 声明的参数列表应等同于空参数列表。\n- (5.4) 声明应有一个等同于\
