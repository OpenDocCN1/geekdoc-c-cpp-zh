    \ bool F3(T) { return true; } // error: 不是空参数列表\n```\n\n§ 7.1.7\n\n19\n\n示例结束\n\
    \n6 变量概念具有以下限制：\n\n- (6.1) 声明的类型应为 `bool`。\n- (6.2) 声明应具有一个初始化器。\n- (6.3) 初始化器应是一个约束表达式。\n\
