- pgno: 245
  md: '# Chapter 15. C on Arduino


    To use digital output, you first need to configure the pin as an OUTPUT using
    the

    pinMode() function. For example:


    ```

    pinMode(13, OUTPUT); // Set pin 13 as output

    digitalWrite(13, HIGH); // Turn pin 13 on (5V)

    digitalWrite(13, LOW); // Turn pin 13 off (0V)

    ```


    Digital output are commonly used to control:


    +   - LEDs: Control visual indicators

    - Relays: Switch high-power devices like motors or lights

    - Buzzer/Speakers: Generate simple tones or sound effects

    - Shift registers: Expand the number of digital outputs

    - Transistors/MOSFETs: Drive higher-current devices


    Some things to keep in mind:


    +   - Don overload the pins: Every Arduino board has a maximum current rating
    per pin (usually around 40mA). Overloading pins can lead to unreliable behavior
    or damage the Arduino. Refer to the board documentation for precise details.

    - Higher currents: To control devices that draw more current than a single pin
    can provide (e.g., high-power LEDs, large motors), use transistors, MOSFETs, or
    drivers. These components amplify the Arduino''s signal and handle higher currents
    effectively.

    - Inductive Loads: Devices like motors or solenoids not only require higher current
    but also generate EMF (electromagnetic force) when switched off. Use flyback diodes
    (also known as freewheeling diodes) to absorb these voltage spikes.

    - Analog Pins Can Be Too: In some Arduino boards, some analog input pins (like
    A0, A1, etc.) can also function as digital outputs.


    # Digital Input


    Digital input means whether a pin is at high voltage or low voltage. The high
    or low voltage is usually referenced against half of the supply voltage (Vcc)
    of the microcontroller. If the voltage of the pin is above Vcc/2, the pin is considered
    to be high.


    The state of a pin is determined by using the digitalRead() function. The function
    accepts an argument, the number of pins to be read (0-13 or A0-A5), and returns
    the pin state as 1 (HIGH) or 0 (LOW).


    The digital state of a pin can be whether or not it is set as an output. However,
    when you read the state of a pin that is set to output, you will only be reading
    the defined output state.


    ```

    int pinState; // Declare variable to store pin state

    pinState = digitalRead(2); // Reads the state of pin 2

    ```'
