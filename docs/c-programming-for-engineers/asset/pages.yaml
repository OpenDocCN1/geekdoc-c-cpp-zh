    * **Insertion Sort**: This algorithm builds the final sorted array one element\
    \ at a time. It iterates through the array, comparing each element with the already\
    \ sorted portion and inserting it at the appropriate position.\n* **Selection\
    \ Sort**: This algorithm divides the array into two parts: the sorted part and\
    \ the unsorted part. It repeatedly selects the smallest element from the unsorted\
    \ part and swaps it with the element in the sorted part.\n* **Quick Sort**: This\
    \ algorithm uses the divide-and-conquer strategy. It selects a pivot element,\
    \ partitions the array into two subarrays based on the pivot, and recursively\
    \ sorts the subarrays."
