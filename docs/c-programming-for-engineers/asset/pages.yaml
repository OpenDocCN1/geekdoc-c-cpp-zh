    # 5.6.2 Floating-Point Data Types and Operations


    Personal computers typically have built-in hardware support for all floating-point
    data types, allowing the use of float or double. In fact, using double is recommended
    on PCs for math operations as it the default data type for the C math library.
    However, this level of floating-point support is not always available in low-cost
    microcontrollers. For example, the Cortex-M4F microcontroller has hardware support
    for float only. Attempting calculations based on double on this chip would require
    software emulation, resulting in significantly slower performance. In contrast,
    all 8-bit microcontrollers lack hardware support for floating-point altogether.
    Therefore, any computations involving floating-point on small microcontrollers
    must be rewritten to use integer types to prevent a significant slowdown.


    Table 5.7 summarizes arithmetic operations in hardware for several microcontrollers.
    It shows that programmers working on embedded systems need to understand the specific
    features of each microcontroller to get the best performance. In low-cost microcontrollers
    without the necessary hardware, even a simple calculation like "int a = b / 10;"
    can significantly down the processor. However, general-purpose processors and
    SoC-embedded computers such as the Raspberry Pi need this kind of table because
    they already have all the necessary hardware to perform arithmetic operations
    efficiently.'
