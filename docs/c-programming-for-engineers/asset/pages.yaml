  md: '# 8.8 Common Mistakes and Best Practices


    Tips for effective looping:


    +   Use Descriptive Variable Names: Give loop variables descriptive names, especially
    in nested loops with multiple variables. This makes the code easier to read.


    +   Keeping Nest Concise: Deeply nested loops can confuse. Where possible, simplify
    nesting into smaller pieces.


    +   Avoid Getting Stuck: Flawed termination conditions or improper variable updates
    can cause infinite loops. To prevent this, ensure that termination conditions
    are eventually met during loop execution.


    +   Consider Performance: Nested loops may perform poorly if the inner loop repeats
    unnecessarily. Reduce redundant computations for efficiency.


    +   Initialize Loop Control Variables: Always start loops with properly initialized
    control variables to prevent unexpected behavior.


    +   Variables Updates: Neglecting to update loop variables can cause infinite
    loops or off-by-one errors. All loop variables must be correctly modified on each
    iteration.


    +   Modifying loop control variables within the loop body: It is possible to change
    loop control variables within the loop body, doing so may result in confusion
    or unexpected behavior. When modifying loop control variables, proceed with caution.


    +   Choose Loop Type Carefully: Select the appropriate loop type (for, while or
    do-while) based on whether the number of iterations is known beforehand. Each
    type has its semantic structure, which improves code readability and maintainability.


    +   Off-by-One Errors: These errors occur when loop counters or index variables
    are incorrectly handled, resulting in one extra or missing iteration. They can
    lead to subtle logic errors and are challenging to detect.


    +   Empty or Missing Loops: Forgetting loop structure or having an empty loop
    body can lead to unexpected behavior. Verify that the loops execute the expected
    number of times and perform the intended actions.


    +   Use Do-While Loops for Specific Cases: Choose the do-while loop when you need
    the code to execute at least once, regardless of the initial condition. For simpler
    cases, a while loop might be more suitable.


    +   Forgetting Semicolon After While Condition: Include a semicolon at the end
    of the while condition in do-while loops to properly terminate the statement.'
