- pgno: 32
  md: '+   • Debugging: Errors encountered during compilation, linking, or execution
    are analyzed and fixed.


    The term "bug" commonly refers to a logical error in code. Resolving logical errors
    can be a time-consuming process because the problem may not immediately become
    apparent, if the code appears to be error-free. Debugging means detecting, analyzing,
    and resolving problems in a computer program. Although a bug may refer to a logical
    error, debugging includes identifying and correcting any type of error or issue
    in the code, logical or not. Debugging tools can help developers identify unused
    variables, unreachable code, or potential memory leaks.


    When testing a computer program, specific data inputs are chosen to make the testing
    process efficient. For example, to test a program that gives kids to 12 or under,
    we can use age inputs of 11, 12, and 13 instead of using all numbers from 0 to
    99. Choosing the best inputs for testing is a complex topic that we won''t cover
    in this semester!


    In summary, debugging in an iterative process of identifying, analyzing, and fixing
    errors. The process might uncover additional errors after fixing initial ones.


    # 2.2.6 Document the Program


    The final step in completing the program is to create documentation. The documentation
    consists of technical documentation for programmers and user documentation for
    non-technical users.


    Technical documentation includes:


    +   • Statement of the problem: Clearly defining the problem the program aims
    to solve.


    +   • Algorithm: Describing the step-by-step procedure to solve the problem.


    +   • Program listing: Providing the code of the program.


    +   • Test data and results: Including sample inputs and the corresponding outputs
    produced by the program.


    User documentation includes:


    +   • Program usage: Explaining how to load the program onto the computer.


    +   • Program features: Describing the various functionalities and how to use
    them.


    +   • Handling unusual situations: Providing instructions on how to handle unexpected
    scenarios that may occur while using the program.


    Both technical and user documentation are essential for different purposes. Technical
    documentation helps programmers understand and modify the program, while user
    documentation enables non-technical users to effectively use the program without
    requiring in-depth knowledge of its internal workings.'
