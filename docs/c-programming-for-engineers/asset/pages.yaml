    +   - **Consumer Electronics**: Embedded systems control washing machines, refrigerators,
    coffee makers, smart TVs, digital cameras, and home automation systems.

    - **Automotive Control Systems**: Embedded computers in cars manage functions
    like engine management, airbag deployment, safety features, and entertainment
    systems.'
