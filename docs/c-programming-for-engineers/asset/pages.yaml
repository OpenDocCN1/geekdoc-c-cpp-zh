    # 5.6 Arithmetic Challenges on Microcontrollers


    Arithmetic operations on microcontroller-based embedded systems are more challenging
    than on personal computers. Things that we usually don''t think about computers,
    like data types and operators, become more important and require special attention.


    # 5.6.1 Integer Data Types and Operations


    In embedded systems programming, integer data types are essential, but they come
    with some challenges. Some of the issues with C integer data types in embedded
    systems include:


    +   - Limited Memory and Processing Power: Embedded systems often have limited
    memory and processing power, restricting the size and precision of integer values.

    - Hardware-specific Limitations: Some embedded systems have specific limitations,
    as limited support for supposedly common operations like multiplication and division.
    For instance, some microcontrollers may not have a hardware multiplier, making
    multiplication slower.

    - Integer Promotions and Conversions: C integer promotions and conversions can
    sometimes behave unexpectedly in embedded systems. For example, assigning a signed
    integer to an unsigned integer may result in unexpected values.'
