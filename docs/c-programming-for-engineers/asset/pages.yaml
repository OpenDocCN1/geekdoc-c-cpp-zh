    \ memory\n    printf(\"Data at ptr: %d\\n\", *ptr);\n    ptr = &a; // Point to\
    \ 'a'\n    printf(\"Data at ptr: %d\\n\", *ptr);\n    free(ptr); // Free memory\n\
    \    return 0;\n}\n```"
