    # 2.2.5 Test and Debug


    In testing and debugging a program, several steps are involved:


    +   - **Compilation:** The compiler translates source code into object code, detecting
    syntax errors during this process.

    - **Linking:** The linker combines object files and libraries, identifying linking
    errors.

