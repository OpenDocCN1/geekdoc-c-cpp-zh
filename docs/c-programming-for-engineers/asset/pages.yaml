  md: '# Chapter 9


    # Arrays and Strings


    Variables such as integers, floating-point numbers, and characters can only hold
    one value at a time. Arrays are called scalar variables. Arrays enable programmers
    to store multiple related items, arrays are used. To store multiple values of
    the same data type under a single variable name, allowing efficient handling of
    collections of related data.


    For example, if a program needs to track the test scores of 60 students, using
    60 separate integer variables is impractical. An array provides a more organized
    solution by grouping all scores under a single array name, making it easier to
    work with the data.


    # 9.1 Introduction


    Before using arrays, they need to be declared and initialized. Declaring an array
    specifies the data type and size of the array, while initializing an array assigns
    values to its elements. For example, the following code declares and initializes
    an array of integers:


    ```

    int arr[5] = {1, 2, 3, 4, 5};

    ```


    In this example, the array has 5 elements of type int, and each element is initialized
    with a value.


    To access elements of an array, you use an index, which is an integer value representing
    the position of the element in the array. In C, indices start from 0. For example,
    to access the second element of the array arr, you would use the following code:


    ```

    int second_number = arr[1]; // Copy to another variable

    arr[1] = 100;             // Change to a new value

    ```


    This code retrieves the value of the second element of arr and modifies it. If
    you don''t specify the size when initializing an array, the compiler determines
    it based on the number of initial values:


    ```

    int arr[] = {1, 2, 3, 4, 5};

    ```


    You can also declare an array without initializing it, like this:


    In this case, the array contain garbage values until you assign specific values
    later in your program.


    Attempting to access or modify an element beyond the array''s size (e.g., arr[5])
    results in undefined behavior, which can lead to unpredictable program Behavior,
    including garbage values or crashing the program. Arrays in C are zero-indexed,
    meaning the first element has an index of 0, and the last element''s index is
    one less than the size.'
