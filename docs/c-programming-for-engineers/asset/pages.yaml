  md: "# Chapter 11\n\n# # File Input/Output\n\nFile handling is a crucial aspect\
    \ of programming, enabling programs to read, write, and manipulate data stored\
    \ in files, making it critical for various applications, such as data management,\
    \ software development, and web applications.\n\nFile input/output (I/O) in C\
    \ allows programs to interact with external storage devices like hard drives,\
    \ USB drives, and memory cards. This capability enables programs to store and\
    \ retrieve large amounts of data, which is essential for many applications.\n\n\
    In contrast to standard I/O, which handles input and output from the keyboard,\
    \ screen, and other hardware, file I/O deals specifically with external storage\
    \ access. Reasons for needing file handling in C include:\n\n+   - **Persistence**:\
    \ By saving beyond their runtime, programs can maintain preferences, save application\
    \ state, and archive historical data.\n- **Data exchange**: Files facilitate collaboration,\
    \ data transfer between applications, and compatibility across platforms, as they\
    \ allow programs to share data in standardized formats.\n- **Handling large datasets**:\
    \ File I/O enables processing massive amounts of data that exceed memory limits,\
    \ by reading data in chunks, performing operations efficiently, and writing results\
    \ incrementally.\n\nIt is important to note that file handling relies on the operating\
    \ system, so this chapter may not be relevant for bare-metal embedded systems.\n\
    \n# ## 11.1 Opening and Closing Files\n\n+   - fpen(): which initializes a file\
    \ stream and returns a pointer to a FILE structure. It takes two arguments:\n\
    \  - filename: The name of the file to be opened, provided as a null-terminated\
    \ string.\n  - mode: Specifies the file mode:\n    - r: Read-only mode. Allows\
    \ reading data from the file.\n    - w: Write-only mode. Erasing existing content\
    \ or creates a new file if it doesn't exist.\n    - a: Append mode. Adds data\
    \ to the end of the file without overwriting existing content.\n\n```\nFILE *fp;\n\
    fp = fopen(\"my_file.txt\", \"w\");\n```\n\n+   - fclose(): After opening a file,\
    \ it's crucial to close it fclose() when done. This function releases system resources\
    \ associated with the file. It takes the pointer to a FILE structure returned\
    \ by the previous fopen() call."
