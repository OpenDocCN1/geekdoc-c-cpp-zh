    # 6.1 Output Formatting with printf


    In this section, we will delve into the powerful printf function, which stands
    for "print formatted." This function allows you to display data on the screen
    in a specific format. Let us explore its syntax and various formatting options.


    # 6.1.1 Basic Syntax


    The basic syntax of the printf function is:


    ```

    printf(format_string, arg1, arg2, ...);

    ```


    where:


    +   - format_string is a string that specifies the format of the output.

    - arg1, arg2, etc., are the values to be formatted and printed. The number of
    variables must match the number of format specifiers in the format_string.


    Imagine you want to print a person''s name and age on separate lines. Here is
    how you would use printf:


    ```

    int age = 30;

    char name[] = "Alice"

    printf("Name: %s\nAge: %d\n", name, age);

    ```


    Here, the format string specifies two placeholders: %s for a string and %d for
    an integer. The \n escape sequence after each format specifier adds a newline
    character, separating the name and age on different lines. The values following
    the comma (separated by commas) match these placeholders, producing the output:


    Name: Alice

    Age: 30


    # 6.1.2 Formatting Specifiers


    Formatting specifiers are placeholders within the format string that indicate
    the type and format of the corresponding argument. Some common formatting specifiers
    include:'
