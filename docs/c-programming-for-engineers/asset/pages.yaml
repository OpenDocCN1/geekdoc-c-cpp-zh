    \ when dealing with incompatible pointer types.\n\nExample:\n\n```\nfloat pi =\
    \ 3.14;\nvoid *voidPtr = &pi; // Pointer to pi\n\n// Casting void pointer to float\
    \ pointer\nfloat *floatPtr = (float*)voidPtr;\n\nprintf(\"Value of pi: %.2f\\\
    n\", *floatPtr); // Outputs: Value of pi: 3.14\n```\n\n# 12.8.3 Dangling Pointers\n\
    \nA dangling pointer occurs when it points to memory that has been deallocated\
    \ or is no longer valid. This occurs, for example, when memory previously allocated\
    \ to the pointer is freed, but the pointer still holds that address. Dangling\
    \ pointers can lead to unpredictable behavior, like accessing memory not owned\
    \ by the program or causing crashes.\n\nExample:\n\n```\n#include <stdio.h>\n\
    #include <stdlib.h>\n\nint main() {\n    int *ptr, a = 55;\n\n    ptr = malloc(sizeof(int));\
