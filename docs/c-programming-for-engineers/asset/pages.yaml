  md: "```\nif(digitalRead(SWITCH_PIN) == LOW)\nPROCEED = true;\nif(PROCEED) {\n \
    \ digitalWrite(LED_BUILTIN, HIGH);\n  delay(500);\n  digitalWrite(LED_BUILTIN,\
    \ LOW);\n  delay(500);\n}\n```\n\nSimilarly to the first program, the LED is blinked\
    \ by turning it on, turning off, and delaying for 500 milliseconds, turning it\
    \ off and delaying for another 500 milliseconds. However, the blinking only occurs\
    \ when PROCEED is true, which happens when the switch has been pressed.\n\nIn\
    \ summary, both programs involve checking the state of the switch and blinking\
    \ the LED accordingly. The first program uses a polling loop as a barrier before\
    \ proceeding to the LED blinking, while the second program utilizes a flag variable\
    \ to determine if the switch has been pressed before enabling the LED blinking.\n\
    \n# 15.7 Blink All LEDs in Sequence\n\nIn this section, we aim to sequentially\
    \ turn on LED 2 through LED 7 in a back and forth pattern, creating an interesting\
    \ display. Here is the complete code:\n\n```\n// KnightRider: Sequentially turns\
    \ on the built-in LEDs\nint delayTime = 100; // Adjust this value to change the\
    \ speed of the effect\n\nvoid setup() {\n  for (int i = 2; i <= 7; i++) {\n  \
    \  pinMode(i, OUTPUT); // Set pins 2 through 7 as outputs\n    digitalWrite(i,\
    \ LOW); // Turn off all LEDs initially\n  }\n}\n\nvoid loop() {\n  // Scan the\
    \ LEDs from left to right\n  for (int i = 2; i <= 7; i++) {\n    digitalWrite(i,\
    \ HIGH); // Turn on the current LED\n    delay(delayTime); // Wait for a while\n\
    \    digitalWrite(i, LOW); // Turn off the current LED\n  }\n\n  // Scan the LEDs\
    \ from right to left\n  for (int i = 6; i > 2; i--) {\n    digitalWrite(i, HIGH);\
    \ // Turn on the current LED\n    delay(delayTime); // Wait for a while\n    digitalWrite(i,\
    \ LOW); // Turn off the current LED\n  }\n}\n```"
