  md: "# 12.6 Dynamic Memory Allocation\n\nDynamic memory allocation allows programs\
    \ to allocate memory at runtime, opposed to static memory allocation which occurs\
    \ at compile-time. This is done through pointer usage and memory management functions.\
    \ The main functions for dynamic allocation are malloc() and free().\n\n+   -\
    \ malloc(): Requests a chunk of unusable memory from the free storage area called\
    \ the heap. The number of bytes to allocate is taken as an argument. Returns a\
    \ void pointer to the starting address of the allocated block.\n- free(): Returns\
    \ a previously allocated (deallocates) block back to the free storage for reuse.\
    \ It takes a pointer to the memory block.\n\nFor example:\n\n```\n// Allocate\
    \ memory for 5 integers\nint *ptr = malloc(5 * sizeof(int));\n```\n\n```\n// Use\
    \ the memory\nptr[0] = 1;\n```\n\n```\n// Free the memory\nfree(ptr);\n```\n\n\
    Here, the malloc() function allocates space for 5 integers and returns the starting\
    \ address in ptr. We can then access the memory block through ptr using operators\
    \ like []. The free() function releases the memory back to the system. This dynamic\
    \ approach allows memory needs to be flexible at runtime instead of being fixed\
    \ at compile time.\n\nA longer example:\n\n```\n#include <stdio.h>\n#include <stdlib.h>\n\
    #include <time.h>\n#define ARRAY_SIZE 10\n```\n\n```\nint main() {\n    int *array;\n\
    \n    // Dynamically allocate memory for the array\n    array = (int*)malloc(ARRAY_SIZE\
    \ * sizeof(int));\n```\n\n```\nif (array == NULL) {\n    printf(\"Memory allocation\
    \ failed!\\n\");\n    return 1;\n}\n```\n\n```\n// Set the seed for random number\
    \ generation\nsrand(time(NULL));\n```"
