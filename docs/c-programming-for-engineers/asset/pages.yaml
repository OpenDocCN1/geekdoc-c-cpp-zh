    The "original" Arduino Uno is based on an 8-bit processor. This means it works
    with 8-bit data types like byte, as larger types like int and long require more
    processing power and can slow down performance.


    The Atmega328 also lacks built-in support for integer multiplication/division
    and floating-point math, so using these operations repeatedly can negatively impact
    performance. For best results, use 8-bit types when possible and avoid extensive
    use of larger data types and floating-point calculations.


    However, the performance impact may be more significant only on older or lower-end
    Arduino boards. Newer and more powerful Arduino boards can handle larger data
    types and calculations more efficiently. If performance is critical or resources
    are limited, use smaller data types and avoid extensive floating-point calculations
    to optimize program execution speed.


    # 15.3.2 Arduino Pin I/O Library


    The Pin I/O Library in Arduino simplifies pin control for your projects. In this
    subsection, we will cover its basic functions, starting with digital input and
    output, which are essential for any microcontroller project. Table 15.3 lists
    the functions available.


    For beginners, it is helpful to use digital input, and output is the most basic
    operations of a microcontroller. All of the pins on an Arduino board (0-13 and
    A0-A5) can be used as digital inputs or outputs in addition to any other function
    (e.g. analog input) connected to the pin.


    # Pin Mode


    In Arduino, the pinMode() function sets a pin''s mode. The three common options
    are INPUT, INPUT_PULLUP, and OUTPUT:'
