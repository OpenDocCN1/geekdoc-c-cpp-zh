    # 2.4.1 Sequential Structure


    Sequential structure refers to executing a series of steps or statements in the
    order they are written in an algorithm. This structure allows us to make decisions,
    repeat actions, and control the flow of statements. For clarity regarding the
    sequence of execution, individual steps can be numbered.


    ```

    Begin

    Statement_1

    Statement_2

    Statement_3

    ...

    Statement_n

    End

    ```


    In this pseudocode snippet, the statements Statement_1, Statement_2, Statement_3
    until Statement_n are grouped within the Begin and End keywords. Even though they
    are separate statements, they are considered as one statement block in terms of
    execution.'
