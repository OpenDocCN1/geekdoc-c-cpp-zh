    \nFigure 15.4: Hello World on the Arduino Serial Monitor\n\nCongratulations! You've\
    \ just taken your first steps into the fascinating world of programming Arduino\
    \ using C.\n\n# 15.5 Blinky Program in Arduino C\n\nThe \"Blinky\" program is\
    \ the hardware equivalent of \"Hello, World!\" and is often the first program\
    \ written when learning to program microcontrollers. It blinks the built-in LED\
    \ on an Arduino board.\n\nThe built-in LED is connected to pin 13. You can refer\
    \ to it using the number 13 or the constant LED_BUILTIN. To control the LED, use\
