  md: '# Chapter 14


    # Preprocessor


    The C preprocessor is a macro processor that is used before the compilation of
    a C program. It is used to perform text substitution on the source code before
    it is compiled. The preprocessor is invoked by the compiler and runs as a separate
    phase before the compilation process.


    # 14.1 Introduction


    Preprocessing happens before the actual compilation of C programs. It interprets
    directives and macros to transform the source code into a modified version that
    is then passed on to the compiler. See Fig. 14.1.


    ![](img/33fb6b7acbb6df48a3c9564e97117da6_230_0.png)


    Figure 14.1: C preprocessor dataflow


    Key features of the C preprocessor include:


    +   - **Macro definitions and substitutions**: Defined using #define, macros allow
    for code customization without changing the original program.

    - **File inclusion**: Managed via #include, this feature includes header files
    with shared declarations.

    - **Conditional compilation**: Enabled by #ifdef and #ifndef, it allows parts
    of the code to be compiled conditionally based on macro definitions. It is useful
    for platform-specific customization.

    - **Line Control**: Using #line, developers can set line numbers and file attributes
    for debugging.

    - **Error generation**: Triggered by #error, this directive generates error messages
    during processing.


    The C preprocessor provides various directives that allow for code manipulation
    and optimization during the preprocessing phase. They are grouped as file inclusion,
    macro substitution, conditional compilation and miscellaneous directives. See
    Fig. 14.2.


    # 14.2 File Inclusion


    The #include directive is used to import header files in a C program, allowing
    for code reuse by incorporating external code files. It inserts the contents of
    a header file into'
