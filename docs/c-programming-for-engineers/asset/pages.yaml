  md: '# Chapter 3


    # # Programming Environment


    This chapter introduces the use of a programming environment. It discusses the
    differences between Integrated Development Environments (IDEs) and online compilers.
    The focus is on a hands-on experience, allowing learners to write, execute, and
    debug C programs.


    # ## 3.1 Compilation Process


    Compiling a C program involves converting its source code into machine code for
    execution on a computer. The process consists of four steps:


    +   - **Preprocessing**: The preprocessor takes the source code as input, removes
    comments, and processes preprocessor directives such as including header files
    (e.g., <stdio.h>). It replaces these directives with the actual content of included
    files.


    +   - **Compiling**: The preprocessed code is then fed into the compiler, which
    translates it into assembly code.


    +   - **Assembling**: The assembly code produced in the previous step is passed
    to an assembler, which converts it into object code. The object code is represented
    in a machine-specific low-level language and typically has a file extension such
    as .o or .obj.


    ![](img/33fb6b7acbb6df48a3c9564e97117da6_47_0.png)


    Figure 3.1: Compilation Process


    37'
  merge: -1
  img_proc: true
- pgno: 48
  md: '# Chapter 3. Programming Environment


    4. **Linking**: The linker takes one or more object files generated by the assembler
    and combines them with any necessary library files. It resolves references to
    external functions and symbols, performs address relocation, and generates an
    executable file. The executable file may have an extension like .exe on Windows
    or no extension on Unix/Linux.


    Figure 3.1 shows the compilation process, including the file extensions commonly
    used on Unix/Linux systems. On Windows, assembly code may have .ASM extension,
    object code .OBJ, static libraries .LIB, and dynamic libraries .DLL. Most compilers
    skip generating .i (preprocessed) and s (assembly) by default unless specifically
    requested by the programmer, so that you will commonly with source files, object
    files and executable files on your computer.


    For the curious, the compiler itself goes through several steps:


    +   **Lexical Analysis**: The compiler reads your code and breaks it down into
    smaller units tokens. Tokens can be things like keywords (e.g., "if" or "while"),
    variable names, numbers, or symbols.


    +   **Syntax Analysis**: The compiler checks if the tokens from the previous step
    are arranged correctly according to the language grammar rules. It builds a tree-like
    structure called the syntax tree to represent the structure of your code.


    +   **Semantic Analysis**: The compiler verifies the meaning of your code. It
    checks if you''re using variables and functions correctly, and if the operations
    you''re performing make sense. It also catches errors like a variable before it''s
    defined.


    +   **Code Generation**: The compiler translates the syntax tree into instructions
    that the computer can understand and execute. It generates machine code or a lower-level
    representation of your code.


    +   **Code Optimization**: The compiler tries to improve the efficiency and performance
    of your code. It applies various techniques to make the generated code faster
    or use less memory.


    The steps are shown in Fig. 3.2.


    ![](img/33fb6b7acbb6df48a3c9564e97117da6_48_0.png)


    Figure 3.2: The internal working of a compiler'
