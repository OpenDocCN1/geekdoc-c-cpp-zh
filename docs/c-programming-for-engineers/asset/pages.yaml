  md: '# 12.1.2 Pointer Declaration and Initialization


    To declare a pointer in C, you need to specify the data type to which the pointer
    will refer. The syntax for declaring a pointer is as follows:


    ```

    data_type *pointer_name;

    ```


    Here, data_type can be any valid C data type, such as int, float, char, or a user-defined
    struct.


    For example, to declare an integer pointer, you would use:


    ```

    int *ptr;

    ```


    Once declared, you can initialize the pointer to point to a specific memory location.
    You can do this by assigning the address of a variable to the pointer using the
    address-of operator (&):


    ```

    int num = 5;

    int ptr = &num;

    ```


    In this example, the pointer ptr is initialized to hold the address of the variable
    num, which has a value of 5. See Fig. 12.1.


    ![](img/33fb6b7acbb6df48a3c9564e97117da6_191_0.png)


    # 12.1.3 Understanding Memory Addresses


    Every variable in a C program occupies a unique memory location, identified by
    its memory address. A pointer is a variable that stores a memory address. We must
    differentiate between the pointer itself, the memory address that it holds, and
    the value stored at that address.


    When working with pointers, assigning the address of a variable to a pointer is
    valid, but assigning the variable is not. For example:


    ```

    ptr = &num; // Valid, assigns the address of num to ptr

    ptr = num; // Invalid, trying to assign the variable num to ptr

    ```


    For the curious, you can print the memory address stored in a pointer using the
    %p specifier in the printf() function. This is useful when you want to verify
    the memory address stored in a pointer or to understand how pointers work in C.'
