    # The Variants


    For smaller ranges, short int can be utilized, occupying half the size of int
    (16 bits or 2 bytes) and ranging from -32,768 to 32,767. However, caution is needed
    to prevent overflow when using smaller types. Similarly, unsigned short int is
    akin to short int but can only store positive numbers, ranging from 0 to 65,535.

    In cases where int falls short, you can use long int. The exact size depends on
    the platform, but it is guaranteed to be at least 32 bit. On PCs, the size is
    64 bits, with values up to ±9 quintillion (9 × 10¹⁸). Conversely, unsigned long
    int provides a larger positive range from 0 to 18 quintillion (1.8 × 10¹⁹).


    When declaring variants of int, you can omit the int keyword, which works for
    short int, unsigned short int, unsigned int, long int, and unsigned long int.


