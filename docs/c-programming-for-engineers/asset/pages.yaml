    be stored.


    # 4.3.1 Integer Data Types


    In C, integer data types provide options for storing whole numbers, each with
    its own size and range.


    The Basic Type: int


    The most commonly used type is int, which occupies 32 bits (4 bytes) on personal
    computers, allowing values ranging from -2,147,483,648 to 2,147,483,647 (about
    ±2 billion). The int data type frequently yields optimal performance because its
    size corresponds to the native data size in many computer architectures.'
