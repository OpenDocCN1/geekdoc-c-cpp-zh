    You can perform various String manipulations using String methods.


    # String Methods


    In Arduino programming, they may seem similar, there are some key differences.
    Functions are standalone pieces of code that perform specific tasks. They have
    their own scope and can only access their own on. variables. Methods, on the other
    hand, are associated with objects or instances of a class. They can access and
    interact with the data and state of the object they belong to. Other differences:


    Scope Functions have their own scope and can only access their own variables.
    Methods can access the data of the object they belong to.'
