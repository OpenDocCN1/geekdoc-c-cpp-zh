  md: "# 15.6. Reading Switch\n\nset as an input. You must use the INPUT PULLUP option\
    \ to configure the switch. In the loop, the switch state is checked using digitalRead().\
    \ If the switch is pressed (LOW state), the LED is turned on. If the switch is\
    \ released (HIGH state), the LED is turned off.\n\nThe following code snippets\
    \ reuses the LED blinking code from the previous section but require the built\
    \ in switch to be pressed before the LED blinking can start. The first program\
    \ uses a polling loop approach which acts as a barrier. It serves as a barrier,\
    \ preventing further processing until the switch is pressed. Once the switch is\
    \ pressed, the program proceeds to the loop() function where the LED is blinked.\n\
    \n```\n```cpp\n// Blinky2: push the button to start the LED blinking\n// Uses\
    \ the barrier method\n```\n```\n\n```\nconst byte SWITCH PIN = 2;\n```\n\n```\n\
    void setup() {\n    pinMode(SWITCH PIN, INPUT PULLUP);\n    pinMode(LED BUILTIN,\
    \ OUTPUT);\n    while(digitalRead(SWITCH PIN) == HIGH);\n}\n```\n\n```\nvoid loop()\
    \ {\n    digitalWrite(LED BUILTIN, HIGH);\n    delay(500);\n    digitalWrite(LED\
    \ BUILTIN, LOW);\n    delay(500);\n}\n```\n\nIn the loop function, the LED is\
    \ turned on, delayed for 500 milliseconds using delay(500), then turned off, and\
    \ delayed for another 500 milliseconds.\n\nThe second program utilizes a flag\
