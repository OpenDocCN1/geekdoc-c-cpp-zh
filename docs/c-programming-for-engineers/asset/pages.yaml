    # 12.2 Pointer Arithmetic


    Pointer arithmetic is the process of performing arithmetic operations on pointers.
    The size of the data type being pointed to determines the size of the increment
    or decrement. The most commonly used pointer arithmetic operations involve the
    increment (++) and decrement--) operators. These operators increase or decrease
    the pointer by the size of the data type it is pointing to. For example, consider
    a string:


    ```

    char string[] = "Kucing oben";nchar *strptr;

    ```


    ```

    // Pointer strptr to the second character: ''u''

    strptr = &string[1];

    ```


    ```

    // Outputs: Character at strptr: ''u''

    printf("Character at strptr: %c\n", *strptr);

    ```


    ```

    // Incrementing strptr moves it to the next character

    strptr++;

    ```


    ```

    // Outputs: Character at strptr after increment: ''c''

    printf("Character at strptr after increment: %c\n", *strptr);

    ```


    Here, ptr initially points to the second character in the string. Incrementing
    ptr moves it to the next element in the array by the increment operator. For instance,
    consider an integer array:


    ```

    int arr[] = {10, 20, 30, 40, 50};

    // Pointer ptr points to the first element of the array

    int *ptr = arr;

    ```


    ```

    // Outputs: Value at ptr: 10

    printf("Value at ptr: %d\n", *ptr);

    ```


    ```

    // Incrementing ptr moves it to the next element in the array

    ptr++;

    ```'
