  md: "# 5.5.3 Integer Quirks\n\nInteger division in C differs from floating-point\
    \ division and can lead to truncation issues. Consider the following example:\n\
    \n```\nint a = 5 / 2;           // Result is 2\nfloat b = 5 / 2;       // Result\
    \ is 2.0\nfloat c = (float)5 / 2; // Result is 2.5\nfloat d = 5 / 2;       //\
    \ Result is 2.5\nfloat e = 5 / 2;       // Result is 2.5\n```\n\nIn the code above,\
    \ the expression 5 / 2 performs division, resulting in assigning the result to\
    \ an integer variable like a quotient of 2. This may be expected when assigning\
    \ the result to a float variable like b. However, it can be surprising when assigning\
    \ the result...\n\nTruncation occurs when the result of a division is cast to\
    \ an integer, discarding any decimal part. In the example, the fractional part\
    \ of the division is discarded because the result is assigned to an integer variable.\
    \ To obtain a floating-point result, at least one of the operands should be a\
    \ floating-point type.\n\nTo ensure floating-point division, at least one of the\
    \ operands must be a float. This can be achieved by adding a period at the end\
    \ of either number or by explicitly casting one of the operands to (float).\n\n\
    It is important to be aware of this behavior to avoid unexpected results when\
    \ performing divisions in C, especially when working with mixed data types.\n\n\
    # 5.5.4 Overflow and Underflow\n\nOverflow and underflow occur in arithmetic operations\
    \ where the result exceeds the maximum or minimum value that the data type can\
    \ represent.\n\nWhen an underflow occurs, the value becomes too large for the\
    \ variable to hold, while an underflow occurs when the value becomes too small.\
    \ In such cases, the variable's value \"wraps around\" within the range of possible\
    \ values.\n\nBelow is a simplified example demonstrating overflow and underflow\
    \ in C:\n\n```\n#include <stdio.h>\n\nint main() {\n    char c;\n\n    // Overflow\
    \ example\n    c = 127;\n    printf(\"Value before increment: %d\\n\", c);\n \
    \   c++;\n    printf(\"Value after increment: %d\\n\", c);\n\n    // Underflow\
    \ example\n    c = -128;\n    printf(\"Value before decrement: %d\\n\", c);\n\
    \    c--;\n}\n```"
