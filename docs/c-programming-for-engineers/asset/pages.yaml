    # 13.6 Data Structures


    Data structures refers to specialized arrangements used to organize and store
    data in a computer''s memory. The primary purposes of data structures is to optimize
    the performance of algorithms. Data structures also serve various essential functions,
    facilitating data organization, enabling efficient storage and retrieval, and
    supporting effective data manipulation.


    Data structures can be broadly categorized into two types: linear and non-linear.
    Linear data structures organize data elements sequentially, one after the other.
    Elements in linear data structures are accessed in a sequential order, making
    traversal straightforward. Examples of linear data structures include arrays,
    linked lists, stacks, and queues. Non-linear data structures organize data elements
    in a hierarchical or interconnected manner, where elements may have multiple predecessors
    and successors. Elements in non-linear data structures can be accessed in various
    paths, not limited to a single sequence. Examples of non-linear data structures
    include trees and graphs.


    +   * Arrays: Store elements of the same type in a sequence, accessible via indices.
    They offer a straightforward way to handle data efficiently. Arrays have been
    covered in an earlier chapter.


    +   * Stacks: Linear structures operating on the Last In, First Out (LIFO) principle.
    They support two main operations: push (adding an element to the top) and'
