    , a, b); // Output: 5, 10 (unchanged)\n}\n```\n\n# Pass-by-Reference\n\nPointers\
    \ allow passing data by reference, enabling functions to modify the original data.\
    \ In pass-by-reference, the memory address of the original variable is passed\
    \ to the function. Changes made inside the function affect the original variable.\
    \ This method is used for large data structures, such as arrays, to avoid copying.\
    \ For example, consider the correct swapping of values using pointers.\n\n```\n\
    void swap(int *x, int *y) { // Correct swap function, uses pointers\n    int temp\
    \ = *x;\n    *x = *y;\n    *y = temp;\n}\n```\n\n```\nint main() {\n    int a\
    \ = 5, b = 10;\n    swap(&a, &b); // Passing addresses to swap function\n    printf(\"\
    a: %d, b: %d\\n\", a, b); // Output: 10, 5 (swapped)\n}\n```\n\nWhen deciding\
    \ between pass-by-value and pass-by-reference, consider the data type and desired\
    \ function behavior. Pass-by-value is suitable for simple data types and is safer\
    \ as it avoids unintended modifications to the original data.\n\nIn contrast,\
    \ pass-by-reference is preferable for large data structures to improve efficiency\
    \ and modify the original data. It avoids copying large amounts of data. Additionally,\
    \ with pass-by-reference, pointers can be used to indirectly \"return\" multiple\
    \ values since C functions can only return a single value.\n\nSee Table 12.1 for\
    \ a summary of the differences between pass-by-value and pass-by-reference.\n\n\
    # Table 12.1: Comparison of pass-by-value vs pass-by-reference\n\n| Feature |\
    \ Pass-by-value | Pass-by-reference |\n|---|---|---|\n| What is passed? | Copy\
    \ of the value | Memory address of the original variable |\n| Changes inside the\
