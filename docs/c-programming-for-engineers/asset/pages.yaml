- pgno: 251
  md: "Let us analyze what we see. In regular C programming, we typically execute\
    \ programs on general-purpose computers with operating systems. Here, the program\
    \ starts by transferring control from the OS to the main() function. When the\
    \ program finishes, it returns a success code (often \"return 0;\") back to the\
    \ operating system. Since this return value is an integer, the main() function\
    \ itself has an int data type. The key concept is that the program eventually\
    \ terminates, and control goes back to the OS.\n\nHowever, things work differently\
    \ on embedded systems like Arduino boards. Here, the program runs continuously\
    \ and never terminates. There is no need to return an integer to an operating\
    \ system. Instead, an embedded application is typically structured with two main\
    \ parts: initialization and a main loop.\n\n+   * Initialization (setup()): This\
    \ part is executed only when the program starts. This can include initializing\
    \ variables, setting pin modes, configuring communication ports, and other setup\
    \ tasks.\n* Main Loop (loop()): Once the setup is complete, control is transferred\
    \ to the loop() function. This function runs repeatedly in an endless loop. This\
    \ section typically contains the core functionality of your program, such as reading\
    \ sensors, performing calculations, controlling actuators, and responding to external\
    \ events or inputs.\n\nBy separating the initialization and main loop into distinct\
    \ functions, the Arduino framework simplifies the development process for embedded\
    \ systems.\nNow, we can proceed with the actual \"Hello, World!\" program below:\n\
    \n```\n// Hello, World! Arduino-style\nvoid setup() {\n  Serial.begin(9600); //\
    \ Initialize serial communication at 9600 baud\n}\nvoid loop() {\n  // \"Hello,\
    \ World!\" to the serial monitor\n  Serial.println(\"Hello, World!\"); // Print\
    \ the message\n  delay(1000); // Pause for a second\n}\n```\n\n# **Understanding\
    \ the Code**\n\n+   1. Serial.begin(9600): This line initializes the serial communication\
    \ with a baud rate of 9600. The serial monitor is a tool in the Arduino IDE that\
    \ allows you to communicate with the Arduino board and observe the output.\n2.\
    \ Serial.println(\"Hello, World!\");): This line prints the \"Hello, World!\"\
    \ message to the serial monitor. The 'println' function adds a newline character\
    \ after printing the message.\n3. delay(1000): This line introduces a delay of\
    \ 1000 milliseconds (1 second) between successive executions of the 'loop()' function,\
    \ which makes the message readable on the serial monitor."
  merge: -1
  img_proc: true
- pgno: 252
  md: "# 15.5. Blinky Program in Arduino C\n\nConnect your Arduino board to your computer\
    \ using a USB cable. Within the Arduino IDE, select the appropriate board type\
    \ and serial port from the respective menus. Once everything is configured, click\
