  md: "# 10.7.3 Counting Set Bits in Binary Representation\n\nThe bitcount () function\
    \ takes an integer as input and returns the count of ones in its binary representation.\
    \ The algorithm:\n\n+   1. Initialize variable count to 0.\n2. In a loop, check\
    \ if the least significant bit (LSB) of n is 0 or 1 using a bitwise AND with 1.\n\
    3. If the LSB is 1, increment the count.\n4. Right-shift n by 1 to move the next\
    \ bit into the least significant position.\n5. Repeat steps 2-4 until n becomes\
    \ 0, indicating that all bits have been counted.\n6. Return the final count.\n\
    \n```\nint bitcount(int n) {\n    count = 0;\n    while(n != 0) {\n        if\
    \ (n&1 != 0) // test last bit\n            count++;\n        n = n >> 1;\n   \
    \ }\n    return count;\n}\n```\n\nNote that the loop may take up to 32 iterations\
    \ for a 32-bit integer, but it can terminate sooner if all 1 bits have been shifted\
    \ out.\nInstead of incrementing count when the LSB is 1, you can also use count\
    \ = count + (n&1); but the compiler would probably generate the same machine code.\n\
    \n# 10.7.4 An Improved Approach: Brian Kernighhan's Algorithm\n\nThe popcount\
    \ function takes an integer n as input and returns the count of ones in its binary\
    \ representation. This uses a technique called Brian Kernigh''s algorithm to count\
    \ the number of set bits (ones) in the number. name \"popcount\" is short for\
    \ population count, referring to the number of set bits (bits with a value of\
    \ 1) in a binary representation of a number. The algorithm:\n\n+   1. Initialize\
    \ variable count to 0.\n2. In a loop, perform a bitwise AND operation between\
