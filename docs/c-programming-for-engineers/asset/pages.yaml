    **Figure 3.8**: Errors, warning and time of discovery


    detected during compilation and come with error messages. Examples include passing
    incorrect arguments to a function or assigning a value of the wrong data type.


    +   - **Logical Errors**: Also known as "bugs," these occur when the code doesn''t
    produce expected results due to flaws in the algorithm. They don''t crash the
    program or show error messages but lead to undesired behavior. Examples include
    using the wrong mathematical formula or loop conditions.

    - **Runtime Errors**: These occur during program execution due to unexpected conditions.
    Examples include division by zero or accessing invalid memory locations. They''re
    challenging to detect and debug as they don''t always cause immediate termination.

    - **Linker Errors**: These occur during the linking phase when the linker cannot
    resolve references to external symbols or functions. Examples include forgetting
    necessary header files or misspelling function names.


    In summary, syntax errors are violations of language rules, semantic errors involve
    incorrect usage, logical errors affect the algorithm''s outcome, runtime errors
    occur during execution, and linker errors pertain to unresolved references. For
    instance, considering the area of a rectangle with:


    ```

    area = 0.5 + length + width;

    ```


    This code compiles without syntax errors but produces incorrect results due to
    the logic error. In many cases, a bug is only discovered and fixed after resolving
    another bug. For example, the following statement has both syntax and logic errors:


    ```

    area = 0.5 + length + width;

    ```


    Here, the syntax error "masks" the logic error, making debugging an iterative
    process, not a single step.'
