  md: '# Chapter 7

    Selection Logic


    This chapter focuses on decision making in C programming. We will cover different
    decision making constructs, their uses, and the evaluation rules, allowing you
    to create more sophisticated decision-making structures, handle data, and improve
    program logic.


    # 7.1 Boolean Expressions


    Boolean expressions (named after the English mathematician George Boole) are used
    to control program flow. They''re often used to check conditions. Programs can
    test conditions to decide what actions to take. The most basic type of Boolean
    expression is one that compares two values. Table 7.1 lists the C relational operators.


    Table 7.1: C relational operators


    | Operator | Example | Meaning |

    |---|---||

    | == | a == b | True if a is equal to b |

    | != | a != b | True if a is not equal to b |

    | > | a > b | True if a is greater than b |

    | < | a < b | True if a is less than b |

    | >= | a >= b | True if a is greater than or equal to b |

    | <= | a <= b | True if a is less than or equal to b |


    It is very important to note that equality uses a double equal sign. A single
    equal sign is an assignment operation. Don''t think "equals", think "same as",
    with one symbol for each word.


    Relational operators help us create basic conditions. However, sometimes we need
    to check if one thing is true AND another thing is true, or if one of two things
    is true. For these cases, we use compound and logical operators like AND, OR,
    and NOT. Table 7.2 lists the C logical operators.


    Table 7.2: C logical operators


    | Operator | Description | Example | Meaning |

    |---|---|---||

    | && | Logical AND | a && b | True if both a and b are true |

    | || | Logical OR | a || b | True if either a or b is true |

    | ! | Logical NOT | !a | True if a is false (negation) |


    C does not have a specific data type for Boolean values, so 1 is used to represent
    true and 0 to represent false. The logical operators in C treat any non-zero value
    as true and zero as false.'
