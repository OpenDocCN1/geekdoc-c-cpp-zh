    An algorithm is a set of instructions that, when precisely followed, will solve
    a particular problem or perform a particular task. Algorithmic thinking involves
    breaking down problems into step-by-step instructions that a computer can follow
    to solve the problem.


    There may be multiple algorithms to solve one problem, each with advantages and
    disadvantages. Programmers choose the best algorithm based on factors like efficiency.


    Instructions are divided into three types:


    +   - Input: supplying data to the computer.

    - Process: manipulate data such as comparing input or performing complex math.

    - Output: delivering the results from the computer.


