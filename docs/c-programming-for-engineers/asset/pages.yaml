    # 4.1.7 Comments


    In programming, comments are used to explain the code to others. They help make
    the code clear and easy to understand, which is important for making sure it works
    correctly. Comments describe what different parts of the code do, and explain
    how variables are used. Comments don''t affect how the program actually runs because
    the computer ignores them.


    Each programming language has its own way of writing comments. In C, one-line
    comments begin with // through the end of the line.


    ```

    int length = 12; // length in inches

