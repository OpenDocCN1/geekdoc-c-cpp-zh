  md: '# 5.4 Type Conversion


    # # 5.4 Type Conversion


    As a program runs, there might be instances where data types need to be converted
    to perform operations between dissimilar types. This section explores type conversion
    and casting in C, fundamental concepts that ensure proper handling of data types.

    Converting smaller data type into a larger one is called as type promotion. On
    the other hand, demotion means converting larger data type into a smaller one.
    Demotion must be done with care as it may cause data loss. Refer to Fig. 5.4 ranking
    of data types.


    #  5.4.1 Automatic Type Conversion


    Automatic type conversion, also known as coercion or implicit type conversion,
    occurs when operands of different types are involved in an operation. This conversion
    is handled by the compiler, which promotes or demotes one or more operands to
    a common type before performing the operation. The compiler follows specific rules
    to determine the resulting data type, typically promoting to a higher precision
    type when necessary. These rules include:


    +   1. Data types like char, short, unsigned short are automatically promoted
    to int.

    2. When operating on values of different data types, the lower one is promoted
    to the type of the higher one.

    3. When using the assignment operator (=), the type of the expression on the right
    is converted to the type of the variable on the left.


    ![](img/33fb6b7acbb6df48a3c9564e97117da6_85_0.png)'
  merge: -1
  img_proc: true
- pgno: 86
  md: 'For example, consider the following code snippet:


    ```

    int num1 = 7;

    float num2 = 2;

    float result = num1 / num2;

    ```


    In this example, num1 is automatically converted to a float before performing
    the division operation. This is because the data types of both operands in a division
    expression must be the same. Since num2 is a float, num1 is implicitly cast to
    a float to ensure correct data types.


    Automatic type conversion attempts to maintain consistency and accuracy in calculations
    within C programs. However, it''s important for programmers to be aware of these
    conversions to avoid unintentional data loss.


    # 5.4.2 Explicit Type Conversion


    Explicit type conversion, also known as type casting, is a way to explicitly convert
    one data type to another in C. It involves using the casting operator to specify
    the desired data type for a particular value or expression.

    The syntax for explicit type casting is as follows:


    (type) value


    Here, type represents the target data type to which the value is being cast, and
    value is the expression or variable that needs to be converted.

    Explicit type conversion is useful in situations where you want to enforce a specific
    type conversion, ensuring the desired behavior in expressions. It allows you to
    control how values are converted and handle potential data loss or precision issues.


    Consider the following code snippet:


    ```

    int num1 = 5, num2 = 2;

    float truncated = num1 / num2; // answer 2.000

    float result = (float) num1 / num2; // answer 2.500

    ```


    In this example, type division ensures the division is in floating-point. Without
    the casting operator, integer division would be performed the fraction part to
    be truncated. For efficiency, C attempts to perform all operations in the lowest
    data type possible.


    A cast is not required when assigning a value from a smaller data type to a larger
    one. However, using a cast, even in such situations, is still a good idea to make
    the cast explicit and document the intentional data type change.


    In this example, cast is added to clarify the programmer''s intention:


    ```

    char ch = ''A'';

    int ascii_value = (int)ch;

    ```


    Here, we get the ASCII value of the character ''A'', which is 65. Adding the cast
    operator makes it clear that the programmer intentionally converts the 8-bit character
    data to the integer data type.'
