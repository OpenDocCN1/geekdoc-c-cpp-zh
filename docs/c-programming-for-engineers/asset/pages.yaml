  md: "# 10.5. Passing Arrays to Functions\n\nSentinels can be useful when the size\
    \ of the array is not explicitly known or working with dynamic data series. However,\
    \ it is important to ensure that the sentinel value does not appear as a valid\
    \ data value within the array.\n\n# 10.5.4 Processing Strings\n\nIn C, strings\
    \ are represented as arrays of characters, terminated by a null character ('\\\
    0'). By using the null character as a sentinel value, functions can iterate over\
    \ the characters of the string until they encounter the null character.\n\nHere\
    \ is an example of using sentinel values with strings:\n\n```\n#include <stdio.h>\n\
    \nvoid toUpperCase(char str[]) {\n int i = 0;\n while (str[i] != '\\0') { // Keep\
    \ going until sentinel is found\n  if (str[i] >= 'a' && str[i] <= 'z') {\n   \
    \ str[i] -= 32; // Convert lowercase letter to uppercase\n  }\n  i++;\n }\n}\n\
    \nint main() {\n char message[] = \"Hello, World!\";\nprintf(\"String before modification:\
    \ %s\\n\", message);\n\n // Modify the string to uppercase\ntoUpperCase(message);\n\
    \nprintf(\"String after modification: %s\\n\", message);\n return 0;\n}\n```\n\
    \nIn this example, the toUpperCase function takes a character array str as a parameter.\
    \ The function iterates over the characters of the string, converting each lowercase\
    \ letter to uppercase until it encounters the null character ('\\0').\n\nUsing\
    \ sentinel values is a widely accepted method for processing strings in C because\
    \ it allows functions to handle strings of varying lengths without explicitly\
    \ passing the size of the string. The null character serves as a natural terminator\
    \ for string processing operations.\n\nChoose the appropriate method based on\
    \ the requirements of your program to pass arrays and their sizes to functions\
    \ in C."
