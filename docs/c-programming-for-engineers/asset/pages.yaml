  md: 'Example: Swap the values of integers a and b.

    Swapping or exchanging cannot work by doing this.


    ```

    // this will not work

    int a = 3, b = 5;

    a = b;

    a = a;

    ```


    To swap the values of two integers, we need a temporary variable to store one
    of the values while we update the other. Here is an example:


    ```

    int a = 3, b = 5, temp; // Declare a temporary variable ''temp''

    ```


    ```

    // Swap the values of a and b using temp

    temp = a;

    a = b;

    temp = temp;

    ```


    ```

    printf("After swapping: a = %d, b = %d\n", a, b);

    ```


    In the update code, the temporary variable temp is used to store the value of
    a before it is overwritten by the value of b. Then, a is assigned the value of
    b, and b is assigned the value stored in temp. This effectively swaps the values
    of a and b.


