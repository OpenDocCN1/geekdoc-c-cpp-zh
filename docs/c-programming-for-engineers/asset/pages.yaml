    # 1.3.4 Programming Embedded Systems


    If you were a computer scientist, you might primarily use general-purpose computers
    throughout your career. However, as aspiring engineers, you should prepare to
    work with embedded systems. The following factors make programming for embedded
    systems more complex and specialized compared to general-purpose computers:


    +   - **Limited Resources:** Embedded systems have limited memory and processing
    power, so developer must write efficient code that minimizes resource usage.'
