    # 1.3.2 Categories of Programming Languages


    Computer software is created through a set of instructions called a *program*.
    To provide precise instructions, *programming languages* are used, as natural
    languages like English are prone to ambiguity.


    Let us by explaining the concept "abstraction." Abstraction is the process of
    simplifying complex things by focusing on the essential parts and hiding the intricate
    details. It is like driving a car without needing to know how the engine works.
    Instead, you only need to understand how to use the brakes, accelerator, and steering
    wheel. Abstraction in programming helps make code easier to read and understand
    by hiding unnecessary complexities. It allows developers to concentrate on the
    important aspects of the code without getting caught in the technical details.


    Programming languages can be grouped into different levels of abstraction, with
    each level abstracting certain aspects of the underlying hardware.


    +   - Machine language: The lowest level of programming, machine language directly
    communicates with the processor using binary code. Each instruction has a unique
    binary code, and the processor executes these instructions in sequence to perform
    specific tasks.


    +   - Assembly language: Assembly language uses mnemonic codes instead of binary
    codes, making programming easier, although hardware knowledge is still required.
    Programs are translated into machine code by an *assembler*. Assembly language
    instructions have a one-to-one correspondence with machine code instructions,
    therefore the code length and execution speed are virtually identical to machine
    language.'
  merge: -1
  img_proc: true
