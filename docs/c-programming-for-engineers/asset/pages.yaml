    int arr[] = {10, 20, 30, 40, 50};

    int n = sizeof(arr) / sizeof(arr[0]); // Calculate the size of array

    int key = 30; // Element to search for

    int index = -1; // Initialize index to -1 indicating element not found

    ```'
