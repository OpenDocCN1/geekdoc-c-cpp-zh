    # 9.2.4 Searching Arrays


    Searching in arrays aims to find a specific value or element within an array.
    Searching is used in a variety of applications, such as finding specific data
    in a dataset, implementing lookup tables, and optimizing search algorithms. There
    are several searching algorithms that can be used efficiently to locate an element
    in an array.


    +   - Linear Search: This simple algorithm sequentially checks each element of
    the array until it finds the target or reaches the end of the array.

    - Binary Search: This algorithm works on sorted arrays. It repeatedly divides
    the search space in half by comparing the target element with the middle element
    of the array. Based on the comparison, it narrows the search to the lower or upper
    half of the array, eliminating the other half at each step.


    The choice of search algorithm depends on whether the array is sorted or unsorted
    and the desired time complexity for the search operation. Linear search is simpler
    but less efficient for large arrays, while binary search is more efficient but
    requires the array to be sorted.

    Below is an example code demonstrating how to perform linear search in a C array:

    #include <stdio.h>


