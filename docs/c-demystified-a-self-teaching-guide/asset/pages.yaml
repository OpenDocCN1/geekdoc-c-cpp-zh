  img_proc: true
- pgno: 169
  md: "However, when we modify the printMessage function so that it does not always\
    \ output \"Hello world! but instead outputs whatever message we ask it to, we\
    \ need to tell it the message we want to output. We can do so by passing the function\
    \ an argument that specifies the message.\n\nThis chapter will discuss two ways\
    \ of passing arguments, by value and reference. A third way, passing arguments\
    \ by address, will be covered after we discuss pointers in Chapter 11.\n\n# Passing\
    \ Arguments by Value\n\nThe following is a modification of the program that uses\
    \ the printMessage function to output a message. This time, the content of the\
    \ message to be passed to the printMessage function as an argument:\n\n```\n#include\
    \ <iostream>\n#include <string>\nusing namespace std;\nvoid printMessage(string);\n\
    \nint main () {\n    string str;\n    cout << \"Enter a string: \";\n    cin >>\
    \ str;\n    printMessage(str);\n    return 0;\n}\nvoid printMessage(string s)\
    \ {\n    cout << \"You inputted \" << s;\n}\n```\n\nHere is some sample input\
    \ and output:\nnEnter a string: Jeff\nYou inputted Jeff\n\n# The Function Prototype\
    \ and Header\n\nBoth the function prototype and the function header have one argument,\
    \ of the string data type. However, the function prototype's argument just has\
    \ the argument's data type (string), whereas the function header has both a data\
    \ type and an argument name (string).\n\nThe function prototype may include an\
    \ argument name as well as data type, as in:\nvoid printMessage(string someArg);\n\
    \nHowever, that argument is called a dummy argument because it serves no purpose.\n\
    \nBy contrast, the function header's argument must include an argument name as\
    \ well as a data type. The purpose of that argument name in the function header's\
    \ argument is explained next.\n\n# Using the Function Argument"
