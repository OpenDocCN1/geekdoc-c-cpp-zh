- pgno: 72
  md: '# Arithmetic Operators


    An operator is a symbol that represents a specific action. We have discussed and
    discussed operators in prior chapters, including the assignment operator, = C++
    also supports operators for arithmetic, specifically addition, subtraction, multiplication,
    and division. Operators used for arithmetic are called, naturally enough, arithmetic
    operators. Table 4-1 summarizes them.


    # Table 4-1: Arithmetic Operators


    | Operator | Purpose | Example | Result |

    | --- | --- | --- | --- |

    | + | Addition | 5 + 2 | 7 |

    | - | Subtraction | 5 – 2 | 3 |

    | * | Multiplication | 5 * 2 | 10 |

    | / | Division (Quotient) | 5 / 2 | 2 |

    | % | Division (Remainder) | 5 % 2 | 1 |


    The % operator, also called the *modulus* operator, may look unfamiliar. It returns
    the remainder in division, and will be explained in the "Division Operators" section
    later in this chapter.


    Arithmetic operators are binary operators because they operate on two *operands*,
    binary being a reference to 2, and operand referring to the two values that is
    in the arithmetic expression. For example, in the expression 5 + 2, the + sign
    is the operator, and the 5 and 2 each is an operand.


    +   Not all operators are binary. For the expression -3, the negative sign, or
    negation operator, is a unary operator because it operates on only one operand,
    which is the integer 3 in this example. There are also ternary operators, which
    operate on 3 operands. However, all arithmetic operators involve two operands


    The arithmetic operator works with negative as well as positive numbers, and,
    with the exception of the modulus operator, floating point numbers (numbers with
    values to the right of the decimal point) as well as whole numbers. The addition
    operator also works with strings as well as numbers.


    This chapter will demonstrate each of the arithmetic operators in a working program
    which tracks student enrollment in a course. The scenarios in the program are
    real world, based on my experience teaching computer science at a community college
    in the San Fernando Valley of Los Angeles.


    # The Addition Operator


    At the community level I teach computer science, students often will pre-register,
    enrolling in a course before the semester starts. However, some students will
    add a course during the first few weeks of the semester.


    The following program has two variables, *total* and *added*. The program first
    assigns to *total* the value input by the user for the number of registered students.'
