- pgno: 37
  md: '# Binary Number System


    The information stored at a memory address, a series of ones and zeros, probably
    has little meaning to most of us. However, to a computer, a sequence of ones and
    zeroes is quite meaningful.


    For example, my computer, I was born in the year 11110100000. Before you tell
    me that''s impossible, I will tell you I was born in the year 1952. How could
    I have born in both the year 11110100000 and in the year 1952?


    The numbers with which we usually deal are decimal, or base 10. Each in decimal
    is represented by a digit between 0 and 9. 1952 is a decimal number.


    The sequence of ones and zeros in binary is also a number, though it may not look
    like any number you have ever seen. My birth year, expressed as the number 11110100000,
    is binary, or base 2. Each number in binary is represented by a digit that is
    0 or 1.


    The reason both decimal and binary numbers are involved in computer programming
    is because both humans and computers are involved. While humans “think” in decimal
    numbers, computers in binary.


    # Converting Decimal between Binary and Hexadecimal


    You can write computer programs without knowing how to convert binary and decimal
    numbers. However, knowing how to do so is not difficult and may help your understanding
    of what happens behind the scenes. If you are interested, read on!


    Converting a number from binary to decimal is simple. Going from right to left,
    the rightmost binary digit is multiplied by 2^0, or the second binary digit from
    the right is multiplied by 2¹, the third binary digit from the right is multiplied
    by 2², and so on, through all of the binary digits. The results of each multiplication
    are added, and the result is the decimal equivalent of the binary number. Table
    2-1 shows this calculation for the binary equivalents of the numbers 1 through
    5 in decimal.


    # Table 2-1: Binary Equivalents of the Numbers 1 through 5 in Decimal


    | Binary | Calculation | Decimal |

    |---|---|--- |

    | 0 | 0 × 2⁰ = 0 × 1 = | 0 |

    | 1 | 1 × 2⁰ = 1 × 1 = | 1 |

    | 10 | (0 × 2²) + (1 × 2¹) = 0 + 2 | 2 |

    | 11 | (1 × 2²) + (1 × 2¹) = 1 + 2 | 3 |

    | 100 | (0 × 2²) + (0 × 2¹) + (1 × 2²) = 0 + 0 + 4 | 4 |

    | 101 | (1 × 2²) + (0 × 2¹) + (1 × 2²) = 1 + 0 + 4 | 5 |


    ![](img/59a3417a6d5906fae6d8000d4c2cff76_37_0.png)'
  merge: -1
  img_proc: true
- pgno: 38
  md: "Converting a number from decimal to binary is almost as easy. Let's use 5 in\
    \ decimal as an example.\n\n+   1. You find the largest power of 2 that can be\
    \ divided into 5 with a quotient of 1. The answer is $2^2$, or 4.\n\n+   2. Remember\
    \ when converting from binary to decimal, the rightmost binary digit is multiplied\
    \ by $2^0$, or 1, the second binary digit from the right is multiplied by $2^1$,\
    \ the third binary digit from the right is multiplied by $2^2$, and so on. Since\
    \ the exponent is 2, a binary 1 goes into the third binary digit from the right,\
    \ so the binary number now is 17?, ? representing each binary digit we still need\
    \ to calculate.\n\n+   3. When you divide 5 by 4, the remainder is 1. You next\
    \ try to divide 1 by the next lowest power of 2, $2^1$, or 2. The quotient is\
    \ 0, so a binary 0 goes into the second binary digit from the right. The binary\
    \ number now is 10?\n\n+   4. When you divide 1 by 2, the remainder is still 1.\
    \ You next try to divide 1 by the next lowest power of 2, $2^0$, or 1. The quotient\
    \ is 1, so a binary 1 goes into the rightmost binary digit. The binary number\
    \ now is 101, and we're done.\n\nYou can also use the same techniques for converting\
    \ hexadecimal to decimal. When converting from hexadecimal to decimal, multiply\
    \ each hexadecimal digit (converting a to 10, b to 11, and so on) by the appropriate\
    \ power of 16. For example, 5c in hexadecimal is $(12 \times 16^0) + (5 \times\
    \ 16^1)$, which is 12 + 80 or 92.\n\nConversely, when converting from decimal\
    \ to hexadecimal, the highest power of 16 that can be divided into 92 is $16^1$,\
    \ or 16. The quotient is 5, which goes into the second digit to the right. The\
    \ remainder is 12, which is c in hexadecimal. This goes into the rightmost digit,\
    \ resulting in the hexadecimal number 5c.\n\n![](img/59a3417a6d5906fae6d8000d4c2cff76_38_0.png)"
  merge: -1
  img_proc: true
- pgno: 39
  md: '# Data Types


    The ones and zeroes that may be stored at a memory address may represent text,
    such as my name, Jeff Kent. These ones and zeroes instead may represent a number,
    as my height in inches, 72, or a number with digits to the decimal point, as my
    GPA in high school, I''ll say I was 37.5 (honestly don''t remember, it was too
    long ago). Alternatively, the ones and zeroes may represent either true or false,
    as I I a U.S. citizen.


    Data comes in many forms, and is generally either numeric or textual. Additionally,
    some numeric data uses these numbers, such as 6, 0, or –7, while other numeric
    data uses floating-point numbers, such as 6., and -6.1.


    There are different data types for each of the many forms of data. The data type
    you choose will affect not only the form in which the data is stored, but also
    the amount of memory required to store it. Let''s now take a look at these different
    data types.


    # Whole Number Data Types


    We deal with numbers all the time. Think of the answers to questions such as how
    many cars are in the parking lot, how many classes are you taking, or how many
    brothers and sisters do you have? Each answer involves a number, with no need
    to express any value to the decimal point. After all, who has 31 brothers and
    sisters?


    Often, you don''t need a large number. What unfortunate student would need 754,361
    classes at most one. However, the whole number needs to be large. For example,
    if you are studying astronomy, the moon is approximately 240,000 miles from Earth.
    Indeed, the whole number may need to be very, very. Pluto''s minimum distance
    from Earth is about 2.7 billion miles.


    Many times, the whole number won''t be negative. No matter how badly you do on
    a test, chances are you won''t score below zero points. However, some numbers
    may be below zero, such as the temperature at the North Pole.


    Because of the different needs numbers may have many, there are several different
    number data types (shown in Table 2-2). The listed sizes and ranges are typical,
    but may vary depending on the compiler and operating system. In the size/operator
    section later in this chapter, you will determine through code the different data
    types on your compiler and operating system.


    # Table 2-2: Whole Number Data Types, sizes, and Ranges


    | Data Type | Size (in Bytes) | Range |

    |---|---||

    | short | 2 | -32,768 to 32,767 |

    | unsigned short | 2 | 0 to 65,365 |

    | int | 4 | -2,147,483,648 to 2,147,483,647 |

    | unsigned int | 4 | 0 to 4,294,987,295 |

    | long | 4 | -2,147,483,648 to 2,147,483,647 |

    | unsigned long | 4 | 0 to 4,294,987,295 |'
