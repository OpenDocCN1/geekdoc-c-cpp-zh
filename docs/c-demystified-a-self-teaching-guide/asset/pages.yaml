    cout statement. No relational expression should follow the else keyword. The reason
    is that the else acts like "none of the above" in a multiple choice test. If the
    expression is not true, then the conditional statements connected to the else
    execute.


    # Don''t Put a Semicolon after the Else!


    Another common mistake is to place a semicolon after the else expression. This
    too will not cause a compiler or run-time error, but often will cause an illogical
    result.


