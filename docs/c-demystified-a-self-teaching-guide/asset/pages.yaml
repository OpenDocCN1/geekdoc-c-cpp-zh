  md: "# Nested if Statements\n\nAn if statement may appear inside another if statement.\
    \ When this is done, the inner statement is said to be \"nested\" inside the outer\
    \ statement.\n\nYou can nest if statements to determine if both of Two expressions\
    \ are true, or if one of the expressions is true.\n\n# Testing if Both Boolean\
