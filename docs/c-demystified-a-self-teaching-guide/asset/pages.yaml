  md: "# Useful Character Functions\n\nThe C++ standard library ctype contains a number\
    \ of functions that are useful when working with characters. Two of these functions\
    \ convert the case of a letter, either from lower to upper or vice versa. The\
    \ other functions are used to test the value of a character.\n\n# Case Conversion\
    \ Functions\n\nThe toupper and towlower functions each have one argument. If the\
    \ character represents a letter, A through Z or through z, the toupper function\
    \ returns the upper case of that. Conversely, the towlower function returns the\
    \ lower case of that. If the argument is not a letter, both functions return the\
    \ same character that is the argument.\n\nThe toupper and towlower functions can\
    \ be useful. For example, the following program from a previous section that requires\
