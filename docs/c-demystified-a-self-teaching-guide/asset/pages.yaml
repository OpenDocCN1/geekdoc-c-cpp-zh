  md: "# Logical Operators\n\nC++ has logical operators that enable you to combine\
    \ comparisons in one if or else statement. Table 6-1 lists the logical operators\
    \ supported by C++ and describes what each does.\n\n# Table 6-1: Logical Operators\n\
    \n| Operator | Name | What It Does |\n| --- | --- | --- |\n| && | And | Connects\
    \ relational expressions. Both expressions must be true for the overall expression\
    \ to be true. |\n| || | Or | Connects two relational expressions. If either expression\
    \ is true, the overall expression is true. |\n| ! | Not | Reverses the \"truth\"\
    \ of an expression, making a true expression false, and a false expression true.\
    \ |\n\n# The && & Operator\n\nThe && operator is also known as the Logical Operator.\
    \ It is a binary operator; it takes two Boolean expressions as operands. It returns\
    \ true only if both expressions are true. If either expression is false, the overall\
    \ expression is false. Of course, if both expressions are false, the overall expression\
    \ is false. Table 6-2 illustrates this.\n\n# Table 6-2: The Logical And Operator\n\
    \n| Expression #1 | Expression #2 | Expression #1 && Expression #2 |\n| --- |\
    \ --- | --- |\n| true | true | true |\n| true | false | false |\n| false | true\
    \ | false |\n| false | false | false |\n\nThe following program shows the use\
    \ of the Logical And operator in determining whether the user is eligible to vote,\
    \ the criteria being that the user must be at least 18 years old and a citizen.\n\
    \n```\n#include <iostream>\nusing namespace std;\nint main(void)\n{\n    int age;\n\
    \    char choice;\n    bool citizen;\n    cout << \"Enter your age: \";\n    cin\
    \ >> age;\n    cout << \"Are you a citizen (Y/N): \";\n    cin >> choice;\n```"
