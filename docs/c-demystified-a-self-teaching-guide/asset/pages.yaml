  md: "# Variables Variables\n\nYou learned in Chapter 2 that the information program\
    \ uses while it is running first needs to be stored in memory. You need to reserve\
    \ memory before you can store information. You reserve memory by declaring a variable.\n\
    \nDeclaring a variable not only reserves memory, but also gives you a convenient\
    \ way of referring to reserved memory when you need to do so in your program.\
    \ You also learned in Chapter 2 that memory addresses have hexadecimal values\
    \ such as 0012FED4. These values are hard to remember. It is much easier to remember\
    \ that, for example, relates to a test score by the name testScore. By declaring\
    \ a variable, you can refer to the reserved memory by the variable's name, which\
    \ is much easier to remember and identify with the stored information than the\
    \ hexadecimal address.\n\nWhile declaring a variable is relatively simple, requiring\
    \ only one line of code, which is happening behind the scenes. The program at\
    \ the end of this section will show you how to determine the address and size\
    \ of the reserved memory by declaring a variable.\n\n# Syntax of Declaring Variables\n\
    \nYou have to declare a variable before you can use it. Declaring a variable involves\
    \ the syntax:\n\n```\n[data type] [variable name] ;\n```\n\nThe data type may\
    \ be any of the ones discussed in Chapter 2, including int, float, bool, char,\
    \ or string. The data type tells the computer how much memory to reserve. As you\
    \ learned in Chapter 2, different data types have different sizes in bytes. If\
    \ you specify a data type with a size (on your compiler and operating system)\
    \ of 4 bytes, then the computer will reserve 4 bytes of memory.\n\nYou choose\
    \ the name; how you name a variable is discussed later in the section “Naming\
    \ the Variable.” The name is an alias by which you can refer to code of the area\
    \ of reserved memory. Then, when you use a variable that relates to a test score\
    \ testScore, you can refer to the reserved memory by the name testScore instead\
    \ of a hexadecimal value such as \n\nFinally, the variable declaration ends with\
    \ a semicolon. The semicolon tells the compiler that the statement has ended.\
    \ You can declare a variable within a function, such as main, or all functions,\
    \ just below any directives. Since for now our programs involve more than one\
    \ function, we will declare all variables within main. When our programs involve\
    \ more than one function, we will revisit the issue of where to declare variables.\n\
    \nThe following statement declares in an integer variable named testScore.\n\n\
    ```\nint main(void)\n{\n    int testScore;\n    return 0;\n}\n```"
