    # Initializing a Structure


    There are two ways you initialize a structure. The first way is to use initialization
    list. The second way is to use a constructor.


    # Initialization Lists


    The following code fragment demonstrates how you can initialize a structure with
    an initialization list:


    ```

    Person p = ("Jeff Kent", 72);

    ```


    This may seem like deja vu, since an array is similarly initialized with an initialization
    list. However, there is an important difference. While all the elements of an
    array share the same data type, the member variables of a structure may have different
    data types. This makes the order of values in the initialization list particularly
    important. For example, the following code will result in a compiler error because
    the first member variable of the structure is a C-string and you cannot assign
    an integer to a C-string:


    ```

    Person p = {72, "Jeff Kent"}; // won''t work

    ```


    # Constructors


    The constructor was discussed in Chapter 13 in connection with stream objects.
    The constructor is a function that is automatically called when you attempt to
    create an instance of an object.


    # Default Constructors


    You do not need to write a constructor. If we did not write a constructor in the
    previous program that declared a three-element Person array, assigned values to
    the member variables of each element, and then outputed their values.


    If you do not write a constructor, then a default constructor is called. The term
    default means the constructor is supplied by default if you did not write one.


    The following program demonstrates the use of the default constructor:


    ```

    #include <iostream>

    #include <string>

    using namespace std;

    const int MAX = 3;

    struct Person {

    string name;

    int height;

    ```'
