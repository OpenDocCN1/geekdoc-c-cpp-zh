- pgno: 160
  md: "# Defining and Calling a Function\n\nindicate the beginning and end of the\
    \ definition of the printMessage function where that function is called.\n\n```\n\
    #include <iostream>\nusing namespace std;\n\n// begins definition of printMessage\
    \ function\nvoid printMessage(void)\n{\n    cout << \"Hello world\";\n}\n// ends\
    \ definition of printMessage function\nint main()\n{\n    printMessage(); // calls\
    \ printMessage function\n    return 0;\n}\n```\n\nThe printMessage function is\
    \ defined first. The void keyword preceding the function name means no return\
    \ value. The void keyword in parentheses following the function name means this\
    \ function has no arguments. The parentheses could also be empty, so as main;\
    \ empty parentheses following the function in a function header is same as placing\
    \ the void keyword within the parentheses. Which syntax you choose is a matter\
    \ of taste; it is no better or worse than the other.\n\nThe body of the printMessage\
    \ function has one statement, which outputs \"Hello world! The function does not\
    \ need to contain an explicit return statement because the return type is void,\
    \ the return statement is implied. You may include an explicit return statement.\
    \ If you did, then the printMessage function would read\n\n```\nvoid printMessage(void)\n\
    {\n    cout << \"Hello world\";\n    return;\n}\n```\n\n# Calling a Function\n\
    \nUnless the printMessage function is called, it is the programming equivalent\
    \ of the tree that falls in the forest without anyone seeing or hearing it; it\
    \ is there in the program, but it doesn't do anything. The printMessage function\
    \ is called in main with line:\n\n```\nprintMessage();\n```\n\nIn this example,\
    \ printMessage is the called function, since it is the function called from main.\
    \ The empty parentheses indicate that no arguments are passed to this function.\
    \ I will show you later in this chapter how to pass arguments, as well as how\
    \ to return values.\n\nThe order of execution is as follows:\n\n+   1. Execution\
    \ starts with the main function.\n2. The first statement in main, printMessage(),\
    \ is executed.\n3. Execution shifts to the printMessage function, and begins with\
    \ the first statement in that function, which outputs \"Hello world!\""
  merge: -1
  img_proc: true
- pgno: 161
  md: "+   4. After the printMessage function completes executing, execution returns\
    \ to the main function with the next unexecuted statement, return 0, which completes\
    \ the main function.\n\nFigure 9-1 shows the order of execution graphically.\n\
    \n![](img/59a3417a6d5906fae6d8000d4c2cff76_161_0.png)\n\nFigure 9-1: Order of\
    \ execution of the Hello World Program\n\n# Prototyping\n\nSince execution always\
    \ starts with main, it seems more logical to place the main function first, ahead\
    \ of the printMessage function, such as in the following example:\n\n```\n#include\
    \ <iostream>\nusing namespace std;\n\nint main() {\n    printMessage();\n    return\
    \ 0;\n}\n\nvoid printMessage() {\n    cout << \"Hello world!\";\n}\n```\n\nThis\
    \ code will not compile. The code in main to printMessage() will be highlighted,\
    \ with the compiler error message \"undeclared identifier\".\n\nThe reason for\
    \ this compiler error is that the compiler, going from top to bottom in your code,\
    \ encounters a function call, it must already know the function's name, return\
    \ type, and arguments. This was not a problem when the printMessage function was\
    \ defined above the main function. However, when the printMessage function was\
    \ defined below the main function, the compiler encounters the call in main to\
    \ printMessage(), it does not know of the printMessage function's name, return\
    \ type, and arguments.\n\nOne solution to this is to define all functions above\
    \ main. However, this may make your code difficult to read. A program execution\
    \ starts with main, regardless of the order in which functions are defined. In\
    \ a program with many functions, the main function acts as a \"switchboard,\"\
    \ calling function after."
  merge: -1
  img_proc: true
- pgno: 162
  md: "Therefore, viewing the main function can provide an excellent overview of the\
    \ order of events. Burying the main function beneath numerous other functions\
    \ requires someone reviewing your code to hunt for main to obtain that overview.\
    \ Additionally, in complex programs in which one function calls another function\
    \ calls still another, the order in which to define these functions to avoid a\
    \ compiler error can be confusing.\n\nThe solution of preference is to prototype\
    \ every function, except main, which does not have to be prototyped since it is\
    \ required by every program. The following program shows how to prototype the\
    \ printMessage function in the Hello World program:\n\n```\n#include <iostream>\n\
    using namespace std;\nvoid printMessage(void); // this is the prototype!\n\nint\
    \ main() {\n    printMessage();\n    return 0;\n}\nvoid printMessage(void) {\n\
    \    cout << \"Hello world!\";\n}\n```\n\nThe prototype is above all function\
    \ definitions. This ensures that the compiler, compiling the code from top to\
    \ bottom, will encounter the prototype before any function.\n\nThe prototype is\
    \ similar to a function header. The primary difference is that it has a semicolon\
    \ at the end because it is a statement. By contrast, a function header must not\
    \ be followed by a semicolon.\n\n+   Note There are other differences between\
    \ the prototype and the function header when, unlike, the parentheses following\
    \ the function name includes one or more arguments. These differences will be\
    \ discussed in the section \"Sending Information to a Function\" later in this\
    \ chapter."
  merge: -1
  img_proc: true
- pgno: 163
  md: "# Variable Scope and Lifetime\n\nThus, all variables have been defined at the\
    \ top of the main function. In programs where the only function is main, those\
    \ variables can be accessed throughout the program since main is the entire program.\
    \ however, we start dividing the code into separate functions, issues arise variable\
    \ scope and lifetime.\n\nThe issue of variable scope was introduced in Chapter\
    \ 8 in connection with the do loop. The issue of variable lifetime is new.\n\n\
    # Local Variables\n\nYou can call the same function multiple times. The following\
    \ program attempts to call the printMessage function in a loop until the user\
    \ decides to stop, and each time outputs the number of times the printMessage\
    \ function has been called. The goal is that the first time the printMessage function\
    \ is called, the output will be \"This function called 1 times\" (ardon the back\
    \ guard), the second time the printMessage function is called, the output will\
    \ be \"This function called 2 times\" and so on.\n\n```\n#include <iostream>\n\
    using namespace std;\nvoid printMessage(void);\n\nint main () {\n    int times\
    \ = 0;\n    char choice;\n    do {\n        cout << \"Enter Q to quit, any other\
    \ character to continue:\";\n        cin >> choice;\n        if (choice == 'Q')\n\
    \            cout << \"Input stopped\";\n        else\n            printMessage();\n\
    \    } while (choice != 'Q');\n    return 0;\n}\n\nvoid printMessage(void) {\n\
    \    times++;\n    cout << \"This function called \" << times << \" times\\n\"\
    ;\n}\n```\n\nThis code will not compile. The reference to the string variable\
    \ times in the printMessage function will be highlighted, the error message stating\
    \ that this is an undeclared identifier.\n\nThe reason for the compiler error\
    \ is that the scope of the variable times is limited to the main function in which\
    \ it was declared. The issue of variable scope was discussed in Chapter 8 with\
    \ the do loop. You refer to a variable outside the scope in which it was declared.\
    \ A variable's scope is limited to the curly braces in which it is declared. Therefore,\
    \ the scope of the variable times is limited to the main function."
  merge: -1
  img_proc: true
- pgno: 164
  md: "Stated another way, the variable times is a local variable, in this case local\
    \ to the main function. An attempt to access a local variable outside of the function\
    \ in which it was declared in a compiler error.\n\nThis compiler error can be\
    \ fixed by moving the declaration of times into the printMessage function in the\
    \ following program:\n\n```\n#include <iostream>\nusing namespace std;\nvoid printMessage(void);\n\
    \nint main () {\n    char choice;\n    do {\n        cout << \"Enter Q to quit,\
    \ any other character to continue:\";\n        cin >> choice;\n        if (choice\
    \ == 'Q')\n            cout << \"Input stopped\";\n        else\n            printMessage();\n\
    \    } while (choice != 'Q');\n    return 0;\n}\n\nvoid printMessage(void) {\n\
    \    int times = 0;\n    times++;\n    cout << \"This function called \" << times\
    \ << \" times\\n\";\n}\n```\n\nHere is some sample input and output:\n\nEnter\
    \ Q to quit, any other character to continue: X\nThis function called 1 times\n\
    Enter Q to quit, any other character to continue: Y\nThis function called 1 times\n\
    Enter Q to quit, any other character to continue: Z\nThis function called 1 times\n\
    Enter Q to quit, any other character to continue: Q\nInput stopped\n\nWhile this\
    \ program compiles, the output is not exactly what we wanted. The variable times\
    \ in the printMessage function does not \"remember\" the previous times that function\
    \ was called.\n\nVariables, like people, have a lifetime. A person's lifetime\
    \ begins at birth. A variable's lifetime begins when it is declared. A person's\
    \ lifetime ends with death. A variable's lifetime ends when it goes out of scope.\n\
    \nThe variable times is local to the printMessage function since it was declared\
    \ in that function. Being a local variable, each time the printMessage function\
    \ is called, the variable times is created, and each time the printMessage function\
    \ ends, the variable times is destroyed. Accordingly, the variable times the second\
    \ time the printMessage function is called is not a continuation of the variable\
    \ that was created the first time the function was called. Rather, the variable\
    \ starts all again each time"
