  md: '# The fstream Standard Library


    We have been using the iostream standard library, which supports, among other
    functionalities, cin for reading from standard input (usually the keyboard), and
    cout for outputting to standard output (usually the monitor).


    Reading or writing from a file requires another standard library, fstream. The
    fstream standard library is included with the statement:


    ```

    #include <fstream>

    ```


    Both iostream and fstream have in common the word "stream". This is no accident.
    Both standard libraries concern streams of bytes. The iostream library concerns
    streams of bytes resulting from the "io" in iostream. The fstream standard library
    concerns streams of bytes resulting from the "f" in fstream, a file.


    The fstream header file defines three new data types:


    +   * ofstream This data type represents the output file stream—the "o" in ofstream
    standing for output. The ofstream data type is used to create files and write
    information to files. It cannot be used to read files.

    * ifstream This data type represents the input file stream—the "i" in fstream
    standing for input. The direction of input is from a file into your program. The
    fstream data type is used to read information from files. It cannot be used to
    create files or write information to them.

