    range is the same as an int in Table 2-2. However, as noted just before that

    table, the actual size, and therefore, range of a particular data type varies

    dending on the compiler and operating system. short may be 1 byte, or 2 bytes,

    long may be 4 bytes.


    Beginning programmers sometimes see it like shown in Table 2-2 and

    panic that they can''t possibly memorize all of it. The good news is you don''t
    have to. There is

    be sure, some memorization is necessary for almost any task. However, since there
    really

    touch information to memorize, programmers frequently resort to online help or

    reference books. Believe me, I do.


    Far more important than rote memorization is to understand how and

    why your program works as it. Therefore, this section will go into detail as to

    data types work. Some arithmetic necessarily is involved, but it is not difficult,
    and if you

    follow the arithmetic, you will have a good understanding of data types that will
    help you

    in your programming in the following chapters.


    # Unsigned vs. Signed Data Type


    Table 2-2 lists three data types: short, int, and long. Each of these three data
    types has

    ether the unsigned in front of it or not at all—as in unsigned short and short.


    Unsigned means the number is always zero or positive, negative never. Signed means

    the number may be negative or positive (or zero). If you don''t specify signed
    or unsigned,

    the data type is presumed to be signed. Thus signed and short are the same.


    Since an unsigned data type means its value is 0 or positive, negative never.

    Table 2-2 the smallest value of an unsigned short is therefore; an unsigned short

    cannot be negative. By contrast, the smallest value of a short is -32767, since
    a signed

    data type may be negative, positive, or zero.


    # Size


    Each of the whole number data types listed in Table 2-2 has a size. Indeed, all
    C++

    types have a size. However, unlike people, the size of a data type is not expressed

    in inches or pounds (a subject for most), but in bytes.


    Since a byte is the smallest unit of address that a computer can process, no data
    type

    be smaller than one. Most data types are larger than one; the whole

    data types listed in Table 2-2 are. However, regardless of the size, the number
    of

    bytes is a whole number. You cannot have a data type size of 3.5 bytes

    because .5 bytes, or 4 bytes, is too small for the computer.


    Generally, the number of bytes for a data type is the result of 2 since

    computers use a binary number system. Thus, typical data sizes are 1 byte (2⁰),
    2

    bytes (2¹), four bytes (2²), or eight bytes (2³).


    The size of a data type matters in two respects: (1) the range of different values

    dat the data type may represent and (2) the amount of memory required to store
    the data

    type.


    # Range'
