  md: '# Persistent Data: File Input and Output


    # Chapter 13: Persistent Data: File Input and Output


    # Overview


    As a kid, I had to listen to parents, or not patiently, or to endlessly (so it
    seemed at the time) lectures from my parents on how I could be better, or do better.
    After I became an adult, I realized to my amazement that my parents more often
    than not were right. After I became a parent, I realized to my horror that I was
    repeating these lectures to my own children, who, of course, enjoy these "talks"
    as much as I used to.


    One of my parents'' favorite lectures was about how important it is to be persistent.
    Again, mom and dad showed true insight, because, though persistence is a very
    valuable trait in any person, let as programmers, it is particularly important
    in programmers.


    Data, as well as programmers, should survive when the program is finished. Can
    you imagine if, after typing this chapter, when I exited Microsoft Word, everything
    I typed was lost?


    With the programs we have written so far, this is exactly what would happen. Whatever
    values we have stored in variables do not persist, or survive, when the program
    is finished. Indeed, the data is lost because the data is stored in RAM (random
    access memory), which is cleared when the program (or the computer) stops running.


    Fortunately, Microsoft Word (and most programs that matter) has the capability
    to save data to a file on the computer''s hard drive or other storage medium so
    that data later can be retrieved when needed. That data persists after the termination
    of the program or even after the computer is turned off.


    This chapter will show you how to make your data persistent by saving it to a
    file. Of course, saving the data accomplishes little unless you can later retrieve
    it, so this chapter also will show you how to retrieve data from a file.'
