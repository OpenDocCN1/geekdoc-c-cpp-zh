    # Comparing Two Strings


    You cannot use relational operators to compare the value of one C-string to another,
    such as in the following code fragment:


    ```

    char str1[80] = "Devvie Kent";

    char str2[80] = "Devvie Kent";

    if (str1 == str2)

    cout << "The two C-strings are equal";

    else

    cout << "The two C-strings are not equal";

    ```


    The output will be: "The two C-strings are not equal." The reason is that the
    value of each array name is the base address of that array. Thus, the comparison
    is not of values, but of addresses. Two variables cannot have the same address,
    so the result of a comparison for equality will be false.


    Instead, use the strcmp function to compare the values of two C-strings. The strcmp
    function has two arguments, it returns 0 if the two C-strings are equal. This
    is demonstrated by the following code fragment:


    ```

    char str1[80] = "Devvie Kent";

    char str2[80] = "Devvie Kent";

    if (strcmp(str1, str2) == 0)

    cout << "The two C-strings are equal";

    else

    cout << "The two C-strings are not equal";

    ```


    The call to the strcmp function could be changed to:


    ```

    if (!strcmp(str1, str2))

    ```


    This works since 0 is logical false, so with the ! operator result of logical
    false is changed to logical true.


    The strcmp function returns a negative value if the first C-string is "less than"
    the second one, a positive value if the first C-string is "greater than" the second
    one involves a comparison of the ASCII value of the two strings, starting with
    the first character, and continuing to each character as it takes to "break the
    tie." Table 12-2 illustrates several results of comparisons:


    # Table 12-2: Results of String Comparisons'
