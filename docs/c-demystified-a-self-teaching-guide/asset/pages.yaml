- pgno: 57
  md: '(A–Z or a–z) or an underscore (_). Secret agents may be named 007, but not
    variables. However, the second and following characters of the variable name may
    be digits, letters, or underscores.


    +   * The variable name cannot contain embedded spaces, such as My Variable, or
    punctuation marks other than the underscore character (_).


    +   * The variable name cannot be the same as a word reserved by C++, such as
    main or int.


    +   * The variable name cannot have the same name as the name of another variable
    declared in the same scope. Scope is something that will be discussed in Chapter
    8. For present purposes, this rule means you cannot declare two variables in main
    with the same name.


    Besides these limitations, you can name a variable pretty whatever you want. However,
    it is a good idea to give your variables names that are meaningful. If you name
    variables var1, var2, and so on, through var17, you might find it difficult to
    remember the difference between var8 and var9. If you find it difficult, imagine
    how difficult it would be for a fellow programmer, who didn''t even write the
    code, to figure out the difference.


    In order to preserve your sanity, or possibly your life in the case of enraged
    programmers, I recommend you use a variable name that is descriptive of the purpose
    of the variable. For example, testScore is descriptive of a variable that represents
    a score.


    The variable name testScore is a combination of two names: test and score. You
    can''t have a variable name with embedded spaces like test score. Therefore the
    two words are put together, and differentiated by capitalizing the first letter
    of the second word. By convention I use, the first letter of a variable name is
    not capitalized.


    # Naming Conventions


    A naming convention is simply a consistent method of naming variables. There are
    a number of naming conventions. In addition to the one I described earlier, another
    convention is to name a variable with a prefix, usually lowercase and consisting
    of three letters, indicating its data type, followed by a word with its first
    letter capitalized, that suggests its purpose. Some examples:


    +   * intScore Integer representing a score, such as on a test.


    +   * strName String representing a name, such as a person''s name.


    +   * blnResident Boolean variable, representing whether or not someone is someone.


    It is not particularly important what naming convention you use. What is important
    is that you use one and stick to it.


    # The Address Operator


    Declaring a variable reserves memory. You can use the address operator (&) to
    learn the address of this reserved memory. The syntax is


    ```

    &[variable name]

    ```'
