  md: 'assigned input could be a blank name and negative height:


    ```

    Enter person''s name:

    Enter height in inches: -5

    Outputting person data


    Person''s name:

    Person''s height in inches is: -5

    ```


    However, when Person is a class, the member variable could perform input validation
    before assigning the input value to it. In this regard, the setName member function
    checks if the input string is blank, and if it is, assigns "No name assigned"
    rather than a blank string to the name member variable. Similarly, the setHeight
    member function checks if the input number is negative, and if it is, assigns
    zero of the negative number to the height member variable. The following sample
    input and output demonstrates this:


    ```

    Enter person''s name:

    Enter height in inches: -5

    Outputting person data

    =================

    Person''s name: No name assigned

    Person''s height in inches is: 0

    ```


    This demonstrates another aspect of OOP, encapsulation or information-hiding.
    The applicability of information hiding is that the class data or information,
    contained in its member variables, is hidden from the "outside world" and access
    to them is restricted to member functions. Encapsulation applies because a member
    variable is packaged together with the member functions that read or write to
    it.


    One benefit, as this example demonstrated, is for the member functions that write
    to member variables to perform input validation. Another benefit could be for
    the member functions that read from member variables and return their values to
    restrict read access to only those users who in the particular system have the
    right to access that information.


