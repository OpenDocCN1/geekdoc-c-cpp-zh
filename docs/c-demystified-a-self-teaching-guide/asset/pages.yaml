- pgno: 41
  md: '# Data Types


    Range means the highest and lowest value that may be represented by a given data
    type. For example, the range of the unsigned short data type is 0 to 65,365. These
    lowest and highest values are not arbitrary, but instead can be calculated.


    The number of different values that a data type can represent is 2ⁿ, n being the
    number of bits in the data type. The size of a short data type is 2 bytes, or
    16 bits. Therefore, the number of different wholes that the short data type can
    represent is 2¹⁶, which is 65,356.


    However, the highest value that an unsigned short can represent is 65,355, because
    the unsigned data type starts at 0, not 1. Therefore, the highest that an unsigned
    data type may represent is 2ⁿ-1, n being the number of bits in the data type,
    and the minus 1 being used because we are starting at 0, not 1.


    Signed data types involve an addition. Since the range of a signed data type includes
    negative numbers, there needs to be a way of determining whether a number is positive
    or negative. We determine if a decimal number is positive or negative by looking
    to see if the number is preceded by a negative sign (−). However, a bit can only
    be 0 or 1; there is no option for a negative sign in a binary number.


    There are several explanations in science for the representation of negative numbers,
    such as signed magnitude, complement and two’s complement. We don''t need to get
    into the complexities of these explanations.


    For example, a signed data type, like an unsigned short data type, can represent
    2¹⁶ or 65,356 different numbers. However, with a signed data type, different numbers
    must be split evenly between starting at zero and going up. To do this, the ranges
    would be 0 to 32,767 and -32,768. This can be confirmed by Table 2-2, which shows
    the range of a signed data type as −32,768 to 32,767.


    Another way of explaining the range of the signed short data type is that one
    of the bits is used to store the sign, positive or negative. The highest number
    in the range is 2¹⁵−1, or 32,767; the minus 1 being used because we are starting
    at 0, not 1. The lowest number in the range is -(2¹⁵), or −32,768; there is no
    minus 1 because we are starting at -1, not.


    # Storage


    In binary, 65365 as an unsigned short is represented by sixteen: 1111111111111111.
    You cannot fit 16 bits into a single memory address. A memory address can hold
    only 8 bits, or bytes. How can you store this value in memory?


    The answer is you need two addresses to store 65365 in decimal. This provides
    two bytes of storage, sufficient to store this value. This is why the short data
    type requires 2 bytes of storage. Figure 2-3 shows how this value would be stored
    as a short data type.


    ![](img/59a3417a6d5906fae6d8000d4c2cff76_41_0.png)


    **Figure 2-3: shows memory of 65365 in decimal as an unsigned short data type'
