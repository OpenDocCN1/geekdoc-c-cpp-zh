  md: "Combining the ios::in and ios::out flags changes expected defaults. The ios::out\
    \ flag by itself causes an existing file to be overwritten, and the ios::in flag\
    \ by itself requires that the file already exist. However, the ios::in and ios::out\
    \ files are used together, the file's existing contents are preserved, and the\
    \ file will be created if it does not exist.\n\nNote\n\n# Checking if the File\
    \ Was Opened\n\nYou should not assume that a file was successfully opened with\
    \ the open member function or the constructor. There are several reasons why the\
    \ file may not have been successfully opened. If the file was not successfully\
    \ opened, your code casually assumes it and attempts to read, or write to, the\
    \ file, errors may occur.\n\nThe primary difference between opening a file for\
    \ reading and for writing is that you can write to a file that does not exist—the\
    \ operating system simply creates it—you cannot read from a file unless it already\
    \ exists. Therefore, you should check if the file was opened successfully for\
    \ reading before you attempt to read it.\n\nIf the file could not be opened for\
    \ reading, the value of the istream object that called open is NULL. You may recall\
    \ from Chapter 11 that NULL is a constant defined in standard library files whose\
    \ value is zero.\n\nAlternatively, if the file could not be opened for reading,\
    \ the istream object's fail member function returns true, which is the function's\
    \ return value if file operation, in this case attempting to open a file, was\
    \ not successful.\n\nThe following code illustrates the use of both checking if\
    \ the istream object used to call the open function is NULL and the istream object's\
    \ fail member function returns true:\n\n```\n#include <fstream>\n#include <iostream>\n\
    using namespace std;\n\nint main ()\n{\n    ifstream infile;\n    infile.open(\"\
    students.dat\");\n    cout << \"\" << infile << \" << \" << endl;\n    cout <<\
    \ \"\" << infile.fail() << \" = \" << infile.fail() << endl;\n    return 0;\n\
    }\n```\n\nIf the students.dat file does not exist, the output would be\n\n```\n\
