  md: "# The if / else Statement\n\nOne problem with the program that tests whether\
    \ a number is even is that there is no output if the number is odd. While there\
    \ is a conditional statement if the relational expression is true, there is no\
    \ corresponding conditional statement (cout << \"The number is odd\") if the relational\
    \ expression is false.\n\nThe solution is to add an else part to the if statement.\
    \ The result is an if / else statement.\n\n```\nif (relational expression)\n \
    \   conditional statement;\nelse\n    conditional statement;\n```\n\nAccordingly,\
    \ the program may be modified to add an else part to the if statement:\n\n```\n\
    #include <iostream>\nusing namespace std;\nint main(void)\n{\n    int num;\n \
    \   cout << \"Enter a whole number: \";\n    cin >> num;\n    if ( num % 2 ==\
    \ 0 )\n        cout << \"The number is even\" << endl;\n    else\n        cout\
    \ << \"The number is odd\" << endl;\n        return 0;\n}\n```\n\nRun this code.\
    \ If the input number is even, then the output again is \"The number is even.\"\
    \ However, if the number is now odd, instead of that output, the output is \"\
    The number is odd.\",\n\nEnter a whole number: 17\nThe number is odd\n\nFigure\
    \ 5-4 uses a flowchart to illustrate this program."
