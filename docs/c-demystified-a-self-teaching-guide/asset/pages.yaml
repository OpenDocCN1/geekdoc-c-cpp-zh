- pgno: 10
  md: '# How to Read this Book


    I have organized this book to be read from beginning to end. While this may seem
    pat obvious, my students often express legitimate frustration about books (or
    teachers) that, in discussing a programming concept, mention other concepts that
    are covered several chapters later or, even worse, not at all. Therefore, I have
    endeavored to present the material in a linear, logical progression. This not
    only avoids the frustration of material that is out of order, but also enables
    you in each succeeding chapter to build on the skills you learned in the preceding
    chapters.'
