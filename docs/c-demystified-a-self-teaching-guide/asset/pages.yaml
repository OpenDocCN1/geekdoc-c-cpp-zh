  md: '# Chapter 10: Arrays


    # Overview


    The variables we have worked with so far can hold only one value at a time. For
    example, if you declare an integer variable named testScore to represent a student''s
    test score, that variable can hold only one test score.


    The fact that the variable testScore can hold only one test score is not a problem
    so long as that student only takes one test. However, if the same student takes
    the same test, another student takes the same test, where do you store the second
    test score? If you store the second score in testScore, you lose the ability to
    retrieve the first score from the variable testScore, since that variable can
    hold only one test score at a time.


    Therefore, if you want to keep track of, for example, 100 tests, your code could
    look like this:


    ```

    int testScore;

    int testScore2;

    int testScore3;

    int testScore4;

    int testScore5;

    int testScore6;

    int testScore7;

    int testScore8;

    int testScore9;

    int testScore10;

    // declare testScore11 through testScore99

    int testScore100;

    ```


    Yikes! That''s a lot of code to write. Wouldn''t it be easier to declare 1 variable
    that can hold 100 values, like this:


    ```

    int testScore[100];

    ```


    The good news is that you can exactly that, using an array! An array enables you
    to use a single variable to store many values. The values are stored at consecutive
    indices, starting with zero and incrementing by one for each additional element
    of the array.


    Using an array to store 100 values has many advantages over having to declare
    100 variables that can hold only 1 value each. In addition to being less code
    to write, it is far easier to keep track of 1 variable than 100. Furthermore,
    and more important, as I will show you in this chapter, you can use a loop to
    access each element in an array, whereas this is not possible with three separate
    variables.'
  merge: -1
  img_proc: true
- pgno: 181
  md: '# Declaring an Array


    An array is a variable. Therefore, the other variables we have covered so far,
    an array must be declared before it can be used.


    The syntax for declaring an array is almost identical to the syntax for declaring
    integers, characters, or other variables. For example, you would declare an integer
    variable testScore as follows:


    ```

    int testScore;

    ```


    By contrast, you would declare an array of three test scores this way:


    ```

    int testScore[3];

    ```


    This declaration contains an array of integers. You could instead declare an array
    of floats, characters, or strings in the following manner:


    ```

    float GPA[5];

    char grades[7];

    string names[6];

    ```


    While an array can be one of several data types, all the values in the particular
    array be of the same data type. You cannot have an array in which some elements
    are floats, others strings, still integers, and so on.


    The declaration of a single variable and an array of variables begins with the
    data type followed by a variable name and ending with a semicolon. The only difference
    between declaring a variable that holds a single value and an array that is, when
    declaring an array, the variable name is followed by a number within square brackets.
    That is the array''s size descriptor.


    # Note


    There is one exception to the necessity of having a size descriptor. As discussed
    later in this chapter in the section on "Initialization," the square brackets
    may be empty if you initialize the array when you declare it.


    The purpose of the size descriptor is to tell the computer how much memory to
    reserve. The size descriptor, combined with the data type of the array, determines
    how much memory to reserve.


    As you may recall from Chapter 3, the declaration of a variable reserves memory
    for the number of bytes required by the data type of that depending on the particular
    operating system and compiler. For example, an integer variable testScore would
    reserve 4 bytes. If instead you declared an array of three integer variables,
    then the amount of memory reserved by that declaration would be 12 bytes, 4*3.'
  merge: -1
  img_proc: true
- pgno: 182
  md: "You should give careful consideration to the number of elements in an array\
    \ before you declare the array since you cannot resize an array in the middle\
    \ of a program if the array is too small or unnecessarily large. Sometimes, the\
    \ number of elements is obvious: an array of days in a week will have seven elements.\
    \ However, other times the number of elements is not intuitive. In these circumstances,\
    \ you should err on the side of declaring too many rather than too few elements.\
    \ The reason is that the consequence of declaring too many elements, wasted memory,\
    \ is less severe than the consequence of declaring too few elements, the inability\
    \ to store values in the array.\n\n# Tip\n\n# Constants\n\nEach of the size declar\
    \ used in the previous section was a literal. A literal is a value that is written\
    \ exactly as it is meant to be interpreted. For example, the number 3 is a literal.\
    \ Its value cannot be anything than 3. You cannot change the number 3 to have\
    \ a different value. Accordingly, the number 3 may be used in the following program\
    \ as the size declarator:\n\n```\n#include <iostream>\nusing namespace std;\n\
    int main ( {\n    int testScore[3];\n    return 0;\n }\n```\n\nThe size declarator\
    \ may not be a variable. The following program attempts unsuccessfully, to use\
    \ a variable numTests in declaring the size of an array:\n\nThe result is a compiler\
    \ error. The compiler will flag the declaration of the array (int testScore[numTests])\
    \ and complain that a constant expression was expected.\n\nIt is possible to declare\
    \ the size of an array if you use a different array declarator technique, dynamic\
    \ memory allocation, which is covered in Chapter 11.\n\n# Note\n\nThe term constant\
    \ is a new. A constant is a name that represents the same value throughout a program.\
    \ That value may be any one you specify. This is different from mathematical constants\
    \ such as PI, which correspond to a given value.\n\nA constant is the converse\
    \ of a variable, while a variable is a name that may represent different values\
    \ during the execution of a program. However, the value of a constant cannot change\
    \ the execution of a program."
  merge: -1
  img_proc: true
