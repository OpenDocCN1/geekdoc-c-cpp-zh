  md: "The one- and two-argument versions of the ignore member function are used with\
    \ character arrays instead of an individual character. In the one argument version\
    \ of the ignore member function, the one is the maximum number of characters to\
    \ be removed from the input buffer. For example, the statement cin.ignore(80)\
    \ removes up to the next 80 characters from the input buffer. In the two-argument\
    \ version, the second argument is a character, if encountered before the number\
    \ of characters specified in the first argument, cancels the removal from the\
    \ input buffer to. Thus, the statement cin.ignore(80, '\\n') skips the next 80\
    \ characters or until a newline is encountered, whichever comes first.\n\nNote\n\
    \n```\n*** `cin.ignore();`\n*** `cin.get();`\n```\n\nThis section will use the\
    \ no-argument version of the ignore member function, but could substitute the\
    \ no argument version of the get function to do the same effect.\n\nAccordingly,\
    \ the program modifies the previous one by one following by the call of the get\
    \ member function with a call to the ignore member function:\n\n```\n#include\
    \ <iostream>\nusing namespace std;\n\nint main(void)\n{\n    char ch;\n    do\
    \ {\n        cout << \"Press Q or q to quit, any other key to continue:\";\n \
    \       cin.get(ch);\n        cin.ignore();\n        if (ch != 'Q' && ch != 'q')\n\
    \            cout << \"You want to continue\\n\";\n        else\n            cout\
    \ << \"You quit\\n\";\n    } while (ch != 'Q' && ch != 'q');\n    return 0;\n\
    }\n```\n\nNow, as the following input and output shows, the program if you press\
    \ a printable character to continue:\n\nPress Q or q to quit, any other key to\
    \ continue: x\nYou want to continue?\nPress Q or q to quit, any other key to continue:\
    \ q\nYou quit\n\nThe reason this works is that the no-argument ignore member function\
