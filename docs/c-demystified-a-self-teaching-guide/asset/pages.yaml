  md: "Even though initialization and incrementing are not done within the parentheses,\
    \ two semicolons are nevertheless needed to separate the three expressions. While\
    \ an expression may be empty, the semicolon nevertheless is necessary.\n\n# Beware\
    \ the Infinite Loop\n\nIn the preceding program, if the statement num++ was omitted,\
    \ the loop would never stop:\n\n```\n#include <iostream>\nusing namespace std;\n\
    int main(void) {\n    int num = 1;\n    for (; num <= 10;)\n    {\n        cout\
    \ << num << \" \";\n    }\n    return 0;\n}\n```\n\nThe reason is that the condition\
    \ num <= 10 would never become false since num would start at 0 and its value\
    \ would never change because the statement num++ was omitted.\n\nThis loop that\
    \ never stops executing is called an infinite loop. Usually, it identifies itself\
    \ by a character or characters appearing in rapid succession in your console window,\
    \ with the application ending never.\n\nYou would not intend an infinite loop\
    \ in your code, but mistakes do happen; I have made this mistake a lot before.\
    \ If it happens to you, don't panic. You can use the CTRL-BREAK keyboard combination\
    \ to end the program. Knowing you have encountered an infinite loop, you can correct\
    \ the error that caused it.\n\n# A Factorial Example\n\nSo far, use of the loop\
    \ has been relatively tricky, counting numbers in ascending or descending order.\
    \ However, the loop can be used for more sophisticated programs.\n\nThe following\
    \ program calculates the factorial of a number input by the user. A factorial\
    \ is the product of all the positive integers from 1 to that number. For example,\
    \ the factorial of 3 is 3*2, which is 6, the factorial of 5 is 5*4*3*2*1, which\
    \ is 120.\n\n```\n#include <iostream>\nusing namespace std;\nint main(void) {\n\
    \    int num, counter, total = 1;\n    cout << \"Enter a number: \";\n    cin\
    \ >> num;\n    cout << \"The factorial of \" << num << \" is: \";\n    for (int\
    \ counter = 1; counter <= num; counter++)\n        total *= counter;\n    cout\
    \ << total;\n    return 0;\n}\n```"
