    to enter data. The number of times this loop may iterate is unpredictable, since
    it will keep repeating until the user either enters valid data or quits.


    This chapter will show you how to use the while loop, which is a better choice
    than a for loop when the number of times a loop will iterate is unpredictable.


    While the total number of loop iterations may be unpredictable, there are often
    situations in which the loop will iterate at least once. An example is a loop
    that displays a menu with various choices, including exiting the program. In this
    example, the menu always displays at least once; the user cannot choose to exit
    before being given that choice. In such situations, a do loop, which this chapter
    will show you how to use, is a better choice than a while loop.'
