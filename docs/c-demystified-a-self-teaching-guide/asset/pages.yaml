    This chapter showed you how to use the while loop, which works better than a for
    loop when the number of times a while loop execute is unpredictable. When the
    parentheses following the for keyword consists of three expressions, initialization,
    condition, and update, the parentheses following the while keyword consists only
    of the condition; you have to take care of initialization and update elsewhere
    in the code.


    There are also situations in which the number of times this while loop execute
    is unpredictable, the loop will execute at least once. An example discussed in
    this chapter is a loop that displays a menu with various choices, exiting the
    program. In this menu example, the menu always displays at least once; the user
    cannot choose to exit before giving that choice. In such situations, a do loop
    is a better choice than a while loop. This chapter showed you how to use a do
    loop, and introduced the idea of variable scope.


    So far, all of our programs have only one function, main. While all programs must
    have a main function, a C++ program may have additional functions. As programs
    get more sophisticated, it is helpful not to put all the code in main, but instead
    to allocate the code among different functions. The next chapter will show you
    how to add and use additional functions.'
