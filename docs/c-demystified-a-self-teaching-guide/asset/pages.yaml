    # Opening a File for Reading


    The discussion in the previous section concerning opening a file for writing also
    applies to opening a file for reading. The primary difference is that the object
    you may use, may be, in addition to an ifstream member function, or ifstream object
    instead of an ofstream object. Additionally, the file to be opened already exists.
    Unlike a file for writing, attempting to open a file for reading will not automatically
    create it if does not yet exist. This issue is discussed further in the next section.


    The following statements use the open member function of the ifstream object to
    open a file for reading:


    ```

    ifstream infile;

    ifile.open("students.dat");

    ```


    You could accomplish the same purpose using the ifstream object, specifying by
    a mode flag that the file is opened for reading only:


    ```

    fstream file;

    afile.open("students.dat", ios::in);

    ```


    The following statement uses the ifstream constructor to open a file for reading:


    ```

    ifstream infile("students.dat");

    ```


    You could accomplish the same purpose using the ifstream constructor, specifying
    in the second argument the file mode flag that the file is opened for reading
    only:


    ```

    fstream file("students.dat", ios::in);

    ```


    # Opening a File for Reading and Writing


    You can use the ifstream object to open a file for reading and for writing. You
    cannot use either the ofstream or ifstream object for this purpose, as an ofstream
    object cannot be used to write files.


    The following code fragment uses the open member function of the ifstream object
    for this purpose:


    ```

    fstream file;

    afile.open("students.dat", ios::in | ios::out);

    ```


    Alternatively, you can use the two-argument ifstream constructor:


    ```

    fstream file("students.dat", ios::in | ios::out);

    ```


    Both alternatives use the bitwise or operator (| in the earlier section "Second
    Argument—File Mode" to combine the file mode flags for input and output.'
