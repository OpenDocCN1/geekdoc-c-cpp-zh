  md: "# Increment and Decrement Operators\n\nIncrement means to increase a value\
    \ by one. Conversely, decrement means to decrease a value by one. C++ has an increment\
    \ operator that you can use to increase a value and one decrement operator. This\
    \ section will show you how to use both, something that will be useful in the\
    \ next section for the for loop, which uses increment and decrement operators.\n\
    \n# The Increment Operator\n\nIn the following program, the statement num += 1\
    \ increases the value of the integer variable num, which was initialized to the\
    \ value 2, by 1, so the output will be 3.\n\n```\n#include <iostream>\nusing namespace\
    \ std;\nint main(void)\n{\n    int num = 2;\n    num += 1;\n    cout << num;\n\
    \    return 0;\n}\n```\n\nAnother way to accomplish the same result is by using\
    \ the increment operator,++. The increment operator is unary—that is, it operates\
    \ on one operand. Operand generally is a whole number variable, such as an int.\
    \ You can use the increment operator simply by changing the program we just ran\
    \ by replacing the statement num += 1 with the statement num++.\n\n```\n#include\
    \ <iostream>\nusing namespace std;\nint main(void)\n{\n    int num = 2;\n    num++;\n\
    \    cout << num;\n    return 0;\n}\n```\n\nThe same output would occur if you\
    \ substituted the statement ++num for num++:\n\n```\n#include <iostream>\nusing\
    \ namespace std;\nint main(void)\n{\n    int num = 2;\n    ++num;\n    cout <<\
    \ num;\n    return 0;\n}\n```\n\nPlacing the ++ before the variable num is prefix\
    \ incrementing—the \"pre\" indicating that the increment operator precedes its\
    \ operand. The ++ before the variable num is postfix incrementing—the \"post\"\
