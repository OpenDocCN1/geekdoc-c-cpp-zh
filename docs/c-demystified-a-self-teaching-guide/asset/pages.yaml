  md: '# Summary


    A computer program''s instructions and data have to be in the computer''s memory
    for the program to work. There are three principal access memory locations on
    your computer: the central processing unit (CPU), random access memory (RAM),
    and persistent storage. Computer programs use RAM to store instructions and data.


    Instructions and data are stored at addresses, represented by a sequential series
    of numbers. A computer stores information in a series of ones and zeros. However,
    a computer cannot process information as small as a single bit. Each one or zero
    is a bit. Eight bits, or one *byte*, is the smallest unit of information that
    a computer can process. Therefore, each address stores one byte of information.


    Some information is numeric; other data is textual. Each type of information is
    referred to as a data type. The principal data type categories are whole numbers,
    floating-point numbers, and text. However, all data types have in common a characteristic
    of size, which is the number of bytes required to store information of that data
    type. A data type''s size also determines its range, which is the highest and
    lowest number that can be stored by that data type.


    The size of a data type varies depending on the compiler and operating system.
    You may use the sizeof operator to determine the size of a data type on your particular
    system.'
  merge: -1
  img_proc: true
