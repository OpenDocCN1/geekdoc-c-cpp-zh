    # # Assigning a Value to a String


    You cannot assign the value of one C-string to another with an assignment operator,
    such as in the following code fragment:


    ```

    char* target = "Jeff Kent";

    char source[80] = "Micaela";

    target = source;

    ```


    The value of *source* is the base address of the target array. The operator assigns
    the *address* of *source* to *target*, not the *value* of *source* to *target*.


    Instead, you use the *strcpy* function to assign the value of one C-string to
    another C-string (the target string). The *strcpy* function takes two arguments.
    The first, target, is a pointer to a character array. This argument cannot be
    a string literal since a value is assigned to it. The second, the source string,
    may be a character array, a pointer to a character array, or a string literal.
    The following code fragment illustrates the use of the *strcpy* function:


    ```

    char* target = "Jeff Kent";

    char source[80] = "Micaela";

    strcpy(target, source);

    ```


    You need to be careful when using the *strcpy* function that the source C-string
    is not larger than the target C-string. To solve this, you can use the *strncpy*
    function. This function has a third argument, an integer, representing how many
    characters from the source C-string to the target C-string. The following code
    fragment illustrates the use of the *strncpy* function:


    ```

    char* target = "Jeff Kent";

    char source[80] = "Micaela";

    strncpy(target, source, 9););

    ```


    In contrast to C-strings, you may use the assignment operator to assign the value
    of one C++ string variable, such as in the following code fragment:


    ```

    string target = "Jeff Kent";

    string source = "Micaela";

    target = source;

    ```


    # # Appending to a String


    The *strcpy* function overwrites the contents of the target C-string with the
    contents of the source C-string. Sometimes you do not want to overwrite the contents
    of the target C-string, but instead add, or append, to its contents with the contents
    of the source C-string. Under these circumstances, use the *strcat* function,
    the "cat" is shorthand for "concatenate", which is a longer way of saying.


    The *strcat* function, like the *strcpy* function, takes two arguments, the string
    target, a variable pointer to a character array, and the source C-string, which
    may be a character array, a pointer to a character array, or a string literal.
    The following code fragment illustrates


    ```

    char target[80] = "Jeff Kent";

    ```'
