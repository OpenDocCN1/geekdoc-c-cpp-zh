- pgno: 129
  md: "the next section, \"The Difference Between Prefix and Postfix,\" there is a\
    \ difference between prefix and postfix decrementing (or incrementing) when the\
    \ statement has not one operator.\n\n# The Difference Between Prefix and Postfix\n\
    \nThe following program is similar to the previous program that illustrated the\
    \ increment operator.\n\n```\n#include <iostream>\nusing namespace std;\nint main(void)\n\
    {\n    int num = 2;\n    cout << num++;\n    return 0;\n}\n```\n\nHowever, instead\
    \ of two statements:\n\n```\nnum++;\ncout << num;\n```\n\nThis program uses one\
    \ statement:\n\n```\ncout << num++;\n```\n\nThere are two operators in this statement:\
    \ the increment operator ++ and the stream insertion operator <<. The issue is\
    \ of precedence; which operation occurs first.\n\nThe output of this program is\
    \ 2. The reason is when an increment or decrement operator is postfix, that operation\
    \ is the last to occur. Therefore, the output of num occurs first while the variable's\
    \ value is 2, and then the value of num is incremented from 2 to 3.\n\nNow, change\
    \ the line:\n\n```\ncout << ++num;\n```\n\nto the line:\n\nso the program now\
    \ reads\n\n```\n#include <iostream>\nusing namespace std;\nint main(void)\n{\n\
    \    int num = 2;\n    cout << ++num;\n    return 0;\n}\n```\n\nThis time, the\
    \ output of this program is 3 instead of 2. The reason is that an increment or\
    \ decrement operator is prefix, that operation is the first to occur. Therefore,\
    \ num first is incremented from 2 to 3 before the value of num is outputted.\n\
    \nThe distinction between prefix and postfix also arises frequently with arithmetic\
    \ operators."
