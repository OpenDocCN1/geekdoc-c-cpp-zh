    \ std;\nint main(void)\n{\n    int num = 1;\n    cout << num++;\n    cout << num++;\n\
    \    cout << num++;\n    cout << num++;\n    cout << num++;\n    cout << num++;\n\
    \    cout << num++;\n    cout << num++;\n    cout << num++;\n    return 0;\n}\n\
    ```\n\nHowever, you could write the same program with less code by using a for\
    \ loop:\n\n```\n#include <iostream>\nusing namespace std;\nint main(void)\n{\n\
    \    for (int num = 1; num <= 10; num++)\n        cout << num << \" \";\n    return\
    \ 0;\n}\n```\n\nThe difference between the two programs would be more pronounced\
    \ if you changed the specification from outputting the numbers between 1 and 10\
