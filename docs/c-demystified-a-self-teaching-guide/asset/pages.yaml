    Updating the counter within the condition requires two changes from the previous
    code. First, the value of num has to be initialized to 0 instead of 1 because
    the increment inside the parentheses during the first iteration of the loop would
    change that variable''s value to 1. Second, the relational operator in the condition
    is < than <= because the value of num is incremented before it is outputted.


    Updating the counter within the condition raises the question: Given the condition
    num++ < 10, which comes first, the comparison or the increment? Since the increment
