- pgno: 8
  md: '# What this Book Covers


    I strongly believe that the best way to learn programming is to write programs.
    The concepts covered by the chapters are illustrated by clearly and thoroughly
    explained code. You can run this code yourself, or use the code as the basis for
    writing further programs that expand on the concepts covered.


    Chapter 1 gets you started. What program is a programming language. It then discusses
    the anatomy of a basic C++ program, both the code you see and what happens ''under
    the hood'', explaining how the preprocessor, compiler, and linker work to translate
    your code into instructions the computer can understand. The final chapter teaches
    you how to use an integrated development environment (IDE) to create and run a
    project.


    Being able to create and run a program that outputs "Hello World" as in Chapter
    1 is a good start. However, most programs require the storing of information of
    different types, such as numeric and text. Chapter 2 first explains the different
    types of memory, including random access memory, or RAM. It then discusses addresses,
    where data is stored in RAM, and by bytes, the unit of value for the amount of
    space required to store information. Because information comes in different forms,
    this next chapter discusses the data types for whole numbers, floating point numbers
    and text.


    The featured star of Chapter 3 is the variable, which not only removes the need
    of memory to store information, but also provides you with a name by which information
    later may be retrieved. Because the purpose of a variable is to store a value,
    a variable without an assigned value is as pointless as a bank account without
    money. Therefore, this chapter explains how to assign a value to a variable, at
    compile time using the assignment operator or at runtime using the cin object
    and string extraction operator.


    As a professional chess player, I have marveled at the ability of chess computers
    to play championships on even turns. The reason these computers have this ability
    is because they can calculate far more quickly and accurately than we can. Chapter
    4 covers arithmetic operators, which we use in code to harness the computer’s
    calculating ability.


    As programs become more sophisticated, they often branch in two or more directions
    based on whether a condition is true or false. For example, if a calculator program
    would use the arithmetic operators you learned in Chapter 4, your program first
    would need to determine whether the user chose addition, subtraction, multiplication,
    or division before performing the arithmetic operation. Chapters 5 and 6 introduce
    relational and logical operators, which are useful in determining a user’s choice,
    and the if and switch statements, used to direct the path based on the user’s
    choice.


    When you were a child, your parents might have told you not to repeat yourself.
    However, sometimes your code needs to repeat. For example, if an user enters invalid
    data, your code can continue to ask whether they want to run or quit until the
    user enters valid data or quits. The primary subject of Chapters 7 and 8 are loops,
    which are used to repeat execution until a condition is no longer true. Chapter
    7 starts with the for loop, and also introduces the increment and decrement operators,
    which are used when working with loops. Chapter 8 completes the'
  merge: -1
  img_proc: true
- pgno: 9
  md: 'discussion of loops with the while and do while loops.


    Chapter 9 is about functions. A function is a block of one or more code statements.
    All of your C++ code that executes is written within functions. This chapter will
    explain why and how you should write your own functions. It explains how to prototype
    and define a function, and how to call the function. This chapter explains how
    to use arguments to pass information from the called function to a called function
    and return a value back from the called function to a calling function. This chapter
    winds up by explaining variable scope and lifetime, both explaining and distinguishing
    local, static, and global variables.


    Chapter 10 is about arrays. The variables declared previously in the book, which
    may only hold one value at a time, arrays may hold multiple values at one time.
    Additionally, arrays work very well with loops, which are covered in Chapters
    7 and 8. This chapter distinguishes arrays from arrays of other data types. differ
    in that their initial value changes while the program is running.


    Chapter 11 is about pointers. The term often strikes in heart of a C++ student,
    it shouldn''t. As you learned in Chapters 2 and 3, information is stored at addresses
    in memory. Pointers provide you with an efficient way to access these addresses.
    You will also learn in this chapter about the indent operator and dereferencing
    them as well as pointer arithmetic.


    Most information, including user input, is in the form of character, C-string,
    and C++ string class data types. Chapter 12 shows you functions are useful in
    working with these data types, including member functions of the cin object.


    Information is stored in files so it will persist after the program ends. Chapter
    13 teaches you about the file stream, ifstream, lstream, and ofstream, and how
    to use them and member functions to open, read, and close files.


    Finally, to provide you with a string basis to go to the next step after this
    introductory level book, Chapter 14 introduces you to OOP, Object-Oriented Programming,
    and two programming concepts heavily used in OOP. structures and classes.


    A Quiz follows each chapter. Each quiz helps you confirm that you have absorbed
    the basics of the chapter. Unlike quizzes you took in school, you also have an
    answers appendix.


    Similarly, this book concludes with a Final Exam in the first appendix, and the
    answers to that found in the second appendix.


    **Team LiB**


    **PREVIOUS NEXT**'
