  md: "# Assigning Values to Variables\n\n> Tip Knowing when to >> instead of << can\
    \ be confusing. It may be helpful to remember that the >> and << operators point\
    \ in the direction that data is moving. For example in the expression >> var,\
    \ data is moving from standard input into the variable. By contrast, in the expression\
    \ << var, the << indicates data is moving from the variable to standard output.\n\
    \nWhen your program reaches a cin statement, its execution halts until the user\
    \ types something at the keyboard and presses the ENTER key. Try running your\
    \ program with a blinking cursor until you type a number. Once you type a number\
    \ and press ENTER, the program will output \"Your test score is followed by the\
    \ number you inputted. For example, if you input 100, the output will be \"Your\
    \ test score is 100.\"\n\n```\n#include <iostream>\nusing namespace std;\nint\
    \ main(void) {\n    int testScore;\n    cin >> testScore;\n    cout << \"Your\
    \ test score is \" << testScore << \"\\n\";\n    return 0;\n}\n```\n\nThis program\
    \ is not very friendly. Unless the user happened to know what your program did,\
    \ they would not know what information is being asked of them. Accordingly, a\
    \ cin statement is preceded by a cout statement telling the user what to do. This\
    \ is called a prompt.\n\n```\n#include <iostream>\nusing namespace std;\nint main(void)\
