  md: "While neither a literal nor a constant changes its value during execution of\
    \ a program, they are not the same. While a constant is a name that represents\
    \ a value, a literal is not a name, but instead the value itself.\n\nYou may use\
    \ a constant instead of a literal as a size declarator. The size declarator in\
    \ the following program uses a constant for the value 3 rather than the literal.\n\
    \n```\n#include <iostream>\nusing namespace std;\nint main () {\n    const int\
    \ numTests = 3;\n    int testScore[numTests];\n    return 0;\n}\n```\n\nGoing\
    \ back to the definition of a constant, a name that represents the same value\
    \ throughout a program, the name is numTests, and it represents the value 3.\n\
    \nThe syntax for declaring a constant is similar to, but not the same as, a syntax\
    \ for declaring a variable. Each requires a data type (here int) and a variable\
    \ name (here numTests) and ends in a semicolon. However, there are two differences.\n\
    \nFirst, the declaration of a constant must begin with the const keyword. This\
    \ tells the compiler that you are declaring a constant instead of a variable.\n\
    \nSecond, the declaration terminates by assigning the constant value. You also\
    \ may assign a variable when you are declaring it; you learned in Chapter 3 this\
    \ is called optional. The other hand, assigning a constant value when you declare\
    \ it is mandatory; the declaration of the constant will not compile if you don't,\
    \ the compiler erroring that a constant object may not be initialized. The reason\
    \ is, since you cannot assign a value to a constant after you declare it, the\
    \ only time you can assign a value to a constant is when you declare it.\n\n>\
    \ The declaration of a constant reserves memory just as the declaration of a variable.\
    \ The difference is that with a constant the value stored at the memory address\
    \ cannot change during the life of the program.\n\nThe following program illustrates\
    \ that you cannot assign a value to a constant after you declare it:\n\n```\n\
    #include <iostream>\nusing namespace std;\nint main () {\n    const int numTests\
    \ = 3;\n    cout << \"Enter the number of test scores:\";\n    cin >> numTests;\n\
    \    int testScore[numTests];\n    return 0;\n}\n```\n\nThe result is a compiler\
    \ error. The compiler will flag the attempt to assign a value to the constant\
    \ (cin >> numTests) which has a right-hand operand that is. This is simply another\
    \ way of saying you can't assign a value to a constant after you declare it."
