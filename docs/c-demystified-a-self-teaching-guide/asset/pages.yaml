- pgno: 6
  md: '# Introduction


    C++ was my first programming language. While I have learned others, I''ve always
    thought C++ was the "best" programming language, perhaps because of the power
    it gives the programmer. Of course, this power is a double-edged sword, also being
    the power to hang yourself if you are not careful. Nonetheless, C++ has always
    been my favorite programming language.


    C++ also has been the first choice of others, not just in the business world because
    of its power, but also in academia. Additionally, many other programming languages,
    including Java and C#, are based on C++. Indeed, the Java programming language
    was written using C++. Therefore knowing C++ also means learning other programming
    languages easier.


    # Why Did I Write this Book?


    Not as road to riches, fame, or beautiful women. I might be misguided, but I''m
    not completely delusional.


    To be sure, there are many introductory level books on C++. Nevertheless, I wrote
    this book because I believe I bring a different and, I hope, valuable perspective.


    As you may know from my author biography, I teach computer science at Los Angeles
    Valley College, a community college in the San Fernando Valley area of Los Angeles,
    where I grew up and have lived most of my life. I also write computer programs,
    but teaching programming has provided me with insights into how students learn
    I could never obtain from writing programs. These insights are gained not just
    from answering student questions during lectures. I spend each week in our college''s
    computer lab helping students with their programs, and many hours each week reviewing
    and grading their assignments. Patterns emerge when teaching programming methods
    and, the level of difficulty at which to introduce a new topic, and so on. I learn
    from my students that they are my best testers in my never-ending attempt to become
    a better teacher, but there is much truth in this hope.


    Additionally, my beta testers... err, students, seem to complain about the textbook
    matter book I wrote. Many ask me why I wrote a book they could use to learn C++.
    They may be saying this flatter me (I''m not saying it doesn''t work), or for
    the more sinister reason that think they will be able to blame the teacher for
    a poor book as well as poor instruction. Nevertheless, having written other books,
    these questions planted in my mind of writing a book that, in addition to being
    sold to the general public, could also be used as a supplement to a textbook.'
  merge: -1
  img_proc: true
- pgno: 7
  md: '# Who Should Read this Book


    Anyone would pay for it! Just kidding, though no buyers will be turned away.


    It is hardly news that publishers and authors want the largest possible audience
    for their books. Therefore, this section of the introduction usually tells you
    this book is for whoever you may be and whatever you do. However, no programming
    book is for everyone. For example, if you exclusively create game programs using
    Java, this book may not be for you (though being a community college teacher I
    may be your next customer if you create a space beasts vs. community college administrators
    game).


    While this book is, of course, not for everyone, it very well may be for you.
    Many people need or want to learn C++, either as a degree program, job training,
    or even as a hobby. C++ is not the easiest subject to learn, and unfortunately
    many books don''t make learning C++ any easier, throwing at you a veritable telephone
    book of complexity and jargon. By contrast, this book, as its title suggests,
    is designed to “demystify C++. Therefore, it goes straight to the core concepts
    and explains them in a logical order and in plain English.'
