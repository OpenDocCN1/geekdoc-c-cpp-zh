  md: "# The Do While Loop\n\nThe do while loop is similar to the while loop. The\
    \ primary difference is that with a do while loop the condition is tested at the\
    \ bottom, unlike a while loop where the condition is tested at the top. This means\
    \ that a do while loop will always execute at least once, whereas a while loop\
    \ may never execute if all its condition is false at the outset.\n\n# Syntax\n\
    \nThe syntax of a do while loop is\n\n```\ndo {\n    statement(s);\n} while (condition);\n\
    ```\n\nThe do keyword starts the loop. The statement or statements belonging to\
    \ the loop are enclosed in curly braces. After the close curly brace, the keyword\
    \ appears, followed by the condition in parentheses, terminated by a semicolon.\n\
    \n# A Do While Loop Example\n\nThe following program is a modification of the\
    \ one earlier in this chapter that used a while loop to continue to prompt the\
    \ user a positive number until either the user did or quit, and then outitted\
    \ the positive number or the message that the user did not enter a positive number.\
    \ This modification uses a do loop instead of a while loop.\n\n```\n#include <iostream>\n\
    using namespace std;\nint main(void) {\n    int num;\n    char choice;\n    bool\
    \ quit = false;\n    do {\n        cout << \"Enter a positive number: \";\n  \
    \      cin >> num;\n        if (num <= 0) {\n            cout << \"Number must\
    \ be positive; try again (Y/N) : \";\n            cin >> choice;\n           \
    \ if (choice != 'Y')\n                quit = true;\n        }\n    } while (num\
    \ <= 0 && quit == false);\n    if (quit) {\n        cout << \"The number you entered\
    \ is \" << num << \" \";\n    } else {\n        cout << \"You did not enter a\
    \ positive number\";\n        return 0;\n    }\n}\n```\n\nThe following are sample\
    \ inputs and outputs. The first one has the user successfully enter a positive\
    \ number first time."
