    In essence, the code sizeof(int) is replaced by 4 in the output.


    The code sizeof(int) is called an *expression*. An expression is a code statement
    that has a value, usually has to be evaluated when the program runs. An example
    of an expression is 4 + 4, which has a value, 8, that would be evaluated when
    the program runs.


    When the code runs, the expression sizeof(int) is evaluated as having the value
    4, which is outputted.


    By contrast, the position of the statement within double quotes, "Size of int
    is," is outputted literally as "Size of int is." There is no need for an evaluation.
    Instead, this is considered a *literal string*. The term string refers to the
    data type, a series of characters, and the term literal refers to the fact that
    the string is outputted literally, without evaluation. The string "Hello World!"
    in the code statement Chapter 1 was also a literal string.


    # # Outputting an Expression


    The expression sizeof(int) is separated by the stream insertion operator (<<)
    from the literal string "Size of int is." If the code statement instead were


    ```

    cout << "Size of int is sizeof(int)\n";

    ```


    then the output would be quite different:


    **Size of int is sizeof(int)**


    The reason is sizeof(int), being encased inside the double quotes, would be treated
    as a literal string, not an expression, and therefore not be evaluated, but displayed
    as is.


    Since "Size of int" is a literal string and sizeof(int) is an expression, they
    need to be differentiated before being inserted into the output string by placing
    a stream insertion operator between the literal string and the expression.'
  merge: -1
  img_proc: true
- pgno: 51
  md: 'Note The string "Size of int ends with a space between "is" and the following
    4. Without that space, the output would be "Size of int is4." You, as the programmer,
    have the responsibility to ensure proper spacing; C++ won''t do it for you.


    # Escape Sequences


    The string "n" following the expression(int) is also a literal string, so it,
    too, is separated by a string insertion operator from the sizeof(int) expression.
    However, "n" is a special type of string called escape sequence.


    C++ has many escape sequences, though this may be the most common one. This particular
    escape sequence causes the cursor to go to the next line for further printing.
    Without it, all the output will be on one line.


    The "n" in a string is not displayed literally even though it is encased in double
    quotes. The reason is that the backslash signals out that this is an escape sequence.


    Table 2-6: Common Escape Sequences


    | Escape Sequence | Name | What It does |

    |---|---|---|

    | \a | Alarm | Causes the computer to beep |

    | \n | newline | Causes the cursor to go to the next line |

    | \t | Tab | Causes the cursor to go to the next tab stop |

    | \ | Backslash | Causes a backslash to be printed |

    | \'' | Single quote | Causes a single quote to be printed |

    | \" | Double quote | Causes a single quote to be printed |


    ![](img/59a3417a6d5906fae6d8000d4c2cff76_51_0.png)'
