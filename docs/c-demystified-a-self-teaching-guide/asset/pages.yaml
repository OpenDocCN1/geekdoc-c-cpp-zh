    make the common mistake of using another of the pointers with the dynamically
    created memory. You should only use the delete operator with a pointer that points
    to dynamically created memory. If that dynamically allocated memory has already
    been deallocated using the delete operator, using the delete operator second time
    will lead to unpredictable results.


