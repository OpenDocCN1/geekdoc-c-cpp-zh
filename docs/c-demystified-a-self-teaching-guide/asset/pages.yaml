    There are four syntax differences between these two programs.


    +   1. In the function prototype, you use an ampersand (&) for passing by reference
    but an asterisk (*) for passing by address:

    ```

    void doubleIt(int&); // by reference

    void doubleIt(int*); // by address

    ```


    +   2. Similarly, in the function header, you use an ampersand (&) for passing
    by reference but an asterisk (*) for passing by address:

    ```

    void doubleIt(int& x) // by reference

    void doubleIt(int* x) // by address

    ```


    +   3. When you call the function, you don''t need to dereference the argument
    operator (&) for passing by reference, but you do need one for passing by address
    since you are supposed to be passing by the address of x:

    ```

    doubleIt(num); // by reference

    doubleIt(&num); // by address

    ```


    +   4. In the body of the called function, you don''t need to dereference the
    argument when you pass it by reference, but you do need to when passing it by
    address since x, being passed by address, is not a value but is instead a pointer:

    ```

    // by reference no dereference

    {

    cout << "The number to be doubled is " << x << endl;

    x *= 2;

    cout << "The number doubled in doubleIt is " << x << endl;

    }

    // by address need to dereference

    {

    cout << "The number to be doubled is " << *x << endl;

    *x *= 2;

    cout << "The number doubled in doubleIt is " << *x << endl;

    }

    ```


    You might be wondering why, with a single variable argument, I would want to pass
    it by address when the syntax for passing by reference seems easier. The answer
    I give my students is that there are certain sadistic computer science teachers
    (I''m not mentioning any names here) who insist their students pass by address
    to make them suffer. All kidding aside, there are actually library functions that
    do use pass by address. Additionally, when using dynamic memory allocation and
    returning pointers from functions (to be covered in the following sections), passing
    by address may be the option.'
