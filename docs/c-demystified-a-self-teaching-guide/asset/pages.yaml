- pgno: 43
  md: 'be sufficient normally to say the location is 98 miles away; precision such
    as 98.177 miles usually is not necessary.


    However, other times fractions, expressed as numbers to the right of the decimal
    point, are very important. My Lasik surgery is an extreme example, but there are
    many other common ones. If you had a 3.9 GPA, you would probably not want the
    school to just forget about the .9 and say your GPA was 3. Similarly, a bank that
    keeps track of dollars not but cents and deposits would, with millions of transactions
    now, have inaccurate information as to how much money it has, and depositors have.


    Accordingly, there are floating-point data types that you can use when a value
    to the right of the decimal point is important. The term floating point comes
    from the fact that there are no fixed digits before and after the decimal point;
    that is, the decimal point can float. Floating-point numbers are also referred
    to as reals.


    Table 2-3 lists the floating-point number data types. With the whole number types,
    the listed sizes and ranges are typical, but may vary depending on the compiler
    and operating system.


    # Table 2-3: Floating-point Number Data Types, Sizes, and Ranges


    | Data Type | Size (in Bytes) | Range (in E) |

    | --- | --- | --- |

    | float | 4 | ±3.4E-38 to ±3.4E38 |

    | double | 8 | ±1.7E-308 to ±1.7E308 |

    | long double | 10 | ±3.4E-4932 to ±3.4E4932 |


    > Note The size of a double on many combinations of compilers and operating systems
    may be 8 bytes, not 10.


    # Scientific and E Notations


    The range column in Table 2-3 may not look like any number you have ever seen
    before. That is because these are not decimal numbers, but instead numbers expressed
    in E notation, the letter E standing for exponent.


    The float data types can store very large numbers, such as (in decimal) 10000000000000000000000000000000,
    which could be a distance across the universe. The float data types can also store
    very small numbers, such as .00000000000000000000000000000001, which could be
    the diameter of a subatomic particle.


    Rather than giving across the page, the number can be expressed more compactly.
    One way is scientific notation, another is E notation. Table 2-4 shows how certain
    floating-point numbers are represented in both notations.


    # Table 2-4: Scientific and E Notation Representations of Floating Point Values


    | Decimal Notation | Scientific Notation | E Notation |

    | --- | --- | --- |

    | 123.45 | 1.2345 x 10² | 1.2345E2 |

    | 0.0051 | 5.1 x 10⁻³ | 5.1E-3 |

    | 1,200,000 | 1.2 x 10⁶ | 1.2E9 |'
