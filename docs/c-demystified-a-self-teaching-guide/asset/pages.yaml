  md: "#  Assigning a Value to a Pointer\n\nThis section will explain how you assign\
    \ a value to a pointer. Though, before I explain how, perhaps I explain why.\n\
    \n# Why You Should Not Try to Use an Unassigned Pointer\n\nBack in elementary\
    \ school we were taught a verse: \"I shot an arrow into the air, where it lands,\
    \ I don't.\" Looking back, I wonder when young children were taught this verse.\
    \ Maybe rhyme, but its message is not appropriate for little ones. However, when\
    \ you declare a pointer then use it without first assigning it a value, you are,\
    \ alas, doing the programming equivalent of that.\n\nThe following program declares\
    \ a pointer and attempts to output its value first assigning it a value:\n\n```\n\
    #include <iostream>\nusing namespace std;\n\nint main()\n{\n    int* iPtr;\n \
    \   cout << \"The value of iPtr is \" << iPtr << endl;\n    return 0;\n}\n```\n\
    \nThe runtime, depending on your compiler and operating system, may be a compiler\
    \ error, a runtime error, or a crash. Regardless, attempting to use a declared\
    \ pointer without first assigning it value is not a good idea.\n\nAs you may recall\
    \ from previous chapters, when you declare a variable and attempt to output its\
    \ value without first assigning it, the result is a so-called \"garbage value\"\
    \ that makes little sense. The reason for this is the computer attempts to interpret\
    \ whatever value is left over from previous programs at the address of the variable.\n\
    \nWhen the variable is a pointer, leftover value is interpreted as another memory\
    \ address, which the pointer tries to access when you attempt to use it. There\
    \ are a number of memory address ranges that you are not permitted to access programmatically,\
    \ such as those reserved for the operating system. If the leftover value is interpreted\
    \ as one of those prohibited addresses, the result is an error.\n\n# Null Pointers\n\
    \nIf it is too early in your code to know which address to assign to the pointer,\
    \ then you first assign the pointer NULL, which is a constant with a value of\
    \ zero defined in several standard libraries, including *iostream*. The following\
    \ program does:\n\n```\n#include <iostream>\nusing namespace std;\n\nint main()\n\
    {\n    int* iPtr;\n    iPtr = NULL;\n```"
