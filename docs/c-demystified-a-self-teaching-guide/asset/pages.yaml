    National Standard Institute (ANSI), and mentioned that ANSI prescribes other standards
    that we will use in this chapter. One of other standards is the ANSI character
    set, which includes 256 characters, each having an integer value between 0 and
    255. These values are also referred as ASCII values, which values from 0 to 127
    of the ANSI character set are the same as the ASCII (American Standard Code for
    Information Interchange) character set.


    Table 5-4 lists the ANSI/ASCII values for commonly used characters. Note that
    digits also be characters, and that the ANSI/ASCII value of an uppercase character
    is different than the value of the corresponding lowercase character.


    # **Table 5-4:** Selected ANSI/ASCII Values


    | Character | Value |

    | 0 | 48 |

    | 9 | 57 |

    | A | 65 |

    | Z | 90 |

    | a | 97 |

    | z | 122 |


