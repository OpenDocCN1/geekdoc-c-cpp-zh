- pgno: 13
  md: '# Chapter 1: How a C++ Program Works


    # Overview


    You probably interact with computer programs many times during an average day.
    When you arrive at work and find out your computer doesn''t work, you call tech
    support. At the other end of the telephone line, a computer program forces you
    to navigate a voicemail maze and threatens you while you are on perpetual help
    with repeated insincare messages about how important your computer is, along false
    promises about how soon you will get through.


    When you''re finally done with tech support, you decide to take a break and log
    on to your now-working computer to do battle with giant alien insects from the
    planet Megazoid. Unfortunately, the network administrator catches you goofing
    off using another computer program which monitors employee usage. Assuming you
    are still employed, an accounts payable program generates your payroll check.


    On your way home, you decide you need some cash and stop at an ATM, where a computer
    program confirms (hopefully) you have enough money in your bank account and then
    instructs the machine to dispense the requested cash and (unfortunately) deducts
    that amount from your account.


    Most people, when they interact with computers as part of their daily routine,
    don''t need to consider what a computer program is how it works. However, a computer
    programmer should know the answers to these related questions, such as what is
    a programming language, and how does a C++ program actually work? When you have
    completed this chapter, you will know the answers to these questions, and also
    understand how to create and run your own computer program.'
  merge: -1
  img_proc: true
- pgno: 14
  md: '# What Is a Computer Program?


    Computers are widespread in our society because they have three advantages over
    us humans. First, computers can store huge amounts of information. Second, they
    can recall information quickly and accurately. Third, computers can perform calculations
    with lightning speed and perfect accuracy.


    The advantages that computers have over us even extend to thinking sports like
    chess. In 1997, the computer Deep Blue beat the world chess champion, Garry Kasparov,
    in a chess match. In 2003, Kasparov was out for revenge against another computer,
    Deep Junior, but only drew the match. Kasparov, while perhaps the best chess player
    ever, is only human, and therefore no match for the computer''s ability to calculate
    and remember prior games.


    However, we have one significant advantage over computers. We think on our own,
    while computers don''t, at least yet anyway. Indeed, computers fundamentally are
    more born than brain. A computer cannot do anything without step-by-step instructions
    from us telling it what to do. These instructions are called a computer program,
    and of course are written by a human, namely a computer programmer. Computer programs
    enable us to harness the computer'' tremendous power.'
  merge: -1
  img_proc: true
- pgno: 15
  md: '# What Is a Programming Language?


    When you enter a darkened room and want to see what is inside, you turn on a light
    switch. When you leave the room, you turn the light off.


    The first computers were not too different than that light switch. These early
    computers consisted of wires and switches in which the electrical current followed
    a path dependent on which switches were in the one (on) or off (zero) position.
    Indeed, I built such a computer when I was a kid (which according to my own children
    was back when dinosaurs ruled the earth).


    Each switch''s position could be expressed as a number: 1 for one, 0 for off the
    position. Thus, the instructions given to these first computers, in the form of
    the switches'' positions, were essentially a series of ones and zeros.


    Today''s computers, are far more powerful and sophisticated than these early computers.
    However, the language that computers understand, called machine language, remain
    the same, essentially ones and zeros.


    While humans think in ones and zeros, the humans who write programs usually don''t.
    Additionally, a complex program may consist of thousands or millions of step-by-step
    machine language instructions, which would require an incredibly long amount of
    time to write. This is an important consideration since, due to competitive market
    forces, the amount of time within which a program has to be written is becoming
    increasingly and less.


    Fortunately, we do not have to write instructions to computers in machine language.
    Instead, we can create switches in a programming language. Programming languages
    are far more understandable to programmers than machine language because programming
    languages resemble the structure and syntax of human language, not ones and zeros.
    Additionally, code can be written much faster with programming languages than
    machine language because programming languages automate instructions; programming
    instruction can cover many language instructions.


    C++ is but one of many programming languages. Other popular programming languages
    include Java, C#, and Visual Basic. There are many others. Indeed, new languages
    are being created all the time. However, all programming languages have essentially
    the same purpose, which is to enable a human programmer to give instructions to
    a computer.


    Why learn C++ instead of programming language? First, it is very widely used,
    both in industry and in education. Second, many other programming languages, including
    Java and C#, are based on C++. Indeed, the Java programming language was written
    in C++. Therefore, knowing C++ makes other programming languages easier.'
  merge: -1
  img_proc: true
- pgno: 16
  md: "# Anatomy of a C++ Program\n\nIt seems to be a tradition in C++ programming\
    \ books for the first code example to output to a console window the message \"\
    Hello World! (shown in Figure 1-1).\n\n![](img/59a3417a6d5906fae6d8000d4c2cff76_16_0.png)\n\
    \nNote The term \"console\" goes to the days before Windows when the screen did\
    \ not have menus and toolbars but just text. If you have typed commands using\
    \ DOS or UNIX, you likely did so in a console window. The text \"Press any key\
    \ to continue\" immediately following \"Hello World! is not part of the program,\
    \ but instead is a code for how to close the console window.\n\nUnfortunately,\
    \ all too often the \"Hello World! is followed by many other program examples\
    \ without the book or teacher explaining how the \"Hello World! program works.\
    \ The result is a confused reader or who's ready to say \"Goodbye, Cruel World.\"\
    \n\nWhile the \"Hello World!\" program looks simple, actually there is a lot going\
    \ behind the scenes of this program. Accordingly, we are going to go through the\
    \ following code for the \"Hello World!\" program line by line, though not top-to-bottom\
    \ order.\n\n```\n#include <iostream>\nusing namespace std;\n\nint main(void)\n\
    {\n    cout << \"Hello World!\";\n    return 0;\n}\n```\n\nNote The code programmer\
    \ is written as source code, which is saved in a file that has a .cpp extension,\
    \ standing for C++.\n\n# The main Function\n\nAs discussed in the \"What Is a\
    \ Programming Language?\" section, the purpose of C++, or any programming language,\
    \ is to enable a programmer to write instructions for a computer. Often, a task\
    \ is too complex for just one instruction. Instead, several related instructions\
    \ are required.\n\nA function is a group of related instructions, also called\
    \ statements, which together perform a particular task. The name of the function\
    \ is how you refer to related"
