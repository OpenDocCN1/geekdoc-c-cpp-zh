  md: "# Passing as Function Arguments\n\nPassing an array name by address is relatively\
    \ simple because the value of the array name is an address. However, you may often\
    \ want to pass a single variable by address. By single variable I don't mean a\
    \ variable that is unmarried, but instead, for example, int as opposed to an int\
    \ array.\n\nWith a single variable, subscript notation is not an option. Subscripts\
    \ make sense only with an array. Rather, you need to use pointer notation to pass\
    \ a single variable by address.\n\nPassing an argument by reference or by address\
    \ both enable the passed argument to be changed in the calling function—only the\
    \ syntax is different. In comparison, let's test with the following program Chapter\
    \ 9 that passes the variable to doubled by reference:\n\n```\n#include <iostream>\n\
    using namespace std;\nvoid doubleIT(int&);\n\nint main () {\n    int num;\n  \
    \  cout << \"Enter number: \";\n    cin >> num;\n    doubleIT(num);\n    cout\
    \ << \"The number doubled in main is \" << num << endl;\n    return 0;\n}\n\n\
    void doubleIT(int& x) {\n    cout << \"The number to be doubled is \" << x <<\
    \ endl;\n    x *= 2;\n    cout << \"The number doubled in doubleIT is \" << x\
    \ << endl;\n}\n```\n\nHere is some sample input and output:\n\nEnter number: 3\n\
    The number to be doubled is 3\nThe number doubled in doubleIT is 6\nThe number\
    \ doubled in main is 6\n\nLet's now modify this program so it passes the variable\
    \ to be doubled by address instead of reference:\n\n```\n#include <iostream>\n\
    using namespace std;\nvoid doubleIT(int*);\n```\n\n```\nint main () {\n    int\
    \ num;\n    cout << \"Enter number: \";\n    cin >> num;\n    doubleIT(&num);\n\
    \    cout << \"The number doubled in main is \" << num << endl;\n    return 0;\n\
    }\n\nvoid doubleIT(int* x)\n```"
