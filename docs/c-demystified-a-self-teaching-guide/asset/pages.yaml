- pgno: 158
  md: '# Chapter 9: Functions


    # Overview


    A function is a group of statements that together perform a task. So far, our
    programs have one function, `main`. Additionally, at times we have used functions
    defined in a standard library, such as the `pow` function in the `cmath` library,
    used to raise a number to a certain power.


    No program needs a `main` function. However, as you write more complex and sophisticated
    programs, you may find your `main` function becoming extremely long.


    Neither the compiler nor the runtime cares if your `main` function is short or
    long. However, you should care. A `main` function that continues for pages is
    difficult to understand or fix if errors arise.


    By analogy, a book several hundred pages long. It would be harder to understand
    if each chapter was not divided into sections. This book would be still harder
    to understand if it consisted of only one very long chapter. By dividing this
    book''s content into chapters, and each chapter into sections, this book is easier
    to understand.


    Similarly, you can divide your code into separate functions. How you divide up
    your code among different functions is up to you, but logically the division usually
    is so each function performs a specific task.


    For example, in a program that performs arithmetic calculations, one function
    obtains input, another function performs the calculation, and a third function
    outputs of the result. This is analogue to how a book is divided into chapters
    and sections. Each chapter explores a different subject. One chapter focuses on
    variables, another other (this one) on functions.


    There are advantages to dividing your code into separate functions in addition
    to making your code easier to understand. For example, if a function performs
    a specific task, such as sending output to a printer, which is performed several
    times in a program, you need to write once in a function the code necessary to
    send output to the printer, and then call that function each time you need to
    perform that task. Otherwise, the code necessary to send output to the printer
    would be repeated each time that task was to be performed.


    Hopefully, I have persuaded you that organizing your code into separate functions
    can be useful. I will now show you how to do it.'
  merge: -1
  img_proc: true
