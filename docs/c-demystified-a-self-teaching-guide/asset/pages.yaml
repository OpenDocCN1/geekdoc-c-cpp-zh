- pgno: 88
  md: 'Table 5-2 uses operands that have literal values. A literal value is a value
    that cannot change. 4 is a literal value, and cannot have a value other than the
    number 4.


    Operands may also be variables (which we discussed in Chapter 3). The following
    program outputs the results of several comparisons.


    ```

    #include <iostream>

    using namespace std;

    int main(void) {

    int a = 4, b = 5;

    cout << a << " > " << b << " is " << (a > b) << endl;

    cout << a << " >= " << b << " is " << (a >= b) << endl;

    cout << a << " == " << b << " is " << (a == b) << endl;

    cout << a << " <= " << b << " is " << (a <= b) << endl;

    cout << a << " < " << b << " is " << (a < b) << endl;

    return 0;

    }

    ```


    The program''s output is

    4 > 5 is 0

    4 >= 5 is 0

    4 == 5 is 0

    4 <= 5 is 1

    4 < 5 is 1


    In the output, 0 is false and 1 is true.0 is the integer value of Boolean false,
    while 1 is the usual integer value of Boolean. You may recall from Chapter 1,
    early computers consisted of wires and switches in which the electrical current
    followed a path that depended on which switches were in the on position (corresponding
    to the value one) or the off position (corresponding to the value zero). The on
    position corresponds to Boolean true, the off position to Boolean false.


    > While the usual integer value of true is 1, any non-zero number may be logical
    true. In a Boolean comparison, do not compare a value to 1, compare it to true.


    The data types of the two operands need not be the same. For example, you could
    change the data type of variable b in the preceding program from an int to a float
    and the program would still compile and provide the same output. However, the
    data types of the two operands must be compatible. You may recall from Chapter
    3, compatibility means, that if one of the variables in the relational expression
    is a numeric data type, the other''s variable operand must also be a numeric data
    type.


    For example, the program would not compile if you changed the data type of the
    variable b in the preceding program from an int to a string.


    # Precedence


    Relational operators have higher precedence than assignment operators and lower
    precedence than arithmetic operators. Table 5-3 lists precedence among relational
    operators.


    # Table 5-3: Precedence of Relational Operators'
