  md: "# Pointer Arithmetic\n\nThe value of a pointer, even though it is an address,\
    \ is a numeric value. Therefore, you can perform arithmetic operations on a pointer\
    \ just as you can a numeric value.\n\n# Using a Variable Pointer to Point to an\
    \ Array\n\nPointer arithmetic is done often with arrays. However, since you cannot\
    \ change the value of the name of an array, being a constant pointer, you should\
    \ first declare a variable pointer and assign it to the address of an array.\n\
    \nSo, we begin with an established point of reference, let's start with the following\
    \ program, which outputs the address and value of each element of an array using\
    \ the name of the array:\n\n```\n#include <iostream>\nusing namespace std;\nconst\
