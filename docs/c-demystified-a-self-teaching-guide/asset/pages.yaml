    # Precedence Between Arithmetic Operators


    The statement we has two arithmetic operators, for addition and multiplication.
    The order in which the two arithmetic operations are performed makes a difference.
    If addition is performed first, 28+5, and then the sum, 3, is multiplied by 72,
    the result is 2376. However, if multiplication is performed first, 5*72, and then
    the product, 30, is added to 28, the result would be 388.


    C++ has rules, called precedence, for determining which operation is first. Precedence
    was discussed earlier in this chapter in the section on the addition operator
    over the assignment operator. However, the issue is precedence between arithmetic
    operators.


    Table 4-3 lists the precedence between arithmetic operators.


    | Precedence | Operator |

    |---|---|

    | Highest | - (unary negation) |

    | Middle | * / % |

    | Lowest | + |


    When there is one operator in a row in Table 4-3, those operators have equal'
