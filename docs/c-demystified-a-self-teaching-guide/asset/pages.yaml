    rather than in the default text format. |

    | ios::in | Input mode. Information will be read from the file. The file will
    not be created if it does not exist. |

    | ios::out | Output mode. Information will be written to the file by default,
    the existing file contents will be overwritten. |

    | ios::trunc | If the file exists, its contents are truncated, another for deleted
    or overwritten. This is the default mode of ios::out.|


