- pgno: 18
  md: '# The return Statement


    The second and final statement returns a value of zero to the computer''s operating
    system, whether that Windows, UNIX, or another. This tells the operating system
    that the program ended normally. Some programs do not end, but instead crash,
    such as if you ran out of memory during the running of the program. The operating
    system may need to handle this abnormal program termination differently than normal
    termination. That is why your program tells the system that it ended normally.


    #  #include Directive


    Your C++ program "knows" to start at the main function because the main function
    is part of the core of the C++ language. We certainly did not write any code that
    told the C++ program to start at main`.


    Similarly, your C++ program seems to know that the count object, in conjunction
    with the stream insertion outputs information to the monitor. We did not write
    any code to have the count object and the << operator achieve this result.


    However, the count is not part of the C++ core language. Rather, it is defined
    elsewhere, in a standard library file. C++ has a number of standard library files,
    each defining commonly used objects. Outputting information to the monitor certainly
    is a common task. While you could go to the trouble of writing your own function
    that outputs to the screen, a standard library file implementation saves you the
    trouble of "reinventing the wheel."


    While C++ has already implemented the count object for a standard library file,
    you still have to tell the program to include that standard library file in your
    application. You do so with the #include directive, followed by the name of the
    library file. If the library is a standard library file, as opposed to one you
    wrote (you create), then the file name is enclosed in angle brackets, < and >.


    The count object is defined in the standard library file iostream. The "io" in
    iostream refers to input and output—stream—to a stream of data. To use the count,
    we need to include the iostream standard library file in our application. We do
    so with the following


    ```

    #include <iostream>

    ```


    The include directive is called a preprocessor directive. The preprocessor, together
    with the compiler and linker, are discussed later in this chapter "Translating
    the Code for the Computer." The preprocessor directive, unlike statements, is
    not ended by a semicolon.


    # Namespace


    The final statement to be discussed in the Hello World! example is using namespace
    std;


    C++ uses namespaces to organize different names in programs. Every time you use
    the iostream standard library file is part of a namespace called std. Consequently,
    the count object is called std::count. Using the namespace statement avoids the
    need for every reference to count, so we can use count in our code.'
  merge: -1
  img_proc: true
