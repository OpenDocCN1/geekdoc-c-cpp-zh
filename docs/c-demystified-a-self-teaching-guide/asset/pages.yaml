  md: "time the printMessage function is called.\n\nThere are two alternative methods\
    \ to having the value of a variable persist between function calls. One is to\
    \ make the global variable rather than local. The other is to keep the variable\
    \ local but make it static. These alternatives are covered next.\n\n# Global Variables\n\
    \nA variable may be global instead of local. The global term means that the variable\
    \ has scope throughout the program. Since the variable has scope throughout the\
    \ program, lifetime does not end until the program ends.\n\nTo make a variable\
    \ global, it must be declared above all function definitions, generally with function\
    \ prototypes. The following program makes only change from the previous one. The\
    \ declaration of the variable times is moved from inside main to above main, making\
    \ times a global variable.\n\n```\n#iostream>\nusing namespace std;\nvoid printMessage(void);\n\
    int times;\n\nint main (n{\n    times = 0;\n    char choice;\n    do {\n     \
    \   cout << \"Enter Q to quit, any other character to continue:\";\n        cin\
    \ >> choice;\n        if (choice == 'Q')\n            cout << \"Input stopped\"\
    ;\n        else\n            printMessage();\n    } while (choice != 'Q');\n \
    \   return 0;\n}\nvoid printMessage(void)\n{\n    times++;\n    cout << \"This\
    \ function called \" << times << \" times\\n\";\n}\n```\n\nHere is some sample\
    \ input and output:\n\nEnter Q to quit, any other character to continue: X\nThis\
    \ function called 1 times\nEnter Q to quit, any other character to continue: Y\n\
    This function called 2 times\nEnter Q to quit, any other character to continue:\
    \ Z\nThis function called 3 times\nEnter Q to quit, any other character to continue:\
    \ Q\nInput stopped\n\nThis is the output we wanted!\n\nPerhaps because of the\
    \ ease of using global variables to solve the issue of the scope and"
