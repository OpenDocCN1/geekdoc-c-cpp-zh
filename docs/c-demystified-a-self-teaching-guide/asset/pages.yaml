  md: "Therefore, the output of cout << testScore is the base address of the testScore,\
    \ which happens to be the hexadecimal address 0012FECC.\n\nThis explains why you\
    \ obtain an address rather than values when you use the stream insertion operator\
    \ << with a numeric array. However, it does not explain why you obtain values\
    \ rather than an address when you use the stream insertion operator << with a\
    \ character array. After all, the name of a character array, the name of a numeric\
    \ array, is a constant value which is the base address of the array.\n\nThe answer\
    \ simply is that the C++ programming language treats the stream extraction operator\
    \ >> with a character array than with a numeric array. When used, the character\
    \ array name is not interpreted as a constant value which is the base address\
    \ of the array, but rather the starting point for display. This is just another\
    \ example of the differences between character arrays and numeric arrays.\n\n\
    # Using the cin Object with Numeric Arrays ... Not!\n\nWhile you can use the cout\
    \ and the stream insertion operator << with numeric arrays as well as character\
    \ arrays (albeit with different results), you can use the cin object and the stream\
    \ extraction operator >> only with a character array. You cannot use the cin object\
    \ and the stream extraction operator >> with numeric arrays. This is demonstrated\
    \ by the following program:\n\n```\n#include <iostream>\nusing namespace std;\n\
    const int MAX = 3;\nint main () {\n    int testScore[MAX];\n    cin >> testScore;\n\
    \    return 0;\n}\n```\n\nThe result is a compiler error. The compiler will highlight\
    \ the statement cin >> testScore and complain that the stream extraction operator\
    \ >> cannot have a right-hand operand that is an integer array.\n\nThis compiler\
    \ error may sound familiar. Previously in this chapter, an attempt to use the\
    \ stream extraction operator to assign a value to the constant, as in cin >> numTests\
    \ when numTests resulted in a compiler error, the message being that the stream\
    \ extraction operator >> cannot have a right-hand operand that is a constant.\n\
    \nThis is essentially the same problem. As you will learn more in Chapter 11,\
    \ the name of the integer array, testScore, is a constant value which is the base\
    \ address of the array.\n\nWhile this explains why you can't use the stream extraction\
    \ operator >> with an integer array, you may be wondering why you can use the\
    \ stream extraction operator >> with a character array since the name of a character\
    \ array, the name of an integer array, is a constant value which is the base address\
    \ of the array. The answer is essentially the same as the one for the similar\
    \ question in the preceding section regarding the stream insertion operator <<\
    \ with a character array. When used, the character array is not interpreted as\
