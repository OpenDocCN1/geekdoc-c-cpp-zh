    # # The Syntax for the Loop


    Let''s discuss the syntax of the for. The for keyword is followed by parentheses
    that contain three expressions that will be discussed in a moment. This line of
    code is followed by one or more statements.


    The three expressions contained in the parentheses following the for keyword are
    separated by semicolons; there is no semicolon after the third expression since
    no expression follows.


    The first expression is usually used to initialize the value of a variable, typically
    referred to as a counter, in this example, variable num is initialized to the
    starting value of 0. This initialization is the first action performed by the
    loop, and is only performed once.


    The second expression is the condition, which must be true for the loop to execute.
    In this example, the condition is the current value of num is less than or equal
    to 10.


    The third expression is usually used to update the value of the counter. In this
    example, the integer variable num is incremented. This expression executes at
    the end of each iteration, and only if the condition was true at the beginning
    of the iteration.


    Note Postfix increment was used in this example and generally is employed by convention.
    However, the result would be the same if prefixing were used, as only one operator
    is involved in this expression.


    Therefore, the order of execution in the first iteration of the loop is


    +   1. The first variable num is initialized to 1.

    2. The current value of num, 1, is compared to 10.

    3. Since the comparison is true, the current value of num, 1, is outputted.

    4. The value of num is incremented, becoming 2.


    The order of execution in the second iteration of the loop is


    +   1. The current value of num, 2, is compared to 10.

    2. Since the comparison is true, the current value of num, 2, is outputted.

    3. The value of num is incremented, becoming 3.


    Note that the initialization that occurred during the first iteration of the loop
    did not occur during the second iteration of the loop. As discussed previously,
    initialization occurs only once, in the first iteration of the loop.


    This order of execution in the second iteration of the loop repeats during the
    third and following executions of the loop, each incrementing the value of num
    through the'
