- pgno: 170
  md: "The following code calls the `printMessage` function:\n\n```\nprintMessage(str);\n\
    ```\n\nThe string variable `str`, whose value previously was assigned by user\
    \ input, is passed as an argument to the `printMessage` function. The value of\
    \ `str` then passed to the string variable `s`, which is the argument name in\
    \ the function header of the `printMessage` function:\n\n```\nvoid printMessage\
