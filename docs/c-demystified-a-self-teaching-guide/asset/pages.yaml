    # Comparison of the Do and While Loop


    The preceding program, which used the while loop both before and inside the loop
    to enter a number as the corresponding program that used the while loop. However,
    using this program the while loop repeats the num < 0 condition inside the loop,
    whereas the corresponding program that used the while loop did not need to do
    that.


    As a general rule, I prefer a do loop over a while loop in those situations where
    the loop must execute at least once before a condition be tested, simply under
    these circumstances seems illegal to test the condition prematurely on the first
    iteration of the loop. As you may recall, in the program that used the while loop,
    the value of quit could be true in the loop condition under either of two possibilities,
    one being the user''s first attempt to enter data so the user has not been asked
    whether they want to quit, and the other it was the user''s second or later attempt
    to enter data and the answer that they wanted to quit. By contrast, using the
    do loop eliminates the first possibility.


    The preceding program, in which the user had to enter a number, whether that number
    is positive or not, is an example of the situation in which the loop must execute
    at least once before a condition be tested. Another common example of this situation
    is when a menu is displayed. Assume the program displays a menu such as the following:


    ```

    Menu

    =====

    1. Add an entry

    2. Edit an entry

    3. Delete an entry

    4. Exit

    ```


    If the user chooses options 1, 2, or 3, the program performs the indicated operation
    (add, edit or delete) and then again displays the menu for the user''s next choice.
    If the user chooses option 4, the program ends.


    In this example, the menu always displays at least once; the user cannot quit
    before exit being given the choice. Accordingly, a do loop is preferable to a
    while loop when choosing to display a menu.'
