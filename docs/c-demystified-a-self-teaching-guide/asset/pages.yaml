- pgno: 166
  md: "lifetime of the times variable, beginning programmers often make all variables\
    \ global so they can access these variables anywhere and anytime in their program.\
    \ This is not a good idea.\n\nWhile the good news is that a global variable can\
    \ be accessed throughout your program, this is also the bad fact. That a global\
    \ variable can be accessed and changed anywhere in your program makes it more\
    \ difficult to determine why, for example a global variable has an invalid value\
    \ than the variable's scope was far more limited. This is simply because the more\
    \ limited a variable's scope, the less places there are in the code that might\
    \ affect its use.\n\nTherefore, global variables can make it more difficult to\
    \ fix problems with your programs. For this reason, some programmers, and programming\
    \ teachers, go to the extreme and pronounce \"all global variables are evil.\"\
    \ I'm not sure I would go for that, but I would recommend that you not use global\
    \ variables unless you have a very good reason to do so, since there usually are\
    \ better alternatives. One alternative, a static local variable, is examined next.\n\
    \n# # Static Local Variables\n\nUp until now a variable's lifetime was dictated\
    \ by its scope. Since a local variable's scope was limited to the function in\
    \ which it was declared, the local variable's lifetime ended when that function\
    \ ended. Since a global variable had scope throughout a program, the global variable's\
    \ lifetime did not end until the entire program ended.\n\nA static local variable\
    \ is different. A static local variable has the scope of a local variable but\
    \ the lifetime of a global variable. This may seem counter-intuitive, to illustrate\
    \ let's modify the print function we have been working with.\n\nA static local\
    \ variable is declared exactly like a local variable, within a function rather\
    \ above all functions as a global variable. The difference between the declaration\
    \ of a static local variable and a nonstatic, automatic, local variable is that\
    \ a static local variable is declared with the static keyword, and usually also\
    \ with a starting value. Thus, in the following program, instead of the declaration\n\
    \n```\nint times;\n```\n\nthe declaration is\n\n```\nstatic int times = 0;\n```\n\
    \nHere is the program in its entirety:\n\n```\n#include <iostream>\nusing namespace\
    \ std;\nvoid printMessage(void);\n\nint main () {\n    char choice;\n    do {\n\
    \        cout << \"Enter Q to quit, any other character to continue: \";n    \
    \    cin >> choice;\n        if (choice == 'Q')\n            cout << \"Input stopped\"\
    ;\n        else\n            printMessage();\n    }\n```"
  merge: -1
  img_proc: true
- pgno: 167
  md: "```\n)} while (choice != 'Q');\nreturn 0;\n}\nvoid printMessage(void)\n{\n\
    \    static int times = 0;\n    times++;\n    cout << \"This function called \"\
    \ << times << \" times\\n\";\n}\n```\n\nHere is some input and output:\n\n+  \
    \ - Enter Q to quit, any other character to continue: X\n- This function called\
    \ 1 times\n- Enter Q to quit, any other character to continue: Y\n- This function\
    \ called 2 times\n- Enter Q to quit, any other character to continue: Z\n- This\
    \ function called 3 times\n- Enter Q to quit, any other character to continue:\
    \ Q\n- Input stopped\n\nThis output is also correct. Let's now analyze how the\
    \ program works.\n\nThe first time the `printMessage` function is called, the\
    \ variable `times` is declared, and initialized to zero, by the statement:\n`static\
    \ int times = 0;`\n\nThe variable `times` is then incremented and outputted, resulting\
    \ in the output:\n`This function called 1 times`\n\nSo far, this is the same as\
    \ when `times` was an automatic local variable than a static local variable. The\
    \ difference is that when the `printMessage` function ends, `times`, being a static\
    \ local, is **not** destroyed. And its value remains in memory.\nThe next (second)\
    \ time the `printMessage` function is called, the statement declaring and initializing\
    \ `times` is not executed because being static, it still exists from the first\
    \ time the `printMessage` function was called. Further, the value of `times` at\
    \ the end of the first call of the `printMessage` function, remains in memory.\
    \ That value is incremented to 2, and outputted, so the output to the second call\
    \ of the `printMessage` function is:\n`This function called 2 times`\n\nAccordingly,\
    \ we were able to persist the value of the `times` variable between function calls\
    \ by making that variable either global or static local. The difference was that\
    \ as a static local the scope of `times` was still limited to the `printMessage`\
    \ function, as opposed to having scope throughout the program if it were a global\
    \ variable. This scope would make it easier to fix your program if the value of\
    \ the `times` variable were incorrect somewhere in your code."
  merge: -1
  img_proc: true
- pgno: 168
  md: "# Sending Information to a Function\n\nThe printMessage function in the Hello\
    \ World program outputs \"Hello world!\" does not need any further information\
    \ to do its job.\n\nLet's make the printMessage function more useful so that it\
    \ not always output \"Hello world\" but instead outputs whatever we ask it to.\
    \ Of course, the printMessage function is not a mind reader; we need to tell it\
    \ the message we want to output.\n\nLet's try to write a program where the user\
    \ enters in the main to be outputted, that user input is stored in a variable\
    \ str, and the printMessage function attempts to output the value of that str.\
    \ One approach is to make the variable global so it can be accessed in both the\
    \ main and printMessage functions:\n\n```\n#include <iostream>\n#include <string>\n\
    using namespace std;\nvoid printMessage();\nstring str;\n\nint main ()\n{\n  \
    \  cout << \"Enter a string: \";\n    cin >> str;\n    printMessage();\n    return\
    \ 0;\n}\nvoid printMessage ()\n{\n    cout << \"You inputted \" << str;\n}\n```\n\
    \n+   Note With a string, a statement cin include the <string> standard library.\
    \ Additionally, the cin object and the stream insertion operator (>>) will only\
    \ accept the input of a string variable up to the first embedded space. If the\
    \ user entered \"Jeff Kent,\" the output would be only \"Jeff.\" In Chapter 10,\
    \ we will cover the getline function, which will work with string that has embedded\
    \ spaces.\n\nHere is some sample input and output:\n\nEnter a string: Jeff\nYou\
    \ inputted Jeff\n\nWhile this, as discussed in the previous section, global variables\
    \ can make it more difficult to fix problems with your programs. There is a better\
    \ alternative here, involving passing arguments.\n\nAs discussed earlier in this\
    \ chapter, the parentheses following the function name in the function header\
    \ contains the function's arguments. Arguments are information that is provided\
    \ to a function so that it may perform its task.\n\nAs discussed earlier, some\
    \ functions as the printMessage function in the Hello World program, which simply\
    \ outputs \"Hello world\" It does not need any further information to do its job."
