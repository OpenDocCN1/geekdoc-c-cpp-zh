  md: '# # Chapter 11: What’s the Address? Pointers


    # ## Overview


    My parents told me when I was a child that it was not to point. However, each
    semester I teach my computer students how to point. No, I am not trying to promote
    rude behavior. Rather, I am teaching my students about pointers, which "point"
    to another variable or constant.


    You yourself may have acted as a pointer in the past. Have you ever been asked
    where someone lives? If that house was nearby, you may have pointed it out.


    The pointer performs a similar function. A pointer points to another variable
    or constant. Of course, the pointer does not point with an arm and fingers as
    you would. Rather, the pointer’s value is the address of the variable or constant
    to which it points. Indeed, you may have done something similar. If you were asked
    where someone lives and that house was not close enough to physically point out,
    you instead may have provided an address by which the house could be located.


    Pointers have had a reputation among programming students for being difficult
    to learn. I think that are not difficult if you take the time to understand what
    they do. In any event, difficult or not, it is important to learn about pointers.
    Some C++ tasks are performed more easily with pointers, and other C++ tasks, such
    as dynamic memory allocation, cannot be performed without them.


    So, on that note, let’s learn how to create and work with pointers.'
  merge: -1
  img_proc: true
- pgno: 202
  md: '# Declaring a Pointer


    Like any variable or constant, you must declare a pointer before you can work
    with it. The syntax of declaring a pointer is almost the same as declaring a variable
    that stores a value rather than an address. However, the meaning of the pointer''s
    data type is quite different than the meaning of the data type of a variable that
    stores a value rather than an address.


    # Syntax of a Pointer Declaration


    The syntax of declaring a pointer is almost the same as the syntax of declaring
    the variables we have worked with in previous chapters. The following statement
    declares an integer variable:


    ```

    int* iPtr;

    ```


    The asterisk you use to declare a pointer is the same asterisk that you use for
    multiplication. However, in this statement the asterisk is being used in a declaration,
    so in this context it is being used to designate a variable as a pointer. Later
    in this chapter, we will use the asterisk for a third, as an indirection operator.


    **Note** It is common in C++ for a symbol to have different meanings depending
    on the context. For example, an ampersand (&) in an argument list means you are
    passing an argument by reference, whereas an ampersand in front of a variable
    is the name address.


    The integer variable can also be declared with the asterisk preceding the variable
    name instead of following the data type:


    ```

    int*ptr;

    ```


    Either alternative is equally correct because the compiler generally ignores spaces
    between an operator and a variable name, constant name, or number. Indeed, the
    following pointer declaration works also:


    ```

    int*ptr;

    ```


    My preference is the first example, in which the asterisk follows the data type
    and is separated by a variable name, since (in my opinion) it signifies that the
    variable is a pointer. However, all three syntaxes are correct. In of these variations,
    the only difference between declaring a pointer variable and a variable that stores
    a value rather than an address is the asterisk between the data type and the pointer
    name.


    # The Meaning of Pointer Data Types


    While the syntax of declaring a pointer is almost the same as declaring the variables
    and constants which store a value rather than an address, the meaning of the data
    type in the declaration of a pointer is different than the declaration of other
    variables and constants.


    With the examples we have worked with previously, the data type in the variable
    declaration describes what data can be stored in that variable. Thus, the value
    of an integer variable or constant is an integer, the value of a character variable
    or constant is a character, and so.'
  merge: -1
  img_proc: true
