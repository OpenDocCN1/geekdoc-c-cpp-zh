  md: 'In the following decrement code fragment, the value of result is 15, not 18,
    because op2 is incremented from 5 to 6 after the multiplication and assignment
    occurs.


    ```

    int op1 = 3, op2 = 5, result;

    result = op1 * ++op2;

    ```


    If incrementing instead were used as in the following code fragment, the value
    of result is 18, not 15, because op2 is incremented from 5 to 6 before the multiplication
    and assignment occurs.


    ```

    int op1 = 3, op2 = 5, result;

    result = op1 * ++op2;

    ```


    The distinction between prefix and postfix arises as well with relational operators.
    In the following code fragment, the output is 1 (the integer representation of
    Boolean true) because the integer variable num is compared to 5 for equality before
    num is incremented from 5 to 6.


    ```

    int num = 5;

    cout << (num++ == 5);

    ```


    If incrementing instead were used, as in the following code fragment, then the
    output would be 0 (the integer representation of Boolean false) because the integer
    variable num is incremented from 5 to 6 before it is compared to 5 for equality.


    ```

    int num = 5;

    cout << (++num == 5);

    ```


    The increment and decrement operators are generally not by themselves, but in
    conjunction with loops. The next section covers one type of loop: the for loop.


    ![](img/59a3417a6d5906fae6d8000d4c2cff76_130_0.png)'
