  md: 'precedence. Thus, the multiplication operator and the two division operators
    have equal precedence. Similarly, the addition and subtraction operators have
    equal precedence.


    Table 4-4 shows the results of applying precedence to several arithmetic expressions.
    We have not reviewed the division operators, yet in the examples in Table 4-4
    the / operator works exactly as it does in arithmetic.


    # Table 4-4: Precedence in Action


    | Expression | Result |

    |---|---|

    | 2 + 3 * 4 | 14, not 20 |

    | 8 / 2 - 1 | 3, not 8 |


    C++ also has rules associativity for determining which operation is performed
    first when two operators have equal precedence. Table 4-5 describes these rules.


    # Table 4-5: Associativity of Arithmetic Operators


    | Operator | Associativity |

    |---|---|

    | (unary negation) | Left to right |

    | * / % | Left to right |

    | - | Left to right |


    Therefore, the result of the expression 8 / 2 * 4 is 16, not 1, because division,
    the leftmost operator, is performed first.


    However, there are times when you need to override the default precedence. For
    example, in our program, calculating tuition, the default precedence would be
    multiplied by 72, after which the product would be added to total. However we
    want to change the order of operations so that dropped is added to total, and
    the sum multiplied by 72.


    You can override the default precedence. This is in the statement:

    cout << "Total tuition owed: $\$" << (total + dropped) << * 72

    endl;


    Expressions in parentheses are first. As a result of the parentheses, the expression
    (total + dropped) * 72 is evaluated so that dropped is first added to total, and
    the sum is multiplied by 72.


