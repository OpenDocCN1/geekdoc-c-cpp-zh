  md: "# Returning a Value from a Function\n\nArguments are used to pass values to\
    \ a called function. A return value can be used to pass a value from a called\
    \ function back to the function that called it.\n\nFor example, in the previous\
    \ program the functionNumbers had three arguments, the first two being the numbers\
    \ to be added, the third being their sum. The following program modifies the previous\
    \ by eliminating the third argument, but adding a return value to the function:\n\
    \n```\n#include <iostream>\nusing namespace std;\nint addNumbers(int, int);\n\n\
    int main () {\n    int firstNum, secondNum, sum = 0;\n    cout << \"Enter first\
    \ number: \";\n    cin >> firstNum;\n    cout << \"Enter second number: \";\n\
    \    cin >> secondNum;\n    sum = addNumbers(firstNum, secondNum);\n    cout <<\
    \ firstNum << \" + \" << secondNum << \" = \" << sum;\n    return 0;\n}\n addNumbers(int\
    \ x, int y) {\n    return x + y;\n}\n```\n\nThe sample input and output may be\
    \ the same as in the previous program:\n\nEnter first number: 3\nEnter first number:\
    \ 6\n3 + 6 = 9\n\nThe return value is indicated by adding its data type, here\
    \ an int, in front of the function name in both the function prototype and header:\n\
    \n```\nint addNumbers(int, int);\naddNumbers(int x, int y)\n```\n\nThe function\
    \ call is on the right side of the assignment operator. To the left of the assignment\
    \ operator is a variable of the same data type as the return value of the function.\
    \ The concept is that the return value from the function is assigned to the variable\
    \ sum on the left side of the assignment operator.\n\n```\nsum = addNumbers(firstNum,\
    \ secondNum);\n```\n\nThe body of the function has the return keyword followed\
    \ by a value of the data type compatible with the function prototype and header,\
    \ here. The function’s return value is the value that follows the return keyword,\
    \ here the sum of the two arguments:\n\n```\nreturn x + y;\n```\n\nThat sum of\
    \ x + y is then assigned to the variable sum in main."
