  md: "# Defining and Calling a Function\n\nImplementing any function in addition\
    \ to main involves two steps:\n\n+   1. Defining the function\n2. Calling the\
    \ function\n\nThe explanation of these steps uses terminology we have not discussed\
    \ before, so terminology is reviewed first.\n\n# Terminology of a Function\n\n\
    Let's look at a simple program with one function, main:\n\n```\n#include <iostream>\n\
    using namespace std;\nint main() {\n    cout << \"Hello world!\";\n    return\
    \ 0;\n}\n```\n\nThe first line, int main(),), is the function header. Unlike a\
    \ statement, the function header is not followed by a semicolon.\n\nThe function\
    \ header consists of a return type, a function name, and an argument list. The\
    \ data type int preceding main is the return type, a function name, and the parentheses,\
    \ in this example but not others, contains the argument list.\n\nA function header\
    \ is always followed by an open curly brace, which brings the function body. The\
    \ function body ends with a close brace. There may be other open curly braces\
    \ between the open curly brace that brings the function body and the close brace\
    \ that ends it, such as enclose multiple statements that belong to an statement\
    \ or a loop.\n\nThe function body consists of one or more statements. In this\
    \ example, the function body consists of two statements. The last statement, return\
    \ 0, is a return statement. The function body must contain a return statement\
    \ unless the return type is void, in which the return statement is optional.\n\
    \nThe header and body together are referred to as the function definition. A function\
    \ cannot execute until it is first defined. Once defined, a function executes\
    \ when it is called.\n\nNormally, a function is called through code. The main\
    \ function is the exception. The main function is called automatically when your\
    \ program begins to run.\n\nThe next sections will explain how to define your\
    \ function and then call it.\n\n# Defining a Function\n\nLet's take our \"Hello\
    \ World\" example and divide the code into two functions, main and a printMessage\
    \ that outputs \"Hello world!\" The comments (beginning with //)"
  merge: -1
