- pgno: 33
  md: '# Chapter 2: Memory and Data Types


    # Overview


    After I wrote my first book, I expected every day for mail, hoping to receive
    requests for my autograph. The result was proof of the adage "be careful what
    you ask for." My mailbox was stuffed with numerous requests for my autograph.
    Alas, these requests came from those who wanted to share my memory, not my fame.
    My autograph was requested on checks to pay my mortgage, credit cards, insurance,
    phone service, electricity; well, you get the picture.


    These companies who love sending me bills could possibly keep track of their thousands
    of customers by using pencil and paper. Instead, they use computer programs, which
    harness the computer''s ability to store very large amounts of information and
    to retrieve that information very quickly.


    We use our memory to store and recall information. So do computers. However, a
    computer''s memory is very different from ours. This chapter will explain how
    a computer''s memory works.


    Information, also called data, comes in different forms. Some data is numeric,
    such as the amount of my gas bill. Other data is, such as my name on my gas bill.
    The type of data, whether numeric, text, or something else, quite literally is
    referred to as the "data type." The data type you choose will affect not only
    the form in which the data is stored, but also the amount of memory required to
    store it. This chapter will explain the different data types.'
  merge: -1
  img_proc: true
- pgno: 34
  md: '# Memory


    Computer programs consist of instructions and data. As discussed in Chapter 1,
    instructions, written in a programming language such as C++ and then translated
    by the compiler and linker into machine language, give the computer step-by-step
    directions on what to do. Data is the information that is the subject of the program.
    For example, if the user of your computer program runs a list of all students
    with a GPA of 4.0, the data could follow instructions to determine and output
    the list of all students with a GPA of 4.0.


    The computer programs'' instructions and data have be in the computer''s memory
    for the program to work. This section will explain the different types of computer
    memory, as well as how and where instructions and data are stored in computer
    memory.


    # Types of Memory


    There are three principal memory locations on your computer.


    +   * The central processing unit (CPU)

    * Random access memory (RAM)

    * Persistent storage


    # Cache Memory


    The CPU is the brains of the computer. You might have thought about the CPU when
    you last considered purchasing a computer, since the CPU''s speed often an important
    purchase decision. The faster the CPU''s speed, the faster your computer runs.


    > A herz, named Heinrich Hertz, who first detected electromagnetic waves, represents
    one cycle per second. CPU speed is measured in megahertz (MHz), which represents
    one million cycles per second, or gigahertz (GHz), which represents 1 billion
    cycles per second. For example, a CPU that runs at 800 MHz executes 800 million
    cycles per second. Each CPU speed determines how many instructions per second
    the CPU can execute.


    The CPU, in addition to coordinating the computer''s operations, has memory, cache
    memory. The CPU''s memory includes a segment called a register. This memory is
    used to store used instructions and data.


    The CPU can access cache memory extremely quickly because it doesn''t have to
    go far; the memory is on the CPU. However, the amount of available cache memory
    is quite small; there is only enough room for the most frequently used instructions
    and data. The remainder of the instructions and data have to be stored somewhere
    else.


    # Random Access Memory


    Somewhere else is random access memory, or RAM. You may also have considered RAM
    when you purchased a computer, since the more RAM a computer has, the more programs
    it can run at one time, and the faster it runs.'
  merge: -1
  img_proc: true
- pgno: 35
  md: 'The CPU can access RAM almost as quickly as cache memory. Additionally, the
    amount of RAM available to store instructions and data is much larger than the
    amount of cache memory.


    However, RAM, like cache memory, is temporary. Instructions and data contained
    in memory are lost once the computer is powered down. You may have had the unpleasant
    experience of losing unsaved data when your computer suffered off a power failure,
    or had to be rebooted.


    Additionally, we would want the data to remain intact after the program ended,
    even if the computer is rebooted or powered off. That is not possible with RAM.


    Furthermore, your computer likely has many other programs, for e-mail, Internet,
    word processing, and so on, that you may not be using right now, but you may want
    to use in the future. Likewise, your computer may also have other files, such
    as term papers, letters, tax spreadsheets, e-mail messages, and so on, that you
    may not be using right now but you may want to use in the future. Accordingly,
    we need another memory location, unlike cache memory or RAM, persistent—that is,
    it will persist even though the computer is rebooted or turned off.


    # Persistent Storage


    That other, persistent type of computer memory is naturally enough, persistent
    storage. This is usually a hard drive, but also could be, among other devices,
    a CD-ROM or DVD-ROM, floppy or disk zip, or optical drive. No matter what storage
    device is used, persistent is lasting; instructions and data remain stored even
    when the computer is powered down. Thus, your computer can be turned off for months,
    but when it is turned on, the files you previously saved are there.


    Persistent storage, in addition to being lasting, also has a much larger capacity
    than RAM—about one hundred one thousand larger.


    Since persistent storage has the advantage of lasting and having a large capacity,
    it is used to store programs and data. For example, if you used Microsoft Word
    on your computer, the files for your program would be stored on your hard drive.
    If you prepared documents using that program, those likewise would be saved as
    files on your hard drive.


    While persistent storage has the advantages of being lasting and having a large
    capacity, a computer program cannot execute instructions located in persistent
    storage. The instructions must be loaded from persistent storage into RAM. Similarly,
    a computer program cannot manipulate data located in persistent storage. This
    data must be loaded from persistent storage into RAM.


    +   **Note** Beyond the scope of this chapter, persistent storage also can serve
    as a backup to RAM, and when serving this is called virtual memory or swap space.


    Generally, computer programs use RAM to store instructions and data, so RAM will
    be our focus in discussing memory. However, much of the discussion of memory may
    also apply to persistent storage. CPU cache memory is a different subject, discussed
    more in connection with programming languages, such as assembly language, that
    are far closer to machine language than C++.


    # Addresses


    When someone asks where you live, you may answer 1313 Mockbird Lane. That is'
  merge: -1
  img_proc: true
- pgno: 36
  md: 'your address.


    Addresses are used to locate persons or places. Addresses usually follow a logical
    pattern. For example, the addresses on one block may be from 1300 to 1399, the
    next from 1400 to 1499, and so on.


    Locations in memory also are identified by address. These addresses look quite
    different than the street addresses we use to, since they are expressed as hexadecimal
    (Base 16) numbers such as 0xfc1. However, regardless of how the number is written,
    as shown in Figure 2-1, memory addresses follow the same logic, sequential pattern
    as street address, one number numbering after another.


    ![](img/59a3417a6d5906fae6d8000d4c2cff76_36_0.png)


    **Figure 2-1:** Sequence of memory addresses


    +   Note &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;**Hexadecimal Numbers**—We use numbers
    that are decimal, or Base 10, in which each digit is 0 and 9. By contrast, memory
    addresses are usually expressed as hexadecimal, or Base 16, in which each digit
    is between 1 and 15. Since it 10, 11, 12, 13, 14, and 15 are not single digits,
    it is expressed as a, 11 as b, 12 as c, 13 as d, 14 as e, and 15 as f. The number
    16 in decimal is expressed as 10 in hexadecimal.


    Memory addresses can be large values, which may be written more compactly in hexadecimal
    than decimal. For example, 1,000,000 in decimal is F42240 in hexadecimal.


    Converting between hexadecimal and decimal is explained in the upcoming section,
    "Converting Between Decimal and Binary or Hexadecimal."


    # Bits and Bytes


    While people live at street addresses, what is stored at each memory address is
    a *byte*. Don''t worry, I have not misspelled Dracula''s favorite palette.


    As discussed in Chapter 1, early computers were a series of switches, one representing
    on, 0 representing off. In computer terminology, a *bit* is either a 1 or a 0.


    However, a computer may think in bits, it cannot process information as small
    as a single bit. Eight bits, or one *byte*, is the smallest unit of information
    that a computer can process.


    Accordingly, each address stores up to one byte of information, represented by
    a sequence of up to eight zeros. Thus, just as a street address may be used to
    locate the people who live there, a memory address can be used to locate the one
    by information that is stored there. Figure 2-2 shows a sequence of memory addresses,
    each with a value.'
