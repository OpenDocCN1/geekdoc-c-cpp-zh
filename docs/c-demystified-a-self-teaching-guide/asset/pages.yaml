    Here the solution contains only project, so there is no practical difference between
    the project and the solution.


    Build means to compile changes from the last compilation (if there was one). Rebuild
    means to start compilation from the beginning. Build is therefore faster, but
    Rebuild is used when there have been extensive changes since the last compilation.
    As a practical matter, it rarely makes a difference which you choose.


    Before compile, make one change to the code, changing cout to Cout (capitalizing
