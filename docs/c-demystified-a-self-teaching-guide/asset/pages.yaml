    A pointer that is using NULL is called a null pointer.


    On most operating systems, programs are not permitted to access memory at address
    0 because that memory is reserved by the operating system. You may be thinking:
    "Wait a minute! He just told me it was to risk having pointers to memory addresses
    reserved by the operating system. Now he''s having us do that on purpose." However,
    the address has special significance; if the pointer is not intended to point
    to an accessible location. Thus, if it is too early in your code to know which
    address to assign to a pointer, you should first assign the pointer to NULL, which
    makes it safe to access the value of a pointer before it is assigned "real" value
    such as the address of another variable or constant.


    # Assigning a Pointer the Address of a Variable or Constant


    Let''s assign a "real" value, the address of another variable or constant. To
    do so, you need to access the address of the variable or constant before you can
