  md: '# Summary


    Object-Oriented Programming (often known by its acronym, OOP) concerns, as its
    name indicates. A common purpose of a program is to provide a solution to real-world
    tasks, which involve people, places, things, or concepts. Programs use objects
    to represent real-world persons, places, things, or concepts.


    Real-world objects also have relationships with other real-world objects. These
    relationships are either an “is a” relationship or a “has a” relationship.


    An example of an “is a” relationship is that a teacher is a person. This type
    of relationship is referred to as inheritance. Inheritance enables you to reuse
    existing code, such as the person class, when creating classes that represent
    specialized objects, like teachers.


    An example of a “has a” relationship is that a car has an engine. This type of
    relationship is also referred to as containment. In addition, inheritance enables
    you to reuse existing code, such as creating classes that represent the containing
    object, like cars.


    Code reuse makes application development faster since you don''t have to “reinvent
    the wheel.” Additionally, the applications you develop are less buggy since the
    code you are reusing has tested. OOP enables programs to model programming objects
    over complex real-world objects, and reuse existing, tested code.


    Objects are generally too complex to be described by a single variable. Additionally,
    the several variables needed to describe an object may have different data types,
    so an array is not option.


    A solution is to use a structure describe describe complex objects. structure
    is a programmer-defined type that enables you to package related variables together,
    even if the variables are of different data types. The variables that belong to
    a structure are called member variables.


    This chapter showed how to declare a structure. The declaration commences with
    struct, which is a keyword indicating that a structure is being declared. The
    struct keyword is followed by a name that indicates what the structures represent.


    Structures, like functions, have a body, enclosed in open and close braces. However,
    unlike functions, the curly brace must be followed by a semicolon. The body of
    the structure contains the member variables of the structure.


    The effect of declaring a structure is similar to declaring your data type. Accordingly,
    you need to declare a structure variable to create an instance of a structure.
    If you have many structure instances, you may declare a separate variable for
    each instance, or instead declare an array of structure instances.


    You use the operator (.) with the structure instance name to access the member
    variables, whether the access is to obtain the value of the variable or to assign
    a value to it.


    There are two you may initialize a structure. The first way is to use an initialization
    list. The second way is to use a constructor. As you learned in Chapter 13, a
    constructor is a function that is automatically called when you attempt to create
    an instance of an'
