    # # The Algorithm


    You learned in Chapter 1 in a computer program a computer programmer gives instructions
    to a computer. These instructions are in a programming language such as C+. However,
    you can write code, you need to formulate the instructions in English or whatever
    language you think in.


    An algorithm, pronounced "Al Gore", is a step-by-step logical procedure for solving
    a problem. You frequently need to create and implement algorithms. Implementing
    algorithms in your code is computer programming. Creating algorithms is a skill
    that can be developed from any field that requires analytical thinking, including
    but not limited to, mathematics as well as computer programming.


    Let''s say you are given a number of pennies, like 387, and you have to determine,
    in your head, how many dollars, quarters, dimes, nickels, and pennies to give
    as change. How would you do it?


    A logical approach is to start with dollars. There are 100 pennies in a dollar.
    If 387 is divided by 100, the quotient is the number of dollars in the pennies:
    3.


    One problem is 387 divided by 100 could be 3.87, 3. However, as discussed earlier
    in this chapter the "Division Operators" section, when an integer is divided by
    an integer, the result always is an integer unless one of the integer operands
    is first cast to a float. We want the result of the division to be an integer,
    or we will not lose any of the integer operands to.


    Since the beginning of pennies (387) is stored in the integer variable *total*,
    if total is divided by 100, also regarded as an integer, the quotient is the number
    of dollars in the pennies, 3.


    ```

    dollars = total / 100;

    ```


    After you take out 300 pennies (3 dollars) from the pile of 387 pennies, 87 pennies
    are left over. 87 is the remainder of the division total / 100. We obtain this
    remainder with the modulus operator, and assign it to the integer variable *leftover*:


    ```

    leftover = total % 100;

    ```


    Next, you follow the same procedure to determine the number of quarters in the
    87 pennies left over. The only differences are that the divisor is 25 instead
    of 100 and the number of pennies is left by *leftover* of *total*.'
