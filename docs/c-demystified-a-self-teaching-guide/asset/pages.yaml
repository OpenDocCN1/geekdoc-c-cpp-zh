  md: "# Indirection Operator and Dereferencing\n\nThe primary use of a pointer is\
    \ to access and, if appropriate, change the value of the variable that the pointer\
    \ is pointing to. In the following program, the value of the integer variable\
    \ `num` is changed twice.\n\n```\n#include <iostream>\nusing namespace std;\n\n\
    int main () {\n    int num = 5;\n    int* IPtr = &num;\n    cout << \"The value\
    \ of num is \" << num << endl;\n    num = 10;\n    cout << \"The value of num\
    \ after num = \" << num << endl;\n    *IPtr = 15;\n    cout << \"The value of\
    \ num after *IPtr is \" << *IPtr << endl;\n    return 0;\n}\n```\n\nThe resulting\
    \ output is\nThe value of num is 5\nThe value of num after num = 10 is 10\nThe\
    \ value of num after *IPtr = 15 is 15\n\nThe first change should be familiar,\
    \ the direct assignment of a value to `num`, such as `num = 10`. However, the\
    \ second change is accomplished a new way, using the indirection operator:\n**IPtr\
    \ = 15;\n\nNote As mentioned earlier in chapter, this is an example of a symbol\
    \ having different meanings in the C++ programming language depending on the context\
    \ in which it was used.\n\nThe placement of the indirection operator before a\
    \ pointer is to dereference the pointer. The value of a dereferenced pointer is\
    \ not an address, but rather the value at that address—that is, the value that\
    \ the pointer points to.\n\nFor example, in the preceding program, `IPtr`'s value\
    \ is the address of `num`. However, the value of `IPtr` dereferenced is the value\
    \ of `num`. Thus, the following two statements have the same effect, both changing\
    \ the value of `num`:\n\n```\nnum = 25;\n*IPtr = 25;\n```\n\nSimilarly, a dereferenced\
    \ pointer can be used in arithmetic expressions the same as the"
