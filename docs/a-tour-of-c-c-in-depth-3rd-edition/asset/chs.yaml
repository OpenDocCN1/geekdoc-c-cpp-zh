  ### 6.1.1 核心操作\n\n用于一个类型的构造函数、析构函数以及拷贝和移动操作在逻辑上并不是分离的。我们必须将它们定义为一个匹配的集合，否则将面临逻辑问题。如果一个类\
  \ `X` 拥有一个执行非平凡任务（如释放存储内存或释放锁）的析构函数，那么该类可能需要全套函数：\n\n```\nclass X {\npublic:\n \
  \   X(Sometype);                    // “普通构造函数”创建一个对象\n    X();                \
  \                     // 默认构造函数\n    X(const X&);                     // 拷贝构造函数\n\
  \    X(X&&);                             // 移动构造函数\n    X& operator=(const X&);\
  \ // 拷贝赋值：清理目标并拷贝\n    X& operator=(X&&);        // 移动赋值：清理目标并移动\n    ~X();    \
  \                              // 析构函数：清理\n    // ...\n};\n```\n\n对象可以被拷贝或移动的五种情况：\n\
  \n* 作为赋值的源\n* 作为对象初始化器\n* 作为函数参数\n* 作为函数返回值\n\n赋值使用拷贝赋值或移动赋值。原则上，其他情况使用拷贝或移动构造函数。然而，拷贝或移动构造函数的调用往往会被优化掉。\n\
  \n### 6.1.2 转换\n\n带有单个参数的构造函数定义了从其参数类型的转换。例如，`complex` (§5.2.1) 提供了一个从 `double`\
  \ 的构造函数：\n\n```\ncomplex z1 = 3.14;   // z1 变为 {3.14,0.0}\ncomplex z2 = z1*2;  \
  \ // z2 变为 z1*{2.0,0} == {6.28,0.0}\n```\n\n这种隐式转换有时是理想的，但并非总是。例如，`Vector` (§5.2.2)\
  \ 提供了一个从 `int` 的构造函数：\n\n```\nVector v1 = 7;   // OK: v1 有 7 个元素\n```\n\n这通常被认为是不利的，标准库的\
  \ `vector` 不允许这种 `int` 到 `vector` 的“转换”。\n\n避免这种问题的方法是说只允许显式“转换”；也就是说，我们可以这样定义构造函数：\n\
  \n\n\n\n```cpp\nclass Vector {\npublic:\n        explicit Vector(int s);       \
  \ // 禁止 int 到 Vector 的隐式转换\n        // ...\n};\n```\n\n这带给我们：\n\n点击此处查看代码图像\n\n\
  ```\nVector v1(7);    // OK: v1 有 7 个元素\nVector v2 = 7;  // 错误：没有 int 到 Vector 的隐式转换\n\
  ```\n\n涉及转换时，像 `Vector` 的类型比像 `complex` 的类型多，因此对于接受单个参数的构造函数，除非有特殊，否则请使用 `explicit`。\n\
  \n### 6.1.3 成员初始化器\n\n当定义类的数据成员时，我们可以提供一个默认初始化器，称为*默认成员初始化器*。考虑 `complex` 的修订版本（§5.2.1）：\n\
  \n点击此处查看代码图像\n\n```cpp\nclass complex {\n        double re = 0;\n        double\
  \ im = 0; // 表示：两个默认值为 0.0 的双精度浮点数\npublic:\n        complex(double r, double i)\
  \ :re{r}, im{i} {}     // 从两个标量构造 complex：{r,i}\n        complex(double r) :re{r}\
  \ {}                              // 从一个标量构造 complex：{r,0}\n        complex() {}\
  \                                                      // 默认 complex：{0,0}\n   \
  \     // ...\n}\n```\n\n构造函数没有提供值时，就会使用默认值。这简化了代码，并帮助我们避免意外地留下未初始化的成员。\n\n## 6.2\
  \ 拷贝与移动\n\n默认情况下，对象是可以拷贝的。这对于用户定义类型的对象以及内置类型都是如此。拷贝的默认含义是成员级拷贝：拷贝每个成员。例如，使用 §5.2.1\
  \ 中的 `complex`：\n\n点击此处查看代码图像\n\n```cpp\nvoid test(complex z1)\n{\n        complex\
  \ z2 {z1};      // 拷贝初始化\n        complex z3;\n        z3 = z2;                \
  \    // 拷贝赋值\n        // ...\n}\n```\n\n现在 `z1`、`z2` 和 `z3` 具有相同的值，因为赋值和初始化都拷贝了两个成员。\n\
  \n当我们设计类时，必须始终考虑对象可能何时以及如何被拷贝。对于简单的具体类型，成员级拷贝通常是拷贝的恰当语义。对于某些复杂的具体类型（例如 `Vector`），成员级拷贝并不是拷贝的正确语义；对于抽象类型，它几乎从不如此。\n\
  \n### 6.2.1 拷贝容器\n\n当一个类是*资源句柄*（resource handle）时——也就是说，当类负责一个通过指针访问的对象时——默认的成员级拷贝通常是一场灾难。成员级拷贝将违反资源句柄的不变性（§4.3）。例如，默认拷贝将导致\
  \ `Vector` 的副本指向与原始对象相同的元素：\n\n点击此处查看代码图像\n\n```cpp\nvoid bad_copy(Vector v1)\n\
  {\n        Vector v2 = v1;        // 将 v1 的表示拷贝到 v2\n        v1[0] = 2;        \
  \         // v2[0] 现在也是 2！\n        v2[1] = 3;                 // v1[1] 现在也是 3！\n\
  }\n```\n\n假设 `v1` 有四个元素，其结果可以用图示表示：\n\n![图像](img/f0075-02.jpg)\n\n幸运的是，`Vector`\
  \ 拥有析构函数是一个强力暗示，表明默认的（成员级）拷贝语义是错误的，编译器至少应对对此示例发出警告。我们需要定义更好的拷贝语义。\n\n类对象的拷贝由两个成员定义：*拷贝构造函数*和*拷贝赋值*：\n\
  \n点击此处查看代码图像\n\n```cpp\nclass Vector {\npublic:\n        Vector(int s);        \
  \                                    // 构造函数：建立不变性，获取资源\n        ~Vector() { delete[]\
  \ elem; }                      // 析构函数：释放资源\n\n        Vector(const Vector& a);\
  \                         // 拷贝构造函数\n        Vector& operator=(const Vector& a);\
  \     // 拷贝赋值\n\n        double& operator[](int i);\n        const double& operator[](int\
  \ i) const;\n\n        int size() const;\nprivate:\n        double* elem;  // elem\
  \ 指向包含 sz 个 double 的数组\n        int sz;\n};\n```\n\n`Vector` 拷贝构造函数的适当定义为所需元素数量分配空间，然后将元素拷贝其中，这样拷贝后每个\
  \ `Vector` 都有它们自己的元素副本：\n\n点击此处查看代码图像\n\n```cpp\nVector::Vector(const Vector& a)\
  \        // 拷贝构造函数\n        :elem{new double[a.sz]},           // 为元素分配空间\n    \
  \    sz{a.sz}\n{\n        for (int i=0; i!=sz; ++i)                 // 拷贝元素\n```\n\
  \n`v1` 的结果现在可以用图示表示：\n\n![图像](img/f0075-02.jpg)\n\n幸运的是，`Vector` 拥有析构函数是一个强力暗示，表明默认的（成员级）拷贝语义是错误的，编译器至少应对对此示例发出警告。我们需要定义更好的拷贝语义。\n\
  \n\n\n\n\n```\nVector::Vector(Vector&& a)\n        :elem{a.elem},              \
  \   // 从 a 中“获取元素”\n        sz{a.sz}\n{\n        a.elem = nullptr;             \
  \ // 现在 a 没有元素了\n        a.sz = 0;\n}\n```\n\n`&&` 表示“右值引用”（rvalue reference），它是一个可以绑定到右值的引用。“右值”（rvalue）一词是为了与“左值”（lvalue）相对应的的概念，左值大致意思是“可以出现在赋值语句左侧的东西”\
  \ [Stroustrup,2010]。因此，从粗略上来说，右值是你无法对其进行赋值的值，例如函数调用返回的整数。因此，右值引用是对任何其他人无法对其赋值的对象的引用，所以我们可以安全地“偷取”它的值。`Vector`\
  \ 的 `operator+()` 中的局部变量 `res` 就是一个例子。\n\n移动构造函数不接受 `const` 参数：毕竟，移动构造函数的作用本是从其参数中移除该值。*移动赋值*（move\
  \ assignment）的定义也类似。\n\n当右值引用被用初始化器或赋值的右侧时，就会应用移动操作。\n\n在移动之后，被移动的对象应该处于一种允许运行析构函数的状态。通常，我们还允许对被移动的对象进行赋值。标准库算法（第\
  \ 13 章\n\n```\nVector f()\n{\n        Vector x(1000);\n        Vector y(2000);\n\
  \        Vector z(3000);\n        z = x;                          // 我们得到了拷贝（x 之后可能在\
  \ f() 中被使用）\n        y = std::move(x);      // 我们得到了一个移动（移动赋值）\n        // ... 最好在这里不要使用\
  \ x ...\n        return z;                   // 我们得到了一个移动\n}\n```\n\n标准库函数 `move()`\
  \ 实际上并没有移动任何东西。相反，它返回其参数的引用，我们可以从该引用进行移动——这是一个右值引用；它是一种类型转换 (§5.2.3)）。\n\n在 `return`\
  \ 之前，我们有：\n\n![Images](img/f0078-02.jpg)\n\n当我们从 `f()` 返回时，`z` 在其元素被 `return` 移出\
  \ `f()` 之后被破坏。然而，`y` 的析构函数将 `delete[]` 它的元素。\n\n编译器根据 C++ 标准有义务消除与初始化相关的大部分拷贝，因此移动构造函数的调用频率并没有你想象的那么高。这种*拷贝消除*（copy\
  \ elision）消除了移动带来的极微小的开销。另一方面，通常无法隐式地消除赋值操作中的拷贝或移动操作，因此移动赋值对性能至关重要。\n\n## 6.3 资源管理\n\
  \n通过定义构造函数、拷贝操作、移动操作和析构函数，程序员可以对包含资源（如容器的元素）的生命周期提供完全控制。此外，移动构造函数允许对象简单且廉价地从一个作用域移动到另一个作用域。这样一来，我们无法或不希望拷贝出作用域的对象就可以被简单且廉价地移动出去。考虑一个代表并发活动的标准库\
  \ `thread` (§18.2) 和一个包含一百万个 `double` 的 `Vector`。我们无法拷贝前者，也不想拷贝后者。\n\n点击此处查看代码图片\n\
  \n```cpp\nstd::vector<thread> my_threads;\n\nVector init(int n)\n{\n        thread\
  \ t {heartbeat};                                   // 并发运行 heartbeat（在单独线程中）\n \
  \       my_threads.push_back(std::move(t));     // 将 t 移动到 my_threads (§16.6)\n\
  \        // ... 更多初始化 ...\n\n        Vector vec(n);\n        for (auto& x : vec)\n\
  \                x = 777;\n        return vec;                                 \
  \                  // 将 vec 移出 init()\n}\n\nauto v = init(1 000 000);          \
  \   // 启动 heartbeat 并初始化 v\n```\n\n资源句柄（如 `Vector` 和 `thread`）在许多情况下是直接使用内置指针的优替代方案。事实上，标准库的“智能指针”（如\
  \ `unique_ptr`）本身就是资源句柄 (§15.2.1)。\n\n我使用标准库的 `vector` 来持有 `thread`，因为在 §7.2 之前，我们无法为简单的\
  \ `Vector` 指定元素类型。\n\n就像 `new` 和 `delete` 从应用代码中消失一样，我们可以让指针消失资源句柄。在这两种情况下，结果都是更简单、更易维护的代码，且没有额外的开销。特别是，我们可以实现*强资源安全*（strong\
  \ resource safety）；即，我们可以实现强资源安全。在许多语言中，资源管理主要委托给垃圾回收器。在 C++ 中，你可以接入垃圾回收器。然而，随着系统变得分布式，局部性比以往任何时候都重要。\n\
  \n此外，内存并不是唯一的资源。资源是任何需要获取并（显式或隐式地）释放的东西。良好的资源管理系统处理所有类型的资源。在任何长时间运行的系统中必须避免泄漏，但过度的资源留存与泄漏一样糟糕。例如，如果系统对内存、锁等保留了两倍的时间，系统就需要双倍的资源。\n\
  \n在诉诸垃圾回收之前，系统地使用资源句柄：让每个资源在某个作用域内所有者，并默认在作用域结束时释放。在 C++ 中，这被称为 RAII（资源获取初始化），共享所有可以通过“智能指针”表示\
  \ (§15.2.1)。\n\n在 C++ 标准库中，RAII 无处不在：例如内存（`string`、`vector`、`map`、`unordered_map`\
  \ 等）、文件（`ifstream`、`ofstream` 等）、线程（`thread`）、锁（`lock_guard`、`unique_lock` 等）以及通用对象（通过\
  \ `unique_ptr` 和 `shared_ptr`）。结果是在在用法中是隐式的，并缩短了资源留存时间。\n\n## 6.4 运算符重载\n\n我们可以为自定义类型赋予\
  \ C++ 运算符的意义 (§2.4, §5.2.1)。这被称为*运算符重载*，因为在使用时，必须从一组具有同名的运算符中选择正确的实现。例如，我们在 `z1+z2`\
  \ 中复杂的 `+` (§5.2.1) 必须与整数 `+` 和浮点 `+` (§1.4.1) 区分开来。\n\n定义新运算符是不可能的，例如我们无法定义 `^^`、`===`、`,`、`$`\
  \ 或一元 `%` 运算符。这样做带来的困惑将大于益处。\n\n\n\n\n强烈建议按照常规语义定义运算符。例如，定义一个执行减法操作 `+` 运算符对任何人都没有处。\n\
  \n我们可以为用户自定义类型（类和枚举）定义运算符：\n\n*   二元算术运算符：`+`、`-`、`*`、`/` 和 `%`\n*   二元逻辑运算符：`&`（位与）、`|`（位或）和\
  \ `^`（位异或）\n*   二元关系运算符：`==`、`!=`、 `<`, `<=`, `>=`, `<=>`\n*   逻辑运算符：`&&` 和 `||`\n\
  *   一元算术和逻辑运算符：`+`、`-`、`^~`（位取反）和 `!`（逻辑取反）\n*   赋值：`=`、`+=`、`*=` 等\n*   增量和减：`++`\
  \ 和 `--`\n*   指针操作：`->`、一元 `*` 和一元 `&`\n*   应用（调用）：`()`\n*   下标：`[]`\n*   逗号：`,`\n\
  *   移位：`>>` 和 `<<`\n\n遗憾的是，我们无法定义点运算符 (`.`) 来获取智能引用。\n\n运算符可以定义为成员函数：\n\n点击此处查看代码图片\n\
  \n```cpp\nclass Matrix {\n        // ...\n        Matrix& operator=(const Matrix&\
  \ a);       // 将 m 赋值给 *this; 返回 *this 的引用\n};\n```\n\n对于修改其第一个操作数的运算符，这通常是常规做法，并且由于历史原因，`=`、`->`、`()`\
  \ 和 `[]` 必须这样做。\n\n或者，大多数运算符可以定义为全局函数：\n\n点击此处查看代码图片\n\n```cpp\nMatrix operator+(const\
  \ Matrix& m1, const Matrix& m2);         // 将 m1 赋值给 m2 并返回和\n```\n\n将具有对称操作数的运算符定义为全局函数是常规做法，这样两个操作数被同等对待。为了从返回如\
  \ `Matrix` 这样可能的大对象中良好的性能，我们依赖于移动语义 (§6.2.2)。\n\n## 6.5 常规操作\n\n某些操作在为类型定义时具有常规意义。这些常规意义被程序员和库（特别是标准库）视为，因此在设计具有意义的操作的新类型时，遵循它们是明智的。\n\
  \n*   比较：`==`、`!=`、 `<`, `<=`, `>=`, `<=>` (§6.5.1)\n*   容器操作：`size()`、`begin()`\
  \ 和 `end()` (§6.5.2)\n*   迭代器和“智能指针”：`->`、`*`、`[]`、`++`、`--`、`+`、`-`、`+=` 和 `-=`\
  \ (§13.3, §15.2.1)\n*   函数对象：`()` (§7.3.2)\n*   输入输出操作：`>>` 和 `<<` (§6.5.4)\n* \
  \  `swap()` (§6.5.5)\n*   哈希函数：`hash<>` (§6.5.6)\n\n### 6.5.1 比较（关系运算符）\n\n相等比较（`==`\
  \ 和 `!=`）的含义与拷贝密切相关。拷贝之后，拷贝之间应该相等：\n\n点击此处查看代码图片\n\n```cpp\nX a = something;\nX\
  \ b = a;\nassert(a==b);   // 如果这里 a!=b，那么情况非常奇怪 (§4.5)\n```\n\n在定义 `==` 时，也定义 `!=`\
  \ 并确保 `a!=b` 意味着 `!(a==b)`。\n\n同样，如果你定义了 `<`，也定义了 `<=`、`>`、>=` 以确保通常的等式成立：\n\n*\
  \   `a<=b` 意味着 `(a<b)||(a==b)` 和 `!(b<a)`。\n*   `a>b` 意味着 `b<a`。\n*   `a>=b` 意味着\
  \ `(a>b)||(a==b)` 和 `!(a<b)`。\n\n为了对二元运算符的所有操作数（如 `==`）进行相同的处理，最好是在其类的命名空间中将其定义为全局函数。例如：\n\
  \n点击此处查看代码图片\n\n```cpp\nnamespace NX {\n        class X {\n                // ...\n\
  \        };\n        bool operator==(const X&, const X&);\n        // ...\n};\n\
  ```\n\n“太空船运算符” `<=>` 本身就是一个法则；它的规则与其他所有运算符都不同。特别是，通过定义默认的 `<=>`，其他关系运算符被隐式定义了。\n\
  \n\n\n在这里，`c.begin()` 是一个指向 `c` 第一个元素的迭代器，而 `c.end()` 指向 `c` 最后一个元素的之后。像指针一样，迭代器支持使用\
  \ `++` 移动到下一个元素，并使用 `*` 访问指向元素的值。\n\n这些 `begin()` 和 `end()` 函数也被用于范围 `for` 循环的实现，因此我们可以简化对范围的循环：\n\
  \n```\nfor (auto& x : c)\n        x= 0;\n```\n\n迭代器用于将序列传递给标准库算法。例如：\n\n```\nsort(v.begin(),v.end());\n\
  ```\n\n这种*迭代器模型* (§13.3) 提供了极大的通用性和效率。有关细节和更多容器操作，请参见第 12 章 和 第 13 章。\n\n`begin()`\
  \ 和 `end()` 也可以定义为独立函数；参见 §7.2。`const` 容器的 `begin()` 和 `end()` 版本被称为 `cbegin()`\
  \ 和 `cend()`。\n\n### 6.5.3 迭代器与“智能指针”\n\n用户定义的迭代器 (§13.3) 和“智能指针” (§15.2.1) 实现了其目的所需的指针运算符和特性，并经常根据需要添加语义。\n\
  \n*   访问：`*`、`->`（用于类）以及 `[]`（用于容器）\n*   迭代/导航：`++`（向前）、`--`（向后）、`+=`、`-=`、`+` 和\
  \ `-`\n*   拷贝和或移动：`=`\n\n### 6.5.4 输入和输出操作\n\n对于整数对，`<<` 表示左移，`>>` 表示右移。然而，对于 `iostreams`，它们分别是输出和输入运算符\
  \ (§1.8, 第 11 章。有关细节和更多 I/O 操作，请参见第 11 章。\n\n### 6.5.5 swap()\n\n许多算法，特别是 `sort()`，使用\
  \ `swap()` 函数来交换两个对象的值。此类算法通常假设 `swap()` 是非常快速且不会抛出异常的。标准库提供了 `std::swap(a,b)`，它通过三个移动操作实现\
  \ (§16.6)。如果你设计了一个拷贝开销大且可能被交换（例如，通过排序函数）的类型，请为它提供移动构造函数或移动赋值运算符，或者提供一个 `swap()`\
  \ 函数，或者两者都提供。请注意，标准库容器（第 12 章 和 `string` (§10.2.1)）具有快速的移动操作。\n\n### 6.5.6 hash<>\n\
  \n标准库的 `unordered_map<K,V>` 是哈希表，其中 `K` 是键类型，`V` 是值类型 (§12.6)。要将类型 `X` 用作键，必须定义\
  \ `hash<X>`。对于常见类型，如 `std::string`，标准库为我们定义了 `hash<>`。\n\n## 6.6 用户定义字面量\n\n类的目的之一是允许程序员设计并实现紧密模仿内置类型的类型。构造函数提供的初始化等同或超过了内置类型初始化的灵活性效率，但对于内置类型，我们拥有字面量：\n\
  \n*   `123` 是一个 `int`。\n*   `0xFF00u` 是一个 `unsigned int`。\n*   `123.456` 是一个 `double`。\n\
  *   `\"Surprise!\"` 是 `const char[10]`。\n\n为用户定义类型提供此类字面量也是很有用的。这是通过为字面量定义适当后缀的含义来实现的，这样我们可以得到\n\
  \n*   `\"Surprise!\"s` 是一个 `std::string`。\n*   `123s` 是 `seconds`（秒）。\n*   `12.7i`\
  \ 是 `imaginary`（虚数），使得 `12.7i+47` 是一个 `complex`（复数），即 `{47,12.7}`。\n\n特别是我们可以通过使用适当的头文件和命名空间从标准库获取这些示例：\n\
  \n| 标准库字面量后缀 | | |\n| --- | --- | --- |\n| `<chrono>` | `std::literals::chrono_literals`\
  \ | `h, min`, `s`, `ms`, `us`, `ns` |\n| `<string>` | `std::literals::string_literals`\
  \ | `s` |\n| `<string_view>` | `std::literals::string_literals` | `sv` |\n| `<complex>`\
  \ | `std::literals::complex_literals` | `i`, `il`, `if` |\n\n带有用户定义后缀的字面量被称为*用户定义字面量*或\
  \ *UDLs*。此类字面量使用*字面量运算符*定义。字面量运算符将其参数类型的字面量后跟一个下标转换为其返回类型。例如，用于 `imaginary` 后缀的\
  \ `i` 可能这样实现：\n\n```cpp\nconstexpr complex<double> operator\"\"(long double arg)\
  \ // imaginary 字面量\n{\n        return {0,arg};\n}\n```\n\n*   `operator\"\"` 表示我们正在定义一个字面量运算符。\n\
  *   字面量标识 `\"\"` 之后的 `i` 是运算符赋予含义的后缀。\n*   参数类型 `long double` 表示该后缀 (`i`) 是为浮点字面量定义的。\n\
  *   返回类型 `complex<double>` 指定了结果字面量的类型。\n\n既然如此，我们可以写：\n\n```cpp\ncomplex<double>\
  \ z = 2.718218+6.28315i;\n```\n`i` 后缀的实现和 `+` 都是 `constexpr`，因此 `z` 的计算是在编译时完成的。\n\
  \n## 6.7 建议\n\n1. 控制对象的构造、拷贝和析构；§6.1。\n2. 将构造函数、赋值运算符和析构函数设计为一组匹配的操作；§6.1。\n3. 定义所有核心操作或一个都不定义；§6.1。\n\
  4. 如果默认构造函数、赋值运算符或析构函数是合适的，让编译器生成它们；§6.1。\n5. 如果类具有指针成员，考虑它是否需要用户定义的或删除的析构函数、拷贝和移动；§6.1。\n\
  6. 如果类具有用户定义的析构函数，它可能需要用户定义的或删除的拷贝和移动；§6.2。\n7. 默认情况下将单参数构造函数声明为 `explicit`；§6.1。\n\
  8. 如果类成员有一个合理的默认值，请作为数据成员初始化提供；§6.1。\n9. 如果默认值对于某种类型不合适，请重新定义或禁止拷贝；§6.1。\n10. 按值返回容器（依赖拷贝消除和移动来提高效率）；§6.2。\n\
  11. 避免显式使用 `std::copy()`；§16.6。\n12. 对于大型操作数，使用 `const` 引用类型；§6.2。\n13. 提供强资源安全；即永远不要泄漏你认为是资源的内容；§6.3。\n\
  14. 如果类是一个资源句柄，它需要用户定义的构造函数、析构函数和非默认拷贝操作；§6.3。\n15. 使用 RAII 管理所有资源（内存和非内存）；§6.3。\n\
  16. 重载操作以模仿惯用法；§6.5。\n17. 如果你重载了运算符，请定义所有习惯上一起工作的操作；§6.1, §6.5。\n18. 如果你为某种类型定义\
  \ `<=>` 为非默认，也定义 `==`；§6.5。\n19. 遵循标准库容器的设计；§6.2。\n\n## 7\n\n## 模板\n\n*在此处输入你的引用。*\n\
  \n*– B. Stroustrup\n\n*   引言\n\n*   参数化类型\n\n    约束模板参数; 值模板参数; 模板参数推导\n\n*   参数化操作\n\
  \n\n\n\n# 函数模板 Function Templates; 函数对象; Lambda 表达式\n\n* 模板机制\n    变量模板; 别名; 编译期\
  \ if\n* 适配器/Advice\n\n## 7.1 引言\n\n想要使用 vector（动态数组）的人不太可能总是想要一个 `double` 类型的 vector。vector\
  \ 是一个通用概念，独立于浮点数的概念。因此，vector 的元素类型应该独立地表示。*模板*（template）是一个类或函数，我们用一组类型或值来对其进行参数化。我们使用模板来表示那些最好理解为通用某种的想法，我们可以通过指定参数（例如将\
  \ `double` 作为 `vector` 的元素类型）从中生成特定的类型和函数。\n\n本章重点关注语言机制。第 8 章后续介绍了编程技术，而库章节（第 10\
  \ 章–第 18 章）提供了许多示例。\n\n## 7.2 参数化类型\n\n我们可以通过将 `double` vector 类型（§5.2.2）变为 `template`，并将特定类型\
  \ `double` 替换为类型参数，将其泛化为任意类型的 vector。例如：\n\n点击此处代码图片\n\n```cpp\ntemplate<typename\
  \ T>\nclass Vector {\nprivate:\n        T* elem;  // elem 指向一个包含 sz 个 T 类型元素的数组\n\
  \        int sz;\npublic:\n        explicit Vector(int s);                  // 构造函数：建立不变性，获取资源\n\
  \        ~Vector() { delete[] elem; }         // 析构函数：释放资源\n\n        // ... 拷贝和移动操作\
  \ ...\n\n        T& operator[](int i);                                    // 用于非\
  \ const Vector\n        const T& operator[](int i) const;               // 用于 const\
  \ Vector (§5.2.1)\n        int size() const { return sz; }\n};\n```\n\n`template<typename\
  \ T>` 前缀使得 `T` 成为其前缀声明的类型参数。它是 C++ 版本的数学符号“对于所有 T”，或者更准确地说是“对于所有类型 T”。如果你想要数学上的“对于所有\
  \ T，使得 P(T)”，则使用概念（concepts）（§7.2.1, §8.2）。使用 `class` 引入类型参数等同于使用 `typename`，在旧代码中，我们经常看到\
  \ `template<class T>` 作为前缀。\n\n成员函数可以类似的定义：\n\n点击此处代码图片\n\n```cpp\ntemplate<typename\
  \ T>\nVector<T>::Vector(int s)\n{\n        if (s<0)\n                throw length_error{\"\
  Vector 构造函数：负数大小\"};\n        elem = new T[s];\n        sz = s;\n}\n\ntemplate<typename\
  \ T>\nconst T& Vector<T>::operator[](int i) const\n{\n        if (i<0 || size()<=i)\n\
  \                throw out_of_range{\"Vector::operator[]\"};\n        return elem[i];\n\
  }\n```\n\n给定这些定义，我们可以这样定义 `Vector`：\n\n点击此处代码图片\n\n```cpp\nVector<char> vc(200);\
  \            // 200 个字符的 vector\nVector<string> vs(17);            // 17 个字符串的 vector\n\
  Vector<list<int>> vli(45);        // 45 个整数列表的 vector\n```\n\n`Vector<list<int>>`\
  \ 中的 `>>` 结束了嵌套的模板参数；它 并不是一个误放的输入运算符。\n\n我们可以这样使用 `Vector`：\n\n点击此处代码图片\n\n```cpp\n\
  void write(const Vector<string>& vs)                // 某些字符串的 vector\n{\n      \
  \  for (int i = 0; i!=vs.size(); ++i)\n                cout << vs[i] << '\\n';\n\
  }\n```\n\n为了为我们的 `Vector` 支持范围 `for` 循环，我们必须定义合适的 `begin()` 和 `end()` 函数：\n\n点击此处代码图片\n\
  \n```cpp\ntemplate<typename T>\nT* begin(Vector<T>& x)\n{\n        return &x[0];\
  \     // 指向第一个元素或指向最后一个元素之后的指针\n}\n\ntemplate<typename T>\nT* end(Vector<T>& x)\n\
  {\n        return &x[0]+x.size();                 // 指向最后一个元素之后的指针\n}\n```\n\n给定这些，我们可以写道：\n\
  \n点击此处代码图片\n\n```cpp\nvoid write(const Vector<string>& vs)                // 某些字符串的\
  \ vector\n{\n        for (auto& s : vs)\n                cout << s << '\\n';\n}\n\
  ```\n\n\n\n\n```cpp\ntemplate<typename T, int N>\nstruct Buffer {\n        constexpr\
  \ int size() { return N; }\n        T elem[N];\n        // ...\n};\n```\n\n值参数在许多上下文中都有用。例如，`Buffer`\
  \ 允许我们创建任意大小的缓冲区，而无需使用空闲（动态内存）：\n\n点击此处查看代码图像\n\n```cpp\nBuffer<char,1024> glob;\
  \   // 字符全局缓冲区（静态分配）\n\nvoid fct()\n{\n        Buffer<int,10> buf;   // 整数本地缓冲区（在栈上）\n\
  \        // ...\n}\n```\n\n遗憾的是，由于某些晦的技术原因，字符串字面量目前尚不能作为模板值参数。然而，在某些上下文中，使用字符串值进行参数化的能力至关重要。幸运的是，我们可以使用一个持有字符串字符的数组：\n\
  \n点击此处查看代码图像\n\n```cpp\ntemplate<char* s>\nvoid outs() { cout << s; }\n\nchar arr[]\
  \ = \"Weird workaround!\";\n\nvoid use()\n{\n        outs<\"straightforward use\"\
  >();        // 错误（目前）\n        outs<arr>();                                    \
  \      输出: Weird workaround!\n}\n```\n\n在 C++ 中，通常有通变方法；我们不需要为每种用例提供直接支持。\n\n###\
  \ 7.2.3 模板参数推导\n\n当定义一个类型作为模板的实例化时，我们必须指定其模板参数。考虑使用标准库中的模板 `pair`：\n\n点击此处查看代码图像\n\
  \n```cpp\npair<int,double> p = {1, 5.2};\n```\n\n必须指定模板参数类型可能是很麻烦的。幸运的是，在许多上下文中，我们可以简单让\
  \ `pair` 的构造函数从初始化列表中推导模板参数：\n\n点击此处查看代码图像\n\n```cpp\npair p = {1, 5.2};       \
  \      // p 是一个 pair<int,double>\n```\n\n容器提供了另一个例子：\n\n点击此处查看代码图像\n\n```cpp\ntemplate<typename\
  \ T>\nclass Vector {\npublic:\n        Vector(int);\n        Vector(initializer_list<T>);\
  \       // 初始化列表构造函数\n        // ...\n};\n\nVector v1 {1, 2, 3};            // 从初始化元素类型推导\
  \ v1 的元素类型：int\nVector v2 = v1;                 // 从 v1 的元素类型推导 v2 的元素类型：int\n\n\
  auto p = new Vector{1, 2, 3};    // p 是一个 Vector<int>*\n\nVector<int> v3(1);   \
  \  // 这里我们需要显式指定元素类型（未提到元素类型）\n```\n\n显然，这简化了符号，并可以消除因误写冗余模板参数类型带来的烦恼。然而，它并不是万灵药。和所有其他强大的机制一样，推导可能会导致意外。考虑：\n\
  \n点击此处查看代码图像\n\n```cpp\nVector<string> vs {\"Hello\", \"World\"};      // OK: Vector<string>\n\
  Vector vs1 {\"Hello\", \"World\"};                  // OK: 推导为 Vector<const char[6]>（意外？）\n\
  Vector vs2 {\"Hello\"s, \"World\"s};              // OK: 推导为 Vector<string>\nVector\
  \ vs3 {\"Hello\"s, \"World\"};                // 错误：初始化列表不是同质的\nVector<string> vs4\
  \ {\"Hello\"s, \"World\"};  // OK: 元素类型是显式的\n```\n\nC 风格字符串字面量的类型是 `const char[N]`，其中\
  \ `N` 是字符数加上终止零的数量 (§1.7.1)。如果这不是 `vs1` 的意图，我们必须显式指定元素类型，或使用 `s` 后缀使其成为一个真正的 `string`\
  \ (§10.2)。\n\n如果初始化列表中的元素类型不同，我们无法推导出唯一的元素类型，因此会得到歧义错误。\n\n有时，我们需要解决歧义。例如，标准库的 `vector`\
  \ 有一个构造函数接受一对界定序列的迭代器，以及一个可以接受一对值的初始化构造函数。考虑：\n\n点击此处查看代码图像\n\n```cpp\ntemplate<typename\
  \ T>\nclass Vector {\npublic:\n        Vector(initializer_list<T>);         // 初始化列表构造函数\n\
  \n        template<typename Iter>\n                Vector(Iter b, Iter e);     \
  \     // [b:e) 迭代器对构造函数\n\n        struct iterator { using value_type = T; /* ...\
  \ */ };\n        iterator begin();\n\n        // ...\n};\n\nVector v1 {1, 2, 3,\
  \ 4, 5};                              // 元素类型是 int\nVector v2(v1.begin(),v1.begin()+2);\
  \          // 一对迭代器还是一对值（类型为 iterator）？\nVector v3(9,17);        // 错误：the\n```\n\
  \n\n\n这个 `sum()` 是标准库 `accumulate()` 的简化版本 (§17.3)。\n\n函数模板可以是成员函数，但不能是 `virtual`\
  \ 成员。编译器无法知道程序中此类模板的所有实例化情况，因此它无法生成 `vtbl` (§5.4)。\n\n### 7.3.2 函数对象\n\n一种特别有用的模板是*函数对象*（function\
  \ object，有时称为*仿函数*即 functor），它用于定义可以像函数一样调用的对象。例如：\n\n点击此处查看代码图像\n\n```\ntemplate<typename\
  \ T>\nclass Less_than {\n        const T val;       // 用于比较的值\npublic:\n       \
  \ Less_than(const T& v) :val{v} { }\n        bool operator()(const T& x) const {\
  \ return x<val; }  // 调用运算符\n};\n```\n\n名为 `operator()` 的函数实现了*应用运算符* `()`，它也称为“函数调用”或简单的“调用”。\n\
  \n我们可以为某些参数类型定义类型为 `Less_than` 的命名变量：\n\n点击此处查看代码图像\n\n```\nLess_than lti {42};\
  \                              // lti(i) 将使用 < 比较 i 和 42 (i<42)\nLess_than lts {\"\
  Backus\"}};               // lts(s) 将使用 < 比较 s 和 \"Backus\" (s<\"Backus\")\nLess_than<string>\
  \ lts2 {\"Naur\"};     // \"Naur\" 是 C 风格字符串，所以我们需要 <string> 来获取正确的 <\n```\n\n我们可以像调用函数一样调用这样的对象：\n\
  \n点击此处查看代码图像\n\n```\nvoid fct(int n, const string& s)\n{\n        bool b1 = lti(n);\
  \        // 如果 n<42 则为 true\n        bool b2 = lts(s);       // 如果 s<\"Backus\"\
  \ 则为 true\n        // ...\n}\n```\n\n函数对象被广泛用作算法的参数。例如，我们可以统计谓词返回 `true` 的值的出现次数：\n\
  \n点击此处查看代码图像\n\n```\ntemplate<typename C, typename P>\nint count(const C& c, P pred)\
  \            // 假设 C 是容器，P 是其元素的谓词\n{\n        int cnt = 0;\n        for (const\
  \ auto& x : c)\n                if (pred(x))\n                        ++cnt;\n \
  \       return cnt;\n}\n```\n\n这是标准库 `count_if` 算法的简化版本 (§13.5)。\n\n给定概念 (§8.2)，我们可以对\
  \ `count()` 关于参数的假设形式化，并在编译时检查它们。\n\n*谓词*（predicate）是我们可以调用它以返回 `true` 或 `false`\
  \ 的东西。例如：\n\n点击此处查看代码图像\n\n```\nvoid f(const Vector<int>& vec, const list<string>&\
  \ lst, int x, const string& s)\n{\n        cout << \"number of values less than\
  \ \" << x << \": \" << count(vec,Less_than{x}) << '\\n';\n        cout << \"number\
  \ of values less than \" << s << \": \" << count(lst,Less_than{s}) << '\\n';\n}\n\
  ```\n\n在这里，`Less_than{x}` 构建了一个类型为 `Less_than<int>` 的对象，其调用运算符与名为 `x` 的 `int` 值比较；`Less_than{s}`\
  \ 构建了一个与名为 `s` 的 `string` 值比较的对象。\n\n函数对象的优之处在于它们携带了要比较的值。我们不需要为每个值（以及每种类型）编写单独的函数，也不需要引入糟糕的全局变量来存储值。此外，对于像\
  \ `Less_than` 这样简单的函数对象，内联是简单的，因此对 `Less_than` 的调用比间接函数调用高效得多。携带数据能力及其高效使得函数对象作为算法参数时特别有用。\n\
  \n用于指定通用算法关键操作含义的函数对象（例如 `count()` 的 `Less_than`）有时被称为*策略对象*（policy objects）。\n\n\
  ### 7.3.3 Lambda 表达式\n\n在 §7.3.2 中，我们独立于其用法定义了 `Less_than`。这可能非常不方便。因此，有一种符号用于隐式生成函数对象：\n\
  \n点击此处查看代码图像\n\n### 7.3.3.1 作为函数参数的 Lambda\n\n使用 lambda 可以既方便又简洁，但也可能晦涩。对于非平凡的操作（例如，超过一个简单的表达式），我更倾向于给操作命名。\n\
  \n```cpp\nint count(const C& c, P pred)            // 假设 C 是容器，P 是其元素的谓词\n{\n  \
  \      int cnt = 0;\n        for (const auto& x : c)\n                if (pred(x))\n\
  \                        ++cnt;\n        return cnt;\n}\n```\n\n（注：提供的 Lambda 部分文本存在重复，此处已根据核心内容进行逻辑对齐。）\n\
  \n使用 lambda 可以既方便又简洁，但也可能晦涩。现在，我们可以像调用函数一样调用这样的对象，写出 §5.5 中的 `user()` 版本，而无需编写一系列\
  \ `_all` 函数：\n\n\n\n\n\n在这里，与变量声明一样，`auto` 意味着接受任何类型的值作为初始化器（在调用时，参数被认为初始化了形式参数）。这使得带有\
  \ `auto` 参数的 lambda 成为模板，一个*泛型 lambda*。在需要时，我们可以使用 concept（概念，§8.2）对参数进行约束。例如，我们可以定义\
  \ `Pointer_to_class` 要求包含 `*` 和 `->` 并写道：\n\n点击此处查看代码图像\n\n```\nfor_each(v,[](Pointer_to_class\
  \ auto& s){ s->rotate(r); s->draw(); });\n```\n\n我们可以使用任何可以 `draw()` 和 `rotate()`\
  \ 的对象容器来调用这个泛型 `rotate_and_draw()`。例如：\n\n点击此处查看代码图像\n\n```\nvoid user()\n{\n  \
  \      vector<unique_ptr<Shape>> v1;\n        vector<Shape*> v2;\n        // ...\n\
  \        rotate_and_draw(v1,45);\n        rotate_and_draw(v2,90);\n}\n```\n\n为了进行更严格的检查，我们可以定义一个\
  \ `Pointer_to_Shape` concept，指定我们希望某个类型能够用作形状时具备的属性。这将允许我们使用未派生自 `Shape` 类的形状。\n\
  \n### 7.3.3.2 用于初始化的 Lambda\n\n使用 lambda，我们可以将任何语句转换为表达式。这主要用于提供一个操作来计算作为参数的值，但这种能力是通用的。考虑一个复杂的初始化：\n\
  \n点击此处查看代码图像\n\n```\nenum class Init_mode { zero, seq, cpy, patrn };       // 初始化器替代方案\n\
  \nvoid user(Init_mode m, int n, vector<int>& arg, Iterator p, Iterator q)\n{\n \
  \       vector<int> v;\n\n        // 杂乱的初始化代码：\n\n        switch (m) {\n       \
  \ case zero:\n                v = vector<int>(n);   // n 个元素初始化为 0\n           \
  \     break;\n        case cpy:\n                v = arg;\n                break;\n\
  \        };\n\n        // ...\n\n        if (m == seq)\n                v.assign(p,q);\
  \           // 从序列 p:q) 拷贝\n\n        // ...\n}\n```\n\n这是一个风格化的示例，但遗憾的是它并不罕见。我们需要一组初始化数据结构（这里是\
  \ `v`）的替代方案中进行选择，并且为不同的替代方案执行不同的计算。这种代码通常很杂乱，被认为是为了“效率”所必须，并且是 bug 的来源：\n\n* 变量在获取预期值之前就可能被使用。\n\
  * “初始化代码”可能与其他代码混合，导致难以理解。\n* 当“初始化代码”与其他代码混合时，更容易遗漏某个分支。\n* 这不是初始化，而是赋值 (§[1.9.2）。\n\
  \n相反，我们可以将其转换为用作初始化器的 lambda：\n\n点击此处查看代码图像\n\n```cpp\nvoid user(Init_mode m, int\
  \ n, vector<int>& arg, Iterator p, Iterator q)\n{\n        vector<int> v = [&] {\n\
  \                switch (m) {\n                case zero:       return vector<int>(n);\
  \                 // n 个元素初始化为 0\n                case seq:         return vector<int>{p,q};\
  \             // 从序列 p:q) 拷贝\n                case cpy:         return arg;\n  \
  \              }\n        }();\n\n        // ...\n}\n```\n\n我仍然“忘记”了一个 `case`，但现在更容易被发现了。在很多情况下，编译器会发现问题并警告。\n\
  \n### 7.3.3.3 Finally\n\n析构函数提供了一种清理对象使用后工作的通用且隐式的机制（RAII；§[6.3），但如果我们需要执行与单个对象不相关的清理，或者与没有析构函数的对象的清理（例如，因为它是一个与\
  \ C 程序共享的类型）怎么办？我们可以定义一个函数 `finally()`，它接收一个在离开作用域时执行的操作\n\n点击此处查看代码图像\n\n```\n\
  void old_style(int n)\n{\n        void* p = malloc(n*sizeof(int));        // C 风格\n\
  \        auto act = finally([&]{free(p);});        // 在离开作用域时调用 lambda\n       \
  \ // ...\n}       // p 在离开作用域时隐式释放\n```\n\n这是临时的（ad hoc），但比尝试在函数的所有退出点处都正确且一致地调用\
  \ `free(p)` 要好得多。\n\n`finally()` 函数是极其简单的：\n\n点击此处查看代码图像\n\n```cpp\ntemplate <class\
  \ F>\n[[nodiscard]] auto finally(F f)\n{\n        return Final_action{f};\n}\n```\n\
  \n我使用了 `[[nodiscard]]` 属性来确保用户不会忘记 `finally` 的结果。`Final_action` 结构如下：\n\n```cpp\n\
  template <class F>\nstruct Final_action {\n    F f;\n    explicit Final_action(F\
  \ f) : f(std::move(f)) {}\n    template <typename Args>\n    auto operator()(Args&&...\
  \ args) { return f(std::forward<Args>(args)...); }\n};\n```\n\n## 7.4 机制\n\n这些基本机制主要是用于构建抽象的工具：\n\
  \n* 依赖于类型的值：*变量模板* (§7.4.1)))。\n* 模板的别名：*别名模板* (§7.4.2))\n* 编译时选择：`if constexpr`\
  \ (§7.4.3)).\n* 询问属性的编译时机制：`static_asserts` (§4.5))。\n\n### 7.4.1 变量模板\n\n当我们使用一个类型时，通常想要该类型的常量。这里有一个来自流体模拟的示例\
  \ [Garcia,2015]:\n\n点击此处查看代码图像\n\n```cpp\ntemplate <class T>\nconstexpr T viscosity\
  \ = 0.4;\n\ntemplate <class T>\nconstexpr space_vector<T> external_acceleration\
  \ = { T{}, T{-9.8}, T{} };\n\nauto vis2 = viscosity<double>;\nauto acc = external_acceleration<float>;\n\
  ```\n\n在这里`space_vector` 是三维向量。奇怪的是，大多数变量模板似乎都是常量。但实际上许多变量也是如此。术语并没有跟上我们对不可变性的概念。\n\
  \n自然，我们可以使用适合类型的任意表达式作为初始化器。考虑：\n\n点击此处查看代码图像\n\n```cpp\ntemplate<typename T, typename\
  \ T2>\nconstexpr bool Assignable = is_assignable<T&,T2>::value;    // is_assignable\
  \ 是一个类型特征 (§16.4.1)\n\ntemplate<typename T>\nvoid testing()\n{\n        static_assert(Assignable<T&,double>,\
  \ \"不能将 double 赋值给 T\");\n        static_assert(Assignable<T&,string>, \"不能将 string\
  \ 赋值给 T\");\n}\n```\n\n### 7.4.2 别名\n\n经常地，为类型或模板引入别名是有用的。例如，标准头文件 `<cstddef>` 包含了\
  \ `size_t` 别名的定义，也许：\n\n```cpp\nusing size_t = unsigned int;\n```\n\n名为 `size_t`\
  \ 的实际类型取决于实现，因此在另一个实现中，`size_t` 可能是 `unsigned long`。拥有 `size_t` 别名允许程序员编写可移植的代码。\n\
  \n\n\n\n\n参数化类型为与其模板参数相关的类型提供别名是非常常见的现象。例如：\n\n```cpp\ntemplate<typename T>\nclass\
  \ Vector {\npublic:\n        using value_type = T;\n        // ...\n};\n```\n\n\
  事实上，每个标准库容器都提供了 `value_type` 作为其元素类型的名称（参见参第 12 章]）。这使得我们能够编写适用于所有遵循这一惯例容器的代码。例如：\n\
  \n点击此处查看代码图像\n\n```cpp\ntemplate<typename C>\nusing Value_type = C::value_type;\
  \         // C 元素的类型\n\ntemplate<typename Container>\nvoid algo(Container& c)\n\
  {\n        Vector<Value_type<Container>> vec;                 // 将结果保留在此\n     \
  \   // ...\n}\n```\n\n此 `Value_type` 是标准库 `range_value_t` 的简化版本（§16.4.4）。别名机制可以用于通过绑定部分或全部模板参数来定义新模板。例如：\n\
  \n点击此处查看代码图像\n\n```cpp\ntemplate<typename Key, typename Value>\nclass Map {\n  \
  \      // ...\n};\n\ntemplate<typename Value>\nusing String_map = Map<string,Value>;\n\
  \nString_map<int> m;         // m 是 Map<string,int>\n```\n\n### 7.4.3 编译期 if\n\n\
  考虑编写一种操作，该操作可以使用两个函数之一 `slow_and_safe(T)` 或 `simple_and_fast(T)` 来实现。这类问题在基础代码中随处可见，其中通用性和最优性能至关重要。如果涉及到类层次结构，基类可以提供\
  \ `slow_and_safe` 通用操作，而派生类可以使用 `simple_and_fast` 实现进行重写。\n\n或者，我们可以使用编译期 `if`：\n\
  \n点击此处查看代码图像\n\n```cpp\ntemplate<typename T>\nvoid update(T& target)\n{\n      \
  \  // ...\n        if constexpr(is_trivially_copyable_v<T>)\n                simple_and_fast(target);\
  \          // 用于“纯旧数据”\n        else\n                slow_and_safe(target);   \
  \         // 用于更复杂的类型\n        // ...\n}\n```\n\n`is_trivially_copyable_v<T>` 是一个类型谓词（§16.4.1），告诉我们一个类型是否可以被平凡拷贝。\n\
  \n编译器只检查 `if constexpr` 的被选分支。这种解决方案提供了最优的性能和优化的局部性。\n\n重要的是，`if constexpr` 并不是一种文本处理机制，不能用于打破常规的语法、类型和作用域规则。例如，这里有一个条件地将调用封装在\
  \ `try` 块中的天级且失败的尝试：\n\n点击此处查看代码图像\n\n```cpp\ntemplate<typename T>\nvoid bad(T arg)\n\
  {\n        if constexpr(!is_trivially_copyable_v<T>)\n                try {    \
  \                                           // 错误，if 延伸到了这一行\n\n        g(arg);\n\
  \n        if constexpr(!is_trivially_copyable_v<T>)\n                } catch(...)\
  \ { /* ... */ }                      // 语法错误\n}\n```\n\n允许这种文本处理可能会严重损害代码的可读性，并为依赖于现代程序表示技术（如“抽象语法树”）的工具带来问题。\n\
  \n许多此类尝试的黑科技也是没有必要的，因为有不违反作用域规则的更整洁的解决方案。例如：\n\n点击此处查看代码图像\n\n```cpp\ntemplate<typename\
  \ T>\nvoid good(T arg)\n{\n        if constexpr (is_trivially_copyable_v<T>)\n \
  \               g(arg);\n        else\n                try {\n                 \
  \       g(arg);\n                }\n                catch (...) { /* ... */ }\n\
  }\n```\n\n## 7.5 建议\n\n[1] 使用模板适用于许多参数类型的算法；§7.1; [CG: T.2]。\n\n[2] 使用模板表示容器；§7.2;\
  \ [CG: T.3]。\n\n[3] 使用模板提高代码的抽象层次；§7.2; [CG: T.1]。\n\n[4] 模板是类型安全的，但对于未约束的模板，检查发生得太晚了；§7.2。\n\
  \n[5] 让构造函数或函数模板推导类模板参数类型；§7.2.3。\n\n[6] 使用函数对象作为算法的参数；§7.3.2; [CG: T.40]。\n\n[7]\
  \ 如果你在某处需要一个简单的函数对象，请使用 lambda；§7.3.2。\n\n[8] 模板不能是虚函数；§7.3.1。\n\n[9] 使用 `finally()`\
  \ 为类型提供 RAII；§7.3.3。\n\n[10] 使用别名简化符号；§7.4。\n\n[11] 使用 `if constexpr` 提供无开销的替代实现；§7.4。\n\
  \n# 8 概念与泛型编程\n\n## 8.1 引言\n\n模板的作用是什么？换句话说，哪些编程技术通过模板变得？模板提供了：\n\n*   在不丢失信息的情况下将类型（以及值）作为参数传递。这意味着极大的灵活性。\n\
  \n*   编织不同上下文的信息。这提供了优化机会。\n\n*   将值作为模板参数传递的能力。\n\n换句话说，模板提供了一种强大的编译期计算和类型处理机制，可以产生非常紧凑的代码。记住类型（类）包含代码（§7.3.2)）和值（§7.2.2)）。\n\
  \n模板第一个最常用的用法是支持*泛型编程*，即专注于通用算法的设计、实现和使用的编程。在这里，“通用”意味着只要类型满足对其参数的要求，算法就可以设计为接受各种类型。与概念一起，模板是\
  \ C++ 支持泛型编程的主要手段。模板提供了（编译期）参数多态。\n\n## 8.2 概念\n\n考虑 §7.3.1 中的 `sum()`：\n\n点击此处查看代码图像\n\
  \n```cpp\ntemplate<typename Sequence, typename Value>\nValue sum(const Sequence&\
  \ s, Value v)\n{\n        for (const auto& x : s)\n                v+=x;\n     \
  \   return v;\n}\n```\n\n此 `sum()` 要求\n\n*   其第一个模板参数是某种元素序列，并且支持 `begin()` 和 `end()`，以便范围-for\
  \ 循环工作（§1.7; §14.1)），\n\n*   其第二个模板参数是某种数字类型。\n\n\n\n\n\n*   一种支持 `+=` 的*算术类型*，`Value`，这使得序列中的元素可以相加。\n\
  \n我们将此类需求称为*概念*（concepts）。\n\n满足这一简化需求（以及更多需求）以作为序列（也称为*范围*，range）的类型示例包括标准库中的 `vector`、`list`\
  \ 和 `map`。满足这一简化需求（以及更多需求）以作为算术类型的示例包括 `int`、`double` 和 `Matrix`（针对 `Matrix` 的任何合理定义）。我们可以说\
  \ `sum()` 算法在两个维度上都是泛型的：用于存储元素的数据结构类型（“序列”）以及元素的类型。\n\n### 8.2.1 概念的使用\n\n大多数模板参数必须满足特定需求，模板才能正确编译，且生成的代码才能正常工作。也就是说，大多数模板应该是约束模板（7.2.1）。类型名称引入符\
  \ `typename` 是约束最少的，它仅要求参数是一个类型。通常，我们可以做得比更好。再次考虑 `sum()`：\n\n点击此处查看代码图片\n\n```\n\
  template<Sequence Seq, Number Num>\nNum sum(const Seq& s, Num v)\n{\n        for\
  \ (const auto& x : s)\n                v+=x;\n        return v;\n}\n```\n\n这清晰得多。一旦我们定义了概念\
  \ `Sequence` 和 `Number` 的含义，编译器就可以仅通过查看 `sum()` 的接口来拒绝错误的调用，而不是查看它的实现。这改进了错误报告。\n\
  \n然而，`sum()` 接口的规范并不完整：我“忘记”说，我们应该能够将 `Sequence` 的元素加到 `Number` 上。我们可以做到：\n\n点击此处查看代码图片\n\
  \n```\ntemplate<Sequence Seq, Number Num>\n        requires Arithmetic<range_value_t<Seq>,Num>\n\
  Num sum(const Seq& s, Num n);\n```\n\n序列的 `range_value_t` (16.4.4) 是该序列中元素的类型；它来自标准库，在其中命名了\
  \ `range` 元素的类型 (14.1)）。`Arithmetic<X,Y>` 是一个概念，规定我们可以对类型 `X` 和 `Y` 的数字进行算术运算。这避免了我们意外尝试计算\
  \ `vector<string>` 或 `vector<int*****>` 的 `sum()`，同时仍然接受 `vector<int>` 和 `vector<complex<double>>`。通常，当算法需要不同类型的参数时，这些类型之间存在某种关系，明确这种关系会更好。\n\
  \n在这个例子中，我们只需要 `+=`，但为了简单和灵活，我们不应该对模板参数约束得太紧。特别是，将来我们可能可能想用 `+` 和 `=` 而不是 `+=` 来表示\
  \ `sum()`，那时我们会庆幸使用了通用的概念（这里是 `Arithmetic`），而不是狭隘的“具有 `+=`”的需求。\n\n部分规范（如第一个使用概念的\
  \ `sum()`）可能非常有用。除非规范完整，否则某些错误在实例化之前将无法发现。然而，即使是部分规范也表达了意图，并且对于最初无法识别出所有所需需求的平滑增量开发至关重要。随着成熟的概念库出现，初始规范将接近完美。\n\
  \n意乎合理，`requires Arithmetic<range_value_t<Seq>,Num>` 被称为 `requirements` 子句。`template<Sequence\
  \ Seq>` 符号仅仅是显式使用 `requires Sequence<Seq>` 的简写。如果我喜欢冗长，我等价地写成：\n\n点击此处查看代码图片\n\n\
  ```\ntemplate<typename Seq, typename Num>\n        requires Sequence<Seq> && Number<Num>\
  \ && Arithmetic<range_value_t<Seq>,Num>\nNum sum(const Seq& s, Num n);\n```\n\n\
  另一方面，我们也可以利用这两种符号之间的等效性来编写：\n\n点击此处查看代码图片\n\n```\ntemplate<Sequence Seq, Arithmetic<range_value_t<Seq>>\
  \ Num>\nNum sum(const Seq& s, Num n);\n```\n\n在尚无法使用 `concepts` 的代码库中，我们必须依靠命名规范和注释，例如：\n\
  \n点击此处查看代码图片\n\n```\ntemplate<typename Sequence, typename Number>\n        // requires\
  \ Arithmetic<range_value_t<Sequence>,Number>\nNumber sum(const Sequence& s, Number\
  \ n);\n```\n\n无论我们选择何种符号，设计一个对其参数具有语义意义的约束的模板是至关重要的（8.2.4）。\n\n### 8.2.2 基于概念的重载\n\
  \n一旦我们正确地规范了模板及其接口，我们就可以根据它们的属性进行重载，就像我们处理函数一样。考虑一个稍微简化的标准库函数 `advance()`，它用于移动迭代器\
  \ (13.3)：\n\n点击此处查看代码图片\n\n```\ntemplate<forward_iterator Iter>\nvoid advance(Iter\
  \ p, int n)                 // 将 p 向移动 n 个元素\n{\n        while (n--)\n         \
  \       ++p;         // 前向迭代器有 ++，但没有 + 或 +=\n}\n\ntemplate<random_access_iterator\
  \ Iter>\nvoid advance(Iter p, int n)                // 将 p 向移动 n 个元素\n{\n      \
  \  p+=n;                 // 随机访问迭代器有 +=\n}\n```\n\n编译器将选择满足参数最强要求的模板。在这种情况下，`list`\
  \ 只提供前向迭代器，但 `vector` 提供了随机访问迭代器，因此我们得到：\n\n点击此处查看代码图片\n\n```\nvoid user(vector<int>::iterator\
  \ vip, list<string>::iterator lsp)\n{\n        advance(vip,10);      // 使用快速的 advance()\n\
  \        advance(lsp,10);      // 使用慢速的 advance()\n}\n```\n\n与其他重载一样，这是一种编译机制，意味着没有运行时开销，且当编译器找不到最佳选择时，会给出歧义错误。基于概念的重载规则比通用重载规则（1.3）简单得多。首先考虑多个备选方案的单一参数：\n\
  \n*   如果参数不匹配概念，则无法选择该备选方案。\n*   如果参数仅匹配一个备选方案的概念，则选择该方案。\n*   如果两个备选方案的参数匹配某个概念，且其中一个比另一个严格（匹配了另一个的所有需求以及更多），则选择较严格的方案。\n\
  *   如果两个备选方案的参数对于某个概念同样优，则存在歧义。\n\n一个备选方案要被选中，它必须：\n\n*   匹配其所有参数，且\n*   对于所有参数，相对于其他备选方案至少是同样优的匹配，且\n\
  *   对于至少一个参数是更优匹配。\n\n### 8.2.3 有效代码\n\n一组模板参数是否提供了模板对其模板参数所要求的内容，最终归结为某些表达式是否有效。\n\
  \n通过使用 `requires` 表达式，我们可以检查一组表达式是否有效。例如，我们可能尝试在不使用标准库概念 `random_access_iterator`\
  \ 的情况下编写 `advance()`：\n\n点击此处查看代码图片\n\n```\ntemplate<forward_iterator Iter>\n  \
  \      requires requires(Iter p, int i) { p[i]; p+i; }         // Iter 有下标运算和整数加法\n\
  void advance(Iter p, int n)                // 将 p 向移动 n 个元素\n{\n        p+=n;\n\
  }\n```\n\n不，那两个 `requires` 并不是笔误。第一个 `requires` 开始 `requirements` 子句，第二个 `requires`\
  \ 开始 `requires-expression` \n\n点击此处查看代码图片\n\n```\nrequires(Iter p, int i) { p[i];\
  \ p+i; }\n```\n\n\n\n\n\n`requires-expression` 是一种谓词，如果其内部的语句是有效代码，则为 `true`，否则为\
  \ `false`。\n\n我将 `requires`-expression 视为泛型编程的汇编代码。像普通的汇编代码一样，`requires`-expression\
  \ 极其灵活，且不施加任何编程规范。以某种形式，它们位于大多数有趣的泛型代码的底层，正如汇编代码位于大多数有趣的普通代码的底层一样。与汇编代码一样，`requires`-expression\
  \ 不应该出现在普通代码中。它们属于抽象概念的实现部分。如果你在代码中看到 `requires requires`，那么它可能层级太低，并且最终会变成问题。\n\
  \n在 `advance()` 中使用 `requires requires` 是故意写得不优雅且带有黑客风格（hackish）的。请注意，我“忘记”指定 `+=`\
  \ 以及操作所需的返回类型。因此，某些版本的 `advance()` 用法虽然通过了概念检查，但无法编译。我已经警告过你了！适当的随机访问版本 `advance()`\
  \ 更简单且具具读性：\n\n点击此处查看代码图像\n\n```cpp\ntemplate<random_access_iterator Iter>\nvoid\
  \ advance(Iter p, int n)               // 将 p 向移动 n 个元素\n{\n        p+=n;      \
  \          // 随机访问迭代器拥有 +=\n}\n```\n\n优先使用命名良好且语义明确的概念（§8.2.4），并主要在定义这些概念时使用 `requires`-expression。\n\
  \n### 8.2.4 概念的定义\n\n我们在库中发现非常有用的概念，例如标准库中的 `forward_iterator`（§14.5）。对于类和函数，通常使用良好库中的概念比编写一个新概念要容易，但简单的概念并不难定义。标准库中的名称（如\
  \ `random_access_iterator` 和 `vector`）都是小写的。在这里，我遵循惯例，将自己定义的概念首字母大写，例如 `Sequence`\
  \ 和 `Vector`。\n\n概念是一个编译时谓词，指定了一个或多个类型如何被使用。首先考虑最简单的例子之一：\n\n点击此处查看代码图像\n\n```cpp\n\
  template<typename T>\nconcept Equality_comparable =\n        requires (T a, T b)\
  \ {\n                { a == b } -> Boolean;        // 使用 == 比较 T 类型\n          \
  \      { a != b } -> Boolean;         // 使用 != 比较 T 类型\n        };\n```\n\n`Equality_comparable`\
  \ 是我们确保能够比较某种类型的相等和不相等值的概念。我们简单地说，给定该类型的两个值，它们必须能够使用 `==` 和 `!=` 进行比较，且这些操作的结果必须是\
  \ `Boolean`。例如：\n\n点击此处查看代码图像\n\n```cpp\nstatic_assert(Equality_comparable<int>);\
  \       // 成功\n\nstruct S { int a; };\nstatic_assert(Equality_comparable<S>);  \
  \       // 失败，因为结构体不会自动获得 == 和 !=\n```\n\n`Equality_comparable` 的定义与英文描述完全等价，且不再如此。`concept`\
  \ 的值始终是 `bool`。\n\n`->` 之后指定的 `{ ... }` 的结果必须是一个概念。遗憾的是，标准库中没有 `boolean` 概念，所以我定义了一个（§14.5）。`Boolean`\
  \ 仅仅意味着可以用作条件的类型。\n\n定义 `Equality_comparable` 来处理非同质比较几乎一样：\n\n点击此处查看代码图像\n\n```cpp\n\
  template<typename T, typename T2 =T>\nconcept Equality_comparable =\n        requires\
  \ (T a, T2 b) {\n                { a == b } -> Boolean;        // 使用 == 比较 T 和 T2\n\
  \                { a != b } -> Boolean;         // 使用 != 比较 T 和 T2\n           \
  \     { b == a } -> Boolean;        // 使用 == 比较 T2 和 T\n                { b != a\
  \ } -> Boolean;         // 使用 != 比较 T2 和 T\n        };\n```\n\n`typename T2 =T`\
  \ 表示如果我们不指定第二个模板参数，`T2` 将与 `T` 相同；`T` 是一个*默认模板参数*。\n\n我们可以这样测试 `Equality_comparable`：\n\
  \n点击此处查看代码图像\n\n```cpp\nstatic_assert(Equality_comparable<int,double>);   // 成功\n\
  static_assert(Equality_comparable<int>);                // 成功 (T2 默认为 int)\nstatic_assert(Equality_comparable<int,string>);\
  \     // 失败\n```\n\n这个 `Equally_comparable` 与标准库中的 `equality_comparable`（§14.5）几乎相同。\n\
  \n现在现在定义一个要求数字之间的算术运算有效的概念。首先我们需要定义 `Number`：\n\n点击此处查看代码图像\n\n```cpp\ntemplate<typename\
  \ T, typename U = T>\nconcept Number =\n        requires (T x, U y) {          \
  \ // 具有算术运算\n                x+y; x-y;             //\n                x*y; x/y;\
  \             //\n                x+=y; x-=y;           //\n                x*=y;\
  \ x/=y;           //\n        };\n```\n\n`Number` 的定义没有假设结果类型，但对于简单的用法是足够的。给定一个类型，`Number<X>`\
  \ 检查 `X` 是否具有 `Number` 的属性。给定两个类型，`Number<X,Y>` 检查这两个类型可以一起使用。从此，我们可以定义 `Arithmetic`\
  \ 概念（§8.2.1）：\n\n点击此处查看代码图像\n\n```cpp\ntemplate<typename T, typename U = T>\nconcept\
  \ Arithmetic = Number<T,U>; // \n\n```\n\n对于更复杂的例子，考虑一个序列：\n\n点击此处查看代码图像\n\n```cpp\n\
  template<typename S>\nconcept Sequence = requires (S a) {\n        typename range_value_t<S>;\
  \     // S 必须有值类型\n        typename iterator_t<S>;       // S 必须有迭代器类型\n\n     \
  \   { a.begin() } -> same_as<iterator_t<S>>; // S 必须有返回迭代器的 begin()\n        { a.end()\
  \ } -> same_as<iterator_t<S>>;   // S 必须有返回迭代器的 end()\n\n        requires input_iterator<iterator_t<S>>;\
  \ // S 的迭代器必须是输入迭代器\n        requires same_as<range_value_t<S>, iterator_value_type>>;\
  \ // 值类型和迭代器值类型相同\n};\n```\n\n类型 `S` 要成为 `Sequence`，它必须提供一个值类型（元素的类型；见§13.1）和一个迭代器类型（迭代器的类型）。在这里，我使用了标准库关联类型\
  \ `range_value_t<S>` 和 `iterator_t<S>`（§16.4.4）来表达这一点。它还必须确保存在 `begin()` 和 `end()`\
  \ 函数，返回 `S` 的迭代器，正如标准库容器的惯例一样（§12.3）。\n\n最难定义的是那些代表基础语言的概念。因此，最好使用成熟库中的集合。对于有用的集合，见§14.5。特别是，标准库中有一个概念允许我们跳过\
  \ `Sequence` 定义的复杂性：\n\n点击此处查看代码图像\n\n```cpp\ntemplate<typename S>\nconcept Sequence\
  \ = input_range<S>;     // 简单且通用\n```\n\n如果我将“**S** 的值类型”的概念限制为 `S::value_type`，那么我就可以使用简单的\
  \ `Value_type`：\n\n点击此处查看代码图像\n\n```cpp\ntemplate<class S>\nusing Value_type = typename\
  \ S::value_type;\n```\n\n\n\n\n这是一种简洁表达简单概念并隐藏复杂性的实用技术。标准 `value_type_t` 的定义在本质上相似，但稍微复杂一些，因为它处理了没有名为\
  \ `value_type` 成员的序列（例如，内置数组）。\n\n### 8.2.4.1 定义检查\n\n为模板指定的概念（concepts）用于在模板使用点检查参数。它们*不用于*检查模板定义中对参数的使用情况。例如：\n\
  \n点击此处查看代码图片\n\n```\ntemplate<equality_comparable T>\nbool cmp(T a, T b)\n{\n  \
  \      return a<b;\n}\n```\n\n在这里，该概念保证了 `==` 的存在，但没有保证 `<`：\n\n点击此处查看代码图片\n\n```\n\
  bool b0 = cmp(cout,cerr);        // error: ostream 不支持 ==\nbool b1 = cmp(2,3); \
  \                 // OK: 返回 true\nbool b2 = cmp(2+3i,3+4i);        // error: complex<double>\
  \ 不支持 <\n```\n\n概念检查捕获了传递 `ostream` 的尝试，但接受了 `int` 和 `complex<double>`，因为这两个类型支持\
  \ `==`。然而，`int` 支持 `<`，因此 `cmp(2,3)` 编译通过；而 `cmp(2+3i,3+4i)` 在检查 `cmp()` 函数体并将其为不支持\
  \ `<` 的 `complex<double>` 实例化时会被拒绝。\n\n将对模板定义的最终检查推迟到实例化时间（instantiation time）有两个好处：\n\
  \n*   我们可以在开发期间使用不完全的概念。这允许我们在我们在开发概念、类型和算法的同时积累经验，并逐渐改进检查机制。\n*   我们可以在模板中插入调试、追踪、遥测等代码，而不会影响其接口。更改接口会导致大规模的重新编译。\n\
  \n在开发和维护大型代码库时，这两者都至关重要。我们为了获得这一重要好处而付出的代价是，某些错误（例如在仅保证了 `==` 的地方使用 `<`）会在编译过程的非常后期才被捕获（§8.5）。\n\
  \n### 8.2.5 概念与 auto\n\n关键字 `auto` 可用于指示对象应该具有其初始化值的类型 (§1.4.2）：\n\n点击此处查看代码图片\n\
  \n```\nauto x = 1;                                          // x 是一个 int\nauto z\
  \ = complex<double>{1,2};      // z 是一个 complex<double>\n```\n\n然而，初始化不仅发生在简单的变量定义中：\n\
  \n点击此处查看代码图片\n\n```\nauto g() { return 99; }                        // g() 返回一个\
  \ int\n\nint f(auto x) { /* ... */ }                        // 接受任意类型的参数\n\nint\
  \ x = f(1);                                         //这个 f() 接受一个 int\nint z = f(complex<double>{1,2});\
  \     //这个 f() 接受一个 complex<double>\n```\n\n关键字 `auto` 表示对值受约束最少的概念：它仅要求值必须是某种类型的值。使用\
  \ `auto` 参数使一个函数变成一个模板函数。\n\n给定概念，我们可以通过在 `auto` 前面加上概念来加强所有此类初始化的约束。例如：\n\n点击此处查看代码图片\n\
  \n```\nauto twice(Arithmetic auto x) { return x+x; }   // 仅针对数字\nauto thrice(auto\
  \ x) { return x+x+x; }                 // 针对任何支持 + 的类型\n\nauto x1 = twice(7);  \
  \ // OK: x1==14\nstring s \"Hello \";\nauto x2 = twice(s);   // error: string 不是\
  \ Arithmetic\nauto x3 = thrice(s);   // OK x3==\"Hello Hello Hello \"\n```\n\n除了用于约束函数参数外，概念还可以约束变量的初始化：\n\
  \n点击此处查看代码图片\n\n```\nauto ch1 = open_channel(\"foo\");                         \
  \     // 无论 open_channel() 返回什么都能工作\nArithmetic auto ch2 = open_channel(\"foo\"\
  );           // error: channel 不是 Arithmetic\nChannel auto ch3 = open_channel(\"\
  foo\");              // OK: 假设 Channel 是一个合适的概念\n                              \
  \                                // 且 open_channel() 返回该类型\n```\n\n这对于防止过度使用 `auto`\
  \ 以及为使用泛型函数的代码记录需求非常有用。\n\n为了可读性和调试，让类型错误尽可能在接近其源头的地方被捕获通常是非常重要的。约束返回类型可以有所帮助：\n\
  \n点击此处查看代码图片\n\n```\nNumber auto some_function(int x)\n{\n        // ...\n     \
  \   return fct(x);    // 除非 fct(x) 返回 Number，否则会报错\n        // ...\n}\n```\n\n自然地，我们可以通过引入局部变量来实现这一点：\n\
  \n点击此处查看代码图片\n\n```\nauto some_function(int x)\n{\n        // ...\n        return\
  \ fct(x);    // 除非 fct(x) 返回 Number，否则会报错\n        // ...\n}\nNumber auto y = fct(x);\n\
  ```\n\n然而，这种方法有些繁琐，而且并非所有类型都可以拷贝。\n\n### 8.2.6 概念与类型\n\n类型\n\n*   指定了可应用于对象的操作集\n\
  *   依赖函数声明和语言规则\n*   指定了对象的布局\n\n单参数概念\n\n*   隐式或显式指定了应用于对象的操作\n*   依赖函数声明和语言规则\n\
  *   对对象的布局没有说明\n\n因此，使用概念来约束代码比使用类型更具灵活性。此外，概念还可以定义多个参数之间的关系。我的理想是最终大多数函数将定义为由概念约束的模板函数。遗憾的是，目前的支持并不完美：我们必须将概念作为形容词而非名词。例如：\n\
  \n```\nvoid sort(Sortable auto&);         // 需要 auto\nvoid sort(Sortable&);    \
  \             // error: 概念后需要 auto\n```\n\n\n\n`string` 是另一个 `regular` 类型的例子。像 `int`\
  \ 一样，`string` 也是 `totally_ordered`（§14.5）。也就是说，两个字符串可以使用适当的语义通过 `<`, `<=`, `>`,\
  \ `>=`, 和 `<=>` 进行比较。\n\n概念（concept）不仅仅是一个语法概念，它从根本上关乎语义。例如，不要将 `+` 定义为除法；因为那不符合任何合理数字的要求。遗憾的是，我们目前还没有任何语言支持来表达语义，因此我们必须依赖专家知识和常识来获取在语义上有意义的概念。不要定义语义上无意义的概念，例如\
  \ `Addable` 和 `Subtractable`。相反，应该依赖领域知识来定义与应用领域中的基础概念匹配的概念。\n\n### 8.3.2 使用模板进行抽象\n\
  \n良好的抽象是从具体的示例中仔细生长出来的。试图通过为每种可能的需要和技术做准备来尝试“抽象”并不是好主意；那样会导致不优雅和代码膨胀。相反，应该从一个（最好是多个）真实使用中的具体示例开始，并尝试消除次要细节。考虑一下：\n\
  \n点击此处查看代码图像\n\n```\ndouble sum(const vector<int>& v)\n{\n        double res = 0;\n\
  \        for (auto x : v)\n                res += x;\n        return res;\n}\n```\n\
  \n这显然是计算数字序列和许多方法之一。\n\n考虑什么让这段代码没有它本该那么通用：\n\n*   为什么只有 `int`s？\n*   为什么只有 `vector`s？\n\
  *   为什么在 `double` 中累加？\n*   为什么从 `0` 开始？\n*   为什么要相加？\n\n通过将具体类型转换为模板参数来回答前四个问题，我们得到了标准库\
  \ `accumulate` 算法的最简单形式：\n\n点击此处查看代码图像\n\n```\ntemplate<forward_iterator Iter, Arithmetic<iter_value_t<Iter>>\
  \ Val>\nVal accumulate(Iter first, Iter last, Val res)\n{\n        for (auto p =\
  \ first; p!=last; ++p)\n                res += *p;\n        return res;\n}\n```\n\
  \n在这里，我们拥有：\n\n*   要遍历的数据结构已抽象为一对表示序列的迭代器（§8.2.4, §13.1）。\n*   累加器的类型已变成参数。\n* \
  \  累加器的类型必须是算术数类型。\n*   累加器的类型必须与迭代器的值类型（序列的元素类型）兼容。\n*   初始值现在是一个输入；累加器的类型就是这个初始值的类型。\n\
  \n快速检查或——更好的——测量将表明，为各种数据结构调用生成的代码与你手动编写的示例是相同的。考虑一下：\n\n点击此处查看代码图像\n\n```\nvoid\
  \ use(const vector<int>& vec, const list<double>& lst)\n{\n        auto sum = accumulate(begin(vec),end(vec),0.0);\
  \  // 在 double 中累加\n        auto sum2 = accumulate(begin(lst),end(lst),sum);\n \
  \       // ...\n}\n```\n\n从具体的代码（最好是多个）并在保持性能的同时进行泛泛化的过程被称为 *lifting*（提升）。相反，开发模板的最佳方法通常是：\n\
  \n*   首先，编写一个具体版本\n*   然后，对其进行调试、测试和测量\n*   最后，用模板参数替换具体类型。\n\n自然，`begin()` 和 `end()`\
  \ 的重复是枯燥的，因此我们可以稍微简化用户界面：\n\n点击此处查看代码图像\n\n```\ntemplate<forward_range R, Arithmetic<value_type_t<R>>\
  \ Val>\nVal accumulate(const R& r, Val res = 0)\n{\n        for (auto x : r)\n \
  \               res += x;\n        return res;\n}\n```\n\n*range*（范围）是一个标准库概念，表示一个具有\
  \ `begin()` 和 `end()` 的序列（§13.1）。为了完全的通用性，我们也可以抽象 `+=` 操作；参见 §17.3。\n\n`accumulate()`\
  \ 的迭代器对版本和范围版本都是用的：迭代器对版本用于通用性，范围版本用于常见用例的简单性。\n\n## 8.4 变参数模板\n\n模板可以定义为接受任意数量、任意类型的参数。这种模板被称为\
  \ *variadic template*（变参数模板）。考虑一个简单的函数，用于写出具有 `<<` 运算符的任意类型的值：\n\n点击此处查看代码图像\n\n\
  ```\nvoid user()\n{\n        print(\"first: \", 1, 2.2, \"hello\\n\"s);        \
  \                       \n}\n```\n\n\n\n\n点击此处查看代码图像\n\n```cpp\nreturn (v + ...\
  \ + 0);    // add all elements of v to 0\n```\n\n在这里，`(v+...+0)` 意味着从初始值 `0` 开始相加\
  \ `v` 的所有元素。第一个被加的元素是“最右侧的”（索引最大的那个）：`(v[0]+(v[1]+(v[2]+(v[3]+(v[4]+0)))))`。也就是说，从\
  \ `0` 所在的右侧开始。这被称为*右折叠*（right fold*）。或者，我们也可以使用*左折叠*（left fold*）：\n\n点击此处查看代码图像\n\
  \n```cpp\ntemplate<Number... T>\nint sum2(T... v)\n{\n    return (0 + ... + v);\
  \ // add all elements of v to 0\n}\n```\n\n现在，第一个被加的元素是“最左侧的”（索引最小的）：`(((((0+v[0])+v[1])+v[2])+v[3])+v[4])`。也就是说，从\
  \ `0` 所在的左侧开始。\n\n*折叠*（Fold*）是一种非常强大的抽象，与标准库中的 `accumulate()` 密切相关，在不同的语言和社区中有多种名称。在\
  \ C++ 中，折叠表达式（fold expressions）目前被限制，以简化变变模板的实现。折叠并不非执行数值计算。考虑一个著名的例子：\n\n点击此处查看代码图像\n\
  \n```cpp\ntemplate<Printable ...T>\nvoid print(T&&... args)\n{\n    (std::cout <<\
  \ ... << args) << '\\n';     // print all arguments\n}\n\nprint(\"Hello!\"s,' ',\"\
  World \",2017);       // (((((std::cout << \"Hello!\"s) << ' ') << \"World \") <<\
  \ 2017) << '\\n');\n```\n\n为什么是 `2017`？因为 `fold()` 是在 2017 年添加到 C++ 中的（§19.2.3）。\n\
  \n### 8.4.2 转发参数\n\n通过接口原封不动地传递参数是变变模板的重要用途。考虑一个网络输入通道的概念，其中移动值的实际方法是一个参数。不同的传输机制具有不同的构造函数参数集：\n\
  \n点击此处查看代码图像\n\n```cpp\ntemplate<concepts::InputTransport Transport>\nclass InputChannel\
  \ {\npublic:\n        // ...\n        InputChannel(Transport::Args&&... transportArgs)\n\
  \                : _transport(std::forward<TransportArgs>(transportArgs)...)\n \
  \     {}\n        // ...\n        Transport _transport;\n};\n```\n\n标准库函数 `forward()`\
  \ (§16.6) 用于将参数原封不动地从 `InputChannel` 构造函数移动到 `Transport` 构造函数。\n\n这里的点在于，`InputChannel`\
  \ 的编写者可以构造 `Transport` 类型的对象，而无需知道构造特定 `Transport` 需要哪些参数。`InputChannel` 的实现者只需要知道所有\
  \ `Transport` 对象的通用用户接口。\n\n转发在基础库中非常常见，在这些库中需要通用性和低运行时开销，且通用接口非常普遍。\n\n## 8.5 模板编译模型\n\
  \n在使用点，模板的参数将根据其概念（concepts）进行检查。在这里发现的错误将立即报告。此处无法检查的内容（例如用于无约束模板参数的参数）将推迟到使用一组模板参数为模板生成代码时：“在模板实例化时”。\n\
  \n实例化时类型检查的一个不幸副作用是，类型错误可能会在非常晚的时候才被检测到 (§8.2.4.1）。此外，晚期检查通常会导致极其糟糕的错误信息，因为编译器没有提供提示程序员意图的类型信息，并且通常在结合了程序中多个处的信息后才检测到问题。\n\
  \n为模板提供的实例化时类型检查检查了模板定义中对参数的使用。这提供了通常被称为*鸭子类型*（duck typing）的编译时变体（“如果它走起来像鸭子，叫起来也像鸭子，那它就是一只鸭子”）。或者——使用更技术术语来说——我们操作的是值，操作的存在和意义完全取决于其操作数的值。这与另一种观点（即对象具有类型，类型决定了操作的存在和意义）不同。值“活”在对象中。这是\
  \ C++ 中对象（例如变量）的工作方式，只有符合对象要求的值才能放入其中。在编译时使用模板所做的大部分不涉及对象，只涉及值。例外是 `constexpr` 函数（§1.6）中的局部变量，这些变量在编译器内部被用作对象使用。\n\
  \n要使用无约束模板，其定义（而不仅仅是声明）必须在用用点处于作用域内。当使用头文件和 `#include` 时，这意味着模板定义位于头文件中，而不是 `.cpp`\
  \ 文件。例如，标准头文件 `<vector>` 包含了 `vector` 的定义。\n\n当我们开始使用模块（modules）时，情况发生了变化 (§3.2.2)）。使用模块，源代码可以。\n\
  \n## 8.6 建议\n\n1. 使用模板用于简单的函数 (§8.1)。\n2. 设计模板时，考虑其参数简体 8.3)。\n3. 设计模板时，使用其实现简体\
  \ 8.3)。\n4. 将概念作为设计工具简体 8.2)。\n5. 为所有参数使用具名概念简体 8.2)。\n6. 如果在某个处需要函数对象，使用 lambda\
  \ (§14.5)。\n7. 使用模板用于容器和范围简体 8.3)。\n8. 使用模板用于有意义的语义简体 8.3)。\n9. 避免没有语义的“概念”简体 8.2)。\n\
  10. 为一个概念要求完整的操作集简体 8.2)。\n\n\n\n\n\n没有任何重要的程序是仅用基础编程语言编写的。首先，需要开发一套库。这些库构成了后续工作的基础。用基础语言编写大多数程序都是枯燥的，而通过使用良好的库，几乎任何任务都可以变得简单。\n\
  \n接续第 1 章–第 8 章，第 9 章–第 18 章将快速介绍关键标准库设施。我将非常简要地介绍常用的标准库类型，如 `string`、`ostream`、`variant`、`vector`、`map`、`path`、`unique_ptr`、`thread`、`regex`、`system_clock`、`time_zone`\
  \ 和 `complex`，以及它们最常用的用法。\n\n正如第 1-8 章所示，强烈建议你不要对细节的不完全理解而分心或气馁。本章的目的是传达对最有用库设施的基本理解。\n\
  \n标准库的规范占据了 ISO C++ 标准的三分之二以上。去探索它，并优先使用它而不是自制的替代方案。它的设计投入了大量心血，实现上投入了更多，而维护和扩展也将投入大量精力。\n\
  \n本书中描述的标准库设施是每个完整 C++ 实现的一部分。除了标准库组件外，大多数实现还提供“图形用户界面”系统（GUI）、Web 接口、数据库接口等。同样，大多数应用程序开发环境为企业或工业级“标准”开发和/或执行环境提供了“基础库”。此外，还有数以千计的支持特殊应用领域的库。在这里，我不描述标准库之外的库、系统或环境。其意图是提供一个根据标准\
  \ [C++,2020] 定义的 C++ 的自包含式描述，并保持示例的可移植性。自然，我们也鼓励程序员去探索大多数系统上提供的更丰富的设施。\n\n## 9.2\
  \ 标准库组件\n\n标准库提供的设施可以分类如下：\n\n*   运行时语言支持（例如用于内存分配、异常和运行时类型信息）。\n*   C 标准库（进行了极微小的修改以减少对类型系统的违反）。\n\
  *   支持国际字符集、本地化和子字符串只读视图的字符串 (§10.2)。\n*   支持正则表达式匹配 (§10.4)。\n*   I/O 流是一个输入输出的可扩展框架，用户可以其中添加自己的类型、流、缓冲策略、区域和字符集\
  \ (第 11 章)）。它还提供了灵活输出格式的设施 (§11.6.2)）。\n*   用于可移植方式操作文件系统的库 (§11.9)。\n*   容器框架（如\
  \ `vector` 和 `map`；第 12 章）和算法框架（如 `find()`、`sort()` 和 `merge()`；第 13 章）。该框架传统上被称为\
  \ STL [Stepanov,1994]，它是可扩展的，用户可以添加自己的容器和算法。\n*   范围 (§14.1)，包括视图 (§14.2)、生成器 (§14.3)\
  \ 和管道 (§14.4)。\n*   基本类型和范围的概念 (§14.5)。\n*   对数值计算的支持，例如标准数学函数、复数、带有算术运算的向量、数学常数和随机数生成器\
  \ (§5.2.1 和 第 16 章)。\n*   对并发编程的支持，包括 `thread` 和锁 (第 18 章)。并发支持是基础性的，以便用户可以作为库添加对新并发模型的支持。\n\
  *   同步和异步协程 (§18.6)。\n*   大多数 STL 算法以及某些数值算法的并行版本，例如 `sort()` (§13.6) 和 `reduce()`\
  \ (§17.3.1)。\n*   支持元编程的实用程序（例如类型函数；§16.4)）、STL 风格的泛型编程（例如 `pair`；§15.3.3)）和通用编程（例如\
  \ `variant` 和 `optional`）。\n*   用于资源管理的“智能指针”（例如 `unique_ptr`）。\n*   特殊容器，如 `array`\
  \ (§15.2)、`bitset` (§15.3) 和 `tuple` (§15.4)。\n*   对绝对时间和时长的支持，例如 `time_point` 和\
  \ `system_clock` (§16.2)。\n*   对日历的支持，例如 `month` 和 `time_zone` (§16.2)。\n*   常用单位的后缀，例如\
  \ `ms` 表示毫秒，`i` 表示虚数 (§6.6](#ch06.xhtml_sec6))。\n*   操作序列的方法，例如 `string_view`s (§10.3)\
  \ 和 `span`s (§15.2)。\n\n## 9.3 标准库组织\n\n标准库提供的设施可以分类如下：（此处重复了 9.2 章节内容）。\n\n###\
  \ 9.3.1 命名空间\n\n每个标准库设施都通过某些标准头提供。例如：\n\n```\n#include<string>\n#include<list>\n\
  ```\n\n这使得标准的 `string` 和 `list` 可用。\n\n标准库定义在命名空间 `std` 中。要使用标准库设施，可以使用 `std::`\
  \ 前缀：\n\n点击查看图像\n\n```cpp\nstd::string sheep {\"Four legs Good; two legs Baaad!\"\
  };\nstd::list<std::string> slogans {\"War\", \"Freedom\", \"Strength\"};\n```\n\n\
  为了简洁，我在示例中很少使用 `std::` 前缀。也没有显式地 `#include` 或 `import` 必要的头文件或模块。要编译并运行这里的代码片段，你需要使标准库的相关部分可用。例如：\n\
  \n点击查看图像\n\n```cpp\n#include<string> // 使标准字符串设施可用\nusing namespace std; // 无需 std::\
  \ 前缀使用 std 名称\n\nstring s {\"C++ 是一种通用编程语言\"}; // OK：string 是 std::string\n```\n\
  \n将命名空间中的所有名称丢入全局命名空间通常认为是不良的做法。但在本书中，我完全使用标准库，了解它提供了什么是有好的。\n\n标准库为 `std` 提供了几个子命名空间，只能通过显式操作访问：\n\
  \n*   `std::chrono`：chrono 的所有设施，包括 `std::literals::chrono_literals` (§16.2)。\n\n\
  \n\n\n\n*   `std::literals::chrono_literals`: 后缀 `y` 表示年、`d` 表示天、`h` 表示小时、`min`\
  \ 表示分钟、`ms` 表示毫秒、`ns` 表示纳秒、`s` 表示秒以及 `us` 表示微秒 (§16.2)）。\n\n*   `std::literals::complex_literals`:\
  \ 后缀 `i` 表示虚双精度浮、`if` 表示虚浮点数、`il` 表示虚长双数 (§6.6)）。\n\n*   `std::literals::string_literals`:\
  \ 后缀 `s` 表示字符串 (§6.6, §10.2)）。\n\n*   `std::literals::string_view_literals`: 后缀\
  \ `sv` 表示字符串视图 (§10.3)）。\n\n*   `std::numbers`: 用于数学常数 (§17.9)。\n\n*   `std::pmr`:\
  \ 用于多态内存资源 (§12.7)。\n\n要使用来自子命名空间的后缀，我们必须将其引入到我们想要使用的命名空间中。例如：\n\n点击此处查看代码图像\n\n\
  ```\n// no mention of complex_literals\nauto z1 = 2+3i;          // error: no suffix\
  \ 'i'\n\nusing namespace literals::complex_literals; // 使复数字面量可见\nauto z2 = 2+3i;\
  \          // ok: z2 is a complex<double>\n```\n\n对于子命名空间应该包含什么内容，并没有统一的哲学。然而，由于后缀不能被显式限定，因此我们只能在不产生歧义风险的情况下向作用域引入单一组后缀。因此，旨在与其他库协作（这些库可能定义了自己的后缀）的库后缀被放置在子命名空间中。\n\
  \n### 9.3.2 `ranges` 命名空间\n\n标准库提供了两个版本的算法，例如 `sort()` 和 `copy()`：\n\n*   传统的序列版本，接受一对迭代器；例如\
  \ `sort(begin(v),v.end())` 。\n\n*   范围（range）版本，接受单个范围；例如 `sort(v)` 。\n\n理想情况下，这两个版本应该通过完美重载（overload\
  \ perfectly）来实现工作，而不需要任何额外工作。然而，它们并没有做到。例如：\n\n点击此处查看代码图像\n\n```\nusing namespace\
  \ std;\nusing namespace ranges;\n\nvoid f(vector<int>& v)\n{\n        sort(v.begin(),v.end());\
  \       // error:ambiguous\n        sort(v);                                // error:\
  \ ambiguous\n}\n```\n\n为了防止在使用传统的无约束模板时出现歧义，标准要求我们显式地将标准库算法的范围版本引入作用域：\n\n点击此处查看代码图像\n\
  \n```\nusing namespace std;\n\nvoid g(vector<int>& v)\n{\n        sort(v.begin(),v.end());\
  \     // OK\n        sort(v);                              // error: no matching\
  \ function (in std)\n        ranges::sort(v);               // OK\n        using\
  \ ranges::sort;         // 从这里开始 sort(v) OK\n        sort(v);                  \
  \           // OK\n}\n```\n\n### 9.3.3 模块（Modules）\n\n目前还没有标准库模块。C++23 可能会弥补这一缺失（由于委员会时间不足）。目前，我使用\
  \ `module std`，它可能会成为标准，并提供了 `namespace std` 中的所有功能。见附录 A。\n\n### 9.3.4 头文件（Headers）\n\
  \n以下是一些标准库头文件，全部在 `std` 命名空间中提供声明：\n\n| 精选标准库头文件 | |\n| --- | --- |\n| `<algorithm>`\
  \ | `copy()`, `find()`, `sort()` | 第 13 章 |\n| `<array>` | `array` | §15.3.1 |\n\
  | `<chrono>` | `duration`, `time_point`, `month`, `time_zone` | §16.2 |\n| `<cmath>`\
  \ | `sqrt()`, `pow()` | §17.2 |\n| `<complex>` | `complex`, `sqrt()`, `pow()` |\
  \ §17.4 |\n| `<concepts>` | `floating_point`, `copyable`, `predicate`, `invocable`\
  \ | §14.5 |\n| `<filesystem>` | `path` | §11.9 |\n| `<format>` | `format()` | §11.6.2\
  \ |\n| `<fstream>` | `fstream`, `ifstream`, `ofstream` | §11.7.2 |\n| `<functional>`\
  \ | `function`, `greater_equal`, `hash`, `range_value_t` | 第 16 章 |\n| `<future>`\
  \ | `future`, `promise` | §18.5 |\n| `<ios>` | `hex`, `dec`, `scientific`, `fixed`,\
  \ `defaultfloat` | §11.6.2 |\n| `<iostream>` | `istream`, `ostream`, `cin`, `cout`\
  \ | 第 11 章 |\n| `<map>` | `map`, `multimap` | §12.6 |\n| `<memory>` | `unique_ptr`,\
  \ `shared_ptr`, `allocator` | §15.2 |\n| `<random>` | `default_engine`, `normal_distribution`\
  \ | §17.5 |\n| `<ranges>` | `sized_range`, `split_range` | §14.1 |\n| `<regex>`\
  \ | `regex`, `smatch` | §10.4 |\n| `<string>` | `string` | §10.2 |\n| `<string_view>`\
  \ | `string_view` | §10.3 |\n| `<set>` | `set`, `multiset` | §12.8 |\n| `<sstream>`\
  \ | `istringstream`, `ostringstream` | §11.7 |\n| `<stdexcept>` | `length_error`,\
  \ `out_of_range`, `runtime_error` | §4.2 |\n| `<tuple>` | `tuple`, `get()` | §15.3\
  \ |\n| `<thread>` | `thread` | §18.2 |\n| `<unordered_map>` | `unordered_map`, `unordered_multimap`\
  \ | §12.6 |\n| `<utility>` | `move()`, `swap()` | 第 16 章 |\n\n此列表并不完全。还提供了 C 库头文件，如\
  \ `<stdlib>`。对于每个此类头文件，还有一个带有 **c** 前缀并去掉 **h** 的版本。该版本（如 `<cstdlib>`）将其声明置于 `std`\
  \ 和全局命名空间中。\n\n这些头文件反映了标准库的发展历史。因此，它们并不总是像我们希望的那样逻辑且易于记忆。这就是使用模块（如 std §9.3.3)。\n\
  \n[2] 当有选择时，优先考虑标准库而非其他库；§9.1)。\n\n[3] 不要认为标准库可以解决所有问题；§9.1)。\n\n[4] 如果你不使用模块，请记住\
  \ **include** 适当的头文件；§9.3.1)。\n\n\n\n\n文本处理是大多数程序的重要部分。C++ 标准库提供了一个 `string` 类型，以使大多数用户无需通过指针对\
  \ C 风格的字符数组进行操作。`string_view` 类型允许我们处理字符序列，无论它们是如何存储的（例如，存储在 `std::string` 或 `char[]`\
  \ 中）。此外，还提供了正则表达式匹配，以帮助在文本中查找模式。正则表达式提供的形式与大多数现代语言中的形式相似。`string` 对象和 `regex` 对象都可以使用多种字符类型（例如\
  \ Unicode）。\n\n## 10.2 字符串\n\n标准库提供了一个 `string` 类型来补充字符串字面量（§1.2.1）；`string` 是一种`regular`\
  \ 类型（§8.2, §14.5），用于拥有和操作各种各种字符类型的字符序列。`string` 类型提供了多种实用的字符串操作，例如拼接。例如：\n\n点击此处查看代码图像\n\
  \n```\nstring compose(const string& name, const string& domain)\n{\n        return\
  \ name + @ + domain;\n}\n\nauto addr = compose(\"dmr\",\"bell-labs.com\");\n```\n\
  \n在这里，`addr` 被初始化为字符序列 `dmr@bell-labs.com`。`string` 的“相”意味着拼接。你可以将 `string`、字符串字面量、C\
  \ 风格字符串或字符拼接到 `string` 中。标准的 `string` 具有移动构造函数，因此通过值返回长长的 `string` 也是高效的（§6.2.2）。\n\
  \n在许多中，最常见的拼接形式是在 `string` 的末尾添加内容。这通过 `+=` 操作直接支持。例如：\n\n点击此处查看代码图像\n\n```\nvoid\
  \ m2(string& s1, string& s2)\n{\n        s1 = s1 + '\\n';   // 追加换行符\n        s2\
  \ += '\\n';        // 追加换行符\n}\n```\n\n在 `string` 末尾添加内容的两种方法在语义上是等价的，但我更喜欢后者，因为它更明确地说明了它的功能，更简洁，可能更高效。\n\
  \n`string` 是可变的。除了 `=` 和 `+=` 之外，还支持下标（使用 `[]`）和子串操作。例如：\n\n点击此处查看代码图像\n\n```\n\
  string name = \"Niels Stroustrup\";\n\nvoid m3()\n{\n        string s = name.substr(6,10);\
  \            // s = \"Stroustrup\"\n        name.replace(0,5,\"nicholas\");    \
  \      // name 变为 \"nicholas Stroustrup\"\n        name[0] = toupper(name[0]); \
  \           // name 变为 \"Nicholas Stroustrup\"\n}\n```\n\n`substr()` 操作返回一个 `string`，它是其参数指示的子串的拷贝。第一个参数是\
  \ `string` 的索引（位置），第二个参数是所需子串的长度。由于索引从 `0` 开始，`s` 获得了值 `Stroustrup`。\n\n`replace()`\
  \ 操作用一个值替换子串。在这种情况下，从 `0` 开始长度为 `5` 的子串是 `Niels`；它被替换为 `nicholas`。最后，我将初始字符替换为它的大写等字符。因此，`name`\
  \ 的最终值为 `Nicholas Stroustrup`。注意，替换字符串的大小不需要与其所替换的子串的大小相同。\n\n许多实用的 `string` 操作包括赋值（使用\
  \ `=`）、下标（使用 `[]` 或 `at()`，类似于 `vector` ；§12.2.2）、比较（使用 `==` 和 `!=`）以及字典序排序（使用 `<`,\
  \ `<=`, `>`, 和 `>=`）、迭代（使用迭代器、`begin()` 和 `end()`，类似于 `vector` ；§13.2）、输入（§11.3）和流处理（§11.7.3）。\n\
  \n自然地，`string` 可以相互比较，也可以与 C 风格字符串（§1.7.1）以及字符串字面量进行比较。例如：\n\n点击此处查看代码图像\n\n```\n\
  string incantation;\n\nvoid respond(const string& answer)\n{\n        if (answer\
  \ == incantation) {\n                // ... 执行魔法 ...\n        }\n        else if\
  \ (answer == \"yes\") {\n                // ...\n        }\n        // ...\n}\n\
  ```\n\n如果你需要一个 C 风格的字符串（一个零终止的 `char` 数组），`string` 提供了对其包含字符的只读访问（`c_str()` 和 `data()`）。例如：\n\
  \n点击此处查看代码图像\n\n```\nvoid print(const string& s)\n{\n        printf(\"For people\
  \ like printf: %s\\n\",s.c_str());           // c_str() 返回指针\n        cout << \"\
  For people like streams: \" << s << '\\n';          // 使用流处理\n}\n```\n\n要得到 `std::string`\
  \ 类型的字符串字面量，可以使用 `s` 后缀。例如：\n\n点击此处查看代码图像\n\n```\nauto cat = \"Cat\"s; // std::string\n\
  auto dog = \"Dog\";   // C 风格字符串\n```\n\n要使用 `s` 后缀，你需要使用命名空间 `std::literals`（§6.6）。\n\
  \n### 10.2.1 string 实现\n\n实现字符串类是一个流行且有用的练习。然而，对于通用用途，我们手工实现的很难达到标准的便利性或性能。如今，`string`\
  \ 通常使用*短字符串优化*。也就是说，短字符串存储在 `string` 对象本身中，而长字符串放置在堆上。考虑：\n\n```\nstring s1 {\"\
  Annarie\"};                          // 短字符串\nstring s2 {\"Annarie Stroustrup\"\
  };               // 长字符串\n```\n\n内存布局将如下：\n\n![Images](img/f0127-05.jpg)\n\n当 `string`\
  \ 的值从短字符串变为长字符串（反之亦然）时，它的表示会相应的调整。“短”字符串可以有多少字符？这取决于实现，但“大约 14 个字符”并不是一个坏假设。\n\n\
  为了处理多种字符集，`string` 实际上是字符类型 `char` 的通用模板 `basic_string` 的别名：\n\n点击此处查看代码图像\n\n```\n\
  template<typename Char>\nclass basic_string {\n        // ... Char 字符串 ...\n};\n\
  \nusing string = basic_string<char>;\n```\n\n用户可以定义任意字符类型的字符串。例如，假设我们有一个日语字符类型 `Jchar`，我们可以写：\n\
  \n点击此处查看代码图像\n\n```\nusing Jstring = basic_string<Jchar>;\n```\n\n现在我们可以对 `Jstring`（日语字符字符串）执行所有常规字符串操作。\n\
  \n\n\n\n# String View (字符串视图)\n\n`string_view` 提供了对连续字符序列的访问。字符可以以许多可能的方式存储，包括在\
  \ `string` 中或在 C 风格的字符串中。`string_view` 类似于指针或引用，因为它并不拥有它所指向的字符。在这一点上，它类似于 STL 中的迭代器对\
  \ (§13.3)。\n\n考虑一个拼接两个字符串的简单函数：\n\n点击此处查看代码图片\n\n```\nstring cat(string_view sv1,\
  \ string_view sv2)\n{\n     string res {sv1};           // 从 sv1 初始化\n     return\
  \ res += sv2;        // 从 sv2 追加并返回\n\n}\n```\n\n我们可以这样调用这个 `cat()`：\n\n点击此处查看代码图片\n\
  \n```\nstring king = \"Harold\";\nauto s1 = cat(king,\"William\");             \
  \             // HaroldWilliam: string 和 const char*\nauto s2 = cat(king,king);\
  \                                   // HaroldHarold: string 和 string\nauto s3 =\
  \ cat(\"Edward\",\"Stephen\"sv);           // EdwardStephen: const char * 和 string_view\n\
  auto s4 = cat(\"Canute\"sv,king);                      // CanuteHarold\nauto s5\
  \ = cat({&king[0],2},\"Henry\"sv);           // HaHenry\nauto s6 = cat({&king[0],2},{&king[2],4});\
  \         // Harold\n```\n\n这个 `cat()` 相比于接受 `const string&` 参数的 `compose()` (§10.2)\
  \ 有三个优势：\n\n* 它可以用于以许多不同方式管理的字符序列。\n* 我们可以轻松地传递子字符串。\n* 我们不需要为了传递 C 风格字符串参数而创建一个\
  \ `string` 对象。\n\n注意 `sv`（“string view” 后后缀的使用。要使用它，我们需要让它可见：\n\n点击此处查看代码图片\n\n\
  ```\nusing namespace std::literals::string_view_literals;       // §6.6\n```\n\n\
  为什么要费力使用后缀呢？原因是当我们传递 `\"Edward\"` 时，我们需要从 `const char*` 构建一个 `string_view`，这需要对字符进行计数。对于\
  \ `\"Stephen\"sv`，长度是在编译时计算的。\n\n`string_view` 定义了一个范围，因此我们可以遍历它的字符。例如：\n\n点击此处查看代码图片\n\
  \n```\nvoid print_lower(string_view sv1)\n{\n        for (char ch : sv1)\n     \
  \           cout << tolower(ch);\n}\n```\n\n`string_view` 的一个重要限制是它是其所字符的只读视图。例如，你不能使用\
  \ `string_view` 将字符传递给一个会将其参数修改为小写的函数。对于这一点，你可能考虑使用 `span` (§15.2.2)。\n\n将 `string_view`\
  \ 想象成一种指针；要使用它，它必须指向某些东西：\n\n点击此处查看代码图片\n\n```\nstring_view bad()\n{\n        string\
  \ s = \"Once upon a time\";\n        return {&s[5],4};                // 错误：返回指向局部对象的指针\n\
  }\n```\n\n在这里，返回的 `string` 在我们使用其字符之前就会被销毁。\n\n对 `string_view` 进行越界访问的行为是未定义的。如果你想要保证的范围检查，请使用\
  \ `at()`，它会在尝试越界访问时抛出 `out_of_range` 异常，或者使用 `gsl::string_span` (§15.2.2)。\n\n##\
  \ 10.4 正则表达式\n\n正则表达式是文本处理的强大工具。它们提供了一种简单且简洁描述文本中模式的方法（例如美国邮政编码 `TX 77845` 或 ISO\
  \ 格式的日期 `2009-06-07`），并能够高效地查找此类模式。在 `<regex>` 中，标准库以 `std::regex` 类及其支持函数的形式提供了对正则表达式的支持。为了让体验一下\
  \ `regex` 库的风格，让我们定义并打印一个模式：\n\n点击此处查看代码图片\n\n```\nregex pat {R\"(\\w{2}\\s*\\d{5}(-\\\
  d{4})?)\"};   // 美国邮政编码模式：XXddddd-dddd 及其变体\n```\n\n在任何语言中使用正则表达式的人都会觉得 `\\w{2}\\\
  s*\\d{5}(-\\d{4})?` 很熟悉。它指定了一个以两个字母 `\\w{2}` 开头的模式，后面可选跟着一些空格 `\\s*`，然后是五个数字 `\\\
  d{5}`，最后可选跟着一个连字符和四个数字 `-\\d{4}`。\n\n使用模式最简单的方法是在流中搜索它：\n\n点击此处查看代码图片\n\n```\nint\
  \ lineno = 0;\nfor (string line; getline(cin,line); ) {                  // 读取行\n\
  \        ++lineno;\n        smatch matches;                                    //\
  \ 匹配字符串在这里\n        if (regex_search(line,matches,pat)) {             // 在 line\
  \ 中搜索 pat\n                cout << lineno << \": \" << matches[0] << '\\n';\n  \
  \            }\n```\n\n`regex_search(line,matches,pat)` 在 `line` 中搜索任何匹配 `pat` 中正则表达式的内容，如果找到了任何匹配项，就会将其存储在\
  \ `matches` 中。如果没有找到匹配项，`regex_search(line,matches,pat)` 返回 `false`。`matches` 变量的类型为\
  \ `smatch`。“s”代表“sub”或“string”，`smatch` 是 `string` 类型的 `vector`。第一个元素（这里是 `matches[0]`）是完整匹配。`regex_search()`\
  \ 的结果是一个匹配集合，通常表示为 `smatch`：\n\n点击此处查看代码图片\n\n```\nvoid use()\n{\n        ifstream\
  \ in(\"file.txt\");        // 输入文件\n        if (!in) {                         \
  \      // 检查文件是否打开\n                cerr << \"no file\\n\";\n                return;\n\
  \        }\n\n        regex pat {R\"(\\w{2}\\s*\\d{5}(-\\d{4})?)\"};   // 美国邮政编码模式\n\
  \n        int lineno = 0;\n        for (string line; getline(in,line); ) {     \
  \             // 读取行\n                ++lineno;\n                smatch matches;\
  \     // 匹配字符串在这里\n                if (regex_search(line, matches, pat)) { // 在\
  \ line 中搜索 pat\n                        cout << lineno << \": \" << matches[0] <<\
  \ '\\n';           // 完整匹配\n                        if (1<matches.size() && matches[1].matched)\
  \        // 如果存在子模式\n                                                          \
  \    // 并且被匹配\n                                cout << \"\\t: \" << matches[1] <<\
  \ '\\n';                 // 子匹配\n                  }\n          }\n  }\n}\n```\n\
  \n\n\n\n\n此函数读取文件并寻找美国邮政编码，例如 `TX77845` 和 `DC 20500-0001`。`smatch` 类型是正则表达式结果的容器。在这里，`matches[0]`\
  \ 是整个匹配模式，而 `matches[1]` 是可选的四位数字子模式 `(-\\d{4})?`。\n\n换行符 `\\n` 可以是模式的一部分，因此我们可以搜索多行模式。显然，如果我们想这样做，就不应该一次只读取一行。\n\
  \n正则表达式的语法和语义设计得使得正则表达式可以被编译为状态机以实现高效执行 [Cox,2007]。`regex` 类型在运行时执行此编译。\n\n## 10.4.2\
  \ 正则表达式表示法\n\n`regex` 库可以识别多种正则表达式表示法的变体。在这里，我使用了默认表示法，这是用于 ECMAScript（更通称为 JavaScript）的\
  \ ECMA 标准变体。正则表达式的语法基于特殊字符：\n\n| 正则表达式特殊字符 | |\n| --- | --- |\n| `.` | 任意单个字符（“通配符”）\
  \ | `\\` | 后一个字符具有特殊含义 |\n| `[` | 字符类开始 | `*` | 零或多次（后缀操作） |\n| `]` | 字符类结束 | `+`\
  \ | 一或多次（后缀操作） |\n| `{` | 开始计数 | `?` | 可选（零或一个）（后缀操作） |\n| `}` | 结束计数 | `\\|` |\
  \ 备选（或） |\n| `(` | 开始分组 | `^` | 行首；否定 |\n| `)` | 结束分组 | `$` | 行尾 |\n\n例如，我们可以像这样指定一个以零或多个\
  \ `A` 开头，后跟一个或多个 `B`、再跟一个可选的 `C` 的行：\n\n```\n^A*B+C?$\n```\n\n匹配项的示例：\n\n```\nAAAAAAAAAAAABBBBBBBBBC\n\
  BC\nB\n```\n\n不匹配项的示例：点击此处查看代码图像\n\n```\nAAAAA                    // 没有 B\n    AAAABC\
  \             // 初始空格\nAABBCC                 // C 多了\n```\n\n如果模式的一部分被包含在括号中，则被认为是一个子模式（可以从\
  \ `smatch` 中单独提取出来）。例如：点击此处查看代码图像\n\n```\n\\d+-\\d+            // 没有子模式\n\\d+(-\\\
  d+)          // 一个子模式\n(\\d+)(-\\d+)        // 两个子模式\n```\n\n通过添加后缀，模式可以是可选的或重复的（默认是恰好一次）：\n\
  \n| 重复 | |\n| --- | --- |\n| `{ n }` | 恰好 `n` 次 |\n| `{ n, }` | hơn |\n| `{n,m}`\
  \ | 至少 `n` 次，最多 `m` 次 |\n| `*` | 零或多次，即 `{0,}` |\n| `+` | 一或多次，即 `{1,}` |\n| `?`\
  \ | 可选（零或一个），即 `{0,1}` |\n\n例如：\n\n```\nA{3}B{2,4}C*\n```\n\n匹配项的示例：\n\n```\nAAABBC\n\
  AAABBB\n```\n\n不匹配项的示例：点击此处查看代码图像\n\n```\nAABBC                     // A 太少\nAAABC\
  \                     // B 太少\nAAABBBBBCCC     // B 多了\n```\n\n在任何重复表示法（`?`、`*`、`+`\
  \ 和 `{ }`）之后加上后缀 `?` 会使模式匹配器变为“懒的”或“非贪婪的”。也就是说，在寻找模式时，它寻找的是最短匹配而不是最长匹配。默认情况下，模式匹配总是寻找最长匹配；这被称为最大吞噬规则（Max\
  \ Munch rule）。考虑：\n\n```\nababab\n```\n\n模式 `(ab)+` 匹配所有的 `ababab`。然而，`(ab)+?` 只匹配第一个\
  \ `ab`。\n\n最常见的字符分类有名称：\n\n| 字符类 | |\n| --- | --- |\n| `alnum` | 任意字母数字字符 |\n| `alpha`\
  \ | 任意字母字符 |\n| `blank` | 任意非行分隔符的空白字符 |\n| `cntrl` | 任意控制字符 |\n| `d` | 任意数字 |\n\
  | `digit` | 任意十数字 |\n| `graph` | 任意图形字符 |\n| `lower` | 任意小写字符 |\n| `print` | 任意可打印字符\
  \ |\n| `punct` | 任意标点字符 |\n| `s` | 任意空白字符 |\n| `space` | 任意空白字符 |\n| `upper` | 任意大写字符\
  \ |\n| `w` | 任意单词字符（字母数字加下划线） |\n| `xdigit` | 任意十六进制数字 |\n\n在正则表达式中，字符类名称必须用 `[:\
  \ :]` 包围。例如，`[:alnum:]` 匹配一个数字。此外，它们是缩写：\n\n| 字符类缩写 | |\n| --- | --- |\n| `d` |\
  \ 一个数字 |\n| `s` | 空格 |\n| `w` | 单词字符 |\n| `D` | 非数字 |\n| `S` | 非空格字符 |\n| `W` |\
  \ 非单词字符 |\n| `b` | 单词边界 |\n| `B` | 非单词边界 |\n| `l` | 小写字符 |\n| `L` | 非小写字符 |\n| `u`\
  \ | 大写字符 |\n| `U` | 非大写字符 |\n| `p` | 可打印字符 |\n| `P` | 非可打印字符 |\n| `a` | 字母数字字符 |\n\
  | `A` | 非字母数字字符 |\n| `s` | 字母字符 |\n| `S` | 非字母字符 |\n| `g` | 图形字符 |\n| `G` | 非图形字符\
  \ |\n| `h` | 十六进制 |\n| `X` | 非十六进制数字 |\n\n最后，这里有一个使用 `regex_match()` (10.4) 来测试字符串是否为标识符的函数点击此处查看代码图像:\n\
  \n```cpp\nbool is_identifier(const string& s)\n{\n        regex pat {\"[:alnum:]]\\\
  \\w*\"}; //字母数字或下划线\n        return regex_match(s,pat);\n}\n```\n\n注意在普通字符串中双写反斜杠以包含反斜杠。使用原始字符串字面量\
  \ (10.4) 来缓解特殊字符的问题。例如：\n\n```cpp\nbool is_identifier(const string& s)\n{\n    \
  \    regex pat {R\"([_alpha:]]\\w*)\"}; // 或者是字母\n        return regex_match(s,pat);\n\
  }\n```\n\n以下是一些模式的示例点击此处查看代码图像:\n\n```\nAx*                  // A, Ax, Axxxx\nAx+\
  \                 // Ax, Axxx         不是 A\n\\d-?\\d              // 1-2, 12   \
  \         不是 1--2\n\\w{2}-\\d{4,5}   // Ab-1234, XX-54321, 22-5432         数字在 \\\
  w 中\n(\\d*:)?(\\d+)      // 12:3, 1:23, 12, :12       不是 123:\n(bs|BS)         \
  \  // bs, BS             不是 bS\n[aeiouy]          // a, o, u              英语元音，不是\
  \ x\n[^aeiouy]        // x, k                  不是英语元音，不是 e\n[a^eiouy]        //\
  \ a, ^, o, u           英语元音或 ^\n```\n\n\n\n\n\n点击此处查看图像\n\n```cpp\n(\\s|:|,)*(\\\
  d*)      // 可选的空格、冒号和/或逗号，后面跟着可选的数字\n```\n\n假设我们对数字之前的字符（通常是分隔符）感兴趣，我们可以写成：\n\n\
  点击此处查看图像\n\n```cpp\n(?:\\s|:|,)*(\\d*)    // 可选的空格、冒号和/或逗号，后面跟着可选的数字\n```\n\n这将节省正则表达式引擎无需存储前面的字符：`(?:`\
  \ 变体只有一个子模式。\n\n| 正则表达式分组示例 | |\n| --- | --- |\n| `\\d*\\s\\w+` | 无分组（子模式） |\n|\
  \ `(\\d*)\\s(\\w+)` | 两个分组 |\n| `(\\d*)(\\s(\\w+))+` | 两个分组（组之间不嵌套） |\n| `(\\s*\\\
  w*)+` | 一个分组；一个或多个子模式；只有最后一个子模式被保存为 `sub_match` |\n| `<(.+?)>(.+?)</\\1>` | 三分组；`\\\
  1` 表示“与分组 1 相同” |\n\n最后一个模式用于解析 XML。它能找到标签/结束标签标记。注意，我在标签和结束标签之间的子模式使用了非贪婪匹配（*懒惰匹配*）`.*?`。如果我使用普通的\
  \ `.*`，此输入将导致问题：\n\n点击此处查看图像\n\n```cpp\nAlways look on the <<b>bright</b> side of\
  \ <b>life</b>.\n```\n\n对第一个子模式进行*贪婪匹配*会将第一个 `<` 与最后一个 `>` 匹配。这虽然是正确的行为，但可能不是程序员想要的。\n\
  \n关于正则表达式更详尽介绍，请参见 [Friedl,1997]。\n\n### 10.4.3 迭代器\n\n我们可以定义一个 `regex_iterator`\
  \ 来遍历字符序列并寻找模式的匹配项。例如，我们可以使用 `sregex_iterator`（即 `regex_iterator<string>`）来输出 `string`\
  \ 中所有由空格分隔的单词：\n\n点击此处查看图像\n\n```cpp\nvoid test()\n{\n        string input = \"\
  aa as; asd ++e^asdf asdfg\";\n        regex pat {R\"(\\s+(\\w+))\"};\n        for\
  \ (sregex_iterator p(input.begin(),input.end(),pat); p!=sregex_iterator{}; ++p)\n\
  \                cout << (*p)[1] << '\\n';\n}\n```\n\n此输出为：\n\n```text\nas\nasd\n\
  asdf\nasdfg\n```\n\n我们漏掉了第一个单词 `aa`，因为它前面没有空格。如果我们将模式简化为 `R\"((\\w+))\"`，则会得到：\n\
  \n```text\naa\nas\nasd\ne\nasdf\nasdfg\n```\n\n`regex_iterator` 是双向迭代器（bidirectional\
  \ iterator），因此我们不能直接遍历 `istream`（它只提供输入迭代器）。此外，我们无法通过 `regex_iterator` 写入，且默认的 `regex_iterator`\
  \ (`regex_iterator{}`) 是唯一的序列结束标记。\n\n## 10.5 建议\n\n[1] 使用 `std::string` 来拥有字符序列；§10.2;\
  \ [CG: SL.str.1]。\n\n[2] 优先使用 `string` 操作而非 C 风格的字符串函数；§10.1。\n\n[3] 使用 `string`\
  \ 声明变量和成员，而不是作为基类；§10.2。\n\n[4] 按值返回 `string`（依赖移动语义和拷贝消除）；§10.2, §10.2.1; [CG:\
  \ F.15]。\n\n[5] 直接或间接地使用 `substr()` 读取子字符串，并使用 `replace()` 写入子字符串；§10.2。\n\n[6]\
  \ `string` 可以根据需要增长和缩小；§10.2。\n\n[7] 当你需要进行范围检查时，使用 `at()` 而不是迭代器或 `[ ]`；§10.2,\
  \ §10.3。\n\n[8] 当你想优化速度时，使用迭代器和 `[ ]` 而不是 `at()`；§10.2, §10.3。\n\n[9] 使用 range--for\
  \ 安全地最小化范围检查 §10.2, §10.3。\n\n[10] `string` 不会溢出；§10.2, §11.3。\n\n[11] 必须时使用 `c_str()`\
  \ 或 `data()` 生成 `string` 的 C 风格字符串表示；§10.2。\n\n[12] 使用 `stringstream` 或通用值提取函数（如\
  \ `to<X>`）进行字符串数值转换；§11.7.3。\n\n[13] `basic_string` 可用于创建任意类型的字符串§10.2.1。\n\n[14]\
  \ 使用 `s` 后缀表示用于标准库 `string` 的字面量；§10.3 [CG: SL.str.12]。\n\n[15] 使用 `string_view`\
  \ 作为函数的参数读取子字符串；§10.2, §10.3。\n\n[16] 使用 `string_view` 作为函数的参数写入子字符串；§10.2, §10.3。\n\
  \n[17] 将 `string_view` 视为一种带有大小的指针；它不拥有其字符§10.2。\n\n[18] 使用 `sv` 后缀表示用于标准库 `string`\
  \ 的字面量；§10.3。\n\n[19] 大多数任务使用 `regex`；§10.2。\n\n[20] 使用 `regex_match` 匹配模式；§10.2。\n\
  \n[21] 使用 `regex_search` 搜索模式；§10.2。\n\n[22] 使用 `regex_iterator` 遍历模式；§10.2。\n\n\
  \n\n\n这些流可以用于二进制 I/O，用于多种字符类型，与特定区域相关，并使用高级的缓冲策略，但这些主题超出了本书的范围。\n\n这些流可以用于对 `string`\
  \ 进行输入和输出（§11.3）、格式化为 `string` 缓冲区（§11.7.3）、内存区域（§11.7.4）以及文件 I/O（§11.9）。\n\nI/O\
  \ 流类都具有析构函数，用于释放所有拥资源（如缓冲区和文件句柄）。也就是说，它们是“资源即初始化”（RAII；§6.3）。\n\n## 11.2 输出\n\n\
  在 `<ostream>` 中，I/O 流库为每个内置类型定义了输出。此外，很容易定义用户定义类型的输出（§11.5）。运算符 `<<`（“放入”）被用作 `ostream`\
  \ 类型对象的输出运算符；`cout` 是标准输出流，而 `cerr` 是用于报告错误的标准流。默认情况下，写入 `cout` 的值会被转换为字符序列。例如，要输出十进制数字\
  \ `10`，我们可以写：\n\n```\ncout << 10;\n```\n\n这在标准输出流上放置了字符 `1` 紧接着字符 `0`。\n\n等效地，我们可以写：\n\
  \n```cpp\nint x {10};\ncout << x;\n```\n\n不同类型的输出可以以显而易的方式组合：\n\n点击此处查看图像\n\n```\n\
  void h(int i)\n{\n         cout << \"the value of i is \";\n         cout << i;\n\
  \         cout << '\\n';\n}\n```\n\n对于 `h(10)`，输出将是：\n\n```\nthe value of i is 10\n\
  ```\n\n当输出多个相关项时，人们很快就会厌倦重复输出流的名称。幸运的是，输出表达式的结果本身可以用于进一步输出。例如：\n\n点击此处查看图像\n\n```\n\
  void h2(int i)\n{\n         cout << \"the value of i is \" << i << '\\n';\n}\n```\n\
  \n此 `h2()` 产生与 `h()` 相同的输出。\n\n字符常量是用单引号括起来的字符。注意，字符是以字符形式而非数值形式输出的。例如：\n\n点击此处查看图像\n\
  \n```\nint b = 'b';         // 注意：char 隐式转换为 int\nchar c = 'c';\ncout << 'a' <<\
  \ b << c;\n```\n\n字符 `’b’` 的整数值是 98（在我所使用的 C++ 实现中使用的 ASCII 编码中），因此这将输出 `a98c`。\n\
  \n## 11.3 输入\n\n在 `<istream>` 中，标准库提供了用于输入的 `istream`。与 `ostream` 类似，`istream` 处理内置类型的字符字符串表示，并很容易扩展以处理用户定义类型。\n\
  \n运算符 `>>`（“获取自”）被用作输入运算符；`cin` 是标准输入流。`>>` 右侧操作数的类型决定了接受什么输入以及输入操作的目标。例如：\n\n点击此处查看图像\n\
  \n```\nint i;\ncin >> i;           // 将一个整数读入 i\n\ndouble d;\ncin >> d;        \
  \  // 将一个双精度浮点数读入 d\n```\n\n这从标准输入将一个数字（如 1234）读入整数变量 `i`，并将一个浮点数（如 12.34e5）读入双精度浮点变量\
  \ `d`。\n\n与输出操作一样，输入操作也可以链式调用，所以我可以等效地写为：\n\n点击此处查看图像\n\n```\nint i;\ndouble d;\n\
  cin >> i >> d;         // 读入 i 和 d\n```\n\n在两种情况下，整数的读取都由任何非数字字符终止。默认情况下，`>>` 会跳过初始空格，因此一个合适的完整输入序列将是\n\
  \n```\n1234\n12.34e5\n```\n\n通常，我们希望读取字符序列。这样做的一种方便方法是读入 `string` 中。例如：\n\n点击此处查看图像\n\
  \n```\ncout << \"Please enter your name\\n\";\nstring str;\ncin >> str;\ncout <<\
  \ \"Hello, \" << str << \"!\\n\";\n```\n\n如果你输入 Eric，响应是：\n\n```\nHello, Eric!\n\
  ```\n\n如果你输入 Eric，响应是：\n\n```\nHello, Eric!\n```\n\n\n\n\n\n点击此处查看代码图像\n\n```cpp\n\
  ostream& operator<<(ostream& os, const Entry& e)\n{\n       return os << \"{\\\"\
  \" << e.name << \"\\\", \" << e.number << \"}\";\n}\n```\n\n用户定义的输出运算符接受其输出流（通过引用）作为第一个参数，并将其作为结果。\n\
  \n相应的输入运算符更为复杂，因为它必须检查格式是否正确并处理错误：\n\n点击此处查看代码图像\n\n```cpp\nistream& operator>>(istream&\
  \ is, Entry& e)\n         // 读取 { \"name\" , number } 对。注意: 格式为 { \" \" , 和 }\n\
  {\n         char c, c2;\n         if (is>>c && c=='{' && is>>c2 && c2== \" ) { //\
  \ 以 { 开头，跟着一个 \"\n                string name;                                //\
  \ 字符串的默认值是空字符串: \"\"\n                while (is.get(c) && c!= \" )           //\
  \ \" 之前的任何内容都是名称的一部分\n                         name+=c;\n\n                if (is>>c\
  \ && c==',') {\n                         int number = 0;\n                     \
  \     if (is>>number>>c && c=='}') { // 读取数字和一个 }\n                            \
  \    e = {name,number};            // 赋值给 entry\n                              \
  \  return is;\n                          }\n                }\n         }\n\n  \
  \       is.setstate(ios_base::failbit);            // 在流中注册失败\n         return is;\n\
  }\n```\n\n输入操作返回其 `istream` 的引用，可用于测试操作是否成功。例如，当用作条件时，`is>>c` 意味着“我们成功地从 `is` 读取了一个\
  \ `char` 到 `c` 中吗？”\n\n`is>>c` 默认跳过空白字符，但 `is.get(c)` 不会，因此这个 `Entry`-输入运算符忽略（跳过）名称字符串之外的空白字符，但不会忽略内部的。例如：\n\
  \n点击此处查看代码图像\n\n```cpp\n{ \"John Marwood Cleese\", 123456       }\n{\"Michael Edward\
  \ Palin\", 987654}\n```\n\n我们可以这样从输入读取这样的一对值到 `Entry` 中：\n\n点击此处查看代码图像\n\n```cpp\n\
  for (Entry ee; cin>>ee; )        // 从 cin 读取到 ee\n         cout << ee <<'\\n'; \
  \         // 将 ee 写入 cout\n```\n\n输出结果为：\n\n点击此处查看代码图像\n\n```cpp\n{\"John Marwood\
  \ Cleese\", 123456}\n{\"Michael Edward Palin\", 987654}\n```\n\n请参阅 §10.4 以了解用于识别字符流中模式的更系统化的技术（正则表达式匹配）。\n\
  \n## 11.6 输出格式化\n\n`iostream` 和 `format` 库提供了控制输入输出格式的操作。`iostream` 设施与 C++ 有同样久的历史，侧重于数字流的格式化。`format`\
  \ 设施 (§11.6.2) 是较新的（C++20），并侧重于 `printf()`-风格 (§11.8) 的值组合的格式化规范。\n\n输出格式化也提供了对\
  \ unicode 支持，但这超出了本书的范围。\n\n### 11.6.1 流格式化\n\n最简单的格式控制称为*操纵符*（manipulators），位于\
  \ `<ios>`、`<istream>`、`<ostream>` 和 `<iomanip>`（带参数的操纵符）。例如，我们可以将整数输出为十进制（默认）、八进制或十六进制：\n\
  \n点击此处查看代码图像\n\n```cpp\ncout << 1234 << ' ' << hex << 1234 << ' ' << oct << 1234\
  \ << dec << 1234 <<'\\n';  // 1234 4d2 2322 1234\n```\n\n我们可以显式地设置浮点数的输出格式：\n\n\
  点击此处查看代码图像\n\n```cpp\nconstexpr double d = 123.456;\n\ncout << d << \"; \"     \
  \                              // 对 d 使用默认格式\n        << scientific << d << \";\
  \ \"             // 对 d 使用 1.123e2 风格格式\n        << hexfloat << d << \"; \"    \
  \           // 对 d 使用十六进制表示\n        << fixed << d << \"; \"                   \
  \ // 对 d 使用 123.456 风格格式\n        << defaultfloat << d'\\n';         // 对 d 使用默认格式\n\
  ```\n\n这产生了输出：\n\n点击此处查看代码图像\n\n```\n123.456; 1.234e2; 0x1.edcc27fp+2; 123.456;\
  \ 123.456\n```\n\n精度（precision）决定了用于浮点数的位数：\n\n- `general` 格式（`defaultfloat`）让实现方案选择最佳风格。\n\
  - `scientific` 格式以指数形式呈现值。精度指定了小数点前的位数。\n- `fixed` 格式呈现固定的小数部分。精度指定了小数点后的位数。\n\n\
  浮点值是经过舍入而非截断的。例如：\n\n```cpp\ncout.precision(8);\ncout << 123.456789 << '\\n'; //\
  \ 123.45679\n\ncout.precision(4);\ncout << fixed << 123.456789 << '\\n'; // 123.4568\n\
  cout << scientific << 123.456789 << '\\n'; // 1.2346e+02\ncout << default << 123.456789\
  \ << '\\n'; // 123.5\n```\n\n操纵符是“粘性的”（sticky），这意味着它们的影响会持续到后续的浮点操作。\n\n我们还可以指定数字要放置的字段大小和对齐方式：\n\
  \n```cpp\ncout << setw(10) << 123 << '\\n';      // \"      123\"\ncout << setw(10)\
  \ << left << 123 << '\\n';   // \"123       \"\ncout << setw(10) << right << 123\
  \ << '\\n'; // \"      123\"\n```\n\n除了基础数字，`<<` 还可以处理时间和日期：`duration`、`time_point`、`year_month_date`、`weekday`、`month`\
  \ 以及 `zoned_time` (§16.2)。例如：\n\n点击此处查看代码图像\n\n```cpp\ncout << \"birthday: \" <<\
  \ November/28/2021 << '\\n';\ncout << \"zt: \" << zoned_time{current_zone(), system_clock::now()}\
  \ << '\\n';\n```\n\n标准为 `complex` 复数、`bitset`s (§15.3.2)、错误代码和指针定义了 `<<`。\n\n###\
  \ 11.6.2 printf()**-风格格式化\n\n有人非常有说服地认为 `printf()` 是 C 语言中最流行的函数，也是其成功的关键因素之一。例如：\n\
  \n```cpp\nprintf(\"an int %g and a string '%s'\\n\",123,\"Hello!\");\n```\n\n这种“格式字符串后跟参数”-风格是从\
  \ BCPL 引入 C 的并被许多语言所采用的。自然地，`printf()` 一一直是 C++ 标准库的一部分，但它缺乏类型安全性且缺乏处理自定义类型的扩展性。\n\
  \n在 `<format>` 中，标准库提供了一种类型安全的 `printf()`-风格格式化机制。基础函数 `format()` 产生一个 `string`：\n\
  \n```cpp\nstring s = format(\"Hello, {}\\n\", val);\n```\n\n\n\n\n`format string`\
  \ 中的“普通字符”会被直接放入输出的 `string` 中。由 `{` 和 `}` 分隔的 `format string` 规定了格式字符串之后的参数将如何被插入到\
  \ `string` 中。最简单的 `format string` 是空字符串 `{}}`，它会从参数列表中获取下一个参数并根据其 <<默认（如果有）>>打印它。因此，如果\
  \ `val` 是 `\"World\"`，我们得到了标志性的 `\"Hello, World\\n\"`。如果 `val` 是 `127`，我们得到 `\"\
  Hello, 127\\n\"`。\n\n`format()` 最常用的用法是输出它的结果：\n\n点击此处查看代码图片\n\n```\ncout << format(\"\
  Hello, {}\\n\", val);\n```\n\n为了查看它是如何工作的，让我们先重复第 (§11.6.1) 中的示例：\n\n点击此处查看代码图片\n\
  \n```\ncout << format(\"{} {:x} {:o} {:d} {:b}\\n\", 1234,1234,1234,1234,1234);\n\
  ```\n\n这与 §11.6.1 中的整数示例具有相同的输出，不同的是我添加了二进制的 `b`，而 `ostream` 并不直接支持它：\n\n点击此处查看代码图片\n\
  \n```\n1234 4d2 2322 1234 10011010010\n```\n\n格式化指令前有一个冒号。整数格式的替代方案有：`x` 表示十六进制，`o`\
  \ 表示八进制，`d` 表示十进制以及 `b` 表示二进制。\n\n默认情况下，`format()` 按顺序获取其参数。然而，我们可以指定任意顺序。例如：\n\n\
  点击此处查看代码图片\n\n```\ncout << format(\"{3:} {1:x} {2:o} {0:b}\\n\", 000, 111, 222,\
  \ 333);\n```\n\n这输出了 `333 6f 336 0`。冒号之前的数字是要格式化的参数的编号。在良好的 C++ 风格中，编号从零开始。这允许我们对一个参数进行多次格式化：\n\
  \n点击此处查看代码图片\n\n```\ncout << format(\"{0:} {0:x} {0:o} {0:d} {0:b}\\n\", 1234);\
  \ // 默认，十六进制，八进制，十进制，二进制\n```\n\n这种将参数“无序”放入输出的能力受到了编写不同自然语言消息的人们的高度赞誉。\n\n浮点数格式与\
  \ `ostream` 相同：`e` 表示科学计数法，`a` 表示十六进制浮点数，`f` 表示固定点以及 `g` 表示默认。例如：\n\n点击此处查看代码图片\n\
  \n```\ncout << format(\"{0:}; {0:e}; {0:a}; {0:f}; {0:g}\\n\",123.456);        \
  \ // 默认，科学计数法，十六进制浮点数，固定点，默认\n```\n\n结果与 `ostream` 的结果相同，只是十六进制数字前面没有 `0x`：\n\n\
  点击此处查看代码图片\n\n```\n123.456; 1.234560e+002; 1.edd2f2p+6; 123.456000; 123.456\n```\n\
  \n点号位于精度指定符之前：\n\n点击此处查看代码图片\n\n```\ncout << format(\"precision(8): {:.8} {} {}\\\
  n\", 1234.56789, 1234.56789, 123456);\ncout << format(\"precision(4): {:.4} {} {}\\\
  n\", 1234.56789, 1234.56789, 123456);\ncout << format(\"{}\\n\", 1234.56789);\n\
  ```\n\n与流不同，指定符不是“粘性”的，所以我们得到了：\n\n点击此处查看代码图片\n\n```\nprecision(8): 1234.5679 1234.56789\
  \ 123456\nprecision(4): 1235 1234.56789 123456\n1234.56789\n```\n\n与流格式化器一样，我们也可以指定数字要放置的字段大小以及在该字段中的对齐方式。\n\
  \n像流格式化器一样，`format()` 也可以处理时间和日期 (§16.2.2)。例如：\n\n点击此处查看代码图片\n\n```\ncout << format(\"\
  birthday: {}\\n\",November28);\ncout << format(\"zt: {}\", system_clock::now());\n\
  ```\n\n和往常一样，值的默认格式与流输出相同。然而，`format()` 提供了一套关于 `%` 格式指定符的非扩展微语言，允许对数字和日期的格式化进行非常详细的控制。例如：\n\
  \n点击此处查看代码图片\n\n```\nauto ymd = 2021/March/30;\ncout << format(\"ymd: {3:%A},{1:%B},{0:%d}\\\
  n\", ymd.year(), ymd.month(), ymd.day(), weekday(ymd));\n```\n\n所有时间和日期格式字符串都以 `%`\
