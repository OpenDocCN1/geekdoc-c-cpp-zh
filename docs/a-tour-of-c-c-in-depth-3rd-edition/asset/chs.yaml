  \ 更多的少数扩展\n\n#### 19.2.9 删除和弃用的特性\n\n世界上存在数以亿行的 C++ 代码，没有人确切知道哪些功能处于关键位置。因此，ISO\
  \ 委员会在移除旧功能时非常不情愿，并且经过多年的警告。然而，有时某些问题的特性会被移除或弃用。\n\n通过弃用一个功能，标准委员会表达了该功能消失的意愿。\n\
  \n\n\n\n\n除极少数例外外，C++ 是 C 的超集（意味着 C11；[C,2011]）。大多数差异源于 C++ 对类型检查的进一步关注。编写良好的 C\
  \ 程序通常也是 C++ 程序。例如，K&R2 [Kernighan,1988] 中的每一个示例程序都是 C++。编译器可以诊断出 C++ 和 C 之间的所有差异。C11/C++20\
  \ 的不兼容性列在标准的附录 C 中 [C++,2020]]。\n\n## 19.3.1 C 和 C++ 是兄弟关系\n\n我怎么能称 C 和 C++ 为兄弟关系呢？看下面这个简化的家谱树：\n\
  \n![Images](img/f0268-01.jpg)\n\n经典 C 有两个主要的后代：ISO C 和 ISO C++。多年来，这些语言以不同的速度和方向演进。其结果之一是，每种语言都以略有不同的方式对传统的\
  \ C 风格编程提供支持。由此产生的不兼容性会让同时使用 C 和 C++ 的人、用一种语言编写并使用另一种语言实现的库的人、以及 C 和 C++ 库与工具的实现者感到非常痛苦。\n\
  \n实线表示特征的大规模继承，虚线表示对主要特征的借用，点线表示对次要特征的借用。由此，ISO C 和 ISO C++ 成为 K&R C [Kernighan,1978]\
  \ 的两个主要后代，并为兄弟。它们各自带有经典 C 的要素，且都没有与经典 C 实现 100% 兼容。我“经典 C（Classic C）”这个术语来自于一个曾贴在\
  \ Dennis Ritchie 终端机上的贴纸。它是 K&R C 加上枚举和 `struct` 赋值。BCPL 由 [Richards,1980] 定义，而\
  \ C89 由 [C1990] 定义。\n\n曾有一个 C++03，我没有列出它，因为它是一个错误修复版本。同样，C17 也没有列出，因为它是对 C11 的错误修复版本。\n\
  \n注意，C 和 C++ 之间的差异并不一定是在 C++ 中对 C 进行修改的结果。在某些情况下，不兼容性源于在 C++ 中常见很久之后才以不兼容的方式被采纳\
  \ C 中的特征。例如，将 `T*` 赋值给 `void*` 的能力以及全局 `const` 的链接 [Stroustrup,2002]。有时，某个特征在成为\
  \ ISO C++ 标准的一部分之后才以不兼容的方式引入 C，例如 `inline` 含义的细节。\n\n## 19.3.2 兼容性问题\n\nC 和 C++\
  \ 之间存在许多细微的不兼容性。它们都可能给程序员带来问题，但在 C++ 的语境下，所有问题都可以被解决。至少，C 代码段可以编译为 C，并使用 `extern\
  \ \"C\"` 机制链接到一起。\n\n将 C 程序转换为 C++ 时，主要问题可能是：\n\n*   次优的设计和编程风格。\n*   `void*` 隐式转换为\
  \ `T*`（即在没有类型强制转换的情况下进行转换）。\n*   C 代码中将 C++ 关键字（如 `class` 和 `private`）用标识符。\n* \
  \  编译为 C 的代码与编译为 C++ 的代码段之间不兼容的链接。\n\n### 19.3.2.1 风格问题\n\n自然，C 程序是用 C 风格编写的，例如\
  \ K&R 中使用的风格 [Kernighan,1988]。这意味着广泛使用指针和数组，可能还有许多宏。这些设施在大型程序中很难可靠地使用。资源管理和错误处理通常是临时的（而不是语言和工具支持的），并且通常记录不全、执行不到位。将\
  \ C 程序简单逐行转换为 C++ 程序，得到的程序在检查上通常会好一点。事实上，我从没有在在没发现某些 bug 的情况下将一个 C 程序转换为 C++。然而，基本结构没有变，错误的根源也随之变。如果你在原始\
  \ C 程序中有不完整的错误处理、资源泄漏或缓冲区溢出，这些问题在 C++ 版本中仍然会存在。要获得巨大的收益，你必须对代码的基本结构进行更改：\n\n[1]\
  \ 不要把 C++ 看作是增加了几个特征的 C。C++ 可以那样用，但只是次优的。要从 C++ 中获得相对于 C 真正的重大优势，你需要应用不同的设计和实现风格。\n\
  \n[2] 将 C++ 标准库作为新技术和编程风格的老师。注意它与 C 标准库的区别（例如，复制时用 `=` 而不是 `strcpy()`）。\n\n[3] 宏替换在\
  \ C++ 中几乎永远没有必要。使用 `const` (§1.6)、`constexpr` (§1.6)、`enum` 或 `enum class` (§2.4)\
  \ 来定义显式常量，使用 `constexpr` (§1.6)、`consteval` (§1.6) 和 `inline` (§5.2.1) 来避免命名冲突。\n\
  \n[4] 在需要之前声明变量，并立即初始化。使用 `nullptr` (§1.7) 而不是 `0` 或 `NULL`。\n\n[5] 不要使用 `malloc()`。改用\
  \ `new` 和 `delete`。\n\n[6] 除了极特殊的代码，避免使用 `void*`、`union` 和强制转换。\n\n[7] 如果你必须使用强制转换，使用命名转换（例如\
  \ `static_cast` (§5.2.3)）来更精确地表达你想做什么。\n\n[8] 不要假设用 C 风格辛苦编写（避免类、模板和异常等 C++ 特性）比更短的替代方案（例如使用标准库设施）更高效。通常（但并非总是）如此。\n\
  \n[9] 内存管理器之外避免指针算术。\n\n[10] 将连续序列（如数组）作为 `span` (§15.2.2](#ch15.xhtml_sec15_2))\
  \ 以避免范围错误。\n\n[11] 对于简单的数组遍历，使用范围-`for` (§1.7)。它比传统的循环更易写、速度更快且更安全。\n\n### 19.3.2.2\
  \ **void***\n\n在 C 中，`void*` 可以用作任何指针类型变量赋值或初始化的右侧操作数；在 C++ 中则不行。例如：\n\n```\nvoid\
  \ f(int n)\n{\n        int* p = malloc(n*sizeof(int));  /* 不是 C++;在 C++ 中，使用“new”分配内存*/\n\
  \        // ...\n}\n```\n\n这可能是最难处理的不兼容性之一。注意，`void*` 到不同指针类型的隐式转换通常不是无害的：\n\n```\n\
  char ch;\nvoid* pv = &ch;\nint* pi = pv;                  // 不是 C++\n*pi = 666;\
  \                      // 覆盖了 ch 以及 ch 附近的其他字节\n```\n\n\n\n\n\n在两种语言中，请将 `malloc()`\
  \ 的结果强制转换为正确的类型。如果你仅使用 C++，请避免使用 `malloc()`。\n\n### 19.3.2.3 链接\n\nC 和 C++ 可以被实现为（并且通常是）使用不同的链接约定。这最根本的原因是\
  \ C++ 对类型检查的更加重视。一个实际原因是 C++ 支持函数重载，因此可以存在两个名为 `open()` 的全局函数。这必须反映在链接器的工作方式上。\n\
  \n要为一个 C++ 函数提供 `C` 链接（使其能够从 C 程序片段中调用），或允许从 C++ 程序片段中调用 C 函数，请将其声明为 `extern \"\
  C\"`。例如：\n\n点击此处查看代码图片\n\n```\nextern \"C\" double sqrt(double);\n```\n\n现在，`sqrt(double)`\
  \ 可以从 C 或 C++ 代码片段中调用。`sqrt(double)` 的定义也可以编译为 C 函数或 C++ 函数。\n\n在一个作用域内，只有一个给定名称的函数可以具有\
  \ `C` 链接（因为 C 不允许函数重载）。链接规范不影响类型检查，因此 C++ 关于函数调用和参数检查的规则仍然适用于声明为 `extern \"C\"`\
  \ 的函数。\n\n### 19.4 参考文献\n\n| *[Boost]* | *The Boost Libraries: 免费同行评审的可移植 C++ 源代码库*.\
