  \n## 1.8 测试\n\nC++ 提供了常规的语句用于选择和循环，如 `if`-语句、`switch`-语句、`while`-循环和 `for`-循环。例如，这里有一个简单的提示用户并返回布尔值的函数：\n\
  \n点击此此处查看代码图像\n\n```\nbool accept()\n{\n        cout << \"Do you want to proceed\
  \ (y or n)?\\n\";      // 写入问题\n        int answer = 0;                        \
  \       // 初始化为一个不会出现的值\n        cin >> answer;                               //\
  \ 读取答案\n\n        if (answer == 'y')\n                return true;\n        return\
  \ false;\n}\n```\n\n\n\n\n```cpp\nvoid action()\n{\n        while (true) {\n   \
  \              cout << \"enter action:\\n\";                    // 请求动作\n      \
  \           string act;\n                 cin >> act;                          \
  \                   // 将字符读入字符串\n                 Point delta {0,0};           \
  \                       // Point 存储一个 {x,y} 对\n\n                 for (char ch :\
  \ act) {\n                         switch (ch) {\n                         case\
  \ 'u':   // 上\n                         case 'n':   // 北\n                     \
  \            ++delta.y;\n                                 break;\n             \
  \            case 'r':    // 右\n                         case 'e':   // 东\n    \
  \                             ++delta.x;\n                                 break;\n\
  \                         // ... 更多动作 ...\n\n                         default:\n\
  \                                 cout << \"I freeze!\\n\";\n                  \
  \       }\n                         move(current+delta*scale);\n               \
  \          update_display();\n                 }\n        }\n}\n```\n\n就像 `for`-语句\
  \ (§1.7) 一样，`if`-语句也可以引入变量并对其进行测试。例如：\n\n点击此处查看代码图像\n\n```cpp\nvoid do_something(vector<int>&\
  \ v)\n{\n        if (auto n = v.size(); n!=0) {\n                // ... 如果 n!=0，我们就会到达这里\
  \ ...\n        }\n        // ...\n}\n```\n\n在这里，整数 `n` 被定义在 `if`-语句内部使用，并用 `v.size()`\
  \ 初始化，在分号后立即通过 `n!=0` 条件进行测试。在条件中声明的名称在 `if`-语句的两个分支中都是作用域内的。\n\n与 `for`-语句一样，在\
  \ `if`-语句的条件中声明名称的目的是限制变量的作用范围，以提高可读性并尽可能地减少错误。\n\n最常见的情况是测试变量是否与 `0`（或 `nullptr`）相等。要做到这一点，只需省略显式的条件描述。例如：\n\
  \n点击此处查看代码图像\n\n```cpp\nvoid do_something(vector<int>& v)\n{\n        if (auto n\
  \ = v.size()) {\n                // ... 如果 n!=0，我们就会到达这里 ...\n        }\n      \
  \  // ...\n}\n```\n\n尽可能倾向于使用这种更简洁、更简单的形式。\n\n## 1.9 映射到硬件\n\nC++ 提供了到硬件的直接映射。当你使用其中一种基本操作时，其实现是硬件所提供的，通常是单条机器指令。例如，两个\
  \ `int` 相加 `x+y` 会执行一条整数加法机器指令。\n\nC++ 实现将机器内存视为一系列内存位置，它可以在这些位置放置（带类型的）对象并使用指针对它们进行寻址：\n\
  \n![图像](img/f0017-01.jpg)\n\n指针在内存中被表示为机器地址，因此图中 `p` 的数值值将是 `103`。如果这看起来非常像数组 (§1.7)，那是因为数组是\
  \ C++ 对“内存中连续对象序列”的基本抽象。\n\n基础语言结构到硬件的简单映射，对于 C 和 C++ 几十年来所闻名的原始底层性能而言至关重要。C 和 C++\
  \ 的基本机器模型基于计算机硬件，而不是某种数学形式。\n\n### 1.9.1 赋值\n\n内置类型的赋值是一个简单的机器拷贝操作。考虑以下：\n\n点击此处查看代码图像\n\
  \n```cpp\nint x = 2;\nint y = 3;\nx = y;               // x 变成 3；所以我们得到 x==y\n```\n\
  \n这是显而易见的。我们可以像这样图形化地表示它：\n\n![图像](img/f0017-03.jpg)\n\n这两个对象是独立的。我们可以改变 `y` 的值而不影响\
  \ `x` 的值。例如，`x=99` 不改变 `y` 的值。与 Java、C# 等其他语言不同，但与 C 一样，这适用于所有类型，而不仅仅是 `int`。\n\n\
  如果我们希望不同的对象引用同一个（共享）值，我们必须明确说明。例如：\n\n点击此处查看代码图像\n\n```cpp\nint x = 2;\nint y =\
  \ 3;\nint* p = &x;\nint* q = &y;       // p!=q 且 *p!=*q\np = q;                //\
  \ p 变成 &y；现在 p==q，所以显然 *p==*q\n```\n\n我们可以像这样图形化地表示它：\n\n![图像](img/f0017-05.jpg)\n\
  \n我任意选择了 `88` 和 `92` 作为 `int` 的地址。再次，我们可以看到被赋值的对象从被赋值的对象获取值，产生两个具有相同值的独立对象（这里是指针）。这意味着\
  \ `p=q` 导致 `p==q`。在 `p=q` 之后，两个指针都指向 `y`。\n\n引用和指针都引用/指向一个对象，并且在内存中都被表示为机器地址。然而，使用它们的语言规则不同。\n\
  \n### 1.9.2 初始化\n\n初始化与赋值不同。通常，为了使赋值生效，被赋值的对象必须有一个值。相反，初始化的任务是将未初始化的内存变为一个有效对象。对于几乎所有类型，从未定义的变量读取或向其写入的结果都是未定义的。考虑引用：\n\
  \n```cpp\nint x = 7;\nint y = 3;\nint& r = x;         // 将 r 绑定到 x (r 引用 x)\nr =\
  \ y;               // 赋值给 r 引用的对象\n\nint& r2;            // 错误：未初始化\nr2 = 99;  \
  \          // 赋值给 r2 引用的任何\n```\n\n你可以使用 `=` 初始化引用，但不要让这困扰你。例如：\n\n点击此处查看代码图像\n\n\
  ```cpp\nint& r = x;        // 将 r 绑定到 x (r 引用 x)\n```\n\n这仍然是初始化并将 `r` 绑定到 `x`，而不是值的拷贝。\n\
