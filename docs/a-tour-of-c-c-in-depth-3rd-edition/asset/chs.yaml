  -   [13] 默认情况下 `>>` 会跳过初始空白字符；§11.3.\n\n-   [14] 使用流状态 `fail` 来处理可能恢复的 I/O 错误；§11.4.\n\
  \n-   [15] 我们可以为我们自己的类型定义 `<<` 和 `>>` 运算符；§11.5.\n\n-   [16] 我们不需要修改 `istream` 或\
  \ `ostream` 来添加新的 `<<` 和 `>>` 运算符；§11.5.\n\n-   [17] 使用操纵符（manipulators）或 `format()`\
  \ 来控制格式化；§11.6.1, §11.6.2.\n\n-   [18] `precision()` 规范适用于所有后续的浮点输出操作；§11.6.1.\n\
  \n-   [19] 浮点格式规范（例如，`scientific`）适用于所有后续的浮点输出操作；§11.6.1.\n\n-   [20] 使用标准操纵符时包含\
  \ `<ios>` 或 `<iostream>`；§11.6.\n\n-   [21] 流格式化操纵符是“粘性”的（sticky），一旦设置后可应用于流中的多个值；§11.6.1.\n\
  \n-   [22] 使用带参数的标准操纵符时包含 `<iomanip>`；§11.6.\n\n-   [23] 我们可以以标准格式输出时间、日期等；§11.6.1,\
  \ §11.6.2.\n\n-   [24] 不要尝试拷贝流：流是仅支持移动（move only）的；§11.7.\n\n-   [25] 在在使用文件流之前，记得检查文件流是否已连接到文件；§11.7.2.\n\
  \n-   [26] 使用 `stringstream` 或内存流进行内存中的格式化；§11.7.3; §11.7.4.\n\n-   [27] 我们可以在任何两个具有字符串表示的类型之间定义转换；§11.7.3.\n\
  \n-   [28] C 风格 I/O 不是类型安全的；§11.8.\n\n-   [29] 除非你使用 printf 族函数，否则调用 `ios_base::sync_with_stdio(false)`；§11.8.\n\
  \n-   [30] 使用标准操纵符时，包含 `<iostream>`；[CG: SL.io.10]。\n\n\n\n\n\n该函数从标准输入读取 `Entry`\
  \ 并存入 `phone_book`，直到遇到输入结束（例如文件末尾）或输入操作遇到格式错误。\n\n标准库中的 `vector` 的实现方式使得通过重复调用\
  \ `push_back()` 来扩展 `vector` 是高效的。为了演示这一点，考虑使用上图所示的表示法，对第 5 章和第 7 章中的简单 `Vector`\
  \ 进行详细说明：\n\n点击此处查看代码图像\n\n```\ntemplate<typename T>\nclass Vector {\n       allocator<T>\
  \ alloc;    // 为 Ts 分配空间的标准库分配器\n       T* elem;                     // 指向第一个元素的指针\n\
  \       T* space;                   // 指向第一个未使用（未初始化）槽位的指针\n       T* last;    \
  \                   // 指向最后一个槽位的指针\npublic:\n       // ...\n       int size() const\
  \ { return space-elem; }            // 元素数量\n       int capacity() const { return\
  \ last-elem; }        // 可用于元素的槽位数量\n       // ...\n       void reserve(int newsz);\
  \                         // 将 capacity() 增加到 newsz\n       // ...\n       void\
  \ push_back(const T& t);                 // 将 t 拷贝到 Vector\n       void push_back(T&&\
  \ t);                         // 将 t 移动到 Vector\n};\n```\n\n标准库 `vector` 拥有 `capacity()`、`reserve()`\
  \ 和 `push_back()` 成员。`vector`的用户和其他 `vector` 成员使用 `reserve()` 为更多元素留出空间。它可能需要分配新内存，当这样做时，它会将元素移动到新的分配空间。当\
  \ `reserve()` 将元素移动到新的更大的空间时，任何指向这些元素的指针现在将指向错误的位置；它们已经失效（`invalidated`）且不应被使用。\n\
  \n有了 `capacity()` 和 `reserve()`，实现 `push_back()` 是轻而易见的：\n\n点击此处查看代码图像\n\n```\n\
  template<typename T>\nvoid Vector<T>::push_back(const T& t)\n{\n        if (capacity()<=size())\
  \                         // 确保我们有空间存放 t\n                 reserve(size()==0?8:2*size());\
  \  // 容量翻倍\n        construct_at(space,t);                       // 初始化 *space 为\
  \ t (\"将 t 置于 space\")\n        ++space;\n}\n```\n\n现在，元素的分配和重定位发生并不频繁。我以前使用 `reserve()`\
  \ 来尝试提高性能，但事实证明那是徒用功：`vector` 使用的启发式算法平均比我的猜测要好，因此现在只有当我想要使用元素指针时，我才会显式地使用 `reserve()`\
  \ 以避免元素的重新分配。\n\n`vector` 可以在赋值和初始化中进行拷贝。例如：\n\n点击此处查看代码图像\n\n```\nvector<Entry>\
  \ book2 = phone_book;\n```\n\n`vector` 的拷贝和移动是通过构造函数和赋值运算符实现的，如 § 6.2 节 所示。赋值一个\
  \ `vector` 涉及拷贝它的元素。因此，在 `book2` 初始化后，`book2` 和 `phone_book` 持有电话簿中每个 `Entry` 的独立副本。当\
  \ `vector` 包含许多元素时，这种看似无的赋值和初始化可能是昂贵的。在不希望拷贝的情况下，应该使用引用或指针 (§ 1.7 节) 或移动操作 (§ 6.2.2\
  \ 节)。\n\n标准库 `vector` 非常灵活且高效。将其作为你的默认容器；即，除非你有充分理由使用其他容器，否则就使用它。如果你因为对“效率”有模糊的顾虑而避免\
  \ `vector`，请进行测量。在容器使用的性能方面，我们的直觉是最容易出错的。\n\n## 12.2.1 元素\n\n与所有标准库容器一样，`vector`\
  \ 是某种类型 `T` 元素的容器，即 `vector<T>`。几乎任何类型都可以胜任元素类型：内置数值类型（如 `char`、`int` 和 `double`）、用户定义类型（如\
  \ `string`、`Entry`、`list<int>` 和 `Matrix<double,2>`）以及指针（如 `const char*`、`Shape*`\
  \ 和 `double*`）。当你插入一个新元素时，其值会被拷贝到容器中。例如，当你将一个值为 `7` 的整数放入容器时，结果元素的值确实为 `7`。该元素不是指向某个包含\
  \ `7` 的对象的引用或指针。这使得容器既良好又紧凑且访问速度快。对于关心内存大小和运行时性能的人来说，这是至关重要的。\n\n如果你有一个依赖 `virtual`\
  \ 函数获取多态行为的类体系 (§ 5.5 节)，不要直接在容器中存储对象。而是存储指针（或智能指针；§ 15.2.1 节）。例如：\n\n点击此处查看代码图像\n\
  \n```\nvector<Shape> vs;                              // 不，见 §5.5\nvector<unique_ptr<Shape>>\
  \ vups;               // OK，见 §5.5\n```\n\n### 12.2.2 范围检查\n\n标准库 `vector` 不保证范围检查。例如：\n\
  \n点击此处查看代码图像\n\n```\nvoid silly(vector<Entry>& book)\n{\n        int i = book[book.size()];\
  \                   // 越界\n        // ...\n}\n```\n\n这种初始化可能会给 `i` 赋值值而不是报错。这是不可接受的，因此我经常使用\
  \ `vector` 的简单范围检查适配版本：\n\n点击此处查看代码图像\n\n```\ntemplate<typename T>\nstruct Vec :\
  \ vector<T> {\n         using vector<T>::vector;                  // 使用构造函数\n\n\
  \         T& operator[](int i) { return vector::at(i); }             // 范围检查\n \
  \        const T& operator[](int i) const { return vector::at(i); }   // 范围检查\n\n\
  \         auto begin() { return Checked_iter(begin(), end())};      // 见 §13.1\n\
  \         auto end() { return Checked_iter(end(), end()); }            // 小心使用 end()\n\
  };\n```\n\n`Vec` 除了为了范围检查而重定义的下标操作外，继承了 `vector` 的所有内容。`at()` 操作是一个下标操作，如果参数超出 `vector`\
  \ 的范围，将抛出 `out_of_range` 异常 (§ 4.2 节)。\n\n对于 `Vec`，越界访问将抛出一个可以捕获的异常。例如：\n\n点击此处查看代码图像\n\
  \n```\nvoid checked(Vec<Entry>& book)\n{\n        try {\n                  book[book.size()]\
  \ = {\"Joe\",99999};       // 将抛出异常\n                  // ...\n        }\n     \
  \   catch (out_of_range&) {\n                 cerr << \"range error\\n\";\n    \
  \    }\n}\n```\n\n异常将被抛出并被捕获 (§ 4.2 节)。如果用户不捕获异常，程序将以定义的方式终止，而不是继续执行或以未定义的方式失败。减少未捕获异常带来的意外的方法之一是使用带有\
  \ `try` 块作为体的 `main()`。例如：\n\n点击此处查看代码图像\n\n```\nint main()\ntry {\n          //\
  \ 你的代码\n}\n\ncatch (out_of_range&) {\n         cerr << \"range error\\n\";\n}\n\
  catch (...) {\n         cerr << \"unknown exception thrown\\n\";\n}\n```\n\n这提供了默认的异常处理器，以便如果我们未能捕获某些异常，错误信息将打印在标准错误诊断输出流\
  \ `cerr` 上 (§ 11.2 节)。\n\n\n\n\n\n为什么标准不进行范围检查呢？许多对性能敏感的应用程序使用 `vector`，而检查所有的下标访问会带来大约\
  \ 10% 的开销。显然，这种开销会根据硬件、优化器以及应用程序对下标的使用而产生巨大差异。然而，经验表明，这种开销会导致人们倾向于使用远不安全的内置数组。仅仅是对这种开销的恐惧也可能导致人们弃用。至少\
  \ `vector` 在调试时可以很容易进行范围检查，我们可以在未检查的默认版本之上构建带检查的版本。\n\n范围 `for` 循环通过隐式访问范围内的所有元素，以零成本规避了范围错误。只要参数有效，标准库算法也会执行相同的操作以确保没有范围错误。\n\
  \n如果你在代码中直接使用 `vector::at()`，则不需要我的 `Vec` 变通方案。此外，某些标准库提供了带范围检查的 `vector` 实现，它们提供的检查比\
  \ `Vec` 更完整。\n\n## 12.3 list\n\n标准库提供了一种名为 `list` 的双向链表：\n\n![Images](img/f0162-02.jpg)\n\
  \n当我们希望在不移动其他元素的情况下插入和删除元素时，我们使用 `list` 来处理序列。电话录条目的插入和删除可能是很常见的，因此 `list` 可能适用于表示一个简单的电话录。例如：\n\
  \n点击此处查看代码图像\n\n```\nlist<Entry> phone_book = {\n         {\"David Hume\",123456},\n\
  \         {\"Karl Popper\",234567},\n         {\"Bertrand Arthur William Russell\"\
  ,345678}\n};\n```\n\n当我们使用链表时，往往不会像像处理 `vector` 那样通过下标来访问元素。相反，我们可能会搜索列表以寻找具有给定值的元素。为了做到这一点，我们利用了\
  \ `list` 是 第 13 章 中描述的序列这一事实：\n\n点击此处查看代码图像\n\n```\nint get_number(const string&\
  \ s)\n{\n          for (const auto& x : phone_book)\n                   if (x.name==s)\n\
  \                          return x.number;\n          return 0;  // 使用 0 表示“未找到号码”\n\
  }\n```\n\n对 `s` 的搜索从列表开始，直到找到 `s` 或到达 `phone_book` 的末尾。\n\n有时，我们需要识别 `list` 中的某个元素。例如，我们可能想要删除一个元素或在它之前插入一个新元素。为了这样做，我们使用迭代器（`iterator`）：`list`\
  \ 迭代器识别 `list` 中的元素并可以用于遍历 `list`（因此得此名）。每个标准库容器都提供了 `begin()` 和 `end()` 函数，它们分别返回指向第一个元素和指向最后一个元素之后元素的迭代器（§13.1）。通过显式使用迭代器，我们可以——虽然没那么优雅——像这样写\
  \ `get_number()` 函数：\n\n点击此处查看代码图像\n\n```\nint get_number(const string& s)\n{\n\
  \         for (auto p = phone_book.begin(); p!=phone_book.end(); ++p)\n        \
  \         if (p->name==s)\n                         return p->number;\n        \
  \ return 0;  // 使用 0 表示“未找到号码”\n}\n```\n\n事实上，这大致是编译器实现更简洁且不易出错的范围 `for` 循环的方式。给定一个迭代器\
  \ `p`，`*p` 是它所指的元素，`++p` 使 `p` 进指向下一个元素，而当 `p` 指向一个带有成员 `m` 的类时，`p->m` 等同于 `(*p).m`。\n\
  \n向 `list` 添加元素和从 `list` 移除元素是简单的：\n\n点击此处查看代码图像\n\n```\nvoid f(const Entry& ee,\
  \ list<Entry>::iterator p, list<Entry>::iterator q)\n{\n         phone_book.insert(p,ee);\
  \      // 在 p 指向的元素之前添加 ee\n         phone_book.erase(q);           // 移除 q 指向的元素\n\
  }\n```\n\n对于 `list`，`insert(p,elem)` 在 `p` 指向的元素之前插入一个值 `elem` 的拷贝元素。这里，`p` 可能是一个指向\
  \ `list` 尾之后的迭代器。相反，`erase(p)` 移除 `p` 指向的元素并将其销毁。\n\n这些 `list` 示例可以使用 `vector` 相同编写，而且令人惊讶的是（除非你理解机器架构），使用\
  \ `vector` 的性能通常比 `list` 好。当我们只需要一个元素序列时，我们可以在 `vector` 和 `list` 之间进行选择。除非你有理由不使用，否则请使用\
  \ `vector`。`vector` 在遍历（例如 `find()` 和 `count()`）以及排序和搜索（例如 `sort()` 和 `equal_range()`）方面的性能更好。\n\
  \n## 12.4 forward_list\n\n标准库提供了一种名为 `forward_list` 的单链表：\n\n![Images](img/f0164-01.jpg)\n\
  \n`forward_list` 与 `list` 的区别在于它不提供指向前一个元素的指针。这意味着 `forward_list` 只能向一个方向进行遍历。它占用的内存也比\
  \ `list` 少。\n\n## 12.5 map\n\n标准库提供了一种名为 `map` 的平衡二搜索树：\n\n![Images](img/f0164-02.jpg)\n\
  \n在其他上下文中，`map` 被称为关联数组或字典。标准库提供了一种名为 `map` 的平衡二搜索树（通常是红黑树）：\n\n![Images](img/f0164-03.jpg)\n\
  \n## 12.6 unordered_map\n\n标准库提供了一种名为 `unordered_map` 的哈希表容器：\n\n![Images](img/f0165-02.jpg)\n\
  \n\n\n\n就像 `map` 一样，我们可以对 `unordered_map` 进行下标索引：\n\n点击此处查看代码图\n\n```\nint get_number(const\
  \ string& s)\n{\n         return phone_book[s];\n}\n```\n\n标准库为 `string` 以及其他内置和标准库类型提供了默认哈希函数。如果需要，我们可以提供自己的哈希函数。可能对自定义哈希函数最常见的需求出现在我们想要为自己定义的某种类型创建一个无序容器（unordered\
  \ container）时。哈希函数通常实现为一个函数对象（§7.3.2）。例如：\n\n点击此处查看代码图\n\n```\nstruct Record {\n\
  \         string name;\n         int product_code;\n         // ...\n};\n\nbool\
  \ operator==(const Record&, const Record&) { /* ... */ }\n\nstruct Rhash {     \
  \      // 用于 Record 的哈希函数\n         size_t operator()(const Record& r) const\n \
  \        {\n                   return hash<string>()(r.name) ^ hash<int>()(r.product_code);\n\
  \         }\n};\n\nunordered_set<Record,Rhash> my_set; // 使用 Rhash 查找的 Records 集合\n\
  ```\n\n我们可以通过将 `hash` 操作定义为标准库 `hash` 的特化，来避免显式地传递 `hash` 操作：\n\n点击此处查看代码图\n\n```\n\
  namespace std {                // 为 Record 一个哈希函数\n\n        template<> struct hash<Record>\
  \ {\n                using argument_type = Record;\n                using result_type\
  \ = size_t;\n\n                result_type operator()(const Record& r) const\n \
  \               {\n                        return hash<string>()(r.name) ^ hash<int>()(r.product_code);\n\
  \                }\n        };\n}\n```\n\n注意 `map` 和 `unordered_map` 之间的区别：\n\n\
  *   `map` 需要一个排序函数（默认为 `<`）并产生一个有序序列。\n*   `unordered_map` 需要一个相等函数（默认为 `==`）；它在元素元素之间不维护顺序。\n\
  \n给定一个良好的哈希函数，对于大型容器，`unordered_map` 比 `map` 快得多。然而，如果使用糟糕的哈希函数，`unordered_map`\
  \ 的最坏情况行为比 `map` 要差得多。\n\n## 12.7 分配器 (Allocators)\n\n默认情况下，标准库容器使用 `new` 分配空间。`new`\
  \ 和 `delete` 操作符提供了一个通用的自由存储（也称为动态内存或堆），它可以存放任意大小和由用户控制生命周期的对象。这意味着在许多特殊情况下可以消除时间争空间开销。因此，标准库容器提供了在需要时安装具有特定语义的分配器的机会。这被用于解决与性能（例如池分配器\
  \ pool allocators）、安全（作为删除操作一部分清理内存的分配器）、每线程分配以及非均匀内存架构（在特定内存中分配以匹配的指针类型）相关的广泛问题。这里不是讨论这些重要但非常专业且通常高级的技术的地方。不过，我将提供一个由现实问题启发的例子，在该问题中池分配器是解决方案。\n\
  \n一个重要的长时间运行的系统使用事件队列（见§18.4），使用 `vector` 作为事件并通过 `shared_ptr` 传递。这样一来，事件的最后一个用户就会隐式地删除它：\n\
  \n点击此处查看代码图\n\n```\nstruct Event {\n          vector<int> data = vector<int>(512);\n\
  };\n\nlist<shared_ptr<Event>> q;\n\nvoid producer()\n{\n        for (int n = 0;\
  \ n!=LOTS; ++n) {\n                 lock_guard lk {m};            // m 是互斥锁；见 §18.3\n\
  \                 q.push_back(make_shared<Event>());\n                 cv.notify_one();\
  \                 // cv 是条件变量；见 §18.4\n        }\n}\n```\n\n从逻辑角度来看，这运行得很好。它在逻辑上很简单，因此代码是健壮且可维护的。遗憾的是，这导致了严重的内存碎片。在\
  \ 16 个生产者和 4 个消费者之间传递了 100,000 个事件后，消耗了超过 6GB 的内存。\n\n解决碎片问题的传统方案是重写代码使用池分配器。池分配器是一种管理单一固定大小对象的分配器，它一次为多个对象分配空间，而不是使用单独的分配。幸运的是，C++\
  \ 对此提供了直接支持。池分配器定义在 `std` 的 `pmr`（多态内存资源）子命名空间中：\n\n点击此处查看代码图\n\n```\npmr::synchronized_pool_resource\
  \ pool; // 创建池\n\nstruct Event {\n          pmr::vector<int> data = pmr::vector<int>(512,\
  \ &pool);\n};\n\npmr::list<shared_ptr<Event>> q{pool}; // 让 q 使用池\n\nvoid producer()\n\
  {\n        for (int n = 0; n!=LOTS; ++n) {\n                 lock_guard lk{m}; \
  \           // m 是互斥锁；见 §18.3\n                 q.push_back(make_shared<Event>());\n\
  \                 cv.notify_one();                 // cv 是条件变量；见 §18.4\n       \
  \ }\n}\n```\n\n现在，在 16 个生产者和 4 个消费者之间传递了 100,000 个事件后，消耗了不到 3MB 的内存。这改进了 2000 倍！\n\
  \n容器默认使用 `new` 和 `delete`。其他多态资源包括：\n\n*   `unsynchronized_polymorphic_resource`；类似于\
  \ `polymorphic_resource` 但只能由一个线程使用。\n*   `monotonic_polymorphic_resource`；在析构时释放内存。\n\
  \n多态资源必须派自 `memory_resource` 并定义 `allocate()`、`deallocate()` 和 `is_equal()`。其理念是让用户构建自己的资源。\n\
  \n## 12.8 容器概述 (Container Overview)\n\n标准库提供了一些最通用且实用的容器类型，以便程序员选择最符合应用程序需求的容器：\n\
  \n| **标准容器摘要** |\n| --- |\n| `vector<T>` | 变长向量 (§12.2) |\n| `list<T>` | 双向链表 (§12.3)\
  \ |\n| `forward_list<T>` | 单向链表 |\n| `deque<T>` | 双端队列 |\n| `map<K,V>` | 关联数组 (§12.5)\
  \ |\n| `multimap<K,V>` | 键可以出现多次的映射 |\n| `unordered_map<K,V>` | 使用哈希查找的映射 (§12.6)\
  \ |\n| `unordered_multimap<K,V>` | 使用哈希查找的多映射 |\n| `set<T>` | 集合（只有键没有值的映射） |\n\
  | `multiset<T>` | 元素可以出现多次的集合 |\n| `unordered_set<T>` | 使用哈希查找的集合 |\n| `unordered_multiset<T>`\
  \ | 使用哈希查找的多重集合 |\n\n无序容器针对键（通常是字符串）的查找进行了优化；换句话说，它们是哈希表。\n\n\n\n\n容器定义在 `std` 命名空间中，并在\
  \ `<vector>`、`<list>`、`<map>` 等头文件中给出 (§9.3.4)。此外，标准库还提供了容器适配器 `queue<T>`、`stack<T>`\
  \ 和 `priority_queue<T>`。如果需要，请查阅这些内容。标准库还提供了更专门的类容器类型，例如 `array<T,N>` (§15.3.1)\
  \ 和 `bitset<N>` (§15.3.2)。\n\n标准容器及其基本操作在表示法上被设计为相似的。此外，这些操作对于各种容器来说是等价的。基本操作适用于所有具有意义且能够高效实现的每种容器：\n\
  \n| 标准容器操作（部分列举） |\n| --- |\n| `value_type` | 元素的类型 |\n| `p=c.begin()` | `p` 指向\
  \ `c` 的第一个元素；对于 `const` 迭代器使用 `cbegin()` |\n| `p=c.end()` | `p` 指向 `c` 最后一个元素的下一个位置；对于\
  \ `const` 迭代器使用 `cend()` |\n| `k=c.size()` | `k` 是 `c` 中元素的数量 |\n| `c.empty()` |\
  \ `c` 是否为空？ |\n| `k=c.capacity()` | `k` 是 `c` 在不重新分配内存的情况下可以容纳的元素数量 |\n| `c.reserve(k)`\
  \ | 将容量增加到 `k`；如果 `k<=c.capacity()`，则 `c.reserve(k)` 不执行操作 |\n| `c.resize(k)` |\
  \ 使元素数量变为 `k`；新增的元素具有默认值 `value_type{}` |\n| `c[k]` | `c` 的第 `k` 个元素；基于 0 计数；不保证范围检查\
  \ |\n| `c.at(k)` | `c` 的第 `k` 个元素；如果超出范围，则抛出 `out_of_range` |\n| `c.push_back(x)`\
  \ | 在 `c` 的末尾添加 `x`；将 `c` 的大小增加一 |\n| `c.emplace_back(a)` | 在 `c` 的末尾添加 `value_type{a}`；将\
  \ `c` 的大小增加一 |\n| `q=c.insert(p,x)` | 在 `c` 中 `p` 之前添加 `x` |\n| `q=c.erase(p)` |\
  \ 从 `c` 中移除 `p` 处的元素 |\n| `c=c2` | 赋值：从 `c2` 拷贝所有元素到 `c`使得 `c==c2` |\n| `b=(c==c2)`\
  \ | `c` 和 `c2` 所有元素的相等性；如果相等则 `b==true` |\n| `x=(c<=>c2)` | `c` 和 `c2` 的字典序：如果 `c`\
  \ 小于 `c2` 则 `x<0`，相等则 `x==0`，大于 `c2` 则 `0<x`。`!=`、`<`、`<=`、`>` 和 `>=` 均 `<=>` 生成\
  \ |\n\n这种表示法和语义的统一性使得程序员能够提供新的容器类型，并以与标准容器非常相似的方式使用。范围检查的 vector `Vector` (§4.3,\
  \ 第 5 章) 就是这样一个例子。容器接口的统一性允许我们独立于具体的容器类型来指定算法。然而，每个容器都有优缺点。例如，对 `vector` 进行下标索引和遍历是廉价且简单的。另一方面，当我们插入或删除元素时，`vector`\
  \ 元素会被移动到不同的位置；`list` 则具有相反的属性。请注意，对于小型元素的短序列，`vector` 通常比 `list` 更高效（即使对于 `insert()`\
  \ 和 `erase()` 也是如此）。我建议将标准库 `vector` 作为元素序列的默认类型：除非你有理由选择其他。\n\n考虑单向链表 `forward_list`，这是一种针对空序列优化的容器\
  \ (§12.3)。一个空的 `forward_list` 仅占用一个字（word），而一个空的 `vector` 占用三个字。空序列以及仅只有一个或两个元素的序列意想不到地常见且有用。\n\
  \n`emplace` 操作（如 `emplace_back()`）接收元素构造函数的参数，并在容器中新分配的空间内构建对象，而不是将对象拷贝到容器中。例如，对于\
  \ `vector<pair<int,string>>`，我们可以这样写：\n\n```\nv.push_back(pair{1,\"copy or move\"\
  });      // 创建一个 pair 并将其移动到 v\nv.emplace_back(1,\"build in place\");          //\
  \ 在 v 中直接构建 pair\n```\n\n对于此类简单示例，优化可能会使两次调用具有等效的性能。\n\n## 12.9 建议\n\n[1] STL 容器定义了一个序列；§12.2。\n\
  [2] STL 容器是资源句柄；§12.2, §12.3, §12.5。\n[3] 使用 `vector` 作为默认容器；§12.2, §12.6。\n[4]\
  \ 对于容器的简单遍历，使用 `range-for` 循环或 `begin/end` 迭代器；§12.2, §12.3。\n[5] 使用 `reserve()`\
  \ 避免迭代器失效；§12.2。\n[6] 不要假设能从 `reserve()` 中获得性能；§12.2。\n[7] 对容器使用 `push_back()` 或\
  \ `resize()` 而不是 `realloc()`；§12.2。\n[8] 不要假设 `[]` 有范围检查；§12.2。\n[9] 当需要范围检查时使用\
  \ `at()`；§12.2。\n[10] 使用 `range-for` 和标准库算法来避免范围错误；§12.2。\n[11] 元素被拷贝到容器；§12.1。\n\
  [12] 为了保持元素的多态性，存储指针；§12.1。\n[13] 插入操作（如 `insert()` 和 `push_back()`）在 `vector` 上通常是高效的；§12.3。\n\
  [14] 对于通常为空的序列使用 `forward_list`；§12.8。\n[15] 涉及到性能，不要相信你的直觉：要测量；§12.2。\n[16] `map`\
  \ 通常实现为红黑树；§12.5。\n[17] `unordered_map` 是哈希表；§12.6。\n[18] 按引用传递容器，按值返回容器；§12.2。\n\
  [19] 对于容器，使用 `()` 初始化语法指定大小，使用 `{}` 初始化语法指定元素；§5.2.3, §12.2。\n[20] 优先使用紧凑的数据结构；§12.3。\n\
  [21] `list` 的遍历相对昂贵；§12.3。\n[22] 如果需要对大量数据进行快速查找，使用无序容器；§12.6。\n[23] 如果需要按照顺序遍历元素，使用有序容器（如\
  \ `map` 和 `set`）；§12.5。\n[24] 对于没有自然顺序（即没有合理的 `<`）的元素类型，使用无序容器（如 `unordered_map`）；§12.5。\n\
  [25] 当需要在容器大小变化时保持指针稳定时，使用关联容器；§12.8。\n[26] 通过实验来检查你是否有一个可接受的哈希函数；§12.6。\n[27] 通过异或运算符\
  \ (`^`) 组合元素的标准哈希函数得到的哈希函数通常是好的；§12.6。\n[28] 了解标准库容器，并优先使用它们而不是手工构造的数据结构；§12.8。\n\
  [29] 如果你的应用程序遭受内存相关的性能问题，尽量减少空堆的使用并/或考虑使用专门的分配器；§12.7。\n\n\n\n\n\n# 引言\n## 迭代器的用法\n\
  ## 迭代器类型\n### 流迭代器\n## 谓词的使用\n## 算法概述\n## 并行算法\n## 建议\n\n## 13.1 引言\n\n一个数据结构（如\
  \ `list` 或 `vector`）本身的用处并不大。要使用它，我们需要基本访问的操作，例如添加和删除元素（如 `list` 和 `vector` 已经提供的那些操作）。此外，我们很少仅仅在容器中存储对象。我们还会对它们进行排序、打印、提取子集、删除元素、搜索对象等。因此，标准库在提供最常见的容器类型之外，还为容器提供了最常用的算法。例如，我们可以简单且高效地对\
  \ `Entry` 的 `vector` 进行排序，并将每个唯一 `vector` 元素的拷贝放入 `list` 中：\n\n点击此处查看代码图片\n\n```cpp\n\
  void f(vector<Entry>& vec, list<Entry>& lst)\n{\n         sort(vec.begin(),vec.end());\
  \                                          // 使用 < 进行排序\n         unique_copy(vec.begin(),vec.end(),lst.begin());\
  \         // 不拷贝相邻的相等元素\n}\n```\n\n为了使此代码工作，必须为 `Entry` 定义小于（`<`）和等于（`==`）。例如：\n\
  \n点击此处查看代码图片\n\n```cpp\nbool operator<(const Entry& x, const Entry& y)       //\
  \ 小\n{\n         return x.name<y.name;             // 按名称对 Entries 排序\n}\n```\n\n\
  标准算法是根据元素的（半开）序列表达的。`sequence`（序列）由一对迭代器表示，指定第一个元素和最后一个元素之后的元素：\n\n![Images](img/f0174-02.jpg)\n\
  \n在示例中，`sort()` 对由迭代器对 `vec.begin()` 和 `vec.end()` 定义的序列进行排序，这组元素恰好是 `vector` 的所有元素。对于写入（输出），我们只需要指定要写入的第一个元素。如果写入了多个元素，该初始元素之后的元素将被覆盖。因此，为了避免错误，`lst`\
  \ 拥元素数量至少要与 `vec` 中唯一值的数量一样多。\n\n遗憾的是，标准库没有提供支持向容器进行范围检查写入的抽象。但是，我们可以自己定义一个：\n\n\
  点击此处查看代码图片\n\n```cpp\ntemplate<typename C>\nclass Checked_iter {\npublic:\n    \
  \     using value_type = typename C::value_type;\n         using difference_type\
  \ = int;\n\n         Checked_iter() { throw Missing_container{}; } // 前向迭代器概念需要默认构造函数\n\
  \         Checked_iter(C& cc) : pc{ &cc } {}\n         Checked_iter(C& cc, typename\
  \ C::iterator pp) : pc{ &cc }, p{ pp } {}\n\n         Checked_iter& operator++()\
  \ { check_end(); ++p; return *this; }\n         Checked_iter operator++(int) { check_end();\
  \ auto t{ *this }; ++p; return t; }\n         value_type& operator*() const { check_end();\
  \ return *p; }\n\n         bool operator==(const Checked_iter& a) const { return\
  \ p==a.p; }\n         bool operator!=(const Checked_iter& a) const { return p!=a.p;\
  \ }\nprivate:\n         void check_end() const { if (p == pc->end()) throw Overflow{};\
  \ }\n         C* pc {}; // 初始化为 nullptr\n         typename C::iterator p = pc->begin();\n\
  };\n```\n\n显然，这并不是标准库级别的质量，但它展示了思路：\n\n点击此处查看代码图片\n\n```cpp\nvector<int> v1 {1,\
  \ 2, 3};            // 三元素\nvector<int> v2(2);                              // 两元素\n\
  \ncopy(v1,v2.begin());                          // 会溢出\ncopy(v1,Checked_iter{v2});\
  \             // 会抛出异常\n```\n\n如果在“读取并排序”的示例中，我们想要将唯一元素放入一个新的 `list` 中，我们可以这样写：\n\
  \n点击此处查看代码图片\n\n```cpp\nlist<Entry> f(vector<Entry>& vec)\n{\n         list<Entry>\
  \ res;\n         sort(vec.begin(),vec.end());\n         unique_copy(vec.begin(),vec.end(),back_inserter(res));\
  \           // 追加到 res\n         return res;\n}\n```\n\n调用 `back_inserter(res)`\
  \ 为 `res` 构建了一个迭代器。\n\n## 13.2 迭代器的用法\n\n对于容器，可以获取几个迭代器；`begin()` 和 `end()` 是此最好的例子。\n\
  \n像许多标准库搜索算法一样，`find` 返回 `end()` 表示“未找到”。`has_c()` 的等效短定义为：\n\n点击此处查看代码图片\n\n```cpp\n\
  bool has_c(const string& s, char c)           // s 是否包含该字符？\n{\n        return find(s,c)!=s.end();\n\
  }\n```\n\n一个更有趣的练习是查找字符串中所有出现字符的位置。我们可以返回一组 `vector<char*>`。返回 `vector` 是高效的，因为\
  \ `vector` 提供了移动语义。假设我们想要修改找到的位置，我们传递一个非常量字符串：\n\n点击此处查看代码图片\n\n```cpp\nvector<string::iterator>\
  \ find_all(string& s, char c)          // 查找 s 中所有 c 的位置\n{\n          vector<char*>\
  \ res;\n          for (auto p = s.begin(); p!=s.end(); ++p)\n                  \
  \ if (*p==c)\n                           res.push_back(&*p);\n          return res;\n\
  }\n```\n\n我们使用常规循环遍历字符串，使用 `++` 将迭代器 `p` 向移动一个元素，并使用解引用运算符查看元素。我们可以这样测试 `find_all()`：\n\
  \n点击此处查看代码图片\n\n```cpp\nvoid test()\n{\n         string m {\"Mary had a little lamb\"\
  };\n         for (auto p : find_all(m, a ))\n                  if (*p!= a )\n  \
  \                        cerr << \"a bug!\\n\";\n}\n```\n\n\n\n\n\n迭代器和标准算法在所有可以使用它们的标准容器上工作都是等价的。因此，我们可以对\
  \ `find_all()` 进行泛化：\n\n点击此处查看代码图片\n\n```cpp\ntemplate<typename C, typename V>\n\
  vector<typename C::iterator> find_all(C& c, V v)           // find all occurrences\
  \ of v in c\n{\n         vector<typename C::iterator> res;\n         for (auto p\
  \ = c.begin(); p!=c.end(); ++p)\n                 if (*p==v)\n                 \
  \        res.push_back(p);\n         return res;\n}\n```\n\n使用 `typename` 是为了告知编译器\
  \ `C` 的 `iterator` 应该是一个类型，而不是某个类型的值（例如整数 `7`）。\n\n另一种，我们也可以返回一个指向元素的普通指针 `vector`：\n\
  \n点击此处查看代码图片\n\n```cpp\ntemplate<typename C, typename V>\nauto find_all(C& c, V\
  \ v)           // find all occurrences of v in c\n{\n        vector<range_value_t<C>*>\
  \ res;\n        for (auto& x : c)\n                  if (x==v)\n               \
  \            res.push_back(&x);\n        return res;\n}\n```\n\n顺便，我还通过使用范围 `for`\
  \ 循环和标准库的 `range_value_t` (16.4.4) 来命名元素类型简化了代码。`range_value_t` 的简化版本可以这样定义：\n\n\
  点击此处查看代码图片\n\n```cpp\ntemplate<typename T>\nusing range_value_type_t = T::value_type;\n\
  ```\n\n使用上述版本的 `find_all()`，我们编写：\n\n点击此处查看代码图片\n\n```cpp\nvoid test()\n{\n    \
  \     string m {\"Mary had a little lamb\"};\n\n         for (auto p : find_all(m,\
  \ a ))                              // p is a string::iterator\n               \
  \   if (*p!= a )\n                          cerr << \"string bug!\\n\";\n\n    \
  \     list<int> ld {1, 2, 3, 1, -11, 2};\n         for (auto p : find_all(ld,1))\
  \                               // p is a list<int>::iterator\n                \
  \  if (*p!=1)\n                          cerr << \"list bug!\\n\";\n\n         vector<string>\
  \ vs {\"red\", \"blue\", \"green\", \"green\", \"orange\", \"green\"};\n       \
  \  for (auto p : find_all(vs,\"red\"))                  // p is a vector<string>::iterator\n\
  \                  if (*p!=\"red\")\n                          cerr << \"vector\
  \ bug!\\n\";\n\n         for (auto p : find_all(vs,\"green\"))\n               \
  \   *p = \"vert\";\n}\n```\n\n迭代器用于将算法和容器分离。算法通过迭代器对其数据进行操作，并且对存储元素的容器一无所知。相反，容器对操作在其元素上的算法一无所知；它所做的只是根据请求提供迭代器（例如\
  \ `begin()` 和 `end()`）。这种数据存储与算法之间分离的模型提供了非常通用且灵活的软件。\n\n![Images](img/f0178-01.jpg)\n\
  \n## 13.3 迭代器类型\n\n迭代器到底是什么？任何特定的迭代器都是某种类型的对象。然而，存在许多不同的迭代器类型——迭代器需要持有完成针对特定容器类型的工作所需的信息。这些迭代器类型可以像容器以及它们服务的特殊需求一样迥异。例如，`vector`\
  \ 的迭代器可以是普通指针，因为指针是引用 `vector` 元素非常合理的方式：\n\n![Images](img/f0178-02.jpg)\n\n另一种，`vector`\
  \ 迭代器可以实现为指向 `vector` 的指针加上一个索引：\n\n![Images](img/f0178-03.jpg)\n\n使用这种迭代器允许范围检查。\n\
  \n`list` 迭代器必须比指向元素的简单指针更复杂，因为通常情况下 `list` 的元素并不知道该 `list` 的下一个元素在哪里。因此，`list` 迭代器可能是指向链接（link）的指针：\n\
  \n![Images](img/f0178-04.jpg)\n\n所有迭代器的共同点是它们的语义和操作的命名。例如，对任何迭代器应用 `++` 都会得到一个指向下一个元素的迭代器。同样，`*`\
  \ 会产生迭代器指向的元素。事实上，任何遵循这些简单规则的对象都是迭代器。`Iterator` 是一个通用想法，一个概念 (8.2)，不同类型的迭代器以标准库\
  \ `concept` 的提供，例如 `forward_iterator` 和 `random_access_iterator` (14.5)。此外，用户很少需要知道特定迭代器的类型；每个容器都“知道”它的迭代器类型并按照习惯名称\
  \ `iterator` 和 `const_iterator` 提供它们。\n\n### 13.3.1 流迭代器\n\n迭代器是处理元素序列的通用且有效的概念。然而，容器并不是我们发现序列唯一的地方。例如，输入流产生一个值序列，我们向输出流写入一个值序列。为了创建一个\
  \ `ostream_iterator`，我们需要指定使用哪种流以及写入它的对象类型。例如：\n\n点击此处查看代码图片\n\n```cpp\nostream_iterator<string>\
  \ oo {cout}; // write strings to cout\n```\n\n赋值给 `*oo` 的效果是将赋值的值写入 `cout`。例如：\n\
  \n点击此处查看代码图片\n\n```cpp\nint main()\n{\n        *oo = \"Hello, \";              //\
  \ meaning cout<<\"Hello, \"\n        ++oo;\n        *oo = \"world!\\n\";       \
  \       // meaning cout<<\"world!\\n\"\n}\n```\n\n这是向标准输出写入标准消息的另一种方法。`++oo` 是为了模拟写入数组。这样，我们就可以在流上使用算法。例如：\n\
  \n点击此处查看代码图片\n\n```cpp\nvector<string> v{ \"Hello\", \", \", \"World!\\n\" };\n\
  copy(v, oo);\n```\n\n同样，`istream_iterator` 允许我们将将输入流视为只读容器。同样，我们必须指定使用的流和预期的值类型。例如：\n\
  \n点击此处查看代码图片\n\n```cpp\nistream_iterator<string> ii {cin};\n```\n\n输入迭代器成对使用表示序列，因此我们必须提供一个\
  \ `istream_iterator` 来表示输入的结束。这是默认的 `istream_iterator`：\n\n点击此处查看代码图片\n\n```cpp\n\
  istream_iterator<string> eos {};\n```\n\n通常，`istream_iterator` 和 `ostream_iterator`\
  \ 不直接使用。相反，它们作为算法的参数提供。例如，我们可以编写一个简单的程序读取文件、对读取的单词进行排序、消除重复并将结果写入另一个文件：\n\n点击此处查看代码图片\n\
  \n\n\n\n\n```\nint main()\n{\n        string from, to;\n        cin >> from >> to;\
  \                                       // 获取源文件名和文件名\n\n        ifstream is {from};\
  \                                      // 文件 \"from\" 的输入流\n        istream_iterator<string>\
  \ ii {is};                // 流的输入迭代器\n        istream_iterator<string> eos {}; \
  \              // 输入哨兵\n\n        ofstream os {to};                            \
  \            // 文件 \"to\" 的输出流\n        ostream_iterator<string> oo {os,\"\\n\"\
  };    // 流的输出迭代器，带有分隔符\n\n        vector<string> b {ii,eos};                   \
  \       // b 是从输入初始化的 vector\n        sort(b);                                 \
  \                       // 排序\n\n        unique_copy(b,oo);                    \
  \               // 将缓冲区拷贝到输出，丢弃重复值\n\n        return !is.eof() || !os;         \
  \                        // 返回错误状态 (§1.2.1, §11.4)\n}\n```\n\n我使用了 `sort()` 和 `unique_copy()`\
  \ 的范围版本。我本可以直接使用迭代器，例如在旧代码中常见的 `sort(b.begin(),b.end())`。\n\n请记住，为了同时使用标准库算法的迭代器版本及其对应的范围版本，我们需要显式地指定范围版本的调用，或者使用\
  \ `using` 声明 (§9.3.2)：\n\n点击查看代码图像\n\n```\ncopy(v, oo);                        \
  \      // 可能存在义\nranges::copy(v, oo);                // OK\nusing ranges::copy(v,\
  \ oo);     // 从此处起 copy(v, oo) 为 OK\ncopy(v, oo);                              //\
  \ OK\n```\n\n`ifstream` 是可以附加到文件的 `istream` (§11.7.2)，而 `ofstream` 是可以附加到文件的 `ostream`。`ostream_iterator`\
  \ 的第二个参数用于分隔输出值。\n\n实际上，这个程序比实际需要的要长 hơn。我们将字符串读入 `vector`，然后进行 `sort()`，最后将它们写入并消除重复项。一种更优雅的解决方案是根本不存储重复项。这可以通过将\
  \ `string` 保存在 `set` 中来实现，`set` 不保留重复项并保持其元素有序 (§12.5)。这样，我们可以用使用 `set` 的一行替换替换使用\
  \ `vector` 的两行，并将 `unique_copy()` 替换为更简单的 `copy()`：\n\n点击查看代码图像\n\n```\nset<string>\
  \ b {ii,eos};             // 从输入收集字符串\ncopy(b,oo);                             \
  \ // 将缓冲区拷贝到输出\n```\n\n我们只使用了一次 `ii`、`eos` 和 `oo`，所以可以进一步缩小程序的大小：\n\n点击查看代码图像\n\n\
  ```\nint main()\n{\n         string from, to;\n         cin >> from >> to;     \
  \          // 获取源文件名和文件名\n\n         ifstream is {from};              // 文件 \"from\"\
  \ 的输入流\n         ofstream os {to};                // 文件 \"to\" 的输出流\n\n        \
  \ set<string> b {istream_iterator<string>{is},istream_iterator<string>{}};     \
  \  // 读取输入\n         copy(b,ostream_iterator<string>{os,\"\\n\"});             \
  \                                         // 拷贝到输出\n\n         return !is.eof()\
  \ || !os;                        // 返回错误状态 (§1.2.1, §11.4)\n}\n```\n\n这种最后的简化是否提高了可读性，取决于口味和经验。\n\
  \n## 13.4 谓词的使用\n\n在之前的示例中，算法简单地为序列中的每个元素“内置”了要执行的操作。然而，我们通常希望将该操作作为算法的参数。例如，`find`\
  \ 算法 (§13.2, §13.5) 提供了一种查找特定值的方便方法。更通用的变体寻找满足特定要求的元素，即*谓词*（predicate）。例如，我们可能想在\
  \ `map` 中搜索第一个大于 `42` 的值。`map` 允许我们以序列 *(key,value)* 对的形式访问其元素，因此我们可以在 `map<string,int>`\
  \ 的序列中搜索一个 `int` 大于 `42` 的 `pair<const string,int>`：\n\n点击查看代码图像\n\n```cpp\nvoid\
  \ f(map<string,int>& m)\n{\n        auto p = find_if(m,Greater_than{42});\n    \
  \    // ...\n}\n```\n\n在这里，`Greater_than` 是一个函数对象 (§7.3.2)，持有用于与类型为 `pair<string,int>`\
  \ 的 `map` 条目进行比较的值（`42`）：\n\n\n\n点击查看代码图像\n\n```cpp\nstruct Greater_than {\n   \
  \      int val;\n         Greater_than(int v) : val(v) {}\n         bool operator()(const\
  \ pair<string,int>& r) const { return r.second > val; }\n};\n\n```或者，可以使用 lambda\
  \ 表达式：\n\n```cpp\nauto p = find_if(m, [](const auto& r) { return r.second > 42;\
  \ });\n```\n\n## 13.5 算法概述\n\n标准库提供了数十种算法。更通用的变体寻找满足特定要求的元素，即*谓词*。例如，我们可能想在 `map`\
  \ 中搜索大于 `42` 的值。`map` 允许我们以 *(key,value)* 对的形式访问其元素，因此我们可以在 `map<string,int>` 的序列中搜索一个\
  \ `int` 大于 `42` 的 `pair<const string,int>`。这些算法都接受序列作为输入。这里是一些示例：\n\n| 选定的算法 | |\n\
  | --- | --- |\n| `for_each(b,e,f)` | 对 `b` 中的每个元素 `x` 执行 `f(x)` |\n| `find(b,e,x)`\
  \ | `p` 是 `b` 中第一个满足 `p==x` 的元素 |\n| `find_if(b,e,f)` | `p` 是 `b` 中第一个满足 `f(p)`\
  \ 的元素 |\n| `count(b,e,x)` | `n` 是 `b` 中满足 `q==x` 的元素个数 |\n| `count_if(b,e,f)` |\
  \ `n` 是 `b` 中满足 `f(q)` 的元素个数 |\n| `replace(b,e,v,v2)` | 将 `b` 中满足 `q==v` 的元素替换为\
  \ `v2` |\n| `replace_if(b,e,f,v2)` | 将 `b` 中满足 `f(q)` 的元素替换为 `v2` |\n| `copy(b,e,out)`\
  \ | 将 `b` 拷贝到 `out` |\n| `copy_if(b,e,out,f)` | 将 `b` 中满足 `f(q)` 的元素 `q` 拷贝到 `out`\
  \ |\n| `move(b,e,out)` | 将 `b` 移动到 `out` |\n| `unique_copy(b,e,out)` | 将 `b` 拷贝到\
  \ `out`；不拷贝相邻重复项 |\n| `sort(b,e)` | 使用 `<` 作为排序标准对 `b` 排序 |\n| `sort(b,e,f)` | 使用\
  \ `f` 作为排序标准对 `b` 排序 |\n| `(p1,p2)=equal_range(b,e,v)` | `p1`, `p2` 是有序序列 `b` 中值为\
  \ `v` 的子序列；基本上是对值 `v` 的二分查找 |\n| `merge(b,e,b2,e2,out)` | 将两个有序序列 `b` 和 `b2` 合并到\
  \ `out` |\n| `merge(b,e,b2,e2,out,f)` | 使用 `f` 作为比较标准将两个有序序列 `b` 和 `b2` 合并到 `out`\
  \ |\n\n\n\n\n[content]\n对于每个接收 `b:e)` 范围的算法，`<ranges>` 都提供了一个接收范围的版本。请记住 (§[9.3.2)，为了同时使用标准库算法的传统迭代器版本及其对应的\
  \ ranges 版本，你可能需要显式地限定调用，或者使用 `using` 声明。\n\n这些算法以及许多其他算法（例如，§17.3）可以应用于容器、`string`\
  \ 和内置数组的元素。\n\n某些算法（如 `replace()` 和 `sort()`）会修改元素的值，但没有算法会增加或减少容器的元素。原因在于序列并不标识持有该序列元素的容器。要添加或删除元素，你需要一个了解容器的工具（例如\
  \ `back_inserter`；§13.1）或者直接引用容器本身（例如 `push_back()` 或 `erase()`；§12.2）。\n\nLambda\
  \ 表达式作为传递的参数的操作非常常见。例如：\n\n点击此处查看代码图像\n\n```\nvector<int> v = {0,1,2,3,4,5};\nfor_each(v,[](int&\
  \ x){ x=x*x; });                               // v=={0,1,4,9,16,25}\nfor_each(v.begin(),v.begin()+3,[](int&\
  \ x){ x=sqrt(x); });        // v=={0,1,2,9,16,25}\n```\n\n相比于手工编写的循环，标准库算法倾向于经过更仔细的设计、规范和实现。熟悉它们并优先使用它们，而不是使用原生语言编写的代码。\n\
  \n## 13.6 并行算法\n\n当需要对许多数据项执行相同的任务时，只要不同数据项之间的计算是独立的，我们就可以在每个数据项上并行执行它：\n\n* `parallel\
  \ execution`（并行执行）：任务在多个线程上完成（通常运行在多个处理器核心上）\n* `vectorized execution`（向量化执行）：任务在单线程上通过向量化完成，也称为\
  \ `SIMD`（“单指令，多数据”）。\n\n标准库对两者都提供了支持，我们可以明确指定想要顺序执行；在命名空间 `execution` 的 `<execution>`\
  \ 头文件中，我们找到了：\n\n* `seq`：顺序执行\n* `par`：并行执行（如果可行）\n* `unseq`：无序（向量化）执行（如果可行）\n*\
  \ `par_unseq`：并行和/或无序（向量化）执行（如果可行）。考虑 `std::sort()`：\n\n点击此处查看代码图像\n\n```\nsort(v.begin(),v.end());\
  \                       // 顺序\nsort(seq,v.begin(),v.end());                // 顺序（与默认相同）\n\
  sort(par,v.begin(),v.end());                 // 并行\nsort(par_unseq,v.begin(),v.end());\
  \    // 并行和/或向量化\n```\n\n是否值得并行化和/或向量化取决于算法、序列中元素的数量、硬件以及在该硬件上运行的程序的利用率。因此，执行策略指示器*只是提示。编译器和/或运行时调度器将决定使用多少并发性。这一切都是非易事的，在这里，在没有测量的情况下不对效率下结论的规则非常重要。\n\
  \n遗憾的是，并行算法的范围版本尚未进入标准，但如果我们需要它们，它们是很容易定义的：\n\n点击此处查看代码图像\n\n```\nvoid sort(auto\
  \ pol, random_access_range auto& r)\n{\n         sort(pol,r.begin(),r.end());\n\
  }\n```\n\n大多数标准库算法（包括 §13.5 表中 `equal_range` 以外的所有算法）都可以请求使用 `par` 和 `par_unseq`\
  \ 像 `sort()` 那样并行化和向量化。为什么不是 `equal_range()`？因为到为止还没有人提出为此值的并行算法。\n\n许多并行算法主要用于数值数据；参见\
  \ §17.3.1。\n\n在请求并行执行时，务必避免数据竞态 (§18.2) 和死锁 (§18.3)。\n\n## 13.7 建议\n\n[1] STL 算法作用于一个或多个序列；§13.1。\n\
  [2] 输入序列是半开开的，并由一对迭代器定义；§13.1。\n[3] 你可以定义自己的迭代器来满足特殊需求；§13.1。\n[4] 许多算法可以应用于 I/O；§17.3。\n\
  [5] 搜索时，算法通常返回范围的末尾；未找到§13.1。\n[6] 算法不会从其参数中添加或删除元素；§13.1。\n[7] 编写循环时，考虑它是否可以表示为范围；§13.1。\n\
  [8] 使用 `using`-别名来清理复杂的符号；§13.1。\n[9] 使用谓词赋予算法更广泛的含义；§13.1。\n[10] 范围不能修改其参数；§13.1。\n\
  [11] 熟悉你的标准库算法，并优于手工编写；§13.1。\n\n# 14 Ranges\n\n对于每个接收 `b:e)` 范围的算法，`<ranges>` 都提供了一个接收范围的版本。请记住\
