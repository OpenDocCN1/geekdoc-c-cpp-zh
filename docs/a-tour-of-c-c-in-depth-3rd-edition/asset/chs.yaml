  \ Office. London. 1974. |\n\n## 19.5 建议\n\n1. ISO C++ 定义了 C++ 特性。\n2. 在现代化 C++ 代码库时，遵循\
  \ C++ 核心指南。\n3. 现代 C++ 中的类型和资源安全。\n4. 在使用新的 C++ 特性之前，先进行测试。\n5. 泛型编程的未来（或如何设计并良好使用概念）。\n\
  6. 使用到 C++ 时，考虑使用模块化技术。\n7. 对于 C++ 标准库的最小化模块支持，使用 `vector`。\n8. 避免 C 风格转换。\n9. 优先使用命名的转换，如\
  \ `static_cast`。\n10. 在需要时使用 `std::` 显式类型转换。\n11. 为了可移植性和类型安全，使用 C++ 标准头。\n12. 在转换到\
  \ C++ 时，使用 `std` 模块。\n13. 在转换到 C++ 时，使用 `new` 和 `delete`。\n14. 在 C++ 中，没有 `std`\
  \ 隐式转换。\n15. 某些标准头文件将名称命名到全局命名空间中。\n16. 在声明 C 函数时使用 `extern \"C\"`。\n17. 优先使用 `string`\
  \ 而不是 C 风格字符串。\n18. 优先使用 `iostream` 而不是 `stdio`。\n19. 优先使用容器（如 `vector`）而不是内置数组。\n\
  \n# std 模块\n\n这是一个重大的发明：你拥有了一个完整的系统。– J. Eckert\n\n* 引言\n* 使用你的实现\n* 头文件\n* 创建你自己的\
  \ std\n* 建议\n\n## A.1 引言\n\n在编写时，`[Stroustrup,2021b]` 遗憾并不是标准的一部分。我有信心它将成为 C++23\
  \ 标准。本附录提供了目前管理的一些想法。\n\n`module std` 的想法是可以通过一个 `import std;` 语句简单且廉价地使用所有标准库。我在章节中一直依赖于这一点。提到头文件主要是因为它们是传统的且通用的，部分是因为它们反映了标准库不完美的组织方式。\n\
  \n少数标准库组件将名称（例如 `<cmath>` 中的 `sqrt()`）放入全局命名空间。`module std` 并没有这样做，但当我们需要这些全局名称时，可以使用\
  \ `import std.compat`。\n\n请注意，模块刻意不导出宏。如果你需要宏，请使用 `#include`。模块和头文件共存的；也就是说，如果你同时\
  \ `#include` 和 `import` 同一组声明，将获得一致程序。这对于大型代码库从头文件进化到模块至关重要。\n\n### A.2 使用你的实现\n\
  \n运气不错，我们想要的实现已经有了 `module std`。在这种情况下，我们的首选应该是使用它。它可能被标记为“实验性”，并且使用它可能需要一些设置或一些编译器选项。因此，首先探索实现是否具有\
  \ `module std` 或等效物。例如，目前（2022 年春）Visual Studio 提供了许多“实验性”模块，因此在使用该实现时，我们可以这样定义\
  \ **std**：\n\n\n\n\n\n点击此处查看代码图像\n\n![图像](img/#app.xhtml_f0278-01)]\n\n```cpp\n\
  export module std;\nexport import std.regex;            // <regex>\nexport import\
  \ std.filesystem;    // <filesystem>\nexport import std.memory;       // <memory>\n\
  export import std.threading;     // <atomic>, <condition_variable>, <future>, <mutex>,\n\
  \                                                     // <shared_mutex>, <thread>\n\
  export import std.core;             // 其他所有部分\n```\n\n为了实现这些功能，我们显然必须使用 C++20 编译器，并设置选项以访问实验性模块。请注意，所有“实验性”的内容都会随着时间发生变化。\n\
  \n### A.3 使用头文件\n\n如果某个实现尚未支持模块，或者尚未提供 `module std` 或等效项，我们可以退回到使用传统的头文件。它们是标准化的且普遍可用的。困难之处在于，为了让示例运行，我们需要确定需要哪些头文件并对其进行\
  \ `#include`。第 9 章可以在此提供帮助，我们可以在 [Cppreference] 查询想要使用的特性名称，查看它属于哪个头文件。如果这变得很繁琐，我们可以将常用的头文件收集到一个\
  \ `std.h` 头文件中：\n\n```cpp\n// std.h\n\n#include <iostream>\n#include<string>\n#include<vector>\n\
  #include<list>\n#include<memory>\n#include<algorithms>\n// ...\n```\n\n然后\n\n```cpp\n\
  #include \"std.h\"\n```\n\n这里的问题是，`#include` 这么多内容会导致编译速度非常缓慢 [Stroustrup,2021b]。\n\
  \n### A.4 编写自己的 module std\n\n这是最没有吸引力的替代方案，因为它可能工作量最大，但一旦有人完成了它，就可以共享出来：\n\n```cpp\n\
  module;\n#include <iostream>\n#include<string>\n#include<vector>\n#include<list>\n\
  #include<memory>\n#include<algorithms>\n// ...\n\nexport module std;\nexport istream;\n\
  export ostream;\nexport iostream;\n// ...\n```\n\n这里有一个快捷方法：\n\n```cpp\nexport module\
  \ std;\n\nexport import \"iostream\";\nexport import \"string\";\nexport import\
  \ \"vector\";\nexport import \"list\";\nexport import \"memory\";\nexport import\
  \ \"algorithms\";\n// ...\n```\n\n这种构造\n\n```cpp\nimport \"iostream\";\n```\n\n\
  导入*头文件单元*（header unit）是模块和头文件之间的折中方案。它将头文件转换为类似于模块的内容，但它也可以向全局命名空间注入名称（类似于 `#include`），并且泄露宏。\n\
  \n它的编译速度没有 `#include` 那么慢，但没有构建良好的命名模块快。\n\n## A.5 建议\n\n[1] 优先使用实现所提供的模块；§A.2。\n\
  \n[2] 使用模块；§A.3。\n\n[3] 优先使用命名模块而非头文件单元；§A.4。\n\n[4] 若要使用 C 标准中的宏和全局名称，请 `import\
  \ std.compat`；§A.1。\n\n[5] 避免宏；§A.1。 [CG: ES.30] [CG: ES.31]。\n\n# 索引\n\n*知识有两种：要么我们自己了解某个主题，要么我们知道去哪里可以找到关于它的信息。*\n\
