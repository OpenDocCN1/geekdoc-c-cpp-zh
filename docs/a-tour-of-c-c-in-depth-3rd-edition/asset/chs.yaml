  - [37] 保持一致的缩进风格。\n\n## 自定义类型\n\n## 2.1 引言\nC++ 语言通过自定义类型扩展了内置类型。我们将自定义类型称为 `classes`、`structs`、`enumerations`\
  \ 和 `unions`。本书大部分致力于 `classes`，但也频繁使用 `structs`。\n\n`const` 修饰符表示初始化后无法更改。`constexpr`\
  \ 表示函数可以在编译时求值，而 `consteval` 则表示函数必须在编译时求值。\n\n## 2.2 结构体\n构建新类型的第一步通常是将元素组织到 `struct`\
  \ 中。\n\n```cpp\nstruct Vector {\n       double* elem; // 元素的指针\n       int sz; \
  \       // 元素数量\n};\n```\n\n`Vector` 类型变量由一个 `int` 和一个 `double*` 组成。然而，单单是没有用的，因为\
  \ `v` 的 `elem` 指针没有指向任何地方。为了让它有用，我们必须给 `v` 分配元素。例如：\n\n```cpp\nvoid vector_init(Vector&\
  \ v, int s) // 初始化 Vector\n{\n        v.elem = new double[s]; // 分配一个 double 数组\n\
  \        v.sz = s;\n}\n```\n\n也就是说，`v` 的 `elem` 成员获得了 `new` 运算符产生的指针，`v` 的 `sz`\
  \ 成员获得了数量。`Vector&` 中的 `&` 表示我们以非 const 引用传递 `v`；这样 `vector_init()` 就可以修改传递它的向量。\n\
  \n`new` 运算符从称为*自由存储*（也称为*动态内存*和*堆*）的区域分配内存。在自由存储上分配的对象与创建它们的作用域独立，直到使用 `delete`\
  \ 运算符销毁它们。\n\n`Vector` 的用法如下：\n\n```cpp\ndouble read_and_sum(int s)\n        //\
  \ 从 cin 读取 s 个整数并返回它们的和；假设 s 为正数\n{\n        Vector v;\n        vector_init(v,s);\
  \                        // 为 v 分配 s 个元素\n\n        for (int i=0; i!=s; ++i)\n \
  \               cin>>v.elem[i];                 // 读取元素\n\n        double sum =\
  \ 0;\n        for (int i=0; i!=s; ++i)\n                sum+=v.elem[i];        \
  \      // 计算元素的和\n        return sum;\n}\n```\n\n\n\n\n在我们的 `Vector` 变得像标准库 `vector`\
  \ 一样优雅灵活之前，还有很长的路要走。特别是，`Vector` 的用户必须了解 `Vector` 表示的每一个细节。本章的剩余部分和后两章将逐步改进 `Vector`\
  \ 作为语言特性和技术的示例。第 12 章介绍了标准库的 `vector`，它包含了许多很好的改进。\n\n我使用 `vector` 和其他标准库组件作为示例：\n\
  * 用于说明语言特征和设计技术，以及\n* 帮助学习和使用标准库组件。\n\n不要重复发明如 `vector` 和 `string` 这样的标准库组件；直接使用它们即可。标准库类型使用小写名称，因此为了区分用于说明设计和实现技术的类型名称（例如\
  \ `Vector` 和 `String`），我将它们的首字母大写了。\n\n我们使用 `.`（点）通过名称（以及通过引用）访问 `struct` 成员，并使用\
  \ `->` 通过指针访问 `struct` 成员。例如：\n\n点击此处查看代码图像\n\n```\nvoid f(Vector v, Vector& rv,\
  \ Vector* pv)\n{\n        int i1 = v.sz;             // 通过名称访问\n        int i2 =\
  \ rv.sz;            // 通过引用访问\n        int i3 = pv->sz;         // 通过指针访问\n}\n```\n\
  \n## 2.3 类\n\n将数据与对其进行的操作分开指定具有优点，例如可以以任意方式使用数据。然而，为了让用户定义的类型具有“真实类型”所期望的所有属性，需要在表示法和操作之间建立更紧密的的联系。特别是，我们通常希望保持表示法对用户不可，以简化使用、保证数据使用的一致性，并允许我们以后改进表示法。为了做到这一点，我们需要区分类型的接口（供所有人使用）和它的实现（可以访问原本不可访问的数据）。用于该点的语言机制被称为\
  \ `class`（类）。类有一组 `members`（成员），这些成员可以是数据成员、函数成员或类型成员。\n\n类的接口由其 `public` 成员定义，而其\
  \ `private` 成员只能通过该接口访问。类声明中的 `public` 和 `private` 部分可以以任何顺序出现，但按照习惯，我们将 `public`\
  \ 声明放在前面，`private` 声明放在后面，除非我们想要强调表示法。例如：\n\n点击此处查看代码图像\n\n```\nclass Vector {\n\
  public:\n        Vector(int s) :elem{new double[s]}, sz{s} { }    // 构造一个 Vector\n\
  \        double& operator[](int i) { return elem[i]; }      // 元素访问：下标\n       \
  \ int size() { return sz; }\nprivate:\n        double* elem;  // 指向元素的指针\n     \
  \   int sz;               // 元素数量\n};\n```\n\n既然，我们可以为我们的新类型 `Vector` 定义一个变量：\n\n\
  点击此处查看代码图像\n\n```\nVector v(6);      // 一个拥有 6 个元素的 Vector\n```\n\n我们可以通过图形化展示一个\
  \ `Vector` 对象：\n\n![图像](img/f0024-03.jpg)\n\n基本上，`Vector` 对象是一个包含指向元素的指针 (`elem`)\
  \ 和元素数量 (`sz`) 的“句柄”。元素的数量（示例中的 6）可以随 `Vector` 对象之间而变化，且 `Vector` 对象在不同时间可以有不同的数量\
  \ (§5.2.3)）。然而，`Vector` 对象本身的大小始终是相同的。这是在 C++ 中处理变量信息的基本技术：一个固定大小的句柄指向“其他地方”的可变数据（例如，由\
  \ `new` 分配的自由存储；§5.2.2）。如何设计和使用此类对象是第 5 章的主题。\n\n在这里，`Vector` 的表示（成员 `elem` 和 `sz`）只能通过\
  \ `public` 成员提供的接口访问：`Vector()`、`operator[]()` 和 `size()`。§2.2 中的 `read_and_sum()`\
  \ 示例简化为：\n\n点击此处查看代码图像\n\n```\ndouble read_and_sum(int s)\n{\n        Vector v(s);\
  \                                    // 创建一个 s 个元素的 vector\n        for (int i=0;\
  \ i!=v.size(); ++i)\n                cin>>v[i];                               //\
  \ 读取到元素\n\n        double sum = 0;\n        for (int i=0; i!=v.size(); ++i)\n  \
  \              sum+=v[i];                             // 取元素之和\n        return sum;\n\
  }\n```\n\n与其类同名的成员函数被称为 `constructor`（构造函数），即用于 `construct`（构造）类对象的函数。因此，构造函数 `Vector()`\
  \ 替换了§2.2 中的 `vector_init()`。与普通函数不同，`enum class` 消除了未初始化变量的问题。`Vector(int)` 定义了\
  \ `Vector` 的类型。特别是，`enum class` 表明它是强类型的。`enum class` 使用成员初始化列表初始化 `elem`：\n\n```\n\
  :elem{new double[s]}, sz{s}\n```\n\n```\n然后，初始化 `sz` 为 `double`。对元素的访问由下标函数 `operator[]`\
  \ 提供。它返回 `double` 的引用。`size()` 函数提供了 `double` 的数量。\n\n显然，缺少错误处理，但我们将在第 4 章 回这个问题。同样，§5.2.2\
  \ 显示了如何定义析构函数来实现这一点。\n\n`struct` 和 `class` 之间没有本质区别；`struct` 只是成员默认 `public` 的 `class`。例如，你可以为\
  \ `struct` 定义构造函数和其他成员函数。\n\n## 2.4 枚举\n\n除了类，C++ 还支持一种简单的用户定义类型，我们可以对其值进行枚举：\n\n\
  点击此处查看代码图像\n\n```\nenum class Color { red, blue, green };\nenum class Traffic_light\
  \ { green, yellow, red };\n\nColor col = Color::red;\nTraffic_light light = Traffic_light::red;\n\
  ```\n\n注意枚举器（例如 `red`）位于其 `enum class` 的作用域内，因此它们可以在不同的 `enum class` 中重复使用而不会引起冲突。例如\
  \ `Color::red` 是 `Color` 的 `red`，它与 `Traffic_light::red` 不同。\n\n枚举用于表示一组小的整数值。与没有使用符号（和助记）枚举器名称相比，它们使代码更具可读性且不易出错。\n\
  \n`enum` 后面的 `class` 指定了枚举是强类型的，并且其枚举器是有作用域的。作为独立的类型，`enum class` 有助于防止意外误用常量。特别是，我们不能混合使用\
  \ `Traffic_light` 和 `Color` 值：\n\n点击此处查看代码图像\n\n```\n// 此处没有具体代码块，根据上下文逻辑\nColor\
  \ x1 = red;                          // 错误：哪个 red?\nColor y2 = Traffic_light::red;\
  \   // 错误：那个 red 不是 Color\nColor z3 = Color::red;              // OK\nauto x4 =\
  \ Color::red;               // OK：Color::red 是一个 Color\n```\n\n同样，我们不能隐式地混合 `Color`\
  \ 和整数值：\n\n点击此处查看代码图像\n\n\n\n\n```\nint i = Color::red;           // error: Color::red\
  \ is not an int\nColor c = 2;                    // initialization error: 2 is not\
  \ a Color\n```\n\n捕获对 `enum` 的隐式转换是防御错误的良好手段，但通常我们希望用其底层类型（默认情况下是 `int`）的值来初始化 `enum`，因此这种操作是被允许的，从底层类型的显式转换也是如此：\n\
  \n点击此处查看代码图片\n\n```\nColor x = Color{5};  // OK, 但较冗长\nColor y {6};            \
  \  // 也是 OK\n```\n\n同样，我们可以显式地将 `enum` 值转换为其底层类型：\n\n```\nint x = int(Color::red);\n\
  ```\n\n默认情况下，`enum class` 定义了赋值、初始化和比较（例如，`==` 和 `<`；§1.4）），且仅包含这些。然而，枚举是一种用户定义的类型，因此我们可以为它定义运算符（§6.4）：\n\
  \n点击此处查看代码图片\n\n```\nTraffic_light& operator++(Traffic_light& t)               \
  \ // 前缀增：++\n{\n        switch (t) {\n        case Traffic_light::green:       \
  \  return t=Traffic_light::yellow;\n        case Traffic_light::yellow:        return\
  \ t=Traffic_light::red;\n        case Traffic_light::red:             return t=Traffic_light::green;\n\
  \        }\n}\n\nauto signal = Traffic_light::red;\nTraffic_light next = ++signal;\
  \           // next 变为 Traffic_light::green\n```\n\n如果枚举名称 `Traffic_light` 的重复出现过于乏味，我们可以在作用域内对其缩写：\n\
  \n点击此处查看代码图片\n\n```\nTraffic_light& operator++(Traffic_light& t)               //\
  \ 前缀增：++\n{\n        using enum Traffic_light;         // 在这里，我们正在使用 Traffic_light\n\
  \n        switch (t) {\n        case green:      return t=yellow;\n        case\
  \ yellow:     return t=red;\n        case red:          return t=green;\n      \
  \  }\n}\n```\n\n如果你永远不想显式地限定枚举器名称，并希望枚举成员值是 `int` 类型（无需显式转换），你可以从 `enum class` 中移除\
  \ `class` 以得到一个“普通” `enum`。“普通” `enum` 的枚举器会被置于与其 `enum` 名称相同的作用域中，并隐式转换为其整数值。例如：\n\
  \n点击此处查看代码图片\n\n```\nenum Color { red, green, blue };\nint col = green;\n```\n\n\
  在这里 `col` 获得值 `1`。默认情况下，枚举成员的整数值从 `0` 开始，每增加一个枚举成员就加 1。“普通” `enum` 自 C++（以及 C）的最早期起就存在了，尽管它们的行为并不那么良好，但在当前代码中很常见。\n\
  \n## 2.5 联合体 (Unions)\n\n`union` 是一种 `struct`，其中所有成员都分配在相同的地址，因此 `union` 仅占用与其最大成员相同的空间。自然地，一个\
  \ `union` 每次只能包含一个成员的值。例如，考虑一个包含名称和值的符号表条目。该值可以是 `Node*` 也可以是 `int`：\n\n点击此处查看代码图片\n\
  \n```\nenum class Type { ptr, num }; //一个 Type 可以持有值 ptr 和 num (§2.4)\n\nstruct\
  \ Entry {\n       string name;    // string 是标准库类型\n       Type t;\n       Node*\
  \ p;  // 如果 t==Type::ptr 则使用 p\n       int i;         // 如果 t==Type::num 则使用 i\n\
  };\n\nvoid f(Entry* pe)\n{\n        if (pe->t == Type::num)\n                cout\
  \ << pe->i;\n        // ...\n}\n```\n\n成员 `p` 和 `i` 永远不会同时同时使用，因此浪费了空间。可以通过指定这两者都应该是\
  \ `union` 的成员来轻松恢复空间，如下：\n\n```\nunion Value {\n        Node* p;\n        int i;\n\
  };\n```\n\n现在 `Value::p` 和 `Value::i` 被放置在每个 `Value` 对象的相同内存地址。\n\n这种空间优化对于持有大量内存的应用程序很重要，因为紧凑的表示非常关键。语言并不跟踪\
  \ `union` 持有何种类型的值，因此程序员必须自己这样做：\n\n点击此处查看代码图片\n\n```\nstruct Entry {\n       string\
  \ name;\n       Type t;\n       Value v;   // 如果 t==Type::ptr 使用 v.p；如果 t==Type::num\
  \ 使用 v.i\n};\n\nvoid f(Entry* pe)\n{\n        if (pe->t == Type::num)\n        \
  \        cout << pe->i;\n        // ...\n}\n```\n\n## 2.6 建议\n\n[1] 当内建类型过于低级时，优先使用良好的用户定义类型。\n\
  [2] 将数据组织在 `struct` 或 `class` 中。\n[3] 使用 `class` 来表示接口与实现之间的区别。\n[4] 尽可能使用 `const`。\n\
  [5] 定义构造函数以保证并简化 `class` 的初始化。\n[6] 使用枚举来表示一组常量。\n[7] 优先使用 `class enum` 而非“普通” `enum`\
  \ 以意外。\n[8] 为枚举定义操作以实现安全方便的使用。\n[9] 避免使用“裸” `union`；将其与类型字段封装在类中。\n\n# 3 模块化\n\n\
  *各管其是。*\n\n*–传统的*\n\n*   引言\n\n*   独立编译\n\n    头文件; 模块\n\n*   命名空间\n\n*   函数参数与返回值\n\
  \n    参数传递; 值返回; 返回类型推导; 后缀返回类型; 结构化绑定\n\n*   建议\n\n\n\n\n\n一个 C++ 程序由许多独立开发的部分组成，例如函数（§1.2.1）、用户定义类型（第\
  \ 2 章）、类层次结构（§5.5）以及模板（第 7 章）。管理众多部分的关键在于清晰地定义这些部分之间的交互。第一也是重要的一步是区分部分的接口和它的实现。在语言层面，C++\
  \ 通过声明来表示接口。*声明*（declaration）指定了使用函数或类型所需的所有内容。例如：\n\n点击此处查看代码图像\n\n```\ndouble\
  \ sqrt(double);        // the square root function takes a double and returns a\
  \ double\n\nclass Vector {                   // what is needed to use a Vector\n\
  public:\n        Vector(int s);\n        double& operator[](int i);\n        int\
  \ size();\n\nprivate:\n        double* elem; // elem points to an array of sz doubles\n\
  \        int sz;\n};\n```\n\n这里的关键在于，函数体——即函数*定义*（definitions）可以位于“别处”。对于这个示例，我们可能希望\
  \ `Vector` 的表示也位于“别处”，但我们稍后会处理这个问题（抽象类型；§5.3）。`sqrt()` 的定义如下：\n\n点击此处查看代码图像\n\n\
  ```\ndouble sqrt(double d)              // definition of sqrt()\n{\n        // ...\
  \ algorithm as found in math textbook ...\n}\n```\n\n对于 `Vector`，我们需要定义所有三个成员函数：\n\
  \n点击此处查看代码图像\n\n```\nVector::Vector(int s)                                // definition\
  \ of the constructor\n        :elem{new double[s]}, sz{s}           // initialize\
  \ members\n{\n}\n\ndouble& Vector::operator[](int i)           // definition of\
  \ subscripting\n{\n        return elem[i];\n}\n\nint Vector::size()            \
  \                         // definition of size()\n{\n        return sz;\n}\n```\n\
  \n我们必须定义 `Vector` 的函数，但不需要定义 `sqrt()`，因为它是标准库的一部分。然而，这并没有本质区别：库仅仅是“使用与我们相同的语言特性编写的、恰好被使用的其他代码”。\n\
  \n一个实体（如函数）可以有很多个声明，但只能有一个定义。\n\n## 3.2 独立编译\n\nC++ 支持独立编译的概念，其中用户代码只看到所用类型和函数的声明。这可以通过两种方式实现：\n\
  \n*   *头文件*（§3.2.1）：将声明放在单独的文件中，称为*头文件*，并在需要声明的地方文本化地 `#include` 头文件。\n*   *模块*（*Modules*§3.2.2）：定义\
  \ `module` 文件，单独编译它们，并在需要的地方 `import` 它们。只有被显式 `export` 出的声明才能被 `import` 该 `module`\
  \ 的代码可见。\n\n任何一种方法都可以用于将程序组织成一组半独立的代码片段。这种分离可以用于最小化编译时间，并强制程序逻辑上不同部分的分离（从而减少错误概率）。库通常是独立编译的代码片段（例如函数）的集合。\n\
  \n使用头文件的代码组织技术可以追溯到 C 的早期，并且目前为止仍然是最常用的方法。模块是 C++20 引入的新特性，在代码整洁和编译时间具有巨大优势。\n\n\
  ### 3.2.1 头文件\n\n传统上，我们将指定被视为模块的代码接口的声明放在一个命名指示其预定用途的文件中。例如：\n\n点击此处查看代码图像\n\n```\n\
  // Vector.h:\n\nclass Vector {\npublic:\n        Vector(int s);\n        double&\
  \ operator[](int i);\n        int size();\nprivate:\n        double* elem;     \
  \     // elem points to an array of sz doubles\n        int sz;\n};\n```\n\n该声明会被放置在\
  \ `Vector.h` 文件中。用户随后 `#include` 该文件（称为*头文件*）以访问该接口。例如：\n\n点击此处查看代码图像\n\n```\n//\
  \ user.cpp:\n\n#include \"Vector.h\"       // get Vector's interface\n#include <cmath>\
  \         // get the standard-library math function interface including sqrt()\n\
  \ndouble sqrt_sum(const Vector& v)\n{\n        double sum = 0;\n        for (int\
  \ i=0; i!=v.size(); ++i)\n                sum+=std::sqrt(v[i]);                \
  \      // sum of square roots\n        return sum;\n}\n```\n\n为了帮助编译器确保一致性，提供 `Vector`\
  \ 实现的 `.cpp` 文件也会包含提供接口的 `.h` 文件：\n\n点击此处查看代码图像\n\n```\n// Vector.cpp:\n\n#include\
  \ \"Vector.h\"       // get Vector's interface\n#include <cmath>         // get\
  \ the standard-library math function interface including sqrt()\n\ndouble sqrt_sum(const\
  \ Vector& v)\n{\n        double sum = 0;\n        for (int i=0; i!=v.size(); ++i)\n\
  \                sum+=std::sqrt(v[i]);                      // sum of square roots\n\
  \        return sum;\n}\n```\n\n### 3.2.2 模块\n\n在 C++20 中，我们终于有了语言支持的直接表达模块化的方式（§19.2.4）。考虑使用**模块**表达\
  \ §3.2 中的 `Vector` 和 `sqrt_sum()` 示例：\n\n点击此处查看代码图像\n\n\n\n\n\n```cpp\nexport module\
  \ Vector;     // 定义名为 \"Vector\" 的模块\n\nexport class Vector {\npublic:\n       \
  \ Vector(int s);\n        double& operator[](int i);\n        int size();\nprivate:\n\
  \        double* elem;          // elem 指向包含 sz 个 double 的数组\n        int sz;\n\
  };\n\nVector::Vector(int s)\n        :elem{new double[s]}, sz{s}             //\
  \ 初始化成员\n{\n}\n\ndouble& Vector::operator[](int i)\n{\n        return elem[i];\n\
  }\n\nint Vector::size()\n{\n        return sz;\n}\n\nexport bool operator==(const\
  \ Vector& v1, const Vector& v2)\n{\n        if (v1.size()!=v2.size())\n        \
  \        return false;\n        for (int i = 0; i<v1.size(); ++i)\n            \
  \    if (v1[i]!=v2[i])\n                        return false;\n        return true;\n\
  }\n```\n\n这定义了一个名为 `Vector` 的`module`，它导出类 `Vector`、其所有的成员函数以及定义运算符 `==` 的非成员函数。\n\
  \n我们使用这个`module` 的方式是在需要的地方对其进行 `import`。例如：\n\n点击此处查看图像\n\n```cpp\n// file user.cpp:\n\
  \nimport Vector;                // 获取 Vector 的接口\n#include <cmath>          // 获取标准库数学函数接口，包括\
  \ sqrt()\n\ndouble sqrt_sum(Vector& v)\n{\n        double sum = 0;\n        for\
  \ (int i=0; i!=v.size(); ++i)\n                sum+=std::sqrt(v[i]);           \
  \       // 平根之和\n        return sum;\n}\n```\n\n我本也可以`imported`标准库的数学函数，但我使用了旧式的\
  \ `#include` 只是为了展示我们可以混合新旧技术。这种混合对于将旧代码从使用 `#include` 逐渐升级到使用 `import` 至关重要。\n\n\
  头文件（headers）与模块（modules）之间的区别不仅仅是语法上的。\n\n- 一个 `module` 只编译一次（而不是在使用它的每个编译单元中编译）。\n\
  - 两个模块可以以任何顺序被`imported` 而不改变它们的含义。\n- 如果你在模块中 `import` 或 `#include` 某些内容，你模块的用户并不会隐式地获得访问权限（且不会被其干扰）：`import`\
  \ 不是传递的。\n\n对可维护性和编译时性能的影响可能是惊人的。例如，我测量了使用以下代码的“Hello, World!”程序：\n\n```cpp\nimport\
  \ std;\n```\n\n编译比使用以下代码快 10 倍：\n\n```cpp\n#include<iostream>\n```\n\n尽管模块 `std`\
  \ 包含了整个标准库，其信息量是 `<iostream>` 头文件的 10 倍以上，但仍然实现了这一点。原因是模块只导出接口，而头文件会将其直接或间接包含的所有内容都传递给编译器。这允许我们使用大型模块，而无需记住在一堆令人眼花缭乱头文件\
  \ (§9.3.4) 中应该 `#include` 哪一个。从这里开始，我假设所有示例都使用 `import std`。\n\n遗憾的是，`module std`\
  \ 并不是 C++20 的。附录 A 解释了如果标准库实现尚未提供，该如何获取一个 `module std`。\n\n在定义模块时，我们不必将声明和定义分离到不同的文件中；如果这有助于改进源代码的组织，我们可以这样做，但不是必须的。我们可以像这样定义简单的\
  \ `Vector` 模块：\n\n点击此处查看图像\n\n```cpp\nexport module Vector;    // 定义名为 \"Vector\"\
  \ 的模块\n\nexport class Vector {\n        // ...\n};\n\nexport bool operator==(const\
  \ Vector& v1, const Vector& v2)\n{\n        // ...\n}\n```\n\n从图示上看，程序片段可以表示如下：\n\
  \n![Images](img/f0035-02.jpg)\n\n编译器将模块的接口（由 `export` 饰符指定）与它的实现细节分开。因此，`Vector`\
  \ 接口由编译器生成，用户永远不会显式地命名它。\n\n使用 `modules`，我们不需要为了化代码来向用户隐藏实现细节；`module` 只授予对`exported`声明的访问权限。考虑：\n\
  \n点击此处查看图像\n\n```cpp\nexport module vector_printer;\n\nimport std;\n\nexport\ntemplate<typename\
  \ T>\nvoid print(std::vector<T>& v)   // 这是用户看到的（唯一）函数\n{\n        cout << \"{\\\
  n\";\n        for (const T& val : v)\n                std::cout << \" \" << val\
  \ << '\\n';\n        cout << '}';\n}\n```\n\n通过 `importing` 这个平凡的模块，我们并不会突然获得整个标准库的访问权限。\n\
  \n`template<typename T>` 是我们对函数进行类型参数化的 (§7.2)。\n\n## 3.3 命名空间\n\n除了函数 (§1.3)、类\
  \ (§2.3) 和枚举 (§2.4) 之外，C++ 还提供了*namespaces*（命名空间）作为表达某些声明属于整体的机制 (§3.3](#ch03.xhtml_sec3_3))。访问另一个命名空间的最简单方法是用命名空间名进行限定（例如\
  \ `std::cout`）。“`main()`”定义在全局命名空间，而不是局部于某个命名空间、类或函数。\n\n如果反复限定名称变得繁琐或分散注意力，我们可以通过\
  \ *using-declaration*（使用声明）将名称引入作用域：\n\n点击此处查看图像\n\n```cpp\nvoid my_code(vector<int>&\
  \ x, vector<int>& y)\n{\n        using std::swap;               // 使标准库 swap 在本地可用\n\
  \        // ...\n        swap(x,y);                          // std::swap()\n  \
  \      other::swap(x,y);              // other swap()\n        // ...\n}\n```\n\n\
  `using-declaration` 使命名空间中的名称像在其出现的作用域内声明的一样可用。在 `using std::swap` 之后，就像 `swap`\
  \ 在 `my_code()` 中声明过一样。\n\n为了获得标准库命名空间中所有名称的访问权限，可以使用 *using-directive*（使用指令）：\n\
  \n```cpp\nusing namespace std;\n```\n\n`using-directive` 使命名空间中的未限定名称在我们放置指令的作用域内变得可用。因此，在\
  \ `std` 的 `using-directive` 之后，我们可以直接写 `cout` 而不是 `std::cout`。例如，我们可以在平凡的 `vector_printer`\
  \ 模块中避免重复的 `std::` 限定：\n\n点击此处查看图像\n\n```cpp\nexport module vector_printer;\n\n\
  import std;\nusing namespace std;\n\nexport\ntemplate<typename T>\nvoid print(vector<T>&\
  \ v) // 这是用户看到的（唯一）函数\n{\n        cout << \"{\\n\";\n        for (const T& val :\
  \ v)\n                cout << \" \" << val << '\\n';\n        cout << '}';\n}\n\
  ```\n\n重要的是，这种命名空间指令的使用不会影响我们模块的用户；它是一个实现细节，局限于模块内部。\n\n\n\n\n通过使用 `using` 指令，我们失去了选择性使用该命名空间中名称的能力，因此这种机制应该被谨慎使用，通常用于应用程序中无处不在的库（例如\
  \ `std`），或在对未使用 `namespace` 的应用程序进行过渡时使用。\n\n命名空间主要用于组织大型程序组件，例如库。它们简化了由独立开发的部分组成程序的组合。\n\
  \n## 3.4 函数参数和返回值\n\n从程序的一个部分向另一个部分传递信息的主要且推荐的方法是通过函数调用。执行某任务所需的信息作为参数传递给函数，产生的结果则作为返回值传回。例如：\n\
  \n点击此处查看代码图像\n\n```\nint sum(const vector<int>& v)\n{\n        int s = 0;\n    \
  \    for (const int i : v)\n                s += i;\n        return s;\n}\n\nvector\
  \ fib = {1, 2, 3, 5, 8, 13, 21};\n\nint x = sum(fib);               // x 变为 53\n\
  ```\n\n函数之间还有其他传递信息的路径，例如全局变量 (§1.5)）和类对象中的共享状态（第 5 章）。全局变量被视为已知的错误来源而被强烈反对，且状态通常只在共同实现定义良好的抽象的函数之间共享（例如，类的成员函数；§2.3）。\n\
  \n鉴于在函数之间相互传递信息的重要性，有多种实现方法并不为意外。关键关注点有：\n\n* 对象是被复制的还是共享的？\n* 如果对象是共享的，它是可变的吗？\n\
  * 对象是否被移动，并留下一个“空对象”（§6.2.2)）？\n\n参数传递和值返回默认行为都是“制作副本”（§1.9），但许多拷贝可以隐式地优化为移动。\n\n\
  在 `sum()` 示例中，结果 `int` 被从 `sum()` 拷贝出来，但将可能非常大的 `vector` 拷贝到 `sum()` 中是低效且毫无意义的，因此参数通过引用传递（由\
  \ `&` 表示；§1.7）。\n\n`sum()` 没有理由修改其参数。这种不可性通过将 `vector` 参数声明为 `const` 来表示 (§1.6)，因此\
  \ `vector` 通过 `const`-引用传递。\n\n### 3.4.1 参数传递\n\n首先考虑如何将值传入函数。默认情况下我们进行复制（“按值传递”），如果我们想引用调用者环境中的对象，则使用引用（“引用传递”）。例如：\n\
  \n点击此处查看代码图像\n\n```\nvoid test(vector<int> v, vector<int>& rv)          // v 按值传递；rv\
  \ 按引用传递\n{\n        v[1] = 99;          // 修改 v（一个局部变量）\n        rv[2] = 66;   \
  \      // 修改 rv 指向的任何内容\n}\n\nint main()\n{\n        vector fib = {1, 2, 3, 5, 8,\
  \ 13, 21};\n        test(fib,fib);\n        cout << fib[1] <<'' << fib[2] << '\\\
  n';           // 打印 2 66\n}\n```\n\n当我们关心性能时，通常按值传递较小的值，按引用传递较大的值。这里“较小”意味着“拷贝起来非常廉价的东西”。具体什么是“较小”取决于机器架构，但“两个或三个指针的大小或更小”是一个很好的经验法则。如果它对你的性能可能有显著影响，请进行测量。\n\
  \n如果我们出于性能考虑想按引用传递，但不需要修改参数，则像 `sum()` 示例那样按 `const`-引用传递。这在普通良好的代码中是最常见的情况：它速度快且不易出错。\n\
  \n函数参数具有默认值并不罕见；即一个被视为首选的或仅仅是通常见的值。我们可以通过*默认函数参数*来指定这样的默认值。例如：\n\n点击此处查看代码图像\n\n\
  ```\nvoid print(int value, int base =10);   // 在基数 \"base\" 下打印 value\n\nprint(x,16);\
  \       // 十进制\nprint(x,60);       // 六十进制（苏美尔语）\nprint(x);            // 使用默认值：十进制\n\
  ```\n\n这是重载的一种符号上更简单的替代方案：\n\n点击此处查看代码图像\n\n```\nvoid print(int value, int base);\
  \          // 在基数 \"base\" 下打印 value\n\nvoid print(int value)                  \
  \        // 在基数 10 下打印 value\n{\n        print(value)\n}\n```\n\n（注：原文中存在多处重复的文本块，已按要求去重并完成翻译。）\n\
  \n\n\n函数的返回类型可以根据其返回值推导。例如：\n\n点击此处查看图片\n\n```\nauto mul(int i, double d) { return\
  \ i*d; }             // 此处，“auto”意味着“推导返回类型”\n```\n\n这非常方便，特别是对于泛型函数 (§7.3.1)）和\
  \ lambda 表达式（§7.3.3)），但应该谨慎使用，因为推导出的类型不提供稳定的接口：函数（或 lambda）实现的变更改可能会改变其类型。\n\n###\
  \ 3.4.4 后缀返回类型\n\n为什么返回类型放在函数名和参数之前？这个原因主要是历史遗留的。Fortran、`C` 和 `Simula` 都是这样做的（现在仍然是如此）。然而，有时我们需要查看参数来确定结果的类型。返回类型推导是其中一个例子，但并非唯一。在本书范围之外的示例中，这个问题出现在命名空间（§3.3)）、lambda\
  \ 表达式（§7.3.3)）和概念（§8.2)）中。因此，当我们想要明确返回类型时，可以在参数列表之后添加返回类型。使得 `auto` 意味着“返回类型稍后提到或被推导”。例如：\n\
  \n点击此处查看图片\n\n```\nauto mul(int i, double d) -> double { return i*d; }         //\
  \ 返回类型是 \"double\"\n```\n\n与变量(§1.4.2)一样，我们可以使用这种符号更整齐地排列名称。将这种后缀返回类型的使用与 (§1.3)\
  \ 中的版本进行比较：\n\n```\nauto next_elem() -> Elem*;\nauto exit(int) -> void;\nauto sqrt(double)\
  \ -> double;\n```\n\n我发现这种后缀返回类型符号比传统的前缀符号更有逻辑，但由于绝大多数代码使用传统的表示法，我在本书中保留了那种写法。\n\
  \n### 3.4.5 结构化绑定\n\n函数只能返回一个值，但该值可以是包含许多成员的类对象。这允许我们优雅地返回多个值。例如：\n\n点击此处查看图片\n\n\
  ```\nstruct Entry {\n        string name;\n        int value;\n};\n\nEntry read_entry(istream&\
  \ is)            // 简单的读取函数（更好的版本，请见 §11.5）\n{\n        string s;\n        int i;\n\
  \        is >> s >> i;\n        return {s,i};\n}\n\nauto e = read_entry(cin);\n\n\
  cout << \"{ \" << e.name << \" , \" << e.value << \" }\\n\";\n```\n\n在这里，`{s,i}`\
  \ 用于构造 `Entry` 返回值。同样，我们可以将 `Entry` 的成员“解包”到局部变量中：\n\n点击此处查看图片\n\n```\nauto [n,v]\
  \ = read_entry(is);\ncout << \"{ \" << n << \" , \" << v << \" }\\n\";\n```\n\n\
  `auto [n,v]` 声明了两个局部变量 `n` 和 `v`，它们的类型从 `read_entry()` 的返回类型推导。这种为类对象的成员赋予局部名称的机制被称为*结构化绑定*。\n\
  \n考虑另一个例子：\n\n点击此处查看图片\n\n```\nmap<string,int> m;\n// ... 填充 m ...\nfor (const auto\
  \ [key,value] : m)\n        cout << \"{\" << key << \",\" << value << \"}\\n\";\n\
  ```\n\n像往常，我们可以用 `const` 和 `&` 修饰 `auto`。例如：\n\n点击此处查看图片\n\n```\nvoid incr(map<string,int>&\
  \ m)        // 增加值\nfor (const auto [key,value] : m)\n        ++value;\n```\n\n\n\
  \n\n错误处理是一个巨大且复杂的话题，其关注点和影响远超语言本身，延伸到了编程技术和工具。然而，C++ 提供了一些功能来提供帮助。主要的工具是类型系统本身。我们不再费力地从内置类型（例如\
  \ `char`、`int` 和 `double`）和语句（例如 `if`、`while` 和 `for`）开始构建应用程序，而是构建适用于应用程序的类型（例如\
  \ `string`、`map` 和 `thread`）和算法（例如 `sort()`、`find_if()` 和 `draw_all()`）。这些更高级的构造结构简化了我们的编程工作，限制了我们可能犯错的机会（例如，你不太可能尝试在对话框上应用树形遍历），并增加了编译器捕获错误的概率。大多数\
  \ C++ 语言构造结构都用于设计和实现优雅高效的抽象（例如用户定义的类型以及使用这些类型的算法）。使用此类抽象的一个效果是，检测运行时错误的地方与处理错误的地方被分开了。随着程序的增长，特别是当广泛使用库时，处理错误的标准变得至关重要。在程序开发早期确定一种错误处理策略是一个好主意。\n\
  \n## 4.2 异常\n\n再次考虑 `Vector` 示例。当我们尝试访问 §2.3 中超出 vector 范围的元素时，*应该*做什么？\n\n* `Vector`\
  \ 的作者不知道用户在这种情况下希望执行什么（`Vector` 的作者通常甚至不知道该 vector 将在哪个程序中运行）。\n* `Vector` 的用户无法一致地检测到问题（如果用户能够检测到，那么越界访问根本就不会发生）。\n\
  \n假设越界访问是一种我们想要恢复的错误，那么解决方案是让 `Vector` 的实现者检测到尝试的越界访问并通知用户。用户可以采取适当的行动。例如，`Vector::operator[]()`\
  \ 可以检测尝试的越界访问并抛出一个 `out_of_range` 异常：\n\n点击此处查看代码图像\n\n```\ndouble& Vector::operator[](int\
  \ i)\n{\n        if (!(0<=i && i<size()))\n                throw out_of_range{\"\
  Vector::operator[]\"};\n        return elem[i];\n}\n```\n\n`throw` 将控制权转移到直接或间接调用\
  \ `Vector::operator[]()` 的某些函数中针对 `out_of_range` 类型异常的处理器中。为了实现这一点，实现将根据需要*回溯*（unwind）函数调用栈，以返回该调用者的上下文。也就是说，异常处理机制将根据需要退出作用域和函数，返回到表示对处理此类异常感兴趣的调用者，并在途中根据需要调用析构函数\
  \ (§5.2.2）。例如：\n\n点击此处查看代码图像\n\n```\nvoid f(Vector& v)\n{\n        // ...\n    \
  \    try { // 此块中抛出的 out_of_range 异常将由下面定义的处理器处理\n                compute1(v); \
  \                    // 可能尝试访问 v 的末尾之外\n                Vector v2 = compute2(v);\
  \ // 可能尝试访问 v 的末尾之外\n                compute3(v2);                    // 可能尝试访问\
  \ v2 的末尾之外\n        }\n        catch (const out_of_range& err) {   // 哎：out_of_range\
  \ 错误\n                // ... 处理范围错误 ...\n                cerr << err.what() << '\\\
  n';\n        }\n        // ...\n}\n```\n\n我们将感兴趣要处理异常的代码放入 `try` 块中。`compute1()`、`compute2()`\
  \ 和 `compute3()` 的调用旨在代表无法预先简单判断是否会发生范围错误的代码。提供 `catch` 子句是为了处理 `out_of_range` 类型的异常。如果\
  \ `f()` 不是处理此类异常的好地方，我们本不会使用 `try` 块，而是让异常隐式地传递给 `f()` 的调用者。\n\n`out_of_range` 类型定义在标准库（在\
  \ `<stdexcept>` 中）中，并且实际上被某些标准库容器的访问函数使用。\n\n我通过引用捕获异常以避免拷贝，并使用 `what()` 函数打印在 `throw`\
  \ 点存入其中的错误消息。\n\n异常处理机制的使用可以使错误处理变得更简单、系统化且更具可读性。为了实现这一点，不要过度使用 `try` 语句。在许多程序中，在\
  \ `throw` 和能够合理处理所抛出异常的函数之间通常有几十次函数调用。因此，大多数函数应该只需允许异常沿调用栈向上传播。使错误处理变得简单且系统的主要技术（称为*资源获取即初始化；RAII*）已在\
  \ §5.2.2 中进行了解释。RAII 的基本思想是让构造函数获取类运行所需的资源，并让析构函数释放所有资源，从而确保资源释放的保证和隐式。\n\n## 4.3\
  \ 不变性\n\n使用异常来信号越界访问是一个函数检查其参数并由于基本假设（即*前置条件*）不成立而拒绝执行操作的示例。如果我们正式指定了 `Vector` 的下标运算符，我们会说“索引必须在\
  \ `0:size()` 范围内”，而这正是我们在 `operator[]` 中测试的。`a:b` 表示法指定半开区间，意味着 `a` 在范围内，但 `b` 不。每当我们定义一个函数时，都应该考虑它的前置条件是什么，并考虑是否测试它们\
  \ (§4.4)。对于大多数应用程序，测试简单的不变性是一个好主意；参见 4.5。\n\n然而，`operator[]()` 作用于 `Vector` 类型的对象，除非\
  \ `Vector` 的成员具有“合理”的值，否则它的任何操作都没有意义。特别是，我们说 `elem` 指向一个包含 `sz` 个 double 的数组，但这只是在注释中说的。这种对假设真实的陈述被称为*类不变性*，或简单的*不变性*。构造函数的职责是为类建立不变性（以便成员函数依赖它），成员函数的职责是在退出时确保不变性仍然成立。遗憾的是，我们的\
  \ `Vector` 构造函数只部分完成了工作。它正确了 `Vector` 成员，但未能检查传递它的参数是否合理。考虑：\n\n```\nVector v(-27);\n\
  ```\n\n这可能会导致混乱。\n\n这里有一个更合适的定义：\n\n点击此处查看代码图像\n\n```\nVector::Vector(int s)\n{\n\
  \        if (s<0)\n                throw length_error{\"Vector constructor: negative\
  \ size\"};\n        elem = new double[s];\n        sz = s;\n}\n```\n\n我使用标准库异常 `length_error`\
  \ 来报告负数量元素，因为某些标准库操作使用该异常来报告此类问题。如果运算符 `new` 无法找到分配所需的内存，它会抛出 `std::bad_alloc`。我们现在可以写：\n\
  \n点击此处查看代码图像\n\n\n\n\n\n```\nvoid test(int n)\n{\n        try {\n              \
  \  Vector v(n);\n        }\n        catch (std::length_error& err) {\n         \
  \       // ... handle negative size ...\n        }\n        catch (std::bad_alloc&\
  \ err) {\n                // ... handle memory exhaustion ...\n        }\n}\n\n\
  void run()\n{\n        test(-27);                             // throws length_error\
  \ (-27 is too small)\n        test(1 000 000 000);           // may throw bad_alloc\n\
  \        test(10);                              // likely OK\n}\n```\n\n当你请求的内存超过了机器提供的内存，或者你的程序已经消耗了几乎所有内存且你的请求使其超过了限制时，就会发生内存耗尽。请注意，现代操作系统通常提供的空间会比物理内存一次能容纳的要多，因此在触发\
  \ `bad_alloc` 之前，请求过多的内存可能会导致严重的变慢。\n\n你可以定义自己的类作为异常，并根据需要，从检测到错误的地方到处理错误的地方携带少少或多的信息（§4.2）。没有必要使用标准库的异常层次结构。\n\
  \n通常情况下，函数在抛出异常后没有方法完成其分配的任务。这时，“处理”异常意味着进行最少的局部清理并重新抛出异常。例如：\n\n点击此处查看代码图像\n\n\
  ```\nvoid test(int n)\n{\n        try {\n                Vector v(n);\n        }\n\
  \        catch (std::length_error&) {     // 做一些处理并重抛\n                cerr << \"\
  test failed: length error\\n\";\n                throw;      // rethrow\n      \
  \  }\n        catch (std::bad_alloc&) {         // 哎！这个程序没有设计用于处理内存耗尽\n        \
  \        std::terminate();       // 终止程序\n        }\n}\n```\n\n在设计良好的代码中，`try`块很少见。通过系统地使用\
  \ RAII 技术（§5.2.2, §6.3）来避免过度使用。\n\n不变性（invariants）的概念是类设计的核心，而前提条件（preconditions）在函数设计中起着类似的作用：\n\
  \n* 制定不变性有助于我们精确地理解我们想要。\n* 不变性强制我们变得具体；这让我们有更大的机会编写正确的代码。\n\n不变性的概念是 C++ 资源管理概念的基础，这些概念由构造函数（第\
  \ 5 章）和析构函数支持 (§5.2.2, §15.2.1）。\n\n## 4.4 错误处理替代\n\n错误处理是所有现实软件中的主要问题，因此有很多方法。如果检测到错误且无法在函数本地处理，函数必须以某种方式向调用者通信该问题。抛出异常是\
  \ C++ 实现此目的的最通用机制。\n\n某些语言的异常设计仅仅是为了提供一种返回返回的替代机制。C++ 并不是这种语言：异常的设计是为了报告完成给定任务的失败。异常与构造函数和析构函数集成，为错误处理和资源管理提供了一个一致的框架（§5.2.2,\
  \ §6.3）。编译器经过优化，使得返回一个值比将相同的值作为异常抛出要便宜得多。\n\n抛出异常并不是报告无法本地处理错误的唯一方法。函数可以通过以下方式指示其无法执行分配的任务：\n\
  \n* 抛出异常\n* 以某种方式返回一个指示失败的值\n* 终止程序（通过调用 `terminate()`、`exit()` 或 `abort()` 等函数\
  \ (§16.8）。\n\n在以下情况下，我们返回一个错误指示器（一个“错误代码”）：\n\n* 失败是正常且符合预期的。例如，打开文件的请求失败是非常正常的（可能没有该名称的文件，或者可能无法按照请求的权限打开该文件）。\n\
  * 直接调用者可以被合理地预期处理该失败。\n* 错误发生在一组并行任务中的某一个，我们需要知道是哪个任务失败了。\n* 系统内存如此稀，以至于异常的运行时支持会挤占核心功能。\n\
  \n在以下情况下，我们抛出异常：\n\n* 错误极其罕见，以至于程序员可能会忘记检查它。例如，你上次检查 `printf()` 的返回值是什么时候？\n* 错误无法由直接调用者处理。相反，错误必须沿着调用链向上回溯到“最终调用者”。例如，让应用程序中的每个函数都可靠地处理每一次分配失败和网络中断是不可行的。\n\
  * 底层模块中可以添加新类型的错误，使得高层模块无需编写来应对此类错误。例如，当之前的单线程应用程序被修改为使用多线程，或资源被放置在远程以便访问时。\n* 没有合适的错误返回路径。例如，构造函数没有供“调用者”检查的返回值。由于需要同时返回一个值和一个错误指示器（例如，`pair`；§15.3.3），函数的返回路径变得更加复杂或昂贵，可能导致输出参数、非本地错误状态或其他变通。\n\
  * 从错误的恢复取决于多次函数调用的结果，导致需要在调用之间维护局部状态以及复杂的控制结构。\n* 发现错误的函数是回调（一个函数参数），因此直接调用者可能甚至不知道了哪个函数。\n\
  * 错误意味着需要某些“撤销操作”（§5.2.2](#ch05.xhtml_sec5_2_2)）。\n\n在以下情况下，我们终止：\n\n* 错误是一种无法恢复的类型。例如，对于许多（并非所有）系统来说，没有合理的方法从内存耗尽中恢复。\n\
  * 系统是那种一旦检测到非平凡错误就基于重启线程、进程或计算机来处理错误的系统。\n\n确保终止的一种方法是向函数添加 `noexcept` (§4.5.3)，这样函数实现中的任何\
  \ `throw` 都会转换为 `terminate()`。请注意，某些应用程序无法接受无条件的终止，因此必须使用替代方案。通用类型库绝不应该无条件的终止。\n\
  \n\n\n\n\nRAII (§5.2.2, §6.3) 对于使用异常进行简单高效的错误处理至关重要。充斥着`try`块的代码往往反映了为错误码设计的错误处理策略中最糟糕的方面。\n\
  \n## 4.5 断言 (Assertions)\n\n目前还没有一种通用且标准的方法对不变性、前置条件等编写可选的运行时测试。然而，对于许多大型程序，需要支持那些在测试时依赖大量运行时检查，但在部署代码时使用最少检查的用户。\n\
  \n目前，我们不得不依赖于临时的机制。这类机制有很多种。它们需要是灵活的、通用的，并且在未启用时不产生开销。这意味着概念上要简单，实现上要精细。这里是我使用过的一种方案：\n\
  \n点击此此处查看代码图像\n\n```\nenum class Error_action { ignore, throwing, terminating, logging\
  \ };                // 错误处理替代方案\n\nconstexpr Error_action default_Error_action =\
  \ Error_action::throwing;          // 默认值\n\nenum class Error_code { range_error,\
  \ length_error };                                        // 具体的错误\n\nstring error_code_name[]\
  \ { \"range error\", \"length error\" };                               // 错误名称\n\
  \ntemplate<Error_action action = default_Error_action, class C>\nconstexpr void\
  \ expect(C cond, Error_code x) // 如果期望条件 \"cond\" 不成立，则执行 \"action\"\n{\n      \
  \  if constexpr (action == Error_action::logging)\n            if (!cond()) std::cerr\
  \ << \"expect() failure: \" << int(x) << '' << error_code_name[int(x)] << '\\n';\n\
  \        if constexpr (action == Error_action::throwing)\n            if (!cond())\
  \ throw x;\n        if constexpr (action == Error_action::terminating)\n       \
  \     if (!cond()) terminate();\n        // 或者不执行操作\n}\n```\n\n初看之下这可能令人困惑，因为使用的许多语言特性并没有直接呈现。然而，正如要求的，它既非常灵活又易于使用。例如：\n\
  \n点击此此处查看代码图像\n\n```\ndouble& Vector::operator[](int i)\n{\n        expect([i,this]\
  \ { return 0<=i<size(); }, Error_code::range_error);\n        return elem[i];\n\
  }\n```\n\n这检查下标是否在范围内，如果不在，则采取默认操作（抛出异常）。期望成立的条件 `0<=i<size()` 作为 lambda 表达式传递给\
  \ `expect()`：`[i,this]{return 0<=i<size();}` (§7.3)。`if constexpr` 测试在编译时完成 (§7.4)，因此对每次调用\
  \ `expect()` 最多执行一次运行时测试。将 `action` 设置为 `Error_action::ignore` 则不采取任何操作，且不会为 `expect()`\
  \ 生成任何代码。\n\n通过设置 `default_Error_action`，用户可以为特定的部署选择操作，例如 `terminating` 或 `logging`。为了支持日志记录，需要定义\
  \ `error_code_name` 表。可以使用 `source_location` (§16.5) 来改进日志信息。\n\n在许多系统中，像 `expect()`\
  \ 这样的断言机制能够为断言失败的含义提供单一控制点是非常重要的。在大型代码库中搜索真正检查假设的 `if` 语句通常是不切行的。\n\n### 4.5.1 assert()\n\
  \n标准库提供了调试宏 `assert()`，用于断言某个条件在运行时必须成立。例如：\n\n点击此此处查看代码图像\n\n```\nvoid f(const\
  \ char* p)\n{\n        assert(p!=nullptr);    // p 不能为 nullptr\n        // ...\n\
  }\n```\n\n如果 `assert()` 的条件在“调试模式”下失败，程序将终止。如果不在调试模式下，则不对 `assert()` 不进行检查。这种方法很粗糙且缺乏活性，但通常比什么都没有要好。\n\
  \n### 4.5.2 静态断言 (Static Assertions)\n\n异常在运行时报告错误。如果可以在编译时发现错误，通常是更好的选择。这正是类型系统以及为用户定义类型指定接口的功能所在所在。然而，我们也可以对大多数编译时已知的属性进行简单检查，并将失败作为编译器错误消息报告。例如：\n\
  \n点击此此处查看代码图像\n\n```\nstatic_assert(4<=sizeof(int), \"integers are too small\");\
  \    // 检查整数大小\n```\n\n如果 `4<=sizeof(int)` 不成立，将写入一条消息；也就是说，如果系统上的 `int` 至少没有 4\
  \ 个字节。我们把此类语句称为断言。\n\n`static_assert` 机制可以用于任何可以用常量表达式表示的内容 (§1.6)。例如：\n\n点击此此处查看代码图像\n\
  \n```\nconstexpr double C = 299792.458;                               // km/s\n\n\
  void f(double speed)\n{\n        constexpr double local_max = 160.0/(60);      \
  \     // 160 km/h\n\n        static_assert(speed<C,\"can't go fast\");         \
  \     // 必须是常量\n        static_assert(local_max<C,\"can't go fast\");         //\
  \ OK\n\n        // ...\n}\n```\n\n通常情况下，`static_assert(A,S)` 在 `A` 为假时会打印 `S`。如果你不想打印特定的消息，可以省略\
  \ `S`，编译器将提供默认消息：\n\n点击此此处查看代码图像\n\n```\nstatic_assert(4<=sizeof(int));        \
  \                    // 使用默认消息\n```\n\n默认消息是 `static_assert` 的位置加上断言谓词的表示。`static_assert`\
  \ 的一个重要用法是对泛型编程中使用的类型进行断言 (§8.2, §16.4)。\n\n### 4.5.3 noexcept\n\n不抛异常的函数可以声明为 `noexcept`。例如：\n\
  \n点击此此处查看代码图像\n\n```\nvoid user(int sz) noexcept\n{\n        Vector v(sz);\n   \
  \     iota(&v[0],&v[sz],1);                           // 填充 1,2,3... (见 §17.3)\n\
  \        // ...\n}\n```\n\n如果所有的努力和计划都失败，导致 `user()` 仍然抛出异常，将调用 `std::terminate()`。\n\
  \n在函数上随洒 `noexcept` 是危险的。如果一个 `noexcept` 函数调用了一个期望捕获并处理的异常，`noexcept` 会将其转换为致命错误。此外，`noexcept`\
  \ 迫使通过某种形式的错误码来处理错误，而这些可能是复杂的、易错且昂贵的 (§4.4)。与其他许多强大的语言特性一样，`noexcept` 应该在理解的基础上谨慎使用。\n\
  \n\n\n\n\n- [9] 不要尝试在每个函数中捕获所有异常；§4.4; [CG: E.7]。\n\n- [10] 你不必使用标准库的异常类层次；§4.3。\n\
  \n- [11] 优先使用 RAII 而不是显式的 `try`-块；§4.2, §4.3; [CG: E.6]。\n\n- [12] 让构造函数建立不变性，如果无法建立则抛出异常；§4.3;\
  \ [CG: E.5]。\n\n- [13] 围绕不变性设计你的错误处理策略；§4.3; [CG: E.4]。\n\n- [14] 编译可以检查的内容通常最好在编译时进行检查；§4.5.2\
  \ [CG: P.4] [CG: P.5]。\n\n- [15] 使用断言机制提供对失败含义的单一控制点；§4.5。\n\n- [16] 概念 (§8.2) 是编译时谓词，因此在断言中通常有用；§4.5.2。\n\
  \n- [17] 如果你的函数可能不会抛出异常，将其声明为 `noexcept`；§4.4; [CG: E.12]。\n\n- [18] 不要不加思考地应用 `noexcept`；§4.5.3。\n\
  \n# 5 类\n\n*这些类型并不是“抽象”的，它们和 `int` 以及 `float` 一样真实。*\n\n*– Doug McIlroy*\n\n* 介绍\n\
  \    * 类\n* 具体类型\n    * 算术类型; 容器; 初始化容器\n* 抽象类型\n* 虚函数\n* 类层次结构\n    * 层次层次结构的益处;\
  \ 层次结构导航; 避免资源泄漏\n* 建议\n\n## 5.1 介绍\n\n本章和接下来的三章旨在让你对 C++ 对抽象和资源管理的支持有一个大致的了解，而不涉及过多细节：\n\
  \n* 本章非正式地介绍了定义和使用新类型（*用户定义类型*）的方法。特别是，它展示了用于*具体类*、*抽象类*和*类层次结构*的基本属性、实现技术和语言设施。\n\
  * 第 6 章 介绍了 C++ 中具有含义的操作，例如构造函数、析构函数和赋值。它概述了结合使用这些内容的规则，以控制对象的周期并支持简单、高效且完整的资源管理。\n\
  * 第 7 章 引入了模板，作为与其他类型和算法对类型和算法参数化的机制。对用户定义类型和内置类型的计算表示为函数，有时会泛化为*函数模板*和*函数对象*。\n\
  * 第 8 章 概述了泛型编程的基础概念、技术和语言特性。重点是定义和使用*概念*，以精确指定模板的接口并指导设计。引入了*变长模板*来指定最通用、最灵活的接口。\n\
  \n这些是支持被称为*面向对象编程*和*泛型编程*的风格的语言设施。第 9 章–第 18 章 随后介绍了标准库设施示例及其用法。\n\n### 5.1.1 类\n\
  \nC++ 的核心语言特性是*类*。类是一种用户定义的类型，用于表示程序代码中的实体。每当我们对程序设计有一个实用的想法、实体、数据集合等时，我们尝试在程序中将其表示为一个类，以便该想法存在于代码中，而不仅仅存在于脑脑中、设计文档或某些注释中。由一组选择良好的类构建的程序，比直接用内置类型构建一切的程序更容易理解且写正确。特别是，类通常是库提供的对象。\n\
  \n基本上，除了基本类型、运算符和语句之外的所有语言设施都是为了帮助定义更好的类或更方便地使用它们。我所说的“更好”，是指更正确、更易维护、更高效、更易用、更易读且更容易推理。类的需求和口味差异巨大。因此，对类的支持是广泛的。在这里，我们考虑对三类类的基本支持：\n\
  \n* 具体类 (5.2)\n* 抽象类 (5.3)\n* 层次结构中的类 (5.5)\n\n惊人数量有用类被证明是这些类型中的一种。甚至更多的类可以被视为这些类的简单变体。\n\
  \n## 5.2 具体类型\n\n*具体类*的基本思想是它们的行为“就像内置类型一样”。例如，复数类型和无限精度整数与内置类型非常相似，当然，它们有自己的语义和一组操作。同样，`vector`\
  \ 和 `string` 与内置数组非常相似，区别在于它们更灵活且行为更好（10.2, 11.3, 12.2）。\n\n具体类型的定义特征是其表示形式是其定义的一部分。在许多重要情况下（例如\
  \ `vector`），该表示形式仅指向存储在其他处的数据，但该表示形式存在类的每个对象中。这允许实现在时间和空间上达到最优效率。特别是，它允许我们\n\n*\
  \ 将具体类型的对象放在栈上、静态分配内存中和其他对象中（1.5）。\n* 直接引用对象（而不是通过指针或引用）。\n* 立即且完全地初始化对象（例如使用构造函数；2.3）。\n\
  * 拷贝和移动对象（6.2）。\n\n表示可以是私有的且仅通过成员函数访问（如 `Vector`；2.3），但它是存在的。因此，如果表示发生任何重大变化，用户必须重新编译。这是让具体类型表现完全像内置类型的代价。对于不经常改变且局部变量可以提供所需清晰度和效率类型，这种代价是可以接受的且通常是理想的。为了增加灵活性，具体类型可以表示的大部分放在自由存储（动态内存，堆）上，并通过存储在类对象本身的部分进行访问。这就是\
  \ `vector` 和 `string` 的实现方式；它们可以被视为具有精心设计的接口的资源句柄。\n\n### 5.2.1 算术类型\n\n“经典的用户定义算术类型”是\
  \ `complex`：\n\n点击此处查看代码图像\n\n\n\n\n\n```cppclass complex {\n        double re,\
  \ im;   // representation: two doubles\npublic:\n        complex(double r, double\
  \ i) :re{r}, im{i} {}       // construct complex from two scalars\n        complex(double\
  \ r) :re{r}, im{0} {}                     // construct complex from one scalar\n\
  \        complex() :re{0}, im{0} {}                                   // default\
  \ complex: {0,0}\n\n        double real() const { return re; }\n        void real(double\
  \ d) { re=d; }\n        double imag() const { return im; }\n        void imag(double\
  \ d) { im=d; }\n\n        complex& operator+=(complex z)\n        {\n          \
  \      re+=z.re;                  // add to re and im\n                im+=z.im;\n\
  \                return *this;             // return the result\n        }\n\n \
  \       complex& operator-=(complex z)\n        {\n                re-=z.re;\n \
  \               im-=z.im;\n                return *this;\n        }\n\n        complex&\
  \ operator*=(complex);        // defined out-of-class somewhere\n        complex&\
  \ operator/=(complex);        // defined out-of-class somewhere\n};\n```\n\n这是标准库中\
  \ `complex` 的简化版本（§17.4）。类定义本身只包含访问表示所需的操作。该表示简单且符合惯例。出于实际考虑，它必须与 60 年前的 Fortran\
  \ 提供的类型兼容，并且我们需要一组常规的运算符。除了逻辑需求外，`complex` 必须是高效的，否则它将不会被使用。这意味着简单操作必须是内联（inlined）。也就是说，简单操作（如构造函数、`+=`\
  \ 和 `imag()`）在生成的机器代码中必须在没有函数调的情况下实现。类中定义的函数默认是内联的。可以通过在函数声明前加上 `inline` 关键字来显式请求内联。工业级的\
  \ `complex`（如标准库中的版本）经过仔细实现以执行适当的内联。此外，标准库 `complex` 将此处显示的函数声明为 `constexpr`，以便我们可以在编译时进行复数运算。\n\
  \n拷贝赋值和拷贝初始化是隐式定义的（§6.2）。\n\n可以在无参数调用的构造函数被称为*默认构造函数*。因此，`complex()` 是 `complex`\
  \ 的默认构造函数。通过定义默认构造函数，你消除了该类型未初始化变量的可能性。\n\n返回实部和虚部的函数的 `const` 修饰符表示这些函数不会修改被调用的对象。`const`\
  \ 成员函数可以被 `const` 对象和非 `const` 对象调用，但非 `const` 成员函数只能被非 `const` 对象调用。例如：\n\n点击此处查看代码图像\n\
  \n```cpp\ncomplex z = {1,0};\nconst complex cz {1,3};\nz = cz;                 \
  \             // OK：赋值给非 const 变量\ncz = z;                              // 错误：赋值给\
  \ const 变量\ndouble x = z.real();         // OK：complex::real() 是 const\n```\n\n\
  许多实用的操作不需要直接访问 `complex` 的表示，因此它们可以与类定义分开定义：\n\n点击此处查看代码图像\n\n```cpp\ncomplex operator+(complex\
  \ a, complex b) { return a+=b; }\ncomplex operator-(complex a, complex b) { return\
  \ a-=b; }\ncomplex operator-(complex a) { return {-a.real(), -a.imag()};       \
  \ // 一元负号\ncomplex operator*(complex a, complex b) { return a*=b; }\ncomplex operator/(complex\
  \ a, complex b) { return a/=b; }\n```\n\n在这里，我利用了按值传递的参数会被拷贝的特性，这样我就可以修改参数而不影响调用者的拷贝，并将其结果作为返回值。\n\
  \n`==` 和 `!=` 的定义非常直观：\n\n点击此处查看代码图像\n\n```cpp\nbool operator==(complex a, complex\
  \ b) { return a.real()==b.real() && a.imag()==b.imag(); }     // 相等\nbool operator!=(complex\
  \ a, complex b) { return !(a==b); }                                            \
  \                 // 不等于\n```\n\n`complex` 类可以这样使用：\n\n点击此处查看代码图像\n\n```cpp\nvoid\
  \ f(complex z)\n{\n        complex a {2.3};              // 从 2.3 构造 {2.3,0.0}\n\
  \        complex b {1/a};\n        complex c {a+z*complex{1,2.3}};\n        if (c\
  \ != b)\n                c = -(b/a)+2*b;\n}\n```\n\n编译器将涉及复数的运算符转换为适当的函数调用。例如，`c!=b`\
  \ 意味着 `operator!=(c,b)`，而 `1/a` 意味着 `operator/(complex{1},a)`。\n\n用户定义的运算符（重载运算符）应该谨慎且按照惯例地使用（§6.4）。语法由语言固定的，所以你不能定义一元的\
  \ `/`。此外，无法更改内置类型运算符的含义，因此你不能重定义 `+` 来减去 `int`。\n\n### 5.2.2 容器\n\n*容器*（container）是一个持有元素集合的对象。我们把\
  \ `Vector` 类称为容器，因为 `Vector` 类型的对象就是容器。正如§2.3 定义所示，`Vector` 并不是不合理的 `double` 容器：它容易理解，建立了一个有用的不变性（§4.3），提供了范围检查访问（§4.2），并提供了\
  \ `size()` 允许我们遍历其元素。然而，它确实有一个致命缺陷：它使用 `new` 分配元素但从不释放它们。这不是一个好主意，因为 C++ 没有提供垃圾回收器将未使用内存提供给新对象。在某些环境中，你无法使用回收器，而且你通常倾向于对析构进行更精确的控制。我们需要一种机制来确保构造函数分配的内存被释放；这种机制就是*析构函数*（destructor）：\n\
  \n点击此处查看代码图像\n\n```cpp\nclass Vector {\npublic:\n        Vector(int s) :elem{new[s]},\
  \ sz{s}        // 构造函数：获取资源\n        {\n                for (int i=0; i!=s; ++i)\
  \                // 初始化元素\n                        elem[i]=0;\n        }\n\n   \
  \     ~Vector() { delete[] elem; }                              // 析构函数：释放资源\n\n\
  \        double& operator[](int i);\n        int size() const;\nprivate:\n     \
  \   double* elem;           // elem 指向 double 数组\n        int sz;\n};\n```\n\n析构函数的名称是运算符\
  \ `~` 加上类名；它是构造函数的对应。\n\n`Vector` 的构造函数使用 `new` 运算符在存储区（也称为*堆*或动态内存）上分配内存。析构函数通过\
  \ `delete[]` 运算符释放该内存。普通的 `delete` 删除单个对象；`delete[]` 删除一个数组。\n\n这一切在 `Vector` 用户无需干预的情况下完成。用户只需创建和使用\
  \ `Vector`，就像使用内置类型的变量一样。例如：\n\n点击此处查看代码图像\n\n```cpp\nVector gv(10);           \
  \                       // 全局变量；gv 在程序结束时析构\n\nVector* gp = new Vector(100); //\
  \ 存储区上的 Vector；不会被隐式析构\n\nvoid fct(int n)\n{\n        Vector v(n);\n        // ...\
  \ 使用 v ...\n        {\n                Vector v2(2*n);\n                // ... 使用\
  \ v 和 v2 ...\n        } // v2 在此处析构\n        // ... 使用 v ..\n} // v 在此处析构\n```\n\
  \n\n\n\n\n`Vector` 在命名、作用域、分配、生命周期等方面遵循相同的规则（见 §1.5），内置类型（如 `int` 和 `char`）也是如此。这个\
  \ `Vector` 通过省略错误处理进行了简化；请参阅 §4.4。\n\n构造构造函数/析构函数的组合是许多优雅技巧的基础。特别是，它是大多数 C++ 通用资源管理技术的基础（§6.3,\
  \ §15.2.1）。考虑一个 `Vector` 的图形化说明：\n\n![Images](img/f0058-02.jpg)\n\n构造函数分配元素并相应地初始化\
  \ `Vector` 成员。析构函数释放元素。这种*句柄数据模型*（handle-to-data model）被广泛用于管理在对象生命周期内大小可能会变化的数据。在构造函数中获取资源并在析构函数中释放资源的技术被称为*资源获取初始化*，或\
  \ *RAII*。它允许我们消除“裸露的 `new` 操作”，即避免在通用代码中进行分配，并将它们隐藏在良好抽象的实现内部。同样，也应该避免“裸露的 `delete`\
  \ 操作”。避免裸露的 `new` 和裸露的 `delete` 可以使代码不易出错，并且更容易保持不发生资源泄漏（§15.2.1）。\n\n### 5.2.3\
  \ 初始化容器\n\n容器的存在是为了存放元素，因此我们显然需要方便的方法将元素放入容器中。我们可以创建一个具有适当数量元素的 `Vector`，然后稍后对这些元素进行赋值，但通常其他方法更优雅。在这里，我只提到两种最喜爱的：\n\
  \n*   *初始化列表构造函数*（Initializer-list constructor）：使用元素列表进行初始化。\n*   `push_back()`：在序列的末尾（后部）添加新元素。\n\
  \n这些方法可以这样声明：\n\n点击此处查看代码图像\n\n```\nclass Vector {\npublic:\n        Vector(); \
  \                                                      // 默认初始化为“空”即没有元素\n     \
  \   Vector(std::initializer_list<double>);        // 使用 double 列表初始化\n        //\
  \ ...\n        void push_back(double);                           // 在末尾添加元素，大小加一\n\
  \        // ...\n};\n```\n\n`push_back()` 适用于输入任意数量的元素。例如：\n\n点击此处查看代码图像\n\n```\n\
  Vector read(istream& is)\n{\n        Vector v;\n        for (double d; is>>d; )\
  \                // 将浮点值读入 d\n                v.push_back(d);                 //\
  \ 将 d 添加到 v\nreturn v;\n}\n```\n\n输入循环通过文件结束符或格式错误终止。在这种情况发生之前，读取的每个数字都会被添加到 `Vector`\
  \ 中，因此最后，`v` 的大小就是读取的元素数量。我使用 `for`-语句而不是更传统的 `while`-语句是为了将 `d` 的作用域限制在循环内。\n\n\
  从 `read()` 返回可能的海量数据可能是昂贵的。要保证返回 `Vector` 是廉价的方法，是为它提供移动构造函数（§6.2.2）：\n\n点击此处查看代码图像\n\
  \n```\nVector v = read(cin);        // 这里没有 Vector 元素的拷贝\n```\n\n`std::vector` 的表示方式使得\
  \ `push_back()` 和其他改变 `vector` 大小的操作非常高效，这见 §12.2。\n\n用于定义初始化列表构造函数的 `std::initializer_list`\
  \ 是编译器已知的标准库类型：当我们使用 `{}` 列表时（例如 `{1,2,3,4}`），编译器将创建一个 `initializer_list` 类型的对象并传递给程序。因此，我们可以写：\n\
  \n点击此处查看代码图像\n\n```\nVector v1 = {1, 2, 3, 4, 5};                // v1 有 5 个元素\n\
  Vector v2 = {1.23, 3.45, 6.7, 8};        // v2 有 4 个元素\n```\n\n`Vector` 的初始化列表构造函数可能定义如下：\n\
  \n点击此处查看代码图像\n\n```\nVector::Vector(std::initializer_list<double> lst)        //\
  \ 使用列表初始化\n        :elem{new double[lst.size()]}, sz{static_cast<int>(lst.size())}\n\
  {\n        copy(lst.begin(),lst.end(),elem);               // 从 lst 拷贝到 elem (§13.5)\n\
  }\n```\n\n遗憾的是，标准库使用 `unsigned` 整数作为大小和下标，因此我们需要使用丑陋的 `static_cast`。这是很死板的，因为数字大于\
  \ 32,767（16 位整数）或 2,147,483,647（32 位整数）的概率很低。然而类型系统没有常识，所以它可能会报错。显式类型转换（通常称为*强制转换*）是容易出错的。明智地使用类型系统和良好的库允许我们消除高层软件中的未检查转换。\n\
  \n## 5.3 抽象类型\n\n`complex` 和 `Vector` 等类型被称为*具体类型*（concrete types），因为它们的表示是定义的一部分。在这一点上它们类似于内置类型。相反，*抽象类型*（abstract\
  \ type）是一种完全隔绝用户实现的类型。为了做到，我们将接口与表示解耦并放弃局部变量。由于我们不了解抽象类型的表示（甚至不知道大小），我们必须在自由存储上分配对象（§5.2.2）并通过引用或指针访问它们（§1.7,\
  \ §15.2.1）。\n\n首先，我们定义 `Container` 类的接口，将其设计为 `Vector` 的更抽象的版本：\n\n点击此处查看代码图像\n\n\
  ```\nclass Container {\npublic:\n        virtual double& operator[](int) = 0;  \
  \     // 纯虚函数\n        virtual int size() const = 0;                     // const\
  \ 成员函数 (§5.2.1)\n        virtual ~Container() {}                    // 析构函数 (§5.2.2)\n\
  };\n```\n\n该类是对后续定义的特定容器的纯接口。`virtual` 意味着“在派自此类的类中可以被重定义”。不出，声明为 `virtual` 的函数被称为*虚函数*（virtual\
  \ function）。派自 `Container` 的类提供了 `Container` 接口的实现。奇特的 `=0` 语法表示该函数是*纯虚函数*（pure\
  \ virtual）；即派自 `Container` 的某些类*必须*定义该函数。因此，无法定义一个纯 `Container` 对象。例如：\n\n点击此处查看代码图像\n\
  \n```\nContainer c;                                                         // 错误：抽象类不能实例化\n\
  Container* p = new Vector_container(10);        // OK：Container 是 Vector_container\
  \ 的接口\n```\n\n\n\n\n一个 `Container` 只能作为实现了其 `operator[]() ` 和 `size()` 函数的类的接口。具有纯虚函数的类被称为*抽象类*。\n\
  \n这个 `Container` 可以像这样使用：\n\n点击此处查看代码图像\n\n```\nvoid use(Container& c)\n{\n    \
  \    const int sz = c.size();\n\n        for (int i=0; i!=sz; ++i)\n           \
  \     cout << c[i] << '\\n';\n}\n```\n\n注意 `use()` 如何在完全不考虑实现细节的情况下使用 `Container`\
  \ 接口。它使用了 `size()` 和 `[ ]`，而完全不知道具体是哪种类型提供了它们的实现。为多种其他类提供接口的类通常被称为*多态类型*。\n\n与抽象类的常见情况，`Container`\
  \ 没有构造函数。毕竟，它没有任何数据需要初始化。另一方面，`Container` 确实有一个析构函数，并且该析构函数是 `virtual` 的，这样派生自 `Container`\
  \ 的类就可以提供实现。这在抽象类中也很常见，因为它们往往通过引用或指针进行操作，而通过指针销毁 `Container` 的人并不知道其实现拥有哪些资源；另参见\
  \ §5.5。\n\n抽象类 `Container` 只定义了接口，而没有实现。为了让 `Container` 变得有用，我们必须实现一个实现了其接口所需函数的容器。为了这一点，我们可以使用具体类\
  \ `Vector`：\n\n点击此处查看代码图像\n\n```\nclass Vector_container : public Container {  \
  \  // Vector_container implements Container\npublic:\n        Vector_container(int\
  \ s) : v(s) { }       // 有 s 个元素的 Vector\n        ~Vector_container() {}\n\n   \
  \     double& operator[](int i) override { return v[i]; }\n        int size() const\
  \ override { return v.size(); }\nprivate:\n        Vector v;\n};\n```\n\n`:public`\
  \ 可以读作“派生自”或“是……的子类型”。说 `Vector_container` 类*派生*自 `Container` 类，而说 `Container` 类是\
  \ `Vector_container` 类的*基类*。另一种术语将 `Vector_container` 和 `Container` 分称为*子类*和*父类*。派生类被认为继承其基类的成员，因此基类和派生类的使用通常被称为*继承*。\n\
  \n成员 `operator[]() ` 和 `size()` 被认为覆盖了*基类 `Container` 中对应的成员。我使用了显式的 `override`\
  \ 来明确意图。使用 `override` 是可选的，但显式使用允许编译器捕获错误，例如函数名的拼写错误，或者 `virtual` 函数类型与其预期的重写函数类型之间的细微差异。显式使用\
  \ `override` 在较大的类层次结构中特别有用，否则在其他情况下，很难知道什么应该重写什么。\n\n析构函数（`~Vector_container()`）覆盖了基类析构函数（`~Container()`）。注意，成员析构函数（`~Vector()`）会被其类的析构函数（`~Vector_container()`）隐式调用。\n\
  \n为了让像 `use(Container&)` 这样的函数能够在完全不考虑实现细节的情况下使用 `Container`，必须有其他函数创建一个可以对其操作的对象。例如：\n\
  \n点击此处查看代码图像\n\n```\nvoid g()\n{\n        Vector_container vc(10);       // 有十个元素的\
  \ Vector\n        // ... 填充 vc ...\n        use(vc);\n}\n```\n\n由于 `use()` 不知道 `Vector_container`\
  \ 但只知道 `Container` 接口，因此它对 `Container` 的不同实现也同样有效。例如：\n\n点击此处查看代码图像\n\n```\nclass\
  \ List_container : public Container {         // List_container implements Container\n\
  public:\n        List_container() { }          // 空列表\n        List_container(initializer_list<double>\
  \ il) : ld{il} { }\n        ~List_container() {}\n\n        double& operator[](int\
  \ i) override;\n        int size() const override { return ld.size(); }\n\nprivate:\n\
  \        std::list<double> ld;         // (标准库) double 类型的列表 (§12.3)\n};\n\ndouble&\
  \ List_container::operator[](int i)\n{\n        for (auto& x : ld) {\n         \
  \       if (i==0)\n                        return x;\n                --i;\n   \
  \     }\n        throw out_of_range{\"List container\"};\n}\n```\n\n在这里，表示是标准库的\
  \ `list<double>`。通常，我不会使用 `list` 实现一个带有下标操作的容器，因为与 `vector` 的下标操作相比，`list` 下下标性能非常糟糕。然而，在这里我只是展示一种与通常实现完全不同的实现。\n\
  \n一个函数可以创建一个 `List_container` 并让 `use()` 使用它：\n\n点击此处查看代码图像\n\n```\nvoid h()\n{\n\
  \        List_container lc = {1, 2, 3, 4, 5, 6, 7, 8, 9};\n        use(lc);\n}\n\
  ```\n\n点在于 `use(Container&)` 不知道参数是 `Vector_container`、`List_container` 还是其他类型的容器；它只知道\
  \ `Container` 定义的接口。因此，如果 `List_container` 的实现发生变化或使用了派生自 `Container` 的新类，`use(Container&)`\
  \ 不需要重新编译。\n\n这种灵活性的代价是必须通过指针或引用操作对象（6.2、15.2.1）。\n\n## 5.4 虚函数\n\n再次考虑 `Container`\
  \ 的使用：\n\n点击此处查看代码图像\n\n```\nvoid use(Container& c)\n{\n        const int sz = c.size();\n\
  \n        for (int i=0; i!=sz; ++i)\n                cout << c[i] << '\\n';\n}\n\
  ```\n\n`use()` 中的 `c[i]` 如何解析到正确的 `operator[]()`？当 `h()` 调用 `use()` 时，必须调用 `List_container`\
  \ 的 `operator[]()`。当 `g()` 调用 `use()` 时，必须调用 `Vector_container` 的 `operator[]()`。为了实现这种解析，`Container`\
  \ 对象必须包含允许其在运行时选择正确函数的信息。通常的实现技术是编译器将虚函数的名称转换为函数指针表的索引。该表通常被称为*虚函数表*或简称为 `vtbl`。每个具有虚函数的类都有自己的标识其虚函数的\
  \ `vtbl`。这可以用图形表示如下：\n\n![图像](https://www.example.com/graphics/f0063-01.jpg)\n\n\
  **vtbl** 中的函数允许对象在调用者未知对象大小和数据布局的情况下被正确使用。调用者的实现只需要知道 `Container` 中指向 `vtbl` 指针的位置以及每个虚函数使用的索引。这种虚调用机制可以变得与“普通函数调用”机制几乎一样高效（差异在\
  \ 25%以内，且对同一对象的重复调用要便宜得多）。它的空间开销是每个虚函数类的每个对象一个指针，加上每个此类类一个 `vtbl`。\n\n\n\n\n`Container`\
  \ 示例是一个非常简单的类层次结构示例。**类层次结构** (`class hierarchy`) 是一组通过派生（例如 `: public`）创建在格中的中的类集合。我们使用类层次结构来表示具有层次关系的概念，例如“消防车是一种卡车，而卡车又是一种车辆”以及“笑脸是一种圆形，而圆形是一种形状”。既深又宽、包含数百个类的巨型层次结构是非常常见的。为了提供一个半实实的经典例子，让我们考虑屏幕上的形状：\n\
  \n![Images](img/f0063-02.jpg)\n\n箭头表示继承关系。例如，`Circle` 类派生自 `Shape` 类。按照习惯，类层次结构的绘图方式是从最基础的类（根节点）向（后定义的）派生类向下生长。为了在代码中表示该简单图，我们必须首先指定一个定义了所有形状通用属性的类：\n\
  \n点击此处查看代码图像\n\n```\nclass Shape {\npublic:\n        virtual Point center() const\
  \ =0;          // pure virtual\n        virtual void move(Point to) =0;\n\n    \
  \    virtual void draw() const = 0;            // draw on current \"Canvas\"\n \
  \       virtual void rotate(int angle) = 0;\n\n        virtual ~Shape() {}     \
  \                         // destructor\n        // ...\n};\n```\n\n自然地，这个接口是一个抽象类：从表示的角度来说，*没有任何*东西（除了指向\
  \ `vtbl` 的指针的位置外）是每个 `Shape` 所共有的。根据这个定义，我们可以编写通用的函数来操作指向形状的针的向量：\n\n点击此处查看代码图像\n\
  \n```\nvoid rotate_all(vector<Shape*>& v, int angle) // rotate v's elements by angle\
  \ degrees\n{\n        for (auto p : v)\n                p->rotate(angle);\n}\n```\n\
  \n要定义一个特定的形状，我们必须说明它是一个 `Shape` 并指定它的特定属性（包括它的虚函数）：\n\n点击此处查看代码图像\n\n```\nclass\
  \ Circle : public Shape {\npublic:\n        Circle(Point p, int rad) :x{p}. r{rad}\
  \ {}               // constructor\n\n        Point center() const override { return\
  \ x; }\n        void move(Point to) override { x = to; }\n        void draw() const\
  \ override;\n        void rotate(int) override {}                // nice simple\
  \ algorithm\nprivate:\n        Point x;     // center\n        int r;          //\
  \ radius\n};\n```\n\n到目前为止，`Shape` 和 `Circle` 示例与 `Container` 和 `Vector_container`\
  \ 示例相比并没有新内容，但我们可以进一步构建：\n\n点击此处查看代码图像\n\n```\nclass Smiley : public Circle {  \
  \ // use the circle as the base for a face\npublic:\n        Smiley(Point p, int\
  \ rad) : Circle{p,rad}, mouth{nullptr} { }\n        ~Smiley()\n        {\n     \
  \           delete mouth;\n                for (auto p : eyes)\n               \
  \         delete p;\n        }\n\n        void move(Point to) override;\n\n    \
  \    void draw() const override;\n        void rotate(int) override;\n\n       \
  \ void add_eye(Shape* s)\n        {\n                eyes.push_back(s);\n      \
  \  }\n\n        void set_mouth(Shape* s);\n        virtual void wink(int i);   \
  \             // wink eye number i\n\n        // ...\n\nprivate:\n        vector<Shape*>\
  \ eyes;                 // usually two eyes\n        Shape* mouth;\n};\n```\n\n\
  `vector` 的 `push_back()` 成员将其参数拷贝到 `vector`（此处为 `eyes`）的最后一个元素，使该向量的大小增加一。\n\n我们现在可以使用调用\
  \ `Smiley` 的基类和成员 `draw()` 来定义 `Smiley::draw()`：\n\n```\nvoid Smiley::draw() const\n\
  {\n        Circle::draw();\n        for (auto p : eyes)\n                p->draw();\n\
  \        mouth->draw();\n}\n```\n\n注意 `Smiley` 将其眼睛保留在标准库 `vector` 中并在析构函数中删除它们的方式。`Shape`\
  \ 的析构函数是 `virtual` 的，而 `Smiley` 的析构函数覆盖了它。虚析构函数对于抽象类是至关重要的，因为派生类对象通常通过其抽象基类提供的接口进行操作。特别是，它可能通过基类指针被\
  \ `delete` 掉。这时虚函数调用机制确保了调用适当的析构函数。该析构函数随后会隐式地调用其基类和成员的析构函数。\n\n在这个简化的示例中，程序员的任务是将眼睛和嘴部适当地放在代表脸的圆内。\n\
  \n当我们通过派生定义新类时，可以添加数据成员、操作或两者兼有。这提供了极大的灵活性，但也带来了困惑和不良设计的可能。\n\n### 5.5.1 层次结构的好处\n\
  \n类层次结构提供两种益处：\n\n*   *接口继承*（Interface inheritance）：在任何需要基类对象的地方可以使用派生类对象。也就是说，基类充当派生类的接口。`Container`\
  \ 和 `Shape` 类就是例子。此类类通常是抽象类。\n*   *实现继承*（Implementation inheritance）：基类提供的函数或数据可以简化派生类的实现。`Smiley`\
  \ 对 `Circle` 构造函数和 `Circle::draw()` 的使用就是例子。\n\n具体类——特别是表示较小的类——与内置类型非常相似：我们定义它们为局部变量，使用它们的名称访问它们，拷贝它们等。类层次结构中的类则不同：我们倾向于使用\
  \ `new` 在自由存储中分配它们，并通过指针或引用访问它们。例如，考虑一个从输入流读取描述形状的数据并构造相应的 `Shape` 对象的函数：\n\n点击此处查看代码图像\n\
  \n```\nenum class Kind { circle, triangle, smiley };\n\nShape* read_shape(istream&\
  \ is)     // read shape from input stream is\n{\n        // ... read shape header\
  \ from is and find its Kind k ...\n\n        switch (k) {\n        case Kind::circle:\n\
  \                // ... read circle data {Point,int} into p and r ...\n        \
  \        return new Circle{p,r};\n        case Kind::triangle:\n               \
  \ // ... read triangle data {Point,Point,Point} into p1, p2, and p3 ...\n      \
  \          return new Triangle{p1,p2,p3};\n        case Kind::smiley:\n        \
  \        // ... read smiley data {Point,int,Shape,Shape,Shape} into p, r, e1, e2,\
  \ and m ...\n                Smiley* ps = new Smiley{p,r};\n                ps->add_eye(e1);\n\
  \                ps->add_eye(e2);\n                ps->set_mouth(m);\n         \
  \       return ps;\n        }\n}\n```\n\n程序可以像这样使用该形状读取器：\n\n点击此处查看代码图像\n\n```\n\
  void user()\n{\n        std::vector<Shape*> v;\n\n        while (cin)\n        \
  \        v.push_back(read_shape(cin));\n\n        draw_all(v);                 \
  \      // call draw() for each element\n        rotate_all(v,45);              \
  \   // call rotate(45) for each element\n\n        for (auto p : v)            \
  \       // remember to delete elements\n                delete p;\n}\n```\n\n\n\n\
  \n\n显然，这个示例是简化的——特别是在错误处理方面——但它生动地说明了 `user()` 完全不知道它正在操作的是哪种类型的形状。`user()` 代码可以编译一次，稍后即可用于程序中新添加的\
  \ `Shape`。请注意，在 `user()` 外部没有指向形状的指针，因此 `user()` 负责释放它们。这是通过 `delete` 运算符实现的，并关键地依赖于\
  \ `Shape` 的虚析构函数。由于该析构函数是虚的，`delete` 会调用最派生类的析构函数。这至关重要，因为派生类可能获取了各种资源（如文件句柄、锁和输出流），这些资源需要释放。在这种情况下，`Smiley`\
  \ 会删除它的 `eyes` 和 `mouth` 对象。一旦完成，它会调用 `Circle` 的析构函数。对象通过构造函数“自下而上”（基类优先）构造，并通过析构函数“自上而下”（派生类优先）析。\n\
  \n### 5.5.2 层次级导航\n\n`read_shape()` 函数返回一个 `Shape*`，以便我们对所有的 `Shapes` 视为同等对待。然而，如果我们想使用某个特定派生类提供的成员函数，例如\
  \ `Smiley` 的 `wink()`，该怎么办呢？我们可以使用 `dynamic_cast` 运算符来询问“这个 `Shape` 是 `Smiley` 吗？”：\n\
  \n点击此处查看代码图像\n\n```\nShape* ps {read_shape(cin)};\n\nif (Smiley* p = dynamic_cast<Smiley*>(ps))\
  \ { // ps 是否指向一个 Smiley?\n        // ... 是一个 Smiley；使用它 ...\n}\nelse {\n       \
  \ // ... 不是 Smiley，尝试其他操作 ...\n}\n```\n\n如果在运行时，`dynamic_cast` 参数（这里是 `ps`）所指向的对象不是预期的类型（这里是\
  \ `Smiley`）或不是预期的类型的派生类，`dynamic_cast` 将返回 `nullptr`。\n\n当一个指向不同派生类对象的指针是一个有效参数时，我们对指针类型使用\
  \ `dynamic_cast`。然后我们测试结果是否为 `nullptr`。这种测试通常可以方便地放在条件中的变量初始化部分。\n\n当另一种类型不可接受时，我们可以简单地\
  \ `dynamic_cast` 到引用类型。如果对象不是预期的类型，`dynamic_cast` 将抛出 `bad_cast` 异常：\n\n点击此处查看代码图像\n\
  \n```\nShape* ps {read_shape(cin)};\nSmiley& r {dynamic_cast<Smiley&>(*ps)};   \
  \   // 在某处捕获 std::bad_cast\n```\n\n当节使用 `dynamic_cast` 时，代码会更整洁。如果我们能避免在运行时测试类型信息，就可以编写更简单、更高效的代码，但偶尔类型信息会丢失且必须恢复。这通常发生在我们将对象传递给某个接受基类指定接口的系统时。当该系统以后将对象传回给我们时，我们可能需要恢复原始类型。与\
  \ `dynamic_cast` 类似的操作被称为“是否为”（is kind of）和“是否实例”（is instance of）操作。\n\n### 5.5.3\
  \ 避免资源泄漏\n\n*泄漏*（leak）是描述我们获取资源但未能释放时发生现象的传统术语。必须避免资源泄漏，因为泄漏会导致系统无法使用被泄漏的资源。因此，随着系统耗尽所需的资源，泄漏最终会导致运行缓慢甚至崩溃。\n\
  \n丰富的程序员会注意到，我在 `Smiley` 示例中留下了三个可能出错的机会：\n\n*   `Smiley` 的实现者可能忘记 `delete` 指向 `mouth`\
  \ 的指针。\n*   `read_shape()` 的用户可能忘记 `delete` 返回的指针。\n*   `Shape` 指针容器的所有者可能忘记 `delete`\
  \ 指针指向的对象。\n\n从这个意义上说，指向在堆（free store）上分配对象的指针是危险的：一个“普通指针”（plain old pointer）不应用于表示所有权。例如：\n\
  \n点击此处查看代码图像\n\n```\nvoid user(int x)\n{\n        Shape* p = new Circle{Point{0,0},10};\n\
  \        // ...\n        if (x<0) throw Bad_x{};     // 潜在泄漏\n        if (x==0)\
  \ return;                 // 潜在泄漏\n        // ...\n        delete p;\n}\n```\n\n\
  除非 `x` 为正数，否则这将泄漏。将 `new` 的结果赋值给“裸指针”是自找麻烦。\n\n解决此类问题的简单方法之一是在需要删除时使用标准库的 `unique_ptr`\
  \ (§15.2.1) 而不是“裸指针”：\n\n点击此处查看代码图像\n\n```\nclass Smiley : public Circle {\n   \
  \     // ...\nprivate:\n        vector<unique_ptr<Shape>> eyes;  // 通常是只眼睛\n   \
  \     unique_ptr<Shape> mouth;\n};\n```\n\n这是一个简单、通用且高效的资源管理技术示例 (§6.3)。\n\n作为此的一个良好的副作用，编译器不再需要为\
  \ `Smiley` 定义析构函数。`unique_ptr` 在离开作用域时会删除对象。现在考虑 `read_shape()`：\n\n点击此处查看代码图像\n\
  \n```\nunique_ptr<Shape> read_shape(istream& is)\n{\n        // ... 从输入读取形状\n  \
  \      switch (k) {\n        case Kind::circle:\n                return unique_ptr<Shape>{new\
  \ Circle{Point{0,0},0}}; // ...\n        case Kind::smiley:\n                return\
  \ unique_ptr<Shape>{new Smiley{Point{0,0},0}}; // ...\n        }\n        return\
  \ nullptr;\n}\n\nvoid user(int x)\n{\n        vector<unique_ptr<Shape>> v;\n\n \
  \       while (cin)\n                v.push_back(read_shape(cin));\n\n        for\
  \ (auto& p : v)\n                draw(*p); // 绘制每个元素\n\n        if (x > 0)\n   \
  \             rotate(v, 45); // 旋转元素\n}\n```\n\n## 5.6 建议\n\n1. 直接在代码中表达想法；§5.1。\n\
  2. 具体类型是最简单的类。可行情况下，优先使用具体类型而不是复杂的类和数据结构；§5.2。\n3. 使用具体类来表示简单的概念；§5.2。\n4. 对于性能关键的组件，优先使用具体类而不是类层次结构；§5.2。\n\
  5. 通过构造函数处理对象的初始化；§5.2.1, §6.1.1。\n6. 只有当需要直接访问类的表示时，才将函数变为成员函数；§5.2.1。\n7. 定义运算符的主要目的是为了习惯用法；§5.2.1。\n\
  8. 对于对称运算符，使用非成员函数；§5.2.1。\n9. 将一个不修改对象状态的成员函数声明为 **const**；§5.2.1。\n10. 如果构造函数获取了资源，该类就需要一个析构函数来释放该资源；§5.2.2。\n\
  11. 避免使用“裸” `new` 和 `delete` 操作；§5.2.2。\n\n\n\n\n\n- [13] 如果一个类是一个容器，请为它提供一个初始化列表构造函数；§5.2.3;\
  \ [CG: C.103]。\n- [14] 当需要完全分离接口和实现时，请使用抽象类作为接口；§5.3; [CG: C.122]。\n- [15] 通过指针和引用访问多态对象；§5.3。\n\
  - [16] 抽象类通常不需要构造函数；§5.3; [CG: C.126]。\n- [17] 使用类层级结构来表示具有固有层次结构的概念；§5.5。\n- [18]\
  \ 拥有虚函数的类应该有一个虚析构函数；§5.5; [CG: C.127]。\n- [19] 在大型类层级结构中使用 `override` 来使重写显式化；§5.3;\
  \ [CG: C.128]。\n- [20] 设计类层级结构时，区分实现继承和接口继承；§5.5.1; [CG: C.129]。\n- [21] 在不可避免的类层级导航中，使用\
  \ `dynamic_cast`；§5.5.2; [CG: C.146]。\n- [22] 当认为找不到所需的类就是一种失败时，使用 `dynamic_cast`\
  \ 转换为引用类型；§5.5.2; [CG: C.147]。\n- [23] 当认为找不到所需的类是种有效的替代方案时，使用 `dynamic_cast` 转换为指针类型；§5.5.2;\
  \ [CG: C.148]。\n- [24] 使用 `unique_ptr` 或 `shared_ptr` 避免忘记 `delete` 使用 `new` 创建的对象；§5.5.3;\
  \ [CG: C.149]。\n\n# 6\n\n## 核心操作\n\n*当有人说他想要一种只需要告诉他他想要做的事情的编程语言时，请给他一个棒棒糖。*\n\n\
  *– Alan Perlis*\n\n* 介绍\n    * 核心操作; 转换; 成员初始化器\n* 拷贝与移动\n    * 拷贝容器; 移动容器\n* 资源管理\n\
  * 运算符重载\n* 常规操作\n    * 比较; 容器操作; 迭代器与“智能指针`; 输入/输出运算符; `swap()`; `hash<>`\n* 用户自定义字面量\n\
  * 建议\n\n## 6.1 介绍\n\n某些操作如初始化、赋值、拷贝和移动是基础性的，因为语言对这些操作做出了假设。其他操作如 `==` 和 `<<` 具有常规含义，忽略它们是危险的。\n\
  \n### 6.1.1 核心操作\n\n用于一个类型的构造函数、析构函数以及拷贝和移动操作在逻辑上并不是分离的。我们必须将它们定义为一个匹配的集合，否则将面临逻辑问题。如果类\
  \ `X` 拥有一个执行非平凡任务（如释放存储内存或释放锁）的析构函数，那么该类可能需要全套函数：\n\n```\nclass X {\npublic:\n \
  \   X(Sometype);                    // “普通构造函数”创建一个对象\n    X();                \
  \                     // 默认构造函数\n    X(const X&);                     // 拷贝构造函数\n\
  \    X(X&&);                             // 移动构造函数\n    X& operator=(const X&);\
  \ // 拷贝赋值：清理目标并拷贝\n    X& operator=(X&&);        // 移动赋值：清理目标并移动\n    ~X();    \
  \                              // 析构函数：清理\n    // ...\n};\n```\n\n对象可以被拷贝或移动的五种情况：\n\
  \n* 作为赋值的源\n* 作为对象初始化器\n* 作为函数参数\n* 作为函数返回值\n\n赋值使用拷贝赋值或移动赋值。原则上，其他情况使用拷贝或移动构造函数。然而，拷贝或移动构造函数的调用往往会被优化掉。赋值使用拷贝赋值或移动赋值。原则上，其他情况使用拷贝或移动构造函数。然而，拷贝或移动构造函数的调用往往会被优化掉。赋值使用拷贝赋值或移动赋值。原则上，其他情况使用拷贝或移动构造函数。然而，拷贝或移动构造函数的调用往往会被优化掉。\
  \ (此处原文出现了重复，我重新整理了逻辑进行翻译)\n\n```\nclass X {\npublic:\n    X(Sometype);        \
  \            // “普通构造函数”创建一个对象\n    X();                                     //\
  \ 默认构造函数\n    X(const X&);                     // 拷贝构造函数\n    X(X&&);          \
  \                   // 移动构造函数\n    X& operator=(const X&); // 拷贝赋值：清理目标并拷贝\n   \
  \ X& operator=(X&&);        // 移动赋值：清理目标并移动\n    ~X();                         \
  \         // 析构函数：清理\n    // ...\n};\n```\n\n对象可以被拷贝或移动的五种情况：\n\n* 作为赋值的源\n* 作为对象初始化器\n\
  * 作为函数参数\n* 作为函数返回值\n\n赋值使用拷贝赋值或移动赋值。原则上，其他情况使用拷贝或移动构造函数。然而，拷贝或移动构造函数的调用往往会被优化掉。\n\
  \n(注：由于原文在某些段落存在明显的重复，翻译时已根据逻辑进行了去重处理以确保流畅)\n\n对象可以被拷贝或移动的五种情况：\n\n* 作为赋值的源\n* 作为对象初始化器\n\
  * 作为函数参数\n* 作为函数返回值\n\n赋值使用拷贝赋值或移动赋值。原则上，其他情况使用拷贝或移动构造函数。然而，拷贝或移动构造函数的调用往往会被优化掉。\
