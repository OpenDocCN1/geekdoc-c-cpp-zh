  [11] 熟悉你的标准库算法，并优于手工编写；§13.1。\n\n\n\n\n```\nvoid user(forward_range auto& r)\n{\n\
  \        filter_view v {r, [](int x) { return x%2; } }; // 从 r 中视图（仅）奇数\n\n    \
  \    cout << \"odd numbers: \";\n        for (int x : v)\n                 cout\
  \ << x << ' ';\n}\n```\n\n从 `filter_view` 读取内容时，我们从它的范围读取。如果读取到的值匹配谓词，则返回它；否则，`filter_view`\
  \ 将尝试范围中的下一个元素。\n\n许多范围是无限的。此外，我们通常只想要几个值。因此，有一些视图可以只从范围中提取少数值：\n\n点击此处查看代码图片\n\n\
  ```\nvoid user(forward_range auto& r)\n{\n         filter_view v{r, [](int x) {\
  \ return x%2; } };        // 视图 r 中的（仅）奇数\n         take_view tv {v, 100 };    \
  \                                  // 从 v 取最多 100 个元素\n\n         cout << \"odd\
  \ numbers: \";\n         for (int x : tv)\n                  cout << x << ' ';\n\
  }\n```\n\n我们可以通过直接使用 `take_view` 来避免命名：\n\n```\nfor (int x : take_view{v, 3})\n\
  \       cout << x << ' ';\n```\n\n同样对于 `filter_view` 也是：\n\n点击此处查看代码图片\n\n```\n\
  for (int x : take_view{ filter_view { r, [](int x) { return x % 2; } }, 3 })\n \
  \       cout << x << ' ';\n```\n\n这种视图的嵌套可能会很快变得晦涩，因此有另一种替代方案：管道 (§14.4)）。\n\n标准库提供了许多视图，也称为范围适配器（range\
  \ adaptors）：\n\n| **标准库视图（范围适配器）** **<ranges>****v** 是一个**视图 (view)**；**r** 是**范围\
  \ (range)**；**p** 是谓词；**n** 是一个整数 |\n\n| --- |\n| **v=all_view{r}** | **v** 是 **r**\
  \ 中的所有元素 |\n| **v=filter_view{r,p}** | **v** 是 **r** 中满足 **p** 的元素 |\n| **v=transform_view{r,f}**\
  \ | **v** 是对 **r** 中的每个元素调用 **f** 的结果 |\n| **v=take_view{r,n}** | **v** 是 **r**\
  \ 中最多 **n** 个元素 |\n| **v=take_while_view{r,p}** | **v** 是 **r** 中的元素，直到某个元素不满足 **p**\
  \ 为止 |\n| **v=drop_view{r,n}** | **v** 是从 **r** 的第 **n+1** 个元素开始的元素 |\n| **v=drop_while_view{r,p}**\
  \ | **v** 是 **r** 中从第一个不满足 **p** 的元素开始的元素 |\n| **v=join_view{r}** | **v** 是 **r**\
  \ 的扁平化版本；**r** 的元素必须是范围 |\n| **v=split_view(r,d)** | **v** 是由分隔符 **d** 决定的 **r**\
  \ 的子范围范围； |\n| | **d** 必须是一个元素或范围 |\n| **v=common_view(r)** | **v** 是由 (**begin**:**end**)\
  \ 对描述的 **r** |\n| **v=reverse_view{r}** | **v** 是 **r** 元素的倒序排列；**r** 必须具备双向访问能力\
  \ |\n| **v=views::elements<n>(r)** | **v** 是 **r** 中元组(tuple) 元素第 **n** 个元素的范围 |\n\
  | **v=keys_view{r}}** | **v** 是 **r** 中对(pair) 元素中第一个元素的范围 |\n| **v=values_view{r}**\
  \ | **v** 是 **r** 中对(pair) 元素中第二个元素的范围 |\n| **v=ref_view{r}** | **v** 是指向 **r**\
  \ 元素引用的范围 |\n\n视图提供的接口与范围的接口非常相似，因此在大多数情况下，我们可以在任何可以使用范围的地方使用视图，且方式相同。关键区别在于视图并不拥有它的元素；它不负责删除其底层范围的元素——那是范围的责任。另一方面，视图的生命周期不能超过其所属的范围：\n\
  \n点击此处查看代码图片\n\n```cpp\nauto bad()\n{\n         vector v = {1, 2, 3, 4};\n     \
  \     return filter_view{v,odd};               // v 在视图之前就会被销毁\n}\n```\n\n视图被认为应该是廉价拷贝的，因此我们按值传递它们。\n\
  \n我使用了简单的标准类型来保持示例简单易懂，但当然，我们可以为自己的自定义类型创建视图。例如：\n\n点击此处查看代码图片\n\n```cpp\nstruct\
  \ Reading {\n         int location {};\n         int temperature {};\n         int\
  \ humidity {};\n         int air_pressure {};\n         //...\n};\n\nint average_temp(vector<Reading>\
  \ readings)\n{\n         if (readings.size()==0) throw No_readings{};\n        \
  \ double s = 0;\n         for (int x: views::elements<1>(readings))            \
  \  // 只查看温度\n                 s += x;\n         return s/readings.size();\n}\n```\n\
  \n## 14.3 生成器\n\n通常，范围需要动态生成。标准库为此提供了一些简单的生成器（也称为工厂）：\n\n| **范围生成器** **<ranges>****v**\
  \ 是一个视图；**x** 是元素类型 **T**；**is** 是一个 **istream** |\n\n\n\n\n视图（views）和管道（pipelines）的实现涉及一些相当惊人的模板元编程，因此如果你担心性能，请确保测量你的实现是否满足你的需求。如果没有，总有一种传统的变通方法：\n\
  \n点击此处查看代码图片\n\n```\nvoid user(forward_range auto& r)\n{\n         int count = 0;\n\
  \         for (int x : r)\n                  if (x % 2) {\n                    \
  \       cout << x << ' ';\n                           if (++count == 3) return;\n\
  \                 }\n}\n```\n\n然而，这里的逻辑被掩盖了。\n\n## 14.5 概念概述\n\n标准库提供了许多实用的概念：\n\
  \n* 定义类型特性的概念 (§14.5.1)\n* 定义迭代器的概念 (§14.5.2)\n* 定义范围的概念 (§14.5.3)\n\n### 14.5.1\
  \ 类型概念\n\n与类型属性以及类型之间关系的概念反映了类型的种多样性。这些概念有助于简化大多数模板。\n\n| **核心语言概念** **<concepts>********T**\
  \ 和 **U** 是类型 |\n| --- |\n| `same_as<T,U>` | `T` 与 `U` 相同 |\n| `derived_from<T,U>`\
  \ | `T` 派自 `U` |\n| `convertible_to<T,U>` | 一个 `T` 可以转换为 `U` |\n| `common_reference_with<T,U>`\
  \ | `T` 和 `U` 共享一个共同引用类型 |\n| `common_with<T,U>` | `T` 和 `U` 共享一个共同类型 |\n| `integral<T>`\
  \ | `T` 是整数类型 |\n| `signed_integral<T>` | `T` 是有符号整数类型 |\n| `unsigned_integral<T>`\
  \ | `T` 是无符号整数类型 |\n| `floating_point<T>` | `T` 是浮点类型 |\n| `assignable_from<T,U>`\
  \ | 一个 `U` 可以赋值给 `T` |\n| `swappable_with<T,U>` | `T` 可以与 `U` 交换 |\n| `swappable<T>`\
  \ | `swappable_with<T,T>` |\n\n许多算法应该能够在相关类型的组合上工作，例如混合了 `int` 和 `double` 的表达式。我们使用\
  \ `common_with` 来判断这种混合在数学上是否是合理的。如果 `common_with<X,Y>` 为 `true`，我们可以使用 `common_type_t<X,Y>`\
  \ 来比较 `X` 和 `Y`，前提是先将两者都转换为 `common_type_t<X,Y>`。例如：\n\n点击此处查看代码图片\n\n```\ncommon_type<string,\
  \ const char*> s1 = some_fct()\ncommon_type<string, const char*> s2 = some_other_fct();\n\
  \nif (s1<s2) {\n         // ...\n}\n```\n\n为了为一对类型指定共同类型，我们特化了 `common` 定义中使用的 `common_type_t`。例如：\n\
  \n点击此处查看代码图片\n\n```\nusing common_type_t<Bigint,long> = Bigint;             // 对应合适的\
  \ Bigint 定义\n```\n\n幸运的是，我们不需要定义 `common_type_t` 特化，除非我们想对某些库（尚未）提供合适定义的类型混合上进行操作。\n\
  \n与比较相关的概念深受 [Stepanov,2009] 的深度影响。\n\n| **比较概念** **<concepts>** |\n| --- |\n| `equality_comparable_with<T,U>`\
  \ | `T` 和 `U` 可以使用 `==` 比较等价 |\n| `equality_comparable<T>` | `equality_comparable_with<T,T>`\
  \ |\n| `totally_ordered_with<T,U>` | `T` 和 `U` 可以使用 `<`, `<=`, `>`, 和 `>=` 比较 |\n\
  | | 产生全序 |\n| `totally_ordered<T>` | `strict_totally_ordered_with<T,T>` |\n| `three_way_comparable_with<T,U>`\
  \ | `T` 和 `U` 可以使用 `<=>` 比较 |\n| | 产生一致的结果 |\n| `three_way_comparable<T>` | `three_way_comparable_with<T,T>`\
  \ |\n\n同时使用 `equality_comparable_with` 和 `equality_comparable` 显示了（目前为止）错失重载概念的机会。\n\
  \n奇怪的是，并没有标准的 `boolean` 概念。我经常需要它，所以这里有一个版本：\n\n```\ntemplate<typename B>\nconcept\
  \ Boolean =\n        requires(B x, B y) {\n                { x = true };\n     \
  \           { x = false };\n                { x == y };\n                { x !=\
  \ y };\n        };\n```\n编写模板时，我们经常需要对类型进行分类。\n\n| **对象概念** **<concepts>** |\n|\
  \ --- |\n| `destructible<T>` | `T` 可以被析构 |\n| `constructible_from<T,U>` | `T` 可以从\
  \ `U` 构造 |\n| `default_constructible<T>` | `T` 可以默认构造 |\n| `copy_constructible<T>`\
  \ | `T` 可以拷贝构造 |\n| `move_constructible<T>` | `T` 可以移动构造 |\n| `assignable_from<T,U>`\
  \ | 一个 `U` 可以赋值给 `T` |\n| `copy_assignable<T>` | `T` 可以拷贝赋值 |\n| `move_assignable<T>`\
  \ | `T` 可以移动赋值 |\n| `swappable<T>` | `T` 可以交换 |\n| `regular<T>` | `T` 是可构造、可赋值且可交换的\
  \ |\n| `relocable<T>` | `T` 是可构造且可赋值的 |\n| `pointer<T>` | `T` 可以作为指针 |\n| `reference<T>`\
  \ | `T` 可以作为引用 |\n| `integral<T>` | `T` 是整数类型 |\n| `signed_integral<T>` | `T` 是有符号整数类型\
  \ |\n| `unsigned_integral<T>` | `T` 是无符号整数类型 |\n| `floating_point<T>` | `T` 是浮点类型\
  \ |\n| `enum<T>` | `T` 是枚举类型 |\n| `boolean<T>` | `T` 是布尔类型 |\n| `char<T>` | `T`\
  \ 是字符类型 |\n| `string<T>` | `T` 是字符串类型 |\n| `array<T>` | `T` 是数组类型 |\n| `vector<T>`\
  \ | `T` 是 vector 类型 |\n| `list<T>` | `T` 是 list 类型 |\n| `map<T>` | `T` 是 map 类型\
  \ |\n| `set<T>` | `T` 是 set 类型 |\n| `function<T>` | `T` 是函数类型 |\n| `lambda<T>` |\
  \ `T` 是 lambda 类型 |\n| `template<T>` | `T` 是模板类型 |\n| `class<T>` | `T` 是类类型 |\n\
  | `struct<T>` | `T` 是结构体类型 |\n| `variant<T>` | `T` 是 variant 类型 |\n| `optional<T>`\
  \ | `T` 是可选类型 |\n| `any<T>` | `T` 是任意类型 |\n| `future<T>` | `T` 是未来类型 |\n| `promise<T>`\
  \ | `T` 是 promise 类型 |\n| `thread<T>` | `T` 是线程类型 |\n| `concept<T>` | `T` 是哨兵类型\
  \ |\n| `range<T>` | `T` 是范围类型 |\n| `view<T>` | `T` 是视图类型 |\n| `pipeline<T>` | `T`\
  \ 是管道类型 |\n| `callable<T>` | `T` 是可调用类型 |\n| `generator<T>` | `T` 是生成器类型 |\n| `sink<T>`\
  \ | `T` 是 sink 类型 |\n| `task<T>` | `T` 是任务类型 |\n| `span<T>` | `T` 是 span 类型 |\n\
  | `tuple<T>` | `T` 是元组类型 |\n| `pair<T>` | `T` 是对类型 |\n\n### 14.5.2 迭代器概念\n\n传统的标准算法通过迭代器访问数据，因此我们需要概念对迭代器类型进行分类。\n\
  \n| **迭代器概念** **<iterators>** |\n| --- |\n| `input_or_output_iterator<I>` | `I`\
  \ 可以递增 (****) 和解引用 (*) |\n| `sentinel_for<S,I>` | `S` 是 `Iterator` 类型的哨兵；即 `S` 是对\
  \ `I` 值类型的谓词 |\n| `sized_sentinel_for<S,I>` | 一个可以对 `I` 应用 **-** 操作的哨兵 `S` |\n|\
  \ `input_iterator<I>` | `I` 是输入迭代器；* 可用于读取 |\n| `output_iterator<I>` | `I` 是输出迭代器；*\
  \ 可用于写入 |\n| `forward_iterator<I>` | `I` 是前向迭代器，支持多次通过和 **==** |\n| `bidirectional_iterator<I>`\
  \ | 支持 **--** 的前向迭代器 |\n| `random_access_iterator<I>` | 支持 **+**, **-**, **+=**,\
  \ **-=** 和 **[]** 的双向迭代器 |\n| `contiguous_iterator<I>` | 连续内存中元素的随机访问迭代器 |\n| `permutable<I>`\
  \ | 支持移动和交换的前向迭代器 |\n\n\n\n\n\n| `mergeable<I1,I2,R,O>` | 能否使用 `relation<R>` 将由\
  \ `I1` 和 `I2` 定义的有序序列合并到 `O` 中？ |\n| `sortable<I>` | 能否使用 `less` 对由 `I` 定义的序列进行排序？\
  \ |\n| `sortable<I,R>` | 能否使用 `relation<R>` 对由 `I` 定义的序列进行排序？ |\n\n`mergeable` 和\
  \ `sortable` 相对于它们在 C++20 中的定义进行了简化。\n\n不同类型的迭代器（类别）用于为给定的参数集选择最佳算法；请参见 §8.2.2 和\
  \ §16.4.1。关于 `input_iterator` 的示例，请参见 §13.3.1。\n\n哨兵（sentinel）的基本思想是，我们可以从一个迭代器开始遍历一个范围，直到某个元素满足谓词条件。这样，一个迭代器\
  \ `p` 和一个哨兵 `s` 定义了一个范围 ``p:`s(*p)`)`。例如，我们可以定义一个哨兵谓词用于遍历 C 风格的字符串，并使用指针作为迭代器。不幸的是，这需要一些样板代码，因为该思想是将谓词呈现为一种不会与普通迭代器混淆的内容，但你可以与用于遍历范围的迭代器进行比较：\n\
  \n[点击此处查看代码图片\n\n```\ntemplate<class Iter>\nclass Sentinel {\npublic:\n        \
  \ Sentinel(int ee) : end(ee) { }\n         Sentinel() :end(0) {}          // Concept\
  \ sentinel_for 需要默认构造函数\n\n         friend bool operator==(const Iter& p, Sentinel\
  \ s) { return (*p == s.end); }\n         friend bool operator!=(const Iter& p, Sentinel\
  \ s) { return !(p == s); }\nprivate:\n         iter_value_t<const char*> end;  \
  \      // 哨兵值\n};\n```\n\n`friend` 声明符允许我们在类的作用域内定义用于比较迭代器与哨兵的 `==` 和 `!=` 二进制函数。\n\
  \n我们可以检查该 `Sentinel` 是否满足 `const char*` 的 `sentinel_for` 要求：\n\n点击此处查看代码图片\n\n```\n\
  static_assert(sentinel_for<Sentinel<const char*>, const char*>);   // 检查 C 风格字符串的哨兵\n\
  ```\n\n最后，我们可以写一个相当奇特的“Hello, World!”程序：\n\n点击此处查看代码图片\n\n```\nconst char aa[] =\
  \ \"Hello, World!\\nBye for now\\n\";\n\nranges::for_each(aa, Sentinel<const char*>('\\\
  n'), [](const char x) { cout << x; });\n```\n\n是的，这确实写了 `Hello, World!` 且后面没有换行符。\n\
  \n### 14.5.3 范围概念 (Range Concepts)\n\n范围概念定义了范围的属性。\n\n| 范围概念 `<ranges>` |\n| ---\
  \ |\n| `range<R>` | `R` 是一个具有起始迭代器和哨兵的范围 |\n| `sized_range<R>` | `R` 是一个可以在常数时间内知道大小的范围\
  \ |\n| `view<R>` | `R` 是一个具有常数时间拷贝、移动和赋值的范围 |\n| `common_range<R>` | `R` 是一个迭代器类型和哨兵类型相同的范围\
  \ |\n| `input_range<R>` | `R` 是一个迭代器类型满足 `input_iterator` 的范围 |\n| `output_range<R>`\
  \ | `R` 是一个迭代器类型满足 `output_iterator` 的范围 |\n| `forward_range<R>` | `R` 是一个迭代器类型满足\
  \ `forward_iterator` 的范围 |\n| `bidirectional_range<R>` | `R` 是一个迭代器类型满足 `bidirectional_iterator`\
  \ 的范围 |\n| `random_access_range<R>` | `R` 是一个迭代器类型满足 `random_access_iterator` 的范围\
  \ |\n| `contiguous_range<R>` | `R` 是一个迭代器类型满足 `contiguous_iterator` 的范围 |\n\n`<ranges>`\
  \ 中还有其他概念，但这一组是一个很好的开始。这些概念的主要用途是允许根据输入的类型属性来实现允许的重载 (§8.2.2)。\n\n## 14.6 建议\n\n\
  [1] 当迭代器对风格变得乏味时，使用范围算法；§13.1；§14.1。\n\n[2] 使用范围算法时，记得显式引入它的名称；§13.3.1。\n\n[3] 范围上的操作流水线可以使用\
  \ `view`、`generator` 和 `filter` 来表达；§14.2, §14.3。\n\n[4] 要用谓词结束一个范围，需要一个哨兵；§14.2。\n\
  \n[5] 使用 `static_assert` 可以检查类型是否满足某种概念；§8.2.2。\n\n[6] 标准库提供了用于持有数据的容器；§13.6。\n\n\
  [7] 标准库提供了资源管理指针；§14.5。\n\n[8] 在适用时优先使用标准库概念；§14.5。\n\n[9] 在并行执行时，注意避免数据竞态§18.3。\n\
  \n# 15 指针与容器\n\n## 15.1 引言\n\nC++ 提供了简单的低级类型来持有和引用数据：内置类型和数组引用数据。然而，我们需要更通用的数据数据。例如，指针和迭代器（参见第\
  \ 12 章） |\n| `unique_ptr<T>` | `T` 的所有权指针 |\n| `shared_ptr<T>` | 指向 `T` 对象的指针；所有权在所有指向\
  \ `T` 的 `shared_ptr` 之间共享 |\n| `weak_ptr<T>` | 指向由 `shared_ptr` 拥有的指针；必须转换为 `shared_ptr`\
  \ 才能访问对象 |\n| `span<T>` | 指向连续 `T` 序列的指针（参见 15.2.2） |\n\n\n\n\n\n| `string_view<T>`\
  \ | 指向 `const` 子字符串的指针 (§10.3) |\n| `X_iterator<C>` | 来自自 `C` 的元素序列； |\n|  | 名称中的\
  \ `X` 表示迭代器的类型 (§13.3) |\n\n一个对象可以有多个一个指针指向它。`owning`（所有型）指针是指负责最终删除其所引用对象的指针。`non-owning`（非所有型）指针（例如\
  \ `T*` 或 `span`）可能会**悬空**（`dangle`）；即指向一个对象已经被 `deleted` 或已超出作用范围的位置。\n\n通过悬空指针进行读取或写入是最糟糕的\
  \ bug 种类之一。这样做的结果在技术上是**未定义的”。在实践中，这通常意味着访问一个恰好占用该位置的对象。此时，读取意味着获取一个任意值，而写入则会破坏无关的数据结构。我们能期待的最优结果就是程序崩溃；这通常比得到错误的结果要好。\n\
  \nC++ 核心指南 [CG] 提供了避免此类问题的规则，以及通过静态检查确保其永不发生的建议。然而，这里有几种避免指针问题的方法：\n\n*   不要在对象超出作用范围后保留指向该局部对象的指针。特别是，永远不要从函数返回局部对象的指针，或在长生命周期的数据结构中存储来源不确的指针。系统地使用容器和算法（第\
  \ 12 章, 第 13 章）通常让我们避免使用那些难以避免指针问题的编程技术。\n\n*   使用指向在自由存储（free store）上分配的对象的所有型指针。\n\
  *   指向静态对象（例如全局变量）的指针不会悬空。\n*   将指针运算留给资源句柄的实现（如 `vector` 和 `unordered_map`）。\n\
  *   记住 `string_view` 和 `span` 是非所有型指针。\n\n### 15.2.1 `unique_ptr` 和 `shared_ptr`\n\
  \n任何非平凡程序的核心任务之一都是管理资源。资源是必须获取并在稍后（显式或隐式地）释放的东西。例如内存、锁、套接字、线程句柄和文件句柄。对于长时间运行程序，未能及时释放资源（“泄漏”）会导致严重的性能下降\
  \ (§12.7) 甚至可能导致崩溃。即使对于短程序，泄漏也可能尴尬，例如导致资源短缺使运行时间增加几个数量级。\n\n标准库组件的设计是不泄漏资源。为了实现这一点，它们依赖语言对构造/析构函数对的支持，以确保资源的生命周期不会超过负责它的对象。在\
  \ `Vector` 中使用构造/析构函数对来管理元素的生命周期是一个示例 (§5.2.2)，所有的标准库容器都以类似的方式实现。重要的是，这种方法与使用异常的错误处理良好交互。例如，这种技术用于标准库的锁类：\n\
  \n点击查看代码图像\n\n```cpp\nmutex m; // 用于保护对共享数据的访问\n\nvoid f()\n{\n       scoped_lock\
  \ lck {m};       // 获取 mutex m\n       // ... 操作共享数据 ...\n}\n```\n\n在 `lck` 的构造函数获取\
  \ `mutex` (§18.3) 之前，线程不会继续。相应的析构函数会释放 `mutex`。因此在该示例中，当控制流离开 `f()` 时（通过 `return`、运行到末或抛出异常），`scoped_lock`\
  \ 的析构函数会释放 `mutex`。\n\n这是 RAII（资源获取初始化）技术（§5.2.2)）的应用。RAII 是 C++ 惯资源处理的基础。容器（如 `vector`、`map`、`string`\
  \ 和 `iostream`）同样地管理它们的资源（如文件句柄和缓冲区）。\n\n到为止的示例处理了作用域定义的对象，在离开作用域时释放它们获取的资源，但分配在自由存储上的对象呢？在\
  \ `<memory>` 中，标准库提供了两种“智能指针”来帮助管理自由存储上的对象：\n\n*   `unique_ptr` 表示唯一所有权（其析构函数会销毁对象）。\n\
  *   `shared_ptr` 表示共享所有权（最后一个共享指针的析构函数会销毁对象）。\n\n这些“智能指针”最基本的用法是防止因粗心编程导致的内存泄漏。例如：\n\
  \n点击查看代码图像\n\n```cpp\nvoid f(int i, int j)         // X* vs. unique_ptr<X>\n{\n\
  \        X* p = new X;                            // 分配一个新的 X\n        unique_ptr<X>\
  \ sp {new X};     // 分配一个新的 X 并交由 unique_ptr\n        // ...\n\n        if (i<99)\
  \ return;                         // 确保内存清理\n    }\n```\n\n\n\n在空存储器（free store）上创建对象，然后将其指针传递给智能指针有点繁琐。这还容易导致错误，例如忘记向\
  \ `unique_ptr` 传递指针，或者将指向非空存储器上对象的指针传递给 `shared_ptr`。为了避免此类问题，标准库（在 `<memory>` 头文件中）提供了用于构造对象并返回相应智能指针的函数：`make_shared()`\
  \ 和 `make_unique()`。例如：\n\n点击此处查看代码图像\n\n```cpp\nstruct S {\n        int i;\n  \
  \      string s;\n        double d;\n        // ...\n};\n\nauto p1 = make_shared<S>(1,\"\
  Ankh Morpork\",4.65);     // p1 是一个 shared_ptr<S>\nauto p2 = make_unique<S>(2,\"\
  Oz\",7.62);                        // p2 是一个 unique_ptr<S>\n```\n\n现在，`p2` 是一个 `unique_ptr<S>`，指向一个在空存储器上分配的类型为\
  \ `S` 的对象，值为 `{2,\"Oz\"s,7.62}`。\n\n使用 `make_shared()` 不仅比单独使用 `new` 创建对象然后将其传递给\
  \ `shared_ptr` 更方便，而且效率明显更高，因为不需要为 `shared_ptr` 实现中至关重要的使用计数（use count）进行单独分配。\n\
  \n鉴于 `unique_ptr` 和 `shared_ptr`，我们可以为许多程序实现完整的“无裸露 new”策略 (§5.2.2)。然而，这些“智能指针”在概念上仍然是指针，因此它们只是我资源管理的第二选择——仅位于容器和其他在更高概念层面管理资源的类型之后。特别是\
  \ `shared_ptr` 本身并没有提供任何规则来规定哪些所有者可以读取和/写入共享对象。数据竞态 (§18.5) 和其他形式的混乱并不能通过消除资源管理问题来解决。\n\
  \n我们何时应该使用“智能指针”（如 `unique_ptr`），而不是专门为资源设计的资源句柄（如 `vector` 或 `thread`）？不出所意料，答案是“当我们需要指针语义时”。\n\
  \n*   当我们共享一个对象时，我们需要指针（或引用）来引用该共享对象，因此 `shared_ptr` 成为显而易见的选择（除非有明显的单一所有者）。\n*\
  \   当我们在经典的面向对象代码 (§5.5) 中引用多态对象时，我们需要指针（或引用），因为我们不知道所引用对象的确切类型（甚至不知道其大小），因此 `unique_ptr`\
  \ 成为显而易见的选择。\n*   共享的多态对象通常需要 `shared_ptr`。\n\n我们*不需要*使用指针来从函数返回对象集合；一个作为资源句柄的容器将通过依赖拷贝消除（copy\
  \ elision） (§3.4.2) 和移动语义 (§6.2.2) 简单且高效地完成任务。\n\n### 15.2.2 span\n\n传统上，范围错误一直是\
  \ C 和 C++ 程序中严重错误的主要来源，导致错误的结果、崩溃和安全问题。使用容器 (第 12 章)、算法 (第 13 章) 和范围 `for` 循环显著减少了这个问题，但仍有改进空间。范围错误的一个关键来源是人们传递指针（原始或智能指针），然后依赖约定来知道指向的元素数量。对于资源句柄之外的代码，最好的建议是假设最多指向一个对象\
  \ [CG: F.22]，但如果没有支持，这种建议是不可管理的。标准库的 `string_view` (§10.3) 可以有所帮助，但它是只读且仅针对字符的。大多数程序员需要更多。例如，在低层软件中向缓冲区写入和读取数据时，要在保持高性能的同时仍然避免范围错误（“缓冲区溢出”）是众闻名的困难。来自\
