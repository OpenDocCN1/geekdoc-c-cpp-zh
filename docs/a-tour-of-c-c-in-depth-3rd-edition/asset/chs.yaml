  \ `cout` 一样），`ifs` 可以作为普通的 `istream` 使用（就像 `cin`）。\n\n文件定位以及对文件打开方式更详细的控制是可能的，但这超出了本书的范围。\n\
  \n关于文件名的组合和文件系统操作，请参阅 §11.9。\n\n### 11.7.3 字符串流\n\n在 `<sstream>` 中，标准库提供了与 `string`\
  \ 进行输入和输出的流：\n\n*   `istringstream` 用于从 `string` 读取\n*   `ostringstream` 用于向 `string`\
  \ 写入\n*   `stringstream` 用于对 `string` 进行读取和写入\n\n例如：\n\n点击此处查看代码图片\n\n```cpp\nvoid\
  \ test()\n{\n        ostringstream oss;\n\n        oss << \"{temperature,\" << scientific\
  \ << 123.4567890 << \"}\";\n        cout << oss.view() << '\\n';\n}\n```\n\n`ostringstream`\
  \ 的内容可以使用 `str()`（内容的 `string` 拷贝）或 `view()`（内容的 `string_view`）进行读取。`ostringstream`\
  \ 的一个常见用途是在将结果字符串交给 GUI 之前进行格式化。同样，从 GUI 接收到的字符串可以通过将其放入 `istringstream` 中，使用格式化输入操作（§11.3）来读取。\n\
  \n`stringstream` 可以同时用于读取和写入。例如，我们可以定义一个操作，将任何具有 `string` 表示形式的类型转换为另一个也可以被表示为 `string`\
  \ 的类型：\n\n点击此处查看代码图片\n\n```cpp\ntemplate<typename Target =string, typename Source\
  \ =string>\nTarget to(Source arg)                // 将 Source 转换为 Target\n{\n   \
  \   stringstream buf;\n      Target result;\n\n      if (!(buf << arg)         \
  \                       // 将 arg 写入流中\n             || !(buf >> result)        \
  \              // 从流中读取 result\n             || !(buf >> std::ws).eof())       \
  \  // 流中是否还有剩余内容？\n             throw runtime_error{\"to<>() failed\"};\n\n    \
  \  return result;\n}\n```\n\n函数模板参数只有在无法被推导或没有默认值时（§8.2.4）才需要显式提到，因此我们可以写：\n\n点击此处查看代码图片\n\
  \n```cpp\nauto x1 = to<string,double>(1.2);        // 非常显式（且冗长）\nauto x2 = to<string>(1.2);\
  \                    // Source 被推导为 double\nauto x3 = to<>(1.2);               \
  \               // Target 默认为 string；Source 被推导为 double\nauto x4 = to(1.2);    \
  \                              // <> 是多余的；\n                                   \
  \                           // Target 默认为 string；Source 被推导为 double\n```\n\n如果所有函数模板参数都有默认值，可以省略\
  \ `<>`。\n\n我认为这是一个通过语言特性和标准库设施结合来实现通用性和易用性的良好示例。\n\n### 11.7.4 内存流\n\n从 C++ 早期开始，就有附加到用户指定的内存区域的流，这样我们可以直接从中或向它们进行读写。最老的此类流\
  \ `strstream` 已经被弃用了几十年，但它们的替代品 `spanstream`、`ispanstream` 和 `ospanstream` 在 C++23\
  \ 之前不会正式发布。然而，它们已经广泛可用；请尝试你的编译器实现或在 GitHub 上搜索。\n\n`ospanstream` 的行为类似于 `ostringstream`（§11.7.3），并且初始化方式相同，不同之处\
  \ `ospanstream` 接受 `span` 而不是 `string` 作为参数。例如：\n\n点击此处查看代码图片\n\n```cpp\nvoid user(int\
  \ arg)\n{\n       array<char,128> buf;\n       ospanstream ss(buf);\n       ss <<\
  \ \"write \" << arg << \" to memory\\n\";\n       // ...\n}\n```\n\n尝试溢出目标缓冲区会将字符串状态设置为\
  \ `failure`（§11.4）。\n\n同样，`ispanstream` 类似于 `istringstream`。\n\n### 11.7.5 同步流\n\
  \n在多线程系统中，I/O 会变成一个不可靠的混乱，除非：\n\n*   只有一个 `thread` 使用该流。\n*   对流的访问是同步的，使得一次只有一个\
  \ `thread` 获得访问权限。\n\n`osyncstream` 保证即使有其他 `thread` 尝试写入，序列输出操作也会完成，并且其结果在输出缓冲区中符合预期。\n\
  \n```cpp\nvoid unsafe(int x, string& s)\n{\n       cout << x;\n       cout << s;\n\
  }\n```\n\n另一个 `thread` 可能会引入竞态（§18.2\n{\n       osyncstream oss(cout);\n       oss\
  \ << x;\n       oss << s;\n}\n```\n\n## 11.8 C 风格 I/O\n\nC++ 标准库也支持 C 风格 I/O，包括\
  \ `printf()` 和 `scanf()`。许多库的用法是不安全的，特别是它很难使用。如果你喜欢 `printf()` 风格的格式化输出，可以使用 `format`（§11.6）；它是类型安全的，更易用，且速度快。\n\
  \n## 11.9 文件系统\n\n大多数系统都有*文件系统*的概念，提供对存储为文件的永久信息的访问。遗憾的是，文件系统的属性和操作方法差异很大。为了处理这些，`<filesystem>`\
  \ 中的文件系统库提供了统一接口。使用 `<filesystem>`，我们可以跨平台地\n\n* 表示文件系统路径并遍历文件系统\n* 检查文件类型及其权限\n\
  \n文件系统库可以处理 unicode，但解释这些超出了本书的范围。我推荐参考 cppreference 和 Boost 文件系统文档 [Boost]。\n\n\
  ### 11.9.1 路径\n\n考虑一个示例：\n\n点击此处查看代码图片\n\n```cpp\npath f = \"dir/hypothetical.cpp\"\
  ;      // 命名文件\n\nassert(exists(f));             // f 必须存在\n\nif (is_regular_file(f))\
  \       // f 是普通文件吗？\n        cout << f << \" 是文件；其大小为 \" << file_size(f) << '\\\
  n';\n```\n\n注意，操作文件系统的程序通常与其他程序与其他计算机运行。因此，文件系统的内容在两条命令之间可能会发生变化。例如，尽管我们首先仔细地断言了\
  \ `f` 存在，但在下一行询问 `f` 是否为普通文件时，它可能已经不再存在了。\n\n\n\n\n```cpp\nint main(int argc, char*\
  \ argv[])\n{\n        if (argc < 2) {\n               cerr << \"arguments expected\\\
  n\";\n               return 1;\n        }\n\n        path p {argv[1]};        //\
  \ 从命令行创建一个路径\n\n        cout << p << \" \" << exists(p) << '\\n';          // 注意：路径可以像字符串一样打印\n\
  \        // ...\n}\n```\n\n`path` 在被使用之前不会对其有效性进行检查。即便如此，它的有效性也取决于运行运行的系统约定。\n\n\
  自然地，一个 `path` 可以用来打开文件。\n\n点击此处查看代码图片\n\n```cpp\nvoid use(path p)\n{\n        ofstream\
  \ f {p};\n        if (!f) error(\"bad file name: \", p);\n        f << \"Hello,\
  \ file!\";\n}\n```\n\n除了 `path` 之外，`<filesystem>` 还提供了遍历目录和查询所发现文件属性的类型：\n\n| 文件系统类型（部分）\
  \ |\n| --- |\n| path | 目录路径 |\n| filesystem_error | 文件系统异常 |\n| directory_entry\
  \ | 目录条目 |\n| directory_iterator | 用于遍历目录 |\n| recursive_directory_iterator | 用于遍历目录及其子目录\
  \ |\n\n考虑一个简单但并非完全不现实的示例：\n\n点击此处查看代码图片\n\n```cpp\nvoid print_directory(path p)\
  \        // 打印 p 中所有文件的名称\ntry\n{\n      if (is_directory(p)) {\n            cout\
  \ << p << \":\\n\";\n            for (const directory_entry& x : directory_iterator{p})\n\
  \                    cout << \"   \" << x.path() << '\\n';\n      }\n}\ncatch (const\
  \ filesystem_error& ex) {\n         cerr << ex.what() << '\\n';\n}\n```\n\n字符串可以隐式转换为\
  \ `path`，因此我们可以像这样调用 `print_directory`：\n\n点击此处查看代码图片\n\n```cpp\nvoid use()\n{\n\
  \      print_directory(\".\");        // 当前目录\n     print_directory(\"..\");   \
  \     // 父级目录\n     print_directory(\"/\");         // Unix 根目录\n     print_directory(\"\
  c:\");       // Windows C 卷\n\n     for (string s; cin>>s; )\n              print_directory(s);\n\
  }\n```\n\n如果我想也列出子目录，我会使用 `recursive_directory_iterator{p}`。如果我想按字典顺序打印条目，我会将 `path`s\
  \ 拷贝到 `vector` 中并在打印之前进行排序。\n\n`path` 类提供了许多常用且实用的操作：\n\n| 路径操作（部分） `p` 和 `p2` 是\
  \ `path` 类型 |\n| --- |\n| value_type | 文件系统原生编码使用的字符类型：POSIX 上为 `char`，Windows 上为\
  \ `wchar_t` |\n| string_type | `std::basic_string<value_type>` |\n| const_iterator\
  \ | 一个 `value_type` 为 `path` 的 `const` 双向迭代器 |\n| iterator | `const_iterator` 的别名\
  \ |\n| p=p2 | 将 `p2` 赋值给 `p` |\n| p/=p2 | 使用文件名分隔符（默认认为 `/`）拼接 `p` 和 `p2` |\n| p+=p2\
  \ | 拼接 `p` 和 `p2`（无分隔符） |\n| s=p.native() | `p` 的原生格式的引用 |\n| s=p.string() | 以原生格式的\
  \ `string` 表示 `p` |\n| s=p.generic_string() | 以通用格式的 `string` 表示 `p` |\n| p2=p.filename()\
  \ | `p` 的文件名部分 |\n| p2=p.stem() | `p` 的文件名主体（stem） |\n| p2=p.extension() | `p` 的文件扩展名部分\
  \ |\n| i=p.begin() | `p` 元素序列的起始迭代器 |\n| i= p.end() | `p` 元素序列的结束迭代器 |\n| p==p2`,\
  \ `p!=p2` | `p` 和 `p2` 的相等与不相等判断 |\n| p<p2`, `p<=p2`, `p>p2`, `p>=p2` | 字典比较 |\n\
  | is>>p`, `os<<p` | 指向 `p` 的流 I/O |\n| u8path(s) | 从 UTF-8 编码源 `s` 创建的路径 |\n\n例如：\n\
  \n点击此处查看代码图片\n\n```cpp\nvoid test(path p)\n{\n        if (is_directory(p)) {\n \
  \              cout << p << \":\\n\";\n               for (const directory_entry&\
  \ x : directory_iterator(p)) {\n                       const path& f = x;    //\
  \ 指向文件\n                       if (f.extension() == \".exe\")\n                \
  \               cout << f.stem() << \" is executable\\n\";\n                   \
  \    else {\n                               cout << f.stem() << \" is source\\n\"\
  ;\n                      }\n               }\n        }\n}\n```\n\n## 11.9 文件与目录\n\
  \n`path` 在被使用之前不会对其有效性进行检查。即便如此，它的有效性也取决于运行运行的系统约定。\n\n自然地，一个 `path` 可以用来打开文件。\n\
  \n除了 `path` 之外，`<filesystem>` 还提供了遍历目录和查询所发现文件属性的类型：\n\n（上文表格已重复）\n\n\n\n\n-   [3]\
