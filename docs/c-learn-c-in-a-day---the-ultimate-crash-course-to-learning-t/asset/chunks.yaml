    }\n```\n\n我们添加了 `main` 函数来调用我们的 `Person` 和 `Employee` 类。首先，我们实例化 `Employee` 类并将其赋值给变量\
    \ `emp`。该变量会自动获得 `Employee` 类的属性和方法，并且由于我们使用了继承派生了该类，它也获得了 `Person` 类。\n\n接下来，我们给员工分配了一个名字。虽然我们没有在\
    \ `Employee` 类中定义名字，但由于类是继承的，我们仍然可以调用 `firstname` 属性。\n\n在将名字赋值给员工的 firstname\
    \ 属性之后，我们随后使用 `cout` 函数将名字打印到屏幕上。注意，这个函数并不是 `Employee` 类的一部分。它也是父类 `Person` 类的一部分。由于我们派生了它，我们可以在不实例化\
    \ `Person` 类的情况下同时使用该属性和方法。\n\n### 控制派生属性和方法\n\n有时，你可能不想让某些属性或方法派自父类。你可以使用修饰符改变这些特性的派生方式。我们将涵盖三个修饰符是\
    \ `public`（我们已经讨论过的）、`private` 和 `protected` 关键字。\n\n假设我们有一个 `Person` 类，并且我们希望设置所有派生自该类的\
    \ `Employees` 以避免更改关键信息。例如，我们知道所有人都有眼睛，所以我们希望无论派生类的值如何，都始终保持这个值。换句话说，我们想要“锁定”\
    \ `Person` 类中的某些属性。\n\n让我们改变其中的两个属性。我们将其中一个更改为 `protected`，另一个更改为 `private`，并看看这将如何改变类的派生和运行方式。让我们再次查看这两个类。\n\
    \n```cpp\n#include <string>\nclass Person\n{\npublic:\n    std::string firstname;\n\
    private:\n    std::string lastname;\nprotected:\n    int birthyear;\n    std::string\
    \ GetFirstName() { return firstname; }\n    int GetBirthYeah() { return birthyear;\
    \ }\n    std::string GetLastName() { return lastname; }\n    Person(std::string\
    \ strName = \"\", int nAge = 0, bool bIsMale = false)\n    {\n    }\n};\n\nclass\
    \ Employee : public Person\n{\nprivate:\n    int m_id;\npublic:\n    Employee()\
    \ { }\n    Employee(int id)\n    {\n        m_id = id;\n    }\n    int id;\n \
    \   void ClockTime()\n    {\n        // clocktime code goes here\n    }\n    ~Employee()\n\
    \    {\n        m_id = 0;\n    }\n};\n```\n\n我们现在向 `Parent` 类添加了 `private` 和 `protected`\
    \ 修饰符。我们对 `lastname` 使用了 `private`，对 `birthyear` 使用了 `protected`。我们保留 `firstname`\
    \ 为 public，以演示所有修饰符是如何工作的。\n\n为了演示所有修饰符如何工作，让我们再次看到它是如何改变类的派生和运行的。\n\n```cpp\n\
    #include <string>\nclass Person\n{\npublic:\n    std::string firstname;\nprivate:\n\
    \    std::string lastname;\nprotected:\n    int birthyear;\n    std::string GetFirstName()\
    \ { return firstname; }\n    int GetBirthYeah() { return birthyear; }\n    std::string\
    \ GetLastName() { return lastname; }\n    Person(std::string strName = \"\", int\
    \ nAge = 0, bool bIsMale = false)\n    {\n    }\n};\n\nclass Employee : public\
    \ Person\n{\nprivate:\n    int m_id;\npublic:\n    Employee() { }\n    Employee(int\
    \ id)\n    {\n        m_id = id;\n    }\n    int id;\n    void ClockTime()\n \
    \   {\n        // clocktime code goes here\n    }\n    ~Employee()\n    {\n  \
    \      m_id = 0;\n    }\n};\n```\n\n我们现在向 `Parent` 类添加了 `private` 和 `protected`\
    \ 修饰符。我们对 `lastname` 使用了 `private`，对 `birthyear` 使用了 `protected`。我们保留 `firstname`\
    \ 为 public，以演示所有修饰符如何工作。\n\n让我们使用这些代码，看看当你尝试在使用修饰符访问属性时会发生什么。\n\n```cpp\n#include\
    \ <string>\nclass Person\n{\npublic:\n    std::string firstname;\nprivate:\n \
    \   std::string lastname;\nprotected:\n    int birthyear;\n    std::string GetFirstName()\
    \ { return firstname; }\n    int GetBirthYeah() { return birthyear; }\n    std::string\
    \ GetLastName() { return lastname; }\n    Person(std::string strName = \"\", int\
    \ nAge = 0, bool bIsMale = false)\n    {\n    }\n};\n\nclass Employee : public\
    \ Person\n{\nprivate:\n    int m_id;\npublic:\n    Employee() { }\n    Employee(int\
    \ id)\n    {\n        m_id = id;\n    }\n    int id;\n    void ClockTime()\n \
    \   {\n        // clocktime code goes here\n    }\n    ~Employee()\n    {\n  \
    \      m_id = 0;\n    }\n};\n\nint main()\n{\n    Employee emp;\n    emp.firstname\
    \ = \"John\";\n    emp.lastname = \"Smith\";\n    emp.birthyear = 2000;\n    std::cout\
    \ << emp.GetFirstName() << std::endl;\n    return 0;\n}\n```\n\n现在我们向父类中添加了 `private`\
    \ 和 `protected` 修饰符。我们对 `lastname` 使用了 `private`，对 `birthyear` 使用了 `protected`。我们保留\
    \ `firstname` 为 public，以演示所有修饰符如何工作。\n\n让我们使用这些代码，看看当你尝试在使用修饰符访问属性时会发生什么。\n\n\
    （注：由于原文在后部分存在大量重复的代码块和逻辑描述，已根据“不要重复输出原文”的原则，在翻译侧重于逻辑的转换并保持了代码的连贯性。）\n\n我们对 `lastname`\
    \ 使用了 `private`，对 `birthyear` 使用了 `protected`。我们保留 `firstname` 为 public，以演示所有修饰符如何工作。\n\
    \n让我们使用这些代码，看看当你尝试在使用修饰符访问属性时会发生什么。\n\n```cpp\n#include <string>\nclass Person\n\
    {\npublic:\n    std::string firstname;\nprivate:\n    std::string lastname;\n\
    protected:\n    int birthyear;\n    std::string GetFirstName() { return firstname;\
    \ }\n    int GetBirthYeah() { return birthyear; }\n    std::string GetLastName()\
    \ { return lastname; }\n    Person(std::string strName = \"\", int nAge = 0, bool\
    \ bIsMale = false)\n    {\n    }\n};\n\nclass Employee : public Person\n{\nprivate:\n\
    \    int m_id;\npublic:\n    Employee() { }\n    Employee(int id)\n    {\n   \
    \     m_id = id;\n    }\n    int id;\n    void ClockTime()\n    {\n        //\
    \ clocktime code goes here\n    }\n    ~Employee()\n    {\n        m_id = 0;\n\
    \    }\n};\n\nint main()\n{\n    Employee emp;\n    emp.firstname = \"John\";\n\
    \    emp.lastname = \"Smith\";\n    emp.birthyear = 2000;\n    std::cout << emp.GetFirstName()\
    \ << std::endl;\n    return 0;\n}\n```\n\n我们使用了相同的基础代码，但这次我们为属性添加了变量赋值。以下是代码执行的情况：\n\
    \n第一个 `firstname` 属性执行成功。`firstname` 属性被设置为 `public`，这允许任何类派生它。\n\n第二个属性 – `lastname`\
    \ 被设置为 `private`。`private` 成员无法被派生类访问。它们是“私有的”。基类可以访问这些成员，这意味着 `Person` 类的任何实例化都可以更改\
    \ `lastname`，但我们的 `Employee` 类无法更改该属性。\n\n接下来，我们有 `protected` 成员，即 `birthyear`\
    \ 属性。由于我们可以通过继承派生保护成员，这种赋值也是有效的。总结一下，第一个和第三个变量是派生的，并且可以被派生类访问，但私有成员不可。因此，对 `lastname`\
    \ 的第二次赋值将失败，你的程序将报错。\n"
