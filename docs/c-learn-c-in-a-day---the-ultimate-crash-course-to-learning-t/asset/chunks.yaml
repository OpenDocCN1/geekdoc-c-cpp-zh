    \n函数总是以一个要返回的数据类型开始。你也可以不返回任何数据。不返回任何值的函数被称为 `void` 数据类型。`void` 函数类似于子程序。它们执行某个操作，有时还会向用户显示信息，但不会向调用语句发送返回值。\n\
