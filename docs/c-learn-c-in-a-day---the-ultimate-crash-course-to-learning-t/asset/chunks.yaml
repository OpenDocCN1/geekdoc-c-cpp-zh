    is not an even number either, so the modulus statement returns 1\. If we used
    an even number the return value would be 0, which would then signal to our program
    that we’ve found an even number.


    For more advanced calculations, you might need to call a function. For instance,
    there is no character for using exponents. C++ provides you with a function called
    pow to handle exponents. Let’s take a look at an example.


    pow(base, exp);


    This is the pow template. The base is the number base parameter, and the exp parameter
    is what you want to raise the base to – in other words it stands for the exponent.


    Let’s look at a real example.


    int basenum = 4;


    int result = pow(basenum, 2);


    In this example, we first create a variable named basenum. This variable contains
    the value 4\. We then use the pow function to calculate the basenum variable to
    the power of 2\. The result of the calculation is 16\. This makes exponents much
    easier to use than in other languages that don’t support exponents.


    Before you create any complex functions, do a lookup on the C++ library to ensure
    that the compiler doesn’t already have a solution for you. Most basic math calculations
    have a corresponding library for you to use.


    Comparison Operators


    We just went over most of the basic math operators available in C++. Comparison
    operators are also important to know, and they are a large portion of most programs.
    In most programs, you’ll need to work with comparison operators. These operators
    are also referred to as relational operators.


    There are several comparison operators. Here are a list of them.


    Greater than -- >             


    Less than --  <             


    Greater than or equals -- >=             


    Less than or equals --  <=             


    Equality -- ==             


    Inequality -- !=


    We’ll cover these operators in detail to help you understand how to work with
    them.


    You can look at these operators in the same way you would look at them if you
    were solving a math problem. Let’s first take a look at the greater than and less
    than statements.


    int num1 = 1;


    int num2 = 2;


    if (num1 > num2)


    {


                  cout << “Greater than”;


    }


    if (num1 < num2)


    {


                  cout << “Less than”;


    }


    We haven’t worked with conditions yet, but just know that the if statement is
    used closely with comparison operators. The first if statement compares the num1
    and num2 variables. The first condition checks if num1 is greater than num2\.
    Since the result is false, the if statements are skipped and execution moves on
    to the next if statement.


    The next if statement compares if num1 is less than num2\. This statement is different
    than the first, and the result is true. Since the result is true, the next step
    of execution is set at the statement within the if statement. In this example,
    the phrase “Less than” is displayed to the user.


    Note that if the numbers are equal, neither of these if statements are executed.
    This is a problem when you need to know if a number is greater than or less than
    or equal to a value. Let’s use the same example we have above but change the values
    of the num1 and num2 variables.


    int num1 = 1;


    int num2 = 1;


    if (num1 >= num2)


    {


                  cout << “Greater than”;


    }


    if (num1 <= num2)


    {


                  cout << “Less than”;


    }


    Now our variables are both equal to 1\. They are neither greater than nor less
    than each other, but we’ve changed our if statement code. Since the logic is changed,
    the code execution greatly changed. The first if statement evaluates to true,
    and the phrase “Greater than” displays to the user.


    In the next if statement, true is also evaluated again. Since this if statement
    evaluates to true as well, the value “Less than” is displayed to the user.


    So far, it seems simple enough! But how do we avoid executing an if statement
    when we only want to execute statements when the values are equal but not greater
    than, less than or equal. The C++ language includes an equal operator. We mentioned
    it briefly, because it’s similar to the equal assignment operator. Let’s take
    a look at an example using the same code we used previously.


    int num1 = 1;


    int num2 = 1;


    if (num1 == num2)


    {


                  cout << “Greater than”;


    }


    if (num1 <= num2)


    {


                  cout << “Less than”;


    }


    We set our variables at the same values again. Both of our variables are set to
    1\. We kept both of the if statements. The first if statement evaluates if the
    values are equal. Note that the two equal signs are a comparison operator but
    one equal sign is an assignment operator. If you accidentally use the single equal
    sign in an if statement, your compiler will return an error.


    The next statement is set to less than or equal to. Since both of these variables
    evaluate to true, both the “Greater than” and “Less than” phrases are printed
    to the screen.


    We’ve covered greater than, less than, equal to and a combination. However, we
    still have one more comparison operator to cover. What if we need to know if a
    pair of variables is not equal? None of these comparison operators will work for
    what we need. The C++ language includes a not equal to comparison operator, so
    you can perform this action.


    Let’s use the above samples for our new comparison operator.


    int num1 = 1;


    int num2 = 1;


    if (num1 == num2)


    {


                  cout << “Greater than”;


    }


    if (num1 != num2)


    {


                  cout << “Less than”;


    }


    We’ve used the same num1 and num2 variables. We also set them to the same value.
    They are both assigned a value of 1. Now, we want to know if the variables are
    equal, and then we want to know if the variables are not equal.


    The first if statement uses the equality comparison operator again. The result
    is true so the phrase “Greater than” is displayed to the user. The change in our
    sample was in the second if statement. This statement evaluates if the two variables
    are not equal. In this example, the two variables are indeed equal, so the result
    is false. Whenever an if comparison evaluates to false, the compiler skips the
    if statements code and moves on to the next line of code. Since we have no other
    lines of code to execute, the program terminates.


    You can use compound comparisons in your if statements. We will get into conditions
    in chapter 6, so we don’t want to get too detailed with if statements in this
    chapter. This chapter’s purpose is to explain operators. Just know that you can
    compound conditional evaluations. We’ll take a look at compound comparisons in
    chapter 6.


    Comparison operators and arithmetic operators are an important part of any C++
    program. You’ll run into them often either in your own code or maintenance of
    another program. A simple mistake in conditional statements can lead to severe
    bugs, so it’s important to understand how they work before you code any program.
    It takes some practice to understand code execution with these operators, so use
    this lesson to practice with your own programs and code.


    Lab Questions


    1. If you have a calculation that contains an addition operator and a multiplication
    operator, which one takes precedence?


    a. the multiplication operator


    b. the addition operator


    c. neither, they are equal


    d. they negate each other


    Explanation: multiplication takes precedence over addition statements, so always
    calculate the multiplication before you calculate addition operations.


    2. You have the following calculation in your C++ code:


    int result = 6+ 1 + 5 * 4;


    What is the value contained in the result variable?


    a. 26


    b. 25


    c. 27


    d. 40


    Explanation: The 5 and 4 multipliers are first evaluated, and then the addition
    calculations are performed.


    3. What is the correct comparison operator to use when you want to evaluate if
    two variables are not equal?


    a. <=


    b. ==


    c. >=


