    # Chapter 4: Operators


    Objective: This chapter covers the arithmetic and comparison operators that are
    seen in almost any C++ program.


    We had a brief overview of operators, but this chapter focuses on operators in
    detail. Even the smallest C++ program uses an operator. You need to understand
    how they work, their precedence to properly calculate values, and any comparisons
    and their outcomes. We’ll cover the most common operators with a few uncommon
    ones as well.


    Basic Arithmetic


    In just about any C++ program, you’ll need to perform some kind of arithmetic.
    Even when your program requires no arithmetic at all, you’ll need to use arithmetic
    to loop through statements, find indexes in arrays, and keep track of records.
    Arithmetic is important in any program along with a lot of knowledge.


    Let’s take a look at a simple program.


    int num1 = 5;


    int num2 = 6;


    int num3 = num1 * num2;


    We’ve been using addition and subtraction for most of our samples, so this time
    we decided to add some multiplication.  In the above code, we create two variables
    named num1 and num2 and assign them a value. We then create a third variable named
    num3 and assign the product of num1 and num2 to num3\. This is a very basic example
    of operators and how they work with variables. You can, of course, use static
    numbers that create a value to hold in a variable. The following code would have
    the same results as the above.


    int num3 = 5 * 6;


    The above code only performed one calculation, but as with any calculation, you
    must know the order of precedence for operations. C++ follows the same precedence
    as any regular math calculation. You also have precedence of other operators.
    Since there are numerous operators, most C++ developers have to look up the order
    of precedence before defining long algorithms and calculations. You can Google
    these precedence operators and keep a list of them for future use.


    Another great reason to learn C++ is that the laws of precedence are followed
    by other languages. If you learn them in C++, you should know them for any other
    languages you decide to learn.


    Let’s take a look at a calculation with different operators.


    int num1 = 8 * 3 + 1 + 1;


    If you remember your math classes, you should know the way this problem should
    play out. Multiplication always takes precedence over addition and subtraction,
    so the 8 and 3 are the first calculations, and then the 1 values are added. The
    result of the calculation is 26.


    Let’s take a look another sample.


    int num1 = 8 * 3 + 1 + 1 * 7 + 1;


    Now that you know the order of precedence, you can correctly identify the result
    of the calculation. The result of the first two numbers – 8 and 3 – is first multiplied.
    Then, the result of the 1 and 7 multiplication is calculated. After these two
    values are calculated, then the addition is done. The result of the above calculation
    is 33\.


    You can also perform shortcut operations on the addition and subtraction activity.
    C++ has an increment and decrement operator that acts as a shortcut to these operations.
    Let’s take a look at an example.


    int num1 = 1;


    int num2 = num1++;


    The two variables initialized both contain integer values. The first value is
    set as 1\. The num2 variable is initialized and set as the incremented value of
    num1\. The incremented number is the same as saying “add 1 to the variable value.”
    In this case, the value is initialized as 1, so the incremented value is set to
    2 and then assigned to num2\.


    You can also decrement numbers in the same way except using the minus operator.
    Let’s take a look at an example.


    int num1 = 1;


    int num2 = num1--;


    The above code performs the same calculation process except it decrements the
    value by 1\. In other words, subtract 1 from the variable num1 and then save the
    result in the num2 variable.  The result of the calculation is that num2 contains
    the value 0.


    Another useful but different operator is the modulus operation. When you work
    with even numbers, you’ll work with modulus. The modulus operator returns the
    remainder of a division operation. For instance, if you divide 5 by 2, the modulus
    operator returns 1\. It’s a handy tool for looping through numbers and figuring
    out if the number is even or odd. If the number has no remainder after dividing
    by 2, then it’s an even number. If it has a remainder after dividing by two, then
    you know it’s an odd number.


    Let’s take a look at an example.


    int num1 = 1;


    int num2 = 3;


    float num3 = num1 % 2;


    float num4 = num2 % 2;


    We added several lines to this code. The first two variables are set to hold a
    static value, which is one and three. The third variable named num3 is used to
    identify if num1 is an even number. Since 1 divided by 2 equals .5, we know that
    it’s not an even number. Notice that we accounted for fractions by defining this
    variable as a floating point value.'
