  trans: "\n下一条语句评估数字 `3`。我们知道数字 3 不是偶数，因此取模语句返回 `1`。如果我们使用一个偶数，返回值将是 `0`，这将向我们的程序信号我们找到了偶数。\n\
    \n对于更高级的计算，你可能需要调用函数。例如，C++ 中没有直接用于指数的字符。C++ 了一个了一个名为 `pow` 的函数来处理指数。让我们来看一个示例。\n\
    \n```cpp\npow(base, exp);\n```\n\n这是 `pow` 模板。`base` 是数字参数 `base`，而 `exp` 参数是你想要对基取的幂——换句话说，它代表指数。\n\
    \n让我们来看一个真实的示例。\n\n```cpp\nint basenum = 4;\n\nint result = pow(basenum, 2);\n\
    ```\n\n在这个示例中，我们首先创建了一个名为 `basenum` 的变量。该变量包含值 `4`。然后我们使用 `pow` 函数计算 `basenum`\
    \ 变量的 `2` 次方。计算结果为 `16`。这使得指数的使用比不支持指数的其他语言要简单得多。\n\n在创建任何复杂函数之前，请查阅 C++ 库，以确保编译器是否已经为你提供了解决方案。大多数基础数学计算都有相应的库供你使用。\n\
    \n## 比较运算符\n\n我们刚刚回顾了 C++ 中可用的大部分基础数学运算符。了解比较运算符同样重要，它们构成了大多数程序的大部分。在大多数程序中，你将需要使用比较运算符。这些运算符也被称为关系运算符。\n\
    \n有几个比较运算符。以下是列表：\n\n- 大于：`>`\n- 小于：`<`\n- 大于等于：`>=`\n- 小于等于：`<=`\n- 等于：`==`\n\
    - 不等于：`!=`\n\n我们将详细介绍这些运算符，帮助你理解如何使用它们。\n\n你可以像解决数学题一样来看待这些运算符。让我们先看看大于和小于语句。\n\
    \n```cpp\nint num1 = 1;\n\nint num2 = 2;\n\nif (num1 > num2)\n{\n    cout << “Greater\
    \ than”;\n}\n\nif (num1 < num2)\n{\n    cout << “Less than”;\n}\n```\n\n我们还没有处理过条件，但只需知道\
    \ `if` 语句与比较运算符紧密结合。第一个 `if` 语句比较变量 `num1` 和 `num2`。第一个条件检查 `num1` 是否大于 `num2`。由于结果为\
    \ `false`，程序跳过 `if` 语句，并将执行移动到下一个 `if` 语句。\n\n下一个 `if` 语句比较 `num1` 是否小于 `num2`。这个语句与第一个不同，结果为\
    \ `true`。由于结果为 `true`，执行的下一步被设置为 `if` 语句内部的语句。在这个示例中，“Less than”短语显示给用户看。\n\n\
    注意，如果数字相等，这两个 `if` 语句都不会执行。当你需要知道一个数字是大于、小于还是等于某个值时，这就是问题。让我们使用上面相同的示例，但更改 `num1`\
    \ 和 `num2` 变量的值。\n\n```cpp\nint num1 = 1;\n\nint num2 = 1;\n\nif (num1 >= num2)\n\
    {\n    cout << “Greater than”;\n}\n\nif (num1 <= num2)\n{\n    cout << “Less than”;\n\
    }\n```\n\n现在我们的变量都等于 `1`。它们既不大于也不小于对方，但我们更改了 `if` 语句代码。由于逻辑发生了变化，代码执行也发生了巨大变化。第一个\
    \ `if` 语句评估为 `true`，“Greater than”短语显示给用户。\n\n在下一个 `if` 语句中，再次评估为 `true`。由于这个\
    \ `if` 语句同样评估为 `true`，值“Less than”显示给用户。\n\n到目前为止，这看起来足够简单！但当我们只想在值相等（而不是大于、小于或等于）时执行语句时，该如何避免执行\
    \ `if` 语句呢？C++ 语言包含一个相等运算符。我们简要提过它，因为它与相等赋值运算符相似。让我们使用之前相同的代码来看一个示例。\n\n```cpp\n\
    int num1 = 1;\n\nint num2 = 1;\n\nif (num1 == num2)\n{\n    cout << “Greater than”;\n\
    }\n\nif (num1 <= num2)\n{\n    cout << “Less than”;\n}\n```\n"
