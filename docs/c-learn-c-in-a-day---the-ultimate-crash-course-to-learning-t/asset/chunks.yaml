    # 第 1 章：绪论


    **目标：** 对 C++ 语言进行简要介绍、历史并理解。


    C++ 广为人知是一种每个程序员应该掌握的低级高级语言。C 和 C++ 之间的一个主要区别是对象面向编程 (OOP)。C++ 的 OOP 特性可能让它变得更难理解和学习。本电子书旨在帮助新程序员学习这种语言，包括
    OOP 方法论和结构的帮助。


    ### C++ 简史


    C++ 语言首次出现于 20 世纪 80 年代。它由一位丹麦计算机科学家比雅尼·斯特鲁普（Bjarne Stroustrup）创建。该语言最初的名字是“带有类的
    C（C with Classes）”，后来改为 C++。C++ 最初的主要目的是在旧的 C 语言中添加 OOP。


    随着时间的推移，C++ 演变并标准化了。C++ 被作为一种低级语言创建的，这意味着它的工作更接近二进制级编程。事实上，这种语言最初的设计是为了仅运行在二进制或汇编语言之上。语言越接近实际机器语言，它在处理内存处理和存储等低级机器操作时就越快、越灵活。


    ### C++ 有什么用途？


    开发者仍然使用一种超过 30 年历史语言的单一根本原因是性能。记住，接近二进制计算机语言的语言总是比 `Java`、`C#` 或 `VB` 等开销庞大的语言快。后三种语言仍然有它们的用处，但
    C++ 主要用于其他语言无法完全覆盖开发领域的编程。


    作为一个新开发者，世界是你的舞台，你可以使用任何你喜欢的语言。然而，在某些行业中，你无法使用 C++以外的任何语言。C++ 语言深根于 IT 和软件开发的多个领域。


    **游戏**可能是你需要了解 C++ 的顶级 IT 领域。C++ 用于创建游戏引擎。其他语言太臃肿且浪费资源。由于游戏引擎关注渲染的速度和质量，C++ 是游戏设计中用于低级编程的语言。它通常在游戏设计中与其他语言一起编码，因此有助于开发者在进入游戏编程时理解多种语言。


    **设备驱动程序**几乎全都是用 C++ 完成的。C 用于嵌入式系统，但用于将硬件集成到桌面级、服务器和移动设备等大型系统中的驱动程序都是用 C++ 编写的。设备驱动程序是允许硬件组件与操作系统工作的软件程序。设备驱动程序特定于操作系统，但
    C++ 可以在任何平台运行。驱动程序编写者使用 C++ 是为了它的速度和平台无关集成。一旦编译，程序就针对操作系统，但你可以使用 C++ 为 Linux、Windows
    和 Apple 系统编写代码。


    **图像和视频处理软件**使用 C++。它再次是因为速度优势而被使用。渲染图像或视频可能需要几天时间。


    ### 为什么要用 C++？


    大多数新程序员对 C++ 和 C 之间的区别感到困惑。他们不知道什么时候该使用 C++ 语言而不是 C，或者说何时使用任何语言。C++ 的主要区别在于它使用了对象面向编程。这并没有让
    C 语言变得低劣，它只是让 C++ 能够访问库和编码可能性。在对象面向编程中，你可以使用构造函数和析构函数。构造函数实例化类，析构函数从内存中移除它。


    ### 在 C++ 中编码需要什么


    C++ 是一种编译型语言，这意味着在完成编码过程之前你需要一个编译器。你可以在普通的文本文件中输入代码，但不建议这样做，而且即使你写了没有任何错误的完美代码，仍然需要一个编译器。记住，编译型语言依赖于编译它的操作系统。


