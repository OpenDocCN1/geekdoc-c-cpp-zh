    We covered several concepts in this chapter. Variables and data types are the
    very foundation of a C++ program, so although they are easier concepts, they are
    just as important to understand as more complex concepts.


    Lab Questions


    1. When you want to define a decimal value in C++, what is the data type used
    to declare the variable?


    a. decimal


    b. integer


    c. float


    d. point


    Explanation: The float variable type lets you allocate memory for a decimal value
    and store decimal numbers in your variable.


    2. When you define a Boolean value of true, what is the actual value stored in
    memory?


    a. 0


    b. 1


    c. true


    d. yes


    Explanation: Boolean values are converted to either 1 or 0\. A true value equals
    1 and a false value equals 0\.


    3. What function should you use to obtain string input from a user in C++?


    a. getline


    b. get


    c. cin


    d. input


    Explanation: The getline function should be used to obtain input from users. The
    cin function works as well, but it stops when it reaches a whitespace character.
    To ensure you get all input from the user, always use the getline function.


    4. What does the string library do with string input in C++?


    a. store it in one long area of memory


    b. turn each character into separate characters


    c. turn the string into a character array


    d. escape each character before storing it


    Explanation: String values are actually character arrays in C and C++. C++ has
