  trans: "\n函数在每个 C++ 程序中无处不在。如果你还记得前几章的内容，我们包含了 `main` 函数来演示一个完整的程序。该函数是 C++ 程序的入口点。该函数随后会调用其他函数，直到程序结束或被用户关闭。你的\
    \ C++ 程序将包含几十个函数来构成一个程序。本章将向你展示如何创建一个函数、传递参数、重载这些函数，我们甚至还会解释栈和堆的概念。\n\n# 创建函数\n\
    \n我们已经对函数进行了简要的概述，但让我们再次回顾一下。在开始 C++ 编程课程时，最适合回顾的函数是 `main` 函数，因为它是每个 C++ 程序的一部分。\n\
    \n```cpp\n#include <iostream>\n\nint main()\n{\n    cout << “Hello World”;\n \
    \   return 0;\n}\n```\n\n上述代码是 C++ 中最简单的程序之一。Hello World 程序是新开发者的标准程序，帮助他们理解编程概念。让我们逐行分析这个程序。\n\
    \n我们之前见过的 `include` 语句。该语句包含外部库。在这个示例中，我们导入了 `iostream` 库，它是 `cout` 函数所必需的。\n\n\
    接下来是定义函数。`int` 语句告诉编译器在函数执行完毕后返回一个整数值。C++ 程序中的所有 `main` 函数都返回一个整数值。这个整数用于标识在程序执行期间是否抛出了任何错误。当返回\
    \ `0` 时，它告诉编译器程序运行成功。\n\n`main` 函数不接受任何参数，但我们将在下一节中介绍函数和参数。\n\n括号内的所有语句都是函数的执行代码。函数将继续执行，直到遇到\
    \ `return` 语句。请记住，带有数据类型的函数必须返回一个值，因此在这个 `main` 函数中你必须返回一个整数。如果你尝试返回一个字符串，编译器将给你一个错误。\n\
    \n你也可以使用 `void` 数据类型。让我们来看一个带有 `void` 数据类型定义的函数。\n\n```cpp\n#include <iostream>\n\
    \nvoid calculate()\n{\n    int int1 = 5;\n    int int2 = 5;\n    cout << int1\
    \ + int2;\n}\n```\n\n注意在这个 `calculate` 函数中，`void` 被用数据类型。这告诉编译器没有返回任何值。正如你所看到的，函数中没有\
    \ `return` 语句。你仍然可以使用 `return` 语句如果你想提前结束函数。例如，如果一个值满足某个特定条件，你可以使用 `return` 语句。\n\
    \n让我们来看带有 `return` 的 `void` 语句。\n\n```cpp\n#include <iostream>\n\nvoid calculate()\n\
    {\n    int int1 = 5;\n    int int2 = 5;\n    if (int1 == 5)\n    {\n        return;\n\
