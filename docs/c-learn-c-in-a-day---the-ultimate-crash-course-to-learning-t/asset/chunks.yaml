    \ the next `case` statement executes. The `break` statement is used to stop the\
    \ comparison or the execution will continue until it meets with the `default`\
    \ statement.\n\nThe `switch` statement has a slightly different way of executing\
    \ than the `if` statement. The `if` statement does a comparison, but the `switch`\
