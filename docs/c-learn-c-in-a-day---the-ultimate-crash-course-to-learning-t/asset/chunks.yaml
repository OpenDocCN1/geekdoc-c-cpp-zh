    # Chapter 11: Inheritance


    Objective: this chapter teaches the programmer to inherit classes from parent
    classes to define reusable code throughout their program.


    We discussed classes in the last chapter, and we focused on creating a class that
    described our Employee database. We used a car to describe the way classes are
    designed. We missed one part of class design – class inheritance. Inheritance
    allows you to derive information from a parent class and use it in the child class.
    This chapter discusses the way inheritance works and how you can design fully
    functional C++ programs by inheriting objects from your main parent class objects.


    An Overview of Inheritance


    Before we get into the code for inheritance, it’s important to understand the
    basics. Inheritance lets you derive classes from parent classes. Imagine you want
    to create a program named Animal. You need to then describe several animals and
    their function.


    Animals have some basic characteristics that they share across all species. Eyes,
    nose, and skin can be found on all animals. These characteristics can change in
    property, but you know that all animals have these three characteristics. The
    animal class could be the parent class for all of your animals.


    Now, you know that cats and dogs are also animals.  Cats have eyes, a nose and
    skin. Dogs also have skin, a nose and eyes. Therefore, these two classes can derive
    their traits from the main animal class.


    You can also have child of child classes. For instance, with your dog class, you
    could then have subclasses that describe different breeds of dogs. They are all
    dogs, so dogs would still remain as the parent class, but each breed would have
    its own characteristics, properties and methods. This chapter helps you understand
    the way inheritance works.


    Basic Inheritance


    Let’s go back to the Employee class we worked with in the last chapter. We want
    to create a parent class for employees called Person. The parent class describes
    any employee, because all of our employees are people. However, you still need
    to describe employees, executives, owners, and vendors. All of these people could
    be their own class, and they would derive from the parent Person class since they
    are all a part of the person class.


    Let’s first look at the Employee class from the previous chapter.


    class Employee


    {


    private:


        int m_id;


    public:


        Employee() { }


        Employee(int id)


        {


            m_id = id;


        }


        int id;


        void ClockTime()


        {


             // clocktime code goes here


        }


        ~Employee()


         {


           m_id = 0;


         }


    };


    Now we need to make a Person class. It could be very simple with just a few properties.
    For instance, every person has a name, so the firstname and lastname properties
    we used in the Employee class could be moved to the Person class. Let’s do that
    and create a Person class in our code.


    #include <string>


    class Person


    {


    public:


        std::string firstname;


        std::string lastname;


        int birthyear;


        std::string GetFirstName() { return firstname; }


        int GetBirthYeah() { return birthyear; }


        std::string GetLastName() { return lastname; }


        Person(std::string strName = "", int nAge = 0, bool bIsMale = false)


        {


        }


    };


    You’ll notice that we have the same characteristics from our previous chapter.
    We have a public class named Person. The class has 3 member variables, which are
    the person’s first and last name, and their birth year. We added three public
    member functions to get the first and last name and the birth year. Then, we added
    a constructor for the person’s instantiation.


    Now, we want the Employee class to derive from the person class. Let’s take a
    look and see what we can do to the Employee class to derive members from the Person
    class.


    class Employee : public Person


    {


    private:


        int m_id;


    public:


        Employee() { }


        Employee(int id)


        {


            m_id = id;


        }


        int id;


        void ClockTime()


        {


             // clocktime code goes here


        }


        ~Employee()


         {


           m_id = 0;


         }


    };


    If you take a look at the code, you’ll see that there is only one small change
    to the code. The : public Person was added to the end of the class name. The colon
    character tells C++ that you want to derive or inherit from the parent class listed
    after the colon designation. When you derive from a parent class, that parent
    class properties and methods become available to the child class.'
