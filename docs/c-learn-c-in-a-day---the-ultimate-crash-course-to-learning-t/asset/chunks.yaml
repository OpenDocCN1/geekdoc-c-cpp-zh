    # Chapter 6: Loops and Conditional Statements


    Objective: Loops and conditional statements control the process flow for code
    execution. This chapter explains loops and conditional statements in detail.


    Loops and conditional statements are grouped into a programming concept called
    logic control. Both of these statements are logical statements used to evaluate
    variables and respond with either true or false. When the statement results in
    a true response, specific statements run. Conversely, if the statement results
    in a false value, statements are either skipped or the compiler is given an alternative
    set of instructions. Loops and conditional statements are very common in any C++
    program, so it’s important for any new developer to understand the processes.


    The if Statement


    The C++ if statement falls into the conditional statement category. It’s the main
    conditional statement that you’ll use when you create your programs. The switch
    statement is an alternative, but the if conditional statement is much more popular
    with coding standards. The if statement can evaluate one or more variables, and
    you can even use compound comparisons in your statements.


    We covered if statements very briefly in chapter 4, and now we’re going to explain
    them in better detail.


    First, let’s take a look at the standard if statement template.


    if (condition)


    {


       //statements that run when condition is true


    }


    If you recall from chapter 4, when the condition within parenthesis returns true,
    the statements within brackets are executed. What we didn’t show you in chapter
    4 is that you can set up alternative statements when the result is false. Let’s
    take a look at the if-else statement.


    if (condition)


    {


       //statements that run when condition is true


    }


    else


    {


      //statements that run when the condition is false


    }


    Now, let’s take a look at an if statement in action.


    int num1 = 5;


    int num2 = 6;


    int result = num1 + num2;


    if (result > 4)


    {


      cout << “Result is greater than 4.”;


    }


    else


    {


      cout << “Result is less than 4.”;


    }


    The above if statement is simple. If the result of the addition of num1 and num2
    is greater than 4, then the phrase “Result is greater than 4” is displayed. If
    it’s not, the alternative phrase “Result is less than 4” displays. Since the comparison
    of 4 with the result variable is true, the first statement is displayed. The alternative
    “else” statement only executes if the condition is evaluated to true.


    You might see an issue with this code. What happens if the result is equal to
    4? The condition results in a false response, so the else statements are executed.
    The problem is that the phrase results in “Result is less than 4,” which is inaccurate.


    We can change our if statement to perform compound comparisons. C++ doesn’t limit
    you to just one comparison like we’ve seen in previous examples. You can perform
    multiple comparisons and use logic operations to determine the output. Let’s take
    a look at an example.


    int num1 = 5;


    int num2 = 6;


    int result = num1 + num2;


    if (result > 4 )


    {


      cout << “Result is greater than 4.”;


    }


    else if (result == 4)


    {


      cout << “Result is equal to 4.”;


    }


    else


    {


      cout << “Result is less than 4.”;


    }


    Now our if statement accounts for equality. If result is equal to four, control
    is sent to the else-if section of the if structure. You can continue to stack
    these if and if-else statements together to account for each logical possibility
    in your code.


    If statements can get complex and difficult to read. If you have too many stacked
    if and if-else statements, coding standards ask that you create a function. We’ll
    get into functions in chapter 8, but know that functions are used when there are
    too many logical possibilities. Functions are more efficient, and they are easier
    to read and understand. Too many if statements can lead to logic bugs.


