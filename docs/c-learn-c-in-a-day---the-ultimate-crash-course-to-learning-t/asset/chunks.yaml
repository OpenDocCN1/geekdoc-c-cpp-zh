    \n# 在函数定义中使用参数\n\n如果你还记得第 6 章的内容，我们提到过，当你有太多的 `if-else` 语句时，使用函数进行决策会更好。当一个函数不接受任何参数时，它并没有太多的逻辑。这类函数用于你不需要任何逻辑且只想重复使用相同代码来计算值的情况。然而，使用函数更常见的方法是在函数中设置参数，并强制调用语句传递参数，这些参数随后被用于计算逻辑。\n\
    \n以下是带参数的函数模板：\n\n```cpp\ndatatype functionname(param1, param2, …\n{\n    // 要执行的语句\n\
    }\n```\n\n正如你所看到的，这种格式与我们在上一节中使用的 `main` 函数相似。唯一的区别在于我们添加了参数。你可以在函数中拥有任意数量的参数，但记住，你设置的参数数量必须被调用函数使用。如果你有太多参数，最好将你的函数拆分成几个函数，或者考虑重新设计你的代码以提高效率。\n\
