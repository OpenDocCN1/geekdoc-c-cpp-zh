    int main()


    {


        int result = calculate (5, 5);


        float fresult = calculate (7.5, 7.5);


         cout << result + fresult;


        return 0;


    }


    int calculate(int x, int y)


    {


                  int result = x * y;


                  return result;             


    }


    float calculate(float x, float y)


    {


                  int result = x * y;


                  return result;             


    }


    Our program now calls the calculate function for integers and the calculate function
    for floating point decimals. We don’t need to do anything specific with the calling
    statement, because the compiler already knows what function to call since we use
    decimals in one statement and integers in another. Just remember that the return
    values have different data types, so you need to make corresponding variables
    for the return results that match the return data type.


    Functions are an integral part of any C++ program. You’ll see them in any function,
    because the main foundation for a C++ language is the main function. When you
    overload your functions, ensure that it makes logical sense to use an overloaded
    function instead of a new function with a new name. This chapter gave you the
    starting concepts for your C++ programs, but it takes practice to fully understand
    the way functions work.


    Lab Questions


    1. When you create your function, what must you also do to ensure that the compiler
    doesn’t give you an error?


    a. set up a prototype statement


    b. set the function as void


    c. always return a value


    d. remove any if statements


    Explanation: the C++ language requires prototyping of functions, which means you
    must set the function definition at the beginning of your program files or the
    compiler gives you an error.


    2. What method is used when you want to use the same function with different parameters?


    a. encapsulation


    b. overloading


    c. dynamic variables


    d. global variables


    Explanation: Overloading a function means that the function has the same name,
    but different parameters and return types set the function apart.


    3. When you define a variable in a function, what type of scope does it have?


    a. global


    b. local


    c. overloaded


    d. predefined


    Explanation: a variable defined within a function has a local scope. When the
    function is finished executing, the variable is destroyed in memory.


    4. When you don’t want to return a value in a function, what data type should
    it use?


    a. void


    b. int


    c. float


    d. char


    Explanation: the void data type tells the compiler that no value is returned from
    the function.


    # Chapter 9: Operator Overloading


    Objective: This chapter teaches you how to overload common operators, which changes
    the way C++ works with standard arithmetic and assignment operators.


    In previous chapters, we’ve seen the way C++ works with operators. When we assign
    a value to a variable, C++ uses the equal sign. When you want to add two numbers,
    you use the plus sign. We’ve seen several different operators, and each of them
    can be overloaded to function differently within your programs.


    A Brief Overview of Operators


    We’ve used operators in a very basic way. We assumed that the plus sign means
    to add two numbers. We assumed that the equal sign always assigns a value to a
    variable. In fact, operators act like functions in C++. We discussed functions
    and overloading functions in the last chapter, so you should have a strong idea
    of how functions work.


    Let’s take a look at a simple, standard line of code that adds two numbers.


    int int1 = 1;


    int int2 = 2;


    int int3 = int1 + int2;


    The obvious response to this code is that two variables were created, and those
    two variables are added together and assigned to a third variable. We assume that
    the plus sign means addition, because that’s what we’re trained to understand
    from writing. However, the plus sign is actually a function in C++. Let’s look
    at a visual example from what we know about functions.


    int int1 = 1;


    int int2 = 2;


    int int3 = operator+(int1, int2);


    The above code is a better representation of what happens when you use the plus
    operator. The system sends both integers to add in a function, the calculation
    is made, and then the result is assigned to the int3 variable.'
