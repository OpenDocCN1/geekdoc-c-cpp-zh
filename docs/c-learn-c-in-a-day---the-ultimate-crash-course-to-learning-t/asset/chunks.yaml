    want to multiply decimal values? If you tried to send the calculate function a
    decimal, the compiler gives you an error, and your program crashes. To overcome
    this issue, you can make two functions with the same name. The process is called
    overloading. Overloading uses the same name as another function, but the return
    type or variables are different. There must be a difference in the functions return
    type and/or the number of parameters accepted. If you don’t have one of these
    differences, the program doesn’t know what function to use when you call it, and
    the compiler gives you an error.


