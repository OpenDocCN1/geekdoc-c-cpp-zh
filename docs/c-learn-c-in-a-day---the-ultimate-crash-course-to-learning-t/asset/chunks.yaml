        std::cout << "The employee time clocked is  : " << emp.ClockTime() << std::endl;


        return 0;


    } // The destructor is called here!


    In the main function, we call a new variable. You’ll see that we use the Employee
    data type since classes are their own custom data type. We then give the variable
    the name emp and we pass an employee Id to the calling function. We could pass
    the class no variable at all, and the first constructor would be called. Note
    that if there is no constructor, you can’t instantiate a class, so ensure that
    your classes have constructors before you instantiate a variable.


    We’ve decided to instantiate the employee with an Id of 2\. After we instantiate
    the class, we can then use its member functions. The ClockTime member function
    doesn’t do anything, but we call it in the cout call assumingly to print out the
    employee’s time. What you create within the function is up to you. You are in
    control of the member class functions, and they should always perform an action
    on the Employee object.


    Finally, return the integer value 0 to the main function. Once this main function
    ends, the Employee class destructor is called. Since the destructor changes the
    employee variable value to 0, the id is changed to zero and the class object is
    destroyed.


    Turning Your Variables to Static'
