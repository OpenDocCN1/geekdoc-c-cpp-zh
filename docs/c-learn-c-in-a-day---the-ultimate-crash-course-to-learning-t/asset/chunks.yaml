    ### 3. 当你从父类派生一个子类并想要使用父类属性时，你该怎么做？


    a. 实例化类并使用来自派生子类的属性


    b. 也实例化父类


    c. 调用父类构造函数


    d. 添加一个新函数来调用父类


    **解释：** 派生的子类可以使用父类属性，就好像这些属性是自己类的一部分一样。


    # 结论


    这本书之所以找到你，是因为你拥有巨大的潜力。


    你可能很容易认为并觉得自己受到了局限，但事实是，你远超自己所假设的模样。我们也曾经历过那里。我们也曾处于过这样的境地：当放弃或安于现状似乎是最佳选择时。幸运的是，作为激情栖息之的心告诉了我们事实并非如此。


    我们的团队是在 2014 年成立的。我们的指南针是这样的——编写能够传播编程知识和教育的书籍。目标是触及全球尽可能的人。让他们学习编程，并在此过程中找到解决方案、执行数学计算、展示图形和图像、处理和存储数据等等。我们实现这一梦想的整个旅程，对我们每个人的生活都起到了关键作用。我们相信，共同的梦想会变成现实。


    我们希望你成为这段旅程、这段美好现实的一部分。我们希望让学习编程对你来说变得简单而有趣。此外，我们希望让你开眼看到一个真相：编程可以是你生活中更美好事物的起点。


    编程可能有这种刻板印象，认为它太极客、压力太大。我们想告诉你，现在我们很享受这种生活：冲浪-编程-阅读-写作-吃饭。这有多么神奇？如果你喜欢这种生活，我们向你保证，没有什么是不可能的；像我们一样，你也可以让编程成为跳板，释放你解决问题的潜力，实现方案最大化并享受你真正拥有的生活。


    这本书之所以找到你，是因为你正处于一切奇事物的边缘！


    感谢阅读！


