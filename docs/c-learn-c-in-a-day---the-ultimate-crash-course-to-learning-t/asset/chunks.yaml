  raw: 'The switch statement is an alternative to the if statement. The switch statement
    does similar control flow except it does not do comparisons like the if statement.
    As we mentioned in the previous section, you can have several stacked if-else
    statements. However, when you get too many in a row, it becomes more difficult
    to read and debug. The alternative (besides building a function) is to use the
    switch statement, which is cleaner and easier to read.


    Let’s assume we have a list of colors using a structure we created in the previous
    chapter. If you recall, we created a structure named color. Here is the code again.


    enum Color


    {


      BLUE,


      BLACK,


      RED


    };


    Suppose we have a variable we need to evaluate. You could write 3 or 4 if-else
    statements, or you could use the switch statement. Because switch statements are
    easier to read, they are preferred when you need several comparisons.


    Let’s first take a look at what the code would look like if we used an if statement.


    Color color = BLUE;


    if (color == BLUE)


    {


       cout << “Color is blue.”;


    }


    else if (color == BLACK)


    {


       cout << “Color is black.”;


    }


    else if (color == RED)


    {


       cout << “Color is red.”;


    }


    else


    {


       cout << “Don’t know the color.”;


    }


    The above code works, but it’s much more difficult to read than the following
    switch statement.


    Color color = BLUE;


    switch (color)


        {


            case BLUE:


                std::cout << "Blue";


                break;


             case BLACK:


                std::cout << "Black";


                break;


            case RED:


                std::cout << "Red";


                break;


            default:


                std::cout << "Unknown";


                break;


        }


    As you can see, this code is much cleaner and accomplishes the same result as
    the previous if statements. The default statement is similar to the else statement.
    If no color is found, the default statement runs and displays “Unknown.”


    The switch statement has a slightly different way of executing than the if statement.
    The if statement does a comparison, but the switch statement only performs an
    equality comparison. The switch statement determines the variable you want to
    compare. In this example, we want to review the color variable.


    Once the variable for comparison is determine, the execution flow falls to the
    first case statement. The first case statement determines if the color variable
    equals blue. In this example, the result is true. If it was not true, the next
    case statement executes. Each case statement executes in the order in which it’s
    coded. If no color is found, only then will the default statements execute.


    When a case statement evaluates to true, the statements within the case statement
    executes. In this example, we simply display the color that we found. The break
    statements are important in the execution flow. The break statement tells the
    switch command to stop executing. If you don’t add a break statement to each case,
    the next case statement executes. The break statement is used to stop the comparison
    or the execution will continue until it meets with the default statement. The
    default statement would also run, and then you’d get a color and an unknown response
    from the program. This, of course, would be a bug in your code.


    The while and do while Loops


    The while loop is much more common than the do while loop, but it’s important
    to know both structures. These two loops control execution flow by evaluating
    a condition and looping until that condition is met. For instance, suppose you
    want to print values from 0 to 3\. Instead of writing three output statements,
    you can write one loop statement and dynamically display the values until all
    four values are displayed.


    Let’s see an example of the code.


    int count = 0;


    while(count < 4)


    {


       cout << count << “\n”;


       count++;


    }


    In the above code, we first initiate our variable that contains the numeric values.
    Execution then falls to the while loop. The while loop evaluates if the count
    variable is less than 4\. As long as this condition returns true, the while loop
    continues to run.  Since we initialize the count variable to 0, the first run
    of the while loop evaluates to true.


    Next, we have the statements within the while loop brackets. Any code within these
    brackets execute with each loop. We only have two statements within the while
    loop brackets. The while loop’s first statement is to print the value. In this
    example, the first value is 0.


    The next statement is imperative to avoid a bug called an infinite loop. An infinite
    loop occurs when the while loop’s condition always returns true, and there is
    no condition that stops it from looping. Infinite loops fill a computer’s memory,
    and it crashes the program. You’ll run into infinite loops as you code and debug
    your programs. If we removed the count increment statement, we would create an
    infinite loop.


    The count variable starts at 0 and the loop continues to execute until count reaches
    the number 4\. Once the value is 4, the while loop executes and any statements
    under it continue to execute.


    The alternative to a while loop is a do while loop. A do while loop works the
    same way, except the statements within the loop always execute once. With a while
    loop, if we set the count variable to 5, the loop would never execute. But if
    we used a do while loop, even setting the count variable to 5 wouldn’t stop the
    statements from running at least once. Let’s take a look at the same logic but
    with a do while loop.


    int count = 4;


    do


    {


       cout << count << “\n”;


       count++;


    }


    while(count < 4);


    We changed the initialization value to 4 and changed the while loop to a do while
    loop. You’ll notice that the while condition evaluates to false, but the statements
    are set prior to the condition. In this example, the printout shows 4 to the user
    and then increments the count variable by one. Since the count variable would
    then be 5, the while execution terminates and the next statements are shown.


    These small logic differences can make huge changes to your program. Part of writing
    great software is knowing how to design it properly. You’ll need to make decisions
    on what type of loop is the most efficient for you code without causing any logic
    errors.


    The for Loop


    The for loop is the most common loop that you’ll run into when you code. For loops
    have an incrementing value in the condition statement, so it’s much less likely
    that you’ll cause an infinite loop when you use them. With the while loop, you
    have to ensure that you use some kind of breakout method, but with the for loop
    the breakout procedure is built in.


    Let’s take a look at the for loop template.


    for (initialization statement ; condition ; increment expression)


    {


    // for loop statements go here


    }


    The initialization statement is the variable you want to use in the condition.
    Normally, this value is 0\. The next part of the loop is the condition that you
    want to evaluate. If the condition evaluates to true, the loop continues. If it
    evaluates to false, the for loop stops execution. The final section of the for
    loop is the increment expression. This increment is placed on the initialization
    variable in the first section. Let’s take a look at some example code. We’ll use
    the same logic we used for the while statement. We want to create a loop that
    prints out the numbers 0 to 3.


    for (int count=0; count < 4; count++)


    {


        cout << count << " ";


    }


    You’ll notice that we’re using the same variables. The count variable is initialized
    to 0\. We want to continue to loop as long as count is less than 4\. Each time
    the for loop iterates, the count variable is incremented by one. Note that the
    count variable is not incremented on the first loop. The for loop initializes
    the variable, evaluates if the condition is true, and then loops. Only on the
    second loop is the count variable incremented.'
