  trans: "\n这种循环的优势在于你不需要记住自增语句。如果你没有包含增语句，编译器会向你报错。\n\n这些循环和条件语句贯穿于任何程序。你需要牢固地掌握它们才能正确地调试代码。它们在代码中很常见，但也可能是导致\
    \ bug 的罪魁祸首。代码中仅仅一个微小的逻辑错误就可能导致程序出现巨大的 bug。因此，良好地设计代码并使用最高效的结构非常，这样如果你需要更改代码，它可以易于阅读。\n\
    \n## 实验题\n\n1. 当你定义一个永远停止执行的 while 循环时，创建的是什么类型的循环？\na. do while\nb. for while\n\
    c. 死循环\nd. 双重循环\n**解释**：死循环会消耗计算机内存并最终导致你的程序崩溃。\n\n2. 在 switch 语句中，你必须包含哪种语句以确保在\
    \ case 匹配后停止执行？\na. goto\nb. break\nc. default\nd. switch\n**解释**：`break` 语句停止\
    \ `switch` 语句内部的执行，因此每个 case 评估都不会运行。\n\n3. 哪种循环总是至少执行一次其语句？\na. do while\nb.\
    \ while\nc. for\nd. switch\n**解释**：`do while` 循环先执行其语句，然后评估条件。这意味着语句至少运行一次。\n\n\
    4. 哪种类型的循环创建死循环的概率较小，因为自增表达式被嵌入在循环结构中？\na. do while\nb. while\nc. for\nd. switch\n\
    **解释**：`for` 循环是逻辑执行流的首选循环，因为它在其结构中嵌入了自增表达式和条件。\n\n# 第 7 章：数组与指针\n\n目标：本章将涵盖数组及其索引，以及将值和变量链接到内存位置的指针。\n\
    \n数组和指针是稍微高级一点的概念。数组是每个程序的一部分，因为你只需要 1 个 变量就可以包含多个值。你可以在一个变量中包含 1 个或 1000 个值。指针是学生最难理解的概念之一，因为你指向的是特定的内存区域而不是实际的值。我们将在本章中涵盖这两个概念，以便你对它们有全面的理解。\n\
    \n## 构建数组\n\n有时你需要计算或评估几条记录。我们曾使用结构体作为员工记录的示例，其中我们要在两个记录中填充相同类型的数据。但如果你有 100 份员工记录需要处理怎么办？你可以使用数组，它会将每个值存储在单独的容器中。这些容器被称为索引（indexes）。\n\
    \n索引是数组中的一个位置。当你编写程序时，你会对这些索引进行递增和遍历。索引的一个重要部分是理解它们从哪里开始。索引始终从 0 开始。\n\n首先，让我们来看初始化数组的代码。\n\
    \n```cpp\nint numbers[2];\n```\n\n初始化一个数组只需要这些，但有些概念是你应该知道的。`int` 数据类型告诉编译器你想在数组中包含整数值。设置在数组上的数据类型定义了你可以在变量中存储的数据类型。在例示例中，我们想要存储整数值。\n\
    \n该语句的下一部分是数组名。我们给该数组命名为 `numbers`。括号中的数字 2 定义了你可以在数组中存储的值的数量。在这个示例中，我们将可能值的数量设置为\
    \ 2。需要注意的一个重要问题是，你存储的不是从 1 到 2 的数字。括号中的 2 是你可以存储的值的数量，但数组索引从 0 开始。这意味着数组的索引是 0\
    \ 和 1。记住，索引容器从 0 开始，最后一个索引容器是括号中的数字减去 1。在此例中，它是 2-1 或 1。\n\n创建数组后，你现在可以为其填充值了。你使用索引数字给数组赋值。让我们来看一些代码。\n\
    \n```cpp\nint numbers[2];\nnumbers[0] = 1;\nnumbers[1] = 3;\n```\n\n在上面的代码中，我们已经为两个索引都填充了值。你不需要在创建数组后立即向其填充值。大多数程序使用\
    \ `for` 循环为数组填充值。例如，假设你想使用 `for` 循环和我们在上一章中处理过的 `count` 变量来填充 `numbers` 数组。\n\n\
    如果你想使用循环来填充数组，这里有一个如何操作的示例。\n\n```cpp\nint numbers[2];\nfor (int count = 0; count\
    \ < 2; count++)\n{\n    numbers [count] = count;\n}\n```\n\n在上面的代码中，我们首先定义数组。我们再次设置数组包含\
    \ 2 个值。然后我们使用了上一章中处理过的 `count` 变量。将其初始化为 0 并开始循环。注意我们在数组值赋值中使用了 `count`。在第一次迭代中，`count`\
    \ 等于 0。这意味着第一次迭代填充了索引为 0 的数组容器。然后，`count` 增加 1，接着填充索引为 1 的索引容器——当你开始处理大型数据集时，这是一个重要的概念。我们可以在不改变代码和创建大量代码行的情况下将这些值更改为\
    \ 100。这是在处理大量数据时使用 `for` 循环的优势。\n\n数组和 `for` 循环也用于显示信息。就像上面的循环赋值值一样，我们也可以循环数组显示信息。让我们来看一个示例。\n\
    \n```cpp\nint numbers[2];\nnumbers[0] = 1;\nnumbers[1] = 3;\nfor (int count =\
    \ 0; count < 2; count++)\n{\n    cout << numbers [count] ;\n}\n```\n\n在这个示例中，我们为数组填充了值。我们使用\
    \ `for` 循环给数组赋值，但这次我们只是显示信息。注意在第二次迭代中，`count` 等于 1，显示的值是 3，因为 3 位于索引 1 中。\n\n\
    数组并不限于包含原始值。我们向你展示了如何处理简单的整数，但你也可以使用数组包含整个结构体。在结构体章节中，我们讨论了在需要创建多个变量时创建结构体。通过结构体，你可以更有效地组织数据。我们使用了一个员工结构体的示例。\n\
    \n假设你需要存储 100 份员工结构体。数组可以用于存储 100 份员工记录。让我们再次查看我们的员工结构体。\n\n```cpp\nstruct Employee\n\
    {\n    int id;\n    std::string firstname;\n    std::string lastname;\n    int\
    \ birthyear;\n};\n```\n\n现在要在数组中存储多个员工结构体。如果你记得，结构体创建了你的数据类型。这意味着我们可以使用 `Employee`\
    \ 数据类型定义数组变量。看以下代码。\n\n```cpp\nstruct Employee\n{\n    int id;\n    std::string\
    \ firstname;\n    std::string lastname;\n    int birthyear;\n};\n\nEmployee employees[2];\n\
    ```\n\n在上面的代码中，我们定义了结构体，然后创建了一个类型为 `Employee` 的数组。数组的名字是 `employees`，我们告诉编译器为两个\
    \ `Employee` 结构体分配内存。\n\n现在填充一个结构体并将其分配第一个索引容器。\n\n```cpp\nstruct Employee\n{\n\
    \    int id;\n    std::string firstname;\n    std::string lastname;\n    int birthyear;\n\
    };\n\nEmployee employees[2];\n\nEmployee emp1;\nemp1.id = 1;\nemp1.firstname =\
    \ “John”;\nemp1.lastname = “Smith”;\nemp1.birthyear = 2000;\n\nemployees[0] =\
    \ emp1;\n```\n"
- fmt: "\nAs you can see, you populate the structure just like you did in the previous\
    \ chapters. You then assign the structure to the array. You might wonder what\
    \ you can do to obtain values from the structure within the array. You could retrieve\
    \ the entire structure, but you can also retrieve values individually using the\
    \ array index and the property you want to retrieve. Let’s take a look at an example.\n\
    \n```cpp\nstruct Employee\n{\n    int id;\n    std::string firstname;\n    std::string\
    \ lastname;\n    int birthyear;\n};\n\nEmployee employees[2];\nEmployee emp1;\n\
    emp1.id = 1;\nemp1.firstname = \"John\";\nemp1.lastname = \"Smith\";\nemp1.birthyear\
    \ = 2000;\nemployees[0] = emp1;\ncout << employees[0].firstname;\n```\n\nWe added\
    \ one more line of code to our program. We display the `firstname` property located\
    \ in the structure at index 0. This is a basic way to retrieve information, but\
    \ you can use this method to loop through dozens of employee records and display\
    \ them to your users. Arrays are the classic way to handle execution when you\
    \ need to support several records and variable values in one procedure.\n\n##\
    \ Pointers\n\nPointers are a much more difficult concept. Pointers are variables\
    \ that point to a specific address space. If you recall from chapter 2, we discussed\
    \ how memory is reserved for your program and its variables. The compiler requests\
    \ memory space from the operating system when it defines a variable in your code.\
    \ The operating system allocates memory and allows the program to store data in\
    \ each memory address space.\n\nA pointer points to the address space allocated\
    \ for your variable. You can then print the address space value or the value contained\
    \ within the address space. Let’s take a look at an example.\n\n```cpp\nint mynumber\
    \ = 5;\nint *ptr = &mynumber;\n```\n\nEven though this is only two lines of code,\
    \ there is a lot to understand in these statements. The first statement is the\
    \ variable assignment we’ve seen already. The second line of code defines a pointer.\n\
    \nYou know a pointer is defined from the asterisk in front of the variable name.\
    \ We still use the `int` variable data type, which tells the compiler that the\
    \ value stored in memory is an integer. Pointer data types must match the values\
    \ they point to.\n\nWhen you define a pointer value, you don’t assign the typical\
    \ value you would with a normal variable. Since pointers contain memory address\
    \ spaces, you must point to a variable’s address space. When you place an ampersand\
    \ (`&`) in front of a variable, you tell the compiler that you want to retrieve\
    \ the memory address. In the above code, we assign the memory address space for\
    \ `mynumber` to the `*ptr` pointer variable.\n\nHere is a visual representation\
    \ to help you understand.\n\n```\n0012FFF7C                 <--- This is the value\
    \ of the pointer\n------------------\n5                         <----- This is\
    \ the value of the mynumber\n```\n\nThe `0012FFF7C` value is the memory address.\
    \ This memory address contains the value of `5`. As long as you have the address\
    \ value for the pointer, you can always obtain the value of the variable.\n\n\
    Let’s print out some values to view the results of our code.\n\n```cpp\nint mynumber\
    \ = 5;\nint *ptr = &mynumber;\ncout << mynumber; //prints 5\ncout <<*ptr; //prints\
    \ 5\ncout << ptr; //prints 0012FFF7C\ncout << &mynumber; //prints 0012FFF7C\n\
    ```\n\nAs you can see from the comments, each pointer and variable value points\
    \ to either the value of the `mynumber` variable or the address space. You don’t\
    \ normally use the address space in output, but you will use the pointer and memory\
    \ address information as you calculate low level procedures.\n\nOne issue to note\
    \ with pointers is that they must be initialized to a valid variable. If you don’t\
    \ initialize the pointer to a variable’s memory address, you can possibly crash\
    \ your program. The reason for this is from the way operating systems handle programs\
    \ and memory management. When you run your program, the operating system sets\
    \ aside memory space specific for your program. Programs are sandboxed, which\
    \ means they are cut off from accessing memory addresses for other programs. This\
    \ is a security measure to protect data from leaking between programs. It also\
    \ protects other programs from crashing if yours crashes. Sandboxing is a newer\
    \ operating system technology, but it’s standard in software design.\n\nLet’s\
    \ take a look at some example code. You can run this code in your own programming\
    \ environment, but it will likely crash. It won’t harm the computer, but just\
    \ know that it will likely crash.\n\n```cpp\n#include <iostream>\n\nint main()\n\
    {\n    int *ptr;\n    std::cout << *ptr;\n    return 0;\n}\n```\n"
