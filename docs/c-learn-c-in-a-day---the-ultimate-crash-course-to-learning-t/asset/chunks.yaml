  trans: "\n关于变量赋值有一点需要注意：你不能创建一个与另一个变量同名的新变量。我们假设我们想要重新分配原始变量的数据类型，但如果我们将此添加到原始的整数赋值代码中，编译器将会报错。例如，以下代码就会报错。\n\
    \n```cpp\nfloat mynumber = 5.5, anothernumber = 10.5;\nint mynumber = 5, anothernumber\
    \ = 10;\n```\n\n换句话说，作用域内（我们稍后会定义作用域）的所有变量必须有不同的名称。\n\n# 字符与字符串\n\n我们继续使用数字和整数作为示例，因为数值是最容易理解的变量和值。然而，你的编程体验中很大一部分将用在使用和操作字符串变量上。字符串变量是程序中的“单词”。它们会提示用户并允许用户存储字符串作为值，例如他们的姓名和地址。\n\
    \n由于 C++ 源自 C，第一个需要注意的重要点是，一个单词或字符串是一个字符数组。`C` 没有字符串库，因此你必须通过字符数组工作。`C++` 拥有字符串库，因此你可以像在其他语言中一样处理字符串。\n\
    \n让我们先看看 `char` 数据类型，这样你就能理解字符以及它们是如何存储的。字符在存储时实际上会被整数，因此你使用其数值或字符值来定义一个字符。可用的字符数值范围从\
    \ 32 到 127。你可能需要在 Google 上搜索查找表，以找到与字符匹配的数值。\n\n让我们来看看初始化字符的两种方式。\n\n```cpp\n\
    char ch1(97);\nchar ch2('a');\n```\n\n这两个字符都用相同的值初始化。第一个字符变量 `ch1` 以其原始数值格式进行初始化。第二个变量\
    \ `ch2` 使用你想要使用的字符进行初始化。在这个示例中，使用了字符‘a’。字符‘a’ 对应的数值是 97。\n\n即使你用数值初始化字符，输出也会显示其关联的字符值。让我们来看一些示例代码。\n\
    \n```cpp\n#include <iostream>\n\nint main()\n{\n    char ch(97);\n    std::cout\
    \ << ch;\n    return 0;\n}\n```\n\n在上面的代码中，尽管初始化变量被设置为 97，但输出显示的是字符‘a’。大多数程序员不知道与字符匹配的数值，因此他们使用字符初始化方法。然而，你可能在某一点需要知道对应的字符和数字。处理这种映射的最佳方法是在\
    \ Google 上搜索该信息的打印。\n\n使用上述方法，你需要创建一个字符数组来创建一个字符串。与 `C` 不同，`C++` 变得简单得多。我们没有创建数组，而是让字符串库为我们完成。我们在\
    \ `include` 语句中添加字符串库。\n\n```cpp\n#include <string>\n#include <iostream>\n\nint\
    \ main()\n{\n    std::string myName(\"John\");\n    std::cout << \"My name is:\
    \ \" << myName;\n    return 0;\n}\n```\n\n字符串的初始化与字符相似。区别是将数据类型设置为 `string`。你还会注意到代码顶部添加了字符串库。你需要这个库来以此种方式使用字符串。另一个区别是，你在定义字符时使用的是双引号而不是单引号（tick\
    \ mark）。这在大多数语言中都是标准做法。双引号表示字符串，而单引号表示字符定义。\n\n字符串变量被命名为 `myName` 并初始化为“John”。字符串库在后台将此值转换为字符数组，因此你不需要处理任何循环和内存分配。\n\
    \n最后，使用我们在第一章中看到的 `cout` 函数将字符串打印出来。\n\n你也可以将数值定义为字符串。这并不常见，但偶尔会发生。例如，用户输入首先作为字符串发送，然后在你的程序中转换为整数。让我们来看一个示例。\n\
    \n```cpp\n#include <string>\n#include <iostream>\n\nint main()\n{\n    std::string\
    \ myNumber(\"45\");\n    std::cout << \"My name is: \" << myNumber;\n    return\
    \ 0;\n}\n```\n\n除了变量名和值之外，这个程序没有太大变化。该值是一个数字，但它被放在引号中，所以计算机将其视为字符串。\n\n当你想要以字符串形式从用户获取输入时会发生什么？C++\
    \ 有 `cin` 函数，它与 `cout` 相反。`cin` 函数从用户获取输入。`cin` 的问题在于它获取字符串直到遇到第一个空白字符（如空格）。当遇到这个字符时，它会停止输入。你可以使用\
    \ `cin` 输入单个字符，但我们使用 `getline` 获取包含空格的完整短语。\n\n让我们来看一个示例。\n\n```cpp\n#include\
    \ <string>\n#include <iostream>\n\nint main()\n{\n    std::cout << \"Enter your\
    \ full name: \";\n    std::string fullname;\n    std::getline(std::cin, fullname);\n\
    \    std::cout << \"Your name is \" << fullname;\n    return 0;\n}\n```\n"
