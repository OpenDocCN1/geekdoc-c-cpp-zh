  trans: "\n正如你所见，你就像在之前的章节中那样填充结构。然后你将该结构赋值给数组。你可能想知道如何从数组中的结构中获取值。你可以检索整个结构，也可以使用数组索引和你想检索的属性来单独检索值。让我们来看一个示例。\n\
    \n```cpp\nstruct Employee\n{\n    int id;\n    std::string firstname;\n    std::string\
    \ lastname;\n    int birthyear;\n};\n\nEmployee employees[2];\nEmployee emp1;\n\
    emp1.id = 1;\nemp1.firstname = \"John\";\nemp1.lastname = \"Smith\";\nemp1.birthyear\
    \ = 2000;\nemployees[0] = emp1;\ncout << employees[0].firstname;\n```\n\n我们在程序中又添加了一行代码。我们显示了位于索引\
    \ 0 的结构中的 `firstname` 属性。这是获取信息的基本方法，但你可以使用这种方法遍历几十条员工记录并将其显示给用户。当你需要在一个过程中支持多条记录和变量值时，数组是处理执行的经典方式。\n\
    \n## 指针\n\n指针是一个困难得多的的概念。指针是指向特定地址空间的变量。如果你还记得第 2 章，我们讨论了内存如何为你的程序及其变量预留。当编译器在你的代码中定义变量时，它会向操作系统请求内存空间。操作系统分配内存并允许程序在每个地址空间中存储数据。\n\
    \n指针指向为变量分配的地址空间。然后你可以打印地址空间的值，或者该地址空间包含的值。让我们来看一个示例。\n\n```cpp\nint mynumber\
    \ = 5;\nint *ptr = &mynumber;\n```\n\n尽管这只有两行代码，但这些语句中有很多需要理解的内容。第一条语句是我们已经见过的变量赋值。第二行代码定义了一个指针。\n\
    \n你知道指针是通过变量名前的星号来定义的。我们仍然使用 `int` 变量数据类型，它告诉编译器存储在内存中的值是一个整数。指针数据类型必须与它们指向的值匹配。\n\
    \n当你定义一个指针值时，你赋值的不是普通变量的那种典型值。由于指针包含内存地址空间，你必须指向变量的地址空间。当你在变量前面放置取地址符（`&`时，你告诉编译器你想获取内存地址。在上面的代码中，我们将\
    \ `mynumber` 的内存地址空间赋值给指针变量 `*ptr`。\n\n这是一个可以帮助你理解的可视化表示。\n\n```\n0012FFF7C  \
    \               <--- 这是指针的值\n------------------\n5                         <-----\
    \ 这是 mynumber 的值\n```\n\n`0012FFF7C` 值是内存地址。这个内存地址包含值 `5` 的值。只要你拥有指针的地址值，你就可以一直获取变量的值。\n\
    \n让我们打印一些值来查看代码的结果。\n\n```cpp\nint mynumber = 5;\nint *ptr = &mynumber;\ncout\
    \ << mynumber; //打印 5\ncout <<*ptr; //打印 5\ncout << ptr; //打印 0012FFF7C\ncout\
    \ << &mynumber; //打印 0012FFF7C\n```\n\n正如从注释中看到的，每个指针和变量值要么指向 `mynumber` 变量的值，要么指向地址空间。你通常不在输出中使用地址空间，但在计算低层过程时，你将使用指针和内存地址信息。\n\
    \n指针需要注意的一个问题是，它们必须初始化为有效变量。如果你不将指针初始化为变量的内存地址，可能会导致程序崩溃。此的原因在于操作系统处理程序和内存管理的方式。当你运行程序时，操作系统会为你的程序留出特定的内存空间。程序是沙箱化的，这意味着它们被隔访问与其他程序的内存地址。这是一种防止数据在程序之间泄漏的安全措施。它还可以防止当你的程序崩溃时其他程序也崩溃。沙箱化是一种较新的操作系统技术，但它是软件设计中的标准。\n\
    \n让我们来看一些示例代码。你可以在自己的编程环境中运行这段代码，但它可能会崩溃。它不会损坏计算机，但只需知道它可能会崩溃即可。\n\n```cpp\n#include\
    \ <iostream>\n\nint main()\n{\n    int *ptr;\n    std::cout << *ptr;\n    return\
    \ 0;\n}\n```\n"
- fmt: "\nFunctions are in every C++ program. If you recall from the first chapters,\
    \ we included the `main` function to illustrate a full program. This function\
    \ is the entry point for a C++ program. This function then calls other functions\
    \ until the program is finished or closed by the user. Your C++ programs will\
    \ contain dozens of functions to make one program. This chapter will show you\
    \ how to create a function, pass parameters, overload them and we even explain\
    \ the concept of the stack and heap.\n\n# Creating a Function\n\nWe had a brief\
    \ overview of functions, but let’s review them again. The best function to review\
    \ when starting a C++ programming course is the `main` function since it’s a part\
    \ of every C++ program.\n\n```cpp\n#include <iostream>\n\nint main()\n{\n    cout\
    \ << “Hello World”;\n    return 0;\n}\n```\n\nThe above code is one of the simplest\
    \ programs in C++. The Hello World program is standard for new developers to help\
    \ them understand programming concepts. Let’s dissect this program line by line.\n\
    \nThe `include` statement we’ve seen before. This statement includes external\
    \ libraries. In this example, we’ve imported the `iostream` library, which is\
    \ necessary for the `cout` function.\n\nNext, the function is defined. The `int`\
    \ statement tells the compiler that an integer value is returned after the function\
    \ is finished executing. All `main` functions in C++ programs return an integer\
    \ value. This integer is used to identify if any error is thrown during program\
    \ execution. When a `0` is returned, it tells the compiler that the program ran\
    \ successfully.\n\nThe `main` function does not take any parameters, but we’ll\
    \ cover functions and parameters in the next section.\n\nAll statements within\
    \ the brackets are the function’s execution code. The function will continue executing\
    \ until it reaches the `return` statement. Remember that functions with a data\
    \ type must return a value, so you must return an integer in this `main` function.\
    \ If you tried to return a string, the compiler would give you an error.\n\nYou\
    \ can also use the `void` data type. Let’s take a look at a function with a `void`\
    \ data type definition.\n\n```cpp\n#include <iostream>\n\nvoid calculate()\n{\n\
    \    int int1 = 5;\n    int int2 = 5;\n    cout << int1 + int2;\n}\n```\n\nNotice\
    \ in this `calculate` function, `void` is used as the data type. This tells the\
    \ compiler that no value is returned. As you can see, there is no `return` statement\
    \ in the function. You can still use the `return` statement if you want to terminate\
    \ the function prematurely. For instance, if a value evaluates to a specific condition,\
    \ you can use the `return` statement.\n\nLet’s take a look at a `void` statement\
    \ with a `return`.\n\n```cpp\n#include <iostream>\n\nvoid calculate()\n{\n   \
    \ int int1 = 5;\n    int int2 = 5;\n    if (int1 == 5)\n    {\n        return;\n\
    \    }\n    cout << int1 + int2;\n}\n```\n\nNotice in this `return` statement\
    \ that no value is indicated. Because the function is set to `void`, any return\
    \ value creates an error in your code, and the compiler won’t compile it. In this\
    \ example code, if the `int1` variable is `5`, the function terminates prematurely.\
    \ Since `int1` is actually `5`, this function displays nothing to the user. It’s\
    \ not a logical function to use, but it gives you a good example of how you can\
    \ terminate a function and return execution to the calling function.\n\n# Using\
    \ Parameters with a Function Definition\n\nIf you recall from chapter 6, we mentioned\
    \ that it’s better to use functions for decision making when you have too many\
    \ `if-else` statements. When a function doesn’t take any parameters, there isn’t\
    \ much logic to it. These types of functions are used when you don’t need any\
    \ logic and want to just reuse the same code to calculate values. However, a more\
    \ common way to use functions is to set parameters in the function and force the\
    \ calling statement to pass parameters that are then used to calculate logic.\n\
    \nThe following is the template for a function with parameters:\n\n```cpp\ndatatype\
    \ functionname(param1, param2, …\n{\n    // statements to execute\n}\n```\n\n\
    As you can see, the format is similar to the `main` function we worked with in\
    \ the last section. The only difference is we added parameters. You can have any\
    \ number of parameters in your function, but remember that the number of parameters\
    \ you set must be used by the calling function. If you have too many parameters,\
    \ it’s best to break down your function into several functions or consider redesigning\
    \ your code for efficiency.\n\nThe template helps us learn the way functions are\
    \ set up, but it doesn’t help when we’re trying to learn to code real programs.\
    \ Let’s take a look at an actual function with some real logic.\n\n```cpp\n#include\
    \ <iostream>\n\nint calculate (int x, int y)\nint calculate(int x, int y)\n{\n\
    \    int result = x * y;\n    return result;\n}\n```\n\nWe removed the `main`\
    \ function for simplicity. There are several concepts to consider in these statements.\n\
    \nFirst, you’ll notice that it looks like we defined the function twice, but we\
    \ didn’t. C++ and even C use a concept called prototyping. You’re required to\
    \ add the prototyping statements at the beginning of you C++ programming files.\
    \ The prototype is just a copy of the function without the execution statements.\
    \ It seems useless, but you’ll need it for the compiler.\n\nThe next statements\
    \ are the actual function. This function is named `calculate`, and it takes two\
    \ integers as parameter. The parameters in this function are named `x` and `y`,\
    \ but the calling statement does not need the same function. The `x` and `y` variables\
    \ are then used to multiply the two statements and return a result. It’s a simple\
    \ function, but it has a purpose. Let’s add our `main` function back and have\
    \ it call the `calculate` function.\n\n```cpp\n#include <iostream>\n\nint calculate\
    \ (int x, int y)\n\nint main()\n{\n    int result = calculate (5, 5);\n    cout\
    \ << result;\n    return 0;\n}\n\nint calculate(int x, int y)\n{\n    int result\
    \ = x * y;\n    return result;\n}\n```\n\nNow we have a full program with a calling\
    \ function and a result returned. The `main` function calls the `calculate` function\
    \ with the two integer parameters. We pass two values of `5` to the `calculate`\
    \ function. The `calculate` function multiples the two values and returns `25`\
    \ to the calling statement. The `25` value is stored as `result` in the calling\
    \ statement. Now that we have the result, we print out the value to the screen.\n\
    \nThe above program is how you use functions, and how most programs are designed.\
    \ Large applications have hundreds of functions that call each other to create\
    \ a full functional C++ program.\n\n# Variable Scope\n\nWhen you work with functions,\
    \ variable scope is an issue. The variable scope defines where you can obtain\
    \ a variable’s value and if the compiler can recognize the variable if you attempt\
    \ to use it.\n\nThere are two types of scope: global and local. Most variables\
    \ are local, but constants are often made global.\n\nA local variable is only\
    \ available within the function. Let’s return to the program we created in the\
    \ previous section.\n\n```cpp\n#include <iostream>\n\nint calculate (int x, int\
    \ y)\n\nint main()\n{\n    int result = calculate (5, 5);\n    cout << result;\n\
    \    return 0;\n}\n\nint calculate(int x, int y)\n{\n    int result = x * y;\n\
    \    return result;\n}\n```\n"
