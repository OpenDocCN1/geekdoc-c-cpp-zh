  trans: "\n\n# 第 10 章：使用 C++ 进行面向对象编程\n\n目标：本章将向你介绍面向对象编程（OOP）。OOP 是编写可重用代码的基础，并且可以用于其他语言。\n\
    \n面向对象编程（OOP）是 C++区别于其前身 C 语言的。C 适用于低层编程，但 OOP 对于大型应用程序来说是必要的。我们在上一章中已经简单接触了 OOP，但在本章中我们将更多地关注这个主题。\n\
    \n## OOP 设计简述\n\n### 重载比较运算符\n\n如你所见，这段代码与重载算术函数的代码没有太大区别。我们只需要分配正确的重载函数名即可。在这种情况下，我们想要重载比较运算符，因此我们使用了\
    \ `operator==` 和 `operator!=` 函数。你会再次看到 `friend` 函数修饰符。在重载运算符时，这个修饰符是必要的。\n\n\
    代码其余部分比较我们发送到类函数的两个值，并返回 `true` 或 `false`。请记住，重载函数返回的结果或输出变量与原始函数相同。\n\n### 重载自增和自减运算符\n\
    \n你可能记得在之前的章节中，自增和自减运算符会在值的基础上加 1 或减 1。当你需要对变量加或减 1 时，这两个运算符对于简写操作非常有用。我们已经看过了其他运算符的重载，所以这对你来说应该变得容易。让我们来看代码。\n\
    \n```cpp\nclass Employee\n{\nprivate:\n    int m_emp;\npublic:\n    emp (int emp1=0)\n\
    \    {\n        m_emp = emp1;\n    }\n    Employee & operator++();\n    Employee\
    \ & operator--();\n    int GetDigit() const { return m_emp; }\n};\n\nEmployee\
    \ & Employee::operator++()\n{\n    if (m_emp == 9)\n        m_emp = 0;\n    else\n\
    \        ++m_emp;\n    return *this;\n}\n\nEmployee & Employee::operator--()\n\
    {\n    if (m_emp == 0)\n        m_emp = 9;\n    else\n        --m_emp;\n    return\
    \ *this;\n}\n```\n\n这个类及其函数要复杂得多，因为我们必须考虑同时自减和自增数字。注意，这次不需要 `friend` 函数。我们可以在不使用\
    \ `friend` 函数的情况下创建运算符重载，因为我们不需要考虑任何值类型。我们只需要对传递给重载函数的任何值加或减 1 即可。让我们看看带有 `main`\
    \ 函数调用重载函数的完整代码。\n\n```cpp\nclass Employee\n{\nprivate:\n    int m_emp;\npublic:\n\
    \    emp (int emp1=0)\n    {\n        m_emp = emp1;\n    }\n    Employee & operator++();\n\
    \    Employee & operator--();\n    int GetDigit() const { return m_emp; }\n};\n\
    \nEmployee & Employee::operator++()\n{\n    if (m_emp == 9)\n        m_emp = 0;\n\
    \    else\n        ++m_emp;\n    return *this;\n}\n\nEmployee & Employee::operator--()\n\
    {\n    if (m_emp == 0)\n        m_emp = 9;\n    else\n        --m_emp;\n    return\
    \ *this;\n}\n\nint main()\n{\n    Employee Emp1(6);\n    Employee Emp2(8);\n \
    \   Employee total = Emp1++;\n    std::cout << \"I have \" << total << \" total\
    \ ids.\" << std::endl;\n    return 0;\n}\n```\n\n与其它重载函数一样，我们再次使用 `main` 函数调用类成员函数来使用重载方法。我们不需要\
    \ `friend` 类型，因为我们只需要将一个数值加 1 或减 1。\n\n运算符重载是某些程序中的常见概念，但它们并不处常见。你仍然应该理解这些概念，并学习如何创建你自己的重载运算符。本章帮助你理解了基本概念，以便你可以将它们应用到你自己的程序中。一旦你理解了重载，就可以理解\
    \ C++ 和面向对象编程的重要部分。\n\n## 实验题\n\n1. 当你在程序中使用数学运算符时，计算实际上发生了什么？\n   a. 这种操作实际上是一个函数操作\n\
    \   b. 该函数从计算机内存中移除\n   c. 使用外部库进行计算\n   d. 计算方式有所不同\n   *解释：* 运算符在 C++ 中看起来像是简单的数学运算，但\
    \ C++ 中的运算符实际上是函数。\n\n2. 当你想在 C++ 中重载运算符时，必须使用的函数运算符是什么？\n   a. parent\n   b.\
    \ friend\n   c. private\n   d. public\n   *解释：* 在 C++ 中重载算术和比较运算符时，需要 `friend`\
    \ 运算符。\n\n3. 当你将变量传递给重载函数时，你是如何传递的？\n   a. 使用指针变量运算符\n   b. 使用变量的值\n   c. 传递整个自定义类对象\n\
    \   d. 使用值的内存地址\n   *解释：* 传递内存地址是向自定义类函数传递值并重载标准运算符工作方式的方法。\n\n"
- fmt: "\nNext are the properties. Properties are the nouns for the class, so they\
    \ describe a class’s features. For instance, the steering wheel is black, round,\
    \ and has the air bag in the center. These are properties that describe the class,\
    \ and you use these to build your class design. The trunk dimensions, whether\
    \ or not it’s empty or full and its color are also properties for the class. As\
    \ you can see, you can get as detailed as you need for each class.\n\nOnce you\
    \ put all of your component classes together, then you have a full car. The car\
    \ in this analogy is the program. You classes can be used to build other programs,\
    \ which is another benefit of writing modular code. For instance, you could use\
    \ the same steering wheel class for another car, because the steering wheel is\
    \ generally the same among all cars.\n\nThis is a brief overview of classes and\
    \ OOP. Now we’ll take a look at some code and more architecture samples.\n\n##\
    \ Classes\n\nWe already saw some examples of classes, but we didn’t go into details.\
    \ Classes and structures are very similar, except classes provide you with more\
    \ ability to create complete components rather than limit you to properties.\n\
    \nLet’s use the `Employee` structure we created in earlier chapters and use it\
