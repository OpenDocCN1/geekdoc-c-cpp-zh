    \ C++ 计算程序添加一个全局常量变量。\n\n```cpp\n#include <iostream>\n\nint calculate (int x,\
    \ int y);\n\nconst int MAININT = 4;\n\nint main()\n\n{\n    int result = calculate\
    \ (5, 5);\n    cout << result + MAININT;\n    return 0;\n}\n\nint calculate(int\
    \ x, int y)\n{\n    int result = x * y;\n    return result;\n}\n```\n\n记住，常量通常用全大写字母创建。这样做是为了帮助程序员在阅读代码时快速识别常量。正如你所看到的，当你阅读代码时，你知道\
    \ `MAININT` 是一个常量。它从代码其他变量中脱颖而出。\n\n另外注意，你可以在代码的任何地方使用 `MAININT` 变量。它是全局可用的，直到程序关闭时才会被销毁。由于全局变量始终可用，它们占用的内存比局部变量多，这也是它们在不需要时不被首选的原因之一。\n\
    \n## 函数重载\n\n我们创建了 `calculate` 函数，但它只接收整数。如果你想乘以小数值怎么办？如果你尝试向 `calculate` 函数发送一个小数，编译器会给出一个错误，你的程序将会崩溃。为了解决这个问题，你可以创建两个同名的函数。这个过程被称为重载。重载使用了与另一个函数相同的名称，但返回类型或变量不同。函数的返回类型和/或接受的参数数量之间必须存在差异。如果你不具备这些差异之一，程序在调用它时就不知道使用哪个函数，编译器会给出一个错误。\n\
    \n让我们回到 `calculate` 函数，但现在我们将添加一个允许你计算小数值的重载函数。\n\n```cpp\n#include <iostream\n\
    \nint calculate (int x, int y);\n\nfloat calculate(float x, float y);\n\nconst\
    \ int MAININT = 4;\n\nint main()\n{\n    int result = calculate (5, 5);\n    cout\
    \ << result + MAININT;\n    return 0;\n}\n\nint calculate(int x, int y)\n{\n \
    \   int result = x * y;\n    return result;\n}\n\nfloat calculate(float x, float\
    \ y)\n{\n    int result = x * y;\n    return result;\n}\n```\n\n当你添加一个函数时，不要忘记添加它的原型。我们添加了原型以及以及一个新的\
