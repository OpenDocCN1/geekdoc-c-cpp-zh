        return *this;


    }


    Employee & Employee::operator--()


    {


        if (m_ emp == 0)


            m_ emp = 9;


        else


            --m_ emp;


        return *this;


    }


    This class and its functions are much more complex, because we have to account
    for numbers that both decrement and increment. Notice that we don’t need the friend
    function this time. We can create our own operator overloads without the friend
    function, because we don’t need to account for any multiple value types. We just
    need to add or subtract 1 for any value passed to the overloaded function.


    Let’s take a look at the full code with the main function making a call to the
    overloaded function.


    class Employee


    {


    private:


        int m_emp;


    public:


        emp (int emp1=0)


        {


            m_ emp = emp1;


        }


        Employee & operator++();


        Employee & operator--();


