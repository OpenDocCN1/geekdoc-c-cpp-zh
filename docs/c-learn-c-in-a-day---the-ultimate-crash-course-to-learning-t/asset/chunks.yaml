    john.firstname = “John”;\njohn.lastname = “Smith”;\njohn.birthyear = 2000;\n\n\
    Employee jane;\njane.firstname = “John”;\njane.lastname = “Smith”;\njane.birthyear\
    \ = 2000;\n```\n\nThis is much more organized and easier to read than the previous\
    \ variables we used. We still define two employees, but it’s easier to read and\
    \ understand. If you call the `Employee` variable `john`, you know where you stored\
    \ the first name.\n\nStructures make it much easier to remember your variables\
    \ and what data they store. It also makes it easier to read and understand your\
    \ code when a secondary programmer must maintain it. You can also use the `cout`\
    \ function to display the information when you populate the structure. Let’s complete\
