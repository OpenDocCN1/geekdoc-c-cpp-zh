    the value, the compiler will give you an error. For instance, the following code
    gives you a compiler error.


    const float MYFACTOR { 1.1 };


    MYFACTOR = 10.0;


    The above code throws an error. When you create a constant, always determine if
    you need a static variable or a dynamic one. Most programs have a few constants,
    but you should normally create a dynamic variable. For instance, if you have a
    website URL for an API, you would set it as a constant. If you need to retrieve
