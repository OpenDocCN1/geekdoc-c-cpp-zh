  trans: "\n静态变量也是类对象中的一种选项。静态成员变量的工作方式与普通变量略有不同。静态成员变量的作用类似于全局变量。如果你还记得之前的章节，我们讨论过全局变量与局部变量。在上一节中，所有的类变量都是局部成员变量，除非你显式地调用它们或在成员函数中返回它们，否则无法在类外部访问它们。\n\
    \n通过静态成员变量和函数，即使在代码中的其他类对象中也可以调用其值。换句话说，无论你使用哪个对象，静态成员变量的值都保持不变。让我们来看示例代码，并将我们的变量改为静态。\n\
    \n```cpp\nclass Employee\n{\nprivate:\n    int m_id;\npublic:\n    Employee()\
    \ { }\n    Employee(int id)\n    {\n        id = id;\n    }\n  static int id;\n\
    \    std::string firstname;\n    std::string lastname;\n    int birthyear;\n \
    \   void ClockTime()\n    {\n        // clocktime code goes here\n    }\n    ~Employee()\n\
    \    {\n        m_id = 0;\n    }\n};\n\nint main()\n{\n    Employee emp1 ( 2 );\n\
    \    Employee emp2 ( );\n    std::cout << \"The employee time clocked is  : \"\
    \ << emp2.id << std::endl;\n    return 0;\n} // The destructor is called here!\n\
    ```\n\n在上面的代码中，我们更改了传递给 `Employee` 构造函数的 `Id` 赋值。它现在指向一个公共的静态整数变量，因此我们可以在类外部调用它。注意，我们为\
    \ `emp2` 调用了没有参数的第二个构造函数。这意味着没有为员工的 ID 设置任何值。然而，当我们打印语句时，调用了 `emp2.id` 属性。尽管我们从未为第二个\
    \ `Employee` 类对象设置 `Id`，但输出结果仍将是 2。\n\n当你需要一个变量在多个类对象中作为全局变量作用时（正如我们在这个示例中使用的那样），静态属性非常有用。\n\
    \n本章重点讨论了类的基础知识。你需要尽可能地进行练习，以理解它们如何工作，以及在设计应用程序时你可以用它们做什么。你应该尽力理解类，因为它们是大多数大型应用程序的一部分，特别是当使用\
    \ C++ 语言编写时。\n\n### 实验题\n\n1. 当你想让类变量变为全局时，使用什么修饰符？\n   a. global\n   b. const\n\
    \   c. private\n   d. static\n   **解释：** `static` 修饰符将局部类变量转换为全局可访问变量，无论从哪个类中调用它。\n\
    \n2. 当你想允许代码实例化该类时，你需要添加什么？\n   a. destructor\n   b. constructor\n   c. member\
    \ function\n   d. private members\n   **解释：** `constructor`（构造函数）允许类被实例化，并且可以通过重载默认构造函数来为类对象设置默认值。\n\
    \n3. 你想为 `Employee` 类写一个析构函数。写出析构函数的正确语法。\n`~Employee() { }`\n**解释：** 析构函数的名称始终与类名相同。它总是带有波浪号前缀，并且永远不接受参数。\n\
    \n4. 如果你想允许外部类实例化一个类，除了包含构造函数外，你还需要对类进行什么？\n   a. 将其设置为 private\n   b. 将其设置为 public\n\
    \   c. 将变量设为 static\n   d. 包含 destructor\n   **解释：** 私有类不能被实例化，但公共类可以从程序中的任何其他类实例化。\n\
    \n# 第 11 章：继承\n\n**目标：** 本章教授程序员如何从父类继承类，以便在程序中定义可重用的代码。\n\n我们在上一节中讨论了类，并重点创建了一个描述我们员工数据库的类。我们使用汽车来类比类的设计方式。我们遗漏了类设计的一个部分——类继承。继承允许你从父类派生信息并在子类中使用它。本章将讨论继承的工作原理，以及你如何通过从主父类对象继承对象来设计功能完全的\
    \ C++ 程序。\n\n## 继承概述\n\n在进入继承的代码之前，理解基础知识是非常重要的。继承允许你从父类派生类。想象你想创建一个名为 `Animal`\
    \ 的程序。你随后需要描述几种动物及其功能。\n\n动物具有所有物种共有的基本特征。眼睛、鼻子和皮肤在所有动物身上都可以找到。这些特征的属性可能会变化，但你知道所有动物都有这三个特征。动物类可以作为你所有动物的父类。\n\
    \n现在，你知道猫和狗也是动物。猫有眼睛、鼻子和皮肤。狗也有皮肤、鼻子和眼睛。因此，这两个类可以从主动物类派生它们的特征。\n\n你还可以拥有子类中的子类。例如，通过你的狗类，你可能拥有描述不同品种狗的子类。它们都是狗，所以狗仍然保持为父类。\n\
    \n## 基础继承\n\n让我们回到 `Employee` 类。我们想创建一个父类。让我们来看 `Employee` 类。\n\n```cpp\nclass\
    \ Employee\n{\nprivate:\n    int m_id;\npublic:\n    Employee() { }\n    Employee(int\
    \ id)\n    {\n        id = id;\n    }\n    int id;\n    void ClockTime()\n   \
    \ {\n        // clocktime code goes here\n    }\n    ~Employee()\n    {\n    \
    \    m_id = 0;\n    }\n};\n```\n\n现在我们需要创建一个 `Person` 类。它可以非常简单，只包含一些属性。让我们创建\
    \ `Person` 类。\n\n```cpp\n#include <string>\nclass Person\n{\npublic:\n    std::string\
    \ firstname;\n    std::string lastname;\n    int birthyear;\n    std::string GetFirstName()\
    \ { return firstname; }\n    int GetBirthYear() { return birthyear; }\n    std::string\
    \ GetLastName() { return lastname; }\n    Person(std::string strName = \"\", int\
    \ nAge = 0, bool bMale = false)\n    {\n    }\n};\n```\n\n你会注意到我们在上一节相同的特征。我们有一个名为\
    \ `Person` 的公共类。该类有三个成员变量，即人的姓、名和出生年份。我们添加了三个成员函数来获取姓名和出生年份。然后，我们为人的实例化添加了构造函数。\n\
    \n现在，我们希望 `Employee` 类派生自 `Person` 类。让我们看看可以对 `Employee` 类做什么，以从 `Person` 类派生成员。\n\
    \n```cpp\nclass Employee : public Person\n{\nprivate:\n    int m_id;\npublic:\n\
    \    Employee() { }\n    Employee(int id)\n    {\n        m_id = id;\n    }\n\
    \    int id;\n    void ClockTime()\n    {\n        // clocktime code goes here\n\
    \    }\n    ~Employee()\n    {\n        m_id = 0;\n    }\n};\n```\n\n如果你查看代码，你会发现代码中只有一个微小的变化。在类名末尾增加了\
    \ `: public Person`。冒号字符告诉 C++ 你想从冒号后面指定的父类进行派生或继承。当你从父类派生时，该父类的属性和方法对子类是可用的。\n\
    \n"
