    # Chapter 3: Variables and Data Types


    Objective: This chapter covers variables and data types that we highlighted in
    the previous chapter. We will get more in depth and in detail for these C++ structures.


    We just covered the surface in the last chapters when it comes to variables and
    data types. You need much more information to get started programming in C++.
    Variables are the main foundation for a program, so you should have a deep understanding
    before you get started programming. Data types define these variables, so you’ll
    need to learn these concepts together as they go hand-in-hand during the coding
    process.


    Memory Addresses


    Before we get into creating variables and data types, we first need to understand
    how the computer assigns variables in memory. This will give us a better understanding
    of the reason we need to define a data type and the way these values are allocated
    in memory.


    The smallest unit of memory is called a bit. A bit is either a one or a zero.
    Since we need more than just a one or a zero to perform coding instructions, memory
    is laid out with several memory units’ side-by-side. These memory units are a
    byte. The smallest amount of memory that you can allocate is a byte, which is
    comprised of 8 bits.


    A data type tells the compiler and the operating system what type of data is stored
    in these memory address spaces, and it tells them how it should be interpreted.
    It’s the CPU that’s responsible for translating your coding instructions into
    binary and storing them in memory. When you make a call to retrieve the value,
    the CPU finds the memory location and sends it back to your code.


    The data type tells the compiler the amount of memory that should be allocated
    and set aside for the variable value. An integer only needs a byte of memory space,
    but a string or an array might need much more memory space. If you try to store
    a string in a variable that was defined as an integer, the compiler would throw
    an error and memory allocation would fail because not enough memory was set aside.
    This is why it’s important to know the type of variable you need before you define
    a function or procedure.


    Defining Numeric Variables


    There are two types of numeric variables in C++. The first is the integer. We’ve
    seen several snippets of code using an integer, so you should be somewhat familiar
    with these data types. An integer is a whole number. It can be a negative or positive
    whole number, but what you should remember is that there is never a decimal value
    with an integer.


    The next type of variable is a decimal or float value. The decimal data type is
    available in some languages, but C++ refers to a decimal variable as a float.
    The decimal number can have a 0 in the decimal place, but it always has a fraction
    as part of the value. Float data types can also be negative or positive.


    Let’s take a look at some examples. First let’s review integers again.


    int mynumber = 5;


    We discussed this assignment in the last chapter. The int data type is first used,
    and then we define the variable name. We don’t always need to initialize the variable
    with a value. Sometimes, we don’t know the value that we want to use until later
    in the program. The following syntax is also valid.


    int mynumber;


    mynumber = 5;


    The second line of code can be after the variable initialization or several lines
    below it. This lets you assign a value when you don’t have a value for it until
    later in the program.


    You can also assign multiple variables in the same line of code. Let’s take a
    look at multiple initialization.


    int mynumber = 5, anothernumber = 10;


    Notice that the second number doesn’t have a data type indicated. This is shorthand
    when you need to define several variables with multiple data types. Suppose you
    want to define multiple variables but don’t know the value. The following code
    lets you initialize a variable without assigning a value.


    int mynumber, anothernumber;


    Both variables are set as integers. Note that you must be uniform when you create
    variables. You can mix initialization types. The following syntax is invalid and
    throws an error in your code.


    int mynumber, anothernumber = 5;


    These examples show you integer numbers, but we could also use this same syntax
    for decimal or floating point numbers. Let’s take a look at the same code except
    with a floating point data type.


    float mynumber = 5.5, anothernumber = 10.5;


    We’ve used shorthand again to reassign the same variables with a float data type.
    We also changed the numeric values to floating point values. We could assign a
    float integer with a whole integer number, but then later change the value to
    a decimal. As long as you define a variable as a floating point decimal, you can
    assign it a decimal value at any time.'
