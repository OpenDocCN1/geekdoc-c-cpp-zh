    \n这条语句中有趣的地方在于，我们为变量取了一个全大写字母的名称。`C++` 是一种大小写敏感的语言，因此变量 `myfactor`、`MYFACTOR`\
    \ 和 `myFactor` 在 `C++` 中都是不同的变量。你永远不会创建三个名称相同但大小写不同的变量，但在编写代码时，你应该意识到它们是不同的变量。我们在这一条语句中使用全大写字母，是因为该变量是一个常量。编译器并没有强制要求，但这是编码标准的要求。你在职业生涯中必须遵循的大多数编码标准都要求将常量设置为全大写字母。\n\
    \n在为变量命名后，我们在括号中设置它的值。请记住，常量的值是不会改变的，因此无论它位于你代码的哪个位置，该常量的值都是这个值。事实上，如果你尝试更改该值，编译器将向你报告错误。例如，以下代码将导致编译错误。\n\
    \n```\nconst float MYFACTOR { 1.1 };\n\nMYFACTOR = 10.0;\n```\n\n上述代码会报错。当你创建一个常量时，务要确定你需要的是静态变量还是动态变量。大多数程序都有几个常量，但通常你应该创建一个动态变量。例如，如果你有一个\
    \ API 的网站 URL，你会将其设置为常量。如果你需要根据用户输入检索 URL，你将创建一个动态变量。\n\n我们在这一章中涵盖了几个概念。变量和数据类型是\
    \ `C++` 程序的基石，虽然它们是更容易理解的概念，但理解它们重要性与理解更复杂的概念一样。\n\n### 实验题\n\n1. 当你想在 `C++` 中定义一个小数值时，使用什么数据类型来声明变量？\n\
    \   a. decimal\n   b. integer\n   c. float\n   d. point\n\n   解释：`float` 变量类型允许你为小数分配内存并在变量中存储小数。\n\
    \n2. 当你定义一个为 `true` 的布尔值时，存储在内存中的实际值是什么？\n   a. 0\n   b. 1\n   c. true\n   d.\
    \ yes\n\n   解释：布尔值会被转换为 1 或 0。`true` 值等于 1，`false` 值等于 0。\n\n3. 在 `C++` 中你应该使用什么函数从用户处获取字符串输入？\n\
    \   a. getline\n   b. get\n   c. cin\n   d. input\n\n   解释：应该使用 `getline` 函数从用户处获取输入。`cin`\
    \ 函数也可以用，但它会在遇到空白字符时停止。为了确保获取了用户的所有输入，请务必使用 `getline` 函数。\n\n4. 字符串库在 `C++` 中对字符串输入进行什么处理？\n\
    \   a. 将其存储在一段连续的内存区域\n   b. 将每个字符转换为单独的字符\n   c. 将字符串转换为字符数组\n   d. 在存储之前对每个字符进行转义\n\
    \n   解释：在 `C` 和 `C++` 中，字符串值实际上是字符数组。`C++` 拥有一个字符串库，可以为你处理字符数组的操作。\n\n# 第 4 章：运算符\n\
    \n目标：本章涵盖了在几乎任何 `C++` 程序中看到的算术运算符和比较运算符。\n\n我们对运算符进行了简要概述，但本章将详细介绍运算符。即使是最小的 `C++`\
    \ 程序也会使用运算符。你需要理解它们的工作原理、它们的优先级（以便正确计算值），以及任何比较操作及其结果。我们将涵盖最常见的运算符，以及一些不常用的运算符。\n\
    \n## 基础算术\n\n在几乎任何 `C++` 程序中，你都需要进行某种算术运算。即使你的程序完全不需要算术，你也需要使用算术来循环语句、查找数组中的索引并跟踪记录。算术在任何程序中都与许多知识一样重要。\n\
    \n让我们来看简单的程序。\n\n```\nint num1 = 5;\nint num2 = 6;\nint num3 = num1 * num2;\n\
    ```\n\n我们在大多数示例中使用加法和减法，所以这次我们决定增加一些乘法。在上面的代码中，我们创建了名为 `num1` 和 `num2` 的两个变量并给它们赋值。然后我们创建了第三个变量名为\
    \ `num3`，并将 `num1` 和 `num2` 的积赋值给 `num3`。这是运算符及其如何与变量工作的非常基本的示例。当然，你可以使用创建值的静态数字并存储在变量中。以下代码的结果与上面相同。\n\
    \n```\nint num3 = 5 * 6;\n```\n\n上述代码只执行了一次计算，但像任何计算一样，你必须知道操作的优先级。`C++` 遵循与任何普通数学计算相同的优先级。你还有其他运算符的优先级。由于运算符非常多，大多数\
    \ `C++` 开发者在定义长算法和计算之前必须查阅优先级顺序。你可以在 Google 上搜索这些优先级运算符并保存一份列表以备后之用。\n\n学习 `C++`\
    \ 的另一个伟大原因是，其他语言也遵循优先级法则。如果你在 `C++` 中学会了它们，那么在你决定学习任何其他语言时，都应该熟悉它们。\n\n让我们来看一个带有不同运算符的计算。\n\
    \n```\nint num1 = 8 + 3 * 1;\n```\n\n如果你记得数学规则，你应该知道这个问题的解法。乘法的优先级高于加法，所以先执行乘法。计算结果将是\
    \ 11。\n\n让我们来看另一个例子。\n\n```\nint num1 = 8 * 3 + 1;\n```\n\n现在你知道了优先级顺序，就可以正确识别结果。8\
    \ 和 3 会先相乘，然后进行加法。计算结果是 25。\n\n你还可以对加减法进行快捷操作。`C++` 拥有递增和递减运算符作为这些快捷。让我们来看一个示例。\n\
    \n```\nint num1 = 1;\nint num2 = num1++;\n```\n\n这两个初始化的都包含整数值。第一个值设置为 1。`num2`\
    \ 初始化为 `num1` 的递增值。递增等同于“给变量加 1”。在这种情况下，值为 1，所以递增后的值是 2。\n\n你可以以相同的方法减少数字，只是使用减运算符。让我们来看一个示例。\n\
    \n```\nint num1 = 1;\nint num2 = num1--;\n```\n\n上述代码执行相同的计算过程，只是值减少了 1。换句话说，从变量\
    \ `num1` 中减去 1，并将结果保存在变量 `num2` 中。计算结果是 `num2` 的值为 0。\n\n另一个很有用但不同的运算符是模运算（取模运算）。当你处理偶数时，你会用到模运算。模运算返回除法运算的余数。例如，如果你用\
    \ 5 除以 2，模运算返回 1。它是循环数字并判断数字是奇是偶的方便工具。如果一个数字除以 2 没有余数，那么它就是偶数。如果除以 2 有余数，你就知道它是奇数。\n\
    \n让我们来看一个示例。\n\n```\nint num1 = 1;\nint num2 = 3;\nfloat num3 = num1 % 2;\nfloat\
    \ num4 = num2 % 2;\n```\n\n我们向这段代码添加了几个行。前两个变量设置为存储静态值，即一和三。第三个变量 `num3` 用于识别\
    \ `num1` 是否为偶数。由于 1 除以 2 等于 .5，我们知道它不是偶数。注意，我们通过将此变量定义为浮点值来考虑了小数的情况。\n\n"
