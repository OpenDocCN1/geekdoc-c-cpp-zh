    \ assume we have a list of colors using a structure we created in the previous\
    \ chapter. If you recall, we created a structure named `color`. Here is the code\
    \ again.\n\n```cpp\nenum Color\n{\n  BLUE,\n  BLACK,\n  RED\n};\n```\n\nSuppose\
    \ we have a variable we need to evaluate. You could write 3 or 4 `if-else` statements,\
    \ or you could use the `switch` statement. Because `switch` statements are easier\
    \ to read, they are preferred when you need several comparisons.\n\nLet’s first\
    \ take a look at what the code would look like if we used an `if` statement.\n\
    \n```cpp\nColor color = BLUE;\n\nif (color == BLUE)\n{\n  cout << “Color is blue.”;\n\
    }\nelse if (color == BLACK)\n{\n  cout << “Color is black.”;\n}\nelse if (color\
    \ == RED)\n{\n  cout << “Color is red.”;\n}\nelse\n{\n  cout << “Don’t know the\
    \ color.”;\n}\n```\n\nThe above code works, but it’s much more difficult to read\
    \ than the following `switch` statement.\n\n```cpp\nColor color = BLUE;\nswitch\
    \ (color)\n{\n    case BLUE:\n      std::cout << \"Blue\";\n      break;\n   \
    \ case BLACK:\n      std::cout << \"Black\";\n      break;\n    case RED:\n  \
    \    std::cout << \"Red\";\n      break;\n    default:\n      std::cout << \"\
    Unknown\";\n      break;\n}\n```\n\nAs you can see, this code is much cleaner\
    \ and accomplishes the same result as the previous `if` statements. The `default`\
    \ statement is similar to the `else` statement. If no color is found, the `default`\
    \ statement runs and displays “Unknown.”\n\nThe `switch` statement has a slightly\
    \ different way of executing than the `if` statement. The `if` statement does\
    \ a comparison, but the `switch` statement only performs an equality comparison.\
    \ The `switch` statement determines the variable you want to compare. In this\
    \ example, we want to review the `color` variable.\n\nOnce the variable for comparison\
    \ is determine, the execution flow falls to the first `case` statement. The first\
    \ `case` statement determines if the `color` variable equals blue. In this example,\
    \ the result is true. If it was not true, the next `case` statement executes.\
    \ Each `case` statement executes in the order in which it’s coded. If no color\
    \ is found, only then will the `default` statements execute.\n\nWhen a `case`\
