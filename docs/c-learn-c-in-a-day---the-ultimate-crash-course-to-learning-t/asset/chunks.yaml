    programmer with some practice. We’re giving you the toolset, and you can use it
    to work with the more complex procedures.


    In the first lesson, we’ll introduce you to the basics of C++. You’ll need to
    know the basic structures and programming concepts before you begin actual coding.


    Next, we’ll give you an introduction to variable data types and what you can do
    to call certain variables. Variables are used in any programming language, so
    once you learn one language, you’ll easily learn any others.


    Next, we’ll learn about operators and how to perform arithmetic with your C++
    programs. We then get into advanced data types, and what you can do to convert
    from one data type to another. We also introduce you to the string class, which
    is different from the primitive string or character data type.


    We then go into the loops and conditional programming structures. These are also
    very popular in any programming language. Loops and conditional statements control
    the way a program executes.


    Getting a little more complex, we then get into arrays. Arrays are a bit more
    complex, but they are necessary in any language. Even low level languages such
    as C use arrays intensely.


    One of the most difficult parts to learn in the C+ language is object-oriented
    programming. OOP is much different than standard linear languages. OOP creates
    components out of your code, so you can code in a compartmental fashion.


    With OOP, you need to know inheritance, which is the concept of using parent structures
    for reusable code. Inheritance is another common OOP concept.


    Once you work through this eBook, you should have all the necessary tools to code
    in C++ including an understanding of how the language works.


    Lab Questions


    1. What type of code is constructed with the C++ language?


    a. Compiled


    b. Interpreted


    c. Plain text


    d. Binary


    Explanation: C++ is a compiled language, so the C++ compiler takes the plain text
    code you create and turns it into binary files.


    2. What is the interface called that color codes your C++ text for easier reading
    and coding?


    a. Compiler


    b. Interpreter


    c. IDE


    d. TODO list


    Explanation: The IDE is the window where you construct your code. It organizes
    your files, shows you the debugger, and keeps your TODO list.


    3. What is one industry that always uses C++ for its engines?


    a. Healthcare


    b. IT


    c. Gaming


    d. Development


    Explanation: The gaming industry uses C++ to make fast gaming engines that render
    images and video quickly.


    4. What is the main reason you would use C++ over other languages such as Java
    or C#?


    a. Less code needed


    b. Performance and speed


    c. Easier to learn


    d. Used more often


    Explanation: C++ is closer to binary language than other high-level languages,
    so it’s much faster and speeds up code execution.


    5. If you were going to code an embedded system, what is the most likely language
    you’d use?


    a. C


    b. C++


    c. Java


    d. C#


    Explanation: The C++ language is useful for several industries, but embedded systems
    still need small programs that aren’t too resource intensive. C is the main language
    for embedded systems.


    6. What software turns your C++ code into a readable executable for your computer?


    a. Compiler


    b. Interpreter


    c. Command line


    d. MSI packages


    Explanation: The compiler is responsible for turning your C++ into binaries, which
    are the code instructions for your computer to execute.


    # Chapter 2: C++ Basics


    Objective: This chapter gives you a brief yet good overview of C++ basics that
    every programmer must know to get started with the language.


    Before you start any language, it’s important to understand some of the basics.
    Luckily, coding basics are usually the same across several languages, which make
    it easy to learn more coding structures as you move on from C++. Once you understand
    basic C++ concepts, you can take these concepts and apply them towards other languages.
    Many newer languages are based on C-style coding, so you have an advantage as
    a new C++ learner.


    Program Structure and Comments


    The best way to understand the basics is to take a look at a basic program. Let’s
    look at a basic program that sends output to the display that says “Hello World.”


    // my first program in C++


    #include <iostream>


    int main()


    {


      std::cout << "Hello World!";


      return 0;


    }


    Notice that we have a specific format for each line of code. The comments are
    the first line of code. The double slash ( // ) character indicates to the compiler
    that you want to include a comment. Comments are completely ignored by the processor,
    so you can write whatever you want in this section. You can also use multi-lined
    comments in C++. Here is an example using the same code above.


    /* I


    can code in


    C++ */


    #include <iostream>


    int main()


    {


      std::cout << "Hello World!";


      return 0;


    }


    Any content within the slashes and asterisks is ignored when the compiler creates
    your program. When you type comments in the IDE, they will usually color code
    as green. When you only have one line of comments, it’s standard to use the //
    comment indicator. When you have multiple lines, use the /* */ comment architecture.


    Next you see the include statement. This is the way you include other libraries.
    C++ code files need a way to integrate with other files. Your programs won’t be
    one long page. They will be separate, distinct pages. You can have classes and
    functions organized into hundreds of files in a program. The way you integrate
    them is include them as libraries. In this example, the included library is iostream.
    The brackets indicate that it’s an internal C++ library. Custom coded libraries
    are included in quotes, and you’ll see the .h file extension for header files.
    We’ll get into header files and includes in later chapters.'
