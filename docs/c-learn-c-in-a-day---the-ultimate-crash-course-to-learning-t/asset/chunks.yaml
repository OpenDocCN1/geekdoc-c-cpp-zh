    #include <iostream>


    int calculate (int x, int y)


    int main()


    {


        int result = calculate (5, 5);


         cout << result;


        return 0;


    }


    int calculate(int x, int y)


    {


                  int result = x * y;


                  return result;             


    }


    Now we have a full program with a calling function and a result returned. The
    main function calls the calculate function with the two integer parameters. We
    pass two values of 5 to the calculate function. The calculate function multiples
    the two values and returns 25 to the calling statement. The 25 value is stored
    as “result” in the calling statement. Now that we have the result, we print out
    the value to the screen.


    The above program is how you use functions, and how most programs are designed.
    Large applications have hundreds of functions that call each other to create a
    full functional C++ program.


    Variable Scope


    When you work with functions, variable scope is an issue. The variable scope defines
    where you can obtain a variable’s value and if the compiler can recognize the
    variable if you attempt to use it.


    There are two types of scope: global and local. Most variables are local, but
    constants are often made global.


    A local variable is only available within the function. Let’s return to the program
    we created in the previous section.


    #include <iostream>


    int calculate (int x, int y)


    int main()


    {


        int result = calculate (5, 5);


         cout << result;


        return 0;


    }


    int calculate(int x, int y)


    {


                  int result = x * y;


                  return result;             


