    \ Integers, floating point decimals, and characters are primitive data types.\
    \ We’re going to explore more complex data types and understand how they relate\
    \ to `C++`.\n\n## Enumerators\n\nEnumerators are an example of creating your own\
    \ data type. The `enum` data type creates a list of values that contain their\
    \ own numeric constant. The constant is called an `enumerator`. You use these\
    \ data types when you have a list of constant values that you need to represent\
    \ with a symbolic variable. Let’s take a look at some sample code to understand\
    \ enumerators better.\n\n```cpp\nenum Color\n{\n  BLUE,\n  BLACK,\n  RED\n};\n\
    ```\n\nYou can say that the `Color` data type has been enumerated. Notice that\
    \ the enumeration has the opening and closing brackets just like the `if` statements\
    \ and functions we’ve seen in previous chapters.\n\nThese data types are used\
    \ in the same way you create a `class` or `function`. If you recall from a previous\
    \ chapter, we set up a function by first defining its data type, then defining\
    \ a name for the function, and then all code within the brackets are considered\
    \ a part of the function.\n\nThe same is true with an enumerated data type. In\
    \ this example, we set the `enum` data type and define the name. In this example,\
    \ we’ve decided that we need a list of colors. Note that enumerated values should\
    \ not by dynamic. For instance, you wouldn’t have a set of `Color` values and\
    \ then change the list to birds. You wouldn’t decide that you need to dynamically\
    \ add a new color to the enumerator. You always know the list of values that you\
    \ need, because enumerators act as constants for your data types.\n\nWith this\
    \ enumerator, we have a list of colors. We only want three colors. Each color\
    \ is separated by a comma except for the last color. If you accidentally add a\
    \ comma at the end of the last color, the compiler will return an error.\n\nYou\
    \ probably notice that we gave the color names set in all capital letters. In\
    \ any coding language, constants are set in all capital letters. It’s not required\
    \ by the compiler, but it is a part of coding standards. We covered constants\
    \ and their naming schemes in chapter 3.\n\nOur `Color` data type is not exactly\
    \ the same as a standard constant, but the enumerated values within the brackets\
    \ are static.\n\nYou might ask yourself what these constants represent. What are\
    \ their values? The `C++` language assigns these constants a value. They are assigned\
    \ a value in the order they appear. Let’s take a look at the `Color` enumerated\
    \ value with some comments.\n\n```cpp\nenum Color\n{\n  BLUE, // value of 0\n\
    \  BLACK, // value of 1\n  RED // value 2\n};\n```\n\nWe’ve added some comments\
    \ to the enumerated data type. Remember that comments are ignored by the compiler,\
    \ so you can comment your code as much as you want.\n\nEnumerated values are always\
    \ given a value starting at 0. Each variable is given its own incremented value.\
    \ This means that `blue` has a value of 0, the next variable `black` gets the\
    \ value of 1, and then the next variable gets the value of 2. When you call these\
    \ variables in your code, these are the values they have during execution.\n\n\
    Another important aspect about these data types is that once you give an enumerator\
    \ a list of variable names, you cannot use those names in any other sections of\
    \ the code. These variable names are globally defined, which means they are accessible\
    \ in any section of your code. Let’s look at an example.\n\n```cpp\nenum Color\n\
    {\n  BLUE, // value of 0\n  BLACK, // value of 1\n  RED // value 2\n};\n\nenum\
    \ MoreColors\n{\n  BLUE, // value of 0\n  GREEN, // value of 1\n  ORANGE // value\
    \ 2\n};\n```\n\nThe above code would throw a compiler error, because you’ve already\
    \ used the `BLUE` variable name in the original `Color` enumeration.\n\nNow that\
    \ you have your `Color` data type defined, you can use it in your code. Let’s\
    \ take a look at how you would define a variable and obtain its value.\n\n```cpp\n\
    enum Color\n{\n  BLUE, // value of 0\n  BLACK, // value of 1\n  RED // value of\
    \ 2\n};\n\nColor paint = BLUE;\n\nstd::cout << paint;\n```\n\nIn the example code,\
    \ we have our data type definition, and then we decide to use it in some code.\
    \ Because `Color` is now a data type, we use it to define a variable. We decide\
    \ to create the variable `paint` with the data type of `Color`. We then give the\
    \ variable a constant value from our list of colors. Because the `BLUE` constant\
    \ value is 0, the next statement prints out the value of 0 to the user.\n\nBecause\
    \ enumerated variables have a list of constants with integer values, you can also\
    \ use them to initialize an integer variable. For instance, the following code\
    \ is also valid.\n\n```cpp\nint paintcolor = BLUE;\n```\n\nThe compiler implicitly\
    \ converts the `BLUE` constant to an integer and assigns it to the `paintcolor`\
    \ variable. The compiler won’t be able to convert an integer to the enumeration.\
    \ For instance, the following code gives an error.\n\n```cpp\nColor paint = 0;\n\
    ```\n\n## Structures\n\nStructures are similar but much different code architecture.\
    \ Structures give you a way to represent objects without defining cumbersome variables.\n\
    \nFor instance, let’s say you have a program that gets a list of employee. Each\
    \ employee has a first and last name that you need to retrieve. You then need\
    \ to get a birth date’s year, month and day. You could create these variables\
    \ separately, or you could use a structure to better define and represent your\
    \ information.\n\nLet’s say you need to log information for two employees. Your\
    \ variables would look like the following.\n\n```cpp\nstd::string firstname1;\n\
    std::string firstname2;\nstd::string lastname1;\nstd::string lastname2;\nstd::string\
    \ birthyear1;\nstd::string birthyear2;\n```\n\nAs you can see, this type of variable\
    \ definition is completely inefficient. A structure lets you create a class or\
    \ an object for the employee, and then you can assign the class properties with\
    \ values that represent each employee.\n\nLet’s take a look at the code needed\
    \ to create an employee structure.\n\n```cpp\nstruct Employee\n{\n  int id;\n\
    \  std::string firstname;\n  std::string lastname;\n  int birthyear;\n};\n```\n\
    \nYou’ll notice that structures are defined in a similar was as enumerations.\
    \ However, structures have more complexities. Instead of giving an automatic integer\
    \ value to each structure property, you can define your own value for each property.\
    \ Also, structure property values can be dynamic, so you aren’t stuck with only\
    \ constants as an option. The above code is much more efficient than creating\
    \ variables for both of your employees.\n\nNow that we have the structure declared,\
    \ we can use it in our code. Let’s take a look at how you can use your structure.\n\
    \n```cpp\nstruct Employee\n{\n  int id;\n  std::string firstname;\n  std::string\
    \ lastname;\n  int birthyear;\n};\n\nEmployee john;\nEmployee jane;\n```\n"
