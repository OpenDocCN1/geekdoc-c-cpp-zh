  trans: "\n`switch` 语句是 `if` 语句的替代方案。`switch` 语句具有相似的控制流，不同之处它不像 `if` 语句那样进行各种比较。正如我们在上一节中提到的，你可以使用多个嵌套的\
    \ `if-else` 语句。然而，当连续出现太多此类语句时，代码会变得难以阅读和调试。除了构建函数外，另一种方案是使用 `switch` 语句，它更整洁且易于阅读。\n\
    \n假设我们有一个使用上一章中创建的结构定义的颜色列表。如果你还记得，我们创建了一个名为 `color` 的结构。这里是再次对应的代码：\n\n```cpp\n\
    enum Color\n{\n  BLUE,\n  BLACK,\n  RED\n};\n```\n\n假设我们有一个需要评估的变量。你可以编写 3 或 4\
    \ 个 `if-else` 语句，也可以使用 `switch` 语句。由于 `switch` 语句更容易阅读，因此在需要进行多次比较时，通常优先使用它。\n\
    \n我们先来看下如果使用 `if` 语句代码会是什么样的。\n\n```cpp\nColor color = BLUE;\n\nif (color == BLUE)\n\
    {\n  cout << “Color is blue.”;\n}\nelse if (color == BLACK)\n{\n  cout << “Color\
    \ is black.”;\n}\nelse if (color == RED)\n{\n  cout << “Color is red.”;\n}\nelse\n\
    {\n  cout << “Don’t know the color.”;\n}\n```\n\n上面的代码可以工作，但它比下面的 `switch` 语句难读得多。\n\
    \n```cpp\nColor color = BLUE;\nswitch (color)\n{\n    case BLUE:\n      std::cout\
    \ << \"Blue\";\n      break;\n    case BLACK:\n      std::cout << \"Black\";\n\
    \      break;\n    case RED:\n      std::cout << \"Red\";\n      break;\n    default:\n\
    \      std::cout << \"Unknown\";\n      break;\n}\n```\n\n如你所见，这段代码整洁得多，并且与之前的\
    \ `if` 语句实现了相同的结果。`default` 语句类似于 `else` 语句。如果没有找到任何颜色，`default` 语句将运行并显示“Unknown”。\n\
    \n`switch` 语句的执行方式与 `if` 语句略有不同。`if` 语句执行比较，而 `switch` 语句只执行相等比较。`switch` 语句确定你要比较的变量。在这个例子中，我们想要检查\
    \ `color` 变量。\n\n一旦确定了用于比较的变量，执行流将进入第一个 `case` 语句。第一个 `case` 语句判断 `color` 变量是否等于蓝色。在这个例子中，结果为真。如果不为，则执行下一个\
    \ `case` 语句。每个 `case` 语句按照代码编写的顺序执行。只有在没有找到任何颜色时，才会执行 `default` 语句。\n\n当 `case`\
    \ 语句为真时，`case` 语句内部的语句将执行。在这个例子中，我们只需显示找到的颜色。`break` 语句在执行流中非常重要。`break` 语句告诉\
    \ `switch` 命令停止执行。如果你没有为每个 `case` 添加 `break` 语句，下一个 `case` 语句将会执行。`break` 语句用于停止比较，否则执行将持续直到遇到\
    \ `default` 语句。\n\n`switch` 语句的执行方式与 `if` 语句略有不同。`if` 语句执行比较，而 `switch` 语句只执行相等比较。`switch`\
    \ 语句确定你要比较的变量。在这个例子中，我们想要检查 `color` 变量。\n\n一旦确定了用于比较的变量，执行流将进入第一个 `case` 语句。第一个\
    \ `case` 语句判断 `color` 变量是否等于蓝色。在这个例子中，结果为真。如果不为，则执行下一个 `case` 语句。每个 `case` 语句按照代码编写的顺序执行。只有在没有找到任何颜色时，才会执行\
    \ `default` 语句。\n"
- fmt: "\nThe advantage of this loop is that you don’t need to remember the increment\
    \ statement. If you didn’t include the increment statement, the compiler gives\
    \ you an error.\n\nThese loops and conditional statements are engrained in any\
    \ program. You’ll need a firm grasp of them to properly debug code. They are common\
    \ in code, but they are also likely culprits for causing bugs. Just one small\
    \ logic error in your code can cause huge bugs in your program. For this reason,\
    \ it’s important to design your code well and use the most efficient structure\
    \ that makes the code easy to read if you ever need to change it.\n\n## Lab Questions\n\
    \n1. What type of loop is created when you define a while loop that never stops\
    \ executing?\na. do while\nb. for while\nc. infinite loop\nd. double loop\n**Explanation**:\
    \ an infinite loop eats up computer memory and eventually crashes your program.\n\
    \n2. What statement must you include in a switch statement to ensure that execution\
    \ stops after a case matches?\na. goto\nb. break\nc. default\nd. switch\n**Explanation**:\
    \ the `break` statement stops execution within the `switch` statement, so every\
    \ case evaluation doesn’t run.\n\n3. What loop always executes its statements\
    \ at least once?\na. do while\nb. while\nc. for\nd. switch\n**Explanation**: the\
    \ `do while` loop executes its statements first, and then it evaluates the condition.\
    \ This means that statements always run at least once.\n\n4. What type of loop\
    \ has a smaller chance of creating an infinite loop since the increment expression\
    \ is embedded in the loop structure?\na. do while\nb. while\nc. for\nd. switch\n\
    **Explanation**: the `for` loop is the preferred loop for logical execution flow,\
    \ because it contains the increment expression and the condition embedded in its\
    \ structure.\n\n# Chapter 7: Arrays and Pointers\n\nObjective: This chapter covers\
    \ arrays and their indexes as well as the pointers that link values and variables\
    \ to a memory location.\n\nArrays and pointers are slightly more advanced concepts.\
    \ Arrays are a part of every program, because you can contain several values in\
    \ only 1 variable. You can contain 1 or 1000 values in one variable. Pointers\
    \ are one of the most difficult for students to understand, because you point\
    \ to specific areas of memory and not an actual value. We’ll cover both of these\
    \ concepts in this chapter, so you can get a full understanding of them.\n\n##\
    \ Building Arrays\n\nThere are times when you need to calculate or evaluate several\
    \ records. We used an example of an employee record using structures where we\
    \ wanted to fill two records with the same type of data. But what if you had 100\
    \ employee records that you needed to work with? You could use an array, which\
    \ would hold each value in a separate container. These containers are called indexes.\n\
    \nAn index is a location within the array. When you code your programs, you’ll\
    \ increment and iterate through these indexes. An important part of indexes is\
    \ understanding where they start. Indexes always start at 0.\n\nFirst, let’s look\
    \ at the code to initialize an array.\n\n```cpp\nint numbers[2];\n```\n\nThat’s\
    \ all it takes to initialize an array, but there are concepts you should know.\
    \ The `int` data type tells the compiler that you want to contain integer values\
    \ in your array. The data type set on an array defines the type of data you can\
    \ store in the variable. In this example, we want to store integer values.\n\n\
    The next part of the statement is the array name. We’ve given the name `numbers`\
    \ to the array. The number 2 in brackets defines the number of values you can\
    \ store in the array. In this example, we set the number of possible values to\
    \ 2. An important issue to note is that you don’t store numbers 1 to 2. The 2\
    \ in the brackets is the amount of values you can store, but array indexes start\
    \ with 0. This means that the indexes for the array are 0 and 1. Remember that\
    \ the index containers start with 0, and the last index container is the number\
    \ in brackets minus 1. In this instance, it’s 2-1 or 1.\n\nAfter you create the\
    \ array, you can now populate it with values. You use the index numbers to assign\
    \ values to the array. Let’s take a look at some code.\n\n```cpp\nint numbers[2];\n\
    numbers[0] = 1;\nnumbers[1] = 3;\n```\n\nIn the above code, we’ve filled both\
    \ indexes with a value. You don’t have to fill the array with values immediately\
    \ after you create the array. Most programs use a `for` loop to populate an array\
    \ with its values. For instance, suppose you want to populate the `numbers` array\
    \ using a `for` loop and the `count` variable we worked with in the last chapter.\n\
    \nIf you wanted to populate the array using a loop, here is an example of how\
    \ you could do it.\n\n```cpp\nint numbers[2];\nfor (int count = 0; count < 2;\
    \ count++)\n{\n    numbers [count] = count;\n}\n```\n\nIn the above code, we first\
    \ define the array. We again set the array to contain 2 values. We then use the\
    \ `count` variable that we worked with in the previous chapter. We initialize\
    \ it to 0, and start the loop. Notice that we used `count` in the array value\
    \ assignment. In the first iteration, `count` is equal to 0. This means that the\
    \ first iteration populates the array container at index 0. Then, `count` is incremented\
    \ by 1, and the index container of 1 is populated next this is an important concept\
    \ when you start working with large sets of data. We could change these values\
    \ to 100 without changing our code and creating massive lines code. This is the\
    \ advantage of an array working with a `for` loop.\n\nArrays and for loops are\
    \ also used to display information. Just like the above loop where we assigned\
    \ values, we can also loop through an array just to display the information. Let’s\
    \ take a look at an example.\n\n```cpp\nint numbers[2];\nnumbers[0] = 1;\nnumbers[1]\
    \ = 3;\nfor (int count = 0; count < 2; count++)\n{\n    cout << numbers [count]\
    \ ;\n}\n```\n\nIn this example, we assigned values to our array. We used the same\
    \ `for` loop for assigning values to our array, but this time we just display\
    \ the information. Notice that we use the `count` variable to retrieve information\
    \ from the `numbers` array. Even though `count` is equal to 1 in the second iteration,\
    \ the display value shown is 3, because 3 is contained in the index container\
    \ 1.\n\nArrays aren’t limited to containing primitive values. We showed you how\
    \ to work with simple integers, but you can also use arrays to contain entire\
    \ structures. In the structure chapter, we discussed creating structures to represent\
    \ data when you have several variables that you need to create. With structures,\
    \ you can organize your data more efficiently. We used an example of an Employee\
    \ structure.\n\nSuppose you needed to store 100 employee structures. An array\
    \ can be used to store the 100 Employee records. Let’s take another look at our\
    \ Employee structure.\n\n```cpp\nstruct Employee\n{\n    int id;\n    std::string\
    \ firstname;\n    std::string lastname;\n    int birthyear;\n};\n```\n\nNow we\
    \ want to store several Employee records in an array. If you recall, structures\
    \ create your own data type. This means that we can define an array variable using\
    \ the `Employee` data type. Take a look at the following code.\n\n```cpp\nstruct\
    \ Employee\n{\n    int id;\n    std::string firstname;\n    std::string lastname;\n\
    \    int birthyear;\n};\n\nEmployee employees[2];\n```\n\nIn the code above, we\
    \ have the structure defined, and then we create an array with the data type `Employee`.\
    \ The array’s name is `employees`, and we tell the compiler to allocate memory\
    \ for two Employee structures.\n\nNow let’s populate a structure and assign it\
