    concept on any operator. If you remember from the chapter 8, functions can have
    the same name and still be valid in your code. The name remains the same, but
    the parameters and data type are different. This differentiates the function from
    other functions of the same name. We’re going to show you how to overload the
    different operators you normally see in C++.


    Some of these concepts use classes, but you can ignore the classes for now. We
    will get into classes in the next chapter.


    Overloading Arithmetic Operators


    In the above section, we showed you an example of the plus operator. We mentioned
    that the plus operator is actually a function named operator+(). The function
    takes two values and adds them both. However, you can also send two decimal numbers
    to the plus operator and yield the same type of result – the two values are added
    and the result is return. So what would you want to use the plus operator for
    if it performs what you want?


    Perhaps you have your own data type and want to add a value within the structure.
    In most cases, you’ll overload the operator within your own data types, especially
    classes. Classes are their own small component of a program, so they are also
    their own data type object. If you tried to add two custom data types together,
    the plus sign would fail. The compiler would not know what to do with the plus
    sign, so you’ll receive an error from the program.


    It’s common for a C++ program to have its own data types that need to perform
    arithmetic functions. Let’s use the Employee data type from previous chapters.


    struct Employee


    {


        int id;


        std::string firstname;


        std::string lastname;


        int birthyear;


    };


    To overload an arithmetic function, you use the friend function. The friend function
    takes the original function and uses it to overload your operator to a custom
    type of function. In this case, you want to add values within a specific structure.
    It’s difficult to explain these overloads prior to looking at classes, so we’ll
    create a small class. Just know that we’ll explain classes in the next chapter,
    so you can reference the way classes are shown compared to how they work in the
    next chapter.


    class Employee


    {


    private:


        int m_employeeId;


    public:


        Employee(int id) { m_employeeId = id; }


        friend Cents operator+(const Employee &c1, const Employee &c2);


        int GetId() { return m_employeeId; }


    };


    Employee operator+(const Employee &c1, const Employee &c2)


    {


        return Employee (c1.m_ employeeId + c2.m_ employeeId);


    }


    The above code is a lot to take in when you haven’t seen classes yet. Classes
    are their own object. This is an Employee class object. We decided to use this
    class object like the Employee structure data type we created earlier.


    Let’s take a look at what this class does. First, we create a class that contains
    an employee Id variable. We want to add employee Ids together in the class.  We
    create an overloaded function that lets you pass two member Id variables to the
    class. Since these variables have their own data type of Employee, we need to
    overload the addition operator. We can’t just add two Employee data types together.


    The key to overloaded operators is the friend function. The friend function takes
    some of its parameters from the original addition function, and then amend the
    function to match our custom overloaded event. We need a function that will work
    with our Employee data type, so we’ve passed the friend function the address space
    for the passed parameters.


    With our class created, we can now call the class and add two values. Let’s take
    a look at the complete code.


    class Employee


    {


    private:


        int m_employeeId;


    public:


        Employee(int id) { m_employeeId = id; }


        friend Cents operator+(const Employee &c1, const Employee &c2);


        int GetId() { return m_employeeId; }


    };


    Employee operator+(const Employee &c1, const Employee &c2)


    {


        return Employee (c1.m_ employeeId + c2.m_ employeeId);


    }


    int main()


    {


        Employee Emp1(6);


        Employee Emp2(8);


        Employee total = Emp1 + Emp2;


        std::cout << "I have " << total . GetId () << " total Ids." << std::endl;


        return 0;


    }


    As you can see, we still use the addition operator, but we add to employee data
    type variables. Since we pass values directly to the class constructor (we will
    learn constructors in the next chapter), we can then add these two values in the
    overloaded addition function.


    We added the main function to perform the actual addition of your statements.
    All the rest of the main function is similar to what we’ve seen before.


    We can do the same with the subtraction operator. Let’s take a look at overloading
    the minus sign.


    class Employee


    {


    private:


        int m_employeeId;


    public:


        Employee(int id) { m_employeeId = id; }


        friend Cents operator-(const Employee &c1, const Employee &c2);


        int GetId() { return m_employeeId; }


    };


    Employee operator-(const Employee &c1, const Employee &c2)


    {


        return Employee (c1.m_ employeeId + c2.m_ employeeId);


    }


    int main()


    {


        Employee Emp1(6);


        Employee Emp2(8);


        Employee total = Emp1 + Emp2;


        std::cout << "I have " << total . GetId () << " total Ids." << std::endl;


        return 0;


    }


    Notice that we only made one change – the operator function name was changed to
    operator-. We need to ensure that we change the right operator, and the minus
    sign uses the operator- function name. The above code subtracts Employee Ids.


    You can also do the same with the multiplication and division operators as well
    as the modulus operator. Overloading operators isn’t too common, but you will
    run into this technique in some C++ programs.


    Overloading Comparison Operators


    Once you know how to overload one set of operators, it’s much easier to overload
    others. Comparison operators don’t actually change a value. They just compare
    two values and respond with true or false.


    Let’s take a look at some sample code that compares employee ID numbers.


    class Employee


    {


    private:


        double m_dX, m_dY, m_dZ;


    public:


        Employee(double dX=0.0, double dY=0.0, double dZ=0.0)


        {


        m_dX = dX;


        m_dY = dY;


        m_dZ = dZ;


        }


        friend bool operator== (Employee &cP1, Employee &cP2);


        friend bool operator!= (Employee &cP1, Employee &cP2);


        double GetX() { return m_dX; }


        double GetY() { return m_dY; }


        double GetZ() { return m_dZ; }


    };


    bool operator== (Employee &cP1, Employee &cP2)


    {


        return (cP1.m_dX == cP2.m_dX &&


                cP1.m_dY == cP2.m_dY &&


                cP1.m_dZ == cP2.m_dZ);


    }


    We’ve edited the Employee class to now use comparison overload functions. Notice
    that we still have the friend function. The friend function is the critical component
    for any operator overload function. In this example, we overload the == operator
    and the != operator. We allow the operator functions to compare our custom Employee
    class. Now let’s take a look at the complete code with the main function calling
    the new overloaded functions.


    class Employee


    {


    private:


        double m_dX, m_dY, m_dZ;


    public:


        Employee(double dX=0.0, double dY=0.0, double dZ=0.0)


        {


        m_dX = dX;


        m_dY = dY;


        m_dZ = dZ;


        }


        friend bool operator== (Employee &cP1, Employee &cP2);


        friend bool operator!= (Employee &cP1, Employee &cP2);


        double GetX() { return m_dX; }


        double GetY() { return m_dY; }


        double GetZ() { return m_dZ; }


    };


    bool operator== (Employee &cP1, Employee &cP2)


    {


        return (cP1.m_dX == cP2.m_dX &&


                cP1.m_dY == cP2.m_dY &&


                cP1.m_dZ == cP2.m_dZ);


    }


    int main()


    {


        Employee Emp1(6);


        Employee Emp2(8);


        Employee total = Emp1 != Emp2;


        std::cout << "I have " << total << " total Ids." << std::endl;


        return 0;


