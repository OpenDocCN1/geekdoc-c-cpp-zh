  trans: "\n上述代码适用于算术加法函数，但你也可以将此概念应用于任何操作符。如果你还记得第 8 章的内容，函数可以具有相同的名称并在你的代码中仍然有效。名称保持不变，但参数和数据类型是不同的。这使得该函数与其他同名的函数区分开来。我们将向你展示如何重载你在\
    \ C++ 中常见的不同运算符。\n\n这些概念中的一些使用了类（classes），但你现在可以忽略类。我们将在下一章中介绍类。\n\n# 重载算术运算符\n\
    \n在上面的部分中，我们向你展示了 `plus` 运算符的示例。我们提到 `plus` 运算符实际上是一个名为 `operator+()` 的函数。该函数接收两个值并将它们相加。然而，你也可以向\
    \ `plus` 运算符发送两个小数，并产生相同类型的结果——两个值相加并返回结果。那么，如果 `plus` 运算符执行了你想要的操作，你还会用它做什么呢？\n\
    \n也许你有自己的数据类型，并想在结构内部添加一个值。在大多数情况下，你会在自己的数据类型（特别是类）中重载运算符。类是程序中独立的小组件，因此它们也是它们自己的数据类型对象。如果你尝试将两个自定义数据类型相加，`plus`\
    \ 将失效。编译器将不知道对 `plus` 号做什么，因此你将收到来自程序的错误。\n\nC++ 程序拥有自己的需要执行算术函数的自定义类型是 common\
    \ 常见的。让我们使用之前章节中的 `Employee` 数据类型吧。\n\n```cpp\nstruct Employee\n{\n    int id;\n\
    \    std::string firstname;\n    std::string lastname;\n    int birthyear;\n};\n\
    ```\n\n要重载算术函数，你需要使用 `friend`（友元）函数。`friend` 函数接收原始函数并使用它将你的运算符重载为自定义类型的函数。在这种情况下，你想在特定结构中添加值。在查看类之前很难解释这些重载，因此我们将创建一个小类。只需知道我们将在下一章中解释类，这样你可以参考下一章中类的展示方式与它们工作方式的对比。\n\
    \n```cpp\nclass Employee\n{\nprivate:\n    int m_employeeId;\npublic:\n    Employee(int\
    \ id) { m_employeeId = id; }\n    friend Cents operator+(const Employee &c1, const\
    \ Employee &c2);\n    int GetId() { return m_employeeId; }\n};\n\nEmployee operator+(const\
    \ Employee &c1, const Employee &c2)\n{\n    return Employee (c1.m_employeeId +\
    \ c2.m_employeeId);\n}\n```\n\n当你还没有见过类时，上面的代码信息量很大。类是它们自己的对象。这是一个 `Employee`\
    \ 类对象。我们决定使用这个类对象就像我们之前创建的 `Employee` 结构数据类型一样。\n\n来看看这个类的作用。首先，我们创建了一个包含员工 `Id`\
    \ 变量的类。我们想在类中将员工 ID 相加。我们创建一个重载函数，允许你向类传递两个成员 `Id` 变量。由于这些变量有自己的 `Employee` 数据类型，我们需要重载加法运算符。我们不能直接将两个\
    \ `Employee` 数据类型相加。\n\n重载运算符的关键在于 `friend` 函数。`friend` 函数从原始加法函数接收某些参数，然后修改函数以匹配我们的自定义重载事件。我们需要一个与我们的\
    \ `Employee` 数据类型工作的函数，因此我们为 `friend` 函数传递了所传参数的地址空间。\n\n创建类后，我们现在可以调用类并加上两个值。让我们来看看完整的代码。\n\
    \n```cpp\nclass Employee\n{\nprivate:\n    int m_employeeId;\npublic:\n    Employee(int\
    \ id) { m_employeeId = id; }\n    friend Cents operator+(const Employee &c1, const\
    \ Employee &c2);\n    int GetId() { return m_employeeId; }\n};\n\nEmployee operator+(const\
    \ Employee &c1, const Employee &c2)\n{\n    return Employee (c1.m_employeeId +\
    \ c2.m_employeeId);\n}\n\nint main()\n{\n    Employee Emp1(6);\n    Employee Emp2(8);\n\
    \    Employee total = Emp1 + Emp2;\n    std::cout << \"I have \" << total. GetId()\
    \ << \" total Ids.\" << std::endl;\n    return 0;\n}\n```\n\n正如你所看到的，我们仍然使用加运算符，但我们是在员工数据类型变量上操作。由于我们直接将值传递给类构造函数（我们将在下一章学习构造函数），然后我们可以在重载的加法函数中加上这两个值。\n\
    \n我们添加了 `main` 函数来执行你语句的实际加法。`main` 函数的其余部分与我们之前看到的相似。\n\n我们可以对减法运算符做同样的事。让我们来看看重载减号。\n\
    \n```cpp\nclass Employee\n{\nprivate:\n    int m_employeeId;\npublic:\n    Employee(int\
    \ id) { m_employeeId = id; }\n    friend Cents operator+(const Employee &c1, const\
    \ Employee &c2);\n    friend Cents operator+(const Employee &c1, const Employee\
    \ &c2);\n   friend Cents operator-(const Employee &c1, const Employee &c2);\n\
    ```\n"
- fmt: "\n# Chapter 10: Object Oriented Programming with C++\n\nObjective: This chapter\
    \ gives you an introduction to object-oriented programming (OOP). OOP is the foundation\
    \ for programming reusable code, and it can be used in other languages.\n\nObject-oriented\
    \ programming (OOP) is what distinguishes C++ from its predecessor C. C is good\
    \ for low-level programming, but OOP is necessary for large applications. We went\
    \ into OOP a bit in the last chapter, but we’re going to focus more on the topic\
    \ in this chapter..\n\n## A Brief Overview of OOP Design\n\n### Overloading Comparison\
    \ Operators\n\nAs you can see, this code is not much different than the code that\
    \ overloads the arithmetic functions. We just need to assign the right overloaded\
    \ function name. In this case, we wanted to overload comparison operators, so\
    \ we used the `operator==` and `operator!=` functions. Again you’ll see the friend\
    \ function modifier. This modifier is necessary when overloading operators.\n\n\
    The rest of the code compares the two values that we send to the class functions\
    \ and responds with true or false. Remember that the results or output variable\
    \ that is returned from an overloaded function is still the same as the original\
    \ function.\n\n### Overloading Increment and Decrement Operators\n\nYou’ll recall\
    \ from previous chapters that the increment and decrement operators add one or\
    \ subtract one from a value. Both of these operators are useful for shorthand\
    \ operations when you need to add or subtract 1 from a variable. We’ve already\
    \ seen overload operators for others, so this should start to get easier for you.\
    \ Let’s take a look at the code.\n\n```cpp\nclass Employee\n{\nprivate:\n    int\
    \ m_emp;\npublic:\n    emp (int emp1=0)\n    {\n        m_emp = emp1;\n    }\n\
    \    Employee & operator++();\n    Employee & operator--();\n    int GetDigit()\
    \ const { return m_emp; }\n};\n\nEmployee & Employee::operator++()\n{\n    if\
    \ (m_emp == 9)\n        m_emp = 0;\n    else\n        ++m_emp;\n    return *this;\n\
    }\n\nEmployee & Employee::operator--()\n{\n    if (m_emp == 0)\n        m_emp\
    \ = 9;\n    else\n        --m_emp;\n    return *this;\n}\n```\n\nThis class and\
    \ its functions are much more complex because we have to account for numbers that\
    \ both decrement and increment. Notice that don’t need the friend function this\
    \ time. We can create our operator overloads without the friend function because\
    \ we don’t need to account for any value types. We just need to add or subtract\
    \ 1 for any value passed to the overloaded function. Let’s take a look at the\
    \ full code with `main` function making a call to the overloaded function.\n\n\
    ```cpp\nclass Employee\n{\nprivate:\n    int m_emp;\npublic:\n    emp (int emp1=0)\n\
    \    {\n        m_emp = emp1;\n    }\n    Employee & operator++();\n    Employee\
    \ & operator--();\n    int GetDigit() const { return m_emp; }\n};\n\nEmployee\
    \ & Employee::operator++()\n{\n    if (m_emp == 9)\n        m_emp = 0;\n    else\n\
    \        ++m_emp;\n    return *this;\n}\n\nEmployee & Employee::operator--()\n\
    {\n    if (m_emp == 0)\n        m_emp = 9;\n    else\n        --m_emp;\n    return\
    \ *this;\n}\n\nint main()\n{\n    Employee Emp1(6);\n    Employee Emp2(8);\n \
    \   Employee total = Emp1++;\n    std::cout << \"I have \" << total << \" total\
    \ ids.\" << std::endl;\n    return 0;\n}\n```\n\nJust like the other overloaded\
    \ functions, we again use the `main` function to call the class member functions\
    \ to use the overloaded method. We don’t need the friend function type because\
    \ we just need to increment a numeric value either by one or decrement a number\
    \ by one.\n\nOverloading operators is a common concept in some programs, but they\
    \ aren’t common. You should still understand the concepts and learn how you can\
    \ make your own overloaded operators. This chapter helped you understand the basic\
    \ concepts so you can take them and use them in your own programs. Once you understand\
    \ overloading, you can understand important parts of C++ and object oriented programming.\n\
    \n## Lab Questions\n\n1. When you use a mathematical operator in your programs,\
    \ what actually happens with the calculation is made?\n   a. the operation is\
    \ actually a function operation\n   b. the function is removed from the computer’s\
    \ memory\n   c. the operation is calculated using outside libraries\n   d. the\
    \ calculation is made differently\n   *Explanation:* operators look like simple\
    \ mathematical operations in C++, but operators in C++ are actually functions.\n\
    \n2. What is the function operator you must use when you want to overload an operator\
    \ in C++?\n   a. parent\n   b. friend\n   c. private\n   d. public\n   *Explanation:*\
    \ the friend operator is needed when overloading arithmetic and comparison operators\
    \ in C++.\n\n3. When you pass variables to your overloaded function, how do you\
    \ pass them?\n   a. using a pointer variable operator\n   b. using the variable’s\
    \ value\n   c. pass the entire custom class object\n   d. using the values memory\
    \ address\n   *Explanation:* passing the memory address is the way to pass values\
    \ to your custom class functions and overload the way a standard operator functions.\n"
