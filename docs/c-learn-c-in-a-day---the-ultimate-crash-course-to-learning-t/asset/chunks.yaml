    Overloading Increment and Decrement Operators


    You’ll recall from previous chapters that the increment and decrement operators
    add one or subtract one from a value. Both of these operators are useful for shorthand
    operations when you need to add or subtract 1 from a variable.


    We’ve already seen overload operators for others, so this should start to get
    easier for you. Let’s take a look at the code.


    class Employee


    {


    private:


        int m_emp;


    public:


