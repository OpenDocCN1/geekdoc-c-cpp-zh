    \ 编程文件的开头添加原型语句。原型只是函数的一个副本，不包含执行语句。它看起来似乎没用，但你需要它给编译器。\n\n接下来的语句是实际函数。该函数名为 `calculate`，它接受两个整数作为参数。该函数的参数名为\
