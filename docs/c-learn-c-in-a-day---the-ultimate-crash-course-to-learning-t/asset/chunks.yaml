  trans: "\n\n### 解释\n`!=` 运算符用于判断两个值是否不等。如果此比较运算符被用在 `if` 语句中且结果为真，则执行该 `if` 语句。\n\
    \n### 4. 你使用哪种 C++ 函数来执行指数函数？\na. `exp`\nb. `base`\nc. `pow`\nd. `multiply`\n\n\
    解释：`pow` 函数接收一个基数和一个指数值，并执行幂乘法计算。\n\n# 第 5 章：高级数据类型\n\n目标：本章涵盖了更高级的数据类型。我们已经学习了基础知识，但本章将为你概述作用域、枚举和结构体。\n\
    \n在之前的章节中我们介绍了一些变量类型，但 `C++` 为开发者提供了其他几种更复杂的数据类型，以便于更容易编程。你甚至可以创建自己的数据类型。当你创建\
    \ `classes`（类）时，这些类就变成了你的自定义数据类型。标准数据类型被称为 `primitive`（原生）。整数、浮点小数和字符都是原生数据类型。我们将探索更复杂的数据类型并理解它们如何与\
    \ `C++` 关联。\n\n## 枚举量\n\n枚举量是创建自定义数据类型的一个示例。`enum` 数据类型创建了一个包含其自身数值常值的列表。该常量被称为\
    \ `enumerator`（枚举量）。当你有一组常量值并需要用符号变量来表示时，就会使用这些数据类型。让我们来看一些示例代码以更好地理解枚举量。\n\n\
    ```cpp\nenum Color\n{\n  BLUE,\n  BLACK,\n  RED\n};\n```\n\n你可以说 `Color` 数据类型已经被枚举了。注意，枚举有起始和结束括号，就像我们在之前的章节中看到的\
    \ `if` 语句和函数一样。\n\n这些数据类型的使用方法与你创建 `class`（类）或 `function`（函数）相同。如果你还记得之前的章节，我们设置一个函数是首先定义它的数据类型，然后为函数定义一个名称，接着括号内的所有代码都被视为函数的一部分。\n\
    \n枚举数据类型也是如此。在例例中，我们设置了 `enum` 数据类型并定义了名称。在这个例子中，我们决定需要一个颜色列表。注意，枚举值不应该是动态的。例如，你不会有一组\
    \ `Color` 值，然后将列表改为鸟类。你不会决定动态地向枚举量添加新颜色。你总是知道你需要的值列表，因为枚举量充当了数据类型的常量。\n\n通过这个枚举量，我们有了一个颜色列表。我们只需要三种颜色。除了最后一个颜色外，每个颜色都用逗号隔开。如果你不小心在最后一个颜色后面添加了逗号，编译器将返回错误。\n\
    \n你可能注意到我们将颜色名称设置为了全大写字母。在任何编程语言中，常量都用全大写字母设置。这不是编译器要求的，它是编码标准的一部分。我们在第 3 章中介绍了常量及其命名方案。\n\
    \n我们的 `Color` 数据类型与标准常量并不完全相同，但括号内的枚举值是静态的。\n\n你可能会问自己这些常量代表什么。它们的值是多少？`C++` 语言会给这些常量分配一个值。它们按照出现的顺序被赋值。让我们来看带有注释的\
    \ `Color` 枚举值。\n\n```cpp\nenum Color\n{\n  BLUE, // 值为 0\n  BLACK, // 值为 1\n \
    \ RED // 值为 2\n};\n```\n\n我们为枚举数据类型添加了一些注释。记住编译器会忽略注释，所以你可以随所欲地对代码进行注释。\n\n枚举值总是从\
    \ 0 开始赋值。每个变量都获得其自己的递增值。这意味着 `blue` 的值为 0，下一个变量 `black` 获得值 1，然后下一个变量获得值 2。当你在代码中调用这些变量时，这些是它们在执行期间所拥的值。\n\
    \n关于这些数据类型的另一个重要方面是，一旦你为枚举量提供了一个变量名列表，你就不能在代码的其他任何部分使用这些名称。这些变量名是全局定义的，这意味着它们可以在代码的任何部分访问。让我们来看一个例子。\n\
    \n```cpp\nenum Color\n{\n  BLUE, // 值为 0\n  BLACK, // 值为 1\n  RED // 值为 2\n};\n\
    \nenum MoreColors\n{\n  BLUE, // 值为 0\n  GREEN, // 值为 1\n  ORANGE // 值为 2\n};\n\
    ```\n\n上述代码会导致编译器错误，因为你已经在原始的 `Color` 枚举中使用过 `BLUE` 变量名。\n\n现在你已经定义了 `Color` 数据类型，可以在代码中使用它。让我们看看你将如何定义一个变量并获取它的值。\n\
    \n```cpp\nenum Color\n{\n  BLUE, // 值为 0\n  BLACK, // 值为 1\n  RED // 值为 2\n};\n\
    \nColor paint = BLUE;\n\nstd::cout << paint;\n```\n\n在示例代码中，我们有数据类型的定义，然后决定在某些代码中使用它。因为\
    \ `Color` 现在是一个数据类型，我们用它来定义变量。我们决定创建一个数据类型为 `Color` 的变量 `paint`。然后我们给变量赋值一个来自颜色列表的常量值。因为\
    \ `BLUE` 常量值为 0，下一条语句将打印值 0。\n\n由于枚举变量具有常量值列表，你也可以使用它们来初始化整数变量。例如，以下代码是有效的：\n\n\
    ```cpp\nint paintcolor = BLUE;\n```\n\n编译器将 `BLUE` 常量转换为整数并赋值给 `paintcolor` 变量。\n\
    \n结构体与枚举相似但在代码架构上大不同。结构体提供了一种表示对象的方法，而无需定义冗长的变量。\n\n例如，假设你有一个获取员工列表的程序。每个员工都有你需要检索的姓和名。你还需要获取出生期的年、月、日。你可以单独创建这些变量，也可以使用结构体来更好地定义和表示你的信息。\n\
    \n假设你需要为两个员工记录信息。你的变量看起来如下：\n\n```cpp\nstd::string firstname1;\nstd::string firstname2;\n\
    std::string lastname1;\nstd::string lastname2;\nstd::string birthyear1;\nstd::string\
    \ birthyear2;\n```\n\n你可以看到，这种变量定义完全没有效率。结构体允许你为员工创建一个类或对象，然后你可以为类属性分配代表每个员工的值。\n\
    \n让我们来看创建员工结构体所需的代码。\n\n```cpp\nstruct Employee\n{\n  int id;\n  std::string firstname;\n\
    \  std::string lastname;\n  int birthyear;\n};\n```\n\n"
- fmt: "\nThe above code defines our `Employee` structure, and then it uses the structure\
    \ to define two variables named `john` and `jane`. Like enumerations, structures\
    \ are also their own data types. The `Employee` data type is used to create the\
