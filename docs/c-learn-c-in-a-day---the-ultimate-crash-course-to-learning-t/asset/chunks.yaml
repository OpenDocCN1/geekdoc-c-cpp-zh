    ### 3. When you derive a child class from a parent class and then want to use
    the parent class properties, what do you do?


    a. instantiate the class and the use the properties from the derived child class


    b. instantiate the parent class as well


    c. call the parent class constructor


    d. add a new function to call the parent class


    **Explanation:** Derived child classes can use parent class properties as if they
    are a part of their own class.


