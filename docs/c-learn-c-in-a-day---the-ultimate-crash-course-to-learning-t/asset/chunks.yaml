  trans: "\n接下来是属性（Properties）。属性是类的名词，因此它们描述了类的特征。例如，方向盘是黑色的、圆形的，并且中心有一个安全气囊。这些都是描述类的属性，你使用它们来构建类设计。后备箱的尺寸、它是空还是满以及它的颜色也是类的属性。如你所见，你可以为每个类获取你所需的详细信息。\n\
    \n一旦你将所有的组件类组合在一起，你就有了一辆完整的汽车。在这个类比中，汽车代表程序。你的类可以用于构建其他程序，这是编写模块化代码另一个优点。例如，你可以为另一辆汽车使用同一个方向盘类，因为所有汽车的方向盘通常是相同的。\n\
    \n这是对类和面向对象编程（OOP）的简要概述。现在我们将查看一些代码和更多的架构示例。\n\n## 类 (Classes)\n\n我们已经看到了一些类的示例，但还没有详细介绍。类和结构体非常相似，但类为你提供了更多创建完整组件的能力，而不是局限于属性。\n\
    \n让我们使用之前章节中创建的 `Employee` 结构体并用它创建一个类。原始的 `Employee` 结构体如下：\n\n```cpp\nstruct\
    \ Employee\n{\n    int id;\n    std::string firstname;\n    std::string lastname;\n\
    \    int birthyear;\n};\n```\n\n现在让我们将这个结构体转换为类。\n\n```cpp\nclass Employee\n{\n\
    public:\n    int id;\n    std::string firstname;\n    std::string lastname;\n\
    \    int birthyear;\n};\n```\n\n如你所见，类和结构体之间没有太大区别。主要的区别在于我们指定了正在创建一个类，然后看到了 `public`\
    \ 修饰符。`public` 修饰符表示你想让该类对程序的其他部分公开。你也可以将类设为 `private`（私有），这样没有其他类可以调用它。在大多数情况下，你的类将保持为公有。\n\
    \n## 构造函数和析构函数 (Constructors and Destructors)\n\n构造函数和析构函数也是类的重要部分。构造函数允许你实例化一个类。你还需要将类设为公开，以便从程序的其他部分实例化它，但构造函数是实例化过程的第二部分。\n\
    \n实例化让你在程序中创建类对象。没有构造函数，你就无法动态创建类对象。让我们使用 `Employee` 类为我们的类创建一个构造函数。\n\n```cpp\n\
    class Employee\n{\npublic:\n    Employee() { }\n    int id;\n    std::string firstname;\n\
    \    std::string lastname;\n    int birthyear;\n};\n```\n\n我们添加了 `Employee` 构造函数。这个函数的名称始终与类相同。你可以像重载其他函数一样重载构造函数。重载的构造函数接受不同类型的参数以与其他构造函数区分开来。让我们添加一个重载的构造函数来看看它是什么样。\n\
    \n```cpp\nclass Employee\n{\nprivate:\n    int m_id;\npublic:\n    Employee()\
    \ { }\n    Employee(int id)\n    {\n        m_id = id;\n    }\n    int id;\n \
    \   std::string firstname;\n    std::string lastname;\n    int birthyear;\n};\n\
    ```\n\n我们添加了一个接受名为 `id` 参数的类构造函数。你还会注意到我们添加了一个 `private` 区域。这个 `private` 区域不能被外部类调用。即使类本身是公开的，实例化的类也看不到私有成员。我们创建了一个名为\
    \ `m_id` 的私有员工 ID 成员变量。这用于包含员工的 ID。私有成员通常是你不希望实例化的类对象编辑的值。由于员工 ID 不会改变，你将员工的 ID\
    \ 发送到重载构造函数，然后将其存储在私有成员 `m_id` 变量中。这些变量也被称为属性。你在定义的类中看到的变量都称为属性——有些是动态的，有些是私有且静态的。\n\
    \n我们的类还缺少一个析构函数。析构函数的作用与构造函数相反。当你想要销毁类时调用析构函数。换句话说，你想从内存中移除它。析构函数在技术上不是手动调用的。它函数会在程序关闭或函数超出作用域时调用。析构函数对于从内存中移除不需要的代码非常重要。\n\
    \n首先，让我们为 `Employee` 类添加析构函数。\n\n```cpp\nclass Employee\n{\nprivate:\n    int\
    \ m_id;\npublic:\n    Employee() { }\n    Employee(int id)\n    {\n        m_id\
    \ = id;\n    }\n    int id;\n    std::string firstname;\n    std::string lastname;\n\
    \    int birthyear;\n    ~Employee()\n    {\n        m_id = 0;\n    }\n};\n```\n\
    \n注意析构函数的结构与构造函数不同。析构函数始终以波号 (`~`) 字符开头。析构函数没有任何参数。你只需要使用析构函数清理任何你想从内存中移除的变量。在这个例中，我们将\
    \ `id` 设置为 0。\n\n让我们先为类添加一个成员函数，然后看看调用析构函数时会发生什么。成员函数是类的一部分，因此它们执行的操作应该始终与它们所属的类匹配。例如，你不会将控制产品的类放在\
    \ `Employee` 类中。例如，员工会在白天打卡计时。我们可以在 `Employee` 类中使用一个名为 `ClockTime` 的成员函数。\n"
- fmt: "\nStatic variables are also an option in your class objects. Static member\
    \ variables work a little differently than regular variables. Static member variables\
    \ act like global variables. If you remember from previous chapters, we discussed\
    \ global versus local variables. In the last section, all of the class variables\
    \ were local member variables that could not be accessed outside the class unless\
    \ you specifically called them or returned them in your member functions.\n\n\
    With static member variables and functions, the value can be called even in other\
    \ class objects in your code. In other words, the static member variable value\
    \ remains the same regardless of what object you’re using. Let’s take a look at\
    \ some example code, and we’ll change our variable to static.\n\n```cpp\nclass\
    \ Employee\n{\nprivate:\n    int m_id;\npublic:\n    Employee() { }\n    Employee(int\
    \ id)\n    {\n        id = id;\n    }\n  static int id;\n    std::string firstname;\n\
    \    std::string lastname;\n    int birthyear;\n    void ClockTime()\n    {\n\
    \        // clocktime code goes here\n    }\n    ~Employee()\n    {\n        m_id\
    \ = 0;\n    }\n};\n\nint main()\n{\n    Employee emp1 ( 2 );\n    Employee emp2\
    \ ( );\n    std::cout << \"The employee time clocked is  : \" << emp2.id << std::endl;\n\
    \    return 0;\n} // The destructor is called here!\n```\n\nIn the above code,\
    \ we changed the assignment to the Id passed to the `Employee` constructor. It\
    \ now points to a static integer variable that’s public, so we can call it from\
    \ outside of our class. Notice that we called the second constructor with no parameters\
    \ for `emp2`. This means that no value is set for the employee’s ID. However,\
    \ we call the `emp2.id` property when we print out the statement. The printout\
    \ will be 2 even though we never set the Id for the second `Employee` class object.\n\
    \nStatic properties are useful when you need a variable to act globally throughout\
    \ several class objects as we used in this example.\n\nThis chapter focused on\
    \ the basics of classes. You’ll need to practice as much as possible to understand\
    \ how they work and what you can do with them when designing your applications.\
    \ You should do your best to understand classes, because they are a part of most\
    \ large scale applications especially if they are coded in the C++ language.\n\
    \n### Lab Questions\n\n1. When you want to make your class variables global, what\
    \ modifier do you use?\n   a. global\n   b. const\n   c. private\n   d. static\n\
    \   **Explanation:** The `static` modifier turns local class variables into globally\
    \ accessible variables regardless of the class that it’s called from.\n\n2. When\
    \ you want to allow code to instantiate the class, what do you need to add?\n\
    \   a. destructor\n   b. constructor\n   c. member function\n   d. private members\n\
    \   **Explanation:** a `constructor` allows a class to be instantiated, and it\
    \ can be used to set default values in a class object by overloading the default\
    \ constructor.\n\n3. You want to write a destructor for the `Employee` class.\
    \ Write the proper syntax for the destructor.\n`~Employee() { }`\n**Explanation:**\
    \ The destructor is always the same name as the class object. It always has the\
    \ tilde prefix, and it never takes any parameters.\n\n4. If you want to allow\
    \ a class to be instantiated by external classes, aside from including a constructor,\
    \ what do you need to do with the class?\n   a. set it to private\n   b. set it\
    \ to public\n   c. make variables static\n   d. include a destructor\n   **Explanation:**\
    \ A private class cannot be instantiated, but a public class can be instantiated\
    \ from any other class in your program.\n\n# Chapter 11: Inheritance\n\n**Objective:**\
    \ this chapter teaches the programmer to inherit classes from parent classes to\
    \ define reusable code throughout their program.\n\nWe discussed classes in the\
    \ last chapter, and we focused on creating a class that described our Employee\
    \ database. We used a car to describe the way classes are designed. We missed\
    \ one part of class design – class inheritance. Inheritance allows you to derive\
    \ information from a parent class and use it in the child class. This chapter\
    \ discusses the way inheritance works and how you can design fully functional\
    \ C++ programs by inheriting objects from your main parent class objects.\n\n\
    ## An Overview of Inheritance\n\nBefore we get into the code for inheritance,\
    \ it’s important to understand the basics. Inheritance lets you derive classes\
    \ from parent classes. Imagine you want to create a program named `Animal`. You\
    \ need to then describe several animals and their function.\n\nAnimals have some\
    \ basic characteristics that they share across all species. Eyes, nose, and skin\
    \ can be found on all animals. These characteristics can change in property, but\
    \ you know that all animals have these three characteristics. The animal class\
    \ could be the parent class for all of your animals.\n\nNow, you know that cats\
    \ and dogs are also animals. Cats have eyes, a nose and skin. Dogs also have skin,\
    \ a nose and eyes. Therefore, these two classes can derive their traits from the\
    \ main animal class.\n\nYou can also have child of child classes. For instance,\
    \ with your dog class, you could then have subclasses that describe different\
    \ breeds of dogs. They are all dogs, so dogs would still remain as the parent\
    \ class.\n\n## Basic Inheritance\n\nLet’s go back to the `Employee` class. We\
    \ want to create a parent class. Let’s look at the `Employee` class.\n\n```cpp\n\
    class Employee\n{\nprivate:\n    int m_id;\npublic:\n    Employee() { }\n    Employee(int\
    \ id)\n    {\n        id = id;\n    }\n    int id;\n    void ClockTime()\n   \
    \ {\n        // clocktime code goes here\n    }\n    ~Employee()\n    {\n    \
    \    m_id = 0;\n    }\n};\n```\n\nNow we need to make a `Person` class. It could\
    \ be very simple with a few properties. Let’s create the `Person` class.\n\n```cpp\n\
    #include <string>\nclass Person\n{\npublic:\n    std::string firstname;\n    std::string\
    \ lastname;\n    int birthyear;\n    std::string GetFirstName() { return firstname;\
    \ }\n    int GetBirthYear() { return birthyear; }\n    std::string GetLastName()\
    \ { return lastname; }\n    Person(std::string strName = \"\", int nAge = 0, bool\
    \ bMale = false)\n    {\n    }\n};\n```\n\nYou’ll notice that we have the same\
    \ characteristics from our previous chapter. We have a public class named `Person`.\
    \ The class has three member variables, which are the person’s first and last\
    \ name, and their birth year. We added three member functions to get the first\
    \ and last name and the birth year. Then, we added a constructor for the person’s\
    \ instantiation.\n\nNow, we want the `Employee` class to derive from the `Person`\
    \ class. Let’s take a look and see what we can do to the `Employee` class to derive\
    \ members from the `Person` class.\n\n```cpp\nclass Employee : public Person\n\
    {\nprivate:\n    int m_id;\npublic:\n    Employee() { }\n    Employee(int id)\n\
    \    {\n        m_id = id;\n    }\n    int id;\n    void ClockTime()\n    {\n\
    \        // clocktime code goes here\n    }\n    ~Employee()\n    {\n        m_id\
    \ = 0;\n    }\n};\n```\n\nIf you take a look at the code, you’ll see that there\
    \ is only one small change to the code. The `: public Person` was added to the\
    \ end of the class name. The colon character tells C++ that you want to derive\
    \ or inherit from the parent class listed after the colon designation. When you\
    \ derive from a parent class, that parent class properties and methods become\
    \ available to the child class.\n"
