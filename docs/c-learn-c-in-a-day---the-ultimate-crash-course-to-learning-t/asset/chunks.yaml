  trans: "\n你还需要一个 IDE（集成开发环境）。IDE 是你编写代码的地方。它为你提供彩色编码的文本界面，帮助你编写更好的代码。颜色编码文本让你能够快速识别数据类型、注释、类和其他常见的代码结构。换句话之，它让代码更易读。大多数编译器都带有\
    \ IDE，因此在安装 IDE 之前请检查一下。\n\n一旦你确定了想要使用的编译器和 IDE，你需要在你的系统上安装它。该 IDE 应该带有一个 `EXE`\
    \ 或 `MSI` 软件包，让你能够自动安装软件，而无需使用任何命令行。如果你使用的是基于 Linux 的系统，你可能需要一些额外的配置。\n\n安装软件后，打开编译器感受一下它的工作原理。你将直接在\
    \ C++ IDE 中工作，因此要熟悉一下颜色编码。例如，注释通常以绿色文本显示。数据类型设置为蓝色。类也标记为蓝色。字符串则是红色或蓝色。标准变量（包括你的函数名）是黑色的。\n\
    \n在 IDE 的底部，你会看到构建日志（build log）和调试器（debugger）。这两个窗口是你编程成功最重要的两个窗口。构建日志会你在 C++\
    \ 编译器在创建可执行文件（编译程序）时是否发生了任何错误。调试器用于你单步执行代码并识别代码的哪个部分导致了错误。\n\n某些 IDE 有“待办事项”（to\
    \ do）列表。待办列表是一组在注释中设置了 `TODO` 的代码块。这告诉程序员他需要对代码进行更多处理，他还没有完成。\n\n如果 IDE 开发者足够友好，当你第一次运行程序时，会从一个临时的\
    \ Hello World 程序开始。这个程序可以被编译并在控制台中显示，这样你就可以看到编译器和语言的工作方式。还要注意，C++ 代码文件以 `.cpp`\
    \ 文件扩展名结尾。当你从硬盘上搜索程序所需的代码文件时，这一点非常重要。\n\n# 你将在这本电子书中学到什么\n\n我们的目标是让你适应成为一名 C++\
    \ 新程序员。C++ 是一门庞大的语言，但通过一些练习，你可以掌握基础概念并成为高级程序员。我们为你提供工具 set，你可以使用它来处理更复杂的程序。\n\n\
    在第一节中，我们将向你介绍 C++ 的基础。在开始实际编码之前，你需要了解基础结构和编程概念。\n\n接下来，我们将向你介绍变量数据类型以及调用某些变量时可以做的事情。变量用于任何编程语言，所以一旦你学会了一门语言，就能轻松学习其他任何语言。\n\
    \n接下来，我们将学习运算符以及如何在你的 C++ 程序中进行算术运算。然后我们进入高级数据类型，以及你可以如何从一种数据类型转换为另一种数据类型。我们还向你引入了\
    \ `string` 类，它与原始字符串或字符数据类型不同。\n\n然后我们进入循环和条件编程结构。这些在任何编程语言中都非常流行。循环和条件语句控制程序的执行方式。\n\
    \n稍微复杂一点，我们接着进入数组。数组稍微复杂一些，但它们在任何语言中都是必要的。即使是像 `C` 这样的底层语言也会频繁使用数组。\n\nC++ 中最难的部分之一是面向对象编程。C++\
    \ 中最难的部分之一是面向对象编程。C++ 中最难的部分之一是面向对象编程。\n\n# 第二章：C++ 基础\n\n目标：本章将简要概述你必须掌握的 C++\
    \ 基础。在学习任何语言之前，了解一些 C++ 是重要的。一旦你理解了 C++ 基础，就可以将这些概念应用到其他语言中。继承对你来说将简单得多。\n\n##\
    \ 程序结构与注释\n\n理解基础最好的方法是查看基础程序。让我们来看一个输出“Hello World”的简单程序。\n\n```cpp\n// 我的第一个第一个\
    \ C++ 程序\n#include <iostream>\n\nint main()\n{\n    std::cout << \"Hello World!\"\
    ;\n    return 0;\n}\n```\n\n注意，我们的每行代码都有特定的格式。注释是第一行代码。双斜杠（`//`）字符告诉编译器你想包含注释。处理器会完全忽略注释，因此你可以在这一部分编写任何你想写的内容。你也可以在\
    \ C++ 中使用多行注释。这里有一个使用相同代码的示例。\n\n```cpp\n/* 我\n可以用\nC++ 编写代码 */\n#include <iostream>\n\
    \nint main()\n{\n    std::cout << \"Hello World!\";\n    return 0;\n}\n```\n\n\
    当编译器创建你的程序时，斜杠和星号之间的任何内容都会被忽略。当你在 IDE 中输入注释时，它们通常会被编码为绿色。当你只有一行注释时，标准做法是使用 `//`\
    \ 注释指示符。当你有多行注释时，使用 `/* */` 注释结构。\n\n接下来你会看到 `include` 语句。这是包含其他库的方法。C++ 代码文件需要一种与其他文件集成的方法。你的程序不会是一个长页。它们将是分开的不同的页面。你可以在程序中有组织成数百个文件的类和函数。集成它们的方法是将它们作为库包含。在这个示例中，包含的库是\
    \ `iostream`。括号表示它是 C++ 内部库。自定义代码的库用引号包含，并且你会看到头文件的 `.h` 文件扩展名。\n"
- fmt: "\nThe next statement starts the main function. The `main` function is the\
    \ one, central point where execution begins. Think of the `main` function as the\
    \ starting point like a front door. When you visit a building, you don’t know\
    \ where to go or where your destination office is located. To figure it out, you\
    \ go through the front door, look at a directory, and then travel to your office.\
    \ The same is true for the C++ language and compiled programs.\n\nC++ searches\
    \ your code for the `main` function. From this function, you branch out to difference\
    \ sections of your code and instruct the compiler on how it should execute its\
    \ code. Without the `main` function, the compiler would not know where to start.\
    \ Therefore, you’ll always see a `main` function in a C++ program.\n\nYou’ll notice\
    \ the `int` statement prior to the `main` function name. The `main` function always\
    \ returns an integer. When the `main` function returns `0`, it means that no errors\
    \ were found during execution. Any other number returned indicates that there\
    \ was an error, so your program stopped unnaturally with errors.\n\nWithin the\
    \ `main` function brackets is the main code for your program. In this example,\
    \ we only have one line of code. We display “Hello World” to the default display.\
    \ In most systems, the default display is the monitor. The `<<` characters indicate\
    \ that you want to send output to the display.\n\nBrackets are always used to\
    \ organize a program’s code. They are used in loops and conditional statements.\
    \ They are also used with functions, as you can see from the previous code.\n\n\
    When you compile the above code, you see “Hello World” on your screen. That’s\
    \ all it takes to create your first C++ program.\n\n## Functions and Return Values\n\
    \nWe’ll get more heavily into functions in chapter 8, but you must know the basics\
    \ of a function before you can write the code.\n\nLet’s return to the Hello World\
    \ example.\n\n```cpp\n// my first program in C++\n\n#include <iostream>\n\nint\
    \ main()\n{\n  std::cout << \"Hello World!\";\n  return 0;\n}\n```\n\nWe explained\
    \ this small program in the previous section, but we’re going to focus on the\
    \ function section this time.\n\nA function always starts with a data type that’s\
    \ return. You can also return no data. Functions that don’t return any value are\
    \ giving the `void` data type. Void functions are similar to subroutines. They\
    \ perform an action and even sometimes display information to the user, but no\
    \ return value is sent to the calling statement.\n\nAfter the data type declaration,\
    \ the function is given a name. This can be any name as long as it’s not a reserved\
    \ C++ keyword. The open and close parenthesis indicates the area where arguments\
    \ are sent to the function. You can also send no arguments to the function. As\
    \ with the `main` function in our example, no parameters are set for the function,\
    \ so it’s just an open and close set of parenthesis with nothing contained.\n\n\
    All statements within a function are enclosed with the open and closing brackets.\
    \ If you left them out, the compiler would not know where one function began and\
    \ the next ended. This can be difficult when you use brackets with loops and conditional\
    \ statements. Make sure you format your code so finding missing brackets is easy.\
    \ Notice that we’ve tabbed the statements over, so the closing bracket is aligned\
    \ with the ending one. This type of formatting is standard in the coding industry,\
    \ because it makes your code much easier to read.\n\nThe final part of a function\
    \ is always the `return` statement. You only need a return when the function indicates\
    \ that a return value is needed. In the case of this function, we indicate that\
    \ the function returns an integer. Therefore, the `return` statement returns `0`.\
    \ Since `0` means that the program executed normally, this tells the compiler\
    \ that the program executed without errors.\n\nWhen you work with C++, you’ll\
    \ have several functions with return values and void data types. If you forget\
    \ to return a value when the function indicates one is returned, the compiler\
    \ displays an error.\n\n## Variables\n\nVariables are the containers for your\
    \ values whether they are numbers, characters, or other data types. Variables\
    \ hold any data that you need to manipulate and output to your users.\n\nLet’s\
    \ take a look at a simple numeric variable.\n\n```cpp\nint mynumber = 5;\n```\n\
    \nIn this example, we create a variable named `mynumber`. Notice the first part\
    \ of the statement is `int`. This indicates to the compiler that you want an integer\
    \ created. The format of a variable declaration is always the data type and then\
    \ the variable name. The following format is what you’ll always use to create\
    \ a variable.\n\n```\ndatatype variable;\n```\n\nNotice that a semicolon is always\
    \ at the end of the variable declaration even in the template. The semicolon is\
    \ what tells the compiler that the end of a statement has been found. You can\
    \ place your code in multiple lines on the IDE as long as you indicate to the\
    \ compiler when the statement should terminate. Let’s look at an example of a\
    \ statement that uses multiple IDE lines but still indicates the end using a semicolon.\n\
    \n```cpp\nint \nmynumber = 5;\n```\n\nWe added a carriage return after the `int`\
    \ statement. Even though there is a carriage return, the compiler continues reading\
    \ as if the statement continues. Once it meets with the semicolon character, it\
    \ knows to stop the statement. If you forget a semicolon in your statements, you\
    \ will receive an error during compiling, because the compiler doesn’t know when\
    \ to stop the current statement and begin with a new one. This leads to a syntax\
    \ error.\n\nIt can be difficult to find a missing semicolon in several lines of\
    \ code, so ensure that you keep track of your statements and always end them with\
    \ a semicolon. Forgetting a semicolon is one of a coder’s biggest headaches.\n\
    \nYour variable names should always be descriptive and explain your values. For\
    \ instance, you wouldn’t name a variable “cow” when it’s used to hold a breed\
    \ of horses. When you give your variables descriptive names that help identify\
    \ the values stored, it’s much easier to read the code and debug it.\n\nYou also\
    \ can’t use special characters, spaces or punctuation in your variable names.\
    \ Variable names must start with an underscore or a number. Any deviation from\
    \ this naming scheme and the compiler gives you an error. Most developers use\
    \ letters or an underscore to define their variables. Some use a prefix that indicates\
    \ the data type as the code continues. For example:\n\n```cpp\nint intMynumber\
    \ = 5;\n```\n\nThis standard isn’t as popular anymore, but it’s still used in\
    \ some applications. The theory is that it’s easier to read when you debug statements\
    \ several lines after you’ve defined the data type.\n\n## Operators\n\nOperators\
    \ are the operations you make on your variables. We’ll get more detailed in chapter\
    \ 4, but it’s good to have a brief overview of operators.\n\nOperators can be\
    \ mathematical, assignments, incremental and decremental, and comparisons. There\
    \ are numerous operators in C++, and we’ll go over them in more detail in chapter\
    \ 4. Here are the basics.\n\nThe very basic operator is the equal sign. The equal\
    \ sign is what assigns a value to a variable. After you set up your variable,\
    \ you then assign it a value. In the previous section, we did assignment and declaration\
    \ of a variable in one line of code, but you can separate them.\n\nUsing the above\
    \ `mynumber` variable, let’s separate assignment and declaration.\n\n```cpp\n\
    int mynumber;\nmynumber = 5;\n```\n"
