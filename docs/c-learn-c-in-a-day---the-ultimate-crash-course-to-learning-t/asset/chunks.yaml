    it reaches the first whitespace character such as a space. When it reaches this
    character, it stops the input. You can use cin for single character input, but
    we use getline to get full phrases including whitespaces.


    Let’s take a look at an example.


    #include <string>


    #include <iostream>


    int main()


    {


        std::cout << "Enter your full name: ";


        std::string fullname;


        std::getline(std::cin, fullname);


        std::cout << "Your name is " << fullname ;


        return 0;


    }


    Now we have a little more complex program compared to our previous Hello World
    example. This program actually prompts the user for input, takes the user input,
    and then displays it back to the user.


    The first line displays the prompt to the user. The next line defines the variable.
    The getline statement is the first time we’ve seen something different. This line
    stops program execution until the user enters a value and presses Enter on the
    keyboard. Whatever the user enters, the getline statement retrieves this value.
    The value is stored in the fullname variable, and then the output is redisplayed
    on the monitor.


    You’ll work with string values often in your C++ programs, so they are good to
    understand early in a programming career.


    Boolean Values


    Boolean values are the last common variable you’ll see in C++ programming. Booleans
    are the true and false values in C++. Some languages make you use a 1 and 0 to
    indicate true and false. C++ lets you use the key syntax statement true and false.


    When you work with Booleans, you should know that although you see the word “true”
    in your code, the value is really a bit value 1\. The value false is actually
    a bit value of zero. Booleans are the smallest values, because they only need
    one bit of storage.


    To declare a Boolean in C++, you only need to use the shorthand bool to indicate
    the data type. Let’s look at some sample code.


    bool over21 = true;


    The statement above initializes the variable over21 and sets it to a Boolean value
    of true. Once again, this true value is 1\.


    Boolean values are usually used to control conditional control of the code execution.
    Let’s take a look at an example.


    #include <iostream>


    int main()


    {


        bool b = true;


        if (b)


        {


                  cout << “B is true”;


        }


        return 0;


    }


    In this example, the Boolean variable b is set to true. The if statement (which
    we will discuss in chapter 6) evaluates if the b variable is true. If so, the
    printout is displayed. Since b is always true in this case, the statement “B is
    true” always displays.


    Booleans are a way to evaluate if a statement is true or false, so you can redirect
    the execution to the appropriate lines of code. They are used often in loops and
    conditional statements.


    Constants


    We’ve covered some basic variable types, but we still have one more to cover.
    Constants are what they sound like – they are constant values that never change.
    Constants are beneficial when you want to define a friendly variable name for
    a value. It’s generally not recommended to use static values throughout your code
    including strings and numbers. To compensate, the programmer should use constants.


    Let’s take a look at some sample code.


    const float MYFACTOR { 1.1 };'
