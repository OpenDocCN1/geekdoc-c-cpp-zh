    chapters. You then assign the structure to the array. You might wonder what you
    can do to obtain values from the structure within the array. You could retrieve
    the entire structure, but you can also retrieve values individually using the
    array index and the property you want to retrieve. Let’s take a look at an example.


    struct Employee


    {


        int id;


        std::string firstname;


        std::string lastname;


        int birthyear;


    };


    Employee employees[2];


    Employee emp1;


    emp1.id = 1;


    emp1.firstname = “John”;


    emp1.lastname = “Smith”;


    emp1.birthyear = 2000;


    employees[0] = emp1;


    cout << employees[0].firstname;


    We added one more line of code to our program. We display the firstname property
    located in the structure at index 0\. This is a basic way to retrieve information,
    but you can use this method to loop through dozens of employee records and display
    them to your users. Arrays are the classic way to handle execution when you need
    to support several records and variable values in one procedure.


    Pointers


    Pointers are a much more difficult concept. Pointers are variables that point
    to a specific address space. If you recall from chapter 2, we discussed how memory
    is reserved for your program and its variables. The compiler requests memory space
    from the operating system when it defines a variable in your code. The operating
    system allocates memory and allows the program to store data in each memory address
    space.


    A pointer points to the address space allocated for your variable. You can then
    print the address space value or the value contained within the address space.
    Let’s take a look at an example.


    int mynumber = 5;


    int *ptr = &mynumber;


    Even though this is only two lines of code, there is a lot to understand in these
    statements. The first statement is the variable assignment we’ve seen already.
    The second line of code defines a pointer.


    You know a pointer is defined from the asterisk in front of the variable name.
    We still use the int variable data type, which tells the compiler that the value
    stored in memory is an integer. Pointer data types must match the values they
    point to.


    When you define a pointer value, you don’t assign the typical value you would
    with a normal variable. Since pointers contain memory address spaces, you must
    point to a variable’s address space. When you place an ampersand ( &) in front
    of a variable, you tell the compiler that you want to retrieve the memory address.
    In the above code, we assign the memory address space for mynumber to the *ptr
    pointer variable.


    Here is a visual representation to help you understand.


    0012FFF7C                             <--- This is the value of the pointer


    ------------------                           


    5                                          <----- This is the value of the mynumber


    The 0012FFF7C value is the memory address. This memory address contains the value
    of 5\. As long as you have the address value for the pointer, you can always obtain
    the value of the variable.


    Let’s print out some values to view the results of our code.


    int mynumber = 5;


    int *ptr = &mynumber;


    cout << mynumber; //prints 5


    cout <<*ptr; //prints 5


    cout << ptr; //prints 0012FFF7C


    cout << &mynumber; //prints 0012FFF7C


    As you can see from the comments, each pointer and variable value points to either
    the value of the mynumber variable or the address space. You don’t normally use
    the address space in output, but you will use the pointer and memory address information
    as you calculate low level procedures.


    One issue to note with pointers is that they must be initialized to a valid variable.
    If you don’t initialize the pointer to a variable’s memory address, you can possibly
    crash your program. The reason for this is from the way operating systems handle
    programs and memory management. When you run your program, the operating system
    sets aside memory space specific for your program. Programs are sandboxed, which
    means they are cut off from accessing memory addresses for other programs. This
    is a security measure to protect data from leaking between programs. It also protects
    other programs from crashing if yours crashes. Sandboxing is a newer operating
    system technology, but it’s standard in software design.


    Let’s take a look at some example code. You can run this code in your own programming
    environment, but it will likely crash. It won’t harm the computer, but just know
    that it will likely crash.


    #include <iostream>


    int main()


    {


        int *ptr;


        std::cout << *ptr;


        return 0;


    }


    In the above program, you’ll notice that we don’t assign the pointer to any variable.
    The pointer is pointing to what is referred to as garbage memory. This memory
    contains no value, so there is nothing to display. When you point to garbage memory
    values, the program can crash.


    You can also use pointers to get the size of a variable’s value. This is useful
    to understand the amount of space used by stored values.


    Let’s take a look at the code to determine the size of the mynumber variable we
    created earlier.


    int mynumber = 5;


    int *ptr = &mynumber;


    cout << mynumber; //prints 5


    cout <<*ptr; //prints 5


    cout << ptr; //prints 0012FFF7C


    cout << &mynumber; //prints 0012FFF7C


    cout << sizeof(ptr);


    We added one line of code to our previous program. We still print the address
    memory locations and values for the variable, but now we include the sizeof function.
    The sizeof function tells you how much memory is used for a variable. This variable
    is easy to evaluate, because integers take 4 bytes of memory. However, if you
    have a large structure, you won’t know the amount of space allocated until you
    use the sizeof function.


    Arrays and pointers have several uses, and we just skimmed the details. Since
    we’re just starting out, getting too detailed with pointers and arrays can get
    confusing. The best way to better understand pointers and arrays is to write small
    programs and practice with each concept. You might even want to try the program
    that crashes just to see the output and the compiler’s response when it tries
    to reference garbage memory.


    Arrays are more common than pointers, but pointers are used in complex, low-level
    programs such as gaming engines and embedded system development.


    Lab Questions


    1. You want to create an array variable named mynumber that can contain two values.
    Write the code that defines this variable in C++.


    int mynumber[2];


    Explanation: The number set within the brackets tells the compiler how many values
    the array can contain. This array can contain 2 integer values.


    2. You want to create a pointer named ptr. You want to assign the mynumber array
    to the pointer. Write the code that initializes the pointer variable and assigns
    the variable.


    int *ptr = &mynumber;


    Explanation: Pointer variables always use an asterisks prefix. The ampersand character
    prefixed in the variable name tells the compiler to assign the variable’s address
    space to the pointer variable.


    3. What type of loop is usually used to populate an array’s list of values?


    a. while


    b. do while


    c. for


    d. switch


    Explanation: The for loop lets you assign a specific number of iterations using
    the array’s length, so it’s commonly used to populate and display array values.


    4. What type of memory is used for allocation when a pointer is not initialized
    to a variable address?


    a. null


    b. garbage


    c. external


    d. sandboxed


    Explanation: When the pointer isn’t initialized to a variable, it points to garbage
    memory and often crashes a program if it’s referenced.


    # Chapter 8: Functions


    Objective: This chapter teaches you how to make functions, which are the subroutines
    for C++. Functions create subroutines and additional logic for a program’s code
    execution.'
