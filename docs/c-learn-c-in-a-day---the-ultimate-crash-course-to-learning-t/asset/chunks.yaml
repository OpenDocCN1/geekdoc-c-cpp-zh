    \ <iostream>\n\nint calculate (int x, int y)\nint calculate(int x, int y)\n{\n\
    \    int result = x * y;\n    return result;\n}\n```\n\n为了简单，我们删除了 `main` 函数。在这些语句中有几个需要考虑的概念。\n\
