    \ 数据类型用于创建 `jane` 和 `john` 这两个变量。\n\n定义结构体后，现在让我们来看如何为它们赋值。以下代码为 `jane` 和 `john`\
    \ 分配了值。\n\n```cpp\nstruct Employee\n{\n    int id;\n    std::string firstname;\n\
    \    std::string lastname;\n    int birthyear;\n};\n\nEmployee john;\njohn.firstname\
    \ = “John”;\njohn.lastname = “Smith”;\njohn.birthyear = 2000;\n\nEmployee jane;\n\
    jane.firstname = “John”;\njane.lastname = “Smith”;\njane.birthyear = 2000;\n```\n\
    \n这比我们之前使用的变量更有组织，也更容易阅读。我们仍然定义了两个员工，但更容易阅读和理解了。如果你将 `Employee` 变量命名为 `john`，你就知道你把第一个名字存储在哪里了。\n\
    \n结构体让你更容易记住变量以及它们存储的数据。当后续程序员必须维护你的代码时，它也让代码更易读和理解。你还可以使用 `cout` 函数在填充结构体时显示信息。让我们通过一个使用输出显示员工名字的示例来完成结构体程序。\n\
    \n```cpp\nstruct Employee\n{\n    int id;\n    std::string firstname;\n    std::string\
    \ lastname;\n    int birthyear;\n};\n\nEmployee john;\njohn.firstname = “John”;\n\
    john.lastname = “Smith”;\njohn.birthyear = 2000;\n\nEmployee jane;\njane.firstname\
    \ = “John”;\njane.lastname = “Smith”;\njane.birthyear = 2000;\n\ncout << jane.firstname;\n\
    ```\n\n在这个示例中，我们只是打印了 Jane 的名字，当然是“Jane”。如果你使用那些笨拙的变量名，你需要向上滚动代码，并回想哪个变量包含了哪个员工的信息。这段代码让你简单地调用\
    \ `jane` 的数据，并且知道你正在获取 `jane` 的信息。\n\n枚举器和结构体是复杂得的数据类型，但当你开始构建健壮的应用时，它们非常有用。你需要保持代码的整洁和易读。如果不这样做，管理将非常困难。你可能有其他程序员与你的代码一起，他们将无法轻松理解你的意图。当代码越难以阅读时，未来任何添加导致\
    \ bug 的概率就越高。\n\n你可以使用结构体和枚举器创建新的数据类型，这些数据类型随后可以被加载到代码的其他区域。这些数据类型在大型应用程序的包含文件和类设计中常用。\n\
    \n### 实验题\n\n1. **枚举变量中第一个常量的值是多少？**\n   a. 0\n   b. 1\n   c. 2\n   d. null\n\
    \   **解释：** 枚举变量数据类型中的第一个变量值总是 0。\n\n2. **当你看到一个全大写的变量名时，你可以对该变量假设什么？**\n   a.\
    \ 它是一个全局变量\n   b. 它是一个常量\n   c. 它是一个局部变量\n   d. 它包含一个整数\n   **解释：** 编码标准要求开发者使用全大写字母创建常量变量。虽然这不能保证，但如果变量在代码中是全大写形式，假设它是常量是标准做法。\n\
    \n3. **假设你有一个名为 Employee 的结构体。你定义了一个名为 john 的 Employee 变量。该结构体在结构中定义了一个 firstname\
    \ 属性。编写代码为 john 的 firstname 属性赋值为“John”。**\n```cpp\nEmployee john;\njohn.firstname\
    \ = “John”;\n```\n**解释：** 结构体创建了自定义数据类型。第一行代码使用 `Employee` 数据类型定义了 `john` 变量。一旦定义了变量，就可以为结构体的属性赋值。在这个示例中，结构体有一个接收字符串输入的\
    \ `firstname` 属性。\n\n# 第 6 章：循环与条件语句\n\n**目标：** 循环和条件语句控制代码执行的流程。本章将详细解释循环和条件语句。\n\
    \n循环和条件语句被归类为一个称为“逻辑控制”的编程概念。这两种语句都是用于评估变量并响应真或假的逻辑语句。当语句的结果为真响应时，会执行特定的语句。反之，如果语句结果为假值，语句将被跳过，或者给编译器提供一组替代指令。循环和条件语句在任何\
    \ C++ 程序中都很常见，因此对于任何新开发者来说，理解这些过程至关重要。\n\n## if 语句\n\nC++ 的 `if` 语句属于条件语句类别。它是你在创建程序时会用到的主要条件语句。`switch`\
    \ 语句是一种替代方案，但 `if` 条件语句在编码标准中更流行。`if` 语句可以评估一个或多个变量，你甚至可以在语句中使用复合比较。\n\n我们在第 4\
    \ 章中非常简要地涵盖了 `if` 语句，现在我们将更详细地解释它们。\n\n首先，让我们标准的 `if` 语句模板。\n\n```cpp\nif (condition)\n\
    {\n  // 当条件为真时执行的语句\n}\n```\n\n如果你还记得第 4 章的内容，当括号内的条件返回真时，括号内的语句将被执行。我们在第 4 章中没有展示的是，当结果为假时，你可以设置替代语句。让我们来看一下\
    \ if-else 语句。\n\n```cpp\nif (condition)\n{\n  // 当条件为真时执行的语句\n}\nelse\n{\n  //\
    \ 当条件为假时执行的语句\n}\n```\n\n现在，让我们来看一个运行中的 `if` 语句。\n\n```cpp\nint num1 = 5;\nint\
    \ num2 = 6;\nint result = num1 + num2;\n\nif (result > 4)\n{\n  cout << “Result\
    \ is greater than 4.”;\n}\nelse\n{\n  cout << “Result is less than 4.”;\n}\n```\n\
    \n上面的 `if` 语句非常简单。如果 `num1` 和 `num2` 相加的结果大于 4，则显示“Result is greater than 4”。如果不是，则显示替代的“Result\
    \ is less than 4”。由于对 `result` 变量与 4 的比较为真，所以执行第一个语句。\n\n上面的 `if` 语句是简单的。如果 `num1`\
    \ 和 `num2` 相加的结果大于 4，那么显示短语“Result is greater than 4”。如果不是，则显示替代的“Result is less\
    \ than 4”。由于对 `result` 变量与 4 的比较为真，第一个语句被执行。替代的 `else` 语句仅在条件为假时执行。\n\n你可能会发现这段代码有一个问题。如果结果等于\
    \ 4 会怎样？条件结果为假响应，因此执行 `else` 语句。问题是，结果变成了“Result is less than 4”，这是不准确的。\n\n我们可以改变\
    \ `if` 语句以执行复合比较。C++ 并不像我们在之前的示例中那样仅限于一次比较。你可以进行多次比较并使用逻辑操作来确定输出。让我们来看一个示例。\n\n\
    ```cpp\nint num1 = 5;\nint num2 = 6;\nint result = num1 + num2;\n\nif (result\
    \ > 4 )\n{\n  cout << “Result is greater than 4.”;\n}\nelse if (result == 4) //\
    \ 原文为 result == 4，但根据逻辑应补充\n{\n  cout << “Result is equal to 4.”;\n}\n```\n\n\
    现在我们的 `if` 语句考虑了相等的情况。如果 `result` 等于四，控制将被送到 `if` 结构的 `else if` 部分。你可以继续堆叠这些 `if`\
    \ 和 `else` 语句，以涵盖代码中的每种逻辑可能性。\n\n`if` 语句可能会变得复杂且难以阅读。如果你有太多堆叠的 `if` 和 `else` 语句，编码标准要求你创建一个函数。我们将在第\
    \ 8 章中介绍函数，但请记住，当存在太多逻辑可能性时，会使用函数。过多的 `if` 语句可能会导致逻辑 bug。\n\n## switch 语句\n\n"
