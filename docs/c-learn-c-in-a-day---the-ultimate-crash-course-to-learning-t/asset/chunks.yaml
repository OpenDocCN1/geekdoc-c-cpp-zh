    \    std::string lastname;\n    int birthyear;\n};\n\nEmployee john;\njohn.firstname\
    \ = “John”;\njohn.lastname = “Smith”;\njohn.birthyear = 2000;\n\nEmployee jane;\n\
    jane.firstname = “John”;\njane.lastname = “Smith”;\njane.birthyear = 2000;\n\n\
    cout << jane.firstname;\n```\n\nIn this example, we just printed Jane’s first\
    \ name, which of course is “Jane.” If you used the cumbersome variable names,\
    \ you would need to scroll up your code and recall which variable contained what\
    \ employee information. This code lets you simply call `jane`’s data, and you\
    \ know that you’re getting `jane`’s information.\n\nEnumerators and structures\
    \ are much more complex data types, but they are extremely useful when you start\
    \ to build robust applications. You’ll need to keep your code organized and easy\
    \ to read. If you don’t, it’s very difficult to manage. You might have other programmers\
    \ working with your code, and they won’t be able to easily understand your intentions.\
    \ When code is more difficult to read, there is a much higher chance that any\
    \ additions will cause bugs in the future.\n\nYou can use structures and enumerators\
    \ to create new data types, which can then be loaded into other areas of your\
    \ code. These data types are commonly used in includes and class designs in larger\
    \ applications.\n\n### Lab Questions\n\n1. **What value is given to the first\
    \ constant in an enumerated variable?**\n   a. 0\n   b. 1\n   c. 2\n   d. null\n\
    \   **Explanation:** the first variable value in an enumerated variable data type\
    \ is always 0.\n\n2. **When you see a variable in all capital letters, what can\
    \ you assume about the variable?**\n   a. that it’s a global variable\n   b. that\
    \ it’s a constant\n   c. that it’s a local variable\n   d. that it contains an\
    \ integer\n   **Explanation:** Coding standards ask that developers create constant\
    \ variables in all capital letters. While it’s not a guarantee, it’s standard\
    \ to assume that a variable is a constant if it’s in all capital letters in your\
    \ code.\n\n3. **Suppose you have a structure named Employee. You define an Employee\
    \ variable named john. This structure has a firstname property defined in the\
    \ structure. Write the code that assigns the firstname property for john with\
    \ the value of “John.”**\n```cpp\nEmployee john;\njohn.firstname = “John”;\n```\n\
    **Explanation:** Structures create a custom data type. The first line of code\
    \ defines the `john` variable using the `Employee` data type. Once the variable\
    \ is defined, you can assign values to the structures's properties. In this example,\
    \ the structure has a `firstname` property that takes string input.\n\n# Chapter\
    \ 6: Loops and Conditional Statements\n\n**Objective:** Loops and conditional\
    \ statements control the process flow for code execution. This chapter explains\
    \ loops and conditional statements in detail.\n\nLoops and conditional statements\
    \ are grouped into a programming concept called logic control. Both of these statements\
    \ are logical statements used to evaluate variables and respond with either true\
    \ or false. When the statement results in a true response, specific statements\
    \ run. Conversely, if the statement results in a false value, statements are either\
    \ skipped or the compiler is given an alternative set of instructions. Loops and\
    \ conditional statements are very common in any C++ program, so it’s important\
    \ for any new developer to understand the processes.\n\n## The if Statement\n\n\
    The C++ `if` statement falls into the conditional statement category. It’s the\
    \ main conditional statement that you’ll use when you create your programs. The\
    \ `switch` statement is an alternative, but the `if` conditional statement is\
    \ much more popular with coding standards. The `if` statement can evaluate one\
    \ or more variables, and you can even use compound comparisons in your statements.\n\
    \nWe covered `if` statements very briefly in chapter 4, and now we’re going to\
    \ explain them in better detail.\n\nFirst, let’s take a look at the standard `if`\
    \ statement template.\n\n```cpp\nif (condition)\n{\n  //statements that run when\
    \ condition is true\n}\n```\n\nIf you recall from chapter 4, when the condition\
    \ within parenthesis returns true, the statements within brackets are executed.\
    \ What we didn’t show you in chapter 4 is that you can set up alternative statements\
    \ when the result is false. Let’s take a look at the if-else statement.\n\n```cpp\n\
    if (condition)\n{\n  //statements that run when condition is true\n}\nelse\n{\n\
    \  //statements that run when condition is false\n}\n```\n\nNow, let’s take a\
    \ look at an `if` statement in action.\n\n```cpp\nint num1 = 5;\nint num2 = 6;\n\
    int result = num1 + num2;\n\nif (result > 4)\n{\n  cout << “Result is greater\
    \ than 4.”;\n}\nelse\n{\n  cout << “Result is less than 4.”;\n}\n```\n\nThe above\
    \ `if` statement is simple. If the result of the addition of `num1` and `num2`\
    \ is greater than 4, then the phrase “Result is greater than 4” is displayed.\
    \ If it’s not, the alternative “Result is less than 4” displays. Since the comparison\
    \ of 4 with the `result` variable is true, the first statement is displayed. The\
    \ alternative `else` statement only executes if the condition is evaluated to\
    \ true.\n\nYou might see an issue with this code. What happens if the result is\
    \ equal to 4? The condition results in a false response, so the `else` statements\
    \ are executed. The problem is that the phrase results in “Result is less than\
    \ 4,” which is inaccurate.\n\nWe can change our `if` statement to perform compound\
    \ comparisons. C++ doesn’t limit you to just one comparison like we’ve seen in\
    \ previous examples. You can perform multiple comparisons and use logic operations\
    \ to determine the output. Let’s take a look at an example.\n\n```cpp\nint num1\
    \ = 5;\nint num2 = 6;\nint result = num1 + num2;\n\nif (result > 4 )\n{\n  cout\
    \ << “Result is greater than 4.”;\n}\nelse if (result == 4)\n{\n  cout << “Result\
    \ is equal to 4.”;\n}\nelse\n{\n  cout << “Result is less than 4.”;\n}\n```\n\n\
    Now our `if` statement accounts for equality. If `result` is equal to four, control\
    \ is sent to the `else if` section of the `if` structure. You can continue to\
    \ stack these `if` and `else else` statements together to account for each logical\
    \ possibility in your code.\n\n`if` statements can get complex and difficult to\
    \ read. If you have too many stacked `if` and `else else` statements, coding standards\
    \ ask that you create a function. We’ll get into functions in chapter 8, but know\
    \ that functions are used when there are too many logical possibilities. Functions\
    \ are more efficient, and they are easier to read and understand. Too many `if`\
    \ statements can lead to logic bugs.\n\n## The switch Statement\n"
