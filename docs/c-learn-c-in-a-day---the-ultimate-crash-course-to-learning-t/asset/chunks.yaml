    Creating a Function


    We had a brief overview of functions, but let’s review them again. The best function
    to review when starting a C++ programming course is the main function since it’s
    a part of every C++ program.


    #include <iostream>


    int main()


    {


         cout << “Hello World”;


        return 0;


    }


    The above code is one of the simplest programs in C++. The Hello World program
    is standard for new developers to help them understand programming concepts. Let’s
    dissect this program line by line.


    The include statement we’ve seen before. This statement includes external libraries.
    In this example, we’ve imported the iostream library, which is necessary for the
    cout function.


    Next, the function is defined. The int statement tells the compiler that an integer
    value is returned after the function is finished executing. All main functions
    in C++ programs return an integer value. This integer is used to identify if any
    error is thrown during program execution. When a 0 is returned, it tells the compiler
    that the program ran successfully.


    The main function does not take any parameters, but we’ll cover functions and
    parameters in the next section.


    All statements within the brackets are the function’s execution code. The function
    will continue executing until it reaches the return statement. Remember that functions
    with a data type must return a value, so you must return an integer in this main
    function. If you tried to return a string, the compiler would give you an error.


    You can also use the void data type. Let’s take a look at a function with a void
    data type definition.


    #include <iostream>


    void calculate()


    {


                  int int1  = 5;


                  int int2 = 5;


                  cout << int1 + int2;


    }


    Notice in this calculate function, void is used as the data type. This tells the
    compiler that no value is returned. As you can see, there is no return statement
    in the function. You can still use the return statement if you want to terminate
    the function prematurely. For instance, if a value evaluates to a specific condition,
    you can use the return statement.


    Let’s take a look at a void statement with a return.


    #include <iostream>


    void calculate()


    {


                  int int1  = 5;


                  int int2 = 5;


                  if (int1 == 5)


                  {


                       return;


                  }


                  cout << int1 + int2;


    }


    Notice in this return statement that no value is indicated. Because the function
    is set to void, any return value creates an error in your code, and the compiler
    won’t compile it. In this example code, if the int1 variable is 5, the function
    terminates prematurely. Since int1 is actually 5, this function displays nothing
    to the user. It’s not a logical function to use, but it gives you a good example
    of how you can terminate a function and return execution to the calling function.


    Using Parameters with a Function Definition


    If you recall from chapter 6, we mentioned that it’s better to use functions for
    decision making when you have too many if-else statements. When a function doesn’t
    take any parameters, there isn’t much logic to it. These types of functions are
    used when you don’t need any logic and want to just reuse the same code to calculate
    values. However, a more common way to use functions is to set parameters in the
    function and force the calling statement to pass parameters that are then used
    to calculate logic.


    The following is the template for a function with parameters.


    datatype functionname(param1, param2, …)


    {


                  // statements to execute


    }


    As you can see, the format is similar to the main function we worked with in the
    last section. The only difference is we added parameters. You can have any number
    of parameters in your function, but remember that the number of parameters you
    set must be used by the calling function. If you have too many parameters, it’s
    best to break down your function into several functions or consider redesigning
    your code for efficiency.


    The template helps us learn the way functions are set up, but it doesn’t help
    when we’re trying to learn to code real programs. Let’s take a look at an actual
    function with some real logic.


    #include <iostream>


    int calculate (int x, int y)


    int calculate(int x, int y)


    {


                  int result = x * y;


                  return result;             


    }


    We removed the main function for simplicity. There are several concepts to consider
    in these statements.


    First, you’ll notice that it looks like we defined the function twice, but we
    didn’t. C++ and even C use a concept called prototyping. You’re required to add
    the prototyping statements at the beginning of you C++ programming files. The
    prototype is just a copy of the function definition without the actual execution
    statements. It seems useless, but you’ll need it for the compiler. Without the
    prototype, the compiler gives you an error.


    The next statements are the actual function. This function is named calculate,
    and it takes two integers as a parameter. The parameters in this function are
    named x and y, but the calling statement does not need the same named function
    parameters. We’ll discuss calling statements after we detail the function.


    The x and y parameter variables are then used to multiply the two statements and
    return a result. It’s a simple function, but it has a purpose. The function won’t
