    statement. If you didn’t include the increment statement, the compiler gives you
    an error.


    These loops and conditional statements are engrained in any program. You’ll need
    a firm grasp of them to properly debug code. They are common in code, but they
    are also likely culprits for causing bugs. Just one small logic error in your
    code can cause huge bugs in your program. For this reason, it’s important to design
    your code well and use the most efficient structure that makes the code easy to
    read if you ever need to change it.


    Lab Questions


    1. What type of loop is created when you define a while loop that never stops
    executing?


    a. do while


    b. for while


    c. infinite loop


    d. double loop


    Explanation: an infinite loop eats up computer memory and eventually crashes your
    program.


    2. What statement must you include in a switch statement to ensure that execution
    stops after a case matches?


    a. goto


    b. break


    c. default


    d. switch


    Explanation: the break statement stops execution within the switch statement,
    so every case evaluation doesn’t run.


    3. What loop always executes its statements at least once?


    a. do while


    b. while


    c. for


    d. switch


    Explanation: the do while loop executes its statements first, and then it evaluates
    the condition. This means that statements always run at least once.


    4. What type of loop has a smaller chance of creating an infinite loop since the
    increment expression is embedded in the loop structure?


    a. do while


    b. while


    c. for


    d. switch


    Explanation: the for loop is the preferred loop for logical execution flow, because
    it contains the increment expression and the condition embedded in its structure.


    # Chapter 7: Arrays and Pointers


    Objective: This chapter covers arrays and their indexes as well as the pointers
    that link values and variables to a memory location.


    Arrays and pointers are slightly more advanced concepts. Arrays are a part of
    every program, because you can contain several values in only 1 variable. You
    can contain 1 or 1000 values in one variable. Pointers are one of the most difficult
    for students to understand, because you point to specific areas of memory and
    not an actual value. We’ll cover both of these concepts in this chapter, so you
    can get a full understanding of them.


    Building Arrays


    There are times when you need to calculate or evaluate several records. We used
    an example of an employee record using structures where we wanted to fill two
    records with the same type of data. But what if you had 100 employee records that
    you needed to work with? You could use an array, which would hold each value in
    a separate container. These containers are called indexes.


    An index is a location within the array. When you code your programs, you’ll increment
    and iterate through these indexes. An important part of indexes is understanding
    where they start. Indexes always start at 0\.


    First, let’s look at the code to initialize an array.


    int numbers[2];


    That’s all it takes to initialize an array, but there are concepts you should
    know. The int data type tells the compiler that you want to contain integer values
    in your array. The data type set on an array defines the type of data you can
    store in the variable. In this example, we want to store integer values.


    The next part of the statement is the array name. We’ve given the name “numbers”
    to the array. The number 2 in brackets defines the number of values you can store
    in the array. In this example, we set the number of possible values to 2\. An
    important issue to note is that you don’t store numbers 1 to 2\. The 2 in the
    brackets is the amount of values you can store, but array indexes start with 0\.
    This means that the indexes for the array are 0 and 1\. Remember that the index
    containers start with 0, and the last index container is the number in brackets
    minus 1\. In this instance, it’s 2-1 or 1.


    After you create the array, you can now populate it with values. You use the index
    numbers to assign values to the array. Let’s take a look at some code.


    int numbers[2];


    numbers[0] = 1;


    numbers[1] = 3;


    In the above code, we’ve filled both indexes with a value. You don’t have to fill
    the array with values immediately after you create the array. Most programs use
    a for loop to populate an array with its values. For instance, suppose you want
    to populate the numbers array using a for loop and the count variable we worked
    with in the last chapter.


    If you wanted to populate the array using a loop, here is an example of how you
    could do it.


    int numbers[2];


    for (int count = 0; count < 2; count++)


    {


        numbers [count] = count;


    }


    In the above code, we first define the array. We again set the array to contain
    2 values. We then use the count variable that we worked with in the previous chapter.
    We initialize it to 0, and start the loop. Notice that we used count in the array
    value assignment. In the first iteration, count is equal to 0\. This means that
    the first iteration populates the array container at index 0\. Then, count is
    incremented by 1, and the index container of 1 is populated next this is an important
    concept when you start working with large sets of data. We could change these
    values to 100 without changing our code and creating massive lines code. This
    is the advantage of an array working with a for loop.


    Arrays and for loops are also used to display information. Just like the above
    loop where we assigned values, we can also loop through an array just to display
    the information. Let’s take a look at an example.


    int numbers[2];


    numbers[0] = 1;


    numbers[1] = 3;


    for (int count = 0; count < 2; count++)


    {


        cout << numbers [count] ;


    }


    In this example, we assigned values to our array. We used the same for loop for
    assigning values to our array, but this time we just display the information.
    Notice that we use the count variable to retrieve information from the numbers
    array. Even though count is equal to 1 in the second iteration, the display value
    shown is 3, because 3 is contained in the index container 1.


    Arrays aren’t limited to containing primitive values. We showed you how to work
    with simple integers, but you can also use arrays to contain entire structures.
    In the structure chapter, we discussed creating structures to represent data when
    you have several variables that you need to create. With structures, you can organize
    your data more efficiently. We used an example of an Employee structure.


    Suppose you needed to store 100 employee structures. An array can be used to store
    the 100 Employee structure records. Let’s take another look at our Employee structure.


    struct Employee


    {


        int id;


        std::string firstname;


        std::string lastname;


        int birthyear;


    };


    Now we want to store several Employee records in an array. If you recall, structures
    create your own data type. This means that we can define an array variable using
    the Employee data type. Take a look at the following code.


    struct Employee


    {


        int id;


        std::string firstname;


        std::string lastname;


        int birthyear;


    };


    Employee employees[2];


    In the code above, we have the structure defined, and then we create an array
    with the data type Employee. The array’s name is employees, and we tell the compiler
    to allocate memory for two Employee structures.


    Now let’s populate a structure and assign it to the first index container.


    struct Employee


    {


        int id;


        std::string firstname;


        std::string lastname;


        int birthyear;


    };


    Employee employees[2];


    Employee emp1;


    emp1.id = 1;


    emp1.firstname = “John”;


    emp1.lastname = “Smith”;


    emp1.birthyear = 2000;


    employees[0] = emp1;'
