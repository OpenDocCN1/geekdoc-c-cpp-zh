    # Chapter 1: An Introduction


    **Objective:** Get a brief introduction, history, and understanding of the C++
    language.


    C++ is widely known as a low-level, advanced language that every programmer should
    know. One main difference between C and C++ is object-oriented programming (OOP).
    The OOP side of C++ is probably makes it much more difficult to understand and
    learn. This ebook is meant to help new programmers with the language, including
    help with OOP methodologies and structures.


    ### A Brief History of C++


    The C++ language first appeared in the 1980s. It was created by a Danish computer
    scientist named Bjarne Stroustrup. The original name for the language was “C with
    Classes,” but was later changed to C++. The main original purpose for C++ was
    adding OOP to the older C language.


    As the years went on, C++ evolved and was standardized. C++ was created as a low-level
    language, which means that it works closes to binary level programming. As a matter
    of fact, the language was originally created to work only one step above binary
    or assembly language. The closer a language is to actual machine language makes
    it faster and more flexible with low-level machine manipulation such as memory
    processing and storage.


    ### What is C++ Used For?


    The single most basic reason developers still use a language that’s over 30 years
    old is performance. Remember that languages that are closer to the binary computer
    language are always faster than bulky overhead languages such as `Java`, `C#`
    or `VB`. The latter three languages still have their uses, but C++ is mostly used
    for programming where alternative languages are unable to fully cover aspects
    of development.


    As a new developer, the world is your horizon and you can use any language you
    want. However, there are some industries where you won’t be able to use any language
    other than C++. The C++ language is engrained in several areas of IT and software
    development.


    **Gaming** is probably the number one area of IT where you’ll need to know C++.
    C++ is used to create gaming engines. Other languages are too bulky and waste
    resources. Since gaming engines are concerned with speed and quality of rendering,
    C++ is the language used for low-level programming in gaming design. It’s usually
    coded along with other languages in gaming design, so it helps a developer to
    understand multiple languages when getting into game programming.


    **Device drivers** are almost exclusively done in C++. C is used in embedded systems,
    but the drivers used to integrate hardware with larger systems such as desktops,
    servers and mobile devices are all coded with C++. Device drivers are the software
    programs used to allow the hardware component to work with an operating system.
    Device drivers are specific to the operating system, but C++ works across any
    platform. Device driver writers use C++ for its speed and platform-independent
    integration. Once compiled, the program is specific to the operating system, but
    you can use C++ to write for Linux, Windows, and Apple systems.


    **Imaging and video processing software** uses C++. It’s again used for its speed.
    It can take days to render an image or video.


    ### Why Use C++?


    Most new programmers are confused between the differences of C++ and C. They don’t
    know when to use the C++ language over C, or any language for that matter. The
    main difference with C++ is its use of object-oriented programming. This does
    not make the C language inferior, it just makes C++ accessible to additional libraries
    and coding possibilities. With object-oriented programming, you can use constructors
    and destructors. A constructor instantiates the class and a destructor removes
    it from memory.


    ### What You Need to Code in C++


    C++ is a compiled language, which means that you need a compiler before you can
    complete the coding process. You could type the code in a regular text file, but
    it’s not recommended and you’ll still need a compiler even if you do write perfect
    code with no errors. Remember that compiled languages depend on the operating
    system on which they are compiled.

