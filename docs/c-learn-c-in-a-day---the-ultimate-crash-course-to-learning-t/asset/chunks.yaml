    \n你可能会问程序是如何知道要调用哪个函数的。由于我们有不同的数据类型和调用参数，编译器会根据你调用函数的方式自动知道要调用哪个函数。让我们在程序中使用这两个函数。\n\
    \n```cpp\n#include <iostream\n\nint calculate (int x, int y);\n\nfloat calculate(float\
    \ x, float y);\n\nconst int MAININT = 4;\n\nint main()\n{\n    int result = calculate\
    \ (5, 5);\n    float fresult = calculate (7.5, 7.5);\n    cout << result + fresult;\n\
    \    return 0;\n}\n\nint calculate(int x, int y)\n{\n    int result = x * y;\n\
    \    return result;\n}\n\nfloat calculate(float x, float y)\n{\n    int result\
    \ = x * y;\n    return result;\n}\n```\n\n（注：由于原文后部分存在大量重复的段落，译文已按要求仅翻译核心逻辑并去重。）\n"
