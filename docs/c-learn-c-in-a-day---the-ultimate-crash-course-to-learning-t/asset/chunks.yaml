  trans: "\n下一个语句启动了主函数。`main` 函数是执行开始的中心点。将 `main` 函数想象成像正门那样的起始点即可。当你访问一栋建筑时，你并不知道该去哪里，也不知道你的目标办公室在哪里。为了弄清楚这个问题，你穿过正门，查看目录索引，然后前往你的办公室。C++\
    \ 语言和编译后的程序也是如此的。\n\nC++ 会在你的代码中搜索 `main` 函数。从这个函数开始，你分支到代码的不同部分，并指示编译器如何执行这些代码。如果没有\
    \ `main` 函数，编译器将不知道从何开始。因此，你总会在 C++ 程序中看到一个 `main` 函数。\n\n你会注意到在 `main` 函数名之前有一个\
    \ `int` 语句（类型）。`main` 函数总是返回一个整数。当 `main` 函数返回 `0` 时，意味着执行过程中没有发现任何错误。返回任何其他数字都表示发生了错误，因此你的程序由于错误非正常停止。\n\
    \n在 `main` 函数的括号内是你程序的主代码。在这个示例中，我们只有一行代码。我们向默认显示器显示“Hello World”。在大多数系统中，默认显示器是显示器。`<<`\
    \ 字符表示你想将输出发送到显示器。\n\n括号始终用于组织程序的代码。它们被用于循环和条件语句。正如你从之前的代码看到的，它们也被用于函数。\n\n当你编译上面的代码时，你会在屏幕上看到“Hello\
    \ World”。这就是创建你的第一个 C++ 程序所需的全部。\n\n## 函数与返回值\n\n我们将在第 8 章更深入地研究函数，但在编写代码之前，你必须了解函数的基础知识。\n\
    \n让我们回到 Hello World 示例。\n\n```cpp\n// 我的我的第一个 C++ 程序\n\n#include <iostream>\n\n\
