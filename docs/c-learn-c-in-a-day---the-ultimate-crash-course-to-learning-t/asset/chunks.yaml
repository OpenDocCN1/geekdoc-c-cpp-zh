    };


    Employee & Employee::operator++()


    {


        if (m_ emp == 9)


            m_ emp = 0;


        else


            ++m_ emp;


        return *this;


    }


    Employee & Employee::operator--()


    {


        if (m_ emp == 0)


            m_ emp = 9;


        else


            --m_ emp;


        return *this;


    }


    int main()


    {


        Employee Emp1(6);


        Employee Emp2(8);


        Employee total = Emp1++;


        std::cout << "I have " << total << " total Ids." << std::endl;


        return 0;


    }


    Just like the other overloaded functions, we again use the main function to call
    the class member functions to use the overloaded method. We don’t need the friend
    function type because we just need to increment a numeric value either by one
    or decrement a number by one.


    Overloading operators is a common concept in some programs, but they aren’t common.
    You should still understand the concepts and learn how you can make your own overloaded
    operators. This chapter helped you understand the basic concepts, so you can take
    them and use them in your own programs. Once you understand overloading, you can
    understand some important parts of C++ and object oriented programming.


    Lab Questions


    1. When you use a mathematical operator in your programs, what actually happens
    with the calculation is made?


    a. the operation is actually a function operation


    b. the function is removed from the computer’s memory


    c. the operation is calculated using outside libraries


    d. the calculation is made differently


    Explanation: operators look like simple mathematical operations in C++, but operators
    in C++ are actually functions.


    2. What is the function operator you must use when you want to overload an operator
    in C++?


    a. parent


    b. friend


    c. private


    d. public


    Explanation: the friend operator is needed when overloading arithmetic and comparison
    operators in C++.


    3. When you pass variables to your overloaded function, how do you pass them?


    a. using a pointer variable operator


    b. using the variable’s value


    c. pass the entire custom class object


    d. using the values memory address


    Explanation: passing the memory address is the way to pass values to your custom
    class functions and overload the way a standard operator functions.


    # Chapter 10: Object Oriented Programming with C++


    Objective: This chapter gives you an introduction to object-oriented programming
    (OOP). OOP is the foundation for programming reusable code, and it can be used
    in other languages.


    Object-oriented programming (OOP) is what distinguishes C++ from its predecessor
    C. C is good for low-level programming, but OOP is necessary for large scale programs
    that power the web and internal applications. OOP is a more advanced subject,
    but you must know these principles to fully understand how to use the C++ language.
    We went into OOP a bit in the last chapter, but we’re going to focus more on the
    topic in this chapter. This chapter is dedicated to OOP and its design principles.


    A Brief Overview of OOP Design


    Before going into OOP structures, it’s important to understand the way OOP is
    designed to work with a program. The typical way to explain OOP is using a car. 
    When you think of a car, you know that the car has parts. Each part is its own
    unique component, but the components come together to form a fully functional
    car.


    Each component performs a function for the car. For instance, the engine enables
    the car to move. The steering wheel controls the direction, and the trunk lets
    you store content. All of these components perform actions. The engine moves the
    car, the steering wheel turns left or right, and the trunk hatch can be opened
    and can store content. These actions are the “verbs” for an OOP program.


    Components also have properties. These properties are the “nouns” in an OOP program.
    Properties describe the component. The engine is 8 liters, the trunk is black,
    and the steering while is black as well. These are properties of the object.


    As you describe your car, you can get more and more detailed about its design.
    This same design can be used to describe a program. In OOP, the main object you
    program is called a class. A class would represent the components we just described
    for our car. Each class is designed with the idea that it forms a purpose for
    your application. Think of a CRM application. A class would represent a customer,
    an order, and even a product. Of course, you would have several classes and subclasses
    for a large application, but these OOP concepts help you design your software.


    Classes are broken down into subclasses through inheritance. We’ll cover inheritance
    in the next chapter. In the example of our car, the engine would be a class, the
    steering wheel would be another class and then the trunk would be a third class.
    These classes come together to form your car.


    With the “verbs” or actions that the classes do, they are created in the form
    of methods. Methods are the actions your class does. For instance, you could have
    a method named “move” for the engine. Methods are just another way to say “function.”
    The only difference between a method and a function is that a method is a part
    of a class where a function is a standalone subroutine. Just get used to the terminology
    “method” when you see a discussion about function of a class. Methods are always
    the verbs, so they perform an action within the class.'
