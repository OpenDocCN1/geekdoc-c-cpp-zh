    \ = 5.5, anothernumber = 10.5;\nint mynumber = 5, anothernumber = 10;\n```\n\n\
    In other words, all variables within scope (we will define scope later) must have\
    \ a different name.\n\n# Characters and Strings\n\nWe keep showing examples of\
    \ numbers and integers as examples, because numeric values are the simplest variables\
    \ and values to understand. However, a big part of your programming experience\
    \ will be in using and manipulating string variables. String variables are the\
    \ “words” in a program. They prompt users and allow users to store strings as\
    \ values such as their name and address.\n\nSince C++ is derived from C, the first\
    \ important point to note is that a word or a string is an array of characters.\
    \ `C` has no library for strings, so you must work with character arrays. `C++`\
    \ has a string library, so you can work with strings in the same way you work\
    \ with them in other languages.\n\nLet’s first look at the `char` data type, so\
    \ you can understand characters and how they are stored. Characters are actually\
    \ converted to integers when they are stored, so you define a character using\
    \ its numeric value or a character value. Usable character numeric values are\
    \ from 32 to 127. You’ll need to Google the lookup graph to find the numeric value\
    \ that matches a character.\n\nLet’s take a look at both ways to initialize a\
    \ character.\n\n```cpp\nchar ch1(97);\nchar ch2('a');\n```\n\nBoth of these characters\
    \ are initialized with the same value. The first `ch1` character variable is initialized\
    \ in its raw numeric format. The second `ch2` variable is initialized with the\
    \ character you want to use. In this example, the character ‘a’ is used. The character\
    \ ‘a’ translates to a numeric value of 97.\n\nEven when you initialize a character\
    \ with its numeric value, the output will display its associated character value.\
    \ Let’s take a look at some sample code.\n\n```cpp\n#include <iostream>\n\nint\
    \ main()\n{\n    char ch(97);\n    std::cout << ch;\n    return 0;\n}\n```\n\n\
    In the above code, the output displayed is the character ‘a’ even though the initialization\
    \ variable is set to 97. Most programmers don’t know the numeric value that matches\
    \ a character, so they use the character initialization method. However, you might\
    \ need to know the matching character and number at one point. The best way to\
    \ work with the mapping is to Google a printout of the information.\n\nWith the\
    \ above method, you would need to create an array of characters to create a string.\
    \ Unlike `C`, `C++` makes it much easier. Instead of creating arrays, we let the\
    \ string library do it for us. We add the string library to our include statement.\n\
    \nLet’s take a look at the code.\n\n```cpp\n#include <string>\n#include <iostream>\n\
