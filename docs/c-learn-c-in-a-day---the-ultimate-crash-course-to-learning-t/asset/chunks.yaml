    \ definition. This is standard across most languages. The quote characters indicate\
    \ a string while the tick mark indicates a character definition.\n\nThe string\
    \ variable is given the name `myName` and initialized to “John.” The string library\
    \ converts this value to a character array behind the scenes, so you don’t need\
    \ to deal with any of the loops and memory allocation.\n\nFinally, the string\
    \ is printed to the string using the `cout` function we saw in chapter 1.\n\n\
    You can also define numeric values as strings. It’s not common, but it does happen\
    \ occasionally. For instance, user input is first sent as a string and then later\
    \ converted to an integer in your program. Let’s take a look at an example.\n\n\
    ```cpp\n#include <string>\n#include <iostream>\n\nint main()\n{\n    std::string\
