  md: '# Chapter Seventeen


    # Data Mart

    Maintenance


    Now that the data marts are set up, they will need ongoing maintenance to get
    the most out of your data. The first step is to establish a mart lead per mart
    who will be responsible for carrying out the maintenance tasks for each mart:


    +   - Educate team.

    - Identify issues.

    - Identify new needs.


    Mart leads are ideally part of the business unit that needs the mart. They know
    the context for the data; if Facebook ads spike in their conversion rate, they
    should be the ones who''d know “that’s because we just cut our spend in half and
    removed the nonper-forming ads.” They can communicate with the warehouse lead
    about their teams’ data needs and then communicate and educate the team using
    their mart.'
  merge: -1
  pgno: 208
- img_proc: true
  md: 'They are responsible for identifying issues in the data that exist in their
    mart. They also should be the ones creating requests to get more data sources
    or tables added to their mart. They also should be part of the workflow/ticket
    system and be able to teach others and maybe even respond themselves to tickets/data
    requests.


    # Educate Team


    Different teams have different needs, but some common threads including SQL skills
    or how to use your BI tool. We wrote a book on how to teach SQL to help with explaining
    JOINS, aggregations, and subqueries work. These concepts are not intuitive to
    most business users; however, they can be taught in relatively short time frame.


    Mart leads should document and share data quirks that show up in common queries.
    Note, however, the warehouse lead should address these quirks with modeling at
    the data warehouse stage.


    # Identifies Issues


    The mart lead should investigate anything counterintuitive about the data and
    then, based on their findings, relay back to the warehouse lead to get the issue
    addressed.


    # Spikes


    When metrics spike above or below their average, investigate the data and potential
    causal factors. When looking at the data, segmenting it in different ways to see
    if there is a common factor in what drove it up. Determining potential causal
    factors can be more difficult. Check for bugs in your tracking, check with marketing
    to see if any new campaigns were launched, and check third-party tools/systems
    (Google search algorithm, an API is down, etc.) that could affect this metric
    (Figure 17.1).'
