  md: '# Second Attempt—Operational Schema (Source Agnostic)


    familiar and the source prefixes made it clear where data from a table was coming
    from. However, for business users or brandnew users, it was possibly more confusing
    to locate the data they were looking for. Ultimately, the goal of the SST was
    to make the data more accessible to the business users, so we still had work to
    do.


    # Second Attempt—Operational Schema (Source Agnostic)


    In this version of the SST, we would “mask” all the underlying sources the data
    was coming from and create our own brand-new schema. It’s the idea of what if
    all our tools were built in-house and weren’t coming from a variety of places.
    This means we wouldn’t be prefixing the tables with the names of the tools they
    were coming, and we would be combining data from multiple sources together into
    generic tables like “Users,” “Tickets,” and so forth. HubSpot Contacts and Salesforce
    Contacts data could also be combined into a single “Contacts” table or even be
    combined with the “Users” table.


    # What Tables Did We Keep?


    At this point, we had agreed to have a separate staging step prior to the SST.
    The staging layer looks pretty similar to the first attempt; however, all the
    underlying source data is contained in their own separate base schemas. The process
    of deciding what tables to keep is similar to the first attempt. The decision
    here was more figuring out what tables to combine and what this new schema we
    were building almost from scratch was going to look like.


    There was debate, for instance, on whether to keep the Salesforce Leads and Contacts
    tables separate. Conceptually they both contain data related to people, but operationally
    they are used in different ways and mean different things to the business. Combining
    the Leads and Contacts tables with our Chartius tables would also create one massively
    wide table with a lot of columns and null values. If we did that, what if we wanted
    to determine'
  merge: -1
  pgno: 242
- img_proc: true
  md: '# Building an SST Example


    how many of our Salesforce Contacts were also users in our application? Would
    it be as simple as a Boolean flag “is_chartio_user”? How would we join the tables
    together? Does it make sense to combine our application “Organizations” table
    with the Salesforce “Accounts” table?


    We had to think through the implications of these decisions how the columns and
    fields are treated differently in each source. One instance of this is that in
    our application, a user can belong to multiple organizations, whereas in Salesforce
    that user would exist as separate contacts for each of the associated accounts.
    We would either have to be fine with having duplicate records in this Users/Contacts
    table, or select one of the user records and drop the others (Table 21.1).


    TABLE 21.1 Duplicate Records by Email


    | User Id | Email | SFDC Contact Id |

    | --- | --- | --- |

    | 214587 | burt.smith@chartio.com | 0031M00002mb10U |

    | 214587 | burt.smith@chartio.com | 0031M00003ha82Z |

    | User Id | Email | SFDC Contact Id |

    | 214587 | burt.smith@chartio.com | (''0031M00002mb10U'', ''0031M00003ha82Z'')
    |

    | 214587 | burt.smith@chartio.com | 0031M00002mb10U |


    # How Did We Make These Decisions?


    To determine what this new schema would look like and where it makes sense to
    combine tables together, there were many whiteboard sessions and sketching out
    diagrams on paper with key stakeholders, which included our CEO, VP of engineering,
    and VP of customer success. We thought through common use cases from users and
    how simple or complex a query would need to be in order to answer a question.'
  merge: -1
  pgno: 243
- img_proc: true
  md: '# What Was Not Ideal About It?


    In this approach, we were trying to create our own schema by "combining" the tables
    and columns of our underlying sources. But obviously since the schemas of each
    source were different, there were fields from one source that another source wouldn''t
    have, and this created very wide tables with a lot of null values. We had to figure
    out the complexities of joining tables and combining data that look totally different
    in raw form.


    To avoid confusion with the raw tables, we also had to consider how to name the
    tables. Since Salesforce already had the concepts of "Contacts" and "Leads" and
    "Users," would a combined table be called "People" or something else? A data dictionary
    would also need to be kept so people can refer to these new names.


    Creating a new schema that source agnostic also required more time to map out
    the schema and build the tables.


    # What Was the Feedback?


    Customer success members were more nervous about this approach, because as users
    already familiar with the raw tables, it would take more education to learn and
    train others on the new schema. People who were already familiar with the raw
    tables and the definitions of those tables may find this schema confusing. For
    business users, this schema would likely be more ideal as it is more business-centric
    as opposed to source- or product-centric.


    # Third Attempt—Application Separate, Other Sources Smashed


    After much discussion following up on the first attempt and operational schema,
    we settled on creating a SST that was more Chartiocentric. What that meant our
    Chartio application product data would be kept as separate tables to the rest
    of our source data, which could be considered supplementary tables. Aside from
    that, this was identical to the operational schema described in the second attempt.'
  merge: -1
  pgno: 244
- img_proc: true
  md: '# What Tables Did We Keep?


    Choosing what tables to add to the SST (similarly to the second attempt) was largely
    a decision on what tables are the most heavily used. In order not to clog up the
    SST with an extra list of tables, in the first iteration we left out tables we
    thought would only be queried or accessed. If we discovered later that users need
    some of those tables that weren''t included, we could add them.


    The process in this attempt was similar to the second attempt in that we had to
    determine the schema layout and what the tables will look like. Because we agreed
    on a Chartio-centric approach, the "Organizations" and "Users" tables from the
    Chartio database were to be separate from our "Accounts" and "Contacts" tables.
    All the supplementary data from the other sources were to be combined in larger
    tables where reasonable. We decided on a big "Interactions" table that contained
    all our ticket and customer touchpoint data, a large "Contacts" table that contained
    Salesforce Contacts and Leads data, Hubspot Contacts data, and Zend and Intercom
    data. Since we use JIRA internally, we kept the JIRA tables separate. And to create
    an easy mapping of employee ids across systems, we created an "Internal Users"
    factor table.


    # What Columns Did We Keep?


    In determining what columns to keep particularly when joining tables together,
    we had to see if columns from one source table could easily map to a column from
    another source table. For example, Zend''s "Requester Id" field could be mapped
    to Intercom''s "Author Id" field. Salesforce Contacts and Hubspot Contacts had
    a few duplicate fields we didn''t need to include both when joining the tables
    together.


    # What Was the Feedback?


    Direct feedback from our VP of engineering: "I think trying to collapse all the
    interactions and contacts into a single table is showing'
  merge: -1
  pgno: 245
- img_proc: true
  md: 'signs of weakness in its current form. It''s either too generic to be valuable,
    without enough fields, or too broad, having tons of nulls so you have to be really
    careful how you query. Totally fine letting this play out to see how things turn
    out but foresee some issues we will have to work through.


    One of our customer success managers expressed that her team often wants to know
    and track the touchpoints for our customers, but doesn''t really care about the
    channel. They want to know if we''ve been in contact with them, so it''s helpful
    to have all the information from our customers together in the Interactions table.


    Currently, usage of the SST is still rampant but as more people start using it,
    cracks have been starting to show. For example, when combining the Salesforce
    Leads and Contacts data into the generic "Contacts" table, we initially filtered
    converted leads to duplicate records. This proved unhelpful to our marketing and
    sales teams, who care about historical data from converted leads.


    # Less Planning, More Implementing


    In the old days data modelers did a lot of designing. They gathered a lot of requirements
    to determine their exact use case and created star schemas for business users.
    We now have the tools and performance to make this a more collaborative endeavor,
    where a warehouse-house lead can model and iterate based on feedback. We continue
    to iterate on our schema to suit our business needs and believe that schema design
    is an ongoing process.


    Especially after creating the staging models for the sources we use in our warehouse,
    we try many configurations of tables to see what supports analytics best. Since
    everything is layered on top of the database, it can be changed on a whim. It
    takes less pre-thinking (which is largely impossible guessing), less meetings,
    less restructuring, less architecting, less complexity, and less repetition.'
