  md: '# Chapter Twenty


    # Style Guide Example


    Going through and creating a clean data warehouse and marts makes the data easier
    to understand for everyone. As an organization grows, more than one person will
    help clean and transform the data. There are aspects of cleaning that are subjective,
    and we need to codify what we want to happen. For example, we will want to rename
    a column to make it more readable, but we should use snake case (e.g. example_new_column)
    or camel case (e.g. ExampleNewColumn)? In the book we said snake case, but this
    is a judgment call and you could go with another convention.


    Document cleaning goals and stylistic preferences in a style guide so that we
    clean the data consistently and others can help.


    We have provided sample style guides at the end of the chapter.'
