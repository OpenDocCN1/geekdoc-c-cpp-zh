- img_proc: true
  md: '# Reading from Row Store Databases


    Row-oriented databases are fast at retrieving a row or a set of rows but, when
    performing an aggregation, they bring extra data (columns) into memory. This is
    slower than selecting the columns that are needed for the aggregation. In addition
    the number of disks the row-oriented database might need access is typically more.


    # Extra Data into Memory


    Say we want to get the sum of ages from the Facebook_Friends data. To do this
    we need to load all nine of these pieces of data into memory and then pull out
    the relevant data for the aggregation (Table 19.6).


    TABLE 19.6


    | Matt | Los Angeles | 27 | Dave | San Francisco | 30 | Tim | Oakland | 33 |


    This is wasted computing time.


    # Column-Oriented Databases


    Data warehouses were created in order to support analyzing data. These types of
    databases are read optimized.


    In a C-Store, columnar, or column-oriented database, the data is stored such that
    each row of a column will be next to other rows from that same column.


    Let''s look at the same data set again (Table 19.7) and see how it is stored in
    a column-oriented database. A table is stored one column at a time and ordered
    row by row (Table 19.8).'
  merge: -1
  pgno: 221
- img_proc: true
