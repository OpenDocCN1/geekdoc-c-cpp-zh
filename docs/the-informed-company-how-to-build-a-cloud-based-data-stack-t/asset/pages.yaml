  md: '# Chapter Two


    # # The Need to Replicate Source Data


    Each query, whether it’s sent through a business intelligence tool, a SQL workbench,
    or something similar, requests data from a source. It takes technical resources,
    time, and computing energy to serve queries. This is especially relevant when
    running queries “against” a “production database” (see Figure 2.1), as too many
    queries, especially ones that take a long time to run, can bog down machinery
    (and don’t forget how cluttered dashboards can cause many queries to run at once).


    ![](img/07b10ae3f84ebfc0356cf70f4bf08c9e_48_0.png)


    # Production Systems


    A production system is any system that serves critical business functions to users.
    An example of a production database system is one that powers an application for
    users to buy this book'
  merge: -1
  pgno: 48
- img_proc: true
  md: '# The Need to Replicate Source Data


    ![](img/07b10ae3f84ebfc0356cf70f4bf08c9e_49_0.png)


    on the internet and handles credit card transactions. We advise against querying
    data directly from production systems due to its potential ability to interfere
    with your live application.


    Newer businesses investigating their internal data to draw from live, or production,
    systems. In other words, they run analysis-type queries directly on their data
    sources. While this is okay for tools like Salesforce or Google Analytics, mainly
    because querying doesn''t impact their performance at all, the same can''t be
    said about on-premises or even cloud-hosted production systems.


    Querying data on a production system carries the following risks:


    +   - Slowing the performance for all users and applications.

    - Accidental data loss.

    - Lowered system integrity.


    We can mitigate these risks by creating a copy of the production system and only
    providing read-level access to those who are trying to analyze it (Figure 2.2).


    # Replicate Sources


    We heartily suggest copying mission-critical data sources into copies with read-only
    access. All analysis queries should be run against those copies, or “replicas,”
    as opposed to directly on production systems. For each replica created, access
    should be revoked from the original'
  merge: -1
  pgno: 49
- img_proc: true
  md: '![](img/07b10ae3f84ebfc0356cf70f4bf08c9e_50_0.png)


    Figure 2.2 A cloned data source with read-only access.


    source database. Grant access to the replica instead, so that relevant users within
    your organization can query the replica. Likewise, have visualizers talk to replica
    tables rather than product systems.


    This read-only stand-in protects databases so they are not violated by a mistaken
    INSERT or bogged down with frequent SELECT requests. It may seem excessive at
    first glance because of the indirection, but this removes another point of failure
    in your business''s application. We concede that although creating a read-only
    replica is straightforward for cloud providers with hosted databases like RDS,
    it can be challenging with other platforms. we acknowledge that databases may
    double the costs of storing data, but they remove the risk of an analytic query
    affecting an application. It may be equally frustrating to experience a time delay
    between the transactions in your production database and transfer of those new
    records to the replica.


    But again, no company wants to find itself with their central product, whether
    it''s an e-commerce site or a patient scheduling system, crashing every time a
    dashboard is opened due to database conflicts (Figure 2.3). Moreover, the need
    for this has spurred cloud providers to improve the ease with which replicated
    tables can be created and automated.'
  merge: -1
  pgno: 50
- img_proc: true
  md: '![](img/07b10ae3f84ebfc0356cf70f4bf08c9e_51_0.png)


    # Create Read-Only Access


    Now that users have access to the replica, make sure they only have read-only
    access. This limits their interaction with the database to only be able to retrieve
    data, not to manipulate it. This will prevent a user from accidentally deleting,
    updating, or adding any data. The ability to manipulate the actual data on the
    database should be reserved for engineers.'
