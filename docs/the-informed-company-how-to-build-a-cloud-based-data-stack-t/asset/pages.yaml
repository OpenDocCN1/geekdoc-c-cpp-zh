  md: '# Other Staging Modeling Considerations


    absence of a value). What these values stand for can be anything from a missing
    value, an unknown result, an error, and so on. Your team decides and manages a
    NULL value (or one of its look-alikes) indicates.


    Because so much business logic can hinge on the meaning of a NULL value in a field,
    we recommended refrained from replacing NULL fields anytime there''s a need to
    distinguish between an unknown value versus a blank value, or the absence of a
    value. In today''s SQL workenches, it''s very obvious that a field is NULL, whereas
    an empty string may not appear to be the same as a field of whitespace. To a human,
    there''s not too much difference between a true NULL and a string like "null."
    Warehouses, on the other hand, will treat these very differently for purposes
    of aggregation and implicit type inference. There are, however, exceptions to
    this guideline. The right course of action is to assess what your business needs
    are and avoid the caveats involved with forging a true NULL value.


    # Ways of Replacing Nulls


    # String Values


    As mentioned, frequent string replacements for NULLs are "N/A," "Unknown," or
    "." Using human-readable values can make creating data easier, especially when
    grouping by this type of field. Otherwise, it may not be apparent if the null
    is a mistake or if it is intentional. However, this is usually done in report
    models or other "downstream" tables. Sometimes, transformations like these are
    done in business intelligence tools.


    Note that by replacing a NULL in a field you will impact aggregations such as
    COUNT. If you do count DISTINCT on a column that had Stated in, you will get 51
    instead of 50 if there are any missing values.


    # Numbers


    Numbers are trickier to replace since they directly affect statistics, and NULLs
    are typically interpreted correctly by SQL aggregations. Sometimes, it is appropriate
    to replace with 0 when going to visualize data, especially for a line chart over
    time.'
