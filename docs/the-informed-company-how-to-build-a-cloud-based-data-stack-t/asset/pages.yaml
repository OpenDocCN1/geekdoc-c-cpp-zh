- img_proc: true
  md: "# Simplify\n\nIt's quite common for raw data to be extremely complicated. When\
    \ data comes into existence, in most cases, it's intended to be used by applications\
    \ and not directly by business users. Taking time to simplify data significantly\
    \ improves the ability for business users to successfully query it.\n\n# Only\
    \ Include Fields That Have an Apparent Analytical Purpose\n\nIf your system makes\
    \ it easy to update/add new columns, it's best to start modeling with only the\
    \ most relevant columns, excluding any columns that have no direct or analytical\
    \ purpose.\n\n# Extract Relevant Data from Complex Data Tpes\n\nApplication data\
    \ sources may contain JSON, arrays, Hstore, and other complex data types. These\
    \ are typically hard to query from business intelligence tools in their raw form.\
    \ However, relevant data can be extracted into new columns, which can be queried\
    \ efficiently.\n\nSuppose a table named books contains an id column and the following\
    \ JSON column:\n\n```\n{\n  \"title\": \"Moby Dick\",\n  \"author\": \"Herman\
    \ Melville\",\n  \"genres\": [\"novel\", \"fiction\"]\n}\n```\n\nThe resulting\
    \ modeled books table would contain an id, title, and author columns. Genres could\
    \ be modeled as an independent table, reduced to a single genre based on custom\
    \ rules or some other method.\n\n# Change Flags and Cryptic Abbreviations to Meaningful\
    \ Values\n\nIt's common for application databases to have flags or cryptic abbreviations\
    \ in columns that work well for an application to reference."
  merge: -1
  pgno: 229
- img_proc: true
  md: 'These can be impossible for a business user to interpret. It''s essential to
    transform these values into natural, human-readable values, for example:


    Transform Boolean values 0 and 1 to relevant strings, such as true and false on
    or off.


    Change Boolean field names to be descriptive and start with is_ or has_. It is
    challenging to interpret Boolean field names when they are ambiguous, such as
    "inactive," "subscribed," or "paid."


    Transform flag values into relevant strings by joining to a dimension or remapping
    the data. Avoiding the same "case when" statement in multiple places. If a column
    billing_status has three discrete values (i.e. 0, 1, 2) that represent some status,
    transform them into a relevant business concept such as "Active," "Not Active,"
    or "Delinquent."


    Transform hard-to-interpret values into easy-to-understand values.


    # Denormalize Where Beneficial


    Applications typically have highly normalized tables to prevent duplicate records,
    and make modifications easier. Excessive normalization typically makes it harder
    for business users to browse the schema, usually due to the complexity of the
    joins. Building wider tables wherever appropriate and collapsing common concepts
    into a single table help to reduce excessive joins. Examples include:


    +   Combine the sources, redshift, sources_postgres, and sources_mysql tables
    into a single source table with the lowest common denominator of values that make
    sense for a business user.


    +   Combine the users and addresses into a single users table since addresses
    are meaningless on their own.'
  merge: -1
  pgno: 230
- img_proc: true
  md: '# Style Guide Example


    Denormalization requires trial and error and takes time to get it right.


    # Clean


    Data is messy and frequently requires cleaning to ensure accurate results. Cleaning
    prevents common problems that might cause a query to produce incorrect results.


    # Attempt to Eliminate NULLs


    NULL values have unexpected consequences in SQL (is "string" <> NULL?). It’s best
    to replace NULLs with values. Some examples:


    +   - Change all NULL values in the first_name column to the string Blank.

    - Change all NULL values in the last_login_type column to the string Never Logged
    In for customers that have never logged in.


    # Fix Common Data Inconsistencies


    Bad data always makes its way into raw data sources. Whether it is missspellings
    or junk data, it is essential to clean up the data as much as possible. Some examples:


    Transform state names that have a mix of abbreviations, full names, and junk data
    into a single, consistent format such as the full state name.


    Phone numbers might be garbage text entered by users to avoid getting phone calls.'
  merge: -1
  pgno: 231
- img_proc: true
  md: '# Remove Irrelevant Data


    Rows that are irrelevant for various reasons should be removed entirely from the
    data set. Examples include:


    +   * Employee testing

    * Fraud or spam

    * Inactive


    The exception is when analyzing fraud or spam data (given the above examples),
    but in most cases, rows that are never present from a query can be removed during
    modeling.


    # Standardize Data Types


    Modeling is a great time to change data types to more appropriate types. Unix
    timestamps could be converted from int columns to datetime, for example.


    # Naming Conventions


    There are a variety of naming conventions used for tables, columns, and values.
    Creating a standard for schema resources improves the usability for others to
    find and understand the data they need.


    # Plural Table Names


    Pluralization of table names creates an easy-to-identify distinction from columns
    and other schema resources when communicating. For example, change the title of
    a table of leads named “Lead” to “Leads.” When there are more than two words,
    only pluralize the last word: opportunity_histories.'
  merge: -1
  pgno: 232
- img_proc: true
  md: '# Singular Column Names


    A column name such as “emails” should be titled “email,” not “emails.” Singular
    names make it easy to distinguish between tables and columns.


    # id as Primary Key


    A simple numeric primary key labeled “id” is the standard for all tables. The
    “id” convention uniquely identifies the primary keys and each row:


    ```

    foreign keys follow [tablename]_[id]

    ```


    Foreign keys should follow this format to make the relationships to other tables
    very clear. If there are foreign keys related to the same table, prepend a name
    to them following the format:


    ```

    \[uniquename\]\\[tablename\]\_[id].

    ```


    An accounts table linking to a users table with both a billing contact and a main
    owner would look like this:


    ```

    owner_user_id

    Billing_contact_user_id

    ```


    # Lowercase, Underscored Naming


    The data model needs to be easily editable with SQL, avoiding the shift key allows
    faster development of queries. Therefore, we should have column names like id,
    first_name, last_name, and last_login_type instead of more human-readable forms
    in the model. In addition, spaced names such as first name, last name, and last
    login type will break the SQL code. Use underscores for any spaces between words.'
  merge: -1
