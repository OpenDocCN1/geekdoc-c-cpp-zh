  md: '# Chapter Three


    # Source Data

    Best Practices


    After establishing an SQL-based BI tool to blend and analyze data, there are some
    best practices to keep in mind to support other people using the data. It''s not
    crucial to spend too much time modeling or cleaning data at this point, but giving
    some direction can be invaluable at this stage.


    # Keep a Complexity Wiki Page


    Data is inherently messy at the source stage and will be difficult for everyone
    to gain experience with use. Since the amount of data sources is small, it is
    prudent to create a document or wiki page with warnings about known problems so
    others can navigate the data themselves.'
  merge: -1
