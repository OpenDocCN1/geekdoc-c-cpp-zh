    # TABLE 19.8


    | Matt | Dave | Tim | Los Angeles | San Francisco | Oakland | 27 | 30 | 33 |


    # Writing to a Column Store Databases


    If we want to add a new record (Table 19.9), we have to navigate around the data
    to plug each column into where it should be (Table 19.10), which is not as efficient
    as a row-oriented database.


    # TABLE 19.9


    | Jen | Vancouver | 30 |


    # TABLE 19.10


    | Matt | Dave | Tim | Los Angeles | San Francisco | Oakland | Vancouver | 27 |
    30 | 33 |


    # Reading from a Column Store Database


    To get the sum of the ages, the computer only needs to go to one disk (Disk 3)
    and sum all the values inside of it. No extra memory needs to be pulled in, and
    it accesses a minimal number of disks.


    While this is a slight oversimplification, it illustrates that organizing data
    by column the number of disks that will need to be visited'
  merge: -1
  pgno: 222
- img_proc: true
  md: 'will be reduced and the amount of extra data that has to be held in memory
    minimized. This greatly increases the overall speed of the computation.


    There are other ways in which a column-oriented database can get more performance.


    # Coding the Data into More Compact Forms


    Let''s first examine an encoding technique that can be used by row- or column-oriented
    databases. Take, for example, a column of data with the individual states of the
    United States. We can use dictionary and bitmap encodings:


    +   - There are 50 states, so we could encode the whole database with 6 bits since
    this would provide us 64 unique patterns.


    +   - To store the actual abbreviations would require 16 bits this would provide
    us with 256 unique patterns for each of the two ASCII characters.


    +   - Worst of all, if we stored the full name, the lengths would be variable,
    and the amount of bits needed would be a lot more.


    Now let''s take a look at Run-length encoding. This allows replacement of any
    sequence of the same value with a count and value indicator. For, we can replace
    aaaab with 4a1b. This becomes even more powerful when creating projections with
    columns that are sorted all values that are the same next to each other.


    # Compressing the Data


    If each piece of data is the same number of bits long, then all of the data can
    be further compressed to be the number of pieces of data times that number of
    bits for a single piece of data.'
  merge: -1
