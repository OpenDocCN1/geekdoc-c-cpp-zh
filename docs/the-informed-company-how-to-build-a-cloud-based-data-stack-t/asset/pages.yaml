    # Hashing


    Hashing is the process of inputting any string or getting back a consistently
    long string that is random and called a hash. Incrementing the original number
    or changing one letter in the string should produce a hash that is completely
    unrelated to the previous one.


    For example:


    ```

    abc -> hash function -> deia8f9e

    ab -> hash function -> 32131mo

    ```


    Then users can create summary tables where sensitive metrics, like financial data,
