  md: "# Staging Schemas\n\n```\nSELECT\nid,\n-- external_id, -- unused\nName,\nDisplay\
    \ Name,\nCASE\n    WHEN Location = \"United States\" THEN \"USA\"\n    WHEN Location\
    \ = \"US\" THEN \"USA\"\n    WHEN Location = \"US of A\" THEN \"USA\"\n    ELSE\
    \ Location\nEND AS country,\naccess.\"type\" AS access_level,\n--type -- replaced\
    \ by access_level\nCASE\n    WHEN Info = \"%active\" THEN True\n    WHEN Info\
    \ = \"%inactive\" THEN False\nEND AS is_active,\nis_deleted\nFROM\napp.Users\n\
    JOIN\napp.access\nON\nUsers.type = access.id\n```\n\nWildcards allow you to search\
    \ and locate specific sequences of characters that match a pattern. Wildcards\
    \ let you define a pattern using comparators and metacharacters. The most commonly\
    \ used metacharacter is %, which means it will match any string. So in the example\
    \ above %active will match with a value that ends with active such as 123active,\
    \ ABCactive, and even just active.\n\n# Decide What to Do about Null Fields\n\n\
    Unstructured data often have NULL values. Well, technically NULL isn't a value.\
    \ In the SQL specification, NULL is defined as"
