  md: '# Chapter Seven


    # Data Lake Security


    Besides making data querying easier, data lakes in fact lead to better security
    outcomes. Without a unified data store, all analysis occurs in many different
    places. These far-flung data sources require individual logins, which are hard
    to track and maintain the appropriate levels of access. It can be hard to redact
    sensitive information that should not be used in company analytics. In other words,
    different sources of data are hard to manage.


    With all the data in one spot and in one common engine, a data lake makes managing
    permissions much simpler. Common warehouse solutions come with power IAM management
    tools in ordinary database security features.


    Likewise, data coming into the data lake is likely not clean, so sensitive information
    may still exist. A data lake gives your security specialists fine control over
    what data can and cannot be accessed.


    Avoid extracting or loading sensitive data/columns; instead, configure these items
    within the ELT tools. Also, be mindful of who can'
