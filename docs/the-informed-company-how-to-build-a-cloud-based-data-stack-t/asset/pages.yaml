- img_proc: true
  md: '# Ordering the Data


    When doing ad-hoc queries, there are a number of different sort orders of the
    data that would improve performance. For instance, we might want data listed by
    date, both ascending and descending. We might be looking for a lot of data on
    a single customer, so ordering by customer could improve performance.


    In row-oriented databases, indexes can be created but data is rarely stored in
    multiple sort orders. However, in column-oriented databases the data can be stored
    in an arbitrary number of ways. In fact, there are benefits beyond query performance.
    These different sort-ordered columns are referred to as projections, and they
    allow the system to be more fault tolerant, since the data is stored multiple
    times (Table 19,11).


    TABLE 19.11


    | Original Database (WS) | Name Ordered ASC (RS) | Name Ordered DESC (RS) |

    | --- | --- | --- |

    | Disk 1 | Disk 1 | Disk 1 |

    | Name | Name | Name |

    | Matt | Dave | Tim | Dave | Matt | Tim | Tim | Matt | Dave |

    | Disk 2 | Disk 2 | Disk 2 |

    | City | City | City |

    | Los Angeles San Francisco Oakland San Francisco San Los Angeles Oakland San
    Francisco |

    | Disk 3 | Disk 3 | Disk 3 |

    | Age | Age | Age |

    | 27 30 33 | 30 27 33 | 27 30 |'
  merge: -1
  pgno: 224
- img_proc: true
  md: 'This seems like a complicated set of tables to update, and it is. This is why
    the architecture of a C-store database has a writeable store (WS) and a read-optimized
    store (RS). The writable store has the data sorted in the order it was added to
    make adding data into easier. We can easily append the relevant fields to our
    database as seen in Table 19.12.


    # TABLE 19.12


    | Original Database (WS) | |

    |---|---|

    | Disk 1 | |

    | Name | |

    | Matt | Dave | Tim | Jen |

    | Disk 2 | |

    | Los Angeles | San Francisco | Oakland | Vancouver |

    | Disk 3 | |

    | Age | |

    | 27 | 30 | 33 | 30 |


    Then the read-optimized store can have multiple projections. It then has a tuple
    mover that manages the relevant updates from the WS to the RS. It has to navigate
    the multiple projections and insert the data in the proper places (Table 19.13).


    This architecture means that while the data is being updated from the WS to the
    RS, the partially added data must be ignored by queries to the RS until the update
    is complete.'
