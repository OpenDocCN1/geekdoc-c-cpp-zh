  md: '# Make Readable Views


    In a data lake, the schema reflects the transactional logic of an application
    and follows best practices (such as the third normal form) so that updating values
    do not produce errors. The data lake schema can be difficult to navigate because
    table conventions are inconsistent and there are many tables not needed for analysis
    within the schema.


    # Third Normal Form (3NF) and Normalized data


    Standards of database structures that minimize redundancies with data integrity
    in mind are described by 11 principles called “normal forms.” The more you minimize
    the redundancies the more you normalize the data. Most databases are built in
    third normal form, which says that each row in a table must be able to be uniquely
    identified, given the values of columns When data cannot follow the third normal
    form, it’s better to break it into more tables.


    Traditional books recommend using dimensional modeling to create star schemas
    to make tables easier for analysis and to enhance performance. However, due to
    advances in BI tools and other data warehouse technologies, dimensional modeling
    is no longer the only or even best way because visualization products now support
    querying more complex schemas (Figure 9.2).


    ![](img/07b10ae3f84ebfc0356cf70f4bf08c9e_114_0.png)


    Figure 9.2 A view is an SQL abstraction on top of underlying data.'
