  md: "# Extract Fields from Structured Columns (JSON)\n\nAnother common query hurdle\
    \ arises from the format of the data itself. For example, data is often stored\
    \ as JSON, which is fairly readable due to its hierarchical structure, especially\
    \ to machines.\n\nIn our example, the Info column contains structured data. In\
    \ our record has this value for the Info field:\n\n```\n{\n  groups: [\"Admin\"\
    ,\"R&D\"],\n  title: \"Director of R&D\",\n  status: \"active\"\n};\n```\n\nOnly\
    \ the subfield status happens to hold any significance to your analysis. Here's\
    \ the bad news: SQL was not originally designed to interface directly with JSON,\
    \ and some database management systems continue to lack \"native\" support for\
    \ handling structured data. Additional processing is required either using regexes\
    \ or helper scripts. This is a reminder that part of selecting the right warehouse\
    \ engine is knowing which one has the toolset you need for your analysis.\n\n\
    # Extract Data Using Wildcards\n\nSometimes data is formatted consistently (or\
    \ semi-consistently) within a column, but the values themselves are still not\
    \ in a ready-to-use format. This can happen especially when the values in a column\
    \ are set automatically by (automated) application code. Often, junk characters\
    \ complicate fields. Using CASE statements and a wildcard or two can help you\
    \ clean up or modify those values. Let's apply wildcards to extract the status\
    \ from the info field. Since we know what the status types are, we can search\
    \ for those directly:"
  merge: -1
