  md: '# Warehouse Stage Overview


    The data warehouse is created by layering views on top of your data lake in order
    to make the data easier for everyone to use and understand. This is a powerful
    abstraction that makes manage-able to deal with the growing and changing data
    sources that your business relies upon. Let''s first imagine the best-case scenario
    of what a data warehouse would look like as part of a data stack.


    # ZenHubInterAppForceDB


    Imagine a single, comprehensive, and organized database runs your company''s integrated
    suite of production and third-party SaaS applications. The data is clearly labeled,
    and it has been organized in a way that makes querying and exploration simple,
    not just for you but really anyone on the team. There is no dupli-cate information,
    silos, or zombie data, the tables that no longer have a purpose but keep hanging
    around. All of your applications work on it.


    We sometimes call this dream ZenHubInterAppForceDB (Figure P.1), as it would contain
    and do everything that all of those applications could.


    Unfortunately, this ideal is impractical today. Companies run on dozens or hundreds
    of different applications, each with their own data structures storing information
    that often needs to be tied together from different places, stored in different
    formats, and accessed through different APIs or languages.


    While the ideal ZenHubInterAppForceDB does not exist, joining data and modeling
    it on top of our data lake get us data that looks like it! We can create iteratively
    through layering views on top of the data lake. As we model the data, the single
    source of truth emerges.


    Instead of having data from different platforms smushed together into haphazard
    schemas that comprise a data lake, this single source'
  merge: -1
  pgno: 107
- img_proc: true
  md: '![](img/07b10ae3f84ebfc0356cf70f4bf08c9e_108_0.png)


    of truth, carefully sanitized, combined, and transformed, scrubs away the inconsistencies
    in disparate source tables (Figure P.2). The single source of truth is an easy-to-query
    set of tables that encode business logic. And it is this that a company calls
    their data warehouse (or single source of truth, commonly abbreviated as SST).


    In a single source of truth, data has already been cleaned and organized, which
    is more accessible both to the company analysts and the rest of your team. A cutting-edge
    warehouse empowers everyone from data pros to data-adjacent stakeholders to query
    more quickly and confidently and with fewer mistakes. Data transformations are
    permanent and represented in code, so that they are visible to anyone interested.
    Among other benefits, your data team will be able to train new people faster,
    work more effectively, make'
