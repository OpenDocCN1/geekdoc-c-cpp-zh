    access.\"type\" AS access_level,\n  --type--replaced by access_level\nInfo,\n\
    is_deleted\nFROM\napp.Users\nJOIN\napp.access\nON\nUsers.type = access.id\n```\n\
    \nIf you have the table with spelled out values, use the JOIN approach. Using\
