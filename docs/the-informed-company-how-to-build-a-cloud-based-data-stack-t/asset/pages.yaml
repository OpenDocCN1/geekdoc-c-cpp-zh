- img_proc: true
  md: '# Source Data Best Practices


    Here are common data problems to document:


    +   - Descriptions of poorly named columns and tables.

    - Columns with nulls or mostly useless data.

    - Business logic.

    - Complex or confusing join paths.

    - Old or unused columns and tables.


    # Snippet Dictionary


    Another useful document to keep is a dictionary of base queries or SQL snippets
    for standard metrics (Figure 3.1). When working with unmodeled data, it’s common
    to repeat a lot of the same filters and joins. It’s helpful to conveniently copy
    paste/snippets when needed, rather than recreate each they’re needed.


    These can be stored on a wiki, an SQL file, or even as a dashboard of these queries
    saved as charts. With the right BI product, the dashboard method is ideal, because
    these snippets are available as starter charts that can be easily duplicated and
    adjusted.


    ![](img/07b10ae3f84ebfc0356cf70f4bf08c9e_53_0.png)


    ```

    scratch.sql

    -- Total count of users in Chartio that aren''t Chartio emp

    select count(*)

    from public.users

    where users.email like ''%@chartio.com''


    -- Total count of paying customers

    select count(*)

    from public.customers

    from customers

    where customers.started_paying_at_date is not null


    -- Total active unique reports

    select count(distinct report.id)

    from public.report

    where report.deleted_at_date is null

    ```


    Figure 3.1 Using an SQL file in an editor to manage dashboard metrics.

    Source: Chartio Atom'
  merge: -1
  pgno: 53
- img_proc: true
  md: 'Along with the snippets, it is a best practice to add comments describing the
    calculation of any metric. These snippets and comments are a good starting point
    for data models at the warehouse stage of agile data organization.


    # Use a BI Product


    Modern BI products allow a user to conduct light modeling of the data at the BI
    layer. They contain schema editors that enable users to quickly rename fields,
    hide columns, specify join paths, and create custom columns or tables. While these
    small changes are easy to do if a lot of changes are necessary, consider moving
    all the way forward to the warehouse stage where modeling can be universally applied
    and leveraged.


    In addition to SQL access, some BI products with drag-and-drop data explorers,
    such as Tableau Desktop or Chartio’s Visual SQL (Figure 3,2), handle SQL writing
    automatically. This is especially useful for teams who are still getting their
    feet wet with writing raw SQL. Visual interfaces handle changing data format strings,
    join paths, new groupings, and unique dialects, all of this saving the new team
    precious time spent googling and debugging.


    At the data source stage, it’s possible to dealing with sources in multiple SQL
    dialects and a few different APIs. One of the most significant benefits of these
    visual interfaces is that they operate in the same way, regardless of the source,
    and that they write the correctly formed SQL.


    These interfaces continue to be useful even after the data team has cleaned data
    into a lake and set up a warehouse, as others in the company can use these sorts
    of tools to explore data and self-serve data insights.'
