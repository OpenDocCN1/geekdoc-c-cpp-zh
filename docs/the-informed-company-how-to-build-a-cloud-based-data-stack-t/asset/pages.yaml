  md: '# Staging Schemas


    # Date and Time


    Standardizing time columns is critical to empowering self-serve data use. As teams
    spread across time zones and transitions, having more remote employees, using
    Coordinated Universal Time (UTC) format makes date and time data more flexible
    for them. While using UTC may be confusing to query at first since most people
    do not live within this time zone, it keeps the company consistent at the database
    level.


    # UTC


    Coordinated Universal Time (UTC) is a standard that is time zone agnostic; it
    is sometimes referred to as Greenwich Mean Time (GMT). UTC defines the precise
    time relative to mean solar time at 0° longitude without any adjustments concerning
    Daylight Saving Time. You can convert one time zone to another by subtracting
    hours based on what time zone you are in. For instance, Pacific Standard Time
    is 8 hours behind UTC, so if it is 11am in UTC, it is 3am in PST.


    Storing time data as UTC means that all records are encoded with a standard time
    zone, so everyone uses the same time value. Then on top of the database in your
    BI tool you can update how it interprets the date/time data to fit your analysis.
    Those values can be localized to whatever local time zone is necessary for a query
    or report.


    Recommended practices:


    +   - Convert all non-UTC date and time columns to UTC.

    - Update BI tools to query based on the business''s preferred time zone.

    - Use a function like CONVERT_TIMEZONE to localize date and time values to a relative
    time zone.'
