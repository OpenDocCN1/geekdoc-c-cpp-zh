  md: '# Organizing Files


    To model data with dbt, we need a series of SQL-type files (here-after, .sql)
    dbt keeps things organized YAML-type (hereafter, .yaml) files.


    # YAML


    YAML stands for "YAML Ain''t Markup Language." YAML file extensions are either
    .yml or .yaml. These files are often used for configuring an application: setting
    values for names, versions, and ways for files to interact with each other.


    Now configuration with code might sound scary, but it is actually quite easy to
    read and use. Plus dbt autogenerates a starting template for us (Figure 11.1).


    # Macros


    When we have complex case statements, they can be difficult to maintain and hard
    to read. dbt lets us use the templating language Jinja to write macros. These
    functions wrap SQL in conditional for-loops and other control-flow logic.


    # Jinja


    Jinja is a pythonic templating language, so it works how you would expect something
    in python to work. Jinja lets you set local and global variables, work with more
    complex data types like arrays and dictionaries, build loops, and much more. dbt
    uses it to generate SQL and documentation for a dbt project.


    Note that Jinja can only craft SQL. In other words, it helps with conditional
    code generation.'
