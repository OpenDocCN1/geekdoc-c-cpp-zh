  md: '# Chapter Thirteen


    # Implementing the Data Warehouse


    Remember, staging schemas hold transformations that build on top of the data sources
    residing in a data lake. In general, different sources track the same events or
    users in different ways and places. To get the most use of our company data, it''s
    useful to combine these different sources into new tables that make future analyses
    simple and straightforward to write. After all, there''s no need for a team to
    reference multiple staging tables containing user information in dozens of queries
    or models when an intermediate staging model could be built on top of the basic
    transformations we''ve so far completed to unite the user data.


