  md: '# Staging Schemas Make Source Changes Easy


    While we are relying on out-of-the-box tools like Fivetran to consistently pull
    in data from our various data sources, there are still times when the data sources
    change what they are providing. With a staging schema, it makes accommodating
    this simple. We can update small portions of the query for the view without affecting
    downstream views that they rely on.


    For example, someone may have changed a field name in Salesforce from SL to Sales
    Qualified Lead. I can update my staging view from this:


    ```

    SELECT

    SL AS sales_qualified_lead

    FROM

    salesforce.user

    ```


    To the new column name aliased in from salesforce:


    ```

    SELECT

    "Sales Qualified Lead" AS sales_qualified_lead

    FROM

    Salesforce.user

    ```


    Since my field was already aliased, all of my downstream tables built on top will
    not break and do not need to be updated.


    # Deprecate Old Schemas


    Now that we have layered on views and created a new schema for SST, we should
    discourage using source schemas and interim staging schemas in our BI tool? However,
    it can be helpful to maintain the ability to access old and unused data sources
    from a data lake in a warehouse when debugging or finding new modeling opportunities.
    Label the data sources as “deprecated” or “approved” to make it clear to users
    in the BI tool which data they should use for their analysis (Figure 15.4).'
