  md: '# Tuning to Optimize


    As a company grows, the data that is queried changes, too. New data, new analysts,
    and new business objectives will shift what data is being queried. The original
    structure of Data Warehouse objects may need to be reconfigured to optimize usage
    and performance based on how it is queried.


    Different data warehouses will have options to check performance, but most offer
    ways to:


    +   - Scale up the cluster.

    - Materialize expensive views.


    # Add Clusters


    The fastest way to get more performance is to simply add clusters to the warehouse
    engine. Many have settings that allow for automatically adding additional clusters
    if there are many concurrent queries taking place. For others, you may need to
    specify exactly how many clusters to spin up for your instance.


    ![](img/07b10ae3f84ebfc0356cf70f4bf08c9e_193_0.png)


    A cluster is the compute resource for a data warehouse engine. It can have several
    nodes that coordinate the computation needed. Many can be used to perform aggregations
    for multiple people at the same time.


    # Materialize Expensive Views


    Creating the single source of truth helps users unfamiliar with the structure
    of the data by consolidating what they need to query to'
  merge: -1
