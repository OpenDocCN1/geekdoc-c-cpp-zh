  md: "# Uniqueness\n\nFor id fields, emails, and other fields that should be unique\
    \ set up a test by writing a uniqueness test in dbt. This test checks that all\
    \ the values in the specified column do not have any duplicates. All dbt tests\
    \ go in the *.yml files that define the sources and models of your dbt project.\
    \ More information may be found in dbt's Testing documentation.\n\n```\nmodels:\n\
    \  name: users\n  columns:\n    name: id\n  tests:\n    - unique\n```\n\n# Not\
    \ Null\n\nFor id fields, date fields, Booleans, and key fields within a table\
    \ write a test to ensure the columns have no null values. If there are non-null\
    \ values found in the column, then the test will not pass.\n\n```\nmodels:\n \
    \ name: users\n  columns:\n    name: id\n  tests:\n    - unique\n    - not_null\n\
    ```\n\nA good rule of thumb is that all primary key columns have the uniqueness\
    \ and not null tests to ensure the proper grain and granularity."
