- img_proc: true
  md: '![](img/07b10ae3f84ebfc0356cf70f4bf08c9e_58_0.png)


    Figure 3.5 The book cover for How to Design a Dashboard, by Matt David.


    When creating key dashboards that need continuous monitoring, first spend some
    time with pen and paper outlining the most valuable charts and metrics. Brief
    sketches save time, allowing fast iterations, and result in a considerably more
    useful dashboard. Also, during the sketching process, define who uses the dashboard,
