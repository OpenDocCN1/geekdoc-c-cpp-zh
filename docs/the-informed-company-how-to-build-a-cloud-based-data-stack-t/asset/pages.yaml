  md: '# Chapter Nineteen


    # Row- versus Column-Oriented Database


    We wanted to spend a bit of time talking about why columnar databases are more
    performant for analytics, since this will be at the center of your data stack.
    There are two ways to organize relational databases:


    +   - Row-oriented

    - Column-oriented (also known as columnar or C-store)


    Row-oriented databases are databases that organize data by record, keeping all
    of the data associated with a record next to each other in memory. Row-oriented
    databases are the traditional way of organizing data and still provide some key
    benefits for storing data quickly. They are optimized for reading and writing
    rows efficiently.'
  merge: -1
  pgno: 218
- img_proc: true
  md: '# Row- versus Column-Oriented Database


    Common row-oriented databases:


    +   - Postgres

    - MySQL


    Column-oriented databases are databases that organize data by field, keeping all
    of the data associated with a field next to each other in memory. Columnar databases
    have grown in popularity and provide performance advantages to querying data.
    They are optimized for reading and computing on columns efficiently.


    Common column-oriented databases:


    +   - Redshift

    - BigQuery

    - Snowflake


    # Row-Oriented Databases


    Traditional database management systems were created to store data. They are optimized
    to read and write a single row of data, which leads to a series of design choices,
    including having a row store architecture.


    In a row store, or row-oriented database, the data is stored by row, such that
    the first column of a row will be next to the last column of the previous row.


    For instance, let’s take the Facebook_Friends data in Table 19.1.


    TABLE 19.1 Facebook_Friends


    | Name | City | Age |

    |---|---|--|

    | Matt | Los Angeles | 27 |

    | Dave | San Francisco | 30 |

    | Tim | Oakland | 33 |'
  merge: -1
  pgno: 219
- img_proc: true
  md: 'This data would be stored on a disk in a row-oriented database and ordered
    row by row as in Table 19.2.


    TABLE 19.2


    | Matt | Los Angeles | 27 | Dave | San Francisco | 30 | Tim | Oakland | 33 |


    This allows the database to write a row quickly because all needs to be done is
    to tack on another row to the end of the data.


    # Writing to Row Store Databases


    Let''s use the data stored in a database (Table 19.3).


    TABLE 19.3


    | Matt | Los Angeles | 27 | Dave | San Francisco | 30 | Tim | Oakland | 33 |


    If we want to add a new record (Table 19.4), we can just append it to the end
    of the current data (Table 19.5).


    TABLE 19.4


    | Jen | Vancouver | 30 |


    TABLE 19.5


    | Matt | Los Angeles | 27 | Dave | San Francisco | 30 | Tim | Oakland | 33 | Jen
    | Vancouver | 30 |


    Row-oriented databases are still commonly used for Online Transaction Processing
    (OLTP) style applications since they can manage writes to the database well. However,
    another use case for databases is to analyze the data within them. Online Analytical
    Processing (OLAP) requires a database that can support ad-hoc querying. For analysis,
    row-oriented databases are slower than C-store databases.'
  merge: -1
