  md: '# Permission Tiers


    Now that the data is in one place, granting general permission is simple. However,
    specific controls should be put into place for different groups to make sure users
    are not seeing data they shouldn''t.


    Start out by creating two user groups on the data lake as follows:


    +   1. For admin and engineers (Full Access)

    2. For analysts and business users (Relevant Access)


    It''s possible to prevent the second group from accessing sensitive data in the
    data lake by limiting that group''s permissions to only relevant schemas or tables.
    We only encourage limiting data access based on sensitivity; other limitations
    may artificially restrict questions and prevent insights from being found.


    In Figure 7.2 we see engineering maintaining access to all schemas and marketing
    and success sharing almost all schemas except Salesforce, which may have sensitive
    data about potential customers or compensation.


    In general, set broad controls for ease of management. As a company grows in data
    sophistication and transitions to progressive stages, it''s easier to create and
    more refined permission settings.


