    Users, Zendesk Users, and so on.


    This schema layout was most useful and easy to use for users who were already
    familiar with the underlying tools and source data, whereas someone new to Salesforce
    or Hubspot wouldn''t necessarily know where to look for data. After all, it may
    not be clear what''s being treated as a Salesforce Task versus a Salesforce Event.


    # What Was the Feedback?


    Our customer success team and VP of engineering liked this SST layout. For data-savvy
    users and users familiar with the original source schemas, it was easy to use
    the tables we'
