  md: '# Staging Schemas


    For potentially confusing removals add an inline comment in the query like above.
    If later down the line shows why they do need this column, you can simply un-comment
    it and bring it into the model again. In some organizations they prefer to remove
    any unused code, so removing it completely from the query can work as well.


