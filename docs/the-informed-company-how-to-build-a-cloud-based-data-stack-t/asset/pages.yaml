  md: '# Keep Short Dashboards


    People tend to keep adding more and more charts to existing dashboards. This leads
    to cluttered interfaces and less accessible information to non-subject matter
    experts (Figure 3.3).


    ![](img/07b10ae3f84ebfc0356cf70f4bf08c9e_56_0.png)


    Figure 3.3 A very long dashboard.


    Usually, due to finding insights incrementally, the number of charts steadily
    increases, until the end result is a very long, disorganized dashboard running
    unique queries for each chart. Often, these queries rerun each time the dashboard
    is refreshed.


    With a large dashboard, merely opening it to see one or two of key metrics can
    kick off hundreds of queries. Generally, it''s best to organize a dashboard around
    a single question or goal and then break out multiple dashboards for follow-up
    questions and analyses (Figure 3.4).'
  merge: -1
