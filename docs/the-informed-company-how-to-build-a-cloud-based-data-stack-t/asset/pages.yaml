  md: '# Staging Schemas


    However, we can go a step further. Numeric categories are quite often foreign
    keys to a reference table with more explicit data (Figure 10.5). If those lookup
    tables are available, you can JOIN in their more explicit values instead. This
    reduces querying complexity for end users and makes fields straightforward to
    interpret.


    This alternative strategy joins two tables on the mutually shared type column.
    The lookup table version of the type value is kept in the query, whereas the id
    is commented out or omitted. In the interest of having straightforward names,
    the type column from the Access table may be renamed to access_level.


    | ID | NAME |

    |---|---|

    | 1 | Can view |

    | 2 | Can edit |

    | 3 | Can admin |


