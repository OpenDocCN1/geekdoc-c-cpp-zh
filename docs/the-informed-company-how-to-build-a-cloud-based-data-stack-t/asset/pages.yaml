  md: '# Modern versus Traditional Data Stacks: What''s Changed?


    Many things have changed in the data space that has allowed us to become less
    technologically constrained and more user-focused. The main driving forces of
    change in data are increasing volume, demand, and user base, coupled with the
    great decrease in cost.


    # Storage and Compute Continues to Drop in Price Rapidly


    Costs have been plummeting for storing and computing data. The main things driving
    down these costs are breakthroughs in both architecture and hardware over the
    past few decades.


    # Architecture


    +   - Cloud—things are cheap and easily accessed and scaled

    - C-Store—column-oriented databases

    - Massively Parallel Processing (MPP)

    - Separation of storage and compute


    # Hardware


    +   - SSD

    - Vectorized processing (GPUs) and now CPUs

    - Continued lowering of storage and compute hardware costs


    These advances have made optimizing for storage and performance not as valuable
    anymore.


    # Data Lakes Were Added to the Stack and ELT Replaced ETL


    Data lakes are a stable stopping point and much less prone to errors. Also if
    you have to redo things in the model, you don''t have to go back and extract and
    load again from those sources to get the original raw data. You''ve already got
    it. It can save big costs and time and enable flexibility.'
  merge: -1
  pgno: 215
- img_proc: true
  md: 'Also, this allows you to do the modeling in simple SQL, and makes it so job
    analysts (who are the end users of this data) can do quite well, rather than rely
    on data engineers.


    # Data Is Increasingly Democratized


    Everyone wants data in order to support their decision making. This means shifting
    the end user of data from analysts to everybody. This demand has caused an explosion
    of problem-specific data tools, and for every SaaS tool you have to spin off data
    that could be used. These additional data sources are now part of the stack, and
    the ELT process to get them to the lake is critical to making organizations data
    driven.'
  merge: -1
