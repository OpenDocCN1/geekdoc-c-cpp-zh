  md: '# Chapter Eighteenth


    # Modern versus Traditional Data Stacks:

    What’s Changed?


    What’s Changed?


    This book intentionally outlines how to create a modern stack in a straightforward
    way, but for those who’ve been in data for years, some of it may be controversial.
    Many of these strategies will be known to you, but few have been fully published.
    We want to broaden the conversation on data modeling and orient the collective
