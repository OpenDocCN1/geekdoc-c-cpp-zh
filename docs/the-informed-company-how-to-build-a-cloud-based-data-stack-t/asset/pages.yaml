  md: '20 Source Data Best Practices


    ![](img/07b10ae3f84ebfc0356cf70f4bf08c9e_57_0.png)


    Figure 3.4 A simple dashboard outline.


    # Blog Recommendation


    We believe in keeping dashboards concise yet straightforward, so they deliver
    the maximum amount of information possible. A fantastic blog post on this practice
    and more we recommend is: *Best Practice: Keep Shorter Dashboards*, by Dave Fowler:

    https://chartio.com/blog/best-practice-keep-shorter-dashboards/


    # Design Before Building


    Another common pitfall is starting a dashboard by exploring data first. Starting
    dashboard projects by only data exploration often leads to a collection of what
    seems like useful charts at first, rarely are these charts worthwhile monitoring
    daily.


    # Book Recommendation


    An excellent online book that goes over how to avoid common pitfalls related to
    designing dashboards we recommend is: *How to Design a Dashboard*, by Matt David
    (Figure 3.5):

    https://dataschool.com/how-to-design-a-dashboard/'
  merge: -1
