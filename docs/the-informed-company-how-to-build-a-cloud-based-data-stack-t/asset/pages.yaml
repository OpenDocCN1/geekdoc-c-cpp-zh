  md: 'the absence of a value. In other words, SQL engines do not tend to enforce
    that there be a value for each field in every column. Our task, as data professionals,
    is to figure out how to handle these blank/empty/nonexistent values. Why would
    this happen at all?


    Consider a new user who has not completed their profile information. For instance,
    they have not entered their first and last name. They surely have a name, though,
    so we leave the field NULL in the database. However, there are cases where NULLs
    may be produced by accident or they may need to be replaced with a value. For
    each column that could have NULLs, it''s a good idea to determine what those mean
    and correct NULLs with CASE-WHEN statements if there should never be a blank value
    in reports.


    # Filter Wanted Rows


    Occasionally rows will be marked as deprecated or were created for test purposes.
    Instead of asking them to filter these out in their queries, it is a best practice
    to filter them out in staging tables using WHERE clauses and Boolean expressions
    (i.e. expressions that produce a true or false value).


    Rows may have "Boolean flags" (columns that can only be true or false). These
    are often phrased as predicates, such as "is_active" or "is_deleted". Why would
    you need an "is_deleted" field? Sometimes, records are effectively removed from
    applications but not outright deleted. Either they are kept around for historical
    analysis, say, in case a customer requires an account deletion has second thoughts
    before the record is fully erased. In the meantime, flag fields can help sort
    out effectively "dead" records from analyses:'
  merge: -1
