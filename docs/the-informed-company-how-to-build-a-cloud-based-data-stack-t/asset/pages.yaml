    \ more programmatically with modeling tools, which we will cover in the next chapter.\n\
    \n# Common Table Expressions (WITH statements)\n\nCommon Table Expressions, or\
    \ CTEs, are queries that run prior to the main query to produce a table of data\
    \ that other queries in the same file can access. They operate in same way as\
    \ sub-queries but are often easier to read and maintain. These are begun with\
