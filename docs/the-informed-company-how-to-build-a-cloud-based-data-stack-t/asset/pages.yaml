    # SQL IDEs for modeling


    Many SQL IDEs like DataGrip help you turn SELECT * into this more verbose query
    with all the columns explicitly listed. This can save a bunch of time writing
    views for your Warehouse and Data Mart.


    Even if we were keeping the entire table, instead of a SELECT * FROM [tablename]
    query, we should write out all the columns that should be kept. This will make
    it easier to edit in the future and pre-vent columns from being added in without
    us knowing.


    # Ensure Table and Column Names Are Understandable


    Transactional schemas often have weird names that make sense to the engineer who
    built the original schema, but there''s no guarantee that knowledge will translate
    to, the data team as whole, or other departments in the company who want to self-serve
    data insights. One technique for supporting intercompany knowledge exchange is
    renaming tables and columns so that anyone, even few to the data, can have a reasonable
    chance of interpreting correctly.


    To rename a column, put the AS keyword after the column in the query and then
    put the desired name. If the desired name has a space in it, you will need to
    put it in quotes. Quoting rules can differ from warehouse engine to warehouse
    engine. We use snake case, only lowercase letters and putting an underscore where
    spaces would be, by default sidestep naming troubles:


    ```

    bad_column_name AS better_column_name

    ```


    This is called aliasing in SQL. You can also just place the desired name after
    the column; it is a stylistic choice but can make less'
