    different pricing structures, exist on and off accessible cloud infrastructures
    like AWS and GCP, scale differently, and have different maintenance requirements.


    We find that it''s best to make a decision based on:


    - Pricing

    - Ecosystem

    - Performance/Scale

    - Maintenance


    There are a variety of database pricing models, from being based on storage to
    being based on the amount of data queried. Companies that are strictly using Amazon
    or Google as their software vendors may dictate the vendor choice as well.


    The architecture of the data lake has implications on how it operations scale.
    Differences in the many types of lakes entail columnar versus row-oriented storage
    and having storage and compute together or separated. Maintenance requirements
    of a data lake may impact the decision as well.


    ## Modern Warehouse Engine Products


    Today, there are three dominant choices for cloud-based data warehouse engines:
    Amazon Redshift, Google BigQuery, and Snowflake. Note: all of these are similar
    and based on the C-Store paper.


    ## Amazon Redshift


    ### Pros


    Redshift (Figure 5.3) has the benefits of ease of use, speed, and cost. Being
    a part of AWS, there is full-service integration for the broad range of AWS services
    such as S3 for storage and Cloud-Watch for infrastructure monitoring. Redshift
    is generally cheaper


    ![](img/07b10ae3f84ebfc0356cf70f4bf08c9e_76_0.png)


    Figure 5.3


    than Snowflake or BigQuery, with a couple of pricing options such as paying hourly
    per node or paying by the number of bytes scanned with Redshift Spectrum.


    It''s simple to set up and scale by adding nodes to a cluster, increasing storage
    to gain performance. It benefits from being similar in connection and SQL syntax
    to PostgreSQL.


    ### Cons


    Users can run into concurrency issues with Redshift due to incomplete configuration
    or when there are high volumes of queries from many users accessing the database.
    Ongoing maintenance may be required with Redshift to resize clusters, define sort
    keys, and vacuum data.


    Like many AWS services, there are ways to customize a configuration with workload
    management, compression, and partitioning. However, using these advanced features
    is not very out of the box. Although Redshift is powerful, it may require a dedicated
    resource from a data engineering team to optimize performance.


    ## Vacuuming


    When deleting data from a database, it is not necessarily removed from storage
    right away. In some systems the data is “marked” rather than completely removed.
    When processing new requests, additional work is required to filter “marked” data
    during future read operations. Over time, as more “marked” data accumulates, this
    ends up impacting read performance of requests. Vacuuming is a common maintenance
    task required by some warehouse engines that deletes “marked” data, generally
    improving performance.


    ## Google BigQuery


    ### Pros


    BigQuery (Figure 5.4) is not bound by cluster capacity of storage or compute resources,
    so it scales and performs very well with increasing demands for concurrency (e.g.
    more users and queries accessing the database). As a fully managed database, BigQuery
    handles vacuums and resizing on its own, which can save time for data engineers
    and make it easy to use and maintain. For businesses using Google products, BigQuery
    integrates well with Google Drive, Google Billing, and Google Analytics.


    ### Cons


    Cost is determined per query byte, making it difficult to budget or regulate for
    users who run ad-hoc queries against their data. To keep costs from getting out
    of control from ad-hoc queries, leverage BigQuery''s cost controls. Implementing
    cost controls can restrict the amount of analysis that''s performed because it
    limits the queries that potentially run. It also has some nonstandard syntax.
    While some prefer it, it does have a learning curve and a different way of working
    with it.


    ![](img/07b10ae3f84ebfc0356cf70f4bf08c9e_77_0.png)


    Figure 5.4


    ## Snowflake


    Figure 5.5


    ### Pros


    Like BigQuery, Snowflake (Figure 5.5) has an architecture that separates the compute
    query engine from data storage. As a result, it is highly scalable at any amount
    of volume and concurrency. Pricing is based on the storage and compute used on
    a time-basis with their virtual databases instead of per bytes scanned. Tuning,
    indexes, and distribution keys aren''t required for queries to be optimized and
    performant. Because of these reasons, it can be said that Snowflake has many of
    the benefits of Redshift and BigQuery.


    ### Cons


    Snowflake is a relatively new database in the market. Those familiar with SQL
    functions supported by databases like Redshift or PostgreSQL may find some inconsistencies
    in the SQL syntax for Snowflake. Snowflake is also generally more expensive.


    ## Database Engines


    For smaller amounts of data, less than 10GB, it''s possible to use a transactional
    database for a data lake, but this limits the potential to scale in the future.


    ## PostgreSQL


    ### Pros


    Unlike the options listed earlier, PostgreSQL (Figure 5.6) is an open source database
    that is free to download. It can easily be spun up on a local server or hosted
    on various cloud services as AWS. PostgreSQL also has an ANSI-compliant SQL library
    and AWS supports an extensive library of third-party and user-defined functions.
    As it''s a transactional database, it has very fast writes and also has fast reads
    below ~100M rows.


    ### Cons


    PostgreSQL is a row-oriented database that generally doesn''t perform well with
    analytical queries. It is great for transactional data but not a good choice for
    data volumes over1TB.


    ## Choosing an Engine for the Data Lake


    ![](img/07b10ae3f84ebfc0356cf70f4bf08c9e_79_0.png)


    Figure 5.6


    ## Recommendation


    Selecting a warehouse engine depends on several factors (Table 5.1). If short-term
    price and simplicity are the motivating factors, PostgreSQL may seem attractive;
    however, scalability potential is lower than columnar-based solutions.


    Redshift is a good choice as a standard cloud warehouse where a dedicated DBA
    can manage it. BigQuery and Snowflake are both highly scalable solutions that
    don''t require sophisticated management.


    ### 5.1 Selection Factors


    | | Storage Pricing TB/Month | Process Pricing | Performance Ecosystem | Ecosystem
    | Maintenance |

    |---|---|---|---|---|

    | Redshift | Tiered/Hourly | Variable/Hourly | Columnar | AWS | Medium-high |

    | BigQuery | $20 | $5/TB | Columnar | GCP | Medium |

    | Snowflake | $23 | Dynamic/hourly | Columnar | AWS/GCP/ Azure | Low |

    | PostgreSQL | $0.115–0.125 | $0.0180–12.00/hourly | Columnar and Row-Based |
    AWS/GCP/ Azure/Self | High |


    * Prices as of April 2020. Redshift is priced based on region and service tiers,
    while it is flexible, it’s also more complex than other options. PostgreSQL pricing
    is based on AWS RDS service instance pricing. Competitors offer very similar offerings.

