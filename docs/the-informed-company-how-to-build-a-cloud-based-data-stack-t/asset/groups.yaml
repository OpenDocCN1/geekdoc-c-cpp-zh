    # STAGE 1 SOURCE

    aka Siloed Data


    ![](img/07b10ae3f84ebfc0356cf70f4bf08c9e_38_0.png)


    # Source Stage Overview


    Modern businesses, even modest sized ones, generate heaps of data that comes in
    several flavors—product information, customer information, app performance, marketing
    expenditures, and more. A new business can work with data from production databases,
    product APIs, and financials directly from their sources.


    Over time, as sources accumulate more data, the number of data channels grows
    as well. It becomes even more challenging to manage data across separate sources.


    This section is about helping you work with sources. We talk about what sources
    are and what we can do with them. From there, we survey the tools commonly used
    to connect and investigate sources; for each example, we offer quick but tested
    thoughts on how these tools can be used by your team. We complete our discussion
    with data during the source stage. We advocate for source replicas and streamlined
    data intelligence tools.


    This stage is ideal for new companies or teams with minimal data needs. It is
    inexpensive and relatively easy to tool, implement, and maintain. While it is
    exciting to build out a sophisticated data stack, it is not necessary before circumstances
    require it. Over-engineering is a costly mistake. However, the methods discussed
    in Chapters 1, 2, and 3 set the stage for your future data lake and data warehouse
    that arise as the scale and diversity of your source proliferate.


    # Chapter One


    ## Starting with Source Data


    When starting from scratch, keep in mind the potential for the data to grow and
    the usability needs of users in the future. In the beginning, sources are their
    own islands separated from each other. Data streams remain in their own "ilo."
    When a data team is small, a collection of sources is easy to maintain and monitor.
    For example, to support new data teams, many data sources have their own built-in
    dashboards and reporting capabilities (see Salesforce, Heap, and so on).


    While single-source data isn''t all that powerful, it''s not at all useless. Some
    everyday use cases of solutions built from single-source data include:


    - Database queries that generate customer acquisition metrics.

    - A dashboard that displays monthly sales featuring a downloadable spreadsheet.

    - A custom web application that allows searching of referral traffic.


    # Starting with Source Data


    Siloed reporting does not yield the powerful data insights that more sophisticated
    teams need, but this is often where teams must start. The analyst''s role becomes
    that of an instructor to stakeholders—the analyst must understand sources and
    support stakeholders who read and interact with this limited data. An analyst
    may pull together numbers from separate comma-separated files (CSVs) and run manual
    analysis in Excel or with basic SQL queries.


    As we explore data sources, remember that analysts can do more for their teams
    than work with business intelligence tools, Excel, and simple queries. In time,
    they can build abstractions on top of the data that make data accessible to other
    colleagues and self-servable (more on this in Stages 2 and 3).


    # Common Options for Analyzing Source Data


    Data ends up in many different places, the methods to analyze them boil down to
    application dashboards, Excel spreadsheets, SQL IDEs, cloud dashboard tools, or
    business intelligence (BI). We proceed to touch on several common tools used for
    interacting with sources, giving a short judgment on when and how to use them
    (Figure 1.1).


    ![](img/07b10ae3f84ebfc0356cf70f4bf08c9e_41_0.png)


    Figure 1.1 Various methods for data analysis for data sources.


    # Common Options for Analyzing Source Data


    ## Get to Know Data with Application Dashboards


    Many modern software as a service (SaaS) applications come built with a set of
    fixed dashboards and visualizations to showcase the data they are capturing (Figure
    1.2). These charts are highly tuned to specific use cases and can be quite informative—and
    maybe meet all data needs. Some, like Salesforce, even have a customizable chart
    and dashboard creator built in support ad-hoc querying. Many use custom query
    languages, too. These can go a long way, especially when there is no need to see
    this data in combination with other data. An additional part of the value proposition
    يلي these tools is vendor support staff, who help answer questions or fulfill
    special data needs.


    One word of caution: keep an eye out how often single sources of data combining
    with other sources. Perhaps you often fulfill queries “tell me what lead type
    creates the most customer support tickets,” that is, business asks that require
    analysis across multiple sources. If your team themselves playing the part of
    “glue” between single sources too often, it may be time to move to the Data Lake
    stage.


    ![](img/07b10ae3f84ebfc0356cf70f4bf08c9e_42_0.png)


    Figure 1.2 Example built in dashboard showing common metrics from Zendesk Source:
    "Zendesk"


    ## Ask Interesting Questions with Excel


    Most applications can export some of their data into CSV files (Figure 1.3). Anyone
    with Excel or Google sheets can import that data and analyze it. While this is
    an effective way to expand the questions that one can ask of data applications,
    it is relatively manual and requires frequent updates to data current.


    ![](img/07b10ae3f84ebfc0356cf70f4bf08c9e_43_0.png)


    Figure 1.3 A basic export feature on a web services dashboard providing a CSV
