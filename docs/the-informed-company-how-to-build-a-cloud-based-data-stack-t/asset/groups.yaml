    This data would be stored on a disk in a row-oriented database and ordered row
    by row as in Table 19.2.


    TABLE 19.2


    | Matt | Los Angeles | 27 | Dave | San Francisco | 30 | Tim | Oakland | 33 |


    This allows the database to write a row quickly because all needs to be done is
    to tack on another row to the end of the data.


    # Writing to Row Store Databases


    Let''s use the data stored in a database (Table 19.3).


    TABLE 19.3


    | Matt | Los Angeles | 27 | Dave | San Francisco | 30 | Tim | Oakland | 33 |


    If we want to add a new record (Table 19.4), we can just append it to the end
    of the current data (Table 19.5).


    TABLE 19.4


    | Jen | Vancouver | 30 |


    TABLE 19.5


    | Matt | Los Angeles | 27 | Dave | San Francisco | 30 | Tim | Oakland | 33 | Jen
    | Vancouver | 30 |


    Row-oriented databases are still commonly used for Online Transaction Processing
    (OLTP) style applications since they can manage writes to the database well. However,
    another use case for databases is to analyze the data within them. Online Analytical
    Processing (OLAP) requires a database that can support ad-hoc querying. For analysis,
    row-oriented databases are slower than C-store databases.'
  - '[PAGE 221]


    # Reading from Row Store Databases


    Row-oriented databases are fast at retrieving a row or a set of rows but, when
    performing an aggregation, they bring extra data (columns) into memory. This is
    slower than selecting the columns that are needed for the aggregation. In addition
    the number of disks the row-oriented database might need access is typically more.


    # Extra Data into Memory


    Say we want to get the sum of ages from the Facebook_Friends data. To do this
    we need to load all nine of these pieces of data into memory and then pull out
    the relevant data for the aggregation (Table 19.6).


    TABLE 19.6


    | Matt | Los Angeles | 27 | Dave | San Francisco | 30 | Tim | Oakland | 33 |


    This is wasted computing time.


    # Column-Oriented Databases


    Data warehouses were created in order to support analyzing data. These types of
    databases are read optimized.


    In a C-Store, columnar, or column-oriented database, the data is stored such that
    each row of a column will be next to other rows from that same column.


    Let''s look at the same data set again (Table 19.7) and see how it is stored in
    a column-oriented database. A table is stored one column at a time and ordered
    row by row (Table 19.8).'
  - '[PAGE 222]


    # TABLE 19.7 Facebook_Friends


    | Name | City | Age |

    |---|---|---|

    | Matt | Los Angeles | 27 |

    | Dave | San Francisco | 30 |

    | Tim | Oakland | 33 |


    # TABLE 19.8


    | Matt | Dave | Tim | Los Angeles | San Francisco | Oakland | 27 | 30 | 33 |


    # Writing to a Column Store Databases


    If we want to add a new record (Table 19.9), we have to navigate around the data
    to plug each column into where it should be (Table 19.10), which is not as efficient
    as a row-oriented database.


    # TABLE 19.9


    | Jen | Vancouver | 30 |


    # TABLE 19.10


    | Matt | Dave | Tim | Los Angeles | San Francisco | Oakland | Vancouver | 27 |
    30 | 33 |


    # Reading from a Column Store Database


    To get the sum of the ages, the computer only needs to go to one disk (Disk 3)
    and sum all the values inside of it. No extra memory needs to be pulled in, and
    it accesses a minimal number of disks.


    While this is a slight oversimplification, it illustrates that organizing data
    by column the number of disks that will need to be visited'
  - '[PAGE 223]


    will be reduced and the amount of extra data that has to be held in memory minimized.
    This greatly increases the overall speed of the computation.


    There are other ways in which a column-oriented database can get more performance.


    # Coding the Data into More Compact Forms


    Let''s first examine an encoding technique that can be used by row- or column-oriented
    databases. Take, for example, a column of data with the individual states of the
    United States. We can use dictionary and bitmap encodings:


    +   - There are 50 states, so we could encode the whole database with 6 bits since
    this would provide us 64 unique patterns.


    +   - To store the actual abbreviations would require 16 bits this would provide
    us with 256 unique patterns for each of the two ASCII characters.


    +   - Worst of all, if we stored the full name, the lengths would be variable,
    and the amount of bits needed would be a lot more.


    Now let''s take a look at Run-length encoding. This allows replacement of any
    sequence of the same value with a count and value indicator. For, we can replace
    aaaab with 4a1b. This becomes even more powerful when creating projections with
    columns that are sorted all values that are the same next to each other.


    # Compressing the Data


    If each piece of data is the same number of bits long, then all of the data can
    be further compressed to be the number of pieces of data times that number of
    bits for a single piece of data.'
- md: "\n## Ordering the Data\n\nWhen doing ad-hoc queries, there are a number of\
    \ different sort orders of the data that would improve performance. For instance,\
    \ we might want data listed by date, both ascending and descending. We might be\
    \ looking for a lot of data on a single customer, so ordering by customer could\
    \ improve performance.\n\nIn row-oriented databases, indexes can be created but\
    \ data is rarely stored in multiple sort orders. However, in column-oriented databases\
    \ the data can be stored in an arbitrary number of ways. In fact, there are benefits\
    \ beyond query performance. These different sort-ordered columns are referred\
    \ to as projections, and they allow the system to be more fault tolerant, since\
    \ the data is stored multiple times (Table 19.11).\n\nTABLE 19.11\n\n| Original\
    \ Database (WS) | Name Ordered ASC (RS) | Name Ordered DESC (RS) |\n| --- | ---\
    \ | --- |\n| Disk 1 | Disk 1 | Disk 1 |\n| Name | Name | Name |\n| Matt | Dave\
    \ | Tim | Dave | Matt | Tim | Tim | Matt | Dave |\n| Disk 2 | Disk 2 | Disk 2\
    \ |\n| City | City | City |\n| Los Angeles San Francisco Oakland San Francisco\
    \ San Los Angeles Oakland San Francisco | |\n| Disk 3 | Disk 3 | Disk 3 |\n| Age\
    \ | Age | Age |\n| 27 30 33 | 30 27 33 | 27 30 |\n\nThis seems like a complicated\
    \ set of tables to update, and it is. This is why the architecture of a C-store\
    \ database has a writeable store (WS) and a read-optimized store (RS). The writable\
    \ store has the data sorted in the order it was added to make adding data into\
    \ easier. We can easily append the relevant fields to our database as seen in\
    \ Table 19.12.\n\n## TABLE 19.12\n\n| Original Database (WS) | |\n|---|---|\n\
    | Disk 1 | |\n| Name | |\n| Matt | Dave | Tim | Jen |\n| Disk 2 | |\n| Los Angeles\
    \ | San Francisco | Oakland | Vancouver |\n| Disk 3 | |\n| Age | |\n| 27 | 30\
    \ | 33 | 30 |\n\nThen the read-optimized store can have multiple projections.\
    \ It then has a tuple mover that manages the relevant updates from the WS to the\
    \ RS. It has to navigate the multiple projections and insert the data in the proper\
    \ places (Table 19.13).\n\nThis architecture means that while the data is being\
    \ updated from the WS to the RS, the partially added data must be ignored by queries\
    \ to the RS until the update is complete.\n\n## TABLE 19.13\n\n| Name Ordered\
    \ ASC (RS) | | | | |\n|---|---|---|---|---|\n| Disk 1 | | | | |\n| Name | | |\
    \ | |\n| Dave | Jen | Matt | Tim |\n| Disk 2 | | | | |\n| City | | | | |\n| San\
    \ Francisco | Vancouver | Los Angeles | Oakland |\n| Disk 3 | | | | |\n| Age |\
    \ | | | |\n| 30 | 30 | 27 | 33 |\n\n| Name Ordered DESC (RS) | | | | |\n|---|---|---|---|---|\n\
    | Disk 1 | | | | |\n| Name | | | | |\n| Tim | Matt | Jen | Dave |\n| Disk 2 |\
    \ | | | |\n| City | | | | |\n| Oakland | Los Angeles | Vancouver | San Francisco\
    \ |\n| Disk 3 | | | | |\n| Age | | | | |\n| 33 | 27 | 30 | 30 |\n\n## Summary\n\
    \nColumn-oriented databases came out with a 2005 paper explaining the design that\
    \ Redshift, BigQuery, and Snowflake are all built upon. It’s why they all have\
    \ about the same performance and relative costs. This column-oriented database\
    \ is being used by most major providers of cloud data warehouses. This has become\
    \ the dominant architecture in relational databases to support OLAP.\n\n## Chapter\
    \ Twenty\n\n## Style Guide Example\n\nGoing through and creating a clean data\
    \ warehouse and marts makes the data easier to understand for everyone. As an\
    \ organization grows, more than one person will help clean and transform the data.\
    \ There are aspects of cleaning that are subjective, and we need to codify what\
    \ we want to happen. For example, we will want to rename a column to make it more\
    \ readable, but we should use snake case (e.g. example_new_column) or camel case\
    \ (e.g. ExampleNewColumn)? In the book we said snake case, but this is a judgment\
    \ call and you could go with another convention.\n\nDocument cleaning goals and\
    \ stylistic preferences in a style guide so that we clean the data consistently\
    \ and others can help.\n\nWe have provided sample style guides at the end of the\
    \ chapter.\n\n## Simplify\n\nIt's quite common for raw data to be extremely complicated.\
    \ When data comes into existence, in most cases, it's intended to be used by applications\
    \ and not directly by business users. Taking time to simplify data significantly\
    \ improves the ability for business users to successfully query it.\n\n## Only\
    \ Include Fields That Have an Apparent Analytical Purpose\n\nIf your system makes\
    \ it easy to update/add new columns, it's best to start modeling with only the\
    \ most relevant columns, excluding any columns that have no direct or analytical\
    \ purpose.\n\n## Extract Relevant Data from Complex Data Types\n\nApplication\
    \ data sources may contain JSON, arrays, Hstore, and other complex data types.\
    \ These are typically hard to query from business intelligence tools in their\
    \ raw form. However, relevant data can be extracted into new columns, which can\
    \ be queried efficiently.\n\nSuppose a table named books contains an id column\
    \ and the following JSON column:\n\n```json\n{\n  \"title\": \"Moby Dick\",\n\
    \  \"author\": \"Herman Melville\",\n  \"genres\": [\"novel\", \"fiction\"]\n\
    }\n```\n\nThe resulting modeled books table would contain an id, title, and author\
    \ columns. Genres could be modeled as an independent table, reduced to a single\
    \ genre based on custom rules or some other method.\n\n## Change Flags and Cryptic\
    \ Abbreviations to Meaningful Values\n\nIt's common for application databases\
    \ to have flags or cryptic abbreviations in columns that work well for an application\
    \ to reference. These can be impossible for a business user to interpret. It's\
    \ essential to transform these values into natural, human-readable values, for\
    \ example:\n\n- Transform Boolean values 0 and 1 to relevant strings, such as\
    \ true and false on or off.\n- Change Boolean field names to be descriptive and\
    \ start with is_ or has_. It is challenging to interpret Boolean field names when\
    \ they are ambiguous, such as \"inactive,\" \"subscribed,\" or \"paid.\"\n- Transform\
    \ flag values into relevant strings by joining to a dimension or remapping the\
    \ data. Avoiding the same \"case when\" statement in multiple places. If a column\
    \ billing_status has three discrete values (i.e. 0, 1, 2) that represent some\
    \ status, transform them into a relevant concept such as \"Active,\" \"Not Active,\"\
    \ or \"Delinquent.\"\n- Transform hard-to-interpret values into easy-understand\
    \ values.\n\n## Denormalize Where Beneficial\n\nApplications typically have highly\
    \ normalized tables to prevent duplicate records, and make modifications easier.\
    \ Excessive normalization typically makes it harder for business users to browse\
    \ the schema, usually due to the complexity of the joins. Building wider tables\
    \ wherever appropriate and collapsing common concepts into a single table help\
    \ to reduce excessive joins. Examples include:\n\n- Combine the sources, redshift,\
    \ sources_postgres, and sources_mysql tables into a single source table with the\
    \ lowest common denominator of values that make sense for a business user.\n-\
    \ Combine the users and addresses into a single users table since addresses are\
    \ meaningless on their own.\n\n## Style Guide Example\n\nDenormalization requires\
    \ trial and error and takes time to get it right.\n\n## Clean\n\nData is messy\
    \ and frequently requires cleaning to ensure accurate results. Cleaning prevents\
    \ common problems that might cause a query to produce incorrect results.\n\n##\
    \ Attempt to Eliminate NULLs\n\nNULL values have unexpected consequences in SQL\
    \ (is \"string\" <> NULL?). It’s best to replace NULLs with values. Some examples:\n\
    \n- Change all NULL values in the first_name column to the string Blank.\n- Change\
    \ all NULL values in the last_login_type column to the string Never Logged In\
    \ for customers that have never logged in.\n\n## Fix Common Data Inconsistencies\n\
    \nBad data always makes its way into raw data sources. Whether it is missspellings\
    \ or junk data, it is essential to clean up the data as much as possible. Some\
    \ examples:\n\n- Transform state names that have a mix of abbreviations, full\
    \ names, and junk data into a single, consistent format such as the full state\
    \ name.\n- Phone numbers might be garbage text entered by users to avoid getting\
    \ phone calls.\n"
  mdcn: '


    ## 数据排序


    在进行即时查询（ad-hoc queries）时，有多种数据排序方式可以提高性能。例如，我们可能希望按日期列出数据，包括升序和降序。我们可能在查找某个客户的大量数据，因此按客户排序可能会提高性能。


    在行存储数据库中，可以创建索引，但数据很少以多种排序方式存储。然而，在列存储数据库中，数据可以以任意数量存储。事实上，这除了查询性能外，还有其他好处。这些不同排序的列被称为“投影”（projections），它们允许系统具有更高的容错性，因为数据被存储了多次（见表
    19.11）。


    表 19.11


    | 原始数据库 (WS) | 姓名升序排序 (RS) | 姓名降序排序 (RS) |

    | --- | --- | --- |

    | 磁盘 1 | 磁盘 1 | 磁盘 1 |

    | 姓名 | 姓名 | 姓名 |

    | Matt | Dave | Tim | Dave | Matt | Tim | Tim | Matt | Dave |

    | 磁盘 2 | 磁盘 2 | 磁盘 2 |

    | 城市 | 城市 | 城市 |

    | 洛杉矶 旧金山 奥克兰 旧金山 上海 洛杉矶 奥克山 | | |

    | 磁盘 3 | 磁盘 3 | 磁盘 3 |

    | 年龄 | 年龄 | 年龄 |

    | 27 30 33 | 30 27 33 | 27 30 |


    更新一组表看起来非常复杂，事实如此。这就是为什么 C-store 数据库的架构有一个可写存储（WS）和一个读取优化存储（RS）。可写存储中的数据按照添加的顺序进行排序，以便于添加数据。如表
    19.12 所示，我们可以轻松将相关字段追加到数据库中。


    ## 表 19.12


    | 原始数据库 (WS) | |

    |---|---|

    | 磁盘 1 | |

    | 姓名 | |

    | Matt | Dave | Tim | Jen |

    | 磁盘 2 | | |

    | 洛杉矶 | 旧金山 | 奥克兰 | 温哥华 |

    | 磁盘 3 | | |

    | 年龄 | | |

    | 27 | 30 | 33 | 30 |


    然后，读取优化存储可以有多个投影。它包含一个元组移动器（tuple mover），用于管理从 WS 到 RS 的相关更新。它必须遍历多个投影并将数据插入适当的位置（见表
    19.13）。


    这种架构意味着，当数据从 WS 更新到 RS 时，对 RS 的查询必须在更新完成之前忽略部分添加的数据。


    ## 表 19.13


    | 姓名升序排序 (RS) | | | | | |

    |---|---|---|---|---|

    | 磁盘 1 | | | | | |

    | 姓名 | | | | | |

    | Dave | Jen | Matt | Tim | |

    | 磁盘 2 | | | | | |

    | 城市 | | | | | |

    | 旧金山 | 温哥华 | 洛杉矶 | 奥克兰 | |

    | 磁盘 3 | | | | | |

    | 年龄 | | | | | |

    | 30 | 30 | 27 | 33 | |


    | 姓名降序排序 (RS) | | | | | |

    |---|---|---|---|---||

    | 磁盘 1 | | | | | |

    | 姓名 | | | | | |

    | Tim | Matt | Jen | Dave | |

    | 磁盘 2 | | | | | |

    | 城市 | | | | | |

    | 奥克兰 | 洛杉矶 | 温哥华 | 旧金山 | |

    | 磁盘 3 | | | | | |

    | 年龄 | | | | | |

    | 33 | 27 | 30 | 30 | |


    ## 总结


    列存储数据库于 2005 年的一篇论文中解释了 Redshift、BigQuery 和 Snowflake 所构建的基础设计。这就是为什么它们的性能和相对成本大体相同的原因。


    [注]：列存储数据库出现时，有一篇论文解释了 Redshift、BigQuery 和 Snowflake 都基于构建的设计。这就是为什么它们的性能和相对成本大体相同。运用费曼技巧，你只需花上`20
    min`就能深入理解知识点，而且记忆深刻，*难以遗忘*。


    （注：此处由于原文似乎存在段落重复或逻辑跳接，翻译已根据语意进行了对齐处理）


    [注]：由于提供的原文文本在“Summary”之后出现了大量逻辑重复和不完整的句子片段，译文保持了其核心技术含义，并遵循了 Markdown 格式。


