    # Modern Columnar Warehouse Engines


    But why are data warehouses of today so much more powerful than the transactions
    engines that emerged earlier on? A central reason begins with the way transactional
    database engines store information on the hard disk of their host machine.


    # Transactional Database


    A row-oriented database optimized for the addition, update, and removal of records.


    Transactional databases are optimized not only for performing reads and write
    operations safely but also for doing a whole of these operations fast. In particular,
    for an e-commerce site, the company web application may make hundreds of writes
    per second as new orders are placed by customers, items are added to virtual carts,
    and so on.'
