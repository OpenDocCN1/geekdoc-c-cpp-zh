    channel. They want to know if we''ve been in contact with them, so it''s helpful
    to have all the information from our customers together in the Interactions table.


    Currently, usage of the SST is still rampant but as more people start using it,
    cracks have been starting to show. For example, when combining the Salesforce
    Leads and Contacts data into the generic "Contacts" table, we initially filtered
    converted leads to duplicate records. This proved unhelpful to our marketing and
    sales teams, who care about historical data from converted leads.


    ## Less Planning, More Implementing


    In the old days data modelers did a lot of designing. They gathered a lot of requirements
    to determine their exact use case and created star schemas for business users.
    We now have the tools and performance to make this a more collaborative endeavor,
    where a warehouse-house lead can model and iterate based on feedback. We continue
    to iterate on our schema to suit our business needs and believe that schema design
    is an ongoing process.


    Especially after creating the staging models for the sources we use in our warehouse,
    we try many configurations of tables to see what supports analytics best. Since
    everything is layered on top of the database, it can be changed on a whim. It
    takes less pre-thinking (which is largely impossible guessing), less meetings,
    less restructuring, less architecting, less complexity, and less repetition.


    ## Acknowledgments and Contributions


    This book has been a large effort by a number of people and continues to evolve
    with community involvement. We appreciate everyone''s help in making this book
    a useful guide for people who are building their data stacks.


    ## Thank-you


    I want to give a special thanks to Matt David, the head of the Data School for
    working on the start of this for so many hours with me. He has project managed,
    refined ideas, and written the majority of this book and continually recruits
    community involvement. His passion for educating the masses on data is truly inspirational,
    and he is a joy to work with.


    I also want to thank Tim Miller and Tracy Chow, who contributed to many chapters
    here and worked many stressful hours on content with me. Thank you, Tim and Tracy,
    for your constant drive and passion for both learning and educating.


    Also I''d like to thank the rest of the Chartio Data Advisor team, who each contributed
    a chapter and who daily take the learnings in this book directly to our customers.


    Thank you, Liz Wikstrom, for your always excellent design and illustrations that
    honor this book and site. Thank you, Eleanor Preston, for helping me work through
    this framework on so many customer visits—and persistently waiting for us to get
    it published!


    Thank you, Kostas Paradalis of Blendo, for your input on the chapter on ETL vs
    ELT. Thank you Tristan for providing feedback on writing the foreword.


    And lastly, a big thank-you to our editors, Emilie Schario, Mila Page, and David
    Yerrington. They got us through the toughest parts of this book and made sure
    it was clear and accurate.


