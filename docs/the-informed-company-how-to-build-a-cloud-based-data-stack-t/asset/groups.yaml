    ## 创建业务指标


    衡量业务表现的方法有很多。有些是相对为人知的，例如“月活跃用户”或“新注册数”。建立此类指标是困难的，因为指标对粒度非常敏感，且数据逻辑可能会变化。


    ## 在表格中添加计算字段


    假设我们想要 `orders` 表并想要利润率字段，我们首先需要将订单项汇总到每个订单一行，然后我们就可以计算每个订单的成本、收入和利润率。这些类型的值丰富了数据，让分析师能够从中发现更多洞察。


    ## 避免聚合指标表


    用行定义指标是很好的，但要把聚合留给 BI 工具。如果你预先聚合了它们，就会失去对指标进行切分的能力。在某些情况下，物化是有益的，在你减少数据探索方式之前扩展你的数据库。


