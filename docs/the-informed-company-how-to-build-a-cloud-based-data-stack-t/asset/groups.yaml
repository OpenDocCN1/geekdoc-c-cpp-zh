  - "[PAGE 153]\n\n# Uniqueness\n\nFor id fields, emails, and other fields that should\
    \ be unique set up a test by writing a uniqueness test in dbt. This test checks\
    \ that all the values in the specified column do not have any duplicates. All\
    \ dbt tests go in the *.yml files that define the sources and models of your dbt\
    \ project. More information may be found in dbt's Testing documentation.\n\n```\n\
    models:\n  name: users\n  columns:\n    name: id\n  tests:\n    - unique\n```\n\
    \n# Not Null\n\nFor id fields, date fields, Booleans, and key fields within a\
    \ table write a test to ensure the columns have no null values. If there are non-null\
    \ values found in the column, then the test will not pass.\n\n```\nmodels:\n \
    \ name: users\n  columns:\n    name: id\n  tests:\n    - unique\n    - not_null\n\
    ```\n\nA good rule of thumb is that all primary key columns have the uniqueness\
    \ and not null tests to ensure the proper grain and granularity."
- md: "\n# Relationships\n\nTo test the relationship of column values between tables,\
    \ add a relationship test. According to the dbt docs (which we highly recommend\
    \ reading after this book), relationship tests ensure “that all of the records\
    \ in a child table have a corresponding record in a parent table.”\n\nFor example,\
    \ the following checks that every value of the “user_id” column in the User Teams\
    \ table has a corresponding value in the Parents table. The test will not pass\
    \ if there is a user_id in User Teams that doesn't exist in the Users table.\n\
    \n```yaml\nmodels:\n  name: user_teams\n  columns:\n    name: user_id\n  tests:\n\
    \    relationships:\n      to: ref('users')\n      field: id\n```\n\n# Accepted\
    \ Values\n\nFor columns that are expected to have a set list of values, add an\
    \ Accepted Values test. The test will not pass if any values appear in the column\
    \ outside of the supplied list.\n\n```yaml\nmodels:\n  name: users\n  columns:\n\
    \    name: type\n  tests:\n    accepted_values:\n      values: ['staff', 'moderator',\
    \ 'end-user']\n```\n\nThese four tests are a starting point, but you can expand\
    \ to your use cases, including creating custom tests, or leverage the dbtexpectations\
    \ package (Figure 11.3). https://discourse.getdtbt.com/t/new-package-dbt-expectations/1771\n\
    \n![](img/07b10ae3f84ebfc0356cf70f4bf08c9e_155_0.png)\n\nFigure 11.3 An illustration\
