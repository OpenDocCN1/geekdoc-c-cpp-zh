    # 分析源数据的常用选项


    支持直接 SQL 查询，且理想情况下能够连接并融合来自多个源的数据的产品。


    采用具有直接 SQL 能力的 BI 解决方案的主要优势包括：


    - 访问访问的一致性。

    - 较低的运行成本。

    - 数据向未来系统（如数据湖）的可迁移性。


    当数据源未经过整合、清洗和组织时，这类 BI 解决方案是必要的，但有时可能需要编写复杂的 SQL 查询。像 Looker 和我们自己的 Chartio 等工具支持编写查询和管理自定义仪表板
    (1.7)。


    ![](img/07b10ae3f84ebfc0356cf70f4bf08c9e_46_0.png)


    图 1.7 Chartio 仪表板销售指标执行摘要。

    来源：*Chartio*


    # 第二章


    ## 复制源数据的必要性


    每个查询，无论是通过业务智能工具、SQL 工作台还是类似的工具发送的，都是向源头请求数据。提供查询需要技术资源、时间和计算能量。当“针对”“生产数据库”运行查询时（见图
    2.1），这一点尤为相关，因为过多的查询（尤其是运行时间长的查询）会导致机器拥缓慢（不要忘记混乱的仪表板会导致许多查询同时运行）。


    ![](img/07b10ae3f84ebfc0356cf70f4bf08c9e_48_0.png)


    # 生产系统


    生产系统是任何为用户提供关键业务功能的系统。生产数据库系统的一个示例是支持用户在互联网上购买本书并处理信用卡交易的应用程序后端。我们建议不要直接从生产系统查询数据，因为这可能会干扰到您的实时应用程序。


    较新的企业正在调查其内部数据，以从实时或生产系统中汲取数据。换句话说，他们直接在数据源上运行分析类查询。虽然这对于 Salesforce 或 Google
    Analytics 这类工具是没问题的（主要是因为查询完全不会影响它们的性能），但对于本地或甚至是云托管的生产系统则不能这么说。


    在生产系统上查询数据带有以下风险：


    - 减慢所有用户和应用程序的性能。

    - 意外数据丢失。

    - 降低系统完整性。


    我们可以通过创建生产系统的副本，并仅向尝试分析数据的人提供只读访问来降低这些风险（图 2.2）。


    # 复制数据源


    我们强烈建议将关键任务数据源复制到具有只读权限的副本中。所有的分析查询都应该在这些副本或“副本”上运行，而不是直接在生产系统上运行。对于创建的每个副本，应从原始源数据库中撤销访问。


    ![](img/07b10ae3f84ebfc0356cf70f4bf08c9e_50_0.png)


    图 2.2 具有只读访问的克隆数据源。相反，授予副本访问，以便您组织内的相关用户查询副本。同样，让可视化工具连接副本表而不是产品系统。


    这种只读替身保护了数据库，使其不会被错误的 `INSERT` 破坏，也不会被频繁的 `SELECT` 请求拖累。由于这种间接性，初看之下这似乎有些过度，但消除了您业务应用程序中的另一个故障点。我们承认，尽管对于提供像
    RDS 等托管数据库的云提供商来说，创建只读副本是简单的，但在其他平台上可能具有挑战性。我们承认数据库可能会使数据存储成本翻倍，但它们消除了分析查询影响应用程序的风险。生产数据库中的交易与这些新记录传输到副本之间存在时间延迟也可能同样令人沮丧。


    但再次，没有公司希望发现自己的核心产品（无论是电子商务网站还是患者预约系统）在每次打开仪表板时因数据库冲突而崩溃（图 2.3）。此外，这种需求促使云提供商改进创建和自动化创建副本表的便利性。


    ![](img/07b10ae3f84ebfc0356cf70f4bf08c9e_51_0.png)


    # 创建只读访问


    现在用户有了副本的权限，请确保他们只有只读权限。这把他们与数据库的交互限制为仅能检索数据而不能进行操作。这将防止用户意外删除、更新或添加任何数据。操作数据库中实际数据的能力应保留给工程师。


    # 第三章


    ## 源数据最佳实践


    在建立起基于 SQL 的 BI 工具来融合和分析数据之后，有一些最佳实践需要记住，以支持他人使用这些数据。此时，花费过多时间进行建模或清洗数据至关重要，但在现阶段提供一些指导是无价的。


    # 维护复杂度 Wiki 页面


    数据在源阶段本质上是混乱的，对于所有人来说获得使用经验都很困难。由于数据源数量较少，创建一个包含已知问题警告的文档或 Wiki 页面是明智的。


    # 源数据最佳实践


    以下是记录的常见问题：


    - 命名不当的列描述。

    - 包含空值的列。

    - 业务逻辑。

    - 复杂的连接路径。

    - 旧的或未使用的列。


    # 代码片段字典


    另一个需要保留的文档是基础指标字典（图 3.1）。在处理未建模的数据时，重复相同内容很常见。这些内容可以存储在 Wiki、SQL 文件中，甚至作为图表存在。使用正确的
    BI 工具，这些片段可以图表的形式可用。


    ![](img/07b10ae3f84ebfc0356cf70f4bf08c9e_53_0.png)


    ```sql

    -- Chartio 中的用户总数

    select count(*)

    from public.users

    where users.email like ''%chartio.com''


    -- 付费客户总数

    select count(*)

    from public.customers

    where customers.started_at_date is not null


    -- 活跃报告总数

    select count(distinct report.id)

    from public.report

    where report.deleted_at_date is null

    ```


    图 3.1 在编辑器中使用 SQL 文件管理仪表板指标。

    来源：*Chartio


    # 使用 BI 产品


    现代 BI 产品允许用户在 BI 层对数据进行轻量级建模。它们包含架构编辑器，使用户可以快速重命名字段、隐藏列、指定连接路径并创建自定义列或表。虽然在需要大量更改时这些小改动很容易，但请考虑一直移动到仓库阶段，在那里建模可以被通用应用和利用。


    除了 SQL 访问外，某些带有拖放数据探索器的 BI 产品（如 Tableau Desktop 或 Chartio 的可视化 SQL (图 3,2)）会自动处理
    SQL。这对于那些仍在学习编写原始 SQL 的团队来说特别有用。


    即使在数据团队将数据清洗到湖中并建立仓库之后，这些界面仍然有用，因为公司里的其他人可以使用此类工具来探索数据并自助获取数据洞察。


    '
