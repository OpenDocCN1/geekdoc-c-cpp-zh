    # Introduction


    On the other hand, bad decisions are the result of not knowing enough: not knowing
    the root causes of numeric anomalies, not knowing where there is potential to
    invest more capital, and not knowing what the next few months could look like
    based previous quarterly performance. Intuition is a powerful and necessary tool,
    but we believe the individual and the company owe it to to hone their intuitions.
    We believe that anyone with access to performance metrics should integrate information
    into their decision making. Being informed is a key part of the puzzle to avoiding
    bad decisions. But what does it look like to be informed in the twenty-first century?


    Companies and their operations continue to become more digitized. Companies no
    longer have direct access to each customer and must increasingly rely on data
