    # Chapter Fifteen


    # # Maintaining the Source of Truth


    Now that the data warehouse is set up with an established warehouse, the next
    and ongoing step is maintenance. This involves making sure the data warehouse
    objects, columns, tables, views, and schemas are accurate and up-to-date. Maintaining
    a data warehouse is integral for users in an organization to easily and accurately
    gain insights into data. If it is not maintained, people will query the wrong
    data and get conflicting results.


    As a company''s data warehouse ages:


    +   - New metrics need to be tracked.

    - Some old metrics are no longer needed.

    - Permissions will need to be granted, updated, and revoked (more than expected).'
  - '[PAGE 181]


    +   - Modeling will become un-optimized.

    - More people will be modeling.


    These inevitable problems make it difficult for a company to conduct analyses.
    To prevent these issues, a data engineer familiar with the data warehouse becomes
    necessary to know how users are querying the source. This section will go in-depth
    on these issues and how to address them with routine maintenance (Figure 15.1).


    ![](img/07b10ae3f84ebfc0356cf70f4bf08c9e_181_0.png)


    Figure 15.1


    # Track New Metrics


    The ways that businesses measure their success change over time. New products
    launch, users behave differently, and new predictive models need to factor in
    new data. Success of the business depends on its ability to react to change. Sometimes
    this means creating a new calculated field or a new column, view, or table which
    can then be aggregated into a metric.'
  - '[PAGE 182]


    # Track New Metrics


    We may add a new field to our customer information in Salesforce that is in line
    with our new company objectives, say, tracking account activities through the
    services we provide. From here, we can see what services are most popular with
    our customers, then we offer special promotions on these services during seasonal
    trends where we see a fall in purchases to increase sales.


    # Three Considerations for Adding New Calculated Fields


    When engineers or analysts create new tables, columns, or views to track data,
    they do not follow the naming conventions that fit the data warehouse. This makes
    interpretation challenging for an analyst unfamiliar with the new metrics.


    This unfamiliar can also create duplicate work—for instance, creating a view for
    a support team lacks pertinent information that doesn''t distinguish the purpose
    of the view. Users looking to query this view may not know it. In this case, other
    users are also likely to create a new version of the same view expressing the
    same information.


    # 1. Where It Should Live


    A new calculated field could have a number of different places it could live,
    and deciding on the best spot can be an art. Do we only need to add the data to
    an existing table or should we add to a view or create a whole new view? Let''s
    review what reasons we would do:


    # Existing Table


    +   - The new calculated field can be understood and queried easily without complex
    joins or being aggregated.


    # Existing View*


    +   - A view that exists is relevant to the new calculated field.

    - That view is aggregated in a way that fits this data and its dependent calculated
    fields.'
  - '[PAGE 183]


    # Maintaining the Source of Truth


    +   - Complex join paths would make it difficult for people to query the new data
    accurately without the view.


    # New View*


    +   - No view that exists that is relevant to the new calculated field.

    - No view that is relevant is aggregated in a way that fits this calculated field
    should be aggregated without the view.

    - Complex join paths would make it difficult for people to query the new calculated
    field accurately.


    *Typically, it will be added to an existing table as well, but it will be queried
    from the View.


    # 2. How to Backfill


    It is advisable to backfill data whenever we can determine what the values should
    be (Figure 15.2). In a categorical column, we might be able to determine the value
    based on other columns or an obvious default value to enter. If we are not able
    to determine or have an obvious default value, leave the value as null. However,
    do consider the impact of NULLs, such as in aggregation. If this impacts the query,
    try determining a stand-in value such as “Unknown” to indicate it wasn''t possible
    to backfill.


    ![](img/07b10ae3f84ebfc0356cf70f4bf08c9e_183_0.png)


    Figure 15.2 Data being backfilled.'
  - '[PAGE 184]


    # Deprecate Old Metrics


    In a numeric field the impact of NULLs can be more significant. The other negative
    of NULLs in a table with time-based data is that it limits analysis to when the
    new column was added. Sometimes this issue can be overcome by bringing in data
    from previous data sources or by inputting values based on overall statistics
    or dimensions of each row.


    # 3. What to Call It


    Often data modelers forget to follow their own data warehouse naming conventions
    when adding new calculated field or updating existing ones. This defeats the point
    of the warehouse, which needs data to be consistent so others can easily interpret
    it. Always check your style guide before creating a new column.


    # Deprecate Old Metrics


    As companies grow, the tools they use to spin off data change. Multiple tools
    might contain similar if not the same types of data, as having both Hubspot and
    Salesforce. Which should an analyst use? We want to prevent inaccurate data from
    being queried so others do not reach inaccurate conclusions.


    Even if data sources stay constant, business objectives may change. This can affect
    what data is appropriate for analysis as well. Features or products might become
    deprecated as a result, and therefore their associated metrics might be misleading
    if the analysts are not aware of.


    # Explicitly Deprecate Data


    While removing difficult-to-use tables and columns prevents people from using
    them wrongly, sometimes it is not practical to remove them. In this case, we recommend
    pre-pending "deprecated_" or "do_not_use_." This naming'
  - '[PAGE 185]


    # Maintaining the Source of Truth


    convention makes it clear to everyone if they are useful when browsing or querying
    (Figure 15.3).


    The style rule of pre-pending "deprecated_" to fields is the best way to manage
    analysts aggregating for metrics because it''s apparent to everyone that the data
    should not be used. It''s also worth letting users know that these fields and
    metrics are no longer useful through email or with any BI tools, to avoid catching
    anyone off guard. Again, naming conventions play an integral role in keeping users
    from querying data warehouses incorrectly.


    Many BI tools also provide a query log to help identify what dashboards and charts
    are using which fields. This makes it easy to let others know if they need to
    update their queries or deprecate their charts and dashboards.


