    # Consistent Account Audit/Cleanup


    Sometimes the size of the enterprise requires additional auditing. Project changes,
    roles change, and use cases change. Any of these changes can impact employee permissions.
    Outdated permissions can lead to compliance and privacy issues. Periodically reviewing
    and updating permissions is a best practice to protect sensitive data.


    During an audit, check all the previous questions we talked about:


    +   * Who has access to which data sources?

    * Who has access to sensitive row-level information?

    * Who is on the admin team or has admin access?

    * Who has access to or is viewing dashboards and reports containing sensitive
    data?


    BI tools offer answers to these questions through varying levels of usage information
    in-app for the admin to monitor and review. If not all the pieces of information
    needed are available, talk to the support team of the BI tool. They can help pull
    the necessary information to make informed decisions about an account''s security.
    Feel free to push the boundaries, because it''s amazing what information is available
    when asked. It''s important to make sure data access is controlled and current
    to today''s needs.'
