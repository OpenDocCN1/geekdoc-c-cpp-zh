    # Create Business Metrics


    There are a lot of ways to measure how a business is performing. Some are relatively
    well known, such as “Monthly Active Users” or “Number of Trials Started.” Establishing
    an accurate metric such this is difficult because the data for a metric calculation
    may exist in multiple sources and the business logic behind them can change.


    Metrics are also highly sensitive to levels of granularity, and they typically
    obfuscate some filtering decisions, so it is important to be careful with how
    they are calculated and documented. We should focus on getting the right grain
    and creating calculated fields that make it easier to determine aggregated metrics.


    # Adding Calculated Fields to Tables


    Let''s say we want an orders table and we want a profit margin order field, but
    currently there is a line item for every order item. We first need to roll up
    the cost and revenue of the order items into one row per order, and then we can
    calculate the profit per order. Doing this roll-up also allows us to aggregate
    and produce metrics such as the total number of orders and average cost, revenue,
    and profit margin per order.'
