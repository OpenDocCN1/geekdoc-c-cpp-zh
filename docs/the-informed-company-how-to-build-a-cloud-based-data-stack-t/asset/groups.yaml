- md: '

    ## TABLE 10.1 Friends


    | Name | State | Age |

    | --- | --- | --- |

    | Matt | CA | 28 |

    | Dave | CA | 32 |

    | Joy | NULL | 30 |

    | Lisa | CA | NULL |


    When the goal is to show there were no sales on a particular day, a 0 will have
    a value on the chart, whereas a NULL may not display that segment of the line.


    This type of replacement is useful but may only get modeled in the BI tool when
    doing an individual query.


    ## Dates


    At times, NULL date values are represented by “1900-01-01” as an arbitrary date
    to eliminate NULLs. Using this type of substitution assumes that you do not have
    data points with dates existing that back, but you would need to keep this in
    mind when querying your date fields as it can cause skewed results.


    ## When Not to Replace


    Whenever using aggregation as MIN(), AVG(), SUM(), or COUNT(), NULL values are
    omitted. For example, COUNT(*) counts all rows, even if one column contains NULL
    values, whereas COUNT(column_name) omits NULL values from the result. Aggregations
    with GROUP BY, also group NULL values, in addition to all other values.


    Consider Table 10.1 containing NULL values and how aggregation behaves given different
    cases.


