    显示标准销售指标的类似仪表板。


    ## 尝试使用分析产品


    Amplitude 和 Mixpanel 等工具（图 1.6）可以通过消除引入工程添加跟踪事件的需求，帮助产品经理更加自给。产品分析提供了分析和 GUI，无需代码即可查询数据。这似乎是一个解决方案，但我们建议谨慎此类工具。


    不幸的是，这些工具通常很贵，而且对于每个事件你需要等待几个月才能获得所需的数据。这些事件通常已经在应用程序数据库中被跟踪，但命名和存储方式可能难以理解。此外，产品分析工具局限于应用程序数据，这意味着我们看不到其他源中存在的收入或业务指标。产品分析无法真正扩展到满足数据需求。


