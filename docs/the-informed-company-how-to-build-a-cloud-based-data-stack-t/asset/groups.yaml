    # Mart Stage Overview


    At long last, we''ve arrived at the top of the data stack. For these final pages,
    we consider what makes a data mart. That is, we discuss how to further structure
    and group data in your warehouse not only to meet one set of needs, but to meet
    the needs of a number of departments whose business logic may differ from another.


    # Stage 4: Data Marts


    More data and more schemas will eventually make the data warehouse difficult to
    navigate. A data mart is a filtered (and sometimes aggregated) subsection of a
    data warehouse that makes it easier for a particular group to query data. It provides
    a smaller schema with only the relevant tables for that group.


    # Overview of Building Data Marts


    For warehouses, we needed a warehouse lead to implement the modeling. For data
    marts, we''ll need multiple mart leads. They will determine which tables from
    the data warehouse are needed for their individual marts (Figure P.1). The mart
    leads can then customize tables for different cases. Aggregations, metric calculations,
    and PII can be handled individually for teams. However, if there is a metric that
    needs to be used by multiple teams, the warehouse lead should implement it on
    the data warehouse.


    > Figure P.1 Data marts subsections of a warehouse schema.


    ![](img/07b10ae3f84ebfc0356cf70f4bf08c9e_199_0.png)'
  - '[PAGE 200]


    One of the main benefits of setting up a data mart accurately is the ability to
    scale. There are more people tracking data quality, and data is limited for each
    team, reducing potential security concerns.


    # Center Around Business Use Cases


    As an organization scales the amount of data it is tracking, the number of people
    who want to access it scales, too. This results in in more people with less context
    in a large portion of the schema.


    We want to go from a large complex schema (Figure P.2) to a series of focused
    schemas, where each department can quickly find the data they need (Figure P.3).


    ![](img/07b10ae3f84ebfc0356cf70f4bf08c9e_200_0.png)


    Figure P.2 An entire data warehouse schema.'
  - '[PAGE 201]


    # Stage 4 Data Marts: aka Data Democratized


    ![](img/07b10ae3f84ebfc0356cf70f4bf08c9e_201_0.png)


    Figure P.3 A data warehouse schema sectioned off for each department''s data mart.


    Figure P.4 Data warehouse inventory by department needs.


    | TABLE | PRODUCT | MARKETING | SALES |

    | :--- | :---: | :---: | :---: |

    | USER | ✓ | × | ✓ |

    | MARKETING CHANNEL | × | ✓ | ✓ |

    | LEADS | × | ✓ | ✓ |


    So while going from lake to warehouse was mostly about cleaning up tables, going
    from warehouse to marts is about centering schemas and tables around business
    processes and teams. Different departments need different parts of the data warehouse
    schema (Figure P:4).'
  - '[PAGE 202]


    Data mart schemas are not very different from data warehouses because the data
    should already be understandable from the cleaning done in the warehouse stage.
    Data marts further simplify the schema for people within departments to find what
    data they need more quickly. Build it by creating views that create schemas on
    top of the warehouse that separate the full schema out into departments.


    Now how much you do further transformations depends on your BI tool. Most BI tools
    have the ability to create calculated fields and create self-serve data sets.
    Some tools such as Looker require you to model the data using their own proprietary
    language to prepare it for analysis. Others allow you to browse multiple schemas
    at once and combine data however you want, even for an individual chart, potentially
    using multiple sources of data on a single dashboard.


    Whatever your BI tool of choice, consider how to enrich data with calculated fields
    and join in additional categorical variables that may aid in their department-specific
    analysis.'
