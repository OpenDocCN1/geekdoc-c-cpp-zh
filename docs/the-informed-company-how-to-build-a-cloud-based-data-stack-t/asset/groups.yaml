    # XV


    ## 这本书不适合谁


    这本书并不是为“大数据”专业人士编写的。需要明确的是，即使是像 Doordash、Discord 以及《金融时报》和《纽约时报》的所有者（它们都是我们之前的客户）这样的大型公司，也不被视为大数据公司。根据经验法则，“大数据”标签适用于每日原始输入量超过
    100 GB 的数据架构。


    毫无疑问，本文中的许多元素都对应大数据工作流，特别是因为数据仓库支持各种表格，而不仅仅是（例如）事件流。然而，我们的目标是关注现代数据栈的核心支柱，以便最广泛的读者都能从书中的信息中获益。本着这种精神，我们放弃了对超大规模架构的建议。


    本书不适合 AI 驱动型团队，且未涵盖 AI 工作流、机器学习模型或实时操作用例。相反，它的目标是为构建和维护稳健的数据分析栈提供最佳实践（即构建 AI 工作流的基础数据分析基础）。


    如果你是一家可以用 Quickbooks 和 Excel 运行一切的小型企业，那么这种能力是非常棒的。数据对所有公司都很重要，但如果这些工具已经能满足你的需求，这本书可能无法提供有用的指导。如果你开始超过
    Excel 的数据容量，或者引入了需要在数据库中进行分析的数据源，那么请阅读。


    ## 谁写的这本书


    这本书由 Dave Fowler 和 Matt David 编写。


    Dave Fowler 在商业智能（BI）领域工作了十多年，并一直在寻找通过数据连接（JOIN）团队的方法（而不是数据分析师）。他希望让任何职场人士都能探索并理解他们的数据。作为
    Chartio 的创始人兼首席执行官，Dave 在过去的 11 年里领导了一个自助服务 BI 产品的开发，目标正是实现这一点。Chartio 的工具集让数据驱动型企业的任何人都能轻松浏览其架构、合并各种数据源并生成精美的仪表板。2021
    年 3 月，Atlassian 收购了 Chartio 并将其整合到自己的平台中。


    Matt David 在产品管理和教育领域工作了八年。他热情地倡导员工群体具备数据素养。作为 Data School 的现任，他负责监督专注于利用公司内部数据的免费在线资源。最近的书的话题包括
    SQL 优化、数据治理和常见偏差。Dave 创立了 Data School，他与 Matt 共同将其发展为数据社区的重要资源。他此前曾在 Udacity 和
    General Assembly 教任分析学课程。


    在看到许多人在构建数据栈并尝试使用数据栈时面临的重重挣扎后，Dave 和 Matt 决定合写此书。这本书是在 Chartio 许多员工的支持下创作的。他们慷地提供了关于客户如何对数据建模的见解，并收集了经常提出的数据基础设施问题。他们的贡献指导了本文的编写。


    ## 谁编辑的这本书


    这本书由 Emilie Schario、Mila Page 和 David Yerrington 审阅和编辑。Emilie 是 Netlify 的数据负责人，此前帮助过
    GitHub 的整个数据部门。她经常就与现代数据相关的所有事务进行写作和演讲。Mila 是 dbt Labs 的开发者倡导者，该公司是 dbt（数据构建工具）的制作者。她帮助数据专业人士学习并应用现代分析工程实践，并且是
    dbt 社区年度会议 Coalesce 的组织者。David 是一位数据科学顾问，曾任 General Assembly 的全球数据科学讲师。他帮助世界各地的人利用他们的数据。Emilie、Mila
    和 David 塑造了本书的叙述和内容。他们的（有时是）逐行的反馈确保了我们可以自豪地支持我们的建议。


    ## 影响


    在编写本文时，我们参考了多个信息源和观点来源。在 Chartio 职期间，我们与数百个现代云端客户合作过。我们通过编写这本书，亲自收集、实施并完善了这些实践，并与合作伙伴和客户进行了进一步验证。我们还通过
    dataschool.com、Tristan Handy 等博客以及关注数据的 Slack 社区从数据社区中学习。


    最后，值得提一下并感谢那些启发了上一代数据仓库工具包的经典著作。我们通过回响它们的术语和最佳实践来向它们致敬：


    - Lawrence Corr 的《敏捷数据仓库设计》（Agile Data Warehouse Design）

    - Ralph Kimball 的《数据仓库工具集》（The Data Warehouse Toolkit）

    - Stephen Few 的《信息仪表板设计》（Information Dashboard Design）（我的评论在此）


    这本书部分源于 Data School 的一个项目（图 A.2），这是一系列关于管理和利用数据的免费在线书籍和互动教程（参见 dataschool.com）。这些资源始终在扩展，就像维基百科的文章一样：每一轮更新都能看到电子书涵盖更多主题、对既有理念进行更深入探讨、分享更多真实案例，并更好地交付这些内容。我们的目标是维护和改进这些资源并保持其现代性。


    ![](img/07b10ae3f84ebfc0356cf70f4bf08c9e_18_0.png)


    图 A.2

    来源：The Data School


    很少有人在现代数据治理的所有领域都是完全“专家”，而且格局一直在不断变化。如果你有故事想分享，或者你认为缺少了某个章节，或者有新想法，请给我们发邮件。即使你不知道具体要分享什么，但不介意分享你的故事，也请联系我们，因为我们特别对增加真实的经验和见解感兴趣。


    数据世界有太多术语了，通常由才华横溢的供应商营销团队创造。我们尽量使用最通用的词汇。对于我们认为必要的任何术语，我们会提供定义。


    书中有很多关于旧数据工作方式的内容，在某些情况下，这些是有争议的。在编写本书时，我们刻意忽略了启动 Redshift 实例、编写 SQL 或使用各种 BI
    产品的细节。这些会让文本变得杂乱，重复互联网上的内容，并让阅读变得困难。


    本书旨在提供关于建立数据栈的宽泛概述和指南。我们认为这种类型的书籍对人们更有用。当我们有强烈观点时，我们不争论，直接采纳。当我们认为用户有合理的选择时，我们会提出这些选项。


    ## 如何阅读这本书


    书的开头对各个阶段以及哪个阶段适合你进行了快速概述。


    书的结构是为四个阶段中的每个阶段设置了一个章节，如果你愿意，可以直接跳到你所在的阶段。


    并不是每家公司都需要这本书的所有内容。随着增长公司数据需求的扩大，书中的内容变得越来越有用。但请注意，每个阶段提出的最佳实践在它们变得相关时出现。这些实践假设从书中出现的地方起就是有效的，以避免重复。因此，即使你和你的公司处于领先阶段，至少扫一下早期章节可能对你有益。


    在书的最后，我们有一个章节描述了数据世界发生的变化，使得这种新架构变得相关且高效。我们避免解释之前的实践（如金伯尔维度模型），以免干扰体验。然而，这些讨论是必要的，我们把它们放在书的最后一个章节。


    最后，在整书中你会看到以下图标：


    ![](img/07b10ae3f84ebfc0356cf70f4bf08c9e_20_0.png)


    # 定义


    它们与同一页上的术语相关。例如，在这一页提到了“数据湖”（data lake）。数据湖是多个数据源的暂存区。


    ![](img/07b10ae3f84ebfc0356cf70f4bf08c9e_20_1.png)


    # 技巧 (Protips)


    技巧可以扩展某个想法，或者就你在特定章节阅读的内容相关的主题提供额外信息。


    '
