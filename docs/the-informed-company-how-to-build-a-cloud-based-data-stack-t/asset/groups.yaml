    ## Combine Tables Within Schemas


    need updating. There are plenty of ways to mess up this process or miss rows outright
    that need updating. In a perfectly normalized schema, the country name should
    only be listed once in the database and joined on other tables via a foreign key.
    This lets us update the name once while keeping the key the same everywhere. Another
    nice benefit to it is it saves a lot of storage space.


    But for Analytics (OLAP) databases, we don''t need to optimize tables for space
    (thanks, C-store compression!), and we don''t have to manage updates since we
    never write/update analytics tables. Transformations are a change of SELECTs working
    together to make data insights available. In other words, we create “repetition
    friendly” views on top of a normalized database. This opposite process is fittingly
    denormalizing.


    Whereas normalizing data helps the machine, denormalizing helps the analyst. For
    example, it can be convenient to create a wide table (materialized as a view)
    that contains pre-joined results. These wide tables can sit alongside the normalized
    version in the data warehouse. We can create these joins between staging views
    to create useful views for analysis (Figure 13.4).


    Like with any query, be cautious of the type of JOIN used when creating wide tables.
    JOINS can produce duplicate data or introduce NULLs into tables if done incorrectly.
    For instance, an INNER JOIN on zendesk.users and application.users might cause
    some users in the application to disappear from the resulting data because not
    all application users might have filed a ticket in zesk yet. If we then INNER
    Joined zendesk.tickets to this table, we would have all the user information duplicated
    for each ticket that user created. That would mean a COUNT(*) of the table would
    no longer give us an accurate count of the number of users in our database.


    Figure 13.4. A diagram of two tables joined to create a wider table.


