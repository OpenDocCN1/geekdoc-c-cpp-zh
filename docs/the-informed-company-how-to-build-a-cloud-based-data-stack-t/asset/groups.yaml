    # Directed Acyclic Graph


    A directed acyclic graph or DAG is a connection of items that only flows in one
    direction. This lets us be sure that the transformations we are applying to data
    are not self-referential and create a loop.


    Our transformation tool of choice, dbt, has a built-in method of building a dependency
    graph of your data warehouse''s transformations. Run the dbt docs generate and
    dbt docs commands in the repo, which houses your modeling code. Barring any errors
    in transformations code, these produce a DAG (Figure 13.2).


