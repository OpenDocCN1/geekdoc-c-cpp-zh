    ## Implementing the Data Warehouse


    We might want to further generate a new key for this. Another example with a more
    complex join would be if we have tables from two different sources; a full outer
    joined result can make one universal table that is easy to read:


    ## Keep Grain


    When creating a table that will be used for analytics, be sure that the grain
    is intuitive from the table name. For example, consider a table named orders (Table
    13.1).


    TABLE 13.1 Orders

    | Order_item_id | order_id | price | quantity |

    |---|---|---|---|

    | 27 | 15 | 5 | 1 |

    | 28 | 15 | 10 | 1 |

    | 29 | 16 | 6 | 1 |

    | 30 | 17 | 7 | 1 |


    But wait, this table describes the items of order, not the orders themselves.
    To obtain orders table, we need to apply some aggregation, such as using a group
    by clause to obtain the desired result (Table 13.2).


    TABLE 13.2

    | Order_item_id | order_id | price |

    |---|---|---|

    | 27 | 15 | 15 |

    | 29 | 16 | 6 |

    | 30 | 17 | 7 |


    Always keep in mind downstream users of data and what they expect to see when
    they aggregate. Make sure that rows have been “rolled up” accordingly. The rows
    of a table should represent one unit of the entity.


    ## Create Business Metrics


    There are a lot of ways to measure how a business is performing. Some are relatively
    well known, such as “Monthly Active Users” or “Number of Trials Started.” Establishing
    an accurate metric such this is difficult because the data for a metric may exist
    in multiple sources and the business logic behind them can change. Metrics are
    also highly sensitive to levels of granularity, and they typically obfuscate some
    filtering decisions so it is important to be careful with how they are calculated
    and documented.


    ## Adding Calculated Fields to Tables


    Let''s say we want an orders table and we want a profit margin field, but currently
    there is a line item for every order. We first need to roll up the cost and revenue
    of the order items into one row per order, and then we can calculate the profit
    per order. Doing this roll-up allows us to aggregate and produce metrics such
    as the total number of orders and average cost, revenue, and profit margin per
    order.


    These types of values enrich the data and make it easier for analysts to find
    more insights within it. Analysts can join this table with other tables and segment
    and leverage it in many ways.


    ## Avoid Aggregated Metric Tables


    Defining metrics in rows is great, but leave the aggregating of metrics to the
    BI tool. If you pre-aggregate them, then it removes the ability to slice and dice
    the metric. Occasionally, it can be beneficial if you have a ton of data and you
    regularly look at it by some high-level grouping as quarter or year where it takes
    significant computation to produce these metrics. In these instances, materialize
    the view but remember this prevents more exploration of the data; investigate
    scaling up your database before reducing how the data can be explored.


    ## Create Standard Metrics Dashboard


    Another tactic for defining aggregated metrics is to create a well-documented
    dashboard and query. Provide text on the dashboard that explains the calculations
    needed to produce the metric and leave more specific SQL comments describing the
    filters being used (Figure 13.8).


    | Net New Trials | Daily Active Users |

    |---|---|

    | 946 | 8,519 |

    | Not measuring trials from existing customers or those that have not completed
    their password | Users who have done any action after logging in. Filtering emails
    with @yourcompany.com |


    While this is not scalable, it is a quick solution to get a team on the same page.
    It can be especially useful in earlier stages or when the team is experimenting
    with metrics.


    ## Keeping Accurate History


    When rows of data are updated, we lose that information to history. Maybe a customer
    started on a smaller plan upgraded to a higher plan, and the plan field in our
    database likely got overwritten. If all that exists in the database is what their
    current plan is, we have no way of recognizing that expansion and no way to look
    back at what the revenue for that customer might have been two years ago.


    When someone starts using the product they are active and we might store the data
    in our database as Table 13.3.


    TABLE 13.3

    | Id | email | is_active |

    |---|---|---|

    | 1 | dave@company.com | TRUE |


    But after a week the user stops using the tool and is now inactive (Table 13.4).


    TABLE 13.4

    | Id | email | is_active |

    |---|---|---|

    | 1 | dave@company.com | FALSE |


    If we wanted to know how many active users were there in the past, we would have
    no way to query for with this data model. We have overwritten the field; we would
    need to determine it.

