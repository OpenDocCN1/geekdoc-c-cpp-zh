    \ From the example, in our select statement above, it is hard to know what the\
    \ “Type” field indicates. We can remove this uncertainty with aliasing:\n\n```sql\n\
    SELECT\nId,\n-- external_id, -- unused\nName,\n\"Display Name\",\nLocation,\n\
    Type AS Access_level,\nInfo,\nis_deleted\nFROM\napp.users\n```\n\nNow the column\
    \ name is more explicit, but the values themselves are still hard to interpret.\n\
    \n# Ensure Values Are Readable\n\nData fields often encode status of orders, user\
    \ activity, and so much more, but so many little numbers or abbreviations become\
    \ diff to manage. To make values clear, spell out status codes, days of week,\
    \ and other numeric categories and abbreviations.\n\nFor example, a column “day_of_week”\
    \ which stores a numeric value for the day of the week (1 is Sunday, 2 is Monday)\
    \ is not as easy to read if you just replaced the numbers with names of the week\
    \ themselves. Many developers would use 0-based indexing, which might mean Sunday\
    \ is 0 and Monday would be 1, so check to make how the encoding works before re-labeling\
    \ the data. Better to figure this out every time you run a query and have to explain\
    \ the results to someone (or have to figure it out for yourself).\n\nWe’ll illustrate\
    \ this by continuing from the previous example. Suppose the values of the Type\
    \ column are a set of integers each stands for some level of access level an asset\
    \ within the application this data is sourced from. This might need to figure\
    \ out by consulting the stakeholder for this data source. Turn numbers into descriptive\
    \ names using a CASE statement:\n\n# Staging Schemas\n\nHowever, we can go a step\
    \ further. Numeric categories are quite often foreign keys to a reference table\
    \ with more explicit data (Figure 10.5). If those lookup tables are available,\
    \ you can JOIN in their more explicit values instead. This reduces querying complexity\
    \ for end users and makes fields straightforward to interpret.\n\nThis alternative\
    \ strategy joins two tables on the mutually shared type column. The lookup table\
    \ version of the type value is kept in the query, whereas the id is commented\
    \ out or omitted. In the interest of having straightforward names, the type column\
    \ from the Access table may be renamed to access_level.\n\n| ID | NAME |\n|---|---|\n\
    | 1 | Can view |\n| 2 | Can edit |\n| 3 | Can admin |\n\n![](img/07b10ae3f84ebfc0356cf70f4bf08c9e_127_0.png)\n\
    \nFigure 10.5\n\n```sql\nSELECT\nid,\n  -- external_id, unused\nName,\n\"Display\
    \ Name\",\nLocation,\naccess.\"type\" AS access_level,\n  --type--replaced by\
    \ access_level\nInfo,\nis_deleted\nFROM\napp.Users\nJOIN\napp.access\nON\nUsers.type\
    \ = access.id\n```\n\nIf you have the table with spelled out values, use the JOIN\
    \ approach. Using case statements requires hard-coding data values in your queries.\
    \ What happens if a backend change causes a value to change? What if a new key-value\
    \ is added to the field? This takes a lot of upkeep. The JOIN strategy minimizes\
    \ this overhead.\n\n# Standardize Values\n\nSometimes, column values are human\
    \ readable but their individual level of granularity differs across the column.\
    \ For example, say that some rows in an order table have a price given in US dollars\
    \ while others have a price given in euros. This would make it difficult to a\
    \ simple aggregation of the column. All sorts of difficulties like this complicate\
    \ analysis. Take a peek back to that we've been working. Suppose we expect only\
    \ nation-level values, but there are some rows with state-level values. We can\
    \ fix this inconsistent data, again, with CASE statements:\n\n# Staging Schemas\n\
    \n```sql\nSELECT\nid,\n-- external_id, -- unused\nName,\n\"Display Name\",\nLocation,\n\
    CASE\n    WHEN Location = \"United States\" THEN \"USA\"\n    WHEN Location =\
    \ \"US\" THEN \"USA\"\n    WHEN Location = \"US A\" THEN \"USA\"\n    ELSE Location\n\
    END AS country,\naccess.\"type\" AS access_level,\n--type--replaced by access_level\n\
