    # Maintaining the Source of Truth


    hinder the productive employees analysis and are not improperly exposing data.


    Another concern may be costs. Consider a scenario where users are working on BigQuery,
    which charges per unit of data queried. To prevent users from abusing queries
    and raising the cost, create a custom quota. As the BigQuery documentation outlines,
    a custom quota manages costs by specifying a limit on the amount of query processed
    per day. Setting a daily quota on project-level or at the user-level is a flexible
    option. This type of permission allows to manage cost while providing permissions
    to manage data integrity. There are even dbt packages, such as the Snowflake Spend,
    that can help with tracking costs involved with your warehouse.


    A final concern is data loss. While some databases such as Oracle offer the ability
    to recover a dropped table, some data warehouses do not. While some systems like
    Snowflake enable you to leverage time travel, when dropping a table in PostgreSQL,
    it''s not possible to restore the table unless restoring from a backup. If it''s
    not possible to restore from a backup, there''s no way to recover the dropped
    table. To avoid this, ensure that the proper individuals have the right permissions
    on the right data objects. Everyone analyzing the data should have read-only access.


    # How to Handle Permissions Correctly


    Ensuring that BI Tools access levels mirror the employment status of your employees
    helps track users and prevents security issues. The main priority of granting
    permission is to prevent users from accessing sensitive information or from permanently
    deleting data by accident.


    We recommend setting user permissions at a team level because businesses scale
    and add more users, it''s easier to track than creating access for every employee.
    Tracking individuals in a small company is trivial since they know everyone by
    name—when new people are hired or when they leave. In large companies, the warehouse
    lead doesn''t know the vast majority of the people they work with or when their
    roles or employment status change.'
