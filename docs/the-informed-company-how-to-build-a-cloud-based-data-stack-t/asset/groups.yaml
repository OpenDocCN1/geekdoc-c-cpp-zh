    Source: Microsoft


    ## Query Databases with an SQL IDE


    For data sources such as a production database, they can be queried directly from
    the command line, but this can get messy and hard to keep track of queries and
    results. We suggest setting up an integrated development environment (IDE) as
    pgAdmin to better handle querying data within a schema (Figure 1.4). These tools
