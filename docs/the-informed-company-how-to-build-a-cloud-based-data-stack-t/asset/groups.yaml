    ## Reasons to Build a Data Lake Summarized


    On the other hand, a cloud warehouse engine comes equipped with several analytics-minded
    functions built into their native SQL dialect (Figure 4.3). These operations are
    efficient and cost effective. The cost of a query on your own database is typically
    much cheaper than API calls to SaaS applications. Querying your own database will
    not only be faster but will be cheaper.


    Therefore, the cheaper and more sensible option to working with data from APIs
    is to extract it and then use ELT to load into a data lake. Once loaded into the
    lake, you can query your data many times in many different ways using SQL (or
    another data processing language supported by the warehouse engine). Since you
    are not hitting the underlying source directly, you lose a touch of data freshness.
    But, this trade-off earns you speed and cost savings. It''s possible to query
    with the power and flexibility of SQL or any BI product used—the costs don''t
    increase considerably with each chart unlike multiple pings to the API source
    was extracted from.


    ![](img/07b10ae3f84ebfc0356cf70f4bf08c9e_66_0.png)


    Figure 4.3 A dashboard using data from various data sources.


    ## Performance


    Source data might be from an actual production database, which could affect the
    performance of the application that it is powering. Queries that demand a lot
    of data and calculations such as aggregations are not optimally run on transactional
    databases (Figure 4.4).


    Data lakes ideally handle these types of ad-hoc analytical queries independently
    of the production environment. It''s possible to scale up resources on a data
    lake to be able to query data even faster. Remember that a data lake is a collection
    of replicas after all. That layer of indirection leads to a more fault-tolerant
    data stack.


    ![](img/07b10ae3f84ebfc0356cf70f4bf08c9e_67_0.png)


    Figure 4.4 For dashboards that consist of large aggregations a transactional database
    is typically slower than an analytical database.


    ## Future Development


    Collecting all your sources into one data store is a necessary step for building
    the rest of the modern data stack. Doing this dramatically reduces the number
    of headaches suffered from analysis and reporting because many BI products intend
    to only draw from one source anyway. Some BI tools are able to blend sources in
    queries and charts, but it is still more performant (and scalable) to spend the
    time loading your sources into a data lake.


    The value of this may not present itself so clearly, so let us explain with a
    quick peek into the next stage of developing an agile analytics stack. In the
    warehousing stage, much of your effort involves transforming tables and views
    in the data lake to be more clear and consistent. This enables more people to
    use it, causes fewer errors, and results in less duplication of work. This warehouse
    layer of transformations requires a data lake at its foundation.


    ## Chapter Five


    ## Choosing an Engine for the Data Lake


    Lakes typically run on a different database engine than transactional source databases.
    As mentioned, transactional databases such as PostgreSQL or MySQL are optimized
    for doing the massive number of relatively simple queries that are required to
    support a working product.


    Data lakes, however, are usually hosted on what is called a data warehouse engine,
    which is built for more complex analytical queries on larger volumes of data.


    Think of transactional databases as a scooter, and data warehouse engines as a
    semi-truck (Figure 5.1). They''re both valuable vehicles, but clearly have different
    jobs. It is impractical to deliver the mail door to door with a semi-truck, just
    as it is impractical to serve thousands of small requests to different places
    per second from a data warehouse engine. The semi-truck is suited to deliver many
    tons of packages across the country to smaller distribution hubs, much like a
    data warehouse engine is suited to performing big analytical queries to a BI tool.


