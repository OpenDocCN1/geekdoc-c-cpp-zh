    # Snapshots


    Computing and storage is relatively cheap, so we can actually store snapshots
    of what the data was at different times in order to query that data correctly.
    Once again, dbt has our back. You can configure dbt to create timestamped rows
    when a particular value changes so that you can access the data in whichever state
    (Table 13.5).


    TABLE 13.5


    | Id | email | is_active | dbt_valid_from | dbt_valid_to |

    |---|---|---|---|---|

    | 1 | dave@company.com | TRUE | 1/1/2020 | 1/14/2020 |

    | 1 | dave@company.com | FALSE | 1/1/2020 | NULL |


    dbt can be configured to know when to check for new values and which values should
    signal to add a new row to the snapshots.


    # Keep a Data Log


    Some argue to keep track of every update to the DB timestamped in an append-only
    fashion. This makes it possible to recreate the state of the warehouse at any
    given time. You can select whatever part of the database history you want to be
    given a timestamp (WHERE time_stamp > [start] AND time_stamp < [end]). For rows
    where a value changed during this time, you need to consider how that would impact
    your query-and-build models that transform it to be useful. Frankly, tools like
    dbt work with Version control so you can try different paths to getting the modeling
    correct for different types of analyses.


    # Chapter Fourteenth


    ## Managing Data Access


    A fundamental benefit of the data warehouse lies in the self-serve ability of
    data and cross-company access to information. More groups than just the centralized
    data team commonly have access to data warehouses. The data has been cleaned,
    standardized, and organized. It is self-documenting. Anyone with a bit of SQL
    know-how can query tables and extract the information they need. A warehouse improves
    the data literacy across an organization.


    However, companies handle information that you may not want easily accessible,
    especially in health systems or anything similar that manages sensitive information.
    Many security regulations mandating data access rules now exist, such as GDPR,
    and many companies have industry-standard compliance rules that they adhere to
    as well, like SOC and HIPAA. Whether it is personally identifiable information
    (PII) or financial information, sensitive data is much more prevalent throughout
    a product’s journey and the data warehouse than one might think. It’s crucial
    to ensure adequate restrictions on sensitive information in the data warehouse
    are in place.


    Build data restrictions into your warehouse framework as it is built. Even at
    the start of building your warehouse, answer a few common questions:


    - Where is sensitive data (PII and financial) currently handled?

    - Will this sensitive data still be present in the data warehouse and then cleaned
    up?

    - How will this information be removed or restricted from the exposed datasets—scripts
    on the way to the warehouse, data marts created from the warehouse?


    Address these questions before connecting BI tools to the warehouse when sensitive
    information is involved. In the next section are common strategies for securing
    data and anonymizing it. We also touch on good rules of thumb for managing data
    access within BI tools. But note: we recommend that the warehouse do more of the
    heavy lifting.


    It’s significantly more straightforward to forgo selecting a field into a staging
    table or obscuring columns during staging transformations than it is securing
    dashboards for different teams or individuals. And with a few GRANT commands,
    individual tables or schemas in your database can surface to only certain persons
    by default. Also, thinking in terms of staging tables and what kinds of transformations
    in the database can protect sensitive data prepares our infrastructure for organizing
    transformations with data marts, the upcoming (and last) stage of a modern data
    stack we cover in this text.


    For now, let’s explore the warehouse-level methods of securing your warehouse
    (Figure 14.1).


    ![](img/07b10ae3f84ebfc0356cf70f4bf08c9e_174_0.png)


    # How to Secure Sensitive Data in the Data Warehouse


    The most direct way to limit access to the proper people is to enforce rules at
    the warehouse. Create read-only replicas, make custom user groups with different
    access permissions, and fully encrypt particularly sensitive data.


    # Handling Sensitive Data with Managed Solutions


    This area of the book mainly pertains to unmanaged warehouse engines such as Redshift
    that provide much more modularity requiring resource management. For warehouse
    engines like BigQuery and Snowflake, there’s no need to replicate or deal with
    infrastructure because those solutions automatically scale. Therefore, you only
    need to copy the tables or apply access restrictions to the data directly.


    # Read-Only


    As we deal with a read-only replica for the production database and the data lake,
    it''s best practice to set up a warehouse to be read-only by default. Modern data
    modeling with tools like dbt done through transformation layers on top of the
    data. Rather than thinking in terms of UPDATE and DELETE, think in terms of SELECT.


    If nothing else, transformations on source tables should be idempotent. By that,
    we mean you should be able to destroy a table outright and reconstruct the warehouse
    state as it was (assuming no stateful tables like sources or snapshots were irreparably
    lost). The value of this lies in resilience but also simplicity. Analysts can
    think in terms of SELECTs and let the code they manage data for them. Whereas
    one-off stateful commands are difficult to log, anyone reading transformation
    code can see exactly what rows are being removed during table construction (and
    if well-commented, why).


    # Custom User Groups


    Regardless of creating the read-only slave warehouse, create a new user group.
    It''s possible to exclude specific columns from that new user group. Applying
    row-level permissions allows to grant access but restricts rows the person can
    see.


    # Row-level Permissions


    A great example of when to use row-level permissions is adhering to HIPAA compliance
    when accessing a hospital''s dataset (Figure 14.2). Each doctor within this hospital
    has access to


    ![](img/07b10ae3f84ebfc0356cf70f4bf08c9e_176_0.png)

    Figure 14.2 Warehouse resources with security protocols applied.


    patients'' records for analysis and review. However, we want to prevent every
    doctor from having access to every patient. Implementing access controls at the
    row level by account/ ownership (whether that is patient id, patient name) prevents
    doctors from having the chance to access personal information.


    You can apply this example to other groups as well: sales teams, customer tracking,
    and employee records. This gets complicated, and we recommend avoiding it if you
    can in the warehouse stage. Try using marts in the next section instead.


    # Hash Sensitive Data


    When grouping or aggregating sensitive data, creating hashed versions of the data
    is a reasonable option.


    # Hashing


    Hashing is the process of inputting any string and getting back a consistently
    long string that is random and called a hash. Incrementing the original number
    or changing one letter in the string should produce a hash that is completely
    unrelated to the previous one.


    For example:


    ```

    abc -> hash function -> deia8f9e

    ab -> hash function -> 32131mo

    ```


    Then users can create summary tables where sensitive metrics, like financial data,
    can be aggregated to a level that is appropriate for different departments to
    see. The level of security implemented will limit what type of analysis can be
    performed on the data, but does ensure that the sensitive data is protected.


    # Pseudo-Anonymize Data


    One option that mitigates the risk of unintended disclosure involves pseudo-anonymizing
    PI (personally identifiable information) as names or addresses, especially when
    the end consumer of data is a third party. An example would be to remove the names
    and addresses of patients from a view, so they are unidentifiable by anyone accessing
    their data in the warehouse.


    # How to Secure Sensitive Data in a BI Tool


    Setting up the right permissions on the database alone does not prevent the inappropriate
    sharing of sensitive data if you surface

