    \ views）的几个 Salesforce 表合并到一个单一的分层视图中。一个可能的用例是根据通用的个人信息及其在客户公司中的角色，得出联系某人的正确策略。\n\
    \n这是一个相当直接的需求，而且这种关系以后可能会被要求。因此，我们认为构建包含他们的联系方式和基本人口统计信息的表是值得的。这种努力节省了终端用户在数据仓库中查询数据的时间。\n\
    \n该查询可能看起来如图 10.9 所示。\n\n我们从所有可能的列中选择一个子集，并对表进行汇总/去规范化处理，以便他人查询。当我们继续合并数据并提高其可用性时，\n\
    \n## 分层模式 (Staging Schemas)\n\n![](img/07b10ae3f84ebfc0356cf70f4bf08c9e_145_0.png)\n\
    \n图 10.9 一个典型的 SQL 查询，将表去规范化到新结构中。\n\n我们正在构建数据仓库；分层步骤允许我们从底向上进行构建。\n\n组装一套物化视图库，相比于存在公司共享目录中的即时\
    \ SQL 文件（或者更糟糕的复制粘贴 SQL 代码），是一个巨大的改进。然而，这种策略也有其局限性。日益复杂的视图倾向于从许多表中提取数据。不仅如此，很难跟踪数据库中当前运行的是哪个版本的物化视图。\n\
    \n例如，假设你和你的团队决定重构查询会更好。你花费了大量时间更新最初构建视图的 SQL 查询。完成后，你删除了之前的模型版本并构建了这个新模型。但是，问题出现了：新版本中有一个错误。你的团队中有人保存过旧版本吗？你手忙脚乱地寻找是否有地方保存过之前的代码版本。在你这样做时，你的头痛变得越来越剧烈。\n\
    \n想象一下在多人团队中遇到这类问题。为了让协作分析和数据仓库真正蓬勃发展，你的团队应该使用将代码存储在文件中并进行版本控制的工具。在我们列愿清单时，想象一下对可用代码进行模板化并通过测试框架支持你的数据库会什么样。我们可以请求的功能非常多。\n\
    \n幸运的是，dbt（Fishtown analytics 的“数据构建工具”）的发明正是为了解决这些恰恰对应的问题。\n\n## 第十一章\n\n## 使用\
    \ dbt 处理模型数据\n\ndbt 是一个围绕你的 SQL 文件构建的轻量级但强大的开源工具。查看他们的在线文档如何安装并开始使用它。\n\n现在，考虑到你可以在没有工具的情况下构建分层模式，但这样做是不高效的。dbt\
    \ 使用了名为 Jinja 的模板语言来包装 SQL，以允许团队在大规模范围内进行转换。\n\n### 版本控制 (Version Control)\n\n\
    数据建模是一个持续的过程。我们需要一种方式来更新建模代码并使其易于管理。开发人员经常希望复用代码，分析师也是如此。毕竟，大多数公司都使用类似的工具，其他开发者创建了非常有用的包，我们可以免费使用。某些包可以帮助数据栈变得更具管理性，另一些则提供了我们需要的函数。dbt\
    \ 拥有一个强大的社区。每当出现可以用代码解决的数据挑战时，先检查那里是否存在相应的包。\n\n### 文件组织 (Organizing Files)\n\n\
    要用 dbt 建模数据，我们需要一系列 SQL 类型的文件（后缀为 .sql），dbt 保持这些整洁的 YAML 类型文件（后缀为 .yaml）。\n\n\
    ### YAML\n\nYAML 代表“YAML 不是标记语言”。YAML 文件的扩展名是 .yml 或 .yaml。这些文件通常用于配置。\n\n###\
    \ 宏 (Macros)\n\n对于 ID 字段、电子邮件和其他应该是唯一的字段，通过在 dbt 中编写唯一性测试来设置测试。该测试检查指定列中是否有任何重复值。更多信息可以在\
    \ dbt 的测试文档中找到。\n\n### Jinja\n\nJinja 是一种模板语言，允许你在 SQL 中使用如循环和条件判断等逻辑。\n\n###\
    \ 增量表 (Incremental Tables)\n\n为了协助性能，dbt 支持增量模型，它们通过向表中添加新行，而不是每次都重建整个表。\n\n###\
    \ 测试 (Testing)\n\n所谓“垃圾进，垃圾出”。dbt 提供开箱即用的测试以确保数据符合标准。我们可以对我们的源（sources）和构建的模型进行测试。常见的测试检查唯一性、空值、接受值以及字段是否存在于另一个表中。然而，dbt\
    \ 也允许你构建自己的自定义测试，也可以从其中心引入预构建的测试。\n\n让我们涵盖每个基础测试，以便在源和架构中实施。\n\n### 唯一性 (Uniqueness)\n\
    \n对于 ID 字段、电子邮件和其他应该是唯一的字段，通过在 dbt 中编写唯一性测试来设置测试。该测试检查指定列中是否有任何重复值。所有 dbt 测试都在定义源和模型的\
    \ *.yml 文件中。\n\n### 非空 (Not Null)\n\n对于 ID 字段、日期字段、布尔值和表中的键字段编写测试以确保这些列没有空值。如果在列中发现了非空值，则测试将无法通过。\n\
    \n"
