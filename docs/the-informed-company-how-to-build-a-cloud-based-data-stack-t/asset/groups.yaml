    ## 第八章


    ## 现代与传统数据栈：发生了什么变化？


    发生了什么变化？


    本书有意地以简单的方式概述了如何构建现代技术栈，但对于那些在数据领域工作多年的人来说，其中某些内容可能具有争议。这些策略中的许多你可能已经知晓，但很少有被完整发表。我们希望拓宽关于数据建模的讨论，并将分析的共同目标转向帮助他人利用数据来获取洞察。


    ## 现代与传统数据栈：发生了什么变化？


    数据领域发生了许多变化，使我们能够减少受技术的束缚，并更加以用户为中心。数据变化的主要驱动力是数据量、需求和用户群的增长，加上成本的大幅下降。


    ## 存储和计算价格持续下降


    存储和计算数据的成本一直在急剧下降。驱动这些成本下降的主要因素是过去几十年里架构和硬件的突破。


    ### 架构


    - 云端——廉价、易于访问且易于扩展

    - C-Store——列式数据库

    - 大规模并行处理 (MPP)

    - 存储与计算分离


    ### 硬件


    - SSD

    - 向量化处理（GPUs）以及现在的 CPUs

    - 存储和计算硬件成本的持续降低


    这些进步使得针对存储和性能的优化不再那么有用。


    ## 数据湖被加入技术栈，ELT 取代了 ETL


    数据湖是一个稳定的停点，而且不容易出错。此外，如果你必须在模型中重做某些工作，你不需要返回源头重新提取并加载以获取原始原始数据。你已经拥有它了。这可以节省大量的成本和时间，并提供灵活性。


    此外，这允许你使用简单的 SQL 进行建模，并让业务分析师（这些数据的终端用户）能够很好地完成工作，而无需依赖数据工程师。


    ## 数据日益民主化


    每个人都想要数据来支持他们的决策。这意味着数据的终端用户从分析师扩展到了每一个人。这种需求导致了针对特定问题的数据工具的爆炸式增长，你拥有的每一个 SaaS
    工具，都必须分离出可以使用的数据。这些额外的数据源现在是技术栈的一部分，而将它们传输到湖中的 ELT 过程是实现组织数据驱动化的关键。


    ## 第十九章


    ## 行式与列式数据库


    我们想花一点时间讨论为什么列式数据库在分析中性能更高，因为这将是你数据栈的核心。组织关系型数据库有两种方式：


    - 行式

    - 列式（也称为 columnar 或 C-store）


    行式数据库是按记录组织数据的，它将与记录相关的所有数据在内存中相邻存储。行式数据库是组织数据的传统方式，并且仍然为快速存储数据提供了一些关键优势。它们针对高效地读写行进行了优化。


    ## 行式与列式数据库


    常见的行式数据库：


    - Postgres

    - MySQL


    列式数据库是按字段组织数据的，它将与字段相关的所有数据在内存中相邻存储。列式数据库的日益越来越高，并在查询数据方面提供了性能优势。它们针对对列进行高效读取和计算进行了优化。


    常见的列式数据库：


    - Redshift

    - BigQuery

    - Snowflake


    ## 行式数据库


    传统的数据库管理系统是为了存储数据而创建的。它们针对读写单行数据进行了优化，这导致了一系列设计选择，包括采用行存储架构。


    在行存储（或行式数据库）中，数据是按行存储的，使得某行的第一列将紧挨上一行的最后一列。


    例如，让我们看看表 19.1 中的 Facebook_Friends 数据。


    TABLE 19.1 Facebook_Friends


    | Name | City | Age |

    |---|---|---|

    | Matt | Los Angeles | 27 |

    | Dave | San Francisco | 30 |

    | Tim | Oakland | 33 |


    这些数据将存储在行式数据库的磁盘上，并按行排序，如表 19.2所示。


    TABLE 19.2


    | Name | City | Age |

    |---|---|---|

    | Matt | Los Angeles | 27 |

    | Dave | San Francisco | 30 |

    | Tim | Oakland | 33 |


    这允许你使用简单的 SQL 进行建模，并让业务分析师（这些数据的终端用户）能够很好地完成工作，而无需依赖数据工程师。


    ## 写入行数据库


    如果我们想添加新记录（表 19.3），我们只需要将其附加到数据的末尾。


    TABLE 19.3


    | Name | City | Age |

    |---|---|---|

    | Matt | Los Angeles | 27 |

    | Dave | San Francisco | 30 |

    | Tim | Oakland | 33 |


    TABLE 19.4


    | Name | City | Age |

    |---|---|---|

    | Matt | Los Angeles | 27 |

    | Dave | San Francisco | 30 |

    | Tim | Oakland | 33 |

    | Jen | Vancouver | 30 |


    TABLE 19.5


    | Name | City | Age |

    |---|---|---|

    | Matt | Los Angeles | 27 |

    | Dave | San Francisco | 30 |

    | Tim | Oakland | 33 |

    | Jen | Vancouver | 30 |


    行式数据库仍被用于事务处理 (OLTP)。然而，对于分析处理 (OLAP)，它们速度较慢。


    ## 从行数据库读取


    为了获取年龄总和，计算机只需要访问一个磁盘（磁盘 3）并汇总其中所有的值。不需要拉入额外的内存。


    TABLE 19.6


    | Name | City | Age |

    |---|---|---|

    | Matt | Los Angeles | 27 |

    | Dave | San Francisco | 30 |

    | Tim | Oakland | 33 |


    TABLE 19.7


    | Name | City | Age |

    |---|---|---|

    | Matt | Los Angeles | 27 |

    | Dave | San Francisco | 30 |

    | Tim | Oakland | 33 |


    TABLE 19.8


    | Name | City | Age |

    |---|---|---|

    | Matt | Los Angeles | 27 |

    | Dave | San Francisco | 30 |

    | Tim | Oakland | 33 |


    TABLE 19.9


    | Name | City | Age |

    |---|---|---|

    | Jen | Vancouver | 30 |


    TABLE 19.10


    | Name | City | Age |

    |---|---|---|

    | Matt | Los Angeles | 27 |

    | Dave | San Francisco | 30 |

    | Tim | Oakland | 33 |

    | Jen | Vancouver | 30 |


    虽然这略有简化，但它说明了按列组织数据可以减少需要访问的磁盘数量，并尽量减少放入内存的额外数据。


    ## 将数据编码为更紧凑的形式


    让我们首先检查一种可以用于行式或列式数据库的编码技术。以一个包含美国各州的数据列为例。我们可以使用字典和位图编码：


    - 有 50 个州，因此我们可以用 6 位对整个数据库进行编码，因为提供了 64 种唯一模式。

    - 存储实际缩写需要 16 位，这将为两个 ASCII 字符中的每一个提供 256 种唯一模式。

    - 最糟糕的是，如果我们存储全名，长度将是可变的，需要的比特将多得多。


    现在让我们看看游程编码 (Run-length encoding)。它允许将任何相同值的序列替换为计数和值指示器。例如，我们可以将 aaaab 替换为 4a1b。在创建具有排序列（即所有相同值相邻）的投影时，这种方法变得更加强大。


    ## 压缩数据


    如果每条数据的比特长度相同，那么所有数据都可以进一步压缩为：数据数量乘以单条数据的比特数。


