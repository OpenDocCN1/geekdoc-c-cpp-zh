    # Why Build a Data Lake?


    data should be kept apart. For example, it may make sense from a product perspective
    that content marketing data should be in Hubspot, sales records should be in Salesforce,
    and trial engagement data should be in a transactional database. To analyze functional
    and attribution models, however, these sources must be put together in some common
    data store. When all data resides in a single warehouse engine, queries can access
    all data in one language. Not only is the programming more straightforward, but
    also you make it easier to do cross-source analyses.


    # JOINing


    In the source stage, we explained blending options with BI tools. A BI tool can
    connect to several sources and some can combine these different sources so that
    it is ready for visualization in a chart. But, the data processing capabilities
    of BI tools are limited. Many require data to be prepared before being able to
    visualize effectively.


    After combining sources into a singular data lake, collective analysis over total
    organizational information becomes simpler. Once data exists in the same place,
    queries join across different sources, no additional loading required. The data
    lake kills the need to prepare sources for future joins. For example, a single
    ad-hoc query on a data lake can display how many tickets (from Zendesk) were filed
    by power users (from an application DB) who work at enterprise companies (from
    Salesforce). A lake makes joining data from disparate data sources much easier.


    # Robust Query Writing


    The applications a business uses likely offer transactional API access to the
    data. Usually, these applications are not optimized for reporting or analysis.
    So, unless the data is exported and put into some standard format, it becomes
    increasingly difficult to use that source in analyses. Sometimes, source-specific
    APIs can also become prohibitively expensive, if used directly for reporting.
    APIs often have a free tier in terms of how often and how much data you can request;
    then they limit usage unless you start paying them a fee.'
