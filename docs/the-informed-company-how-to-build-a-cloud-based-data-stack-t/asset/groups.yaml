    # Staging Schemas


    AUTHORIZATION company;

    GRANT ALL ON SCHEMA mymodels TO company;

    GRANT ALL ON SCHEMA mymodels TO company;


    Usually, tables are referenced FROM statements using the format of schema_name.table_name.
    If a table is missing a schema name prefix, SQL engines automatically prefix the
    table name with the schema name "public". Sometimes, warehouse find it convenient
    to set their warehouse''s default schema name to something other than "public":


    ```

    SET search_path TO trials;

    ```


    Now, the warehouse engine will assume that all table name references without a
    schema name live in "trials." Databases today can even support multiple schemas
    in the default search path:


    ```

    SET search_path TO trials, public;

    ```


    After running this command, a warehouse engine will check the trials and public
    schemas (in this order) for tables that are named without "schema_name." prefix.


    Okay, now that our trial schema exists, we can add tables (again remember, tables
    here can mean tables and materialized views). Altogether the code might look something
    like what is shown in Figure 10.8.


    Running these instructions into a SQL workbench or an API (e.g. via a SQL library
    called in a Python script) will create a materialized view that you, and anyone
    with access, SELECT from future queries or materialized views.


