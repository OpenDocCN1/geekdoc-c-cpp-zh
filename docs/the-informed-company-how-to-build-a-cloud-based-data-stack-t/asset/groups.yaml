    # Snowflake


    Figure 5.5


    # Pros


    Like BigQuery, Snowflake (Figure 5.5) has an architecture that separates the compute
    query engine from data storage. As a result, it is highly scalable at any amount
    of volume and concurrency. Pricing is based on the storage and compute used on
    a time-basis with their virtual databases instead of per bytes scanned. Tuning,
    indexes, and distribution keys aren''t required for queries to be optimized and
    performant. Because of these reasons, it can be said that Snowflake has many of
    the benefits of Redshift and BigQuery.


    # Cons


    Snowflake is a relatively new database in the market. Those familiar with SQL
    functions supported by databases like Redshift or PostgreSQL may find some inconsistencies
    in the SQL syntax for Snowflake. Snowflake is also generally more expensive.


    # Database Engines


    For smaller amounts of data, less than 10GB, it''s possible to use a transactional
    database for a data lake, but this limits the potential to scale in the future.


