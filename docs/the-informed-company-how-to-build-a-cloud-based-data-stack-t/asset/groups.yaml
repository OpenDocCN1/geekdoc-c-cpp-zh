    \n# Chapter Twelve\n\n## Deploy Modeling Code\n\nWhile building staging schemas\
    \ begins as the warehouse lead's responsibility, no one is a perfect data modeler.\
    \ It is best to catch errors and omissions in modeling code as it is being built\
    \ rather than debugging the entire single source of truth. In this process, we\
    \ turn to more best practices from the world of software engineering such as comment\
    \ logic in SQL files and leaving proper commit messages for code reviewers to\
    \ understand the intent of your changes and implementation details.\n\n## Branching\
    \ Version Control Software\n\nThere are several version control packages out there\
    \ for you to choose from. We'll assume you're using Git. As we have said, in collaborative\
    \ coding environments, it's imperative that you version control your software.\
    \ A remote backup, hosted, say, through GitHub allows many different people to\
    \ contribute to a code base at once.\n\nUsing Git, you can create a new development\
    \ branch to ensure there is always a degree of separation between the main branch\
    \ of your warehouse transformations and the feature branch you are currently developing\
    \ on (all of these practices are written about in blogs just a web search away).\n\
    \nWhen embarking on a new set of transformations, always create a new branch using\
    \ Git branch -m.\n\n# Commit Message\n\nEventually, someone will work on or around\
    \ code that someone else has written. When batches of changes to a shared coding\
    \ project are committed, or saved, to the project, they are labeled with a commit\
    \ message. These are short messages that communicate at a high level what changes\
    \ were made and why. As an example:\n\nGit commit -m \"Removed External Id column\
    \ to make table easier for business users\"\n\nGiving the reasoning helps people\
    \ who are reviewing your code assess whether or not your code changes achieved\
    \ your goal.\n\n# Test Locally\n\nAs a best practice and basic engineering principle,\
    \ always test development changes without pushing changes to production. Create\
    \ a local development environment within a dbt project that creates models in\
    \ a schema separate from the one used for reports and analyses. Changes can be\
    \ tested by running dbt locally and querying it from an IDE to explore the data\
    \ before creating a request to submit code changes. This process captures mistakes\
    \ from typos to dbt tests that didn't pass due to a bad join.\n\ndbt thankfully\
    \ makes it easy to manage separate development and production environments.\n\n\
    # Code Review\n\nCode review reviewed before merging it. This is standard practice\
    \ in software engineering and is being widely adopted in data teams. This means\
    \ that before your modeling code is going to reflect on the actual database that\
    \ you and the rest of your company are using, someone else will verify what you\
    \ have done, leave comments if they have questions, and approve (or reject) changes\
    \ based on their understanding of how it works.\n\nCode reviews take place in\
    \ pull requests. We encourage you to consult any of the great tutorials on how\
    \ to accomplish this already out there. See GitHub's own guide on the subject.\n\
    \nThis fits into a larger agile workflow as visualized in Figure 12.1.\n\n![](img/07b10ae3f84ebfc0356cf70f4bf08c9e_158_0.png)\n\
    \nFigure 12.1 Diagram showing the process lifecycle of model updates.\n\n# Schedule\
    \ Runs\n\nOnce the code is approved, the model still needs to be run before the\
    \ new schema will actually be created. We can coordinate with engineering if they\
