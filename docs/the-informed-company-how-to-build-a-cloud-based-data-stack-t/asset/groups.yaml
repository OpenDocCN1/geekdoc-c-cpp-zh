    ## 保留准确历史


    当数据行被更新时，我们会丢失这些信息。可能一个客户从较小计划升级到了高级计划，我们数据库中的计划字段可能被覆盖了。如果数据库中仅存在他们当前的计划，我们无法识别这种扩张，也无法回溯该客户在两年前的收入可能是。


