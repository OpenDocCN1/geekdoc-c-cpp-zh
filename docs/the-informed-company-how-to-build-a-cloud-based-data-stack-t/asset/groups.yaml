    ### 缺点


    用户可能会因为配置不完整或当许多用户访问数据库产生大量查询时，在 Redshift 上遇到并发问题。Redshift 可能需要持续的维护，以调整集群大小、定义排序键和清理（vacuum）数据。


    像许多 AWS 服务一样，有方法通过工作负载管理、压缩和分区来定制配置。然而，使用这些高级功能并不是非常开箱即用的”。虽然 Redshift 功能非常强大，但它可能需要数据工程团队的专用资源来优化性能。


    ## 清理 (Vacuuming)


    从数据库中删除数据时，数据并不一定立即从存储中移除。在某些系统中，数据被“标记”而不是完全删除。在处理新请求时，在未来的读取操作期间需要额外的工作来过滤“标记”数据。随着时间的推移，随着更多“标记”数据的积累，这将影响请求的读取性能。清理（Vacuuming）是某些仓库引擎要求的常见维护任务，通过删除“标记”数据，通常可以提高性能。


    ## Google BigQuery


    ### 优点


    BigQuery（图 5.4）不受存储集群或计算资源集群容量的限制，因此在并发需求增加时（例如有更多用户和查询访问数据库），它的扩展性和性能非常好。作为一个全托管数据库，BigQuery
    会自行处理清理和大小调整，这可以为数据工程师节省时间并使其易于使用和维护。对于使用 Google 产品的企业，BigQuery 与 Google Drive、Google
    Billing 和 Google Analytics 集成良好。


    ### 缺点


    成本按查询字节确定，这使得对于对数据运行运行即席查询的用户来说很难进行预算或监管。为了防止即席查询导致成本失控，请利用 BigQuery 的成本控制。实施成本控制会限制执行的分析量，因为它限制了可能运行的查询。它还有一些非标准语法。虽然有些人偏好它，但它确实有学习曲线，并且工作方式不同。


    ![](img/07b10ae3f84ebfc0356cf70f4bf08c9e_77_0.png)


    图 5.4


    ## Snowflake


    图 5.5


    ### 优点


    像 BigQuery 一样，Snowflake（图 5.5）具有将计算查询引擎与数据存储分离的架构。因此，它在任何容量和并发下都具有高度的可扩展性。定价是基于虚拟数据库按时间计算的已存储和计算，而不是按扫描字节数。查询优化和实现高性能不需要调优、索引和分布键。由于这些原因，可以说
    Snowflake 具有 Redshift 和 BigQuery 的许多优点。


    ### 缺点


    Snowflake 是市场中一个相对较新的数据库。熟悉 Redshift 或 PostgreSQL 等数据库支持的 SQL 函数的人可能会发现 Snowflake
    的 SQL 语法中存在一些不一致之处。Snowflake 的价格通常更贵。


    ## 数据库引擎


    对于较少的数据（小于 10GB），可以使用事务型数据库作为数据湖，但这限制了未来扩展的潜力。


    ## PostgreSQL


    ### 优点


    与之前列出的选项不同，PostgreSQL（图 5.6）是一个免费下载的开源数据库。它可以轻松地在本地服务器上启动，或托管在 AWS 等各种云服务上。PostgreSQL
    还具有符合 ANSI 标准的 SQL 库，且 AWS 支持广泛的第三方和用户定义函数库。作为一个事务型数据库，它的写入速度非常快，并且在 1000 万行以下也有快速的读取速度。


    ### 缺点


    PostgreSQL 是一个行式数据库，通常在分析查询方面表现不佳。它非常适合事务数据，但对于超过 1TB 的数据量不是良好选择。


    ## 为数据湖选择引擎


