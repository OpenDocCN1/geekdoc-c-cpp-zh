    during future read operations. Over time, as more “marked” data accumulates, this
    ends up impacting read performance of requests. Vacuuming is a common maintenance
    task required by some warehouse engines that deletes “marked” data, generally
    improving performance.


    # Google BigQuery


    # Pros


    BigQuery (Figure 5.4) is not bound by cluster capacity of storage or compute resources,
    so it scales and performs very well with increasing demands for concurrency (e.g.
    more users and queries accessing the database). As a fully managed database, BigQuery
    handles vacuums and resizing on its own, which can save time for data engineers
    and make it easy to use and maintain. For businesses using Google products, BigQuery
    integrates well with Google Drive, Google Billing, and Google Analytics.


    # Cons


    Cost is determined per query byte, making it difficult to budget or regulate for
    users who run ad-hoc queries against their data. To keep costs from getting out
    of control from ad-hoc queries, leverage BigQuery''s cost controls. Implementing
    cost controls can restrict the amount of analysis that''s performed because it
    limits the queries that potentially run. It also has some nonstandard syntax.
    While some prefer it, it does have a learning curve and a different way of working
    with it.


