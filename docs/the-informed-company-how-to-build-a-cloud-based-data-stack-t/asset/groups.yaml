    # Resolve Conflicting Numbers


    Sometimes metrics show different numbers even though they measure the same thing
    (Figure 15.5). For example, when the number of new trials in HubSpot is different
    from the production database, the rule of thumb is to trust the data source closest
    to the event that tracks it. In this case, it would be the production database:


    ```

    SELECT

    SUM(arr)

    FROM

    app.users

    WHERE

    trial_start > NOW()::date - 7

    AND email != "%chartio.com%"

    ```


    Vs.


    ```

    SELECT

    SUM(arr)

    FROM

    app.users

    WHERE

    trial_start > NOW()::date - 7

    ```'
