    # S3


    S3 is the Simple Storage System provided by Amazon Web Services. It''s designed
    to store files of all sizes providing access through an HTTP layer.


    Standardizing a data lake on a warehouse engine solves a lot of immediate needs
    for performance and, at the same time, simplifies access through the unification
    of data sources. Not only are there plenty of warehouse engine services offerings,
    but the cost of these services has never been more affordable. Also, using a warehouse
