- md: "\n# Tuning to Optimize\n\nAs a company grows, the data that is queried changes,\
    \ too. New data, new analysts, and new business objectives will shift what data\
    \ is being queried. The original structure of Data Warehouse objects may need\
    \ to be reconfigured to optimize usage and performance based on how it is queried.\n\
    \nDifferent data warehouses will have options to check performance, but most offer\
    \ ways to:\n\n- Scale up the cluster.\n- Materialize expensive views.\n\n# Add\
    \ Clusters\n\nThe fastest way to get more performance is to simply add clusters\
    \ to the warehouse engine. Many have settings that allow for automatically adding\
    \ additional clusters if there are many concurrent queries taking place. For others,\
    \ you may need to specify exactly how many clusters to spin up for your instance.\n\
    \n![](img/07b10ae3f84ebfc0356cf70f4bf08c9e_193_0.png)\n\nA cluster is the compute\
    \ resource for a data warehouse engine. It can have several nodes that coordinate\
    \ the computation needed. Many can be used to perform aggregations for multiple\
    \ people at the same time.\n\n# Materialize Expensive Views\n\nCreating the single\
    \ source of truth helps users unfamiliar with the structure of the data by consolidating\
    \ what they need to query to a single place. However, if any tables are being\
    \ joined to build these helpful views, we may run into some performance issues.\
    \ There are now a multitude of views within the DAG that people are querying from,\
    \ so which views might benefit from being materialized? Oftimes, the final views\
    \ being materialized can help. In addition, look for places in the DAG where many\
    \ sources flow into one view. Joins can be expensive on columnar databases, so\
    \ try materializing those to see if it improves performance.\n\n# Code Review\
    \ All Modeling\n\nModeling code changes should always be submitted in a pull request\
    \ and reviewed by a colleague and the Warehouse Lead before being merged to the\
    \ master branch (Figure 15.8). This will ensure that any code has fewer mistakes,\
    \ follows the proper conventions, and is communicated to the team.\n\n![](img/07b10ae3f84ebfc0356cf70f4bf08c9e_194_0.png)\n\
    \nFigure 15.8 Any modeling code should be peer reviewed before it is incorporated\
    \ into the schema.\n\nHere is a summary of things to look out for when reviewing\
    \ a colleague's code changes:\n\n- Is the code following naming and coding conventions?\n\
    - Have dbt tests been added as needed?\n- Do the proposed changes make the data\
    \ cleaner or easier to use or accomplish a defined purpose?\n- Does the data return\
    \ expected results?\n- Have all model dependencies been considered?\n- Are there\
    \ any typos or syntax errors?\n\nAdditionally, dbt has a great article on reviewing\
    \ analytics pull requests.\n\n# Maintenance Checklist\n\nA single source of truth\
    \ data warehouse is a worthwhile investment. However, without maintenance, it\
    \ will fall into disarray and lose its value.\n\n- As metrics are added, make\
    \ sure they're named properly.\n- As metrics are deemed no longer useful, make\
    \ sure they're removed to avoid confusion.\n- As metrics need to be updated/pre-aggregated,\
    \ remember to name them properly.\n- Keeping user permissions appropriate and\
    \ accurate will free up database admins to focus on important projects as well\
    \ as avoid data being removed accidentally.\n\n- Considering the restructuring\
    \ of data warehouse objects will help create a suitable structure for analysis\
    \ and complex querying along with cutting down performance cost.\n- The worthwhile\
    \ investment of a data engineer to perform said maintenance tasks will remove\
    \ the bottleneck of incorrect analytics from a neglected warehouse.\n\n# STAGE\
    \ 4\nDATA MARTS\naka Data Democratized\n\n![](img/07b10ae3f84ebfc0356cf70f4bf08c9e_198_0.png)\n\
    \n# Mart Stage Overview\n\nAt long last, we've arrived at the top of the data\
    \ stack. For these final pages, we consider what makes a data mart. That is, we\
    \ discuss how to further structure and group data in your warehouse not only to\
    \ meet one set of needs, but to meet the needs of a number of departments whose\
    \ business logic may differ from another.\n\n# Stage 4: Data Marts\n\nMore data\
    \ and more schemas will eventually make the data warehouse difficult to navigate.\
    \ A data mart is a filtered (and sometimes aggregated) subsection of a data warehouse\
    \ that makes it easier for a particular group to query data. It provides a smaller\
    \ schema with only the relevant tables for that group.\n\n# Overview of Building\
    \ Data Marts\n\nFor warehouses, we needed a warehouse lead to implement the modeling.\
    \ For data marts, we'll need multiple mart leads. They will determine which tables\
    \ from the data warehouse are needed for their individual marts (Figure P.1).\
    \ The mart leads can then customize tables for different cases. Aggregations,\
    \ metric calculations, and PII can be handled individually for teams. However,\
    \ if there is a metric that needs to be used by multiple teams, the warehouse\
    \ lead should implement it on the data warehouse.\n\n> Figure P.1 Data marts subsections\
    \ of a warehouse schema.\n\n![](img/07b10ae3f84ebfc0356cf70f4bf08c9e_199_0.png)\n\
    \nOne of the main benefits of setting up a data mart accurately is the ability\
    \ to scale. There are more people tracking data quality, and data is limited for\
    \ each team, reducing potential security concerns.\n\n# Center Around Business\
    \ Use Cases\n\nAs an organization scales the amount of data it is tracking, the\
    \ number of people who want to access it scales, too. This results in in more\
    \ people with less context in a large portion of the schema.\n\nWe want to go\
    \ from a large complex schema (Figure P.2) to a series of focused schemas, where\
    \ each department can quickly find the data they need (Figure P.3).\n\n![](img/07b10ae3f84ebfc0356cf70f4bf08c9e_200_0.png)\n\
    \nFigure P.2 An entire data warehouse schema.\n\n# Stage 4 Data Marts: aka Data\
    \ Democratized\n\n![](img/07b10ae3f84ebfc0356cf70f4bf08c9e_201_0.png)\n\nFigure\
    \ P.3 A data warehouse schema sectioned off for each department's data mart.\n\
    \nFigure P.4 Data warehouse inventory by department needs.\n\n| TABLE | PRODUCT\
    \ | MARKETING | SALES |\n| :--- | :---: | :---: | :---: |\n| USER | ✓ | × | ✓\
    \ |\n| MARKETING CHANNEL | × | ✓ | ✓ |\n| LEADS | × | ✓ | ✓ |\n\nSo while going\
    \ from lake to warehouse was mostly about cleaning up tables, going from warehouse\
    \ to marts is about centering schemas and tables around business processes and\
    \ teams. Different departments need different parts of the data warehouse (Figure\
    \ P.4).\n\nData mart schemas are not very different from warehouses because the\
    \ data should already be understandable from the cleaning done in the warehouse\
    \ stage. Data marts further simplify the schema for people within departments\
    \ to find what they need. Build it by creating views that create schemas on top\
    \ of the warehouse.\n\nNow how much you do further transformations depends on\
    \ your BI tool. Most BI tools have the ability to create calculated fields and\
    \ create self-serve data sets. Some tools such as Looker require you to model\
    \ the data using their own proprietary language to prepare it for analysis. Others\
    \ allow you to browse multiple schemas at once and combine data however you want,\
    \ even for an individual chart, potentially using multiple sources of data on\
    \ a single dashboard.\n\nWhatever your BI tool of choice, consider how to enrich\
    \ data with calculated fields and join in additional categorical variables that\
    \ may aid in their department-specific analysis.\n\n# Chapter Sixteen\n\n Data\
    \ Mart Implementation\n\nData warehouses have numerous schemas that can become\
    \ difficult to navigate. One department alone such as marketing may have tens\
    \ if not over a hundred tables; combined with all the tables for sales, finance,\
    \ HR, production, and customer support, it can get overwhelming. Moving from a\
    \ data warehouse to data marts makes it easier for users to find the data they\
    \ need for their business process or use case.\n\nData marts can be created in\
    \ three steps.\n\n# Views on the Data Warehouse\n\nCreate new views by selecting\
    \ the relevant data from the data warehouse (Figure 16.1) to build out each data\
    \ mart:\n"
