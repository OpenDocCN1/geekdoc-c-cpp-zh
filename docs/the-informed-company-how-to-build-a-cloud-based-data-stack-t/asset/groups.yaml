    # Chapter Eleven


    # # Model Data with dbt


    dbt is a lightweight but powerful open source tool built around your SQL files.
    Consult their online docs on how to install and get started with it. Don''t worry,
    we''re not selling you anything—the tool is free and open source.


    Now, consider that you could build staging schemas without a modeling tool, but
    it would not be efficient for all the reasons we described earlier. dbt wraps
    SQL with bookkeeping and a template language called Jinja precisely to enable
    teams to write all the transformations they dream up and manage them at scale.


    We''ll dive into some of the central features packaged in dbt.


    # ## Version Control


    Modeling data is an ongoing process. We need a way to update how the modeling
    code is working and make it easy to see how'
