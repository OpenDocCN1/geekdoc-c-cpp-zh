    ## Combine Tables Across Schemas


    Take, for example, a company tracks sign-ups via Hubspot, and after a year, decides
    to switch to Salesforce. The Salesforce table has no record of the sign-ups that
    occurred in the past that were tracked by Hubspot. When an analyst attempts to
    query for sign-ups, it is unclear which data source they should use and how they
    might combine properly (Figure 13.6).


    Companies end up using new tools to track the same type of data. In these instances,
    migrate the data from the previous tools into the latest tool. If this is not
    an option, use the data warehouse to create a view that UNIONs the data from both
    sources (Figure 13.7).


    Figure 13.6


    ![](img/07b10ae3f84ebfc0356cf70f4bf08c9e_166_0.png)


    Consolidating data sources ensures the historical records are not lost and creates
    one location for relevant metrics. Compounding data sources this way requires
    some renaming and cleaning to accomplish.


    | hubspot | | salesforce | | |

    |---|---|---|---|

    | date | sign_ups | date | leads |

    | 2019-05-10 | Tracy | 2019-06-01 | Aaron |

    | 2019-05-21 | Tim | 2019-06-08 | Jaime |


    ```sql

    SELECT date, sign_ups AS "leads"

    FROM hubspot

    UNION ALL

    SELECT date, leads as "leads"

    FROM salesforce

    ```


    | sales_ops | | |

    |---|---|---|

    | date | leads |

    | 2019-05-10 | Tracy |

    | 2019-05-21 | Tim |

    | 2019-06-01 | Aaron |

    | 2019-06-08 | Jaime |


