    # About This Book


    # Why Write This Book


    Most comprehensive books on analytics architecture that we''ve found are over
    a decade old, most of them pre-cloud. Because there really isn''t a modern equivalent
    to Kimball''s seminal The Data Warehouse Toolkit, today''s data teams have to
    reinvent the principles of building a data stack. Too often, they do this without
    guidance. To solve this problem, we have created a best-practices guide for bootstrapping
    and nurturing a technologically current data warehouse.


    # Who This Book Is For


    We wrote this book for whoever values data and believes that informed companies
    are competitive. It''s a book for the working professional who is creating a practical,
    modern data stack. It''s for the lone analyst or the professional embedded in
    a team. It''s for anyone interested in what design practices underlie robust data
    architecture, the kind that keeps entire companies with business intelligence
    insights. At its heart, this book is written with collaboration in mind (Figure
    A.1).'
