    ![](img/07b10ae3f84ebfc0356cf70f4bf08c9e_51_0.png)


    # Create Read-Only Access


    Now that users have access to the replica, make sure they only have read-only
    access. This limits their interaction with the database to only be able to retrieve
    data, not to manipulate it. This will prevent a user from accidentally deleting,
    updating, or adding any data. The ability to manipulate the actual data on the
    database should be reserved for engineers.'
