    on a local server or hosted on various cloud services as AWS. PostgreSQL also
    has an ANSI-compliant SQL library and AWS supports an extensive library of third-party
    and user-defined functions. As it''s a transactional database, it has very fast
    writes and also has fast reads below ~100M rows.


    # Cons


    PostgreSQL is a straightforward, flexible solution that''s different from Snowflake,
    Redshift, and BigQuery because it is a row-oriented database. This means it is
    suited for processing transactional data over analytical queries. It''s a single
    database connection not architected for parallel processing, so it generally doesn''t
    perform well with data volumes over 1TB. Consequently, PostgreSQL is great as
    a database, but is not a good choice for a data lake with a high volume data (>1TB).
    A lot of people do go this route through because they are very familiar with it
    and it is likely what their application is running on.


    # Recommendation


    Selecting a data warehouse engine depends on several factors (Table 5.1). If short-term
