    Assembling an arsenal of materialized views is a fantastic improvement over ad-hoc
    SQL files that exist on a shared company directory (or worse, copy-and-paste SQL
    coding). However, this strategy too has its limits. Increasingly complicated views
    tend to pull from many tables. Not only that, it''s difficult to keep track which
    version of a materialized view currently lives in your database.


    For example, say you and your team decide it''d be better to restructure a query.
    You spent a fair amount of time updating the SQL query that built the view in
    the first place. After it''s finished, you delete the previous version of the
    model and build this new one. But, there''s a problem: the new version has a bug
    in it. Did anyone on your team save the old version? You scramble to see if there''s
    any place that a previous version of the code was saved. As you do this, your
    headache grows worse and worse.'
