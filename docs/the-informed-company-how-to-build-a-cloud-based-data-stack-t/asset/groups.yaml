    ## 如何在 BI 工具中保护敏感数据


    通过仪表板或报告泄露敏感信息。这类问题防范起来具有挑战性，因此常见的策略是在 BI 工具中针对不同的用户组设置策略。但事实上，正如我们之前提到的，敏感数据应该尽早进行脱敏处理。我们建议使用已经提到的策略，以确保报告所引用的模型中的敏感数据已通过脱敏。


    ## 一致的账户审计/清理


    有时，公司的规模需要额外的审计。项目变更、角色变化以及用例都在变化。其中任何一种变化都可能影响员工的权限。过时的权限会导致合规和隐私问题。定期审查和更新权限是保护敏感数据的最佳实践。


    在审计期间，请检查我们之前讨论过的所有问题：


    - 谁有权访问数据源？

    - 谁有权访问敏感的行级信息？

    - 谁在管理员团队或拥有管理员权限？

    - 谁访问或正在查看包含敏感数据的仪表板和报告？


    BI 工具通过应用内不同层级的使用信息为这些问题提供了答案，供管理员监控和审查。如果无法获取所有所需信息，请联系 BI 工具的支持团队。他们可以帮助提取必要的信息，以便对账户安全做出明智决策。尽管情突破边界，因为只要提出要求，获得的信息往往会让你惊讶。确保数据访问受到控制并符合当今需求至关重要。


    ## 第十五章


    ### # 维护事实来源


    现在已经建立了一个已经配置好的数据仓库，下一步以及持续的步骤就是维护。这涉及到确保数据仓库的对象、列、表、视图和架构（schemas）是准确且最新的。维护数据仓库对于组织内的用户轻松、准确地获取数据洞察至关重要。如果不维护，人们将查询错误的数据并得到冲突的结果。


    随着公司数据仓库的久远：


    - 需要跟踪新的指标。

    - 一些旧指标不再需要。

    - 权限需要被授予、更新和撤销（比预期的更多）。

    - 模型将变得不再优化。

    - 有更多的人在建模。


    这些不可避免的问题使公司难以进行分析。为了防止这些问题的出现，需要一位熟悉数据仓库的数据工程师来了解用户是如何查询源数据的。本节将深入探讨这些问题，以及如何通过例行维护来解决它们（图
    15.1）。


    ![](img/07b10ae3f84ebfc0356cf70f4bf08c9e_181_0.png)


    图 15.1


    ## 跟踪新指标


    业务衡量成功的方式随时间变化而改变。新产品发布、用户行为发生变化，新的预测模型需要考虑新数据。业务的成功取决于其对变化的反应能力。有时这意味着创建一个新的计算字段或新的列、视图或表，然后可以将其聚合成为一个指标。


    ## 跟踪新指标


    我们可能会在 Salesforce 的客户信息中添加一个新字段，以符合公司的新目标，例如，通过我们提供的服务跟踪账户活动。从这里，我们可以看到哪些服务最受客户欢迎，然后在看到销量下降的季节性趋势期间对这些服务提供特别促销以增加销售额。


    ## 添加新计算字段的三个考虑因素


    当工程师或分析师创建新表、列或视图来跟踪数据时，他们并没有遵循适合数据仓库的命名规范。这使得不熟悉新指标的分析师在解读时面临困难。


    这种不熟悉还会导致重复工作——例如，为支持团队创建一个视图缺少相关信息，无法区分该视图的用途。想要查询此视图的用户可能不知道它的存在。在这种情况下，其他用户也很可能创建相同视图的新版本来表达相同的信息。


    ### 1. 它应该放在哪里


    一个新的计算字段可能存在多个不同的存放处，决定最佳位置可能是一门艺术。我们是只需要将数据添加到现有表中，还是应该将其添加到视图中或创建一个全新的视图？让我们回顾一下我们这么做的的理由：


    #### 现有表


    - 新计算字段可以很容易被理解和查询，而无需复杂的连接或聚合。


    #### 现有视图*

    - 现有的视图与新计算字段相关。

    - 该视图的聚合方式符合此数据及其依赖的计算字段。

    - 维护事实来源。

    - 复杂的连接路径将使得人们在没有视图的情况下难以准确查询新数据。


    #### 新视图*

    - 不存在与新计算字段相关的现有视图。

    - 没有相关的视图是以符合该计算字段的方式进行聚合的，该字段在没有视图的情况下无法进行聚合。

    - 复杂的连接路径将使得人们难以准确查询新计算字段。


    *通常，它也会被添加到现有表中，但将通过视图进行查询。


    ### 2. 如何进行回填（Backfill）


    每当我们能够确定值应该是什么时，建议进行数据回填（图 15.2）。在分类列中，我们可能根据其他列或明显的默认值来确定该值。如果我们无法确定或没有明显的默认值，请将该值留为空。然而，请考虑
    NULL 的影响，例如在聚合中。如果这影响了分析，请尝试使用“未知”作为替代值以表示无法确定。


    ![](img/07b10ae3f84ebfc0356cf70f4bf08c9e_183_0.png)


    图 15.2 正在进行回填的数据。


    ## 废弃旧指标


    在数值字段中，NULL 的影响可能更大。在带有时间数据的表中，NULL 的负面影响是将分析限制在列被添加的时间之后。


    ### 3. 如何命名它


    数据建模人员在添加新指标时经常忘记遵循他们自己的命名规范。这违背了仓库的意义，因为仓库需要数据保持一致。在创建新列之前，始终检查你的样式指南。


    ## 废弃旧指标


    随着公司的增长，它们使用的工具也会发生变化。多个工具可能包含相似甚至相同的数据，比如同时拥有 HubSpot 和 Salesforce。我们希望防止查询到错误的数据导致他人得出错误的结论。即使数据源保持不变，业务目标也可能发生变化。结果是某些功能或产品可能会被废弃，如果分析师没有意识到，它们相关的指标可能会产生误导。


    ## 显式废弃数据


    虽然删除难以使用的表和列可以防止人们错误使用它们，但有时删除它们并不实际。在这种情况下，我们建议在前面加上“deprecated_（废弃）”或“do_not_use（不要使用）”。


    ## 维护事实来源


    规范让每个人在浏览或查询时清楚地知道它们是否有用（图 15.3）。


    在字段前添加“deprecated_”样式规则是管理分析师聚合指标的最佳方法，因为这对来说来说都很该数据不应该被使用。通过电子邮件或任何 BI 工具让用户知道这些字段和指标不再可用，以避免让人措手不及。再次，命名规范在防止用户错误查询数据方面起着关重要的作用。


    许多 BI 工具还提供查询日志，帮助识别哪些仪表板和图表在使用哪些字段。这使得能够轻松告知他们需要更新查询或废弃图表和仪表板。


    ### 需要维护


    | id | name | #_of_likes | 此指标不再准确 |

    |---|---|---|---|

    | 1 | Matt | 1000 | |

    | 2 | Jeff | 8000 | |


    ### 废弃方案


    | id | name | deprecated_#of_likes | 删除列 / 创建无该列的视图 |

    |---|---|---|---|

    | 1 | Matt | 1000 | |

    | 2 | Jeff | 8000 | |


    图 15.3 一个包含废弃指标的表以及两种重命名策略。


    '
