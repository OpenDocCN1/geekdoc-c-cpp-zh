    \ Cloud. We can create a job and schedule it to run using cron syntax (Figure\
    \ 12.2).\n\n![](img/07b10ae3f84ebfc0356cf70f4bf08c9e_159_0.png)\n\nFigure 12.2\n\
    \n# Chapter Thirteen\n\n## Implementing the Data Warehouse\n\nRemember, staging\
