    # Manage Dependencies


    When staging models, select from their source replicas: we say that the staging
    models “depend” on their respective source replicas. This is the language of mathematical
    graphs. Using the language of graph theory proves an extremely useful tool when
    trying to keep track of dozens, if not hundreds, of data models in a mature warehouse.
    In particular, a large interconnected network of models can be visualized as a
    Directed Acyclic Graph (Figure 13.1).


    Let’s introduce some basic dependency language first. Imagine if node a in Figure
    13.1 were a source replica and node b through e were different kinds of transformations.
    Nodes b through e through nodes b through e are said to be “downstream” from node
    a. So, all transformations are downstream from the source replica represented
    by node a. Likewise, node a is “upstream” of all other models. Models can be more
    or less “upstream” or “downstream” from one another. The power of this tool and
    language lies lies in its ability to visualize the relationship between entities
    that comprise a warehouse.


