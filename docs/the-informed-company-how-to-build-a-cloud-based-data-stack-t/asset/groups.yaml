    Now that the data marts are set up, they will need ongoing maintenance to get
    the most out of your data. The first step is to establish a mart lead per mart
    who will be responsible for carrying out the maintenance tasks for each mart:


    +   - Educate team.

    - Identify issues.

    - Identify new needs.


    Mart leads are ideally part of the business unit that needs the mart. They know
    the context for the data; if Facebook ads spike in their conversion rate, they
    should be the ones who''d know “that’s because we just cut our spend in half and
    removed the nonper-forming ads.” They can communicate with the warehouse lead
    about their teams’ data needs and then communicate and educate the team using
    their mart.'
  - '[PAGE 209]


    They are responsible for identifying issues in the data that exist in their mart.
    They also should be the ones creating requests to get more data sources or tables
    added to their mart. They also should be part of the workflow/ticket system and
    be able to teach others and maybe even respond themselves to tickets/data requests.


    # Educate Team


    Different teams have different needs, but some common threads including SQL skills
    or how to use your BI tool. We wrote a book on how to teach SQL to help with explaining
    JOINS, aggregations, and subqueries work. These concepts are not intuitive to
    most business users; however, they can be taught in relatively short time frame.


    Mart leads should document and share data quirks that show up in common queries.
    Note, however, the warehouse lead should address these quirks with modeling at
    the data warehouse stage.


    # Identifies Issues


    The mart lead should investigate anything counterintuitive about the data and
    then, based on their findings, relay back to the warehouse lead to get the issue
    addressed.


    # Spikes


    When metrics spike above or below their average, investigate the data and potential
    causal factors. When looking at the data, segmenting it in different ways to see
    if there is a common factor in what drove it up. Determining potential causal
    factors can be more difficult. Check for bugs in your tracking, check with marketing
    to see if any new campaigns were launched, and check third-party tools/systems
    (Google search algorithm, an API is down, etc.) that could affect this metric
    (Figure 17.1).'
  - '[PAGE 210]


    # Sales per Day


    ![](img/07b10ae3f84ebfc0356cf70f4bf08c9e_210_0.png)


    Figure 17.1 An outlier identified in a sales-per-day line graph.


    # No Spikes


    Another point of interest is numbers that are not changing even though changes
    have been made. When launching a new marketing campaign and the numbers are not
    going up, that could be due to a bug or poor campaign performance. They should
    be investigated in that order. Often the tracking was not set up correctly or
    the link in the advertisement was going to the wrong place (Figure 17.2).


    # Sales per Day


    ![](img/07b10ae3f84ebfc0356cf70f4bf08c9e_210_1.png)


    Figure 17.2 A date marked representing when a marketing campaign launched.'
  - "[PAGE 211]\n\n# No New Data\n\nWhen queries stop producing data after a specific\
    \ date, investigate. It may be a bug, a renamed field, or a data source changed.\
    \ These problems are more common than expected. For instance, when updating a\
    \ URL of the data associated with a previous one, it might be cut off (Figure\
    \ 17.3). However, it is possible to work around these types of problems with SQL\n\
    \nFor example, when Chartio moved its URL from Chart.io to Chartio .com we needed\
    \ to use:\n\n```\nSELECT\nCASE\n  WHEN page_tracking.url LIKE 'www.chart.io'\n\
    \    THEN 'www.chartio.com'\n  ELSE page_tracking.url\n    END AS \"page\",n \
    \ to_char(page_tracking.viewed_at_date, 'YYYY-MM') AS \n  \"month\",\n  COUNT(distinct\
    \ page_tracking.view_id) AS \"views\"\nFROM\n  ga.page_tracking\nGROUP BY\n  1\n\
    ORDER BY\n  2 ASC\n```\n\n![](img/07b10ae3f84ebfc0356cf70f4bf08c9e_211_0.png)\n\
    \nFigure 17.3 A point in time marked when a field name was updated."
  - '[PAGE 212]


    It''s possible to implement this type of solution as a more permanent fix at the
    data warehouse stage by updating the relevant view. One note of warning here is
    that sometimes it''s necessary to preserve the historical continuity of the name
    change by using a date threshold, think through the implications before making
    this modeling decision. Consult the warehouse lead or the engineers to find out
    what is going on and get fixing it correctly.


    Another common issue is that the number of rows a query is returning might be
    getting limited by the BI tool you are using. Double-check if there is a limit
    and if you are at it. Most BI tools let you manually adjust this limit higher
    so you can get the rest of the data.


    # All Queries on a Data Source Are Erroring Out


    Errors like this happen for a few reasons:


    +   - Deprecation of the source.

    - The source had an update changing its data structure.

    - A bug somewhere in the process providing the data.


    Errors with data sources are something to quickly communicate to the team to prevent
    a ton of wasted queries and frustrated users.


    # Slow Queries


    Relay slow-running queries to the warehouse lead so that they can investigate
    creating new views at the warehouse level. Others can then use this newly formed
    view. If mart leads are technically savvy, they can begin to explore the company''s
    dbt project and make a PR. A simple one to do would be to switch a view using
    in the mart to a materialized view. While this may not improve the speed right
    away, it will be a great conversation starter between the mart and warehouse lead
    about what can be done to improve performance (Figure 17.4).'
  - '[PAGE 213]


    Data Mart Maintenance


    # MART


    ![](img/07b10ae3f84ebfc0356cf70f4bf08c9e_213_0.png)


    Figure 17.4 The process of adding new columns to a data mart.


    # Identify New Needs


    Data is never a static thing. As new features roll out, do not new tools and objectives,
    with new data requirements emerging. Do not assume that your mart updates when
    any of these changes happen. It’s necessary to proactively request for these updates
    to be reflected in the data mart from the warehouse lead. We can leverage the
    ticketing system we set up in the data warehouse stage to surface these concerns.


    # Help Track Success


    A big role of the mart lead can be to help those on the team think through (analytically)
    what they’re trying to accomplish and how they’d like to track it. Basically,
    help them set up the dashboards they need. Often people need help there and need
    a good review once it’s done to see it’s correct and useful. They’ll have more
    experience and knowledge to know what’s not being tracked or is not available
    that maybe should be and make that request.'
