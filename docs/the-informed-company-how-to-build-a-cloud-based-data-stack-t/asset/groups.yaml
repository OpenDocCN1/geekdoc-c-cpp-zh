    # Other Staging Modeling Considerations


    Suffice to say, this is very inefficient and highly prone not only to logic errors
    but also lost code. There are a couple of ways today''s analysts avoid this problem.
    First, rather than copying the actual code into queries, we create views directly
    into our warehouse as opposed to tables, which will require scheduled rebuilds
    to load new rows into the data lake. We can choose to materialize them for performance
    reasons, which we will touch on later in this section.


    To tell the original version and "cleaned" version of a data model apart, we recommend
    creating this view within a new schema where staging models will live. If nothing
    else, table names will remain identical or at least similar. Aim to be explicit.
    A little overhead is a worthy trade for a more sensible warehouse layout.


    So let''s up a new schema specifically for staging models.


    Let''s call the new schema "trials." WARNING: Be sure this is a new schema name;
    otherwise, you may delete existing data. We specify "trials" for this in-book
    example, as this is not standard term in the industry.


    We drop the old version of the schema if it already exists:


    ```

    DROP SCHEMA IF EXISTS trials CASCADE;

    ```


    Workflow for updating staging schemas in the future involves dropping the already
    existing views (or tables) and "rebuilding the schema and models" using the instructions
    to follow. This deletion step is required. SQL does not allow in-place UPDATES
    to the definitions of views (or tables).


    Now that we''re sure there is no trials schema on disk, we create the schema:


    ```

    CREATE SCHEMA trials;

    ```


    We then set the access to this schema, so that the right user groups can read
    from these tables (but not write or delete usually):'
