    ## 构建数据湖的理由总结


    另一方面，云仓库引擎在其原生 SQL 方言中内置了许多面向分析的功能（如图 4.3 所示）。这些操作高效且具有成本效益。在您自己的数据库上执行查询的成本通常比调用
    SaaS 程序的 API 要便宜得多。查询自己的数据库不仅更快，而且更便宜。


    因此，处理来自 API 的数据的更便宜、更合理的方案是将其提取，然后使用 ELT（提取、加载、转换）加载到数据湖中。一旦加载到湖中，你就可以使用 SQL（或仓库引擎支持的其他数据处理语言）以许多不同的方式多次查询你的数据。由于你没有直接访问底层源数据，你会失去一点的数据实时性。但这种权衡换来了速度和成本的节省。你可以利用
    SQL 或任何使用的 BI 产品的强大和灵活性进行查询——与多次从 API 源提取数据不同，每增加一个图表，成本并不会显著增加。


    ![](img/07b10ae3f84ebfc0356cf70f4bf08c9e_66_0.png)


    图 4.3 使用来自各种数据源数据的仪表板。


    ## 性能


    源数据可能来自实际生产数据库，这可能会影响为其提供服务的应用程序性能。需要大量数据和计算（如聚合）的查询在事务型数据库上运行得并非最优（图 4.4 所示）。


    数据湖理想情况下应该独立于生产环境来处理这些类型的即席分析查询。可以扩展数据湖的资源，以便更快地查询数据。请记住，数据湖毕竟是一系列副本的集合。这种间接层使得数据栈具有更强的容错性。


    ![](img/img/07b10ae3f84ebfc0356cf70f4bf08c9e_67_0.png)


    图 4.4 对于包含大量聚合的仪表板，事务型数据库通常比分析型数据库慢。


    ## 未来发展


    将所有数据源收集到一个数据存储器中是构建现代数据栈其余部分的必要步骤。这样做大大减少了分析和报告过程中遇到的许多头疼问题，因为许多 BI 产品本就只打算从一个源提取数据。某些
    BI 工具能够在查询和图表中混合数据源，但花时间将源加载到数据湖仍然具有更高的性能（和可扩展性）。


    这种价值可能表现得不那么明显，因此让我们快速预览一下敏捷分析栈开发的下一个阶段来解释这一点。在仓库阶段，你的大部分工作涉及转换数据湖中的表和视图，使其更加清晰和一致。这使得更多的人可以使用它，减少了错误，并导致工作重复的减少。这种仓库层的转换需要数据湖作为基础。


    ## 第五章


    ## 为数据湖选择引擎


    湖通常运行在与事务源数据库不同的数据库引擎上。如前所述，PostgreSQL 或 MySQL 等事务型数据库针对支持运行中产品所需的海量相对简单的查询进行了优化。


    然而，数据湖通常托管在所谓的“数据仓库引擎”上，该引擎是为对更大量的数据进行更复杂的分析查询而构建。


    将事务型数据库比作踏板车，将数据仓库引擎比作半1卡车（图 5.1）。它们都是非常有价值的工具，但显然有不同的职责。用半1卡车上门邮件是不现实的，就像从数据仓库引擎每秒向不同地方提供成千上万个小请求同样不现实一样。半1卡车适用于跨国将数吨货物运送到较小的分销中心，就像数据仓库引擎适用于向
    BI 工具执行大型分析查询一样。


    ![](img/07b10ae3f84ebfc0356cf70f4bf08c9e_71_0.png)


    图 5.1


    ## 关于大数据


    Hadoop 是用于并行计算的常用大数据框架。Hadoop 像一艘船。它能载很多，但在河里通过效率不高，请避免它。S3 是另一个大数据选项，它像一列火车。它能载很多，但在河里通过效率不高，请避免它。S3
