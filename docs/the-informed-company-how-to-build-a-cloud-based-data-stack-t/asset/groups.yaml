    ## 临时层架构（Staging Schemas）让源更改变得简单


    虽然我们依赖于 Fivetran 等即用工具来持续从各种数据源中提取数据，但有时数据源仍会更改其提供的内容。通过临时层架构（staging schema），适应这种变化变得非常简单。我们可以更新视图查询的小部分代码，而不会影响其所依赖的下游视图。


    例如，有人可能将 Salesforce 中的一个字段名从 SL 改为了 Sales Qualified Lead（销售合格线索）。我可以从这样更新我的临时视图：


    ```sql

    SELECT

    SL AS sales_qualified_lead

    FROM

    salesforce.user

    ```


    更新为来自 Salesforce 映射的新列名：


    ```sql

    SELECT

    "Sales Qualified Lead" AS sales_qualified_lead

    FROM

    Salesforce.user

    ```


    由于我的字段已经设置了别名，所有构建在其之上的下游数据表都不会崩溃，也不需要更新。


    ## 弃用旧架构


    现在我们已经分层了视图并为 SST 创建了新架构，我们是否应该限制在 BI 工具中使用源架构和中间临时层架构呢？然而，在调试或发现新的建模机会时，能够从数据仓库中访问旧且未使用的数据源可能是很有用的。将数据源标记为“已弃用”（deprecated）或“已批准”（approved），以便
    BI 工具中的用户明确他们应该使用哪些数据进行分析（图 15.4）。


    ## 维护事实来源（Source of Truth）


    ![](img/07b10ae3f84ebfc0356cf70f4bf08c9e_187_0.png)


    图 15.4

    来源：Chartio


    ## 解决数字冲突


    有时，即使衡量的是相同的内容，指标也会显示不同的数字（图 15.5）。例如，当 HubSpot 中的新试验数量与生产数据库不一致时，经验法则是信任最接近跟踪该事件的数据源。在这种情况下，它应该是生产数据库：


    ```sql

    SELECT

    SUM(arr)

    FROM

    app.users

    WHERE

    trial_start > NOW()::date - 7

    AND email != "%chartio.com%"

    ```


    对比：


    ```sql

    SELECT

    SUM(arr)

    FROM

    app.users

    WHERE

    trial_start > NOW()::date - 7

    ```


    ## 处理持续的请求和持续反馈


    ![](img/07b10ae3f84ebfc0356cf70f4bf08c9e_188_0.png)


    图 15.5


    通常，人们对指标的计算不同是因为以下原因：他们基于不同的公式进行计算；他们使用的数据源不同；数据的过滤方式不同；或者他们的计算存在错误。


    追踪到正确答案并修改模型使其更加清晰，这样双方及其他人都能准确计算聚合指标。


    ## 处理持续的请求和持续反馈


    现在，你新建模的数据将由各种分析师和员工查询。建模需求不可避免地发生转变和演变。你对模型获得的反馈示例包括请求添加新表或列、重新定义业务逻辑、修复因系统更改引起的损坏表或调查错误的数字。


