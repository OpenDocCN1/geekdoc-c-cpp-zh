    # 引言


    有些支持人员在响应问题时只会问“你用什么浏览器？”，而另一些则拥有所有的错误信息，包括浏览器详情、账户信息和最近的操作。


    有些记者只写他们感兴趣的话题，而另一些则能看到哪些内容能引起共鸣。


    有些产品经理通过展示初步结果来证明其功能的合理性，而另一些则通过建立测试并让数据自己说话。


    将数据转换为所有人都能访问的易理解的格式，可以让技术人员和业务人员成为合作者而非对手。它赋能组织中的每一个人都能做出明智的决策。本书旨在展示如何构建数据栈来实现这一目标。


    # 敏捷数据组织化的四个阶段


    在与成千上万公司合作后，我们识别出敏捷数据组织的四个不同阶段（图 1.2）。每个阶段都有关于如何“向上堆栈”演进的最佳实践和指导。


    | 源 (SOURCE) | 湖 (LAKE) | 仓库 (WAREHOUSE) | 市场 (MART) |

    | :--- | :--- | :--- | :--- |


    ![](img/07b10ae3f84ebfc0356cf70f4bf08c9e_29_0.png)


    图 1.2 敏捷数据组织的四个阶段代表了一个描述数据管理生命周期的过程。


    本书对应阶段：


    - 1. 源 (Source)

    2. 湖 (Lake)

    3. 仓库 (Warehouse)

    4. 市场 (Mart)


    图中所示每个垂直阶段可能根据组织内数据的资源、规模、重要性和需求而被公司所需。并不是所有公司都需要这四个阶段。如果一个业务在源阶段就获得了所需的洞察，那么它们就应该留在源阶段。同样，公司可能发现它需要一个湖来汇总所有数据，但可能不需要仓库开发后期阶段隐含的转换。


    让我们从每个步骤的概述开始。


    # 第 1 阶段源 (Sources)


    许多团队只有几个数据源，通常在 Excel 或 Google 表格中处理数据和可视化。公司产品运行的两个常用源是 Google Analytics 和“事务型”数据库（如
    PostgreSQL 或 MySQL）。如果公司中只有少数人需要处理数据源，可以通过直接访问或副本访问来设置；对他们来说，直接处理数据更敏捷、更直接。


    我们将讨论如何配置适当的数据访问，以及如何为未来将公司数据组织成单一的统一集合奠定基础。我们还讨论在使用应用内仪表板、电子表格、SQL 和 BI 解决方案等工具时的最佳实践。这些主张背后的原则是：团队在组织数据源和选择工具包时应该经过严谨的深熟考虑。这一点不仅能让分析师在早期处理数据时保持高效，还为他们以后将输入流重新组织为数据湖做准备。


    如果符合以下情况，此阶段是合适的：


    - 只有少数人将处理此数据集。

    - 目前数据需求极小。

    - 仅存在少数小型数据源。

    - 唯一需要创建新可视化图表的人相当具有技术背景。


    如果符合以下情况，是时候进入下一阶段了：


    - 从多个地方/应用程序访问数据。

    - 需要为 Salesforce 等云应用源创建独特或组合图表/仪表板。

    - 需要访问数据的人数不断增加。

    - 存在性能问题。

    - 数据变得太大，事务数据库无法高效运行。

    - 非技术用户需要在没有帮助的情况下创建图表。


    # 第 2 阶段湖 (Lake)


    一旦公司必须对多个数据源进行分析（且每个数据源都需要连接、过滤、处理），公司就必须转向数据湖。混合数据源允许组织中的多个参与者查询公司完整数据的大部分子集。反之，将各种源汇入数据湖支持了在合理的大规模（不一定是“大数据”）下的数据库性能。


    数据湖的一个核心动力在于将数据管道化到业务智能工具的需要。例如，在处理来自 Salesforce、Hubspot、Jira 和 Zendesk 的数据时，每个服务都有自己的应用内仪表板和独特的数据应用。


    - 将有较多的人处理此数据集。

    - 一个整洁的真理源可以消除数据完整性问题。

    - 需要将数据结构与不断变化的事务源分离开。

    - 需要采用 DRY（不要重复自己）原则。


    # 建模 (Modeling)


    数据需要进行转换，以便数据库内的不同人员或系统能够更具易用性。建模指的是对数据进行这些转换的过程。


    # DRY


    一个代表软件设计理念的缩写，通过设计的模块化来避免重复的模式。


    # 第 3 阶段仓库 (Warehouse - 单一真理来源)


    随着越来越多的人开始使用数据湖，问题开始倍数增长：数据在哪里？为什么？在寻找数据洞察时查询应该使用哪些特定标准？这些模式（schema）意味着什么？不可避免的复杂性使得获取数据变得困难，特别是对于技术性不强的同事。即使在内部专家中，更多的模式和实体（即表和视图）反过来会导致更多的沟通头疼。随着时间推移，数据湖服务所有人，但让获取正确的数据变得困难。编写查询和在组织内共享知识变得更加困难。


    所有这些问题都可以通过清洁简化的数据版本来解决，我们称之为“单一事实来源”（single source of truth）。


    这个阶段——创建数据仓库——在历史上一直是一场噩梦，有很多关于如何为分析处理最好数据建模的著作。但现在，有了更直接的、经过测试的范式：这些范式不仅简化了记录组织模式中发现的异常情况的工作，还节省了重复和维护混乱的“版版”查询步骤的时间（例如）。


    在数据仓库章节，我们回顾了如何清理数据湖，并调查了管理数据复杂性的标准做法。最后，我们提供了关于团队结构的建议。


    # 仓库 (Warehouse)


    如果符合以下情况，此阶段是合适的：


    - 将有较多的人处理数据。

    - 一个整洁的真理源可以消除完整性问题。

    - 需要在数据之上采用一致结构。

    - 需要采用 DRY 原则。


    如果符合以下情况，是时候进入下一阶段了：


    - 数据有助于有助于探索和理解数据。

    - 是时候让业务用户更高效了。

    - 存在需要不同数据湖格式的项目。

    - 拥有真正精明的员工对公司的成功至关重要。


    # 第 4 阶段市场 (Marts)


    好消息，你们的数据是清洁的，BI 产品直接与仓库中的表交互。使用 Tableau 或 Looker 等工具，组织内的非分析师可以自助解决问题。我们所指的是，他们能够直接参与数据，而不需要分析师为他们构建或运行查询。这是一个极好的消息：使用数据的人变得越来越明智，公司所有人都可以利用数据获得优势。


    但随着时间推移，仓库中累积了数百张表。用户在寻找相关数据时感到不知所措。也可能根据团队、部门或案例，不同的人希望以不同的方式使用相同的数据。因此，虽然单个字段含义是统一的，但不同部门使用的抽象方式已经分化。


    为了解决这些挑战，我们进展到数据市场阶段。这些是针对团队或调查主题的更小、更具体的真理来源。例如，销售团队可能只需要中央仓库中的 12 张左右表，而营销团队可能需要
    20 张表——其中一些是相同的，另一些是不同的。正如仓库主管管理数据仓库一样，数据市场受益于市场领导的引导。市场领导有助于在各自的领域内教育和交流领域知识，支持日常维护任务。毕竟，维护责任分配给市场领导，而不是某一个人。有效利用数据市场的组织是内部数据素养行动的实例。


