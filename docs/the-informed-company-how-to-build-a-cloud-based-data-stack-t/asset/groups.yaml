    the absence of a value. In other words, SQL engines do not tend to enforce that
    there be a value for each field in every column. Our task, as data professionals,
    is to figure out how to handle these blank/empty/nonexistent values. Why would
    this happen at all?


    Consider a new user who has not completed their profile information. For instance,
    they have not entered their first and last name. They surely have a name, though,
    so we leave the field NULL in the database. However, there are cases where NULLs
    may be produced by accident or they may need to be replaced with a value. For
    each column that could have NULLs, it''s a good idea to determine what those mean
    and correct NULLs with CASE-WHEN statements if there should never be a blank value
    in reports.


