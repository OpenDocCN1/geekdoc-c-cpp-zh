    C-Store 论文。


    ## Amazon Redshift


    ### 优点


    Redshift（图 5.3）具有易用性、快速和成本效益的优点。作为 AWS 的一部分，它与广泛的 AWS 服务全方位集成，例如用于存储的 S3 和用于基础设施监控的
    Cloud-Watch。Redshift 的价格通常比 Snowflake 或 BigQuery 便宜


