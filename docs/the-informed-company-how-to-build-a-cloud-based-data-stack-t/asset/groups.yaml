- md: "\n## Staging Schemas\n\n```sql\nSELECT\nid,\n-- external_id, -- unused\nName,\n\
    \"Display Name\",\nCASE\n    WHEN Location = \"United States\" THEN \"USA\"\n\
    \    WHEN Location = \"US\" THEN \"USA\"\n    WHEN Location = \"US of A\" THEN\
    \ \"USA\"\n    ELSE Location\nEND AS country,\naccess.\"type\" AS access_level,\n\
    --type -- replaced by access_level\nCASE\n    WHEN Info = \"%active\" THEN True\n\
    \    WHEN Info = \"%inactive\" THEN False\nEND AS is_active,\nis_deleted\nFROM\
    \ app.Users\nJOIN app.access ON Users.type = access.id\n```\n\nWildcards allow\
    \ you to search and locate specific sequences of characters that match a pattern.\
    \ Wildcards let you define a pattern using comparators and metacharacters. The\
    \ most commonly used metacharacter is %, which means it will match any string.\
    \ So in the example above %active will match with a value that ends with active\
    \ such as 123active, ABCactive, and even just active.\n\n## Decide What to Do\
    \ about Null Fields\n\nUnstructured data often have NULL values. Well, technically\
    \ NULL isn't a value. In the SQL specification, NULL is defined as the absence\
    \ of a value. In other words, SQL engines do not tend to enforce that there be\
    \ a value for each field in every column. Our task, as data professionals, is\
    \ to figure out how to handle these blank/empty/nonexistent values. Why would\
    \ this happen at all?\n\nConsider a new user who has not completed their profile\
    \ information. For instance, they have not entered their first and last name.\
    \ They surely have a name, though, so we leave the field NULL in the database.\
    \ However, there are cases where NULLs may be produced by accident or they may\
    \ need to be replaced with a value. For each column that could have NULLs, it's\
    \ a good idea to determine what those mean and correct NULLs with CASE-WHEN statements\
    \ if there should never be a blank value in reports.\n\n## Filter Wanted Rows\n\
