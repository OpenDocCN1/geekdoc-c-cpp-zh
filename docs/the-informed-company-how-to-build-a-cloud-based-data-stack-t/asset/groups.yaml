    # Introduction


    Support persons who respond to an issue with “what browser are you using?” versus
    ones who have all of the error information, including the browser details, the
    account information, and recent actions.


    Journalists writing about what matters to them versus ones who can see what resonates.


    Product managers who justify their feature by showing the initial results versus
    ones who set up a test and let the data speak for itself.


    Getting data into an understandable format that everyone has access to makes technical
    and business people collaborators rather than adversaries. It empowers everyone
    in the organization to make informed decisions. This book aims to show how to
    set up a data stack to do just that.


    # The Four Stages of Agile Data Organization


    After working with thousands of companies, we recognized four distinct stages
    of agile data organization (Figure 1.2). Each of these stages has best practices
    and guidance on how to progress “up the stack.”


    | SOURCE | LAKE | WAREHOUSE | MART |

    | :--- | :--- | :--- | :--- |


    ![](img/07b10ae3f84ebfc0356cf70f4bf08c9e_29_0.png)


    Figure 1.2 The four stages of agile data organization represent a process that
    describes the lifecycle of data management.


    This book maps onto stages:


    - 1. Source

    2. Lake

    3. Warehouse

    4. Mart


    Each vertical stage pictured could be what a company needs, depending on the resources,
    size, importance, and needs of data within an organization. Not every company
    needs all four stages. If a business gets the insights they need while in the
    source stage, then they should stay in the source stage. Likewise, a company may
    find it needs a lake to combine all its data together but may not need the transformations
    implied in later stages of warehouse development.


    Let''s begin with an overview of each step.


    # Stage 1 Sources


    Many teams only have a few data sources and commonly manipulate and visualize
    data in Excel or Google sheets. Two common sources that company products run on
    are Google Analytics and "transactional" database(s), such as PostgreSQL or MySQL.
    If only a few people at a company need to work with data sources, it is possible
    to set them up with direct or replica access; it is more agile and straightforward
    for them to work with the data directly.


    We discuss how to configure proper access to data and how lay the foundation for
    future organization into a single, unified collection of company data. We also
    discuss best practices when using tools like in-app dashboards, spreadsheets,
    SQL, and BI solutions. Behind these assertions is the principle that teams should
    be vigorously deliberate when organizing their sources and picking their toolkit.
    Keeping this in mind not only makes analysts effective at dealing with data early
    on, but also prepares them to reorganize their input streams into a data lake
    later on.


    This stage is right if:


    - Only a few people are going to be working with this dataset.

    - Data needs are minimal at the moment.

    - Only a few small data sources exist.

    - The only people who need to make new visuals are fairly technical.


    It’s time for the next stage if:


    - Data is accessed from multiple places/applications.

    - There are needs for unique or combined charts/dashboards for cloud application
    sources like Salesforce.

    - A growing number of people need access to data.

    - There are performance issues.

    - Data is getting too big for a transactional database to operate efficiently.

    - Nontechnical users need to create charts without help.


    # Stage 2. Lake


    Once companies must run analyses on multiple sources of data, each of which needs
    joining, filtering, manipulation, a company must move to a data lake. Blended
    data sources enable several actors in an organization to query a large subset
    of the company’s complete data. In turn, funneling various sources into a data
    lake supports database performance at a reasonably large (not necessarily “big
    data”) scale.


    A central motivation for a data lake lies with the need for piping data to business
    intelligence tools. For example, when working with data from Salesforce, Hubspot,
    Jira, and Zendesk, each service has its own in-app dashboards and unique data
    application.


    - More than a few people are going to be working with this data-set.

    - A clean source of truth would eliminate integrity issues.

    - There''s a need to separate the structure of the data from the always-changing
    transactional sources.

    - There''s a need to adopt DRY (Don''t Repeat Yourself) principles.


    # Modeling


    Data requires transformation so that it is more usable by different people or
    systems within a database. Modeling refers to this process of making these transformations
    to the data.


    # DRY


    An acronym that represents a software design ethos that avoids repetitive patterns
    through modularity of design.


    # Stage 3. Warehouse (Single Source of Truth)


    As more people begin to work with the data lake, questions begin to multiply:
    What is data where? Why? What particular criteria should queries use when looking
    for data insights? What do these schema mean? Unavoidable complexities make it
    harder to obtain data, especially by less-technical colleagues. Even among in-house
    experts, more schemata and entities (i.e. tables and views) in turn cause more
    communication headaches. In time, the data lake serves all but makes it harder
    to obtain the right data. It gets harder to write queries and share the knowledge
    within organization.


    All of these problems can be addressed with a clean and simplified version of
    the data, something we refer to as “a single source of truth.”


    This stage—creating a data warehouse—has historically quite a nightmare, and there
    are many books written on how best to model data for analytical processing. But
    these days, there are more straightforward paradigms that have been tried and
    tested: ones that not only streamline having to document the oddities found across
    an organization’s schemata but also save time in having to repeat, and maintain
    messy “boilerplate” query steps (e.g. “every time you query the order’s table,
    make sure to adjust all orders from England to be in local time”).


    In the data warehouse section of the book, we review how to clean data lakes and
    investigate standard practices for managing data complexity. In addition, we offer
    ways to establish an architecture with data integrity in mind. We provide modeling
    tool suggestions and an example SQL style guide. Finally, we give our recommendations
    for team structure, such as a lead to oversee this process and warehouse maintenance.


    # Warehouse


    This stage is right if:


    - More than a few people are going to be working with data.

    - A clean source of truth would eliminate integrity issues.

    - There’s a need to adopt consistent structure on top of the data lakes.

    - There’s a need to adopt DRY principles.


    It’s time for the next stage if:


    - The democratization of data would help others explore and understand data without
    help.

    - It’s time to teach and enable business users to be more effective.

    - Projects exist that require different formats than what exist in the data lake.

    - Having truly informed employees is vital to your company’s success.


    # Stage 4. Marts


    Good news, your data is clean and the BI product speaks directly with tables in
    the warehouse. Using a tool like Tableau or Looker, non-analysts within the organization
    can self-serve their questions. By that, we mean they are empowered to engage
    with the data directly rather than needing to have an analyst build or run queries
    for this. This is excellent news: more people use the data become increasingly
    informed, and everyone across the company can use data to their advantage.


    But enough time, hundreds of tables accumulate in a warehouse. Users become overwhelmed
    when trying to find relevant data. It is also possible that, depending on the
    team, department, or case, different people want to use the same data structured
    in different ways. So while the meanings of individual fields are unified, the
    abstractions used by different departments have diverged.


    To sort through these challenges, we progress to the data stage. These are smaller,
    more specific sources of truth for a team or topic of investigation. For example,
    the sales team may only need 12 or so tables from the central warehouse, while
    the marketing team may need 20 tables—some of them the same, but some different.


    Just as a warehouse lead manages data warehouses, data marts benefit from being
    facilitated by mart leads. The mart lead helps educate and communicate subject
    matter expertise within the domain of each respective mart supporting everyday
    maintenance tasks. After all, the responsibility of maintenance distributes to
    mart leads rather than to a single person. The organization that leverages data
    marts effectively is an example of intra-company data literacy in action.

    '
