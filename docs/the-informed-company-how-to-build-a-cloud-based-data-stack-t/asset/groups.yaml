    这需要更新。有很多方法会搞乱这个过程，或者直接漏掉需要更新的行。在完全规范化的 Schema 中，国家名称在数据库中应该只列一次，并通过外键与其他表进行连接（join）。这允许我们只更新一次名称，同时保持所有地方的键值不变。另一个很好的处是它节省了大量的存储空间。


    但对于分析型（OLAP）数据库，我们不需要为了空间优化表格（感谢 C-store 压缩！），而且我们不需要管理更新，因为我们永远不会写入/更新分析表。数据转换（Transformations）是多个
    `SELECT` 语句共同工作，以提供数据洞察。换句话说，我们在规范化数据库之上创建了“对重复友好”的视图。这种相反的过程恰恰被称为“反规范化”。


    数据规范化有助于机器处理，而反规范化则帮助分析师。例如，创建一个包含预连接结果的宽表（以物化视图的形式实现）可能会非常方便。这些宽表可以与规范化的版本并列存在于数据仓库中。我们可以在分阶段视图之间创建这些连接，以创建用于分析的有用视图（图
