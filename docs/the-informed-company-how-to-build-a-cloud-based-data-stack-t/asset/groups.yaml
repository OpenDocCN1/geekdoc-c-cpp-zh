    # 调优与优化


    随着公司的增长，查询的数据也会随之变化。新数据、新分析师以及新的业务目标会改变查询的数据内容。数据仓库对象的原始结构可能需要根据其查询方式进行重新配置，以优化使用和性能。


    不同的数据仓库都有检查性能的选项，但大多数都提供以下方法：


    - 扩展集群规模（Scale up）。

    - 物化昂贵的视图。


    # 添加集群


    获取更多性能的最快方法是直接向数据仓库引擎中添加集群。许多引擎具有设置，允许在存在大量并发查询时自动添加额外的集群。而对于其他引擎，你可能需要精确指定为你的实例启动多少个集群。


    ![](img/07b10ae3f84ebfc0356cf70f4bf08c9e_193_0.png)


    集群是数据仓库引擎的计算资源。它包含多个用于协调所需计算的节点。许多集群可以同时为多个人执行聚合操作。


    # 物化昂贵的视图


    创建“单一事实来源”通过将用户需要查询的内容整合到一个位置，来帮助不熟悉数据结构的用户。然而，如果为了构建这些这些视图而连接了任何表，可能会遇到一些性能问题。现在
    DAG（有向无环图）中有许多人们查询的视图，那么哪些视图可能受益于物化？通常，物化最终视图会有帮助。此外，寻找 DAG 中许多源流向同一个视图的地方。连接（Join）在列式数据库中是昂贵的，因此尝试物化这些连接以看看是否能提高性能。


    # 代码审查所有建模


    建模代码的变化应始终通过拉请求（pull request）提交，并在同事和数据仓库负责人（Warehouse Lead）合并到主分支之前进行审查（图 15.8）。这将确保任何代码的错误更少、遵循适当规范，并向团队传递。


    ![](img/07b10ae3f84ebfc0356cf70f4bf08c9e_194_0.png)


    图 15.8 任何建模代码在纳入架构（schema）之前都应经过同行评审。


    以下是审查同事代码更改时需要注意的事总结：


    - 代码是否遵循命名和编码规范？

    - 是否根据需要添加了 dbt 测试？

    - 提议的更改是否使数据更整洁、更容易使用或实现了定义的目的？

    - 数据是否返回了预期结果？

    - 是否考虑了所有模型依赖关系？

    - 是否有拼写错误或语法错误？


    此外，dbt 有一篇关于审查分析拉请求的极佳文章。


    # 维护清单


    “单一事实来源”数据仓库是一项值得的投资。然而，如果没有维护，它将陷入混乱并失去价值。


    - 随着指标（metrics）的增加，确保它们的命名是正确的。

    - 当指标被认为不再有用时，确保它们被移除以避免混淆。

    - 当指标需要更新/预聚合时，记住正确地为它们命名。

    - 保持用户权限的恰当和准确，将释放数据库管理员专注于重要项目，并避免数据被意外删除。


    - 考虑数据仓库对象的重构将有助于为分析和复杂查询创建合适的结构，同时降低性能成本。

    - 数据工程师执行上述维护任务是一项值得的投资，这将消除由于忽视数据仓库导致的错误分析瓶颈。


    # 第 4 阶段

    数据市（DATA MARTS）

    又名数据民主化


    ![](img/07b10ae3f84ebfc0356cf70f4bf08c9e_198_0.png)


    # 数据市概述


    最后，我们到达了数据栈的顶端。在最后这几页中，我们考虑什么构成了数据市。也就是说，我们将讨论如何在你的仓库中进一步结构化和分组数据，不仅是为了满足一组需求，而是为了满足多种需求。


    # 4 阶段：数据市


    随着组织扩大其跟踪的数据量，想要访问数据的人数也会随之增加。这导致在架构中存在更多数据，且由于业务逻辑可能不同，导航变得困难。数据市是数据仓库的一个过滤后的（有时是聚合的）子集，使得导航变得更加容易。它提供了该组相关的表。


    # 构建数据市的概述


    对于数据仓库，我们需要数据仓库负责人来实现建模。对于数据市，我们需要决定从数据仓库中哪些表是需要的。数据市负责人可以为团队定制数据市，指标可以单独处理（图
    P.1）。


    > 数据仓库架构的数据市视图。


    ![](img/07b10ae3f84ebfc0356cf70f4bf08c9e_199_0.png)


    # 围绕业务用例中心


    设置数据市的主要益处之一是数据的扩展性。它为每个团队限制了数据，减少安全担忧。我们希望从大型复杂的架构（图 P.2）转向一系列集中的架构，每个部门都可以快速找到他们的数据（图
    P.3）。


    ![](img/07b10ae3f84ebfc0356cf70f4bf08c9e_200_0.png)


    图 P.2 整个数据仓库架构。


    # 第 4 阶段数据市：数据民主化


    ![](img/07b10ae3f84ebfc0356cf70f4bf08c9e_201_0.png)


    图 P.3 按部门划分的数据仓库架构。


    图 P.4 按部门需求的数据仓库清单。


    | 表 | 产品 | 营销 | 销售 |

    | :--- | :---: | :---: | :---: |

    | 用户 | ✓ | × | ✓ |

    | 营销渠道 | × | ✓ | ✓ |

    | 线索 | × | ✓ | ✓ |


    所以，从湖到仓库的主要是清理表，而从仓库到数据市则是围绕业务流程和团队建立架构和表。不同的部门需要数据仓库的不同部分（图 P.4）。


    数据市架构与仓库并不相似，因为数据在仓库阶段的清理后应该是可以理解的。数据市进一步简化了部门内人员查找所需内容的架构。通过在仓库之上创建视图来构建它。


    # 第十六章


    # 数据市实施


    数据仓库拥有众多架构，可能会变得难以导航。仅一个部门（如营销）可能有几十甚至上百张表；结合销售、财务、人力资源、生产和客户支持的所有表，可能会让人感到难以
    overwhelming。从数据仓库移动到数据市使用户更容易找到他们业务流程或用例所需的数据。


    数据市可以通过三个步骤创建。


    # 数据仓库上的视图


    通过从数据仓库中选择相关数据（图 16.1）来创建新视图，以构建每个数据市：


