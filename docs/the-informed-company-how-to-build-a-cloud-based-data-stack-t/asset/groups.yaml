    # 第十四章


    ## 管理数据访问 (Managing Data Access)


    数据仓库的一个基本优势在于数据的自服务能力和跨公司的信息访问。通常，不仅仅是中心化的数据团队，更多小组都有权访问数据仓库。数据已经过清洗、标准化和组织。它是自文档的。任何具备一点
    SQL 知识的人都可以查询表并提取他们需要的信息。仓库提升了整个组织的数据素养。


    然而，公司处理的信息你可能不希望被轻易访问，特别是在医疗系统或任何管理敏感信息的类似系统中。现在存在许多强制执行数据访问规则的安全法规，例如 GDPR，许多公司还遵循它们自己的行业标准合规规则，如
    SOC 和 HIPAA。无论是个人身份信息 (PII) 还是财务信息，敏感数据在产品周期和数据仓库中的普及程度比人们想象的要得多。确保数据仓库中的敏感信息具有适当的限制至关重要。


    在构建仓库框架的同时，将数据限制构建其中。即使在开始构建仓库之初，也要回答几个常见问题：


    - 敏感数据（PII 和财务信息）目前在哪里处理？

    - 这些敏感数据是否仍存在于数据仓库并在之后被清理？

    - 这些信息将如何从暴露的数据集中移除或限制——通往仓库的脚本、从仓库创建的数据市？


    在涉及敏感信息时，将 BI 工具连接到仓库之前解决这些问题。下一节是保护数据和进行匿名化的常用策略。我们还提到了在 BI 工具内部管理数据访问良好准则。但请注意：我们建议仓库承担更多的重量工作。


    放弃在分层表（staging table）中选择字段或在分层转换期间隐藏列，这比为不同的团队或个人保护仪表板要简单得多。通过几个 `GRANT` 命令，数据库中的单个表或模式默认就可以只向某些人显示。此外，从分层表以及数据库中种种转换可以保护敏感数据的角度进行思考，为我们使用数据市组织转换做好了准备，而数据市是本文涵盖的现代数据栈中即将（也是最后）的阶段。


    现在，让我们探索仓库级别保护你的仓库的方法（图 14.1）。


    ![](img/07b10ae3f84ebfc0356cf70f4bf08c9e_174_0.png)


    # 如何在数据仓库中保护敏感数据


    限制适当人员访问的最直接方法是在仓库处执行规则。创建只读副本，创建具有不同访问权限的自定义用户组，并对特别敏感的数据进行完全加密。


    # 使用托管解决方案处理敏感数据 (Managed Solutions)


    此书的这部分主要涉及未管理的仓库引擎，例如 Redshift，这些引擎提供了更模块化的功能，需要资源管理。对于 BigQuery 和 Snowflake 等仓库引擎，不需要复制或处理基础设施，因为这些解决方案会自动扩展。因此，你只需要直接复制表或直接对数据应用访问限制。


    # 只读 (Read-Only)


    由于我们处理的是生产数据库和数据湖的只读副本，最佳实践是设置仓库为默认只读。使用如 dbt 等工具通过数据之上的转换层进行现代数据建模。与其考虑 `UPDATE`
    和 `DELETE`，不如考虑 `SELECT`。


    即使没有别的，源表上的转换应该是幂等的（idempotent）。这意味着你能够完全销毁一张表并重建为先的仓库状态（假设源表或快照等有状态表没有发生不可恢复的丢失）。这种价值在于韧性，也在于简单性。分析师可以以
    `SELECT` 来思考，并让他们管理的代码为他们处理数据。而一次性的状态命令很难记录，任何阅读转换代码的人都可以确切看到在表构建期间删除了哪些行（如果注释良好，还可以知道为什么）。


    # 自定义用户组 (Custom User Groups)


    无论是否创建了只读从仓库，都要创建一个新的用户组。可以从该新用户组中排除特定列。应用行级权限允许授予访问，但限制了人员看到的行。


    # 行级权限 (Row-level Permissions)


    使用行级权限的一个极佳例子是在访问医院数据集时遵循 HIPAA 合规性（图 14.2）。医院内的每位医生都有权访问


    ![](img/07b10ae3f84ebfc0356cf70f4bf08c9e_176_0.png)

    图 14.2 应用了安全协议的仓库资源


    患者记录用于分析和审查。然而，我们希望防止每位医生都能访问所有患者。通过账户/所有权（无论是患者 ID、姓名）实施行级访问控制可以防止医生访问个人信息。


    你也可以将此应用于应用于小组：销售团队、客户跟踪和员工记录。这变得复杂，我们建议在仓库阶段尽量避免。请在下一节尝试使用数据市（marts）。


    # 哈希敏感数据 (Hash Sensitive Data)


    在对敏感数据进行分组或聚合时，创建数据的哈希版本是一个合理的选择。


    # 哈希 (Hashing)


    哈希是输入任何字符串并返回一个一致的、随机的称为哈希的长字符串的过程。增加原始数字或更改字符串中的一个字母应该产生一个与上一个完全无关的哈希。


    例如：


    ```

    abc -> hash function -> deia8f9e

    ab -> hash function -> 32131mo

    ```


    然后用户可以创建摘要，将敏感指标（如财务数据）聚合到适合不同部门查看的水平。实施的安全级别将限制在数据上可以执行的分析类型，但确保了敏感数据受到保护。


    # 数据伪匿名化 (Pseudo-Anonymize Data)


    减轻意外披露风险的一种方案涉及对 PI（个人身份识别信息）如姓名或地址进行伪匿名化处理，特别是当数据的最终消费者是第三方时。一个例子是从视图中删除患者的姓名和地址，以便任何访问仓库中数据的人无法识别其身份。


    # 如何在 BI 工具中保护敏感数据


    仅仅在数据库上设置正确的权限，不足以防止敏感数据的不当共享，如果你展示了


