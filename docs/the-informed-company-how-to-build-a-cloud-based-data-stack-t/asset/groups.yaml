    ## 临时架构 (Staging Schemas)


    ### 日期和时间


    标准化时间列对于实现数据自服务关重要。随着团队跨越时区且远程员工增加，使用协调世界时（UTC）格式使得日期和时间数据对他们更加灵活。虽然使用 UTC 在查询时可能会产生困惑，因为大多数人并不在这个时区内），但它保持了数据库层面的一致性。


    ### UTC


    协调世界时（UTC）是一种与时区无关的标准；有时被称为格林尼标准时间（GMT）。UTC 定义了相对于 0° 经平均太阳时的精确时间，不进行任何关于夏令时的调整。你可以根据所处的时区通过减小时数将一个时区转换为另一个。例如，太平洋标准时间比
    UTC 早 8 小时，所以如果 UTC 是上午 11 点，那么 PST 就是凌晨 3 点。


