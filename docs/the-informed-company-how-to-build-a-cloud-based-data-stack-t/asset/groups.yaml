    identified, given the values of columns When data cannot follow the third normal
    form, it’s better to break it into more tables.


    Traditional books recommend using dimensional modeling to create star schemas
    to make tables easier for analysis and to enhance performance. However, due to
    advances in BI tools and other data warehouse technologies, dimensional modeling
    is no longer the only or even best way because visualization products now support
    querying more complex schemas (Figure 9.2).


    ![](img/07b10ae3f84ebfc0356cf70f4bf08c9e_114_0.png)


    Figure 9.2 A view is an SQL abstraction on top of underlying data.'
  - '[PAGE 115]


    # The Power of Layers and Views


    With the advent of modern warehouse engines, the performance benefits of using
    star schema for marts no longer exist. They are a significant amount of work to
    implement, and the usability benefits be achieved through creating wide tables
    that are just as easy to understand. In fact, according to Michael Kaminsky in
    a guest post on Fivetran''s blog, wide tables actually outperform star schema.
    Keep your data in the same format as your data warehouse and occasionally make
    wide tables when needed.


    As we create these wider tables for the data warehouse, we should also look to
    exclude tables and columns that represent app-specific logic that isn''t needed
    for analysis. We want the warehouse to not only be readable but easy to navigate.
    A great way to ensure that each addition to the warehouse is useful is to build
    the warehouse in pieces.


    # Layer Views on Views


    Since a view produces a table from which we can query, we can create a view on
    top of a view (Figure 9.3). We first put a layer down to clean the tables from
    our data sources. This allows us to handle data source changes elegantly because
    the data sources are not directly being queried by the warehouse; we can change
    what things are referred to in these staging schemas and pass the new fields into
    warehouse views.


    ![](img/07b10ae3f84ebfc0356cf70f4bf08c9e_115_0.png)


    Figure 9.3 Views can reference other views allowing you to create layers within
    your warehouse.'
  - '[PAGE 116]


    # Layer Views on Views


    We can start by cleaning one table at a time and providing that to analysts and
    other business users. Then, we can begin joining these staging schemas together
    to create a warehouse that should be much easier to navigate.


    The process laid out does not have to be a straight line between two points (sources
    and an SST). Sometimes, the right strategy involves staging schemas (covered soon)
    more on the fly and tending to them as separate structures in your lake. After
    gaining some experience with your data models, you could work to combine them
    into a single source of truth.


    Why is this good alternative to aiming for a unified SST immediately? Staging
    schemas alone are a huge value add, as your goal is to organize and standardize
    data for maximum clarity. One step in this process is renaming columns to more
    easily understood names. With staging schemas, fewer members of your organization
    need to remember what obscure columns like c1, c2, c3 in your crm.users table
    mean.


    Modeling data decreases the necessary background knowledge your company must have
    to write queries of their own. This in turns the barrier to data literacy across
    your organization, and as we argued at the outset, a more informed team is a more
    effective one.


    If taking on the entire problem at once seems daunting, we still encourage you
    to jump in and get started with one table. We think you''ll pick it up quickly
    and find data modeling to be among the most impactful things anyone can do for
    a company''s success. It sure doesn''t hurt that this process can be a great deal
    of fun.'
- md: '

    ## The Power of Layers and Views


    Before we dive into the technical details, we''d like to offer perspective derived
    from working with several past companies working to move from data lake to date
    warehouse. We''ve seen teams struggle to move past the data lake. Cardinal sin
    number one is that teams misunderstand how and how much work building a data warehouse
    takes. They believe that the entire thing must be architected ahead of modeling
    and that it must be completed as part of a single project.


    It is not true; you do not have to build it all at once. We can continue to add
    layers of views on top of the data lake, making the data clean and more useful.
    Eventually the final layers will be the SST. This can be done incrementally one
    view and layer at a time. This also helps you stay organized and helps you avoid
    repetition.


    Here''s a word of reassurance before we begin. The anxiety or hesitation project
    leads often feel when scouting out the problem is understandable (Figure 9.4).
    There''s a lot of advice out there, but some of it conflicts and results on one-off
    blog posts. Meanwhile, books like Dimensional Modeling aim for completeness and
    technical precision at the price of practical comprehensibility (not to mention
    these were written largely before the current Cloud warehousing revolution). Plenty
    of well-equipped data professionals struggle to decide how to design and implement
    a data warehouse. We have even seen project leads overestimate implementation
    time in an attempt to hedge their position. Their estimated timelines? Development
    timescales on the order of months or even years!


    That said, we relate to how unclear it can be to set up a warehouse for the first
    time. The good news is that, like all problems in the engineering world, it can
    be broken down into steps and design principles, and can be tackled iteratively.


    ![](img/07b10ae3f84ebfc0356cf70f4bf08c9e_118_0.png)


    Figure 9.4 It may not be obvious at first how to model data, start with making
    one table easier to use.


    ## Start with a Single View


    Starting by cleaning a single table is very doable; before you know it, you will
    have cleaned several. These sub-problems are solvable with common sense design
    and a familiarity with SQL. We intend to touch on the major mechanics that you''ll
    need to tackle those challenges (Figure 9.5).


    ![](img/07b10ae3f84ebfc0356cf70f4bf08c9e_119_0.png)


    Figure 9.5 A warehouse is a cleaned usable version of the data in the lake.


    We need an individual to begin this process whom we dub the warehouse house lead;
    if you are reading this book, you may be one of them. Creating an effective data
    warehouse involves ongoing iteration and feedback. For that reason, we not only
    discuss how to build a warehouse but also the responsibilities involved with managing
    a warehouse.


    ## Chapter Ten


    ## Staging Schemas


    Before building the single source of truth, we recommend first making idealized
    versions of each of the sources in the data lake. These are called staging schemas
    (Figure 10.1).


    Generally, a staging schema holds models (i.e. tables or views) that handle transformations
    of this type. The tables and columns that are unneeded or empty are removed, weird
    names are improved, and unwanted data is filtered out. The value of investing
    time in cleaning and renaming data fields lies in making the data ready for more
    complex numeric transformations without needing to worry about these sorts of
    inconsistencies. Some may be concerned about the space implications from having
    many staging tables or repeated data. The good news, however, is that the compression
    strategies of a modern C-Store warehouse handle exactly this kind of data organization
    without noticeable performance hits.


    ## Staging Schemas


    ### SOURCE LAKE WAREHOUSE MART


    ![](img/07b10ae3f84ebfc0356cf70f4bf08c9e_121_0.png)


    Figure 10.1 The four stages of agile data organization with an intermediate step
    that illustrates where a “staging schema” is relevant.


    Here''s a last note on process: as each source is cleaned, it never hurts to give
    read-only access to departments across your organization. Showing the value of
    the modeling and asking for feedback during creation are ways your team can earn
    trust and confidence from stakeholders.


    ## Orient to the Schemas


    Go through the list of tables in the schemas and find ones that speak to the use
    case that has been identified. Identify tables that have any relevant columns
    even if it is only one. We have seen companies send out surveys to stakeholders
    to identify relevant tables, and we have seen companies where the warehouse lead
    makes the calls. This can be done iteratively; we can always add more tables or
    remove tables from the staging schema (Figure 10.2).


    ![](img/07b10ae3f84ebfc0356cf70f4bf08c9e_122_0.png)


    ## Pick a Table and Clean It


    Let''s explore different straightforward tools for making tables staging-schema-ready.
    These techniques should be applied to whichever subset of your sources needs cleaning.
    Which sources should have a staging model? Whichever will be used in the warehouse,
    even if the purpose of a staging model is to provide information to another staging
    table.


    First, start with one of your more important but also simple tables. We want our
    first modeling effort to be valuable but not too difficult. (A users table can
    be a good place to start.)


    Let''s take an example source users table in a data lake and explore the issues
    with it (Figure 9.5).


    ## Staging Schemas


    | Id | External_Id | Name | Display Name | Location | Info | is_deleted |

    |---|---|---|---|---|---|---|

    | 21590 | 68791 | Doop Consolate | D Gonzalez | United States | 1 | |

    | 13107 | 32699 | | Sales | USA | 3 | |

    | 29448 | 28175 | Josh | Redman | US | 2 | |

    | 32641 | 19673 | Hannah To | | US of A | 1 | |


    Figure 10.3


    1. Having multiple columns

    2. NULLs

    3. Unclear naming

    4. Inconsistent values

    5. Numeric categories

    6. Parsing JSON

    7. Deprecated data


    To address these issues, keep the analyst/business user in mind and make all of
    the fields easy to.


    ![](img/07b10ae3f84ebfc0356cf70f4bf08c9e_124_0.png)


    ## Eliminate Columns


    There are many reasons for seemingly unused columns; in this case we have an External_Id
    field that could be used to JOIN data. The purpose of certain fields is not always
    clear to analysts. Since there is already an Id column, and we''re unclear what
    External_Id means or what it should be used for, we can remove the External_Id
    column by commenting it out:


    ```

    SELECT

    Id,

    -- external_id, -- unused

    Name,

    Display Name,

    Location,

    Type,

    Info,

    is_deleted

    FROM

    app.users

    ```


    Later in the book we will show why this removal might have been an error and how
    to correct it.

    '
  mdcn: '


    ## 层与视图的力量


    在深入技术细节之前，我们想提供一些观点，这些观点源于与几家尝试从数据湖转向数据仓库的公司的合作经验。我们见过许多团队在跨越数据湖阶段时挣扎。第一个大忌，是团队误解了构建数据仓库所需的时间和工作量。他们认为在建模之前必须对整个系统进行架构设计，并且必须作为一个单一项目来完成。


    事实并非如此；你不需要一次性构建所有内容。我们可以在数据湖之上不断添加多层视图，使数据变得更清洁、更有用。最终，最后的层级将成为 SST（单一事实来源）。这可以通过逐个视图、逐层的方式逐步增量地完成。这也有助于你保持条理，并避免重复工作。


    在开始之前，这里给出一句宽慰的话。项目负责人在调查问题时经常感到的焦虑或犹豫是可以理解的（图 9.4）。市面上有很多建议，但其中一些是相互冲突的，且结果体现在一次性的博客文章中。与此同时，像《维度建模》（Dimensional
    Modeling）之类的书籍追求完整性和技术精确性，但是以牺牲实践中的可读性为代价的（更不用说这些书大部分是在当前的云仓革命之前写的）。许多装备齐全的数据专业人士在决定如何设计和实现数据仓库时感到困扰。我们甚至见过项目负责人为了自保而过度高估了实施时间。他们预计的时间线？开发周期长达几个月甚至几年！


    尽管如此，我们理解初次建立仓库是多么模糊。好消息是，像工程世界中的所有问题一样，它可以被拆分为若干步骤和设计原则，并通过迭代的方式来解决。


    ![](img/07b10ae3f84ebfc0356cf70f4bf08c9e_118_0.png)


    图 9.4 起初如何建模数据可能并不明显，但可以从让一张表变得易用开始。


    ## 从单个视图开始


    从清理单表开始是非常可行的；在你回过神来之前，你就已经清理了几表。这些子问题可以通过常识性设计和对 SQL 的熟悉来解决。我们打算触及应对这些挑战时需要的主要机制（图
    9.5）。


    ![](img/07b10ae3f84ebfc0356cf70f4bf08c9e_119_0.png)


    图 9.5 仓库是湖中数据经过清理后的可用版本。


    我们需要一个人来开始这个过程，我们称其为“仓库负责人”；如果你正在读这本书，你可能就是其中之一。创建一个有效的数据仓库涉及持续的迭代和反馈。因此，我们不仅讨论了如何构建仓库，还讨论了管理仓库涉及的职责。


    ## 第十章


    ## 临时模式 (Staging Schemas)


    在构建单一事实来源之前，我们建议首先为数据湖中的每个数据源创建理想化的版本。这些被称为临时模式（staging schemas）（图 10.1）。


    通常，临时模式包含处理此类转换的模型（即表或视图）。它会移除不需要或为空的表和列，改进那些奇奇怪怪的命名，并过滤掉不需要的数据。投入时间在清理和重命名数据字段上的价值在于，可以让数据准备好进行更复杂的数值转换，而无需担心这些不一致性问题。有些人可能担心拥有大量临时表或重复数据带来的空间影响。但好消息是，现代
    C-Store（列式存储）仓库的压缩策略恰恰能处理这种数据组织，且不会产生明显的性能影响。


    ## 临时模式


    ### 源湖、仓库、市层


    ![](img/07b10ae3f84ebfc0356cf70f4bf08c9e_121_0.png)


    图 10.1 敏捷数据组织的四个阶段，其中一个中间步骤说明了“临时模式”的适用处。


    关于流程的最后一点说明：当每个数据源被清理后，为整个组织中的部门提供只读访问并无坏处。展示建模的价值并在创建过程中寻求反馈，是团队赢得利益相关者信任和信心的方法。


    ## 确定模式方向


    遍历模式中的表列表，找到与已识别的用例相关的表。识别具有任何相关列的表，即使只有一个列。我们见过公司向利益相关者发送调查卷来识别相关表，也见过由仓库负责人做决定的公司。这可以通过迭代完成；我们随时可以从临时模式中添加或删除更多表（图
    10.2）。


    ![](img/07b10ae3f84ebfc0356cf70f4bf08c9e_122_0.png)


    ## 选择一张表并清理它


    让我们探索不同的简单工具，来使表符合临时模式的要求。这些技术应应用于任何需要清理的源子集。哪些数据源应该拥有临时模型？任何将在仓库中使用的数据源，即使临时模型的目的是为另一个临时表提供信息。


    首先，从你其中一个比较重要但也简单的表开始。我们希望我们的第一次建模尝试是有价值的，但不要太困难。（`users` 表是一个很好的起点。）


    让我们以数据湖中的一个示例源 `users` 表为例，探索它存在的问题（图 9.5）。


    ## 临时模式


    | Id | External_Id | Name | Display Name | Location | Info | is_deleted |

    |---|---|---|---|---|---|---|

    | 21590 | 68791 | Doop Consolate | D Gonzalez | United States | 1 | |

    | 13107 | 32699 | | Sales | USA | 3 | |

    | 29448 | 28175 | Josh | Redman | US | 2 | |

    | 32641 | 19673 | Hannah To | | US of A | 1 | |


    图 10.3


    1. 多个列

    2. NULL 值

    3. 命名不清晰

    4. 值不一致

    5. 数值分类

    6. 解析 JSON

    7. 弃数据


    为了解决这些问题，请记住分析师/业务用户，并让所有字段易于使用。


    ![](img/07b10ae3f84ebfc0356cf70f4bf08c9e_124_0.png)


    ## 消除列


    看似未使用的列有很多原因；在本例中，我们有一个 `External_Id` 字段可以用于连接数据。某些字段的目的对分析师来说并不总是清楚。由于已经有一个 `Id`
    列，而且我们不清楚 `External_Id` 的含义或用途，我们可以通过注释掉来移除 `External_Id` 列：


    ```sql

    SELECT

    Id,

    -- external_id, -- unused

    Name,

    Display Name,

    Location,

    Type,

    Info,

    is_deleted

    FROM

    app.users

    ```


    在书的后部分，我们将展示为什么这种移除可能是错误以及如何纠正它。


    '
