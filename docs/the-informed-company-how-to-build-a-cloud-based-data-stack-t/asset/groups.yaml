    ## Columnar Storage Data Lakes


    Columnar databases have grown in popularity and provide performance advantages
    for the analyst workflow. In practical terms, they are optimized for reading and
    computing on columns efficiently. Your lake should be built using a columnar database.
    After all, columnar storage has been optimized for analysis.


    ## Deciding Factors


    When selecting the right engine for an organization, the two main types of solutions
