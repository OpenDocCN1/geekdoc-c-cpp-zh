    # About This Book


    # Why Write This Book


    Most comprehensive books on analytics architecture that we''ve found are over
    a decade old, most of them pre-cloud. Because there really isn''t a modern equivalent
    to Kimball''s seminal The Data Warehouse Toolkit, today''s data teams have to
    reinvent the principles of building a data stack. To solve this problem, we have
    created a best-practices guide for bootstrapping and nurturing a technologically
    current data warehouse.

