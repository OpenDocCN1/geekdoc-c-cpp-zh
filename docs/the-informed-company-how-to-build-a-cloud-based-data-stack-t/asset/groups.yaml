    \ analysis more manageable. CTEs can also be handled programmatically with modeling\
    \ tools, which we will cover in the next chapter.\n\n# Common Table Expressions\
    \ (WITH statements)\n\nCommon Table Expressions, or CTEs, are queries that run\
    \ prior to the main query to produce a table of data that other queries in the\
    \ same file can access. They operate in same way as sub-queries but are often\
    \ easier to read and maintain. These are begun with the WITH keyword, a name for\
    \ the CTE, and the AS keyword.\n\n# Extract Fields from Structured Columns (JSON)\n\
    \nAnother common query hurdle arises from the format of the data itself. For example,\
