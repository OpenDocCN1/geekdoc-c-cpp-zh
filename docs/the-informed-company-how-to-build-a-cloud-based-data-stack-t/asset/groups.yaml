  mdcn: "\n其目前的形态显示出薄弱的迹象。它要么因为过于通用而缺乏价值（字段不足），要么因为太宽泛而包含大量空值，导致你在进行查询时必须非常小心。让它自然发展看看结果如何完全没问题，但预见到我们将不得不解决一些问题。\n\
    \n我们的一位客户成功经理表示，她的团队经常想要了解并跟踪客户的触点，但并不真正在意渠道。他们想知道我们是否已经与他们联系过，因此将所有客户信息整合在交互（Interactions）表中非常有帮助。\n\
    \n目前，SST 的使用仍然盛行，但随着越来越多的人开始，裂痕开始出现。例如，在将 Salesforce 的线索（Leads）和联系人（Contacts）数据合并到通用“Contacts”表中，我们最初将已转换线索过滤为重复记录。事实证明这对我们的营销和销售团队没有帮助，因为他们看重已转换线索的历史数据。\n\
    \n## 少计划，多实现\n\n在过去，数据建模师做了大量的设计工作。他们收集大量需求来确定确切的用例，并为业务用户创建星型模型（star schemas）。我们现在拥有工具和性能来使其成为一项更具协作性的工作，仓库负责人可以根据反馈进行建模和迭代。我们继续对架构进行迭代以适应业务需求，并相信架构设计是一个持续的过程。\n\
    \n特别是在为仓库中使用的源创建了临时模型（staging models）之后，我们尝试了许多表配置，以查看哪种配置最支持分析。由于一切都层位于数据库之上，因此可以随心所欲地更改。这需要更少的预先思考（这很大程度上是不可能的猜测）、更少的会议、更少的重构、更少的架构、更低的复杂性和性的重复。\n\
    \n## 致谢与贡献\n\n这本书是许多人的心血，并随着社区的参与不断演进。感谢每个人的帮助，使这本书成为构建数据栈的人们的一本实用指南。\n\n## 感谢\n\
    \n我要特别感谢 Matt David，他是 Data School 的负责人，感谢他和我一起花了许多小时处理这个项目的开头。他负责了项目管理、完善想法，并编写了本书的大部分内容，还不断招募社区参与。他向大众普及数据的热情非常鼓舞，与他工作是一件乐事。\n\
    \n我还要感谢 Tim Miller 和 Tracy Chow，他们为本书贡献了许多章节，并和我一起在内容上度过了许多压力巨大的时刻。感谢 Tim 和 Tracy\
    \ 对学习和教学的持续驱动力和热忱。\n\n此外，我想感谢 Chartio Data Advisor 团队的其他成员，他们每个人贡献了一个章节，并每天将书中的收获直接带给我们的客户。\n\
    \n感谢 Liz Wikstrom，感谢她一如卓越的设计和插图，致敬了这本书和网站。感谢 Eleanor Preston，感谢她在多次客户访问中帮助我理清了这个框架——并执着地等待我们出版！\n\
    \n感谢 Blendo 的 Kostas Paradalis，感谢他对 ETL vs ELT 章节提供的建议。感谢 Tristan 为序言的写作提供反馈。\n\
    \n最后，非常感谢我们的编辑：Emilie Schario、Mila Page 和 David Yerrington。他们帮助我们度过了这本书最困难的部分，并确保了内容的清晰准确。\n\
