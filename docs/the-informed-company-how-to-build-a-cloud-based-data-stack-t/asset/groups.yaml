    # 第一次尝试——带前缀的表格


    ![](img/07b10ae3f84ebfc0356cf70f4bf08c9e_240_0.png)


    图 21.3 Data Grip，一个 SQL 编辑器。


    来源：Data Grip


    ![](img/07b10ae3f84ebfc0356cf70f4bf08c9e_240_1.png)


    图 21.4 选择了“列插入”功能的 SQL 编辑器。


    来源：Data Grip


    # 构建 SST 示例


    ![](img/07b10ae3f84ebfc0356cf70f4bf08c9e_241_0.png)


    图 21.5 插入了列的 SQL 订单。


    为了贯越多个表。例如，要查找客户向我们的支持渠道写入信息的所有记录，我们需要同时从 `Inter Conversations` 表和 `Zendesk Tickets`
    表进行查询。


    我们还有类似命名的表，如 `Chartio Users`、`Intercom Users`、`Salesforce Users`、`Zendesk Users`
    等。


    这种架构布局对于已经熟悉底层工具和源数据的用户来说是最有用且易于使用的，但对 Salesforce 或 Hubspot 的新手来说，他们并不一定知道去哪里查找数据。毕竟，可能并不清楚什么被视为
    Salesforce 任务（Task），而什么被视为 Salesforce 事件（Event）。


    # 反馈是什么？


    我们的客户成功团队和工程部副总裁喜欢这种 SST 布局。对于精通数据型用户和熟悉原始源架构的用户来说，使用我们熟悉的这些表格很容易，而且源前缀清楚地表明了表中的数据来自何。然而，对于业务用户或全新的用户来说，定位他们正在寻找的数据可能会更加困惑。根结底，SST
    的目标是让数据对业务用户更易获取，因此我们仍有很多工作要做。


    # 第二次尝试——操作性架构（源无关）


    在 SST 的这个版本中，我们将“掩盖”数据来源的所有底层源，并创建我们自己的完全全新的架构。其想法是：如果我们所有的工具都是内部构建，而不是来自不同的地方，情况会怎样？这意味着我们不再使用工具名称作为表的前缀，而是将来自多个源的数据合并到像“Users”、“Tickets”等这样的通用表中。HubSpot
    Contacts 和 Salesforce Contacts 数据也可以合并到单一的“Contacts”表，甚至可以与“Users”表合并。


    # 我们保留了哪些表格？


    在这一阶段，我们已经同意在 SST 之前增加一个单独的阶段处理（staging）步骤。阶段层看起来与第一次尝试非常相似；但所有的底层源数据都包含在各自独立的基准架构（base
    schemas）中。决定保留哪些表的流程与第一次尝试相似。这里的决策更多在于确定哪些表需要合并，以及我们几乎从零开始构建的这个新架构将是什么样。


    例如，对于是否保持 Salesforce Leads（潜在客户）和 Contacts（联系人）表分离存在。从概念上讲，它们都包含与人员相关的数据，但在操作上，它们的使用方式不同，对业务的意义也不同。将
    Leads 和 Contacts 表与我们的 Chartio 表合并还会创建一个包含大量列和空值的巨宽表。如果我们这样做，万我们想确定


    我们有多少 Salesforce Contacts 同时也是我们应用程序中的用户呢？这是否会像简单地加一个布尔标记“is_chartio_user”？我们该如何连接这些表？将我们的应用程序“Organizations”表与
    Salesforce 的“Accounts”表合并是否有意义？


    我们必须深入思考这些决策的影响，以及列和字段在每个源中是如何被区别处理的。一个例子是，在我们的应用程序中，用户可以属于多个组织，而在 Salesforce
    中并非如此。在这种情况下，我们必须接受在每个表中存在重复记录，或者为了回答问题，在


    表 21.1 重复记录


    | 用户 ID | 邮箱 | 联系 ID |

    | --- | --- | --- |

    | 21457 | burt@example.com | 003100 |

    | 21458 | burt@example.com | 003101 |

    | 21459 | burt@example.com | 003102 |


    # 我们是如何做出这些决策的？


    为了确定这个新架构长什么样，以及哪些表的合并是合理的，我们进行了多次白板会议。我们必须深入思考这些决策的影响，以及列和字段在每个源中是如何被区别处理的。一个例子是，在我们的应用程序中，用户可以属于多个组织，而在
    Salesforce 中并非如此。在这种情况下，我们必须接受在每个表中存在重复记录，或者为了回答问题，在


    # 哪些是不理想的？


    在这种方法下，我们通过合并表格创建了包含大量空值的巨宽表。为了避免让 SST 出现额外的表格列表，我们在第一次迭代中去掉了我们认为只需查询的表。如果我们后来发现用户需要那些未包含的表，我们可以再添加。


    在决定如何连接表格时，我们必须查看一个源的列是否可以轻松映射到另一个源的列。例如，Zend 的“Requester Id”字段可以映射到 Intercom
    的“Author Id”字段。Salesforce Contacts 和 Hubspot Contacts 包含一些我们需要的重复字段。


    # 反馈是什么？


    客户成功成员对这种方法感到担心，因为对于熟悉原始表格的用户来说，需要更多时间来学习和培训新架构。对于业务用户来说，这种架构可能更理想，因为它是以为中心而非以源为中心。


    # 第三次尝试——应用程序分离，其他合并


    在对第一次尝试和操作性架构进行大量讨论后，我们确定了一个以 Chartio 为中心的 SST。这意味着我们的 Chartio 应用程序数据将与其他数据分开。除此之外，这与操作性架构完全相同。


    # 我们保留了哪些表格？


    选择将哪些表添加到 SST 中（类似于第二次尝试）很大程度上取决于哪些表是频繁使用的。为了不让 SST 出现额外的表格列表，我们在第一次迭代中去掉了我们认为只需查询的表。如果我们后来发现用户需要那些未包含的表，我们可以再添加。


    来自工程部副总裁的直接反馈：“我认为尝试将所有的交互和联系人合并到一个表中正显示出问题”


