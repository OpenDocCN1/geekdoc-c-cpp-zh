    however, scalability potential is lower than columnar-based data warehouse solutions.


    Redshift is a good choice as a standard cloud data warehouse where a dedicated
    DBA can manage it. BigQuery and Snowflake are both highly scalable solutions that
    don''t require sophisticated management in contrast to Redshift. If concurrency
