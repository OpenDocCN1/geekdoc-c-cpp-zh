    # 第一阶段：源

    又称孤岛数据


    ![](img/07b10ae3f84ebfc0356cf70f4bf08c9e_38_0.png)


    # 源阶段概述


    现代企业（即使是规模较小的企业）也会产生大量数据，分为多种类型——产品信息、客户信息、应用性能、营销支出等。新创企业可以直接从源头处理生产数据库、产品 API
    和财务数据。


    随着时间的推移，由于源积累了更多数据，数据通道的数量也随之增长。管理跨独立源的数据变得更具挑战性。


    本节关于如何帮助你处理源。我们将讨论什么是源以及我们能对它们做什么。从那里开始，我们调查了常用的用于连接和调查源的工具；对于每个示例，我们对你的团队如何使用这些工具提供了快速但经过测试的思考。最后，我们将对源阶段期间的数据完成讨论。我们提倡使用源副本和简化的数据智能工具。


    该阶段对于数据需求极少的新公司或团队是理想的。它成本低廉，且相对容易进行工具化、实施和维护。虽然构建复杂的数据栈令人兴奋，但在情况需要之前，这并不是必要的。过度工程是一个昂贵的错误。然而，第
    1、2 和 3 章中讨论的方法为你们未来的数据湖和数据仓库奠定了基础，这些将随着源规模和多样性的增加而出现。


    # 第一章


    ## 从源数据开始


    从从零开始时，请记住数据增长的潜力以及用户未来的可用性需求。在开始，源是彼此隔离的孤岛。数据流留在自己的“孤岛”中。当数据团队较小时，一组数据源很容易维护和监控。例如，为了支持新的数据团队，许多数据源都有其内置的仪表板和报告功能（参见
    Salesforce、Heap 等）。


    虽然单源数据并不强大，但它并非完全无用。基于单源数据构建的解决方案的一些日常用例包括：


    - 生成客户获取指标的数据库查询。

    - 显示月销售额并带有可下载电子表格的仪表板。

    - 允许搜索引流流量的自定义 Web 应用。


    # 从源数据开始


    孤岛式报告无法产生更精细团队所需的强大数据洞察，但这通常是团队必须开始的地方。分析师的角色变成了利益相关者的导师——分析师必须理解源，并支持那些读取和交互这些有限数据的利益相关者。分析师可能会从多个逗号分隔文件
    (CSV) 中汇总数字，并在 Excel 或使用基础 SQL 查询运行手动分析。


    在我们探索数据源时，请记住，分析师为团队做的贡献远不止于使用业务智能工具、Excel 和简单查询。随着时间的推移，他们可以在数据之上构建抽象，使数据对其他同事可访问并实现自服务（更多内容将在阶段
    2 和 3 中讨论）。


    # 分析源数据的常用选项


    数据最终进入许多不同的地方，分析它们的方法归结为应用程序仪表板、Excel 电子表格、SQL IDE、云仪表板工具或业务智能 (BI)。我们将介绍几种用于与源交互的常用工具，并对在何时以及如何使用它们给出简短判断（图
    1.1）。


    ![](img/07b10ae3f84ebfc0356cf70f4bf08c9e_41_0.png)


    图 1.1 用于数据源各种分析方法。


    # 分析源数据的常用选项


    ## 通过应用程序仪表板了解数据


    许多现代软件服务 (SaaS) 应用内置了一组固定的仪表板和可视化图，用于展示它们捕获的数据（图 1.2）。这些图表针对特定用例进行了高度调整，可以提供丰富的信息——并且可能满足所有数据需求。某些工具（如
    Salesforce）甚至内置了自定义图表和仪表板创建器以支持即席查询。许多工具还使用自定义查询语言。这些非常有帮助，特别是当不需要将此数据与其他数据结合查看时。这些工具价值主张的补充是供应商支持人员，他们帮助回答问题或满足特殊的数据需求。


    一点警告：留意单源数据与其他源结合的频率。也许你经常要满足诸如“告诉我什么类型的客户产生了最多的客户支持工单”之类的查询，即需要跨多个源分析的业务请求。如果你的团队自己经常充当单源之间“粘胶水”的角色，那么可能是时候移动到数据湖阶段了。


    ![](img/07b10ae3f84ebfc0356cf70f4bf08c9e_42_0.png)


    图 1.2 显示来自 Zendesk 的常见指标的内置仪表板示例。源："Zendesk"


    ## 使用 Excel 提出有趣的问题


    大多数应用程序都可以将其部分数据导出为 CSV 文件（图 1.3）。任何拥有 Excel 或 Google 表格的人都可以导入数据并进行分析。虽然这是扩展对数据应用可以提问题的有效方式，但它是相对手动的，并且需要频繁更新数据实时性。


    ![](img/07b10ae3f84ebfc0356cf70f4bf08c9e_43_0.png)


    图 1.3 Web 服务仪表板上的基本导出功能，提供 CSV 下载。

    源：Microsoft


    ## 使用 SQL IDE 查询数据库


    对于生产数据库等数据源，可以直接从命令行进行查询，但这可能会变得杂乱，并且难以跟踪查询和结果。我们建议设置一个集成开发环境 (IDE)，如 pgAdmin，以便更好地处理架构模式内的数据查询（图
    1.4）。这些工具具有支持编写查询（即自动补全）、保存查询和导出数据的功能。


    # 分析源数据的常用选项


    ![](img/07b10ae3f84ebfc0356cf70f4bf08c9e_44_0.png)


    图 1.4 pgAdmin 仪表板是一个流行的 PostgreSQL IDE。

    源：pgadmin.org


    ## 在办公中使用仪表板可视化数据


    Geckobord 或 Grow 等工具通过 API 接收云应用的数据，然后以简单有效的方式可视化数据（图 1.5）。这些工具可以将来自多个源的数据融合到单个仪表板中。


    这类云仪表板通常带有一些默认仪表板，并且在电视上看起来很好。然而，这些解决方案在自定义方面是有限的。


