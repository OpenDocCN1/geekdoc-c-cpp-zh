    both the destination and the data source are connected, then light data transformations
    are performed, for example, selecting what tables and fields to sync, hiding some
    values for privacy reasons.


    Data loading with vendors requires minimal engineering effort in most cases (Figure
    6.4).


    ![](img/07b10ae3f84ebfc0356cf70f4bf08c9e_86_0.png)


    Figure 6.4


    # Extract Options


    Extraction is the phase of pulling data out from a data source, through APIs or
    SQL. We can do a complete extraction of all data available, or we can do an incremental
    extraction every time we synchronize our data. A complete extraction extracts
    all the data from the data source. An incremental extraction only extracts updated
    records from the data source.'
  - '[PAGE 87]


    # Complete Extraction


    Complete extraction of data is the easiest way in since no configuration is required,
    but it has three potentially significant disadvantages.


    +   Historical data and state is lost.

    Imagine a row or field was deleted in a source. The next time we extract all data
    from our sources, we may lose historical context. Consider that an analyst looking
    at the source for the first time has no knowledge about what columns or rows used
    to exist. In addition, if fields contain changing dimension fields (like a "status"
    or "type" field), you might overlook the old values in place and no longer have
    a record of what the business logic used to be.


    +   Duplicate data ends up in the data lake.

    It can make sense to keep existing extractions of the data when a complete extraction
    is done so that you find data that was deleted or previous values of slowly changing
    dimensions. This can result in a lot of extra data. While data is relatively cheap
    to store and compute, this can become problematic to load and store as the amount
    of data scales.


    +   The complexity of the next steps in the analytics stack increases. Sometimes
    taking all the data "as-is" means creating work later on to make sense of it.
    One caveat when considering a full extraction is that some columns and tables
    may prove to be very useful for analysis. In stages beyond the data lake, we''ll
    be focused on cleaning data. This involves removing extraneous columns. By taking
    in all columns now with a complete extraction, you may be making things more complicated.


    # Incremental Extraction


    The preferred alternative is to do incremental extractions. Incremental extractions
    are challenging due to the check for new or updated rows and account for changing
    schemas. However, it is typically preferred because less data is processed, requiring
    fewer updates to the data lake. All cloud ELT vendors support incremental extractions
    from data sources.'
  - '[PAGE 88]


    The main downside of incremental extraction deletions in a data source, which
    are not easy to detect. This is because it would need to scan the entire database
    and have saved snapshots of the history. How does anyone know something is missing
    if there is no record of it? ELT providers do not guarantee consistency under
    deletions in most cases; in some cases, it’s possible or implemented by the source,
    for example, data is never deleted but flagged as “is_deleted” instead.


    A complete dump would guarantee always having a replica of the source state (Figure
    6.5). Keep in mind that in analytics this is not that useful, but keeping the
    deleted records might be required for other reasons such as compliance.


    ![](img/07b10ae3f84ebfc0356cf70f4bf08c9e_88_0.png)


    Figure 6.5


    # Load Options


    However the data is extracted from its source, there are multiple ways to store
    it in a database. Push changes through to existing data in the data lake or store
    this new data separate from existing data.


    # Push Changes


    When using a database system as a data lake, the updates to the data can be loaded
    and pushed into the existing schema. This will end up having a close replica of
    the data from the source system to the data lake, and it optimizes storage.'
- md: '

    # Store Separate


    Another option is saving changes without updating the records. Saving changes
    separately when using a file system data source avoids adding complexity to the
    data lake. The benefit of storing changes separately is that there''s a history
    of how data has changed.


    # Multiple Schemas


    Many EL vendors insert each source into the lake as a new schema (Figure 6.6).
    The organization of schema by source eliminates the chance of commonly named tables
    overwriting each other.


    When querying between schemas, it''s only necessary to remember to specify the
    schema names in addition to the table names. For example, we could combine Salesforce
    user data with Zendesk user data:


    ```sql

    SELECT

    *

    FROM

    salesforce.user AS sf_user

    JOIN

    zendesk.user as zd_user

    ON

    sf_user.email == zd_user.email

    ```


    ![](img/07b10ae3f84ebfc0356cf70f4bf08c9e_89_0.png)


    Figure 6.6


    This can be useful for a query to figure out what size companies have the most
    number of tickets. Combining sources like this will become a best practice, which
    we will cover in Stage 3: Data Warehouse.


    # Other Extract and Load Routes


    ## Traditional ETL


    For the reasons we''ve outlined here, we recommend ELT over ETL. If traditional
    means of ETL are necessary, with transformations happening before they are loaded
    into the lake, there are products that help support it such as Xplenty or Amazon
    Glue. There are also source tools such as Airflow which many people use to orchestrate
    their data pipelines.


    ![](img/07b10ae3f84ebfc0356cf70f4bf08c9e_90_0.png)


    ## Apache Airflow


    Apache Airflow is a popular open-source project that allows developers to create
    custom workflows that commonly involve data transformations and other types of
    ETL tasks.


    Using traditional approaches skips over the lake stage and goes straight to a
    data warehouse. This makes data transformations difficult to keep track of and
    update as needed. Without some kind of structure to keep things organized, it''s
    unclear what queries are doubling the work of others. At best, you go digging
    through code snippets and ad-hoc SQL files to figure out what certain transformations
    are trying to accomplish. In the long run, we''ve found that this ends costing
    more money than saved initially.


    ## DIY


    When building a data lake, it may be tempting to implement a custom solution for
    loading the data to it. There are a number of maintenance costs to keep in mind:


    - Slowing other projects down.

    - Updating code whenever data changes.


    # Extract and Load (EL) Data


    - Updating code for new BI requirements.

    - Exponential complexity as the number of data sources increase.

    - Exponential complexity to confirm data integrity as data grows.

    - Having to keep track of end-to-end scripts (e.g. so-called transformation pipelines).

    - Managing the infrastructure to support all of the above.


    Generally, extract and load projects start simple but then require quite bit of
    effort to maintain long term as data grows in complexity. The biggest reason DIY
    is generally a wrong choice is that extracting and loading costs more when data
    scientists, analysts, and engineers do it rather than a third-party service provider.
    The cost of extracting and loading data in this day and age is now cheaper than
    it ever has been, and it makes sense to use services like Stitch, Fivetran, and
    so on as much as possible.


    However, building a custom extract and load solution in-house makes sense when:


    - The data source is not supported.

    - The EL service level agreement isn''t comprehensive enough.

    - Business requirements are not met by third-party tools.


    While implementation is possible with DIY pipelines and useful in the scenarios
    above, using a vendor saves a lot of time and money. Using a provider to extract
    and load data is simpler to maintain, and it also allows data professionals to
    work on more valuable tasks.


    # Chapter Seven


    # Data Lake Security


    Besides making data querying easier, data lakes in fact lead to better security
    outcomes. Without a unified data store, all analysis occurs in many different
    places. These far-flung data sources require individual logins, which are hard
    to track and maintain the appropriate levels of access. It can be hard to redact
    sensitive information that should not be used in company analytics. In other words,
    different sources of data are hard to manage.


    With all the data in one spot and in one common engine, a data lake makes managing
    permissions much simpler. Common warehouse solutions come with power IAM management
    tools in ordinary database security features.


    Likewise, data coming into the data lake is likely not clean, so sensitive information
    may still exist. A data lake gives your security specialists fine control over
    what data can and cannot be accessed.


    Avoid extracting or loading sensitive data/columns; instead, configure these items
    within the ELT tools. Also, be mindful of who can access the data lake since more
    data is accessible than individual data sources initially.


    # Access in Central Place


    To simplify the management of access across multiple data sources, we recommend
    removing access from specific tools (such as BI), then migrating all access management
    to the data lake. Limiting access from multiple sources to one lake cuts down
    on access requests and mishaps where people retain access to information they
    shouldn''t have. You can then provide BI tool access to this new singular source
    (Figure 7.1).


    ![](img/07b10ae3f84ebfc0356cf70f4bf08c9e_93_0.png)


    Figure 7.1 Security moves from each data.


    # Permission Tiers


    Now that the data is in one place, granting permission is simple. However, specific
    controls should be put in place to prevent users from seeing data they shouldn''t.
    Start out by creating two groups on the data lake as follows:


    1. For admin and engineers (Full Access)

    2. For analysts and business users (Relevant Access)


    In general, set broad controls for ease of management. As a company grows in sophistication,
    it''s easier to create more refined permission settings. In Figure 7.2 we see
    engineering maintaining access to all schemas except marketing.


    | | MARKETING | ENGINEERING | SUCCESS |

    |---|---|---|---|

    | Chartie Analytics | | ✓ | |

    | Financials | | ✓ | |

    | Hubspot Stitch | | ✓ | |

    | Fivetran Salesforce | | | |

    | Fivetran Marketo (Deprecated) | | ✓ | |


    Initially, data lakes will not be well organized or maintained with a broader
    audience mind. When first loading data sources to a data lake, their structure
    is pretty much the same as before they ended up in the lake (Figure 8.1). These
    structures can be hard to understand and query; however, they do not need to be
    cleaned up too much. The majority of the cleaning will take place in the data
    warehouse.


    The areas of focus for data lake maintenance are around:


    - SQL

    - Extracting and loading of data sources

    - Performance


    ![](img/07b10ae3f84ebfc0356cf70f4bf08c9e_97_0.png)


    Figure 8.1 Source data being loaded with SQL into a data lake.


    These maintenance activities can be expensive once data is extracted and loaded
    with custom scripts. It is necessary to have in-depth knowledge of the data, such
    as where data originates, the details of the APIs, and the data structures inside
    it. Also, the potential need to write new code and maintain existing code when
    data sources updates is high. We recommend avoiding manual extract and load; use
    tools like Fivetran or Stitch, which automatically handle data source updates
    so that any data engineers can focus on more critical tasks.


    # Why SQL?


    While the data could be loaded into the lake in a variety of formats, we recommend
    SQL (Figure 8.1). It''s the standard language

