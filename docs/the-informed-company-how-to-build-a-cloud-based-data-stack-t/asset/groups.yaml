    * Performance/Scale

    * Maintenance


    There are a variety of database pricing models, from being based on storage to
    being based on the amount of data queried. Com-panies that are strictly using
    Amazon or Google as their software vendors may dictate the vendor choice as well.


    The architecture of the data lake has implications on how it operations scale.
    Differences in the many types of lakes entail columnar versus row-oriented storage
    and having storage and compute together or separated. Maintenance requirements
    of a data lake may impact the decision as well.


    # Modern Warehouse Engine Products


    Today, there are three dominant choices for cloud-based data ware-house engines:
    Amazon Redshift, Google BigQuery, and Snow-flake. Note: all of these are similar
    and based on the C-Store paper.


    # Amazon Redshift


    # Pros


    Redshift (Figure 5.3) has the benefits of ease of use, speed, and cost. Being
    a part of AWS, there is full-service integration for the broad range of AWS services
    such as S3 for storage and Cloud-Watch for infrastructure monitoring. Redshift
    is generally cheaper'
