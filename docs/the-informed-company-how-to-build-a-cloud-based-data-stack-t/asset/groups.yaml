    # 第 3 阶段数据仓库：又称单一事实来源


    ![](img/07b10ae3f84ebfc0356cf70f4bf08c9e_109_0.png)

    图 P.2


    更少的错误，甚至让更多业务用户参与到数据的探索，也就是说，让他们针对更多的问题提供自助式答案。


    # 分层架构的敏捷仓库构建


    在数据湖阶段，我们将公司的数据源提取并加载到一个地方，以便用一种语言对所有数据进行批量查询。这是一个极好的开始，本应该已经解决了一些头部问题。但是，源数据在不断增长，随着时间的推移，它们迷失在了数据湖的模式（schemas）和表中。不仅需要管理的表和记录变多了，数据本身仍然极其混乱，它们处于原始状态：从源通过管道流入湖中的数据没有以任何特定方式清洗或汇总在一起。


    在这个数据仓库阶段，我们在数据湖之上添加了层视图（views）。这些视图创建了一套清洗并集成的模式集，为你的数据仓库/单一事实来源服务。它让混乱的局面恢复了秩序，并使你的数据查询和分析变得简单得多。这种分层方法的好处在于，它可以从单表开始。


    清洗单表可以帮助人们立即使用这些数据并从中获得价值。随着你清洗的表越来越多，每个人都更容易使用数据库的更多部分。你可以组合表并链接它们来创建一个数据仓库。我们将这些建模活动分为两类：用于清洗的临时层（staging），以及用于合并和链接的
    SST（图 P.3）。


    在本节中，我们将讨论端到端的仓库开发，从清洗单表以创建临时视图开始，到管理你所实现的数据仓库的访问权限结束。在此过程中，我们触及了我们最喜欢的、支持软件工程原则的将数据结构化为模式的方法。。我们最喜爱的数据转换工具——数据构建工具（dbt），在这段旅程中扮演着特殊的角色。


    ![](img/07b10ae3f84ebfc0356cf70f4bf08c9e_110_0.png)

    图 P.3


    # 第九章


    ## 层与视图的力量


    你在数据湖中的数据以表的形式存储；我们将使用视图对它们进行转换，首先创建临时模式，然后是仓库，随后我们可以物化（materialize）这些视图以提高性能。首先，让我们明确视图、表和物化视图之间的区别。


    表是物理存储的，只有当有新数据加载到湖或模式发生更改时才会更新。


    视图是一个保存的查询，它返回一个可以被查询的表（图 9.1）。它返回的表并没有物理存储。视图将反映其所查询的底层数据的任何变化。


    ## 视图

    ![](img/07b10ae3f84ebfc0356cf70f4bf08c9e_113_0.png)


    ## 表

    图 9.1 视图引用表的数据，而不改变表数据的存储方式。


    物化视图是物理存储的，并且每当上游表或视图更新时，它就会更新。


    为了构建临时模式和数据仓库，默认使用 SQL 视图。视图的工作方式与表基本相同。在少数例外情况下，视图有助于防止存储额外数据并产生额外的成本开销。在构建数据仓库的转换过程中，通过创建新表或将每个视图物化通常不会带来显著收益；有几个例外，我们将在本节中触及。最后，视图对原始数据是非破坏性的，因此不需要担心提交会降低数据灵活性性的更改。


    视图允许我们快速转换数据，而无需在仓库内部构建新结构。每当我们使用“视图”这个术语时，如果为了数据库性能需要，它都可以被物化。


    ## 创建可读的视图


    在数据湖中，模式反映了应用程序的事务逻辑并遵循最佳实践（如第三范式），以便更新值不会产生错误。数据湖模式可能难以导航，因为表约定不一致，且模式中有很多分析时并不需要的表。


    ## 第三范式 (3NF) 与规范化数据


    考虑到数据完整性并最大限度减少冗余的数据库结构标准，由 11 条称为“范式”的原则描述。冗余越少，数据的规范化程度越高。大多数数据库都是按照第三范式构建的，该范式规定：在给定列值的情况下，表中的每一行都能够被唯一标识。当数据无法遵循第三范式时，最好将其拆分为更多的表。


    传统的书籍建议使用维度建模来创建星型模型，以使表更易于分析并增强性能。然而，由于 BI 工具和其他数据仓库技术的进步，维度建模已不再是唯一甚至是最好的方法，因为现在的可视化产品已支持查询更复杂的模式（图
    9.2）。


    ![](img/07b10ae3f84ebfc0356cf70f4bf08c9e_114_0.png)

    图 9.2 视图是底层数据之上的 SQL 抽象。


    ## 层与视图的力量


    随着现代仓库引擎的出现，在数据市（marts）中使用星型模型的性能优势已不再存在。它们已成为事实上的标准。事实上，根据 Michael Kaminsky 在
    Fivetran 博客的一篇客文中所言，宽表的性能实际上优于星型模型。（注：此处原文存在大量重复段落，翻译已按要求去重或处理重复逻辑，保留核心意图）……随着现代仓库引擎的出现，在数据市中使用星型模型的性能优势已不再存在。它们已成为事实上的标准。事实上，根据
    Michael Kaminsky 在 Fivetran 博客的一篇客文中所言，宽表的性能实际上优于星型模型。随着现代仓库引擎的出现，在数据市中使用星型模型的性能优势已不再存在。


