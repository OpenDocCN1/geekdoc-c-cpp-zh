    用于关系型数据库管理系统（这是数据仓库构建的基础），并且它是数据湖的理想环境。在基于 SQL 的模型中工作是理想的，原因有以下几点：


    - 许多工具和平台都支持 SQL。

    - SQL 可以放入版本控制系统中进行团队协作。

    - 绝大多数数据专业人士和一些业务用户精通 SQL。

    - SQL 简化了仓库的管理和集成。


    ## 数据源


    维护问题发生的主要地方是源端数据发生变化，或者数据未能从源端进入数据湖（图 8.2）。


    ![](img/07b10ae3f84ebfc0356cf70f4bf08c9e_98_0.png)


    图 8.2 向数据湖添加更多数据源。


    ## 添加新数据源


    理想情况下，这只需在 ELT 产品中点击几个按钮那么简单。Fivetran 和 Stitch 等产品具有针对不同数据源的大量连接器（图 8.3）。


    ![](img/07b10ae3f84ebfc0356cf70f4bf08c9e_99_0.png)


    图 8.3 连接到数据湖时出错的数据源。


    ## 数据源更新


    源不断变化，而 ELT 工具负责管理这些变化。ELT 的目的是将数据从源移动到其他数据存储器，因此当 API 更新格式时，这些类型的 ELT 工具确保正确的数据仍然移动到正确的位置。


    ## 修复损坏的连接


    有时，需要手动重新配置某些源查询。例如，当数据源添加新字段或删除特定表时，BI 工具依赖的某些查询可能会崩溃（图 8.4）。这虽然令人沮丧，但追踪损坏的查询并更新它们以适应新版本的
    API 可能是无法避免的。


    例如，有人可能会更改 Salesforce 中的字段名，比如将 `arr`（年度经常性收入）更改为 `arr_dollars`。我们的仪表板上可能有这样一个会损坏的查询：


    ```

    SELECT

    SUM(arr)

    FROM

    salesforce.leads

    ```


    我们需要更新查询中的字段名，使其与数据源保持。


    ```

    SELECT

    SUM(arr_dollars)

    FROM

    Salesforce.leads

    ```


    ![](img/07b10ae3f84ebfc0356cf70f4bf08c9e_100_0.png)


    图 8.4 关于到数据湖连接的警告。


    ## 数据湖维护


    每个 BI 产品都有处理迁移的不同方式。与其担心数据如何被处理和视觉化，由数据湖驱动的团队只需要担心如何向前加载这些信息——这是一个更容易解决的问题。


    ## 性能


    在涉及优化时，在敏捷组织的数据湖阶段，最实用的方法是将注意力集中在仪表板或查询级别。


    ## 优化单个查询


    在优化查询时，有几个简单的概念需要记住。对查询性能影响最大的策略包括：


    - 仅连接必要的列。

    - 仅选择分析所需的列。


    ![](img/07b10ae3f84ebfc0356cf70f4bf08c9e_101_0.png)


    ## 书籍推荐


    我们想教你关于 SQL 优化的一切，但那有点偏离主题。我们推荐 Matt David 写的在线书籍《Optimizing SQL》：


    https://dataschool.com/sql-optimization/


    ## 缓存


    许多 BI 产品允许缓存数据以提高查询速度，这减轻了数据库的压力（图 8.5）。它将查询从直接命中数据库转移到更快的数据存储器。缓存允许查询多次使用更快的数据存储器而不产生性能损失。缓存的唯一缺点是它降低了分析查询的实时性；查询命中的是存储器而不是实时数据。在缓存更新之前，数据不是实时的。


    ![](img/07b10ae3f84ebfc0356cf70f4bf08c9e_102_0.png)


    图 8.5. 数据库接收查询，然后从缓存存储器中获取取数据。


    ## 创建限制


    某些平台在并发处理方面存在困难，即许多人同时查询同一个源端。通过限制人们在数据库上执行查询的次数来提高查询速度。虽然这可能会打击人们的好奇心或分析，但它可以快速解决这个性能问题（图
    8.6）。


    查询可以通过不同的方式进行限制：


    - 限制查询的人数。

    - 限制每天的查询次数。

    - Big Query——设置最大字节数（图 8.7）。


    ## 数据湖维护


    ![](img/07b10ae3f84ebfc0356cf70f4bf08c9e_103_0.png)


    图 8.6 AWS Redshift 仪表板上的“工作负载管理配置”部分。

    来源：Amazon.com, Inc.


    ![](img/07b10ae3f84ebfc0356cf70f4bf08c9e_103_1.png)


    图 8.7 在 Google Cloud 中，可以限制资源。

    来源：Google


    ## 数据湖维护


    ## 调度


    检查 BI 产品是如何调度的。它是自动运行的还是手动过程？Chartio 等产品具有在非峰期运行的选项（图 8.8）。


    ![](img/07b10ae3f84ebfc0356cf70f4bf08c9e_104_0.png)


    图 8.8 Chartio 中的仪表板。

    来源：CHARTIO


    ## 升级到视图


    数据已经过清洗和组织，对所有人都更易访问。这被称为视图（更多信息见下一节）。


    ## 第 3 阶段

    ## 数据仓库


    ## 仓库概述


    数据仓库通过在数据湖之上构建视图来创建，使数据更易于使用。这是一个强大的抽象，可以管理增长和变化的数据源。


    ## 单一真相


    想象一个单一、全面且组织的数据库运行你公司的第三方 SaaS 应用套件。数据有清晰的标签，并以易于查询的方式组织。没有重复信息、孤岛或僵尸数据。所有应用程序都在其运行。


    遗憾的是，这种理想在今天是不切行的。公司运行在几十甚至数百个不同的应用程序上，每个应用程序都有自己的数据结构，存储着通常需要关联的信息，并以不同的格式存储，并通过不同的
    API 或语言访问。


    虽然理想的单一真相并不存在，但通过连接数据并在数据湖之上进行建模，我们得到了看起来像它的的数据！我们可以通过数据湖之上的视图进行迭代创建。随着我们对数据的建模，单一真相就显现出来。


    ![](img/07b10ae3f84ebfc0356cf70f4bf08c9e_108_0.png)


    的真相，经过仔细的清洗、合并和转换，消除了差异化源表中的不一致性（图 P.2）。单一真相是一组易于查询的表，编码了业务逻辑。而这正是公司称为数据仓库（或单一真相，简称
    SST）的内容。


    在单一真相中，数据已经过清洗和组织，对公司分析师和你的团队其他成员都更易访问。数据转换是永久的并以代码形式表示，因此对任何感兴趣的人都是可见的。其他优点外，你的数据团队将更快地培训新成员，更高效地工作，

    '
