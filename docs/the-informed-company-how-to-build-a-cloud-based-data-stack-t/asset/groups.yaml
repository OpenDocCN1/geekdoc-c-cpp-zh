    ## Chapter Eighteenth


    ## Modern versus Traditional Data Stacks: What’s Changed?


    What’s Changed?


    This book intentionally outlines how to create a modern stack in a straightforward
    way, but for those who’ve been in data for years, some of it may be controversial.
    Many of these strategies will be known to you, but few have been fully published.
    We want to broaden the conversation on data modeling and orient the collective
    goal of analytics toward helping others leverage data for insights.


    ## Modern versus Traditional Data Stacks: What''s Changed?


    Many things have changed in the data space that has allowed us to become less
    technologically constrained and more user-focused. The main driving forces of
    change in data are increasing volume, demand, and user base, coupled with the
    great decrease in cost.


    ## Storage and Compute Continues to Drop in Price Rapidly


    Costs have been plummeting for storing and computing data. The main things driving
    down these costs are breakthroughs in both architecture and hardware over the
    past few decades.


    ### Architecture


    - Cloud—things are cheap and easily accessed and scaled

    - C-Store—column-oriented databases

    - Massively Parallel Processing (MPP)

    - Separation of storage and compute


    ### Hardware


    - SSD

    - Vectorized processing (GPUs) and now CPUs

    - Continued lowering of storage and compute hardware costs


    These advances have made optimizing for storage and performance not as valuable
    anymore.


    ## Data Lakes Were Added to the Stack and ELT Replaced ETL


    Data lakes are a stable stopping point and much less prone to errors. Also if
    you have to redo things in the model, you don''t have to go back and extract and
    load again from those sources to get the original raw data. You''ve already got
    it. It can save big costs and time and enable flexibility.


    Also, this allows you to do the modeling in simple SQL, and makes it so job analysts
    (who are the end users of this data) can do quite well, rather than rely on data
    engineers.


    ## Data Is Increasingly Democratized


    Everyone wants data in order to support their decision making. This means shifting
    the end user of data from analysts to everybody. This demand has caused an explosion
    of problem-specific data tools, and for every SaaS tool you have to spin off data
    that could be used. These additional data sources are now part of the stack, and
    the ELT process to get them to the lake is critical to making organizations data
    driven.


    ## Chapter Nineteen


    ## Row- versus Column-Oriented Database


    We wanted to spend a bit of time talking about why columnar databases are more
    performant for analytics, since this will be at the center of your data stack.
    There are two ways to organize relational databases:


    - Row-oriented

    - Column-oriented (also known as columnar or C-store)


    Row-oriented databases are databases that organize data by record, keeping all
    of the data associated with a record next to each other in memory. Row-oriented
    databases are the traditional way of organizing data and still provide some key
    benefits for storing data quickly. They are optimized for reading and writing
    rows efficiently.


    ## Row- versus Column-Oriented Database


    Common row-oriented databases:


    - Postgres

    - MySQL


    Column-oriented databases are databases that organize data by field, keeping all
    of the data associated with a field next to each other in memory. Columnar databases
    have grown in popularity and provide performance advantages to querying data.
    They are optimized for reading and computing on columns efficiently.


    Common column-oriented databases:


    - Redshift

    - BigQuery

    - Snowflake


    ## Row-Oriented Databases


    Traditional database management systems were created to store data. They are optimized
    to read and write a single row of data, which leads to a series of design choices,
    including having a row store architecture.


    In a row store, or row-oriented database, the data is stored by row, such that
    the first column of a row will be next to the last column of the previous row.


    For instance, let’s take the Facebook_Friends data in Table 19.1.


    TABLE 19.1 Facebook_Friends


    | Name | City | Age |

    |---|---|---|

    | Matt | Los Angeles | 27 |

    | Dave | San Francisco | 30 |

    | Tim | Oakland | 33 |


    This data would be stored on a disk in a row-oriented database and ordered row
    by row as in Table 19.2.


    TABLE 19.2


    | Name | City | Age |

    |---|---|---|

    | Matt | Los Angeles | 27 |

    | Dave | San Francisco | 30 |

    | Tim | Oakland | 33 |


    This allows you to do the modeling in simple SQL, and makes it so job analysts
    (who are the end users of this data) can do quite well, rather than rely on data
    engineers.


    ## Writing to Row Databases


    If we want to add a new record (Table 19.3), we just append it to the end of the
    data.


    TABLE 19.3


    | Name | City | Age |

    |---|---|---|

    | Matt | Los Angeles | 27 |

    | Dave | San Francisco | 30 |

    | Tim | Oakland | 33 |


    TABLE 19.4


    | Name | City | Age |

    |---|---|---|

    | Matt | Los Angeles | 27 |

    | Dave | San Francisco | 30 |

    | Tim | Oakland | 33 |

    | Jen | Vancouver | 30 |


    TABLE 19.5


    | Name | City | Age |

    |---|---|---|

    | Matt | Los Angeles | 27 |

    | Dave | San Francisco | 30 |

    | Tim | Oakland | 33 |

    | Jen | Vancouver | 30 |


    Row-oriented databases are still used for Transaction Processing (OLTP). However,
    for Analytical Processing (OLAP), they are slower.


    ## Reading from Row Databases


    To get the sum of ages, the computer only needs to go to one disk (Disk 3) and
    sum all the values inside of it. No extra memory needs to be pulled in.


    TABLE 19.6


    | Name | City | Age |

    |---|---|---|

    | Matt | Los Angeles | 27 |

    | Dave | San Francisco | 30 |

    | Tim | Oakland | 33 |


    TABLE 19.7


    | Name | City | Age |

    |---|---|---|

    | Matt | Los Angeles | 27 |

    | Dave | San Francisco | 30 |

    | Tim | Oakland | 33 |


    TABLE 19.8


    | Name | City | Age |

    |---|---|---|

    | Matt | Los Angeles | 27 |

    | Dave | San Francisco | 30 |

    | Tim | Oakland | 33 |


    TABLE 19.9


    | Name | City | Age |

    |---|---|---|

    | Jen | Vancouver | 30 |


    TABLE 19.10


    | Name | City | Age |

    |---|---|---|

    | Matt | Los Angeles | 27 |

    | Dave | San Francisco | 30 |

    | Tim | Oakland | 33 |

    | Jen | Vancouver | 30 |


    While this is a slight oversimplification, it illustrates that organizing data
    by column the number of disks that will need to be visited will be reduced and
    the amount of extra data that has to be held in memory minimized.


    ## Coding the Data into More Compact Forms


    Let''s first examine an encoding technique that can be used by row- or column-oriented
    databases. Take, for example, a column of data with the individual states of the
    United States. We can use dictionary and bitmap encodings:


    - There are 50 states, so we could encode the whole database with 6 bits since
    this would provide 64 unique patterns.

    - To store the actual abbreviations would require 16 bits this would provide with
    256 unique patterns for each of the two ASCII characters.

    - Worst of all, if we stored the full name, the lengths would be variable, and
    the amount of bits needed would be a lot more.


    Now let''s take a look at Run-length encoding. This allows replacement of any
    sequence of the same value with a count and value indicator. For, we can replace
    aaaab with 4a1b. This becomes even more powerful when creating projections with
    columns that are sorted all values that are the same next to each other.


    ## Compressing the Data


    If each piece of data is the same number of bits long, then all of the data can
    be further compressed to be the number of pieces of data times that number of
    bits for a single piece of data.

