    # Handling Ongoing Requests and Ongoing Feedback


    ![](img/07b10ae3f84ebfc0356cf70f4bf08c9e_188_0.png)


    Figure 15.5


    Oftimes, people''s calculation of a metric will differ because of the following
    reasons: they are calculating it based on a different formula; the data source
    they use is different; the data is being filtered differently; or there is an
    error in their calculation.


    Track down what the correct answer is and modify the models to be clearer, so
    both parties and others will calculate the aggregate metric accurately.


    # Handling Ongoing Requests and Ongoing Feedback


    Now your newly modeled data will be queried by various analysts and employees.
    Inevitably the modeling demands will shift and evolve. Examples of feedback you
    may get on the models are requests to add new tables or columns, redefine business
    logic, fix broken tables by a change in the source system, or investigate incorrect
    numbers.


    For instance, with these new tables someone may want to use the external id from
    original table for an analysis. They will not be able to query it from the view.
    How should they let you know that they are constrained by the current data model?


    We recommend using a ticketing system like JIRA (Figure 15.6), GitHub issues,
    or Google Forms for your users to submit to the analytics engineering team to
    request changes or additions to the data models.'
