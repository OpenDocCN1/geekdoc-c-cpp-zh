- md: '

    ## Remove Irrelevant Data


    Rows that are irrelevant for various reasons should be removed entirely from the
    data set. Examples include:


    - Employee testing

    - Fraud or spam

    - Inactive


    The exception is when analyzing fraud or spam data (given the above examples),
    but in most cases, rows that are never present from a query can be removed during
    modeling.


    ## Standardize Data Types


    Modeling is a great time to change data types to more appropriate types. Unix
    timestamps could be converted from int columns to datetime, for example.


    ## Naming Conventions


    There are a variety of naming conventions used for tables, columns, and values.
    Creating a standard for schema resources improves the usability for others to
    find and understand the data they need.


    ## Plural Table Names


    Pluralization of table names creates an easy-to-identify distinction from columns
    and other schema resources when communicating. For example, change the title of
    a table of leads named “Lead” to “Leads.” When there are more than two words,
    only pluralize the last word: opportunity_histories.


    ## Singular Column Names


    A column name such as “emails” should be titled “email,” not “emails.” Singular
    names make it easy to distinguish between tables and columns.


    ## id as Primary Key


    A simple numeric primary key labeled “id” is the standard for all tables. The
    “id” convention uniquely identifies the primary keys and each row:


    ```

    foreign keys follow [tablename]_[id]

    ```


    Foreign keys should follow this format to make the relationships to other tables
    very clear. If there are foreign keys related to the same table, prepend a name
    to them following the format:


    ```

    [uniquename]_[tablename]_[id].

    ```


    An accounts table linking to a users table with both a billing contact and a main
    owner would look like this:


    ```

    owner_user_id

    Billing_contact_user_id

    ```


    ## Lowercase, Underscored Naming


    The data model needs to be easily editable with SQL, avoiding the shift key allows
    faster development of queries. Therefore, we should have column names like id,
    first_name, last_name, and last_login_type instead of more human-readable forms
    in the model. In addition, spaced names such as first name, last name, and last
    login type will break the SQL code. Use underscores for any spaces between words.


    ## Share It


    Publish a style guide and distribute among employees to make adoption of known
    terms much easier. Collect feedback and grow it as new scenarios emerge. Check
    out some other public examples of style guides for inspiration:


    - https://about.gitlab.com/handbook/business-ops/data-team/platform/sql-style-guide/#other-sql-style-guides

    - https://github.com/brooklyn-data/co/blob/master/sql_style-guide.md

    - https://github.com/fishtown-analytics/corp/blob/master/dbt_coding_conventions.md#sql-style-guide


    ## Chapter Twenty-One


    ## Building an SST Example


    To build a data warehouse you need to determine what tables and fields you will
    be including in it. Everyone''s data sources are different, so there is no one
    right way. We will share some iterations we went through several years to get
    from the lake to the warehouse stage and how we responded to feedback and challenges.


    ## First Attempt—Some Tables with Prefixes


    In the original design of our data warehouse, we envisioned the schema to include
    all the needed tables from our raw sources: Chartio database, Salesforce, Stripe,
    Zendesk, Jira, Intercom, and Hotspot.


    At this point there was no concept of a "staging schema" or "base models," so
    we would query the raw tables and do data cleanup and transformation on them to
    build the SST. Because the different sources could have tables with the same names,
    each table would be prefixed with the name of the original source. Prefixing the
    table names with their underlying source also helps the user know where the data
    is coming from and keeps the schema organized as well.


    Here is a sample of the tables in this schema:


    - Chartio Charts

    - Chartio Dashboards

    - Chartio Organizations

    - Chartio Users

    - Intercom Admins

    - Intercom Conversations

    - Intercom Users

    - Jira Issues

    - Salesforce Contacts

    - Salesforce Leads


    ## What Tables Did We Keep?


    In order to choose what tables to bring into the SST, we created a spreadsheet
    of the list of tables from each source and went through them by one by one making
    the call on whether or not to add it to the SST (Figure 21.1).


    Considering we were already familiar with most of the data ourselves, for some
    tables it was obvious that it was based on our prior usage and understanding of
    the data. For sources we were not as familiar with, we consulted the owners of
    the tools for information on what tables are needed. For example, our revenue
    ops manager was a huge resource in telling us what tables were needed from Hubspot
    and what the marketing team uses from Salesforce.


    For a select number of tables we were unsure of, we ran internal usage reports
    to see if there were any existing charts querying those tables (Figure 21.2).


    If there were no charts or only archived dashboards querying tables, it was safe
    to assume that they wouldn''t be needed.


