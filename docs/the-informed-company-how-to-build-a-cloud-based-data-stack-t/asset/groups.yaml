    The most important differences between warehouses are the qualitative differences
    caused by their design choices: Some warehouses emphasize tunability, others ease
    of use. If you''re evaluating data warehouses, you should demo multiple systems,
    and choose the one that strikes the right balance for you.


    > —George Fraser, CEO @ Fivetran


    If you''re the type of person who likes researching benchmarks, we recommend checking
    out Fivetran''s excellent article, Cloud Data Warehouse Benchmark: Redshift, Snowflake,
    Azure, Presto and BigQuery, by George Fraser and Eric O''Connor: https://fivetran.com/blog/warehouse-benchmark.


    # Chapter Six


    ## Extract and Load (EL) Data


    So far, we''ve been outlining the practical aspects of what often is called Extract,
    Load, Transform (ELT) by modern data teams. The three letters refer to different
    stages of managing data, that is, the different steps for getting data from messy
    sources into polished information. In this stage, we focus on the first two letters.
    The third letter is covered in subsequent stages of the book.


    For data to arrive in the data lake, data is (Extracted from its source, through
    SQL or an API, and (L)oad into the lake. This process is called extract—or "EL"
    for short. Data will likely need further transformations that can make the data
    easier to query. There are many tools to help support this, but first, let''s
    discuss an old debate: Should data be transformed before or after being loaded
    into a data lake?


    ## Extract and Load (EL) Data


    ### ETL versus ELT


    When in the extracting and loading process is it necessary to apply transformations
    to data? Well, there are two conventional paradigms for this (Figures 6.1 and
    6.2).


    In the past data storage was expensive and it made sense to only put the important
    data in the warehouse. So there were extensive transform steps between the extract
    and load steps to filter and clean that data. This system was more complex, prone
    to error, and was less versatile when data needs changed. For instance if the
    transformation on a column changed, you would need to go all the way back to the
    source and re-import and re-transform all of that data again.


    ![](img/07b10ae3f84ebfc0356cf70f4bf08c9e_83_0.png)


    Figure 6.1 Data can be transformed while being moved to a data warehouse.


    ### ETL versus ELT


    #### EXTRACT LOAD TRANSFORM


    ![](img/07b10ae3f84ebfc0356cf70f4bf08c9e_84_0.png)


    Figure 6.2 Data can first be loaded into a lake and transformed there. The transformed
    data is now the data warehouse.


    Now that storage is cheap we can do a bit simpler. We first load all of the data
    with little or no transformation into the common lake. And then we do our transforms
    quite simply on top of it with simple SQL views or the equivalent. Now if a transform
    breaks or changes you don''t have to go all the way back to the source and re-import
    the needed data. It''s all already in the lake, you simply need to edit the SQL
    file that''s doing the transform on top.


    We recommend ELT because:


    - 1. Extracting and loading the data to the data lake is the main priority at
    this stage.

    - 2. Data in a lake goes through substantial transformations during the next stage,
    so there is no need for complex logic before the data is loaded.

    - 3. We end up with a much simpler architecture, which means fewer problems and
    less maintenance.

    - 4. Data lineage becomes more natural to track, as complex transformations are
    not happening before loading the data into the lake.

    - 5. When your transformations or business logic need to change, there is no need
    to re-transport raw data from source systems of record into your data source.


    Light transformation of the data before loading the data into the lake might still
    be necessary:


    - * Column selection: Select the data that really matters. For example, not everything
    in Salesforce needs to be in the data lake.

    - * Privacy reasons: For example, filtering out columns that contain PII (personally
    identifiable information). Instead of filtering, consider hashing PII data so
    it can be safely used for analytics.


    These transformation cases can be included in the ELT paradigm and are offered
    by most commercially available ELT vendors.


    ## EL/ETL Vendors


    There are a number of great modern EL vendors (sometimes called ELT vendors) such
    as Fivetran (Figure 6.3), Stitch (Figure 6.3), Matillion, Talend, Funnel, and
    Panoply. There are also many other open source vendors in this space as well,
    like Meltano and Airbyte.


    EL providers build detailed extract scripts for the most popular APIs and offer
    a simple experience for extracting and loading data into data lakes. The process
    usually involves the setup of a pipeline where


    ![](img/07b10ae3f84ebfc0356cf70f4bf08c9e_85_0.png)


    Figure 6.3 both the destination and the data source are connected, then light
    data transformations are performed, for example, selecting what tables and fields
    to sync, hiding some values for privacy reasons.


    Data loading with vendors requires minimal engineering effort in most cases (Figure
    6.4).


    ![](img/07b10ae3f84ebfc0356cf70f4bf08c9e_86_0.png)


    Figure 6.4


    ## Extract Options


    Extraction is the phase of pulling data out from a source, through SQL or APIs.
    We can do a complete extraction of all data, or we can do incremental extraction
    only new or updated rows.


    ### Complete Extraction


    Complete extraction of data is the easiest way since no configuration is required,
    but it has three potentially disadvantages:


    - Historical data is lost. Imagine a row or field was deleted; an analyst looking
    at the source for first time has no knowledge.

    - Duplicate data ends up in the data lake. While data is relatively cheap to store,
    this can become problematic as data scales.

    - The complexity of the next steps increases. Sometimes taking all the data "as-is"
    means creating work later to make sense of it.


    ### Incremental Extraction


    The preferred alternative is to do incremental extractions. Incremental extractions
    are challenging due to the check for new or updated rows and account for changing
    schemas. However, it is typically preferred because less data is processed, requiring
    fewer updates to the data lake.


    The main downside of incremental extraction deletions in a data source, which
    are not easy to detect. This is because it would need to scan the entire database
    and have saved snapshots of the history. How does anyone know something is missing
    if there is no record of it? ELT providers do not guarantee consistency under
    deletions in most cases; in some cases, it’s possible or implemented by the source,
    for example, data is never deleted but flagged as “is_deleted” instead.


    A complete dump would guarantee always having a replica of the source state (Figure
    6.5). Keep in mind that in analytics this is not that useful, but keeping the
    deleted records might be required for other reasons such as compliance.


    ![](img/07b10ae3f84ebfc0356cf70f4bf08c9e_88_0.png)


    Figure 6.5


    ## Load Options


    However the data is extracted from its source, there are multiple ways to store
    it in a database. Push changes through to existing data in the data lake or store
    this new data separate from existing.


    ### Push Changes


    When using a database system as a data lake, the updates to the data can be loaded
    and pushed into the existing schema. This will end up having a close replica of
    the data from the source system to the data lake, and it optimizes storage.

