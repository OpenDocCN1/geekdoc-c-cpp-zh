  md: "# # Chapter 5: C++ Pointers\n\nVariables are regions in the computer's memory\
    \ that can be accessed by their identifier, as detailed in earlier chapters. Pointer\
    \ eliminates the need for the program to care about the physical address of the\
    \ data in memory. Instead, it refers to the variable by its identifier.\n\nA C++\
    \ application sees a computer's memory as a sequence of memory cells, each with\
    \ its own location and size. Data representations larger than one byte can be\
    \ stored in memory cells with neighboring addresses because these single-byte\
    \ memory cells are structured in this fashion.\n\nWhen any variable is called\
    \ or declared, it is given a specified memory location in which we need to keep\
    \ its memory address. C++ applications, in general, do not actively choose the\
    \ addresses of memory where their variables are kept.\n\nIn this chapter, we will\
    \ discuss, what pointers are, how pointers use memory, how variables are assigned\
    \ to pointers, and so on.\n\n# ## 5.1 What are Pointers?\n\nA pointer is a variable\
    \ whose value is another variable's address. A pointer, like any other variable\
    \ or constant, must be declared before it can be used. A pointer variable declaration\
    \ takes the following general form: `Type *var-name;` Here, type denotes the pointer's\
    \ base type, which must be a valid C++ type, and var-name denotes the pointer\
    \ variable's name. The asterisk you use to declare a pointer is also the asterisk\
    \ you use to multiply. On the other hand, the asterisk is used to indicate a variable\
    \ as a pointer in this sentence.\n\nC++ pointers are simple and enjoyable to learn.\
    \ Some C++ activities are easier to complete with pointers, while others, such\
    \ as dynamic memory allocation, are impossible to complete without them.\n\nAs\
    \ you may be aware, each variable is a memory location, and each memory location\
    \ has an address that can be accessed using the ampersand (&) operator, which\
    \ denotes a memory address.\n\n+   - Null Pointers- C++ provides null pointers,\
    \ which are zero-valued constants defined in a number of standard libraries.\n\
    +   - Pointer Arithmetic- Pointers can be utilized with four different arithmetic\
    \ operators: +, --, +, -+-, --, +, -+-, -, +, -++\n+   - Pointers vs. Arrays-\
    \ Pointers and arrays have a close relationship.\n+   - An array of Pointers-\
    \ Arrays can carry a large number of pointers.\n+   - Pointer to Pointer- You\
    \ can have a pointer on a pointer in C++, and so on.\n+   - Passing Pointers to\
    \ Functions- Passing an argument to a function by reference or by address allows\
    \ the called function to change the provided argument in the calling function.\n\
    +   - Return Pointer from Functions- A function in C++ can also return a pointer\
    \ to a local variable, a static variable, or dynamically allocated memory.\n\n\
    # ## 5.2 Declaring Pointers in C++\n\n# ### Pointers Declaration\n\nWhen a pointer\
    \ points to a char, it has distinct properties than when it points to an int or\
    \ a float since a pointer can directly refer to the value it points to. The type\
    \ must be known after it has been dereferenced. To do so, a pointer's declaration\
    \ must indicate the data type to which the pointer will point. The following syntax\
