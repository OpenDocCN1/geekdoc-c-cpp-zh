  md: '# **Derived Data Types**


    Derived data types are the data types that are derived from some built-in types
    of data. Arrays, junctions, references, and pointers are some of the derived data
    types supplied by C++.


    **Examples:**


    **Array type:** An array is basically a collection of elements of only the same
    type of data with the same names. Each element in the given array is accessible
    by a subscript value or unique index and is stored in contiguous (one after another)
    memory regions. The subscript value indicates the place of the element in the
    data type array.


    **Function type:** A function basically is a self-contained program section that
    performs a single, well-explained task. Every program in C++ comprises of one
    or sometimes more functions that can be called from other portions of the program
    if necessary.


    **Reference:** A variable''s alternative name is referred to as a reference. In
    other terms, a reference is basically an alias for only a variable inside a program.
    A variable and its reference could be used alternately inside a program since
    they both refer to the same memory address. As a result, any modifications to
    one will have an impact on the other.


    **Pointer:** A pointer is simply a variable that can be used to keep track of
    another variable''s memory address. Pointers make it possible to utilize memory
    in a dynamic way. It is possible to allocate or de-allocate memory to variables
    at runtime with the use of pointers, which makes a program easier and efficient.


    # **Data Types User Defined**


    Unions, structures, enumerations, and classes are some of the user-defined data
    types supported by C++.


    **Union, Structure, and Class:** The most important features of the C programming
    language are union and structure. Union and structure allow you to arrange data
    types that are similar or distinct under a single identifier. However, in order
    to facilitate object-oriented programming, C++ had already extended the idea of
    union and structure by integrating certain new features and commands in the previous
    data types.


    The class data type in C++ is a unique and newly introduced user-defined type
    of data that is the foundation of OOP. A class serves as a template for defining
    the data, information, and functions that go into a class''s object. The keyword
    class is used to declare classes. The object of a class can be simply produced
    once it would be declared.


    **Enumeration type data:** The enumeration data type is a collection of integer
    constants already named, defining all the possible values for enumeration variables.
    Enumerators are a collection of permitted values.


    # **2.3 Operators in C++**


    With the help of examples, we will learn about the different kinds of operators
    in C++ in this tutorial. An operator in programming is a symbol that performs
    operations on a value or variable.


    Symbols that execute operations on values and variables are known as operators.
    For instance, the addition operator + is used for adding the numbers or for addition,
    and the subtraction operator - is used for subtraction.


    In C++, there are six different types of operators:


    +   - Arithmetic Operators

    +   - Assignment Operators

    +   - Relational Operators

    +   - Logical Operators

    +   - Bitwise Operators

