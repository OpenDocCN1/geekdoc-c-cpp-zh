  md: 'This is a terrible approach to try to store ten separate variables in the realm
    of programming. This is due to two key factors:


    The enormous amount of text that will be required in your program. Sure, we only
    have ten classes right now, so it is not horrible, but what if we had 1,000? Consider
    how many times you would have to type it! Put it out of your mind!


    Manual code adjustments would be required to add another course. Variable course11
    would have been created. This is completely insane!


    So, what is the RIGHT WAY to do things?


    # **Data structures are used to store them.**


    Using a data structure, you may avoid having to construct thousands of variables.
    C++ has a large number of built-in data structures. Arrays, which will be introduced
    later, are the most commonly utilized data structure.


    # 4. Syntax in C++


    Syntax is a set of rules for how words, expressions, and symbols are organized.
    This is due to the fact that an email address has a well-defined syntax. You will
    need a mixture of letters and numbers, possibly with underscores (_) or periods
    (.) in between, and at the rate (@) sign, and a website domain (company.com).


    As a result, the grammar of a programming language is very similar. They are a
    set of well-defined rules that allow you to develop a working piece of software.


    You will get errors if you do not follow the rules of a programming language or
    grammar.


    # 5. Tools for C++


    A tool (typically a tangible device) helps you do a task quickly in the real world.
    This holds true in the programming world as well. A programming tool is a piece
    of software that, when combined with code, allows you to program more quickly.


    Across all programming languages, there are probably tens of thousands, if not
    millions, of different tools. Many people believe that an IDE, or Integrated Development
    Environment, is the most important tool. An IDE is a piece of software that makes
    coding much easier. IDEs keep your files and folders organized and present them
    in a neat and tidy manner.


    # 1.3 What is Code Editor and Its Installation?


    # **What exactly is IDE?**


    The IDE, or Integrated Development Environment, is a digital environment used
    to build games, software, and hardware that integrates everything from debugging
    to compiling. Some C++ IDEs only support a single language, such as IDLE, which
    only supports Python. On the other hand, Apple''s XCode supports a variety of
    languages, including C, C++, Java, and others.


    This chapter will offer you clear and basic explanations of each C++ IDE so you
    can pick the one that is right for you. You may also try out a few other IDEs
    on your PC to discover which one works best for you.


    # Dev-C++


    # **Features of this IDE:**


    +   - GCC-based compilers, such as Cygwin, MinGW, and others, are supported by
    Dev-C++. If we already have a compiler on our PC, we may either install a Dev-C++
    IDE with the compiler integrated or just an IDE.

    +   - With this IDE, we may use integrated debugging (using GDB). We can use the
    debugger to conduct all of the standard debugging actions on the source code.

    +   - It contains a localization capability that allows it to work in a variety
    of languages. When we initially start the IDE once it has been installed, we can
    choose the language. We can also change the language using the settings at any
    moment.

    +   - This IDE, like the others, includes an “Auto-Completion” feature for the
    code we write.

    +   - It has a syntax highlighting editor that may be customized to make source
    code more understandable.

    +   - It is possible to edit and compile resource files with this tool.

    +   - There is a Tool Manager in the project that provides several tools that
    can be used.

    +   - This IDE also includes Find and Replace functionality.

    +   - We may construct various programs using the Dev-C++ IDE, including Windows,
    Console, Static libraries, and DLLs.

    +   - To establish our project kinds, we can also construct our project templates.'
