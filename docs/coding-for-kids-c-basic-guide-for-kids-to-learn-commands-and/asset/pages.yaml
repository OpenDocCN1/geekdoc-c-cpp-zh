- pgno: 14
  md: '# # Chapter 2: Variables, Data Type, and Operator in C++


    Data types, variables, and operators are the very basic concepts of C++. Some
    operators are considered as the basic building blocks of this high-level computer
    programming language. Usually, we use them to program our projects and to obtain
    the required results through their usage. Data types are the essential concept
    among these three concepts, and no one can understand C++ programming without
    having command over these three basic concepts. Now, we will discuss some required
    variables, operators, and data types of C++ programming.


    # ## 2.1 Variables of C++


    In C++, variables serve as memory locations. They are just the name of the container
    or element containing the data or values needed later in the program for execution.
    It can be specified using a combination of characters and digits, or special symbols
    such as underscore (_), and data types such as char, int, float, and double. The
    first letter of the variables must begin with the letter alone except the reserved
    keyword.


    In any programming language, variables are the most crucial component. Without
    a variable, any programming language is incomplete. We can also assert that the
    program cannot execute without variables. Variables are required for the C++ language
    to run, just as they are for any other programming language. Variables are used
    to store the value or string, not to run the program. The application will not
    run if no value is stored. As a result, variables are recognized as the programming
    language''s backbone.


    # ### Variable Definition Rules and Regulations in the C++ Language


    +   - Variables can be a combination of numerals, special characters such as and
    (&), underscore (_), or strings.

    +   - Because C++ is a case-sensitive language, upper and lower cases are handled
    as separate variables. The variables educba and eduCBA will be addressed separately.

    +   - Variables in C++ must begin with a character. The number will not be counted
    as the first character. 6educba is not an acceptable variable because it begins
    with a number, whereas educba6 starts with a character.

    +   - Variables should not be used as a keyword in C++. The keywords used for
    this purpose include for, this, if, otherwise, while, do, char, this, and so on.
    In C++, some keywords cannot be used as variables.

    +   - Variables must not contain any blank spaces. Edu cba is invalid because
    there is a space between edu and cba. However, edu_cba or educba are both legitimate
    variables because the underscore sign is used to unite them.


    # ### In C++, how do you declare variables?


    Before beginning the programs, variables might be declared. The following is the
    syntax for declaring a variable.


    variable name data type; where


    **Datatype:** It describes types of data that can be used to store value. Integers,
    chars, floats, doubles, short ints, and other data kinds are all possible.


    **Variable name:** Defines the variable names. Except for the keyword, it could
    be anything.


    **1. int taxi, for example; 2. float 2.6, 8.3**


    For instance, int is a data type, while the cab is the name of a variable. We
    have specified two variables in the second example, where the float is a data
    type, and 2.6 and 8.3 are variables. The compiler has allocated storage for the
    variables once they have been declared, as it will be utilized for the program.


    Illustration through Program'
  merge: -1
  img_proc: true
