  md: '# # Chapter 1: Getting Started with C++


    Java, C++, Python, and C are the most often used languages. Instead of thinking
    about the problem in terms of business logic, these languages encourage the programmer
    to think about it in terms of computer programming and implementations. Despite
    the fact that it is old, C++ is still widely used today, which is a remarkable
    achievement in and of itself. C++ is still widely used, and the most well-known
    software is built on it.


    This chapter talks about the fundamentals, advanced ideas, applications, and concepts
    of C++. It also discusses C++''s background and tools that are used to do C++.
    Then, you will learn to make your first program.


    # ## 1.1 What is C++?


    C++ is basically an OOP Language. OOP means object-oriented programming language
    developed by renowned computer scientist Bjorne Stroustrup as part of a C language
    family''s growth. "See-plus-plus" is how C++ is pronounced. It is created in the
    form of a cross-platform enhancement to C that would provide developers more control
    on memory and system resources.


    C++ is known as "C including Classes" because C++ adds OOPs techniques to the
    C basic programming language foundation, including the use of specified classes.
    C++ has shown to be a valuable language not just for computer programming but
    also for training novice programmers on how to use OOP.


    However, it supports not only OOP but also functional and procedural programming.

    C++ is popular today because of its remarkable portability and easiness, which
    allows programmers to simply design applications that operate on a variety of
    operating systems and platforms. Although it is a high-level language, C++ may
    be used to manipulate low-level data because of its strong relationship with many
    machine languages.


    # ### Short Background


    Bjarne Stroustrup created C++ at the start of the 1980s at Bell Labs to combine
    the finest features of numerous existing languages. He sought to combine the speed
    of exciting BCPL, commonly a high level of Simula, and also the universality and
    combination of Dennis Ritchie''s C in a single package. He drew on other languages
    like ML, Ada, and also ALGOL 68 to construct a general-purpose and well-structured
    language that can compile practically all programs of C without modifying their
    actual source code.


    # ## 1.2 Five Basic Concepts of C++


    # ### 1. Variables in C++


    Variables are the fundamental building blocks of any programming language. A variable
    is nothing more than means to save data for later use. This value or data can
    be retrieved by referring to a "word" that describes the information. They can
    be used numerous times within the scope in which they were declared and defined
    once they have been declared and defined.


    # ### 2. Control Structures in C++


    The compiler reads the code line by line when a program executes (from top to
    bottom, and for the most part, left to right). This is known as "code flow." When
    reading the code from beginning to end, it may come to a point when it must make
    a decision. The software may jump to a different area of the code depending on
    the decision. It may even cause the compiler to re-run a certain section or simply
    skip a section of code.


    Consider this approach as if you were selecting from a variety of Guru99 courses.
    You make a decision, then click a link to skip a few pages. Similarly, a computer
    program has a set of strict rules that determine how the program is executed.


    # ### 3. Data Structures in C++


    Let''s take a look at a list of courses (on any site) as an example! You most
    likely have a course schedule in front of you. But, what do you think they did
    with it? There may be a large number of courses, and different people sign up
    for different ones. Is each user''s variable generated differently? Let''s imagine
    we need to keep track of ten different courses.


    # **Then There is the WRONG WAY:**


    We would define ten variables if we needed to hold ten courses. Right?

    **Wrong!!!**'
