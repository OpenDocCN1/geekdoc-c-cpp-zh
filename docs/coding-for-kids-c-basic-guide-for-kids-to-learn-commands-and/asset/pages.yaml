  md: 'The term "class" refers to a group of items. It is a logical thing.


    # **Inheritance**


    Inheritance occurs when one object inherits all of the characteristics and behaviors
    of its parent object. It allows for code reuse. It is utilized to achieve polymorphism
    at runtime.


    # **Polymorphism**


    Polymorphism occurs when a task is accomplished in multiple ways. For instance,
    to persuade the buyer in a different way, draw something, such as a form of a
    rectangle. To implement polymorphism in C++, we employ Function overloading and
    Function overriding.


    # **Abstraction**


    Abstraction is the process of concealing internal features while displaying functionality.
    For example, we do not know how a phone call is processed within.


    To achieve abstraction in C++, we employ abstract classes and interfaces.


    # **Encapsulation**


    Encapsulation is the process of combining (or encapsulating) code and data into
    a single entity. For instance, a capsule is wrapped in many drugs.


    **OOPs, have an advantage over procedural programming languages.**


    +   - OOPs, simplify development and maintenance, whereas Procedure-oriented programming
    languages are difficult to handle as projects expand in size.

    +   - Data concealing is provided by OOPs, whereas global data can be accessed
    from anywhere in a Procedure-oriented programming language.

    +   - OOPs significantly improve the ability to imitate real-world events. If
    we use the Object-Oriented Programming language, we may propose a solution to
    a real-world problem.'
