    \ members are the variables length, breadth, and height defined within the class.\
    \ Also recognized as member functions of a class are the functions calculateArea()\
    \ and calculateVolume().\n\n# 8.2 C++ Object\n\nA Class's instance is an Object.\
    \ When a class is defined, no memory is allocated; nevertheless, memory is allocated\
    \ when instantiated (when an object is formed).\n\nThe term \"class\" refers to\
    \ a blueprint or a template. When we define a class, no storage is assigned. Objects\
