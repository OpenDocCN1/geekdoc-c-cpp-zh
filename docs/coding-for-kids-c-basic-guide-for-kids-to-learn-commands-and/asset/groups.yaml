    \ utilize them in C++ with the help of examples.\n\nWe studied functions and variables\
    \ in an earlier chapter. It is sometimes preferable to group together relevant\
    \ functions and data to be more logical and easier to work with.\n\nAssume we\
    \ need to compute the area and volume of a rectangular room based on its length,\
    \ breadth, and height.\n\nWe can use three variables, such as length, width, and\
    \ height, as well as the functions calculateArea() and calculateVolume() to complete\
    \ this work.\n\nInstead of defining distinct variables and functions in C++, we\
    \ can wrap these related data and functions in a single location (by creating\
    \ objects). Object-oriented programming is the name for this programming paradigm.\n\
    \nHowever, before we can build and use objects in C++, we must first understand\
    \ classes.\n\n### 8.1 C++ Class\n\nIn C++, a class is the fundamental building\
    \ block of Object-Oriented programming. It is a user-defined data type with its\
    \ own set of data members and member functions that can be accessed and used by\
    \ establishing a class instance. A C++ class is similar to an object's blueprint.\n\
    \nConsider the following scenario: Consider the Automobile Class. There may be\
    \ many automobiles with different names and brands, but they will all have some\
    \ essential characteristics, such as four wheels, a speed limit, and mileage range.\
    \ Car is the class here, and wheels, speed limitations, and mileage are the attributes.\n\
    \n- A Class is a data type that has data members and member functions that the\
    \ user defines.\n- Data members are data variables, and member functions are the\
    \ functions that control these variables; these data members and member functions\
    \ together define the properties and behavior of the objects in a Class.\n- The\
    \ data members in the previous example of class Car will be speed limit, mileage,\
    \ and member functions will apply brakes, increase speed, and so on.\n- The sole\
    \ difference between a class and a structure in C++ is that a class defaults to\
    \ private access control, whereas a structure defaults to public.\n- All of OOP's\
    \ features revolve around C++ classes. Inheritance, encapsulation, abstraction,\
    \ and other concepts are discussed.\n- Separate copies of data members are stored\
    \ in class objects. We can make as many class objects as we need.\n- Classes have\
    \ additional qualities, such as the ability to build abstract and immutable classes,\
    \ which we shall cover later.\n\n**For example**, all birds in the class of birds\
    \ can fly and have wings and beaks. So, in this case, flying is a habit, and wings\
    \ and beaks are features. Moreover, while there are many distinct birds in this\
    \ class, all of them share the same behavior and traits.\n\nSimilarly, a class\
    \ is nothing more than a blueprint that declares and defines traits and behavior,\
    \ such as data members and member functions. These characteristics and behaviors\
    \ will be shared by all objects in this class.\n\n### Creating a Class\n\nIn C++,\
    \ a class is defined by using the keyword class and then the name of the class.\n\
    \nThe curly brackets define the class's body, which is followed by a semicolon\
    \ at the end.\n\n![](img/c8a355113822506f7dfe07d4f0cde0a2_45_0.png)\n\n```cpp\n\
    class Room {\npublic:\n    double length;\n    double breadth;\n    double height;\n\
    \n    double calculateArea(){\n        return length * breadth;\n    }\n\n   \
    \ double calculateVolume(){\n        return length * breadth * height;\n    }\n\
    };\n```\n\nWe created a class called Room in this section.\nData members are the\
    \ variables length, breadth, and height defined within the class. Also recognized\
    \ as member functions of a class are the functions calculateArea() and calculateVolume().\n\
    \n### 8.2 C++ Object\n\nA Class's instance is an Object. When a class is defined,\
    \ no memory is allocated; nevertheless, memory is allocated when instantiated\
    \ (when an object is formed).\n\nThe term \"class\" refers to a blueprint or a\
    \ template. When we define a class, no storage is assigned. Objects are instances\
    \ of a class, which contain the data variables stated in the class, and on which\
    \ the member functions operate. There are multiple data variables for each object.\
    \ Constructors are special class functions that are used to initialize objects.\
    \ Constructors will be discussed later.\n\nWhen the object is no longer in scope,\
    \ another particular class member function called Destructor is invoked to free\
    \ the memory that the object has reserved. Unlike JAVA, C++ does not have an automatic\
    \ garbage collector; instead, the Destructor fulfils this function.\n\nWhen a\
    \ class is defined, it just defines the object's specifications; no memory or\
    \ storage is allocated.\n\nWe need to build objects in order to use the data and\
    \ access functionalities defined in the class.\n\nThe term \"class\" refers to\
    \ a group of items. It is a logical thing.\n\n### Inheritance\n\nInheritance occurs\
    \ when one object inherits all of the characteristics and behaviors of its parent\
    \ object. It allows for code reuse. It is utilized to achieve polymorphism at\
    \ runtime.\n\n### Polymorphism\n\nPolymorphism occurs when a task is accomplished\
    \ in multiple ways. For instance, to persuade the buyer in a different way, draw\
    \ something, such as a form of a rectangle. To implement polymorphism in C++,\
    \ we employ Function overloading and Function overriding.\n\n### Abstraction\n\
    \nAbstraction is the process of concealing internal features while displaying\
    \ functionality. For example, we do not know how a phone call is processed within.\n\
    \nTo achieve abstraction in C++, we employ abstract classes and interfaces.\n\n\
    ### Encapsulation\n\nEncapsulation is the process of combining (or encapsulating)\
    \ code and data into a single entity. For instance, a capsule is wrapped in many\
    \ drugs.\n\n**OOPs have an advantage over procedural programming languages.**\n\
    \n- OOPs simplify development and maintenance, whereas Procedure-oriented programming\
    \ languages are difficult to handle as projects expand in size.\n- Data concealing\
    \ is provided by OOPs, whereas global data can be accessed from anywhere in a\
    \ Procedure-oriented programming language.\n- OOPs significantly improve the ability\
    \ to imitate real-world events. If we use the Object-Oriented Programming language,\
    \ we may propose a solution to a real-world problem.\n"
  mdcn: "\n## 7.4 变量的作用域\n\n任何事物的作用域都可以描述为其可被使用的范围。在编程中，变量的作用域也定义为变量可被访问、声明或与之交互的程序代码范围。变量作用域分为两类：\n\
    \n- 全局变量\n- 局部变量\n\n作用域是程序的一部分，通常可以在三个区域声明变量。\n\n- 局部变量是存在于函数或代码块中的变量。\n- 形式参数用于函数参数的定义。\n\
    - 全局变量是存在于所有函数之外的变量。\n\n### 局部变量\n\n局部变量是在函数或代码块中声明的变量。它们只能由该函数或代码块中包含的语句使用。其自身之外的函数无法感知局部变量。以下是使用局部变量的示例。\n\
    \n```cpp\n#include <iostream>\nusing namespace std;\n\nint main () {\n    // Local\
    \ variable declaration:\n    int a, b;\n    int c;\n\n    // actual initialization\n\
    \    a = 10;\n    b = 20;\n    c = a + b;\n\n    cout << c;\n\n    return 0;\n\
    }\n```\n\n### 全局变量\n\n全局变量在程序开头、所有函数之外定义。全局变量的值在程序整个生命周期内保持不变。\n\n任何函数都可以访问全局变量。也就是说，一旦声明了全局变量，就可以在整个程序中使用它。以下是使用全局变量和局部变量的示例。\n\
    \n```cpp\n#include <iostream>\nusing namespace std;\n\n// Global variable declaration:\n\
    int g;\n\nint main () {\n    // Local variable declaration:\n    int a, b;\n\n\
    \    // actual initialization\n    a = 10;\n    b = 20;\n    g = a + b;\n\n  \
    \  cout << g;\n\n    return 0;\n}\n```\n\n使用这些程序进行练习，因为熟能生巧。\n\n## 第8章：C++中的类和对象\n\
    \n本章将通过示例学习对象和类，以及如何在C++中使用它们。\n\n前面的章节学习了函数和变量。有时将相关函数和数据组合在一起更合乎逻辑，也更容易使用。\n\
    \n假设需要根据长、宽、高计算一个长方形房间的面积和体积。\n\n可以使用三个变量（如 length、width、height）以及函数 calculateArea()\
    \ 和 calculateVolume() 来完成这项工作。\n\n在C++中，与其定义彼此独立的变量和函数，不如将这些相关数据和函数封装到一个位置（通过创建对象）。这种编程范式称为面向对象编程。\n\
    \n然而，在C++中构建和使用对象之前，必须先理解类。\n\n### 8.1 C++ 类\n\n在C++中，类是面向对象编程的基本构建块。它是一种用户定义的数据类型，具有自己的一组数据成员和成员函数，可通过创建类实例来访问和使用。C++类类似于对象的蓝图。\n\
    \n考虑以下场景：考虑汽车类。可能有许多名称和品牌不同的汽车，但它们都有一些基本特征，例如四个车轮、速度限制和里程范围。这里的 Car 是类，而车轮、速度限制和里程是属性。\n\
    \n- 类是用户定义的数据类型，包含数据成员和成员函数。\n- 数据成员是数据变量，成员函数是控制这些变量的函数；这些数据成员和成员函数共同定义类中对象的属性和行为。\n\
    - 前面 Car 类示例中的数据成员将是速度限制、里程，成员函数将是刹车、加速等。\n- C++中类与结构的唯一区别在于，类默认采用私有访问控制，而结构默认采用公有访问控制。\n\
    - 面向对象编程的所有特性都围绕C++类展开。这里讨论继承、封装、抽象等概念。\n- 类对象中存储数据成员的独立副本。我们可以按需创建任意数量的类对象。\n\
    - 类还具有其他特性，例如能够构建抽象类和不可变类，我们将在后面介绍。\n\n**例如**，鸟类中的所有鸟都会飞，并且有翅膀和喙。因此，在这个例子中，飞行是一种习性，翅膀和喙是特征。此外，尽管这个类中有许多不同的鸟，但它们都共享相同的行为和特征。\n\
    \n同样，类不过是一个声明并定义特征和行为的蓝图，例如数据成员和成员函数。这个类中的所有对象都将共享这些特征和行为。\n\n### 创建类\n\n在C++中，类通过关键字\
    \ class 后跟类名来定义。\n\n花括号定义类的主体，末尾跟一个分号。\n\n![](img/c8a355113822506f7dfe07d4f0cde0a2_45_0.png)\n\
    \n```cpp\nclass Room {\npublic:\n    double length;\n    double breadth;\n   \
    \ double height;\n\n    double calculateArea(){\n        return length * breadth;\n\
    \    }\n\n    double calculateVolume(){\n        return length * breadth * height;\n\
    \    }\n};\n```\n\n本节创建了一个名为 Room 的类。\n数据成员是类中定义的变量 length、breadth 和 height。函数\
    \ calculateArea() 和 calculateVolume() 也被视为类的成员函数。\n\n### 8.2 C++ 对象\n\n类的实例是对象。定义类时不会分配内存；然而，实例化时（创建对象时）会分配内存。\n\
    \n“类”一词指的是蓝图或模板。定义类时，不会分配存储空间。对象是类的实例，包含类中声明的数据变量，成员函数作用于这些变量。每个对象都有多个数据变量。构造函数是用于初始化对象的特殊类函数。构造函数将在后面讨论。\n\
    \n当对象不再处于作用域内时，会调用另一个名为析构函数的特殊类成员函数，以释放对象保留的内存。与 JAVA 不同，C++没有自动垃圾回收器；析构函数承担此功能。\n\
    \n定义类时，它只定义对象的规格；不会分配内存或存储空间。\n\n我们需要创建对象，才能使用类中定义的数据并访问其功能。\n\n“类”一词指一组项目。它是一个逻辑实体。\n\
    \n### 继承\n\n当一个对象继承其父对象的所有特征和行为时，就发生了继承。它允许代码重用。它用于在运行时实现多态。\n\n### 多态\n\n当一个任务可以通过多种方式完成时，就发生了多态。例如，为了以不同方式说服买家，绘制某种东西，例如一个矩形形状。为了在C++中实现多态，我们采用函数重载和函数重写。\n\
    \n### 抽象\n\n抽象是隐藏内部特征而展示功能的过程。例如，我们不知道电话通话在内部是如何处理的。\n\n为了在C++中实现抽象，我们采用抽象类和接口。\n\
    \n### 封装\n\n封装是将代码和数据组合（或封装）为一个单一实体的过程。例如，胶囊中包裹着多种药物。\n\n**面向对象编程比过程式编程语言具有优势。**\n\
    \n- 面向对象编程简化了开发和维护，而面向过程编程语言在项目规模扩大时难以处理。\n- 面向对象编程提供数据隐藏，而在面向过程编程语言中，全局数据可以从任何地方访问。\n\
    - 面向对象编程显著提高了模拟现实世界事件的能力。如果使用面向对象编程语言，我们就可以为现实世界问题提出解决方案。\n"
