    \ 中的类和对象\n  - 8.1 C++ 类\n  - 8.2 C++ 对象\n  - 8.3 C++ 面向对象编程的概念\n- 结论\n\n## 引言\n\
    \n既然任何人都能学习编程，为什么要把孩子落下呢？曾经，编程只局限于计算机工程师，他们默默坐着，不停敲出一行行无尽的代码。然而，得益于技术进步，孩子们如今也能触手可及地享受编程。“手机游戏”“智能手机”“平板电脑”和“电脑游戏”这些词不再是行话。孩子们正在将高科技设备用于教育和娱乐目的。他们掌握这些设备的速度和效率远高于成年人，因为只要利用得当，年轻头脑具有非凡的探索和专注潜力。\n\
    \n编程是当今世界最有价值的能力之一。由于大多数应用和网站都建立在编程的基础之上，编程已成为近年来最需要掌握的关键技能之一。C++ 是最重要的编程语言之一，但许多学生不确定是否应该从它开始学起。\n\
    \nC++ 对孩子来说可能具有挑战性，因为它看起来包含大量数学内容，会让他们对学习编程望而却步。然而，一旦学生掌握了 C++ 的基础，就不会再回头了。你可能会惊讶地发现，大多数伟大的程序员都是从\
    \ C++ 开始他们的职业生涯的。\n\nC++ 以学习曲线陡峭著称，但如果你鼓励孩子学习它，这将对他们的编程生涯大有裨益。C++ 将帮助你的孩子培养解决现实问题的能力，同时为编程概念打下坚实基础。C++\
    \ 还可以帮助养成扎实的编程习惯，从而形成清晰一致的代码编写风格。\n\n在本书中，我们将介绍一些适合青少年的 C++ 基础主题。我们还将讨论教青少年学习\
    \ C++ 的优缺点。\n\n### 为什么选择 C++？\n\nC++ 是一种区分大小写的通用计算机语言。它支持过程式、泛型和面向对象编程。由于兼具低级语言和高级语言的特征，它被归类为中级语言。\n\
    \n让我们看看 C++ 的用途，以便理解这门语言的重要性。\n\n### C++ 的用途是什么？\n\nC++ 是一种面向性能的编程语言，可应对广泛的程序和挑战。它专注于大规模系统编程。它有助于开发\
    \ 3D 动画、Firefox 和 Chrome 等网络浏览器，以及医疗软件、办公软件等其他应用。它还应用于暴雪游戏、MRI 扫描仪和 PDF 技术等领域。\n\
    \n使用 C++ 编程，我们可以创建各种安全且稳健的应用，例如 Windows 应用、设备驱动程序、嵌入式固件、客户端-服务器应用等。它通过过程式编程对 CPU\
    \ 的各种功能进行编程。C++ 还广泛用于电子游戏开发。不仅如此，Chrome、Mozilla 和 Firefox 等搜索引擎也使用 C++。由于其应用范围极其广泛，它是一门非常重要的编程语言。\n\
