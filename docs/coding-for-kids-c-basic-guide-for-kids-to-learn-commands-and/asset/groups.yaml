    \ this prints whether x is positive, negative, or zero. Again, by combining the\
    \ statements into blocks encased in braces, it would have been possible to execute\
    \ more than one statement per case.\n\n#### Switch Statement\n\nThe switch statement's\
    \ syntax is a little strange. Its goal is to find a value among a set of potential\
