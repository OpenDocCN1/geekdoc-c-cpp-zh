    \nmain() 函数是每个 C++ 应用程序中都有的函数之一。你的代码可以划分为不同的函数。通过这种划分，每个函数都应执行特定任务。\n\nC++ 标准库包含大量内置函数。这些函数可以在你的程序中调用。\n\
    \n**定义函数意味着什么？**\n\n函数是一组协同工作以完成特定目标的语句。它可以是执行常规操作的语句，也可以是执行诸如打印之类的专门任务的语句。\n\n\
    函数可用于通过将代码拆分成称为函数的更小组成部分来简化代码。使用函数的另一个优点是可以避免我们一遍又一遍地编写相同的代码。我们只需编写一个函数，然后在需要时调用它，而不必一遍又一遍地编写同一组代码行。\n\
    \n**调用函数**\n\n当我们的软件中有一个函数时，我们需要根据需要调用它。只有在被调用时，函数才会执行其语句集以给出所需结果。\n\n可以从程序中的任何位置调用函数。如果软件使用多个函数，则可以从主函数或任何其他函数中调用它。“调用函数”是指调用另一个函数的函数。\n\
    \n在上面的交换整数示例中，swap 函数由主函数调用。因此，主函数现在就是调用函数。\n\n### 7.2 C++ 中的函数类型\n\n如下所示，C++\
    \ 中的函数有两种类型。\n\n**内置函数**\n\n库函数是内置函数的另一个名称。这些是 C++ 提供的函数，因此我们不必编写它们。这些例程可以直接在我们的代码中使用。\n\
