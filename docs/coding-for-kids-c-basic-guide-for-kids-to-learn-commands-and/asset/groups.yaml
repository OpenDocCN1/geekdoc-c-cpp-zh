    \ producing a block:\n\n```cpp\nif (x == 200)\n{\ncout<< \"x is \";\ncout<< x;\n\
    }\n```\n\nBy utilizing the else keyword to offer an alternative statement, selection\
    \ statements with if can also define what happens if the condition is not met.\
    \ Its syntax is as follows:\n\n`if (condition) statement1 else statement2`\n\n\
