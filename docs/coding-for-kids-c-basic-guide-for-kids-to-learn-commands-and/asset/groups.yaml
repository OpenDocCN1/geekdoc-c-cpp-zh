    \nC++ 用户也可以定义自己的函数。这些是用户定义的函数。函数可以在程序中的任何位置定义，然后从代码中的任何位置调用。与变量一样，函数必须先声明后使用。\n\
    \n让我们更仔细地了解用户自定义函数。\n\n以下是用户自定义函数（或简称为函数）的通用语法：\n\n```text\nreturn_type functionName(param1,\
