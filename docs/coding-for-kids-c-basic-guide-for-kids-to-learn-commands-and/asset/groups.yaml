    \n函数定义包含函数声明中的所有内容，外加用花括号 {} 括起来的函数体。\n\n此外，它还应包含具名参数。当调用函数时，程序的控制权会传递到函数定义处，执行函数代码。当函数执行完成后，控制权返回到调用该函数的位置。\n\
    \n以下是上述声明对应的 swap 函数定义：\n\n```cpp\nvoid swap(int a, int b){\n    b = a + b;\n\
    \    a = b - a;\n    b = b - a;\n}\n```\n\n值得注意的是，函数的声明和定义可以同时进行。如果我们在引用函数之前已经声明了它，就无需单独声明。\n\
    \n我们可以看到，在前面的示例中有一个 swap 函数，它接受两个 int 参数并且不返回任何内容。它的返回类型为 void。我们没有单独声明这个函数，因为它在\
