    ## 第 2 章：C++ 中的变量、数据类型和运算符


    数据类型、变量和运算符是 C++ 最基础的概念。某些运算符被视为这种高级计算机编程语言的基本构建块。通常，我们使用它们来编写项目程序，并通过使用它们获得所需结果。数据类型是这三个概念中的核心概念；如果不掌握这三个基本概念，就无法理解
    C++ 编程。现在，我们将讨论 C++ 编程中一些必需的变量、运算符和数据类型。


    ### 2.1 C++ 的变量


    在 C++ 中，变量充当内存位置。它们只是容器或元素的名称，这些容器或元素包含程序后续执行所需的数据或值。变量可以使用字符和数字的组合，或下划线（_）等特殊符号，以及
    char、int、float 和 double 等数据类型来指定。变量名的首字符必须仅为字母，保留关键字除外。


    在任何编程语言中，变量都是最关键的组成部分。没有变量，任何编程语言都是不完整的。我们也可以断言，没有变量程序就无法执行。正如其他任何编程语言一样，C++ 语言也需要变量才能运行。变量用于存储值或字符串，而不是用于运行程序。如果没有存储任何值，应用程序将无法运行。因此，变量被认为是编程语言的支柱。


    ### C++ 语言中的变量定义规则和规定


    - 变量可以由数字、特殊字符（例如 & 和下划线（_））或字符串组合而成。

    - 由于 C++ 是区分大小写的语言，大写和小写会被视为不同的变量。变量 educba 和 eduCBA 将被分别处理。

    - C++ 中的变量必须以字符开头。数字不能作为第一个字符。6educba 不是可接受的变量，因为它以数字开头；而 educba6 以字符开头。

    - 变量不应使用 C++ 中的关键字。用于此目的的关键字包括 for、this、if、else、while、do、char、this 等。在 C++ 中，某些关键字不能用作变量。

    - 变量不得包含任何空格。Edu cba 无效，因为 edu 和 cba 之间有空格。但是，edu_cba 或 educba 都是合法变量，因为使用下划线将它们连接起来。


    ### 在 C++ 中，如何声明变量？


    在开始编写程序之前，可以声明变量。以下是声明变量的语法。


    ```

    data_type variable_name;

    ```


    其中


    **数据类型：** 它描述可用于存储值的数据类型。整数、字符、浮点数、双精度浮点数、短整数以及其他数据类型都是可能的。


    **变量名：** 定义变量名。除关键字外，它可以是任何内容。


    - 1. 例如 `int taxi;`；

    - 2. `float 2.6, 8.3`


    例如，int 是数据类型，而 taxi 是变量名。在第二个示例中，我们指定了两个变量，其中 float 是数据类型，2.6 和 8.3 是变量。变量声明后，编译器已为其分配存储空间，因为程序将使用这些变量。


