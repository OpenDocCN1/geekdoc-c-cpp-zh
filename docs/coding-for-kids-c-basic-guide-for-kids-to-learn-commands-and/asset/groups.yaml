    \n### 用户自定义数据类型\n\n联合、结构体、枚举和类是 C++ 支持的一些用户自定义数据类型。\n\n- **联合、结构体和类：** C 编程语言最重要的特性是联合和结构体。联合和结构体允许你将相似或不同的数据类型组织在一个标识符下。然而，为了促进面向对象编程，C++\
