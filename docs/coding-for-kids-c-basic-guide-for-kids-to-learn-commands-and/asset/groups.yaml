    \ followed by a semicolon (;). A compound statement is a collection of statements\
    \ (each ending in a semicolon), all of which are grouped in a block and contained\
    \ in curly braces: { }\n\nThe whole block is treated as a single statement (composed\
    \ of multiple substatements). When a generic statement appears in a flow control\
    \ statement's syntax, it can be simple or compound.\n\n### 6.2 Selection Statements:\
