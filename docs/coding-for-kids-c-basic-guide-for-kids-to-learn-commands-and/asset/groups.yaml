    ## 第 1 章：C++ 入门


    Java、C++、Python 和 C 是最常用的语言。这些语言鼓励程序员从计算机编程和实现的角度思考问题，而不是从业务逻辑的角度思考问题。尽管 C++ 已经老旧，但如今仍被广泛使用，这本身就是一项了不起的成就。C++
    仍然被广泛使用，最著名的软件也是基于它构建的。


    本章介绍 C++ 的基础知识、高级思想、应用和概念。还讨论 C++ 的背景以及用于进行 C++ 开发的工具。然后，你将学习编写自己的第一个程序。


    ### 1.1 什么是 C++？


    C++ 基本上是一种 OOP 语言。OOP 指面向对象编程语言，由著名计算机科学家 Bjarne Stroustrup 在 C 语言家族的发展过程中开发。C++
    的读音是“See-plus-plus”。它是以 C 的跨平台增强形式创建的，使开发者能够更好地控制内存和系统资源。


    C++ 被称为“包含类的 C”，因为 C++ 在 C 基础编程语言的基础上加入了 OOP 技术，包括使用指定的类。事实证明，C++ 不仅对计算机编程很有价值，而且对训练新手程序员如何使用
    OOP 也很有价值。


    然而，它不仅支持 OOP，还支持函数式编程和过程式编程。


    C++ 如今之所以流行，是因为它具有出色的可移植性和易用性，使程序员能够轻松设计可在各种操作系统和平台上运行的应用程序。尽管 C++ 是一种高级语言，但由于它与许多机器语言关系紧密，因此可用于操作底层数据。


    #### 简要背景


    Bjarne Stroustrup 于 20 世纪 80 年代初在贝尔实验室创建了 C++，旨在融合众多现有语言的最佳特性。他试图将现有 BCPL 的速度、通常具备高级特性的
    Simula，以及 Dennis Ritchie 的 C 的通用性与组合性整合到单一软件包中。他借鉴了 ML、Ada 以及 ALGOL 68 等其他语言，构建了一种通用且结构良好的语言，该语言几乎可以编译所有
    C 程序，而无需修改其实际源代码。


    ### 1.2 C++ 的五个基本概念


    #### 1. C++ 中的变量


    变量是任何编程语言的基本构建块。变量只不过是一种保存数据以供后续使用的手段。通过引用描述该信息的“词”，可以检索这个值或数据。变量一旦被声明和定义，就可以在其被声明和定义的作用域内多次使用。


    #### 2. C++ 中的控制结构


    程序执行时，编译器会逐行读取代码（从上到下，且大部分情况下从左到右）。这被称为“代码流”。从头到尾读取代码时，可能会遇到必须做出决定的时刻。软件可能会根据该决定跳转到代码的不同区域。甚至可能导致编译器重新运行某一部分，或直接跳过某段代码。


    可以把这种方法想象成你正在从各种 Guru99 课程中进行选择。你做出决定，然后点击链接跳过几页。同样，计算机程序也有一套严格的规则来决定程序如何执行。


    #### 3. C++ 中的数据结构


    让我们以（任何网站上的）课程列表为例！你面前很可能有一份课程表。但是，你认为他们是如何处理它的？课程数量可能很多，不同的人报名不同的课程。每个用户的变量都是以不同方式生成的吗？假设我们需要跟踪十门不同的课程。


    **然后是错误的方法：**


    如果我们需要保存十门课程，就会定义十个变量。对吧？**错！！！**


    在编程领域，试图用十个独立变量来存储是一种糟糕的方法。原因有两个关键因素：


    - 程序中需要大量文本。当然，我们现在只有十门课，所以还不算太糟，但如果我们有 1,000 门呢？想想你得输入多少次！别想了！

    - 要添加另一门课程，就需要手动调整代码。还得创建变量 course11。这完全疯了！


    那么，做事的正确方法是什么？


    **使用数据结构来存储它们。**


    使用数据结构，你可以避免创建成千上万个变量。C++ 有大量内置数据结构。数组是其中最常用的数据结构，后面将会介绍。


    #### 4. C++ 中的语法


    语法是一组关于单词、表达式和符号如何组织的规则。这是因为电子邮件地址具有明确定义的语法。你需要字母和数字的组合，中间可能带有下划线（_）或句点（.），还需要
    @ 符号以及网站域名（company.com）。


    因此，编程语言的语法也非常相似。它们是一组明确定义的规则，使你能够开发出可运行的软件。


    如果不遵守编程语言或语法的规则，就会出错。


    #### 5. C++ 工具


    工具（通常是实体设备）帮助你在现实世界中快速完成任务。这在编程世界中同样适用。编程工具是一种软件，与代码结合使用时，可以让你更快地编程。


    在所有编程语言中，可能有着数以万计甚至数以百万计的不同工具。许多人认为 IDE（集成开发环境）是最重要的工具。IDE 是一种让编码变得容易得多的软件。IDE
    可以让你的文件和文件夹保持井然有序，并以整洁的方式呈现它们。


    ### 1.3 什么是代码编辑器及其安装？


    #### IDE 到底是什么？


    IDE（集成开发环境）是一种用于构建游戏、软件和硬件的数字环境，集成了从调试到编译的一切功能。一些 C++ IDE 只支持单一语言，例如 IDLE 仅支持
    Python。另一方面，Apple 的 Xcode 支持多种语言，包括 C、C++、Java 等。


    本章将对每个 C++ IDE 进行清晰而基础的说明，以便你选择适合自己的 IDE。你也可以在电脑上试用其他几个 IDE，找出最适合你的那个。


    #### Dev-C++


    **此 IDE 的功能：**


