  md: '# 3.4.3 Theory: memory map


    A memory map is a layout of the address space of different peripheral parts such
    as I/O registers, data and instruction memory entry. Figure 3.33 illustrates how
    a memory map can be defined for a simple system. Microcomputer systems have a
    memory map.


    The address bus contains the address and the data bus will read or write data
    to this specific address. The data bus also contains a control bus that decides
    if it will be a read or a write cycle. This is a simplified explanation and we
    discuss this in more detail later in this book.


    | Macro | Usk |

    |---|---|

    | IORD (BASE, REGNUM) | Read the value of the offset REGION in a device with base
    address BASE. Registers are assumed to be offset by the address width of the bus.
    |

    | IOWR (BASE, REGNUM, DATA) | Write the value DATA at the offset REGION in a device
    with base address BASE. Registers are assumed to be offset by the address width
    of the bus. |

    | IORD_32DIRECT (BASE, OFFSET) | Make a 32-bit read access at the location with
    address BASE+OFFSET. |

    | IORD_16DIRECT (BASE, OFFSET) | Make a 16-bit read access at the location with
    address BASE+OFFSET. |

    | IORD_8DIRECT (BASE, OFFSET) | Make an 8-bit read access at the location with
    address BASE+OFFSET. |

    | IOWR_32DIRECT (BASE, OFFSET, DATA) | Make a 32-bit write access to the value
    DATA at the location with address BASE+OFFSET. |

    | IOWR_16DIRECT (BASE, OFFSET, DATA) | Make a 16-bit write access to the value
    DATA at the location with address BASE+OFFSET. |

    | IOWR_8DIRECT (BASE, OFFSET, DATA) | Make an 8-bit write access to the value
    DATA at the location with address BASE+OFFSET. |


    Table 3.6: alt_types.h


    | alt_8 | signed | 8 bit | typedef signed char alt_8; |

    | alt_16 | signed | 16 bit | typedef signed short alt_16; |

