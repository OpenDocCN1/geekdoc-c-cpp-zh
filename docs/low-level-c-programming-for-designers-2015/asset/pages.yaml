    ```


    # Move unmodified expressions out of loops


    Move any expressions used within the loop that never change value, out of the
    loop, see table 6.20. This prevents the compiler from recalculating the expression
    on every iteration of the loop [C-opt].


    Table 6.30: Move unmodified expressions out of loops


    ```

    Before

    int a (int data1, int data2) {

    unsigned int x;

    int temp = 100000;

    for (x = 10; x>=0; x--) {

    temp = temp / (data1 * data2);

    }

    return (temp);

    }

    ```


    ```

    After

    int a (int data1, int data2) {

    unsigned int x;

    int temp = 100000;

    int temp2;

    temp2 = data1 * data2;

    for (x = 10; x>=0; x--) {

    temp = temp / temp2;

    }

    return (temp);

    }

    ```


    # Loop unrolling


    Many compilers (e.g. gcc -funroll-loops) will do this automatically. It is also
    possible to change the source code to get the same effect, see table 6.21.


    In some cases the code performance increases if you don''t use a loop and instead
    expresses the loop code as plain text on successive rows, saving time by eliminating
    the loop overhead (initialization, increment, and checking of the loop counter
    etc) [Borland].


    Table 6.31: Loop unrolling


    ```

    Before

    for(int i = 0; i < 3; i++) {

    array[i] = i;

    ```


    ```

    After

    array[0] = 0;

    array[1] = 1;

    array[2] = 2;

    ```


    # Loop jamming'
