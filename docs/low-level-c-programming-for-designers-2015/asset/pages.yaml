    # 3.4.4 Theory PIO (Parallel Input/Output)


    In CASE 1C two PIOs are used as an example of simple input and output peripherals
    between the bus and the digital pins on the chip, see figure 3.34.


    ![](img/6e66f097437b5220f7019a5d1c02a038_60_1.png)


    Figure 3.34: Simple PIO in the middle, on left is the CPU bus and on the right
    the FPGA bus


    The CPU bus communicates via 32-bits data registers in the PIO. The 32-bits registers
    are memory-mapped which means that they have unique bus addresses to a number
    of registers. Figure 3.35 illustrates the registers for the PIO and the address.
    The address is calculated as the sum of the PIO''s memory mapped base address.
    The base address information is available in the system.h header file.


    The first PIO register is “data” with offset 0, see next figure. The data register
    has two modes; output-only mode and input-only mode. Writing to the data register
    stores the data in a register that drives the output ports (this is configured
    in Qsys). Reading from data register returns the data present at the input ports
    (this is also configured in Qsys).'
