  md: '# 8.1 Introduction


    An embedded system is not very useful unless it interacts with the outside world.
    A lot of embedded applications rely on physical quantities like temperature, pressure,
    acceleration etc. These quantities are connected to the embedded system via a
    sensor and the sensor output signal is either digital or analog. In the digital
    case, the output signal typically follows some serial data protocol such as SPI
    or I2C. Sensors with an analog output rely on analog-to-digital converters (ADCs)
    when interfacing with embedded computers. A typical FPGA is “all-digital”, i.e.
    it can only handle digital signals, but the FPGA on the BeMicro board has an integrated
    ADC and that is what this CASE is about.'
