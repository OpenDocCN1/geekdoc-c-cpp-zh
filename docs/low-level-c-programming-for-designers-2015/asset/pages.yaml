  md: "# 6.2 Worth considering\n\nThis part describes some things to consider before\
    \ making code changes; algorithms, the importance of clear and simple code, compiler\
    \ options, execution time of operations and the possibility to transfer some C\
    \ functionality to hardware (via VHDL coding).\n\n# 6.2.1 Choose a better algorithm\n\
    \nThink about what the code is really doing. Learn and use the most appropriate\
    \ algorithms, even if the designer didn't come up with the algorithms by him/herself.\
    \ Improving the overall algorithm will often produce better results than localized\
    \ code tweaking. Optimize the “big picture” first before you tweaking the details.\
    \ Remember that programming is primarily about creating good algorithms; it is\
    \ NOT about writing code Anyone can learn to write code. The hard part is to write\
    \ good structured code based on sound algorithms.\n\nAlso choose an appropriate\
    \ data structure. If the code does a lot of insertions and deletions at random\
    \ places then a linked list would be good. If some binary searching should be\
    \ done, an array would be a better choice [Optimization].\n\n# 6.2.2 Write clear\
    \ and simple code\n\nIf the code is clear and readable to humans it is also clear\
    \ and readable to compilers. Complicated expressions are harder to optimize and\
    \ can cause the compiler to revert to a lower optimization mode. Part of the clarity\
    \ is moving hunks of code into functions when appropriate. The cost of a function\
    \ call is extremely small on modern machines; therefore optimization is NOT a\
    \ valid excuse for writing ten-page functions (see next example).\n\nIf the designer\
