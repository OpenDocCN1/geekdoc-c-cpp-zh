    In order to understand how the ADC works, you need to understand the **sequencer**.
    Samples are acquired in a **sequence**. When the ADC is setup in Qsys, a conversion
    sequence is determined. A sequence can have any length (from 1 to 64) and a specific
    channel may appear more than once. Suppose the embedded design uses channels 1,
    2, 9 and 12 and the sequence length is set to 6 with the following sequence:


    1, 2, 1, 9, 1, 12


    The ADC will store the channels in order, store each sample in memory and when
    all six samples have been acquired a “done” signal will be issued.


    Exactly how when the samples will be stored depends on the ADC configuration mode.
    There are four different configurations [altera page 2-10], but we will only cover
    one mode here; the Standard Sequencer with Avalon-MM Sample Storage.


    In this mode the ADC stores each sample in secure memory locations on the on-chip
    RAM (i.e. the RAM in the ADC IP block) and they are readily available since they
    are memory mapped on the Avalon bus (using HAL IORD_...). In this mode the ADC
    IP block only consists of three micro blocks actually; the sequencer, the ADC
    control block and the sample storage block. The user cannot immediately access
    the control block. It can only be accessed indirectly via the sequencer. Both
