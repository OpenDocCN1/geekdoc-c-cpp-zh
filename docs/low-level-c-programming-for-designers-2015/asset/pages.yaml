  md: '# 7.1 Introduction


    In this input-output CASE study, the subject is to design a control unit for four
    LEDs with a push button. When the push button is pressed, a 4-bit counter is incremented
    and the binary value is displayed on four LEDs; the counter will count from 0
    to 15 and start over.


    Two parallel input/output (PIO) cores are integrated into the embedded system;
    one PIO drives the LEDs (output) and the second reads the push button status (input).


    CASE 5 specifications: Every time a push button is pressed the counter is incremented
    and the binary counter value is displayed both on the LEDs and in the Nios console
    window. The LEDs will display the number in binary format and the number will
    be displayed in decimal format in the Nios console window.


    These specifications will be implemented with two different solutions; software
    polling and hardware interrupt.


    The primary goal of this CASE is really to demonstrate how interrupts are handled
    in embedded system.


    The LEDs’ and push buttons’ hardware wiring on the BeMicro board have been discussed
    in section 2.2.3. Now would be a good time to recapitulate that section.'
