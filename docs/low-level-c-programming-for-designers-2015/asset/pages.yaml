  md: '# 3.1 Theory – HW Architecture - CASE 1A


    The simple computer system used in this CASE consists of four main components;
    the CPU to process data, main memory to hold the data to be processed, peripherals
    of different kinds and a communication between the different parts called the
    “bus”, see figure 3.1.


    ![](img/6e66f097437b5220f7019a5d1c02a038_29_0.png)


    Figure 3.1: CASE 1A Microcontroller architecture


    The components (sometimes called “IP components”) for the “CASE 1A” hardware architecture
    are:


    +   - CPU: Nios II (Central Processing Unit, processes data)

    - Bus: Avalon bus (communication between the “components”)

    - RAM: Internal FPGA RAM blocks (Hold the data and the program)

    - UART: Nios II JTAG UART (I/O Peripheral that communicates with the text via
    printf and scan)


    # 3.1.1 CPU Nios II


    There is no difference between a CPU (Central Processing Unit) and a processor.
    At least not referring to a modern computer on the market. In this book “CPU”
    and “processor” are two synonyms.


    (Read more on:


    http://www.ehow.com/about_6402155_difference-between-cpu-processor_.html


    The fundamental operation of most CPUs, is to execute stored instructions called
    a “software program” kept in memory. CPUs use four steps in their operation of
    the instruction: fetch, decode, execute, and write back. The instructions are
    32 bits long for the Nios II processor and are referred to as “machine code”.


    +   1) The first step fetches an instruction from memory.

    2) The decode step, determines what the CPU should do.'
  merge: -1
  pgno: 29
- img_proc: true
  md: '3) The execute step, uses the different components in the CPU to perform the
    operation. In a CPU different types of sub components such as an arithmetic logric
    unit (ALU), registers etc.


    4) The write back step, writes back results if necessary (sometimes it is not
    necessary)


    5) Go to step one (forever)


    The Nios II processor, illustrated in figure 3.2, is a general-purpose RISC processor
    (Reduced Instruction Set Computer) core with Harvard architecture, more about
    this later. A "RISC processor" indicates that it has a minimum set of instructions
    that the processor can execute. The number of instructions are few, but guaranteed
    to execute on one single clock cycle (except jump instructions). The competing
    "CISC" processors of Complex Instruction Set Computers with far more instructions
    (and more complex ones) but they typically do not execute on one clock cycle.


    The processor is connected to an oscillator that generates a physical clock signal
    with high frequency. This clock connects physically to the CPU and synchronizes
    all events. In an optimized CPU one instruction is executed on every single clock
    cycle. In a PC the frequency is often around GHz, but in many embedded systems
    the frequency is lower in order to decrease the power consumption. The faster
    the clock, the more instructions (machine code) the CPU can execute per second.
    So if we have a 40 MHz CPU frequency, it will execute 40 million instructions
    per second, at 1 GHz, it will execute 1000 million instructions per second!


    ![](img/6e66f097437b5220f7019a5d1c02a038_30_0.png)


    Figure 3.2: Nios II processor core and overview of key components


    The processor consists of different components such as:


    +   - 32 general-purpose registers, very fast and able to hold small amounts of
    information (32 bits).


    +   - Interrupt controller, to handle asynchronous events outside the processor,
    more'
  merge: -1
  pgno: 30
- img_proc: true
  md: 'about this in a later CASE.


    +   - Hardware-assisted debug module processor start, stop, step and trace.


    +   - Arithmetic Logic Unit, for mathematical and logical functions.


    +   - Additional hardware to optimize speed.


    # 3.1.2 The Avalon bus


    A bus (or buses) is a standardized way of providing a communication channel between
    hardware (HW) components. The buses of today are complex components, since the
    efficiency demands on the communication in computer systems have increased with
    time.


    ![](img/6e66f097437b5220f7019a5d1c02a038_31_0.png)


    Figure 3.3: Main classes of buses, serial and parallel


    We can classify the different buses. When looking at the last figure, there are
    two different types of buses and they are serial and parallel. Serial buses are
    used in for memory example Ethernet communication where the low cost is often
    of importance. The parallel buses are often used in high data rate systems, for
    example between the CPU and the main memory. We will now focus on the parallel
    Avalon bus and a bus system called the “Harvard architecture”.


    The Harvard architecture uses separate buses for data and instructions, see figure
    3.4. The Nios II processor''s instruction bus is connected to the software code
    in a memory and the data bus is connected to I/O, variable, stack ec in memory.
    The advantage of the Harvard architecture is that it can at the same time fetch
    a new instruction and also write data to a memory/read/write to an I/O device.


    The disadvantage is that it occupies a larger dice area. The competing architecture
    is called “von Neumann”-architecture. In this architecture data and program memory
    share the same physical bus lines. This minimizes the required dice area at the
    cost of speed (since data and instructions can no longer be fetched simultaneously).'
  merge: -1
  pgno: 31
- img_proc: true
  md: '![](img/6e66f097437b5220f7019a5d1c02a038_32_0.png)


    Figure 3.4: Harvard Architecture with two buses; data and instruction bus


    # ### 3.1.3 JTAG UART


    A JTAG UART (Universal Asynchronous Receiver/Transmitter) is responsible for the
    serial communication with the PC. The UART component transforms parallel information
    from the CPU into serial information for the host PC through the JTAG interface
    (serial bus). In the PC there is a JTAG receiver that transforms it back into
    parallel form. The communication between the computer and the FPGA board is performed
    through the JTAG (Joint Test Access Group) protocol. When executing print(`"hello"`),
    "hello"` is transmitted to a terminal window on the PC in ASCII format, see appendix
    ASCII.'
