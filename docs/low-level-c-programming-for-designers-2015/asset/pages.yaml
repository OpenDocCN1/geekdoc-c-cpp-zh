  md: 'The idea is to combine loops that loop over the same range, see table 6.22
    [Optimization].


    # Table 6.32: Loop jamming


    | Before | After |

    |--- |--- |

    | for(i=0; i<100; i++) | for(i=0; i<100; i++) |

    | stuff(); | { |

    | | stuff(); |

    | | functions(); |

    | | } |

    | | /*Never use two loops where one will suffice*/ |

    | for(i=0; i<100; i++) | |

    | functions(); | |


    # Switch when possible


    For large decisions involving if...else...else... it may be faster to use a switch
    statement, see table 6.23. In an if() statement, if the last case is required,
    all the previous ones will be tested first. The switch statement skips this extra
    work [Tutorial].


    # Table 6.33: Use switch


    | Before | After |

    |--- |--- |

    | if( val == 1) | switch( val ) |

    | functions_1(); | { |

    | | case 1: functions_1(); break; |

    | else if ( val == 2) | |

    | functions_2(); | case 2: functions_2(); break; |

    | else if ( val == 3) | |

    | functions_3(); | case 3: functions_3(); break; |

    | | }


    # Early loop breaking


    It is usually not necessary to process the entire loop. For example, if searching
    an array for particular item, escape from the loop as soon as possible, see table
    6.24 [Tutorial].


    # Table 6.34: Early loop breaking'
