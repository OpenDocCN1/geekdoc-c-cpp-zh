  md: '# 1.1 Embedded computer systems


    In figure 1.1 below you see two machines:


    ![](img/6e66f097437b5220f7019a5d1c02a038_8_0.png)


    Figure 1.3: Two computers


    Most people immediately recognize the machine to the left as a computer, but most
    people would not recognize the machine to the right as a computer, but indeed
    it is. The fundamental difference between these two computers is that, in, the
    machine to the right, the computer is embedded into the machine.


    If you recognize this difference, we can categorize computers into one of the
    following two classes:


    +   1) General purpose computers

    2) Embedded computers


    General purpose computers are desktop and laptop computers, workstations etc.
    General computers (almost) always have a keyboard, some kind of video screen,
    a hard drive and they are connected to the Internet via an Ethernet interface.
    General purpose computers are optimized to run an operating system (non-real-time)
    such as Windows or MacOS


    Embedded computers can have all too, but typically they don''t. An embedded computer
    is embedded into the system and is designed to run one (or a few) tasks only.
    The computer to the right in figure 1 is designed to run only a different laundry
    programs and that''s it! The computer to the right is not designed to run Windows
    and you can''t play World of Warcraft on it, but never the less, it is a computer
    because its “heart” is a computer system with a CPU, some memory and some I/O
    units.


    Since embedded computers are specialized computers with well-defined tasks, the
    next'
  merge: -1
