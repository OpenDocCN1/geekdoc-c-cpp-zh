  md: '# 1.1.1 Some useful terms


    # ANSI C, American National Standards Institute C


    Standard specification of the programming language C specified by ANSI. See appendix.


    # API, Application Programming Interface


    A source code interface that an operating system or library provides to support
    requests for services to be made of by it computer programs


    # CPU, Central Processing Unit


    A Central Processing Unit can be any piece of hardware which is capable of processing
    data and controlling the necessary resources to process such data, for example
    adding two numbers where the CPU would need to read the two numbers, add them
    in a circuit such as an ALU and write back the results.


    # GCC, GNU Compiler Collection


    A set of compilers produced for various programming languages by the GNU Project.


    # GNU, GNU is Not Unix


    A computer operating system composed entirely of free software. The project to
    develop GNU is known as the GNU Project.


    # GUI, Graphical User Interface


    A type of user interface which allows people to interact with a computer which
    employs graphical icons.


    # HMI, Human Machine Interface


    Interaction between humans and machines.


    # µP, Microprocessor


    A microprocessor is a general-purpose device which contains ALU, short for Arithmetic
    Logic Unit, and unit control. Microprocessors are generally “stand alone” devices
    on an individual chip and often contain more resources for complex arithmetic
    than a microcontroller.


    # µC, Microcontroller


    Microcontrollers have all the units necessary to complete a computer system “on-chip”.
    The microcontroller can be called a “single-chip solution”. It typically includes
    the Central Processing Unit (CPU), RAM, EPROM/PROM/ROM, I/O peripherals, timers,
    and interrupt controllers. A microcontroller can be thought of as a specialized
    form of the more general-purpose microprocessor. It is dedicated to control-applications
    with little complex arithmetic.


    # USB, Universal Serial Bus


    Common serial bus standard to interface devices.'
  merge: -1
  pgno: 11
- img_proc: true
  md: '# 1.2 Application and platform


    Application and platform as shown in figure 1.4 are two components in an embedded
    computer system. The platform is motivated to “help” the application to do the
    real work. A platform can be the hardware and the operating system. The application
    could be the software that controls an industrial robot. In smaller systems there
    is no need for an operating system.


    Several projects have demonstrated the importance of the connections between a
    platform that supports the application and the project management. If you have
    a weak platform that makes it difficult to implement the application, a strong
    project management is needed. If you have a platform that simplifies the implementations
    of the application, there is less needs for a costly project management.


    ![](img/6e66f097437b5220f7019a5d1c02a038_12_0.png)


    Figure 1.4: OS + HW = Platform, Platform + Application = embedded computer system


    Performance: If a system does not meet its required performance, it will be rather
    useless. Performance parameters are typically specified in terms of functionality,
    speed, cost, ability to meet deadlines (real-time performance) and/or power consumption.


    Power dissipation: There are several reasons why power dissipation is important:


    +   - energy costs increase if the power dissipation increases,

    - More expensive cooling systems could be needed when the power dissipation is
    high,

    - In portable systems, such as cell phones and other hand-held devices, the battery
    life time is an important factor.


    Safety: Many embedded systems, such as medical applications and cars, have strong
    safety requirements. In this kind of applications, reliability and safety requirements
    demand extensive and solid verification and testing on the design to guarantee
    that the system behaves as intended. Critical safety systems like the airbag bag
    in a car or life supporting equipment like a respiratory are always required to
    have some kind of redundancy; if one system fails a back-up auxiliary system takes
    over (and activates a service alarm).'
  merge: -1
  pgno: 12
- img_proc: true
  md: 'Flexibility: In some cases implementations need to be flexible, i.e. modifiable,
    to meet new standards or changed functionality requirements.'
