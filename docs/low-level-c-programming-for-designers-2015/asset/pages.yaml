- img_proc: true
  md: '# 4.1 Theory: Memory


    There are basically two types of memories; RAM and ROM. RAM is short for Random
    Access Memory and ROM is short for Read Only Memory. “Random Access” refers to
    the fact that the CPU can read or write arbitrarily from/to this memory and for
    that reason RAM memories are used as data memory in computer systems. ROM memories
    can only be read by the CPU and are therefore used to store program code or FPGA
    configuration code.


    # 4.1.1 RAM


    The first type of memory discussed here is RAM. RAM stores information during
    the running of a program; the data can be read from or to the memory. One thing
    to remember though, is that all information stored in RAM will disappear once
    the power supply is turned off; RAMs are “volatile” (while ROMs are “non-volatile”).


    # SRAM


    SRAM is short for Static Random Access Memory and consists of six transistors
    that can store one bit. The word “static” indicates that the memory retains its
    content as long as power supply remains.


    # DRAM


    Dynamic Random Access Memory consists of one transistor and one capacitor only.
    The DRAM’s capacitor will drain over time and lose its information. To prevent
    this, the memory needs to be refreshed; the manufacturers usually specify that
    each row should be refreshed at a frequency of 16 Hz or faster. However, every
    individual bit consists of fewer components than a corresponding SRAM bit and
    therefore the storage density in DRAMs is much higher (more bits per chip area)
    than SRAMs.


    # SDRAM


    The external RAM chip on the BeMicro (see figure 2.1) board is a synchronous DRAM,
    or SDRAM. SRAMs and DRAMs are asynchronous which means that they respond as soon
    as possible to requests. A SDRAM is synchronized to the system clock which means
    it waits for a certain edge on the system clock before it responds the overall
    performance is improved by the synchronization since higher data rates are allowed
    in a synchronized DRAM. This also means that the system clock has to be connected
    to the SDRAM chip.


    # PSRAM


    Pseudo Static RAM is a DRAM with built-in refresh and address-control circuitry
    that makes it behave like a static RAM. It combines the benefits of the high-density
    storage capacity of DRAMs and the simple interface of a true SDRAM.


    # DDR RAM'
  merge: -1
  pgno: 75
- img_proc: true
  md: 'DDR RAMs (Double Data Rate RAMs) are synchronized RAMs that transfer data on
    both the positive and negative edges of the clock signal and because of that the
    data rate is increased by a factor of two.


    # 4.1.2 ROM


    Another kind of memory discussed here is ROM (read-only memory). As the name implies,
    ROM is a type of memory that can only be read by the CPU. It is an unchangeable
    memory (or at least a memory that is “hard” to change). A ROM is “non-volatile”
    and doesn’t lose information if the power supply is turned off.


    ROMs allow data to be written into them at least once, either during initial manufacturing
    or during the programming. Some ROMs can be erased and reprogrammed times, although
    they are still referred to as “read only” because the reprogramming process involves
    (relatively complete) erasure and reprogramming. In RAMs the reprogramming is
    frequent and involves only a single bit, a byte or a word each time. This kind
    of bitwise updating is not possible in ROM memories. ROMs are usually used to
    store programs permanently, for example in a microcontroller.


    # PROM


    PROM stands for Programmable Read-Only Memory and is a kind of memory where the
    setting of each bit is locked by a fuse or anti-fuse. Such memories are used to
    store programs permanently. The key difference from a strict ROM is that the programming
    is done after the memory has been manufactured. They are frequently used in video
    game consoles or products as electronic dictionaries, where PROMs for different
    languages can be inserted.


    # EROM


    An EPROM, or Erasable PROM, is an array of floating-gate transistors individually
    programmed by an electronic device that supplies higher voltages than those normally
    used in electronic circuits. Once programmed, an EPROM can be erased only by exposing
    it to strong ultraviolet light. EPROMs are easily recognized by the transparent
    window on the top of the package through which the silicon chip can be seen, and
    which permits UV light to pass during erasing.


    # EEPROM


    An EEPROM, or E²PROM is an Electrically Erasable PROM and is similar to an EPROM
    except for the fact it can be erased electronically. EEPROM is used for example
    in a microcontroller to store data during power off.


    # Flash memory


    Flash memory is the “new” kind of memory that seems to be used everywhere, but
    there'
  merge: -1
  pgno: 76
- img_proc: true
  md: 'is actually nothing about it; it was introduced already in 1984 by Toshiba.
    The nice thing about flash memory is that it is a non-volatile read&write memory;
    you can read and write it arbitrarily and it doesn''t lose its information when
    the power supply is turned off. It is similar to a hard drive on you PC. In terms
    of access time, flash memory is actually faster than hard drives but they are
    still more expensive; the byte per dollar rate of flash memory is higher compared
    to hard drives. Then again, flash memories are portable and consume less power.


    The name "flash" refers to the erasing time which is "instant"; the engineers
    at Toshiba compared it to a camera flash.


    There are two kinds of flash memories; NAND and NOR flash. The main difference
    between them is that only NOR-flash memories allow byte-wise access of data. In
    NAND flash data has to be accessed in blocks. On the other hand NAND memories
    are less expensive and have a higher storage density.


    All means that there are two separate application areas for flash memories. NAND
    type flash is used in solid state drives, SD cards and USB thumb drives, i.e.
    to replace hard drives, while NOR-type flash memory is used to replace program
    memory in microcontrollers (which need byte- or word-wise access to data).


    Hence, flash memories can be used to replace program memory in an embedded system
    but not data memory since they are too slow to handle data.


    # Cache memory


    You have probably heard the phrase "cache memory" and you probably know that it
    is a "good" thing to have and something you pay extra for when you buy a new laptop
    for example.


    Cache memory is an extremely fast RAM memory that the CPU has immediate access
    to; it is typically on the same chip as the CPU in order to minimize the access
    times. The cache memory has two main tasks. Its primary task is to store the most
    common instructions that the CPU executes (execution cache). A typical computer
    algorithm consists of one or several loops and if the instructions are in the
    loop cache memory can be accessed much faster than if it has to be fetched from
    program memory.


    The second task of the cache memory is to predict what instructions or data the
    CPU will ask for ("look ahead”). For example, if the CPU asks for the first instruction
    in a loop and this instruction is not in the cache memory, the cache controller
    will "guess" that the CPU will soon ask for the next instruction in the loop and
    therefore pre-fetches all loop instructions into cache memory. Same with data;
    if the CPU asks for data in a file that is not in the cache memory, the cache
    controller loads the rest of the file into the cache memory while the CPU processes
    the first block; the cache predictor predicts that the CPU will ask for the rest
    of the file once it is processing the first block.


    Hence, there are two kinds of cache; for instructions and one for data. The CPU
    first checks the cache memory and only if the information is not in the cache
    it will look for it'
