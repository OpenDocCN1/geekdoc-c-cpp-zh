  md: '# 1.5 Software Development tools


    Software has many different languages, like C, C++, ADA, LISP etc. The development
    of software follows a well standardized path. The program (source code) is compiled
    to object code and compilers convert code to Assembler. The linker connects the
    program to libraries, among other things, and all base addresses are assigned
    absolute addresses. The linker produces machine code, which is downloaded to the
    target system (see figure 1.11).


    # 1.5.1 Compiler


    A compiler is a computer program that translates source code into object code.
    Often you can do it in two steps from C to Assembler and to object code. The object
    code cannot yet be downloaded to the system; first it has to be linked with other
    object code files.


    The object code may require device driver code (standard) and other code, which
    is taken care of by the linker. The compiler often does not replace symbolic addresses
    with real addresses. Therefore, even if there is only one file, the linker has
    to do the memory translation.


    # 1.5.2 Linker


    The linker permits programs to be built from different modules, rather than one
    big monolith. Programmers started to use primitive linkers as early as 1947.


    | C code "xx.c" |

    | Compiler |

    | Assembly code "xx.s" |

    | Assembler |

    | Object code "xx.o" |

    | Linker |

    | Machine code "xx.elf" |

    | Downloader |

    | Hex code in CPU RAM |


    Figure 1.11: Software development “layers”


    # Definition of a linker


    A linker is a program which combines object modules to form an executable program;'
  merge: -1
  pgno: 19
