  md: '# 8.2 Theory – Analog signals in embedded systems


    # 8.2.1 ADCs – Analog-to-Digital Converters


    There are basically three kinds of ADCs; successive approximation ADCs, integrating
    ADCs and flash ADCs [4]. Integrating ADCs [5] are slow but very accurate and provide
    high-resolution rates are typically used in digital multimeters which only require
    sampling rates of 100 samples per second (S/s). Flash ADCs are extremely fast;
    a conversion takes only one clock cycle, but on the other hand their architecture
    is complicated and occupy a large area on the silicon dice (which grows exponentially
    with the resolution) and for that reason they can only be implemented with limited
    resolution.


    Hence, we are left with successive approximation which is a fair compromise of
    the other two; very fast (but not *extremely* fast like the flash ADC) and accurate
    (but not *extremely* accurate like the integrating ADC). For these reasons, successive
    approximation ADCs are the dominating technique in embedded computer systems and
    this is exactly the kind of ADC that has integrated into the MAX 10 FPGA. This
    presentation focuses on successive approximation ADCs in general and the successive
    approximation ADC in the MAX 10 FPGA in particular.


    NB! In English textbook literature, successive ADCs are referred to as SAR ADCs,
    where SAR is short for *Successive Approximation Register*, but from now on we
    will only refer to the MAX 10 SAR ADC as simply “the ADC”.


    Any ADC is characterized by two parameters; the reference value and “the number
    of bits”. An n-bit ADC with a reference value $U_{ref}$ has a voltage resolution


    ```

    $$\Delta U = \frac{U_{ref}}{2^n}$ (8.1)

    ```


    The ADC acts as an analog input and a digital output. “Analog input” should be
    interpreted as an “analog voltage in the range 0 V to $U_{ref}$ and equivalently,
    “digital output” should be interpreted as “integer in the range 0 to $2^n - 1$;
    the output can assume $2^n$ different integer values, 0 to $2^n - 1$, represented
    by binary lines.


    **Example 1:** A 12-bit ADC with a reference value of 2.5 volts has a resolution
    of 0.61 mV and can assume 4096 integer values on the output (0…4095). (This is
    exactly the parameters of the ADC integrated into the MAX 10 FPGA).


    ![](img/6e66f097437b5220f7019a5d1c02a038_149_0.png)


    The ADC does (in principle) that it performs a division; it divides the input'
  merge: -1
  pgno: 149
- img_proc: true
  md: 'voltage Ain with the resolution DU and the output integer is the quotient of
    this division correctly rounded to the nearest integer. This is all done in hardware.
    The difference between the three ADC techniques is how this “division + rounding”
    is implemented in hardware.


    **Example 2:** If the ADC in example 1 has an input voltage Ain = 1.3640 volts,
    the integer number on the output will be


    ```

    $$\frac{A_{in}}{\Delta U} = \frac{1.3640}{2.5} \times 2^{12} = 2235$

    ```


    The embedded computer can only see the integer Dout and in order to translate
    back into voltage, the embedded computer must multiply the integer with DU. In
    this case we get


    ```

    $U_{in} = 2235 \times \Delta U = 2235 \times \frac{2.5 \text{ volt}}{2^{12}} =
    1.3641 \text{ volt}$

    ```


    Notice in the example above that there is a slight difference between the voltage
    Uin (1.3641 volts) and the actual input voltage Ain (1.3640 volts). This difference
    is referred to as the quantization error or the quantization uncertainty and is
    due to the fact that the output integer has rounded. This is an inherent property
    of any ADC and the quantization uncertainty is always $\pm\frac{1}{2}DU$; the
    voltage Uin calculated by the embedded computer is only an estimation of the input
    Ain. The true input voltage can be anywhere in the voltage range Uin $\pm \frac{1}{2}$
    DU;


    ```

    $U_{in} - \frac{1}{2}\Delta U \leq A_{in} \leq U_{in} + \frac{1}{2}\Delta U \quadquad
    (8.2)$

    ```


    You should think of $\Delta U$ as “the smallest change in the input voltage will
    change the output integer by exactly 1 unit”.


    There is also some common ADC terminology you need to be familiar with. First
    of all, the 12-bit integer number on the output is referred to as the sample,
    and an operating ADC is simply sampling. The number of samples acquired per time
    unit is the sampling rate (Samples/second = S/s). A typical SAR ADC has a maximum
    sampling rate > 1 MS/s (Mega = Million)


    > **Comment:** You may have heard of the sampling theorem. This law of nature
    states that an ADC signal with a frequency of f, must sample with a sampling rate
    greater than $2\times f$. Violating this rule will result in aliasing [quist].


    (Aliasing is what you see on television when you see the rotor blades of a helicopter
    moving backwards; the frames/second of the video recorder is much slower than
    the rotation speed of the rotor blades.)


