  md: '# 2 Hardware and software installation


    In order to develop our embedded system we need both some hardware and some software.
    The software we use is referred to as the “IDE", the Integrated Development Environment",
    and we will use the IDE from Altera which is called Quartus II. This is a licensed
    software but they offer a free-of-charge web edition that you can download directly
    from their web site (https://www.altera.com/downloads/download-center.html).


    In order to complete a design cycle you will also need to download your design
    to some hardware platform and this book uses an inexpensive hardware platform
    from Arrow; the BeMicro MAX 10 board for only ~$30 (see section 2.2). This board
    has a MAX 10 FPGA and is only the size of a a credit card (http://parts.arrow.com/item/detail/arrow-development-tools/bemicromax10#RGMn).


    The hardware design files you need are available on the books webpage: (www.lowlevelprogramming.agstu.com).'
