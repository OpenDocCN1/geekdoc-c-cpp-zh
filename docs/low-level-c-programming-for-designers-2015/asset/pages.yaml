  md: '# 1.5.


    A rule of thumb is that an architecture that a human works with should not consist
    of more than 7 ± 2 components. A computer can easily handle larger amounts of
    components at the same time (millions).


    ![](img/6e66f097437b5220f7019a5d1c02a038_15_0.png)


    Figure 1.5: Hardware architecture as a block schematic


    # 1.3.3 Hierarchy


    It is possible to create a map of the design structure. Every branch in the structure
    splits until it finally ends up in non - dividable components or as they are sometimes
    called, leaf components. A component is either a structure or it is a non - dividable
    component. A leaf component can be C-code that does not call any other functions
    or VHDL with no sub-components. Abstraction will be higher at the top than at
    the bottom, (see next figure).


    Figure 1.6: Overview of abstraction and hierarchy.'
  merge: -1
