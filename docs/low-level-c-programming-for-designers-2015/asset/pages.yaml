  md: '# Preface


    The motivation of this book is to prepare the designer for real embedded SW design
    projects for microcontrollers. This is done by walking systematically through
    entire real designs together with adequate theory. A microcontroller is designed
    to manage the operations of embedded systems in many products for vehicles, robots,
    medical treatments, machines, homes and other needs. A typical microcontroller
    includes a processor, memory, and peripherals. Low C -programmer needs a good
    understanding of microcontroller architecture and the low operations of the software
    system.


    # This book


    The organization of this book is focused on design of embedded software by doing
    real designs, “Learn by doing”. The theory integrates into the CASEs, with purpose
    to get as short distance between practice and theory.


    Before you start:


    +   Download the tools, free (see web-book page for instructions, "http://lowlevelprogramming.agstu.com/”)


    +   Order the board, BeMicroMax10, cost about 30 dollar


    +   Go!


    The CASEs will have different computer architectures (microcontrollers) from a
    simple, to a complex architecture with lot of devices and CPU with pipeline, data
    and instruction cash.


    ![](img/6e66f097437b5220f7019a5d1c02a038_3_0.png)


    Figure 1: Hardware (microcontroller) and software, two worlds that meets in the
    book


    The professional software tools used is free to download for educational purpose.
    The software design is done with the tools and the executable code is downloaded
    to the RAM. The Alteras FPGA board (Field Programmable Gate Arrays), is a programmable
    hardware device.'
