  md: '# 8.4 Discussion


    Any embedded system that interfaces to the “real” world has to deal with analog
    signals. Sensors do most of the job and sensors generate output signals proportional
    to some physical quantity like temperature or, as in this case, light intensity.
    This case has demonstrated how the integrated ADC of an FPGA can be used to handle
    analog voltage signals from a sensor sensitive to light. Other sensors communicate
    with the host processor via some digital interface, but that requires a more expensive
    sensor and some extra software for the serial communication protocol.


    In this case we handled the ADC with “brute force”; we used the common HAL macros
    IORD_ and IOWR_ to configure the ADC and read the samples. There is a special
    API for the ADC and you access it by including the the head file altera_modular_adc.h
    [altera 1, page 5-18].'
