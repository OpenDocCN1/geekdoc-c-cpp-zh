    # # 5.6 Integrating device drivers into the BSP


    In 5.5 we designed the device driver and validated it. So far good, but we are
    not ready to make a customer delivery yet! We don''t just deliver a set of .h
    and .c files; we also make sure that device drivers are automatically loaded into
    the BSP when a new project is initiated. When we prototyped it above, the header
    file was saved in the project folder (see figure 5.10) but what we would really
    like now, is that the device driver files are automatically loaded into the driverinc
    sub folder of the BSP (see figure 5.13) and this is where all the other driver
    files are stored and this is where our driver files belong.


    ![](img/6e66f097437b5220f7019a5d1c02a038_95_1.png)


    Figure 5.13: Our device driver (h file) should be loaded into the <BSP folder>drivers\inc


    (If the device driver has also used a .c source file, it should be loaded into
    the src folder.)


    So do we make the Nios II SBT automatically load the new device driver into the
    BSP sub folders? The answer is that when a new project is initiated, the Nios
    II SBT looks for "tickle" files. These tickle files contain information about
    what to load into the project and where to place it. Tickle files are written
    in "tickle script" and we will address this matter briefly here.


    The file we need is an _sw.tcl file. Tickle script is hard and we will handle
    this problem'
