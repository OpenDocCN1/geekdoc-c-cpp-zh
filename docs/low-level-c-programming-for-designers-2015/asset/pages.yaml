  md: '# 7.7 Discussion


    Introducing interrupt handling in embedded systems increases the processor efficiency
    tremendously since it does not have to constantly check on slow peripherals that
    may or may not need attention; the CPU can focus all its attention on all the
    other tasks knowing that the peripheral will call for attention when it is ready.
    Not using interrupts is like having a telephone with no ring signal; you would
    constantly have to check the phone line to know if someone has called you! What
    a waste of time that would be and this is what polling is to be a CPU; like a
    telephone with no ring signal!'
