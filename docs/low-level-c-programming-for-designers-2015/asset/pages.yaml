- img_proc: true
  md: 'but for now we will only comment on the clocks and the simplest I/Os (LEDs
    and buttons).


    # 2.1.2 System clocks


    The MAX 10 FPGA of course supports the implementation of Altera''s soft CPU, the
    Nios II processor and not that is the processor we will base our designs on. As
    any other CPU it requires a clock. All the designs are available as downloads
    and you don''t need to understand the following information in detail, but we
    include it here in case you look for a more detailed understanding of the systems.


    As illustrated in figure 2.2, there is a 50 MHz clock available on the board and
    it is connected to the FPGA. The FPGA also has couple of PLLs that we will use
    to create the clocks necessary for our designs to work.


    As long as we don''t use the external SDRAM memory or the internal AD converter,
    we only need one single clock (the CPU) and we will use the 50 MHz clock directly.


    However, when we want to add external memory to our design (the SDRAM) we will
    let the internal DDR controller handle the SDRAM. DDR stands for “Double Data
    Rate” and increases the read/write process from/to the SDRAM by a factor of 2.
    This is possible since the DDR controller can operate on both the positive and
    the negative edge of the clock signal. This however, requires an additional clock
    signal -90° out phase with the system clock. To speed up things, we will later
    use a PLL to increase the clock frequency to 80 MHz.


    Also, the on-chip ADC requires a 10 MHz clock, so when we start using the ADC,
    we will have invoke the second PLL in order to get a 10 MHz clock for the ADC.
    Figure 2.3 illustrates our clock system for more advanced designs.


    ![](img/6e66f097437b5220f7019a5d1c02a038_25_0.png)


    Figure 2.3: Our clock system for advanced designs


    The 40 MHz clock can be used for some “slow” I/O units.


    # 2.1.3 LEDs and buttons


