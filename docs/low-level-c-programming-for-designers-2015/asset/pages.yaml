- img_proc: true
  md: 'a specific task (such as running a laundry machine).


    When comparing the number of products between embedded systems and general purpose
    computers (PC), there are less than 0.5 % general purpose computers (PC) on the
    market. A typical home (in the western world) have >30 embedded computers and
    two general purpose computers. A modern car alone may have 40-50 embedded computers
    (for engine control, climate control, fuel injection, airbag control, seat warming,
    measuring fuel level, speed, rpm, rain sensor etc).


    Next figure shows an example of components in an embedded computer system.


    ![](img/6e66f097437b5220f7019a5d1c02a038_10_0.png)


    Figure 1.3: An embedded computer system can encompass the microprocessor as well
    as many other components


    An embedded computer system consists, in most cases, of a multitude of smaller
    components instead of one large component, which leads to parallel execution (concurrency).


    Components can be:


    +   - Sensors (e.g. buttons)

    - Actuators (lamps)

    - A/D and D/A Converter

    - Human Interface


    Compare this to the typical hardware of a general-purpose computer; hard drive,
    Ethernet interface, video screen, keyboard, and mouse.


    > Authors’ comment: Today it may not be obvious where to draw the line between
    embedded computers and general-purpose computers. For example, how would you classify
    an iPad or a smart phone; as a general-purpose computer or an embedded system?'
