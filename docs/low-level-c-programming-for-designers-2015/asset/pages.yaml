    \ what services are required.\n\n+   1. Registers\n\nThe Timer IP component has\
    \ two registers only; the Data register and the Control register.\n\nA typical\
    \ IP component has three kinds of registers; the Control register is used to control\
    \ the hardware function and configure it for different tasks, the Status register\
    \ contains information about the hardware's status (is it busy?, is it done?,\
    \ and finally it has a Data register that the device driver uses to exchange data\
    \ with the hardware. The timer IP component used has a data register called the\
    \ TIME_REG register and a control register called the CONTROL_REG register.\n\n\
    The TIME_REG register holds the value of the time and can be read by the user\
    \ application through the device service Timer_read (yet to be written). This\
    \ register is continuously updated in hardware by the system clock as long as\
    \ the timer is in running mode.\n\nThe TIME_REG register has a unique address\
    \ on the data bus and is calculated from the device's base address + offset (==0),\
    \ see figure 5.2. The TIME_REG register is a read-only register.\n\n| Name | Mode\
    \ | Address offset | Bits 31 - 0 |\n|---|---|---||\n| TIME_REG | Read only | $0\
    \ | Timer data |\n\nFigure 5.2: Time Register\n\nThe CONTROL_REG register is used\
    \ to control the hardware functions. It is 32 bits long but only two bits are\
    \ used (bits 31 and 30), which is actually all we need since"
