  md: 'Authors'' comment: In order for the SBT to be built to integrate the driver
    into the BSP, the naming is very important. First of all, when the hardware was
    created, a corresponding _hwtcl file was created (which describes the hardware
    of the Timer IP component) and if that file has the name <myComponentName>_hw.tcl,
    then the sw file must have the name <myComponentName>_sw.tcl. Secondly, the second
    row of the title file above, the hw_class_name, must be <myComponentName>. If
    these names don''t match, the SBT will not load the driver into the BSP.


    +   3. Create a new Nios II project in the CASE_3B folder (Nios II Application
    and BSP from Template) and use the Hello World template. Name the project “CASE_3B”
    (use the same .spincof files as in CASE 3A). When the project has been initiated,
