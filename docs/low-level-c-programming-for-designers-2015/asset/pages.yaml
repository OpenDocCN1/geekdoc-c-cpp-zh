    Figure 5.15: The driver file has been loaded into the BSP


    +   4. Download the .sof file to the FPGA if necessary (i.e. if you have turned
    off the power to the board since you did CASE_3A).


    +   5. Edit the BSP properties: no support for C++, use small C libraries and
    drivers.


