  md: '# # 2.1 Hardware platform


    ### 2.1.1 Arrow''s BeMicro MAX 10 board


    Figure 2.1 below illustrates the boardwait- Figure 2.1 below illustrates the board
    and some of the hardware is pointed out. The board size is only 50x85 mm.


    The FPGA is a MAX 10 from Altera and has on-chip non-volatile flash memory, an
    on-chip AD converter and temperature sensor. It has phased locked loops, hardware
    multipliers and is capable of hosting the soft Nios II-CPU. It also has a number
    of sensors that we will look into later.


    ![](img/6e66f097437b5220f7019a5d1c02a038_24_0.png)


    Figure 2.1: The BeMicro MAX 10 board


    This board is powered from the same USB used to program the FPGA, so there is
    no need for an external power supply, but if necessary, it has a 2.5 mm connector
    for an external +5 V power supply. The FPGA itself has 8000 LEs (logic elements),
    51M9K memory blocks, 24x18 multipliers, two PLLs, 250 kbyte of flash memory and
    250 general purpose I/O pins. Figure 2.2 on the next page illustrates a schematic
    overview of the FPGA and the I/O units on the board.


    ![](img/6e66f097437b5220f7019a5d1c02a038_24_1.png)


    Figure 2.2:BeMicro MAX 10 board overview


    We will learn the details of this hardware as we present the different CASES in
    this book,'
  merge: -1
