  md: "In a SAR ADC division $A_{in}/DU$ is implemented as a number of successive\
    \ comparisons. The input voltage $A_{in}$ is compared to multiples of $DU$ in\
    \ order to find the integer $m$ such that $m\timesDU$ is as close to $A_{in}$\
    \ as possible. This would in principle be very easy; simply increase $m$ from\
    \ 0 and upwards until $m\timesDU \\geq A_{in}$. However, this would be very time\
    \ consuming; on the average it take $2^n/2=2^{n-1}$ comparisons which would be\
    \ 2048 comparisons for a 12-bit ADC. The cleverness of the successive approximation\
    \ $A_{in}$ is the algorithm used to find the $m$-value much faster.\n\nIn successive\
    \ approximation, $A_{in}$ is first compared to $U_{ref}/2$. If $A_{in} > U_{ref}/2$\
    \ then the MSB of $D_{out}$ is ($D_{out} = 1....$) and $A_{in}$ is next compared\
    \ to $3\times U_{ref}/4$. If $A_{in} < U_{ref}/2$ then the MSB of $D_{out}$ is\
    \ cleared ($D_{out} = 0....$) and $A_{in}$ is next compared to $U_{ref}/4$.\n\n\
    Say that $A_{in} > U_{ref}/2$ so $D_{out} = 1.$, In the next comparison, $A_{in}\
    \ > 3\times U_{ref}/4$, then the second MSB is set ($D_{out} = 11....$) else it\
    \ is cleared ($D_{out} = 10....$).\n\nSay that $A_{in} < 3\times U_{ref}/4$ so\
    \ that $D_{out} = 10..... In the next comparison $A_{in}$ would be compared to\
    \ $5\times U_{ref}/8$, which would determine the value of the third MSB. This\
    \ comparison algorithm finds the $m$-value in only $n$ comparisons for an $n$-bit\
    \ ADC (12 comparisons only for a 12-bit ADC). This is illustrated in 8.2 for a\
    \ 4-bit SAR ADC.\n\n![](img/6e66f097437b5220f7019a5d1c02a038_151_0.png)\n\nFigure\
    \ 8.2: The comparison algorithm in a 4-bit SAR ADC\n\nHence, an AD conversion\
    \ takes $n$ clock cycles in an $n$-bit SAR ADC. This is of course slower than\
