  md: '# 6.4 Theory – Simple time measurement technique


    In CASE 4 (see next section) the Timer IP from the last CASE will be used to measure
    the time performance of some C code. Before we do that, we will do some theoretical
    predictions and then compare these theoretical calculations with the actually
    measured times in CASE 4.


    Time will be measured in clock cycles n and from n we get the time T in seconds
    from


    ```

    $T=nx\frac{1}{f}$ \(6.1)

    ```


    where $f$ is the system clock frequency.

    In order to predict C code execution time, we need to know how each C statement
    is translated into assembler code and how many clock cycles each assembler instruction
    requires. In the Nios IDE we easily get the assembler code if we switch to debugger
    mode and get the execution time for each instruction from the Nios II Handbook
    [nios]. The execution times for some of the most common assembler instructions
    are summarized in table 6.27.


    For example, the C code line value\_a = 5; translates into the following assembler
    lines by the compiler:


    ```

    movi r2,5  //writes 5 to register 2

    stw r2,16(fp)  //stores 5 to memory address (fp+16) (fp is an address register)

    ```


    | Table 6.27: Instruction execution performance for Nios II/Core |

    | Instruction | Cycles |

    |---|--|

    | Normal ALU instructions (e.g., add, commit) | 6 |

    | branch, jmp, ret, call, calir | 6 |

    | trap, break, eret, bret, flush, wrap, rdctl, unaligned | 6 |

    | load | 6 + Duration of Avalon transfer |

    | load halfword | 9 + Duration of Avalon transfer |

    | load byte | 10 + Duration of Avalon transfer |

    | store | 6 + Duration of Avalon write transfer |

    | Shift, rotate | 7 to 8 |

    | All other instructions | 6 |

    | Combinatorial custom instructions | 6 |

    | Multi-cycle custom instructions | >=6 |


    According to table 6.27, both movi and stw consume six clock cycles (plus the
    Avalon delay), a total of 12 clock cycles. Assuming a system clock frequency of
    50 MHz, this indicates that executing value\_a = 5; would take'
  merge: -1
