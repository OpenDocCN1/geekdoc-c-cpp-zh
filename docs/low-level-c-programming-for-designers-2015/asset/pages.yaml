  md: when you write an interrupt service routine (ISR). First of all, it is treated
    by the compiler as any other function, but it cannot return anything and it cannot
    take any arguments except for a context pointer. This is a direct consequence
    of its asynchronous behavior. The best way of passing values between the ISR and
    the main program is by using global variables [valvano]. ISRs should also be kept
    as short as possible since all tasks in the main program are suspended while the
    interrupt is served and finally, avoid calling functions from the *main* function,
    since this may cause *recursion* which may lead to stack overflow [ccs]. If there
    are functions that needs to be called both from the main function and the ISR,
    the function call in *main* should be protected from interrupt by disabling the
    interrupt before the function call and enabling the interrupt immediately after
    the function returns.
