  md: "# 7.2 Theory – Software polling I/O systems\n\nSoftware polling systems scan\
    \ (read) the input ports, typically with a fixed periodic time interval. That\
    \ means that the system (program) checks if something has happened at the input.\
    \ When not checking the input ports' status, it is busy servicing other tasks.\n\
    \n![](img/6e66f097437b5220f7019a5d1c02a038_130_0.png)\n\nFigure 7.1 illustrates\
    \ a polling system with a fixed polling period. If the period time is short the\
    \ polling process may have a negative impact on the service of the other tasks.\
    \ This is particularly problematic in systems where the input ports do not change\
    \ status very often; most of the polls result in “no action”. On the other hand,\
    \ polling systems are easy to implement and are typically preferred in systems\
    \ that can afford the time waste caused by periodic polling.\n\nThe code below\
    \ illustrates the typical structure of a polling system:\n\n```\nwhile(1) {\n\
    \  delay_period_time();\n  input_port_value = read_input_port();\n  //process\
    \ data\n  //serve other tasks\n}\n```"
