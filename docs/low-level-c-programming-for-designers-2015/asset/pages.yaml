  md: '# 7.5 Theory – Interrupt system


    # 7.5.1 Introduction


    Interrupt is a feature designed to improve the efficiency and response time in
    a computer system dealing with asynchronous events (in software or in external
    hardware). An interrupt signal is an asynchronous call for attention by hardware
    or software. We will focus on hardware interrupts here.


    Interrupts are actually just a special kind of exceptions in a computer. An “exception”
    is the transfer of control away from a program’s normal flow of execution, caused
    by an event (internal or external to the processor), which requires immediate
    attention. Division-zero or stack overflow are typical software exceptions. Another
    kind of exceptions are traps that is not covered here [combs].


    The typical problem when dealing with “events” in a computer system is that they
    typically appear at irregular intervals and by nature asynchronous. Assume that
    the processor is communicating with an external device and that this device is
    busy completing some task. The processor needs to know when it is done in order
    to send new data to or collect data form. Rather than just sitting, waiting for
    the device to be done (polling), the system’s overall performance would increase
    tremendously if the processor could tend other tasks while the external device
    is busy and automatically alerted the processor when it is done.


    This is exactly what interrupts are all about. The device can generate an IRQ
    request (Interrupt ReQuest) and once this signal is recognized by the processor
    it drops everything else and tends to the external device.


    Figure 7.5 illustrates the program flow when interrupts are enabled.


    ![](img/6e66f097437b5220f7019a5d1c02a038_135_0.png)


    Compare figure 7.5 to figure 7.1 and notice the irregular asynchronous behavior
    of the interrupt system. The “servicing of other tasks” is the “main” program
    which is running in the background and as soon as the external device needs attention
    the program flow is redirected to the ISR (Interrupt Service Routine) which is
    referred to as the'
  merge: -1
  pgno: 135
- img_proc: true
  md: 'foreground [samek].


    For this work, the processor needs to save the context before it jumps to the
    ISR. “Saving the context”, means the processor must remember the address to the
    next instruction it was supposed to execute in the main program before the interrupt
    request arrived. This is necessary in order for the processor to be able to pick
    up program execution it were left off when the IRQ occurred. Also, the contents
    of internal registers must be stored. Hence, the “context” is all the information
    the processor needs to store in order to be able to resume normal execution after
    completing the ISR. As a matter of fact, this transfer of program flow are sometimes
    referred as a context switch but that terminology is mostly reserved for multi-tasking
    systems. The main difference between an interrupt context switch and a context
    switch in a multi-tasking system is when an interrupt occurs, the context switch
    is taken care of by hardware. Context switching in multi-tasking systems are handled
    in software [alin]. So, for context switching at interrupts, the processor has
    a set of “shadow registers” that are automatically loaded and retrieved. In multitasking
    systems, the context is “pushed” to the stack at pre-emption.


    In Case 5B, the external device will be the SW1 key on the BeMicro board used
    to increment the 4-bit counter. When the key is pressed, the button PIO unit will
    generate an interrupt request to the processor.


    ![](img/6e66f097437b5220f7019a5d1c02a038_136_0.png)


