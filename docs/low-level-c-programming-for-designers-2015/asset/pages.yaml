  md: '# 6.3 Code optimization techniques


    Now it is time to look at some C code optimization techniques. The techniques
    are divided into five parts: variables, structures, functions for conditional
    branches, loops and pointers. Each technique is illustrated by an example.


    # 6.3.1 Variables'' scope


    Use local variables where possible, see table 6.1. The narrower scope of the variable,
    the better a compiler can optimize it. Following this guideline, declaring a variable
    inside the loop or block it will be used in, may produce better results than declaring
    it at the start of the function [C-opt].


    Table 6.11: Use local variables


    | Before | After |

    |---|---|

    | int (void) { | int (void) { |

    | int; | int; |

    | for (i=0; i<500; i++) { | for (i=0; i<500; i++) { |

    | int errorcode; | int errorcode; |

    | errorcode = b; | errorcode = b(); |

    | if (errorcode) return (errorcode); | if (errorcode) return (errorcode); |

    | } | } |

    | return (0); | return (0); |

    | } | } |


    Also, remember that global variables are never destroyed; they will permanently
    occupy a memory cell in RAM. Local variables though, only exist during the time
    they are used, i.e. while the code within the variable''s scope is executed (such
    as a function). When the program exits the function, the variable is destroyed
    and the memory location occupied may be used by other variables. Using local variables
    is simply a more efficient use of RAM memory.


    # Use the natural-sized variable


    For variables that do not require a certain type, use the int type (or Alteras
    HAL 32 bits type = data bus size for Rios), see table 6.2. The compiler should
    treat this as the target processor''s natural-sized integer, which will generally
    be more optimal to use for arithmetic and logic. For example, on a 32-bit target
    processor, a variable declared as short may be 16-bit, and would have to be sign-extended
    before it could be compared'
