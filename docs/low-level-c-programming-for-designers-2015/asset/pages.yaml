  md: '# 3.3 Design CASE 1B


    Design CASE 1B focuses on how to use the debugger. Nios II IDE provides a debugger
    called GnuPro Debugger.


    We will use the same hardware as in CASE 1A.


    # 3.3.1 Theory: Debugging, monitoring and simulation


    As of us know, the person who writes entirely error-free program code does not
    exist. Instead, debugging and maintenance of program code makes up a very large
    part of the life cycle budget of a software product. Today debugging and testing
    makes up 80 % or more of the total cost for a common product during its lifespan.


    To get an idea of the amount of money spent on debugging and maintenance of software,
    it is worth mentioning that the U.S. Department of Commerce showed, the NIST Report,
    The Economic Impacts if Inadequate Infrastructure for Software Testing from 2002,
    that only in the U.S. alone, more than 59 billion dollars a year are spent on
    debugging of software.


    With these astronomical figures in mind it is easy to understand the importance
    of writing code with few bugs as possible from the beginning. Of course we would
    all to write entirely error-free code, but to get there we still have a long way
    to go. The number of bugs may, for example, minimized by recycling code that is
    already tested and where most bugs have already been found. Unfortunately, recyclable
    code is not always available, and all that remains is to write new code.


    Bugs are often introduced early in a project, frequently already during the design
    phase of a functionality, and are not discovered until later when the project
    has, for example, reached the phase where integration of several modules takes
    place and where they are supposed to interact with each other. This kind of bugs
    are serious, since it is extremely difficult at this late stage to begin searching
    for bugs that have existed since the design phase. This kind of bugs may also
    be hard to reproduce in a way that makes possible to say for what causes some
    them. Bugs of this kind also often have a tendency to only appear occasionally,
    which makes debugging even more difficult.


    # 3.3.2 Traditional software debugging


    There are a number of existing methods for searching for bugs in software.

    A common method is to insert debug prints into the code, which makes the values
    or signs chosen be printed out in a terminal window. However, this method has
    its disadvantages. Debug prints usually take a very long time for the CPU to execute.
    If the application in question is time critical, possible debug prints may destroy
    the timing so that the application no longer works as intended. In other words,
    it does not do what it is supposed to, since various events no longer take place
    at the right time.


    An example:


    ```

    void add_func(int a, int b)

    {}

    ```'
