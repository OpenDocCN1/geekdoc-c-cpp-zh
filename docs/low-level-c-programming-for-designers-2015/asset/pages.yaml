- img_proc: true
  md: 'elsewhere.


    If the cache is such a good memory, why not use only cache memory instead of external
    RAM? It is of course a matter of price; cache memory costs about 100 times more
    per byte than regular RAM. Quality costs!


    Also, the computer performance may not necessarily improve linearly with the size
    of available cache memory. The bigger the cache area, the longer does it take
    to search it. The cache “hit rate” increases but the cache “latency” also increases.
    For that reason cache memory is typically organized in a hierarchy where the different
    levels are referred to as “L1”, “L2”, “L3” and so on. L1 holds the most frequently
    used information, L2 holds the second most used information and so on.'
