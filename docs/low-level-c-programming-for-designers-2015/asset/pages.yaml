- img_proc: true
  md: 'embedded computers’ performance parameters, in terms of MHz, Gbytes, MFLOPS
    or Gbits/s or whatever you choose to characterize the system, by typically very
    “poor” compared to general-purpose computers. Embedded computers are optimized
    on cost and power performance. Since you don’t need a 5 GHz triple Intel processor
    and a 5 Tbyte drive to run a laundry machine it would be quite a waste (in terms
    of money and power) to use a general purpose computer to run a laundry machine.


    But of course, they are both computers and operate after the same fundamental
