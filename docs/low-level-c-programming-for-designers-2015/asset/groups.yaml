    ## 3.4.4 理论 PIO（并行输入/输出）


    在案例 1C 中，使用了两个 PIO 作为总线与芯片上数字引脚之间简单输入输出外设备的示例，参见图 3.34。


    ![](img/6e66f097437b5220f7019a5d1c02a038_60_1.png)


    图 3.34：中间是简易 PIO，左侧是 CPU 总线，右侧是 FPGA 总线


    CPU 总线通过 PIO 中的 32 位数据寄存器进行通信。这些 32 位寄存器是内存映射的，这意味着它们对一组寄存器具有唯一的总线地址。图 3.35 展示了
    PIO 的寄存器和地址。地址计算为 PIO 内存映射基地址之和。基地址信息可以在 `system.h` 头文件中找到。


    第一个 PIO 寄存器是“data”，偏移量为 0，见下一个图。数据寄存器有两种模式：仅输出模式和仅输入模式。写入数据寄存器会将数据存储在驱动输出端口的寄存器中（这在
    Qsys 中配置）。从数据寄存器读取则返回输入端口存在的数据（这也在 Qsys 中配置）。


