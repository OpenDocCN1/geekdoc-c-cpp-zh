    control block and the sample storage block. The user cannot immediately access
    the control block. It can only be accessed indirectly via the sequencer. Both
    the sequencer and the'
  - '[PAGE 153]


    sample storage block are memory mapped slaves of the Avalon. Figures 8.4 and 8.5
    are examples of how the sequencer has been mapped to address 0x1009230 (figure
    8.4) and the sample storage area is mapped to address 0x1009000.


    ```

    #define ALT_MODULAR_CLASS_modular_adc_sequencer_alter_modular_adc

    #define MODULAR_ADC_SEQUENCER_CSR_BASE 0x1009230

    #define MODULAR_ADC_SEQUENCER_CSR_CORE_VARIANT 0

    #define MODULAR_ADC_SEQUENCER_CSR_CSD_LENGTH 3

    #define MODULAR_ADC_SEQUENCER_CSR_CSD_FIFO_AT 0

    ```


    Figure 8.4: The sequencer is memory-mapped


    ```

    #define ALT_MODULAR_CLASS_modular_adc_sample_store_csr_alter_modular_adc

    #define MODULAR_ADC_SAMPLE_STORE_CSR_BASE 0x1009000

    #define MODULAR_ADC_SAMPLE_STORE_CSR_CORE_VARIANT 0

    #define MODULAR_ADC_SAMPLE_STORE_CSR_CSD_LENGTH 3

    ```


    Figure 8.5: The sample storage area is memory-mapped


    At the sequencer''s address there is just one available register; the command
    register. It is a 32-bit register and you only need to know two things about the
    command register:


    +   - Setting bit 0, triggers a sampling sequence.

    - Clearing bit 1 sets the ADC in “continuous” mode.


    “Continuous” mode means that once a sequence has been completed, it automatically
    starts a new one. Setting bit 1 sets the ADC in single-cycle mode and then it
    stops after one sequence.


    In the sample storage area, all the samples are stored in the order determined
    by the sequence setup. The first sample is retrieved by IORD HAL macro with offset
    0, the second sample with an offset 1.


    So, once the hardware is setup in Qsys, all we need to do in the C software is
    to write IOWR_32DIRECT(MODULAR_ADC_SEQUENCER_CSR_BASE,0x0x); // bit 1=0, bit 0=1

    to configure the ADC to run in continuous mode and then use IORD_32DIRECT(MODULAR_ADC_SAMPLE_STORE_CSR_BASE,0);
    //offset=0 => first sample to retrieve the sample value from the first channel
    in the sequence order.


    # 8.2.4 LDR – Light–Dependent Resistor


    On the Bmicro board there is an LDR sensor. This is a Ligh-Dependent Resistor
    whose resistance increases with the light intensity; the resistance is low when
    it is illuminated and the resistance is high when it is dark [photo].'
- md: "\nThe LDR and the 1k resistor is a voltage divider and when it is dark (LDR\
    \ high) the voltage drops on channel 4 and when it is bright (LDR low) the voltage\
    \ increases on channel 4; we expect the sample values on channel 4 to increase\
    \ with the light intensity.\n\n## 8.3 CASE 6 – Analog signals\n\n### 8.3.1 CASE\
    \ 6 – Specifications\n\nIn CASE 6, ADC channel 4 will be sampled and the eight\
    \ most significant bits of the 12-bit samples will be displayed on the eight LEDs\
    \ on the BeMicro board. Both the 12-bit sample and the 8-bit downshifted samples\
    \ will be displayed in the Nios II Console window.\n\nThe effect of this is that\
    \ the binary value represented by the eight LEDs on the BeMicro board will increase\
    \ as the light intensity on the LDR increases.\n\n### 8.3.2 CASE 6 – Hardware\n\
    \nThe hardware used in CASE 6 is illustrated in figure 8.8.\n\n![](img/6e66f097437b5220f7019a5d1c02a038_155_0.png)\n\
    \nIn figure 8.8 we notice first all of the ADC IP block and the LDR, but also\
    \ the fact that there is a second PLL. The second PLL is necessary because the\
    \ ADC requires a separate 10 MHz clock to drive the SAR AD conversion.\n\n###\
    \ 8.3.3 CASE 6 – Implementation\n\nFollow these steps:\n\n- 1. Create a new project\
    \ folder and name it CASE_6.\n- 2. Download the hardware files from our web page:\n\
    www.lowlevelprogramming.agstu.com/BeMicro_MAX_10/HW_CASE_6.zip\n- 3. Unzip the\
    \ files in the project folder. It should look as in figure 8.9.\n\n![](img/6e66f097437b5220f7019a5d1c02a038_156_0.png)\n\
    **Figure 8.9: Project folder for CASE 6**\n\n- 4. Create a new Nios II project\
    \ named CASE_6 based on the .sopcinfo file in figure 8.9 and the Hello_world template.\
    \ Open the BSP editor and uncheck “Support for C++” option and check the “Use\
    \ reduced device drivers” and the “Use small C library” options.\n- 5. Open the\
    \ Nios II Programmer and download the hardware (.sof) to the FPGA.\n- 6. Open\
    \ the hello_world.c source file and enter the following code:\n\n```c\n#include\
    \ <stdio.h>\n#include <io.h>\n#include <system.h>\nint main() {\n    unsigned\
    \ int i,adc_data;\n    unsigned char led_data;\n    IOWR_32DIRECT(MODULAR_ADC_SEQUENCER_CSR_BASE,0,0x1);\
    \ //start continuous sampling\n    while(1) {\n        adc_data=IORD_32DIRECT(MODULAR_ADC_SAMPLE_STORE_CSR_BASE,0);\
    \ //read 12-bit sample\n        printf(\"adc_data = %d\\n\",adc_data); //print\
    \ 12-bit sample\n        adc_data=adc_data>>4; //create 8-bit sample\n       \
    \ led_data=adc_data; //type conversion\n        printf(\"led_data = %d\\n\",led_data);\
    \ //print 8-bit sample\n        IOWR_8DIRECT(PIO_OUT_LEDS_BASE,0,255-led_data);\
    \ //update LEDs\n        for(i=0;i<100000;i++); //delay\n    }\n    return 0;\n\
    }\n```\n\nNotice how the 8-bit sample is created by downshifting the 12-bit sample\
    \ by four steps. This is effectively an integer division by 16.\n\n- 7. Build\
    \ and download the program. Observe the LEDs on the BeMicro board as you cover\
    \ the LDR with your finger. In the Nios II console window you should see something\
    \ like 8.10.\n\n![](img/6e66f097437b5220f7019a5d1c02a038_157_0.png)\n**Figure\
    \ 8.10: Console window**\n\nNotice in figure 8.10 that the sample values increase\
    \ when the LDR is illuminated and that the 8-bit samples are 1/16 of the 12-bit\
    \ samples.\n\n![](img/6e66f097437b5220f7019a5d1c02a038_157_1.png)\n**Figure 8.11:\
    \ Congratulations! You can now handle the ADC and analog signals.**\n\n## 8.4\
    \ Discussion\n\nAny embedded system that interfaces to the “real” world has to\
    \ deal with analog signals. Sensors do most of the job and sensors generate output\
    \ signals proportional to some physical quantity like temperature or, as in this\
    \ case, light intensity. This case has demonstrated how the integrated ADC of\
    \ an FPGA can be used to handle analog voltage signals from a sensor sensitive\
    \ to light. Other sensors communicate with the host processor via some digital\
    \ interface, but that requires a more expensive sensor and some extra software\
    \ for the serial communication protocol.\n\nIn this case we handled the ADC with\
    \ “brute force”; we used the common macros IORD_ and IOWR_ to configure the ADC\
    \ and read the samples. There is a special API for the ADC and you access it by\
    \ including the header file modular_adc.h.\n\n## 8.5 References\n\n- Nyquist theorem:\
