    电压 $A_{in}$ 的分辨率为 $\Delta U$，输出整数是该除法结果四舍五入到最近的整数的商。这一切都在硬件中完成。三种 ADC 技术之间的区别在于这种“除法+舍舍入”在硬件中是如何实现的。


    **示例 2：** 如果示例 1 中的 ADC 输入电压 $A_{in} = 1.3640$ 伏，则输出上的整数为：


    $$\frac{A_{in}}{\Delta U} = \frac{1.3640}{2.5} \times 2^{12} = 2235$$


    嵌入式计算机只能看到整数 $D_{out}$，为了将其转换回电压，嵌入式计算机必须将整数乘以 $\Delta U$。在这种情况下我们得到：


    $$U_{in} = 2235 \times \Delta U = 2235 \times \frac{2.5 \text{ volt}}{2^{12}}
    = 1.3641 \text{ volt}$$


    注意上面的示例，电压 $U_{in}$ (1.3641 伏) 与实际输入电压 $A_{in}$ (1.3640 伏) 之间存在微差异。这种差异被称为量化误差或量化不确定性，由于输出整数经过舍入。这是任何
    ADC 的固有属性，量化不确定性始终为 $\pm\frac{1}{2}\Delta U$；嵌入式计算机计算的电压 $U_{in}$ 只是输入 $A_{in}$
    的估计。真实的输入电压可以在范围 $U_{in} \pm \frac{1}{2}\Delta U$ 内任何位置：


    $$U_{in} - \frac{1}{2}\Delta U \leq A_{in} \leq U_{in} + \frac{1}{2}\Delta U \quadquad
    (8.2)$$


    你应该将 $\Delta U$ 理解为“输入电压的最小变化将输出整数恰好改变 1 个单位”。


    你还需要熟悉一些常见的 ADC 术语。首先，输出上的 12 位整数被称为样本（sample），运行中的 ADC 仅仅是在进行采样。每时间单位采集的样本数是采样率（采样/秒
    = S/s）。典型的 SAR ADC 最大采样率 > 1 MS/s（Mega = 百万）。


    > **注释：** 你可能听过采样定理。这一自然法则规定，频率为 $f$ 的 ADC 信号的采样率必须大于 $2\times f$。违反这一规则将导致混叠
    [quist]。


    （混叠就是你在电视上看到直升机旋翼在向后旋转时看到的现象；视频录制机的帧/秒远慢于旋翼的旋转速度。）


    ## 8.2.2 逐次逼近


    在 SAR ADC 中，$A_{in}/\Delta U$ 的除法是通过一系列连续比较来实现。输入电压 $A_{in}$ 与 $\Delta U$ 的倍数进行比较，以找到整数
    $m$，使得 $m \times \Delta U$ 尽可能接近 $A_{in}$。这在原理上非常简单；只需从 0 开始不断增加 $m$，直到 $m \times
    \Delta U \geq A_{in}$ 即可。然而，这将非常耗时；平均需要 $2^n/2=2^{n-1}$ 次比较，对于 12 位 ADC 来说将将是
    2048 次比较。逐次逼近法寻找 $A_{in}$ 的巧妙之处在于使用了一种更快速找到 $m$ 值的算法。


    在逐次逼近中，$A_{in}$ 首先与 $U_{ref}/2$ 比较。如果 $A_{in} > U_{ref}/2$，则 $D_{out}$ 的最高有效位（MSB）为
    1 ($D_{out} = 1....$)，接下来 $A_{in}$ 与 $3 \times U_{ref}/4$ 比较。如果 $A_{in} < U_{ref}/2$，则清零
    $D_{out}$ 的最高有效位 ($D_{out} = 0....$)，接下来 $A_{in}$ 与 $U_{ref}/4$ 比较。


    假设 $A_{in} > U_{ref}/2$，因此 $D_{out} = 1.$。在下次比较中，如果 $A_{in} > 3 \times U_{ref}/4$，则设置第二个最高有效位
    ($D_{out} = 11....$)，否则将其清零 ($D_{out} = 10....$)。


    假设 $A_{in} < 3 \times U_{ref}/4$，因此 $D_{out} = 10.....$。在下次比较中，$A_{in}$ 将与 $5
    \times U_{ref}/8$ 比较，这将决定第三个最高有效位的值。这种比较算法对于 $n$ 位 ADC 需 $n$ 次比较即可找到 $m$ 值（12
    位 ADC 仅需 12 次比较）。这在 8.2 中通过 4 位 SAR ADC 进行了说明。


    ![](img/6e66f097437b5220f7019a5d1c02a038_151_0.png)


    图 8.2：4 位 SAR ADC 中的比较算法


    因此，$n$ 位 SAR ADC 的一次 AD 转换需要 $n$ 个时钟周期。这显然比闪存 ADC（一个时钟周期）慢，但比积分型 ADC（依赖电容充放电）快得多。


    ## 8.2.3 MAX 10 的 ADC


    MAX 10 FPGA 上的 ADC 是 12 位 SAR ADC。参考电压可以是 2.5 伏，也可以使用 FPGA 内部电源电压（3.0 – 3.3 伏）。在
    CASE 6 中使用了外部 2.5 伏。图 8.3 展示了 ADC IP 核 [altera-


    ![](img/6e66f097437b5220f7019a5d1c02a038_152_0.png)


    图 8.3：MAX 10 中的 ADC 模块


    ADC 有多个输入但只有一个 ADC；使用多路复用器来控制 ADC 的输入信号。FPGA 有一个“专用模拟”输入引脚，这意味着它不能作为数字（仅限模拟）。它还有
    16 个双功能引脚；可以是模拟也可以是数字。


    ADC IP 核集成了一个温度传感器，也可以连接到 ADC。


    > **作者注释：** 内部温度传感器并不 Practical；由于它集成在 FPGA 内部，它只测量 FPGA 芯片内部的工作温度。如果你想做这一点，那很好，但你可能想测量远程温度。BeMicro
    板上还有另一个位于 FPGA 外部的温度传感器，但它具有数字接口。


    注意！在 BeMicro 板上，仅使用了通道 1, 2, 3, 4, 9, 11 和 12（当然还有温度传感器输入）。


    为了理解 ADC 如何工作，你需要理解**序列发生器（sequencer）**。样本按**顺序（sequence）**采集。当在 Qsys 中设置 ADC
    时，会确定一个转换序列。序列可以是任何长度（1 到 64），特定通道可能会出现多次。假设嵌入式设计使用通道 1, 2, 9 和 12，且序列长度设置为 6，序列如下：


    1, 2, 1, 9, 1, 12


    ADC 将按顺序存储通道，将每个样本存储在内存中，当采集完所有六个样本后，将发出“完成（done）”信号。

