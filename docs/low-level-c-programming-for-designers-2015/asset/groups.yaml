    A memory map is a layout of the address space of different peripheral parts such
    as I/O registers, data and instruction memory entry. Figure 3.33 illustrates how
    a memory map can be defined for a simple system. Microcomputer systems have a
    memory map.


    The address bus contains the address and the data bus will read or write data
    to this specific address. The data bus also contains a control bus that decides
    if it will be a read or a write cycle. This is a simplified explanation and we
    discuss this in more detail later in this book.


