    ```\n\n```\n# This driver supports\n```\n```\nadd_sw_property supported_bsp_type\
    \ HAL\n```\n\n```\n# End of file\n```\n\nBasically what we do above, is that we\
    \ instruct the Nios II SBT to include the altera_avalon_timer_regs.h in the BSP\
    \ and place it under the correct name. (Save as “plain text”).\n\n## 5.7 CASE\
