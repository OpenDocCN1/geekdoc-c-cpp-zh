    Let''s take another example. The C code line $sum = sum+1$; translates into three
    assembler lines:


    ```

    ldw r2,24                //loads register 2 with the value in address (fp + 24)
    (= sum variable''s location)

    addi r2,r2,1         //adds one to register 2

    stw r2,24(fp)         //stores register 2 back in memory address (fp + 24)

    ```


    We have an $ldw$ instruction, an $addi$, which which according to table 6.27 takes
    $6 + 6 + 6 = 18$ clock cycles (plus Avalon bus delay). 18 clock cycles takes


    $T=18\times\frac{1}{50}\mu s = 360\text{ ns}$

    he "Avalon bus delay" will depend on where the memory is located; in internal
