    ## 3.3.3 Using a debugger (CASE 1B)


    On a basic level, when using a debugger it is all about inserting breakpoints
    into the code to stop the execution and then examine certain variables or registers
    in the CPU. Breakpoints are added by simply double clicking on the bar on the
    left side of the program window, and removed with the same maneuver.


    ![](img/6e66f097437b5220f7019a5d1c02a038_48_0.png)


    ## Advanced theory about breakpoints (you can go back to this later)


    Below is an example. An imagined breakpoint is inserted on the first line inside
    the while loop.


    ```

    while(1)

    {

    i++;

    if(i%100==0)

    {

    print("T8\n\r");

    ...

    }

    ...

    }

    ```


    The assembler code for the marked code line probably looks like this:


    ```

    0x00100080    ADD R3,R3,1    /* Increase R3 with 1 */

    ```


    When the application runs normally the line will be executed just as intended,
    but if you have inserted a breakpoint, the ADD instruction will instead be replaced
    by an instruction that causes a software interrupt to the CPU.


    | Address in memory | Instruction |

    | :--- | :--- |

    | 0x00100080 | Invalid Instruction /* Non-executable instruction */ |


    The instruction which the debugger has removed is now located in a table where
    all the removed instructions are saved, as illustrated in Figure 3.24.


    When the CPU executes the line with the invalid instruction a software interrupt
    is generated and the CPU jumps to a predetermined address dedicated for this kind
    of events. In the interrupt service routine (ISR) the cause of the interruption
    is probed and, if, in this case, an invalid instruction was placed there by the
    debugger, the CPU will branch to the debugger code and execute it.


    | Break points | Address | ASM Instruction |

    | :--- | :--- | :--- |

    | 1 | 0x00100080 | ADD R3,R3,1 |


    Figure 3.24: Saved instructions


    One thing to take into consideration when it comes to breakpoints is that they
    are impossible to insert in code that is located in ROM memories, since it is
    not possible to exchange instructions in this type of memory.


    ## Most important errors that may be advisable to keep in mind when writing code


    **Index error** is a frequently occurring error where an upper and a lower boundary
    is used in order to, for example, in a vector. With the declaration int array[10]
    a vector consisting of 10 positions is defined. A common mistake is missing either
    the first position [0] or the last position [9] when incrementing or decrementing
    the index of a vector variable. The consequence is to run the risk of writing/reading
    outside the reserved index area 0-9, which results in destroying data or code
    outside the vector range.


    **Pointer error** is also a commonly occurring error, especially in languages
    like C. This is also a question of violating the address boundary. if, for example,
    a memory area has been allocated, there should be tests that limit the pointer
    to this specific memory area, otherwise data or may unintentionally be overwritten.


    **Memory error** has to do with the pointer error. What usually goes wrong is
    that too little memory is allocated and the pointer, which probably has no limits,
    indexed outside the memory.


    **Condition error** in loops and *if-then* statements may lead to the code choosing
    the wrong path. Infinite loops may occur if the conditions are not stated. It
    is essential to be very careful when the conditions are in order to get both the
    upper and lower boundaries. It is important to be very careful when writing the
    code and probe the conditions for *if-then* statements carefully.


    **Initiation errors** occur when certain variables have not been properly initiated
    and may cause peculiar behaviors, a variable that is expected to have a certain
    value has not been correctly initiated. Caution is in order not to commit these
    errors. A classic example of an initiation error is a *while* loop with a variable,
    i, which is incremented in each iteration (i++). If you forget to initiate before
    the loop starts, its value may be anything. If the condition for breaking the
    loop is, for example, i==10, this condition may be impossible to meet if i>10
    the loop starts.


    **Input data error** means that the input data to a function are corrupt. It is
    important to verify that the input data are located within the framework that
    it is supposed to handle. If there is no testing of input data, output data may
    be produced when the input data is corrupt. It is easy to conclude that there
    is something wrong with the function itself, when it is actually the input data
    that has been corrupted.


    **Logic error** is a type of error that can be very difficult to unwrap. This
    type of error is actually caused by the fact that the designer has intended a
    particular functionality, but the result of the code does something else. The
    code is probably entirely correct, but it does not as the designer intended.


    **Writing error** is an error that is still syntactically correct. A classic error,
    when programming in C, is that in an *if-then* statement the designer forgets
    an equality sign in a comparison statement, example if (a=3).... when meaning
    if (a==3)..... The result of the example will be that the *if-then* statement
    is always TRUE, the condition a=3 is always TRUE (because it is an assignment
    and not a comparison).


    Writing bug-free code is not so easy! It takes careful, patience and experience.


    ## 3.3.4 Design CASE 1B: Software debugging


    The debugger in nios is GDB (Gnu Debugger), which was written in 1986 by Richard
    Stallman. It gives an "inside" look at what is going on while the program is:

    * Starts the program

    * Stops on conditions

    * When stopped registers, variables etc. can be displayed


    Do the following:

    1) If you have turned off the power to the FPGA you have to download the hardware,
    see figure 25.

    2) Use the same workspace.

    3) Start the debug session, right-click on the project and select Debug. The debugger
    will start and a connection will be established. The program will stop at the
    first executable line.

    4) Switch from C/C++ perspective to Debug perspective by clicking the buttons
    at top right (if the question "switch to debug perspective" comes up, select "Yes").
    It is always possible to switch different perspectives.

    5) Set a breakpoint at an optional code line. This is achieved by double-clicking
    on the gray bar to the left of the code. The breakpoint is indicated in the grey
    column by a symbol. Press the resume button. This should make the program execute
    and stop at the breakpoint.

    6) Use the step buttons to step through the code, see figure 29.

    7) Use Window >> Show View to see a window for assembler, register and memory
    contents, (see figure 30). The window shows variables, CPU registers, and disassembly.


    Make sure you learn how to use this tool! It will be a tremendous help when your
    software does not do what you expect it to do.


    If you have any problems running the debug tool, the reason might be that the
    anti-virus program on your PC is denying the necessary access. If that is the
    case, allow access to the "nios2-gdb-server", see figure 31.

    '
