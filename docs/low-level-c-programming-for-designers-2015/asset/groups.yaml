    | | 写入访问 | W | 输出到 PIO 的新值 | | | |

    | 1 | direction (I) | R/W | PIO 输入上的当前新值。值为 0 时方向设为 1，1 时设为输出。 | | | RAM (16K
    地址) |

    | 2 | interrupt (I) | R/W | 将某位置 1 可启用相应端口的中断。 | | | Reg_TAG (7 地址) |

    | 3 | status (I) | R/W | 指定输出的哪个位被设置。 | | | Reg_PIO (16 地址) |

    | 4 | outclear | W | 指定要清除输出的哪个位。 | | | Reg_sysid |


