    ## 2.1 硬件平台


    ### 2.1.1 Arrow 的 BeMicro MAX 10 板卡


    图 2.1 显示了该板卡并标注了一些硬件部分。板卡尺寸仅为 50x85 mm。


    该 FPGA 是来自 Altera 的 MAX 10，带有内置非易失性闪存、内置 AD 转换器和温度传感器。它具有锁相环（PLL）、硬件乘法器，并能够托管软核
    Nios II CPU。它还具有许多我们将在以后介绍的传感器。


    ![](img/6e66f097437b5220f7019a5d1c02a038_24_0.png)


    图 2.1：BeMicro MAX 10 板卡


    该板通过用于编程 FPGA 的相同 USB 供电，因此不需要外部电源，但如有必要，它有一个 2.5 mm 接口用于连接外部 +5 V 电源。FPGA 本身拥有
    8000 个 LE（逻辑单元）、51M9K 内存块、24x18 乘法器、两个 PLL、250 kbyte 的闪存内存和 250 个通用 IO 引脚。图 2.2
    展示了 FPGA 和板卡上 IO 单元的原理图。


    ![](img/6e66f097437b5220f7019a5d1c02a038_24_1.png)


    图 2.2：BeMicro MAX 10 板卡概述


    我们在介绍不同案例时将学习该硬件的细节，但目前我们只注释时钟和最简单的 I/O（LED 和按钮）。


    ### 2.1.2 系统时钟


    MAX 10 FPGA 当然支持 Altera 的软核 CPU、Nios II 处理器，这是我们设计设计的处理器。所有的设计都是可用的，你不需要深入理解以下信息，我们在这里包含它以便你对系统有更详细的了解。如图
    2.2 所示，板卡上有一个 50 MHz 时钟，并连接到 FPGA。FPGA 还有几个 PLL，我们将其用于创建设计运行所需的时钟。只要我们不使用外部 SDRAM
    内存或内部 AD 转换器，我们只需要一个时钟（CPU），并将直接使用 50 MHz 时钟。


    然而，当我们想要向设计中添加外部内存时，我们将让 DDR 控制器处理 SDRAM。DDR 代表“双数据速率”，并将对 SDRAM 的读写过程提高 2 倍。这是可能的，因为
    DDR 控制器可以在时钟信号的正、负沿上工作。这需要与系统时钟有 -90° 的相位。为了提高速度，我们将使用 PLL 将时钟频率到 80 MHz。


    此外，内置 ADC 需要 10 MHz 时钟，因此当我们开始使用 ADC 时，我们将调用第二个 PLL 为 ADC 获取 10 MHz 时钟。图 2.3 展示了我们用于高级设计的时钟系统。


    ![](img/6e66f097437b5220f7019a5d1c02a038_25_0.png)


    图 2.3：高级设计的时钟系统


    40 MHz 时钟可以用于某些“慢”IO 单元。


    ### 2.1.3 LED 和按钮


    在我们第一个案例中，我们的设计不会使用任何 LED，但嵌入式系统本身需要一个复位按钮。我们将 BeMicro 板卡上的 SW4 开关用于此目的，为了使用它，我们需要了解板卡上的按钮，同时我们也描述
    LED。


    首先，需要知道硬件分配到 FPGA 的哪些引脚。见表 2.1。


    #### 表 2.1 FPGA 引脚分配：LED 和按钮


    | 板载标签 | 信号名称 | FPGA 引脚名 |

    |---|---|---|

    | D1 | USER_LED[1] | M2 |

    | D2 | USER_LED[2] | N1 |

    | D3 | USER_LED[3] | R2 |

    | D4 | USER_LED[4] | T1 |

    | D5 | USER_LED[5] | V4 |

    | D6 | USER_LED[6] | T6 |

    | D7 | USER_LED[7] | AB4 |

    | D8 | USER_LED[8] | AA5 |

    | SW1 | PB[1] | M1 |

    | SW2 | PB[2] | R1 |

    | SW3 | PB[3] | V5 |

    | SW4 | PB[4] | AB5 |

    | 50 MHz clock | SYS_CLK | N14 |


    “信号名称”是由 Arrow 提出的；你可以给它们起任何名字。注意表 2.1，我们还包含了板载 50 MHz 时钟的引脚分配。


    每个按钮的接线方式如图 2.4 所示。


    ![](img/6e66f097437b5220f7019a5d1c02a038_26_0.png)


    图 2.4：按钮电路


    图 2.4 中的电路有两个后果。首先，RC 网络形成去抖电路（按钮在硬件层进行去抖），其次，当按下按钮时，PBx 信号变为低电平。


    因此，如果我们使用 SW4 复位系统，并且希望在按下 SW4 时复位，那么它必须在低电平下复位。


    图 2.5 展示了 LED 电路。


    ![](img/6e66f097437b5220f7019a5d1c02a038_27_0.png)


    图 2.5：LED 硬件


    图 2.5 的结果是当信号 USER_LEDx 设置为低电平时，LED Dx 开启。


    ## 3 案例1


    ## 3.1 理论 – 硬件架构 - 案例1A


    本案例使用的简单计算机系统由四个主要部分组成：处理数据的 CPU、存储待处理数据的主内存、各种外设以及不同部分之间的通信“总线”，见图 3.1。


    ![](img/6e66f097437b5220f7019a5d1c02a038_29_0.png)


    图 3.1：案例1A 微控制器架构


    “案例1A”硬件架构的组件（有时称为“IP 组件”）是：


    - CPU：Nios II（中央处理器，处理数据）

    - 总线：Avalon 总线（“组件”之间的通信）

    - RAM：内部 FPGA RAM 块（存储数据和程序）

    - UART：Nios II JTAG UART（通过 printf 和扫描与文本通信的 I/O 外设）


    ### 3.1.1 CPU Nios II


    CPU（中央处理器）和处理器之间没有区别。至少对于市场上的现代计算机而言是如此。在书中，“CPU”和“处理器”是同义词。


    （更多信息见：http://www.ehow.com/about_6402155_difference-between-cpu-processor_.html）


    大多数 CPU 的基本操作是执行存储在内存中的“软件程序”。CPU 使用四个步骤来操作指令：取指、解码、执行和写回。对于 Nios II 处理器，指令长 32
    位，被称为“机器码”。


    - 1) 第一步从内存中提取指令。

    - 2) 解码步骤确定 CPU 应该做什么。

    - 3) 执行步骤使用 CPU 中的不同组件执行操作。CPU 中有不同子组件，如算术逻辑单元（ALU）、寄存器等。

    - 4) 写回步骤在需要时写入结果（有时不需要）。

    - 5) 返回第一步（循环）。


    如图 3.2 所示通用 RISC（精简指令集）处理器核心，采用哈佛架构，稍后将详细介绍。“RISC 处理器”表明它有一组处理器可以执行的最小指令集。指令数量很少，但保证（跳转指令外）可以在单个时钟周期内执行。与之竞争的“CISC”（复杂指令集）处理器拥有多得多的且更复杂的指令，但它们通常无法在一个时钟周期内执行。


    处理器连接到一个产生高频时钟信号的振荡器。该时钟物理连接到 CPU 并同步所有事件。在优化的 CPU 中，每个时钟周期执行一条指令。PC 的频率通常在 GHz
    级，但在许多嵌入式系统中频率较低以降低功耗。频率越快，CPU 每秒执行的指令（机器码）越多。因此，如果我们的 CPU 频率为 40 MHz，它每秒将执行 4000
    万条指令；在 1 GHz 下，它每秒将执行 10  亿条指令。


    ![](img/6e66f097437b5220f7019a5d1c02a038_30_0.png)


    图 3.2：Nios II 处理器核心及关键组件概述


    处理器由不同的组件组成，例如：


    - 32 个通用寄存器，速度极快且能够存储少量信息（32 位）。

    - 中断控制器，用于处理处理器外部的异步事件，更多


