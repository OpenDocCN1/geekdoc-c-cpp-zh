    此外，计算机性能并不一定随着可用缓存内存的大小线性提高。缓存区域越大，搜索所需的时间就越长。缓存“命中率”会增加，但缓存“延迟”也会随之增加。因此，缓存内存通常组织成分级结构，不同层次被称为“L1”、“L2”、“L3”等。L1
    存储最频繁使用的信息，L2 存储次之频繁的信息，以此类推。


