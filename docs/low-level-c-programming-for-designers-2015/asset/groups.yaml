    \ for freeing each node has been eliminated. */\nvoid freelist(struct node_s *next)\
    \ {\n  struct node_s *next;\n  next = node->next;\n  loop:\n  free(node);\n  if\
    \ (next != NULL) {\n    node = next;\n    goto loop;\n  }\n  return;\n}\n```\n\
    \ngcc（带有 `-inline` 选项）和其他一些编译器能够在高优化级别下内联小函数。如有必要，可以将 C 函数编码为宏，以便在没有内联的编译器上获得类似的速度。这是因为大多数调试器无法步进宏。\n\
    \n## 表 27: 内联\n\n# 之前\n\n```c\nint foo(a,b) {\n  a = a - b;\n  b++;\n  a = a *\
    \ b;\n  return a;\n}\n```\n\n# 之后\n\n```c\n#define foo(a,b) (((a)-(b))\n```\n\n\
    ## 6.3.4 分支\n\n### 将公共代码移出分支路径\n\n对于采取不同路径的语句（if-else、case），请确保将公共代码移到分支路径之外。分支路径越短，处理器花费在预测执行的时间就越少，参见表\
    \ 18。\n\n## 表 28: 将公共代码移出分支路径\n\n# 之前\n\n```c\nint a (int data) {\n  int key;\n\
    \  if (data < 100) {\n    data = data + 100;\n    key = c (data);\n  } else {\n\
