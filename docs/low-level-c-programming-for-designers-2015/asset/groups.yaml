    - 3. Unzip the file into CASE_5 folder.\n- 4. Open hello_world.c file and enter\
    \ the following code:\n\n![](img/6e66f097437b5220f7019a5d1c02a038_132.png)\n\n\
    Figure 7.3: Project folder\n\n```c\n********** Controlling LEDs with a push button\
    \ *\n#include <io.h>\n#include <system.h>\n#include <stdio.h>\n#include <altera_timer_regs.h>\
    \ //driver for timer ip\n\nvoid delay_half_second(void); //delay function used\
