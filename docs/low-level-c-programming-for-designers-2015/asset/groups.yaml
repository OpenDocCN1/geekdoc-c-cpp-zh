    }\n```\n\n15. Program the FPGA with the .sof file.\n"
  mdcn: "\n\n## 6.6 总结\n\n我们已经演示了如何测量软件的执行时间，并证明了将代码放在片上 RAM 而非外部 RAM 中的效率；在本章所展示的案例中，执行时间增加了\
    \ 3 倍。\n\n当然，我们需要对在上述案例中获得的非凡结果进行说明；当我们将程序加载到片上 RAM 时，基准测试代码的执行时间为“10”，这甚至比 6.5\
