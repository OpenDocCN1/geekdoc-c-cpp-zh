    for (int x = 0; x < loops; x++) {\n  /* just some time */\n}\n```\n\n# 之后\n\n\
    ```c\nfor (int x=loops-1; x>=0; x--) {}\n```\n\n### 将未修改的表达式移出循环\n\n将循环内任何不变化的表达式移出循环，参见表\
    \ 20。这可以防止编译器在每次迭代时都重新计算该表达式 [C-opt]。\n\n## 表 30: 将未修改的表达式移出循环\n\n# 之前\n\n```c\n\
    int a (int data1, int data2) {\n  unsigned int x;\n  int temp = 100000;\n  for\
