  - '[PAGE 154]


    The LDR and the 1k resistor is a voltage divider and when it is dark (LDR high)
    the voltage drops on channel 4 and when it is bright (LDR low) the voltage increases
    on channel 4; we expect the sample values on channel 4 to increase with the light
    intensity.'
  - '[PAGE 155]


    # ## 8.3 CASE 6 – Analog signals


    # ### 8.3.1 CASE 6 – Specifications


    In CASE 6, ADC channel 4 will be sampled and the eight most significant bits of
    the 12-bit samples will be displayed on the eight LEDs on the BeMicro board. Both
    the 12-bit sample and the 8-bit downshifted samples will be displayed in the Nios
    II Console window.


    The effect of this is that the binary value represented by the eight LEDs on the
    BeMicro board will increase as the light intensity on the LDR increases.


    # ### 8.3.2 CASE 6 – Hardware


    The hardware used in CASE 6 is illustrated in figure 8.8.


    ![](img/6e66f097437b5220f7019a5d1c02a038_155_0.png)


    In figure 8.8 we notice first all of the ADC IP block and the LDR, but also the
    fact that there is a second PLL. The second PLL is necessary because the ADC requires
    a separate 10 MHz clock to drive the SAR AD conversion.


    # ### 8.3.3 CASE 6 – Implementation


    Follow these steps:


    +   1. Create a new project folder and name it CASE_6.


    +   2. Download the hardware files from our web page:


    www.lowlevelprogramming.agstu.com/BeMicro_MAX_10/HW_CASE_6.zip'
  - "[PAGE 156]\n\n3. Unzip the files in the project folder. It should look as in\
    \ figure 8.9.\n\n![](img/6e66f097437b5220f7019a5d1c02a038_156_0.png)\n\n**Figure\
    \ 8.9: Project folder for CASE 6\n\n4. Create a new Nios II project named CASE_6\
    \ based on the .sopcinfo file in figure 8.9 and the Hello_world template. Open\
    \ the BSP editor and uncheck “Support for C++” option and check the “Use reduced\
    \ device drivers” and the “Use small C library” options.\n\n5. Open the Nios II\
    \ Programmer and download the hardware (.sof) to the FPGA.\n\n6. Open the hello_world.c\
    \ source file and enter the following code:\n\n```\n#include <stdio.h>\n#include\
    \ <io.h>\n#include <system.h>\nint main() {\n    unsigned int i,adc_data;\n  \
    \  unsigned char led_data;\n    IOWR_32DIRECT(MODULAR_ADC_SEQUENCER_CSR_BASE,0,0x1);\
    \ //start continuous sampling\n    while(1) {\n        adc_data=IORD_32DIRECT(MODULAR_ADC_SAMPLE_STORE_CSR_BASE,0);\
    \ //read 12-bit sample\n        printf(\"adc_data = %d\\n\",adc_data); //print\
    \ 12-bit sample\n        adc_data=adc_data>>4; //create 8-bit sample\n       \
    \ led_data=adc_data; //type conversion\n        printf(\"led_data = %d\\n\",led_data);\
    \ //print 8-bit sample\n        IOWR_8DIRECT(PIO_OUT_LEDS_BASE,0,255-led_data);\
    \ //update LEDs\n        for(i=0;i<100000;i++); //delay\n    }\n    return 0;\n\
    }\n```\n\nNotice how the 8-bit sample is created by downshifting the 12-bit sample\
    \ by"
