    \ format and the number will be displayed in decimal format in the Nios console\
    \ window.\n\nThe code below illustrates the structure:\n\n```c\nwhile(1) {\n \
    \ // check input status\n  // update LEDs\n}\n```\n\n## 7.3 Hardware architecture\n\
    \n![](img/6e66f097437b5220f7019a5d1c02a038_131.png)\n\nFigure 7.2: Hardware architecture\n\
    \n## 7.4 Software 5A – Polling system\n\nFollow these steps:\n\n- 1. Create a\
