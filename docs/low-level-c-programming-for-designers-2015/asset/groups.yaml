    ## 5 案例 – 编写驱动程序


    ### 5.1 引言


    本章介绍了如何编写驱动程序以及创建完整驱动程序所需的文件（以及如何组织文件）。任务是根据数据手册中的规格为 32 位定时器设计驱动程序，硬件已经交付（你可以从我们的网页下载）。


    为了编写驱动程序，需要以下步骤：


    1. 规格；需要什么，驱动程序应该提供什么服务？

    2. 定义接口（硬件和软件之间）。

    3. 最后，编写驱动代码（并以他人可以使用的方式“封装”）。


    硬件和驱动程序是知识产权，即 IP 组件，像其他知识产权一样可以出售、交易或作为免费软件提供。如果你学会设计吸引人的 IP 组件，确实有利可赚。


    IP 组件可以如图 5.1 所示分为较小部分。


    ![](img/6e66f097437b5220f7019a5d1c02a038_85_0.png)


    图 5.1：IP 组件架构


    本章重点是驱动程序，如图 5.1 所示，驱动程序是硬件和软件之间的接口，我们需要设计它使其在启动新的 Nios II 项目时集成到板支持包中。


    驱动程序读写硬件中的寄存器，它们是内存映射的，即每个寄存器在内存中都有唯一的地址。通常，CPU 在数据空间中有数百万个唯一地址，而像我们的定时器 IP 等
    IP 组件的寄存器只占用几个（在本案例中实际上两个）。


    图 5.1 底部是硬件函数，通常用 VHDL 代码实现，在本案例中是一个简单的定时器。


    本章其余部分组织如下：在 5.2 节中定义驱动规格（驱动程序应该提供的服务），并在 5.3 节中讨论接口。在 5.4 节中我们“引入”HAL，在 5.5 节中我们编写并验证驱动程序。在
    5.6 节中我们将讨论如何将驱动程序集成到新项目的 BSP 中，并引入“tickle”文件的概念。在 5.7 节中，我们最后创建一个 tickle 文件并验证新的驱动程序正确加载到新项目的
    BSP 中。


    下面的案例 3A 展示了如何创建和验证驱动程序文件，案例 3B 展示了如何组织驱动程序文件（用于自定义交付）。


    ### 5.2 案例规格


    定时 IP 组件的驱动程序应具有以下服务：


    - Timer_start: 启动定时器

    - Timer_stop: 停止定时器

    - Timer_reset: 重置定时器

    - Timer_read: 读取定时器


    ### 5.3 定义接口


    下一步是指定驱动程序与硬件寄存器之间的接口。


    #### 5.3.1 驱动定义


    驱动软件将具有四个简单的函数：


    Timer_start


    | Description | Arguments | Returns |

    |---|---|---|

    | 启动定时器 | 无 | 无 |


    Timer_stop


    | Description | Arguments | Returns |

    |---|---|---|

    | 停止定时器 | 无 | 无 |


