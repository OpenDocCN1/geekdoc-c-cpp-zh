    ### Pass structures by reference\n\nWhenever possible, pass structures by reference\
    \ (i.e. pass a pointer to the structure), otherwise the whole structure will be\
    \ copied onto the stack, which will slow down the execution.\n\nFunctions receiving\
    \ pointers to structures as arguments should declare them as a pointer to a constant\
    \ if the function is not going to alter the contents of the structure, e.g.\n\n\
    ```\nvoid print_data(const bigstruct *data_pointer)\n{\n  ...printf contents of\
    \ structure...\n}\n```\n\nThis example informs the compiler that the function\
    \ does not alter the contents (pointer to constant structure) of the external\
    \ structure, and does not need to keep re-reading the contents every time they\
    \ are accessed. It also ensures the compiler will trap any accidental attempts\
    \ by the code to write to the read-only structure, see table 6.26 [Tutorial].\n\
    \n# Table 6.26: Pass structures by reference\n\n| Before | After |\n| --- | ---\
    \ |\n| typedef struct{ | typedef struct{ |\n| int a; | int a; |\n| int b; | int\
    \ b; |\n| int c; | int c; |\n| }struct_abc; | }struct_abc; |\n| int main(void){\
    \ | int main(void){ |\n| struct_abc z; | struct_abc z; |\n| z.a = 10; | x=&z;\
    \ |\n| z.a++; | struct_abc *x; |\n| print(z); | z.a = 10; |\n| return 0; | z.a++;\
    \ |\n| } | print(x); |\n| | return 0; |\n| void print(struct_abc z){ | void print(const\
    \ struct_abc *z){ |\n| printf(\"first member %d\\n\", z.a); | printf(\"first member\
    \ %d\\n\", z->a); |\n| } | } |\n\n## 6.4 Theory – Simple time measurement technique\n\
    \nIn CASE 4 (see next section) the Timer IP from the last CASE will be used to\
    \ measure the time performance of some C code. Before we do that, we will do some\
    \ theoretical predictions and then compare these theoretical calculations with\
    \ the actually measured times in CASE 4.\n\nTime will be measured in clock cycles\
    \ n and from n we get the time T in seconds from\n\n```\n$T=nx\\frac{1}{f}$ (6.1)\n\
    ```\n\nwhere $f$ is the system clock frequency.\n\nIn order to predict C code\
    \ execution time, we need to know how each C statement is translated into assembler\
    \ code and how many clock cycles each assembler instruction requires. In the Nios\
    \ IDE we easily get the assembler code if we switch to debugger mode and get the\
    \ execution time for each instruction from the Nios II Handbook [nios]. The execution\
    \ times for some of the most common assembler instructions are summarized in table\
    \ 6.27.\n\nFor example, the C code line value\\_a = 5; translates into the following\
    \ assembler lines by the compiler:\n\n```\nmovi r2,5  //writes 5 to register 2\n\
    stw r2,16(fp)  //stores 5 to memory address (fp+16) (fp is an address register)\n\
    ```\n\n| Table 6.27: Instruction execution performance for Nios II/Core |\n| Instruction\
    \ | Cycles |\n|---|--|\n| Normal ALU instructions (e.g., add, commit) | 6 |\n\
    | branch, jmp, ret, call, calir | 6 |\n| trap, break, eret, bret, flush, wrap,\
    \ rdctl, unaligned | 6 |\n| load | 6 + Duration of Avalon transfer |\n| load halfword\
    \ | 9 + Duration of Avalon transfer |\n| load byte | 10 + Duration of Avalon transfer\
    \ |\n| store | 6 + Duration of Avalon write transfer |\n| Shift, rotate | 7 to\
    \ 8 |\n| All other instructions | 6 |\n| Combinatorial custom instructions | 6\
    \ |\n| Multi-cycle custom instructions | >=6 |\n\nAccording to table 6.27, both\
    \ movi and stw consume six clock cycles (plus the Avalon delay), a total of 12\
    \ clock cycles. Assuming a system clock frequency of 50 MHz, this indicates that\
    \ executing value\\_a = 5; would take\n\n$T=12\\frac{1}{50}\\mu s = 240\\text{\
    \ ns}$\n\nLet's take another example. The C code line sum = sum+1; translates\
    \ into three assembler lines:\n\n```\nldw r2,24                //loads register\
    \ 2 with the value in address (fp + 24) (= sum's location)\naddi r2,r2,1     \
    \    //adds one to register 2\nstw r2,24(fp)         //stores register 2 back\
    \ in memory address (fp + 24)\n```\n\nWe have an ldw instruction, an addi, which\
    \ according to table 6.27 takes 6 + 6 + 6 = 18 clock cycles (plus Avalon delay).\
    \ 18 clock cycles takes $T=18\\frac{1}{50}\\mu s = 360\\text{ ns}$ the \"Avalon\
    \ bus delay\" will depend on where the memory is located; in internal (on-chip)\
    \ RAM or in external RAM.\n\n## 6.5 CASE 4 – Measuring C performance\n\nIn CASE\
    \ 4 we will measure the execution time of C code using the Timer IP developed\
    \ in the last chapter. The hardware is illustrated in figure 6.1. The goal is\
    \ to illustrate how execution time can be measured and to illustrate the difference\
    \ between storing program code on internal (on-chip) RAM versus externally stored\
    \ code. To be specific, we will answer the following question: How long does it\
    \ take to execute the C code value\\_a=5; when the program code is stored on-chip\
    \ RAM compared to when it is stored in external RAM?\n\nFollow these steps:\n\n\
    - 1. Create a new project folder and name it CASE_4. ![img/6e66f097437b5220f7019a5d1c02a038_122_0.png]\
    \ Figure 6.1: The hardware\n- 2. Download the hardware from our website: www.lowlevelprogramming.com/MAX_10/HW_CASE_4.zip.\
    \ Unzip the downloaded file into the CASE_4 folder. It should look as in figure\
    \ 6.2. ![img/6e66f097437b5220f7019a5d1c02a038_123_0.png] Figure 6.2: The project\
    \ folder\n- 3. Open the Nios II IDE and create a new Nios II Application and BSP\
    \ from template. It should be based on the .sopc file in figure 6.2 and the Hello\
    \ World template. Open the BSP editor and make sure you reduced device drivers,\
    \ small libraries and no support for C++.\n- 4. Edit the hello_world.c file and\
    \ enter the code below. This code will effectively measure the execution time\
