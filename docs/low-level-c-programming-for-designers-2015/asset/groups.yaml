  mdcn: "\nLDR 和 1k 电阻构成了一个分压器。当环境黑暗时（LDR 高电平），通道4 的电压下降；当环境明亮时（LDR 低电平），通道4 的电压增加；我们预计通道4\
    \ 采样值会随着光强的增加而增大。\n\n## 8.3 案例 6 – 模拟信号\n\n### 8.3.1 案例 6 – 规范\n\n在案例 6 中，将采样\
    \ ADC 通道 4，12 位样本的最高 8 位将显示在 BeMicro 板的 8 个 LED 上。12 位样本和 8 位移位样本将显示在 Nios II\
    \ 控制台窗口中。\n\n其效果是：BeMicro 板上 8 个 LED 所表示的二进制值将随着 LDR 上光强的增加而增大。\n\n### 8.3.2 案例\
    \ 6 – 硬件\n\n案例 6 使用的硬件如图 8.8 所示。\n\n![](img/6e66f097437b5220f7019a5d1c02a038_155_0.png)\n\
    \n在图 8.8 中，我们首先注意到所有的 ADC IP 模块和 LDR，还注意到存在第二个 PLL。第二个 PLL 是必要的，因为 ADC 需要一个独立的\
    \ 10 MHz 时钟来驱动 SAR AD 转换。\n\n### 8.3.3 案例 6 – 实现\n\n按照以下步骤操作：\n\n- 1. 创建一个新的项目文件夹并命名为\
    \ CASE_6。\n- 2. 从我们的网页下载硬件文件：\nwww.lowlevelprogramming.agstu.com/BeMicro_MAX_10/HW_CASE_6.zip\n\
    - 3. 在项目文件夹中解压文件。它看起来应该像图 8.9 所示。\n\n![](img/6e66f097437b5220f7019a5d1c02a038_156_0.png)\n\
    **图 8.9：案例 6 的项目文件夹**\n\n- 4. 根据图 8.9 中的 .sopcinfo 文件和 Hello_world 模板创建一个名为 CASE_6\
    \ 的新 Nios II 项目。打开 BSP 编辑器，取消勾选“Support for C++”选项，并勾选“Use reduced device drivers”和“Use\
    \ small C library”选项。\n- 5. 打开 Nios II Programmer 将硬件 (.sof) 下载到 FPGA。\n- 6. 打开\
    \ hello_world.c 源文件并输入以下代码：\n\n```c\n#include <stdio.h>\n#include <io.h>\n#include\
    \ <system.h>\nint main() {\n    unsigned int i,adc_data;\n    unsigned char led_data;\n\
    \    IOWR_32DIRECT(MODULAR_ADC_SEQUENCER_CSR_BASE,0,0x1); //开始连续采样\n    while(1)\
    \ {\n        adc_data=IORD_32DIRECT(MODULAR_ADC_SAMPLE_STORE_CSR_BASE,0); //读取\
    \ 12 位样本\n        printf(\"adc_data = %d\\n\",adc_data); //打印 12 位样本\n       \
    \ adc_data=adc_data>>4; //创建 8 位样本\n        led_data=adc_data; // 类型转换\n     \
    \   printf(\"led_data = %d\\n\",led_data); //打印 8 位样本\n        IOWR_8DIRECT(PIO_OUT_LEDS_BASE,0,255-led_data);\
    \ //更新 LED\n        for(i=0;i<100000;i++); // 延迟\n    }\n    return 0;\n}\n```\n\
    \n注意如何通过将 12 位样本右移四位来创建 8 位样本。这实际上等于整数除以 16。\n\n- 7. 编译并下载程序。当你用手指遮住 LDR 时，观察\
    \ BeMicro 板上的 LED。在 Nios II 控制台窗口中，你应该看到类似 8.10 的内容。\n\n![](img/6e66f097437b5220f7019a5d1c02a038_157_0.png)\n\
    **图 8.10：控制台窗口**\n\n注意图 8.10，当 LDR 被光照时采样值增加，且 8 位样本是 12 位样本的 1/16。\n\n![](img/6e66f097437b5220f7019a5d1c02a038_157_1.png)\n\
    **图 8.11：恭喜！你现在可以处理 ADC 和模拟信号了。**\n\n## 8.4 讨论\n\n任何与“真实”世界接口的嵌入式系统都处理模拟信号。传感器完成了大部分工作，产生的输出信号与某些物理量成比例，例如温度或本例中的光强。本案例演示了如何使用\
    \ FPGA 的集成 ADC 来处理来自光敏传感器的模拟电压信号。其他传感器通过某些数字接口与主机处理器通信，但这需要更贵的传感器以及用于串口通信协议的额外软件。\n\
    \n在本例中，我们通过“暴力”的方法处理 ADC；我们使用了常用的宏 `IORD_` 和 `IOWR_` 来配置 ADC 并读取样本。ADC 有一个专门的\
    \ API，你可以通过包含头文件 `modular_adc.h` 来访问它。\n\n## 8.5 参考文献\n\n- 奈奎特定：http://en.wikipedia.org/wiki/Nyquist_theorem\n\
