    In 5.5 we designed the device driver and validated it. So far good, but we are
    not ready to make a customer delivery yet! We don''t just deliver a set of .h
    and .c files; we also make sure that device drivers are automatically loaded into
    the BSP when a new project is initiated. When we prototyped it above, the header
    file was saved in the project folder (see figure 5.10) but what we would really
    like now, is that the device driver files are automatically loaded into the driverinc
    sub folder of the BSP (see figure 5.13) and this is where all the other driver
    files are stored and this is where our driver files belong.


    ![](img/6e66f097437b5220f7019a5d1c02a038_95_1.png)


    Figure 5.13: Our device driver (h file) should be loaded into the <BSP folder>drivers\inc


    (If the device driver has also used a .c source file, it should be loaded into
    the src folder.)


    So do we make the Nios II SBT automatically load the new device driver into the
    BSP sub folders? The answer is that when a new project is initiated, the Nios
    II SBT looks for "tickle" files. These tickle files contain information about
    what to load into the project and where to place it. Tickle files are written
    in "tickle script" and we will address this matter briefly here.


    The file we need is an _sw.tcl file. Tickle script is hard and we will handle
    this problem'
  - "[PAGE 96]\n\nas engineers often do; copy somebody else’s work and edit it to\
    \ fit you application. You don't really need to understand the details of tickle\
    \ scripts to create useful device drivers. After all, all we want is for our driver\
    \ to be loaded into the BSP. Here is a tickle script example that does exactly\
    \ that:\n\n```\n# Timer_sw.tcl\n```\n\n```\n# Create a new driver\n```\n\n```\n\
    create_driver timer_sw\n```\n\n```\n# Associate it with some hardware known as\
    \ “timer” (must match hardware name)\n```\n\n```\nset_sw_property hw_class_name_timer\n\
    ```\n\n```\n# The version of this driver\n```\n\n```\nset_sw_property version\
    \ 1\n```\n\n```\n# This driver may be incompatible with versions of hardware less\
    \ than specified below. Updates to hardware and\n device drivers rendering the\
    \ driver incompatible with older versions of hardware are noted with this property\n\
    \ assignment. Multiple-version compatibility was introduced in version 7.1; prior\
    \ versions are therefore excluded\n```\n\n```\nset_sw_property min_compatible_hw_versions\
    \ 1.0\n```\n\n```\n# Location in generated BSP that driver files will be copied\
    \ into\nset_sw_property bsp_subdirectory drivers\n```\n\n```\n#\n```\n\n```\n\
    # Source files listings...\n```\n\n```\n#\n```\n\n```\n# No .c files in this case\n\
    ```\n\n```\n#\n```\n\n```\n# Header files listing...\n```\n\n```\n#\n```\n\n```\n\
    add_sw_property include_source HAL/inc/altera_avalon_timer_regs\n```\n\n```\n\
    # This driver supports HAL type\n```\n\n```\nadd_sw_property supported_bsp_type\
    \ HAL\n```\n\n```\n# End of file\n```\n\n(A line starting with a #--character\
    \ is only a comment in tickle script.)"
