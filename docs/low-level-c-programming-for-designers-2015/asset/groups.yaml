    ### 3.4.1 理论：二进制数和 ASCII 格式


    二进制系统是计算机使用的数字系统。计算机还处理指令，这些指令告诉计算机应该对数据做什么。工具（链接器）将 C 程序划分为内存中的至少两个部分：数据和指令。让我们先看看数字信号在不同的数字格式中是如何表示的。


    数字信号只有两个可能，“1”或“0”。计算机中的二进制数通常需要转换为十进制、整数、ASCII 格式（见附录）等。在本例中，我们将使用四位制来使其更简单，读者需要记住不同数字系统中数字/字母的含义。对于
    BeMicro 板上的 LED LED，这是一个二进制世界；对于软件调试器，它是十六进制的，而人类更偏好十进制，见表 3.1。


    表 3.1：不同数字系统之间的转换


    | 十进制 | 十六进制 | 二进制 |

    |---|---|---|

    | 0 | 0 | 0000 |

    | 1 | 1 | 0001 |

    | 2 | 2 | 0010 |

    | 3 | 3 | 0011 |

    | 4 | 4 | 0100 |

    | 5 | 5 | 0101 |

    | 6 | 6 | 0110 |

    | 7 | 7 | 0111 |

    | 8 | 8 | 1000 |

    | 9 | 9 | 1001 |

    | 10 | A | 1010 |

    | 11 | B | 1011 |

    | 12 | C | 1100 |

    | 13 | D | 1101 |


    在二进制和十六进制系统之间转换非常简单。只需将位每四位一组进行分组，然后将其转换为十六进制，反之亦然。


    例如，无符号整数 38 很难直观地转换为二进制数。二进制位的值根据位置而不同。在右侧的第一个位置（最低位）值（“权重”）是“1”，下一个位置的值是“2”，然后是“4”，以此此类推，见下表。


    表 3.2：8 位正数（0 – 255）


    | 位位置编号 | 十六进制值 | 该位对应的十进制值 |

    |--- |--- |--- |

    | 0, 最低位 | | 1 |

    | 1 | | 2 |

    | 2 | 0 - F | 4 |

    | 3 | | 8 |

    | 4 | | 16 |

    | 5 | | 32 |

    | 6 | 16*(0-F) | 64 |

    | 7, 最高位 | | 128 |


    下表显示了一些无符号整数的转换。


    表 3.3：无符号整数转换


    | 无符号整数 | 二进制 | 十六进制 |

    |--- |--- |--- |

    | 10 | 0000 1010 | 0A |

