    # 6 CASE 4 – Optimizing C code'
  - '[PAGE 102]


    # 6.1 Introduction


    This chapter describes techniques for optimization of C code and aspects to consider
    before making code changes. Device driver designs often have high optimization
    requirements to minimize different types of latencies in the software system.
    Modern compilers do a great job optimizing the code, but they can''t do everything.
    The content of the following section is intended to help the designer optimize
    the code performance.


    Once a bottleneck is identified, for example a loop that is executed thousands
    of times, remember that the best thing to do is to redesign the program so that
    it doesn''t need to execute the loop thousands of times. This is more efficient
    than making the loop run 10% faster and this is the kind of optimization the compiler
    does; it makes your code run 10% faster but it cannot redesign the program structure.
    It is the responsibility of the software designer to make sure that the program
    structure (the *algorithm*) is optimized. There is a limit to what the compiler
    can do to optimize your code.'
