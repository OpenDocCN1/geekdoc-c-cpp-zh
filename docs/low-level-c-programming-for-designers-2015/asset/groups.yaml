    # After\n\n```c\nint a (int data) {\n  int key;\n  if (data < 100) {\n    data\
    \ = data + 100;\n  }\n  key = c (data);\n  return (data);\n}\n```\n\n### Use decrement\
    \ of increment\n\nLoops that execute a given number of iterations are best written\
    \ to decrement from the number of iterations to zero, instead of counting from\
