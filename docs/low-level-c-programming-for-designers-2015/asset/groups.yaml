- md: "\n## 5.8 Device driver delivery\n\nWe have now validated the device driver\
    \ (CASE 3A) and we have created a tickle field that makes the SBT the driver into\
    \ the BSP of a new project. The question now is, what should we deliver to the\
    \ customer?\n\nIn order to deliver a complete IP component to the customer, we\
    \ must deliver a set of of files and folders as illustrated in figure 5.16. A\
    \ complete IP component has four folders (at least); a folder for the software\
    \ (HAL), one folder for the hardware (hdl) and two folders for documentation and\
    \ code examples.\n\nIn these CASES (CASE 3A and 3B) we have only created the software\
    \ part which is only part of the complete IP component (but we should definitely\
    \ include the source code we used for validation above into the Examples folder).\n\
    \nIn this case the hardware was delivered to you (developed by somebody else).\
    \ This is typically the case; software experts develop the software and hardware\
    \ experts develop the hardware. (If you want to learn how to develop the hardware,\
    \ you need to make a course in hardware design.)\n\n![](img/6e66f097437b5220f7019a5d1c02a038_99_0.png)\n\
    \nFigure 5.16: IP component deliverance\n\nThe Timer_IP folder above (and its\
    \ content) is the Intellectual Property that you (or your company) can offer to\
    \ other users (free-ware or as a commercial product). What the customer has to\
    \ do is only to include the Timer_IP folder above in a project sub folder named\
    \ IP (along with all the other IPs that the project will use):\n\n![](img/6e66f097437b5220f7019a5d1c02a038_100_0.png)\n\
    \n## 5.9 Summary\n\nWe have demonstrated how to develop a device driver and how\
    \ to package it properly for a customer delivery. In this simple case the device\
    \ driver consisted of a single header file only. In a more advanced IP component,\
    \ the device driver will have a source (.c) file too. It may actually have several\
    \ .h and .c files. The intention here was not to write an advanced device driver\
    \ but to illustrate how to write a device driver, validate it and organize all\
    \ the files.\n\nWe used the exact same C code in both CASE 3A and 3B above. Actually,\
    \ since the device driver was loaded into the BSP in CASE 3B, there is one small\
    \ detail that should be changed: In CASE 3A we include the altera_avalon_timer_regs.h\
    \ file using citation marks. In CASE 3B we could save the linker some time by\
    \ instead include it with <> characters instead.\n\n![](img/6e66f097437b5220f7019a5d1c02a038_100_1.png)\n\
    \nFigure 5.18: Congratulations! You can now write device drivers.\n\n## 6 CASE\
    \ 4 – Optimizing C code\n\n### 6.1 Introduction\n\nThis chapter describes techniques\
    \ for optimization of C code and aspects to consider before making code changes.\
    \ Device driver designs often have high optimization requirements to minimize\
    \ different types of latencies in the software system. Modern compilers do a great\
    \ job optimizing the code, but they can't do everything. The content of the following\
    \ section is intended to help the designer optimize the code performance.\n\n\
    Once a bottleneck is identified, for example a loop that is executed thousands\
    \ of times, remember that the best thing to do is to redesign the program so that\
    \ it doesn't need to execute the loop thousands of times. This is more efficient\
    \ than making the loop run 10% faster and this is the kind of optimization the\
    \ compiler does; it makes your code run 10% faster but it cannot redesign the\
    \ program structure. It is the responsibility of the software designer to make\
    \ sure that the program structure (the *algorithm*) is optimized. There is a limit\
    \ to what the compiler can do to optimize your code.\n\n### 6.2 Worth considering\n\
    \nThis part describes some things to consider before making code changes; algorithms,\
    \ the importance of clear and simple code, compiler options, execution time of\
    \ operations and the possibility to transfer some C functionality to hardware\
    \ (via VHDL coding).\n\n#### 6.2.1 Choose a better algorithm\n\nThink about what\
    \ the code is really doing. Learn and use the most appropriate algorithms, even\
    \ if the designer didn't come up with the algorithms by him/herself. Improving\
    \ the overall algorithm will often produce better results than localized code\
    \ tweaking. Optimize the “big picture” first before you tweaking the details.\
    \ Remember that programming is primarily about creating good algorithms; it is\
    \ NOT about writing code Anyone can learn to write code. The hard part is to write\
    \ good structured code based on sound algorithms.\n\nAlso choose an appropriate\
    \ data structure. If the code does a lot of insertions and deletions at random\
    \ places then a linked list would be good. If some binary searching should be\
    \ done, an array would be a better choice [Optimization].\n\n#### 6.2.2 Write\
    \ clear and simple code\n\nIf the code is clear and readable to humans it is also\
    \ clear and readable to compilers. Complicated expressions are harder to optimize\
    \ and can cause the compiler to revert to a lower optimization mode. Part of the\
    \ clarity is moving hunks of code into functions when appropriate. The cost of\
    \ a function call is extremely small on modern machines; therefore optimization\
    \ is NOT a valid excuse for writing ten-page functions (see next example).\n\n\
    If the designer writes portable code, it can quickly port to the latest, fastest\
    \ machine and offer as a solution to the customers who are interested in speed\
    \ [Optimization].\n\nExample of a structured main program:\n\n```\nmain()\n{\n\
    \    main_init();\n    while(1) // loop for ever\n    {\n        task_A();\n \
    \       task_B();\n        ...\n    }\n}\n```\n\n```\ntask_A()\n{\n    main_init_A();\n\
    while(1) // loop for ever\n{\n  task_AA();\n  task_BA();\n}\n}\n```\n\n#### 6.2.3\
    \ Operations\n\nGet a sense of how long certain operations take. Among the slowest\
    \ operations are opening a file, reading or writing large amounts of data, starting\
    \ a new process, searching, sorting, operations on entire arrays and moving large\
    \ amounts of data around. The fastest operations are basic ones like assigning\
    \ values to a variable, dereferencing a pointer or adding two integers [Optimization].\n\
    \n#### 6.2.4 Understand compiler options\n\nMost compilers have several levels\
    \ of optimization. Make sure to use the highest level. A popular compiler such\
    \ as gcc has an incredible variety of optimization levels and options. Some compilers\
    \ have special #prismmas or keywords (for example, inline) which also affect optimization\
    \ [Optimization].\n\nConsult the manufacturer's web site, they usually provide\
    \ a good documentation of what kind of optimizations can do and how to code programs\
    \ in the best possible way.\n\n#### 6.2.5 Move C code to VHDL\n\nIf you use an\
    \ FPGA it is today to move a function to hardware and get faster response time.\
    \ If you have the ambition to design complete components, you need to learn how\
    \ to move functionality between hardware and software.\n\n## 6.3 Code optimization\
    \ techniques\n\nNow it is time to look at some code optimization techniques. The\
    \ techniques are divided into five parts: variables, structures, functions for\
    \ conditional branches, loops and pointers. Each technique is illustrated by an\
    \ example.\n\n### 6.3.1 Variables' scope\n\nUse local variables where possible,\
    \ see table 6.1. The narrower scope of the variable, the better a compiler can\
    \ optimize it. Following this guideline, declaring a variable inside the loop\
    \ or block it will be in, may produce better results than declaring it at the\
    \ start of the function [C-opt].\n\nTable 6.1: Use local variables\n\n| Before\
    \ | After |\n|---|---|\n| int (void) { | int (void) { |\n| int; | int; |\n| for\
    \ (i=0; i<500; i++) { | for (i=0; i<500; i++) { |\n| int errorcode; | int errorcode;\
    \ |\n| errorcode = b; | errorcode = b(); |\n| if (errorcode) return (errorcode);\
    \ | if (errorcode) return (errorcode); |\n| } | } |\n| return (0); | return (0);\
    \ |\n| } | } |\n\nAlso, remember that global variables are never destroyed; they\
    \ will permanently occupy a memory cell in RAM. Local variables though, only exist\
    \ during the time they are used, i.e. while the code within the variable's scope\
    \ is executed (such as a function). When the program exits the function, the variable\
    \ is destroyed and the memory location occupied may be used by other variables.\
    \ Using local variables is simply a more efficient use of RAM memory.\n\n### 6.3.2\
    \ Use the natural-sized variable\n\nFor variables that do not require a certain\
    \ type, use the int type (or Alteras HAL 32 bits type = data bus size for Rios),\
    \ see table 6.2. The compiler should treat this as the target processor's natural-sized\
    \ integer, which will generally be more optimal to use for arithmetic and logic.\
    \ For example, on a 32-bit target processor, a variable declared as short may\
    \ be 16-bit, and would have to be sign-extended before it could be compared.\n"
  mdcn: "\n\n## 5.8 设备驱动程序的交付\n\n我们现在已经验证了设备驱动程序（CASE 3A），并创建了一个 tickle 字段，使 SBT 将驱动集成到新项目的\
    \ BSP 中。现在的问题是，我们应该向客户交付什么？\n\n为了向客户交付一个完整的 IP 组件，我们必须交付如图 5.16 所示的一组文件和文件夹。一个完整的\
    \ IP 组件（至少）包含四个文件夹：一个用于软件 (HAL) 的文件夹，一个用于硬件 (hdl) 的文件夹，以及两个用于文档和代码示例的文件夹。\n\n\
    在这些案例（CASE 3A 和 3B）中，我们只创建了软件部分，而这只是完整 IP 组件的一部分（但我们确实应该将上面用于验证的源代码包含在 Examples\
    \ 文件夹中）。\n\n在这种情况下，硬件是已经交付给你的（由其他人开发）。这通常是常态：软件专家开发软件，硬件专家开发硬件。（如果你想学习如何开发硬件，你需要去上一门硬件设计课程。）\n\
    \n![](img/6e66f097437b5220f7019a5d1c02a038_99_0.png)\n\n图 5.16：IP 组件交付\n\n上面的\
    \ Timer_IP 文件夹（及其内容）是你（或你的公司）可以提供给其他用户的知识产权（免费软件或商业产品）。客户需要做的只是将上面的 Timer_IP 文件夹包含在名为\
    \ IP 的项目子文件夹中（以及该项目将使用的所有其他 IP）：\n\n![](img/6e66f097437b5220f7019a5d1c02a038_100_0.png)\n\
    \n## 5.9 总结\n\n我们演示了如何开发设备驱动程序以及如何对其进行适当封装以交付给客户。在这个简单的案例中，设备驱动程序仅包含一个头文件。在更高级的\
    \ IP 组件中，设备驱动程序还将包含源文件 (.c)。它实际上可能会有多个 .h 和 .c 文件。这里的意图并不是编写一个高级的设备驱动程序，而是说明如何编写设备驱动程序、验证它并组织所有文件。\n\
    \n在上面的 CASE 3A 和 3B 中，我们使用了相同的 C 代码。实际上，由于设备驱动程序在 CASE 3B 中被加载到 BSP 中，因此有一个小细节需要更改：在\
    \ CASE 3A 中，我们使用引号包含 `altera_avalon_timer_regs.h` 文件。在 CASE 3B 中，我们可以通过使用 `<>`\
    \ 包含它来为链接器节省一些时间。\n\n![](img/6e66f097437b5220f7019a5d1c02a038_100_1.png)\n\n图\
    \ 5.18：恭喜！你现在可以编写设备驱动程序了。\n\n## 6案例4 – C 代码优化\n\n### 6.1 引言\n\n本章介绍了 C 代码的优化技术以及在进行代码更改之前需要考虑的方面。设备驱动设计通常有很高的优化要求，以减少软件系统中不同类型的延迟。现代编译器在优化代码方面做得很好，但它们并非无所不能。后续章节旨在帮助设计者优化代码性能。\n\
    \n一旦确定了瓶颈（例如执行数千次的循环），请记住最好的办法是重新设计程序，使其不需要执行数千次循环。这比让循环运行快 10% 要有效得多，而后者是编译器所做的优化类型；它让你的代码运行快\
    \ 10%，但它不能重新设计程序结构。确保程序结构（*算法*）经过优化是软件设计者的责任。编译器优化代码的能力是有限的。\n\n### 6.2 值得考虑的\n\
    \n这部分介绍了在进行代码更改之前需要考虑的一些事项：算法、清晰简单代码的重要性、编译器选项、操作的执行时间以及将某些 C 功能转移到硬件（通过 VHDL\
    \ 编码）的可能性。\n\n#### 6.2.1 选择更好的算法\n\n思考代码实际上在做什么。学习并使用最合适的算法，即使这些算法不是设计者自己想出来的。改进整体算法通常比局部的代码调优产生更好的结果。在调优细节之前，先优化“大局”。记住，编程主要是关于创建良好的算法；它**不是**关于编写代码。任何人都可以学会编写代码。困难的部分是根据合理的算法编写良好的结构化代码。\n\
    \n还要选择合适的数据结构。如果代码在随机位置进行大量的插入和删除，那么链表是一个很好的选择。如果需要进行二分查找，数组会是更好的选择 [Optimization]。\n\
    \n#### 6.2.2 编写清晰简单的代码\n\n如果代码对人类来说是清晰可读的，那么对编译器来说也是清晰可读的。复杂的表达式更难优化，并可能导致编译器退回到较低的优化模式。清晰性的一部分是在合适的时候将代码块移动到函数中。在现代机器上，函数调用的成本极小；因此，优化**不是**编写长达十页函数的借口（参见下一个示例）。\n\
    \n如果设计者编写可移植代码，它可以快速移植到最新、最快的机器上，并为对速度感兴趣的客户提供解决方案 [Optimization]。\n\n结构化主程序的示例：\n\
    \n```\nmain()\n{\n    main_init();\n    while(1) // 无限循环\n    {\n        task();\n\
    \    }\n}\n```\n\n```\nmain()\n{\n    main_init();\n    while(1) // 无限循环\n   \
    \ {\n        task_A();\n        task_B();\n    }\n}\n```\n\n```\ntask_A()\n{\n\
    _init();\nwhile(1) // 无限循环\n{\n  task_B();\n}\n```\n\n#### 6.2.3 操作\n\n了解哪些操作耗时。最慢的操作是打开文件、读写大量数据、启动新进程、排序以及处理数组。最快的操作是如给赋值、解引用指针或两个整数相加。\n\
    \n#### 6.2.4 理解编译器选项\n\n大多数编译器都有多个优化级别。确保使用最高级别。像 gcc 这样流行的编译器有各种优化选项。某些编译器有特殊的\
    \ pragma 或关键字（例如 inline），这些也会影响优化。\n\n咨询制造商网站，他们通常会提供关于优化内容以及如何最佳地编写程序的文档。\n\n\
    #### 6.2.5 将 C 代码迁移到 VHDL\n\n如果你使用 FPGA，将功能迁移到硬件可以获得更快的响应时间。如果你有设计完整组件的目标，你需要学习如何在硬件和软件之间迁移功能。\n\
    \n## 6.3 代码优化技术\n\n现在是时候看看一些代码优化技术。这些技术分为五个部分：变量、结构、条件分支、循环和指针。每个技术都有示例说明。\n\n\
    ### 6.3.1 变量的作用域\n\n尽可能使用局部变量，见表 6.1。变量的作用域越窄，编译器越能优化它。遵循这一准则，在循环或块内部声明变量比在函数开头声明可能会产生更好的结果。\n\
    \n表 6.1：使用局部变量\n\n| 之前 | 之后 |\n|---|---|\n| int (void) { | int (void) { |\n| int;\
    \ | int; |\n| for (i=0; i<500; i++) { | for (i=0; i<500; i++) { |\n| int errorcode;\
    \ | int errorcode; |\n| errorcode = b; | errorcode = b(); |\n| if (errorcode)\
    \ return (errorcode); | if (errorcode) return (errorcode); |\n| } | } |\n| return\
    \ (0); | return (0); |\n| } | } |\n\n此外，记住全局变量永远不会消失；它们将永久占用 RAM 中的内存单元。而局部变量仅在使用期间存在，即执行变量的作用域代码期间（例如函数）。当程序退出函数时，变量会被销毁，占据的内存位置可以被其他变量使用。使用局部变量更有效地利用\
    \ RAM 内存。\n\n### 6.3.2 使用自然大小变量\n\n对于不需要特定类型的变量，使用 int 类型（或 Alteras HAL 32 位类型\
    \ = 数据总线大小， Rios），见表 6.2。编译器应将其视为目标处理器的自然大小整数，这对于算术和逻辑运算来说通常更优化。例如，在 32 位目标处理器上，声明为\
    \ short 的变量可能是 16 位的，在比较之前需要进行符号扩展。\n\n"
