    value;

    a a “1” turns into a “0” and vice versa.


    The C syntax is


    Target = 0x6; // (0110)

    result = ~ target;


    The result will be 0x9 (1001).


    To shift a number certain number of bits, use the right or left shift operators
    in

    C. For example, x>>2, will shift bits in the variable x two steps to the right.
    Os 0 will

    shifted on the left hand of the target (right shift) and this is called a logical

    shift which means that the blanks will be filled with “0”s. The opposite is true
    for left

    shifting.


    Right-shift:


    11100001 >> 4 will produce 00001111

    11000110 >> 2 will produce 00110001


    Left-shift:'
