    ## 1.5.


    一个经验法则是，人类操作的架构包含的组件不应超过 7 ± 2 个。计算机可以轻松地同时处理大量的组件（数百万个）。


    ![](img/6e66f097437b5220f7019a5d1c02a038_15_0.png)


    图 1.5：作为框图原理的硬件架构


    ## 1.3.3 层级结构


    可以创建一个设计结构的映射。结构中的每个分支都会不断分裂，直到最终结束于不可分的组件，或者如人们所说的叶子组件。一个组件要么是一个结构，要么是一个不可分组件。叶子组件可以是不调用任何其他函数的
    C 代码，也可以是没有子组件的 VHDL。顶部的抽象程度会比底部高（见下图）。


    图 1.6：抽象与层级结构的概述。


    ## 1.4 硬件 - FPGA 设备


    书中的案例基于了在单个 FPGA 设备（现场可编程逻辑器件）上对硬件和软件编程的灵活性。如果设计者拥有微控制器，那么一次只能测试一种硬件架构；但使用 FPGA，就可以测试从简单到复杂的、具有不同
    I/O 的多处理器系统架构。因此，FPGA 非常适合教育以及学习如何为许多应用设计完美的平台。


    从逻辑上讲，这些 FPGA 设备可以与大量逻辑结合并编程为内存，这些逻辑可以以设计者喜欢的任何方式连接。下一图显示了 FPGA 设备的灵活性。左侧被编程为简单设计，右侧被编程为带有两个
    32 位 CPU 的高级设计。


    ![](img/6e66f097437b5220f7019a5d1c02a038_16_0.png)


    图 1.7：一个 FPGA 设备中的简单与复杂编程设计


    来自 EEV blog 的 Dave Jones 提供了关于 FPGA 的极佳介绍，你可以在 YouTube 上找到他的视频（前 15 分钟是关于 FPGA
    的介绍）：


    http://www.youtube.com/watch?v=gUsHwi4M4xE


    本书不会再深入探讨 FPGA。


    ### 1.4.1 软件


    软件可以用多种方式表示。软件的本质属性之一是串行执行的（顺序），但由于 CPU 运行速度快，设计者可能会产生几个线程正在并行执行的印象。这是像处理硬件组件一样处理软件的关键。


    软件中的组件可以称为任务、线程、过程、函数、设备驱动程序等。


    下一图说明了如果设计者在 C 文件中包含 `#include <stdio.h>`，则可以使用一个库。为了更好地了解所有可能性，检查你的软件工具支持的不同标准库是一个好主意（更多信息请见附件）。


    ![](img/6e66f097437b5220f7019a5d1c02a038_17_0.png)


    C 语言中简单组件（函数）示例：`void print_pix(alt_u16 x, alt_u16 y, alt_u8 rgb);` "Print_pix"
    在坐标 (x,y) 处以颜色 "rgb"(红、绿、蓝) 写入一个像素。


    ### 1.4.2 硬件与软件之间的接口


    为了管理硬件和软件这两个世界之间的接口，软件中使用了 `软件设备驱动程序`，硬件中使用了 `寄存器`。


    硬件和软件之间的通信有一些各种标准协议，这将在稍后讨论：


    - 软件写入硬件

    - 软件从硬件读取

    - 硬件向软件产生中断


    如图 1.9 所示，`接口` 连接了不同的组件并由软件和硬件组成。这种软件被称为 `设备驱动程序`。


    不同的设备驱动程序必须添加到项目中。如果是 Altera 的软件开发工具，所有技术相关的部分都保存在板支持包（BSP）中。应用程序软件是特定的产品的。


    ![](img/6e66f097437b5220f7019a5d1c02a038_17_0.png)


    ![](img/6e66f097437b5220f7019a5d1c02a038_18_0.png)


    图 1.10：“bsp”（板支持包）和驱动（Altera, NI II）


    ## 1.5 软件开发


    软件有许多语言，如 C、C++、ADA、LISP 等。软件开发遵循一条标准的路径。程序（源代码）被编译为目标代码，编译器将代码转换为汇编。链接器将程序连接到库等，所有的基地址都被分配为绝对地址。链接器产生机器码并下载到目标系统（见图
    11）。


    ### 1.5.1 编译器


    编译器是将源代码翻译为目标代码的计算机程序。通常你可以分两步完成：从 C 到汇编，再到目标代码。目标代码还无法下载到系统；它必须与其他目标文件链接。


    目标代码可能需要设备驱动代码（标准代码），编译器通常将符号地址替换为真实地址。因此，即使只有一个文件，链接器也必须进行内存翻译。


    ### 1.5.2 链接器


    链接器允许从不同的模块构建程序，而不是一个单体。程序员从 1947 年就开始使用原始链接器了。


    | C 代码 "xx.c" |

    | :--- |

    | 编译器 |

    | 汇编代码 "xx.s" |

    | 汇编器 |

    | 目标代码 "xx.o" |

    | 链接器 |

    | 机器码 "xx.elf" |

    | 下载器 |

    | CPU RAM 中的 Hex 代码 |


    图 1.11：软件开发“层”


    ## 链接器的定义


    链接器是一个组合目标模块以形成可执行程序的程序；基本上它将不同的文件绑定在一起。对象包含机器码和供链接器的信息。大多数编程语言（如 C）允许你单独编写不同的代码。这简化了编程任务，因为你可以将一个大程序分解为更小、更容易管理的文件。很快你需要将所有模块放在在一起。这就是链接器工作的地方。下一图显示了链接过程。


    ![](img/6e66f097437b5220f7019a5d1c02a038_20_0.png)


    图 12：在链接过程中，目标文件和静态库被汇合成一个新的库或可执行文件。elf = 可执行且链接格式。


    ## 1.6 YouTube 推荐


    互联网似乎是一个无穷的信息源。在本书大部分章节的末尾，我们将推荐几个认为与当前章节主题相关的 YouTube 视频。以下是一些建议：


    编译器如何工作：https://www.youtube.com/watch?v=Kd93n4_5UM


    什么是 API？：https://www.youtube.com/watch?v=iGTCObc


    什么是 SDK？：https://www.youtube.com/watch?v=py5Hg


    什么是 FPGA？：https://www.youtube.com/watch?v=gUsHwi4MxE


    什么是编译器？：https://www.youtube.com/watch?v=Kd93n4_5UM


    什么是 API？：https://www.youtube.com/watch?v=iGTCObc


    什么是 SDK？：https://www.youtube.com/watch?v=py5Hg


    什么是 FPGA？：https://www.youtube.com/watch?v=gUsHwi4MxE


    ## 2 硬件和软件安装


    为了开发我们的嵌入式系统，我们需要硬件和一些软件。我们使用的软件是“IDE”，即集成开发环境环境 Quartus II。这是一个许可软件，但他们提供免费版本（https://www.altera.com/downloads-center）。为了完成设计周期，你还需要一些硬件平台；本书使用
    MAX10 板，大小只有信用卡程度（https://parts.arrow.com/item/detail/arrow-development-tools/RGMn）。


    硬件系统从我们的网站提供（www.lowlevelprogramming.agstu.com）。


    ### 2.1 软件 IDE


    当你从 Altera 下载 Quartus II 时，你得到的不仅仅是一个 IDE：


    - Quartus II 用于编译硬件设计。

    - Qsys 用于设计计算机架构（CPU、总线、I/O）。

    - Nios II EDS（嵌入式设计套件）是 NI II 处理器的软件开发程序。Nios II EDS 包含了不同的开发工具，如编辑器、调试器、终端处理器、编译器、链接器等，以及设备驱动程序。Nios
    II EDS 中的某些工具和驱动程序被用于案例。它与 Nios II 的名称容易混淆，因为处理器的名称相同。开发工具的正式名称是 Nios II EDS，但有时仅称为
    Nios II。

    - ModelSim 是 Mentor Graphics 的仿真程序，用于验证硬件设计（此处未使用）。


    Quartus II IDE 还具有一个下载器，允许我们将设计下载到 FPGA 中。通常，你将通过以下步骤开发你的嵌入式系统：


    1. 使用 Qsys 设计硬件。

    2. 在 ModelSim 中验证。

    3. 使用 Quartus 下载器将硬件下载到目标 FPGA。

    4. 在 Nios 中编写你的软件。

    5. 将你的软件下载到目标 FPGA。

    6. 调试你的软件！


    然而，本书完全关注软件部分（底层 C 语言），而硬件设计不在本书的范围之内。


    '
