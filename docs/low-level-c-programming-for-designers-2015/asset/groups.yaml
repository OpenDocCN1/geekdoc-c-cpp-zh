    #define TIMER_HW_IP_0_NAME "/dev/TIMER_HW_IP_"

    #define TIMER_HW_IP_0_SPAN 16

    #define TIMER_HW_IP_0_TYPE "TIMER_HW_IP":

    ```


    Figure 5.5: The Timer component has been assigned base address 0x9000


    From figure 5.5 we can see that the Timer component has been assigned base address
    0x9000 and we also see that a #define macro has been used to name this address
    TIMER_HW_IP_0_BASE. This means that the TIME_REG register (the data register)
    is available at address 0x9000.


    **Question:** At what address is the CONTROL_REG register available?

    **Answer:** At the (TIMER_HW_IP_0_BASE + offset $4) address, i.e. 0x9004.


    (Remember that offsets are specified in bytes and each register occupies four
    bytes.)


    Table 5.2 below illustrates the entire memory map of the embedded system used
    in this CASE. This information is available in the system.h file and also in the
    summary.html file.


    **Table 5.2:** Memory map


    | Address | Component |

    |---|---|

    | 0x4000-0x7FFF | On-chip RAM |

    | 0x9000-0x900F | Timer |'
  - '[PAGE 90]


    We will use IOWR_32DIRECT(BASE,OFFSET,DATA) to write to memory. In our device
    we only need to write to the CONTROL_REG register (offset 4), and we will use
    IORD_32DIRECT(BASE,OFFSET) to read from the TIME_REG register (offset 0).


    As a matter of fact, the device drivers for the Timer component will only need
    a single header file with four macro definitions:


    ```

    #define TIMER_STOP IOWR_32DIRECT(TIMER_HW_IP_0_BASE,4x00000000) // write to control
    register

    #define TIMER_RESET IOWR_32DIRECT(TIMER_HW_IP_0_BASE,4x04000000) // write to control
    register

    #define TIMER_START IOWR_32DIRECT(TIMER_HW_IP_0_BASE,4x08000000) // write to control
    register

    #define TIMER_READ_READ IORD_32DIRECT(TIMER_HW_IP_0_BASE) // read from data register

    ```


    Notice how the two most significant data bits change when write to the control
    register and compare this with table 5.1. Make sure you understand why the arguments
    must be 0x00000000, 0x04000000 and 0x08000000, respectively.


    Here is a code example that illustrates how the device drivers are used on the
    application level:


    ```

    TIMER_START(); //Start timer

    delay(); //Wait for event?

    TIMER_STOP; //Stop timer

    x = TIMER_READ; //Read timer value

    TIMER_RESET; //Reset timer register

    ```


    Using the HAL in this way provides many advantages. One is that the code becomes
    easier to read, manage and maintain. Another is that the system designer can relocate
    the component to another address, or even replace the component with a new one,
    as long as its new driver uses similar macros; there is no need to change anything
    in the application code, only the device drivers are affected.


    If there are any disadvantages with the HAL solution above it would be that it
    is Altera specific; it only runs on Altera''s targets. You could write device
    drivers without using HAL and would make the drivers Altera independent, but that
    will not be covered here; this book uses the HAL macro solution only.


    # 5.5 Design Case 3A – Writing device drivers


    Follow these steps:


    +   1. Create a new project folder and name it “CASE_3A”.'
