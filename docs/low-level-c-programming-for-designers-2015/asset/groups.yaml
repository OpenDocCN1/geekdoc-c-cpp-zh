    ## 5.3.2 Register definition


    The software engineer who writes the device driver needs detailed information
    about the layout of the hardware registers, how to communicate with them and what
    services are required.


    ### 1. Registers


    The Timer IP component has two registers only; the Data register and the Control
    register.


    A typical IP component has three kinds of registers; the Control register is used
    to control the hardware function and configure it for different tasks, the Status
    register contains information about the hardware''s status (is it busy?, is it
    done?, and finally it has a Data register that the device driver uses to exchange
    data with the hardware. The timer IP component used has a data register called
    the TIME_REG register and a control register called the CONTROL_REG register.


    The TIME_REG register holds the value of the time and can be read by the user
    application through the device service Timer_read (yet to be written). This register
    is continuously updated in hardware by the system clock as long as the timer is
    in running mode.


    The TIME_REG register has a unique address on the data bus and is calculated from
    the device''s base address + offset (==0), see figure 5.2. The TIME_REG register
    is a read-only register.


    | Name | Mode | Address offset | Bits 31 - 0 |

    |---|---|---|---|

    | TIME_REG | Read only | $0 | Timer data |


    Figure 5.2: Time Register


    The CONTROL_REG register is used to control the hardware functions. It is 32 bits
    long but only two bits are used (bits 31 and 30), which is actually all we need
    since we have three different service requests (not counting Timer_read).


    | Name | Mode | Address offset | Bits 31 - 30 | Bits 29 - 0 |

    | --- | --- | --- | --- | --- |

    | CONTROL_REG | Write only | $4 | Control bits | Not used |


    Figure 5.3: Control Register


    (Notice that the address offset is $4; the address offset is specified in bytes
    by TIME_REG occupies the first four bytes).


    ## 2. Communication protocol


    The communication between the software and the hardware is a “best effort communication”.
    That means the software reads or writes to the registers with no acknowledgement
    mechanism. This is the simplest and most straightforward way of doing it and is
    sufficient for this application.


    ## 3. Hardware Service Requests (the drivers)


    The CONTROL_REG register in hardware is designed so that the services are controlled
    by the two most significant bits in the CONTROL_REG register. This is illustrated
    in table 5.1 below.


    Table 5.1: Service request via the Control bits 31-30


    | Service | Control bits 31 - 30 |

    | --- | --- |

    | TIMER_STOP | 00 |

    | TIMER_RESET | 01 |

    | TIMER_START | 10 |


    ## 5.4 Theory: Software – The Hardware Abstraction Layer


    Before proceeding with the device design, we remind you of Altera’s Hardware Abstraction
    Layer (the “HAL”) introduced in section 3.4.2. The idea of designing a device
    is to make it hardware independent as possible. The device presented here will
    be hardware independent only for Altera’s different Nios configurations.


    The HAL is Altera’s API (Application Programming Interface) for communication
    with the hardware registers. The HAL provides a model for character-mode devices,
    timers, file systems, Ethernet devices, DMA devices and flash memory devices.
    HAL also provides a set of functions to automatically initialize each device.


    We introduced the HAL already in section 3.4.2 and the HAL I/O macros were presented
    in table 3.5. We will use some of the IORD and IOWR macros here, <io.h> library.


    ### 5.4.1 Using the Hardware Abstraction Layer


    When a new project is created in Nios, a system library is created; the board
    support package (BSP). This system library contains the HAL. In the BSP, the information
    about the hardware architecture is stored in the system.h file and we have seen
    several examples of that earlier, for example figures 3.39 and 4.3.


    In this case we will use the hardware in figure 5.4 and each one of the hardware
    components hooked up to the Avalon bus have been assigned a unique address.


    ![](img/6e66f097437b5220f7019a5d1c02a038_89_0.png)


    Figure 5.4: the embedded system with the Timer component


    Figure 5.5 below is a shot of the system.h file.


    ```

    #define ALT_MODULE_CLASS_TIMER_HW_IP TIMER_HW_IP

    #define TIMER_HW_IP_0_BASE 0x9000

    #define TIMER_HW_IP_0_IRQ INTERRUPT_CONTROLLER_ID -1

    #define TIMER_HW_IP_0_NAME "/dev/TIMER_HW_IP_"

    #define TIMER_HW_IP_0_SPAN 16

    #define TIMER_HW_IP_0_TYPE "TIMER_HW_IP":

    ```


    Figure 5.5: The Timer component has been assigned base address 0x9000


    From figure 5.5 we can see that the Timer component has been assigned base address
    0x9000 and we also see that a #define macro has been used to name this address
    TIMER_HW_IP_0_BASE. This means that the TIME_REG register (the data register)
    is available at address 0x9000.


    **Question:** At what address is the CONTROL_REG register available?

    **Answer:** At the (TIMER_HW_IP_0_BASE + offset $4) address, i.e. 0x9004.


    (Remember that offsets are specified in bytes and each register occupies four
    bytes.)


    Table 5.2 below illustrates the entire memory map of the embedded system used
    in this CASE. This information is available in the system.h file and also in the
    summary.html file.


    **Table 5.2:** Memory map


    | Address | Component |

    |---|---|

    | 0x4000-0x7FFF | On-chip RAM |

    | 0x9000-0x900F | Timer |


    We will use IOWR_32DIRECT(BASE,OFFSET,DATA) to write to memory. In our device
    we only need to write to the CONTROL_REG register (offset 4), and we will use
    IORD_32DIRECT(BASE,OFFSET) to read from the TIME_REG register (offset 0).


    As a matter of fact, the device drivers for the Timer component will only need
    a single header file with four macro definitions:


    ```

    #define TIMER_STOP IOWR_32DIRECT(TIMER_HW_IP_0_BASE,0x00000000) // write to control
    register

    #define TIMER_RESET IOWR_32DIRECT(TIMER_HW_IP_0_BASE,0x04000000) // write to control
    register

    #define TIMER_START IOWR_32DIRECT(TIMER_HW_IP_0_BASE,0x08000000) // write to control
    register

    #define TIMER_READ_READ IORD_32DIRECT(TIMER_HW_IP_0_BASE) // read from data register

    ```


    Notice how the two most significant data bits change when write to the control
    register and compare this with table 5.1. Make sure you understand the arguments
    must be 0x00000000, 0x04000000 and 0x08000000, respectively.


    Here is a code example that illustrates how the device drivers are used on the
    application:


    ```

    TIMER_START(); //Start timer

    delay(); //Wait for event

    TIMER_STOP; //Stop timer

    x = TIMER_READ; //Read timer value

    TIMER_RESET; //Reset timer

    ```


    Using the HAL in this way provides many advantages. One is that the code becomes
    easier to read, manage and maintain. Another is that the system designer can relocate
    the component to another, or even replace the component with a new one, as long
    as its new driver uses similar macros; there is no need to change anything in
    the application code, only the device drivers are affected.


    If there are any disadvantages with the HAL solution it would be that it is Altera
    specific; it only runs on Altera''s targets. You could write device drivers without
    using HAL and make the drivers Altera independent, but that will not be covered
    here; this book uses the HAL solution only.


