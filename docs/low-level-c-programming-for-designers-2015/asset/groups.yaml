    # Use temporary variable when passing by address


    When a variable must be passed into a function by address, place the contents
    into a temporary variable, make the function calling using the address of the
    temporary variable, then place the contents of the temporary variable back into
    the original, see table 6.15. This allows the compiler to use a register for the
    variable and still use it in a pass-by-address fashion when necessary [C-opt].


