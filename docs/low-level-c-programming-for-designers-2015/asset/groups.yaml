    \ data) {\n  int key;\n  if (data < 100) {\n    data = data + 100;\n  }\n  key\
    \ = c (data);\n  return (data);\n}\n```\n\n### 使用递减代替增加\n\n执行指定次数的循环最好写成从次数递减到零，而不是从零计数到次数，参见表\
