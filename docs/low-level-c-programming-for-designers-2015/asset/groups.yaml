    | if( val == 1) | switch( val ) |\n| functions_1(); | { |\n| | case 1: functions_1();\
    \ break; |\n| else if ( val == 2) | |\n| functions_2(); | case 2: functions_2();\
    \ break; |\n| else if ( val == 3) | |\n| functions_3(); | case 3: functions_3();\
    \ break; |\n| | |\n"
