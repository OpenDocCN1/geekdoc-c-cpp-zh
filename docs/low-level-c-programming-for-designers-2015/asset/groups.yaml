    # ## 5.9 Summary


    We have demonstrated how to develop a device driver and how to package it properly
    for a customer delivery. In this simple case the device driver consisted of a
    single header file only. In a more advanced IP component, the device driver will
    have a source (.c) file too. It may actually have several .h and .c files. The
    intention here was not to write an advanced device driver but to illustrate how
    to write a device driver, validate it and organize all the files.


    We used the exact same C code in both CASE 3A and 3B above. Actually, since the
    device driver was loaded into the BSP in CASE 3B, there is one small detail that
    should be changed: In CASE 3A we include the altera_avalon_timer_regs.h file using
    citation marks. In CASE 3B we could save the linker some time by instead include
    it with <> characters instead.


