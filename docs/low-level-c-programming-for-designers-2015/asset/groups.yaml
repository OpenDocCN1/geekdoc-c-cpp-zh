    ## 3.4.5 理论：C 语言中的位操作


    在靠近硬件寄存器进行编程时，对整数的位操作通常是必要的。本章解释了如何在 C 语言中在位级别操作整数变量。


    C 语言中有六种不同的位运算符，它们都只对整数类型进行操作。这些运算符可以组合使用，如表 3.7 所示。


    ## 表 3.7：C 语言中的位运算符


    | 运算符 | 描述 |

    |---|---|

    | & | 按位与运算符 |

    | | 按位或运算符 |

    | ^ | 按位异或 (XOR) 补码运算符 |

    | ~ | 按位非运算符，也称为取反补码运算符 |

    | >> | 按位右移运算符 |

    | << | 按位左移运算符 |


    ## 修改掩码


    识别要修改哪些位的常用方法是使用掩码（mask），其中目标位用“1”进行“标记”。例如，“00101101”将选择掩码变量中的第 0、2、3 和 5 位。使用逻辑运算符对目标进行操作为位操作提供了一种简单的方法。以下示例使用
    4 位无符号整数。


    ### AND (&): 清零位


    要清除某位（置为“0”），我们使用按位与操作。AND 掩码中的位必须为 0 才能清除该位，参见表 3.8。


    ## 表 3.8：AND 操作


    | | | 十六进制 |

    |---|---|---|

    | target | 0110 | 0x6 |

    | mask | 1010 | 0xA |

    | result | 0010 | 0x2 (target & mask) |


    当掩码中有“0”时，结果始终为“0”，而当掩码中有“1”时，目标位的值不变。在程序中，设计者可以使用以下语句清除第 0 位和第 3 位。在 C 语言中看起来如下：


    ```c

    target = 0x6;

    result = target & 0xA;

    ```


    注意在这种情况下，在清除这些位之前，目标中的第 0 位已经是“0”了。


    ### OR (|): 置位


    要将某位置为“1”，使用按位或运算符，参见表 3.9。


    ## 表 3.9：OR 操作


    | | | 十六进制 |

    |---|---|---|

    | target | 0110 | 0x6 |

    | mask | 1010 | 0xA |

    | result | 1110 | 0xE (target | mask) |


    当掩码中有“1”时，结果中的位被设置，而当掩码中有“0”时，该位不变。C 语言中的语法如下：


    ```c

    Target = 0x6;

    result = target | 0xA;

    ```


    ### XOR (^): 翻转位


    要翻转某位，使用按位异或运算符，参见表 3.10。


    ## 表 3.10：XOR 操作


    | 二进制 | 十六进制 |

    |---|---|---|

    | target | 0110 | 0x6 |

    | mask | 1010 | 0xA |

    | result | 1100 | 0xC (target ^ mask) |


    C 语言语法为：


    ```c

    Target = 0x6;

    result = target ^ 0xA;

    ```


    ### NOT (~): 取反


    最简单的运算符是取反（NOT）。所有位都将变为相反的值；“1”变成“0”，反之亦然。


    C 语言语法为：


    ```c

    Target = 0x6; // (0110)

    result = ~ target;

    ```


    结果将是 0x9 (1001)。


    要移动数字的位数，请使用 C 语言中的右移或左移运算符。例如，`x>>2` 将将变量 `x` 中的位向右移动两位。0 将移动到目标的左侧（右移），这被称为逻辑移位，这意味着空位将用“0”填充。


    右移：

    11100001 >> 4 产生 00001110


    左移：

    11100001 << 2 产生 10000100


