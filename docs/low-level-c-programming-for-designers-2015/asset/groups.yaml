    ## System Architecture, Mechanical etc.


    ![](img/6e66f097437b5220f7019a5d1c02a038_9_0.png)


    Figure 1.4: Relation between system and embedded system


    It is hard to define embedded systems in a way that will satisfy everyone, but
    there is some common understanding of this expression, and the following applications
    are considered to be embedded systems:


    - Industrial systems: Industrial robots, control systems etc.

    - Automotive systems: ABS brakes, transmission controls etc.

    - Medical instrument controls: scanners, implanted heart monitors, etc.

    - Controls for digital equipment: CD players, TV remotes, programmable sprinklers,
    household appliances, etc.


    And these systems cannot be classified as embedded systems:


    - Computer system that is used primarily for data processing

    - Software system on a PC or Unix computer

    - Systems for traditional business- or scientific applications


    The definition of an embedded system in this book is as follows:


    An embedded system is specialized software, hardware and an interface, which performs
    a specific task (such as running a laundry machine).


    When comparing the number of products between embedded systems and general purpose
    computers (PC), there are less than 0.5 % general purpose computers (PC) on the
    market. A typical home (in the western world) have >30 embedded computers and
    two general purpose computers. A modern car alone may have 40-50 embedded computers
    (for engine control, climate control, fuel injection, airbag control, seat warming,
    measuring fuel level, speed, rpm, rain sensor etc).


    Next figure shows an example of components in an embedded computer system.


    ![](img/6e66f097437b5220f7019a5d1c02a038_10_0.png)


    Figure 1.3: An embedded computer system can encompass the microprocessor as well
    as many other components


    An embedded computer system consists, in most cases, of a multitude of smaller
    components instead of one large component, which leads to parallel execution (concurrency).


    Components can be:


    - Sensors (e.g. buttons)

    - Actuators (lamps)

    - A/D and D/A Converter

    - Human Interface


    Compare this to the typical hardware of a general-purpose computer; hard drive,
    Ethernet interface, video screen, keyboard, and mouse.


    > Authors’ comment: Today it may not be obvious where to draw the line between
    embedded computers and general-purpose computers. For example, how would you classify
    an iPad or a smart phone; as a general-purpose computer or an embedded system?


    ## 1.1.1 Some useful terms


    ### ANSI C, American National Standards Institute C


    Standard specification of the programming language C specified by ANSI. See appendix.


    ### API, Application Programming Interface


    A source code interface that an operating system or library provides to support
    requests for services to be made of by it computer programs.


    ### CPU, Central Processing Unit


    A Central Processing Unit can be any piece of hardware which is capable of processing
    data and controlling the necessary resources to process such data, for example
    adding two numbers where the CPU would need to read the two numbers, add them
    in a circuit such as an ALU and write back the results.


    ### GCC, GNU Compiler Collection


    A set of compilers produced for various programming languages by the GNU Project.


    ### GNU, GNU is Not Unix


    A computer operating system composed entirely of free software. The project to
    develop GNU is known as the GNU Project.


    ### GUI, Graphical User Interface


    A type of user interface which allows people to interact with a computer which
    employs graphical icons.


    ### HMI, Human Machine Interface


    Interaction between humans and machines.


    ### µP, Microprocessor


    A microprocessor is a general-purpose device which contains ALU, short for Arithmetic
    Logic Unit, and unit control. Microprocessors are generally “stand alone” devices
    on an individual chip and often contain more resources for complex arithmetic
    than a microcontroller.


    ### µC, Microcontroller


    Microcontrollers have all the units necessary to complete a computer system “on-chip”.
    The microcontroller can be called a “single-chip solution”. It typically includes
    the Central Processing Unit (CPU), RAM, EPROM/PROM/ROM, I/O peripherals, timers,
    and interrupt controllers. A microcontroller can be thought of as a specialized
    form of the more general-purpose microprocessor. It is dedicated to control-applications
    with little complex arithmetic.


    ### USB, Universal Serial Bus


    Common serial bus standard to interface devices.


    ## 1.2 Application and platform


    Application and platform as shown in figure 1.4 are two components in an embedded
    computer system. The platform is motivated to “help” the application to do the
    real work. A platform can be the hardware and the operating system. The application
    could be the software that controls an industrial robot. In smaller systems there
    is no need for an operating system.


    Several projects have demonstrated the importance of the connections between a
    platform that supports the application and the project management. If you have
    a weak platform that makes it difficult to implement the application, a strong
    project management is needed. If you have a platform that simplifies the implementations
    of the application, there is less needs for a costly project management.


    ![](img/6e66f097437b5220f7019a5d1c02a038_12_0.png)


    Figure 1.4: OS + HW = Platform, Platform + Application = embedded computer system


    Performance: If a system does not meet its required performance, it will be rather
    useless. Performance parameters are typically specified in terms of functionality,
    speed, cost, ability to meet deadlines (real-time performance) and/or power consumption.


    Power dissipation: There are several reasons why power dissipation is important:


    - energy costs increase if the power dissipation increases,

    - More expensive cooling systems could be needed when the power dissipation is
    high,

    - In portable systems, such as cell phones and other hand-held devices, the battery
    life time is an important factor.


    Safety: Many embedded systems, such as medical applications and cars, have strong
    safety requirements. In this kind of applications, reliability and safety requirements
    demand extensive and solid verification and testing on the design to guarantee
    that the system behaves as intended. Critical safety systems like the airbag bag
    in a car or life supporting equipment are always required to have some kind of
    redundancy; if one system fails back-up system takes over (and activates service
    alarm).


    Flexibility: In some cases implementations need to be flexible, i.e. modifiable,
    to meet new standards or changed functionality requirements.


    ## 1.3 Complexity reduction


    As we know, complexity is increasing and we have to deal with it. The question
    is how. This section of the book points out some fundamental answers to this question
    of complexity reduction.


    The following “complexity reduction words” will be discussed:


    - abstraction

    - architecture or structure

    - hierarchy


    ### 1.3.1 Abstraction


    The following parts of the book define the smallest non-divisible components,
    or the *leaf components* as they are sometimes called, like gates, flip flops
    and memories (logic components). We should have worked with even smaller components,
    it would have been with transistors, resistors, inductors and capacitors as the
    smallest non-divisible components. These logic components in their turn make up
    buses, CPUs, which then in their turn make up multiprocessor systems.


    The complexity of a component can be specified by the number of abstraction levels
    and the number of components. Abstraction levels are used to reduce complexity
    by hiding the subcomponents.


    Abstraction levels for components in software are:


    - Machine code – technology dependent

    - Assembler code – technology dependent

    - High level language – technology independent

    - Software components – technology independent


    Higher abstraction levels consequently often give a technology independent description.
    A C-program can, for example, be compiled towards different CPUs and VHDL-description
    in hardware can be synthesized towards different types of FPGAs. However, higher
    abstraction levels are not always technology independent. It is perfectly possible,
    for instance, for a CPU to be technology dependent as well as components on a
    high abstraction level.


    ### 1.3.2 Architecture


    The architecture (structure) describes which sub components a component consists
    of and what sort of relation there is between the components. The hardware and
