    ## 2.1 Hardware platform


    ### 2.1.1 Arrow''s BeMicro MAX 10 board


    Figure 2.1 below illustrates the board and some of the hardware is pointed out.
    The board size is only 50x85 mm.


    The FPGA is a MAX 10 from Altera and has on-chip non-volatile flash memory, an
    on-chip AD converter and temperature sensor. It has phased locked loops, hardware
    multipliers and is capable of hosting the soft Nios II-CPU. It also has a number
    of sensors that we will look into later.


    ![](img/6e66f097437b5220f7019a5d1c02a038_24_0.png)


    Figure 2.1: The BeMicro MAX 10 board


    This board is powered from the same USB used to program the FPGA, so there is
    no need for an external power supply, but if necessary, it has a 2.5 mm connector
    for an external +5 V power supply. The FPGA itself has 8000 LEs (logic elements),
    51M9K memory blocks, 24x18 multipliers, two PLLs, 250 kbyte of flash memory and
    250 general purpose I/O pins. Figure 2.2 on the next page illustrates a schematic
    overview of the FPGA and the I/O units on the board.


    ![](img/6e66f097437b5220f7019a5d1c02a038_24_1.png)


    Figure 2.2: BeMicro MAX 10 board overview


    We will learn the details of this hardware as we present the different CASES in
    this book, but for now we will only comment on the clocks and the simplest I/Os
    (LEDs and buttons).


    ### 2.1.2 System clocks


    The MAX 10 FPGA of course supports the implementation of Altera''s soft CPU, the
    Nios II processor and not that is the processor we will base our designs on. As
    any other CPU it requires a clock. All the designs are available as downloads
    and you don''t need to understand the following information in detail, but we
    include it here in case you look for a more detailed understanding of the systems.


    As illustrated in figure 2.2, there is a 50 MHz clock available on the board and
    it is connected to the FPGA. The FPGA also has couple of PLLs that we will use
    to create the clocks necessary for our designs to work.


    As long as we don''t use the external SDRAM memory or the internal AD converter,
    we only need one single clock (the CPU) and we will use the 50 MHz clock directly.


    However, when we want to add external memory to our design (the SDRAM) we will
    let the internal DDR controller handle the SDRAM. DDR stands for “Double Data
    Rate” and increases the read/write process from/to the SDRAM by a factor of 2.
    This is possible since the DDR controller can operate on both the positive and
    the negative edge of the clock signal. This however, requires an additional clock
    signal -90° out phase with the system clock. To speed up things, we will later
    use a PLL to increase the clock frequency to 80 MHz.


    Also, the on-chip ADC requires a 10 MHz clock, so when we start using the ADC,
    we will have invoke the second PLL in order to get a 10 MHz clock for the ADC.
    Figure 2.3 illustrates our clock system for more advanced designs.


    ![](img/6e66f097437b5220f7019a5d1c02a038_25_0.png)


    Figure 2.3: Our clock system for advanced designs


    The 40 MHz clock can be used for some “slow” I/O units.


    ### 2.1.3 LEDs and buttons


    In our first CASE our design will not use any LEDs our buttons, however, the embedded
    system itself requires a reset button. We will dedicate the SW4 switch on the
    BeMicro board for this purpose and in order to use it, we need to know something
    about the buttons on the board, and while we''re at it, we describe the LEDs too.


    First of all we course need to know what pins on the FPGA the hardware is assigned
    to. That is presented in table 2.1 below.


    #### Table 2.1 Pin assignments on the FPGA: LEDs and push buttons


    | Board Label | Signal Name | FPGA pin name |

    |---|---|---|

    | D1 | USER_LED[1] | M2 |

    | D2 | USER_LED[2] | N1 |

    | D3 | USER_LED[3] | R2 |

    | D4 | USER_LED[4] | T1 |

    | D5 | USER_LED[5] | V4 |

    | D6 | USER_LED[6] | T6 |

    | D7 | USER_LED[7] | AB4 |

    | D8 | USER_LED[8] | AA5 |

    | SW1 | PB[1] | M1 |

    | SW2 | PB[2] | R1 |

    | SW3 | PB[3] | V5 |

    | SW4 | PB[4] | AB5 |

    | 50 MHz clock | SYS_CLK | N14 |


    The “Signal Names” are proposed by Arrow; you may call them anything you want.
    Notice in table 2.1 that we have also included the pin assignment for the on-board
    50 MHz clock.


    Each push button is wired as illustrated in figure 2.4.


    ![](img/6e66f097437b5220f7019a5d1c02a038_26_0.png)


    Figure 2.4: The push button circuit


    The circuit in figure 2.4 has two important consequences. First of all, the RC-network
    forms a de-bouncing circuit (the push-buttons are de-bounced in hardware) and
    second, the PBx signal becomes logic LOW when the push button is PRESSED.


    Hence, if we use SW4 for resetting the system and if we want it to reset when
    we press SW4, it must reset on logic LOW.


    Figure 2.5 illustrates the LED circuits.


    ![](img/6e66f097437b5220f7019a5d1c02a038_27_0.png)


    Figure 2.5: The LED hardware


    The consequence of figure 2.5 is that the LED Dx is turned ON when the signal
    USER_LEDx is set LOW.


    ## 3 CASE 1


    ## 3.1 Theory – HW Architecture - CASE 1A


    The simple computer system used in this CASE consists of four main components;
    the CPU to process data, main memory to hold the data to be processed, peripherals
    of different kinds and a communication between the different parts called the
    “bus”, see figure 3.1.


    ![](img/6e66f097437b5220f7019a5d1c02a038_29_0.png)


    Figure 3.1: CASE 1A Microcontroller architecture


    The components (sometimes called “IP components”) for the “CASE 1A” hardware architecture
    are:


    - CPU: Nios II (Central Processing Unit, processes data)

    - Bus: Avalon bus (communication between the “components”)

    - RAM: Internal FPGA RAM blocks (Hold the data and the program)

    - UART: Nios II JTAG UART (I/O Peripheral that communicates with the text via
    printf and scan)


    ### 3.1.1 CPU Nios II


    There is no difference between a CPU (Central Processing Unit) and a processor.
    At least not referring to a modern computer on the market. In this book “CPU”
    and “processor” are two synonyms.


    (Read more on: http://www.ehow.com/about_6402155_difference-between-cpu-processor_.html)


    The fundamental operation of most CPUs, is to execute stored instructions called
    a “software program” kept in memory. CPUs use four steps in their operation of
    the instruction: fetch, decode, execute, and write back. The instructions are
    32 bits long for the Nios II processor and are referred to as “machine code”.


    - 1) The first step fetches an instruction from memory.

    - 2) The decode step, determines what the CPU should do.

    - 3) The execute step, uses the different components in the CPU to perform the
    operation. In a CPU different types of sub components such as an arithmetic logic
    unit (ALU), registers etc.

    - 4) The write back step, writes back results if necessary (sometimes it is not)

    - 5) Go to step one (forever)


    The Nios II processor, illustrated in figure 3.2, is a general-purpose RISC processor
    (Reduced Instruction Computer) core with Harvard architecture, more about this
    later. A "RISC processor" indicates that it has a minimum set of instructions
    that the processor can execute. The number of instructions are few, but guaranteed
    to execute on one single clock cycle (except jump instructions). The competing
    "CISC" processors of Complex Instruction Sets with far more instructions (and
    more complex ones) but they typically not execute on one clock cycle.


    The processor is connected to an oscillator that generates a physical clock signal
    with high frequency. This clock connects physically to the CPU and synchronizes
    all events. In an optimized CPU one instruction is executed on every single clock
    cycle. In a PC the frequency is often around GHz, but in many embedded systems
    the frequency is lower in order to decrease the power consumption. The faster
    the clock, the more instructions (machine code) the CPU can execute per second.
    So if we have a 40 MHz CPU frequency, it will execute 40 million instructions
    per second, at 1 GHz, it will execute 1000 million instructions per second.


    ![](img/6e66f097437b5220f7019a5d1c02a038_30_0.png)


    Figure 3.2: Nios II processor core and overview of key components


    The processor consists of different components such as:


    - 32 general-purpose registers, very fast and able to hold small amounts of information
    (32 bits).

    - Interrupt controller, to handle asynchronous events outside the processor, more

