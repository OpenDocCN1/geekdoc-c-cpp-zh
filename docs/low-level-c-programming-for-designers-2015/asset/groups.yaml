    ## 3.4.9 总结


    我们在本章中描述的案例说明了嵌入式系统设计的基础。你已经学习了如何在 Nios EDS 中创建项目，以及如何将硬件和软件下载到 FPGA。你在这里学到的最重要点是1)
    如何使用调试器（单步执行程序、设置断点、检查和操作内存）以及 2) 如何使用 HAL 函数。我们将广泛使用 HAL，因此，理解 HAL 是连接硬件和软件的桥梁至关重要。


    ## 4 案例 2 - 添加外部存储


    随着应用程序软件的增长，需要更大的内存空间。为了解决这个问题，需要在系统中添加外部（片外）RAM，本案例的目标是让你更深入地了解在嵌入式设计中如何处理外部内存。案例
    2 涉及外部 RAM 内存的处理。


    ## 4.1 理论：内存


    内存基本上有两种类型：RAM 和 ROM。RAM 是随机存取存储（Random Access Memory），ROM 是只读存储器（Read Only Memory）。“随机访问”是指
    CPU 可以从该内存或向其进行任意读写，因此 RAM 内存在计算机系统中被用作数据内存。ROM 内存只能由 CPU 读取，因此用于存储程序代码或 FPGA
    配置代码。


    ### 4.1.1 RAM


    这里讨论的第一种内存是 RAM。RAM 在程序运行期间存储信息；数据可以从内存读取或写入。但需要记住的一点是，一旦关闭电源，存储在 RAM 中的所有信息都会消失；RAM
    是“易失的”（而 ROM 是“非易失的”）。


    ### SRAM


    SRAM 是静态随机存取存储（Static Random Access Memory），由六个晶体管组成，可以存储一个位。“静态”一词意味着只要电源，内存就会保留其内容。


    ### DRAM


    动态随机存取存储（Dynamic Random Access Memory）仅由一个晶体管和一个电容组成。DRAM 的电容会随着时间放电并丢失信息。为了防止这种情况，内存需要进行刷新；制造商通常规定每一行的刷新频率应为
    16 Hz 或更快。然而，每个单独位包含的组件比相应的 SRAM 位少，因此 DRAM 的存储密度远高于 SRAM（每个芯片区域的位数更多）。


    ### SDRAM


    BeMicro 板上（见图 2.1）的外部 RAM 芯片是同步动态 DRAM，即 SDRAM。SRAM 和 DRAM 是异步的，这意味着它们会尽可能对请求做出响应。SDRAM
    与系统时钟同步，这意味着它在响应之前会等待系统时钟的特定边沿，由于同步，整体性能得到了提高，因为同步 DRAM 允许更高的数据传输率。这也意味着系统时钟必须连接到
    SDRAM 芯片。


    ### PSRAM


    伪静态 RAM（Pseudo Static RAM）是一种内置了刷新和地址控制电路的 DRAM，使其行为类似于静态 RAM。它结合了 DRAM 高密度存储容量和正真
    SDRAM 简单接口的优点。


    ### DDR RAM


    DDR RAM（双倍数据速率 RAM）是同步 RAM，它们在时钟信号的上升沿和下降沿均传输数据，因此数据速率增加了一倍。


    ### 4.1.2 ROM


    这里讨论的另一种内存是 ROM（只读存储器）。正如其名所示，ROM 是一种只能由 CPU 读取的内存。它是一种不可变的内存（或至少是“很难”更改的内存）。ROM
    是“非易失的”，在关闭电源后不会丢失信息。


    ROM 允许数据被写入其中（注：此处原文可能有误，ROM通常只读），且在关闭电源后不会丢失信息。ROM 允许数据写入其中，在关闭电源后不会丢失信息。ROM
    允许数据写入其中，在关闭电源后不会丢失信息。ROM 允许数据写入其中，在微控制器用于存储程序。


    ### PROM


    PROM 代表可编程只读存储器（Programmable Read Only Memory），在电子设备中常用。


    ### EPROM


    EPROM 是可擦可编程只读存储器（Erasable Programmable Read Only Memory），浮栅晶体管阵列，可以通过紫外线进行擦除。


    ### EEPROM


    EEPROM 是电可擦可编程只读存储器（Electrically Erasable Programmable Read Only Memory），通过电子方式进行擦除。EEPROM  用于微控制器。


    ### Flash memory


    闪存内存（Flash memory）是一种在掉电后不会丢失信息的非易失内存，它在 1984 年由 Toshiba 引入。闪存内存的优点是它可以被电子擦除。


    闪存内存有两种类型：NAND 和 NOR。它们之间的主要区别是只有 NOR 闪存允许字节级访问数据。在 NAND 中数据必须按块访问。另一方面，NAND 内存更便宜且密度更高。


    这意味着闪存内存有两个独立的应用领域。NAND 类型闪存用于固态硬盘、SD 卡和 USB 闪盘（即替代硬盘），而 NOR 类型闪存用于微控制器（它们需要字节级访问数据）。


    因此，闪存内存可以用于嵌入式系统的程序内存，但不能用于数据内存，因为它们处理数据太慢。


    ## 缓存内存


    你可能听过“缓存内存”这个短语，你可能知道它是一个好东西，而且在购买新笔记本电脑时需要额外付费。


    缓存内存是 CPU 可以立即访问的极快 内存；它通常与 CPU 位于同一芯片上，以减少访问时间。缓存内存有两个任务。它的主要任务是存储 CPU 执行的最常用指令（执行缓存）。典型的计算机算法包含一个或多个循环，如果指令在缓存内存中，访问速度将比从程序内存获取快得多。


    '
