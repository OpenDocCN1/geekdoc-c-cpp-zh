    ## 3.1.2 Avalon 总线


    总线（或多个总线）是用于硬件（HW）组件之间提供通信通道的标准方法。如今的总线是复杂的组件，因为随着时间的推移，计算机系统对通信效率的要求也日益提高。


    ![](img/6e66f097437b5220f7019a5d1c02a038_31_0.png)


    图 3.3: 总线的主要类型，串行和并行


    我们可以对不同的总线进行分类。观察最后一张图，有两种不同类型的总线，分别是串行和并行。串行总线通常用于内存，例如以太网通信，在这些情况下低成本通常非常重要。并行总线通常用于高数据率系统，例如
    CPU 和主内存之间。现在我们将重点关注并行 Avalon 总线和一种被称为“哈佛架构”的总线系统。


    哈佛架构对数据和指令使用独立的总线，见图 3.4。Nios II 处理器的指令总线连接到内存中的软件代码，数据总线连接到内存中的 I/O、变量、栈。哈佛架构的优势是它可以同时获取新指令并同时向内存写入数据或对
    I/O 设备进行读/写。


    缺点是它占据了更大的芯片面积。与之竞争的架构被称为“冯·诺依曼”架构。在这种架构中，数据和程序内存共享同一条物理总线。这最小化了所需的芯片面积，但代价是速度降低（因为数据和指令无法同时被获取）。


    ![](img/6e66f097437b5220f7019a5d1c02a038_32_0.png)


    图 3.4: 带有总线的哈佛架构；数据总线和指令总线


    ### 3.1.3 JTAG UART


    JTAG UART（通用异步收发器）负责与 PC 之间的串行通信。UART 组件通过 JTAG 接口（串行总线）将来自 CPU 的并行信息转换为主机 PC
    的串行信息。在 PC 中，有一个 JTAG 接收器将其将其转换回并行形式。计算机与 FPGA 板板之间的通信通过 JTAG（联合测试访问组）协议执行。当执行
    `print("hello")` 时，"hello" 将以 ASCII 格式传输到 PC 上的终端窗口，见附录 ASCII。


    ## 3.2 设计 CASE 1A


    ### 3.2.1 引言


    本 CASE 的设计目标是开发一个简单的软件程序，在终端窗口上打印“Hello student!”文本，然后将其下载并执行在硬件平台（CASE 1A）上。


    硬件（即你需要下载到 FPGA 的嵌入式系统）可以在我们的网页版（www.lowlevelprogramming.agstu.com）上找到，它们以两个设计文件的形式提供：一个
    .sof 文件和一个 .scpinfo 文件。你需要将这二文件下载到你的项目文件夹中（见下文说明）。


    ### 3.2.2 设计 CASE 1A：硬件


    下载 CASE 1A 的两个文件（第一步和第二步）：


    - CASE_1A.sof（硬件编程文件）

    - embedded_system_case_1a.scpinfo（微控制器架构、板级支持包 true 的硬件信息）。


    按照以下步骤操作：


    - 1. 创建一个名称不包含空格的文件夹，例如“C:\...\CASE_1A”。

    - 2. 从以下地址下载硬件设计文件：

    http://www.lowlevelprogramming.agstu.com/designfiles/BeMicro_MAX_10/HW_CASE_1A.zip

    - 3. 该压缩包包含两个文件。解压它们并将它们保存到文件夹中。同时创建一个名为 Workspace_SW 的文件夹。


    文件结构示例（名称中不包含空格）：


    ```

    0 ...\

