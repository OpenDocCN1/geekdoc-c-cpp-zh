  - '[PAGE 148]


    # 8.1 Introduction


    An embedded system is not very useful unless it interacts with the outside world.
    A lot of embedded applications rely on physical quantities like temperature, pressure,
    acceleration etc. These quantities are connected to the embedded system via a
    sensor and the sensor output signal is either digital or analog. In the digital
    case, the output signal typically follows some serial data protocol such as SPI
    or I2C. Sensors with an analog output rely on analog-to-digital converters (ADCs)
    when interfacing with embedded computers. A typical FPGA is “all-digital”, i.e.
    it can only handle digital signals, but the FPGA on the BeMicro board has an integrated
    ADC and that is what this CASE is about.'
  - '[PAGE 149]


    # 8.2 Theory – Analog signals in embedded systems


    # 8.2.1 ADCs – Analog-to-Digital Converters


    There are basically three kinds of ADCs; successive approximation ADCs, integrating
    ADCs and flash ADCs [4]. Integrating ADCs [5] are slow but very accurate and provide
    high-resolution rates are typically used in digital multimeters which only require
    sampling rates of 100 samples per second (S/s). Flash ADCs are extremely fast;
    a conversion takes only one clock cycle, but on the other hand their architecture
    is complicated and occupy a large area on the silicon dice (which grows exponentially
    with the resolution) and for that reason they can only be implemented with limited
    resolution.


    Hence, we are left with successive approximation which is a fair compromise of
    the other two; very fast (but not *extremely* fast like the flash ADC) and accurate
    (but not *extremely* accurate like the integrating ADC). For these reasons, successive
    approximation ADCs are the dominating technique in embedded computer systems and
    this is exactly the kind of ADC that has integrated into the MAX 10 FPGA. This
    presentation focuses on successive approximation ADCs in general and the successive
    approximation ADC in the MAX 10 FPGA in particular.


    NB! In English textbook literature, successive ADCs are referred to as SAR ADCs,
    where SAR is short for *Successive Approximation Register*, but from now on we
    will only refer to the MAX 10 SAR ADC as simply “the ADC”.


    Any ADC is characterized by two parameters; the reference value and “the number
    of bits”. An n-bit ADC with a reference value $U_{ref}$ has a voltage resolution


    ```

    $$\Delta U = \frac{U_{ref}}{2^n}$ (8.1)

    ```


    The ADC acts as an analog input and a digital output. “Analog input” should be
    interpreted as an “analog voltage in the range 0 V to $U_{ref}$ and equivalently,
    “digital output” should be interpreted as “integer in the range 0 to $2^n - 1$;
    the output can assume $2^n$ different integer values, 0 to $2^n - 1$, represented
    by binary lines.


    **Example 1:** A 12-bit ADC with a reference value of 2.5 volts has a resolution
    of 0.61 mV and can assume 4096 integer values on the output (0…4095). (This is
    exactly the parameters of the ADC integrated into the MAX 10 FPGA).


    ![](img/6e66f097437b5220f7019a5d1c02a038_149_0.png)


    The ADC does (in principle) that it performs a division; it divides the input'
- md: '

    voltage $A_{in}$ with the resolution $\Delta U$ and the output integer is the
    quotient of this division correctly rounded to the nearest integer. This is all
    done in hardware. The difference between the three ADC techniques is how this
    “division + rounding” is implemented in hardware.


    **Example 2:** If the ADC in example 1 has an input voltage $A_{in} = 1.3640$
    volts, the integer number on the output will be


    $$\frac{A_{in}}{\Delta U} = \frac{1.3640}{2.5} \times 2^{12} = 2235$$


    The embedded computer can only see the integer $D_{out}$ and in order to translate
    back into voltage, the embedded computer must multiply the integer with $\Delta
    U$. In this case we get


    $$U_{in} = 2235 \times \Delta U = 2235 \times \frac{2.5 \text{ volt}}{2^{12}}
    = 1.3641 \text{ volt}$$


    Notice in the example above that there is a slight difference between the voltage
    $U_{in}$ (1.3641 volts) and the actual input voltage $A_{in}$ (1.3640 volts).
    This difference is referred to as the quantization error or the quantization uncertainty
    and is due to the fact that the output integer has rounded. This is an inherent
    property of any ADC and the quantization uncertainty is always $\pm\frac{1}{2}\Delta
    U$; the voltage $U_{in}$ calculated by the embedded computer is only an estimation
    of the input $A_{in}$. The true input voltage can be anywhere in the voltage range
    $U_{in} \pm \frac{1}{2}\Delta U$;


    $$U_{in} - \frac{1}{2}\Delta U \leq A_{in} \leq U_{in} + \frac{1}{2}\Delta U \quadquad
    (8.2)$$


    You should think of $\Delta U$ as “the smallest change in the input voltage will
    change the output integer by exactly 1 unit”.


    There is also some common ADC terminology you need to be familiar with. First
    of all, the 12-bit integer number on the output is referred to as the sample,
    and an operating ADC is simply sampling. The number of samples acquired per time
    unit is the sampling rate (Samples/second = S/s). A typical SAR ADC has a maximum
    sampling rate > 1 MS/s (Mega = Million)


    > **Comment:** You may have heard of the sampling theorem. This law of nature
    states that an ADC signal with a frequency of $f$, must sample with a sampling
    rate greater than $2\times f$. Violating this rule will result in aliasing [quist].


    (Aliasing is what you see on television when you see the rotor blades of a helicopter
    moving backwards; the frames/second of the video recorder is much slower than
    the rotation speed of the rotor blades.)


    ## 8.2.2 Successive approximation


    In a SAR ADC division $A_{in}/\Delta U$ is implemented as a number of successive
    comparisons. The input voltage $A_{in}$ is compared to multiples of $\Delta U$
    in order to find the integer $m$ such that $m \times \Delta U$ is as close to
    $A_{in}$ as possible. This would in principle be very easy; simply increase $m$
    from 0 and upwards until $m \times \Delta U \geq A_{in}$. However, this would
    be very time consuming; on the average it take $2^n/2=2^{n-1}$ comparisons which
    would be 2048 comparisons for a 12-bit ADC. The cleverness of the successive approximation
    $A_{in}$ is the algorithm used to find the $m$-value much faster.


    In successive approximation, $A_{in}$ is first compared to $U_{ref}/2$. If $A_{in}
    > U_{ref}/2$ then the MSB of $D_{out}$ is ($D_{out} = 1....$) and $A_{in}$ is
    next compared to $3 \times U_{ref}/4$. If $A_{in} < U_{ref}/2$ then the MSB of
    $D_{out}$ is cleared ($D_{out} = 0....$) and $A_{in}$ is next compared to $U_{ref}/4$.


    Say that $A_{in} > U_{ref}/2$ so $D_{out} = 1.$. In the next comparison, $A_{in}
    > 3 \times U_{ref}/4$, then the second MSB is set ($D_{out} = 11....$) else it
    is cleared ($D_{out} = 10....$).


    Say that $A_{in} < 3 \times U_{ref}/4$ so that $D_{out} = 10.....$. In the next
    comparison $A_{in}$ would be compared to $5 \times U_{ref}/8$, which would determine
    the value of the third MSB. This comparison algorithm finds the $m$-value in only
    $n$ comparisons for an $n$-bit ADC (12 comparisons only for a 12-bit ADC). This
    is illustrated in 8.2 for a 4-bit SAR ADC.


    ![](img/6e66f097437b5220f7019a5d1c02a038_151_0.png)


    Figure 8.2: The comparison algorithm in a 4-bit SAR ADC


    Hence, an AD conversion takes $n$ clock cycles in an $n$-bit SAR ADC. This is
    of course slower than a flash ADC (one clock cycle) but much faster than integrating
    ADCs (which rely on charging and discharging of a capacitor).


    ## 8.2.3 ADC ON MAX 10


    The ADC on the MAX 10 FPGA is a 12-bit SAR ADC. The reference voltage can be either
    (2.5 volts) or it can use the internal FPGA supply voltage (3.0 – 3.3 volts).
    In CASE 6 the external 2.5 volts is used. Figure 8.3 illustrates the ADC IP block
    [altera-


    ![](img/6e66f097437b5220f7019a5d1c02a038_152_0.png)


    Figure 8.3: ADC block in MAX 10


    The ADC has several inputs but only one ADC; a multiplexer is used to control
    the input signal to the ADC. The FPGA has one input pin that is “dedicated analog”
    which means it cannot be used as digital (analog only). It also has 16 pins with
    dual function; it can be either analog or digital.


    The ADC IP block has an integrated temperature sensor that can also be connected
    to the ADC.


    > **Authors’ comment:** The internal temperature sensor is not very useful; since
    it is integrated into the FPGA, it only measures the internal operating temperature
    of the FPGA chip. If that is what you want to do, fine, but you probably want
    to measure a remote temperature. The BeMicro board has another temperature sensor
    on the board, external to the FPGA, but it has a digital interface.


    NB! On the BeMicro board, only channels 1, 2, 3, 4, 9, 11, and 12 are used (plus
    the temperature sensor input of course).


    In order to understand how the ADC works, you need to understand the **sequencer**.
    Samples are acquired in a **sequence**. When the ADC is setup in Qsys, a conversion
    sequence is determined. A sequence can have any length (from 1 to 64) and a specific
    channel may appear more than once. Suppose the embedded design uses channels 1,
    2, 9 and 12 and the sequence length is set to 6 with the following sequence:


    1, 2, 1, 9, 1, 12


    The ADC will store the channels in order, store each sample in memory and when
    all six samples have been acquired a “done” signal will be issued.


