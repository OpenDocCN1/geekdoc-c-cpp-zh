    \n# 前言\n\n本书的动力是让设计者为真实的微控制器嵌入式软件设计项目做好准备。这是通过系统地引导整个真实设计并结合适当的理论来实现。微控制器设计用于管理车辆、机器人、医疗治疗、机器、家庭等许多产品中的嵌入式系统运行。一个典型的微控制器包括处理器、内存和外设。低级\
    \ C 程序员需要良好理解微控制器架构和软件系统的底层操作。\n\n# 本书\n\n本书的结构侧重于通过执行真实设计来进行嵌入式软件设计，即“在做中学习”。理论整合到案例（CASEs）中，目的是缩短实践与理论之间的距离。\n\
    \n在开始之前：\n\n- 下载工具，免费（请看网络书页说明，“http://lowlevelprogramming.agstu.com/”）\n- 订购板，BeMicroMax10，花费约\
