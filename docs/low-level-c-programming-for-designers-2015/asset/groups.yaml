    ## 7.5 理论 – 中断系统


    ### 7.5.1 简介


    中断是一种旨在提高计算机系统在处理异步事件（软件或外部硬件）时效率和响应时间的功能。中断信号是硬件或软件发出的一个异步关注请求。我们将重点关注硬件中断。


    中断实际上只是计算机中的一种特殊异常（exceptions）。“异常”是指由于某种事件（处理器内部或外部）导致控制权偏离程序的正常执行流，该事件需要立即被处理。除以零或栈溢出是典型的软件异常。另一类异常是本文未涵盖的陷阱（traps）[combs]。


    处理计算机系统中的“事件”时的典型问题是，它们通常以不规则的间隔出现，并且本质上是异步的。假设处理器正在与外部设备通信，而设备设备正于完成某些任务。处理器需要知道设备何时完成，以便向其发送新数据或从中收集数据。与其坐在那里等待设备完成（轮询），如果处理器能够在外部设备忙碌时处理其他任务，并在设备完成时自动通知处理器，那么系统的整体性能将大幅提升。


    这正是中断的意义。设备可以生成 IRQ 请求（中断请求），一旦该信号被处理器识别，它就会放下其他所有工作转而处理外部设备。


    图 7.5 展示了启用中断时的程序流。


    ![](img/6e66f097437b5220f7019a5d1c02a038_135_0.png)


    对比图 7.5 和图 7.1，注意中断系统不规则的异步行为。“对其他任务的服务”是运行在后台的“主”程序，一旦外部设备需要被处理，程序流就会重定向到 ISR（中断服务例程），这被称为“前台”（foreground）[samek]。


    对于这项工作，处理器在跳转到 ISR 之前需要保存上下文（context）。“保存上下文”意味着处理器必须记住在中断请求到达之前在主程序中本应执行的下一条指令的地址。这是为了让处理器能够在
    IRQ 发生后从中断发生的地方继续执行程序。此外，内部寄存器的内容也必须被存储。因此，“上下文”是处理器在完成 ISR 后能够恢复正常执行所需要存储的所有信息。事实上，这种程序流的转移有时被称为上下文切换（context
    switch），但该术语主要保留给多任务系统。中断上下文切换与多任务系统中的上下文切换的主要区别在于：当中断发生时，上下文切换是由硬件完成的；而多任务系统中的上下文切换是由软件处理的
    [alin]。因此，对于中断时的上下文切换，处理器有一组自动加载和检索的“影子寄存器”（shadow registers）。在多任务系统中，上下文在抢占时被“推入”栈。


    在案例 5B 中，外部设备将 BeMicro 板卡上的 SW1 键，用于递增 4 位计数器。当按下键时，按钮 PIO 单元将向处理器产生中断请求。


    ![](img/6e66f097437b5220f7019a5d1c02a038_136_0.png)


    图 7.6：IRQ 的硬件模块框图


    ### 7.5.2 Nios II 处理器中的中断


    Nios II 处理器可以处理硬件中断和软件异常 [nios II, page 8-1]，且硬件中断可以通过两种不同的方式处理：使用 Nios II 处理器的内部中断控制器（IIC）或外部中断控制器（EIC）。当使用
    IIC 时，所有中断都是无向量的（non-vectored），这意味着它们都指向同一个异常地址。结果是，如果启用了多个中断，ISR 软件必须首先确定是哪个硬件单元断定了
    IRQ 线。IIC 是一种简单的中断解决方案，适用于所有 Nios II 处理器。


    如果在硬件系统中添加了 EIC，每个中断都可以有自己的异常地址（向量中断），且 IIC 能处理的中断数量并没有真正的限制，IIC 只能处理 32 个独立中断
    [nios II, page 8-7]，而 EIC 则没有限制。EIC 可以在硬件中为每个中断分配优先级，即低优先级的中断会被高优先级的中断抢占。这在该设计中是可以实现的。


    在本章中我们将使用 IIC。


    ![](img/6e66f097437b5220f7019a5d1c02a038_137_0.png)


    图 7.7：IIC 中的中断


