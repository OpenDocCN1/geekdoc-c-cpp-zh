    ## 5 CASE – Writing device drivers


    ### 5.1 Introduction


    The CASE in this chapter illustrates how to write a device driver and what files
    are required in order to create a complete device driver (and how to organize
    the files). The task is to design a device driver for a 32-bit timer according
    to the specifications in the datasheet and the hardware has already been delivered
    (you will download it from our web page).


    In order to write a device driver, the following steps are required:


    1. Specifications; what is required, what services should the device drivers provide?

    2. Define the interface (between the hardware and the software).

    3. Finally, write the driver code (and “package”) it in a way that others can
    use it).


    The hardware and the device driver are an Intellectual Property, an IP component,
    and as any other intellectual property it can be sold, traded or offered as freeware.
    If you learn to design attractive IP components, there is certainly money to.


    An IP component can be divided into smaller parts as illustrated in figure 5.1.


    ![](img/6e66f097437b5220f7019a5d1c02a038_85_0.png)


    Figure 5.1: Architecture of IP component


    The CASE in this chapter focuses on the device driver and as you can see in figure
    5.1 the device driver is the interface between the hardware and the software and
    we need to design it so that it integrates into the board support package when
    a new Nios II project is initiated.


    The device drivers read and write to the registers in hardware and they are memory
    mapped, i.e. each register has a unique address in memory. Typically, the CPU
    address millions of unique addresses in data space and the registers of an IP
    component, such as our Timer IP, occupies only a few (only two actually, in this
    CASE).


    At the bottom in figure 5.1 are the hardware functions, typically implemented
    as VHDL code and in this CASE it is a simple timer.


    The rest of this chapter is organized as follows: In section 5.2 we define the
    driver specifications (the services that the device driver should provide) and
    the interface is discussed in section 5.3. In section 5.4 we “introduce” the HAL
    and in section 5.5 we write the device driver and validate it. In section 5.6
    we will discuss how to integrate a device driver into the BSP of a new project
    and the concept of “tickle” files is introduced. In section 5.7 finally, we will
    create a tickle file and validate that the new device driver is properly loaded
    into the BSP of a new project.


    CASE 3A below illustrates how the device driver files are created and validated
    and CASE 3B illustrates how the device driver files are organized (for custom
    delivery).


    ### 5.2 CASE specifications


    The device driver for the Timer IP component should have the following services:


    - Timer_start: Start the timer

    - Timer_stop: Stop the timer

    - Timer_reset: Reset the timer

    - Timer_read: Read the timer


    ### 5.3 Define the interface


    The next step is to specify the interface between the driver and the hardware
    registers.


    #### 5.3.1 Driver definitions


    The driver software will have four simple functions:


    Timer_start


    | Description | Arguments | Returns |

    |---|---|---|

    | Starts the timer | None | Nothing |


    Timer_stop


    | Description | Arguments | Returns |

    |---|---|---|

    | Stops the timer | None | Nothing |

