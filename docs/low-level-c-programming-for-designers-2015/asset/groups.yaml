    ```


    An additional method that can be used to write values to some kind of bus analyzer.
    There are, for example, PCI bus analyzers that are able to sample the PCI bus
    and save all values that are generated at a certain time in a memory, which can
    be examined (off-line). Both this and the memory buffer method take a minimum
    of time to carry out. Only four or five assembler instructions have to be executed,
    while executing a print command may take hundreds, or even thousands, of assembler
    instructions to carry out.


    Still, all these methods where data are collected in some way, are not good enough
    in many cases. If there are large amounts of data to be examined it take too long
    to go through the collected data. However, do not disregard these methods, since
    they work well in many cases.


    In order to improve the debugging performance you should use some kind of debugging
    tool. The major benefit of such a tool is that it makes it much easier to examine
    variables, CPU registers etc., compared to the above mentioned methods. A debugger
    may of course work in several different ways, but at least the description presented
    here illustrates the principles of a typical debugger.'
