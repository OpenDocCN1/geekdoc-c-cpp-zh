    Before

    int a (int data) {

    int key;

    if (data < 100) {

    data = data + 100;

    key = c (data);

    data = data % key;

    }

    else {

    key = c (data);

    data = data % key;

    }

    return (data);

    }

    ```


    ```

    After

    int a (int data) {

    int key;

    if (data < 100) {

    data = data + 100;

    }

    key = c (data);

    data = data % key;

    return (data);

    }

    ```


    # Use decrement instead of increment


    Loops that executes a given number of iterations are best written to decrement
    from the number of iterations to zero, instead of counting from zero up to the
    number of iterations, see table 6.19. This takes advantage of the fact that most
    target processors provide decrement-and-branch-if-zero type functionality into
    their instruction sets [C-opt].


