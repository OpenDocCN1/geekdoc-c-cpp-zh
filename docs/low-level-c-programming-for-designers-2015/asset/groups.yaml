    \ fact that most target processors provide decrement-and-if-zero functionality\
    \ into their instruction sets [C-opt].\n\n## Table 6.29: Use decrement of increment\n\
    \n# Before\n\n```c\nfor (int x = 0; x < loops; x++) {\n  /* just some time */\n\
    }\n```\n\n# After\n\n```c\nfor (int x=loops-1; x>=0; x--) {\n  ...\n}\n```\n\n\
    ### Move unmodified expressions out of loops\n\nMove any expressions used within\
    \ the loop that never change value, out of the loop, see table 6.20. This prevents\
    \ the compiler from recalculating the expression on every iteration of the loop\
    \ [C-opt].\n\n## Table 6.30: Move unmodified expressions out of loops\n\n# Before\n\
    \n```c\nint a (int data1, int data2) {\n  unsigned int x;\n  int temp = 100000;\n\
    \  for (x = 10; x>=0; x--) {\n    temp = temp / (data1 * data2);\n  }\n  return\
    \ (temp);\n}\n```\n\n# After\n\n```c\nint a (int data1, int data2) {\n  unsigned\
    \ int x;\n  int temp = 100000;\n  int temp2;\n  temp2 = data1 * data2;\n  for\
    \ (x = 10; x>=0; x--) {\n    temp = temp / temp2;\n  }\n  return (temp);\n}\n\
    ```\n\n## Loop unrolling\n\nMany compilers (e.g. gcc -funroll-loops) will do this\
    \ automatically. It is also possible to change the source code to get the same\
