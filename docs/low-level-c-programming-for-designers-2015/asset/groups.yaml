    ## 3.4 Design CASE 1C: Low-Level C-programming


    In this case we will look closer into how data can be manipulated on an individual
    level. This chapter introduces binary numbers and ASCII code, the Hardware Abstraction
    Layer (HAL), memory maps, parallel input/output components (PIO) and the system''s
    ID component.


    ### 3.4.1 Theory: Binary numbers and ASCII format


    The binary number system is the number system that computers use. The computer
    also works with instructions, which tell the computer what it should do with the
    data. The tool (the linker) divides the C-program into at least two parts in memory;
    data and instructions. Let''s first see how a digital signal is represented in
    different number formats.


    A digital signal can only have two possible values, “1” or “0”. The binary numbers
    in the computer often need to be translated into decimal, integer, ASCII format
    (see appendix) etc. In this case we will use four bits to make it simpler and
    the reader needs to keep in mind the meaning of the numbers/letters in the different
    number systems. For the LEDs on the BeMicro board it is a binary world, for the
    software debugger it is hexadecimal while humans prefer decimal numbers, see table
    3.1.


    Table 3.1: Translation between different number systems


    | Decimal | Hex | Binary |

    |---|---|---|

    | 0 | 0 | 0000 |

    | 1 | 1 | 0001 |

    | 2 | 2 | 0010 |

    | 3 | 3 | 0011 |

    | 4 | 4 | 0100 |

    | 5 | 5 | 0101 |

    | 6 | 6 | 0110 |

    | 7 | 7 | 0111 |

    | 8 | 8 | 1000 |

    | 9 | 9 | 1001 |

    | 10 | A | 1010 |

    | 11 | B | 1011 |

    | 12 | C | 1100 |

    | 13 | D | 1101 |


    It is easy to translate between the binary and hexadecimal number systems. Simply
    organize the bits in groups of four and then translate them to hexadecimal and
    vice versa.


    For example the unsigned integer 38 is hard to translate intuitively into a binary
    number. The binary bits have different values depending on the position. At the
    first position from the right (least significant bit) the value (“weight”) is
    “1” for the next position the value is “2”, then “4” etc., see next table.


    Table 3.2: 8 bits positive numbers (0 – 255)


    | Bit position number | Value hex | Value decimal for the bit position |

    |--- |--- |--- |

    | 0, Least significant bit | | 1 |

    | 1 | | 2 |

    | 2 | 0 - F | 4 |

    | 3 | | 8 |

    | 4 | | 16 |

    | 5 | | 32 |

    | 6 | 16*(0-F) | 64 |

    | 7, most significant bit | | 128 |


    Next table shows the translation for some unsigned integers.


    Table 3.3: Unsigned integer conversions


    | Unsigned integer | Binary | Hex |

    |--- |--- |--- |

    | 10 | 0000 1010 | 0A |

    | 60 | 0011 1100 | 3C |

    | 38 | 0010 0110 | 26 |

    | 255 | 1111 1111 | FF |

    | 128 | 1000 0000 | 80 |


    ASCII code is a 7- or 8-bit number that can be translated into a character, see
    appendix. Here is an 8-bit example; the following sequence of hexadecimal numbers
    represents the word "WORLD": 0x57 (0101_0111), 0x4f, 0x52, 0x4c and 0x44. [1]


    A recommendation to the reader is to learn how signed and unsigned numbers are
    represented in binary format.


    ### 3.4.2 Theory: Altera specific software “HAL (Hardware Abstraction Layer)”


    Before proceeding with the design for CASE 1C, we need an introduction to the
    Hardware Abstraction Layer (HAL) for Altera. The objectives of a HAL are to make
    the software system hardware independent and it is also a set of useful operations.


    When creating a new project using the Nios II IDE, a board support package (BSP
    or "bsp") is created. This BSP library contains the HAL.


    For the low level programming in this chapter how the following files in the table
    3.4 will be used. These files are of interest to the designer (they are all in
    the BSP):


    Table 3.4: Header files (include files)


    | #include <stdio.h> | Standard device drivers |

    | #include <system.h> | Hardware description of the hardware |

    | #include <io.h> | Low level macro for read and write to registers and memory
    location |

    | #include <alt_types.h> | Basic data types to get more control |


    ```c

    #include <system.h>

    ```


    The system.h header file is created from the information about the hardware in
    the selected "socpinfo" and the BSP. For every hardware component that is added
    to the project, information about it is stored in the system.h header file.


    As an example; if a component "My_timer" exists within the project, the information
    written to the system.h file will look something like this:


    MY_TIMER_BASE 0x9000 //defines the base address for "MY_TIMER"


    MY_TIMER_SPAN 16 //indicates that it occupies 16 addresses from base address //0x9000
    to 0x90f.


    The following example is only a small part of the system.h configuration file:


    ```c

    #define ALT_MODULE_CLASS_MY_Timer Timer

    #define MY_TIMER_BASE 0x9000

    #define MY_TIMER_IRQ -1

    #define MY_TIMER_IRQ_INTERRUPT_CONTROLLER_ID -1

    #define MY_TIMER_NAME "/dev/My_Timer"

    #define MY_TIMER_SPAN 16

    #define MY_TIMER_TYPE "Timer"

    ```


    ```c

    #include <io.h>

    ```


    HAL provides the C language macros IORD and IOW. These macros use HAL device drivers
    to access hardware device registers. These macros are defined in #include <io.h>.
    See table 3.5.


    Using the HAL in this way provides many advantages. One is that the code becomes
    easier to read and manage. Another advantage is that the system designer can transfer
    the component to different Nios CPUs (E, S or F). The application code of the
    software doesn''t have to change.


    ```c

    #include <alt_types.h>

    ```


    In order to accommodate ANSI, the HAL includes types specific to Nios II for accessing
    8, 16, and 32 bits. Altera recommends using these types instead of short or long
    to ensure portability.


    Table 3.5: HAL I/O Macros, header file io.h


    | Macro | Description |

    |---|---|

    | IORD (BASE, REGNUM) | Read the value of the offset REGION in a device with base
    BASE. |

    | IOWR (BASE, REGNUM, DATA) | Write the value DATA at the offset REGION in a device
    with base BASE. |

    | IORD_32DIRECT (BASE, OFFSET) | Make a 32-bit read access at the location with
    BASE+OFFSET. |

    | IORD_16DIRECT (BASE, OFFSET) | Make a 16-bit read access at the location with
    BASE+OFFSET. |

    | IORD_8DIRECT (BASE, OFFSET) | Make an 8-bit read access at the location with
    BASE+OFFSET. |

    | IOWR_32DIRECT (BASE, OFFSET, DATA) | Make a 32-bit write access to the value
    DATA at the location with BASE+OFFSET. |

    | IOWR_16DIRECT (BASE, OFFSET, DATA) | Make a 16-bit write access to the value
    DATA at the location with BASE+OFFSET. |

    | IOWR_8DIRECT (BASE, OFFSET, DATA) | Make an 8-bit write access to the value
    DATA at the location with BASE+OFFSET. |


    ### 3.4.3 Theory: memory map


    A memory map is a layout of the address space of different parts such as I/O registers,
    data and instruction. The address bus contains the address and the data bus decides
    if it will be a read or write cycle. This is a simplified explanation and we discuss
    this in more detail later.


    Table 3.6: alt_types.h


    | alt_8 | signed | 8 bit | typedef signed char alt_8; |

    | alt_16 | signed | 16 bit | typedef signed short alt_16; |

    | alt_32 | signed | 32 bit | typedef signed long alt_32; |

    | alt_u8 | unsigned | 8 bit | typedef unsigned char alt_u8; |

    | alt_u16 | unsigned | 16 bit | typedef unsigned alt_u16; |

    | alt_u32 | unsigned | 32 bit | typedef unsigned long alt_u32; |

    | alt_s64 | signed | 64 bit | typedef long long alt_s64; |

    | alt_u64 | unsigned | 64 bit | typedef unsigned long long alt_u64; |

