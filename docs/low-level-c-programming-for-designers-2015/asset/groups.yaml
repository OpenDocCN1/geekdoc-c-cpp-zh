    ## 1.1.1 一些有用术语


    ### ANSI C, 美国国家标准协会 C 标准 (American National Standards Institute C)


    由 ANSI 指定的 C 语言标准规范。见附录。


    ### API, 应用程序编程接口 (Application Programming Interface)


    操作系统或库提供的源代码接口，用于支持计算机程序提出的服务请求。


    ### CPU, 中央处理器 (Central Processing Unit)


    中央处理器可以是任何能够处理数据并控制必要资源以处理此类数据的硬件，例如两个数相加，此时 CPU 需要读取这两个数，在诸如 ALU 的电路中将它们相加并写回结果。


    ### GCC, GNU 编译器集 (GNU Compiler Collection)


    由 GNU 项目为各种编程语言产生的一系列编译器。


    ### GNU, GNU 不是 Unix (GNU is Not Unix)


    一个完全由自由软件组成的计算机操作系统。该项目。


    ### GUI, 图形用户界面 (Graphical User Interface)


    一种图形用户界面。


    ### HMI, 人机界面 (Human Machine Interface)


    人与机器之间的交互。


    ### µP, 微处理器 (Microprocessor)


    微处理器可以是任何能够处理数据并控制处理此类数据所需的资源的硬件。


    ### µC, 微控制器 (Microcontroller)


    微控制器通常集成在芯片上，包含处理器、内存、定时器和外设接口等。


    ### USB, 通用串总线 (Universal Serial Bus)


    通用串总线。


    ## 1.2 应用与平台


    如图 1.4 所示，应用和平台是嵌入式系统。应用和平台为了满足需求。应用和平台是。


    ![](img/6e66f097437b5220f7019a5d1c02a038_12_0.png)


    性能：如果系统无法满足要求的性能，将毫无用处。性能参数通常取决于功能、速度、成本以及功耗。


    功耗：功耗重要的几个原因有：


    - 如果功耗增加，成本增加；

    - 在便携系统中，电池寿命是一个重要因素。


    安全性：许多嵌入式系统（如医疗应用和汽车）具有严格的安全要求。在这些应用中，可靠性和安全性要求进行大量的验证和测试以确保系统按预期运行。关键安全系统（如汽车气囊）总是需要某种冗余；如果一个系统故障，备份系统接管（并激活报警）。


    灵活性：在某些情况下，实现需要是灵活的即可修改，以满足新的标准或更改的功能。


    ## 1.3 复杂性降低


    众所周知，复杂性正在增加，我们必须处理它。书中指出这一复杂性问题的根本答案。


    将讨论以下“复杂性降低”词汇：


    - 抽象

    - 架构或结构

    - 层次结构


    ### 1.3.1 抽象


    书的后续部分定义了最小不可分组件，或者有时被称为*叶子组件*，如门、触发器和存储器（逻辑组件）。我们应该处理更小的组件，那应该是晶体管、电阻、电感和电容作为最小不可分组件。这些逻辑组件反过来构成了总线、CPU，然后又构成了多处理器系统。


    组件的复杂性可以通过抽象层级和组件数量来指定。抽象层通过隐藏子组件来降低复杂性。


    软件组件的抽象层为：


    - 机器码

    - 汇编代码

    - 高级语言

    - 软件组件


    因此，高抽象层通常是技术无关。C 程序可以编译到不同的 CPU，硬件中的 VHDL 描述可以综合到不同类型的 FPGA 中。然而，抽象层级并不总是技术无关的。例如，CPU
    是技术相关的，高抽象层面的组件也可能是如此。


    ### 1.3.2 架构


    架构（结构）描述了一个组件由哪些子组件组成，以及组件之间存在什么样的关系。嵌入式计算机系统的硬件和软件具有架构，如图所示。

