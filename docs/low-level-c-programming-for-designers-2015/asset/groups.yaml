  mdcn: "\n\n# 面设计者的低级 C 编程\n\n# 2015\n\nLars Bengtsson 和 Lennart Lindh，编辑 Mia Lindh\n\
    \n版本 0，微控制器低级 C 编程，2013年。\n\n# 版本 1，微控制器低级 C 编程 2014\n\n- 直接从网络下载硬件架构\n- 重新设计了所有案例（CASEs），使其更关注软件\n\
