    # 2.1 Software IDE


    When you download the Quartus II software from Altera, you get more than just
    an IDE:


    +   - Quartus II is used to compile the hardware design. Quartus also has software
    for programming or configuring the FPGA (download).


    +   - Qsys is used to design the computer architecture (CPU, buses, I/O etc).


    +   - Nios II EDS (Embedded Design Suit) is the name of the software development
    program for the NIOS II processor. Nios II EDS contains different development
    tools as editor, debugger, terminal handler, compiler, linker et. and also device
    drivers. Some of the tools and device drivers in Nios II EDS are used in the CASEs.
    It is confusing with the name Nios II, because the name of the processor is the
    same. The formal name of the development tool is Nios II EDS, but sometimes it
    is only referred as Nios II.


    +   - ModelSim is a simulation program from Mentor Graphics and is used to verify
    hardware designs (not used here).


    The Quartus II IDE also has a programmer that allows us to download our designs
    into the FPGA. Typically, you would develop your embedded system by completing
    the following steps:


    +   1) Design your hardware using Qsys.


    +   2) Verify it in ModelSim.


    +   3) Download the hardware to your target FPGA using the Quartus programmer.


    +   4) Write your software in Nios.


    +   5) Download your software to the target FPGA.


    +   6) Debug your software!


    However, this book focuses entirely on the software part (“low-level C”) and designing
    the hardware is outside the scope of this book. The hardware systems are provided
    to you from our website (at.lowlevelprogramming.agstu.com). The hardware will
    always consist of two files (at least); a .sof file and a .sincinfo file.


    (If you want to know more designing the hardware, we recommend the book “HW/SW
    Embedded FPGA SOC Design 2010”, available on our webpage.)'
