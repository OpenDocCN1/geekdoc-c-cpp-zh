    ## 3.3.3 使用调试器 (CASE 1B)


    从基础层面来说，使用调试器的核心在于向代码中插入断点以停止执行，然后检查 CPU 中的某些变量或寄存器。只需通过双击程序窗口左侧的条栏即可添加断点，通过相同的操作即可移除。


    ![](img/6e66f097437b5220f7019a5d1c02a038_48_0.png)


    ## 关于断点的高级理论（你以后可以再回到这部分）


    下面是一个示例。在 `while` 循环内部的第一行处插入了一个假设的断点。


    ```

    while(1)

    {

    i++;

    if(i%100==0)

    {

    print("T8\n\r");

    ...

    }

    ...

    }

    ```


    被标记代码行的汇编代码可能如下所示：


    ```

    0x00100080    ADD R3,R3,1    /* 将 R3 加 1 */

    ```


    当应用程序正常运行时，该行将按照预期执行，但如果你插入了断点，`ADD` 指令将被替换为一条导致 CPU 产生软件中断的指令。


    | 内存地址 | 指令 |

    | :--- | :--- |

    | 0x00100080 | Invalid Instruction /* 不可执行指令 */ |


    调试器已移除的指令现在位于一个保存所有已移除指令的表中，如图 3.24 所示。


    当 CPU 执行带有无效指令的该行代码时，会产生一个软件中断，随后 CPU 将跳转到专门用于此类事件的预设地址。在中断服务程序 (ISR) 中，会探测中断的原因；如果在此情况下是由于调试器在该处放置了无效指令，则
    CPU 将跳转到调试器代码并执行它。


    | 断点 | 地址 | ASM 指令 |

    | :--- | :--- | :--- |

    | 1 | 0x00100080 | ADD R3,R3,1 |


    图 3.24：保存的指令


    在涉及断点时需要考虑的一点是，无法在位于 ROM 存储器的代码中插入断点，因为这种类型的内存无法交换指令。


    ## 编写代码时可能需要记住的最重要错误


    **索引错误 (Index error)** 是一种常见错误，例如在向量（vector）中使用了上限和下限。通过声明 `int array[10]` 定义了一个包含
    10 个位置的向量。一个常见的错误是在增加或减少向量变量索引时，漏掉了第一个位置 `[0]` 或最后一个位置 `[9]`。后果是可能会写入/读到 0-9 预留索引区域之外，从而破坏向量范围之外的数据或代码。


    **指针错误 (Pointer error)** 也是一种常见错误，特别是在 C 等语言中。这涉及到违反地址边界的问题。例如，如果分配了一个内存区域，应该有测试将指针限制在该特定的内存区域内，否则数据可能会被无意中覆盖。


    **内存错误 (Memory error)** 与指针错误有关。通常出现的问题是分配的内存太少，而可能没有限制的指针索引到了内存之外。


    **条件错误 (Condition error)** 循环和 *if-then* 语句中的条件错误可能导致代码选择错误的路径。如果未说明条件，可能会发生无限循环。在设置条件以同时获取上限和下限时，必须非常小心。编写代码时要非常小心，并仔细探测
    *if-then* 语句的条件。


    **初始化错误 (Initiation errors)** 发生在某些变量没有正确初始化时，可能会导致异常行为，例如预期具有特定值的变量没有正确初始化。必须谨慎避免发生这些错误。初始化错误的经典示例是一个带有变量
    `i` 的 *while* 循环，该变量在每次迭代中都会递增 (`i++`)。如果你在循环开始前忘记初始化，它的值可能是任何值。如果退出循环的条件例如是 `i==10`，那么如果循环开始时
    `i>10`，则该条件可能无法满足。


    **输入数据错误 (Input data error)** 意味着函数的输入数据已损坏。验证输入数据是否位于其应该处理的框架之内非常重要。如果不对输入数据进行测试，当输入数据损坏时，可能会产生输出数据。人们很容易得出函数本身有问题，，但实际上是输入数据损坏了。


    **逻辑错误 (Logic error)** 是一种非常难以排查的错误类型。这种错误实际上是因为设计者想要实现某种特定功能，但代码的结果却执行了其他操作。代码可能是完全正确的，但并没有按照设计者的意图执行。


    **编写错误 (Writing error)** 是一种在语法上仍然正确的错误。在 C 语言编程中一个经典错误是设计者在 *if-then* 语句的比较语句中忘记了等等号，例如
    `if (a=3)...` 而本意是 `if (a==3)...`。该示例的结果将 *if-then* 语句始终为真 (TRUE)，条件 `a=3` 始终为真（因为这是一个赋值而不是比较）。


    编写无 bug 代码并没有那么容易！这需要细心、耐心和经验。


    ## 3.3.4 设计 CASE 1B：软件调试


    nios 中的调试器是 GDB (Gnu Debugger)，它是 Richard Stallman 在 1986 年编写的。它提供了程序运行时的“内部”观察：

    * 启动程序

    * 在满足条件下停止

    * 停止时可以显示寄存器、变量等


    执行以下操作：

    1) 如果你关闭了 FPGA 电源，你需要下载硬件，见图 25。

    2) 使用相同的工作空间。

    3) 调试会话，右键点击项目并选择 Debug。调试器将启动并建立连接。程序将停止在第一可执行行。

    4) 通过右上角的按钮从 C/C++ 视图切换到 Debug 视图（如果弹出“切换到调试视图”，选择“是）。始终可以切换视图。

    5) 在可选代码行设置断点。这通过双击代码左侧的灰色条来实现。断点在灰色列中用符号指示。按下恢复按钮。这将使程序执行并在断点处停止。

    6) 使用步骤按钮逐步执行代码，见图 29。

    7) 使用 Window >> Show View 查看汇编、寄存器和内存内容的窗口（见图 30）。该窗口显示变量、CPU 寄存器和反汇编。


    确保学会使用这个工具！当你的软件没有按预期运行时，它将是巨大的帮助。


    如果在运行调试工具时遇到任何问题，可能是你 PC 上的杀病毒程序拒绝了必要的访问。如果是这种情况，请允许“nios2-gdb-server”，见图 31。


    '
