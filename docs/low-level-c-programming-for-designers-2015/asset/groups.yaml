    # Move common code out of divergent paths


    Within statements that take different paths (if-else, select-case), be sure all
    common code is moved outside of the divergent paths. The shorter the two diverged
    paths are, the less time the processor will need to spend performing speculative
    execution, see table 6.18 [C-opt].


    Table 6.28: Move common code out of divergent paths


