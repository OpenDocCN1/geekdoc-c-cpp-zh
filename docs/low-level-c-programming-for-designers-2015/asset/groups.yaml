    ## 1.5.


    A rule of thumb is that an architecture that a human works with should not consist
    of more than 7 ± 2 components. A computer can easily handle larger amounts of
    components at the same time (millions).


    ![](img/6e66f097437b5220f7019a5d1c02a038_15_0.png)


    Figure 1.5: Hardware architecture as a block schematic


    ## 1.3.3 Hierarchy


    It is possible to create a map of the design structure. Every branch in the structure
    splits until it finally ends up in non-dividable components or as they are sometimes
    called, leaf components. A component is either a structure or it is a non-dividable
    component. A leaf component can be C-code that does not call any other functions
    or VHDL with no sub-components. Abstraction will be higher at the top than at
    the bottom, (see next figure).


    Figure 1.6: Overview of abstraction and hierarchy.


    ## 1.4 Hardware - FPGA device


    The CASES in this book are based on the flexibility to program HW and SW onto
    a single FPGA device (Field Programmable Device). If the designer has a microcontroller
    it''s only possible to test one hardware architecture at a time but with an FPGA
    it''s possible to test designs from simple to complex multiprocessor system architectures
    with different I/Os. Therefore an FPGA is perfect for education and learning how
    to design perfect platforms for a lot of applications.


    Logically these FPGA devices can be programmed as memories in combination with
    a large amount of logic that may be connected any way the designer likes. Next
    figure shows the flexibility of the FPGA device. To the left it is programmed
    as a simple design and to the right programmed as an advanced design with two
    32-bits CPUs.


    ![](img/6e66f097437b5220f7019a5d1c02a038_16_0.png)


    Figure 1.7: A simple and complex programmed design in one FPGA device


    A good introduction to FPGAs is provided by Dave Jones from the EEV blog, you
    find his video on YouTube (the first 15 minutes is introduction to FPGAs):


    http://www.youtube.com/watch?v=gUsHwi4M4xE


    This book doesn''t go any deeper into FPGAs.


    ### 1.4.1 Software


    Software can be represented in several ways. Part of the nature of software is
    that it is executed serially (sequence), but as the CPU works fast, the designer
    may get the impression that several threads are executed in parallel. This is
    the key to the ability to handle the software in the same way as the hardware
    components.


    The components in software can be called tasks, threads, procedures, functions,
    device drivers and so on.


    Next figure illustrates a library that can be used if the designer includes "#include
    <stdio.h>" in the C file. To get a better view of all possibilities it is a good
    idea to check different standard libraries that are supported from your software
    tool (see attachment for more information).


    ![](img/6e66f097437b5220f7019a5d1c02a038_17_0.png)


    Example of a simple component (function) in C; `void print_pix(alt_u16 x, alt_u16
    y, alt_u8 rgb)`;` "Print_pix" writes one pix on the coordinates (x,y) in the color
    "rgb" (red_green_blue).


    ### 1.4.2 Interface between hardware and software


    In order to manage the interface between two such worlds as hardware and software,
    `software device drivers` are used in the software and `registers` in the hardware.


    There are some various standard protocols for the communication between hardware
    and software and this will be discussed later:


    - The software writes to the hardware

    - The software reads from the hardware

    - The hardware generates interrupts to the software


    As illustrated in figure 1.9, `Interfaces` connect the different components and
    consist of software and hardware. This type of software is called `device drivers`.


    The device drivers to the different devices must be added to the projects. The
    next figure illustrates how the UART device has been added to the project. If
    Altera''s software development tools all the technology dependent parts are saved
    in a Board Support Package. Application software is specific for the product.


    ![](img/6e66f097437b5220f7019a5d1c02a038_17_1.png)


    ![](img/6e66f097437b5220f7019a5d1c02a038_18_0.png)


    Figure 1.10: “bsp” (Board support package) and drivers (Altera, NIOS II)


    ## 1.5 Software Development tools


    Software has many different languages, like C, C++, ADA, LISP etc. The development
    of software follows a well standardized path. The program (source code) is compiled
    to object code and compilers convert code to Assembler. The linker connects the
    program to libraries, among other things, and all base addresses are assigned
    absolute addresses. The linker produces machine code, which is downloaded to the
    target system (see figure 1.11).


    ### 1.5.1 Compiler


    A compiler is a computer program that translates source code into object code.
    Often you can do it in two steps from C to Assembler and to object code. The object
    code cannot yet be downloaded to the system; first it has to be linked with other
    object code files.


    The object code may require device driver code (standard) and other code, which
    is taken care of by the linker. The compiler often does not replace symbolic addresses
    with real addresses. Therefore, even if there is only one file, the linker has
    to do the memory translation.


    ### 1.5.2 Linker


    The linker permits programs to be built from different modules, rather than one
    big monolith. Programmers started to use primitive linkers as early as 1947.


    | C code "xx.c" |

    | :--- |

    | Compiler |

    | Assembly code "xx.s" |

    | Assembler |

    | Object code "xx.o" |

    | Linker |

    | Machine code "xx.elf" |

    | Downloader |

    | Hex code in CPU RAM |


    Figure 1.11: Software development “layers”


    ## Definition of a linker


    A linker is a program which combines object modules to form an executable program;
    basically it binds different files together.


    The objects are program modules containing machine code and information for the
    linker.


    Most programming languages, such as C, allow you to write different pieces of
    code separately. This simplifies the programming task, since you can break a large
    program into small, more manageable files.


    Sooner or later you need to put all the modules together. And here is where the
    linker does its job. Next figure shows the linking process.


    ![](img/6e66f097437b5220f7019a5d1c02a038_20_0.png)


    Figure 12: In the linking process, object files and static libraries are assembled
    into a new library or executable.


    elf = executable and linkable format.


    ## 1.6 YouTube recommendations


    The Internet seems like an endless source of information. At the end of most chapters
    in this book, we will recommend a few videos on Youtube that we think are relevant
    to the subjects treated in the current chapter. Here are a few recommendations:


    How a compiler works: https://www.youtube.com/watch?v=Kd93n4_5UjM


    What is an API?: https://www.youtube.com/watch?v=iGTCObc


    What is SDK?: https://www.youtube.com/watch?v=py5H8g


    What is an FPGA?: https://www.youtube.com/watch?v=gUsHwi4MxE


    What is a compiler?: https://www.youtube.com/watch?v=Kd93n4_5UjM


    What is an API?: https://www.youtube.com/watch?v=iGTCObc


    What is an SDK?: https://www.youtube.com/watch?v=py5H8g


    What is an FPGA?: https://www.youtube.com/watch?v=gUsHwi4MxE


    ## 2 Hardware and software installation


    In order to develop our embedded system we need both hardware and some software.
    The software we use is the "IDE", the Integrated Development Environment which
    is called Quartus II. This is a licensed software but they offer a free edition
    (https://www.altera.com/downloads-center). To complete a design cycle you will
    also need some hardware platform; this book uses a MAX10 board and is only the
    size of a credit card (https://parts.arrow.com/item/detail/arrow-development-tools/RGMn).


    The hardware systems are provided to you from our website (www.lowlevelprogramming.agstu.com).


    ### 2.1 Software IDE


    When you download the Quartus II from Altera, you get more than just an IDE:


    - Quartus II is used to compile the hardware design.

    - Qsys is used to design the computer architecture (CPU, buses, I/O).

    - Nios II EDS (Embedded Design Suit) is the name of the software development program
    for the NI II processor. Nios II EDS contains different development tools as editor,
    debugger, terminal handler, compiler, linker et. and also device drivers. Some
    of the tools and device drivers in Nios II EDS are used in the CASEs. It is confusing
    with the name Nios II, because the name of the processor is the same. The formal
    name of the development tool is Nios II EDS, but sometimes it is only referred
    as Nios II.

    - ModelSim is a simulation program from Mentor Graphics and is used to verify
    hardware designs (not used here).


    The Quartus II IDE also has a programmer that allows us to download our designs
    into the FPGA. Typically, you would develop your embedded system by completing
    the following steps:


    1. Design your hardware using Qsys.

    2. Verify it in ModelSim.

    3. Download the hardware to your target FPGA using the Quartus programmer.

    4. Write your software in Nios.

    5. Download your software to the target FPGA.

    6. Debug your software!


    However, this book focuses entirely on the software part (“low-level C”) and designing
    the hardware is outside the scope of this book.

    '
