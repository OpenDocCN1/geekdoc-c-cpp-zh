    \ the designated CPU IRQ line but is redundant in this case; the CPU IRQ line\
    \ is automatically enabled if the interrupt registration is successful.\n\nFinally,\
    \ some words about ISR function. There are few general guidelines to follow when\
    \ you write an interrupt service routine (ISR). First of all, it is treated by\
    \ the compiler as any other function, but it cannot return anything and it cannot\
    \ take any arguments except for a context pointer. This is a direct consequence\
    \ of its asynchronous behavior. The best way of passing values between the ISR\
    \ and the main program is by using global variables [valvano]. ISRs should also\
    \ be kept as short as possible since all tasks in the main program are suspended\
    \ while the interrupt is served and finally, avoid calling functions from the\
    \ *main* function, since this may cause *recursion* which may lead to stack overflow\
    \ [ccs]. If there are functions that needs to be called both from the main function\
    \ and the ISR, the function call in *main* should be protected from interrupt\
    \ by disabling the interrupt before the function call and enabling the interrupt\
    \ immediately after the function returns.\n\n## 7.6 CASE 5B – Interrupt system\n\
    \nFollow these steps:\n\n- 1. Create a new project folder and name it CASE_5B.\n\
    - 2. Download the hardware from our website: www.lowlevelprogramming.agstu.com/BeMicro_MAX_10/HW_CASE_5B.zip\
    \ zip the downloaded file into the CASE_5B project folder. It should look as in\
    \ figure 7.9.\n\n![](img/6e66f097437b5220f7019a5d1c02a038_141_0.png)\n\nFigure\
    \ 7.9: Project folder for CASE 5B\n\n- 3. Create a Nios Project in the CASE_5B\
    \ folder in figure 7.9 based on the .sopcinfo file above and the Hello World template.\
    \ Open the BSP editor and change the settings so that small C libraries and small\
    \ drivers are used and don't use C++ support.\n- 4. Open the hello_world.c file\
    \ and enter the following code:\n\n```c\n#include <system.h>\n#include <stdio.h>\n\
    #include \"altera_avalon_pio_regs.h\"\n#include <alt_types.h>\n#include <io.h>\n\
    #include <HAL/inc/sys/alt_irq.h>\n\nstatic void handle_button_interrupt(void *context);\
    \    // declare ISR\n\nstatic int count_button = 0;\n```\n\n```c\nint main() {\n\
    \    int i, *ptr;\n    printf(\"We start.\\n\");\n\n    IOWR_ALTERA_AVALON_PIO_IRQ_MASK(PIO_IN_BUTTONS_BASE,0x01);\
    \ //Enable SW1 interrupt\n    IOWR_ALTERA_AVALON_PIO_EDGE_CAP(PIO_IN_BUTTONS_BASE,0x01);\
    \ //Clear pending interrupts\n    if(alt_ic_isr_interrupt(PIO_IN_BUTTONS_INTERRUPT_CONTROLLER_ID,PIO_IN_BUTTONS_IRQ,\n\
    \        handle_button_interrupt,ptr,0x00)) { //Register ISR\n        printf(\"\
    Error registering IRQ handler.\\n\");\n        while(1) {\n            printf(\"\
    Counts: %d\\n\", count_button);\n            IOWR_8DIRECT(PIO_OUT_LEDS_BASE,0,255-count_button);\n\
    \            for (i=0;i<1000000;i++);\n        }\n    }\n}\n\nstatic void handle_button_interrupt(void\
    \ *context) { //define ISR\n    if ((IOR_8DIRECT(PIO_IN_BUTTONS_BASE,0) & 0x01))\
    \ {\n        printf(\"IRQ\\n\"); //Bad idea! Just for this demonstration.\n  \
    \      count_button++;\n        if (count_button == 16) {\n            count_button=0;\n\
    \        }\n        while ((0x01) & IOR_8DIRECT(PIO_IN_BUTTONS_BASE)) == 0); //wait\
    \ until key is released\n        IOWR_ALTERA_AVALON_PIO_EDGE_CAP(PIO_IN_BUTTONS_BASE,0x01);\
    \ //acknowledge interrupt\n        IOR_ALTERA_AVALON_PIO_EDGE_CAP(PIO_IN_BUTTONS_BASE);\
    \ //Delay ISR exit\n    }\n}\n```\n\n(Comment: The last row in the ISR delays\
    \ the exit and is removed by Altera in order to \"prevent spurious interrupts\"\
    , see [nios II, page 8-])\n\n- 5. Download the .sof file to the FPGA.\n- 6. Compile\
    \ the program and download it to.\n- 7. When the program is running, you should\
    \ see something like figure 7.10 on the LEDs.\n\n| IRQ! | Counts |\n| :--- | :---\
    \ |\n| IRQ! | 20 |\n| IRQ! | 20 |\n| IRQ! | 21 |\n| IRQ! | 22 |\n| IRQ! | 22 |\n\
    \nFigure 7.10: The system window\n\n![](img/6e66f097437b5220f7019a5d1c02a038_143_0.png)\n\
    \n## 7. Discussion – Interrupts\n\nThe best way of passing values between the\
    \ ISR and the main program is by using global variables [valvano]. ISRs should\
    \ also be kept as short as possible since all tasks in the main program are suspended\
    \ while the interrupt is served and finally, avoid calling functions from the\
    \ *main* function, since this may cause *recursion* which may lead to stack overflow\
    \ [ccs]. If there are functions that needs to be called both from the main function\
    \ and the ISR, the function call in *main* should be protected from interrupt\
    \ by disabling the interrupt before the function call and enabling the interrupt\
    \ immediately after the function returns.\n\n## 7.8 References\n\n- [alin] www.lowlevelprogramming.agstu.com/BeMicro_MAX_10/HW_CASE_5B.zip\n\
    - [ccs] www.altera.com/content/\n- [same] www.altera.com/content/\n- [nios II]\
    \ www.altera.com/pdf/\n- [valvano] www.altera.com/volume/\n\n## 8. Handling signals\n\
    \n### 8.1 Introduction\n\nAn embedded system is not useful unless it interacts\
    \ with the outside world. Physical quantities like temperature, acceleration etc.\
    \ are connected to the system via ADCs. The FPGA output is digital and this is\
    \ what CASE is about.\n\n### 8.2 Theory – Analog signals\n\n### 8.2.1 ADCs – Analog-to-Digital\
    \ Converters\n\nThere are basically three kinds of ADCs: successive approximation\
    \ ADCs, integrating ADCs and flash ADCs. Integrating ADCs are slow but accurate\
    \ and provide rates of 100 samples per second (S/s). Flash ADCs are extremely\
    \ fast; a conversion takes only one cycle, but their architecture is complicated\
    \ and occupy a large area on the silicon (which grows exponentially with the resolution)\
    \ and for that reason they can only be implemented with limited resolution.\n\n\
    Hence, we are left with successive approximation which is a fair compromise of\
    \ the other two; fast (but not extremely fast like the flash ADC) and accurate\
    \ (but not extremely like the integrating ADC). For these reasons, successive\
    \ approximation ADCs are the dominating technique in embedded systems and this\
    \ is exactly the kind of ADC that has integrated into the MAX 10.\n\nNB! In English\
    \ textbook literature, successive ADCs are referred to as SAR ADCs, where SAR\
    \ is short for *Successive Approximation Register*, but from now on we will refer\
    \ to the MAX 10 SAR ADC as “the ADC”.\n\nAny ADC is characterized by two parameters;\
    \ the reference value and the number of bits. An n-bit ADC with a reference value\
    \ $U_{ref}$ has a voltage resolution\n\n$$\\Delta U = \\frac{U_{ref}}{2^n}$$\n\
    \nThe ADC acts as an analog input and a digital output. “Analog input” should\
    \ be interpreted as an “analog voltage in the range 0 V to $U_{ref}$” and equivalently,\
    \ “digital output” should be interpreted as “integer in the range 0 to $2^n -\
    \ 1$; the output can assume $2^n$ different integer values, 0 to $2^n - 1$, represented\
    \ by binary lines.\n\n**Example 1:** A 12-bit ADC with a reference value of 2.5\
    \ volts has a resolution of 0.61 mV and can assume 4096 integer values on the\
    \ output (0…4095). (This is exactly the parameters of the ADC integrated into\
    \ the MAX 10 FPGA).\n\nThe ADC does (in principle) that it performs a division;\
    \ it divides the input\n"
  mdcn: "\n\n上述模板代码中的另一种“操作”涉及 CPU 侧的中断处理。这包括获取 CPU 注册的中断，并启用分配给硬件单元的特定 IRQ 线（在本例中为\
    \ IRQ 号 1）。这由 HAL 中增强的中断 API 中的函数处理，并通过在应用代码中包含 `alt_irq.h` 头文件来访问。特别地，CASE 5B\
    \ 使用了该 API 中的一个函数：`alt_ic_isr_register()`。\n\n## alt_ic_isr_register()\n\n`alt_ic_isr_register()`\
    \ 函数返回一个 `int` 值，并接受五个参数：\n\n```c\nint alt_ic_isr_register(alt_u32 ic_id,\n  \
    \  alt_u32 irq,\n    alt_isr_func isr,\n    void *isr_context,\n    void *flags)\n\
    ```\n\n首先，如果中断注册成功，该函数返回 0。每个中断都被分配了一个识别码（`ic_id`），`irq` 是中断号。`ic_id` 和 `irq`\
    \ 号都从 `system.h` 文件中获取。如图 7.8 所示。\n\n`isr` 是 ISR 函数的名称，`isr_context` 是指向与此特定中断相关的指定内存区域的指针（可能也可能未使用），最后一个参数\
    \ `flags` 在当前版本中实际上未使用（留供未来版本使用）。\n\n```c\n#define PIO_IN_BUTTONS_HAS_OUT *\n\
    #define PIO_IN_BUTTONS_HAS_TRI @\n#define PIO_IN_BUTTONS_IRQ 1\n#define PIO_IN_BUTTONS_IRQ_INTERRUPT_CONTROLLER_ID\
    \ @\n#define PIO_IN_BUTTONS IRQ TYPE \"EDGE\"\n```\n\n图 7.8：system.h 文件\n\nHAL\
    \ 中断 API 包含的函数比我们需要的要多。例如，有一个函数 `alt_ic_isr_enable()`，它可以启用指定的 CPU IRQ 线，但在本例中是多余的；如果中断注册成功，CPU\
    \ IRQ 线会自动启用。\n\n最后，关于 ISR 函数的几点说明。在编写中断服务程序（ISR）时，有几条通用指南需要遵循。首先，编译器将其视为任何其他函数，但它不能返回任何值，且除了上下文指针外不能接受任何参数。这是其异步行为的直接结果。在\
    \ ISR 和主程序之间传递值的最佳方法是使用全局变量 [valvano]。ISR 也应该尽量尽可能短，因为在处理中断时，主程序中的所有任务都会挂起。最后，避免从*main*\
    \ 函数中调用函数，因为这可能导致*递归*，从而引发栈溢出 [ccs]。如果有函数既需要从主函数调用，也需要从 ISR 调用，则应该对*main* 函数中的函数调用进行中断保护，方法是在调用函数调用前禁用中断，并在函数返回后立即启用中断。\n\
    \n## 7.6 CASE 5B – 中断系统\n\n按照以下步骤操作：\n\n- 1. 创建一个新的项目文件夹并命名为 CASE_5B。\n- 2. 从我们的网站下载硬件：www.lowlevelprogramming.agstu.com/BeMicro_MAX_10/HW_CASE_5B.zip，将下载的文件压缩到\
    \ CASE_5B 项目文件夹中。它看起来应该像图 7.9 所示。\n\n![](img/6e66f097437b5220f7019a5d1c02a038_141_0.png)\n\
    \n图 7.9：CASE 5B 的项目文件夹\n\n- 3. 根据上面的 `.sopcinfo` 文件和 Hello World 模板，在图 7.9 中的\
    \ CASE_5B 文件夹创建一个 Nios 项目。打开 BSP 编辑器并更改设置，使用小型 C 库和小型驱动程序，不使用 C++ 支持。\n- 4. 打开\
    \ `hello_world.c` 文件并输入以下代码：\n\n```c\n#include <system.h>\n#include <stdio.h>\n\
    #include \"altera_avalon_pio_regs.h\"\n#include <alt_types.h>\n#include <io.h>\n\
    #include <HAL/inc/sys/alt_irq.h>\n\nstatic void handle_button_interrupt(void *context);\
    \    // 声明 ISR\n\nstatic int count_button = 0;\n```\n\n```c\nint main() {\n  \
    \  int i, *ptr;\n    printf(\"We start.\\n\");\n\n    IOWR_ALTERA_AVALON_PIO_IRQ_MASK(PIO_IN_BUTTONS_BASE,0x01);\
    \ // 启用 SW1 中\n    IOWR_ALTERA_AVALON_PIO_EDGE_CAP(PIO_IN_BUTTONS_BASE,0x01);\
    \ // 清除挂起的中\n    if(alt_ic_isr_interrupt(PIO_IN_BUTTONS_INTERRUPT_CONTROLLER_ID,PIO_IN_BUTTONS_IRQ,\n\
    \        handle_button_interrupt,ptr,0x00)) { // 注册 ISR\n        printf(\"Error\
    \ registering IRQ handler.\\n\");\n        while(1) {\n            printf(\"Counts:\
    \ %d\\n\", count_button);\n            IOWR_8DIRECT(PIO_OUT_LEDS_BASE,0,255-count_button);\n\
    \            for (i=0;i<1000000;i++);\n        }\n    }\n}\n\nstatic void handle_button_interrupt(void\
    \ *context) { // 定义 ISR\n    if ((IOR_8DIRECT(PIO_IN_BUTTONS_BASE,0) & 0x01))\
    \ {\n        printf(\"IRQ\\n\"); // 坏主意！仅用于演示。\n        count_button++;\n    \
    \    if (count_button == 16) {\n            count_button=0;\n        }\n     \
    \   while ((0x01) & IOR_8DIRECT(PIO_IN_BUTTONS_BASE)) == 0); // 等待按键释放\n     \
    \   IOWR_ALTERA_AVALON_PIO_EDGE_CAP(PIO_IN_BUTTONS_BASE,0x01); // 确认中断\n     \
    \   IOR_ALTERA_AVALON_PIO_EDGE_CAP(PIO_IN_BUTTONS_BASE); // 延迟退出 ISR\n    }\n\
    }\n```\n\n（注释：ISR 中的最后一行延迟了退出，Altera 已将其移除以便“防止虚假中断”，参见 [nios II, 第8页]）\n\n- 5.\
    \ 将 `.sof` 文件下载到 FPGA。\n- 6. 编译程序并下载到。\n- 7. 当程序运行时，你应该看到类似图 7.10 的 LED。\n\n|\
    \ IRQ! | 计数 |\n| :--- | :--- |\n| IRQ! | 20 |\n| IRQ! | 20 |\n| IRQ! | 21 |\n\
    | IRQ! | 22 |\n\n图 7.10：系统\n\n![](img/6e66f097437b5220f7019a5d1c02a038_141_0.png)\n\
    \n## 7.7 讨论 – 中断\n\n在 ISR 和主程序之间传递值的最佳方法是使用全局变量 [valvano]。ISR 也应该尽可能短，因为在处理中断时，主程序中的所有任务都会挂起。最后，避免从*main*\
    \ 函数中调用函数，因为这可能导致*递归*，从而引发栈溢出 [ccs]。如果有函数既需要从主函数调用，也需要从 ISR 调用，则应该对*main* 函数中的函数调用进行中断保护，方法是在调用函数调用前禁用中断，并在函数返回后立即启用中断。\n\
    \n## 7.8 参考文献\n\n- [alin] www.lowlevelprogramming.agstu.com/BeMicro_MAX_10/HW_CASE_5B.zip\n\
    - [ccs] www.altera.com/content/\n- [same] www.altera.com/content/\n- [nios II]\
    \ www.altera.com/pdf/\n- [valvano] www.altera.com/volume/\n\n## 8. 处理信号\n\n###\
    \ 8.1 引言\n\n嵌入系统如果不与外部世界交互就是没用的。温度、加速度等物理量通过 ADC 连接到系统。FPGA 输出是数字。\n\n### 8.2\
    \ 理论 – 模拟信号\n\n### 8.2.1 ADC – 模拟数转换\n\nADC 基本有三种：逐次近似 ADC、积分 ADC 和闪存 ADC。积分 ADC\
    \ 慢但准确，采样率为每秒100次 (S/s)。闪存 ADC 极快；转换只需要一个周期，但它们的结构复杂且占用大量面积（随分辨率指数级增长），因此只能实现有限的分辨率。\n\
    \n因此，剩下的是逐次近似，它是后者的折中：快（但不像闪存 ADC 那样快）且准确（但不像积分 ADC 那样）。由于这些原因，逐次近似 ADC 是嵌入式系统的主导技术，这正是集成到\
    \ MAX 10 中的 ADC 类型。\n\n注意！在英文文献中，逐次 ADC 被称为 SAR ADC，其中 SAR 是*逐次近似寄存器*的缩写，但从现在我们将\
    \ MAX 10 SAR ADC 称为“ADC”。\n\n任何 ADC 由两个参数刻画：参考值和位数。具有参考值 $U_{ref}$ 的 n 位 ADC 的电压分辨率为\n\
    \n$$\\Delta U = \\frac{U_{ref}}{2^n}$$\n\nADC 充当模拟输入和数字输出。“模拟输入”应解释为“0 V 到 $U_{ref}$\
    \ 范围内的模拟电压”，同样，“数字输出”应解释为“0 到 $2^n - 1$ 范围内的整数；由二进制线表示”。\n\n**示例 1：** 参考值为 2.5\
    \ 特的 12 位 ADC 分辨率为 0.61 mV，输出可以假设 4096 个整数值（0…4095）。这正是集成到 MAX 10 FPGA 中的 ADC\
    \ 参数）。\n\nADC 原则上做的是除法；它除以输入\n\n"
