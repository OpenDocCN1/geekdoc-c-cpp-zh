    # Use macros for constants


    Avoid placing a constant value directly into a variable if the variable will never
    be modified. Instead, use a pre-processor #define directive to create a macro
    for the constant, and use the macro wherever necessary in the code, see table
    6.8. The pre-processor will simply replace all occurrences of the macro name in
    the code with the true value before the compilation starts. [-Opt]. This eliminates
    the need for additional variables or logic within the compiled code [C-opt]. The
    use of macros also encourage generic coding behavior [generic].


    Table 6.18: Use macros for constants


