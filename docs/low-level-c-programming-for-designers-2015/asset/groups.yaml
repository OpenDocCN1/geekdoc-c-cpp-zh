- md: "\n## 6.6 Summary\n\nWe have demonstrated how to measure the execution time\
    \ of some software and we have also proved the efficiency of placing code in on-chip\
    \ RAM rather than in an external RAM; the execution time increases by a factor\
    \ of 3 in the CASE demonstrated in this chapter.\n\nOf course, we need to comment\
    \ on the exceptional results we got in our CASE above; when we loaded our program\
    \ into the on-chip RAM execution time of the benchmarking code was “10” which\
    \ is even faster than the theoretically predicted execution time of “12” in section\
    \ 6.5. How is that possible?\n\nHere are a few answers that you perhaps would\
    \ suggest (but we are all wrong):\n\n- 1. The processor executes the code in a\
    \ pipeline and therefore pre-fetches the next instruction before the previous\
    \ one is completed.\n\n> Comment: Good answer, but wrong! This would indeed be\
    \ true if we used another version of the processor, but we are using the “v-core\
    \ version” of the Nios II processor and this processor version does not use a\
    \ pipeline; to complete an instruction before it can fetch and dispatch the next\
    \ one [nios 2, page 5-18].\n\n- 2. Since the MAX 10 FPGA uses the second generation\
    \ processor (“gen 2”), may it be faster than the classic Nios processor.\n\n>\
    \ Comment: Wrong answer; execution times of instructions are the same.\n\nAlright,\
    \ so what is wrong the answer? The answer is in the hardware architecture. Look\
    \ at figure 6.1. The 50 MHz system clock feeds the PLL, not the CPU. The PLL generates\
    \ an 80 MHz clock that the CPU runs on. The Timer IP runs on the 50 MHz clock\
    \ (simply because that how the hardware was wired in this). So the “10” we got\
