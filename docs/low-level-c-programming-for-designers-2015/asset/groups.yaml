    1110001 << 4 will produce 0001000

    11000110 << 2 will produce 0001100


    # #define – easier to read


    It is often easier to read a program if the designer assigns names to the bits,
    as in following example.


    ```

    #define LEDG_1 0x1

    #define LEDG_2 0x2

    #define LEDG_3 0x4

    ```


    ```

    PIO_REG = LEDG_1 | LEDG_2; // only LEDG_1, LEDG_2 on

    PIO_REG |= LEDG_1 | LEDG_2; // also LEDG_1, LEDG_2 on

    ```


    ```

    PIO_REG &= ~(LEDG_1 | LEDG_2); // LEDG_1 | LEDG_2 off

    ```


    # Macros


    It is possible to combine operations and get more complex operations with macros.
    It is illustrated in the following examples.


    # Set (1) one bit:


    ```

    #define bit_set(value,bit) ( ( value ) |= (1 << bit))

    bit_set(8,1); // Result will be 0x10

    ```


    # Clear (0) one bit:


    ```

    #define bit_clear(value,bit)((value)&~(1 << bit))

    bit_clear(5,0); // Result will be 0x4

    ```


    # Negation (NOT) one bit:


    ```

    #define bit_toggle(value,bit)((value)^~(1 << bit ))

    bit_toggle(10,3); // Result will be 0x2

    ```


    # Test one bit:


    ```

    #define bit_test(value,bit) ( ( value ) & (1 << bit ))

    if ( bit_test(5,0)); // Result, True, bit(0) = 1

    ```


