  - "[PAGE 71]\n\nAlso, compare your experiences from the test above with the hardware\
    \ circuits in chapter 2, figure 2.4 and 25. Did the LEDs and buttons behave as\
    \ you expected?\n\nThe connection between the pins to the PIO and also between\
    \ the PIO and the CPU bus has been validated. Now, it is time we write some software\
    \ of our own!\n\n# Part two\n\nIn part of this case we will write some software\
    \ that manipulates the LEDs and the switches on the BeMicro board. The trick to\
    \ that spells \"HAL\"; we need the IORD and the IOWR functions in the HAL and\
    \ we access them by including the header file i.h in our C program.\n\nFor example,\
    \ if we want to read the values of the keys, we can use the IORD_32DIRECT()-function\
    \ (see table 3.5):\n\n```\nkey_in = IORD_32DIRECT(PIO_IN_KEY_BASE); //First register\
    \ has offset 0\n```\n\nIf we want to manipulate the LEDs, we use the IOWR_32DIRECT()-function.\
    \ For example, the following line will turn on every other LED on the board:\n\
    \n```\nIOW_32DIRECT(PIO_OUT_LED_BASE,0x05); //Offset = 0, data = 0b01010101\n\
    ```\n\nThat is all you need to know!\nIn Nios EDS, return back to the \"Nios perspective\"\
    \ and open the hello_world.c file. Replace the existing code with the following\
    \ application program:\n\n```\n#include <stdio.h>\n#include <io.h>\n#include <alt_types.h>\n\
    #include <system.h>\n\nint main()\n{\n    alt_u32 key_in; //include <alt_types.h>\n\
    \    int i;\n\n    while(1) // loop for ever\n{\n        key_in = IORD_32DIRECT(PIO_IN_KEY_BASE,0);\
    \ //read the KEYS\n        IOWR_32DIRECT(PIO_OUT_LED_BASE,0,key_in); // write\
