    ## 5.3.2 寄存器定义


    编写设备驱动程序的软件工程师需要关于硬件寄存器布局的详细信息、如何与它们通信以及需要哪些服务。


    ### 1. 寄存器


    定时器 IP 组件只有两个寄存器：数据寄存器控制寄存器。


    典型的 IP 组件具有三类寄存器：控制寄存器用于控制硬件功能并为不同的任务进行配置；状态寄存器包含硬件状态的信息（是否忙碌？是否已完成？）；最后，它有一个设备驱动程序用于与硬件交换数据的数据寄存器。所使用的定时器
    IP 组件有一个名为 `TIME_REG` 的数据寄存器和一个名为 `CONTROL_REG` 的控制寄存器。


    `TIME_REG` 寄存器保存时间值，用户可以通过设备服务 `Timer_read`（尚未编写）读取它。只要定时器处于运行模式，系统时钟就会在硬件中持续更新此寄存器。


    `TIME_REG` 寄存器在数据总线上有一个唯一的地址，由设备基地址 + 偏移量 (==0) 计算，见图 5.2。`TIME_REG` 寄存器是一个只读寄存器。


    | 名称 | 模式 | 地址偏移 | 第 31 - 0 位 |

    |---|---|---|---|

    | TIME_REG | 只读 | $0 | 定时器数据 |


    图 5.2：时间寄存器


    `CONTROL_REG` 寄存器用于控制硬件功能。它长 32 位，但仅使用了两位（第 31 和第 30 位），这实际上就是我们需要的，因为我们有三个不同的服务请求（不计
    `Timer_read`）。


    | 名称 | 模式 | 地址偏移 | 第 31 - 30 位 | 第 29 - 0 位 |

    | --- | --- | --- | --- | --- |

    | CONTROL_REG | 只写 | $4 | 控制位 | 未使用 |


    图 5.3：控制寄存器


    （注意地址偏移为 $4；地址偏移以字节为单位，`TIME_REG` 占据了前四个字节）。


    ## 2. 通信协议


    软件与硬件之间的通信是“尽力而为的通信”。这意味着软件读取或写入寄存器时没有确认机制。这是实现目标最简单直接的方法，对于此应用程序已经足够。


    ## 3. 硬件服务请求（驱动程序）


    硬件中的 `CONTROL_REG` 寄存器设计为通过 `CONTROL_REG` 寄存器中的两个最高位来控制服务。下表 5.1 所示。


    表 5.1：通过控制位 31-30 请求服务


    | 服务 | 控制位 31 - 30 |

    | --- | --- |

    | TIMER_STOP | 00 |

    | TIMER_RESET | 01 |

    | TIMER_START | 10 |


    ## 5.4 理论：软件 – 硬件抽象层


    在继续设备设计之前，我们提醒您注意第 3.4.2 节介绍的 Altera 硬件抽象层（“HAL”）。设计设备的理念是使其尽可能与硬件无关。这里介绍的设备仅对于
    Altera 不同的 Nios 配置是硬件无关的。


    HAL 是 Altera 用于与硬件寄存器通信的 API（应用程序接口）。HAL 为字符设备、定时器、文件系统、以太网设备、DMA 设备和闪存设备提供了模型。HAL
    还提供了一系列函数来自动初始化每个设备。


    我们已经在 3.4.2 节中引入了 HAL，HAL I/O 宏在表 3.5 中列出。我们将使用 `<io.h>` 库中的 `IORD` 和 `IOWR` 宏。


    ### 5.4.1 使用硬件抽象层


    当在 Nios 中创建一个新项目时，会创建一个系统板级支持包 (BSP)。该系统库包含了 HAL。在 BSP 中，硬件体系信息存储在 `system.h`
    文件中，我们之前见过几个示例，例如图 3.3 和 4.3。


    在这种情况下，我们将使用图 5.4 中的硬件，连接到 Avalon 总线的每个硬件组件都分配了一个唯一地址。


    ![](img/6e66f097437b5220f7019a5d1c02a038_91_0.png)


    图 5.4：带有定时器组件的嵌入式系统


    图 5.5 是 `system.h` 文件的内容：


    ```

    #define ALT_MODULE_CLASS TIMER_HW_IP

    #define TIMER_HW_IP_0_BASE 0x9000

    #define TIMER_HW_IP_0_INTERRUPT_CONTROLLER -1

    #define TIMER_HW_IP_0_NAME "/dev/TIMER_HW_IP_"

    #define TIMER_HW_IP_0_SPAN 16


    ``` 5.5：定时器组件分配了基地址 0x900


    从图 5.5 可以看到定时器组件分配了基地址 0x9000，我们看到使用 #define 宏来命名此地址 `TIMER_HW_IP_0_BASE`。这意味着
    `TIME_REG` 寄存器（数据寄存器）位于地址 0x9000。


    **问题：** `CONTROL_REG` 寄存器在哪个地址？

    **回答：** 在 (`TIMER_HW_IP_0_BASE + offset $4`) 地址，即 0x9004。


    （记得偏移是以字节为单位的，每个寄存器占用四个字节。）


    表 5.2 显示了此案例中嵌入式系统的整个内存映射。这些信息可以在 `system.h` 文件和 `summary.html` 文件中找到。


    **表 5.2：内存映射**


    | 地址 | 组件 |

    |---|---|

    | 0x4000-0xFFF | 片上 RAM |

    | 0x9000-0x90F | 定时器 |


    我们将使用 `IOWR_32DIRECT(BASE,OFFSET,DATA)` 写入内存。我们的设备只需要写入 `CONTROL_REG` 寄存器（偏移 4），并将使用
    `IORD_32DIRECT(BASE,OFFSET)` 读取 `TIME_REG` 寄存器（偏移 0）。


    事实上，定时器组件的设备驱动程序只需要包含四个宏定义的头文件：


    ```

    #define TIMER_STOP IOWR_32DIRECT(TIMER_HW_IP_0_BASE,0x00000000) // 写入控制寄存器

    #define TIMER_RESET IOWR_32DIRECT(TIMER_HW_IP_0_BASE,0x04000000) // 写入控制寄存器

    #define TIMER_START IOWR_32DIRECT(TIMER_HW_IP_0_BASE,0x08000000) // 写入控制寄存器

    #define TIMER_READ IORD_32DIRECT(TIMER_HW_IP_0_BASE) // 从数据寄存器读取

    ```


    注意写入控制寄存器时两个最高数据位的变化，并与表 5.1 进行比较。确保你理解参数必须分别是 0x00000000、0x04000000 和 0x08000000。


    下面的代码示例说明了如何在应用程序中使用设备驱动：


    ```

    TIMER_START(); // 开始定时器

    delay(); // 等待事件

    TIMER_STOP; // 停止定时器

    x = TIMER_READ; // 读取定时器值

    TIMER_RESET; // 重置定时器

    ```


    这样使用 HAL 有许多优点。之一是代码变得更容易阅读、管理和维护。另一个是系统设计人员可以将组件移动到其他地方，甚至替换为新组件，只要其新驱动程序使用类似的宏；不需要更改应用程序代码中的任何内容，只会影响设备驱动程序。


    如果 HAL 解决方案有任何缺点，那就是它是 Altera 特有的；它只在 Altera 目标上运行。你可以不使用 HAL 编写设备驱动并使其独立 Altera，但这里不会涉及；此书仅使用
    HAL 解决方案。


