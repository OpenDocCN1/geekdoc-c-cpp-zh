    嵌入式计算机系统在大多数情况下由许多较小的组件组成，而不是一个大组件，这导致了并行执行（并发）。


    组件可以是：


    - 传感器（例如按钮）

    - 执行器（灯泡）

    - A/D 和 D/A 转换器

    - 人机界面


