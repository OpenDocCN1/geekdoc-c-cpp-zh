    ## 3.4.5 Theory: Bit manipulations in C


    The manipulation of bits in an integer is often necessary when programming close
    to the hardware registers. This chapter explains how to manipulate integer variables
    on a bit level in the C language.


    There are six different bit operators in C and all of them operate on integer
    types only. The operators can be used in combination and they are presented in
    table 3.7.


    ## Table 3.7: Bit operators in C


    | Operator | Description |

    |---|---|---|

    | & | Bitwise AND operator |

    | | Bitwise OR operator |

    | ^ | Bitwise Exclusive OR (XOR) complement |

    | ~ | Bitwise NOT operator, also called the 1''s complement operator |

    | >> | Bitwise shift right operator |

    | << | Bitwise shift left operator |


    ## Modifying masks


    A common way of identifying which bits to modify is by using a mask, where the
    targeted bits are “marked” with a ‘1’. For example, “00101101” would select bits
    positions 0, 2, 3 and 5 in the mask variable. Operations on the target with logical
    operators offer a simple method for bit manipulation. The following examples use
    4-bit unsigned integers.


    ### AND (&): clear bit


    To clear a bit (set to “0”), we use the bitwise AND operation. The bits in the
    AND mask must be zero in order to clear the bit, see table 3.8.


    ## Table 3.8: AND operation


    | | | Hexadecimal |

    |---|---|---|

    | target | 0110 | 0x6 |

    | mask | 1010 | 0xA |

    | result | 0010 | 0x2 (target & mask) |


    Where there is a “0” in the mask the result is always “0”, and when there is a
    “1” in the mask target’s bit value is unchanged. In a program, the designer can
    use the following statement to clear bits 0 and 3. In C, this would look like:


    ```c

    target = 0x6;

    result = target & 0xA;

    ```


    Notice that bit position 0 in the target was already “0” before clearing the bits
    in this case.


    ### OR (|): set bit


    To set a bit to “1”, use the bitwise OR operator, see table 3.9.


    ## Table 3.9: OR operation


    | | | Hexadecimal |

    |---|---|---|

    | target | 0110 | 0x6 |

    | mask | 1010 | 0xA |

    | result | 1110 | 0xE (target | mask) |


    Where there is a “1” in the mask bit is set in the result, and where there is
    a “0” in the mask bit is unchanged.


    The syntax in C programming is as follows:

    ```c

    Target = 0x6;

    result = target | 0xA;

    ```


    ### XOR (^): toggle bit


    To toggle a bit, use the bitwise XOR operator, see table 3.10. (A ''1'' in the
    mask toggles target bit).


    ## Table 3.10: XOR operation


    | Binary | Hexadecimal |

    |---|---|---|

    | target | 0110 | 0x6 |

    | mask | 1010 | 0xA |

    | result | 1100 | 0xC (target ^ mask) |


    The C syntax is:

    ```c

    Target = 0x6;

    result = target ^ 0xA;

    ```


    ### NOT (~): inverting


    The simplest operator is negation (NOT). All bits will be changed to the opposite
    value; a a “1” turns into a “0” and vice versa.


    The C syntax is:


    ```c

    Target = 0x6; // (0110)

    result = ~ target;

    ```


    The result will be 0x9 (1001).


