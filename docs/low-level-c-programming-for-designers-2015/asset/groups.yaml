    \ - 100; | c (&temp2); |\n| return (temp); | temp = temp2; |\n| } | |\n\n## 使用\
    \ goto 消除递归\n\n如果函数在代码结尾调用自己（递归），请将递归函数调用替换为跳转到函数开头的 `goto`，参见表 6.16。这消除了函数调用开销，并允许编译器在知道变量在其他处未被使用的情况下进一步优化函数的变量。要使此选项可行，递归调用必须是函数的最后一个操作，且返回不能使用通过递归调用获得的值。换句话之，递归调用后不能有回溯\
    \ [C-opt]。\n\n## 表 6.26: 使用 goto 消除尾递归\n\n# 之前\n\n```c\n/* free list calls itself\
