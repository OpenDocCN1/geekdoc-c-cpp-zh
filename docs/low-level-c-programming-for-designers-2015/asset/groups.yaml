    # Use goto to eliminate recursion


    If a function makes a call to itself (recursion) at the end of its code, replace
    the recursive function call with a goto that jumps to the start of the function,
    table 6.16. This eliminates function call overhead as well as allowing the compiler
    to further optimize the function''s variables, knowing they are not being used
    elsewhere. For this to be an option the recursive call must be the last operation
    of the function and the return must not use a value obtained through the recursive
    calls. In other words, there must be no unwinding after the recursive call [C-opt].


