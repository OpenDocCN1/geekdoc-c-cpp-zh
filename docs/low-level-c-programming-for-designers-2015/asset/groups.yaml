    # Avoid passing by address'
  - '[PAGE 113]


    Avoid taking a variable''s address as function parameter. In code that makes a
    call to such a function, the compiler must make the assumption that the variable
    whose address is used in the call will be modified when the function returns.
    That variable may not be used in optimizations. In addition, variable cannot be
    placed in a register when passed by address, which reduces the access time. Instead,
    write the function to accept the variable''s data, and return the new data if
    it must be modified, see table 6.14 [C-opt].


