    # 3.4.6 Theory: Input and output using keyboard and a terminal window


    Very often a system needs to communicate with a keyboard and/or a terminal window.
    This is typically done via the C-functions printf() and scanf().


    # The printf() function


    The printf()function writes data to the system''s standard output, which typically
    is a terminal window. The printf() syntax is:


    ```

    printf("format string", arg1, arg2, ...);

    ```


    The first argument is a format string and specifies how the data is formatted.
    It can be a string variable or a string constant. Using the backslash characters,
    a ''\''-character followed by another character can provide non-printing characters.
    For example, "\n" outputs a newline.


    The ''%'' character indicates that the next variable from the list of arguments
    following the format string is to be printed at this point. The conversion control
    character indicates what type the variable is, like int or float and so on, see
    table 3.11.


    ```

    int old = 34;

    printf("I am %d",old);

    ```


    The lines above would produce the following printout on the terminal window:


    “I am 34”'
