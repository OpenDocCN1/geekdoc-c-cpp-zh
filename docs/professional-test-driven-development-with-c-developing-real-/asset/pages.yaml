  md: 'Base classes also have some say in how their functionality is consumed by the
    derived class. The base class can declare or all of its methods as abstract methods.
    This means the derived class must provide its own implementation based on the
    interface defined in the base class.


    Inheritance clearly gives developers a lot of power to reuse and leverage code.
    It is important, to make sure that inheritance is not overused. Deep inheritance
    can introduce new types of complexities. They can end up making the code brittle
    and difficult to change as simple as a unit of logic in the middle of the hierarchy
    to be altered. In some cases composition over inheritance is preferable. For example,
    an entity called PayableEmployee had been inserted into the Employee hierarchy
    (Figure 3-2).


    ![](img/15cb6759e167a2d15e60bc37de753a62_53_0.png)


    FIGURE 3-2


    In this hierarchy, the logic that computes employee''s payroll is encapsulated
    in the PayableEmployee class. But what happens if the likely event that the business
    decides to pay each employee type on a different algorithm? Should more classes
    be introduced into the class hierarchy? Would that solve the problem at hand,
    but what if there was logic in the payment algorithm that could be partially shared
    between the classes? Do you add another layer of inheritance to account for this?
    Before long the class hierarchy, even for something as this example would become
    hopelessly complicated.


    A better strategy would be to use composition. Instead of putting the logic to
    pay employees in a class in the Employee hierarchy, I will define a standardized
    interface to a payroll computation module called EmployeePayrollService. The Employee
    class will include a protected member variable that can hold a class that implements
    the EmployeePayrollService interface (Figure 3-3).'
