- img_proc: true
  md: "mock objects that are not in your control, such as third-party libraries or\
    \ even parts of the .NET framework.\n\nThe following code is very similar to the\
    \ Rhino Mocks syntax:\n\n```\n// Arrange\nItemRepository repository = Isolate.Fake.Instance<IItemRepository>();\n\
    Isolate.Called(() => repository.GetById(2)).WillReturn(null);\n\n// Act\nItemPresenter\
    \ presenter = new ItemPresenter(repository);\nItemType item = presenter.GetItem(2);\n\
    \n// Assert\nAssert.IsNull(item);\n```\n\nTypeMock.cs\n\nThe true power of TypeMock\
    \ comes into play when you don't have an interface and need to mock something\
    \ like DateTime.Now. Consider the following code. It has a method IsExpired that\
    \ looks at a constant value of 11/21/1981 and compares it to DateTime.Now to see\
    \ if the item is expired:\n\n```\npublic class Item {\n    private DateTime EXPIRATION_DATE\
    \ = new DateTime(1981, 11, 21);\n\n    public bool IsExpired() {\n        bool\
    \ tmpRtn = false;\n\n        if (DateTime.Now > EXPIRATION_DATE) {\n         \
    \   tmpRtn = true;\n        }\n        return tmpRtn;\n    }\n}\n```\n\nTypeMock.cs\n\
    \nYou could use logic to abstract your call to DateTime.Now and pass a date into\
    \ the IsExpired method. Using TypeMock you can mock DateTime.Now and ensure that\
    \ your IsExpired method is checking for expired dates.\n\nIn the following Isolated\
    \ test, when DateTime.Now is called, a new date is returned. In the first test\
    \ it is an expired date, and the second test returns a nonexpired date:\n\n```\n\
    [Test, Isolated]\npublic void Item_Should_Be_Expired() {\n    Isolate.Called(()\
    \ => DateTime.Now).WillReturn(new DateTime(1981, 11, 22));\n```"
  merge: -1
