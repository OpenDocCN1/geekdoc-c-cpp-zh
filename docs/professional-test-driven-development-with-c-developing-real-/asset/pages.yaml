  md: '# 172 | CHAPTER 8 INTEGRATION TESTING


    integration tests and end-to-end tests in this is little less complicated, because
    external resources are an integral part of these tests.


    The external resource most commonly used by integration tests integration and
    end-to-end tests is a database. The need to have a consistent testing environment
    for integration and end-to-end tests means that before these tests are run, the
    data in the database must be placed in a specific state. In the example used in
    this chapter it uses Fluent Hibernate for my integration tests burns and rebuilds
    the database for each test run. The efficiency of this approach is debatable,
    but you can be assured that your database is in a consistent state when the test
    is run.


    In cases where you are using an ORM, or when the burn/reload approach is impractical,
    you need to build some rollback action to ensure that your tests always run in
    a consistent environment. This can take a couple places and time to perform this
    database cleanup during the initialization of the test. This ensures that your
    environment is in the correct state to execute your tests.


    In cases it may be better and more practical to run a reset script or procedure
    at the end of your test. In these cases you need to be sure to structure your
    test so that this script or procedure runs every time the test, regardless of
    the success or failure. In these cases, you would need to run this script as you
