    executing, and interrogating tests. Unit test frameworks like NUnit sought to
    provide these features. Unit test frameworks provide a unified programming model
    to define your tests as simple classes with methods that the application could
    use to want to. Developers do not need to write their own test harness; the unit
    test frameworks provide test runners that allow you to execute all your tests
    with the click of a button. With a unit test framework, you can easily insert,
    set, and tear down functionality around your tests. When a test fails, the test
    runner provides you with information about the failure, any exception information
    that is available and a stack trace.


