    \ sure the application should behave and how that behavior is different from how\
    \ the application currently functions. After the business rules have been revalidated,\
    \ you start by writing a test. With new features, this test should fail. A nonailing\
    \ test may indicate that you are testing the correct thing. The test should expose\
