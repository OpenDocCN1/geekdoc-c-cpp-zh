    # Polymorphism


    Polymorphism may be the most misunderstood tenant of OOP. Polymorphism is the
    concept that although two classes share the same behavior, they can implement
    behavior in different ways. Polymorphism is somewhat related to inheritance and
    the relationships between classes that it creates.


    For example, in the Employee example just discussed, the Hourly, Salary, and Seasonal
    employee classes may all inherit from the Employee base class an abstract method
    called ComputePay.(An abstract member is a member where the interface is declared
    in the base, but the derived class must provide its implementation.) The ComputePay
    method can call the appropriate method or methods on the class''s instance of
    the IEmployeePayrollService described in the previous section on Inheritance


    Although the interface for this method would be identical to all three derived
    classes, they use it to determine the employee''s pay very different. Salary employees
    would have a set number based on their salary. Hourly and seasonal employees would
    have an hourly rate that is multiplied by the number of hours they worked in the
    last pay period. However in our example, hourly workers receive time and half
    for overtime, seasonal workers do not. Each of the ComputePay method returns a
    dollar amount for the employee''s paycheck, but they use different means to arrive
    at that number.


    The real power of polymorphism is realized when any class derived from the Employee
    base class regardless of its actual concrete implementation. When payday arrives
    at the company used in our example, the payroll system needs to issue checks for
    all employees. The system simply needs to iterate through the list of employees
    and call ComputePay on each one. It doesn''t need to know what type of employee
    it is computing the paycheck amount; for the concrete type has the specific implementation
    it needs. The application simply must collect the number that the method returns.'
