  md: "# The Green Phase\n\nIf your test is failing, you are in the red phase. The\
    \ key to getting to the green phase is to write just enough code to make your\
    \ new test pass without causing any of the other tests to fail. The concept of\
    \ writing \"just enough\" code to make a test pass is another philosophical hurdle\
    \ that developers new to TDD struggle to get over.\n\nFor example, suppose you\
    \ have a requirement that makes it necessary to add a new method to an existing\
    \ service. The rest of the requirement states that, given an input value of 61,\
    \ the new method should return false. Many developers do not practice TDD would\
    \ agree that the following code example would be the least amount code necessary\
    \ to make the test pass:\n\n```\npublic bool MyMethod(int SqlParameter)\n{\n \
    \   if (inputParameter == 61) {\n        return false;\n    }\n    return true;\n\
    }\n```\n\nIt's perfectly reasonable to assume that this is what the method should\
    \ do, but this is not the least amount of code to make the test pass. The requirement\
    \ test do not state anything about a condition to make the method return true;\
    \ the code only says that in situations where SqlParameter equals 61, it should\
    \ return false. The code shown here may fact look like what the final version\
    \ of this method should be. But unless a test is created to verify a situation\
    \ in which a value of true is returned, you shouldn't assume anything.\n\nThe\
    \ following code illustrates the absolute minimum amount of code needed to make\
    \ the test pass:\n\n```\npublic bool MyMethod(int SqlParameter)\n{\n    return\
    \ false;\n}\n```\n\nLooking at this implementation, it may seem incomplete. It\
    \ certainly looks unfinished; the method expects a value for SqlParameter but\
    \ doesn't use it. The point of this exercise is to ensure that you are writing\
    \ just enough code to make the test pass, and thus complete the business requirement.\
    \ If the only current documented requirement is that method return false when\
    \ the value of SqlParameter is false, then the previous example does meet the\
    \ business requirement. As more requirements for this feature or functionality\
    \ are fleshed out, more tests will be created. These additional tests will cause\
    \ you to expand on the functionality of this method. As this method grows, it\
    \ may be appropriate to add more branches to the if statement. On the other hand\
    \ a more complex algorithm may be needed. The point is to not introduce complexity\
    \ to your code until unless you need to.\n\nAs soon as enough code has been created\
    \ to make the tests pass, you're ready to enter the refactoring phase."
