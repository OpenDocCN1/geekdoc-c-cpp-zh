    \ Web Form is now implemented. Before I show you the glue code for wiring all\
    \ this together, I want to briefly explain the concept of helpers.\n\n# Helpers\n\
    \nHelper methods help other methods perform tasks. Usually they are common tasks\
    \ shared between other methods in your application. For example, on the web it's\
    \ common to truncate text to a set of characters and append ellipses to the end\
    \ to indicate that the text has been truncated. This type of method is not specific\
    \ to the Read book view; it can be used with any other view in this application,\
    \ so you would create an HTMLHelper class that contains a truncate method to help\
    \ you display text in this manner. If I haven't said it before, I say it now:\
    \ TDD is about repetition. You start by creating a test for the Truncate method:\n\
    \n```\npublic class when_using_the_html_helper_to_truncate_text : Specification\n\
    {\n    protected string _textToTruncate;\n    protected string _expected;\n  \
    \  protected string _actual;\n    protected int _numberToTruncate;\n\n    protected\
    \ override void BecauseOf()\n    {\n        _actual = HTMLHelper.Truncate(_textToTruncate,\
    \ _numberToTruncate);\n    }\n}\npublic class_and_passing_a_string_that_needs_to_be_truncated\
    \ :\n    when_using_the_html_helper_to_truncate_text\n{\n    protected override\
    \ void Establish_context()\n    {\n        _textToTruncate = \"This is my text\"\
    ;\n        _expected = \"This...\";\n        _numberToTruncate = 5;\n    }\n}\n\
    [Test]\npublic void then_the_text_should_be_truncated_with_ellipses()\n{\n   \
    \ _expected.ShouldEqual(_actual);\n}\n```\n\nNext, you implement code to get the\
    \ test to pass:\n\n```\npublic static string Truncate(string input, int length)\n\
    {\n    if (input.Length <= length)\n        return input;\n\n```"
