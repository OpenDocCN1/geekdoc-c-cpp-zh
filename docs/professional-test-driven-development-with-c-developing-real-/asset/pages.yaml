    # Allow Type Inference\n\nMost languages on the .NET platform are statically typed.\
    \ This means the developer must declare each variable as being of a specific type.\
    \ C# 3 introduced the concept of type inference to .NET. This simply means that\
    \ although C# is still a statically typed language, developers can allow the compiler\
    \ to determine what type a variable should be based on how it is initialized.\
    \ But this type inference does not happen at runtime; if the compiler cannot determine\
    \ the type when the application is compiled, it generates an error.\n\nType inference\
    \ is done in C# using the var keyword. Instead of declaring your variable as being\
    \ of a specific type, you declare it as:\n\n```\nCustomer declaredAsCustomer =\
    \ new Customer(); //declared with a specific type\nvar typeInferredCustomer =\
    \ new Customer(); //declared using the var keyword\n```\n\nBoth declaredAsCustomer\
    \ and typeInferredCustomer are instances of the Customer class and behave in the\
    \ exact same way. The difference is that you don't have to specifically tell the\
    \ compiler that typeInferredCustomer is a Customer object.\n\nThe benefit of the\
    \ var keyword is that it generates code that can be more readable; some developers\
    \ view the simple declaration of a variable as line noise. The var keyword minimizes.\
    \ Refactoring can be easier with variables declared using var, because the compiler\
