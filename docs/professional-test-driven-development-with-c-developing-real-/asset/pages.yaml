- img_proc: true
  md: 'Overview” above. Therefore at this point you should be trying to remain technology-agnostic
    while defining the users’ interaction with the system in broad terms.


    Gathering the information needed to create these stories and reengaging with the
    business to validate them can be one of the most difficult tasks on an application
    development project. Developers tend to think first. Business users are usually
    not as technologically savvy as the development team. To engage these users, it''s
    important to communicate with them in a language, setting, and manner that makes
    them comfortable. For that reason, if your team has access to a business analyst
    (BA), I highly recommend taking advantage of this person''s skill in gathering
    the user stories.


    > Unfortunately, not all development teams have a BA on staff. In these cases
    it''s up to the architect, lead developer, or even just members of the development
    team to work with the project manager (PM) to engage the business and define the
    user stories. The important thing at this stage is to communicate in some manner
    with the business.


    There are many techniques that can be used to communicate with the business and
    get the needed information to create the user stories. Some techniques are very
    intrusive, while others are more passive. The three most common (from intrusive
    to passive) are shadowing, client interviews and joint application design (JAD)
    sessions.


    Client interviews can be helpful as they allow the developer (or PM) to communicate
    one one with the business user. A client interview is simply an opportunity to
    sit down with the business user in a distraction environment (or as close to distraction
    as possible) and ask them questions about the application. These can be one-on-one
    or in a group interview. Client interviews can be a formal question and answer
    session, an informal conversation or maybe a demo by the the existing system.
    In many cases they also give the developer an opportunity to see how the business
    user currently does or her job. This can provide invaluable information to the
    developer when it comes to creating user stories. Client interviews also have
    the benefit of having relatively low impact on the business users (remember, they
    have their own jobs to do in addition to helping you define user stories). An
    issue with relying on client interviews is that you will receive conflicting information
    from different users. In this case it''s important to reengage the business users
    who provided the conflicting information and try to reach a resolution.


    The client interview represents to a high medium when it comes to gathering requirements
    from users. At one end of the spectrum is shadowing the business users for a period
    of time. Shadowing simply means following the users for a period of time and observing
    them their work. Shadowing lets you learn about the business problem domain things
    that would never have come up in a client interview. On the other hand, shadowing
    can be an extreme inconvenience to both the business users and the developer.
    Furthermore, issues arise when business users must perform actions where a security
    risk would be created by allowing a developer to shadow them. For example, a nurse
    works with private'
  merge: -1
  pgno: 125
- img_proc: true
  md: '# 122 | CHAPTER 6 STARTING THE SAMPLE APPLICATION


    patient information and treats patients. Under HIPAA rules, a developer, or anyone
    else, for that matter, cannot be in a position where he or she could inadvertently
    learn private patient information or be privy to a patient''s ailment or course
    of treatment. Shadowing can be used in extreme cases, but not the disruptions
    it can cause.


    At the other end of the spectrum is gathering all the business users at once and
    collecting a set user stories in one large JAD session. These JAD sessions can
    be multiday affairs with all the business users or, in the case of large systems,
    representatives of all user groups. JAD sessions usually take place to minimize
    disruptions. The benefit of a JAD session is that all the disparate units are
    present, so conflicts that would otherwise exist after client interviews or shadowing
    can be dealt with immediately. This process can also be helpful for business users
    in understanding the needs of other parts of the business and how those needs
    relate to their own. JAD sessions can be very disruptive to the business users
    because they are required to spend several working days with the development team
    to review user stories and not doing their normal jobs. Depending on what business
    users do, this may be impractical. A way to alleviate this problem is to spread
    JAD sessions so that they are not on consecutive days.


    The user stories themselves should be descriptions of a user''s interaction with
    the application. Effort should be made to keep the individual user stories isolated
    from each other as possible. But in the interest of keeping the user stories short
    and comprehensible, it''s perfectly acceptable to have one user story where one
    ends and branches off. Above all, the user stories are easy for business users
    and development staff to understand. They should add business value to the system
    and be something that users can test as soon as the development team has completed
    the features necessary to satisfy the user.


    The goal of all three approaches is to gather a set of user''s stories. For example,
    a user story for the OSIM application called "Logging in Inventory of Items" might
    read like this:


    Once the new inventory has been received and counted, an authorized user logs
    into the OSIM system using the OSIM log page. Once the user has logged in they
    select the item "log in new inventory" in the navigation menu. The application
    takes the user to the add inventory page. The user selects the type of inventory
    from the item list and inputs the quantity received in the quantity text box.
    The user then clicks the "save" button and the inventory count is updated and
    the page controls cleared out to allow the user to enter more inventory.


    If the item type does not exist in the list of item types, a new item type must
    be added. Refer to the user story "Adding new Item Types." If the user attempts
    to input a non-numerical value into the quantity field, the application should
    not allow it. If the user clicks the "save" button, but has not selected an item
    type from the list or added a quantity that is more than zero, the page should
    inform the user that the information is invalid and direct them to fix the errors
    and save again.


    # Defining the Product Backlog


    In short, the product backlog (PB) is simply a list of work that needs to be done
    to complete an application. Once user stories are created to define the business
    requirements, they are decomposed into features that will be assigned to a developer.
    Some development teams elect to pick individual'
  merge: -1
  pgno: 126
- img_proc: true
  md: 'features into a PB. Other teams put whole user stories in the PB and allow
    the developers to develop the individual features of the agile story as they think
    best. Neither approach is right or wrong. It''s a question of what works best
    for your development team on any given project.


    A feature is a unit of work that provides value to the system by satisfying a
    functional requirement without violating nonfunctional requirements. Multiple
    user stories may refer to the feature. For example, multiple user stories may
    mention the user''s logging into the application. Creating a log page may be a
    feature derived from these user stories, but each user story presumably does not
    own its own log. The log in page will satisfy a requirement of each user story
    that references logging. There is no need to create a separate feature for each
    user story.


    Another aspect of a feature is that it can be tested. Some way to verify that
    the feature works correctly without a user''s having to run the application in
    a debugger or use a SQL script to determine if an entity was changed. Certain
    infrastructure tasks don''t directly influence the user''s perception of the system
    must be performed in an application. As many of these as possible should be done
    in Iteration Zero (described in the next section).


    Users are assigned work from the PB prioritized by the business with guidance
    from the PM and architect. In agile processes, the features in the PB are represented
    by story or feature cards, which the PM keeps a master list of. Although many
    tools can be used to maintain PB lists, Microsoft Excel is still the most popular
    tool for this purpose. Managing the PB is covered in the next section.


    # THE AGILE DEVELOPMENT PROCESS


    All agile processes are different. A variety of branded agile methodologies are
    available. However, many development shops found it preferable to use these as
    starting points, modify the process to suit their particular needs, and keep any
    prepacked methodology. In fact, most branded methodologies encourage this by providing
    a set of core values and a mechanism known as a retrospective to change the process
    around these core values. Ultimately, every agile process differs in some way
    to suit the needs of the development staff, Enterprise, or project methodology
    is being used in.


    Remember that this book is not about agile development. Agile development is discussed
    here to provide a framework for the use of TDD because most agile development
    methodologies rely heavily on the benefits of TDD.


    All agile processes are slightly different, but some common themes and values
    permeate the agile landscape. A framework defines agile practices. While changing
    and tweaking agile processes is encouraged, it''s generally a good idea not to
    stray too far from these core principles.


    Most agile processes focus on the idea of small, easy-to-manage-and-understand
    units of work done in short iterations. These units of work should be focused
    on a specific, testable feature of the system. The testability aspect is very
    important. Another core principle in agile is to get software in front of users
    as quickly and often as possible. If a feature cannot be tested by either a QA
    tester or a business user, the feature''s value is questionable.'
  merge: -1
  pgno: 127
- img_proc: true
  md: '# Estimating


    By their nature, estimates are always wrong. Agile methodologies do not obfuscate
    or deny this fact; they embrace it. In many older methodologies, the estimates
    were usually done by a PM or a leader. In some cases a lead developer may have
    been involved, but for the most part the estimate was not done by the people who
    would actually perform the work. It''s difficult for most people to accurately
    estimate their own productivity. Doing so for others is an exercise in futility.
    Agile methodologies advance the idea that the people doing the work should provide
    estimates.


    Moreover, as time goes, estimates can and should be adjusted based on the growing
    body of knowledge about the business problem domain and the application itself.
    In 1981 Barry Bohemia a concept that would become the basis of a phenomenon known
    as the Cone of Uncertainty. This concept was first proposed to software development
    by Steve McConnell in 1997 Software Project Survival Guide (Microsoft Press, ISBN:
    9781572316218). The Cone of Uncertainty as it applies to software development
    states that estimates made at the beginning of a project will be inaccurate by
    a factor of 4. The actual work required to complete a feature could be as little
    as 25% of the actual estimate or as much as 400% of that. As the project continues,
    the estimate of work needed to complete the feature becomes more accurate. It
    is entirely accurate when the feature is complete.


    For software development teams, this means that the estimate for a given feature
    made at a project''s inception could be off by much as 400%. In most methodologies
    these radically estimates are baked into a project plan, taken as good, and later
    used as a metric to measure the project''s success or failure. In reality, this,
    especially one done at the beginning of the project, is the developer''s best
    guess based on the information available at that time. In most cases it is incomplete,
    and likely to change.


    A more logical approach is to periodically re-estimate the features in the PB.
    These new estimates are based on actual knowledge the development team has gained
    working in the application for a period of time. While still to be inaccurate,
    these estimates will be closer to the previous estimate. This reassessment allows
    the PM to refine the project plan and provides a more accurate judgment of whether
    the development team is on track.


