    \n# Using the MVC Contrib Project\n\nThe open source MVC Contrib project can be\
    \ found at http://mvccrib.codplex.com/. This project adds a great degree of functionality\
    \ to the ASP.NET MVC framework and is useful for MVC developers. The MVC Contrib\
    \ project includes features to help with unit testing and much more. The MVC Contrib\
    \ project fills gaps in the ASP.NET MVC framework. The MVC Contrib project is\
    \ a must-have for anyone who is looking to develop ASP.NET MVC applications.\n\
    \n# ASP.NET MVC Summarized\n\nASP.NET MVC requires a different way of thinking\
    \ when you are developing applications on the Microsoft stack. At first it can\
    \ be a bit overwhelming due to the number of new tools and concepts you need to\
    \ understand the simplest web application. After you learn the basics, you will\
    \ realize that using the ASP.NET MVC framework forces you and your coworkers to\
    \ create clean code that is easy to read, test, and maintain.\n\n# WORKING WITH\
    \ JAVASCRIPT\n\nMany developers have a love-hate relationship with JavaScript.\
    \ In most situations, web developers don't hate JavaScript per se; they hate the\
    \ Document Object Model (DOM) in most web browsers. In recent JavaScript frameworks\
    \ such as jQuery and Prototype have relieved the pain that the DOM has caused\
    \ web developers. These frameworks make it easier for you to work with the DOM\
    \ and reduce the number of tests you need to create to test your JavaScript. Remember,\
    \ you don't need to test the framework.\n\nOne of the most common mistakes web\
    \ developers make when it comes to JavaScript is not abstracting their logic into\
    \ different files. Many developers chuck everything into one script file or"
  merge: -1
  pgno: 220
- img_proc: true
  md: "duplicate functionality over many different pages. They don't realize that\
    \ testing frameworks exist for JavaScript, or that you can create JavaScript using\
    \ TDD methods.\n\nJavaScript is a real language, and code should be treated as\
    \ such. Rules that you have learned about SOLID apply to JavaScript. When JavaScript\
    \ code is created in this manner, it is easy to test and maintain. Some web developers\
    \ claim that an HTML page is required to download multiple JavaScript files loads,\
    \ they are correct. Using techniques such as combining and minifying during the\
    \ build process resolves these slow page load issues. Testing performance is a\
    \ different topic; now I will focus on creating testable code.\n\n# JavaScript\
    \ Testing Frameworks\n\nAs most languages, multiple frameworks allow you to test\
    \ your JavaScript code. Frameworks as qUnit, Screw Writ, and jest are all open\
    \ source frameworks that act similarly to nUnit but are designed for testing JavaScript.\
    \ The examples here use qUnit — the testing framework that the jQuery team selected\
    \ to test its JavaScript framework. qUnit has been around for some time, and because\
    \ of the success with the jQuery project, it has a large following. When one source\
    \ projects have high followings, you can find documentation and file bugs and\
    \ get frequent updates.\n\nIn these examples of TDD with JavaScript, you will\
    \ look at something a bit more complicated than any JavaScript you would be testing\
    \ in the previous applications covered in this chapter. Most of the JavaScript\
    \ you add in these applications would be considered good code, and testing would\
    \ occur during the integration or functionality testing.\n\nThe following example\
    \ shows how JavaScript represents a bank account. This object holds the current\
    \ balance, and a function transfers funds between two accounts. The first step\
    \ is to set up the qUnit framework. Doing so is fairly simple. Figure 9-15 shows\
    \ the directory set for this application. It includes jQuery, qUnit JavaScript,\
    \ and the qUnit style sheet. You create your tests in the js folder.\n\nWhen the\
    \ framework is ready, you can write your first test. qUnit tests are run in JavaScript,\
    \ and the runner is contained within the HTML. In just like C# or Visual Basic,\
    \ you should keep separate files for each object you are testing. In this case,\
    \ you test the account object, so you create Accounts.html, which will contain\
    \ all the tests for the account object that you create.\n\nWith other testing\
    \ frameworks, you will want to write your test to describe what the test is trying\
    \ to accomplish. In this example, you just want to create an account object that\
    \ has an account number as a balance:\n\n```\n<script type=\"text/javascript\"\
    >\ntest('Create_Account_Account_Object_With_Balance', function() {\n  var checkingAccount\
    \ = new Account(564858510, 600);\n  equals(checkingAccount.Balance, 600);\n});\n\
    </script>\n```\n\n![](img/15cb6759e167a2d15e60bc37de753a62_221_0.png)\n\nFIGURE\
    \ 9-15"
