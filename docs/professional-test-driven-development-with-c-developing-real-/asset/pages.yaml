  md: "# THE DEPENDENCY INJECTION OOP\n\nIn a traditional application designed, you\
    \ create service and entity classes to abstract real-world processes and entities.\
    \ An application is then composed of these various service and entity classes.\
    \ This composition creates dependencies between the classes in your applications.\
    \ The most obvious way to express and manage these dependencies is to statically\
    \ create them in code as part of your class's initialization process (This example\
    \ can be found in the Before folder in the downloaded code sample at www.wrox.com).\n\
    \n![](img/15cb6759e167a2d15e60bc37de753a62_103_0.png)\n\n```\npublic class BusinessService\
    \ {\n    private readonly string _ConnectionString = ConfigurationManager.ConnectionString(\"\
    MyConnectionString\").ConnectionString;\n    private readonly string _webServiceAddress\
    \ = ConfigurationManager.AppSettings[\"MyWebServiceAddress\"];\n    private readonly\
    \ LoggingDataSink _loggingDataSink;\n    private DataAccessComponent _dataAccessComponent;\n\
    \    private WebServiceProxy _webServiceProxy;\n    private LoggingComponent _loggingComponent;\n\
    \    public BusinessService() {\n        _loggingDataSink = new LoggingDataSink();\n\
    \        _loggingComponent = new LoggingComponent(_loggingDataSink);\n       \
    \ _webServiceProxy = new WebServiceProxy(_webServiceAddress);\n        _dataAccessComponent\
    \ = new DataAccessComponent(_databaseConnectionString);\n    }\n}\n```\n\nBusinessService.cs\n\
    \nSeveral problems occur when this method is used to handle dependencies between\
    \ classes. The most obvious problem is that this class is statically bound to\
    \ the specific concrete implementations you used when writing this. There is no\
    \ way to change the object used without opening the code. This static binding\
    \ also makes it impossible to substitute mock objects for any of the dependencies,\
    \ which makes isolating any of the code in this class's methods for unit testing\
    \ of the code.\n\nThis point is further complicated by the fact that these dependencies\
    \ are contract-based. Instead, they rely on specific definitions of classes. Relying\
    \ on concrete classes instead of abstract interfaces limits your ability to swap\
    \ out services. To open this class for alteration (by definition of the Open/Close\
    \ Principle [OCP]), you must be able to replace the dependencies with classes\
    \ that support the same API or to make significant changes to this class.\n\n\
    The last major problem with this approach is that BusinessService is required\
    \ to know far too much about the classes it depends on to create instances of\
    \ them. It must know that DataAccessComponent requires a connection string, that\
    \ WebServiceProxy requires a service address, and that LoggingComponent requires\
    \ a data sink for its messages. This violates the SRP, because the knowledge to\
    \ create these classes must surely exist elsewhere in the application."
