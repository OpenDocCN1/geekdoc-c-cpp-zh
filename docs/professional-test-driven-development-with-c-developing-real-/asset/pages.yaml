  md: 'CHAPTER 5 MOCKING EXTERNAL RESOURCES


    # # ABSTRACTING THE DATA ACCESS LAYER


    Most business applications use some sort of data store. It could be a traditional
    Database Management System (DBMS), a text or binary file, a web service, or some
    other mechanism for persisting data. Data manipulation and persistence are the
    focus of what of you will do as a business developer. When writing unit tests,
    it''s important that you isolate code being tested, even code that needs to be
    involved in accessing data. The repository patterns you use abstract the components
    of your application that are responsible for accessing external data stores from
    your business logic and thus create isolated tests for that business logic.


    # ## Moving the Database Concerns Out of the Business Code


    .NET 1.0 was released, it featured an update to Microsoft''s ActiveX Data Object
    (ADO) framework called ADO.NET was not simply a .NET port of ADO; it added many
    features designed to allow developers to quickly and easily work with classes
    and objects. As such, early users of ADO.NET adopted a "smart object" architecture
    which was self-persisting. More often than not this embedding a bit of ADO.NET
    code within the class itself using either data readers or datasets to retrieve
    and store data to the database.


    Although this did create a code base where developers could quickly and easily
    develop these self-persisting objects, it caused many other issues. Having the
    data access logic distributed throughout the application created many maintenance
    problems, changes to how one class was to be handled by the database rarely isolated
    to that class. Because of this, no single point of failure could be built around
    database access. Changes and defects in how data access was accomplished sometimes
    required extensive renovation of the application code.


    This also raised issues in systems with complex relationships between classes.
    In some situations a class couldn''t properly instantiate itself without also
    instantiating several objects. This created a problem similar to the issues in
    the previous section, where the logic and rules around how specific concrete objects
    are became fragmented and spread throughout the application. It was impossible
    to violate the SRP and have a working system in these cases.


    Finally, this pattern made isolated unit testing a nightmare, if it was possible
    at all. The tightly embedded ADO.NET code could not be quickly or easily decoupled
    from the business logic. This made providing mock objects for these database connection
    points difficult, if not impossible.


    # ## Isolating Data with the Repository Pattern


    Eventually developers decided that although smart objects could be helpful, it
    was a bigger benefit to move the data access logic away from the business entities.
    Doing so created a decoupling that allowed the business development to proceed
    and evolve independently from data access and data store development. This independence
    meant that the back-end data store could change, sometimes in dramatic ways, and
    the business domain logic and entities were insulated from these changes. This
    loose coupling made it easier for developers to write isolated unit tests for
    their business logic.


    108'
