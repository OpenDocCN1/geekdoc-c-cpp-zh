- img_proc: true
  md: "discussed so far is the lack of Setup and Teardown method attributes. Keeping\
    \ with the simplistic theme of xUnit, you use the constructor and a dispose method\
    \ of your test class when you need to implement setup and teardown functionality.\n\
    \nBased on the knowledge of NUnit you have gained in previous chapters, the following\
    \ code example should look similar. xUnit tests have an attribute of Fact. The\
    \ [Fact (Timeout = 20)] attribute is useful when you need to ensure that a method\
    \ returns within a specified time.\n\n```\n[Fact]\npublic void AddTest()\n{\n\
    \    int expected = 10;\n    int actual = MathStuff.Add(5, 5);\n    Assert.Equal(expected,\
    \ actual);\n}\n\n[Fact (Timeout = 20)]\npublic void TimeoutTest()\n{\n    System.Threading.Thread.Sleep(40);\n\
    \    Assert.Equal(1, 1);\n}\n```\n\nFor more information about the minimalist\
    \ syntax of xUnit, see the syntax comparison chart of NUnit, MBUnit, MSTest, and\
    \ xUnit found on the xUnit project page on Code Plex at http://xunit.codeplex.com/wikipagetitle=Comparisons&ProjectName=xunit.\n\
    \n# MOCKING FRAMEWORKS\n\nChapter 2 discussed the basics of mocking objects, and\
    \ throughout this book we have been using the Moq framework because of its simple\
    \ syntax. Mocking is a popular mocking framework, but it is not the only framework\
    \ available. Other frameworks allow you to check out mock objects differently.\n\
    \nMoq uses a declarative syntax for mocking objects, which is different from the\
    \ record/playback method of mocking that mocking frameworks supports. Many of\
    \ these frameworks are moving away from the record/playback method in favor of\
    \ an arrange, act, and assert (AAA) method because of its ease of use.\n\n# Rhino\
    \ Mocks\n\nRhino Mocks is a free framework created by Orin Eini, who is also known\
    \ for his work on nHibernate and Castle projects. Rhino Mocks is popular because\
    \ of its ease of use and list of power features. Rhino Mocks supports two different\
    \ styles of mocking objects: the record/playback method and the arrange, act,\
    \ and assert syntax. Record/playback is now considered to be the older way of\
    \ mocking objects, but it makes sense to consider the differences."
