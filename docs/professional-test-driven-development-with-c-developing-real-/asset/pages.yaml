  md: "To make this a Fluent NHibernate mapping class, you need to add other using\
    \ statements for the OSIM.Core.Entities namespace (where the declaration of ItemType\
    \ is located) and the FluentNHibernate.Mapping namespace (where the definitions\
    \ of the FluentNHibernate mapping classes are located). Then you need to change\
    \ the declaration of the ItemTypeMap class so that it inherits from the ClassMap<T>\
    \ Fluent NHibernate base class. ClassMap<T> is a generalized class, and you need\
    \ to pass in the type that you want this class to be (a map) — in this case, ItemType\
    \ — as your generic type parameter:\n\n```\nusing FluentNHibernate.Mapping;\n\
    using OSIM.Core.Entities;\n\nnamespace OSIM.Persistence.Mappings\n{\n    public\
    \ class ItemTypeMap : ClassMap<ItemType>\n    {\n    }\n}\n```\n\nFluent NHibernate\
    \ expects a default constructor in every mapping class that provides the mapping\
    \ information for the entity that is being mapped by the mapping class. Here's\
    \ how you add that to ItemTypeMap:\n\n```\npublic class ItemTypeMap : ClassMap<ItemType>\n\
    {\n    public ItemTypeMap()\n{\n}\n```\n\nBefore you create the mapping for ItemType,\
    \ let's revisit the definition of that class. Here is the current definition of\
    \ ItemType:\n\n```\nnamespace OSIM.Core.Entities\n{\n    public class ItemType\n\
    \    {\n        public virtual int Id { get; set; }\n    }\n}\n```\n\nRight now,\
    \ there's not much to it. In fact, the only field in ItemType is the Id field,\
    \ which serves as the entity’s primary key. The reason for this somewhat anemic\
    \ definition is that the current unit"
