    # Creating the Fluent NHibernate Mapping


    The next step is to create the object-to-data mapping for the ItemType class.
    Fluent NHibernate, like all ORM frameworks, requires a mapping of sort that instructs
    the ORM how to translate the public fields in a class to a data table. Traditional
    NHibernate uses XML files which can be difficult to understand and prone to defects.
    Fluent NHibernate is an extension to the NHibernate framework that enables developers
    to create mappings in C# or VB.NET. This is a major benefit over traditional NHibernate
    mappings. For one thing, most developers are more familiar and comfortable with
    C# or VB.NET. Working in the language that you are more comfortable and skilled
    in is always better. Because the mapping files are compiled as opposed to being
    read at runtime, fewer errors occur in Fluent NHibernate mappings.


    FIGURE 8-4


    The location of these mappings is important. Although they are dependent on the
    entity types of the OSIM application, are technically part of the persistence
    layer. For that reason, I like to keep them with the repository and other persistence
    logic in the OSIM Core project.


    > Why might you be asking yourself right now “Why is he putting the persistence
    logic in the core domain project?” As developers we’re taught to separate all
    the pieces of the application into separate assemblies. The reason given for this
    is that when a change is made one assembly can be easily swapped for another.
    In fact this ad hoc “plug-and-play” ability with assemblies is a bit overrated.
    In many cases, not how much mapping and abstraction you introduce into your application
    code base, changes to assembly always require changes in most, if not all, of
    the other assemblies.


    What does this have to do with keeping the persistence logic in the core domain
    project? The answer is simplicity, applications should be architected to keep
    divergent services, such as data access and presentation. But, along with all
    architectural choices comes a cost, I see the value of keeping my presentation
    logic separate from my domain services as being greater than the cost (in complexity)
    I incur by separating them. For a small department application, like the OSIM
    application in the example, I don’t see the benefit of separating the domain services
    and the persistence logic as outweighing the cost (again, in complexity) I incur
    by separating them.


    True, this application could be architected to keep the persistence logic in its
    own assembly. But doing this would require other changes in the architecture to
    remove the potential for circular dependencies. And in large'
