  md: '# Introducing Dependency Injection to Your Service


    Even though the code in the InventoryService is very simple, it still needs to
    be tested. A fundamental barrier to testing the InventoryService is that it''s
    dependent on an implementation of the ITypeService interface, but currently there
    is no way to inject an instance of an object that implements the ITypeService
    interface. This means that the test is dependent on whatever implementation of
    the ITypeService is provided by the statically bound Ninject modules.


    WCF service applications share a similar trait with ASP.NET applications and Windows
    Forms/WPF applications in that the instantiation of WCF services, and ASP.NET
    pages, and Windows forms is performed by the .NET runtime. This limits what can
    be done in terms of instantiation of these objects without delving into the .NET.
    In response to the desire of more and more developers to use dependency injection
    with these objects, Microsoft has built some hooks into the .NET runtime that
    will enable you to use dependency injection with these types of objects.


    Ninject has a large library of extensions that are designed to enable dependency
    injection in a variety of situations. Among them are the Ninject.Extensions.Wcf
    extensions, which provide a set of classes that enable dependency injection via
    Ninject for WCF services. Adding these extensions takes only a few steps, and
    it helps your WCF services to use dependency injection seamlessly.


    The Ninject WCF extension contains two assemblies used in this example: Ninject.Extensions.Wcf
    and Ninject.Extensions.CommonServiceLocator. You add these as references to the
    OSIM.ExternalServices projects, as shown in Figure 10-3.


    These two assemblies contain the Ninject classes needed to retrofit the WCF service
    application (OSIM.ExternalServices) to be a Ninject application.


    The first change you need to implement is the OSIM.ExternalServices application
    an instance of a Ninject application. You do so by changing the class that the
    OSIM.ExternalServices application inherits from. This information is located in
    the Global.asax.cs file. By default, this file is not added to the WCF services
    project at creation time. The convention is that you create this file only if
    you need to modify some behavior or, such as application start activities. If
    this file is not found, the .NET runtime uses a standard definition of this class
    to create your application.


    In this case you need to change the base class for the Global class, so also add
    this file to the OSIM.ExternalServices project. To do this, right-click the OSIM.ExternalServices
    project and select Add -> New Item. The Add New Item dialog, shown in Figure 10-4,
    is displayed.


    ![](img/15cb6759e167a2d15e60bc37de753a62_231_0.png)


    FIGURE 10-3'
