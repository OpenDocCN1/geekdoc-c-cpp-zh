- img_proc: true
  md: "The following example uses the AAA style of mocking objects, which is similar\
    \ to mocking with Moq, as you learned in Chapter 2. The basic Rhino Mock syntax\
    \ looks like this:\n\n```\nMockRepository mocks = new MockRepository();\nIDependency\
    \ dependency = mocks.CreateMock<IDependency>();\n```\n\n```\n// create our expectations\n\
    Expect.Call(dependency).GetSomething(\"parameter\").Return(\"result\");\ndependency.DoSomething();\n\
    mocks.ReplayAll();\n```\n\n```\n// test the middle layer\nThing thing = new Thing(dependency);\n\
    thing.DoWork();\n```\n\n```\n// verify the expectations\nmocks.VerifyAll();\n\
    ```\n\nThis example sets up a mock object for the IDependency interface that will\
    \ eventually get passed into the Thing class. Two expectations are set for the\
    \ mock: the GetSomething method is called, with a string parameter and a return\
    \ value, and the DoSomething method is called off the dependency. Expectations\
    \ are verified with the VerifyAll method on the mock object.\n\nYou can take Rhino\
    \ Mocks a bit further and create a test that is actually useful to a project:\n\
    \n```\n[Test]\npublic void Mocking_With_Rhino_Mocks() {\n    MockRepository mocks\
    \ = new Rhino.Mocks.MockRepository();\n\n    // create the repository; the real\
    \ object would make calls to the DB\nIItemTypeRepository repository = mocks.CreateMock<IItemTypeRepository>();\n\
    \n    // mock the call to get an item with the ID of 2 and return null,\n    //\
    \ to mock not finding an item\nRhino.Mocks.Expect.Call(repository.GetById(2)).Return(null);\n\
    \n    // get the mocking ready\nmocks.ReplayAll();\n\n    // inject our mock into\
    \ our service layer\nItemPresenter presenter = new ItemPresenter(repository);\n\
    \n    // service.GetItem will call the mocked repository, which will call\n  \
    \  repository.GetById, which will return null\nItemType item = presenter.GetItem(2);\n\
    \n    // should be null\nAssert.IsNull(item);\n}\n```"
  merge: -1
  pgno: 283
- img_proc: true
  md: "In some cases you may want to throw an exception in your mock object instead\
    \ of returning a value. It's a good idea to create tests that simulate faults.\
    \ The following example simulates a DivideByZeroException within the MethodThatThrowsError\
    \ method:\n\n```\nitemRepository.Expect(m => m.MethodThatThrowsError(\"\")).Throw(\n\
    \    DivideByZeroException(\"\\\");\"\n```\n\nWorking with Rhino Mocks is just\
    \ the start. First you need to gain access to the Event Raiser, and then you simulate\
    \ an event being raised, as shown in the example. The MyEvent is simulated, and\
    \ you return a string value for \"result\":\n\n```\nitemRepository.GetEventRaiser(v\
    \ => v.Event += null).Raise(\"result\");\n```\n\nYou can also use the record/playback\
    \ to mock objects using Rhino Mocks. Record/playback is a two-stage process. In\
    \ the record stage, you define how the mock is to be interacted with. In the second\
    \ stage, you enter your code and test it with the Mock object:\n\n```\nMockRepository\
    \ mocks = new MockRepository();\nTypeRepository mock = mocks.CreateMock<ITypeRepository>();\n\
    \nusing (mocks.Record())\n{\n    Expect.Call(mock.GetById(3)).Return(null);\n\
    }\n\nusing (mocks.Playback())\n{\n    Assert.AreEqual(null, mock.GetById(3));\n\
    }\n```\n\nRhino Mocks has a strong following and is a good mocking tool. To start\
    \ working with Rhino Mocks, visit http://www.ayende.com/projects/rhino-mocks.aspx.\n\
    \n# Type Mock\n\nType Mock is different from Rhino Mocks and Moq that it uses\
    \ intermediate language (IL) to replace real implementations with the mock implementation\
    \ at runtime. Type Mock can mock any object in your system at any time, there\
    \ is no need to worry about how to inject your mock into the system. It is also\
    \ important to note that Type Mock is a commercial product and therefore is not\
    \ free.\n\nThe other major advantage of Type Mock is that the mock object does\
    \ not need to inherit from an interface. Type Mock can mock concrete implementations\
    \ of objects. With Type Mock, you can"
  merge: -1
