  md: "# The Dependency Injection Pattern\n\nInterfaces are very important in harnessing\
    \ the power of dependency injection. By declaring member variables as interfaces,\
    \ I'm implicitly stating that I don't care what the specific concrete implementation\
    \ of each service is, I only care that it implements the interface that it's being\
    \ declared. This allows me to delegate the task of determining what my concrete\
    \ type should be to my dependency injection framework. The dependency injection\
    \ framework then becomes the storehouse of rules and logic to determine which\
    \ concrete instance to use. When the use of interfaces helps make this possible.\n\
    \nThis example shows you to use the Ninject DI framework to take care of the dependencies\
    \ and create them. To use Ninject, you must add a reference to the Ninject framework\
    \ assembly (Ninject.dll) to your project, as shown in Figure 5-1.\n\nNinject needs\
    \ a class to store the rules it uses to create the concrete instances of its dependencies.\
    \ These classes are called modules. The next step is to create a class to hold\
    \ the rules for the BusinessApplication.Core project. In order to use Ninject,\
    \ this class must inherit from NinjectModule and provide an implementation for\
    \ the Load method:\n\n![](img/15cb6759e167a2d15e60bc37de753a62_106_0.png)\n\n\
    FIGURE 5-1\n\n```\npublic class CoreModule : NinjectModule\n{\n    public override\
    \ void Load()\n{\n        throw new NotImplementedException();\n    }\n}\n```\n\
    \nCoreModule.cs\n\nBy providing a concrete implementation for the abstract class\
    \ NinjectModule, CoreModule can give Ninject the information it needs to build\
    \ concrete classes based on requests from consumers. The overridden Load method\
    \ is where you define the rules for creating your classes. Start with an easy\
    \ example one: LoggingDataSink:\n\n```\npublic override void Load()\n{\n    Bind<ILoggingDataSink>().To<LoggingDataSink>();\n\
    }\n```\n\nCoreModule.cs\n\nI choose LoggingDataSink for this example because it\
    \ has no input parameters and is not used as an input parameter for one of my\
    \ other concrete classes. This example uses the Bind command from Ninject to specify\
    \ that any requests for a class that implements ILoggingDataSink interface should\
    \ return a concrete instance of LoggingDataSink, which is specified with the To\
    \ extension method."
