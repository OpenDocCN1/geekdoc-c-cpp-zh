  md: 'suite of passing unit tests allows you to refactor your code and know exactly
    when you''ve gone beyond the point of having code that satisfies the business.
    Now is the time to put on your editor and take a good, hard look at your code.
    Is it readable? Can someone new to the team look at your code and quickly understand
    its function and how the code accomplishes? Does your code meet the SOLID Principles?
    Do you have a lot of duplicate code? Are you effectively using interfaces and
    abstractions? Are your dependencies injected to keep your coupling loose? Now
    is the time to address these questions. Work to make your code better, but keep
    your tests passing.


    # TRIANGULATION OF TESTS


    The “happy path” is always easy to test. If your unit tests stay on the happy
    path or tests one of input values that fall within the middle range of the possible
    inputs, you are not telling the whole story. Actually, it’s worse than: They lie.
    You tell them that your code satisfies the business needs and have a high degree
    of quality. This isn''t true.


    The problem is that all input is evil. When you don''t build tests that prove
    the boundaries of your code and beyond, you are essentially crossing your fingers
    and hoping the users never push the boundaries of your application. Users use
    software that works. They don''t understand concepts of memory size, out-of-bounds
    errors, null exceptions, or the problems that arise from using values that are
    either higher or lower than the range of values your code expects. They shouldn''t
    have to; your application should worry about these issues.


    When writing unit tests, be sure explore the boundaries of your method expects.
    If your method expects a value between 1 and 10, write a test that passes in 5.
    Then write tests that pass in 1 and 10. Then write tests that pass in 0 and 11.
    Make sure that your code knows what to do with the unexpected. With a test of
    the `and_saving_invalid_item` test class and its `then_agru_null_exception_should_be_raised`
    test I wanted to make sure that the `ItemRepository` class be able to handle the
    case when a client called the `Save` method with a null object and respond accordingly.
    Triangulate your tests to ensure the quality of your code.


    # SUMMARY


    The first user story or feature you develop for an application is important. The
    success of this first unit of work can set the tone and define the project''s
    values. When planning your work, order your features in a logical manner that
    starts towards the core of your application and builds out. When breaking your
    stories into features, be sure to keep them small, isolated, and testable.


    When creating your tests, use a consistent for naming classes, methods, and variables.
    The names you give should be meaningful — not only to developers but also to nonlocal
    business users who may be asked to validate your tests. Investigate DDD naming
    styles and conventions, and apply this knowledge to naming your classes, methods,
    and variables.


    See your test before you write any code. This is important to ensure that you
    are testing functionality that does not exist. If your test passes without any
    code written, this could mean many things. Perhaps this is a duplicate feature.
    It could be that the functionality needed was'
  merge: -1
  pgno: 169
- img_proc: true
  md: 'created as a side effect of a previous feature. Another possibility is that
    your test is not testing the correct functionality. Find the reason; don''t just
    assume that a test that passes in this manner means it''s OK to proceed with development.


    Write enough code to make your test pass — no more. When implementing the business
    code to make your test pass, always try to do the simplest thing that might work.
    When the tests, you are done. Do not gold-plate. If a feature, defect, or request
    for a piece of functionality doesn''t appear in the user stories or feature list,
    don''t build it. Wait until it''s needed; don''t preempt the process.


    Be sure to triangulate your tests. Testing the best-case scenario or the "happy
    path" does nothing to ensure that you are creating quality code. Test the edge
    cases for your methods: input parameters that are on the boundaries of what is
    expected, values that fall out of these boundaries, and unexpected values and
    conditions. Remember, all input is evil.


    With a suite of passing tests, you know that your application meets the needs
    of the business. When those needs are met, work on refactoring your code to make
    it more optimized, readable, and maintainable. Keep the SOLID Principles in mind,
    and use them as a guide when refactoring your code. Keep your tests passing, and
    you''ll know that your code still meets the needs of your business.


    Finally, look at ORM frameworks such as NHibernate and Entity Framework to help
    accelerate your development. Offloading your data access functionality to a framework
    like this can make development faster and less prone to defects.'
