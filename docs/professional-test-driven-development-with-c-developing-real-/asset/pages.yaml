  md: "FNH, like modern ORMs, encourages the use of the repository pattern discussed\
    \ in Chapter 5. I use FNH frequently, I have developed a base generic repository\
    \ that can be used for projects to employ FNH. As with the Specification class,\
    \ I utilize this class on most of my projects. This repository will be included\
    \ with the code samples that are available for download; however, this example\
    \ demonstrates how to build a repository from scratch.\n\nFNH provides a Session\
    \ class that handles all interaction with the data store. Calls from the application\
    \ code to the repository always end with one or more calls to the FNH Session\
    \ object created by an instance of the FNH interface ISessionFactory. To use these\
    \ in your ItemTypeRepository, you need to add references to the FluentNHibernate\
    \ and NHibernate assemblies, as seen in Figure 7-10.\n\nBefore the ItemTypeRepository\
    \ can recognize the classes in the FNH framework, you will need to add a statement\
    \ to the ItemTypeRepository.cs file:\n\n+   - Solution: OSM (8 projects)\n- OSM.Core\n\
    - Properties\n  - FluentNHibernate\n  - NHibernate\n  - System\n  - System.Core\n\
    \  - System.Data\n  - System.Data.Entity\n  - System.Xml.Linq\n- Entities\n  -\
    \ ItemType.cs\n- ItemTypeRepository.cs\n- OSM.Interfaces\n- OSM.IntegrationTests\n\
    - OSM.UnitTests\n- OSM.WinClient\n\nFIGURE 7-10\n\n```\nusing NHibernate;\n```\n\
    \nItemTypeRepository.cs\n\nNow you need to add a member variable to the ItemTypeRepository\
    \ class to store the ISessionFactory object:\n\n```\npublic class ItemTypeRepository\
    \ : IItemTypeRepository\n{\n    private ISessionFactory _sessionFactory;\n\n \
    \   public int Save(ItemType item)\n    {\n        return 1;\n    }\n}\n```\n\n\
    ItemTypeRepository.cs\n\nFinally, you need to add a constructor to the ItemTypeRepository\
    \ class that allows a class that implements ISessionFactory to be supplied when\
    \ ItemTypeRepository is created:\n\n```\npublic ItemTypeRepository(ISessionFactory\
    \ sessionFactory)\n{\n    _sessionFactory = sessionFactory;\n}\n```\n\nItemTypeRepository.cs"
