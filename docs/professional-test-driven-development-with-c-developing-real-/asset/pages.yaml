    - The system must keep track of what supplies (type and quantity) are distributed
    to which department.

    - The system must keep track of a per-item internal price for each item type (the
    price supply department charges other departments for supplies).

    - The system must keep a running total of current inventory.

    - The system must keep a running total of each department''s monthly supply bill.

    - The system must allow users to specify a reorder level for each item type.

    - The system must alert the users when the current stock of an item type has fallen
    below the reorder level.

    - The system must prepare a bill for each department on a monthly basis.

    - The system must keep track of the per-item vendor price for each item type (the
    price external vendor charges for each item).

    - The system must produce a monthly usage report (how many of each item were distributed).

    - The system must produce a monthly cost report (how much was paid to external
    vendors, and for what).

    - The system must produce a monthly internal revenue report (how much was paid
    by internal departments, and for what).'
