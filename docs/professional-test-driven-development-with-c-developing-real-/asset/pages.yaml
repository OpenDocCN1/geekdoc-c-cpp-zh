  md: '# CHAPTER 4 TEST-DRIVEN DEVELOPMENT: LET THE TESTS BE YOUR GUIDE


    application needs to carry out its assigned tasks; you will not have the burden
    of managing code that does not contribute in a constructive way to your application.


    The work flow in TDD is often described as "Red, Green, Refactor." This describes
    a series of tests that starts with a failing test, the developer then writes just
    code to make the test pass, and works to improve it. In the section "Red-Green-Refactor,"
    you''ll see the importance of these steps and how following them lead to lean,
    efficient code that satisfies the needs of the business with fewer defects.


    # IT STARTS WITH THE TEST


    The first D in TDD stands for "driven." This means that in your practice of TDD,
    you must let the tests drive your development. This seems like a simple concept.
    However, developers who are new to TDD try to work in a test-driven manner, they
    tend to fall back into their old, comfortable routines.


    Most traditional development work starts with requirements gathering. The business
    managers sit down, with a project manager and an architect, and sketch the broad
    strokes of a system. This process goes through several iterations until the design
    is refined and details are expanded. Finally, a set of specifications for either
    a new project or a change to an existing one is produced.


    For teams or developers who do not practice TDD, the next step is to write the
    code. As a developer, you use specifications from the business requirements to
    define entities, service classes, and application work. At this point the system''s
    quality depends on the developer''s understanding of the technical specifications
    and business requirements as written. When you do (or you have reached a point
    that represents your concept of "done"), you send the application to QA. Varied
    QA finds defects in the feature.


    Now it comes your job to correct the defects. Without unit tests to help locate
    and diagnose the defect, most developers turn to the debugger, placing breakpoints
    where they think the defect could be happening. This is sometimes called the "shotgun
    approach." It''s unforeseen and inefficient. If an application has many layers
    of services and abstractions, you have to spend a lot of time looking around all
    of them to find the source of the problem. The end result is that you spend more
    time locating the defect than actually fixing the code. This is not a very efficient
    use of your time.


    To add injury, it is much harder to write unit tests for when no foresight has
    been given to the concept of testability. TDD forces you to think about how you
    are designing and building your software to make it flexible and loosely coupled.
    Many developers who do not practice TDD are writing loosely coupled and flexible
    software. But when they don''t have some external element keeping them honest
    (in this case, the unit tests), developers tend to find to cut corners. This is
    natural, because developers have been trained to "Optimize, optimize, optimize!"
    for years; they haven''t been taught to think about maintainability.


    In this process results in you spending an incredible amount of time to fix a
    trivial defect. If you had built-in a way to determine where the defect was coming
    from, it would save a bit of time. Better yet, if you had some automated way of
    ensuring that your code reflected'
