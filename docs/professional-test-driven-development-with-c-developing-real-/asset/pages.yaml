  md: "Best practices for using ADO.NET aside, you can see that this method suffers\
    \ from some of the same problems as the previous example. For starters, not only\
    \ does this method contain code to create and execute the command to retrieve\
    \ the customer from the database, but it also contains code to handle an exception\
    \ that may be thrown. Alert subtle, this violates the SRP on several levels.\n\
    \nThe code in the Try block is doing two separate tasks: creating the ADO.NET\
    \ command to get the customer from the database, and mapping the data to a customer\
    \ object. This might seem like one, but really two reasons to change. If the stored\
    \ procedure used to get the customer were to have its parameters changed, the\
    \ code to build the command would have to change. If the data structure of the\
    \ customer dataset extracted from the stored procedure or the class itself changed,\
    \ that would be another reason.\n\nThe Catch block contains another violation\
    \ of SRP. The method contains code to handle an exception that may result from\
    \ the call to the database. This is a reason to change. The current algorithm\
    \ for handling exceptions that arise when retrieving a customer is to log the\
    \ exception and return a customer object with a status of \"unknown\". Tomorrow\
    \ the procedure would be completely different. This represents another reason\
    \ why this method would have to change.\n\nWidespread violations of SRP make the\
    \ Try/Catch block a bit long and introduces unnecessary layers of complexity.\
    \ According to the SRP, the mechanics of a Try/Catch block (calling a unit of\
    \ work, catching an exception that is thrown) is enough of reason to change in\
    \ and of itself and should not be mixed with business or other infrastructure\
    \ logic. This method will be fixed in the section \"Extract Methods.\"\n\n# TYPICAL\
    \ REFACTORING\n\nTo review, code smells are a series of commonly known coding\
    \ antipats. Because they are commonly known, and widespread, developers are able\
    \ to develop common and well-known ways of dealing with these code smells. These\
    \ are called refactoring patterns. This section focuses on some of the most common\
    \ refactoring patterns and explains how and when to apply them to your code.\n\
    \n# Extract Classes or Interfaces\n\nThere are many reasons why you may want to\
    \ split a class into a smaller, more focused classes or a series of more granular\
    \ interfaces extracted from. If a class is very large, it is probably doing too\
    \ many things. If a violates the SRP, it is a candidate to split. If there is\
    \ a design or technical reason that the class must remain in one, or the class\
    \ is small but still doing too many different things, extracting interfaces is\
    \ a good alternative. Another good time is when the client cares about only a\
    \ portion of the class's public interface. Consider the following class:\n\n```\n\
    public class InvoiceService\n{\n    public string CreateInvoice(Invoice invoice)\
    \ {...}\n\n    public string ProcessPayment(Invoice invoice, double amount) {...}\n\
    ```"
