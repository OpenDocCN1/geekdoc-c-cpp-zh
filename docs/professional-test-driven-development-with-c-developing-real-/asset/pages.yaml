    implementation of Save for the ItemRepository class returns 1.


    It''s time to take the next step in making this test pass. At this stage it is
    helpful to think about the design of the architecture. Specifically, it''s time
    to discuss how the persistence will be implemented.

    This application uses the Object Relational Mapping (ORM) framework Fluent NH
    (FNH) for data persistence. I explore the concept ORM in Chapter 5, and I show
    you how it is used to handle persistence in Chapter 8. The .NET world offers a
    variety of ORM frameworks to choose from. I chose FNH for this project because
    it''s the framework I am most familiar with. If you or your team have more experience
    with an ORM such as Entity Framework, and tool serves your needs, it''s probably
    the right ORM for you. The examples in this book that use FNH are portable, and
    you can choose to implement the same practices with any ORM you and your team
    decide to use.


    > If you''re unfamiliar with FNH, don''t worry. This example doesn''t use any
    advanced features of the FNH framework. I will also stop and briefly explain the
    steps in the example that are specific to FNH.'
