    \ assembly, you add a reference to the Inject assembly that you need to create\
    \ your kernel. The kernel is the instance of the StandardKernel class that you\
    \ will create to be your interface to the Inject framework. You will ask this\
    \ instance of the StandardKernel for classes by calling the Get method and specifying\
