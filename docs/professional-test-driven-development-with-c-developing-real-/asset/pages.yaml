    \ their own mocks, but this is becoming less frequent as mocking frameworks have\
    \ become widespread, full-featured, and easy to use. A mocking framework is definitely\
    \ preferable to rolling your own mocks, and it can make your TDD experience more\
    \ efficient and fulfilling. Moq is quickly becoming one of the most popular mocking\
    \ frameworks for .NET. It has a solid list of features, is easy to use, and has\
    \ a large community support base, which ensures constant improvement and development\
    \ of Moq's features.\n\n# What Does a Mocking Framework Do?\n\nA mocking framework\
    \ gives you the facilities to create and consume stubs and mocks. Using a mocking\
    \ frameworks API, you can create mocks and inject your test functionality at runtime.\
    \ Mocking frameworks also give you a Domain-Specific Language (DSL) for defining\
