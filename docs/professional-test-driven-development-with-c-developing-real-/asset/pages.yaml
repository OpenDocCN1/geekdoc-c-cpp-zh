  md: 'Start by making a small improvement to your code, such as renaming a variable.
    Once you''ve done that, run your tests to verify that the external functionality
    of your code or method has not changed. Don''t run the tests for only the code
    you just wrote; run them all. It is necessary to ensure that you have not caused
    an adverse side effect elsewhere in the code base. When you''re satisfied that
    your change has not had any adverse effect, repeat the next issue with your code,
    and run the tests again. Repeat as needed. This is known as "red, green, refactor."
    This means that you start with a test that fails because you haven''t implemented
    the logic to pass it. Then you implement the test so that it passes. Finally,
    you refactor to the code without breaking the test.


    # Maintainability


    It''s established that when practicing TDD, your initial goal when writing code
    is simply to make the tests pass. As time goes on the application and the business
    it supports evolves, the application must support new functionality or change
    how the current business logic functions. The ability to quickly and easily make
    these changes is important. Refactoring for readability is an important step in
    managing an application. Not just for others, but for ourselves. Every developer
    has the unfortunate experience of looking at code he or she wrote in the past
    and not remembering what, how, or why the code does what it does.


    Refactoring for maintainability should work to simplify the code wherever possible.
    This includes making sure that methods are short, control structures are simple,
    and variable and method names are descriptive and clear. Think of refactoring
    for maintainability as leaving your future self a hint so you can remember what
    you wrote the code in the first place.


    # Code Metrics


    Measuring the quality of a code base is a subjective task. There are almost as
    many ideas of what constitutes quality as are developers. However, a few specifics
    can give you some hints about what''s under the hood in your application.


    Code test coverage (code coverage) measures how much of your code base is executed
    by your unit test. This metric is controversial, because the number tells only
    part of the story. A code base with less than 100% coverage does not necessarily
    mean that the code lacks quality. A code base with 100% coverage ensures only
    that its quality is as good as the tests it execute.


    The first question is when looking at code coverage what parts of the code base
    are being measured. In most cases I find that it is more important to write tests
    on the functional parts of the source code. This encompasses everything except
    entity objects, data transfer objects, and any object or structure whose sole
    purpose is to contain data. The reason for this is that tests test only functionality;
    a structure that holds data should have no moving parts. Therefore, I could argue
    that these should not be included in my code coverage metric because they could
    skew the result.


    On the other hand, the goal of TDD is to write only the code that you need to
    make the tests pass. If you have several fields on a data structure that what
    is not using, why do you need them? Code coverage will quickly uncover what is
    not being used, allowing you to examine the need for fields. Of course, there
    are situations in which your data structures interact with external systems'
