  md: '# TestDriven.NET


    TestDriven.Net is a popular test runner that supports running tests created in
    frameworks as NUnit, MbUnit, and MestTest. TestDriven.Net edition is free to open
    source developers. Corporate developers must pay a modest fee, but it''s worth
    not having to keep the GUI interface free these tests.


    TestDriven.Net integrates into Visual Studio. You can run a test by clicking-it
    and selecting Run Test, as shown in Figure 13-1.


    It''s highly recommended that you create a keyboard shortcut so that you do not
    need to right-click each time you want to run your tests. By setting up keyboard
    shortcuts in Visual Studio, select Options > Keyboard Settings, as shown in Figure
    13-2.


    ![](img/15cb6759e167a2d15e60bc37de753a62_277_0.png)


    ![](img/15cb6759e167a2d15e60bc37de753a62_277_1.png)


    Figure 13-2


    Many test runners as TestDriven.Net allow you to debug your tests. Stepping into
    a test is useful when you are trying to figure out what is going on a complex
    test. The commercial and personal versions of TestDriven.Net can be downloaded
    at http://www.testdriven.net/download.aspx.


