    # Writing the Test


    To help me write tests in a BDD style, I use a framework called NBehavior which
    can be downloaded at nbehavior.org. NBehavior is a BDD framework for .NET that
    allows developers to create specifications (business rules written in plain English)
    and execute them test code. In this effect creates a domain-specific language
    (DSL) that allows nontechnical business users to write tests based on a framework
    provided by the DSL with NBehavior is powerful.


    The ability to write and execute these DSLs with NBehavior is powerful. However,
    in this book I simply use NBehavior to provide syntactic that will help keep your
    unit tests readable and manageable in a BDD style. As the example continues throughout
    this book, I''ll point out where I use these syntactic features of NBehavior.


