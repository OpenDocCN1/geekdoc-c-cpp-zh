  md: 'to exercise only the specific method you are testing independent of any dependencies.
    The traditional approach of statically creating these dependencies creates applications
    that are brittle and difficult to maintain.


    The dependency injection pattern allows you to define these dependencies based
    on interfaces instead of concrete implementations. The concrete implementations
    of these interfaces can be provided, injected, into the object at runtime. This
    enables you to vary the concrete implementation for these dependencies based on
    the context the object is being used in. At runtime your application can vary
    the concrete implementation based on the environment (Production, QA, Development).
    For unit you can inject mocked objects to stand in for actual implementations.
    This allows you to keep your tests isolated and predictable.


    Accessing data is a very common requirement for business applications. Many developers
    have tried embedding the code to perform persistence actions in the actual class
    definitions themselves. This causes issues with data access code being distributed
    throughout the application and makes maintenance difficult.


    By using the repository pattern, you can isolate this functionality from your
    business logic. This creates a clean separation between business domain logic
    and the infrastructure needed to perform persistence. It also makes mocking data
    access in your unit tests easier, because this code is no longer tightly bound
    to your business domain code.'
