  md: "# 284 | CHAPTER 13 THE GREAT TOOL DEBATE\n\n```\n[TestFixture]\npublic class\
    \ MathStuffTests {\n    [RowTest]\n    [Row(5, 3, 8)]\n    [Row(0, 0, 0)]\n  \
    \  [Row(-1, 2, -3)]\n    public void AddTests(int a, int b, int expected) {\n\
    \        int test = MathStuff.Add(a, b);\n        Assert.AreEqual(test, expected);\n\
    \    }\n}\n```\n\n![](img/15cb6759e167a2d15e60bc37de753a62_281_0.png)\n\nAs shown\
    \ in Figure 13-6, the MbUnit test runner treats this as three separate tests when\
    \ reporting the test results.\n\n![](img/15cb6759e167a2d15e60bc37de753a62_281_1.png)\n\
    \nFIGURE 13-6\n\nMbUnit can be downloaded at http://www.mbunit.com/.\n\n# xUnit\n\
    \nxUnit is an open source testing framework developed by Brad Wilson of Microsoft\
    \ with cooperation with Jim Newkirk. xUnit takes a minimalistic approach that\
    \ provides framework features through method attributes. This minimalistic approach\
    \ helps keep tests simple and clean. One of major differences between xUnit and\
    \ the other testing frameworks"
