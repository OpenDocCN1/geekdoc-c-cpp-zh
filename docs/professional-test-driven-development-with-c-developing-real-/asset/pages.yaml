  md: "# CHAPTER 5 MOCKING EXTERNAL RESOURCES\n\nWhen creating an instance of Ninject's\
    \ StandardKernel, you need to provide it with an instance of CoreModule. This\
    \ how makes Ninject aware of the rules and steps to create objects. In the example\
    \ here, StandardKernel takes only one module (CoreModule) as its rule set. This\
    \ example is fine, because only one library (BusinessApplication.Core) is being\
    \ worked with. But if you had several assemblies? You could make one module that\
    \ has the creation rules for everything in your solution, but this is not a good\
    \ idea. It also requires the project module to be fixed to know about all other\
    \ projects and assemblies. It also limits the reuse of the components in this\
    \ solution. If you have a component in library B, but its creation rules are contained\
    \ in a library A, then you are now dependent on library A and all its dependencies.\
    \ To solve this problem, create one module for every project in your solution\
    \ that provides creation rules for all classes and interfaces in that library.\
    \ This means that the libraries are less dependent on each other and reuse is\
    \ much easier.\n\nThe constructor for StandardKernel has an override that takes\
    \ an array of modules. This allows you to create a single kernel for your application\
    \ (in practice, this kernel should be a singleton) with all the information to\
    \ create anything you need anywhere in the application. The syntax to create a\
    \ kernel like this is:\n\n```\nvar kernel = new StandardKernel(new ModuleA(),\n\
    \              new ModuleB(),\n              new ModuleC());\n```\n\nRunning the\
    \ tests shows that an issue exists, as shown in Figure 5-4.\n\n![](img/15cb6759e167a2d15e60bc37de753a62_111_0.png)\n\
    \nFIGURE 5-4\n\nThe stack trace tells you that line 32 in the CoreModule.cs file\
    \ has an issue:\n\n```\nvar databaseConnectionString = =\n              ConfigurationManager.\n\
    \              .ConnectionStrings[\"MyConnectionString\"].ConnectionString;\n\
    ```\n\nCoreModules.cs"
