    Windows form. The only difference is that instead of a human directly interacting
    with the interface, the user needs a web service proxy of some sort to use the
    interface. I''ll create the appropriate project types for each of these, as shown
    in Figure 6-5.


    Now that I have three projects in my solution, I will add folders to the test
    projects for them, as shown in Figure 6-6.


    Currently these are all the projects I need for my application based on the initial
    high-level design. In the project I may need other projects for support purposes.
    When creating these, the first question is to ask "Does this belong in a separate
    project?” Many developers talk about creating new projects in the name of granularity.
    In some cases results are so reliant on each other, on then they provide little
    to value. Often errors arise because an assembly is meant to deploy an application
    with one assembly but not the other. If two or more classes really require each
    other to function, they should not be split into different projects.


    If you need to create a separate assembly, make sure your naming convention continues
    to identify what this project is supporting, and how. For example, if you wanted
    to create a project to contain themes for the Windows client, a good name would
    be OSIM .WinClient.Themes.


    For now, this project structure is complete. I''m sure I''ll have to add structural
    elements as the project progresses, but I don''t want to start the application
    development project by overcomplicating my environment. In general you want to
    keep your project structure as simple and clean as possible and make changes and
    additions only if they are needed.


