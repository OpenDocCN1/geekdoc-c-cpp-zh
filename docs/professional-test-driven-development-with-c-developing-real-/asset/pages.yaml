  md: 'workflows based on the application''s user stories. Your application test suite
    will contain many unit and integration tests, each of which will focus on a relatively
    small piece of functionality. By contrast, your application test suite will contain
    comparatively few end-to-end tests, each of which will cover a broader scope of
    functionality.


    Integration and end-to-end tests take longer to execute unit tests because of
    how they use non-mocked components and external resources. It’s advisable for
    developers to not run integration and end-to-end tests as often as they run unit
    tests. Integration tests should be run periodically throughout the course of developing
    a feature or user story. End-to-end tests should be run before the developer commits
    the code to the main source repository branch. Integration tests, as well as end-to-end
    and unit tests, should be run as part of the development team’s CI process. Any
    build with a failing test should be considered a failed build, and the development
    team’s priority should shift to getting the tests and the build working again.
    The overarching goal is always to put quality software in front of the users.
    This can be done only with a successful CI process.'
