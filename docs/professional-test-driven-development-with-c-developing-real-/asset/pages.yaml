  md: "# CHAPTER 2 AN INTRODUCTION TO UNIT TESTING\n\nIn some situations you will\
    \ want to verify that a method throws an exception for a set of conditions. For\
    \ this example let's assume that 0 is an invalid interval and throw an ArgumentException.\
    \ You can add a setup for your stub to specify that 0 as an argument should cause\
    \ ArgumentException to be thrown from your stub:\n\n```\n_longRunningLibrary =\
    \ new Mock<ILongRunningLibrary>();\n_longRunningLibrary\n    .Setup(l => l.1rlRunForLongTime(It.IsAny<int>()))\n\
    \    .Returns((int s) => {\n        \"This method has been mocked!\\n        The\
    \ value was (0*)\", s);\n    });\n_longRunningLibrary\n    .Setup(l => l.1rlRunForLongTime(0))\n\
    \    .Throws(new ArgumentException(\"0 is not a valid interval\"));\n```\n\nThe\
    \ order in which you call setup methods matters. Mock these stacks, so if you\
    \ were to put the stub that has a return for 0 as a parameter first, it would\
    \ be overwritten by the rule that covers any integer being passed. Therefore,\
    \ the exception would never happen. In general, you want to put the least-specific\
    \ stubs in the first, followed by the most-specific. You can think of this stack\
    \ as a sort of sieve; you want to catch every combination at the correct level.\
    \ If the first levels are too restrictive, the configuration will be caught too\
    \ soon or at the incorrect level. Creating these stubs can be a bit of art, but\
    \ with practice it will become simple.\n\nWhen I change the input to 0 and return\
    \ the test, I get the result in Figure 2-9.\nMoq is a powerful framework that\
    \ provides mocking and stubbing for a variety of scenarios. This chapter has covered\
