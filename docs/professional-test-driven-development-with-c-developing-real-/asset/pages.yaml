    # CLEAN CODE PRINCIPLES


    A growing software craftsmanship movement has, among other things, begun to champion
    the idea of developers continuing to study their craft, with a goal of being able
    to write clean code. In summary, the point of this movement and philosophy is
    that developers should always strive to learn and try to write the best possible
    code they can be based on a set of prescribed practices and principles.


    # OOP Principles


    Object-oriented programming (OOP) is a method of abstracting real-world objects
    into classes that code can use. The idea is that if you model your business problems
    in code, it would be easier to create applications that correctly address these
    business problems in a way that is more reflective of the real world. Most modern
    languages support OOP. OOP makes it easier to conceptualize and develop your applications
    to meet the business''s needs while keeping your individual units of code small
    and reusable. Having a solid basis in TDD will make many of the concepts you''ll
    understand and work with.


    In general terms, OOP has three major tenets. Over the years many people have
    insisted that there are others. These are not necessarily wrong When you scratch
    the surface of these claims, you find that these additional tenets are intended
    to thwart the advantages of one language over another or disparage a language
    or platform as not being truly OOP. Or perhaps they construct a list what developer
    may have for features he wants to see in his language of choice. These other tenets
    are not necessarily invalid; binding and messaging are important concepts and
    in some languages are just important as the tenets discussed here. OOP''s universal
    tenets are encapsulation, inheritance, and polymorphism.


    # Encapsulation


    The encapsulation rule states that the classes you create should be black boxes.
    In other words, the internals of a class should be inaccessible to a client. The
    client''s only means of interacting or changing the state of a class should be
    that class''s public interface. At no time should the client have or any knowledge
    of how a class performs its actions. The client knows what methods and properties
    to use to get the information or interaction it


    You don''t care how the client of a class does its work, so long as you get the
    results you need. The class also needs to be assured that it is free to perform
    its work without the risk of unauthorized changes to its internal state. When
    you design your classes, it is important to scope your methods, properties, and
    variables correctly. Only members that are part of public interface should be
    declared public. Only members that must be used by a descendant of the class should
    be declared. Everything else is private. A good rule of thumb is to make everything
    private until it needs to be public. Also, you should never allow a member variable
    to be anything other than private; if a descendant class needs to use the variable,
    make it accessible'
  merge: -1
  pgno: 51
- img_proc: true
  md: 'through a protected property. If the variable needs to be part of the public
    interface, wrap it in a public property. You should never simply allow unmonitored
    or uncontrolled access to an internal variable.


    # Inheritance


    As you build the classes in your application, you will soon find that some classes
    have natural hierarchical relationships to each other. These classes may be similar,
    but they are not quite equal in functionality. In these cases you can place the
    common functionality in a base class and have your more-specific classes derive
    from that class. This is called inheritance and is a very important concept in
    OOP.


    Assume that you are writing a payroll application that has entities for hourly
    employees, salaried employees, and seasonal employees. (See Figure 3-1.)


    ![](img/15cb6759e167a2d15e60bc37de753a62_52_0.png)


    FIGURE 3-1


    Your business rules indicate that compensation (salary, benefits, insurance) is
    computed differently for each type of employee. However, all three have many things
    in common. Each employee has some biographical information (name, address, work
    history, tax information), and certain processes are for the same, such as getting
    the employee from the database.


    By utilizing inheritance, you can create an Employee base class that encapsulates
    all the common functionality for all types. You then create classes for Hourly,
    Salary, and Seasonal employees. These more-specific classes derive from, or inherit
    from, your Employee base class. Your derived classes have access to the functionality
    of the Employee base class simply by virtue of their ancestor/descendant relationship.


    Classes that inherit from a base class have a few options as how they handle the
    functionality provided in the base class. They can take that functionality as,
    is, allowing clients to call those methods on their instantiated objects or if
    the derived class contains the same functionality locally. The derived class may
    choose to override the base class''s implementation and extend it by calling the
    base class''s implementation from its own implementation, or simply ignore the
    functionality provided by the base class.'
