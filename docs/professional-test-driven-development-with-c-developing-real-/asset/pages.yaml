  md: 'After you select the MVC 3.0 project type, you can choose from two default
    templates — Empty or Internet Application. When you select the Internet Application
    template, a new project that contains default HTML/CSS styling is created. Also
    included in this project are default views and controllers for a home page, as
    well as the basics for authentication. To follow along with this example, select
    the Empty template, as shown in Figure 9-9.


    Figure 9-10 shows the structure that the framework creates. It includes the following
    folders:


    ![](img/15cb6759e167a2d15e60bc37de753a62_213_0.png)


    Figure 9-9


    ![](img/15cb6759e167a2d15e60bc37de753a62_213_1.png)


    Figure 9-10


    +   - Content contains HTML, CSS, and image files.

    - Controllers contains your controller classes.

    - Models contains model classes.

    - Scripts contains JavaScript code for your application.

    - Views contains your views. Each controller has a subdirectory under this directory
    that contains the views for the CRUD operations.


    # # Creating Your First Test


    Based on previous examples, this example implements the same functionality used
    in the OSIM project, revolving around the item type. You list, create, and edit
    the items.


