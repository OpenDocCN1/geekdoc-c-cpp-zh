  md: '# 2


    # An Introduction to Unit Testing


    WHAT''S IN THIS CHAPTER?


    +   - What a unit test is

    - How unit testing differs from other types of tests

    - How unit testing frameworks can help you write unit tests quickly and easily

    - Why mocking external resources in your test is important when practicing TDD

    - A brief overview of the NUnit unit testing framework and Moq mocking framework,
    two very popular TDD tools in .NET world


    Unit testing (UT) is the cornerstone of test-driven development (TDD). When your
    unit tests are properly aligned and correctly reflect your business requirements,
    they almost become a living design document — one that can validate the code you''ve
    written with the push of a button. Unit tests are not difficult to write, although
    they require a minor change to how you usually approach writing software. They
    also represent a few new concepts to master, such as code isolation and the idea
    of having stand-in or mock objects to enable your tests to focus only on the code
    that is being tested. These new concepts are integral to TDD. The ability to write
    isolated, repeatable, and focused tests allows you to ensure that your code is
    meeting the business''s needs and can continue to evolve without those changes
    disrupting the code''s fidelity to the business''s needs. To help you with these
    concepts, tools and frameworks such as NUnit and Moq can make your development
    process easier, faster, and more rewarding.


    # WHAT IS A UNIT TEST?


    Over the years, many different and mutually exclusive definitions of the term
    unit test have arisen. Many people say “unit test” when they really mean component
    test, integration test,'
  merge: -1
  pgno: 25
- img_proc: true
  md: 'or even user acceptance test (UAT). This can lead to a lot of confusion in
    software development in general. In TDD confusion takes on a whole new dimension
    when you consider how central to the practice of TDD unit tests are. It''s important
    for the sake of communicating with our fellow developers that we maintain a consistent
    definition of the term "unit test."


    # Unit Test Definition


    In the simplest terms, a unit test is a test designed to test one unit of work.
    In this case "one unit of work" means one requirement for one method. The example
    from Chapter 1 tested an algorithm to count the number of occurrences of a given
    character in a string. You didn''t know where the string or character came from;
    that detail was unimportant to the given unit of work, which was counting the
    occurrences of the character in the string. Everything else was out of scope for
    the unit of work.


    The benefit of this type of test is that it is confined to one specific unit of
    work. You can focus your efforts on your unit of work. You don''t need to know
    the details of the other players in the system (unless you have a dependency on
    them). This makes the tests, and the resulting code easy. Additionally, if a defect
    appears in your code that causes your test to fail, you can be fairly that the
    defect is isolated to your specific unit of work. You don''t have to "go down
    the rabbit hole" searching for which layer of your defect occurred in. If your
    character-counting tests fail, you know that the problem is.


    Stylistically, unit tests can be written in a variety of ways, but all unit tests
    share some common characteristics. They are:


    +   - Isolated from other code


    +   - Isolated from other developers


    +   - Targeted


    +   - Repeatable


    +   - Predictable


    Now that you know the characteristics of a true unit test, the next section discusses
    patterns and characteristics you should avoid.


    # What Is Not a Unit Test?


    Another issue arises when you cross these boundaries, especially if that is a
    shared resource such as a database. When you share resources with other developers
    on your team, you'
