  md: "# Implementing the Functionality\n\nYou'll notice that Visual Studio indicates\
    \ it doesn't have a definition for ISessionFactory. This is because the OSIM.UnitTests\
    \ project has no reference for FNH libraries. They need to be added (see Figure\
    \ 7-12).\n\nYou then need to add a using statement to the ItemRepository.cs file\
    \ to include the required FNH namespace:\n\n```\nusing NHibernate;\n```\n\nNow\
    \ you can use your mocked Session Factory as a constructor for parameter ITypeRepository:\n\
    \n```\nprotected override void Establish_context()\n{\n    var randomNumberGenerator\
    \ = new Random();\n    _itemTypeId = randomNumberGenerator.Next(32000);\n    var\
    \ sessionFactory = new Mock<ISessionFactory>(sessionFactory.Object);\n\n    _itemTypeRepository\
    \ = new ITypeRepository(sessionFactory);\n}\n```\n\n![](img/15cb6759e167a2d15e60bc37de753a62_158_0.png)\n\
    \nFIGURE 7-12\n\n![](img/15cb6759e167a2d15e60bc37de753a62_158_1.png)\n\nITypeRepository.cs\n\
    \nIt's now time to create an implementation of the Save method of the ITypeRepository\
    \ method that calls the FNH API. As mentioned, all database access with FNH is\
    \ done through the Session class. You get an instance of this Session class from\
    \ an instance of the method that implements the FNH ISessionFactory interface.\
    \ Here's the implementation of the Save method in ITypeRepository that utilizes\
    \ the Session class to save the IType to the database:\n\n```\npublic int Save(IType\
    \ itemType)\n{\n    int id;\n    using (var session = _sessionFactory.OpenSession())\n\
    \    {\n        id = (int) session.Save(itemType);\n        session.Flush();\n\
    \    }\n    return id;\n}\n```\n\nITypeRepository.cs\n\nThese FNH-specific commands\
    \ require a bit of explanation if you've never used the FNH framework. The first\
    \ thing you do is to get a Session from SessionFactory. This is essentially your\
    \ connection to the database. SessionFactory is configured with the information\
    \ needed to connect to the database when it's created. This topic is covered in\
    \ more detail in Chapter 8. The first call is"
