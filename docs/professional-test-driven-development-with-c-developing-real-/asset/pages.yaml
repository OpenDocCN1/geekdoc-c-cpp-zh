  md: '# 302 | CHAPTER 14 CONCLUSIONS


    one test. For many types of functionality, one test is not enough. Tests that
    test only the “happy path” of your code are easy to write. Unfortunately, these
    tests do not tell the whole story.


    It''s important to test your code not only for the acceptable range of input parameters,
    but also for cases in which inputs fall outside the acceptable regions for a reason:
    to find out what the acceptable range of input is for the method in question.
    Obviously, you should test for values that fall squarely in that range. But you
    should also test the boundaries of range. Does the method work the same when the
    absolute minimum or maximum value for an input parameter is between the minimum
    and maximum? You should have a test to verify. What about values that fall outside
    the boundaries? Remember, all input is vital. You should test for values that
    fall outside the acceptable range to ensure that your code can handle such occurrences
    gracefully.


    # Keep Your Mocks Simple


    A strict mock has a set of rules or expectations as to what its methods are called,
    and how many times (with what arguments) its methods are called. I haven''t spent
    much time discussing this in book. That''s because in general I don''t like using
    strict mocks. The need for a strict mock in a unit test indicates that the service
    or component being mocked may have a needlessly complicated interface. The knowledge
    necessary to consume and mock this service or component starts to blur the lines
    where a service or component''s internal functionality is encapsulated from other
    classes. A litany of rules that must be observed and mocked for a reason: to make
    consumption easy, making that service or component difficult. It also results
    in brittle tests, because those rules may change and require a corresponding change
    in the test.


    In some situations, mocking is necessary. Services and components in the .NET
    framework or toolkit API is much more complex interface than you would like. In
    these cases the framework or toolkit API is change drastically (especially if
    you need upgrade it), so the tests are not as brittle as if you strictly mocking
    your own components or services. In general, a strict mock is no better than a
    mock at all.


    In general, mocks should be kept simple. Do not mock more than you need to. An
    interface may have a dozen methods, but you only care about one of them. Mock
    only the one you care about, and leave the 11 other methods unmocked. This makes
    your tests easier to understand and ensures that you are not writing more code
    than is necessary to make your test pass.


    # THE BENEFITS OF TDD


    The primary benefit of TDD is having a set of tests that you can call on any time
    to verify the correct functionality of your application. This in itself is a tremendous
    benefit. It ensures that the application works as described. A suite of tests
    ensures that as development continues, existing functionality is not damaged.
    Indirect benefits of TDD are worth noting:


    +   Better design — To really take advantage of TDD, your application should make
    liberal use of the DI pattern. Use of DI promotes loose coupling in your application.
    No service or'
