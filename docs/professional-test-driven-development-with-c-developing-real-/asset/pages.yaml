  md: '# # End-to-End Integration Tests


    The purpose of unit tests is to drive development of code by creating executable
    and automated tests that verify that the application addresses the business need
    defined by the features and user stories. The purpose of integration tests is
    to ensure that the application''s various components work together to form a larger
    application. An end-to-end test verifies that the application addresses all the
    requirements of a feature or user story and that the functionality is complete
    and integrated. Unit tests cover a specific unit of business functionality, and
    integration tests cover the seams between components. End-to-end tests cover the
    entire system from close as possible to the front end or user interface all the
    way to the back-end data store, web service, or any other external dependencies
    the application may have.


    End-to-end tests are very valuable for a couple of reasons. They verify the complete
    integration of the application across all layers. They also ensure that the needs
    of the feature or user story are met in a more holistic manner.


    Like unit tests, end-to-end tests have some characteristics of their own. Given
    test suite has relatively few end-to-end tests in the unit tests and integration
    tests. Unlike unit tests, which cover a specific small-business task, end-to-end
    tests complete business work flows. Whereas, a unit test has a very narrow focus,
    an end-to-end test covers a wide breadth of functionality. Unlike integration
    tests, end-to-end tests don''t care about specific seams. In fact, they may be
    completely unaware that such seams exists. Most end-to-end tests should start
    by creating an instance of the closest possible access point to the user interface.
    If the user interface is something that can be used, such as in the case with
    ASP.NET MVC applications, applications written in WPF or Silverlight that the
    MVVM pattern, or WCF/ASMX services, which should be the starting point for the
    end-to-end test. The end-to-end test does not care that an `ItemRepository` was
    used. Its concern is that a user provides the correct information and invokes
    the same code as the Save button on an input form, the data is saved and a proper
    result is returned.


    # # Keeping Various Types of Tests Apart


    The entire suite for your application will be composed of unit tests, integration
    tests, and end-to-ends, which all serve different purposes. Developers should
    run unit tests frequently. They should run integration tests less frequently,
    and end-to-end tests even less. For purposes of managing what tests run and how
    often, it''s important to keep track of the various types of tests from each other.
    To this end, I usually create two testing projects in Visual Studio solution for
    each application: a unit test project and an integration test project (which also
    contains my end-to-end tests). Keeping them in separate projects, and separate
    assemblies, enables me to have more control over when these tests are run. This
    will be covered in more detail in the next section.


    # # AND HOW TO RUN INTEGRATION TESTS


    Integration tests, especially end-to-end tests, can take much longer than unit
    tests, due to their need to interact with the application''s external dependencies.
    The need to interact with these'
