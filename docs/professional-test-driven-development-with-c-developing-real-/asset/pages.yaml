  md: '# WHY REFACTOR?


    When practicing TDD, the goal when initially writing a method or creating a class
    is to simply make the test pass and nothing more. At this point you''re not necessarily
    for style points or to make your code reusable or elegant. You''re simply trying
    to make the tests "all green", meaning that the tests pass all. Once you''ve accomplished
    this, the next step is to improve your code. In practice this a very practical
    approach. Many developers spend too much time trying to make their code elegant
    and beautiful the first time. They end up missing some important pieces of business
    functionality that they have to somehow work into their code. By starting from
    a point of complete business functionality before making your code beautiful,
    you ensure that the top priority — working business code — is met before anything
    else. Unit tests help you make sure that no matter what you change in the name
    of refactoring, your code still needs the benefit. This is the genesis of the
    term familiar refactoring.


    # A Project''s Lifecycle


    TDD involves a lot of new concepts for many developers, such as mocking and dependency
    injection (covered in Chapter 5). These are relatively simple to understand and
    to get comfortable compared to one of the major (not the prime) tests of TDD:
    Write a test before you write your code. The idea behind TDD (the first D stands
    for design) is that your tests become living, executable versions of your business
    (sometimes your nonfunctional or technical requirements). By employing this first
    philosophy, you can ensure that you never write code that does not add value to
    the application. An example of test-first development is the focus of Chapter
    6.


    Once you have a test, your goal is to write enough code to make that test pass.
    More, no less. Your strategy should be to get from point A (a failing test) to
    point B (all passing) with the shortest and straightest line possible. Don''t
    worry about other aspects of the system.


    Also, don''t worry about any aspect of the feature that is not in the tests but
    that you are almost certain the business will. For example; a feature specifies
    that a method takes an integer as an input parameter. You just know that input
    parameter has a value of 100 or less. Your test only test for numbers; yet there
    is nothing in the feature about limiting to numbers with values of 100 or less.
    Until that feature gets scheduled, and a unit test is created for it, it''s not
    a requirement. What happens if that feature never actually gets scheduled? If
    you''ve written code that provides no value but must be maintained with the rest
    of the code base. Or you''ve needlessly overcomplicated what would have been a
    simple piece of functionality. The software development YAGNI for You Aren''t
    Going to Need It. If that feature gets scheduled, at that point you can write
    these tests and the necessary code to make them pass. For now, worry only about
    the test for the current feature you are working on.


    After you''ve concluded your test passes and you haven''t broken anything else
    in the application (all tests pass), it''s time to look at potential areas to
    improve. Maybe your variable or method names no longer reflect the true intent
    of the value or functionality provided. Perhaps you''ve duplicated some functionality
    in your new code. Maybe you have a function that is a bit long, and breaking it
    would improve its readability. In any case, now is the time to refactor.'
