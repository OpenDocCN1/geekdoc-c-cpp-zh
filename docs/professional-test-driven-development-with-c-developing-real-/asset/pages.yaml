    \ symbol, it is overwritten by the call to CheckForThreeInARowVerticalColumn.\
    \ This method returns an empty character, in that case, neither player has a row\
    \ in the first vertical column.\n\nThe value of unit tests when refactoring should\
    \ be clear by this example. You can spot a bug in your code immediately, and because\
    \ you made only a few changes, it's easy to determine where the code broke and\
    \ why. You could engage in refactoring in the first place to ensure the security\
    \ that unit tests provide. You don't have to worry about bugs causing to appear\
    \ in code without your knowledge. Your unit tests give a clear picture of the\
    \ entire health of the code base.\n\nBefore you proceeded to the next feature,\
    \ you need to fix this bug by calling the Validate method to see if the call to\
