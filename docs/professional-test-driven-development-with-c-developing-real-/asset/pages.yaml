    \ You could have easily started with the view, but either way, you have created\
    \ an application that has been thoroughly unit-tested and meets the requirements\
    \ of the user story presented at the beginning of the chapter.\n\n# SUMMARY\n\n\
    WPF and Silverlight are powerful frameworks for creating rich applications using\
    \ XAML. Unit testing applications with these frameworks can be difficult, but\
    \ it is not something you should avoid. As with WCF and ASP.NET, it is important\
    \ to have a testing strategy for your varied clients.\n\nInstead of working around\
    \ the limitations of the code-behind paradigm and trying to instantiate the tightly\
    \ coupled classes, the MVVM pattern facilitates a true separation of the user\
