  md: '# 246 | CHAPTER 11 TESTING WPF SILVERLIGHT APPLICATIONS


    > This chapter assumes a basic level of knowledge and skill with WPF and Silverlight.
    If you are unfamiliar with these technologies, many books and websites on these
    subjects are available.


    # Even though XAML offers a clean separation of the user interface and your logic,
    using the code-behind actually tightly couples the two. This coupling means that
    you can''t instantiate the code-behind without the user interface. In a code-behind-based
    application, every user code that handles the user interactions, validation, and
    even calls to the database or other services can end up in the code-behind. In
    an automated test, you will not be forced to create the UI just to test the logic
    behind. It''s possible to create the UI from a unit test, but this makes testing
    more difficult and error-prone. It becomes even more difficult when the code-behind
    interacts with other services.


    To write automated tests for WPF and Silverlight applications, you need to fully
    separate the logic from the user interface in a way that you can instantiate one
    without the other. There are many ways to do this, but one pattern has recently
    emerged and become the de facto standard for WPF development and is becoming more
    popular in Silverlight, as discussed noted.


    # The MVVM Pattern


    Although it''s not a silver bullet, the Model-View-ViewModel (MVVM), sometimes
    pronounced "moovem" pattern facilitates testing by putting-level code into a class
    that''s completely separated from XAML. Not only does MVVM help with reusability,
    but it also helps if you work with a user experience (UX) designer, you can focus
    solely on the markup instead of worrying about any programming or the business
    logic. Expression Blend is a designer-centric tool that works perfectly with the
    MVVM model. Figure 11-1 is a high-level overview of how MVVM works.


    ![](img/15cb6759e167a2d15e60bc37de753a62_246_0.png)


    In a nutshell, the model contain your data, the view presents your data, and the
    ViewModel ties the two together, sorting and filtering the data as needed. The
    ViewModel also provides methods and commands for the view. Each view (the XAML)
    has a corresponding ViewModel. The View has no knowledge of the Model, in terms
    of what it''s binding to. It''s also possible for multiple views to the same ViewModel.
    Each View puts in the necessary models based on its needs. The models themselves
    to be plain old objects that aren''t much more than containers for your data,
    although they or may not be your domain models.


    For the view to use the ViewModel, it must bind to public properties exposed by
    the ViewModel. This is normally done by setting the view''s DataContext to be
    an instance of the ViewModel and binding each control to individual properties
    of the ViewModel. Because of this, you can avoid any code in the code-behind,
    at least as to relating controls. If you''re coming from a WindowsForms or possibly
    a Classic Basic (versions 3 through 6) groundwork, data binding always seemed
    good, but tended to fall apart when used outside of basic scenarios. The data'
