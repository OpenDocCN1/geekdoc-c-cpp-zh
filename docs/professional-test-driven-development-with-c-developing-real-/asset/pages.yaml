  md: 'The passing test indicates that you have verified the functionality of InventoryService.
    As development goes forward, you have this and other tests to verify that functionality
    of InventoryService is not damaged.


    # Trouble Spots to Watch


    WCF services are unlike other classes that you work in your application. By design,
    they communicate with other applications and processes via a communications channel.
    This communications channel employs some sort of transport to deliver messages
    to and from your WCF service.


    The most common transports are HTTP and TCP. WCF also offers inter-machine communication
    via named pipes and queued delivery by Microsoft Message Queuing (MSMQ). In addition
    to these primary transport methods, WCF provide an architecture that enables you
    to create custom channels using any transport available.


    Most of the time, the choice of transport employed by a service does not pose
    an issue for testing. In some cases a WCF service may be designed to take advantage
    of a particular attribute of a specific transport type. Testing WCF services can
    also be complicated by the ability of WCF services to be called asynchronously.


    You need to put a bit more thought into these cases. You should think about how
    the method under test of the service implementation can be called in a way that
    closely reflects the attributes of the transport that you are attempting to exploit.
    These situations represent edge cases in the development of services, but it''s
    important to know they exist. As these situations arise, I find myself turning
    to the Internet. Websites such as Stack Overflow (stackoverflow.com) and the MSDN
    developer forums (social.msdn.microsoft.com/Forums/en-US/categories) are visited
    daily by developers who are dealing similar challenges to yours. When in doubt,
    ask the people there for advice. It can save you a lot of frustration and keep
    your WCF services testable.


    # SUMMARY


    WCF services are becoming more widespread in .NET applications. As the users''
    needs change and new factors become popular, such as mobile devices, the need
    for services will only increase. It''s important to have a testing strategy for
    WCF services in your application development practice.


    Well-designed WCF services contain no business logic. They rely on the business
    logic in the application layer, which the WCF service consumes. The WCF service
    itself should concern itself only with processing itself, such as validation and
    type transformation. This results in WCF services that are short and simple. But
    these services are still code and need to be tested.


    With dependency injection frameworks such as Ninject, you can statically build
    dependencies from your WCF services. The ability to inject dependencies opens
    the door to WCF services that are testable. Once the WCF service application can
    support dependency injection, it becomes a simple matter to test your WCF services
    as you would any other class: Supply the test implementation with mocked dependencies,
    and verify their functionality.'
