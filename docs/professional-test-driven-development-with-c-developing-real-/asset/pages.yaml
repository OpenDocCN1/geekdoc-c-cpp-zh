  md: '# How to Introduce TDD in Your Team | 303


    component is statically bound to another. This introduces a great deal of flexibility
    in your application, leaving it open to change and extension.


    Most practitioners of TDD employ SOLID Principles. Whether this is by design or
    a side effect of writing testable code, the result is the same. The code that
    is written is easier to understand, more maintainable, and extremely flexible.
    This translates into code that delivers a higher degree of quality to the client.


    +   Fewer defects — By practicing TDD, you are working business code, not defects.
    Because you have a suite of tests that accurately reflect the business needs and
    requirements, and because those tests pass, you can feel confident that your code
    contains few, if any, defects resulting from the business requirements being incorrectly
    implemented. You handle these defects by first writing a test to identify them
    and fixing them. The existence of these tests verifies that the defect will not
    return.


    The quality of your code depends on your tests. If they do not accurately reflect
