  md: "the concrete implementations of these dependency objects didn't disappear;\
    \ it has to be moved somewhere else in the code base. But where?\n\nMany OOP developers\
    \ are familiar with one or more factory patterns such as factory, abstract factory,\
    \ builder and prototype. These are all derivatives of a basic pattern for creating\
    \ classes in an application. Essentially all factory patterns describe a means\
    \ of getting an instance of an object that implements a specified interface. The\
    \ requester knows only which interface it requires. The factory can determine\
    \ which class to use the requester based on which interface is requested, and\
    \ on any configuration settings or context-based rules the factory provides.\n\
    \nThe factory pattern is very useful for abstracting the logic and details create\
    \ dependency objects so that they do not have to appear in an application's business\
    \ domain. A problem arises with more services and dependencies are added to the\
    \ application, the task of managing and maintaining the factories can become difficult\
    \ and time-consuming.\n\nDependency injection (DI) frameworks give developers\
    \ an alternative to the traditional factory patterns. They allow you to quickly\
    \ and easily define dependencies within a system and the rules for creating the\
    \ appropriate objects based on those dependencies. These rules and settings can\
    \ be used to build an entire tree of classes, relieving of needing to know what\
    \ your dependencies are dependent on. In short, a DI framework does all the work\
    \ of a factory with much less work on your part. The examples in this book use\
    \ the Inject framework, version 2.1.0 defined by Nate Kohari and available for\
    \ download at www.nject.org.\n\nThe following code revisits the example from the\
    \ previous section. I've already changed the declared types for DataAccessException,\
    \ WebServiceProxy, and LoggingComponent to the appropriate interfaces and added\
    \ an interface ILoggingDataSink to the LoggingDataSink class. I also deleted all\
    \ code lines\n\n```\npublic class BusinessService {\n    private readonly string\
    \ _databaseConnectionString =\n        ConnectionStrings[\"ConnectionString\"\
    ], ConnectionString;\n    private readonly string _webServiceAddress =\n     \
    \   ConfigurationManager.AppSettings[\"MyWebServiceAddress\"];\n    private readonly\
    \ ILoggingDataSink _loggingDataSink;\n\n    private DataAccessComponent _dataAccessComponent;\n\
    \    private WebServiceProxy _webServiceProxy;\n    private LoggingComponent _loggingComponent;\n\
    \n    public BusinessService() {\n        _loggingDataSink = new LoggingDataSink();\n\
    \        _loggingComponent = new LoggingComponent(_loggingDataSink);\n       \
    \ _webServiceProxy = new WebServiceProxy(_webServiceAddress);\n        _dataAccessComponent\
