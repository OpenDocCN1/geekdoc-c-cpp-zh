  md: '# Microsoft ASP.NET MVC 3.0


    Previous chapters implemented the OSIM example using various technologies such
    as WCF, Visual Studio 2010 ships with ASP.NET MVC 2.0, but this example uses ASP.NET
    MVC 3.0, which is available for download at http://www.asp.net/mvc/mvc3.


    MVC frameworks rely on convention over configuration, so as long as you follow
    the convention, things tend to "just work." Routes are an important application
    of ASP.NET MVC. Simply put, routes, in the MVC framework specify how an HTTP request
    should be handled. In the past, with ASP.Net Web Forms, you were tightly coupled
    to the page handling how requests worked. The following code is default code that
    is added to the Global.asax file when you create an ASP.NET MVC application:


    Global.asax


    It''s important to note this, because many newcomers to ASP.NET MVC will overlook
    this. The code states that your URL will look like this: http://controller/action/id
    or http://localhost/home/index, assuming you have an index method within a controller
    class named home.


    # Creating an ASP.NET MVC Project


    Creating an ASP.NET MVC project is as simple as selecting MVC 3 Web Application,
    found under the Web project types you use to create a new project, as shown in
    Figure 9-8.


    ![](img/15cb6759e167a2d15e60bc37de753a62_212_0.png)


    FIGURE 9-8'
