  md: 'external dependencies can also cause issues if two or more developers attempt
    to run these tests concurrently. For these reasons, integration and end-to-end
    tests are not, and should not be, run as unit tests.


    When run by developers, integration and end-to-end tests should be run when the
    developers have completed or are close to completing a feature or user story.
    This is necessary to ensure that you have not introduced any defects into your
    application''s current functionality. Some developers or development teams create
    a practice that developers need no integration and end-to-end tests that do not
    relate to the work, user story that the developer is working on at the time. This
    can be a fine practice, provided that the application is easy to determine which
    tests are germane and tests don''t need to be run. At the very least, these tests
    must be run before you commit any code to the code repository.


    Integration and end-to-end tests should also be run as part of a CI process. One
    of the purposes of a CI process is to ensure that all various components and sections
    of an application function and correctly before the application is released to
    the QA staff. This ensures that the QA staff does not spend time testing an application
    that has already been flagged as unusable. Another benefit of running these tests
    as part of the CI process is that it does not tie up development resources while
    the tests are running. CI servers can execute long-running tests as part of the
    build process and report on them, if any. In the meantime the development can
    continue working on other features or user stories. This is an attractive feature
    for teams who are working on applications where the integration and end-to-end
    tests take a long time to run. Needless to say, any tests that fail as part of
    the CI process should become the top priority of the application development team.
    All other activities should be suspended until the build is in an "all green"
    state again.


    # SUMMARY


    Integration tests are important to the quality of your application. Unit tests
    ensure that the individual components meet the business requirements as documented
    by the features and user stories. Integration tests ensure that these individual
    components work together to create a functioning application.


    When writing integration tests, you want to concentrate on the seams between the
    individual components in your application. In the seams between the various internal
    components, you want to target the seams between your application and external
    resources such as databases, web services, file systems, and anything else that
    is not specifically a part of your application.


    Like unit tests, integration tests expect to execute in an environment that is
    in a predictable state. Unlike unit tests, which rely on dependency objects and
    mocking to provide a stubbed environment, integration tests must use versions
    of the actual resources objects. As part of your integration test suite, you need
    to ensure that you are resetting the test execution environment to a consistent
    state before the integration tests run.


    Unit tests test the internal functioning of your application''s individual components,
    and integration tests test the seams between the individual components of your
    application. End-to-end tests are a specialized type of integration test that
    verifies the application code can execute entire business'
