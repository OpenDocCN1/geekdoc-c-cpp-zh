- img_proc: true
  md: "Item item = new Item();\nAssert.True(item.IsExpired());\n\n```\n[Test, Isolated]\n\
    public void Item_Should_Not_Be_Expired()\n{\n    Isolate.WhenCalled(() => DateTime.Now).WillReturn(DateTime(1981,\
    \ 11, 21));\n\n    Item item = new Item();\n    Assert.IsFalse(item.IsExpired());\n\
    }\n```\n\nTypeMock.\n\nWith features such the ability to mock any object, Type\
    \ Mock is great for legacy applications, where testing was an afterthought. Information\
    \ about the Type Mock isolation framework can be found at http://www.typemock.com.\n\
    \n# DEPENDENCY INJECTION FRAMEWORKS\n\nIf you think of your application as a puzzle,\
    \ dependency injection (DI) frameworks are the tools that put these puzzle pieces\
    \ together. Might even say that dependency injection frameworks are just an implementation\
    \ of a super fact design pattern. Chapter 5 discussed the basics of dependency\
    \ injection. The examples used Ninject, Ninject is not the only dependency injection\
    \ framework on the market.\n\nIn the past, most dependency injection frameworks\
    \ were configured by using XML files that soon became difficult to maintain. Most\
    \ modern dependency injection frameworks still support this method of configuration,\
    \ but this is generally frowned upon and has traded for cleaner approaches. This\
    \ section explores a few alternative dependency injection frameworks using the\
    \ example from Chapter 5 to inject dependencies into a business application.\n\
    \nWhen choosing a dependency injection framework, you should follow these rules:\n\
    \n+   - Keep the framework at a distance.\n- Focus on the Inversion of Control\
    \ pattern.\n\n# Structure Map\n\nStructure is an open source container framework\
    \ that has a fluent API that makes the code easy to read and maintain. One of\
    \ the most powerful features of Structure Map is the awesome container.\n\nThe\
