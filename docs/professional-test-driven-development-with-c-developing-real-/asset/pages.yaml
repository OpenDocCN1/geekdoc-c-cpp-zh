  md: '# 1


    # The Road to Test-Driven Development


    # WHAT''S IN THIS CHAPTER?


    +   - How has software development evolved to bring us to TDD

    - What an Agile methodology is and how it differs from traditional waterfall-based
    technologies

    - What TDD is and what are the benefits of using it are


    Test-Driven Development (TDD) has become one of the most important concepts and
    practices in modern software development. To understand why this is, consider
    the history of what TDD was created through an almost evolutionary process. It
    came about as a response to the difficulties and challenges of writing software,
    but there was no real plan for its creation. It''s a classic case of the traits
    of a thing that made that more successful and stronger being propagated and the
    traits that lead to failure being discarded. The practices of TDD were not created
    by any single company or individual; they rose from countless discussions (or,
    more likely, arguments) about what was done in the past, why it failed, and what
    could be better. If TDD is a structure, such as a house, its foundation is created
    from failure. Failed projects, which developers knew had to be a better way, are
    how TDD has been built.


    In this chapter you learn about the history of software development and how the
    methodology of managing software projects has moved from favoring waterfall to
    agile methodologies. You''ll learn how the practice of Test-Driven Development
    is a key component of agile methodologies to ensure that quality code addresses
    the business needs is being produced. I will explain the tenets of Test-Driven
    Development, outline its benefits, and show you an example of how Test-Driven
    Development is done.'
  merge: -1
  pgno: 10
- img_proc: true
  md: '# THE CLASSICAL APPROACH TO SOFTWARE DEVELOPMENT


    To understand the importance of TDD, it''s necessary to see the road that led
    to it. Over the past 50 years the practice of software development has constantly
    evolved in an effort to find a balance between the needs of the business, the
    capabilities of the current technology, and the methodology in which developers
    are most productive. Misssteps have occurred along the way, but even when they
    were important as means of determining which techniques and methodologies were
    evolutionary dead ends. This chapter reviews the road to TDD.


    # A Brief History of Software Engineering


    Software development for business began during the age of the mainframe. Each
    hardware vendor seemed to have its own unique pattern and paradigm for developing
    software. Sometimes these were similar to each other that developers could move
    from job to job and platform with very little friction. Other times it was starting
    from scratch. The basic concepts of computing were the same, each vendor had its
    own, sometimes very unique on those concepts. Languages were archaic, requiring
    many lines of code to do the simplest things that are granted today. And many
    times what worked in one implementation language or platform didn''t work the
    same way in another.


    The mainframe was a large, expensive piece of equipment. Many companies did not
    own one, so the concept of the service bureau was born: Companies with a mainframe
    would lease them on their computer to customers. Unfortunately, this meant waiting
    for access to the computer. Imagine if you were to write a program today but couldn''t
    compile it until next month. It would be hard to be a productive developer with
    that kind of constraint. Suppose you attempted to compile on Monday but encountered
    an error. You could fix it, but wouldn''t know if your fix was correct for three
    more days. The limited access to computing resources meant that, out of necessity,
    took a backseat to getting the product out of the


    These were also the days before the concept of waterfall development. Developers,
    left to their own devices, often worked in an iterative manner, scoping out specific
    pieces of a system and completing those, and then adding new features and functionality.
    This method worked well, because it allowed developers to approach development
    in a manner that let them understand and manage. Business users and what was logical
    and comprehensible to them were not taken into consideration.


    The second generation of mini-computers emerged in 1977, but they didn''t really
    take off in business until 1979 with the release of VisCalc. VisCalc was the first
    spreadsheet available for the personal computer. It demonstrated that PCs weren''t
    just toys for the home, but machines that could real value to business. PCs offered
    many advantages over mainframes, the first one that were much less expensive.
    A business that couldn''t afford even one dedicated mainframe could afford dozens
    of PCs. And although PCs weren''t as fast as mainframes, their availability made
    them ideal for day-to-day tasks that didn''t require the power of the mainframe.
    Developers could write applications for the PC and know right away if their code
    worked. They also didn''t have to wait days to have their jobs scheduled and run.'
  merge: -1
  pgno: 11
- img_proc: true
  md: '# The Classical Approach to Software Development


    Things get even better with third- and fourth-generation programming languages.
    They abstracted some of the more mundane tasks of their predecessors and allowed
    developers to be more productive by focusing on the business problem at hand.
    These languages also opened software development to a wider audience who didn''t
    want to deal with the friction of languages as Assembler and C. Business and the
    computer industry ultimately settled on a few base languages and their derivatives.
    This helped developers become more attractive and marketable to business as their
    skills became portable.


    Ultimately business''s need to plan brought about the waterfall methodology. The
    concept behind waterfall was every software project, whose average time span was
    about two years, should have every phase from inception to delivery planned from
    the start. This necessitated a long period at the beginning for requirements gathering.
    After all the requirements were gathered, they were "thrown over the wall" to
    the architects. The architects worked and designed the system that would be built
    down to the smallest detail. When they completed this task, they drew the design
    over the wall to the developers, who built the system. After the developers completed
    their work, they them to the Quality Assurance (QA) department, which tested the
    application. As soon as the application was validated, it was deployed to the
    users.


    Software testing in a waterfall methodology was often a long, inefficient, and
    expensive process. QA testers would test application by manually running test
    scripts, which documents instructed the tester to carry out an action in the system
    and describe the result the tester should observe. Sometimes these scripts ran
    into hundreds of pages. When a change was made to the system, it could take a
    tester two or more weeks to completely regression-test the system. Another issue
    was that these test scripts were written by the developer who created the system.
    In these cases the scripts described how the system would act, not how it should
    act.


    The first step toward TDD happened with the proliferation of automated QA testing
    tools. These tools recorded a series of actions a user takes on a user interface
    (UI) and allowed them to be played back later. That verified the UI worked. After
    the initial tests were recorded, the QA tools allowed much faster regression testing
    than manual tests and could be repeated. A large failing of many of these early
    tools was that the tests created were brittle. When an aspect of the UI changed,
    the test usually couldn''t handle the change, and the test would break. For tools
    that used the record/playback model, meant the test had to be discarded and a
    new one created. Later versions of these tools allowed for scripting that would
    make some of these changes easier to absorb, but these tests remained fragile.


    # From Waterfall to Iterative and Incremental


    Software development doesn''t happen in a void. It doesn''t matter if it''s an
    18-month project to create an application to collate the Enterprise''s Testing
    Procedure Specification (TPS) reports or a website that you build for your child''s
    pretty hockey team; you are using a methodology. You have requirements, you plan
    features, and you build the application. After it''s tested, you deploy it to
    a useful user base.


    A problem with the waterfall methodology is that all the requirements are gathered
    early on. In business, requirements often change for a variety of reasons. Changes
    in the law, a shift in the company''s strategic direction, or even something as
    a mistake in the requirements-gathering phase could have serious repercussions
    for the downstream process. The planned-out'
  merge: -1
  pgno: 12
- img_proc: true
  md: 'nature of waterfall does not respond well to change. A change request to the
    system generally must go through the same requirements/design/development/QA process
    that the rest of the system did. This creates a ripple effect that causes the
    rest of the plan to become inaccurate.


    To create the upfront plan, the work must be estimated — sometimes years before
    the actual work is to be done, and usually by someone who won''t do the work.
    This creates a house of cards in which one wrong estimate can wreak havoc across
    the rest of the project plan.


    The architects aren''t blameless. This era to "tower architects" who created designs
    for applications that were practice impractical, or in some cases, impossible.
    Developers didn''t help the case either, because many of them simply carried out
    the architect''s design vision, or not it made sense. Many times what was developed
    for the business (two times after it had been requested) did not remotely resemble
    what was wanted or needed.


    In an effort to solve of these issues, waterfall development turns to the concept
    of iterative or incremental development. The idea was to take a large waterfall
    project and divide it into several smaller waterfall projects. Each project would
    have a defined scope and delivery target and upon completion would feed into the
    next iteration of the larger project. This was an improvement, but it resulted
    in smaller projects that were easier to define and got software in front of users
    faster. However, in the end it was just several linked projects, albeit shorter
    ones. The individual project still did not have a good mechanism for dealing with
    the constant change of business and technology. Another step was needed.


    # A QUICK INTRODUCTION TO AGILE METHODOLOGIES


    Unlike waterfall, which seeks to control and constrain the realities of software
    development, agile methodologies embrace them. Change in business is inevitable,
    and software development methodologies must be able to adapt. A key failure of
    the up-front plan is that by their very definition are always wrong. If they were
    correct, they wouldn''t estimates; they would be the "number." An iterative process
    shows, but the iterations themselves, and the methodology as a whole, must be
    flexible and open to change.


    # A Brief History of Agile Methodologies


    In February 2001 several proponents of new methodologies such as Scrum, Extreme
    Programming (XP), Pragmatic Programming, Feature Driven Development, and others
    met and drafted the Agile Manifesto. It reads as follows:


    > “We are uncovering better ways of developing software by doing it and helping
    others do it. Through this work we have come to value:


    +   - Individuals and interactions over processes and tools


    +   - Working software over comprehensive documentation'
  merge: -1
  pgno: 13
- img_proc: true
  md: '+   Customer collaboration over contract negotiation


    +   Responding to change over following a plan


    That is, while there is value in the items on the right, we value the items on
    the left over.


    The Agile Manifesto is not a development methodology. It doesn''t prescribe how
    software should be developed. It simply states a set of key values that can be
    used to create and describe lighter and faster development methodologies that
    are more focused on people, working software, and less than meticulous multilayer
    project plans and mountains of documentation.


    Many branded agile development methodologies are in use:


    +   Scrum


    +   Extreme Programming (XP)


    +   Feature Driven Development


    +   Clear Case


    +   Adaptive Software Development


    # The Principles and Practices of Test-Driven Development


    These methodologies are all different in how they are implemented, but they share
    some characteristics:


    +   They make communication across the team a high priority. Developers, business
    users, and testers are all encouraged to communicate frequently.


    +   They focus on transparency in the project. The development team does not live
    in a black box that observes their actions from the rest of the team. They use
    public artifacts (a Kanban board, a big visible chart, and so on) to keep the
    team informed.


    +   The members of the team are all accountable to each other. The team does not
    succeed or fail because of one person; they either succeed or fail as a team.


    +   Individual developers do not own sections of the code base. The whole team
    owns the entire code base, and everyone is responsible for its quality.


    +   Work is in short, iterative development cycles, ideally with a release at
    the end of each cycle.


    +   The ability to handle change is a cornerstone of the methodology.


    +   Broad strokes of a system are defined up front, detailed design is deferred
    until the feature is actually scheduled to be developed.


    Agile methodologies are not a silver bullet. They are also not chaos or “cowboy
    coding.” In fact, agile methodologies require a larger degree of discipline to
    administer correctly. Furthermore, no one true agile methodology exists. Ultimately,
    each team needs to do what works best for them. This may mean starting with a
    branded agile methodology and changing it, or combining aspects'
  merge: -1
  pgno: 14
- img_proc: true
  md: 'of several. You should constantly evaluate your methodology and do more of
    what works and less of what doesn''t.


    # THE CONCEPTS BEHIND TDD


    The history of TDD starts in 1999 with a group of developers who championed a
    set of concepts known as Extreme Programming (XP); XP is an agile methodology
    that is based on recognizing practices in software development are beneficial
    and dedicating the bulk of the developers time and effort to those practices under
    the philosophy “if some is good, more is better.” A key component of XP is test-first
    programming. TDD grew out of XP as some developers found they were not ready to
    embrace some of the them, at time, radical conservatives, found the promise of
    improved quality that was delivered by the practice of TDD compelling.


    As mentioned, agile methodologies do not incorporate a big design. Business requirements
    are distilled into features for the system. The detailed design for each feature
    is done when the feature is scheduled. Features, and their resulting libraries
    and code, are kept short and simple.


    # TDD as a Design Methodology


    When used as an application methodology, TDD works best when the business user
    is engaged in the process to develop the logic that is created, sometimes goes
    far as to define a set of input and expected output. This is necessary to ensure
    that the developers understand the business requirements before the feature are
    developing. TDD ensures that the final product is in line with the needs of the
    business. It helps ensure that the scope of the feature is adhered to and helps
    the developer understand what done really means with respect to the current feature
    in development.


    # TDD as a Development Practice


    As a development practice, TDD is deceptively simple. Unlike the development you''ve
    done in the past, where you might sit and start by creating a window, a web page,
    or even a class, in TDD you start by writing a test. This is known as first development,
    and initially it might seem a bit awkward. By writing your test first, what you
    are really doing is creating the requirement you are designing for. As you work
    with the business user to define what these tests should be, create an executable
    version of the requirement that is composed of your test. Until these tests pass,
    your code does not satisfy the requirement.


    When you write your first test, the first indication that it fails is that the
    application does not compile. This is because your test is attempting to instantiate
    a class that has not been defined, or it wants to use a method on an object that
    does not exist. The first step is to create the class you are testing and define
    whether on that class you are attempting to test. At this point your test will
    still fail, because the class and method you just didn''t do anything. The next
    step is to write just enough code to make your test to pass. The goal is not to
    write code based on what might be coming in the requirement. Until requirement
    changes, or a test is added to expose that lack of functionality, it doesn''t
    get written. This prevents you from writing overly complicated code'
  merge: -1
  pgno: 15
- img_proc: true
  md: '# The Benefits of TDD


    where a simple algorithm would suffice. Remember, one of the goals of TDD is to
    create code that is easy to understand and maintain.


    As soon as your first test is passing, add more tests to ensure that all the requirements
    of the feature being tested are met. As part of this process, you want to ensure
    that you are testing your methods for multiple input combinations. This includes
    values that fall outside the approved range. These are called negative tests.
    If your requirement says that your interest calculation method should handle only
    percentage rates up to 20%, what happens if you try to call it with 21%? This
    should cause an exception of some sort to be thrown. If your method takes arguments,
    what happens if you pass an empty string? What happens if you pass in nulls? Although
    it''s important to keep your tests inside the realm of reality, triangulating
    tests to ensure the durability of your code is important too. When the entire
    requirement has been expressed in tests, and all the tests pass, you''re done.


    # THE BENEFITS OF TDD


    When describing TDD to developers, development managers, and project managers
    who have never experienced it, I am met with skepticism. On paper, creating code
    seems like a long and convoluted process. The benefits cannot be ignored, however:


    +   TDD ensures quality code from the start. Developers are encouraged to write
    only the code needed to make the test pass and fulfill the requirement. If a method
    has less code, it''s logical that the code has fewer opportunities for error.


    +   Whether by design or coincidence, most TDD practitioners write code that follows
    the SOLID principles. These are a set of practices that help developers ensure
    they are writing quality software. While the tests generated by the practice of
    TDD are extremely valuable, the quality that results as a side-effect is an incredibly
    potent benefit of TDD. The SOLID principles will be covered in Chapter 3.


    +   TDD ensures a high degree of fidelity between the code and the business requirements.
    If your requirements are written as tests, and your tests all pass, you can sign
    with a high degree of confidence that your code meets the needs of the business.


    +   TDD encourages the creation of simpler, more focused libraries and APIs. TDD
    turns development a bit on its head, because the developer writing to the library
    or API is also its first consumer. This gives you a new perspective on how the
    interface is written, and you know instant if the interface makes sense.


    +   TDD encourages communication with the business. To create these tests, you
    are encouraged to interact with the business users. This way, you can make sure
    that the input and output combinations make sense, and you can help the users
    understand what they are building.


    +   TDD helps keep unused code out of the system. Most developers have written
    applications in which they designed interfaces and methods based on what might
    happen. This leads to systems with large parts of code or functionality that are
    never used. This code is expensive. You expend effort writing it, and even though
    code does nothing, it still has to be maintained. It also makes things cluttered,
    distracting you from the important working code. TDD helps keep this parasite
