    Express, include a well-written test runner. It is similar to other test runners
    but fits within Code Rush, providing users with a highly extensible tool. It also
    works right out of the box. Code Rush has become known as the Visual Studio add-on
    that helps developers write code fast and provides suggestions in an aesthetically
    pleasing way. With other test runners, you can perform testing by right-clicking'
