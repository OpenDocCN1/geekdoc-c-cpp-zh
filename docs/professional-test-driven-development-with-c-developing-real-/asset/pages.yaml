  md: '# 6


    # Starting the Sample Application


    WHAT''S IN THIS CHAPTER?


    +   - How business requirements drive drive features that define unit tests

    - What steps to take before application development begins

    - How to make decisions about application technologies

    - How user stories drive agile application development methodologies

    - Why project organization is important and what to keep in mind when creating
    your project


    Before you write a single line of code for an application, you must complete many
    tasks. An application is defined by a set of functional business requirements
    and a set of nonfunctional, technical requirements. The functional requirements
    describe what the application must do to meet the business''s needs. The nonfunctional
    requirements describe a set of conditions or parameters within which the application
    must exist. After this information is gathered, functional requirements are used
    to create user stories, which are decomposed into features that are assigned to
    developers to be built. Nonfunctional requirements are used to determine the application
    platform and structure, as well as what frameworks, if any, should be used in
    the application.


    In this chapter you will see the various steps and decisions that are necessary
    before starting to write an application. You will be given an insight into a working
    agile implementation. You''ll see what decisions are made before the topic of
    technology is even discussed, and how the proper technology is chosen once those
    decisions are made. Finally, you''ll see how to start your project by creating
    the basic projects needed for the sample application in a Visual Studio solution.'
  merge: -1
  pgno: 121
- img_proc: true
  md: '# DEFINING THE PROJECT


    Most developers like to write code. In most cases, this is what led us to become
    developers in the first place. Most developers try to solve a given problem with
    code. Many developers communicate in code. Some developers even think in code.
    Given the option, I believe most developers would attempt to do all communicating
    and solving in code. Unfortunately, for the rest of the business does not communicate,
    let alone think, in code.


    No application gets without a set of requirements. Even a small application that
    you might write to keep track of your DVD collection has some sort of requirements-gathering
    phase, even if it''s very important. Before you write an application, you need
    to know what the application is supposed to do. In addition to knowing what the
    application will do, you must know how the application is to be built and under
    what conditions it will have to run. All these decisions should be made before
    development.


    The business functionality of the application is defined by the business requirements.
    The technological foundation of the application is defined by the target environment
    and the choice of technologies used to build the application. In an ideal situation,
    while the technological choices made should complete the business, the business
    would not be made to the whim of the chosen technology. Unfortunately, ideal situations
    are rare. For that, it''s important to make these decisions with the business
    needs early on, and let them drive the technological needs.


    The target environment defines what resources the application requires to perform
    its task as well as what limits the application must work within. The definition
    of this environment is important to ensure that your application has the necessary
    resources at deployment, and has been designed and built in such a way that it
    does not attempt to exceed its means. The choice of technologies used to build
    the application is important as well. In many cases this will already be decided
    for you; your company may have standardized on a specific version of .NET and
    a handful of application frameworks. In other cases you may need to make the case
    for an inclusion new framework or to upgrade to the latest version of .NET. These
    factors have a great deal of influence on how an application is designed and built,
    and the sooner you can make these decisions better.


    # Developing the Project Overview


    As a business developer, you will spend most of your time building applications
    to suit a particular need of the business. It could be an application to streamline
    or automate an existing process or application to help the company take advantage
    of a new revenue stream. In any case, a set of high-level requirements must be
    gathered to identify the application''s business needs.


    A project overview is a high-level description of the application''s business
    needs. It describes the application''s overall purpose, some of the key work flows,
    and the major user roles and types for the application. This overview is designed
    to provide the broad strokes of the business requirements. No detailed design
    or user story creation is done at this point. The idea is to simply identify the
    large, high-level pieces of the application so that they can be broken down at
    the next stage.'
  merge: -1
  pgno: 122
- img_proc: true
  md: 'The next few chapters describe the building of an office supply inventory management
    system, the code for which will be available on www.wrox.com. I''ll call this
    application OSIM for short. As part of the project overview for OSIM, I have identified
    the application''s business needs:


    +   - The application must keep track of inventory currently in stock.

    - The application must allow users to add new types of items to the inventory
    list.

    - The application must allow users to log replenishments of items into inventory.

    - The application must allow users to log items being removed from inventory for
    use.

    - Users must be authenticated.


    Notice that this list doesn''t specify how of these tasks should be done. It doesn''t
    address any technology-specific issues. In fact, you could meet all these business
    requirements with a notebook kept in a filing cabinet. The point of the project
    overview is to identify the needs while taking an objective and somewhat detached
    view of the technology that will be used. A pitfall at this stage of the project
    is the people involved, driven by the developers, will subconsciously try to guide
    or bend the requirements to a specific technology or solution they have in mind.
    This is the opposite of what should be done: The technology should serve the needs
    of the business, not vice versa.


    # # Defining the Target Environment


    Often the needs of the business will impact what the target environment of your
    application will be. When thinking about the environment that your application
    will be deployed to, you need to do more than simply what operating system the
    server will run. You need to think about how the application will be used. Will
    it be a web-based application? Will it run on the user''s desktop? Maybe it will
    run on a mobile platform. You will need to develop services as part of your application?


    It''s important to think about how the application will be built, and what infrastructure
    based requirements will be levied against. Does the application have multiple
    tiers? How many concurrent users do you expect at peak times? What kind of response
    does the application need to provide? Will the application need to scale? Will
    it be expected to scale vertically (moving to a more powerful server) or horizontally
    (deploying the application to more servers)? How do those needs affect your application
    architecture?


    The application''s target environment should be described in the application''s
    nonfunctional requirements. In some cases a target environment will already be
    defined, and your application must be designed to fit that model. In others cases
    a new environment will be built, but there may be other constraints, such as budget
    and company hardware and/software standards. These all need to be taken into account
    when defining your application''s target environment.


    For the OSIM application, the target environment will have to accommodate a multiered
    application. As part of the technical requirements, the business owner has stated
    that he wants the application to be a web-based front end, a Windows client-based
    front end, and a services interface for external trading partners and various
    Enterprise reporting tools. The tiers will consist of the user interface tier
    (this includes any application-external web services), business'
  merge: -1
  pgno: 123
- img_proc: true
  md: 'logic tier, and a data storage tier. Because this is a small, interdepartmental
    application, you''re expecting no more than two to four concurrent users; however
    the tiered architecture gives this application room for growth. Based on this,
    you define your target environment as a Microsoft Windows server IIS 7 or later
    (this does not have a dedicated server) and Microsoft SQL Server 2008 R2.


    # # Choosing the Application Technology


    After a target has been defined, you must settle on an application platform. JEE,
    .NET, Ruby on Rails, and PHP are some of the more popular platforms for creating
    web applications. The choices you make when defining the target environment will
    provide some guidance in choosing an application platform, because some operating
    systems are better at supporting specific application platforms.


    Beyond the operating system, you must consider some other things when choosing
    an application platform. Does your development staff already have a high degree
    of knowledge and experience with a specific platform? Do you have a significant
    investment in a particular platform? What best fits the needs of the application
    you''re building? Finally, you want to choose an application platform that has
    a future and will continue to be supported forward.


    After you have selected a platform, you will still face many decisions. Will your
    application use an Object Relation Mapper (ORM)? If so, which one? Which dependency
    injection (DI) framework should you use? What about a unit test framework? Which
    one is best suited to your needs? What about web framework? The answers to these
    questions can be reached at much like the answer to which platform to use: Find
    a tool that fits your needs, has good support, and will be there in the future.


    The Osim application will use several frameworks, which are discussed in the section
    "Choosing the Frameworks.\ The frameworks I focus on for the purposes of this
    book are nUnit, nBehavior, MOQ, and Ninject. The others are listed for illustrative
    purposes and for a level of completeness. No prior experience with those frameworks
    is necessary to follow along.


    # # DEFINING THE USER STORIES


    In an agile development methodology, user stories define business rules and work
    flows for the application. These user stories, are driven by the business''s needs,
    become the application''s functional requirements. As user stories collect, they
    are decomposed into application features that are assigned to developers, the
    developers then use to define their tests, which drive development. For more background
    on agile methodologies, please refer to the section "A Quick Introduction to Agile
    Methodologies" in Chapter 1.


    # # Collecting the Stories


    User stories are representations of the business requirements for an application.
    They should describe the expected interactions the business users will have with
    the application. The act of collecting user stories roughly correlates to the
    activities described in the section "Project'
  merge: -1
