  md: '# 12


    # Dealing with Defects and New Requirements


    WHAT''S IN THIS CHAPTER?


    +   - Understanding why applications need to be flexible in a modern business
    computing environment

    - Using TDD to deal with changes to your application

    - Building more flexible applications through TDD

    - Practicing TDD in a situation where a new feature has been introduced or a defect
    identified in an application


    Application development efforts do not live in a vacuum. The increasing popularity
    of agile project methodologies is testament to that fact. In an agile environment,
    development efforts span months — if not years — between the first requirement
    is documented and the day the application is deployed to production. This leaves
    a lot of time for requirements to change.


    Changes don''t end after an application reaches production. No matter how good
    the development team and QA department do, most applications have some sort of
    defect that isn''t discovered until the application reaches production. Even if
    an application makes it to production and no defects are found, actions and influences
    from a variety of external forces (customer, government, market forces) can demonstrate
    a need for changes in an application.


    In TDD, defects and new requirements represent opportunities to create new tests.
    By approaching defects and new requirements with a test-first philosophy, you
    can more easily deliver a quality application without damaging existing functionality.
    Reading this book has helped you acquire the skills and knowledge you need to
    handle these situations. Now it''s simply a matter of taking those skills and
    that knowledge and applying them in a slightly different manner.'
  merge: -1
  pgno: 265
- img_proc: true
  md: '# HANDLING CHANGE


    Change is inevitable. Historically, most business applications have not dealt
    with change well. This is because most applications, despite the best intentions
    of the developer and architects, become brittle and fragile. Without the security
    of a unit and integration test suite, most applications devolve into the code
    of a Jenga tower. Before long, the application is so unstable that most developers
    are afraid to touch it, the whole thing coming down.


    These applications lacked unit and integration tests. Without a method to automatically
    regression-test an application that had changed a made to it, no one could guarantee
    that the application would function properly after the change. Developing an application
    while practicing TDD provides a suite of these tests to ensure that as changes
    are made, the application remains stable.


    The practice of TDD has another side effect that makes applications more flexible
    in the face of change. Developers who practice TDD, whether by design or as a
    side effect of writing code for testability, seem to follow the SOLID principles
    more than developers who do not practice TDD. Adhering to SOLID principles results
    in software that is easier to maintain and extend. This is clearly a benefit in
    an environment where change is inevitable.


    # Change Happens


    An application might need to change after being deployed to production for a number
    of reasons. Perhaps the company has adopted a new business strategy or identified
    a new market to enter. Many business sectors such as finance and medicine are
    heavily regulated by state and federal government. New laws and regulations are
    passed all the time. Customers who use an application might want new features
    to be added or changes to be made to existing functionality. No application is
    immune to defects.


    Whatever the source or reason for a change to your application, as a developer
    you must address new requirements and defects. In an application where TDD has
    been practised from the start, the approach may be obvious. Even in cases where
    an application has not been developed using TDD, the practice can still be employed
    when new features and fixing defects. Tests ensure a degree of quality in your
    application, and this commitment to quality should be carried through post-deployment
    development work.


    # Adding New Features


    New features can be introduced into an application at any time. New features introduced
    during the normal development cycle when an agile methodology is used are not
    noteworthy. They are added to the project backlog and scheduled like any other
    feature. Features introduced after the application has been deployed to production,
    when the bulk of the development team has presumably moved to another project,
    are a bit different.


    It''s important that features introduced after an application''s primary development
    life cycle has ended are treated like features that are known and built during
    that application''s primary development life cycle. Do not fall into the trap
    of thinking that corners can be cut and quality compromised in the name of speed
    because the application is "done." There will always be new features. There will
    always'
