    \ value of the primary key or ID. Specifying which field in the entity is the\
    \ ID is done in the mapping, which is covered in Chapter 8. Next call Flush to\
    \ ensure that any pending operations to the database are complete. When the end\
    \ of the using block reached, the Session is closed.\n\nRunning the test again\
