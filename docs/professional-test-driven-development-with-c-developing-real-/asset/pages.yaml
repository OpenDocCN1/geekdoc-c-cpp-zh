- img_proc: true
  md: "tests do not call for any fields in the definition of ItemType. For the purposes\
    \ of this example, though, you add a name field, because it makes this example\
    \ a bit more meaningful:\n\n```\nnamespace OSIM.Core.Entities\n{\n    public class\
    \ ItemType\n    {\n        public virtual int Id { get; set; }\n        public\
    \ virtual string Name { get; set; }\n    }\n}\n```\n\nAt this point, you might\
    \ be wondering why these fields are declared as virtual. The short explanation\
    \ is that Fluent NHibernate uses reflection as part of its process when creating\
    \ data table schemas. Without declaring these fields as virtual, Fluent NHibernate\
    \ would not be able to do its magic.\n\nInevitably, if you've been working with\
    \ Fluent NHibernate for some time, you will occasionally forget this requirement.\
    \ A good rule of thumb is that if you get a mapping error that doesn't seem to\
    \ make sense, first check to make sure that all the public members of the class\
    \ that you are mapping are declared as virtual. This is usually the problem.\n\
    \nIt's finally time to create the mapping for ItemType. Returning to the ItemTypeMap,\
    \ you add the mapping for Id and Name to the constructor for ItemTypeMap:\n\n\
    ```\npublic class ItemTypeMap : ClassMap<ItemType>\n{\n    public ItemTypeMap()\n\
    \    {\n        Id(x => x.Id);\n        Map(x => x.Name);\n    }\n}\n```\n\nId\
    \ and Map are the most commonly used Fluent NHibernate mapping commands. Id specifies\
    \ in which field of the entity class to map the primary key of the data table\
    \ to be created. The Map command tells Fluent NHibernate to map that field in\
    \ the entity class to a field of the same name in the data table. The result is\
    \ the creation of a class called ItemTypes with two columns: Id (which is the\
    \ primary key) and Name. There are extensions for things such as relationships\
    \ and indexes, which will be used later in the project. Also, some complex commands\
    \ allow you to do things as store two similar types in the same table or fields\
    \ where the name of the table or field in the database does not match the class\
    \ or field name in the application code. This is all covered in the Fluent NHibernate\
    \ documentation."
