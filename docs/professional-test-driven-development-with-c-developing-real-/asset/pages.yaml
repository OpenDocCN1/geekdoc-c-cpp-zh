  md: '# APPENDIX


    # TDD Katas


    WHAT''S IN THIS APPENDIX?


    +   - The importance of practicing what you have learned in this book

    - Why you must share your code with others

    - practicing the wrong thing wastes time

    - The OSIM katas


    Kata is the Japanese word for practice. I first heard the term when I was 8 and
    started taking tae kwon classes. A kata is a series of choreographed moves designed
    to help students sharpen their technique and commit to memory specific patterns
    of attacks and blocks. If you''ve ever seen two highly skilled and trained martial
    artists fight, you''ve no doubt noticed the incredible speed with which they move
    and string together attacks and blocks. That is the result of hours upon hours
    of katas.


    Practice makes perfect. Talent helps. But most athletes, musicians, and anybody
    who has achieved great success in their field will tell you that practice turns
    the potential of talent into the reality of success. In his book Outliers (Little,
    Brown and Company, 2008, ISBN: 9780316017293), Malcolm Gladwell defines the “10,000-Hour
    Rule.” In short, the key to success is mostly a matter of practicing a specific
    task for approximately 10,000 hours. He makes a compelling argument, citing the
    success of the Beatles, Bill Gates, and Tiger Woods.


    # WORKING WITH TDD KATAS


    Practice is important for building the skills required to be a productive TDD
    developer. You must master new technical skills such as dependency injection,
    MVC/MVVM, unit-testing frameworks, and supporting frameworks such as NBehave.
    You also must make many mental-'
  merge: -1
  pgno: 303
- img_proc: true
  md: 'adjustments when approaching TDD, such as adopting the SOLID Principles and
    becoming comfortable with the idea of test-first-development.


    For the purposes of creating a TDD kata, this appendix provides a series of user
    stories for the OSIM application. This appendix is sparse and incomplete by design.
    My hope is that you will take these user stories and complete the OSIM as a form
    of kata. Do it once. Then do it again. Do it again. Keep doing until you are comfortable
    with your TDD skills. This is especially necessary if you are not currently working
    in an environment that supports TDD. Your skill is like a saw. It could be made
    by the best craftsman using the finest materials, but if you do not maintain it,
    it will stay sharp for long.


    # SHARE YOUR WORK


    Several years ago I started playing hockey. A big part of hockey (I would say
    90%) is the ability to skate. I already knew how to skate, but I hadn''t reached
    a level where I could be competitive. I started practicing in every bit of available
    ice time and spent hours practicing. I was getting pretty good, but still better:
    my turns. A professional hockey player can make tight, fast turns without losing
    any speed. I wanted to be able to do that, so I spent countless hours practicing.
    The problem is never got better at it. I didn''t understand. I was doing exactly
    what everyone else doing, so why wasn''t I improving? It became frustrating.


    One day I was at one ice stories and I spoke to a friend who does some coaching.
    I explained my problem and asked if he could help. He had me skate out and make
    a few turns. He knew right away what problem was: My feet were too far apart.
    I made the prescribed change to my technique, and before long I could make the
    turns I wanted. I would never have known if someone looked at what I was doing
    and given me another perspective.


    It''s the same with software development—specifically learning a new technique
    as TDD. It''s important to share your work with other cod. Other people will see
    problems that you are blind to. Other people will have a viewpoint that you have
    not considered. Other people will have sloppy turns creeping in there where you
    think that you are emotionally attached to. Do not underestimate the power of
    sharing your work and getting feedback from others. I spent many hours practicing
    the way to turn. That was a huge waste of time and effort. Do not make the same
    mistake I did; start showing your code to others as soon as possible.


    # OSIM USER STORIES


    The following is a list of user stories for the OSIM application. Notice that
    they describe only the system''s desired functionality, not how it should be implemented.
    It''s up to you to make that decision. Make a copy of the OSIM application, start
    implementing these user stories. Add some user stories of your own if you feel
    need to practice a specific area. When you are done and shown the code to someone
    else, throw it out and start over.


