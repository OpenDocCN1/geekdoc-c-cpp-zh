    # SUMMARY


    Test-driven development on the web can sometimes be cumbersome. This chapter introduced
    frameworks and concepts that allow you to start creating highly testable web applications.
    You have probably worked in environments where teams do not want to try new concepts,
    but many of the concepts in this chapter can be introduced slowly to teams using
    existing tools they have access to.


    ASP.NET MVC is a new way of thinking for many web developers. Microsoft has stated
    that ASP.NET Web Forms is not going away anytime soon. The MVC framework is an
    additional tool that you can choose to use.


    Like all the TDD practices discussed previously, the best way to learn these practices
    is to get out and meet other developers who practice them every day. Free conferences
    such as Day of .NET and Code Camps are a great way to meet people and hone your
    newly developed skills.


