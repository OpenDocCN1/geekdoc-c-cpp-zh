  md: '# Handling Change | 269


    deects. Allowing yourself as a developer to take a shortcut at the expense of
    quality sends you down a slippery slope that leads to a brittle, unmaintainable
    application with an incomplete test suite.


    When a new feature for an application is added, it needs to go through the same
    process that other features of the application went through. The same discovery
    and design process that was used to build the other features of the application
    need be employed again. This is true even if the new feature is small. There are
    no small features. "Judge me by my size, do you?". An improperly designed and
    implemented "small feature" can wreak as much havoc, as cause damage, and anger
    a user as quickly as a mishandled "large" feature.


    As soon as the new feature has been properly designed, with input from the business
    and the technical side of the project, development can begin. Like the features
    developed during the primary application development life cycle, the development
    of the new feature begins with a test. As with the previous development of the
    application, a failing test for a new feature signifies that your test is likely
    testing for the right (nonexistent) functionality and that the functionality in
    question is not implemented in the application. If your tests pass without having
    to write any additional code, you have some research to do. Is your really testing
    for the new functionality? Is it testing in the correct place? Does the feature
    already exist in the application and is being obscured by something else in the
    application? These questions must be answered before you proceed.


    After the correct test is written, your goal is the same as the application''s
    primary development life cycle: You should strive to write enough code to make
    the test pass. At the same time, you must ensure that no existing tests fail.
    If they do, you should determine why and how to make those tests, in addition
    to the new tests, pass. After all the tests are passing, the new feature is complete
    and ready for deployment.


    # Addressing Defects


    On my development teams, a defect is defined as functionality in code that does
    not reflect the documented specifications via the user stories and/or features.
    That means a defect can exist only if the application functions differently than
    by a specification the development team has in hand. When a business user tells
    a developer, "The application specifications say a tax rate of 7.5% should be
    applied in this situation, but the application is applying a tax rate of 6%,"
    he is describing a defect. The specification states that the tax rate should be
    7.5% for a given set of circumstances, but it is not. When a business user tells
    a developer, "I know the specification says that Tuesdays customers who order
    more than five items get a 15% discount, but what I meant was when a user ordered
    $100 or more of merchandise on Friday, gets free shipping," is describing a feature.
    Technically, the business user is describing two features if he really wants to
    remove the functionality for the discount applied on Tuesdays.


    The distinction can be important even if the approach is the same. When a new
    feature is requested, the work is scheduled for development based on the development
    team''s bandwidth and the priority that the business has assigned to the new feature.
    If the business wants the feature implemented right away, another feature on the
    schedule must be postponed. If a defect is reported, depending on its severity,
    the development team prioritizes work to fix the defect as soon as possible. Defects
    always have a high priority because quality is important to the development team.
    The team is personally invested in the delivery of a quality application, and
    they will work to fix the defect and deliver the agreed-upon features by the end
    of the iteration.


    ![](img/15cb6759e167a2d15e60bc37de753a62_267_0.png)'
