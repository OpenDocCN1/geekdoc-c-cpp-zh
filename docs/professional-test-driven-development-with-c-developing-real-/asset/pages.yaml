  md: 'As you can see in Figure 9-6, three read books are displayed.


    ![](img/15cb6759e167a2d15e60bc37de753a62_210_0.png)


    In the MVP example, I showed you how to isolate objects and create Web Forms that
    are testable. The MVP pattern was never adopted as a mainstream approach to developing
    ASP.NET Web Forms, and it''s a good place to start when you are forced to continue
    development with ASP.NET Web Forms and don''t have the option of using new frameworks
    such as ASP.NET MVC.


    This was a simple example, but testing the MVP pattern breaks down when you are
    working at the lower levels of the ASP.NET Framework and need to start mocking
    objects, such as the HttpResponse object. With the recent demand from Microsoft
    developers to deliver a framework that is highly testable, the ASP.NET MVC framework
    was born.


    # WORKING WITH THE ASP.NET MVC


    In 1979, while working at Xerox PARC, Tryve Reensaug, a Norwegian computer scientist,
    published a paper titled "Applications Programming in Smalltalk-80: How to Use
    Model-View'
  merge: -1
  pgno: 210
- img_proc: true
  md: 'Controllers.” It was in this paper that Reenskaug formally contended this software
    design. Even though the MVC design pattern has been around for over 30 years,
    it has gained popularity recently because of the success of Ruby on Rails. Ruby
    on Rails helped some developers that highly testable web applications can be created.
    Developers who use Ruby on Rails are always bragging about how stable their code
    is. In 2011, just about every programming language, from Cold Fusion to PHP, has
    a framework for MVC. The code may look different, but each framework is based
    on Reenskaug''s work. MVC is not just for the web. Many GUI frameworks, including
    Cocoa (the programming environment for Mac OS), took inspiration from Reenskaug''s
    Small Talk framework. In Cocoa, developers are encouraged to use this pattern.


    In 2009, Microsoft released the ASP.NET MVC Framework 1.0 to the public. The code
    was released as open source under the Public License, so if you want to see what
    the framework is doing under covers, you can have a look. The ASP.NET MVC Framework
    team is agile, releasing early and often to get feedback from the community. It
    is great to see the feedback given to this team! Microsoft made it clear that
    the ASP.NET MVC framework is not intended to replace ASP.NET Web Forms. It was
    created to give developers a choice.


    When this book was being written, we counted 16 ASP.NET MVC books on the market,
    numerous others mentioned ASP.NET MVC in some way. It is not our intention to
    make you an MVC expert, but we do hope to give you a good idea of how MVC applications
    can be created using the TDD techniques you have learned so far.


    # MVC 101


    Reenskaug states that he created the model-view-controller pattern as an obvious
    solution to the general problem of giving users control over their information
    as seen from multiple perspectives. 9-7 shows the MVC design pattern.


    ![](img/15cb6759e167a2d15e60bc37de753a62_211_0.png)


    9-7


    For this chapter, we define MVC as follows:


    +   - Model — The model manages the data in the application. Classes that store
    and manipulate the database are combined with business logic.

    - View — The view renders the model into an interface that the users can interact
    with. HTML, JSON, and XML are common forms of views.

    - Controller — The controller orchestrates the communication between the model
    and the view. The controller receives input from the view and initiates a response
    from the model. The controller decides which view to render — HTML, XML, or JSON
    — depending on which view was requested. Validation logic also lives within the
    controller.'
