    Before unit test frameworks, developers had a difficult time creating executable
    tests. The initial practice was to create a window in your application that dubbed
    the "test harness." This was simply a window with a button for each test. The
    results of the tests were either a message box or some sort of readout on the
    itself. With a button for each test, these windows become crowded and unmanageable.
