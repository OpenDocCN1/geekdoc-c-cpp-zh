    # # Best and Worst Practices


    When using mocks in TDD, you should be aware of some concepts and guidelines:


    +   - **Dependency Injection** — Mocking is a key concept that makes TDD a viable
    way of writing software. When using mocking, your application should use Dependency
    Injection. In short, this means that instead of statically creating objects that
    your class is dependent on part of the class''s internal instantiation, you should
    provide the class with instances of those objects that conform to the interface
    needed by the dependency. These instances should be passed as constructor arguments
    to the object is being created. It makes it easy to substitute mocked objects
    for actual objects that would be used by the fully integrated application. Dependency
    Injection is explained in more detail in Chapter 5.


    +   - **Design for the interface, not the implementation** — When another class
    or resource as a dependency, your concern should not be how it performs its tasks,
    just what the interface is. Likewise, you should use interfaces when designing
    and building your service''s classes to abstract the functionality from the API.
    This design not makes your code less brittle and more open for extension, but
    it also makes mocking easier and more efficient.


    +   - **Try to limit dependencies** — Most code needs to be dependent on something.
    It could be a database to store and retrieve data, or a web service to authenticate
    a user, or another domain in your application. Given that, you should limit the
    things that your code is dependent on. Not only do a a large number of dependencies
    signify a brittle system, but such a system is also more difficult to mock and
    test effectively.


    +   - **Do not mock private methods** — When you are writing a test and your code
    is dependent on another class, you should only mock the public methods. And then
    only those you use directly; don''t overmock. Mocking private methods requires
    knowledge of the internal function of the service you are mocking — knowledge
    that, according to the encapsulation rule, you should not have. As a consumer
    of a service, you should only concern yourself with the methods on the public
    interface; the protected and private methods should be invisible to you.


    +   - **Don''t cheat** — As you continue your practice of TDD, you will be tempted
    to take shortcuts with your mocking. Maybe it''s because a particular dependency
    requires a mock that is a little more complicated than you''re used to. Maybe
    the stubbed method must return a complex data or object graph that you just don''t
