  md: "The attributes of the ServiceHost directive is Factory. The Factory attribute\
    \ specifies what class should be used to instantiate the WCF service. When the\
    \ attribute is not supplied, the .NET runtime uses the standard WCF factory service\
    \ to create the instance of the service implementation. As part of the retrofit\
    \ to enable dependency injection in the OSIM.ExternalServices project, we changed\
    \ the factory to instantiate InventoryService in NinjectServiceHostFactory:\n\n\
    ```\n<ServiceHost Language=\"C#\" Debug=\"true\"\n=\"OSIM.ExternalServices.InventoryService\"\
    \nCodeBehinds=\"InventoryService.svc.cs\"\nFactory=\"Ninject.Extensions.Wcf.NinjectServiceHostFactory\"\
    >\n```\n\n![](img/15cb6759e167a2d15e60bc37de753a62_234_0.png)\n\nThat is the last\
    \ step needed to create the internal mechanisms of OSIM .InventoryService and\
    \ the InventoryService.svc file to use Ninject. The next steps are standard to\
    \ implement dependency injection in a class with Ninject.\n\nFirst, you need to\
    \ create a Ninject module to store the rules for how the service implementation\
    \ classes are created. Create this module ExternalServicesModule and place it\
    \ in the folder named OSIM .ExternalServices project called Modules, as shown\
    \ in Figure 10-6.\n\nIn the ExternalServicesModule.cs file, create the ExternalServicesModule\
    \ class in the same manner you created the other Ninject modules in the previous\
    \ chapters:\n\n```\nusing Ninject.Modules;\n```\n\n```\nnamespace OSIM.ExternalServices.Modules\n\
    {\n    public override void Load()\n    {\n        Bind<IInventoryService>().To<InventoryService>();\n\
    \    }\n}\n```\n\n![](img/15cb6759e167a2d15e60bc37de753a62_234_1.png)\n\nExternalServicesModule.cs\n\
    \nThe OSIM.ExternalServices project has only one service, InventoryService, so\
    \ that's the only interface/class you need to provide binding information. Use\
    \ the other modules from the appropriate projects to provide the rules for the\
    \ ItemTypeService and all its dependencies.\n\nIt's time to return to the CreateKernel\
    \ method of the Global class in the Globalasax.cs file. Now that you have a module\
    \ for the OSIM.ExternalServices classes, you can provide the implementation of\
    \ this method that will create a kernel for the OSIM.ExternalServices WCF Applications\
    \ to use. First, you need to add using statements for the various Ninject modules\
    \ you will need in the OSIM.ExternalServices project:"
