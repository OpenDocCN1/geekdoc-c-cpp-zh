  md: 'people who want to better themselves by learning new processes, or you''re
    not. If your workplace values quality and people over process, introducing TDD
    is easy.


    # Working in Environments That Are Resistant to Change


    When you leave at the end of the day, the code you checked into version control
    is your mark on the project. If it does not work, you are responsible for it.
    TDD has an initial learning curve, but once you get past that, you will create
    code as quickly as ever. Even if you are unwilling to change follow TDD practices,
    you can change. If you pass this learning curve on your own time by pairing with
    someone who has learned TDD into your projects. I suggest that you do not go back
    and refer everything in your existing codebase; just start slowly and track metrics.
    Managers like charts, and when you show them that the last release had 20% fewer
    defects than the previous one, you tell them you implemented TDD on your portion
    of the project.


    At that point, the manager will be either glad that you did this or happy that
    the team has 20% fewer defects. If the manager is upset, it''s probably time to
    move to a different position where your ideas are valued. This method of introducing
    a new concept to a team is best in Chapter 1 of Thematicmatic by Andrew Hunt and
    David Thomas (Addison-Wesley, 1999, ISBN:9780201616224). It relates to two stories
    about soup and boiled frogs. In the latter example, if the frog drops into a pot
    of boiling water, it jumps right out. If the frog then slowly heats the water
    until it boils, the frog keeps adjusting to the increasing temperature and stays
    in the water until it dies.


    # Working in Environments That Are Accepting of Change


    Some companies allow employees to grow and learn new things. If you are working
    at a place like this, the best way to get your team about TDD is to bring in a
    mentor. A pair programming strategy is the best way to get developers up to speed.
    The authors of this book learned TDD from pairing with other people. This is the
    best way to learn this process. Having a mentor who knows TDD well can help the
    slower members on the team to up speed faster than having them read TDD in a book.


    If your company is unwilling to come in someone for the day, events such as code
    retreats are a great place to pair up with someone for the day and write code.
    For more information about retreats, go to http://coderetreat.ning.com/.


    # SUMMARY


    This chapter has examined many tools that help with the TDD process. When you
    explore new tools, we suggest that you come up with a simple example, replicate
    it using the various tools, and then come to your conclusion.


    NUnit has been around for years and has a large following, but this does not necessarily
    make it the best tool for the job. xUnit is the new testing framework on the scene
    and is radically different from NUnit in many ways. Tools that are radically different
    are the tools you should be trying, because'
  merge: -1
  pgno: 294
- img_proc: true
  md: 'they are the ones that may make your life easier. Thinking outside the box
    and trying new things will help in many ways.


    You will evolve as a software developer throughout your career. You should be
    able to look back at code you wrote in the past and wonder, “What was I thinking?”
    This is how you get better at doing your job. Exploring new tools is just one
    way to improve yourself.


    When it comes to choosing which tools to work with, select the ones you are most
    comfortable with. In some business situations, open-source tools are not allowed.
    Many times these tools are not allowed out of a fear of open source for various
    reasons. Excuses such as licensing issues or “I can’t call someone on the phone
    and get support” are common. Learn how to make a case for how these tools make
    you more productive. When it boils down to selecting a tool, no one has ever been
    fired for using Microsoft.'
