  md: '# The Agile Development Process | 125


    Agile prefers short iterations. I prefer to keep my iterations one or two weeks
    in duration. The exception to this rule is what I call Iteration Zero. Iteration
    Zero is the first iteration and usually commences toward the end of the requirements-gathering
    phase when the major nonfunctional requirements have been gathered and the user
    stories are refined. Iteration Zero is my setup iteration. During this I, or a
    member of my team, am creating the development environment. This includes setting
    up any stakeholders team will need, as well as setting up the QA environment and
    configuring the continuous integration (CI) server. Other tasks that are part
    of Iteration Zero include setting the basic solution and projects in Visual Studio
    and creating a source control repository to store them in. As part of this process
    I also reference any-party stakeholders in the appropriate Visual Studio projects.
    Once the development team has formed, I make sure that they have the credentials
    on any systems they will need to access during development. If I have some basic
    screen layouts available, I work with a user interface (UI) developer to spend
    ahead of the group and create boilerplate web pages or forms to help the developers
    get a jump start on their development.


    Iteration Zero does not have a time frame. Sometimes it can take a couple weeks.
    On smaller projects I can have everything ready in a few days. The important thing
    is that I have basic infrastructure and services ready for the development team
    when Iteration One (the proper development iteration) begins.


    Before the first iteration, I and the PM meet with the business owner. This does
    not mean all the business users; it means the one or two people who are the project''s
    sponsors or stakeholders on the business side. The purpose of this meeting is
    to plan the work for the next iteration. This will be repeated toward the end
    of each iteration, except the last one.


    The business owner, with suggestions and guidance from the PM and the architect
    or developer, selects the work to be done in the next iteration. The business
    owner is provided with the number of productive hours that the project team will
    have for the next iteration. Predictive hours the developer spends writing code.
    I arrive at the number of productive hours for each developer by taking the number
    of hours in the developer''s normal work schedule (for example, if this was a
    two-week iteration, the developer would normally be working 80 hours) and subtracting
    hours that I don''t expect the developer to be writing code. This could be due
    to vacation, holidays, meetings, or any other overhead in running the project.
    Additionally, if the developer is a new developer, or new to the project, I''ll
    take some off his productive-hours number to account for the learning curve he
    will experience.


    It''s important that clients not count productive hours that are wasted. Since
    my business owners are clients, I can explain that they are not being billed for
    holidays or vacation. I also remind them that although the developer''s primary
    purpose is to write code, other tasks on the project that do not involve writing
    code are also necessary. For developers with learning curves, I explain that the
    business owner is paying for this resource. It is reasonable to assume that these
    developers are less experienced, it will take them longer to complete a task than
    a more experienced (and expensive) developer.


    The business owner is allowed to schedule features or stories only when he has
    productive hours left to use. For example, if a team has a total of 100 productive
    hours, and the sum of the features the business owner has already scheduled is
    95, they may pick any combination of features in the PB that does not cause the
    schedule hours to exceed 100. This means they may not select'
