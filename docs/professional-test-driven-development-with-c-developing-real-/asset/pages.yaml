    When I write my tests, I wrote the tests before I wrote the code. I certainly
    have that same approach in reality. Here, the only code I wrote was code injecting
    objects an ISessionFactory into the ItemTypeRepository class, the Nibernate hibernate
    connection to the development database. The difference between the three activities
    I described and the user stories and features that drive unit tests is the functionality
    I needed to make to make the integration test pass was not that added value. It
    was supported by the code that adds business value.


    ![](img/15cb6759e167a2d15e60bc37de753a62_192_1.png)


    FIGURE 8-12


    That''s not to say that code and this functionality is unimportant. If users can''t
    save their data to a store and retrieve it later, the application itself is not
    as useful. But if you are writing an application to process mortgage payments
    or track inventory of prescription drugs, your users are far more concerned with
    the business rules that are implemented in the application framework we use to
    store information to a database, or what patterns are used to create the objects
    in the system.


    Another reason I to write my integration test is first, frankly. In my day as
    a consultant, I supervise a lot of developers who are young and inexperienced.
    Even some of the seasoned veterans have not been exposed to concepts such as ORMs
    and IOC containers. In function as a development lead, I want to make sure that
    tools and concepts are adhered to. If I simply give a developer with no experience
    in IOC containers takes the task of writing this integration test, they would
    likely hand-roll an object of some sort or, worse, create statically member variables.
    In this, and in another situation, where integration tests vary unit tests (at
    least for me), I want my developers, especially those who are inexperienced with
    these new tools and techniques, to keep the usage of these tools and techniques
    in the front of their minds. When they write unit tests I prefer the opposite;
    they should only be thinking about the immediate business need identified by the
    feature or user story. Any other concerns are secondary and can be dealt with
    refactoring at the point of integration. When fastening together the pieces of
    the system, I want my teams to be sure they are using the correct glue.'
