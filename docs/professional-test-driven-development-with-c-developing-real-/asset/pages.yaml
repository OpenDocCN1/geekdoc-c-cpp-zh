  md: '# The Problem with Testing the User Interface


    displaying the user interface. In an automated test suite, the last thing you
    want to do is worry about a window appearing that needs you to click a button
    or enter some text.


    A WPF application that uses the MVVM pattern, in some form or another, Models,
    Views, and ViewModels, along with other folders and classes. I structure my applications
    so that they look like Figure 11-2.


    Many times, the models are in a project that is entirely separate from your Views
    and Models.


    When it comes to testing an application that uses the MVVM pattern, you focus
    all your testing efforts on the ViewModel. In fact, a good way to think about
    it is interacting directly with the ViewModel should be exactly like with the
    view, at least from the end users'' perspective.


    Let''s consider the following user story:


    > A user should be able to search for item types.


    If you break this into smaller pieces, you will need the following:


    +   * A text box for entering the search for

    * A Search button that initiates the search process

    * A list box to display the search results

    * A Clear button in case the user resets the search criteria

    * A Cancel button to close the Search screen


    I''m a strong believer in not allowing the user to perform an action until all
    the requirements are met. In this case, the following requirements must be dealt
    with during the sign-in process:


    +   * The user cannot click Search to initiate the search process until the search
    criteria has been entered.

    * The user can click the Clear button only if or she has something to search for.

    * If the user successfully searches, the results must be displayed in a list box.

    * The user can click the Cancel button at any time.


    If you use the standard code-behind to handle the button click events and data
    validation, you would have to tough time automating the test and end up manually
    starting the application and typing whatever came to mind to see if you got the
    expected results. A much better way is to start writing tests against a yet-to-be-written
    ViewModel.


    FIGURE 11-2


    ![](img/15cb6759e167a2d15e60bc37de753a62_249_0.png)


    One of the tenets of Caliburn.Micro is the idea of convention over configuration.
    Because of this, I have adopted a naming convention for my ViewModels and the
    methods and properties they contain. Don''t be too concerned if my conventions
    seem strange or don''t match what you currently use, because Caliburn.Micro allows
    you to customize the conventions used.'
