  md: '# The Liskov Substitution Principle


    What inheritance is to OCP, polymorphism is to the Liskov Substitution Principle
    (LSP). The LSP states that an object used in your application should be replaceable
    by the super class without breaking the application. This is also commonly design
    by contract.


    If you''ll recall the polymorphism example, the ComputePay method used a list
    of type Employee which was a base type (the super type). The classes Salary, Hourly,
    and Seasonal all inherited from Employee and therefore were subtypes of Employee.


    According to LSP, even though you''ve declared your list as being a list of Employee,
    you can still pollute it with concrete instances of Salary, Hourly, and Seasonal.
    By virtue of inheritance, they all support the same contract (public set of methods,
    or API) as Employee declares. The application can iterate through the list and
    call methods that are defined on Employee on the items in your list without knowing
    or caring what type they are. If they support the contract, the call is legal.


    # The Interface Segregation Principle


    Up now I''ve used class-based inheritance in my examples and haven''t talked much
    about interfaces. To review, an interface is a simple contract you define (in
    code) that your class agrees to implement. This agreement requires your class
    to supply an implementation of every method it defines. The method is implemented
    in the class, so long as it honors the contract by supplying the wrong method.
    Interfaces are a powerful tool in .NET; they support inheritance and polymorphism
    the way classes do.


    The Interface Segregation Principle (ISP) states that clients should not be forced
    to rely on interfaces they do not use. For example, a banking system may have
    a service that awaits evaluations for credit. For the sake of argument, assume
    that this service handles not secured credit (car and boat loans, mortgages) but
    also unsecured credit (credit cards, letters of credit, equity credit lines).
    If you are developing a client to help finance specialists at dealerships get
    car loans for their customers, you don''t care about anything else on this service
    except the methods to apply for car loans. Without the ISP, your application must
    know about these other methods.


    While this does seem like a problem initially, at best it creates additional complexity
    for your application, because the API you are now developing has many more methods
    than we need. This can lead to confusion and potentially errors from calling the
    wrong method. It''s also possible that a part of the API that your application
    doesn''t use could change, which would necessitate a change on your end. When
    you are incurring costs on your application for functionality you don''t use,
    want, or even care about. This also represents a security risk. This application
    is specifically for car loans. What happens if an unscrupulous developer takes
    advantage of this bloated API to allow any other types of credit to be secured
    from the application? Such a problem goes beyond recognition or unmaintainable
    code.


    The solution is to create smaller, more granular interfaces for that service that
    are specific to the client''s needs. In the case of this sample application, an
    interface specifically for car loans would be appropriate. Your application can
    access the same class with the same implementation, but this time it uses a specific
    interface with a subset of the methods on the actual service. This reduces'
  merge: -1
  pgno: 57
- img_proc: true
  md: 'your complexity, insulates your application from changes in other sections
    of the API, and helps close the security hole.


    > Applying the ISP in your code does not mean that the service is completely secure.
    Good coding practices to ensure proper authentication and authorization should
    still be used.


    # The Dependency Inversion Principle


    In a perfect world there would be no coupling or binding of components in an application.
    Also, developers would be able to change anything they wanted without having to
    worry about causing defects (or my favorite euphemism) "intended side effects"
    elsewhere in the application. Sadly, we do not live in a perfect world. Therefore,
    our components need to bind or couple at some point to perform an actual application.


    The Dependency Inversion Principle (DIP) states that code should depend on abstractions,
    concrete implementations, and that abstractions should not depend on details;
    the details should depend on the abstractions. Your work may rely on other classes
    to perform their work (an Employee service may rely on a data access component
    to save and retrieve employees from a data store). however not rely on a concrete
    implementation of class, just an abstraction of it. This means your Employee service
    would know (or care) which specific data access component is being used—only that
    abstraction, or code contract (interface), supports the methods needed to save
    and retrieve an employee.


    Clearly, this concept makes your system more flexible. If your classes only support
    a specific contract and not a specific type, you can change the functionality
    of these low-level services quickly and with minimal impact on the rest of the
    system. In Chapter 6 you will also allow you to mock these dependencies for testing.
    At some point you will need to provide a concrete implementation of this low-level
    service to your class to do its work. The most common way of doing this, especially
    for practitioners of TDD in .NET, the Dependency Injection (DI) pattern. DI patterns
    are covered in Chapter 6.


    # CODE SMELLS


    Again, no code is perfect. This is a fact of life. But developers who practice
    TDD still strive to make their code as good as possible. A key skill to help you
    do that is the ability to evaluate code and quickly and easily identify common
    trouble spots without having to run the application. These common problems are
    called code smells.


    # What Is a Code Smell?


    Over the many years that applications have been developed, developers have always
    needed to solve a common recurring series of problems in code. These problems
    eventually found a series of common, widely known, widely used solutions. These
    solutions became known patterns. As a'
