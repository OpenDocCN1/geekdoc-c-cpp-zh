- img_proc: true
  md: '# INTEGRATE EARLY; INTEGRATE OFTEN


    When using TDD, classes and methods are developed based on tests. Specifically,
    they are developed based on the idea that the tests mirror the specifications
    and/or functional requirements. When you write enough code to make all the tests
    pass, your class or method meets all the specifications and requirements. Other
    classes, external resources, and other components of the application are mocked
    and stubbed to allow the code you are testing to be in isolation. The kind of
    testing ensures the quality of the individual classes and components.


    Because of concept of isolation, true TDD units by definition guarantee quality
    only up to the edge of the current class or method. This results in a series of
    seams that exist between the classes, components, and external resources used
    by the application as a whole. These seams are defined by the interfaces provided
    by the various classes, components, and external resources. Even when an interface
    seems clear in its intent, problems arise when the seams come to join two or more
    pieces of software to form an application. However, it is still possible for errors
    and defects to be introduced. Perhaps the input in providing a method to what
    wasn''t expected. Maybe a method''s output is not what the consuming class wants.
    In many scenarios, classes, components, and resources are well designed and have-written
    unit tests pass all. Yet these classes, components, and external resources do
    not function as expected when they are linked. Many of the problems can be mitigated
    with good design and communication. But even in the most optimal situations, integration
    issues can still arise. By testing the integration of these components, classes,
    and external resources you ensure that the seams of the application you are developing
    are solid and dependable.


    An integration test is a deployment to target the various seams in an application
    and ensure that the pieces of the application work correctly. They are similar
    to unit tests in that the same automated unit testing framework can (and should)
    be used to create them. They differ in unlike unit tests, which use mocks to isolate
    specific methods and classes under test, integration tests cover all the application
    code by the method that the integration test was written for, all to the lowest
    level of the system, usually the data store.


    As important as integration testing is, many developers are content to leave it
    until the end of the project. This is a mistake. Software developers who experience
    the grenade of TDD (and many others) can tell at least one horror story about
    a long night spent before an application''s launch or deployment to QA trying
    to figure out why two or more components of a larger system simply refused to
    work. Clearly, this seam was unanticipated, and alone to diagnose and correct
    the problem. Many times the solution was a patch or shim. One that was literally
    designed and drawn on the back of a pizza box. These patches and seams (which
    in most cases were created without any documentation to describe them) usually
    fixed the symptoms. But what most developers didn''t realize, or want to talk
    about, was that the underlying problem still existed. It was just hiding, waiting
    for an unsuspecting junior developer who was assigned to maintain the application.


    The good news is that it doesn''t have to be this way. In fact, it shouldn''t
    be this way. These late-night hack sessions can be avoided if the development
    team started integration testing early in the project and maintains it throughout
    the development cycle.'
  merge: -1
  pgno: 172
- img_proc: true
  md: 'Creating automated integration tests early in the development cycle and running
    them on a consistent schedule will help you find and fix errors that develop between
    the seams of the classes, components, and external resources that comprise your
    application. If an automated integration test fails, you''ll know right away that
    an issue developed along one of these seams in your application, not in two months
    during deployment. Running them regularly, as part of your CI process, will provide
    you with a short list of suspects when a defect is introduced into the application.


    In cases where you are working in brownfield development (you are maintaining,
    extending, or enhancing an application) without existing unit tests, integration
    tests may be the only option available for automated testing if practices like
    dependency injection were not possible in the application design or coding practices
    you front. On other projects, particularly if you have large code bases or are
    already in production, it is economically unfeasible to reengineer the code base
    to introduce dependency injection that would allow true unit testing. In these
    cases, remember that any testing (even integration testing) is better than no
    testing at all.


    As you continue to develop and enhance these larger applications, you should attempt
    to introduce the techniques and methods that will make it possible to unit-test
    sections of the application. A full-scale rewrite of the application may be impossible,
    but you should work to improve the application from whenever you can.


    # # WRITING INTEGRATION TESTS


    Writing integration tests is similar to writing unit tests. In fact, you will
    use a lot of the same frameworks to write your integration tests that you use
    to write your unit tests. The difference is when you write integration tests,
    the goal is not necessarily to test the individual units of code. The goal of
    integration testing is to test the seams between the individual pieces of code.
    This means that the isolation rule that I talked about at length no longer applies.
    Well, that''s not exactly true; the tests are isolated by the seams they are testing,
    and they interact with different classes and components—perhaps even an external
    resource. The goal of integration tests is to make sure that these different components
    work together.


    In practice, this means that at some point your integration tests will have to
    interact with external resources. Your tests could read and write data to a database.
    Your tests could interact with files or folders on the hard drive. Because of
    this, it''s important that you have access to all versions of these resources
    over which you can execute some measure of control. Before each test you need
    to reset the environment to a consistent prestate. If you added or changed data
    in a database, you need to remove or put it back the way it was. If you call a
    web service, you need a test version of that service that responds consistently
    and correctly based on the input you pass to it. You need to be sure that you
    can put the file system back in order and undo any changes you have tested after.


    # # How to Manage the Database


    One unit test, integration tests, and end-to-end tests have in common is that
    they expect their environment to be in a specific state at the beginning. For
    unit tests this is easy, because the dependency on external resources is removed
    through dependency injection and mocking. For'
