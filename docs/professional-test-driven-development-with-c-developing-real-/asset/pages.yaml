    The naming style used here is important. Many developers dislike the idea of using
    the underscore in the name of a class or method. When it comes to production code
    that will be read by other developers and technical staff, I agree. However, a
    goal of TDD is to ensure that your nontechnical business users in your coding
    practices when comes to writing your unit tests. Most technical staff have years
    of experience in reading class and methods presented in camel case (such as GetItemsFromDatabaseByCustomerId).
    They are comfortable with it, and reading these names easily. This is not the
    case with most business users, however. For them, a name with words separated
