  md: '# What Is a Unit Test?


    testing is designed to measure response time under load as well as how an application
    scales when it is spread across multiple resources. Most user interface (UI) tools
    provide some form of stress testing.


    Stress testing traditionally has been delayed until an application is deployed
    to some sort of QA environment. Granted, until the application is deployed to
    the actual production hardware, it is difficult to determine a baseline performance
    metric. I feel though, that stress testing should be done in some form throughout
    application development. The numbers generated by stress testing so early and
    on nonproduction hardware cannot be used to state the application''s expected
    performance in production. However, stress-testing an application early in its
    development process and continuing to gather metrics has an advantage. As the
    application is built, the development team knows immediately if new functionality
    creates a sudden and negative effect on the application''s performance or scalability.


    For example, suppose that, in an application that is undergoing development, the
    average operation takes 2 seconds with 100 concurrent users. The team checks in
    two new features, and finds the average time for the same number of users to 5
    seconds. Clearly one of those features impacted the application''s performance.
    Because you performed stress testing along the way, you know that it is due to
    one of two recently completed features. If stress testing had been delayed until
    the end, this information would have been lost in a log, and users would simply
    complain that the system is slow. By performing stress testing along the way,
    you can focus on where the problem is and resolve it more quickly and efficiently.


    An important step in stress testing is determining a useful performance metric.
    How many transactions per hour should the system be able to process? How many
    concurrent users should the system support? What are acceptable response times
    for the system? All developers have worked on applications where to optimize,
    without some form of metric to measure performance and some idea of what the target
    performance is, difficult to perform for such a subjective complaint. You need
    to ask, "What is it slow?"


    Most applications go through some form of user acceptance testing (UAT), usually
    at the end of the application development. This testing occurs when the business
    users finally get to use the software in real-world scenarios and evaluate its
    performance. If the application fulfils its needs, the users sign off on, and
    the next step usually is production.


    In waterfall methodologies UAT was usually the last step in the project plan before
    the application was deployed to production. And in many cases it was the first
    time any user saw any part of the new application. Because the project team was
    working in their own silo away from the business users, the first round of UAT
    often ended with long lists of things that the users didn''t like. Some of these
    got fixed. Others were deemed low priority, and the users were told they would
    have to live with these issues. Usually a long period of time had transpired between
    the project''s inception and UAT, and the application may not have reflected the
    current needs of the business.


    Imagine for a moment that you are building a house. For most of us, the house
