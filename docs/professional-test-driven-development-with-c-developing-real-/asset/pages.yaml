  md: 'that use the fields. In the end you have some intelligence and be prepared
    to do some research code coverage numbers for data entities.


    Luckily, the story with functional code in your application is a little more cut
    and dry. For starters, you should include any functional code in your code coverage
    metric. This code should exist only because a test requires it; therefore, it
    should have a high code coverage number. Any code in this category is not covered.
    This examination will always reveal one of two outcomes: You are missing a test,
    or the code is needless and should be deleted.


    Missing tests are clearly a problem and should be addressed immediately. This
    also uncovers a significant issue with relying too much on code base as an indicator
    of code quality: Your code coverage number is only as good and reliable as your
    tests are. If your tests are of low quality, a 100% code coverage is worthless.


    If you have a complete set of tests for your requirements, but you still have
    code that is not covered by a unit test, that code is probably not needed and
    can be deleted. Notice I deleted, not commented out. Unused code is like a parasite
    in your code base; it provides no value, yet it be maintained as if it were a
    contributing part of the application. The only thing this code brings is noise,
    so it be removed to make development easier. If you are using a version control
    system (and you absolutely should), replace the code if you need it (be sure to
    write a test for it). It''s not really gone forever, but it doesn''t belong in
    your working code.


    A metric that has seen of a comeback in recent years (but not how it was used
    in the past) is the lines-of-code count. Previously this number was expected to
    be high and was a bit of a bragging point for developers and managers, because
    it indicated that the developers were doing a lot of work. Unfortunately, this
    perception is a bit backwards. Developers should be looking for ways to do more
    with fewer lines of code.


    It''s a fact that the more lines of code you have in a method or class, the greater
    the chance that defects will emerge. Keeping your methods shorter and more focused
    reduces the complexity and the likelihood that the code has a flaw. The more lines
    of code you write, the more you give yourself to write the wrong code.


    It''s also more likely if you are writing more lines of code, you are duplicating
    functionality that already exists in the application. The concept don''t repeat
    yourself (DRY) in software development states each unit of functionality should
    appear in a code base only once. I''ll explain this concept in the discussion
    of the Single Responsibility Principle later in this chapter.


    Cyclomatic complexity is a metric that has been around for a long time. But due
    to an influx of metric tools, it has only recently widely used as a code metric
    in the business world. Cyclomatic complexity measures the number of unique paths
    that exist in a method, class, or application. A higher number indicates possible
    unique paths and therefore a higher degree of complexity in the code.


    Code is complex. There is no way around it. At some point your code evaluates
    a condition and branches off in another direction. The less complex the system,
    the easier it is to understand and maintain. Code that has a high cyclomatic complexity
    number should be refactored to make it simpler. A couple of ways you can do this
    are to locate methods with several unique paths and to extract that branch logic'
