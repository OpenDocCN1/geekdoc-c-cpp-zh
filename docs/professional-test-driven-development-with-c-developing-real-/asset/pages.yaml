    you create an instance of a Ninject StandardKernel class and create it with implementations
    of the PersistenceModule (which contains the rules and logic to create TypeRepository
    and connect it to the database) CoreServicesModule which contains the rules for
    instantiation of a class that implements the ISystemService interface. The code
    in these modules is simple and is irrelevant to the rest of this, so I will not
    provide a detailed explanation of it. Feel free to examine the code in the downloadable
    sample available at www.wrox.com.


    First instance of the StandardKernel is used to get an instance of an object that
    implements the ISystemService interface. Then call the GetTypes method on that
    implementation of the ISystemService interface returns an instance of an object
    that implements the IList<IType> interface (a list of IType objects).


    The Type class has two properties: Id and Name. The GetTypes method returns ItemTypes
    used in the presumably (previously retrieved from a data store). Because you need
    only names, you can use the Select LINQ command to select only the names from
    each item in the list of ItemTypes returned from the GetTypes method call. Then
    employ the ToArray extension method to convert the result of the Select command
    to a string array, which the service returns, as shown in Figure 10-2.


