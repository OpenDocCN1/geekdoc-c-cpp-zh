    case I''m telling Fluent NHibernate that the mappings are located in the same
    assembly as the ItemTypeMap class is defined. The ItemTypeMap class is the Fluent
    NHibernate mapping class for the ItemType class. This class does not exist, but
    it will be created in the OSM.Core class.


    The ExportTo method instructs Fluent NHibernate to export the mappings to a file
    in the Temp directory on C drive. This can be very helpful if the object-to-data
    mappings that Fluent NHibernate generates are incorrect or are not what you expect.


    I use the call to the ExposeConfiguration method to destroy and regenerate your
    database schema, which is managed by the call to the Create method of a newly
    created SchemaExport object. This is very helpful for integration tests because
    object structures change during development, and by manually updating the database
    table store for these classes can be tedious. It also ensures that you are always
