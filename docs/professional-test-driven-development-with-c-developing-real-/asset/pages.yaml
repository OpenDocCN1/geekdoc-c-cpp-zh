    # Naming the Test


    Unit tests are just methods on classes. Therefore, you can give your test name
    that is a valid method name in .NET. However, in keeping with the spirit of TDD,
    I find it desirable to give my test names that are meaningful and descriptive.
    To that end, I borrow a bit from another methodology: behavior-driven development
    (BDD).


    BDD is an extension to the ideas put forth by TDD. BDD stresses stakeholder involvement
    in the software development process with both the technical and nonlocal groups.
    It can be thought of as a sort of agile-based methodology that stresses collaboration
    across groups. As a matter of course, most tests that practice some of agile methodology
    end following many of the tests of BDD itself is a broad topic and therefore not
    covered in this book.


    For the unit tests I write, I like to use a BDD style for naming tests. This style
    stresses complex, descriptive names that are user-friendly and attempts to avoid
    using technical terms. BDD is about making your, class, and variable names mirror
    plain as much as possible.


    In my usage of this style I think of the description of my test as a sentence.
    The class name that contains the test, as well as any class it implements, should
    spell out a set of conditions under which the test will run. For the current feature,
    you start by creating a class that describes the most basic of these prerequisites:
    working with the item type repository. This class will be called working_with_the_item_type_repository
    and will be where you put the code that initializes a'
