- img_proc: true
  md: '# # The Single Responsibility Principle


    The Single Responsibility Principle (SRP) states that each method or class should
    have one and only one reason to change. By extension that each method or class
    should do one thing or have a single responsibility. Of all the SOLID Principles,
    this is the one that developers feel completely understand. Ironically, it''s
    probably the most commonly violated principle.


    Let''s revisit the Employee example from the preceding section. Each of the employee
    subclasses (Hourly, Salary, and Seasonal) has a ComputeVacation method. This may
    seem logical; an employee works and accrues vacation time. The employee uses on
    vacation time. But think for a moment about the other things in the Employee classes.
    Employee information is stored in those classes. There are now two identified
    reasons for those classes to change: a change to the type or structure of an employee''s
    biographical information, or a change in how an employee''s vacation time is calculated.


    According to the SRP, one of these pieces of information needs to be moved. In
    this case, I believe the biographical information should stay, because the vacation
    time calculation should be extracted to a domain service, because the means of
    computing an employee''s vacation time is not something that defines the employee
    for our purposes. In the end you would have an Employee class, which has only
    one reason to change, and a Vacation Time Calculation Service, which likewise
    has only one reason to change.


    # # The Open/Close Principle


    The Open/Close Principle (OCP) is the concept that software (methods, classes,
    and so on) should be open for extension but closed for modification. If this sounds
    very similar to the OOP ten of inheritance, it is closely related. In fact, in
    .NET the Open/Close Principle relies on inheritance.


    The question then becomes, "Well, I need to change something about how this base
    class works. What would I do? The answer comes in the other half of the OCP; the
    base class should be open for extension. In this case extension refers to creating
    a derived class that inherits from the base class and can extend or override the
    base class functionality to provide the specific functionality that the consumer
    needs. This allows the consumer to use a modified version of the class without
    impacting other consumers of the class. It also makes easier for the consumer
    to use upgraded versions of the base class in the future, because she is unconcerned
    with her modifications being lost.'
