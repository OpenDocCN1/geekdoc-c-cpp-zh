  md: '# Refactoring Phase


    Until now the goal has been just to get the unit tests to pass. Notice that so
    far you haven''t worried about maintainability, readability, or overall code quality.
    Now that you''ve created some unit tests that validate the business requirements,
    it''s time to turn your attention to bringing these attributes to your code. This
    practice is called refactoring.


    Whether practicing TDD or not, developers always find the need to tweak and tinker
    with their code. Essentially this is what happens when you refactor code. The
    benefit of refactoring with TDD is that you have a suite of unit tests to validate
    your code meets the business requirements. Periodically examine your best code
    and your unit tests, and look for opportunities to enhance them by refactoring.
    Refactor code by making small changes and using the unit tests to validate that
    the refactored code still works. So long as the tests pass, your code is correct.


    # Starting Again


    Now you have a test that passes. You have a method that contains the simplest
    and shortest code necessary to make the test pass. You''ve also had an opportunity
    to refactor code to ensure it''s readable and maintainable. The next step is to
    do it again.


    If you think back to the code sample in the preceding section, the least amount
    of code to satisfy the test was to simply return false. Although this is valid
    to make the test pass and satisfy the current, it probably is incomplete from
    a business standpoint. As development continues, more requirements and features
    will be scheduled for development. These requirements and features translate into
    new tests. The complete set of tests — your test suite — reflects all the business
    functionality of the application. This creates a triangulation of tests that ensures,
    so long as the tests pass, the application meets the needs of the business.


    An important point to remember when practicing TDD is that the code, and the test
    results, is only as good as your tests. I''ve talked about refactoring code, but
    don''t be afraid to refactor your unit tests as well. If a test no reflects the
    requirements, refactor them. If you find a gap in your test, refactor it. If you
    find that your test misrepresents a requirement, refactor it. Keep your tests
    clean and maintained. They are just as important to your application as any other
    piece of code.


    # A REFACTORING EXAMPLE


    Suppose that one of your friends is developing a tic-tac-toe game. He has created
    the front end that allows users to manage turns and to place the square in which
    to place their mark. For this example, he has asked you to create a service that
    we can determine if either player has won by his mark in three adjacent squares
    to form a row horizontally, vertically, or diagonally.


    By way of requirements, your friend tells you that he plans to represent the game
    by creating a 3-by-3 multidimensional array of char data types, with the x-axis
    representing horizontal rows and the y-axis representing vertical columns. This
    array will be passed into the method you write as the input parameter. Your friend
    wants the library to return the mark of the winning player (an X or an O) or a
    space if neither player wins.'
