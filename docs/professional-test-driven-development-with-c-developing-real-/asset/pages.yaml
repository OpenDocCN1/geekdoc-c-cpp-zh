  md: '# The Dependency Injection Pattern | 107


    When a unit requires information from application configuration files (web.config
    or app .config), it needs its own instance of this file. It doesn''t matter if
    this file is added to the Visual Studio project the test appears in or copied
    from another project. It cannot access a configuration file from another project.
    To resolve this, you can add an app.config file to the BusinessApplication.UnitTests
    project and populate it with a connection string:


    ```

    <xml version="1.0" encoding="utf-8"?>

    <configuration>

    <connectionStrings>

    <add name="MyConnectionString" connectionString="Sample Configuration"//>

    </connectionStrings>

    </configuration>

    ```


    app.config


    When you run the test, Ninja has created an instance of BusinessService, with
    all its dependent objects, as shown in Figure 5.


    | C:\Users\Desktop\Test\Book\BusinessApplication | Run | C:\Users\Desktop\Test\Book\Chapter
    5\Code\SampleAfter\BusinessApplication\BusinessApplicationUnitTest |

    |---|---|---|

    | BusinessApplication | | |

    | UnitTests | | |

    | BusinessServiceTests | | |

    | ShouldAbleToGetBusiness | | |

    | Passed: 1 Failed: 0 Errors: 0 Inconclusive: 0 Invalid: 0 Skipped: 0 Ignored:
    0 Elapsed: 1.650968 |


    FIGURE 5


    Earlier, when we CoreModule, rules for creating BusinessService were left unspecified.
    Since you asked Ninja for an instance of a specific concrete class and not an
    object to satisfy an interface, Ninja simply used the rules it had for the classes
    BusinessService is dependent on and returned a concrete instance of the BusinessService
    class. The examples in CoreModule showed binding to an interface to a concrete
    class, but you can also bind concrete classes to classes:


    ```

    Bind<BusinessService>().To<BusinessService>();

    ```


    When binding to a class, Ninja provides a shortcut in its syntax:


    ```

    Bind<BusinessService>().ToSelf();

    ```


    Of course, if you were to create an IBusinessService interface and have BusinessService
    implement this interface, you could bind the two and have your test request an
    instance of IBusinessService from the Ninja kernel:


    ```

    IBusinessService actual:

    var kernel = new StandardKernel(new CoreModule());

    actual = kernel.Get<IBusinessService>();

    ```


    The remaining examples in this book use Ninja extensively and demonstrate many
    more features of the framework.'
