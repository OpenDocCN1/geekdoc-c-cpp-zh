    # Communication Within Your Team


    This highlights a key component of this process: individual communication as opposed
    to group meetings. Most developers dread meetings. They are seen as a waste of
    time, especially when a dozen people are called to discuss a topic that they really
    believe affects only two or three people. A much faster and more efficient way
    to handle these issues is to encourage the two or three individuals who are interested
    or about the topic to have hoc conversation and attempt to engage other individuals
    they deem necessary to the discussion.


    An argument can be made that everyone on a team should know what''s going on at
    any given time. However, I do not agree with that. For one thing, even on a small
    team, it''s almost impossible for any one person to know detail of every user
    story, feature,functional requirement, and decision that is made. To expect your
    development staff to keep all this information in their heads at all times is
    unrealistic. I have found a better approach is to have a wiki for the project.


    A wiki is a user-updateable website that can easily and quickly be used to store
    information about a project. As groups of developers make decisions and find solutions
    to problems, they put their findings and decisions in the wiki. Because the wiki
    is searchable, other developers on the team can consult it when they have questions
    or want to understand why certain decisions were made during application development.
    The combination of small-group discussions and the wiki greatly relieves the need
    for long, unproductive meetings.'
