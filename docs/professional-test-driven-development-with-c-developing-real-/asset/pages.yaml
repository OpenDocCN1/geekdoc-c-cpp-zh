    Regardless of how architecturally complex an application may be, I find it generally
    easier to start by building features that are closest to the core of the application
    and then build out. This enables you to keep the core of the application as simple
    as possible. The layers built on top of this core have a set of APIs to work with,
    which in turn drives their interfaces toward simplicity. With a well-defined core,
    you can quickly and easily develop new features without duplicating a lot of code.


    Some developers choose to start development on the UI layer and not to. There
    is nothing wrong with this approach so. As you write the tests for the layer you
    are currently developing, however, you need to define the API for the beneath
    layer and stub it out. This can be a good way to development, because it creates
    APIs that are driven more by the consumers of the library based on their needs
    and less by developers who know what downstream consumers need. I use this approach
    often. The key to success is being able to go back and write the tests for the
    methods you are creating for This is not so much a technology or process as it
    is a discipline issue. After you have developed the discipline needed in TDD,
    you can certainly try this approach. It can be more efficient for systems that
    are primarily driven by a single UI. In cases where you are focusing on a set
    of libraries that will be consumed by a wide variety of consumers, I find the
    bottom-up approach more efficient. In any case, feel free to try both, and do
