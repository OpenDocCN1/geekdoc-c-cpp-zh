  md: 'The test passes. By definition refactoring is not all that is required to fix
    this defect. It''s time to verify that the code changes have not introduced any
    more defects.


    # Keeping the Tests Passing


    In addition to fixing a defect or adding a feature, it''s important to make sure
    that you aren''t breaking any preexisting functionality. I have a suite of tests
    that verify all the other functionality in this application works. By running
    the whole suite of tests, you can verify that you have fixed this defect without
    introducing any more defects into the application, as shown in Figure 12-6


    ![](img/15cb6759e167a2d15e60bc37de753a62_274_0.png)


    FIGURE 12-6


    The tests, including the new test created to address the defect in the InventoryService
    WCF service, are passing. This means that the defect has been fixed, and no other
    functionality in the application has been damaged. This application can now be
    sent to QA to be verified for production.


    # SUMMARY


    Change in business is inevitable. Resistance is futile. Inev, application developers
    need to learn to embrace change. The correct and dedicated practice of TDD will
    give your application an advantage by making it more flexible and adaptable for
    change.


    When you''re working with a new feature, you must employ the same business analysis,
    design, and estimation protocols that you used to develop the application. This
    is true for all applications that have already shipped or been deployed to production.
    Do not fall into the trap of cutting'
  merge: -1
  pgno: 274
- img_proc: true
  md: 'corners under the claim, "Well, it’s just a small change." Even small changes
    implemented poorly can severely damage an application and customer trust.


    Whether you''re working with a new feature or a defect, the first step in the
    development process is the same: writing a test. This test should initially fail.
    If this test passes, some investigation is required. Does your test test for the
    correct functionality or defect? Are you testing the right part of the application?
    Does the newly requested functionality already exist as a side effect of some
    other functionality? Remember that just because a test passes immediately doesn''t
    mean that you have fixed the defect or that the new functionality exists in the
    application.


    After your new test is written and you''ve seen it fail, the steps are the same
    as when you''re doing primary development of the application. Write just enough
    code to make the new test or tests pass. When the new tests pass, you have either
    fixed the defect or implemented the new feature. Refactor where necessary, but
    not add more code than is required. Use the entire test suite to verify that the
    other parts of the application have not been negatively impacted by your change.
    As soon as all the tests, old and new, are passing, your application is ready
    to be sent to QA for verification and deployment to production.'
