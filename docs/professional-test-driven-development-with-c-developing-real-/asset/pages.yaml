  md: "# Typical Refactoring | 67\n\n```\nvar answer = {a*a}b*P;\nreturn answer;\n\
    \n```\n\nThat was several pages ago. You have figured out how it is?\n\nLet's\
    \ look at the same method, but this time with a well-known variable and a descriptive\
    \ method name:\n\n```\npublic double GetVolumeOfCylinder(int radius, int height)\n\
    \n  var volumeOfCylinder = (radius*radius)*height*Pi;\n  return volumeOfCylinder;\n\
    \n```\n\nIt's clear what this means. Even if it did not have the descriptive method\
    \ name, or the variable name volumeOfCylinder, you could deduce from the code\
    \ to perform the calculation that determines the value of a cylinder. This is\
    \ a simple example, but with a little care taken toward naming, you can make it\
    \ much clearer and easier to understand.\n\nNames should be clear, deliberate,\
    \ and written in common, everyday language. Try not to use acronyms unless they\
    \ are well known in your company, business or software development in general.\
    \ Don't be afraid of long names. A descriptive name is more desirable than a short\
    \ name that has no clue as to intent. Visual Studio, like most modern development\
    \ environments, provides some form of autocomplete. Use Don't let \"Name is too\
    \ long\" be an excuse for poor naming.\n\n# Encapsulate Fields\n\nClasses use\
    \ variables to track and maintain their internal state. For the encapsulation\
    \ rule, these member variables are scoped as private and are not directly accessible\
    \ to external clients. This is a protective measure to ensure that the class's\
    \ runtime state does not get corrupted.\n\nSometimes clients need access to fields\
    \ of a class. For example, in the Widget class model number is clearly something\
    \ that the clients of this class will need to access:\n\n```\npublic class Widget\n\
    {\n  private object _internalWidgetState;\n  public string _widgetModelNumber;\n\
    \n```\n\nOn the surface, and naming issues aside, this seems like perfectly reasonable\
    \ code. But what's to stop a client from changing the value of _widgetModelNumber?\
    \ It's declared as public, which means that any external object can change that\
    \ member variable; nothing can be done to prevent it.\n\nA better way to handle\
    \ this is to encapsulate member variable in a field (sometimes called a property\
    \ or \"getter and setter\"):\n\n```\npublic class Widget\n{\n  private object\
    \ _internalWidgetState;\n  public string ModelNumber { get; private set; }\n\n\
    ```"
