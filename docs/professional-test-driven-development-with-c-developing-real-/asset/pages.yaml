  md: "# UNIT TESTING FRAMEWORKS\n\nUnit-testing frameworks are like a good pair of\
    \ work boots. You hate them at first because they are uncomfortable, but the more\
    \ you wear them, the more you start to love them. By the time you have to get\
    \ a new pair of boots, or a new framework in this case, you start to complain\
    \ again because it is uncomfortable. Unit-testing frameworks tend to cause the\
    \ most religious wars between the different testing tools.\n\n# MSTTest\n\nMSTest\
    \ is the testing framework created by Microsoft that has been included in specific\
    \ versions of Visual Studio since 2005. MSTest sparks many heated discussions\
    \ among developers. When all is said and done, MSTest is similar to many of the\
    \ other unit-testing frameworks, with a slightly different syntax. It has been\
    \ my experience that the tests run slower, but you should make your own call.\n\
    \nThe syntax for MSTest is like that for NUnit, except that the Test Fixture has\
    \ a TestClass attribute, and the actual tests have a TestMethod attribute:\n\n\
    ```\n[TestClass]\npublic class HTMLHelpersTests\n{\n    [TestMethod]\n    public\
    \ void Should_Truncate_Text_Over_Five_Characters_Long()\n{\n```\n\n![](img/15cb6759e167a2d15e60bc37de753a62_279_0.png)"
