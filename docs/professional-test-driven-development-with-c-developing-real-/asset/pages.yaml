  md: '# 13


    # The Great Tool Debate


    by Jeff McWherter


    # WHAT''S IN THIS CHAPTER?


    +   * Unit-testing frameworks

    * Mocking frameworks

    * Dependency injection frameworks

    * Miscellaneous useful tools

    * How to introduce TDD to your team


    As with many other procedures in the software development industry, test-driven
    development and the tools used in this discipline can cause many debates among
    software developers. These debates are often religious wars over which tool is
    best. This chapter discusses the different types of tools that are useful with
    test-driven development processes and offers opinions the tools. This chapter
    will help you decide which tools are best for you.


    # TEST RUNNERS


    Having a test runner that you are comfortable with is crucial to following test-driven
    development practices. Many testing frameworks such as NUnit (used in the majority
    of examples in the previous chapters) ship with a GUI for running tests. You have
    learned that unit tests need to run fast, but having feedback about your tests
    and a way to run them that you are comfortable with ensures that you will run
    your tests. Often, alternatives to these GUIs ship with unit-testing frameworks
    can make your life easier.'
