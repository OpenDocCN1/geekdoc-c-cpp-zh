  md: "# Refactoring for Testability\n\nLike domain services and entities, in an ideal\
    \ world you write the tests for your WCF services before you write the code. Test\
    \ first is a major tenet of TDD (remember, the second D stands for driven). This\
    \ chapter starts with an existing WCF service and refactors to to make testable.\
    \ There are a couple reasons for this demonstration. You are far more likely to\
    \ encounter codbases without domain-specific code, and interfaces, have been designed\
    \ for testability — specifically to accept dependencies. WCF services are in the\
    \ unique position of being relatively easy to refactor to accept dependencies.\
    \ The service is an interface. As such, it is at the edge of the application,\
    \ which means it should have no references that would break from the creation\
    \ of a new constructor to accept dependencies. Additionally, because access to\
    \ services is done via proxy, and the caller has no role in the instantiation\
    \ of the service, the instantiation provider can be changed with almost no risk\
    \ of introducing a breaking change.\n\nFinally, I recognize the learning curve\
    \ that some developers experience with WCF. I hope that, by starting with a working\
    \ service, you will have more confidence in introducing dependency injection into\
    \ a working WCF service than you would by building a better service and introducing\
    \ dependency injection at the same time. You should apply all the techniques in\
    \ this chapter to future development of WCF services, and you should adopt a test-first\
    \ approach when you feel comfortable with the frameworks.\n\nI've added a simple\
    \ WCF service to the OSM application that returns a list of ItemTypes as a string\
    \ array. (This demo, as all the demos for this book, are available on wrox.com).\
    \ I've called this InventoryService and created it in the OSM.ExternalServices\
    \ project, as shown in Figure 10-1.\n\nThe implementation of the InventoryService\
    \ creates an instance of the ItemType domain class (which I created to support\
    \ this service). It also returns the result of a call to the GetItemTypes method\
    \ of the ItemTypeService that result has been flattened to a string array.\n\n\
    FIGURE 10-1\n\n![](img/15cb6759e167a2d15e60bc37de753a62_229_0.png)\n\n```\nusing\
    \ System.Linq;\nusing Ninject;\nusing OSM.Core.Services;\nusing OSM.Persistence;\n\
    \nnamespace OSM.ExternalServices\n{\n    public class InventoryService : IInventoryService\n\
    \    {\n        public string[] GetItemTypes()\n        {\n            var kernel\
    \ = \n                new StandardKernel(new PersistenceModule(), new CoreServicesModule());\n\
    \n            var itemTypeList = kernel.Get<IItemTypeService>();\n\n         \
    \   return itemTypeList.GetItemTypes()\n                .Select(x => x.Name)\n\
    \        }\n    }\n}\n```"
