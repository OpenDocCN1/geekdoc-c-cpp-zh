  md: '# # The Three Phases TDD


    Red, green, refactor defines the work flow that developers follow when practicing
    TDD. As illustrated earlier, the sequence of steps taken in writing code is important.
    When followed, this order of steps (requirements, test, code) ensures that you
    have tests for the code you are writing and that you are writing only code that
    you have a test for.


    The gold plating refers to the addition of functionality to an application that
    was not requested by the user or the business but still costs money to develop
    and maintain. The functionality being added may seem like a good idea. But functionality
    that is unneeded and unused, but that requires to create and maintain, is wasteful.
    The requirements define the system''s features and functionality, not the whims
    of developers.


    # # The Red Phase


    When starting with TDD, most developers ask, “How can I write a test for something
    that doesn''t exist?” In fact, many of your tests will be for classes or methods
    that don''t currently exist. This means that your test won''t compile, which is
    essentially the same as having a failing test. That''s OK; remember that you are
    letting the tests drive the need for the code to exist.


    After you create your first test, the next is one or more support actions. Early
    in the development of your application, the next thing you do is creating a project
    in your Visual Studio. If so, you''ll need to add a reference to the new project
    from your test project.


    Maybe you have the project and it''s referenced from your test. Then your next
    step may be creating a new interface for a service that your test requires. Your
    test won''t compile, so it fails until you create this interface. The unit test
    still won''t compile at this point; without a concrete implementation of your
    service, you get a compiler error. Therefore, you need to create a concrete implementation
    for this new service.


    Or maybe the interface and service already exist, but no methods exist for the
    test you are writing. By writing the first test, and being the first consumer
    of it, you''ll have some insight into how developers will work with this service.
    In a manner that makes it easy for them, without any thought about how the interface
    the API may make sense to you as you are writing the service, it will be very
    difficult for the consumer of the service to understand and. By using your own
    interface to write tests, you can experience what it''s like for consumers of
    your service to use it. This helps you define interfaces that are simple to use
    and easy to understand for your end users.


    The last obvious is that you already have an interface and a class, and a method
    that you are testing exists, but you are testing a new requirement for that method.
    This test will fail as well, because you haven''t written any code to make it
    pass. In this case the next step is to write code to make the new test pass without
    not causing the existing tests to fail.


    In any case, when you first write your test, whatever reason, it will fail. Either
    it won'' compile, or the test will compile and run but will fail due to not getting
    an expected result from the method under. You are currently in the red phase.
    Your goal now is to move into the green phase.'
