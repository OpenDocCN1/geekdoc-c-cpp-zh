  md: "# Creating Your First View\n\nYou need to create a view that displays the item\
    \ Types. You will need to create a subcategory under Views directory to keep things\
    \ organized. Then, right-click the newly created ItemType directory and select\
    \ Add... See a dialog box like the one shown in Figure 9-12.\n\nWhen creating\
    \ a view with ASP.NET MVC 3.0, you have two default options for the view engine.\
    \ It's outside the scope of this book to discuss view engines in depth, but view\
    \ engines render the markup for the page. Each view engine renders the markup\
    \ a bit differently, and has some advantages over others. By default Microsoft\
    \ ASP.NET MVC 3.0 uses the Razor and ASPX view engines. Other open source view\
    \ engines such as Spark and NHaml can be used as well. This example uses the Razor\
    \ view engine.\n\n![](img/15cb6759e167a2d15e60bc37de753a62_216_0.png)\n\nChecking\
    \ the \"strongly-typed view\" check box and selecting your ItemType class from\
    \ the OSIM.Core.Entities causes the ASP.NET Framework to generate a scaffold for\
    \ this view. Scaffolding is a simple template containing markup to render your\
    \ model in a view. Scaffolding goes from point A to point C. You have different\
    \ options to select for the scaffold template. In this case you are listing the\
    \ item types on the screen, so you should choose the List template. The following\
    \ code is rendered for the Index view:\n\n```\n@model IEnumerable<OSIM.Core.Entities.ItemType>\n\
    @{\n    ViewBag.Title = \"ItemType\";\n}\n<h2>@ItemType</h2>\n<p>@Html.ActionLink(\"\
    Create New\", \"Create\")</p>\n<table>\n<tr>\n<th></th>\n<th>Name</th>\n</tr>\n\
    @foreach (var item in Model) {\n<tr>\n<td>@Html.ActionLink(\"Edit\", \"Edit\"\
    , new { id=item.Id } ) |</td>\n<td>@item.Name</td>\n</tr>\n}\n</table>\n```\n\n\
