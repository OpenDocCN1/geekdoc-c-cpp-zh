    \n```\n[TestFixture]\npublic class BusinessServiceTests {\n    [Test]\n    public\
    \ void voidShouldBeAbleToGetBusinessServiceFromInject() {\n        BusinessService\
    \ actual;\n        Assert.IsNotNull(actual);\n    }\n}\n```\n\nFIGURE 5-2\n\n\
