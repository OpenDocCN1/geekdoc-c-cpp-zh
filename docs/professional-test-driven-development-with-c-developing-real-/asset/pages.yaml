  md: 'In these cases a good design principle is to abstract the functionality that
    provides unpredictable data into another class or method that can be mocked in
    your unit test. (Mocking is covered in more detail later in this chapter in the
    section “Decoupling with Mock Objects.”) In the case of commodity system, the
    service that provides the time-sensitive price should be mocked. Depending on
    your needs, you may want that implementation to always return the same value.
    Or you may want it to a predetermined value given a specific time. In the case
    of randomization, it would be a good design practice to wrap the randomization
    in a service class that can also be mocked by your tests to always return the
    same value or sequence of values. These predictable sets of data allow you to
    write tests that are specific and execute your code without having to worry about
    getting differences in each test.


    # Other Types of Tests


    The focus of this book is unit tests, but those are not the only tests that are
    important to software development. Unit tests verify one set of the system’s aspects
    — that the internal classes, methods, and service the business requirements and
    provide the necessary functionality. A complete application has more dimensions
    than the business-internals.


    User interface verify that the application’s user interface operates correctly,
    that it can be used by the application’s audience, and that it provides a way
    to access all the necessary functionality. Within each of these criteria are a
    myriad of things to consider. Is the application a web-based application similar
    to Microsoft Word or Excel? What about Silverlight? Are the usability requirements?
    Do you need to make your application accessible to visually impaired people? Who
    is your audience, and how computer savvy are they? Are they employees of your
    company, or are they external customers? What about security?


    User interface testing is clearly not a trivial matter. Nor is it unimportant
    when developing a highquality application. Many tools can help automate various
    types of user interface testing. Some are targeted to web-applications, and are
    focused on Windows forms. Ultimately the best way to perform these types of tests
    is to employ an experienced and knowledgeable Quality Assurance department. A
    skilled QA engineer who understands the business is worth his weight in gold.
    Often these individuals are the final arbiters of whether a system is ready to
    be deployed or to sent back for review.


    Integration tests are an important step in software development and should not
    be skipped or left until the end of development. A developer may have spent the
    night before a system was supposed to be deployed fighting deects when they tried
    to assemble the pieces of a system into one application. This can be achieved
    by integrating tests as they are completed. In fact, a common practice in agile
    methodologies is to get software, even if it’s not completely, in front of users
    quickly. Clearly, this is not possible without integrating your application. You
    can infer that integration testing is a key component of a successful agile methodology.


    Unit tests and even integration tests verify that your individual features and
    your application as a whole with one user. But what will happen to your application
    when 100 users try to access it at once? This concern is addressed by stress testing
    your application. Stress testing is simply creating test conditions that simulate
    multiple users interacting with your application concurrently. Stress'
