  md: '# 11


    # Testing WPF and Silverlight Applications


    by Michael Eaton


    # WHAT''S IN THIS CHAPTER?


    +   - Why testing WPF and Silverlight applications is hard


    +   - The basics of the MVVM pattern


    Windows Presentation Foundation (WPF) and Silverlight are both powerful frameworks
    that allow you to create visually stunning applications. Both frameworks use Extensible
    Application Markup Language (XAML) as their markup language. WPF is used for creating
    desktop-based applications, and Silverlight is used to develop mostly browser-based
    applications and Windows Forms 7 applications. Despite the fact that these technologies
    are extremely powerful, testing applications developed using these frameworks
    can be difficult. Following in the footsteps of previous technologies such as
    ASP.NET and WinForms, WPF and Silverlight default to using code-behind files.
    Code-behind files are great for getting an application up and running quickly,
    but they make it extremely difficult, if not impossible, to write automated tests
    for your applications. Code-behind based applications can also be difficult to
    maintain, especially as more and functionality is added. ASP.NET, the MVC pattern
    has become the standard for creating highly testable applications while avoiding
    the pain points of the code-behind.


    By the end of this chapter, you will have an understanding of why testing the
    user interface is difficult. You will learn about patterns that help alleviate,
    if not most, the difficulty of testing WPF and Silverlight-based applications
    and you will see how to create a WPF application using test-driven development.'
