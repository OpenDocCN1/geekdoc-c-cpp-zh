  md: 'You''ve learned some core patterns and techniques needed for the successful
    practice of TDD, such as dependency injection. You''ve also seen how adhering
    to the SOLID Principles and development using an agile methodology can support
    TDD developers in their work. This chapter offers a few pointers to help you get
    in the practice of TDD.


    # You Are the Client of Your Code


    As a developer, you consume services and components when constructing your software.
    These pieces come together to form a whole greater than the sum of their parts.
    Usually, these services and components are things that you or a member of your
    development team has written. This means that the primary consumers of these services
    and components you develop are you and your development team. These services and
    components should be simple to understand and use. A new member of your development
    team should quickly and easily be able to determine the function and usage of
    these services and components by their names and method signatures.


    In TDD you are the first client of any service or component you create. By writing
    a test for the service or component you are creating, you are the first one to
    consume that service or component. Is the service or component easy to use? Do
    the naming and method signatures give you a clear picture of how the service works?
    Is the interface clear and free of confusing names or duplication? By using TDD
    to develop these services and components, you make yourself the first consumer.
    Are you creating a service or component that you would find easy to use? By deriving
    your service and component interfaces from the practice of TDD, you will create
    interfaces and classes that are elegant, intuitive, and simple to use.


    # Find the Solutions Step by Step


    Developing a software application is a big job. Approaching the development of
    any application as a single large task is a futile approach that sets you and
    your team for failure. A well-known saying in software development is “Don’t try
    to boil the ocean.” It means that a large task may seem complex and impossible,
    but if you break it into smaller tasks, the job doesn''t seem so difficult. Software
    can be complicated. Instead of trying to address all the problems in a software
    application development effort at once, deal with several smaller problems. Tackle
    these tasks one at a time in a manageable way. Instead of thinking of a feature
    or user story as a 40-hour task, it might be better to think of it as 10 four-hour
    tasks. Even better, you could break it into 20 two-hour tasks.


    Dealing with smaller tasks offers many advantages. Smaller tasks are easier to
    understand. Instead of working with a macro problem that encompasses so moving
    parts, deal only with a focused section of scope at a time. Smaller tasks are
    easier to implement. Instead of waiting a week to know if you have successfully
    addressed the problem at hand, you can know in a matter of hours. This enables
    a developer to build momentum and a sense of accomplishment.


    # Use the Debugger as a Surgical Instrument


    Developers who do not use TDD tend to lean on the debugger as a primary development
    tool. For most developers who do not employ TDD, the first step in verifying code
    is often to watch that'
  merge: -1
  pgno: 297
- img_proc: true
  md: 'code execute in the debugger and see what it does. For these developers the
    debugger is a blunt instrument: a club they must use repeatedly to beat their
    code into shape. This approach is wasteful.


    The process of verifying code in the debugger is slow. Developers usually have
    to set the break point several lines or methods before the code they want to watch
    and step through the code in question. Because a debugger is required to step
    through the code and manually verify and evaluate the data, this process is slow.
    In the same amount of time it takes a developer to step through a unit of functionality
    with the debugger and verify that the functionality is correct, you could run
    the tests for all features and know right away. Using a debugger also produces
    inconsistent results. In most cases, the application requires some form of user
    interaction to get to the functionality you need to verify, so there is room for
    error. You can easily input the wrong value or press the wrong button.


    Developers who use TDD tend to make conservative use of the debugger. The tests
    verify that the code works; there is no to execute line by line in the debugger.
    If your tests are well written and your code is simple, the debugger is simply
    needed as often.


    When you use TDD, your use of the debugger is much more focused and narrow. Because
    tests isolate each unit of functionality, you know exactly where to look in your
    code for the defect. You can set a break point in the immediate vicinity of the
    defect and debug directly to the trouble in the code. When you get know what you
    are looking for, because you have a failing test that describes the error you
    are getting. After you locate the cause of the problem, you can write a test that
    can be used to ensure that the problem does not occur again. The test is repeatable
    and fast, which means that you can continue to verify that the code is working
    correctly repeatedly without having to run code in the debugger again.


    # TDD BEST PRACTICES


    Ultimately, your practice of TDD should reflect your needs and those of your development
    team and application. There is a lot of room to customize your team''s approach
    and methodology when practicing TDD. Most successful development teams follow
    similar strategies. In your continued practice of TDD, you should remember these
    guidelines.


    # Use Significant Names


    Names are important. Easy to identify the purpose and function of a class, method,
    or variable. Conversely, bad names make it almost impossible to identify the intent
    of these objects. When naming your tests, be sure to be specific about what you
    are naming your classes and test methods. Class and method names should clearly
    spell out the preconditions and assumptions for your tests, the action or functionality
    you are testing, and what result you are looking for to constitute a successful
    test. Keeping names descriptive is a key component of keeping your code readable
    and maintainable.


    # Write at Test for One Unit of Functionality


    The first D in TDD stands for driven. This means that before writing code to add
    functionality to an application, you should write a test. By necessity this means
    that each unit of functionality has at least'
  merge: -1
  pgno: 298
