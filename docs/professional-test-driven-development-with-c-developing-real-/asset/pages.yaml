  md: '# Testing Windows Communication Foundation Services


    WHAT''S IN THIS CHAPTER?


    +   - Understanding why Windows Communication Foundation (WCF) services are an
    important part of your application

    - Recognizing WCF services as interface code, similar to a Windows form or web
    page

    - Refactoring your WCF services to employ dependency injection

    - Understanding the role that transports play in testing WCF services


    Like web pages or desktop windows, services are an interface to your application.
    As with the other interfaces to your application, your application''s services
    need to be tested to ensure they meet all the requirements that have been specified
    for them as an interface to your application. Testing services is especially necessary,
    unlike Windows forms or web pages, errors and defects can be easily obfuscated
    or swallowed by a services layer in ways that make diagnosing defects extremely
    difficult.


    WCF is the standard framework for creating services in .NET. However, many developers
    are intimidated by even the basics of WCF. As a result, even developers who are
    willing to learn WCF find testing services to be a daunting proposition. The skills
    to properly test WCF services are not difficult to learn. This chapter provides
    you with the tools and knowledge you need to test your WCF services.'
  merge: -1
  pgno: 227
- img_proc: true
  md: '# WCF SERVICES IN YOUR APPLICATION


    Services are important to your application. As an architectural tool, services
    allow you to develop broad, adaptive systems that would not be possible using
    only binding or an application confined to a single physical machine. Services
    enhance scalability and increase flexibility. Some would argue that services are
    the last word in the loosely coupled system. The rising popularity of mobile devices,
    the desire for more responsive web applications via JavaScript and AJAX calls,
    frameworks as Silverlight, and the resurgence of REST is breathing new life into
    an architectural concept that until a few years ago were the sole domain of tower
    architects and service-oriented architecture (SOA) geeks. For these reasons, more
    and more applications will begin to provide a service interface requirement of
    some kind.


    # Services Are Code Too


    The actual code in your service should be very simple. In other words, the code
    should do almost nothing. The most complicated action a service should perform
    on its owner is translate between data transfer objects (DTOs) and domain entity
    objects. The service may also perform some simple data validation, to match what
    would be done on a web page or a Windows form. Also from that, your service should
    call methods only on domain services or a business model of some sort.


    In spite of the simple code for your service should be, your service is still
    code. As such, it is prone to deforms and sensitive to changes made in other areas
    of the application. You need to ensure that your service is using the correct
    service or model. Validation rules must be verified. Data translations must be
    refreshed periodically to ensure changes to an entity class have not disrupted
    the service''s operation. Services are external entry points to an application,
    meaning that they enable the automated input of data; much like a web page or
    form would for a user. This means that the validation and verification of services
    must be verified as well to ensure proper security for the application. For these
    reasons, it''s important to test services as much as you would test any interface
    to an application.


    # TESTING WCF SERVICES


    Unlike domain services or entities, you do not have direct control over the instantiation
    of your WCF services. This has led to the belief that WCF services cannot take
    advantage of dependency injection and therefore cannot be unit-tested. This is
    a fallacy. Of the most popular dependency frameworks available today provide some
    facility for injecting dependencies into WCF services. All you need some changes
    to how the service implementation is constructed, and a couple of tweaks to how
    the WCF projects are configured.


    > This chapter assumes a basic level of knowledge and skill with WCF. If you are
    unfamiliar with WCF, many books are available on the subject. My blog at www.jamesbender
    hosts an ongoing WCF instructional series that is perfect for developers who have
    not used WCF.'
