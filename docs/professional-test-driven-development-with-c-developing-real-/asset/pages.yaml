  md: '# CHAPTER 4 TEST-DRIVEN DEVELOPMENT: LET THE TESTS BE YOUR GUIDE


    The rules around creating a person are in the PersonService, so PersonRepository
    needs to worry only data access.


    This new class represents a test that needs to be written. Remember that unit
    tests are isolated to the specific class and method they are testing. This means
    that for PersonService should not be responsible for verifying the functionality
    of PersonRepository. In fact, the specific instance of PersonService that is used
    by the unit test should not use a concrete instance specially of PersonRepository.
    It should use a mock object that implements the interface as PersonRepository.
    (Mocking is covered in detail in Chapter 5).


    This means in addition to the unit tests for PersonService, you must also write
    tests for PersonRepository. Since you are only working on PersonService right
    now, you need to define only the interface for PersonRepository and the method
    that will get a data from the store by Person ID. Since you''ll be using a mock
    of PersonRepository for the PersonService, the database-specific functionality
    isn''t needed to make the test for PersonService pass.


    After the tests for PersonService pass, it''s time to turn your attention to PersonRepository.
    Your requirement is that PersonRepository should be able to get data from a database
    based on a Person ID. Your task is to write just enough code to return the data
    given a specific Person ID. Remember that tests for repository classes are just
    like unit tests for any other class; they need to be isolated from their specific
    dependencies. Most database frameworks provide a mechanism to mock the data context
    and allow you to write unit tests for your repositories. Consult your framework''s
    documentation for specific details.


    Once the tests for PersonService and PersonRepository are complete, the next step
    is to integrate them. If you want to test your breaks; your test should call methods
    on a concrete instance of PersonService, which in turn should call methods on
    a concrete instance of PersonRepository, which should access a data store that
    has data in. The point of writing integration tests is to ensure that your PersonService
    and PersonRepository classes work together. It is not uncommon to create two components
    in isolation, only to find that they don''t support each other. By integrating
    small pieces of the application early on, you can ensure that the components you
    are now building will be combined into a larger application.


    # GREEN, RED, REFACTOR


    TDD has many colloquialisms and anagrams. You''ve already read about OOP, SOLID,
    and DRY. These are all very important not only to TDD, but also to good software
    development practices in general. If one saying, refactor, or mantra ups the cores
    of TDD, it''s red, green, refactor. It reminds you of the TDD work flow of requirements
    flowing into tests, which then flow into code. It sets the expectations that developers
    and managers who are unfamiliar with TDD often hear the word refactor and assume
    it means to fix what wasn''t done right the first time. This perception of what
    refactoring means is not true. Writing code is an iterative process. Refactoring
    is the continued refinement of code to make it the simplest, readable, and best
    it can be.'
