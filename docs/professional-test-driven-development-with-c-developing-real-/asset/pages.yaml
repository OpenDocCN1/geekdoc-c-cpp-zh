    class to always return the same way. It should return an ID number for an entity
    that is being saved to the data. I created a situation in which the ID number
    different each time the test runs, but remains the same during the scope of each
    execution of this test. Because determining of a random ID is done as part of
    the process that creates the test, it doesn''t introduce any unpredictability
    to the test. I''m simply changing the value of the ID that returns; the steps
    to ID number have not changed. In this case distinction is not clear, I will touch
