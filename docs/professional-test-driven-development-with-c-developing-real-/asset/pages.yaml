  md: "# Making the First Test\n\nAgain, this is okay. You need to see the test fail\
    \ for many reasons. You need to make sure your really tests something; a test\
    \ that never fails doesn't really test your code. Although at this stage it's\
    \ unlikely, you need to verify that you haven't written too much code. Also you\
    \ need to make sure that you're not recreating functionality. If your test passes\
    \ now, without your having to write any more code, there's a good chance you could\
    \ be duplicating work. Since a goal is to keep your code as DRY as possible, you\
    \ need to make sure you're not reimplementing that already exists.\n\nNow it's\
    \ time to start thinking about moving into the green phase. Your goal is to write\
