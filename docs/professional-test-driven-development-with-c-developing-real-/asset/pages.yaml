  md: "In short, the repository pattern states that all data access will be encapsulated\
    \ into a repository object, which the business domain classes will use to perform\
    \ and any persistence work (Figure 5-6).\n\n| Issues CRUD (Create, Retrieve, Update,\
    \ Delete) commands |\n| Business Domain Service | Responds with entity objects\
    \ or success/failure return | Entity Repository |\n\n![](img/15cb6759e167a2d15e60bc37de753a62_114_0.png)\n\
    \nFIGURE 5-6\n\nRepositories create a shim between the business domain and the\
    \ data store. The repository encapsulates the knowledge of how the data is stored\
    \ in a flattened format and how that data is translated from this flat format\
    \ to an entity object. Each entity should have its own repository. repositories\
    \ for different types should have similar interfaces and a common base class to\
    \ help the data access code remain DRY and to make learning how to work with the\
    \ repository easier.\n\nRepositories can be created with any number of data access\
    \ techniques, including ADO.NET, services, and file storage. Many object relational\
    \ mapper (ORM) frameworks make creating repositories easy. In systems where frameworks\
    \ such as Entity Framework or nHibernate are used to manage persistence, it is\
    \ possible to write a single repository that takes any entity as a generic type\
    \ and offloads the type-specific work to the framework. Check your ORM's documentation\
