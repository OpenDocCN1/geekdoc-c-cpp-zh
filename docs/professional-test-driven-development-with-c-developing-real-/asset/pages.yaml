    in place. This is one of those projects, because we discussed the data layer in
    depth in previous chapters. You know that the developer who created the OSIM Core
    module, which contains the data, has a full suite surrounding it, so there is
    no need to create tests for this assembly. Because you will be working with item
    types, let''s start by creating a test for the controller that ensures that the
    controller will get the item type data to display.'
