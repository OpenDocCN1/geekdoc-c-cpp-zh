  md: '# CHAPTER 1 THE ROAD TO TEST-DRIVEN DEVELOPMENT


    +   - TDD provides built-in regression testing. As changes are made to the system
    and your code, you have the suite of tests to ensure that tomorrow''s changes
    do not damage today''s functionality.


    +   - TDD puts a stop to recurring bugs. You''ve probably been in situations where
    you are developing a system and the same bug seems to come back from QA repeated.
    You think you''ve finally tracked it down and put a stop to it, only to see it
    return two weeks later. With TDD, as soon as a defect is reported, a new test
    is written to expose it. When this test passes, and continues to pass you, know
    the defect is gone for good.


    +   - When developing applications with testability in mind, the result is an
    architecture that is open, extensible and flexible. Dependency Injection (covered
    in Chapter 5) is a key component of both TDD and a loosely coupled architecture.
    This results in a system that by virtue of its architecture is robust, easy to
    change, and resistant to defects.


