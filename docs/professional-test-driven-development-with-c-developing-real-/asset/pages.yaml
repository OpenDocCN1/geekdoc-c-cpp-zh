  md: 'Without polymorphism, the system would have to do one of two things. The first
    alternative would be to sort all the employees into three groups (Salary, Hourly,
    and Seasonal) and process each group in its own unique manner. The other alternative
    would be to loop through all the active employees, and for each employee a decision
    would be made to determine how to pay that employee. Either of these alternatives
    would result in additional code that not only makes the process slower, but also
    makes it more complicated and introduces more points of failure. With polymorphism
    you let the computer do the work for you. An example of this can be found in the
    section “Replace Conditional with Polymorphism."


    For example, I have the hierarchy of animals shown in Figure 3-4:


    ![](img/15cb6759e167a2d15e60bc37de753a62_55_0.png)


    FIGURE 3-4


    In addition to being animals, these of animals are able to move. But they move
    in different ways; dogs run, birds fly, and fish swim. Because they all inherit
    from Animal, I can reference each sub-type (dogs, birds and fish) as animals.
    But what if I wanted to make these animals move? Would the best approach be to
    implement a Run method on Dog, a Fly method on Bird and a Swim method on Fish?
    This might seem intuitive, but it creates some severe limitations. Let I had a
    reference in my code to some type of Animal. How would I make it move? Which method
    do I call? To answer that question I would first have to determine which specific
    type of Animal I’m dealing with. This is inefficient and defeats the purpose of
    having an animal hierarchy.


    A better approach would be to create an abstract method on the Animal class Move.
    Each animal that inherits would then create an implementation of this method and
    provide its specific method of moving. In this case, I don’t need to know what
    specific type of Animal I have, I can now call the Move method and the animal
    will move appropriately.


    # The SOLID Principles


    In the early 2000s, Robert “Uncle Bob” Martin introduced a series of five principles
    for developing software with OOP that were designed to lead to higher-quality
    systems that were easier to maintain. These SOLID Principles became a sort of
    map for both designing new applications and refactoring existing code bases.'
  merge: -1
