    # MISCELLANEOUS USEFUL TOOLS


    Some tools fall under the miscellaneous category. They are not required to perform
    TDD or when it comes to testing your application.


    # nCover


    nCover is a code testing tool. It analyzes your tests and reports the percentage
    of code covered by the tests. There are two versions of nCover. One is open source,
    and the other is a commercial product that contains many features.


    Figure 13-7 shows the test coverage for the Wrox.BooksRead.Web project. You can
    see that the HTMLHelper has 100% test coverage, whereas the other projects have
    0% test coverage. In example, the only tests are for HTMLHelper, which makes sense.


    ![](img/15cb6759e167a2d15e60bc37de753a62_292_0.png)


    FIGURE 13-7

    nCover can be downloaded at http://www.ncover.com/


    # PEX


    PEX, short for Program Exploration, is a project from Microsoft Research that
    generates unit tests from existing code. PEX is a Visual Studio add-in with a
    small amount of configuration generates a suite of parameterized unit tests that
    give your code a large amount of code coverage.'
