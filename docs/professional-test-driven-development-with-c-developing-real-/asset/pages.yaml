    # Testing in Iteration Zero


    After the developer meets with the SME and the architect or lead developer understands
    the business need and how the feature fits into the larger application, he begins
    development. Using TDD, he starts by writing unit tests for his feature. After
    the developer has written a unit test, he writes just enough code to make the
    test pass. If the tests pass, the developer continues unit tests and then code
    to make the test pass until he has unit tests for all the requirements in the
    feature. While in this process, the developer should be running the entire suite
    of unit tests to ensure his new code has broken any existing functionality in
    the application. Finally, the developer writes integration tests to ensure that
    the components he has written for his feature integrate correctly with the rest
    of the application. As soon as all tests pass, the developer commits his code
    to the main development branch and marks the feature complete and ready for QA
    to.


