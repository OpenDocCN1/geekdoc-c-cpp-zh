  md: 'business requirements and technical specifications, the defect may never have
    happened in the first place.


    Practitioners of TDD still start with a set of business requirements. The place
    where TDD deviates from traditional development is the next step. Before you write
    a single line of code for a feature (including a new class to contain that code),
    you write a unit test based on the requirement you are working on.


    Unit tests are derived from the business requirements and technical specifications.
    Because of this, the unit tests become living, executable representations of the
    requirements and specifications. They cease to be something in a document that
    is quickly forgotten by the developers. They become runnable code that you can
    use to verify that you are creating the functionality intended by the business.
    These requirements become tangible things that you, as the developer, can interact
    with.


    After a unit test represents the requirements and specifications that have been
    created, you can begin writing code. Your goal at this point is to write the smallest
    and simplest amount of code to make the test pass. Don''t worry if the code feels
    incomplete or unfinished; if it meets the unit test, which has been derived from
    a requirement, it''s complete.


    As a corollary, don''t write code that do not have a unit test. Don''t worry about
    writing code to accommodate requirements that might or even probably will be found;
    requirements don''t exist until they''ve been documented and had a test created
    for them. No code needs unless to exist.


    As you build functionality for a requirement, you will likely need other parts
    of the application that need to be designed and built. This is especially common
    if you are working in Agilebased methodology. In most of these methodologies a
    high-architecture may be defined, by a big, detailed, up-front design phase. Detailed
    design is deferred until a feature or requirement is actually created. This keeps
    development teams from incurring the overhead of a detailed design for features
    and functionality that never get selected for development.


    When new sub systems and other pieces of functionality emerge, make sure that
    you are creating the tests for pieces of code as well. For example, you may be
    assigned a feature that reads "Retrieve a Person by Person ID." To implement this,
    you will first create a Person object within domain service, called PersonService.
    This service would represent the mechanism through which the constituent parts
    of the application would get a Person by ID. PersonService is to provide a Person
    object based on a set of business rules. However, according to the SRP, you would
    not be responsible for retrieving the Person data from the database. One reason
    for the PersonService to change would be the business rules around how a person
    can be retrieved (for example, instead of Person ID, a Person should be retrieved
    by some other field from the database). Another reason for the PersonService to
    change would be how the data is actually retrieved from the data store (for example,
    initially the Person data is stored in a database, but at some point it is relocated
    to a data store behind a web service).


    To accommodate the needed separation of concerns, you could create a PersonRepository
    class that takes care of the mechanics of getting the data that represents a Person
    from the database. This new class''s only reason to change is if the way a person
    is retrieved from a database changes.'
