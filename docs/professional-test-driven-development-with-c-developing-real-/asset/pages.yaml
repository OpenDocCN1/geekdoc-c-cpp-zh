  md: '# TDD on the Web


    by Jeff McWherter


    # WHAT''S IN THIS CHAPTER?


    +   * TDD with Web Forms

    * TDD with MVC

    * TDD with JavaScript


    Previous chapters have discussed tools and theory to describe exactly what test-driven
    development is. It''s now time to apply this knowledge to practical examples and
    bring test-development to the world that many software developers live in: the
    web.


    You might be thinking that web frameworks (primarily ASP.NET Web Forms) do not
    separate concerns very well. The single responsibility principle is something
    we have very strict about not breaking while performing TDD. From C# or Visual
    Basic code mixed into the ASPX files, to common JavaScript functions being copied
    from page to page, many web frameworks do not follow many of the rules outlined
    in previous chapters. This chapter discusses patterns that will make it easier
    to test web applications, including frameworks that do not separate concerns very
    well. This chapter start with ASP.NET Web Forms and move onto newly newly Microsoft
    framework called ASP.NET MVC, you will learn the techniques required to not make
    your web applications more testable, create them using TDD.


    Entire books have been written about testing for the web, such as Testing ASP.Net
    Web Applications by Jeff McWherter and Ben Hall (Wrox, 2009, ISBN: 978-0-470-49664-0).
    This chapter summarizes the important points about this topic. By the end of this
    chapter, you will understand how to develop your web applications using TDD.


    # ASP.NET WEB FORMS


    In January 2002, ASP.NET was released with version 1.0 of the .NET Framework.
    This release marked a major milestone for web developers using Microsoft technologies,
    allowing'
  merge: -1
  pgno: 197
- img_proc: true
  md: 'them to produce web applications using languages such as Visual Basic.NET and
    C#. .NET includes tools you can use to develop web applications quickly by taking
    advantage of built- controls that take care of the basic create, read, update,
    and delete (CRUD) operations for you. Components that shipped with the ASP.NET
    framework enabled you to drag and drop controls into your applications. This functionality
    allowed for a quick development process. But during the architecture and testability
    of many applications were never considered. Because these web applications stayed
    in the field as developers moved to different companies or projects, patch after
    patch was applied to applications developed in this way, and the cost to maintain
    increased.


    Although these issues still exist today, you can use some techniques and patterns
    to unit-test ASP.NET Web Form applications.


    # Web Form Organization


    A Web Form is made up of two parts. The ASPX file contains HTML, CSS, JavaScript,
    and ASP.NET markup. The second part is the code-behind, either a CS or VB file
    that contains the executable code. Let''s take a moment to discuss what should
    be contained in these files.


    # ASPX Files


    ASPX files are the view of your web application pages that the user sees. As such,
    no business logic should be contained within them. ASPX files should be clean
    and easy for web and graphic designers to read. Not everyone has the luxury of
    seeing ASPX files to a designer, but when you do, you want the designer to be
    able to understand these. Logic that accesses the database inside ASPX files not
    violates rules of separation of concern but also makes your code difficult for
    other people to read. Your ASPX files should not be littered with <% tags.


    # Code-Behind Files


    You should think of code-behind files as the controller for what the view renders.
    Code-behind files hook into the ASP.NET page life cycle and have a tight dependency
    on the ASP.NET runtime, making testing these files difficult. Therefore, you should
    keep code-behind files as thin as possible so that they contain only "glue code.\
    The default way that Visual Studio and ASP.NET Web Forms currently encourages
    a large amount of logic in these files, which is actually in opposition to the
    patterns required for TDD.


    > Glue code is code that does not contribute functionality to the application.
    The purpose of glue code is only to "glue" together parts of code that normally
    would be incompatible. Most of the time, due to its simplistic nature, glue code
    does not need to be tested.


    One of the best ways within ASP.Net Web Forms to keep clean code-behind files
    and have a good separation of concern is to follow the model-view-presenter (MVP)
    design pattern, shown in Figure 9-1.'
