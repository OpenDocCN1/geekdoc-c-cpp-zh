    \ std::endl; // 如果记录无法打开则打印错误消息\n    }\n\n    return 0;\n}\n```\n\n在这个模型中，我们利用输入记录流打开了一个名为\
    \ \"input.txt\" 的文档。然后，我们利用 `std::getline()` 从记录中读取每行，并将其打印到控制中心。最后，我们利用 `close()`\
    \ 技巧关闭记录。\n\n# 向文档写入\n\n要在 C++ 中向记录中写入信息，你确实需要执行以下步骤：\n\n- 使用结果记录流 (ofstream)\
    \ 打开文档。\n- 向文档中写入信息。\n- 关闭记录。\n\n这是一个向文本记录中组合信息的实例：\n\n```cpp\n#include <iostream>\n\
    #include <fstream>\n\nint main() {\n  std::ofstream outputFile(\"output.txt\"\
