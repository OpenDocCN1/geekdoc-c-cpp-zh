    ```\n\n# Lambda 表达式\n\nLambda 表达式允许你内联定义匿名函数，使得编写短小的、一次性的功能更加简单，而不需要独立的函数声明。\n\
    \n重复代码\n\n```cpp\nauto total = [](int a, int b) { return a + b; };\n\nstd::cout\
    \ << total(3, 5) << std::endl; //结果: 8\n```\n\n# 并发性\n\nC++ 通过 `<thread>` 和 `<future>`\
