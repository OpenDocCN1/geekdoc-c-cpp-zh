    \n重复代码\n\n```cpp\ntemplate<typename T>\nT maximum(T a, T b) {\n    return (a >\
    \ b) ? a : b;\n}\n```\n\n# STL (标准模板库)\n\n标准模板库（STL）是一组强大的类和函数，提供了 C++ 中通用的数据结构和算法。它包含了向量、记录和指南等容器，以及用于排序、查找和控制信息的算法。\n\
