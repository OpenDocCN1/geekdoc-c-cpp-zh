    \  }\n\n  return 0;\n}\n```\n\n在这个模型中，我们利用结果记录流打开了一个名为 \"output.txt\" 的文档。然后，我们在此处利用插入运算符\
    \ << 向文档写入 \"Hi, world!\"。最后，我们利用 `close()` 技巧关闭记录。\n\n# 结束\n\n在本节中，你学会了如何在 C++\
