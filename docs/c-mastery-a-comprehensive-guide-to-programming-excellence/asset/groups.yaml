  mdcn: "\n\n# 第 12 部分：总装一切：比常规模更小的任务\n\n在这一部分，我们将应用贯穿全书的思想，在 C++ 中完成一些比常规模更小的任务。这些任务将帮助你建立对编程基础知识的理解，并允许你以一种既有趣又智能的方式练习批判性思维能力。\n\
