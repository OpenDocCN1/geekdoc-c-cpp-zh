    \ 条件语句\n\n条件语句允许你的程序根据明确条件做出决策。C++ 中最常见的条件语句是 `if` 语句。其结构如下：\n\n```cpp\n#include\
    \ <iostream>\n\nint main() {\n    int x = 10;\n    if (x > 0) {\n        std::cout\
    \ << \"x is positive\" << std::endl;\n    }\n    return 0;\n}\n```\n\n在此模型中，如果条件\
    \ `(x > 0)` 为真（它是确定的，因为 `x` 是 10），将显示消息 \"x is positive\"。\n\n你同样可以使用 `else if`\
    \ 和 `else` 语句来管理不同的条件：\n\n```cpp\n#include <iostream>\n\nint main() {\n    int\
    \ x = 10;\n    if (x > 0) {\n        std::cout << \"x is positive\" << std::endl;\n\
    \    } else if (x < 0) {\n        std::cout << \"x is negative\" << std::endl;\n\
    \    } else {\n        std::cout << \"x is zero\" << std::endl;\n    }\n    return\
    \ 0;\n}\n```\n\n在此模型中，如果 `x` 为正数，将执行主代码块。如果 `x` 为负数，将执行相应的代码块。相反，将执行第三个块。\n\n\
    ### 循环\n\n循环允许你在各种情况下重复执行一段代码块。C++ 中有三种主要的循环：`for`、`while` 和 `do-while`。\n\nfor\
    \ 循环：\n- 该循环会在多次执行其内部的代码块，`I` 从 0 开始并每次增加 1。\n\nwhile 循环：\n- cpp\n```cpp\nint\
    \ I = 0;\nwhile (I < 5) {\n    i++;\n}\n```\n\n只要条件 `I < 5` 为真，该循环就会执行其内部的代码块。\n\
    \ndo-while 循环：\n\n```cpp\nint I = 0;\ndo {\n  i++;\n} while (I < 5);\n```\n\n\
    该循环类似于某些时间循环，但它通常至少会执行一次内部代码块。\n\n结束\n\n"
