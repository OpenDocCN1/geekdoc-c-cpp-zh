  \ | − B = -10 |\n| * | 两个操作数相乘 | A * B = 200 |\n| / | 被除数除以除数 | B / A = 2 |\n| %\
  \ | 取模运算符和整数除法的余数 | B % A = 0 |\n| ++ | 递增运算符整数值加一 | A++ = 11 |\n| -- | 递减运算符值减一\
  \ | A-- = 9 |\n\n### 关系运算符\n下表显示了 C 支持的所有关系运算符。假设变量 `A` 持有 10，变量 `B` 持有 20，则\n[示例](https://www.tutorialspoint.com/cprogramming/c_relational_operators.htm)\n\
  \n| 运算符 | 描述 | 示例 |\n| :--- | :--- | :--- |\n| == | 检查两个操作数的值是否相等。如果是，则条件为真 | (A\
  \ == B) 不为 |\n| != | 检查两个操作数的值是否相等。如果值不相等，则条件为真 | (A != B) 为真 |\n\n\n\n\n\n| 运算符\
  \ | 描述 | 示例 |\n| :--- | :--- | :--- |\n| `>` | 检查左操作数的值是否大于右操作数的值。如果是，则条件为真。 | `(A\
  \ > B)` 为假。 |\n| `<` | 检查左操作数的值是否小于右操作数的值。如果是，则条件为真。 | `(A < B)` 为真。 |\n| `>=` |\
  \ 检查左操作数的值是否大于或等于右操作数的值。如果是，则条件为真。 | `(A >= B)` 为假。 |\n| `<=` | 检查左操作数的值是否小于或等于右操作数的值。如果是，则条件为真。\
  \ | `(A <= B)` 为真。 |\n\n## 逻辑运算符\n\n下表显示了 C 语言支持的所有逻辑运算符。假设变量 `A` 的值为 1，变量 `B` 的值为\
  \ 0，那么 −\n\n[显示示例](https://www.tutorialspoint.com/cprogramming/c_logical_operators.htm)\n\
  \n| 运算符 | 描述 | 示例 |\n| :--- | :--- | :--- |\n| `&&` | 称为逻辑与（AND）。如果两个操作数都非零，则条件为真。\
  \ | `(A && B)` 为假。 |\n| `||` | 称为逻辑或（OR）。如果两个操作数中任何一个非零，则条件为真。 | `(A || B)` 为真。\
  \ |\n| `!` | 称为逻辑非（NOT）。它用于反转其操作数的逻辑状态。如果条件为真，则逻辑非运算符将使其为假。 | `!(A && B)` 为真。 |\n\
  \n## 赋值运算符\n\n下表列出了 C 语言支持的赋值运算符 −\n\n\n\n[显示示例](https://www.tutorialspoint.com/cprogramming/c_assignment_operators.htm)\n\
  \n| 运算符 | 描述 | 示例 |\n| :--- | :--- | :--- |\n| `=` | 简单赋值运算符。将右侧操作数的值赋给左侧操作数 | `C\
  \ = A + B` 将将 `A + B` 的值赋给 `C` |\n| `+=` | 加并赋值运算符。它将右操作数加到左操作数上，并将结果赋给左操作数。 | `C\
  \ += A` 等同于 `C = C + A` |\n| `-=` | 减并赋值运算符。它从左操作数中减去右操作数，并将结果赋给左操作数。 | `C -= A`\
  \ 等同于 `C = C - A` |\n| `*=` | 乘并赋值运算符。它将右操作数乘以左操作数，并将结果赋给左操作数。 | `C *= A` 等同于 `C\
  \ = C * A` |\n| `/=` | 除并赋值运算符。它将左操作数除以右操作数，并将结果赋给左操作数。 | `C /= A` 等同于 `C = C /\
  \ A` |\n| `%=` | 取模并赋值运算符。它使用两个操作数取模，并将结果赋给左操作数。 | `C %= A` 等同于 `C = C % A` |\n\
  | `<<=` | 左移并赋值运算符。 | `C <<= 2` 等于 `C = C << 2` |\n| `>>=` | 右移并赋值运算符。 | `C >>=\
  \ 2` 等于 `C = C >> 2` |\n| `&=` | 位与并赋值运算符。 | `C &= 2` 等于 `C = C & 2` |\n| `^=` |\
  \ 按位异或并赋值运算符。 | `C ^= 2` 等于 `C = C ^ 2` |\n| `|=` | 按位或并赋值运算符。 | `C |= 2` 等于 `C\
  \ = C | 2` |\n\n## 其他运算符 ↦ sizeof & 三元运算符\n\n除了上述讨论的运算符外，C 语言还支持其他几个重要的运算符，包括 `sizeof`\
  \ 和 `? :`。\n\n[显示示例](https://www.tutorialspoint.com/cprogramming/c_sizeof_operator.htm)\n\
  \n| 运算符 | 描述 | 示例 |\n| :--- | :--- | :--- |\n| `sizeof()` | 返回变量的大小。 | `sizeof(a)`，如果\
  \ `a` 是整数，将返回 4。 |\n| `&` | 返回变量的地址。 | `&a` 返回变量的实际地址。 |\n| `*` | 指向变量的指针。 | `*a`\
  \ |\n| `? :` | 条件表达式。 | 如果条件为真 ? 取值 X : 否则取出 Y |\n\n## C 中的运算符优先级\n\n运算符优先级决定了表达式中项的分组，并决定了表达式如何求值。某些运算符的优先级高于其他运算符；例如，乘法运算符的优先级高于加法运算符。\n\
  \n例如，`x = 7 + 3 * 2;` 在这里，`x` 被赋值为 13 而不是 20，因为运算符 `*` 的优先级高于 `+`，所以它先乘以 `3*2`，然后加到\
  \ 7。\n\n### 操作数 (OPERANDS)\n\n执行操作的变量（或常量）\n\n例如：`a+b;`\n\n`a` 和 `b` 是操作数，`+` 是运算符。\n\
  \n### 表达式 (Expression)\n\n表达式是运算符、操作数的组合\n\n例如：`a*b+c;`\n\n是一个表达式\n\n### 两个数相加的简单\
  \ C 程序\n\n```c\n#include<stdio.h>\n\nvoid main()\n{\n    int a=10,b=20,c;\n    c=a+b;\n\
  \    printf(\"%d\",c);\n}\n```\n\n注意:- `//` 表示注释，意味着该行代码将不会被执行 [用于自我理解]\n\n### 解释\n\
  \n```c\n#include<stdio.h>\n// [ 包含头文件 stdio.h，这将允许我们使用 printf 语句。]\nvoid main()\n\
  //[包含源代码且不返回任何值的函数]\n{\n// [开始源代码]\n    int a=20,b=10,c;\n//[ a 和 b 是值为 20, 10 的整数常量\n\
  // c 是一个整数变量，其值是未定义的。]\n    c=a+b;\n//[ 现在操作 c=30]\n    printf(\"%d\",c);\n}\n//[\
  \ 打印“%d”，即整数 c]\n```\n\n输出：\n30.\n\n## 章节 2 章：输入/输出操作\n\n每台计算机都有一个主要目标：接收数据作为输入，对其进行处理并向用户提供所需的输出。\n\
  \n同样，如果我们想执行一个 C 程序，我们需要输入一些值，提供一些处理信息（两个数相加），然后写输出语句。\n\nI/O 操作大致分为两类：\n\n1) **控制台\
  \ I/O 函数**：\n从键盘接收输入并打印输出函数。（例如：`printf`, `scanf`）\n\n2) **文件 I/O 函数**：\n在软磁盘或磁盘上执行\
  \ I/O 操作的。\n\n注意:-大部分 C I/O 函数是通过控制台（`printf`）执行的。\n\n### 控制台 I/O\n\n#### 1) `printf()`\
  \ 函数\n\n如前所述，`printf` 是 `<stdio.h>` 头文件中的内置函数。\n\n`printf` 函数的作用是在执行期间打印输出。\n例如：`printf(\"\
  hello\");`\n\n如果我们想打印变量的值，则使用该变量的格式说明符。\n例如：`a=4;`\n`printf(\"%d\",a);`\n\n输出：4\n\
  \n#### 2) `scanf()` 函数\n\n要从用户处读取数据，我们需要使用 `scanf()` 函数。\n\n如果我们想存储变量 `x` 为 4，则使用\
  \ `scanf` 语句。在 `scanf()` 中我们使用变量的格式说明符，稍后使用 `&` 运算符将 `x` 存储在内存中。\n例如：\n```c\nint\
  \ a;\nprintf(\"enter value for a\");\nscanf(\"%d\",&a);\n```\n\n### Q) 获取两个整数并相加的\
  \ c 程序\n\n```c\n#include<stdio.h>\nvoid main()\n{\n    int a,b,c;\n    printf(\"\
  enter number 1\");\n    scanf(\"%d\",&a);\n    printf(\"enter number 2\");\n   \
  \ scanf(\"%d\",&b);\n    c=a+b;\n    printf(\"%d\",c);\n}\n```\n\n## 其他 I/o 函数\n\
  \n### `getchar()` 和 `putchar()` 函数\n\n`int getchar(void)` 函数从屏幕读取下一个字符并作为整数返回。该函数每次读取单个字符。如果我们想从屏幕上读取多个字符，可以在循环中使用这种方法。\n\
  \n`int putchar(int c)` 函数将传递的字符显示在屏幕上并返回相同的字符。该函数每次显示单个字符。如果我们想在屏幕上显示多个字符，可以在循环中使用这种方法。查看以下示例\
  \ −\n\n```c\n#include <stdio.h>\nint main() {\n    int c;\n    printf(\"Enter a\
  \ value :\");\n    c = getchar();\n    printf(\"\\nYou entered: \");\n    putchar(\
  \ c );\n    return 0;\n}\n```\n\n当上述代码编译并执行时，它会等待你输入某些文本。当你输入文本并按回车时，程序将继续并读取单个字符，显示如下\
  \ −\n\n```\n$./a.out\nEnter a value : this is test\nYou entered: t\n```\n\n## `gets()`\
  \ 和 `puts()` 函数\n\n`char *gets(char *s)` 函数从 `stdin` 读取一行到 `s` 指向的缓冲区，直到遇到终止换行符或\
  \ EOF（文件结束）。\n\n\n\n\n\n`int puts(const char *s)` 函数将字符串 's' 及其末尾的一个换行符写入 `stdout`。\n\
  \n```c\n#include <stdio.h>\nint main() {\n    char str[100];\n    printf(\"Enter\
  \ a value :\");\n    gets(str);\n    printf(\"\\nYou entered: \");\n    puts(str);\n\
  \    return 0;\n}\n```\n\n当上述代码编译并执行时，它会等待你输入文本。当你输入文本并按回车键后，程序将继续运行并读取整行直到结束，并显示如下\
  \ −\n\n`$./a.outEnter a value : this is testYou entered: this is test`\n\n# 第 3\
  \ 章：决策\n\n决策语句是 C 语言中最基础的概念之一。通过决策语句可以执行各种程序（任务）。这些语句可以帮助我们检查多个条件（可能性）并打印出所需的条件。它们也被称为选择语句或条件语句。\n\
  \n## 语句\n\n### 1) If 语句\n它是 C 语言中一种条件语句，用于检查条件或控制语句的执行。它非常容易使用。\n\n**语法**\n```c\n\
  If(condition)\n{\n    Statements\n}\n```\n在上述语法中，首先检查条件；如果为真，则程序控制流进入花括号并执行语句块。如果条件为假，则不执行语句。\n\
  \n**注意：**\n`IF` 语句末尾不需要加分号。\n\n**用例：**\n```c\nInt a =5;\nIf(a==5) // 无加分号\n{\n \
  \   Printf(\"condition is true\");\n}\n```\n**输出：**\nCondition is true.\n\n### 2)\
  \ if-else 语句\n该语句也非常有用，与 `if` 语句不同，它可以检查两个条件。\n\n**语法：**\n```c\nIf(condition)\n\
  {\n    Statement(true);\n}\nelse\n{\n    Statement(false);\n}\n```\n**用例：**\n```c\n\
  Int a =4;\nIf(a==3)\n{\n    Printf(\"condition is true\");\n}\nElse\n{\n    Printf(\"\
  condition is false\");\n}\n```\n**输出：**\nCondition is false.\n\n嵌套 if 语句\n嵌套 if-else\
  \ 语句\n\n### 3) Switch 语句\nSwitch 语句是一种多重决策语句。当使用 `if-else` 条件检查多个条件时，程序的复杂性会增加。因此，为了解决这个问题，C\
  \ 提供了 `switch` 语句。它用于高效地检查多个条件。\n\n![switch_statement](img/00003.jpeg)\n\n**语法：**\n\
  ```c\nSwitch(expression)\n{\n    Case 1:\n        Statements;\n        Break;\n\
  \    Case 2:Statements;\n        Break;\n    Case 3:Statements;\n        Break;\n\
  \    Case n:Statements;\n        Break;\n}\n```\n\n```c\n#include <stdio.h>\nint\
  \ main () {\n    /* 局部变量定义 */\n    char grade = 'B';\n    switch(grade) {\n    \
  \    case 'A':\n            printf(\"Excellent!\\n\");\n            break;\n   \
  \     case 'B':\n        case 'C':\n            printf(\"Well done\\n\");\n    \
  \        break;\n        case 'D':\n            printf(\"You passed\\n\");\n   \
  \         break;\n        case 'F':\n            printf(\"Better try again\\n\"\
  );\n            break;\n        default:\n            printf(\"Invalid grade\\n\"\
  );\n    }\n    printf(\"Your grade is %c\\n\", grade);\n    return 0;\n}\n```\n\
  当上述代码编译并执行时，它产生以下结果 −\n\nWell done\nYour grade is B\n\n注意：case 标签应该是一个整数或字符。`switch`\
  \ 中的每条语句都必须有一个 `break` 来退出 `case`，否则在执行完正确的 case 后，控制流将进入到下一个 case 并执行它；还有其他其他的条件语句，如嵌套\
  \ if..else、嵌套 switch 等。\n\n# 第 4 章：循环\n\n循环也是编程中的重要概念之一。循环被用于反复执行一组语句。循环内部的数据会一直执行，直到条件为假。它被用于编写条件。循环的执行可以通过以下方式完成：\n\
  1. 使用终止条件启动循环\n2. 初始化变量并启动循环\n3. 循环内部语句的执行\n4. 变量的递增或递减（直到满足条件）\n\n## 循环语句的类型\n\n\
  ### 1) 入控制循环\n也称为预测试循环。在这里，首先检查条件，然后评估内部的语句。`While` 和 `for` 是入控制循环，并被广泛使用。\n\n####\
  \ A) while 循环\n是一种入控制循环，用于重复执行语句块直到条件变为真。\n\n**语法：**\n```c\nWhile(condition)\n{\n\
  \    Statement;\n    Increment/decrement;\n}\n```\n**算法：**\n**用例：**\n```c\nA=3,b=5;\n\
  While(a<b)\n    Print a;\n    A++;\n```\n输出：3 4\n\n#### B) For 循环\n它比 `while` 循环更高效且有用。`for`\
  \ 循环最重要的操作之一是可以同时采取三个操作，即：\nA) 变量初始化\nB) 条件检查\nC) 变量的递增/递减。\n\n**语法：**\n```c\nFor(initialization;condition;incr/decr)\n\
  {\n    Statements;\n}\n```\n**用例：**\n```c\nA=3,i;\nFor(i=1;i<A;i++)\n{\n    Print(i)\n\
  }\n```\n输出：1 2\n\n### 2) 出控制循环\n#### A) do-while 循环\n唯一的出控制循环。在这里首先执行语句，然后检查条件。它保证语句至少执行一次。常用于菜单驱动的程序（switch\
  \ case）。\n\n**语法：**\n```c\nDo\n{\n    Statements\n}while(condition);\n```\n\n##\
  \ 跳转语句\n这些语句用于将控制流转移到另一个点。\n\n### 1) Goto\n该语句将控制流从一个点转移到另一个点。\n**语法：**\n```c\n\
  Goto label:\n```\n**用例：**\n```c\nN=4;\nFor(i=0;i<N;i++)\n{\n    Print(i);\n    If(i==2)\n\
  \        Goto here;\n}\nHere:\nprintf(y)\n```\n输出：01\n\n### 2) Break\n它是循环和 switch\
  \ 语句中非常有用的跳转语句。用于跳出循环或 switch 语句。\n**语法：**\n```c\nBreak;\n```\n\n### 3) Continue\n\
  当需要根据条件跳过主体的部分内容时使用。如果条件为真并使用了 `continue` 语句，则控制流将直接回到循环开始。\n**语法：**\n```c\ncontinue;\n\
  ```\n\n### 4) Exit()\n这是一个简单的跳转语句，调用时会完全终止程序。\n**语法：**\n```\nexit();\n```\n\n# 第\
  \ 5 章：函数\n将一组语句组合在一个逻辑单元中称为函数。如前提到的，有两种类型：\n\n### 1) 内置函数\n代码不需要编写（包含在某些头文件中），例如：`printf(<stdio.h>)`\n\
  \n### 2) 用户定义函数\n这些是用户为了实现某些特定任务而定义的语句集。\n\n**函数的优点：**\n1) 简单易用。\n2) 函数将大代码块划分为易理解的小部分。\n\
  3) 调试（移除错误）变得更容易。\n4) 在处理大型问题时有用。\n\n## 如何使用函数\n使用函数有三个部分：\n1) 函数声明\n2) 函数调用\n3)\
  \ 函数定义\n\n### 1) 函数声明\n如果要使用任何用户定义函数，必须先进行声明 [在 `main()` 之前更好]。\n**语法：**\n```c\n\
  datatype function_name(parameter)\n```\n**用例：** `int sum(int a,int b)`\n**注意：**\
  \ 这里的数据类型意味着函数将接收的值\n\n\n\n\n\n参数意味着主程序将要发送的变量（值）。\n\n### 2) 函数调用\n\n此语句将控制权从 `main()`\
  \ 部分转移到 `main()` 外部的实际函数。\n{基本上是调用函数}\n\n**语法：**\n`Function_name(parameters)`\n\n\
  **示例：**\n`sum(a,b)`\n(调用函数时参数不使用数据类型是可以的)\n\n### 3) 函数定义\n\n这是函数的主要部分。\n它包含了所有要执行的代码。\n\
  它可以接受零、一个或多个输入，可能返回也可以不返回输出，但会对数据进行处理。\n它包含一个头，其中包含函数名（之前已声明）和由步骤组成的体。\n\n**语法：**\n\
  `Return datatype function_name(parameters)`\n```c\n{\n    Statements/……\n}\n```\n\
  \n**注意：** 这里的 `return datatype` 表示返回给 `main` 程序的值（`int``,`char`）。\n如果 `return type`\
  \ 为 `void` 则不返回任何值。\n函数声明和调用用于函数的声明和调用。\n函数定义 `defintion` 用于数据处理程序。\n\n```c\n#include<stdio.h>\
  \ \n\nvoid main() \n{ \n      int a,b; \n      clrscr(); \n      printf(\"Enter\
  \ Two Number : \"); \n      scanf(\"%d%d\",&a,&b); \n      sum(a,b); \n      getch();\
  \ \n} \n\n      sum(int x,int y) \n  { \n      int z; \n      z=x+y; \n      printf(\"\
  Sum of Two Number is : %d\",z); \n      return 0; \n} \n```\n\n**输出：**\nEnter Two\
  \ Number : 10 20 \nSum of Two Number is : 30\n\n## 函数可以通过两种方式调用\n\n1) 值传递\n2) 引用传递\n\
  \n### 值传递和引用传递的区别\n\n| 值传递 | 引用传递 | \n| :--- | :--- |\n| 在值传递（call by value）中，实际参数的副本被传递给调用函数的形参数，在调用函数中对形参数进行的任何更改都不会影响调用函数中实际参数的值。\
  \ | 在引用传递（call by reference）中，实际参数存储的位置（地址）被传递给调用函数的形参数。这意味着通过访问实际参数的地址，我们可以在调用函数内部修改它们。\
  \ |\n| 在值传递中，实际参数将保持安全，它们不会被意外修改。 | 在引用传递中，可以在调用函数内部对实际参数进行修改；因此代码必须小心处理参数，否则将得到意外的结果。\
  \ |\n\n## 函数分类\n\n1) 无返回值且无参数的函数\n2) 无返回值有参数的函数\n3) 有返回值且无参数的函数\n4) 有返回值有参数的函数\n\
  \n## 存储类\n\n指的是变量的作用范围以及存储该变量所分配的内存。\n换句话说，它告诉我们变量具有哪些额外功能。\n共有 4 种存储类。\n\n1) AUTO\n\
  2) REGISTER\n3) STATIC\n4) EXTERNAL\n\n### auto 存储类\n\n`auto` 存储类是所有局部变量的默认存储类。\n\
  ```c\n{\n     int mount;\n     auto  int month;\n}\n```\n上面的示例在同一个存储类中定义了两个变量。`'auto'`\
  \ 只能在函数内部使用，即局部变量。\n\n### register 存储类\n\n`register` 存储类用于定义应该存储在寄存器而不是 RAM 中的局部变量。这意味着变量的最大大小等于寄存器的大小（通常为一个字字），并且不能对其应用一元运算符\
  \ `&`（因为它没有内存位置）。\n```c\n{\n     register  int  miles;\n}\n```\n寄存器应仅用于需要快速访问的变量，例如计数器。还需要注意的是，定义为\
  \ `'register'` 并不意味着变量将会被存储在寄存器中。这意味着根据硬件和实现限制，它**可能**被存储在寄存器中。\n\n### static 存储类\n\
  \n`static` 存储类指示编译器在程序的整个生命周期内保持局部变量的存在，而不是在每次进入和离开作用域时创建和销毁它。因此，将局部变量设为静态允许它们在函数调用之间保持其值。\n\
  `static` 修饰符也可以应用于全局变量。这样做时，会导致该变量的作用域被限制在声明它的文件中。\n在 C 语言编程中，当在类数据成员上使用 `static`\
  \ 时，它会导致该类的所有对象共享该成员的唯一副本。\n\n### extern 存储类\n\n`extern` 存储类用于声明对所有文件可见的变量。\n当使用\
  \ `extern` 时，它指向之前定义过的变量。`extern` 修饰符最常声明变量或函数。\n`extern` 存储类用于声明对所有文件可见的变量。`extern`\
  \ 用于声明变量名。`extern` 在其他文件中使用。\n\n## 递归\n\n是一种编程技术，其中函数不断地调用自己。在使用递归时，程序员需要定义一个退出条件，否则将进入无限循环。\n\
  递归函数对于解决数学问题非常有用，例如计算数字的阶乘。\n\n### 示例：使用递归计算数字的阶乘\n\n```c\n#include  <stdio.h>\n\
  long  int multiplyNumbers(int n);\n\nint main () {\n    int n;\n    printf(\"Enter\
  \ a positive integer: \");\n    scanf(\"%d\", &n);\n    printf(\"Factorial of %d\
  \ = %ld\", n, multiplyNumbers(n));\n    return  0;\n}\n\nlong  int multiplyNumbers(int\
  \ n){\n    if (n >= 1)\n        return n*multiplyNumbers(n-1);\n    else\n     \
  \   return 1;\n}\n```\n\n**输出：**\nEnter a positive integer: 6\nFactorial of 6 =\
  \ 720\n\n假设用户输入了 6。最初从 `main()` 函数调用 `multiplyNumbers()`。在每次递归调用中，`n` 的值都会减 1。当\
  \ `n` 的值小于 1 时，不再有递归调用。\n\n# 第 6 章：指针\n\n### 引言\n\n指针是存储另一个变量地址的变量。指针增强了数据的动态处理。\n\
  指针是一个值为另一个变量的变量（即内存地址）。像任何变量或常量一样，在使用存储变量地址之前必须声明指针。指针变量声明的通用形式为：\n`type *var-name;`\n\
  在这里，`type` 是指针的基本类型；它必须是有效的 C 数据类型，`var-name` 是指针变量的。声明指针使用的星号 `*` 与用于乘法的星号相同。但在该语句中，星号被用于将变量指定为指针。\n\
  \n### 如何使用指针？\n\n```c\n#include  <stdio.h>\nint main () {\n    int var  =  20; /*\
  \ 实际变量声明 */\n    int *ip; /* 指针变量声明 */\n    ip =  &var; /* 将 var 的地址存储在指针变量中*/\n\
  \    printf(\"Address of var variable: %x\\n\",  &var );\n    /* 存储在指针变量中的地址 */\n\
  \    printf(\"Address stored in ip variable: %x\\n\", ip );\n    /* 使用指针访问值 */\n\
  \    printf(\"Value of *ip variable: %d\\n\",  *ip );\n    return  0;\n}\n```当上述代码被编译并执行时，它产生以下结果\
  \ −\nAddress of var variable: bffd8b3c\nAddress stored in ip variable: bffd8b3c\n\
  Value of *ip variable: 20\n\n\n\n\nC 语言允许将指针传递给函数。要实现这一点，只需将函数参数声明为指针类型即可。\n\n以下是一个简单的示例，我们向函数传递一个\
  \ `unsigned long` 指针并修改函数内部的值，该更改会反映在调用函数中——\n\n```c\n#include <stdio.h>\n#include\
  \ <time.h>\n\nvoid getSeconds(unsigned long *par);\n\nint main ()  {\n  unsigned\
  \ long sec;\n  getSeconds(&sec);\n  /* 输出实际值 */\n  printf(\"Number of seconds: %ld\\\
  n\", sec );\n  return 0;\n}\n\nvoid getSeconds(unsigned long *par)  {\n  /* 获取当前秒数\
  \ */\n  *par = time( NULL );\n  return;\n}\n```\n\n当上述代码编译并执行时，将产生以下结果 —\n\n`Number\
  \ of seconds :1294450468`\n\n## 动态内存分配\n\n这是运行时分配内存的过程。\n\n在 C 语言中，在编译时不知道数组的的确切大小，即编译器将你的代码编译成计算机可以理解的语言的时间。因此，有时数组的大小不足或多于所需。\n\
  \n动态内存分配允许你的程序在运行时获取更多内存空间，或者在不需要时释放它。\n\n简单来说，动态内存分配允许你为程序处理程序的内存空间。\n\n虽然 C 语言本身没有任何动态分配内存的技术，但在\
  \ `\"stdlib.h\"` 下有 4 个[库函数]用于动态内存分配。\n\n| 函数 | 函数用途 |\n| --- | --- |\n| `malloc()`\
  \ | 分配请求的字节数，并返回分配空间第一个字节的指针 |\n| `calloc()` | 为数组元素分配空间，初始化为零，然后返回内存指针 |\n| `free()`\
  \ | 释放之前分配的空间 |\n| `realloc()` | 更改之前分配的空间 own |\n\n### malloc()\n\n`malloc` 的名称代表\
  \ \"memory allocation\"（内存分配）。\n\n`malloc()` 函数预留一块指定大小的内存，并返回一个 `void` 类型的指针 `pointer`，该指针可以转换为任何形式的指针。\n\
  \n### malloc() 的语法\n\n```\nptr = (cast-type*) malloc(byte-size)\n```\n\n在这里，`ptr`\
  \ 是 `cast-type` 类型的指针。`malloc()` 函数返回一个大小为 `byte size` 的内存区域指针。如果空间不足，分配失败并返回 `NULL`\
  \ 指针。\n\n```\nptr = (int*) malloc(100 * sizeof(int));\n```\n\n该语句将根据 `int` 的大小 2\
  \ 或 4 字节分别分配 200 或 400 字节，指针指向内存第一个字节的地址。\n\n### calloc()\n\n`calloc` 的名称代表 \"contiguous\
  \ allocation\"（连续分配）。\n\n`malloc()` 和 `calloc()` 唯一的区别是，`malloc()` 分配单块内存，而 `calloc()`\
  \ 分配多个相同大小的内存块并将所有字节设置为零。\n\n### calloc() 的语法\n\n```\nptr = (cast-type*)calloc(n,\
  \ element-size);\n```\n\n该语句在内存中为一个包含 `n` 个元素的数组分配连续空间。例如：\n\n```\nptr = (float*)\
  \ calloc(25, sizeof(float));\n```\n\n该语句在内存中为一个包含 25 个元素的数组分配连续空间，每个元素的大小为 `float`，即\
  \ 4 字节。\n\n### free()\n\n使用 `calloc()` 或 `malloc()` 创建的动态分配内存不会自动释放。你必须显式使用 `free()`\
  \ 来释放空间。\n\n### free() 的语法\n\n```\nfree(ptr);\n```\n\n该语句释放 `ptr` 所向内存中所分配的空间。\n\
  \n### C realloc()\n\n如果之前分配的内存不足或多于所需，你可以使用 `realloc()` 更改之前内存的大小。\n\n### realloc()\
  \ 的语法\n\n```\nptr = realloc(ptr, newsize);\n```\n\n在这里，`ptr` 被重新分配大小为 `newsize`\
  \ 的空间。\n\n编写一个 C 程序来计算用户输入的 n 个元素的和。为了执行此程序，请使用 `malloc()` 函数动态分配内存。\n\n```c\n#include\
  \ <stdio.h>\n#include <stdlib.h>\n\nint main(){\n  int num, i, *ptr, sum = 0;\n\
  \  printf(\"Enter number of elements: \");\n  scanf(\"%d\", &num);\n  ptr = (int*)\
  \ malloc(num * sizeof(int)); // 使用 malloc 分配内存\n  if(ptr == NULL)\n  {\n    printf(\"\
  Error! memory not allocated.\");\n    exit(0);\n  }\n  printf(\"Enter elements of\
  \ array: \");\n  for(i = 0; i < num; ++i)\n  {\n    scanf(\"%d\", ptr + i);\n  \
  \  sum += *(ptr + i);\n  }\n  printf(\"Sum = %d\", sum);\n  free(ptr);\n  return\
  \ 0;\n}\n```\n\n# 第 7 章：数组与字符串\n\n数组是一种在单一名称下包含一组元素的数据结构。\n\n一种可以减少时间并有助于循环语句的非常有用的技术：\n\
  \n与其声明单个变量（如 `number0`、`number1`、……以及 `number99`），你声明一个数组变量（如 `numbers`），并使用 `numbers[0]`、`numbers[1]`\
  \ 以及…… `numbers[99]` 来表示单个变量。数组中的特定元素通过索引访问。\n\n所有数组由连续的内存位置组成。最低地址对应第一个元素。\n\n\
  # 数组与字符串\n\n数组是一种在单一名称下包含一组元素的数据结构。\n\n一种可以减少时间并有助于循环语句的非常有用的技术：\n\n与其声明单个变量（如 `number0`、`number1`、……以及\
  \ `number99`），你声明一个数组变量（如 `numbers`），并使用 `numbers[0]`、`numbers[1]` 以及…… `numbers[99]`\
  \ 来表示单个变量。数组中的特定元素通过索引访问。\n\n所有数组由连续的内存位置组成。最低地址对应第一个元素。\n\n# 数组与字符串\n\n数组是一种在单一名称下包含一组元素的数据结构。\n\
  \n（此处重复略）\n\n## 字符串\n\n字符串本质上是字符数组。\n\n\n\n字符串实际上是一个一维字符数组，以 `null` 字符 `'\\0'` 终止。因此，一个空字符终止的字符串包含了组成字符串的字符，随后紧跟一个\
  \ `null` 字符。\n\n下面的声明和初始化创建了一个由 \"Hello\" 单词组成的字符串。为了在数组末尾保留空字符，包含字符串的字符数组的大小比 \"\
  Hello\" 单词中的字符数多一个。\n\n```c\nchar greeting[6] = {'H', 'e', 'l', 'l', 'o', '\\0'};\n\
  ```\n\n如果你遵循数组初始化的规则，可以按照如下方式编写上述语句——\n\n```c\nchar greeting[] = \"Hello\";\n```\n\
  \n以下是上述定义的字符串在 C/C++ 中的内存表示形式：\n\n![](img/00004.jpeg)\n\n实际上，你不需要在字符串常量的末尾放置 `null`\
  \ 字符。C 编译器在初始化数组时会自动在字符串末尾放置 `'\\0'`。让我们尝试打印上述的字符串——\n\n```c\n#include <stdio.h>\n\
  \nint main () {\n char greeting[6] = {'H', 'e', 'l', 'l', 'o', '\\0'};\n   printf(\"\
  Greeting message: %s\\n\", greeting );\n   return 0;\n}\n```\n\n当上述代码编译并执行时，它会产生以下结果——\n\
  \nGreeting message: Hello\n\nC 支持多种处理空字符终止字符串的函数——\n\n| S.N. | 函数及用途 |\n| :--- |\
  \ :--- |\n| 1 | `strcpy(s1, s2);` 将字符串 `s2` 复制到字符串 `s1`。 |\n| 2 | `strcat(s1, s2);`\
  \ 将字符串 `s2` 接到字符串 `s1` 的末尾。 |\n| 3 | `strlen(s1);` 返回字符串 `s1` 的长度。 |\n| 4 | `strcmp(s1,\
  \ s2);` 如果 `s1` 和 `s2` 相同返回 0；如果 `s1<s2` 则返回小于 0 的值；如果 `s1>s2` 则返回大于 0 的值。 |\n|\
  \ 5 | `strchr(s1, ch);` 返回字符 `ch` 在字符串 `s1` 中第一次出现处的指针。 |\n| 6 | `strstr(s1, s2);`\
  \ 返回字符串 `s2` 在字符串 `s1` 中第一次出现处的指针。 |\n\n所有这些函数都可以通过标准头文件 `<string.h>` 访问。\n\n###\
  \ 示例：不使用 strlen() 函数计算字符串长度\n\n```c\n#include <stdio.h>\nint main(){\n char s[1000],\
  \ i;\n    printf(\"Enter a string: \");\n    scanf(\"%s\", s);\n for(i = 0; s[i]\
  \ != '\\0'; ++i);\n    printf(\"Length of string: %d\", i);\n return 0;\n}\n```\n\
  \n**输出**\nEnter a string: Programiz\nLength of string: 9\n\n### 在字符串中搜索字符出现次数的 C\
  \ 程序\n\n```c\n#include<stdio.h>\n#include<conio.h>\nint main() { \n char str[20],\
  \ ch; \n int count = 0, i; \n printf(\"\\nEnter a string : \"); scanf(\"%s\", &str);\
  \ \n printf(\"\\nEnter the character to be searched : \"); scanf(\"%c\", &ch); \n\
  \ for (i = 0; str[i] != '\\0'; i++) { \n      if (str[i] == ch) count++; \n } \n\
  \ if (count == 0) \n      printf(\"\\nCharacter '%c'is not present\", ch); \n else\
  \ \n      printf(\"\\nOccurence of character '%c' : %d\", ch, count); \n return\
  \ (0);\n}\n```\n\n\n\n\n\n```c\nd3->feet = d1.feet + d2.feet;\nd3->inch = d1.inch\
  \ + d2.inch;\nif (d3->inch >= 12) { /* 如果 inch 大于或等于 12，则将其转换为 feet。 */\n    d3->inch\
  \ -= 12;\n    ++d3->feet;\n}\n```\n\nUNION 体\n\n`union` 是 C 语言中一种特殊的数据类型，允许在同一内存位置存储不同的数据类型。你可以定义一个包含许多成员的\
  \ `union`，但在任何时刻只有一个成员可以包含值。联合体提供了一种利用同一内存位置进行多用途的有效方法。\n\n## 定义联合体\n\n要定义联合体，你必须以类似于定义结构体（structure）的方式使用\
  \ `union` 语句。`union` 语句为程序定义了一个具有多个成员的新数据类型。`union` 语句的格式如下 −\n\n```c\nUnion name\n\
  {\n    Datatype name;\n    Datatype name;\n};\n```\n\n`union` 和结构体相同，区别在于 `union`\
  \ 的成员使用相同的内存，而结构体的每个成员都会占用独立的空间。\n\n结构体和联合体的区别在于：\n\n1. 存储结构体变量所需的内存量是所有成员大小之和。相反，在联合体的情况下，所需的内存量始终等于其最大成员所需的内存。\n\
  2. 在结构体中，每个成员都有自己的内存空间，但在 `union` 中，一个内存块被联合体的所有成员共享。\n\n### 详细示例：\n\n| | |\n| :---\
  \ | :--- |\n| 123456 | `struct stu{ char c; int l; float p;};` |\n| 123456 | `union\
  \ emp{ char c; int l; float p;};` |\n\n在上面的示例中，结构体 `stu` 的大小为 7，联合体 `emp` 的大小为 4。\n\
  \n# 第 9 章：C 程序\n\n## 两个数相乘程序\n\n```c\n#include <stdio.h>\nint main(){\n    double\
