- "# C 语言编程指南：今天成为程序员\n\n\n\n\n\n\n\n## 前言\n\n如你所知，我们生活在一个计算机世界。仅仅学会如何使用计算机是不够的，因为与计算机的实际交互是通过编程实现的。本书将通过教你\
  \ `c` 语言编程，让你一天成为一名程序员，`c` 是最古老、基础且最受欢迎的编程语言之一。\n\n本书专为初学者定制（无编程概念基础）。\n\n请耐心前行，成为一名程序员\n\
  - MURTUZA CHAWALA\n\n## 目录\n1. 引言\n2. 输入/输出操作\n3. 决策与循环\n4. 函数\n5. 指针\n6. 数组\n7.\
  \ 字符串\n8. 自定义数据类型\n9. C 程序\n\n### 引言\n\n`C` 是一种通用编程语言，由 `Denis Ritchie` 于 1972 年在美国的\
  \ `At’t bell laboratory` 创建。\n\n`C` 是最早、最流行、最强大且最容易的编程语言之一。\n\n计算机（数字系统）无法理解普通的英语，它只理解机器语言（二进制代码），即\
  \ (`1s` 和 `0s`）。因此，`c` 被用来告诉计算机具体要执行什么。\n\n所有的软件、应用程序都是用某种编程语言（`C`、`C++`、`Java`\
  \ 等）编写的。\n\n`Linux`(`Unix`)操作系统完全是用 `c` 语言编写的。\n\n`C` 也用于制作编译器、操作系统的内核。\n\n`C` 是一种编程语言，我们在手机、笔记本电脑等上的任何任务实际上都是通过编程（内置的，终端用户感知）完成的。\n\
  \n例如：每当按下按钮时，就会生成相应的代码，生成的代码随后由编译器进行编译。\n\n`Compiler`（将编程代码转换为二进制代码（`1s,0s`））——该二进制代码被发送到\
  \ `CPU` 并在那里进行处理（二进制形式），然后从 `CPU` 发回显示器，二进制代码再次转换为输出形式（音频、十进制、照片等）。\n\n这就是编程语言的工作原理。\n\
  \n### Q) c 的优点是什么？\n\nA)\n1) `c` 是最基础且最简单的编程语言之一，即它是成为程序员的第一步。\n2) `c` 是机器无关的，即\
  \ `[(code)]` 可以在任何计算机上运行。\n3) 作为一种结构化和过程化的语言，它提供了层层递进的知识。\n4) 使用 `c` 可以执行许多操作，而且它非常灵活（解决同一个问题的不同方法）。\n\
  5) 它既具有高级语言（`java`）的特征，又具有底层语言的特征。\n\n## 需要学习编程\n\n编写完美的代码是不够的，因为它是英语编写的，计算机无法理解，因此我们需要在应用程序中编写代码，以便于代码到二进制的翻译。\n\
  \n在线可以获取编译器（`turbo c`）。\n\n建议你下载编译器，并在阅读本书的同时执行你的代码。\n\n## C 程序\n\n### Q) 打印 hello\
  \ world 的 C 程序？\n\nA)\n```c\n#include<stdio.h>\nVoid main()\n{\n    Printf“hello\
  \ world”);\n}\n```\n\n## C 概念（解释）\n\n1. `#include` 是一个预处理指令（稍后学习）。`<stdio.h>` 是一个头文件，允许你执行一些内置函数（`printf`）。\n\
  2. `void main()`：每个 `c` 程序都从 `main()` 开始。`void` 表示 `main` 函数不返回任何值。\n3. `printf`：这是来自头文件\
  \ `<stdio.h>` 的内置函数，用于打印打印语句内部编写的任何内容。\n4. `;`：这（分号）用于表示行的结束。`main()` 函数中的每条语句[除循环等少数例外外]，末尾都有一个\
  \ `;`。\n\n**注意：**\n每个 `c` 程序都必须包含头文件 `#include<stdio.h>`，因为没有它就无法执行 `printf`（输出）和\
  \ `scanf`（输入）函数。\n`Main()` 可以写为 `void main()` 或 `int main()`，然后在最后 `return 0`（空）。\n\
  \n**算法**：不包含语法的程序实际逻辑。\n\n## 在开始编程之前，我们将首先学习 C 语言中的所有基础概念\n\n### 1) 变量：\n它们是标识符，是赋值给某些值的符号名称。\n\
  例如：`int a;`\n这里变量是 `a`，它是一个整数（数字），可以存储某些值。\n\n### 2) 常量：\n它也是一种标识符。\n常量的值是固定的（与变量不同），在编程过程中不能更改。\n\
  例如：`int a=5;`\n这里 `a` 是一个持有值 `5` 的常量。\n\n### 3) 关键字\n这些是编程中保留字，不能用作变量或常量，例如：`int`、`char`（数据类型）、void`、`for`、`while`\
  \ 等。\n\n### 4) 数据类型\n它们是关键字。用于为变量分配类型。\n基本数据类型：\n1. `int`：它指定与其关联的变量持有数字。\n例如：`int\
  \ a;`\n这意味着 `a` 将持有某些数字。\n\n**注意:-格式说明符**\n如果我们想打印某些整数值，由于我们不能直接在 `printf` 语句中写变量名，我们使用\
  \ `%d`。\n```c\nmain()\n{\n    int a=5;\n    printf(\"%d\",a)\n}\n```\n因此 `%d` 用于打印整数值。\n\
  \n2. `char`：它指定与其关联的变量持有单个字符。\n例如：`char a;`\n这意味着 `a` 将持有某些字符。\n格式说明符：%c。\n\n3.\
  \ `float`：它指定与其关联的变量持有浮点值（小数）。\n例如：`float a;`\n`a` 将持有某些值。\n格式说明符：%f。\n\n4. `void`：它告诉不持有任何值。\n\
  \n**其他数据类型**\n- `Long int` (4 字节) `%ld`\n- `Unsigned int` (2 字节) `%u`\n- `Double`\
  \ (8 字节) `%lf`\n- `Long double` (16 字节) `%Lf`\n上述大小：\n局部变量：在 `main()` 函数内部定义。\n\
  全局变量：在 `main()` 函数外部定义。\n\n## 运算符\n\n运算符是操作值或变量的符号。它们表示一种操作。例如：`+,->,<`\n\n### 运算符类型\n\
  运算符是告诉编译器执行特定数学或逻辑函数的符号。C 语言拥有丰富的运算符，并提供以下类型：\n* 算术运算符\n* 关系运算符\n* 逻辑运算符\n* 位运算符\n\
  * 赋值运算符\n* 杂项运算符\n\n### 算术运算符\n下表显示了 C 支持的所有算术运算符。假设变量 `A` 持有 10，变量 `B` 持有 20，则\n\
