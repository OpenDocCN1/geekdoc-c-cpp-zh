    \ such as `numbers` and use `numbers[0]`, `numbers[1]`, and ..., `numbers[99]`\
    \ to represent individual variables. A specific element in an array is accessed\
    \ by an index.\n\nAll arrays consist of contiguous memory locations. The lowest\
