  trans: "\nC 语言允许将指针传递给函数。要实现这一点，只需将函数参数声明为指针类型即可。\n\n以下是一个简单的示例，我们向函数传递一个 `unsigned\
    \ long` 指针并修改函数内部的值，该更改会反映在调用函数中——\n\n```c\n#include <stdio.h>\n#include <time.h>\n\
    \nvoid getSeconds(unsigned long *par);\n\nint main ()  {\n  unsigned long sec;\n\
    \  getSeconds(&sec);\n  /* 输出实际值 */\n  printf(\"Number of seconds: %ld\\n\", sec\
    \ );\n  return 0;\n}\n\nvoid getSeconds(unsigned long *par)  {\n  /* 获取当前秒数 */\n\
    \  *par = time( NULL );\n  return;\n}\n```\n\n当上述代码编译并执行时，将产生以下结果 —\n\n`Number\
    \ of seconds :1294450468`\n\n# 动态内存分配\n\n这是运行时分配内存的过程。\n\n在 C 语言中，在编译时不知道数组的的确切大小，即编译器将你的代码编译成计算机可以理解的语言的时间。因此，有时数组的大小不足或多于所需。\n\
    \n动态内存分配允许你的程序在运行时获取更多内存空间，或者在不需要时释放它。\n\n简单来说，动态内存分配允许你为程序处理程序的内存空间。\n\n虽然 C\
    \ 语言本身没有任何动态分配内存的技术，但在 `\"stdlib.h\"` 下有 4 个[库函数]用于动态内存分配。\n\n| 函数 | 函数用途 |\n\
    | --- | --- |\n| `malloc()` | 分配请求的字节数，并返回分配空间第一个字节的指针 |\n| `calloc()` | 为数组元素分配空间，初始化为零，然后返回内存指针\
    \ |\n| `free()` | 释放之前分配的空间 |\n| `realloc()` | 更改之前分配的空间 own |\n\n## malloc()\n\
    \n`malloc` 的名称代表 \"memory allocation\"（内存分配）。\n\n`malloc()` 函数预留一块指定大小的内存，并返回一个\
    \ `void` 类型的指针 `pointer`，该指针可以转换为任何形式的指针。\n\n### malloc() 的语法\n\n```\nptr = (cast-type*)\
    \ malloc(byte-size)\n```\n\n在这里，`ptr` 是 `cast-type` 类型的指针。`malloc()` 函数返回一个大小为\
    \ `byte size` 的内存区域指针。如果空间不足，分配失败并返回 `NULL` 指针。\n\n```\nptr = (int*) malloc(100\
    \ * sizeof(int));\n```\n\n该语句将根据 `int` 的大小 2 或 4 字节分别分配 200 或 400 字节，指针指向内存第一个字节的地址。\n\
    \n## calloc()\n\n`calloc` 的名称代表 \"contiguous allocation\"（连续分配）。\n\n`malloc()`\
    \ 和 `calloc()` 唯一的区别是，`malloc()` 分配单块内存，而 `calloc()` 分配多个相同大小的内存块并将所有字节设置为零。\n\
    \n### calloc() 的语法\n\n```\nptr = (cast-type*)calloc(n, element-size);\n```\n\n\
    该语句在内存中为一个包含 `n` 个元素的数组分配连续空间。例如：\n\n```\nptr = (float*) calloc(25, sizeof(float));\n\
    ```\n\n该语句在内存中为一个包含 25 个元素的数组分配连续空间，每个元素的大小为 `float`，即 4 字节。\n\n## free()\n\n\
    使用 `calloc()` 或 `malloc()` 创建的动态分配内存不会自动释放。你必须显式使用 `free()` 来释放空间。\n\n### free()\
    \ 的语法\n\n```\nfree(ptr);\n```\n\n该语句释放 `ptr` 所向内存中所分配的空间。\n\n## C realloc()\n\n\
    如果之前分配的内存不足或多于所需，你可以使用 `realloc()` 更改之前内存的大小。\n\n### realloc() 的语法\n\n```\nptr\
    \ = realloc(ptr, newsize);\n```\n\n在这里，`ptr` 被重新分配大小为 `newsize` 的空间。\n\n编写一个 C\
    \ 程序来计算用户输入的 n 个元素的和。为了执行此程序，请使用 `malloc()` 函数动态分配内存。\n\n```c\n#include <stdio.h>\n\
    #include <stdlib.h>\n\nint main(){\n  int num, i, *ptr, sum = 0;\n  printf(\"\
    Enter number of elements: \");\n  scanf(\"%d\", &num);\n  ptr = (int*) malloc(num\
    \ * sizeof(int)); // 使用 malloc 分配内存\n  if(ptr == NULL)\n  {\n    printf(\"Error!\
    \ memory not allocated.\");\n    exit(0);\n  }\n  printf(\"Enter elements of array:\
    \ \");\n  for(i = 0; i < num; ++i)\n  {\n    scanf(\"%d\", ptr + i);\n    sum\
    \ += *(ptr + i);\n  }\n  printf(\"Sum = %d\", sum);\n  free(ptr);\n  return 0;\n\
    }\n```\n\n# 第 7 章：数组与字符串\n\n数组是一种在单一名称下包含一组元素的数据结构。\n\n一种可以减少时间并有助于循环语句的非常有用的技术：\n\
    \n与其声明单个变量（如 `number0`、`number1`、……以及 `number99`），你声明一个数组变量（如 `numbers`），并使用 `numbers[0]`、`numbers[1]`\
    \ 以及…… `numbers[99]` 来表示单个变量。数组中的特定元素通过索引访问。\n\n所有数组由连续的内存位置组成。最低地址对应第一个元素。\n\n\
    # 数组与字符串\n\n数组是一种在单一名称下包含一组元素的数据结构。\n\n一种可以减少时间并有助于循环语句的非常有用的技术：\n\n与其声明单个变量（如\
    \ `number0`、`number1`、……以及 `number99`），你声明一个数组变量（如 `numbers`），并使用 `numbers[0]`、`numbers[1]`\
    \ 以及…… `numbers[99]` 来表示单个变量。数组中的特定元素通过索引访问。\n\n所有数组由连续的内存位置组成。最低地址对应第一个元素。\n\n\
    # 数组与字符串\n\n数组是一种在单一名称下包含一组元素的数据结构。\n\n（此处重复略）\n\n# 字符串\n\n字符串本质上是字符数组。\n"
- fmt: "\nStrings are actually one-dimensional array of characters terminated by a\
    \ `null` character `'\\0'`. Thus a null-terminated string contains the characters\
    \ that comprise the string followed by a `null`.\n\nThe following declaration\
    \ and initialization create a string consisting of the word \"Hello\". To hold\
    \ the null character at the end of the array, the size of the character array\
    \ containing the string is one more than the number of characters in the word\
    \ \"Hello.\"\n\n```c\nchar greeting[6] = {'H', 'e', 'l', 'l', 'o', '\\0'};\n```\n\
    \nIf you follow the rule of array initialization then you can write the above\
    \ statement as follows —\n\n```c\nchar greeting[] = \"Hello\";\n```\n\nFollowing\
    \ is the memory presentation of the above defined string in C/C++ —\n\n![](images/00004.jpeg)\n\
    \nActually, you do not place the `null` character at the end of a string constant.\
    \ The C compiler automatically places the `'\\0'` at the end of the string when\
    \ it initializes the array. Let us try to print the above mentioned string —\n\
    \n```c\n#include <stdio.h>\n\nint main () {\n char greeting[6] = {'H', 'e', 'l',\
    \ 'l', 'o', '\\0'};\n   printf(\"Greeting message: %s\\n\", greeting );\n   return\
    \ 0;\n}\n```\n\nWhen the above code is compiled and executed, it produces the\
    \ following result —\n\nGreeting message: Hello\n\nC supports a wide range of\
    \ functions that manipulate null-terminated strings —\n\n| S.N. | Function & Purpose\
    \ |\n| :--- | :--- |\n| 1 | `strcpy(s1, s2);` Copies string `s2` into string `s1`.\
    \ |\n| 2 | `strcat(s1, s2);` Concatenates string `s2` onto the end of string `s1`.\
    \ |\n| 3 | `strlen(s1);` Returns the length of string `s1`. |\n| 4 | `strcmp(s1,\
    \ s2);` Returns 0 if `s1` and `s2` are the same; less than 0 if `s1<s2`; greater\
    \ than 0 if `s1>s2`. |\n| 5 | `strchr(s1, ch);` Returns a pointer to the first\
    \ occurrence of character `ch` in string `s1`. |\n| 6 | `strstr(s1, s2);` Returns\
    \ a pointer to the first occurrence of string `s2` in string `s1`. |\n\nAll these\
    \ function can be accessed using standard header file `<string.h>`.\n\n## Example:\
    \ Calculate Length of String without Using strlen() Function\n\n```c\n#include\
    \ <stdio.h>\nint main(){\n char s[1000], i;\n    printf(\"Enter a string: \");\n\
    \    scanf(\"%s\", s);\n for(i = 0; s[i] != '\\0'; ++i);\n    printf(\"Length\
    \ of string: %d\", i);\n return 0;\n}\n```\n\n**Output**\nEnter a string: Programiz\n\
    Length of string: 9\n\n## C Program to Search occurrence of Character in String\n\
    \n```c\n#include<stdio.h>\n#include<conio.h>\nint main() { \n char str[20], ch;\
    \ \n int count = 0, i; \n printf(\"\\nEnter a string : \"); scanf(\"%s\", &str);\
    \ \n printf(\"\\nEnter the character to be searched : \"); scanf(\"%c\", &ch);\
    \ \n for (i = 0; str[i] != '\\0'; i++) { \n      if (str[i] == ch) count++; \n\
    \ } \n if (count == 0) \n      printf(\"\\nCharacter '%c'is not present\", ch);\
    \ \n else \n      printf(\"\\nOccurence of character '%c' : %d\", ch, count);\
    \ \n return (0);\n}\n```\n\n**Output:**\n**First Run:** Enter a string : c4learn.blogspot.com\n\
    Enter the character to be searched : o\nOccurence of character 'o' : 3\n**Second\
    \ Run:** Enter a string : c4learn.blogspot.com\nEnter the character to be searched\
    \ : x\nCharacter 'x'is not present\n\n## Chapter 8: User defined datatype\n\n\
    ### STRUCTURE\n\nArrays allow to define type of variables that can hold several\
    \ data items of the same kind. Similarly `structure` is another user defined data\
    \ type available in C that allows to combine data items of different kinds.\n\n\
    Structures are used to represent a record. Suppose you want to keep track of your\
    \ books in a library. You might want to track the following attributes about each\
    \ book —\n\n* Title\n* Author\n* Subject\n* Book ID\n\n### Defining a Structure\n\
    \nTo define a structure, you must use the `struct` statement. The `struct` statement\
    \ defines a new data type, with more than one member. The format of the `struct`\
    \ statement is as follows —\n\n```c\nStruct name\n{\n  Datatype member_name;\n\
    \  Datatype member_name;\n};\n```\n\nEg:- `struct student`\n```c\nstruct student\
    \ {\n  Int data;\n  Char name[10];\n};\n```\n\n### Accessing Structure Members\n\
    \nTo access any member of a structure, we use the member access operator (`.`).\
    \ The member access operator is coded as a period between the structure variable\
    \ name and the structure member that we wish to access. You would use the keyword\
    \ `struct` to define variables of structure type. The following example shows\
    \ how to use a structure in a program —\n\nEg:-\n```c\nstruct student {\n  Int\
    \ data;\n  Char name[10];\n} s;\n```\n`s.data;`\n`s.name;`\n\n### Example: Store\
    \ Information in Structure and Display it\n\n```c\n#include <stdio.h>\nstruct\
    \ student{\n char name[50];\n int roll;\n float marks;\n} s[10];\n\nint main(){\n\
    \ int i;\n    printf(\"Enter information of students:\\n\");\n // storing information\n\
    \    for(i=0; i<10; ++i) {\n      s[i].roll = i+1;\n      printf(\"\\nFor roll\
    \ number%d,\\n\",s[i].roll);\n      printf(\"Enter name: \");\n      scanf(\"\
    %s\",s[i].name);\n      printf(\"Enter marks: \");\n      scanf(\"%f\",&s[i].marks);\n\
    \      printf(\"\\n\");\n    }\n    printf(\"Displaying Information:\\n\");\n\
    \    for(i=0; i<10; ++i) {\n      printf(\"\\nRoll number: %d\\n\",i+1)\n    \
    \  printf(\"Name: \");\n      puts(s[i].name);\n      printf(\"Marks: %.1f\",s[i].marks);\n\
    \      printf(\"\\n\");\n    }\n return 0;\n}\n```\n\n**Output**\nEnter information\
    \ of students:\nFor roll number1,\nEnter name: Tom\nEnter marks: 98\nFor roll\
    \ number2,\nEnter name: Jerry\nEnter marks: 89\nDisplaying Information:\nRoll\
    \ number: 1\nName: Tom\nMarks: 98\n\nIn C, `structure` can be passed to `functions`\
    \ by two methods:\n1. Passing by value (passing actual value as argument)\n2.\
    \ Passing by reference (passing address of argument)\n\n### Passing structure\
    \ by value\n\nA structure variable can be passed to the function as an argument\
    \ as a normal variable. If structure is passed by value, changes made to the structure\
    \ variable inside the function definition does not reflect in the originally passed\
    \ structure variable.\n\n```c\n#include <stdio.h>\nstruct student{\n char name[50];\n\
    \ int roll;\n};\n\nvoid display(struct student stu);// // function prototype should\
    \ be below the structure declaration otherwise compiler shows error\n\nint main(){\n\
    \ struct student stud;\n    printf(\"Enter student's name: \");\n    scanf(\"\
    %s\", &stud.name);\n    printf(\"Enter roll number:\");\n    scanf(\"%d\", &stud.roll);\n\
    \    display(stud); // passing structure variable stud as argument\n return 0;\n\
    }\n\nvoid display(struct student stu){\n  printf(\"Output\\nName: %s\",stu.name);\n\
    \  printf(\"\\nRoll: %d\",stu.roll);\n}\n```\n\n### Passing structure by reference\n\
    \nThe memory address of a structure variable is passed to function while passing\
    \ it by reference. If structure is passed by reference, changes made to the structure\
    \ variable inside function definition reflects in the originally passed structure\
    \ variable.\n\n```c\n#include <stdio.h>\nstruct distance{\n int feet;\n float\
    \ inch;\n};\n\nvoid add(struct distance d1,struct distance d2, struct distance\
    \ *d3);\n\nint main(){\n struct distance dist1, dist2, dist3;\n    printf(\"First\
    \ distance\\n\");\n    printf(\"Enter feet: \");\n    scanf(\"%d\", &dist1.feet);\n\
    \    printf(\"Enter inch: \");\n    scanf(\"%f\", &dist1.inch);\n    printf(\"\
    Second distance\\n\");\n    printf(\"Enter feet: \");\n    scanf(\"%d\", &dist2.feet);\n\
    \    printf(\"Enter inch: \");\n    scanf(\"%f\", &dist2.inch);\n    add(dist1,\
    \ dist2, &dist3); //passing structure variables dist1 and dist2 by value whereas\
    \ passing structure variable dist3 by reference\n    printf(\"\\nSum of distances\
    \ = %d'-%.1f\\\"\", dist3.feet, dist3.inch);\n return 0;\n}\n\nvoid add(struct\
    \ distance d1,struct distance d2, struct distance *d3) {\n //Adding distances\
    \ d1 and d2 and storing it in d3\n}\n```\n"
