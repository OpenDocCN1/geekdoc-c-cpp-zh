    \ greater than 0 if s1>s2. |\n\n| 5 | strchr(s1, ch);Returns a pointer to the\
    \ first occurrence of character ch in string s1. |\n\n| 6 | strstr(s1, s2);Returns\
    \ a pointer to the first occurrence of string s2 in string s1. |\n\nAll these\
    \ function can be accessed using standard header file <string.h>\n\n## Example:\
    \ Calculate Length of String without Using strlen() Function\n\n#include  <stdio.h>int\
    \ main(){\n\n char s[1000], i;\n\n    printf(\"Enter a string: \");\n\n    scanf(\"\
    %s\", s);\n\n for(i = 0; s[i] != '\\0'; ++i);\n\n    printf(\"Length of string:\
    \ %d\", i);\n\n return  0;}\n\nOutput\n\nEnter a string: Programiz\n\nLength of\
    \ string: 9\n\n## C Program to Search occurrence of Character in String\n\n| #include<stdio.h>#include<conio.h>int\
    \  main()  { char  str[20],  ch; int  count = 0,  i; printf(\"\\nEnter a string\
    \ : \"); scanf(\"%s\", &str); printf(\"\\nEnter the character to be searched :\
    \ \"); scanf(\"%c\", &ch); for  (i = 0;  str[i] != '\\0';  i++)  {      if  (str[i]\
    \ == ch) count++; } if  (count == 0)      printf(\"\\nCharacter '%c'is not present\"\
    ,  ch); else      printf(\"\\nOccurence of character '%c' : %d\",  ch,  count);\
    \ return  (0);} |\n\n* * *\n\nOutput :\n\n| 123456789 | <strong>First Run :</strong>Enter\
    \  a  string : c4learn.blogspot.comEnter the character to  be searched : oOccurence\
    \ of character  'o' : 3<strong>Second Run :</strong>Enter  a  string : c4learn.blogspot.comEnter\
    \ the character to  be searched : xCharacter  'x'is  not  present |\n\nChapter\
    \ 8:\n\nUser defined datatype.\n\nSTRUCTURE\n\nArrays allow to define type of\
    \ variables that can hold several data items of the same kind. Similarly structure is\
    \ another user defined data type available in C that allows to combine data items\
    \ of different kinds.\n\nStructures are used to represent a record. Suppose you\
    \ want to keep track of your books in a library. You might want to track the following\
    \ attributes about each book −\n\n*   Title\n\n*   Author\n\n*   Subject\n\n*\
    \   Book ID\n\n## Defining a Structure\n\nTo define a structure, you must use\
    \ the struct statement. The struct statement defines a new data type, with more\
    \ than one member. The format of the struct statement is as follows −\n\nStruct\
    \ name\n\n{\n\nDatatype member_name;\n\nDatatype member_name;\n\n};\n\nEg:- struct\
    \ student\n\n   {\n\nInt data;\n\nChar name[10];\n\n};\n\n## Accessing Structure\
    \ Members\n\nTo access any member of a structure, we use the member access operator\
    \ (.). The member access operator is coded as a period between the structure variable\
    \ name and the structure member that we wish to access. You would use the keyword struct to\
    \ define variables of structure type. The following example shows how to use a\
    \ structure in a program −\n\nEg:-\n\nstruct student\n\n   {\n\nInt data;\n\n\
    Char name[10];\n\n}s;\n\nS.data;\n\nS.name;\n\n## Example: Store Information in\
    \ Structure and Display it\n\n#include  <stdio.h>struct student{\n\n char name[50];\n\
    \n int roll;\n\n float marks;} s[10];\n\nint main(){\n\n int i;\n\n    printf(\"\
    Enter information of students:\\n\");\n\n // storing information\n\n for(i=0;\
    \ i<10; ++i)\n\n    {\n\n        s[i].roll = i+1;\n\n        printf(\"\\nFor roll\
    \ number%d,\\n\",s[i].roll);\n\n        printf(\"Enter name: \");\n\n        scanf(\"\
    %s\",s[i].name);\n\n        printf(\"Enter marks: \");\n\n        scanf(\"%f\"\
    ,&s[i].marks);\n\n        printf(\"\\n\");\n\n    }\n\n    printf(\"Displaying\
    \ Information:\\n\\n\");\n\n // displaying information\n\n for(i=0; i<10; ++i)\n\
    \n    {\n\n        printf(\"\\nRoll number: %d\\n\",i+1)\n\nprintf(\"Name: \"\
    );\n\n        puts(s[i].name);\n\n        printf(\"Marks: %.1f\",s[i].marks);\n\
    \n        printf(\"\\n\");\n\n    }\n\n return  0;}\n\nOutput\n\nEnter information\
    \ of students:\n\nFor roll number1,\n\nEnter name: Tom\n\nEnter marks: 98\n\n\
    For roll number2,\n\nEnter name: Jerry\n\nEnter marks: 89\n\n.\n\n.\n\n.\n\nDisplaying\
    \ Information:\n\nRoll number: 1\n\nName: Tom\n\nMarks: 98\n\n.\n\n.\n\n.\n\n\
    In C, [structure](http://www.programiz.com/c-programming/c-structures) can be\
    \ passed to [functions](http://www.programiz.com/c-programming/c-functions) by\
    \ two methods:\n\n1.  [Passing by value (passing actual value as argument)](http://www.programiz.com/c-programming/c-user-defined-functions)\n\
    \n2.  [Passing by reference (passing address of an argument)](http://www.programiz.com/c-programming/c-pointer-functions)\n\
    \n### Passing structure by value\n\nA structure variable can be passed to the\
    \ function as an argument as a normal variable.\n\nIf structure is passed by value,\
    \ changes made to the structure variable inside the function definition does not\
    \ reflect in the originally passed structure variable.\n\nC program to create\
    \ a structure student, containing name and roll and display the information.\n\
    \n#include  <stdio.h>struct student{\n\n char name[50];\n\n int roll;};\n\nvoid\
    \ display(struct student stu);// function prototype should be below to the structure\
    \ declaration otherwise compiler shows error\n\nint main(){\n\n struct student\
    \ stud;\n\n    printf(\"Enter student's name: \");\n\n    scanf(\"%s\", &stud.name);\n\
    \n    printf(\"Enter roll number:\");\n\n    scanf(\"%d\", &stud.roll);\n\ndisplay(stud);\
    \ // passing structure variable stud as argument\n\n return  0;}void display(struct\
    \ student stu){\n\n  printf(\"Output\\nName: %s\",stu.name);\n\n  printf(\"\\\
    nRoll: %d\",stu.roll);}\n\n### Passing structure by reference\n\nThe memory address\
    \ of a structure variable is passed to function while passing it by reference.\n\
    \nIf structure is passed by reference, changes made to the structure variable\
    \ inside function definition reflects in the originally passed structure variable.\n\
    \nC program to add two distances (feet-inch system) and display the result without\
    \ the return statement.\n\n#include  <stdio.h>struct distance{\n\n int feet;\n\
    \n float inch;};void add(struct distance d1,struct distance d2, struct distance\
    \ *d3);\n\nint main(){\n\n struct distance dist1, dist2, dist3;\n\n    printf(\"\
    First distance\\n\");\n\n    printf(\"Enter feet: \");\n\n    scanf(\"%d\", &dist1.feet);\n\
    \n    printf(\"Enter inch: \");\n\n    scanf(\"%f\", &dist1.inch);\n\n    printf(\"\
    Second distance\\n\");\n\n    printf(\"Enter feet: \");\n\n    scanf(\"%d\", &dist2.feet);\n\
    \n    printf(\"Enter inch: \");\n\n    scanf(\"%f\", &dist2.inch);\n\n    add(dist1,\
    \ dist2, &dist3);\n\n //passing structure variables dist1 and dist2 by value whereas\
    \ passing structure variable dist3 by reference\n\n    printf(\"\\nSum of distances\
    \ = %d\\'-%.1f\\\"\", dist3.feet, dist3.inch);\n\n return  0;}void add(struct\
    \ distance d1,struct distance d2, struct distance *d3) {\n\n //Adding distances\
    \ d1 and d2 and storing it in d3"
