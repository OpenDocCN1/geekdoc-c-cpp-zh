    \ etc.\n\n## Example: Factorial of a Number Using Recursion\n\n#include  <stdio.h>long\
    \  int multiplyNumbers(int n);\n\nint main(){\n\n int n;\n\n    printf(\"Enter\
    \ a positive integer: \");\n\n    scanf(\"%d\", &n);\n\n    printf(\"Factorial\
    \ of %d = %ld\", n, multiplyNumbers(n));\n\n return  0;}long  int multiplyNumbers(int\
    \ n){\n\n if (n >= 1)\n\n return n*multiplyNumbers(n-1);\n\n else\n\n return \
    \ 1;}\n\nOutput\n\nEnter a positive integer: 6\n\nFactorial of 6 = 720\n\nSuppose\
    \ the user entered 6.\n\nInitially, the multiplyNumbers() is called from the main() function\
    \ with 6 passed as an argument.\n\nThen, 5 is passed to the multiplyNumbers() function\
    \ from the same function (recursive call). In each recursive call, the value of\
    \ argument n is decreased by 1.\n\nWhen the value of n is less than 1, there is\
    \ no recursive call.\n\nChapter 6:\n\nPointers\n\nINTRODUCTION:\n\nPointer is\
    \ a variable that stores memory address of another variable.\n\nPointer enhances\
    \ dynamic handling of data.\n\nA pointer is a variable whose value is the address\
    \ of another variable, i.e., direct address of the memory location. Like any variable\
    \ or constant, you must declare a pointer before using it to store any variable\
    \ address. The general form of a pointer variable declaration is −\n\ntype *var-name;\n\
    \nHere, type is the pointer's base type; it must be a valid C data type and var-name is\
    \ the name of the pointer variable. The asterisk * used to declare a pointer is\
    \ the same asterisk used for multiplication. However, in this statement the asterisk\
    \ is being used to designate a variable as a pointer. Take a look at some of the\
    \ valid pointer declarations −\n\n## How to Use Pointers?\n\n#include  <stdio.h>\n\
    \nint main ()  {\n\n int var  =  20; /* actual variable declaration */\n\n int\
    \ *ip; /* pointer variable declaration */\n\nip =  &var; /* store address of var\
    \ in pointer variable*/\n\n   printf(\"Address of var variable: %x\\n\",  &var\
    \ );\n\n /* address stored in pointer variable */\n\n   printf(\"Address stored\
    \ in ip variable: %x\\n\", ip );\n\n /* access the value using the pointer */\n\
    \n   printf(\"Value of *ip variable: %d\\n\",  *ip );\n\n return  0;}\n\nWhen\
    \ the above code is compiled and executed, it produces the following result −\n\
    \nAddress of var variable: bffd8b3c\n\nAddress stored in ip variable: bffd8b3c\n\
    \nValue of *ip variable: 20\n\nPassing pointer to function"
