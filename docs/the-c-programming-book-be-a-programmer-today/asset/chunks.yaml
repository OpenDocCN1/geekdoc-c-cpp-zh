  trans: "\n\n```c\nd3->feet = d1.feet + d2.feet;\nd3->inch = d1.inch + d2.inch;\n\
    if (d3->inch >= 12) { /* 如果 inch 大于或等于 12，则将其转换为 feet。 */\n    d3->inch -= 12;\n\
    \    ++d3->feet;\n}\n```\n\nUNION 体\n\n`union` 是 C 语言中一种特殊的数据类型，允许在同一内存位置存储不同的数据类型。你可以定义一个包含许多成员的\
    \ `union`，但在任何时刻只有一个成员可以包含值。联合体提供了一种利用同一内存位置进行多用途的有效方法。\n\n## 定义联合体\n\n要定义联合体，你必须以类似于定义结构体（structure）的方式使用\
    \ `union` 语句。`union` 语句为程序定义了一个具有多个成员的新数据类型。`union` 语句的格式如下 −\n\n```c\nUnion name\n\
    {\n    Datatype name;\n    Datatype name;\n};\n```\n\n`union` 和结构体相同，区别在于 `union`\
    \ 的成员使用相同的内存，而结构体的每个成员都会占用独立的空间。\n\n结构体和联合体的区别在于：\n\n1. 存储结构体变量所需的内存量是所有成员大小之和。相反，在联合体的情况下，所需的内存量始终等于其最大成员所需的内存。\n\
    2. 在结构体中，每个成员都有自己的内存空间，但在 `union` 中，一个内存块被联合体的所有成员共享。\n\n### 详细示例：\n\n| | |\n\
    | :--- | :--- |\n| 123456 | `struct stu{ char c; int l; float p;};` |\n| 123456\
    \ | `union emp{ char c; int l; float p;};` |\n\n在上面的示例中，结构体 `stu` 的大小为 7，联合体 `emp`\
    \ 的大小为 4。\n\n# 第 9 章：C 程序\n\n## 两个数相乘程序\n\n```c\n#include <stdio.h>\nint main(){\n\
    \    double firstNumber, secondNumber, productOfTwoNumbers;\n    printf(\"Enter\
    \ two numbers: \");\n    // 分别将两个浮点数存储在变量 firstNumber 和 secondNumber 中\n    scanf(\"\
    %lf %lf\", &firstNumber, &secondNumber); \n    // 执行乘法并将结果存储在变量 productOfTwoNumbers\
    \ 中\n    productOfTwoNumbers = firstNumber * secondNumber; \n    // 使用 %.2lf 显示保留两位小数位的结果\n\
    \    printf(\"Product = %.2lf\", productofTwoNumbers);\n    return 0;\n}\n```\n\
    \n输出：\n```\nEnter two numbers: 2.4\n1.12\nProduct = 2.69\n```\n\n## 检查奇奇数的程序\n\
    \n```c\n#include <stdio.h>\nint main(){\n    int number;\n    printf(\"Enter an\
    \ integer: \");\n    scanf(\"%d\", &number);\n    // 如果数字能被 2 整除则为真\n    if(number\
    \ % 2 == 0)\n        printf(\"%d is even.\", number);\n    else\n        printf(\"\
    %d is odd.\", number);\n    return 0;\n}\n```\n\n输出：\n```\nEnter an integer: -7\n\
    -7 is odd.\n```\n\n## 打印 ASCII 值程序\n\n```c\n#include <stdio.h>\nint main(){\n\
    \    char c;\n    printf(\"Enter a character: \");\n    // 从用户处读取字符输入\n    scanf(\"\
    %c\", &c); \n    // %d 显示字符的整数值\n    // %c 显示实际字符\n    printf(\"ASCII value of\
    \ %c = %d\", c, c);\n    return 0;\n}\n```\n\n输出：\n```\nEnter a character: G\n\
    ASCII value of G = 71\n```\n\n## 质数程序\n\n```c\n#include <stdio.h>\nint main(){\n\
    \    int n, i, flag = 0;\n    printf(\"Enter a positive integer: \");\n    scanf(\"\
    %d\",&n);\n    for(i=2; i<=n/2; ++i)\n    {\n        // 非质数的条件\n        if(n%i==0)\n\
    \        {\n            flag=1;\n            break;\n        }\n    }\n    if\
    \ (flag==0)\n        printf(\"%d is a prime number.\",n);\n    else\n        printf(\"\
    %d is not a prime number.\",n);\n    return 0;\n}\n```\n\n输出：\n```\nEnter a positive\
    \ integer: 29\n29 is a prime number.\n```\n\n## 示例：闰年程序\n\n```c\n#include <stdio.h>\n\
    int main(){\n    int year;\n    printf(\"Enter a year: \");\n    scanf(\"%d\"\
    ,&year);\n    if(year%4 == 0)\n    {\n        if( year%100 == 0)\n        {\n\
    \            // 年能被 400 整除，因此该年份是闰年\n            if ( year%400 == 0)\n       \
    \         printf(\"%d is a leap year.\", year);\n            else\n          \
    \      printf(\"%d is not a leap year.\", year);\n        }\n        else\n  \
    \          printf(\"%d is a leap year.\", year );\n    }\n    else\n        printf(\"\
    %d is not a leap year.\", year);\n    return 0;\n}\n```\n\n输出 1：\n```\nEnter a\
    \ year: 1900\n1900 is not a leap year.\n```\n\n输出 2：\n```\nEnter a year: 2012\n\
    2012 is a leap year.\n```\n\n"
