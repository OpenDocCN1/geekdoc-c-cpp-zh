    \ |\n| `? :` | 条件表达式。 | 如果条件为真 ? 取值 X : 否则取出 Y |\n\n## C 中的运算符优先级\n\n运算符优先级决定了表达式中项的分组，并决定了表达式如何求值。某些运算符的优先级高于其他运算符；例如，乘法运算符的优先级高于加法运算符。\n\
