- fmt: "\n![](cover.jpeg)\n\n### AUTHOR: MURTUZA CHAWALA\n\n![](images/00002.jpeg)\
    \ ![](images/00001.jpeg)\n\n# PROGRAMMING IN C\n\n## PREFACE\n\nAs you know that\
    \ we live in a world of computers. Knowing how to use a computer is not enough,\
    \ as the actual interaction with computers happens with programming. This book\
    \ will make you a programmer by teaching you programming in `c` language which\
    \ is one of the oldest, basic and most preferred programming language in one day.\n\
    \nThis book is customized for beginners (no knowledge in programming concepts).\n\
    \nGO AHEAD WITH PATIENCE AND BE A PROGRAMMER\n- MURTUZA CHAWALA\n\n## CONTENTS\n\
    1. INTRODUCTION\n2. INPUT/OUTPUT OPERATIONS\n3. DECISION MAKING AND LOOPING\n\
    4. FUNCTIONS\n5. POINTERS\n6. ARRAYS\n7. STRINGS\n8. USER DEFINED DATA TYPE\n\
    9. C PROGRAMS\n\n## Introduction\n\n`C` is a general purpose programming language\
    \ which was created by `Denis Ritchie` at `At’t bell laboratory` in 1972 in USA.\n\
    \n`C` is one of the most earliest, popular, powerful and easiest programming language.\n\
    \nThe computer(digital system) cannot understand normal English language, it only\
    \ understands machine language(binary code) that is (`1s` and `0s`). thus `c`\
    \ is used to tell the computer what exactly is to be performed.\n\nAll software,\
    \ application are written in some programming language(`C`, `C++`, `Java`) etc.\n\
    \nThe `Linux`(`Unix`) operating system was totally written on `c` language.\n\n\
    `C` is also used to make compilers, kernels of an OS(operating system).\n\n`C`\
    \ is a programming language, whatever task we carry out on our mobiles, laptops\
    \ etc is actually done through programming(which is inbuilt) {unknown to end users}.\n\
    \nEg:- whenever a button is pressed its equivalent code is generated, that generated\
    \ code is then compiled by a compiler.\n\n`Compiler` (transforms programming code\
    \ into binary code(`1s,0s`)) this binary code is sent to the `CPU` and data processed\
    \ there(in binary), it is sent back from the `CPU` to the monitor and binary code\
    \ is again converted to output form(audio, decimal, photo etc).\n\nThis is the\
    \ working of a programming language.\n\n### Q) Benefits of c?\n\nA)\n1) `c` is\
    \ one of the basic and easiest programming language ie it the first step towards\
    \ becoming a programmer.\n2) `c` is machine independent ie `[(code)]` which can\
    \ be run on any computer.\n3) as it is a structured and procedure oriented language,\
    \ it gives step by step knowledge.\n4) Many operation can be performed using `c`,\
    \ also it is flexible(different methods to solve one problem).\n5) It has high\
    \ level language(`java`) features along with low level language features.\n\n\
    ## Need to learn programming\n\nWriting the perfect code isn't enough as it is\
    \ in English language which is not understood by the computer, thus we need to\
    \ write the codes in an application which will facilitate translation of code\
    \ into binary.\n\nCompilers are available online (`turbo c`).\n\nIts suggested\
    \ that you download the compiler and execute your code concurrently with this\
    \ book.\n\n## C program\n\n### Q) C program to print hello world?\n\nA)\n```c\n\
    #include<stdio.h>\nVoid main()\n{\n    Printf(“hello world”);\n}\n```\n\n## C\
    \ concepts (explanation)\n\n1. `#include` is a preprocessor directive(to be studied\
    \ later). `<stdio.h>` it is a header file which will allow you to perform some\
    \ in built functions(`printf`).\n2. `void main()`: Every `c` program starts with\
    \ `main()`. `void` means that the function `main` does not return any value.\n\
    3. `printf`: This is an inbuilt function from header file `<stdio.h>` which will\
    \ print anything which is written inside print statement.\n4. `;`: This (semicolon)\
    \ is used to denote end of line. each statement in `main()` function [barring\
    \ few like loops], which have a `;` at the end.\n\n**NOTE:**\nEvery `c` program\
    \ will have header file `#include<stdio.h>` compulsorily as without that `printf`(printing\
    \ output) and `scanf`(taking input) functions cannot be performed.\n`Main()` can\
    \ be written as `void main()` or `int main()` and then `return 0`(null) at end.\n\
    \n**Algorithm**: Actual logic of program without syntax.\n\n## BEFORE STARTING\
    \ WITH PROGRAMMING WE WILL FIRST GO THROUGH ALL BASIC CONCEPTS IN C\n\n### 1)\
    \ Variables:\nThey are identifiers, a symbolic name given to some value.\nEg:-\
    \ `int a;`\nHere variable is `a` which is an integer(number) and which may store\
    \ some value.\n\n### 2) Constant:\nIt is also an identifier.\nThe value of constant\
    \ is fixed(unlike variable) and cannot be changed during programming.\nEg:- `int\
    \ a=5;`\nHere `a` is a constant holding value `5`.\n\n### 3) Keywords\nThese are\
    \ reserved words used in programming and cannot be used as a variable or constant\
    \ EG:- `int`, `char`(datatypes), `void`, `for`, `while` etc.\n\n### 4) Data types\n\
    They are keywords. They are used for assigning a type to a variable.\nThe basic\
    \ data types:\n1. `int`: It specifies that the variable associated with it holds\
    \ a number.\nEg:- `int a;`\nIt means `a` will be holding some number.\n\n**NOTE:-\
    \ FORMAT SPECIFIER**\nIf we want to print some integer value as we cannot directly\
    \ write variable name in `printf` statement, we use `%d` in `\" \"` and then ,\
    \ write the variable name.\nEg:-\n```c\nmain()\n{\n    int a=5;\n    Printf(\"\
    %d\",a)\n}\n```\nThus the compiler will know that it has to print an integer (`a`)\
    \ [when `%d` used].\n\n2. `char`: it specifies that the variable associated with\
    \ it holds a single character.\nEg:- `char a;`\nIt means `a` will be holding some\
    \ character.\nFORMAT SPECIFIER: `%c`\n\n3. `float`: it specifies that the variable\
    \ associated with it holds a floating value (in decimals). Eg:- `float a;`\nA\
    \ will be holding some value.\nFORMAT SPECIFIER: `%f`\n\n4. `void`: It tells that\
    \ the variable does not hold any value.\n\n**ARE OTHER DATA TYPES TOO**\n- `Long\
    \ int` (4 bytes) `%ld` [larger number]\n- `Unsigned int` (2 bytes) `%u` [positive\
    \ number]\n- `Double` (8 bytes) `%lf` [large float value]\n- `Long double` (16\
    \ bytes) `%Lf`\nAbove bytes size ie 2,4 etc indicate amount of memory.\n\n**NOTE:-**\n\
    Local Variable: which are declared inside `main()` function.\nGlobal variable:\
    \ which are declared(before) `main()` function.\n\n## OPERATORS\n\nOperators are\
    \ symbols which operate a value or variable. They represent an operation. Eg:\
    \ `+,-,>,<` etc\n\n### Types of operators\nAn operator is a symbol that tells\
    \ the compiler to perform specific mathematical or logical functions. C language\
    \ is rich in built-in operators and provides the following types:\n* Arithmetic\
    \ Operators\n* Relational Operators\n* Logical Operators\n* Bitwise Operators\n\
    * Assignment Operators\n* Misc Operators\n\n### Arithmetic Operators\nThe following\
    \ table shows all the arithmetic operators supported by C. Assume variable `A`\
    \ holds 10 and variable `B` holds 20 then −\n[Show Examples](https://www.tutorialspoint.com/cprogramming/c_arithmetic_operators.htm)\n\
    \n| Operator | Description | Example |\n| :--- | :--- | :--- |\n| + | Adds two\
    \ operands. | A + B = 30 |\n| - | Subtracts second operand from the first. | A\
    \ − B = -10 |\n| * | Multiplies both operands. | A * B = 200 |\n| / | Divides\
    \ numerator by de-numerator. | B / A = 2 |\n| % | Modulus Operator and remainder\
    \ of after an integer division. | B % A = 0 |\n| ++ | Increment operator increases\
    \ the integer value by one. | A++ = 11 |\n| -- | Decrement operator decreases\
    \ the integer value by one. | A-- = 9 |\n\n### Relational Operators\nThe following\
    \ table shows all the relational operators supported by C. Assume variable `A`\
    \ holds 10 and variable `B` holds 20 then\n[Show Examples](https://www.tutorialspoint.com/cprogramming/c_relational_operators.htm)\n\
    \n| Operator | Description | Example |\n| :--- | :--- | :--- |\n| == | Checks\
    \ if the values of two operands are equal or not. If yes, then the condition becomes\
    \ true. | (A == B) is not true. |\n| != | Checks if the values of two operands\
    \ are equal or not. If the values are not equal, then the condition becomes true.\
    \ | (A != B) is true. |\n"
