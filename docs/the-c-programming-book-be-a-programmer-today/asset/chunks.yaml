    \nThis is a simple jump statement which terminates program completely if statement\
    \ is called.\n\nIf exit is used control does not go ahead [till getch()] and directly\
    \ stops compiling.\n\nSyntax:-exit();\n\nNOTE:- unlike conditional(if..,,)\n\n\
    And looping (for,..) statements, jump statements are used only for reference and\
    \ for small tasks and jump statements work on conditional and looping statement.\n\
    \nChapter 5:\n\n    FUNCTIONS\n\nA number of statements grouped into one logical\
    \ unit is called function\n\nAs mentioned earlier there are two types of types\n\
    \n1)Inbuilt function:\n\nwhose code need not be written,(who come under some header\
    \ file) eg:- printf(<stdio.h>)\n\n2)User defined functions:\n\nThese are set of\
    \ statements that are defined by user to achieve some specific tasks.\n\nFunctions\
    \ are set of instruction in a logical sequence which performs specified task\n\
    \nAdvantages of function:\n\n1)Easy and simple to use.\n\n2)Function divides a\
    \ large block of code into small parts which can be easily understood.\n\n3)Debugging(removing\
    \ errors) becomes easier.\n\n4)Useful in case of large problems.\n\nHow to use\
    \ a function\n\nThere are three parts while using a function .\n\n1) Function\
    \ declaration\n\n2) Function call\n\n3) Function definition\n\n1) Function declaration\n\
    \nIf any user defined function has to used,it has to be declared first[before\
    \ main() is better]\n\nSyntax:-\n\ndatatype function_name(parameter)\n\nEg:- int\
    \ sum(int a,int b)\n\nNOTE:-  HERE DATAYPE MEANS WHAT VALUE FUNCTION WILL BE RECEIVING"
