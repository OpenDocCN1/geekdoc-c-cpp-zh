  trans: "\n\n`int puts(const char *s)` 函数将字符串 's' 及其末尾的一个换行符写入 `stdout`。\n\n```c\n\
    #include <stdio.h>\nint main() {\n    char str[100];\n    printf(\"Enter a value\
    \ :\");\n    gets(str);\n    printf(\"\\nYou entered: \");\n    puts(str);\n \
    \   return 0;\n}\n```\n\n当上述代码编译并执行时，它会等待你输入文本。当你输入文本并按回车键后，程序将继续运行并读取整行直到结束，并显示如下\
    \ −\n\n`$./a.outEnter a value : this is testYou entered: this is test`\n\n# 第\
    \ 3 章：决策\n\n决策语句是 C 语言中最基础的概念之一。通过决策语句可以执行各种程序（任务）。这些语句可以帮助我们检查多个条件（可能性）并打印出所需的条件。它们也被称为选择语句或条件语句。\n\
    \n##  语句\n\n### 1) If 语句\n它是 C 语言中一种条件语句，用于检查条件或控制语句的执行。它非常容易使用。\n\n**语法**\n```c\n\
    If(condition)\n{\n    Statements\n}\n```\n在上述语法中，首先检查条件；如果为真，则程序控制流进入花括号并执行语句块。如果条件为假，则不执行语句。\n\
    \n**注意：**\n`IF` 语句末尾不需要加分号。\n\n**用例：**\n```c\nInt a =5;\nIf(a==5) // 无加分号\n{\n\
    \    Printf(\"condition is true\");\n}\n```\n**输出：**\nCondition is true.\n\n###\
    \ 2) if-else 语句\n该语句也非常有用，与 `if` 语句不同，它可以检查两个条件。\n\n**语法：**\n```c\nIf(condition)\n\
    {\n    Statement(true);\n}\nelse\n{\n    Statement(false);\n}\n```\n**用例：**\n\
    ```c\nInt a =4;\nIf(a==3)\n{\n    Printf(\"condition is true\");\n}\nElse\n{\n\
    \    Printf(\"condition is false\");\n}\n```\n**输出：**\nCondition is false.\n\n\
    嵌套 if 语句\n嵌套 if-else 语句\n\n### 3) Switch 语句\nSwitch 语句是一种多重决策语句。当使用 `if-else`\
    \ 条件检查多个条件时，程序的复杂性会增加。因此，为了解决这个问题，C 提供了 `switch` 语句。它用于高效地检查多个条件。\n\n![switch_statement](img/00003.jpeg)\n\
    \n**语法：**\n```c\nSwitch(expression)\n{\n    Case 1:\n        Statements;\n   \
    \     Break;\n    Case 2:Statements;\n        Break;\n    Case 3:Statements;\n\
    \        Break;\n    Case n:Statements;\n        Break;\n}\n```\n\n```c\n#include\
    \ <stdio.h>\nint main () {\n    /* 局部变量定义 */\n    char grade = 'B';\n    switch(grade)\
    \ {\n        case 'A':\n            printf(\"Excellent!\\n\");\n            break;\n\
    \        case 'B':\n        case 'C':\n            printf(\"Well done\\n\");\n\
    \            break;\n        case 'D':\n            printf(\"You passed\\n\");\n\
    \            break;\n        case 'F':\n            printf(\"Better try again\\\
    n\");\n            break;\n        default:\n            printf(\"Invalid grade\\\
    n\");\n    }\n    printf(\"Your grade is %c\\n\", grade);\n    return 0;\n}\n\
    ```\n当上述代码编译并执行时，它产生以下结果 −\n\nWell done\nYour grade is B\n\n注意：case 标签应该是一个整数或字符。`switch`\
    \ 中的每条语句都必须有一个 `break` 来退出 `case`，否则在执行完正确的 case 后，控制流将进入到下一个 case 并执行它；还有其他其他的条件语句，如嵌套\
    \ if..else、嵌套 switch 等。\n\n# 第 4 章：循环\n\n循环也是编程中的重要概念之一。循环被用于反复执行一组语句。循环内部的数据会一直执行，直到条件为假。它被用于编写条件。循环的执行可以通过以下方式完成：\n\
    1. 使用终止条件启动循环\n2. 初始化变量并启动循环\n3. 循环内部语句的执行\n4. 变量的递增或递减（直到满足条件）\n\n## 循环语句的类型\n\
    \n### 1) 入控制循环\n也称为预测试循环。在这里，首先检查条件，然后评估内部的语句。`While` 和 `for` 是入控制循环，并被广泛使用。\n\
    \n#### A) while 循环\n是一种入控制循环，用于重复执行语句块直到条件变为真。\n\n**语法：**\n```c\nWhile(condition)\n\
    {\n    Statement;\n    Increment/decrement;\n}\n```\n**算法：**\n**用例：**\n```c\n\
    A=3,b=5;\nWhile(a<b)\n    Print a;\n    A++;\n```\n输出：3 4\n\n#### B) For 循环\n\
    它比 `while` 循环更高效且有用。`for` 循环最重要的操作之一是可以同时采取三个操作，即：\nA) 变量初始化\nB) 条件检查\nC) 变量的递增/递减。\n\
    \n**语法：**\n```c\nFor(initialization;condition;incr/decr)\n{\n    Statements;\n\
    }\n```\n**用例：**\n```c\nA=3,i;\nFor(i=1;i<A;i++)\n{\n    Print(i)\n}\n```\n输出：1\
    \ 2\n\n### 2) 出控制循环\n#### A) do-while 循环\n唯一的出控制循环。在这里首先执行语句，然后检查条件。它保证语句至少执行一次。常用于菜单驱动的程序（switch\
    \ case）。\n\n**语法：**\n```c\nDo\n{\n    Statements\n}while(condition);\n```\n\n\
    ## 跳转语句\n这些语句用于将控制流转移到另一个点。\n\n### 1) Goto\n该语句将控制流从一个点转移到另一个点。\n**语法：**\n```c\n\
    Goto label:\n```\n**用例：**\n```c\nN=4;\nFor(i=0;i<N;i++)\n{\n    Print(i);\n  \
    \  If(i==2)\n        Goto here;\n}\nHere:\nprintf(y)\n```\n输出：01\n\n### 2) Break\n\
    它是循环和 switch 语句中非常有用的跳转语句。用于跳出循环或 switch 语句。\n**语法：**\n```c\nBreak;\n```\n\n###\
    \ 3) Continue\n当需要根据条件跳过主体的部分内容时使用。如果条件为真并使用了 `continue` 语句，则控制流将直接回到循环开始。\n**语法：**\n\
    ```c\ncontinue;\n```\n\n### 4) Exit()\n这是一个简单的跳转语句，调用时会完全终止程序。\n**语法：**\n```\n\
    exit();\n```\n\n# 第 5 章：函数\n将一组语句组合在一个逻辑单元中称为函数。如前提到的，有两种类型：\n\n### 1) 内置函数\n\
    代码不需要编写（包含在某些头文件中），例如：`printf(<stdio.h>)`\n\n### 2) 用户定义函数\n这些是用户为了实现某些特定任务而定义的语句集。\n\
    \n**函数的优点：**\n1) 简单易用。\n2) 函数将大代码块划分为易理解的小部分。\n3) 调试（移除错误）变得更容易。\n4) 在处理大型问题时有用。\n\
    \n## 如何使用函数\n使用函数有三个部分：\n1) 函数声明\n2) 函数调用\n3) 函数定义\n\n### 1) 函数声明\n如果要使用任何用户定义函数，必须先进行声明\
    \ [在 `main()` 之前更好]。\n**语法：**\n```c\ndatatype function_name(parameter)\n```\n\
    **用例：** `int sum(int a,int b)`\n**注意：** 这里的数据类型意味着函数将接收的值\n\n"
- fmt: "\nPARAMETER MEANS WHAT VARIABLE(VALUES) THE MAIN PROGRAM WILL BE SENDING .\n\
    \n## 2) Function call\n\nThis statement transfers the control from the `main()`\
    \ part to the actual function outside `main()`.\n{basically calls the function}\n\
    \n**Syntax:**\n`Function_name(parameters)`\n\n**Eg:**\n`sum(a,b)`\n(its ok if\
    \ datatype not used with parameters when calling function)\n\n## 3) Function definition\n\
    \nThis is the main part of the function.\nIt contains all codes that are to be\
    \ performed.\nIt may take zero,one or more inputs and may or may not give back\
    \ some output but performs processing of data.\nIt contains a header which contains\
    \ of the function name(earlier declared) and body which consist of steps.\n\n\
    **Syntax:**\n`Return datatype function_name(parameters)`\n```c\n{\n    Statements/……\n\
    }\n```\n\n**NOTE:** here `return datatype` means value(`int`,`char`) to be returned\
    \ to `main` program.\nIf `return type` is `void` then no value is returned.\n\
    Function declaration and call are used for declare and call of function.\nFunction\
    \ `defintion` is for processing of data, Program.\n\n```c\n#include<stdio.h> \n\
    \nvoid main() \n{ \n      int a,b; \n      clrscr(); \n      printf(\"Enter Two\
    \ Number : \"); \n      scanf(\"%d%d\",&a,&b); \n      sum(a,b); \n      getch();\
    \ \n} \n\n      sum(int x,int y) \n  { \n      int z; \n      z=x+y; \n      printf(\"\
    Sum of Two Number is : %d\",z); \n      return 0; \n} \n```\n\n**Output:**\nEnter\
    \ Two Number : 10 20 \nSum of Two Number is : 30\n\n## FUNCTION Can be called\
    \ in two ways\n\n1) Call by value\n2) Call by reference\n\n### Difference between\
    \ call by value and call by reference\n\n| call by value | call by reference |\
    \ \n| :--- | :--- |\n| In `call by value`, a copy of actual arguments is passed\
    \ to formal arguments of the called function and any change made to the formal\
    \ arguments in the called function have no effect on the values of actual arguments\
    \ in the calling function. | In `call by reference`, the location (address) of\
    \ actual arguments is passed to formal arguments of the called function. This\
    \ means by accessing the addresses of actual arguments we can alter them within\
    \ from the called function. |\n| In `call by value`, actual arguments will remain\
    \ safe, they cannot be modified accidentally. | In `call by reference`, alteration\
    \ to actual arguments is possible within from called function; therefore the code\
    \ must handle arguments carefully else you get unexpected results. |\n\n## Function\
    \ categories\n\n1) Function with no return value and no parameter\n2) Function\
    \ with no return value and a parameter\n3) Function with a return value and a\
    \ no parameter\n4) Function with a return value and a parameter\n\n## Storage\
    \ classes\n\nIt refers to scope of variable and memory allocated to store that\
    \ variable.\nIn other words it tells us what extra features are given to the variable.\n\
    There are 4 storage class.\n\n1) AUTO\n2) REGISTER\n3) STATIC\n4) EXTERNAL\n\n\
    ## The auto Storage Class\n\nThe `auto` storage class is the default storage class\
    \ for all local variables.\n```c\n{\n     int mount;\n     auto  int month;\n\
    }\n```\nThe example above defines two variables with in the same storage class.\
    \ `'auto'` can only be used within functions, i.e., local variables.\n\n## The\
    \ register Storage Class\n\nThe `register` storage class is used to define local\
    \ variables that should be stored in a register instead of RAM. This means that\
    \ the variable has a maximum size equal to the register size (usually one word)\
    \ and can't have the unary `&` operator applied to it (as it does not have a memory\
    \ location).\n```c\n{\n     register  int  miles;\n}\n```\nThe register should\
    \ only be used for variables that require quick access such as counters. It should\
    \ also be noted that defining `'register'` does not mean that the variable will\
    \ be stored in a register. It means that it MIGHT be stored in a register depending\
    \ on hardware and implementation restrictions.\n\n## The static Storage Class\n\
    \nThe `static` storage class instructs the compiler to keep a local variable in\
    \ existence during the life-time of the program instead of creating and destroying\
    \ it each time it comes into and goes out of scope. Therefore, making local variables\
    \ static allows them to maintain their values between function calls.\nThe `static`\
    \ modifier may also be applied to global variables. When this is done, it causes\
    \ that variable's scope to be restricted to the file in which it is declared.\n\
    In C programming, when `static` is used on a class data member, it causes only\
    \ one copy of that member to be shared by all the objects of its class.\n\n##\
    \ The extern Storage Class\n\nThe `extern` storage class is used to declare a\
    \ variable that is visible to all files.\nWhen you use `extern`, it points the\
    \ variable that has been previously defined. The `extern` modifier is most commonly\
    \ used to declare a variable or function.\nThe `extern` storage class is used\
    \ to declare a variable that is visible to all files. `extern` is used to declare\
    \ a variable name. `extern` is used in other files.\n\n## Recursion\n\nIt is a\
    \ programming technique where a function calls itself again and again. While using\
    \ recursion, programmers need to define an exit condition otherwise it will go\
    \ into infinite loop.\nRecursive functions are very useful to solve mathematical\
    \ problems, such as calculating the factorial of a number.\n\n### Example: Factorial\
    \ of a Number Using Recursion\n\n```c\n#include  <stdio.h>\nlong  int multiplyNumbers(int\
    \ n);\n\nint main () {\n    int n;\n    printf(\"Enter a positive integer: \"\
    );\n    scanf(\"%d\", &n);\n    printf(\"Factorial of %d = %ld\", n, multiplyNumbers(n));\n\
    \    return  0;\n}\n\nlong  int multiplyNumbers(int n){\n    if (n >= 1)\n   \
    \     return n*multiplyNumbers(n-1);\n    else\n        return 1;\n}\n```\n\n\
    **Output:**\nEnter a positive integer: 6\nFactorial of 6 = 720\n\nSuppose the\
    \ user entered 6. Initially, `multiplyNumbers()` is called from the `main()` function\
    \ with 6 passed as an argument. In each recursive call, the value of `n` is decreased\
    \ by 1. When the value of `n` is less than 1, there is no recursive call.\n\n\
    ## Chapter 6: Pointers\n\n### INTRODUCTION\n\nPointer is a variable that stores\
    \ memory address of another variable. Pointer enhances dynamic handling of data.\n\
    A `pointer` is a variable whose value is the address of another variable, i.e.,\
    \ direct address of the memory location. Like any variable or constant, you must\
    \ declare a pointer before using it to store any variable address. The general\
    \ form of a pointer variable declaration is:\n`type *var-name;`\nHere, `type`\
    \ is the pointer's base type; it must be a valid C data type and `var-name` is\
    \ the name of the pointer variable. The asterisk `*` used to declare a pointer\
    \ is the same asterisk used for multiplication. However, in this statement the\
    \ asterisk is being used to designate a variable as a pointer.\n\n### How to Use\
    \ Pointers?\n\n```c\n#include  <stdio.h>\nint main () {\n    int var  =  20; /*\
    \ actual variable declaration */\n    int *ip; /* pointer variable declaration\
    \ */\n    ip =  &var; /* store address of var in pointer variable*/\n    printf(\"\
    Address of var variable: %x\\n\",  &var );\n    /* address stored in pointer variable\
    \ */\n    printf(\"Address stored in ip variable: %x\\n\", ip );\n    /* access\
    \ the value using the pointer */\n    printf(\"Value of *ip variable: %d\\n\"\
    ,  *ip );\n    return  0;\n}\n```\n\nWhen the above code is compiled and executed,\
    \ it produces the following result −\nAddress of var variable: bffd8b3c\nAddress\
    \ stored in ip variable: bffd8b3c\nValue of *ip variable: 20\n\nPassing pointer\
    \ to function\n"
