    \ is insufficient, allocation fails and returns NULL pointer.\n\nptr = (int*)\
    \ malloc(100 * sizeof(int));\n\nThis statement will allocate either 200 or 400\
    \ according to size of int 2 or 4 bytes respectively and the pointer points to\
    \ the address of first byte of memory.\n\n## calloc()\n\nThe name calloc stands\
    \ for \"contiguous allocation\".\n\nThe only difference between malloc() and calloc()\
    \ is that, malloc() allocates single block of memory whereas calloc() allocates\
    \ multiple blocks of memory each of same size and sets all bytes to zero.\n\n\
    ### Syntax of calloc()\n\nptr = (cast-type*)calloc(n, element-size);\n\nThis statement\
    \ will allocate contiguous space in memory for an array of n elements. For example:\n\
    \nptr = (float*) calloc(25, sizeof(float));\n\nThis statement allocates contiguous\
    \ space in memory for an array of 25 elements each of size of float, i.e, 4 bytes.\n\
    \n##  free()\n\nDynamically allocated memory created with either calloc() or malloc()\
    \ doesn't get freed on its own. You must explicitly use free() to release the\
    \ space.\n\n### syntax of free()\n\nfree(ptr);\n\nThis statement frees the space\
    \ allocated in the memory pointed by ptr.\n\n## C realloc()\n\nIf the previously\
    \ allocated memory is insufficient or more than required, you can change the previously\
    \ allocated memory size using realloc().\n\n### Syntax of realloc()\n\nptr = realloc(ptr,\
    \ newsize);\n\nHere, ptr is reallocated with size of newsize.\n\nWrite a C program\
    \ to find sum of n elements entered by user. To perform this program, allocate\
    \ memory dynamically using malloc() function.\n\n#include  <stdio.h>#include \
    \ <stdlib.h>\n\nint main(){\n\n int num, i, *ptr, sum = 0;\n\n    printf(\"Enter\
    \ number of elements: \");\n\n    scanf(\"%d\", &num);\n\n    ptr = (int*) malloc(num\
    \ * sizeof(int)); //memory allocated using malloc\n\n if(ptr == NULL)                    \n\
    \n    {\n\n        printf(\"Error! memory not allocated.\");\n\n exit(0);\n\n\
        }\n\n    printf(\"Enter elements of array: \");\n\n for(i = 0; i < num; ++i)\n\
    \n    {\n\n        scanf(\"%d\", ptr + i);\n\n        sum += *(ptr + i);\n\n   \
    \ }\n\n    printf(\"Sum = %d\", sum);\n\n    free(ptr);\n\n return  0;}\n\nChapter\
    \ 7:\n\nArray and String.\n\nArray is a data structure which contains group of\
    \ elements under a single name.\n\nA very useful technique that reduces time and\
    \ helps in looping statements\n\nInstead of declaring individual variables, such\
    \ as number0, number1, ..., and number99, you declare one array variable such\
    \ as numbers and use numbers[0], numbers[1], and ..., numbers[99] to represent\
    \ individual variables. A specific element in an array is accessed by an index.\n\
    \nAll arrays consist of contiguous memory locations. The lowest address corresponds\
    \ to the first element and the highest address to the last element.\n\n![](images/00008.jpeg)\n\
    \nInstead of scanning(accepting) 5 numbers, we can store all the 5 numbers in\
    \ a variable. This technique is called as an array.\n\nDeclaration of array\n\n\
    Int a[5];\n\nIt means that variable a will store 5 numbers ,each element in array\
    \ can be accessed using index . a[0],a[1],a[2] and so on.\n\nType of array\n\n\
    1 dimensional\n\n2 dimensional\n\nMulti dimensional\n\nProgram : Addition of All\
    \ Elements of the Array\n\n| 123456789101112131415161718192021222324252627 | #include<stdio.h>int\
    \  main()  { int  i,  arr[50],  sum,  num; printf(\"\\nEnter no of elements :\"\
    ); scanf(\"%d\", &num); //Reading values into Array printf(\"\\nEnter the values\
    \ :\"); for  (i = 0;  i < num;  i++)      scanf(\"%d\", &arr[i]); //Computation\
    \ of total sum = 0; for  (i = 0;  i < num;  i++)      sum = sum + arr[i]; //Printing\
