  trans: "\n\n![](img/cover.jpeg)\n\n### 作者：MURTUZA CHAWALA\n\n![](img/00002.jpeg)\
    \ ![](img/00001.jpeg)\n\n# C 语言编程\n\n## 前言\n\n如你所知，我们生活在一个计算机世界。仅仅学会如何使用计算机是不够的，因为与计算机的实际交互是通过编程实现的。本书将通过教你\
    \ `c` 语言编程，让你一天成为一名程序员，`c` 是最古老、基础且最受欢迎的编程语言之一。\n\n本书专为初学者定制（无编程概念基础）。\n\n请耐心前行，成为一名程序员\n\
    - MURTUZA CHAWALA\n\n## 目录\n1. 引言\n2. 输入/输出操作\n3. 决策与循环\n4. 函数\n5. 指针\n6. 数组\n\
    7. 字符串\n8. 自定义数据类型\n9. C 程序\n\n## 引言\n\n`C` 是一种通用编程语言，由 `Denis Ritchie` 于 1972\
    \ 年在美国的 `At’t bell laboratory` 创建。\n\n`C` 是最早、最流行、最强大且最容易的编程语言之一。\n\n计算机（数字系统）无法理解普通的英语，它只理解机器语言（二进制代码），即\
    \ (`1s` 和 `0s`）。因此，`c` 被用来告诉计算机具体要执行什么。\n\n所有的软件、应用程序都是用某种编程语言（`C`、`C++`、`Java`\
    \ 等）编写的。\n\n`Linux`(`Unix`)操作系统完全是用 `c` 语言编写的。\n\n`C` 也用于制作编译器、操作系统的内核。\n\n`C`\
    \ 是一种编程语言，我们在手机、笔记本电脑等上的任何任务实际上都是通过编程（内置的，终端用户感知）完成的。\n\n例如：每当按下按钮时，就会生成相应的代码，生成的代码随后由编译器进行编译。\n\
    \n`Compiler`（将编程代码转换为二进制代码（`1s,0s`））——该二进制代码被发送到 `CPU` 并在那里进行处理（二进制形式），然后从 `CPU`\
    \ 发回显示器，二进制代码再次转换为输出形式（音频、十进制、照片等）。\n\n这就是编程语言的工作原理。\n\n### Q) c 的优点是什么？\n\nA)\n\
    1) `c` 是最基础且最简单的编程语言之一，即它是成为程序员的第一步。\n2) `c` 是机器无关的，即 `[(code)]` 可以在任何计算机上运行。\n\
    3) 作为一种结构化和过程化的语言，它提供了层层递进的知识。\n4) 使用 `c` 可以执行许多操作，而且它非常灵活（解决同一个问题的不同方法）。\n5)\
    \ 它既具有高级语言（`java`）的特征，又具有底层语言的特征。\n\n## 需要学习编程\n\n编写完美的代码是不够的，因为它是英语编写的，计算机无法理解，因此我们需要在应用程序中编写代码，以便于代码到二进制的翻译。\n\
    \n在线可以获取编译器（`turbo c`）。\n\n建议你下载编译器，并在阅读本书的同时执行你的代码。\n\n## C 程序\n\n### Q) 打印 hello\
    \ world 的 C 程序？\n\nA)\n```c\n#include<stdio.h>\nVoid main()\n{\n    Printf“hello\
    \ world”);\n}\n```\n\n## C 概念（解释）\n\n1. `#include` 是一个预处理指令（稍后学习）。`<stdio.h>`\
    \ 是一个头文件，允许你执行一些内置函数（`printf`）。\n2. `void main()`：每个 `c` 程序都从 `main()` 开始。`void`\
    \ 表示 `main` 函数不返回任何值。\n3. `printf`：这是来自头文件 `<stdio.h>` 的内置函数，用于打印打印语句内部编写的任何内容。\n\
    4. `;`：这（分号）用于表示行的结束。`main()` 函数中的每条语句[除循环等少数例外外]，末尾都有一个 `;`。\n\n**注意：**\n每个 `c`\
    \ 程序都必须包含头文件 `#include<stdio.h>`，因为没有它就无法执行 `printf`（输出）和 `scanf`（输入）函数。\n`Main()`\
    \ 可以写为 `void main()` 或 `int main()`，然后在最后 `return 0`（空）。\n\n**算法**：不包含语法的程序实际逻辑。\n\
    \n## 在开始编程之前，我们将首先学习 C 语言中的所有基础概念\n\n### 1) 变量：\n它们是标识符，是赋值给某些值的符号名称。\n例如：`int\
    \ a;`\n这里变量是 `a`，它是一个整数（数字），可以存储某些值。\n\n### 2) 常量：\n它也是一种标识符。\n常量的值是固定的（与变量不同），在编程过程中不能更改。\n\
    例如：`int a=5;`\n这里 `a` 是一个持有值 `5` 的常量。\n\n### 3) 关键字\n这些是编程中保留字，不能用作变量或常量，例如：`int`、`char`（数据类型）、void`、`for`、`while`\
    \ 等。\n\n### 4) 数据类型\n它们是关键字。用于为变量分配类型。\n基本数据类型：\n1. `int`：它指定与其关联的变量持有数字。\n例如：`int\
    \ a;`\n这意味着 `a` 将持有某些数字。\n\n**注意:-格式说明符**\n如果我们想打印某些整数值，由于我们不能直接在 `printf` 语句中写变量名，我们使用\
    \ `%d`。\n```c\nmain()\n{\n    int a=5;\n    printf(\"%d\",a)\n}\n```\n因此 `%d`\
    \ 用于打印整数值。\n\n2. `char`：它指定与其关联的变量持有单个字符。\n例如：`char a;`\n这意味着 `a` 将持有某些字符。\n格式说明符：%c。\n\
    \n3. `float`：它指定与其关联的变量持有浮点值（小数）。\n例如：`float a;`\n`a` 将持有某些值。\n格式说明符：%f。\n\n4.\
    \ `void`：它告诉不持有任何值。\n\n**其他数据类型**\n- `Long int` (4 字节) `%ld`\n- `Unsigned int`\
    \ (2 字节) `%u`\n- `Double` (8 字节) `%lf`\n- `Long double` (16 字节) `%Lf`\n上述大小：\n\
    局部变量：在 `main()` 函数内部定义。\n全局变量：在 `main()` 函数外部定义。\n\n## 运算符\n\n运算符是操作值或变量的符号。它们表示一种操作。例如：`+,->,<`\n\
    \n### 运算符类型\n运算符是告诉编译器执行特定数学或逻辑函数的符号。C 语言拥有丰富的运算符，并提供以下类型：\n* 算术运算符\n* 关系运算符\n\
    * 逻辑运算符\n* 位运算符\n* 赋值运算符\n* 杂项运算符\n\n### 算术运算符\n下表显示了 C 支持的所有算术运算符。假设变量 `A` 持有\
    \ 10，变量 `B` 持有 20，则\n[示例](https://www.tutorialspoint.com/cprogramming/c_arithmetic_operators.htm)\n\
    \n| 运算符 | 描述 | 示例 |\n| :--- | :--- | :--- |\n| + | 两个操作数相加 | A + B = 30 |\n| -\
    \ | 第一个操作数减去第二个 | − B = -10 |\n| * | 两个操作数相乘 | A * B = 200 |\n| / | 被除数除以除数 |\
    \ B / A = 2 |\n| % | 取模运算符和整数除法的余数 | B % A = 0 |\n| ++ | 递增运算符整数值加一 | A++ = 11\
    \ |\n| -- | 递减运算符值减一 | A-- = 9 |\n\n### 关系运算符\n下表显示了 C 支持的所有关系运算符。假设变量 `A` 持有\
    \ 10，变量 `B` 持有 20，则\n[示例](https://www.tutorialspoint.com/cprogramming/c_relational_operators.htm)\n\
    \n| 运算符 | 描述 | 示例 |\n| :--- | :--- | :--- |\n| == | 检查两个操作数的值是否相等。如果是，则条件为真 |\
    \ (A == B) 不为 |\n| != | 检查两个操作数的值是否相等。如果值不相等，则条件为真 | (A != B) 为真 |\n\n"
- fmt: "\n| Operator | Description | Example |\n| :--- | :--- | :--- |\n| `>` | Checks\
    \ if the value of left operand is greater than the value of right operand. If\
    \ yes, then the condition becomes true. | `(A > B)` is not true. |\n| `<` | Checks\
    \ if the value of left operand is less than the value of right operand. If yes,\
    \ then the condition becomes true. | `(A < B)` is true. |\n| `>=` | Checks if\
    \ the value of left operand is greater than or equal to the value of right operand.\
    \ If yes, then the condition becomes true. | `(A >= B)` is not true. |\n| `<=`\
    \ | Checks if the value of left operand is less than or equal to the value of\
    \ right operand. If yes, then the condition becomes true. | `(A <= B)` is true.\
    \ |\n\n## Logical Operators\n\nFollowing table shows all the logical operators\
    \ supported by C language. Assume variable `A` holds 1 and variable `B` holds\
    \ 0, then −\n\n[Show Examples](https://www.tutorialspoint.com/cprogramming/c_logical_operators.htm)\n\
    \n| Operator | Description | Example |\n| :--- | :--- | :--- |\n| `&&` | Called\
    \ Logical AND operator. If both the operands are non-zero, then the condition\
    \ becomes true. | `(A && B)` is false. |\n| `||` | Called Logical OR Operator.\
    \ If any of the two operands is non-zero, then the condition becomes true. | `(A\
    \ || B)` is true. |\n| `!` | Called Logical NOT Operator. It is used to reverse\
    \ the logical state of its operand. If a condition is true, then Logical NOT operator\
    \ will make it false. | `!(A && B)` is true. |\n\n## Assignment Operators\n\n\
    The following table lists the assignment operators supported by the C language\
    \ −\n\n[Show Examples](https://www.tutorialspoint.com/cprogramming/c_assignment_operators.htm)\n\
    \n| Operator | Description | Example |\n| :--- | :--- | :--- |\n| `=` | Simple\
    \ assignment operator. Assigns values from right side operands to left side operand\
    \ | `C = A + B` will assign the value of `A + B` to `C` |\n| `+=` | Add AND assignment\
    \ operator. It adds the right operand to the left operand and assign the result\
    \ to the left operand. | `C += A` is equivalent to `C = C + A` |\n| `-=` | Subtract\
    \ AND assignment operator. It subtracts the right operand from the left operand\
    \ and assigns the result to the left operand. | `C -= A` is equivalent to `C =\
    \ C - A` |\n| `*=` | Multiply AND assignment operator. It multiplies the right\
    \ operand with the left operand and assigns the result to the left operand. |\
    \ `C *= A` is equivalent to `C = C * A` |\n| `/=` | Divide AND assignment operator.\
    \ It divides the left operand with the right operand and assigns the result to\
    \ the left operand. | `C /= A` is equivalent to `C = C / A` |\n| `%=` | Modulus\
    \ AND assignment operator. It takes modulus using two operands and assigns the\
    \ result to the left operand. | `C %= A` is equivalent to `C = C % A` |\n| `<<=`\
    \ | Left shift AND assignment operator. | `C <<= 2` is same as `C = C << 2` |\n\
    | `>>=` | Right shift AND assignment operator. | `C >>= 2` is same as `C = C >>\
    \ 2` |\n| `&=` | Bitwise AND assignment operator. | `C &= 2` is same as `C = C\
    \ & 2` |\n| `^=` | Bitwise exclusive OR and assignment operator. | `C ^= 2` is\
    \ same as `C = C ^ 2` |\n| `|=` | Bitwise inclusive OR and assignment operator.\
    \ | `C |= 2` is same as `C = C | 2` |\n\n## Other Operators ↦ sizeof & ternary\n\
    \nBesides the operators discussed above, there are a few other important operators\
    \ including `sizeof` and `? :` supported by the C Language.\n\n[Show Examples](https://www.tutorialspoint.com/cprogramming/c_sizeof_operator.htm)\n\
    \n| Operator | Description | Example |\n| :--- | :--- | :--- |\n| `sizeof()` |\
    \ Returns the size of a variable. | `sizeof(a)`, where `a` is integer, will return\
    \ 4. |\n| `&` | Returns the address of a variable. | `&a` returns the actual address\
    \ of the variable. |\n| `*` | Pointer to a variable. | `*a` |\n| `? :` | Conditional\
    \ Expression. | If Condition is true ? then value X : otherwise value Y |\n\n\
    ## Operators Precedence in C\n\nOperator precedence determines the grouping of\
    \ terms in an expression and decides how an expression is evaluated. Certain operators\
    \ have higher precedence than others; for example, the multiplication operator\
    \ has a higher precedence than the addition operator.\n\nFor example, `x = 7 +\
    \ 3 * 2;` here, `x` is assigned 13, not 20 because operator `*` has a higher precedence\
    \ than `+`, so it first gets multiplied with `3*2` and then adds into 7.\n\n###\
    \ OPERANDS\n\nThey are the variable(or constant) on which operation are performed\n\
    \nEg:- `a+b;`\n\n`a` and `b` are operands and `+` is an operator.\n\n### Expression\n\
    \nAn expression is An combination of operators,operands\n\nEg: `a*b+c;`\n\nIs\
    \ an expression\n\n### Simple c program to add two numbers\n\n```c\n#include<stdio.h>\n\
    \nvoid main()\n{\n    int a=10,b=20,c;\n    c=a+b;\n    printf(\"%d\",c);\n}\n\
    ```\n\nNOTE:- `//` means comment which means that line of code will not get executed\
    \ [used for self understanding purposes]\n\n### Explanation\n\n```c\n#include<stdio.h>\n\
    // [ to include header file stdio.h which will allow us to use the printf statement.]\n\
    void main()\n//[function which contains source code and returns nothing]\n{\n\
    // [to start source code]\n    int a=20,b=10,c;\n//[ a and b are integer constant\
    \ having values 20,10\n// c is an integer variable whose value is undefined .]\n\
    \    c=a+b;\n//[operation now c=30]\n    printf(\"%d\",c);\n}\n//[\nPrint “%d”,\
    \ that is an integer c]\n```\n\nOUTPUT:\n30.\n\n## CH :- 2: INPUT/OUTPUT OPERATION\n\
    \nEvery computer has one primary goal that is to take data as input ,process it\
    \ and give the required output to user.\n\nSimilarly if we want to execute a c\
    \ program we need to input some values,give some processing information(add two\
    \ numbers) and then write an output statement.\n\nI/O operations are broadly classified\
    \ in two groups:-\n\n1) **Console I/O function**:\nFunction to receive input from\
    \ keyboard and print output.(eg:- `printf`, `scanf`)\n\n2) **File I/O function**:\n\
    Function to perform I/O operation on floppy or disk\n\nNOTE:- MAJORITY of C I/O\
    \ functions are performed by console(`printf`, `scanf`) function.\n\n### CONSOLE\
    \ BASED I/O\n\n#### 1) `printf()` function\n\nAs mentioned earlier `printf` is\
    \ an inbuilt function (whose code we not have to write) under the header file\
    \ `<stdio.h>`\n\nThe work of `printf` function is to print output during execution.\n\
    Eg:- `printf(\"hello\");` will print\n\nIf we want to print value of some variable\
    \ then we use format specifier of that variable (data type)\nEg:- `a=4;`\n`printf(\"\
    %d\",a);`\n\nOutput: 4\n\n#### 2) `scanf()` function\n\nTo read(accept) data from\
    \ user we use `scanf()` function.\n\nIf we want to store value of a variable say\
    \ `x` as 4 then we use `scanf` statement which will accept `x` as 4\nIn `scanf()`\
    \ we use format specifier of variable and later `&` operator which will store\
    \ `x` in the memory.\nEG:-\n```c\nint a;\nprintf(\"enter value for a\");\nscanf(\"\
    %d\",&a);\n```\n\n### Q) c program to accept two integers and add them\n\n```c\n\
    #include<stdio.h>\nvoid main()\n{\n    int a,b,c;\n    printf(\"enter number 1\"\
    );\n    scanf(\"%d\",&a);\n    printf(\"enter number 2\");\n    scanf(\"%d\",&b);\n\
    \    c=a+b;\n    printf(\"%d\",c);\n}\n```\n\n## Other I/o functions\n\n### The\
    \ `getchar()` and `putchar()` Functions\n\nThe `int getchar(void)` function reads\
    \ the next available character from the screen and returns it as an integer. This\
    \ function reads only single character at a time. You can use this method in the\
    \ loop in case you want to read more than one character from the screen.\n\nThe\
    \ `int putchar(int c)` function puts the passed character on the screen and returns\
    \ the same character. This function puts only single character at a time. You\
    \ can use this method in the loop in case you want to display more than one character\
    \ on the screen. Check the following example −\n\n```c\n#include <stdio.h>\nint\
    \ main() {\n    int c;\n    printf(\"Enter a value :\");\n    c = getchar();\n\
    \    printf(\"\\nYou entered: \");\n    putchar( c );\n    return 0;\n}\n```\n\
    \nWhen the above code is compiled and executed, it waits for you to input some\
    \ text. When you enter a text and press enter, then the program proceeds and reads\
    \ only a single character and displays it as follows −\n\n```\n$./a.out\nEnter\
    \ a value : this is test\nYou entered: t\n```\n\n## The `gets()` and `puts()`\
    \ Functions\n\nThe `char *gets(char *s)` function reads a line from `stdin` into\
    \ the buffer pointed to by `s` until either a terminating newline or EOF (End\
    \ of File).\n"
