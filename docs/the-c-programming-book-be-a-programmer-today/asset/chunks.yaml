    Enter elements of array: \");\n  for(i = 0; i < num; ++i)\n  {\n    scanf(\"%d\"\
    , ptr + i);\n    sum += *(ptr + i);\n  }\n  printf(\"Sum = %d\", sum);\n  free(ptr);\n\
    \  return 0;\n}\n```\n\n## Program: Find Smallest Element in Array\n\nThis program\
    \ iterates through an array to find the minimum value.\n\n```c\n#include <stdio.h>\n\
    int main()  {\n  int a[30], i, num, smallest;\n  printf(\"\\nEnter no of elements\
    \ :\");\n  scanf(\"%d\", &num);\n  //Read n elements into array\n  for(i = 0;\
    \ i < num;  i++)\n  {\n    scanf(\"%d\", &a[i]);\n  }\n  //Consider first element\
    \ as smallest\n  smallest = a[0];\n  for(i = 0; i < num;  i++)\n  {\n    if  (a[i]\
    \ < smallest)\n    {\n      smallest = a[i];\n    }\n  }\n// Print out the Result\n\
    \  printf(\"\\nSmallest Element : %d\", smallest);\n  return 0;\n}\n```\n\n##\
    \ Program: Search an element in Array\n\nThis program uses a while loop to search\
    \ for a specific element within the array.\n\n```c\n#include <stdio.h>\nint main()\
    \  {\n  int a[30], ele, num, i;\n  printf(\"\\nEnter no of elements :\");\n  scanf(\"\
    %d\", &num);\n  //Read n elements into array\n  for(i = 0; i < num;  i++)\n  {\n\
    \    scanf(\"%d\", &a[i]);\n  }\n  //Read the element to be searched\n  printf(\"\
    \\nEnter the elements to be searched :\");\n  scanf(\"%d\", &ele);\n//Search starts\
    \ from the zeroth location\n  i = 0;\n  while  (i < num && ele != a[i])\n  {\n\
    \    i++;\n  }\n//If i < num then Match found\n  if  (i < num)\n  {\n    printf(\"\
    Number found at the location = %d\",  i + 1);\n  }\n  else\n  {\n    printf(\"\
    Number not found\");\n  }\n  return 0;\n}\n```\n\n# STRINGS\n\nStrings are basically\
    \ an array of characters.\n"
