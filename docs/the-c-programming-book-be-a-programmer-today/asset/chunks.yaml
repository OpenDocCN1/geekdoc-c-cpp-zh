  trans: "\n\n参数意味着主程序将要发送的变量（值）。\n\n## 2) 函数调用\n\n此语句将控制权从 `main()` 部分转移到 `main()`\
    \ 外部的实际函数。\n{基本上是调用函数}\n\n**语法：**\n`Function_name(parameters)`\n\n**示例：**\n`sum(a,b)`\n\
    (调用函数时参数不使用数据类型是可以的)\n\n## 3) 函数定义\n\n这是函数的主要部分。\n它包含了所有要执行的代码。\n它可以接受零、一个或多个输入，可能返回也可以不返回输出，但会对数据进行处理。\n\
    它包含一个头，其中包含函数名（之前已声明）和由步骤组成的体。\n\n**语法：**\n`Return datatype function_name(parameters)`\n\
    ```c\n{\n    Statements/……\n}\n```\n\n**注意：** 这里的 `return datatype` 表示返回给 `main`\
    \ 程序的值（`int``,`char`）。\n如果 `return type` 为 `void` 则不返回任何值。\n函数声明和调用用于函数的声明和调用。\n\
    函数定义 `defintion` 用于数据处理程序。\n\n```c\n#include<stdio.h> \n\nvoid main() \n{ \n \
    \     int a,b; \n      clrscr(); \n      printf(\"Enter Two Number : \"); \n \
    \     scanf(\"%d%d\",&a,&b); \n      sum(a,b); \n      getch(); \n} \n\n     \
    \ sum(int x,int y) \n  { \n      int z; \n      z=x+y; \n      printf(\"Sum of\
    \ Two Number is : %d\",z); \n      return 0; \n} \n```\n\n**输出：**\nEnter Two Number\
    \ : 10 20 \nSum of Two Number is : 30\n\n## 函数可以通过两种方式调用\n\n1) 值传递\n2) 引用传递\n\n\
    ### 值传递和引用传递的区别\n\n| 值传递 | 引用传递 | \n| :--- | :--- |\n| 在值传递（call by value）中，实际参数的副本被传递给调用函数的形参数，在调用函数中对形参数进行的任何更改都不会影响调用函数中实际参数的值。\
    \ | 在引用传递（call by reference）中，实际参数存储的位置（地址）被传递给调用函数的形参数。这意味着通过访问实际参数的地址，我们可以在调用函数内部修改它们。\
    \ |\n| 在值传递中，实际参数将保持安全，它们不会被意外修改。 | 在引用传递中，可以在调用函数内部对实际参数进行修改；因此代码必须小心处理参数，否则将得到意外的结果。\
    \ |\n\n## 函数分类\n\n1) 无返回值且无参数的函数\n2) 无返回值有参数的函数\n3) 有返回值且无参数的函数\n4) 有返回值有参数的函数\n\
    \n## 存储类\n\n指的是变量的作用范围以及存储该变量所分配的内存。\n换句话说，它告诉我们变量具有哪些额外功能。\n共有 4 种存储类。\n\n1)\
    \ AUTO\n2) REGISTER\n3) STATIC\n4) EXTERNAL\n\n## auto 存储类\n\n`auto` 存储类是所有局部变量的默认存储类。\n\
    ```c\n{\n     int mount;\n     auto  int month;\n}\n```\n上面的示例在同一个存储类中定义了两个变量。`'auto'`\
    \ 只能在函数内部使用，即局部变量。\n\n## register 存储类\n\n`register` 存储类用于定义应该存储在寄存器而不是 RAM 中的局部变量。这意味着变量的最大大小等于寄存器的大小（通常为一个字字），并且不能对其应用一元运算符\
    \ `&`（因为它没有内存位置）。\n```c\n{\n     register  int  miles;\n}\n```\n寄存器应仅用于需要快速访问的变量，例如计数器。还需要注意的是，定义为\
    \ `'register'` 并不意味着变量将会被存储在寄存器中。这意味着根据硬件和实现限制，它**可能**被存储在寄存器中。\n\n## static 存储类\n\
    \n`static` 存储类指示编译器在程序的整个生命周期内保持局部变量的存在，而不是在每次进入和离开作用域时创建和销毁它。因此，将局部变量设为静态允许它们在函数调用之间保持其值。\n\
    `static` 修饰符也可以应用于全局变量。这样做时，会导致该变量的作用域被限制在声明它的文件中。\n在 C 语言编程中，当在类数据成员上使用 `static`\
    \ 时，它会导致该类的所有对象共享该成员的唯一副本。\n\n## extern 存储类\n\n`extern` 存储类用于声明对所有文件可见的变量。\n当使用\
    \ `extern` 时，它指向之前定义过的变量。`extern` 修饰符最常声明变量或函数。\n`extern` 存储类用于声明对所有文件可见的变量。`extern`\
    \ 用于声明变量名。`extern` 在其他文件中使用。\n\n## 递归\n\n是一种编程技术，其中函数不断地调用自己。在使用递归时，程序员需要定义一个退出条件，否则将进入无限循环。\n\
    递归函数对于解决数学问题非常有用，例如计算数字的阶乘。\n\n### 示例：使用递归计算数字的阶乘\n\n```c\n#include  <stdio.h>\n\
    long  int multiplyNumbers(int n);\n\nint main () {\n    int n;\n    printf(\"\
    Enter a positive integer: \");\n    scanf(\"%d\", &n);\n    printf(\"Factorial\
    \ of %d = %ld\", n, multiplyNumbers(n));\n    return  0;\n}\n\nlong  int multiplyNumbers(int\
    \ n){\n    if (n >= 1)\n        return n*multiplyNumbers(n-1);\n    else\n   \
    \     return 1;\n}\n```\n\n**输出：**\nEnter a positive integer: 6\nFactorial of\
    \ 6 = 720\n\n假设用户输入了 6。最初从 `main()` 函数调用 `multiplyNumbers()`。在每次递归调用中，`n` 的值都会减\
    \ 1。当 `n` 的值小于 1 时，不再有递归调用。\n\n## 第 6 章：指针\n\n### 引言\n\n指针是存储另一个变量地址的变量。指针增强了数据的动态处理。\n\
    指针是一个值为另一个变量的变量（即内存地址）。像任何变量或常量一样，在使用存储变量地址之前必须声明指针。指针变量声明的通用形式为：\n`type *var-name;`\n\
    在这里，`type` 是指针的基本类型；它必须是有效的 C 数据类型，`var-name` 是指针变量的。声明指针使用的星号 `*` 与用于乘法的星号相同。但在该语句中，星号被用于将变量指定为指针。\n\
    \n### 如何使用指针？\n\n```c\n#include  <stdio.h>\nint main () {\n    int var  =  20;\
    \ /* 实际变量声明 */\n    int *ip; /* 指针变量声明 */\n    ip =  &var; /* 将 var 的地址存储在指针变量中*/\n\
    \    printf(\"Address of var variable: %x\\n\",  &var );\n    /* 存储在指针变量中的地址 */\n\
    \    printf(\"Address stored in ip variable: %x\\n\", ip );\n    /* 使用指针访问值 */\n\
    \    printf(\"Value of *ip variable: %d\\n\",  *ip );\n    return  0;\n}\n```当上述代码被编译并执行时，它产生以下结果\
    \ −\nAddress of var variable: bffd8b3c\nAddress stored in ip variable: bffd8b3c\n\
    Value of *ip variable: 20\n\n"
- fmt: "\nC programming allows passing a pointer to a function. To do so, simply declare\
    \ the function parameter as a pointer type.\n\nFollowing is a simple example where\
    \ we pass an `unsigned long` pointer to a function and change the value inside\
    \ the function which reflects back in the calling function —\n\n```c\n#include\
    \ <stdio.h>\n#include <time.h>\n\nvoid getSeconds(unsigned long *par);\n\nint\
    \ main ()  {\n  unsigned long sec;\n  getSeconds(&sec);\n  /* print the actual\
    \ value */\n  printf(\"Number of seconds: %ld\\n\", sec );\n  return 0;\n}\n\n\
    void getSeconds(unsigned long *par)  {\n  /* get the current number of seconds\
    \ */\n  *par = time( NULL );\n  return;\n}\n```\n\nWhen the above code is compiled\
    \ and executed, it produces the following result —\n\n`Number of seconds :1294450468`\n\
    \n# DYNAMIC MEMORY ALLOCATION\n\nIt is the process of allocating memory at run\
    \ time.\n\nIn C, the exact size of array is unknown until compile time, i.e, the\
    \ time when a compiler compiles your code into a computer understandable language.\
    \ So, sometimes the size of the array can be insufficient or more than required.\n\
    \nDynamic memory allocation allows your program to obtain more memory space while\
    \ running, or to release it if it's not required.\n\nIn simple terms, Dynamic\
    \ memory allocation allows you to manually handle memory space for your program.\n\
    \nAlthough, C language inherently does not have any technique to allocate memory\
    \ dynamically, there are 4 [library functions] under `\"stdlib.h\"` for dynamic\
    \ memory allocation.\n\n| Function | Use of Function |\n| --- | --- |\n| `malloc()`\
    \ | Allocates requested size of bytes and returns a pointer first byte of allocated\
    \ space |\n| `calloc()` | Allocates space for an array elements, initializes to\
    \ zero and then returns a pointer to memory |\n| `free()` | deallocate the previously\
    \ allocated space |\n| `realloc()` | Change the size of previously allocated space\
    \ |\n\n## malloc()\n\nThe name `malloc` stands for \"memory allocation\".\n\n\
    The function `malloc()` reserves a block of memory of specified size and return\
    \ a `pointer` of type `void` which can be casted into pointer of any form.\n\n\
    ### Syntax of malloc()\n\n```\nptr = (cast-type*) malloc(byte-size)\n```\n\nHere,\
    \ `ptr` is pointer of `cast-type`. The `malloc()` function returns a pointer to\
    \ an area of memory with size of byte size. If the space is insufficient, allocation\
    \ fails and returns `NULL` pointer.\n\n```\nptr = (int*) malloc(100 * sizeof(int));\n\
    ```\n\nThis statement will allocate either 200 or 400 according to size of `int`\
    \ 2 or 4 bytes respectively and the pointer points to the address of first byte\
    \ of memory.\n\n## calloc()\n\nThe name `calloc` stands for \"contiguous allocation\"\
    .\n\nThe only difference between `malloc()` and `calloc()` is that, `malloc()`\
    \ allocates single block of memory whereas `calloc()` allocates multiple blocks\
    \ of memory each of same size and sets all bytes to zero.\n\n### Syntax of calloc()\n\
    \n```\nptr = (cast-type*)calloc(n, element-size);\n```\n\nThis statement will\
    \ allocate contiguous space in memory for an array of `n` elements. For example:\n\
    \n```\nptr = (float*) calloc(25, sizeof(float));\n```\n\nThis statement allocates\
    \ contiguous space in memory for an array of 25 elements each of size of `float`,\
    \ i.e, 4 bytes.\n\n## free()\n\nDynamically allocated memory created with either\
    \ `calloc()` or `malloc()` doesn't get freed on its own. You must explicitly use\
    \ `free()` to release the space.\n\n### syntax of free()\n\n```\nfree(ptr);\n\
    ```\n\nThis statement frees the space allocated in the memory pointed by `ptr`.\n\
    \n## C realloc()\n\nIf the previously allocated memory is insufficient or more\
    \ than required, you can change the previously allocated memory size using `realloc()`.\n\
    \n### Syntax of realloc()\n\n```\nptr = realloc(ptr, newsize);\n```\n\nHere, `ptr`\
    \ is reallocated with size of `newsize`.\n\nWrite a C program to find sum of n\
    \ elements entered by user. To perform this program, allocate memory dynamically\
    \ using `malloc()` function.\n\n```c\n#include <stdio.h>\n#include <stdlib.h>\n\
    \nint main(){\n  int num, i, *ptr, sum = 0;\n  printf(\"Enter number of elements:\
    \ \");\n  scanf(\"%d\", &num);\n  ptr = (int*) malloc(num * sizeof(int)); //memory\
    \ allocated using malloc\n  if(ptr == NULL)\n  {\n    printf(\"Error! memory not\
    \ allocated.\");\n    exit(0);\n  }\n  printf(\"Enter elements of array: \");\n\
    \  for(i = 0; i < num; ++i)\n  {\n    scanf(\"%d\", ptr + i);\n    sum += *(ptr\
    \ + i);\n  }\n  printf(\"Sum = %d\", sum);\n  free(ptr);\n  return 0;\n}\n```\n\
    \n# Chapter 7: Array and String\n\nArray is a data structure which contains group\
    \ of elements under a single name.\n\nA very useful technique that reduces time\
    \ and helps in looping statements\n\nInstead of declaring individual variables,\
