  trans: "\n字符串实际上是一个一维字符数组，以 `null` 字符 `'\\0'` 终止。因此，一个空字符终止的字符串包含了组成字符串的字符，随后紧跟一个\
    \ `null` 字符。\n\n下面的声明和初始化创建了一个由 \"Hello\" 单词组成的字符串。为了在数组末尾保留空字符，包含字符串的字符数组的大小比\
    \ \"Hello\" 单词中的字符数多一个。\n\n```c\nchar greeting[6] = {'H', 'e', 'l', 'l', 'o',\
    \ '\\0'};\n```\n\n如果你遵循数组初始化的规则，可以按照如下方式编写上述语句——\n\n```c\nchar greeting[] = \"\
    Hello\";\n```\n\n以下是上述定义的字符串在 C/C++ 中的内存表示形式：\n\n![](img/00004.jpeg)\n\n实际上，你不需要在字符串常量的末尾放置\
    \ `null` 字符。C 编译器在初始化数组时会自动在字符串末尾放置 `'\\0'`。让我们尝试打印上述的字符串——\n\n```c\n#include\
    \ <stdio.h>\n\nint main () {\n char greeting[6] = {'H', 'e', 'l', 'l', 'o', '\\\
    0'};\n   printf(\"Greeting message: %s\\n\", greeting );\n   return 0;\n}\n```\n\
    \n当上述代码编译并执行时，它会产生以下结果——\n\nGreeting message: Hello\n\nC 支持多种处理空字符终止字符串的函数——\n\
    \n| S.N. | 函数及用途 |\n| :--- | :--- |\n| 1 | `strcpy(s1, s2);` 将字符串 `s2` 复制到字符串\
    \ `s1`。 |\n| 2 | `strcat(s1, s2);` 将字符串 `s2` 接到字符串 `s1` 的末尾。 |\n| 3 | `strlen(s1);`\
    \ 返回字符串 `s1` 的长度。 |\n| 4 | `strcmp(s1, s2);` 如果 `s1` 和 `s2` 相同返回 0；如果 `s1<s2`\
    \ 则返回小于 0 的值；如果 `s1>s2` 则返回大于 0 的值。 |\n| 5 | `strchr(s1, ch);` 返回字符 `ch` 在字符串\
    \ `s1` 中第一次出现处的指针。 |\n| 6 | `strstr(s1, s2);` 返回字符串 `s2` 在字符串 `s1` 中第一次出现处的指针。\
    \ |\n\n所有这些函数都可以通过标准头文件 `<string.h>` 访问。\n\n## 示例：不使用 strlen() 函数计算字符串长度\n\n```c\n\
    #include <stdio.h>\nint main(){\n char s[1000], i;\n    printf(\"Enter a string:\
    \ \");\n    scanf(\"%s\", s);\n for(i = 0; s[i] != '\\0'; ++i);\n    printf(\"\
    Length of string: %d\", i);\n return 0;\n}\n```\n\n**输出**\nEnter a string: Programiz\n\
    Length of string: 9\n\n## 在字符串中搜索字符出现次数的 C 程序\n\n```c\n#include<stdio.h>\n#include<conio.h>\n\
    int main() { \n char str[20], ch; \n int count = 0, i; \n printf(\"\\nEnter a\
    \ string : \"); scanf(\"%s\", &str); \n printf(\"\\nEnter the character to be\
    \ searched : \"); scanf(\"%c\", &ch); \n for (i = 0; str[i] != '\\0'; i++) { \n\
    \      if (str[i] == ch) count++; \n } \n if (count == 0) \n      printf(\"\\\
    nCharacter '%c'is not present\", ch); \n else \n      printf(\"\\nOccurence of\
    \ character '%c' : %d\", ch, count); \n return (0);\n}\n```\n\n"
- fmt: "\n```c\nd3->feet = d1.feet + d2.feet;\nd3->inch = d1.inch + d2.inch;\nif (d3->inch\
    \ >= 12) { /* if inch is greater or equal to 12, converting it to feet. */\n \
    \   d3->inch -= 12;\n    ++d3->feet;\n}\n```\n\nUNION\n\nA `union` is a special\
    \ data type available in C that allows to store different data types in the same\
    \ memory location. You can define a `union` with many members, but only one member\
    \ can contain a value at any given time. Unions provide an efficient way of using\
    \ the same memory location for multiple-purpose.\n\n## Defining a Union\n\nTo\
    \ define a union, you must use the `union` statement in the same way as you did\
    \ while defining a structure. The `union` statement defines a new data type with\
    \ more than one member for your program. The format of the `union` statement is\
    \ as follows −\n\n```c\nUnion name\n{\n    Datatype name;\n    Datatype name;\n\
    };\n```\n\n`union` and structure are same just that members of `union` use same\
    \ memory, unlike structure members whose each member will occupy seperate space.\n\
    \nThe difference between structure and union is:\n\n1. The amount of memory required\
    \ to store a structure variable is the sum of the size of all the members. On\
    \ the other hand, in case of unions, the amount of memory required is always equal\
    \ to that required by its largest member.\n2. In case of structure, each member\
    \ have their own memory space but In `union`, one block is used by all the member\
    \ of the union.\n\n### Detailed Example:\n\n| | |\n| :--- | :--- |\n| 123456 |\
    \ `struct stu{ char c; int l; float p;};` |\n| 123456 | `union emp{ char c; int\
    \ l; float p;};` |\n\nIn the above example size of the structure `stu` is 7 and\
    \ size of union `emp` is 4.\n\n# Chapter 9: C programs\n\n## Program to Multiply\
    \ Two Numbers\n\n```c\n#include <stdio.h>\nint main(){\n    double firstNumber,\
    \ secondNumber, productOfTwoNumbers;\n    printf(\"Enter two numbers: \");\n \
    \   // Stores two floating point numbers in variable firstNumber and secondNumber\
    \ respectively\n    scanf(\"%lf %lf\", &firstNumber, &secondNumber); \n    //\
    \ Performs multiplication and stores the result in variable productOfTwoNumbers\n\
    \    productOfTwoNumbers = firstNumber * secondNumber; \n    // Result up to 2\
    \ decimal point is displayed using %.2lf\n    printf(\"Product = %.2lf\", productofTwoNumbers);\n\
    \    return 0;\n}\n```\n\nOutput:\n```\nEnter two numbers: 2.4\n1.12\nProduct\
    \ = 2.69\n```\n\n## Program to Check Even or Odd\n\n```c\n#include <stdio.h>\n\
    int main(){\n    int number;\n    printf(\"Enter an integer: \");\n    scanf(\"\
    %d\", &number);\n    // True if the number is perfectly divisible by 2\n    if(number\
    \ % 2 == 0)\n        printf(\"%d is even.\", number);\n    else\n        printf(\"\
    %d is odd.\", number);\n    return 0;\n}\n```\n\nOutput:\n```\nEnter an integer:\
    \ -7\n-7 is odd.\n```\n\n## Program to Print ASCII Value\n\n```c\n#include <stdio.h>\n\
    int main(){\n    char c;\n    printf(\"Enter a character: \");\n    // Reads character\
    \ input from the user\n    scanf(\"%c\", &c); \n    // %d displays the integer\
    \ value of a character\n    // %c displays the actual character\n    printf(\"\
    ASCII value of %c = %d\", c, c);\n    return 0;\n}\n```\n\nOutput:\n```\nEnter\
    \ a character: G\nASCII value of G = 71\n```\n\n## Program to Check Prime Number\n\
    \n```c\n#include <stdio.h>\nint main(){\n    int n, i, flag = 0;\n    printf(\"\
    Enter a positive integer: \");\n    scanf(\"%d\",&n);\n    for(i=2; i<=n/2; ++i)\n\
    \    {\n        // condition for nonprime number\n        if(n%i==0)\n       \
    \ {\n            flag=1;\n            break;\n        }\n    }\n    if (flag==0)\n\
    \        printf(\"%d is a prime number.\",n);\n    else\n        printf(\"%d is\
    \ not a prime number.\",n);\n    return 0;\n}\n```\n\nOutput:\n```\nEnter a positive\
    \ integer: 29\n29 is a prime number.\n```\n\n## Example: Program to Check Leap\
    \ Year\n\n```c\n#include <stdio.h>\nint main(){\n    int year;\n    printf(\"\
    Enter a year: \");\n    scanf(\"%d\",&year);\n    if(year%4 == 0)\n    {\n   \
    \     if( year%100 == 0)\n        {\n            // year is divisible by 400,\
    \ hence the year is a leap year\n            if ( year%400 == 0)\n           \
    \     printf(\"%d is a leap year.\", year);\n            else\n              \
    \  printf(\"%d is not a leap year.\", year);\n        }\n        else\n      \
    \      printf(\"%d is a leap year.\", year );\n    }\n    else\n        printf(\"\
    %d is not a leap year.\", year);\n    return 0;\n}\n```\n\nOutput 1:\n```\nEnter\
    \ a year: 1900\n1900 is not a leap year.\n```\n\nOutput 2:\n```\nEnter a year:\
    \ 2012\n2012 is a leap year.\n```\n"
