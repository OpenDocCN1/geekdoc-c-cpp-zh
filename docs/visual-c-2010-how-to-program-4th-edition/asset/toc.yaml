  - 6.21 (勾股数) 直角三角形的边长可以是整数。直角三角形三条边的整数值被称为勾股数。三条边必须满足任意两条边的平方和等于第三边的平方。寻找 side1、side2
    大于 500 的所有勾股数使用了三重嵌套循环。这种方法是“穷举”计算。在更高级的课程中你将了解到对于许多有趣除了穷举外没有其他算法方法。
