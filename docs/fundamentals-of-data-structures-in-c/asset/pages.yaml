  md: "# 4.10 Graph Traversals\n\nTraversing a graph means visiting all the nodes\
    \ in the graph. In many practical applications, traversing a graph is important,\
    \ such that each vertex is visited once systematically by traversing through minimum\
    \ number of paths. The two important graph traversal methods are\n\n+   - Depth-first\
    \ traversal (or) Depth-first search (DFS)\n+   - Breadth-first traversal (or)\
    \ Breadth-first search (BFS).\n\n# 4.10.1 Depth–First Traversal\n\nThe logic of\
    \ Depth First Search (DFS) is similar to the preorder traversal of a tree. Visit\
    \ the first node initially and then find the unvisited node which is adjacent\
    \ to the first node. Then the unvisited node is visited and a depth first search\
    \ is initiated from the adjacent node (considering it as the first node). If all\
    \ the adjacent nodes have been visited, backtrack to the last node visited, and\
    \ find another adjacent node and again initiate the depth-first search from the\
    \ adjacent node. This traversal continues until allnodes have been visited once.\
    \ The following algorithm describes DFS in a graph.\n\n+   **Algorithm for Depth\
    \ First Traversal**\n+   \n+   Step 1 : Consider that the DFS is beginning from\
    \ the starting vertex A. Process the vertex A and mark it as visited.\n+   \n\
    +   Step 2 : Using the adjacency matrix of the graph find the vertex along the\
    \ path which begins vertex A, that has not been visited yet. Process the vertex\
    \ and consider this as the new vertex and mark the vertex as visited.\n+   \n\
    +   Step 3 : Repeat Step 2 using the new search vertex. If no vertices (i.e.,\
    \ if a dead end if reached) back track to the previous node and continue the search\
    \ from there.\n+   \n+   Step 4 : When backtracking to the previous search node\
    \ in Step 3 is impossible, the search from the originally chosen search node is\
    \ complete.\n+   \n+   Step 5 : If the graph still contains unvisited nodes, choose\
    \ any vertex that has not been visited and repeat Step 1 to Step 4.\n\nThe above\
    \ algorithm executes in a recursive manner, which can also be implemented non-recursively\
    \ using stacks. To understand the traversal clearly, consider the graph shown\
    \ in Fig. 4.39(c) and its adjacency matrix shown in Fig. 4.41(c). Program 4.6\
    \ helps you to understand things better.\n\n# Program 4.6 :\n\n```\n/* Program\
    \ to demonstrate Depth First Search. */\n/* dfs.c */\n#include <stdio.h>\nint\
    \ a[10][10], visited[10], n;\nvoid searchFrom(int k);\n```"
