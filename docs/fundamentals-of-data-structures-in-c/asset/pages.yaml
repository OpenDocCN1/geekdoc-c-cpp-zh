  md: '# 1.16 String Library Functions


    With every C compiler a large set of useful library functions are provided. Table
    1.15 shows the commonly used string functions along with the purpose of their
    usage.


    # Table 1.15 : String Functions


    | Function | Meaning |

    | :--- | :--- |

    | strcpy() | Copies a string into another string |

    | strcat() | Appends one string at the end of another string |

    | strchr() | Finds first occurrence of a given character in a string |

    | strcmp() | Compares two strings |

    | strcmpi() | Compares two strings without regard to case ("i" denotes that this
    function ignores case) |

    | strcpy() | Copies a string into another string |

    | strcspn() | Finds the initial segment of string s1 consists entirely of characters
