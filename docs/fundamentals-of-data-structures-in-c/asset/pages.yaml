  md: '# 2.11.4 External Storage Class


    Variables that are both alive and active throughout the entire program are called
    as external variables also referred as global variables. Global variables can
    be accessed by any function in the program. Global variables do not belong to
    any particular function (i.e., they are global in nature) and is usually declared
    outside all functions, usually at the beginning of the program, but after all
    preprocessor directives. Global variables can be referred by any function that
    follows the variable declaration in the program. Any function in the program can
    access the value of the global variable and can change the value of the variable
    if desired. When declaring an external variable or a global variable in a program,
    it is more precise in C to use the keyword extern before the declaration of the
    variable. The following statement is an example for external variable declaration.


    ```

    extern int number;

    ```


    Global variables are also stored in the memory. When an external variable is not
    initialized it takes a value of zero. The value of the variable persists between
    different function calls as long as the program execution ends.


    Note that initialization of an extern variable takes place only once. (i.e., when
    the program starts up, before the control enters to the main() function). Program
    2.17, illustrates the scope and life of the global variables.


    # Program 2.17 :


    ```

    /* extern.c */

    #include<stdio.h>

    void test1();

    void test2();

    void test3();

    void main()

    {

    extern int value;

    value = 100;

    test1();

    test2();

    test3();

    printf("%d ", value);

    }

    void test1()

    {

    extern int value;

    value += 100;

    printf("%d ", value);

    }

    void test2()

    {

    extern int value;

    value = 1000;

    printf("%d ", value);

    }

    ```'
  merge: -1
  img_proc: true
