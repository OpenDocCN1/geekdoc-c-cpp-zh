- pgno: 402
  md: '# V. COMMON PROGRAMMING ERRORS


    This appendix is written for C programmers for finding the bugs (errors) while
    compiling a program. It is advisable to keep track of such errors and to see that
    these known errors are not present in the program. I have made a list of more
    common programming mistakes, which will help you while writing programs. They
    are not arranged in any particular order.


    +   1. **Forgetting to include stdio.h**

    +   Forgetting to include the header file stdio.h in the program, which reads
    input from the user through the keyboard or displays the output in the screen.
    In such cases, the compiler issues an error message.


    +   2. **Forgetting to include header files**

    +   Forgetting to include the header file in the program, which uses one or more
    functions from a header file. In such cases, the compiler issues an error message.


    +   3. **Missing semicolons**

    +   Every C statement must end with a semicolon. Missing a semicolon may cause
    confusion to the compiler and results in error messages.

    +   Example : x = a + b + c

    +   The above statement should be

    +   x = a + b + c ;


    +   4. **Using a keyword as an identifier**

    +   Another common mistake is to use a keyword as an identifier for naming variables,
    arrays, functions, structures, or unions, etc., In such cases, the compiler issues
    an error message.


    +   5. **Placing semicolons at the end of function definitions**

    +   It is common error to place a semicolon after the right parenthesis enclosing
    the argument list of a function definition.


    +   6. **Missing semicolons at the end of function declarations**

    +   It is common error to omit a semicolon after the right parenthesis enclosing
    the argument list of a function declaration (i.e., function prototype).


    +   7. **Ending an if statement with a semicolon**

    +   Another common mistake is to put a semicolon at the end of the if statement
    after the parenthesis. The semicolon may cause the if statement to omit its body,
    and hence it will not perform any action regardless of whether the condition is
    true or false.


    +   8. **Ending a loop with a semicolon**

    +   Another common mistake is to put a semicolon in a wrong place i.e., in a loop.
    A semicolon may cause a loop to be in an indefinite loop and the programmer may
    get a different output.

    +   Example :

    +   #include<stdio.h>

    +   main()'
  merge: -1
  img_proc: true
- pgno: 403
  md: '```

    {

    int x = 1;

    while (x<=50) ;

    {

    printf("ERROR") ;

    x++;

    }

    }

    ```


    In the above program the value of x will not be incremented and always remains
    less than 50. Therefore the program segment should be


    ```

    while (x <= 50)

    {

    printf("ERROR") ;

    x++;

    }

    ```


    # 9. Improper comment characters


    Every comment should start with a /* and end with a */. Anything between them
    is ignored by the compiler. If we miss out the opening /* or the closing */ then
    the compiler searches in the program treating all lines as comments. Hence, we
    will get an error message. One opening /* should be always accompanied with a
    closing */. Otherwise, an error will be occurred.


    # 10. Undeclared variables


    C requires every variable to be declared for its type, before it is used. During
    the development of a large program, one may use a variable, which has not been
    declared. Hence, it gives an error.


    # 11. Using spaces in between operators


    It is a common error to leave spaces in between operators like ==, !=, >=, <=.


    # 12. Reversing the order of operators


    It is a common error to reverse the order of operators like =!, =>, =<.


    # 13. Confusing the precedence of various operators


    Expressions are evaluated according to the precedence of operators. It is common
    among beginners to confuse the precedence of operators.


    Example : while(sum=multiply() <= 50)

    sub = 5 - sum;


    The function call multiply() returns the product of three numbers, which is compared
    to 50. If the value is equal to or less than 50, the relational test is true,
    and 1 is assigned to sum, otherwise 0 will be assigned. But this is not the output
    the programmer wanted.


    The expression should be


    ```

    while(sum=multiply() <= 50)

    sub = 5 - sum;

    ```'
  merge: -1
  img_proc: true
