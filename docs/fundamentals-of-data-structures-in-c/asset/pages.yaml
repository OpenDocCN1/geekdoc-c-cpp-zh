  md: '# 13. Define searching.


    Searching is a programming technique that determines whether an element or a data
    item is present in the given list or not.


    # 14. Mention some of the searching techniques.


    Searching techniques includes


    +   - Linear search

    +   - Indexed sequential search

    +   - Binary search

    +   - Fibonacci search.


    # 15. What is meant by binary search ?


    The binary search algorithm is one of the most efficient sorting techniques, which
    requires the list to be sorted in ascending order. To search for an element in
    the list, the binary search algorithm splits the list into two and locates the
    middle element in the list. If the search element is less than the middle element,
    the first part of the list is searched else the second part of the list is searched.
    This process continues until the search element is equal to the middle element
    or the list consists of only one element that is not equal to the search element.


    # 16. Which is the fastest internal sorting technique & why ?


    As the name indicates, the quick sort technique is the fastest sorting technique.
    The purpose of quick sort is to move a data item in the correct position just
    enough to reach its final position in the list. This method therefore reduces
    unnecessary swaps. The quick sort technique has an advantage of moving a data
    item to a great distance in one move to place it in its exact position.


