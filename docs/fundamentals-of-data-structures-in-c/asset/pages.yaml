  md: '# ## 3.6 Linked List based Implementation of Stacks


    Another way of representing a stack is by means of a singly linked list. This
    type of representation has more advantages than representing stacks using arrays.
    They are,


    +   - It is not necessary to specify the number of elements to be stored in a
    stack during its declaration (since memory is allocated dynamically at run time
    when an element is added to the stack).

    +   - Insertions and deletions can be handled easily and efficiently.

    +   - Linked list representation of stacks can grow and shrink in size without
    wasting the memory space, depending upon the insertion and deletion that occurs
    in the list.

    +   - Multiple stacks can be represented efficiently using a chain for each stack.


    The basic operations that can be performed on a stack are,


    +   - Push operation

    +   - Pop operation

    +   - Peek operation

    +   - View stack size

    +   - View stack contents.


    # ### 3.6.1 Push Operation


    PUSH is an operation used to add a new element in to a stack. The PUSH operation
    of a stack can also be implemented using singly linked lists. The following procedure
    helps you to understand things better.


    +   - Create a function PUSH() with two arguments (pointer of stack and VALUE
    to be inserted).

    +   - Create a new pointer (i.e., NEWPTR) to hold the new element.

    +   - Allocate size of the stack node to the new pointer using GETNODE().

    +   - The size of the stack depends on the heap memory available.

    +   - If GETNODE() returns NULL heap memory is not available.

    +   - Assign the VALUE to the data of new pointer.

    +   - Assign the link of the new pointer to the head (i.e., TOP) of the stack.

    +   - Assign the head of the stack to the new pointer.


    ```

    Algorithm for Declaration of Structure Stack

    Struct STACK

    DATA : Data Field

    NEXT : Link Field (Address of next Struct STACK)

    End Struct

    ```


    ```

    Algorithm for Allocating Memory for the New Node

    GETNODE()

    SIZE : INTEGER

    NEWNODE : STACK

    Step 1 : Set SIZE = get the size of the STACK

    Step 2 : Set NEWNODE = Allocate space in memory for SIZE and return the initial
    address

    Step 3 : Return NEWNODE

    End GETNODE()

    ```'
