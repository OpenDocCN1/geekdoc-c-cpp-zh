- pgno: 426
  md: '# # Fundamentals of Data Structures in C

    for Anna University


    This book is specifically designed in accordance with the ''Anna University 2017
    regulation'' of ECE course. It is written in an easy to understand manner to meet
    the requirements of the students who want to get conversant with programming in
    C and to write programs in C for various data structures with algorithms.


    The book is organized into 5 chapters and appendices. The whole text is differentiated
    into two parts, first part is dedicated to the basic concepts in C including arrays,
    string, functions, pointers, recursion and union and the remaining part clearly
    focuses on the implementation of C language for writing programs using various
    data structures, linked lists, stacks and queues, trees, graphs, hashing, sorting
    and searching. All the concepts in the book are supplemented with examples, wherever
    necessary.


    # Salient Features:


    +   - Simple and systematized style of presentation

    +   - A clear focus on numerous university questions for better scoring

    +   - Algorithms of complicated data structures are followed by executable C programs

    +   - Algorithms are independent of the programming language

    +   - Programs have been tested and debugged for errors

    +   - 100+ Programs which are useful for laboratory practical and projects

    +   - 450+ Multiple choice questions (MCQs) valuable for interviews


    The book will serve the requirements of BTech students of ECE course of Anna University


    P Sudharsan is currently working as Program Manager, Infosys Ltd, Chennai. He
    obtained his BE (EEE) from University of Madras, and ME (Power Systems) from Anna
    University. He has 20+ years of experience in programming and has written more
    than 10 books including C & Data Structures, Data Structures using C, Fundamentals
    of Computing, Computer Programming in C, and Computer Programming in UNIX. His
    area of interest includes C, C++, UNIX, MATLAB, computer applications to power
    systems, networking and security. He has been active in computer programming since
    1999.


    J John Manoj Kumar is currently working as Program Manager, Standard Chartered
    Bank, Chennai. He is a programmer, lecturer, and debugger. He obtained BE (CSE)
    form VRS College of Engineering & Technology, University of Madras. He has been
    active in computer programming since 1998. He has written two books C & Data Structures
    and Data Structures using C. His area of interest includes data structures, algorithms,
    C, C++ and Java programming and he loves to debug errors. He has over 20 years
    of experience in computer programming and served as teacher for 10 years and more
    than 8 years as Program Manager in Scope International, Malaysia.'
  merge: -1
  img_proc: true
