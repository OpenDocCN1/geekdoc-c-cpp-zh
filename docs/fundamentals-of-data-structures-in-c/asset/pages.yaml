    # 5.12 Short-answer Questions


    1. **Define sorting.** Sorting a group or sequence of elements or data items means
    rearranging them in either ascending or descending order depending upon the relationship
    among the data items present in the group.


    2. **What are the factors to be considered while choosing a sorting technique
    ?** The factors to be considered while choosing a sorting technique are


    +   * Programming time

    +   * Running time of the sorting technique

    +   * Number of comparisons required for sorting the list

    +   * Main or auxiliary memory space needed for the sorting technique.


    3. **What is the necessity for sorting techniques ?** All data processing requires
    accessing records efficiently and quickly. Search techniques are most efficient
    only when the data items are sorted according to some specified keys. If the list/
    file is not sorted, searching a record takes more time when the list/file is large.


    4. **Mention some of the sorting techniques.** Sorting techniques includes


    +   * Bubble sort

    +   * Insertion sort

    +   * Selection sort.

    +   * Merge sort

    +   * Quick sort


    5. **When is sorting method is said to be stable ?** A sorting method is said
    to be stable when it has minimum number of swaps i.e., if the two data items of
    matching value are guaranteed not to be rearranged with respect to each other
    when the algorithm progresses.'
