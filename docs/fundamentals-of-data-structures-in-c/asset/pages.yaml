    \ = P1 ->> EXP + P2 ->> EXP\n    TEMP ->> NEXT = MULNODE(P1 ->> NEXT, P2)\n  \
    \  [End of if Structure]\nStep 3 : Return TEMP\nEND MULNODE()\n```\n\n# Algorithm\
    \ for Polynomial Multiplication\n\n```\nPOLYMUL(P1 : POLY, P2 : POLY)\nStep 1\
    \ : If (P2 == NULL) Then\n    Return NULL\n    [End of If Structure]\nStep 2 :\
