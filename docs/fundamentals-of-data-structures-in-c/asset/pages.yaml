- pgno: 158
  md: 'A stack is referenced via a pointer to the top element of the stack referred
    as *top pointer*. The top pointer keeps track of the top element in the stack.
    Initially, when the stack is empty, the top pointer has a value zero and when
    the stack contains a single element, the top pointer has a value one and so on.
    Fig. 3.1 shows the representation of a stack.


    The primary operations that can be carried on a stack are insertions and deletions.
    These operations on a stack are referred as *PUSH* and *POP* operations respectively.
    A *PUSH* operation adds a new element to the stack. Each time a new element is
    inserted in the stack, the top pointer is incremented by one before the element
    is placed on the stack. A *POP* operation deletes the top most element in the
    stack. Each time an element is removed from the stack the top pointer is decremented
    by one. The stack shown in *Fig. 3.2* consists of seven elements. We know that
    insertions and deletions can occur only at the top of the stack, which means *EIE*
    cannot be deleted until *IT* is deleted, *CSE* cannot be deleted until *IT* and
    *EIE* are deleted and so on. The elements from the stack may be popped (i.e.,
    removed/deleted) only in the reverse order in which they are pushed (i.e., inserted/added)
    on to the stack.


    # 3.2 Array and its Representation using Stack


    One of the simplest ways of representing a stack is by means of a single dimensional
    array. Both stacks and arrays are ordered collection of elements, but an array
    and a stack are two different things. The number of elements in the array is fixed
    and it is not possible to change the number of elements, but the size of the stack
    varies continuously when elements are pushed and popped. The stack is stored in
    a part of the array, so an array can be declared large enough to hold the maximum
    number of elements of the stack.


    During execution of a program, the stack size can be varied within the space reserved
    for it. One end of the array (i.e., bottom of the stack) is fixed and the other
    end of the array (i.e., top of the stack) is constantly changed depending upon
    the elements pushed and/or popped in the stack. Care must be taken in handling
    extreme cases, like not to push an element into a fully occupied stack and not
    to pop an element from an empty stack.


    To represent a stack using arrays, we need,


    +   - An Array to hold the elements of the stack, which can be of any data type
    such as int, char, float, etc.

    +   - An integer variable to indicate the top position of the stack within the
    array.


    # 3.2.1 Push Operation


    PUSH is an operation used to add a new element in to a stack. The PUSH operation
    of a stack is implemented using arrays. When implementing the PUSH operation,
    overflow condition of a stack is to be checked (i.e., you have to check whether
    the stack is full or not). If the size of the stack is defined as 15, then it
    is possible to insert (i.e., add)'
