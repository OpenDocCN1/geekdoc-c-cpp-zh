- pgno: 29
  md: '# 1.6 Data Types


    The data types supported in a language dictates the type of values, which can
    be processed by the programming language. C language is rich in its data types.
    It supports a wide variety of data types each of which may be represented differently
    within the computer’s memory, which allows the programmer to select the appropriate
    type to the needs of the application. Data types in C can be broadly classified
    as,


    +   - Primary data types

    +   - User-defined data types

    +   - Empty data type.


    # 1.6.1 Primary Data Types


    All C compilers supports four primary data types namely,


    +   - Character data type represented as char

    +   - Integer data type represented as int

    +   - Floating-point data type represented as float

    +   - Double-precision floating-point data type represented as double.


    # Integer Data Types


    Whole numbers, which are used frequently, are referred as integers. It occupies
    two bytes for their storage. In order to have control over the range of numbers
    and storage space in memory short int, int, long int in both signed and unsigned
    forms are used.


    # Floating-Point Data Types


    Real numbers, which are used frequently, are referred as floating-point numbers.
    The float data type is used to store any number in floating-point format. Floating-point
    data types store numerical values with a fractional portion. They usually occupy
    4 bytes of memory for their storage. These are known as single precision numbers.
    When the range provided by a float data type is not sufficient, double data type
    is used. The double data type represents the same data type, that float represents
    but with a greater precision hence it requires 8 bytes of memory for their storage.
    These are known as double precision numbers. To increase the precision further
    we can use long double which uses 10 bytes of memory for their storage. These
    are known as extended precision numbers.


    # Character Data Types


    The char data type is used to represent characters that require only one byte
    of memory for their storage. In order to have control over the range of characters
    and storage space in memory, signed and unsigned char data type are used.


    Table 1.4, shows the range of values that can be stored in various data types.'
  merge: -1
  img_proc: true
