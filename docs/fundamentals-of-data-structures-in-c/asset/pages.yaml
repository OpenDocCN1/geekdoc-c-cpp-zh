  md: '# 2.4 Pointers


    We know that variables are stored in memory. Each memory location has a numeric
    address. Variable names in C have the capability to enable the programmer to refer
    to the memory location by its name, but the compiler must translate these names
    into their respective memory addresses. This process is automatically performed
    by compiler. The address or name of a memory location points to whatever it contains
    within that memory location. Passing addresses does not violate the rules of programming.
    The addresses are passed only to the functions that need to access those memory
    locations. At any moment, in a program execution, each existing variable has a
    unique address associated with it. The memory location formerly occupied by such
    a local variable is freed when the program execution ends and the memory location
    is allocated to another variable later in some other program. *A pointer is a
    variable, which represents the location (not the value) of a data item, such as
    a variable or an array element.*


    # 2.5 Pointer Operators


    Like all variables, a pointer variable should also be declared. The general form
    or the syntax of a pointer variable is


    ```

    dataType *variableName;

    ```


    where dataType is the type of the variableName, which may be of any valid type.
    * is called as the *indirection operator* also referred to as the *dereferencing
    operator*, which states that the variable is not an ordinary variable but a pointer
    variable. The `variableName` is the name of the pointer variable. The rules for
    naming pointer variables are same as identifiers. When an * is placed before the
    `variableName`, the value returned by it, is not the value of the pointer variable,
    but the address of the value stored in the memory location. The content of any
    pointer variable can be accessed with the help of indirection operator. If `ptr`
    is a pointer variable, then `*ptr` is used to access the content of the pointer
    variable `ptr`. The indirection operator (*) can only act upon operands, which
    are pointer variables.


    All the variables declared in a program occupy a specific address in memory. It
    is possible in C, to obtain the address of the variable using an operator referred
    as the *address operator*. This operator may precede a variable name or an array
    element, but should not precede a constant, an expression, or an unsubscripted
    name of an array. Let `ptr` be a variable that represents a data item. The compiler
    automatically assigns memory cells for the data item. The data item can then be
    accessed if we know the location (address), of the memory cell. The address of
    the variable `ptr` can be determined by the expression `&ptr` where `&` evaluates
    the address of the operand (i.e., `ptr`) as shown in *Fig. 2.1*.'
