    # 2.2 Passing Values to Functions


    Arguments to a function are usually passed in two ways. They are,


    +   - Call by value.

    +   - Call by reference.


    In call by value, a copy of the variable is made and passed to the function as
    argument. In this method, changes made to the parameters of the function have
    no effect on variables, which calls the function, because the changes are made
    only inside the function. In call by reference, the address of each argument is
    passed to the function. In this method, changes made to the parameters of the
    function will affect the variables, which calls the function.


    # 2.2.1 Call by Value


    The process of passing the actual value of variables is called as call by value.
    In this case, the values from the calling function are passed as arguments to
    the called function. When a value is passed to a function via an actual argument,
    the value of the actual argument is copied to the variable into the called function,
    hence the value of the corresponding formal arguments can be altered within the
    function, but the value of the actual argument within the calling function will
    not be altered. Program 2.6 helps you to understand things better.


    Program 2.6:


    ```

    /* Program to demonstrate call by value. */

    /* call_val.c */

    #include<stdio.h>

    void add(int);

    void main()

    {

    int x = 5;

    printf("\n Value of x before calling the function is %d", x);

    add(x);

    printf("\n Value of x after calling the function is %d", x);

    }

    void add(int y)

    {

    y = y + 5;

    printf("\n Value of x in the called function is %d", y);

    }

    ```'
