    # 1.7.2 Unary Operators


    The operators that act upon a single operand to produce a new value are called
    as unary operators. Unary operators usually precede its operands, though some
    unary operators are written after their operands. Table 1.6, shows various unary
    operators and their meaning.


    | Operator | Meaning |

    |---|---|

    | - | Unary minus |

    | ++ | Increment by 1 |

    | -- | Decrement by 1 |

