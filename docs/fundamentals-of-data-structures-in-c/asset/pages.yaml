    # 5.6 Merge Sort


    The merge sort algorithm also uses divide and conquer rule for its operation.
    The first step of the merge sort is to chop the list into two. If the list has
    even length, split the list into two equal sub lists. If the list has odd length,
    divide the list into two by making the first sub list one entry greater than the
    second sub list. Then split both the sub lists into two and go on until each of
    the sub lists are of size one. Finally, start merging the individual sub lists
    to obtain a sorted list.


