    the variable. This type of notation is referred as postfix notation. If the value
    of the operand x is 3 then the various expressions and their results are


    | Expression | Execution |

    |---|---|

    | ++x | x <- 3 + 1 |

    | x++ | x <- 3 ; x <- 3 + 1 |

    | --x | x <- 3 - 1 |

    | x-- | x <- 3 ; x <- 3 - 1 |


    The pre-increment operation (++x) increments x by 1 and then assigns the value
    to x. The post-increment operation (x++) assigns the value to x and then increments
    1. The pre-decrement operation (--x) decrements 1 and then assigns to x. The post-decrement
    operation (x--) assigns the value to x and then decrements 1. These operators
    are usually very efficient, but causes confusion if you try to use too many evaluations
    in a single statement.


    # The sizeof Operator


    The sizeof operator is not a library function but a keyword, which returns the
    size of the operand in bytes. The sizeof operator always, precedes its operand.
