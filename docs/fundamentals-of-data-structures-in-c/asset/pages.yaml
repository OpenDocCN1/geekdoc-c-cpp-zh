  md: '# 4.11 Summary


    +   - A tree is a non-linear, two-dimensional data structure, which represents
    hierarchical relationship between individual data items.


    +   - A path in a tree is a sequence of distinct nodes in which successive nodes
    are connected by edges in the tree.


    +   - A node that has no children is called as a terminal node. It is also referred
    as a leaf node. These nodes have zero degree.


    +   - All intermediate nodes that traverse the given tree from its root node to
    the terminal nodes are referred as non-terminal nodes.


    +   - A binary tree is a tree, which has nodes either empty or not more than two
    child nodes, each of which may be a leaf node.


    +   - A full binary tree is a tree in which all the leaves are on the same level
    and every non-leaf node has exactly two children.


    +   - A complete binary tree is a tree in which every non-leaf node has exactly
    two children not necessarily to be on the same level.


    +   - Postorder traversal leads to postfix expressions. Preorder traversal leads
    to prefix expressions. Inorder traversal leads to infix expressions.


    +   - Left-skewed binary tree is a binary tree, which has only left child nodes.


    +   - Right-skewed binary tree is a binary tree, which has only right child nodes.


    +   - An extended binary tree is a transformation of any binary tree in to a complete
    binary tree, which replaces every null subtree of original binary tree with special
    nodes. The nodes from the original tree are referred as internal nodes, while
    the special nodes are referred as external nodes.


    +   - A general tree (i.e., a tree with nodes having any number of children) can
    be converted into an equivalent binary tree using the leftmost child right siblings
    representation.


    +   - Traversing a binary tree, means moving through all the nodes in the binary
    tree, visiting each node in the tree only once.


    +   - The different binary tree traversal techniques are preorder traversal, inorder
    traversal, and postorder traversal.


    +   - In linked representation of binary trees, we can see that all leaf nodes
    and some non-leaf nodes have NULL values. Instead of storing NULL values in the
    left and right pointer fields, we can store some useful information, in left and
    right pointer fields. These links are considered as threads. A binary tree, which
    implements these threads are referred to as threaded binary tree.'
