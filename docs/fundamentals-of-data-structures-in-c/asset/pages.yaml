  md: "# 14. Omitting the ampersand (&) before the variables used in scanf()\n\nExample\
    \ :\n\n```\nint x;\nscanf(\"%d\", x);\n```\n\nThe statement should be\n\n```\n\
    int x;\nscanf(\"%d\", &x);\n```\n\n# 15. Using the operator = instead of operator\
    \ ==\n\nIt is quite possible to forget the use of operator == and use the operator\
    \ = when we perform a relational test.\n\nExample :\n\n```\n#include<stdio.h>\n\
    main()\n{\n int x = 1;\n while(x = 5)\n {\n printf(\"Hello\");\n x++;\n }\n}\n\
    ```\n\nThe statement is syntactically valid and the variable x assigns 5 and then,\
    \ because x = 5 is true, the message is printed once and the control will come\
    \ out of the loop since x becomes 6. Hence we have fallen in an indefinite loop.\
    \ Similar mistakes can occur in other control statements such as for and if. Such\
    \ a mistake in the loop control statements might cause infinite loops.\n\nThe\
    \ statement should be\n\n```\nwhile(x == 5)\n```\n\n# 16. Omitting the break statement\
    \ at the end of a case in a switch statement\n\nExample :\n\n```\n#include<stdio.h>\n\
    main()\n{\n int x;\n printf(\"ENTER AN INTEGER : \");\n scanf(\"%d\", &x);\n switch(x)\n\
    \ {\n case 1 :\n printf(\"Hello\");\n```"
