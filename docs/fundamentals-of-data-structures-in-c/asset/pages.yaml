  md: '# # Chapter 2


    # # Functions, Pointers, Structures and Unions


    # ## 2.1 Introduction


    A function is a self-contained program segment (block of segments) created to
    perform some specific well-defined task that can be called in any part of a program
    . Functions break large computing tasks into smaller ones. Almost all programming
    languages have some equivalent of the function, such as a subroutine or a procedure.
    C allows programmers to define their own functions for carrying out various individual
    tasks. C has been designed to make functions efficient and easy to use. C programs
    generally consist of many small functions rather than few big ones. Every C program
    consists of one or more functions, but there should be at least one function which
    must be `main()`. Each time when a new program is written, `main()` function must
    be defined. The `main()` function calls another function to share the work.


    C functions may be classified into two categories namely **user-defined functions**
    and **library functions**. The `main()` function that we have seen so far in the
    programs is an example of an user-defined function. These functions are defined
    by the user according to his requirements. User can implement their ideas in developing
    user-defined functions. `printf()` and `scanf()` are the examples of library functions.
    The main difference between these two categories is that, an user-defined function
    has to be developed by the user at the time of writing a program, where as library
    functions are previously defined functions. C language has a standard library
    which provides a rich collection of functions for performing input, output, string
    manipulations, common mathematical calculations, and many other functions for
    performing useful operations.


    > > Note : Commonly used library functions are listed in Appendix IV.


    A function can be called by simply using the function name as a statement. A function
    will carry out its intended action whenever it is called from some other portion
    of the program. The same function can be accessed (called) from different places
    within a program. Once the function has carried out its intended action, control
    will be returned to the next statement from which the function is accessed. Usage
    of function is explained in detail with the help of **Program 2.1**.'
