    **singly linked list** It is a linked list in which each node contains only one
    link field pointing to the next node in the list.


    **sink vertex** It is a vertex whose outdegree is 0.


    **sizeof** It is an operator used to get the size of a data type in bytes.


    **SRAM** Static Random Access Memory. Type of physical read/write memory used
    in personal computers and holds data, as long as power is supplied to the circuit.


    **source vertex** It is a vertex whose indegree is 0.


    **stack** It is an ordered collection of elements in which insertions and deletions
    are restricted to one end. Stacks are also referred as "piles" and "push-down
    lists".


    **static variable** It is a variable whose whole value persists between different
    function calls until the end of the program.


    **static** It is a storage class specifier.


    **static data structure** A data structure formed when the number of data items
    are known in advance.


    **stderr** It is the standard error files operand automatically for displaying
    the error messages.


    **stdin** It is the standard input file opened automatically for getting the input
    for the program.


    **stdout** It is the standard output file opened automatically for displaying
    the output of the program.


    **string** It is an array of characters terminated by a null character.


    **strongly connected graph** It is a directed graph in which for every pair of
    distinct vertices their is a graph directed path from every vertex to every other
    vertex.


    **structure (struct)** It is a collection of one or more variables possibly of
    different data types, grouped together a single name for convenient handling.
    They are also used to create user-defined datatypes.


    **sub tree** A subset of a tree that is itself a tree.


    **super computers** Large sophisticated, expensive computers, using the latest
    state-of-the-art technology.


    **switch** It is a control statement which provides multi-way branching that matches
    its argument against each of the pattern arguments in order.


    **syntax** The rules that govern the order of words and relationships in a language.


    **system software** It is a collection of programs written to service other programs,
    such as the basic input-output system (bios), device drivers, an operating system,
    typically a graphical user interface and so on.


    **terminal node** A node that has no children (i.e., with zero degree).


    **top** The end from which elements are added and/or removed from a stack.


    **traverse** Moving through all the nodes in the binary tree, visiting each node
    in the tree exactly once.'
