    \ above declarations are used you won't get error messages, but the compiler would\
    \ treat these variables as automatic variables.\n\n# 2.11.3 Static Storage Class\n\
    \nThe word static in general refers to anything that is inert to change. In a\
    \ program if static variables are declared within individual blocks they are local\
    \ to the block in which they are declared. The static variables retain their values\
    \ throughout the life of the program. Hence, if a block is exited and then re-entered\
    \ at a later time, the static variables declared in that block will retain their\
    \ values (i.e., the static variable is not destroyed on exit from the block, instead\
    \ its value is preserved, and becomes available again when the block is executed\
    \ next time. Hence, the static variables are initialized only once, when the program\
    \ begins its execution). When declaring a static variable inside a block, it is\
    \ more precise in C to use the keyword static before the definition of the variable.\
    \ The following statement is an example for static variable declaration, static\
    \ int number;\n\nStatic variables are stored in the memory. When a static variable\
    \ is not initialized, it takes a value of zero. The value of the variable persists\
    \ between different function calls in the program. Program 2.16, illustrates the\
    \ scope and life of the static variables.\n\n# Program 2.16:\n\n```\n/* static.c\
    \ */\n#include<stdio.h>\nvoid sum();\n/* Function prototype */\nvoid main()\n\
    {\n    sum();\n    sum();\n    sum();\n    sum();\n}\n/* Function call */\nvoid\
    \ sum()\n{\n    static int x = 1;\n    printf(\"%d \", x);\n    x = x + 1;\n}\n\
    The program displays the following output\n1 2 3 4\n```\n\nWe get the output as\
    \ above because the value of the variable persists (does not change) between different\
    \ function calls. If the variable is not defined as static then the output of\
    \ the program will be\n\n1 1 1 1"
