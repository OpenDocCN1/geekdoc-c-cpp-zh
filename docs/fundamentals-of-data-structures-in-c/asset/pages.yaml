  md: '# 4.12 Short-answer Questions


    # 1. Define a tree.


    A tree is a non-linear, two-dimensional data structure, which represents hierarchical
    relationship between individual data items.


    # 2. Define a path in a tree.


    A path in a tree is a sequence of distinct nodes in which successive nodes are
    connected by edges in the tree.


    # 3. Define terminal nodes in a tree.


    A node that has no children is called as a terminal node. It is also referred
    as a leaf node. These nodes have degree have zero.


    # 4. Define a binary tree.


    A binary tree is a tree, which has nodes either empty or not more than two child
    nodes, each of which may be a leaf node.


    # 5. Define a full binary tree.


    A full binary tree is a tree in which all the leaves are on the same level and
    every non-leaf node has exactly two children.


    # 6. Define a complete binary tree.


    A complete binary tree is a tree in which every non-leaf node has exactly two
    children not necessarily to be on the same level.


    # 7. State the properties of a binary tree.


    The properties of a binary tree includes,


    +   - The maximum number of nodes on level n of a binary tree is 2^(n-1), where
    n >= 1.

    +   - The maximum number of nodes in a binary tree of height n is 2^(n-1), where
    n >= 1.

    +   - For any non-empty tree, n = n0 + 1 where n1 is the number of leaf nodes
    and n2 is the number of nodes of degree 2.


    # 8. What are the different binary tree traversal techniques ?


    The different binary tree traversal techniques are


    +   - Preorder traversal.

    +   - Inorder traversal.

    +   - Postorder traversal.

    +   - Levelorder traversal.


    # 9. What are the tasks performed while traversing a binary tree ?


    The tasks performed while traversing a binary tree are,


    +   - Visiting a node.

    +   - Traverse the left subtree.

    +   - Traverse the right subtree.


    # 10. What are the tasks performed during preorder traversal.


    The tasks performed during preorder traversal,


    +   - Process the root node.

    +   - Traverse the left subtree.

    +   - Traverse the right subtree.'
