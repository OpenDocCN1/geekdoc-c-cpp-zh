  md: 'Postfix notation also referred, as suffix form or reverse polish notation (or
    RPN) is also a way of writing algebraic expressions without the use of parentheses
    or rules of operator precedence.


    A queue is an ordered collection of elements in which insertions are made at one
    end and deletion are made at the other end. The end at which insertions are made
    is referred to as the rear end, and the end from which deletions are made is referred
    to as the front end.


    The primitive operations that can be carried out in a queue are enqueue and dequeue
    operations.


    Enqueue is an operation used to add a new element into the rear end of a queue.


    Dequeue is an operation used to remove an element from the front end of a queue.


    Circular queue is another form of a linear queue in which the last node is connected
    to the first node of the list.


    Deque (Double-ended queue) is another form of a queue in which insertions and
    deletions are made at both the front and rear ends of the queue.


    There are two variations of a deque, namely input restricted deque and output
    restricted deque. The input restricted deque allows insertion at one end (it can
    be either front or rear) only. The output restricted deque allows deletion at
    one end (it can be either front or rear) only.


    The implementation part of the circular queue is same as that of the linear queue,
    except that the last position is connected to the first position of the queue.
    So the front end and rear end moves circularly.


    The implementation part of the circular deque is same as that of the linear deque,
    except that the last position is connected to the first position of the deque.
    So the front end and rear end moves circularly.


