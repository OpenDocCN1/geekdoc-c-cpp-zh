- pgno: 254
  md: '![](img/32da3a4a82d0a65ae37d5228b3ab3ad1_254_0.png)


    # Searching a node


    One of the most important operations that can be done in a binary search tree
    is searching a node.


    +   * Check whether the root node of the binary search tree is NULL. If yes, binary
    search tree is empty and hence terminate the search operation.

    +   * If the binary search tree is not empty, compare the new node data with root
    node data, for the following three conditions.

    +   * If the content of the new node data is equal to the root node data, search
    element is found and hence terminate the process.

    +   * If the content of the new node data is lesser than the root node data, check
    whether the left child of the root node is NULL. If the condition is true, search
    element is not found and terminate the process. Otherwise, consider the left child
    of the root node as the root node and check for the three conditions again.

    +   * If the content of the new node data is greater than the root node data,
    check whether the right child of the root node is NULL. If the condition is true,
    search element is not found, and terminate the process. Otherwise, consider the
    right child of the root node as the root node and check for the three conditions
    again.


    In Program 4.2 searchNode() function is used for searching a node in the binary
    search tree.


    # Modification of a Node


    Steps followed to modify a node in a binary search tree.


    +   * First search the node in the binary search tree using the steps given in
    the searching of a node and then modify the content of the node.


    In Program 4.2, modifyNode() function is used for modifying a node in the binary
    search tree.'
