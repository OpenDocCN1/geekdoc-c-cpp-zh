    # ## 3.2.2 Pop Operation


    POP is an operation used to remove an element from the TOP of the stack. POP operation
    of a stack is also implemented using arrays. When implementing the POP operation,
    underflow condition of a stack is to be checked (i.e., You have to check whether
    the stack is empty or not). The user should not POP an element from an empty stack.
    This type of an attempt is illegal and should be avoided. If such an attempt is
    made, the user should be informed of the underflow condition.


    The following procedure can help you to understand things better.


    +   - Create a function POP() with one argument, the address of the element to
    store the popped value.

    +   - Decrement the TOP variable by 1.


    # ## 3.2.3 PEEK Operation


    PEEK is an operation used to display the element from the TOP of the stack, pointed
    by the TOP pointer without actually removing it. PEEK operation of a stack is
    implemented using arrays. When implementing the PEEK operation, underflow condition
    of a stack is to be checked (i.e., You have to check whether the stack is empty
    or not). The user should not try to PEEK an element from an empty stack. This
    type of an attempt is illegal and should be avoided. If such an attempt is made,
    the user should be informed of the underflow condition.


    The following procedure can help you to understand things better.


    +   - Create a function PEEK() with one argument, the address of the element to
    store the top value.


    # ## 3.2.4 Empty Stack


    If a stack contains no elements, it is referred to as an empty stack. If an element
    is to be popped from a stack, or to view the contents of the stack, you have to
    check whether the stack is empty or not, since elements cannot be popped from
    an empty stack nor contents cannot be displayed from an empty stack. This type
    of an attempt is illegal and should be avoided. If such an attempt is made, the
    user should be informed of the underflow condition. To check whether the stack
    is empty or not, we are using a variable top in Program 3.1. Assume that you are
    initializing the variable top to -1. If the variable top is, -1 during execution
    the output message “Stack underflow on POP” is displayed. This condition is referred
    as empty condition of a stack.'
