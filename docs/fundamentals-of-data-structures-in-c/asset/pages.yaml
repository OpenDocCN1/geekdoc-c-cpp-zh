    # 5.4 Bubble Sort


    The easiest and the most widely used sorting technique among students and engineers
    is bubble sort. This sort is also referred as _sinking sort_. The idea of _bubble
    sort is to repeatedly move the smallest element to the lowest index position in
    the list_. To find the smallest element, the bubble sort algorithm begins by comparing
    the first element of the list with its next element and upto the end of the list
    and interchanges the two elements if they are not in proper order. In either case,
    after such a pass, the smaller element will be in the lowest index position of
    the list. The focus then moves to the next smaller element and the process is
    repeated. Swapping occurs only among successive elements in the list and hence
    only one element will be placed in its sorted order after each pass. Also, note
    that once the elements are placed in its sorted order they are not considered
    for comparison in successive passes. When the focus reaches the end of the list,
    the smallest will be bubbled from whatever has been its original position to the
    first index position in the list and the larger values sink to the last index
    position in the list. The sort terminates after a pass in which no elements are
    interchanged.


    ```

    Algorithm for Bubble Sort


    BUBBLE (ARR, N)


    where ARR is an array of N elements.


    Step 1 : Repeat For I = 0, 1, 2, ..., N-1


    Step 2 : Repeat For J = I+1 to N-1


    Step 3 : If (ARR[I] > ARR[J]) Then


    Interchange ARR[I] and ARR[J]


    [End of If structure]


    Step 4 : Increment J by 1


    Step 5 : [End of Step 2 For loop]


    Step 6 : [End of Step 1 For loop]


    Step 7 : Print the sorted array ARR.


    END BUBBLE()

    ```'
