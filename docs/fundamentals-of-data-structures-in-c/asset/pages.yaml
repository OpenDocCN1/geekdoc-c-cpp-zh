  md: '**piles**

    see stack.


    **pointer**

    It is a variable that represents the location (not the value) of a data item,
    such as a variable or an array element.


    **plotter**

    An output device, which is used to draw graphs and figures using a computer.


    **pop**

    It is an operation in stack which is used to delete an existing element from the
    stack on the top.


    **postfix notation**

    Also called as reverse polish notation, in which the operator is represented after
    its operands.


    **precedence**

    It determines the order in which operations are performed.


    **precision**

    It specifies the number of meaningful digits in value that must be represented
    in a fixed number of binary digits.


    **prefix notation**

    Also called as polish notation, in which the operator is represented before its
    operands.


    **preprocessor**

    It is part of the compiler that manipulates the program text before any further
    compiling is done.


    **previous address field**

    Also referred as the backward link field, which stores the address of its previous
    node.


    **printf**

    It stands for "print function" or "print formatted". This function is used to
    output any combination of digits, characters and strings according to the format
    string on the standard output device.


    **program**

    It is the series of instructions provided to the computer that directs the computer
    in executing a task.


    **programming**

    It is the process of preparing and feeding the instructions into the computer
    for execution.


    **PROM**

    Programmable Read Only Memory. Type of memory where the information can be written
    only once and then onwards it can only be read. Its contents cannot be altered
    in future.


    **pseudocode**

    It is an informal language written in English, particularly used for developing
    algorithms.


    **push**

    It is an operation in stack which is used to add a new element in the stack at
    the top.


    **push-down lists**

    see stack.


    **puts**

    It stands for "put string". This function is used to output a null-terminated
    string on the standard output device.


    **queue**

    It is an ordered collection of elements in which insertions are made at one end
    and deletions are made at the other end.


    **quick sort**

    This sort divides the initial unsorted list in to two parts, such that every element
    in the first list is less than all the elements present in the second list. The
    procedure is then repeated recursively for both the parts, up to relatively short
    sequences, which can be sorted until the sequences, reduces to length one.'
