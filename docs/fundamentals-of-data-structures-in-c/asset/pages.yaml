  md: "# 2.8.2 Defining a Structure\n\nDeclaring a structure merely describes the\
    \ template of the structure. Declaration does not reserve any memory space but\
    \ it creates a new data type. Defining a structure means creating variables to\
    \ access the members in the structure. Creating a structure variable allocates\
    \ sufficient memory space to hold all the members of the structure. Structure\
    \ variables can be created during structure declaration or by explicitly using\
    \ the structure name. The general syntax for defining the structure is,\n\n```\n\
    struct <structure_name>\n{\n    data type member1;\n    data type member2;\n \
    \   data type member2;\n    ......\n    ......\n    data type memberN;\n}structure_variable(s);\n\
    ```\n\nThe structure can be defined declaration itself and an example for defining\
    \ the structure during declaration is,\n\n```\nstruct employee\n{\n    int empno;\n\
    \    char empname[15];\n    float salary;\n}empl;\n```\n\nwhere the structure\
    \ variable emp1 declares a variable emp1 of its type. The structure_variable(s)\
    \ can be declared like ordinary variables and used to access the members of the\
    \ structure. More than one structure_variable can also be declared by placing\
    \ a comma in between the variables. Fig. 2.2 shows the memory allocation for the\
    \ structure employee.\n\n![](img/32da3a4a82d0a65ae37d5228b3ab3ad1_122_0.png)\n\
    \nThe syntax for defining the structure using the structure name is,\n\n```\n\
    struct structure_name structure_variable(s)\n\nor\n\nstructure_name structure_variable(s);\n\
    ```\n\nNote that the keyword struct is optional when defining the structure using\
    \ the structure name."
