- pgno: 229
  md: '# 3.10 Summary


    +   - Some of the important applications of linked lists are stacks and queues.

    +   - Stacks can be implemented by arrays or linked lists.

    +   - A stack is an ordered collection of elements in which insertions and deletions
    are restricted to one end. The end from which elements are added and/or removed
    is referred to as top of the stack.

    +   - Stacks are referred to as Last-In-First-Out (LIFO) lists or piles or push-down
    lists.

    +   - The primitive operations that can be carried out in a stack are push, pop
    and peek operations.

    +   - Push is an operation used to add a new element into a stack.

    +   - Pop is an operation used to remove the top most elements from the stack.

    +   - Peek is an operation used to display the top most element from the stack.

    +   - In array representation of stacks, if a stack contains no elements, it is
    referred to as an empty stack.

    +   - In array representation of stacks, if a stack contains elements equal to
    its size, it is referred to as an fully occupied stack.

    +   - In a linked list, if the stack is pointing to NULL the stack is said to
    be an empty stack.

    +   - If the malloc function returns NULL in a linked list it is referred as an
    fully occupied stack.

    +   - Some of the important applications of stacks are tower of hanoi, reversing
    a string, checking for balanced parenthesis and evaluation of arithmetic expressions.

    +   - Towers of Hanoi is a game in which we are given a tower of n disks, initially
    stacked in increasing size from top to bottom. Next to this tower, we have two
    more towers. The objective is to transfer the entire disks from Tower 1 to entire
    Tower 3 using Tower 2.

    +   - Given an arithmetic expression, what we exactly mean by balanced is that,
    an opening parenthesis of various shapes (parenthesis, a square brace, or a flower
    brace) must match the corresponding last unmatched closing parenthesis symbol
    of the same shape and all parenthesis symbols must be matched when the arithmetic
    expression is finished.

    +   - The different notations for representing arithmetic expressions are infix,
    prefix and postfix notations.

    +   - The normal way of expressing mathematical expressions is called as infix
    notation.

    +   - Prefix notation also referred, as polish notation is a way of writing algebraic
    expressions without the use of parenthesis or rules of operator precedence.'
