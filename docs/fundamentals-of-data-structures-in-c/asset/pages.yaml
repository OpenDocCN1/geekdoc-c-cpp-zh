  md: '# 4.7 The Set Representation, Union and Find Operation


    The Set is a collection of data items that are accessed by operations such as
    Union, Intersection and Set Difference. A Set is an unbound collection of distinct
    elements. Consider the following collection of elements of set S shown in Fig.
    4.21.


    ![](img/32da3a4a82d0a65ae37d5228b3ab3ad1_266_0.png)


    Fig. 4.21 : An example of set.


    The following are some of the different sets formed from the above collection
    of elements.


    ```

    S = (95, 20, 17, 33, 4, 134)

    S = (33, 95, 17, 4, 20, 134)

    S = (134, 20, 95, 4, 17, 33)

    S = (134, 17, 20, 4, 95, 33)

    S = (4, 20, 134, 33, 17, 95)

    S = (17, 134, 33, 95, 4, 20)

    S = (20, 4, 95, 17, 134, 20)

    ```


    Two sets are said to be disjoint set if they do not share any elements. Consider
    Fig. 4.21 which shows the two disjoint sets.


    ![](img/32da3a4a82d0a65ae37d5228b3ab3ad1_266_1.png)


    Fig. 4.22 : An example of disjoint set.


    The above two sets are disjoint, since they do not share any elements between
    each other.


    The different operations that are carried in a set / disjoint set are as follows,


    +   - find(x) - Find the unique representative of the set that contains "x".

    +   - union(x,y) - Combine the sets containing "x" and "y" in to a single set
    (note that before union operation "x" and "y" must be in different sets).

    +   - make(x) - Create a single set, containing the element "x".


    ![](img/32da3a4a82d0a65ae37d5228b3ab3ad1_266_2.png)


    Fig. 4.23 : Sets to explain find operation'
