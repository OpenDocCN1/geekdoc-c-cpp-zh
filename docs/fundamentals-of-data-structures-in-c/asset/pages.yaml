    # Circular Linked list


    Circular linked list is another form of a linked list in which the last node of
    the list is connected to the first node in the list. There are different types
    of circular linked lists. They can be classified as,


    +   - Circular singly linked list

    +   - Circular doubly linked list.


    Note that a circular linked list looks like a cyclic list and will not have any
    *end-of-list* (i.e., there is no NULL pointer). Fig. 3.8 shows the structure of
    a circular linked singly list. Fig. 3.9 shows the structure of a circular linked
