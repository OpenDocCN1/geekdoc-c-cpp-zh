    # 3.8.2 Converting Infix Expression to Postfix Form


    Evaluation of an expression using computers can be done in different ways. Some
    programmers may try to parse the expression and find out the operators that have
    the highest priority, calculate them and later evaluate the expression with operators
    of lower priority. But if parenthesis and functions are added to the expression
    it will soon be very complicated to do the calculation. An easier way to calculate
    it is to convert the expression from infix notation to postfix notation. This
    may first look very strange but this is much easier when we need to do calculations
    on a computer.


    # The following procedure is used to convert infix to postfix expression


    +   - Read the infix string.

    +   - Traverse from left to right of the expression.

    +   - If an operand is encountered, add to the postfix string.

    +   - If an operator is encountered push it on the stack, if any of the following
    conditions are satisfied.

    +     - The stack is empty.

    +     - If the precedence of the operator at the top of the stack is of lower
    priority than the operator being processed.

    +   - If all the above condition fails, then pop the operator being processed
    to the postfix string.

    +   - When the infix string is empty, pop the elements of the stack onto the postfix
    string to get the result.


    **Algorithm for Infix to Postfix Conversion**


    IN_TO_POST(INSTR : STRING, POSTSTR : STRING)


    Where INSTR contains infix expression & POSTSTR stores the resultant expression


    Step 1 : Initialize the Stack


    Step 2 : While (INSTR != NULL)'
