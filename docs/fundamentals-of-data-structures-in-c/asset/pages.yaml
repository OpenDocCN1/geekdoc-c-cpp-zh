    (IC/ microprocessor) as its CPU.


    **merge sort** It is the most commonly used external sorting. A file is divided
    into two subfiles. These files are compared, one pair of records at a time, and
    merged by writing them to other files for further comparisons.


    **Modularity** Process of splitting a large program / project in to smaller modules
