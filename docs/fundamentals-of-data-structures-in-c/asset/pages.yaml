    # 3.5 Linked Lists


    Linked list or List is an ordered collection of elements. Each element in the
    list is referred as a node. Each node contains two fields namely,


    +   - Data field

    +   - Link field.


    The data field contains the actual data (i.e., value) of the element to be stored
    in the list and the link field also referred as the next address field contains
    the address of the next node in the list. Fig. 3.6 helps you understand things
    better.


    ![](img/32da3a4a82d0a65ae37d5228b3ab3ad1_173_0.png)


    Fig. 3.6 : Representation of a linked list.


    The linked list shown in Fig. 3.6 consists of three nodes, each with a data field
    and a link field. A linked list contains a pointer, referred as the head pointer,
    which points to the first node in the list that stores the address of the first
    node of the list (i.e., FB12). The data field contains the actual information
    which is to be'
