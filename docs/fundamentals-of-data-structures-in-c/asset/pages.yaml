  md: '![](img/32da3a4a82d0a65ae37d5228b3ab3ad1_272_0.png)


    A graph is called as a null graph, if it has no vertices. A graph is called as
    a sub graph of another graph, if all the vertices and edges, are also available
    in the another graph. A graph is called as a connected graph, if there exists
    a path from any one vertex to all other vertex. In a pair of distinct vertices
    if there is a directed path from every vertex to all other vertex then the directed
    graph is said to be strongly connected graph. It is also referred as a complete
    graph. A complete digraph with n vertices will have n (n-1) edges. A complete
    undirected graph with n vertices will have n (n-1)/ 2 edges. Fig. 4.36 shows a
    strongly connected digraph. A directed graph is said to be weakly connected graph,if
    any vertex does not have a directed path to any other vertices. Fig. 4.37 shows
    the weakly connected digraph.


    The indegree of a vertex in a digraph is the number of edges entering into the
    vertex. The outdegree of a vertex in a digraph is the number of edges exiting
    from the vertex. The degree of a vertex is calculated by the sum of indegree and
    outdegree in a digraph. In Fig. 4.37, the indegree of the vertex c is 2, whereas
    the outdegree of the vertex c is 0. A vertex whose indegree is 0 is referred as
    source vertex and the vertex whose outdegree is 0 is referred as a sink vertex.
    A vertex, which has no edge is referred to as an isolated vertex. A vertex whose
    indegree is 1 and outdegree is 0 is referred to as pendant vertex. A graph is
    said to be a weighted graph if every edge in the graph is assigned some weight
    or value. The weight of an edge is a positive value that may be representing the
    distance between the vertices or the weights of the edges along the path. Fig.
    4.38 shows the weighted graph.


    # 4.9 Graph Representation and its Operations


    Graphs are generally represented in the following scheme as,


    +   - Incidence Matrix

    +   - Adjacency Matrix

    +   - Adjacency List.


