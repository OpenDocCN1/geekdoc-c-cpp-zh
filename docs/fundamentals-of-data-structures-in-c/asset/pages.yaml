- pgno: 199
  md: '# 3.8 Evaluation of Arithmetic Expressions


    An expression consists of two components namely operands and operators. Operators
    indicate the operation to be carried out on operands. There are two kinds of operators
    used in evaluating expressions, namely unary and binary operators. Unary operators
    require only one operand to carry out its intended operation whereas binary operators
    require two operands to carry out its intended operation. Most operators used
    are binary in nature. Computers solve arithmetic expressions by restructuring
    them. So that the order of each calculation is embedded in the expression. Once
    converted, an expression can then be solved in one pass.


    There are three ways of representing expressions in computers. They are,


    +   * Infix notation

    +   * Prefix notation

    +   * Postfix notation.


    The prefixes of the notations “in”, “pre”, and “post” refers to the position of
    the operands with respect to the operators. All the ways mentioned above, use
    the operator and operand in different ways in evaluating an expression. Table
    3.1 shows the different ways of representing an expression.


    | Notation | Arithmetic expression | Example |

    | :--- | :--- | :--- |

    | INFIX | Operand OPERATOR Operand | a+b |

    | PREFIX | OPERATOR Operand Operand | +ab |

    | POSTFIX | Operand Operand OPERATOR | ab+ |


    # The Infix Notation


    The normal way of expressing mathematical expressions is called as infix notation.
    In this form of expressing an arithmetic expression the operator comes in between
    its operands. For example, an expression to add numbers a and b is written in
    infix form as

    ( a + b )


    Note that the operator + is written in between the operands a and b. We are accustomed
    to this type of infix notations. However, algorithmically, postfix and prefix
    notations are easier to evaluate than infix notation. Hence, let us discuss the
    conversion of infix to postfix notation and infix to prefix notations.


    # Advantages of Infix Notations


    +   * It is the mathematical way of representing the expression.

    +   * It’s easier to see visually which operation is done from first to last.'
  merge: -1
  img_proc: true
- pgno: 200
  md: '# The Prefix Notation


    Prefix notation also referred, as **polish notation** is a way of writing algebraic
    expressions without the use of parenthesis or rules of operator precedence. A
    Polish mathematician **Jan Lukasiewicz** introduced prefix notation. In this form
    of expressing an arithmetic expression, the operator is written before its operands.
    For example, an expression to add numbers `a` and `b` is written in prefix form
    as


    ```

    ( + a b )

    ```


    Note that the operator "+" is written before the operands `a` and `b`.


    # The Postfix Notation


    Postfix notation also referred, as **suffix form** or **reverse polish notation**
    ( or RPN) is also a way of writing algebraic expressions without the use of parentheses
    or rules of operator precedence. This was also introduced by Jan Lukasiewicz.
    In this form of expressing an arithmetic expression the operator is written after
    its operands.


    For example, an expression to add numbers “a” and “b” is written in postfix form
    as


    ```

    ( a b + )

    ```


    Note that the operator + is written after the operands `a` and `b`.


    # Advantages of Postfix Notations


    +   - You need not worry about the rules of precedence.

    +   - You need not worry about the rules for right to left associativity.

    +   - You need not need parenthesis to override the above rules.


    To evaluate an infix expression, set of rules such as precedence, associativity
    of operators have to be followed, which is rather complex to remember. The prefix
    and postfix notations may look awkward to use as they might look at first. But
    the reasons for using these notations that a fairly simple algorithm exists to
    evaluate arithmetic expressions using a stack.


    # 3.8.1 Conversions of Notations


    The main problem in evaluating an expression is to decide the order in which the
    operations are carried out. The order of evaluation of the expression (a+b) is
    quite simple. If the expression is complex, we require knowledge of the operators,
    their precedence to specify the order of evaluation of the expression.


    To fix the order of evaluation for an expression, we assign priority for operators.
    The operators with the highest priority will be evaluated first. Since we give
    more importance to binary operators, the most important binary operations according
    to their order of priority are listed in Table 3.2. Note that by using parenthesis
    we can override the default precedence of operators.'
  merge: -1
  img_proc: true
- pgno: 201
  md: '# Table 3.2 : Binary Operations in their Order of Priority


    | Priority | Operation (symbol) |

    |---|---|

    | 1 | Exponentiation (↑) |

    | 2 | Multiplication (*), Division (/) |

    | 3 | Addition (+), Subtraction (-) |


    In Table 3.2, the priority is listed in the order of highest to lowest. When unparenthesized
    operators of the same precedence are scanned, the order of evaluation is assumed
    from right to left (except for exponentiation whose precedence is left to right).


    To every infix expression, there corresponds a postfix expression that has the
    same effect. The reverse is not true because, there is an ambiguity. The infix
    expression x+y*z can be represented as either xyz+* or xy+z* in postfix. The reason
    for the ambiguity is the lack of parenthesis in the infix expression. If the infix
    expression were fully bracketed, there would be no ambiguity. Thus (x+y)*z and
    x+(y*z) pairs with xy+z* and x(y+z)+.


    # Rules to be followed during infix to postfix conversion


    +   - Fully parenthesize the expression starting from left to right (During parenthesizing,
    the operators having higher precedence are first parenthesized).

    +   - Move the operators one by one to their right, such that each operator replaces
    their corresponding right parenthesis.

    +   - The part of the expression, which has been converted into postfix, is to
    be treated as single operand.

    +   - Once the expression is converted into postfix form, remove all parenthesis.


    # Example 3.1


    Evaluate the infix expression 3 + 8 * 4 / 2 - (8 - 3) in postfix notation.


    # SOLUTION :


    The order of evaluation of infix expression is as follows,


    ```

    Infix expression : 3 + 8 * 4 / 2 - (8 - 3)

    ```


    ```

    Postfix notation : 3 8 4 * 2 / + 8 3 - -

    ```


    : The result of the the infix expression in postfix notation is 14 .'
  merge: -1
  img_proc: true
- pgno: 202
  md: '# Example 3.2


    Give the postfix form for the infix expression x + y * z.


    # Solution :


    The order of evaluation of postfix is

    Parenthesize the operands with operator having

    the highest priority = x + (y * z)

    Move the operator inside parenthesis to the right

    of the operand = x + (y z *)

    Consider the part of the expression converted to

    postfix as a single operand = x + A [A=(yz*)]

    Parenthesize the sub-expression = (x + A)

    Move the operator inside parenthesis to the right

    of the operand = (x A +)

    Substitute the value for A = (x (yz*)+)

    Remove all parenthesis = xyz*+

    .: The required postfix form is xyz*+


    # Example 3.3


    Give the postfix form for the infix expression p + q / r - s.


    # Solution :


    The order of evaluation of postfix is

    Parenthesize the operands with operator having

    the highest priority = p + (q / r) - s

    Move the operator inside parenthesis to the right

    of the operand = p + (q r /) - s

    Consider the part of the expression converted to

    postfix as a single operand = p + A - s [A=(qr/)]

    Parenthesize the sub-expression with operator

    having the highest priority = (p + A) - s

    Move the operator inside parenthesis to the right

    of the operand = (p A +) - s [B=(pA+)]

    Consider the part of the expression converted to

    postfix as a single operand = B-s

    Parenthesize the sub-expression = (B - s)

    Move the operator inside parenthesis to the right

    of the operand = (B s -)

    Substitute the value for B = ((pA+) s -)

    Substitute the value for A = ((p (qr/)+) s -)

    Remove all parenthesis = pqr/+s-

    .: The required postfix form is pqr/+s-'
  merge: -1
  img_proc: true
- pgno: 203
  md: '# Example 3.4


    Give the postfix form for the infix expression (m - n) / p * q + r ↑ s * t.


    SOLUTION :


    +   The order of evaluation of postfix form is = (m n -) / p * q + r ↑ s * t

    +   Move the operator inside parenthesis to the right of the operand = (m n -)
    / p * q + r ↑ s * t

    +   Consider the part of the expression converted to postfix as a single operand
    = A / p * q + r ↑ s * t [A=(mn-)]

    +   Parenthesize the sub-expression with the operator having the highest priority
    = A / p * q + (r ↑ s) * t

    +   Move the operator inside parenthesis to the right of the operand = A / p *
    q + (r s ↑) * t

    +   Consider the part of the expression converted to postfix as a single operand
    = A / p * q + B * t [B=(rs↑)]

    +   Parenthesize the sub-expression with the operator having the highest priority
    from left to right = (A / p) * q + B * t

    +   Move the operator inside parenthesis to the right of the operand = (A p /)
    * q + B * t

    +   Consider the part of the expression converted to postfix as a single operand
    = C * q + B * t [C=(Ap/)]

    +   Parenthesize the sub-expression with the operator having the highest priority
    from left to right = (C * q) + B * t

    +   Move the operator inside parenthesis to the right of the operand = (C q *)
    + B * t

