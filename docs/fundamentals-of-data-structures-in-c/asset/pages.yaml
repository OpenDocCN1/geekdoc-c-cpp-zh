    # 4.9.3 Adjacency List


    A graph containing m vertices and n edges can be represented using a linked list,
    referred to as adjacency list. The number of vertices in a graph forms a singly
    linked list. Each vertex has a seperate linked list, with nodes equal to the number
    of edges connected from the corresponding vertex. Fig. 4.42 and Fig. 4.43 show
    the undirected and directed graph. Fig. 4.44 shows the adjacency lists for the
    graph shown in Fig. 4.42 and Fig. 4.43. Even though adjacency list is a difficult
    way of representing graphs, a graph with large number of nodes will use small
    amount of memory.'
