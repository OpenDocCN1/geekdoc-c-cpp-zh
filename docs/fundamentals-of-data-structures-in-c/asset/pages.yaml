- pgno: 157
  md: 'Dynamic data structures can be broadly classified as linear data structures
    and non-linear data structures. Linear data structures, have a linear relationship
    between its adjacent elements. Linked lists are examples of linear data structures.
    A linked list is a linear dynamic data structure that can grow and shrink during
    its execution time. Elements can be inserted and deleted from any end of the list.
    If the elements are inserted and deleted in the same end, then the list is referred
    to as a Stack. If the elements are inserted in one end and deleted in another
    end, then the list is referred to as a Queue. A circular linked list is similar
    to a linked list except that the first and last nodes are interconnected.


    Non-linear data structures does not have a linear relationship between its adjacent
    elements. In a linear data structure, each node has a link which points to another
    node, where as in a non-linear data structure, each node may point to several
    other nodes. A tree is a non-linear dynamic data structure that may point to one
    or more nodes at a time. A graph is similar to tree except that it has no hierarchical
    relationship between its adjacent elements.


    # 3.1.1 Stacks


    A stack is an ordered collection of elements in which insertions and deletions
    are restricted to one end. The end from which elements are added and/or removed
    is referred to as top of the stack. Stacks are also referred as “piles” and “push-down
    lists”. The first element placed in the stack will be at the bottom of the stack.
    The last element placed in the stack will be at the top of the stack. The last
    element added to stack is the first element to be removed. Hence stacks are referred
    as Last-In-First-Out (LIFO) lists.


    Consider Fig. 3.1 where five discs are placed one over the other through a shaft.
    If we want to insert a new disc say 6. It is possible to insert the disc on the
    top of disc 5. Because of the presence of shaft, it is not possible to insert
    the disc 6 in the middle of the discs. Similarly, if we want to remove a disc
    say 4, it is only possible to remove the disc 5 first and then the disc 4 and
    so on. Because of the presence of the shaft, it is not possible to remove the
    disc from the middle of the discs. This similar operation is carried out in a
    stack.


    ![](img/32da3a4a82d0a65ae37d5228b3ab3ad1_157_0.png)


    ![](img/32da3a4a82d0a65ae37d5228b3ab3ad1_157_1.png)


    Fig. 3.1 : Shaft with five discs.


    Fig. 3.2 : Stack operation.'
