  md: '23. What is the difference between a pre-increment and a post-increment operation
    ?

    A pre-increment operation such as ++a, increments the value of a by 1, before
    a is used for computation, while a post-increment operation such as a++, uses
    the current value or present value of a in the calculation and then increments
    the value of a by 1.


    # 24. Distinguish between break and continue statement.


    | break | continue |

    |---|---|

    | a) Used to terminate the loops or to exit loop from a switch. | a) Used to transfer
    the control to the start of loop. |

    | b) The break statement when executed causes immediate termination of loop containing
    it. | b) The continue statement when executed caused immediate termination of
    the current iteration of the loop. |


    # 25. Distinguish between while and do-while loops.


    | while loop | do-while loop |

    |---|---|

    | a) The while loop tests the condition before each iteration. | a) The do-while
