    # Important points to be noted while using return statement


    +   - The limitation of a return statement is that it can return only one value
    from the called function to the calling function.

    +   - The return statement can be present anywhere in the function, not necessarily
    at the end of the function.

    +   - Number of return statements used in a function are not restricted, since
    the return statement which executes first will returns the value from the called
    function to the calling function and the other return statements are left unexecuted.

    +   - If the called function does not return any value, then the keyword void
    must be used as the return type specifier.

    +   - Parenthesis used around the expression in a return statement is optional.


    # 2.1.3 Function Prototypes


    C function returns an integer value by default. When a function has to return
