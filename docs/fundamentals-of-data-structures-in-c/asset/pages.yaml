- pgno: 405
  md: "```\ncase 2 :\n    printf(\"Welcome\");\ncase 3 :\n    printf(\"Hai\");\n}\
    \ }\n```\n\nRemember that if a break statement is not included at the end of a\
    \ case then execution will continue to the next case. Since in the above program\
    \ we have not used break after the printf() in case1, case2 and case3, the control\
    \ prints all the messages.\n\nThe program segment should be\n\n```\nswitch(x)\n\
    {\n    case 1 :\n        printf(\"Hello\");\n        break;\n    case 2 :\n  \
    \      printf(\"Welcome\");\n        break;\n    case 3 :\n        printf(\"Hai\"\
    );\n        break;\n}\n```\n\n# 17. Using a continue statement in a switch statement\n\
    \nIt is a common error to use the continue statement instead of break statement\
    \ in a switch statement. Note that the continue statement works only in loops,\
    \ and never with a switch statement.\n\n# 18. Crossing the bounds of an array\n\
    \nExample :\n\n```\n#include<stdio.h>\nmain()\n{\n    int x[50], i, sum = 0;\n\
    \    for(i = 1; i < 100; i++)\n        sum += x[i];\n}\n```\n\nIn the array x\
    \ there is no such element as x[50], since array counting begins with 0 and not\
    \ 1. Compiler would give warning if the program exceeds the bounds.\n\nNote that\
    \ all indices starts from 0 and not 1.\n\n# 19. Missing braces at the end of a\
    \ compound statement\n\nIt is common error to forget to close brace when using\
    \ a loop. It will be usually detected by the compiler because an opening brace\
    \ should have a closing brace. However, if we put a matching brace in a wrong\
    \ place, the compiler won't notice the mistake and the program will produce unexpected\
    \ results."
  merge: -1
  img_proc: true
- pgno: 406
  md: "# 20. Inserting a semicolon at the end of macro definition\n\nA macro definition\
    \ must not end with a semicolon. A semicolon may cause confusion to the compiler\
    \ and results in error messages.\n\nExample :\n\n```\n# define SIZE 40;\n```\n\
    \nThe above macro definition should be\n\n```\n# define SIZE 40\n```\n\n# 21.\
    \ Confusing a character constant and a character string\n\nIn the statement\n\n\
    ```\nch = 'x';\n```\n\na single character is assigned to ch. In the statement\n\
    \n```\nstr = \"x\";\n```\n\na pointer to the character string \"x\" is assigned\
    \ to str.\n\nNote that in the first case, the declaration of ch would be\n\n```\n\
    char ch;\nchar *str;\n```\n\n# 22. Forgetting to reserve an extra location in\
    \ a character array (string) for the null terminator\n\nRemember that each character\
    \ array ends with a null character ('\\0'), therefore its dimension should be\
    \ declared big enough to hold the characters in the array as well as the null\
    \ character.\n\nExample : For storing a string \"ANITRA\" the dimension of the\
    \ array should be 8\n\n```\ni.e., char string[8] = \"ANITHRA\";\n```\n\n# 23.\
    \ Missing quotes\n\nEvery string must be enclosed in double quotes, while a single\
    \ character constant must be enclosed in single quotes. If we miss the quotes,\
    \ the string or the character would be referred to as a variable name.\n\nExample\
    \ :\n\n```\nif(output == NO)\n    mark = B;\n```\n\nIn the above example NO and\
    \ B are treated as variables and therefore an error message \"undefined variable\
    \ B\", \"undefined variable NO\" will occur.\n\n# 24. Passing the wrong argument\
    \ type to a function\n\nFor example,\n\n```\nabc = fleet_sum(5) ;\n```\n\nIf the\
    \ fleet_sum function is expecting a floating-point argument, then the above statement\
    \ will produce a result with errors, since an integer value is being passed. We\
    \ can use a typecast operator to explicitly convert a value that is passed to\
    \ a function."
  merge: -1
  img_proc: true
- pgno: 407
  md: "# 25. Omitting return type declarations\n\nOmitting the return type of a function\
    \ is a syntax error, if the function returns any other value other than int.\n\
    \nFor example,\n\n```\nabc = sum (a) ;\n```\n\nIf the return type for a function\
    \ is not declared explicitly then the compiler will assume that is function returns\
    \ a value of type int. Hence, it is a good programming practice to use void as\
    \ a return type.\n\n# 26. Mismatch of arguments in the function definitions and\
    \ the function call\n\nIt's a syntax error to call a function, which doesn't match\
    \ with the arguments present in function definition or function declaration.\n\
    \n# 27. Defining a function inside another function\n\nIt's a syntax error to\
    \ define a function inside another function. However, you can call a function\
    \ from any other function.\n\n# 28. Confusing the operator (->) with the operator(.)\
    \ when referencing structure variables.\n\nNote that, the dot or period operator\
    \ (.) is used for structure variables, while the arrow operator -> is used for\
    \ structure pointer variables. So if 'a' is a structure variable then the notation\
    \ a.b is used to refer the member b of a, where as if 'a' is a pointer to a structure,\
    \ then the notation a -> b is used to refer the member b of the structure pointed\
    \ to by b.\n\n# 29. Leaving a blank space between the name of a macro and its\
    \ argument list in the #define statements\n\nFor example,\n\n```\n#define PAY\
    \ (m, n) (30, 80)\n```\n\nThe above macro definition is incorrect, as the preprocessor\
    \ considers the first blank space after the defined name as the start of the definition\
    \ of that name.\n\nThe definition should be\n\n```\n# define PAY(M, N) (30, 80)\n\
    ```\n\n# 30. Omitting parenthesis around arguments in macro definition\n\n```\n\
    #define SQR(x) x * x\nmain()\n{\n int y;\n y = 16/SQR(4);\n printf(\"%d\", y);\n\
    }\n```\n\nIn the above example we would expect the value of y to be 1, but the\
    \ value will be 16. this happens because on preprocessing the arithmetic statements\
    \ takes the form of\n\n```\ny = 16 / 4 * 4 ;\n```\n\nthe arithmetic statement\
    \ should be\n\n```\ny = 16/(SQR(4));\n```"
  merge: -1
  img_proc: true
