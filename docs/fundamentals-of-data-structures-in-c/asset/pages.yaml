    # 2.15 Short-answer Questions


    # 1. Define a function


    A function is a self-contained program segment (group of segments) that performs
    some specific well-defined task.


    # 2. How is a function invoked ?


    A function is called by specifying its name, followed by a pair of parenthesis,
    which contains parameters or arguments if required.


    # 3. What are the information, we can get from the function declaration ?


    The information that can be obtained from a function declaration are


    +   - Name of the function

    +   - Number, order and the type of arguments supplied to the function

    +   - Type of the value returned by the function.


    # 4. What are function prototypes? Where they are placed ?


    Defining a function before it is accessed is called as function prototype. Function
    prototypes are generally placed at the start of the program before the main( )
    function.'
