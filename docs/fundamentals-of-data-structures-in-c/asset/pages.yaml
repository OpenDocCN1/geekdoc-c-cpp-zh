    # 1.9 Decision Making and Branching Statements


    In case of C programs, that we have seen so far, the statements are normally executed
    sequentially as they appear in the program. By default, the statements in the
    program are executed sequentially. However, in practice we have situations where
    we may have to change the order of execution of statements until specified conditions
    are met. These kinds of situations are dealt in C using decision control statements.


    One of several possible actions will be carried out depending upon the outcome
    of the logical test is referred as branching. Some portion of the program has
    to be executed several number of times or until a particular condition is being
    met. This is referred as looping. The different decision control or decision-making
    statements in C are


    +   - The if statement

    +   - The if-else statement

    +   - The switch statement

    +   - The conditional operator

    +   - The break, continue and goto statements.


