  md: "# 2.9 Structure within a Structure\n\nNested structures are nothing but a structure\
    \ within another structure (i.e., a structure can contain one or more structures\
    \ as its members). A structure may be defined and/or declared inside another structure.\
    \ For example,\n\n```\nstruct employee\n{\n    int empno;\n    char name[15];\n\
    \    struct employ_add\n    {\n        int no;\n        char street[15];\n   \
    \     char area[15];\n        long pincode;\n    }address;\n    char deptname[15];\n\
    \    float salary;\n}empl, emp2;\n```\n\nIn the above structure declaration employee\
    \ is the main structure. It gets additional information about the employee address\
