    +   The gets() and puts() deals functions with string input and output respectively.


    +   The if-else statement is used to execute an action when the condition is true
    and another action when the condition is false.


    +   Any number of if-else statements can be included in a program, but the condition
    specified inside each group of if statement should be different.


    +   A multiple if-else statement can test for many different cases. If more than
    one condition is true, only the statements after the first true condition will
    be executed.


    +   Switch control statement allows us to make a decision from a no of choices,
    but it can test for equality.


    +   The four keywords used in a switch statement are switch, case, break and default.


    +   A default is optional in a switch statement. The default may appear any where
    inside the switch statement.


    +   The break statement is used to terminate or exit from a switch statement.


    +   The continue statement is used to transfer the control to the beginning of
    the loop.


    +   The goto statement is used to transfer the control to a loop or function from
    one point to any other portion in that program where it encounters a label.


    +   A segment of the program that is executed repeatedly is called as a loop.


    +   Note that the condition specified in the while/do-while loop should eventually
    become false at one point of program, otherwise the loop will become an infinite
    loop.


    +   An array is a group of elements of same data type that share a common name
    and that are differentiated from one another by their positions within the array.
    The individual values in the array are called as elements.


    +   The array name should be unique and should be a valid C variable name.


    +   Each element in an array is referred by specifying the array name followed
    by one or more subscripts enclosed in square braces.


    +   A subscript must always be a positive integer or an integer expression.


    +   Arrays can be initialized to the same type in which they are declared.


    +   It is an error to specify more initializers than the number of elements in
    the array.


    +   It is not necessary to specify the length of an array, explicitly in case
    if initializers are provided for the array during declaration itself.'
