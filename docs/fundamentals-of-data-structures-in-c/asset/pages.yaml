  md: '+   - The enum data type gives an opportunity to define your own data type
    with a set of named integer constants.

    +   - Constant in C refers to fixed values that do not change during execution
    of a program.

    +   - A character constant contains a single character enclosed within a pair
    of single quotes.

    +   - A string constant or a literal consists of a sequence of characters enclosed
    in double quotes. It may contain any number of digits, letters, escape sequences,
    and spaces.

    +   - End of a string constant is marked with a single character referred as the
    NULL character.

    +   - A quantity which may vary during execution of a program is called as a variable.

    +   - An operator is a symbol or a special character that tells the compiler to
    perform certain mathematical and/or logical operations.

    +   - The sizeof operator is a keyword which returns the size of the operand in
    bytes.

    +   - The conditional operator denoted by (?:) is used to evaluate conditional
    expressions.

    +   - A statement in a program carries out some specific action. Statements used
    in C are classified as expression, compound and control statements.

    +   - An expression statement consists of valid C expressions, ending with a semicolon.

    +   - A group of valid C expression statements placed within an opening flower
    brace ''{'' and a closing flower brace ''}'' is referred as a compound statement.

    +   - Comment statements used in a program must be enclosed in with /* and */.
    They may or may not be present in a program.

    +   - The preprocessor directive #include<stdio.h> refers to a special file which
    contains the information about the various standard input and output operations
    which must be included in the program when it is compiled.

    +   - Every C program must contain at least one function, which must be a main.
    A program will always begin by executing the main() function.

    +   - All statements used in both declaration and execution parts must end with
    a semicolon.

    +   - The formatted input/output functions read any type of data as input from
    the user and displays any type of data as output in the screen. They use format
    strings for identifying the type of the data involved.

    +   - All unformatted input/output function reads and displays only char data
    type. They don''t use format strings for identifying the type of the data involved,
    since all data are considered in character format.

    +   - The scanf() function referred as the input statement is used to read formatted
    input from the user through the keyboard.'
