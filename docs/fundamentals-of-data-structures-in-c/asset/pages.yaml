- pgno: 131
  md: "# 2.11 Storage Classes\n\nIn C, all classes have data types and storage classes.\
    \ Data type refers to the type of information represented by a variable (i.e.,\
    \ int, char, etc.). Storage classes determine the storage of the variable, initial\
    \ value of the variable if not initialized, life of the variable (i.e., how long\
    \ the variable would be active in the program) and the scope of variables within\
    \ the program. Scope of a variable is defined as the region over which the variable\
    \ is visible or valid. Scope is usually established by a set of flower braces.\
    \ Any variable declared in C have only one of the four storage classes. They are,\n\
    \n+   - Automatic storage class\n+   - Register storage class\n+   - Static storage\
    \ class\n+   - External storage class\n\n# 2.11.1 Automatic Storage Class\n\n\
    Variables defined inside a block and are local to the block in which they are\
    \ declared, are referred as automatic variables or local variables. Automatic\
    \ variables can only be accessed by the block in which they are declared. Any\
    \ another block cannot access its value.\n\nWhen declaring a local variable inside\
    \ a block, it is more precise in C to use the keyword auto before the declaration\
    \ of the variable. The following statement is an example for local variable declaration:\n\
    \n```\nauto int number;\n```\n\nThese variables are created as new variables each\
    \ time the block is executed, and they are destroyed when the block encounters\
    \ a return statement or the closing brace of the block. The life of the variable\
    \ will be inside the block in which it is declared. The C compiler treats any\
    \ variable declared inside a block as an automatic variable by default. So the\
    \ keyword auto is not necessary along with the variable declaration. Automatic\
    \ variables are stored in memory. When an automatic variable is not initialized,\
    \ it takes an unpredictable value referred as garbage value. Program 2.14, illustrates\
    \ the scope and life of automatic variables.\n\n# Program 2.14:\n\n```\n/* auto.c\
    \ *\n#include<stdio.h>\nvoid main()\n{\n    auto int x = 5;\n    {\n        auto\
    \ int x = 4;\n        {\n            auto int x = 3;\n```"
  merge: -1
  img_proc: true
