  md: '+   A pointer is a variable, that represents the memory location (not the value)
    of a data item, such as a variable or an array element.


    +   Like all variables a pointer variable also should be declared before they
    are used.


    +   The ampersand operator (&) gives the address of a variable.


    +   The three values that can be used to initialize a pointer are zero, null and
    address.


    +   A pointer that has not been initialized is referred to as the dangling pointer.


    +   The arithmetic operations that are performed on pointers are addition and
    subtraction.


    +   Arguments to a function are passed in two ways. They are, call by value and
    call by reference.


    +   Call by value is the process of passing the actual value of variables.


    +   Call by reference is the process of calling a function using pointers to pass
    the address as argument must include a pointer as its parameter.


    +   A structure is a derived type usually representing a collection of variables
    of same or different data types grouped together under a single name.


    +   The keyword struct begins the structure declaration followed by the structure
    name, the structure members are enclosed in braces, followed by the semicolon
    which ends the structure declaration.


    +   A structure definition creates a new data type that can be used to declare
    variables.


    +   The variables or data items in a structure are called as members of the structure.


    +   Usually the structure type declaration appears at the top of the source code
    file, before any variables or functions are defined.


    +   The tag name for a structure is optional. If the structure is defined without
    a tag name, the variables of the derived data type must be declared in the structure
    definition, and no other variables of the new structure can be declared.


    +   A structure variable may be initialized with a structure variable of the same
    type.


    +   A member of a structure is always referred and accessed using the member access
    operator via the structure variable name.


    +   A structure that contains another structure as its member is called as nesting
    of structures or structure within a structure.


    +   Array of structures are defined as a group of data of different data types
    stored in consecutive memory locations with a common variable name. You can also
    use arrays as structure members.


    +   A structure containing a member that is a pointer to the same structure type
    is called as a self-referential structure.


    +   The structure pointer operator (->) is used for accessing a member of a structure
    via a pointer to the structure.


    +   A bit field is a built-in feature that allows you to access a single bit.
    They must be defined as a member of a structure and declared as type unsigned
    or int.'
