  md: "# ## 2.8 Structure\n\n*A structure* is a derived type usually representing\
    \ a collection of variables of same or different data types grouped together under\
    \ a single name. The variables or data items in a structure are called as *members*\
    \ of the structure. A structure may contain one or more integer variables, floating-point\
    \ variables, character variables, arrays, pointers, and even other structures\
    \ can also be included as members. Structures help to organize data, particularly\
    \ in large programs, because they allow a group of related variables to be treated\
    \ as a single unit.\n\nThere are two fundamental differences between an array\
    \ and a structure. One is, an array demands a homogeneous data type, i.e., the\
    \ elements of an array must be of the same data type, where as a structure is\
    \ a heterogeneous data type, since it can have any data type as its member. The\
    \ second difference is that elements in an array are referred by their positions,\
    \ where as members in a structure are referred by their unique names.\n\n# ###\
    \ 2.8.1 Declaring a Structure\n\nStructure declarations are somewhat more complex\
    \ than array declarations since a structure must be defined in terms of its individual\
    \ members. The general form or the syntax of declaring a structure is\n\n```\n\
    struct <structure_name>\n{\n    data type member1;\n    data type member2;\n \
    \   data type member2;\n    ..... .....\n    data type memberN;\n};\n```\n\nIn\
    \ the above declaration, *struct* is a keyword, followed by an optional user-defined\
    \ structure name usually referred as a tag, which is used to identify the structure,\
    \ and then the list of members with its data types. The list of member declarations\
    \ is enclosed in a pair of flower braces. The closing brace of the structure and\
    \ the semicolon ends the structure declaration. A typical example of declaring\
    \ a structure is\n\n```\nstruct employee\n{\n    int empno;\n    char empname[15];\n\
    \    float salary;\n};\n```\n\nwhere *employee* is the name of the structure (i.e.,\
    \ tag). The structure *employee* contains three members of type *int*, *char*\
    \ and *float* representing *empno*, *empname* and *salary* respectively."
