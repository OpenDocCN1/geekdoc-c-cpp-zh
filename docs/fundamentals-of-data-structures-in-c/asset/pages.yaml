    # Masking


    Masking is a process in which a given pattern is transformed into another bit
    pattern by means of bit wise operator. The original bit pattern is one of the
    operands in the bitwise operation. The second operand called as the mask is a
    specially selected bit pattern that brings the desired transformation. Usually
    logical bitwise AND operator (&) is used for masking.'
