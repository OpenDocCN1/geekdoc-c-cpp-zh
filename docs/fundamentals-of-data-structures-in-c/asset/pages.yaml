    # Fig. 4.5 : Linear representation of binary trees in Fig. 4.4.


    # 4.3.2 Linked Representation of Binary Trees


    The disadvantages of linear representation of binary trees, such as wasting memory
    space and difficulty in inserting and deleting a node in a tree are overcome by
    representing binary trees in linked representation. As we know that each node
    in a binary tree has two child nodes, each node in linked representation requires
    3 fields, the left child field (denoted as Lfield), the right child field (denoted
    as Rfield) and the data field (denoted as Dfield). Further, the root field contains
    the location of the root node. Hence, it requires 3 arrays and a variable to implement
    linked representation of binary trees. If any subtree is empty, then the corresponding
    pointers (i.e., Lfield and Rfield) will store a NULL value. If the tree itself
    is empty, then the root field will store a NULL value.'
