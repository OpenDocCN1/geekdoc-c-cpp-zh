- pgno: 151
  md: '# 5. When is the execution of a function terminated ?


    The execution of a function is terminated when it executes the return statement
    or when the last statement of the function is executed.


    # 6. State the function of a return statement.


    A function of a return statement is to return a value from the function. Since
    it is usually placed at the end of a function, return statement also terminates
    the function.


    # 7. What are the types of passing variables to a function ?


    There are two types of passing variables to functions. They are,


    +   - Call by value

    +   - Call by reference.


    # 8. Define scope of a variable.


    Scope of a variable is defined as the region over which the variable is visible
    or valid. Scope is usually established by a set of flower braces.


    # 9. Define auto variables.


    Variables defined inside a function and are local to the function in which they
    are declared are called as auto variables. They are also called as local variables.


    # 10. Define register variables.


    Variables defined inside a function and declared as register are called register
    variables. They are stored in CPU registers and can be accessed faster than other
    variables which are stored in memory.


    # 11. Define static variables.


    The variables, which retain their values throughout the life of the program, are
    called as static variables.


    # 12. Define external variables.


    Variables that are both alive and active throughout the entire program are called
    as external variables. They are also called as global variables. These variables
    are usually declared above the main() function.


    # 13. Distinguish between local and global variables.


    | Local variables | Global variables |

    |---|---|

    | a) These are declared within the body of the function. | a) These are declared
    outside the function. |

    | b) These variables can be referred only within the function in which it is declared.
    | b) These variables can be referred from any part of the program. |

    | c) The value of the variables disappear once the function finishes its execution.
    | c) The value of the variables disappear only after the entire execution of the
    program. |'
