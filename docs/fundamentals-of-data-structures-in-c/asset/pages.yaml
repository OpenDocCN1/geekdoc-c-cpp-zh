  md: '**radix sort** It derives its name from the fact that while sorting the data,
    it considers the radix (digit position) of elements from lower order byte to higher
    order byte and sorts the data items in the list.


    **RAM** Random Access Memory. It is a read write memory, in which the contents
    can be read and can be used to write any information on it. It forms the major
    part of the main memory.


    **realloc** It stands for "re allocation". This function increases or decreases
    the size of dynamically allocated block of memory.


    **rear end** The end at which insertions are made in a queue.


    **recursion** It is a process by which a function calls itself repeatedly until
    some specified condition has been satisfied.


    **register variable** It is similar to an auto variable which is used to store
    variables in the CPU register in order to access them as quickly as possible.


    **register** It is a storage class specifier.


    **return** It is used to mark the end of a function execution and to transfer
    the control back to the calling function.


    **return value** It is the value sent by the called function to the calling function.


    **right sub trees** All the nodes to the right of a given node in a binary tree.


    **right-skewed binary tree** It is a binary tree, which has only right child nodes.


    **ROM** Read Only Memory. It is a RAM fabricated with permanently stored information,
    which cannot be erased. It is a non-volatile memory.


    **root** See root node.


    **root node** It is the highest level or the first level in a tree.


    **sorting** Rearranging a group or sequence of elements or data items in either
    ascending or descending order depending upon the relationship among the data items
    present in the group.


    **scanf** It stands for "scan function" or "scan formatted" This function is used
    to get input any combination of digits, characters or strings according to the
    format string from the standard input device.


    **searching** It is a programming technique that determines whether an element
    or a data item is present in the given list or not.


    **secondary memory** The memory, which is not directly connected to the CPU and
    stores the data and instructions permanently.


    **selection sort** Successive elements are selected from a file or from an array
    and placed in their proper position.


    **sequential search** The value to be found is searched, from left to right one
    by one until the element is found or until the end of the list is reached. This
    search doesn''t require that the data items in the list to be in sorted order.


    **short** It is a data type modifier that can be applied to some of the basic
    data types to decrease their size.


    **siblings** The child nodes of a given parent node.'
