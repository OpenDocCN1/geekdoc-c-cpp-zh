    # # 1.6.2 User-defined Data Types


    C supports a feature known as type definition that allows the user to define new
    data types that are equivalent to existing data types. This technique in some
    situations can help to clarify the source code of a program. The user-defined
    data type identifier can later be used to declare variables.


    # ## Type Definition


    The keyword typedef is used to define new data type names. Note that you are not
    actually creating a new data type, but rather defining a new name for an existing
    data type. The general form or the syntax of defining a new data type is


    ```

    typedef data type identifier;

    ```


    where identifier refers to new name(s) given to the data type. Few examples of
    type definition are


    ```

    typedef int age;

    typedef float average;

    ```


    where age symbolizes int and average symbolizes float. They can be later used
    to declare variables as


    ```

    age child, adult;

    average mark1, mark2;

    ```


    where child and adult are declared as integer variables whereas mark1 and mark2
    are declared as floating-point variables. Using type definition you can create
    meaningful data names for increasing the readability of the program. They also
    suggest the purpose of the data type names used in the program.'
  merge: -1
  img_proc: true
- pgno: 31
  md: '# Enumerated Data Type


    The enumerated data type gives an opportunity to invent your own data type with
    a set of named integer constants represented by identifiers that specifies all
    the valid values a variable of that type may have. They can be used in any expression
    where integer constants are valid.


    The general form or the syntax of enumerated data type is,


    ```

    enum identifier { enumeration_list } list_of_variables;

    ```


    where enum is a keyword, which is used to specify the enumerated data type, identifier
    is an user-defined enumerated data type which can be used to declare the enumeration_list
    also referred as enumeration constants. Both the identifier and the list_of_variables
    are optional, but at least one must be present. For example, the enumeration


    ```

    enum month(JANUARY, FEBRUARY, MARCH, APRIL, MAY, JUNE, JULY,

    AUGUST, SEPTEMBER, OCTOBER, NOVEMBER, DECEMBER);

    ```


    creates a new type month in which the enumeration_list is JANUARY . . . , DECEMBER.


    The values for the enumeration list are set automatically to integers 0 to 11.
    To number the enumeration_list from 1 to 12 the enum declaration should be


    ```

    enum month(JANUARY = 1, FEBRUARY, MARCH, APRIL, MAY, JUNE, JULY,

    AUGUST, SEPTEMBER, OCTOBER, NOVEMBER, DECEMBER);

    ```


    where the first enumeration_list (i.e., JANUARY) is explicitly set to 1 and hence
    the remaining values are incremented from 1, and result in values of 1 to 12.
    To define a variable for the new type month, the statement


    ```

    enum month month_start, month_end;

    ```


    declares month_start and month_end as variables for the new type month.


    # 1.6.3 Empty Data Type


    The keyword void is used to indicate an empty data type. This data type is not
    used to declare any variables, but used to indicate nothing. When used as a function
    return type, void means that the function does not return a value. When used in
    a function parameter list, void means the function does not take any parameters.


