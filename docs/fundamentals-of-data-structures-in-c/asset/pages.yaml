    the memory to 0. |

    | coreleft(void) | Returns a measure of RAM memory not in use. |

    | farcalloc(n, size) | Allocates n multiple blocks of (n * size) bytes larger
    than 64K. |

    | farcoreleft(void) | Returns a measure of RAM memory not in use beyond the highest
    allocated block. |

    | farfree(*ptr) | Releases a block of memory previously allocated by farcalloc(),
    farmalloc(), & farrealloc() pointed by ptr. |

    | farmalloc(size) | Allocates a block of (size) bytes larger than 64K. |

    | farrealloc(*ptr, size) | Reallocates the size of the allocated block to size
    pointer by ptr previously allocated by farcalloc() / farmalloc(), copying the
    contents to a new location, if necessary. |

    | free(*ptr) | Releases a block of memory previously allocated by calloc(), malloc(),
    & realloc() pointed by ptr. |

    | malloc(size) | Allocates a block of (size) bytes. |

