    # 2.1.2 The return Statement


    The return statement is used to return the control from the called function to
    the next statement of the calling function. The return statement also causes the
    program logically to return to the point from where the function is accessed (called).
    The return statement returns one value per call. The return statement can be any
    one of the types as shown below.


    ```

    return;

    return();

    return(constant);

    return(variable);

    return(expression);

    return(conditional expression);

    return(condition);

    ```


    The first and second return statements, does not return any value, and are just
    equal to the closing brace of the function. If the function reaches the end without
    using a return statement, the control is simply transferred back to the calling
    portion of the program without returning any value. The presence of an empty return
    statement (without any expression or constant or variable) is recommended in such
    situations. These return statements return a value 1 to the calling function.


    The third return statement returns a constant to the calling function.


    For example,


    ```

    if(x <= 1)

    return(1);

    ```


    The return statement returns a constant 1 when the condition specified inside
    the if statement evaluates to true.


    The fourth return statement returns a variable to the calling function.'
