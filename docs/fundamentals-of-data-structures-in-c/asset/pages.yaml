- pgno: 7
  md: '# # PREFACE


    We feel immense pleasure in introducing the book Fundamentals of Data Structures
    in C for the students of Anna University–ECE course. Although, a number of textbooks
    are available on data structures, this text attempts to be different from the
    rest. It aims at fulfilling the needs of those who want to get acquainted with
    programming in C and to write programs in C for various data structures with algorithms.


    Algorithms in this book are presented for complicated data structures followed
    by complete executable C programs. These algorithms allow the reader to focus
    on the approach to solve a problem without concern about declaration of variables
    and the specifications of the programming language.


    This book is organised into 5 chapters. Chapters 1 and 2 explain the basic concepts
    in C, and Chapters 3–5 implement C language for writing programs using various
    data structures. All the concepts in the book are illustrated by diverse examples,
    wherever required. All the programs in this text have been tested and debugged
    for two errors. We have strived hard to make sure that all the concepts illustrated
    in this text have been accompanied by worked out examples.


    Although this book is written primarily for examination purposes, the practical
    aspect has been kept in view and hope that it will appeal to the students and
    practicing engineers alike. This book has been written particularly focusing on
    the questions and programs of various university examinations of the past 5 years.


    Every effort has been made to present the topics and programs from the fundamentals
    in an easy and expressive language for the convenience and better understanding
    of the readers. This book contains more than 100+ programs and 450+ multiple choice
    questions. A large number of illustrative examples are given throughout the book,
    to instill the basics of of data structures in C programming language and the
    logic behind it, in the readers mind.


    +   - P Sudharsan

    +   - J John Manoj Kumar'
  merge: -1
  img_proc: true
