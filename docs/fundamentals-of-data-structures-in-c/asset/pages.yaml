    that represent the individual output data items. Each character group must begin
    with a % sign followed by a conversion character, which indicates the type of
    corresponding data item. A simple form of printf() function may be


    ```

    printf("%d", a);

    ```


    where variable a has been previously declared as integer and %d is called as the
    conversion specifier. Its role is to specify that the number is to be converted
    to decimal notation before it is displayed in the screen.


