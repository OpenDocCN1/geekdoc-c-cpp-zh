    # 4.7.2 Path Compression


    Consider we have an algorithm, that does all the basic computations (i.e., insert,
    delete, modify, view and traversal) in a relatively faster time, but sometimes
    the search operation can take relatively more time because of the shape in a given
    tree. To decrease the time taken for the search operation, after we do a search
    on a node N, remember the path of the node N to the root. Then traverse the path
    a second time and make all the nodes in the path to point to the root of the tree.
    This shortens the length of the path from the node accessed to the root node and
    makes the tree shorter. This technique is referred to as path compression. Fig.
    4.32 shows the tree before path compression in which node G is to be searched.
    Fig. 4.33 shows the tree after path compression, where all the nodes of the tree
    and connected to the root node of the tree “A”.'
