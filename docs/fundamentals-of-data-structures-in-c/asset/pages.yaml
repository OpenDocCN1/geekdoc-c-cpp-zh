  md: '# ## 1.12 One Dimensional Arrays


    Arrays whose elements are specified by a single subscript are called as *one-dimensional*
    or *single dimension* or *single-subscribed* or *linear arrays*. The arrays that
    we have seen so far are all one dimensional arrays. A list of items can be given
    a variable name using only one subscript and such a variable is called as a one
    dimensional array also referred as a list. The main purpose of declaration of
    an array is to reserve space for the elements in memory. The general form or the
    syntax of an array declaration is


    ```

    storageType dataType arrayName[size];

    ```


    The *storageType* while declaring an array is optional. The *storageType* may
    be either *auto*, or *register*, or *static*, or *extern*. Refer Section 2.12
    for storage classes. The *dataType* specifies the type of element that will be
    stored in the array. The *arrayName* is the name used to identify the array. The
    rules for naming arrays are same as identifiers. The *size* is a positive integer
    constant, indicating the maximum number of elements that can be stored in the
    array. Each subscript must be expressed as a non-negative integer. In an n-element
    array, the array elements are stored in `x[0], x[1], ..., x[n-2], x[n-1]` as shown
    in **Fig. 1.8**.


    ![](img/32da3a4a82d0a65ae37d5228b3ab3ad1_59_0.png)


    **Fig. 1.8 : Memory allocation of a one dimensional array.**


    # ## 1.12.1 Declaring Arrays


    Like ordinary variables, an array variable should also be declared. The general
    form or the syntax of declaring an array is


    ```

    datatype arrayName[subscript];

    ```


    where *arrayName* is a valid C variable of type *datatype* and *subscript* is
    an integer constant indicating the maximum number of elements that can be stored
    in the array. For example the declaration,


    ```

    int days[31];

    ```


    is read as “days, an array of 31 int values”. In the above declaration, *int*
    specifies the data type of the variable, just as it does with ordinary variables
    and the word *days* specifies the name of the array. The number 31 is the size
    of the array, which tells that 31 elements of type *int* is to be stored in the
    array. This number is referred as the dimension of the array. The square brackets
    ( [] tell the compiler, that we are dealing with arrays. **Note that an array
    should not have the same name as an ordinary variable in the same block or function.**


    ```

    int value[50];

    char book[102];

    extern float amount[20];

    ```


    In the first example, *int* specifies the type of the variable, and the word *value*
    specifies the name of the array. The number 50 within square braces indicates
    the maximum number'
