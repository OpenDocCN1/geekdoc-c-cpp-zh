  md: 'where `char` is a data type, `name` is the variable and 10 is the size of the
    variable that can hold a maximum of ten characters including NULL character (i.e.,
    the character array name can store 9 characters from `name[0]` to `name[8]` and
    the variable `name[9]` is used for storing the NULL character ‘\0’). Similarly,
    `book` is an array of characters that can hold a maximum of 20 characters.


    When declaring character arrays, an additional memory space is allocated for the
    NULL character. Each character within double quotes is treated as an element of
    an array and stored in the memory. When the compiler encounters a string constant
    "Franklin" it appends the string constant with an additional NULL character. The
    string constant "Franklin" can be read using the `scanf()` function as


    ```

    scanf("%s", name);

    ```


    The `scanf()` function usually accepts an address of the variable, since the name
    of the array, by itself indicates the starting address of the array and hence
    we don’t use an ampersand (&) before the variable name while reading strings.
    **It is an error if you use an ampersand before variable names when reading strings.**
    The `%s` option uses a blank space as a delimiter, since it considers the character
    separated by a blank space as two separate strings. Note that the array name is
    used without a subscript in the `scanf()` function, since we are reading the array
    of characters as a string.


    # ## 1.15.2 Initializing Strings


    A character array can be initialized by a string constant, resulting in the first
    element of the array being set to first character in the string, the second element
    to the second character and so on. The array also receives the terminating ‘\0’
    in the string constant. The initialization may be


    ```

    char name[7] = "GANDHI";

    ```


    which is equivalent in declaring as


    ```

    char name[] = { ''G'', ''A'', ''N'', ''D'', ''H'', ''I'', ''\0'' };

    ```


    In the first method of initialization, ‘\0’ is not necessary, since C inserts
    the NULL character automatically at the end of the string. But in the next method
    of initialization, NULL termination must be specified at the end, following the
    list of character elements. Mentioning the size of the array while initializing
    its value is optional. As we know that each string is an array of characters,
    we can also initialize the character of the string individually as we always do
    when we initialize an array. The same string "GANDHI" can also be initialized
    as


    ```

    name[0] = ''G'';

    name[1] = ''A'';

    name[2] = ''N'';

    name[3] = ''D'';

    name[4] = ''H'';

    name[5] = ''I'';

    name[6] = ''\0'';

    ```'
