- pgno: 69
  md: "# 1.15.3 Reading Strings\n\nThere are three ways to read a string from the\
    \ user through the keyboard. They are,\n\n+   - By using the scanf() function\n\
    +   - By using the gets() function\n+   - By using loops.\n\n# By using scanf()\
    \ function\n\nThe scanf() function with format string %s can be used to read a\
    \ string from the user.\n\nFor example,\n\n```\nmain()\n{\n   char name[25];\n\
    \   scanf(\"%s\", name);\n}\n```\n\nThe disadvantage of scanf() function is that\
    \ there is no way to read a multi-word string (i.e., string with spaces) into\
    \ a single character array variable. The scanf() function terminates its input\
    \ when it encounters a blank space.\n\nFor example, if the input for the scanf()\
    \ function is\n\nUnited Kingdom\n\nThe string United will be read in to the variable\
    \ name, and the string kingdom will not be read since the %s option uses a blank\
    \ space as a delimiter, it considers the string seperated by a blank space as\
    \ two strings. Note that the array name is used without subscripts in the scanf()\
    \ function while reading strings.\n\n# By using gets() function\n\nThe gets()\
    \ function with the array name can also be used to read a string from the keyboard.\
    \ The gets() function overcomes the disadvantage of the scanf() function, since\
    \ it can read a string of any length with any number of blank spaces and tabs.\
    \ It gets terminated only when an ENTER key is pressed (i.e., only when it encounters\
    \ a new line character).\n\nFor example,\n\n```\nmain()\n{\n   char name[20];\n\
    \   gets(name);        /* String read from a keyboard */\n}\n```\n\nIf the input\
    \ to be read is “United Kingdom” then the whole string is stored in the array\
    \ name. It accepts the blank space between “United” and “Kingdom” as a part of\
    \ the input string. The disadvantage of gets()function is that, it can be used\
    \ to read only a single string at a time."
