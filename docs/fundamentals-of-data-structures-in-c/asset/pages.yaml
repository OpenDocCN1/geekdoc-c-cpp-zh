    Recursive functions can be effectively used to solve problems where the solution
    is expressed in terms of successfully applying the same solution to the subsets
    of the problem. Don''t be frightened by the apparent complexity of recursive functions.
    They are sometimes the simplest answer for evaluating certain mathematical functions.
    However, there is always an alternative non-recursive solution available. This
    will normally use loops and may lack elegance of the recursive solution.


    # Important points to be noted while using functions


    +   - C program may contain one or more functions.

    +   - A function can be called any number of times.

    +   - A function can be called from any other function.

    +   - The called function returns only one value per call.

    +   - A function declaration must end with a semicolon.

    +   - A function definition should not end with a semicolon.

    +   - A function cannot be defined within another function definition.

    +   - A function that can call itself until a condition is satisfied is called
    recursion.

    +   - A function cannot be declared and defined more than once in a program.

    +   - A function definition may appear in any order.

    +   - The function name in the function call and the function definition should
    be the same.

    +   - The order in which functions are defined in a program and the order in which
    they are called need not be the same.

    +   - If a function takes no arguments, a parenthesis after the function name
    is a must.

    +   - The type, order, and number of actual arguments must be the same as that
    of the formal arguments.


    # Advantages of Recursive Functions


    +   - Used to create clearer and simpler versions of several algorithms.

    +   - Memory occupied when the recursive function is called is very less compared
    to an ordinary function.

    +   - Recursion is a very useful way of creating and accessing certain dynamic
    data structures such as linked lists, stacks, queues, etc.'
