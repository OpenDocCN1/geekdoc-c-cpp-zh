    represents the logical relationship that exists between individual elements of
    data to carry out certain tasks. In other words, a data structure defines a way
    of organising all data items that consider not only the elements stored but also
    stores the relationship between the elements. To develop a program for an algorithm,
    we should first decide the steps and select an appropriate data structure for
    that algorithm. The choice and implementation of a data structure is as important
    for easier manipulation of data. Therefore, algorithms and data structures are
    closely related to each other for developing a program.


    Arrays let you access lots of data fast with the ability to access its individual
    elements. You can have arrays of any data type. However, you cannot make arrays
    bigger if your program decides it needs more space, but we can build our own set
    data type out of arrays to solve this problem if necessary. A data structure is
    an actual implementation of an array.


    # ### Primary Data Structures


    **Primary data structures** are the basic data structures that directly operate
    upon the machine instructions. They have different representations on different
    computers. All the basic constants (integers, floating-point numbers character
    constants, string constants) and pointers are considered as primary data structures.


    # ### Secondary Data Structures


    **Secondary data structures** are more complicated data structures derived from
    primary data structures. They emphasize on grouping same or different data items
    with relationship between each data item. Secondary data structures can be broadly
    classified as static data structures and dynamic data structures. If a data structure
    is created using static memory allocation, (i.e., a data structure formed when
    the number of data items are known in advance) it is known as **static data structure**
    or **fixed size data structure**. If a data structure is created, using dynamic
    memory allocation (i.e., a data structure formed when the number of data items
    are not known in advance) is known as **dynamic data structure** or **variable
    size data structure**.'
