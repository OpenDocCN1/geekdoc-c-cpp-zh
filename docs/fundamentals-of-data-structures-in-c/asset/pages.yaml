  md: '# Chapter 4


    # Non-Linear Data Structures


    # 4.1 Introduction


    The data structures that we have seen in *Chapter 3* is linear data structures,
    since they have a linear relationship between its adjacent elements. The data
    structures that we are going to see in this chapter are non-linear data structures,
    since they don''t have a linear relationship between its adjacent elements. In
    a linear data structure, each node has a link which points to another node, where
    as in a non-linear data structure, each node may point to several other nodes.
    Some of the non-linear data structures include, trees and graphs.


    A **tree** is a non-linear, two-dimensional data structure, which represents hierarchical
    relationships between individual data items. *Fig. 4.1* shows a simple tree structure.
    Natural trees grow upwards from the ground into the air. But the tree data structure
    grows downwards from top to bottom. This is the universally accepted way of representing
    tree data structure. A **tree** is a non-empty collection of nodes and edges that
    satisfies the following requirements.


    +   - It has a special data item referred as the root of the tree.

    +   - All remaining data items are partitioned into number of subsets, each of
    which itself is a tree, and are referred as **subtrees**.


    Each data item in a tree is referred as a **node**. It is the basic structure
    of a tree. It specifies the information part of each data item. There are totally
    24 nodes in the tree represented in *Fig. 4.1*. An **edge** also referred as a
    **link** is a connection between two nodes. A **path** in a tree is a sequence
    of distinct nodes in which successive nodes are connected by edges in the tree.
    In *Fig. 4.1*, the path between A and X is given by the node paths (A,C), (C,H),
    (H,Q) and (Q, X). An important property of a tree is that there should be precisely
    one path connecting any two nodes. If there is no path between some pair of nodes,
    or if there is more than one path between some nodes, then we call the structure
    as a **graph** and not a tree.


    The highest level or the first level in a tree is referred as a **root** or **root
    node**. In *Fig. 4.1*, A is referred as the root node. Each link to the root node
    refers to a **child** or **child node**. In *Fig. 4.1*, nodes B, C, D and E are
    referred as child nodes to the parent'
