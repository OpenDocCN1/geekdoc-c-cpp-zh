  md: "# 3.6.3 PEEK Operation\n\nPEEK operation is used to display the element from\
    \ the TOP of the stack, pointed by the TOP pointer without actually removing it.\
    \ PEEK operation of a stack is also implemented using linked lists. When implementing\
    \ the PEEK operation, underflow condition of a stack is to be checked. The user\
    \ should not try to PEEK an element from an empty stack. This type of an attempt\
    \ is illegal and should be avoided.\n\n```\nAlgorithm to Retrieve the Contents\
    \ from the Top of the Stack\n\nPEEK(VALUE : INTEGER)\nGLOBAL: TOPSTK : STACK\n\
    TEMP : STACK\nStep 1 : If (IS EMPTY() == 1)\n    Return -1\n    [End of If Structure]\n\
    Step 2 : TEMP = TOPSTK\nStep 3 : VALUE = TEMP -> DATA\nStep 4 : Return 0\nEnd\
    \ PEEK()\n```\n\n# 3.6.4 Traversing a Stack\n\nTo read the information or to display\
    \ the information in a stack, you have to traverse (move) a linked list, node\
    \ by node from the first node, until the end of the list is reached. Traversing\
    \ a list involves the following steps,\n\n+   - Assign the address of TOP pointer\
    \ to a variable.\n+   - Display the information in the data field.\n+   - Traverse\
    \ the list from one node to another by advancing the pointer upto NULL.\n\n```\n\
    Algorithm for Displaying the Contents of the Stack\n\nVIEW()\nGLOBAL: TOPSTK :\
    \ STACK\nTOP : STACK\nStep 1 : If (IS EMPTY() == 1)\n    Print \"Stack is EMPTY\"\
    \n    Return\n    [End of If Structure]\nStep 2 : TOP = TOPSTK\nStep 3 : Do While(TOP\
    \ != NULL)\n    Print \"Value is\", TOP -> DATA\n    TOP = TOP -> NEXT\n    [End\
    \ of Step 3 While Structure]\nEnd VIEW()\n```"
