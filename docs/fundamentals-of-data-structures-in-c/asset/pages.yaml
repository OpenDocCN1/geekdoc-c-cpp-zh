  md: "The syntax of a union is identical to that of a structure except that the keyword\
    \ struct is replaced with the keyword union. An example for declaring a union\
    \ is\n\n```\nunion exam\n{\n    int roll_no;\n    char name[15];\n    int mark1,\
    \ mark2, mark3;\n};\n```\n\nIn the above example, union exam has 5 members. Second\
    \ member is a character array name having 15 characters (i.e., 15 bytes). Second\
    \ member is of type int that requires 2 bytes for their storage. All the other\
    \ members mark1, mark2, mark3 are integers which requires 2 bytes for their storage.\
    \ Fig. 2.3 shows the memory allocation of members of union exam.\n\n![](img/32da3a4a82d0a65ae37d5228b3ab3ad1_129_0.png)\n\
    \nIn the union, all these 5 members are allocated in a common place of memory\
    \ (i.e., all the members share the same memory location). A union shares the memory\
    \ space instead of wasting storage on variables that are not being used. The compiler\
    \ allocates a piece of storage that is large enough to hold the largest type in\
    \ the union. In the above declaration, the member name requires, 15 characters,\
    \ which is the maximum of all members, hence a total memory space of 15 bytes\
    \ is allocated. In case of structures, the total memory space allocated will be\
    \ 23 (i.e., 15+2+2+2+2) bytes.\n\n# Program 2.12 :\n\n```\n/* size.c */\nunion\
