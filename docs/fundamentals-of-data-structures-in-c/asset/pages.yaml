    # 2.3 Recursion


    Recursion is a process by which a function calls itself repeatedly until some
    specified condition has been satisfied. A function is called recursive if a statement
    within the body of a function calls the same function. Recursion is a process
    of defining something in terms of itself. When a recursive program is executed,
    the recursive function calls are not executed immediately. They are placed on
    a stack (Last In-First-Out) until the condition that terminates the recursive
    function. The function calls are then executed in reverse order, as they are popped
    off the stack. Program 2.8, helps you to understand things better.'
