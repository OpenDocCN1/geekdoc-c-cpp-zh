  md: '# 3.7.2 Dequeue Operation


    DEQUEUE is an operation used to remove an element from the FRONT of the queue.
    The DEQUEUE operation of a queue can also be implemented using singly linked lists.
    The following procedure can help you to understand things better.


    +   - Create a function DEQUEUE() with three parameters, the FRONT pointer, the
    REAR of the queue and the address in which the last element to be deleted is stored.

    +   - Create a temporary pointer (i.e., tempptr) to hold the removed element.

    +   - Assign the FRONT pointer to the temporary pointer.

    +   - The FRONT pointer is made to point the node after the first node, and the
    other nodes remain unchanged.

    +   - free the allocated memory of the temporary pointer by using RELEASENODE().


    | Algorithm for Releasing the Memory for the Node to be Deleted |

    | :--- |

    | RELEASENODE(NEWNODE : QUEUE) |

    | Step 1 : Deallocate the space for the QUEUE of NEWNODE |

    | Step 2 : Return |

    | End RELEASENODE() |


    | Algorithm for Removing a Node from the Queue |

    | :--- |

    | DEQUEUE(FRONT : QUEUE, REAR : QUEUE, VALUE : DATA) |

    | TEMP : QUEUE |

    | Step 1 : If (FRONT == NULL AND REAR == NULL) |

    | Print "QUEUE is Underflow" |

    | Return -1 |

    | [End of if Structure] |

    | Step 2 : Set TEMP = FRONT |

    | Step 3 : Set VALUE = FRONT -> DATA |

    | Step 4 : If (FRONT == REAR) |

    | Set REAR = NULL |

    | [End of if Structure] |

    | Step 5 : Set FRONT = FRONT -> NEXT |

    | Step 6 : RELEASENODE(TEMP) |

    | Step 7 : Return 0 |

    | End DEQUEUE() |


    Fig. 3.13a shows the queue before the DEQUEUE operation. In Fig. 3.13b a temporary
    pointer (i.e., tempptr) is created and is made to point the node, which is to
    be removed (i.e., The node pointer by the FRONT pointer). The FRONT pointer is
    made to point the node after the first node, and the other nodes remain unchanged.
    The memory allocated by the temporary pointer is freed. Thus, the element pointed
    by the FRONT pointer is removed from the queue.'
