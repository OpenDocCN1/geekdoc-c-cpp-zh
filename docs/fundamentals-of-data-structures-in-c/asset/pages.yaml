    # Rules for initializing an array


    +   - If the number of initializers is less than the number of elements in the
    array, the remaining elements are set to zero. For example, int value[5] = {21,
    5, 79};

    +   - It is an error to specify more initializers than the number of elements
    in the array. For example, int value[2] = {4, 3, 2, 1, 5, 7};

    +   - It is not necessary to specify the length of an array, explicitly in case
    if initializers are provided for the array during declaration itself. For example,
    int value[] = { 5, 4 };

    +   - A character array can be initialized by a string constant, resulting in
    the first element of the array being set to the first character in the string,
    the second element to the second character and so on. The array also receives
    the terminating ''\0'' in the string constant. The initialization may be char
    name[7] = "GANDHI"; which is equivalent to char name[7] = {''G'', ''A'', ''N'',
    ''D'', ''H'', ''I'', ''\0''};


    # 1.13 Two-Dimensional Arrays


    Arrays whose elements are specified by two subscripts are referred as two-dimensional
    arrays or two dimensional arrays. A two-dimensional array is defined in the same
    manner as a one dimensional array except that it requires two pairs of square
    brackets for two subscripts. The two-dimensional array is also referred as a matrix.
    Each subscript must be expressed as a non negative integer. The general form or
    the syntax of a two-dimensional array is


    ```

    storageType dataType arrayName[rowsize][colsize];

    ```


    where the storageType may be either auto, or static, or extern. The storageType
    while declaring an array is optional. The dataType specifies the type of element
    that will be stored in the array. The arrayName is the name used to identify the
    array. The rules for naming array names are same as identifiers. The rowsize and
    colsize are positive value integer constants. These two subscripts indicate, the
    number of array elements associated with each subscript. Two square braces are
    used to indicate the values of two subscripts. For example,


    ```

    int mark[2][2];

    ```


    defines a table as an integer array having 2 rows and 2 columns. An array element
    starts with an index zero and so the individual elements of the array will be


    ```

    int mark [0][0] [0][1]

    [1][0] [1][1]

    ```'
