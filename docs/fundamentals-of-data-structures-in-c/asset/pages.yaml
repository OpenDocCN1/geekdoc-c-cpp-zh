  md: '# 10. Define internal address.


    Internal address is the address stored in each node of the linked list except
    the last node. The content stored in the link field (also referred as next address
    field) is the address of the next node.


    # 11. Define null address.


    Null address is the address stored by the NULL pointer of the last node of the
    list, which indicates the end of the list.


    # 12. State the use of previous address field and next address field in a linked
    list.


    The previous address field also referred as the backward link field, of a node
    contains address of its previous node. The next address field also referred as
    the forward link field, contains the address of the next node in the list.


