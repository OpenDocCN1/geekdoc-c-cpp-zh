- pgno: 23
  md: '# # 1.3 Compilation and Linking Processes


    Compilation and linking processes of a C program are necessary before executing
    a C program. Usually, creating and executing a C program for a specific task involves
    the following processes.


    +   - Typing and editing a program

    +   - Pre-processing a program

    +   - Compiling a program

    +   - Linking a program

    +   - Executing a program.


    # ## Typing and Editing a Program


    In order to write or create a C program the program codes have to be typed using
    the editor tool and saved as a file with extension .c. For example, Program 1.1
    in this book is typed and saved as firstpgm.c. The C program editor is basically
    a text editor for creating a program and will have facility to type, modify, save,delete,
    etc.


    # ## Pre-processing a Program


    The pre processing is the process performed by the compiler when a program compile
    command is initiated. In pre-processing, the entire program file is scanned to
    identify the macros, header files and commands. The macros and header files are
    expanded and commands are removed.


    For example, in Program 1.1, the header file stdio.h contains the information
    about various input and output operation which will be included and the command
    line enclosed with /* */ are removed.


    # ## Compiling a Program


    The compilation is the process of converting the pre processed program into the
    object program and save the object program with .obj extension. The Program 1.1
    will be saved as firstpgm.obj after compilation.


    Before creation of object program, the source program undergoes debugging. After
    all the errors are identified and rectified, the analysis and synthesis phase
    of the compilation are carried. Analysis is the process where the source program
    is divided into small elements and internal representation of the source program
    is generated. Synthesis is the phase where the machine code is generated which
    is the object program.


    # ## Linking a Program


    Linking is the process of converting the object program in to an executable program.
    The output of linking process is saved with file extension .exe. When program
    is developed in modules the object program of various modules are linked to single
    executable file by the linker.'
  merge: -1
  img_proc: true
- pgno: 24
  md: '# Executing a Program


    Running the .exe file of a program is called execution. Upon executing the .exe
    file the task for which the program is written will be carried by the system or
    computer.


    ![](img/32da3a4a82d0a65ae37d5228b3ab3ad1_24_0.png)


    # 1.4 Constants


    Constants are tokens in C program representing fixed numeric or character values
    that do not change during the execution of a program. Fig. 1.2, shows the various
    types of constants in C.


    # 1.4.1 Integer Constants


    C deals with several kinds of numbers, one of the most frequently used is the
    whole number, usually called as an integer. An integer constant refers to a sequence
    of digits without a decimal point. Integer constants can be specified in the following
    three ways.


    +   - Decimal integer constant

    +   - Octal integer constant

    +   - Hexadecimal integer constant.


    The value 35, can be written in any of the three ways as,


    +   - 35 representing a decimal constant

    +   - 043 representing an octal constant

    +   - 0x23 representing a hexadecimal constant.


    ![](img/32da3a4a82d0a65ae37d5228b3ab3ad1_24_1.png)'
  merge: -1
  img_proc: true
- pgno: 25
  md: 'The leading 0 (zero) to an integer constant specifies, that it is an octal
    integer constant. It can contain digits from 0–7. If an octal constant contains
    digits 8 or 9, an error is reported. The leading 0x or 0X to an integer constant
    specifies, that it is a hexadecimal constant. It can contain digits from 0–9 and
    letters from a to f or A to F.


    # Rules for constructing integer constants


    +   - An integer constant may be positive or negative (Default sign is positive).

    +   - An integer constant should not have a decimal point.

    +   - No commas and blank spaces are allowed in an integer constant.

    +   - An integer constant, should not use exponent e.


    The suffix u or U is used for denoting unsigned int constants, l or L is used
    for denoting long int constants and s or S is used for denoting short int constants.
    Usually these suffixes are not needed. The compiler automatically considers small
    integer constants to be of type short and large integer constants to be of type
    long.


    # Examples of integer constants


    | 12 | -5 | 0 | 10000 | -25000 |


    # 1.4.2 Real Constants


    Real constants are often called as floating-point constants. They can be written
    in two forms. They are,


    +   - Fractional form.

    +   - Exponential form.


    # Fractional Form


    The fractional part consists of a series of digits representing the whole part
    of the number, followed by a decimal point, followed by a series of digits representing
    the fractional part. The whole part or the fractional part can be omitted, but
    both cannot be omitted. The decimal point cannot be omitted.


    # Rules for constructing real constants (fractional form)


    +   - A real constant may be positive or negative (Default sign is positive).

    +   - A real constant must have a decimal point.

    +   - No commas and blank spaces are allowed in a real constant.


    # Examples of real constants (fractional form)


    | 0.0001 | -0.963 | 485.98 | +123.456 |

    | 727.01 | 0.987 | -.8765 | +001.05 |


    # Exponential form


    Exponential form of representation of real constants is used if the value of a
    constant is either too small or too large. In exponential form of representation,
    the real constant is represented in two parts. The part appearing before e is
    called mantissa,'
  merge: -1
