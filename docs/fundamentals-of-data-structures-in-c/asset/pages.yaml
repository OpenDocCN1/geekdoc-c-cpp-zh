    # **Fig. 5.1 : Trace of a bubble sort.**


    The bubble sort algorithm makes (n-1) comparisons, in the first pass to place
    the smallest element in the first position of the list. The second pass makes
    (n-2) comparisons, to place the next smallest element in the second position of
    the list and so on. Thus, the number of comparisons required by the bubble sort
    is given by


    \([n - 1] + [n - 2] + ..... + 2 + 1 = \frac{n(n - 1)}{2} = \frac{n^2 - n}{2} =
    o[n^2]\)


    Therefore, the time required to execute the binary sort algorithm is proportional
    to \(n^2\) where n is the number of elements in the list. This sorting method
    works well only for simple lists. The best case occurs when the input data elements
    are almost in sorted order. The worst case occurs when the input data elements
    are in descending order.


