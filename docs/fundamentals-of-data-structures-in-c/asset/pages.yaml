    # 1.1.2 Tokens, Identifiers and Keywords


    # Tokens


    Tokens are the smallest individual unit in a program. Tokens supported in C are
    as follows,


    +   * Identifiers

    +   * Keywords

    +   * Constants

    +   * String literals

    +   * Operators


    C program is usually written with these tokens, as per the syntax of C language.
    White spaces are also used to seperate adjacent tokens.


    # Identifiers


    An identifier is a string of alphanumeric characters that begins with an alphabetic
    character or an under score character that are used to identify or name various
    programming elements such as variables, function names, array names, tags and
    members of structures, unions, typedef names, enumeration constants and so on.


    The underscore character is considered as a letter in identifiers. The under score
    character can be used anywhere in an identifier, but usually used in the middle
    of an identifier. There are 63 alphanumeric characters, i.e., 53 alphabetic characters
    and 10 digits (i.e., 0–9). There are 53 characters, to represent identifiers.
    They are 52 alphabetic characters (i.e., both upper case and lower case alphabets)
    and the under score character. An identifier should be small, informative, memorable
    and easily pronounceable if possible.'
  merge: -1
  img_proc: true
- pgno: 18
  md: '# Rules for constructing identifiers


    +   - The first character in an identifier must be an alphabet or an under score
    and can be followed by any alphabets, or digits or under scores.

    +   - No commas or blank spaces are allowed within an identifier.

    +   - No special character other than under score can be used to represent identifiers.

    +   - The name used to represent an identifier should not be a keyword.

    +   - Identifiers are case sensitive (i.e., AVERAGE is different form average
    or Average or AVERAGE).

    +   - Identifiers can be of any length, but only the first 31 characters are recognised.


    # Table 1.1 : Identifiers


    | Valid | Invalid |

    | :--- | :--- |

    | CHENNAI | 786 |

    | PRIYA | R*P |

    | FLOAT | (sum) |

    | average_value | % |

    | SuChItRA | 100th |

    | Word | float |

    | _rama | cost$ |

    | mark_1 | FIVE STAR |

    | One_And_Only | [JeyaBal] |

    | mountTAIN | "Saranya" |


    # Keywords


    Keywords are also referred as **reserved words**, whose meaning has been already
    defined in the C compiler. All keywords have fixed meanings and their meanings
    cannot be changed.


    Keywords can be used only for their intended purpose and they cannot be used as
    identifiers. All keywords must be compulsorily written in lowercase. For using
    the keywords in a program, no header file is to be included.


    The keywords in C are summarized as below:


    | | | | |

    |---|---|---|---|

    | auto | double | int | struct |

    | break | else | long | switch |

    | case | enum | register | typedef |

    | char | extern | return | union |

    | const | float | short | unsigned |

    | continue | for | signed | void |

    | default | goto | sizeof | volatile |

    | do | if | static | while |'
  merge: -1
  img_proc: true
- pgno: 19
  md: '# 1.2 Structure of a C Program


    C is a programming language and so an introduction to structure of C program is
    presented in this section for better understanding the logic of a program by the
    reader. Every C program contains few basics of building blocks. These building
    blocks should be written in a correct order and procedure. Let us see a sample
    program for calculating the sum of two integers.


    ```

    Program 1.1:

    /* Program to calculate the sum of two integers */

    /* firstpgm.c */

    #include<stdio.h>

    void main()

    {

    int x, y, sum;

    printf("Enter the values of X and Y : ");

    scanf("%d %d", &x, &y);

    sum = x + y;

    printf("The sum of the variables X and Y = %d", sum);

    }

    The program displays the following output

    Enter the values of X and Y : 25 30

    The sum of the variables X and Y = 55

    ```


    Comments are added at each end of the statement in order to understand the overall
    program organisation easily. Let us see each comment statement in detail.


    # /* Title comment */


    Any comment statement used in a C program must be enclosed within /* */. The comment
    statement is used to identify the purpose of the program. This statement is usually
    specified at the start of a program, but can be specified any where in the program.
    This may or may not be present in the program as per the programmers wish. The
    comment statement is not an executable statement. It''s a good programming practice
    to include comment statements in a program.


    # /* Library file access */


    The second line in the program #include <stdio.h> refers to a special file which
    contains the information about the various input and output operations which must
    be included in the program when it is compiled. The C compiler will handle the
    inclusion of the required information automatically. The header file stdio.h contains
    the information of all the standard input and output functions in C. If you don''t
    include the header file stdio.h in the program, the C compiler may complain about
    undefined functions and data types used in the program.'
  merge: -1
  img_proc: true
- pgno: 20
  md: '# /* Function */


    The third line in the program main() is a function, which may consist of one or
    more statements. Every C program must contain at least one function which must
    be main(). C program will always begin by executing the main() function, which
    will access other functions used in the program. The empty parenthesis followed
    by main() indicates that this function does not include any arguments. The remaining
    lines of the program are enclosed within a pair of braces. The statements enclosed
    within a pair of braces are referred as the body of the function.


    # /* Declaration of variables */


    A declaration of a variable is a statement that gives information to the C compiler
    about the variables to be used in the program. The general form or the syntax
    of declaring a variable is


    ```

