    condition is satisfied. Such repetitive operation is done through a loop structure.
    The three loop structures are,


    +   - while loop

    +   - do-while loop

    +   - for loop.


    # 1.10.1 The while Loop


    The simplest of all the looping structures in C is the while loop. The general
    form or the syntax of a while loop is


    ```

    initialize loop counter;

    while(condition)

    {

    statement(s);

    increment or decrement loop counter;

    }

    ```


    Fig. 1.5, shows the operation of the while loop. A looping process generally has
    three steps. They are,


    +   - Initialization of the counter

    +   - Test for a specified condition for execution of the statements in the loop

    +   - Incrementing or decrementing the counter.


    In looping, a sequence of statements is executed until some conditions are satisfied.
    A loop consists of two segments. One is referred as the body of the loop and the
    other is the control statement. The control statement tests certain conditions
    and then directs the repeated execution of the statement(s) contained in the body
    of the loop structure.


