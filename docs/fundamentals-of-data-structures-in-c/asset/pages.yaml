    # 1.13.1 Initializing Two-Dimensional Arrays


    Like one dimensional arrays, a two dimensional array can also be initialized.
    Arrays can be initialized by the following ways,


    +   - Initializing an array during declaration

    +   - Initializing an array using loops.


    # Initializing an array during declaration


    Similar to one dimensional arrays, a two dimensional array can also be initialized
    with one or more values during its declaration. The general form or the syntax
    of initializing an array during declaration is


    ```

    StorageType dataType arrayName[rowsize] [colsize] = { List of Values };

    ```


    where the storageType, may be either auto, or register, or static, or extern.
    The storageType while declaring an array is optional. The dataType specifies the
    type of elements that will be stored in the array. The arrayName is the name used
    to identify the array. The rules for naming array names are same as identifiers.
    Note that an array should not have the same name as an ordinary variable in the
    same block or function. The rowsize and colsize are positive value integer constants,
    which indicate the number of array elements associated with each subscript.'
