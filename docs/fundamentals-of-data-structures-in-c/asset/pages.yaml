  md: '![](img/32da3a4a82d0a65ae37d5228b3ab3ad1_166_0.png)


    Similarly, if you want to add a new element (say 6) it is added after 5 because
    it is in the rear end. After inserting a new element, the rear end is shifted
    from element 5 to element 6, which is the last position of the queue. Beyond this
    position, you cannot insert any elements in the queue.


    ![](img/32da3a4a82d0a65ae37d5228b3ab3ad1_166_1.png)


    The primary operations that can be done on a queue are insertions and deletions.
    These operations on a queue are referred as enqueue and dequeue operations respectively.
    An enqueue operation adds a new element in a queue. This process is carried out
    by incrementing the rear end and adding a new element at the rear end position.
    A dequeue operation is carried out by incrementing the front end and deleting
    the first element at the front end position.


    # 3.4 Arrays and its Representation using Queue


    One of the simplest ways of representing a queue is by means of a single dimensional
    array. Both queues and arrays are ordered collection of elements. However, an
    array and queue are two different things. The number of elements in the array
    is fixed and it is not possible to change the number of elements stored in the
    array. But the size of a queue is constantly changed when elements are enqueued
    and dequeued. The queue size is stored in a part of the array, so an array can
    be declared large enough to hold the maximum number of elements of the queue.
    During execution of a program, the queue size can be varied within the space reserved
    for it. One end of the array (i.e., bottom of the queue) is referred as the rear
    end and the other end of the array (i.e., top of the queue) is referred as the
    front end. Care must be taken in handling extreme cases, like not to insert an
    element into a fully occupied queue and not to delete an element from an empty
    queue. To represent a linear queue using arrays, we need,


    +   - An array to hold the elements of a queue, which can be of any data type
    such as int, float or char etc.,

    +   - An integer (i.e., FRONT) to store the position of the first element of the
    queue.

    +   - Another integer (i.e., REAR) to store the position of the last element of
    the queue.'
