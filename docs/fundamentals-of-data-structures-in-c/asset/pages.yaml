    \ designation, address);\n```\n\nthe scanf() function is used to read input for\
    \ the arrays of name,designation and address at a time, which is not possible\
    \ by using a gets() function.\n\n# By using loops\n\nWe know that a string is\
    \ an array of characters, hence a string can also be read, character by character\
    \ from the user by using loops. You can use either a for or a while or a do-while\
    \ loop. The loops in the following example reads input from the user until the\
    \ string is terminated by a new line. The subscript i in the program increments\
    \ the string one by one (i.e., character by character) until a new line character\
    \ is encountered. For example,\n\n```\nmain()\n{\n    int i; char name[20];\n\
    \    for(i = 0; i != '\\\\n'; i++)\n        scanf(\"%c\", &name[i]); /* String\
    \ read using a for loop */\n}\n```\n\n```\nmain()\n{\n    int i = 0;\n    char\
    \ name[20];\n    while(i != '\\\\n')    /* String read using a while loop */\n\
    \    {\n        scanf(\"%c\", &name[i]);\n        i++;\n    }\n}\n```\n\n```\n\
    main()\n{\n    int i = 0;\n    char name[20];\n    do    /* String read using\
    \ a do-while loop */\n    {\n        scanf(\"%c\", &name[i]);\n        i++;\n\
    \    }while(i != '\\\\n');\n}\n```\n\nNote that ampersand is used before the array\
    \ name if you are reading a string, character by character."
