  md: "# 2.12.1 File Inclusion\n\nFile inclusion is the first type of preprocessor\
    \ directive. The #include preprocessor directive is used for including one or\
    \ more files in the program. The #include directive instructs the compiler to\
    \ make a copy of a specified file to be included in place of the directive. The\
    \ general form or the syntax of #include directive is\n\n```\n# include <filename>\n\
    # include \"filename\"\n```\n\nThe first form of the file inclusion (i.e.,filename\
    \ enclosed in angle brackets <>) causes the preprocessor to look for a file with\
    \ the specified filename in special directories set aside for files. The name\
    \ of these files are specified by each individual implementation such as stdio.h,\
    \ math.h, string.h, etc. The letter 'h' generally designates a header file which\
    \ is incuded usually at the beginning of the program. The #include directive is\
    \ also used with programs consisting of several source files that are compiled\
    \ together. This is referred to as nested includes. The number of levels of nesting\
    \ allowed varies for different C compilers (Usually eight nested file inclusions\
    \ are used in a standard C compiler).\n\nThe second form of the file inclusion\
    \ (i.e., filename enclosed in double quotes \" \") causes the preprocessor to\
    \ look for a file with the specified filename in the current working directory.\
    \ The use of quotes is generally reserved for including files specifically related\
    \ to the program that is currently handled. Usually these files (general purpose\
    \ files) are created by the user for its use in the program.\n\n# 2.12.2 Macro\
    \ Definition\n\nMacro definition is the second type of preprocessor directive.\
    \ The #define preprocessor directive is used to define a symbolic constant and\
    \ assign it a value. The #define directive defines an identifier and a set of\
    \ characters, which will be substituted for the identifier each time it is encountered\
    \ in the source file. The general form or the syntax of #define directive is\n\
    \n```\n#define identifier set-of-characters\n```\n\nwhere identifier also referred\
    \ as macro name or macro template substitutes the set-of-characters each time\
    \ it encounters in the source file (program). Program 2.18, illustrates the use\
    \ of #define directive.\n\n# Program 2.18:\n\n```\n/* macro1.c */\n#define FIVE\
    \ 5\n#define SIX FIVE+1\n#define SEVEN SIX+1\nvoid main()\n{\n printf(\"%d \\\
    t %d \\t %d\", FIVE, SIX, SEVEN);\n}\n```"
