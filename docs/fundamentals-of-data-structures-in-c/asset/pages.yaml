- pgno: 240
  md: '# 4.4.1 Preorder Traversal


    The steps for traversing a binary tree in preorder traversal are,


    +   - Process the root node.

    +   - Traverse the left subtree.

    +   - Traverse the right subtree.


    The value of in each node is processed as the node is visited. Preorder traversal
    leads to prefix expressions. Fig. 4.7 shows the order in which each node is visited
    in preorder traversal.


    ![](img/32da3a4a82d0a65ae37d5228b3ab3ad1_240_0.png)


    # 4.4.2 Inorder Traversal


    The steps for traversing a binary tree in preorder traversal also referred as
    symmetric order traversal are,


    +   - Traverse the left subtree.

    +   - Process the root node.

    +   - Traverse the right subtree.


    Inorder traversal leads to infix expressions.


    Fig. 4.8 shows the order in which each node is visited in inorder traversal. The
    inorder traversal of a binary tree points the values always in ascending order,
    and hence this process is referred as the binary tree sort.


    ![](img/32da3a4a82d0a65ae37d5228b3ab3ad1_240_1.png)


    # 4.4.3 Postorder Traversal


    The steps for traversing a binary tree in postorder traversal also referred as
    end order traversal are,


    +   - Traverse the left subtree.

    +   - Traverse the right subtree.

    +   - Process the root node.


    Postorder traversal leads to postfix expressions. Fig. 4.9 shows the order in
    which each node is visited in postorder traversal.


    ![](img/32da3a4a82d0a65ae37d5228b3ab3ad1_240_2.png)


    # 4.4.4 Level order Traversal


    In level order traversal, we traverse the nodes according to their levels. The
    steps for traversing a binary tree in level order traversal are,


    +   - Process the root node at level 1.

    +   - Traverse the next level (i.e, level 2), below the root node.'
