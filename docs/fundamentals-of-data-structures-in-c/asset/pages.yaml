- pgno: 239
  md: 'The **advantage** of using linked representation of binary tree is that, insertions
    and deletions involve no data movement and no movement of nodes (as in the case
    of linear representation) except the rearrangement of pointers. Disadvantages
    of linked representation of binary trees include,


    +   - Given a node structure, it is difficult to determine its parent node.

    +   - Memory spaces are wasted for storing NULL pointers for the nodes, which
    have one or no subtrees.

    +   - This implementation requires dynamic memory allocation, which is not possible
    in some programming languages.


    Fig. 4.6 shows the linked representation using pointers for binary tree as in
    Fig. 4.4(c).


    ![](img/32da3a4a82d0a65ae37d5228b3ab3ad1_239_0.png)


    Fig. 4.6 : Linked representation of binary tree in Fig. 4.4(c).


    # ## 4.4 Binary Tree Traversal


    One of the most important operations performed on a binary tree is its traversal.
    *Traversing a binary tree means moving through all the nodes in the binary tree,
    visiting each node in the tree exactly once.* For linked list, the nodes are in
    natural order from first to last and hence traversal follows the same order. However,
    for trees the nodes are not in order, hence we have to follow a different procedure
    for traversing all the nodes. One thing to be kept in mind while traversing a
    binary tree is that treat each node and its subtrees in the same fashion. The
    tasks performed while traversing a binary tree are,


    +   - Visiting a node (denoted by the letter V)

    +   - Traversing the left subtree (denoted by the letter L)

    +   - Traversing the right subtree (denoted by the letter R).


    Depending upon the three tasks there are six possible combinations of traversals.
    They are VLR, LVR, LRV, VRL, RVL and RLV. These six traversals can be reduced
    to three combinations by adopting the convention, that we always traverse the
    left subtree before the right subtree. Depending on the factor, the possible combinations
    are,


    +   - V L R (designated as Preorder traversal)

    +   - L V R (designated as Inorder traversal)

    +   - L R V (designated as Postorder traversal).'
