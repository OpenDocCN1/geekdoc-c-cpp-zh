  md: '# III. HEADER FILES


    This appendix is a summary of the header files defined by the ANSI (American National
    Standards Institutions) standard. The header files contain information about various
    library functions that are functionally same. Header files may be included in
    any order in the program. A header file must be included outside any external
    declaration or definition and before the use of library functions present in it.


    The library functions, constants, global variables, and macros of the standard
    library are declared in the following header files.


    | alloc.h | assert.h | bios.h | conio.h | ctype.h |

    | --- | --- | --- | --- | --- |

    | dir.h | dos.h | errno.h | fcntl.h | float.h |

    | graphics.h | io.h | limits.h | malloc.h | math.h |

