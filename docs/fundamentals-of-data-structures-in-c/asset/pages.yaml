    # 5.7 Quick Sort


    Quick sort also referred as partition exchange sort was developed by C.A.R. Hoare.
    It is a sorting algorithm, which performs very well on larger lists than any other
    sorting methods. It employs divide and conquer rule for its operation. The main
    idea of the quick sort is to divide the initial unsorted list into two parts,
    such that every element in the first list is less than all the elements present
    in the second list. The procedure is then repeated recursively for both the parts,
    up to relatively short sequences, which can be sorted until the sequences reduce
    to length one i.e., we divide the problem into two smaller ones and conquer by
    solving the smaller ones. The first step of the algorithm requires choosing a
    pivot value that will be used to divide big and small numbers. Usually the first
    element of the list is chosen as the pivot value. Once the pivot value has been
    selected, all elements smaller than the pivot are placed towards the beginning
    of the set and all the elements larger than the pivot are placed to the right.
    This process essentially sets the pivot value in the correct place each time.
    Each side of the pivot is then quick sorted.'
