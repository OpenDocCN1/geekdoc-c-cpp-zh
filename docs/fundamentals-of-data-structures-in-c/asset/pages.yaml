  md: '# 1.14 Multidimensional Arrays


    There are situations where a table of values of same data type has to be stored.


    In many cases, we can''t use two or double dimensional arrays, in such cases we
    use multi dimensional arrays. Arrays whose elements are specified by three and
    four subscripts are called as three-dimensional and four dimensional arrays respectively.


    The general form or the syntax of declaring a multi dimensional array is


    ```

    dataType arrayName[subscript1][subscript2],...,[subscriptN];

    ```


    where the number of subscripts denotes the number of dimensions of the array.
    For example,


    ```

    int value[10][10][10];

    float sales[2][3][4][5];

    ```


    In the first example, value is a three dimensional array that can store 1000 (i.e.,
    10*10*10) integer type elements. Similarly in the second example, sales is a four
    dimensional array that can store 120 (i.e., 2*3*4*5) floating-point type elements.
    Each element of the matrix is identified by the subscripts used. Multi-dimensional
    arrays are initialized in a similar fashion like one dimensional arrays. The initializers
    are listed by rows. Braces are used to seperate the list of initializers from
    one row to the next, and commas placed after each brace. We don''t go in detail
    of multidimensional arrays because we usually deal one or two dimensional arrays.


    # 1.15 String Array


    A string is any group of characters enclosed in double quotes (except double quotes).
    A string is an array of characters terminated by a NULL character and so a string
    can also be referred to as a string array. In C language, a string is declared
    and/or defined by using a character array. For example,


    > "Concept of String Functions"


    is a string. Whenever a string is stored in memory, the compiler automatically
    inserts a NULL character (''\0'') at the end of the string. This NULL character
    indicates the end of the string. The NULL character is the first ASCII character,
    which has a value of zero. The NULL character can be used as a signal to let the
    compiler to know that a string is ended. A string not terminated by a ''\0'' is
    not really a string, but merely a collection of characters.


    # 1.15.1 Declaring Strings


    The general form or the syntax of declaring a string that can hold an array of
    characters can be declared as


    ```

    char variable_name[size];

    ```


    where char is a data type, variable_name is the identifier (i.e., character array)
    and size is the maximum number of characters that the string can store, including
    NULL character.


    For example,


    ```

    char name[10], book[20];

    ```'
