    type of representation has more advantages than representing queues using arrays.
    They are


    +   - It is not necessary to specify the number of elements to be stored in a
    queue during its declaration (since memory is allocated dynamically at run time
    when an element is added to the queue).

    +   - Insertions and deletions can be handled easily and efficiently.

    +   - Linked list representation of queues can grow and shrink in size without
    wasting the memory space, depending upon the insertion and deletion that occurs
