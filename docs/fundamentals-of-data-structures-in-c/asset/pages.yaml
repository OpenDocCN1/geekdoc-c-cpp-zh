  img_proc: true
- pgno: 329
  md: 'To search an element in the hash table, we check hash address position, corresponding
    to the key, if the key is not found at that position, then we linearly search
    the element following the hash address position. The main disadvantage of this
    resolution technique is the primary clustering problem. That is, if half of hash
    table is filled or an overflow occurs, it is difficult to find an empty location
    in the hash table and hence the insertion process takes a longer time.


    # 5.9.2 Quadratic Probing


    Quadratic probing is similar to linear probing, except that, instead of looking
    just one more index ahead each time until we find an empty index, we do the following.
    On the method we look ahead 1 position, and place the key in the hash table. On
    the second collision we look 4 (2^2) positions ahead, and on the third we look
    9 (3^2) positions ahead and so on. If i is the position in the array in quadratic
    probing, the step sizes are i+1, i+4, i+9, i+16, and so on. Let us assume, that
    we want to map the keys considered in the previous example,


    | Index | Value |

    |---|---|

    | 0 | |

    | 1 | |

    | 2 | 72 |

    | 3 | 65 |

    | 4 | 18 |

    | 5 | 13 |

    | 6 | 34 |


    # Fig. 5.6 : Collision resolution using quadratic probing.


    The first key (i.e., 18) will be mapped in the 4 position of the hash table. The
    next key (i.e., 72) will be mapped in the 2nd position of the hash table. The
    third key (i.e., 65) will try to map the key in the 2nd position of the hash table,
    since it is already mapped, it will search for the next free place, by shifting
    1 position ahead, which is the 3rd position in the hash table, and since it is
    empty, maps the key in that location. The fourth key (i.e., 34) will be mapped
    in the 6th position of the hash table. The fifth key (i.e., 13) will try to map
    the key in the 6th position of the hash table, since it is already mapped, it
    searches for the next free place, by shifting 4 positions ahead, which is the
    3rd position in the hash table (since the size of the hash table is 7), since
    it is already occupied, it searches for the next free place, by shifting 9 positions
    ahead, which is the 5th position in the hash table and since it is empty, it maps
    the key in that location.'
  merge: -1
  img_proc: true
- pgno: 330
  md: 'Quadratic probing is just as easy to implement as linear probing, and has less
    of a clustering effect than linear probing. The problem with quadratic probing
    is that it gives rise to secondary clustering. This method will not search all
    locations in the hash table to find an empty slot. Due to this insertion takes
    a longer time when compared to linear probing.


    # 5.10 Overflow Resolution Technique --- Separate Chaining


    This method uses linked lists for storage as hash tables. It maintains separate
    chains of elements, which maps to the same hash address. When a data item cannot
    be placed at the hash address calculated by the hash function, a chain or link
    is allocated and stores the key element in that chain. This allows an unlimited
    number of elements to the same hash address and does not require a prior knowledge
    on number of elements stored in the hash table. This method is referred to as
    separate chaining, because you have a bunch of separate chains in your hash table.
    In this method, there is no problem of limited storage hence insertions and searching
    elements are carried out in no time. When we want to map the keys (18, 72, 65,
    34 and 13) in the previous example, the hash address mapped for the keys using
    division function method is 4, 2, 2, 6 and 6. The keys are mapped as shown in
    Fig. 5.7.


    ![](img/32da3a4a82d0a65ae37d5228b3ab3ad1_330_0.png)


    Fig. 5.7 : Collision resolution using separate chaining.


    **The main advantage of hashing using separate chaining is to get uniform and
    perfect collision resolution hashing.** Since separate chaining is implemented
    using linked lists, there is no waste of memory (since memory for the hash table
    is allocated to insert a record when needed). The elements, which have the same
    memory address will be in the same chain. Hence search operation is fast compared
    to linear and quadratic probing.'
