    \ variable names with their data types preceding them. Semicolons are not allowed\
    \ after the closing parenthesis, while defining a function.\n\nMost functions\
    \ have a list of parameters and a return value that provides means for communication\
    \ between functions. The arguments in the function reference, which defines the\
    \ data items that are actually transferred, are referred as actual arguments or\
    \ actual parameters. The arguments that represent the names of data items that\
    \ are transferred to the function from the calling portion of the program are\
    \ referred as formal arguments or formal parameters. All variables declared in\
    \ function definitions are local variables. Their scope is visible known only\
    \ in the function in which they are defined. Function arguments are also local\
    \ variables.\n\nThe second part of the function definition contains a statement\
    \ or a group of statements that defines the action to be done by the function.\
    \ These statements starting from the opening brace of the function to the last\
    \ statement before the closing brace of the function is called as body of the\
    \ function. The variables used in the function must be declared in the start of\
    \ the function following the opening brace of the function or before all expression\
    \ statements.\n\nFor example,\n\n```\nint add(int x, int y)        /* Argument\
