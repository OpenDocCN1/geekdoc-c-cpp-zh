- pgno: 251
  md: '# Insertion of a node


    One of the most primitive operations that can be done in a binary search tree
    is the insertion of a node. Memory is to be allocated for the new node (in a similar
    way that is done while creating a tree) before reading the data. The new node
    will contain empty data field and empty link field. The data field of the new
    node is then stored with the information read from the user. The link field of
    the new node is assigned to NULL.


    +   - Check whether the root node of the binary search tree is NULL.

    +   - If the condition is true, it means, that the binary search tree is empty,
    hence consider the new node as the root node. Otherwise, follow the next steps.

    +   - Compare the new node data with root node data, for the following three conditions.

    +   - If content of the new node data is equal to the root node data, insertion
    operation is terminated (because of duplication).

    +   - If the content of the new node data is lesser than the root node data, check
    whether the left child of the root node is NULL. If the condition is true, insert
    the new data and terminate the process. Otherwise, consider the left child of
    the root node as the root node and check for the three conditions again.

    +   - If the content of the new node data is greater than the root node data,
    check whether the right child of the root node is NULL. If the condition is true,
    insert the new data and terminate the process. Otherwise, consider the right child
    of the root node as the root node and check for the three conditions again.


    In Program 4.2, insertNode() function is used for inserting a new node in the
    binary search tree. Fig. 4.16 explains insertion operation in a binary search
    in detail.


    ![](img/32da3a4a82d0a65ae37d5228b3ab3ad1_251_0.png)


    ![](img/32da3a4a82d0a65ae37d5228b3ab3ad1_251_1.png)


    ![](img/32da3a4a82d0a65ae37d5228b3ab3ad1_251_2.png)


    ![](img/32da3a4a82d0a65ae37d5228b3ab3ad1_251_3.png)'
