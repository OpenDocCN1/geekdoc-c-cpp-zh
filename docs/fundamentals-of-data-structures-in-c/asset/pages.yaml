- pgno: 174
  md: 'stored in the list. The data field of the first node stores the value 10. The
    data field of the first node contains the address of the second node (i.e., A1B2).
    Similarly, the second node of the list stores the value 75 in the data field and
    the address of the third node (i.e., FE77) in the link field. The last node of
    the list contains only the information part (i.e., 530) in the data field and
    the address field stores the NULL pointer. This NULL pointer is used to indicate
    the end of a list. Note that the nodes in a linked list are not ordered by their
    physical placement in memory (i.e., they may/may not be placed in contiguous memory
    locations) but by logical links stored as a part of the data in the node itself.


    The address stored in a linked list are divided into three types namely,


    +   - External address

    +   - Internal address

    +   - Null address.


    **External address** is the address of the first node in the list. This address
    is stored in the head pointer which points to the first node in the list. The
    entire linked list can be accessed only with the help of the head pointer. **Internal
    address** is the address stored in each and every node of the linked list except
    the last node. The content stored in the link field (also referred as next address
    field) is the address of the next node. **Null address** is the address stored
    by the NULL pointer of the last node of the list, which indicates the end of the
    list.


    # 3.5.1 Types of Linked Lists


    There are different types of linked lists. They can be classified as,


    +   - Singly linked list

    +   - Doubly linked list

    +   - Circular linked list.


    # Singly Linked List


    The list that we have seen so far is referred to as the singly linked list, in
    which each node has a single link to its next node. This list is also referred
    as a **linear linked list**. The head pointer points to the first node in the
    list and the null pointer is stored in the link field of the last node in the
    list, which indicates end of list. **Fig. 3.6** shows a singly linked list. You
    can traverse (move) in a singly linked list in only one direction (i.e., from
    head to null in a list). You cannot traverse the list in the reverse direction
    (i.e., from null to head in a list).


    # Doubly Linked List


    For some applications, especially where it is necessary to traverse lists in both
    directions, doubly linked lists work much better than singly linked lists. Doubly'
