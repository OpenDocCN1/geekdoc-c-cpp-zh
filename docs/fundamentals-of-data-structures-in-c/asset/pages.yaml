  md: '# 1.11 Arrays


    C language provides the capability that enables the user to design a set of similar
    data called arrays. They are defined in the same manner as ordinary variables
    except that each array name must be accompanied by a size specification within
    square braces capable of storing more than one value at a time. An array is defined
    as a set of homogeneous data items of the same type that share a common name and
    that are differentiated from one another by their positions within the array.
    The individual values in the array are called elements. Each array element is
    referred by specifying the array name, followed by a number within square braces
    referred as an index or subscript. The dimension of an array is determined by
    the number of subscripts needed to identify each element. A subscript is always
    enclosed in square brackets [] placed after the array name. Each subscript must
    be expressed as a non-negative integer. The value of each subscript can be expressed
    as an integer constant, integer variable, or a complex integer expression.


    Arrays are structured type of variables, for which, memory is allocated for all
    the elements declared by the size specification. The ability to use a simple name
    to represent a collection of items and to refer to an item number enables us to
    develop efficient programs.


    # 1.11.1 Initialization and Declaration of Arrays


    Arrays refer to a group of data items that share a common name with the same data
    type. Individual data items in an array are referred as elements. Each element
    in an array is accessed by a subscript, which begins from zero and is always written
    inside a pair of square brackets. For example,


    ```

    int a[10];

    char ab[10][10];

    ```


    The first declaration declares a one dimensional integer array a that can store
    10 integer constants (i.e., 0–9). The next declaration declares a two dimensional
    character array ab that can store 10 string constants of length not more than
    10.


    Arrays can also be initialized when they are declared. This is done by adding
    an equal sign followed by the required value to be initialized after the declaration.
    For example,


    ```

    int a[5] = {1, 2, 3, 4, 5};

    char name[6] = {''M'', ''a'', ''d'', ''h'', ''u'', ''\0''};

    char name[6] = ("Madhu");

    ```


    The first declaration declares a one dimensional array a of type integer and initializes
    the values 1 in a[0], 2 in a[1] and so on up to 5 in a[4] (Note that the initialization
    of an array starts from the subscript zero). The next two initializations are
    more or less similar, which declares a one dimensional array name of type char.
    The first declaration initializes a string “Madhu” character by character where
    as the next declaration directly initializes the string (Note that a NULL character
    is compulsory while initializing a string character by character).'
