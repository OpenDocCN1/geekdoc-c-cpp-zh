    the value of the “constant integer”, which is impossible, hence the error.


    +   2. ANSWER :

    +   Linker Error : Undefined symbol i

    +   Explanation :

    +   The extern storage class declaration (extern int i) specifies to the compiler
    that the memory for i is allocated in some other program and that address will
    be used in the current function at the time of linking. But since linker doesn’t
    finds another variable of name i in the program with memory space allocated for
    it. Hence a linker error has occurred .


    +   3. ANSWER :

    +   0 0 1 3 1

    +   Explanation :

    +   Always keep in mind, that logical operations always gives a result of 1 or
    0. Logical AND (&&) operator has higher priority over the logical OR (||) operator.
    So the expression “i++ && ++j && ++k” is executed first. The result of this expression
    is 0 (since, -1 && -1 && 0 = 0). Now the next expression (i.e., 0 || 2) is evaluated,
    whose result evaluates to 1 (because OR operator always gives 1 except for ‘0
    || 0’ combination). So the value of m is 1. The values of other variables are
    also incremented by 1, hence you get the above output.


    +   4. ANSWER :

    +   fff0

    +   Explanation :

    +   The constant -1 is internally represented as all 1’s. When left shifted four
    times (since << 4) the least significant 4 bits are filled with 0’s.The %x format
    specifier specifies that the integer value to be printed as a hexadecimal value.


    +   5. ANSWER :

    +   a = 2;

    +   Explanation :

    +   During initialization of a, unary minus (or negation) operator is used twice.
    As maths, minus * minus= plus, same rule applies in programming also hence you
    get the above output.. Also note that you cannot give –2, since – operator can
    only be applied to variables for decrement operation as –a).


    +   6. ANSWER :

    +   sizeof(i) = 1

    +   Explanation :

    +   Since #define replaces the string int by the macro definition char.


    +   7. ANSWER :

    +   i = 0

    +   Explanation :

    +   In the expression i!=5, NOT (!) operator has more precedence than ‘>’ symbol.
    ! is a unary logical operator. !i (!10) is 0 (not of true is false). 0 > 5 is
    false (zero).'
