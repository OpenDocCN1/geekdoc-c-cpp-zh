  md: '# VII. GLOSSARY


    **access time** The time taken to retrieve information from memory.


    **address** It is the value that points to a location in memory.


    **address bus** Unidirectional line or pathway, which is used to identify the
    storage location in memory where the next instruction to be executed or the next
    piece of data will be found.


    **adjacency matrix** The most frequently used graph representation scheme.


    **algorithm** It is a step-by-step recipe for solving an instance of a problem.


    **analog computer** Device that performs operations on data that are represented
    within the device by continuous variables having a physical resemblance to the
    dependent quantities being represented by using one kind of physical quantity
    to represent another.


    **application software** Software used to accomplish specific tasks other than
    just running the computer system.


    **arguments** List of values provided when a function is called. They are specified
    within parenthesis following the function name.


    **array** It is a group of elements that share a common name and that are differentiated
    from one another by their positions within the array.


    **ASCC** Automatic Sequence Controlled Calculator.


    **ASCII** American Standard Code for Information Interchange.


    **Assembler** A translator program that translates the program written in assembly
    language into machine language.


    **assignment** It is the process of copying of one variable into another.


    **associativity** The direction (either left to right or right to left) used to
    evaluate an expression when a statement contains number of operators.


    **auto** It is a storage class specifier for local variables.


    **auto variable** It is visible only in the block or function in which it is declared.
    All the variables are of type auto by default.


    **auxiliary memory** See secondary memory.


    **base-10 number system** Also referred as decimal number system since it uses
    ten separate symbols, 0 to 9 to represent its numbers.


    **base-16 number system** Also referred as hexadecimal number system since it
    uses sixteen separate symbols, 0 to 9 and A to F to represent its numbers.


    **base-2 number system** Also referred as binary number system since it uses only
    two separate symbols, 0 and 1 to represent its numbers.


    **base-8 number system** Also referred as octal number system since it uses eight
    separate symbols, 0 to 7 to represent its numbers.


    **BCD** Binary-coded decimal.


    **binary** A numbering system with a base of 2. The binary digits are 0 and 1.'
