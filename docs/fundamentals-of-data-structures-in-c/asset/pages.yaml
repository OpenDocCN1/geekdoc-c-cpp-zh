  md: '# 11. What are the tasks performed during inorder traversal.


    The tasks performed during inorder traversal,


    +   - Traverse the left subtree.

    +   - Process the root node.

    +   - Traverse the right subtree.


    # 12. What are the tasks performed during postorder traversal.


    The tasks performed during postorder traversal,


    +   - Traverse the left subtree.

    +   - Traverse the right subtree.

    +   - Process the root node.


    # 13. What are the tasks performed during levelorder traversal.


    The tasks performed during levelorder traversal,


    +   - Process the root node at level 1.

    +   - Traverse the next level (i.e, level 2), below the root node.

    +   - Process the nodes from left to right in that level.

    +   - Similarly traverse the next level and process the nodes from left to right
    and continue till the end of levels.


    # 14. State the merits and demerits of linked representation of a binary tree.


    The merits of linked representation of binary trees include


    +   - Insertions and deletions in a node, involves no data movement except the
    re-arrangement of pointers, hence less processing time.


    The demerits of linked representation of binary trees include


    +   - Given a node structure, it is difficult to determine its parent node.

    +   - Memory spaces are wasted for storing null pointers for the nodes, which
    have one or no subtrees.

    +   - It requires dynamic memory allocation, which is not possible in some programming
    languages.


    # 15. Define a binary search tree.


    A binary search tree is a special binary tree, which is either empty or if it
    is empty it should satisfy the following characteristics.


    +   - Every node has a value and no two nodes should have the same value (i.e.,
    the values in the binary search tree are distinct.

    +   - The values in any left subtree is less than the value of its parent node.

    +   - The values in any right subtree is greater than the value of its parent
    node.

    +   - The left and right subtrees of each node are again binary search trees.


    # 16. Define a graph.


    A graph is a non-linear data structure that represents less relationship between
    its adjacent elements. There is no hierarchical relationship between the adjacent
    elements in case of graphs.'
