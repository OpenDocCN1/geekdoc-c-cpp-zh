    # 15. What is a recursive function ?


    Recursion is a process by which a function calls itself repeatedly until some
    specified condition has been satisfied. A function is called recursive if a statement
    within the body of a function calls the same function.


    # 16. Compare and contrast recursion and iteration.


    Comparison of recursion and iteration


    +   - Both are based on a control structure.

    +   - Both involves repetition.

    +   - Both involves a termination test.

    +   - Both can occur infinitely.


    | Iteration | Recursion |

    |---|---|

    | a) Iteration explicitly user a repetition structure. | a) Recursion achieves
    repetition through repeated function calls. |

    | b) Iteration terminates when the loop condition fails. | b) Recursion terminates
    when a base case is recognised. |

    | c) Iteration keeps modifying the counter until the loop continuation condition
    fails. | c) Recursion keeps producing simple versions of the original problem
    until the base case is reached. |

    | d) An infinite loop occurs when the loop continuation test never becomes false.
    | d) An infinite loop occurs if the recursion step doses not reduce the problem
    each time in a manner that converges on the base case. |

    | e) Iteration normally occurs within a loop so the extra memory assignment is
    omitted. | e) Recursion causes another copy of the function and hence a considerable
    memory space is occupied. |


    # 17. Distinguish between a user-defined function and a library function.


    The statements of a user-defined function are written as a part of the program,
    according to the programmer''s requirements but library functions are predefined.


    # 18. Define a pointer.


    A pointer is nothing but a variable that contains the address of another variable.'
