    # 30. State the difference between arrays and structures.


    | Arrays | Structures |

    | :--- | :--- |

    | a) An array is an single entity representing a collection of data items of same
    data types. Individual entries in an array are called elements. | a) A structure
    is a single entity representing a collection of data items of different data types.
    Individual entries in a structure are called members. |

    | b) An array declaration reserves enough memory space for its elements. | b)
