    \nPOP is an operation used to remove an element from the TOP of the stack. The\
    \ POP operation of a stack can also be implemented using singly linked lists.\
    \ When implementing the POP operation, underflow condition of a stack is to be\
    \ checked. The user should not POP an element from an empty stack. This type of\
    \ an attempt is illegal and should be avoided. The following procedure can help\
    \ you to understand things better.\n\n+   - Create a function POP() with two parameters\
    \ that stores pointer of the stack and the address of the last element to be deleted\
    \ .\n+   - Create a temporary pointer (i.e., tempptr) to hold the removed element.\n\
    +   - Assign the TOP pointer to the temporary pointer.\n+   - The TOP pointer\
    \ is made to point the node after the first node, and the other nodes remain unchanged.\n\
    +   - Free the allocated memory of the temporary pointer by using RELEASENODE()."
