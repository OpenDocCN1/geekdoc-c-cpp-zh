  md: '# 4.2 Binary Trees


    One of the most important tree structures is the binary tree. A binary tree is
    a tree that has nodes either empty or not more than two child nodes, each of which
    may be a leaf node.


    Fig. 4.2 shows the structure of a binary tree. Each node in a binary tree has
    two subtrees, the left subtree and the right subtree. All the nodes to the left
    of a given node in a binary tree are referred as left subtrees. All the nodes
    to the right of a given node in a binary tree are referred as the right subtrees.
    In Fig. 4.2, B, D, and F are the left subtrees and C, E and G are the right subtrees.


    ![](img/32da3a4a82d0a65ae37d5228b3ab3ad1_236_0.png)


    # 4.2.1 Types of Binary Trees


    +   - Left-skewed binary tree: A binary tree, which has only left child nodes.

    +   - Right-skewed binary tree: A binary tree, which has only right child nodes.

    +   - Full binary tree: A binary tree in which all the leaves are on the same
    level and every non-leaf node has exactly two children.

    +   - Complete binary tree: A binary tree in which every non-leaf node has exactly
    two children not necessarily to be on the same level.


    ![](img/32da3a4a82d0a65ae37d5228b3ab3ad1_236_1.png)


    Fig. 4.3 : Examples of binary trees.'
  merge: -1
  img_proc: true
- pgno: 237
  md: '# Properties of a binary tree


    +   - The maximum number of nodes on level n of a binary tree is 2^(n-1), where
    n >= 1.

    +   - The maximum number of nodes in a binary tree of height h is 2^h - 1, where
    n >= 1.

    +   - For any non-empty tree, n_l = n_d + 1 where n_l is the number of leaf nodes
    and n_d is the number of nodes of degree 2.


    # 4.3 Representation of Binary Trees


    Representing a binary tree can be carried out in two ways. They are,


    +   - Linear representation (using arrays)

    +   - Linked representation (using pointers).


    # 4.3.1 Linear Representation of Binary Trees


    An array can be used to store the nodes of a binary tree. The nodes stored in
    an array are accessed sequentially. Linear representation of binary trees uses
    a single dimensional array of size 2^(h+1) - 1 where h is the height of the tree.
    The binary tree structure shown in Fig. 4.4 (a,b,c) has a height of 3 and in Fig.
    4.4(d) has a height of 4. Therefore, the size of the array required to store the
    first three binary trees is 2^(3+1) - 1 = 15 and the size of the array required
    to store the last binary tree is 2^(4+1) - 1 = 31.


    After determining the size of the array, the following method is used to represent
    binary trees in arrays.


    +   - Store the value of the root node in the first location of the array (i.e.,
    at index = 1).

    +   - The left child of the n^th node is stored at location 2n, and the right
    child of the n^th node is stored at location (2n+1).

    +   - If there is no left or right child, the array location is left empty.


    To verify whether a parent, left or right child exists in a tree or not, the following
    steps are performed.


    +   - Parent of the i^th node is at i/2 location, where (i != 1). If (i = 1),
    it is the root node of the binary tree, which has no parent node.

    +   - Left child of the i^th node is at 2i where (2i <= n). If (2i > n), then
    the i^th node has no left child.

    +   - Right child of the i^th node is at (2i + 1), where (2i + 1) <= n. If (2i
    + 1) > n, then the i^th node has no right child.


    Fig. 4.5 shows the linear representation using arrays for binary trees in Fig.
    4.4. The main advantage of representing a binary tree using arrays is simplicity
    and ease of implementation, but in most cases, there will be a lot of unutilized
    space. A full binary tree will not waste any spaces, where as complete binary
    trees or skewed binary trees, utilises a considerable amount of space. Insertions
    and deletions in a node, take an excessive amount of processing time, due to up
    and down data movement in an array.'
  merge: -1
  img_proc: true
