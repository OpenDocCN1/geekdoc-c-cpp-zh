    # 3.3 Queues


    A *queue* is an ordered collection of elements in which insertions are made at
    one end and deletions are made at the other end. The end at which insertions are
    made is referred to as the rear end, and the end from which deletions are made
    is referred to as the front end. The first element placed in a queue will be at
    the start of the queue. The last element placed in a queue will be at the end
    of the queue. In a queue, the first element inserted will be the first element
    to be removed. So a queue is sometimes referred to as *First-In-First-Out* (FIFO)
    lists.


    Consider five persons waiting in front of a ticket counter in a line for buying
    their tickets. The person who is standing in front of the line will get the first
    ticket, the second person will get the next ticket, and so on. If a new person
    wants to buy a ticket (say the sixth person) he should stand after the fifth person.
    These similar operations are carried out in a queue.


    Queues have many applications in computer systems. Most computers have only a
    single processor, so only one user may be served at a time. Entries from other
    users are placed in a queue. Each entry gradually advances to the front of the
    queue as users receives their service. Queues are also used to support print spooling.
    *Fig. 3.3* shows the representation of a queue. Queue shown in *Fig. 3.3* consists
    of 5 elements 1, 2, 3, 4 and 5.


    ![](img/32da3a4a82d0a65ae37d5228b3ab3ad1_165_0.png)


    Where front end is the pointer pointing to the first element in the queue, rear
    end is the pointer pointing to the last element in the queue. Element 1 is the
    first element of the queue, and 5 is the last element in the queue. If you want
    to delete an element say 3, you have to first delete element 1 and then element
    2 and then the element 3. The front end is shifted from 1st element 1 to 4.'
