  md: 'and the part after e is called **exponent**. The exponent consists of an optional
    plus or minus sign followed by a series of digits. For example 425000 can be expressed
    as 4.25e5 (or) 42.54e. Similarly 0.00028 can be expressed as 2.8e-4 (or) 0.28e-3.


    # Rules for constructing real constants (exponential form)


    +   - The mantissa part and the exponential part should be seperated by a letter
    e.

    +   - The mantissa part and the exponent part may be positive or negative (Default
    sign is positive).

    +   - The mantissa and the exponent part must have at least one digit.

    +   - No comma and blank spaces are allowed in a real constant.


    # Examples of real constants (exponential form)


    | +3.2e+5 | 3.4e5 | -8.25e-5 |

    |---|---|---|

    | -10.9e5 | 9.72e-10 | 0.0025e8 |


    # 1.4 Single Character Constants


    A single character constant or a character constant contains a single character
    enclosed within a pair of single quotes. A single character constant must be either
    a single alphabet or a single digit or a single special character enclosed in
    single quotes. The length of a single character constant is only one.


    | Valid | Invalid |

    |---|---|

    | ''\A'' | "\x" |

    | ''\m'' | ''xyz'' |

    | ''\2'' | ''123'' |

    | ''\*'' | ''pq'' |

    | ''\_'' | ''$$'' |


    # 1.4.4 String Constants


    A character string, a string constant or a literal consists of a sequence of characters
    enclosed in double quotes. A string constant may consist of any combination of
    digits, letters, escape sequences, and spaces. The end of the string is marked
    with a single character referred as the NULL character ''\0''. Note that a single
    character constant ''A'' and the single character string constant "A" are not
    same. The string constant "A" consists of characters A and \0.


    +   - ''A'' - character constant → ''A''

    +   - "A" - string constant → ''A'' and string endmarker ''\0'' (NULL)


    Further a character constant as an equivalent integer value, where has a single
    character string constant does not have an equivalent integer value. It occupies
    two bytes, one for the ASCII code of A and another for the NULL character with
    a value 0, which is used to terminate all strings.'
