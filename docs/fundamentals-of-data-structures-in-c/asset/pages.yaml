  md: '# 3. State the different ways of representing expressions.


    The different ways of representing expressions are,


    +   - Infix notation

    +   - Prefix notation

    +   - Postfix notation


    # 4. State the rules to be followed during infix to postfix conversions.


    The rules to be followed during infix to postfix conversions are,


    +   - Fully parenthesize the expression starting from left to right (During parenthesizing,
    the operators having higher precedence are first parenthesized).

    +   - Move the operators one by one to their right, such that each operator replaces
    their corresponding right parenthesis.

    +   - The part of the expression, which has been converted into postfix, is to
    be treated as single operand.

    +   - Once the expression is converted into postfix form, remove all parenthesis.


    # 5. Mention the advantages of representing stacks using linked lists than arrays.


    The advantages of representing stacks using linked lists than arrays.


    +   - It is not necessary to specify the number of elements to be stored in a
    stack during its declaration (since memory is allocated dynamically at run time
    when an element is added to the stack).

    +   - Insertions and deletions can be handled easily and efficiently.

    +   - Linked list representation of stacks can grow + shrink in size without wasting
    the memory space, depending upon the insertion & deletion that occurs in the list.

    +   - Multiple stacks can be represented efficiently using a chain for each stack.


    # 6. Define a queue.


    Queue is an ordered collection of elements in which insertions and deletions are
    restricted to one end. The end from which elements are added and/or removed is
    referred to as the rear end, and the end from which deletions are made are referred
    as the front end.


    # 7. State the difference between queues and linked lists.


    The difference between queues and linked lists is that insertions and deletions
    may occur anywhere in linked list, but in queues insertions can be made only in
    the rear end and deletions can be made only in the front end.


    # 8. List the various type of addresses used in linked lists.


    The addresses used in linked list includes,


    +   - External address

    +   - Internal address

    +   - Null address


    # 9. Define external address.


    External address is the address of the first node in the list. This address is
    stored in the head pointer which points to the first node in the list.'
