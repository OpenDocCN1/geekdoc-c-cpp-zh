  md: '# Important points to be noted while evaluating a postfix expression using
    a stack


    +   - When you convert infix expression to postfix notation, the operands are
    always in the same order and the operators are probably in a different order.

    +   - The first element you pop off of the stack in an operation should be evaluated
    on the right-hand side of the operator. For multiplication and addition, order
    doesn’t matter, but for subtraction and division, your answer will be incorrect
    if you change your operands around.


