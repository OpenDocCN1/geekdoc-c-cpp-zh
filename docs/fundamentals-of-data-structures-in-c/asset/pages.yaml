    **non-volatile cell** A memory cell, which does not loose the information stored
    in it when power is switched off.


    **null address** It is the address stored by the NULL pointer of the last node
    of the list, which indicates the end of the list.


    **null character** It is used for terminating strings. It has the ASCII code of
    zero.


