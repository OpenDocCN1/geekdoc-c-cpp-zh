    # 4.8 Graphs


    A graph is a non-linear data structure that represents less relationship between
    its adjacent elements. There is no hierarchical relationship between the adjacent
    elements in case of graphs. A graph consists of a set of non-empty vertices (referred
    as nodes in case of trees), together with a set of edges, and each edge joins
    two different vertices. A path is a sequence of distinct vertices each adjacent
    to the next, except possibly the first vertex and last vertex is different. In
    Fig. 4.34 1, 2, 3 is path and 3, 4, 1 is also a path. A cycle is path containing
    atleast three vertices such that the starting and the ending vertices are the
    same. In Fig. 4.34, the path formed by vertices 1, 2, 3, 4 is a cycle.


    # 4.8.1 Definitions in Graphs


    Graphs are generally classified as,


    +   • Undirected graph.

    +   • Directed graph.


    If an edge between any two nodes is not directionally oriented, a graph is referred
    as an undirected graph or unqualified graph. Fig. 4.34 shows an undirected graph
    in which 12 or 21, 23 or 32 or 34 or 43 and 14 or 41 are edges that are not oriented
    directionally. If an edge between any two nodes is directionally oriented, a graph
    is referred'
  merge: -1
  img_proc: true
