  md: '# 5.11 Summary


    +   Sorting a group or sequence of elements or data items means rearranging them
    in either ascending or descending order depending upon the relationship among
    the data items present in the group.


    +   Searching is a programming technique that determines whether an element or
    a data item is present in the given list or not.


    +   Bubble sort derives its name from the fact that while sorting the data, the
    smallest data item bubbles to the initial position of the partially sorted list.


    +   Insertion sort derives its name from the fact that while sorting the data,
    each data item is inserted in its correct position among the initially placed
    data items.


    +   Quick sort divides the initial unsorted list into two parts, such that every
    element in the first list is less than all the elements present in the second
    list. The procedure is then repeated recursively for both the parts, up to relatively
    short sequences, which can be sorted until the sequences, reduces to length one.


    +   Merge sort algorithm chops the list into two. If the list has even length,
    split the list into two equal sub lists. If the list has odd length, divide the
    list into by making the first sub list one entry greater than the second sub list.
    Then split both the sub lists into two and go on until each of the sub lists are
    of size one. Finally, start merging the individual sub lists to obtain a sorted
    list.


    +   In sequential search, the value to be found is searched, from left to right
    one by one until the element is found or until the end of the list is reached.
    This search doesn’t require that the data items in the list to be in sorted order.


    +   Binary search algorithm splits the list into two and locates the middle element
    in the list. If the search element is less than the middle element, the first
    part of the list is searched else the second part of the list is searched. This
    process continues until the search element is equal to the middle element or the
    list consists of only one element that is not equal to the search element.


    +   A possible improvement in binary search is not to use the middle element at
    each step, but to guess more precisely where the key being sought falls within
    the current interval of interest. This improved version is called fibonacci search.


    +   A table which maintains key (of the item that is mapped to an index value)
    is referred to as the hash table.


    +   Hash table is also referred as scatter table, since we are trying to scatter
    the data throughout the table.'
