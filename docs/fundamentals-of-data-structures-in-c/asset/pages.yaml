  md: '# ## 1.7.7 Conditional Operators (Ternary Operators)


    An expression that evaluates condition is called a **conditional expression**.
    The operator used to evaluate conditional expression is called a **conditional
    operator**. Denoted by `?(.)`. It is also referred as a **ternary operator**,
    since it takes three operands as its arguments. The general form or the syntax
    of the conditional operator is


    ```

    expr1 ? expr2 : expr3;

    ```


    When evaluating a conditional expression, `expr1` is evaluated first. If `expr1`
    is true, `expr2` is alone evaluated. If `expr1` is false, `expr3` is alone evaluated.


    For example,


    ```

    a = ( b > 2 ) ? 8 : 6 ;

    ```


    # ## 1.7.8 Assignment Operators


    Assignment operators are used to assign the result of an expression to a variable.
    The equals (=) sign is used as an assignment operator. It is used to form assignment
    expressions, which assigns the value of an expression to an identifier, which
    may be written in the form of


    ```

    identifier = expression;

    ```


    where `expression` represents a constant or a variable or a complex expression.
    The value evaluated from the expression is stored in the `identifier`, which is
    a variable.


    In addition, C has a set of shorthand assignment operators of the form


    ```

    identifier <operator> = expression;

    ```


    The operator should be an arithmetic operator or a bitwise operator. **Table 1.11**,
    shows the various shorthand operators and their meaning.


    | Operator | Meaning |

    |---|---|

    | += | Assign sum |

    | -= | Assign difference |

    | *= | Assign product |

    | /= | Assign quotient |

    | %= | Assign remainder |

    | ~= | Assign one’s complement |

    | <<= | Assign left shift |

    | >>= | Assign right shift |

    | &= | Assign bitwise AND |

    | |= | Assign bitwise OR |

    | ^= | Assign bitwise X-OR |'
