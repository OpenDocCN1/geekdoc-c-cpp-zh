    as threads, then the binary tree is referred to as left in-threaded binary tree.


    +   If you use only the right pointer fields (for storing inorder successor) as
    threads, then the binary tree is referred to as right in-threaded binary tree.


    +   If you use both left and right pointer fields as threads, then the binary
    tree is referred to as fully in-threaded binary tree.


    +   An appropriate data structure that supports the operations for inserting a
    new element and deleting the largest element is referred to as a **priority queue**.


    +   A **binary heap** is an array that is viewed as a complete binary tree. A
    complete binary tree is completely filled on all levels except possibly the lowest,
    and the lowest level is filled from the left.


    +   A graph is a non-linear data structure that represents less relationship between
    its adjacent elements. There is no hierarchical relationship between the adjacent
    elements in case of graphs.


    +   If an edge between any two nodes in a graph is not directionally oriented,
    a graph is called as undirected graph. It is also referred as unqualified graph.


    +   If an edge between any two nodes in a graph is directionally oriented, a graph
