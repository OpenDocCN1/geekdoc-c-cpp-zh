    ![](img/32da3a4a82d0a65ae37d5228b3ab3ad1_252_3.png)


    Fig. 4.16 : Steps for insertion operation in a binary search tree.


    # Deletion of a Node


    Another primitive operation that can be done in a binary search tree is the deletion
    of a node. Memory is to be released for the node to be deleted. A node can be
    deleted from the tree from three different places namely,


    +   * Deleting the leaf node

    +   * Deleting the node with only one child

    +   * Deleting the node with two children.


    # Deleting the leaf node


    Steps followed to delete a leaf node from the binary search tree.


    +   * Search the parent of the leaf node, and make the link to the leaf node as
    NULL.

    +   * Release the memory for the deleted node.'
  merge: -1
  img_proc: true
- pgno: 253
  md: '![](img/32da3a4a82d0a65ae37d5228b3ab3ad1_253_0.png)


    Fig. 4.17a : Before deleting the leaf node 6. Fig. 4.17b : After deleting the
    leaf node 6. Fig. 4.17 : Steps for deleting the leaf node.


    # Deleting the node with only one child


    Steps followed to delete the node (with only one child) from the binary search
    tree.


    +   - Search the parent of the node to be deleted (with only one child).

    +   - Assign the link of the parent node to the child of the node to be deleted.

    +   - Release the memory for deleted node.


    ![](img/32da3a4a82d0a65ae37d5228b3ab3ad1_253_1.png)


    Fig. 4.18a : Before deleting the node 5, Fig. 4.18b : After deleting the node
    5. Fig. 4.18 : Steps for deleting a node that has only one children.


    # Deleting the node with two children


    Steps followed to delete the node (with two children) from the binary search tree.


    +   - Search the parent of the node to be deleted (with two children).

    +   - Copy the content of the inorder successor to the node to be deleted (with
    two children).

    +   - Delete the inorder successor node. If the inorder successor node has no
    child, follow the steps given in the deleting the leaf node. If the inorder successor
    node has only one child, follow the steps given in the deleting node with one
    child.

    +   - Release the memory for the inorder successor node.

    +   - Replace the contents of the node to be deleted with the copy of the content
    of the inorder successor node.


    In Program 4.2, deleteNode( ) function is used for deleting the node from binary
    search tree.'
