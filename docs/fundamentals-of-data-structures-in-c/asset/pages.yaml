  md: '# 14. State the differences between the function prototype and function definition.


    | Function prototype | Function definition |

    |---|---|

    | a) It defines the function. | a) It defines the function. |

    | b) It ends with a semicolon. | b) It doesn''t ends with a semicolon. |

    | c) The declaration needn''t include parameters. | c) It should include names
