    # 1.5 Variables


    A quantity, which may vary during program execution, is called as a variable.
    Variable name is an arbitrary name, an identifier used to refer to the area of
    memory in which a particular value is stored. These memory locations can contain
    an integer, real, single character or a string constant.


    # 1.5.1 Declaration of Variables


    A data item must be assigned to a variable at some point in the program. The data
    item can then be accessed later in the program simply by referring to the variable
    name. The information represented by the variable can change during execution
    of the program, but the data type associated with the variable cannot change.
    A variable name used by the programmer can be in a meaningful way to reflect its
    use or function or nature in the program. All variables used in the program must
    be declared before all executable statements (i.e., at the start of each function
    after the opening flower brace ({) of the function). Declaration of variables
    begins with its type followed by one or more variable names. Declaration assigns
    the variable to a specific data type and there by allocate memory to the variables
    depending upon the data type. For example,


    ```

    int a, b, c;

    char d1, e2, f3;

    float x_1, y_2, z_3;

    ```


    In the first declaration, a, b and c are variables declared as type integer (because
    of the use of int data type). In the next declaration, d1, e2 and f3 are character
    variables (because of the use of char data type). In the last declaration, x_1,
    y_2 and z_3 are floating-point variables (because of the use of float data type).'
  merge: -1
  img_proc: true
- pgno: 28
  md: '# 1.5.2 Initialization of Variables


    Variables can also be initialized when they are declared. This is done by adding
    an equal sign followed by the required value to be initialized after the declaration.
    For example,


    ```

    int a = 5, b = 10;

    char d1 = ''a'';

    float x_1 = 100.056;

    ```


    The first declaration declares two variables a and b of type integer and thereby
    initializing the variables with the values 5 and 10 respectively. The next declaration
    declares a character variable d1 and initializes with a value ''a'' (i.e., a single
    character constant). The last declaration declares a floating-point variable x_1
    and initializes with a value 100.056. Variables can also be initialized in the
    program with an assignment statement of the form,


    ```

    variable = constant;

    where constant is the value to be assigned to the variable. For example,

    age = 23;

    salary = 7500.75;

    ```


    The first declaration initializes the value 23 to the variable age, and the next
    declaration initializes the value 7500.75 to the variable salary. Variables in
    C can be broadly classified into two types. They are,


    +   * Constant variables

    +   * Volatile variables.


    # Constant Variables


    Variables that cannot be changed by a function in which it is present or by any
    other function in the same program are called as **constant variables**. The keyword
    const is used for this purpose. It protects variables from modification during
    execution of a program. The following declaration illustrates this,


    ```

    const int x = 34;

    ```


    In the above initialization, x is a variable declared as type integer (because
    of the use of int data type). The value in the variable (i.e., 34 in x) cannot
    be modified during execution of the program, because of the use of const keyword
    before the data type declaration. The C compiler protects constant variable from
    modification.


    # Volatile Variables


    The variable that can be changed at any time by a function in which it is present
    or by any other function in the same program are called as **volatile variables**.
    The keyword volatile is used for this purpose. The following declaration illustrates
    this,


    ```

    volatile int z = 6000;

    ```'
