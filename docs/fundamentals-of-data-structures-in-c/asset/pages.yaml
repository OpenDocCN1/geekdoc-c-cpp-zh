    # ## 3.8.3 Evaluating an Expression in Postfix Notation


    Evaluating an expression in postfix notation is trivially easy if you use a stack.
    The postfix expression to be evaluated is scanned from left to right. Variables
    or constants are pushed onto the stack. When an operator is encountered, the indicated
    action is performed using the top two elements of the stack, and the result replaces
    the operands on the stack.


    # ### Steps to be noted while evaluating a postfix expression using a stack


    +   - Traverse from left to right of the expression.

    +   - If an operand is encountered, push it onto the stack.

    +   - If you see a binary operator, pop two elements from the stack, evaluate
    those operands with that operator, and push the result back in the stack.

    +   - If you see a unary operator, pop one element from the stack, evaluate those
    operands with that operator, and push the result back in the stack.

    +   - When the evaluation of the entire expression is over, the only thing left
    on the stack should be the final result. If there are zero or more than 1 operands
    left on the stack, either your program is inconsistent, or the expression was
    invalid.'
