  img_proc: true
- pgno: 235
  md: 'node A. A link between a parent node and its child node is also referred as
    a *branch*. All nodes in a tree, except the root node must descend from a parent
    node via a child node. The child nodes of a given parent node are referred as
    *siblings*. In *Fig. 4.1*, nodes B, C, D and E are referred as siblings to its
    parent node A, where as F and G are siblings of its parent node B and so on.


    ![](img/32da3a4a82d0a65ae37d5228b3ab3ad1_235_0.png)


    **Fig. 4.1 : A tree structure.**


    In the hierarchy represented by a tree, the child nodes of a parent are one level
    lower than the parent node. The entire tree structure is leveled in such a way
    that the root node is always at level 1. Then, its immediate children are at level
    2 and their immediate children are at level 3 and so on. In general, if a node
    is at level n, then its children will be at level (n+1). Thus in *Fig. 4.1*, the
    root node A is at level 1, its child nodes B, C, D and E are at level 2 and so
    on. A subset of a tree that is itself a tree is called a *subtree*. The number
    of subtrees in a node is referred as its *degree*. In *Fig. 4.1*, the degree of
    the root node A is 4, degree of node B is 2, where as the degree of the node L
    is 4.


    The ancestors of a node are all the nodes along the path from the root to that
    node. The root node of the tree is the ancestor of all the nodes in the tree.
    In *Fig. 4.1*, the ancestors of node O is A, B and F. Each node in a tree can
    be a parent and can have any number of child nodes to it. A node that has no children
    (i.e., with zero degree) is called as a *leaf* or *terminal node*. All other intermediate
    nodes that traversing the given tree from its root node to the terminal nodes
    are referred as *non-terminal nodes*. In *Fig. 4.1*, there are totally 15 terminal
    nodes (i.e., G, I, K, M, N, O, P, R, S, T, U, V, W and X) and 9 non-terminal nodes
    (i.e., A, B, C, D, E, F, H, L, Q and X).


    The *height* or *depth* of a tree is defined as the maximum level of any node
    in the tree. In *Fig. 4.1*, root node A has the maximum level, which descends
    to the bottom of the tree at V, W and X. The height of the tree shown in *Fig.
    4.1* is 5. In a given tree, if you remove the root node, then it becomes a forest.
    In *Fig. 4.1*, if you remove the root node A, then it becomes a forest with four
    trees.'
