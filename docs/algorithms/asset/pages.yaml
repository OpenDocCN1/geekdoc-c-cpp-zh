  md: "# Memoization\n\nIn dynamic programming, we write a recursive formula that\
    \ expresses large problems in terms of smaller ones and then use it to fill a\
    \ table of solution values in a bottom-up manner, from smallest subproblem to\
    \ largest.\n\nThe formula also suggests a recursive algorithm, but we saw earlier\
    \ that naive recursion can be terribly inefficient, because it solves the same\
    \ subproblems over and again. What about a more intelligent recursive implementation,\
    \ one that remembers its previous invocations and avoids repeating them?\n\nOn\
    \ the knapsack problem (with repetitions), such an algorithm would use a hash\
    \ table (recall Section 1.5) to store the values of K(w) that had already been\
    \ computed. At each recursive call requesting some K(w), the algorithm would first\
    \ check if the answer was already in the table and then proceed to its calculation\
    \ if it wasn't. This is called memoization.\n\nA hash table, initially empty,\
    \ holds values of K(w) indexed by w\n\n```\nfunction knapsack(w)\n  if w is in\
    \ hash: return K(w)\n  K(w) = max(knapsack(w - wi) + vi : wi ≤ w)\n  insert K(w)\
    \ into hash table, with key w\n  return K(w)\n```\n\nSince this algorithm never\
    \ repeats a subproblem, its running time is O(nw), just like the dynamic programming.\
    \ The constant factor in this-O notation is significantly larger because of the\
    \ overhead of recursion.\n\nIn some cases, though, memoization pays off. Here's\
    \ why: dynamic programming automatically solves every subproblem that could conceivably\
    \ be needed, while memoization only solves the ones that are actually used. For\
    \ instance, if W and all the weights wi are multiples of 100. A subproblem K is\
    \ useless unless 100 does not divide w. The memoized recursive algorithm will\
    \ never look at these extraneous entries.\n\ncommutative (in general, A × B ≠\
    \ B × A), but it is associative, which means for instance A × (B × C) = (A × B)\
    \ × C. We can compute the product of matrices in many different ways, depending\
    \ on how we parenthesize it. Are there some of these others?\n\nMultiplying an\
    \ m × n matrix by an n × p matrix takes mnp, to a good approximation. Using this\
