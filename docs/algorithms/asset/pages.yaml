  md: "# 2.6 The fast Fourier transform\n\n**Figure 2.8** The FFT takes points in\
    \ the standard coordinate system, whose axes are shown here as $x_1, x_2, x_3$,\
    \ and rotates them into the Fourier basis, whose axes are the columns of $M_n(\\\
    omega)$, shown here as $f_1, f_2, f_3$. For instance, points in direction $x_1$\
    \ get mapped into direction $f_1$.\n\n![](img/3dd1f1364df8f87b80683fc32a15b999_76_0.png)\n\
    \ninner product\n\n$u \\cdot v^* = u_0v_0^* + u_1v_1^* + \\dots + u_{n-1}v_{n-1}^*$.\n\
    \nwhere $z^*$ denotes the complex conjugate$^4$ of $z$. This quantity is maximized\
    \ when the vectors lie in the same direction and is zero when the vectors are\
    \ orthogonal to each other.\n\nThe fundamental observation we note is the following.\n\
    \n**Lemma** The columns of matrix $M$ are orthogonal to each other.\n\nProof.\
    \ Take the inner product of any columns $j$ and $k$ of matrix $M$,\n\n$1 + \\\
    omega^{(j-k)} + \\omega^{2(j-k)} + \\dots + \\omega^{(n-1)(j-k)}$.\n\nThis is\
    \ a geometric series with first term 1, last term $\\omega^{(n-1)(j-k)}$, and\
    \ ratio $\\omega^{(j-k)}$, which is 0—except when $j=k$, in which case all terms\
    \ are 1 and the sum is $n$.\n\nThe orthogonality property can be summarized in\
    \ the single equation\n\n$MM^* = nl$.\n\n$(MM^*)_{jk}$ is the inner product of\
    \ the $j$th and $k$th columns of $M$ (do you see why?). This implies $M^{*-1}\
    \ = (1/n)M^*$; we have an inversion formula! Is this the same formula we claimed?\
    \ Let’s see—$(j,k)$th entry of $M^*$ is the complex conjugate of the corresponding\
    \ entry of $M$, in other words $\\omega^{-jk}$. Whereupon $M^* = M_n(\\omega^{-1})$,\
    \ and we’re done.\n\nAnd now we can finally step back and view the whole affair\
    \ geometrically. The task we need to perform, polynomial multiplication, is a\
    \ lot easier in the Fourier\n\n> $^4$The complex conjugate of a number $z=re^{i\t\
    heta}$ is $z^*=re^{-i\theta}$. The complex conjugate of a vector (or matrix) is\
    \ obtained by taking the complex conjugates of all its entries."
