    # A randomized algorithm for minimum cut


    We have already seen that spanning trees and cuts are intimately related. There
    is another connection. Let remove the last edge that Kruskal''s algorithm adds
    to the spanning tree; this breaks the tree into two components, defining a cut
    (S, S) in the graph. What can we say about this? Suppose the graph we were working
    with was unweighted, and its edges were weighted uniformly at random for Kruskal''s
    algorithm to process them. Here is a remarkable fact: with probability at least
    1/n², (S, S) is the minimum cut in the graph, where the size of a cut (S, S) is
    the number of edges crossing between S and S. This means that repeating the process
    O(n²) times outputs the smallest cut with high probability: an O(nm²) algorithm
    for unweighted minimum cut. Further tuning the O(nm² log n) minimum cut algorithm,
    invented by David Karger, is the fastest known algorithm for this important problem.


    So let us see why the cut in each iteration is the minimum cut with probability
    at least 1/n². At any stage of Kruskal''s algorithm, the vertex V is partitioned
    into connected components. The only edges eligible to be added to the tree have
    their endpoints in distinct components. The number of edges incident to each component
    must be at least C, the size of the minimum cut in G (since we could consider
    a cut that separated this component from the rest of graph). So if there are k
    components in the graph, the number of edges leading out of it is at least kC/2
    (and we need to compensate for the expense of double-counting each edge). Since
    the edges were randomly ordered, the chance that the next edge in the list is
    from the minimum cut is at most C/(kC/2)=2/k. Thus, with probability at least
    1-2/k=(k-2)/k, the choice leaves the minimum cut intact. But now that Kruskal''s
    algorithm leaves the minimum cut all up to the choice of the last spanning tree
    is at


    $$\frac{n-2}{n} \cdot \frac{n-3}{n-1} \cdot \frac{n-4}{n-2} \cdots \frac{2}{n-4}
    \cdot \frac{1}{n-3} = \frac{1}{n(n-1)}$


