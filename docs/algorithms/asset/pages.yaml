    So far we have a reduction from ZOE to RUDRATA CYCLE WITH PAIRED EDGES; but we
    are really interested in RUDRATA CYCLE, which is a special case of the problem
    with paired edges: where the set of C is empty. To accomplish our goal, we need,
    as usual, to find a way of getting rid of the unwanted feature—in this case the
    edge pairs.


