    \ pattern of reasoning arises often in the study of graphs and is in essence a\
    \ streamlined induction. A more formal inductive proof would start by framing\
    \ a hypothesis, such as \"for any k ≥ 0, all nodes within k hops from v visited.\"\
    \ The base case is as usual trivial, since v is visited anyway. The general case—if\
