    programming was an esoteric activity practiced by so few people as to even merit
    a name. Back then programming “planning,” and “dynamic programming” were conceived
    to optimally multistage processes. The dag of Figure 6.2 can be thought of describing
    the possible ways in which such a process can evolve: each node denotes a state,
    the leftmost node is the starting point, and the edges leaving a state represent
    possible actions, leading to different states in the next unit of time.


