    # 7.6 The simplex algorithm


    There are cases. If the optimum value of $z_1 + \dots + z_m$ is zero, then all
    $z_i$''s are zero, and hence from the optimum vertex of the new LP we get a starting
    feasible vertex of the original LP, just by ignoring the $z_i$''s. We can at start
    simplex!


    But what if the optimum objective turns out be positive? Let us think. We tried
    to minimize the $z_i$''s, but simplex decided that it cannot be zero. But this
    means that the linear region is infeasible: *it needs nonzero $z_i$* to become
    feasible. This is how simplex reports and that an LP is infeasible.


    # **Degeneracy:**


    In the polyhedron of 7.12 vertex $B$ is degenerate. Geometrically, this means
    that it is the intersection of more than $n = 3$ Faces of the polyhedron (in this
    case, ②, ③, ④, ⑤). Algebraically, it means if we choose any one of four sets of
    inequalities (②, ③, ④), (②, ③, ⑤), and (③, ④, ⑤) and solve the corresponding system
    of three linear equations in three unknowns, we get the same solution in all cases:
    (0, 300, 0). This is a serious problem: simplex may return a suboptimal degenerate
    vertex because all its neighbors are identical to it and thus has no better objective.
    And if we modify the simplex so that it detects degeneracy and continues to hop
    from vertex to vertex despite of any improvement in the cost, it may end up looping.


    One way to fix this is by a *perturbation*: change $b$ by any tiny amount that
    doesn''t change the element of the LP since the $\epsilon_i$''s are tiny, but
    it has the effect of differentiating the solutions of the linear systems. We can
    see why geometrically, that the four planes ②, ③, ④, ⑤ were jolted a little. Wouldn''t
    vertex $B$ split into two vertices, very close to one another?


    # **Unboundedness:**


    In cases an LP is unbounded, in its objective function can be made arbitrarily
    large (or small, in minimization problem). If this is the case, simplex will discover:
    in exploring the neighborhood of a vertex, it will notice that adding an inequality
    leads to an underdetermined system of equations that has infinity of solutions.
    And in fact (this is an easy test) the space of solutions contains a whole line
    across which the objective become larger and larger, all the way to $\infty$.
    In this case simplex halts and completes.


    # 7.6.4 Running time of simplex


