    # Algorithms 17


    k sets, there must be some set with at least $n_t/k$ of them. Therefore, the greedy
    strategy will ensure that


    $n_{t+1} \le n_t - \frac{n_t}{k} = n_t \left(1 - \frac{1}{k}\right)$,


    which by repeated application implies $n_t \le n_0(1-1/k)^t$. A more convenient
    bound can be obtained from the following inequality


    $1 - x \le e^{-x}$ for all $x$, with equality if and only if $x = 0$,


    which is most easily proved by a picture:


    ![](img/3dd1f1364df8f87b80683fc32a15b999_157_0.png)


    Thus


    $n_t \le n_0 \left(1 - \frac{1}{k}\right)^t < n_0(e^{-1/k})^t = ne^{-t/k}$


    At $t = k \ln n$, therefore, $n_t$ is strictly less than $ne^{-\ln n} = 1$, which
    means no elements remain to be covered.


    The ratio between the greedy algorithm''s solution and the optimal solution varies
    from input to input but is always less than $\ln n$. And there are inputs for
    which the ratio is very close to $\ln n$ (Exercise 5.34). We call this ratio the
    approximation factor of the greedy algorithm. There seems to be a lot of room
    for improvement, but in fact such hopes are unjustified: it turns out under certain
    widely-held complexity assumptions (which will be clearer when we reach Chapter
    8), there isably no polynomial-time algorithm with a smaller approximation factor.'
