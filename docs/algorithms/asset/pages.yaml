    # 9.2.1 Vertex cover


    We already know the VERTEX COVER problem is NP-hard.


    # Vertex Cover


    Input: An undirected graph G = (V, E).


    Output: A subset of the vertices S ⊆ V that touches every edge.

    Goal: Minimize |S|.


    See Figure 9.3 for an example.


    Since VERTEX COVER is a special case of SET COVER, we know from Chapter 5 that
    it can be approximated within a factor of O(log n) by the greedy algorithm: repeatedly
    delete the vertex of highest degree and include it in the vertex cover. There
    are graphs on which the greedy algorithm returns a vertex cover that is indeed
    log n the optimum.


    A better approximation algorithm for VERTEX COVER is based on the notion of matching,
    a subset of edges that have no vertices in common (Figure 9.4). A matching is
    maximal if no more edges can be added to it. Maximal matchings will help find
    good vertex covers, moreover, they are easy to generate: repeatedly pick edges
    that are disjoint from the ones already chosen, until this is no longer possible.


    What is the relationship between matchings and vertex covers? Here is the crucial
    fact: any vertex cover of a graph G must be at least as the number of edges in
    any matching in G; that is, any matching provides a lower bound on OPT. This is
    simply because each edge of the matching must be covered by one of its endpoints
    in any vertex cover! Finding such a lower bound is a key step in designing an
    approximation algorithm, because we must compare the quality of the solution found
    by our algorithm to OPT, which is NP-complete to compute.'
  merge: -1
  img_proc: true
