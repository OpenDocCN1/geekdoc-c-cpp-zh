  md: '# The unix Sort command


    Comparing the algorithms for sorting and median-finding we notice that, beyond
    the common divide-and-conquer philosophy and structure, they are exact opposites.
    Mergesort splits the array in the most convenient way (first half, second half),
    without any regard to the magnitudes of the elements in each half; but then it
    works until the subarrays are sorted. In contrast, the median algorithm is careful
    about its splitting (smaller numbers first, then the larger ones), but its work
    ends with the recursive call.


    Quicksort is a sorting algorithm that splits the array in exactly the same way
    as the median algorithm; and once the subarrays are sorted, by two recursive calls,
    there is nothing more to do. Its worst-case performance is $\Theta(n^2)$, like
    that of median-finding. But it can proved (Exercise 2.24) that its average case
    is $O(n \log n)$; furthermore, empirically it outperforms other sorting algorithms.
    This has made quicksort a favorite in many applications—instance, it is the basis
    of the code by which enormous files are sorted.


    From this recurrence we conclude that $T(n) = O(n)$: on any input, our algorithm
    returns the correct answer after a linear number of steps, on the average.


    # 2.5 Matrix multiplication


    The product of two $n \times n$ matrices $X$ and $Y$ is a third $n \times n$ matrix
    $Z = XY$, with $(i, j)$th entry


    $Z_{ij} = \sum_{k=1}^{n} X_{ik}Y_{kj}$


    To make it more visual, $Z_{ij}$ is the dot product of the $i$th row of $X$ with
    the $j$th column of $Y$:


    ![](img/3dd1f1364df8f87b80683fc32a15b999_66_0.png)


    In general, $XY$ is not the same as $YX$; matrix multiplication is not commutative.
    The preceding formula implies an $O(n^3)$ algorithm for matrix multiplication:
    there are $n^2$ entries to be computed, and each takes $O(n)$ time. For a while,
    this was widely believed to be the best running time possible, and it even proved
    that in certain models of computation no algorithm could do better. It was therefore
    a source of great excitement when in 1969, the German mathematician Volker Strassen
    announced a significantly more efficient algorithm, based upon divide-and-conquer.'
