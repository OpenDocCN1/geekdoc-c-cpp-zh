    Another difference (possibly not completely unrelated) is this: as we see in Chapter
    10, FACTORING succumbs to the power of quantum computation—while SAT, TSP, and
    the other NP-complete problems do not seem to.


    # 8.3 The Reductions


    We shall now see that the search problems of Section 8.1 can be reduced to one
    another as depicted in Figure 8.7. As a consequence, they are all NP-complete.


    Before we tackle the specific reductions in the tree, let us warm up by mentioning
    two versions of the Rudrata problem.


    Rudrarata (s, t)-Path ⟶ Rudrata Cycle


    Recall the RUDRATA CYCLE problem: given a graph, is there a cycle that passes
    through each vertex exactly once? We can also formulate the closely related RUDRATA
    (s, t)-PATH problem, in which two vertices s and t are specified, and we want
    a path starting at s and ending at t that goes through each vertex exactly once.
    It is possible that RUDRATA CYCLE is easier than RUDRATA (s, t)-PATH? We will
    show by a reduction that the answer is no.'
