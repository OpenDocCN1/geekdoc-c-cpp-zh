    # ### 3.1 Why graphs?


    A wide range of problems can be expressed with clarity and precision in the concise
    pictorial language of graphs. For instance, consider the task of coloring a political
    map. What is the minimum number of colors needed, with the obvious restriction
    that neighboring countries should have different colors? One of the difficulties
    in attacking this problem is that the map itself, even a stripped-down version
    like Figure 3.1(a), is usually cluttered with irrelevant information: intricate
    boundaries, border posts where three or more countries meet, open seas, and meandering
    rivers. Such distractions are absent from the mathematical map of Figure 3.1(b),
    a graph with vertex for each country (1 is Brazil, 11 is Argentina) and edges
    between neighbors. More the precise goal is now to assign a color to each vertex
    so that no edge has endpoints of the same color.


    Graph coloring is not the exclusive domain of map designers. Suppose a university
    needs to schedule examinations for all its classes and wants to use the fewest
    time slots. The only constraint is that two exams cannot be scheduled concurrently
    if one student will be both of them. To express this problem as a graph, use one
    vertex for each exam and put an edge between two vertices if there is a conflict,
    that if there is somebody taking both exam endpoints. Each time slot has its own
    color. Then, assigning time slots is exactly the same as coloring this graph!


    Some basic operations on graphs arise with such frequency, and in such a diversity
    of contexts, that lot of effort has gone into finding efficient procedures for
    them. This chapter is devoted to some most fundamental of these algorithms—those
    that uncover the basic connectivity of a graph.


    Formally, a graph is specified by a set of vertices (also called *nodes*) V and
    edges $E$ between select pairs of vertices. In each map example, $V = \{1, 2,
    3, \dots, 13\}$ and $E$ includes among many other edges, $\{1, 2\}$, $\{9, 11\}$,
    and $\{7, 13\}$. Here an edge between $x$ and $y$ specifically means “x shares
    a border with $y$.” This is a symmetric'
