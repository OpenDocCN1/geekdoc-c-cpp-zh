  md: '# 286


    # 9.3 Local search heuristics


    We now have a well-defined local search procedure. How does it measure up under
    our two standard criteria for algorithms—what is its overall running time, and
    does it always return the best solution?


    Embarrassingly, neither of these questions has a satisfactory answer. Each iteration
    is certainly fast, because a tour has only $O(n^2)$ neighbors. However, it is
    not clear how many iterations will be needed: for instance, there might be an
    exponential number of them. Likewise, we can easily say about the final tour that
    it is locally optimal—that is, it is superior to the tours in its immediate neighborhood.
    There might be better solutions further away. For instance, the following picture
    shows a possible final answer that is clearly suboptimal; the range of local moves
    is simply too limited to improve upon it.


    ![](img/3dd1f1364df8f87b80683fc32a15b999_296_0.png)


    To overcome this, we may try a more generous neighborhood, for instance 3-change,
    consisting of tours that differ up on three edges. And indeed, the preceding bad
    case gets fixed:


    ![](img/3dd1f1364df8f87b80683fc32a15b999_296_1.png)


    But there is a downside, in that the size of a neighborhood becomes $O(n^2)$,
    making each iteration more expensive. Moreover, there may still be suboptimal
    local minima, although fewer than before. To avoid this, we would have to go up
    to 4-change, or higher. In this manner, efficiency and quality often turn out
    to be competing considerations in a local search. Efficiency demands neighborhoods
    that can be searched quickly, but smaller neighborhoods increase the abundance
    of low-quality local optima. The appropriate compromise is typically determined
    by experimentation.


    Figure 9.7 shows a specific example of local search at work. Figure 9.8 is a more
    abstract, stylized depiction of local search. The solutions the unshaded area,
    and cost decreases when we move downward. Starting from an initial solution, the
    algorithm moves downhill until a local optimum is reached.


    In general, the search space might be riddled with local optima, and some of them
    may be of very poor quality. The hope is that with a judicious choice of neighborhood
    structure, most local optima will be reasonable. Whether this is the reality or
    merely'
