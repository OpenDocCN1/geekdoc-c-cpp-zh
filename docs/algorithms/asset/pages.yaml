  md: '# Figure 6.10 The largest independent set in this graph has size 3.


    ![](img/3dd1f1364df8f87b80683fc32a15b999_186_0.png)


    Like several problems we have seen in this chapter (knapsack, traveling salesman),
    finding the largest independent set in a graph is believed to be intractable.
    However, when the graph happens to be a tree, the problem can be solved in linear
    time, using dynamic programming. And what are the appropriate subproblems? In
    the chain matrix multiplication problem we noticed that the layered structure
    of a tree provides a natural definition of a subproblem—as long as one node of
    the tree has been identified as a root.


    So here''s the algorithm: Start by rooting the tree at any node $r$. Now, each
    node defines a subtree—the one hanging from it. This immediately suggests subproblems:


    $I(u)$ = size of largest independent set of subtree hanging from $u$.


    Our final goal is $I(r)$.


    Dynamic programming proceeds as always from smaller subproblems to larger ones,
    that is to say, bottom-up in the root. Suppose we know the independent sets for
    all subsets below a node $u$; in other words, suppose we know $I(u)$ for all descendants
    of $u$. How can we compute $I(u)$? Let''s split the computation into two cases:
    any independent set includes $u$ or it doesn''t (Figure 6.11).


    ```

    $I(u) = \max \left\ 1 + \sum_{grandchildren\ of\ u} I(w), \sum_{children\ of\
    u} I(w) \right\right.$

    ```


    If the independent set includes $u$, then we get one point for it, but we aren''t
    allowed to include the children of $u$—therefore we move on to the grandchildren.
    This is the first case in the formula. On the other hand, if we don don''t include
    $u$, then we don''t get a point for it, but we can move on to its children.


    The number of subproblems is exactly the number of vertices. With a little care,
    the running time can be made linear, $O(|V| + |E|)$.'
