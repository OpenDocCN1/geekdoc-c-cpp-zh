  md: "# Chapter 2\n\n# Algorithms 51\n\nThe correctness of this algorithm is self-evident,\
    \ as long as a correct subroutine is specified. If we are given two sorted arrays\
    \ x[1...k] and y[1...l], how we efficiently merge them into a single sorted array[1...k+l]?\
    \ Well, the first element of z is either x[1] or y[1], whichever is smaller. The\
    \ rest of z[i] can be constructed recursively.\n\n```\nfunction merge(x[1...k],\
    \ y[1...l])\n  if k=0: return y[1...l]\n  if l=0: return x[1...k]\n  if x[1]≤y[1]:\n\
    \    return x[1]○merge(x[2...k], y[1...l])\n  else:\n    return y[1]○merge(x[1...k],\
    \ y[2...l])\n```\n\nHere ○ denotes concatenation. This merge procedure takes a\
    \ constant amount of work per recursive call (the provided array space is allocated\
    \ in advance), for a total running time of O(k+l). Merge's are linear, and the\
    \ overall time taken by mergesort is\n\n```\nT(n) = 2T(n/2) + O(n).\n```\n\nor\
    \ O(n log n).\\ Looking back the mergesort algorithm, we see that all the real\
    \ work is done in merging, which doesn't start until the recursion gets down to\
    \ singleton arrays. The singletons are merged in pairs, to yield arrays with two\
    \ elements. Then pairs of 2-tuples are merged, producing 4-tuples, and so on.\
    \ Figure 2.4 shows an example.\n\nThis viewpoint also suggests how mergesort might\
    \ be iterative. At any given moment, there is a set of \"active\" arrays—initially,\
    \ the singletons—which are merged in pairs to give the next batch of arrays. These\
    \ arrays can be organized in a queue, and processed by repeatedly removing arrays\
    \ from the front of the queue, merging them, and putting the result at the end\
    \ of the queue.\n\nIn the following pseudocode, the primitive operation inject\
    \ adds element to the end of the queue while removes and returns the element at\
    \ the front of the queue.\n\n```\nfunction iterative-mergesort(a[1...n])\nInput:\
    \ elements a1, a2,...,an to be sorted\n\nQ = [ ] empty queue\nfor i=1 to n:\n\
    \  inject(Q, [ai])\nwhile |Q| > 1:\n  inject(Q, merge(eject(Q), eject(Q)))\nreturn\
    \ eject(Q)\n```"
