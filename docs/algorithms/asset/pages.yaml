  md: "158 longest increasing sequences\n\n# Figure 6.2 The dag of increasing subsequences.\n\
    \n![](img/3dd1f1364df8f87b80683fc32a15b999_168_0.png)\n\nIn this case, the arrows\
    \ denote transitions between consecutive elements of the optimal solution. More\
    \ generally, to better understand the solution space, let's create a graph of\
    \ all permissible transitions: establish a node $i$ for each element $a_i$, and\
    \ add directed edges $(i, j)$ whenever it is possible for $a_i$ and $a_j$ to be\
    \ consecutive elements in an increasing subsequence, that, whenever $i < j$ and\
    \ $a_i < a_j$ (Figure 6.2).\n\nNotice that (1) this graph $G = (V, E)$ is a dag,\
    \ since all edges $(i, j)$ have $i < j$, and (2) there is a one-to-one correspondence\
    \ between increasing subsequences and paths in this dag. Therefore, our goal is\
    \ to find the longest path in the dag!\n\nHere is the algorithm:\n\n```\nfor j\
    \ = 1,,...,n:\n  L(j) = 1 + max(L(i) : (i, j) $\\in$ E)\nreturn max, L(j)\n```\n\
    \n$L(j)$ is the length of the longest path—the longest increasing subsequence—ending\
    \ at $j$ (plus 1, strictly speaking we need to count nodes on the path, not edges).\
    \ By reasoning in the same way we did for shortest paths, we see that any path\
    \ to $j$ must pass through one of its predecessors, and therefore $L(j)$ is 1\
    \ plus the maximum $L(i)$—value of these predecessors. If there are no edges into\
    \ $j$, we take the maximum over the empty set, zero. And the final answer is the\
    \ largest $L(j)$, since any ending position is allowed.\n\nThis is dynamic programming.\
    \ In order to solve our original problem, we have defined a collection of subproblems\
    \ $L(j) : 1 \\leq j \\leq n$ with the following key property that allows them\
    \ to be solved in a single pass:\n\n> * There is an ordering on the subproblems,\
    \ and a relation that shows how to solve a subproblem by giving the answers to\
    \ \"smaller\" subproblems, that is, subproblems that appear earlier in the ordering.\n\
    \nIn our case, each subproblem is solved using the relation\n\n```\nL(j) = 1 +\
    \ max(L(i) : (i, j) $\\in$ E).\n```"
