    nodes are intermediate products (Figure 6.7). The possible orders in which to
    do the multiplication are the various full binary trees with $n$ leaves, whose
    number is exponential in $n$ (Exercise 2.13). We certainly cannot try each tree,
    and with brute force ruled out, we turn to dynamic programming.


