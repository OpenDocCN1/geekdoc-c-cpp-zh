- pgno: 58
  md: '# 2.2 Divide-and-conquer integer multiplication. (a) Each problem is divided
    into three subproblems. (b) The levels of recursion.


    (a)


    ![](img/3dd1f1364df8f87b80683fc32a15b999_58_0.png)


    (b)


    At the very top level, when $k=0$, this works out to $O(n)$. At the bottom, when
    $k=\log_2 n$, it is $O(n^{\log_2 3})$, which can be rewritten as $O(n^{1.58})$.
    Between these two endpoints, the work increases geometrically from $O(n)$ to $O(n^{3.3})$,
    by a factor of 3/2 per level. The sum of any increasing geometric series is simply
    the last term of the series: such is the rapidity of the increase (Exercise 0.2).
    Therefore the overall running time is $O(n^{\log_2 3})$.


    In the absence of Gauss''s trick, the recursion tree would have the same height,
    but the branching factor would be 4. There would be $4^{n}=n^2$ leaves, and therefore
    the running time would be much slower. In divide-and-conquer algorithms, the number
    of subproblems translates into the branching factor of the recursion tree; small
    changes in this coefficient can have a big impact on running time.


    A practical note: it generally does not make sense to recur all the way to 1 bit.
    For most processors, 16- or 32-bit multiplication is a single operation, so by
    the time the numbers get into this range they should be handed over to the built-in
    procedure.


    Finally, the eternal question: Can we do better? It turns out that other divide-and-conquer
    algorithms for multiplying numbers exist, based on another important divide-and-conquer
    algorithm like the Fourier transform, to be explained in Section 2.6.'
