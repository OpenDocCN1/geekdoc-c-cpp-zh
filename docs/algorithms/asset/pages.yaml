  md: '1.2 Modular arithmetic


    # 1.2 Modular arithmetic


    With repeated addition or multiplication, numbers can get overwhelmingly large.
    It is fortunate that we reset the hour zero whenever it reaches 24, and the month
    to January after every stretch of 12 months. Similarly, for the built-in arithmetic
    operations of computer processors, numbers are restricted to some size, 32 bits
    say, which is considered generous enough for most purposes.


    For the applications we are working toward—primality testing and cryptography—it
    is necessary to deal with numbers that are significantly larger than 32 bits,
    but whose nature is nonetheless without modulus.


    Modular arithmetic is a system for dealing with restricted ranges of integers.
    We define $x \pmod N$ to be the remainder when $x$ is divided by $N$; if $x=qN+r$
    with $0 \leq r < N$, this gives an enhanced notion of equivalence between numbers:
    $x$ and $y$ are *congruent modulo* $N$ if they differ by a multiple of $N$, or
    in symbols,


    ```

    $x = y \pmod N \iff N \text{ divides }(x - y).$

    ```


    For instance, $25 \equiv 13 \pmod{60}$ because $25-13$ is a multiple of 60; for
    famously, 253 minutes is 4 hours and 13 minutes. These numbers can also be negative,
    as $59 \equiv -1 \pmod{60}$: when it is 59 minutes past the hour, it is also 1
    minute short of the next hour.


    Figure 1.3 Addition modulo 8.


    ![](img/3dd1f1364df8f87b80683fc32a15b999_26_0.png)


    One way to think of modular arithmetic is that it limits numbers to a predefined
    range $[0, 1, \dots, N-1]$ and wraps around whenever you try to leave this range—like
    the hand of a clock (Figure 1.3).


    Another interpretation is that modular arithmetic deals with all the integers,
    but divides them into $N$ equivalence classes, each of the form $[i + kN : k \in
    \mathbb{Z}]$ for some $i$ between 0 and $N-1$. For example, there are three equivalence
    classes modulo 3:


    ```

    $-9 -6 0 3 6 9 . . .\n$-8 -5 -2 1 4 10 . . .\n$-7 -4 -1 2 5 8 11 . . .$

    ```


    Any member of an equivalence class is substitutable for any other; when viewed
    modulo 3, the numbers 5 and 11 are different. Under such substitutions, addition
    and multiplication remain well-defined:'
