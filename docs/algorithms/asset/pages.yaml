    find that the four symbols are equally abundant.


    | Symbol | Frequency |

    |--- |--- |

    | A | 70 million |

    | B | 3 million |

    | C | 20 million |

    | D | 37 million |


    Is there some sort of variable-length encoding, in which just one bit is used
    for the frequently occurring symbol A, at the expense of needing three or more
    bits for less common symbols?


    A danger with having codewords of different lengths is that the resulting encoding
    may not be uniquely decipherable. For instance, if the codewords are [0, 01, 11,
    001],'
