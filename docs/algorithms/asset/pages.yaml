  md: '# 10.1 Qubits, superposition, and measurement


    **Figure 10.1** An electron can be in a ground state or in an excited state. The
    Dirac notation used in quantum physics, these are denoted |0⟩ and |1⟩. But the
    superposition principle says that in fact, the electron is in a state that is
    a *linear combination* of these two: α₀|0⟩ + α₁|1⟩. This would make immediate
    sense if the α’s were probabilities, nonnegative real numbers adding to 1. But
    as the superposition principle insists that they can be *arbitrary complex numbers*,
    and as long as the squares of their norms add up to 1!


    ![](img/3dd1f1364df8f87b80683fc32a15b999_308_0.png)


    ground state |0⟩


    excited state |1⟩


    superposition

    α₀|0⟩ + α₁|1⟩


    by |1⟩. These are the two possible states of the electron in classical physics.
    Many of the most counterintuitive principles of quantum physics arise from the
    *superposition principle* that states if a quantum system can be in one of two
    states, then it can also be in *any linear superposition* of those states. For
    instance, the state of the electron could be ½|0⟩ + ½|1⟩ or ½|0⟩ − ½|1⟩ or an
    infinite number of combinations of the form α₀|0⟩ + α₁|1⟩. The coefficient α₀
    is called the *amplitude* of the state, and similarly with α₁. And—if things aren’t
    already strange enough—the α’s be complex numbers, as long as they are normalized
    so that |α₀|² + |α₁|² = 1. For example, ½|0⟩ + i|1⟩ (where i is the imaginary
    unit, √−1) is a perfectly valid quantum state! Such a superposition, α₀|0⟩ + α₁|1⟩
    is a basic unit of encoded information in quantum computers (Figure 10.1). It
    is called a *qubit* (pronounced “cubit”).


    The whole concept of a superposition suggests that the electron does not make
    up its mind about whether it is in the ground or excited state, and the amplitude
    α₀ is a measure of its inclination toward the ground state. Continuing along this
    line of thought, it is tempting to think of α₀ as the probability that the electron
    is in the ground state. But then how are we make sense of the fact that α₀ can
    be negative, or even imaginary? This is one of the most mysterious aspects of
    quantum physics, that seem to extend beyond our intuitions about the physical
    world.


    This linear superposition of the electron’s state however is the private world
    of the electron. For to get a glimpse of its state we must make a *measurement*,
    and when we do, we get a silly bit of information—0 or 1. If the electron is α₀|0⟩
    + α₁|1⟩, then the outcome of the measurement is 0 with probability |α₀|² and


