  md: '# Chapter 4


    # Algorithms 07


    and extremely useful properties we saw in Chapter 3. But it also means DFS can
    end taking a long and convoluted route to a vertex that is actually very close,
    as in Figure 4.1. Breadth-first search makes sure to visit vertices in increasing
    order of their distance from the starting point. This is a broader, lower search,
    rather like the propagation of a wave upon water. And it is achieved using almost
    exactly the same code as DFS—but with a queue in place of a stack.


    Also notice one stylistic difference from DFS: since we are only interested in
    distances from s, we do not restart the search in other connected components.
    Nodes reachable from s are simply ignored.


    # 4.3 Lengths on edges


    Breadth-first search treats all edges as having the same length. This is rarely
    true in applications where shortest paths are to be found. For instance, suppose
    you are driving from San Francisco to Las Vegas, and want to find the quickest
    route. Figure 4.5 shows the major highways we might conceivably use. Picking the
    right combination of them is a shortest-path problem in which the length of each
    edge (each stretch of highway) is important. For the remainder of this chapter,
    we will deal with this more general scenario, annotating every edge $e \in E$
    with a length $l_e$. If $e = (u, v)$, we will sometimes write $l(u, v)$ or $l_{uv}$.


    > Figure 4.5 Edge lengths often matter.


    ![](img/3dd1f1364df8f87b80683fc32a15b999_117_0.png)


    These $l_e$ do not have to correspond to physical lengths. They could denote time
    (driving time between cities) or money (cost of taking a bus), or any other quantity
    that we would like to conserve. In fact, there are cases in which we need to use
    negative lengths, but we will briefly overlook this particular complication.'
