    # 8.3 The reductions


    The reduction seems complete: from any matching we can recover a satisfying truth
    assignment by simply looking at each variable gadget and seeing which girl $b_{i0}$
    was matched. And if any satisfying assignment we can match the gadget corresponding
    to each variable $x$ so that $(b_{i0}, g_{i1}, p_{i1})$ and $(b_{i1}, g_{i0},
    p_{i1})$ and $(b_{i1}, g_{i1}, p_{i3})$ are chosen if $x$ is true and if $x$ is
    false; for each clause match $b_c$ and $g_c$, the pet corresponds to one of its
    satisfying literals.


    But one last problem remains: in the matching defined at the end of the last paragraph,
    some pets may be left unmatched. In fact, if there are $n$ variables and $m$ clauses,
    exactly $2n - m$ pets will be left unmatched (you can check that this number is
    to be positive, because we have at most three occurrences of every variable, and
    at least two literals in each clause). This is easy to fix: Add $2n - m$ new boy-girl
    couples that are "generic animal-lovers", and match them by triples with all the
    pets!


    # 3D MATCHING—→ZOE


    ```

    Ax = 1

    ```


    satisfied, where by $I$ we denote the column vector of all 1''s. How can we express
    the 3D MATCHING problem in this framework?

    ZOE and $ILP$ are very useful problems precisely because they provide a format
    in which many combinatorial problems can be expressed. In such a formulation we
    think of the $0-1$ variables as describing a solution, and we write equations
    expressing the constraints of the problem.


    For example, how do we express an instance of 3D MATCHING ($m$ boys, $m$ girls,
    $m$ pets, and $n$ boy-girl-pet triples) in the language of ZOE. We have $0-1$
    variables $x_1, \dots, x_n$, one per triple, where $x_i=1$ means that the $i$th
    triple is chosen for the matching, and $x_i = 0$ means that it is not chosen.


    Now all we have to do is write equations stating the solution described by the
    $x_i$''s is a legitimate matching. For each boy (or girl, or pet), suppose that
    the triples containing him (or her, or them) are those numbered $j_1, j_2, \dots,
    j_k$; the appropriate equation is then


    ```

    $x_{j_1} + x_{j_2} + \dots + x_{j_k} = 1$,

    ```


    which states that exactly one of the triples must be included in the matching.
    For example, here is the $A$ matrix for an instance of 3D MATCHING we saw earlier.'
