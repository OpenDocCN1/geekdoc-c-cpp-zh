    | Instance I | f | Instance f(I) | Algorithm for B | h | Solution h(S) of I |

    |---|---|---|---|---||

    | | | | No solution to f(I) | | No solution to I |


    And now we can finally define the class of the hardest search problems.


    A search problem is NP-complete if all other search problems reduce to it.


    This is a very strong requirement indeed. For a problem to be NP-complete, it
    must be useful in solving every search problem in the world! It is remarkable
    that the first column of the table we saw is earlier filled with the most famous
    examples. But they do, and in Section 8.3 we will see how all these problems reduce
    to one another, and why all other search problems reduce to them.


    # Factoring


    One last point: we started off this book by introducing famously hard search problem:
    FACTORING, the task of finding all prime factors is of a different nature than
    that of the other hard search problems we have just seen. For example, nobody
    believes that FACTOR is NP-complete. One major difference is that, in the case
    of FACTORING, the definition does not contain the now familiar clause “or report
    that none exists.” A number can always be factored into primes.'
