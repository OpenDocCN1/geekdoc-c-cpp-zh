  md: '# Crawling fast


    All this assumes that the graph is given to us, with vertices numbered 1 to n
    and edges tucked in adjacency lists. The realities of the World Web are very different.
    The nodes of the graph are not known in advance, and they have to be discovered
    by one during the process of search. And, of course, recursion is out of the question.


    Still, crawling the Web is done by algorithms similar to depth-first search. An
    explicit stack is maintained, containing all nodes that have been discovered (as
    endpoints of hyperlinks) not not explored. In fact, this “stack” is not a last-in,
    first-out list. It gives highest priority to the nodes that were inserted most
    recently (not the ones that were inserted early, that would be a breadth-first
    search, see Chapter 2), but to the ones that look most “interesting”—a heuristic
    criterion whose purpose is to keep the stack from overflowing, and to the extent,
    to leave unexplored nodes that are unlikely to lead to vast expenses.


