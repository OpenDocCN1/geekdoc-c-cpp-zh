    # 7.2.2 Maximizing flow


    The networks we are dealing with consist of a directed graph G = (V, E); special
    nodes s, t ∈ V, which are, respectively, a source and sink of G; and capacities
    ce > 0 on the edges.


    We would like to send as much oil as possible from s to t without exceeding the
    capacities of any of the edges. A particular shipping scheme is called a flow
    of a variable fe for each edge e of the network, satisfying the following two
    properties:


    +   1. It doesn''t violate edge capacities: 0 ≤ fe ≤ ce for all e ∈ E.

    2. For all nodes u except s and t, the amount of flow entering u equals the amount
    leaving u:


    ```

    $$\sum_{(w,u) \in E} f_{wu} = \sum_{(u,z) \in E} f_{uz}$

    ```


    In other words, flow is conserved.


    The size of a flow is the total quantity sent from s to t and, by the conservation
    principle, is equal to the quantity leaving:


    ```

    $size(f) = \sum_{(u,a) \in E} f_{ua}$

    ```


    In short, our goal is to assign values to {f_e : e ∈ E} that will satisfy a set
    of linear constraints and maximize a linear objective function. But this is a
    linear program! The maximum-flow problem reduces to linear programming.


    For example, for the network of Figure 7.4 the LP has 11 variables, one per edge.
    It seeks to maximize $f_{sa} + f_{fb}$ + $f_{fc}$ subject to a total of 27 constraints:
    11 for nonnegative ($f_{sa} \geq 0$), 11 for capacity ($f_{sa} \leq 3$), and 5
    for flow conservation (one for each node of the graph other than s and t, such
    as $f_{fc} + f_{dc}$ = Simple)'
