- pgno: 198
  md: '# # Chapter 7

    # Linear programming and reductions


    Many of the problems for which we want algorithms are optimization tasks: the
    shortest path, the cheapest spanning tree, the longest increasing subsequence,
    and so on. In such cases, we seek a solution that satisfies certain constraints
    (for instance, the path must use edges of the graph and lead from s to t, the
    tree must touch all nodes, the subsequence must be increasing); and (2) is the
    best possible, with respect to some well-defined criterion, among all solutions
    that satisfy these constraints.


    Linear programming describes a broad class of optimization tasks in which both
    the constraints and the optimization criterion are linear functions. It turns
    out an enormous number of problems can be expressed in this way.


    Given the vastness of its topic, this chapter is divided into several parts, which
    can be read separately subject to the following dependencies.


    | Introduction to linear programming and reductions | Duality | Games |

    | | Flows and matchings | |


    # ## 7.1 An introduction to linear programming


    In a linear programming problem we are given a set of variables, and we want to
    assign real values to them as to (1) satisfy a set of linear equations and/or
    inequalities involving these variables and (2) maximize or minimize a given linear
    objective function.'
  merge: -1
  img_proc: true
- pgno: 199
  md: '# 7.1.1 Example: profit maximization


    A Boutique chocolatier has two products: its flagship assortment of truffle chocolates,
    called *Pyramid*, and the more decadent and deluxe Pyramid Nut. How much of each
    should it produce to maximize profits? Let''s say it makes $x_1$ boxes of Pyramid
    per day, at a profit of $1 each, and $x_2$ boxes of Nut, at a more substantial
    profit of $6 apiece; $x_1$ and $x_2$ are unknown values that we wish to determine.
    But this is not all; there are some constraints on $x_1$ and $x_2 \ge 0$. First,
    the daily demand for these exclusive chocolates is limited to at most 200 boxes
    of Pyramid and 300 boxes of Nut. Also, the current workforce can produce a total
    of at most 400 boxes of chocolate per day. What are the optimal levels of production?


    We represent the situation by a *linear program*, as follows.


    ```

    Objective function $\max x_1 + 6x_2$

    Constraints $x_1 \le 200$

    $x_2 \le 300$

    $x_1 + x_2 \le 400$

    $x_1, x_2 \ge 0$

    ```


    A linear equation in $x_1$ and $x_2$ defines a line in the two-dimensional (2D)
    plane, and a linear inequality designates a *half-space*, the region on one side
    of the line. The set of all *feasible solutions* of this linear program, to the
    points $(x_1, x_2)$ which satisfy all constraints, is the intersection of five
    half-spaces. It is a convex polygon, shown in Figure 7.1.


    We want to find the point in this polygon that the objective function—profit—is
    maximized. The points with a profit of $c$ dollars lie on the line $x_1 + 6x_2
    = c$, which has a slope of $-1/6$ and is shown in Figure 7.1 for selected values
    of $c$. As $c$ increases, this “profit line” moves parallel to itself, and to
    the right. Since the goal


    **Figure 7.1** (a) The feasible region for a linear program. (b) Contour lines
    of the objective function: $x_1 + 6x_2 = c$ for different values of the profit
    $c$.


    ![](img/3dd1f1364df8f87b80683fc32a15b999_199_0.png)'
