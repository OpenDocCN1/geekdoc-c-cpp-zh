- pgno: 11
  md: '# Chapter 0


    # Prologue


    Look around you. Computers and networks are everywhere, enabling an intricate
    web of complex human activities: education, commerce, entertainment, research,
    manufacturing, health management, human communication, even war. Of the two main
    technological underpinnings of this amazing proliferation, one is obvious: the
    breathtaking pace with which advances in microelectronics and chip design have
    been bringing us faster and faster hardware.


    This book tells the story of the other intellectual pieces that is crucially fueling
    the computer revolution: efficient algorithms. It is a fascinating story.


    Gather ''round and listen close.


    # 0.1 Books and algorithms


    Two ideas changed the world. In 1448 in the German city of Mainz a goldsmith named
    Johann Gutenberg discovered a way to print books by putting together metallic
    pieces. Literacy spread, the Dark Ages ended, the human intellect was liberated,
    science and technology triumphed, the Industrial Revolution happened. Many historians
    say we owe all this to typography. Imagine a world in which only an elite could
    read these lines! But others insist that the key development was not typography,
    but *algorithms.*


    ![](img/3dd1f1364df8f87b80683fc32a15b999_11_0.png)


    Johann Gutenberg

    1398–1468


    © Corbis'
  merge: -1
  img_proc: true
- pgno: 12
  md: '# 0.2 Enter Fibonacci


    Today we are so used to writing numbers in decimal, that it is easy to forget
    Gutenberg wrote the number 1448 as MCDXLVIII. How do you add two Roman numerals?
    What is MCDXLVIII + DCCXIII? (And just try to think about multiplying them.) Even
    a clever man like Gutenberg only knew how to add and subtract small numbers using
    his fingers; for anything more complicated had to consult an abacus specialist.


    The decimal system, invented in India around AD 600, was a revolution in quantitative
    reasoning: using only 10 symbols, very large numbers could be written compactly,
    and arithmetic could be done efficiently on them. Nonetheless these ideas took
    a long time to spread, hindered by traditional barriers of language, distance,
    and ignorance. The most influential medium of transmission turned out to be a
    textbook, written in Arabic in the ninth century by a man who lived in Baghdad.
    Al Khwarizmi laid the basic methods for adding, multiplying, and dividing numbers—even
    squaring roots and calculating digits of $\pi$. These procedures were precise,
    unambiguous, mechanical, efficient, correct—in short, they were algorithms, a
    term coined to honor the wise man after the decimal system was finally adopted
    in Europe, many centuries later.


    Since then, this decimal positional system and its numerical algorithms have played
    an enormous role in Western civilization. They enabled science and technology;
    they accelerated industry and commerce. And when, much later, the computer was
    finally designed, it explicitly embodied the positional system in its bits and
    words and arithmetic unit. Scientists everywhere got busy developing more and
    more complex algorithms for all kinds of problems and inventing new applications—ultimately
    changing the world.


    # 0.2 Enter Fibonacci


    Al Khwarizmi''s work could not have gained a foothold in the West not for the
    efforts of one man: the 13th century Italian mathematician Leonardo Fibonacci,
    who saw the potential of the positional system and worked hard to develop it and
    propagate it.


    But today Fibonacci is most known for his famous sequence of numbers


    0, 1, 2, 3, 5, 8, 13, 21, 34, \dots$,


    each the sum of its immediate predecessors. More formally, the Fibonacci numbers
    $F_n$ are generated by the simple rule


    ```

    $F_n = \begin{cases} F_{n-1} + F_{n-2} & \text{if } n > 1 \ 1 & \text{if } n =
    1 \ 0 & \text{if } n = 0. \end{cases}$

    ```'
  merge: -1
  img_proc: true
- pgno: 13
  md: "# Chapter 0\n\n# Algorithms 3\n\nNo other sequence of numbers has been studied\
    \ extensively, or applied to more fields: biology, demography, art, architecture,\
    \ music, to name just a few. And, together with the powers of 2, it is computer\
    \ science's favorite sequence.\n\nIn fact, the Fibonacci numbers grow almost as\
    \ the powers of 2: for example, $F_{30}$ is over a million, and $F_{100}$ is already\
    \ 21 digits long! In general, $F_n \\approx 2^{0.694n}$ (see Exercise 0.3).\n\n\
    But what is the precise value of $F_{100}$, or $F_{200}$? Fibonacci himself would\
    \ wanted to know such things. To answer, we need an algorithm for computing the\
    \ $n$th Fibonacci number.\n\n![](img/3dd1f1364df8f87b80683fc32a15b999_13_0.png)\n\
    \n# An exponential algorithm\n\nOne idea is to slavishly implement the recursive\
    \ definition of $F_n$. Here is the resulting algorithm, in the “pseudocode” notation\
    \ used throughout this book:\n\n```\nfunction fib1(n)\n  if n = 0: return 0\n\
    \  if n = 1: return 1\n  return fib1(n-1) + fib1(n-2)\n```\n\nWhenever we have\
    \ an algorithm, correct? there are three questions we always ask about it:\n\n\
    +   1. Is it correct?\n2. How much time does it take, as a function of $n$?\n\
    3. And can we do better?\n\nThe first question is most here, as this algorithm\
    \ is precisely Fibonacci’s definition of $F_n$. The second demands an answer.\
    \ Let $T(n)$ be the number of computer steps needed to compute `fib1(n)`; what\
    \ can we say about this function? For starters, if $n$ is less than 2, the procedure\
    \ halts almost immediately, after just a couple of steps. Therefore,\n\n$T(n)\
    \ \\le 2$ for $n \\le 1$."
  merge: -1
  img_proc: true
- pgno: 14
  md: "For large values of $n$, there are two recursive invocations of $fib1$, taking\
    \ time $T(n-1)$ and $T(n-2)$, respectively, plus three computer steps (checks\
    \ on the value of $n$ and a final addition).\n\n$T(n) = T(n-1) + T(n-2) + 3 \\\
    text{ for } n > 1.$\n\nCompare this to the recurrence relation for $F_n$: we immediately\
    \ see that $T(n) \\geq F_n$.\n\nThis is bad news: the timing of the algorithm\
    \ grows as fast as the Fibonacci numbers $T(n)$ is exponential in $n$, which implies\
    \ that the algorithm is practically slow except for very small values of $n$.\n\
    \nLet's be a little more concrete about exponential time. To compute $F_{200}$,\
    \ the $fib1$ algorithm executes $T(200) \\geq F_{200} \\geq 2^{138}$ elementary\
    \ steps. How long this actually depends, of course, on the computer used. At this\
    \ time, the fastest computer in the world is the NEC Earth Simulator, which clocks\
    \ 40 trillion steps per second. Even on this, $fib1(200)$ would take at least\
    \ $2^{92}$ seconds. This means that, if we start the computation today, it would\
    \ still be long after the sun turns into a red giant.\n\nBut technology is rapidly\
    \ improving—computer speeds be doubling every 18 months, a phenomenon called Moore's\
    \ law. With this extraordinary growth, $fib1$ will run a lot faster on next year's\
    \ machines. Let's see the time of $fib(n)$ is proportional to $\\approx (1.6)^n$,\
    \ so it takes 1.6 times longer to compute $F_{n+1}$ from $F_n$. Under Moore's\
    \ law, computers get roughly 1.6 times faster each year. So if we can reasonably\
    \ compute $F_{100}$ with this year's technology, next year we will manage $F_{101}$.\
    \ And the year after, $F_{102}$. And the so on: just one more Fibonacci number\
    \ every time.\n\nIn short, our recursive algorithm is correct but hopelessly inefficient.\
    \ Can we do better?\n\n# A polynomial algorithm\n\nLet's try to understand why\
    \ $fib1$ is so slow. Show the cascade of recursive invocations triggered by a\
    \ single call to $fib1(n)$. Notice how many computations are repeated!\n\nA more\
    \ sensible scheme would store the intermediate results—values $F_0, F_1, \\dots,\
    \ F_{n-1}$—as soon as they become known.\n\n```\nfunction fib2(n)\n  if n = 0:\n\
    \    return 0\n  create an array f[0...n]\n  f[0] = 0, f[1] = 1\n  for i = 2..n:\n\
    \    f[i] = f[i-1] + f[i-2]\n  return f[n]\n```"
  merge: -1
  img_proc: true
- pgno: 15
  md: '# Figure 0.1 The proliferation of recursive calls in fib1.


    ![](img/3dd1f1364df8f87b80683fc32a15b999_15_0.png)


    As with fib1, the correctness of this algorithm is self-evident because directly
    uses the definition of $F_n$. How long does it take?! The inner loop consists
    of a single computer step and is executed $n-1$ times. Therefore the number of
    computer steps used by fib2 is linear in $n$. From exponential we are down to
    polynomial, a huge breakthrough in running time. It is now perfectly reasonable
    to compute $F_{200,000}^1$.


    As we will see repeatedly throughout this book, the right algorithm makes all
    the difference.


    # More careful analysis


    In discussion so far, we have been counting the number of basic computer steps
    executed by each algorithm and thinking of these basic steps as taking a constant
    amount of time. This is a very useful simplification. After all, a processor''s
    instruction set has variety of basic primitives—branching, storage to memory,
    comparing numbers, simple arithmetic, and so on—rather than distinguishing between
    these elementary operations, it is far more convenient to lump them together into
    one category.


    But looking back at our treatment of Fibonacci algorithms, we have been too liberal
    with what we consider a basic step. It is reasonable to treat addition as a single
    computer step if small numbers are being added, 32-bit numbers say. The $n$th
    Fibonacci number is about $0.64n$ bits long, and this can exceed 32 as $n$ grows.


    > $^1$To better appreciate the importance of this dichotomy between exponential
    and polynomial algorithms, the reader may want to peek ahead to the story of Sissa
    and Moore in Chapter 8.'
  merge: -1
  img_proc: true
- pgno: 16
  md: 'Arithmetic operations on arbitrarily large numbers cannot possibly be performed
    in a single, constant-time step. We need to audit our earlier running time estimates
    and make them more honest.


    We will see in Chapter 1 that the addition of two $n$-bit numbers takes time roughly
    proportional to $n$; this is not hard to understand if you think back to the gradeschool
    procedure for addition, which works on one digit at a time. $fib1$, which performs
    actually uses a number of basic steps roughly proportional to $fibn$; likewise,
    the number of steps taken by $fib2$ is proportional to $n^2$, still polynomial
    in $n$ and therefore exponentially superior to $fib1$. This correction to the
    running time analysis does not diminish our breakthrough.


    But we do even better than $fib2$? We intend to see: Exercise 0.4.


    # 0.3 Big-O notation


    We''ve just seen how looseniness in the analysis of running times can lead to
    an unacceptable level of inaccuracy in the result. The opposite danger is also
    present: it is possible to be precise. An insightful analysis is based on the
    right simplifications.


    Expressing running time in terms of basic computer steps is already a simplification.
    After all, the time taken by each one step depends crucially on the particular
    processor and on details such as caching strategy (a result of which the running
    time can differ from one execution to the next). Accounting for these architecture-specific
    minutiae is a nightish task and yields a poor result; therefore makes more sense
    to see an cluttered, machine-independent characterization of an algorithm''s efficiency.
    To this end, we will always express running time by counting the number of basic
    computer steps, as a function of the size of the input.


    And this simplification leads to another. Instead of repeating the algorithm steps,
    $5n^2+4n+3$ steps on an input of size $n$, it is much simpler to leave out lower
    terms such as $4n$ and $3$ (which become insignificant as $n$ grows), and even
    the detail of the coefficient $c$ in the leading term (which will be five times
    faster in a few years nowadays), and just that the algorithm takes time $O(n^2)$
    (pronounced "big oh of $n$").


    It is time to define this notation precisely. In what follows, think of $f(n)$
    and $g(n)$ as the running times of two algorithms on inputs of size $n$.


    Let $f(n)$ and $g(n)$ be functions from positive integers to positive reals. We
    say $f=O(g)$ (which means that "$f$ grows faster than $g$") if there is a constant
    $c > 0$ such that $f(n) \le c \cdot g(n)$.


    Saying $f=O(g)$ is a very loose analog of $f \le g$. It differs from the constant
    $c$, so for instance $10n=O(n)$. This also allows us to disregard what happens
    for small values of $n$. For example, suppose we'
  merge: -1
  img_proc: true
- pgno: 17
  md: '# Chapter 0


    # Algorithms 7


    are choosing between two algorithms for a particular computational task. One takes
    $f_1(n)=n^2$ steps, while the other takes $f_2(n)=2n+20$ steps (Figure 0.2). Which
    is better? Well, this depends on the value of $n$. For $n \le 5$, $n^2$ is smaller;
    and thereafter, $2n+20$ is the clearer winner. In this case, $f_2$ scales much
    better than $n$, and therefore it is superior.


    This superiority is captured by the big-O notation: $f_2 = O(f_1)$, because


    ```

    $$\frac{f_2(n)}{f_1(n)} = \frac{2n+20}{n^2} \le 22$$

    ```


    for all $n$; on the other hand, $f_1 \neq O(f_2)$, since the ratio $f_1(n)/f_2(n)
    = n^2/(2n+20)$ can be arbitrarily large, and no constant $c$ will make the definition
    work.


    # Figure 0.2 Which running time is better?


    ![](img/3dd1f1364df8f87b80683fc32a15b999_17_0.png)


    Another algorithm comes along, one that uses $f_3(n) = n+1$ steps. Is this better
    than $f_2$? Certainly, but only by a constant factor. The discrepancy between
    $2n+20$ and $n+1$ is tiny compared to the huge gap between $n^2$ and $2n+20$.
    In order to stay focused on the big picture, we treat functions as if they differ
    only by multiplicative constants.


    Returning to definition of big-O, we see that $f_2 = O(f_3)$:


    ```

    $$\frac{f_2(n)}{f_3(n)} = \frac{2n+20}{n+1} \le 20.$

    ```


    and of course $f_3 = O(f_2)$, this time with $c = 1$.'
  merge: -1
  img_proc: true
- pgno: 18
  md: 'Just as O() is an analog of ≤, we can also define analogs of ≥ and = as follows:


    In the preceding example, f2 = Θ(f1) and f1 = Ω(f3).

    Big-O notation lets us focus on the picture. When with a complicated function
    like 3n² + 4n + 5, we just replace it with O(n), where f(n) is as simple as possible.
    In this particular example use O(n²), because the quadratic portion of the sum
    dominates the rest. Here are some commons rules that help simplify functions by
    omitting dominated terms:


    +   1. Multiplicative constants can be omitted: 14n² dominates n².

    2. nᵃ dominatesᵇ if a > b: for instance n dominates n.

    3. Any exponential dominates any polynomial: 3ⁿ dominates n² (even dominates 2ⁿ).

    4. Likewise, any polynomial dominates any logarithmic: log n dominates (log n)³.
    This also means, for example, n² dominates n log n.


    Don''t misunderstand this variety attitude toward constants. Programmers and developers
    are very interested in what would gladly stay up nights in order to make an algorithm
    faster by a factor of 2. But understanding algorithms at the level of this book
    would be impossible without the simplicity afforded by big-O notation.


    # Exercises


    0.1. In each of the following situations, indicate whether f = O(g), or f = Ω(g),
    or both (in which case f = Θ(g)).


    | f(n) | g(n) |

    |(a) n-100 | n-200 |

    |(b) n¹² | n²³ |

    |(c) 100n+log n | n+(log)² |

    |(d) log n | 10log 10n |

    |(e) 2log | 3n |

    |(f) 10 log | log(n²) |

