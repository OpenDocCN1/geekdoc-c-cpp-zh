    points in the same cluster and must therefore have diameter at least $r$.


    This algorithm has a certain high-level similarity to our scheme for VERTEX COVER.
    Instead of a maximal matching, we use a easily computable scheme—a set of $k$
    points that cover all of $X$ within some radius $r$, and at the same time being
    mutually separated by a distance of at least $r$. This structure is used to generate
    a clustering and to give a lower bound on the optimal clustering.


    We know of no better approximation algorithm for this problem.


