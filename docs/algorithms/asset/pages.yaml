  md: '# # Chapter 2

    Divide-and-conquer algorithms


    The divide-and-conquer strategy solves a problem by:


    +   1. Breaking into subproblems that are themselves smaller instances of the
    same type of problem

    2. Recursively solving these subproblems

    3. Appropriately combining their answers


    The real work is done piecealce, at three different places: in the partitioning
    of problems into subproblems; at the very tail end of the recursion, when sub-problems
    are so small that they are solved outright; and in the gluing together of partial
    answers. These are held together and coordinated by the algorithm''s recursive
    structure.


    As an introductory example, we''ll see how this technique yields a new algorithm
    for multiplying numbers, one that is much more efficient than the method we all
    learned in elementary school!


    # ##2.1 Multiplication


    The mathematician Carl Friedrich Gauss (1775–1855) once noticed that although
    the product of two complex numbers


    ```

    $(a+bt)(c+dt) = ac-bd+(bc+ad)i$

    ```


    seems to involve four real-number multiplications, which in fact can be done with
    just three: $ac, bd,$ and $(a+b)(c+d)$, since


    ```

    $bc+ad = (a+b)(c+d)-ac-bd$

    ```


    In our big-O of thinking, reducing the number of multiplications from four to
    three seems wasted ingenuity. But this modest improvement becomes very significant
    when applied recursively.


    Let''s move away from complex numbers and see how this helps with regular multiplication.
    Suppose $x$ and $y$ are two-$n$-bit integers, and assume for convenience $n$ is
    a power of 2 (the more general case is hardly any different). As a first step
    toward multiplying $x$ and $y$, split each of them into their left and right halves,'
