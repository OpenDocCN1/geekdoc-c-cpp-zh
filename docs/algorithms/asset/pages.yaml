- pgno: 137
  md: '# Chapter 5

    Greedy algorithms


    A game like chess can be won only by thinking ahead: a player who is focused entirely
    on immediate advantage is easy to defeat. But in many other games, as Scrabble,
    it is possible to do quite well by simply making whichever seems best at the moment
    and not worrying too much about future consequences.


    This sort of behavior is easy and convenient, making it an attractive algorithmic
    strategy. Greedy algorithms build up a solution by piece, always choosing the
    next piece that offers the most obvious and immediate benefit. Although such an
    approach can be disastrous for some computational tasks, there are many for which
    it is optimal. Our first example is that of minimum spanning trees.


    # 5.1 Minimum spanning trees


    Suppose we are asked to network a collection of computers by linking pairs of
    them. This translates into a graph problem in which nodes are computers, undirected
    edges are potential links, and the goal is to pick each of these edges that the
    nodes are connected. This is not at all; each link also has a maintenance cost,
    reflected in that edge''s weight. What is the cheapest possible network?


    ![](img/3dd1f1364df8f87b80683fc32a15b999_137_0.png)


    One immediate observation is that the optimal set of edges cannot contain a cycle,
    because removing an edge from this cycle would reduce the cost without compromising
    connectivity:


    **Property 1** Removing a cycle edge cannot disconnect a graph.


    So the solution must be connected and acyclic: undirected graphs of this kind
    are called trees. The particular tree we want is the one with minimum total weight,
    known as the minimum spanning tree. Here is its formal definition.'
  merge: -1
  img_proc: true
- pgno: 138
  md: '# 128


    # 5.1 Minimum spanning trees


    Input: An undirected graph $G = (V, E)$, with edge weights $w_e$.

    Output: A tree $T = (V, E'')$, with $E'' \subseteq E$, minimizes

    $weight(T) = \sum_{e \in E''} w_e$.


    In the preceding example, the minimum spanning tree has a cost of 16:


    ![](img/3dd1f1364df8f87b80683fc32a15b999_138_0.png)


    However, this is not the optimal solution. Can you spot another?


    # 5.1.1 A greedy approach


    Kruskal''s minimum spanning tree algorithm starts with the empty graph and then
    selects edges from $E$ according to the following rule.


    Repeatedly add the next lightest edge that produces a cycle.


    In other words, it constructs the tree by edge by edge, apart from taking care
    to avoid cycles, simply picks whichever edge is cheapest at the moment. This is
    a greedy algorithm: every decision it makes is the one with the most obvious immediate
    advantage.


    Figure 5.1 shows an example. We start with an empty graph and attempt to add edges
    in increasing order of weight (which are broken arbitrarily):


    $B-C, C-D, B-D, C-F, D-F, E-F, A-D, A-B, C-E, A-C.$


    The first two succeed, but the third, $B-D$, would produce a cycle if added. We
    ignore it and move along. The final result is a tree with cost 14, the minimum
    possible.


    Figure 5.1 The minimum spanning tree found by Kruskal''s algorithm.


    ![](img/3dd1f1364df8f87b80683fc32a15b999_138_1.png)'
  merge: -1
  img_proc: true
- pgno: 139
  md: '# Trees


    A tree is an undirected graph that is connected and acyclic. Much of what makes
    trees so useful is the simplicity of their structure. For instance,


    Property 2 A tree on n nodes has n—1 edges.


    This can be seen by building the tree one edge at a time, starting from an empty
    graph. Initially all the n nodes are disconnected from the others, in a connected
    component by itself. As edges are added, these components merge. Since each edge
    unites two components, exactly n—1 edges are added by the time the tree is fully
    formed.


    In a little more detail: When a particular edge [u, v] comes up, then u and v
    lie in separate connected components, for otherwise there would be a path between
    them and this edge would create a cycle. Adding the edge merges these two components,
    reducing the total number of connected components by one. Over the course of this
    incremental process, the number of connected components decreases from n to one,
    meaning that n—1 edges must have been added along the way.


    The converse is also true.


    Property 3 Any connected, undirected graph G=(V, E) with |E|=|V|—1 is a tree.


    We need to show that G is acyclic. One way to do this is to run the following
    iterative procedure on it: if the graph contains a cycle, remove one edge from
    this cycle. The process terminates with some graph G''=(V'', E''), where E'' ⊆
    E, which is acyclic and, by Property 1 (from page 127), is also connected. Therefore
    G'' is a tree, whereupon |E''|=|V''|—1 by Property 2. So E''=E, no edges were
    removed, and G was acyclic to start.


    In other words, we can tell whether a connected graph is a tree by counting how
    many edges it has. Here''s another characterization.


    Property 4 An undirected graph is a tree if and only if there is a unique path
    between any pair of nodes.


    In a tree, any two nodes can only have one path between them; if there were two
    paths, the union of these paths would contain a cycle.


    On the other hand, if a graph has a path between any two nodes, then it is connected.
    If these paths are unique, then the graph is also acyclic (since a cycle has two
    paths between any pair of nodes).'
