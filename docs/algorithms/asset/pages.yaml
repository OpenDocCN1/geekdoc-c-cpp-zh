  md: "# Chapter 2\n\n# Algorithms 67\n\nbasis than in the standard basis. Therefore,\
    \ we rotate vectors within the basis (evaluation), then perform the task (multiplication),\
    \ and finally rotate back (interpolation). The initial vectors are coefficient\
    \ representations, while their rotated counterparts are value representations.\
    \ To efficiently switch between these, and forth, is the province of the FFT.\n\
    \n# 2.6.4 A closer look at the fast Fourier transform\n\nNow that our efficient\
    \ scheme for polynomial multiplication is fully realized, lets hone in more closely\
    \ on the core subroutine that makes it possible, the fast Fourier transform.\n\
    \n# The definitive FFT algorithm\n\nThe FFT takes as input vector $a = (\tilde{a}_0,\
    \ \\dots, \\tilde{a}_{n-1})$ and a complex number $\\omega$ whose powers $1, \\\
    \\omega, \\omega^2, \\dots, \\omega^{n-1}$ are the complex $n$th roots of unity.\
    \ It multiplies vector $a$ by the $n \\times n$ matrix $M_a(\\omega)$, which has\
    \ $(j, k)$ entry (starting row-column-count at zero) $\\omega^{jk}$. The potential\
    \ for using divide-and-conquer in matrix-matrix multiplication becomes when $M(\\\
    omega)$ is segmented into even and odds:\n\n![](img/3dd1f1364df8f87b80683fc32a15b999_77_0.png)\n\
    \nIn the second step, we have simplified entries in the lower half of the matrix\
    \ using $\\omega^{n/2} = -1$ and $\\omega^n = 1$. The top left $n/2 \\times n/2$\
    \ submatrix is $M_{n/2}(\\omega^2)$, as is the one on the bottom left. The top\
    \ and bottom right submatrices are same as $M_{n/2}(\\omega^2)$, but with their\
    \ $i/j$ rows multiplied by $\\omega^l$ and $-\\omega^l$, respectively. Therefore\
    \ the final product is:\n\n![](img/3dd1f1364df8f87b80683fc32a15b999_77_1.png)\n\
    \nIn short, the product of $M_n(\\omega)$ with vector $(\\tilde{a}_0, \\dots,\
    \ \\tilde{a}_{n-1})$, a size-$n$ problem, can be expressed in terms of two size-$n/2$\
    \ problems: the product of $M_{n/2}(\\omega^2)$ with $(a_0, a_2, \\dots, a_{n-2})$\
    \ and with $(a_1, a_3, \\dots, a_{n-1})$. This divide-and-conquer strategy"
