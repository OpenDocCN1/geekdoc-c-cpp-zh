  md: '# Figure 4.2 A physical model of a graph.


    ![](img/3dd1f1364df8f87b80683fc32a15b999_115_0.png)


    On the other hand, edge $(D, E)$ plays no role in any shortest path and therefore
    remains slack.


    # 4.2 Breadth-first search


    In Figure 4.2, the lifting of $s$ partitions the graph into layers: $s$ itself,
    the nodes at distance 1 from it, the nodes at distance 2 from it, and so on. A
    convenient to compute distances from $s$ to the other vertices is to proceed layer
    by layer. Once we have picked the nodes at distance $0, 1, 2, \dots$, the nodes
    at $d+1$ are easily determined: they are precisely the as-yet-unseen nodes that
    are adjacent to the layer at distance $d$. This suggests an iterative algorithm
    in which two nodes are active at any time: some layer $d$, which has been fully
    identified, and $d+1$, which is being discovered by scanning the neighbors of
    layer $d$.


    Breadth-first search (BFS) directly implements this simple reasoning (Figure 4.3).
    The initial $Q$ consists only of $s$, the node at distance 0. And for each subsequent
    distance $d=1, 2, 3, \dots$, there is a point in time at which $Q$ contains all
    the nodes at distance $d$ and nothing else. As nodes are processed (ejected from
    the front of the queue), their as-yet-unseen neighbors are injected into the end
    of the queue.


    Let''s try this algorithm on our earlier example (Figure 4.1) to confirm that
    it does the right thing. If $S$ is the starting point and the nodes are ordered
    alphabetically, they get visited in the sequence shown in Figure 4.4. The breadth-first
    search tree, on the right, contains the edges through which each node is initially
    discovered. Unlike the DFS tree we saw earlier, it has the property that all its
    paths from $S$ are the shortest possible. It is therefore a *shortest-path tree*.


    # Correctness and efficiency


    We have developed the basic intuition behind breadth-first search. In order to
    check that the algorithm works correctly, we need to make sure that it faithfully
    executes this intuition. What we expect, precisely, is that


    +   For each $d=0, 1, 2, \dots$, there is a moment at which $(1)$ all nodes at
    distance

    $\le d$ from $s$ have their distances correctly set; $(2)$ all other nodes have
    their distances set to $\infty$; and $(3)$ the queue contains exactly the nodes
    at distance $d$.'
