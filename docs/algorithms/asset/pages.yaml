- pgno: 63
  md: '# An n log n lower bound for sorting (continued )


    This way of looking at sorting algorithms is useful because it allows one to argue
    that mergesort is optimal, in the sense that $\Omega(n \log n)$ comparisons are
    necessary for n elements.


    Here is the argument: Consider any tree that stores an array of n elements. Each
    of its leaves is labeled by a permutation of [1, 2, ..., n]. In fact, every permutation
    must appear as the label of a leaf. The reason is simple: if a particular permutation
    is missing, what happens if we feed the algorithm an input ordered according to
    this permutation? Since there are n! permutations of n elements, it follows that
    the tree has at least n! leaves.


    We are almost done: This is a binary tree, and we argued that it has at least
    n! leaves. Recall that a binary tree of depth d has at most 2^d leaves (an easy
    proof by induction over d), so the depth of our tree—and the complexity of our
    algorithm—must be at least log(n!).


    And it is known that $\log(n!) \geq c \log n$ for some $c > 0$. There are many
    ways to see this. The easiest is to notice that $n! \geq (n/2)^{n/2}$ because
    $n! = 1 \cdot 2 \cdot \dots \cdot n$ contains at least n/2 factors larger than
    n/2; and thus take logs of both sides. It is also nice to recall Stirling''s formula


    ```

    $n! \approx \sqrt{2\pi n} (2n/3)^n \cdot e^{-n}$

    ```


    Either way we have established that any comparison tree that sorts n elements
    must make, in the worst case, $\Omega(n \log n)$ comparisons, and hence mergesort
    is optimal! Well, there is some fine print: this neat argument applies only to
    algorithms that use comparisons. It is conceivable that there are alternative
    sorting strategies, perhaps using sophisticated numerical manipulations, that
    work in linear time? The answer is yes, under certain exceptional circumstances:
    the canonical example is when the elements to be sorted are integers that lie
    in a small range (Exercise 2.20).


    # 2.4 Medians


    The median of a list of numbers is its 50th percentile: half the numbers are bigger
    than it, and half are smaller. For instance, the median of [45, 1, 10, 30] is
    25, since this is the middle element when the numbers are arranged in order. If
    the list has even length, there are two choices for what the middle element could
    be, in which case we pick the smaller of the two, say.


    The purpose of the median is to summarize a set of numbers by a single, typical
    value. The mean, or average, is also very common for this, but the median is in
    a sense more typical of the data: it is always one of the data values, unlike
    the mean, and it is less sensitive to outliers. For instance, the median of a
    list of hundred 1''s is (rightly) 1, as is the mean. If one of the numbers gets
    accidentally corrupted to 10,000, the mean shoots up above hundred, while the
    median remains unaffected.'
  merge: -1
  img_proc: true
- pgno: 64
  md: '# 2.4 Medians


    Computing the median of $n$ numbers is easy: just sort them. The drawback is that
    this takes $O(n\log n)$ time, whereas we would ideally like something linear.
    We have reason to be hopeful, because sorting is doing far more work than we really
    need—we just want the middle element and don''t care about the relative ordering
    of the rest of them.


    When looking for a recursive solution, it is paradoxically easier to work with
    a *more general* version of the problem—for the simple reason that this gives
    a more powerful step to recurse upon. In our case, the generalization will consider
    selection.


    # Selection


    *Input:* A list of numbers $S$; an integer $k$


    *Output:* The $k$th smallest element of $S$


    For instance, if $k = 1$, the minimum of $S$ is sought, whereas if $k = |S|/2$,
    it is the median.


    # A randomized divide-and-conquer algorithm for selection


    Here''s a divide-and-conquer approach to selection. For any number $v$, imagine
    splitting $S$ into three categories: elements smaller than $v$, those equal to
    $v$ (there may be duplicates), and those greater than $v$. Call these $S_L$, $S_v$,
    and $S_R$ respectively. For instance, if


    | S : | 2 | 36 | 5 | 21 | 8 | 13 | 11 | 20 | 5 | 4 | 1 |


    is split on $v = 5$, the three subarrays generated


    | $S_L$ : | 2 | 4 | 1 | | $S_v$ : | 5 | 5 | | $S_R$ : | 36 | 21 | 8 | 13 | 11
    | 20 |


    The search can instantly recur down to one of these sublists. If we want, the
    *eighth*-smallest element of $S$, $k$ it must be the *third-smallest* element
    of $S_R$ since $|S_L| + |S_v| = 5$. Thus, selection$(S, 8) = selection(S_R, 3)$.
    More generally, by checking $k$ against the sizes of the subarrays, we can quickly
    determine which of them holds the desired


    ```

    selection(S_L, k) = \begin{cases} v & k \le |S_L| \ v & |S_L| < k \le |S_L| +
    |S_v| \ selection(S_R, k - |S_L| - |S_v|) & k > |S_L| + |S_v| \end{cases}

    ```


    The three subsets $S_L$, $S_v$, and $S_R$ can be constructed from $S$ in linear
    time; in fact, this computation can even be done *in place*, that is, without
    allocating new memory (Exercise 2.15). We recurse on the appropriate sublist.
    The effect of the split is to shrink the number of elements from $|S|$ to most
    max$|S_L|, |S_R|$.


    Our divide-and-conquer algorithm for selection is now fully specified, except
    for the crucial detail of how to choose $v$. It should be picked quickly, and
    it should shrink the array substantially, the ideal being $|S_L|, |S_R| \approx
    \frac{1}{2}|S|$. If we could guarantee this situation, we would get a running
    time of


    $T(n) = T(n/2) + O(n)$.'
  merge: -1
