    ```

    max $c^T x$ such that $Ax \le 0$ and $x \ge 0$.

    ```


    where there are $n$ variables and $A$ contains $m$ inequality constraints; Since
    it is an iterative algorithm that proceeds from vertex to vertex, let''s start
