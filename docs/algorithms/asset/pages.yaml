    By definition, it is the unique point at which $n$ inequality constraints are
    satisfied with equality. Each of its neighbors shares $n-1$ of these inequalities,
    so $\mathbf{u}$ can have at most $n \cdot m$ neighbors: choose which inequality
    to drop and which new to add.


    A naive way to perform an iteration would be to check each potential neighbor
    to see whether it is really a vertex of the polyhedron and to determine its cost.'
