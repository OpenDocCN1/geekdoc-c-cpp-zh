    if they like each other (for instance, Al likes all the girls). Is it possible
    to choose couples so that everyone has exactly one partner, and is it someone?
    In graph-theoretic jargon, is there a perfect matching?


    This matching can be reduced to the maximum-flow problem, and thereby to linear
    programming. Create a new source node, s, with outgoing edges to all the boys;
    a new sink node, t, with incoming edges from all the girls; and direct all the
    edges in the original bipartite graph from boy to girl (Figure 7.8). Finally,
    give every edge a capacity of 1. Then there is a perfect matching if and only
    if this network has a flow whose size equals the number of couples. Can you find
