  md: "# 4.4 Dijkstra's algorithm\n\nDelete-min. Return the element with the smallest\
    \ key, and remove it from the set.\n\nMake-queue. Build a priority queue out of\
    \ the given elements with the given key values. (In many implementations, this\
    \ is significantly faster than inserting the elements one by one.)\n\nThe first\
    \ two let us alarms, and the third tells us which alarm is next to go off. Putting\
    \ this all together, we get Dijkstra's algorithm (Figure 4.8).\n\n# Figure 4.8\
    \ Dijkstra's shortest-path algorithm.\n\n```\nprocedure Dijkstra(G,I,s)\nInput:\
    \ Graph G=(V,E), directed or undirected;\n  positive edge lengths {l_e:e in E};\
    \ vertex s in V\nOutput: For all vertices reachable from s, dist(u) is set\nnto\
    \ the distance from s to u.\n\nfor all u in V:\n  dist(u) = ∞\n  prev(u) = nil\n\
    dist(s) = 0\n```\n\n```\nH = makequeue(V) using dist-values as keys\nwhile H is\
