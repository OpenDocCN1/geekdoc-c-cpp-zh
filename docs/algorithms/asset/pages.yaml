  md: '# Chapter 10


    # Algorithms 301


    of the 500 qubits is a linear superposition of all $2^{500}$ possible classical
    states:


    ```

    \sum_{x\in\0,1\}^n} \alpha_x |x\rangle$

    ```


    It is as if Nature has $2^{500}$ scraps of paper on the side, each with a complex
    number written on it, just to keep track of the state of this system of 500 hydrogen
    atoms! Moreover, at each moment, the state of the system evolves in time, it is
    as though Nature crosses out the complex number on each scrap of paper and replaces
    it with its new value.


    Let us consider the effort involved in doing all. The number $2^{500}$ is much
    larger than estimates of the number of elementary particles in the universe. Where,
    does Nature store this information? Could microscopic quantum systems of a few
    hundred atoms contain more information than we can possibly store in the entire
    classical universe? Surely this is an most extravagant theory about the effort
    put by Nature just to keep a tiny system evolving in time.


    In this phenomenon lies the basic motivation for quantum computation. After all,
    if Nature is so extravagant at the quantum level, why should we base our computers
    on classical physics? Why not tap into this massive of effort being expended at
    the quantum level?


    But there is a fundamental problem: this exponentially large superposition is
    the private world of the electrons. Measuring the system reveals $n$ bits of information.
    As before, the probability that the outcome is a particular 500-bit string $x$
    is $|\alpha_x|^2$. And the new state after measurement is just $|x\rangle$.


    # 10.2 The plan


    A quantum algorithm is unlike any you have seen so far. Its structure reflects
    the tension between the exponential "private workspace" of an $n$-qubit system
    and the $n$ bits that can be obtained through measurement.


    The input to a quantum algorithm consists of $n$ classical bits, and the output
    consists of $n$ classical bits. While the quantum system is not being watched
    that the quantum effects take over and we have the benefit of Nature working exponentially
    hard on our behalf


    If the input is an $n$-bit string $x$, then a series of quantum operations are
    performed, by the end of which the state of the $n$ bits is transformed into some
    $\sum_y \alpha_y |y\rangle$. Finally, a measurement is made, and the output is
    the $n$-bit string $y$ with probability $|\alpha_y|^2$. Observe that this output
    is random. But this is not a problem with randomized algorithms such as the one
    for primality testing. As long as $y$ corresponds to the right answer with high
    enough probability, we can repeat the whole process a few times to make the chance
    of failure minuscule.'
