    # Visualizing duality


    One can solve the shortest-path problem by the following "analog" device: Given
    a weighted undirected graph, build a physical model of it in which each edge is
    a string of length equal to the edge''s weight, and each node is a knot at which
    the appropriate endpoints of strings are tied together. To find the shortest path
    from s to t, just pull away from t until the gadget is taut. It is intuitively
    clear that this finds the shortest path from s to t.


    ![](img/3dd1f1364df8f87b80683fc32a15b999_219_0.png)


    There is nothing remarkable or surprising about this until we notice the following:
    the shortest-path problem is a minimization problem, right? Why are we pulling
    s away from t, an act whose purpose is, obviously, maximization? Answer: By pulling
    s away from t we solve the dual of the shortest-path problem! This dual has a
    very simple form (Exercise 7.28), with one variable xi for each node u:


    ```

    max xs - xi

    |xu - xv| <= wuv for all edges [u, v].

    ```


    In words, the dual problem is to stretch s and t as far apart as possible, subject
    to the constraint that the endpoints of any edge [u, v] are separated by a distance
    of most wuv.


