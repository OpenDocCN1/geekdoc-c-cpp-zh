    In the present example, most of the variables take on fairly large (double-digit)
    values, thus rounding is unlikely to affect things too much. There are other LPs,
    in which rounding decisions are to be made very carefully in order to end up an
    integer solution of reasonable quality.


    In general, there is a tension in linear programming between the ease of obtaining
    fractional solutions and the desirability of integer ones. As we shall see in
    Chapter 8, finding the optimum integer solution of an LP is an important but very
    hard problem, called *integer linear programming*.


