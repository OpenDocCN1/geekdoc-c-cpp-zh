  md: '# Chapter 8

    NP-complete problems


    # 8.1 Search problems


    Over the past seven chapters we have developed algorithms for finding shortest
    paths and minimum spanning trees in graphs, matchings in bipartite graphs, maximum
    increasing subsequences, maximum flows in networks, and so on. All these algorithms
    are efficient, because in each case their time requirement grows as a polynomial
    function (such as $n$, $n^2$, or $n!$) of the size of the input.


    To better appreciate efficient algorithms, consider the alternative: In all problems
    we are searching for a solution (path, tree, matching, etc.) from among an exponential
    population of possibilities. Indeed, $n$ boys can be matched with $n$ girls in
    $n!$ different ways, a graph with $n$ vertices has $n-2$ spanning trees, and a
    typical graph has an exponential number of paths from $s$ to $t$. All these could
    in principle be solved in exponential time by checking all candidate solutions,
    one by one. But an algorithm whose runtime is $2^n$, or worse, is all useless
    in practice (see the next book). The quest for efficient algorithms is about finding
    clever ways to bypass this exhaustive search, using clues from the input in order
    to dramatically narrow the search space.


    So in this book we have seen the most brilliant successes of this quest, algorithmic
    techniques that defeat the specter of efficiency: greedy algorithms, dynamic programming,
    linear programming (while divide-and-conquer typically yields faster algorithms
    for problems we can reliably solve in polynomial time). Now the time has to meet
    the quest''s most embarrassing and persistent failures. We shall see other "search
    problems," in which we are seeking a solution with particular properties among
    an exponential chaos of alternatives. But for these new problems no shortcut seems
    possible. The fastest algorithms we know for them are all efficient—not substantially
    better than an exhaustive search. We now introduce important examples.


    # Satisfiability


    SATISFIABILITY, or SAT (recall Exercise 3.28 and Section 5.3), is a problem of
    great practical importance, with applications ranging from chip testing and computer
    design'
  merge: -1
  img_proc: true
