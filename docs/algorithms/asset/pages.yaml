  md: '# 60 2.6 The fast Fourier transform


    # 2.5 Coefficients of two polynomials, $A(x)$ and $B(x)$, of


    Input: Their product $C = A \cdot B$

    degree $d$


    # Selection


    Pick some points $x_0, x_1, \dots, x_{n-1}$, where $n \geq 2d+1$


    # Evaluation


    Compute $A(x_0), A(x_1), \dots, A(x_{n-1})$ and $B(x_0), B(x_1), \dots, B(x_n)$


    # Multiplication


    Compute $C(x_k) = A(x_k)B(x_k)$ for all $k=0, \dots, n-1$


    # Interpolation


    Recover $C(x) = C_0 + C_1x + \dots + C_d x^{2d}$


    The equivalence of the two polynomial representations makes it clear that this
    high-level approach is correct, but how efficient is it? Certainly the selection
    step and the $n$ multiplications are no trouble at all, just linear time.$^3$
    But (leaving interpolation, about which we know less) how efficient? Evaluating
    a polynomial of degree $d \leq n$ at a single point takes $O(n)$ steps (Exercise
    2.29), and so the baseline for $n$ points is $\Theta(n^2)$. We''ll now see that
    the fast Fourier transform (FFT) is in $O(n \log n)$ time, for a particularly
    clever choice of $x_0, \dots, x_{n-1}$ in which the computations required by the
    individual points overlap with one another and can be shared.


    # 2.6.2 Evaluation by divide-and-conquer


    Here''s an idea how to pick the $n$ points at to evaluate a polynomial $A(x)$
    of degree $\leq n-1$. If we choose these to be positive-negative pairs, that,


    > $\pm x_0, \pm x_1, \dots, \pm x_{n/2-1}$.


    then the computations required for $A(x_i)$ and $A(-x_i)$ overlap a lot, because
    the even powers of $x_i$ coincide with those of $-x_i$.


    To investigate this, we split $A(x)$ into its odd and even powers, for instance


    $3 + 4x + 6x^2 + 2x^3 + x^4 + 10x^5 = (3 + 6x^2 + x^4) + x(4 + 2x^2 + 10x^4)$.


    The terms in parentheses are polynomials in $x^2$. More generally,


    $A(x) = A_{even}(x^2) + x_{odd}(x^2)$,


    $^3$In a typical setting for polynomial multiplication, the coefficients of the
    polynomials are real numbers and, moreover, are small enough that basic arithmetic
    operations (adding and multiplying) take unit time. We will assume this to be
    the case without any loss of generality; in particular, the time bounds we obtain
    are easily adjustable to situations with larger numbers.'
