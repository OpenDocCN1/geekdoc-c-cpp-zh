  md: "# Chapter 2\n\n# Algorithms 65\n\nThe existence of $M^{-1}$ allows to invert\
    \ the preceding matrix equation so as to express coefficients in terms of values.\
    \ In brief,\n\nEvaluation is multiplication by $M$, while interpolation is multiplication\
    \ by $M^{-1}$.\n\nThis reformulation of our polynomial operations reveals their\
    \ essential nature more clearly. Among other things, it finally justifies an assumption\
    \ we have been making throughout, that $A(x)$ is uniquely characterized by its\
    \ values at any $n$ points—in fact, we now have an explicit formula that will\
    \ give us the coefficients of $A(x)$ in this situation. Vandermonde matrices also\
    \ have the distinction of being unique to invert over general matrices, in $O(n^2)$\
    \ instead of $O(n^3)$. However, using this for interpolation would still not be\
    \ enough for us, so once again we turn to our special choice of points—the complex\
    \ roots of unity.\n\n# Interpolation resolved\n\nIn linear algebra terms, the\
    \ FFT multiplies by an arbitrary $n$-dimensional vector—which we have been calling\
    \ the $n \times n$ matrix\n\n```\n$$\\begin{array}{ccccccc} 1 & 1 & 1 & & & &\
    \ 1 \\ & \\omega & \\omega^2 & & & \\omega^{n-1} & & \\ & & \\omega^2 & \\omega^4\
    \ & & & \\omega^{2(n-1)} & & \\omega^2 \\ M_n(\\omega) = & 1 & & \\omega^j & &\
    \ \\omega^{(n-1)} & & \\omega^1 \\ & & & \\vdots & & \\vdots & & \\ & & & \\omega^{(n-1)}\
    \ & \\omega^{2(n-1)} & & & \\omega^{(n-1)(n-1)} & & \\omega^{n-1} \\end{array}$\n\
    ```\n\nwhere $\\omega$ is a complex $n$th root of unity, and $n$ is a power of\
    \ 2. Notice how this matrix describes: its $(j, k)$ entry (starting row- and column-count\
    \ at zero) is $\\omega^{jk}$.\n\nMultiplication by $M(\\omega)$ maps the $k$th\
    \ coordinate axis (the vector with zeros except for 1 at $k$ position) of $M$.\
    \ Here's the crucial observation, which we'll prove shortly: the columns of $M$\
    \ are orthogonal (at right angles) to each other. They can then be thought of\
    \ as axes of an alternative coordinate system, which is often called the Fourier\
    \ basis. The effect of the Fourier basis, which is defined by the columns of $M$\
    \ is a change of basis, a *rigid rotation*. The inverse of $M$ is the opposite\
    \ rotation, and when we write out the orthogonality precisely, we will be able\
    \ to read off this transformation with ease:\n\n# Inversion formula $M_n(\\omega)^{-1}\
    \ = \\frac{1}{n}M_n(\\omega^{-1})$.\n\n$\\omega^{-1}$ is an $n$th root of unity,\
    \ and so interpolation—or equally, multi-multiplication by $M_n(\\omega)^{-1}$—is\
    \ itself just an FFT, but with $\\omega$ replaced by $\\omega^{-1}$.\n\nNow let's\
    \ get into the details. Take $\\omega$ to be $e^{2\\pi i/n}$ for convenience,\
    \ and then the columns of $M$ as vectors in $\\mathbb{C}$. Recall that the angle\
    \ between the two vectors $u=(u_0, \\dots, u_{n-1})$ and $v=(v_0, \\dots, v_{n-1})$\
    \ in $\\mathbb{C}$ is just a scaling factor times their"
