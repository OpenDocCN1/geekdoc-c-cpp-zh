- pgno: 312
  md: '# 10.2 The plan


    **Figure 10.3** A quantum algorithm n "classical" bits as its input, manipulates
    them so as to create a superposition of their 2^n possible states, manipulates
    this exponentially large superposition to obtain the final quantum result, and
    measures the result to get (with the appropriate probability distribution) the
    n output bits. For the middle phase, there are elementary operations which count
    as one step and yet manipulate all the exponentially many amplitudes of the superposition.


    ![](img/3dd1f1364df8f87b80683fc32a15b999_312_0.png)


    Let us look more closely at the quantum part of the algorithm. Some of the key
    quantum operations (which we will soon discuss) can be thought of looking for
    certain kinds of *patterns* in a superposition of states. Because of this, it
    is helpful to think of the algorithm as having two stages. In the first stage,
    the n classical bits of the input are "unpacked" into an exponentially large superposition,
    which is expressly set up so as to have an underlying pattern or regularity that,
    if detected, would solve the task at hand. The second stage then detects a suitable
    set of quantum operations, followed by a measurement, which reveals the hidden
    pattern.


    All this sounds quite mysterious at the moment, but more details are on the way.
    In Section 10.3 we will give a high-level description of the most important operation
    that can be efficiently performed by a quantum computer: a quantum version of
    the fast Fourier transform (FFT). We will then describe certain patterns that
    this quantum FFT is ideally to detect, and will show how to recast the problem
    of factoring an integer N in terms of detecting precisely such a pattern. Finally
    we will see how to set up the initial stage of the quantum algorithm, which converts
    the input N into an exponentially large superposition with the right kind of pattern.'
