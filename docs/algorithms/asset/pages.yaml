  md: "# Binary search\n\nThe ultimate divide-and-conquer algorithm is, of course,\
    \ binary search: to find a key $k$ in a large file containing keys $z[0, 1, \\\
    dots, n-1]$ in sorted order, we first compare $k$ with $z[n/2]$ and based on the\
    \ result recurse either on the first half of the file, $z[0,\\dots,n/2-1]$, or\
    \ on the second half, $z[n/2,\\dots,n-1]$. The recurrence is $T(n) = T\\{n/2\\\
    } + O(1)$, which is the case $a=1, b=2, d=0$. Plugging into our master theorem\
    \ we get the familiar solution: a running time of $O(\\log n)$.\n\nFigure 2.3\
    \ Each problem of size $n$ is divided into subproblems of size $n/b$.\n\n![](img/3dd1f1364df8f87b80683fc32a15b999_60_0.png)\n\
    \n# 2.3 Mergesort\n\nThe problem of sorting a list of numbers lends itself immediately\
    \ to a divide-and-conquer strategy: split the list into two halves, recursively\
    \ sort each half, and then merge the two sorted sublists.\n\n```\nfunction mergesort(a[1...n])\n\
    Input: An array of numbers a[1...n]\nOutput: A sorted version of this array\n\n\
    if n > 1:\n    return merge(mergesort(a[1...n/2]),\n                  mergesort(a[[n/2]\
    \ + 1...n]))\nelse:\n    return a\n```"
