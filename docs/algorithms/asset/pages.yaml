  md: '# # Chapter 9

    Coping with NP-completeness


    You are the junior member of a seasoned project team. Your current task is to
    write code for a simple-looking problem involving graphs and numbers. What are
    you supposed to do?


    If you are very lucky, your problem will be among the half-dozen problems concerning
    graphs (shortest path, minimum spanning tree, maximum flow, (etc.), that we have
    solved in this book. Even if this is the case, recognizing a problem in its natural
    habitat—grungy and obscured by reality and context—requires practice and skill.
    It is more likely that you will need to reduce your problem—or solve using dynamic
    programming or linear programming.


    But chances that nothing like this will happen. The world of search problems is
    a bleak landscape. There are a few spots of light—brilliant algorithmic ideas—each
    illuminating a small area around it (the problems that reduce to; two of these
    areas, linear and dynamic programming, are in decentably large). The remaining
    expanse is pitch dark: NP-complete. What are you to do?


    You can start by proving that your problem is actually NP-complete. Often a proof
    by generalization (recall the discussion on page 256 and Exercise 8.10) is all
    you need; and sometimes a reduction from 3SAT or ZOE is not too difficult to find.
    This sounds like a theoretical exercise, but, if carried out successfully, it
    brings some tangible rewards: your status in the team has been elevated, and you
    are no longer the kid who can''t do, and you have become the noble knight with
    the impossible quest.


    But, unfortunately, a problem does not go away when proven NP-complete. The real
    question is, What do you do next?


    This is the subject of the present chapter and also the inspiration for some of
    the most important modern research on algorithms and complexity. NP-completeness
    is not a death certificate—it is only the beginning of a fascinating adventure.


    Your problem''s NP-completeness proof probably constructs graphs that are complicated
    and weird, very much like those come up in your application. For example, even
    though SAT is NP-complete, satisfying assignments for HORN SAT (the'
  merge: -1
  img_proc: true
- pgno: 282
  md: 'instances of SAT that come up in logic programming) can be found efficiently
    (recall Section 5.3). Or, suppose the graphs that arise in your application are
    trees. In this case, many NP-complete problems, can be solved in linear time by
    dynamic programming (recall Section 6.7).


    Unfortunately, this approach does not always work. We know that 3SAT is NP-complete,
    and the INDEPENDENT SET problem, along with many other NP-complete problems, remains
    even for planar graphs (graphs that can be drawn in the plane without crossing
    edges). Moreover, often you cannot neatly characterize the instances that come
    up in your application. Instead, you will have to rely on some form of intelligent
    exponential search—procedures such as backtracking and branch and bound which
    are exponential time in the worst-case, but with the right design, could be very
    efficient on typical instances that come up in your application. We discuss these
    methods in Section 9.1.


    Or you can develop an algorithm for your NP-complete optimization problem that
    falls short but never too much. For example, in Section 5.4 we saw that the greedy
    algorithm achieves a set cover that is no more than log times the optimal cover.
    An algorithm that achieves such a guarantee is called an approximation algorithm.
    As we see in Section 9.2, such algorithms are known for many NP-complete optimization
    problems, and they are some of the most clever and sophisticated algorithms. And
    the theory of NP-completeness can be used as a guide in this endeavor, showing
    that, for some problems, there are even limits to how well they can be approximated—unless
    course P = NP.


    Finally, there are heuristics, algorithms with no guarantees on either the running
    time or the degree of approximation. Heuristic rely on ingenuity, intuition, a
    good understanding of the application, meticulous experimentation, and often insights
    from physics or biology, to attack a problem. We see some common kinds in Section
    9.3.


    # 9.1 Intelligent exhaustive search


    # 9.1.1 Backtracking


    Backtracking is based on the observation that it is possible to reject a solution
    by looking at just a small portion of it. For example, if an instance of SAT contains
    the clause (x1 ∨ x2), then all assignments with x1 = x2 = 0 (i.e., false) can
    be instantly eliminated. To put it differently, by quickly checking and discrediting
    the partial assignment, we are able to prune a quarter of the entire search space.
    A promising direction, but it can be systematically exploited?


    Here''s how it is done. Consider the Boolean function φ(w, x, y, z) specified
    by the set of clauses


    ```

    (w ∨ x ∨ y ∨ z), (w ∨ X), (x ∨ y), (y ∨ z), (z ∨ W), (W ∨ Z).

    ```'
