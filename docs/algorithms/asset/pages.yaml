    1, 2, \dots. .$ All these sets of numbers are plus-minus paired, and so we divide-and-conquer,
    as shown in the last panel, works perfectly. The resulting algorithm is the fast
    Fourier transform (Figure 2.7).


    # 2.6.3 Interpolation


    Let''s take stock of where we are. We have developed a high-level scheme for multiplying
    polynomials (Figure 2.5), based on the observation that polynomials can be represented
    in two ways, in terms of their *coefficients* or in terms of their *values* at
    selected sets of points.


    | Coefficient representation | Value representation |

    |---|---|

    | $a_0, a_1, \dots, a_{n-1}$ | $A(x_0), A(x_1), \dots, A(x_{n-1})$ |

    | Interpolation | |


    The value representation makes it trivial to multiply polynomials, but we cannot
    ignore the coefficient representation since it is in the form in which the input
    and output of our overall algorithm specified.


    So we designed the FFT, a way to move from coefficients to values in time just
    $O(n \log n)$, when the points $[x_i]$ are complex $n$th roots of unity $(1, \omega,
    \omega^2, \dots, \omega^{n-1})$.


    $(values) = FFT((coefficients), \omega).'
