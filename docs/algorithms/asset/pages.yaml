    the greatest common divisor of all the indices returned, we will with very high
    probability get the number $M/k$—and from the period $k$ of the input!


    Let''s make this more precise.


    **Lemma** *Suppose independent samples are drawn uniformly from*


    ```

    $\frac{M}{k}, \dots \frac{(k-1)M}{k}$

    ```


    Then with probability at least $1-k/2^2$, the greatest common divisor of these
    samples is $M/k$.


    *Proof.* The only way this can fail is if all samples are multiples of $j/k$,
    where $j$ is some integer greater than 1. So, fix any integer $j \ge 2$; the chance
    that a particular sample is a multiple of $j/k$ is at most $1/j \le 1/2$; and
    thus the chance that *all* the samples are multiples of $j/k$ is at most $1/2^j$.


    So far we have been thinking about a particular number $j$; the probability that
    this bad event will happen for *some* $j \le k$ is at most equal to the *sum*
    of these probabilities over the different values of $j$, which is no more than
    $k/2^j$.


    We can make the failure probability as small as we like by taking $s$ to be an
    appropriate multiple of $M$.


