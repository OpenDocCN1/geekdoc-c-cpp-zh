  md: '# Recursion? No, thanks.


    Returning to our discussion of longest increasing subsequences: the formula for
    $L(j)$ also suggests an alternative, recursive algorithm. Wouldn''t that be even
    simpler?


    Actually, recursion is a very bad idea: the resulting procedure would require
    exponential time! To see why, suppose the dag contains edges $(i, j)$ for all
    $i < j$—that is, the given sequence of numbers $a_1, a_2, \dots, a_n$ is sorted.
    In that case, the formula for subproblem $L(j)$ becomes


    ```

    $L(j) = 1 + \max\{L(1), L(2), \dots, L(j-1)\}$

    ```


    The following figure unveils the recursion for $L(5)$. Notice that the same subproblems
    are solved over and over again!


    ![](img/3dd1f1364df8f87b80683fc32a15b999_170_0.png)


    For $L(n)$ this tree has exponentially many nodes (you can bound it?), and so
    a recursive solution is disastrous.


    Then did recursion work so well with divide-and-conquer? The key point is that
    in divide-and-conquer, a problem is expressed in terms of subproblems that are
    substantially smaller, half the size. For instance, mergesort sorts an array of
    size $n$ by recursively sorting two subarrays of size $n/2$. Because of this sharp
    drop in problem size, the recursion tree has only logarithmic depth and a polynomial
    number of nodes.


    In contrast, in a typical dynamic programming problem, a problem is reduced to
    subproblems that are only slightly smaller—for instance, $L(j)$ relies on $L(j-1)$.
    Thus the full recursion tree generally has polynomial depth and an exponential
    number of nodes. However, it turns out that most of these nodes are repeats, that
    there are not too many distinct subproblems among them. Efficiency is therefore
    obtained by explicitly enumerating the distinct subproblems and solving them in
    the right order.'
