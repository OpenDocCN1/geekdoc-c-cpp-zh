  md: "# On time and memory\n\nThe amount of time it takes to run a dynamic programming\
    \ algorithm is easy to discern from the dag of subproblems; in many cases it is\
    \ just the total number of edges in the dag! All we are really doing is visiting\
    \ the nodes in linearized order, examining each node's inges, and, most, doing\
    \ a constant amount of work per edge. By the end, each edge of the dag has been\
    \ examined.\n\nBut how much memory is required? There is no simple method of the\
    \ dag characterizing this. It is certainly possible to do the job with an amount\
    \ of memory proportional to the number of vertices (subproblems), but we can get\
    \ away with much less. The reason is that the value of a particular problem needs\
    \ only to be remembered until the larger subproblems depending on it have been\
    \ solved. Therefore, it takes memory until it can be released for reuse.\n\nFor\
    \ example, the Floyd-Warshall algorithm value of dist(i, j, k) is not needed once\
    \ the dist(., ., k+1) values have been computed. Therefore, we only need two |V|\
    \ arrays to store the dist values, one for odd values of k and one for even: when\
    \ computing dist(i, j, k), we overwrite dist(i, j, k-2).\n\nAnd let us not forget,\
    \ as always in dynamic programming, we also need one more prev(i, j), storing\
    \ the last vertex in the current shortest path from i to j, a value that must\
    \ be updated with dist(i, j, k). We omit this crucial bookkeeping step from our\
    \ dynamic programming algorithms.\n\nCan you see how the edit distance in Figure\
    \ 6.5 only needs memory proportional to the length of the shorter string?\n\n\
    The subproblems are ordered by [S]. Here's the code:\n\n```\nC([1, 1]) = 0\nfor\
    \ s = 2 to n:\n  for subsets S ⊆ {1, 2, ..., n} of size s and containing 1:\n\
    \    C(S, 1) = ∞\n    for j ∈ S, j ≠ 1:\n      C(S, i) = min(C(S - {j}), i) +\
    \ d_{j,i}; i ∈ S, i ≠ j)\nreturn min, C({1, ..., n}, j) + d_{j1}\n```\n\nThere\
    \ are at most 2ⁿ - n subproblems, and each takes linear time to solve. The total\
    \ running time is O(n²ⁿ).\n\n# 6.7 Independent sets in trees\n\nA subset of nodes\
    \ S ⊆ V is an independent set of graph G=(V, E) if there are no edges between\
    \ them. For instance, in Figure 6.10 the nodes {1, 4, 5} form an independent set,\
    \ but do not, because of the edge between 4 and 5. The largest independent set\
    \ is {2, 3, 6}."
