    ![](img/3dd1f1364df8f87b80683fc32a15b999_62_0.png)


    # An n log n lower bound for sorting


    Sorting algorithms can be depicted as trees. The one in the following figure sorts
    an array of three elements, $a_1, a_2, a_3$. It starts by comparing $a_1$ to $a_2$
    and, if the first is larger, compares it with $a_3$; otherwise it compares $a_2$
    and $a_3$. And so on. Eventually we end up at a leaf, and this leaf is labeled
    with the true order of the three elements as a permutation of 1, 2, 3. For example,
    if $a_2 < a_1 < a_3$, we get the leaf labeled "2 1 3.".


    ![](img/3dd1f1364df8f87b80683fc32a15b999_62_1.png)


    The *depth* of the tree—the number of comparisons on the longest path from root
    to leaf, in this case 3—is exactly the worst-case time complexity of the algorithm.'
