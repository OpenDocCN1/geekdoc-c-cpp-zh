  md: '256


    8.3 The reductions


    # ZOE→ILP


    3SAT is a special case of SAT—or, SAT is a generalization of 3SAT. By special
    case we mean that the instances of 3SAT are a subset of the instances of 3SAT
    (in particular, the ones with no closed clauses), and the definition of solution
    is the same in both problems (any assignment satisfying all clauses). Consequently,
    there is a reduction from 3SAT to SAT, in which the input undergoes no transformation,
    and the solution to the target instance is also kept unchanged. In other words,
    functions $f$ and $h$ from the reduction diagram are both identity.


    This sounds trivial enough, but it is a very useful and common way of establishing
    that a problem is NP-complete. Simply notice that it is a generalization of a
    known NP-complete problem. For example, the SET COVER problem is NP-complete because
    it is a generalization of VERTEX COVER (and also incidentally, of 3D MATCHING).
    See Exercise 8.10 for more examples.


    Often it takes a little work to establish that one problem is a special case of
    another. The reduction from ZOE to ILP is a case in point. In ILP we are looking
    for an integer vector $x$ that satisfies $Ax \le b$, for given matrix $A$ and
    vector $b$. To write an instance of ZOE in this precise form, we need to rewrite
    each instance of the ZOE instance as two inequalities (recall the inequalities
    $x_i \le 1$ and to add for each variable $x_i$ the inequalities $x_i \le 1$ and
    $-x_i \le 0$).


    # ZOE→RUDRATA CYCLE


    In the RUDRATA CYCLE problem we seek a cycle in a graph that visits every vertex
    exactly once. We shall prove it NP-complete in two stages: first we reduce ZOE
    to a generalization of RUDRATA CYCLE, called RUDRATA CYCLE WITH PAIRED EDGES,
    and then


