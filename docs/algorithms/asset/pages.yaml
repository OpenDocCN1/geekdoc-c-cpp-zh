    \ notice that the FFT circuit is a natural for parallel computation and direct\
    \ implementation in hardware.\n\n# The slow spread of a fast algorithm\n\nTukey\
    \ was not keen to write a paper on the subject, Cooley took the initiative. This\
    \ is one of the most famous and most cited scientific papers published in 1965,\
    \ co-authored by Cooley and Tukey. The reason Tukey was reluctant to publish the\
    \ FFT was not secretness or pursuit of profit via patents. He felt that this was\
    \ a simple observation that was probably already known. This was typical of the\
    \ period: back then (and for some time) algorithms were considered second-class\
    \ mathematical objects, devoid of depth and length, and unworthy of serious attention.\n\
    \nBut Tukey was right about one thing: it was later discovered that British engineers\
    \ used the FFT for calculations during the late 1930s.—and to end this chapter\
    \ with the same mathematician who started it—a paper by Gauss in the early 1800s\
    \ (on what else?) interpolation essentially contained the same idea in it! Gauss's\
