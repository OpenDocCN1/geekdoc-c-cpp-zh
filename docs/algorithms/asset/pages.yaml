    +   For any two distinct items $x$ and $y$, exactly $|\mathcal{H}|/n$ of all the
    hash functions in $\mathcal{H}$ map $x$ and $y$ to the same bucket, where $n$
    is the number of buckets.


    A family of hashes with this property is called *universal*. In other words, for
    any two items, the probability these collide is $1/n$ if the hash function is
    randomly drawn from a universal family. This is also the collision probability
    if we map $x$ and $y$ to buckets uniformly at random—in some sense the gold standard
    of hashing. We then showed that this property implies hash table operations have
    good performance in expectation.


    This idea, motivated as it was by the hypothetical IP address application, can
    be applied more generally. By choosing the size $n$ to be some prime number that
    is a bit larger than the number of items expected in the table (there is usually
    a prime number close to any number we start with; actually, to ensure hash table
    operations have good performance, it is better to have the size of the hash table
    about twice as large as the number of items). Next assume the size of the domain
    of all data items $N=n^k$, a power of $n$ (if we need to overestimate the true
    number of data items, so be it). Then each data item can be considered as a $k$-tuple
    of integers modulo $n$, and $\mathcal{H}=\{h_a : a \in \{0, \dots, n-1\}^k\}$
    is a universal family of hash functions.


