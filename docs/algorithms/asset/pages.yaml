    relation—it implies also that y shares a border with x—and we denote it using
    notation, e = {x, y}. These edges are undirected and part of an undirected graph.
    Sometimes graphs depict relations that do not have this reciprocity, in which
    case it is necessary to use edges with directions on them. There can be directed
    edges e from x to y (written e = (x, y)), or from y to x (written (y, x)), or
    both. A particularly enormous example of a directed graph is the graph of all
    links in the World Wide Web. It has a vertex for each site on the Internet, and
    a directed edge (u, v) whenever site u has a link to site v; in total, billions
    of nodes and edges! Understanding even the basic connectivity properties of the
    Web is of economic and social interest. Although the size of this problem is daunting,
    we will soon see that a lot of valuable information about the structure of a graph,
    happily, be determined in just linear time.


    # ### 3.1.1 How is a graph represented?


    We can represent a graph by an adjacency matrix; if there are n = |V| vertices
    v1, ..., vn, this is an n × n array whose (i, j) entry is


    ```

    a_{ij} = \begin{cases} 1 & \text{if there is an edge from u to v} \ 0 & \text{otherwise.}
    \end{cases}

    ```


    For undirected graphs, the matrix is symmetric since an edge (u, v) can be taken
    in either direction.'
