- pgno: 166
  md: '# Chapter 6


    # Dynamic programming


    In the preceding chapters we have seen some elegant design principles—such as
    divide-and-conquer, graph exploration, and greedy choice—that yield definitive
    algorithms for variety of important computational tasks. The drawback of these
    is that they can only be used on very specific types of problems. We now turn
    to the two sledgehammers of the algorithms craft, dynamic programming and linear
    programming, techniques of broad applicability that can be invoked when more specialized
    methods fail. Predictably, this generality often comes with a cost in efficiency.


    # 6.1 Shortest paths in dags, revisited


    At the conclusion of our study of shortest paths (Chapter 4), we observed that
    the problem is especially easy in directed acyclic graphs (dags). Let''s recapitulate
    the case, because it lies at the heart of dynamic programming.


    The distinguishing feature of a dag is that its nodes can be linearized; that
    is, can be arranged on a line that all edges go from left to right (Figure 6.1).
    To see why this helps with shortest paths, suppose we want to figure out distances
    from node S to other nodes. For concreteness, let''s focus on node D. The only
    way to get to it is through its predecessors, B or C; to find the shortest path
    to D, we only need these routes:


    ```

    dist(D) = min(dist(B) + 1, dist(C) + 3).

    ```


    A similar relation can be written for every node. If we compute these values in
    the left-right order of Figure 6.1, we can always be sure by the time we get to
    a node v, we already have all the information we need to compute dist(v). We are
    therefore able to compute all distances in a single pass:


    ```

    initialize dist(j) values to ∞

    dist(s) = 0

    for each v ∈ V\s, in linearized order:

    dist(v) = min_{u,v∈E}(dist(u) + l(u, v))

    ```


    Notice that this algorithm is solving a collection of subproblems, {dist(u) :
    u ∈ V}. We start with the smallest of them, dist(s), since we immediately know
    its answer'
