    Figure 2.6 is a pictorial review of some basic facts about complex numbers. The
    third panel of figure introduces the $n$th roots of unity: the complex numbers
    $1, \omega, \omega^2, \dots, \omega^{n-1}$, where $\omega=e^{2\pi i/n}$. If $n$
