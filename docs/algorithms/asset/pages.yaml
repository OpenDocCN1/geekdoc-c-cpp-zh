  md: '# 262


    # 8.3 The reductions


    Going in the other direction, CIRCUIT SAT can also be reduced to SAT. Here is
    how we can rewrite any circuit in conjunctive normal form (the AND of clauses):
    for each gate g in the circuit we create a variable g, and we model the effect
    of the gate using a few clauses:


    ![](img/3dd1f1364df8f87b80683fc32a15b999_272_0.png)


    Do you see that these clauses do, in fact, exactly the desired effect? And to
    finish up, if g is the output gate, we force it to be true by adding clause (g).
    The resulting instance of SAT is equivalent to the instance of CIRCUIT SAT: the
    satisfying assignments of this conjunctive normal form are in one-to-one correspondence
    with those of the circuit.


    Now we know CIRCUIT SAT reduces to SAT, we turn to our main job, showing that
    all search problems reduce to CIRCUIT SAT. So, suppose that A is a problem in
    NP. We must discover a reduction from A to CIRCUIT SAT. This sounds very difficult,
    because we know nothing about A!


    We all know about A is that it is a search problem, so we must put this knowledge
    to be checked: the main feature of a search problem is any solution to put it
    quickly: there is an algorithm C that checks, given an instance I and a proposed
    solution S, whether or not S is a solution of I. Moreover, C makes this decision
    in time polynomial in the length of I (we assume that S is itself encoded as a
    binary string, and we know that the length of this string is polynomial in the
    length of I).


    Recall our argument in Section 7.7 that any polynomial algorithm can be rendered
    as a circuit, however input gates encode the input to the algorithm. Naturally,
    for any input length (number of input bits) the circuit will be scaled to the
    appropriate number of inputs, but the total number of gates of the circuit will
    be polynomial in the number of inputs. If the polynomial algorithm in question
    solves a problem that requires a yes or no answer (as is the situation with C:
    "Does S encode a solution to the instance encoded by I"), this answer is given
    at the output gate.'
