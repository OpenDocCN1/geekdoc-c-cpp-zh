- pgno: 321
  md: "# Chapter 10\n\n# Algorithms 31\n\nProof. $x^2 \\equiv 1 \\pmod N$ implies\
    \ $N$ divides $(x^2 - 1) = (x+1)(x-1)$. But $N$ does not divide either of these\
    \ individual terms, since $x \neq \\pm 1 \\pmod N$. $N$ must have a nontrivial\
    \ factor in common with each of $(x+1)$ and $(x-1)$. In particular, $\\gcd(N,\
    \ x+1)$ is a nontrivial factor of $N$.\n\nExample. Let $N=15$. Then $4^2 \\equiv\
    \ 1 \\pmod 5$, but $4 \neq \\pm 1 \\pmod 5$. Thus $\\gcd(4-1, 15)=3$ and $\\gcd(4+1,\
    \ 15)=5$ are nontrivial factors of 15.\n\nTo complete the connection with periodicity,\
    \ we need one further concept. Define the order of $x$ modulo $N$ to be the smallest\
    \ integer $r$ such that $x^r \\equiv 1 \\pmod N$. For instance, the order of 2\
    \ modulo 15 is 4.\n\nComputing the order of a *random* number $x \\pmod N$ is\
    \ closely related to the problem of finding nontrivial square roots, and to factoring.\
    \ Here is the link.\n\n+   **Lemma** Let $N$ be an odd composite, and $x$ be chosen\
    \ uniformly at random between 0 and $N-1$. If $\\gcd(x,N)=1$, then with probability\
    \ 1/2, the order $r$ of $x$ modulo $N$ is even, and moreover $x^{r/2}$ is a nontrivial\
    \ square root of 1 modulo $N$.\n\nThe proof of this lemma is an exercise. What\
    \ it implies is that if we compute the order $r$ of a randomly chosen element\
    \ $x \\pmod N$, there's a chance that this order is even and $x^{r/2}$ is a nontrivial\
    \ square root of 1 modulo $N$. In which case $\\gcd(x^{r/2}-1, N)$ is a factor\
    \ of $N$.\n\nExample. If $x=2$ and $N=15$, then the order of 2 is 4 because $2^4\
    \ \\equiv 1 \\pmod 5$. Raising 2 to half power, we get a nontrivial root of 1:\
    \ $2^2 = 4 \neq \\pm 1 \\pmod 5$. So we get a divisor of 15 by computing $\\gcd(4+1,\
    \ 15)=5$.\n\nWe have reduced FACTORING to the problem of ORDER FINDING. The advantage\
    \ of this task is that it has a natural function associated with it: fix $x$,\
    \ and consider the function $f(a)=x^a \\pmod N$. If $r$ is the order, then $f(0)=f(r)=f(2r)=\\\
    dots=1$, and similarly, $f(1)=f(r+1)=f(2r+1)=\\dots=x$. Thus $f$ is periodic,\
    \ with period $r$. And we can compute it by the repeated squaring algorithm from\
    \ Section 1.2. So to order $N$, all we need to do is figure out how to use the\
    \ function $f$ to set up a periodic superposition with period $r$; whereupon we\
    \ can use quantum Fourier sampling as-is described in the next box.\n\n# 10.7\
    \ The quantum algorithm for factoring\n\nWe can now put together all the pieces\
    \ of the quantum algorithm for FACTORING (see Figure 10.6). Since we can test\
    \ in polynomial time whether input $N$ is a prime or a prime power, we assume\
    \ we have already done that and that the input is an odd composite number with\
    \ at least two distinct factors.\n\nInput: an odd integer N.\n\nOutput: a factor\
    \ of N."
  merge: -1
  img_proc: true
- pgno: 322
  md: "# Setting up a periodic superposition\n\nLet us now see how to use our periodic\
    \ function $f(a) = x^a \\mod N$ to set up a periodic superposition. Here is the\
    \ procedure:\n\n+   * We start with two quantum registers, both initially 0.\n\
    * Compute the quantum Fourier transform of the first register $M_0$, to get a\
    \ superposition over all numbers between 0 and $M-1$: $\\frac{1}{\\sqrt{M}}\\\
    sum_{a=0}^{M-1} |a, 0\\rangle$. This is because the initial superposition can\
    \ be thought of as periodic with period $M$, so the transform is periodic with\
    \ period 1.\n* We now compute the function $f(a) = x^a \\mod N$. The quantum circuit\
    \ for doing this regards the contents of the first register $a$ as the input to\
    \ $f$, and the second register (which is initially 0) as the answer register.\
    \ After applying this quantum circuit, the state of the two registers is: $\\\
    sum_{a=0}^{N-1}|a, f(a)\\rangle$.\n* We measure the second register on the first\
    \ register, with period $r$, the period of $f$. Here's why:\n\nSince $f$ is a\
    \ periodic function with period $r$, for every $r$th value in the first register,\
    \ the contents of the second register are the same. The measurement of the second\
    \ register yields $f(b)$ for some random $k$ between 0 and $r-1$. What is the\
    \ state of the first register after this measurement? To answer this question,\
    \ recall that the first register is a superposition of only values $a$ that are\
    \ compatible with the outcome of the measurement on the second register. But these\
    \ values of $a$ are exactly $k, k+r, k+2r,\\dots,k+M-r$. The resulting state of\
    \ the first register is a periodic superposition $|\\alpha\\rangle$ with period\
    \ $r$, which is exactly the order of $x$ we wish to find!\n\n+   * Choose $x$\
    \ uniformly in the range $1 \\le x \\le N-1$.\n* Let $M$ be a power of 2 near\
    \ $N$ (for reasons we cannot get into, it is best to choose $M \\approx N^2$).\n\
    * Repeat $L=\\log N$ times:\n    (a) Start with two quantum registers, both initially\
    \ 0, the first large enough to store a number $M$ and the second modulo $N$.\n\
    \    (b) Use the function $f(a) = x^a \\mod N$ to create a periodic superposition\
    \ $|\\alpha\\rangle$ of length $M$ as follows (see box for details):\n       \
    \ i. Apply the QFT to the first register to obtain the superposition $\\frac{1}{\\\
    sqrt{M}}\\sum_{a=0}^{M-1}|a, 0\\rangle$.\n        ii. Compute $f(a) = x^a \\mod\
    \ N$ using a quantum circuit, to get the superposition $\\frac{1}{\\sqrt{M}}\\\
    sum_{a=0}^{M-1}|a, x^a \\mod N\\rangle$."
  merge: -1
  img_proc: true
- pgno: 323
  md: "# Chapter 10\n\n# Algorithms 313\n\n# Figure 10.6 Quantum factoring.\n\n![](img/3dd1f1364df8f87b80683fc32a15b999_323_0.png)\n\
    \n+   iii. Measure the register. Now the first register contains the periodic\
    \ superposition $|\\alpha\rangle = \\sum_{j=0}^{M/r-1} \\sqrt{\\frac{r}{M}} |jr+k\r\
    angle$ where $k$ is a random offset between $0$ and $r-1$ (recall that $r$ is\
    \ the order of $x$ mod $N$).\ni. Fourier sample the superposition $|\\alpha\r\
    angle$ to obtain an index between $0$ and $M-1$.\nLet $g$ be the gcd of the resulting\
    \ indices $j_1, \\dots, j_s$.\nl. If $M/g$ is even, compute $\\gcd(N, x^{M/g}+1)$\
    \ and output it if it is a non-trivial factor of $N$; otherwise return to step\
    \ 1.\n\nFrom previous lemmas, we know that this method works for at least half\
    \ the cases of $x$, and the entire procedure has to be repeated a couple of times\
    \ before a factor is found.\n\nBut there is one aspect of this algorithm, having\
    \ to do with the number $M$, that is still quite unclear: $M$, the size of our\
    \ FFT, must be a power of 2. And for our period-detecting idea to work, the period\
    \ must divide $M—hence it should also be a power of 2. But the period in our case\
    \ is the order of $x$, definitely not a power of 2!\n\nThe reason it all works\
    \ anyway is the following: the quantum Fourier transform can detect the period\
    \ of a periodic vector if it does not divide $M$. But the division is not as clean\
    \ as in the case when the period divide $M$, so we shall not go any further into\
    \ this.\n\nLet $n$ be the number of bits of the input $N$. The running time of\
    \ the algorithm is dominated by $2 \\log N = O(n)$ repetitions of step 3. Since\
    \ modular exponentiation takes $O(n^3)$ steps (as we see in Section 1.2.2) and\
    \ the quantum Fourier transform takes $O(n^2)$ steps, the total running time for\
    \ the factoring algorithm is $O(n^3 \\log n)$."
  merge: -1
  img_proc: true
- pgno: 324
  md: "# Implications for computer science and quantum physics\n\nIn the early days\
    \ of computer science, people wondered whether there were much more powerful computers\
    \ than those made up of circuits of elementary gates. But since seventies this\
    \ question has been considered well settled. Computers implementing the Neumann\
    \ architecture on silicon are obvious winners, and it was widely accepted that\
    \ any other way of implementing computers is polynomially equivalent to them.\
    \ That is, T-step computation on any computer takes at most a polynomial in T\
    \ steps on. This fundamental principle is called the extended Church-Turing thesis.\
    \ Quantum computers validate this fundamental thesis and therefore call into question\
    \ some of our most assumptions about computers.\n\nCan quantum computers be built?\
    \ This is the challenge that is keeping many research teams of physicists and\
    \ computer scientists around the world. The main problem is that quantum superpositions\
    \ are very fragile and need to be protected from any inadvertent measurement by\
    \ the environment. There is progress, but it is very slow: so far, the most ambitious\
    \ quantum computation was the factorization of the number 15 into its factors\
    \ 3 and 5 using nuclear magnetic resonance (NMR). And even in this experiment,\
    \ there are questions about how faithfully the quantum factoring algorithm was\
    \ implemented. The next decade promises to be really exciting in terms of our\
    \ ability to physically manipulate bits and implement quantum computers.\n\nBut\
    \ there is another possibility: What if all these efforts at implementing quantum\
    \ computers fail? This would be even more interesting, because it would point\
    \ to some fundamental flaw in quantum physics, a theory that has stood unchallenged\
    \ for a century.\n\nQuantum computation is motivated as much by trying to clarify\
    \ the mysterious nature of quantum physics as by trying to create novel and superfluous\
    \ computers.\n\n# Exercises\n\n+   10.1. $|\\psi\rangle = \\frac{1}{\\sqrt{2}}|00\r\
    angle + \\frac{1}{\\sqrt{2}}|11\rangle$ is one of the famous \"Bell states,\"\
    \ a highly entangled state of two qubits. In this question we examine some of\
    \ its strange properties.\n(a) Suppose this Bell state can be decomposed as the\
    \ (tensor) product of two qubits (recall the back on page 300), the first state\
    \ in $|\\alpha_0|0\rangle + \\alpha_1|1\rangle$ and the second state in $|\beta_0|0\r\
    angle + \beta_1|1\rangle$. Write four equations that the amplitudes $\\alpha_0,\
    \ \\alpha_1, \beta_0$, and $\beta_1$ must satisfy. Conclude that the Bell state\
    \ cannot be decomposed.\n(b) What is the result of measuring the first qubit of\
    \ $|\\psi\rangle$?\n(c) What is the result of measuring the second qubit after\
    \ measuring the first qubit?\n(d) If the two qubits in state $|\\psi\rangle$ are\
    \ very far from each other, can you see why the answer to (c) is surprising?"
  merge: -1
