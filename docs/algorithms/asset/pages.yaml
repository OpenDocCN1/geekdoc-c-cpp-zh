  md: '# 4.4 Dijkstra’s algorithm


    # 4.4.1 An adaptation of breadth-first search


    Breadth-first finds shortest paths in any graph whose edges have unit length.
    Can we adapt it to a more general graph G = (V, E) whose edges $l_e$ are positive
    integers?


    # A more convenient graph


    Here is a simple trick for converting G into something BFS can handle: break G’s
    long edges into unit-length pieces by introducing “dummy” nodes. Figure 4.6 shows
    an example of this transformation. To construct the new graph G’


    For each edge $e = (u, v)$ of $E$, replace it by $l_e$ edges of length 1, by adding
    $l_e - 1$ dummy nodes between $a$ and $v$.


    Graph G’ contains all the vertices V that interest us, and the distances between
    them are exactly the same as in G. Most importantly, the edges of G’ all have
    unit length. Therefore, we can compute distances in G by running BFS on G’


    **Figure 4.6** Breaking edges into unit-length pieces.


    ![](img/3dd1f1364df8f87b80683fc32a15b999_118_0.png)


    # Alarm clocks


    If efficiency were not an issue, we could stop here. But when G has long edges,
    the G’ it engenders is thickly populated with dummy nodes, and the BFS spends
    most of its time diligently computing distances to these nodes that we don’t care
    about all.


    To see this more concretely, consider the graphs G and G’ of Figure 4.7, and imagine
    that the BFS, started at node s of G’, advances by one unit of distance per minute.
    The first 99 minutes it tediously progresses along S – A and S – B, an endless
    desert of dummy nodes. Is there some we can snooze through these boring phases
    and have an alarm wake us whenever *interesting* is happening—specifically, whenever
    one of the real nodes (from the original graph G) is reached?


    We do this by setting two alarms at the outset, for node A, to set go off at T
    = 100, and one for B, at T = 200. These are estimated times of arrival, based
    on the edges currently being traversed. We doze off and awake at T = 100 to find
    A has been discovered. At this point, the estimated time of arrival for B is adjusted
    to T = 150 and we change its alarm accordingly.'
