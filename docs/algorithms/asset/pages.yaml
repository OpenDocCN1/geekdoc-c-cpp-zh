  md: "# Chapter 8\n\n# Algorithms 251\n\nHere's the trick for reducing SAT to 3SAT:\
    \ given an instance $I$ of SAT, use exactly the same instance for 3SAT, except\
    \ that any clause with more than three literals, $(a_1 \\lor a_2 \\lor \\dots\
    \ \\lor a_k)$ (where the $a_i$ are literals and $k > 3$), is replaced by a set\
    \ of clauses,\n\n```\n$(a_1 \\lor a_2 \\lor y_1) (\\tilde{y}_1 \\lor a_3 \\lor\
    \ y_2) (\tilde{y}_2 \\lor a_4 \\lor y_3) \\dots (\tilde{y}_{k-3} \\lor a_{k-1}\
    \ \\lor a_k).$\n```\n\nwhere $y_i$ are new variables. Calling the result 3SAT\
    \ instance $I'$. The conversion from $I$ to $I'$ is clearly polynomial time.\n\
    \nWhy does this reduction work? $I'$ is equivalent to $I$ in satisfiability, because\
    \ for any assignment to the $a_i$,\n\n```\n$\\left\\{ (a_1 \\lor a_2 \\lor \\\
    dots \\lor a_k) \\text{ is satisfied} \\right\\} \\iff \\left\\{ (a_1 \\lor a_2\
    \ \\lor y_1) (\\tilde{y}_1 \\lor a_3 \\lor y_2) \\dots (\\tilde{y}_{k-3} \\lor\
    \ a_{k-1} \\lor a_k) \\text{ are all satisfied} \\right\\}$\n```\n\nThen let first,\
    \ suppose that the clauses on the right are all satisfied. Then at least one of\
    \ the literals $a_1, \\dots, a_k$ must be true—otherwise it would turn force $y_2$\
    \ to be true, and so on, eventually, falsifying the last clause $(a_1 \\lor a_2\
    \ \\lor \\dots \\lor a_k)$ is also satisfied.\n\nConversely, if $(a_1 \\lor a_2\
    \ \\lor \\dots \\lor a_k)$ is satisfied, then some $a_i$ must be true. $y_1, \\\
    dots, y_{k-2}$ rest to true and not false. This ensures that the clauses on the\
    \ right are all satisfied.\n\nThus, any instance of SAT can be transformed into\
    \ an equivalent instance of 3SAT. In fact, 3SAT remains even under the further\
    \ restriction that no variable appears in more than three clauses. To show this,\
    \ we must get rid of any variable that appears too many times.\n\nHere's the reduction\
    \ from 3SAT to its constrained version. Suppose that in the 3SAT instance, variable\
    \ $x$ appears in $k > 3$ clauses. Then replace its first appearance by $x_1$,\
    \ its second appearance by $x_2$, and so on, replacing each of its $k$ appearances\
    \ by a new variable. Finally, add the clauses\n\n```\n$(\\tilde{x}_1 \\lor x_2)\
    \ (\\tilde{x}_2 \\lor x_3) \\dots (\\tilde{x}_k \\lor x_1).$\n```\n\nRepeat for\
    \ every variable that appears more than three times.\n\nIt is easy to see that\
    \ in the new formula no variable appears more than thrice (and in fact, no literal\
    \ appears more than twice). Furthermore, the extra clauses involving $x_1, x_2,\
    \ \\dots, x_k$ constrain these variables to have the same value; do you see why?\
    \ Hence the original instance of 3SAT is satisfiable if and only if the constrained\
    \ instance is satisfiable."
