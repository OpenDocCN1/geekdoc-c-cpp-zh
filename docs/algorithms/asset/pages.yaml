  md: '# Linear programming in polynomial time (Continued)


    A few years later Narendra Karmarkar, a graduate student at UC Berkeley, came
    up with a completely different idea, which led to another polynomial algorithm
    for linear programming. Karmarkar''s algorithm is known as the interior point
    method, because it does just like that: it dashes to the optimum corner by not
    coming to corner on the surface of the polyhedron but by cutting a clever path
    in the interior of the polyhedron. And it performs well in practice.


    But the greatest advance in linear programming algorithms was not Khachian''s
    theoretical breakthrough or Karmarkar''s novel approach, but an unexpected consequence
    of the latter: the fierce competition between the two approaches, simplex and
    interior point, resulted in the development of very fast code for linear programming.


