  md: '# 1.2.5 Modular division


    In real arithmetic, every number $a \neq 0$ has an inverse, $1/a$, and dividing
    by $a$ is the same as multiplying by this inverse. In modular arithmetic, we can
    make a similar definition.


    > We say $x$ is the multiplicative inverse of $a$ modulo $N$ if $ax \equiv 1 \pmod
    N$.


    There can be at most one $x$ modulo $N$ (Exercise 1.23), and we shall denote it
    as $a^{-1}$. However, this does not always exist! For instance, 2 is not invertible
    modulo 6: that is, $2x \neq 1 \pmod 6$ for every possible choice of $x$. In this
    case, $a$ and $N$ are both even and thus then $mod \equiv a - kN$ for some $k$.
    More generally, we can be certain that $gcd(a, N)$ divides $ax \pmod N$, because
    this latter can be written in the form $ax \pm kN$. If $gcd(a, N) > 1$, then $ax
    \neq 1 \pmod N$, no matter what $x$ might be, and therefore a cannot have a multiplicative
    inverse modulo $N$.


    In fact, this is the only circumstance in which $a$ is not invertible. When $gcd(a,
    N) = 1$ (we say $a$ and $N$ are relatively prime), the extended Euclid algorithm
    gives us integers $x$ and $y$ such that $ax + Ny = 1$, which means $ax \equiv
    1 \pmod N$. Thus $x$ is $a\''99s inverse.


    *Example.* Continuing with our previous example, we choose to compute $11^{-1}
    \pmod{25}$. Using the extended Euclid algorithm, we find that $15 - 25 - 34 -
    111 = 1$. Reducing both sides modulo 25, we have $-34 \equiv 16 \pmod{25}$. So
    $-34 \equiv 16 \pmod{25}$ is the inverse of 11 modulo 25.


    **Modular division theorem** *For any $a$ modulo $N$, a has a multiplicative inverse
    modulo $N$ if and only if it is relatively prime to $N$. When such an inverse
    exists, it can be found in $O(n^2)$ (where $n$ denotes the number of bits of $N$)
    by running the extended Euclid algorithm.


    This resolves the issue of modular division: when working modulo $N$, we can divide
    by numbers relatively prime to $N$—and only by these. And to actually carry out
    the division, by multiplying by the inverse.


    # 1.3 Primality testing


    There is some test that will tell whether a number is prime without trying to
    factor the number? We place our hopes in a theorem from the year 1640.


    **Fermat\''99s little theorem** *If $p$ is prime, then for every $1 \leq a < p$,*


    ```

    $a^{p-1} \equiv 1 \pmod p$.

    ```


    *Proof.* Let $S$ be the nonzero integers modulo $p$; that is, $S = \{1, 2, \dots,
    p-1\}$. Here''s the crucial observation: the effect of multiplying these numbers
    by $a$ (modulo $p$) is simply to permute them. For instance, here''s a picture
    of the case $a=3, p=7$:'
