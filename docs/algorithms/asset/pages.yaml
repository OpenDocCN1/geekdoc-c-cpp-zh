  md: '# Chapter 8


    # Algorithms 25


    A search problem is specified by an algorithm C that takes two inputs, an instance
    I and a proposed solution S, and runs in time polynomial in |I|. We say S is a
    solution to I if and only if C(I, S) = true.


    Given the importance of the SAT search problem, researchers over the past 50 years
    have tried to find efficient ways to solve it, but without success. The fastest
    algorithms we have are still exponential over worst-case inputs


    Yet, there are two natural sets of SAT for which we have good algorithms. If all
    clauses contain at most one literal, the Boolean formula is a Horn formula, and
    a satisfying truth assignment, if one exists, can be found by the greedy algorithm
    of Section 5.3. Alternatively, if all have only two literals, then graph theory
    comes into play, and SAT can be solved in linear time by finding the strongly
    connected components of a particular graph constructed from the instance (recall
    Exercise 5.28). In fact, Chapter 9 will see a different polynomial algorithm for
    this special case, which is called 2SAT.


    On the other hand, if we are just a little more permissive and allow clauses to
    contain three literals, the resulting problem, known as 3SAT (an example of which
    we saw earlier), once again becomes hard to solve!


    # The traveling salesman problem


    In the traveling salesman problem (TSP) we have n vertices 1...n and n(n−1)/2
    distances between them, as well as a budget b. We are asked to find a tour, a
    cycle that passes through every vertex exactly once, of total cost b less to report
    that no such tour exists. That is, we seek a permutation τ(1)...τ(n) of the vertices
    such that they are toured in this order, the total cost covered is at most b:


    $d_{τ(1),τ(2)} + d_{τ(2),τ(3)} + \dots + d_{τ(n),τ(1)} \leq b.$


    See Figure 8.1 for an example (only some of the distances are shown); assume the
    rest are very large.


    Notice how we have defined the TSP as a search problem: given an instance, a tour
    budget (or report that no tour exists). But why are we expressing the traveling
    salesman problem in this way, when in reality it is an optimization problem, in
    which the shortest possible tour is sought? Why do we dress it up as search?


    For a good reason. Our plan in this chapter is to compare and relate. The framework
    of search problems is helpful in this regard, because it encompasses optimization
    problems like the TSP in addition to true search SAT.


    Turning an optimization problem into a search problem does not change its difficulty
    at all, because the two versions reduce to one another. Any algorithm that solves
    the optimization TSP also solves the search problem: find the optimum tour and
    if it is within budget, return it; if not, there is no solution.'
