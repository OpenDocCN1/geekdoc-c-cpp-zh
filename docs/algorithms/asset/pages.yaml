    # Bob


    $e()$ is chosen that without knowing $d(-)$, Eve cannot do anything with the information
    she has picked up. In other words, knowing $e(x)$ tells her or nothing about what
    $x$ might be.


    For centuries, cryptography was based on what we now call *private protocols*.
    In such a scheme, Alice and Bob meet beforehand and choose a secret codebook,
    with which they encrypt all future correspondence between them. Eve''s only hope,
    then, is to collect some encoded messages and use them to at least partially figure
    out the codebook.


    Private-key schemes such as RSA are significantly more subtle and tricky: they
    allow Alice to send a message to Bob without ever having met before. Bob''s encryption
    function $e()$ is publicly available, and Alice can encrypt her message with this
    function, *digitally locking it*. Only Bob has the key to quickly unlocking this
    digital lock: the decryption function $d(-)$. The point is that Alice and Bob
    need only perform calculations to lock and unlock message—operations that any
    computing device could handle. In contrast, to unlock the message without the
    key, Eve must perform operations like factoring large numbers, which requires
    more computational power than would be afforded by the world''s most powerful
    computers combined. This compelling guarantee ensures web commerce, such as using
    credit card numbers over the Internet.


    # 1.4.1 Private-key schemes: one-time pad and AES


    If Alice wants to transmit an important private message to Bob, it would be of
    wise to scramble it with her encryption function,


    > $e : (messages) \rightarrow (encoded messages).


    Of course, this function must be invertible—for decoding to be possible—and is
    therefore a bijection. Its inverse is the decryption function $d(-)$.


    In the *one-time pad*, Alice and Bob meet beforehand and secretly choose a binary
    string $r$ of the same length—say, $n$ bits—as the important message $x$ that
    Alice will later send. Alice''s encryption function is then a bitwise exclusive-or,
    $e(x)=x \oplus r$; each position in the encoded message is the exclusive-or of
    the corresponding positions in $x$ and $r$. For instance, if $r = 01110010$, the
    message $11110000$ is scrambled thus:


    ```

    $e_r(11110000) = 11110000 \oplus 01110010 = 10000010$.

    ```'
