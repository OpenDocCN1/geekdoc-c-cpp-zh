  md: '# Entropy


    The annual county horse race is bringing in three thoroughbreds who have never
    competed against one another. Excited, you study the past 200 races and summarize
    them as probability distributions over four outcomes: "first place", second, third,
    and other.


    | Outcome | Aurora | Whirlwind | Phantasm |

    |---|---|---||

    | first | 0.15 | 0.30 | 0.20 |

    | second | 0.10 | 0.05 | 0.30 |

    | third | 0.70 | 0.25 | 0.30 |

    | other | 0.05 | 0.40 | 0.20 |


    Which is the most predictable? One quantitative approach to this question is to
    use compressibility. Write down the history of each horse as a string of 200 values
    (first, second, third, other). The total number of bits needed to encode these
    track-record strings can be computed using Huffman''s algorithm. This works out
    to 290 bits for Whirlwind, and 420 for Phantasm (check it!). Aurora has the shortest
    encoding and is therefore in a strong sense the most predictable.


    The inherent unpredictability, or randomness, of a probability distribution can
    be measured by the extent to which it is possible to compress data from that distribution.


    > more compressible = less random = more predictable


    Suppose there are $n$ possible outcomes, with probabilities $p_1, p_2, \dots,
    p_n$. If a sequence of $m$ draws is drawn from the distribution, then the $i$-th
    outcome will pop up roughly $m_i$ times (if $m$ is large). For simplicity, assume
    these are the observed frequencies, and moreover that the $p_i$''s are all powers
    of 2 (that is, of the form $1/2^k$). It can be seen by induction (Exercise 5.19)
    that the number of bits needed to encode the sequence is $\sum_{i=1}^n m_i \log(1/p_i)$.
    The average number of bits needed to encode a single draw from the distribution
    is


    ```

    $$\sum_{i=1}^n p_i \log \frac{1}{p_i}$

    ```


    This is the *entropy* of the distribution, a measure of how much randomness it
    contains.


    For example, a fair coin has two outcomes, with each probability 1/2. So its entropy
    is


    ```

    $$\frac{1}{2} \log 2 + \frac{1}{2} \log 2 = 1$.

    ```


    This is natural enough: the coin flip contains one bit of randomness. But what
    if the coin is not fair, if it has a 3/4 chance of turning up heads? Then its
    entropy is


    ```

    $$\frac{3}{4} \log \frac{3}{4} + \frac{1}{4} \log \frac{1}{4} = 0.81$.

    ```


    A biased coin is more predictable than a fair coin, and has lower entropy. As
    the bias becomes more pronounced, the entropy drops toward zero.


    We explore these further in Exercises 5.18 and 5.19.'
  merge: -1
  img_proc: true
