    # Knapsack with repetition


    Let''s start with the version that allows repetition. As always, the main question
    in dynamic programming is, what are the subproblems? Can we shrink the original
    problem in two ways: we can either look at smaller knapsack capacities $w \le
    W$, or we can look at fewer items (for instance, items $1, 2, \dots, j$, for $j
    \le n$). It usually takes a little experimentation to figure out what we need.


    The first restriction calls for smaller capacities. Accordingly, define


