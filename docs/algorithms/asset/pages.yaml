    1 with probability $|alpha_1|^2$ (luckily we normalized so $|alpha_0|^2 + |alpha_1|^2
    = 1$). Moreover, the act of measurement causes the system to change its state:
    if the outcome of measurement is 0, then the new state of the system is $|0\rangle$
    (the ground state), and if the outcome is 1, the new state is $|1\rangle$ (the
    excited state). This feature of quantum physics, that a measurement disturbs the
    system and forces it to choose (in this case ground or excited state), is another
    strange phenomenon with no classical analog.


    The superposition principle holds not for 2-level systems like the one we just
    described, but in general for $k$-level systems. In reality, the electron in the
    hydrogen atom can be in many energy levels, starting with the ground state, the
    first excited state, the second excited state, and so on. We could consider a
    $k$-level system consisting of the ground state and the $k-1$ excited states,
    and we could denote these by $|0\rangle, |1\rangle, \dots, |k-1\rangle$. The superposition
    principle would then say that the quantum state of the system is $|alpha_0\rangle
    + |alpha_1\rangle + \dots + |alpha_{k-1}\rangle$. Measuring the state of the system
    would now reveal a number between 0 and $k-1$, and outcome $j$ would occur with
    probability $|alpha_j|^2$. As before, measurement would disturb the system, and
    the new state would actually become $|j\rangle$ or the $j$th excited state.


