- pgno: 200
  md: 'is to maximize c, we must move the line as far up as possible, while still
    touching the feasible region. The optimum solution will be the very last feasible
    point that the profit line sees and must be a vertex of the polygon, as shown
    in the figure. If the slope of the profit line were different, its last contact
    with the polygon could be an entire edge rather than a single vertex. In this
    case, the optimum solution would not be unique, but there would certainly be an
    optimum vertex.


    It is a general rule of linear programs that the optimum is achieved at a vertex
    of the feasible region. The only exceptions are cases in which there is no optimum;
    this can happen in two ways:


    +   1. The linear program is *infeasible*; the constraints are so tight that it
    is impossible to satisfy all of them. For instance,


    $x \le 1, x \ge 2$


    +   2. The constraints are so loose that the feasible region is *unbounded*, and
    it is possible to achieve arbitrarily high objective values. For instance,


    $\max x_1 + x_2$\nx_1, x_2 \ge 0$.


    # Solving linear programs

    Linear programs (LPs) can be solved by the *simplex method*, devised by George
    Dantig in 1947. We shall explain it in more detail in Section 7.6, but briefly,
    this algorithm starts at a vertex, in our case perhaps (0, 0), and repeatedly
    looks for an adjacent vertex (connected by an edge of the feasible region) of
    better objective value. In this way it does *hill-climbing* on the vertices of
    the polygon, walking from neighbor to neighbor so as steadily increase profit
    along the way. Here''s a possible trajectory.


    ![](img/3dd1f1364df8f87b80683fc32a15b999_200_0.png)


    Upon reaching a vertex that has no better neighbor, simplex declares it to be
    optimal and halts. Why does this *local* test imply *global* optimality? By simple
    geometry—think of the profit line passing through this vertex. Since all the vertex''s
    neighbors lie below the line, the rest of the feasible polygon must also lie below
    this line.'
