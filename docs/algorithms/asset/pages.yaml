  md: '# General TSP


    But if we are interested in instances of TSP that do not satisfy the triangle
    inequality? It turns out that this is a much harder problem to approximate.


    Here is why: Recall that on page 260 we gave a polynomial-time reduction given
    any graph G and any integer C > 0 produces an instance I(G, C) of the TSP such
    that:


    +   (i) G has a Rudrata path, then OPT(I(G, C)) = n, the number of vertices in
    G.

    (ii) G has no Rudrata path, then OPT(I(G, C)) ≥ n+C.


    This means that an approximate solution to TSP would enable us to solve RUDRATA
    PATH! Let''s work out the details.


    Consider an approximation algorithm A for TSP and let αA be its approximation
    ratio. By using any instance G of RUDRATA PATH, we will create an instance I(G,
    C) of TSP using the specific constant C = n/αA. What happens when algorithm A
    is run on this TSP instance? In case (i), it must output a tour of length at least
    αA·OPT(I(G, C)) = n, whereas in case (ii) it must output a tour of length at least
    OPT(I(G, C)) ≥ n. Then we can figure out that G has a Rudrata path! Here is the
    resulting procedure:


    ```

    Given any graph G:

    compute I(G,C) (with C = n/αA) and run algorithm A on it\if the resulting tour
    has length ≤ n/αA:

    conclude that G has a Rudrata path

    else: conclude that G has no Rudrata path

    ```


    This tells us whether or not G has a Rudrata path; by calling the procedure a
    number of times, we can find the actual path (Exercise 8.2).


    We''ve shown that TSP has a polynomial-time approximation algorithm, then there
    is a polynomial algorithm for the NP-complete RUDRATA PATH problem. So, unless
    P = NP, there cannot exist an efficient approximation algorithm for the TSP.


    # 9.2.4 Knapsack


    Our approximation algorithm is for a maximization problem and has a very impressive
    guarantee: given any ε > 0, it returns a solution of value at least (1 −ε) times
    the optimal value, in time that scales polynomially in the input size and in 1/ε.


    The problem is KNAPSACK, which was first encountered in Chapter 6. There are n
    items, with weights wi,...,wn and values vi,...,vn (all integers), and the goal
    is to pick the most valuable combination of items to satisfy the constraint that
    their total weight is at most W.


    Earlier we saw a dynamic programming solution to this problem with running time
    O(nW). Using a similar technique, a running time of O(nV) can also be achieved,
    where V is the sum of the values. Neither of these is running times is polynomial,
    because W and V can be very large, exponential in the size of the input.'
  merge: -1
  img_proc: true
