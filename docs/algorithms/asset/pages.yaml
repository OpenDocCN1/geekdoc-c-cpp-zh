  md: '# Randomized algorithms: a virtual chapter


    Surprisingly—almost paradoxically—some of the fastest and most clever algorithms
    we have rely on chance; at specified steps they proceed according to the outcomes
    of random coin tosses. These randomized algorithms are often very simple and elegant,
    and their output is allowed to be incorrect with small probability. This bound
    on failure probability holds for every input; it only depends on the random choices
    made by the algorithm itself, and can easily be as small as one likes.


    Instead of devoting a special chapter to this topic, in this book we interspersed
    randomized algorithms at the chapters and sections where they arise naturally.
    Furthermore, no knowledge of probability is necessary to follow what is happening.
    You just need to be familiar with the concept of probability, expected value,
    the expected number of times we must flip a coin before getting heads, and the
    property known “linearity of expectation.


    Here are pointers to the major randomized algorithms in this book: One of the
    first and most dramatic examples of a randomized algorithm is the probabilistic
    primality test of Figure 1.8. Although a deterministic primality test was widely
    discovered, the randomized test is much faster and remains the algorithm of choice.
    Later in this chapter, in Section 1.5 (page 35), we discuss hashing, a general
    data structure that supports inserts, deletes, and duplicates. Again, in practice
    it lets faster data access than deterministic schemes by binary search trees.


    There are two varieties of randomized algorithms. Monte Carlo algorithms always
    run fast but their output has a small chance of being incorrect; the primality
    test is an example. Vegas algorithms, on the other hand, always output the correct
    answer or guarantee a running time with high probability. Examples of these are
    the randomized algorithms for sorting and median finding described in Chapter
    2 (on pages 50 and 53, respectively).


    The fastest known algorithm for the minimum cut is a randomized Monte Carlo algorithm,
