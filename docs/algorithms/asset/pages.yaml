- pgno: 271
  md: '# Figure 8.13 An instance of CIRCUIT SAT.


    ![](img/3dd1f1364df8f87b80683fc32a15b999_271_0.png)


    +   * Known input gates have no incoming edges and are labeled false or true.

    * Unknown input gates have no incoming edges and are labeled "?".


    One of the sinks of the dag is designated as the output gate.


    Given an assignment of values to the unknown inputs, we can evaluate the gates
    of the circuit in topological order, using the rules of Boolean logic (such as
    false v true = true), until we obtain the value at the output gate. This is the
    value of the circuit for the particular assignment to the inputs. For instance,
    the circuit in Figure 8.13 evaluates to false under the assignment true, false,
    true (from left to right).


    Circuit SAT is then the following search problem: Given a circuit, find a truth
    assignment for the unknown inputs that the output gate evaluates to true, or report
    that no such assignment exists. For example, if presented with the circuit in
    Figure 8.13 we could have returned the assignment (false, true, true) because
    we substitute these values to the unknown inputs (from left to right), the output
    becomes true.


    Circuit SAT is a generalization of SAT. To see why, notice that SAT asks for a
    satisfying truth assignment for a circuit that has this simple structure: a bunch
    of AND gates at the top join the clauses, and the result of this big AND is the
    output. Each clause is the OR of its literals. Each literal is either an unknown
    input gate or the NOT of one. There are no known input gates.'
