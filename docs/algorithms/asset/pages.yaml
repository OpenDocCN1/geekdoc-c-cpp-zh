    10.3. What is the quantum Fourier transform $M$ of the uniform superposition $|\frac{1}{\sqrt{M}}\sum_{j=0}^{M-1}|j\rangle$?


    10.4. What is the QFT modulo $M$ of $|j\rangle$?


    10.5. Convolution-Multiplication. If we shift a superposition $|\alpha\rangle
    = \sum \alpha_j|j\rangle$ to get the superposition $|\alpha''\rangle = \sum \alpha_j|j+l\rangle$.
    If the QFT of $|\alpha''\rangle$ is $|\beta''\rangle$, show that $\beta''_k =
    \beta_k\omega^{kl}$. Conclude that


    $|\alpha''\rangle = \sum_{j=0}^{M-1} \frac{1}{\sqrt{M}}|j+l\rangle$, then $|\beta''\rangle
    = \sum_{j=0}^{M-1} \beta_j\omega^{jM/k}|jM/k\rangle$.


    10.6. Show that if you apply a Hadamard gate to the inputs and outputs of a CNOT,
    the result is a CNOT gate with control and target qubits swapped:


    ![](img/3dd1f1364df8f87b80683fc32a15b999_325_1.png)


    10.7. The CONTROLLED SWAP (c-SWAP) gate takes as input 3 qubits and swaps the
    second and third if only the first qubit is a 1.


    +   (a) Show that each of the NOT, CNOT, and c-SWAP gates are their own inverses.


    +   (b) Show how to implement an AND gate using a c-SWAP gate, i.e., what inputs
    $a, b, c$ would you give to a c-SWAP gate so that one of the outputs is $a \wedge
    b$?


    +   (c) How would you achieve fan using just these three gates? That is, on input
    $a$ and $0$, output and $a$.


    +   (d) Conclude therefore that for any classical circuit $Q$ using just NOT and
    c-SWAP gates in the following sense: if $C$ outputs $y$ on input $x$, then $Q$
    outputs $[x, y, z]$ on input $[x, 0, 0]$. Here $z$ is some of junk bits that are
