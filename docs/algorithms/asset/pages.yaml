  md: '# # Chapter 10


    # # Quantum algorithms


    This book started with the world''s oldest and most widely used algorithms (the
    ones for adding and multiplying numbers) and an ancient hard problem (FACTORING).
    In this last chapter the tables are turned: we present one of the latest algorithms—and
    it is an efficient algorithm for FACTORING!


    There is a catch, of course: this algorithm needs a quantum computer to execute.


    Quantum physics is a beautiful and mysterious theory that describes Nature in
    the small, at the level of elementary particles. One of the major discoveries
    of the nineties was that quantum computers—computers based on quantum physics
    principles—are radically different from those that operate according to the more
    familiar classical of physics. Surprisingly, quantum computers can solve FACTOR
    in polynomial time! As a result, in a world with quantum computers, the systems
    that safeguard business transactions on the Internet (and are based on the RSA
    cryptosystem) will no longer be secure.


    #  10.1 Qubits, superposition, and measurement


    In this section we introduce the basic features of quantum physics that are necessary
    for understanding how quantum computers work.


    In ordinary computer chips, bits are physically represented by low and high voltages
    on wires. But there are many ways a bit could be stored—for instance, in the state
    of a hydrogen atom. The single electron in this atom can be either in the ground
    state (the lowest energy configuration) or it can be in an excited state (high
    energy configuration). We can use two states to encode for bit values 0 and 1,
    respectively.


    Let us now introduce quantum physics notation. We denote the ground state of our
    electron by |0>, since it encodes for bit value 0, and unlike the excited state


    > This field is so strange that the famous physicist Richard Feynman is quoted
    as saying, "I think I can say that no one understands quantum physics." So there
    is little chance you will understand the theory in depth after reading this section!
    But if you are interested in learning more, see the recommended reading at the
    book''s end.'
