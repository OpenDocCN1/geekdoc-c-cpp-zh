  md: '# 172


    # 6.6 Shortest paths


    Suppose that we have a graph G with lengths on the edges, along with two nodes
    s and t and an integer k, and we want the shortest path from s to t that uses
    at most k edges.


    Is there a quick way to adapt Dijkstra''s algorithm to this new task? Not quite:
    that algorithm focuses on the length of each shortest path without “remembering”
    the number of hops in the path, which is now a crucial piece of information.


    In dynamic programming, the trick is to choose subproblems so that vital information
    is remembered and carried forward. In this case, let us define, for each vertex
    v and each integer i ≤ k, dist(v, i) to be the length of the shortest path from
    s to v that uses i edges. The starting values dist(v, 0) = ∞ for all vertices
    except s, for which it is 0. And the general update equation is, naturally enough,


    ```

    dist(v, i) = min_{u,v∈E} [dist(u, i-1) + l(u, v)].

    ```


    And we need more?


    # All-pairs shortest paths


    What if we want to find the shortest path not just between s and t but all pairs
    of vertices? One approach would be to execute our general shortest-path algorithm
    from Section 4.6.1 (since there may be negative edges) |V| times, for each starting
    node. The total running time would then be O(|V|^2|E|). We''ll need a better alternative,
    the O(|V|^3) dynamic programming-based Floyd-Warshall algorithm.


    Is there a good subproblem for computing all pairs of vertices in a graph? Simply
    solving the problem for more and more pairs or starting points is unhelpful, because
