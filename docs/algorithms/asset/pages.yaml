    +   (e) Now show that there is a quantum circuit $Q^{-1}$ that outputs $[x, 0,
    0]$ on input $[x, y, z]$.


    +   (f) Show that there is a quantum circuit $Q''$ made up of NOT, CNOT, and c-SWAP
    gates that outputs $[x, y, 0]$ on input $[x, y, 0]$.'
