  md: '# Figure 5.10 A prefix-free encoding. Frequencies are shown in square brackets.


    ![](img/3dd1f1364df8f87b80683fc32a15b999_151_0.png)


    | Symbol | Codeword |

    | A | 0 |

    | B | 100 |

    | C | 101 |

    | D | 11 |


    the decoding of strings like 001 is ambiguous. We will avoid this problem by insisting
    on the prefix-free property: no codeword can be a prefix of another codeword.


    Any prefix-free encoding can be represented by a full binary tree—that in which
    each node has either zero or two children—where the symbols are at the leaves,
    and where each codeword is generated by a path from root to leaf, interpreting
    left as 0 and right as 1 (Exercise 5.29). Figure 5.10 shows an example of such
    encoding for the four symbols A, B, C, D. Decoding is unique: a string of bits
    is decrypted by starting at the root, reading the string from left to right to
    move downward, and whenever a leaf is reached, outputting the corresponding symbol
    and returning to the root. It is a simple scheme and pays nicely for our toy example,
    (under the codes of Figure 5.10) the total size of the binary string drops to
    21 megabits, a 17% improvement.


    In general, how do we find the optimal coding tree, given the frequencies $f_1,
    f_2,...,f_n$ of $n$ symbols? To make the problem precise, we want a tree whose
    leaves correspond to a symbol and minimizes the overall length of the encoding,


    ```

    $cost\text{ tree} = \sum_{i=1}^{d} f_i \cdot (depth\text{ of } i^{th} symbol in
    tree)$

    ```


    (the number of bits required for a symbol is exactly its depth in the tree).


    There is another way to write this cost function that is very helpful. Although
    we are only given frequencies for the leaves, we can define the frequency of any
    internal node to be the sum of the frequencies of its descendants; this is, after
    all, the number of times the internal node is visited during encoding or decoding.
    During the encoding process, each time we move down the tree, one gets bit output
    for every node through which we pass. cost—the total number of bits which are
    output—can also be expressed as:


    The cost of a tree is the sum of the frequencies of all leaves and internal nodes,
    except the root.'
