  md: "# Figure 4.7 BFS on G' is mostly uneventful. The dotted lines show some early\
    \ \"wavefronts.\"\n\n![](img/3dd1f1364df8f87b80683fc32a15b999_119_0.png)\n\nMore\
    \ generally, at any given moment the breadth-first search is advancing along certain\
    \ edges of G, and there is an alarm for every endpoint toward which it is moving,\
    \ set off the estimated time of arrival at that node. Some of these might be overestimates\
    \ because BFS may find shortcuts, as a result of arrivals elsewhere. In the preceding\
    \ example, a quicker route to B was revealed upon arrival at A. However, nothing\
    \ interesting can possibly happen before an alarm goes off. The sounding of the\
    \ next alarm must signal the arrival of the wavefront to a real node u ∈ V by\
    \ BFS. At that point, BFS might also start advancing along some new edges of u,\
    \ and alarms need to be set for their endpoints.\n\nThe following \"alarm clock\
    \ algorithm\" faithfully fulfills the execution of BFS on G'.\n\n+   - Set an\
    \ alarm clock for node s at time 0.\n- Repeat until there are no more alarms:\n\
    - Say the next alarm goes off at T, for node u. Then:\n  - The distance from s\
    \ to u is T.\n  - For each neighbor v u in G:\n    - If there is no alarm for\
    \ v, set one for T + l(u, v).\n    - If v's alarm is set for later than T + l(u,\
    \ v), then edit it to this earlier time.\n\n# Dijkstra's algorithm\n\nThe alarm\
    \ clock algorithm computes distances in any graph with positive integral lengths.\
    \ It is almost ready for use, except that we need to implement the system of alarms.\
    \ The right data structure for this job is a priority queue (usually implemented\
    \ via a heap), which maintains a set of elements (nodes) with associated numeric\
    \ key values (alarm times) and supports the following operations:\n\n+   - Insert\
    \ a new element to the set.\n- Decrease-key. Accommodate the decrease in key value\
    \ of a particular element."
