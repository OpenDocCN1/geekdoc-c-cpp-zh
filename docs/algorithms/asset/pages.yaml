    from the FFT algorithm (Figure 2.9), via a pattern of wires known as a *butterfly*:


    Unraveling the FFT circuit completely for $n=8$ elements, we get Figure 2.10.
    Notice the following.


    +   1. For $n$ inputs there are $\log_2 n$ levels, with $n$ nodes, for a total
    of $n \log n$ operations.


    +   2. The inputs are arranged in a peculiar order: 0, 4, 2, 6, 1, 5, 3, 7.


    Why? Recall that at the top level of recursion, we first bring up the coefficients
    of the input and then on to the odd ones. At the next level, the even coefficients
    of this group (which therefore are multiples of 4, or equivalently, have zero
    as their least significant bits) are brought up, and so on. To put it otherwise,
    the inputs are arranged by increasing *last* of the binary representation of their
    index, resolving ties by looking at the next most significant bit(s). The resulting
    order in binary, 000, 100, 010, 110, 001, 101, 011, 111, except the bits are the
    same as the natural one, *mirrored*!


