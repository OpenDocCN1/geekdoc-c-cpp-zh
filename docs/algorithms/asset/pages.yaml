  md: "# 64\n\n# 2.6 The fast Fourier transform\n\n# 2.7 The fast Fourier transform\
    \ (polynomial formulation)\n\n```\nfunction FFT($A, \\omega$)\n```\n\n**Input:**\
    \ Coefficient representation of a polynomial $A(x)$ of degree $\\le n-1$, where\
    \ $n$ is a power of 2 $\\omega$, an $n$-th root of unity\n\n**Output:** Value\
    \ representation $A(\\omega^0), \\dots, A(\\omega^{n-1})$\n\n```\nif $\\omega=1$:\
    \ return $A(1)$\nexpress $A(x)$ in the form $A_k(x^2) + xA_k(x^2)$\ncall $FFT(A_k,\
    \ \\omega)$ to evaluate $A_k$ at even powers of $\\omega$\ncall $FFT(A_k, \\omega^2)$\
    \ to evaluate $A_k$ at odd powers of $\\omega$\nfor $j=0$ to $n-1$:n  compute\
    \ $A(\\omega^j) = A_k(\\omega^{2j}) + \\omega^j A_k(\\omega^{2j})$\n```\n\n```\n\
    return $A(\\omega^0), \\dots, A(\\omega^{n-1})$\n```\n\nThe remaining piece of\
    \ the puzzle is the inverse operation, interpolation. It will turn out, amazingly,\
    \ that\n\n```\n$(\\text{coefficients}) = \\frac{1}{n}FFT(\\text{values}, \\omega^{-1})$\n\
    ```\n\nInterpolation is solved through the simplest most elegant way we could\
    \ have hoped for—using the same FFT algorithm, but called with $\\omega^{-1}$\
    \ in place of $\\omega$! This might seem like a miraculous coincidence, but it\
    \ will make a lot more sense when we recall our polynomial operations in the language\
    \ of linear algebra. Meanwhile, our $O(n \\log n)$ polynomial multiplication algorithm\
    \ (Figure 2.5) is now fully specified.\n\n# **A matrix reformulation**\n\nTo get\
    \ a clearer view of interpolation, let's explicitly set down the relation between\
    \ our two for a polynomial $A(x)$ of degree $\\le n$—1. They are both vectors\
    \ of $n$ numbers, and one is a linear transformation of the other:\n\n```\n$$\\\
    begin{bmatrix} A(X_0) \\ A(X_1) \\ \\vdots \\ A(X_{n-1}) \\end{bmatrix} = \begin{bmatrix}\
    \ 1 & X_0 & \\dots & X_0^{n-1} \\ 1 & X_1 & \\dots & X_1^{n-1} \\ \\vdots & \\\
    vdots & \\ddots & \\vdots \\ 1 & X_{n-1} & \\dots & X_{n-1}^{n-1} \\end{bmatrix}\
    \ \\begin{bmatrix} a_0 \\ a_1 \\ \\vdots \\ a_{n-1} \\end{bmatrix}$\n```\n\nThe\
    \ matrix in the middle $M$. Its specialized format—a Vandermonde matrix—gives\
    \ it many remarkable properties, of which the following is particularly relevant\
    \ to us.\n\nIf $X_0, \\dots, X_{n-1}$ are distinct numbers, then $M$ is invertible."
