  md: '# Of mice and men


    Our bodies are extraordinary machines: flexible in function, adaptive to new environments,
    and able to interact and reproduce. All these capabilities are specified by a
    program unique to each of us, a string that is 3 billion characters long the alphabet
    [A, C, G, T]—DNA.


    The DNA sequences of any two people differ by only about 0.1%, however this still
    leaves 3 million positions on which vary, more than enough to explain the vast
    range of human diversity. These differences are of great scientific and medical
    interest—for instance, they might help predict which people are prone to certain
    diseases.


    DNA is a vast and seemingly inscrutable program, but it can be broken down into
    smaller units that are precise in their role, like subroutines. These are called
    genes. Computers have a crucial tool in understanding the genes of humans and
    other organisms, to the extent that computational genomics is now a field in its
    own right. Here are examples of typical questions that arise:


    +   1. When a new gene is discovered, one way to gain insight into its function
    is to find genes that match closely. This is particularly helpful in transferring
    knowledge from well-studied species, such as mice, to human beings.


    A basic primitive in this search problem is to define an efficiently computable
    match of when strings approximately match. The biology suggests a generalization
    of edit distance, and dynamic programming can be used to compute it.


    Then there''s the problem of searching through the vast thick of known genes:
    the database GenBank already has a total length of over 10¹¹, and this number
    is growing rapidly. The current method of choice is BLAST, a clever combination
    of algorithmic tricks and biological intuitions that have made it the most widely
    used software in computational biology.


    +   2. Methods for sequencing DNA (that is determining the string of characters
    that constitute it) typically only fragments of 500-700 characters. Billions of
    randomly scattered fragments can be generated, but how can they be assembled into
    a coherent DNA sequence? For one, the position of any fragment in the final sequence
    is unknown and may be inferred by piecing together overlapping fragments.


    A centerpiece of these efforts is the draft of human DNA completed in 2001 by
    two groups: the publicly funded Human Genome Consortium and the private Celera
    Genomics.


    +   3. When a particular gene has been sequenced in several places, can this information
    be used to reconstruct the evolutionary history of these species?


    We explore these problems in the exercises at the end of this chapter. Dynamic
    programming has turned out to be an invaluable tool for some of them and for computational
    biology in general.'
