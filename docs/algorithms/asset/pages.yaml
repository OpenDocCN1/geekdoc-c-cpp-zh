  md: 'analyzing the behavior of this algorithm, we first need to get a minor bad
    out of the way. It turns out that extremely rare composite numbers $N$, called
    Carmichael numbers, pass Fermat''s test for all relatively prime to $N$. On such
    numbers our algorithm will fail; but they are pathologically rare, and we will
    later see how to deal with them (page 28), so let''s ignore these numbers for
    the time being.


    In a Carmichael-free universe, our algorithm works well. Any prime number $N$
    will of course pass Fermat''s test and produce the right answer. On the other
    hand, any non-Carmichael composite number $N$ must fail Fermat''s test for some
    value of $a$; and as we will show, this implies that $N$ fails Fermat''s test
    at least half the possible values of $a$


    **Lemma** If $a^{N-1} \neq 1 \pmod N$ for some relatively prime to $N$, then it
    must hold for at least half the choices of $a < N$.


    *Proof.* Fix some value of $a$ for which $a^{N-1} \neq 1 \pmod N$. The key is
    to notice that every element $b < N$ passes Fermat''s test with respect to $N$
    (that is, $b^{N-1} \equiv 1 \pmod N$) has a twin, $a \cdot b$, that fails the
    test:


    ```

    $(a \cdot b)^{N-1} \equiv a^{N-1} \cdot b^{N-1} \equiv a^{N-1} \neq 1 \pmod N$.

    ```


    Moreover, all these elements $a \cdot b$, for a fixed $a$ but different choices
    of $b$, are distinct, for the same reason $a \cdot i \neq a \cdot j$ in the proof
    of Fermat''s test: just divide by $a$.


    ![](img/3dd1f1364df8f87b80683fc32a15b999_36_0.png)


    The one-to-one function $b \mapsto a \cdot b$ shows that at least half many elements
    fail the test as pass it.


    We are ignoring Carmichael numbers, so we can now assert


    If $N$ is prime, then $a^{N-1} \equiv 1 \pmod N$ for all $a < N$. If $N$ is not
    prime, then $a^{N-1} \equiv 1 \pmod N$ for at most half the values of $a < N$.


    The algorithm of Figure 1.7 therefore has the following probabilistic behavior.


    ```

    $Pr(\text{Algorithm 1.7 returns yes when } N \text{ is prime}) = 1$\n$Pr(\text{Algorithm
    1.7 returns yes when } N \text{ is not prime}) \leq \frac{1}{2}$

    ```'
