  md: '# 1.2 Modular arithmetic


    **Lemma** For positive integers a and b, the extended Euclid algorithm returns
    integers x, y, and d such that gcd(a, b) = d = ax + by.


    *Proof.* The first thing to confirm is that if you know the x'' and y'', the extended
    algorithm is exactly the same as the original. So, at least we compute d = gcd(a,
    b).


    For the case, the recursive nature of the algorithm suggests a proof by induction.
    The recursion ends when b = 0, so it is convenient to use induction on the value
    of b.


    The base case b = 0 is easy enough to check directly. Now any larger value of
    b. The algorithm finds gcd(a, b) by calling gcd(b, mod b). Since a mod b < b,
    we can apply the inductive hypothesis to this recursive call and conclude that
    the x'' and y'' are correct:


    ```

    gcd(a, mod b) = bx'' + (a mod b)y''.

    ```


    Writing (a mod b) as a - |a/b|b,


    ```

    d = gcd(a, b) = gcd(b, mod b) = bx'' + (a mod b)y''

    d = bx'' - |a/b|by''.

    ```


    Therefore d = ax + by with x = y'' and y = x'' - |a/b|y'', validating the algorithm''s
    behavior on input (a, b).


    Example. To compute gcd(25, 11), Euclid''s algorithm would proceed as follows:


    ```

    25 = 2 · 11 + 3

    11 = 3 · 3 + 2

    3 = 1 · 2 + 1

    2 = 2 · 1 + 0

    ```


    (at each stage, the gcd computation has been reduced to the underlined numbers).
    Thus gcd(25, 11) = gcd(11, 3) = gcd(3, 2) = gcd(2, 1) = 1.


    To find x and y that 25x + 11y = 1, we start by expressing 1 in terms of the last
    pair (1, 0). We work backwards and express it in terms of (2, 1), (3, 2), (11,
    3), and finally (25, 11). The first step is:


    ```

    1 = 1 · 0.

    ```


    To rewrite this in terms of (2, 1), we use the substitution 0 = 2 - 2 · 1 from
    the line of the gcd calculation to get:


    ```

    1 = 1 − (2 - 2 · 1) = -1 - 2 + 3 · 1.

    ```


    The second-line of the gcd calculation tells us that 1 = 3 - 1 · 2. Substituting:


    ```

    1 = -1 · 2 + 3 · (3 - 1 · 2) = 3 - 4 · 2.

    ```


    Continuing in this way with substitutions 2 = 11 - 3 · 3 and 25 = 25 - 2 · 11
    gives:


    ```

    1 = 3 · 3 - 4(11 - 3 · 3) = -4 · 11 + 15 · 3 = -4 · 11 + 15(25 - 2 · 11) = 15
    · 25 - 34 · 11.

    ```


    We''re done: 15 · 25 - 34 · 11, so x = 15 and y = -34.'
