  md: '# Chapter 4


    # Algorithms


    is started. In addition, a special ordering constraint is: the value of any node
    of the tree is less or equal to that of its children. In particular, therefore,
    the root always contains the smallest element. See Figure 4.11(a) for an example.


    To insert, place the new element at the bottom of the tree (in the first available
    position), and let it "bubble up." That is, if it is smaller than its parent,
    swap the two and repeat (Figure 4.11(b)-(d)). The number of swaps is at most the
    height of the tree, which is $\log n$, when there are $n$ elements. A decreasekey
    is similar, except that the element is already in the tree, so we let it bubble
    up from its position.


    To delete, return the value. To remove this from the heap, take the last node
    in the tree (in the rightmost position in the bottom row) and place it at the
    root. Let it "down" if it is bigger than either child, swap it with the smaller
    child and repeat (Figure 4.11(e)-(g)). This takes $O(\log n)$ time.


    The regularity of a binary tree makes it easy to represent using an array. The
    tree nodes have a natural ordering; by row, starting at the root and moving left
    to right each row. If there are $n$ nodes, this ordering specifies their positions
    $1, 2, \dots, n$ in the array. Moving up and down the tree is easily simulated
    on the array, using the fact that node number $j$ has parent $[j/2]$ and children
    $2j$ and $2j+1$ (Exercise 4.16).


    # 4.5.3 d-ary heap


    D-ary heap is identical to a binary heap, except that nodes have $d$ children
    instead of two. This reduces the height of a tree with $n$ elements to $O(\log_d
    n) = \Theta(\log n/\log d)$. Inserts are therefore faster by a factor of $\Theta(\log
    d)$. Deletes, however, take a little longer, $O(\log_d n)$ (do you see why?).


    The array representation of a binary heap is easily extended to the d-ary case.
    This time, node number $j$ has parent $[(j-1)/d]$ and children $\{(j-1)d+1, \dots,
    \min(n, (j-1)d+d)\}$ (Exercise 4.16).


