- pgno: 202
  md: '# 7.1 An introduction to linear programming


    The space of solutions is now three-dimensional. Each linear equation defines
    a 3D plane, and each inequality a half-space on one side of the plane. The feasible
    region is an intersection of seven half-spaces, a polyhedron (7.2). Looking at
    the figure, can you decipher which inequality corresponds to each face of the
    polyhedron?


    A profit of c corresponds to the plane $x_1 + 6x_2 + 13x_3 = c$. As $c$ increases,
    this profit-plane moves parallel to itself, further and further into the positive
    orthant until it no longer touches the feasible region. The point of final contact
    is the optimal: (0, 300, 0), with total profit $3100.


    How would the simplex algorithm behave on this modified problem? As before, it
    would move from vertex to vertex, along edges of the polyhedron, increasing profit
    steadily. A possible trajectory is shown in Figure 7.2, corresponding to the following
    sequence of vertices and profits


    ```

    $(0, 0, 0) \longrightarrow (200, 0, 0) \longrightarrow (200, 200, 0) \longrightarrow
    (0, 300, 100)\n$200 \quad \quad $1400 \quad \quad $2800 \quad \quad $3100$

    ```


    Finally, upon reaching a vertex with no better neighbor, it would stop and declare
    this to be the optimal point. Once again by basic geometry, if all the vertex''s
    neighbors lie on one side of the profit-plane, then so must enter the entire polyhedron.


    # A magic trick called duality


    Here is why you should believe that (0, 300, 100), with a total profit of $3100,
    is the optimal: Look back at the linear program. Add the second to the third,
    and add the fourth. Result is the inequality $x_1 + 6x_2 + 13x_3 \le 3100$.


    Do you see? This inequality says that no feasible solution (values $x_1, x_2,
    x_3$ satisfying the constraints) can possibly have a profit greater than 3100.
    So we indeed found the optimum! The only question is, where did we get these mysterious
    multipliers (0, 1, 4) for the four inequalities?


    In Section 7.4 we will see that it is always possible to come up with such multipliers
    by solving another LP. Except that (it gets better) we do not even need to solve
    this other LP, because it is in fact so intimately connected to the original—it
    is called the *dual*—that solving the original LP solves the dual as well! But
    we are getting far ahead of our story.


    What if we add a fourth line, or hundreds of them? The problem becomes high-dimensional,
    and hard to visualize. Simplex continues to work in this general setting, although
    we can no longer rely upon simple geometric intuitions for its description and
    justification. We will study the fully-fledged simplex algorithm in Section 7.6.


    In the meantime, we can rest assured in the knowledge that there are many professional,
    industrial-strength packages that implement simplex and take care of all the tricky
    details like numeric precision. In a typical application, the main task is therefore
    to correctly express the problem as a linear program. The package then takes care
    of the rest.'
