- pgno: 57
  md: '# Figure 2.1 A divide-and-conquer algorithm for integer multiplication.


    function multiply(x, y)

    Input: n-bit positive integers x and y

    Output: Their product


    ```

    if n=1: return xy


    x_l, x_s = leftmost [n/2], rightmost [n/2] bits of x

    y_l, y_s = leftmost [n/2], rightmost [n/2] bits of y


    P1 = multiply(x_l, y_l)

    P2 = multiply(x_s, y_s)

    P3 = multiply(x_l + x_s, P1 - P2) x 2^(n/2 + P2)

    ```


    algorithm, in Figure 2.1, has an improved running time of

    T(n) = 3T(n/2) + O(n).


    The point is that the constant factor improvement, from 4 to 3, at every level
    of the recursion, and this compounding effect leads to a dramatically lower time
    bound of O(n^1.59).


    This running can be derived by looking at the algorithm''s pattern of recursive
    calls, which form a tree structure, as in Figure 2.2. Let''s try to understand
    the shape of this tree. At each successive level of recursion the subproblems
    get halved in size. At the (log n), n^th level, the subproblems get down to size
    1, and so the recursion ends. Therefore, the height of the tree is log n. The
    branching factor is 3—each problem recursively produces three smaller ones—with
    the result that at depth k in the tree are 3^k subproblems, each of size n/2^k.


    For each subproblem, a linear amount of work is done in identifying subproblems
    and combining their answers. Therefore the total time spent at k in the tree is

    3^k * O(n/2^k) = O(n).


    > Actually, the recurrence should read

    T(n) ≤ 3T(n/2 + 1) + O(n)


    since the numbers (x_l + x_s) and (y_l + y_s) could be n/2 + 1 bits long. The
    one we''re using is simpler to deal with and can be implemented exactly the same
    big-O running time.'
