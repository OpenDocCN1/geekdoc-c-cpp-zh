  md: '# 7.1.4 Variants of linear programming


    As evidenced in our examples, a general linear program has many degrees of freedom.


    +   - It can be either a maximization or a minimization problem.

    - Its constraints can be equations and/or inequalities.

    - The variables are often restricted to be nonnegative, but they can also be unrestricted
    in sign.


    We will now show that these various LP options can all be reduced to one another
    via simple transformations. Here''s how.


    +   - To turn a maximization problem into a minimization (or vice versa), multiply
    the coefficients of the objective function by -1.

    - To turn an inequality constraint like $\sum_{i=1}^n a_ix_i \le b$ into an inequality,
    introduce a new variable $s$ and use


    ```

    $$\sum_{i=1}^n a_ix_i + s = b$$

    $$s \ge 0.$

    ```


    This $s$ is called the slack variable for the inequality. For justification, observe
    that a vector $(x_1, \dots, x_n)$ satisfies the original inequality constraint
    if and only if there is some $s \ge 0$ for which it satisfies the new equality
    constraint.


    +   - To change an equality constraint into inequalities is easy: rewrite $ax
    = b$ as $ax \le b$ as the equivalent pair of constraints $ax \le b$ and $ax \ge
    b$.

    - Finally, to deal with a variable $x$ that is unrestricted in sign, we do the
    following:

    - Introduce two nonnegative variables, $x^+, x^- \ge 0$.

    - Replace $x$, wherever it occurs in the constraints or the objective function,
    by $x^+ - x^-$.


    This way, $x$ can take on any real value by appropriately adjusting the new variables.
    More precisely, any feasible solution to the original LP involving can be mapped
    to a feasible solution of the new LP involving $x^+, x^-$, and vice versa.


    By applying these transformations we can reduce any LP (maximization or minimization,
    with both inequalities and equations, and with both nonnegative and unrestricted
    variables) into an LP of a much more constrained kind that we call the standard
    form, in which the variables are all nonnegative, the constraints are all equations,
    and the objective function is to be minimized.'
