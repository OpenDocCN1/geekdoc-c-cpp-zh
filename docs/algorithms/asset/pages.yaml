    as well; this is described in Section 9.3. And finally the quantum algorithm for
    factoring (Section 10.7) works much like a randomized algorithm, its output being
    correct with high probability—except that it draws its randomness not from coin
    tosses, but from the superposition principle in quantum mechanics.


