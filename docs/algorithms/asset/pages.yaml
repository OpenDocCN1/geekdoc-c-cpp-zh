  md: '# The two ways to use reductions


    So far in this book the purpose of a reduction from a problem A to a problem B
    has been straightforward and honorable: We know how to solve B efficiently, and
    we want to use this knowledge to solve A. In this chapter, however, reductions
    from A to B serve a somewhat perverse goal: we know A is hard, and we use the
    reduction to prove that B is as hard as well!


    If we negate a reduction from A to B


    $A \rightarrow B$


    then we can say that difficulty flows in the direction of the arrow, while efficient
    algorithms move in the opposite direction. It is through this propagation of difficulty
    that we know NP-complete problems are hard: all other search problems reduce to
    them, and each NP-complete problem contains the complexity of all search problems.
    If even one NP-complete problem is in P, then P = NP$.


    Reductions also have the convenient property that they compose.


    $If A \rightarrow B \rightarrow C$, then $A \rightarrow C$.


    To see this, observe first of all that reduction is completely specified by the
    pre and postprocessing functions $f$ and $h$ (see the reduction diagram). If $(f_{AB},
    h_{AB})$ and $(f_{BC}, h_{BC})$ define the reductions from A to B and from B to
    C, respectively, then a reduction from A to C is given by compositions of these
    functions: $f_{BC} \circ f_{AB}$ maps an instance of A to an instance of C and
    $h_{AB} \circ h_{BC}$ sends a solution of C back to a solution of A$.


    This means that once we know a problem A is NP-complete, we can use it to prove
    that a new search problem B is also NP-complete, simply by reducing A to B. Such
    a reduction establishes that all problems in NP reduce to B, via A$.


    # Figure 8.6 The space NP of all search problems, assuming $P \neq NP$.


    ![](img/3dd1f1364df8f87b80683fc32a15b999_256_0.png)'
