  md: '# 1.1 Basic arithmetic


    In binary this is particularly easy since each intermediate row is either zero
    or x itself, left-shifted an appropriate amount of times. Also notice that left-shifting
    is just a quick way to multiply by the base, which in this case is 2. (Likewise,
    the effect of a right shift is divide by the base, rounding down if needed.)


    The correctness of this multiplication procedure is the subject of Exercise 1.6;
    let''s move on and figure out how long it takes. If x and y are both n bits, then
    there are n intermediate rows, with lengths up to 2n bits (taking the shifting
    into account). The total time to add up these rows, doing two numbers at a time,,


    ```

    $O(n) + O(n) + \dots + O(n),\nn - 1$ times

    ```


    which is $O(n^2)$, quadratic in the size of the inputs: slight polynomial but
    much slower than addition (as we have suspected since elementary school).


    But Al Khwarizmi knew another way to multiply, a method which is used today in
    some European countries. To multiply two decimal numbers x and y, write them next
    to each other, as in the example below. Then repeat the following: divide the
    first number by 2, rounding the result (that is, dropping .5 if the number was
    odd), and double the second number. Keep going until the first number gets down
    to 1. Then strike out all rows where the first number is even, and add whatever
    remains in the second column.


    ```

    11 13

    5 26

    2 52 (strike out)

    1 104

    143 (answer)

    ```


    But if we compare the two algorithms, binary multiplication and multiplication
    by repeated halvings of the multiplier, we notice that we are doing the same thing!
    The three numbers added in the second algorithm are precisely the multiples of
    13 by powers of 2 that were added in the binary method. Only this time 11 was
    not given to us in binary, so we had to extract its binary representation by looking
    at the parity of the numbers obtained from it by successive divisions by 2. Al
    Khwarizmi''s second algorithm is a fascinating mixture of decimal and binary!


    The same algorithm can then be repackaged in different ways. For variety we adopt
    a third formulation, the recursive algorithm of Figure 1.1, which directly implements
    the rule


    ```

    $x \cdot y = \begin{cases} {x \cdot \lfloor y/2 \rfloor} & \text{if } y \text{
    is even}\\nx + 2(x \cdot \lfloor y/2 \rfloor) & \text{if } y \text{ is odd}.}\end{cases}$

    ```


    Is this algorithm correct? The preceding recursive rule is transparently correct;
    so'
