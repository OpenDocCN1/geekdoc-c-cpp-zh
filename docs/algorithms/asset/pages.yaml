    # Algorithms 255


    ![](img/3dd1f1364df8f87b80683fc32a15b999_265_0.png)


    The five columns of **A** correspond to the five triples, the nine rows are for
    Al, Bob, Chet, Alice, Beatrice, Carol, Armadillo, Bobcat, and Canary, respectively.


    It is straightforward to argue that solutions to the two instances translate back
