  md: '# 2.2 Recurrence relations


    Divide-and-conquer algorithms follow a generic pattern: they tackle a problem
    of size n by recursively solving, say, a subproblems of size n/b and then combining
    their answers in O(n^d) time, as (in the multiplication algorithm, a=3, b=2, and
    d=1). Their running time can be captured by the equation T(n) = aT(n/b) + O(n^d
    We derive a closed-form solution to this recurrence so that we no longer have
    to solve it explicitly in each new instance.


    Master theorem² If T(n) = aT(n/b) + O(n^d) for some constants a > 0, b > 1, and
    d ≥ 0,


    ```

    T(n) = \begin{cases} O(n^d) & d > log_b a \ O(n^d log_b a) & d = log_b a \ O(n^{log_b
    a}) & d < log_b a \end{cases}

    ```


    This theorem tells us the running times of the divide-and-conquer procedures we
    are likely to use.


    Proof. To prove the claim


    Next, that the size of subproblems decreases by a factor of b with each level
    of recursion, and therefore reaches the base case after log n levels. The height
    of the recursion tree. Its branching factor is a, so the kth level of the tree
    is made up of a^k subproblems, each of size n/b^k (Figure 2.3). The total work
    done at this level is


    ```

    a^k \times O(\frac{n^d}{b^{kd}}) = O(n^d) \times (\frac{a}{b^d})^k

    ```


    As k goes from 0 (the root) to n (the leaves), these numbers form a geometric
    series with ratio a/b^d. Finding the sum of such a series in big-O notation is
    (Exercise 0.2), and comes to three cases.


    +   1. The ratio is less than 1.

    Then the series is decreasing, and its sum is just given by its first term, O(n^d).\2.
    The ratio is greater than 1.

    The series is increasing and its sum is given by its last term, O(n^{log_b a}):


    ```

    n^d (\frac{a}{b^d})^{log_b n} = n^d \frac{a^{log_b n}}{b^{d log_b n}} = a^{log_b
    n} = a^{log_b n^{log_b a}}

    ```


    +   3. The ratio is exactly 1.

    In this case O(log n) terms of the series are equal to O(n^d).


    These cases translate directly into the three cases in the theorem statement.


    ²There are even more general results of this type, but we will not need them.'
