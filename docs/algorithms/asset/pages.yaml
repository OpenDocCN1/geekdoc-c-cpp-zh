  md: '# The story of Sissa and Moore


    According to the legend, the game of chess was invented by the Brahmin Sissa to
    teach him his king. Asked by the grateful monarch what he wanted in return, he
    requested the king place one grain of rice in the first square of the chessboard,
    two in the second, four in the third, and so on, and as a result doubling the
    amount of rice up to the 64th square. The king agreed on the spot, and as a result
    he the first person to learn the valuable—albeit humbling—lesson of exponential
    growth. Sissa''s request amounted to $2^{64}-1 = 18,446,744,073,709,551$ grains
