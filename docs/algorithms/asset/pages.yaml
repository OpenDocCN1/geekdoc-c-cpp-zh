    ![](img/3dd1f1364df8f87b80683fc32a15b999_289_0.png)


    One more observation completes the design of our approximation algorithm: let
    S be a set that contains both endpoints of each edge in a maximal matching $M$.
    S must be a vertex cover—if it isn''t, that is, if it doesn''t touch some edge
    $e \in E, M$ could not possibly be maximal if we could still add $e$ to it. But
    our cover has $2|M|$ vertices. From the previous paragraph we know that *any vertex
    cover* must have at least $|M|$. So we''re done.


    Here''s the algorithm for VERTEX COVER:


    ```

    Find a maximal matching $M \subseteq E$

    Return $S = [all \ endpoints \ edges \ in \ M]$

    ```


    This simple procedure always returns a vertex cover whose size is at most twice
    optimal!


    In summary, even though we have no way of finding the best vertex cover, we can
    easily find another structure, a maximal matching, with two key properties:


    +   1. Its size gives us a lower bound on the optimal vertex cover.

    2. It can be used to build a vertex cover, whose size is related to that of the
    optimal vertex cover using property 1.


    Thus, this simple algorithm has an approximation ratio of $\alpha_A \le 2$. In
    fact, it is not hard to find examples on which it it makes a 100% error; however,
    $\alpha_A = 2$.


    # 9.2.2 Clustering


    We turn to a *clustering* problem, in which we have some data (text documents,
    say, or images, speech samples) that we want divide into groups. It is often useful
    to define "distances" between these data points, numbers that capture how close
    or far they are from one another. Often the data are true in dimensional space
    and the distances are the usual Euclidean distance; in other cases, the distances
    are the result of some "similarity tests" to which we have subjected the data
    points. Assume that we have such distances and that they satisfy the usual *metric
    properties*:


    +   1. $d(x, y) \ge 0$ for all $x, y$.'
