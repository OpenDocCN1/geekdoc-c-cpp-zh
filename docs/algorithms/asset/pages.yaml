- pgno: 69
  md: '# Why multiply polynomials?


    For one thing, it turns out that the fastest algorithms we have for multiplying
    integers heavily on polynomial multiplication; after all, polynomials and binary
    integers are quite similar—just replace the variable x by the base 2, and watch
    out for carries. But perhaps more importantly, multiplying polynomials is crucial
    for signal processing


    A signal is any quantity that is a function of time (as in Figure (a)) or position.
    It might, for instance, capture a human voice by measuring fluctuations in air
    pressure close to the speaker''s mouth, or alternatively, the pattern of stars
    in the night sky, measuring brightness as a function of angle.


    ![](img/3dd1f1364df8f87b80683fc32a15b999_69_0.png)


    In order to extract information from a signal, we will need to digitize it by
    sampling (Figure (b)—and, then, to put it through a system that will transform
    it in some way. The output is called the *response* of the system:


    signal $\longrightarrow$ response.


    An important class of systems are those that are linear—the response to the sum
    of signals is just the sum of their individual responses—and time invariant—shifting
    the input signal by time $t$ produces the same output, also shifted by $t$. Any
    system with these properties is characterized by its response to the simplest
    possible input: the unit impulse $\delta(t)$, consisting of a "jerk". To see this,
    consider the close $\delta(t-i)$, a shifted impulse in which the jerk occurs at
    time $i$. Any signal $a(t)$ can be expressed as a linear combination of these,
    letting $\delta(t-i)$ pick out its behavior at time $i$,


    ```

    $y(t) = \sum_{i=0}^{T} a(i)\delta(t-i)$

    ```


    (if the signal consists of $T$ samples). By linearity, the response to input $a(t)$
    is determined by the responses to the various $\delta(t-i)$. And by time invariance,
    these are in just shifted copies of the impulse response $b(t)$, the response
    to $\delta(t)$.


    In other words, the output of the system at time $k$ is


    ```

    $c(k) = \sum_{i=0}^{k} a(i)b(k-i)$,

    ```


    exactly the formula for polynomial multiplication!'
