    \ $(M/2+j)$ outputs, respectively. How would a quantum circuit achieve the result\
    \ of these $M$ classical gates? Simple: perform the Hadamard gate on the first\
    \ qubit! Recall from the preceding discussion (Section 10.5) that for every possible\
    \ configuration of the $M-1$ qubits, we pair the strings $0x$ and $1x$. Translating\
    \ from binary, this means we are pairing $x$ and $M/2+x$. The result of the Hadamard\
    \ gate is that for each, the amplitudes are replaced by the sum and difference\
    \ (normalized by $1/\\sqrt{2}$), respectively. So the QFT requires almost no gates\
    \ at all!\n\nThe phase that must be applied to the $(M/2+j)$ wire for each $j$\
    \ requires a little work. Notice that the phase of $\\omega^j$ must be applied\
    \ only if the first qubit is 1. If $j$ is represented by $M-1$ bits $j_1...j_{M-1}$,\
    \ then $\\omega^j=\\prod\\omega^{j_l l}$. Thus the phase $\\omega^j$ can be applied\
    \ by applying the $l$th wire (for each $l$) a phase of $\\omega^l$ if the $l$th\
    \ qubit is 1 and the first qubit is a 1. This task can be accomplished by another\
    \ two-qubit quantum gate—the controlled phase gate. It leaves the two qubits unchanged\
    \ they are both 1, in which case it applies a specified phase factor.\n\nThe QFT\
    \ circuit is now specified. The number of quantum gates is given by the formula\
    \ $S(m)=S(m-1)+O(m)$, which works out to $S(m)=O(m^2)$. The QFT on inputs of size\
    \ $M=2^m$ requires $O(\\log M)$ quantum operations.\n\n# 10.6 Factoring as periodicity\n\
    \nWe have seen how the quantum Fourier transform can be used to find the period\
    \ of a periodic superposition. Now we show, by a sequence of simple reductions,\
    \ how factoring can be recast as a period-finding problem.\n\nFix an $N$. A nontrivial\
    \ square root of 1 modulo $N$ (recall Exercises 1.36 and 1.40) is any integer\
    \ $x \not\\pm1 \\pmod N$ such that If we find a nontrivial square root of 1 mod\
    \ $N$, then it is easy to decompose $N$ into a product of two nontrivial factors\
    \ (and repeating the process would factor $N$):\n\n> **Lemma** If $x$ is a nontrivial\
    \ square root of 1 modulo $N$, then $\\gcd(x+1, N)$ is a nontrivial factor of\
    \ $N$."
