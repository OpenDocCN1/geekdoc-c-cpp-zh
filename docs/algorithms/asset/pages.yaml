    - All elements have a well-defined inverse.\n\nThis particular group is called\
    \ the *multiplicative group of $N$*, usually denoted $\\mathbb{Z}_N^*$.\nGroup\
    \ theory is a very well developed branch of mathematics. One of its key concepts\
    \ is that a group can contain a *subgroup*—a subset that is in group and itself.\
    \ An important fact about a subgroup is that its size must divide the size of\
    \ the whole group.\n\nConsider the set $B = \\{b : b^{N-1} \\equiv 1 \\pmod N\\\
