- pgno: 368
  md: '# String Concatenation - Another Approach


    You know that in C the operator += has the effect of adding the two operands together
    and storing the results into the left-hand argument. If your intent in doing String
    concatenation is to modify the left-hand argument, then the String operator would
    be a natural choice for you to use. Obviously, you must allocate new space on
    the heap for the resulting literal to avoid an overflow situation.


    ```

    String& operator+=(const String&);

    ```


    # Overloading An Operator As Both Unary And Binary


    To demonstrate an operator being overloaded in both its unary and binary modes,
    you will overload the + operator as a unary member operator. Of course, what the
    operator actually does is completely arbitrary, so let''s just assume that its
    purpose is to ensure that all letters of the string literal are upper case. Note
    that this function does not modify the String object itself, but instead returns
    a new String object that contains the modification. This is somewhat consistent
    with how unary operators behave. If you really want to modify the invoking object,
    then it becomes a matter of storing the result back into the invoking object.


    ```

    String operator+() const;

    ```


    # Comparing Two String Instances


    The next operations you might want to perform on instances of the String class
    would be to compare them each other. This implies overloading the six relational
    operators. All comparisons will be sensitive, although you could easily make them
    non-case sensitive. Once again, note that the functions are all binary functions
    to allow the left-hand operand (which could type char* or type char) to be implicitly
    cast into a temporary String object.


    ```

    friend int operator+=(const String&, const String&);

    friend int operator!=(const String&, const String&);

    friend int operator<=(const String&, const String&);

    friend int operator<==(const String&, const String&);

    friend int operator>=(const String&, const String&);

    friend int operator>=(const String&, const String&);

    ```'
