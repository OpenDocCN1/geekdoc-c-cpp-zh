    \    Distance() {} // default constructor\n    Distance (int ft, float in) { feet\
    \ = ft; inches = in; }\n    Distance operator+(Distance d);\n};\n```\n\n```\n\
    Distance::operator+(Distance d) {\n  int ft = feet + d.feet;\n  float in = inches\
    \ + d.inches;\n  if (in >= 12.0) {\n    in -= 12.0;\n    ++ft;\n  }\n  return\
