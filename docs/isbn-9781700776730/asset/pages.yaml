- pgno: 316
  md: '# Introduction to Inheritance


    Inheritance is one of the best things about C++. After classes, inheritance is
    probably the most powerful feature of object-oriented programming. It''s the feature
    that sets object-oriented programming apart from traditional programming because
    it allows us to extend and reuse existing code without having to rewrite the code.


    So far all the classes we''ve created have been built from scratch, which is probably
    the way you''ve been working when you want to add new features to a program, since
    it''s usually as easy to write new code as it is to change existing code, debug,
    etc. What we want to do is to be able to add new features to a program without
    changing the original code, and that''s what inheritance lets you do!


    In C, if you have a library of code and its source, which isn''t always the case,
    you can make changes. But first you have to have a copy of the source code. As
    you make modifications, you need to understand the internals of the functions
    that someone else may have written. As you do this, it is a given that you''re
    going to introduce some bugs, which may or may not be easy to find. So you end
    up with 2 bodies of code


    +   * the old debugged body


    +   * and your body of code which contains the old code in some form, plus additions
    and changes, and of course new bugs.


    Future changes mean more copies and the amount of code you need to maintain increases,
    but without an equivalent increase in functionality.


    Creating new data types or classes is the fundamental activity in C++, since we
    use types or classes to model the problem being solved. When we think about changing
    or extending code in C++, it''s natural that we think not in terms of data or
    functions, but in terms of classes. Thus, reusing code in C++ means reusing classes.


    It''s very common that an existing class that you or someone else has written
    or debugged doesn''t quite do quite what you want. In C++, you can make a new
    class from an old one using inheritance. When you inherit, you say:


    "This new type or class is just like that old one plus some data and functions."'
  merge: -1
