  md: 'Inheritance is commonly used in two ways:


    +   - in one role it can be thought of as a reuse mechanism, a way to create a
    new class that strongly resembles an existing one.


    +   - in another role, it can be thought of as an abstraction mechanism, a tool
    to organize classes into hierarchies of specializations


    In both cases, you can think of it as a way for one class to subcontract or delegate
    some of its tasks to another.'
