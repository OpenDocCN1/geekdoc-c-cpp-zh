- pgno: 24
  md: '# What Is C++?


    # C++ Executive Summary


    - C++ is the work of Bjarne Stroustrup of AT&T Bell Labs.


    - C++ is a mostly upward compatible extension of C that provides:


    +   - C++ is A Better C

    - safer

    - less reliance on preprocessor and libraries

    - more flexibility


    +   - Support for Data Abstraction

    - new data types


    +   - Support for Object-Oriented Programming

    - supports classes

    - supports inheritance

    - supports polymorphism


    - C++ supports these paradigms; it does not require their use


    # Introduction


    - C++ is a better C


    - C++ supports data abstraction


    - C++ supports object-oriented programming


    # C++ Is a Better C - What''s the Same?


    - C++ contains a collection of features that make it more convenient to program
    in the traditional C paradigm.


    - C++ is (almost) a superset of C.


    - All operators and rules are the same in C++.'
  merge: -1
  img_proc: true
- pgno: 25
  md: '- A legal C program is a legal C++ program except when the C program:


    +   - uses C++ keywords as identifiers

    - depends on certain C type conversion rules that are different in C++


    - Control structures (for, while, do, if, if else, switch, etc.) all work as before
    and cannot be extended


    +   - Operators (+, -, +,, --, etc.) all work as before with the same precedence.
    However, operators can now be extended to work on new types (structs / classes).


    - Still have global declarations and library declarations in .h files and implementation
    code in .cpp files, but levels of abstraction now need to be separated into different
    source files,


    i.e., might have TimeDate.h declaration and TimeDate.cpp for implementation of
    functions, then Postmark.h and Postmark.cpp files that use TimeDate class


    +   - main() as the program start point


    +   - Still use { and } to delimit blocks


    +   - Same primitive data types


    +   - Same storage classes and scope rules


    +   - Same memory layout and addressing scheme


    +   - Functions still can''t be nested


    +   - Existing preprocessor features continue to work, but many uses of the preprocessor
    now do more elegantly in language itself


    +   - Some dangerous / useful C features still present:


    +   - no array bounds checking (but it''s possible to define a safe array type
    or class)'
  merge: -1
