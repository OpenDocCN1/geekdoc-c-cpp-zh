- pgno: 233
  md: "# Returning References\n\nThere are numerous reasons for functions to return\
    \ references:\n\nThe first common use for functions to return references is for\
    \ assignment operators:\n\n```\nclass Alpha {\n    public:\n    Alpha& operator=(const\
    \ Alpha&) {\n        ...\n        return *this;\n    }\n}\n```\n\nThe usual practice\
    \ is for such operators to return *this as a reference. This makes it possible\
    \ to chain assignments:\n\n```\nAlpha a1, a2, a3, a4;\n...\nal1 = a2 = a3 = a4;\n\
    ```\n\nThis is also possible if operator = returned an Alpha instead of an Alpha&:\n\
    \n```\nclass Alpha {\n    public:\n    Alpha operator=(const Alpha&) {\n     \
    \   ...\n        return *this;\n    }\n}\n```\n\nBut doing this would not be a\
    \ good idea. Such an assignment operator would always form a copy of the object\
    \ being assigned, even though that copy would eventually be thrown away."
  merge: -1
  img_proc: true
- pgno: 234
  md: "The second common use for functions that return references is to allow member\
    \ function calls to be chained easily.\n\nConsider a class Text whose objects\
    \ represent strings of text. Such objects might have an associated font, size,\
    \ etc.\n\n```\nclass Text {\npublic:\n    Text(const String&);\n    Text& setSize(int);\n\
    \    Text& setFont(const String&);\n\n};\n```\n\nIf the getSize() and setFont()\
    \ members each return *this as a reference, that allows expressions such as:\n\
    \n```\nt(\"The quick brown fox\");\nt.setSize(12).setFont(\"Arial\");\n```\n\n\
    Otherwise, it would be necessary to write:\n\n```\nt.setSize(12);\nt.setFont(\"\
    Arial\");\n```\n\nThe gain here seems relatively minor but we gain great advantage\
    \ with the extraction (<<) operator. By convention, it produces a human-readable\
    \ representation of an object. Its left operand is ostream and its right operand\
    \ is an object of the relevant type:\n\n```\ncout << \"x = \" << x << \", y =\
    \ \" << y << endl;\n```\n\nThis example works only because ostream::operator<<()\
    \ returns *this as a reference."
  merge: -1
  img_proc: true
- pgno: 235
  md: "Each call to operator << therefore passes on its left argument as its result\
    \ which becomes the left argument of the next call to operator <<. \nThe statement\
    \ is really interpreted as:\n\n```\n(((cout << \"x = \" << x << \", y = \" <<\
    \ y)) << endl;\n```\n\nIt's important for operator << to return an ofstream so\
    \ that several uses of it can be chained together. So for it to work, the value\
    \ of cout << must be a reference to cout!\n\nReferences become even more important\
    \ for input. Without them, it would be impossible for:\n\n```\ncin >> x;\n```\n\
    \nto change the value of x.\n\nFor this reason, the right argument of operator\
    \ >> is always a reference.\n\nUsually the functions we've seen tell us what value\
    \ will be returned. But now, by allowing a function to return a reference, the\
    \ function is allowed to be the target of an assignment, i.e., used as an lvalue\
    \ (on the left-hand side of an = sign).\n\nHere's a trivial example:\n\n```\n\
    int& foo(int &x) {\n  return x;\n}\n```\n\nThis function simply returns a reference\
    \ to its argument. We can now write:\n\n```\nint a;\nfoo(a) = 7;      // sets\
    \ a to 7\n```"
  merge: -1
  img_proc: true
- pgno: 236
  md: "# Another example:\n\n```\nint array[100];    // static storage\nint& getItem(int\
    \ index) {\n    return array[index];\n}\n\nint main() {\n    getItem(4) = 5; \
    \   // not allowed in C\n    return 0;\n}\n```\n\nThe function call is now an\
    \ lvalue array[4] is now = 5. Function getItem() will tell you at which location\
    \ a value will be assigned. For example, function getItem() returns a reference\
    \ to the element of the array index and sets it to 5.\n\nJust as passing arguments\
    \ by reference prevents unnecessary copying to the stack, which can return an\
    \ object by reference to avoid copying the returned object.\n\nCheck what happens\
    \ when you return an object by value. For example, suppose you return a String\
    \ object from a function addString() which returns the concatenation of two strings:\n\
    \n```\nString addString(const String& s1) {\n    String s;\n\n    // append s1\
    \ and s2 to a\n    ...\n    \n    return s;\n}\n```\n\nIn this case, the return\
    \ statement has to copy the String s to an area of memory provided by the calling\
    \ program. To do so properly, the return statement will call a special constructor,\
    \ the copy constructor, which can create and initialize a new instance of an object\
    \ from an existing one. After creating the copy, return calls the destructor of\
    \ the String class to destroy s before returning to the calling program. This\
    \ is a good example of work done behind the scenes by the C++ compiler."
  merge: -1
  img_proc: true
- pgno: 237
  md: "Although returning by reference would save the time spent in copying the object,\
    \ you cannot return a reference to String s because s is a temporary object that\
    \ exists only within the function add() and is destroyed when the function returns.\
    \ Note: because a reference is a pointer, you cannot return a reference to anything\
    \ that is temporary!! You should never return a reference to a local variable\
    \ the local variable will disappear as soon as the function returns and the reference\
    \ will lead nowhere. This is called a dangling reference. Be sure that if you\
    \ return a reference, it refers to an object that will still be around after the\
    \ function returns.\n\nNote that there is nothing wrong with returning a formal\
    \ parameter as a reference provided that the formal parameter is itself a reference.\
    \ For example:\n\n```\n// don't do this\nint& foo(int x) {\n    return x;\n}\n\
    \n// but this is OK\nint& foo(int& x) {\n    return x;\n}\n```\n\nHere the parameter\
    \ x is just an alternate name for something that existed before foo() was called\
    \ and will presumably exist after foo() has returned.\n\nThere would have been\
    \ no problem returning a reference to a global or static variable or to a formal\
    \ parameter that is itself a reference."
  merge: -1
