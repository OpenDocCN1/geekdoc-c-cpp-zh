  md: "# Overloading the Insertion << and Extraction >> Operators\n\nNormally, input\
    \ and output streams handle only simple data types (int, long, float, double,\
    \ char*, etc). By overloading the iostream input and output stream operators (>>,\
    \ <<) you can easily add your own classes to the data types that I/O statements\
    \ are designed to use.\n\nFor example, we can treat I/O for user-defined data\
    \ types in the same way as built-in data types. This is a powerful feature of\
    \ C++. It lets you say:\n\n```\nMyClass foo;\n  cout << foo;\n```\n\nThe operator<<()\
    \ function has already been overloaded for the iostream class, but you can easily\
    \ overload it for your new class. Let's overload the insertion and extraction\
    \ operators for the Distance class.\n\n```\nclass Distance {\nprivate:\n    int\
    \ feet;\n    float inches;\npublic:\n    Distance () { feet = 0; inches = 0; }\n\
    \    Distance (int ft, float in) {\n        feet = ft;\n        inches = in;\n\
    \    }\n    friend istream operator>>(istream& is, Distance& d);\n    friend ostream\
    \ operator<<(ostream& os, const Distance& d);\n}\n```\n\n```\nistream operator>>(istream&\
    \ is, Distance& d) {\n    cout << \"Enter feet: \"; is >> d.feet;\n    cout <<\
    \ \"Enter inches: \"; is >> d.inches;\n    return is;\n}\n```\n\n```\nostream&\
    \ operator<<(ostream& os, const Distance& d) {\n    os << d.feet << \" \\/\" <<\
    \ d.inches << \" \\/\"\n    return os;\n}\n```"
