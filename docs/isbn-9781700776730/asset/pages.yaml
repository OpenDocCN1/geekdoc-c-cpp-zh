  md: "because what you are trying to do now is put a smaller object (the base class)\
    \ into a larger object (the derived class). The compiler will not let you do this\
    \ automatically. We'll not worry about this at this time.\n\n# Pointers to Base\
    \ and Derived Class Instances\n\nAs we've already seen, pointers to base and derived\
    \ class instances can be declared just like any other type of pointer. In terms\
    \ of assignment, you can always assign a derived class pointer into a base class\
    \ pointer, because then the base class pointer (only) will be pointing to the\
    \ base class portion of the derived object.\n\n+   - A base class pointer can\
    \ always point to a base class instance,\n- A derived class pointer can always\
    \ point to a derived class instance.\n\nWhen a pointer of type Base or Derived\
    \ class is used to call a member function, and the function has been defined in\
    \ both the base and derived classes, there is no ambiguity as to which version\
    \ of the function will be called. The governing factor here is the type of the\
    \ pointer itself.\n\n```\nClass Base {\n  public:\n    void print() { cout <<\
    \ \"Base class print()\" << endl; }\n}\n\nclass Derived : public Base {\n  public:\n\
    \    void print() { cout << \"Derived class print()\" << endl; }\n}\n\nint main()\
    \ {\n  Base* pBase = new Base; // base class instance and pointer\n  Derived*\
    \ pDerived = new Derived; // derived class instance & pointer\n\n  pBase->print();\
    \ // calls Base::print()\n  pDerived->print(); // calls Derived::print()\n  pDerived->Base::print();\
    \ // calls Base::print()\n  delete pBase;\n  delete pDerived;\n  return 0;\n}\n\
    \noutput:\nBase class print\nDerived class print\nBase class print\n```"
  merge: -1
  img_proc: true
- pgno: 360
  md: "Note the call pBase->Derived::print() is not allowed.\n\nTwo pointers are declared\
    \ and each one used to call the print() function in its respective class. In addition,\
    \ the Derived class pointer may be used to call the print() function in the Base\
    \ class provided that the function name is qualified with the Base class name\
    \ using the scope resolution operator.\n\n# Base Class Pointer Pointing to a Derived\
    \ Class Object\n\nThings become a lot more interesting when a base class pointer\
    \ is used to store the address of a derived class object. This is no problem for\
    \ the compiler because the pointer is, in reality, just pointing to the base class\
    \ portion of the derived instance. (Remember a derived class instance always contains\
    \ a base class instance).\n\nNow suppose that the base pointer, which points to\
    \ a derived class object, is used to invoke a member function that is defined\
    \ in the Base class, and overridden in the Derived class. Which function will\
    \ be called?\n\nThe answer is that the member function of the Base class will\
    \ be used, even though the pointer may be pointing to a Derived class instance!\n\
    \nWhy?\n\nBecause the compiler will generate an offset address for the function\
    \ member at compilation time, even though the address of the instance stored in\
    \ the pointer may be changed at execution time. Therefore, the compiler must generate:\n\
    \n> “I know that the type of the pointer is base class so I will generate an address\
    \ relative to the start of some base class instance.”\n\nIf at execution time,\
    \ the instance to which the pointer points happens to be of type Derived class,\
    \ that’s too bad I will still call the function in the Base class and not the\
    \ overridden function that is in the derived class.\n\n```\nclass Base {\npublic:\n\
    \    void print() { cout << \"Base Class Print()\" << endl; }\n};\nclass Derived\
    \ : public Base {\npublic:\n    void print() { cout << \"Derived class Print()\"\
    \ << endl; }\n};\n```"
  merge: -1
  img_proc: true
- pgno: 361
  md: "```\nint main() {\n    Base* pBase = new Derived();\n    pBase->print(); //\
    \ calls Base::print\n    delete pBase;\n    return 0;\n}\n```\n\noutput:\nBase\
    \ class print()\n\nIf this result troubles you, then your instincts are correct,\
    \ because it serves no useful purpose to be \"locked\" into the base class world,\
    \ even though the base class pointer can legitimately point to a variety of derived\
    \ class objects.\n\nThis is especially troubling if you consider any kind of container\
    \ object, such as an array, linked list, queue, stack, tree, etc. that might hold\
    \ base class pointers as its data.\n\nFor example, suppose we are running a used\
    \ car lot and we have declared a base class Vehicle and derived multiple classes\
    \ from the Vehicle class (Lexus, Ford, BMW). So we've also created an array of\
    \ Base class pointers, i.e., pointers to Vehicle objects, and have initialized\
    \ each base class pointer to point to a dynamically created derived object (Lexus,\
    \ Ford, BMW). So our inventory consists of a collection of \"pointers\" to the\
    \ various cars on our lot. Someone then asks us to provide an inventory of all\
    \ the cars present. So we then proceed to scan the collection of pointers and\
    \ send some kind of identify yourself message to each car, rightfully expecting\
    \ that each car will identify itself in some unique fashion. Unfortunately, as\
    \ things now stand, the only type of response that we'll get back from all cars\
    \ is, in effect, I AM A VEHICLE. The message gets sent to the base class identify()\
    \ function and never reaches the identify() functions in the derived classes.\
    \ Not very useful!\n\nHow we are going to free ourselves from this situation is\
    \ the topic of polymorphism and virtual functions."
