  md: "# Overloading Unary Operators\n\nLet's start off by overloading a unary operator.\
    \ Unary operators act on only one operand (++, --, -).\n\nWe'll look at the Counter\
    \ class we previously defined. Objects of that class were incremented by calling\
    \ a member function:\n\n```\ncl1.incCount();\n```\n\nDid that do the job, but\
    \ the listing would have been more readable if we could have used the increment\
    \ operator ++ and simply said:\n\n```\n++cl;\n```\n\nHere's our newest version\
    \ of the Counter class, rewritten to use an overloaded increment variable:\n\n\
    ```\nclass Counter {\n  private:\n    int count;\n  public:\n    Counter() { count\
    \ = 0; }\n    int getCount() { return count; }\n    void operator++() { ++count;\
    \ }\n};\n\nint main() {\n  Counter cl1, cl2;\n  cout << \"c1 = \" << cl1.getCount()\
    \ << endl;\n  cout << \"c2 = \" << cl2.getCount() << endl;\n  ++cl1;\n  ++cl2;\n\
    \n  cout << \"c1 = \" << cl1.getCount() << endl;\n  cout << \"c2 = \" << cl2.getCount()\
    \ << endl;\n  return 0;\n}\n```"
