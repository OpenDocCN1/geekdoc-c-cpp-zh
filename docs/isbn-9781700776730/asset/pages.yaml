- pgno: 435
  md: '# Introduction to Templates


    Just as a class is a schematic for building objects, a template is a schematic
    for building functions and classes. They provide specifications for functions
    and classes, but not the actual implementation details.


    With templates, you can develop generic functions and classes that support the
    same operations but for different data types. You can write template functions
    that sort, search, and swap various data types. You can create template classes
    that model generic data structures, such as arrays, matrices, lists, trees, hash
    tables, and graphs.


    Templates can be used to implement data structures and algorithms that are largely
    independent of the type of the objects they operate on. For instance, a stack
    template might describe how to implement a stack of arbitrary objects. Once that
    template has been defined, users can write code that uses stacks of integers,
    stacks of strings, etc.


    The compiler will figure out which kinds of stacks have been used and automatically
    generate the implementations of those stack classes.'
  merge: -1
  img_proc: true
- pgno: 436
  md: '# Function Templates


    Function templates provide you with the capability to write a single function
    that is a skeleton, or template, for a family of functions. They provide a mechanism
    to create a generic function, a single function that can simultaneously support
    multiple data types for its parameter or parameters.


    In this function, at least one formal argument is generic. This function template
    becomes a real function with real types when and when it needs to be invoked.


    # But What''s Wrong with Function Overloading


    We''ve seen a great deal about how to overload functions in C++ and the benefits
    we may achieve from doing so.


    The chief advantage is that function overloading relieves someone who is using
    your functions from having to know about different names for various functions
    that essentially do the same task. Unfortunately, overloaded functions, while
    a vast improvement over what''s available in C aren''t the ultimate solution to
    the problem that is inherent when writing functions that are similar in their
    behavior.


    To see why, here''s a function called max( ) that returns the greater of its two
    input arguments:


    ```

    int max(int x, int y) { return x > y ? x : y; }

    long max(long x, long y) { return x > y ? x : y; }\double max(double x, double
    y) { return x > y ? x : y; }

    char max(char x, char y) { return x > y ? x : y; };

    ```


    We let C++''s overloaded feature sort out which function to call depending on
    the data type!


    Note, however, max( ) has to be continually overloaded in order to accommodate
    the various types of arguments that can conceivably be used to invoke it. That
    involves too much repetitive coding. Each function is doing essentially the same
    thing, returning the greater of its two arguments.'
  merge: -1
  img_proc: true
- pgno: 437
  md: "Instead of your having to write many similar max () functions, wouldn't it\
    \ be nice to just write one max () function that returns the greater of its two\
    \ arguments and can accommodate almost any type of argument?\n\n# Why Not Use\
    \ A Macro\n\nYou can write a macro to solve this problem but you lose the ability\
    \ to ensure that you are not comparing arguments of different types. For example,\
    \ if your intent is to guarantee that both arguments are the same type, then a\
    \ macro does not work:\n\n```\n#define max(x, y) ((x) > (y)) ? (x) : (y)\nint\
    \ main() {\n    cout << max(1, 2.98) << endl;\n    cout << max('A', 32) << endl;\n\
    \    cout << max(++a, b++) << endl;\n    return 0;\n}\n```\n\nThere is no type\
    \ checking here and the arguments could be evaluated twice when using prefix or\
    \ postfix notation.\n\n# Template Functions\n\nTemplate functions provide a mechanism\
    \ by which the programmer can take advantage of the compactness of the macro solution\
    \ without forfeiting any of the benefits of a strongly-typed language.\n\nA function\
    \ template solves the problem by allowing you to write just one function as a\
    \ skeleton, or template, for a family of functions whose tasks are all similar.\
    \ At the same time, full type checking is carried out.\n\nYou should consider\
    \ using a function template when you find yourself writing a sequence of identical,\
    \ overloaded functions. By using templates, you can define a pattern for a family\
    \ of related overloaded functions by letting the data type itself be a parameter!"
  merge: -1
  img_proc: true
- pgno: 438
  md: "```\ntemplate <class T>\nT max (T a, T b) {\n  return a > b ? a : b;\n}\n\n\
    int main() {\n  cout << max(15, 16) << endl;\n  cout << max('A', 'B') << endl;\n\
    \  return 0;\n}\n```\n\nThe template keyword indicates that a function template\
    \ is present. The T symbol is a placeholder symbol indicating that the compiler\
    \ can substitute the appropriate data type at compilation time.\n\nWhen the compiler\
    \ sees a template function, it stores the template code for future reference.\
    \ The template code itself is not compiled. To employ the template function, you\
    \ need to associate it with a data type. The compiler instantiates a copy of the\
    \ template function for the data type you specify.\n\nA template function is typically\
    \ declared in a header file:\n\n```\n// minmax.h\n\n#ifndef _MINMAX_H\n#define\
    \ _MINMAX_H\n\ntemplate <class T>\nT max (T a, T b) {\n  return a > b ? a : b;\n\
    }\n\ntemplate <class T>\nT min (T a, T b) {\n  return a < b ? a : b;\n}\n\n#endif\n\
    ```\n\nIn this example, template <class T> states that T is an unspecified type,\
    \ which a template function max() returns. In addition, max() and min() require\
    \ two arguments. The function's statements are schematics for the real statements\
    \ that are generated later when T's actual type is specified."
  merge: -1
  img_proc: true
- pgno: 439
  md: "```\nint main() {\n    int i1 = 100, i2 = 200;\n    double d1 = 3.14, d2 =\
    \ 9.876;\n    char c1 = 'A', c2 = 'z';\n\n    cout << max(i1, i2) << endl;\n \
    \   cout << max(d1, d2) << endl;\n    cout << max(c1, c2) << endl;\n    return\
    \ 0;\n}\n```\n\nEach max() function returns a different data type and requires\
    \ pairs of arguments of the same types. Keep in mind that you could also use more\
    \ than one placeholder. For example, you could declare max() with two different\
    \ possible types:\n\n```\ntemplate <class T1, class T2>\nT1 max(T1 a, T2 b);\n\
    ```\n\nThis returns a value of type T1 and requires two arguments, one of type\
    \ T1 and one of type T2."
