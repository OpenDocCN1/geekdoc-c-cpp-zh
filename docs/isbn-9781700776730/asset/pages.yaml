- pgno: 276
  md: "# Operator Overloading Lab (IntArray)\n\nThe array construct in C is very efficient\
    \ but also very dangerous for the unwise. For example, novice programmers fall\
    \ into the trap of declaring an array of 100 elements and then try to access the\
    \ element with index 100. Not only is this an error in C, but the language won't\
    \ alert the user when the mistake is made. C++ allows programmers to define safer\
    \ and more flexible array constructs if they are willing to sacrifice some of\
    \ C's runtime efficiency. The purpose of this lab is to see how this is done and\
    \ to gain experience in overloading operators.\n\nThe heart of this assignment\
    \ is to declare a class that will define IntArray. With it, the user will be able\
    \ to declare integer arrays of any size with automatic range checking of indices.\
    \ The upper and lower indices can be any integer, positive or negative, rather\
    \ than the fixed limits of 0 to SIZE-1. It will also be possible to assign arrays\
    \ to each other, compare two arrays for equality and inequality, add arrays, and\
    \ output arrays using the overloaded <<. For example:\n\n```\n#include <iostream>\n\
    #include \"IntArray.h\"\n\nusing namespace std;\n\nint main() {\n    IntArray\
    \ a(10), w(10);    // Ten elements, indexed 0 to 9\n    IntArray b(-3, 6);   \
    \   // Ten elements, indexed -3 to 6\n    IntArray c(6, 8);        // Three elements,\
    \ indexed 6 to 8\n    IntArray d(5, 5);        // Single element array, indexed\
    \ at 5\n    IntArray z;             // Ten elements, indexed 0 to 9\n\n    //\
    \ high() and low() return smallest and largest legal indices\n    for (int i =\
    \ a.low(); i <= a.high(); ++i)\n        a[i] = i * 10;      // Access just like\
    \ normal array\n\n    // Output array contents. Note that you will overload\n\
    \    // the << operator to do this.\n    cout << a << endl;\n\n    // The code\
    \ for the overloaded << operator will look\n    // something like this:\n    for\
    \ (int i = a.low(); i <= a.high(); ++i)\n        cout << \"a[\" << i << \"] =\
    \ \" << a[i] << \" \";\n\n```"
