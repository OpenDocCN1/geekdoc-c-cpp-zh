    \ int y);\n    char get(int x, int y) const;\n};\n```\n\nIn this case, the constness\
    \ of the class object determines which of the functions is involved:\n\n```\n\
    int main() {\n    const Screen sc;\n    Screen s;\n    char ch = sc.get(0, 0);\
    \ // const member\n    ch = s.get(0, 0); // non-const member\n}\n```"
