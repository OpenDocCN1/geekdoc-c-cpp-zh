- pgno: 211
  md: "# Friends\n\nOne of object-oriented programming's main gifts is the encapsulation\
    \ of data in classes. We've seen many examples of this data-hiding concept and\
    \ we've considered its benefits of reduced maintenance and easier debugging.\n\
    \nLike rules in life and programming, those of data-hiding may be broken. In C++,\
    \ you can break encapsulation's rules by using friends, although you do so at\
    \ some risk to your program's welfare. The friend mechanism gives non-members\
    \ of the class access to the private members of the class.\n\nC++ classes declare\
    \ two kinds of friends:\n\n+   * An entire class may be a friend of another class.\n\
    * A single function may be declared as a friend.\n\nIf friends have a counterpart\
    \ in other languages, it's the goto statement. Like goto, a friend enables you\
    \ to break the rules intended to help you write reliable code. Don't interpret\
    \ the following as an endorsement of friends. Top C++ programmers avoid using\
    \ friends unless absolutely necessary. Needless to say, the use of friend functions\
    \ in C++ is controversial.\n\n# Friend Classes\n\nA class may declare another\
    \ class as a friend. The first class (the one that declares the friend) gives\
    \ another class (the friend) permission to access all private members of the first\
    \ class. Note that public members are always accessible, so you don't need to\
    \ declare a class to friend to give it access to public members.\n\nTypically,\
    \ friend classes are used when two unrelated classes require access to the class's\
    \ private parts. For example:\n\n```\nclass Alpha {\n  private:\n    double value;\n\
    \  public:\n    Alpha() { value = 3.14159; }\n};\n```"
  merge: -1
  img_proc: true
- pgno: 212
  md: "Now, suppose you declare another class that contains an object of Alpha as\
    \ a data member:\n\n```\nclass Beta {\nprivate:\n    Alpha anObject;\npublic:\n\
    \    void show() {\n        cout << anObject.value;\n    }\n}\n```\n\nMember anObject\
    \ of type Alpha is private to Beta. Member function show() attempts to display\
    \ anObject value. However, the declaration doesn't compile because value is private\
    \ to Alpha, and only member functions in Alpha may access value.\n\nThe solution\
    \ is to make Beta class a friend of the Alpha class. Objects of the Beta class\
    \ can then access value and any other private members of class Alpha. But statements\
    \ outside the two classes are still prevented from entering Alpha's restricted\
    \ areas. To make this change, use the friend keyword inside the class to which\
    \ the other class needs access. For example:\n\n```\nclass Alpha {\nprivate:\n\
    \    double value;\npublic:\n    Alpha() { value = 3.14159; }\n    friend class\
    \ Beta; // Beta is a friend of Alpha\n}\n```\n\nHere, class Beta must access the\
    \ private value member inside class Alpha. So to give class Beta permission to\
    \ use that private data, class Alpha can declare class Beta as a friend. Now,\
    \ Beta has access to Alpha's members.\n\nNote that other statements in other classes\
    \ and in the main() program still can't use Alpha's private declarations. In this\
    \ manner, you may declare any number of classes as friends. The only restriction\
    \ is that the friend keyword must appear inside a class declaration."
  merge: -1
  img_proc: true
- pgno: 213
  md: 'Note the following:


    +   - A class must name all of its friends in class advance


    +   - The class containing the private data is the one that declares another class
    to be a friend, thus giving that friend special access to the normally hidden
    members of the declaring class. A class can never declare itself to be a friend
    of another class.


    +   - The friend class may be declared before or after the class that declares
    the friend. The order of the declarations is unimportant, but the friend class
    is typically declared last so the friend''s inline member functions can refer
    to the other class''s private parts.


    # Friend Functions


    A friend function is similar to a friend class. Declaring a function as a friend
    of a class gives that function access to private members in class objects. The
    friend function may be a common C++ function or a class member function.


    A friend function declares parameters of classes to which the function owes its
    friendship, which gives the friend function access to the private members of the
    class objects.


    A friend function has the same access privileges as a member function, but isn''t
    associated with an object of the host class.


    The host class has control over granting friend privileges to other functions,
    you always know who has the ability to change your private data.


    There are times when the program design just won''t work out right. You can''t
    always make everything fit neatly into one class. Sometimes other functions must
    have access to private elements of your class for everything to work together
    harmoniously. You could make some elements public, but this is a bad idea unless
    you really want the client programmer to change the data.'
