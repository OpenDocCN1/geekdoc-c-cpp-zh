  md: '# Assignment Operators vs Copy Constructors


    Assignment operators and copy constructors have a lot of logic in common. However,
    here are three main differences:


    +   - the assignment operator must work correctly when an object is assigned to
    itself


    +   - each call to the assignment operator overwrites an existing value. If that
    value was using resources external to the object, those resources may have to
    be freed.


    +   - the assignment operator can return a value.'
