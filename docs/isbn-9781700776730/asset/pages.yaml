- pgno: 15
  md: '# BigInt Library Function Prototypes


    BigInt *itob(int n);

    creates a new BigInt initialized to the value of the (small) integer n, and returns

    pointer to the newly created BigInt


    void badd(BigInt *a, BigInt *b, BigInt *c);

    adds the BigInts pointed to by a and b returns their sum in the BigInt

    pointed to by c


    void bmult(BigInt *a, BigInt *b, BigInt *c);

    multplies the BigInts pointed to by a and b and returns their product in the

    BigInt pointed to by c


    void bout(BigInt *a);

    prints the BigInt pointed to by a


    void bfree(BigInt *a);

    frees the BigInt pointed to by a


    # Convert Big Integer Constant to BigInt


    To use the BigInt library to solve our problem, we must write a function to

    convert an integer constant into a BigInt since the library does not provide a

    way to do this.


    The function prototype:


    ```

    BigInt *dtob(char *d);

    ```


    takes a big integer written as a character string constant, and converts it into
    a

    BigInt one digit at a time.'
  merge: -1
  img_proc: true
- pgno: 16
  md: "# Implementation of dtob() Function\n\n```\n#include <BigInt.h>\n\nBigInt *dtob(char\
    \ *d) {\n  BigInt *t, *ten;\n\n  t = itob(0);\n  ten = itob(10);\n  while(*d)\
    \ {\n    BigInt *u;\n    u = itob(*d++) - '0';\n    bmult(t, ten, t);\n    badd(t,\
    \ u, t);\n    bfree(u);\n  }\n  bfree(ten);\n  return t;\n}\n```\n\n# C Program\
    \ Using BigInt Library\n\n```\n#include <BigInt.h>\n\nBigInt *dtob(char *d);\n\
    \nint main(void) {\n  BigInt *a, *b, *c, *t;\n\n  a = dtob(\"12345678901234\"\
    );\n  b = dtob(\"24680135792356\");\\n  c = itob(0);\n  t = itob(300);\n  badd(a,\
    \ b, c);\n  badd(c, t, c);\n  bout(c);\n  printf(\"\\n\");\n  bfree(a);\n  bfree(b);\n\
    \  bfree(c);\n  bfree(t);\n}\n```"
  merge: -1
