    \ it. If not, generate a compilation error.\n- Does the member function have scope\
    \ higher up in the hierarchy? If so, use it. If not, generate a compilation error.\n\
    \nNote that functions with the same name at file scope are not considered.\n\n\
    Similarly, a function in a derived class resolves the address of a data member\
    \ by asking:\n\n+   - Does the data member have scope in the function class itself?\
    \ If so, use it. If not, generate a compilation error.\n- Does the data member\
    \ have derived class scope? If so, use it. If not, generate a compilation error."
