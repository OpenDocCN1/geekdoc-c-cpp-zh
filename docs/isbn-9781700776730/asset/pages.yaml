- pgno: 383
  md: '# Introduction to Polymorphism


    For any computer language to call itself an object-oriented programming language,
    it must contain three essential components:


    +   - Data Abstraction and Encapsulation


    This is the process of defining some new data type or class. This involves specifying
    the internal representation of that type along with the functions used to manipulate
    the type. C++ supports data abstraction and encapsulation through the class mechanism.


    +   - Inheritance


    Inheritance involves the creation of a new type from an existing type in some
    hierarchical fashion. C++ supports inheritance through class derivation.


    +   - Polymorphism and Dynamic Binding


    Polymorphism comes from the Greek words: poly, or many, and morphos, or form.
    It refers to the quality of having more than one form, of having many shapes.
    In the context of object-oriented programming, polymorphism describes the capability
    of C++ code of behaving differently depending on runtime situations. It refers
    to the ability to have different objects derived from a common class respond to
    the same message differently. A single operation can have different behavior in
    objects. C++ supports polymorphism and dynamic binding through virtual functions.'
  merge: -1
  img_proc: true
- pgno: 384
  md: '# Static and Dynamic Binding


    In most traditional programming languages the compiler calls fixed function identifiers
    based on the source code. The linker then takes these identifiers and replaces
    them with a physical address.


    This is called early or static binding because function identifiers are associated
    with physical addresses before runtime during the process of compilation and linkage.
    The problem with early binding is that the programmer must predict what objects
    will be used in all function calls in every situation. This is not only limiting,
    but its sometimes impossible.


    The best thing about early binding is that it is fast. The only runtime overhead
    incurred is in:


    +   * passing arguments

    * performing a function call

    * and cleaning up the stack


    In C++, a polymorphic function can become associated with one of many possible
    functions only when an actual object is passed to the polymorphic function. In
    other words, the source code itself doesn''t always tell you how a section of
    code is going to execute. A function call is only indicated in the source code
    without specifying the exact function to call. This is called late or dynamic
    binding.


    The problem with late binding is its runtime efficiency. The code itself must
    deduce at runtime which function to invoke, and then invoke it. Some languages
    such as Smalltalk use late binding exclusively, which results in a powerful language
    but one that suffers from certain speed penalties. On the other hand, ANSI C uses
    early binding exclusively, resulting in high speed but a lack of flexibility.'
  merge: -1
  img_proc: true
- pgno: 385
  md: 'C++ makes polymorphism possible with the application of a rule we''ve seen
    before:


    ![](img/88ecbb96455b36fdc78e686bde4f5234_385_0.png)


    A base class pointer may address objects of the base class or of any derived class.
    However, this rule is a one-way street. A pointer to a derived class object may
    not address an object of a base class.


    Recall, however, that this presented some difficulties. When we used pointers
    of type Base class, the only member function (or data) that could be referenced
    were those belonging to the Base class, even if this pointer pointed to a Derived
    class object!


    This is not polymorphism because the object being pointed at never received the
    message being sent! The reason is that the compiler only knows about the type
    of the pointer itself, and nothing about the object that the pointer eventually
    point to during execution time.


    The goal of an object-oriented programming language is to send a message to whatever
    object happens to be pointed at by the pointer, as opposed to the type of the
    pointer itself.


    Why is this important? Because you can control the content (or address) of the
    pointer at execution time, whereas the type of the pointer variable itself cannot
    be changed once it is hard-coded. In this fashion, the object itself can “figure
    out” what to do with the message and thereby implement the concept of polymorphism.'
  merge: -1
  img_proc: true
