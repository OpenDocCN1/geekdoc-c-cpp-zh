  md: "Note that only one explicit argument is needed because the this pointer is\
    \ provided.\n\n# Another String Example\n\nSuppose we have a String class that\
    \ represents strings of different lengths and we wish to provide bounds-checking\
    \ for array subscribing operations on the strings.\n\nIn our example, we'll support\
    \ strings that are statically allocated and can hold a maximum of 255 characters:\n\
    \n```\n#include <iostream>\n\nusing namespace std;\nconst int SIZE = 255;\n\n\
    int main() {\n    String255 a(10);\n    char c;\n    a[5] = 17;              \
    \ // a.operator[](5) = 17;\n    c = a[7];               // c = a.operator[](7);\n\
    \    c = a[26];              // c = a.operator[](26); error\n    return 0;\n}\n\
    \nclass String255 {\nprivate:\n    char buf[SIZE];            // maximum size\n\
    \    int size;                  // actual size\npublic:\n    String255(int num)\
    \ { size = num; }\n    char& operator[](int i);\n};\n\nchar& String255::operator[](int\
    \ i) {\n    if (i < 0 || i >= SIZE) {\n        cout << \"subscript out of bounds\"\
    \ << endl;\n        exit(1);\n    } else {\n        return buf[i];         //\
    \ the normal [] operator used here\n    }\n```"
