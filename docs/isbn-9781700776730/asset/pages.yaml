  md: '# Function Overloading


    ```

    char, char*, int, double

    ```


    In C, you might come up with something like this:


    ```

    void print(int);

    void printChar(char);

    void printString(char*);

    void printDouble(double);

    ```


    Although it''s the same concept, printing, you must create a different name for

    each implementation of the concept. Not only must you create these names,

    must explain them to the user of your library.


    Now suppose the user has mastered this group of print functions and then

    decides to use another library that has a way to print an Elevator object:


    ```

    void print(struct Elevator);

    ```


    If the function declarations are all made in the same file, the C compiler will
    give

    an error message about a type mismatch in the redeclaration of print(). If the

    coliding declarations are not made in the same file, the C compiler will not catch

    the error. However, the linker will detect a multiple definition error.


    To solve the problem of name collisions between libraries in C, library authors

    must not only create function with different names to differentiate the type of

    arguments, but libraries must also be differentiated from one another:


    ```

    void abcLibPrint(int);

    void abcLibPrintChar(char);

    void abcLibPrintString(char*);

    void abcLibPrintDouble(double);

    void defLibPrint(struct Elevator);

    ```'
