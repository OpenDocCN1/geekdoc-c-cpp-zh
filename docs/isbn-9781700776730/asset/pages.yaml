- pgno: 296
  md: "Note that these assignment statements are for illustration purposes only.\n\
    Because the class data members are private, these statements do not compile.\n\
    Memberwise initialization of a new class object occurs in three contexts:\n\n\
    +   - when an object is used to initialize a newly constructed object, i.e.,\n\
    part of a declaration\n\n+   - when passing an object to a function by value\n\
    \n+   - when a function returns a class object\n\nIf any of these actions cause\
    \ a pointer data member to be duplicated, a serious\nbug might arise!\n\nLet's\
    \ redefine class Alpha to include a pointer data member:\n\n```\n#include <string.h>\n\
    class Alpha {\nprivate:\n    char *buf;\n    int length;\npublic:\n    Alpha();\
    \ // default constructor\n    Alpha(char *); // constructor accepts null-terminated\n\
    \    Alpha(const char *) // array and creates an Alpha object from it\n    ~Alpha();\n\
    };\n\nAlpha::Alpha() {\n    length = 100;\n    buf = new char[length + 1];\n \
    \   buf[0] = '\\0';\n}\n\nAlpha::Alpha(char *s) {\n    length = strlen(s);\n \
    \   buf = new char[length + 1];\n    strcpy(buf, s);\n}\n\nAlpha::~Alpha() {\n\
    \    delete [] buf;\n}\n```"
