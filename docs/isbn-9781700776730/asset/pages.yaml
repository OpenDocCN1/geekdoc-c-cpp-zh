- pgno: 224
  md: "Unlike a pointer that can be declared in an uninitialized state, or set to\
    \ NULL if the pointer does not address valid data, a reference must always refer\
    \ to an object. There is no equivalent of a NULL pointer for a reference.\n\n\
    References do not have to be pre-initialized in four special cases:\n\n+   * when\
    \ declared extern\n* when used as function-arguments\n* when used as function\
    \ return types\n* in class declarations\n\nSome examples:\n\n```\nint& - _reference\
    \ to an int\nint*& - reference to a pointer to an int\n\nint a[10];\nint& last\
    \ = a[9]; // last is an alias for a[9];\n```\n\nOften the reason for giving an\
    \ object name is that it doesn't already have one. This example attaches the name\
    \ last to the last element of the array a. One might do this if one were about\
    \ to use a[9] several times. Using a reference would save program text and might\
    \ save computation time as well.\n\n# Reference to a Reference\n\nIf a reference\
    \ variable is an alias for another reference variable, it really refers to the\
    \ variable for which the first reference variable is alias. For example, the two\
    \ reference variables are aliases for the same variable in memory.\n\n```\nint\
    \ num1 = 1;\nint& num2 = num1; // num2 is an alias for num1\nint& num3 = num2;\
    \ // num3 is an alias for num2 which\n    // really means that num3 is an alias\n\
    \    // alias for num1\n```\n\n# Address of a Reference Variable\n\nWe can show\
    \ that reference variables are not separate entities in memory with their own\
    \ addresses. If you take the address of a reference variable, all you will get\
    \ the address of the variable for which it is an alias."
  merge: -1
  img_proc: true
- pgno: 225
  md: "For example:\n\n```\n#include <cstdio>\n\nint main() {\n    int num1;\n   \
    \ int& num2 = num1;\n    printf(\"%p  %p\", &num1, &num2); // FFFFFFFF FFFFFFFF\n\
    \    return 0;\n}\n```\n\nTherefore a reference variable does not have its own\
    \ unique address.\n\n# Reference Variables are Useless!\n\nFinally, reference\
    \ variables are generally useless!!!\n\nIf you already have a variable, all reference\
    \ to the variable will provide is complexity. Now you'll have two ways of changing\
    \ the same variable. You'll gain nothing from reference variables. It's messy\
    \ as it sounds and you should think hard before you decide you must use a reference\
    \ variable.\n\nReferences were really designed for argument passing and return\
    \ values and reference variables were only included for syntactic completeness,\
    \ not necessarily because they were a good idea. References are usually necessary\
    \ only in the context of a user-defined class type."
