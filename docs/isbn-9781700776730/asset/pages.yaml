  md: "In many situations you get equivalent results by using either a friend function\
    \ or a member function when you overload an operator. A friend function simply\
    \ contains an extra argument. The friend function must have both objects passed\
    \ to it, while the member function only needs a single argument. However, sometimes\
    \ friend functions are too convenient to avoid. One example is when friends are\
    \ used to increase the versatility of overloaded operators.\n\nFor example, the\
    \ program below shows a limitation in the use of overloaded operators when friends\
    \ are not used:\n\n```\n#include <iostream.h>\n\nclass Distance {\nprivate:\n\
    \    int feet;\n    float inches;\npublic:\n    Distance() { // default constructor\n\
    \    feet = 0;\n    inches = 0.0;\n}\n    Distance(float fFeet) { // conversion\
    \ constructor\n    int = int(fFeet); // feet is integer part\n    inches = 12\
    \ * (fFeet - feet); // feet is what's left\n}\n    Distance(int ft, float in)\
    \ {\n    feet = ft;\n    inches = in;\n}\n    void showDist() {\n    cout << feet\
    \ << \"\\\"-\" << inches << \"\\\"\";\n}\n    Distance operator+(Distance d);\n\
    };\n\nDistance Distance::operator+(Distance d) {\nint ft = feet + d.feet;\nfloat\
    \ in = inches + d.inches;\nif (in >= 12.0) {\n    in -= 12.0;\n    ++ft;\n}\n\
    return Distance(ft, in);\n};\n```\n\nDistance Distance::operator+(Distance d)\
    \ {\nint ft = feet + d.feet;\nfloat in = inches + d.inches;\nif (in >= 12.0) {\n\
    \    in -= 12.0;\n    ++ft;\n}\nreturn Distance(ft, in);\n};"
