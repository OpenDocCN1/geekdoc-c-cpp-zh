- pgno: 226
  md: "# Reference Arguments\n\nThe declaration of reference variables up to now has\
    \ not really served a very useful purpose. After all, if a variable and an alias\
    \ for that variable are both defined within the same scope, then why bother to\
    \ use the alias? Why not just use the name of the variable itself?\n\nThe real\
    \ usefulness of a reference variable occurs when it is created in a scope that\
    \ is different from the scope of the variable for which it has an alias.\n\nFor\
    \ example, a function sets up a new scope whenever it is created. If a reference\
    \ variable is used as a formal parameter, then it merely becomes an alias for\
    \ the corresponding actual parameter or argument to the function call. This means\
    \ that whenever the formal parameter is used within the body of the function,\
    \ the actual parameter in the calling function is the one that is really manipulated\n\
    \n# Simulate Call By Reference\n\n```\nvoid swap(int *a, int *b) {\n    int temp\
    \ = *a;\n    *a = *b;\n    *b = temp;\n}\n\nint main() {\n    int x = 4, y = 6;\n\
    \    swap(&x, &y);\n    return 0;\n}\n```\n\nThe swap() function:\n\n+   - declares\
    \ the function parameter to be a pointer\n- uses the dereferenced pointer in the\
    \ function body\n- passes an address as an argument when the function is called"
  merge: -1
  img_proc: true
- pgno: 227
  md: "# Call By Reference\n\n```\nvoid swap(int& a, int& b) {\n    int temp = a;\n\
    \    int a = b;\n    b = temp;\n}\n\nint main() {\n    int x = 4, y = 6;\n   \
    \ swap(x, y);\n    return 0;\n}\n```\n\nNote that there is no need to dereference\
    \ a and b. They are automatically dereferenced for us!\n\n# Reference Arguments\n\
    \nBehind the scenes, all references are translated to pointers according to the\
    \ following two rules:\n\n+   * whenever a reference variable p is used, replace\
    \ p by *p\n* whenever a reference variable is initialized with a, replace a by\
    \ &a\n\nThe machine code that's generated is exactly the same. We don't have to\
    \ manually generate the address of a variable. We don't have to create a pointer\
    \ variable in which to receive the address. This allows the programmer, not the\
    \ user, to take responsibility for the way the arguments are passed to functions.\
    \ A reference in C++ is like a pointer because it contains an address, and like\
    \ an ordinary variable you don't have to dereference it.\n\n# Constant Reference\
    \ Parameters\n\nReference parameters that are used to prevent argument copying\
    \ (pass by value) and are not intended to change arguments can be declared const\
    \ to ensure that they do not.\n\nFor example:\n\n```\nint foo(const bigStruct\
    \ &bs);\n```"
  merge: -1
  img_proc: true
- pgno: 228
  md: "This gives you the best of both worlds:\n\n+   * you can pass arguments efficiently\n\
    * you don't have to worry about an argument being changed accidentally\n\nThe\
    \ `const` prevents the actual parameters from being altered within the function.\n\
    \nIs it always advantageous to use a pass-by-reference instead of pass-by-value?\
    \ No. It's just as efficient to pass the actual value of a primitive type as it\
    \ is to create an alias in the function. When a primitive variable needs to be\
    \ used in a function, and no changes needs to be made to that variable, pass it\
    \ by value.\n\n# Inexact Matches Between Actual and Formal Parameters\n\nConsider\
    \ the following example:\n\n```\nint main() {\n    int num = 1;\n    foo(num);\n\
    \    cout << \"num = \" << num << endl;\n    return 0;\n}\n\nvoid foo(float& val)\
    \ {\n    ++val;\n    cout << \"val = \" << val << endl;\n}\n```\n\noutput:\nval\
    \ = 2.00\nnum = 1\n\n# Huh???\n\nInteger num is being passed by reference into\
    \ function foo(), but is received as a reference-to-float, not a reference-to-int.\
    \ Some compilers will give you a warning message that you may not get the correct\
    \ results while others will give a fatal error.\n\nNote that the value of num\
    \ did not get changed by the function. In order to pass an argument by reference\
    \ and have the function modify the actual value, there can be no temporary variables\
    \ created in the process."
  merge: -1
  img_proc: true
- pgno: 229
  md: "For example, if you pass an int by reference and create a float reference to\
    \ it, then the compiler will convert the int into a temporary float variable and\
    \ then make the reference to this float via the formal argument. Therefore, if\
    \ you attempt to modify this float, you would only be modifying the temporary\
    \ float instead of the actual int argument itself.\n\n# Avoiding a Double Reference\
    \ by Using Reference Variables\n\nSometimes in C the address of a pointer variable\
    \ needs to be passed into a function. In this case the function argument needs\
    \ to be declared as a pointer to a pointer in order to access the original variable\
    \ that was being pointed at in the first place.\n\nFor example:\n\n```\nint main()\
    \ {\n    char *ptr;\n    foo(&ptr);\n    cout << \"ptr\" = \" << ptr << endl;\n\
    \    return 0;\n}\n```\n\n```\nvoid foo(char **pptr) {\n    *pptr = \"Hello C++\"\
    ;\n}\n```\n\n```\noutput:\nptr = Hello C++\n```\n\nA better solution is to create\
    \ a reference variable for this pointer. For example, since the type of the pointer\
    \ variable ptr is char*, then a reference to it would be type char&. Therefore,\
    \ in order to use the actual value of the variable ptr from within the function,\
    \ no dereferences are required:\n\n```\nint main() {\n    char *ptr;\n    foo(ptr);\n\
    \    cout << \"ptr\" = \" << ptr << endl;\n    return 0;\n}\n```"
