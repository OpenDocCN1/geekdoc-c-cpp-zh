    ```\n\nNote the two preprocessor commands would prevent the Time3 class header\
    \ file from being included more than once in a program. Storing the Time3 class\
    \ in a header file makes the class directly readable to all other modules.\n\n\
    Note that the program directly references no class data members. In all cases,\
    \ the program calls member functions to perform actions on the appt object."
