  md: "# Class Function Members\n\nClass member functions such as display() are declared\
    \ as function prototypes. The actual function statements are provided at another\
    \ place in the program.\n\nLet's look at the implementation of the member function\
    \ display():\n\n```\nvoid Timel::display() {\n  cout << (month < 10 ? \"0\" :\
    \ \"\") << month << \"/\\n  << (day < 10 ? \"0\" : \"\") << day << \"/\\n  <<\
    \ year << \":\";\n  cout << (hour == 0 ? \"02\" : 12 : hour % 12) << \":\"\n \
    \ << (min < 10 ? \"0\" : \"\") << min << \":\"\n  << (sec < 10 ? \"0\" : \"\"\
    ) << sec\n  << (hour < 12 ? \"AM\" : \"PM\") << endl;\n}\n```\n\nThere are two\
    \ main differences between the implementation of a member function and the implementation\
    \ of a common function:\n\n+   - The member function name is prefixed by the class\
    \ name and the scope resolution operator (::). This tells the compiler that display()\
    \ is a member of the Timel class. Because the class name uniquely qualifies the\
    \ member function's name, the program may have other functions and other class\
    \ member functions named display() without conflicts.\n- Inside the member function,\
    \ statements have direct access to the class's members without the need for pointers\
    \ or ever parameter passing."
