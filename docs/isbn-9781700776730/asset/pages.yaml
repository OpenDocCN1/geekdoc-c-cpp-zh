- pgno: 215
  md: "Friend functions are not scoped within the class but have the same scope as\
    \ any normal function declared in C++. However, these functions have access to\
    \ all access regions of the class just like member functions.\n\nA big difference\
    \ between member functions and friend functions is how the function gets the address\
    \ of the object it will read from or write to. In friend functions, we must explicitly\
    \ pass the object of interest or a reference to the object. We will see this with\
    \ operator overloading.\n\nNote the keyword `friend` is with the function declaration\
    \ within the class but not with the function definition. Only a class can say\
    \ who its friends are. If any function could declare itself a friend of a particular\
    \ class, that function could access the private data without going through the\
    \ class interface.\n\n# Friend Member Functions\n\nA member function of one class\
    \ can be a friend of another class. For example, a class can declare a member\
    \ function of another class as a friend. The friend member function can access\
    \ the declaring class's private members.\n\n```\n#include <iostream>\n\nusing\
    \ namespace std;\n\nclass Beta {\nprivate:\n    char* s2;\npublic:\n    Beta()\
    \ {\n        s2 = new char(strlen(\"one, two, three\")+1);\n        strcpy(s2,\
    \ \"one, two, three\");\n    }\n    void show(Alpha a);\n};\n\nclass Alpha {\n\
    private:\n    char *s1;\npublic:\n    Alpha() {\n        s1 = new char(strlen(\"\
    Testing\")+1);\n        strcpy(s1, \"Testing\");\n    }\n    friend void Beta::show(Alpha\
    \ a);\n}\n```"
