- pgno: 440
  md: "# Class Templates\n\nYou already know classes can help you reuse code and recycle\
    \ your code\nfor more efficient programming. Templates raise the level of abstraction\
    \ one level\nen enable you to automatically create individual classes that work\
    \ with different\ntypes of data.\n\nClasses are even more powerful than template\
    \ functions! You can use\na template to create one class definition to describe\
    \ a class that works with\nintegers, a class that works with characters, and a\
    \ class that works with floats, all\nwithin one class definition and without writing\
    \ any new code.\n\nA class template specifies how individual classes can be constructed,\
    \ much as a\na class declaration specifies how individual objects can be constructed.\n\
    \nFor example, a user typically needs a vector of elements of some type unknown\n\
    to the writer of the vector class. Therefore the vector class should be expressed\n\
    in such a way that it takes the element type as an argument.\n\n```\n // vector1.cpp\n\
    \nvoid error(char *);\n\nclass String {};\nclass Distance {};\n\ntemplate <class\
    \ T>\nclass Vector {\nprivate:\n    T *v;\n    int size;\npublic:\n    Vector(int\
    \ s) {\n        if (s <= 0)\n            error(\"Bad vector size.\");\n      \
    \  size = s;\n        v = new T[size]; // allocate an array of s T's\n    }\n\
    \    ~Vector() { delete v; }\n    int getsize() { return size; }\n    T& operator[](int\
    \ i) { return v[i]; }\n};\n```"
  merge: -1
  img_proc: true
- pgno: 441
  md: "The template <class T> prefix to the otherwise class declaration specifies\
    \ that a template requires a type argument to be being declared. This defines\
    \ a class template that is a specification of how to make a family of related\
    \ classes. In this case, the vector template specifies how the vector classes\
    \ can be made for individual element types.\n\nVectors of specified types can\
    \ be defined and used:\n\n```\nint main() {\n    Vector<int> v1(100); // generate\
    \ a vector of 100 ints\n    Vector<char> v2(200); // generate a vector of 200\
    \ chars\n    Vector<char> v3(300); // generate a vector of 300 char *\n    Vector<String>\
    \ v4(400); // generate a vector of 400 objects\n                             //\
    \ of the String class\n    Vector<Distance> v5(500); // generate a vector of 500\
    \ objects\n                             // of the Distance class\n\n    return\
    \ 0;\n}\n```\n\nNote that there is no run-time overhead compared with a class\
    \ where all types involved are specified directly.\n\n# Class Template for the\
    \ Stack Class\n\n```\n// stack1.cpp\ntemplate <class T>\nclass Stack {\nprivate:\n\
    \    int size;\n    int top;\n    T *s;\npublic:\n    Stack(int max = 100);\n\
    \    ~Stack();\n    void push(T);\n    T pop();\n    T Top();\n    int empty();\n\
    \    int full();\n    void clear();\n};\n```"
  merge: -1
  img_proc: true
- pgno: 442
  md: "```\ntemplate <class T>\nStack<T>::Stack(int max) {\n  size = max;\n  top =\
    \ -1;\n  s = new T[size];\n}\n```\n\n```\ntemplate <class T>\nStack<T>::~Stack()\
    \ {\n  delete s[];\n}\n```\n\n```\ntemplate <class T>\nvoid Stack<T>::push(T d)\
    \ {\n  s[++top] = d;\n}\n```\n\n```\ntemplate <class T>\nTStack<T>::pop() {\n\
    \  return s[top--];\n}\n```\n\n```\ntemplate <class T>\nTStack<T>::top() {\n \
    \ return s[top];\n}\n```\n\n```\ntemplate <class T>\nint Stack<T>::empty() {\n\
    \  return top == -1;\n}\n```\n\n```\ntemplate <class T>\nint Stack<T>::full()\
    \ {\n  return top == size-1;\n}\n```\n\n```\ntemplate <class T>\nvoid Stack<T>::clear()\
    \ {\n  top = -1;\n}\n```\n\nThe Stack class template defines a family of classes\
    \ when the Stack template is used to declare an object. Note that a type must\
    \ be supplied to occupy the place of the dummy type T in the template declaration."
