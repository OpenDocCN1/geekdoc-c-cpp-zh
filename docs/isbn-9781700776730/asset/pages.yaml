- pgno: 155
  md: '+   - you don''t get the side effects that can occur with macros


    In fact, there''s almost no place a preprocessor macro is used that an `inline`
    isn''t better. The `inline` function gives you the efficiency of preprocessor
    macro combined with the error checking of ordinary functions.


    Because an `inline` function duplicates the code for every function call, you
    might think it automatically increases code space. But for small functions (which
    inlines were designed for), this isn''t necessarily true! Keep in mind that a
    function call requires code to pass arguments, make the call, and handle the return
    value. This code isn''t present for an `inline` function.


    If your `inline` function turns out to be smaller than the amount of code necessary
    for the ordinary call, you are actually saving space. In addition, if the `inline`
    function is never called, no code is ever generated. With an ordinary function,
    code for that function is there (only once) whether you call it or not.


    The speed benefit of `inline` functions tend to diminish as the function grows
    in size. At some point, the overhead of the function call becomes small compared
    to the execution of the function body, and the benefit is lost.'
  merge: -1
  img_proc: true
