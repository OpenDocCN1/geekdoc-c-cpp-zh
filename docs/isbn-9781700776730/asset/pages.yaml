- pgno: 389
  md: "As far as C++ knows, bptr addresses a Base class object. Therefore, C++ calls\
    \ the getValue() member function in the Base class! The C++ rule is that it's\
    \ the type of the pointer itself that determines which function gets invoked.\
    \ The type of the object being pointed to is never even taken into account!\n\n\
    # Virtual Functions\n\nBut we really want C++ to call the getValue() member function\
    \ for the Derived object that pointer addresses. In order for this to happen,\
    \ we must declare getValue() as a virtual member function. Calls to virtual functions\
    \ are linked at runtime (late binding). Virtual member functions and late binding\
    \ make it possible for objects to determine their own behavior at runtime, which\
    \ is the chief characteristic of polymorphism. In terms of C++, what is needed\
    \ a method to delay the choice of which member function gets executed until execution\
    \ time.\n\nHaving such a method would imply that by using a single pointer and\
    \ member function name, the same function can be sent to the object that has its\
    \ address in the pointer. These objects implement the same member function differently,\
    \ then different results can be obtained! Such a method is called late or dynamic\
    \ binding because the decision as to which member function to invoke is no longer\
    \ made at compile time but is made at runtime. The C++ rule is as follows:\n\n\
    > “If a function in a base class definition is declared to be virtual, and is\
    \ declared exactly the same way (including the return type) in one or more derived\
    \ classes, then all calls to that function using pointers or references of type\
    \ Base class will invoke the function that is specified by the object being pointed\
    \ at, and not by the type of the pointer itself.”\n\nThe following code demonstrates\
    \ this rule:\n\n```\n// virtual1.cpp\n#include <iostream>\nusing namespace std;\n\
    class Base {\nprotected:\n int value;\npublic:\n Base (int x) { value = x; }\n\
    \ virtual int getValue() { return value; }\n};\n```"
