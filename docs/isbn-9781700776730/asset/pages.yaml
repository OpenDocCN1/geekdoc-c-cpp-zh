  md: "# C++ Declarations\n\nIn standard C, a declaration must come at the beginning\
    \ of a block before the first executable statement. This is not the case with\
    \ C++. In C++, a declaration is a statement and can appear anywhere a statement\
    \ can appear. Its scope extends to the end of the block in which it's defined.\n\
    \n```\nvoid foo() {\n    int x, y;\n\n    y = faa();\n    int z = y;\n    cout\
    \ << z;\n}\n```\n\nWith a statement, you can have declarations within the initializer\
    \ portion:\n\n```\nfor (int i = 0; i < num; ++i)\n    a[i] = 0;\n```\n\nThis is\
    \ nice for two reasons:\n\n+   * It makes programs more compact.\n* It allows\
    \ the variable in question to be declared at the point where it is initialized.\n\
    \nNote that an initialization cannot appear inside an expression:\n\n+   * int\
    \ x = 3 + (int y = 7); // declaration of y is illegal\n* for (int i = 0; int j\
    \ > 5; ++i, ++j) // declaration of j is illegal\n\nInitializations also cannot\
    \ appear within a function call:\n\n+   * int x = foo(int i = 5); // declaration\
    \ of i is illegal\n* for (int i = 0; i < num; ++i)\n    a[i] = 0;"
