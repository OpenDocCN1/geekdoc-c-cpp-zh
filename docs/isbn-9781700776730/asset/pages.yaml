  md: "# Accessing Mechanisms\n\nAccessing Base Class Members Using Derived Class\
    \ Instance\nAn instance of a derived class has complete access to the public members\
    \ (usually functions) of the base class. Assuming that a member with the same\
    \ name does not exist within the scope of the derived class, the member from the\
    \ base class will automatically be used.\n\n```\n// derived.cpp\nclass Base {\n\
    protected:\n    int num;\npublic:\n    Base(int n = 0) : num(n) {}\n    int getNum()\
    \ const { return num; }\n};\n\nclass Derived : public Base {\n};\n\nint main()\
    \ {\n    Derived d;\n    cout << d.getNum(); // first checks class Derived\n \
    \   // and then class Base\n    cout << d.Base::getNum(); // goes directly to\
    \ class Base\n    return 0;\n}\n```\n\nIn the first call, the compiler will look\
    \ at the scope of class Derived to see if a function called getNumber() exists.\
    \ If not, it will then look at the scope of the class Base. In the second call,\
    \ the compiler will look directly at the scope of the Base class for getNumber().\n\
    \nOverride Base Class Data Member Names\nIn addition to creating new members whose\
    \ names are different than those inherited from the base class, a derived class\
    \ may selectively override or hide existing names. This is done by declaring a\
    \ member in the derived class with exactly the same name as that of a member from\
    \ the base class.\n\nThat is, if an instance or member function of the derived\
    \ class refers to a data member of the base class that has been overridden, the\
    \ member from the derived class will be used by default. Since the derived class\
    \ contains its base"
