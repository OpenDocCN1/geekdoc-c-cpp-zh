  md: "# Initialization of Static Data Member\n\nSince all the objects of a class\
    \ have access to the static member, who is responsible for reserving storage and\
    \ initializing it? You cannot do it in every constructor since every object created\
    \ would then reinitialize the static member. There is a special way to create\
    \ and initialize static data members. You must create a definition outside of\
    \ all functions: \n\n```\n// word4.h\n#ifndef _WORD4_H\n#define _WORD4_H\n\nclass\
    \ Word {\nprivate:\n    char *buf;\n    static int wordCount;\npublic:\n    Word(char\
    \ *s);\n};\n\n#endif\n```\n\n```\n// word4.cpp\n#include <string.h>\n#include\
    \ \"word4.h\"\n\nint Word::wordCount = 0;\n\nWord::Word(char *s) {\n    buf =\
    \ strdup(s);\n    wordCount++;\n}\n```\n\nThis somewhat unusual because you must\
    \ not only give the variable name, but also its class using the scope resolution\
    \ operator. So a static data member is initialized outside of the class definition\
    \ in the same manner as a nonmember variable using the scope resolution operator.\
    \ It's important to note that only one initialization of a static data member\
    \ can occur within the program.\n\nNote when initializing a static member, don't\
    \ include the keyword static again. If you do, you will encounter a compiler error.\
    \ Typically the allocation of the static member is placed in the same source file\
    \ as the implementation of the class (the .cpp source file). Keep in mind that\
    \ class declarations typically go into header files. If the inclusion of a static\
    \ member declaration includes the class\n\nFocus on Object-Oriented Programming\
    \ with C++"
