  md: "# setiosflags(flaglist)\n\nSets the formatting flags in flaglist, where flaglist\
    \ is a sequence of one or more 1-bit flags, separated by the | symbol: flag1 |\
    \ flag2 | flag3\n\nHere are a few of the formatting flags available:\n\n+   -\
    \ ios::showpoint - displays decimal point and trailing zeros, even in a number\
    \ with no fractional part\n\n+   - ios::fixed - displays real values in fixed-point\
    \ form, avoiding exponential format\n\n+   - ios::scientific - displays real value\
    \ in floating-point form\n\n+   - ios::left - displays values left-justified within\
    \ a field\n\n+   - ios::right - displays values right justified within a field\n\
    \nNote that at this point we do not need to know what the ios class is, or the\
    \ reasons for the exact syntax used. To illustrate the use of format manipulators,\
    \ type in, compile and execute the following program:\n\n```\n// iol.cpp\n#include\
    \ <iostream>\nusing namespace std;\nint main() {\n    float x, y;\n    x = 8.0\
    \ / 3.0;\n    y = 9.0 / 3.0;\n    cout << \"\" << x << \"\" << endl;\n    cout\
    \ << \"\" << y << \"\" << endl;\n    return 0;\n}\n```\n\nWhile the default format\
    \ depends on the particular C++ implementation, the output displayed by these\
    \ statements might appear as:\n\n(2.666667)\n(3)"
  merge: -1
  img_proc: true
- pgno: 53
  md: "Note the following:\n\n+   • The default precision is 6, so that (up to) six\
    \ positions are provided to hold the digits after the decimal point.\n\n+   •\
    \ The value of x is displayed in a field whose (default) width is 1, and C++ automatically\
    \ widens fields that are too small to the minimum width required to display the\
    \ value.\n\n+   • By default, the flag ios::showpoint is not set, so that neither\
    \ the decimal point nor the fractional values of y are displayed.\n\nUsing the\
    \ setflags() manipulator to set the ios::showpoint flag will cause the decimal\
    \ point and trailing zeros of y to be displayed, and using it to set the ios::fixed\
    \ flag will ensure that values are displayed in fixed-point (rather than floating-point)\
    \ form. Type in, compile, and execute the following program:\n\n```\n// io2.cpp\n\
    #include <iostream>\n#include <iomanip>\n\nusing namespace std;\n\nint main()\
    \ {\n    float x, y;\n\n    x = 8.0 / 3.0;\n    y = 9.0 / 3.0;\n    cout << setios(ios::showpoint\
    \ | ios::fixed) << \"(\" << x << \")\" << endl;\n    cout << \"(\" << y << \"\
    )\" << endl;\n}\n```\n\nIt's output will appear as follows:\n\n(2.666667)\n(3.000000)\n\
    \nSuppose we wish to alter the precision to display only three decimal places.\
    \ We can insert the setprecision() stream manipulator or we can use the precision()\
    \ member function. A call to either sets the precision for all subsequent output\
    \ operations until the next precision setting call."
