  md: "Because the object of which the overloaded + operator is a member must be the\
    \ variable to the left of the operator. When we place a variable of a different\
    \ type or, or a constant, there is no object of which the overloaded + operator\
    \ can be a member and so there is no constructor to convert the type float to\
    \ Distance. The compiler simply cannot handle this situation.\n\nA friend function\
    \ allows us to write statements that have non-member data types to the left of\
    \ the operator. So we can change the declaration inside the Distance class to\
    \ read:\n\n```\nfriend distance operator+(Distance, Distance);\n```\n\nWe would\
    \ now redefine the operator+() function as follows:\n\n```\nDistance operator+(Distance\
    \ d1, Distance d2) {\nint ft = d1.feet + d2.feet;\nfloat in = d1.inches + d2.inches;\n\
    if (in >= 12.0) {\n  in -= 12.0;\n  ++ft;\n}\nreturn Distance(ft, in);\n}\n```\n\
    \nWe can now say the following from within main() without a compiler error message:\n\
    \n```\nd3 = d1 + 10.0;\nd3 = 10.0 + d1;\n```\n\nNote that, while the the overloaded\
    \ + operator took one argument as a member function, it takes two as a friend\
    \ function. In a member function, the objects on which a operates is the object\
    \ of which it was a member, and the second is an argument. In a friend, both objects\
    \ must be arguments.\n\nA friend function allows one argument for a unary operator\
    \ and two arguments for a binary operator, while a member function has zero arguments\
    \ for a unary operator and one argument for a binary operator. This is true because\
    \ a member function is automatically dealing with one variable already, the object\
    \ it was called for.\n\nFocus on Object-Oriented Programming with C++    Page\
    \ 249"
