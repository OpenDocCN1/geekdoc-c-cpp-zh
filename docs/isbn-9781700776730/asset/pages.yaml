  md: "# Distinguishing Prefix and Postfix for ++ and -- Operators\n\nIn earlier versions\
    \ of C++, it was impossible to define separate overloaded operations for postfix\
    \ and prefix ++ and -- operators. However, the compiler can now distinguish between\
    \ the prefix and postfix versions of these operators by calling the operator function\
    \ with no arguments or with one int argument,\n\n```\nclass Counter {\nprivate:\n\
    \    int count;\npublic:\n    Counter() { count = 0; }\n    Counter(int x) { count\
    \ = x; }\n    int getCounter() { return count; }\n    Counter operator++() {\n\
    \        ++count;\n        return Counter(count);\n    }\n    Counter operator++(int)\
    \ {\n        int temp = count;\n        ++count;\n        return Counter(temp);\n\
    \    }\n};\n```\n\nMember functions operator++(int) and operator-- (int) defines\
    \ a postfix increment and decrement operator for a Counter object. C++ assigns\
    \ 0 to the single int parameter.\n\nFor an object c1 of type Counter, the expression\
    \ ++c1 calls the overloaded prefix ++ operator, in effect executing the statement:\n\
    \n```\nc1.operator++();\n```\n\nThe expression c1++ calls the overloaded postfix\
    \ ++ operator and executes as though written:\n\n```\nc1.operator++(0);\n```"
  merge: -1
  img_proc: true
- pgno: 248
  md: 'The decrement operator works similarly.


    Because older versions of C++ did not make the distinction between prefix and
    postfix, some newer compilers might allow both calls to be made with only the
    prefix definition of operator++() or operator-- (), although they usually issue
    a warning.


    Notice that the argument int has no identifier, so it is not used in the function.
    It is only there to generate a different function signature. Because there is
    no identifier, the compiler will not complain that a variable has been "created
    but not used".


    Our main concern when creating prefix and postfix operators is to decide what
    incrementing and decrementing means for an object of this class. In most cases,
    there''s a specific data member in the class that you''ll want to increment or
    decrement.'
