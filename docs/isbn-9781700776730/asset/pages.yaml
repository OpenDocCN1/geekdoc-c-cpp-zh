    ```


    The brackets are required to tell the compiler to expect an array of objects on
    the heap. This has that important ramifications when you need to delete an array
    of user-defined objects.


    So the rule is: If you used brackets in `new`, then use brackets in `delete`.
    If you didn''t use brackets in `new`, then don''t use brackets in `delete`.


    Note: If the contents of a pointer given to `delete` contains the value zero or
    `null`, it is perfectly permissible since this situation is guaranteed not to
    do anything harmful.


    In the following example, the user is asked to enter string data from the keyboard.
    The input is captured into a buffer area of some fixed length, after which it
    is copied onto the heap. Note that exactly the amount of heap space is allocated
    to store each string. After all strings have been entered, they are printed and
    their heap space released via `delete`.


    The key data element is `ptr`, which is a pointer-to-pointer so that the array
    of pointers needed to keep track of strings can grow dynamically on the heap.


    ```

    // Dynamic Memory Allocation


    #include <iostream>

    #include <string.h>


    using namespace std;


    void input(char**& ptr, int& counter);

    void output(char** ptr, int counter);

    void release(char** ptr, int counter);

    ```'
