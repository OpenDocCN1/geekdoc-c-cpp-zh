- pgno: 304
  md: 'The copy constructor is not invoked here because the objects invoked have already
    been constructed. C++ calls constructors only to initialize new objects, not when
    assigning one object to another.


    An assignment occurs whenever an object that has already been created receives
    a value through an assignment statement:


    ```

    a = d;

    ```


    An initialization occurs when an object receives a value at the time it is declared:


    ```

    Alpha d = b;

    ```


    If you are ever uncertain whether a piece of C++ code involves assignment or initialization,
    ask yourself the following question:


    “Is a new object being created here?


    If the answer is yes, a constructor is involved. If the answer is no, no constructors
    are involved. Initializations are performed by constructors and assignments are
    performed by overloading the assignment operator, =


    In C++, an initialization occurs when a new object is created. An assignment changes
    the value of an existing object without creating a new object. It therefore always
    obliterates a previous value. Why is this distinction important?


    We''ve previously seen that if we don''t write a copy constructor for our class,
    the compiler will automatically provide one for us. But we''ve seen that if our
    class has pointers, the provided copy constructor will not correctly make a copy
    of our object.


    Like the default copy constructor, the C++ compiler will provide an assignment
    operator for our class if it is not explicitly written, and the default assignment
    operator will assign each of the data members. But, with initialization, if the
    class declares any pointer data members, the copied pointers will now address
    the same location in memory, almost certainly causing a major bug if that memory
    is deleted in a destructor. This is a dangerous situation to be avoided at all
    costs.'
