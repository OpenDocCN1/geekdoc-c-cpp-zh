  md: "objects that are part of a class hierarchy. Declaring a function virtual for\
    \ a class that is not used as a base class is syntactically correct but results\
    \ in unnecessary runtime overhead.\n\nIt may be helpful to think of polymorphism\
    \ as a response to a message. In classical object-oriented programming terms,\
    \ an expression such as:\n\n```\nbptr->getValue()\n```\n\nsends a message named\
    \ getValue() to the object addressed by bptr. Upon receiving this message, the\
    \ object responds in some predetermined way. More importantly, that same message\
    \ could be sent to other objects that determine their own responses or they might\
    \ ignore the message. Regardless of the type of object that bptr addresses, the\
    \ object itself responds in its programmed fashion to the getValue() message.\n\
    \nHere's another example:\n\n```\n// virtual2.cpp\n\n#include <iostream>\nusing\
    \ namespace std;\nclass Base {\npublic:\n    void show() { cout << \"Base\" <<\
