- pgno: 295
  md: "When an object is used to initialize a new object of a class, C++ copies each\
    \ data member from the existing object to the new one. For example, a simple class\
    \ is shown below with no pointer data members:\n\n```\nclass Alpha {\n  private:\n\
    \    int i;\n    double d;\n  public:\n    Alpha() ( i = 0; d = 0.0; )\n    Alpha(int\
    \ ii, double dd) { i = ii; d = dd; }\n};\n```\n\nNote that in practice, Alpha\
    \ needs other member functions to access its private data members i and d, but\
    \ this example simply illustrates how object copying works.\n\nWe can now declare\
    \ Alpha objects a1 and a2 as follows:\n\n```\nAlpha a1;\nAlpha a2(100, 3.14159);\n\
    ```\n\nWe can also use an existing Alpha object such as a2 to initialize a new\
    \ object a3:\n\n```\nAlpha a3(a2);\n```\n\nThis copies a2 to a3 by performing\
    \ a memberwise initialization of a2's data members. That is, a2's data members\
    \ are copied one by one to a3's data members as though we had written:\n\n```\n\
    Alpha a3;\nA3.i = a2.i;\nA3.d = a2.d;\n```"
