  md: "• Another reason for modifying the Counter class is that we might not have\
    \ access to its source code, especially if it has been distributed as part of\
    \ a class library.\n\nTo avoid these problems, we can use inheritance to create\
    \ a new class based on Counter, without modifying Counter itself. We can derive\
    \ a new class, CountDn, which adds a decrement operator to the Counter class:\n\
    \n```\nclass Counter {\nprotected:\n    int count;\npublic:\n    Counter() { count\
    \ = 0; }\n    Counter(int c) { count = c; }\n    int getCount() { return count;\
    \ }\n    Counter operator++() {\n        ++count;\n        return *this;\n   \
    \ }\n};\n\nclass CountDn : public Counter {\npublic:\n    CountDn operator--()\
    \ {\n        --count;\n        return *this;\n    }\n};\n```\n\nHere's a breakdown\
    \ of the syntax:\n\n+   - The private access specifier in the Counter class has\
    \ been replaced with the protected access specifier. More on this later.\n\n+\
    \   • CountDn is the derived class name\n\n+   : specifies that CountDn is derived\
    \ from Counter\n\n+   • public refers to the type of inheritance which may be\
    \ public, private, or protected. We'll look at this at a later time.\n\n+   •\
    \ Counter is the name of the base class"
