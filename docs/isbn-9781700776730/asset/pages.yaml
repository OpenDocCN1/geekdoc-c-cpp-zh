  md: "Here is an example:\n\n```\n// Memory leak\n\nbool AdjustTemperature(HTHING\
    \ hThing) {\n    if (!hThing) {\n        return (false);\n    }\n\n    // Instantiate\
    \ a Thing using a handle\n    Thing *pThing = new Thing(hThing);\n    if (!pThing)\
    \ {\n        return (false);\n    }\n\n    // Get Thing's color and adjust temperature\
    \ accordingly\n    switch (pThing->Color()) {\n        case BLUE: AdjustTemperature(5);\
    \ return (true);\n        case RED: AdjustTemperature(-5); return (true);\n  \
    \      default: break;\n    }\n\n    // For what colors does this get executed?\n\
    \    delete pThing;\n    return (false);\n}\n```\n\nAs you can see in the above\
    \ code fragment, the programmer saved a few cycles by not using a local Boolean\
    \ variable to keep track of success or failure. He didn't need a local variable\
    \ because whenever he encountered an error it returned to the caller. However,\
    \ if the color of the Thing is red or blue, the memory that pThing points to never\
    \ gets deleted. Note that if you implement memory leakage in legacy code, this\
    \ technique can also be implemented in old C by using malloc instead of new and\
    \ delete.\n\n# Tactic No. 3: Use Numerous Pointers with the Same Name\n\nC++ allows\
    \ and encourages a programmer to declare an automatic variable close to the point\
    \ of usage. So, you can declare an automatic variable that will point to a quantity\
    \ of allocated memory right at the point of allocation. This capability provides\
    \ the memory leaner with a unique opportunity. Declare a pointer at the start\
    \ of a function (in the traditional manner), and declare another pointer of the\
    \ same name within an inner scope, at the point of instantiation. This will create\
    \ a fairly confusing memory leak. Here is an example:\n\n![](img/88ecbb96455b36fdc78e686bde4f5234_416_0.png)"
