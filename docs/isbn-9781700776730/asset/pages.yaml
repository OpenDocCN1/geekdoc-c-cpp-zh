    every use of Time is disheartening. The change to the data structure forces you
    to revise code that has already been tested, thus requiring new debugging sessions
    and wasting valuable development time.


    The old rule of thumb is: "Let the data structure change the code".


    In the real world, however, data specifications are likely to change during a
    program''s development making extra work for programmers. With conventional programming,
    the data representations you choose early in a program''s development limit your
    freedom to make changes later.


    We''ll see that with object-oriented programming, data may change with only limited
    effects on the code. C++ classes can restrict a program''s access to internal
    data storage details. So changes to data representations do not necessarily affect
    every use of that information.'
