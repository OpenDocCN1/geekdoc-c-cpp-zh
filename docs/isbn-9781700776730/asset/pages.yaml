- pgno: 428
  md: "# Virtual Base Classes\n\nWhen using multiple inheritance, a base class may\
    \ not be specified more than once in a derived class: This declaration is therefore\
    \ not legal:\n\n```\nclass Base {};\nclass Derived : public Base, public Base{};};\n\
    ```\n\nHowever, a base class can legally be indirectly passed to the derived class\
    \ more than once:\n\n```\nclass X : public Base {\n    public:\n    int num;\n\
    \    void getNum();\n};\nclass Y : public Base {\n    public:\n    int num;\n\
    \    void getNum();\n};\nclass Z : public X, public Y {\n    public:\n    int\
    \ num;\n    void getNum() { return num; }\n};\n```"
  merge: -1
  img_proc: true
- pgno: 429
  md: "![](img/88ecbb96455b36fdc78e686bde4f5234_429_0.png)\n\nNote that the above\
    \ inheritance tree is shown with the same Base class appearing twice. In this\
    \ case, each object of class Z will have two sub-objects of class Base, each with\
    \ its own data!\n\nAlso note that the function getNum() is now ambiguous. The\
    \ compiler doesn't know which num is being referred to! The scope resolution operator\
    \ must therefore be applied to the function:\n\n```\nint Z::getNum() {\n  return\
    \ X::num;\n}\n```\n\nHaving multiple copies of the same base class in an instance\
    \ hierarchy is not confusing, it wastes storage! The solution is to declare the\
    \ base class virtual. This forces the compiler to allow only one copy of a given\
    \ base class in the declaration of a derived class:"
  merge: -1
  img_proc: true
- pgno: 430
  md: "```\nclass base {\n  public:\n    int num;\n};\nclass X : public virtual Base\
    \ { };\nclass Y : public virtual Base { };\nclass Z : public X, public Y {\n \
    \ public:\n    int getNum() { return num; }\n};\n```\n\nNote that we no longer\
    \ need to use the scope resolution operator in the return statement of the getNum()\
    \ member function in class Z. Base is now a virtual base class and class Z only\
    \ has one object of class Base.\n\n![](img/88ecbb96455b36fdc78e686bde4f5234_430_0.png)\n\
    \nNote that virtual base classes are used only in the context of multiple inheritance\
    \ and have nothing to do with abstract base classes (which contain a pure virtual\
    \ function)."
  merge: -1
