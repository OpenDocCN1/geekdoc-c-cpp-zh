- pgno: 351
  md: "# Base and Derived Class Destructors\n\nA derived class typically provides\
    \ a constructor if its base class has one, and a base class constructor must be\
    \ called in order to initialize any data members in the base class. Destructors,\
    \ on the other hand, do not require strict handling. A derived class needs to\
    \ supply a destructor only if the derived class has any members that require deleting\
    \ when an object of the derived class goes out of scope.\n\n```\n// dtor.cpp\n\
    \n#include <iostream>\n#include <string.h>\n\nnamespace std {\nclass Base {\n\
    private:\n    char *buf;\npublic:\n    Base(char *s) {\n        buf = new char[strlen(s)\
    \ + 1];\n        strcpy(buf, s);\n    }\n    ~Base() {\n        delete [] buf;\n\
    \    }\n    char *getStr() {\n        return buf;\n    }\n};\n```\n\nNote that\
    \ the constructor copies a string argument to the heap, assigning the address\
    \ of the allocated memory to buf. The destructor deletes this memory block when\
    \ an object of type Base goes out of scope. Consider what happens in a new class\
    \ derived from Base:"
  merge: -1
  img_proc: true
- pgno: 352
  md: "```\nclass Derived : public Base {\nprivate:\n    char *upper;\npublic:\n \
    \   Derived(char *s) : Base(s) {\n        upper = new char[strlen(s) + 1];\n \
    \       strcpy(upper, touprpr(s));\n    }\n    ~Derived() {\n        delete []\
    \ upper;\n    }\n    char *getUpper() {\n        return upper;\n    }\n};\n```\n\
    \n```\nint main() {\n    Derived d(\"Haley Laurel\");\n\n    cout << d.getStr()\
    \ << endl;\n    cout << d.getUpper() << endl;\n    return 0;\n}\n```\n\noutput:\n\
    Haley Laurel\nHALALY LAUREL\n\nNote that the Derived constructor calls the Base\
    \ constructor, which copies the string addressed by s to the heap. The Derived\
    \ class constructor makes another copy of the string, and converts its characters\
    \ to upper case, and assigns to uppercase the address of the copied string. If\
    \ you create an object of type Derived, you create two copies of a string, one\
    \ changed and one in uppercase.\n\nA Derived class object must carefully delete\
    \ any memory that it allocates. When the object goes out of scope, its destructor\
    \ must delete this memory and return it to the heap for reuse. The Base class\
    \ destructor must also delete the memory addressed by buf.\n\nUnlike destruct,\
    \ a destructor in a derived class does not explicitly call the base class destructor.\
    \ C++ calls destructors automatically when objects of a class goes out of scope.\
    \ When Derived object goes out of scope, C++ first calls the Derived class destructor,\
    \ and then calls the Base class destructor. Note that the two strings are deleted\
    \ in the reverse order in which they were constructed.\n\nFocus on Object-Oriented\
    \ Programming with C++"
