- pgno: 65
  md: "```\nint main() {\n  Elevator e;\n\n  e.initialize();\n  e.selectFloor();\n\
    \  e.go();\n}\n```\n\nDefining a variable of a user-defined type is just like\
    \ defining a variable of a built-in type. However, we did not have to create a\
    \ typedef as we did in C.\n\nWhen calling a member function, we must specify an\
    \ object. Calling a member function or sending a message to an object is just\
    \ like selecting a data member of a struct. Since the user doesn't have to pass\
    \ the address of the variable into a function, member function calls are easier\
    \ and cleaner to use.\n\n# Data Protection\n\nSo we've seen how a type is represented\
    \ in C++ by extending a struct to include functions as well as data. If a program\
    \ still has direct access to all the members in a struct, the data is unprotected,\
    \ and programmers can get into it and mess things up.\n\nThere are three reasons\
    \ why we need to protect the data:\n\n+   1. Sometimes modifying one data element\
    \ may require modification of another to maintain the integrity of the object.\
    \ If you deny programmers access to certain data elements, that forces them to\
    \ use member functions which you can design to preserve object integrity.\n\n\
    +   2. In a struct, where all members may be modified, it can be difficult for\
    \ programmers to know which interface they're supposed to use. By denying access\
    \ to some of the members within a struct, they could only use members that are\
    \ part of the public interface.\n\n+   3. It helps you isolate bugs. Say a programmer\
    \ makes an incorrect modification to a data member and suddenly you have an error\
    \ somewhere in your system. If all the members are public, that error could be\
    \ coming from anywhere. But if some of those members are private, you know the\
    \ problem must be coming from functions that have permission to access data."
  merge: -1
  img_proc: true
- pgno: 66
  md: "# Access Specifiers\n\nSo how does C++ address these security issues? C++ adds\
    \ three new keywords to provide data protection, called access specifiers:\n\n\
    public: means that members declared after this point are accessible by everyone.\
    \ Public members are like members of C structs. C++ structs default to public\
    \ access.\n\nprivate: means that all members declared after this point are only\
    \ accessible to other members of the object. Other programmers cannot access private\
    \ members so they are safe from accidental changes and are not part of the public\
    \ interface to the type. C++ classes default to private access.\n\nprotected:\
    \ members, like private members, are not accessible by other programmers and can\
    \ only be modified by other members of the type. However, member functions in\
    \ derived types, a subject we'll cover later, can access protected members of\
    \ the base type.\n\n# Data Protection Example\n\nLet's see how we can use access\
    \ specifiers to increase the integrity of the Elevator type from before:\n\n```\n\
    struct Elevator {\nprivate:\n    int floorSelected;\n    int floorNumber;\npublic:\n\
    \    void initialize();\n    void selectFloor(int floor);\n    void go();\n}\n\
    ```\n\nNow, the only way to modify the private data elements is through the public\
    \ interface. For example:\n\n```\nint main() {\n    Elevator e;\n    e.floorSelected\
    \ = 12;\n}\n```"
  merge: -1
  img_proc: true
- pgno: 67
  md: "is now an invalid statement. The compiler will generate an error message. The\
    \ data member floorSelected is now a private data member and can only be accessed\
    \ within the scope of the Elevator struct.\n\n# Restricted Access to Member Functions\n\
    \nMember functions can also have restricted access as shown below:\n\n```\nstruct\
    \ Coordinates {\n    private:\n    int c1, c2, c3;\n    void translate(int, int,\
    \ int);\n    public:\n    void move (int, int, int);\n};\n```\n\nHere we can assume\
    \ that the member function move() calls the translate() member function, since\
    \ programmers using the objects cannot.\n\nSo we've seen why we need to protect\
    \ the data and functions within types and how the keywords public, private and\
    \ protected can help us do that. This will lead us into a discussion of the class."
