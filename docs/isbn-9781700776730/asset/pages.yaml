- pgno: 81
  md: '# C++ Classes vs C Structs


    Keep in mind that C++ classes and C structs have much in common. In fact, all
    of the features supported by C structs are supported by C++ classes:


    +   * class objects can be passed to functions

    * class objects can be returned by functions

    * pointers can be used to access class objects

    * classes can be used as array types

    * classes can be nested

    * memory can be allocated dynamically for class objects


    But in mind that classes are much more powerful than C structs:


    +   * classes have facilities for information hiding with public, private, protected,
    and friend declarations

    * classes can have functions as members

    * classes have facilities for initializing and cleaning up objects using special
    features called constructor and destructor functions

    * classes have facilities to support inheritance with derived classes and virtual
    functions


    # Class Data Members


    Data members in a class are exactly like data members in a C struct. They may
    be:


    +   * variables

    * pointers

    * references

    * arrays

    * structures

    * class objects


    However, class data members may not use the storage class specifiers:


    +   * auto

    * extern

    * register'
