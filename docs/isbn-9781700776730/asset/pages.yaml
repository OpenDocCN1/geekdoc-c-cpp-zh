  md: "The code below shows the declarations of the Portal abstract base class, along\
    \ with the Window and Door derived classes:\n\n```\n// portal.cpp\nclass Portal\
    \ {\npublic:\n    enum portalState {opened, closed, locked};\nprivate:\n    portalState\
    \ state;\n    int xPos, yPos, width, height;\npublic:\n    virtual void open()\
    \ = 0;\n    virtual void close() = 0;\n    virtual void lock() = 0;\n    void\
    \ getState() const;\n    void getXpos() const;\n    void getYpos() const;\n  \
    \  int getHeight() const;\n    int getWidth() const;\n};\n\nclass Window : public\
    \ Portal {\npublic:\n    virtual void open();\n    virtual void close();\n   \
    \ virtual void lock();\n};\n\nclass Door : public Portal {\npublic:\n    virtual\
    \ void open();\n    virtual void close();\n    virtual void lock();\n};\n```\n\
    \nNotice how this allows Window and Door objects to be stereotyped. They can both\
    \ be referred to as Portals. While this is an incomplete description of both objects,\
    \ it is nonetheless accurate and useful.\n\nThis ability to stereotype an object\
    \ is a powerful design tool. It allows us to bundle all the common aspects of\
    \ a set of objects together into an abstract class. That's why we say: \"An abstract\
    \ class provides a common public interface for the entire class hierarchy.\""
