  md: '# Capturing Program Output


    When you submit your computer lab assignments, it will be necessary to include
    a file that contains the output generated by your program. While you might be
    tempted to simply copy and paste the output that appears on the screen into a
    file, often output generated from your programs cannot all fit on the screen and
    usually gets scrolled off the screen. Please follow the instructions below to
    capture the output of your program into a file called csis.txt:


    +   - Include the header file for the fstream library in all .cpp source code
    that generates output to the file:


    ```

    #include <fstream>

    ```


    +   - Include the following global declaration (after using namespace std;) to
    your .cpp source code that contains the main() function:


    ```

    ofstream csis;

    ```


    +   - Include the following global declaration (after using namespace std;) in
    all .cpp source code, other than the file that contains main(), that generates
    output:


    ```

    extern ofstream csis;

    ```


    +   - Add the following statement to main() after your variable declarations.
    It will open the csis.txt file to capture your output.


    ```

    csis.open("csis.txt");

    ```'
