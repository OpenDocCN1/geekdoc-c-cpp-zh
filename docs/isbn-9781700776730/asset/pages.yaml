- pgno: 190
  md: "```\n// word3.h\n\n#ifndef WORD3_H\n#define WORD3_H\n\nclass Word {\nprivate:\n\
    \    char *buf;\n    static int wordCount;\npublic:\n    Word(char *s);\n};\n\n\
    #endif\n```\n\n```\n// word3.cpp\n#include <string.h>\n#include \"word3.h\"\n\n\
    Word::Word(char *s) {\n    buf = strdup(s);\n    wordCount++;\n}\n```\n\nSo it's\
    \ not 100% correct to say that each object contains its own separate data. A data\
    \ item in a class is defined as static, then only one such item in a class is\
    \ created for the entire class, no matter how many objects of the same class must\
    \ share a common item of information. There is only one instance of a static data\
    \ member of a class and it is in scope whenever the class is in scope, i.e., whenever\
    \ the class definition is accessible. So a static data member is a single shared\
    \ variable accessible to all objects of its class. It acts as a global variable\
    \ for its class.\n\nThere are two advantages of a static data member over the\
    \ use of a global variable:\n\n+   - Information hiding can be enforced. A static\
    \ member can be made non-public; a global variable cannot.\n- A static member\
    \ is not entered into the program's global name space, thus removing the possibility\
    \ of an accidental conflict of names.\n\nFocus on Object-Oriented Programming\
    \ with C++"
