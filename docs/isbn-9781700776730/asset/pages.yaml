    \ ++ (increment by 1) and -- (decrement by 1) are unique in that they may appear\
    \ on either side of the variable to which they apply. If the operator appears\
    \ on the left, it implies prefix notation while on the right it implies postfix\
    \ notation.\n\nIn older C++ compilers, the distinction between prefix and postfix\
    \ notation for user-defined types was lost. That is, for the String class and\
    \ an instance s, the expressions s++ and ++s cannot be distinguished from each\
    \ other because the compiler will generate exactly the same code for each. However,\
    \ with more modern compilers, any usage automatically generates an extra argument\
    \ consisting of an integer 0. The actual value of this integer, of course, is\
