  md: '# Inline Functions


    C programmers commonly use the preprocessor to make code easier to write and read
    with with macros and value substitution. We''ll see how this process invites errors
    because:


    +   - a macro looks like a function but doesn''t act like one

    - value substitution looks like an expression but doesn''t act like one


    Then we''ll see how C++ rectifies the problem with inline functions and consts.


    # Functions or Subprograms


    The purpose or advantages of the function or subprogram are numerous:


    +   - makes programs modular

    - easier to debug programs

    - easier to maintain programs

    - usually less utilization of memory


    Functions save memory space because all the calls to the function cause the same
    code to be executed. Therefore the function body need not be duplicated in memory.


    Keep in mind, however, that there are drawbacks to using functions. One of the
    sad truths of programming languages such as C and C++ is that function calls waste
    time. To call a function, the compiled program has to:


    +   - save the return address of the current location on the stack

    - push onto the stack any argument values needed by the function

    - save register contents

    - execute an assembly language call instruction to invoke the function

    - return some function value

    - clear the stack and return to the starting place

    - restore the registers


    All of these instances slow down the program. While these sequence of events may
    save memory space, they take some extra time. Although a single function takes
    place rather quickly, numerous function calls can shave points off of a program''s
    performance.'
  merge: -1
  img_proc: true
- pgno: 151
  md: "However, avoiding functions is not an acceptable solution to this problem!\
    \ Functions make programs modular and easier to maintain and debug. Without functions,\
    \ it is extremely difficult, perhaps impossible, to write even medium-sized programs\
    \ that run correctly. In fact, if a function is very short, the instructions necessary\
    \ to call it may even take up as much space as the instructions within the function\
    \ body itself. In this case, there is not only a time penalty, but a penalty as\
    \ well.\n\n# Macros\n\nOne possible solution for this function overhead is to\
    \ use the preprocessor and define macros that use code substitution. For example,\
    \ here is a function that checks the range of its argument and calls error() if\
    \ the argument is out of range:\n\n```\nvoid test(int a) {\n  if (a < 0 || a >\
    \ 10)\n    error(a);\n}\n```\n\nNow, here is a corresponding macro to perform\
    \ the same range checking:\n\n```\n#define TEST(a)    if (a < 0 || a > 10) error(a)\n\
    ```\n\nThe problem here is that a preprocessor macro looks like a function but\
    \ doesn't act like one! If we make the following rather innocent calls, we get\
    \ a number of unexpected results:\n\n```\nint main() {\n  int x = 0;\n  int y\
    \ = 0;\n  int u = 10;\n  int v = 10;\n\ntest(--x);      // error: -1 out of range\n\
    TEST(--y);     // error: -2 out of range\ntest(++u);     // error: 11 out of range\n\
    TEST(++v);     // error: 13 out of range\n}\n```"
  merge: -1
  img_proc: true
- pgno: 152
  md: 'We get different results depending upon whether the function or macro is called
    and also depending on the value of the arguments. The problem occurs because the
    macros are expanded like this:


    ```

    if (--y < 0 || --y > 10) error(--y);

    if (++v < 0 || ++v > 10) error(+v);

    ```


    The execution of the first macro decrements y for both tests in the if statement
    as well as the call to error().). The execution of the second macro only increments
    v for the first test which evaluates to true so the second test is short-circuited,
    but it also increments v for the call to error().


    In C, the only way to write small, function-like entities that have no function
    overhead is over the preprocessor. In C++, preprocessor macros were considered
    problematic enough to add a new feature to the language, inline functions.


    # Inline Functions


    inline is a C++ keyword which tells the compiler to treat a function as a macro,
    somewhat. When the C++ compiler encounters an inline function, it doesn''t allocate
    storage for the function body as it would with a normal function. Instead, the
    compiler creates space in its symbol table and stores the prototype of the function
    and the function body in the symbol table. Thus, the function definition generates
    no object code at the point it is defined!


    When you call an inline function, the compiler inserts the function code directly
    inline, giving you the efficiency of a macro. Everything about an inline function
    is exactly the same as a normal function:


    +   * You get type checking on the arguments and return values.

    * There are no surprise non-function-like interactions.


    Thus, there is no confusion about the behavior of an inline function since it
    is exactly the same as a regular function. The only difference between an inline
    function and a non-inline function is the use of the inline keyword.'
  merge: -1
  img_proc: true
