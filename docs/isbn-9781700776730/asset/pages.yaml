  md: "```\nint main() {\n    Stack s2;\n\n    s2.push(5);\n    s2.push(6);\n    s2.push(7);\n\
    \    cout << s2.pop();\n    cout << s2.pop();\n    cout << s2.pop();\n    cout\
    \ << s2.pop();\n    return 0;\n}\n```\n\nNote that functions push() and pop()\
    \ in Stack have the same names, arguments, and return types are functions in class\
    \ Stack. When we call these functions in main(), how does the compiler know which\
    \ of the two functions to\n\nuse?\n\n> Rule: When the same function exists in\
    \ both the base class and the derived class, the function in the derived class\
    \ will be executed. The derived class functions override the base class functions.\n\
    \n# Hiding Overloaded Functions\n\nYou cannot overload (or hide) a base class\
    \ function by redefining it in a derived class with a different argument list.\
    \ The rationale behind this design is that if you override a function inherited\
    \ from the base class, there should be no danger of accidentally calling the base\
    \ class version through the process of argument matching.\n\nIn other words, if\
    \ a base class function expects an int as an argument, and you hide it by redefining\
    \ it in a derived class to accept a char*, then calling the function using a derived\
    \ instance with an int actual argument should cause a compilation error."
