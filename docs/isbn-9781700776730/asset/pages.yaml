  md: '# C++ and const


    In C++ the old style of declaring program constants with a #define is considered
    obsolete. In C++, const has has a distinctly different meaning than in ANSI C.
    const allows the compiler to perform type-checking because it knows more about
    the items being handled.


    ```

    const int TOP = 100;

    const int BOTTOM = 47;

    const int SIZE = TOP - BOTTOM;

    ```


    Here, C++ knows that the const SIZE is an int value. The compiler doesn''t know
    anything about textual substitution.


    The compiler is also smart enough to avoid allocating storage to a const when
    unnecessary. Instead, the compiler will evaluate the expression and store the
    result in the symbol table. Then it can use that result after performing type
    checking. In other words, the const is an identifier that the compiler replaces
    with actual values at compile time.


    There are occasions, however, in which storage is actually allocated to a const:


    ```

    const int& num = 9;

    ```


    This statement contains a constant reference and allocates storage to it. The
    identifier num is in the symbol table and behaves just like any other reference
    variable with the understanding that it cannot be modified. More on references
    later!'
  merge: -1
  img_proc: true
- pgno: 159
  md: "Thus in C++ we can use a const just like a preprocessor value:\n\n```\n// const.cpp\n\
    #include <iostream>\n\nusing namespace std;\nconst int TOP = 100;\nconst int BOTTOM\
    \ = 47;\nconst int SIZE = TOP - BOTTOM;\n\nint main() {\n    int a[SIZE * 2];\n\
    \    for (int i = 0; i < SIZE; i++)\n        a[i] = 0;\n    cout << \"SIZE * \"\
    \ << SIZE * 2 << endl;\n}\n```\n\nThe constant expression above:\n\n```\nconst\
    \ int SIZE = TOP - BOTTOM;\n```\n\nis evaluated at compile time so it can be used\
    \ in the array definition. The output\n here is:\n\nSIZE * 2 = 106\n\nIn C++,\
    \ const has all the benefits of using the preprocessor. There is no\nsituation\
    \ where it is better to use #define for variable substitution. You always\nget\
    \ much better from using const.\n\n# const Variables\n\nActually, the const identifier\
    \ is a C++ innovation adopted by ANSI C. Declaring\na variable to be a const in\
    \ effect makes the variable read-only. It may be\nassigned an initial value, but\
    \ other statements cannot change it."
