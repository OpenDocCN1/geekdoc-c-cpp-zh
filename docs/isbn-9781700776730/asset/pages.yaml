  md: "```\nvoid foo(char& pptr) {\n    pptr = \"Hello C++\";\n}\n\noutput:\nptr =\
    \ Hello C++\n```\n\n# Why References Are Essential\n\nLet's look at this class\
    \ that uses an overloaded addition operator:\n\n```\nclass Plus {\n    private:\n\
    \        int i;\n    public:\n        Plus(int x = 0) { i = x; }\n        Plus\
    \ operator+(const Plus arg) { return Plus(i + arg.i); }\n        void print(char*msg)\
    \ { cout << mag << endl; }\n};\n\nint main() {\n    Plus a(13), b(34);\n    Plus\
    \ c;\n    c = a + b;\n    ...\n    return 0;\n}\n```\n\nThe operator+() takes\
    \ a single argument, which is the value to the right of the + sign. Note that\
    \ the function is invoked for object on the left of the + sign.\n\nThe operator+()\
    \ function creates a new Plus object by calling the Plus constructor. The argument\
    \ to the Plus constructor is sum of the private data parts of the two objects.\
    \ The Plus constructor creates a new (temporary) Plus object which is copied out\
    \ of the function as the return value of the operator. Note that all objects are\
    \ passed and returned by value!\n\nHowever, there are many occasions when you\
    \ need to pass the address of an object. For example, objects may be too large\
    \ to pass by value without destroying the efficiency of the program."
