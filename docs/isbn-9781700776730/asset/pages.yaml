  md: '# Polymorphism Lab (Library Holdings)


    In this assignment, you will learn how to use inheritance and virtual functions
    by designing a set of classes to represent library holdings. Our library has two
    kinds of items: books and recordings. Each item has a title and an integer call
    number. In addition, books have authors, and recordings have performers and formats
    (MP3, WAV, AIFF). In addition to constructors and destructors, each holding should
    have a print() function that displays its data to an ostream object (such as cout)
    that the user specifies.


    You should begin by designing a Holding class that contains all the data common
    to books and recordings. It should also have a pure virtual print() function.
    Then design the Book and Recording classes to add the details necessary for those
    types of items and to implement the print() function. Note that Holding will be
    an abstract base class, since, there are no generic holdings, only books and recordings.


    All three classes should have copy constructors and constructors that accept the
    individual data fields as arguments. Although it may seem natural to have a zero-argument
    default constructor that queries the user and reads in the data fields, doing
    I/O from a constructor is probably unwise. If the constructor did I/O, the class
    implementation would be tied to a particular style of getting data. Applications
    that use this class may read input from a file, or they may use a window-based-based
    interface that does not support the cin and cout I/O streams. Since constructors
    are such a basic part of the operation of a class, it is best to let the user
