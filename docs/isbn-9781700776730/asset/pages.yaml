- pgno: 399
  md: '# Abstract Classes


    While it is true that all objects are represented by a class, the converse is
    not true. All classes do not necessarily represent objects. It is possible, and
    often desirable, for a class to be insufficient to completely represent an object.
    Such classes are called abstract classes. Like an abstract idea, an abstract class
    describes an unrealized concept. It''s a kind of schematic from which you are
    expected to build one or more derived classes.


    An abstract class is generally used to declare an interface without declaring
    a full set of implementations for that interface. That interface specifies the
    abstract operations supported by all objects derived from that class and it is
    up to the derived classes to supply implementations for those abstract operations.


    So an abstract class is a class that does not fully represent an object, but represents
    a broad range of different classes of objects. However, it''s important to realize
    that this representation extends only to the features those classes of objects
    have in common. Thus, an abstract class provides only a partial description of
    its objects.


    Because abstract classes do not fully represent an object, they cannot be instantiated.
    At first it may seem a little odd that a class is incapable of having any instances,
    but everyday life is full of such classes. For example, we may describe a particular
    animal as belonging to the class of all Mammals, but we will never see an instance
    of the class Mammal. Every animal belonging to the class Mammal must also belong
    to a class that is subordinate to a Mammal, such as a Mouse, Dog, Human, or Platypus.
    That is because the class Mammal does not fully represent any animal.


    In object-oriented design, we will never see an instance of an abstract class,
    unless it is also an instance of a subordinate class. this is because the abstract
    class does not fully represent any object. An abstract class is written with the
    expectation that its subclasses will add to its structure and behavior.


    ```

    In C++, any class that declares or inherits a pure virtual function is an abstract
    class, and exists only to act as a base class for other classes. In fact, it is
    illegal in C++ to create an instance or an object of an abstract class!

    ```'
