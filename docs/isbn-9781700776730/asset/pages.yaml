  md: "# Arrays of Class Objects\n\nJust as we can declare arrays of common data types,\
    \ we can declare arrays of class objects. For example, we can declare an array\
    \ of 5 Elevator objects:\n\n```\n// el.cpp\n#include <iostream>\n#include \"elevator.h\"\
    \n\nusing namespace std;\n\nint main() {\n    Elevator e[5];\n    ...\n}\n}\n\
    ```\n\nStorage for the entire array is allocated on the stack as shown below:\n\
    \ncreated on stack\nne\n\n| 0 | Elevator object |\n| 1 | Elevator object |\n|\
    \ 2 | Elevator object |\n| 3 | Elevator object |\n| 4 | Elevator object |\n\n\
    There's only one hard and fast rule to remember: class objects to be stored within\
    \ arrays must have default constructors. The default constructors could either\
    \ be provided by the compiler or the programmer. However, if the programmer declares\
    \ a constructor and does not provide a default constructor, the default constructor\
    \ provided by the compiler is gone."
