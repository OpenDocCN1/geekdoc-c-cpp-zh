  md: "# Virtual Function Mechanism\n\nIt is easier to understand how the compiler\
    \ locates virtual functions at runtime considering the data structures involved\
    \ and the memory layout used with class objects using virtual functions. Let's\
    \ do an experiment and look at the sizes of some objects:\n\n```\nclass Alpha\
    \ {\nprivate:\n    int i;\npublic:\n    void foo() {}\n    void faa() {}\n};\n\
    \nclass Beta {\nprivate:\n    int i;\npublic:\n    virtual void foo() {}\n   \
    \ void faa() {}\n};\n\nclass Gamma {\nprivate:\n    int i;\npublic:\n    virtual\
    \ void foo() {}\n    virtual void faa() {}\n};\n\nint main() {\n    Alpha a;\n\
    \    Beta b;\n    Gamma g;\n\n    cout << sizeof(Alpha) << endl; // 4\n    cout\
    \ << sizeof(Beta) << endl; // 8\n    cout << sizeof(Gamma) << endl; // 8\n\n \
    \   cout << sizeof(a) << endl; // 4\n    cout << sizeof(b) << endl; // 8\n   \
    \ cout << sizeof(g) << endl; // 8\n\n    void *voidPointer;\n    cout << sizeof(voidPointer);\
    \ // 4\n    return 0;\n}\n```"
  merge: -1
  img_proc: true
- pgno: 410
  md: "Looking at the size of various classes and objects, we find a difference in\
    \ size when one or more of the functions are virtual. Whenever a class has one\
    \ or more virtual functions, the size of that class is increased by 4 bytes or\
    \ one pointer size. This extra pointer data member that has secretly been inserted\
    \ into the class by the compiler is called the vpointer or vptr.\n\nThe vptr contains\
    \ the address of an array of function pointers called the vtable. The vtable contains\
    \ the addresses of (pointers) to all the functions that have been declared virtual\
    \ in the class or in any inherited class. Every object of a class containing a\
    \ virtual function is provided with a vptr to the vtable for the class.\n\nLet's\
    \ take another look at our Gamma class:\n\n```\n```cpp\nclass Gamma {\nprivate:\n\
    \    int i;\npublic:\n    virtual void foo() {}\n    virtual void faa() {}\n};\n\
    ```\n```\n\nHere is a picture of what the data structures look like:\n\n| class\
    \ object | vtable |\n| --- | --- |\n| | i | ==> 0 | &foo() ===> Gamma::foo |\n\
    | | | |\n| | vptr | == 1 | &faa() ===> Gamma::faa |\n\nWhen an object is created,\
    \ the appropriate vtable address is inserted into the objects vptr. The vptr is\
    \ initialized to the starting address of the vtable in the constructor, so there's\
    \ no chance of making a virtual function call before the vptr has been initialized.\
    \ This is accomplished by secret code inserted into the constructor by the compiler.\
    \ Note that if a vptr wasn't initialized, you'd have a disaster the first time\
    \ you make a function call. This is an essential reason why the compiler automatically\
    \ creates a default constructor if you don't explicitly create any constructors.\
    \ One job of the generated default constructor is to initialize the vptr."
  merge: -1
  img_proc: true
- pgno: 411
  md: "When you make a call to a virtual function, the compiler doesn't execute a\
    \ normal function call that is an absolute call to some address. This would be\
    \ early or static binding that is what a C compiler always does. We don't want\
    \ that for here! Instead, after the compiler performs the usual type checking\
    \ for a function call, the compiler inserts a special bit of code that says:\n\
    \n+   - go to the address pointed to by the vptr\n- index into this array by x\
    \ places and call that function\n\nSo the exact function call is determined at\
    \ runtime by which vtable address is in the vptr. Note that the order of functions\
    \ in the vtable is crucial since the compiler calls the function by indexing into\
    \ the table. Therefore, all the vtables must have the same order of functions.\
    \ This fixed index remains associated with the particular virtual function throughout\
    \ the inheritance hierarchy. Fortuntately, this is all taken care of by your compiler!\n\
    \nKeep in mind that each derived class has its own vtable. For each derived class,\
    \ the vtable of the base class is duplicated and if a virtual function is redefined\
    \ in the derived class, then its address replaces the address of the corresponding\
    \ function from the base class. Any new virtual functions defined in the derived\
    \ class are appended to the end of the vtable. For example, shown below is a base\
    \ class with three virtual functions declared:\n\n```\nclass Base {\n  private:\n\
    \    int i;\n  public:\n    virtual void foo();\n    virtual void faa();\n   \
    \ virtual void laa();\n};\n```"
  merge: -1
  img_proc: true
- pgno: 412
  md: "The internal data structures that created are shown below:\n\n| Base class\
    \ object | Base vtable |\n|---|---|\n| i | |=> 0 | &foo() ==> Base::foo() |\n\
    | | | | | |\n| vptr ======= | 1 | &faa() ==> Base::faa() |\n| | | | |\n| | 2 |\
    \ &laa() ==> Base::laa() |\n\nA derived class is declared as follows:\n\n```\n\
    class Derived : public Base {\npublic:\n    virtual void faa();\n    virtual void\
    \ taa();\n};\n```\n\nIts internal data structures are shown below:\n\n| Derived\
    \ class object | Derived vtable |\n|---|---|\n| i | |=> 0 | &foo() ==> Base::foo()\
    \ |\n| | | | | |\n| vptr ======= | 1 | &faa() ==> Derived:faa() |\n| | | | | |\n\
    | | 2 | &laa() ==> Base::laa() |\n| | | | | |\n| | 3 | &taa() ==> Derived::taa()\
    \ |"
  merge: -1
