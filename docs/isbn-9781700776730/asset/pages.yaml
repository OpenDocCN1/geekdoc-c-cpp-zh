  md: '# Derivation


    C++ implements inheritance through the mechanism of derivation. A derived class
    is derived from a base class and inherits all the data members and member functions
    of the base class.


    ![](img/88ecbb96455b36fdc78e686bde4f5234_318_0.png)


    +   - Many classes might be derived from a single base class.

    - A derived class may itself be a base class from which additional classes are
    derived.


    Thus, we can build up a class hierarchy where each class can serve as a parent
    or root for a new set of classes.'
  merge: -1
  img_proc: true
- pgno: 319
  md: '![](img/88ecbb96455b36fdc78e686bde4f5234_319_0.png)


    This is all single inheritance because all derived classes possess only one parent
    each. Note that there is no set limit on the number of classes that may be derived
    from one another.


    So inheritance allows you to collect related classes into a hierarchy with the
    classes at the top serving as abstractions for those below. This implies that
    a derived class is a specialization of its parent class, i.e., the derived class
    “is” type of base class, but with more detail added. For this reason, the relationship
    between a derived class and its base class is called an is-a relationship.


    The base class remains unchanged by this process of inheritance regardless of
    the number of classes that are derived from it. Therefore a derived class is always
    at least as big as its parent class so that an instance of the derived class always
    contains all of the members of its parent class.


    Note that you cannot subtract or remove anything from a parent class. However,
    accessing the inherited members is a different matter we''ll look at later, i.e.,
    just because you happen to derive a class does not mean that you are automatically
    granted complete and unlimited access privileges to the members of the base class.'
