    \ s2);\n    }\n    virtual ~Derived() {\n        cout << \"Derived destructor\"\
    \ << endl;\n        delete [] buf2;\n    }\n};\n\nint main() {\n    Base *pbase\
    \ = new Derived(\"Haley\", \"Laurel\");\n\n    delete pbase;\n    return 0;\n\
    }\n```\n\nOutput:\nDerived destructor\nBase destructor\n\nFocus on Object-Oriented\
