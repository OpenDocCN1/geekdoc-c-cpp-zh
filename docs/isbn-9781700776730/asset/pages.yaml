- pgno: 431
  md: '# Final Comment on Multiple Inheritance


    Multiple inheritance is a feature that was added to the C++ language after its
    initial release amidst much arguing for and against. The object-oriented programming
    language gurus are still arguing over whether multiple inheritance is a bug or
    a feature of C++ because the presence of multiple inheritance and virtual functions
    make it possible to design inadvertent ambiguities into your program that can''t
    be detected until runtime.


    Multiple inheritance has been considered the goto''s of the 90''s and is something
    that you should know about, but generally avoid.'
