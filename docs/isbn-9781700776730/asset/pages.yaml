  md: '• Except in case 4, the initial array elements are undefined. Once an IntArray
    object has been created, its size cannot be changed, and each object should use
    enough storage to hold its elements, plus a fixed amount of space for bookkeeping
    information.


    • Elements of an IntArray are accessed using the standard C style array indexing
    notation. If the index falls outside the legal range, an error message should
    be printed, and the program should simulate a halt.


    • IntArray objects may be assigned to each other if they have the same number
    of elements. The indices will not match, and the indices of the target object
    will not change; only the elements will be copied. If the sizes of objects being
    assigned doesn''t match, an error message should be printed, and the program should
    simulate a halt.


    • Two IntArray objects can be compared using the == and != operators. If the arrays
    have the same number of elements and each of the corresponding elements match,
    the objects are equal and the comparison operator (==) should return a non-zero
    value, even if their indices are different. Comparing IntArray objects with different
    number of elements is legal, and the result is always zero. The != operator should
    return zero whenever == would return non-zero, and vice versa.


    • Class IntArray should also overload the operators below. An error should be
    generated if the arrays are of a different size.


    | | allows index range checking |

    | + | allows the sum of two arrays to be assigned to a third array |

    | += | allows the sum of two arrays to be assigned to the first array |

    | << | allows the contents of an array to be output |


    The IntArray class has high() and low() member functions that return the maximum
    and minimum legal index for a given array as defined by the driver (user).'
