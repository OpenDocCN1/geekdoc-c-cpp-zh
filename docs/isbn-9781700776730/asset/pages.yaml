- pgno: 177
  md: "To generate a name, the C compiler simply adds underscore to the function name\
    \ (there's no information about the argument types that would make the function\
    \ name unique);\n\nA C++ compiler generates unique names by combining the name\
    \ of the function as given in the source code with information about its argument\
    \ types. This encoding is sometimes called name mangling, because the function\
    \ name and its argument types are mangled together to create the name used in\
    \ the assembly language. For example, the following C++ code:\n\n```\nvoid foo(int);\n\
    void foo(char*);\nvoid foo(double);\nint main() {\n  foo(5);\n  foo(\"Haley\"\
    );\n  foo(5.5);\n}\n```\n\nmight generate the following calls:\n\n```\ncall ?foo@@YAXH@Z\n\
    call ?foo@@YAXPAD@Z\ncall ?foo@@YAXN@Z\n```\n\nNotice that extra characters have\
    \ been added. The characters after the @ signs contain argument type information.\
    \ Thus, name encoding generates unique names by combining the name of the function\
    \ with its argument types, so you can overload the same function name using different\
    \ argument lists.\n\nName encoding is also used to generate the names of class\
    \ member functions, by combining the function name and argument types with the\
    \ class name. For example:\n\n```\nclass button {\nprivate:\n  int pressed;\n\
    public:\n  void push();\n};\n```\n\nFocus on Object-Oriented Programming with\
    \ C++    Page 170"
