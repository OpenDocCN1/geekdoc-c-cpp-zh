  md: "```\n// word9 output\n3\n3\n```\n\nExample 1 is just like any other member\
    \ function. Example 2 is unique to static member functions by specifying the class\
    \ using the scope resolution operator. This can be an important way to call the\
    \ static function because it doesn't require a reference to an object. Calling\
    \ a static member function for an object when it doesn't actually use or modify\
    \ that particular object can be confusing to the reader of the code.\n\nRemember,\
    \ the address of the object, `this`, is not passed to a static member function;\
    \ therefore the static member function cannot access non-static data members,\
    \ i.e., it cannot access the member data of the object used to invoke the static\
    \ function. The only data member that can be accessed by a static member function\
    \ are static data members.\n\nIf a static member function needs access to the\
    \ member data of a class, it needs to be passed an explicit `this` pointer:\n\n\
    ```\n// word10.h\n#ifndef WORD10_H\n#define WORD10_H\n\nclass Word {\nprivate:\n\
    \    char *buf;\n    static int wordCount;\npublic:\n    Word(char *s);\n    static\
    \ int getCount(Word *w);\n};\n\n#endif\n```"
