- pgno: 344
  md: '# Constructors and Destructors with Derived Classes


    Recall that an instance of a derived class always contains the data members inherited
    from its base class. Therefore it logically follows that whenever a derived class
    instance gets created, two constructor functions are needed to ensure the proper
    initialization of all of the data members of the instance.


    So the constructor for the base class must somehow get control to do the initialization
    of base class members, and the constructor for the derived class must get control
    to initialize any new derived class data members. Fortunately, the compiler takes
    care of this problem, and will automatically call both constructors.


    This happens because soon as the derived class constructor gets control and establishes
    its formal arguments, the base class constructor will be called immediately. The
    only question now is, which base class constructor will be called?


    The answer is this: If you fail to tell the compiler which one to call, it will
    attempt to call the default constructor. Therefore, it''s always a good idea to
    have a default constructor present in a base class.


    On the other hand, you may explicitly tell the compiler which base class constructor
    to call by using the syntax in the derived class''s constructor initialization
    list. The constructor initialization list appears after the derived constructor
    header. It is preceded by a colon, and contains:


    +   * the base class name (which is the name of the constructor function)

    * a list of arguments between parentheses, as in any normal function call


    To explicitly invoke the base class default constructor, we leave the argument
    list empty.


    To repeat:


    Because the initialization of any new derived class members may be dependent upon
    the proper initialization of the base class members, the base class constructor
    would always get called first.


    As you expect, the destructor functions will get called in reverse order, i.e.,
    derived class first, and base class last.'
  merge: -1
