  md: '# To Leak Memory in C++


    This article appeared in the March 1997 issue of the C/C++ Users Journal (www.cuj.com)
    and appears here with the permission of Mark Briand, the managing editor. The
    article was written by Rodney B. Doe, P.E. who has a B.S. in Mechanical Engineering
    from the University of Washington in Seattle. He is employed as a Senior Software
    Engineer with Micro Encoder. Inc., in Kirkland. WA. He can be reached via e-mail
    at rodneyd@microen.com.


    Warning: These are untrained professionals at work here. Do not try this at home.


    It''s common practice in software engineering to dynamically allocate memory from
    the operating system for use by a process. C and C++ do not require a process
    to release this memory when it is no longer needed. When a process neglects to
    return memory to the operating system, the utility of memory is lost. Losing the
    use of memory in this manner is known colloquially as memory leakage.


    The purpose of this article is to describe the practicing software engineer how
    to achieve memory leakage using the C++ language. The tactics presented here are
    tried and have been proven in actual industrial practice. They are trivially easy
    to implement. Furthermore, these techniques are portable - they can be applied
    to any operating system. If used rigorously and diligently, they will provide
    an adequately debilitating stream of memory leaks for your application.


    # Tactic No. 1: Just Don''t Delete It


    If you like to keep things simple, then this is the memory leakage tactic for
    you. To use it, simply omit the applicable delete operator on memory that you
    have dynamically allocated with the new operator. Bear in mind, though, that using
    this technique will brand you as an amateur. Any decent memory error detection
    tool will flag it. For more insidious memory leakage tactics, read:


    # Tactic No. 2: Use Multiple Return Statements


    Remember when some doty old-covered college professor told you to use only one
    return statement in a function? Well, that professor knew nothing about how to
    leak memory. Using multiple returns actually allows you to exit a function before
    dynamically allocated memory is freed.'
