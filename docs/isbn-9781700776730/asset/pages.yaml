- pgno: 91
  md: '# Preprocessor Commands


    Just what are those preprocessor commands #ifndef, #define, and #endif anyway?
    Glad you asked!


    We''ve already seen the necessity for breaking our code into header files and
    definition files. Class declarations (the interface to a class) are always placed
    in the header file (.h) while the class definitions (the implementation to a class)
    are always placed in the definition file (.cpp).


    Suppose we have a String class defined in String.h and String.cpp. Now suppose
    we have code in another source file foo.h and foo.cpp that wants to create and
    manipulate objects of the String class. The only way for foo.cpp to compile (and
    recognize just what a String object is) would be to:


    ```

    #include "String.h"

    ```


    Perhaps in the same program we''re developing we also have need for faa.h and
    faa.cpp and the faa code also needs to create and manipulate String objects. Again,
    faa.cpp would need to:


    ```

    #include "String.h"

    ```


    to compile correctly. So far so good. Every .cpp file can be individually compiled.


    Now it''s time to link together all the object codes that were created through
    the individual compilation of each of the .cpp files. Unfortunately, the linker
    will find the declaration for the String class in each of the object codes and
    the linker will complain. It doesn''t want to see more than one String declaration!


    We can avoid this situation by using preprocessor commands that will tell the
    linker to only look at one String declaration. To do this, every header file will
    begin with:


    ```

    #ifndef NameOfHeaderFile

    #define NameOfHeaderFile

    ```'
  merge: -1
  img_proc: true
- pgno: 92
  md: 'The code for the header file should go here. The header file should end with:


    ```

    #endif

    ```


    When the linker sees the String declaration for the first time it will recognize
    that _NameOfHeaderFile has not yet been defined and will then define it and look
    through the header file code. It will look at all the code until it reached the
    #endif preprocessor command.


    If the linker sees another String declaration, it will have already defined _NameOfHeaderFile
    and will therefore ignore all declarations until the #endif statement.


    Problem solved.'
