- pgno: 13
  md: '# Abstract Data Types


    # Fundamental Data Types


    A data type provides a description of its variables that tells the computer things
    things as:


    +   - how much memory to allocate for a variable

    - how to interpret the data in that memory

    - what range of values can be assigned to a variable

    - what operations are permissible on that data


    We do not have to write a description for the int or float data type. The author
    of the compiler did that for us and built it into the compiler. Data types that
    are built in to a compiler in this way are known as fundamental data types.


    # Abstract Data Types


    Some programming languages have features that allow us to effectively extend the
    language by adding our own data types. A programmer-defined data type is called
    an abstract-data type (ADT) to distinguish it from a fundamental data type.


    The term abstract refers to the way in which a programmer abstracts some concepts
    from a mass of programming detail and unifies these concepts to create a new data
    type.


    # ADT''s in C++


    In C++ we can implement our own abstract data types by declaring C++ classes and
    we can operate on them as if they had been built into the C++ language. This language
    feature of C++ allows programmers to become, in effect, language designers.


    Being able to design and implement our own data types gives us lots of power that
    we can use to cope with programming large, complicated applications.'
  merge: -1
  img_proc: true
- pgno: 14
  md: "# Procedural Programming in C\n\nHere is an example of a C program that adds\
    \ ints:\n\n```\nint main(void) {\n    int a = 100;\n    int b = 200;\n    int\
    \ c;\n\n    c = a + b + 300;\n    printf(\"%d\\n\", c);\n}\n```\n\n# Big Numbers\n\
    \nNow suppose we wish to perform a similar calculation, but this time a and b\
    \ are big numbers, like the US national debt expressed in dollars. Such numbers\
    \ are too big to be ints on most computers:\n\n```\nint a = 12345678901234;\n\
    ```\n\nwould hopefully give us an error message and fail to compile.\n\nBig integers\
    \ have many practical applications, such as cryptography, symbolic algebra, and\
    \ number theory where it can be necessary to perform arithmetic on numbers with\
    \ hundreds or even thousands of digits.\n\nWe therefore need to construct a convenient\
    \ way to handle such numbers.\n\n# Solution 1 - C Program Using Procedure Library\n\
    \nWe can take advantage of a big integer library called BigInt for performing\
    \ very large integer arithmetic. The library defines a struct called BigInt for\
    \ representing big integers and defines a variety of functions for operating on\
    \ BigInt-type variables."
  merge: -1
