  md: "# Overloading Copy Constructors\n\nThe initialization of a instance with an\
    \ existing derived instance automatically invokes the copy constructor function\
    \ in the derived class. Remember, if you fail to write one, the compiler will\
    \ automatically supply one for you.\n\nNote that even if you write a copy constructor\
    \ for the base class, and someone derives a new class from that base class and\
    \ writes a copy constructor for the derived class, then a potential problem exists\
    \ because the compiler will not automatically invoke the copy constructor in the\
    \ base class when the copy constructor in the derived class is invoked. Instead,\
    \ the default copy constructor in the base class will get called!\n\nThe solution\
    \ to this problem is to make an explicit call from the derived class copy constructor\
    \ to the base class copy constructor. You do this using the constructor initialization\
    \ list to write the name of the base class copy constructor and, within parentheses,\
    \ the same argument that the derived class copy constructor received.\n\n```\n\
    // copyctor.cpp\n#include <iostream>\n\nuses namespace std;\nclass Base {\nprotected:\n\
    \    int bnum;\npublic:\n    Base(int x=0) : bnum(x) {\n        cout << \"base\
    \ constructor\" << endl;\n    }\n    Base(const Base& b) : bnum(b.bnum) {\n  \
    \      cout << \"base copy constructor\" << endl;\n    }\n    ~Base() {\n    \
    \    cout << \"base destructor\" << endl;\n    }\n    int getBnum() const {\n\
    \        return bnum;\n    }\n}\n```"
