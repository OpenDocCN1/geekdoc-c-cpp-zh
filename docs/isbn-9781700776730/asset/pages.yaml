- pgno: 136
  md: 'You can make this safe by first deleting second or assigning another pointer
    the

    value of second.


    ```

    delete second;

    second = third;      //OK

    or

    first = second;

    second = third;      //OK

    ```


    Note that giving second a value in other ways (NULL, new...) is just as much as

    error.


    Modern systems throw an exception when the allocator cannot allocate the

    requested cell. Older systems set the pointer to NULL when you call new and

    new has no cells to give. It can be tested for, but many programmers improperly

    ignore the tests.


    # Deleting Without Allocating


    We covered one of these problems above: deleting a pointer not allocated with

    new. As in the last sentence, we usually say "delete a pointer". Actually,

    though, it is not the pointer that is deleted. It is the thing that you points
    to. It is

    useful to keep this distinction in mind.


    It is a logical error to delete a NULL pointer. In C++ this is OK though, and
    the

    system will ignore it. Doing so sometimes indicates an error in your logic,

    however C may not be so friendly if you try to free a NULL pointer. It is an error

    to delete a dangling pointer. You might actually damage the

    free store mechanism itself. It might write garbage data into the cells that the
    free

    store uses for its own internal accounting.


    ```

    delete third;      // Serious Error, Potential free store damage

    ```


    See if you can (cautiously) write a program to test the effect of these errors.
    Note

    that some of them (dereferencing dangling pointers) can be very dangerous. If

    y restrict yourself to retrieving data from such dangling pointers, however, you

    extremely unlikely to do any damage.'
