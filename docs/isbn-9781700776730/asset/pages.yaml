- pgno: 425
  md: '# Introduction to Multiple Inheritance


    So far, derived and base classes have been related by single inheritance.

    Multiple inheritance describes a more complex relationship in which a single class
    inherits the data members and member functions from more than one base class.


    ![](img/88ecbb96455b36fdc78e686bde4f5234_425_0.png)


    To derive a new class from multiple base classes, we simply list the base class
    names after the new derived class:


    ```

    class D : public A, public B, public C {

    };

    ```


    Here, class D inherits from classes A, B, and C.


    The basic need for multiple inheritance occurs because in C++ it''s possible to
    grow inheritance hierarchies from scratch. This means you may purchase a class
    library from vendor A and from vendor B, each with its own inheritance tree. Because
    you may want to mix the characteristics of two or more independent class hierarchies,
    you need to be able to inherit from more than one class at a time.


    | Class 1 + | Class 2 = | Derived Class 3 |

    |---|---|---|---|

    | Boat + | Plane = | SeaPlane |

    | Date + | Time = | DateTime |

    | Painter + | Artist = | PortraitPainter |

    | Text Window + | Scrollable Window = | ScrollableTextWindow |'
  merge: -1
  img_proc: true
- pgno: 426
  md: "In multiple inheritance, a derived class receives all the inheritable properties\
    \ from all of the listed base classes. If a name conflict occurs, such as the\
    \ same name appearing in more than one base class (i.e., two base classes declaring\
    \ a member function or data member with the same name), the name is not overridden\
    \ in a derived class, it's use would be an error, even if members private or have\
    \ different sets of parameters.\n\nThe fix would be to use the scope resolution\
    \ operator to specify which one you intend to use:\n\n```\nclass A {\npublic:\n\
    \    int a;\n    void foo();\n};\nclass B {\nprivate:\n    int a;\n    void foo(int);\n\
    };\nclass C : public A, public B {\n};\nint main() {\n    C myObj;\n\nmyObj.foo();\
    \      // error - ambiguous\nmyObj.foo(5);     // error - ambiguous\nmyObj.a =\
    \ 3;      // error - ambiguous\nmyObj.A::foo(); // OK\nmyObj.A::a = 3;   // OK\n\
    \    return 0;\n}\n```"
  merge: -1
  img_proc: true
- pgno: 427
  md: "# Multiple Base Class Constructors\n\nA class derived from multiple base classes\
    \ might also need to call multiple base class constructors:\n\n```\nclass D :\
    \ public A, public B, public C {\npublic:\n    D() : A(), B(), C() {}\n};\n```\n\
    \nThis assumes that A, B, and C are classes with default constructors and class\
    \ D can call those constructors.\n\nNote that the constructors are called in the\
    \ order in which their base classes are declared. However, it is generally unwise\
    \ to devise classes that depend on other class objects to be constructed in a\
    \ particular order.\n\nAs a rule, classes should operate independently of each\
    \ other as possible."
  merge: -1
