    \    int getCount() { return count; }\n    Counter operator++() {\n      ++count;\n\
    \      return *this;\n    }\n};\n```\n\nSuppose we've worked long and hard to\
    \ make the Counter class operate just the way we want and we're pleased with the\
    \ results, except for one thing. We really need a way to decrement the count.\
    \ Perhaps we're counting people entering a bank and we want to increment the count\
    \ when they come in and decrement the count when they go out. So the count represents\
    \ the number of people in the bank at any moment.\n\nWe could insert a decrement\
    \ routine directly into the source code of the Counter class, but there are several\
    \ reasons why we might not want to do this:\n\n+   - The Counter class works very\
    \ well and has undergone many hours of testing and deging. (While this is an exaggeration\
    \ in this case, it might be true in a larger and more complex class.)\n\n+   -\
    \ If we start fooling around with the source code for Counter, the testing process\
