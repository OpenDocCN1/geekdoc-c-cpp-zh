  md: "# Using C Structs\n\nA program that uses lots of Time structs probably needs\
    \ functions to:\n\n+   - display times and dates\n- update struct members\n- compare\
    \ two dates\n\nIn C, you could write a display function like this:\n\n```\nvoid\
    \ display(struct Time *tp) {\n    printf(\"Date: %02d %02d / %04d\\n\", tp->month,\
    \ tp->day, tp->year);\n    printf(\"Time: %02d : %02d : %02d\\n\", tp->hour, tp->min,\
    \ tp->sec);\n}\n\n```\n\nTo display a date and time, a statement can pass to display()\
    \ the address of a Time struct, such as:-\n\n```\ndisplay(&appt);\n```\n\nSo far,\
    \ so good!!\n\n# Problems with C Structs\n\nConsider some problems that could\
    \ arise with the code.\n\nAfter designing a struct like Time and writing a zillion\
    \ date() and time() functions, you discover a superior way to store the date and\
    \ time that would greatly improve your program's runtime execution time or better\
    \ memory utilization.\n\nFor example, you might use a long int that represents\
    \ the number of seconds from a fixed date. This change also makes it possible\
    \ to use date and time library functions that recognize the date and time stored\
    \ in this way.\n\nToo bad you didn't think of this great idea earlier! To change\
    \ the program's representation at this late stage, you have to:\n\n+   - modify\
    \ the Time struct, deleting the current members and adding a new long int data\
    \ member... or you might not even decide to use a struct after all."
