  md: "Consider the following Stack class:\n\n```\n// stack.cpp\nconst int MAX = 100;\n\
    \nclass Stack {\nprotected:\n    int s[MAX];\nint top;\npublic:\n    Stack() {\
    \ top = -1; }\n    void push(int num) { s[++top] = num; }\n    int pop() { return\
    \ s[top--]; }\n};\n```\n\nThere is a potential flaw here. There is no check for\
    \ overflow or underflow.\n\nTo cure these defects, we will create a new class,\
    \ Stack2, derived from Stack. Objects of Stack2 behave exactly the same way as\
    \ those of Stack except that you will be warned if you attempt to push many items\
    \ on the stack, or if you try to push an item from an empty stack.\n\n```\nclass\
    \ Stack2 : public Stack {\npublic:\n    void push(int num) {\n        if (top\
    \ < MAX-1)\n            Stack::push(num);\n        else {\n            cout <<\
    \ \"Stack overflow.\";\n            exit(1);\n        }\n    }\n    int pop()\
    \ {\n        if (top > 0)\n            return Stack::pop();\n        else {\n\
    \            cout << \"Stack underflow.\";\n            exit(1);\n        }\n\
    \    }\n};\n```"
