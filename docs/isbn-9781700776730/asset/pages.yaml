  md: "# Data Types and Data Protection\n\nTypes = Structs + Functions\nWe're going\
    \ to take a look at how C++ implements new data types and makes\nuse of data protection.\n\
    \nC Structs\nSuppose we want to build a system consisting of several elevators.\
    \ In C,\ntypically attack the problem by creating a struct to hold data about\
    \ each elevator:\n\n```\nstruct elevator {\n    int floorSelected;\n    int floorNumber;\n\
    }\n```\n\nA structure created which holds all the information we want to remember\
    \ about\neach elevator. To create a variable, we use the struct keyword along\
    \ with the\nstructure name:\n\n```\nstruct elevator e;\n```\n\nor, we can use\
    \ the typedef identifier and say:\n\n```\ntypedef struct elevator Elevator;\n\
    Elevator e;\n```\n\nThe second example acts more like a built-in data type.\n\n\
    Pointers to C Structs as Function Arguments\nWhen we create a function to act\
    \ upon the struct, we must pass as an\nargument to the function pointer to the\
    \ struct."
  merge: -1
  img_proc: true
- pgno: 63
  md: "The function below initializes the fields of the struct:\n\n```\nvoid initialize\
    \ (Elevator *e) {\n  e->floorSelected = 0;\n  e->floorNumber = 0;\n}\n```\n\n\
    We create another function to select the floor:\n\n```\nvoid selectFloor(Elevator\
    \ *e, int floor) {\n  e->floorSelected = floor;\n}\n```\n\nWe can see that everywhere\
    \ we want to use the Elevator structure, we must be forced to dereference a pointer.\
    \ We are forced to use pointers rather than passing the Elevator struct by value\
    \ because we are modifying variables outside the scope of the function. Passing\
    \ the Elevator struct by value would simply make a local variable!\n\n# C++ Structs\n\
    \nLet's see how we might solve the same problem in C++.\n\nWe know that a type\
    \ has characteristics and behavior. C++ implements a type as an extended struct\
    \ that contains function declarations as well as data declarations. Collectively,\
    \ these are called members:\n\n+   - function members\n- data members\n\nData\
    \ members represent the state (characteristics) of the variable, and function\
    \ members represent the operations (behavior) that can be performed on the data\
    \ members."
  merge: -1
  img_proc: true
- pgno: 64
  md: "```\n#include <iostream>\n\nusing namespace std;\n\n#define FLOORS 10\n\nstruct\
    \ Elevator {\n    int floorSelected;\n    int floorNumber;\n    void initialize();\n\
    \    void selectFloor(int floor);\n    void go();\n};\n```\n\n# Member Function\
    \ Declarations\n\nIn C++, all member functions must be declared with full prototypes,\
    \ i.e., all the argument types must be declared before the function can be called.\n\
    \n+   - Functions are declared inside a struct.\n\n+   - The scope of these member\
    \ functions is the scope of the struct.\n\n+   - These are not global names.\n\
    \n# Scope Resolution Operator\n\nWhen defining member functions, we must tell\
    \ the compiler that the function is associated with a particular type using the\
    \ scope resolution operator (::).\n\n```\nElevator::initialize() {\n    floorSelected\
    \ = 0;\n    floorNumber = 0;\n};\n```\n\nThe member function is in the scope of\
    \ a struct, it has access to the other members of the struct. Therefore, no pointers\
    \ are necessary to access and modify the data members of the struct!"
