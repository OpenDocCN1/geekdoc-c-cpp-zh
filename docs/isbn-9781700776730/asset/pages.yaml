- pgno: 178
  md: "```\nint main() {\n  button b;\n  b.push();\n}\n```\n\nHere, the call to push\
    \ () generates the assembly-language call:\n\n```\ncall ?push@button@QAEXXZ\n\
    ```\n\nThis shows that name encoding also puts class member function names inside\
    \ their own scope, even if a class member function has the same name and argument\
    \ list as a global function or a member function from another class, there will\
    \ be no name clash.\n\n# Overloading Member Functions\n\nWe can also overload\
    \ member functions:\n\n```\nclass Point {\n  private:\n    int x, y;\n  public:\n\
