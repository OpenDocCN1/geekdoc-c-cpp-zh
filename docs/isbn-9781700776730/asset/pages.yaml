    \ _WORD6_H\n\nclass Word {\nprivate:\n    char *buf;\n    static int wordCount;\n\
    public:\n    Word(char *s);\n    int getCount();\n};\n\n#endif\n```\n\n```\n//\
    \ word6.cpp\n#include <string.h>\n#include \"word6.h\"\n\nint Word::wordCount\
    \ = 0;\n\nWord::Word(char *s) {\n    buf = strdup(s);\n    wordCount++;\n}\n\n\
    int Word::getCount() {\n    return wordCount;\n}\n```"
