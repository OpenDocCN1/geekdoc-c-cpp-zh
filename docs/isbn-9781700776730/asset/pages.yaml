    \ works exactly as if char had been built into the definition. This is the same\
    \ for the instantiations of all Stack objects. Note that this mechanism saves\
    \ our rewriting class declarations when the only variation would be type declarations.\n\
    \nThe principle motivation for the addition of templates to C++ is its support\
    \ for general-purpose collection classes. Not only can stacks of integers and\
    \ characters be created, but stacks of floats, stacks of strings, etc, can be\
    \ created. We can create stacks of any user-defined type!\n\n# // Record Class\
