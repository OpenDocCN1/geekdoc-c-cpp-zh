  md: 'C programmers will remember that such functions as printf() need to be told
    about:


    +   - both the variable to be displayed

    - and the variable type


    This older C syntax make,things less intuitive.


    Note that the send to operator (<<) can be cascaded. This allows a series of values
    to be sent to standard output.


    The >> operator is the extraction operator or get from operator. It takes the
    value from the stream object on its left and places it in the variable on its
    right.


    # iostream Manipulators


    Manipulators are operators used with the send to (<<) operator to modify the way
    data is displayed. The two most common manipulators are:


    +   - endl

    - setw


    endl generates a linefeed by inserting a linefeed into the output stream. It is
    equivalent to ''\n'', but also clears the buffer.


    setw causes the item following to be displayed in a field of the specified width.
    The default output field for a variable is just wide enough to hold the value.
    The setw manipulator acts on the number (or string) that follows it in the output
    stream. The item is displayed right-justified in the field.


    For example:


    ```

    cout << setw(8) << num << setw(12) << num << endl;

    ```


    Additional manipulators:


    ```

    cout << "The octal value is " << oct << num;

    cout << "The decimal value is " << dec << num;

    cout << "The hex value is " << hex << num;

    ```'
