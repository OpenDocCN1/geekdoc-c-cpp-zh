  md: 'Also, if a problem develops, debugging can begin with an examination of the
    class member functions because no other functions or statements in the program
    can have direct access to Time2''s private members. Keep in mind that functions
    in a class have access to one another, i.e., two class functions may call each
    other.


    setTime() and getTime() use the scope resolution operator with the class name
    Time2:: informing the compiler that these functions belong to the Time2 class.


    The program could declare other setTime() and getTime() functions and member functions
    in other classes without conflicting with those that belong to Time2.


    Inside the member function implementations, statements have direct access to the
    class''s data members (month, day, year, hour, minute, second).


    Note: in the main() function, because Time2''s data members are private to the
    class, it is no longer possible to assign values directly to a class object. In
    other words, statements like:


    ```

    appt.month = 9;

    ```


    would be illegal in main() and would be flagged by the compiler because month
    is private to the Time2 class and is therefore directly usable only by members
    of the same class.


    # Do classes waste memory?


    We have probably given the impression that each object created from a class contains
    separate copies of that class''s data and member functions. This might be a good
    first guess, since it emphasizes that objects are complete self-contained entities
    designed using the class specifier.


    However, things are not quite so simple. It''s true that each object has its own
    data items. But all objects in a given class use the same member functions which
    are created and placed in memory only once when they are defined by the class
    specifier.


    The data items, on the other hand, will hold different values. So there must be
    a separate instance of each member data in each object. Space for data is therefore
    created in memory when each object is instantiated or defined.'
