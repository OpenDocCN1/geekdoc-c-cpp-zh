  md: "# Memberwise Assignment\n\nConsider the following class declarations:\n\n```\n\
    class Alpha {\n    private:\n    char *buf;\n    int i;\n    double d;\n    public:\n\
    \    // appropriate constructors etc.\n};\n\nint main() {\n    Alpha a; // 1\n\
    \    Alpha b(5, 12.2, \"Hello\"); // 2\n    Alpha c(b); // 3\n    Alpha d = b;\
    \ // 4\n    a = d; // 5\n    return 0;\n}\n```\n\nStatement 1 creates a new Alpha\
    \ object a by a call to the default constructor.\n\nStatement 2 creates a new\
    \ Alpha object b by a call to the three arg constructor.\n\nStatement 3 creates\
    \ and initializes a new Alpha object c by a call to the copy constructor.\n\n\
    Statement 4 creates and initializes a new Alpha object d by a call to the copy\
    \ constructor.\n\nHowever, statement 5 has an operation that is fundamentally\
    \ different from the previous 4 operations, even though the same symbol = is used\
    \ to represent it. This statement sets the value of Alpha object a to the value\
    \ of Alpha object d, i.e., an assignment statement copies d into a. This act of\
    \ giving a new value to an object that already exists is called assignment.\n\n\
    This assignment involves (potentially) changing the value of Alpha object a but\
    \ does not create any new Alpha objects. Because no new Alpha objects are created,\
    \ no class constructors are called. Not even the class copy constructor is called!"
