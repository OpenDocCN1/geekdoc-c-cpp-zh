  md: "```\nvoid ChangeColor(HTHING hThing, int color) {\n  Thing *pThing = NULL;\n\
    \  if (IsValid(hThing) != false) {\n    pThing = new Thing(hThing);\n    pThing->Color(color);\n\
    \  }\n\n  // Which pThing is this?\n  delete pThing;\n}\n```\n\nIn this snippet,\
    \ two Thing pointers called pThing are declared. The one inside the if statement\
    \ points to an instance of a Thing object which is never deleted. The pThing that\
    \ does get deleted is NULL at the time of deletion. C++ guarantees that deleting\
    \ a null pointer is harmless. Thus, a memory error detection tool may not flag\
    \ this deletion as an error because you think it is a valid operation.\n\nA quick\
    \ glance at the above function makes you think pThing gets deleted, so there seems\
    \ to be no problem. This is a nice technique to skip past code reviewers.\n\n\
    # Tactic No. 4: Use delete on an Array\n\nTo use this, allocate an array with\
    \ the new operator (new[]) then release the memory with plain old delete, as in:\n\
    \n```\nchar *pBuf;\npBuf = new char[100];\ndelete pBuf;      // NOT delete[] pBuf;\n\
    ```\n\nProbably more than few readers are suddenly getting a nervous feeling in\
    \ the pits of their stomach. If you use the delete operator (and not the delete[])\
    \ operator to release an object that was allocated with new[], the resulting behavior\
    \ is currently undefined. Even if you get away with this operation now it could\
    \ bite you later. Or, it may simply leak the memory. Go ahead, suffer peril in\
    \ your life and use it literally.\n\n# Tactic No. 5: Practice Careless Polymorphism\n\
    \nThis tactic takes advantage of the fact that destructors are not inherited.\
    \ In C++, it is possible and in fact highly desirable to store the address of\
    \ a derived-class object as a pointer to its base class. You can polymorphic behavior\
    \ by referencing this derived class object through the base class pointer. The\
    \ following program\n\nFocus on Object-Oriented Programming with C++"
