  md: "# Reading Strings with Embedded Blanks\n\nTo read text containing blanks, we\
    \ can use another function, cin.get(), which invokes the member function get()\
    \ of the cin stream class.\n\n```\n#include <iostream>\n\nusing namespace std;\n\
    \nconst int MAX = 50;\n\nint main() {\n    char buf[MAX];\n    cout << \"Enter\
    \ a string: \";\n    cin.get(buf, MAX);\n    cout << \"You entered: \" << buf;\n\
    }\n```\n\n# Reading Past a Carriage Return\n\nHow can we read strings with multiple\
    \ lines? We can use the cin.get() function with a third argument which specifies\
    \ the character that tells the function to halt. The function defaults to newline,\
    \ '\\n', but we can call the function with some other character for this argument:\n\
    \n```\n#include <iostream>\n\nusing namespace std;\n\nconst int MAX = 50;\n\n\
    int main() {\n    char buf[MAX];\n    ncout << \"Enter a string: \";\n    cin.get(buf,\
    \ MAX, '$');\n    cout << \"You entered: \" << buf;\n}\n```\n\nNow you can type\
    \ as many lines of input as you enter the terminating character (or until you\
    \ exceed the size of the array). Remember, you must still press Enter after typing\
    \ the '$' character.\n\nFocus on Object-Oriented Programming with C++"
