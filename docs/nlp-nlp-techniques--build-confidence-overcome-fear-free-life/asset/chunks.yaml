    # Chapter 1 – Neuro Linguistic Programming & You

    This book is intended to be jam-packed with particle examples and action steps
    you can use to experience real, lasting change, and rest assured—we will get there!
    Before we do, however, a basic understanding of NLP and its core concepts will
    help you be more effective when putting the skills we cover into practice. So,
    let’s begin with a quick primer on the basics of NLP.


    ## What is Neuro Linguistic Programming?

    Neuro Linguistic Programming, or `NLP`, includes a number of mental processes
    and patterns that govern a person’s behavior, and also how flexible the person
    ’s mind is to change. `NLP` encompasses strategic thinking combined with cognitive
    and mental processes which make up a person ’s behavior. By understanding the
    concepts and techniques, `NLP` empowers you to develop your own state of excellence,
    while also creating views and assumptions, and learning how to change and communicate
    effectively with yourself, and your surrounding environment.


    Neuro Linguistic Programming is about discovering yourself, your purpose, and
    your identity, and then moving towards your state of true excellence. `NLP` is
    quite powerful, but also a lot of fun to put into practice!


    ## The Power to Change

    With `NLP`, you’ll learn effective techniques to let go of everything in your
    past that’s been holding you back (whether or not you realize it!) in order for
    you to have complete control of your life, and your future.


    Let’s try a simple exercise now. Start off with a few deep breaths. Allow your
    muscles to relax, and as your mind and body are beginning to relax, your eyes
    will become heavier with every breath you take.


    Visualize yourself walking into a stream: you are surrounded by trees, and the
    water is clear and clean. You are in a serene and tranquil place, all alone, and
    completely safe from harm. Now, see yourself lying in the water as your body begins
    to float. Your body weight is completely supported by the water beneath you.


    You begin to chant, “ I am safe, I am protected ”, and you start to notice the
    sounds of a waterfall. As it comes into sight, you can clearly distinguish the
    water cascading downwards, and you can feel the cool mist on your skin. You now
    move under the waterfall and feel as light as a feather, lighter than you have
    ever felt before, as you begin to let everything go.


    Now, you start to focus on what is right in front of you, a stream of water ready
    to continue the journey with you. The waterfall allows your focus to move into
    the present moment as you repeat the mantra, “ I believe what I do today has a
    direct influence on my future. I only think positive thoughts, since I am in control
    of my life. ”


    As you come out of the water you notice something different about yourself, your
    mood, and your mentality. You are starting to feel the energy and power that will
    propel you onwards.


    Now that you’ve completed that visualization exercise, take note of what you learned
    about yourself, your views, your beliefs, and your inhibitions. The more you practice
    this exercise, the more you’ll gain! Now, let’s learn how to overcome a common
    fear: the fear of failure.


    ## Overcoming a Fear of Failure

    One of the most common inhibitors of success is the fear of failure—ironic, isn’t
    it? The reality is, all fear is rooted internally; in your mind. This is good
    for us, because it means we can also use our minds to overcome and conquer this
    fear.


    You must not allow fear to stop you from achieving what you are meant to achieve.
    Once you release these fears, you’ll feel a weight lifted from your shoulders,
    and you’ll feel completely free to succeed.


    Let’s try another exercise: Begin by taking a deep breath. With every deep breath,
    your body relaxes more and more. Let go of all the tension you have in your muscles.
    Now, close your eyes while continuing to breathe deeply and as slowly as possible
    and allow both your mind and body to achieve a state of relaxation.

