- fmt: '

    Understanding the way the mind works is key. If you were to compare your body
    to a ship, you mind would be the captain that runs the ship. The thoughts that
    you focus on will determine the way the ship will travel. And sometimes, the captain
    allows the ship to go on auto-pilot, even if the ship doesn’t realize it.


    Feeding your mind with negative thoughts will only leave you negative and afraid.
    Conversely, nurturing positivity will create a positive and happy life. Which
    do you choose?


    Let ’ s try another exercise: Imagine that your mind is a car that is running
    on empty. The only way to reach your destination is to put some fuel in your car.
    In the same way, by feeding your mind positive fuel (thoughts), it will work in
    a far more positive, efficient manner. Positive fuel can take on all manner of
    guises such as reading thought enlightening books, watching a feel-good film,
    listening to upbeat music, meditating, sitting in the sun, or playing with your
    family or pet.


    Life is meant to be enjoyed! Think of all the things that make you happy whether
    this be hearing your children laugh or tasting your favorite cake. It really does
    not matter what reminder you use, providing it is something that makes you feel
    happy. Tell yourself: “ This is a great day. Everyday is a great day, and I am
    happy. I control my thoughts. I think positive thoughts, and I feel spectacular.
    ” Always fuel your mind with positive words and analogies. Always make sure that
    you are looking for things all of the time that make you feel positive.


    ## Creating and Organizing your Environment


    Your mind is only completely clear when you are focused and organized. The following
    is a great exercise in organization:


    Begin by imagining yourself going into a home that is already well-organized.
    Everything has a purpose and a place, whether it is functional, or simply there
    to add beauty.


    Hear yourself saying, “ This is who I am. I am an organized person who is capable
    of creating this environment. ” Visualize yourself as you continue to explore
    all of the areas of the home, and feel as the calm washes over you. Tell yourself,
    “ I am an organized person and my whole persona and environment reflect my simplicity
    and beauty. I happily commit to set 30 minutes a day to create this tranquil,
    calm environment.” Creating a peaceful, clean, organized space can have a much
    greater effect on your mood and productivity that you might think. Try it out
    and see!


    ## Feeling Like You Don ’ t Matter


    Many types of people put themselves down and belittle themselves, particularly
    those who are poor and have little or no education. They feel as though there
    is absolutely nothing they can do to improve their life; they feel helpless.


    If there are times when you feel as though you don’t matter, remember that each
    of us has a special gift—it may just be that you haven’t found it yet. The following
    exercise has been designed to help you understand you are just as worthy as everyone
    else:


    Get into your state of relaxation, using the breathing techniques we’ve learned.
    Now, start to ponder this idea: Have you ever wondered how all the stars in the
    night sky look the same, even though scientists have a name for some and not others?
    The reality is that every star is different, in the same way as every human is
    different. Even twins have their differences; this is because each individual
    is unique.


    You need to tell yourself, “ I am unique and there is no one quite like me. I
    am perfect just the way I am. I may have minor flaws, but I also have many of
    my own distinctive strengths. ” Remember, when others look down on you this is
    merely a reflection of their own behavior and mindset.


    How we view others is often a direct projection of how we view ourselves. If anyone
    ever does treat you poorly, or as if you don’t matter, the underlying reason is
    because that’s how they feel about themselves.


    If you as a person remain poor, this is because you are not giving yourself any
    kind of chance to improve your life. Repeat to yourself, “ I have my own skill
    set and I am using all of my skills to improve my own life. ”


    While some people view rich, wealthy people as selfish, another interesting viewpoint
    is this:


    Poor people are selfish. Anyone and everyone has a special gift that they can
    become so good at, the world would pay them for their expertise in this area.
    No matter what it is, someone out there will pay for it if you do it well. Poor
    people are selfish because they haven’t started sharing their gift with the world—they’re
    keeping it inside. Sharing your special gift—no matter what it is—will release
    this selfishness and attract wealth and abundance.


    # Chapter 3 – Exercises to Re-Energize & Rise Above Challenges


    There is no doubt that the daily grind can be exhausting and leave you feeling
    completely drained. This is one of the reasons why it is so important that you
    take the time to re – energize in order to get back to your full working potential
    without losing any time.


    The following exercise will help you re – energize and be ready to move on quickly:


    Begin by imagining that you are walking on a picture-perfect sandy beach surrounded
    by pristine waters. As you continue to walk further, you see that it is almost
    sunset and you have reached a stunning lagoon. While you watch the sun descending
    into the water you, stand and take in its total and utter beauty.


    You enter the water in the lagoon and feel the water lapping at your waist, and
    as you sit down you begin to float. Let yourself go as you are floating freely
    and your body begins to totally relax. You are now looking up into the night sky
    and the stars are twinkling and shining brightly. You see the Milky Way as it
    comes into full view, and you feel your body floating towards it. You are now
    floating deep into the galaxy as you begin to feel energized and completely relaxed.


    You body now starts floating back into the lagoon, the water has gone cold and
    you stand up feeling rejuvenated. You walk back along the beach feeling rested,
    and as you look back at the lagoon, you commit to memory the experience. You know
    that this is a place that you can come back whenever you feel the need to.


    ## Rise Above the Challenges in Life


    Everyone experiences ups and downs in life—we all know that! Nobody is immune
    to bad things happening when they’re out of your control, but what you can control
    is your reaction and your mindset. In a way, these bumps in the road are a gift.
    When you are faced with obstacles and challenges, you have to fight your way through
    and put in extra effort—it’s often that extra push that gets you the mountain!


    The following exercises will help you rise above the challenges and get you through
    whatever life decides to throw at you:


    Picture yourself in a scenario with someone that you had problems working with.
    Think about just one situation where you had a disagreement with this person.
    If a number of people and many situations spring to mind, set these aside, as
    you need to focus on one person and situation in every session.


    Visualize a scene where the person approaches you and begins an argument. As they
    continue to go on and on, imagine them shrinking until they stand about three
    inches in height. As they are shrinking, their voice also becomes more and more
    difficult to hear and understand. As the person shrinks, you are growing taller
    and taller until such a point that you are looming over them. You are now so tall
    that your head is almost in the clouds. Feel the fluffy clouds that surround you,
    and take in just how blue the sky is.


    Begin to tell yourself, “ I feel wonderful, I can rise above everything, I am
    bigger than anybody who puts me down. I am bigger than any of my problems, or
    any difficult situations that I may be faced with. ”

