    Tell yourself, “ I am far better off without these; I am healthy, strong and happy,
    and in complete control of my life. Most importantly, I feel great. ”


    ## Stop Procrastinating


    Some people put off doing things until later because they fear being criticized
    or failing. You can overcome this fear by thinking about all of your capabilities
    and positive attributes. For example, if you were given an assignment at work
    from your manager, instead of thinking “Why would my manager pile all this work
    on me?” Try reframing the situation as such: “My manager gave me this work because
    he knows, just as I know, that I am capable, intelligent, and produce quality
    work. My manager is trusts me and has faith in me to do a good job, and I know
    I can deliver and exceed his expectations.”


    Think about the first project that you completed and submitted to your manager
    and how you were commended for it. Now, visualize yourself in your daily routine.
    See yourself determined to finish whatever work you have in hand. Regroup your
    mind and take control. Tell yourself, “ I am finishing this work now. I have everything
    I need to finish my work now. I will not slack off or disappoint my boss. I am
    the best at what I do. ”


    ## Let Go of Your Emotions


    It’s easy to let emotions get the best of you when you haven’t yet learned to
    control them This can be an inhibitor at times, particularly when you need to
    make a firm decision. You need to be able to let your emotions and think rationally
    on demand.


    Try this example the next time you’re feeling overwhelmed by emotion:


    Practice deep, slow breathing and feel your body as it begins to completely relax.
    Be completely aware of all of your feelings and think about the issues that you
    have in hand. You must decide on something important right now, but you cannot
    think clearly because your judgment is being overshadowed by your emotions.


    Continue relaxing, but become aware and in touch with that feeling whilst you
    tell yourself, “ I am scared of making the incorrect decision. ” Acknowledge this
    feeling. Now visualize yourself drifting into a dark room, bringing your negative
    emotion with you. Begin to descend deeper and deeper into the dark. Understand
    why you feel this way. Search within yourself to find the source of your fear.
    Let your mind wander here.


    Now, feel your body floating away from the dark room yet leaving the negative
    emotions behind you. Feel your body going into a brighter room feeling far more
    relaxed. Now you can see clearly as you have released the negative emotion of
    fear and now you are ready to make that huge decision. Tell yourself, “ I am calm,
    relaxed, and I truly feel great. ”


    ## The Art of Negotiation


    If you want to communicate and negotiate with other people effectively, patience
    and understanding are valuable qualities to develop. When you are involved in
    discussions or meetings, it is inevitable that you will have disagreements along
    the way, where neither party is right or wrong: they each simply have their own
    beliefs. Having an open mind, and understanding and listening to what others have
    to say will help get you there.


    Repeat to yourself, “ I am open to other people ’ s opinions, I understand where
    they are coming from and I am willing to listen. I already know my own ideas,
    and it is time that I learn theirs, whether or not I end up agreeing with them.
    ”


    By undertaking this stance and seeing a situation through another’s eyes, you
    can negotiate a solution that everyone can at least tolerate Portray your position
    of power, the power of knowledge, respect, and inquisitiveness. Ask questions
    and understand the views of others. All the time you are asking questions, you
    are taking control and leading by example.


    When others have finished speaking, repeat what they have told you to ensure you
    have understood them. Although you are still in control, you have shown others
    that they too have a say in the decision making process.


    As you have exercised patience and open-mindedness, you can begin negotiating
    from the “ position of knowledge. ” This is how you can convince others to implement
    your ideal without appearing overbearing.


    # Chapter 5 – Improve Your Productivity and Overcome Your Fears


    Productivity creates a sense of accomplishment, boosts our self-esteem, and has
    a ripple effect—making us want to be even more productive on a regular basis,
    and making those around us want to be more productive as well! To maximize productivity,
    becoming a master of your mind and emotions is essential, so you can block out
    any distractions that might arise.


    Let’s go over some NLP techniques that will help you shut off distractions so
    you can stay completely focused on the task at hand:


    Begin by reaching a state of total relaxation using the deep breathing techniques
    discussed earlier. See yourself at your desk working on a project. Watching yourself
    from a detached perspective, notice how you are fully focused, yet completely
    calm and happy.


    Tell yourself, “ I am productive and focus on one task at a time. I easily stay
    calm and level-headed. I simply do things one at a time until I have completed
    everything. I start with the most difficult or most important, and I take time
    for short breaks but I easily return to the task when it’s time to do so. I am
    happy working on my tasks, and with each and every one I complete, I feel more
    energized and more productive. ”


    ## Let Go and Stop Criticizing Yourself


    Have you ever heard the term: “ I am my own worst enemy”? It’s unfortunate, but
    many people who don’t realize that we are in complete control of our mind and
    emotional state feel they are victim to their inner voice and self-criticism.


    As we’ve discussed, this inner voice comes from deep-rooted beliefs that we haven’t
    taken the time to truly understand and move past. When our subconscious beliefs
    are in conflict with our conscious decisions or actions, we hear this inner voice
    criticizing us. “I’m big-boned, and can never lose weight”, or “I was born poor
    and will always be poor”. We use these as excuses—a way to put off dealing with
    and resolving the deeper issues.


    When we achieve a state of deep relaxation and interact with our subconscious,
    we can ask it to help us in finding a permanent solution. Because of the subconscious
    mind’s immense power, it is not uncommon to resolve harmful beliefs in just a
    few sessions, or even in one session with the help of a trained professional.


    It’s very common for people to be overly-critical of themselves. However, you
    need to understand that no one is perfect, and everyone makes mistakes. As long
    as you learn from them, the mistakes are serving a purpose and actually helping
    you get to your goal!


    If self-criticism is something that you have difficulty with, try out the following
    technique:


    Begin by closing your eyes and achieving a state of deep relaxation. Revisit a
    time when you were overcritical of something that you did wrong. Rather than berating
    yourself for making the mistake, accept what has happened. Resolve the thought
    into one or two take-away bullet points that you learned from going through that
    issue. Now, visualize yourself floating far above the scene, taking with you only
    a piece of paper with your bullet points written down. Everything else about the
    situation is released and beneath you.


    Next, visualize yourself taking on a new project and completing it easily and
    perfectly. Let go of any self-criticism, embrace your weaknesses and enhance your
    strengths. Tell yourself, “ I am positive. I made a mistake, but I have learned
    from it and I am easily moving on. ”


    ## Reach Your Goals


    “Our deepest fear is not that we are inadequate. Our deepest fear is that we are
    powerful beyond measure. ” ~ Marianne Williamson


    Take a look at the above quote and let it sink in for a few minutes.

