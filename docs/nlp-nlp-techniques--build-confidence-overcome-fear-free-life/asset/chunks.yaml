    理解大脑运作的方式是关键。如果你把自己的身体比作一艘船，那么你的大脑就是运行这艘船的船长。你所关注的思想将决定船的行驶方向。有时，船长会让船只进入自动驾驶模式，即使船只本身并没有意识到这一点。


    用负面情绪滋养你的大脑只会让你变得消极和恐惧。相反，培养积极的心态会创造出积极幸福的生活。你选择哪一个？


    让我们尝试另一个练习：想象你的大脑是一辆没油的汽车。到达终地的唯一方法就是给你的车加油。同样，通过给你的大脑注入积极的燃料（思想），它将以更积极、更高效的方式运作。积极的燃料可以采取各种形式，如阅读启发思想的书籍、看治愈系的电影、听欢快的音乐、冥想、晒太阳，或者与家人或宠物玩耍。


    生活本就应该被享受！想想所有让你感到快乐的事，无论是听到孩子的笑声，还是品尝你最喜欢的蛋糕。使用什么提醒方式其实并不重要，只要它能让你感到快乐就好。告诉自己：“这是极棒的一天。每一天都是棒的一天，我很快乐。我控制自己的思想。我思考积极的想法，我感觉极了。”始终用积极的词汇和类比来滋养你的大脑。始终确保你一直在寻找那些让你感到积极的事物。


    ## 创建并组织你的环境


    只有当你专注且有组织时，你的大脑才会完全清醒。以下是一个极佳的组织练习：


    从想象自己进入一个已经收拾得整齐的家开始。一切都有目的和位置，无论是功能性的，还是仅仅为了美观。


    听见自己在说：“这就是我。我是一个有组织的人，有能力创造这种环境。”当你继续探索家的各个区域时，视觉化你的自己，感受平静流遍全身。告诉自己：“我是一个有组织的人，我的整个人格和环境都反映了我的简洁与美丽。我乐意承诺每天花
    30 分钟来创造这个宁静、平和的环境。”创建一个和平、整洁、有序的空间对你情绪和生产力的影响可能比你想象的要得多。试试看吧！


    ## 感觉自己不重要


    许多类型的人会贬低和不起自己，特别是那些贫穷且受教育程度低或没有的人。他们觉得对改善生活完全无能为力；他们感到无助。


    如果你有时觉得自己并不重要，请记住，我们每一个人都拥有一份特殊的礼物——可能只是你还没有发现它。以下练习旨在帮助你理解，你和每个人一样是有价值的：


    使用我们学过的呼吸技术进入你的放松状态。现在，开始思考这个想法：你是否曾好奇过为什么夜空中所有的星星看起来都一样，尽管科学家们给其中一些起了名字，而另一些则没有？事实是，每颗恒星都是不同的，就像每个人都是不同的一样。即使是双胞胎也有差异；这是因为每个个体都是独特的。


    你需要告诉自己：“我是独一无二的，没有人完全像我。我现在的样子就是完美的。我可能有微小的缺陷，但我也有许多自己的特长。”记住，当别人看不起你时，这仅仅是他们行为和心态的反映。


    我们如何看待他人往往是我们如何看待自己的直接投射。如果有人对你不好，或者表现得好像你不重要，深层是因为他们对待自己的方式也是那样。


    如果你作为一个体仍然贫穷，那是因为你没有给自己任何改善生活的机会。对自己重复：“我有我自己的技能组合，我正在运用所有的技能来改善自己的生活。”


    虽然有些人认为富人是自私的，但另一个有趣的观点是这样的：


    穷人是自私的。每个人都拥有一份可以非常擅长的特殊礼物，世界会为他们在该领域的专业知识付费。无论那是什么，只要你做得好，世界上就有人会为此买单。穷人是自私的，因为他们还没有开始与世界分享他们的礼物——他们把礼物藏在心里。分享你的特殊礼物——无论它是什么——都会释放这种自私，并吸引财富和丰盛。


    # 第三章 – 重新充满能量与超越挑战的练习


    毫无疑问，日常的忙碌令人筋疲，让你感到精疲力竭。这就是为什么花时间重新充满能量以便在不浪费任何时间的情况下恢复全部工作潜力如此重要的原因之一。


    以下练习将帮助你重新充满能量并准备好快速前进：


    从想象你正走在一片完美的沙滩上，周围环绕着清澈的海水。当你继续向前走时，你发现几乎已经是日落了，你到达了一个迷人的泻湖。当你看着太阳没入水中时，你站立，感受它完全彻底的美丽。


    你进入湖中，感到水拍打着你的腰部，当你坐下时，你开始漂浮。让自己随波逐流，自由地漂浮，身体开始完全放松。你现在仰望夜空，星星闪烁，光芒夺彩。你看到银河完全出现在眼帘中，你感到身体向它漂去。你现在向星系深处漂去，开始感到充满活力且完全放松。


    你的身体现在开始漂回泻湖，水变冷了，你站起来感到焕然一新。你沿着沙滩走回，感到精力充沛，当你回望泻湖时，将这段经历记在心中。你知道，每当需要时，都可以回到这里。


    ## 超越生活中的挑战


    每个人在生活中都会经历起伏——我们都清楚这一点！对于你无法控制的坏事，没有人能完全幸免，但你可以控制的是你的反应和心态。在某种程度上，道路上的坎坷是一份礼物。当你面对障碍和挑战时，你必须战斗过去并付出额外的努力——往往是那份额外的推力让你登顶高峰！


    以下练习将帮助你超越挑战，并应对生活抛给你的任何事情：


    想象自己正与某个合作起来困难的人相处。回想一个与此人发生分歧的情况。如果脑海中浮现出许多人和情况，请把它们搁置，因为你每次只需要专注于一个人和一个情况。


    视觉化这样一个场景：那个人走向你并开始争论。当他们持续下去时，想象他们缩小到只有三英寸高。随着他们的缩小，他们的声音也变得越来越难以听清和理解。随着那个人的缩小，你变得越来越高，直到你可以俯视他们。你现在变得如此高，头部几乎进入了云层。感受环绕着你的蓬松云朵，感受天空有多蓝。


    开始告诉自己：“我感觉极好，我可以超越一切，我比任何看不起我的人都伟大得多。我比我的任何问题或我可能面临的任何困境都伟大得多。”

