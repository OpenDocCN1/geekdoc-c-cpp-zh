- fmt: '

    Really think about this quote, and what it means to you. By understanding how
    our minds work, and using NLP techniques, you can truly achieve anything. Isn’t
    it interesting how it’s often the people who have the hardest lives who rise to
    the top, and those who are born privileged and spoiled end up wasting their lives
    away?


    All you need to do is believe. You should never set limitations on anything that
    you want to do. Begin by focusing on your goals; never lose sight of your hopes
    and dreams. By remaining focused you will not settle for anything less. It’s most
    often ourselves who set limitations, whether or not we tell ourselves that it’s
    someone or something else that’s holding us back.


    Tell yourself: “I can accomplish anything that I set my mind to, I am worthy of
    getting everything from this world because I am a winner. I may fail now and then
    with small things, but I will learn and rise again, and in the long run, I will
    prevail. I will use obstacles that get in my way as stepping stones to achieving
    my goals.”


    ## Be Assertive


    Your ideas are important, and they matter. Your voice and your opinion are your
    birthright, never let anyone tell you otherwise.


    Just because you are not the boss or in charge from a corporate standpoint, this
    does not mean that your ideas do not matter. Just because you don’t have a high-school
    diploma does not mean that you will never accomplish anything with your life.
    Just because you’ve had a hard past doesn’t mean you can’t create the future you
    desire and you deserve.


    Tell yourself, “ I am as capable as everyone else. I am even more capable that
    most people, because I understand the true power of my own mind. I have no fear
    of voicing my opinions and sharing my ideas. I am excited about learning new things
    and I impress others with what I can do. I am worthy of success, and I am a leader.


    ## Overcoming Fear


    One of the most common phobias that people suffer from is the fear of speaking
    in public. It’s actually the number one fear, above the fear of death! Wow!


    The reason people fail at anything is because they let their fear take over and
    get the better of them. It is only natural to feel nervous every time you need
    to speak in public. If you don’t feel a little nervous about something big like
    an event or a presentation, it’s not very important to you. However, if you have
    done the necessary preparation, there is absolutely no reason or point in being
    anxious to the point where it takes a toll on your performance.


    The following words have been designed to help you overcome a fear of public speaking:


    After achieving a state of relaxation, tell yourself, “ I am confident in my abilities.
    I believe in myself, and people love me. People find me friendly and warm, and
    they are drawn to me. These people respond to me because I have integrity and
    they enjoy being in my company. As soon as I get up to speak in front of people,
    they feel my warmth immediately. As I stand in front of these people calm and
    poised, I am able to connect with them deeply. I am confident when I deliver my
    presentation, and when I speak, people listen. I speak with conviction and authority.
    ”


    ## Conclusion


    Thanks again for downloading my book!


    I hope you’ve taken away an understanding of basic NLP principles, and why they’re
    so effective in improving confidence. ![puppy_please.jpg](Image00000.jpg)


    Did you like my book or find it helpful? [Leave me an honest Review on Amazon!](http://amzn.to/1J4o7XS)


    Thanks in advance :)


    To your success,


    John C. Stanford


    P.S. Don’t forget your free bonus!


