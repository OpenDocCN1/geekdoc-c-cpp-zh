- fmt: '

    Again, it truly is all about your mindset and how you handle the ups and downs
    of life. Will you accept the bumps in the road and allow them to weigh you down,
    or will you see them as learning opportunities and try something different to
    get to your goal? Knowing that the choice is yours is quite empowering!


    ## Fighting Stress


    We all encounter things each day that could cause stress in our lives, if we decide
    to let them. It’s important to recognize that we also have plenty of things in
    our lives each day that bring us joy, fulfillment, and other positive emotions.
    Cultivating the habit of focusing on the positives, rather than the negatives
    will aid in fighting off stress in the long run.


    That being said, even the most positive people will succumb to stress at times.
    And that’s totally ok! Know that you are not alone, and that tomorrow is a new
    day.


    When you truly feel stress weighing down on you, u se the following exercise.
    With each and every time you practice it, you’ll notice that you remain positive
    more and more frequently, and stress rears its ugly head less and less:


    Tell yourself, “ Everything is working out exactly as it should. I remain positive
    and calm. ”


    Think about a time that you stayed positive, even when you were faced with a large
    amount of work, or a particularly challenging situation. Realize that when you
    stay positive, you are in complete control. You remain totally focused on whatever
    task you have to hand.


    By continuing to keep a positive attitude, you can think clearly and see the most
    appropriate course of action for each individual problem. At this point, remind
    yourself: “ I know that am capable of working through this. I easily find the
    solutions to my problems, and I know exactly what I need to do and have no reason
    to worry. ” Allowing yourself to take deep and easy breaths, continue repeating
    this phrase until it sinks in. Eventually, you’ll it will begin to feel natural,
    and you’ll feel confident in the truth of that statement.


    ## Open up and Allow Yourself to Receive


    The law of attraction states that what we focus on and what we expect, becomes
    our reality. With this in mind, focusing on the positive outcomes you want in
    your life— not the negatives that might happen— is far more important than most
    people realize By staying positive, you attract even more positivity into your
    life!


    Think nothing but positive thoughts and reject any thoughts of poverty, illness
    and sadness. Replace these with thoughts of good health, happiness and financial
    security. There is nothing wrong with desiring wealth and happiness—it is your
    right as a human being to experience the best life you possibly can, and desiring
    to reach and exceed your true potential is not at all selfish.


    Tell yourself, “ I am open to everything that the world has to offer me; I am
    open to good health and happiness. ” “ I am a money magnet and attract wealth
    easily while remaining happy and healthy. Money, happiness, and good health flow
    freely in my life, and I am sharing them freely with the world.”


    ## Being Grateful


    Having a grateful attitude ensures that positive things continue to flow towards
    you. Noticing when you are receiving, and being grateful in these instances will
    ensure they keep coming. As you can see, grace ties in deeply with the law of
    attraction!


    If you find you need help feeling grateful, try the following:


    Visualize yourself up on the peak of a mountain. take in the magnificent view
    and revel in the beauty of the world around you. You have climbed to the highest
    peak and are surrounded by beautiful clouds. You take a step out onto one of the
    clouds, and it begins to move, carrying you safely along. You know the cloud is
    taking you to a fabulous place where you’ll find total calm and peace, you just
    don’t know exactly where yet. But, you’re excited, and open to this opportunity
    to see what the universe has in store for you.


    As the cloud transports you forward, you feel your body completely relaxing. Now,
    you are sinking into the calm of this beautiful place where the cloud has delivered
    you. The gentle breeze and the warmth of the sun penetrate your skin. Tell yourself,
    “ I am truly grateful for this stunning place, and I am so grateful to be right
    where I am, right in this moment. I have gratitude for everything that is all
    around me. I relish the peace and tranquility that I am experiencing at this point
    in my life. ”


    While you marvel at the beauty of the nature all around you, think about all of
    the good things that you currently have in your life. Think about your family,
    friends, your business, your house and all of the other good things that you can
    think of.


    Now focus again and tell yourself, “ I am grateful for the gift that is my life,
    my health, my spirit, my family, and my willingness to focus on myself and continually
    improve. ”


    As you continue to think of all of the wonderful things that you have in your
    life, recite all of the things that you are most grateful for. Feel the complete
    joy of being grateful for everything, big or small, that you have in your life
    today.


    # Chapter 4 - Take Charge & Kick Bad Habits


    A big part of feeling good is knowing that you look good—feeling confident in
    your skin! For example, if you want to lead a healthy lifestyle, but you are slightly
    overweight, losing the weight will help you feel good both physically, and mentally.
    As we’ve learned, you have the power to make this change, but also, the responsibility
    lies solely on your shoulders. Start by congratulating yourself with a big pat
    on the back for making the decision to take ownership and change your life in
    a positive way!


    Try this exercise: Picture yourself walking in your local park. There are many
    other people around who cannot help but look at you with admiring glances and
    all of your friends are also taking notice of how great you look. As you continue
    to walk, you feel lighter and bursting with energy. You feel completely fabulous
    in your new body, and as you walk back to your house, you catch sight of yourself
    in the window. You think and say to yourself, “ I am fit, I am healthy, I love
    the way I look right now with my new body. I am vibrant, I am happy, and I feel
    fabulous. ”


    From this moment onwards you need to commit yourself to changing your mentality
    to one where your health and confidence are priorities. Focusing on losing weight
    can sometimes cause people to take drastic measures, such as extreme dieting.
    These methods are short-lived, and often end in binging on unhealthy foods, ending
    with feelings of guilt, remorse, and failure.


    Instead, try changing your mindset to one that focuses on health and confidence.
    Feeling physically good, looking good, and nourishing your body appropriately
    are much more affective mindsets to adopt for long-term success. I know, because
    I’ve done it!


    ## Kicking Bad Habits


    If you want to make improvements to your life, you need to learn how to change
    your habits. Once you know how, it’s easy! For example if you want to lead a healthy
    lifestyle, you’d need to quit smoking—breaking the habit of reaching for a cigarette
    every time a certain emotion or thought arises.


    In order to start kicking any bad habits you may have, you need to practice the
    following:


    Begin by practicing deep and slow breathing until your whole body is completely
    relaxed. Think about the bad habits that you want to break in order to achieve
    a healthier, happier lifestyle. If you have a number of habits that you want to
    overcome, work through them one at a time.


    Using the smoking example: Start by telling yourself, “ I don’t smoke. It’s not
    who I am. I live a healthy lifestyle, and the thought of smoking disgusts me.
    ” Visualize yourself throwing away any packets of cigarettes and smoking paraphernalia,
    knowing that you are ridding yourself for good.

