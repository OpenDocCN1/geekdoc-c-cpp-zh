    告诉自己：“没有了这些，我好得多；我健康、强壮、快乐，并且完全掌控自己的生活。最重要的是，我感觉非常好。”


    ## 停止拖延


    有些人推迟做某事，是因为他们害怕被批评或失败。你可以通过思考自己的能力和积极特质来克服这种恐惧。例如，如果经理给你分配了一项任务，不要想“我的经理为什么要把这么多工作都堆给我？”，试着这样重构情境：“我的经理给我这项工作是因为他知道（正如我知道的那样），我有能力、聪明，并且能产出高质量的工作。我的经理信任我，对我能做好有信心，我知道我可以交付并超越他的预期。”


    回想你完成并提交给经理的第一个项目，以及你是如何获得表扬的。现在，想象你自己的日常生活。看到自己下决心完成手头上的任何工作。重新整绪思想，掌控局面。告诉自己：“我正在完成这项工作。我拥有完成工作所需的一切。。我不会偷懒，也不会让老板失望。在我所做的事情上是最优秀的。”


    ## 放下你的情绪


    当你还没有学会控制情绪时，很容易被情绪主宰。这有时会成为一种阻碍，特别是当你需要做出坚决决定时。你需要能够根据需要放下情绪并理智思考。


    下次当你感到被情绪淹没时，尝试这个例子：


    练习深长、缓慢的呼吸，感受你的身体开始完全放松。完全觉察你所有的感受，思考你手头的问题。你现在必须决定一些重要的事情，但你无法清晰地思考，因为你的判断被情绪掩盖了。


    继续放松，但要察觉并接触那种感觉，同时告诉自己：“我害怕做出错误的决定。”承认这种感觉。现在，想象自己漂入一个黑暗的房间，带着你的负面情绪。开始向黑暗的更深处下走。理解你为什么会有这种感觉。在内心寻找恐惧的源头。让你的思想在这里游走。


    现在，感受你的身体离开黑暗房间，将负面情绪留在了身后。感受你的身体进入一个更明亮的房间，感到放松得多。现在由于你释放了恐惧这种负面情绪，你可以清晰地看到，并准备好做出那个巨大的决定。告诉自己：“我很冷静、放松，我真的感觉非常好。”


    ## 谈判的艺术


    如果你想与他人有效地沟通和谈判，耐心和理解是需要培养的宝贵品质。当你参与讨论或会议时，不可避免地会在过程中产生分歧，双方并没有绝对的对错：他们只是各自有自己的信念。保持开放的心态，理解并倾听他人的意见将帮助你达到目标。


    对自己反复说：“我对他人的意见持开放态度，我理解他们的出发点，并愿意倾听。我已经明确了自己的想法，现在是时候学习他们的想法了，无论我最终是否认同他们。”


    通过采取这种立场并从他人的角度看问题，你可以谈判出一个所有人至少都能忍受的解决方案。展现你的权力地位、知识的权威、尊重和好奇心。提问并理解他人的观点。每当你提问时，你都在掌控局面并以身作则。


    当别人说完后，重复他们告诉你的话，以确保你已经理解了他们。虽然你仍然处于控制地位，但你向他人展示了他们在决策过程中也有话语权。


    当你练习了耐心和开放的心态后，你可以从“知识的立场”开始谈判。这就是你如何在不显得咄咄人的情况下，说服他人执行你的理想的方法。


    # 第 5 章 – 提高你的效率并克服恐惧


    效率创造成就感，提升我们的自尊心，并产生连锁反应——让我们想要在日常变得更有效率，也让我们周围的人也想变得更有效率！为了效率最大化，成为自己思想和情绪的大师至关重要，这样你就可以屏蔽任何可能出现的干扰。


    让我们回顾一些 NLP（神经语言程序）技术，这些技术将帮助你关闭干扰，让你能够完全专注于当前的任务：


    首先，使用之前讨论过的深呼吸技术进入完全放松的状态。看到自己坐在办公桌前处理一个项目。从一个抽离的角度观察自己，注意到你是如何全神贯注，却完全冷静快乐。


    告诉自己：“我很有效率，一次专注于一项任务。我很容易保持冷静和头脑清晰。我一次一次地做事情，直到完成所有工作。我从最困难或最重要的开始，我会留时间进行短时间的休息，但当需要时，我可以轻松回到任务中。我乐于处理我的任务，每完成完成一个，我都感到更有活力、更有效率。”


    ## 放下并停止自我批评


    你是否听过这个短语：“我是我自己最大的敌人”？遗憾的是，许多没有意识到我们完全掌控自己的思想和情绪状态的人，觉得自己是内在声音和自我批评的受害者。


    正如我们讨论过的，这种内在声音源于根深蒂固的信念，我们还没有花时间真正理解并超越这些信念。当我们的潜意识信念与意识决策或行动冲突时，我们会听到这种内在声音批评我们。“我骨架大，永远减不了重”，或者“我出生于贫门，将永远贫穷”。我们把这些当作借口——一种推迟处理和解决问题的方式。


    当我们进入深度放松并与潜意识互动时，我们可以要求它帮助我们找到永久的解决方案。由于潜意识巨大的力量，在专业人士的帮助下，在几次咨询后甚至一次咨询中解决有害信念，并不罕见。


    人们过度批评自己是非常常见的。然而，你需要理解没有人是完美的，每个人都会犯错。只要你从中学习，错误就会发挥作用，并实际上帮助你实现目标！


    如果你发现自我批评很困难，请尝试以下技术：


    首先闭上眼睛，进入深度放松的状态。回顾一次你对自己做错的事情过度批评的时刻。不要为犯错指备自己，接受发生的事。将这个想法转化为一两个你从解决该问题中学到的要点。现在，想象自己漂浮在场景上方，只带着一张写有你要点的纸。关于该情况的其他一切都释放了，并在你下方。


    接下来，想象自己接受一个新项目并轻松完美地完成它。放下任何自我批评，接纳你的弱点并增强你的优势。告诉自己：“我是积极的。我犯了一个错误，但我从中吸了教训，我正轻松地向前看。”


