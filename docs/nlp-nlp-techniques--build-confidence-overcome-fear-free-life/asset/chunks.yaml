  raw: 'Next, picture yourself on a completely empty street. While you walk around,
    take note of the structures and how neglected and dilapidated they look. The buildings
    have no signs, and the windows show there’s nothing inside. The buildings looks
    abandoned and dark. The wind starts blowing all of the dust up around you and
    you start to feel a bit scared. There is nowhere for you to hide; you stand there
    asking yourself how you even got here in the first place.


    Now, yo u sit down, and instead of being afraid you allow your mind begin to think
    happy thoughts. You think back to a specific happy memory from childhood, or from
    recently. Then, you start to think about how mesmerized and amazed you were at
    the first magic show you ever saw. You now start to think only positive thoughts
    as you start to open your eyes.


    You are still in the middle of the empty street, but you are no longer afraid.
    You know that this is not the destination you want, and it’s also not the destination
    that you deserve, so without any more time, you begin to walk straight ahead.
    Your focus is now completely absorbed in the path ahead of you and you push your
    fear aside as you continue walking. Your heart beats quietly as you see the emerging
    bright, new horizon.


    Slowly, you see yourself entering a new street where everything is bright and
    sunny. You see people laughing, talking and walking on the street. When you look
    around again you see all of the buildings and offices are bustling, full of people.
    You know in this instance that this is where you want to be and you are no longer
    scared.


    Patience is a Virtue


    While NLP is effective at making quick mental changes, it’s still important to
    realize and accept that everything in life is a process, and you need to work
    for your own success. While you’re pursuing your goals, realize that in most cases,
    they will not happen overnight. Making progress each day is the best course of
    action—focusing on the bigger picture will help you realize that each little setback
    is just that: a little setback in your grand journey towards success. Adopting
    this mindset will put your mind at ease.


    In order to utilize your patience, follow these proven steps:


    Using breathing techniques we’ve practiced in the first 2 exercises, get into
    a state of deep relaxation. Once there, tell yourself, “ I am patient and I understand
    that only the present exists. Tomorrow, and the concepts of the past remain elusive.
    ” This should then be followed by, “ I am patient. I let go of the past as it
    can never be relived. The future is nonexistent so there is no need or reason
    for me to worry about it. All that matters is what today brings. ”


    Be open with yourself and tell yourself, “ I am patiently developing and creating
    my future with what I think and do today. I will enjoy every moment. There is
    no reason for me to worry about my future. ” You need to tell yourself that you
    are patiently living in the present, safe in the knowledge that everything will
    come together eventually!


    Feel Good About You


    When you feel good about yourself, you stay positive when things don’t go as planned.
    This is exactly what you need to focus on in order to attract success into your
    life!


    Picture yourself on a giant movie screen that is directly in front of you. Look
    closely and visualize yourself clearly. Take in the color of your clothes, your
    facial expression, watch what you are doing and take in the scenery that is behind
    you. It is important for you to make all of the details as real as possible.


    Next imagine your “ screen self ” is feeling really good at this moment. See yourself
    and this version of you on the screen merging into one and by doing so you have
    allowed the real you to feel good too. Tell yourself, “ I deserve to feel good
    and deserve this. ” Continue to tell yourself how amazing you feel, reiterate
    and reinforce the ideal that you have never felt happier! Today marks a new stage
    in your life, where each day is the happiest one yet.


    Whenever you feel down because of stress or disappointments, try revisiting yourself
    on the screen, feeling fantastic.


    Resolve to m ake today the start of a new you; let ’ s begin by imagining you
    are standing in a fork in the road. Which direction will you choose? Will you
    go down the path that leads to success or the path which will ultimately lead
    you to failure? If you have chosen the former, don ’ t think you are in for a
    worry and stress free life. The confidence that you are on the path to success,
    however, makes any problem that arises into a minor bump in your path to success.
    These little bumps might even make success that much sweeter!


    Let ’ s start as we mean to go on and learn a meditation technique to achieve
    stillness and calm. This practice can be used any time, and for any exercise in
    this book in order to get into a state of mental and physical relaxation.


    Start by s itting somewhere comfortable. Close your eyes and take deep, slow breaths
    as you start counting down from 10 to 1, whilst accounting for each number as
    follows:


    10 – Allow your body to fully relax


    9 – Begin to feel yourself let go


    8 – See the number as you continue to immerse yourself deeper into relaxation


    7 – See the number clearly and let it go


    6 – At this point you are relaxing deeply


    5 – Take your time as you fall deeper and deeper into total body relaxation


    4 – Rid your mind completely of any thoughts or outside noises


    3 – See the number as you let everything go


    2 – You are falling further and deeper into total relaxation


    1 – You have now reached a state of complete, deep relaxation


    Once you have completed the above exercise, you’ll be in a state where your mind
    can accept anything you present it. You control all of your thoughts, so you have
    the power to truly access and reprogram your mind. Once in this state, the NLP
    techniques we cover will be even more effective than when fully conscious!


    # Chapter 2 – Setting the Stage For Confidence & Positivity


    Many people allow themselves to lose their positive nature over time, especially
    if life isn ’ t going to plan. Stress happens, and setbacks happen. Everyone,
    even the most successful people, experience pain in their lives. However, there
    is no reason to accept this state as permanent. You can help yourself move through
    any situation. Every time you need a boost to your confidence, simply breathe
    deeply and unleash your imagination!


    Let’s try another exercise: Start by letting your mind relax, and take deep, slow
    breaths. Once again, visualize yourself on a movie screen which is directly in
    front of you. You have complete control over your movie-screen self. Now, imagine
    that you are in a situation where you want to feel more confident. Visualize yourself
    clearly. For example, if you want to be more confident in order to present and
    pitch a project proposal to a group of potential clients, picture yourself in
    front of the client. See all of the images clearly: how you are dressed, your
    posture, what you are doing, the way your audience is reacting, and how they are
    interacting with you. Make these images vivid as possible.


    Reinforce the following to yourself: “ I am doing well, I can handle this. I feel
    great about myself, and I’m confident with all of the preparation and work I have
    done for this project. ”


    Reflect on what you see on the screen and imagine this all happening for real.
    Congratulate yourself for a job well-done! Remind yourself how confident you are
    in your skills and everything you are capable of achieving.


    Stay Positive


    Understandably, there are and will be times when it is hard to stay positive;
    particularly, if you are faced with a number of day-to-day challenges. Realizing
    that you are in control of your thoughts, and that you have the power to focus
    on, and manifest whatever you desire is one of the best parts about NLP.'
