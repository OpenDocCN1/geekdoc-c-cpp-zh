  # 第 1 章 – 神经语言程序与你

  这本书旨在充满大量的示例和行动步骤，你可以通过这些内容体验真实的、持久的改变，请放心——我们一定会做到！在此之前，对 NLP 及其核心概念有一个基本的了解，将帮助你在实践我们所涵盖的技能时更加有效。所以，让我们从
  NLP 基础的快速入门开始吧。


  ## 什么是神经语言程序？

  神经语言程序，简称 `NLP`，包含了许多管理个人行为的心理过程和模式，以及个人思想改变的灵活性。`NLP` 涵盖了战略思维以及构成个人行为的认知和心理过程。通过理解这些概念和技巧，`NLP`
  赋予你发展自己卓越状态的能力，同时创造观点和假设，并学会如何与你自己以及周围环境进行有效的沟通。


  神经语言程序关于发现你自己、你的目标和你的身份，然后向你真正的卓越状态迈进。`NLP` 非常强大，但付诸实践也很有趣！


  ## 改变的力量

  通过 `NLP`，你将学习有效的技巧来释放过去阻碍你的一切（无论你是否意识到！），让你对你的生活和未来拥有完全的控制。


  让我们现在尝试一个简单的练习。先深呼吸几次。让你的肌肉放松，当你的思想和身体开始放松时，随着每一次呼吸，你的眼睛都会变得沉重。


  想象自己正走进一条溪流：你被树木环绕，水质清澈洁净。你处于一个宁静祥和的地方，孤自一人，完全免受伤害。现在，看到自己躺在水中，身体开始漂浮。你的身体重量完全由下方的水支撑。


  你开始吟诵：“我是安全的，我是受到保护的”，并开始注意到瀑布的声音。当它出现在视线中，你可以清楚地分辨出倾泻而下的水，感受到脸上凉爽的水雾。现在你移动到瀑布下，感觉像羽毛一样轻，比以前任何时候都感觉更轻，随着你开始放下一切。


  现在，你开始关注正前方的事物，一条水流准备好与你继续旅程。瀑布让你的注意力移动到当下，你重复着咒语：“我相信我今天所做的一切对我的未来有直接影响。我只思考积极的想法，因为我掌控着自己的生活。”


  当你从水中走出来时，你注意到自己、你的心情和心态发生了变化。你开始感受到将推动你向前迈的能量和力量。


  现在你已经完成了那个视觉化练习，请记住你关于自己、观点、信念和抑制所学到的东西。你越练习这个练习，收获就越多！现在，让我们学会克服一种常见的恐惧：对失败的恐惧。


  ## 克服恐惧恐惧

  成功的最常见抑制之一是对失败的恐惧——真讽刺，不是吗？现实是，所有的恐惧都根于内在；在你的思想中。这对我们来说是好事，这意味着我们也可以利用思想来克服并征服这种恐惧。


  你绝不能让恐惧阻止你实现你应该实现的目标。一旦你释放了这些恐惧，你会感到肩上卸下了重担，你会感到可以完全自由地获得成功。


  让我们尝试另一个练习：从深呼吸开始。每一次深呼吸，你的身体都会变得越来越放松。释放你肌肉中所有的紧张感。现在，闭上眼睛，继续深且尽可能缓慢地呼吸，让你的思想和身体达到放松的状态。






  接下来，想象你正站在一条完全空旷的街道上。当你环顾四周时，留意建筑的结构以及它们看起来多么荒废和破旧。建筑没有任何招牌，窗户显示里面空无一物。建筑看起来被遗弃且阴暗。风开始吹起你周围的灰尘，你开始感到一丝恐惧。你无处可藏；你站在那里，问自己起初是如何来到这里的。


  现在，你坐了下来，不再感到恐惧，而是让大脑开始思考快乐的情绪。你回想起童年时期某个特定的快乐记忆，或者最近的记忆。然后，你开始回想起第一次看魔术秀时那种着迷和惊讶。当你开始睁开眼睛时，你现在只思考积极的念。


  你仍然站在空旷街道的中间，但你不再害怕了。你知道这不是你想去的地方，也不是你应得的地方，所以你不再浪费时间，开始径直向前走去。你的注意力现在完全被前方的道路吸引，你一边继续走一边将恐惧抛之脑后。当你看到出现的明亮、新的地线时，你的心脏安静地跳动。


  慢慢地，你看到自己进入了一条条新街道，那里的一切都是明亮阳光的。你看到人们在街道上笑着、聊天、行走。当你再次环顾四周，你看到所有的建筑和办公室都熙熙攘攘，满了人。你在此刻知道，这就是你想去的地方，你不再害怕了。


  ## 耐心是一种美德


  虽然神经语言程序（NLP）在快速改变心理方面非常有效，但意识到并接受生活中的一切都是过程，并且你需要为自己的成功而努力，这同样重要。在追求目标时，要意识到在大多数情况下，它们不会一夜之间实现。每天取得进步是最好的行动方案——关注大局将帮助你意识到，每一个小挫折都仅仅是：是你通往成功宏大旅程中的一个小插折。采取这种心态会让你的内心感到轻松。


  为了利用你的耐心，请遵循这些经过验证的步骤：


  使用我们在前两个练习中练习的呼吸技巧，进入深度放松的状态。到达那里后，对自己说：“我是耐心的，我理解只有现在是真实的。明天以及过去的概念都是难以捉摸的。” 接着应该是：“我是耐心的。我放下了过去，因为过去永远无法重演。未来是不存在的，所以我没有必要也没有理由担心它。所有重要的是今天带给我的什么。”


  对自己坦诚并对自己说：“我正在通过我今天的想法和行为，耐心地发展和创造我的未来。我会享受每一个时刻。我没有理由担心我的未来。”你需要告诉自己，你正耐心地生活在当下，并且知道一切最终都会汇聚在一起！


  ## 对自己感到良好


  当你对自己的感觉良好时，当事情没有按计划进行时，你也能保持积极。这正是你为了将成功吸引到生活中而需要关注的重点！


  想象自己正位于一个直接对着你的巨大银幕上。仔细观察并清晰地视觉化你自己。观察你衣服的颜色、面部表情，观察你在做什么，并感受身后的景色。对你来说，让所有细节尽可能真实是极其重要的。


  接下来，想象你的`屏幕自我`此时此刻感觉非常好。看到你自己和屏幕上那个版本的你合二为一，通过这种方式，你让真实的自己也感到良好。对自己说：“我值得感觉良好，也值得这一切。”继续告诉自己你感觉多么棒，重复并强化这种理想状态：你从未如此快乐过！今天标志着你生活中一个新阶段，每一天都是迄今为止快乐的一天。


  每当你因为压力或失望而感到低落时，尝试回想屏幕上的自己，感受那种奇妙。


  决心让今天成为新自我的开始；让我们从想象你正站在一个十字路口开始。你会选择哪个方向？你会走通向成功的道路，还是最终将带你走向失败的道路？如果你选择了前者，不要认为你将过上无忧无虑的生活。然而，这种你正处于成功之路上的信心，会让任何出现的问题变成你成功之路上的小坎石。这些小坎石甚至会让成功变得更加甜！


  让我们从初衷开始，学习一种冥想。


  # 第二章 – 为信心与积极铺平舞台


  许多人允许自己随着时间的推移失去积极性，尤其是当生活不顺从计划时。压力发生，挫折也会发生。每个人，即使是最成功的人，生活中也会经历痛苦。然而，没有理由接受这种状态是永久的。你可以帮助自己度过任何局面。每当你需要自信时，只需深呼吸并释放你的想象力！


  让我们尝试另一个练习：首先让你的大脑放松，深长而缓慢地呼吸。再次，视觉化自己正坐在正对着面前的电影幕上。你对你的屏幕自我拥有完全的控制权。现在，想象你处于一个你想感到更有信心的情境中。清晰地视觉化你自己。例如，如果你想在向潜在客户展示并推销项目提案时更有信心，就想象自己站在客户面前。看到所有的画面：你的穿装、你的姿态、你在做什么、观众的反应，以及他们如何与你互动。让这些图像尽可能生动。


  向自己强化以下内容：“我做得很好，我可以处理好。我对自己感觉极了，并且对我这个项目所做的一切准备和工作充满信心。”


  反思你在屏幕上看到的内容，并想象这一切真实发生。为你优秀的表现感到高兴！提醒自己你对自己的技能以及可能成就的一切充满信心。


  ```

  10 – 允许身体放松

  9 – 开始放手

  8 – 清晰看到数字

  7 – 继续沉浸在放松中

  6 – 在此点你正在深度放松

  5 – 花时间进入完全放松

  4 – 彻底清空大脑中的任何杂念

  3 – 看到数字

  2 – 你正在进入越来越深层的放松

  1 – 你现在处于完全放松的状态

  ```


  完成上述练习后，你将处于一个你的大脑可以接受你呈现的一切事的状态。在这种状态下，我们涵盖的 NLP 技术将比完全清醒时更加有效！





  理解大脑运作的方式是关键。如果你把自己的身体比作一艘船，那么你的大脑就是运行这艘船的船长。你所关注的思想将决定船的行驶方向。有时，船长会让船只进入自动驾驶模式，即使船只本身并没有意识到这一点。


  用负面情绪滋养你的大脑只会让你变得消极和恐惧。相反，培养积极的心态会创造出积极幸福的生活。你选择哪一个？


  让我们尝试另一个练习：想象你的大脑是一辆没油的汽车。到达终地的唯一方法就是给你的车加油。同样，通过给你的大脑注入积极的燃料（思想），它将以更积极、更高效的方式运作。积极的燃料可以采取各种形式，如阅读启发思想的书籍、看治愈系的电影、听欢快的音乐、冥想、晒太阳，或者与家人或宠物玩耍。


  生活本就应该被享受！想想所有让你感到快乐的事，无论是听到孩子的笑声，还是品尝你最喜欢的蛋糕。使用什么提醒方式其实并不重要，只要它能让你感到快乐就好。告诉自己：“这是极棒的一天。每一天都是棒的一天，我很快乐。我控制自己的思想。我思考积极的想法，我感觉极了。”始终用积极的词汇和类比来滋养你的大脑。始终确保你一直在寻找那些让你感到积极的事物。


  ## 创建并组织你的环境


  只有当你专注且有组织时，你的大脑才会完全清醒。以下是一个极佳的组织练习：


  从想象自己进入一个已经收拾得整齐的家开始。一切都有目的和位置，无论是功能性的，还是仅仅为了美观。


  听见自己在说：“这就是我。我是一个有组织的人，有能力创造这种环境。”当你继续探索家的各个区域时，视觉化你的自己，感受平静流遍全身。告诉自己：“我是一个有组织的人，我的整个人格和环境都反映了我的简洁与美丽。我乐意承诺每天花
  30 分钟来创造这个宁静、平和的环境。”创建一个和平、整洁、有序的空间对你情绪和生产力的影响可能比你想象的要得多。试试看吧！


  ## 感觉自己不重要


  许多类型的人会贬低和不起自己，特别是那些贫穷且受教育程度低或没有的人。他们觉得对改善生活完全无能为力；他们感到无助。


  如果你有时觉得自己并不重要，请记住，我们每一个人都拥有一份特殊的礼物——可能只是你还没有发现它。以下练习旨在帮助你理解，你和每个人一样是有价值的：


  使用我们学过的呼吸技术进入你的放松状态。现在，开始思考这个想法：你是否曾好奇过为什么夜空中所有的星星看起来都一样，尽管科学家们给其中一些起了名字，而另一些则没有？事实是，每颗恒星都是不同的，就像每个人都是不同的一样。即使是双胞胎也有差异；这是因为每个个体都是独特的。


  你需要告诉自己：“我是独一无二的，没有人完全像我。我现在的样子就是完美的。我可能有微小的缺陷，但我也有许多自己的特长。”记住，当别人看不起你时，这仅仅是他们行为和心态的反映。


  我们如何看待他人往往是我们如何看待自己的直接投射。如果有人对你不好，或者表现得好像你不重要，深层是因为他们对待自己的方式也是那样。


  如果你作为一个体仍然贫穷，那是因为你没有给自己任何改善生活的机会。对自己重复：“我有我自己的技能组合，我正在运用所有的技能来改善自己的生活。”


  虽然有些人认为富人是自私的，但另一个有趣的观点是这样的：


  穷人是自私的。每个人都拥有一份可以非常擅长的特殊礼物，世界会为他们在该领域的专业知识付费。无论那是什么，只要你做得好，世界上就有人会为此买单。穷人是自私的，因为他们还没有开始与世界分享他们的礼物——他们把礼物藏在心里。分享你的特殊礼物——无论它是什么——都会释放这种自私，并吸引财富和丰盛。


  # 第三章 – 重新充满能量与超越挑战的练习


  毫无疑问，日常的忙碌令人筋疲，让你感到精疲力竭。这就是为什么花时间重新充满能量以便在不浪费任何时间的情况下恢复全部工作潜力如此重要的原因之一。


  以下练习将帮助你重新充满能量并准备好快速前进：


  从想象你正走在一片完美的沙滩上，周围环绕着清澈的海水。当你继续向前走时，你发现几乎已经是日落了，你到达了一个迷人的泻湖。当你看着太阳没入水中时，你站立，感受它完全彻底的美丽。


  你进入湖中，感到水拍打着你的腰部，当你坐下时，你开始漂浮。让自己随波逐流，自由地漂浮，身体开始完全放松。你现在仰望夜空，星星闪烁，光芒夺彩。你看到银河完全出现在眼帘中，你感到身体向它漂去。你现在向星系深处漂去，开始感到充满活力且完全放松。


  你的身体现在开始漂回泻湖，水变冷了，你站起来感到焕然一新。你沿着沙滩走回，感到精力充沛，当你回望泻湖时，将这段经历记在心中。你知道，每当需要时，都可以回到这里。


  ## 超越生活中的挑战


  每个人在生活中都会经历起伏——我们都清楚这一点！对于你无法控制的坏事，没有人能完全幸免，但你可以控制的是你的反应和心态。在某种程度上，道路上的坎坷是一份礼物。当你面对障碍和挑战时，你必须战斗过去并付出额外的努力——往往是那份额外的推力让你登顶高峰！


  以下练习将帮助你超越挑战，并应对生活抛给你的任何事情：


  想象自己正与某个合作起来困难的人相处。回想一个与此人发生分歧的情况。如果脑海中浮现出许多人和情况，请把它们搁置，因为你每次只需要专注于一个人和一个情况。


  视觉化这样一个场景：那个人走向你并开始争论。当他们持续下去时，想象他们缩小到只有三英寸高。随着他们的缩小，他们的声音也变得越来越难以听清和理解。随着那个人的缩小，你变得越来越高，直到你可以俯视他们。你现在变得如此高，头部几乎进入了云层。感受环绕着你的蓬松云朵，感受天空有多蓝。


  开始告诉自己：“我感觉极好，我可以超越一切，我比任何看不起我的人都伟大得多。我比我的任何问题或我可能面临的任何困境都伟大得多。”




  再次，这完全取决于你的心态以及你如何处理生活中的起伏。你是选择接受路上的坎坷并让它们成为你的负担，还是将它们视为学习的机会，并尝试不同的方法来达到目标？意识到选择权掌握在自己手中是非常具有赋能意义的！


  ## 对抗压力


  我们每天都会遇到可能给生活带来压力的事情，只要我们决定让它们发生。重要的是，要意识到我们每天的生活中也有许多事情带带带来喜悦、成就感和其他积极的情绪。培养关注积极面而非消极面的习惯，从长远来看有助于对抗压力。


  尽管如此，即使是最乐观的人，有时也会屈服于压力。这完全没关系！要知道你并不孤单，明天又是新的一天。


  当你真正感到压力压得你喘不过气时，使用以下练习。每练习一次，你会发现自己保持积极的频率越来越高，而压力那张丑陋的脸出现的次数越来越少：


  对自己说：“一切都在按照应有的方式进行。我保持乐观和冷静。”


  回想一个你保持乐观的时刻，即使在你面对大量工作或极具挑战性的情况时也是如此。意识到当你保持乐观时，你是完全掌控局面的。你完全专注于手头上的任何任务。


  通过继续保持积极的态度，你可以清晰地思考，并为每个具体问题找到最合适的行动方案。此时，提醒自己：“我知道我有能力解决这个问题的。我可以轻松地找到问题的解决方案，我清楚地知道需要做什么，没有理由担心。”
  允许自己深而轻松地呼吸，不断重复这段话，直到它深入内心。最终，这会开始变得自然，你也会对这句话的真实性感到自信。


  ## 敞开并允许自己接收


  吸引力法则认为，我们关注和预期的将成为我们的现实。以此为念，关注你生活中渴望的积极结果——而不是可能发生的消极面——比大多数人意识到的要重要得多。通过保持积极，你会吸引更多的积极能量进入你的生活！


  脑海中只充满积极的想法，拒绝任何关于贫困、疾病和悲伤的思考。用健康、幸福和财务安全的想法来取代它们。渴望财富和快乐并没有错——作为人类，体验你可能最好的生活是你的权利，而渴望达到并超越你的真实潜力一点也不自私。


  对自己说：“我对世界提供给我的切都持开放态度；我对健康和快乐持开放态度。” “我是金钱磁，在保持快乐和健康的同时轻松吸引财富。金、快乐和健康在我的生命中自由流动，我正慷慨地与世界分享它们。”


  ## 感恩


  感恩的心态能确保积极的事情不断向你流向。注意到何时正在接收，并在这些时刻保持感激，将确保它们持续到来。正如你所见，优雅与吸引力法则密切相连！


  如果你发现自己需要帮助才能学会感恩，尝试以下方法：


  想象自己站在山顶。饱受宏丽的景色，沉浸在周围世界的美好中。你爬上了最高峰，被美丽的云朵所环绕。你迈步走向其中一片云朵，它开始移动，安全地载着你。你知道这云朵正带你走向一个奇妙的地方，在那里你会找到完全的宁静和和平，你只是不知道具体在哪里。但你很兴奋，并对这个机会持开放，看看宇宙为你准备了什么。


  随着云朵带你向前移动，你感到身体完全放松了。现在，你正陷入云朵带你来到这个美丽地方的宁静中。微风和阳光的温暖渗透进你的皮肤。对自己说：“我非常感激这个迷人的地方，我非常感激自己正处此时地，就在此刻。我对我周围的一切都怀有感激。我珍惜我生命这一阶段所经历的和平与宁静。”


  当你对周围自然的美丽感到惊叹时，想想你目前生活中拥有的所有美好事物。想想你的家人、朋友、你的事业、你的房子以及所有你能想到的其他好事。


  现在再次专注，并对自己说：“我感激生命这份礼物，感激我的健康、我的精神、我的家人，以及我关注自我并不断进步的意愿。”


  当你继续思考你生活中拥有的所有美妙事物时，背出你最感激的一切。感受对你今天生活中拥有的无论大小的所有事都满怀感激的完整喜悦。


  # 第 4 章 - 掌控局面并戒掉坏习惯


  感觉良好的很大程度上在于知道自己看起来很棒——对自己的外表感到自信！例如，如果你想过健康的生活方式，但你稍微超胖，减轻体重将帮助你在生理和心理上都感到良好。正如我们所学的，你有能力做出这种改变，但同时，责任完全落在你的肩上。先通过给自己拍拍掌来祝贺自己，因为你做出了掌握所有权并积极方式改变生活的决定！


  尝试这个练习：想象你在当地的公园里散步。周围有许多人忍不住用羡慕的目光看着你，你所有的朋友也注意到你看起来有多棒。随着你继续走，你感到身体变轻了，充满了活力。你对自己的新身体感到极极了，当你走回家的时，你在窗户里看到了自己。你思考并对自己说：“我很健壮，我很健康，我喜欢我现在的样子。我充满活力，我很快乐，我感觉极了。”


  从这一刻起，你需要致力于将心态转变为一种以健康和自信为优先的模式。关注减肥有时会导致人们采取极端措施，例如极端节食。这些方法是短暂的，并且往往以暴食不健康食物告终，并随着内疚、后悔和失败的感觉。


  相反，尝试将你的心态转变为关注健康和自信。身体感觉良好、看起来良好以及适地滋养身体是长期成功的更有效的心态。我知道，因为我做过！


  ## 戒掉坏习惯


  如果你想让生活有所改进，你需要学习如何改变习惯。一旦你知道了，就很简单了！例如，如果你想过健康的生活方式，你需要戒烟——打破每当某种情绪或想法出现时就伸手拿香烟的习惯。


  为了开始戒掉你可能任何坏习惯，你需要进行以下操作：


  从练习深呼吸和慢呼吸开始，直到整个身体完全放松。思考你为了获得更健康、快乐的生活方式而想要打破的坏习惯。如果你有许多想要克服的习惯，请一个一个处理。


  以吸烟为例：从对自己说开始：“我不抽烟。这不是我的本性。我过着健康的生活方式，抽烟的想法让我感到恶心。” 想象自己扔掉所有的烟盒和吸烟具，你知道你正在彻底摆脱它们。





  告诉自己：“没有了这些，我好得多；我健康、强壮、快乐，并且完全掌控自己的生活。最重要的是，我感觉非常好。”


  ## 停止拖延


  有些人推迟做某事，是因为他们害怕被批评或失败。你可以通过思考自己的能力和积极特质来克服这种恐惧。例如，如果经理给你分配了一项任务，不要想“我的经理为什么要把这么多工作都堆给我？”，试着这样重构情境：“我的经理给我这项工作是因为他知道（正如我知道的那样），我有能力、聪明，并且能产出高质量的工作。我的经理信任我，对我能做好有信心，我知道我可以交付并超越他的预期。”


  回想你完成并提交给经理的第一个项目，以及你是如何获得表扬的。现在，想象你自己的日常生活。看到自己下决心完成手头上的任何工作。重新整绪思想，掌控局面。告诉自己：“我正在完成这项工作。我拥有完成工作所需的一切。。我不会偷懒，也不会让老板失望。在我所做的事情上是最优秀的。”


  ## 放下你的情绪


  当你还没有学会控制情绪时，很容易被情绪主宰。这有时会成为一种阻碍，特别是当你需要做出坚决决定时。你需要能够根据需要放下情绪并理智思考。


  下次当你感到被情绪淹没时，尝试这个例子：


  练习深长、缓慢的呼吸，感受你的身体开始完全放松。完全觉察你所有的感受，思考你手头的问题。你现在必须决定一些重要的事情，但你无法清晰地思考，因为你的判断被情绪掩盖了。


  继续放松，但要察觉并接触那种感觉，同时告诉自己：“我害怕做出错误的决定。”承认这种感觉。现在，想象自己漂入一个黑暗的房间，带着你的负面情绪。开始向黑暗的更深处下走。理解你为什么会有这种感觉。在内心寻找恐惧的源头。让你的思想在这里游走。


  现在，感受你的身体离开黑暗房间，将负面情绪留在了身后。感受你的身体进入一个更明亮的房间，感到放松得多。现在由于你释放了恐惧这种负面情绪，你可以清晰地看到，并准备好做出那个巨大的决定。告诉自己：“我很冷静、放松，我真的感觉非常好。”


  ## 谈判的艺术


  如果你想与他人有效地沟通和谈判，耐心和理解是需要培养的宝贵品质。当你参与讨论或会议时，不可避免地会在过程中产生分歧，双方并没有绝对的对错：他们只是各自有自己的信念。保持开放的心态，理解并倾听他人的意见将帮助你达到目标。


  对自己反复说：“我对他人的意见持开放态度，我理解他们的出发点，并愿意倾听。我已经明确了自己的想法，现在是时候学习他们的想法了，无论我最终是否认同他们。”


  通过采取这种立场并从他人的角度看问题，你可以谈判出一个所有人至少都能忍受的解决方案。展现你的权力地位、知识的权威、尊重和好奇心。提问并理解他人的观点。每当你提问时，你都在掌控局面并以身作则。


  当别人说完后，重复他们告诉你的话，以确保你已经理解了他们。虽然你仍然处于控制地位，但你向他人展示了他们在决策过程中也有话语权。


  当你练习了耐心和开放的心态后，你可以从“知识的立场”开始谈判。这就是你如何在不显得咄咄人的情况下，说服他人执行你的理想的方法。


  # 第 5 章 – 提高你的效率并克服恐惧


  效率创造成就感，提升我们的自尊心，并产生连锁反应——让我们想要在日常变得更有效率，也让我们周围的人也想变得更有效率！为了效率最大化，成为自己思想和情绪的大师至关重要，这样你就可以屏蔽任何可能出现的干扰。


  让我们回顾一些 NLP（神经语言程序）技术，这些技术将帮助你关闭干扰，让你能够完全专注于当前的任务：


  首先，使用之前讨论过的深呼吸技术进入完全放松的状态。看到自己坐在办公桌前处理一个项目。从一个抽离的角度观察自己，注意到你是如何全神贯注，却完全冷静快乐。


  告诉自己：“我很有效率，一次专注于一项任务。我很容易保持冷静和头脑清晰。我一次一次地做事情，直到完成所有工作。我从最困难或最重要的开始，我会留时间进行短时间的休息，但当需要时，我可以轻松回到任务中。我乐于处理我的任务，每完成完成一个，我都感到更有活力、更有效率。”


  ## 放下并停止自我批评


  你是否听过这个短语：“我是我自己最大的敌人”？遗憾的是，许多没有意识到我们完全掌控自己的思想和情绪状态的人，觉得自己是内在声音和自我批评的受害者。


  正如我们讨论过的，这种内在声音源于根深蒂固的信念，我们还没有花时间真正理解并超越这些信念。当我们的潜意识信念与意识决策或行动冲突时，我们会听到这种内在声音批评我们。“我骨架大，永远减不了重”，或者“我出生于贫门，将永远贫穷”。我们把这些当作借口——一种推迟处理和解决问题的方式。


  当我们进入深度放松并与潜意识互动时，我们可以要求它帮助我们找到永久的解决方案。由于潜意识巨大的力量，在专业人士的帮助下，在几次咨询后甚至一次咨询中解决有害信念，并不罕见。


  人们过度批评自己是非常常见的。然而，你需要理解没有人是完美的，每个人都会犯错。只要你从中学习，错误就会发挥作用，并实际上帮助你实现目标！


  如果你发现自我批评很困难，请尝试以下技术：


  首先闭上眼睛，进入深度放松的状态。回顾一次你对自己做错的事情过度批评的时刻。不要为犯错指备自己，接受发生的事。将这个想法转化为一两个你从解决该问题中学到的要点。现在，想象自己漂浮在场景上方，只带着一张写有你要点的纸。关于该情况的其他一切都释放了，并在你下方。


  接下来，想象自己接受一个新项目并轻松完美地完成它。放下任何自我批评，接纳你的弱点并增强你的优势。告诉自己：“我是积极的。我犯了一个错误，但我从中吸了教训，我正轻松地向前看。”






  仔细思考这段话，以及它对你意味着什么。通过理解我们大脑的运作方式，并运用神经语言程序（NLP）技术，你可以真正实现任何目标。难道不有趣吗？往往是那些生活最艰难的人走向了顶峰，而那些出生优越、受宠溺的人最终却虚度了一生？


  你所做的就是相信。你不应该对任何你想做的事情设定限制。从关注你的目标开始；永远不要忘记你的希望和梦想。通过保持专注，你不会满足于任何低标准的标准。通常是我们自己给自己设定了限制，无论我们是否告诉自己是某人或某事在阻碍我们。


  对自己说：“我可以完成任何我下定决心要去做的事，我完全值得拥有这个世界上的一切，因为我是一个赢者。我可能会在小事上偶尔失败，但我会学习并重新崛起，从长远来看，我将胜利。我会将阻碍我的障碍变成实现目标的垫脚石。”


  ## 坚决自信


  你的想法很重要，它们也很有意义。你的声音和观点是你的与生权利，绝不要让任何人反驳你。


  仅仅因为从公司的角度来看你不是老板或负责人，并不意味着你的想法不重要。仅仅因为你没有高中学历，并不意味着你的一生将一无成就。仅仅因为你经历过艰难的过去，并不意味着你无法创造你渴望且应得的未来。


  对自己说：“我与其他人一样优秀。我甚至比大多数人更有能力，因为我理解自己大脑的真正力量。我不害怕表达我的观点和分享我的想法。我对比学习新事物感到兴奋，并用我的能力给他人留下深刻印象。我值得成功，我是一个领导者。”


  ## 克服恐惧


  人们遭受的最常见恐惧症之一是公开演讲恐惧。这实际上是第一恐惧，超过了对死亡的恐惧！哇！


  人们在任何事情上失败的原因是因为让他们让他们主导并支配他们。每当你需要公开演讲时，感到紧张是自然的。如果你对活动或演示这样的大事一点感到一点紧张，说明它对你来说并不重要。然而，如果你已经做了必要的准备，完全没有理由也没有必要焦虑到影响你的表现。


  以下话语旨在帮助你克服公开演讲的恐惧：


  在达到放松状态后，对自己说：“我对自己的能力充满信心。我相信自己，人们喜欢我。人们觉得我友好、温暖，并被我吸引。这些人对我做出回应是因为我有正直的人，他们享受与我相处。当我站到人们面前说话时，他们会立即感受到我的温暖。当我冷静、从容地站在这些人面前时，我能够与他们建立深层的联系。我在进行演示时充满信心，当我说话时，人们在倾听。我说话带着信念和权威感。”


