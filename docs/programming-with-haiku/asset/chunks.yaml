    假设我们有一个值为 199 的变量，我们想要关闭第 2 位且仅关闭第 2 位。我们从数字 255 开始——它的所有位都是 1——然后减去 $2²$，即 2
    的幂，指数等于我们要关闭的位数。我们想要与 AND（与）运算使用的数字是 251，即 $255 - 4$。199 与 251 的与运算结果是 195。


    `199 & 251 = 195`


    | | 十进制 | 二进制 |

    | --- | --- | --- |

    | | 199 | `11000111` |

    | AND | 251 | `11111011` |

    | = | 195 | `11000011` |


    ## 位按或 (Bitwise OR)


    位按或的使用与与（AND）相反——它的目的是开启数字中的某些位，即将数字中的某些 0 位设置为 1。


    ### 示例 1


    192 | 15 = 207


    | | 十进制 | 二进制 |

    | --- | --- | --- |

    | | 192 | `11000000` |

    | OR | 15 | `00001111` |

    | = | 207 | `11001111` |


    ### 示例 2


    8 | 64 = 72


    | | 十进制 | 二进制 |

    | --- | --- | --- |

    | | 8 | `00001000` |

    | OR | 64 | `01000000` |

    | = | 72 | `01001000` |


    只要其中一个位为 1，该位就会被开启。在开启特定位时，数学计算会简单得多。这仅仅是将我们想要修改的数字与 2 的位数的幂次进行 OR 运算即可。如果我们有一个包含
    36 的变量，并且需要开启第 1 位，我们就将变量与 $2¹$（即 2）进行 OR 运算。


    ### 示例 3


    36 | 2 = 38


    | | 十进制 | 二进制 |

    | --- | --- | --- |

    | | 36 | `00100100` |

    | OR | 2 | `00000010` |

    | = | 38 | `00100110` |


    ## 位按异或 (Bitwise XOR)


    位按异或可能是所有位运算符中最奇怪的。XOR 代表“异或或”（eXclusive OR）。它被用于反转位，因为只要其中一个位为 1 它就返回 1，但如果两个位的值相同则返回
    0。


    ### 示例 1


    36 ^ 255 = 219


    | | 十进制 | 二进制 |

    | --- | --- | --- |

    | | 36 | `00100100` |

    | XOR | 255 | `11111111` |

    | = | 219 | `11011011` |


    当两个输入位不同时，XOR 将输出位置为 1。因此，它在位上相当于 `!=` 运算符。


    ## 位按取反 (Bitwise NOT)


    位按取反像 XOR 一样翻转位，但控制力较小。它翻转数字中的所有位，就像上面的示例一样，但它不需要第二个值。这是一个用法示例：


    ```c

    int a = 5;

    printf("The value of ~%d is %d\n", a, ~a);

    ```


    ## 移位操作 (Shift Operations)


    除了开启和关闭位，C 和 C++ 还提供了移位运算符，让我们能够快速进行一些高效且巧妙的乘法和除法。


    ```

    a << b

    ```


    将 `a` 的值左移 `b` 位。这将 `a` 乘以 $2^b$。


    ```

    a >> b

    ```


    将 `a` 的值右移 `b` 位。这会将 `a` 除以 $2^b$。通过观察它对位本身到底做了什么，更容易理解为什么它被称为移位。


    位移位运算符


    | 代码 | 数学等价式 | 结果 | 二进制值（位前） | 二进制值（位后） |

    | --- | --- | --- | --- | --- |

    | `5 << 2` | `5 * 2²` | 20 | `00000101` | `00010100` |

    | `32 << 1` | `32 * 2¹` | 64 | `00010000` | `01000000` |

    | `64 >> 1` | `64 / 2¹` | 32 | `01000000` | `00100000` |

    | `7 >> 2` | `7 / 2²` | 1 | `00000111` | `00000001` |


    在位位上操作数值时，了解移位操作特别有用，因为允许我们非常快速地进行特定的数学运算。在这些情况下，乘以或除以 2 的幂是非常常见的。


