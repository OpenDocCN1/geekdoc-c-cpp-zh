    \ are trademarks of Haiku, Inc. Be, BeOS, and the Be and BeOS logos are registered\
    \ trademarks of Be Incorporated in the United States of America and other countries.\
    \ All other products and company names mentioned in this book may be trademarks\
    \ of their respective owners. Use of a term in this book should not be regarded\
    \ as affecting the validity of any trademark or service mark.\n\n## License\n\
    This work is licensed under the Creative Commons Attribution-NonCommercial-ShareAlike\
    \ 4.0 International License.\n\nTo view a copy of this license, visit http://creativecommons.org/licenses/by-nc-sa/4.0/\
    \ or send a letter to Creative Commons, PO Box 1866, Mountain View, CA 94042,\
    \ USA.\n\n![](media/file0.png)\n\nISBN: 978-0-557-53969-7\n\n# Lesson 1\nProgramming\
    \ involves communicating your ideas to the computer. The only problem is that\
    \ computers are stupid. They will do exactly what you tell them and NOT what you\
    \ mean unless what you mean is, in fact, what you have told them. If you don’t\
    \ completely understand that – believe me – you will soon enough.\n\nThe problem\
    \ with communicating with the computer is that it doesn’t speak any human language.\
    \ All it knows is what to do when given a particular numerical instruction. For\
    \ people to do this is very tough, so we write in one language accessible to people\
    \ and the computer turns it into something it can understand. The translation\
    \ can be done right when the program is run, called an interpreted language, or\
    \ beforehand as is done in compiled languages. `C` and `C` are compiled languages,\
    \ so when writing `C` programs, you write the human language (`source code`) and\
    \ the compiler turns it into computer instructions (`machine code`).\n\nIn `C++`,\
    \ all computer instructions are grouped together into blocks called functions.\
    \ Here is an example:\n\n```\nvoid myFunction(void)\n{\n\n}\n```\n\nFunctions\
    \ may or may not require data to do their job, and they may or may not give back\
    \ a result when they are done. This one, called `myFunction`, requires no data\
    \ and returns none. It also does nothing, but that’s OK. Here’s the format for\
    \ defining a function:\n\n```\n<outdata> <functionname>(indata)\n{\n    <instructions\
    \ to do the function>\n}\n```\n\nThe input data is always inside a pair of parentheses\
    \ and all of the function’s instructions will go inside the pair of curly braces.\
    \ For future reference, all parentheses and curly braces must appear in pairs.\n\
    \nAnyway, the compiler doesn’t care how much space is in between all of this stuff,\
    \ so there is plenty of room to make your code as (un)readable as you like. We\
    \ could squish all of this together like this:\n\n```\nvoid myFunction(void){}\n\
    ```\n\nand it would still have the same result. Because whitespace, as it’s called,\
    \ doesn’t matter, every instruction (not to be confused with a function) in `C++`\
    \ has a semicolon after it.\n\nFor what it’s worth, we will use a style of writing\
    \ code which is quite similar to what the Haiku developers use with a few tweaks.\
    \ For example, code placed in between a set of curly braces is always indented\
    \ one level using the tab key.\n\nHere is our first function that really does\
    \ something:\n\n```\nint TwoPlusTwo(void)\n{\n    return 2 + 2;\n}\n```\n\nThis\
    \ function, called `TwoPlusTwo`, needs no input data, but returns a result. The\
    \ result of this function is always an integer – any number without a decimal\
    \ point. While a number is a number to people, `C++` is very particular about\
    \ keeping track of the types of data passed around.\n\nEvery program has one function\
    \ which needs to be defined: `main`. It can be defined (as in telling the computer\
    \ what to do for the `main()` function) in a couple of different ways, but we’ll\
    \ use the simplest:\n\n```\nint main(void)\n{\n    return 1;\n}\n```\n\nThis program,\
    \ when compiled and run, doesn’t print anything, but it does return a one back\
    \ to the OS when it finishes.\n\nLet’s actually make this program. Save the above\
    \ code into a Source Code file named `ReturnOne.cpp`. Open the Terminal and navigate\
    \ to the folder that has it and type this:\n\n```\ngcc -o ReturnOne ReturnOne.cpp\n\
    ```\n\nThis tells `gcc` (GNU Compiler Collection) that you’re going to make a\
    \ program called `ReturnOne` (specified by the `-o ReturnOne`) and you’re going\
    \ to use `ReturnOne.cpp` to make it.\n\nFunctions can call other functions, too,\
    \ but only if the computer knows about them. This will generate an error when\
    \ compiled:\n\n```\nint main(void)\n{\n    PushTheRedButton();\n    return 1;\n\
    }\n```\n\nSave this as `RedButton.cpp` and compile it with this command:\n\n```\n\
    gcc -o RedButton RedButton.cpp\n```\n\nThe computer doesn’t recognize the function\
    \ `PushTheRedButton()`, so it doesn’t know what to do and complains. If we tell\
    \ the computer what it does, it will compile. Change `RedButton.cpp` to look like\
    \ this:\n\n```\nvoid PushTheRedButton(void)\n{\n}\n\nint main(void)\n{\n    PushTheRedButton();\n\
    \    return 1;\n}\n```\n\n`PushTheRedButton` doesn’t do anything, but the computer\
    \ doesn’t care. The other way to call other functions is to use libraries built\
    \ into the system. We do this by linking a library with our program. Now we will\
    \ do something useful. Save the below code into `HelloWorld.cpp` and compile with\
    \ `gcc -o HelloWorld`\n\n```\n#include <stdio.h>\n\nint main(void)\n{\n    printf(\"\
    Hello world!\\n\");\n    return 1;\n}\n```\n\nThere are two parts that are unfamiliar\
    \ here. The line starting with `#include` tells a part of the compiler called\
    \ the preprocessor to look up function definitions in system header `stdio.h`.\
    \ `stdio.h` is the name of a file which defines a lot of standard input and output\
    \ functions, like `printf()`. The angle brackets – `<` and `>` – tell the preprocessor\
    \ these are system headers. We can make our own, but we’ll get to that another\
    \ time.\n\nThe other unfamiliar part here is the part inside the parentheses for\
    \ `printf()`. Everything in the quotes will be printed on the screen if you run\
    \ this program from the Terminal. This kind of data is called a string (as in\
    \ string of characters).\n\nWhat happens if you remove the backslash and the letter\
    \ n from the end of the string so that it looks like: `\"Hello world!\"`\n\n##\
    \ Assignment\nWrite a program which prints a box on the Terminal using minuses\
    \ and pipe symbols.\n\n```\n----------\n|        |\n|        |\n|        |\n|\
    \        |\n----------\n```\n\nHow could you write a program which draws two boxes\
    \ without having to do a ton of typing?\n\n## Review\n1. What is machine code?\n\
    2. What is source code?\n\n# Lesson 2\nOur first couple of programs weren’t all\
    \ that useful, but as we go along, you’ll find that you can do more and more with\
    \ your programs. This time around we’re going to look at two main concepts: comments,\
    \ and the different stages the compiler goes through to generate your program,\
    \ and we’ll also learn a little about debugging your code.\n\nComments are notes\
    \ that you put into the code. They have many uses, such as clarifying a certain\
    \ section of code, providing warnings, or temporarily disabling a section of code.\
    \ See the below example for how they can be used.\n"
