    as the file types it handles and launch characteristics, are also stored in a
    program’s resources.


    A number of tools are available for Haiku to add, delete, and edit program resources.
    QuickRes is the original, authoritative editor for program resources provided
    by Be. Unfortunately, it is not open source and not usable by GCC4-only Haiku
    installations. A resource editor called ResEdit is being developed for Haiku,
    but as of this writing, it has only been developed enough to be barely useful.
    rc (resource compiler) is a command-line utility which converts between text resource
    files and binary resource files. It is useful for making resources easily compatible
    with source control systems which don’t deal well with binary files, such as CVS.
    xres is a command line utility which is used to manipulate resources. You can
    choose whatever tool you like, but for the purposes of these lessons, we will
    focus on QuickRes because it works well and eventual migration to ResEdit from
    QuickRes will be relatively painless when the time finally comes.


    Although it’s possible to directly edit a program’s resources with an editor by
    opening the executable in the resource editor, this is not the usual – or recommended
    – way to add resources to an application. Resources are normally placed into a
    resource file that is added to the executable after it has been built. Resource
    files come in two formats: a binary format with a .rsrc extension and a text file
    format with a .rdef extension. Paladin supports both and will automatically bundle
    any resource files into your application if they are part of your project.


