  trans: "\n\n```cpp\n该类负责应用程序的所有实际工作，包括处理鼠标点击和显示相应的图像。`MainWindow.cpp` 中的代码只是创建了一个背景视图和一个\
    \ `PictureView` 实例。\n\n此项目的亮点是调用了 `BTranslationUtils::GetBitmap()`。在这里加载 PNG 文件和\
    \ JPEG 文件的唯一区别在于类型指定符不同——不需要考虑如何读取 JPEG 文件。所有的繁重工作都已为你完成。哇，呼！\n\n## 进阶学习\n\n利用你现在学到的知识，你可以做很多事情。这与其说是关于了解\
    \ API 及其如何使用它，不如说是关于编写 C++。\n\n*   尝试研究如何使用 `BView` 的 `Pulse()` 钩子函数来每秒自动更改位图。检查\
    \ BeBook 中的条目以获取详细信息，但你需要将传递发送给 `BView` 构造函数的标志设为 `B_WILL_DRAW | B_PULSE_NEEDED`\
    \ 才能使用 `Pulse()` 函数。\n\n## 需要记忆的类和方法\n\n### BTranslationUtils\n\n*   `GetBitmap(const\
    \ char *name, BTranslatorRoster = NULL)` – 在路径 `name` 中查找文件，如果未找到，则查找名为 `name`\
    \ 的资源。如果有多个同名的，则返回第一个。\n*   `GetBitmap(uint32 type, int32 id, BTranslatorRoster\
    \ = NULL)` – 返回由 `type` 和 `id` 标识的资源中的图像。\n*   `GetBitmap(uint32 type, const char\
    \ *name, BTranslatorRoster = NULL)` – 返回由 `type` 和 `name` 标识的资源中的图像。\n\n# 第 20\
    \ 课\n\n虽然过去几节的重点是接口套件（Interface Kit），但在编写 Haiku 时，另一个套件也受到了关注：存储套件（Storage Kit）。该套件用于处理磁盘上的文件和文件夹。今天我们将对它进行一次快速的突击课程。别担心，它并不困难。\n\
    \n## Storage Kit 概述\n\n该套件可以分为六组基本类。\n\nStorage Kit 类\n\n| 类 | 描述 |\n| :--- |\
    \ :--- |\n| BFilePanel | 用于浏览文件系统并选择文件或文件夹的 GUI 控件 |\n| BRefFilter | 用于过滤 `entry_ref`\
    \ 对象的类。它几乎总是与 `BFilePanel` 结合使用 |\n| BQuery | 使用属性对文件系统进行搜索。查询仅在 BFS 卷上有效 |\n\
    | BVolume | 这是一个表示磁盘卷的类，可以是硬盘分区、可移动式驱动器、磁盘镜像或网络共享 |\n| BVolumeRoster | 此类提供了获取系统上可用卷信息的方法\
    \ |\n| BDirectory | `BDirectory` 是一个非常实用的类。它为你提供了读取目录内容、创建文件、文件夹和符号链接的方法，并且它可以找到特定的条目，例如确定其是否存在\
    \ |\n| BEntry | 这是 Storage Kit 中最常用的类之一。它代表目录中的一个项目，例如文件或文件夹。`BEntry` 可以告诉你路径是否存在、删除它、将其移动到同一卷的其他地方等\
    \ |\n| BEntryList | 你可能永远不会直接使用 `BEntryList`。它是一个用于定义读取 `BEntry` 对象列表接口的类，派生类必须实现该接口。目前\
    \ `BQuery` 和 `BDirectory` 是唯一这样做的对象。 |\n| BFile | `BFile` 是另一个常用的类。意乎不用说，它代表磁盘上的文件，并提供了从文件中读取数据和向其写入的功能。它比\
    \ `fread()` 及其它的提供了更友好的接口。与 `BDirectory` 一样，它是 `Node` 的派生类 |\n| BNode | `BNode`\
    \ 代表文件。`BNode` 提供了文件锁定等任务的功能。 |\n| BNodeInfo | 尽管 `Node` 可以做很多事情，但 `BNodeInfo`\
    \ 提供了一个针对特定 Haiku 程序的接口。值得注意的是 `GetIcon()` 函数，用于获取图标。 |\n| BPath | `BPath` 提供了路径操作。它不像\
    \ `String` 那样做很多事情，例如将相对路径转换为绝对路径。 |\n| BStatable | 它提供了关于文件的信息（如类型、目录等）、创建时间、修改时间、所有者等。`BStatable`\
    \ 是一个抽象类，`Entry` 是它的派生类。 |\n| BSymLink | `BSymLink` 是 `Node` 的派生类。非常有用的函数是 `ReadLink()`，用于处理链接。\
    \ |\n| BFileInfo | 与 `AppFileInfo` 一样，你可能永远不会使用这个类，除非你正在开发应用程序。 |\n| BMimeType\
    \ | 它用于解析 MIME 字符串。 |\n| BResources | 你可能永远不会使用这个类，除非你正在开发应用程序。 |\n| Node Monitor\
    \ | `Node Monitor` 是一个可以通知文件系统变化的的服务，例如卷的挂载或卸载、文件的创建或删除或目录内容的变化。 |\n\n##作业\n\n\
    使用接口套件有一个缺点：如果你使用它的一部分，几乎必须使用整个部分。例如，如果你想从磁盘加载位图，你必须有一个有效的 BApplication。存储套件并不具备这一点。事实上，今天的项目非常简单，但代码风格是你在\
    \ Haiku 应用程序中看到的。这个项目名为 ListDir，是 `ls` 命令的简单版本。给定命令行指定的路径，我们的程序将列出目录的内容以及每个条目的大小。我们将通过显示子目录包含的条目数量来显示“大小”。\n\
    \n```cpp\n// Main.cpp\n\n#include <Directory.h>\n#include <Entry.h>\n#include\
    \ <Path.h>\n#include <stdio.h>\n#include <String.h>\n\n// 使用全局整数比 #define 更好\n\
    // 因为常量提供了强类型并且不会像 #define 那样导致奇怪的错误。\nconst uint16 BYTES_PER_KB = 1024;\nconst\
    \ uint32 BYTES_PER_MB = 1048576;\nconst uint64 BYTES_PER_GB = 1099511627776ULL;\n\
    \nint     ListDirectory(const entry_ref &dirRef);\n\nBString MakeSizeString(const\
    \ uint64 &size);\n\nint\nmain(int argc, char **argv)\n{\n    // 从命令行调用时，我们需要除了程序名之外的额外参数。\n\
    \    if (argc != 2)\n    {\n        printf(\"Usage: listdir <path>\\n\");\n  \
    \      return 0;\n    }\n\n    // 在这里我们将进行健康检查，以确保给定的路径\n    // 存在且不是一个文件。\n \
    \   BEntry entry(argv[1]);\n    if (!entry.Exists())\n    {\n        printf(\"\
    %s 不存在\\n\",argv[1]);\n        return 1;\n    }\n    if (!entry.IsDirectory())\n\
    \    {\n        printf(\"%s 不是一个目录\\n\",argv[1]);\n        return 1;\n    }\n\n\
    \    // 一个 entry_ref 是一个指向文件的类型定义的结构体，\n```\n"
- fmt: "\n```cpp\n    // directory, or symlink on disk. The entry must actually exist,\n\
    \    // but unlike a BFile or BEntry, it doesn't use up a file handle.\n    entry_ref\
    \ ref;\n\n    entry.GetRef(&ref);\n\n    return ListDirectory(ref);\n}\n\nint\n\
    ListDirectory(const entry_ref &dirRef)\n{\n    // This function does all the real\
    \ work of the program\n    BDirectory dir(&dirRef);\n    if (dir.InitCheck() !=\
    \ B_OK)\n    {\n        printf(\"Couldn't read directory %s\\n\",dirRef.name);\n\
    \        return 1;\n    }\n\n    // First thing we'll do is quickly scan the directory\
    \ to find the\n    // length of the longest entry name. This makes it possible\
    \ to left\n    // justify the file sizes\n    int32 entryCount = 0;\n    uint32\
    \ maxChars = 0;\n    entry_ref ref;\n    // Calling Rewind() moves the BDirectory's\
    \ index to the beginning\n    // of the list.\n    dir.Rewind();\n\n    // GetNextRef()\
    \ will return B_ERROR when the BDirectory has gotten\n    // to the end of its\
    \ list of entries.\n    while (dir.GetNextRef(&ref) == B_OK)\n    {\n        if\
    \ (ref.name)\n            maxChars = MAX(maxChars,strlen(ref.name));\n    }\n\
    \    maxChars++;\n    char padding[maxChars];\n    BEntry entry;\n    dir.Rewind();\n\
    \n    // Here we'll call GetNextEntry() instead of GetNextRef() because a\n  \
    \  // BEntry will enable us to get certain information about each\n    // entry,\
    \ such as the entry's size. Also, because it inherits from\n    // BStatable,\
    \ we can differentiate between directories and files\n    // with just one function\
    \ call.\n    while (dir.GetNextEntry(&entry) == B_OK)\n    {\n        char name[B_FILE_NAME_LENGTH];\n\
    \        entry.GetName(name);\n        BString formatString;\n        formatString\
    \ << \"%s\";\n        unsigned int length = strlen(name);\n        if (length\
    \ < maxChars)\n        {\n            uint32 padLength = maxChars - length;\n\
    \            memset(padding, ' ', padLength);\n            padding[padLength -\
    \ 1] = '\\0';\n            formatString << padding;\n        }\n\n        if (entry.IsDirectory())\n\
    \        {\n            // We'll display the \"size\" of a directory by listing\n\
    \            // how many  entries it contains\n            BDirectory subdir(&entry);\n\
    \            formatString << \"\\t\" << subdir.CountEntries()\n              \
    \      << \" items\";\n        }\n        else\n        {\n            off_t fileSize;\n\
    \            entry.GetSize(&fileSize);\n            formatString << \"\\t\" <<\
    \ MakeSizeString(fileSize);\n        }\n        formatString << \"\\n\";\n   \
    \     printf(formatString.String(),name);\n        entryCount++;\n    }\n    printf(\"\
    %ld entries\\n\",entryCount);\n    return 0;\n}\n\nBString\nMakeSizeString(const\
    \ uint64 &size)\n{\n    // This function just converts the raw byte counts provided\
    \ by\n    // BEntry's GetSize() method into something more people-friendly.\n\
    \    BString sizeString;\n    if (size < BYTES_PER_KB)\n        sizeString <<\
    \ size << \" bytes\";\n    else if (size < BYTES_PER_MB)\n        sizeString <<\
    \ (float(size) / float(BYTES_PER_KB)) << \" KB\";\n    else if (size < BYTES_PER_GB)\n\
    \        sizeString << (float(size) / float(BYTES_PER_MB)) << \" MB\";\n    else\n\
    \        sizeString << (float(size) / float(BYTES_PER_GB)) << \" GB\";\n    return\
    \ sizeString;\n}\n```\n"
