  trans: "\n数据可以通过从流读取进入我们的程序，也可以通过向流写入输出程序。某些流是只读的，某些是只写的，而有些允许同时读和写。`stdin` 是只读的，所以我们只能用它来获取数据。`stdout`\
    \ 和 `stderr` 是只写的，所以我们只能向它们打印内容。如果我们创建一个操作文件的流，可以选择其中一种或两者皆。\n\n每个流都有一个标识符，称为\
    \ `handle`（句柄）。在编程中，句柄只是一个任意的（但通常是唯一的）数字，用于从同类型的其他对象中识别出一个对象。操作流变得只需要获取该流的句柄并调用相应的函数。让我们来看在日常\
    \ C 语言编程中会用到的一些函数的声明。\n\n```\nint printf(const char *format, ...);\nint fprintf(FILE\
    \ *streamHandle, const char *format, ...);\n```\n\n这是一个旧标准。给定一个定义打印格式的字符串以及后续相应数量的参数，它向\
    \ `stdout` 打印字符串。`fprintf()` 要求在格式字符串之前指定一个流句柄——使得直接“打印”到文件成为可能——除此之外工作方式与 `printf()`\
    \ 完全相同。成功时，两个函数都返回打印的字符数。负返回值用于表示失败。\n\n```\nint ferror(FILE *streamHandle);\n\
    ```\n\n如果 `streamHandle` 指向的流一切正常，则返回 0；如果发生了错误，则返回另一个未指定的值。确保 `streamHandle`\
    \ 不为 `NULL`——否则会导致你的程序段错误（segfault）。\n\n```\nint feof(FILE *streamHandle);\n```\n\
    \n如果 `streamHandle` 指向的流一切正常，则返回 0；如果流已到达文件末尾，则返回另一个未指定的值。确保 `streamHandle` 不为\
    \ `NULL`——否则会导致你的程序段错误。\n\n```\nchar * fgets(char *array, int arraySize, FILE\
    \ *streamHandle);\n```\n\n`fgets()` 是 `gets()` 的安全版本。它从流句柄读取文本，直到遇到换行符（`'\\n'`）或读取了等于\
    \ `arraySize` 的字符数，如果程序员犯错，可能会导致段错误。与 `gets()` 一样，成功时 `fgets()` 返回与 `array` 相同的指针。如果发生错误，它返回\
    \ `NULL` 指针。如果 `fgets()` 到达文件末尾——只有在从文件而非 `stdin` 读取时遇到——数组的内容保持不变并返回 `NULL` 指针。每当\
    \ `fgets()` 返回 `NULL` 指针时，请使用 `feof()` 和 `ferror()` 来确定是耗尽了数据还是出了问题。\n\n```\n\
    FILE * fopen(const char *filePath, const char *mode);\n```\n\n`fopen()` 将文件作为流打开。如果成功，它返回一个供其他函数使用的流句柄，必须最终用\
    \ `fclose()` 关闭。模式字符串列在下方。\n\n### fopen 模式字符串\n\n| 模式字符串 | 功能 |\n| --- | --- |\n\
    | \"r\" | 打开文件读取。文件必须存在。 |\n| \"w\" | 打开文件用于写入。如果文件存在，其内容将被删除并被视为一个新的空文件。 |\n\
    | \"a\" | 打开文件用于写入。写入它的任何数据都会添加到文件末尾。如果文件不存在，则创建它。 |\n| \"r+\" | 打开文件进行更新，支持同时读和写。文件必须已经存在。\
    \ |\n| \"w+\" | 打开文件进行更新，支持同时读和写。如果文件存在，其内容将被删除并被视为一个新的空文件。 |\n| \"a+\" | 打开文件用于读取和追加。读取可以在文件的任何位置进行，但所有写入操作都会挂载到文件末尾。\
    \ |\n\n```\nint fclose(FILE *streamHandle);\n```\n\n关闭已打开的流句柄。\n\n哇。有这么多不同的函数！可怕的部分是，这仅仅是可用函数的极一小部分。程序员应该始终在学习。一旦他熟悉了某门语言，他通常会学习那些对他来说是新的可用函数，以及使用已知函数的新方法。学习如何使用对你来说函数最好的方法就是使用它们。\n\
    \n让我们来看一个程序，它将测试文件打印到 `stdout` 并在必要时创建该文件。\n\n```c\n#include <stdio.h>\n\nint\n\
    FileExists(const char *path)\n{\n    // 这个函数通过尝试打开文件来测试文件是否存在。\n    // 这样做有更好的方法，但目前对于我们的目的来说\n\
    \    // 这已经足够好。\n    // 如果收到一个 NULL 指针，我们将返回 -1\n    // 以表示错误条件。\n\n    if (!path)\n\
    \        return -1;\n\n    // 尝试打开文件读取\n    FILE *file = fopen(path,\"r\");\n\n\
    \    // 如果文件存在，我们的返回值为 1，如果\n    // 不存在则是 0。\n    if (file)\n    {\n        fclose(file);\n\
    \        return 1;\n    }\n    else\n    {\n        return 0;\n    }\n}\n\nint\n\
    MakeTestFile(const char *path)\n{\n    // 检查 NULL 指针\n    if (!path)\n       \
    \ return -1;\n\n    // 打开文件并在已存在时擦除内容\n    FILE *file = fopen(path,\"w\");\n \
    \   if (!file || ferror(file))\n    {\n        // 如果打开文件出现问题，返回非零结果\n        fprintf(stderr,\"\
    无法创建文件 %s\\n\",path);\n\n        return 0;\n    }\n\n    // stdout, stdin 和 stderr\
    \ 的流句柄已经\n    // 为我们准备好了，所以我们可以使用它们，\n    // 就像在上面和我们在下面向文件中数据一样。\n    fprintf(file,\
    \ \"这是一个文件。\\n 这只是一个文件。\\n\"\n            \"如果这是一个紧急情况，你认为我会\"\n            \"\
    在这里告诉你吗？\\n\");\n\n    fclose(file);\n\n    return 1;\n}\n\nint\nmain(void)\n\
    {\n    int returnValue = 0;\n\n    // 使用位于 /boot/home 中名为 MyTest.txt 的测试文件\n \
    \   const char *filePath = \"/boot/home/MyTest.txt\";\n\n    // 如果文件不存在，则创建测试文件，如果创建\n\
    \    // 有则完全退出我们的程序。\n    if (!FileExists(filePath))\n    {\n        returnValue\
    \ = MakeTestFile(filePath);\n\n        if (returnValue != 1)\n            return\
    \ returnValue;\n    }\n\n    printf(\"打印文件 %s:\\n\",filePath);\n\n    // 我们到了这里，所以打印文件是安全的\n\
    \    FILE *file = fopen(filePath,\"r\");\n\n    if (!file || ferror(file))\n \
    \   {\n        // 如果打开文件出现问题，返回 0\n        fprintf(stderr,\"无法打印文件 %s\\n\",filePath);\n\
    \n        return 0;\n    }\n\n    char inString[1024];\n\n    // fgets 在到达文件末尾时返回\
    \ NULL 指针，\n    // 所以这个小循环将打印整个文件并在\n    // 其结束处退出。\n    while (fgets(inString,1024,file))\n\
    \        fprintf(stdout,\"%s\",inString);\n\n    fclose(file);\n\n    return 0;\n\
    }\n```\n\n呼！这是我们最长的一个示例。它也是我们最接近“真实”程序的代码。某些惯用法，如 `if (!file)`，在 C 和 C++ 编程中非常常见，所以习惯看到它们。重读这个示例中的代码，并确保你理解每一行做了什么。\n"
- fmt: "\nThere are some small changes in the style, as as well. Attention to good\
    \ style is a quirk of the Haiku ecosystem. The Haiku developers, in particular,\
    \ are notably picky about code which adheres to the OpenTracker code style guidelines\
    \ and with good reason. Style is partly a matter of opinion, but good code style\
    \ can also help with debugging and avoiding errors. Bad code style can make it\
    \ much, much harder. The style we will use throughout the rest of these lessons\
    \ does not hold to the official Haiku guidelines in certain ways, but it does\
    \ follow them pretty closely.\n\n## Bug Hunt\n\n### Hunt #1\n\n```c\n#include\
    \ <stdio.h>\n#include <string.h>\n\nchar *ReverseString(const char *string)\n\
    {\n    // This function rearranges a string so that it is backwards\n    // i.e.\
    \ abcdef -> fedcba\n\n    if (!string)\n        return NULL;\n\n    int length\
    \ = strlen(string);\n    int count = length / 2;\n\n    for (int i = 0; i < count;\
    \ i++)\n    {\n        char temp = string[length - i];\n        string[length\
    \ - i] = string[i];\n        string[i] = temp;\n    }\n\n    return string;\n\
    }\n\nint main(void)\n{\n    char inString[1024];\n\n    printf(\"Type a string\
    \ to reverse:\");\n    gets(inString);\n\n    printf(\"The reversed string is\
    \ %s\\n\",ReverseString(inString));\n    return 0;\n}\n```\n\n`foo.cpp: In function\
    \ ‘char* ReverseString(const char*)’: foo.cpp:18: error: assignment of read-only\
    \ location ‘*(string + ((unsigned int)((length + -0x00000000000000001) - i)))’\
    \ foo.cpp:19: error: assignment of read-only location ‘*(string + ((unsigned int)i))’\
    \ foo.cpp:22: error: invalid conversion from ‘const char*’ to ‘char*’`\n\n## Review\n\
    \n1. What is the scope of a variable?\n2. What are the three types of scope?\n\
    3. What part(s) of the following pointer declaration is constant: the value, the\
    \ pointer’s address, or both?\n```c\nint * const myPointer;\n```\n4. Where does\
    \ anything written to `stderr` normally go?\n5. What is a handle?\n6. If you want\
    \ to write data to the end of an existing file, what mode must be specified in\
    \ a call to `fopen()`?\n\n# Lesson 9\n\nIf you haven’t noticed, we’ve come a long\
    \ way since Lesson 1. We’re steadily getting closer to being done with learning\
    \ the basics of C and C++. This time around, we’ll expand what we know about arrays\
    \ and pointers.\n\n## Arrays: Pointers with Smoke and Mirrors\n\nWhen we first\
    \ looked at strings in Lesson 5, we saw how arrays and pointers are pretty closely\
    \ related, but we didn’t look close enough to discover how close they really are.\
    \ Arrays are really just a friendly way of using pointers. Let’s look at two different\
    \ ways of changing the same string that demonstrate this.\n\n```c\n#include <stdio.h>\n\
    \nint\n(void)\n{\n    char string[30];\n\n    // Set the array to the lowercase\
    \ alphabet using the way we already\n    // know: brackets\n    for (int i = 0;\
    \ i < 26; i++)\n    {\n        // Character constants can be treated like integers.\
    \ It saves us from\n        // having to look up to see what integer value the\
    \ lowercase letter\n        // A has.\n\n        string[i] = 'a' + i;\n    }\n\
    \n    string[26] = 0;\n\n    printf(\"%s\\n\",string);\n\n    // Here's another\
    \ way: using pointers and some math\n    for (int i = 0; i < 26; i++)\n    {\n\
    \        char *index = string + (i * sizeof(char));\n\n        // Use a capital\
    \ A just for something different\n        *index = 'A' + i;\n    }\n\n    string[26]\
    \ = 0;\n\n    printf(\"%s\\n\",string);\n}\n```\n\nBoth loops do the exact same\
    \ thing except for using capital letters in the second one. The code for the second\
    \ one looks really strange, though, so let’s pick it apart, starting with `sizeof()`.\
    \ `sizeof()` is a language feature which works like a function. It can be given\
    \ a variable or the name of a type and it will return the size, in bytes, that\
    \ one object of that type takes up in memory. For example, `char` objects are\
    \ only 1 byte large, but an `int` takes of 4 bytes. Give `sizeof()` an array and\
    \ it will return the amount of memory the entire array occupies. Because the size\
    \ of a `char` is 1, we could have skipped the multiplication entirely, but it’s\
    \ a good idea to get into the habit of avoiding assumptions like this. You’ll\
    \ have a fewer gray hairs that way.\n\nThe next strange trick we see in the code\
    \ above is adding a number to a pointer. Pointers are just variables that contain\
    \ memory addresses, so adding an integer to a pointer just changes the memory\
    \ address. We can’t change the array’s address, so we’ve created a pointer that\
    \ we can change. This allows us to add the size of an array element to it. As\
    \ we do this over the course of the loop, the pointer will hold the address of\
    \ each character in the array.\n\nArray and pointers correspondences\n\n| Array\
    \ Index | Equivalent Pointer |\n| :--- | :--- |\n| 0 | `string` |\n| 1 | `string\
    \ + 1` |\n| 2 | `string + 2` |\n| 3 | `string + 3` |\n| 4 | `string + 4` |\n|\
    \ 5 | `string + 5` |\n| 6 | `string + 6` |\n| 7 | `string + 7` |\n| 8 | `string\
    \ + 8` |\n| 9 | `string + 9` |\n| 10 | `string + 10` |\n| 11 | `string + 11` |\n\
    | 12 | `string + 12` |\n| 13 | `string + 13` |\n| 14 | `string + 14` |\n| 15 |\
    \ `string + 15` |\n| 16 | `string + 16` |\n| 17 | `string + 17` |\n| 18 | `string\
    \ + 18` |\n| 19 | `string + 19` |\n| 20 | `string + 20` |\n| 21 | `string + 21`\
    \ |\n| 22 | `string + 22` |\n| 23 | `string + 23` |\n| 24 | `string + 24` |\n\
    | 25 | `string + 25` |\n| 26 | `string + 26` |\n"
