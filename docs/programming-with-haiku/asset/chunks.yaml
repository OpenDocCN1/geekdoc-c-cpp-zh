  trans: "\n\n```\n// This is a one-line comment.\n\n// So is this. Everything after\
    \ the two forward slashes is considered part of it.\n\nint main(void)\n{\n   \
    \ PushTheRedButton(); // This code doesn't work.\n    return 1;\n}\n```\n\n多行注释继承自\
    \ C 语言。它们以 `/*` 开始并以 `*/` 结束，类似于括号或大括号，但有一点不同：你不能在一个多行注释内部嵌套另一个多行注释。\n\n```cpp\n\
    /*-----------------------------------------------------------------------\nRedButton.cpp\n\
    \n这段代码演示了如果你使用编译器不识别的\n函数时，编译器将如何报错。\n\n------------------------------------------------------------------------*/\n\
    \n// This is a one-line comment.\n\n// So is this. Everything after the two forward\
    \ slashes is considered part of it.\n\nint main(void)\n{\n    PushTheRedButton();\
    \ // This code doesn't work.\n    return 1;\n}\n```\n\n现在，我们将后退一步，看看编译器在构建你的程序时所经历的过程。理解这一点非常重要，因为在编写代码时可能会出现不同类型的错误，了解这个过程将帮助你更容易地找到它们。\n\
    \n当程序从源代码构建时，在生成可执行文件之前，有四个工具对其进行操作：预处理器、编译器、汇编器和链接器。\n\n## 构建过程\n\n### 阶段 1：预处理器\n\
    \n预处理器接收原始源代码作为输入，并在代码发送给编译器之前进行一些处理。它会移除注释并处理 `#include` 指令，通过将所包含的头文件内容插入代码中。它还处理其他将在后讨论的指令。\n\
    \n### 阶段 2：编译器\n\n编译器将 C++ 代码翻译成汇编语言。汇编语言比计算机理解的指令接近得多，但仍然具有人类可读性。编写这种程序要困难得多，并且特定于它所编写的处理器。\n\
    \n### 阶段 3：汇编器\n\n汇编器根据编译器生成的汇编代码创建 `object code`，并将其放在具有 `.o` 扩展名的对象文件中。对象代码是计算机运行你的程序时使用的实际机器可执行指令。然而，它还没有准备好运行。在这种状态下，用于制作程序的对象文件就像是一组准备好组合的拼图。\n\
    \n### 阶段 4：链接器\n\n链接器将你的对象文件以及它们使用的任何库组合成一个可执行程序。\n\n## 调试\n\n由于程序员本质是人，他们会犯错，而且是很多错。编写代码和调试是密不可分的，并且通常同时进行。因此，我们将在学习编写程序的同时学习如何调试程序。\n\
    \nBug 分两种类型：语法错误和语义错误。语法错误很容易找到，因为编译器会为我们找到它们。这些问题如大小写错误、缺失或额外的括号，以及函数名拼写错误。语义错误通常更难找到，因为它们是完全合法代码逻辑中的错误。英语中的一个语义错误是“The\
    \ oxygen censor on my car needed to be replaced”——这个句子在语法上是完全合法且结构正确的，但需要的词是 `sensor`（传感器）而不是\
    \ `censor`（审查员）。语义错误的示例包括某些地方多余的分号、给数字加上错误的数值，以及对函数的返回值做出假设。\n\n让我们来看几个常见错误的简化版示例：\n\
    \n### 示例 1\n\n```cpp\n#include <stdio.h>\n\nint main(void)\n{\n    return 1;\n\
    }\n}\n```\n\n`foo.cpp:6: error: expected declaration before ‘}’ token`\n\n我们在这里看到的是一个额外的大括号。`gcc`\
    \ 往地给了我们一个相当晦涩的错误，但它也给了我们两个线索：文件名和行号。`gcc` 给出的行号与错误的实际位置并不总是相同的，但在这种情况下是一致的。\n\
    \n此时，你可能会想：“天才，到底什么是 token（标记）？” `token` 是任何语言元素。就像普通书面语言有单词和标点符号一样，计算机语言也是。正如连续两个逗号在英语中是标点错误一样，多出一个大括号就是\
    \ C++ 的标点错误。\n\n### 示例 2\n\n```cpp\n/*-----------------------------------------------------------------------\n\
    RedButton.cpp\n\n/*这段代码演示了如果你使用编译器不识别的\n函数时，编译器将如何报错.*/\n\n------------------------------------------------------------------------*/\n\
    \n// This is a one-line comment.\n\n// So is this. Everything after the two forward\
    \ slashes is considered part of it.\n\nint main(void)\n{\n    PushTheRedButton();\
    \ // This code doesn't work.\n    return 1;\n}\n```\n\n`foo.cpp:7: error: expected\
    \ unqualified-id before ‘--’ token`\n\n这是一个错误行号与实际错误位置不一致的示例。报错是关于顶部多行注释末尾的连字符。然而，它是由于在一个多行注释内部嵌套另一个多行注释引起的。预处理器移除了所有注释，所以编译器看到的是这样的：\n\
    \n```cpp\n------------------------------------------------------------------------*/\n\
    \nint main(void)\n{\n    PushTheRedButton();\n    return 1;\n}\n```\n\n编译器不知道如何处理这条虚线，并报错了。\n\
    \n### 示例 3\n\n```cpp\nint Main(void)\n{\n    return 1;\n}\n```\n\n`Main.cpp:3:\
    \ error: undefined reference to 'main'`\n\n这是一个不同类型的错误。记得每个程序都需要定义 `main()` 吗？我们定义的\
    \ `Main()` 是合法的，所以编译正常，但当链接器尝试将其组合时，它找不到所需的函数并抛出了错误。\n\n解决 `undefined reference`\
    \ 链接错误通常并不困难。\n\n## 复习\n\n1. 添加注释的两种方式是什么？\n2. 将源代码转换为机器代码的四个工具是什么？\n3. 列出并定义两类编程错误。\n\
    \n# 课程 3\n\n到目前为止一直在学习编程基础，例如如何编写函数以及如何开始查找代码中的 bug。这次我们将学习不同类型的数据以及存储和传递数据的方法。\n\
    \n像 `return 1 + 1;` 这样的直接操作是有限的，这就是为什么我们有了**变量**（variables）。变量仅仅是存储信息的容器，就像现实世界的任何容器一样，它们有不同的形状、大小和用途。\n\
    \n创建变量只需要声明它的存在，如下：\n\n```cpp\n#include <stdio.h>\n\nint main(void)\n{\n    //\
    \ 声明一个名为 a 的整数变量\n    int a;\n\n    // 同时声明两个：b 和 c\n    int b, c;\n\n    a =\
    \ 1;\n    b = 2;\n    c = 3;\n\n    // 打印变量的值\n    printf(\"a is %d, b is %d,\
    \ and c is %d.\\n\", a, b, c);\n\n    return a + b + c;\n}\n```\n\n变量可以一个一个声明，例如我们的变量\
    \ `a`，也可以一次声明多个，如 `b` 和 `c`。除了为我们在函数中使用声明变量外，很多时候我们会免费获得它们，因为许多函数需要输入数据来完成工作。这些变量被称为**参数**（parameters）或**实参**（arguments）。\n\
    \n"
- fmt: "\nFunction parameters are declared both in a function’s declaration and definition.\
    \ They are listed in a comma-separated list. Functions which do not take any arguments\
    \ use the word `void` to say so.\n\n```cpp\n// Declaration of a function with\
    \ two arguments.\nint SomeFunction(int someNumber, int anotherNumber);\n\n// Definition\
    \ of a function with two arguments.\nint MultiplyNumbers(int value, int secondValue)\n\
    {\n    return value * secondValue;\n}\n\n// A function which needs no arguments.\
    \ Must be a really peaceful one.\nint main(void)\n{\n    return MultiplyNumbers(2,\
    \ 3);\n}\n```\n\nWhen we call a function with parameters, such as `MultiplyNumbers()`\
    \ in the above example, we don’t list the type beside each one. The compiler keeps\
    \ track of the types and warns us when we make mistakes.\n\nSpeaking of types,\
    \ there are more types of data than just integers in C++. Each type takes up a\
    \ different amount of space in memory, measured in bytes. This is important to\
    \ remember because the number of bytes a variable occupies has a direct impact\
    \ on how much information it can hold. This difference is evident in the range\
    \ of values a `char` can hold as opposed to a `short`. Type sizes vary from platform\
    \ to platform, but here is a pretty good list for Haiku on a 32-bit processor.\n\
    \n### C++ Types\n\n| Type | Size (bytes) | Range | Description |\n| --- | ---\
    \ | --- | --- |\n| char | 1 | -128 to 127 | Letters – each char variable only\
    \ holds 1 letter |\n| unsigned char | 1 | 0 to 255 | Letters – each char variable\
    \ only holds 1 letter |\n| short | 2 | –32,768 to 32,767 | Whole numbers |\n|\
    \ unsigned short | 2 | 0 to 65, 535 | Whole numbers |\n| int | 4 | –2,147,483,648\
    \ to 2,147,483,647 | Whole numbers |\n| unsigned int | 4 | 0 to 4,294,967,295\
    \ | Whole numbers |\n| long | 4 | –2,147,483,648 to 2,147,483,647 | Whole numbers\
    \ |\n| long long | 8 | –9,223,372,036,854,775,808 to 9,223,372,036,854,775,807\
    \ | Whole numbers |\n| unsigned long long | 8 | 0 to 18,446,744,073,709,551,615\
    \ | Whole numbers |\n| float | 4 | 3.4E +/- 38 (7 digits) | Numbers with a fractional\
    \ part (floating point) |\n| double | 8 | 1.7E +/- 308 (15 digits) | Numbers with\
    \ a fractional part (floating point) |\n| long double | 12 | | | Numbers with\
    \ a fractional part (floating point) |\n| bool | 1 | True or false | True or false\
    \ |\n| wchar_t | 2 or 4 | As either `short` or `int` | “Wide” characters, which\
    \ can support international characters. As with `char`, each variable only holds\
    \ 1 letter. |\n\n### Using printf()\n\nNow do you remember the weirdness that\
    \ we saw a little bit ago with `printf()`? Let’s take another look at it.\n\n\
    ```cpp\n#include <stdio.h>\n\nint main(void)\n{\n    int a;\n    int b, c;\n\n\
    \    a = 1;\n    b = 2;\n    c = 3;\n\n    printf(\"a is %d, b is %d, and c is\
    \ %d.\\n\", a, b, c);\n\n    return a + b + c;\n}\n```\n\n`printf` is one of a\
    \ few functions which take a variable number of arguments. Its first parameter\
    \ is always a string. Depending on the number of placeholders in the string, though,\
    \ it may or may not have additional parameters following the string. For example,\
    \ in our above example, the string has three `%d` placeholders, one each for `a`,\
    \ `b`, and `c`. Three placeholders, three “extra” parameters. Here are some other\
    \ possible placeholders for `printf` that we’ll use later on. Note that this is\
    \ not an exhaustive list to `printf` – there are many more options, but these\
    \ will suffice for now.\n\n### printf placeholders\n\n| Placeholder | Type | Sample\
    \ output |\n| --- | --- | --- |\n| %c | Character | a |\n| %d, %i | Signed decimal\
    \ integer | 234 |\n| %e, %E | Scientific notation using e/E | 1.7e+5, 1.7E+5 |\n\
    | %f | Floating point number | 3.14 |\n| %g | Double precision number | 3.14 |\n\
    | %o | Integer in octal notation | 711 |\n| %u | Unsigned integer | 255 |\n| %x,\
    \ %X | Integer in hexadecimal notation | 0xff, 0xFF |\n| %% | Percent sign | %\
    \ |\n\n### Operators\n\nOperators give us ways of working with variables and numbers\
    \ without calling functions. `+`, `-`, and `*` are all examples of operators,\
    \ but C++ has many more than just these. Here are the arithmetic operators that\
    \ we’ll need for now.\n\n| Expression | Name | Effect |\n| --- | --- | --- |\n\
    | a + b | addition | adds b to a |\n| a - b | subtraction | subtracts b from a\
    \ |\n| a * b | multiplication | multiplies a by b |\n| a / b | division | divides\
    \ a by b |\n| a % b | modulo | the remainder of a / b |\n| a = b | assignment\
    \ | sets a to the value of b |\n| ++a | pre-increment | adds 1 to a before the\
    \ rest is evaluated |\n| a++ | post-increment | adds 1 to a after the rest is\
    \ evaluated |\n| --a | pre-decrement | subtracts 1 from a before the rest is evaluated\
    \ |\n| a-- | post-decrement | subtracts 1 from a after the rest is evaluated |\n\
    | a += b | assign with addition | Short for a + b |\n| a -= b | assign with subtraction\
    \ | Short for a - b |\n| a *= b | assign with multiplication | Short for a * b\
    \ |\n| a /= b | assign with division | Short for a / b |\n| a %= b | assign with\
    \ modulo | Short for a % b |\n\n`++` and `--` operators need a little more explanation\
    \ than possible in table. Let’s take a look at some code to explain it.\n\n```cpp\n\
    #include <stdio.h>\n\nint main(void)\n{\n    int a = 1;\n    int b = 2;\n\n  \
    \  // The result here will be 3 because we add 1 to a after b is calculated\n\
    \    printf(\"a++ + b = %d\\n\", a++ + b);\n\n    // Because we added 1 to a,\
    \ this prints 4.\n    printf(\"a + b = %d\\n\", a + b);\n\n    // This is 5 because\
    \ the compiler will add 1 to a before calculating\n    printf(\"++a + b = %d\\\
    n\", ++a + b);\n\n    return 0;\n}\n```\n\nWhew! We covered a lot of stuff in\
    \ lesson, but using all of it lets do all sorts of fancy stuff. Let’s put it to\
    \ use.\n\n```cpp\n#include <stdio.h>\n// math.h gives us access to a lot of mathematical\
    \ functions. We're\n// including it here so we can access sqrt(), which calculates\n\
    // square roots.\n#include <math.h>\n\ndouble hypotenuse(int a, int b)\n{\n  \
    \  return sqrt((a*a) + (b*b));\n}\n\nint main(void)\n{\n    int a = 3;\n    int\
    \ b = 4;\n\n    printf(\"For the triangle with legs %d and %d, the hypotenuse\
    \ will be %g\\n\",\n        a, b, hypotenuse(a, b));\n\n    return 0;\n}\n```\n\
    \n`hypotenuse()` returns a `double` because we want some sort of precision beyond\
    \ whole numbers. It is also the return type for `sqrt()`.\n\n### Assignment\n\n\
    Using the equation `Interest = Principal * rate * time`, calculate and print the\
    \ simple interest incurred on a principal of $20000 at a rate of 5% per month\
    \ for 24 months. Use a function to do the actual calculations.\n\n### Bug Hunt\n\
    \n#### Bug Hunt #1\n\n```cpp\nint sum(int first, int second, int third)\n{\n \
    \   return first + second + third;\n}\n\nint main(void)\n{\n    int a = 3;\n \
    \   int b = 4;\n\n    printf(\"The sum is %d\\n\", sum(a,b,c));\n\n    return\
    \ 0;\n}\n```\n`foo.cpp: In function ‘int main()’: foo.cpp:14: error: ‘c’ was not\
    \ declared in this scope`\n\n#### Bug Hunt #2\n\n```cpp\n#include <stdio.h>\n\n\
    double distance(int x1, int y1, int x2, int y2)\n{\n    int deltax = x2 - x1;\n\
    \    int deltay = y2 - y1;\n\n    return sqrt((deltax * deltax) + (deltay * deltay));\n\
    }\n\nint main(void)\n{\n    int x1, y1, x2, y2;\n\n    x1 = 3;\n    y1 = 3;\n\n\
    \    x2 = 8;\n    y2 = 3;\n\n    printf(\"The distance between (%d,%d) and (%d,%d)\
    \ is %g\\n\",\n        x1, y1, x2, y2, distance(x1, y1, x2, y2));\n\n    return\
    \ 0;\n}\n```\n`foo.cpp: In function ‘double distance(int, int, int, int)’: foo.cpp:8:\
    \ error: ‘sqrt’ was not declared in this scope`\n\n### Review\n\n1. What is the\
    \ numerical result of `10 % 4`?\n2. What is the difference between `c[++i]` and\
    \ `c[i++]`?\n3. What is a shorter way of writing `myVar = myVar * 5`?\n4. Why\
    \ is `==` used instead of `=` for comparing two quantities?\n5. What is the `printf`\
    \ placeholder for a `float`?\n6. What are parameters?\n7. What is the difference\
    \ between the types `int` and `long`?\n8. What is the numerical result of 10 /\
    \ 4? 10.0 / 4.0?\n"
