  trans: "\n\n# 进一步探索\n\n这里是一些你可能喜欢探索的可能更改，可以让此程序实现更多功能。我鼓励你尝试其中一些或全部更改。实验会带来许多“恍然大悟”的时刻并提高编程水平。\n\
    \n- 修改创建按钮时使用的 `BRect()` 中的数字，并禁用 `ResizeToPreferred()` 调用，让按钮变得非常、非常大——几乎和窗口本身一样大。\n\
    - 将按钮移动到窗口的一个角。\n- 添加第二个按钮，该按钮向窗口发送 `B_QUIT_REQUESTED` 消息使其关闭。\n- 创建几个可以移动窗口的按钮。（提示：为每个按钮使用不同的消息\
    \ ID，并在 `MessageReceived()` 中调用 `BWindow` 的 `MoveBy()` 方法）\n\n# 第 16 课\n\n由于最后几节重点在于掌握开发\
    \ Haiku 应用程序，你可能会认为我们已经学完了 C++，但这门语言仍另一些方面等待我们学习。我们将在编写 Haiku 程序的过程中，根据需要处理这些问题。\n\
    \n## 函数重载与运算符重载\n\n通常你认为重载是某种你通常不想做的事情，比如重载电路。在 C++ 中，这是我们经常做的操作，用于扩展现有函数或语言运算符的实用性。**函数重载**定义了多个接受不同参数组的函数版本。运算符只是函数，因此加号和减号等符号可以被扩展，以便我们将定义的类与其他\
    \ API 更好地整合。这使我们能够让对象变得极其灵活和方便。\n\n在上一节课的项目中，当我们为窗口生成标题时，看到了使用 `BString` 类进行运算符重载的第一个例子。它看起来像这样：\n\
    \n```cpp\nBString labelString(\"Clicks: \");\n// 这会将 fCount 的值添加到 labelString\
    \ 的末尾。\n// 下节课将详细介绍。\nlabelString << fCount;\n```\n\n通常 `<<` 运算符执行二进制左移，但它在 `BString`\
    \ 上的工作方式不同。`<<` 运算符被重载，作为其 `Append()` 方法的更灵活的快捷方式，将 `fCount` 转换为字符串，然后附加到 `labelString`\
    \ 的末尾。C++ 中的任何运算符都可以被重载，包括数组括号、用于函数调用的括号和箭头运算符。\n\n与 C++ 的其他方面一样，拥有执行某事的能力并不意味着你应该这样做。例如，让\
    \ `+` 运算符执行减法只会导致哭泣和咬牙。除极少数情况外，重载运算符执行的操作与它们在其他对象上执行的操作基本相同。通过这样做，你可以防止混乱和头疼。\n\
    \n除了少数几个运算符外，运算符函数既可以实现为方法（即类的一部分），也可以实现为普通函数。每者都有优缺点。例如，这里是重载 `+` 运算符的两种方式：\n\
    \n方法：\n\n```c++\nMyClass operator+(const MyClass &from);\n```\n\n普通函数：\n\n```cpp\n\
    MyClass operator+(const MyClass &first, const MyClass &second);\n```\n\n所有其他二元运算符都遵循这种格式。通常规则是，使二元运算符成为普通函数，这样你就可以使用关联对象而不需要显式进行类型转换。必须是方法的运算符只有赋值（`=`）、函数调用（`()`）、下标（`[]`）和成员选择（`→`）。其他赋值运算符如\
    \ `+=` 和 `/=` 应该是方法，但不是必须的。\n\n一元运算符遵循此实现格式：\n\n方法：\n\n```c++\nbool operator!(void)\
    \ const;\n```\n\n普通函数：\n\n```cpp\nbool operator!(const MyClass &target);\n```\n\
    \n还有几个特殊的案例运算符值得注意。首先，`and` 和 `--` 运算符呢？它们每一个都可以以两种不同的方式使用。这意味着有两种不同的方式来重载它们。重载时，必须实现前缀（`_i`）和后置（`i++`）版本。\n\
    \n```cpp\nclass MyClass\n{\n    // 前置增运算符\n    MyClass operator++(void);\n\n \
    \   // 后置增运算符。整数只是一个哑符参数\n    // 用于区分两者。\n    MyClass operator++(int dummy);\n\
    };\n```\n\n下标运算符（`[]`）也是一个特殊情况，因为它可以位于赋值的任意侧。它被要求是一个方法，因此只有一种实现方式：\n\n```cpp\n\
    MyClass &operator[] (const int index);\n```\n\n为了方便记住这些难记的信息，这里有一份几乎详尽的表格，将它们组织在一个地方。\n\
    \n运算符重载\n\n| 运算符 | 方法 | 普通函数 |\n| --- | --- | --- |\n| `+` | | 推荐 |\n| `-` | |\
    \ 推荐 |\n| `*` | | 推荐 |\n| `*/` | | 推荐 |\n| `%` | | 推荐 |\n| `=` | 必须 | |\n| `++`\
    \ | 推荐 | |\n| `+=` | 推荐 | |\n| `-=` | 推荐 | |\n| `*=` | 推荐 | |\n| `/=` | 推荐 | |\n\
    | `%=` | 推荐 | |\n| `--` | 推荐 | |\n| `<` | | 推荐 |\n| `<=` | | 推荐 |\n| `>` | | 推荐\
    \ |\n| `>=` | | 推荐 |\n| `==` | | 推荐 |\n| `!=` | | 推荐 |\n| 位运算 | | 推荐 |\n| `()`\
    \ | | 必须 |\n| `^` | | 推荐 |\n| `~` | | 推荐 |\n| `&&` | | 推荐 |\n| `||` | | 推荐 |\n\
    | `[]` | | 必须 |\n| `->` | 必须 | |\n| `<<` | | 推荐 |\n| `>>` | | 推荐 |\n| `=` | 必须\
    \ | |\n| `*=` | 推荐 | |\n| `>>=` | 推荐 | |\n| `^=` | 推荐 | |\n| `124=` | 推荐 |\n\n\
    ## 拷贝构造函数\n\n在上一节课中学习了构造函数和析构函数后，我们学习了大部分基础知识，漏了一个相关项目：拷贝构造函数，但我们将在处理浮点问题时解决它。\n\
    \n`float` 类型并不精确。相加 50 或 100 个浮点数，得到的结果不一定和你用计算器相加的结果相同。这源于它们在内存中的存储方式。通常情况下这不是问题，但如果我们编写一个个人财务程序，任何舍误差都将是一个问题。我们将创建一个精确到小数位且没有错误的类型。首先，让我们从基础类定义和一个快速的\
    \ `main()` 函数开始进行测试。\n\n```cpp\n#include <SupportDefs.h>\n#include <stdio.h>\n\
    \nclass Fixed\n{\npublic:\n        Fixed(void);\n        ~Fixed(void);\n\n   \
    \ float   GetValue(void);\n    void    SetValue(const int64 &value);\n\nprivate:\
    \    \n    int64   *fValue;\n};\n\nFixed::Fixed(void)\n{\n    fValue = new int64();\n\
    \    *fValue = 0;\n}\n\nFixed::~Fixed(void)\n{\n    delete fValue;\n}\n\nfloat\n\
    \nFixed::GetValue(void)\n{\n    return float(*fValue) / 100.0;\n}\n\nvoid\nFixed::SetValue(const\
    \ int64 &value)\n{\n    *fValue = value * 100;\n}\n\nint\nmain(void)\n{\n    Fixed\
    \ f;\n    f.SetValue(1234);\n    printf(\"Value: %f\\n\",f.GetValue());\n    return\
    \ 0;\n}\n```\n\n"
- fmt: "\nThe code itself isn’t terribly complicated. We have four public methods:\
    \ the constructor, which allocates heap memory for `fValue` and initializes the\
    \ value to zero, the destructor, which frees the heap memory for `fValue`, and\
    \ methods to get and set the object’s value.\n\nThe idea behind our fixed class\
    \ is that we’re going to use a regular integer to hold a floating point value\
    \ to avoid any rounding errors. The lowest two digits are reserved for the fractional\
    \ part, so we will have to multiply any outside numbers by 100 to be able to add\
    \ them to our `Fixed` class and divide the value of our `Fixed` class by 100 to\
    \ translate to proper values for the outside world. So far everything seems to\
    \ work properly. Let’s tweak our `main()` function a bit:\n\n```cpp\nint\nmain(void)\n\
    {\n    Fixed f1;\n    if (f1.GetValue() == 0)\n    {\n        Fixed f2;\n    \
    \    f2.SetValue(1234);\n        f1 = f2;\n    }\n    printf(\"Value: %f\\n\"\
    ,f1.GetValue());\n    return 0;\n}\n```\n\nIf compiled and run under Haiku, once\
    \ again everything seems to be OK, but there are two devilishly hard-to-find little\
    \ bugs in the works that will pop up only if our program gets more complicated:\
    \ the address held by `fValue` in our variable `f1` is deleted twice and there\
    \ is memory leaked. Double deletes are in some ways worse than memory leaks because\
    \ they can potentially crash your program and the location of the crash rarely\
    \ has much to do with the location of the problem. Worse yet, changing the code\
    \ can cause it to crash in a different place without any apparent reason.\n\n\
    The problem with this code is that the last line of the `if` block doesn’t do\
    \ exactly what we want it to do. What we want is to copy the *value*, but what\
    \ is copied is the *pointer*. When `f2` goes out of scope at the end of the `if`\
    \ block, its `fValue` is deleted. The problem is that `f1`'s `fValue` is pointing\
    \ to the same address. Uh-oh. `f1.fValue` is pointing to a memory location that\
    \ is now invalid. Anything can happen when `f1` is deleted when our program exits.\
    \ The memory allocated is also floating out in the ether, never to be deleted\
    \ until the operating system cleans up our mess for us. If a problem like this\
    \ should appear in a program under Ubuntu Linux, error information is printed\
    \ out, but for Haiku, nothing happens. This is actually worse because we’re not\
    \ told about a problem which exists.\n\nFixing the bug, fortunately, is pretty\
    \ easy once we understand it. The problem is that a shallow copy was performed.\
    \ Shallow object copies dump the exact values of the properties of one object\
    \ into another. This is fine so long as the objects' properties are allocated\
    \ on the stack. Heap-allocated properties require a deep copy. This can only be\
    \ done by implementing our own copy constructor and, while we’re at it, overloading\
    \ the assignment operator.\n\nThe copy constructor is a function called whenever\
    \ an object needs to be duplicated. The default copy constructor performs a shallow\
    \ copy, which is sufficient in many cases. This isn’t one of them, however. We\
    \ will add these two entries to the class definition:\n\n```cpp\nFixed(const Fixed\
    \ &from);\nFixed &operator=(const Fixed &from);\n```\n\nThe implementation of\
    \ these two functions will look like this:\n\n```cpp\nFixed::Fixed(const Fixed\
    \ &from)\n{\n    fValue = new int64();\n    *fValue = *from.fValue;\n}\nFixed\
    \ &\nFixed::operator=(const Fixed &from)\n{\n    *fValue = *from.fValue;\n}\n\
    ```\n\nThis copies the values in the addresses kept in `fValue` instead of copying\
    \ addresses themselves, thus performing a deep copy. All is right with the universe\
    \ again for a little while longer. Whew!\n\n## Assignment\n\nLet’s go one step\
    \ further and really flesh out this class. It may come in quite handy at some\
    \ point in the future. Here are the declarations for some more operator overloading\
    \ that would be useful to integrate our new class into the rest of the programming\
    \ environment:\n\n```cpp\nFixed operator+(const Fixed &first, const Fixed &second);\n\
    Fixed operator-(const Fixed &first, const Fixed &second);\nbool  operator<(const\
    \ Fixed &first, const Fixed &second);\nbool  operator>(const Fixed &first, const\
    \ Fixed &second);\nbool operator<=(const Fixed &first, const Fixed &second);\n\
    bool operator>=(const Fixed &first, const Fixed &second);\nbool operator!=(const\
    \ Fixed &first, const Fixed &second);\nbool operator==(const Fixed &first, const\
    \ Fixed &second);\n```\n\nGet some overloading practice by implementing and testing\
    \ these regular functions. You might also want to see what other operators might\
    \ come in handy.\n\n# Lesson 17\n\nWith a minor diversion into operator overloading\
    \ and copy constructors, we’ve been slowly learning how to put together a graphical\
    \ application for Haiku. So far we have examined the boilerplate code used to\
    \ start any Haiku program, event-based programming, and sending messages. Today\
    \ we’ll be putting what we know about messages to use to create a menu for a program.\n\
    \n## Using Menus\n\nWe’re going to learn about several classes this lesson: `BMenu`,\
    \ `BMenuBar`, `BMenuItem`, and `BView`, but we will be learning about them as\
    \ we put together another relatively simple application that we’ll call `MenuColors`,\
    \ which shows a window with a colored box that we can change by choosing a color\
    \ from a menu. Let’s get our project set up.\n\n1. Create a new, empty project\
    \ in Paladin. You can call the project `MenuColors` or any name you like.\n2.\
    \ Under the Project menu, click Add New File.\n3. Type in the filename `App.cpp`,\
    \ check the 'Create a header and source file' box, and click OK. This will create\
    \ `App.cpp` and `App.h`.\n4. Do the same for `MainWindow`.\n\nNow that we have\
    \ our files set up, let’s bang out some code. First, here is the code for `App.h`\
    \ and `App.cpp`. It be a good idea to type everything out instead of copying and\
    \ pasting so that you get familiarized with the boilerplate.\n\n```cpp\n// App.h\n\
    #ifndef APP_H\n#define APP_H\n\n#include <Application.h>\n\nclass App : public\
    \ BApplication\n\n{\n\npublic:\n    App(void);\n};\n\n#endif\n```\n\n```cpp\n\
    // App.cpp\n#include \"App.h\"\n#include \"MainWindow.h\"\n\nApp::App(void)\n\
    \    :   BApplication(\"application/x-vnd.test-MenuColors\")\n\n{\n    MainWindow\
    \ *mainwin = new MainWindow();\n    mainwin->Show();\n}\n\nint\nmain(void)\n{\n\
    \    App *app = new App();\n    app->Run();\n    delete app;\n    return 0;\n\
    }\n```\n\nNone of the code in these files is anything new. Note that because we\
    \ haven’t entered the class definition for `MainWindow` in its header file, if\
    \ you try to build your project right now, you get some errors. Don’t worry –\
    \ we’ll have everything working in just a moment. Here is the code for `MainWindow.h`:\n\
    \n```cpp\n// MainWindow.h\n#ifndef MAINWINDOW_H\n#define MAINWINDOW_H\n\n#include\
    \ <Window.h>\n\nclass MainWindow : public BWindow\n\n{\n\npublic:\n    MainWindow(void);\n\
    \    void        MessageReceived(BMessage *msg);\n};\n\n#endif\n```\n\nThis, too,\
    \ is familiar territory. All of the new code will be in `MainWindow.cpp`, but\
    \ let’s start with the boilerplate code for `MainWindow` and add to it bit by\
    \ bit. The best way to write code is to add a little at a time, compile, and then\
    \ test what you’ve written to help you find bugs.\n\n```cpp\n// MainWindow.cpp\n\
    #include \"MainWindow.h\"\n#include <MenuBar.h>\n#include <Menu.h>\n#include <MenuItem.h>\n\
    #include <View.h>\n\nMainWindow::MainWindow(void)\n    :   BWindow(BRect(100,100,500,400),\"\
    MenuColors\",B_TITLED_WINDOW,\n                B_ASYNCHRONOUS_CONTROLS | B_QUIT_ON_WINDOW_CLOSE)\n\
    \n{\n}\n\nvoid\nMainWindow::MessageReceived(BMessage *msg)\n{\n    switch (msg->what)\n\
    \    {\n        default:\n        {\n            BWindow::MessageReceived(msg);\n\
    \            break;\n        }\n    }\n}\n```\n"
