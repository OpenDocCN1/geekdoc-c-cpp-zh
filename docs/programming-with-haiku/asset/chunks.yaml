    \ 程序有独特的类型。将 `dw` 替换为你的公司名称、在线网名或字母缩写，将 `MyFirstApp` 替换为你的程序名称——只需确保签名以 `application/x-vnd.`\
    \ 开头。这将确保不会与你在网上发布的任何程序发生混淆。\n\n这个项目是一个精简的应用程序，用于展示创建一个简单窗口所需的最少代码。这看起来可能有点多，但与用\
    \ C++ 编写的 Windows 程序相比，它是非常短的。下次，我们将创建一个功能更多的窗口，但现在，请尝试玩玩这些代码，看看你能用它做些什么——钻研能带来更深入的。\n\
    \n# 第 15 \n\n现在我们已经为 Haiku 编写了第一个可以运行的（尽管简单的）GUI 应用程序，我们将开始学习所谓的 Haiku API 基础知识。\n\
    \n## Haiku API 概述\n\n我们可用的所有操作系统库都组织成称为“kits”（工具包）的分类组。其中某些 kits 有关联的服务器，有些没有。大多数\
    \ Haiku 程序只与 kits 工作，不再涉及其他，尽管设备驱动直接与硬件交互并大部分调用内核函数。Haiku 作为操作系统的布局及其“层”大致如下：\n\
    \n截至本文编写时，官方 kits 如下：\n\n除了这些官方 kits，还有两个正在开发中并被认为是实验性的 kits：`Layout Kit`（布局包包）和\
    \ `Locale Kit`（本地化包）。如果这看起来很多，是因为它确实很多，但取决于你编写的程序类型，你可能永远不需要处理某些 kits。我们稍后会详细查看某些\
    \ kits，但现在我们将主要关注 `Application`（应用）、`Interface`（接口）和 `Support`（支持）kits。\n\n###\
    \ Application Kit\n\nApplication Kit 很小，但至关重要。重点集中在 `BMessage`（程序内部以及程序之间通信的手段）和\
    \ `BApplication`（必须对其进行子类化以编写使用 `BMessages[¹]` 的程序）。\n\n### Device Kit\n\nDevice\
    \ Kit 为某些硬件提供了类。由于此 kit 中只有两个类，因此通常不被使用，但它在 Haiku 的未来版本中可能会扩展。\n\n### Game Kit\n\
    \nGame Kit 的假设是，游戏程序员很大程度上想要直接访问用于显示屏幕的内存区域——视频缓冲区——然后让他们独自去施展他们的“黑魔法”。此外，这里还有一些类，可以让游戏作者编写游戏声音变得简单。\n\
    \n### Interface Kit\n\n对于应用程序程序员来说，Interface Kit 因其规模庞大而同样重要。窗口、按钮、复选框等都出现在它的伞下。打印功能也由这个\
    \ kit 处理。\n\n### Kernel Kit\n\nKernel Kit 是唯一一个不是 C++ 类集合的 kit。相反，它由低级 C 函数调用组成。\n\
    \n### Mail Kit\n\nMail Kit 用于构建和发送电子邮件。关于它没什么好说的。\n\n### Media Kit\n\nMedia Kit\
    \ 专注于音频和视频处理。Haiku 特别擅长以最小的 `latency`（延迟）播放和录制音频视频。\n\n### MIDI Kit\n\nMIDI 代表\
    \ **M**usical **I**nstrument **D**igital **I**nterface（乐器数字界面），这是一个古老的标准，定义了如何让乐器与计算机通信。MIDI\
    \ kit 处理 MIDI 数据，就像 Media Kit 专注于视频和音频处理一样。\n\n### Network Kit\n\n如果你来自 UNIX 编程背景，你可能习惯于使用\
    \ C 函数进行网络编程。Network Kit 的类从一个稍微友好的角度处理通信代码编写。\n\n### OpenGL Kit\n\n如果你对 3D 图形感兴趣，这个\
    \ kit 适合你。这里只有一个类 `BGLView`，但它为将 OpenGL 图形整合到你的应用程序中打开了大门。\n\n### Storage Kit\n\
    \nStorage Kit 提供了操作文件系统的友好方法。除了读写文件外，还有用于读取目录、运行查询和处理属性的类。\n\n### Support Kit\n\
    \n这个 kit 设计用于通过辅助类支持其他 kits。`BString`、`BList` 和 `BLocker` 特别有用且被频繁使用。\n\n### Translation\
    \ Kit\n\nTranslation Kit 是 Haiku 的创新之一。它提供了一个单一接口来读写图片和文本，而无需理解底层文件格式。对于我们程序员来说，它让生活变得简单得多。\n\
    \n## 事件驱动编程\n\n为控制台编写程序非常简单，因为你（开发者）控制着执行流。GUI 则不能如此，因为此类程序是用户与你的程序之间的交互。用户做了一些事情，你的程序做出响应。系统发生了某些异常，你的程序警告用户。你的代码变成了一组对不同事件的响应。这很大程度上等同于发送消息并处理任何进入的消息。\n\
    \n事件驱动编程的一个例子是响应鼠标。如果用户点击窗口的关闭按钮，系统将通知你的程序用户正在请求关闭窗口。对该请求进行处理是你的工作。当用户点击按钮时，它会发送一条消息。谁收到消息以及采取什么响应取决于你。\n\
    \n### Haiku 消息机制\n\nHaiku 作为操作系统内部发生的大量通信都围绕着消息展开。尽管我们现在不会使用所有的这些类，但让我们快速看看这些用于发送消息的类：\n\
    \n*   `Application` – 应用类。\n*   `Clipboard` – 剪板类。`Clipboard` 使用剪板与系统交换信息。\n*\
    \   `Cursor` – 与消息无关，但 `Cursor` 负责改变鼠标指针的样子。\n*   `Handler` – 一个用于采取适当行动的类。\n\
    *   `Invoker` – 消息发送类，用于按钮和复选框。每当它的 `Invoke()` 方法被调用时，它都会接收到消息。\n*   `Looper`\
    \ – `Looper` 接收消息并通过一系列 `Handler` 传递它们。\n*   `Message` – 在系统周围发送的对象的类型。它有一个标识符属性\
    \ `what`，以及附加和检索数据的方法。\n*   `MessageFilter` – 用于过滤掉——不需要的——消息类。\n*   `MessageQueue`\
    \ – `MessageQueue` 以先来的方式存储消息。它主要供 `Looper` 实例在处理其他消息时临时持有。\n*   `MessageRunner`\
    \ – 该类按指定间隔发送消息。\n*   `Messenger` – 消息发送类。它可以向 `Handler` 和 `Looper` 发送消息，无论它们是在你的程序中还是其他程序中。\n\
    *   `PropertyInfo` – `PropertyInfo` 的目的。如果你不从外部启用你的程序，你可能永远都不需要它。\n*   `Roster`\
    \ – `Roster` 类与系统的应用程序守护进程通信。它用于向所有运行的程序发送消息、启动程序或检查特定程序是否正在运行。\n\n在所有这些类中，在应用程序编程过程中常用的是\
    \ `Looper`、`Invoker`、`Message`、`Handler` 和 `Application`，尽管这听起来很多，但考虑到每个类中只有少数方法被频繁使用，其实并不多。\n\
    \n在 Haiku 编程中响应大多数事件可以归结为一个函数：`MessageReceived()`。它是一个钩子函数，即旨在由子类实现以响应事件的虚拟函数。在这种情况下，`MessageReceived()`\
    \ 由子类实现，以处理父类未处理的消息。任何 `BHandler` 的子类（包括 `Looper`、`Application`、`Window` 和 `View`）都有这个钩子函数。大多数时候，它看起来像这样：\n\
    \n```\n\n"
- fmt: "\n```cpp\nvoid MyWindow::MessageReceived(BMessage *msg)\n{\n    switch (msg->what)\n\
    \    {\n        case M_SOME_MESSAGE:\n        {\n            DoSomething();\n\
    \            break;\n        }\n        default:\n        {\n            // This\
    \ calls the version of MessageReceived\n            // implemented by MyWindow's\
    \ parent class, BWindow.\n            BWindow::MessageReceived(msg);\n       \
    \     break;\n        }\n    }\n}\n```\n\n`MessageReceived()` can end up handling\
    \ many different message codes, so a `switch` statement is called for here, and\
    \ the `switch` differentiates between messages using the `what` identifier. Calling\
    \ the `BWindow` version of `MessageReceived()` is important because it handles\
    \ all the messages that are ignored by the version that we have written.\n\nUnderstanding\
    \ how messaging works in Haiku is best learned in code, so we’ll look at a second\
    \ example, very much similar to the one from the last lesson, but which expands\
    \ on what we know. We will create a window with a button. Clicking the button\
