    \ the memory to a different address and, if it does, it returns the new address.\
    \ Existing data in the memory block is preserved, even if the pointer is moved\
    \ to a different address, but any new memory obtained with this call will contain\
    \ random data.\n\nWorking with these memory functions isn’t difficult. Let’s have\
    \ a look at some of them in action with a simple example.\n\n```\n#include <stdio.h>\n\
    \n// Another new include! malloc.h contains definitions for\n// malloc and related\
    \ memory-allocation routines\n#include <malloc.h>\n\nint main(void)\n{\n    //\
    \ We are just going to print a string in this example, but\n    // we are going\
    \ to use heap memory this time instead of the stack.\n    // This pointer will\
    \ hold the address of the memory block for our string.\n    // We don't have any\
    \ memory for it just yet, so we'll just set it to NULL\n    char *string = NULL;\n\
    \n    // Now we will request a block of heap memory from the operating system\n\
    \    // and give our string pointer its address.\n    // The (char *) is what\
    \ we need to do to cast our block of memory from\n    // having no type (void\
    \ *) to a char pointer. 50 bytes have been requested,\n    // which is enough\
    \ to hold 49 characters and the NULL terminator\n    string = (char *)malloc(50);\n\
    \n    // sprintf is an easy way to convert numbers into strings\n    sprintf(string,\
    \ \"The number pi is approx. %f\",3.1415927);\n\n    printf(\"%s\\n\", string);\n\
    \n    // This will give the 50 bytes of heap memory that we requested earlier\n\
    \    // back to the system.\n    free(string);\n\n    // The address that our\
    \ pointer holds is NO LONGER VALID. Any attempt\n    // to use it will have unpredictable\
    \ results, but most likely will cause\n    // a segmentation fault. We're done\
    \ in this example, but if we were going\n    // to need the pointer again, we'd\
    \ need to assign it to a valid address\n    return 0;\n}\n```\n\n## Beyond Base\
    \ 10: Binary Math\n\nNow let’s take some time to learn some math that we will\
    \ need in future lessons. Just as computers and people are different in what number\
    \ they start counting with, the numbering systems that each uses to count are\
    \ worlds apart.\n\nPeople use the decimal system, also known as base 10\\. It\
    \ is called base 10 because there are 10 possible values in each column, from\
    \ zero to nine. When you were very young, you may have heard your arithmetic teacher\
    \ talk about the \"ones place,\" the \"tens place,\" and the \"hundreds place.\"\
    \ The name for the column is the same as 10 raised to the power of the number\
    \ of columns moving from right to left, counting from zero.\n\n| \"Thousands Place\"\
    \ | \"Hundreds Place\" | \"Tens Place\" | \"Ones Place\" |\n\n| --- | --- | ---\
    \ | --- |\n\n| 1000 = 10³ | 100 = 10² | 10 = 10¹ | 1 = 10⁰ |\n\nFor the number\
    \ 5,234, the total is (1000 x 5) + (100 x 2) + (10 x 3) + 4.\n\nThe math involved\
    \ at the bare metal level of interaction with computers is far removed from anything\
    \ that we, as people, would have any use for. Computers use binary math – base\
    \ 2 counting. The only values which exist are 1 and 0\\. The digit \"places\"\
    \ in base 2 math look like this:\n\n| \"Eights Place\" | \"Fours Place\" | \"\
    Twos Place\" | \"Ones Place\" |\n\n| --- | --- | --- | --- |\n\n| 8 = 2³ | 4 =\
    \ 2² | 2 = 2¹ | 1 = 2⁰ |\n\nEach individual digit in binary math is called a **bit**.\
    \ It’s just a bit of information, and it doesn’t do much on its own. Bits are\
    \ grouped together into bundles of 8, called **bytes**. Whenever we do any binary\
    \ math when programming, it will involve at least one byte, and often more, but\
    \ for now we’ll just stick to one to keep things as simple as possible for this\
    \ confusing topic.\n\nRemember that binary numbers are just a different way of\
    \ writing numbers, like the difference between the number 68 and the Roman Numeral\
    \ LXVIII.\n\nTo convert a number from binary to decimal, you add up the values\
    \ in each place. Each digit in a byte is simply a power of two:\n\n| Bit Number\
    \ | 7 | 6 | 5 | 4 | 3 | 2 | 1 | 0 |\n\n| --- | --- | --- | --- | --- | --- | ---\
    \ | --- | --- |\n\n| Decimal Value | 128 | 64 | 32 | 16 | 8 | 4 | 2 | 1 |\n\n\
    For each column that has a binary 1 in it, you add the power of 2 that is assigned\
    \ to that column. For example, binary 10000000 is decimal 128\\. The only column\
    \ that has a 1 in it is the first one, which has a decimal value of 128\\. Binary\
    \ 10000111 is decimal 135\\. How? 128 + 4 + 2 + 1.\n\nIt’s possible to do addition,\
    \ subtraction, and any other regular mathematical operation in binary, but it’s\
    \ almost never necessary, so we won’t cover it here. There are, however, some\
    \ other operations that are commonly used which are specific to binary math, and\
    \ C and C++ provide operators for them. They are remarkably similar to the Boolean\
    \ logic operators we’ve already learned.\n\nBitwise operators\n\n| Operator |\
    \ Name | Description |\n\n| --- | --- | --- |\n\n| & | Bitwise AND | Turns bits\
    \ off |\n\n|  | Bitwise OR | Turns bits on |\n\n| ^ | Bitwise Exclusive OR (XOR)\
    \ | Flips bits |\n\n| ~ | Bitwise NOT | Flips all bits in a number |\n\nThis table\
    \ doesn’t have the space to give all of the information. Much more explanation\
    \ is required. These are special mathematical operations with specific purposes.\
    \ The Boolean AND, OR, and NOT operators are used for program logic, i.e. linking\
    \ together conditions for *if* statements and the like. The bitwise operators\
    \ in the table above are for manipulating the bits in numbers.\n\n### Bitwise\
    \ AND\n\nBitwise AND is used to turn off bits in a number, that is, set certain\
    \ 1 bits in a number to 0\\. This is done by comparing the corresponding bits\
    \ in each number and applying Boolean logic to determine whether or not the bit\
    \ should be a 1 or 0\\. Here are two examples that help show how this works.\n\
    \n#### Example 1\n\n255 & 240 = 240\n\n|  | Decimal | Binary |\n\n| --- | ---\
    \ | --- |\n\n|  | 255 | *11111111* |\n\n| AND | 240 | *11110000* |\n\n| = | 240\
    \ | *11110000* |\n\n#### Example 2\n\n240 & 170 = 160\n\n|  | Decimal | Binary\
    \ |\n\n| --- | --- | --- |\n\n|  | 240 | *11110000* |\n\n| AND | 170 | *10101010*\
    \ |\n\n| = | 160 | *10100000* |\n\nThe only time a bit stays on is when it is\
    \ a 1 in the first AND second number. This is why the bitwise AND operator is\
    \ used for turning bits off.\n\nTo turn a specific bit off, we have to figure\
    \ out what number is needed to turn off only the bit desired and leave the rest\
    \ on. This is as simple as using a number which has all bits on except for the\
    \ one we want to turn off."
