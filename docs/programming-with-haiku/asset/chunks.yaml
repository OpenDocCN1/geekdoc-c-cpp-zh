    \n# 第 23 \n\n编写一个完整的程序不仅仅是编写让它运行的代码。我们的幸运钱程序还需要一个图标和一些其他的润色。\n\n## 调整资源\n\n进一步完善我们程序的剩余任务之一是处理应用程序的资源。它们存储在单独的文件中，并在程序构建后打包到程序中。让我们从向项目添加一个资源文件开始。\n\
    \n1. 在 `Paladin` 中，从 `Project` 菜单选择 `Add New File`，就像你要添加新文本文件一样。\n2. 为新文件输入 `Resources.rsrc`\
    \ 并按回车。\n\n你的项目中已添加了一个闪闪新的资源文件。双击它将会在默认的资源文件编辑器中打开它。\n\n我们应该做的第一件事是设置程序的图标，但让我们先讨论我们要设置哪种图标。Haiku\
    \ 有三种可以使用不同的图标：矢量图标、大图标和微型图标。后两个是所有 BeOS 系统的标准配置，分别是 256 色 32 和 16 像素的正方形位图。矢量图标是一种专门为\
    \ Haiku 开发的特殊格式 `Haiku Vector Icon Format`，它看起来非常好，同时占存储空间非常小。创建 HVIF 图标超出了这些课程的范围，因此我们在这里重点关注位图格式。\n\
    \n1. 在 `QuickRes` 中打开 `Resources.rsrc`。\n2. 将 `HaikuFortune16.png` 和 `HaikuFortune32.png`\
    \ 拖入 `QuickRes` 窗口以将它们添加到资源文件中。\n3. 点击 `QuickRes` 窗口左角的 `New` 下拉菜单并选择 `Icon`。这将创建两个新条目：一个\
    \ `ICON` 类型和一个 `MICN` 类型。它们分别对应大图标和微型图标。\n4. 点击一次 `ICON` 类型条目以高亮显示。等待一会儿——长到足以让\
    \ `QuickRes` 不会认为你在双击——然后点击条目的名称，它应该显示为 `\"New Icon\"`。如果你操作正确，将出现一个文本框，你可以编辑名称。\n\
    5. 将 `ICON` 条目的名称更改为 `BEOS:L:STD_ICON` 并按回车完成条目名称编辑。顺便说，这里的大小敏感。\n6. 对 `MICN`\
    \ 条目执行相同的操作，但将其命名为 `BEOS:M:STD_ICON`。\n7. 双击 `HaikuFortune32.png` 条目以进入编辑窗口。\n\
    8. 选择图片并使用 `Edit` 菜单中的 `Select All` 和 `Copy` 命令将其复制到剪贴板。\n9. 关闭 `HaikuFortune32.png`\
    \ 窗口并双击你刚刚创建的 `ICON` 条目。\n10. 点击矩形选择工具图标并点击较大的网格内部。如果还没有蓝色框，这会在较大网格边缘出现一个蓝框。\n\
    11. 点击 `Edit` 菜单中的 `Paste`。来自 `HaikuFortune32.png` 的图片数据将出现在较大的网格中。\n12. 按照相同的步骤将\
    \ `HaikuFortune16.png` 的数据复制到窗口中较小的网格中。\n\n一旦你按照这些步骤操作，保存资源文件的更改，关闭 `QuickRes`\
    \ 并重新构建你的项目。如果你一切做得正确，你的程序图标将变为蓝色背景上的精美幸运饼干。如果没有，请返回并双检你的工作，找到遗漏了什么并进行必要的更改。\n\
    \n我们还需要为应用程序设置版本、签名和启动标志。为此，我们将使用 `FileType Tracker` 插件。打开你的项目文件夹，选择资源文件，右键点击它并在\
    \ `Add-ons` 子菜单中选择 `FileType`。\n\n![](img/file5.png)\n\nFileTypes 中的我们的资源文件\n\n\
    此窗口的某些部分是显而易懂的，但我们最好检查一下所有内容，从顶部的应用程序签名开始。签名应该设置为与我们代码中传递给 `BApplication` 构造函数的相同字符串，但去掉引号。不将此项留在程序资源中并不是什么惊天动地的错误，但如果它在那里，它应该与发送给\
    \ `BApplication` 的签名匹配。\n\n`Application Flags` 组设置了程序启动方式的一些选项。单次启动模式（Single launch\
    \ mode）是正常但不是默认的行为，它会将我们程序的一个副本加载到内存并运行。尝试运行第二个副本除了在程序未最小化的情况下切换到该程序外什么也不做。然而，如果用户重命名可执行文件并尝试运行，它也会运行第二个副本。独占启动（Exclusive\
    \ launch）防止了这种情况，并确保你的程序同时只有一个副本在运行。多次启动（Multiple launch）允许你的程序同时运行多个实例。如果你在程序资源中省略了应用程序标志，这就是默认行为。仅勾选\
    \ `Args` 复选框意味着给程序的唯一信息将通过其提供的命令行参数提供。没有 BeOS 风格的消息会发送给它。此标志最用于命令行应用程序。`Background\
    \ app` 复选框允许你的程序在后台启动而不显示在桌面栏中。此标志通常用于服务器程序 `Media` 和 `Daemon`。\n\n`Supported\
    \ Types` 框与程序支持的任何文件类型有关。例如，如果你正在编写一个表格应用程序，你可以放入它能够处理的各种类型。我们的幸运程序不需要这些，所以我们将跳过此节。\n\
    \n`Version Info` 框包含应用程序版本号控制。下拉框用于发布质量，如 `alpha`、`beta`、`golden master`（也称为发布候选）和\
    \ `final`。`short description` 应该包含描述程序用途的短句。`long description` 应该包含更多信息——但不应包含小说。\n\
    \n`icon` 框用于更多外观。右键点击现有图标允许你删除或编辑它。可以将图标拖到框中以添加一个新的。通过 `QuickRes` 双击现有图标，你只能编辑应用程序的矢量图标。关闭窗口。\n\
    \n## 源代码\n\n一旦设置了资源，我们应该考虑为源代码选择许可证。所有源代码都是授权的。哪种许可证取决于作者的意愿。在发布程序之前，你需要考虑发布程序时的许可证。这将决定程序的寿命。首先，考虑源代码是否对他人可用——封闭还是开源。Haiku\
    \ 基于开源，并且周围的社区也基本如此。如果你计划对你的程序收费，开源是更好的选择。如果未来未来某个时刻你决定不再维护该项目，其他人将继续努力。\n\n如果你选择让源代码可用，有很多开源许可证可以选择。以下是最流行的许可证列表及其简要概述：\n\
    \n- `MIT` —— 任何人都可以按照意愿使用代码，只要保留原始的版权信息。这是 Haiku 发布时的许可证。这对其他 BeOS 开发者用于自己的项目也很流行。\n\
    - `GNU Public License (GPL)` —— 任何软件的公开分发都必须提供源代码。任何使用 GPL 代码的代码都必须在 GPL 下发布。这是\
    \ Linux 操作系统最流行的许可证。\n- `Lesser GNU Public License (LGPL)` —— 任何公开分发都必须提供源代码。直接使用\
    \ LGPL 代码的代码必须在 LGPL 下发布，但如果程序仅仅链接 LGPL 代码，则不需要。换句话说，链接 LGPL 库并不要求程序具有相同的许可证。\n\
    - `Mozilla Public License (MPL)` —— 根据 GPL，任何对 MPL 许可代码的更改必须提交回原始项目。\n- `Public\
    \ Domain` —— 作者放弃对代码的所有权利。代码可以进行任何操作，包括删除所有版权信息以及你想到的任何其他事情。此外，一旦代码进入公领域，就无法收回。但没有什么能阻止你使用、改进和重新授权你的代码。\n\
    \n## 程序打包以分发\n\n发布我们的程序是在完成工作之前应该解决的另一个话题。分发有两种：软件包和 zip 归包。两者都有优缺点。\n\n软件包是两者中更强大的格式。它们是用\
    \ BeOS 开发工具 `PackageBuilder` 创建的。因为 `PackageBuilder` 是 BeOS R5 开发工具包的一部分，它是免费下载的，但不能作为另一个分发的一部分重新发布。`PackageBuilder`\
    \ 不再开发，也不会在非混合 GCC4 Haiku 环境中运行。然而，它生成的软件包在这种情况下是可以安装的。它可以在计算机的多个位置安装文件。虽然它没有在桌面栏创建链接的功能，但可以像软件包中的其他文件一样创建并安装符号链接。作为获得更多灵活性的代价，创建软件包需要更多时间。\n\
    \nzip 归包是两种格式中更简单、更快速的。在应用程序文件夹中按你想要的方式设置一切，运行 `Zip-O-Matic Tracker` 插件即可。不幸的是，这给用户带来了安装应用程序文件夹和在桌面栏创建符号链接的负担。对于不需要在硬盘多个位置存放文件的简单应用程序，建议使用\
    \ zip 归包。\n\n# 答案\n\n## 第 1 \n\n### 复习\n\n1. 机器码是计算机的本地语言——计算机执行的一组数字指令。\n2. 源代码是用于创建程序的人类可读文本。\n\
    \n## 第 2 \n\n### 复习\n\n1. 使用两个正斜杠 `//` 添加单行注释，跨越多行的注释放置在这些标记之间：`/* */`。\n2. 将源代码转换为机器码的四个工具是预处理器、编译器、汇编器和链接器。\n\
    3. 编程错误分为语法和语义错误两类。语法错误是计算机语言构造中的错误，例如语句中的括号数量错误。语义错误是语法正确的代码程序逻辑中的错误。\n\n## 第\
    \ 3 \n\n### 复习\n\n1. `%` 运算符返回两个参数除法的余数。`10 % 4` 结果为 2。\n2. `++i` 在表达式的其他部分之前加\
    \ 1。`i++` 在之后加。\n3. `myVar *= 5`\n4. `==` 用于比较，因为 `=` 用于给变量赋值。\n5. `%f` 是 `printf`\
    \ 中浮点数的占位符。\n6. 参数是提供给函数执行其任务所需的信息。\n7. `int` 和 `long` 的区别是 `long` 通常可以持有更大的值。\n\
    8. `10 / 4` 是整数除法，结果是 2。`10.0 / 4.0` 是浮点除法，结果是 2.5。\n\n## 第 4 \n\n### 作业\n\n我们的任务是使用公式\
    \ `Interest = Principal * rate * time` 计算并打印本金 $20000 在月利率 5% 的 24 个月内产生的单利，我们必须创建一个函数来执行实际的利息计算。\n\
    \n"
- fmt: "\n```c\n#include <stdio.h>\n\nfloat SimpleInterest(float principal, float\
    \ rate, int months)\n{\n    return principal * rate * months;\n}\n\nint main(void)\n\
    {\n    // Our $20000 principal\n    float p = 20000.00;\n    // 5% interest is\
    \ .05\n    float r = .05;\n    int m = 24;\n    float interest = SimpleInterest(p,\
    \ r, m);\n    printf(\"The interest on %f at %f%% interest for %d months is $%f\\\
    n\",\n        p, r * 100, m, interest);\n}\n```\n\n### Bug Hunt\n\n1. The variable\
    \ `c` was not declared. Add a line `int c = 5;` after the one for b and this will\
    \ compile (and work) properly.\n2. The include for `math.h` has been forgotten.\
    \ Add `#include <math.h>` to the top of the example.\n\n### Review\n\n1. Nothing\
    \ will be printed. `i` has a value of zero, which, for the purposes of logic,\
    \ is treated as false.\n2. The boolean OR operator, `||`, should be used here.\n\
    3. The first section of the control block of a `for` loop sets the value of the\
    \ index variable. The second section is the test to see if another iteration is\
    \ called for, and the third modifies the index variable.\n\n## Lesson 5\n\n###\
    \ Assignment\n\nIn the last lesson we were trying to make a program which asks\
    \ for a word from the user and it prints out the integer value of each character.\n\
    \nWe were given these steps to follow to write it:\n\n1. Make a `char` array to\
    \ hold the user input.\n2. Call `gets()` to get the string from the user.\n3.\
    \ Make an `int` variable and set it to the string’s length\n4. Use a `for` loop\
    \ to print each character in the string both as a character and its numerical\
    \ value.\n\n```c\n#include <stdio.h>\n#include <string.h>\n\nint main(void)\n\
    {\n    char inString[1024];\n    printf(\"Type the text to convert and press Enter:\
    \ \");\n    gets(inString);\n    // Here was the part we needed to fill in, so\
    \ here's one way to do it.\n    // Step 3.\n    int strLength = strlen(inString);\n\
    \    // Just some fluff to make this program a little nicer\n    printf(\"The\
    \ character codes for the string \\'%s\\'\\n\",inString);\n    // Step 4.\n  \
    \  for (int i = 0; i < strLength; i++)\n        printf(\"[%d]: %c\\t%d (0x%x)\\\
    n\", i, inString[i], inString[i], inString[i]);\n    return 0;\n}\n```\n\nThis\
    \ example even includes printing the character code in both decimal and hexadecimal.\n\
    \n### Bug Hunt\n\n1. The `i++` in the for loop needs to be `i += 2`.\n2. The warnings\
    \ come from using the `%d` – used for integers – for a `float` variable. Change\
    \ the `%d` placeholders in the `printf` statements to `%f` and they’ll go away.\n\
    \n### Review\n\n1. A segmentation fault is an attempt to access memory that doesn’t\
    \ belong to your program.\n2. Because array indices start at 0, the last valid\
    \ index for a 10-element array is 9.\n3. Pointers should be initialized to `NULL`\
    \ or a known-good address so that you always can tell whether or not a pointer\
    \ is valid and can, thus, avoid segfaults.\n4. `'a'` is a character constant.\
    \ `\"a\"` is a string, which amounts to the `'a'` character constant plus a NULL\
    \ string terminator.\n5. A string is an array of the type `char`.\n6. `string.h`\
    \ is the header which we have been using that contains helper functions for working\
    \ with strings.\n\n## Lesson 6\n\n### Bug Hunt\n\nThere was only one hunt because\
    \ of how hard it was. It’s a kind of error called an off-by-1 error. These are\
    \ sometimes are to track down, like this one was. The errors and corrections are\
    \ commented.\n\n```c\nchar *ReverseString(char *string)\n{\n    // This function\
    \ rearranges a string so that it is backwards\n    // i.e. abcdef -> fedcba\n\
    \    if (!string)\n        return NULL;\n    int length = strlen(string);\n  \
    \  int count = length / 2;\n    for (int i = 0; i < count; i++)\n    {\n     \
    \   // This line from Lesson 6 is incorrect\n        //char temp = string[length\
    \ - i];\n        char temp = string[length - 1 - i];\n        // So is this one\n\
    \        //string[length - i] = string[i];\n        string[length - 1 - i] = string[i];\n\
    \        string[i] = temp;\n    }\n    return string;\n}\n```\n"
