    这个项目与上一个项目相比并没有什么本质不同。通过调用 `BListView` 的 `SetSelectionMessage()` 方法，我们可以在用户每当点击列表中的某项时都更新标题。在大多数情况下，我们使用
    `BListView` 时不会使用这个方法。更常见的做法是调用相关的方法：`SetInvocationMessage()`，它会在用户双击某项时发送一条消息。请注意，`DeselectAll()`
    即使在没有选择的情况下也会发送选择消息，因此有必要处理 `CurrentSelection()` 返回负值的情况，该负值表示没有选择项。


    希望你已经开始熟悉 BViews 和普通控件在应用程序中是如何组合在一起的。它们中的大多数都需要一个 `BRect` 来指定尺寸和位置，一个 `const
    char **` 来指定控件名称，以及两个整数来指定缩放模式和某些行为标志位。许多类还包含标签以及一个在控件被更改或调用时发送的消息，尤其是那些派生自 `BControl`
    的类。一旦创建了控件，它就会通过 `AddChild()` 附加到 `BWindow` 或 `BView` 上。控件发送的消息通常发送到它所附加的窗口，也可以重定向到另一个目标，例如父
    `BView` 或全局的 `BApplication`。


    ## 需要记忆的类和方法


    ### BControl

    * `ResizeToPreferred(void)` – 派生类将调整自身到合适的尺寸，以显示其标签和内容。

    * `SetLabel(const char *label)` / `const char * Label(void)` – 为子类获取和设置标签的方法。

    * `SetTarget(BHandler *handler, BLooper *looper)` – 将调用消息发送到不同的目标，例如 `BView`、`BWindow`
    或 `BApplication`。

    * `void SetEnabled(bool enabled)` / `bool IsEnabled(void)` – 获取和设置控件启用/禁用状态的方法。


    ### BListView

    * `AddItem(BListItem *item)` – 向列表添加一个项。

    * `int32 CountItems(void)` – 返回列表中的项数。

    * `BListItem * RemoveItem(int32 index)` – 并返回指定索引处的项，如果没有，则返回 `NULL`。

    * `void RemoveItem(BListItem *item)` – 从列表中移除指定的项。如果列表中没有该项，则什么都不做。

    * `int32 CurrentSelection(int32 index = -1)` – 返回当前选中项的索引，如果没有选择项则返回 -1。参数 `index`
    用于获取支持多项选择的列表中的所有选中项。通常使用 `while()` 循环来获取所有项的索引，并通常在返回 -1 时退出。

    * `void Select(int32 index, bool extend = false)` – 选中指定索引处的项。如果 `extend` 为 `false`，在选中指定项之前会取消所有其他项的选中。

    * `void Select(int32 start, int32 end, bool extend = false)` – 选中从 `start` 到 `end`
    的所有项。如果 `extend` 为 `false`，在选中指定项之前会取消所有其他项的选中。

    * `void DeselectAll(void)` – 取消列表中所有项的选中。


    # 第 19 节


    在过去的几节中，接口工具包（Interface Kit）一直是功能的主要来源，但今天我们将扩展学习范围。本节将涉及翻译包（Translation Kit）和存储包（Storage
    Kit）的一部分。


    ## 翻译包


    翻译包最初由 Be 历史中的 Jon Watte 编写，它与语言翻译无关。相反，它用于将图像和文本从一种格式转换为另一种格式。这通常等于从磁盘加载位图图像。**位图（bitmap）**是一种图像，它将其图像信息存储为像素点的集合。**矢量图像（Vector
    images）**将其信息存储为一系列绘制指令。这就是照片（位图图像）与剪贴画（clipart）之间的区别。


    翻译包使用独特的方法来加载图片：其能力通过插件（add-ons）进行定义和扩展。插件在 Haiku 的许多地方都有使用。翻译包使用独特的方法来加载图片：其能力通过插件进行定义和扩展。插件非常强大。使得插件变得如此强大的之处在于，安装一个
    `Translator` 就能支持特定的格式。


    翻译包提供了两种不同的方式供程序使用。我们应该使用哪种取决于需求。简单的方法仅用于加载位图。更复杂的方法用于我们需要同时加载和保存的情况。我们今天将使用简单的方法，稍后我们将看到其细节。


    ## 资源


    应用程序资源（Application resources）是一种将程序相关的数据封装在可执行文件中的方法。它确保程序使用的图片始终可用，且不会被覆盖。程序的图标也应该以这种方式存储。某些其他程序信息，如它处理的文件类型和启动特性，也存储在资源中。


    Haiku 有许多工具可以添加、删除和编辑程序资源。`QuickRes` 就是其中之一。


    ## 作业


    现在我们将学习如何结合资源和翻译包创建一个名为 **Emo** 的小项目。它从程序资源中加载一系列图像并每次显示一张，当用户点击它时切换图片。源代码可以在
    `19Emo.zip` 中找到。为了节省空间，下面只打印了与课程相关的代码部分。


    首先，让我们从项目的资源文件开始：`Resources.rsrc`。创建资源文件并不困难，让我们看看文件在 `QuickRes` 中打开时的布局。


    ![我们在 QuickRes 中加载的资源文件](img/file4.png)


    文件的每个图片都有条目，显示其类型、资源 ID、名称、大小和缩略图。将图片添加到资源文件只需将它们从 Tracker 拖动到 QuickRes 窗口上。删除只需几次点击，所以这里并不复杂。ID
    是任意的，但在文件中存储的每种数据类型内必须是唯一的。每个条目的名称是可选的，但强烈建议提供。你可以向资源文件添加几乎任何类型的数据并使用你自己的资源类型代码，但尽量保持它们很小，因为它们直接影响可执行文件的大小。大型资源真的应该放在单独的文件中。让我们看看代码。


    令人的是，Haiku API 并没有一个仅仅显示图片的视图，但对我们来说，制作这样一个并不费力。首先，让我们看看头文件 `PictureView.h`：


