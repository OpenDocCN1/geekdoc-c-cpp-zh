  trans: "\n\n# 开始我们的项目：HaikuFortune\n\n*   打开 `Paladin` 并使用 GUI 配合 `MainWindow` 模板创建一个新项目。\n\
    *   按下 `Alt+N` 或从项目菜单选择 `Add New File`（添加新文件），创建一个名为 `FortuneFunctions.cpp` 的文件。确保勾选了同时创建相应头文件的框。\n\
    \n我们要做的第一件事是设计一个类，用于从 `fortune` 目录获取幸运格言。\n\n```cpp\n#ifndef FORTUNEFUNCTIONS_H\n\
    #define FORTUNEFUNCTIONS_H\n\n#include <List.h>\n#include <String.h>\n\nclass\
    \ FortuneAccess\n{\npublic:\n            FortuneAccess(void);\n            FortuneAccess(const\
    \ char *folder);\n            ~FortuneAccess(void);\n\n    status_t    SetFolder(const\
    \ char *folder);\n    status_t    GetFortune(BString &target);\n    int32    \
    \   CountFiles(void) const;\n    status_t    LastFilename(BString &target);\n\n\
    private:\n\n    void        ScanFolder(void);\n    void        MakeEmpty(void);\n\
    \    BString fPath, fLastFile;\n    BList       fRefList;\n};\n\n#endif\n```\n\
    \n这个类中的每个方法都有其原因。首先，两个版本的构造函数都是为了方便创建 `FortuneAccess` 对象，无论我们在实例化对象时是否已经知道了想要扫描的文件夹。`SetFolder()`\
    \ 允许我们在需要时更改文件夹。`GetFortune()` 是我们创建这个类的主要原因：创建一个可重用的对象，它可以从指定的文件夹中随机获取一条幸运格言。`CountFiles()`\
    \ 告诉我们有多少个可用文件。`LastFilename()` 为我们提供最近一个幸运格言来源的文件名。`ScanFolder()` 遍历目录并编译一个可用文件列表，从理论上讲，这些文件中都包含幸运格言。\n\
    \n`MakeEmpty()` 是一个清理函数，值得额外解释一下。我们在 `fortune` 文件夹中设置的文件名列表被作为 `BList` 中 `entry_ref`\
    \ 对象集合的形式保留。`BList` 有两个问题：每当我们访问它所持有的对象时，都必须进行 `static_cast`；而且虽然 `BList` 在其内部处理了任何内存分配，但在释放列表时，我们给它的任何项都不会被销毁。这意味着我们必须手动遍历列表，获取每个项并自己释放它。这非常头疼，但遗憾的是，这是我们目前唯一的方法。还有更好的解决方案，但那是以后的事了。对于我们目前的目标，这足够了。\n\
    \n下面是我们的类骨架代码，以及每个函数需要执行的操作。你的工作是编写代码。\n\n```cpp\n#include \"FortuneFunctions.h\"\
    \n#include <Directory.h>\n#include <Entry.h>\n#include <File.h>\n#include <OS.h>\n\
    #include <Path.h>\n#include <stdio.h>\n#include <stdlib.h>\n#include <string.h>\n\
    \n// 以防万一，将全局路径初始化为硬编码值。\n// 这在 Haiku 中与之前的 BeOS 版本不同\nBString gFortunePath =\
    \ \"/boot/system/data/fortunes\";\n\nFortuneAccess::FortuneAccess(void)\n{\n}\n\
    \nFortuneAccess::FortuneAccess(const char *folder)\n{\n    SetFolder(folder);\n\
    }\n\nFortuneAccess::~FortuneAccess(void)\n{\n    // 释放我们列表中的所有项\n}\n\nstatus_t\n\
    FortuneAccess::SetFolder(const char *folder)\n{\n    // 确保文件夹是有效的，如果无效则返回 B_BAD_VALUE。\n\
    \    // 设置路径变量，扫描文件夹并返回 B_OK\n}\n\nstatus_t\nFortuneAccess::GetFortune(BString\
    \ &target)\n{\n    // 这里是该类的核心部分：\n    // 1) 如果 fPath 为空，返回 B_NO_INIT\n    //\
    \ 2) 如果引用列表为空，返回 B_ERROR\n    // 3) 这一行将随机选择 ref 列表中一个文件的索引。\n    int32 index\
    \ = int32(float(rand()) / RAND_MAX * fRefList.CountItems());\n    // 4) 获取指向所选\
    \ entry_ref 的指针。\n    // 5) 以只读模式创建并初始化 BFile 对象。\n    // 6) 检查 BFile 的状态是否为 B_OK。\n\
    \    // 7) 将 fLastFile 设置为我们刚刚选择的 ref 的名称属性。\n    // 8) 获取文件大小。\n    // 9) 如果文件为空，返回\
    \ B_ERROR。\n    // 10) 创建一个 BString 来存储文件中的数据。\n    // 11) 创建一个将在 BFile::Read\
    \ 中使用的 char 指。\n    // 12) 使用 BString::LockBuffer 初始化指针，传入\n    //  文件大小 + 10\
    \ 字节（安全起见）作为长度。\n    //  LockBuffer 临时让你访问 BString 的内部 char 数组。\n    //  我们需要此来将文件数据读入\
    \ BString 中。\n    // 13) 使用 BFile::Read() 使用我们的新 char 指针读取整个文件。\n    // 14) 调用\
    \ BString::UnlockBuffer() 使 char 指针失效\n    //  并允许我们再次使用 BString 方法。\n    // 15)\
    \ 使用循环手动计算文件中的分隔符数量。\n    //  分隔符是字符串 \"\\n\"，所以使用 BString::FindFirst 和偏移量计数。\n\
    \    // 16) 使用这一行随机选择一个项。\n    // 17) 再次使用 FindFirst 找到文件中随机选择项的起始偏移。\n    //\
    \ 18) 最后一次调用 FindFirst 找到下一个分隔符的偏移，\n    //  以便知道格言有多长。\n    // 19) 创建一个 BString\
    \ 来持有格言。\n    // 20) 将此新 BString 设置为文件数据的 BString 的起始偏移。\n    //  这将有效地删掉文件中格言之前的所有内容。\n\
    \    // 21) 通过调用 Truncate() 方法删掉 BString 中格言之后的所有内容。\n    //  提示：长度 = 结束偏移量 -\
    \ 起始偏移 + 2\n    // 22) 将 target 参数设置为我们的格言数据并返回\n    //  B_OK。\n}\n\nvoid\nFortuneAccess::ScanFolder(void)\n\
    {\n    // 使用此 BDirectory。确保它从 fPath 正确初始化。\n    // 清空引用列表，以便不会在现有列表上添加。\n    //\
    \ 使用 BDirectory::GetNextEntry 获取文件夹中每个文件的项。\n    // 使用 BEntry 检查项是否为文件，如果是，则创建一个新的\n\
    \    // entry_ref，将其发送给 BEntry::GetRef 并添加到我们的引用\n    // 列表中。\n}\n\nvoid\nFortuneAccess::MakeEmpty(void)\n\
    {\n    // 遍历引用列表并删除每个 entry_ref。\n    // 在此之后调用 BList::MakeEmpty()。\n}\n\nint32\n\
    FortuneAccess::CountFiles(void) const\n{\n    return fRefList.CountItems();\n\
    }\n\nstatus_t\nFortuneAccess::LastFilename(BString &target)\n{\n    // 如果路径变量为空，返回\
    \ B_NO_INIT\n    // 将 target 参数设置为我们的 fLastFile 属性并返回\n    // B_OK\n}\n\n"
- fmt: "\n## Writing and Testing Our Code\n\nBecause we’re dealing with non-GUI code,\
    \ it’s probably easiest to test all of the code with a quick-and-dirty Terminal\
    \ application. In your `main()` function in `App.cpp`, comment out all of the\
    \ code except the return value and write code to quickly make sure that everything\
    \ works correctly. Here are some development tips that should make writing it\
    \ a little easier:\n\n*   Write the destructor and `MakeEmpty()` first.\n*   Implement\
    \ `SetFolder()` next.\n*   `ScanFolder()` should be written now because `GetFortune()`\
    \ depends on it. Test code in `main()` should just call `SetFolder()` to some\
    \ path that you want to use for testing. Using `printf()` to print out what `ScanFolder()`\
    \ is doing, such as the names of each ref scanned, would be good for debugging\
    \ here.\n*   Once `ScanFolder()` has been written, start hacking on `GetFortune()`.\
    \ Once again, use `printf()` to find out what’s going going.\n*   `LastFileName()`\
    \ can be implemented whenever you feel like – it’s not important until we start\
    \ implementing the GUI.\n\nOnce your `FortuneAccess` class is complete and debugged,\
    \ you have all that you need to write a better command-line fortune program than\
    \ fortune itself!\n\n## Going Further\n\nWe haven’t even touched the GUI yet.\
    \ Think of some possible ways that we could make a simple interface to show the\
    \ fortune using graphical controls. We’ll make the GUI next time and our project\
    \ will be complete!\n\n# Lesson 22\n\nImplementing the fortune functions in the\
    \ last lesson shouldn’t have been too difficult. Rest assured that you will be\
    \ able to finish this project even if it was harder than expected. We will be\
    \ designing the graphical interface for our fortune program today.\n\n## Usability\
    \ and Interface Design\n\nOne thing that developers need to be aware of is usability,\
    \ which is quality of a program’s suitability for a task while matching the technical\
    \ level of its users. Haiku shows the roots that BeOS had in the Macintosh operating\
    \ system. Although others have made notable strides in this area, Apple products\
    \ have, for the most part, been shining examples of how to design products to\
    \ be both stylish and easy to use. BeOS inherited these qualities without explicitly\
    \ copying the Macintosh way of doing things. This also means that Haiku developers\
    \ are expected to write programs that not only avoid being unnecessarily difficult\
    \ but actually help the user do their work.\n\nUsability is its own discipline\
    \ and a good study of it would take far more than the scope of these lessons.\
    \ Nonetheless, we should examine some basics of design to avoid major gaffes in\
    \ writing our programs. A few minutes of thinking ahead can save a lot of headaches\
    \ down the road for both you and your program’s users.\n\n### Determine your program’s\
    \ main users.\n\nThe answer to this question could be developers or general Haiku\
    \ users, for example. Knowing who will be using your program will guide you in\
    \ figuring out your users needs and skills. Keep in mind that if your program\
    \ has a general audience, like our fortune program, you will want to design your\
    \ program for nontechnical users. This will enable as many people as possible\
    \ to enjoy your work. When designing for nontechnical users, it is best to keep\
    \ in mind someone you know who “doesn’t know much about computers,” such as a\
    \ grandparent, colleague, or spouse. The more effort you put into designing your\
    \ app to match the expertise of your target audience, the less support you’ll\
    \ be asked to do later on and the greater popularity it will enjoy.\n\n### Decide\
    \ the primary and secondary tasks that your program is meant to do.\n\nUnless\
    \ you’re writing a game of some kind – which is just as admirable as programs\
    \ to do \"work\" – your program will be intended to be a tool to perform one or\
    \ more tasks. The influence of a feature on the overall design of the interface\
    \ should be directly proportional to the frequency of its use. A program which\
    \ rips MP3s from CDs should make getting album information as easy as possible.\
    \ Editing the artist name, album release date, and other information which belongs\
    \ in an MP3’s tags should also be pretty simple. Features which may be used rarely,\
    \ if ever, should be carefully considered before including them in your program.\
    \ By adding features, you add complexity. This creates more code to support and\
    \ maintain and also makes using your program more difficult for less skilled users\
    \ in your target audience – people who are far too often ignored or marginalized\
    \ by developers and power users. Your users are best thought of as reasonably\
    \ intelligent, but very busy. By prioritizing the work your program will do, you\
    \ will get the most return on your investment of time and also write a higher\
    \ quality application.\n\n### Think of some of the ways that your program can\
    \ be extra helpful.\n\nIn some ways, your program should be thought of as a butler:\
    \ you tell him to go answer the door and he does a job which some consider drudgery\
    \ without taking away your being in charge. Automating mindless tasks is something\
    \ which computers do really well. Most people hate this kind of stuff. Even little\
    \ thoughtful touches here and there add up to an overall great user experience.\n\
    \n### Handle problems gracefully.\n\nFew people like to be asked pointless questions.\
    \ Fewer still like to have questions asked of them every few minutes. It’s a lot\
    \ like a four year old child who runs up to his mom – who is otherwise engaged\
    \ in conversation – and proceeds to say \"Mommy\" every three or four seconds\
    \ in an attempt to get her attention. Overusing BAlerts creates this kind of annoyance\
    \ for the user. It’s OK to ask the user questions, but do so in a way that is\
    \ not condescending and try to keep the frequency to a minimum whenever possible.\
    \ Knowing full well that Murphy’s Law certainly applies to programming, try to\
    \ think of things that could go wrong and handle them gracefully. Crashes are\
    \ not an option, nor is losing a user’s data unless there is no other way out.\n\
    \n## Designing Our GUI\n\nOur fortune program isn’t terribly important in the\
    \ grand scheme of things, but it will be something that the user sees fairly often\
    \ if it is set up to run whenever the computer is booted. This is a program for\
    \ anyone, so it should be as nontechnical as possible.\n\nWe will only do one\
    \ thing a couple of different ways, so we should be able to get away with using\
    \ buttons instead of having to create a menu. One button can be for getting another\
    \ fortune. Although there is always a close button on the window’s tab, we should\
    \ also use a regular button so the user can close the window by pressing the Enter\
    \ key. Because we want people to have a way to know its version and who wrote\
    \ this fortune program, we’ll make a button which shows an About window. This\
    \ should be easy to write.\n\n## Writing the Code\n\nThe first thing we should\
    \ do is find out where the fortunes are being kept. Under BeOS and Zeta, they\
    \ were kept in `/boot/be/etc/fortunes`. Haiku keeps them in a different place:\
    \ `/boot/system/data/fortunes`. Rather than try to guess what platform we might\
    \ be using, we’ll use `find_directory()`.\n\n```\nstatus_t find_directory(directory_which\
    \ which, BPath *path,\n                bool and_create_it = false, BVolume *vol\
    \ = NULL);\n```\n"
