  trans: "\n\n代码本身并不复杂。我们有四个公共方法：构造函数，它为 `fValue` 分配堆内存并将值初始化为零；析构函数，它释放 `fValue`\
    \ 的堆内存；以及获取和设置对象值的方法。\n\n我们的固定点类（fixed class）的设计思想是使用一个普通的整数来存储浮点值，以避免任何舍入误差。低两位数字留给小数部分，因此我们必须将任何外部数字乘以\
    \ 100，以便将其添加到我们的 `Fixed` 类中，并将我们的 `Fixed` 类的值除以 100，以转换为外部世界的正确值。到目前为止，一切似乎都运行正常。让我们稍微调整一下我们的\
    \ `main()` 函数：\n\n```cpp\nint\nmain(void)\n{\n    Fixed f1;\n    if (f1.GetValue()\
    \ == 0)\n    {\n        Fixed f2;\n        f2.SetValue(1234);\n        f1 = f2;\n\
    \    }\n    printf(\"Value: %f\\n\",f1.GetValue());\n    return 0;\n}\n```\n\n\
    如果在 Haiku 下编译并运行，一切似乎仍然没问题，但代码中有两个极其难以发现的小 Bug，它们只有在我们的程序变得更复杂时才会出现：我们的变量 `f1`\
    \ 中 `fValue` 所持有的地址被删除了两次，并且存在内存泄漏。双重删除在某些方面比内存泄漏更糟糕，因为它们可能会导致你的程序崩溃，而且崩溃的位置与问题所在的位置很少关系。更糟糕的是，修改代码可能会导致程序在没有任何明显原因的情况下在另一个地方崩溃。\n\
    \n这段代码的问题在于 `if` 块的最后一行并没有完全按照我们想要的方式执行。我们想要拷贝的是*值*，但拷贝的是*指针*。当 `f2` 在 `if` 块结束时离开作用域时，它的\
    \ `fValue` 被删除了。问题是 `f1` 的 `fValue` 指向同一个地址。哦哦，`f1.fValue` 指向一个现在已经无效的内存位置。当程序退出且\
    \ `f1` 被删除时，可能会发生任何事情。分配的内存也悬浮在虚空中，直到操作系统为我们清理这些残局，否则永远不会被删除。如果此类问题在 Ubuntu Linux\
    \ 的程序中出现，会打印错误信息，但在 Haiku 中什么都不会发生。这实际上更糟，因为我们并没有被告知存在这个问题。\n\n幸运的是，一旦理解了它，修复这个\
    \ Bug 非常简单。问题在于执行了浅拷贝（shallow copy）。浅拷贝将一个对象的属性的精确值丢到另一个对象中。只要对象的属性分配在栈上，这样做就是没问题的。堆分配的属性需要深拷贝。这只能通过实现我们自己的拷贝构造函数来实现，顺便再重载赋值运算符。\n\
    \n拷贝构造函数是每对象需要复制时被调用的函数。默认拷贝构造函数执行浅拷贝，这在很多情况下是足够的。但这里并不属于其中之一。我们将在类定义中添加这两个条目：\n\
    \n```cpp\nFixed(const Fixed &from);\nFixed &operator=(const Fixed &from);\n```\n\
    \n这两个函数的实现看起来如下：\n\n```cpp\nFixed::Fixed(const Fixed &from)\n{\n    fValue = new\
    \ int64();\n    *fValue = *from.fValue;\n}\nFixed &\nFixed::operator=(const Fixed\
    \ &from)\n{\n    *fValue = *from.fValue;\n}\n```\n\n这拷贝的是 `fValue` 中保留的地址的值，而不是地址本身，从而执行了深拷贝。宇宙又暂时恢复了正常运转。呼！\n\
    \n## 赋值\n\n让我们更进一步，真正充实这个类。它在未来的某个点可能会非常有用。以下是一些更有用的运算符重载的声明，它们将有助于将我们的新类集成到编程环境的其他部分：\n\
    \n```cpp\nFixed operator+(const Fixed &first, const Fixed &second);\nFixed operator-(const\
    \ Fixed &first, const Fixed &second);\nbool  operator<(const Fixed &first, const\
    \ Fixed &second);\nbool  operator>(const Fixed &first, const Fixed &second);\n\
    bool operator<=(const Fixed &first, const Fixed &second);\nbool operator>=(const\
    \ Fixed &first, const Fixed &second);\nbool operator!=(const Fixed &first, const\
    \ Fixed &second);\nbool operator==(const Fixed &first, const Fixed &second);\n\
    ```\n\n通过实现和测试这些普通函数来练习重载。你可能还想看看其他运算符可能会派上用场。\n\n# 第 17 课\n\n在对运算符重载和拷贝构造函数的简要插曲后，我们一直在学习如何为\
    \ Haiku 构建一个图形化应用程序。到目前为止，我们检查了启动任何 Haiku 程序的样板代码、基于事件的编程以及发送消息。今天我们将利用所学的消息知识来为程序创建一个菜单。\n\
    \n## 使用菜单\n\n在本节中，我们将学习几个类：`BMenu`、`BMenuBar`、`BMenuItem` 和 `BView`，但我们将在构建另一个相对简单的应用程序时学习它们，我们将将其命名为\
    \ `MenuColors`，它显示一个带有彩色框的窗口，我们可以通过从菜单中选择颜色来更改它。让我们设置项目。\n\n1. 在 Paladin 中创建一个新的空项目。你可以把项目命名为\
    \ `MenuColors`。\n2. 在 Project 菜单下点击 Add File。\n3. 输入文件名 `App.cpp`，勾选“Create a\
    \ header and source file”，然后点击 OK。这将创建 `App.cpp` 和 `App.h`。\n4. 对 `MainWindow`\
    \ 执行同样的操作。\n\n现在我们已经准备好了文件，让我们写一些代码。首先是 `App.h` 和 `App.cpp` 的代码。建议手动输入一切而不是复制，这样你可以熟悉它们。\n\
    \n```cpp\n// App.h\n#ifndef APP_H\n#define APP_H\n\n#include <Application.h>\n\
    \nclass App : public BApplication\n\n{\n\npublic:\n    App(void);\n};\n\n#endif\n\
    ```\n\n```cpp\n// App.cpp\n#include \"App.h\"\n#include \"MainWindow.h\"\n\nApp::App(void)\n\
    \    :   BApplication(\"application/x-vnd.test-MenuColors\")\n\n{\n    MainWindow\
    \ *mainwin = new MainWindow();\n    mainwin->Show();\n}\n\nint\nmain(void)\n{\n\
    \    App *app = new App();\n    app->Run();\n    delete app;\n    return 0;\n\
    }\n```\n\n这些文件中的代码没有任何新内容。由于我们在头文件中输入 `MainWindow` 的类定义，如果你现在尝试构建项目，会出现一些错误。不要担心——稍后我们就能让一切运行起来。这里是\
    \ `MainWindow.h` 的代码：\n\n```cpp\n// MainWindow.h\n#ifndef MAINWINDOW_H\n#define\
    \ MAINWINDOW_H\n\n#include <Window.h>\n\nclass MainWindow : public BWindow\n\n\
    {\n\npublic:\n    MainWindow(void);\n    void        MessageReceived(BMessage\
    \ *msg);\n};\n\n#endif\n```\n\n这也是熟悉的领域。所有的新代码都将在 `MainWindow.cpp` 中，但让我们从 `MainWindow`\
    \ 的样板代码开始逐部分添加。编写代码最好的方法是一点添加，编译，然后测试你写的内容，以帮助你发现 Bug。\n\n```cpp\n// MainWindow.cpp\n\
    #include \"MainWindow.h\"\n#include <MenuBar.h>\n#include <Menu.h>\n#include <MenuItem.h>\n\
    #include <View.h>\n\nMainWindow::MainWindow(void)\n    :   BWindow(BRect(100,100,500,400),\"\
    MenuColors\",B_TITLED_WINDOW,\n                B_ASYNCHRONOUS_CONTROLS | B_QUIT_ON_WINDOW_CLOSE)\n\
    \n{\n}\n\nvoid\nMainWindow::MessageReceived(BMessage *msg)\n{\n    switch (msg->what)\n\
    \    {\n        default:\n        {\n            BWindow::MessageReceived(msg);\n\
    \            break;\n        }\n    }\n}\n```\n\n"
- fmt: "\nNow that we have all of our baseline code in place, build it just to make\
    \ sure that you haven’t mistyped anything. If you get errors, double check with\
    \ the sources above and fix the typos. Once everything builds properly, run it\
    \ and assuming everything works right, close it and move on to the interesting\
    \ stuff.\n\n## Adding Views\n\nWindow controls are all objects which are descended\
    \ from the `BView` class. If you take a quick glance at `/boot/develop/headers/os/interface/View.h`,\
    \ you’ll see that it’s a large, complicated class with a lot of methods. Luckily,\
    \ we don’t need to know very many at this point. The `BView` below will be our\
    \ colored box. Add this code to the `MainWindow` constructor:\n\n```cpp\nMainWindow::MainWindow(void)\n\
    \    :   BWindow(BRect(100,100,500,400),\"MenuColors\",B_TITLED_WINDOW,\n    \
    \            B_ASYNCHRONOUS_CONTROLS | B_QUIT_ON_WINDOW_CLOSE)\n{\n    BView *view\
    \ = new BView(BRect(100,100,300,200), \"colorview\",\n                 B_FOLLOW_ALL,\
    \ B_WILL_DRAW);\n    AddChild(view);\n    view->SetViewColor(0,0,160);\n}\n```\n\
    \nThis is pretty simple code. The first line creates a new `BView` which has its\
    \ top left corner at (100,100) and its bottom right corner at (300,200). It has\
    \ the name \"colorview\" and resizes itself whenever the window is resized. The\
    \ `B_WILL_DRAW` flag at the end tells the window that it does its own drawing.\
    \ Without this flag, this `BView` will just be a blank white box. The second line\
    \ attaches the view to the window. The last one sets the color of the `BView`\
    \ to a dark blue color. Build your project and see how it all looks.\n\nAdding\
    \ controls to windows in Haiku isn’t much different. Most of them have a constructor\
    \ which requires the same kinds of information and possibly a message, but not\
    \ much else. Other controls are added to a window just the same way. Pay close\
    \ attention to the methods that we use and you will notice many similarities among\
    \ the classes.\n\n## Adding a Menu\n\nWith the exception of pop-up menus, menus\
    \ in Haiku are normally kept in a menu container of some sort. The Haiku API provides\
    \ two menu containers: `BMenuField` and `BMenuBar`. We’ll ignore `BMenuField`\
    \ for now and focus on `BMenuBar`. Change the constructor code to the following:\n\
    \n```cpp\nMainWindow::MainWindow(void)\n    :   BWindow(BRect(100,100,500,400),\"\
    MenuColors\",B_TITLED_WINDOW,\n                B_ASYNCHRONOUS_CONTROLS | B_QUIT_ON_WINDOW_CLOSE)\n\
    {\n    // This will define the height of the menu bar. Bounds() returns the\n\
    \    // size of the window. In this case, the rectangle will be\n    // (0,0)-(200,100).\n\
    \    BRect r(Bounds());\n    r.bottom = 20;\n    // The only part of r that matters\
    \ is the height. When we add items\n    // to the menu bar, it will expand to\
    \ fill the width of the window at\n    // the height we specify.\n    BMenuBar\
    \ *menuBar = new BMenuBar(r,\"menubar\");\n    AddChild(menuBar);\n    BView *view\
    \ = new BView(BRect(100,100,300,200), \"colorview\",\n                    B_FOLLOW_ALL,\
    \ B_WILL_DRAW);\n    AddChild(view);\n    view->SetViewColor(0,0,160);\n}\n```\n\
    \nNow that we have a container for our color menu, we can create the menu itself.\
    \ This will require three components: the menu, the items in the menu, and message\
    \ identifiers for each menu item. First, let’s handle the message identifiers.\
    \ Add this code just after the `#include` statements at the top of the file:\n\
    \n```cpp\nenum\n{\n    M_SET_COLOR_RED = 'sred',\n    M_SET_COLOR_GREEN = 'sgrn',\n\
    \    M_SET_COLOR_BLUE = 'sblu',\n    M_SET_COLOR_BLACK = 'sblk'\n};\n```\n\nThe\
    \ only part of this code that might look strange are the single-quoted values.\
    \ This is another one of those fancy-schmancy coder tricks. Message constants\
    \ are 32-bit integers. Each one of those letters translates into an 8-bit value,\
    \ so `'sred'` actually translates into a 32-bit integer. Truth be told, the values\
    \ themselves don’t really matter much as long as they are unique, but by convention\
    \ they are set to 4-letter constants like this.\n\nThe constants themselves can\
    \ either be placed at the top of a class' source file or in its header. You will\
    \ usually want to avoid putting the identifiers in the header so that adding a\
    \ message identifier doesn’t force a recompile of several files. The exception\
    \ to this rule of thumb would be for messages that are used by more than one class.\n\
    \nNow that the message identifiers have been defined, let’s go on to creating\
    \ and populating the menu. The code looks like this:\n\n```cpp\nMainWindow::MainWindow(void)\n\
    \    :   BWindow(BRect(100,100,500,400),\"MenuColors\",B_TITLED_WINDOW,\n    \
    \            B_ASYNCHRONOUS_CONTROLS | B_QUIT_ON_WINDOW_CLOSE)\n{\n    // This\
    \ will define the height of the menu bar. Bounds() returns the\n    // size of\
    \ the window. In this case, the rectangle will be\n    // (0,0)-(200,100).\n \
    \   BRect r(Bounds());\n    r.bottom = 20;\n    // The only part of r that matters\
    \ is the height. When we add items\n    // to the menu bar, it will expand to\
    \ fill the width of the window at\n    // the height we specify.\n    BMenuBar\
    \ *menuBar = new BMenuBar(r,\"menubar\");\n    AddChild(menuBar);\n\n    // This\
    \ is the code that creates and populates the menu.\n    BMenu *menu = new BMenu(\"\
    Colors\");\n    menu->AddItem(new BMenuItem(\"Red\", M_SET_COLOR_RED));\n    menu->AddItem(new\
    \ BMenuItem(\"Green\", M_SET_COLOR_GREEN));\n    menu->AddItem(new BMenuItem(\"\
    Blue\", M_SET_COLOR_BLUE));\n    menu->AddItem(new BMenuItem(\"Black\", M_SET_COLOR_BLACK));\n\
    \    menuBar->AddMenu(menu);\n\n    BView *view = new BView(BRect(100,100,300,200),\
    \ \"colorview\",\n                    B_FOLLOW_ALL, B_WILL_DRAW);\n    AddChild(view);\n\
    \    view->SetViewColor(0,0,160);\n}\n```\n\nWe’re almost done! If you try running\
    \ your project and clicking in the menu, you’ll find that nothing happens. Everything\
    \ works the way it should. When a menu item is clicked, it sends a message to\
    \ the window, like clicking on the 'Red' menu item sends a `M_SET_COLOR_RED` message\
    \ to the window. The window receives it, but doesn’t do anything with it, so all\
    \ that is needed is to write the code for when the window receives each of the\
    \ menu items' messages.\n\n```cpp\nvoid MainWindow::MessageReceived(BMessage *msg)\n\
    {\n    // FindView() is a BWindow method which searches for a BView by\n    //\
    \ name and returns a pointer to it.\n    BView *view = FindView(\"colorview\"\
    );\n    switch (msg->what)\n    {\n        case M_SET_COLOR_RED:\n        {\n\
    \            // When the window receives this message, we'll set the\n       \
    \     // background color to dark red\n            view->SetViewColor(160,0,0);\n\
    \            // Calling Invalidate() forces the view to redraw\n            //\
    \ itself.\n            view->Invalidate();\n            break;\n        }\n  \
    \      case M_SET_COLOR_GREEN:\n        {\n            view->SetViewColor(0,160,0);\n\
    \            view->Invalidate();\n            break;\n        }\n        case\
    \ M_SET_COLOR_BLUE:\n        {\n            view->SetViewColor(0,0,160);\n   \
    \         view->Invalidate();\n            break;\n        }\n        case M_SET_COLOR_BLACK:\n\
    \        {\n            view->SetViewColor(0,0,0);\n            view->Invalidate();\n\
    \            break;\n        }\n        default:\n        {\n            // As\
    \ always, the default is to make the BWindow\n            // version of this method\
    \ handle messages we don't care\n            // about\n            BWindow::MessageReceived(msg);\n\
    \            break;\n        }\n    }\n}\n```\n"
