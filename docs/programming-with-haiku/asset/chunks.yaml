  trans: "\n\n```cpp\n此调用接收一个常量——其列表可以在 `FindDirectory.h` 中找到——并将与之对应的位置放入 `path`\
    \ 中。每当你需要获取文件系统中的常用位置时（例如主文件夹、用户设置文件夹、常用插件文件夹等），请尽管使用此调用。如果此类文件夹的实际位置发生变化，你的程序也不会突然停止正常工作。\n\
    \n我们将创建一个全局变量来存储格言（fortunes）的路径。使用大量的全局变量不是好主意，但在本程序中使用一个并无害。将此行添加到 `FortuneFunctions.h`：\n\
    \n```cpp\nextern BString gFortunePath;\n```\n\n在 `FortuneFunctions.cpp` 的包含文件之后、类代码之前放置此内容。\n\
    \n```cpp\nBString gFortunePath = \"/boot/beos/etc/fortunes\";\n```\n\n`extern`\
    \ 关键字声明了 `gFortunePath` 但未对其进行定义。如果 `FortuneFunctions.h` 被多个文件使用，这可以防止链接器问题。我们实际上在主源文件中对其进行了定义和初始化。\n\
    \n现在我们已经对格言访问类进行了必要的调整，让我们将注意力转向 `App.cpp`。在显示格言窗口之前，我们需要进行一些额外的设置。\n\n```cpp\n\
    // App.cpp\n\n#include \"App.h\"\n#include <FindDirectory.h>\n#include <OS.h>\n\
    #include <Path.h>\n#include <stdlib.h>\n#include \"FortuneFunctions.h\"\n#include\
    \ \"MainWindow.h\"\n\nApp::App(void)\n  : BApplication(\"application/x-vnd.test-HaikuFortune\"\
    )\n{\n    BPath path;\n    // 我们必须在这里使用 #ifdef，因为 R5 和 Zeta 下的格言\n    // 文件位于\
    \ system/etc/ 目录，但在 Haiku 中，它们被\n    // 保留在 system/data 目录。我们通过使用编译器定义\n    //\
    \ 来检测平台。__HAIKU__ 在 Haiku 下被定义，\n    // 在 BeOS R5 或 Zeta 中没有。Zeta 有它自己的 __ZETA__\
    \ 定义。\n    #ifdef __HAIKU__\n    find_directory(B_SYSTEM_DATA_DIRECTORY,&path);\n\
    \    #else\n    find_directory(B_BEOS_ETC_DIRECTORY,&path);\n    #endif\n\n  \
    \  path.Append(\"fortunes\");\n    gFortunePath = path.Path();\n\n    // 如果我们让\
    \ rand() 函数实际上非常接近随机，\n    // 我们需要用时间为随机数生成器设置种子。\n    // 如果不这样做，每次运行程序时都会得到相同的“随机”数字。\n\
    \    // rand() 并不是真正的随机，但这对对我们来说已经足够了。\n    srand(system_time());\n\n    MainWindow\
    \ *win = new MainWindow();\n    win->Show();\n}\n\nint\nmain(void)\n{\n    App\
    \ *app = new App();\n    app->Run();\n    delete app;\n    return 0;\n}\n```\n\
