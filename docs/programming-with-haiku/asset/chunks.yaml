  trans: "\n\n风格上也有一些细小的变化。对良好风格的关注是 Haiku 生态系统的一个特点。特别是 Haiku 开发者，对于遵循 OpenTracker\
    \ 代码风格指南的代码非常挑剔，而且这是有道理的。风格在很大程度上取决于主观判断，但良好的代码风格也有助于调试和避免错误。糟糕的代码风格会使这一切变得非常非常困难。我们在接下来的课程中使用的风格在某些方面没有完全遵循\
    \ Haiku 官方指南，但与其保持得非常接近。\n\n## 漏洞查找 (Bug Hunt)\n\n### 查找 #1\n\n```c\n#include\
    \ <stdio.h>\n#include <string.h>\n\nchar *ReverseString(const char *string)\n\
    {\n    // 此函数重新排列字符串使其变成反过来\n    // 即：abcdef -> fedcba\n\n    if (!string)\n \
    \       return NULL;\n\n    int length = strlen(string);\n    int count = length\
