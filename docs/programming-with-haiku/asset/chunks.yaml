    There’s not really that much to this project that’s terribly different from the
    last one. By calling the `BListView`’s `SetSelectionMessage()` method, we cause
    the title to be updated any time the user clicks on an item in the list. Most
    of the time we use a `BListView` we won’t use this method. It’s much more common
    to call a related one: `SetInvocationMessage()`, which sends a message whenever
    the user double-clicks on an item. Note that `DeselectAll()` also causes a selection
    message to be sent even though there isn’t a selection, so it is necessary to
    handle the case when `CurrentSelection()` returns a negative value, signifying
    no selection.


    Hopefully you’re getting a feel for how BViews and regular controls are put together
    in-applications. Most of them require a `BRect` for the size and location, a `const
    char **` for the name of the control, and two integers for the resizing mode and
    some behavior flags. Many classes also have a label and a message that is sent
    when the control is changed or invoked, especially those derived from `BControl`.
    Once a control is created, it is attached to the `BWindow` or `BView` via `AddChild()`.
    The message sent by the control is often sent to the window to which the control
    is attached, but it can be redirected to another target, such as the parent `BView`
    or to the global `BApplication`.


    ## Classes and Methods to Remember


    ### BControl

    * `ResizeToPreferred(void)` – A derived class will resize itself to a good size
    to display its label and content.

    * `SetLabel(const char *label)` / `const char * Label(void)` – Methods to get
    and set the label for a child class.

    * `SetTarget(BHandler *handler, BLooper *looper)` – Send the invocation message
    to a different target, such as a `BView`, `BWindow`, or `BApplication`.

    * `void SetEnabled(bool enabled)` / `bool IsEnabled(void)` – Methods to get and
    set the enabled/disabled status of a control.


    ### BListView

    * `AddItem(BListItem *item)` – Add an item to the list.

    * `int32 CountItems(void)` – Returns the number of items in the list.

    * `BListItem * RemoveItem(int32 index)` – Removes and returns the item at the
    specified index or `NULL` if there isn’t one.

    * `void RemoveItem(BListItem *item)` – Removes the specified item from the list.
    If the list doesn’t have the item, it doesn’t do anything.

    * `int32 CurrentSelection(int32 index = -1)` – Returns the index of the currently
    selected item or -1 if there is no selection. The `index` argument is used to
    get all the selected items in a list which supports multiple item selections.
    A `while()` loop is generally used to get all the item indices and it normally
    exits when -1 is returned.

    * `void Select(int32 index, bool extend = false)` – Select the item at the specified
    index. If `extend` is false, all other selected items are deselected before the
    specified item is selected.

    * `void Select(int32 start, int32 end, bool extend = false)` – Selects all items
    from `start` to `end`. If `extend` is false, all other selected items are deselected
    before the specified items are selected.

    * `void DeselectAll(void)` – deselects all items in the list.


    # Lesson 19


    The Interface Kit has been our primary source of functionality in the last couple
    of lessons, but today we’ll be expanding our reach. This lesson will deal with
    the Translation Kit and part of the Storage Kit.


    ## The Translation Kit


    Originally written by Jon Watte in ancient Be history, the Translation Kit has
    nothing to do with language translation. Instead, it is used for converting images
    and text from one format to another. This usually amounts to loading bitmap images
    from disk. A **bitmap** is a kind of image which stores its picture information
    as a collection of dots. **Vector images** store their information as a series
    of drawing instructions. This is the difference between a photo, which is a bitmap
    image, and a clipart picture.


    The Translation Kit uses a unique approach to loading pictures: its capabilities
    are defined and expanded by add-ons. Add-ons are a powerful programming approach
    used in many places in Haiku. What makes them so powerful in this case is that
    installing a `Translator` for a particular image format enables every Haiku program
    which utilizes the Translation Kit to suddenly support that format. It’s a much
    better approach than can be found on any other operating system available. It
    also makes for much simpler image handling code.


    There are two different ways that the Translation Kit can be used in our programs.
    Which one we should use in a given situation depends on our needs. The easy way
    is just for loading bitmaps. The more involved way is needed for instances when
    we are both loading and saving or when we are using the Translation Kit for something
    other than bitmap images. We’ll be using the easy way today, the details of which
    we’ll be seeing shortly.


    ## Resources


    Application resources are a way to package data associated with your program inside
    the executable itself. It’s a handy way to make sure that pictures used in your
    program are always available and haven’t been overwritten by the user’s recipe
    for quiche or something. Icons for your program are resources. Pictures used in
    the GUI should be stored this way, too. Certain other program information, such
    as the file types it handles and launch characteristics, are also stored in a
    program’s resources.


    A number of tools are available for Haiku to add, delete, and edit program resources.
    `QuickRes` is the original.


    ## Assignment


    Now we will be learning how to use both resources and the Translation Kit in a
    little project called **Emo**. It loads a series of images from program resources
    and displays them one at a time, changing the picture whenever the user clicks
    on it. The sources can be found in `19Emo.zip`. For the sake of space, only the
    parts of the code that are relevant to the lesson will be printed below.


    First of all, let’s start with the resource file for the project: `Resources.rsrc`.
    Creating a resource file isn’t difficult, but let’s look at the layout of the
    file when opened in `QuickRes`.


    ![Our resource file loaded in QuickRes](media/file4.png)


    Each of the pictures has an entry in the file which shows its type, resource ID,
    name, size, and a miniature preview. Adding pictures to a resource file is just
    a matter of dragging them from Tracker and dropping them onto the QuickRes window.
    Deleting is just a couple of clicks, so nothing here is terribly complicated.
    The IDs are arbitrary, but they must be unique within each data type stored in
    the file. The name for each entry is optional, but highly recommended. You can
    add just about any kind of data you like to a resource file and use your own resource
    type codes, but try to keep them small because they have a direct impact on the
    executable’s size. Large resources should really be kept in their own separate
    file. Let’s move on to the code.


    Surprisingly, the Haiku API does not have a view which just displays a picture,
    but luckily for us, making one isn’t much work. First, let’s look at the header,
    `PictureView.h`:


