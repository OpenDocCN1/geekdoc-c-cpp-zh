  trans: "\n这段代码与我们目前为止编写的所有代码之间的真正区别在于，以对象的方式思考迫使我们来组织代码。编写整洁且组织良好的代码对于便于维护至关重要。\n\
    \n这段代码中唯一可能看起来奇怪的地方是在 `Volume()` 中需要调用 `Width()` 和 `Height()`。看起来允许子类能够访问 `fWidth`\
    \ 和 `fHeight` 似乎更合理。这正是 `protected` 访问权限的用途。不过，它的使用频率远没有你想象的那么频繁或必要。\n\n另一个需要注意的点是处理继承的那行代码——它写着\
    \ `public Rectangle`。这是继承的类型。大多数情况下，你都会使用公有继承（public inheritance）。这意味着父类方法和属性的访问权限不会改变。选择另外两种类型中的一种会限制对基类的访问。选择\
    \ `protected` 继承将使基类所有的 `public` 方法和属性变为 `protected` 而不是 `public`，使得它们对所有子类可见，但对外部关闭。私有继承（private\
    \ inheritance）则将基类的所有方法和属性都变为 `private`，使得父类对外部世界以及任何“孙类”都完全不可访问。\n\n## 虚函数 (Virtual\
    \ Functions)\n\n子类不仅可以添加新的方法和属性，还可以改变现有方法的行为。只有当基类声明允许这样做时，这才是可能的。在方法声明的返回类型之前添加\
    \ `virtual` 关键字即可赋予这种权限。\n\n```cpp\n// 子类可以重新定义此方法的行为\nvirtual void MyChangeableMethod(int\
    \ someInt);\n\n// 子类必须定义此方法\nvirtual void ThisMethodMustBeDefined(float someFloat)\
    \ = 0;\n```\n\n然而，能够改变方法的工作方式**并不**允许我们改变方法参数的数量或类型或其返回类型。在父类中找到原始版本也不会完全消失。可以使用作用域运算符来指定它，如下例所示：\n\
    \n```cpp\nvoid\nChildClass::DoSomething(void)\n{\n    printf(\"Child class did\
    \ something\\n\");\n    ParentClass::DoSomething();\n}\n```\n\n## 静态函数 (Static\
    \ Functions)\n\n你通常需要一个对象的实例来调用它的其中一个方法。这有时会很麻烦，但将方法声明为 `static` 会将方法绑定到类，从而消除这一要求。静态方法使用作用域运算符进行调用，方法与我们上面调用虚函数的父类实现的方式相同。\n\
    \n```cpp\nclass MyClass\n{\npublic:\n    MyClass(void);\n    int    DoSomething(void);\n\
    \    static int  DoSomethingStatic(void);\n};\n\nint\nmain(void)\n{\n    MyClass\
    \ myClassInstance;\n    // 调用方法的常规方式\n    myClassInstance.DoSomething();\n\n \
    \   // 这种调用不需要实例——只是调用方法的\n    // 不同的方式\n    MyClass::DoSomethingStatic();\n\n\
    \    return 0;\n}\n```\n\n## 函数重载：同名函数 (Overloading)\n\nC 语言编程中一个可能非常头疼的局限性是，任何两个函数不能有相同的名称，即使它们的参数不同。C++\
    \ 只要编译器能够根据给定的参数数量和类型判断调用的是哪个版本，就消除了这个限制。这样做是行的：\n\n```cpp\nint MyFunction(int\
    \ oneWay);\nint MyFunction(char *anotherWay);\nint MyFunction(float aThirdWay);\n\
    ```\n\n另一方面，这样做是行通的：\n\n```cpp\nint SomeMethod(const char *oneConstString);\n\
    int SomeMethod(const char *anotherString,\n           const char *optionalString\
    \ = NULL);\n```\n\n为什么这不起行？如果你漏掉了 `optionalString` 参数，编译器就不知道你指的是哪一个。\n\n## 作业\
    \ (Assignment)\n\n阅读 BeBook 中关于 `BApplication`、`BWindow` 和 `BView` 的章节。你不需要理解所有内容，但尝试对每个类有一个感觉——在下一节中，我们将为\
    \ Haiku 编写第一个*真实*程序。\n\n## 复习 (Review)\n\n1. 什么是继承？\n2. `protected` 访问和 `private`\
    \ 访问有什么区别？\n3. 什么是虚函数？\n4. 什么是静态函数？\n5. 什么是函数重载？\n6. 关于访问父类的方法，子类使用 `protected`\
    \ 继承会有什么影响？\n\n# 第 14 节\n\n如果你一直期待学习如何编写一个在屏幕上显示内容而不仅仅是在终端中打印内容的程序，那么今天就是这一天！我们将花费大部分时间来理解代码，但让我们先谈谈工具和组织。\n\
    \n## 工具工具：集成开发环境 (Integrated Development Environments)\n\n我们到目前为止的所有程序都是简单的。所谓的台程序（Console\
    \ programs）并不一定是简单的，但为了学习语言，简单是好的。编写这些简单的程序我们只需要一个文本编辑器，它们完全可以装进一个文件中。普通的应用程序可以有数百个文件。许多经验丰富的\
    \ C++ 程序员满足于文本编辑器和终端，但拥有更多工具并不是坏事，特别是对于初级程序员来说。\n\n在接下来的课程中，你会被鼓励（但不是要求）使用集成开发环境（IDE）。IDE\
    \ 将编译器、代码编辑器、调试器和其他工具结合在一起，使开发者能够工作得更高效。为了这些课程，我们将假设你使用 Haiku 的 Paladin IDE。如果你倾向于使用其他的，也可以。让我们开始吧。\n\
    \n## 我们的第一个项目 (Our First Project)\n\n运行 Paladin 你将看到启动窗口。创建一个新项目。在新窗口顶部有一个菜单，你可以选择创建的项目类型。选择\
    \ Empty（空）。虽然我们可以选择 GUI 来自动化我们将要做的操作，但编写代码的过程有助于我们更好地学习 Haiku 基础。设置你喜欢的项目名称。目标名称（Target\
    \ Name）是项目构建后的执行文件名称，通常与项目名称相同。准备好继续时，点击创建（Create Project）。\n\n截至目前，如果你使用的是基于\
    \ GCC4 的 Haiku 版本，你需要为项目添加一个库才能进行构建，但未来的 Paladin 版本将移除这一要求。\n\n1. 在项目窗口中，从 Project\
    \ 菜单选择 System Libraries。\n2.向下滚动，勾选 `libsup++.so` 旁边的框，并关闭窗口。\n3. 现在我们将为项目添加源文件。从\
    \ Project 菜单选择 Add New File。\n4. 请求文件名时，输入 `App.cpp`，勾选创建相应的头文件，并点击 OK。\n\n通常情况下，每个文件一个类，文件的基础名称与其中的类名相同。我们的第一个文件\
    \ `App.cpp` 将有一个类 `App`。`App` 类的定义将进入头文件 `App.h`。该类的所有代码将进入 `App.cpp`。如果确实有两个非常小的相关的类，可以将它们都放在同一个文件中，但为了组织方便，通用原则是一个文件一个类。\n\
