    \n```c\n#include <stdio.h>\n\nint\n(void)\n{\n    char string[30];\n\n    // 使用我们已经熟悉的方法将数组设置为小写字母表\n\
    \    // 即使用括号\n    for (int i = 0; i < 26; i++)\n    {\n        // 字符常量可以被视为整数处理。这避免了我们\n\
