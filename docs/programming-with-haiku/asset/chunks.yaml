    \  // enumValue4 的值将为 10\n    enumValue4\n};\n```\n\n## 结构 (Structures)\n\n结构是变量的组。它们可以是任何类型，虽然在单个结构中可以放置的不同项目数量有实际上的限制，但在技术上并没有限制。结构用于将紧密相关的数据组合在一起。它们的定义如下：\n\
    \n``` {.c++}\nstruct myStructName { int8someInt; int16someOtherInt; floatsomeFloat;\
    \ boolaFlagOfSomeKind;\\\n\n};\n```\n\n现在我们有了一个结构，可以像对待任何其他数据类型一样对待它。\n\n```\n\
    myStructName someVar; myStructName aSecondVar;\n```\n\n从这里开始，我们使用结构名称后跟点以及结构内部的变量名称来访问结构内部的变量。例如，假设我们要将\
    \ `someVar` 的 `someInt` 部分设置为 5。它看起来像这样：\n\n```\nsomeVar.someInt = 5;\n```\n\n\
