    \n## Typedef：用户定义类型\n\n在 C 和 C++ 中，可以使用 `typedef` 关键字创建你自己的类型。我们在上一节中配合 `fread()`\
    \ 和 `fwrite()` 使用的 `size_t` 类型就是这样创建的。一旦我们开始研究 Haiku API 的细节，我们将一直使用用户定义类型。由于\
