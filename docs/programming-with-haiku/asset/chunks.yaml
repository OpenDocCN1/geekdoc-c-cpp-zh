  trans: "\n[content]\n\n```\n我们现在已经完成了！运行你的项目，你会发现当我们点击菜单中的某一项时，我们的框会改变颜色。组合一个菜单其实并不费力。\n\
    \n## 进阶内容\n\n如果你想进一步捣鼓它，这里有一些可以尝试的想法。\n\n1. 尝试将 `BView` 构造函数中的 `B_FOLLOW_ALL`\
    \ 缩放模式标志改为其他内容。将其更改为以下之一并看看会发生什么：\n    * `B_FOLLOW_LEFT | B_FOLLOW_TOP`\n    *\
    \ `B_FOLLOW_LEFT_RIGHT | B_FOLLOW_TOP`\n    * `B_FOLLOW_RIGHT | B_FOLLOW_TOP`\n\
    \    * `B_FOLLOW_RIGHT | B_FOLLOW_BOTTOM`\n    * `B_FOLLOW_LEFT_RIGHT | B_FOLLOW_BOTTOM`\n\
    \    * `B_FOLLOW_RIGHT | B_FOLLOW_TOP_BOTTOM`\n2. 尝试为你的菜单添加更多颜色\n3. 在菜单中添加一个退出（Quit）项，向窗口发送一个\
    \ `B_QUIT_REQUESTED` 消息。\n\n## 需要记忆的类和方法\n\n### BWindow\n\n* `BWindow(BRect frame,\
    \ const char *title, window_type type, uint32 flags, uint32 workspace = B_CURRENT_WORKSPACE)`\
    \ – 创建新窗口。虽然还有其他类型，但目前需要记住的窗口类型有 `B_TITLED_WINDOW` 和 `B_DOCUMENT_WINDOW`。\n* `void\
    \ AddChild(BView *child)` – 将 `BView`（或 `BView` 子类）附加到窗口。\n* `BView * FindView(const\
    \ char *name)` – 返回指向名为 `name` 的 `BView` 的指针，如果没有找到则返回 `NULL`。\n* `BRect Bounds(void)`\
    \ – 返回客户区域的大小，即窗口框内的白色区域。\n* `void Show(void)` – 显示窗口。\n\n### BView\n\n* `BView(BRect\
    \ frame, const char *name, int32 resizeMode, int32 flags)` – 创建新视图。查看 BeBook 中的\
    \ `BView` 部分以获取所有可用的缩放模式。暂时不要担心 `flags` 参数，只需记住 `B_WILL_DRAW` 即可。\n* `void SetViewColor(uint8\
    \ red, uint8 green, uint8 blue)` – 设置视图的背景颜色。\n* `void Invalidate(void)` – 强制\
    \ `BView` 重新绘制自己。\n* `void AddChild(BView *child)` – 将 `BView`（或 `BView` 子类）附加到视图。\n\
    \n# 第 18 课\n\n处理好按钮和菜单之后，我们将开始学习更多其他可用窗口控件，例如以下控件：\n\n| 控件 | 描述 |\n| --- | ---\
    \ |\n| BAlert | 弹出消息。它们非常适合偶尔提示的错误消息，但也很容易过度使用和滥用。请节制使用。 |\n| BBox | 一种 `BView`，在其他子控件周围画一个框，以便视觉上将相关的控件分组在一起。它还可以选择性在左上角有一个文本标签。\
    \ |\n| BButton | 带有文本标签的按钮，点击时会发送消息。 |\n| BChannelSlider | 一个滑块类，用于调整通道。 |\n|\
    \ BCheckBox | 一个复选框，带有一个标签，点击时会切换状态并发送消息。 |\n| BColorControl | 颜色选择控件，用于选择颜色。\
    \ |\n| BListView | 列表控件，用于显示一系列项。 |\n| BMenu | 菜单，包含多个菜单项。 |\n| BMenuBar | 菜单栏，用于放置多个菜单。\
    \ |\n| BMenuItem | 菜单项，点击时可以触发操作。 |\n| BOption | 选项控件，允许用户从多个选项中选择。 |\n| BOutlineView\
    \ | 树形视图，用于显示分级结构。 |\n| BPicture | 图片控件，用于显示图像。 |\n| BRadioButton | 单选按钮，允许用户在一组按钮中选择一个。\
    \ |\n| BPopUp | 下拉菜单，允许从列表中选择项。 |\n| BScrollBar | 滚动条，用于滚动视图内容。 |\n| BSeparator\
    \ | 分隔线，用于视觉上分隔控件。 |\n| BSlider | 滑块控件，用于调整数值范围。 |\n| BStatusBar | 状态栏，用于显示状态信息。\
    \ |\n| BTabView | 标签页控件，用于切换不同的视图。 |\n| BTextControl | 文本输入控件，允许用户输入文本。 |\n| TextView\
    \ | 多行文本编辑控件，用于显示和编辑文本。 |\n| BView | 视图的基类，所有控件都派生于此。 |\n\n这些类真多！初看起来可能很让人头大，但稍微琢磨一下就不那么难，特别是考虑到它们有很多共同点。你可能需要把这张表格留备用。\n\
    \n## 复习类型转换\n\n在之前的第 7 课中，我们学习了类型转换，即把变量的数据解释为另一种类型。C 语言中类型转换的一个问题是它是不安全的——每当你进行转换时，它总是会成功。如果你选择了错误的类进行转换，它仍然会成功，通常会产生不可预测的结果。C\
    \ 提供了不同的转换类型。尽管 C 类型转换方法需要更多的输入，但除非你专门编写 C 代码，否则应该优先使用它们。它们如下：\n\n```\nstatic_cast<TypeToCastTo>(pointerToCast)\n\
    ```\n\n`static_cast` 用于将一种类型转换为另一种类型。它依赖编译时信息，通常用于常规转换，如指针类型转换和算术转换。只要语言支持两种类型之间的转换，它就能工作。\n\
    \n```\ndynamic_cast<TypeToCastTo>(pointerToCast)\n```\n\n除了静态转换外，动态转换将是你在处理 Haiku\
    \ 时最常用的转换类型之一。它们被用于安全地导航继承层次结构。如果没有继承关系连接“源”类型和“目标”类型，将返回 *NULL*。因此，你只能转换那些本该允许转换的指针类型。我们将在今天的项目中使用其中一个。\n\
    \n```\nconst_cast<TypeToCastTo>(pointerToCast)\n```\n\n`const_cast` 用于添加或移除指针的可变性。例如，在某些情况下，函数会接收一个非常量参数但并不会改变它。将常量指针传递给此类函数将需要常量转换。\n\
    \n```\nreinterpret_cast<TypeToCastTo>(pointerToCast)\n```\n\n[/content]\n"
- fmt: "\nA `reinterpret cast` is used only rarely. It converts a pointer from one\
    \ type to another, regardless of whether the two pointers are related or not.\
    \ Almost all of the tasks which a `reinterpret cast` can do can be done with a\
    \ `static cast`, and the remaining conversions are almost always not portable,\
    \ so this kind of cast should be used only when absolutely necessary, such as\
    \ converting between function pointer types.\n\n## Project: Using List Controls\n\
    \nThis project, called `ListTitle`, will be about using list controls, namely\
    \ the `BListView` class. One paradigm found in the Haiku API is that list-based\
    \ controls use lightweight items. `BMenu` and `BListView` actually do most of\
    \ the work and `BMenuItem` and `BListItem` are actually very simple classes. Designing\
    \ these classes this way saves memory.\n\n1. Create a new project in `Paladin`\
    \ using the \"GUI with Main Window\" template to save some typing.\n2. Our project\
    \ and target name will be `ListTitle`.\n3. Once created, open `App.cpp`, change\
    \ the MIME signature of the app to `\"application/x-vnd.test-ListTitle\"`, and\
    \ close it.\n4. Open `MainWindow.h`, add the include `ListView.h` to the top of\
    \ the header.\n5. Add a `private:` access section keyword at the bottom of the\
    \ `MainWindow` class definition.\n6. In the private section of the `MainWindow`\
    \ definition, declare the property `BListView *fListView`. We will be using `fListView`\
    \ in more than just the window constructor, so it makes sense to stash away a\
    \ pointer to it for later use.\n\nYour `App` class files and `MainWindow.h` should\
    \ look like this now:\n\n```cpp\n// App.h\n\n#ifndef APP_H\n#define APP_H\n\n\
    #include <Application.h>\n\nclass App : public BApplication\n\n{\n\npublic:\n\n\
    \    App(void);\n\n};\n\n#endif\n```\n\n```cpp\n// App.cpp\n\n#include \"App.h\"\
    \n#include \"MainWindow.h\"\n\nApp::App(void)\n    :   BApplication(\"application/x-vnd.test-ListColors\"\
    )\n\n{\n    MainWindow *mainwin = new MainWindow();\n\n    mainwin->Show();\n\
    }\n\nint\n\nmain(void)\n{\n    App *app = new App();\n\n    app->Run();\n\n  \
    \  delete app;\n\n    return 0;\n}\n```\n\n```cpp\n// MainWindow.h\n\n#ifndef\
    \ MAINWINDOW_H\n#define MAINWINDOW_H\n\n#include <Window.h>\n#include <ListView.h>\n\
    \nclass MainWindow : public BWindow\n\n{\n\npublic:\n\n            MainWindow(void);\n\
    \    void        MessageReceived(BMessage *msg);\n\nprivate:\n\n    BListView\
    \   *fListView;\n\n};\n\n#endif\n```\n\nNow let’s get down to business: setting\
    \ up the `MainWindow`’s controls and making them do something. Open up `MainWindow.cpp`\
    \ and change it to this code:\n\n```cpp\n// MainWindow.cpp\n\n#include \"MainWindow.h\"\
    \n#include <Button.h>\n#include <ListItem.h>\n#include <ScrollView.h>\n\nenum\n\
    \n{\n    M_RESET_WINDOW = 'rswn',\n    M_SET_TITLE = 'sttl'\n};\n\nMainWindow::MainWindow(void)\n\
    \    :   BWindow(BRect(100,100,500,400),\"The Weird World of Sports\",       \
    \              \n                                B_TITLED_WINDOW, B_ASYNCHRONOUS_CONTROLS\
    \ |\n                                B_QUIT_ON_WINDOW_CLOSE)\n{\n    // Here we\
    \ will make a BView that covers the white area inside the\n    // window so we\
    \ can choose a background color. You'll want to do\n    // this in the windows\
    \ of your projects -- your projects will look\n    // more professional.\n   \
    \ BRect r(Bounds());\n    BView *top = new BView(r,\"topview\",B_FOLLOW_ALL,B_WILL_DRAW);\n\
    \    AddChild(top);\n\n    // ui_color() returns a system color, such as the window\
    \ tab color,\n    // menu text color, and so forth. The Panel Background color\
    \ is the\n    // one used for background views like this one.\n    top->SetViewColor(ui_color(B_PANEL_BACKGROUND_COLOR));\n\
    \n    // Create a button and place it at the bottom right corner of the\n    //\
    \ window. The BRect that we use for the BButton's frame is empty\n    // because\
    \ we're going to have it resize itself and then move it to\n    // the corner\
    \ based on the actual size of the button, so it's\n    // pointless to specify\
    \ a size or location.\n    BButton *reset = new BButton(BRect(),\"resetbutton\"\
    ,\"Reset\",\n                        new BMessage(M_RESET_WINDOW),\n         \
    \               B_FOLLOW_RIGHT | B_FOLLOW_BOTTOM);\n    top->AddChild(reset);\n\
    \    reset->ResizeToPreferred();\n\n    // Place the button in the bottom right\
    \ corner of the window with\n    // 10 pixels of padding between the button and\
    \ the window edge. 10\n    // pixels is kind of a de-facto standard for control\
    \ padding. It's\n    // enough that controls don't look crowded without taking\
    \ up tons\n    // of space.\n    reset->MoveTo(Bounds().right - reset->Bounds().Width()\
    \ - 10.0,\n            Bounds().bottom - reset->Bounds().Height() - 10.0);\n \
    \   r = Bounds();\n    r.InsetBy(10.0,10.0);\n\n    // When working with BScrollViews,\
    \ you must compensate for the\n    // width/height of the scrollbars when determining\
    \ the size of the\n    // control that we will attach to the BScrollView.\n  \
    \  // B_V_SCROLL_BAR_WIDTH is a defined constant for the width of the\n    //\
    \ vertical scroll bar.\n    r.right -= B_V_SCROLL_BAR_WIDTH;\n\n    // Frame()\
    \ works like Bounds() except that it returns the size and\n    // location of\
    \ the control in the coordinate space of the parent\n    // view. This will make\
    \ fListView's bottom stop 10 pixels above the\n    // button.\n    r.bottom =\
    \ reset->Frame().top - 10.0 - B_H_SCROLL_BAR_HEIGHT;\n\n    // Most of these parameters\
    \ are exactly the same as for BView\n    // except that we can also specify whether\
    \ the user is able to\n    // select just 1 item in the list or multiple items\
    \ by clicking on\n    // items while holding a modifier key on the keyboard.\n\
    \    fListView = new BListView(r,\"colorlist\",B_SINGLE_SELECTION_LIST,\n    \
    \                B_FOLLOW_ALL);\n\n    // We didn't call AddChild() on fListView\
    \ because our BScrollView\n    // will do that for us. When created, it creates\
    \ scrollbars and\n    // targets the specified view for any scrolling. If we call\
    \ AddChild()\n    // on fListView before we create this view, a BView can have\
    \ one parent.\n    BScrollView *scrollView = new BScrollView(\"scrollview\",fListView,\n\
    \                            B_FOLLOW_ALL,0,true);\n    top->AddChild(scrollView);\n\
    \n    // A BListView's selection message is sent to the window any time\n    //\
    \ that the list's selection changes.\n    fListView->SetSelectionMessage(new BMessage(M_SET_TITLE));\n\
    \    fListView->AddItem(new BStringItem(\"Toe Wrestling\"));\n    fListView->AddItem(new\
    \ BStringItem(\"Electric Toilet Racing\"));\n    fListView->AddItem(new BStringItem(\"\
    Bog Snorkeling\"));\n    fListView->AddItem(new BStringItem(\"Chess Boxing\"));\n\
    \    fListView->AddItem(new BStringItem(\"Cheese Rolling\"));\n    fListView->AddItem(new\
    \ BStringItem(\"Unicycle Polo\"));\n}\n\nvoid\n\nMainWindow::MessageReceived(BMessage\
    \ *msg)\n{\n    switch (msg->what)\n    {\n        case M_RESET_WINDOW:\n    \
    \    {\n            fListView->DeselectAll();\n            break;\n        }\n\
    \        case M_SET_TITLE:\n        {\n            int32 selection = fListView->CurrentSelection();\n\
    \            if (selection < 0)\n            {\n                // This code is\
    \ here because when we press the\n                // Reset button, the selection\
    \ changes and an\n                // M_SET_TITLE message is sent, but because\n\
    \                // nothing is selected, CurrentSelection()\n                //\
    \ returns -1.\n                SetTitle(\"The Weird World of Sports\");\n    \
    \            break;\n            }\n            BStringItem *item = dynamic_cast<BStringItem*>(\n\
    \                            fListView->ItemAt(selection));\n            if (item)\n\
    \                SetTitle(item->Text());\n            break;\n        }\n    \
    \    default:\n        {\n            BWindow::MessageReceived(msg);\n       \
    \     break;\n        }\n    }\n}\n```\n"
