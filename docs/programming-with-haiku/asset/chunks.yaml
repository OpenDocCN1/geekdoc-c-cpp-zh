    \ 的定义注释以获取详细\n        // 解释。\n        printf(\"%s%c \",sValueNameList[deck[i].value\
    \ - 2],\n                sSuitCharList[deck[i].suit]);\n    }\n    printf(\"\\\
    n\");\n}\n\nint main(void)\n{\n    // rand() 只提供某种并不真正的随机数。我们用当前\n    // 时间为种子，或初始化随机数生成器，\n\
    \    // 这样它才能提供足够的随机性使其变得实用。\n    // 我们以后还会对 time() 做更多操作，\n    // 现在先忽略它。\n \
    \   srand(time(NULL));\n    // 我们的牌组\n    card deck[54];\n    // 初始化我们的牌组\n  \
