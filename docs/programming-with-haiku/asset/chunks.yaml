    ```\n\n不过，访问结构内部的变量时有所不同——我们使用箭头（->）而不是点（.）。箭头只是一个减号后跟一个大于号。\n\n```\nptrStruct→someInt\
    \ = 5;\n```\n\n最后，结构可以嵌套在结构内部。访问它们内部的变量只需根据情况将点或箭头链起来。\n\n## 联合体 (Unions)\n\n\
    联合体是 C 语言早期内存昂贵时代留下的的一种数据结构。现在除了在旧代码中，它们已经非常罕见了。它们的声明方式与结构相似，但占用的内存只等于内部最大变量的大小。访问成员和结构一样。联合体和结构之间的主要区别是，设置联合体内部一个变量的值会改变联合体内部所有变量的值。每个变量都是解释联合体所占内存位置值的不同方式。是的，这有点让人困惑。不用太担心。\n\
