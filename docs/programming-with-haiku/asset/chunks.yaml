  trans: "\n\n```c\n#include <stdio.h>\n\nfloat SimpleInterest(float principal, float\
    \ rate, int months)\n{\n    return principal * rate * months;\n}\n\nint main(void)\n\
    {\n    // Our $20000 principal\n    float p = 20000.00;\n    // 5% interest is\
    \ .05\n    float r = .05;\n    int m = 24;\n    float interest = SimpleInterest(p,\
    \ r, m);\n    printf(\"The interest on %f at %f%% interest for %d months is $%f\\\
    n\",\n        p, r * 100, m, interest);\n}\n```\n\n### 找错\n\n1. 变量 `c` 未定义。在 b\
    \ 的定义之后添加一行 `int c = 5;` 这样就可以正常编译（并运行）了。\n2. 忘记包含 `math.h`。在示例的顶部添加 `#include\
