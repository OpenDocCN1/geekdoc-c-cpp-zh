    \ statements – everything in between a pair of double quotes is a string.\n\n\
    Strings in C and C++ are very different from other data types. A string is an\
    \ array of `char` values whose last character is a 0. `char` variables can be\
    \ initialized with either an integer from 0 to 255 or with a character constant\
    \ – a character enclosed by single quotes – 'a' or 'b'.\n\nIn addition to regular\
    \ letters, there are also some special characters. These special characters all\
    \ start with a backslash and for the purposes of memory requirements take up one\
    \ byte even thought they take more than one character to type them. Note that\
    \ these only work with a backslash – a slash which \"leans\" to the left – and\
    \ not a forward slash.\n\n| Character | Character Code |\n| --- | --- |\n| Backspace\
    \ | `\\b` |\n| Carriage Return | `\\r` |\n| Form feed | `\\f` |\n| NULL (string\
    \ terminator) | `\\0` |\n| Newline | `\\n` |\n| Tab | `\\t` |\n| Backslash | `\\\
    \\` |\n| Single quote (') | `\\'` |\n| Double quote (\") | `\\\"` |\n\nThe first\
    \ four are not commonly used in Haiku or UNIX/Linux programming. The carriage\
