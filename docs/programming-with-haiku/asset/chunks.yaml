- fmt: "\n```cpp\n// PictureView.h\n\n#ifndef PICTUREVIEW_H\n#define PICTUREVIEW_H\n\
    \n#include <Message.h>\n#include <Bitmap.h>\n#include <String.h>\n#include <View.h>\n\
    \nclass PictureView : public BView\n{\npublic:\n    PictureView(void);\n    ~PictureView(void);\n\
    \    void Draw(BRect rect);\n    void MouseUp(BPoint pt);\n\nprivate:\n    BBitmap\
    \ *fBitmaps[5];\n    int8 fBitmapIndex;\n};\n\n#endif\n```\n\nThis doesn’t appear\
    \ to be anything particularly special. It’s not. The class has an array of five\
    \ `BBitmap` pointers and an index which we’ll use to point to the current one.\
    \ It gets only a little more complicated in the main sources for `PictureView`:\n\
    \n```cpp\n// PictureView.cpp\n\n#include \"PictureView.h\"\n#include <TranslationUtils.h>\n\
    #include <TranslatorFormats.h>\n\n// This class is our own special control. It\
    \ loads five images from the\n// application's resources and places them in an\
    \ array. Once loaded, it\n// resizes itself to exactly fit the first bitmap. This\
    \ assumption is OK\n// since they are all the same size and any problems are most\
    \ likely to\n// be our fault. Most people don't edit program resources and if\
    \ they do,\n// let them reap the consequences of their actions. >:D\nPictureView::PictureView(void)\n\
    \ :  BView(BRect(0,0,100,100), \"picview\", B_FOLLOW_LEFT | B_FOLLOW_TOP,\n  \
    \      B_WILL_DRAW),\n    fBitmapIndex(0)\n{\n    // Load up all our pictures\
    \ using a loop. There are 5 different\n    // versions of BTranslationUtils::GetBitmap()\
    \ . This is one of two\n    // which load images from program resources.\n   \
    \ for (int8 i = 1; i <= 5; i++)\n    {\n        BBitmap *smiley = BTranslationUtils::GetBitmap(B_PNG_FORMAT,\
    \ i);\n        fBitmaps[i - 1] = (smiley && smiley->IsValid()) ?\n           \
    \         smiley : NULL;\n    }\n    if (fBitmaps[0] && fBitmaps[0]->IsValid())\n\
    \        ResizeTo(fBitmaps[0]->Bounds().Width(),\n               fBitmaps[0]->Bounds().Height());\n\
    }\n\nPictureView::~PictureView(void)\n{\n}\n\n// The BView's Draw() function is\
    \ called whenever it is asked to draw\n// itself on the screen. This is one of\
    \ the few places where a BView's\n// drawing commands can be called.\nvoid\nPictureView::Draw(BRect\
    \ rect)\n{\n    // Alpha transparency is ignored in the default drawing mode for\n\
    \    // performance reasons, so we will change the drawing mode to\n    // utilize\
    \ transparency information.\n    SetDrawingMode(B_OP_ALPHA);\n    // Set the foreground\
    \ color of the BView to white\n    SetHighColor(255,255,255);\n    // Fill the\
    \ BView's area with white. Like with most BView drawing\n    // commands, the\
    \ last argument is the color to use which defaults\n    // to the high color.\
    \ Other color choices are B_SOLID_LOW, which\n    // uses the background color,\
    \ and B_MIXED_COLORS, which mixes the\n    // high and low colors.\n    FillRect(Bounds());\n\
    \    // Draw the current bitmap on the screen\n    if (fBitmaps[fBitmapIndex])\n\
    \        DrawBitmap(fBitmaps[fBitmapIndex]);\n    // Set the foreground color\
    \ to black\n    SetHighColor(0,0,0);\n    // Draw a black border around the view\n\
    \    StrokeRect(Bounds());\n}\n\n// Mouse handling is kinda funny. BView has three\
    \ hook functions for the\n// mouse: MouseDown(), which is called whenever the\
    \ user presses a mouse\n// button while the pointer is over the view, MouseUp,\
    \ which is called\n// whenever the user releases a mouse button while the pointer\
    \ is over\n// the view, and MouseMoved(), which is called whenever the mouse changes\n\
    // position while over the view. This gives you, the developer, a great\n// deal\
    \ of control over how your view reacts to any kind of mouse event.\nvoid\nPictureView::MouseUp(BPoint\
    \ pt)\n{\n    // Go to the next image in the array or loop around to the\n   \
    \ // beginning if at the end.\n    if (fBitmapIndex == sizeof(*fBitmaps))\n  \
    \      fBitmapIndex = 0;\n    else\n        fBitmapIndex++;\n    // Force a redraw\
    \ of the entire view because we've changed pictures\n    Invalidate();\n}\n```\n"
