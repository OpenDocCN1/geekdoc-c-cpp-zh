    ### 复习


    1. 面向对象编程是一种通过对象交互来完成任务的手段的编程范式。

    2. `class` 是一个 C++ 对象定义，由名称、继承以及方法和属性列表组成。

    3. 方法（Method）是属于 `class` 的函数。

    4. 属性（Property）是属于 `class` 的数据变量。

    5. `class` 的构造函数用于初始化其属性并为堆分配的属性分配内存。析构函数用于在对象释放前释放指针并执行任何清理工作。

    6. `new` 和 `delete` 是 `malloc()` 和 `free()` 的 C++ 对应物。

    7. 如果使用 `malloc()` 分配对象，构造函数永远不会被调用。如果使用 `free()` 释放对象，析构函数永远不会被调用。

    8. 公方法可以在对象外部调用。私有方法只能由类的其他方法调用。

    9. 使用 `new` 分配的数组通过对数组调用 `delete` 来正确释放。

    10. 数据抽象是指使用方法隐藏属性以防止公共访问的做法。


