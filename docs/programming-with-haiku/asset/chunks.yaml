    ## 第 7 课


    ### 找 Bug


    1. 指针 `combinedString` 没有指向有效的内存地址。它需要要么通过 `malloc()` 分配堆内存（稍后释放），要么在栈上声明为数组。

    2. `main()` 中 `binaryString` 数组的尺寸太小了。它至少需要足够容纳字节中每个位一个字符，加上 1 个 `NULL` 终止符，因此
    `binaryString` 必须至少是 9 个字符，而不是 6 个。


    ### 复习


    1. 堆更大。

    2. 内存泄漏是指从堆上分配内存但没有释放。

    3. 可移植性是指在尽可能少修改（最好完全不修改）的情况下，在多个操作系统上编译代码的能力。

    4. 类型转换（Typecasting）是你告诉编译器将一种类型视为另一种类型。

    5. `malloc` 只是从堆上分配内存。`calloc` 分配内存并将其填充为 0。

    6. `7 & 0` 的结果是 `0`。

    7. `7 | 8` 的结果是 `15`。

    8. `33` 在二进制中看起来像 `100001` 吗？

    9. 二进制数字 `1000010` 在普通十进制表示中是 `66` 吗？

    10. `1 << 5` 的结果是 `32`。


