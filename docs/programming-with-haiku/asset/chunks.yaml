  trans: "\n1. 创建一个 `char` 数组来存储用户的信息。\n2. 调用 `gets()` 获取用户信息并将其存储到我们的数组中。\n3. 创建一个\
    \ `int` 变量并将其设置为字符串的长度。\n4. 使用 `for` 循环打印字符串中的每个字符，同时以字符形式和其数值形式打印。\n\n```c\n\
    #include <stdio.h>\n#include <string.h>\n\nint main(void)\n{\n    char inString[1024];\n\
    \n    printf(\"Type the text to convert and press Enter: \");\n    gets(inString);\n\
    \n    // 这里该你上用场了。\n    // 使用上面的步骤确定这里应该写什么。\n    // 步骤 1 和 2 已经为你做好了。\n\n   \
    \ return 0;\n}\n```\n\n让你的项目除了打印普通的十进制（base10）外，还将字符代码打印为十六进制（base6）和/或八进制（base8）。更多信息请参阅第\
    \ 3 。\n\n仔细查看之前字符串章节代码示例，以获取如何执行第 4 步的提示。此外，再次查看第 3  中 `printf()` 中使用的占位符列表。\n\
    \n每当编译器构建此项目时，它都会抱怨 `gets()` 是危险的且不应该使用。你认为这是为什么？\n\n## 漏洞查找 (Bug Hunt)\n\n###\
    \ 漏洞查找 #1\n\n```c\n#include <stdio.h>\n\nint main(void)\n{\n    int number = 0;\n\
    \n    for (int i = 1; i < 10; i)\n    {\n        number += i;\n        printf(\"\
    At step %d, the number is now %d\\n\", i, number);\n    }\n}\n```\n\n代码可以正常编译，但它不会停止在屏幕上打印内容，停止它的唯一方法是按下\
    \ Ctrl+C 或关闭终端窗口。\n\n### 漏洞查找 #2\n\n```c\n#include <stdio.h>\n\nint main(void)\n\
    {\n    int a;\n    int b, c;\n\n    a = 1;\n    b = 2;\n    c = 3;\n\n    printf(\"\
    a is %d, b is %d, and c is %d.\\n\", a, b);\n\n    return a + b + c;\n}\n```\n\
    \nfoo.cpp: In function ‘int main()’: foo.cpp:12: warning: too few arguments for\
    \ format\n\n## 课程回顾\n\n1. 什么是段错误 (segmentation fault)？\n2. 拥有 10 个元素的数组最后一个有效索引是什么？\n\
    3. 为什么将指针初始化为已知良好值或 `NULL`很重要？\n4. 下面哪个是字符串，`'a’` 还是 `\"a\"`？\n5. 字符串是什么类型的数组？\n\
    6. 我们使用的哪个头文件（`#include`）包含了处理字符串的辅助函数？\n\n# 第 6 课\n\n这次我们主要将扩展已经熟悉的内容。在第 4 课中，我们学习了如何使用\
    \ `if` 语句在满足特定条件时执行代码段，还学会了如何使用 `for` 循环重复一组指令。让我们在工具箱中再添加几个工具。\n\n## 更多循环\n\n\
    虽然它们可能是最常见的，但循环的种类不止 `for` 循环。事实上，还有两种密切相关的循环：`while` 循环和 `do-while` 循环。\n\n`while`\
    \ 循环更简单，只有一个循环条件，在循环条件为假之前，循环中的代码会一直重复。让我们看看如何使用 `while` 循环完成第 5 课的项目。\n\n```c\n\
    #include <stdio.h>\n\nint main(void)\n{\n    char inString[1024];\n\n    printf(\"\
    Type some text and hit Enter:\\n\");\n    gets(inString);\n\n    int i = 0;\n\
    \    while (inString[i])\n        printf(\"String[%d]: %c\\n\", i, inString[i++]);\n\
    \n    return 0;\n}\n```\n\n在上面的示例中，我们甚至使用了捷径方法，因此不需要大括号——后自增运算符在打印消息后增加了索引变量 `i`。循环条件检查\
    \ `inString[i]` 是否为有效字符。整数可以用于逻辑判断，即真/假测试。0 被视为假，其他所有值都视为真，因此这个循环将一直重复，直到索引指向终止字符串的\
    \ 0 为止。很巧妙对吧？\n\n除了 `while` 语句和随附的条件块外，循环的其余部分方式与 `for` 循环完全相同，因此我们可以很容易地将 `printf()`\
    \ 语句替换为一对大括号内的指令组。使用这种循环有一个注意事项：如果你不小心确保循环条件最终变为假，就很容易陷入死循环。在这种情况下，如果 `inString[i++]`\
    \ 只是 `inString[i]`，我们就会面临一个死循环。\n\n`do-while` 循环不像其他循环那样常用，但偶尔也会派上用场。它先执行一次循环指令，然后检查是否需要再次执行。以下是使用\
    \ `do-while` 循环相同的示例。\n\n```c\n#include <stdio.h>\n\nint main(void)\n{\n    char\
    \ inString[1024];\n\n    printf(\"Type some text and hit Enter:\\n\");\n    gets(inString);\n\
    \n    int i = 0;\n    do\n    {\n        printf(\"String[%d]: %c\\n\", i, inString[i++]);\n\
    \    } while (inString[i]);\n\n    return 0;\n}\n```\n"
- fmt: "\nThe value we are evaluating is placed in the parentheses for the `switch`\
    \ statement. Each value that we want to handle is taken care of by `case` blocks.\
    \ These `case` blocks define the set of instructions to execute when the value\
    \ we are evaluating matches the value specified for the `case`. The format for\
    \ `case` blocks is the following:\n\n```\ncase valueForCase:\n{\n    // block\
    \ of instructions\n}\n```\n\n`break` statements are very important here because\
    \ they jump out of the `switch` statement after handling the particular `case`.\
    \ Without one at the end of a `case`, execution would \"fall through\" and continue\
    \ into the next case. This is almost always not what we want. Using our above\
    \ example, leaving out the `break` at the end of the `case` for spaces would cause\
    \ it to be printed twice: once for the space `case` and once for the `default`\
    \ case, looking something like this:\n\n```\nString[5]: <space>\nString[5]:\n\
    ```\n\nThe `default` case is a catch-all for all values which don’t fit one of\
    \ the specified cases.\n\n## Conditional assignment\n\nWe’ve seen some of the\
    \ ways that C and C++ offer the programmer shortcuts to do certain common tasks,\
    \ such as adding 1 to a variable. Another such shortcut is the only operator which\
    \ has three sections. Here’s one way to assign a value to a variable based on\
    \ a condition.\n\n```\nint number;\n\nif (someOtherNumber > 5)\n    number = 1;\n\
    else\n    number = 10;\n```\n\nHere’s another, much shorter, way to do it.\n\n\
    ```\nint number = (someOtherNumber > 5) ? 1 : 10;\n```\n\nRight now, you might\
    \ be thinking, *\"Hold on there, cowboy! What’s this here nonsense?\"* and needing\
    \ to lay off the `Bonanza`marathons. Then again, maybe not. The conditional operator\
    \ has two parts, the question mark and the colon. The format for how it works\
    \ is as follows:\n\n```\ncondition ? valueIfConditionIsTrue : valueIfConditionIsFalse\n\
    ```\n\nParentheses aren’t required around the condition, but some people (like\
    \ me) prefer to have them even if unnecessary to set the condition apart from\
    \ the rest. If the condition is true, then the value between the question mark\
    \ and the colon is returned, otherwise the value after the colon is returned.\
    \ Its use can be limited, but it does come in handy now and then.\n\n## Bug Hunt\n\
    \n### Hunt #1\n\n```\n#include <stdio.h>\n#include <string.h>\n\nchar *ReverseString(char\
    \ *string)\n{\n    // This function rearranges a string so that it is backwards\n\
    \    // i.e. abcdef -> fedcba\n\n    if (!string)\n        return NULL;\n\n  \
    \  int length = strlen(string);\n    int count = length / 2;\n\n    for (int i\
    \ = 0; i < count; i++) {\n        char temp = string[length - i];\n\n        string[length\
    \ - i] = string[i];\n        string[i] = temp;\n    }\n\n    return string;\n\
    }\n\nint main(void)\n{\n    char inString[1024];\n\n    printf(\"Type a string\
    \ to reverse:\");\n    gets(inString);\n\n    printf(\"The reversed string is\
    \ %s\\n\", ReverseString(inString));\n\n    return 0;\n}\n```\n\nThe program compiles\
    \ just fine, but nothing is printed.\n\nNormally no help is given for Bug Hunt\
    \ sections, but this is harder than many. The bug itself is somewhere in `ReverseString()`.\
    \ Try using `printf()` calls to print values in certain places to give yourself\
    \ more information on what the program is doing, like printing the length, the\
    \ count, etc.\n\n## Review\n\n1. What are the three types of loops?\n2. When is\
    \ a `switch` statement better suited to making a decision than an `if` statement?\n\
    3. What happens when the `default` case in a `switch` statement is not the last\
    \ case in the list?\n4. Rewrite the following code to use the conditional assignment\
    \ operator to set the value of `myVariable`.\n\n```\nif (myInt > 5)\n    myVariable\
    \ = 50;\nelse\n    myVariable = 100;\n```\n\n# Lesson 7\n\nSome of the most fun\
    \ times when learning to program are those instances where a neat idea hits you\
    \ and, after some playing around, you manage to write a program of your own which\
    \ does something you want and you think \"Holy smoke! Check this out! I just made\
    \ the computer *<insert cool achievement here>*!\" This lesson is probably not\
    \ going to inspire any of those moments, but, like eating your vegetables, it’s\
    \ good for you. Make sure you understand this lesson well before moving on.\n\n\
    ## Memory: The Heap and The Stack\n\nYou are probably aware that every variable\
    \ takes up some of the computer’s working memory. If weren’t aware before, you\
    \ certainly are now. What you may not know is that each program executed by the\
    \ operating system has two different pools of memory from which variables are\
    \ created: the heap and the stack.\n\nThe `stack` is a fast pool of memory of\
    \ limited size. When the operating system loads your code into memory before it\
    \ is run, a section of main memory is set aside for your program’s stack memory.\
    \ Without getting too deep into the details, let’s just say that while it is fast,\
    \ it is also limited and if your program runs out of stack space, it will crash.\
    \ Using the stack for lots of large arrays is a Bad Idea^(TM). All variables we\
    \ have used so far were allocated from stack memory.\n\nThe `heap` is the main\
    \ part of the computer’s memory. It takes a little longer to get some memory from\
    \ it, but you don’t have to worry about running out unless you decide to allocate,\
    \ obscene amounts of it. A drawback to using heap memory is that you have to take\
    \ care of making sure it is returned to the system when your program quits. Not\
    \ doing so will result in a memory leak.\n\nUp to now I’ve mentioned C and C in\
    \ tandem. Everything we've learned so far is exactly the same for both. While\
    \ both methods require pointers – we're dealing with memory addresses – memory\
    \ management is one instance where they are quite different. We'll look at the\
    \ C++-specific concepts much later.\n\nThe C way of allocating memory is using\
    \ `malloc()` to get a pointer to some memory for us to use and then calling `free()`\
    \ on the pointer to return that memory to the system. It’s also possible to use\
    \ `realloc()` to change the size of a chunk originally given to us by `malloc()`.\
    \ Using these functions properly will take some explanation, so let’s have a look\
    \ at their declarations and handle the details one function at a time.\n\n```\n\
    void * malloc(size_t size);\nvoid free(void *pointer);\nvoid * realloc(void *pointer,\
    \ size_t newSize);\n```\n\nBefore we even think about what each of these does,\
    \ it’s obvious that there are some types we haven’t seen before. The first new\
    \ type is `size_t`, but it’s not really all that new. Instead, it’s a new name\
    \ for one of the integer types that we already know. This kind of trick is often\
    \ done for portability – writing code so that it can be easily written on one\
    \ operating system and compiled on another.\n\nThe other new type we see above\
    \ is the `void` pointer. `void` pointers don’t have a type of their own, which\
    \ might sound kind of useless when you consider that we can’t use the `*** operator\
    \ on them. That’s OK, though. Their usefulness comes from being able to pass around\
    \ pointers of any type, and when we finally need to get their values, we can convert\
    \ them to another type by typecasting them.\n\nTypecasting, or just casting for\
    \ short, is telling the compiler to treat one type as another. The values held\
    \ in memory don’t change, but how they are interpreted does. This will become\
    \ especially useful later when we start examining some of the features C++ has\
    \ over C.\n"
  raw: "The value we are evaluating is placed in the parentheses for the *switch*\
    \ statement. Each value that we want to handle is taken care of by *case* blocks.\
    \ These *case* blocks define the set of instructions to execute when the value\
    \ we are evaluating matches the value specified for the *case*. The format for\
    \ *case* blocks is the following:\n\n```\ncase valueForCase:\n{\n    // block\
    \ of instructions\n}\n```\n\n*break* statements are very important here because\
    \ they jump out of the *switch* statement after handling the particular *case*.\
    \ Without one at the end of a *case*, execution would \"fall through\" and continue\
    \ into the next case. This is almost always not what we want. Using our above\
    \ example, leaving out the *break* at the end of the *case* for spaces would cause\
    \ it to be printed twice: once for the space *case* and once for the *default*\
    \ case, looking something like this:\n\n```\nString[5]: <space>\nString[5]:\n\
    ```\n\nThe *default* case is a catch-all for all values which don’t fit one of\
    \ the specified cases.\n\n## Conditional assignment\n\nWe’ve seen some of the\
    \ ways that C and C++ offer the programmer shortcuts to do certain common tasks,\
    \ such as adding 1 to a variable. Another such shortcut is the only operator which\
    \ has three sections. Here’s one way to assign a value to a variable based on\
    \ a condition.\n\n```\nint number;\n\nif (someOtherNumber > 5)\n    number = 1;\n\
    else\n    number = 10;\n```\n\nHere’s another, much shorter, way to do it.\n\n\
    ```\nint number = (someOtherNumber > 5) ? 1 : 10;\n```\n\nRight now, you might\
    \ be thinking, *\"Hold on there, cowboy! What’s this here nonsense?\"* and needing\
    \ to lay off the *Bonanza*marathons. Then again, maybe not. The conditional operator\
    \ has two parts, the question mark and the colon. The format for how it works\
    \ is as follows:\n\n```\ncondition ? valueIfConditionIsTrue : valueIfConditionIsFalse\n\
    ```\n\nParentheses aren’t required around the condition, but some people (like\
    \ me) prefer to have them even if unnecessary to set the condition apart from\
    \ the rest. If the condition is true, then the value between the question mark\
    \ and the colon is returned, otherwise the value after the colon is returned.\
    \ Its use can be limited, but it does come in handy now and then.\n\n## Bug Hunt\n\
    \n### Hunt #1\n\n```\n#include <stdio.h>\n#include <string.h>\n\nchar *ReverseString(char\
    \ *string)\n{\n    // This function rearranges a string so that it is backwards\n\
    \    // i.e. abcdef -> fedcba\n\n    if (!string)\n        return NULL;\n\n  \
    \  int length = strlen(string);\n    int count = length / 2;\n\n    for (int i\
    \ = 0; i < count; i++) {\n        char temp = string[length - i];\n\n        string[length\
    \ - i] = string[i];\n        string[i] = temp;\n    }\n\n    return string;\n\
    }\n\nint main(void)\n{\n    char inString[1024];\n\n    printf(\"Type a string\
    \ to reverse:\");\n    gets(inString);\n\n    printf(\"The reversed string is\
    \ %s\\n\", ReverseString(inString));\n\n    return 0;\n}\n```\n\nThe program compiles\
    \ just fine, but nothing is printed.\n\nNormally no help is given for Bug Hunt\
    \ sections, but this is harder than many. The bug itself is somewhere in *ReverseString()*.\
    \ Try using *printf()* calls to print values in certain places to give yourself\
    \ more information on what the program is doing, like printing the length, the\
    \ count, etc.\n\n## Review\n\n1.  What are the three types of loops?\n\n2.  When\
    \ is a switch statement better suited to making a decision than an if statement?\n\
    \n3.  What happens when the default case in a switch statement is not the last\
    \ case in the list?\n\n4.  Rewrite the following code to use the conditional assignment\
    \ operator to set the value of myVariable.\n\n```\nif (myInt > 5)\n    myVariable\
    \ = 50;\nelse\n    myVariable = 100;\n```\n\n# Lesson 7\n\nSome of the most fun\
    \ times when learning to program are those instances where a neat idea hits you\
    \ and, after some playing around, you manage to write a program of your own which\
    \ does something you want and you think \"Holy smoke! Check this out! I just made\
    \ the computer *<insert cool achievement here>*!\" This lesson is probably not\
    \ going to inspire any of those moments, but, like eating your vegetables, it’s\
    \ good for you. Make sure you understand this lesson well before moving on.\n\n\
    ## Memory: The Heap and The Stack\n\nYou are probably aware that every variable\
    \ takes up some of the computer’s working memory. If weren’t aware before, you\
    \ certainly are now. What you may not know is that each program executed by the\
    \ operating system has two different pools of memory from which variables are\
    \ created: the heap and the stack.\n\nThe **stack** is a fast pool of memory of\
    \ limited size. When the operating system loads your code into memory before it\
    \ is run, a section of main memory is set aside for your program’s stack memory.\
    \ Without getting too deep into the details, let’s just say that while it is fast,\
    \ it is also limited and if your program runs out of stack space, it will crash.\
    \ Using the stack for lots of large arrays is a Bad Idea^(TM). All variables we\
    \ have used so far were allocated from stack memory.\n\nThe **heap** is the main\
    \ part of the computer’s system memory. It takes a little longer to get some memory\
    \ from it, but you don’t have to worry about running out unless you decide to\
    \ allocate, well, *obscene* amounts of it. A drawback to using heap memory is\
    \ that you have to take care of making sure that all memory you have received\
    \ from the system is given back when you’re done with it. Not doing so will result\
    \ in a **memory leak**, which occurs when heap memory is not freed after being\
    \ allocated. This causes your program to gradually take up more and more system\
    \ memory until it is finally returned to the system when your program quits, gracefully\
    \ or otherwise.\n\nUp to now I’ve mentioned C and C in tandem. Everything we've\
    \ learned so far is exactly the same for both languages. While both methods require\
    \ pointers – we're dealing with memory addresses here – memory management is one\
    \ instance where they are quite different. We'll look at the C way of doing things\
    \ when we get to the C++-specific concepts much later on.\n\nThe C way of allocating\
    \ memory is using *malloc()* to get a pointer to some memory for us to use and\
    \ then calling *free()* on the pointer to return that block of memory to the system.\
    \ It’s also possible to use *realloc()* to change the size of a chunk of RAM originally\
    \ given to us by *malloc()*. Using these functions properly will take some explanation,\
    \ so let’s have a look at their declarations and handle the details one function\
    \ at a time.\n\n```\nvoid * malloc(size_t size);\nvoid free(void *pointer);\n\
    void * realloc(void *pointer, size_t newSize);\n```\n\nBefore we even think about\
    \ what each of these does, it’s obvious that there are some types we haven’t seen\
    \ before. The first new type is *size_t*, but it’s not really all that new. Instead,\
    \ it’s a new name for one of the integer types that we already know. This kind\
    \ of trick is often done for **portability** – writing code so that it can be\
    \ easily written on one operating system and compiled on another. Treat it just\
    \ like an *int* and everything will be fine.\n\nThe other new type we see above\
    \ is the *void* pointer. *void* pointers don’t have a type of their own, which\
    \ might sound kind of useless when you consider that we can’t use the *** operator\
    \ on them to get their value. That’s OK, though. Their usefulness comes from being\
    \ able to pass around pointers of any type, and when we finally need to get their\
    \ values, we can convert them to another type by typecasting them.\n\n**Typecasting**,\
    \ or just casting for short, is telling the compiler to treat one type as another.\
    \ The values held in memory don’t change, but how they are interpreted does. This\
    \ will become especially useful later on when we start examining some of the features\
    \ C++ has over C."
