  trans: "\n\n## 复习\n\n1. 什么是枚举类型？\n2. 在枚举类型中为一个或多个元素指定值有什么好处？\n3. 如何访问结构体（struct）内部的变量？\n\
    4. 点运算符（.）和箭头运算符（->）的区别是什么？\n\n# 第 12 课\n\nC 是编写大多数 Haiku 程序时使用的语言。它是 Dennis Ritchie\
    \ 在 20 世纪 70 年代贝尔实验室编写的 C 语言的扩展。我们一直在学习的语言基础在这两种语言中是通用的，但从现在开始，我们将学习 C 语言无法实现的部分。正是这些部分使其变得强大，但要真正很好地掌握它们，我们必须改变编写代码的视角。\n\
    \n## 面向对象\n\n我们一直在编写的程序属于一种被称为“过程化编程”的范式，这种开发方式以单个函数调用为中心。这对于许多目的都是足够的，但为 Haiku\
    \ 图形用户界面 (GUI) 编程超出了这一点，进入了另一种被称为“面向对象编程”的范式。\n\n面向对象编程的核心思想是应用程序由对象的交互来完成任务。每个对象都是一个“黑盒”，具有某些属性和交互方式，同时隐藏了其内部的工作原理。我们对对象的唯一了解就是如何与之交互。现实生活中的例子是电视机：按下按钮可以切换频道、调整屏幕菜单中的设置、调节音量以及开启或关闭。我们还知道它的尺寸、颜色和大致重量，除非你是电视维修员，否则你可能不知道它是如何工作的，也无法访问它的内部组件。\n\
    \nC++ 对象非常像电视机。它有被称为 `methods`（方法）的函数，提供了与之交互的手段。它还有用于存储数据的变量，被称为 `properties`（属性）。并不是对象的所有方法和属性都一定能被外部访问。\n\
    \n## 类\n\nC++ 中的对象定义被称为 `classes`（类）。类的定义代码形式与我们在上一节课中学的数据结构非常相似。这里是一个关于我们电视机的类定义示例。\n\
    \n```cpp\nclass Television\n{\npublic: // 这些函数任何人都可以访问。如果没有\n\n        // 'public'\
    \ 关键字，所有这些都将是严格\n\n        // 内部方法——默认访问模式是私有的（private）。\n\n            // 这是构造函数。稍后会对此详细介绍。\n\
    \n            Television(void);\n\n            // 这是析构函数。稍后也会对此详细介绍。\n\n     \
    \       ~Television(void);\n\n    view        SetChannel(uint16 channel);\n\n\
    \    uint16  GetChannel(void);\n\n    void        SetVolume(uint8 volume);\n\n\
    \    uint8       GetVolume(void);\n\n    void        TogglePower(void);\n\n  \
    \  bool        IsTurnedOn(void);\n\nprivate:    // 此词以下的所有内容都无法被\n\n        //\
    \ 外部访问\n\n    int8        DetectActiveInput(void);\n\n    void        ConnectToSignal(void);\n\
    \n    uint16  fChannel;\n\n    uint8       fVolume;\n\n    bool        fPowerState;\n\
    \n};\n```\n\n这段代码与 `struct` 定义有着惊人的相似。方法比属性多得多，还有两个奇怪的词：`public` 和 `private`。与电视操作密切相关的位（如\
    \ `ConnectToSignal()`）位于类定义中的 `private` 部分，只能由 `Television` 类其他方法调用。\n\n有六个方法专门用于设置和获取电视机属性的值，这似乎有点奇怪。直接让\
    \ `fChannel`、`fVolume` 和 `fPowerState` 成为公开的不是更简单、工作更少吗？是的，但那会让处理这些对象的代码变得杂乱。我们的对象应该在绝对必要时才暴露其内部工作机制。这使得在不干扰与外部交互的情况下更改其内部运行方式成为可能。例如，如果我们决定将\
    \ `fPowerState` 重命名为 `fIsTurnedOn`，那么代码中几个地方就需要更改变量名。所有这些地方都位于包含类方法的文件的文件。然而，如果我们把\
    \ `fPowerState` 设为公开属性，我们就必须修改整个项目中对它的每一个引用。如果你的项目很大，这工作量将会大得多。使用方法隐藏属性被称为 `data\
    \ abstraction`（数据抽象），这是 C++ 中常用的术语。\n\n调用对象的方法需要你对该对象有访问权限。我们之前用于获取结构体变量的点运算符和箭头运算符，也用于类来访问类的方法和属性。\n\
    \n```cpp\nint\nmain(void)\n{\n    Television tv;\n\n    // 看一台关闭的电视没什么好玩的\n\n\
    \    if (!tv.IsTurnedOn())\n        tv.TogglePower();\n\n    // 看 8 频道的新闻 :)\n\
    \n    tv.SetChannel(8);\n\n    return 0;\n}\n```\n\n类定义中的其他奇葩是函数 `Television()`\
    \ 和 `~Television()`。它们没有返回类型——甚至连 `void` 没有！这是因为它们是特殊方法。`Television` 被称为类的**构造函数**（constructor），每当我们创建一个\
    \ `Television` 对象时，就会调用该方法。`~Television()` 是类的**析构函数**（destructor），每当我们销毁一个 `Television`\
    \ 对象时，就会调用。它们是可选的，但几乎每个类都有构造函数，许多类都有析构函数。它们在分配和释放对象时也起着关键作用。说到这里，让我们看看 C++ 使用内存的方式。我们很快就会需要。\n\
    \n## C++ 内存分配：new 和 delete\n\n为了创建一个 `Television` 对象，我们不调用 `malloc()`。事实上，除非你在写\
    \ C 语言，否则几乎不会使用它。相反，我们将使用 `new` 和 `delete`，它们是 `malloc()` 和 `free()` 的 C++ 对应方案。最好通过这个代码示例来看看它们的用法。\n\
    \n```cpp\nint\nmain(void)\n{\n    // 创建一个指针来存放电视和一个对象\n    // 使用 new 分配一个 Television\
    \ 对象内存\n    // 然后调用它的构造函数。\n\n    Television *tv = new Television();\n\n    //\
    \ 像之前一样，开启后效果更好\n\n    if (!tv->IsTurnedOn())\n        tv->TogglePower();\n\n\
    \    // 8 频道的频道都很糟糕。也许在看《飞鱼和妙奇》？\n\n    tv->SetChannel(172);\n\n    // 释放我们的电视。在内存释放之前，类的\n\
    \    // 方法会被调用。\n\n    delete tv;\n\n    return 0;\n}\n```\n\n使用 `new` 和 `delete`\
    \ 在堆上分配内存简单得多。事实上，对于对象来说，它们是必须。其他方法会导致对象的构造函数和/或析构函数从未执行，导致各种混乱。`new` 和 `delete`\
    \ 也可以用于对象数组，正如代码示例所示。\n\n```cpp\nint\nmain(void)\n{\n    // 创建一个电视数组。我想我们要开一家\n\
    \    // 家电店了，从 100 台设备开始。我们需要一些\n    // 零售空间 ;-)\n\n    Television *tvArray =\
    \ new Television[100];\n\n    // 像之前一样，开启后效果更好，但我们\n    // 只开启其中一台，看看它们是否都是那样的\
    \ ;-)\n\n    if (!tvArray[0].IsTurnedOn())\n        tvArray[0].TogglePower();\n\
    \n    // 只要我们听不到，什么什么频道都无所谓。\n\n    tvArray[0].SetVolume(0);\n\n    // 释放我们的电视。当我们从\
    \ new 接收到\n    // 数组时，需要括号。漏掉括号会导致\n    // 内存泄漏，因为那时只有一个对象会被释放，\n    // 而不是所有的对象。\n\
    \n    delete [] tvArray;\n\n    return 0;\n}\n```\n\n"
- fmt: "\n# Construction and Destruction\n\nThe two special functions that we have\
    \ seen in the definition for our `Television` class are part of the C++ language\
    \ itself. The main job of a constructor function is to do whatever is necessary\
    \ to initialize the object. When we allocate a `struct`, its variables contain\
    \ random data. It’s the same way with objects, but the constructor does the initialization\
    \ for us.\n\nA class has a default constructor if one is not declared in the class\
    \ definition. The default constructor for an object takes no parameters and does\
    \ nothing. Our `Television` class defines the default constructor, but this is\
    \ not a requirement for a class. Doing so, however, replaces the one provided\
    \ and does something. The constructor for a class can also take parameters, such\
    \ as either of these possibilities or something else:\n\n```\nTelevision(const\
    \ char *name);\n\nTelevision(bool isHD);\n```\n\nThe destructor for a class always\
    \ looks the same: a tilde (`~`), the name of the class, and taking no parameters.\
    \ It is provided if a destructor is not declared in a class definition. Like the\
    \ default constructor, it doesn’t do anything. The main job for a destructor is\
    \ to clean up before the object is actually freed. Most of the time, this means\
    \ freeing heap memory that was allocated somewhere in the object’s methods.\n\n\
    # Assignment\n\nPractice thinking about object-oriented programming by writing\
    \ down what a sample class definition for the following objects might look like,\
    \ including both methods and properties:\n\n* Alarm clock\n* Car\n* Stove\n* Washing\
    \ machine\n\n# Review\n\n1. What is object-oriented programming (OOP)?\n2. What\
    \ is a class?\n3. What is a method?\n4. What is a property?\n5. What is a class’\
    \ constructor for? Its destructor?\n6. What are the C++ counterparts to C’s `malloc()`\
    \ and `free()`?\n7. Why shouldn’t `malloc()` and `free()` be used to allocate\
    \ and free class objects?\n8. What is the difference between a method with public\
    \ access and one with private access?\n9. How are arrays allocated with `new`\
    \ properly freed?\n10. What is data abstraction?\n\n# Lesson 13\n\nIn the last\
    \ lesson, we learned about a programming paradigm that focuses on the design,\
    \ construction, and interaction of objects to perform one or more tasks. We also\
    \ examined how the objects in C++ are called classes, what their parts are, and\
    \ some other fundamentals, but to be a proficient Haiku developer, we must learn\
    \ more.\n\n## Inheritance\n\nMuch of the code a Haiku developer writes relates\
    \ to `inheritance`, which is creating a class that uses another as its base. For\
    \ example, let’s say we have a `Rectangle` class that has height, width, and provides\
    \ a couple of functions for area and perimeter. It would be easy to create a `RectangularSolid`\
    \ class which just added a third dimension and a function for volume.\n\nIf the\
    \ `RectangularSolid` class' third dimension is its only difference from a regular\
    \ `Rectangle`, it seems like a lot of needless work to write code to calculate\
    \ area and perimeter for both classes.. It would be great if we could just write\
    \ code for only the parts that are different. Inheritance makes this possible:\
    \ the `RectangularSolid` class is called a child class or a subclass of the `Rectangle`\
    \ class. Just as a child inherits genes from his parents, a subclass inherits\
    \ methods and properties from its parent class, and our `RectangularSolid` class\
    \ inherits all of the `Rectangle`’s properties and methods.\n\n| | Rectangle |\
    \ RectangleSolid |\n| --- | --- | --- |\n| Properties | HeightWidth | Height (inherited)Width\
    \ (inherited)Depth |\n| Methods | AreaPerimeter | Area (inherited)Perimeter (inherited)Volume\
    \ |\n\nInheritance allows us to reuse code that we’ve already written. Code reuse\
    \ is foundational to C++ programming. Once again, work smarter, not harder.\n\n\
    To turn this example into code, we will write two class definitions, one for each\
    \ class.\n\n```\nclass Rectangle\n{\npublic:\n            Rectangle(int width,\
    \ int height);\n    void        SetWidth(int width);\n    int     Width(void);\n\
    \    void        SetHeight(int height);\n    int     Height(void);\n    int  \
    \       Area(void);\n    int         Perimeter(void);\n\nprivate:\n    int   \
    \  fHeight;\n    int     fWidth;\n};\n\n// This line is what makes RectangularSolid\
    \ a subclass of Rectangle\nclass RectangularSolid : public Rectangle\n{\npublic:\n\
    \            RectangularSolid(int width, int height, int depth);\n    // We don't\
    \ list the methods inherited from Rectangle -- only the\n    // ones which are\
    \ new in the child class\n    void        SetDepth(int depth);\n    int     Depth(void);\n\
    \    int     Volume(void);\n\nprivate:\n    int     fDepth;\n};\n```\n\nThe `RectangularSolid`\
    \ class only declares methods and properties that are new. Writing the code that\
    \ goes with these classes requires more than what the class definitions would\
    \ make you think. This is our first code working with classes, so study this code\
    \ and the comments carefully.\n\n```\n// Rectangle's constructor. This will set\
    \ the object's properties to what\n// were passed to it. When writing the code\
    \ for a class' methods, the\n// class name plus two colons must precede the method's\
    \ name.\nRectangle::Rectangle(int width, int height)\n  : fWidth(width),\n   \
    \ fHeight(height)\n{\n    // The above lines initialize the object's properties\n\
    \    // to the specified values (width for fWidth, height for fHeight)\n    //\
    \ when the object is created. This is preferable to an\n    // explicit assignment\
    \ in the body of the constructor.\n}\n\nvoid\nRectangle::SetWidth(int width)\n\
    {\n    fWidth = width;\n}\n\nint\nRectangle::Width(void)\n{\n    return fWidth;\n\
    }\n\nvoid\nRectangle::SetHeight(int height)\n{\n    fHeight = height;\n}\n\nint\n\
    Rectangle::Height(void)\n{\n    return fHeight;\n}\n\nint\nRectangle::Area(void)\n\
    {\n    return fWidth * fHeight;\n}\n\nint\nRectangle::Perimeter(void)\n{\n   \
    \ return (2 * fWidth) + (2 * fHeight);\n}\n\n// This is the RectangularSolid constructor.\
    \ In creating the\n// RectangularSolid, it first creates a Rectangle object using\
    \ the\n// Rectangle's constructor function. We pass width and height to it\n//\
    \ and then use depth to initialize fDepth\nRectangularSolid::RectangularSolid(int\
    \ width, int height, int depth)\n    :   Rectangle(width, height),\n        fDepth(depth)\n\
    {\n}\n\nvoid\nRectangularSolid::SetDepth(int depth)\n{\n    fDepth = depth;\n\
    }\n\nint\nRectangularSolid::Depth(void)\n{\n    return fDepth;\n}\n\nint\nRectangularSolid::Volume(void)\n\
    {\n    // We have to call Width() instead of using fWidth and Height()\n    //\
    \ instead of fHeight because even child classes can't access an\n    // object's\
    \ private methods and properties.\n    return Width() * Height() * fDepth;\n}\n\
    ```\n"
