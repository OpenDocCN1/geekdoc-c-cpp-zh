    \n# Lesson 10\n\nBack when we first took a look at pointers, I mentioned that\
    \ they are a powerful tool. Today we’ll see how they can be used with functions\
    \ and learn some different ways of passing variables to functions.\n\n## Default\
    \ Values for Parameters\n\nWhen calling functions, sometimes there are certain\
    \ parameters that almost never change. Let’s say that in a program we’re writing\
    \ we have a function to create a window on the screen that looks like this:\n\n\
    ```\nvoid MakeWindow(int left, int top, int right, int bottom,\n    const char\
    \ *title, int type, int look);\n```\n\nEach time we use this function, we end\
    \ up having different values for the location, size, and title, but the type and\
    \ the look don’t change – almost all of the time the same numbers for *type* and\
    \ *look* are used because we’re making regular windows. This makes for extra typing,\
    \ so we may want to use a default value for the type. To do this, we change the\
    \ declaration slightly:\n\n```\nvoid MakeWindow(int left, int top, int right,\
    \ int bottom,\n    const char *title, int type = REGULAR_WINDOW_TYPE,\n    int\
    \ look = REGULAR_WINDOW_LOOK);\n```\n\nWe are, in a sense, initializing the parameter\
    \ so that we don’t always have to type in a value when we call the function. Parameters\
    \ with default values always go at the end of a parameter list in a function call.\
    \ In this particular case, a lot less typing is involved for the usual case of\
    \ a “regular” kind of window:\n\n```\nMakeWindow(100,100,500,400,MyWindow”,REGULAR_WINDOW_TYPE,\
    \ REGULAR_WINDOW_LOOK);\n```\n\nbecomes\n\n```\nMakeWindow(100,100,500,400, MyWindow”);\n\
    ```\n\nWe won’t see too many instances of default parameter values until we start\
    \ writing programs that use Haiku’s graphical toolkit, but it’s good to know about\
    \ these beforehand.\n\n## References\n\nReferences, in this case, are not something\
    \ you would find in the library. Instead, they are a hybrid of a pointer and a\
    \ regular variable. They are treated like a regular variable in terms of not having\
    \ to use the an asterisk to get its value, but they don’t have their own memory\
    \ for storing data. Instead, they use another variable’s space. Here is an example\
    \ of a reference declaration:\n\n```\nint myInt;\nint &myRef = myInt;\n```\n\n\
    The ampersand (*&*) in between *int* and *myRef* is the difference between declaring\
    \ a regular variable and a reference. In this example, *myRef* is a reference\
    \ to *myInt*. *myRef* is, for all practical purposes, just another name for *myInt*.\
    \ Changing one will change the value of the other. This works with pointers that\
    \ have a valid memory location, too. Observe:\n\n```\n#include <stdio.h>\n#include\
    \ <malloc.h>\n\nint main(void)\n{\n    // Create a pointer with some heap memory\
    \ and initialize it\n    int *myPointer = (int*) malloc(sizeof(int));\n    *myPointer\
    \ = 1;\n\n    // Create a reference to the myPointer's location.\n    int &myRef\
    \ = *myPointer;\n    myRef++;\n\n    printf(\"The value at myPointer's location\
    \ is %d**\\n**\",*myPointer);\n\n    free(myPointer);\n\n    return 0;\n}\n```"
