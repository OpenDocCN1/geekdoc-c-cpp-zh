    \ to force the compiler to treat the `12`’s as floating point numbers and not\
    \ integers. Whenever we do math with integers, the compiler will drop any fractional\
    \ results, so, for example, `10 / 4` would equal `2`, but `10.0 / 4.0` would return\
    \ `2.5`. We want to avoid rounding errors in this case, so we use `12.0` and not\
    \ `12`.\n\nWe could have done the whole thing in one go, but it would’ve been\
    \ harder to read and a real head-scratcher to debug. It would look like this:\n\
