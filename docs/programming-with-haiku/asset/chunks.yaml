  trans: "\n对于这个项目，我们需要使用两个新函数：`fread` 和 `fwrite`。\n\n```\nsize_t fread (void *buffer,\
    \ size_t size, size_t count, FILE *stream); size_t fwrite (void *buffer, size_t\
    \ size, size_t count, FILE *stream);\n```\n\n`fread` 从文件流中读取数据。该函数会尝试读取 `size\
    \ * count` 字节并将数据放入 `buffer` 中。这非常实用，因为你可以为 `buffer` 分配任何类型的数组，对该类型使用 `sizeof()`\
    \ 函数获取 `size`，并将数组中的元素个数作为 `count` 传递。`fread` 返回实际读取的元素个数。如果返回的值与请求的值不符，说明发生了错误或者到达了文件末尾。\n\
    \n`fwrite` 的工作方式与 `fread` 相同，但方向相反。`buffer` 中的数据被写入 `stream`，并返回写入的元素个数。\n\n从概念上来说，这将涉及到我们在第\
    \ 8 节中学到的结合命令行参数使用文件操作，外加上 `fread` 和 `fwrite`。使用 `for` 循环对每个参数执行以下步骤：\n\n* 尝试将参数作为只读文件打开。\n\
    * 如果打开失败，则跳到下一次迭代。\n* 如果打开成功，尝试从文件中读取块数据，并将读取的字节数存储在变量中。\n* 使用 `while` 循环从文件中读取数据段，只要读取的字节数大于\
    \ 0 就重复此操作。\n    * 将读取的字节数写入 `stdout`。\n    * 尝试从文件句柄读取更多数据，并存储读取的字节数。\n    *\
    \ 关闭文件句柄。\n\n使用 `ferror` 打印文件错误可能是一个不错的细节。你存储文件数据的内存块可以来自栈（stack），也可以来自堆（heap）。\n\
    \n由于我们还没有进行太多实际的代码编写，我将写一点来帮助你开始。你只需要将每个注释替换为相应的代码。一次写一点并重新编译可能是一个好主意。增量编写代码并测试有助于保持\
    \ 较小且易于定位。\n\n```\n#include <stdio.h>\n#include <malloc.h>\n\nint main(int argc,\
    \ char **argv) { for (int i = 1; i < argc; i++) { // 为 argv[i] 打开用于读取的文件句柄\n\n\
    \    // 如果文件句柄为 NULL 或发生错误，继续执行\n    // 下一次迭代。\n\n    // 创建一个数据缓冲区 -- 用于存储我们数据的数组。大小\n\
    \    // 并不重要，但它至少应该是几百字节，\n    // 且不超过约 4000 字节。你可以在栈上创建它\n    // 或者使用 malloc，取决于你的喜好。\n\
    \n    // 创建一个变量来存储实际读取的字节数\n\n    // 从文件句柄读取数据，并将读取的字节数\n    // 存储到我们刚刚创建的变量中。\n\
    \n    // 开始我们的 while() 循环。当读取的字节数大于\n    // 0 且 ferror 未指示文件句柄出现错误，则继续循环\n   \
    \ {\n        // 将读取的字节数写入 stdout\n        // 读取更多数据并将实际读取的字节数\n        // 放入我们上面创建的变量中。\n\
    \    }\n\n    // 如果使用了 malloc，请在这里释放缓冲区；如果将\n    // 缓冲区放在栈上，则没关系。\n\n      //\
    \ 在这里关闭文件句柄\n    }\n\n      return 0;\n    }\n```\n\n## 复习\n\n1. 函数参数的默认值允许你做什么？\n\
    2. 引用相比指针有什么优势优势？\n3. 如何声明引用？\n4. 按值传递参数和按引用传递参数的区别是什么？\n5. 下面选项中哪一个声明了函数指针：\n\
    \    1. `void (*myFunction)(int someInteger);`\n    2. `void *myFunction(int someInteger);`\n\
    \    3. `(void *)myFunction(int someInteger);`\n\n# 第 11 节\n\n这一节标志着我所谓的 C 编程“辅助轮”阶段的结束。一旦我们完成了这里，我们将进入让\
