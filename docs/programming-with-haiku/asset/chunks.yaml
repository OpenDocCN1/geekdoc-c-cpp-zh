  trans: "\n\n![](img/cover.png)\n\n# 免责声明\n\n原标题：使用 Haiku 学习编程\n\n**版权 © 2010 由 Jon\
    \ Yoder 所有\n\n## 权利声明\n保留所有权利。未经出版者书面许可，不得以任何形式或通过任何手段（电子、机械、复印、录制或其他）复制或传播本书的任何部分。\n\
    \n## 责任声明\n我们已尽力使本书尽可能完整和准确，但不隐含任何保证或适用性。所提供的信息按“原样”提供。作者和 Lulu.com 对于因书中包含的信息引起的任何损失或损害对任何个人或实体不承担任何责任或义务。\n\
    \n## 商标\nHaiku 和 Haiku 标志是 Haiku, Inc. 的商标。Be、BeOS 以及 Be 和 BeOS 标志是美国和其他国家 Be\
    \ Incorporated 的注册商标。书中提到的所有其他产品和公司名称可能是其各自所有者的商标。书中的术语不应被视为影响任何商标或服务的有效性。\n\n\
    ## 许可协议\n本作品根据知识共享署名-非商业性-相同共享 4.0 国际许可协议许可。\n\n要查看此许可协议的副本，请访问 http://creativecommons.org/licenses/by-nc-sa/4.0/\
    \ 或邮寄至 Creative Commons, PO Box 1866, Mountain View, CA 94042, USA。\n\n![](img/file0.png)\n\
    \nISBN: 978-0-557-53969-7\n\n# 第 1 \n编程涉及将你的想法传给计算机。唯一的问题是计算机是愚笨的。它们完全按照你告诉它们的话去做，而不是你想表达的意思，除非你想表达的内容正是你告诉它们的内容。如果你还没有完全理解这一点——相信我——你很快就会明白。\n\
    \n与计算机通信的问题在于它不通任何人类语言。它知道的只是在给定特定数值指令时做什么。对于人类来说，做到这一点非常困难，因此我们用一种人类和计算机都能理解的语言来编写。翻译可以在程序运行时直接完成（称为解释型语言），或者在之前完成（如编译型语言所示）。`C`\
    \ 和 `C` 是编译型语言，因此在编写 `C` 程序时，你编写的是人类语言（`源代码`），编译器将其转换为计算机指令（`机器码`）。\n\n在 `C++`\
    \ 中，所有的计算机指令都被分组在被称为“函数”的块中。这是一个示例：\n\n```\nvoid myFunction(void)\n{\n\n}\n```\n\
    \n函数可能需要或不需要数据来完成工作，并且在完成后可能返回或不返回结果。这个名为 `myFunction` 的函数不需要数据也不返回结果。它什么也不做，但没关系。以下是定义函数的格式：\n\
    \n```\n<outdata> <functionname>(indata)\n{\n    <执行该函数的指令>\n}\n```\n\n输入数据始终在一对括号内，函数的所有指令将放在一对大括号内。为了以后参考，所有的圆括号和大括号必须成对出现。\n\
    \n无论如何，编译器并不在乎这些内容之间留了多少空间，所以有足够的空间让你的代码变得像你喜欢的那样可读或不可读。我们可以像这样把所有内容挤在一起：\n\n\
    ```\nvoid myFunction(void){}\n```\n\n但结果仍然相同。因为空白字符（是这样称的）并不重要，`C++` 中的每条指令（不要与函数混淆）后面都跟着一个分号。\n\
    \n就价值而言，我们将使用一种与 Haiku 开发人员使用的风格非常相似的代码写法，并进行一些微调。例如，放置在一对括号之间的代码始终使用 tab 键缩进一级。\n\
    \n这是我们第一个真正执行某些操作的函数：\n\n```\nint TwoPlusTwo(void)\n{\n    return 2 + 2;\n}\n\
    ```\n\n这个名为 `TwoPlusTwo` 的函数不需要输入数据，但会返回一个结果。这个函数的结果始终是一个整数——任何不带小数点的数字。虽然对人类来说数字就是数字，但\
    \ `C++` 对于跟踪传递的数据类型非常严谨。\n\n每个程序都有一个需要定义的函数：`main`。可以通过几种不同的方式定义（即告诉计算机 `main()`\
    \ 函数要做什么），但我们将使用最简单的一种：\n\n```\nint main(void)\n{\n    return 1;\n}\n```\n\n这个程序在编译和运行时不会打印任何内容，但它结束时会向操作系统返回一个\
    \ 1。\n\n让我们实际制作这个程序。将上面的代码保存为名为 `ReturnOne.cpp` 的源代码文件。打开终端并导航到该文件所在的文件夹，然后输入：\n\
    \n```\ngcc -o ReturnOne ReturnOne.cpp\n```\n\n这告诉 `gcc`（GNU 编译器集合）你将创建一个名为 `ReturnOne`\
    \ 的程序，并将使用 `ReturnOne.cpp` 来制作它。\n\n函数也可以调用其他函数，但前提是计算机知道这些函数。这在编译时会产生错误：\n\n\
    ```\nint main(void)\n{\n    PushTheRedButton();\n    return 1;\n}\n```\n\n将此保存为\
    \ `RedButton.cpp` 并使用此命令编译：\n\n```\ngcc -o RedButton RedButton.cpp\n```\n\n计算机不识别函数\
    \ `PushTheRedButton()`，所以它不知道该做什么并报了错。如果我们告诉计算机它是做什么的，它就能通过编译。将 `RedButton.cpp`\
    \ 修改成这样：\n\n```\nvoid PushTheRedButton(void)\n{\n}\n\nint main(void)\n{\n    PushTheRedButton();\n\
    \    return 1;\n}\n```\n\n`PushTheRedButton` 什么也不做，但计算机不在乎。调用其他函数的另一种方法是使用系统内置的库。我们通过将库链接到我们的程序来实现。现在我们将做一些有用的事情。将下面的代码保存为\
    \ `HelloWorld.cpp` 并用 `gcc -o HelloWorld` 编译：\n\n```cpp\n#include <stdio.h>\n\n\
    int main(void)\n{\n    printf(\"Hello world!\\n\");\n    return 1;\n}\n```\n\n\
    这里有两个不熟悉的部分。以 `#include` 开头的行告诉编译器的一个名为“预处理器”的部分在系统头文件 `stdio.h` 中查找函数定义。`stdio.h`\
    \ 是定义了许多标准输入输出函数（如 `printf()`）的文件名。尖括号——`<` 和 `>`——告诉预处理器这些是系统头。我们可以创建自己的，但我们以后会提到。\n\
    \n另一个不的部分是 `printf()` 括号里的部分。如果你从终端运行此程序，引号中的所有内容将打印在屏幕上。这种数据被称为字符串（即字符串）。\n\n\
    如果你删掉字符串末尾的反斜杠和字母 n，使其看起来像 `\"Hello world!\"`，会发生什么？\n\n## 作业\n编写一个使用减号和管道符号在终端上打印一个框的程序。\n\
    \n```\n----------\n|        |\n|        |\n|        |\n|        |\n----------\n\
    ```\n\n你如何写一个程序来画两个框，而不需要进行大量的打字？\n\n## 复习\n1. 什么是机器码？\n2. 什么是源代码？\n\n# 第 2 \n\
    我们之前的几个程序并没有特别好用，但随着学习的进行，你会发现你可以用程序做越来越多的事情。这一次，我们将介绍两个核心概念：注释，以及编译器生成你的程序所经过的各个阶段，我们还将学习一些关于调试代码的知识。\n\
    \n注释是你放在代码中的笔记。它们有许多用途，例如解释某些代码、提供警告或临时禁用一段代码。查看下面的示例以了解如何使用它们。\n\n"
- fmt: "\n```\n// This is a one-line comment.\n\n// So is this. Everything after the\
    \ two forward slashes is considered part of it.\n\nint main(void)\n{\n    PushTheRedButton();\
    \ // This code doesn't work.\n    return 1;\n}\n```\n\nInherited from C is the\
    \ multiline comment. They start with `/*` and end with `*/` in a way similar to\
    \ parentheses or curly braces with one difference: you can’t put a multiline comment\
    \ inside another one.\n\n```cpp\n/*-----------------------------------------------------------------------\n\
    RedButton.cpp\n\nThis code is an example of how the compiler will complain if\
    \ you use\na function that it doesn't recognize.\n\n------------------------------------------------------------------------*/\n\
    \n// This is a one-line comment.\n\n// So is this. Everything after the two forward\
    \ slashes is considered part of it.\n\nint main(void)\n{\n    PushTheRedButton();\
    \ // This code doesn't work.\n    return 1;\n}\n```\n\nNow we’re going to take\
    \ a step back and look at the process the compiler goes through when building\
    \ your program. This is important to understand because there are different kinds\
    \ of errors that can be made when writing code and knowing something about the\
    \ process will help you find them more easily.\n\nWhen a program is built from\
    \ source code, there are four tools that operate on it before it is an executable:\
    \ the preprocessor, the compiler, the assembler, and the linker.\n\n## The building\
    \ process\n\n### Stage 1: The Preprocessor\n\nThe preprocessor accepts raw source\
    \ code as input and does a little massaging before the code is sent to the compiler.\
    \ It removes comments and handles `#include` directives by inserting the contents\
    \ of the included header file into the code. There are other directives which\
    \ it handles that will be discussed later.\n\n### Stage 2: The Compiler\n\nThe\
    \ compiler translates the C++ code into Assembly language. Assembly is much, much\
    \ closer to the instructions which the computer understands while still being\
    \ human-readable. It is also much harder to write programs and is specific to\
    \ the processor for which it is written.\n\n### Stage 3: The Assembler\n\nThe\
    \ assembler creates `object code` from the Assembly code created by the compiler\
    \ and places them in object files which have a `.o` extension. Object code is\
    \ the actual machine-executable instructions used by the computer to run your\
    \ program. It’s not quite ready to run, however. In this state the object files\
    \ used to make your program are a lot like a set of puzzle pieces that are ready\
    \ to be put together.\n\n### Stage 4: The Linker\n\nThe linker pieces together\
    \ your object files along with any libraries that they use into an executable\
    \ program.\n\n## Debugging\n\nBy nature of programmers being human, they make\
    \ mistakes and lots of them. Writing code and debugging go hand-in-hand and often\
    \ done at the same time. As such, we will be learning about how to debug programs\
    \ as we learn about writing them.\n\nBugs come in two types: syntactic and semantic.\
    \ Syntactic bugs are easy to find because the compiler finds them for us. These\
    \ are problems like capitalization errors, missing or extra parentheses, and mistyped\
    \ function names. Semantic errors are often harder to find because they are errors\
    \ in the logic of perfectly legal code. A semantic error in English would be “The\
    \ oxygen censor on my car needed to be replaced” – the sentence is perfectly legal\
    \ and correctly constructed, but the word needed is `sensor`, not `censor`. Examples\
    \ of semantic errors are extra semicolons in certain places, adding the wrong\
    \ amount to a number, and making assumptions about the return value of a function.\n\
    \nLet’s take a look at a few simplified examples of common errors:\n\n### Example\
    \ 1\n\n```cpp\n#include <stdio.h>\n\nint main(void)\n{\n    return 1;\n}\n}\n\
    ```\n\n`foo.cpp:6: error: expected declaration before ‘}’ token`\n\nWhat we have\
    \ here is an extra curly brace. `gcc` has given us a fairly cryptic error, as\
    \ usual, but it has also given us two clues: the file name and the line number.\
    \ The line number given by `gcc` and the actual location of the error are not\
    \ always the same, but in this case they are.\n\nAt this point, you might be wondering,\
    \ “What in the world is a token, genius?” A `token` is any language element. Just\
    \ as a regular written language has words and punctuation, so do computer languages.\
    \ Just as two commas in a row are a punctuation error in the English language,\
    \ having an extra curly brace is a C++ punctuation error.\n\n### Example 2\n\n\
    ```cpp\n/*-----------------------------------------------------------------------\n\
    RedButton.cpp\n\n/*This code is an example of how the compiler will complain if\
    \ you use\na function that it doesn't recognize.*/\n\n------------------------------------------------------------------------*/\n\
    \n// This is a one-line comment.\n\n// So is this. Everything after the two forward\
    \ slashes is considered part of it.\n\nint main(void)\n{\n    PushTheRedButton();\
    \ // This code doesn't work.\n    return 1;\n}\n```\n\n`foo.cpp:7: error: expected\
    \ unqualified-id before ‘--’ token`\n\nThis is an example of how the line number\
    \ for the error is not the same place as the actual error. The complaint is about\
    \ the dashes at the end of the multiline comment at the top. It is caused, however,\
    \ by nesting a multiline comment inside another one. The preprocessor removes\
    \ all comments, so what the compiler sees is this:\n\n```cpp\n------------------------------------------------------------------------*/\n\
    \nint main(void)\n{\n    PushTheRedButton();\n    return 1;\n}\n```\n\nThe compiler\
    \ doesn’t know what to do with the dashed line and complains.\n\n### Example 3\n\
    \n```cpp\nint Main(void)\n{\n    return 1;\n}\n```\n\n`Main.cpp:3: error: undefined\
    \ reference to 'main'`\n\nThis is an error of a different kind. Remember that\
    \ `main()` needs to be defined in every program? We defined `Main()` otherwise\
    \ valid, so it compiled just fine, but when the linker attempted to piece it all\
    \ together, it couldn’t find the one required function and threw an error.\n\n\
    Resolving `undefined reference` linker errors isn’t generally difficult.\n\n##\
    \ Review\n\n1. What are the two ways of adding comments to your code?\n2. What\
    \ are the four tools used to turn source code into machine code?\n3. Name and\
    \ define the two general classes of programming errors.\n\n# Lesson 3\n\nSo far\
    \ we’ve been learning about programming basics, such as how to write a function\
    \ and how to start looking for bugs in our code. This time we’ll be learning about\
    \ different types of data and ways to store and pass it.\n\nThere is only so much\
    \ that can be done with direct manipulation like `return 1 + 1;` which is why\
    \ we have **variables**. A variable is simply a storage container for information,\
    \ and just like any real world container, they come in different shapes, sizes,\
    \ and uses.\n\nCreating a variable is merely a matter of declaring its existence,\
    \ as seen below.\n\n```cpp\n#include <stdio.h>\n\nint main(void)\n{\n    // Declaring\
    \ one integer variable named a\n    int a;\n\n    // Declaring two at once: b\
    \ and c\n    int b, c;\n\n    a = 1;\n    b = 2;\n    c = 3;\n\n    // print out\
    \ the values of our variables\n    printf(\"a is %d, b is %d, and c is %d.\\n\"\
    , a, b, c);\n\n    return a + b + c;\n}\n```\n\nVariables can be declared one\
    \ at a time, such as our variable `a`, or several at once, like `b` and `c`. In\
    \ addition to declaring variables for our use in functions, many times we’ll get\
    \ them for free because many functions require input data to do their work. These\
    \ variables are called **parameters** or **arguments**.\n"
