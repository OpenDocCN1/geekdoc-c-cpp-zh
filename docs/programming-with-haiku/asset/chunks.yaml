- fmt: "\n```c\n#include <stdio.h>\n\nint main(void)\n{\n    // This variable will\
    \ be our \"guinea pig.\"\n    int myInt = 5;\n\n    // Declare a pointer that\
    \ we know doesn't point to a valid memory address.\n    int *uselessPointer =\
    \ NULL;\n\n    // Set the value of this pointer to the memory address that myInt\
    \ stores\n    // its value in. Without the * in front of its name, it would be\
    \ considered\n    // a regular variable and this would generate a compiler error.\
    \ The\n    // ampersand (&) in front of myInt gets the address of myInt.\n   \
    \ // Note that space in between the * and the name of the pointer is OK.\n   \
    \ int *intPointer = &myInt;\n\n    // %p prints the address of a pointer. This\
    \ changes from one execution of\n    // the program to another.\n    // A pointer\
    \ with a * in front of it returns the data its address\n    // actually holds,\
    \ so *intPointer in this case is 5.\n    printf(\"intPointer's address is %p and\
    \ contains the value %d\\n\",\n        intPointer, *intPointer);\n}\n```\n\nPointers,\
    \ like arrays, require care when used because they can make it really easy for\
    \ a programmer to segfault a program. **Always initialize a pointer to `NULL`\
    \ or a known-good address**. What’s `NULL`, you ask? It’s just another word for\
    \ zero when referring to pointers. Even though a `NULL` pointer is just as unusable\
    \ as an uninitialized pointer – one which points to a random address – you know\
    \ for certain that it’s unusable.\n\n## Strings\n\nIn the Lesson 3, we learned\
