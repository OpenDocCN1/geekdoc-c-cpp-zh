  trans: "\n引用（References）是一项让你想说“好的，这不错。我们继续吧”的功能，但这里的内容远比表面看起来要复杂。首先，你无法更改引用所指向的位置，因此\
    \ `myRef` 始终将指向 `myPointer` 所指向的地址——即使 `myPointer` 发生了变化——所以在 `myPointer` 被释放后尝试使用\
    \ `myRef` 将导致分段错误（segmentation fault）。这种不可改变性实际上是件好事。引用必须初始化且不能取消初始化，因此除非它所引用的内存被释放或它所引用的变量超出了作用域，否则它将始终有效。这使得引用比指针安全得多，代价是牺牲了一定的灵活性。\n\
    \n## 参数使用：按引用还是按值\n\n从函数获取数据有多种方法。通常的方法是它返回的值，但引用提供了另一种方法。通常，当将参数传递给函数时，变量的拷贝会被传递给函数——参数的`value`\
    \ 值被发送到函数，而不是变量本身。这意味着你可以更改参数而不会引起函数外部的麻烦。当给函数一个参数的引用时，函数对其进行的任何更改在函数退出后仍会继续存在。将函数改为按引用传递参数，只需在参数名称前添加一个取地址符（`&`）。\n\
    \n```cpp\nconst char * someFunction(int &integerByReference);\nfloat someOtherFunction(const\
    \ double &doubleByReference);\n```\n\n在这个示例中，`someFunction` 不仅会输出字符串，还可以调整 `integerByReference`，允许我们从一次函数调用中获取两个值而不是仅仅一个。`someOtherFunction`\
    \ 使用了常量引用。虽然这看起来可能很傻——传递一个你无法更改的引用——但它确实有其用途：它节省了一个拷贝。这是加快频繁调用函数的一种方法，特别是当它有很多参数或某个参数占用大量内存时。\n\
    \n为了确保我们充分掌握了按值传递变量和按引用传递变量的区别，让我们来看一个说明这种区别的代码示例。\n\n```cpp\n#include <stdio.h>\n\
    \n// 此函数按引用传递 x，按值传递 y\nint myFunction(int &x, int y)\n{\n    x = x * 2;\n   \
    \ y = y + 5;\n\n    return x * y;\n}\n\nint main(void)\n{\n\n    // 为我们的工作创建几个变量\n\
    \    int foo = 5;\n    int bar = 10;\n\n    int outValue = myFunction(foo,bar);\n\
    \n    printf(\"foo is %d, bar is %d, and myFunction(foo,bar) is %d\\n\",\n\n \
    \   foo,bar,outValue);\n\n    return 0;\n}\n```\n\n在这个示例中，`foo` 的初始值为 5，但因为 `myFunction()`\
    \ 改变了它，所以在打印时它的值为 10。`bar` 没有被改变，因为 `myFunction()` 改变的是 `bar` 的一个拷贝。\n\n## 函数指针\n\
    \n当你认为指针不能更诡异时，情况变得更糟了。不仅可以拥有一个地址存储某个值的指针，指针还可以指向一个包含代码的地址。\n\n```cpp\nvoid (*functionPointer)(int\
    \ value, int anotherValue);\n```\n\n这段代码片段**不是**一个函数。它实际上是一个名为 `functionPointer`\
    \ 的指针的声明。\n\n在星号和指针名称周围放置括号，是为了确保它被声明为函数指针，而不是一个返回 `void` 指针的函数。\n\n函数指针的类型非常特殊。返回值以及参数的数量和类型都是函数指针类型的一部分。这两个函数指针不是同一类型：\n\
    \n```cpp\nvoid (*integerFunction)(int value);\nint (*anotherIntegerFunction)(int\
    \ value);\n```\n\n通过指针执行函数非常简单：将指针视为函数的名称即可。这个示例调用了 `integerFunction` 指针所持有的函数：\n\
    \n```cpp\n_integerFunction_(5);\n```\n\n和引用一样，函数指针的使用并不显而易见。它们为程序添加了不可思议的灵活性。代码可以像汽车零件一样被加装或更换。诸如\
    \ Python 或 Perl 之类的解释型语言使得在运行时更改程序非常容易，但对于像 C++ 这样的编译型语言来说，这并不容易。虽然通常很罕见，但在稍后查看程序插件时，我们会频繁使用函数指针。现在，不要过度担心它们。\n\
    \n## 指针的指针\n\n是的，指针可以指向指针。指针所持有的地址很容易是另一个指针的地址。这只需要在声明指针时添加第二个星号即可。\n\n```cpp\n\
    char **somePointerToAPointer;\n```\n\n不要忘记，指针的声明不会分配任何内存！此声明之后唯一存在的是 `somePointerToAPointer`。我们可以用它做不同的事情，例如在不使用返回值从函数获取指针，或者创建一个字符串列表。是的，这就是在堆上创建固定字符串列表的方法。这也是我们从命令行获取参数的方法。\n\
    \n## 命令行参数\n\n就像接收参数的函数——或者说参数……它们是一回事一样——程序本身也可以接收传递给它们的信息。例如，这个终端命令：\n\n```bash\n\
    rm -f --verbose myFile\n```\n\n`rm` 命令有三个参数：文件名和两个开关。命令行开关是程序行为的选项。在这种情况下，`rm`\
    \ 操作 `myFile`。`-f` 开关强制强制不询问，而 `--verbose` 开关告诉它打印更多信息。Windows 中的开关以斜杠开始，但在 Linux、OS\
    \ X 和 Haiku 中，它们以横杠开始。作为一个常规，单横杠开关有一个字母，双横杠开关通常是横杠分隔的单词和短语。在这些课程中我们不会过多关注命令行开关，因为我们的项目将会变得足够复杂。\n\
    \n为了让程序能够利用命令行参数，`main()` 的用法必须发生一点变化：\n\n```cpp\nint main(int argc, char **argv)\
    \ { return 0; }\n```\n\n现在 `main()` 取两个参数：`argc` 是命令行参数的数量，`argv` 是包含命令行内容的字符串列表。将\
    \ `argv` 视为数组——如果 `argc` 为 2，那么 `argv` 将拥有元素 0 和 1。`argv[0]` 始终包含运行时的程序名称。这个程序将打印传递给它的命令行参数。\n\
    \n```cpp\n#include <stdio.h>\n\nint main(int argc, char **argv) { // 遍历所有参数并打印它们。for\
    \ (int i = 0; i < argc; i++) printf(\"Program argument %d: %s\\n\", i, argv[i]);\n\
    \n      return 0;\n}\n```\n\n仔细观察的是 `printf()` 语句的结尾。使用指针指针实际上相当于使用多维数组。字符串只是特殊的\
    \ *char* 数组，因此我们正在单独访问字符列表。如果我们只想使用第一个参数的第二个字符，我们将使用 `argv[0][1]`。如果有点模糊，括号顺序从左到右从最大组到最小组，所以我们是在列表列表中访问元素\
    \ 0，并从该列表中选择元素 1 —— 第二个字符。\n\n## 赋值\n\n凭借我们在这十节课程中学学到的所有知识，我们有能力完成很多事情。这将是我们第一个具有显著价值的项目。我们将编写一个简单的命令行工具\
    \ *cat* 的版本，它通过按照命令行指定的顺序将文件打印到 *stdout* 来连接（或合并）文件。\n"
- fmt: "\nFor this project, we will need to use two new functions: `fread` and `fwrite`.\n\
    \n```\nsize_t fread (void *buffer, size_t size, size_t count, FILE *stream); size_t\
    \ fwrite (void *buffer, size_t size, size_t count, FILE *stream);\n```\n\n`fread`\
    \ reads in data from a file stream. This function will try to read in `size *\
    \ count` bytes and place the data into `buffer`. This is really handy because\
    \ you can allocate any kind of array for `buffer`, use the `sizeof()` function\
    \ on its type for `size`, and send the number of elements in the array as `count`.\
    \ `fread` returns the number of elements actually read. If it is not the same\
    \ as what was requested, there was either an error or the end of the file was\
    \ reached.\n\n`fwrite` works the same way as `fread`, but in reverse. Data in\
    \ `buffer` is written to `stream` and the number of elements written are returned.\n\
    \nConceptually, this will involve what we have just learned about using command\
    \ line arguments in combination with file operations from Lesson 8 plus `fread`\
    \ and `fwrite`. Use a `for` loop to execute the following set of steps on each\
    \ argument.\n\n* Try to open the argument for reading as a file.\n* If the open\
    \ fails, skip to the next iteration.\n* If the open succeeds, try to read a chunk\
    \ of data from the file, storing the number of bytes read into a variable.\n*\
    \ Use a `while` loop to read sections of data from the file, repeating while the\
    \ number of bytes read is greater than 0.\n    * Write the number of bytes read\
    \ to `stdout`.\n    * Try reading some more data from the file handle, storing\
    \ the number of bytes read.\n    * Close the file’s handle\n\nPrinting file errors\
    \ using `ferror` might be a nice touch. The chunk of memory you store the file\
    \ data in can be from the stack or from the heap.\n\nBecause we haven’t done much\
    \ actual writing of code, I’ll do a little to get you going. All you’ll have to\
    \ do is replace each of the comments with the corresponding code. It might be\
    \ a good idea to write a little bit at a time and recompile. Writing code incrementally\
    \ and testing it helps keep bugs small and easy to locate.\n\n```\n#include <stdio.h>\n\
    #include <malloc.h>\n\nint main(int argc, char **argv) { for (int i = 1; i < argc;\
    \ i++) { // open a file handle for reading from argv[i]\n\n    // if the file\
    \ handle is NULL or there is an error, continue to\n    // the next iteration.\n\
    \n    // create a data buffer -- an array to hold our data. Size isn't\n    //\
    \ terribly important, but it should be at least a few hundred bytes\n    // and\
    \ no more than about 4000 bytes. You can create it on the stack\n    // or use\
    \ malloc, whichever you prefer.\n\n    // create a variable to store the number\
    \ of bytes actually read\n\n    // read data from the file handle and store the\
    \ number of bytes\n    // read into the variable that we just created.\n\n   \
    \ // Start our while() loop. Loop while the number of bytes read is\n    // greater\
    \ than zero and if ferror does not indicate an error on\n    // the file handle\n\
    \    {\n        // write the number of bytes read to stdout\n        // read more\
    \ data and put the number of bytes actually read\n        // into the variable\
    \ we created above.\n    }\n\n    // free the buffer here if you used malloc,\
    \ never mind if you put\n    // the buffer on the stack.\n\n      // close the\
    \ file handle here\n    }\n\n      return 0;\n    }\n```\n\n## Review\n\n1. What\
    \ do default values for function parameters enable you to do?\n2. What advantages\
    \ do references have over pointers?\n3. How is a reference declared?\n4. What\
    \ is the difference between passing a parameter by value and passing one by reference?\n\
    5. Which of these declares a function pointer:\n    1. `void (*myFunction)(int\
    \ someInteger);`\n    2. `void *myFunction(int someInteger);`\n    3. `(void *)myFunction(int\
    \ someInteger);`\n\n# Lesson 11\n\nThis lesson marks the end of what I would call\
    \ the \"training wheels\" of C programming. Once we are done here, we will be\
    \ getting into what makes C++ powerful and, shortly thereafter, what programming\
    \ for the Haiku operating system is all about. This lesson’s topic is data structures.\
    \ Even though variables and arrays are great, they are not enough sometimes. Let’s\
    \ get started.\n\n## Typedefs: User-Defined Types\n\nIt’s possible to create your\
    \ own types in C and C++ using the `typedef` keyword. The `size_t` type that we\
    \ used in the last lesson with `fread()` and `fwrite()` was created that way.\
    \ Once we start looking at the specifics of the Haiku API, we’ll be using user-defined\
    \ types all the time. Because the sizes of `long`, `int`, and the other built-in\
    \ types have sizes that change depending on which operating system is being used,\
    \ other types have been defined to ensure that a developer can choose a type with\
    \ a specific size.\n\nA type is defined using the format `typedef baseType newTypeName`\
    \ like the entries that are found below, taken from Haiku’s `<config/types.h>`\
    \ header.\n\n```\n// The type of data       The new name for the data\n\ntypedef\
    \ signed char         __haiku_std_int8;\ntypedef unsigned char       __haiku_std_uint8;\n\
    typedef signed short         __haiku_std_int16;\ntypedef unsigned short      __haiku_std_uint16;\n\
    typedef signed int           __haiku_std_int32;\ntypedef unsigned int        \
    \ __haiku_std_uint32;\ntypedef signed long         __haiku_std_int64;\ntypedef\
    \ unsigned long       __haiku_std_uint64;\n```\n\nThe `signed` and `unsigned`\
    \ keywords are new only because we haven’t needed them yet. Signed types can hold\
    \ negative values and unsigned ones can’t. For example, `signed char` can hold\
    \ values from -128 to 127 and `unsigned char` can hold 0 to 255.\n\nThese types\
    \ really are just different names for the same kind of data, so `__haiku_std_uint32`\
    \ is just another name for an `unsigned int`. The new names created above aren’t\
    \ very friendly, but that’s OK. They’re not normally used or seen – they are actually\
    \ intermediary names found in `<SupportDefs.h>`.\n\n```\ntypedef __haiku_int8\
    \    int8;   // an 8-bit signed integer\ntypedef __haiku_uint8   uint8;  // an\
    \ 8-bit unsigned integer\ntypedef __haiku_int16   int16;  // a 16-bit signed integer\n\
    typedef __haiku_uint16  uint16; // a 16-bit unsigned integer\ntypedef __haiku_int32\
    \   int32;  // a 32-bit signed integer\ntypedef __haiku_uint32  uint32; // a 32-bit\
    \ unsigned integer\ntypedef __haiku_int64   int64;  // a 64-bit signed integer\n\
    typedef __haiku_uint64  uint64; // a 64-bit unsigned integer\n```\n\nAh. Much\
    \ better. From here on, we’ll be using these types instead of the standard ones\
    \ to get used to them before we dive into the Haiku API.\n\n## Enumerated Types\n\
    \nAn enumerated type is one which is limited to a specified set of values. For\
    \ example, if you were making a card game of some kind, you could define a card’s\
    \ suit as an enumerated type that would carry more meaning than an arbitrary integer\
    \ value. It would look like this:\n\n```\nenum card_suit\n{\n    SUIT_CLUBS,\n\
    \    SUIT_DIAMONDS,\n    SUIT_HEARTS,\n    SUIT_SPADES\n};\n```\n\nThis would\
    \ then make it possible to have a variable `cardSuit` that could have a value\
    \ that was one of the four in the list. Declaring and initializing it would look\
    \ like this:\n\n```\nenum card_suit cardSuit = SUIT_HEARTS;\n```\n\nThe format\
    \ for creating an enumerated type looks like this, with the name and assigning\
    \ integer values being optional:\n"
