- fmt: "\n```cpp#include <stdio.h>\n\n// This is a global variable, accessible from\
    \ anywhere\nint gAppReturnValue = 0;\n\nint AreaOfSquare(int size)\n{\n    return\
    \ size * size;\n}\n\nint main(void)\n{\n    int returnValue = 1;\n\n    // We\
    \ actually start from 1 in this loop because measuring the area\n    // of a square\
    \ of 0 inches is pretty silly.\n    for (int i = 1; i <= 12; i++)\n    {\n   \
    \     // i is only accessible from within this loop.\n        // If we had a need\
    \ to utilize returnValue, we could do it here.\n        int area = AreaOfSquare(i);\n\
    \n        printf(\"The area of a square %d inches on a side is \"\n          \
    \      \"%d square inches\\n\",i,area);\n    }\n\n    // If we try to access the\
    \ area variable outside the loop,\n    // the compiler will complain with an error\
    \ something like\n    // \"foo.cpp:30: error: ‘area’ was not declared in this\
    \ scope\"\n\n    return gAppReturnValue;\n}\n```\n\nHaving seen the above example,\
    \ you should be aware of what names you give your variables. The lone global variable\
    \ in this code has a lowercase 'g' for a prefix. This is to signify that it is\
    \ a global. Static variables use the prefix 's' instead of 'g'. Get into the habit\
    \ of using these prefixes to avoid more than a few headaches.\n\nIf you’re like\
    \ me, you’re probably wondering what kind of headaches I’m talking about. Take\
    \ a look at this example and ask yourself what value would be printed.\n\n```cpp\n\
    #include <stdio.h>\n\n// This is a static variable, accessible from anywhere in\
    \ this file\nstatic int returnValue = 1;\n\nint main(void)\n{\n    int returnValue\
    \ = 2;\n\n    printf(\"The return value of this program is %d\\n\",returnValue);\n\
    \n    return returnValue;\n}\n```\n\nIn case you’re too lazy to try this sample\
    \ out, the value is 2. This could’ve been easily avoided by naming our static\
    \ variable `sReturnValue`. Local variables always receive precedence when there\
    \ are conflicts in scope. It’s also possible to hide a parameter or a previously-declared\
    \ local variable this way, such as a variable in an `if` block hiding a variable\
    \ declared at the beginning of a function. *Be careful not to hide parameters\
    \ with the variables you declare in a function.*\n\nGlobal and static variables\
    \ are much like spices in cooking: used sparingly, they can really make writing\
    \ programs easier, but used too much, all they will do is help you make a big\
    \ mess. When in doubt, don’t use global variables to pass data around – use function\
    \ parameters instead. Doing so will make it much easier to reuse code that you’ve\
    \ written. Once again, work smarter, not harder.\n\n## Constants\n\nNot everything\
    \ is subject to being changed in C and C++. Sometimes we want to ensure that some\
    \ data not be altered at all. There are other times when we want to use a variable\
    \ to remember some arbitrary value – we don’t care what the value itself happens\
    \ to be, but we do want to remember its purpose. When we get to writing Haiku\
    \ programs that use windows and buttons, we will use these quite a lot to specify\
    \ behavior for controls that we use, such as how they will be resized.\n\nThe\
    \ first kind of constant is the preprocessor definition. In case you don’t remember\
    \ from Lesson 2, the preprocessor is the first tool used when compiling source\
    \ code into an executable. The preprocessor removes comments, includes header\
    \ files, and other basic text insertion and substitution. They look like this:\n\
    \n```\n#define SOMEDEF \"I like cheese!\"\n#define STRACE(x) printf x\n```\n\n\
    The format is simple: `#define <definition> <what gets put there>`. They are simple\
    \ textual substitutions, much like if you opened a word processor and made it\
    \ replace all occurrences of `SOMEDEF` with \"I like cheese!\" As far as the compiler\
    \ is concerned, you never even typed `SOMEDEF`. You can even make them look like\
    \ functions, like `STRACE`. We’ll look at this one in more detail at the end of\
    \ the lesson, so just sit tight on that one.\n\nEven more so than arrays, `#defines`\
    \ need to be handled carefully. It is good practice to put them in all capitals\
    \ so that they do not look like functions. They also are not type-aware, and one\
    \ other word of caution: no matter how much they beg, no matter how much they\
    \ cry, never, **NEVER put a semicolon at the end of a preprocessor definition**.\n\
    \n```cpp\n// Do NOT do this\n#define THISISBAD 1;\n```\n\nDoing so will result\
    \ in errors in your code that seemingly have nothing to do with the real problem.\
    \ These are the kind of bugs that make you feel as if you’re aging prematurely,\
    \ even if you’re not.\n\nConstant variables are the preferred means of remembering\
    \ an arbitrary value because they have a defined type. This is done by placing\
    \ the `const` keyword in the declaration of a variable. Because they are not allowed\
    \ to be modified, you will almost always see a constant initialized when it is\
    \ declared.\n\n```cpp\nconst int someConstantIntValue = 3;\n```\n\nPointers can\
    \ be made constant, as well, but it gets confusing *very* quickly if you’re not\
    \ careful. The `const` keyword can apply to the pointer’s address, to the pointer\
    \ itself, or both.\n\n```cpp\n// This is just a constant integer that we'll use\
    \ for some of the pointers below.\nconst int someVariable = 5;\n\n// These are\
    \ both pointers to an int where we can change the pointer's address,\n// but not\
    \ its value.\nconst int *ptrConst;\nint const anotherPtrConst;\n\n// This is a\
    \ constant pointer. We can change the value, but not the address.\nint * const\
    \ ptrConst;\nint * const anotherPtrConst;\n\n// These are constant pointers to\
    \ a constant value. We can't change anything.\nconst int *const ptrPtrConst;\n\
    int const *const anotherPtrConst;\n```\n\nWhat a mess! There is a rule of thumb\
    \ which helps make sense of all this confusion. **The `const` keyword applies\
    \ to the element to its left. If there isn’t anything there, then it applies to\
    \ whatever is to the right.** In the first two examples above, every time you\
    \ see `const int` or `int const`, it means that the pointer itself can be changed,\
    \ but not the value it points to. Every time you see `* const`, it makes the pointer’s\
    \ address fixed, but the value at address can be changed. The last examples above\
    \ combine these two techniques to make everything constant, both address and value.\
    \ If you’re still confused on this, don’t worry too much – it’s not just you.\
    \ This is a hard topic.\n\n## Using Data From Outside: File Operations\n\nThe\
    \ only way that we know how to get information into our program is `gets()`, and\
    \ the only way to get it out is `printf()`. While `printf()` is just fine, `gets()`\
    \ is actually dangerous and whenever the compiler encounters its use, it warns\
    \ us. The reason is that there is no way to enforce how many characters are placed\
    \ in the string passed to it. Crashing the program is as easy as typing more characters\
    \ than the capacity of the array that is given to it. We’re going to move on to\
    \ a much better solution.\n\nMoving information in and out of programs is normally\
    \ done using streams. Information flows in or out of your program. Direct input\
    \ from the user is a stream, and the screen is one also – one for output. Console\
    \ programs utilize streams to get and print information, and they can even be\
    \ linked together: the program that we use when we run Terminal, called bash,\
    \ features an incredibly powerful ability to take what one program spits out and\
    \ feed it to another one or dump it into a file.\n\nThere are three main streams\
    \ that are available to every program: `stdin`, the standard input, `stdout`,\
    \ the standard output, and `stderr`, the error output. Unless changed, a program\
    \ that gets data from `stdin` will ask for input from the user just like we’ve\
    \ done with `gets()` and sending anything to `stdout` or `stderr` will be printed\
    \ on the screen.\n"
