  trans: "\n\n```cpp\n#include <stdio.h>\n\n// This is a global variable, accessible\
    \ from anywhere\nint gAppReturnValue = 0;\n\nint AreaOfSquare(int size)\n{\n \
    \   return size * size;\n}\n\nint main(void)\n{\n    int returnValue = 1;\n\n\
    \    // We actually start from 1 in this loop because measuring the area\n   \
    \ // of a square of 0 inches is pretty silly.\n    for (int i = 1; i <= 12; i++)\n\
    \    {\n        // i is only accessible from within this loop.\n        // If\
    \ we had a need to utilize returnValue, we could do it here.\n        int area\
    \ = AreaOfSquare(i);\n\n        printf(\"The area of a square %d inches on a side\
    \ is \"\n                \"%d square inches\\n\",i,area);\n    }\n\n    // If\
    \ we try to access the area variable outside the loop,\n    // the compiler will\
    \ complain with an error something like\n    // \"foo.cpp:30: error: ‘area' was\
    \ not declared in this scope\"\n\n    return gAppReturnValue;\n}\n```\n\n看了上面的示例，你应该意识到你给变量命名的重要。这段代码中唯一的全局变量以小写\
    \ 'g' 作为前缀。这表示它是一个全局变量。静态变量使用前缀 's' 而不是 'g'。养成使用这些前缀的习惯，可以避免很多头恼。\n\n如果你像我一样，可能在想我指的是什么样的头恼。看看这个例子，问问自己会打印出什么值。\n\
    \n```cpp\n#include <stdio.h>\n\n// This is a static variable, accessible from\
    \ anywhere in this file\nstatic int returnValue = 1;\n\nint main(void)\n{\n  \
    \  int returnValue = 2;\n\n    printf(\"The return value of this program is %d\\\
    n\",returnValue);\n\n    return returnValue;\n}\n```\n\n如果你懒得尝试这个示例，那么这个值是 2。通过将我们的静态变量命名为\
    \ `sReturnValue`，本很容易避免这种情况。当作用域发生冲突时，局部变量总是具有优先级。通过这种方法还可以隐藏参数或之前声明的局部变量，例如 `if`\
    \ 块中的变量可以隐藏在函数开头声明的变量。*注意不要用你在函数中声明的变量来隐藏参数。*\n\n全局和静态变量就像烹饪中的调料：少量使用它们确实可以让编写程序变得更容易，但如果用太多，只会让你弄出一团乱。。不确定时，不要使用全局变量来传递数据——要改用函数参数。这样做将让你重用你编写的代码变得容易得多。再次，要聪明工作，不要盲目工作。\n\
    \n## 常量\n\n在 C 和 C++ 中，并不是所有内容都可以修改。有时我们希望确保某些数据完全不被修改。其他时候，我们希望使用变量来记住某个任意值——我们并不关心该值本身是什么，但我们确实想记住它的用途。当我们编写使用窗口和按钮的\
    \ Haiku 程序时，我们将经常使用这些来指定我们所用控件的行为，例如它们将如何调整大小。\n\n第一种常量是预处理器定义。如果你不记得第 2 课的内容，预处理器是将源代码编译为可执行文件时使用的第一个工具。预处理器会移除注释、包含头文件以及其他的基础文本插入和替换。它们看起来像这样：\n\
    \n```\n#define SOMEDEF \"I like cheese!\"\n#define STRACE(x) printf x\n```\n\n\
    格式非常简单：`#define <定义> <被放入其中的内容>`。它们是简单的文本替换，就像你打开一个文字处理器并将其所有所有的 `SOMEDEF` 替换为\
    \ \"I like cheese!\" 一样。对于编译器来说，你甚至从未输入过 `SOMEDEF`。你甚至可以让它们看起来像函数，比如 `STRACE`。我们将在课程结束时详细查看这一个，所以这一点先不用急。\n\
    \n比数组更甚，`#defines` 需要被小心地处理。将它们写全大写是一个良好的习惯，这样它们看起来就不像函数。它们也不具备类型感知，还有另一个警告：无论它们如何恳求，无论它们如何哭泣，永远、**永远（NEVER）在预处理器定义的末尾加分号**。\n\
    \n```cpp\n// Do NOT do this\n#define THISISBAD 1;\n```\n\n这样做会导致代码中出现错误，这些错误似乎与实际问题毫无关系。这类\
    \ bug 会让你觉得自己在加速衰老，即使你并并没有。\n\n常量变量是记住任意值的首选方法，因为它们有定义的类型。这是通过在变量声明中放置 `const`\
    \ 关键字来实现的。由于不允许被修改，你几乎总是会看到常量在声明时被初始化。\n\n```cpp\nconst int someConstantIntValue\
    \ = 3;\n```\n\n指针也可以是常量的，但如果你不小心，很快就会变得*非常*混乱。`const` 关键字可以应用于指针的地址、指针本身，或者两者都是。\n\
    \n```cpp\n// 这只是一个常量整数，我们将它用于下面的一些指针中。\nconst int someVariable = 5;\n\n// 这些都是指向\
    \ int 的指针，我们可以更改指针的地址，\n// 但不能改变它的值。\nconst int *ptrConst;\nint const anotherPtrConst;\n\
    \n// 这是一个常量指针。我们可以改变值，但不能改变地址。\nint * const ptrConst;\nint * const ptrConst;\n\
    \n// 这些指向常量值的常量指针。我们什么都不能改。\nconst int *const ptrConst;\nint * *;\n```\n\n多么混乱！有一个准则可以帮助理解这些混乱。**`const`\
    \ 关键字应用于其左侧的元素。如果左侧没有任何东西，那么它就应用于右侧的内容。**在上面的两个例子中，每当你看到 `const int` 或 `int const`\
    \ 时，意味着指针本身可以改变，但它指向的值不能。每当你看到 `* const` 时，意味着指针的地址是固定的，但地址的值可以改变。最后的例子结合了这两种技术，使得地址和值都是常量的。\n\
    \n## 使用外部数据：文件操作\n\n我们唯一知道将信息获取到程序的方法是 `gets()`，而唯一将它输出的方法是 `printf()`。虽然 `printf()`\
    \ 很好，但 `gets()` 实际上是危险的，每当编译器遇到它的使用时，都会警告我们。原因是没有方法强制限制传递它的字符串中放置了多少字符。只需输入超过数组容量的字符就会导致程序崩溃。我们将转向一个更好的解决方案。\n\
    \n信息进出程序的移动通常通过流来完成。信息流入或流出你的程序。来自用户的直接输入是一个流，屏幕也是一个——用于输出。控制台程序利用流来获取和打印信息，它们甚至可以连接在一起：当我们运行\
    \ Terminal 时使用的程序称为 bash，拥有一种极其强大的功能，可以将一个程序的输出馈给另一个程序，或者将其转储到文件中。每个程序可用的三个主流是\
    \ `stdin`（标准输入）、`stdout`（标准输出）和 `stderr`（错误输出）。除非更改，否则从 `stdin` 获取数据的程序将像我们使用\
    \ `gets()` 那样请求用户输入，而发送任何内容到 `stdout` 或 `stderr` 都将打印在屏幕上。\n\n"
- fmt: "\nData can be brought into our programs by reading from a stream, and it can\
    \ be sent out of our program by writing to one. Some streams are read-only, some\
    \ are write-only, and some allow both reading and writing. `stdin` is read-only,\
    \ so we can use it only for getting data. `stdout` and `stderr` are write-only,\
    \ so we can only print to them. If we create a stream to operate on a file, we\
    \ can choose either or both.\n\nEach stream has an identifier, called a `handle`.\
    \ In programming, a handle is just an arbitrary – but most often unique – number\
    \ which is used to identify an object from others of its kind. Operating on a\
    \ stream is as simple as obtaining a handle for the stream and calling the appropriate\
    \ function. Let’s take a look at the declarations for some of the functions that\
    \ we will use in day-to-day C programming.\n\n```\nint printf(const char *format,\
    \ ...);\nint fprintf(FILE *streamHandle, const char *format, ...);\n```\n\nAn\
    \ old standard. Given a string which defines the format for what is to be printed\
    \ and an appropriate number of parameters afterward, prints a string to `stdout`.\
    \ `fprintf()` requires a stream handle to be specified before the format string\
    \ – making it possible to \"print\" directly to a file – but otherwise working\
    \ exactly like `printf()`. When successful, both functions return the number of\
    \ characters printed. A negative return value is used to indicate failure.\n\n\
    ```\nint ferror(FILE *streamHandle);\n```\n\nThis returns a 0 if everything is\
    \ OK on the stream indicated by `streamHandle` and some other unspecified value\
    \ if an error has occurred. Make sure that `streamHandle` is not `NULL` – it will\
    \ segfault your program otherwise.\n\n```\nint feof(FILE *streamHandle);\n```\n\
    \nThis returns a 0 if everything is OK on the stream indicated by `streamHandle`\
    \ and some other unspecified value if the stream has come to the end of the file.\
    \ Make sure that `streamHandle` is not `NULL` – it will segfault your program\
    \ otherwise.\n\n```\nchar * fgets(char *array, int arraySize, FILE *streamHandle);\n\
    ```\n\n`fgets()` is the safe version of `gets()`. It reads in text from the stream\
    \ handle until it encounters an endline (`'\\n'`) character or it reads the number\
    \ of characters equal to `arraySize`, making a segmentation fault possible if\
    \ the programmer makes a mistake. As with `gets(),` when successful, `fgets()`\
    \ returns the same pointer as `array`. If there is an error, it returns a `NULL`\
    \ pointer. If `fgets()` comes to the end of the file – only encountered when reading\
    \ from a file instead of `stdin` – the contents of the array remain unchanged\
    \ and a `NULL` pointer is returned. Whenever a `NULL` pointer is returned by `fgets()`,\
    \ use `feof()` and `ferror()` to figure out you have run out of data or something\
    \ has gone wrong.\n\n```\nFILE * fopen(const char *filePath, const char *mode);\n\
    ```\n\n`fopen()` opens a file as a stream. If successful, it returns a stream\
    \ handle which is used by other functions and must be eventually closed with `fclose()`.\
    \ The mode strings are listed below.\n\n### fopen mode strings\n\n| Mode string\
    \ | Function |\n| --- | --- |\n| \"r\" | Open a file for reading. The file has\
    \ to exist. |\n| \"w\" | Open a file for writing. If the file exists, its contents\
    \ are erased and it is treated as a new empty file. |\n| \"a\" | Open a file for\
    \ writing. Any data written to it is added to the end of the file. If the file\
    \ doesn’t exist, it is created |\n| \"r+\" | Open a file for updating, supporting\
    \ both reading and writing. The file must already exist. |\n| \"w+\" | Open a\
    \ file for updating, supporting both reading and writing. If the file exists,\
    \ its contents are erased and it is treated as a new empty file. |\n| \"a+\" |\
    \ Open a file for reading and appending. Reading can be done from anywhere in\
    \ the file, but all writes are tacked onto the end of the file. |\n\n```\nint\
    \ fclose(FILE *streamHandle);\n```\n\nClose up an opened stream handle.\n\nWow.\
    \ That’s a lot of different functions! The scary part is that this is only a very\
    \ small portion of the functions available. A programmer should always be learning.\
    \ Once he is comfortable with a language, he is often learning about available\
    \ functions that are new to him and new ways to use the functions that he knows.\
    \ The best way to learn how to use functions that are new to you is to use them.\n\
    \nLet’s have a look at a program which prints a test file to `stdout` and creates\
    \ that file if necessary.\n\n```c\n#include <stdio.h>\n\nint\nFileExists(const\
    \ char *path)\n{\n    // This function tests for the existence of a file by trying\n\
    \    // to open it. There are better ways of doing this, but this\n    // will\
    \ work well enough for our purposes for now.\n    // If we were given a NULL pointer,\
    \ we will return a -1 to\n    // indicate an error condition.\n\n    if (!path)\n\
    \        return -1;\n\n    // Attempt to open the file for reading\n    FILE *file\
    \ = fopen(path,\"r\");\n\n    // our return value will be 1 if the file exists\
    \ and 0 if\n    // it doesn't. ferror() will return a nonzero result if\n    //\
    \ there was a problem opening the file and a 0 if the file\n    // opened OK.\n\
    \n    int returnValue;\n\n    // ferror will crash if given a NULL pointer\n \
    \   if (!file || ferror(file) != 0)\n        returnValue = 0;\n    else\n    {\n\
    \        fclose(file);\n        returnValue = 1;\n    }\n\n    return returnValue;\n\
    }\n\nint\nMakeTestFile(const char *path)\n{\n    // Always check for NULL pointers\
    \ when dealing with\n    if (!path)\n        return -1;\n\n    // Open the file\
    \ and erase the contents if already exists.\n    FILE *file = fopen(path,\"w\"\
    );\n    if (!file || ferror(file))\n    {\n        // We have a different error\
    \ code if we messed up\n        fprintf(stderr,\"Couldn't create the file %s\\\
    n\",path);\n\n        return 0;\n    }\n\n    // The stream handles for stdout,\
    \ stdin, and stderr are already\n    // for us, so we can use them without any\
    \ extra work, like in the\n    // condition above and where we put data into our\
    \ file below.\n    fprintf(file, \"This is a file.\\nThis is only a file.\\n\"\
    \n            \"Had this a real emergency, do you think I'd \"\n            \"\
    be around to tell you?\\n\");\n\n    fclose(file);\n\n    return 1;\n}\n\nint\n\
    main(void)\n{\n    int returnValue = 0;\n\n    // Let's use a test file in /boot/home\
    \ called MyTestFile.txt.\n    const char *filePath = \"/boot/home/MyTestFile.txt\"\
    ;\n\n    // Make the test file if it doesn't already exist and bail out of\n \
    \   // our program entirely if there is a problem creating it.\n    if (!FileExists(filePath))\n\
    \    {\n        returnValue = MakeTestFile(filePath);\n\n        if (returnValue\
    \ != 1)\n            return returnValue;\n    }\n\n    printf(\"Printing file\
    \ %s:\\n\",filePath);\n\n    // We got this far, so it's safe to print the file\n\
    \    FILE *file = fopen(filePath,\"r\");\n\n    if (!file || ferror(file))\n \
    \   {\n        fprintf(stderr,\"Couldn't print the file %s\\n\",filePath);\n \
    \       return 0;\n    }\n\n    char inString[1024];\n\n    // fgets will return\
    \ a NULL pointer when it reaches the end of the\n    // file, so this little loop\
    \ will print the entire file and quit\n    // at its end.\n    while (fgets(inString,1024,file))\n\
    \        fprintf(stdout,\"%s\",inString);\n\n    fclose(file);\n\n    return 0;\n\
    }\n```\n\nWhew! This is our longest example yet. It’s also our closest code to\
    \ a \"real\" program. Some idioms, like `if (!file)`, are very common to C and\
    \ C++ programming, so get used to seeing them. Read over the code in this example\
    \ and make sure that you understand what each line does.\n"
