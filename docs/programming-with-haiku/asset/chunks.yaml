    # Lesson 15


    Now that we’ve written our first working – albeit simple – GUI application for
    Haiku, we will start learning the fundamentals of what is considered the Haiku
    API.


    ## Overview of the Haiku API


    All of the operating system libraries that are available to us are organized into
    categorized groups called kits. Some of these kits have a server associated with
    them. Some do not. The majority of Haiku programs work with the kits and little
    else, although device drivers work directly with the hardware and mostly call
    kernel functions. A layout of Haiku as an operating system and its "layers" looks
    a little like this:


    As of this writing the official kits are the following:


    In addition to these official kits, there are also two other which are under development
    and considered experimental: the `Layout Kit` and the `Locale Kit`. If this seems
    like a lot, it’s because it is, but depending on the kinds of programs that you
    write you may never have to deal with certain kits. We’ll look at some of the
    kits in detail later on, but for now, we will focus primarily on the `Application`,
    `Interface`, and `Support` kits.


    ### Application Kit


    The Application Kit is small, but vital. The focus centers around `BMessage`,
    the means for communication within a program and between programs, and `BApplication`,
    which must be subclassed to write a program which uses `BMessages[¹]`.


    ### Device Kit


    The Device Kit provides classes for certain hardware. Because there are only two
    classes in this kit, it is not generally used, but it may expand in future versions
    of Haiku.


    ### Game Kit


    The Game Kit goes with the assumption that game programmers pretty much want to
    be given direct access to the section of memory used to display the screen – the
    video buffer – and then left alone to work their dark arts. Also here are some
    classes to make playing game sounds simple for game writers.


    ### Interface Kit


    To an applications programmer, the Interface Kit is as important as it is big.
    Windows, buttons, checkboxes, and more appear under its umbrella. Printing is
    also handled by this kit.


    ### Kernel Kit


    The Kernel Kit is the only kit which is not a collection of C++ classes. Instead,
    it consists of low-level C function calls.


    ### Mail Kit


    The Mail Kit is for constructing and sending e-mails. There’s not very much else
    to say about it.


    ### Media Kit


    The Media Kit is all about audio and video processing. Haiku is especially good
    at playing and recording audio and video with a minimum of `latency`, or lag.


    ### MIDI Kit


    MIDI stands for **M**usical **I**nstrument **D**igital **I**nterface, a standard
    established in the ages of yore which defines how to get musical instruments to
    communicate with computers. The MIDI kit handles MIDI data just as the Media Kit
    is all about video and audio processing.


    ### Network Kit


    If you come from a UNIX-based programming background, you are probably accustomed
    to using C function calls for networking. The Network Kit’s classes approach communications
    coding from a slightly friendlier perspective.


    ### OpenGL Kit


    If you’re into 3D graphics, this is the kit for you. There is only one class,
    `BGLView`, but it opens the door to incorporating OpenGL graphics into your applications.


    ### Storage Kit


    The Storage Kit provides friendly ways of working with the filesystem. In addition
    to reading and writing files, there are also classes for reading directories,
    running queries, and working with attributes.


    ### Support Kit


    This kit is designed to support other kits with helper classes. `BString`, `BList`,
    and `BLocker` are especially helpful and are very commonly used.


    ### Translation Kit


    The Translation Kit is one of Haiku’s innovations. It provides a single interface
    for reading and writing pictures and text without having to understand the underlying
    file formats. For us programmers, it makes life much, much easier.


    ## Event-Based Programming


    Writing a program for the console is pretty simple in that you, the developer,
    control the flow of execution. The same cannot be said for the GUI, with the reason
    that such programs are an interaction between the user and your program. The user
    does something and your program responds. Something strange happens in the system
    and your program alerts the user. Your code becomes a set of responses to different
    events. Much of this amounts to sending messages and handling any that come in.


    An example of event-based programming is responding to the mouse. If the user
    clicks on a window’s close button, the system will notify your program that the
    user is requesting the window to close. It’s your job to do something about the
    request. When the user clicks a button, it sends a message. Who gets the message
    and what is done in response is up to you.


    ### Haiku Messaging


    A great deal of the communication that takes place within Haiku as an operating
    system centers around sending and handling messages. Most of the classes in the
    Application Kit center around messaging. Even though we won’t use all of these
    right away, let’s just take a quick peek at each of the classes in the kit:


    *   `BApplication` – The application class. It is also the main channel for communications
    between your program and the rest of the system.

    *   `BClipboard` – `BClipboard` handles storing information on a clipboard. The
    clipboard itself uses the `BMessage` class for storing and exchanging data with
    programs.

    *   `BCursor` – Not related to messaging, but `BCursor` takes care of changing
    what the mouse pointer looks like.

    *   `BHandler` – A class which is used to take appropriate actions for messages.

    *   `BInvoker` – a message-sending class used for controls such as buttons and
    checkboxes. Give it a message to send and a target to send messages to and it
    will send a copy of the message given to it each time its `Invoke()` method is
    called.

    *   `BLooper` – `BLooper` receives messages and passes them through a series of
    `BHandlers` before handling a message. It might sound confusing now, but it won’t
    later on.

    *   `BMessage` – The type of object sent around the system for communications.
    It has an identifier property, `what`, and methods for attaching and retrieving
    data and for sending replies.

    *   `BMessageFilter` – A class used for filtering out desired – undesired – messages.

    *   `BMessageQueue` – `BMessageQueue` stores messages in a first-in, first-out
    fashion. It is primarily used by `BLooper` instances to temporarily hold messages
    while it is handling others. own*   `BMessageRunner` – This class sends messages
    at a specified interval.

    *   `BMessenger` – `BMessenger` is a message-sending class. It can send messages
    to `BHandlers` and `BLoopers` regardless of whether they are in your program or
    in another.

    *   `BPropertyInfo` – Scripting is the purpose behind `BPropertyInfo`. If you’re
    not enabling your program from outside, you won’t need this one often, if ever.

    *   `BRoster` – The `BRoster` class communicates with the system’s application
    roster daemon. It is used for sending messages to all programs running in the
    system, launching programs, or for checking if a particular program is running.


    Of all of these classes, the ones that are used in the course of regular applications
    programming are `BLooper`, `BInvoker`, `BMessage`, `BHandler`, and `BApplication`,
    so what seems like a lot to remember isn’t really very much, especially when you
    consider that a few methods of each of these classes are used frequently.


    Reacting to most events in Haiku programming boils down to one function: `MessageReceived()`.
    It is a hook function, that is, a virtual function intended to be implemented
    by child classes to react to an event. In this case, `MessageReceived()` is implemented
    by child classes to handle messages that are not already handled by the parent
    class. Any child class of `BHandler`, including `BLooper`, `BApplication`, `BWindow`,
    and `BView`, have this hook function. Most of the time, it will look like this:


