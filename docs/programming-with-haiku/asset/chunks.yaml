    }\n}\n\nvoid PrintDeck(card *deck, const uint8 &numCards)\n{\n    // 按照 '2h 5c\
    \ Jc' 的格式打印牌组。它们\n    // 全部打印在同一行，如果终端窗口太小无法\n    // 在一行内显示完，可能会换行到第二行。\n    for\
