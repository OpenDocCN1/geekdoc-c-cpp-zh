  trans: "\n\n现在我们已经准备好了所有的基础代码，请构建一次，以确保你没有写错任何内容。如果出现错误，请仔细检查上面的源码并修复拼写错误。一旦一切都编译通过，就运行它。假设一切运行正常，关闭它并进入后续有趣的内容。\n\
    \n## 添加视图\n\n窗口控件都是派生自 `BView` 类的对象。如果你快速浏览一下 `/boot/develop/headers/os/interface/View.h`，你会看到这是一个庞大且复杂的类，包含很多方法。幸运的是，在目前我们不需要了解太多的方法。下面的\
    \ `BView` 将是我们的彩色框。将此代码添加到 `MainWindow` 构造函数中：\n\n```cpp\nMainWindow::MainWindow(void)\n\
    \    :   BWindow(BRect(100,100,500,400),\"MenuColors\",B_TITLED_WINDOW,\n    \
    \            B_ASYNCHRONOUS_CONTROLS | B_QUIT_ON_WINDOW_CLOSE)\n{\n    BView *view\
    \ = new BView(BRect(100,100,300,200), \"colorview\",\n                 B_FOLLOW_ALL,\
    \ B_WILL_DRAW);\n    AddChild(view);\n    view->SetViewColor(0,0,160);\n}\n```\n\
    \n这段代码非常简单。第一行创建了一个新的 `BView`，其左上角位于 (100,100)，右下角位于 (300,200)。它的名字为 \"colorview\"\
    ，并且当窗口大小改变时会自动调整自己的大小。末尾的 `B_WILL_DRAW` 标志告诉窗口它将执行自己的绘制。如果没有这个标志，这个 `BView` 将仅仅是一个空白的白色方框。第二行将视图挂载到窗口上。最后一行将\
    \ `BView` 的颜色设置为深蓝色。编译你的项目并查看效果如何。\n\n在 Haiku 中向窗口中添加控件并没有太大区别。大多数控件都有一个构造函数，需要相同类型的信息，可能还需要一个消息，但没有其他太多要求。其他控件也是以相同的方式添加到窗口的。密切关注我们使用的方法，你会发现这些类之间有许多相似之处。\n\
    \n## 添加菜单\n\n除了弹出菜单外，Haiku 中的菜单通常保留在某种菜单容器中。Haiku API 提供了两个菜单容器：`BMenuField` 和\
    \ `BMenuBar`。我们现在忽略 `BMenuField` 并专注于 `BMenuBar`。将构造函数代码更改为：\n\n```cpp\nMainWindow::MainWindow(void)\n\
    \    :   BWindow(BRect(100,100,500,400),\"MenuColors\",B_TITLED_WINDOW,\n    \
    \            B_ASYNCHRONOUS_CONTROLS | B_QUIT_ON_WINDOW_CLOSE)\n{\n    // 这定义菜单栏的高度。Bounds()\
    \ 返回\n    // 窗口的大小。在这种情况下，矩形将是\n    // (0,0)-(200,100)。\n    BRect r(Bounds());\n\
    \    r.bottom = 20;\n    // r 中唯一有用的是高度。当我们向菜单栏\n    // 中添加项目时，它将扩展到我们在指定的高度内\n\
    \    // 填充窗口的宽度。\n    BMenuBar *menuBar = new BMenuBar(r,\"menubar\");\n    AddChild(menuBar);\n\
    \    BView *view = new BView(BRect(100,100,300,200), \"colorview\",\n        \
    \            B_FOLLOW_ALL, B_WILL_DRAW);\n    AddChild(view);\n    view->SetViewColor(0,0,160);\n\
    }\n```\n\n现在我们为彩色菜单准备了一个容器，可以创建菜单本身了。这需要三个组件：菜单、菜单中的项目以及每个菜单项的消息标识符。首先，让我们处理消息标识符。在文件顶部的\
    \ `#include` 语句之后添加这段代码：\n\n```cpp\nenum\n{\n    M_SET_COLOR_RED = 'sred',\n \
    \   M_SET_COLOR_GREEN = 'sgrn',\n    M_SET_COLOR_BLUE = 'sblu',\n    M_SET_COLOR_BLACK\
    \ = 'sblk'\n};\n```\n\n这段代码中唯一看起来奇怪的部分是单引号括的值。这又是那些花里胡哨的程序员技巧之一。消息常量是 32 位整数。每个字母都翻译成一个\
    \ 8 位值，因此 `'sred'` 实际上翻译成一个 32 位整数。老实说，只要值是唯一的，这些值本身其实并不重要，但按照惯例，它们被设置为这样的 4 字母常量。\n\
    \n常量本身可以放在类源文件的顶部，也可以放在在其头文件中。你通常会希望避免将标识符放在头文件中，这样添加消息标识符就不会强制重新编译多个文件。这个经验法则的例外是那些被多个类共同使用的消息。\n\
    \n现在消息标识符已经定义，让我们继续创建并填充菜单。代码看起来如下：\n\n```cpp\nMainWindow::MainWindow(void)\n\
    \    :   BWindow(BRect(100,100,500,400),\"MenuColors\",B_TITLED_WINDOW,\n    \
    \            B_ASYNCHRONOUS_CONTROLS | B_QUIT_ON_WINDOW_CLOSE)\n{\n    // 这定义菜单栏的高度。Bounds()\
    \ 返回\n    // 窗口的大小。在这种情况下，矩形将是\n    // (0,0)-(200,100)。\n    BRect r(Bounds());\n\
    \    r.bottom = 20;\n    // r 中唯一有用的是高度。当我们向菜单栏\n    // 中添加项目时，它将扩展到我们在指定的高度内\n\
    \    // 填充窗口的宽度。\n    BMenuBar *menuBar = new BMenuBar(r,\"menubar\");\n    AddChild(menuBar);\n\
    \n    // 这是创建并填充菜单的代码。\n    BMenu *menu = new BMenu(\"Colors\");\n    menu->AddItem(new\
    \ MenuItem(\"Red\", M_SET_COLOR_RED));\n    menu->AddItem(new MenuItem(\"Green\"\
    , M_SET_COLOR_GREEN));\n    menu->AddItem(new MenuItem(\"Blue\", M_SET_COLOR_BLUE));\n\
    \    menu->AddItem(new MenuItem(\"Black\", M_SET_COLOR_BLACK));\n    menuBar->AddMenu(menu);\n\
    \n    BView *view = new BView(BRect(100,100,300,200), \"colorview\",\n       \
    \             B_FOLLOW_ALL, B_WILL_DRAW);\n    AddChild(view);\n    view->SetViewColor(0,0,160);\n\
    }\n```\n\n我们几乎完成了！如果你尝试运行项目并点击菜单，你会发现什么都没有发生。一切运行符合预期。当菜单项被点击时，它会向窗口发送一条消息，比如点击“红色”菜单项会向窗口发送\
    \ `M_SET_COLOR_RED` 消息。窗口接收了它但没有对其处理，因此只需要编写窗口接收每个菜单项消息的代码。\n\n```cpp\nvoid MainWindow::MessageReceived(BMessage\
    \ *msg)\n{\n    // FindView() 是 BWindow 方法，通过名称\n    // 搜索并返回其指针。\n    BView *view\
    \ = FindView(\"colorview\");\n    switch (msg->what)\n    {\n        case M_SET_COLOR_RED:\n\
    \        {\n            // 当窗口接收此消息时，我们将背景\n            // 设置为深红色\n          \
    \  view->SetViewColor(160,0,0);\n            // 调用 Invalidate() 强制视图重绘\n     \
    \       // 自己。\n            view->Invalidate();\n            break;\n        }\n\
    \        case M_SET_COLOR_GREEN:\n        {\n            view->SetViewColor(0,160,0);\n\
    \            view->Invalidate();\n            break;\n        }\n        case\
    \ M_SET_COLOR_BLUE:\n        {\n            view->SetViewColor(0,0,160);\n   \
    \         view->Invalidate();\n            break;\n        }\n        case M_SET_COLOR_BLACK:\n\
    \        {\n            view->SetViewColor(0,0,0);\n            view->Invalidate();\n\
    \            break;\n        }\n        default:\n        {\n            // 总是如此，默认值让\
    \ BWindow 的\n            // 方法处理我们不关心的消息\n            BWindow::MessageReceived(msg);\n\
    \            break;\n        }\n    }\n}\n```\n\n"
- fmt: "\n```\nWe’re done now! Run your project and you will see that our box changes\
    \ color when you click on one of the menu’s items. It really doesn’t take much\
    \ effort to put together a menu.\n\n## Going Further\n\nHere are some ideas you\
    \ can try if you’d like to tinker with it some more.\n\n1. Try changing the `B_FOLLOW_ALL`\
    \ resizing mode flag in the `BView` constructor to something else. Change it to\
    \ one of these and see what it does:\n    * `B_FOLLOW_LEFT | B_FOLLOW_TOP`\n \
    \   * `B_FOLLOW_LEFT_RIGHT | B_FOLLOW_TOP`\n    * `B_FOLLOW_RIGHT | B_FOLLOW_TOP`\n\
    \    * `B_FOLLOW_RIGHT | B_FOLLOW_BOTTOM`\n    * `B_FOLLOW_LEFT_RIGHT | B_FOLLOW_BOTTOM`\n\
    \    * `B_FOLLOW_RIGHT | B_FOLLOW_TOP_BOTTOM`\n2. Try adding more colors to your\
    \ menu\n3. Add a Quit item to the menu which sends the window a `B_QUIT_REQUESTED`\
    \ message.\n\n## Classes and Methods to Remember\n\n### BWindow\n\n* `BWindow(BRect\
    \ frame, const char *title, window_type type, uint32 flags, uint32 workspace =\
    \ B_CURRENT_WORKSPACE)` – Create a new window. While there are other types, right\
    \ now the window types to remember are `B_TITLED_WINDOW` and `B_DOCUMENT_WINDOW`.\n\
    * `void AddChild(BView *child)` – attaches a `BView` (or `BView` subclass) to\
    \ the window.\n* `BView * FindView(const char *name)` – Returns a pointer to a\
    \ `BView` named `name` or `NULL` if not found.\n* `BRect Bounds(void)` – Returns\
    \ the size of the window’s client area, i.e. the white area inside the window’s\
    \ frame.\n* `void Show(void)` – Shows the window.\n\n### BView\n\n* `BView(BRect\
    \ frame, const char *name, int32 resizeMode, int32 flags)` – Create a new view.\
    \ Check the `BView` section of the BeBook for all of the available resizing modes.\
    \ Don’t worry about the `flags` parameter just yet except to remember `B_WILL_DRAW`.\n\
    * `void SetViewColor(uint8 red, uint8 green, uint8 blue)` – Sets the background\
    \ color of the view.\n* `void Invalidate(void)` – Forces the `BView` to redraw\
    \ itself.\n* `void AddChild(BView *child)` – attaches a `BView` (or `BView` child\
    \ class) to the view.\n\n# Lesson 18\n\nWith buttons and menus out of the way,\
    \ we will start learning more about some of the other kinds of window controls\
    \ available to us, such as the following controls:\n\n| Control | Description\
    \ |\n| --- | --- |\n| BAlert | A pop-up message. They’re great for the occasional\
    \ error message, but they are also very easy to overuse and abuse. Use them sparingly.\
    \ |\n| BBox | A `BView` which draws a box around other child controls to visually\
    \ group related controls together. It also can optionally have a text label in\
    \ the top left corner. |\n| BButton | A button with a text label which sends a\
    \ message when clicked. |\n| BChannelSlider | A slider class which supports multiple\
    \ channels. It’s mostly used with the Media Kit. |\n| BCheckBox | A standard-issue\
    \ checkbox which can send a message when clicked. |\n| BColorControl | A customizable\
    \ color picker. The main drawback is that it takes up quite a lot of space. |\n\
    | BListView | A list of items. The items themselves are sufficiently customizable\
    \ to show just about anything but are often `BStringItems` to display a list of\
    \ names. |\n| BMenu | A container for menu items. |\n| BMenuBar | A container\
    \ for menus intended to be placed at the top of a window. |\n| BMenuField | A\
    \ button-like menu container which shows a pop-up menu. Getting them to resize\
    \ properly can be problematic. |\n| BMenuItem | A clickable item in a menu. |\n\
    | BOptionPopUp | A convenience class which quickly sets up a `BMenuField`. |\n\
    | BOutlineListView | A hierarchical list, but otherwise no different from `BListView`.\
    \ |\n| BPictureButton | A button which uses a `BPicture` vector graphic to draw\
    \ a picture for a label. They can be one-state buttons like `BButton` or two-state\
    \ buttons that stay down when clicked and pop back up when clicked again. |\n\
    | BPopUpMenu | A special type of menu that can be shown anywhere on the screen.\
    \ |\n| BRadioButton | The circular \"checkbox\" that enables the user to choose\
    \ one from several options. |\n| BScrollBar | A single scrollbar used to scroll\
    \ `BViews`. |\n| BScrollView | A convenience class for attaching scrollbars to\
    \ `BViews` and associated controls. |\n| BSeparatorItem | A menu item which displays\
    \ a horizontal line. They are used to separate groups of menu items. |\n| BSlider\
    \ | A highly-customizable horizontal slider. |\n| BStatusBar | A progress bar\
    \ class. |\n| BStringView | A static text label. |\n| BTabView | Group together\
    \ sheets of controls on tabs. It requires a little more care to use them than\
    \ what it might initially seem. |\n| BTextControl | A single line text editing\
    \ control. |\n| TextView | A multiline text editing control with limited word\
    \ processing capabilities. |\n| BView | The base class from which all controls\
    \ are derived. It has a lot of methods and it can be a little overwhelming. |\n\
    \nThat’s a lot of different classes! At first, it seems pretty overwhelming, but\
    \ it’s not too bad after a little tinkering, especially when you consider that\
    \ there is quite a bit they have in common. You might want to keep this table\
    \ handy for your first projects. We’re not going to look at every control in detail,\
    \ but the ones that we skip should be easy enough to pick up on your own.\n\n\
    ## Typecasting Revisited\n\nWay back in lesson 7 we learned about typecasting,\
    \ i.e. reinterpreting the data in a variable as a different type. One of the problems\
    \ with casting in C is that it isn’t safe – whenever you cast a variable, it always\
    \ succeeds. If you choose the wrong class to cast, it still succeeds, typically\
    \ with unpredictable results. C offers different kinds of casting. Even though\
    \ C typecasting methods require more typing, they should be preferred unless you’re\
    \ specifically writing code in C. Here they are:\n\n```\nstatic_cast<TypeToCastTo>(pointerToCast)\n\
    ```\n\nA `static_cast` is used to convert one type to another. It relies upon\
    \ compile-time information and is often used for the purposes that the regular\
    \ C casting method is used – changing pointer types and arithmetic conversions.\
    \ It works so long as the language supports the conversion between the two types.\n\
    \n```\ndynamic_cast<TypeToCastTo>(pointerToCast)\n```\n\nAside from static casts,\
    \ dynamic casts will be one of your most frequently-used cast types when working\
    \ with Haiku. They are used to safely navigate an inheritance hierarchy. If no\
    \ inheritance links together the \"from\" type and the \"to\" type, *NULL* will\
    \ be returned instead. Thus, you can cast to only those pointer types you’re supposed\
    \ to be able cast. We will use one of these in today’s project.\n\n```\nconst_cast<TypeToCastTo>(pointerToCast)\n\
    ```\n\nConst casting adds or removes the changeability of a pointer. For example,\
    \ there are instances where a function will take a non-const parameter that it\
    \ doesn’t change. Passing a constant pointer to one of these functions will require\
    \ a const cast.\n\n```\nreinterpret_cast<TypeToCastTo>(pointerToCast)\n```\n"
