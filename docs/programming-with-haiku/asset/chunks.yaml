  trans: "\n\n## 进阶\n\n根据我们现在对接口包（Interface Kits）和存储包（Storage Kits）的了解，有很多可能性可以实现。你可能想回去扩展之前的项目，并看看你能用它做什么。如果你还没有尝试过启动自己的项目，现在可能是一个认真考虑它的时机了。如果没有，很快我们将花费超过一节课来完成一个现实世界中这种规模的项目，以便将学到的所有内容联系起来。\n\
    \n# 第 21 节\n\n我们一直进行的所有项目都是小项目，没有花费多少时间。取决于复杂性，现实世界的编程项目开发可能需要几个月甚至更久。今天，我们将开始着一个项目，与现有的许多\
    \ Haiku 程序相比它很小，但将花费我们超过一节课才能完成。\n\n##作业\n\n我们的项目将是一个相对简单的项目。在 UNIX 存在以来，一直有一个名为\
    \ `fortune` 的命令，它会显示某种幽默的格言。它通常在用户登录时运行。我们将编写一个 fortune 程序，它将显示一个窗口而不是在 `Terminal`（终端）中打印。它还将对原始版本进行改进，因为我们不会将其局限于一个\
    \ fortune 文件。相反，它将从 `fortunes` 目录中随机选择一个文件，并从文件中随机选择一个条目。我们还将让用户在需要时轻松获取多个 fortune。\n\
    \n我们将代码分为两个主要部分：GUI 和获取 fortune 的代码。fortune 代码将是一个类，负责从 fortune 目录中选择 fortune\
    \ 文件，从文件中获取随机条目，并将其作为字符串返回。GUI 将包含一个用于显示 fortune 多行文本框、一个关闭程序的按钮、另一个获取另一个 fortune\
    \ 的按钮，以及用于显示程序作者和版本的关于按钮。这种基于任务的代码分离是一种良好的实践，可以提高代码的可用性。\n\n## BFile：让文件乖起来\n\n\
    嗯，也许我们不能让文件像狗一样，但 `BFile` 类是一个非常有用的类，它为我们提供了一个可以对文件进行几乎操作的地方：创建文件以及读取、写入、追加甚至擦除数据，因为它继承自\
    \ `BNode`，我们还可以添加、删除或更改属性。对于不熟悉的人来说，属性（attributes）是 BeOS 的特性：关于文件的数据但不属于文件本身的数据，但那是另一节课的内容。以下是我们通过\
    \ `BFile` 可以使用的最常用方法列表：\n\n### BFile 方法\n\n| 方法 | 说明 |\n| --- | --- |\n| `status_t\
    \ GetSize(off_t *size) const;` | 获取文件的大小并将值放入 `size` 中。 |\n| `ssize_t Read(void\
    \ *buffer, size_t size);` | 尝试将 `size` 字节读取到 `buffer`。返回实际读取的字节数。 |\n| `ssize_t\
    \ Write(const void *buffer, size_t size);` | 尝试将 `size` 字节写入 `buffer`。返回实际写入的字节数。\
    \ |\n| `off_t Seek(off_t offset, int32 seekMode);` | 将读写指针移动到文件中的不同位置。`seekMode`\
    \ 可以是 `SEEK_SET`、`SEEK_CUR` 或 `SEEK_END`。这些这些模式分别相对于文件开头、当前位置或文件末尾移动指针。 |\n| `off_t\
    \ Position() const;` | 返回读写指针相对于文件开头的位置。 |\n| `status_t SetTo(const char *path,\
    \ uint32 openMode);` | 将 `BFile` 对象设置为 `path` 中指定的路径。该方法还有其他版本。更多关于该方法的请见下文。 |\n\
    | `void Unset();` | 清空 `BFile` 对象，释放任何使用的文件句柄。此方法在 `BFile` 对象销毁时自动调用。 |\n| `status_t\
    \ InitCheck() const;` | 返回 `BFile` 的当前错误状态。 |\n\n将 `BFile` 设置到某个位置不仅仅是给它一个文件路径。实际上有四种版本的\
    \ `SetTo()`。它们接受一个打开模式以及一个包含路径的字符串、一个 `BEntry`、一个 `entry_ref` 或一个带有字符串相对路径的 `BDirectory`。打开模式是以下标志的组合，包括读取模式或写入模式：\n\
    \n### BFile 标志\n\n| 模式标志 | 说明 |\n| --- | --- |\n| `B_READ_ONLY` | `BFile` 可以从文件中读取，但不能写入文件。\
    \ |\n| `B_WRITE_ONLY` | `BFile` 可以写入文件，但不能从文件中读取。 |\n| `B_READ_WRITE` | `BFile`\
    \ 可以从文件读取并写入文件。 |\n| `B_CREATE_FILE` | 如果文件不存在则创建文件。 |\n| `B_FAIL_IF_EXISTS` |\
    \ 强制创建新文件，如果已存在则失败。 |\n| `B_ERASE_FILE` | 如果文件存在，擦除其数据和属性。 |\n| `B_OPEN_AT_END`\
    \ | 将读写指针设置为文件的末尾。 |\n\n`BFile` 的构造函数具有与其相应的 `SetTo()` 调用相同的参数，但它们不返回任何值。\n\n\
    使用 BFile 读取和写入文件\n\n`BFile` 让读取变得简单。`Read()` 需要一个缓冲区来接收来自文件的数据。处理文件时可能会出现问题。这里是使用\
    \ `BFile` 读取文件的方法：\n\n```cpp\nstatus_t\nReadFile(const char *path)\n{\n    if\
    \ (!path)\n        return B_BAD_VALUE;\n\n    // 创建一个缓冲区来持有文件数据\n    \n    //\
    \ 设置文件以读取\n    BFile file(\"/boot/home/Desktop/MyFile.txt\", B_READ_ONLY);\n\n\
    \    if (file.InitCheck() != B_OK)\n    {\n        printf(\"无法读取文件\\n\");\n  \
    \      return B_ERROR;\n    }\n\n    off_t fileSize = 0;\n    file.GetSize(&fileSize);\n\
    \n    if (fileSize < 1)\n    {\n        printf(\"文件为空，没有数据可读\\n\");\n        return\
    \ B_OK;\n    }\n\n    // 创建一个 BString 来持有数据\n    BString fileData;\n\n    // 我们不能直接将\
    \ BString 传递给 Read()，所以使用 BString 方法 LockBuffer() 获取内部存储的指针。在 BString 锁定期间，我们无法使用它的任何方法，但可以对它使用的字符串数组进行任何更改。LockBuffer()\
    \ 接收预期的数组最大整数。我们会留一些空间以防意外崩溃。\n    char *buffer = fileData.LockBuffer(fileSize\
    \ + 10);\n\n    // Read() 会返回实际读取的字节数，但我们将忽略这个值\n    // 因为我们正在读取整个文件。\n    file.Read(buffer,\
    \ fileSize);\n\n    // 解锁 BString 以便再次使用它的方法。\n    fileData.UnlockBuffer();\n\n\
    \    return B_OK;\n}\n```\n\n写入文件更加简单。`Write()` 的参数与 `Read()` 相同，但它不是从文件拷贝到缓冲区，而是从缓冲区拷贝到文件。\n\
    \n```cpp\nvoid\nWriteFile(const char *path)\n{\n    if (!path)\n    {\n      \
    \  printf(\"向 WriteFile 发送了 NULL 路径\\n\");\n        return B_BAD_VALUE;\n    }\n\
    \n    // 如果需要，创建文件并使其可读可写\n    BFile file(path, B_READ_WRITE | B_CREATE_FILE);\n\
    \n    if (file.InitCheck() != B_OK)\n    {\n        printf(\"无法写入文件 %s\\n\", path);\n\
    \        return B_ERROR;\n    }\n\n    char testString[] = \"这是一些文件数据。\\n 它并不真的\"\
    \n                \"重要。\\n\";\n    file.Write(testString,strlen(testString));\n\
    \n    return B_OK;\n}\n```\n\n"
- fmt: "\n# Starting Our Project: HaikuFortune\n\n*   Open `Paladin` and create a\
    \ new project using the GUI with `MainWindow` template.\n*   Press `Alt+N` or\
    \ choose `Add New File` from the Project menu and create a file called `FortuneFunctions.cpp`.\
    \ Make sure that you check the box to also create a corresponding header file.\n\
    \nThe first thing we’re going to do is design the class which will get the fortune\
    \ from the `fortune` directory.\n\n```cpp\n#ifndef FORTUNEFUNCTIONS_H\n#define\
    \ FORTUNEFUNCTIONS_H\n\n#include <List.h>\n#include <String.h>\n\nclass FortuneAccess\n\
    {\npublic:\n            FortuneAccess(void);\n            FortuneAccess(const\
    \ char *folder);\n            ~FortuneAccess(void);\n\n    status_t    SetFolder(const\
    \ char *folder);\n    status_t    GetFortune(BString &target);\n    int32    \
    \   CountFiles(void) const;\n    status_t    LastFilename(BString &target);\n\n\
    private:\n\n    void        ScanFolder(void);\n    void        MakeEmpty(void);\n\
    \    BString fPath, fLastFile;\n    BList       fRefList;\n};\n\n#endif\n```\n\
    \nThere is a reason for each method that we have in this class. First, both versions\
    \ of the constructor are for convenience in creating a `FortuneAccess` object\
    \ regardless of whether or not we know the folder we want to scan when the object\
    \ is instantiated. `SetFolder()` allows us to change folders, should we have the\
    \ desire. `GetFortune()` is the main reason we’re creating the class in the first\
    \ place: a reusable object which randomly gets a fortune from a specified folder.\
    \ `CountFiles()` tells us how many files are available. `LastFilename()` gives\
    \ us the name of the file from which the most recent fortune came. `ScanFolder()`\
    \ runs through a directory and compiles a list of available files that – theoretically\
    \ – have fortunes in them.\n\n`MakeEmpty()` is a cleanup function which deserves\
    \ a little extra explanation. The list of filenames in the `fortune` folder that\
    \ we set is kept as a collection of `entry_ref` objects in a `BList`. There are\
    \ two problems with `BList`: we have to `static_cast` any time we access an object\
    \ it holds, and while the `BList` takes care of any memory allocation it does\
    \ internally, any items we give to it are not destroyed when the list is freed.\
    \ This means that we have to manually go through the list, get each item, and\
    \ free it ourselves. It’s a pain in the neck, but, unfortunately, it’s all that\
    \ we have at the moment. There are better solutions out there, but that’s for\
    \ another time. This will work well enough for our purposes right now.\n\nBelow\
    \ is the skeleton code for our class along with what each function needs to do.\
    \ Your job is to write the code.\n\n```cpp\n#include \"FortuneFunctions.h\"\n\
    #include <Directory.h>\n#include <Entry.h>\n#include <File.h>\n#include <OS.h>\n\
    #include <Path.h>\n#include <stdio.h>\n#include <stdlib.h>\n#include <string.h>\n\
    \n// Initialize the global path to a hardcoded value just in case.\n// This happens\
    \ to be different under Haiku than under previous versions\n// of BeOS\nBString\
    \ gFortunePath = \"/boot/system/data/fortunes\";\n\nFortuneAccess::FortuneAccess(void)\n\
    {\n}\n\nFortuneAccess::FortuneAccess(const char *folder)\n{\n    SetFolder(folder);\n\
    }\n\nFortuneAccess::~FortuneAccess(void)\n{\n    // Free all items in our list\n\
    }\n\nstatus_t\nFortuneAccess::SetFolder(const char *folder)\n{\n    // Make sure\
    \ that folder is valid and return B_BAD_VALUE if it\n    // isn't. Set the path\
    \ variable, scan the folder, and return B_OK\n}\n\nstatus_t\nFortuneAccess::GetFortune(BString\
    \ &target)\n{\n    // Here's the meat of this class:\n    // 1) Return B_NO_INIT\
    \ if fPath is empty\n    // 2) Return B_ERROR if the ref list is empty\n    //\
    \ 3) This line will randomly choose the index of a file in the ref\n    // list.\n\
    \    int32 index = int32(float(rand()) / RAND_MAX * fRefList.CountItems());\n\
    \    // 4) Get a pointer to the randomly-selected entry_ref.\n    // 5) Create\
    \ and initialize a BFile object in read-only mode.\n    // 6) Check to make sure\
    \ that the BFile's status is B_OK.\n    // 7) Set fLastFile to the name property\
    \ of the ref we just chose.\n    // 8) Get the file's size.\n    // 9) If the\
    \ file is empty, return B_ERROR.\n    // 10) Create a BString to hold the data\
    \ in the file.\n    // 11) Create a char pointer that we'll use in BFile::Read.\n\
    \    // 12) Initialize the pointer using BString::LockBuffer, passing\n    //\
    \  the file's size + 10 bytes (for safety) as the size.\n    //  LockBuffer temporarily\
    \ gives you access to the BString's\n    //  internal char array. We'll need this\
    \ to be able to read the\n    //  file's data into the BString.\n    // 13) Use\
    \ BFile::Read() to read the entire file using our new char\n    //  pointer.\n\
    \    // 14) Call BString::UnlockBuffer() to invalidate our char pointer\n    //\
    \  and allow us to use regular BString methods again.\n    // 15) Use a loop to\
    \ manually count the number of record separators\n    //  in the fortune file.\
    \ The separator is the string \"%\\n\", so\n    //  use a   combination of BString::FindFirst\
    \ and offsets in a loop\n    //  to count them.\n    // 16) Use this line to randomly\
    \ choose an entry.\n    int32 entry = int32(float(rand()) / RAND_MAX * (entrycount\
    \ - 1));\n    // 17) Use FindFirst again to find the starting offset of this\n\
    \    //  randomly-chosen entry in the file.\n    // 18) Call FindFirst one last\
    \ time to find the offset of the next\n    //  separator so we know how long the\
    \ fortune is.\n    // 19) Create a BString to hold the fortune.\n    // 20) Set\
    \ this new BString to the String() method plus the\n    //  starting offset of\
    \ the BString holding the file data.\n    //  This will effectively chop out everything\
    \ is before\n    //  fortune in the file.\n    // 21) Chop off everything after\
    \ our fortune in the BString\n    //  by calling its Truncate() method.\n    //\
    \  Hint: length = endingOffset – startingOffset + 2\n    // 22) Set the target\
    \ parameter to our fortune data and return\n    //  B_OK.\n}\n\nvoid\nFortuneAccess::ScanFolder(void)\n\
    {\n    // Use a BDirectory for this. Make sure that it is initialized from\n \
    \   // fPath properly. Empty the ref list so that we're not adding to\n    //\
    \ an existing list. Use BDirectory::GetNextEntry to get the entry\n    // for\
    \ each file in the folder. Use the BEntry to check to make\n    // sure that the\
    \ entry is a file, and, assuming so, make a new\n    // entry_ref, send it to\
    \ BEntry::GetRef, and add it to our ref\n    // list.\n}\n\nvoid\nFortuneAccess::MakeEmpty(void)\n\
    {\n    // Iterate through the ref list and delete each entry_ref. After\n    //\
    \ doing this, call BList::MakeEmpty().\n}\n\nint32\nFortuneAccess::CountFiles(void)\
    \ const\n{\n    return fRefList.CountItems();\n}\n\nstatus_t\nFortuneAccess::LastFilename(BString\
    \ &target)\n{\n    // Return B_NO_INIT if the path variable is empty\n    // Set\
    \ the target parameter to our fLastFile property and return\n    // B_OK\n}\n"
