    \  string[26] = 0;\n\n    printf(\"%s\\n\",string);\n\n    // 这里是另一种方法：使用指针和数学运算\n\
    \    for (int i = 0; i < 26; i++)\n    {\n        char *index = string + (i *\
    \ sizeof(char));\n\n        // 使用大写 A 只是为了体现不同\n        *index = 'A' + i;\n  \
    \  }\n\n    string[26] = 0;\n\n    printf(\"%s\\n\",string);\n}\n```\n\n这两个循环执行的是完全相同的事情，除了第二个循环使用了大写字母。不过，第二个循环的代码看起来非常奇怪，让我们让我们拆解它，从\
    \ `sizeof()` 开始。`sizeof()` 是一个像函数一样的语言特性。它可以接收一个变量或类型名称，并返回该类型对象在内存中占用的字节数（bytes）。例如，`char`\
    \ 对象只有 1 字节大，而 `int` 占用 4 字节。给 `sizeof()` 传入数组，它将返回整个数组占用的内存量。因为 `char` 的大小是 1，我们完全可以跳过乘法，但养成避免此类假设的习惯是个好主意。这样你就会少长白头发。\n\
    \n我们在上面的代码中看到的下一个奇怪技巧是给指针加上一个数字。指针只是包含内存地址的变量，因此给指针加一个整数只是改变了内存地址。我们不能改变数组的地址，所以我们创建了一个可以更改的指针。这允许我们对其加上数组元素的大小。随着循环进行，指针将持有数组中每个字符的地址。\n\
