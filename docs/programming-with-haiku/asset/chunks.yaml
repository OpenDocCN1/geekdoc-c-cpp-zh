    \ code. Work slowly through this heavily-commented example to get a good handle\
    \ on it all.\n\n```c\n#include <stdio.h>\n\n// A new include! This one has a bunch\
    \ of functions just for working with strings\n#include <string.h>\n\nint main(void)\n\
    {\n    // Declare a string, aka an array of the char type\n    char string[30];\n\
    \n    // Fill the string with 0's. While it might not seem intuitive to include\n\
    \    // a \"memory\" function in string.h, it's often used for purposes like this.\n\
    \n    // memset: sets the value of all bytes in a block of memory to a\n    //\
    \ particular value\n    // usage: memset(anArray, valueToAssign, sizeOfTheArray);\n\
    \n    // This call sets everything in our array to 0\n    memset(string,0,30);\n\
    \n    // Another way to set values of characters in a string: as an array. Here\
    \ we\n    // individually set the characters. A capital letter A has an integer\
    \ value\n    // of 65.\n    for (char i = 0; i < 26; i++)\n        string[i] =\
    \ 65 + i;\n\n    printf(\"String contains: %s\\n\", string);\n\n    // Yet *another*\
    \ way to set a string's value. sprintf() -- think\n    // \"string printf\" --\
    \ prints to a string instead of the screen, but\n    // otherwise works the same\
    \ as printf(). Just be careful that what is\n    // printed isn't larger than\
    \ the string that you're printing to. If it is,\n    // your program will happily\
    \ crash into bits.\n    // usage: sprintf(aStringVariable,formatString, argumentList)\n\
    \    sprintf(string, \"%f\", 3.1415927);\n\n    // %s is the placeholder for a\
    \ string in printf();\n\n    printf(\"String changed. Now it contains: %s\\n\"\
    , string);\n\n    return 0;\n}\n```\n\nThe `%s` is the placeholder for a string\
    \ in `printf()`.\n\n`printf(\"String changed. Now it contains: %s\\n\", string);`\n\
    \n`return 0;`\n\n`memset()` marks the string's end. Whew! That was a lot of stuff\
