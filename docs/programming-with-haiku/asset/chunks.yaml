    1. 继承（Inheritance）是通过扩展另一个类来创建类的实践。

    2. 私有方法和属性可以在类内部访问。受保护的方法和属性可以通过类的方法及其子类的方法访问。

    3. 虚函数（`virtual` function）是可以被子类重新定义其行为的函数。

    4. 静态函数（`static` function）不需要类实例即可调用的函数。

    5. 函数重载（Function overloading）是声明并实现多个具有相同名称但参数列表不同的函数的实践。

    6. 受保护继承强制父类的公共方法和属性在子类中变为受保护访问，限制了外部访问，但允许类的方法及其子类的方法访问。

