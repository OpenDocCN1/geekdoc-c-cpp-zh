    \        case M_BUTTON_CLICKED:\n\n        {\n\n            fCount++;\n\n    \
    \        BString labelString(\"Clicks: \");\n\n            // This converts fCount\
    \ to a string and appends it to\n\n            // the end of labelString. More\
    \ on this next lesson.\n\n            labelString << fCount;\n\n            //\
    \ Set the window's title to the new string we've made\n\n            SetTitle(labelString.String());\n\
    \n            break;\n\n        }\n\n        default:\n\n        {\n\n       \
    \     // If the message doesn't match one of the ones we\n\n            // explicitly\
    \ define, it must be some sort of system\n\n            // message, so we will\
    \ call the BWindow version of\n\n            // MessageReceived() so that it can\
    \ handle them. THIS\n\n            // IS REQUIRED if you want your window to act\n\
    \n            // the way that you expect it to.\n\n            BWindow::MessageReceived(msg);\n\
    \n            break;\n\n        }\n\n    }\n\n}\n\n```\n\nThe main part of this\
    \ program centers around the *M_BUTTON_CLICKED* case. When our button is added\
    \ to the window, it sets the window as the target for its messages so that every\
    \ time the button is clicked the window will receive a *M_BUTTON_CLICKED* message.\
    \ When the window receives the button’s message, it increments the member variable\
    \ *fCount* and uses it to generate a new title.\n\nCreating the title isn’t difficult,\
    \ especially if we use the *BString* class. The C way of doing it would be by\
    \ allocating a string big enough to hold the title and then using *sprintf()*,\
    \ but *BString* was designed to make working with strings in C++ a lot easier.\
    \ Memory allocation is handled for us, and there are methods which combine strings,\
    \ return the length, and much more. The *labelString << fCount* converts *fCount*\
    \ into a string and tacks it onto the end of the string held by *labelString*.\n\
    \nThe rest of the code kept in App.h and App.cpp is almost exactly the same as\
    \ it was in the last lesson. The main difference is that App.cpp includes MainWindow.h.\
    \ By including it, we have the definition for the MainWindow class and we can\
    \ allocate and show one.\n\n```\n\n// App.h\n\n#ifndef APP_H\n\n#define APP_H\n\
    \n#include <Application.h>\n\nclass App : public BApplication\n\n{\n\npublic:\n\
    \n    App(void);\n\n};\n\n#endif\n\n```\n\n```\n\n// App.cpp\n\n#include \"App.h\"\
    \n\n#include \"MainWindow.h\"\n\nApp::App(void)\n\n  : BApplication(\"application/x-vnd.test-ClickMe\"\
    )\n\n{\n\n    MainWindow *mainwin = new MainWindow();\n\n    mainwin->Show();\n\
    \n}\n\nint\n\nmain(void)\n\n{\n\n    App *app = new App();\n\n    app->Run();\n\
    \n    delete app;\n\n    return 0;\n\n}"
