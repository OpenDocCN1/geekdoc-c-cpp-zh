    // loops is repeated and nothing else.\n\nfor (uint8 i = 0; i < shuffleCount;\
    \ i++)\n{\n    // We shuffle the deck by swapping items in the array. It's a\n\
    \    // little like the ReverseString function from Lesson 7, but\n    // we choose\
    \ random items in the array to swap. The more swaps\n    // we do, the better\
    \ the shuffle, especially with larger decks,\n    // so base the number of swaps\
    \ on the size of the deck.\n    // ceil() rounds a floating point number up, regardless\
    \ of\n    // how big the fractional part of the number is. It returns a\n    //\
    \ double, so we will need to typecast it to a `uint16` to stop\n    // the compiler\
    \ from complaining. Casting floats and doubles\n    // to integers drops the fractional\
    \ part, but because we've\n    // rounded that part off using ceil(), we're not\
    \ losing\n    // anything by doing so.\n    uint16 swapCount = uint16(ceil(numCards\
    \ * 1.25));\n    for (uint16 j = 0; j < swapCount; j++)\n    {\n        // rand()\
    \ generates a kind-of-random number between 0\n        // and the defined constant\
    \ RAND_MAX, which is at least\n        // 32767\\. To make a random number, use\
    \ the formula\n        // randomValue = rand() % rangeOfValues + minimumValue;\n\
    \        // so making a value from 5 to 12 would be\n        // rand() % 7 + 5;\n\
    \        // Here we randomly select the indexes for two cards in\n        // the\
    \ deck\n        uint8 firstIndex = uint8(rand() % numCards);\n        uint8 secondIndex\
    \ = uint8(rand() % numCards);\n        if (firstIndex == secondIndex)\n      \
    \  {\n            // If the two indexes are the same, we don't want\n        \
    \    // to waste this swap. Because j is incremented\n            // every time\
    \ we go back to the top of the loop,\n            // we decrement j to counteract\
    \ it and get\n            // another shot at making a good swap.\n           \
    \ j--;\n            continue;\n        }\n        // Do the card swap\n      \
    \  card tempCard;\n        tempCard.value = deck[firstIndex].value;\n        tempCard.suit\
    \ = deck[firstIndex].suit;\n        deck[firstIndex].value = deck[secondIndex].value;\n\
    \        deck[firstIndex].suit = deck[secondIndex].suit;\n        deck[secondIndex].value\
    \ = tempCard.value;\n        deck[secondIndex].suit = tempCard.suit;\n    }\n\
    }\n}\n\nvoid PrintDeck(card *deck, const uint8 &numCards)\n{\n    // Prints a\
    \ deck of cards in the format '2h 5c Jc' . They are\n    // printed all on one\
