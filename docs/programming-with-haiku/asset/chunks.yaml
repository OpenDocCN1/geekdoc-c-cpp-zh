    \ would be a major issue. We’re going to create a type which is accurate to merely\
    \ two decimal places and no errors. First, let’s start with a basic class definition\
    \ and a quick *main()* function to test it out.\n\n```\n\n#include <SupportDefs.h>\n\
    \n#include <stdio.h>\n\nclass Fixed\n\n{\n\npublic:\n\n        Fixed(void);\n\n\
    \        ~Fixed(void);\n\n    float   GetValue(void);\n\n    void    SetValue(const\
    \ int64 &value);\n\nprivate:    \n\n    int64   *fValue;\n\n};\n\nFixed::Fixed(void)\n\
    \n{\n\n    fValue = new int64();\n\n    *fValue = 0;\n\n}\n\nFixed::~Fixed(void)\n\
    \n{\n\n    delete fValue;\n\n}\n\nfloat\n\nFixed::GetValue(void)\n\n{\n\n    return\
    \ float(*fValue) / 100.0;\n\n}\n\nvoid\n\nFixed::SetValue(const int64 &value)\n\
    \n{\n\n    *fValue = value * 100;\n\n}\n\nint\n\nmain(void)\n\n{\n\n    Fixed\
    \ f;\n\n    f.SetValue(1234);\n\n    printf(\"Value: %f\\n\",f.GetValue());\n\n\
    \    return 0;\n\n}"
