    \ App.cpp and App.h.\n4.  Do the same for MainWindow.cpp.\n\nNow that we have\
    \ our files set up, let’s bang out some code. First, here is the code for App.h\
    \ and App.cpp. It would be a good idea to type everything out instead of copying\
    \ and pasting the text so that you get familiarized with the boilerplate code.\n\
    \n```\n\n// App.h\n\n#ifndef APP_H\n\n#define APP_H\n\n#include <Application.h>\n\
    \nclass App : public BApplication\n\n{\n\npublic:\n\n    App(void);\n\n};\n\n\
    #endif\n\n```\n\n```\n\n// App.cpp\n\n#include \"App.h\"\n\n#include \"MainWindow.h\"\
    \n\nApp::App(void)\n\n    :   BApplication(\"application/x-vnd.test-MenuColors\"\
    )\n\n{\n\n    MainWindow *mainwin = new MainWindow();\n\n    mainwin->Show();\n\
    \n}\n\nint\n\nmain(void)\n\n{\n\n    App *app = new App();\n\n    app->Run();\n\
    \n    delete app;\n\n    return 0;\n\n}\n\n```\n\nNone of the code in these files\
    \ is anything new. Note that because we haven’t entered in the class definition\
    \ for MainWindow in its header file, if you try to build your project right now,\
    \ you get some errors. Don’t worry – we’ll have everything working in just a moment.\
    \ Here is the code for MainWindow.h:\n\n```\n\n// MainWindow.h\n\n#ifndef MAINWINDOW_H\n\
    \n#define MAINWINDOW_H\n\n#include <Window.h>\n\nclass MainWindow : public BWindow\n\
    \n{\n\npublic:\n\n                    MainWindow(void);\n\n            void  \
    \      MessageReceived(BMessage *msg);\n\n};\n\n#endif\n\n```\n\nThis, too, is\
    \ familiar territory. All of the new code will be in MainWindow.cpp, but let’s\
    \ start with the boilerplate code for MainWindow and add to it bit by bit. The\
    \ best way to write code is to add a little at a time, compile, and then test\
    \ what you’ve written to help you find bugs.\n\n```\n\n// MainWindow.cpp\n\n#include\
    \ \"MainWindow.h\"\n\n#include <MenuBar.h>\n\n#include <Menu.h>\n\n#include <MenuItem.h>\n\
    \n#include <View.h>\n\nMainWindow::MainWindow(void)\n\n    :   BWindow(BRect(100,100,500,400),\"\
    MenuColors\",B_TITLED_WINDOW,\n\n                B_ASYNCHRONOUS_CONTROLS | B_QUIT_ON_WINDOW_CLOSE)\n\
    \n{\n\n}\n\nvoid\n\nMainWindow::MessageReceived(BMessage *msg)\n\n{\n\n    switch\
    \ (msg->what)\n\n    {\n\n        default:\n\n        {\n\n            BWindow::MessageReceived(msg);\n\
    \n            break;\n\n        }\n\n    }\n\n}"
