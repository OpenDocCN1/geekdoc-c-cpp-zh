    \n    :   BWindow(BRect(100,100,500,400),\"MenuColors\",B_TITLED_WINDOW,\n\n \
    \           B_ASYNCHRONOUS_CONTROLS | B_QUIT_ON_WINDOW_CLOSE)\n\n{\n\n    BRect\
    \ r(Bounds());\n\n    r.bottom = 20;\n\n    BMenuBar *menuBar = new BMenuBar(r,\"\
    menubar\");\n\n    AddChild(menuBar);\n\n    // This is the code that creates\
    \ and populates the menu.\n\n    BMenu *menu = new BMenu(\"Colors\");\n\n    menu->AddItem(new\
    \ BMenuItem(\"Red\",new Bmessage(M_SET_COLOR_RED),\n\n                       \
    \ 'R'));\n\n    menu->AddItem(new BMenuItem(\"Green\",\n\n                new\
    \ BMessage(M_SET_COLOR_GREEN),'G'));\n\n    menu->AddItem(new BMenuItem(\"Blue\"\
    ,\n\n            new BMessage(M_SET_COLOR_BLUE),'B'));\n\n    menu->AddItem(new\
    \ BmenuItem(\"Black\",\n\n                new BMessage(M_SET_COLOR_BLACK),'K'));\n\
    \n    // The menu bar adds menus the same way that a menu adds items. In\n\n \
    \   // fact, the menu bar is more or less a menu whose items are\n\n    // arranged\
    \ horizontally instead of vertically.\n\n    menuBar->AddItem(menu);\n\n    BView\
    \ *view = new BView(BRect(100,100,300,200),\n\n                    \"colorview\"\
    ,B_FOLLOW_ALL,B_WILL_DRAW);\n\n    AddChild(view);\n\n    view->SetViewColor(0,0,160);\n\
    \n}\n\n```\n\nWe’re almost done! If you try running your project and clicking\
    \ in the menu, you’ll find that nothing happens. Everything works the way it should.\
    \ When a menu item is clicked, it sends a message to the window, like clicking\
    \ on the 'Red' menu item sends a *M_SET_COLOR_RED* message to the window. The\
    \ window receives it, but doesn’t do anything with it, so all that is needed now\
    \ is to write the code for when the window receives each of the menu items' messages.\n\
    \n```\n\nvoid\n\nMainWindow::MessageReceived(BMessage *msg)\n\n{\n\n    // FindView()\
    \ is a BWindow method which searches for a BView by\n\n    // name and returns\
    \ a pointer to it.\n\n    BView *view = FindView(\"colorview\");\n\n    switch\
    \ (msg->what)\n\n    {\n\n        case M_SET_COLOR_RED:\n\n        {\n\n     \
    \       // When the window receives this message, we'll set the\n\n          \
    \  // background color to dark red\n\n            view->SetViewColor(160,0,0);\n\
    \n            // Calling Invalidate() forces the view to redraw\n\n          \
    \  // itself.\n\n            view->Invalidate();\n\n            break;\n\n   \
    \     }\n\n        case M_SET_COLOR_GREEN:\n\n        {\n\n            view->SetViewColor(0,160,0);\n\
    \n            view->Invalidate();\n\n            break;\n\n        }\n\n     \
    \   case M_SET_COLOR_BLUE:\n\n        {\n\n            view->SetViewColor(0,0,160);\n\
    \n            view->Invalidate();\n\n            break;\n\n        }\n\n     \
    \   case M_SET_COLOR_BLACK:\n\n        {\n\n            view->SetViewColor(0,0,0);\n\
    \n            view->Invalidate();\n\n            break;\n\n        }\n\n     \
    \   default:\n\n        {\n\n            // As always, the default is to make\
    \ the BWindow\n\n            // version of this method handle messages we don't\
    \ care\n\n            // about\n\n            BWindow::MessageReceived(msg);\n\
    \n            break;\n\n        }\n\n    }\n\n}"
