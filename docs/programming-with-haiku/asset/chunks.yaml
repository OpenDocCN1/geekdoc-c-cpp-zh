  trans: "\n函数参数在函数的声明和定义中都会被声明。它们以逗号分隔的列表列出。不接受任何参数的函数使用 `void` 关键字来表示。\n\n```cpp\n\
    // 带有两个参数的声明。\nint SomeFunction(int someNumber, int anotherNumber);\n\n// 带有两个参数的定义。\n\
    int MultiplyNumbers(int value, int secondValue)\n{\n    return value * secondValue;\n\
    }\n\n// 不需要参数的函数。必须是一个非常安静的函数。\nint main(void)\n{\n    return MultiplyNumbers(2,\
    \ 3);\n}\n```\n\n当我们调用带参数的函数时（例如上面示例中的 `MultiplyNumbers()`），我们不需要在每个参数旁边都列出类型。编译器会跟踪这些类型，并在我们出错时警告我们。\n\
    \n说到类型，C++ 中的数据类型远比整数多。每种类型在内存中占据不同的空间，以字节（bytes）为单位测量。记住这一点很重要，因为变量占据的字节数直接影响它能包含的信息量。这种差异在\
    \ `char` 能够存储的值范围与 `short` 相比是显而易见的。类型的大小随平台而异，但这里是 32 位处理器上 Haiku 的一个相当不错的列表。\n\
    \n### C++ 类型\n\n| 类型 | 大小（字节） | 范围 | 描述 |\n| --- | --- | --- | --- |\n| char |\
    \ 1 | -128 到 127 | 字母 – 每个 char 变量只存储 1 个字母 |\n| unsigned char | 1 | 0 到 255 |\
    \ 字母 – 每个 char 变量只存储 1 个字母 |\n| short | 2 | –32,768 到 32,767 | 整数 |\n| unsigned\
    \ short | 2 | 0 到 65, 535 | 整数 |\n| int | 4 | –2,147,483,648 到 2,147,483,647 |\
    \ 整数 |\n| unsigned int | 4 | 0 到 4,294,967,295 | 整数 |\n| long | 4 | –2,147,483,648\
    \ 到 2,147,483,647 | 整数 |\n| long long | 8 | –9,223,372,036,854,775,808 到 9,223,372,036,854,775,807\
    \ | 整数 |\n| unsigned long long | 8 | 0 到 18,446,744,073,709,551,615 | 整数 |\n|\
    \ float | 4 | 3.4E +/- 38 (7 位) | 带有小数部分的数字（浮点数） |\n| double | 8 | 1.7E +/- 308\
    \ (15 位) | 带有小数部分的数字（浮点数） |\n| long double | 12 | | 带有小数部分的数字（浮点数） |\n| bool |\
    \ 1 | 真或假 | 真或假 |\n| wchar_t | 2 或 4 | 相当于 `short` 或 `int` | “宽”字符，可以支持国际字符。与\
    \ `char` 一样，每个变量只存储 1 个字母。 |\n\n### 使用 printf()\n\n现在你还记得我们刚才看到的 `printf()` 的奇异之处吗？让我们再看一遍。\n\
    \n```cpp\n#include <stdio.h>\n\nint main(void)\n{\n    int a;\n    int b, c;\n\
    \n    a = 1;\n    b = 2;\n    c = 3;\n\n    printf(\"a is %d, b is %d, and c is\
    \ %d.\\n\", a, b, c);\n\n    return a + b + c;\n}\n```\n\n`printf` 是接受可变数量的函数之一。它的第一个参数始终是一个字符串。然而，根据字符串中占位符的数量，在字符串后面可能包含或不包含额外的参数。例如，在上面的示例中，字符串有三个\
    \ `%d` 占位符，分别对应 `a`、`b` 和 `c`。三个占位符，三个“额外”参数。这里是我们之后将使用的 `printf` 的其他可能的占位符。注意，这并不是\
    \ `printf` 的完整列表——还有更多选项，但目前这些就足够了。\n\n### printf 占位符\n\n| 占位符 | 类型 | 示例输出 |\n\
    | --- | --- | --- |\n| %c | 字符 | a |\n| %d, %i | 有符号十进制整数 | 234 |\n| %e, %E |\
    \ 使用 e/E 的科学计数法 | 1.7e+5, 1.7E+5 |\n| %f | 浮点数 | 3.14 |\n| %g | 双精度数字 | 3.14 |\n\
    | %o | 十八进制表示的整数 | 711 |\n| %u | 无符号整数 | 255 |\n| %x, %X | 十进制表示的整数 | 0xff, 0xFF\
    \ |\n| %% | 百号 | % |\n\n### 运算符\n\n运算符为我们提供了无需调用函数即可处理变量和数字的方法。`+`、`-` 和 `*` 都是运算符的例子，但\
    \ C++ 的运算符远多于这些。这里是一些算术运算符：\n\n| 表达式 | 名称 | 效果 |\n| --- | --- | --- |\n| a + b\
    \ | 加法 | 将 b 加 a |\n| a - b | 减法 | 从 a 中减去 b |\n| a * b | 乘法 | a 乘以 b |\n| a /\
    \ b | 除法 | a 除以 b |\n| a % b | 取模 | a 对 b 取余 |\n| a = b | 赋值 | 设置 a 为 b |\n| a\
    \ += b | 赋值加法 | a 加上 b |\n| a -= b | 赋值减法 | a 减去 b |\n| a *= b | 赋值乘法 | a 乘以 b\
    \ |\n| a /= b | 赋值除法 | a 除以 b |\n| a %= b | 赋值取模 | a 对 b 取余 |\n| ++a | 前自增 | a\
    \ 先加 1 |\n| a++ | 后自增 | a 后加 1 |\n| --a | 前自减 | a 先 减 1 |\n| a-- | 后自减 | a 后减\
    \ 1 |\n\n"
- fmt: "\nIt would be incredibly hard to write anything useful if there weren’t ways\
    \ for our programs to make decisions or to speed up tedious processes. In this\
    \ lesson we are going to examine one way to run code based on a condition and\
    \ a way to repeat a set of instructions as many times as we want.\n\n## Conditional\
    \ Execution: Running Certain Code Sometimes\n\nEven in programming, nothing is\
    \ ever certain. One way a program can handle special conditions is if-then logic,\
    \ as in `if` I see a one-eyed, one-horned flying purple people eater coming my\
    \ way, `then` I’m going the `other` way. Quickly.\n\nA computer can do the same\
    \ thing, such as `if` some variable equals 10, `then` set some other variable\
    \ to false. If we were to write this in code, this is what it would look like:\n\
    \n```\nif (someVariable == 10) {\n    someOtherVariable = false;\n}\n```\n\nThe\
    \ condition for this statement is placed inside the parentheses. Notice that instead\
    \ of using just one equals sign for checking if the two variables are equal, we\
    \ have two. In C and C++ a single equals sign is used for assigning a value to\
    \ a variable and two equals signs are for comparing two values. If you forget,\
    \ the compiler will warn you. Your program will still compile, but you will be\
    \ warned about this possible programming error. Following the condition in parentheses,\
    \ we have a block of instructions inside a pair of curly braces that will be executed\
    \ if the condition is true. If it is false, the block of instructions is skipped\
    \ and program execution continues on afterward. We can also specify what to do\
    \ if the condition is false with an `else` block.\n\n```\n// If the dragon breathes\
    \ fire\nif (dragonBreathesFire) {\n    // Stop and break out the marshmallows.\
    \ Yum!\n    SetSpeedMPH(0);\n    EquipMarshmallows(true);\n} else {\n    // The\
    \ dragon isn't of the fire-breathing variety, so get ready to fight.\n    DrawSword();\n\
    \    RaiseShield();\n    myVelocityMPH += 4;\n}\n```\n\n`if` statements can be\
    \ used in many fancy ways. They can be chained together or even `nested`, that\
    \ is, put inside one another, and if you want to Work Smarter, Not Harder, (a.k.a.\
    \ be a lazy programmer), you can skip the curly braces if you have only a single\
    \ instruction to execute. Observe:\n\n```\n// This is the shortcut way of using\
    \ an if statement - there is only one\n// instruction to possibly run.\nif (someVariable\
    \ == 10)\n    someOtherVariable = false;\n\nif (PoliceVisible()) {\n    myStress++;\n\
    \n    // Here we have a couple of if statements placed inside each other.\n  \
    \  // Every time there is another level of nesting, we increase the\n    // indenting\
    \ one level, as as well.\n\n    if (GetSpeed() > GetSpeedLimit()) {\n        if\
    \ (PoliceLightsFlashing())\n            SetSpeedMPH(0);\n        else\n      \
    \      SetSpeedMPH(GetSpeedLimit());\n    } else\n        myStress--;\n}\n```\n\
    \nHere we check to see if there are police visible. If so, then our stress (naturally)\
    \ goes up a little. Then we check to see if our speed is over the limit. If it\
    \ isn’t, our stress goes back down to where it was before. If, for some reason,\
    \ it is over the limit, we check to see if the police car’s lights are flashing\
    \ and either slow down or stop, as appropriate.\n\nIncreasing the indenting with\
    \ each nesting level is a coding style choice with a purpose – it makes understanding\
    \ the logic of your if-then statements and helps you to quickly ascertain which\
    \ instructions belong to which `if` statement. There are two schools of thought\
    \ on how to indent: a series of spaces or using the Tab key. For the purposes\
    \ of these lessons, we’ll use the Tab key – it does the same job and requires\
    \ less typing. Again, work smarter, not harder.\n\nTo add one final trick to our\
    \ bag, we can also use Boolean logical operators to modify or chain together conditions\
    \ with AND, OR, or NOT and set precedence with parentheses. For those unfamiliar,\
    \ **Boolean logic** is just a way of chaining together conditions, such as IF\
    \ some-condition AND some-other-condition.\n\n### Boolean logic\n\n| Boolean Value\
    \ | Operator | Example | Means |\n\n| --- | --- | --- | --- |\n\n| AND | `&&`\
    \ | `if (a == 1 && b == 2)` | if `a` is 1 and `b` is 2 |\n| OR | `||` | `if (a\
    \ == 1 || b == 2)` | if `a` is 1 or `b` is 2 |\n| NOT | `!` | `if ( !(a == 1 ||\
    \ b == 2) )` | if the opposite of `a` equaling 1 and `b` equaling 2 |\n\nNote\
    \ that if you have more than one condition in an `if` statement, it may be a good\
    \ idea to enclose each one in parentheses to make your code a little clearer unless\
    \ the conditions are pretty short.\n\n```\nif ((a == 1 && b == 2) || c)\n    DoSomething();\n\
    ```\n\nThis example translates as \"Call `DoSomething()` if either `a` is one\
    \ and `b` is 2, or the value of `c` is nonzero.\" Integers can be used for logic,\
    \ such as in this example. Zero is treated as false and everything else is treated\
    \ as true, so in this example the condition `c` will be true if.\n\n## Loops\n\
    \nA loop is a feature of C where the program repeatedly executes a set of instructions\
    \ a certain condition is true. C has several kinds of loops, but for today, we\
    \ will look at just one: the `for` loop. Our `for` loop has two parts: the control\
    \ section, which is inside the parentheses, and the block of repeated instructions.\n\
    \n```\n#include <stdio.h>\n\nint main(void)\n{\n    int number = 0;\n    // This\
    \ is our for loop\n    for (int i = 1; i < 10; i++) {\n        number += i;\n\
    \        printf(\"At step %d, the number is %d\\n\", i, number);\n    }\n}\n```\n\
    \nWhen we run this program, this is what it prints:\n\n```\nAt step 1, the number\
    \ is 1\nAt step 2, the number is 3\nAt step 3, the number is 6\nAt step 4, the\
    \ number is 10\nAt step 5, the number is 15\nAt step 6, the number is 21\nAt step\
    \ 7, the number is 28\nAt step 8, the number is 36\nAt step 9, the number is 45\n\
    ```\n\nThe control section for the `for` loop has three parts: the initialization,\
    \ the loop condition, and the step value. The initialization sets a variable to\
    \ the starting value for the loop. We can declare it in this part of the loop\
    \ or use one that has been declared. It is common practice to declare our index\
    \ variable in this part of the loop, and many times programmers will use the lowercase\
    \ `i` (as in short for index) for the index variable.\n\nThe loop condition is\
    \ an expression that must be true for the loop to repeat. In this case, the loop\
    \ will repeat while `i` is less than 10. The step value is an expression that\
    \ changes the index variable. Most of the time, like in this example, we just\
    \ add one to the index, but it’s possible to use any math operation we want –\
    \ we could change this to `i += 2` if we wanted to increment `i` by twos.\n\n\
    ## Applying Concepts\n\nWe’re going to try to take the concepts we’ve learned\
    \ in this lesson and put them together for more than a little useful. When you\
    \ take a loan out on a car, it’s nice to know what the payments will be, so let’s\
    \ put together a function which calculates the payment. The equation that is used\
    \ for this is the following:\n\n![A = (P * (r/12)) / (1 - (1 + r/12)^-n)](media/file1.png)\n\
    \n| A = the payment amountP = the initial principalr = the loan’s interest raten\
    \ = the number of months |\n\nWith as complicated as it looks, this is definitely\
    \ a job for a dedicated function. Let’s translate this mathematical mess into\
    \ something a little easier to wrap our minds around.\n"
