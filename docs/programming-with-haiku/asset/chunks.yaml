    \ --- |\n\n| *5 << 2* | 5 * 2² | 20 | *00000101* | *00010100* |\n\n| *32 << 1*\
    \ | 32 * 2¹ | 64 | *00010000* | *00100000* |\n\n| *64 >> 1* | 64 / 2¹ | 32 | *01000000*\
    \ | *00100000* |\n\n| *7 >> 2* | 7 / 2² | 1 | *00000111* | *00000001* |\n\nKnowing\
    \ shift operations is especially handy when operating with values at the bit level\
    \ because they allow us to do specific kinds math very, very quickly. Multiplying\
    \ or dividing by a power of 2 is common in these situations and the equivalent\
    \ calls to *pow()* or using regular division are far slower.\n\n### Bug Hunt\n\
    \n#### Hunt #1\n\n```\n#include <stdio.h>\n#include <string.h>\n#include <malloc.h>\n\
    \nchar *ReverseString(char *string)\n{\n    // This function rearranges a string\
    \ so that it is backwards\n    // i.e. abcdef -> fedcba\n    if (!string)\n  \
    \      return NULL;\n\n    int length = strlen(string);\n    int count = length\
    \ / 2;\n\n    for (int i = 0; i < count; i++) {\n        char temp = string[length\
    \ - 1 - i];\n        string[length - 1 - i] = string[i];\n        string[i] =\
    \ temp;\n    }\n\n    return string;\n}\n\nint main(void)\n{\n    char firstString[100],\
    \ secondString[100];\n    char *combinedString = NULL;\n\n    printf(\"Enter your\
    \ first word: \");\n    gets(firstString);\n\n    printf(\"Enter your second word:\
    \ \");\n    gets(secondString);\n\n    sprintf(combinedString,\"%s %s\",ReverseString(secondString),\n\
    \n    ReverseString(firstString));\n    printf(\"If you saw these two words in\
    \ a mirror, it would read '%s'\\n\",\n        combinedString);\n}\n```\n\nWhen\
    \ run, the program prints \"*segmentation fault*\" and nothing else.\n\n#### Hunt\
    \ #2\n\n```\n#include <stdio.h>\n#include <math.h>\n\nvoid MakeBinaryString(char\
    \ *outString, char valueToConvert)\n{\n    // Convert a 1-byte value to a string\
    \ that shows its value in\n    // binary. We do this by checking to see each bit\
    \ is on and\n    // if it is, setting the character value to '1' or '0' if not.\n\
    \    for (int i = 0; i < 8; i++)\n    {\n        // Is the bit a 1?\n        //\
    \ The shifting is needed to quickly generate a power of 2\n        // so that\
    \ we check only 1 bit at a time, starting with bit 7\n        // and working its\
    \ way down.\n        if (valueToConvert & (1 << (7 - i)))\n            outString[i]\
    \ = '1';\n        else\n            outString[i] = '0';\n    }\n\n    outString[8]\
    \ = '**\\0**';\n}\n\nint main(void)\n{\n    char value = 5;\n    char binaryString[6];\n\
    \    MakeBinaryString(binaryString,value);\n    printf(\"The binary equivalent\
    \ of %d is %s**\\n**\",value, binaryString);\n    return 0;\n}\n```\n\nWhen run,\
    \ the program prints the following: The binary equivalent of 48 is 00000101 Segmentation\
    \ fault\n\n## Review\n\n1.  Which memory pool is bigger, the stack or the heap?\n\
    \n2.  What is a memory leak?\n\n3.  What is portability?\n\n4.  What is it called\
    \ when you tell the compiler to treat one type as another?\n\n5.  What is the\
    \ difference between malloc() and calloc()?\n\n6.  What is the numerical result\
    \ of 7 & 0 ?\n\n7.  What is the numerical result of 7 | 8 ?\n\n8.  What does 33\
    \ look like in binary?\n\n9.  What is the binary number 1000010 in regular decimal\
    \ notation?\n\n10.  What is the numerical result of 1 << 5 ?\n\n# Lesson 8\n\n\
    Because we’ve been focusing on the structure of the C++ language so far, we haven’t\
    \ given much attention to getting information in and out of our program. Today\
    \ we’ll change this, but first, let’s take a quick look at a few niggling details\
    \ that we’ve been able to ignore until now.\n\n## Scope\n\nThis is not to be confused\
    \ with mouthwash, though considering the personal hygiene habits of some developers,\
    \ might not be a bad idea, either. Luckily, on the Internet, nobody knows you’re\
    \ a cat.\n\n**Scope** in this case applies to variables. A variable’s scope is\
    \ the span of its existence. When a variable is declared, it has a definite beginning,\
    \ and it can’t be used before its declaration in the source code. It also disappears\
    \ completely when execution reaches the end of the block in which it is declared.\n\
    \nThere are three types of scope: local, global, and static. Local variables have\
    \ the shortest lifespan: they are declared within a code block, such as a function,\
    \ *for* loop, or *case* block, and disappear when execution leaves the block of\
    \ code.\n\nGlobal and static variables are declared outside of a function. They\
    \ can always be accessed, but the order in which they are initialized is not certain,\
    \ so be careful of globals that depend on the values of other globals. Global\
    \ variables can be accessed from anywhere. Static variables have the same lifetime\
    \ as global variables, but they can be accessed only from code within the file\
    \ in which they are declared. In other words, code in other files can’t get at\
    \ them. All of this can get tricky, but it is easier to understand in code, so\
    \ let’s look at an example."
