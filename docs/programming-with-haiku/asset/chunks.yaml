  trans: "\n\n## 编写和测试我们的代码\n\n由于我们处理的是非 GUI 代码，最简单的方法可能是使用一个快速粗糙的终端应用程序来测试所有代码。在\
    \ `App.cpp` 的 `main()` 函数中，注释掉除返回值以外的所有代码，并编写代码以快速确保一切运行正常。这里有一些开发技巧，可以让你的编写工作变得稍微容易一些：\n\
    \n*   首先编写析构函数和 `MakeEmpty()`。\n*   接下来实现 `SetFolder()`。\n*   现在应该编写 `ScanFolder()`，因为\
    \ `GetFortune()` 依赖于它。`main()` 中的测试代码只需调用 `SetFolder()` 指向你想要用于测试的路径。使用 `printf()`\
    \ 打印出 `ScanFolder()` 正在执行的内容（例如扫描到的每个引用名称），对于此处的调试非常有帮助。\n*   一旦写好了 `ScanFolder()`，就可以开始编写\
    \ `GetFortune()` 了。再次，使用 `printf()` 来查看发生了什么。\n*   `LastFileName()` 可以在你觉得任何时候实现——在在我们开始实现\
    \ GUI 之前，它并不重要。\n\n一旦你的 `FortuneAccess` 类完成并调试完毕，你就已经拥有了编写一个比 fortune 本身更好的命令行幸运语程序所需的一切！\n\
    \n## 进一步探索\n\n我们甚至还没有触及 GUI。思考一些可能的方法，让我们使用图形化控件创建一个简单的界面来显示幸运语。我们下次将制作 GUI，我们的项目就完完成了！\n\
    \n# 第 22 节\n\n实现上一节中的幸运语函数不应该太困难。请放心，即使它比预想的要，你也能完成这个项目。今天我们将为我们的幸运语程序设计图形界面。\n\
    \n## 可用性与界面设计\n\n开发者需要注意的一点是易用性，它是程序对任务的适用性的质量，同时匹配其用户的技术水平。Haiku 展示了 BeOS 在 Macintosh\
    \ 操作系统中的根源。尽管其他人在这一领域取得了显著进展，但大多数苹果产品在很大程度上都是如何设计既时尚时尚又易于使用的产品的典范。BeOS 继承了这些特性，而没有显式地复制\
    \ Macintosh 的处理方式。这也意味着 Haiku 开发者被期望编写出不仅避免不必要的困难，而且实际上帮助用户完成工作的程序。\n\n易用性是一门独立的学科，对其进行良好的研究将花费远超这些课程的范围。尽管如此，我们应该检查设计的一些基础，以避免在编写程序时出现重大失误。提前思考几分钟可以为你和程序的用户的未来省去很多烦恼。\n\
    \n### 确定你程序的主要用户。\n\n这个问题的答案可能是开发者或通用的 Haiku 用户，例如。知道谁将使用你的程序将引导你确定用户的需求和技能。请记住，如果你的程序面向普通受众（例如我们的幸运语程序），你将希望为非技术用户设计你的程序。这将让尽可能的人享受到你的工作。在为非技术用户设计时，最好脑子里想一个你认识的“对计算机并不懂”的人，例如祖父母、同事或配偶。你为设计\
    \ App 以匹配目标受众的专业知识所付出的精力越多，以后被要求提供支持的情况就越少，它享受欢迎程度也越高。\n\n### 决定你的程序旨在执行的首要和次要任务。\n\
    \n除非你正在编写某种游戏——这与执行“工作”的程序同样值得赞佩——否则你的程序将旨在成为一个执行一个或多个任务的工具。一个功能对界面整体设计的影响应该与其使用的频率成正比。一个从\
    \ CD 中提取 MP3 的程序应该让获取专辑信息变得尽可能简单。编辑艺术家名称、专辑发布日期以及属于 MP3 标签的其他信息也应该相当简单。很少使用甚至从不使用的功能，在将其加入程序之前应该仔细考虑。增加功能会增加复杂性，会产生更多需要支持和维护的代码，并让用户使用程序变得困难。通过优先考虑程序的工作，你将获得最高的回报。\n\
    \n### 思考你的程序可以提供额外帮助的方法。\n\n在某些情况下，你的程序应该被视为一个管家：你告诉他去回答，他就完成了一项不需要夺取控制权的工作。自动化无聊的任务是计算机非常擅长的。大多数人很讨厌这种事情。这里那里的处处贴心触动会汇聚成极佳的用户体验。\n\
    \n### 优雅地处理问题。\n\n很少有人喜欢被问问题。更少每几分钟就被问一次。这就像一个四岁的孩子冲到说话的妈妈面前，每隔三四秒就“妈妈”以引起她的注意。过度使用\
    \ BAlert 会给用户带来这种困扰。向用户提问是可以的，但要以一种不傲慢的方式，并尽可能降低频率。深知墨菲定律确实适用于编程，尝试思考可能出现的情况并优雅地处理它们。崩溃不是选项，丢失用户数据也是（除非如此）。\n\
    \n## 设计我们的 GUI\n\n我们的幸运语程序在宏观层面上并不极端重要，但如果设置为计算机启动时运行，用户将会经常看到它。这个程序面向任何人，所以它应该尽可能非技术化。\n\
    \n我们只以几种不同的方式做一件事，所以我们应该可以使用按钮，而不必创建菜单。一个按钮可以用于获取另一个幸运语。虽然窗口标签上总有一个关闭按钮，但我们应该也使用普通的按钮，以便用户可以通过\
    \ Enter 键关闭窗口。由于我们希望人们有一种方法知道版本和是谁编写了这个幸运语程序，我们将创建一个显示“关于”窗口的按钮。这很容易编写。\n\n##\
    \ 编写代码\n\n我们应该做的第一件事是找出幸运语存储在哪里。在 BeOS 和 Zeta 下，它们存储在 `/boot/be/etc/fortunes`。Haiku\
    \ 将它们放在不同的地方：`/boot/system/data/fortunes`。与其尝试猜测我们可能在使用什么平台，我们应该使用 `find_directory()`。\n\
    \n```\nstatus_t find_directory(directory_which which, BPath *path,\n         \
    \       bool and_create_it = false, BVolume *vol = NULL);\n```\n\n"
- fmt: "\n```\nThis call takes a constant – a list of which can be found in `FindDirectory.h`\
    \ – and places the location that corresponds to it into `path`. Use this call\
    \ whenever you need to get a common location in the filesystem, such as the home\
    \ folder, the user’s settings folder, the common add-ons folder, and so on. If\
    \ the actual location of such a folder should change, your program won’t suddenly\
    \ stop working correctly.\n\nWe are going to make a global variable to hold the\
    \ path for the fortunes. Using lots of global variables is a bad idea, but one\
    \ in this program won’t hurt anything. Add this line to `FortuneFunctions.h`:\n\
    \n```cpp\nextern BString gFortunePath;\n```\n\nPlace this somewhere between the\
    \ includes and your class code in `FortuneFunctions.cpp`.\n\n```cpp\nBString gFortunePath\
    \ = \\\"/boot/beos/etc/fortunes\\\";\n```\n\nThe `extern` keyword declares `gFortunePath`\
    \ without defining it. If `FortuneFunctions.h` is used by more than one file,\
    \ this will prevent linker problems. We actually define and initialize it in the\
    \ main sources.\n\nNow that we’ve made the necessary tweaks to our fortune access\
    \ class, let’s turn our attention to `App.cpp`. We will need to do a little additional\
    \ setup before we show our fortune window.\n\n```cpp\n// App.cpp\n\n#include \"\
    App.h\"\n#include <FindDirectory.h>\n#include <OS.h>\n#include <Path.h>\n#include\
    \ <stdlib.h>\n#include \"FortuneFunctions.h\"\n#include \"MainWindow.h\"\n\nApp::App(void)\n\
    \  : BApplication(\"application/x-vnd.test-HaikuFortune\")\n{\n    BPath path;\n\
    \    // We have to use an #ifdef here because the fortune files under R5\n   \
    \ // and Zeta are in the system/etc/ directory, but in Haiku they're\n    // kept\
    \ in the system/data directory. We detect the platform by\n    // using a compiler\
    \ definition. __HAIKU__ is defined under Haiku,\n    // but not BeOS R5 or Zeta.\
    \ Zeta has its own __ZETA__ definition.\n    #ifdef __HAIKU__\n    find_directory(B_SYSTEM_DATA_DIRECTORY,&path);\n\
    \    #else\n    find_directory(B_BEOS_ETC_DIRECTORY,&path);\n    #endif\n\n  \
    \  path.Append(\"fortunes\");\n    gFortunePath = path.Path();\n\n    // If we\
    \ want the rand() function to actually be pretty close to\n    // random we will\
    \ need to seed the random number generator with the\n    // time. If we don't,\
    \ we will get the same \"random\" numbers each\n    // time the program is run.\
    \ rand() isn't really random, but this\n    // makes it close enough for us.\n\
    \    srand(system_time());\n\n    MainWindow *win = new MainWindow();\n    win->Show();\n\
    }\n\nint\nmain(void)\n{\n    App *app = new App();\n    app->Run();\n    delete\
