    \ sheets of controls on tabs. It requires a little more care to use them than\
    \ what it might initially seem. |\n| BTextControl | A single line text editing\
    \ control. |\n| BTextView | A multiline text editing control with limited word\
    \ processing capabilities. |\n| BView | The base class from which all controls\
    \ are derived. It has a lot of methods and it can be a little overwhelming, but\
    \ it’s powerful and flexible. |\n\nThat’s a lot of different classes! At first,\
    \ it seems pretty overwhelming, but it’s not too bad after a little tinkering,\
    \ especially when you consider that there is quite a bit they have in common.\
    \ You might want to keep this control table handy for your first projects. We’re\
    \ not going to look at every control in detail, but the ones that we skip should\
    \ be easy enough to pick up on your own.\n\n## Typecasting Revisited\n\nWay back\
    \ in lesson 7 we learned about typecasting, i.e. reinterpreting the data in a\
    \ variable as a different type. One of the problems with casting in C is that\
    \ it isn’t safe – whenever you cast a variable, it always succeeds. If you choose\
    \ the wrong class to cast, it still succeeds, typically with unpredictable results.\
    \ C offers different kinds of casting. Even though C typecasting methods require\
    \ more typing, they should be preferred unless you’re specifically writing code\
    \ in C. Here they are:\n\n```\n\nstatic\\_cast\\<TypeToCastTo \\*\\>(pointerToCast);\n\
    \n```\n\nA static cast is used to convert one type to another. It relies upon\
    \ compile-time information and is often used for the purposes that the regular\
    \ C casting method is used – changing pointer types and arithmetic conversions.\
    \ It works so long as the language supports the conversion between the two types.\n\
    \n```\n\ndynamic\\_cast\\<TypeToCastTo \\*\\>(pointerToCast);\n\n```\n\nAside\
    \ from static casts, dynamic casts will be one of your most frequently-used cast\
    \ types when working with Haiku. They are used to safely navigate an inheritance\
    \ hierarchy. If no inheritance links together the \"from\" type and the \"to\"\
    \ type, *NULL* will be returned instead. Thus, you can cast to only those pointer\
    \ types you’re supposed to be able cast. We will use one of these in today’s project.\n\
    \n```\n\nconst\\_cast\\<TypeToCastTo \\*\\>(pointerToCast);\n\n```\n\nConst casting\
    \ adds or removes the changeability of a pointer. For example, there are instances\
    \ where a function will take a non-*const* parameter that it doesn’t change. Passing\
    \ a constant pointer to one of these functions will require a const cast.\n\n\
    ```\n\nreinterpret\\_cast\\<TypeToCastTo \\*\\>(pointerToCast);"
