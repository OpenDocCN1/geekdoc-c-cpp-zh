    \ return 0;\n}\n```\n\n## 接下来去向哪里\n\n呼！这可不容易！这个示例使用了许多我们到目前为止花费时间学习的知识，可能也花了一些时间才完成。这次没有找\
    \ Bug 的环节——只是对上一节课的项目进行了一些回顾。花些时间回顾本单元以及另外两个单元的复习题。在下节课中，我们将开始深入研究 C++ 中赋予其*真正*力量的部分。\n\
    \n## 课作业\n\n在上一节课中，我们被要求编写一个程序，该程序接受至少一个文件名作为命令行参数并打印它。在我们的 `for()` 循环内部执行的步骤如下：\n\
    \n1. 尝试将参数作为文件打开读取。\n2. 如果打开失败，跳到下一次迭代。\n3. 如果打开成功，尝试从文件中读取块数据，并存储读取到的字节数。\n4.\
    \ 使用 `while` 循环读取文件的部分内容，只要读取的字节数大于 0 就重复。\n5. 关闭文件。\n\n```cpp\n#include <stdio.h>\n\
    #include <malloc.h>\n\nint main(int argc, char **argv)\n{\n    for (int i = 1;\
    \ i < argc; i++)\n    {\n        // 以读取模式打开 argv[i]\n        FILE *fileHandle\
    \ = fopen(argv[i],\"r\");\n        // 如果句柄为空或发生错误，跳到\n        // 下一次迭代。\n    \
    \    if (!fileHandle || ferror(fileHandle))\n            continue;\n        //\
    \ 创建数据缓冲区——一个存放数据的数组。\n        // 大小并不极端重要，但至少应该是几百字节\n        // 且不超过 4000 字节。你可以在栈上创建\n\
    \        // 或者使用 malloc，取决于你的喜。\n        char buffer[1024];\n        // 创建一个变量存储实际读取的字节数\n\
    \        int bytesRead;\n        // 从句柄读取数据并将读取的字节数\n        // 存入我们创建的变量中。\n\
    \        bytesRead = fread(buffer,sizeof(char),1024,fileHandle);\n        // 开始我们的\
    \ while() 循环。只要读取的字节\n        // 大于 0 且 ferror 没有指示错误\n        while (bytesRead\
    \ > 0 && !ferror(fileHandle))\n        {\n            // 将读取的字节写入标准输出。\n     \
    \       fwrite(buffer,sizeof(char),bytesRead,stdout);\n            // 读取更多数据并将实际读取的字节数\n\
    \            // 存入上面创建的变量中。\n            bytesRead = fread(buffer,sizeof(char),1024,fileHandle);\n\
    \        }\n        // 如果你使用了 malloc，在这里释放缓冲区；\n        // 如果把缓冲区放在栈上，则无所谓。\n\
    \        // 在这里关闭文件句柄\n        fclose(fileHandle);\n    }\n\n    return 0;\n}\n\
    ```\n\n"
- fmt: "\n## Review\n\n1. What is an enumerated type?\n2. What is the advantage of\
    \ specifying a value for one or more elements in an enumerated type?\n3. How is\
    \ a variable inside a struct accessed?\n4. What is the difference between the\
    \ dot operator and the arrow operator?\n\n# Lesson 12\n\nC is the language in\
    \ which most Haiku programs are written. It is an extension of the C language\
    \ written by Dennis Ritchie at Bell labs in the 1970s. The language fundamentals\
    \ that we have been learning are common to both languages, but from here on out\
    \ we will be learning the parts of C that C cannot do. It is these parts that\
    \ make it powerful, but to really grasp them well, we must change our perspective\
    \ of writing code.\n\n## Object-Oriented Programming\n\nThe programs that we have\
    \ been writing have been part of a paradigm called procedural programming, which\
    \ is development that centers around individual function calls. This is fine for\
    \ many purposes, but programming for the Haiku Graphical User Interface (GUI)\
    \ goes beyond this to another paradigm called object-oriented programming.\n\n\
    The idea behind object-oriented programming is that an application consists of\
    \ the interaction of objects to perform a task. Each object is a \"black box\"\
    \ which has certain properties and ways of interacting with it while hiding how\
    \ it actually works. All we know about the object is how to interact with it.\
    \ A real life example would be a television: pushing buttons changes the channel,\
    \ adjusts settings in the on-screen menu, adjusts the volume, and turns it on\
    \ or off. We also know its size, color, and approximate weight, and unless you’re\
    \ a TV repairman, you probably don’t know how it works or have access to its internal\
    \ components.\n\nA C++ object is very much like a television. It has functions,\
    \ called `methods`, which provide a means to interact with it. It also has variables\
    \ for holding data which are called `properties`. Not all of an object’s methods\
    \ and properties are necessarily accessible by outsiders.\n\n## Classes\n\nObject\
    \ definitions in C++ are called `classes`. Classes are defined with code very\
    \ much like the data structures we learned about in the last lesson. Here is an\
    \ example class definition for our television.\n\n```cpp\nclass Television\n{\n\
    public: // All of these functions are accessible by anyone. Without\n\n      \
    \  // the 'public' keyword, all of these would be strictly\n\n        // internal\
    \ methods -- the default access mode is private.\n\n            // This is the\
    \ constructor function. More on this in a\n\n            // moment.\n\n      \
    \      Television(void);\n\n            // This is the destructor function. More\
    \ on this in a\n\n            // moment, too.\n\n            ~Television(void);\n\
    \n    view        SetChannel(uint16 channel);\n\n    uint16  GetChannel(void);\n\
    \n    void        SetVolume(uint8 volume);\n\n    uint8       GetVolume(void);\n\
    \n    void        TogglePower(void);\n\n    bool        IsTurnedOn(void);\n\n\
    private:    // Everything below this word can't be touched by the\n\n        //\
    \ outside world\n\n    int8        DetectActiveInput(void);\n\n    void      \
    \  ConnectToSignal(void);\n\n    uint16  fChannel;\n\n    uint8       fVolume;\n\
    \n    bool        fPowerState;\n\n};\n```\n\nThe code bears a striking resemblance\
    \ to a `struct` definition. There are a lot more methods than properties and a\
    \ couple of odd words – `public` and `private`. The bits closely related to the\
    \ operation of the television, such as `ConnectToSignal()`, are in the `private`\
    \ section of the class definition and can only be called by the `Television` class'\
    \ other methods. \n\nIt might seem just a little strange that there are six methods\
    \ devoted to settings and getting the value of the Television’s properties. Wouldn’t\
    \ it be easier – and less work – to just make `fChannel`, `fVolume`, and `fPowerState`\
    \ public? Yes, but it would make the code that works with it messier. Our objects\
    \ should expose their internal workings only when absolutely necessary. This makes\
    \ it possible to change how it operates internally without disturbing its interaction\
    \ with the outside world. For example, if we decided to rename `fPowerState` to\
    \ `fIsTurnedOn`, the name of the variable would need to be changed in a handful\
    \ of places in the code. All of those places would be in the file which contains\
    \ the code for the class' methods. However, if we had made `fPowerState` a public\
    \ property, we would have to change every reference to it in the entire project.\
    \ If your project is large, this is a lot more work. Hiding properties using methods\
    \ is called `data abstraction`, a term commonly heard in C++.\n\nCalling an object’s\
    \ methods requires you to have access to the object. The dot and arrow operators\
    \ that we used to get to a structure’s variables are used with classes to access\
    \ its methods and properties.\n\n```cpp\nint\nmain(void)\n{\n    Television tv;\n\
    \n    // Watching a TV that is turned off isn't much fun\n\n    if (!tv.IsTurnedOn())\n\
    \        tv.TogglePower();\n\n    // Watch the Channel 8 news :)\n\n    tv.SetChannel(8);\n\
    \n    return 0;\n}\n```\n\nThe other oddballs in the class definition are the\
    \ functions `Television()` and `~Television()`. They don’t have a return type\
    \ – not even `void`! This is because they are special methods. `Television` is\
    \ called the class' **constructor**, which is a method called whenever we create\
    \ a `Television` object. `~Television()` is the class' **destructor**, which is\
    \ called whenever we destroy a `Television` object. They are optional, but almost\
    \ every class has a constructor and many have a destructor. They also play a key\
    \ role when allocating and freeing objects. Speaking of which, let’s look at the\
    \ C++ way of using heap memory. We’re going to need it very soon.\n\n## C++ Memory\
    \ Allocation: new and delete\n\nTo create a new `Television` object, we don’t\
    \ call `malloc()`. In fact, you will hardly ever use it unless you are writing\
    \ a program in C. Instead, we will be using `new` and `delete`, the C++ counterparts\
    \ to `malloc()` and `free()`. It’s best we look at how they are used in this code\
    \ example.\n\n```cpp\nint\nmain(void)\n{\n    // Create a pointer to hold our\
    \ TV and an object to go with it.\n    // Using new allocates enough memory to\
    \ hold one Television object\n    // and then calls its constructor.\n\n    Television\
    \ *tv = new Television();\n\n    // Like before, it works better when it is turned\
    \ on\n\n    if (!tv->IsTurnedOn())\n        tv->TogglePower();\n\n    // The news\
    \ on 8 is all bad. Maybe Phineas and Ferb is on?\n\n    tv->SetChannel(172);\n\
    \n    // Free our TV. Right before its memory is freed, the destructor\n    //\
    \ method for the class is called.\n\n    delete tv;\n\n    return 0;\n}\n```\n\
    \nIt’s much simpler to use `new` and `delete` for allocating memory on the heap.\
    \ In fact, for objects, they are required. Other methods will cause an object’s\
    \ constructor and/or destructor to never executed and lead to all kinds of ugly\
    \ messes. `new` and `delete` can also be used for arrays of objects, as you can\
    \ see in this code example.\n\n```cpp\nint\nmain(void)\n{\n    // Create an array\
    \ of TVs. I guess we're going to open an appliance\n    // store, starting with\
    \ 100 sets. We're going to need a little\n    // retail space. ;-)\n\n    Television\
    \ *tvArray = new Television[100];\n\n    // Like before, it works better when\
    \ it is turned on, but we'll\n    // turn just one on, seeing how they're all\
    \ the same. ;-)\n\n    if (!tvArray[0].IsTurnedOn())\n        tvArray[0].TogglePower();\n\
    \n    // We don't care what channel is on so long as we can't hear it.\n\n   \
    \ tvArray[0].SetVolume(0);\n\n    // Free our TV. The brackets are needed when\
    \ freeing an array we\n    // received from new. Leaving out the brackets will\
    \ cause a memory\n    // leak because then only one of the objects will be freed\
    \ instead\n    // of all of them.\n\n    delete [] tvArray;\n\n    return 0;\n\
    }\n```\n"
