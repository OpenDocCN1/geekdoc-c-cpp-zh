  trans: "\n\n如果我们的程序无法做出决策或加速枯燥的过程，那么编写出任何有用的东西将极其困难。在本节中，我们将研究一种根据条件运行代码的方法，以及一种可以根据需要无限次重复一组指令的方法。\n\
    \n## 条件执行：有时运行特定代码\n\n即使在编程中，没有任何事情是绝对肯定的。程序处理特殊情况的一种方式是如果-那么（if-then）逻辑，就像：`if`\
    \ 我看到一个单眼独角的飞行的紫色食人朝我走来，`then` 我就走向`另一个`方向。动作要快。\n\n计算机也可以做同样的事情，例如 `if` 某个变量等于\
    \ 10，`then` 将另一个变量设置为假。如果我们把这写成代码，它看起来会是这样：\n\n```\nif (someVariable == 10) {\n\
    \    someOtherVariable = false;\n}\n```\n\n该语句的条件被放在括号内。注意，我们没有只使用一个等号来检查两个变量是否相等，而是使用了两个。在\
    \ C 和 C++ 中，单等号用于给变量赋值，而双等号用于比较两个值。如果你忘记了，编译器会提醒你。你的程序仍然可以编译，但你会收到关于这个可能的编程错误的警告。在括号中的条件之后，我们有一个大括号内的指令块，如果条件为真，则执行该指令块。如果条件为假，指令块将被跳过，程序继续向下执行。我们还可以使用\
    \ `else` 块来指定条件为假时执行什么。\n\n```\n// 如果巨龙喷火\nif (dragonBreathesFire) {\n    // 停止并烤棉花糖。好！！\n\
    \    SetSpeedMPH(0);\n    EquipMarshmallows(true);\n} else {\n    // 巨龙不是喷火类的，所以准备好战斗。\n\
    \    DrawSword();\n    RaiseShield();\n    myVelocityMPH += 4;\n}\n```\n\n`if`\
    \ 语句可以用许多花哨的方式使用。它们可以链在一起，甚至可以`嵌套`（即放入彼此内部），如果你想**聪明地工作，而不是刻苦地工作**（也就是说，做一个懒惰的程序员），如果你只有一条指令要执行，你可以跳过大括号。观察一下：\n\
    \n```\n// 这是使用 if 语句的快捷方法——只有一个\n// 可能运行的指令。\nif (someVariable == 10)\n    someOtherVariable\
    \ = false;\n\nif (PoliceVisible()) {\n    myStress++;\n\n    // 这里我们有两个 if 语句放在了彼此内部。\n\
    \    // 每当增加一层嵌套，我们也会相应增加\n    // 一个缩进级别。\n\n    if (GetSpeed() > GetSpeedLimit())\
    \ {\n        if (PoliceLightsFlashing())\n            SetSpeedMPH(0);\n      \
    \  else\n            SetSpeedMPH(GetSpeedLimit());\n    } else\n        myStress--;\n\
    }\n```\n\n在这里，我们检查是否有警察可见。如果是，我们的压力（自然地）就会稍微增加。然后我们检查我们的速度是否超过了限额。如果没有超速，我们的压力就会回到之前的水平。如果由于某种原因超过了限额，我们会检查警车辆的灯光是否在闪烁，并根据情况减速或停止。\n\
    \n随着每个嵌套层级增加缩进是一种有目的的编码风格选择——它有助于理解你的 if-then 语句的逻辑，并能帮助你快速确定哪些指令属于哪个 `if` 语句。关于缩进，有两种学派：一系列空格或使用\
    \ Tab 键。为了这些课程的目的，我们将使用 Tab 键——它的作用相同且需要的输入次数更少。再次，聪明地工作，而不是刻苦地工作。\n\n为了在我们的工具箱中增加最后一个技巧，我们还可以使用布尔逻辑运算符通过\
    \ AND（与）、OR（或）或 NOT（非）来修改或连接条件，并用括号设置优先级。对于不熟悉的人来说，**布尔逻辑**只是将条件连接起来的方式，例如 IF\
    \ 某些条件 AND 另一个条件。\n\n### 布尔逻辑\n\n| 布尔值 | 运算符 | 示例 | 含义 |\n\n| --- | --- | ---\
    \ | --- |\n\n| AND | `&&` | `if (a == 1 && b == 2)` | 如果 `a` 为 1 且 `b` 为 2 |\n\
    | OR | `||` | `if (a == 1 || b == 2)` | 如果 `a` 为 1 或 `b` 为 2 |\n| NOT | `!` |\
    \ `if ( !(a == 1 || b == 2) )` | 如果 `a` 等于 1 且 `b` 等于 2 的相反情况 |\n\n注意，如果你在 `if`\
    \ 语句中有多个条件，将每个条件封装在括号中可能是一个好主意，可以让代码更清晰，除非条件本身非常短。\n\n```\nif ((a == 1 && b ==\
    \ 2) || c)\n    DoSomething();\n```\n\n这个示例翻译为“如果 `a` 为 1 且 `b` 为 2，或者 `c` 的值不为零，调用\
    \ `DoSomething()`。”整数可以用于逻辑，例如在此所示。零被视为假，其他一切都被视为真，因此在这个示例中，如果条件 `c` 则为真。\n\n\
    ## 循环\n\n循环是 C 语言的一种特性，程序在特定条件为真时重复执行一组指令。C 有几种类型的循环，但今天我们只看一种：`for` 循环。`for`\
    \ 循环包含两个部分：括号内的控制部分和重复的指令块。\n\n```\n#include <stdio.h>\n\nint main(void)\n{\n\
    \    int number = 0;\n    // 这是我们的 for 循环\n    for (int i = 1; i < 10; i++) {\n\
    \        number += i;\n        printf(\"At step %d, the number is %d\\n\", i,\
    \ number);\n    }\n}\n```\n\n当我们运行这个程序时，输出如下：\n\n```\nAt step 1, the number is\
    \ 1\nAt step 2, the number is 3\nAt step 3, the number is 6\nAt step 4, the number\
    \ is 10\nAt step 5, the number is 15\nAt step 6, the number is 21\nAt step 7,\
    \ the number is 28\nAt step 8, the number is 36\nAt step 9, the number is 45\n\
    ```\n\n循环的控制部分包含三个部分：初始化、循环条件和步值。初始化将变量设置为循环的起始值。我们可以在循环部分声明它，也可以使用已经声明的变量。在循环部分声明索引变量是常见做法，许多程序员使用小写\
    \ `i`（索引的缩写）作为索引变量。\n\n循环条件是必须为真才能继续循环的表达式。在这种情况下，当 `i` 小于 10 时循环循环。\n\n## 应用概念\n\
    \n我们将尝试把在本节中学到的概念结合起来，用于一些更有实际用途的地方。当你申请汽车贷款时，知道还款金额会很有用，所以让我们编写一个计算还款的函数。使用的公式如下：\n\
    \n![A = (P * (r/12)) / (1 - (1 + r/12)^-n)](img/file1.png)\n\n| A = 还款金额 P = 本金\
