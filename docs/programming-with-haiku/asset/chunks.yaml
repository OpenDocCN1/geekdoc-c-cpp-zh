  trans: "\n\n# 构造与析构\n\n我们在 `Television` 类定义中看到的两个特殊函数是 C++ 语言本身的一部分。构造函数的主要任务是执行初始化对象所需的任何必要操作。当我们分配一个\
    \ `struct` 时，它的变量包含随机数据。对象的情况也是如此，但构造函数会为我们完成初始化工作。\n\n如果在类定义中没有声明构造函数，则该类会有一个默认构造函数。对象的默认构造函数不接受参数且不执行任何操作。我们的\
    \ `Television` 类定义了默认构造函数，但这并不是类的强制要求。然而，这样做会替换默认提供的构造函数并执行某些操作。类的构造函数也可以接受参数，例如以下两种可能性之一或其它形式：\n\
    \n```\nTelevision(const char *name);\n\nTelevision(bool isHD);\n```\n\n类的析构函数总是看起来是一样的：一个波浪号\
    \ (`~`)、类名，且不接受任何参数。如果在类定义中没有声明析构函数，系统会提供一个。和默认构造函数一样，它什么都不做。析构函数的主要任务是在对象实际释放之前进行清理工作。大多数情况下，这意味着释放在对象方法中某处分配的堆内存。\n\
    \n# 练习\n\n通过写下以下对象的示例类定义可能是什么样的（包括方法和属性），来练习面向对象编程思维：\n\n* 闹钟\n* 汽车\n* 炉子\n* 洗衣机\n\
    \n# 复习\n\n1. 什么是面向对象编程 (OOP)？\n2. 什么是类？\n3. 什么是方法？\n4. 什么是属性？\n5. 类的构造函数是做什么的？析构函数呢？\n\
    6. C++ 中对应 C 的 `malloc()` 和 `free()` 的什么？\n7. 为什么不使用 `malloc()` 和 `free()` 来分配和释放类对象？\n\
    8. 公有访问的方法与私有访问的方法有什么区别？\n9. 如何正确释放用 `new` 分配的数组？\n10. 什么是数据抽象？\n\n# 第 13 节\n\n\
    在上一节中，我们学习了一种专注于对象的设计、构建和交互以执行一个或多个任务的编程范式。我们还研究了 C++ 中的对象被称为类，它们的组成部分以及其他基础知识，但要成为一名精通的\
    \ Haiku 开发者，我们必须学习更多。\n\n## 继承\n\nHaiku 开发者编写的大部分代码与 `继承` 有关，即创建一个以另一个类为基类的类。例如，假设我们有一个\
    \ `Rectangle` 类，它具有高度、宽度，并提供了两个关于面积和周长的函数。那么创建一个 `RectangularSolid` 类就很简单，只需添加第三个维度和一个计算体积的函数即可。\n\
    \n如果 `RectangularSolid` 类的第三维度是它与普通 `Rectangle` 的唯一区别，那么为这两个类都编写计算面积和周长的代码似乎是很多无用功。如果我们能只为不同的部分编写代码，那就太棒了。继承使得成为可能：`RectangularSolid`\
    \ 类被称为 `Rectangle` 类的子类或派类。就像孩子从父母那里继承基因一样，子类从其父类继承方法和属性，我们的 `RectangularSolid`\
    \ 类继承了 `Rectangle` 的所有属性和方法。\n\n| | Rectangle | RectangleSolid |\n| --- | ---\
    \ | --- |\n| 属性 | 高 宽 | 高（继承）宽（继承）深 |\n| 方法 | 面积周长 | 面积（继承）周长（继承）体积 |\n\n继承允许我们重用已经写过的代码。代码重用是\
    \ C++ 编程的基础。再次，要聪明工作，不要蛮工作。\n\n为了将这个示例转换为代码，我们将编写两个类定义，每个类一个。\n\n```\nclass Rectangle\n\
    {\npublic:\n            Rectangle(int width, int height);\n    void        SetWidth(int\
    \ width);\n    int     Width(void);\n    void        SetHeight(int height);\n\
    \    int     Height(void);\n    int         Area(void);\n    int         Perimeter(void);\n\
    \nprivate:\n    int     fHeight;\n    int     fWidth;\n};\n\n// 这一行使得 RectangularSolid\
    \ 成为 Rectangle 的子类\nclass RectangularSolid : public Rectangle\n{\npublic:\n  \
    \          RectangularSolid(int width, int height, int depth);\n    // 我们不列出从\
    \ Rectangle 继承的方法——只列\n    // 子类中新增的方法\n    void        SetDepth(int depth);\n\
    \    int     Depth(void);\n    int     Volume(void);\n\nprivate:\n    int    \
    \ fDepth;\n};\n```\n\n`RectangularSolid` 类只声明了新的方法和属性。编写配合这些类的代码所需的比类定义本身让你思考的要多。这是我们第一次处理类的代码，所以请仔细研究这段代码和注释。\n\
    \n```\n// Rectangle 的构造函数。这将把对象的属性设置为\n// 传递它的值。在编写类方法的代码时，\n// 类名加两个冒号必须在方法名之前。\n\
    Rectangle::Rectangle(int width, int height)\n  : fWidth(width),\n    fHeight(height)\n\
    {\n    // 上述行在对象创建时\n    // 初始化对象的属性为指定的值（fWidth 为 width，fHeight 为 height）\n \
    \   // 这比在构造函数体中进行\n    // 显赋值更好。\n}\n\nvoid\nRectangle::SetWidth(int width)\n\
    {\n    fWidth = width;\n}\n\nint\nRectangle::Width(void)\n{\n    return fWidth;\n\
    }\n\nvoid\nRectangle::SetHeight(int height)\n{\n    fHeight = height;\n}\n\nint\n\
    Rectangle::Height(void)\n{\n    return fHeight;\n}\n\nint\nRectangle::Area(void)\n\
    {\n    return fWidth * fHeight;\n}\n\nint\nRectangle::Perimeter(void)\n{\n   \
    \ return (2 * fWidth) + (2 * fHeight);\n}\n\n// 这是 RectangularSolid 的构造函数。在创建\n\
    // RectangularSolid 时，它首先使用 Rectangle 的\n// 构造函数创建一个 Rectangle 对象。我们将宽度\n// 和高度传递给它，然后使用深度初始化\
    \ fDepth\nRectangularSolid::RectangularSolid(int width, int height, int depth)\n\
    \    :   Rectangle(width, height),\n        fDepth(depth)\n{\n}\n\nvoid\nRectangularSolid::SetDepth(int\
    \ depth)\n{\n    fDepth = depth;\n}\n\nint\nRectangularSolid::Depth(void)\n{\n\
    \    return fDepth;\n}\n\nint\nRectangularSolid::Volume(void)\n{\n    // 我们必须调用\
    \ Width() 而不是使用 fWidth，调用 Height()\n    // 而不是 fHeight，因为即使子类无法访问\n    // 对象的私有方法和属性。\n\
    \    return Width() * Height() * fDepth;\n}\n```\n\n"
- fmt: "\nThe real difference between this code and all of the code we’ve written\
    \ up to this point is that thinking in terms of objects forces us to organize\
    \ our code. Writing neat and organized code is imperative to making maintaining\
    \ it easier.\n\nThe only part of this code that might seem strange is the need\
    \ to call `Width()` and `Height()` in `Volume()`. It seems like it would make\
    \ more sense to allow child classes to be able to access `fWidth` and `fHeight`.\
    \ That is what `protected` access is for. It’s not needed or used nearly as much\
    \ as you might think, though.\n\nOne other point to note is the line which handles\
    \ the inheritance – it reads `public Rectangle`. This is the type of inheritance.\
    \ Almost all of the time you will use public inheritance. This means that the\
    \ access classes of the parent’s methods and properties do not change. Choosing\
    \ one of the other two types limits the access to the base class. Choosing `protected`\
    \ inheritance will make all public methods and properties of the base class `protected`\
    \ instead of `public`, making them available to all child classes, but closed\
    \ to the outside. Private inheritance makes all methods and properties of the\
    \ base class `private`, making the parent class totally inaccessible to both the\
    \ outside world and to any \"grandchild\" classes.\n\n## Virtual Functions\n\n\
    Not only is it possible for a child class to add new methods and properties, but\
    \ it can also change the behavior of existing methods. This is possible only when\
    \ the base class says that doing so is allowed. Adding the `virtual` keyword before\
    \ the return type in a method declaration grants this permission.\n\n```cpp\n\
    // A child class can redefine the behavior of this method\nvirtual void MyChangeableMethod(int\
    \ someInt);\n\n// A child class is required to define this method\nvirtual void\
    \ ThisMethodMustBeDefined(float someFloat) = 0;\n```\n\nBeing able to change how\
    \ a method works does **not** enable us to change the number or types of a method’s\
    \ parameters or its return type, however. The original version found in the parent\
    \ class doesn’t disappear completely either. It can be specified using the scope\
    \ operator, as exemplified below:\n\n```cpp\nvoid\nChildClass::DoSomething(void)\n\
    {\n    printf(\"Child class did something\\n\");\n    ParentClass::DoSomething();\n\
    }\n```\n\n## Static Functions\n\nYou usually have to have an instance of an object\
    \ to call one of its methods. This can be a hassle sometimes, but declaring a\
    \ method as `static` binds the method to the class, removing this requirement.\
    \ Static methods are called using the scope operator the same way that we did\
    \ for calling the parent implementation of a virtual function above.\n\n```cpp\n\
    class MyClass\n{\npublic:\n    MyClass(void);\n    int    DoSomething(void);\n\
    \    static int  DoSomethingStatic(void);\n};\n\nint\nmain(void)\n{\n    MyClass\
    \ myClassInstance;\n    // The regular way of calling a method\n    myClassInstance.DoSomething();\n\
    \n    // An instance not required for this one – just a slightly\n    // different\
    \ way to call the method\n    MyClass::DoSomethingStatic();\n\n    return 0;\n\
    }\n```\n\n## Overloading: Functions with the Same Name\n\nOne limitation of programming\
    \ in C that can be a real pain in the neck is that no two functions can have the\
    \ same name even if they have different parameters. C++ removes this limitation\
    \ so long as the compiler is able to figure out which version is being called\
    \ based on the number and types of arguments given to it. This will work:\n\n\
    ```cpp\nint MyFunction(int oneWay);\nint MyFunction(char *anotherWay);\nint MyFunction(float\
    \ aThirdWay);\n```\n\nThis, on the other hand, won’t work:\n\n```cpp\nint SomeMethod(const\
    \ char *oneConstString);\nint SomeMethod(const char *anotherString,\n        \
    \   const char *optionalString = NULL);\n```\n\nWhy doesn’t this work? If you\
    \ leave out the `optionalString` parameter, the compiler can’t figure out which\
    \ one you mean.\n\n## Assignment\n\nRead through the sections of the BeBook on\
    \ `BApplication`, `BWindow`, and `BView`. You don’t have to understand everything,\
    \ but try to get a feel for each class – in the next lesson we will be writing\
    \ our first *real* program for Haiku.\n\n## Review\n\n1. What is inheritance?\n\
    2. What is the difference between protected access and private access?\n3. What\
    \ is a virtual function?\n4. What is a static function?\n5. What is function overloading?\n\
    6. With respect to access the parent class' methods methods, what are the implications\
    \ of a child class using protected inheritance?\n\n# Lesson 14\n\nIf you’ve been\
    \ waiting excitedly for the chance to learn how to write a program that shows\
    \ something on the screen instead of just printing stuff on the Terminal, today’s\
    \ the day! We will spend most of our time understanding the code, but let’s talk\
    \ about tools and organization first.\n\n## Tools of the Trade: Integrated Development\
    \ Environments\n\nAll of our programs so far have been simple. Console programs,\
    \ as they are called, don’t have to be, but to learn the language, simple is good.\
    \ A text editor is all we’ve needed to do these simple programs which can all\
    \ fit into one file. Regular applications can have hundreds of files. Many experienced\
    \ C++ programmers are content with a text editor and Terminal, but having more\
    \ isn’t a bad thing, especially for novice coders.\n\nFor the rest of these lessons,\
    \ you will be encouraged – but not required, however – to use an Integrated Development\
    \ Environment (IDE). IDEs tie together the compiler, the code editor, the debugger,\
    \ and other tools so that a developer can work more efficiently. For the purposes\
    \ of these lessons, use of the Paladin IDE for Haiku will be assumed. If you prefer\
    \ another, that’s just fine. Let’s get started.\n\n## Our First Project\n\nRun\
    \ Paladin and you will be greeted by the start window. Choose to create a new\
    \ project. At the top of the New Project window is a menu where you can choose\
    \ what kind of project to create. Choose Empty. While we could choose GUI with\
    \ Window to automate what we are about to do, the act of typing the source code\
    \ will help us learn the basics of Haiku GUI better. Set your project name to\
    \ whatever you like. The Target Name is the name that the executable will have\
    \ when your project is built and is often the same as the project name. When you’re\
    \ ready to move on, click Create Project.\n\nAs of this writing, if you are using\
    \ a GCC4-based build of Haiku, you will need to add a library to your project\
    \ to be able to build it, but a future release of Paladin will remove this requirement.\n\
    \n1. In your project’s window, choose System Libraries from the Project menu.\n\
    2. Scroll down, check the box beside `libsupc++.so`, and close the window.\n3.\
    \ Now we will add a source file to our project. From the Project menu, choose\
    \ Add New File.\n4. When asked the name of your file, enter `App.cpp`, check the\
    \ box to create the corresponding header file, and click OK.\n\nIn general, there\
    \ is one class per pair of files and the base of the files’ names is the same\
    \ as the class that goes in it. Our first file, `App.cpp` will have one class:\
    \ `App`. The definition for the `App` class will go into the header file `App.h`.\
    \ All of the code for the class will go into `App.cpp`. If we had a couple of\
    \ really small related classes, it would be acceptable to put them both into the\
    \ same file, but the general rule of thumb is one class per file for organization’s\
    \ sake.\n\nLet’s start with adding what we need to `App.h`. Click ONCE on `App.cpp`\
    \ in the project window to select it, hold Alt and press Tab. You’ll notice that\
    \ `App.h` appears in the editor. The Alt-Tab key combination is a fast way of\
    \ jumping between a file’s header and its source file, but it only works if both\
    \ files have the same base name, such as `App.cpp` and `App.h`. Start by entering\
    \ the code below:\n\n```cpp\n// App.h\n\n// This is what is called the header\
    \ guard. It prevents the header from\n```\n"
