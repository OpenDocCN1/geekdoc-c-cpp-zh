    The reason why this causes the program to not print anything requires a little
    thought. The first line in the loop is supposed to save the last character of
    the string. By not subtracting 1 from the length, it saves the `NULL` terminator
    for the string into `temp` instead. The rest of the loop continues on pretty much
    as it should. `abcdef\0` becomes `\0fedcba`. Because the `NULL` terminator is
    at the very beginning of the string, when `printf()` goes to print it, it sees
    the terminator and stops, resulting in the reversed string not getting printed.


