    \ shuffleCount; i++)\n{\n    // 我们通过交换数组中的元素来洗牌。这很\n    // 类似于第 7 课中的 ReverseString\
    \ 函数，\n    // 我们选择数组中的随机元素进行交换。交换的\n    // 次数越多，洗牌效果就越好，特别是在牌组较大时，\n    // 所以根据牌组的大小来决定交换次数。\n\
    \    // ceil() 将浮点数向上取整，无论该数字\n    // 小数部分有多大。它返回一个 double 类型，\n    // 所以我们需要将其强制转换为\
    \ `uint16`，以防止\n    // 编译器报错。将浮点数和双精度浮\n    //转换为整数会丢弃小数部分，但由于我们已经使用\n    // ceil()\
    \ 对该部分进行了处理，所以这样做不会丢失\n    // 任何内容。\n    uint16 swapCount = uint16(ceil(numCards\
    \ * 1.25));\n    for (uint16 j = 0; j < swapCount; j++)\n    {\n        // rand()\
    \ 生成一个 0 到定义的常量\n        // RAND_MAX 之间的伪随机数，该值至少\n        // 为 32767。要生成随机数，使用公式：\n\
    \        // randomValue = rand() % rangeOfValues + minimumValue;\n        // 所以创建一个\
    \ 5 到 12 之间的值应该是\n        // rand() % 7 + 5;\n        // 在这里我们随机选择牌组中两张牌的索引\n\
    \        uint8 firstIndex = uint8(rand() % numCards);\n        uint8 secondIndex\
    \ = uint8(rand() % numCards);\n        if (firstIndex == secondIndex)\n      \
    \  {\n            // 如果两个索引相同，我们不想\n            // 浪费这次交换。因为每次当我们回到循环\n      \
    \      // 顶部时 j 都会增加，所以我们减少 j\n            // 来抵消这种增加，并获得\n            // 再次进行良好交换的机会。\n\
    \            j--;\n            continue;\n        }\n        // 执行换牌操作\n     \
    \   card tempCard;\n        tempCard.value = deck[firstIndex].value;\n       \
