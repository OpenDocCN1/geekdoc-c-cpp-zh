  trans: "\n`malloc()` 根据指定的大小为我们获取一块堆内存。该内存块的地址以 `void` 指针的形式返回给我们，因此通常在调用 `malloc()`\
    \ 时，其返回值会被强制转换为另一种指针的类型。如果 `malloc()` 无法获取请求的指定大小的内存块，它将返回 `NULL`。\n\n`free()`\
    \ 将堆内存归给系统。当像 `free` 这样的函数接受 `void` 指针作为参数时，仅意味着该函数将接受指向任何数据类型的指针。例如，在将一个堆分配的字符串传递给\
    \ `free()` 时，不需要进行类型转换。一旦指针传递给 `free()` 将内存归还系统，在未将其重新赋值为有效地址之前，它将无法再次使用。尝试使用已释放的内存块将产生不可预知的结果，但通常会导致段错误（segfault）。如果一个指针在内存被释放以后仍打算使用，通常会被赋值为\
    \ `NULL`，以表明它是无效的。\n\n`realloc()` 重新调整之前从 `malloc()` 获取的内存块的大小。它接收要调整的内存块指针以及所需的新大小。如果指针为\
    \ `NULL` 且大小大于 0，则 `realloc()` 的功能就像 `malloc()`。如果给定的指针有效且大小为 0，它的工作方式就像 `free`。这两种情况通常不会被使用，因为直接调用\
    \ `malloc()` 和 `free()` 代码会清晰得多。`realloc()` 可能移动也可能移动内存到不同的地址，如果移动了，它将返回新地址。即使指针移动到了不同的地址，内存块中现有的数据也会保留，但通过此调用获取任何新内存将包含随机数据。\n\
    \n使用这些内存函数并不困难。让我们通过一个简单的示例来看看它们是如何工作的。\n\n```\n#include <stdio.h>\n\n// 另一个新的包含文件！malloc.h\
    \ 包含了\n// malloc 和相关内存分配例的定义\n#include <malloc.h>\n\nint main(void)\n{\n    //\
    \ 在这个示例中，我们只需要打印一个字符串，\n    // 但这次我们将使用堆内存而不是栈内存。\n    // 此指针将存储我们字符串内存块的地址。\n\
    \    // 我们还没有为它分配内存，所以先将其设置为 NULL\n    char *string = NULL;\n\n    // 现在我们从操作系统请求一块堆内存，\n\
    \    // 并将地址赋予我们的字符串指针。\n    // (char *) 是我们为了将内存块类型从\n    // 无类型 (void *) 转换为\
    \ char 指针所需要的操作。请求了 50 字节，\n    // 这足够容纳 49 个字符和一个 NULL 终止符\n    string = (char\
    \ *)malloc(50);\n\n    // sprintf 是将数字转换为字符串的简单方法\n    sprintf(string, \"The number\
    \ pi is approx. %f\",3.1415927);\n\n    printf(\"%s\\n\", string);\n\n    // 这会将我们之前请求的\
    \ 50 字节堆内存\n    // 归还系统。\n    free(string);\n\n    // 我们的指针持有的地址不再有效。任何使用它的\n\
    \    // 尝试都将产生不可预知的结果，但最可能会导致\n    // 段错误。在这个示例中我们结束，但如果我们\n    // 再次需要该指针，我们需要将其赋值为一个有效地址\n\
    \    return 0;\n}\n```\n\n## 超越十进制：二进制数学\n\n现在，让我们花些时间学习一些未来课程中将需要的数学知识。就像计算机和人在计数起始数字上不同一样，它们各自用于计数的计数系统也天差地别。\n\
    \n人们使用十进制系统，也称为十进制。之所以被称为十进制，是因为每一列都有 10 种可能的值，从零到九。当你还很小的时候，你可能听过数学老师谈论“个位”、“十位”和“百位”。列的名称等同于\
    \ 10 的幂，指数是从右向左从 0 开始数的列数。\n\n| “千位” | “百位” | “十位” | “个位” |\n| --- | --- | ---\
    \ | --- |\n| 1000 = 10³ | 100 = 10² | 10 = 10¹ | 1 = 10⁰ |\n\n对于数字 5,234，总和是 (1000\
    \ x 5) + (100 x 2) + (10 x 3) + 4。\n\n与计算机交互的最底层层面涉及的数学，与我们作为人类任何用到的地方都非常遥远。计算机使用二进制数学——二进制计数。存在的数值只有\
    \ 1 和 0。二进制数学中的数字“位”看起来如下：\n\n| “八位” | “四位” | “二位” | “个位” |\n| --- | --- | ---\
    \ | --- |\n| 8 = 2³ | 4 = 2² | 2 = 2¹ | 1 = 2⁰ |\n\n二进制数学中的每一个单独数字被称为 `bit`（位）。它只是一位信息，并没有太大作用。二进制数学中的数字“位”看起来如下：\n\
    \n| “八位” | “四位” | “二位” | “个位” |\n| --- | --- | --- | --- |\n| 8 = 2³ | 4 = 2²\
    \ | 2 = 2¹ | 1 = 2⁰ |\n"
- fmt: "\nLet’s say that we have a variable which has the value 199 and we want to\
    \ turn off bit 2 and only bit 2. We’ll start with the number 255 – which has all\
    \ bits on – and subtract 2², which is 2 to the power of the number of the bit\
    \ we want to turn off. The number we want to use with AND is 251, that is, 255\
    \ - 4. The result of 199 AND 251 is 195.\n\n`199 & 251 = 195`\n\n| | Decimal |\
    \ Binary |\n| --- | --- | --- |\n| | 199 | `11000111` |\n| AND | 251 | `11111011`\
    \ |\n| = | 195 | `11000011` |\n\n## Bitwise OR\n\nBitwise OR is used in the opposite\
    \ way to AND – its purpose to turn on bits in a number, that is, set certain 0\
    \ bits in a number to 1.\n\n### Example 1\n\n192 | 15 = 207\n\n| | Decimal | Binary\
    \ |\n| --- | --- | --- |\n| | 192 | `11000000` |\n| OR | 15 | `00001111` |\n|\
    \ = | 207 | `11001111` |\n\n### Example 2\n\n8 | 64 = 72\n\n| | Decimal | Binary\
    \ |\n| --- | --- | --- |\n| | 8 | `00001000` |\n| OR | 64 | `01000000` |\n| =\
    \ | 72 | `01001000` |\n\nA bit is turned on whenever either bit is a 1. The math\
    \ is easier when turning on a specific bit. It is merely a matter of ORing the\
    \ number we want to change with a value of 2 to the power of the number of the\
    \ bit. If we have a variable containing 36 and we need to turn on bit 1, then\
    \ we OR our variable with 2¹, which is 2.\n\n### Example 3\n\n36 | 2 = 38\n\n\
    | | Decimal | Binary |\n| --- | --- | --- |\n| | 36 | `00100100` |\n| OR | 2 |\
    \ `00000010` |\n| = | 38 | `00100110` |\n\n## Bitwise XOR\n\nBitwise XOR is probably\
    \ the weirdest of all of the bitwise operators. XOR stands for eXclusive OR. It\
    \ is used for inverting bits because it returns 1 if either bit is a 1, but 0\
    \ if they have the same value.\n\n### Example 1\n\n36 ^ 255 = 219\n\n| | Decimal\
    \ | Binary |\n| --- | --- | --- |\n| | 36 | `00100100` |\n| XOR | 255 | `11111111`\
    \ |\n| = | 219 | `11011011` |\n\nXOR sets the output bits to 1 whenever the two\
    \ input bits are different. So it is the bitwise equivalent to the `!=` operator.\n\
    \n### Bitwise NOT\n\nBitwise NOT also flips bits like XOR does, but with less\
    \ control. It flips all of the bits in a number, just like the example above,\
    \ but it does not require a second value. Here is an example of how it can be\
    \ used:\n\n```c\nint a = 5;\nprintf(\"The value of ~%d is %d\\n\", a, ~a);\n```\n\
    \n## Shift Operations\n\nIn addition to flipping bits on and off, C and C++ provide\
    \ shift operators which let us quickly do some fast and fancy multiplication and\
    \ division.\n\n```c\na << b\n```\n\nShift the value of `a` to the left by `b`\
    \ places. This multiplies `a` by 2^b\n\n```c\na >> b\n```\n\nShift the value of\
    \ `a` to the right by `b` places. This divides `a` by 2^b It’s a little easier\
    \ to figure out why it’s called shifting by seeing what it actually does to the\
    \ bits themselves.\n\nBitwise shifting operators\n\n| Code | Mathematical Equivalent\
    \ | Result | Value in Binary (before) | Value in Binary (after) |\n| --- | ---\
    \ | --- | --- | --- |\n| `5 << 2` | `5 * 2²` | 20 | `00000101` | `00010100` |\n\
    | `32 << 1` | `32 * 2¹` | 64 | `00010000` | `01000000` |\n| `64 >> 1` | `64 /\
    \ 2¹` | 32 | `01000000` | `00100000` |\n| `7 >> 2` | `7 / 2²` | 1 | `00000111`\
    \ | `00000001` |\n\nKnowing shift operations is especially handy when operating\
    \ with values at bit level because they allow us to do specific kinds math, very\
    \ quickly. Multiplying or dividing by a power of 2 is common in these situations\
    \ and calls to `pow()` or using regular division are slower.\n\n## Bug Hunt\n\n\
    ### Hunt #1\n\n```c\n#include <stdio.h>\n#include <string.h>\n#include <malloc.h>\n\
    \nchar *ReverseString(char *string)\n{\n    // This function rearranges a string\
    \ so that is backwards\n    // i.e. abcdef -> fedba\n    if (!string)\n      \
    \  return NULL;\n\n    int length = strlen(string);\n    int count = length /\
    \ 2;\n\n    for (int i = 0; i < count; i++) {\n        char temp = string[length\
    \ - 1];\n        string[length - 1] = string[i];\n        string[i] = temp;\n\
    \    }\n\n    return string;\n}\n\nint main(void)\n{\n    char firstString[100],\
    \ secondString[100];\n    char *combinedString = NULL;\n\n    printf(\"Enter your\
    \ first word: \");\n    gets(firstString);\n\n    printf(\"Enter your second word:\
    \ \");\n    gets(secondString);\n\n    sprintf(combinedString,\"%s %s\",ReverseString(secondString),\n\
    \n    ReverseString(firstString));\n    printf(\"If you saw these two words in\
    \ a mirror, it would read '%s'\\n\",\n        combinedString);\n}\n```\n\nWhen\
    \ run, the program prints \"segmentation fault\" and nothing else.\n\n### Hunt\
    \ #2\n\n```c\n#include <stdio.h>\n#include <math.h>\n\nvoid MakeBinaryString(char\
    \ *outString, char valueToConvert)\n{\n    // Convert a 1-byte value to a string\
    \ that shows its value in\n    // binary. We do this by checking to see each bit\
    \ is on\n    // if it is, setting the character value to '1' or '0' if not.\n\
    \    for (int i = 0; i < 8; i++)\n    {\n        // Is the bit a 1?\n        //\
    \ The shifting is needed to quickly generate a power of 2\n        // so that\
    \ we check only 1 bit at a time, starting with bit 7\n        // and working its\
    \ way down.\n        if (valueToConvert & (1 << (7 - i)))\n            outString[i]\
    \ = '1';\n        else\n            outString[i] = '0';\n    }\n\n    outString[8]\
    \ = '\\0';\n}\n\nint main(void)\n{\n    char value = 5;\n    char binaryString[6];\n\
    \    MakeBinaryString(binaryString,value);\n    printf(\"The binary equivalent\
    \ of %d is %s\\n\",value, binaryString);\n    return 0;\n}\n```\n\nWhen run, the\
    \ program prints the following: The binary equivalent of 48 is 00000101 Segmentation\
    \ fault\n\n## Review\n\n1. Which memory pool is bigger, the stack or the heap?\n\
    2. What is a memory leak?\n3. What is portability?\n4. What is it called when\
    \ you tell the compiler to treat one type as another?\n5. What is the difference\
    \ between `malloc()` and `calloc()`?\n6. What is the numerical result of `7 &\
    \ 0`?\n7. What is the numerical result of `7 | 8`?\n8. What does 33 look like\
    \ in binary?\n9. What is the binary number 1000010 in regular decimal notation?\n\
    10. What is the numerical result of `1 << 5`?\n\n# Lesson 8\n\nBecause we’ve been\
    \ focusing on the structure of the C++ language so far, we haven’t given much\
    \ attention to getting information in and out of our program. Today we’ll change\
    \ this, but first, let’s take a quick look at a few niggling details that we’ve\
    \ been able to ignore until now.\n\n## Scope\n\nThis is not to be confused with\
    \ mouthwash, though considering the personal hygiene habits of some developers,\
    \ might not be a bad idea, either. Luckily, on the Internet, nobody knows you’re\
    \ a cat.\n\nScope in this case applies to variables. A variable’s scope is the\
    \ span of its existence. When a variable is declared, it has a definite beginning,\
    \ and it can’t be used before its declaration in the source code. It also disappears\
    \ completely when execution reaches the end of the block in which it is declared.\n\
    \nThere are three types of scope: local, global, and static. Local variables have\
    \ the shortest lifespan: they are declared within a code block, such as a function,\
    \ *for* loop, or *case* block, and disappear when execution leaves the block of\
    \ code.\n\nGlobal and static variables are declared outside of a function. They\
    \ can always be accessed, but the order in which they are initialized is not certain,\
    \ so be careful of globals that depend on the values of other globals. Global\
    \ variables can be accessed from anywhere. Static variables have the same lifetime\
    \ as global variables, but they can be accessed only from code within the file\
    \ in which they are declared. In other words, code in other files can’t get at\
    \ them.\n"
