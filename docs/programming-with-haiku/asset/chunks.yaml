  trans: "\n\n```cpp\nvoid MyWindow::MessageReceived(BMessage *msg)\n{\n    switch\
    \ (msg->what)\n    {\n        case M_SOME_MESSAGE:\n        {\n            DoSomething();\n\
    \            break;\n        }\n        default:\n        {\n            // 这调用了\
    \ MyWindow 的父类 BWindow \n            // 实现的 MessageReceived 版本。\n            BWindow::MessageReceived(msg);\n\
    \            break;\n        }\n    }\n}\n```\n\n`MessageReceived()` 可能会处理许多不同的消息代码，因此在这里调用了\
    \ `switch` 语句，并且 `switch` 使用 `what` 标识符来区分消息。调用 `BWindow` 版本的 `MessageReceived()`\
    \ 是重要的，因为它处理了所有被我们编写的版本所忽略的消息。\n\n了解 Haiku 中消息机制的工作原理最好是通过代码来学习，因此我们将查看第二个示例，它与上节课的示例非常相似，但扩展了我们已知的知识。我们将创建一个带有按钮的窗口。点击按钮将更改窗口标题，以显示自程序启动以来按钮被点击的次数。首先，让我们看看窗口类。这里所有的代码都可以在文件\
    \ `15ClickMe.zip` 中找到，但最好仍然手动输入所有代码，以增加你的熟悉 own。\n\n```cpp\n// MainWindow.h\n\
    #ifndef MAINWINDOW_H\n#define MAINWINDOW_H\n#include <Window.h>\nclass MainWindow\
    \ : public BWindow\n{\npublic:\n    MainWindow(void);\n    // 我们正在实现虚函数 BWindow\
    \ 方法 MessageReceived\n    // 这样我们可以处理按钮发送给窗口的消息\n    void MessageReceived(BMessage\
    \ *msg);\nprivate:\n    // 此属性将保存按钮被点击的次数。\n    int32 fCount;\n};\n#endif\n```\n\
    \n```cpp\n// MainWindow.cpp\n#include \"MainWindow.h\"\n// Button.h 存储了 BButton\
    \ 控件类的定义。\n#include <Button.h>\n// BView 类是一个用于在窗口内创建控件和绘制\n// 内容的通用类。\n#include\
    \ <View.h>\n// BString 类是一个极其实用的类，它消除了\n// 几乎与操作字符串相关的烦恼。\n#include <String.h>\n\
    // 这定义了我们的按钮发送的消息的标识符。\n// 单引号内的字母会被转换为整数。\n// M_BUTTON_CLICKED 的值是任意的，只要它是\n\
    // 唯一的，它具体是什么并不重要。注意，我们可以使用\n// #define 来定义消息常量，但使用枚举 (enum) 是更好的方法。\nenum\n{\n\
    \    M_BUTTON_CLICKED = 'btcl'\n};\nMainWindow::MainWindow(void)\n    :   BWindow(BRect(100,100,300,200),\"\
    ClickMe\",B_TITLED_WINDOW,\n             B_ASYNCHRONOUS_CONTROLS | B_QUIT_ON_WINDOW_CLOSE),\n\
    \        fCount(0)\n{\n    // 以几乎完全我们在上节课中创建标签的方式\n    // 创建按钮。BButton 构造函数内部的\
    \ BRect() 调用\n    // 是一个快捷方式，它消除了创建变量的需求。\n    BButton *button = new BButton(BRect(10,10,11,11),\"\
    button\",\n                        \"Click Me!\",\n                        new\
    \ BMessage(M_BUTTON_CLICKED));\n    // 像上节课的标签一样，让按钮自己选择\n    // 它的大小。\n    button->ResizeToPreferred();\n\
    \    // 将我们的按钮添加到窗口\n    AddChild(button);\n}\nvoid\nMainWindow::MessageReceived(BMessage\
    \ *msg)\n{\n    // BMessage 的标识方式是通过公共属性\n    // 'what' 完成的。\n    switch (msg->what)\n\
    \    {\n        // 如果消息是按钮发送给窗口的消息\n        case M_BUTTON_CLICKED:\n        {\n\
    \            fCount++;\n            BString labelString(\"Clicks: \");\n     \
    \       // 将 fCount 转换为字符串并附加到\n            // labelString 的末尾。下节课将介绍更多。\n   \
    \         labelString << fCount;\n            // 将窗口标题设置为我们创建的新新字符串\n        \
    \    SetTitle(labelString.String());\n            break;\n        }\n        default:\n\
    \        {\n            // 如果消息不匹配我们显式定义的\n            // 之一，它必须是某种系统消息，\n   \
    \         // 所以我们将调用 BWindow 版本的\n            // MessageReceived() 以便它可以处理它们。如果你希望\n\
    \            // 窗口按照你预期的方式运行，\n            // 这是必须的。\n            BWindow::MessageReceived(msg);\n\
    \            break;\n        }\n    }\n}\n```\n\n此程序的主要部分围绕 `M_BUTTON_CLICKED`\
    \ 分支展开。当按钮被添加到窗口时，它将窗口设置为其消息的目标，这样每当点击按钮时，窗口都会接收到 `M_BUTTON_CLICKED` 消息。当窗口接收到按钮的消息时，它会增加成员变量\
    \ `fCount` 并使用它生成一个新标题。\n\n创建标题并不困难，特别是当我们使用 `BString` 类时。C 语言的方法是分配一个足够容纳标题的字符串并使用\
    \ `sprintf()`，但 `BString` 的设计是为了让在 C++ 中处理字符串变得简单得多。内存分配由我们我们处理，并且有方法可以合并字符串、返回长度等等许多功能。`labelString\
    \ << fCount` 将 `fCount` 转换为字符串并将其附加到 `labelString` 所持字符串的末尾。\n\n保留在 `App.h` 和\
    \ `App.cpp` 中的其余部分代码与上节课的几乎完全相同。主要的区别是 `App.cpp` 包含了 `MainWindow.h`。通过包含它，我们拥有\
    \ `MainWindow` 类的定义，并且可以分配并显示一个。\n\n```cpp\n// App.h\n#ifndef APP_H\n#define APP_H\n\
    #include <Application.h>\nclass App : public BApplication\n{\npublic:\n    App(void);\n\
    };\n#endif\n```\n\n```cpp\n// App.cpp\n#include \"App.h\"\n#include \"MainWindow.h\"\
    \nApp::App(void)\n  : BApplication(\"application/x-vnd.test-ClickMe\")\n{\n  \
    \  MainWindow *mainwin = new MainWindow();\n    mainwin->Show();\n}\nint\nmain(void)\n\
    {\n    App *app = new App();\n    app->Run();\n    delete app;\n    return 0;\n\
    }\n```\n\n"
- fmt: "\n# Going Further\n\nHere are some possible changes you might like to explore\
    \ to make this program do more. I would encourage you to try some or all of these\
    \ changes. Experimentation leads to many \"Aha!\" moments and better programming.\n\
    \n- Change the numbers in the `BRect()` used to create the button and disable\
    \ the `ResizeToPreferred()` call to make the button really, really big – almost\
    \ as big as the window itself.\n- Move the button to one of the window’s corners\n\
    - Add a second button which sends a `B_QUIT_REQUESTED` message to the window to\
    \ make it close.\n- Create several buttons which move the window. (Hint: use a\
    \ different message ID for each, and call `BWindow`’s `MoveBy()` method in `MessageReceived()`)\n\
    \n# Lesson 16\n\nWhat with all of the emphasis on getting the hang of making Haiku\
    \ applications the last couple of lessons, you might be getting the impression\
    \ that we’re done learning C++, but there are some more aspects of the language\
    \ still waiting to be learned. We will address them as they are needed while learning\
    \ to write Haiku programs.\n\n## Function and Operator Overloading\n\nNormally\
    \ you think of overloading as being something you typically don’t want to do,\
    \ like overloading an electrical circuit. In C++, it’s something that we do all\
    \ the time to extend the usefulness of an existing function or language operator.\
    \ **Function overloading** defines several versions of a function which take different\
    \ sets of parameters. Operators are just functions, so things like plus and minus\
    \ signs can be extended to better integrate the classes we define with the rest\
    \ of the API. This gives us the ability to make our objects incredibly flexible\
    \ and convenient.\n\nIn last lesson’s project we saw our first example of operator\
    \ overloading with the `BString` class when we generated the title for the window.\
    \ It looked like this:\n\n```cpp\nBString labelString(\"Clicks: \");\n// This\
    \ adds the value of fCount to the end of labelString. More\n// on this next lesson.\n\
    labelString << fCount;\n```\n\nNormally the `<<` operator does a binary shift\
    \ left, but it works differently on a `BString`. The `<<` operator has been overloaded\
    \ to work as a more flexible shortcut for its `Append()` method, converting `fCount`\
    \ to a string and then tacking it on to the end of `labelString`. Any operator\
    \ in C++ can be overloaded, including array brackets, parentheses used for function\
    \ calls, and the arrow operator.\n\nLike many other aspects of C++, having the\
    \ ability to do something does not mean that you should do it, however. Making\
    \ the `+` operator perform subtraction can only lead to weeping and gnashing of\
    \ teeth, for example. Except in rare cases, overloaded operators should perform\
    \ pretty much the same operation as they do on other objects. In doing so, you\
    \ will prevent confusion and headaches.\n\nExcept for a select few, operator functions\
    \ may be implemented either as methods, i.e. part of a class, or regular functions.\
    \ There are benefits and drawbacks to each. For example, here are the two ways\
    \ that a `+` operator may be overloaded:\n\nMethod:\n\n```c++\nMyClass operator+(const\
    \ MyClass &from);\n```\n\nRegular function:\n\n```cpp\nMyClass operator+(const\
    \ MyClass &first, const MyClass &second);\n```\n\nAll other binary operators follow\
    \ this format. As a general rule, make binary operators regular functions so that\
    \ you can use the associated objects without having to explicitly typecast them.\
    \ The only operators that must be methods are assignment (`=`), function call\
    \ (`()`), subscript (`[]`), and member selection (`→`). Other assignment operators,\
    \ such as `+=` and `/=`, should be methods, but are not required to be.\n\nUnary\
    \ operators follow this format for implementation:\n\nMethod:\n\n```c++\nbool\
    \ operator!(void) const;\n```\n\nRegular function:\n\n```cpp\nbool operator!(const\
    \ MyClass &target);\n```\n\nThere are also a couple of special case operators\
    \ which deserve some attention. First of all, what about the `and` and `--` operators?\
    \ Each of them can be used two different ways. This means that there are two different\
    \ ways to overload them. When overloaded, both the prefix (`_i`) and postfix (`i++`)\
    \ versions must be implemented.\n\n```cpp\nclass MyClass\n{\n    // Preincrement\
    \ operator\n    MyClass operator++(void);\n\n    // Postincrement operator. The\
    \ integer is just a dummy argument to\n    // differentiate the two.\n    MyClass\
    \ operator++(int dummy);\n};\n```\n\nThe subscript operator (`[]`) also is a special\
    \ case because it can be on either side of an assignment. It is required to be\
    \ a method, so there is only one way to implement it:\n\n```cpp\nMyClass &operator[]\
    \ (const int index);\n```\n\nAs a convenience to keep all of this hard-to-remember\
    \ information, here is an almost-exhaustive table which organizes it into one\
    \ place.\n\nOperators overloading\n\n| Operator | Method | Regular |\n| --- |\
    \ --- | --- |\n| `+` | | Recommended |\n| `-` | | Recommended |\n| `*` | | Recommended\
    \ |\n| `*/` | | Recommended |\n| `%` | | Recommended |\n| `=` | Required | |\n\
    | `++` | Recommended | |\n| `+=` | Recommended | |\n| `-=` | Recommended | |\n\
    | `*=` | Recommended | |\n| `/=` | Recommende | |\n| `%=` | Recommended | |\n\
    | `--` | Recommended | |\n| `<` | | Recommended |\n| `<=` | | Recommended |\n\
    | `>` | | Recommended |\n| `>=` | | Recommended |\n| `==` | | Recommended |\n\
    | `!=` | | Recommended |\n| Bitwise | | Recommended |\n| `()` | | Required |\n\
    | `^` | | Recommended |\n| `~` | | Recommended |\n| `&&` | | Recommended |\n|\
    \ `||` | | Recommended |\n| `[]` | | Required |\n| `->` | | Required |\n| `<<`\
    \ | | Recommended |\n| `>>` | | Recommended |\n| `=` | | Required |\n| `*=` |\
    \ | Recommended |\n| `>>=` | | Recommended |\n| `^=` | | Recommended |\n| `124;=`\
    \ | | Recommended |\n\n## Copy Constructors\n\nHaving learned about constructors\
    \ and destructors in the last lesson, we’ve learned about most of the basics,\
    \ leaving out one related item: the copy constructor, but we’re going to address\
    \ it along the way as we deal with a problem with floating point.\n\nThe `float`\
    \ type isn’t terribly accurate. Add together 50 or 100 floating point numbers\
    \ and you won’t necessarily have exactly the result you would have if you were\
    \ to add them up with a calculator. This stems from how they are stored in memory.\
    \ Normally, this isn’t a problem, but if we were going to write a personal finance\
    \ program, any rounding error would be a major issue. We’re going to create a\
    \ type which is accurate to merely decimal places and no errors. First, let’s\
    \ start with a basic class definition and a quick `main()` function to test it\
    \ out.\n\n```cpp\n#include <SupportDefs.h>\n#include <stdio.h>\n\nclass Fixed\n\
    {\npublic:\n        Fixed(void);\n        ~Fixed(void);\n\n    float   GetValue(void);\n\
    \    void    SetValue(const int64 &value);\n\nprivate:    \n    int64   *fValue;\n\
    };\n\nFixed::Fixed(void)\n{\n    fValue = new int64();\n    *fValue = 0;\n}\n\n\
    Fixed::~Fixed(void)\n{\n    delete fValue;\n}\n\nfloat\n\nFixed::GetValue(void)\n\
    {\n    return float(*fValue) / 100.0;\n}\n\nvoid\nFixed::SetValue(const int64\
    \ &value)\n{\n    *fValue = value * 100;\n}\n\nint\nmain(void)\n{\n    Fixed f;\n\
    \    f.SetValue(1234);\n    printf(\"Value: %f\\n\",f.GetValue());\n    return\
    \ 0;\n}\n```\n"
