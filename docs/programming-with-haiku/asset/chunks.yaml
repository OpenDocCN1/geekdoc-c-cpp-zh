- fmt: "\n## Going Further\n\nWith what we now know about the Interface and Storage\
    \ Kits, there is a lot that is possible. You might want to go back and expand\
    \ on a previous project and see what you can do with it. If you haven’t tried\
    \ starting a project of your own yet, this might be a time to seriously consider\
    \ one. If not, very soon we will spend more than one lesson on a project the size\
    \ of which you might see in the real world to tie in everything we’ve been learning.\n\
    \n# Lesson 21\n\nAll of the projects that we have been working on have been small\
    \ ones which didn’t take very much time. Depending on the complexity, real world\
    \ programming projects can take months in development or more. Today we will start\
    \ working on a project which is small in comparison to many Haiku programs out\
    \ there but will take us more than one lesson to complete.\n\n## Assignment\n\n\
    Our project will be a relatively simple one. For about as long as UNIX has been\
    \ around there has been a command called `fortune` which displays a witty saying\
    \ of some sort. Often it would be run when the user logged in. We will be writing\
    \ a fortune program which displays a window instead of printing to the `Terminal`.\
    \ It will also improve upon the original because we will not limit it to one fortune\
    \ file. Instead, it will randomly choose a file in the `fortunes` directory and\
    \ choose a random entry from the file. We will also make it easy for the user\
    \ to get more than one fortune if he wishes.\n\nWe will organize our code into\
    \ two main parts: the GUI and the code which gets a fortune. The fortune code\
    \ will be one class which is responsible for choosing the fortune file from the\
    \ fortune directory, getting a random entry from the file, and returning it as\
    \ a string. The GUI will consist of a multiple line text box for the fortune,\
    \ a button to close the program, another to get another fortune, and an About\
    \ button for the purposes of showing who wrote the program and its version. This\
    \ kind of separation of code based on task is a good practice which makes for\
    \ reusable code.\n\n## BFile: Make Files Sit Up and Bark\n\nWell, maybe we can’t\
    \ make files act like dogs, but the `BFile` class is an extremely useful one which\
    \ gives us one place where we can do just about anything with a file: create files\
    \ and read, write, append, or even erase data, and because it inherits from `BNode`,\
    \ we can also add, remove, or change attributes. For those not familiar, attributes\
    \ are a BeOS specialty: data about a file that is not part of the file’s data,\
    \ but that is for another lesson. Here is a list of the most commonly-used methods\
    \ available to us via `BFile`:\n\n### BFile methods\n\n| Method | Description\
    \ |\n| --- | --- |\n| `status_t GetSize(off_t *size) const;` | Gets the size of\
    \ the file and places the value in `size`. |\n| `ssize_t Read(void *buffer, size_t\
    \ size);` | Attempts to read `size` bytes into `buffer`. The actual number of\
    \ bytes read is returned. |\n| `ssize_t Write(const void *buffer, size_t size);`\
    \ | Attempts to write `size` bytes into `buffer`. The actual number of bytes written\
    \ is returned. |\n| `off_t Seek(off_t offset, int32 seekMode);` | Moves the file\
    \ read/write pointer to a different location in the file. `seekMode` can be `SEEK_SET`,\
    \ `SEEK_CUR`, or `SEEK_END`. These seek modes move the pointer relative to the\
    \ beginning of the file, the current position, or the end of the file, respectively.\
    \ |\n| `off_t Position() const;` | Returns the location of the read/write pointer\
    \ relative to the beginning of the file. |\n| `status_t SetTo(const char *path,\
    \ uint32 openMode);` | Set the `BFile` object to the path specified in `path`.\
    \ There are other versions of this method, as well. See below for more information\
    \ on this method. |\n| `void Unset();` | Empties the `BFile` object, releasing\
    \ any file handles used. This method is automatically called when the `BFile`\
    \ object is destroyed. |\n| `status_t InitCheck() const;` | Returns the current\
    \ error status of the `BFile`. |\n\nSetting a `BFile` to a location involves a\
    \ little more than just giving it a file path. There are actually four different\
    \ versions of `SetTo()`. They take an open mode and either a string containing\
    \ the path, a `BEntry`, an `entry_ref`, or a `BDirectory` with a relative path\
    \ in a string. The open mode is a combination of the following flags which includes\
    \ a read or write mode:\n\n### BFile flags\n\n| Mode Flags | Description |\n|\
    \ --- | --- |\n| `B_READ_ONLY` | The `BFile` can read from, but not write to,\
    \ the file. |\n| `B_WRITE_ONLY` | The `BFile` can write to, but not read from,\
    \ the file. |\n| `B_READ_WRITE` | The `BFile` can read from and write to the file.\
    \ |\n| `B_CREATE_FILE` | Create the file if it doesn’t already exist. |\n| `B_FAIL_IF_EXISTS`\
    \ | Insist on creating a new file and failing if it exists. |\n| `B_ERASE_FILE`\
    \ | If the file exists, erase its data and attributes. |\n| `B_OPEN_AT_END` |\
    \ Set the read/write pointer to the file’s end. |\n\nThe constructors for `BFile`\
    \ have the same arguments as their respective `SetTo()` calls, but they don’t\
    \ return any error codes. Anything can go wrong when dealing with files.\n\n##\
    \ Reading and Writing Files with BFile\n\n`BFile` makes reading files easy. `Read()`\
    \ takes an untyped buffer to receive data from the file. Here’s the way to read\
    \ a file using `BFile`:\n\n```cpp\nstatus_t\nReadFile(const char *path)\n{\n \
    \   if (!path)\n        return B_BAD_VALUE;\n\n    // Set up the file to read\n\
    \    BFile file(\"/boot/home/Desktop/MyFile.txt\", B_READ_ONLY);\n\n    if (file.InitCheck()\
    \ != B_OK)\n    {\n        printf(\"Couldn't read the file\\n\");\n        return\
    \ B_ERROR;\n    }\n\n    off_t fileSize = 0;\n    file.GetSize(&fileSize);\n\n\
    \    if (fileSize < 1)\n    {\n        printf(\"File is empty, so no data to read\\\
    n\");\n        return B_OK;\n    }\n\n    // Create a buffer to hold the file\
    \ data\n    BString fileData;\n\n    // We can't directly pass a BString to Read(),\
    \ so we'll use the\n    // BString method LockBuffer() to get a pointer to its\
    \ internal\n    // storage. While the BString is locked, we can't use any of its\n\
    \    // methods, but we can make whatever changes we want to the\n    // string\
    \ array that it uses. LockBuffer() takes an\n    // integer of the maximum size\
    \ that the array will be expected to\n    // be. We'll pad the number just in\
    \ case so that there are\n    // unexpected crashes.\n    char *buffer = fileData.LockBuffer(fileSize\
    \ + 10);\n\n    // Read() will return the number of bytes actually read, but we're\n\
    \    // going to ignore the value because we're reading in the entire\n    //\
    \ file.\n    file.Read(buffer, fileSize);\n\n    // Unlock the BString so we can\
    \ use its methods again.\n    fileData.UnlockBuffer();\n\n    return B_OK;\n}\n\
    ```\n\nWriting files is even easier. `Write()` has the same parameters as `Read()`,\
    \ but instead of copying from the file to the buffer, data is copied from the\
    \ buffer to the file.\n\n```cpp\nvoid\nWriteFile(const char *path)\n{\n    if\
    \ (!path)\n    {\n        printf(\"NULL path sent to WriteFile\\n\");\n      \
    \  return B_BAD_VALUE;\n    }\n\n    // Create a file, if needed, and make it\
    \ both readable and writable\n    BFile file(path, B_READ_WRITE | B_CREATE_FILE);\n\
    \n    if (file.InitCheck() != B_OK)\n    {\n        printf(\"Couldn't write file\
    \ %s\\n\", path);\n        return B_ERROR;\n    }\n\n    char testString[] = \"\
    This is some file data.\\nIt's not really \"\n                \"important.\\n\"\
    ;\n    file.Write(testString,strlen(testString));\n\n    return B_OK;\n}\n```\n"
