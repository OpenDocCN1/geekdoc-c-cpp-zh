    \ are a BeOS specialty: data about a file that is not part of the file’s data,\
    \ but that is for another lesson. Here is a list of the most commonly-used methods\
    \ available to us via BFile:\n\nBFile methods\n\n| Method &#124; Description |\
    \  |\n| --- | --- |\n| *status_t GetSize(off_t *size) const;* | Gets the size\
    \ of the file and places the value in *size*. |\n| *ssize_t Read(void *buffer,\
    \ size_t size);* | Attempts to read *size* bytes into *buffer*. The actual number\
    \ of bytes read is returned. |\n| *ssize_t Write(const void *buffer, size_t size);*\
    \ | Attempts to write *size* bytes into *buffer*. The actual number of bytes written\
    \ is returned. |\n| *off_t Seek(off_t offset, int32 seekMode);* | Moves the file\
    \ read/write pointer to a different location in the file. seekMode can be *SEEK_SET*,\
    \ *SEEK_CUR*, or *SEEK_END*. These seek modes move the pointer relative to the\
    \ beginning of the file, the current position, or the end of the file, respectively.\
    \ |\n| *off_t Position() const;* | Returns the location of the read/write pointer\
    \ relative to the beginning of the file. |\n| *status_t SetTo(const char *path,\
    \ uint32 openMode);* | Set the BFile object to the path specified in *path*. There\
    \ are other versions of this method, as well. See below for more information on\
    \ this method. |\n| *void Unset();* | Empties the BFile object, releasing any\
    \ file handles used. This method is automatically called when the BFile object\
    \ is destroyed. |\n| *status_t InitCheck() const;* | Returns the current error\
    \ status of the BFile. |\n\nSetting a BFile to a location involves a little more\
    \ than just giving it a file path. There are actually four different versions\
    \ of *SetTo()*. They take an open mode and either a string containing the path,\
    \ a BEntry, an entry_ref, or a BDirectory with a relative path in a string. The\
    \ open mode is a combination of the following flags which includes a read or write\
    \ mode:\n\nBFile flags\n\n| Mode Flags | Description |\n| --- | --- |\n| *B_READ_ONLY*\
    \ | The BFile can read from, but not write to, the file. |\n| *B_WRITE_ONLY* |\
    \ The BFile can write to, but not read from, the file. |\n| *B_READ_WRITE* | The\
    \ BFile can read from and write to the file. |\n| *B_CREATE_FILE* | Create the\
    \ file if it doesn’t already exist. |\n| *B_FAIL_IF_EXISTS* | Insist on creating\
    \ a new file and failing if it exists. |\n| *B_ERASE_FILE* | If the file exists,\
    \ erase its data and attributes. |\n| *B_OPEN_AT_END* | Set the read/write pointer\
    \ to the file’s end. |\n\nThe constructors for BFile have the same arguments as\
    \ their respective *SetTo()* calls, but they don’t return any error codes. Anything\
    \ can go wrong when dealing with files, so make sure you check the error status\
    \ returned from *SetTo()* or call *InitCheck()* after creating a BFile. Also,\
    \ there are a limited number of file handles available on the system at any given\
    \ time. Each BEntry, BFile, BNode, or BDirectory uses one when set to a path,\
    \ so *Unset()* or delete them when you’re done with them.\n\n## Reading and Writing\
    \ Files with BFile\n\nBFile makes reading files really easy. *Read()* takes an\
    \ untyped buffer of bytes to receive data from the file and the amount of data\
    \ to read. When working with text data, normally you will use either a *char*\
    \ array or, even better, a BString. Here’s the way to read a file using BFile\
    \ and BString:\n\n```\n\nstatus_t\n\nReadFile(const char *path)\n\n{\n\n    if\
    \ (!path)\n\n        return B_BAD_VALUE;\n\n    // Set up the file to read\n\n\
