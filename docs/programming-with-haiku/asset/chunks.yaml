  trans: "\n\n```cpp\n// PictureView.h\n\n#ifndef PICTUREVIEW_H\n#define PICTUREVIEW_H\n\
    \n#include <Message.h>\n#include <Bitmap.h>\n#include <String.h>\n#include <View.h>\n\
    \nclass PictureView : public BView\n{\npublic:\n    PictureView(void);\n    ~PictureView(void);\n\
    \    void Draw(BRect rect);\n    void MouseUp(BPoint pt);\n\nprivate:\n    BBitmap\
    \ *fBitmaps[5];\n    int8 fBitmapIndex;\n};\n\n#endif\n```\n\n这看起来并没有什么特别。其实也没有。该类包含一个五个\
    \ `BBitmap` 指针的数组和一个用于指向当前位数的索引。在 `PictureView` 的主源文件中，情况变得稍微复杂了一些：\n\n```cpp\n\
    // PictureView.cpp\n\n#include \"PictureView.h\"\n#include <TranslationUtils.h>\n\
    #include <TranslatorFormats.h>\n\n// 这个类是我们自定义的特殊控件。它从应用程序资源中加载\n// 五张图像并将它们放入数组中。加载完成后，它会\n\
    //调整自身大小以精确适应第一个位图。这个假设是可以的，\n// 因为它们的大小都是相同的，而且任何问题最可能都是\n// 我们的错。大多数人不会编辑程序资源，如果他们要编辑，\n\
    // 就让他们承担行为的后果吧。 >:D\nPictureView::PictureView(void)\n :  BView(BRect(0,0,100,100),\
    \ \"picview\", B_FOLLOW_LEFT | B_FOLLOW_TOP,\n        B_WILL_DRAW),\n    fBitmapIndex(0)\n\
    {\n    // 使用循环加载我们所有的图片。BTranslationUtils::GetBitmap()\n    // 有 5 个不同的版本。这是两个从程序资源加载\n\
    \    // 图像的方法之一。\n    for (int8 i = 1; i <= 5; i++)\n    {\n        BBitmap *smiley\
    \ = BTranslationUtils::GetBitmap(B_PNG_FORMAT, i);\n        fBitmaps[i - 1] =\
    \ (smiley && smiley->IsValid()) ?\n                    smiley : NULL;\n    }\n\
    \    if (fBitmaps[0] && fBitmaps[0]->IsValid())\n        ResizeTo(fBitmaps[0]->Bounds().Width(),\n\
    \               fBitmaps[0]->Bounds().Height());\n}\n\nPictureView::~PictureView(void)\n\
    {\n}\n\n// BView 的 Draw() 函数在每次被要求在屏幕上\n// 绘制自己时被调用。这是 BView 绘制命令\n// 可以调用的少数地方之一。\n\
    void\nPictureView::Draw(BRect rect)\n{\n    // 出于性能考虑，默认绘制模式忽略 Alpha 透明度，\n  \
    \  // 所以我们将更改绘制模式以利用透明度信息。\n    SetDrawingMode(B_OP_ALPHA);\n    // 将 BView 的前景颜色设置为白色\n\
    \    SetHighColor(255,255,255);\n    // 用白色填充 BView 区域。和大多数 BView 绘制\n    // 命令一样，最后一个参数是使用的颜色，默认使用\n\
    \    // 高色。其他颜色选择是 B_SOLID_LOW（它使用\n    // 背景颜色）和 B_MIXED_COLORS（它会混合高色\n    //\
    \ 低色）。\n    FillRect(Bounds());\n    // 在屏幕上绘制当前位图\n    if (fBitmaps[fBitmapIndex])\n\
    \        DrawBitmap(fBitmaps[fBitmapIndex]);\n    // 将前景颜色设置为黑色\n    SetHighColor(0,0,0);\n\
    \    // 在视图周围绘制黑色边框\n    StrokeRect(Bounds());\n}\n\n// 鼠标处理有点意思。BView 针对鼠标有三个钩子函数：\n\
    // MouseDown()，当用户在指针位于视图上按下鼠标按钮\n// 时被调用；MouseUp，当用户在指针位于视图上释放鼠标\n// 按钮时被调用；以及\
    \ MouseMoved()，当鼠标在视图上\n// 改变位置时被调用。这让你（开发者）对视图\n// 如何对任何类型的鼠标事件做出反应具有了极大的控制权。\n\
    void\nPictureView::MouseUp(BPoint pt)\n{\n    // 转到数组中的下一张图像，如果到达末尾则循环回到\n// 开始。\n\
    \    if (fBitmapIndex == sizeof(*fBitmaps))\n        fBitmapIndex = 0;\n    else\n\
    \        fBitmapIndex++;\n    // 因为我们更改了图片，强制重绘整个视图\n    Invalidate();\n}\n```\n\
    \n"
- fmt: "\n```\nThis class does all of the real work for the application, including\
    \ handling the mouse clicks and showing the appropriate image. The code in `MainWindow.cpp`\
    \ just creates a background view and a `PictureView` instance.\n\nThe highlight\
    \ of this project is the call to `BTranslationUtils::GetBitmap()`. The only difference\
    \ between loading a PNG file and a JPEG file here would be a different type specifier\
    \ – no need to figure out how to read a JPEG file. All the heavy lifting has been\
    \ done for you. Woohoo!\n\n## Going Further\n\nThere’s quite a lot that you could\
    \ do with what you know now. It’s more a matter of getting to know the API and\
    \ how to use it and less about writing C++.\n\n*   Try figuring out how to use\
    \ `BView`’s `Pulse()` hook function to automatically change bitmaps each second.\
    \ Check the entry in the BeBook for exact details, but you’ll need to set the\
    \ flags sent to the `BView` constructor to `B_WILL_DRAW | B_PULSE_NEEDED` to use\
    \ the `Pulse()` function.\n\n## Classes and Methods to Remember\n\n### BTranslationUtils\n\
    \n*   `GetBitmap(const char *name, BTranslatorRoster = NULL)` – Looks for a file\
    \ in the path `name` and, if not found, looks for a resource named `name`. If\
    \ there is more than one with the same name, the first one is returned.\n*   `GetBitmap(uint32\
    \ type, int32 id, BTranslatorRoster = NULL)` – Returns the image contained in\
    \ the resource identified by `type` and `id`.\n*   `GetBitmap(uint32 type, const\
    \ char *name, BTranslatorRoster = NULL)` – Returns the image contained in the\
    \ resource identified by `type` and `name`.\n\n# Lesson 20\n\nAlthough our focus\
    \ in the last few lessons has been on the Interface Kit, another kit receives\
    \ quite a lot of attention when programming in Haiku: the Storage Kit. This kit\
    \ is devoted to working with files and folders on disk. We’ll be doing a fast\
    \ and furious crash course through it today. Don’t worry, though – it’s not very\
    \ difficult.\n\n## Overview of the Storage Kit\n\nThe kit can be divided into\
    \ six basic groups of classes.\n\nStorage Kit classes\n\n| Class | Description\
    \ |\n| :--- | :--- |\n| BFilePanel | A GUI control used to navigate the filesystem\
    \ and select a file or folder |\n| BRefFilter | A class for filtering `entry_ref`\
    \ objects. It is almost always used in combination with `BFilePanel`. |\n| BQuery\
    \ | Run a search of the filesystem using attributes. Queries work only on BFS\
    \ volumes. |\n| BVolume | This is a class which represents a disk volume, which\
    \ can be a hard disk partition, removable drive, disk image, or network share.\
    \ |\n| BVolumeRoster | This class provides the means to get information on all\
    \ volumes available on the system. |\n| BDirectory | `BDirectory` is a very useful\
    \ class. It gives you ways to read the contents of a directory, create files,\
    \ folders, and symbolic links, and it can find a specific entry, such as to ascertain\
    \ if it exists. |\n| BEntry | This is one of the most-used classes in the Storage\
    \ Kit. It represents an item in a directory, such as a file or folder. A `BEntry`\
    \ can tell you if a path exists, delete it, move it to somewhere else on the same\
    \ volume, and more. |\n| BEntryList | You won’t probably ever use a `BEntryList`\
