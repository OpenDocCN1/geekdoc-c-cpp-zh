  trans: "\n\n```c\n#include <stdio.h>\n\nint main(void)\n{\n    // 这个变量将是我们的“实验小白鼠”。\n\
    \    int myInt = 5;\n\n    // 声明一个我们知道它没有指向有效内存地址的指针。\n    int *uselessPointer\
    \ = NULL;\n\n    // 将此指针的值设置为 myInt 存储其值所处的内存地址。\n    // 如果不在它的名字前面不加 * 的话，它将被视为\n\
    \    // 一个普通变量，这将会产生一个编译错误。\n    // 在 myInt 前面的取地址符 (&) 获取了 myInt 的地址。\n    //\
    \ 注意，在 * 和指针名之间有空格是可以接受的。\n    int *intPointer = &myInt;\n\n    // %p 打印指针的地址。这个值会在程序的某一次\n\
    \    // 执行和另一次执行之间发生变化。\n    // 指针前面加一个 * 会返回其地址实际上 \n    // 所包含的数据，因此在这种情况下，*intPointer\
    \ 是 5。\n    printf(\"intPointer's address is %p and contains the value %d\\n\"\
    ,\n        intPointer, *intPointer);\n}\n```\n\n指针像数组一样，在使用时需要小心，因为它们可以让程序员很容易地导致程序发生段错误（segfault）。**始终将指针初始化为\
    \ `NULL` 或已知的良好地址**。你问 `NULL` 是什么？在引用指针时，它只是零的另一种表达方式。尽管 `NULL` 指针和未初始化的指针一样不可用——后者指向一个随机地址——但你确切知道它是不可用的。\n\
    \n## 字符串 (Strings)\n\n在第 3 中，我们学习了可以存储在变量中的不同类型的信息——类型，但我们漏掉了一个重要的类型：字符串。我们已经在\
    \ `printf()` 语句中使用它们了——一对双引号之间的所有内容都是一个字符串。\n\nC 和 C++ 中的字符串与其他数据类型非常不同。字符串是一个\
    \ `char` 值的数组，其最后一个字符是 `0`。`char` 变量可以用 0 到 255 之间的整数或字符常量（即用单引号括起来的字符，如 'a' 或\
    \ 'b'）来进行初始化。\n\n除了普通字母外，还有一些特殊字符。这些特殊字符都以反斜杠开头，出于内存要求的考虑，尽管输入它们时需要多一个字符，但它们只占用一个字节。注意，这些只对反斜杠（即向左“倾斜”的斜杠）有效，而不是正斜杠。\n\
    \n| 字符 | 字符代码 |\n| --- | --- |\n| 退格 | `\\b` |\n| 回车 | `\\r` |\n| 换页 | `\\f` |\n\
    | NULL (字符串终止符) | `\\0` |\n| 换行 | `\\n` |\n| 制表符 | `\\t` |\n| 反斜杠 | `\\\\` |\n\
    | 单引号 (') | `\\'` |\n| 双引号 (\") | `\\\"` |\n\n前四个在 Haiku 或 UNIX/Linux 编程中并不并不常用。回车符\
    \ `\\r` 用于代替换行符 `\\n` 在 Macintosh 计算机上开启新行。Windows 操作系统结合使用这两者来完成相同的任务——`\\r\\\
    n`。在处理来自其他操作系统的文本文件时，知道这一点非常有用。\n\n让我们来看一个只使用单个字符的示例。\n\n```c\n#include <stdio.h>\n\
    \nint main(void)\n{\n    // 这个循环打印大写字母表\n    for (char i = 65; i < 91; i++)\n\
    \        printf(\"%c\", i);\n\n    char endline = '\\n';\n    printf(\"%c\", endline);\n\
    }\n```\n\n处理字符串的方法有很多种，所以我们现在只看其中几种。理解所有这些最快的方法是看一些代码。仔细地阅读这个注释详尽的示例，以很好地掌握这一切。\n\
    \n```c\n#include <stdio.h>\n\n// 一个新的包含文件！这个包含了一系列专门处理字符串的函数\n#include <string.h>\n\
    \nint main(void)\n{\n    // 声明一个字符串，即 char 类型的数组\n    char string[30];\n\n   \
    \ // 用 0 填充字符串。虽然在 string.h 中包含一个\n    // “内存设置”函数可能看起来不符合直觉，但它经常被用于此类目的。\n\n\
    \    // memset：将内存块中所有字节的值设置为\n    // 特定的值\n    // 用法：memset(anArray, valueToAssign,\
    \ sizeOfTheArray);\n\n    // 这一调用将我们数组中的所有内容都设置为 0\n    memset(string,0,30);\n\
    \n    // 设置字符串中字符值的另一种方法：作为数组。在这里\n    // 我们逐个设置了字符。大写字母 A 的整数值为\n    // 65。\n\
    \    for (char i = 0; i < 26; i++)\n        string[i] = 65 + i;\n\n    printf(\"\
    String contains: %s\\n\", string);\n\n    // *另一种*设置字符串值的方法。sprintf()——想象\n  \
    \  // “string printf”——它打印到字符串而不是屏幕，\n    // 但其他方面与 printf() 相同。只需小心\n    // 打印的内容不要比你打印到的字符串大。如果是，\n\
    \    // 你的程序会愉快地崩溃。\n    // 用法：sprintf(aStringVariable,formatString, argumentList)\n\
    \    sprintf(string, \"%f\", 3.1415927);\n}\n```\n\n## 作业 (Assignment)\n\n程序员相比其他职业的优势之一是可以制作工具来帮助自己工作。让我们写一个程序，向用户获取一个单词，并打印出每个字符的整数值。\n\
    \n为了从用户获取获取，我们需要使用两个新函数：`gets()` 和 `strlen()`。它们都接受一个 `char` 指针作为唯一参数。我们将使用 `char`\
    \ 数组处理两者——记住数组可以像指针一样使用。\n\n*   `gets()` 从用户处获取字符串。用户可以输入他想要的内容，并在完成后按下 Enter\
    \ 键。用户输入的最后一个 `\\n` 字符将被替换为 0 以标记字符串结束。`inString` 是一个用于存储用户输入的 `char` 数组。\n\n\
    ```c\nchar * gets(char *inString);\n```\n\n*   `strlen()` 计算给它的 NULL 终止字符串的长度。警告一下：向它传递\
    \ `NULL` 字符串会导致你的程序崩溃。\n\n以下是我们将编写程序的步骤步骤：\n\n"
