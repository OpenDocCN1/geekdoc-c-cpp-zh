    \ can use its methods again.\n\n    fileData.UnlockBuffer();\n\n    return B_OK;\n\
    \n}\n\n```\n\nWriting files is even easier. Write() has the same parameters as\
    \ Read(), but instead of copying from the file to the buffer, data is copied from\
    \ the buffer to the file.\n\n```\n\nvoid\n\nWriteFile(const char *path)\n\n{\n\
    \n    if (!path)\n\n    {\n\n        printf(\"NULL path sent to WriteFile\\n\"\
    );\n\n        return B_BAD_VALUE;\n\n    }\n\n    // Create a file, if needed,\
