  trans: "\n我们正在评估的值放在 `switch` 语句的括号中。我们想要处理的每个值都由 `case` 块处理。这些 `case` 块定义了当我们评估的值与\
    \ `case` 中指定的值匹配时要执行的指令集。`case` 块的格式如下：\n\n```\ncase valueForCase:\n{\n    //\
    \ block of instructions\n}\n```\n\n`break` 语句在这里非常重要，因为它们在处理完特定的 `case` 后会跳出 `switch`\
    \ 语句。如果 `case` 末尾没有 `break`，执行将“贯穿”（fall through）并继续进入下一个 `case`。这几乎永远不是我们想要的。回到我们上面的例子，在空格的\
    \ `case` 末尾漏掉 `break` 会导致它被打印两次：一次针对空格 `case`，一次针对 `default` 情况，看起来可能像这样：\n\n\
    ```\nString[5]: <space>\nString[5]:\n```\n\n`default` 情况是所有不符合任何指定 `case` 的值的通用兜底。\n\
    \n## 条件赋值\n\n我们已经看到 C 和 C++ 为程序员提供了一些执行某些常见任务的快捷径方法，例如给变量加 1。另一种此类快捷径是具有三个部分的三元运算符。这里有一种根据条件给变量赋值的值的方法。\n\
    \n```\nint number;\n\nif (someOtherNumber > 5)\n    number = 1;\nelse\n    number\
    \ = 10;\n```\n\n这里是另一种更短的实现。\n\n```\nint number = (someOtherNumber > 5) ? 1 :\
    \ 10;\n```\n\n现在，你可能在想：“等一下，牛仔！这搞的是什么鬼话？”并且需要放下对《荒野传奇》（Bonanza）马拉松剧了。但话说回来，也许不需要。条件运算符包含两个部分：问号和冒号。它的工作原理格式如下：\n\
    \n```\ncondition ? valueIfConditionIsTrue : valueIfConditionIsFalse\n```\n\n条件周围不需要加括号，但有些人人（比如我）即使在没有必要的情况下也喜欢加上括号，以便将条件与其他部分区分开来。如果条件为真，则返回问号和冒号之间的值，否则返回冒号后面的值。它的用途可能很有限，但偶尔确实派得上用场。\n\
    \n## 漏洞搜寻\n\n### 漏洞 #1\n\n```\n#include <stdio.h>\n#include <string.h>\n\nchar\
    \ *ReverseString(char *string)\n{\n    // 这个函数重新排列字符串以使其反转\n    // 即 abcdef ->\
    \ fedcba\n\n    if (!string)\n        return NULL;\n\n    int length = strlen(string);\n\
    \    int count = length / 2;\n\n    for (int i = 0; i < count; i++) {\n      \
    \  char temp = string[length - i]; // 注意这里\n\n        string[length - i] = string[i];\n\
    \        string[i] = temp;\n    }\n\n    return string;\n}\n\nint main(void)\n\
    {\n    char inString[1024];\n\n    printf(\"Type a string to reverse:\");\n  \
    \  gets(inString);\n\n    printf(\"The reversed string is %s\\n\", ReverseString(inString));\n\
    \n    return 0;\n}\n```\n\n程序可以正常编译，但没有任何输出。\n\n通常情况下漏洞搜寻（Bug Hunt）部分不提供帮助，但这个比很多题目都要难。漏洞本身位于\
    \ `ReverseString()` 中的某处。尝试使用 `printf()` 调用在某些位置打印值，以便为你提供更多关于程序正在做什么的信息，例如打印长度、计数等。\n\
    \n## 复习\n\n1. 循环的三种类型是什么？\n2. 在什么情况下 `switch` 语句比 `if` 语句更适合做决策？\n3. 当 `switch`\
    \ 语句中的 `default` 情况不是列表中的最后一个情况时，会发生什么？\n4. 重写以下代码，使用条件赋值运算符来设置 `myVariable` 的值。\n\
    \n```\nif (myInt > 5)\n    myVariable = 50;\nelse\n    myVariable = 100;\n```\n\
    \n# 第 7 \n\n学习编程时最有趣的时刻莫过于一个绝妙的主意击中脑海，经过一番尝试后，你成功写出了属于自己的程序，实现了你想要的功能，并想：“天哪！快看！我刚刚让计算机*<在此处插入酷炫的成就>*！”这一节可能不会激发产生这些时刻，但就像吃蔬菜一样，它对你有好处。在继续之前，确保你已经理解了这一节。\n\
    \n## 内存：堆与栈\n\n你可能知道每个变量都会占用计算机的一些工作内存。如果你之前不知道，现在你一定知道了。你可能还不知道的是，操作系统执行的每个程序都有两个不同的内存池，从中创建变量：堆（heap）和栈（stack）。\n\
    \n`stack`（栈）是一个大小有限的快速内存池。当操作系统在运行之前将你的代码加载到内存时，主内存的一个部分会被留给程序的栈内存。在不深究细节的情况下，我们说它是很快，但也是有限的，如果你的程序耗尽了栈空间，它就会崩溃。使用栈存储大量大型数组是一个坏主意（Bad\
    \ Idea^TM）。我们到目前为止使用的变量都是从栈内存分配的。\n\n`heap`（堆）是计算机内存的主要部分。从中获取内存的速度要慢一些，但除非你决定分配大量的，否则就不必担心用尽。使用堆的一个缺点是你必须在程序退出时将其返回系统。不这样做会导致内存泄漏。\n\
    \n到目前为止我都在同时提到 C 和 C++我们所学的所有内容对于两者都是完全相同的。虽然两种方法都需要指针——我们处理的是内存地址——内存管理是它们之间相当不同之处。我们稍后会讨论\
    \ C++ 特有的概念。\n\nC 语言分配内存的方法是通过 `malloc()` 获取指向内存的指针，然后对指针调用 `free()` 来返回内存。还可以使用\
    \ `realloc()` 改变由 `malloc()` 给我们的内存的大小。正确使用这些函数需要一些解释，让我们逐一个地查看它们的声明。\n\n```\n\
    void * malloc(size_t size);\nvoid free(void *pointer);\nvoid * realloc(void *pointer,\
    \ size_t newSize);\n```\n\n在考虑每个函数的作用之前，显然有一些我们没见过的新类型。第一个新类型是 `size_t`，但它实际上并不那么新。相反，它是我们已知的整数类型的一种新名称。这种技巧通常是为了移植性——编写代码使其能够容易地在一个操作系统上编写并在另一个操作系统上编译。\n\
    \n我们在上面看到的另一个新类型是 `void` 指针。`void` 指针没有自己的类型，考虑到我们不能对它们使用 `***` 运算符，这听起来可能完全没用。但没关系。它们的用处在于可以传递任何类型的指针，当我们最终需要获取它们的值时，可以通过类型转换将其转换为另一种类型。\n\
    \n类型转换（typecasting），或简称转换（casting），是告诉编译器将一种类型视为另一种类型。内存中保持的值没有改变，但解释方式改变了。当我们以后开始研究\
    \ C++ 相比 C 的某些特性时，这将变得特别有用。\n"
- fmt: "\n`malloc()` obtains a block of heap memory for us, given a specified size.\
    \ The address of this block is returned to us as a `void` pointer, so normally\
    \ when `malloc()` is called, its return value is typecast to another pointer’s\
    \ type. If `malloc()` can’t get a block of the size requested, it returns `NULL`.\n\
    \n`free()` returns heap memory back to the system. When a function like `free`\
    \ takes a `void` pointer as a parameter, it simply means that the function will\
    \ accept a pointer to any data type. No casting is needed to pass, for example,\
    \ a heap-allocated string to `free()`. Once a pointer is passed to `free()` to\
    \ return its memory to the system, that pointer it can no longer be used without\
    \ being reassigned to a valid address. Attempting to use a block of memory that\
    \ has been freed will have unpredictable results, but normally causes a segfault.\
    \ If a pointer is intended to be used later on after having its memory freed,\
    \ it is normally assigned to `NULL` so that it is known to be invalid.\n\n`realloc()`\
    \ resizes a memory block previously obtained from `malloc()`. It is given the\
    \ pointer to the block of memory to be resized and the new size desired. If the\
    \ pointer is `NULL` and the size is greater than 0, then `realloc()` functions\
    \ just like `malloc()`. If given a valid pointer and a size of 0, it works just\
    \ like free. Both of these cases are not normally used because calling `malloc()`\
    \ and `free()` directly is much clearer code. `realloc()` may or may not move\
    \ the memory to a different address and, if it does, it returns the new address.\
    \ Existing data in the memory block is preserved, even if the pointer is moved\
    \ to a different address, but any new memory obtained with this call will contain\
    \ random data.\n\nWorking with these memory functions isn’t difficult. Let’s have\
    \ a look at some of them in action with a simple example.\n\n```\n#include <stdio.h>\n\
    \n// Another new include! malloc.h contains definitions for\n// malloc and related\
    \ memory-allocation routines\n#include <malloc.h>\n\nint main(void)\n{\n    //\
    \ We are just going to print a string in this example, but\n    // we are going\
    \ to use heap memory this time instead of the stack.\n    // This pointer will\
    \ hold the address of the memory block for our string.\n    // We don't have any\
    \ memory for it just yet, so we'll just set it to NULL\n    char *string = NULL;\n\
    \n    // Now we will request a block of heap memory from the operating system\n\
    \    // and give our string pointer its address.\n    // The (char *) is what\
    \ we need to do to cast our block of memory from\n    // having no type (void\
    \ *) to a char pointer. 50 bytes have been requested,\n    // which is enough\
    \ to hold 49 characters and the NULL terminator\n    string = (char *)malloc(50);\n\
    \n    // sprintf is an easy way to convert numbers into strings\n    sprintf(string,\
    \ \"The number pi is approx. %f\",3.1415927);\n\n    printf(\"%s\\n\", string);\n\
    \n    // This will give the 50 bytes of heap memory that we requested earlier\n\
    \    // back to the system.\n    free(string);\n\n    // The address that our\
    \ pointer holds is NO LONGER VALID. Any attempt\n    // to use it will have unpredictable\
    \ results, but most likely will cause\n    // a segmentation fault. We're done\
    \ in this example, but if we were\n    // to need the pointer again, we'd need\
    \ to assign it to a valid address\n    return 0;\n}\n```\n\n## Beyond Base 10:\
    \ Binary Math\n\nNow let’s take some time to learn some math that we will need\
    \ in future lessons. Just as computers and people are different in what number\
    \ they start counting with, the numbering systems that each uses to count are\
    \ worlds apart.\n\nPeople use the decimal system, also known as base 10. It is\
    \ called base 10 because there are 10 possible values in each column, from zero\
    \ to nine. When you were very young, you may have heard your arithmetic teacher\
    \ talk about the \"ones place,\" the \"tens place,\" and the \"hundreds place.\"\
    \ The name for the column is the same as 10 raised to the power of the number\
    \ of columns moving from right to left, counting from zero.\n\n| \"Thousands Place\"\
    \ | \"Hundreds Place\" | \"Tens Place\" | \"Ones Place\" |\n| --- | --- | ---\
    \ | --- |\n| 1000 = 10³ | 100 = 10² | 10 = 10¹ | 1 = 10⁰ |\n\nFor the number 5,234,\
    \ the total is (1000 x 5) + (100 x 2) + (10 x 3) + 4.\n\nThe math involved at\
    \ the bare metal level of interaction with computers is far removed from anything\
    \ that we, as people, would have any use for. Computers use binary math – base\
    \ 2 counting. The only values which exist are 1 and 0. The digit \"places\" in\
    \ base 2 math look like this:\n\n| \"Eights Place\" | \"Fours Place\" | \"Twos\
    \ Place\" | \"Ones Place\" |\n| --- | --- | --- | --- |\n| 8 = 2³ | 4 = 2² | 2\
    \ = 2¹ | 1 = 2⁰ |\n\nEach individual digit in binary math is called a `bit`. It’s\
    \ just a bit of information, and it doesn’t do much. The digit \"places\" in base\
    \ 2 math look like this: (Wait, the provided text contains some repetition/garbled\
    \ sections at the end, I will clean up the core logic provided in the source text).\n\
    \n*Note: The source text from \"Each individual digit in binary math...\" onwards\
    \ contains repetitive and fragmented sentences. I have processed the coherent\
    \ parts provided according to your rules.*\n\nEach individual digit in binary\
