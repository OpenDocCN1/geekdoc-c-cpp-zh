    \ (`#include`) that we have been using contains helper functions for working with\
    \ strings?\n\n# Lesson 6\n\nThis time around we are mostly going to expand on\
    \ things we already know. Back in Lesson 4, we learned about executing pieces\
    \ of code only if certain conditions are met with `if` statements and we also\
    \ saw how to repeat a set of instructions with `for` loops. Let’s add a few more\
    \ tools to our kit.\n\n## More Loops\n\nAlthough they are probably the most common,\
    \ there are more kinds of loops than just `for` loops. In fact, there are two\
    \ other closely-related loops: the `while` loop, and the `do-while` loop.\n\n\
    `while` loops are simpler, having just a loop condition that causes the code in\
    \ the loop to be repeated until the loop condition is false. Let’s take a look\
    \ at a way to do our project from Lesson 5 using a `while` loop.\n\n```c\n#include\
    \ <stdio.h>\n\nint main(void)\n{\n    char inString[1024];\n\n    printf(\"Type\
    \ some text and hit Enter:\\n\");\n    gets(inString);\n\n    int i = 0;\n   \
    \ while (inString[i])\n        printf(\"String[%d]: %c\\n\", i, inString[i++]);\n\
    \n    return 0;\n}\n```\n\nIn the above example, we even take a shortcut so that\
    \ curly braces aren’t needed – a postincrement operator increases the index variable\
    \ `i` after the message is printed. The condition for the loop checks to see if\
    \ `inString[i]` is a valid character. Integers can be used for boolean logic,\
    \ that is, true/false tests. Zero is treated as false and everything else is true,\
    \ so this loop will repeat until the index points to the 0 that terminates the\
    \ string. Pretty slick, eh?\n\nAside from the `while` statement and the accompanying\
    \ condition block, the rest of the loop works just like a `for` loop, so we could\
    \ just as easily substitute our `printf()` statement with a group of instructions\
    \ inside a pair of curly braces. One caveat to using this kind of loop: it’s pretty\
    \ easy to end up in an endless loop if you are not careful to ensure that the\
    \ loop condition is eventually false. In this instance, we would have an endless\
    \ loop on our hands if the `inString[i++]` were just `inString[i]`.\n\nThe `do-while`\
    \ loop is not used as often as others, but it does come in handy on occasion.\
    \ It executes the loop instructions once and then checks afterward to see if they\
    \ need to be done again. Here is the same example using a `do-while` loop.\n\n\
    ```c\n#include <stdio.h>\n\nint main(void)\n{\n    char inString[1024];\n\n  \
    \  printf(\"Type some text and hit Enter:\\n\");\n    gets(inString);\n\n    int\
    \ i = 0;\n    do\n    {\n        printf(\"String[%d]: %c\\n\", i, inString[i++]);\n\
    \    } while (inString[i]);\n\n    return 0;\n}\n```\n"
  raw: "1.  Make a *char* array to hold the information from the user\n\n2.  Call\
    \ *gets()* to get the information from the user and store it into our array.\n\
    \n3.  Make an *int* variable and set it to the string’s length\n\n4.  Use a *for*\
    \ loop to print each character in the string both as a character and its numerical\
    \ value\n\n```\n#include <stdio.h>\n#include <string.h>\n\nint main(void)\n{\n\
    \    char inString[1024];\n\n    printf(\"Type the text to convert and press Enter:\
    \ \");\n    gets(inString);\n\n    // Here's where you come in.\n    // Use the\
    \ steps above to figure out what goes here.\n    // Steps 1 and 2 have already\
    \ been done for you.\n\n    return 0;\n}\n```\n\nMake your project print the character\
    \ code as hexadecimal (base 16) numbers and/or octal (base 8) in addition to regular\
    \ (base 10) numbers. See Lesson 3 for more information.\n\nClosely look over the\
    \ code examples in the earlier section on strings for hints on how to do step\
    \ 4\\. Also, have a second look at the list of placeholders used in *printf()*\
    \ from Lesson 3.\n\nWhenever the compiler builds this project, it complains that\
    \ *gets()* is dangerous and shouldn’t be used. Why do you think this might be?\n\
    \n## Bug Hunt\n\n### Hunt #1\n\n```\n#include <stdio.h>\n\nint main(void)\n{\n\
    \    int number = 0;\n\n    for (int i = 1; i < 10; i)\n    {\n        number\
    \ += i;\n        printf(\"At step %d, the number is now %d\\n\", i, number);\n\
    \    }\n}\n```\n\nThe code builds just fine, but it won’t stop running printing\
    \ stuff on the screen and the only way to stop it is either press Ctrl+C or close\
    \ the Terminal window.\n\n### Hunt #2\n\n```\n#include <stdio.h>\n\nint main(void)\n\
    {\n    int a;\n    int b, c;\n\n    a = 1;\n    b = 2;\n    c = 3;\n\n    printf(\"\
    a is %d, b is %d, and c is %d.\\n\", a, b);\n\n    return a + b + c;\n}\n```\n\
    \nfoo.cpp: In function ‘int main()’: foo.cpp:12: warning: too few arguments for\
    \ format\n\n## Lesson Review\n\n1.  What is a segmentation fault?\n\n2.  What\
    \ is the last valid index for an array with 10 elements?\n\n3.  Why is it important\
    \ to initialize a pointer to a known-good value or to NULL?\n\n4.  Which of these\
    \ is a string, *‘a’* or *“a”* ?\n\n5.  A string is an array of what type?\n\n\
    6.  Which header file (#include) that we have been using contains helper functions\
    \ for working with strings?\n\n# Lesson 6\n\nThis time around we are mostly going\
    \ to expand on things we already know. Back in Lesson 4, we learned about executing\
    \ pieces of code only if certain conditions are met with *if* statements and we\
    \ also saw how to repeat a set of instructions with *for* loops. Let’s add a few\
    \ more tools to our kit.\n\n## More Loops\n\nAlthough they are probably the most\
    \ common, there are more kinds of loops than just *for* loops. In fact, there\
    \ are two other closely-related loops: the *while* loop, and the *do-while* loop.\n\
    \n*while* loops are simpler, having just a loop condition that causes the code\
    \ in the loop to be repeated until the loop condition is false. Let’s take a look\
    \ at a way to do our project from Lesson 5 using a *while* loop.\n\n```\n#include\
    \ <stdio.h>\n\nint main(void)\n{\n    char inString[1024];\n\n    printf(\"Type\
    \ some text and hit Enter:\\n\");\n    gets(inString);\n\n    int i = 0;\n   \
    \ while (inString[i])\n        printf(\"String[%d]: %c\\n\", i, inString[i++]);\n\
    \n    return 0;\n}\n```\n\nIn the above example, we even take a shortcut so that\
    \ curly braces aren’t needed – a postincrement operator increases the index variable\
    \ *i* after the message is printed. The condition for the loop checks to see if\
    \ *inString[i]* is a valid character. Integers can be used for boolean logic,\
    \ that is, true/false tests. Zero is treated as false and everything else is true,\
    \ so this loop will repeat until the index points to the 0 that terminates the\
    \ string. Pretty slick, eh?\n\nAside from the *while* statement and the accompanying\
    \ condition block, the rest of the loop works just like a *for* loop, so we could\
    \ just as easily substitute our *printf()* statement with a group of instructions\
    \ inside a pair of curly braces. One caveat to using this kind of loop: it’s pretty\
    \ easy to end up in an endless loop if you are not careful to ensure that the\
    \ loop condition is eventually false. In this instance, we would have an endless\
    \ loop on our hands if the *inString[i++]* were just *inString[i]*.\n\nThe *do-while*\
    \ loop is not used as often as others, but it does come in handy on occasion.\
    \ It executes the loop instructions once and then checks afterward to see if they\
    \ need to be done again. Here is the same example using a *do-while* loop.\n\n\
    ```\n#include <stdio.h>\n\nint main(void)\n{\n    char inString[1024];\n\n   \
    \ printf(\"Type some text and hit Enter:\\n\");\n    gets(inString);\n\n    int\
    \ i = 0;\n    do\n    {\n        printf(\"String[%d]: %c\\n\",i,inString[i]);\n\
    \    } while (inString[i++]);\n\n    return 0;\n}\n```\n\nWe print a character,\
    \ check to see if it’s zero – which all proper strings end with – and print another\
    \ character if it’s not a zero. Note that a semicolon is required after the *while*\
    \ condition in this kind of loop unlike the *for* and regular *while* loop. Luckily,\
    \ if you should happen to forget it, the compiler will complain about it.\n\n\
    ```\nfoo.cpp: In function ‘int main()’:\nfoo.cpp:13: error: expected `;' before\
    \ ‘}’ token\n```\n\nThere’s a problem with using this loop for this job: if the\
    \ user just hits Enter without typing anything in, it prints a blank character.\
    \ If the user didn’t effectively enter anything, we should skip printing it entirely.\
    \ This particular task is better suited to using a *for* loop because it requires\
    \ less work, but we can make using this one work by adding one more bit of code.\n\
    \n```\ndo {\n    // This will prevent problems caused by the user not typing anything\n\
    \    if (!inString[i])\n        continue;\n\n    printf(\"String[%d]: %c\\n\"\
    ,i,inString[i]);\n} while (inString[i++]);\n```\n\nThe *if* condition here checks\
    \ to see if the current character is zero – by using a *!*, which evaluates as\
    \ a boolean NOT. The zero character, which is normally considered false, will\
    \ make the *if* statement condition true and the program will execute the *continue*\
    \ statement. *continue* causes program execution to skip directly to the loop’s\
    \ condition block. The zero character that caused the jump to the loop condition\
    \ will also cause the condition to be false and the loop will exit.\n\nUsing *continue*\
    \ this way, though, is not something you’d normally see. Cases like this normally\
    \ would call for a *break* statement, which jumps immediately out of the current\
    \ code block. *break* would skip checking the loop condition and just exit the\
    \ loop. We’ll use *break* statements almost all of the time with our next concept:\
    \ the *switch* block.\n\n## *switch* blocks\n\nSometimes we have to deal with\
    \ making a decision based on one of several possible values for a variable. This\
    \ could be handled with a series of *if-else* statements, but C and C++ give us\
    \ *switch* statements to do the job much more elegantly. Let’s expand our string-printing\
    \ project to provide a way to print characters that don’t show anything when printed,\
    \ like spaces and tabs.\n\n```\n#include <stdio.h>\n\nint main(void)\n{\n    char\
    \ inString[1024];\n\n    printf(\"Type some text and hit Enter:\\n\");\n    gets(inString);\n\
    \n    int i = 0;\n    while (inString[i]) {\n        switch (inString[i]) {\n\
    \            case '\\n':\n            {\n                printf(\"String[%d]:\
    \ <carriage return>\\n\",i);\n                break;\n            }\n        \
    \    case '\\t':\n            {\n                printf(\"String[%d]: <tab>\\\
    n\",i);\n                break;\n            }\n            case ' ':\n      \
    \      {\n                printf(\"String[%d]: <space>\\n\",i);\n            \
    \    break;\n            }\n            default:\n            {\n            \
    \    printf(\"String[%d]: %c\\n\",i,inString[i]);\n                break;\n  \
    \          }\n        }\n\n        i++;\n    }\n    return 0;\n}\n```"
