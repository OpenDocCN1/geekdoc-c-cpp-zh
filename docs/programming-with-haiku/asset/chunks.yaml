    0' };\n\n// 声明一个可以容纳最多 15 个字符字符串的数组，包括\n// NULL 终止符。这比使用字符常量和括号好得多。\nchar myFastString[15]\
    \ = \"abcde\";\n\n// 省略尺寸告诉编译器分配足够的内存来存储\n// 该字符串。这节省了调用 `strlen()` 或我们自己计数的次数。\n\
    char myLongString[] = \"This is some really long string I don't have to count.\"\
    ;\n\n// 如果我们初始化了其他类型的一维数组，也可以省略其尺寸。\nint myIntArray[] = { 0, 1, 2, 3, 4, 5 };\n\
    \n// 这与 myLongString 的声明具有相同的结果。这也是\n// 更常用的做法。\nchar *anotherLongString = \"\
    This is some other really long string.\";\n```\n\n另一个实用的提示：**不要**尝试在超过一个维度的数组上省略尺寸。在声明多维数组时，只有可以对列出的最左侧维度省略尺寸，将两者混合只会导致混惑。听我的没错。\n\
    \n再次，我们在短时间内涵盖了大量内容，所以让我们快速回顾一下：\n\n*   整数可以加或减到指针所持有的地址。\n*   `sizeof()` 返回类型、变量或数组的大小，以字节为单位。\n\
    *   你可以使用指针算术获取数组中元素的值。\n*   为数组分配的内存是连续的。\n*   数组可以声明为具有多个维度，并以这种方式访问，或使用指针将其重新解释为一个很长的元素列表。\n\
    *   `char` 数组（字符串）可以使用普通字符串进行初始化。\n*   非字符串数组使用大括号初始化。\n*   数组中的所有元素都已初始化。\n\n\
    ## 复习\n\n### 整数\n整数可以加或减到指针所持有的地址。\n\n### sizeof\n`sizeof()` 返回类型、变量或数组的大小，以字节为单位。\n\
    \n### 指针运算\n你可以使用指针算术获取数组中元素的值。\n\n### 内存分配\n为数组分配的内存是连续的。\n\n### 多维数组\n数组可以声明为具有多个维度，并以这种方式访问，或使用指针重新解释为一个很长的元素列表。\n\
    \n### 字符串初始化\n`char` 数组（字符串）可以使用普通字符串进行初始化。\n\n### 大括号初始化\n非字符串数组使用大括号初始化。\n\n\
    ### 数组元素\n数组中的所有元素都已初始化。\n\n### 尺寸与数组\n如果我们初始化了其他类型的一维数组，也可以省略其尺寸。然而，**不要**尝试在超过一个维度的数组上省略尺寸。\n\
    \n## 引用\n\n在这种情况下，引用不是你在库中找到的东西。相反，它们是指针和普通变量的混合体。在不需要使用星号获取其值方面，它们被视为普通变量，但它们没有用于存储数据的独立内存。相反，它们使用另一个变量的空间。这是一个引用声明的示例：\n\
    \n```\nint myInt;\nint &myRef = myInt;\n```\n\n`int` 和 `myRef` 之间的间隔符号 (`&`) 是声明普通变量和引用的区别。在这个示例中，`myRef`\
    \ 是 `myInt` 的引用。对于所有实际目的，`myRef` 只是 `myInt` 的另一个名字。改变其中一个就会改变另一个的值。这对于有效内存位置的指针也有效。观察：\n\
    \n```c\n#include <stdio.h>\n#include <malloc.h>\n\nint main(void)\n{\n    // 创建一个指向堆内存的指针并初始化它\n\
    \    int *myPointer = (int*) malloc(sizeof(int));\n    *myPointer = 1;\n\n   \
    \ // 为 myPointer 的位置创建一个引用。\n    int &myRef = *myPointer;\n    myRef++;\n\n  \
    \  printf(\"The value at myPointer's location is %d\\n\",*myPointer);\n\n    free(myPointer);\n\
    \n    return 0;\n}\n```\n\n"
- fmt: "\nReferences are a feature that makes you want to say, \"OK, that’s nice.\
    \ Let’s move along now,\" but there’s more than meets the eye here. First of all,\
    \ you can’t change the location that a reference points to, so `myRef` will always\
    \ refer to the address that `myPointer` points to – even if `myPointer` changes\
    \ – so trying to use `myRef` after `myPointer` has been freed will cause a segmentation\
    \ fault. This unchangeability is actually a good thing. A reference has to be\
    \ initialized and can’t be uninitialized, so it will always be valid unless the\
    \ memory it refers to has been freed or if the variable it refers to goes out\
    \ of scope. This makes references a great deal safer than pointers at the expense\
    \ of some flexibility.\n\n## Parameter Use: by Reference or by Value\n\nThere\
    \ is more than one way to get data out of a function. The usual way is the value\
    \ it returns, but references provide another. Normally, when a parameter is passed\
    \ to a function, a copy of the variable is passed to the function – the `value`\
    \ of the parameter has been sent to the function, not the variable itself. This\
    \ means that you can change the parameter without causing trouble outside the\
    \ function. When a reference to a parameter is given to a function, any changes\
    \ that the function makes to it continue on after it exits. Changing a function\
    \ to pass a parameter by reference is as simple as adding an ampersand (`&`) in\
    \ front of the parameter’s name.\n\n```cpp\nconst char * someFunction(int &integerByReference);\n\
    float someOtherFunction(const double &doubleByReference);\n```\n\nIn this example,\
    \ not only does `someFunction` spit out a string, but it can also tweak `integerByReference`,\
    \ allowing us to get two values from one function call instead of just one. `someOtherFunction`\
    \ uses a constant reference. While this might seem silly – passing a reference\
    \ that you can’t change – but it does have a purpose: it saves a copy. This is\
    \ one way to speed up a function that is frequently called, especially if it has\
    \ a lot of parameters or if a parameter takes up a lot of memory.\n\nJust to make\
    \ sure that we have a pretty good handle on the difference between passing a variable\
    \ by value and passing one by reference, let’s look at a code example that illustrates\
    \ the difference.\n\n```cpp\n#include <stdio.h>\n\n// This function passes x by\
    \ reference and y by value\nint myFunction(int &x, int y)\n{\n    x = x * 2;\n\
    \    y = y + 5;\n\n    return x * y;\n}\n\nint main(void)\n{\n\n    // Create\
    \ a couple of variables for our work\n    int foo = 5;\n    int bar = 10;\n\n\
    \    int outValue = myFunction(foo,bar);\n\n    printf(\"foo is %d, bar is %d,\
    \ and myFunction(foo,bar) is %d\\n\",\n\n    foo,bar,outValue);\n\n    return\
    \ 0;\n}\n```\n\nIn this example `foo` starts with a value of 5, but because `myFunction()`\
    \ changes it, its value is 10 when it is printed. `bar` is not changed because\
    \ `myFunction()` changes a `copy` of `bar`.\n\n## Pointers to Functions\n\nJust\
    \ when you thought pointers couldn’t get any weirder, it gets worse. It is possible\
    \ to not only have a pointer whose address holds a value, pointers can point to\
    \ an address containing code.\n\n```cpp\nvoid (*functionPointer)(int value, int\
    \ anotherValue);\n```\n\nThis snippet of code is **not** a function. It is actually\
    \ a declaration of a pointer called `functionPointer`.\n\nParentheses are placed\
    \ around the asterisk and name of the pointer to make sure it is declared as a\
    \ function pointer instead of a function which returns a `void` pointer.\n\nTypes\
    \ for function pointers are very specific. The return value and the number and\
    \ types of parameters are all part of a function pointer’s type. These two function\
    \ pointers are not the same type:\n\n```cpp\nvoid (*integerFunction)(int value);\n\
    int (*anotherIntegerFunction)(int value);\n```\n\nExecuting a function by way\
    \ of a pointer is dead easy: Treat the pointer as the name of the function. This\
    \ example calls the function held by the `integerFunction` pointer:\n\n```cpp\n\
    _integerFunction_(5);\n```\n\nLike references, the uses of function pointers are\
    \ not immediately obvious. They add incredible flexibility to a program. Code\
    \ can be bolted on or changed out just like parts on a car. Interpreted languages,\
    \ such as Python or Perl, make it very easy to change a program on the fly, but\
    \ this is not very easy at all for a compiled language like C++. Although normally\
    \ pretty rare, we’ll use function pointers quite a bit when we look at program\
    \ addons later on. For now, don’t worry too much about them.\n\n## Pointers to\
    \ pointers\n\nYes, pointers can point to pointers. The address a pointer holds\
    \ can easily be the address of another pointer. This is just a matter of adding\
    \ a second asterisk when declaring a pointer.\n\n```cpp\nchar **somePointerToAPointer;\n\
    ```\n\nDon’t forget that a pointer’s declaration doesn’t allocate any memory!\
    \ The only thing that exists after this declaration is `somePointerToAPointer`.\
    \ We can use it for different things, such as getting a pointer from a function\
    \ without using a return value or creating a list of strings. Yes, this is the\
    \ way you create a fixed list of strings on the heap. This is also how we get\
    \ arguments from the command line.\n\n## Command Line Arguments\n\nJust like functions\
    \ taking parameters – or arguments… they’re the same thing – programs themselves\
    \ can have information passed to them. Take, for example, this Terminal command:\n\
    \n```bash\nrm -f --verbose myFile\n```\n\nThe command `rm` has three arguments:\
    \ a filename and two switches. Command line switches are options that change the\
    \ behavior of a program. In this case, `rm` operates on the file `myFile`. The\
    \ `-f` switch tells it to force not asking for confirmation, and the `--verbose`\
    \ switch tells it to print more information than it normally does.\n\nSwitches\
    \ in Windows begin with a slash, but for Linux, OS X, and Haiku, they begin with\
    \ a dash. As a general rule, switches with one dash have one letter and switches\
    \ with two dashes are generally words and phrases separated by a dash. We’re not\
    \ going to focus too much on command line switches for the purposes of these lessons\
    \ because our projects will be complex enough to warrant them.\n\nIn order for\
    \ a program to take advantage of command line arguments, the way we use `main()`\
    \ must change a little bit:\n\n```cpp\nint main(int argc, char **argv) { return\
    \ 0; }\n```\n\nNow `main()` takes two parameters: `argc`, which is the number\
    \ of arguments from the command line and `argv`, which is a list of strings which\
    \ contain the command line. Treat `argv` like an array – if `argc` is 2, then\
    \ `argv` will have elements numbered 0 and 1. `argv[0]` always contains the name\
    \ of the program when it was run. This program will print the command line arguments\
    \ passed to it.\n\n```cpp\n#include <stdio.h>\n\nint main(int argc, char **argv)\
    \ { // Iterate through all arguments and print them. for (int i = 0; i < argc;\
    \ i++) printf(\"Program argument %d: %s\\n\", i, argv[i]);\n\n      return 0;\n\
    }\n```\n\nThe place to look closely is the end of the `printf()` statement. Using\
    \ a pointer to a pointer is literally like using a multidimensional array. Strings\
    \ are just special *char* arrays, so we are accessing lists of characters individually.\
    \ If we wanted to use just the second character of the first argument, we’d use\
    \ `argv[0][1]`. In case it’s a little fuzzy, bracket order goes from the largest\
    \ group to the smallest from left to right, so we would be accessing element 0\
    \ in the list of lists and choosing element 1 – the second character – from that\
    \ list.\n\n## Assignment\n\nWith everything we’ve learned in these ten lessons\
    \ thus far, we have the capacity to do a great deal. This will be our first project\
    \ of notable value. We are going to write a simple version of the command line\
    \ utility *cat*, which concatenates, or joins together, files by printing them\
    \ to *stdout* in the order that they are specified from the command line.\n"
