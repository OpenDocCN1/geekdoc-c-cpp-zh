    \ // the comments for the definitions for card_value and\n        // card_suit\
    \ near the top of this example for a detailed\n        // explanation.\n     \
    \   printf(\"%s%c \",sValueNameList[deck[i].value - 2],\n                sSuitCharList[deck[i].suit]);\n\
    \    }\n    printf(\"\\n\");\n}\n\nint main(void)\n{\n    // rand() only provides\
    \ kinda-not-really random numbers. We seed,\n    // or initialize, the random\
    \ number generator with the current time\n    // so that it actually provides\
    \ enough randomness to be useful.\n    // We'll do more with time() much later\
    \ on, so just ignore this for\n    // now.\n    srand(time(NULL));\n    // Our\
    \ deck of cards\n    card deck[54];\n    // Initialize our deck of cards\n   \
    \ InitStandardDeck(deck);\n    // Display the deck before it gets shuffled\n \
    \   printf(\"Our deck of cards before shuffling:\\n\");\n    PrintDeck(deck,54);\n\
    \    // Shuffle it pretty good -- 5 times should do the trick.\n    ShuffleDeck(deck,54,5);\n\
    \    // Show how mixed-up it is now\n    printf(\"Our deck of cards after shuffling:\\\
    n\");\n    PrintDeck(deck,54);\n    return 0;\n}\n```\n\n## Where to Go From Here\n\
    \nWhew! That was a doozy! This example uses a lot of the things that we’ve spent\
    \ time learning so far and probably took some time to get through. No bug hunts\
    \ this time – just some review of the project from the last lesson. Take some\
    \ time to also go back over the review questions from this unit and the other\
    \ two units. In the next lesson we will start delving into the part of C++ which\
    \ gives it *real* power.\n\n## Assignment\n\nIn the last lesson, we were presented\
    \ with the task of making a program that takes at least one filename as a command-line\
    \ argument and prints it. The steps to do inside our `for()` loop were the following:\n\
    \n1. Try to open the argument for reading as a file.\n2. If the open fails, skip\
    \ to the next iteration.\n3. If the open succeeds, try to read a chunk of data\
    \ from the file, storing the number of bytes read.\n4. Use a `while` loop to read\
    \ sections of the file, repeating while the number of bytes read is greater than\
    \ 0.\n5. Close the file’s handle.\n\n```cpp\n#include <stdio.h>\n#include <malloc.h>\n\
    \nint main(int argc, char **argv)\n{\n    for (int i = 1; i < argc; i++)\n   \
    \ {\n        // open a file handle for reading from argv[i]\n        FILE *fileHandle\
    \ = fopen(argv[i],\"r\");\n        // if the file handle is NULL or there is an\
    \ error, continue to\n        // the next iteration.\n        if (!fileHandle\
    \ || ferror(fileHandle))\n            continue;\n        // create a data buffer\
    \ -- an array to hold our data. Size isn't\n        // terribly important, but\
    \ it should be at least a few hundred bytes\n        // and no more than 4000\
    \ bytes. You can create it on the stack\n        // or use malloc, whichever you\
    \ prefer.\n        char buffer[1024];\n        // create a variable to store the\
    \ number of bytes actually read\n        int bytesRead;\n        // read data\
    \ from the file handle and store the number of bytes\n        // read into the\
    \ variable we just created.\n        bytesRead = fread(buffer,sizeof(char),1024,fileHandle);\n\
    \        // Start our while() loop. Loop while the number of bytes read is\n \
    \       // greater than zero and if ferror does not indicate an error on\n   \
    \     // the file handle\n        while (bytesRead > 0 && !ferror(fileHandle))\n\
    \        {\n            // write the number of bytes read to stdout.\n       \
    \     fwrite(buffer,sizeof(char),bytesRead,stdout);\n            // read more\
    \ data and put the number of bytes actually read\n            // into the variable\
    \ we created above.\n            bytesRead = fread(buffer,sizeof(char),1024,fileHandle);\n\
    \        }\n        // free the buffer here if you used malloc, never mind if\
    \ you put\n        // the buffer on the stack.\n        // close the file handle\
    \ here\n        fclose(fileHandle);\n    }\n\n    return 0;\n}\n```\n"
