  \ 17.0.0`\n\n# 关于作者\n\n*Andreas Fertig* 是 Unique Code GmbH 的首席执行官，是一位丰富的 C++ 标准（11\
  \ 至 23）培训师和讲师。\n\nAndreas 参与了 C++ 标准委员会，负责开发新标准。在国际会议上，他展示了如何编写更好的代码。他发表专业文章（例如在\
  \ iX 杂志），并出版了多本关于 C++ 的教科书。\n\n通过 C++ Insights ([cppinsights.io](https://cppinsights.io))，Andreas\
  \ 创建了一个国际认可的工具，让用户能够透视 C++ 的底层机制，从而更好地理解这些构造。\n\n在从事培训和咨询之前，他在 Philips Medizin Systeme\
  \ GmbH 工作了十年，担任 C++ 软件开发人员和架构师，专注于嵌入式系统。\n\n你可以在 [andreasfertig.com](https://andreasfertig.com)\
  \ 在线找到他。\n\n# 关于本书\n\n*使用 C++20 编程* 教导具有 C++ 经验的程序员学习 C++20 的新特性以及如何应用它们。本书假设读者已具备\
  \ C++11 知识。在必要时，会简要介绍 C++11 到 C++20 之间的标准元素。然而，重点在于教授 C++20 的特性。\n\n你将从学习所谓的“四大件”：概念（Concepts）、协程（Coroutines）、`std::ranges`\
  \ 和模块（modules）开始。在四大件之后是一些较小但同样重要的特性。你将学习 `std::format`，这是 C++ 中格式化字符串的新方法。在第 6\
  \ 章，你将学习一种新运算符，即太空运算符（spaceship operator），它可以让你少写代码。\n\n然后你将查看语言的各种改进，确保更高的一致性并减少意外。你将学习\
  \ lambda 在 C++20 中如何得到改进，以及你现在可以作为非类型模板参数传递的新元素。你的下一站是 STL 的改进。\n\n当然，如果你没有读完这本书，你不会了解\
  \ `constexpr` 世界发生了什么变化。\n\n### 风格与约定\n\n以下展示了程序的执行。我在这里使用了 Linux 方式，并跳过了提供所需的输出名称，导致\
