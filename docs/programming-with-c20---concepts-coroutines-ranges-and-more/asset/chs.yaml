  \n为了让示例运行，我们为 `PrintSorted` 提供了一个重载，用于检查类型是否具有 `sort` 方法。在这种情况下，与其调用 `std::sort`，这个版本的\
  \ `PrintSorted` 调用了该类型的 `sort` 方法。\n\n```cpp\ntemplate<typename T>\nconcept HasSortMethod\
  \ = requires(T t)\n{\n  t.sort();\n};\n\ntemplate<HasSortMethod T>\nvoid PrintSorted(T\
