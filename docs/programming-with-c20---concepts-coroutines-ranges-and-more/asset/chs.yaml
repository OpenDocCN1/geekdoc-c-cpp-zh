  \ Listing [1.43\n\n\n\n\n我们可能都会得出许多不同的结论，认为每个人可能会采取不同的做法。然而，我希望你同意，这段代码的一个问题在于缺少创建数字与将其传递给函数之间的分离。换句话说，我们将生成和使用混合在了一起。通过观察更宏观的场景（`UseCounterValue`\
  \ 稍后会被再次调用），这个问题变得更加明显了：\n\n```cpp\nfor(int i = 0; i < 5; ++i) { UseCounterValue(i);\
  \ }\n// other code\nfor(int i = 5; i < 10; ++i) { UseCounterValue(i); }\n```\n列表\
  \ 2.2\n\n我们现在必须写两次 `for`-循环，并且必须正确处理边界。考虑到计算机科学中最常见的问题就是差一错误（off-by-one error），这听起来并不简单。\n\
  \n从这段代码的更通用的视角来看，我们有一个生成从 `1` 到 `N` 数字的算法。然后，我们在 `UseCounterValue` 中使用生成的数据。这种分离可以改进我们的代码，因为我们可以重用这个\
  \ `for`-循环。此外，分离会使代码更健壮。\n\n我们还有哪些选择呢？嗯，可以使用带有初始化捕获（init-capture）的 lambda，但这样要让\
  \ lambda 只运行到 `5` 就很难了。另一种方案是编写一个接受可调用对象作为参数的函数模板。这将允许我们将使用部分传递给生成器。但这样就很难看出这个可调用对象接受哪些参数。另一种方法是使用带有\
  \ `static` 变量的函数，该变量存储当前计数器值并在 `return` 时增加该值。我们然后使用这个函数 `counter` 并返回值传递给 `UseCounterValue`。这是一个可能的实现方案：\n\
  \n```cpp\nint counter()\n{\n  static int i{0};\n  return i++;\n}\n\nvoid UseCounter()\n\
  {\n  for(int i = 0; i < 5; ++i) { UseCounterValue(counter()); }\n  // other code\n\
  \  for(int i = 0; i < 5; ++i) { UseCounterValue(counter()); }\n}\n```\n列表 2.3\n\n\
  这种方法可行，但这种解决方案远谈不上优雅。我们只能在一个算法中使用 `counter`，因为它是单调递增的，而且我们没有办法重置 `counter` 的内部值。即使我们添加某种重置机制，`counter`\
  \ 在多线程上下文中永远无法使用。\n\n理想情况下，算法的生成器只需从挂起的地方继续执行，保持其状态。我们还可以创建数千个相同生成器的实例，每个实例都从相同的初始值开始并跟踪自己的状态。这种带有状态保留的挂起和恢复正是协程带我们的。\n\
  \n## 2.2: 什么是协程\n\n我们刚刚查看了普通函数及其局限性。现在是时候看看协程能为我们做什么，或者说，什么是可恢复的函数。图 2.1 显示了普通函数与协程控制流之间的区别。正如我们看到的，普通函数总共只执行一次。相比之下，协程可以挂起自己并返回调用者。这种情况可以发生多次，协程也可以调用另一个协程。\n\
  \n![](img/file8.png)图 2.1：普通函数与协程之间控制流的差异。\n\n### 2.2.1: 使用协程生成序列\n\n我们不再使用不可中断的控制流（那种需要某种回调机制来向调用者信号变化的流），而是可以使用协程来挂起和恢复它们。以下是这样的实现：\n\
  \n```cpp\nIntGenerator  // #A 返回一个协程对象\ncounter(int start, int end)\n{\n  while(start\
  \ < end) {\n    co_yield start;  // #B 产生值并将控制权还给调用者\n    ++start;\n  }\n}\n\nvoid\
  \ UseCounter()\n{\n  auto g = counter(1, 5);\n  // #C 该序列从 1 运行到 5\n  for(auto i\
  \ : g) { UseCounterValue(i); }\n}\n```\n列表 2.4\n\n`IntGenerator` // #A 返回一个协程对象\n\
  `counter(int start, int end)`\n{\n  while(start < end) {\n    `co_yield start; \
  \ // #B 产生值并将控制权还给调用者\n    ++start;\n  }\n}\n\n`void UseCounter()`\n{\n  auto g\
  \ = counter(1, 5);`\n  // #C 该序列从 1 运行到 5\n  for(auto i : g) { UseCounterValue(i);\
  \ }\n}\n\n\n\n\n\n当我们看协程的初始示例时，可以在 #A 处看到一个 `IntGenerator` 类型。这背后隐藏着协程所需的特殊类型。在\
  \ C++ 中，我们不能使用像 `int` 或 `std::string` 那样普通的返回类型。我们需要将该类型封装成所谓的 `generator`（生成器）。这是因为\
  \ C++ 中的协程是对有限状态机（FSM）的一种非常底小的抽象。`generator` 为我们提供了实现上的自由，并让我们能够选择自己喜欢的方式来建模协程。为了让一个类或\
  \ `struct` 成为生成器类型，该类需要满足使 FSM 运行所需的应用程序编程接口（API）。在 `counter` 示例中，有一个新关键字 `co_yield`，它会挂起协程向调用者返回一个值。然而，在挂起期间，协程的状态需要存储在某个地方，而且我们还需要一种机制从协程外部获取产生的值。`generator`\
  \ 正负责管理这项工作。下面，你将看到 `counter` 的生成器。\n\n```cpp\ntemplate<typename T>\nstruct generator\
  \ {\n  using promise_type =\n    promise_type_base<T, generator>;  // #A  PromiseType\n\
  \  using PromiseTypeHandle = std::coroutine_handle<promise_type>;\n\n  // #B 让生成器可迭代\n\
  \  using iterator = coro_iterator::iterator<promise_type>;\n  iterator begin() {\
  \ return {mCoroHdl}; }\n  iterator end() { return {}; }\n\n  generator(generator\
  \ const&) = delete;\n  generator(generator&& rhs)\n  : mCoroHdl(std::exchange(rhs.mCoroHdl,\
  \ nullptr))\n  {}\n\n  ~generator()\n  {\n    // #C 我们必须维护协程的生命周期\n    if(mCoroHdl)\
  \ { mCoroHdl.destroy(); }\n  }\n\nprivate:\n  friend promise_type;  // #D 因为默认构造函数是私有的，promise_type\
  \ 需要是友元\n\n  explicit generator(promise_type* p)\n  : mCoroHdl{PromiseTypeHandle::from_promise(*p)}\n\
  \  {}\n\n  PromiseTypeHandle mCoroHdl;  // #E 协程句柄\n};\n```\n\nListing 2.5\n\n在最顶部的\
  \ #A 处，我们看到了 `using promise_type`。这是编译器查找的名称。promise 类型与我们从 `std::future` 的 `std::promise`\
  \ 部分所熟知的内容略相似。然而，可能更好的视角是将 `promise_type` 看作协程的状态控制器。因此，它的 `promise_type` 并不一定只给我们提供一个值。我们将在\
  \ `generator` 之后查看 `promise_type`。\n\n在 #B 处，我们看到了一个 `iterator`。这是由于我们的基于范围的 for\
  \ 循环需要 `begin` 和 `end`。`iterator` 的实现并没有特别之处，我们将在查看 `promise_type` 之后看到它。\n\n接下来，我们来看\
  \ #C 和 #E，因为它们是关联在一起的。在 #E 中，我们看到了协程句柄。这个句柄是进入访问协程状态机的密钥。这个类型来自新头文件 `<coroutine>`\
  \ 的 `std::coroutine_handle<T>` 可以被视为是对指针的封装，直指协程帧（coroutine frame）。协程帧的一个特殊之处在于，每当创建一个协程时（随之还有\
  \ `generator` 和 `promise_type`），编译器都会为我们调用 `new`。这部分内存就是 `coroutine-frame`。编译器知道协程何时开始。然而，编译器并不（至少不容易）知道协程何时结束或不再被需要。这就是为什么我们必须手动释放协程帧的内存。最简单的方法是让\
  \ `generator` 在其析构函数中释放协程帧，正如我们在 #C 中看到的。\n\n在最顶部的 #A 处，我们看到了 `using promise_type`。这是编译器查找的名称。promise\
  \ 类型与我们从 `std::future` 的 `std::promise` 部分所熟知的内容略相似。然而，可能更好的视角是将 `promise_type`\
  \ 看作协程的状态控制器。因此，它的 `promise_type` 并不一定只给我们提供一个值。我们将在 `generator` 之后查看 `promise_type`。\n\
  \n在 #B 处，我们看到了一个 `iterator`。这是由于我们的基于范围的 for 循环需要 `begin` 和 `end`。`iterator` 的实现并没有特别之处，我们将在查看\
  \ `promise_type` 之后看到它。\n\n接下来，我们来看 #C 和 #E，因为它们是关联在一起的。在 #E 中，我们看到了协程句柄。这个句柄是进入访问协程状态机的密钥。这个类型来自新头文件\
  \ `<coroutine>` 的 `std::coroutine_handle<T>` 可以被视为是对指针的封装，直指协程帧。协程帧的一个特殊之处在于，每当创建一个协程时（随之还有\
  \ `generator` 和 `promise_type`），编译器都会为我们调用 `new`。这部分内存就是 `coroutine-frame`。编译器知道协程何时开始。然而，编译器并不（至少不容易）知道协程何时结束或不再被需要。这就是为什么我们必须手动释放协程帧的内存。最简单的方法是让\
  \ `generator` 在其析构函数中释放协程帧，正如我们在 #C 中看到的。\n\n[/content]\n\n*(注：由于你提供的“待翻译文本”包含了与示例逻辑相似的重复描述，根据“一定不要重复输出原文”的原则，我已翻译了该文本中核心的逻辑部分。如果需要完整翻译所有重复段落，请告知。)*\n\
