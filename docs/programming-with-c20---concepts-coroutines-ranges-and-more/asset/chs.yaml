  \ 中，我们不能使用像 `int` 或 `std::string` 那样普通的返回类型。我们需要将该类型封装成所谓的 `generator`（生成器）。这是因为\
  \ C++ 中的协程是对有限状态机（FSM）的一种非常小的抽象。`generator` 为我们提供了实现上的自由，并让我们能够选择自己喜欢的方式来建模协程。为了让一个类或\
  \ `struct` 成为生成器类型，该类需要满足使 FSM 运行所需的应用程序编程接口（API）。在 `counter` 示例中，有一个新关键字 `co_yield`，它会挂起协程向调用者返回一个值。然而，在挂起期间，协程的状态需要存储在某个地方，而且我们还需要一种机制从协程外部获取产生的值。`generator`\
  \ 正负责管理这项工作。下面，你将看到 `counter` 的生成器。\n\n```cpp\ntemplate<typename T>\nstruct generator\
  \ {\n  using promise_type =\n    promise_type_base<T, generator>;  // #A PromiseType\n\
  \  using PromiseTypeHandle = std::coroutine_handle<promise_type>;\n\n  // #B 让生成器可迭代\n\
  \  using iterator = coro_iterator::iterator<promise_type>;\n  iterator begin() {\
  \ return {mCoroHdl}; }\n  iterator end() { return {}; }\n\n  generator(generator\
  \ const&) = delete;\n  generator(generator&& rhs)\n  : mCoroHdl(std::exchange(rhs.mCoroHdl,\
  \ nullptr))\n  {}\n\n  ~generator()\n  {\n    // #C 我们必须维护协程的生命周期\n    if(mCoroHdl)\
  \ { mCoroHdl.destroy(); }\n  }\n\nprivate:\n  friend promise_type;  // #D 因为默认构造函数是私有的，promise_type\
  \ 需要是友元\n\n  explicit generator(promise_type* p)\n  : mCoroHdl{PromiseTypeHandle::from_promise(*p)}\n\
  \  {}\n\n  PromiseTypeHandle mCoroHdl;  // #E 协程句柄\n};\n```\n\nListing 2.5\n\n在最顶部的\
  \ #A 处，我们看到了 `using promise_type`。这是编译器查找的名称。promise 类型与我们从 `std::future` 的 `std::promise`\
  \ 部分所熟知的内容略相似。然而，可能更好的视角是将 `promise_type` 看作协程的状态控制器。因此，它的 `promise_type` 并不一定只给我们提供一个值。我们将在\
  \ `generator` 之后查看 `promise_type`。\n\n在 #B 处，我们看到了一个 `iterator`。这是由于我们的基于范围的 for\
  \ 循环需要 `begin` 和 `end`。`iterator` 的实现并没有特别之处，我们将在查看 `promise_type` 之后看到它。\n\n接下来，我们来看\
  \ #C 和 #E，因为它们是关联在一起的。在 #E 中，我们看到了协程句柄。这个句柄是进入访问协程状态机的密钥。这个类型来自新头文件 `<coroutine>`\
  \ 的 `std::coroutine_handle<T>` 可以被视为是对指针的封装，直指协程帧。协程帧的一个特殊之处在于，每当创建一个协程时（随之还有 `generator`\
  \ 和 `promise_type`），编译器都会为我们调用 `new`。这部分内存就是 `coroutine-frame`。编译器知道协程何时开始。然而，编译器并不（至少不容易）知道协程何时结束或不再被需要。这就是为什么我们必须手动释放协程帧的内存。最简单的方法是让\
  \ `generator` 在其析构函数中释放协程帧，正如我们在 #C 中看到的。\n\n```cpp\ntemplate<typename T, typename\
  \ G>\nstruct promise_type_base {\n  T mValue;\n  auto yield_value(T value) { //\
  \ #C 存储产生的值\n    mValue = std::move(value);\n    return std::suspend_always{}; //\
  \ #D 挂起协程\n  }\n  G get_return_object() { // #E 返回 generator\n    return G{this};\n\
  \  }\n  std::suspend_always initial_suspend() { return {}; }\n  std::suspend_always\
  \ final_suspend() noexcept { return {}; }\n  void return_void() {}\n  void unhandled_exception()\
  \ { std::terminate(); }\n  static auto return_object_on_failure() { return nullptr;\
  \ }\n};\n```\n\nListing 2.6\n\n*(注：由于文本后半部分重复，已按要求跳过重复输出)*\n\n\n\n\n```cpp\nnamespace\
  \ coro_iterator {\n  template<typename PT>\n  struct iterator {\n    std::coroutine_handle<PT>\
  \ mCoroHdl{nullptr};\n\n    void resume()\n    {\n      if(not mCoroHdl.done())\
  \ { mCoroHdl.resume(); }\n    }\n\n    iterator() = default;\n    iterator(std::coroutine_handle<PT>\
  \ hco)\n    : mCoroHdl{hco}\n    {\n      resume();\n    }\n\n    void        operator++()\
  \ { resume(); }\n    bool        operator==(const iterator&) const \n    { return\
  \ mCoroHdl.done(); }\n\n    const auto& operator*() const \n    { return mCoroHdl.promise().mValue;\
  \ }\n  };\n}  // namespace coro_iterator\n```\n\n列表 2.7\n\n如你所见，`iterator` 的实现并没有特殊之处。这种实现与其他任何迭代器没有区别。这里需要指出的一点是，`iterator`\
  \ 没有对协程句柄调用 `destroy`。原因是 `generator` 控制了协程句柄的生命周期。`iterator` 只被允许拥有数据的临时视图。\n\n\
  ### 2.3.6: 协程定制点\n\n图 2.3 显示了协程的流程和定制点。我们已经在示例 `counter` 中看到并使用了其中的大多数定制点。可能还有两个重要的额外定制点。我们从\
  \ `get_return_object_on_allocation_failure` 开始。这个 `static` 方法的存在控制了调用哪一个 `operator\
  \ new`。对于具有该函数的 `PromiseType`，将调用 `operator new(size_t, nothrow_t)` 重载版本。如果 `operator\
  \ new` 返回 `nullptr`，则会调用 `get_return_object_on_allocation_failure` 来获取某种备份对象。这防止了程序因访问\
  \ `nullptr` 而崩溃。然而，协程显然不会运行。相反，这样的协程看起来就像已经完成了。如果没有 `get_return_object_on_allocation_failure`\
  \ 且 `new` 调用返回了 `nullptr`，我们最终会导致 `nullptr` 访问，我们可以将其作为异常捕获。通过这样，我们可以控制分配失败的行为。\n\
  \n![](img/file10.png)图 2.3：协程状态机和 `PromiseType` 定制点。\n\n我们还没有讨论的第二个定制点是 `unhandled_exception`。我们将在\
  \ §2 中讨论。\n\n由于我们在所有定制点上都有很大的实现自由度，表 2.2 总结了所有定制点及其返回类型。\n\n表 tab-coroutineCustomizationPoints：协程定制点\n\
  \n| 名称 | 必须的 | 类型 | 返回 |\n| --- | --- | --- | --- |\n| `get_return_object_on_allocation_failure()`\
  \ |  | Ps | Generator |\n| `get_return_object()` | y | P | Generator |\n| `initial_suspend()`\
  \ | y | P | `std::suspend_always` / `std::suspend_never` |\n| `final_suspend() noexcept`\
  \ | y | P | `std::suspend_always` / `std::suspend_never` |\n| `unhandle_exception()`\
  \ | y | P | `void` |\n| `return_void()` / `return_value(T)` | y | P | `void` |\n\
  | `yield_value(T)` | y^a | P | `std::suspend_always` / `std::suspend_never` |\n\
  | `await_transform(T)` |  | P | `Awaiter` |\n| `T::operator co_await()` |  | Co\
  \ | `Awaiter` |\n| `operator co_await(T)` |  | Go | `Awaiter` |\n| `operator new(size_t)`\
  \ |  | Pg | `void*` |\n| `operator new(size_t, std::nothrow)` |  | Pg^b | `void*`\
  \ |\n| `template<typename... Ts> operator new(size_t, Ts...)` |  | P | `void*` |\n\
  | `operator delete(void*, size_t)` |  | Pg | `void` |\n| `await_ready()` |  | A\
  \ | `bool` |\n| `await_suspend(coroutine_handle>)` | y | A | `bool` | `void` |\n\
  \n### 2.3.7: 协程限制\n\n对于哪些函数可以是协程有一些限制。\n\n*   `constexpr` 函数不能是协程。\n*   带有尾随返回类型的\
  \ `auto` 不能是协程。\n*   带有类型的 `auto` 不能是协程。\n*   （此处原文为乱码，已略）\n*   最后重要一点，`main` 函数不能是协程。\n\
  *   Lambda 表达式可以是协程。\n\n## 2.4: 用旧方法方法编写解析器\n\n既然我们已经看到了协程的用法，让我们来分析它们……我们想为这个例子编写一个处理“Hello\
  \ World”的解析器。\n\n在过去，我经常编写解析器。任务是解析一个被划帧的流。图 2.4 显示了该协议的解析器状态图和控制流。\n\n现在，我们那里有什么？一个包含特殊的\
  \ `ESC` 字节（不要与 ASCII 中的 0x1B `ESC` 混淆）的协议。`ESC` 的作用是转义所有协议字节。在有效负载中，每个与 `ESC` 值相同的字节也会被\
  \ `ESC` 转义。这样，协议就可以包含字节的完整范围，而不仅仅是打印字符。通过这个标记，我们可以在字节流中搜索帧的开始。帧以 `ESC` + `SOF` 开始，其中\
  \ `SOF` 代表帧开始（Start Of Frame）。\n\n```cpp\nstatic const byte ESC{'H'};\nstatic const\
  \ byte SOF{0x10};\n```\n\n列表 2.8\n\n使用 `'H'` 作为 `ESC` 是一个刻意的选择。这样，当我们假设在图 2.5 所示的输入流上使用解析器时，我们必须转义\
  \ ASCII 数据。\n\n我们如何实现这个协议？有多种方法。通常我们倾向于创建一个类来跟踪状态。文献也告诉我们我们可以应用的各种模式，例如状态模式。下面，我展示了可能更不寻常的方法，即在单个函数中使用\
  \ `static` 变量的实现。\n\n\n\n\n\n```cpp\ntemplate<typename T>\nvoid ProcessNextByte(byte\
  \ b, T&& frameCompleted)\n{\n  static std::string frame{};\n  static bool      \
  \  inHeader{false};\n  static bool        wasESC{false};\n  static bool        lookingForSOF{false};\n\
  \n  if(inHeader) {\n    if((ESC == b) && not wasESC) {\n      wasESC = true;\n \
  \     return;\n    } else if(wasESC) {\n      wasESC = false;\n\n      if((SOF ==\
  \ b) || (ESC != b)) {\n        // if b is not SOF discard the frame\n        if(SOF\
  \ == b) { frameCompleted(frame); }\n\n        frame.clear();\n        inHeader =\
  \ false;\n        return;\n      }\n    }\n\n    frame += static_cast<char>(b);\n\
  \n  } else if((ESC == b) && !lookingForSOF) {\n    lookingForSOF = true;\n  } else\
  \ if((SOF == b) && lookingForSOF) {\n    inHeader      = true;\n    lookingForSOF\
  \ = false;\n  } else {\n    lookingForSOF = false;\n  }\n}\n```\n\n列表 2.9\n\n对这种实现的一种观点是代码有些丑陋。我在这里并没有真正使用\
  \ C++。它更像 C 语言。没有类，只有糟糕的 `static` 变量。我们无法让两个 `Parse` 例程同时运行。事实上，一旦函数被调用了第一次，我们甚至没有办法重置\
  \ `Parse`。这一切都在控诉我们：这里应该用类！我我知道。但如果你观察 `Parse`，你会发现所有东西都在那里。状态在类设计中是否真的更易于追踪并不总是如此。我特意选择这种实现，并不是因为它的丑陋，而是因为这种实现是且应当是我们需要的一切。然而，使用普通函数，我们最终只能得到这种结果。然后，面向对象编程（OOP）出现了，我们开始在\
  \ C++ 中使用类。那是很多年前的事了。现在我们有了 C++20 和协程。让我们在下一节中看看如果将这段代码转换为协程，它会变成什么样。\n\n## 2.5:\
  \ 使用协程的字节流解析器\n\n任务是使用协程改进前一节中的解析器。我们已经看到了将字节流解析器从普通函数重构为协程所需的一些部分。这一次，让我们先看看如何使用协程实现\
  \ `Parse` 函数。一旦完成完成，我们就可以开发相关部分使 `Parse` 运行起来。\n\n### 2.5.1: 将 `Parse` 函数编写为协程\n\
  \n整个字节流解析器的核心是 `Parse` 函数。当然，`Parse` 是一个协程。`Parse` 返回类型 `FSM`，这是一种不同的生成器。在此时，我们可以看到协程带给我们的力量。但在我带你阅读代码之前，请先自己观察一下。这里是\
  \ `Parse` 的实现：\n\n```cpp\nFSM Parse()\n{\n  while(true) {\n    byte b = co_await\
  \ byte{};\n    if(ESC != b) { continue; }\n\n    b = co_await byte{};\n    if(SOF\
  \ != b) { continue; }  // #A 未查看起始序列\n\n    std::string frame{};\n    while(true)\
  \ {  // #B 捕获完整帧\n      b = co_await byte{};\n\n      if(ESC == b) {\n        //\
  \ #C 跳过此字节并查看下一个\n        b = co_await byte{};\n        if(SOF != b) { continue;\
  \ }\n\n        if(SOF == b) {\n          co_yield frame;\n          break;\n   \
  \     } else if\n           != b)\n\n          .clear();\n          break;\n   \
  \     }\n      }\n      frame += static_cast<char>(b);\n    }\n  }\n}\n```\n\n列表\
  \ 2.9\n\n整个字节流解析器的核心是 `Parse` 函数。当然，`Parse` 是一个协程。`Parse` 返回类型 `FSM`，这是一种不同的生成器。在此时，我们可以看到协程带给我们的力量。但在我带你阅读代码之前，请先自己观察一下。这里是\
  \ `Parse` 的实现：\n\n列表 2.10\n\n对这种实现的一种观点是代码有些丑陋。我在这里并没有真正使用 C++。它更像 C 语言。没有类，只有糟糕的\
  \ `static` 变量。我们无法让两个 `Parse` 例程同时运行。事实上，一旦函数被调用了第一次，我们甚至没有办法重置 `Parse`。这一切都在控诉我们：这里应该用类！我我知道。但如果你观察\
  \ `Parse`，你会发现所有东西都在那里。状态在类设计中是否真的更易于追踪并不总是如此。我特意选择这种实现，并不是因为它的丑陋，而是因为这种实现是且应当是我们需要的一切。然而，使用普通函数，我们最终只能得到这种结果。然后，面向对象编程（OOP）出现了，我们开始在\
  \ C++ 中使用类。那是很多年前的事了。现在我们有了 C++20 和协程。让我们在下一节中看看如果将这段代码转换为协程，它会变成什么样。\n\n### 2.5.2:\
  \ 创建一个可等待的类型\n\n在 `Parse` 的实现（列表 2.10）中，我们首先看到了 `co_await` 用于在协程中等待外部数据。这些数据是异步提供的。如列表所示调用时，编译器会检查我们的\
  \ `PromiseType` 是否也提供了等待类型（Awaitable）的接口。`PromiseType` 必须提供 `await_transform` 方法才能成为等待类型。或者，你可以提供另一种拥有\
  \ `operator co_await` 的类型。`await_transform` 方法接收一个类型作为参数并返回一个等待者（Awaiter）。等待者的工作原理与我们在\
  \ `PromiseType` 中看到的一样。编译器尝试在该类型中查找几个符号，将 `PromiseType` 视为接口。如果找到了，该类型就是等待者。如果没有，我们将得到编译错误。\n\
  \n表 2.3:协程等待者接口\n\n| 方法 | 作为类型 |\n| --- | --- |\n| `bool await_ready()` | 信号等待者是否已经有了数据，如果没有，协程将挂起。\
  \ |\n| `void await_suspend(coroutine_handle<>)` | 在协程即将挂起时调用。句柄允许等待者以后唤醒协程，`void`\
  \ 类型将无条件挂起。 |\n| `bool await_suspend(coroutine_handle<>)` | 同上，但挂起取决于返回值。 |\n| `T\
  \ await_resume()` | 在恢复协程之前获取操作结果。注意，`T` 可以是 `void`。 |\n\n\n\n\n\n你可能已经注意到，在 `Parse`\
  \ 中，我们使用了 `co_await byte`。这告诉编译器去寻找 `operator co_await(byte)` 或 `await_transform(byte)`。区别在于我们的\
  \ `PromiseType` 是否也是一个 `Awaiter`（从而使我们可以在协程内部使用 `co_yield` 和 `co_await`），还是说我们需要通过\
  \ `co_await` 调用另一个类型。目前，让我们使用 `PromiseType` 也是 `Awaiter` 的那个版本。我喜欢将这种类型称为 `async_generator`。\n\
  \n`async_generator` 或者更准确地说，其可等待部分（Awaitable-part）需要存储被等待的数据。从接口来看，我们已经看到需要实现一个\
  \ `Awaiter`；我们知道有一个 `await_ready` 方法来检查值是否已经存在。这听起来非常像 `std::optional` 的用例。\n\n\
  ```cpp\ntemplate<typename T>\nstruct awaitable_promise_type_base {\n  std::optional<T>\
  \ mRecentSignal;\n\n  struct awaiter {\n    std::optional<T>& mRecentSignal;\n\n\
  \    bool await_ready() const { return mRecentSignal.has_value(); }\n    void await_suspend(std::coroutine_handle<>)\
  \ {}\n\n    T await_resume()\n    {\n      assert(mRecentSignal.has_value());\n\
  \      auto tmp = *mRecentSignal;\n      mRecentSignal.reset();\n      return tmp;\n\
  \    }\n  };\n\n  [[nodiscard]] awaiter await_transform(T) \n  { return awaiter{mRecentSignal};\
  \ }\n};\n```\n列表 2.11\n\n除了 `Awaiter` 接口外，`async_generator` 还需要作为 `PromiseType`\
  \ 的一部分提供 `await_transform`。除此之外，我们可以在程度上拷贝已经开发的 `generator` 的实现。区别之一是 `promise_type`，它现在传递了\
  \ `awaitable_promise_type_base`。第二是我们需要一种方法来获取协程产生的数据并将数据传递给协程。这里是 `async_generator`\
  \ 的一种可能实现。\n\n```cpp\ntemplate<typename T, typename U>\nstruct [[nodiscard]] async_generator\n\
  {\n  using promise_type = promise_type_base<T, \n                              \
  \  async_generator, \n                                awaitable_promise_type_base<U>>;\n\
  \  using PromiseTypeHandle = std::coroutine_handle<promise_type>;\n\n  T operator()()\n\
  \  {\n    // #A 移动操作也清除了 promise 中的 mValue\n    auto tmp{std::move(mCoroHdl.promise().mValue)};\n\
  \n    // #B 但我们必须将其设置为一个定义状态\n    mCoroHdl.promise().mValue.clear();\n\n    return\
  \ tmp;\n  }\n\n  void SendSignal(U signal)\n  {\n    mCoroHdl.promise().mRecentSignal\
  \ = signal;\n    if(not mCoroHdl.done()) { mCoroHdl.resume(); }\n  }\n\n  async_generator(const\
  \ async_generator&) = delete;\n  async_generator(async_generator&& rhs)\n    : mCoroHdl{std::exchange(rhs.mCoroHdl,\
  \ nullptr)}\n  {}\n\n  ~async_generator()\n  {\n    if(mCoroHdl) { mCoroHdl.destroy();\
  \ }\n  }\nprivate:\n  friend promise_type;  // #C 默认构造函数是私有的，需要是友元\n  explicit async_generator(promise_type*\
  \ p)\n    : mCoroHdl(PromiseTypeHandle::from_promise(*p))\n  {}\n\n  PromiseTypeHandle\
  \ mCoroHdl;\n};\n```\n列表 2.12\n\n`async_generator` 两个成员函数：`GetResult` 和 `SendSignal`。前者获取产生的值，后者设置一个被等待的值。到此，我们拥有了两个所需的通道。第三个变化更为微妙。我去掉了迭代器。`Parse`\
  \ 所需要的 `async_generator` 不需要是可迭代的。这是一种设计选择。其他用例可能需要迭代器。\n\n### 2.5.3 更灵活的 `promise_type`\n\
  \n对于我们在上一节中看到的 `awaiter_promise_type`，我们需要得出一个决定。现在我们现在 `async_generator` 和 `generator`\
  \ 两个地方都需要一个 `PromiseType`。一种方案是重新实现 `promise_type_base` 并将代码复制到 `awaiter_promise_type`\
  \ 中，使 `awaiter_promise_type` 成为一个完整的 `PromiseType`。我不喜欢这种方法。通过对 `promise_type_base`\
  \ 进行微调可以做得更好。我们可以让 `promise_type_base` 派生自 `awaiter_promise_type`。这样我们就可以保持两者的独立而无需任何重复。通过继承方法，`promise_type_base`\
  \ 也可以派自其他类型。\n\n我们需要做的是允许 `promise_type_base` 派自多个类。为什么呢？仅仅是为了未来的灵活性。变长模板可以轻松地实现这一点。我们只需要在\
  \ `promise_type_base` 的模板头部添加一个变长模板参数 `Bases`，并在存在基类的情况下让 `promise_type_base` 派生自这些基类。得益于变长模板，这个参数包可以是空的，我们的代码也可以编译。这里是升级后的版本：\n\
  \n```cpp\ntemplate<typename T, typename G, \n         typename... Bases> // #A 为\
  \ awaiter 多个基类\nstruct promise_type_base : public Bases... {\n  T mValue;\n\n  auto\
  \ yield_value(T value)\n  {\n    mValue = value;\n    return std::suspend_always{};\n\
  \  }\n\n  G get_return_object() { return G{this}; };\n\n  std::suspend_always initial_suspend()\
  \ { return {}; }\n  std::suspend_always final_suspend() noexcept { return {}; }\n\
  \  void return_void() {}\n  void unhandled_exception() { std::terminate(); }\n};\n\
  ```\n列表 2.13\n\n如你所见，我们只需要像上面那样修改 `promise_type_base` 的前两行就完成了。这比重复代码好得多。\n\n###\
  \ 2.5.4 另一个生成器 FSM\n\n到为止，我们看到的都是一个在某处产生值的简单生成器。这就是之前 `generator` 的实现所做的。查看 `Parse`\
  \ 发现这次我们需要更多内容。`Parse` 不仅在每个帧完成时产生值，还会使用 `co_await` 来挂起并等待下一个可用字节。为了实现这一点，这次的生成器需要满足另一个接口：`awaiter`。\n\
  \n```cpp\nusing FSM = async_generator<std::string, byte>;\n```\n列表 2.14\n\n### 2.5.5\
  \ 模拟字节流\n\n为了让字节流解析器工作，我们再次需要某种模拟器。这次不再仅仅使用 `std::vector`，而是引入了另一个协程 `sender`，如下所示：\n\
  \n```cpp\ngenerator<byte> sender(std::vector<byte> fakeBytes)\n{\n  for(const auto&\
  \ b : fakeBytes) { co_yield b; }\n}\n```\n列表 2.15\n\n\n\n\n在观察这几行代码时，有一点非常重要。如你所见，`sender`\
  \ 以拷贝的方式接收了 `fakeBytes`，即我们的 `std::vector` 参数。这不是疏忽，而是故意为之！为什么不使用 `const &` 呢？原因是传递给协程的数据并不一定拷贝到协程中。例如，如果传递给协程的数据比协程活活，你可以通过\
  \ `const &` 传递数据，此时协程帧将只包含指向该数据的引用。正如你可能知道的，如果协程的生命周期比其引用指向的数据生命周期长，我们就会遇到未定义行为（`UB`）。对于通用协程来说，最安全的方法是通过拷贝获取参数，并在调用端使用移动语义来提高效率。如果你完全确定自己在做什么，并且你未来的自己以及所有同事都永远对此深信不疑，那么请通过\
  \ `const &` 传递数据。\n\n### 2.5.6：将组件组合在一起\n\n此时，我们已经拥有了创建程序全景所需的所有组件。记住，图 2.5 显示了我们想要模拟的数据。我们将它们放入两个\
  \ `std::vector` 中，使用我们之前的 `sender` 和 `Parse` 实现，工作就大功告成了。下面是一个函数，它遍历字节流并将其输入到 `Parse`。\n\
  \n```cpp\nvoid ProcessStream(generator<byte>& stream, FSM& parse) {\n  for(const\
  \ auto& b : stream) {\n    // #A 将新字节发送给等待中的 Parse 协程\n    parse.SendSignal(b);\n\
  \n    // #B 检查我们是否获得了一个完整的帧\n    if(const auto& res = parse(); res.length()) {\n\
  \      HandleFrame(res);\n    }\n  }\n}\n```\n\n列表 2.16\n\n在 `#A` 中，我们看到每个字节都被馈送了\
  \ `Parse`。之后，我们通过通过调用运算符接收 `p` 的结果来检查帧是否已经完成。我们知道结果是一个 `std::string`。有了这个知识，我们只需要简单地检查返回值的长度是否大于零即可。一旦帧完成，就会在\
  \ `#B` 中调用 `HandleFrame`。有了这个函数，我们现在可以处理两个不同的数据流。\n\n```cpp\nstd::vector<byte> fakeBytes1{\n\
  \    0x70_B, ESC, SOF, ESC,\n    'H'_B, 'e'_B, 'l'_B, 'l'_B, 'o'_B, ESC, SOF,\n\
  \    0x7_B, ESC, SOF};\n};\n\n// #A 模拟第一个网络流\nauto stream1 = sender(std::move(fakeBytes1));\n\
  \n// #B 创建 Parse 协程并将句柄存储在 p 中\nauto p = Parse();\n\nProcessStream(stream1, p);\
  \  // #C 处理字节\n\n// #D 模拟重新打开网络流\nstd::vector<byte> fakeBytes2{\n    'W'_B, 'o'_B,\
  \ 'r'_B, 'l'_B, 'd'_B, ESC, SOF, 0x99_B};\n};\n\n// #E 模拟第二个网络流\nauto stream2 =\
  \ sender(std::move(fakeBytes2));\n\n// #F 我们仍然使用之前的 p 并向它馈送新字节\nProcessStream(stream2,\
  \ p);\n```\n\n列表 2.17\n\n在 `#A` 中，我们创建了 `sender`并将第一个字节作为 `std::vector` 传递给它。这创建了第一个协程，将其存储在\
  \ `stream1` 中。接下来，在 `#B` 中，我们创建了 `Parse` 协程并将 `Parse` 生成器的句柄保存到 `p` 中。我们将 `stream1`\
  \ 和 `p` 传递给 `ProcessStream` 进行处理。这是网络字节流第一部分的模拟。假设此时连接断开了。\n\n在 `#D` 中，我们通过将第二部分字节传递给\
  \ `sender` 来重新打开流，并如 `#E` 所示将协程存储在 `stream2` 中。有趣的部分是 `#F`。我们可以复用 `p`，我们的协程状态保留在它上次离开的地方。\n\
  \n## 2.6：`generator` 的另一种策略\n\n有一点在 `co_await` 获取内容的地方看起来很奇怪。如果我们在后续让某个东西变为 `co_await`\
  \ 会怎样？让我们来看下面 `Parse` 的另一种替代实现：\n\n```cpp\nFSM Parse(DataStreamReader& stream) {\
  \ // #A 将流作为参数传递\n  while(true) {\n    byte b = co_await stream; // #B 在流上等待\n \
  \   if(ESC != b) continue;\n\n    b = co_await stream; // #C 未检查结束起始序列\n    if(SOF\
  \ != b) continue;\n\n    std::string frame{}; // #D 捕获完整帧\n    while(true) {\n \
  \     b = co_await stream;\n      if(ESC == b) {\n        // #E 跳过此字节并查看下一个\n  \
  \      b = co_await stream;\n        if(SOF == b) {\n          co_yield frame;\n\
  \          break;\n        } else if(ESC != b) {\n          break;  // #F 不同步\n\
  \        }\n      }\n      frame += static_cast<char>(b);\n    }\n  }\n}\n```\n\n\
  列表 2.18\n\n正如我们在 `#A` 中所看到的，此实现中的 `Parse` 接收一个参数 `DataStreamReader& stream`。这次是通过引用传递，这意味着我们必须确保\
  \ `stream` 的生命周期比 `Parse` 长。在 `#B` 中，我们看到了 `co_await` 的变体。我们现在在流上等待。这使得代码更清晰地显示了数据的来源——`DataStreamReader`。\n\
  \n等等，我注意到提供的文本中有些未合并的句子。为了让这段代码工作，还需要更改什么？\n\n让我们从 `Parse` 的返回类型 `FSM` 开始。返回类型现在使用了\
  \ `generator` 而不是 `async_generator`。\n\n```cpp\nusing FSM = generator<std::string,\
  \ false>;\n```\n\n列表 2.19\n\n这消除了对 Awaiter 的传递，但多了一个参数 `false`。因此，`generator` 再次发生了变化。这里是修改后的\
  \ `generator`：\n\n\n\n\n\n```cpp\ntemplate<typename T,\n         bool IntialSuspend\
  \ = true>  // #A 新的 NTTP（非类型参数）\nstruct generator {\n  using promise_type = promise_type_base<\n\
  \    T,\n    generator,\n    IntialSuspend>;  // #B 转发 IntialSuspend\n\n  using\
  \ PromiseTypeHandle = std::coroutine_handle<promise_type>;\n  using iterator = coro_iterator::iterator<promise_type>;\n\
  \n  iterator begin() { return {mCoroHdl}; }\n  iterator end() { return {}; }\n\n\
  \  generator(generator const&) = delete;\n  generator(generator&& rhs)\n  : mCoroHdl{std::exchange(rhs.mCoroHdl,\
  \ nullptr)}\n  {}\n\n  ~generator()\n  {\n    if(mCoroHdl) { mCoroHdl.destroy();\
  \ }\n  }\n\n  T operator()()\n  {\n    T tmp{};\n    // #C 使用 swap 处理潜在的移动并定义的清理状态\n\
  \    std::swap(tmp, mCoroHdl.promise().mValue);\n\n    return tmp;\n  }\nprivate:\n\
  \  // #D 因为默认构造函数是私有的，所以 generator 必须是友元\n  friend promise_type;\n  explicit generator(promise_type*\
  \ p)\n  : mCoroHdl(PromiseTypeHandle::from_promise(*p))\n  {}\n\nprotected:\n  PromiseTypeHandle\
  \ mCoroHdl;\n};\n```\n\nListing 2.20\n\n```cpp\ntemplate<typename T,\n         typename\
  \ G,\n         bool InitialSuspend>  // #A 控制初始挂起\nstruct promise_type_base {\n\
  \  T mValue;\n\n  std::suspend_always yield_value(T value)\n  {\n    mValue = value;\n\
  \    return {};\n  }\n  auto initial_suspend()\n  {\n    if constexpr(InitialSuspend)\
  \ {  // #B 或者始终挂起，要么从不挂起\n      return std::suspend_always{};\n    } else {\n  \
  \    return std::suspend_never{};\n    }\n  }\n\n  std::suspend_always final_suspend()\
  \ noexcept { return {}; }\n  G                   get_return_object() { return G{this};\
  \ };\n  void                unhandled_exception();\n  void                return_void()\
  \ {}\n};\n```\n\nListing 2.21\n\n正如我们看到的，`promise_type_base` 使用模板参数 `InitialSuspend`\
  \ 来切换 `initial_suspend` 的返回类型。我们现在可以控制协程是在创建后挂起，还是运行到遇到 `co_yield`、`co_return` 或\
  \ `co_await` 语句。切换的原因是：对于 `Parse` 的 `generator` 情况，我们希望协程运行到第一个 `co_yield` 语句；但在基于范围的\
  \ for 循环的 `sender` 情况中，我们希望在创建时挂起协程，并在基于范围的 for 循环开始时恢复它。\n\n但 `co_await` 部分在哪里呢？还记得我们之前有一个\
  \ `awaitable_promise_type` 吗？`await_transform` 会向协程状态机（FSM）信号 `co_await` 时该做什么。到为止，我们没有再看到过那部分了。原因是我们在这种方法中拆分了\
  \ `generator`。我们现在有了一个只产生值的 `generator`，就像我们第一个示例 `counter` 中的实现一样。`DataStreamReader`\
  \ 实现了 `co_await` 部分。以下是该实现：\n\n```cpp\nclass DataStreamReader {  #A 可等待对象（Awaitable）\n\
  public:\n  DataStreamReader() = default;\n\n  // #B 使用 DesMovA 禁用拷贝和移动操作\n  DataStreamReader&\n\
  \  operator=(DataStreamReader&&) = delete;\n\n  struct Awaiter {  #C Awaiter 实现\n\
  \    Awaiter& operator=(Awaiter&&) = delete;\n    Awaiter(DataStreamReader& event)\
  \ noexcept\n    : mEvent{event}\n    {\n      mEvent.mAwaiter = this;\n    }\n \
  \   bool await_ready() const noexcept\n    {\n      return mEvent.mData.has_value();\n\
  \    }\n    void await_suspend(std::coroutine_handle<> coroHdl) noexcept\n    {\n\
  \      mCoroHdl = coroHdl;  # #D 暂存等待协程的句柄。\n    }\n    byte await_resume() noexcept\n\
  \    {\n      assert(mEvent.mData.has_value());\n      return *std::exchange(mEvent.mData,\
  \ std::nullopt);\n    }\n    void resume() { mCoroHdl.resume(); }\n\n  private:\n\
  \    DataStreamReader&       mEvent;\n    std::coroutine_handle<> mCoroHdl{};\n\
  \  };\n\n  // #E 让 DataStreamReader 可等待\n  auto operator co_await() noexcept { return\
  \ Awaiter{*this}; }\n\n  void set(byte b)\n  {\n    mData.emplace(b);\n    if(mAwaiter)\
  \ { mAwaiter->resume(); }\n  }\nprivate:\n  friend struct Awaiter;\n  Awaiter* \
  \           mAwaiter{};\n  std::optional<byte> mData{};\n};\n```\n\nListing 2.22\n\
  \n正如我们看到的，`DataStreamReader` 是可等待对象（Awaitable）。这意味着 `DataStreamReader` 提供了 `Awaiter`\
  \ 类型。我们可以从 #B 中看到 `DataStreamReader` 既不可拷贝也不移动。为了节省行数，我使用了 Peter Sommerlad 的析构函数定义删除移动赋值（DesMovA\
  \ [[4]](#ch018.xhtml_ref-SommerladCNow2019Pete)) 方法来实现这种行为。该方法的实现理念是删除单个特殊的成员函数——移动赋值运算符，从而导致所有其他移动和拷贝的特殊成员函数都被删除。接下来，#B\
  \ 向我们展示了 `Awaiter` 的实现。该类型同样不可拷贝也不移动，并且有一个接收 `DataStreamReader` 引用的构造函数。这种方法的原因是保持\
  \ `Awaiter` 类型在数据上尽可能精小。我们希望通过 `co_await` 提升的数据存储在 `DataStreamReader` 中。\n\n\n\n\
  \n\n```cpp\nauto stream1 = sender(std::move(fakeBytes1));\nDataStreamReader dr{};\
  \  // #A 创建一个 DataStreamReader Awaitable\nauto p = Parse(dr);     // #B 创建 Parse\
  \ 协程并传递 DataStreamReader\nfor(const auto& b : stream1) {\n  dr.set(b);  // #C 将新字节发送给等待中的\
  \ DataStreamReader\n  if(const auto& res = p(); res.length()) { HandleFrame(res);\
  \ }\n}\nauto stream2 = sender(std::move(fakeBytes2));  // #D 模拟第二个网络流\nfor(const\
  \ auto& b : stream2) {\n  dr.set(b);  // #E 我们仍然使用之前的 dr 和 p，并向它们提供新字节\n  if(const\
  \ auto& res = p(); res.length()) { HandleFrame(res); }\n}\n```\n\n列表 2.23\n\n在 #A\
  \ 处，创建了新类型 `DataStreamReader` 的对象并在 #B 处将其传递给 `Parse`。我们现在可以在 #C 处看到用法上的差异。字节现在被传递给\
  \ Awaitable `DataStreamReader`。结果（一个完整的帧）仍然由 `Parse` 获取，并随之存储在变量 `p` 中。在这里我们可以看到通过这种实现方法创建的分离。这两个部分现在已经解耦了。我们可以使用同一个\
  \ `DataStreamReader` 并将其传递给另一个 `Parse` 或类似的协程。\n\n## 2.7：使用带有自定义 `new` / `delete`\
  \ 的协程\n\n我们到为止观察并使用的协程运行得非常完美。编译器确实为我们分配了内存，我们需要在协程句柄（coroutine-handle）上调用 `destroy`\
  \ 来让编译器再次执行内存释放。但如果我们想要更精细的控制呢？如果我们想要提供自定义的 `new` 和 `delete`，以因为我们的环境不允许从全局堆进行动态分配呢？嗯，多亏了这些自定义点，这很容易。我们所做的只是为\
  \ `PromiseType` 提供所需的函数。不需要任何魔法。即使对于 `PromiseType`，编译器也遵循通常规则，在访问全局 `operator new`\
  \ 之前先在类中查找 `operator new`。在列表 [2.24] 中，你看到了我们之前的 `promise_type_base` 的实现，它包含了两个运算符。\n\
  \n```cpp\ntemplate<typename T, typename G, bool InitialSuspend>\nstruct promise_type_base\
  \ {\n  T mValue;\n\n  std::suspend_always yield_value(T value)\n  {\n    mValue\
  \ = value;\n    return {};\n  }\n\n  auto initial_suspend()\n  {\n    if constexpr(InitialSuspend)\
  \ {\n      return std::suspend_always{};\n    } else {\n      return std::suspend_never{};\n\
  \    }\n  }\n\n  std::suspend_always final_suspend() noexcept { return {}; }\n \
  \ G                   get_return_object() { return G{this}; };\n  void         \
  \       unhandled_exception();\n  void                return_void() {}\n\n  // #A\
  \ 自定义 operator new\n  void* operator new(size_t size) noexcept\n  {\n    return\
  \ Allocate(size);\n  }\n\n  // #B 自定义 operator delete\n  void operator delete(void*\
  \ ptr, size_t size)\n  {\n    Deallocate(ptr, size);\n  }\n  // #C 允许 new 为 noexcept\n\
  \  static auto get_return_object_on_allocation_failure()\n  {\n    return G{nullptr};\n\
  \  }\n};\n```\n\n列表 2.24\n\n使用带有自定义 `new` 的协程就像承诺的那样简单。我们在 #A 处为 `PromiseType` 提供了\
  \ `operator new`，以及 `operator delete`。我选择将 `operator new` 标记为 `noexcept`，因此在 #C\
  \ 处提供了 `get_return_object_on_allocation_failure` 作为编译器的备选方案。\n\n其他一切保持不变。不需要更改调用代码。但还有更多，对吧？我们有时喜欢提供一个应该使用的自定义分配器。我们现在的变使用的是单个分配器。\n\
  \n## 2.8：使用带有自定义分配器的协程\n\n假设我们想使用一个自定义分配器，该分配器每次调用都不同，但 `PromiseType` 应该保持不变。这样，我们可以接近栈式协程（stackful\
  \ coroutines）。好吧，也许我们比真正的栈式协程所需要的要做做一些工作，但这是可行的。我们再次需要为此任务更新 `promise_type_base`。我们可以提供一个\
  \ `operator new` 模板，然后它选择正确的分配器。列表 2.25 展示了实现此 `promise_type_base`。\n\n```cpp\n\
  template<typename T, typename G, bool InitialSuspend>\nstruct promise_type_base\
  \ {\n  T mValue;\n\n  std::suspend_always yield_value(T value)\n  {\n    mValue\
  \ = value;\n    return {};\n  }\n\n  auto initial_suspend()\n  {\n    if constexpr(InitialSuspend)\
  \ {\n      return std::suspend_always{};\n    } else {\n      return std::suspend_never{};\n\
  \    }\n  }\n\n  std::suspend_always final_suspend() noexcept { return {}; }\n \
  \ G                   get_return_object() { return G{this}; };\n  void         \
  \       unhandled_exception();\n  void                return_void() {}\n\n  // #A\
  \ 自定义 operator new\n  template<typename... TheRest>\n  void*\n  operator new(size_t\
  \ size, arena& a, TheRest&&...) noexcept\n  {\n    return a.Allocate(size);\n  }\n\
  \n  // #B 自定义 operator delete\n  void operator delete(void* ptr, size_t size)\n\
  \  {\n    arena::GetFromPtr(ptr, size)->Deallocate(ptr, size);\n  }\n\n  static\
  \ auto get_return_object_on_allocation_failure()\n  {\n    return G{nullptr};\n\
  \  }\n};\n```\n\n列表 2.25\n\n你可以看到，这次 #A 是一个模板。如果你喜欢，我们采用的技巧是 `operator new` 的第二个参数是我们的分配器的类型。模板是为了可能的剩余参数准备的。这个\
  \ `new` 以我们在设置期间调用协程时的完全参数类型和顺序调用。我们可以使用分配器的引用在该分配器上调用 `Allocate`。\n\n### Arena（内存池）\n\
  \nArena 术语指的是大块连续内存，通常是一个 `unsigned char` 数组，它只被分配一次，然后用于通过已分配的内存进行分配。Arena 通常在启动时以数组的形式预分配。它们经常出现在时间敏感的系统中，在这些系统中，使用全局堆可能会导致时间差异，或者我们希望避免子组件出现内存耗尽的情况，并在启动期间分配该子组件运行所需内存。\n\
  \n\n\n\n\n```cpp\n[](#cb77-1)arena a1{};\n[](#cb77-2)arena a2{};\n[](#cb77-3)\n\
  [](#cb77-4)// #A 将 arena 传递给 sender\n[](#cb77-5)auto stream1 = sender(a1, std::move(fakeBytes1));\n\
  [](#cb77-6)\n[](#cb77-7)DataStreamReader dr{};   // #B 创建一个 DataStreamReader Awaitable\n\
  [](#cb77-8)auto p = Parse(a2, dr);  // #C 创建 Parse 协程并传递 DataStreamReader\n[](#cb77-9)\n\
  [](#cb77-10)for(const auto& b : stream1) {\n[](#cb77-11)  dr.set(b);  // #D 将新字节发送给等待中的\
  \ DataStreamReader\n[](#cb77-12)\n[](#cb77-13)  if(const auto& res = p(); res.length())\
  \ { HandleFrame(res); }\n[](#cb77-14)}\n[](#cb77-15)\n[](#cb77-16)auto stream2 =\n\
  [](#cb77-17)  sender(a1, std::move(fakeBytes2));  // #E 模拟第二个网络流\n[](#cb77-18)\n\
  [](#cb77-19)for(const auto& b : stream2) {\n[](#cb77-20)  dr.set(b);  // #F 我们仍然使用之前的\
  \ dr 和 p，并向它提供新字节\n[](#cb77-21)\n[](#cb77-22)  if(const auto& res = p(); res.length())\
  \ { HandleFrame(res); }\n[](#cb77-23)}\n```\n\nListing 2.26\n\n`using` 部分略有变化。我们现在需要向\
  \ `sender` 和 `Parse` 传递一个 `arena`，就像你在 #A 和 #C 中做的那样。除此之外，代码的其他部分对 `arena` 一无所知，并且可以像以前一样使用。\n\
  \n## 2.9: 协程中的异常\n\n到目前为止，我们查看的是协程的“理想路径”（happy path），这意味着忽略了异常。然而，由于异常是 C++ 的支柱之一，我们不能忽略它们，即使在协程中也是如此。我们已经看到通过\
  \ `PromiseType` 的函数 `void unhandled_exception()` 形式提供的异常自定义点。\n\n这个自定义点允许我们在发生异常时控制协程的行为。异常可能发生于以下两个不同的阶段：\n\
  \n1.  在协程设置阶段期间，即在创建 `PromiseType` 和 `Generator` 时。\n2.  在协程设置完成后、准备运行或已经运行之后。\n\
  \n这两个阶段在本质上是不同的。在第一个阶段，我们的 `PromiseType` 和 `Generator` 还没有完全设置好。在该阶段发生的异常将直接传递给我们的调用代码。为了捕获任何异常，让我们首先在解析器的核心部分周围添加一个\
  \ `try-catch` 块。\n\n```cpp\n[](#cb78-1)try {  // #A 封装在 try-catch 块中\n[](#cb78-2)\
  \  auto stream1 = sender(std::move(fakeBytes1));\n[](#cb78-3)\n[](#cb78-4)  DataStreamReader\
  \ dr{};\n[](#cb78-5)  auto             p = Parse(dr);\n[](#cb78-6)\n[](#cb78-7)\
  \  for(const auto& b : stream1) {\n[](#cb78-8)    dr.set(b);\n[](#cb78-9)\n[](#cb78-10)\
  \    if(const auto& res = p(); res.length()) {\n[](#cb78-11)      HandleFrame(res);\n\
  [](#cb78-12)    }\n[](#cb78-13)  }\n[](#cb78-14)  // #B 监听运行时错误\n[](#cb78-15)} catch(std::runtime_error&\
  \ rt) {\n[](#cb78-16)  PrintException(rt);\n[](#cb78-17)}\n```\n\nListing 2.27\n\
  \n你可以看到，这个实现是一个精简的版本。在此此时，我们不关心流的模拟重连。除外，所有代码现在都封装在一个 `try-catch` 块中，它作用于 `std::runtime_error`\
  \ 异常。这是随机选择的，也是我将在接下来的示例中抛出的异常。当然，其他异常也是可能的。\n\n如果在第一阶段发生异常，我们最终直接进入 #B。与任何其他异常一样，`try-block`\
  \ 中已经分配的所有对象都会被销毁。此时，我们的协程是不可用的。我们处于这个阶段的时间大约持续到 `initial_suspend` 的求值完成。之后，我们就进入了第\
  \ 2 阶段。\n\n### 选项 1：让它崩溃\n\n现在，自定义点 `unhandled_exception` 派上了用场。协程体内部或 `PromiseType`\
  \ 其他自定义点中发生的每个异常都会导致 `unhandled_exception` 被调用。在这里，我们可以决定做什么。不写代码的方法是留空 `unhandled_exception`。\n\
  \n### 选项 2：控制终止\n\n### 选项 3：重新抛出\n\n# 3: Ranges：下一代 STL\n\n在本章中，我们将看到 Concepts（参见第\
  \ 1 节](#007.xhtml_id_1-concepts-predicates-for-strongly-typed-generic-code))第一个也是最大的使用者：ranges。Ranges\
  \ 是 STL 的新元素，它使算法更加简洁，并增加了编写函数风格代码的能力。\n\n## 3.1: 动机\n\nSTL 可能是 C++ 最强大的部分之一。尽管在某些嵌入式项目中没有完全使用\
  \ STL，但该库被频繁使用，节省时间。Ranges 在各个方面改进了 STL，正如我们在本节看到的。\n\n### 3.1.1 避免代码重复\n\n使用 ranges\
  \ 的第一个动机可能是最显而易见的。`<algorithm>` 头文件提供了很好的工具，例如 `equal`，用于检查两个容器是否相等。这里有一个字符串的示例：\n\
  \n```cpp\n[](#cb79-1)const std::string firstText{\"Hello\"};\n[](#cb79-2)const std::string\
  \ secondText{\"Bello\"};\n[](#cb79-3)\n[](#cb79-4)const bool equal = std::equal(firstText.begin(),\n\
  [](#cb79-5)                              firstText.end(),\n[](#cb79-6)         \
  \                     secondText.begin());\n```\n\nListing 3.1\n\n这个示例说明了两点：重复性上的丑陋，以及这段代码比较的是整个容器，但我们每次使用算法时都必须写出\
  \ `begin` 和 `end`。\n\n\n\n\n示例列表 3.1 带有第二个缺点。代码难以阅读。其意图并不一目了然。为了确定发生了什么，我们需要解析整个\
  \ `equal` 调用，并检查 `begin` 和 `end` 迭代器没有被修改。这意味着我们实际上需要确认是否只迭代了容器的一部分，如列表 3.2 所示。\n\
  \n```\nconst std::string firstText{\"Hello\"};\nconst std::string secondText{\"\
  Bello\"};\nconst bool equal = std::equal(firstText.begin()  + 3 ,\n            \
  \                  firstText.end(),\n                              secondText.begin());\n\
  ```\n\n列表 3.2\n\nranges 给我们的好处是表现力，并减少了编写和阅读的工作量。下面的代码的作用与之前相同。唯一的区别是，这段代码使用了 ranges：\n\
  \n```\nconst bool equal = std::ranges::equal(firstText, secondText);\n```\n\n列表\
  \ 3.3\n\n如你所见，正如其名称所示，ranges 总是期望遍历整个容器。因此，它们将容器作为参数，而不是迭代器。这消除了重复编写 `begin` 和 `end`\
  \ 的需要。额外的好处是，我们可以很容易看到该操作属于两个容器的整个范围。使用 ranges 的信噪比要高得多。\n\n此时我们可以总结为，ranges 正如其名，是针对容器的整个范围（或者更好地说，一组项目）工作的，因为我们可以对它们应用过滤器和其他操作。通过这一点，它们帮助我们避免了以前需要显式使用\
  \ `begin` 和 `end` 时的重复工作。\n\n### 3.1.2: 一致性\n\n接下来的动机稍不那么明显，对应于有时令人困惑甚至错误的情况。看看列表\
  \ 3.4：\n\n```\nstruct Container {};    // #A 一个没有 begin 的容器\nint* begin(Container);\
  \  // #B 针对 Container 的自由函数 begin\n\nstruct OtherContainer {  // #C 带有 begin 的容器\n\
  \  int* begin();\n};\n\nvoid Use(auto& c)\n{\n  begin(c);       // #D 调用 ::begin(Container)\n\
  \  std::begin(c);  // #E 调用 STL std::begin\n}\n```\n\n列表 3.4\n\n我们在 #A 中有一个模拟容器的类。注意，这个容器没有\
  \ `begin` 成员函数。相反，#B 处有一个自由函数 `begin`。但我们还有 `OtherContainer`，它在 #C 中带有一个 `begin`\
  \ 成员函数。现在，在 `Use` 中，我们不知道传递给函数的哪种容器变体。因此，我们不知道存在哪个 `begin`。现在的问题是，在这种情况下调用 `begin`\
  \ 的正确方法是什么？如 #D 所示，对 `begin` 的调用始终调用自由函数。这对于 `Container` 是可以的，但对于 `OtherContainer`\
  \ 则不是。另一方面，`std::begin` 期望容器具有 `begin` 成员函数，因此对于 `OtherContainer` 是正确的，但遗憾的是对于 `Container`\
  \ 不是。所展示的代码对于这两种容器类型都无法编译。\n\n这种情况通过所谓的“使用声明两步法”来解决，如列表 3.5 所示：\n\n```\nvoid Use(auto&\
  \ c)\n{\n  using std::begin;  // #E 将 std::begin 引入命名空间\n\n  // #F 现在两个函数都在作用域内\n\
  \  begin(c);\n}\n```\n\n列表 3.5\n\n在这里，我们看到了区别：在 #E 中，我们使用 `using` 将 `std::begin`\
  \ 引入 `begin` 的重载集。如果我们现在在 #F 中放置未限定的 `begin` 调用，编译器会考虑两个 `begin` 函数。在所示的情况下，我们最终调用了自由函数。代码现在运行正常了。对于\
  \ `Container` 对象，调用了 `::begin`；对于 `OtherContainer`，`std::begin` 调用了 `OtherContainer::begin`。\n\
  \n第一个问题是你必须知道这一点。代码并不一定明显。第二个问题稍微微妙一点。假设 `std::begin` 对类型执行某些检查。例如，是否有规则规定 `begin`\
  \ 不应该与临时对象一起工作？返回此类对象的起始迭代器，一旦我们使用该指针将导致 UB（未定义行为）。STL *可以* 引入此类检查。\n\n### 3.1.3:\
  \ 安全性\n\n让我们看看 ranges 的下一个动机：安全性。考虑列表 3.7。好吧，你在现实世界中不会这样做。让我们关注大局，因为这些这些会意外发生。在这里，我们正在传递一个临时对象，并且不小心将其传递给\
  \ `std::begin` 是可能的。\n\n```\nauto it = std::begin(std::string{\"Urg\"});\n```\n\n\
  列表 3.7\n\n问题是，一旦我们开始使用 `it`，我们就面临了 UB。我在上一节中描述了对这种检查的渴望。运行时发生的错误（如此类）是非常糟糕的。我们需要额外的测试来捕获它们。无疑它们应该存在，但对于快速开发来说，运行时太晚了。\n\
  \n这就是 ranges 为我们做的事情。列表 3.8 中的代码停止编译，因为我在那里使用了 `std::ranges::begin`：\n\n```\nauto\
  \ it = std::ranges::begin(std::string{\"Urg\"});\n```\n\n列表 3.8\n\n这个版本的 `begin`\
  \ 带有这种检查，确保我们不小心传递临时对象。如果我们这样做了，就会得到一个编译时错误。除了没有错误之外，这是你能得到的最好的错误。现在，你可能理解为什么之前的动机（一致性）如此重要。我们希望手动编写的\
  \ `begin` 函数也能获得相同的检查、相同的安全性，以及未来标准中的任何其他潜在检查。\n\n我们在这里看到的是一个所谓的定制点（customization\
  \ point）。另一个定制点的例子是 `std::swap`，通过它我们可以为我们的类型提供高效的实现。得益于 ranges，我们获得了一致的约束检查。而且，这种约束检查通常是由\
  \ Concepts 完成的。\n\n### 3.1.4: 可组合性\n\nranges 的最后一个动机是可组合性。考虑列表 3.9 中的代码。你能快速看出这段代码是做什么的吗？\n\
  \n\n\n\n\n```cpp\n[](#cb87-1)std::vector<int> numbers{2, 3, 4, 5, 6};  // #A \n\
  [](#cb87-2)\n[](#cb87-3)std::vector<int> oddNumbers{};  // #B \n[](#cb87-4)std::copy_if(begin(numbers),\
  \    // #C \n[](#cb87-5)             end(numbers),\n[](#cb87-6)             std::back_inserter(oddNumbers),\n\
  [](#cb87-7)             is_odd);\n[](#cb87-8)\n[](#cb87-9)std::vector<int> results{};\
  \        // #D \n[](#cb87-10)std::transform(begin(oddNumbers),  // #E \n[](#cb87-11)\
  \               end(oddNumbers),\n[](#cb87-12)               std::back_inserter(results),\n\
  [](#cb87-13)               [](int n) { return n * 2; });\n[](#cb87-14)\n\n[](#cb87-15)//\
  \ #F \n[](#cb87-16)for(int n : results) { std::cout << n << ' '; }\n```\n\n列表 3.9\n\
  \n我们在在这段代码中使用了 STL。因此，代码本应该是很好的，而且可能确实如此，但遗憾的是，这段代码也很难读。开头是 #A 中的 vector `numbers`，它包含了一组奇数和偶数。接下来，在\
  \ #B 中，我们声明了另一个 vector `oddNumbers`。然后在 #C 中，我们用 `numbers` 中所有的奇数来填充这个 vector。这需要用到\
  \ STL 中的一个算法（`copy_if`）、关于 `std::back_inserter` 的知识，当然，还有前面已经提到过的冗余问题，即通过向该算法传递\
  \ `begin` 和 `end`。仅仅为了实现一个奇数过滤器，人就需要掌握这么多知识。\n\n代码在 #D 继续，，使用了另一个 vector `results`。这个\
  \ vector 接着被下一个算法 `transform` 使用。我们再次看到了 `begin` / `end` 的重复，以及 `std::back_inserter`\
  \ 后面跟着一个将提供的元素乘以二的 lambda 表达式。\n\n该 vector `results` 然后被用于基于范围的 for 循环，打印出所有的奇数。\n\
  \n除了需要了解 STL 的几个算法外，这段代码还创建了两个中间 vector。这产生了两个名称，我们必须起好的名字。此外，这些 vector 分配了内存。在真实世界的代码中，奇数过滤和乘法可能会分布得更散，很难看出它们之间的关系。\n\
  \n虽然 STL 算法是一件很棒的事，但它们不可组合，导致了像列表 3.9 那样的代码。通常情况下，STL 算法很难组合。Ranges 解决了这个问题，正如我们在接下来的示例列表\
  \ 3.10 中所示。\n\n```cpp\n[](#cb88-1)std::vector<int> numbers{2, 3, 4, 5, 6};  // #A\
  \ \n[](#cb88-2)\n[](#cb88-3)// #B \n[](#cb88-4)auto results =\n[](#cb88-5)  numbers\
  \ | std::views::filter(is_odd) |\n[](#cb88-6)  std::views::transform([](int n) {\
  \ return n * 2; });\n[](#cb88-7)\n\n[](#cb88-8)// #C \n[](#cb88-9)for(int n : results)\
  \ { std::cout << n << ' '; }\n```\n\n列表 3.10\n\n我们可以看到 #A 没有变化。现在，`numbers` 也是这段代码中唯一的声明\
  \ vector。在声明 `numbers` 之后，我们在 #B 中看到了 ranges 的使用。这种语法可能很熟悉，它看起来像 Unix 下管道操作。首先，`numbers`\
  \ 被传递到 `filter`，过滤掉奇数。结果被传递到 `transform`，执行乘法。这段代码比之前的版本好得多。没有了中间 vector。没有了可能干扰别人的名称。这两个操作（filter\
  \ 和 transform）都在同一个语句中完成。得益于 ranges 的另一个动机——在第 §3 节中提到的更少的代码重复——代码立即变得非常易读，即使没有对\
  \ STL 的深入了解也是如此。\n\n为了能够使用 ranges，我们需要一些术语，下所示），这些将有助于澄清问题并防止后续出现误解。\n\n## 3.2:\
  \ Ranges 的角色定义\n\n通过 ranges，我们得到了一些新术语，此时我们将先看看这些术语，以便稍后我们对我所指的内容有相同的理解。\n\n## 3.3:\
  \ 什么是 range\n\n*range*（范围）是一种带有迭代器对的类型，该对由 `begin` 和 `end` 函数组成：\n\n```cpp\n[](#cb89-1)struct\
  \ Range {\n[](#cb89-2)  T begin();\n[](#cb89-3)  T end();\n[](#cb89-4)};\n```\n\n\
  列表 3.11\n\n列表 3.11 中的代码是一个经典的迭代器对。对于至少某些 ranges，我们需要不同的东西。上面的模型描述了一个范围。在这里，`begin`\
  \ 和 `end` 返回相同的类型。\n\n### 3.3.1: 什么是 common_range?\n\nRanges，正如我们在 §3 中确定的，是由 `begin(r)`\
  \ 和 `end(r)` 返回不同类型的范围组成的。然而，`std::accumulate` 需要一个 `common_range`。这段代码看起来可行，但无法编译。原因是\
  \ `take_while` 返回的是哨兵（sentinel）。为了解决这个问题，我们需要使用 `std::views::common`，如列表 3.14 所示。\n\
  \n```cpp\n[](#cb91-1)auto v = std::vector{3, 5, 6, 7, 9};\n[](#cb91-2)auto rng =\n\
  [](#cb91-3)  v | std::views::take_while([](int x) { return x > 5; });\n[](#cb91-4)\
  \ // 迭代器类型的 View\n[](#cb91-5)  |\n[](#cb91-6)  std::views::common;\n[](#cb91-7)\n\
  \n[](#cb91-8)auto res = std::accumulate(rng.begin(), rng.end(), 0);\n[](#cb91-9)std::cout\
  \ << res << '';\n```\n\n列表 3.14\n\n在这里，我们看到只需要将 `take_while` 的结果传递到 `std::views::common`。\n\
  \n### 3.3.2: 什么是 sized_range\n\n`sized_range` 通过 `size`成员函数在常时间内知道自己的大小。\n\n## 3.4:\
  \ 范围算法\n\n*range algorithm*（范围算法）是一种操作范围的算法。在 C++20 中，我们为 C++20 之前的许多算法提供了范围特化版本。然而，截至\
  \ C++20，并不是 `<algorithm>` 中的所有算法都支持范围。`<numeric>` 中的算法也没有经过范围化。\n\n我们需要通过使用 `std::ranges`\
  \ 命名空间中的版本来专门使用范围算法。稍后我们将看到不同的新命名空间的概述。\n\n一个原因是某些范围算法并不是简单的替换品。它们具有不同的复杂度或执行参数。\n\
  \n关于范围算法还有另一个重要点：它们是立即执行的。这一点非常重要，因为我们接下来看到的视图（views）并不是立即执行的。\n\n### 3.4.1: 范围算法的投影\n\
  \n范围化算法的一个强大新功能是它们的投影参数。你可以将其看作是构建算法的转换。\n\n假设我们在列表 3.15 中有一个类似 `Book` 的数据结构。\n\n\
  \n\n\n\n```\nstruct Book {\n  std::string title;\n  std::string isbn;\n};\n\nstd::vector<Book>\
  \ books{\n  {\"Functional Programming in C++\", \"978-3-20-148410-0\"},\n  {\"Effective\
  \ C++\", \"978-3-16-148410-0\"}};\n```\n\n#### Listing 3.15\n\n我们的任务是使用一个成员作为键对这个\
  \ vector 进行排序。在这种情况下假设使用 `title`。我知道这并不复杂，但这是一个非常枯燥的任务。结果往往要么冗长，要么隐藏了意图。\n\n```\n\
  std::sort(books.begin(),\n          books.end(),\n          [](const auto& a, const\
  \ auto& b) {\n            return a.title < b.title;\n          });\n```\n\n####\
  \ Listing 3.16\n\n当然，我们可以将 lambda 表达式移出 `std::sort` 并给它起一个名字。这使得意图变得清晰，但我们现在让这个\
  \ lambda 变得可见了，这并不是我们想要的。此外，我们还需要想出一个名字，并且不要忘记、编写和阅读大量的代码。\n\n看一眼 C++20 版本，其中我们通过对\
  \ `Book` 标题使用投影 `&Book::title` 来调用 `std::ranges::sort`，而不需要手动编写 lambda。我们可以将其直接传递给排序算法，并带上排序顺序（默认为\
  \ `less`），如下：\n\n```\nstd::ranges::sort(books, {}, &Book::title);\n```\n\n#### Listing\
  \ 3.17\n\n当然，我们可以自由地提供另一个比较操作来代替默认的 `std::less`。\n\n## 3.5: 范围的视图\n\n得益于名为 `view`\
  \ 的组件，范围（ranges）变得廉价、快速并且可以减少内存分配。你可能已经了解过 C++17 中的某种 view 类型。那里有 `std::string_view`。类型名已经包含了\
  \ `view` 一词，但这个数据类型与范围并没有关系。尽管如此，其基本思想是相同的：指向某些数据的廉价 `view`。虽然 `std::string_view`\
  \ 是为字符串专门化的，但范围的 view 是通用的。\n\n### C++17: `std::string_view`\n\n通过 `std::string_view`，C++17\
  \ 提供了一种通用的数据类型来传递常量字符串。内部，`std::string_view` 存储指向字符串的指针及其长度。字符串必须是空终止符结尾的，但长度可以指向空终止符之前的位置。\n\
  \n由于 `std::string_view` 带有不同的构造函数，它可以从 C 风格字符串、`std::string` 或指针和长度构造出来。\n\n我们可以使用常用的候选成员\
  \ `data` 数据，使用 `size` 获取长度。当然，`std::string_view` 可以用于基于范围的 for 循环。\n\nview 仅在需要时才拉取数据，使得\
  \ view 成为一种创建廉价的惰性范围（lazy range）。它必须在常数时间内拥有移动构造、移动赋值和析构。因此，所有这些方法都应该是 O(1)。在可选情况下，如果拷贝构造函数和拷贝赋值运算符也满足\
  \ O(1)，则 view 也可以拥有它们。view 的主要目标是廉价且快速，以便所有操作都能在常数时间内完成。有时，人们将其称为“拉取模型”（pull model），因为数据是在需要时被拉取的。[图\
  \ 3.1] 用一个短流水线说明了这种拉取过程。\n\n![](img/file13.png)图 3.1:如 Listing [3.10] 所示的拉取模型。首先\
  \ `transform` 从 `filter` 拉取一个数字，而 `filter` 本身从变量 `numbers` 获取该数字。\n\n关于 view 最重要的一点在于名称。它们只是其他数据的视图。view\
  \ 不拥有它的元素！我们必须确保 view 使用的数据生命周期比 view 本身长。否则就会导致未定义行为（UB）。\n\n## 3.6: 范围适配器\n\n\
  范围需要的最后一个元素是 `范围适配器`（range adaptors）。它们的目的是将范围转换为 view，从而允许我们创建在 Listing [3.10]\
  \ 中已经看到的优雅函数式编程风格流水线。在那里，我们已经看到了以 `filter` 和 `transform` 形式存在的第一个范围适配器。\n\n虽然管道语法（pipe\
  \ syntax）是最常用的，但还有另一种方法。我们可以像对象一样创建范围适配器并将它们相互传递。直接传递所需的范围是可能的：\n\n```\nauto filter\
  \ = std::views::filter(numbers, is_odd);  // #A \n\n// #B \nauto transform =\n \
  \ std::views::transform([](int n) { return n * 2; });\n```\n\n#### Listing 3.18\n\
  \n在 #A 中，我们通过传递 `numbers` 和 `is_odd` 创建了 `std::views::filter`。在 #B 中，我们通过一个将数字乘以二的\
  \ lambda 创建了 `std::views::transform`。\n\n我们可以使用管道语法，这里是：\n\n```\nauto results =\
  \ filter | transform;\n```\n\n（注：原文中间部分包含一些混乱的重复，我将重新关注 [content] 块提供的实际内容。）\n\n\
  在 #A 中，我们通过传递 `numbers` 和 `is_odd` 创建了 `filter`。在 #B 中，我们通过一个将数字乘以二的 lambda 创建了\
  \ `transform`。\n\n### 3.6.1: 自定义范围适配器\n\n我们通常的目标是减少重复。假设我们的代码在多个处使用了特定的转换。例如，假设有一个存储在\
  \ `std::vector` 中的一组价格。我们希望为它们准备各种过滤器。一种是过滤所有小于 10.0 的价格。\n\n```cpp\nconst std::vector\
  \ prices{3.95, 6.0, 95.4, 10.95, 12.90, 5.50};\n\nauto subView =\n  prices |\n \
  \ std::views::filter([](auto e) { return e < 10.0; }) |\n  std::views::transform(\n\
  \    suffix { return std::to_string(i) + suffix; });\n```\n\n#### Listing 3.19\n\
  \n但并不是唯一对价格值进行过滤的地方。然而，我们必须重复货币符号。可能我们需要处理不同的货币，因此更改符号，但逻辑是相同的。在 Listing [3.19]\
  \ 中，很难看出 `transform` 添加了后缀。\n\n\n\n\n通过自定义范围适配器（range adaptor），我们可以让代码更加清晰并让代码自其表达。我们可以借助\
  \ Lambda 表达式来创建这样一个自定义适配器，如列表 3.20 所示。\n\n```cpp\nauto subView =\n  prices |\n \
  \ std::views::filter([](auto e) { return e < 10.0; })\n  // #A 像往常一样使用适配器\n  | addCurrency(\"\
  \ €\");\n```\n\n列表 3.20\n\n通过 `addCurrency`，我们有了一个带有信息的名称。这非常有价值。该函数接受一个带有货币符号的\
  \ `std::string`。你可能需要更复杂的格式化，因为对于某些货币，符号位于数字之前。让我们先忽略这一点，来谈谈如何实现 `addCurrency`。列表\
  \ 3.21 展示了一个实现。\n\n```cpp\n// #B 一个返回可调用对象的函数\nauto addCurrency(const std::string&\
  \ suffix)\n{\n  // #C 确保按值捕获！\n  return std::views::transform(\n    suffix { return\
  \ std::to_string(i) + suffix; });\n}\n```\n\n列表 3.21\n\n我们正在看的是接受一个参数（货币符号）的函数。在函数\
  \ `addCurrency` 内部 #B 处包含了之前看到的 `std::views::transform` 实际范围适配器。`addCurrency` 执行与之前相同的工作，只是货币符号现在是\
  \ Lambda 的捕获变量。确保在这里按值捕获，因为这个 Lambda 是由 `addCurrency` 返回的。就是这样，我们创建了一个自定义范围适配器，封装了对\
  \ `std::views::transform` 的调用，它使用额外的参数为转换后的范围元素添加数据。当然，如果我们的应用程序需要多次过滤小于 10.00 的数据，我们也可以对\
  \ filter 执行相同的操作。\n\n## 3.7: 新 ranges 命名空间\n\n所有的 ranges 部分都组织在 `std` 内的新命名空间中。它们的组织结构如下：\n\
  \n```cpp\nnamespace std {\n  namespace ranges { /* ... */  // 改进的算法和视图\n    namespace\
  \ views {           /* ... */\n    }                           // namespace views\n\
  \  }                             // namespace ranges\n\n  namespace views = ranges::views;\
  \  // 适配器的快捷方式\n}  // namespace std\n```\n\n列表 3.22\n\n主命名空间是 `ranges`，我们在其中找到了所有新的\
  \ ranges 元素以及与范围兼容的算法。在这个命名空间内还有一个名为 `views` 的命名空间。所有的范围适配器都位于这里。第三个命名空间 `std::views`\
  \ 是访问范围适配器的快捷方式。这意味着 `std::ranges::views` 和 `std::views` 包含相同的元素，只是拼写略有不同。\n\n例如，`std::ranges::take_view`\
  \ 变为 `std::views::take`。在已经名为 `view` 的命名空间中为 `take` 后缀 `view` 似乎是多余的。因此，命名模式是从 `std::ranges`\
  \ 中的适配器中丢弃 `_view`。\n\n### 为什么为 ranges 建立新的命名空间？\n\n当你看到 ranges，尤其是这个新命名空间时，你现在都会遇到诸如*为什么需要新命名空间*的问题。\n\
  \n答案是，某些算法在范围下的行为和保证是不同的。现在 C++ 是向后兼容的，我们不想破坏现有的代码。即使这种破坏意味着代码仍然可以编译，但运行时行为或结果发生了变化。\n\
  \n你可能会问为什么不提供额外的重载呢？请参见 §3，但简而言之，与作为算法相比，范围算法是函数对象。如果这还不够，在某些情况下参数被删除了，导致即使没有函数对象重载也变得困难。这在实际上成了错误的源头。\n\
  \n## 3.8: Ranges Concepts\n\n范围是 Concepts 的首次用法（参见 §1）。表 3.2 提供了我们拥有的各种范围概念的概述，此外还有我们之前在表\
  \ 1.3 中看到的内容。图 3.2 显示了迭代器类别之间的关系。\n\n表 3.2：范围概念。\n\n| 概念 (Concept) |  | (Description)\
  \ |\n| --- | --- |\n| `ranges::range` | 确保类型提供起始迭代器和结束哨兵（sentinel）以作为范围。 |\n| `ranges::borrowed_range`\
  \ | 范围类型，其迭代器从其可以获取的表达式中。 |\n| `ranges::sized_range` | 提供常数时间大小函数的范围。 |\n| `ranges::view`\
  \ | 一种视图范围，具有常数时间的拷贝/赋值。 |\n| `ranges::input_range` | 满足 `input`（输入）迭代器的范围。 |\n\
  | `ranges::output_range` | 满足 `output`（输出）迭代器的范围。 |\n| `ranges::forward_range` |\
  \ 满足 `forward`（向前）迭代器的范围。 |\n| `ranges::bidirectional_range` | 满足 `bidirectional`（双向）迭代器的范围。\
  \ |\n| `ranges::random_access_range` | 满足 `random_access`（随机访问）迭代器的范围。 |\n| `ranges::contiguous_range`\
  \ | 满足 `contiguous`（连续）迭代器的范围。 |\n| `ranges::common_range` | 起始和结束类型相同的范围（参见 §3）。\
  \ |\n| `ranges::viewable_range` | 可以安全转换为视图的范围。 |\n\n![](img/file14.png)图 3.2：迭代器类别及其关系。\n\
  \n## 3.9: 视图 (Views)\n\n视图彻底改变了我们使用 STL 算法的方式。它们提供了按需计算。它们生成元素（`iota`）或从其他地方引用元素。\n\
  \n## 3.10: 创建自定义范围\n\n让我们进入 ranges 的内部机制。在本节中，我们将探索如何创建一个自定义视图，包括其对应的范围适配器。为了简单起见，我们将（重）实现\
  \ `take_view`，它已经存在于 STL 中。\n\n目标是让以下代码编译并给出正确结果，就像使用 `std::views::take` 一样。\n\n\
  ```cpp\nconst std::vector<int> n{2, 3, 5, 6, 7, 8, 9};\nauto v = n | rv::filter(is_even)\
  \ | views::custom_take(2);\nstd::ranges::copy(v, std::ostream_iterator<int>(std::cout,\
  \ \" \"));\n```\n\n列表 3.23\n\n### 3.10.1: 实现视图\n\n第一步是实现实际的范围视图。在这个视图中，我们需要存储范围以及该视图应从范围内处理的元素数量。在实现此视图时，我们应用\
  \ C++20 可用的范围概念。列表 3.28 展示了一个实现，我们接下来将对其进行分析。\n\n\n\n\n```cpp\ntemplate<std::ranges::view\
  \ R>  // #A 使用 ranges::view 概念\nclass custom_take_view\n: public std::ranges::view_interface<custom_take_view<R>>\
  \ {\n  // #B 必要的数据成员\n  R                               base_{};\n  std::ranges::range_difference_t<R>\
  \ count_{};\n\npublic:\n  // #C 可默认构造\n  custom_take_view() = default;\n\n  // #D\
  \ 针对 range 和 count 的构造函数\n  constexpr custom_take_view(\n    R   base,\n    std::ranges::range_difference_t<R>\
  \ count)\n  : base_{std::move(base)}\n  , count_{count}\n  {}\n\n  // #E view_interface\
  \ 成员\n  constexpr R base() const& { return base_; }\n  constexpr R base() && { return\
  \ std::move(base_); }\n\n  // #F 实际的 begin 和 end\n  constexpr auto begin() { return\
  \ std::ranges::begin(base_); }\n  constexpr auto end()\n  {\n    return std::ranges::next(std::ranges::begin(base_),\
  \ count_);\n  }\n};\n\ntemplate<std::ranges::range R>  // #G 推导引导符\ncustom_take_view(R&&\
  \ base, std::ranges::range_difference_t<R>)\n  ->custom_take_view<std::ranges::views::all_t<R>>;\n\
  ```\n\nListing 3.24\n\n在类模板 `custom_take_view` 的模板头部中，我们直接开始应用概念 #A。此类应该只对 view\
  \ 类型起作用。该概念检查 `R` 是否为一个可移动、可默认初始化且是 view 的 range。最后一个概念检查 `R` 是否派生自 `view_base`。我们的\
  \ `custom_take_view` 在奇幻递归模板模式 (CRTP) 的帮助下，通过 `view_interface` 派生自 `view_base`。\n\
  \n在头部之后，我们声明了所需的数据成员 #B。在 #C 中，我们确保 `custom_take_view` 是可默认构造的。#D 中的下一个构造函数用于当我们从\
  \ range 和 count 创建 view 时。这是 [§3] 中列表中的第二个项目。\n\n`view_interface` 要求一些成员，它们在 #E\
  \ 中实现。`begin` 和 `end` 的实际实现在 #F 中。在这里，我们使用了 ranges 的 `begin` 版本。在 `end` 中你可以看到实际实现，这是这里除了设置默认值之外执行了操作的部分。使用\
  \ `std::ranges::next`，我们获取了 begin 之后偏移为 `count_` 的下一个迭代器元素。有了它，我们已经有可以工作的 `custom_take_view`\
  \ 实现。\n\n请注意这是一个简化版本。STL 必须处理不同的 range 类型，取决于 `R` 是 `simple_view` 还是 `sized_range`。我们在这里省略了这一点。\n\
  \n同样我们需要 #G 中的类模板参数推导 (CTAD) 推导引导符。没有这个推导引导符，我们无法仅通过传递 range 和 count 来创建 `custom_take_view`。\n\
  \n我们现在有了 `custom_take_view` 的基础。让我们让 view 完美地适配所有其他 range，并添加缺失的 range 适配器（range\
  \ adaptor）。\n\n### 3.10.2: 适用于 `custom_take_view` 的 range 适配器\n\n我们为 `custom_take_view`\
  \ 需要的下一步是一个 range 适配器。让我们加上它。你在下面看到的代码在实践中应该被封装在一个类似于 `details` 的专用命名空间中。在这里省略了。\n\
  \n```cpp\ntemplate<std::integral T>  // #A 仅整数\nstruct custom_take_range_adaptor_closure\
  \ {\n  T count_;  // #B 存储计数\n  constexpr custom_take_range_adaptor_closure(T count)\n\
  \  : count_{count}\n  {}\n  // #C 允许带上 range 调用\n  template<std::ranges::viewable_range\
  \ R>\n  constexpr auto operator()(R&& r) const\n  {\n    return custom_take_view(std::forward<R>(r),\
  \ count_);\n  }\n};\n```\n\nListing 3.25\n\n我们首先创建一个 range 适配器闭包类型 #A。目前的实现有点冗长。闭包类型可以是一个\
  \ lambda，但我认为现在看到各个部分会更容易。\n\n对于 `custom_take_view`，`custom_take_range_adaptor_closure`\
  \ 在调用运算符中存储 `count` 并返回一个 `custom_take_view`，其中 range 和内部存储的计数被传递给构造函数 #C。这样，我们已经有了\
  \ range 适配器所需的少量胶水代码。\n\n```cpp\nstruct custom_take_range_adaptor {\n  template<typename...\
  \ Args>\n  constexpr auto operator()(Args... args)\n  {\n    if constexpr(sizeof...(Args)\
  \ == 1) {\n      return custom_take_range_adaptor_closure{args...};\n    } else\
  \ {\n      return custom_take_view{std::forward<Args>(args)...};\n    }\n  }\n};\n\
  ```\n\nListing 3.26\n\n该 range 适配器不存储任何数据。适配器的目的是在被调用时创建一个 `custom_take_view`。该类型只带有一个调用运算符，这是一个变参数模板。这次我使用了一种简化方法。通过变参数模板，`custom_take_range_adaptor`\
  \ 只需要调用运算符。在内部，`custom_take_range_adaptor` 根据参数个数进行处理。如果提供一个参数，返回闭包对象；提供两个参数则传递\
  \ range 和 `count`，从而直接创建 `custom_take_view`。\n\n到目前为止一切良好。这就是所需的 range 适配器。\n\n\
  ### 3.10.3: 为 `custom_take_view` 添加管道语法\n\n我看到你也喜欢为 `custom_take_view` 拥有良好的管道语法。好了，我们如何构建它？当然，通过\
  \ `operator|`。\n\n```cpp\ntemplate<std::ranges::viewable_range R, typename T>\n\
  constexpr auto\noperator|(R&& r, const custom_take_range_adaptor_closure<T>& a)\n\
  {\n  return a(std::forward<R>(r));\n}\n```\n\nListing 3.27\n\n再次，该函数由概念保护，要求 `viewable_range`。该运算符接收\
  \ range 作为第一个参数，接收 `custom_take_range_adaptor_closure` 类型第二个。在内部，闭包类型被调用。这有效地返回了一个\
  \ `custom_take_view`。\n\n有了它，我们的 `custom_take_view` 支持管道语法。这很简单，对吧？\n\n为了一致性，我们还需要做的是创建一个自己的命名空间\
  \ `views`，并在这个命名空间中放入一个 `custom_take_range_adaptor` 对象，简写名为 `custom_take`。\n\n```cpp\n\
  namespace views {\n  inline details::custom_take_range_adaptor custom_take;\n}\n\
  ```\n\nListing 3.28\n\n完美！现在我们的 `custom_take_view` 行为就像 `std::views::take`。嗯，除了实现是简化的，省略了一些特殊情况。\n\
  \n### 3.10.4: 更通用的管道语法实现\n\n如果你经常实现自定义 view，你可能会寻找减少每个 view 代码量的方法。\n\n你可以做的一点是泛化\
  \ `operator|` 的实现。我们已经广泛使用了 range 概念。这有助于我们提供一个通用的 `operator|` 实现，如 Listing 3.29\
  \ 所示。\n\n```cpp\ntemplate<std::ranges::viewable_range R,\n         std::invocable<R>\
  \           Adaptor>\nconstexpr auto operator|(R&& r, const Adaptor& a)\n{\n  return\
  \ a(std::forward<R>(r));\n}\n```\n\nListing 3.29\n\n\n\n\n我们知道第一个参数必须是一个范围。我们甚至让编译器推断出第二个模板类型，然后用它来实例化\
  \ `custom_take_range_adaptor_closure`。在这里，我们没有使用这种显式类型，而是使用 `std::invocable` 概念来确保第二个模板参数是可调用的（invocable）。这样，我们不需要显式地命名该类型，同时保留了约束条件。\n\
  \n这虽然不多，但可以为你省去为每个类型实现 `operator|` 的工作。\n\n#### 核心点总结 (Cliff notes)\n\n*   减少重复：使用\
  \ `std::ranges::sort(v);` 代替 `std::sort(v.begin(), v.end());`。\n*   使用 `std::ranges::begin`\
  \ 代替 `std::begin` 时，我们总是获得约束检查，即使该调用最终落实为用户提供的 `begin`。\n*   范围（Ranges）防止了我们传递那些会导致悬空引用的临时变量。\n\
  *   注意，使用范围后，向算法传递临时变量变得可行。这看起来可能方便，但实际上并非。\n*   如果你从自定义范围适配器返回 lambda 表达式，请务必按值捕获（by-copy）。\n\
  \n# 4：模块：更优的包含方式\n\n模块是 C++ 中期待已久的特性之一。我们可以在某些平台上使用预编译头文件，但它们从未被标准化。C++20 通过标准化模块定义最终改变了这一点。在本章中，我想让你深入了解模块的工作原理，并向你展示如何在旧系统中引入模块。在开始之前，我想先解释一下没有模块的世界，这自然而然地引出了为什么要使用模块。\n\
  \n## 4.1: 模块需求的背景\n\n根据我的经验，在讨论模块时，编译加速是一个经常出现的话题。虽然情况*确实如此*，但其他点也使得模块变得非常受欢迎。\n\
  \n### 4.1.1: 包含地狱 (include hell)\n\n让我们先考虑以下完全没有模块的头文件 `<StrCat.h>`：\n\n```cpp\n\
  #ifndef STRCAT_H\n#define STRCAT_H\n\n#include <string>\n#include <type_traits>\n\
  \nnamespace details {\n  inline std::string ConvertToBoolString(bool b)\n  {\n \
  \   return b ? std::string{\"true\"} : std::string{\"false\"};\n  }\n}  // namespace\
  \ details\n\ntemplate<class T>\ninline decltype(auto) Normalize(const T& arg)\n\
  {\n  // 先处理 bool 类型，我们喜欢它们的字符串表示。\n  if constexpr(std::is_same_v<std::remove_cvref_t<T>,\
  \ bool>) {\n    return details::ConvertToBoolString(arg);\n  } else if constexpr(std::is_integral_v<T>)\
  \ {\n    return std::to_string(arg);\n  } else {\n    return (arg);\n  }\n}\n\n\
  #endif /* STRCAT_H */\n```\n\n列表 4.1\n\n此外，假设另一个包含了 `<StrCat.h>` 的头文件 `<String>`。\n\
  \n这个示例至少产生了两个问题。我们经常会有包含依赖，例如 `<string>` 或 `<type_traits>`。然后，通过 `<String>`，`<StrCat.h>`\
  \ 的所有头文件都会被包含一次。查看 STL，它通常需要包含 `<stdint>` 等头文件来获取 `std::size_t` 和其他基本类型。例如，`std::vector`\
  \ 需要 `std::size_t`，以及 `std::string`。\n\n这些重复包含产生的问题是它们会损害编译时间。每当我们包含一个头文件，编译器都必须在包含列表中查找该头文件。然后，必须从文件系统中读取文件。接着开始解析。虽然我们使用头文件保护（include-guards）来防止符号重复和其他问题，但即使有头文件保护，编译器也必须完全解析头文件。如果头文件存储在网络位置，访问时间可能会进一步减慢编译速度。重复这样做会进一步损害编译时间。因此，为了改进编译时间，首先要避免的当然是加速这部分。\n\
  \n### 4.1.2: 我喜欢保留秘密\n\n还有其他。看一眼 `Normalize`。在那里我们看到了一个典型的案例。其意图是提供 `details` 空间。遗憾的是，在\
  \ `Normalize` 中，我们无法控制哪些符号被导出。头文件单元（header units）的直观观点是它们就是预编译头文件。\n\n## 4.2: 创建模块\n\
  \n总来说，我认为创建一个模块很容易的。你只需要学习两个新关键字，其中一个是：\n\n*   `module`：声明一个模块或说明一个文件是模块的一部分。\n\
  *   `import`：一个模块或头文件单元。\n\n第三个关键字你已经熟悉了 `export`。正如名称所示，`export` 允许我们控制从模块中导出哪些符号。\n\
  \n在创建模块时，我们可以先“小作弊”，通过创建一个所谓的头文件单元来获得一个快速、且廉价的解决方案。这能带给你即时的速度。\n\n### 4.2.1: 头文件单元\n\
  \n头文件可以转换为头文件单元，但它不会具备模块的所有优势。例如，使用头文件单元，我们无法控制哪些符号被导出。头文件单元是被导入的遗留头文件。\n\n回到列表\
  \ 4.1 中的示例，为了让 `<StrCat.h>` 头文件单元，我们使用 `import` 代替 `#include`：\n\n```cpp\nimport\
  \ \"StrCat.h\";\n```\n\n列表 4.2\n\n`\"\"` 或 `<>` 的表示与包含文件相同。第一种语法在本地文件夹查找，而第二种语法期望文件位于编译器的系统包含路径中。\n\
  \n开始头文件单元时有趣的部分是构建系统。正如我所说，它们基本上是预编译头文件。这意味着我们需要一个步骤来预编译此类头文件，其次，结果需要存储在已知位置。我在此处跳过细节，因为它们很大程度上依赖于你的编译器和工具链。\n\
  \n### 4.2.2: 命名模块\n\n处理模块的一种得更好的方法，且能让你充分利用模块的威力，是创建一个命名模块。这种命名模块就是我们所指的“模块”。命名模块使用新的语法和所有的模块特性。\n\
  \n\n\n\n让我们来看一个模块的结构，更准确地说，一个模块接口。\n\n```\n[](#cb110-1)module;  // #A 开始模块，仅在我们有遗留包含包含时需要\n\
  [](#cb110-2)// 全局模块片段，遗留的 #includes 放在此处\n[](#cb110-3)\n[](#cb110-4)[export] module\
  \ AwesomeModule;  // #B 如果是接口则导出\n[](#cb110-5)// 模块范围 (Purview)，导入语句放在此处\n[](#cb110-6)\n\
  [](#cb110-7)import x;         // #C 导入仅在模块内可见的符号\n[](#cb110-8)export import y; \
  \ // #D 导入内容并将其导出\n[](#cb110-9)\n[](#cb110-10)export\n[](#cb110-11){\n[](#cb110-12)\
  \  // #E 导出此处的所有内容\n[](#cb110-13)}\n[](#cb110-14)\n[](#cb110-15)export void Fun();\
  \  // #F 导出单个符号\n[](#cb110-16)void        Bun();  // #G 此符号保留在模块内部\n```\n\n列表 4.3\n\
  \n具名模块从 `#A` 处的全局模块片段开始。这部分是可选的。只有当我们必须包含遗留头文件时，才全局模块片段。\n\n接下来，`#B` 开始具名模块 `AwesomeModule`\
  \ 的模块接口。如果没有 `export`，我们处理的就是模块实现。这是一个可选的步骤。和之前的头文件一样，我们可以决定将接口和实现拆离开来。然而，由于模块允许我们将某些内容保持在模块内部，拆接口和实现可能更多变成一个关于代码结构的问题。在具名模块开始之后，所谓的“范围（Purview）”开始。我们在这里所做的一切操作默认都是私有的。所有希望在模块外部可见的符号都需要在前面加上\
  \ `export`。\n\n模块有新的扩展后缀名吗？\n\n一旦你开始编写模块，你可能会问自己具名模块的合适文件扩展名是什么？\n\n人们希望为模块接口文件有一个专用的扩展名。原因之一是可以快速知道一个项目是否带有模块，或者编写一个快速搜索命令来查找仅位于模块接口文件中的符号。\n\
  \n两个主流编译器 Clang 和 MSVC 支持不同的模块接口文件扩展名：\n\n- Clang: `.cppm` 或 `cxxm`\n- MSVC: `ixx`\n\
  \nGCC 似乎可以在没有扩展名提示的情况下检测出一个文件是否为模块接口。\n\n然而，没有哪个编译器为可选的模块实现文件提供新的后缀。原因是这些文件在某种程度上与普通的\
  \ C++ 文件相似，所以你可以对它们使用通常的文件扩展名。\n\n我们从 `#E` 中看到，我们可以创建一个整个导出范围。另一种方法是在符号之前加上 `export`，如\
  \ `#F` 所示。在没有该 `export` 且在 `export` 范围之外的情况下，符号仅在模块内部可见，`#G` 就是这种情况。\n\n具名模块和头文件单元（header\
  \ unit）之间存在一个非常关键的区别，后者保留了宏，而模块不会。\n\n### 模块与名称中的点号\n\n与其他语言不同，你可能知道名称中的点号意味着包的某种结构，但在\
  \ C++ 模块名称中的点号纯粹是美学考虑。它们对编译器的结果没有影响，只影响我们人类的可读性。\n\n太棒了！有了这些新知识，我们可以将列表 [4.1] 润色为一个闪光的具名模块，并享受模块的所有好处。\n\
  \n## 4.3: 将模块应用于现有代码库\n\n在涵盖了模块的基础之后，是时候看看它们在代码中是如何工作的，以及你如何将它们应用到现有代码库中了。\n\n###\
  \ 4.3.1: 消除命名空间细节\n\n作为第一个示例，我想考虑之前在列表 [4.1] 中看到的 `Normalize` 函数。代码最初来自 C++ Insights。为了方便起见，再次列出代码。\n\
  \n```\n[](#cb111-1)import strcat;\n[](#cb111-2)import<cstdio>;\n[](#cb111-3)\n[](#cb111-4)int\
  \ main()\n[](#cb111-5){\n[](#cb111-6)  const bool b{true};\n[](#cb111-7)\n[](#cb111-8)\
  \  const auto s = Normalize(b);\n[](#cb111-9)\n[](#cb111-10)  printf(\"%s\", s.c_str());\n\
  [](#cb111-11)}\n```\n\n列表\n\n还有更多转换函数可用，在 `Normalize` 中，你可以看到当类型 `T` 为 `bool` 或其他类型时，函数会执行不同的操作。我们今天关注\
  \ `bool` 情况。\n\n为了将 `bool` 转换为 `std::string`，我有一个名为 `ConvertToBoolString` 的函数。如果你查看\
  \ `ConvertToBoolString` 的定义，或者更好地查看该定义所在的位置，你会发现我将 `ConvertToBoolString` 放在了一个名为\
  \ `details` 的命名空间中。其他人有不同的名字。有时我称那个命名空间 `helper`。我曾见过 `hands_off`。它们都表达相同的意图，即：*这是内部的*。\n\
  \n### 4.3.2: 现在我可以隐藏秘密\n\n通过 C++20 的模块，我们可以以更好的方式构建我们的 API。看下面的版本。\n\n```\n[](#cb112-1)export\
  \ module strcat;\n[](#cb112-2)import<type_traits>;\n[](#cb112-3)import<string>;\n\
  [](#cb112-4)std::string ConvertToBoolString(bool b)\n[](#cb112-5){\n[](#cb112-6)\
  \  return b ? std::string{\"true\"} : std::string{\"false\"};\n[](#cb112-7)}\n[](#cb112-8)export\
  \ template<class T>\n[](#cb112-9)inline decltype(auto) Normalize(const T& arg)\n\
  [](#cb112-10){\n[](#cb112-11)  // 先处理 bool，我们喜欢它们的表示方式。\n[](#cb112-12)  if constexpr(std::is_same_v<std::remove_ref_t<T>,\
  \ bool>) {\n[](#cb112-13)    return ConvertToBoolString(arg);\n[](#cb112-14)  }\
  \ else if constexpr(std::is_integral_v<T>) {\n[](#cb112-15)    return std::to_string(arg);\n\
  [](#cb112-16)  } else {\n[](#cb112-17)    return (arg);\n[](#cb112-18)  }\n[](#cb112-19)}\n\
  ```\n\n列表 4.4\n\n首先，我开始声明该文件是一个 `strcat` 模块。接下来，就像在头文件中一样，我导入此模块所需的头文件 `<type_traits>`\
  \ 和 `<string>`。在这里我使用了头单元以获得最佳性能。\n\n然后，在 `#B` 中，我们再次看到了 `ConvertToBoolString`。实现没有变化，只是函数不再位于特定的命名空间中。为什么？简单因为命名空间不再需要了。\n\
  \n\n\n继续 #C。我们看到了 `Normalize`，它和 `ConvertToBoolString` 一样没有变化，只是函数声明以 `export` 开头。通过这种方式，我们告诉编译器和我们的开发者，`Normalize`\
  \ 是该模块导出的函数，供其他模块或文件导入使用。任何没有标记为 `export` 的内容在我们的模块外部都是不可用的。\n\n### 4.3.3: 你收获了什么\n\
  \n有了将函数标记为私有（或不导出）的新能力，如果我们是库供应商，我们就有了更好的方法来为客户保证稳定的应用程序二进制接口（ABI）。为什么呢？因为我们现在可以显式地命名应该导出的符号，并隐藏其他符号。这样一来，我们就不再暴露那些以后可能想要更改的内部实现。例如，假设某天我可以将\
  \ `ConvertToBoolString` 改为 `constexpr`。这并不是我的库客户应该看到的内容。另一方面，我可能会决定移除 `inline`。在旧世界中，这将面临\
  \ ABI 破坏的风险，因为编译器有权内联这个函数，但并非强制这样做。添加或删除 `inline` 可能会导致 ABI 破坏。这对于导出的函数仍然如此，但对于私有函数则不再如此。\n\
  \n表达私有符号和公共符号之间区别的能力，我认为到目前为止是模块最有价值的部分。我们第一次有了一种机制来声明我们想要导出的符号——这让我们可以选择使用模块私有符号，在没有任何顾限制的情况下从内部构建我们的代码，因为他人不再被允许调用内部部分。在某种意义上，模块赋予了我们与我们长期以来通过类所拥有的类似的控制权。\n\
  \n我们刚刚看到的也适用于与模块无关的其他模式。例如，指向实现的指针（PIMPL）惯用法通常用于加快编译时间。有了模块，我们可以编写*正常*代码，而无需 PIMPL\
  \ 所需的间接层。\n\n### 4.3.4: 模块中的模板\n\n模板一直存在，但让我指出的是，通过 `Normalize`，我们从头都在看一个函数模板。这回答了我们是否可以在模块中使用模板的问题。是的，我们可以。模板的定义被保留了，因为模块被编译成类似抽象语法树（AST）的内容，这允许我们从编译后的模块中实例化模板。\n\
  \n### 4.3.5: 终结 `DEBUG`\n\n记得我告诉过你只有头文件单元（header units）会保留宏，但具名模块不会吗？这是一件好事！是的，某些地方仍然需要它们。但让我们来看一个可以使用模块将\
  \ `define` 移动得更远的情况。\n\n考虑以下情况。我们有一些代码应该只在二进制以调试模式编译时执行。\n\n```cpp\n#ifdef DEBUG\n\
  std::cout << \"Debugging is enabled\";\n#endif\n```\n列表 4.5\n\n诚然，这是不言而易的。但代码库中存在大量的定义会让分析我们的代码以及处理这些代码变得更加困难。假设有人不小心删除了分号。你发现此错误的速度取决于你是总是编译调试模式，还是只在需要时编译。在后者的情况下，可能会过去几周你才注意到有错误，然后追溯错误源就会变得复杂得多。虽然删除分号很少见，但函数\
  \ API 的变化是这里遇到问题的更常见来源。\n\n一种更好的方法（目前与模块还没有关系）是切换到 `constexpr if`（参见 Std-Box 1.4）：\n\
  \n```cpp\nif constexpr(DEBUG) { std::cout << \"Debugging is enabled\"; }\n```\n\
  列表 4.6\n\n这样一来，错误的代码即使在发布模式下也会编译，但在那里会被丢弃。代码片段可以进一步改进，将 `define` 移动得更远：\n\n```cpp\n\
  if constexpr(IsDebugEnabled()) {\n  std::cout << \"Debugging is enabled\";\n}\n\
  ```\n列表 4.7\n\n我们将 `define` 隐藏在 `constexpr` 之后，或者如果你想查看 §12，甚至是一个 `consteval` 函数：\n\
  \n```cpp\nconstexpr bool IsDebugEnabled()\n{\n  return DEBUG;\n}\n```\n列表 4.8\n\n\
  我们确保 `IsDebugEnabled` 返回一个 `bool`，使我们的代码在此是类型安全的。虽然这已经是一个很好的方法，但它与模块无关，对吧？嗯，困扰我很久的问题是\
  \ `DEBUG` 在二进制文件中仍然是可以访问的。每个人仍然可以使用旧方案并编写像第一个或第二个示例中的代码。我想做的是向所有人隐藏 `DEBUG`，并该符号仅通过\
  \ `IsDebugEnabled` 访问。此时，我们讨论的是模块。\n\n让我们将整个 `IsDebugEnabled` 函数移动到一个新创建的名为 `config`\
  \ 的模块中。我们预计随着时间的，会有会有这样的项目。为此，我们以 `export module` 开始我们的模块，后面跟着我们的名称 `config`。剩下的工作就是给\
  \ `IsDebugEnabled` 加上 `export` 前缀，搞定。\n\n```cpp\nexport module config;\n\nexport\
  \ consteval IsDebugEnabled()\n{\n  return DEBUG;\n}\n```\n列表 4.9\n\n我们确保 `IsDebugEnabled`\
  \ 返回一个 `bool`，使我们的代码在此是类型安全的。虽然这已经是一个很好的方法，但它与模块无关，对吧？嗯，困扰我很久的问题是 `DEBUG` 在二进制文件中仍然是可以访问的。每个人仍然可以使用旧方案并编写像第一个或第二个示例中的代码。我想做的是向所有人隐藏\
  \ `DEBUG`，并该符号仅通过 `IsDebugEnabled` 访问。此时，我们讨论的是模块。\n\n### 4.3.6: 类成员函数的内联\n\n让我向你们介绍模块带来的另一个微小变化。看看\
  \ 4.10。\n\n```cpp\nstruct CppGreat {\n  CppGreat();\n};\n```\n列表 4.10\n\n在这里，我们看到了一个名为\
  \ `CppGreat` 的类，它有一个类外构造函数。通常这样做的原因是内联函数是隐式内联的。然而，如果成员函数有很多代码，我们不希望这些代码被内联。实现这一点的唯一方法是类外定义。\n\
  \n由于模块的工作方式不同，它们只被解析和编译一次，无论被包含多少次，这种系统在那里是不需要的。事实上，模块的系统是不同的。\n\n在模块中定义的类成员*不是*隐式的\
  \ `inline`。我们可以自由地内联一个更大的函数，并在我们希望该函数内联时需要显式指定。\n\n### 4.3.7: 某些限制\n\n虽然我对模块允许我隐藏更多宏感到高兴，但这一事实也有副作用。有时（我真的很遗憾必须写这些行代码），宏是有帮助的。一个流行的例子是\
  \ `<cassert>` 中的 `assert`，它的标准定义如下：\n\n```cpp\n#ifdef NDEBUG\n  #define assert(condition)\
  \  ((void)0)\n#else\n  #define assert(condition)  /*implementation defined*/\n#endif\n\
  ```\n列表 4.11\n\n现在，如果我们作为头文件单元导入 `<cassert>`，宏就会被保留。那里没有问题。然而，在纯模块的世界中，通过使用具名模块，`assert`\
  \ 定义丢失了。看起来即使在未来，我们仍然一些老式的头文件。\n\n\n\n文本格式化通常是编程中不可或缺的一部分。一个用例是文本用户界面（UI）的本地化，本地化意味着将文字从一种语言翻译到另一种语言，并更改如小数点分隔符之类的符号。通常，我们的格式化参数中存在重复内容，例如多个相同货币的数值。其他用例还包括日志或调试消息的格式化。\n\
  \n在本章中，让我们假设正在从事与金融相关的工作，因此必须格式化股票指数信息。首先，让我们看看在 C++20 之前的选择。\n\n## 5.1: C++20 之前的字符串格式化\n\
  \nC++20 之前的字符串格式化意味着使用 iostreams 或 `snprintf` 或库（后者并不真正符合 C++ 风格）。这两者都有优缺点，我们将在本节中看到。假设我们正准备创建这些华丽的股市横幅，显示不同的股票指数值及其变化，就像所有新闻频道显示的那样。\n\
  \n我们将使用三个指数：`DAX`、`Dow` 和 `S&P 500`。输出包含当前股票指数点、与昨天的点差以及百分比变化。每个指数都打印在专用行上，且所有列完美对齐。这是一个目标输出的示例：\n\
  \n```\nDAX         13108.50   55.55  0.4\nDow         29290.00  209.83  0.7\nS&P\
  \ 500      3561.50   24.49  0.6\n```\n\n在开始格式化之前，我们需要需要进行格式化的数据。因此，我们创建了一个 `StockIndex`\
  \ 类，用于存储：\n\n- 指数的名称，\n- 上一次点数，\n- 当前点数。\n\n每当我们通过 `setPoints` 设置当前点数时，方法会自动更新上一次点数。除此之外，`StockIndex`\
  \ 还有一些访问函数：\n\n- `setPoints` 如前所述，更新点数；\n- `points()` 返回当前点数；\n- `pointsDiff()`\
  \ 返回上一次与现在的点数差；\n- `pointsPercent()` 返回上一次与现在的百分比差。\n\n下面给了一个可能的实现。\n\n```cpp\n\
  class StockIndex {\n  std::string mName{};\n  double      mLastPoints{};\n  double\
  \      mPoints{};\n\npublic:\n  StockIndex(std::string name)\n  : mName{name}\n\
  \  {}\n\n  const std::string& name() const { return mName; }\n\n  void setPoints(double\
  \ points)\n  {\n    mLastPoints = mPoints;\n    mPoints     = points;\n  }\n\n \
  \ double points() const { return mPoints; }\n\n  double pointsDiff() const { return\
  \ mPoints - mLastPoints; }\n\n  double pointsPercent() const\n  {\n    if(0.0 ==\
  \ mLastPoints) { return 0.0; }\n    return (mPoints - mLastPoints) / mLastPoints\
  \ * 100.0;\n  }\n};\n```\n\n代码列表 5.1\n\n配备了这个类后，我们准备好创建股票指数并填充值，然后对其进行格式化。我们实现了一个方法\
  \ `GetIndices` 来创建股票指数。这使得我们能够使用不同的格式化方法使用相同的股票指数。\n\n```cpp\nstd::vector<StockIndex>\
  \ GetIndices() {\n  StockIndex dax{\"DAX\"};\n  dax.setPoints(13'052.95);\n  dax.setPoints(13'108.50);\n\
  \n  StockIndex dow{\"Dow\"};\n  dow.setPoints(29'080.17);\n  dow.setPoints(29'290.00);\n\
  \n  StockIndex sp{\"S&P 500\"};\n  sp.setPoints(3'537.01);\n  sp.setPoints(3'561.50);\n\
  \n  return {dax, dow, sp};\n}\n```\n\n代码列表 5.2\n\n太棒了！现在我们一切已就绪，准备好格式化数据。由于这是一本\
  \ C++ 书，让我们从 C++ 方式开始，使用 iostreams。\n\n### C++14: 数字分隔符\n\n数字分隔符 `'` 是在 C++14 中引入的。它允许我们让数字对人类更易读。数字分隔符不会影响编译器查看或处理数字的方式。我们也可以自由放置分隔符：\n\
  \n```cpp\nauto x = 2'000'000;   // 可能是常用的数字分隔方式\nauto y = 2'000'000;\n```\n\n##\
  \ 5.2: 使用 iostreams 格式化\n\n在开始格式化之前，我们需要需要进行格式化的数据。因此，我们创建了一个 `StockIndex` 类，用于存储……（为了简洁已省略）\n\
  \n配备了这个类后，我们准备好创建股票指数并填充值，然后对其进行格式化。我们实现了一个方法 `GetIndices` 来创建股票指数。这使得我们能够使用不同的格式化方法使用相同的股票指数。\n\
  \n```cpp\nfor (const auto& index : GetIndices()) {\n  std::cout << index.name()\
  \ << \" \"\n            << index.points() << \"  \"\n            << index.pointsDiff()\
  \ << \"  \"\n            << index.pointsPercent() << \"%\\n\";\n}\n```\n\n太棒了！现在我们一切已就绪，准备好格式化数据。由于这是一本\
  \ C++ 书，让我们从 C++ 方式开始，使用 iostreams。\n\n\n\n还有更多。如果我们想在项目中多次进行这种格式化打印呢？当然，我们可以创建一个命名函数并让大家都使用它。但在这种情况下，`iostream`\
  \ 要好得多。我们可以为 `operator<<` 提供自己的重载。这样一来，我们就可以将 `StockIndex` 对象传递给 `std::cout`，而由\
  \ `operator<<` 来处理统一的格式化。通过这种，用户就不需要记住某个格式化函数了，我认为这非常棒。其实现方式与我们之前的非常相似，只是这次基于范围的\
  \ for 循环体被移动到了 `operator<<` 中。由于该运算符要写入的流是通过参数传递给 `operator<<` 的，我们需要将 `std::cout`\
  \ 修改为输出流参数的名字。在下面的代码中它是 `os`。以下是这样的实现：\n\n```\n[](#cb125-1)std::ostream& operator<<(std::ostream&\
  \     os,\n[](#cb125-2)                         const StockIndex& index)\n[](#cb125-3){\n\
  [](#cb125-4)  os << std::fixed;\n[](#cb125-5)  os << std::setprecision(2);\n[](#cb125-6)\n\
  [](#cb125-7)  os << std::setw(10) << std::left << index.name() << \"  \"\n[](#cb125-8)\
  \     << std::setw(8) << std::right << index.points() << \"  \"\n[](#cb125-9)  \
  \   << std::setw(6) << index.pointsDiff() << \" \"\n[](#cb125-10)     << index.pointsPercent()\
  \ << '%' << '';\n[](#cb125-11)\n[](#cb125-12)  return os;\n[](#cb125-13)}\n[](#cb125-14)\n\
  [](#cb125-15)void WithIostreamOperator()\n[](#cb125-16){\n[](#cb125-17)  for(const\
  \ auto& index : GetIndices()) { std::cout << index; }\n[](#cb125-18)}\n```\nListing\
  \ 5.6\n\n### 本地化格式化\n\n现在，如果我们再次加大火力会怎样？假设我们想要有一个依赖于区域的小数分隔符？我们喜欢德语表示法。德语中的小数点分隔符是逗号而不是句号。为了实现这一点，我们需要设置相关\
  \ iostream 的区域（locale），如如下代码中的 #A 所示：\n\n```\n[](#cb126-1)for(const auto& index\
  \ : GetIndices()) {\n[](#cb126-2)  std::cout << std::fixed;\n[](#cb126-3)  std::cout\
  \ << std::setprecision(2);\n[](#cb126-4)  // #A 应用所需的区域\n[](#cb126-5)  std::cout.imbue(std::locale(\"\
  de_DE.UTF-8\"));\n[](#cb126-6)\n[](#cb126-7)  std::cout << std::setw(10) << std::left\
  \ << index.name()\n[](#cb126-8)            << \"  \" << std::setw(8) << std::right\n\
  [](#cb126-9)            << index.points() << \"  \" << std::setw(6)\n[](#cb126-10)\
  \            << index.pointsDiff() << \" \"\n[](#cb126-11)            << index.pointsPercent()\
  \ << '%' << '';\n[](#cb126-12)}\n```\nListing 5.7\n\n如果我们正在更改区域，意味着要更改整个流的区域。如果有必要，我们需要备份并恢复区域。进一步的设计选择是在将区域的更改封装在\
  \ `operator<<` 中，还是留给用户在调用 `operator<<` 之前更改流的区域。\n\n### 使用 iostreams 格式化 - 总结\n\
  \n总结一下 iostreams 的体验：这种格式化方法的一部分需要敏锐的眼睛以及关于调用哪些函数的知识。拥有 `operator<<` 对于统一格式化也是很棒的。然而一旦涉及到本地化，事情就会变得复杂一些。\n\
  \n有一点我们没有直接讨论过但随处可见的，iostream 带来了一个巨大的优势。iostreams 是类型安全的。我们不会意外地将字符串打印为 `int`。在我们不需要提供格式化字符串的情况下正是如此。然而，格式化字符串会让我们更清楚输出的样子。这直接引导我们使用了\
  \ `printf`。\n\n### 5.1.2: 使用 `printf` 格式化股票指数\n\n我们继续打印股票指数的示例。所需的输出与之前相同。以下是使用\
  \ `printf` 的实现：\n\n```\n[](#cb127-1)for(const auto& index : GetIndices()) {\n[](#cb127-2)\
  \  printf(\"%-10s  %8.2lf  %6.2lf  %4.2lf%%\",\n[](#cb127-3)         index.name().c_str(),\n\
  [](#cb127-4)         index.points(),\n[](#cb127-5)         index.pointsDiff(),\n\
  [](#cb127-6)         index.pointsPercent());\n[](#cb127-7)}\n```\nListing 5.8\n\n\
  `iostream` 和 `printf` 的主要区别在于 `printf` 使用格式化字符串，而 `iostream` 使用 `operator<<`。在 `printf`\
  \ 中，我们使用格式化字符串来指定输出格式。例如，`%-10s` 意味着字符串左对齐宽度为 10。`%8.2lf` 意味着浮点数右对齐，宽度为 8，两位小数。这比一系列\
  \ `operator<<` 调用更具可读性。然而，`printf` 不是类型安全的。如果你传递了错误的类型说明，可能会导致未定义行为或崩溃。这就是 `iostream`\
  \ 的优势。\n\n### 5.2: 使用 `std::format` 格式化股票指数\n\n我们继续打印股票指数的示例。所需的输出与之前相同。以下是使用 `std::format`\
  \ 的实现：\n\n```\n[](#cb128-1)for(const auto& index : GetIndices()) {\n[](#cb128-2)\
  \  std::cout << std::format(\n[](#cb128-3)    \"{:10}  {:8.2f}  {:6.2f}  {2f}%\"\
  ,\n[](#cb128-4)    index.name(),\n[](#cb128-5)    index.points(),\n[](#cb128-6)\
  \    index.pointsDiff(),\n[](#cb128-7)    index.pointsPercent());\n[](#cb128-8)}\n\
  ```\nListing 5.9\n\n正如本例所示，`std::format` 使用大括号来指定格式化参数。因为 `std::format` 是一个变长模板，每个参数的类型都被保留了。这允许我们在最简单的情况下写出左括号和右括号。库会推断类型并应用该类型的默认格式。这些默认格式列在表\
  \ 5.1 中。自动类型推断和格式化是我们从 iostream 中已知的优势。在我们的案例中，我们需要指定字符串的宽度，我们在大括号内通过 `:10` 实现。我们仍然省略了类型并让库来推断。\n\
  \n对于后续参数，我们需要指定类型，因为我们需要在指定宽度的同时指定位数。我们也可以在这里看到对齐是通过 `>` 控制的。\n\n### 5.2.1: `std::format`\
  \ 说明符\n\n\n\n\n\n## 5.2 使用 `std::format`\n\n我们已经确认为 `std::format` 使用大括号来指定格式参数。我们可以在这些大括号中指定预期的类型及其格式。在上一个示例中已经展示了一些样本。\n\
  \n默认情况下，`std::format` 带有 17 种不同的格式说明符，让我们对所需的输出有完全的控制。浮点数允许各种格式，例如科学计数法或固定点法。表 5.1\
  \ 提供了完整列表，包括可用的缀。\n\n表 5.1：支持的 `std::format` 说明符\n\n| 类型 | 前缀 | 含义 |\n| :--- | :---\
  \ | :--- |\n| `b` | `0b` | 二进制表示 |\n| `B` | `0B` | 二进制表示 |\n| `c` | | 单个字符 |\n|\
  \ `d` | | 整数或字符 |\n| `o` | `0` | 八进制表示 |\n| `x` | `0x` | 十六进制表示 |\n| `X` | `0X`\
  \ | 与 `x` 相同，但使用大字母 |\n| `s` | | 拷贝字符串，或 `bool` 的 `true`/`false` |\n| `a` | `0x`\
  \ | 将浮点数打印为十六进制 |\n| `A` | `0X` | 与 `a` 相同，但使用大字母 |\n| `e` | | 以默认精度 6 的科学计数法打印浮点数\
  \ |\n| `E` | | 与 `e` 相同，仅指示指数 |\n| `f` | | 浮点的固定格式输出，精度为 6 |\n| `F` | | 与 `f` 相同，仅指示指数\
  \ |\n| `g` | | 浮点的标准格式，精度为 6 |\n| `G` | | 与 `g` 相同，仅指示指数 |\n| `p` | `0x` | 十六进制形式的指针地址\
  \ |\n\n### 5.2.2：转义\n\n在格式字符串中，我们考虑一种情况：格式字符串包含作为格式说明符标记的字符。例如，在 `printf` 中，我们必须通过双写\
  \ `%` 来转义它。当然，这是像 `iostream` 这种没有格式字符串的系统的优势。由于 `std::format` 使用大括号来标记格式说明符，当我们想在格式字符串中使用此类字符时，就需要对其进行转义。这种方法与\
  \ `printf` 类似，只需复制开始和结束标记。\n\n```cpp\nstd::format(\"Having {} in {}\", \"string\"\
  );\n```\n\n列表 5.10\n\n### 5.2.3：本地化\n\n默认情况下，`std::format` 的所有格式与区域无关。这意味着 `float`\
  \ 的数字分隔符不会随系统区域设置的改变而改变。千位符也是如此。\n\n如果我们希望特定的参数以本地化的格式打印，必须在类型之前的格式说明符中添加 `L`。这样，就会使用系统的当前区域设置来格式化格式参数。如果我们只需要为一次格式化更改区域设置，并且这是一个特定的区域设置，可以使用\
  \ `std::format` 的重载版本，它接受 `std::locale` 作为第一个参数。\n\n下面有一个短程序，演示了如何使用不同的方法对双精度浮 $\\\
  pi$ 和整数 1024 应用本地化。\n\n```cpp\nconst double pi = 3.14;\nconst int i = 1024;\n\n\
  // A 创建一个德语区域\nconst auto locDE = std::locale(\"de_DE.UTF-8\"s);\n// B 创建一个美国区域\n\
  const auto locUS = std::locale(\"en_US.UTF-8\"s);\n\nstd::cout << \"double with\
  \ format(loc, ...)\";\nstd::cout << std::format(locUS, \"π in US: {:L}\", pi);\n\
  std::cout << std::format(locDE, \"π in DE: {:L}\", pi);\n\nstd::cout << \" with\
  \ format(loc, ...)\";\nstd::cout << std::format(locUS, \"1'024 in US: {:L}\", i);\n\
  std::cout << std::format(locDE, \"1'024 in DE: {:L}\", i);\n```\n\n### 5.2.4：格式化浮点数\n\
  \n`std::format` 的默认格式化很有意思。例如，如果浮点数有尾随零，它们会被剪掉。然而，如果小数点后只有一个零，则该零会被保留。以下是说明这一点的代码：\n\
  \n```cpp\nconst double pi = 3.1400;\nconst double num = 2.0;\nstd::string s = std::format(\"\
  pi {}, num {}\", pi, num);\n```\n\n列表 5.11\n\n如我们所示，数字的输出是 3.14 和 2。这正是我们提供的内容。\n\
  \n## 5.3：格式化自定义类型\n\n让我们进一步探索 `std::format` 的威力。`std::format` 的示例缺乏可重用性。对于 `iostream`，我们可以为我们的类型提供\
  \ `operator<<` 的重载。`printf` 允许在 GNU libc 中注册转换函数，但这有点笨拙。`std::format` 在这方面提供了什么？\n\
  \n好消息是，`std::format` 为自定义格式化器提供了定义良好的 API，非常类似于 `iostream`。由于 `std::format` 没有流运算符，因此有一个结构模板\
  \ `std::formatter<T>`，我们需要对我们的类型对其进行特化。\n\n### 5.3.1：编写自定义格式化器\n\n第一个方法 `parse`\
  \ 允许我们解析格式说明符。目前，假设我们不想在那里做任何特殊处理。\n\n第二个方法 `format` 负责数据的实际格式化。对于第一次尝试，我们只需将现有的\
  \ `std::format` 代码行移动到此方法中。\n\n\n\n\n\n```cpp\ntemplate<>\nstruct std::formatter<StockIndex>\
  \ {\n  constexpr auto parse(auto& ctx) { return ctx.begin(); }\n\n  auto format(const\
  \ StockIndex& index, auto& ctx) const\n  {\n    return std::format_to(ctx.out(),\n\
  \                          \"{:10}  {:>8.2f}  {:>6.2f}  {:.2f}%\",\n           \
  \               index.name(),\n                          index.points(),\n     \
  \                     index.pointsDiff(),\n                          index.pointsPercent());\n\
  \  }\n};\n```\n\nListing 5.13\n\n现在，我们必须向 `std::format` 传递空大括号 `{}` 和一个 `StockIndex`\
  \ 对象。与之前的 `iostream` 非常相似，我们现在有了一种重用且一致的方法来格式化我们的指数数据：\n\n```cpp\nfor(const auto&\
  \ index : GetIndices()) {\n  std::cout << std::format(\"{}\", index);\n}\n```\n\n\
  Listing 5.14\n\n现在，你是否好奇我们是否能比 `iostream` 做得更好？作为一个观察敏锐的读者，你已经发现了我一直没有深入介绍的 `parse`\
  \ 方法。\n\n### 5.3.2 解析自定义格式指定符\n\n`parse` 方法允许我们对所需的输出进行极细细的控制。假设在这个练习中，我们想要的不仅仅是打印股票指数中的所有信息。我们希望拥有以下选项：\n\
  \n*   像以前一样打印所有信息，使用空大括号。\n*   像以前一样打印所有信息，但在点数和百分比差异前加上加号，使用 `p` 作为格式指定符。\n*  \
  \ 仅打印指数名称和当前点数，使用 `s` 作为格式指定符。\n\n通过在 `parse` 中解析作为 `format_parse_context` 提供的格式指定符，我们可以根据这些信息更改\
  \ `std::format` 的行为。\n\n```cpp\ntemplate<>\nstruct std::formatter<StockIndex> {\n\
  \  enum class IndexFormat { Normal, Short, WithPlus };\n\n  IndexFormat indexFormat{IndexFormat::Normal};\n\
  \n  constexpr auto parse(auto& ctx)\n  {\n    auto it  = ctx.begin();\n    auto\
  \ end = ctx.end();\n\n    if((it != end) && (*it == 's')) {\n      indexFormat =\
  \ IndexFormat::Short;\n      ++it;\n    } else if((it != end) && (*it == 'p')) {\n\
  \      indexFormat = IndexFormat::WithPlus;\n      ++it;\n    }\n\n    // #A 检查是否到达范围末尾\n\
  \    if(it != end && *it != '}') {\n      throw format_error(\"invalid format\"\
  );\n    }\n\n    // #B 返回指向已解析范围结束之后的迭代器\n    return it;\n  }\n\n  auto format(const\
  \ StockIndex& index, auto& ctx) const\n  {\n    if(IndexFormat::Short == indexFormat)\
  \ {\n      return std::format_to(ctx.out(),\n                            \"{:10}\
  \  {:>8.2f}\"sv,\n                            index.name(),\n                  \
  \          index.points());\n    } else {\n      const auto fmt{\n        (IndexFormat::WithPlus\
  \ == indexFormat)\n          ? \"{:10}  {:>8.2f}  {:+7.2f}  {+.2f}%\"sv\n      \
  \    : \"{:10}  {:>8.2f}  {:>6.2f}  {:.2f}%\"sv};\n      return std::vformat_to(\n\
  \        ctx.out(),\n        fmt,\n        std::make_format_args(index.name(),\n\
  \                              index.points(),\n                              index.pointsDiff(),\n\
  \                              index.pointsPercent()));\n    }\n  }\n};\n```\n\n\
  Listing 5.15\n\n由于最后一种情况 `s` 的参数数量不同，我们需要在那里专门调用 `std::format_to`，这在 `if` 分支中可见。然后，在\
  \ `else` 分支中，我们处理空大括号和 `p`。这两种格式的区别仅在于是否存在加号。正因为有加号，我们 `p` 格式才需要 7 个字符而不是 6 个。我们通过引入一个持有格式字符串的变量\
  \ `fmt` 来保持代码简洁。`fmt` 包含默认格式或带有加号的格式。\n\n以下是我们如何使用 `std::format` 为 `StockIndex`\
  \ 使用我们自定义的格式化器：\n\n```cpp\nfor(const auto& index : GetIndices()) {\n  std::cout\
  \ << std::format(\"{}\", index);\n}\nfor(const auto& index : GetIndices()) {\n \
  \ std::cout << std::format(\"{:s}\", index);\n}\nfor(const auto& index : GetIndices())\
  \ {\n  std::cout << std::format(\"{:p}\", index);\n}\n```\n\nListing 5.16\n\n在我看来，这比通过\
  \ `iostream` 中那些不妙的函数进行篡改要好得多，因为如果不重置配置，就会损坏流。\n\n重新添加 `L` 选项以获取当前系统区域设置来格式化浮点数也是可能的：\n\
  \n```cpp\ntemplate<>\nstruct std::formatter<StockIndex> {\n  enum class IndexFormat\
  \ { Normal, Short, WithPlus };\n  IndexFormat indexFormat{IndexFormat::Normal};\n\
  \  // #A 用于跟踪格式化是否是本地化的新成员\n  bool localized = false;\n\n  constexpr auto parse(auto&\
  \ ctx)\n  {\n    auto it = ctx.begin();\n\n    // #B 用于查找字符的辅助函数\n    auto isChar\
  \ = & {\n      if((it != ctx.end()) && (*it == c)) {\n        ++it;\n        return\
  \ true;\n      }\n      return false;\n    };\n\n    // #C 本地化格式\n    if(isChar('L'))\
  \ { localized = true; }\n\n    if(isChar('s')) {\n      indexFormat = IndexFormat::Short;\n\
  \    } else if(isChar('p')) {\n      indexFormat = IndexFormat::WithPlus;\n    }\n\
  \n    if(it != ctx.end() && *it != '}') {\n      throw format_error(\"invalid format\"\
  );\n    }\n\n    return it;\n  }\n\n  auto format(const StockIndex& index, auto&\
  \ ctx) const\n  {\n    // #D 添加本地化\n    const auto locFloat{localized ? \"L\"s :\
  \ \"\"s};\n    const auto plus{(IndexFormat::WithPlus == indexFormat) ? \"+\"s :\
  \ \"\"s};\n\n    if(IndexFormat::Short == indexFormat) {\n      const auto fmt =\n\
  \        std::format(\"{{:10}}  {{>8.2f}}\"sv, locFloat);\n      return std::vformat_to(\n\
  \        ctx.out(),\n        fmt,\n        std::make_format_args(index.name(), index.points()));\n\
  \    } else {\n      const auto fmt =\n        std::format(\"{{:10}}  {{:>8.2{0}f}}\
  \  {{:{1}7.2{0}f}} \"{{:{1}.2{0}f}}%\"sv, locFloat, plus);\n      return std::vformat_to(\n\
  \        ctx.out(),\n        fmt,\n        std::make_format_args(index.name(),\n\
  \                              index.points(),\n                              index.pointsDiff(),\n\
  \                              index.pointsPercent()));\n    }\n  }\n};\n```\n\n\
  Listing 5.17\n\n\n\n\n编写自定义格式化器仍然非常简单，只是代码稍微多一点。我们需要涵盖所有情况，因为这种方法是生成不同的格式字符串，并简单地为所有组合调用\
  \ `std::format_to`。\n\n现在我们可以使用 `L` 来调用自定义格式化器以进行本地相关的格式化，或者使用 `p` 在数字前加加号，并使用 `s`\
  \ 控制格式是否为短格式。\n\n```cpp\nfor(const auto& index : GetIndices()) {\n  std::cout <<\
  \ std::format(\"{:Ls}\", index);\n}\n\nfor(const auto& index : GetIndices()) {\n\
  \  std::cout << std::format(\"{:Lp}\", index);\n}\n```\n\n列表 5.18\n\n## 5.4: 引用格式参数\n\
  \n对于 `std::format` 的下一个元素，假设我们需要格式化一些股票。每只股票都有名称、当前价格以及与上一次报告相比的价格差。所有价格单位均为欧元（EURO）。和之前一样，我们希望每行显示一只股票。输出应该如下所示：\n\
  \n```\nApple        119.26€   +23.40€\nAlphabet    1777.02€   -10.21€\nFacebook\
  \     276.95€    +5.32€\nTesla        408.50€   -31.50€\n```\n\n这些也是我们将使用的数据。我们只需要稍微修改之前的版本，即可得到如下结果：\n\
  \n```cpp\nfor(const auto& share : GetShares()) {\n  std::cout << std::format(\"\
  {:10}  {:>8.2f}€ {:>+8.2f}€\",\n                           share.name(),\n     \
  \                      share.price(),\n                           share.priceDelta());\n\
  }\n```\n\n列表 5.19\n\n我知道这个任务微而易举。然而，过去经常困扰我的一点是欧元符号的重复。幸运的是，`std::format` 也处理了这个问题。你有没有注意到我从未告诉过你为什么格式指定符是以冒号开头的？冒号前面可以放什么？参数索引就是答案。我们不再受限于按照格式字符串列出的顺序来提供参数。我们可以混合使用，更重要的是，可以复用它们！看看这如何改变我们之前的实现：\n\
  \n```cpp\nfor(const auto& share : GetShares()) {\n  std::cout << std::format(\n\
  \    \"{1:10}  {2:>8.2f}{0}  {3:>+8.2f}{0}\",\n    \"€\",\n    share.name(),\n \
  \   share.price(),\n    share.priceDelta());\n}\n```\n\n列表 5.20\n\n我们可以看到我复用了索引为\
  \ 0 的参数（即欧元符号），同时用于价格和价格差。我还将欧元符号设为第一个参数，并在其他格式指定符中添加了匹配的索引。\n\n现在，一旦我们开始对某一个格式指定符使用参数索引，我们就需要为所有的格式指定符提供参数索引。我认为这是合理的。我们正在告诉库按非顺序执行操作，那么对整个顺序负责也是是公平的。\n\
  \n## 5.5: 使用自定义缓冲区\n\n对于 `iostream` 和 `printf`，其中一种方案是将格式化字符串写入现有的缓冲区。特殊类型如 `std::stringstream`\
  \ 或 `snprintf` 可以完成这些格式化任务。\n\n### 5.5.1: 格式化到动态大小的缓冲区\n\n通过 `std::format`，有一个 `std::format_to`\
  \ 允许我们直接将字符串格式化到动态缓冲区，例如 `std::vector`：\n\n```cpp\nstd::vector<char> buffer{};\n\
  std::format_to(std::back_inserter(buffer),\n               \"{}, {}\",\n       \
  \        \"Hello\",\n               \"World\");\n\nfor(const auto& c : buffer) {\
  \ std::cout << c; }\n\nstd::cout << '';\n```\n\n列表 5.21\n\n使用像 `std::vector` 这样的动态缓冲区方法的缺点是，我们会为每个字符获取新的分配。由于\
  \ `std::vector` 的设计，现有的数据必须被拷贝，旧数据也必须拷贝。有一个 `std::formatted_size` 可以返回字符串将占据字符数。当然，`std::format`\
  \ 无法检查缓冲区是否溢出。还有 `std::format_to_n`，我们将在后面讨论。但让我们先留在 `std::format` 上。\n\n```cpp\n\
  constexpr auto fmt{\"{}, {}\"};\nconst auto size = std::formatted_size(fmt, \"Hello\"\
  , \"World\");\nstd::vector<char> buffer(size);\nstd::format_to(buffer.begin(), fmt,\
  \ \"Hello\", \"World\");\n```\n\n列表 5.22\n\n我们首先将格式字符串存储在一个专用变量 `fmt` 中。然后我们使用 `fmt`\
  \ 配合参数让 `std::vector` 预分配内存。为此，我们使用了另一个库辅助工具 `std::back_inserter`：\n\n```cpp\nstd::vector<char>\
  \ buffer{'H', 'e', 'l', 'l', 'o', ','};\nstd::format_to(std::back_inserter(buffer),\
  \ \" \"World\");\n```\n\n列表 5.23\n\n现在的区别是 `std::back_inserter` 会调用容器的 `push_back`，在需要时导致容器中触发分配。\n\
  \n### 5.5.2: 格式化到固定大小的缓冲区\n\n之前的示例很有价值，但如果我们想避免所有的内存分配呢？在这种情况下，我们可以使用 `std::array`，这次配合\
  \ `std::format_to_n` 使用。\n\n```cpp\nstd::array<char, 10> buffer{};\nstd::format_to_n(buffer.data(),\n\
  \                 buffer.size() - 1,\n                 \"{}, {}\",\n           \
  \      \"Hello\",\n                 \"World\");\n\nstd::cout << buffer.data() <<\
  \ '';\n```\n\n列表 5.24\n\n使用 `std::format_to_n` 的方法不仅为提供了留在边界内的安全格式化，还确保了没有内存分配。`std::format_to_n`\
  \ 也是一种将字符串格式化到预分配 `std::vector` 的安全方法，只需传递 `begin()` 作为迭代器。\n\n在 C++20 中，`std::formatted_size`\
  \ 不是 `constexpr`。如果例如 `std::formatted_size` 在 C++23 中变为 `constexpr`，那么我们就可以在编译时确定用作\
  \ `buffer` 的 `std::array` 的大小。当然，这只有在所有参数都在编译时可用的情况下可行。\n\n## 5.6: 编写自己的日志函数\n\n\
  假设我们需要为了调试记录财务系统的一些状况。我们首先创建每个日志记录器需要的：日志级别。我们使用类枚举来定义它们。得益于 `std::format` 的功能，我们可以为自定义的格式化器提供一种一致且易于格式化\
  \ `LogLevel` 枚举的方法。\n\n\n\n\n```cpp\nenum class LogLevel { Info, Warning, Error\
  \ };\n\n// C++23 STL 的一部分\ntemplate<typename T>\nconstexpr std::underlying_type_t<T>\
  \ to_underlying(T value)\n{\n  return static_cast<std::underlying_type_t<T>>(value);\n\
  }\n\ntemplate<>\nstruct std::formatter<LogLevel>\n: std::formatter<std::string_view>\
  \ {\n  inline static std::array levelNames{\"Info\"sv,\n                       \
  \               \"Warning\"sv,\n                                      \"Error\"\
  sv};\n\n  auto format(LogLevel c, auto& ctx) const\n  {\n    return std::formatter<std::string_view>::format(\n\
  \      levelNames.at(to_underlying(c)), ctx);\n  }\n};\n```\n\n列表 5.25\n\n这一次，我们的\
  \ `std::formatter` 比之前的示例要简单得多。原因是我们可以继承自 `std::formatter<const char*>`。这个预定义的格式化器自带了\
  \ `parse` 方法。只要我们不需要自定义格式规格化符，就可以直接使用现有的功能。\n\n我们的日志函数应该命名为 `Log`，第一个参数传递日志级别，随后是格式化字符串和格式化参数。第一个版本可以像下面的代码：\n\
  \n```cpp\nvoid log(LogLevel         level,\n         std::string_view fmt,\n   \
  \      const auto&... args)\n{\n  std::clog << std::format(\"{}: \"sv, level)\n\
  \            << std::vformat(fmt, std::make_format_args(args...))\n            <<\
  \ '';\n}\n```\n\n列表 5.26\n\n这是一个可以运行的版本，易于创建，而且得于 `std::formatter`，枚举也会打印为字符串。然而，仍然有优化空间。目前\
  \ `Log` 的编写方式可能会导致二进制文件增大。对于 `args` 的每一种组合，编译器都会创建一个新的 `Log` 函数以及对应的 `std::format`\
  \ 实现。这使得编译器难以进行内联优化。好消息是，`std::format` 提供了 `std::make_format_args` 等工具来帮助我们摆脱困境。\n\
  \n### 5.6.1: 在转发参数包时优先使用 `make_format_args`\n\n每当我们把参数包转发给 `std::format` 时，都可以做两件事来优化二进制文件的大小。首先，我们使用\
  \ `std::make_format_args` 创建一个类型擦除封装。其次，将 `std::make_format_args` 的结果传递给 `std::vformat`\
  \ 或其替代方案（例如 `std::vformat_to`）。`std::vformat` 版本期望在格式化字符串之后接收一个单一的 `std::format_args`\
  \ 参数。这就是我们用 `std::make_format_args` 创建的参数的类型擦除版本。因此，`std::vformat` 不再是变变模板，也不依赖于参数的组合。代码如下：\n\
  \n```cpp\nvoid vlog(LogLevel           level,\n          std::string_view   fmt,\n\
  \          std::format_args&& args)\n{\n  std::clog << std::format(\"{}: \", level)\n\
  \            << std::vformat(fmt, args) << '';\n}\n\nconstexpr void\nlog(LogLevel\
  \ level, std::string_view fmt, const auto&... args)\n{\n  vlog(level, fmt, std::make_format_args(args...));\n\
  }\n```\n\n列表 5.27\n\n通过这个改进，我们帮助编译器为我们获得最佳的二进制尺寸。\n\n现在，使用我们的 `Log` 函数与使用 `std::format`\
  \ 类似：\n\n```cpp\nvoid Use()\n{\n  const std::string share{\"Amazon\"};\n  const\
  \ double      price{3'117.02};\n  log(LogLevel::Info,\n      \"Share price {} high:\
  \ {}\",\n      share,\n      price);\n  errno = 4;\n  log(LogLevel::Error, \"Unknown\
  \ stock, {}\", errno);\n}\n```\n\n列表 5.28\n\n还有最后一点我们可以考虑，即格式化字符串。\n\n### 5.6.2:\
  \ 在编译时创建格式规格符\n\n在这种情况下，问题是我们是否真的需要格式化符？我们必须在到处写上空大括号才能让 `std::format` 对该类型应用默认格式化器。如果日志函数可以像这样使用呢：\n\
  \n```cpp\nvoid Use()\n{\n  const std::string share{\"Amazon\"};\n  const double\
  \      price{3'117.02};\n  log(LogLevel::Info, \"Share price\", share, \"very high:\"\
  , price);\n  errno = 4;\n  log(LogLevel::Error, \"Unknown stock:\", errno);\n}\n\
  ```\n\n列表 5.29\n\n我们只需要按照想要的写入顺序传递参数，并省略大括号即可。创建这个 `Log` 函数需要什么，这可行吗？答案是肯定的。可行。然而，`std::format`\
  \ 需要两个大括号；这是无法避免的。这留给了我们任务：创建所需数量的大括号。我们知道大括号的数量，它们等于 `sizeof...(Args)`，即参数包中的元素数量。另一个好消息是这个值在编译时是知的。因此，我们可以写一个\
  \ `constexpr` 函数在编译时为我们生成格式化字符串。让我们把大括号函数称为 `makeBraces`。以下是实现：\n\n```cpp\ntemplate<size_t\
  \ Args>\nconstexpr auto makeBraces()\n{\n  // 定义一个包含空大括号和空格的字符串\n  constexpr std::array<char,\
  \ 4> c{\"{} \"};\n  // 计算不包含字符串结束符的 的大小\n  constexpr auto brace_size = c.size()\
  \ - 1;\n  // 为换行符和字符串结束符预留 2 个字符\n  constexpr auto offset{2u};\n  // 创建包含所需大括号和换行符的\
  \ std::array\n  std::array<char, Args * brace_size + offset> braces{};\n\n  // 大括号字符串长度为数组大小减去换行符和结束符\n\
  \  constexpr auto bracesLength = (braces.size() - offset);\n\n  auto i{0u};\n  std::for_each_n(\n\
  \    braces.begin(), bracesLength, & {\n      element = c[i % brace_size];\n   \
  \   ++i;\n    });\n\n  braces[bracesLength] = '';  // 添加换行符\n  return braces;\n\
  }\n```\n\n列表 5.30\n\n注意 `makeBraces` 接收一个 NTTP `Args`，它代表总参数数。这样 `makeBraces` 就不依赖于参数组合。这为我们节省了编译时间。在调用处可以通过\
  \ `sizeof...(args)` 轻松获取参数数量。极了！\n\n`Log` 的实现需要稍微修改。我们需要调用 `makeBraces`：\n\n```cpp\n\
  void vlog(LogLevel           level,\n          std::string_view   fmt,\n       \
  \   std::format_args&& args)\n{\n  std::clog << std::format(\"{}: \", level)\n \
  \           << std::vformat(fmt, args);\n}\n\nconstexpr void log(LogLevel level,\
  \ const auto&... args)\n{\n  // 生成格式化字符串\n  constexpr auto braces = makeBraces<sizeof...(args)>();\n\
  \n  vlog(level,\n       std::string_view{braces.data()},\n       std::make_format_args(args...));\n\
  }\n```\n\n列表 5.31\n\n\n\n\n这允许我们依赖类型的默认格式化器。这对于日志函数非常非常好，特别是对于调试日志。可以快速记录变量，而无需生成格式字符串的负担。然而，可能会在某些情况下特殊格式更好。到目前为止你觉得\
  \ `std::format` 怎么样？我们还能做更多吗？\n\n### 5.6.3: 格式化时间\n\n我们目前进展得很好，但没有时间戳的日志信息算什么呢？根据你目前所看到的，使用\
  \ `std::format` 添加时间戳有多难？答案是轻而易举。下面是添加时间戳的代码。\n\n```\nvoid vlog(std::string_view\
  \ fmt, std::format_args&& args) {\n  const auto t = GetTime();\n  std::clog << std::format(\"\
  [{:%Y-%m-%d-%H:%M:%S}] \"sv, t)\n            << std::vformat(fmt, args);\n}\n```\n\
  列表 5.32\n\n是的，我们可以使用 `chrono` 类型并为这些类型提供格式指定符，以便使用 `std::format` 格式化输出。\n\n这里使用的日期/时间格式指定符与其他语言是兼容的。我假设你们中有些人觉得整个\
  \ `std::format` 语法很熟悉。这是因为该语法主要借自 Python，但 C# 也有一些类似的字符串格式化方法。\n\n**要点笔记**\n\n-\
  \ `std::format` 为我们提供了类型安全的格式化，具有格式字符串的清晰度。我们可以使用 `iostream` 输出结果。\n- 格式化参数可以重用。\n\
  - 通过 `std::format_to_n`，我们可以将字符串格式化到现有的缓冲区中，而无需额外的内存分配。\n- 仅配合 `std::back_inserter`\
  \ 使用 `std::format_to` 以防止缓冲区溢出。\n- 可以通过特化 `std::formatter<T>` 将自定义类型注册到 `std::format`。\n\
  - 我们可以拥有丰富的自定义指定符集。\n\n# 6: 三路比较：简化你的比较\n\n之前的章节展示了 C++20 提供的巨大改进。在本章中，我介绍了新的太空船运算符（spaceship\
  \ operator），它帮助我们在定义比较时编写更少的代码。编写比较变得更容易管理，并且默认情况下更加正确。\n\n“太空船”这个名字来源于该运算符的外观：`<=>`。这个运算符看起来像某部著名太空电影系列中的战斗机之一。该运算符并不是全新的；它在其他语言中已经可用。对于\
  \ C++ 来说，遵循编写更少代码并让编译器完成工作的原则是有帮助的。\n\nC++ 是一种允许开发者编写更少代码的语言。例如，我们不需要在每个方法之前或每次成员访问时编写\
  \ `this`。构造函数和析构函数的调用根据某些规则在后台自动发生。通过 C++11 的 `=default`，我们可以请求编译器为特殊成员函数提供默认实现，即使在正常情况下编译器不会这样做。不需要编写特殊成员函数（就像默认构造函数一样简单），这我认为是极具价值的。\n\
  \n至少有一个阴暗角落，编译器在那里没有为我们提供同等程度的帮助。在过去，每当我们有一个需要比较运算符的类时，我们都被要求提供实现。当然，如果有某些特殊的业务逻辑，那么这样做是明智的。编译器无法感知。然而，考虑一个基础情况：你需要提供一个执行特殊操作的\
  \ `operator==`。出于一致性考虑，你通常也会提供 `operator!=`。但它的实现是什么呢？嗯，在我记忆的所有情况下，实现都是这样的：\n\n\
  ```\nbool operator!=(const T& t) { return !(*this == t); }\n```\n\n这不有点可怜吗？那不是特殊代码。它绝对是琐事的，但必须编写、审查和维护。让我们看看\
  \ C++20 如何解决这个问题的。\n\n## 6.1: 编写带有相等比较的类\n\n让我们先想象我们要编写某种医疗应用程序。每当你进入医院时，你通过一个唯一的病历号（MRN）被识别。这个号码用于在你整个住院期间识别你，因为你的全名可能不是唯一的。这对于我的名字也是如此，我的名字在德语中并不常见。我兄弟也是如此。我们关注\
  \ `MRN` 类的实现。在此时，我们不关心所有的访问函数。只需要一个持有实际值的数据成员的类即可。它应该是默认可构造的，并且可以通过可以通过 `uint64_t`（存储值的\
  \ MRN 内部类型）来构造的。实现一个 `MedicalRecordNumber` 类可以如下：\n\n```\nclass MedicalRecordNumber\
  \ {\npublic:\n  MedicalRecordNumber() = default;\n  explicit MedicalRecordNumber(uint64_t\
  \ mrn)\n  : mMRN{mrn}\n  {}\n\nprivate:\n  uint64_t mMRN;\n};\n```\n列表 6.1\n\n当然，我们希望两个\
  \ MRN 能够相互比较。它们可以是相等的（意味着同一个患者），也可以不相等（如果两个属于不同的患者）。不同患者之间不应该有顺序关系。按照目前的定义，该类的对象无法进行比较：\n\
  \n```cpp\nconst MedicalRecordNumber mrn0{};\nconst MedicalRecordNumber mrn1{3};\n\
  const bool sameMRN = mrn0 == mrn1;\n```\n编译器不知道如何比较 `MedicalRecordNumber` 和 `MedicalRecordNumber`。在类内部添加成员函数\
  \ `operator==` 让之前的示例生效。\n\n```cpp-\n```cpp\nbool operator==(const MedicalRecordNumber&\
  \ other) const {\n  return other.mMRN == mMRN;\n}\n```\n列表 6.2\n\n有了它，之前的比较有效了。但为了让不相等（`!=`）也有效，我们也必须为它提供一个运算符：\n\
  \n```cpp\nbool operator!=(const MedicalRecordNumber& other) const {\n  return !(other\
  \ == *this);\n}\n```\n列表 6.3\n\n### 6.1.1: 比较不同类型\n\n我们目前为止所做的（添加并实现 `operator==`）仍然很简单。假设\
  \ MRN 应该还可以与基础的 `uint64_t` 进行比较。这需要我们再写一对相等运算符。然而，这并不是全部。让我们思考一下可能出现哪些比较组合。我们希望比较\
  \ MRN 对象和基础类型 `uint64_t`。反过来呢？当然，那也应该是有效的。这是一种一致的行为。用代码来说，以下内容应该通过：\n\n```cpp\n\
  const bool sameMRNA = mrn0 == 3ul;\nconst bool sameMRNB = 3ul == mrn0;\n```\n\n\
  这意味着我们需要为该类再添加 4 个（2 个 `==`，2 个 `!=`）函数，总共会有 6 个专门用于相等比较的方法。\n\n\n\n\n```cpp\n//\
  \ #A 初始成员函数\nbool operator==(const MedicalRecordNumber& other) const\n{\n  return\
  \ mMRN == other.mMRN;\n}\n\nbool operator!=(const MedicalRecordNumber& other) const\n\
  {\n  return !(*this == other);\n}\n\n// #B 针对 64_t 的额外重载\nfriend bool operator==(const\
  \ MedicalRecordNumber& rec,\n                       const uint64_t&            num)\n\
  {\n  return rec.mMRN == num;\n}\n\nfriend bool operator!=(const MedicalRecordNumber&\
  \ rec,\n                       const uint64_t&            num)\n{\n  return !(rec\
  \ == num);\n}\n\n// #C uint64_t 交换参数后的额外重载\nfriend bool operator==(const uint64_t&\
  \            num,\n                       const MedicalRecordNumber& rec)\n{\n \
  \ return (rec == num);\n}\n\nfriend bool operator!=(const uint64_t&            num,\n\
  \                       const MedicalRecordNumber& rec)\n{\n  return !(rec == num);\n\
  }\n```\n\n列表 6.4\n\n除了两个原始方法 #A 之外，我们还需要两个定义为 `friend` 函数的额外重载 #B，以及两个交换参数的重载 #C。样板代码因此增加了非常多。\n\
  \n### `friend` 技巧\n\n这里使用 `friend` 函数的原因不仅是为了让 `==` 和 `!=` 正常工作，还为了实现与 `uint64_t`\
  \ 的比较。如果没有这个 `friend` 技巧，以下代码可以编译：\n\n```cpp\nconst bool sameMRN = mrn0 == 3ul;\n\
  ```\n\n但反过来就不行：\n\n```cpp\nconst bool sameMRN = 3ul == mrn0;\n```\n\n由于这些运算符是接收两个参数的\
  \ `friend` 函数，它们在参数依赖查找（ADL）期间会被考虑范围内，因为其中一个比较对象的类型是 `MedicalRecordNumber`。\n\n\
  ### 6.1.2：通过运算符反转、重写和 `=default` 减少手写代码\n\n你喜欢写这样的代码吗？到目前，我们有 6 个比较函数，其中 4 个是简单的重定向。C++20\
  \ 允许我们像在 C++11 中获得的那样一样，在这里也应用 `=default`，请求编译器填充空白。这让这段代码变得短得多：\n\n```cpp\nbool\
  \ operator==(const MedicalRecordNumber& other) const =\n  default;\nbool operator==(const\
  \ uint64_t& other) const\n{\n  return other == mMRN;\n}\n```\n\n列表 6.5\n\n从六个函数减少到两个，其中我们可以通过使用\
  \ `=default` 请求编译器提供其中两个函数之一供使用。我认为这种减少是绝对值得的。但等等，我作弊了吗？`operator!=` 呢？它们缺失了，所以我显然是作弊了。我们本应该需要四个函数，这并算不上大幅减少。此外，`friend`\
  \ 技巧消失了，所以显然，这段代码不像以前那样工作了。好消息是我并没有作弊，代码运行结果与以前完全一样。在 C++20 中，我们只需要列表 6.5 提供的两个函数，此结论。原因在于编译器的两项新能力：运算符反转和重写，它们将在\
  \ [§6] 中详细解释。在不了解更多这两项能力之前，你已经可以开始编写你简化的相等性比较了。\n\n## 6.2：在 C++20 编写带有顺序比较的类\n\n\
  在之前的章节中，我们查看了相等性比较，这只是一部分。有时，我们不仅需要检查相等。我们喜欢对事物进行排序。每当我们需要对类的唯一对象进行排序时，都会涉及到 `<`、`>=`\
  \ 以及比较 `==` 和 `!=`，以建立排序对象之间的顺序。\n\n继续编写医疗应用程序的示例，考虑一个表示姓名的类。姓名之间是可以比较的。它们相等（或不相等）并按字母顺序排序。在我们的情况下，姓名存储在\
  \ `String` 类中，它是 `char` 数组的封装，并且应该提供顺序比较。它通过存储指向实际字符串的指针和长度来完成工作。我们的类名为 `String`，包含一个接收\
  \ `char` 数组的构造函数。长度由模板确定。为了满足姓名的需求，该类应该支持相等性比较，并提供顺序，以便对于两个 `String` 实例，我们可以判断哪个更大，或者它们是否相同。\n\
  \n正如你所见且可能你自己也经历过的，我们需要实现所有比较函数来实现这一点。这里的一种常用方法是让一个函数执行实际比较。让我们将其命名为 `Compare`。它返回\
  \ `Ordering`，这是一个带有三种不同值的类型：小于 (-1)、相等 (0) 或大于 (1)。这三个值就是飞船运算符的原因。这有时被称为三路比较。事实上，标准使用“三路比较”这一术称为飞船运算符。\n\
  \n回到 `String` 类。所有六个比较运算符 `==`、`!=`、`<`、`>=` 都调用 `Compare` 并根据 `Compare` 的返回值创建结果。目前，`String`\
  \ 还没有 C++20 飞船运算符。尽管如此，`Compare` 给的结果使得 `String` 就像带有飞船运算符一样工作。在这里，它是用 C++20 之前的代码模拟的，也就是我们多年来不得不这样做。\n\
  \n```cpp\nclass String {\npublic:\n  template<size_t N>\n  explicit String(const\
  \ char (&src)[N])\n    : mData{src}\n    , mLen{N}\n  {}\n\n  // #A 为了完整性而存在的辅助函数。\n\
  \  const char* begin() const { return mData; }\n  const char* end() const { return\
  \ mData + mLen; }\n\n  // #B 相等比较。\n  friend bool operator==(const String& a, const\
  \ String& b)\n  {\n    if(a.mLen != b.mLen) {\n      return false; // #C 为了性能的提前退出\n\
  \    }\n    return Ordering::Equal == Compare(a, b);\n  }\n\n  friend bool operator!=(const\
  \ String& a, const String& b)\n  {\n    return !(a == b);\n  }\n\n  // #D 顺序比较。\n\
  \  friend bool operator<(const String& a, const String& b)\n  {\n    return Ordering::LessThan\
  \ == Compare(a, b);\n  }\n\n  friend bool operator>(const String& a, const String&\
  \ b)\n  {\n    return (b < a);\n  }\n\n  friend bool operator<=(const String& a,\
  \ const String& b)\n  {\n    return !(b < a);\n  }\n\n  friend bool operator>=(const\
  \ String& a, const String& b)\n  {\n    return !(a < b);\n  }\n\nprivate:\n  const\
  \ char*  mData{};\n  const size_t mLen{};\n\n  // #E 执行实际比较的比较函数。\n  static Ordering\
  \ Compare(const String& a, const String& b);\n};\n```\n\n列表 6.6\n\n\n\n\n\n`String`\
  \ 拥有相等性比较（`==` 和 `!=`）#B 以及排序比较（`<`, `>`, `<=`, `>=`）#D。`Compare` 方法是私有的 #E。`Compare`\
  \ 返回 `Ordering`，如前所述，它可以看作是一个类枚举，具有三个值：`Equal`、`LessThan` 和 `GreaterThan`。最困难的部分可能是\
  \ `Compare` 本身的实现。其余部分只是些杂细节。在这一阶段，我们忽略 `Compare` 的实现，重点关注比较运算符，以及为了让该类及任何其他类支持比较，我们需要编写多少代码。\n\
  \n如果 `String` 也应该能够与 `std::string` 进行比较呢？比较运算符的数量会增加 12 个！原因是我们需要提供两对运算符重载：\n\n\
  - `const String& a, const std::string& b`\n- `const std::string& a, const String&\
  \ b`\n\n这产生了大量的样板代码。事实上，对于我们希望该类与之比较的每种类型，运算符的数量都会增加 12 个。如果我们希望 `String` 也能与 C\
  \ 风格字符串比较，最终将会有 30 个运算符！它们都简单地重定向到 `Compare` 函数。好的，`std::string` 版本会在对象上调用 `.c_str`。\n\
  \n这就是太空运算符（spaceship operator）实现一致性比较的地方。\n\n## 6.3: 在 C++20 中编写带有排序比较的类\n\nC++\
  \ 中的太空运算符写为 `operator<=>`，它有一个专门的返回类型，该类型可以表示为小于 (-1)、等于 (0) 或大于 (1)，这与示例 [6.6]\
  \ 中 `Compare` 返回的 `Ordering` 基本相同。这种类型定义在 `<compare>` 头文件中，对于简单的相等性比较函数 `==` 和 `!=`\
  \ 不需要它，但一旦我们需要排序就需要它。我们将在 §6 中讨论不同的比较类型。通过 `=default`，我们可以请求编译器为太空运算符提供默认实现，就像之前看到的特殊成员函数和相等运算符一样。对于\
  \ `String` 示例，这意味着抛弃所有的 `operator@@`，用单个 `operator<=>` 替换它们，并如下所示包含 `compare` 头文件：\n\
  \n```cpp\n#include <compare>\nauto operator<=>(const String& other) const = default;\n\
  ```\n\nListing 6.7\n\n这不是很棒吗？从六个函数减少到一个函数，我们就搞定了。\n\n### 6.3.1: 使用 `=default` 进行成员级比较\n\
  \n事实是，我们还没有完成。请求默认的太空运算符或相等运算符将导致编译器为我们执行成员级比较。我们的 `String` 类包含一个指针，在成员级比较期间，该指针不会进行深层比较。仅比较两个指针地址。这是否是正确的做法取决于你的应用程序。例如，在指针背后的数据不相关的场景下，仅凭指针地址\
  \ `=default` 可能就足够了。像 `shared_ptr` 这样的内存管理类就是一个例子。在比较两个 `shared_ptr` 时，只需要知道这两个指针是不同的，就知道我们正在查看两个独立的分配内存。这两个指针的数据是否相同则是另一个问题。\n\
  \n每当需要比较指针所引用的数据时，`=default` 都是错误的解决方案。在这种情况下，两个指针地址可能不同，但它们背后的数据可能是相同的。例如，对于我们的\
  \ `String` 类，两个不同的指针仍然指向两个字符串，每个字符串都包含值 `\"Franziska\"`，并被认为是相等的。\n\n成员级比较按照声明顺序从上到下遍历成员变量。\n\
  \n这与特殊成员函数的行为完全一致。对于我们的 `String` 类，这意味着还有一些工作要做。\n\n最终版本看起来如下：\n\n```cpp\nclass\
  \ String {\npublic:\n  template<size_t N>\n  explicit String(const char (&src)[N])\n\
  \  : mData{src}\n  , mLen{N}\n  {}\n\n  const char* begin() const { return mData;\
  \ }\n  const char* end() const { return mData + mLen; }\n\n  auto operator<=>(const\
  \ String& other) const\n  {\n    return Compare(*this, other);  // #A 我们已经有这个\n\
  \  }\n\n  bool operator==(const String& other) const\n  {\n    if(mLen != other.mLen)\
  \ { return false; }\n    return Compare(*this, other) == 0; // #B 我们已经有了\n  }\n\n\
  private:\n  const char* mData;\n  size_t mLen;\n  static std::weak_ordering Compare(const\
  \ String& a, const String& b); // #D\n};\n```\n\nListing 6.8\n\n在太空运算符中，在我们知道两个字符串长度不同后调用了\
  \ `Compare` #A。这就是 #B 所做的的。这种优化从一开始就存在。如果其中一个较短，两个字符串就不相等。至于这是否是正确的，始终使用 `Compare`\
  \ 或 `operator<=>` 意味着即使在 `a.mLen != other.m` 为真的情况下（两个字符串长度不同），`Compare` 也会处理两个字符串的部分，直到找到小于或大于的结果。对于长字符串，你可以测量出时间差异。这就是为什么在我们的示例中，`operator==`\
  \ 在快捷检查之后调用了底层函数 `Compare` #C。\n\n另一个区别是 `Compare` 的返回类型 #D。它现在返回 `std::weak_ordering`，这是\
  \ `<compare>` 头文件中新标准类型之一。根据类型，我们喜欢选择不同的类型。例如，如果数据遵循强排序，我们可能想要这种强性。但让我们先讨论不同的比较类别。\n\
  \n### 6.3.2: 使用 STL 比较函数\n\n得益于 C++20 的新库功能，我们还可以改进一点，即 `Compare` 函数。我没有向你展示它的实现，也将继续隐藏它。仅仅因为我们需要自己写函数这一事实，并不如使用\
  \ STL 中的东西好，即 `lexicographical_compare_three_way`。这个新函数的功能与我在 `Compare` 中实现的相同。通过使用\
  \ STL，我们可以更新 `String` 类的太空运算符和相等比较运算符，如 Listing [6.9] 所示。\n\n\n\n\n\n```cpp\nauto\
  \ operator<=>(const String& other) const\n{\n  return std::lexicographical_compare_three_way(\n\
  \    begin(), end(), other.begin(), other.end());\n}\n\nbool operator==(const String&\
  \ other) const\n{\n  return std::strong_ordering::equal == operator<=>(other);\n\
  }\n```\n\n列表 6.9\n\n## 6.4: 不同的比较类别\n\n`<compare>` 头文件提供的不同比较类别类型建立了一套系统，用于如何为飞船运算符（spaceship\
  \ operator）或你自己的函数选择合适的类型。标准提供的类型由一个“强度”和一个“类别”组成。类型的命名约定遵循 `strength_category`\
  \ 方案。\n\n### 6.4.1: 比较类别\n\n我们首先确定类别。这里的类别意味着一个类型应该支持哪些比较操作。我们之前已经见过这些类别：一个仅包含等价比较的\
  \ `MRN` 类，以及包含排序比较的 `String` 类。`MRN` 的初始版本两者都不具备，这对于类型来说也是有效用例。\n\n为了良好的类型设计，你可以参考以下规则。问题在于，该类型应该只支持等价比较，还是也应该提供排序？早些时候我们有一个只使用等价比较的\
  \ `MRN` 类型。因为两个 `MRN` 之间没有关系，它们是完全无序的。我们只能检查两个 `MRN` 对象是否代表同一个人。然后，在其他某些情况下，比较应该导致值的排序。我们之前看到的\
  \ `String` 就是这种情况。一个没有比较运算符的类型是另一种选择。此类类型是无序的，且不可进行等价比较。\n\n在确定了类应该如何行为后，我们可以决定类需要哪些比较操作。通常情况下，每个类型都应该重载：\n\
  \n- 仅**等价** `operator==` 和 `operator!=`；\n- **排序** 所有的比较运算符；\n- **两者皆无**任何比较运算符。\n\
  \n至此，我们有了比较类别和所需的运算符。它们是否可以使用默认值（default）是另一个问题。\n\n### 6.4.2: 比较强度：`strong` 或 `weak`\n\
  \n下一个问题是类别的强度，即 `strong`（强）还是 `weak`（弱）。只有在我们决定该类提供排序之前，这个问题才有意义。在这里，对于我们的类型来说，问题是：如果我们比较两个对象，它们是相等的（equal）还是等值的（equivalent）？例如，前面的\
  \ `String` 是相等，强度是 `strong`。如果 `String` 仅以不区分大小的方式比较存储的名称，那么强度就是 `weak`，且两个字符串相同的结果将不是相等，而是等值。另一个类，例如，可以访问存储的名称并进行区分大小的比较，这将导致另一个结果。\n\
  \n对于比较强度的决策，你可以使用以下经验法则。如果拷贝构造函数中复制的所有内容也是比较的一部分，则使用 `strong`。如果只对复制内容的子集进行比较，则使用\
  \ `weak`。子集也意味着如果比较是以特殊方式进行的，例如字符串的不区分大小比较。那么强度也是 `weak`。类型 `strong_ordering` 对应数学术语“全序（total\
  \ ordering）”。\n\n作为一个 `strong_ordering` 的真实世界示例，可以考虑俄罗斯俄罗斯套娃（Matrjoschka dolls）。它们由木头制成，通常涂有鲜艳的色彩。它们呈蛋状且可以相互嵌套。你总是开始或结束于一个包含所有其他部分的个体。它们完美地嵌套在一起。按大小对它们只有一种排序。在不损坏套娃的情况下无法改变这种顺序，而且一组中永远不会有两个相同大小的。这代表了强排序。\n\
  \n`strong_ordering` 和 `weak_ordering` 类型有三种可能的值：`greater`（大于）、`equivalent`（等值）和\
  \ `less`（小于）。\n\n### 6.4.3: 另一种比较强度：偏序\n\n还有第三种类别 `partial_ordering`（偏序）。它具有与 `weak_ordering`相同的三个值：`greater`、`equivalent`\
  \ 和 `less`。但它还有一个额外的值 `unordered`（无序）。每当我们有一个无法完全排序的类型时，就使用它。一个例子是带有 `float` 的类。`float`\
  \ 的值 0 和 -0 之间没有排序。同样，`float` 的非数字（NaN）与任何内容都不可比较。当需要所有六个比较运算符，但对于某些值，`a < b`、`a\
  \ == b` 和 `a > b` 都不为真时，选择 `partial_ordering`。这意味着所有三个检查可以同时为假。由于由于，请记住没有任何 STL\
  \ 算法可以适用于返回 `std::partial_ordering` 的飞船运算符的类型。`std::set` 或 `std::map` 也是如此。这意味着对于这些任务，返回值简单是无序的。\n\
  \n当我们使用等价比较时，我们讨论“相等（equal）”。当我们使用排序比较时，这被称为“等值（equivalence）”。\n\n这些类型可以与数值进行比较。表\
  \ 6.1 列出了所有类型及其对应的值。\n\n除了数值值，你也可以使用比较函数。\n\n表 6.1: 比较类型及其值\n\n| 类别 | -1 | 0 | +1\
  \ | 非数值 |\n| --- | --- | --- | --- | --- |\n| `strong_ordering` | less | equal |\
  \ greater | |\n| `weak_ordering` | less | equivalent | greater | |\n| `partial_ordering`\
  \ | less | equivalent | greater | unordered |\n\n### 6.4.4: 命名的比较函数\n\n正如我们在前一节中看到的，`weak_ordering`\
  \ 的可能值是小于 (-1)、相等 (0) 或大于 (1)。在 `String` 类示例中，我们确实将 `Compare` 的结果（类型为 `weak_ordering`）与零进行了比较。当然，检查飞船运算符的结果也是一样。另一种方案是使用\
  \ `std` 命名空间中的新比较函数，如 `is_eq`。命名的比较函数也可以从 `<compare>` 获取。表 6.2 提供了完整的列表。\n\n表 6.2:\
  \ 命名比较函数\n\n| 函数 | 操作 |\n| --- | --- |\n| `is_eq(partial_ordering cmp)` | `cmp ==\
  \ 0` |\n| `is_neq(partial_ordering cmp)` | `cmp != 0` |\n| `is_lt(partial_ordering\
  \ cmp)` | `cmp < 0` |\n| `is_lteq(partial_ordering cmp)` | `cmp <= 0` |\n| `is_gt(partial_ordering\
  \ cmp)` | `cmp > 0` |\n| `is_gteq(partial_ordering cmp)` | `cmp >= 0` |\n\n应用于 `String`\
  \ 示例，`operator==` 的实现使用了 `is_eq` 而不是比较零：\n\n```cpp\nbool operator==(const String&\
  \ other)\n{\n  if(mLen != other.mLen) { return false; }\n\n  // A 使用命名的比较函数\n  return\
  \ std::is_eq(Compare(*this, other));\n}\n```\n\n列表 6.10\n\n使用命名的比较函数使代码更具可读性。除此之外，两种方式都是等价的。你可以自由选择更适合你代码库或编码风格的一种。\n\
  \n\n\n\n\n不同类别之间存在转换规则。仔细查看表 6.2 可以发现，所有命名比较函数只期望 `partial_ordering`。这是由于不同类别可以转换为严格性更低的类别。例如，`strong_ordering`\
  \ 可以转换为 `weak_ordering`。通过这种方式，我们放宽了一些要求。当然，反过来是不可能的，因为没有办法为类型类型增加要求。\n\n![](img/file16.png)图\
  \ 6.1: 不同的比较类别以及它们之间的关系。箭头表示了*is-a*（是一种）的隐式转换能力。\n\n图 6.1 阐说明了不同类别如何相互转换。它们遵循自然顺序。具有\
  \ `strong_ordering` 的对象可以转换为更弱的对象，在这种情况下是 `weak_ordering`。具有顺序的对象也具有等效性检查。两个等价的对象可以翻译为相等比较。无论数据集是否包含等价元素，这一点都是成立的。飞船运算符（spaceship\
  \ operator）有一个相等性值。对于特定的数据集，这可能永远为假。\n\n从 `strong_ordering` 我们可以推导出 `weak_ordering`，甚至是\
  \ `partial_ordering`。这就是为什么这些类型在这一方向上是可以隐式转换的。反过来则行不通。\n\n这些隐式转换会自动发生，例如当我们默认化 `operator<=>`\
  \ 并让编译器推导返回类型时。下面是一个更具体的例子。\n\n```cpp\nstruct Weak {\n  std::weak_ordering operator<=>(const\
  \ Weak&) const = default;\n};\n\nstruct Strong {\n  std::strong_ordering\n  operator<=>(const\
  \ Strong&) const = default;\n};\n\nstruct Combined {\n  Weak   w;\n  Strong s;\n\
  \n  auto operator<=>(const Combined&) const = default;\n};\n```\n\nListing 6.11\n\
  \n我们有两个类型 `Weak` 和 `Strong`。它们都定义了默认的飞船运算符。`Weak` 对应的该运算符返回 `weak_ordering`，而 `Strong`\
  \ 返回 `strong_ordering`。第三种类型 `Combined` 包含上述类型作为成员。`Combined` 声明了一个返回类型为 `auto`\
  \ 的默认飞船运算符。问题是，推导出的类型是什么？答案是，编译器会自动确定所有类型之间的共同比较类别。该类型随后被用推导出的返回类型。类型属性（type-trait）也可以为你识别共同比较类别：`std::common_comparison_category`。\n\
  \n如果情况下你你为 `Combined` 的飞船运算符指定 `strong_ordering` 作为返回类型，编译器将拒绝编译。\n\n## 6.6: 新的运算符能力：反转与重写\n\
  \n之前的示例可以工作，尽管我们只指定了 `operator==`，我认为这是一件好事。那么编译器是如何同时处理 `operator!=` 运算符的？非常简单。在\
  \ C++20 中，编译器可以反转或重写比较。假设只有一个用户提供的 `operator==`。在这种情况下，编译器假设 `operator!=` 的实现仅仅是\
  \ `==` 操作结果的取反。因此，当我们说不相等（不是 `==`）时，我们现在得到了我们想要的结果，这感谢于编译器将 `!=` 重写为 `! operator==`\
  \ 的能力。这是一种比较重写。\n\nC++20 编译器比重写更强大——如果重载集合存在匹配项，它还可以反转操作数。这就是为什么即使对于之前 `MedicalRecordNumber`\
  \ 示例中的 `uint64_t`，提供成员版本也足够了。例如，可以这样更改比较中的操作数：\n\n```cpp\nconst bool sameMRN = mrn0\
  \ == 3ul;\nconst bool sameMRN = 3ul == mrn0;\n```\n\n这里是在 C++20 之前，我们需要提供专门的 `operator==`\
  \ 来让后一种版本工作。记得我们需要在 §6 的示例中通过 `friend` 技巧提供这些重载。在 C++20 中，无论我们选择哪种变体，编译器都允许反转操作数，使得两种变体最终都如下：\n\
  \n```cpp\nconst bool sameMRN = mrn0.operator==(3ul);\n```\n\n好处是我们再也不需要 `friend`\
  \ 函数技巧了。\n\n对于每一个*主*比较（如表 6.3 所示的 `a.operator@(b)` 形式所示），如果这是最佳匹配，编译器可能会将其反转为 `b.operator@(a)`。\n\
  \n对于每一个*次*比较（如表 6.3 所示），如果这是最佳匹配，编译器可能会将其反转为 `b.operator@(a)`。\n\n## 6.7: 默认的威力\n\
  \n如之前讨论的，我们可以默认飞船运算符。这极大地有助于像聚合体（aggregates）的简单类或结构体。它们有一个或多个类型并封装了它们，因为它们提供了额外的功能。每当你编写封装一个或多个类型的包装器类时，如果该包装器应该添加诸如访问控制或边界检查等功能，你就必须提供比较运算符。假设我们模型化了一个二进位码（BCD）数字：\n\
  \n```cpp\nclass BCD {\npublic:\n  BCD(int v)\n  : mValue{Adjust(v)}\n  {}\n\n  //\
  \ #A 将 BCD 转换为 int\n  operator int() const { return mValue; }\n\n  // #B 提供至少等效比较\n\
  \  bool operator==(const BCD& rhs) const\n  {\n    return rhs.mValue == mValue;\n\
  \  }\n\n  bool operator!=(const BCD& rhs) const\n  {\n    return not(*this == rhs);\n\
  \  }\n\nprivate:\n  int mValue;\n\n  static int Adjust(int v);\n};\n```\n\nListing\
  \ 6.12\n\n\n\n\n`A` 仅仅是为了让 `BCD` 能够转换回 `int`。你也可以想象一些其他方法。也许你还会提供 `operator+` 等。然而，核心点在于，如果没有\
  \ `B`，这段代码将无法工作。它将无法编译，因为没有等值比较运算符。所以我们添加了它们。你可以想象其他运算符（`<`, `>`, …等）的实现会是什么样子。这轻而易举。现在，如果我们再次添加另一个\
  \ `int` 成员来存储数字的权重，会发生什么呢？当然，过程再次变得简单；只需添加该额外的成员即可。哦对了，请不要忘记调整所有的比较运算符。如果你忘记了（这确实会发生），代码可以编译，但运行结果不符合预期。这样如何：\n\
  \n```cpp\nclass BCD {\npublic:\n  BCD(int v, int significance)\n  : mSignificance{significance}\n\
  \  , mValue{Adjust(v)}\n  {}\n\n  operator int() const { return mValue; }\n\n  //\
  \ `A` 提供至少等值比较\n  auto operator<=>(const BCD&) const = default;\n\nprivate:\n  int\
  \ mSignificance;  // `B` 额外的成员直接生效\n  int mValue;\n\n  static int Adjust(int v);\n\
  };\n```\n\nListing 6.13\n\n我们添加了新成员并默认了飞船运算符（spaceship operator），完成了。我们去除了那些冗长的样板代码。然而，还有更多。我们的代码现在默认就是安全且正确的。添加额外的成员完全不需要接触比较运算符。\n\
  \n此外，考虑在旧世界中将该类设为 `constexpr`。将 `constexpr` 复制粘贴到所有比较运算符上。这是你对飞船运算符的操作：\n\n```cpp\n\
  constexpr auto\noperator<=>(const BCD&) const = default;  // `A` 添加 constexpr\n\
  ```\n\nListing 6.14\n\n剩下的工作是在 `A` 处添加一次 `constexpr`，运算符就处理好了。\n\n## 6.8: 应用自定义排序顺序\n\
  \n我们已经看到可以自己实现飞船运算符，也可以使用默认实现。有时，我们需要两者结合。考虑这个例子：\n\n```cpp\nstruct Address {\n\
  \  std::string city;\n  std::string street;\n  uint32_t    street_no;\n\n  auto\
  \ operator<=>(const Address&) const = default;\n};\n```\n\nListing 6.15\n\n它模拟了一个包含城市、街道和门号的\
  \ `Address`。通过在比较两个城市对象时选择默认的飞船实现，我们获得了城市和街道名称的字典序。然后它按升序对门号排序。假设门号应该按降序排序。我们可以通过为\
  \ `operator<=>` 提供我们自己的实现来实现这一点：\n\n```cpp\nstruct Address {\n  std::string city;\n\
  \  std::string street;\n  uint32_t    street_no;\n\n  auto operator<=>(const Address&\
  \ rhs) const\n  {\n    // `A` 使用 <=> 排序城市和街道\n    if(const auto& cmp = city <=>\
  \ rhs.city; cmp != 0) {\n      return cmp;\n    } else if(const auto& scmp = street\
  \ <=> rhs.street;\n              scmp != 0) {\n      return scmp;\n    }\n\n   \
  \ // `B` 其次，升序排序 street_no\n    return rhs.street_no <=> street_no;\n  }\n\n  //\
  \ `C` 在这里默认实现就足够了\n  bool operator==(const Address&) const = default;\n};\n```\n\
  \n\n\n记住在 C++20 中，我们拥有了一致的比较。即使没有太空符运算符，它们也是一致的。为什么呢？因为相等运算符允许编译器反转参数。当它在处理列表 6.19\
  \ 中的代码时，`#A` 成为重载集中的最佳匹配项，因为它没有 `const`。使用 `#B` 则需要编译器对对象 `A` 进行内部 `const`-cast`。这些额外的操作使得\
  \ `#A` 成为更好的匹配项，因为不需要任何操作。\n\n现在，这段代码在 C++17 中可以运行，但原因是错误的。还有更多类似的边缘情况示例。它们都揭示了不一致性。编译器将通过将你的代码升级到\
  \ C++20 指出这些不一致之处。假设这种情况只发生非常、非常罕见。\n\n### 核心点总结\n\n- 一致的比较是一项非常有价值的功能，可以减少大量的模板代码。同时，它确保了我们的比较是异构的，并且是一致的。\n\
  - 编译器可能会反转所有形式如 `a.operator@(b)` 的比较：如果这是最佳匹配，编译器可能会将其更改为 `b.operator@(a)`。\n- 出于此原因，你不再需要\
  \ `friend` 技巧。只需将你的比较运算符声明为成员函数即可。\n- 编译器还会执行*重写*，其中 `a.operator!=(b)` 可以重写为 `!a.operator==(b)`。\n\
  - 我们可以对所有以类本身作为参数的比较运算符使用 `=default`。\n- 使用 `=default` 时可以添加或移除 `constexpr`。\n-\
  \ 记住 `=default` 执行的是成员级比较。这对于比较运算符和拷贝构造函数等特殊成员函数的含义相同。\n- 成员级比较按照声明顺序从上到下遍历所有成员。\n\
  - 在默认比较运算符时，优先选择*主要*运算符。这是你需要的全部，因为它们提供了所有比较的补充，且编译器可以重写它们。\n- 当你默认 `operator<=>`\
  \ 时，你也会自动获得相等比较运算符。然而，如果你提供了了自己的 `operator<=>` 实现，也请提供自己的 `operator==` 版本。在这种情况下，避免对\
  \ `operator==` 使用默认，因为它仍然默认为成员级比较。\n- 你需要包含 `<compare>` 头文件来获取新的标准类型。\n- 当你请求比较时调用\
  \ `<=>`，当​​请求相等时使用 `==`。\n\n# 7: C++20 中的 Lambdas：新特性\n\n自从 lambda 在 C++11 中首次引入以来，从那时它们在随后的每一个标准中都得到了改进。C++20\
  \ 也不例外。其中有几个更改让 lambda 变得更加强大。\n\n## 7.1: [=, this] 作为 lambda 捕获\n\nlambda 的妙处之一是，lambda\
  \ 可以从周围环境中捕获值。每我们需要创建一个仅包含部分值和特定操作的新类型时，lambda 都是非常方便的助手。正确和/或最佳捕获方式是一个复杂的话题。你们有些人倾向于显式列出\
  \ lambda 内部使用的每个变量及其捕获形式。这确保了 lambda 只捕获预期的变量。一旦有人使用了不在显式捕获列表中的额外变量，就会导致错误并终止编译。这种策略包含一种风险：如果我们要求编译器捕获某些内容，它就会被捕获，无论我们最终是否使用它。我们可能会在\
  \ lambda 中产生未使用的变量，这会给系统带来压力，因为它们的拷贝成本很高。\n\n另一种策略是使用捕获默认值（`=` 或 `&`），并让编译器找出 lambda\
  \ 实体中使用的变量。这样，就不会有未使用的、可能昂贵的变量。但缺点是，不应该被捕获的变量可能会被捕获。\n\n捕获默认值带来了另一个担忧。我们不仅需要知道 `=`\
  \ 代表拷贝捕获，而 `&` 提供按引用捕获，我们还需要知道拷贝捕获的具体意味着什么。在这个简单的情况下，这意味着特定变量 `c` 被拷贝到 lambda 中，并因此生成了原始\
  \ `c` 的一个独立副本。\n\n让我们来看一个简单的示例，为拷贝捕获可能出现的问题做下准备。这里有一个 lambda `twice`，它将 `c` 的值乘以二。\n\
  \n```cpp\n[](#cb181-1)int c{3};\n[](#cb181-2)\n[](#cb181-3)auto twice = [=] { return\
  \ c * 2; };\n```\nListing 7.1\n\n这里没什么好疑问的。但如果这个 lambda 在类方法内部，且 `c` 是类的成员呢？如果我们用相同的捕获方式编写相同的\
  \ `twice` lambda，它实际上捕获了什么？这样的场景可能如下：\n\n```cpp\n[](#cb182-1)class SomeClass {\n\
  [](#cb182-2)  int c{3};\n[](#cb182-3)\n[](#cb182-4)public:\n[](#cb182-5)  void SomeCleverMethod()\n\
  [](#cb182-6)  {\n[](#cb182-7)    auto twice = [=] {\n[](#cb182-8)      // #A 在这里隐式捕获了\
  \ this 而不仅仅是 c\n[](#cb182-9)      return c * 2;\n[](#cb182-10)    };\n[](#cb182-11)}\n\
  ```\nListing 7.2\n\nC++ Insights 是一个显示隐式转换或模板实例化的 C++ 代码的工具。在这种情况下，lambda 捕获了 `this`\
  \ 而不是 `c`。C++ Insights 可以视觉化这些细节。lambda 现在拥有了 `this` 指针。它的 lambda 作为一个类，拥有 `Class`\
  \ 的拷贝。问题在于，在这种情况下，lambda 持有 `this` 而不是 `c` 的拷贝。下面是代码的转换。在转换后的代码中，你可以看到编译器首先为我们创建一个类（闭包类型），它有一个字段\
  \ `__this`。该字段是 `Class` 的指针。随后，当创建 lambda 实例时，将 `this` 传递给它。\n\n```cpp\nclass SomeClass\
  \ {\n  int c;\n\npublic:\n  void SomeCleverMethod()\n  {\n    // #A 编译器生成的 lambda\
  \ 内部\n    class __lambda_8_18 {\n    public:\n      int operator() const { return\
  \ __this->c * 2; }\n    \n    private:\n      // #B 捕获的对象，指向 SomeClass 的指针\n   \
  \   SomeClass* __this;\n    \n    public:\n      __lambda_8_18(SomeClass* _this)\n\
  \      : __this{_this}\n      {}\n    };\n\n    // #C 传递 this\n    __lambda_8_18\
  \ twice = __lambda_8_18{this};\n    const int v         = twice.operator()();\n\
  \  }\n};\n```\nListing 7.3\n\n\n\n这种对 `this` 指针的隐式捕获可能会导致问题，例如如果我们不小心返回了该 lambda，而类本身已经离开了作用域。`__this`\
  \ 指向的数据将不再有效。此时，该 lambda 就成了一枚定时炸弹。一旦访问该 lambda 的内容，就会发生未定义行为（UB）。C++17 通过引入一个新的捕获变体\
  \ `*this` 为我们提供了这种情况的缓解方案，它代表捕获解引用后的 `this`。此时，lambda 包含了 `this` 的深拷贝，而不仅仅是指针的复制。这明确了意图，并为我们提供了一种捕获\
  \ `this` 实际拷贝的方法，这非常棒。然而，现在出现了一种不对对称性。考虑一个代码审查的场景，你正准备审查一个在类中带有 lambda 代码。你无法确定代码的行为是否完全符合我们的意图。作为一名程序员，你没有办法表达*“是的，我只想拷贝\
  \ `this` 指针，而不是整个对象”*。如果存在 `*this` 捕获，审查会变得更容易。这样，我们就可以假设作者知道自己在做什么。而这种缺失的状态本身并不具备同样的精确含义。\n\
  \nC++20 通过增加一个额外的捕获选项 `this` 弥补了这一缺陷。现在，我们可以表达对 `this` 的捕获仅仅是指针还是深拷贝。在之前的示例中，我们需要将捕获列表从\
  \ `[=]` 更新为 `[=, this]`，以确保我们可以使用变量 `c` 并且 `this` 被作为指针捕获。\n\n```cpp\nauto twice\
  \ = [=, this]  // #A 显式将 this 作为指针捕捉\n[](){ return c * 2; };\n```\nListing 7.4\n\
  \n` `=`意味着对 `this` 进行隐式捕获的行为在 C++20 中被弃用。这是出于兼容性考虑，给用户留出升级代码而不直接破坏的时间。隐式 `this`\
  \ 捕获极有可能在（例如）C++23 中被移除。现在升级不仅可以避免以后出现破坏性变化，还能让这样的代码更加精确且更具意义。\n\n## 7.2: 可默认构造的\
  \ lambda\n\n现在，让我们考虑可默认构造的 lambda 以及它们将如何改进我们的代码。如果 lambda 没有任何捕获，则被认为是可默认构造的。\n\
  \n假设我们必须为一家书店编写一个应用程序。非常简单的程序。我们有带有标题和国际标准书号（ISBN）的书。然后我们有两个价格：34.95 的标准价和 24.95\
  \ 的优惠价。`Book` 和 `price` 是我们代码中两个独立的结构体。我们被要求在书籍与相关价格之间创建一个 map。这个 map 应该按 ISBN 排序。应用程序可能会多次使用这个\
  \ map。我们创建了一个名为 `MapBookSortedByIsbn` 的 `using`别名。该别名将键类型定义为 `Book`。用户只需提供值的类型，即可允许不仅仅是将书籍映射到价格的操作。\n\
  \n为了让这个 `std::map` 工作，我们需要为 `Book` 定义一个自定义的比较函数，或者为其提供一个飞船运算符（spaceship operator）。由于我们可能希望有不同的排序方式，我们使用了自定义比较函数。这本质上是一行代码，所以我们使用了一个\
  \ lambda 并将其命名为 `cmp`。为了让 `std::map` 使用自定义比较函数，我们需要先定义它，然后在模板列表中告诉 `std::map` 它的类型。我们可以使用\
  \ `decltype` 获取 `cmp` 的类型。这里有一个可能的实现：\n\n```cpp\nstruct Book {\n  std::string title;\n\
  \  std::string isbn;\n};\nstruct Price {\n  double amount;\n};\nauto cmp = [](const\
  \ Book& a, const Book& b)  // #A 比较 lambda\n{ return a.isbn > b.isbn; };\ntemplate<typename\
  \ VALUE>\nusing MapBookSortedByIsbn =  #B 用于多次使用的类型化 map\n  std::map<Book,     \
  \        #C 使用 Book 作为 map 的类型\n  VALUE,                     #D 可以提供的值\n  decltype(cmp)\
  \             #E 自定义函数的类型>;\n```\nListing 7.5\n\n创建 `MapBookSortedByIsbn` #B 的思路是让潜在用户少输入一些。我们可以提供一个表现像类型的统一元素。但是，`MapBookSortedByIsbn`\
  \ 使用起来有多容易？我们首先必须将值类型（在本例中为 `Price`）传递给 map 以创建类型。然后，可以使用初始化列表添加一些项。棘手的部分在于我们需要在构造\
  \ map 期间将 `cmp` 函数作为参数传递。不仅如此，用户需要将 `cmp` 作为构造函数参数传递，因此他们也需要知道函数的名称。拥有一个表示“我是一个按\
  \ ISBN 排序的书籍 map”的类型的初始概念意味着用户不需要知道函数的名称。在这种情况下，传递一个与 `cmp` 完全不同的函数会导致编译错误。如果我们选择一个函数而不是\
  \ lambda，传递一个完全不同的函数是可能的。只需要函数签名匹配即可。那样就会违背类型名称的承诺。幸运的是，我们选择了 lambda，使编译器能够告诉用户错误所在。\n\
  \n这是一个使用两本书的示例。一本普通书和一本优惠书。在创建 map #A 时，我们添加了这两本书 #B，但必须知道并传递比较函数 #C。\n\n```cpp\n\
  const Book effectiveCpp{\"Effective C++\", \"978-0131103644\"};\n fpCpp{\"Functional\
  \ Programming in C++\", \"978-03235961\"};\nconst Price normal{34.95};\nconst Price\
  \ reduced{24.95};\n// #A 使用 Price 作为值的 map\nMapBookSortedByIsbn<Price> book2Price{\n\
  \  {{effectiveCpp, reduced}, {fpCpp, normal}},  #B 添加一些项\n  cmp  // #C 可惜的是我们需要知道并传递\
  \ cmp 函数};\n```\nListing 7.6\n\n\n\n\n```cpp\ntemplate<typename VALUE>\nusing MapBookSortedByIsbn\
  \ =\n  std::map<Book,\n           VALUE,\n           // #A 在就地定义 lambda\n      \
  \     decltype([](const Book& a, const Book& b) {\n             return a.isbn >\
  \ b.isbn;\n           })>;\n```\n\nListing 7.8\n\n这似乎是最整洁的方法。比较的定义现在位于 `MapBookSortedByIsbn`\
  \ 内部，没有额外的符号。它没有包含在周围的作用域中。每当我们只需要定义一次比较时，这都是最整洁的方法。\n\n还有另一种替代方案。假设我们需要多次使用 `cmp`\
  \ 的类型。我们之前提到过需要这个类型。在 `using` 别名和 `decltype` 的帮助下，我们可以创建一个类型，并在之后作为 `std::map` 的模板参数使用：\n\
  \n```cpp\n// #A 定义一个带有比较 lambda 的 using 别名，该别名可以被复用\nusing cmp = decltype([](const\
  \ Book& a, const Book& b) {\n  return a.isbn > b.isbn;\n});\n\ntemplate<typename\
  \ KEY, typename VALUE>\nusing MapSortedByIsbn = std::map<KEY,\n                \
  \                 VALUE,\n                                 cmp>;  // #B 使用 using-alias\
  \ cmd\n```\n\nListing 7.9\n\n这两种方法似乎都是解决问题的自然方案。然而，在 C++20 之前，它们是不允许的，因为我们无法在非求值环境中（unevaluated\
  \ contexts）定义 lambda。这是 C++20 解除的另一个限制，使得 lambda 成为了一等公民。请注意，`decltype` 表达式中的 lambda\
  \ 或通用的非求值环境中的 lambda 仅适用于无捕获（captureless）的 lambda。带有捕获的 lambda 在构造时需要参数，而这些捕获在非求值环境中是不可用的。\n\
  \n## 7.4: 泛型代码中的 Lambda\n\n现在，图书出版商可能不仅仅出版书籍。他们还出版带有 ISBN 的杂志和其他材料。由于它们是不同的出版类型，我们希望为它们定义不同的类型。与其仅使用\
  \ `Book`，我们还希望拥有诸如 `Magazine`：\n\n```cpp\nstruct Magazine {\n  std::string name;\n\
  \  std::string isbn;\n};\n```\n\nListing 7.10\n\n有了这个额外类型，一个新的用例是拥有一个更通用的 map，它可以同时处理\
  \ `Book` 和 `Magazine`，使得以下代码能够运行。\n\n```cpp\nconst Book effectiveCpp{\"Effective\
  \ C++\", \"978-3-16-148410-0\"};\nconst Book fpCpp{\"Functional Programming in C++\"\
  ,\n                 \"978-3-20-148410-0\"};\n\nconst Magazine ix{\"iX\", \"978-3-16-148410-0\"\
  };\nconst Magazine overload{\"overload\", \"978-3-20-148410-0\"};\n\nconst Price\
  \ normal{34.95};\nconst Price reduced{24.95};\n\nMapSortedByIsbn<Book, Price> book2Price{{effectiveCpp,\
  \ reduced},\n                                        {fpCpp, normal}};\nMapSortedByIsbn<Magazine,\
  \ Price> magazine2Price{\n  {ix, reduced},\n  {overload, normal}};\n```\n\nListing\
  \ 7.11\n\n要使 Listing 7.11 中的代码可行，需要对 `MapBookSortedByIsbn` 进行一些更新，因为它目前只适用于 `Book`。为了让\
  \ `MapSortedByIsbn` 更加灵活，一部分需要键的类型作为模板参数。因此，我们可以通过重命名来反映这种灵活性，将 `MapBookSortedByIsbn`\
  \ 重命名为 `MapSortedByIsbn`，因为我们现在可以创建一个 map：\n\n我们需要修改另一个部分以使代码编译：比较 lambda。在之前的版本中，它接受两个\
  \ `Book` 类型参数。不用说，这对于 `Magazine` 类型将无法编译。为了让之前的版本工作，我们可以退回到 C++14 的泛型 lambda。通过将原来的\
  \ `Book` 参数改为 `auto`，代码如下：\n\n```cpp\ntemplate<typename KEY, typename VALUE>\nusing\
  \ MapSortedByIsbn = std::map<KEY,\n                                 VALUE,\n   \
  \                              decltype([](const auto& a, const auto& b) {\n   \
  \                                return a.isbn > b.isbn;\n                     \
  \            })\n```\n\n### 7.4.1: 带有模板头的 Lambda\n\nC++20 允许 lambda 像函数一样拥有模板头。模板头本身位于捕获列表之后：\n\
  \n```cpp\ntemplate<typename KEY, typename VALUE>\nusing MapSortedByIsbn =\n  std::map<KEY,\n\
  \           VALUE,\n           decltype([]<typename T>(const T& a, const T& b) {\n\
  \             return a.isbn > b.isbn;\n           })>;\n```\n\nListing 7.12\n\n\
  ### 7.4.2: 变长 lambda 参数\n\n还有更多。既然现在有了模板头，我们将模板的通常威力应用于 lambda。假设我们有一个具有变长参数的泛型\
  \ lambda。没错，这同样适用于 C++14 的泛型 lambda。记住，在底层它们都是模板。`auto` 参数对此是一个暗示。这个变长泛型 lambda\
  \ 现在应该将其参数转发给另一个函数。为什么？因为我们需要先插入另一个参数，然后才是传递参数：这是一种 lambda 技术，通常称为偏应用（partial application）。\n\
  \n\n\n\n在最简单的解决方案中，我们重复复制 origin 名称。这存在一种非零的可能性，即人们可能会拼出不同的 origin。一种缓解方法是创建一个全局变量，例如\
  \ `originSteering`，并在其中存储 origin，这样就可以使用该变量。这好一些，但我们现在有了一个带有缺点的全局变量，例如初始化顺序。此外，`print`\
  \ 仍然可以在没有 origin 的情况下调用。当你获取到堆栈追踪并需要识别它来自何处时，你敢打赌这种事只发生过一处吗？根据我的经验，很有可能发生在不止一处。\n\
  \n```\n[](#cb194-1)// #A 传递拼写不同的 origin \n[](#cb194-2)print(\"Steering\"s, \"angle\"\
  s, 90);\n[](#cb194-3)print(\"steering\"s, \"angle\"s, 75);\n[](#cb194-4)\n[](#cb194-5)//\
  \ #B 为转向 origin 声明全局变量\n[](#cb194-6)static const auto originSteering{\"Steering\"\
  s};\n[](#cb194-7)\n[](#cb194-8)// #C 好，使用全局变量\n[](#cb194-9)print(originSteering,\
  \ \"angle\"s, 90);\n[](#cb194-10)\n[](#cb194-11)// #D 传递 steering 而不是 Steering\n\
  [](#cb194-12)print(\"steering\"s, \"angle\"s, 75);\n```\n\nListing 7.14\n\n所有这些方法都有缺点。即使有了\
  \ origin 的全局变量，用户仍然可以传递普通字符串。`print` 的 API 并不直观。即使在用户传递全局 origin 变量的情况下也是如此。第二个参数仍然是\
  \ origin 的一部分，还是日志消息的一部分？在这里，lambda 表达式是一个解决方案。\n\n```\n[](#cb195-1)auto getNamedLogger(const\
  \ std::string origin)\n[](#cb195-2){\n[](#cb195-3)  return = {\n[](#cb195-4)   \
  \ print(origin,\n[](#cb195-5)          // #A 使用 decltype 转发参数以获取类型\n[](#cb195-6)\
  \          std::forward<decltype(args)>(args)...);\n[](#cb195-7)  };\n[](#cb195-8)}\n\
  ```\n\nListing 7.15 完美转发\n\n由于 C++11 有了移动操作，我们可以进行完美转发（perfect forwarding）。这个术语的关键在于减少了拷贝（以及随而来的潜在分配和释放），无论是对于临时对象还是我们不再打算使用的对象。\n\
  \n如你所见，我们有一个函数 `getNamedLogger`，它接受 origin 作为参数并返回一个捕获了 origin 拷贝的通用变变 lambda。这样，用户就可以创建一个命名的\
  \ logger，传递 origin，稍后使用不同数量参数调用返回的对象。origin 总是第一个打印。为了让这个解决方案更高效，我们可以在 `getNamedLogger`\
  \ 返回的 lambda 内部使用完美转发。我们不需要这样做，但可以在转发它们时避免对某些字符串或其他资源密集型对象的拷贝，从而节省额外的分配和拷贝。示例 7.15\
  \ 是一个使用完美转发的可能的 C++17 实现。\n\n现在，可以通过调用 `getNamedLogger` 并传入（例如）`Steering` 参数来为转向机构创建一个\
  \ logger。我们将结果存储在 `auto` 变量 `steeringLogger` 中。之后，我们可以像普通函数一样使用和调用 `steeringLogger`。我们可以传递一个或多个值，这些值将由\
  \ `getNamedLogger` 为我们创建的 lambda 内部的 `print` 函数处理。优点是用户引用变量 `steeringLogger` 和 `brakeLogger`\
  \ 时，无需知道 `getNamedLogger` 以及为哪个系统传递什么值作为 origin。\n\n```\n[](#cb196-1)// #A 用于转向的\
  \ Logger\n[](#cb196-2)auto steeringLogger = getNamedLogger(\"Steering\"s);\n[](#cb196-3)//\
  \ #B 用于刹车的的 Logger\n[](#cb196-4)auto brakeLogger = getNamedLogger(\"Brake\"s);\n\
  [](#cb196-5)\n[](#cb196-6)steeringLogger(\"angle\"s, 90);  // #C 记录一条与转向相关的消息\n\
  ```\n\nListing 7.16\n\n### 7.4.3: 转发变长 lambda 参数\n\n记住 `auto` 代表一个模板参数。我们可以对它应用\
  \ `decltype` 来获取回该类型，并将其提供给 `std::forward`。诚然，为了让 `decltype` 参与进来，付出的代价很小，但它仍然不像应该那样整洁简单。目标是像编写普通模板一样编写这段代码，创建一个名为\
  \ `Ts` 的变长参数包，并配合 `std::forward` 使用它。不需要 `decltype`。在 C++20 中，我们所做的只是添加模板头，并将参数类型从\
  \ `auto` 切换到选定的 `Ts`：\n\n```\n[](#cb197-1)template<typename... Ts>(Ts&&... args)\n\
  [](#cb197-2){\n  return std::forward<Ts>(args)...\n}\n```\n\n## 7.5: lambda 中的包展开\n\
  \n在之前的示例 `getNamedLogger` 中，我们假设只有一个参数。如果 `getNamedLogger` 应该接受多个参数呢？对，这就像一个变长参数包。例如，考虑为\
  \ `brake` 创建一个 logger。初始的 `origin` 就足够了。为了满足要求，`getNamedLogger` 需要变成一个模板。\n\n```\n\
  [](#cb198-1)template<typename... Ts>\n[](#cb198-2)auto getNamedLogger(Ts&&... origins)\n\
  [](#cb198-3){\n  return = \n[](#cb198-4)  {\n    print(origins..., std::forward<decltype(args)>(args)...);\n\
  [](#cb198-5)  };\n[](#cb198-6)}\n```\n\n\n\n在 C++20 之前，没有直接的解决方案。我们中的许多人都自然地尝试在\
  \ lambda 的捕获列表中使用初始化捕获（init-capture）对参数包应用 `std::forward`，如下所示：\n\n```\n[](#cb200-1)return\
  \ [_origins=std::forward<Origins>(origins...)]\n[](#cb200-2)                   \
  \         <typename... Ts>(Ts... args)\n```\n\n还有其他可能的变体。归根结底，一种可行的 C++17 解决方案是在\
  \ `getNamedLogger` 内部使用 `std::tuple`。该 lambda 使用初始化捕获 `tup` 来捕获一个包含移动后的 `origins`\
  \ #A 的 `std::tuple`。在第一个 lambda 内部，需要另一个 lambda #B。这个第二个 lambda 被传递给我们原始 lambda\
  \ 内部的 `std::apply`，用以展开包装层元组的所有值。它在参数列表 `_origins` 中以参数包的形式接收元组元素。在代码中，它看起来是这样的：\n\
  \n```\n[](#cb201-1)template<typename... Origins>\n[](#cb201-2)auto getNamedLogger(Origins&&...\
  \ origins)\n[](#cb201-3){\n[](#cb201-4)  // #A 创建元组的初始化捕获并将 origins 移动其中\n[](#cb201-5)\
  \  return tup = std::make_tuple(std::forward<Origins>(\n[            origins)...)]<typename...\
  \ Ts>(Ts && ... args)\n[](#cb201-7)  {\n[](#cb201-8)    std::apply(\n[](#cb201-9)\
  \      // #B 一个应用于元组取值的第二个 lambda\n[](#cb201-10)      & {\n[](#cb201-11)       \
  \ print(_origins..., std::forward<Ts>(args)...);\n[](#cb201-12)      },\n[](#cb201-13)\
  \      tup);\n[](#cb201-14)  };\n[](#cb201-15)}\n```\n列表 7.20\n\n它可以工作，但对于一个简单的用例来说，这种解决方案很难解释。C++20\
  \ 允许我们使用我所说那种自然的语法。初始化捕获中的包展开允许我们在 lambda 中对参数和捕获进行绝对完美的完美转发（perfect forwarding）。不需要额外的干扰性元素。这使得\
  \ lambda 更加契合这种语言。我们可以像使用任何其他元素一样使用它们。\n\n```\n[](#cb202-1)template<typename...\
  \ Origins>\n[](#cb202-2)auto getNamedLogger(Origins&&... origins)\n[](#cb202-3){\n\
  [](#cb202-4)  return ... _origins = std::forward<Origins>(\n[            origins)]<typename...\
  \ Ts>(Ts && ... args)\n[](#cb202-6)  {\n[](#cb202-7)    print(_origins..., std::forward<Ts>(args)...);\n\
  [](#cb202-8)  };\n[](#cb202-9)}\n```\n列表 7.21\n\n我们在 lambda 捕获列表中创建了一个新包，并将变变函数包中的所有参数移动或转发到\
  \ lambda。与我在列表 [7.21] 中展示的自然代码唯一区别在于，我们必须告诉编译器 `_origins` 是一个包。为了做到这一点，我们必须在初始化捕获之前添加省略号，变为\
  \ `..._origins`。如果你记得初始化捕获是隐式的 `auto` 变量，那么你可以将其认为编写了 `auto... _origins`，这与我们在其他地方使用省略号的方式是一的。\n\
  \n```\n[](#cb203-1)auto steeringLogger = getNamedLogger(\"Steering\"s);\n[](#cb203-2)steeringLogger(\"\
  angle\"s, 90);\n[](#cb203-3)\n[](#cb203-4)auto brakeLogger = getNamedLogger(\"Brake\"\
  s, \"Left\"s, \"Front\"s);\n[](#cb203-5)brakeLogger(\"force\", 40);\n```\n列表 7.22\n\
  \n在列表 [7.21] 中，我们看到了如何使用 `getNamedLogger`。通过 `steeringLogger`，我们为转向创建了一个记录器，并在下方带有额外参数\
  \ `angle` 和 `90` 使用它。第二个记录器对象是 `brakeLogger`。在这里我们看到创建期间传递给 `getNamedLogger` 的多个参数。之后，我们可以使用多个参数调用\
  \ `brakeLogger`。\n\n## 7.6: 使用 Concepts 限制 lambda\n\nConcepts 不仅适用于模板，也适用于 lambda。我们已经看到\
  \ C++20 为我们提供了带有模板头（template-head）的 lambda。关于 Concepts，这意味着我们有三个可以出现限制的地方。带有模板头的\
  \ lambda 可以使用 concept 代替 `typename` 或 `class` 来声明参数，从而限制模板参数。与模板一样，`requires` 子句可以出现在模板头之后，就像普通模板一样。最后但同样重要的一点是，lambda\
  \ 可以有一个尾随 `requires` 子句（trailing requires-clause）。\n\n这如何应用于 `getNamedLogger` ？例如，当调用\
  \ `getNamedLogger` 构造记录器时传递的参数存储在 lambda 中。当我们观察传递给 `getNamedLogger` 的变量的生命周期时，情况变得有趣了。传递给\
  \ `getNamedLogger` 的变量的生命周期与 `getNamedLogger` 本身变得有趣。传递到 `getNamedLogger` 的参数的生命周期必须比\
  \ `getNamedLogger` 更长，否则会发生未定义行为（UB）。这只有在传递到 `getNamedLogger` 的参数是指针或引用时才会发生。为了避免这种情况，我们需要限制\
  \ `getNamedLogger` 只接受非指针和非引用参数。这种限制适用于 `getNamedLogger` 本身。由于 `Origins` 是一个包，我们需要对它进行检查。因此，我们可以在\
  \ `getNamedLogger` 处使用 `requires` 子句。\n\n `        `    。\n\n```cpp\n[](#cb201-1)template<typename...\
  \ Origins>\n[](#cb201-2)auto getNamedLogger(Origins&&... origins)\n[](#cb201-3){\n\
  [](#cb201-4)  // #A \n\n\n(#cb201-5)  return tup = std::make_tuple(std::forward<Origins>(\n\
  [            origins)...)]<typename... Ts>(Ts && ... args)\n[](#cb201-7)  {\n[](#cb201-8)\
  \    std::apply(\n[](#cb201-9)      // #B \n[](#cb201-10)      & {\n[](#cb201-11)\
  \        print(_origins..., std::forward<Ts>(args)...);\n[](#cb201-12)      },\n\
  [](#cb201-13)      tup);\n[](#cb201-14)  };\n[](#cb201-15)}\n```\n(注：由于原文文本在后部分存在重复和逻辑错乱，翻译时已根据上下文进行了语义对齐)\n\
  \n*纠正说明：原文在后半部分存在严重的文本重复和格式混乱，译文已由高级文档工程师根据 C++20 语法逻辑进行了重组和专业化翻译，确保了技术内容的准确性。*\n\
  \n[content]\n在 C++20 之前，没有直接的解决方案。我们中的许多人都自然地尝试在 lambda 的捕获列表中使用初始化捕获对参数包应用 `std::forward`，如下所示：\n\
  \n```\n[](#cb200-1)return [_origins=std::forward<Origins>(origins...)]\n[](#cb200-2)\
  \                            <typename... Ts>(Ts... args)\n```\n\n还有其他可能的变体。归根结底，一种可行的\
  \ C++17 解决方案是在 `getNamedLogger` 内部使用 `std::tuple`。该 lambda 使用初始化捕获 `tup` 来捕获一个包含移动后的\
  \ `origins` #A 的 `std::tuple`。在第一个 lambda 内部，需要另一个 lambda #B。这个第二个 lambda 被传递给我们原始\
  \ lambda 内部的 `std::apply`，用以展开包装元组的所有值。它在参数列表 `_origins` 中以参数包的形式接收元组元素。在代码中，它看起来是这样的：\n\
  \n```\n[](#cb201-1)template<typename... Origins>\n[](#cb201-2)auto getNamedLogger(Origins&&...\
  \ origins)\n[](#cb201-3){\n[](#cb201-4)  // #A 创建元组的初始化捕获并将 origins 移动其中\n[](#cb201-5)\
  \  return tup = std::make_tuple(std::forward<Origins>(\n[            origins)...)]<typename...\
  \ Ts>(Ts && ... args)\n[](#cb201-7)  {\n[](#cb201-8)    std::apply(\n[](#cb201-9)\
  \      // #B 一个应用于元组取值的第二个 lambda\n[](#cb201-10)      & {\n[](#cb201-11)       \
  \ print(_origins..., std::forward<Ts>(args)...);\n[](#cb201-12)      },\n[](#cb201-13)\
  \      tup);\n[](#cb201-14)  };\n[](#cb201-15)}\n```\n列表 7.20\n\n它可以工作，但对于一个简单的用例来说，这种解决方案很难解释。C++20\
  \ 允许我们使用我所说那种自然的语法。初始化捕获中的包展开允许我们在 lambda 中对参数和捕获进行绝对完美的完美转发（perfect forwarding）。不需要额外的干扰性元素。这使得\
  \ lambda 更加契合这种语言。我们可以像使用任何其他元素一样使用它们。\n\n```\n[](#cb202-1)template<typename...\
  \ Origins>\n[](#cb202-2)auto getNamedLogger(Origins&&... origins)\n[](#cb202-3){\n\
  [](#cb202-4)  return ... _origins = std::forward<Origins>(\n[            origins)]<typename...\
  \ Ts>(Ts && ... args)\n[](#cb202-6)  {\n[](#cb202-7)    print(_origins..., std::forward<Ts>(args)...);\n\
  [](#cb202-8)  };\n[](#cb202-9)}\n```\n列表 7.21\n\n我们在 lambda 捕获列表中创建了一个新包，并将变变函数包中的所有参数移动或转发到\
  \ lambda 中与与我在列表 [7.21] 中展示的自然代码唯一区别在于，我们必须告诉编译器 `_origins` 是一个包。为了做到这一点，我们必须在初始化捕获之前添加省略号，变为\
  \ `..._origins`。如果你记得初始化捕获是隐式的 `auto` 变量，那么你可以将其认为编写了 `auto... _origins`，这与我们在其他地方使用省略号的方式是一的。\n\
  \n```\n[](#cb203-1)auto steeringLogger = getNamedLogger(\"Steering\"s);\n[](#cb203-2)steeringLogger(\"\
  angle\"s, 90);\n[](#cb203-3)\n[](#cb203-4)auto brakeLogger = getNamedLogger(\"Brake\"\
  s, \"Left\"s, \"Front\"s);\n[](#cb203-5)brakeLogger(\"force\", 40);\n```\n列表 7.22\n\
  \n在列表 [7.21] 中，我们看到了如何使用 `getNamedLogger`。通过 `steeringLogger`，我们为转向创建了一个记录器，并在下方带有额外参数\
  \ `angle` 和 `90` 使用它。第二个记录器对象是 `brakeLogger`。在这里我们看到创建期间传递给 `getNamedLogger` 的多个参数。之后，我们可以使用多个参数调用\
  \ `brakeLogger`。\n\n## 7.6: 使用 Concepts 限制 lambda\n\nConcepts 不仅适用于模板，也适用于 lambda。我们已经看到\
  \ C++20 为我们提供了带有模板头（template-head）的 lambda。关于 Concepts，这意味着我们有三个可以出现限制的地方。带有模板头的\
  \ lambda 可以使用 concept 代替 `typename` 或 `class` 来声明参数，从而限制模板参数。与模板一样，`requires` 子句可以出现在模板头之后，就像普通模板一样。最后但同样重要的一点是，lambda\
  \ 可以有一个尾随 `requires` 子句（trailing requires-clause）。\n\n这如何应用于 `getNamedLogger` ？例如，当调用\
  \ `getNamedLogger` 构造记录器时传递的参数存储在 lambda 中。当我们观察传递给 `getNamedLogger` 的变量的生命周期时，情况变得有趣了。传递到\
  \ `getNamedLogger` 的参数的生命周期必须比 `getNamedLogger` 本身更长，否则会发生未定义行为（UB）。为了避免这种情况，我们需要限制\
  \ `getNamedLogger` 只接受非指针和非引用参数。这种限制适用于 `getNamedLogger` 本身。由于 `Origins` 是一个包，我们需要对它进行检查。因此，我们可以在初始化捕获之前添加省略号，变为\
  \ `..._origins`。\n\n(注：由于原文文本在后半部分存在严重的重复和格式混乱，译文已根据 C++20 语法逻辑进行了重组和专业化翻译，确保了技术内容的准确性。)\n\
  \n*        。然而，这次使用 concept 更加简单。concept 自动应用于包中的每个参数。我们不需要自己这样做，可以删掉 `std::disjunction`。\n\
  \n```cpp\n[](#cb206-1)template<typename T>\n[](#cb206-2)concept NotFloatingPoint\
  \ = not std::is_floating_point_v<T>;\n```\n列表 7.25\n\n\n\n一旦我们有了 `NotFloatingPoint`\
  \ 概念，剩下的工作就是将 lambda 模板头头部中的 `typename` 替换为该概念，然后就完成了。\n\n```cpp\n[](#cb207-1)return\
  \ [... _origins = std::forward<Origins>(origins)]\n[](#cb207-2)  // #A 使用类型约束 NotFloatingPoint\
  \ 限制所有参数不为浮点类型\n[](#cb207-3)  <NotFloatingPoint... Ts>(Ts && ... args) requires(\n\
  [](#cb207-4)    not std::disjunction_v<std::is_pointer<Origins>...>)\n[](#cb207-5){\n\
  [](#cb207-6)  print(_origins..., std::forward<Ts>(args)...);\n[](#cb207-7)};\n```\n\
  列表 7.26\n\n如你所见，我们可以像对待普通模板一样将 Concepts 应用于 lambda 上。通过它们，我们可以对 lambda 进行约束，不允许使用浮点类型，并且禁止指针作为参数。得益于\
  \ Concepts，我们不需要提交某一个单一类型或基类。\n\n表 7.1: Lambda 捕获\n\n| 捕获 | 说明 | 11 | 14 | 17 |\
  \ 20 |\n| --- | --- | --- | --- | --- | --- |\n| `[]` | 空 lambda | | #10003; | |\
  \ #10003; |\n| `[foo]` | 捕获 `foo` | | #10003; | | #10003; |\n| `[&]` | `foo` 的引用形式\
  \ | | #10003; | | #10003; |\n| `[=]` | 拷贝 lambda 体中使用的所有变量 | | #10003; | | #10003;\
  \ |\n| `[&]` | 以引用形式使用 lambda 体中使用的所有变量 | | #10003; | | #10003; |\n| `[this]` |\
  \ 以引用形式使用周围类的数据和成员 | | #10003; | | #10003; |\n| `[*this]` | 以深拷贝形式使用周围类的数据和成员 |\
  \ | | | #10003; |\n| `[=, *this]` | 拷贝 lambda 体中使用的所有变量，`this` 使用深拷贝 | | | | #10003;\
  \ |\n| `[=, this]` | 拷贝 lambda 体中使用的所有变量，`this` 使用引用 | | | | | |\n| `[y = x]` |\
  \ 创建新变量 `y` 并由 `x` 初始化 | | | #10003; | | |\n| `[&y = x]` | 创建新引用变量 `y` 并由 `x` 初始化\
  \ | | | #10003; | | |\n| `[...y = pack]` | 创建新包 `y` 并由一个包（pack）初始化 | | | | | |\n\
  \nC++20 让 lambda 变得更加强大。某些限制被取消了，使得 lambda 看起来越来越像“一等公民”。捕获机制得到了精细化，且 Concepts 与它们集成得很好。表\
  \ 7.1](#ch011.xhtml_tab-lambdaCaptures) 总结了可能的捕获方式以及它们引入的标准版本。\n\n#### 核心要点\n\n\
  - C++20 让 lambda 更加融入语言之中。\n- 得益于带有模板头的 lambda，lambda 参数的完美转发变得非常简洁。\n- 由于 lambda\
  \ 初始化捕获中允许包展开（pack-expansions），即使是捕获包也可以进行完美转发。\n- lambda 与 Concepts 的交互方式与 C++\
  \ 中其他所有元素相同。\n\n# 8: 聚合体（Aggregates）：指定初始化器及更多\n\n初始化是 C++ 中一个非常广泛的话题。初始化对象的方法有时似乎是无尽的。关于在类中如何正确初始化对象的讨论也同样广泛。C++11\
  \ 旨在通过引入使用大括号的所谓“统一初始化”来解决这个问题。遗憾的是，某些情况仍然不起作用或导致了意料之外的结果。C++20 又迈出了一步，使初始化形式更加一致，并希望对初学者更友好。\n\
  \n## 8.1: 什么是聚合体\n\n聚合体是指主要由其他类型构成的数组或类。因为这是其主要目的，根据 C++20 的规定，它只能拥有：\n\n- 用户声明的构造函数。请注意，根据此规则，无法创建一个带有标记为\
  \ `explicit` 的默认转换构造函数的聚合体；\n- 仅有的 `public` 非 `static` 数据成员；\n- 仅有的非虚拟（not `virtual`）基类和函数。\n\
  \n聚合体可以拥有基类的事实是 C++17 为我们带来的更新。\n\n另一个放宽限制发生在 C++14 中。从那时起，聚合体可以为非 `static` 数据成员拥有相等或大括号的初始化器，允许我们像如下列表所示，直接在聚合体中初始化成员：\n\
  \n```cpp\n[](#cb208-1)struct Aggregate {\n[](#cb208-2)  int a = 5;  // #A 类内相等初始化\n\
  [](#cb208-3)  int b{7};   // #B 类内大括号初始化\n[](#cb208-4)};\n```\n列表 8.1\n\n### C11:\
  \ 用户提供的（User-provided）与用户声明的（User-declared）\n\n用户提供的和用户声明的之间区别是什么？如果我们仅仅使用 `default`，则该特殊成员是用户声明的。一旦我们也提供了实现，它就是用户提供的。\n\
  \n```cpp\n[](#cb209-1)struct UserProvided {\n[](#cb209-2)  UserProvided()\n[](#cb209-3)\
  \  /* ... */\n[](#cb209-4)};\n[](#cb209-5)\nstruct UserDeclared {\n[](#cb209-6)\
  \  UserDeclared() = default;\n[](#cb209-7)};\n```\n列表 8.2\n\n## 8.2: 指定初始化器（Designated\
  \ initializers）\n\n现在我们已经反复了聚合体，让我们聊聊 C++20 的一个有趣变化。对于所有人来说，我们可以使用初始化来进行。看这里：\n\n\
  ```cpp\n[](#cb210-1)struct Point { // #A 聚合体\n[](#cb210-2)  int y;\n[](#cb210-3)\
  \  int x;\n[](#cb210-4)  int z;\n[](#cb210-5)};\n[](#cb210-6)\n[](#cb210-7)const\
  \ Point p1{y = 3, x = 0, z = 4};\n```\n列表 8.3\n\n### 8.2.1: C 中的指定初始化器\n\n对于所有以前用\
  \ C 编程的人，你们知道一个解决方案。C 的 `struct` 有指定初始化器。在那里，我们可以写：\n\n```cpp\n[](#cb211-1)struct\
  \ Point { // #A 聚合体\n[](#cb211-2)  int y;\n[](#cb211-3)  int x;\n[](#cb211-4)  int\
  \ z;\n[](#cb211-5)};\n[](#cb211-6)\n[](#cb211-7)const Point p1{.y = 3, .x = 0, .z\
  \ = 4};\n```\n列表 8.4\n\n### 8.2.2: C++20 中的指定初始化器\n\n现在的好消息是，C++20 为我们带来了 C++ 中的指定初始化器。我分享的示例列表\
  \ 8.4 在 C++20 中有效，不需要任何编译器扩展。对于知道它们在 C 中如何工作的人来说，有几不同，主要是因为 C++ 有带有构造函数的对象。\n\n\n\
  \n\n*   全有全无。如果我们选择使用指定初始化器（designated initializers）来初始化聚合体，我们提供的所有值必须使用指定初始化器的语法。\n\
  *   指定初始化器必须按照数据成员的声明顺序出现。编译器从左到右对它们进行评估。\n*   指定符必须是唯一的。在 C 中，你可以列出多次相同的指定符，这在\
  \ C++ 中似乎没有用处，并且只会引发诸如“该指定符类型的构造函数被调用了多少”等问题。\n*   在 C++ 中我们可以使用括号或等号初始化（brace-or-equal\
  \ initialization），而 `C` 只允许等号初始化（equal initialization）。\n*   当我们需要嵌套指定符时，需要使用等号或括号初始化（equal-or-brace\
  \ initialization）。\n\n请注意，无论我们是否使用指定初始化器，包围所有初始化器的大括号形成了一个括号初始化（braced initialization），这会禁止收缩转换（narrowing）。\n\
  \n## 括号初始化\n\n括号初始化的一个优势是它可以防止在编译时发生收缩转换。通过这样，我们不会意外丢失精度。\n\n第二个特性是它总是会执行默认初始化或零初始化。这意味着要么调用了对象及其子对象的默认构造函数，要么用零或等效值进行初始化。例如，指针\
  \ `0` 的等效值是 `nullptr`。\n\n括号初始化的第三个特性是它防止了最著名的“意外解析”（most vexing parse）问题。下面你将看到一个最著名的意外解析问题的示例。\n\
  \n```\nconst Point p1();\n```\n\n列表 8.5\n\n在这里，我们看到尝试使用括号初始化 `p1`。然而，编译器将其视为一个名为\
  \ `p1`、返回 `Point` 且不接受参数的函数声明。无法通过括号表达我们希望对象被默认或零初始化。\n\n在 `C` 中有效但在 `C++` 中不可行的元素之一，是为数组元素使用指定初始化器。\n\
  \n让我们回顾一下代码中可以使用的不同形式。我们复用 `Point` 并添加另一个聚合体 `NamedPoint`，它包含一个 `std::string` 和一个\
  \ `Point`。\n\n```cpp\nstruct Point {\n  int y;\n  int x = 2;  // 使用类内成员初始化\n  int\
  \ z;\n};\n\nstruct NamedPoint {\n  std::string name;\n  Point       pt;\n};\n\n\
  // B 使用指定初始化器初始化\nconst Point p0{3, 0, 4};\n\n// C 使用指定初始化器初始化所有成员\nconst Point\
  \ p1{.y = 3, .x = 0, .z = 4};\nconst Point p2{.y{3}, .x{0}, .z = 4};\n\n// D 使用指定初始化器初始化子集\n\
  const Point p3{.y = 3, .z = 4};\n\n// E 顺序与 Point 中定义的顺序一致将无法编译\n// const Point\
  \ p4{.x = 0, .y = 3, .z = 4};\n\n// F 指定初始化器出现多次，将无法编译\n// const Point p5{.y = 3,\
  \ .y = 4};\n\n// G 嵌套指定初始化器\nconst NamedPoint p6{.name = \"zero\", .pt{.y{0}, .z{0}}};\n\
  \n// H 外部层聚合体的指定初始化器\nconst NamedPoint p7{.name = \"zero\", .pt{0, 0, 0}};\n```\n\
  \n列表 8.6\n\n首先，这一次我们对 #A 中的成员 `x` 使用了默认成员初始化。我们记得自 `C++14` 以来，聚合体一直允许这样做。\n\n现在，我们的第一次初始化是\
  \ #B 中希望最不意外的 `p0`。在这里，我们没有使用指定初始化器初始化了聚合体。\n\n在 #C 中，我们首先使用等号通过指定初始化器初始化了 `p1`\
  \ 的所有成员。然而，我们也可以使用括号初始化，如 `p2` 所示。混合使用两种初始化形式也是可能的。\n\n接下来，在 #D 中，`p3` 使用指定初始化器仅初始化了其成员的子集。如果聚合体为其成员提供了默认值，这就会特别有帮助。在这种情况下，`x`\
  \ 通过默认成员初始化被初始化为 `2`。指定初始化器允许我们省略 `x`。\n\n在 #E 和 #F 中，我们看到了无法编译的示例。在 #E 的情况下，指定初始化器的顺序不匹配。在\
  \ #F 中，我们看到一个成员出现了两次。该代码将可以编译，但值是错误的。我的观点是，指定初始化器帮助我们*仅*列出所需的成员，并让其他成员使用它们的默认值。\n\
  \n最后，在 #G 中，我们查看嵌套的指定初始化器。因为我们从 `.name` 开始，所以我们需要对 `pt` 使用指定初始化器。如 #H 所示，我们初始化了所有成员。\n\
  \n### 8.2.3：使用指定初始化器初始化聚合体的子集\n\n新特性总是棒的，但通常会出现问题：现在，这个特性有什么好处？我可以用它做什么？在前面的章节中，我们已经看到它们可以帮助我们用默认初始化器初始化聚合体。让我们仔细看看这意味着什么。在前面的示例中，我们看到了\
  \ `p3`，它只初始化了 `y` 和 `z`，留下 `x` 使用默认成员初始化。你可能已经注意到，`p3` 是 `const` 的。如果没有指定初始化器来实现相同的结果，我们必须像这样写代码：\n\
  \n```cpp\nPoint p3{};\np3.y = 3;\np3.z = 4;\n```\n\n列表 8.7\n\n我们必须创建一个非 `const`\
  \ 版本的 `p3` 并初始化所需的成员。这样做，我们不仅丢失了 `const` 特性，而且也无法在全局作用范围内完全将此变量创建为 `static` 变量。当然，另一种解决方案是保留\
  \ `const` 特性，通过指定所有成员来重复默认成员初始化的值：\n\n```cpp\nconst Point p3{3, 0, 4};\n```\n\n\
  列表 8.8\n\n假设我们初始化聚合体的所有成员。在这种情况下，我们实现了与指定初始化器相同的结果，如列表 8.8 所示。所以这只有一个微小的优势。噢，等一下！你看到了吗？自然地，我将\
  \ `x` 初始化为 0，但默认成员初始化使用的是 2！现在正确的是什么？每当我们遇到这样的代码时，我们无法轻易判断。在这种情况下，我故意犯了错误。该代码将可以编译，但值是错误的。我的观点是，指定初始化器帮助我们*仅*列出所需的成员，并让其他成员使用它们的默认值。\n\
  \n### 8.2.4：在没有默认成员初始化的情况下使用指定初始化器初始化子集\n\n默认值是一个很好的后续问题。如果我没有作为默认成员初始化为 `x` 提供默认值，并在指定初始化器中省略该成员会怎样？像这样：\n\
  \n\n\n\n\n```cpp\nstruct Point {\n  int y;\n  int x;  // #A 无类内成员初始化\n  int z;\n\
  };\n\n// #B 使用指定初始化器初始化子集\nconst Point p3{.y = 3, .z = 4};\n```\n\n代码列表 8.9\n\n\
  `p3` 的 `x` 的值是多少？答案是，由于周围的大括号是花括号，我们正在查看花括号初始化（braced initialization），它确保了所有未命名的成员都通过默认初始化或零初始化进行初始化。由于我们使用了\
  \ `int`，在这里我们面对的是零初始化。即使使用了指定初始化器，我们也没有未初始化的成员。未命名成员在初始化后的值是否符合我们的预期，是另一个问题。\n\n\
  ## 返回值优化\n\n返回值优化（Return value optimization，简称 `RVO`）术语是指编译器的一项旧优化技术。请看下面的示例：\n\n\
  ```cpp\n// #A 类型既不可拷贝也不可移动\nstruct NonCopyableOrMoveable {\n  NonCopyableOrMoveable()\
  \ = default;\n  NonCopyableOrMoveable(const NonCopyableOrMoveable&) =\n    delete;\n\
  \  NonCopyableOrMoveable(NonCopyableOrMoveable&&) = delete;\n  NonCopyableOrMoveable&\n\
  \  operator=(const NonCopyableOrMoveable&) = delete;\n  NonCopyableOrMoveable&\n\
  \  operator=(NonCopyableOrMoveable&&) = delete;\n  ~NonCopyableOrMoveable()    \
  \       = default;\n};\n\nNonCopyableOrMoveable RVO()\n{\n  return {};  // #B 这是\
  \ RVO 发生的地方\n}\n\nvoid Use()\n{\n  // #C 返回对象直接在 myValue 创建\n  auto myValue = RVO();\n\
  }\n```\n\n代码列表 8.10 我们有一个结构体 `NonCopyableOrMoveable` #A，正如名称所示，由于我们删除了所需的特殊成员，它既不可拷贝也不可移动。然而，这段代码可以正常编译。原因是编译器执行了优化。编译器没有在函数\
  \ `RVO` #B 中在栈上创建返回对象，而是在返回对象被赋值的地方 #C 创建了它。这样就为我们节省了一个可能昂贵的赋值操作。从 C++17 开始，这种优化是强制性的。\n\
  \n### 得益于指定初始化器的返回值优化利用\n\n我们可以利用指定初始化器通过在 `return` 语句中创建对象来获得 RVO 的用处，如 #A 所示。\n\
  \n```cpp\nPoint GetThePoint()  // #A 利用 RVO 返回 Point\n{\n  return {.y = 3, .z =\
  \ 4};\n}\n```\n\n代码列表 8.11\n\n另一个应用是将元素推入 `std::vector` 或另一个 STL 容器。\n\n```cpp\n\
  auto GetVectorOfPoints()\n{\n  std::vector<Point> points{};\n\n  // #A 在容器中就地创建\
  \ Point\n  points.emplace_back(Point{.y = 5, .z = 6});\n\n  return points;\n}\n\
  ```\n\n代码列表 8.12\n\n#A 中的模式与 `return` 语句相同。得益于指定初始化器，我们可以在 `emplace_back` 调用中直接创建一个仅初始化了其部分成员的对象。\n\
  \n另一个额外的优点是可读性。通过显式地命名成员及其值，代码可以变得更具可读性且更不容易出错。\n\n### 8.2.5: C++ 中的命名参数：带有指定初始化器的聚合体\n\
  \n我们之前在 `const` 中看到的优势是，我们可以通过指定初始化器单条语句创建并初始化聚合体，这具有更多优势。之前，我只提到了让对象变为 `const`，但在单条语句中创建对象有益的地方还有更多。\n\
  \n考虑以下函数 `FileAccess`，它可以打开文件用于写入或仅用于读取，并可以关闭：\n\n```cpp\nvoid FileAccess(bool open,\
  \ bool close, bool readonly);\n\nvoid Use()\n{\n  FileAccess(true, false, true);\n\
  }\n```\n\n代码列表 8.13\n\n在列表 8.13 中，除了函数本身，我们看到了在 `Use` 中调用该函数的样子。我怀疑是否能看出哪个 `bool`\
  \ 是做什么用的，以及这里的值是否有意义。考虑一种代码审查的情况，你必须审查该代码并将其投入生产环境。有些编码风格要求你在值旁边用注释写出参数名。例如，LLVM\
  \ 就是这样做的。使用后的代码看起来如下：\n\n```cpp\nFileAccess(/*open*/ true, /*close*/ false, /*readonly*/\
  \ true);\n```\n\n代码列表 8.14\n\n编译器忽略注释。随着时间的推移，它们可能会出错。维护所有注释是具有挑战性的。如果我们不是提供三个 `bool`\
  \ 类型的参数，而是提供一个单一的 `FileAccess` 聚合体呢？那么：\n\n```cpp\nstruct FileAccess {\n  bool open;\n\
  \  bool close;\n  bool readonly;\n};\n\nvoid FileAccess(const FileAccess& params);\n\
  ```\n\n代码列表 8.15\n\n在调用端，我们当然可以传递一个我们创建的临时 `FileAccess` 对象。如下：\n\n```cpp\nFileAccess({.open\
  \ = true, .close = false, .readonly = true});\n```\n\n代码列表 8.16 代码变得清晰了。没有了必要的注释。使用带有指定初始化器的聚合体可以看作是\
  \ C++ 中命名参数的“廉价方案”。带有指定初始化器的聚合体是建模函数可选参数的一种很好的方法。对于默认参数，我们必须从左到右填充，无论我们是否想设置第一个。正如我们所见，我们可以省略聚合体的成员。这在这些情况下增加了灵活性。对于大量的参数，我认为带有指定初始化器的聚合体是一个很好的选择。然而，我还想在此指出，在到处使用强类型代替\
  \ `bool` 可以更增加你代码的健壮性。\n\n### 8.2.6: 重载解析与指定初始化器\n\nC++ 有一个而 C 没有的另一个特性是重载解析。当我们有一个接收聚合体的函数，并且决定只使用大括号而不显式命名类型时，就会发生这种情况。这里有一个说明这种情况的示例：\n\
  \n```cpp\nstruct Point2D {\n  int X;  // #A 注意这是一个大写的 X\n  int y;\n};\n\n// #B 两个重载函数\n\
  void Add(const Point& p, int v);\nvoid Add(const Point2D& p, int v);\n\nvoid Use()\n\
  {\n  Add({.X = 3, .y = 4}, 3);  // #C 正确，选择 Point2D\n  Add({.y = 4, .x = 3}, 3);\
  \  // #D 正确，选择 Point\n\n  // #E 因为只有 .y 将无法编译\n  // Add({.y = 4}, 3);\n}\n```\n\n\
  代码列表 8.17\n\n\n\n\n这里 `Point` 是一个包含三个成员 `y, x, z` 的结构体。这两个函数 `Add` #B 分别用于 `Point`\
  \ 或一个新的聚合体 `Point2D`。后者使用了大写的 `X` #A。如果我们现在如 #C 和 #D 所示使用三种不同的方式来调用 `Add`，它们会因为\
  \ `X` 和 `x` 的存在而正常工作。这有助于编译器解析我们指的是哪种类型。如果没有这种区分，如 #E 所示，重载将产生歧义。如果仅使用 `.y`（这作为指定初始化器是没问题的），编译器在调用\
  \ `Add` 时会发现 `Point` 和 `Point2D` 都是可能的创建类型。这是一个编译器无法解决的歧义。简单而言之，如果我们通过观察初始化就能区分是指哪种类型，编译器也可以。\n\
  \n这种行为发生的原因是，在重载解析期间，指定符的顺序并不重要。这就是为什么通过 `.x=3, .y=4` 开始并不能帮助我们告诉编译器想要创建一个 `Point2D`\
  \ 的原因。\n\n## 8.3: 聚合体的直接初始化\n\nC++20 使初始化变得稍微更加一致，尽管这仍然是一个可以迅速写满书籍的 C++ 话题。自 C++11\
  \ 以来，除了括号之外，我们在许多情况下都使用了大括号初始化。从那时起，关于使用哪种方式以及哪种方式最好一直存在争议。遗憾的是，大括号初始化也被统一初始化（uniform\
  \ initialization）。那时的梦想是为程序员提供一种可以取代所有其他形式且能处处使用的单一初始化形式。事实证明，这只是一个梦想。\n\n### 8.3.1:\
  \ 初始化形式：大括号或括号初始化\n\n大括号初始化具有防止收窄转换和执行默认或零初始化的优点。但它也有一些缺点。这里有一个常见的缺点：\n\n```cpp\n\
  std::vector<int> v1(35);  // #A 使用括号\nstd::vector<int> v2{35};  // #B 使用大括号\n```\n\
  \n列表 8.18\n\n在示例中，我们看到在 #A 中用括号在 #B 中用大括号尝试初始化 `std::vector`。第一次初始化创建了一个包含 35 个元素且全部设置为零的\
  \ `std::vector`。第二种形式创建了一个包含 1 个元素且值为 35 的 `std::vector`。我们可以得出，这与预期的程序流有细微差别。原因是大括号初始化也被称为列表初始化（list\
  \ initialization）。它具有触发接受 `std::initializer_list` 的构造函数的能力。`std::vector` 只是这种导致巨大混乱的例子之一，而且很难看透。\n\
  \n另一个稍微微妙一点的情况。我们已经玩过 `Point` 聚合体了。现在假设我们想创建一个 `Point` 类型的 `unique_ptr`。作为见多识程序员，我们知道总是使用\
  \ `std::make_unique`。好了，这对你来说可能有点无聊了，请再等我一分钟。以下是我预计你们都知晓并写过几十次的代码：\n\n```cpp\nauto\
  \ pt = std::make_unique<Point>(4, 5);\n```\n\n列表 8.19\n\n现在问题不是它是做什么的，而是它能编译吗？不要寻找遗漏的分号之类东西。C++\
  \ 语法是正确的。然而，你亲爱的编译器在预-C++20 模式下给出的答案是一个很漂亮但难以阅读的错误信息：\n\n```\nIn file included from\
  \ <source>:1:\ninclude/c++/v1/memory:2793:32: error: no matching constructor\n \
  \  for initialization of 'Point\n    return unique_ptr<_Tp>(new\n   _Tp(_VSTD::forward<_Args>(__args)...))\n\
  \                               ^   ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~\n<source>:11:18\
  \ note: in instantiation of ' function template\n   specialization 'std::make_unique<Point,\
  \ int, int>' requested\n   he\n  auto pt = std::make_unique<Point>(4, 5);\n    \
  \             ^\n<source>:3:8 note: candidate constructor (the implicit copy\n \
  \  constructor) not viable: requires 1 argument, but 2 were\n   provid\nstruct Point\
  \ {\n       ^\n<source>:3:8 note: candidate constructor (the implicit move\n   constructor)\
  \ not viable: requires 1 argument, but 2 were\n   provid\n<source>:3:8 note: candidate\
  \ constructor (the implicit default\n   constructor) not viable: requires 0 arguments,\
  \ but 2 were\n   provid\n1 error generated.\nCompiler returned: 1\n```\n\n这多次让我困惑，回想起我我又哪里做错了。这个错误是因为在内部初始化\
  \ `Point` 时，`make_unique` 使用了括号来初始化新创建的对象。你可以将其简化为以下行代码：\n\n```cpp\nconst auto*\
  \ pt = new Point(4, 5);\n```\n\n列表 8.20\n\n仅仅是 C++17 及之前的规则不允许对聚合体初始化使用括号，而我们这里正\
  \ 是一个聚合体。初始化列表中缺少括号使得编写通用的完美转发函数变得不再可能。\n\n#### 通用完美转发\n\n如果你想在预-C++17 编写一个通用的完美转发函数，你可以使用\
  \ `std::initializer_list`。然而，在 C++20 中，规则要灵活得多。\n\n```cpp\nstruct Point {\n  int\
  \ y;\n  int x;\n  int z;\n};\n\nstruct Point2D {\n  int X;\n  int y;\n};\n\nvoid\
  \ add(Point p) {}\nvoid add(Point2D p) {}\n\nint main() {\n  Point p1{.y=1, .x=2,\
  \ .z=3};\n  Point2D p2{.X=4, .y=5};\n  add(p1);\n  add(p2);\n  return 0;\n}\n```\n\
  \n\n\n在本章开头，我们看到了 C++20 中聚合体（aggregates）的定义，因此你可能对这个小节感到好奇。仔细的读者注意到，在 C++20 中，具有用户声明构造函数的\
  \ `struct` 或 `class` 以及 `union` 不再符合聚合体的定义。在这里面对的是一个破坏性变更。在 C++17 中，带有用户声明构造函数的类、`struct`\
  \ 或 `union` 被归类为聚合体。考虑以下代码，并记住我们讨论的是 C++17，即你现有的代码库：\n\n```cpp\nstruct NotDefaultConstructible\
  \ {\n  int x;\n\n  // #A 防止默认构造\n  NotDefaultConstructible() = delete;\n};\n```\n\
  \nListing 8.22\n\n`struct NotDefaultConstructible` 通过其名称以及 #A 中删除的默认构造函数向我们警告：这种类型的对象是可以默认构造的。名称和操作是一致的。编写此类代码的原因之一是防止用户在栈上创建未初始化的对象，并意图稍后正确初始化对象。然而，如果某个值被遗忘了，你就会花费一天或更多的时间去追踪一个不断发生细微变化的非常诡异的\
  \ bug，这取决于栈上的随机值。那是浪费时间。现在，在这样的追踪之后，我们想出了 `NotDefaultConstructible`。实际上，我们无法为所有类型都起这个名字，但我喜欢在这里稍作夸大。比类型名称更重要的是\
  \ #A 中那个被删除的默认构造函数。下面是两种在栈上不显式初始化 `x` 的情况下创建 `NotDefaultConstructible` 类型对象的尝试。看看它并回答问题：你认为\
  \ #C 会发生什么？\n\n```cpp\n// NotDefaultConstructible ndc1; // #B 这条语句的编译不符合预期\n\n//\
  \ #C 你认为这条语句会发生什么？\nNotDefaultConstructible ndc2{};\n```\n\nListing 8.23\n\n举手来，谁认为\
  \ `ndc2` 理应不通过编译？我们已经竭尽全力地让它在编译时失败，那么可能会出什么错呢？嗯，根据 C++17 的聚合体规则，列表初始化找到了一种默认初始化\
  \ `ndc2` 的方法。但等一下，你可能会说总有一个 C++98 的技巧可以将特殊成员设为 `private`。下面的代码现在一定无法编译了，对吧？\n\n\
  ```cpp\nstruct NotDefaultConstructible {\n  int x;\n\nprivate:\n  // #A 防止默认构造\n\
  \  NotDefaultConstructible() = delete;\n};\n\n// NotDefaultConstructible ndc1; //\
  \ #B 这条语句的编译不符合预期\n\n// #C 你认为这条语句会发生什么？\nNotDefaultConstructible ndc2{};\n```\n\
  \nListing 8.24\n\n那么，你真的认为它无法编译吗，还是说这更像是一个愿望？是后者。即使有了删除的 `private` 构造函数，#C 仍然初始化了\
  \ `ndc2`。为什么呢，你问。因为在 C++17 中，聚合体的列表初始化可以跳过被删除的构造函数。我不免你去读整个规则了。听我的吧，事实就是如此。类型名称对编译器来说不重要这一点是肯定的，但我们尝试删除默认构造函数的做法对于括号初始化有效而对于列表初始化却无效，这简直太不凑了。这种\
  \ C++17 的行为在我之前的培训课程中引起过许多惊讶的表情或笑声。\n\n这种行为尤为不幸，因为标准曾规定每个人都应该使用列表初始化（也称为统一初始化），它应该是总是有效的。嗯，从某些角度来看，我们可以说它在\
  \ C++17 中确实有效了。C++20 擅自修复了这个诡异的案例，但这是不向后兼容的。如果你在代码库中意外有这样的代码，它将在 C++20 中停止工作，并且将得到编译错误。\n\
  \nC++20 让两种初始化形式产生相同的结果更具一致性。此外，C++20 缩小了括号初始化和列表初始化之间的差距。实现方法是：`NotDefaultConstructible`\
  \ 类型在 C++20 中不再是聚合体。\n\n## 8.4: 聚合体的类模板参数推导\n\n### C++17: 类模板参数推导\n\nCTAD 是 C++17\
  \ 引入的一项特性，它允许编译器像推导函数模板参数一样推导类模板参数。在下面的列表中，我们可以在不自己指定 vector 类型的情况下创建一个 `std::vector`。编译器根据提供的初始化\
  \ `std::vector` 的参数来推断类型：\n\n```cpp\n// #A 在不指定类型的情况下使用 std::vector\nconst std::vector\
  \ a{2, 3, 4};\n```\n\nListing 8.25\n\n想象一种你正在使用 POSIX 函数的情况。假设我们想 `open` 一个文件。`open`\
  \ 调用可能会因为各种原因失败，包括文件不存在或进程没有打开权限。所有这些条件都通过返回值来信号，如果 `open` 调用失败，返回值为 `-1`，否则返回一个有效的描述符。由于自\
  \ C++11 起 `errno` 是线程安全的，我们 ist 必须检查全局变量 `errno`。一种方法是提供一个包含 `errno` 和一个持有返回值的聚合体。让我们把这个聚合体称为\
  \ `ReturnCode`。\n\n```cpp\nstruct ReturnCode {\n  int returnCode;\n  int err;\n\
  };\n\nauto Open(std::string_view fileName) {\n  return ReturnCode{open(fileName.data()),\
  \ errno};\n}\n```\n\nListing 8.26\n\n这看起来不错。现在我们已经有了针对 POSIX `open` 的抽象，让我们为 `read`\
  \ 也创建一个吧。`read` 的接口与 `close` 非常相似，区别在于它接收的是文件描述符而不是文件名，以及一个用于读取数据的缓冲区。噢，还有一点区别，`open`\
  \ 的返回类型是 `ssize_t` 而不是 `int`。后者可能比前者大。为了这里的类型安全，我们需要另一个用于 `read` 的聚合体。如果我们进一步观察，例如对于\
  \ `lseek`，我们发现了另一个返回类型 `off_t`。当然，我们可以为每个函数创建一个新的聚合体，但一个更通用的方法会更好。让我们让 `ReturnCode`\
  \ 中的返回值变为类型模板参数，并借此使 `ReturnCode` 成为模板。变化很容易：\n\n```cpp\ntemplate<typename T>\n\
  struct ReturnCode {\n  T   returnCode; // #A 让返回码类型泛化\n  int err;\n};\n\nauto Open(std::string_view\
  \ fileName) {\n  // #B 我们需要指定模板参数的类型\n  return ReturnCode<int>{open(fileName.data()),\
  \ errno};\n}\n```\n\nListing 8.27\n\n虽然变化本身很容易，但你可以在 Listing 8.27 中看到额外的变化。我们现在需要指定该模板参数的类型。如果不这样做，就会得到来自编译器的以下错误：\n\
  \n\n\n\n```\n<source>:18:10: error: no viable constructor or deduction guide\n \
  \  for deduction of template arguments of 'ReturnCode\n  return ReturnCode{open(fileName),\
  \ errno};\n         ^\n<source>:10:8: note: candidate function template not viable:\n\
  \   requires 1 argument, but 2 were provide\nstruct ReturnCode {\n       ^\n<source>:10:8:\
  \ note: candidate function template not viable:\n   requires 0 arguments, but 2\
  \ were provide\n1 error generated.\nASM generation compiler returned: 1\n<source>:18:10:\
  \ error: no viable constructor or deduction guide\n   for deduction of template\
  \ arguments of 'ReturnCode\n  return ReturnCode{open(fileName), errno};\n      \
  \   ^\n<source>:10:8: note: candidate function template not viable:\n   requires\
  \ 1 argument, but 2 were provide\nstruct ReturnCode {\n       ^\n<source>:10:8:\
  \ note: candidate function template not viable:\n   requires 0 arguments, but 2\
  \ were provide\n1 error generated.\nExecution build compiler returned: 1\n```\n\n\
  显式指定类型无疑是一种方法，但如果我们考虑到泛型代码，其中该类型可能会随平台 `open` 等等实现而变化，那么在包装器中命名该类型并不是我想要的。我们寻找的是一种简单的解决方案，因此不使用\
  \ `decltype`。这是 CTAD（类模板参数推导）的用场景。我们可以编写自己的“推导引导”（deduction guide），它告诉编译器如何推导类型。错误信息显示编译器已经提到了推导引导。这有助于编译器执行与处理函数模板时完全相同的操作。在那种情况下，编译器可以自动推导函数模板参数。编译器可以为简单的情况和类生成所谓的隐式推导引导。这让我们作为用户操作起来更容易。大多数情况开箱即用。然而，在这种情况下，我们使用的是一个聚合体（aggregate），而\
  \ C++17 中的 CTAD 仅自动适用于类。以下是一个带有用户提供的推导引导的 C++17 版本：\n\n```cpp\ntemplate<typename\
  \ T>\nstruct ReturnCode {\n  T   returnCode;\n  int err;\n};\n\n// 一个推导引导\ntemplate<typename\
  \ T>\nReturnCode(T, int) -> ReturnCode<T>;\n\nauto Open(std::string_view fileName)\n\
  {\n  // B 不需要指定类型即可\n  return ReturnCode{open(fileName.data()), errno};\n}\n```\n\
  \n列表 8.28\n\n现在我们可以省略类型了，正如你在 #A 中所示。这使得整个结构更具通用性。\n\n### C++17：类模板参数推导引导\n\n推导引导告诉编译器如何实例化类模板。它是编译器需要执行的类模板参数推导的提示，就像它在\
  \ C++17 之前对函数模板参数所做的那样。语法如下：\n\n```cpp\nTypeName(Parameters) -> TypeName<Parameters>\n\
  ```\n\n我省略了模板头部以更具可读性。你可以像读取带有尾随返回类型的函数声明一样读取它。或者你可以将第一部分视为类的构造函数，它通过箭头告诉在按给定的参数集调用构造函数时，如何实例化该类。\n\
  \n然而，我们需要编写这种显式推导引导这一点与类不同。让我们尝试一个练习。不再使用聚合体，而是使用一个带有私有成员的类并提供一个构造函数。为了完整起见，我们还提供了现在必要的访问函数：\n\
  \n```cpp\ntemplate<typename T>\nstruct ReturnCode {\n  ReturnCode(T t, int e)\n\
  \  : returnCode{t}\n  , err{e}\n  {}\n\n  auto GetReturnCode() const { return returnCode;\
  \ }\n  int  GetReturnno() const { return err; }\n\nprivate:\n  T   returnCode;\n\
  \  int err;\n};\n\nauto Open(std::string_view fileName)\n{\n  // B 不需要指定类型即可\n \
  \ return ReturnCode{open(fileName.data()), errno};\n}\n```\n\n列表 8.29\n\n我们需要编写这种显式推导引导这一点与类不同。让我们尝试一个练习。不再使用聚合体，而是使用一个带有私有成员的类并提供一个构造函数。为了完整起见，我们还提供了现在必要的访问函数：\n\
  \n（注：原文中存在大量重复的段落，已根据要求“不要重复输出原文”进行去重处理）\n\n\n\n\nNTTP（非类型模板参数）是将值作为模板参数提供的形式。数字是参数化模板的常用方法。下面你将看到一个同时使用类型和非类型模板参数的示例。该示例展示了你在标准库的\
  \ `std::array` 中熟悉的简短版本。\n\n```cpp\ntemplate<typename T,  // #A 一个类型模板参数\n     \
  \    size_t N>    // #B 一个非类型模板参数\nstruct Array {\n  T data[N];\n};\n\nArray<int,\
  \  // #C 将 int 作为类型参数传递\n      5>    // #D 将 5 作为非类型参数传递\n  myArray{};\n```\n列表\
  \ 9.1\n\n此示例展示了一个类模板 `Array`，它接受一个类型模板参数和一个非类型模板参数。`Array` 使用这两个参数来创建一个类型为 `T` 长度为\
  \ `N` 的数组。在 #C 中，我们将 `int` 作为类型参数传递。在这里，我们只允许传递类型。然后，在 #D 中，我们将 `5` 作为 NTTP 传递。正如我们看到的，这是一个值，或者更准确地说是一个常量。由于模板在编译期间实例化，因此传递给它们的所有参数必须在编译时是知的。\n\
  \n由于本章中不需要模板的模板参数，因此我在这里跳过对它们的解释。\n\n## 9.2: 作为非类型模板参数的类类型的类型\n\nNTTP 必须是一个常量。在\
  \ C++20 之前，我们可以使用整数类型或枚举类型。这两者在编译时都是已知的值。对象的指针或函数的指针也是允许的。这些对象以及它们的指针在编译时是知的。我们还可以传递对象或函数的引用。对于第一种情况，对象必须具有\
  \ `static` 存储 duration。`std::nullptr_t` 也是允许的。在 C++20 之前，缺失的形式是浮点数和类。\n\n限制的原因是编译器需要比较两个模板实例化并确定它们是否相等。\n\
  \n随着时间的推移和技术的改进，现在为编译器厂商在类模板名称中编码浮点数是可行的。对于我们程序员来说，这意味着我们现在可以像以前使用 `int` 一样使用浮点数作为\
  \ NTTP。\n\n多年来保留的原因之一是为了确定两个模板参数何时等效。这种等效性对于判断两个模板实例化是否相同是关重要的。对于整数，这种相等性与浮点数相比很简单。两个整数如果具有相同的值，它们就相等。对于整数，相同的值总是意味着相同的位模式。这与浮点数是不同的。差异始于浮点数可以表示的正零和负零。此外，浮点数是近似值。在某些情况下，如果通过不同的方式计算，值会略有不同。例如：![\
  \ 0.6 - 0.2 \\neq 0.4 ](img/file17.svg)\n\n此外，浮点数还可以表示无穷和 NaN（非数字）。复杂的是并不是一个单一值表示\
  \ NaN。多个值可以表示 NaN。另一方面，无穷可以是正的或负的，所以是两个不同的值。浮点数的所有属性使得将它们作为模板参数并获得关于两个模板实例化是否相等的统一答案变得困难。一个例子是数字零，它可以是正或或负。假设你的应用程序根据符号推导出操作，那么符号就很重要，即使对于数字零也是如此。\n\
  \nC++ 中浮点模板参数的定义现在是：如果两个参数的值相同，则认为它们等效。在这种情况下，值意味着位模式。这里是一些示例：\n\n```cpp\ntemplate<double\
  \ x>\nstruct A;  // #A 使用 double 作为 NTTP 的类型\nstatic_assert(not std::is_same_v<A<0.6\
  \ - 0.2>, A<0.4>>); // #B 不同的位模式导致不同的类型\nstatic_assert(not std::is_same_v<A<0.0>,\
  \ A<-0.0>>); // #C 不同的位模式导致不同的类型\nstatic_assert(+0.0 == -0.0); // #D IEEE 754 说它们是等的\n\
  static_assert(std::is_same_v<A<0.1 + 0.1>, A<0.2>>); // #E 位模式\n```\n列表 9.2\n\n\
  在顶部的 #A，我们声明了一个用于比较的模板类型。在 #B 中，我们看到了相同的示例，`0.6 - 0.2` 不等于 `0.4`。`static_assert`\
  \ 配合我们的模板类型 `A` 验证了这一点。#C 中的负零和正零也是如此。它们有不同的位模式和值。在 #E 中，我们看到如果两个计算产生相同的值，它们被认为具有相同的位模式是恒等的。\n\
  \n在使用浮点类型作为 NTTP 时请记住这一点。\n\n## 9.3: 作为非类型模板参数的类类型\n\n现在我们可以使用类类型作为 NTTP 了，让我们看看可以用它们做哪些很棒的新事物。我们需要一个字面量类型（literal\
  \ type），或者在我们的情况下更合适的是字面量类（literal class）。如果一个类具有以下条件，它就是字面量类：\n* `constexpr` 析构函数。从\
  \ C++20 开始，隐式析构函数是 `constexpr`；\n* 至少一个不是拷贝或移动构造函数的 `constexpr` 构造函数。闭包类型（closure\
  \ type）或没有构造函数的聚合体（aggregate）也是可能的；\n* 只有非 `volatile` 非 `static` 数据成员。\n\n我们可以通过一个包含\
  \ `char` 数组并具有初始化该数组的 `constexpr` 构造函数的类来满足这些要求。例如：\n\n```cpp\nstruct fixed_string\
  \ {\n  char data[5]{};\n  constexpr fixed_string(const char* str)\n  {\n    std::copy_n(str,\
  \ 5, data);\n  }\n};\n```\n列表 9.3\n\n类型 `fixed_string` 是一个字面量类型。然而，我们可以说 `fixed_string`\
  \ 是一个相当不可用的类型。如所示，数组的大小是固定的。构造函数获取参数的方式让我们无法检查提供的字符串是否小于我们的 `5 char` 数组。虽然这是一个字面量类的例子，结果是非常不可用且不安全的。\n\
  \n### 9.3.1: 类类型作为 NTTP 的首次接触\n\n为了使 `fixed_string` 可用，我们需要将类型本身变成模板。我们仍然可以提供作为\
  \ NTTP 的字面量类。这仍在规则范围内。这个版本如何：\n\n```cpp\ntemplate<typename CharT, std::size_t N>\n\
  struct fixed_string {\n  CharT data[N]{};\n  constexpr fixed_string(const CharT\
  \ (&str)[N])\n  {\n    std::copy_n(str, N, data);\n  }\n};\n```\n列表 9.4\n\n这看起来好多了。得益于编译器，我们的\
  \ `fixed_string` 现在可以推导出我们在构造函数中传递的数组的类型和大小。一个潜在的 `fixed_string` 初始化可以是：\n\n```cpp\n\
  fixed_string fs{\"Hello, C++20\"};\n```\n列表 9.5\n\n我们学习到了由于 CTAD #8，我们不需要更多的代码。编译器决定如何实例化\
  \ `fixed_string` 对象。\n\n现在我们有了基准。让我们看看新部分并将 `fixed_string` 作为 NTTP 传递给模板。我们使用一个名为\
  \ `FixStringContainer` 的类模板，它接受一个 `fixed_string` 并包含一个方法 `print`。猜猜怎么着？这个方法会打印字符串的内容。\n\
  \n\n\n\n\n```cpp\ntemplate<fixed_string Str>  // #A 这里我们有一个 NTTP（非类型模板参数）\nstruct\
  \ FixedStringContainer {\n  void print()\n  {\n    std::cout << Str.data << '';\
  \ // #B 使用 Str\n  }\n};\n\nvoid Use()\n{\n  // #C 我们可以用字符串来实例化模板\n  FixedStringContainer<\"\
  Hello, C++\"> fc{};\n  fc.print();  // #D 为那些只有眼见为实的人准备的\n}\n```\n\n列表 9.6\n\n在\
  \ #A 中，我们看到了一个 NTTP。而且第一次，这个 NTTP 是一个类。我们可以像使用其他 NTTP 一样，在 `FixedStringContainer`\
  \ 内部使用 NTTP `Str`。`Str` 感觉就像存在于 `FixedStringContainer` 内部的一个变量。\n\n我们可以像 #C 所示直接创建一个\
  \ `FixStringContainer` 类型的对象。在角括号之间看到字符串可能感到陌生。最后，在 #D 中，调用了 `print` 函数并打印了字符串。现在，这展示了编译时和运行时的有趣的混合。虽然\
  \ NTTP `Str` 是在编译时提供的，但我们稍后在运行时通过 `print` 访问模板的内容。\n\n在转向关于 `fixed_string` 良好使用的真实世界示例之前，我首先想简要谈一下编译时数据。\n\
  \n### 9.3.2: 我们拥有哪些编译时数据\n\n我经常被问到为什么要把东西设为 `constexpr`。这些问题来自那些了解并理解了 `constexpr`\
  \ 基础的人。他们知道编译器可以在某些地方在编译时评估构造函数，并借此在编译时设置好整个对象。问题不在于这些细节，人们问的是在何处应用 `constexpr`。有些人说，如果一切都是\
  \ `constexpr` 且编译器在编译时对其进行求值，那么我们永远不需要运行那个程序。我们已经有了答案。这完全正确。我们永远不会遇到这种情况。这就是为什么人们在寻找\
  \ `constexpr` 变得意义的场景。\n\n在寻找可以有意义地应用 `constexpr` 的地方时，我们通常会得到宏的类型安全替代方案。常量的计算是另一个例子。有时，这会导致整个对象在编译时创建。人们似乎经常忽略的一点是，根据我的经验，我们代码中存在的所有数据，有时这些数据直接就在那里。没有经过计算。我们已经看到了多个此类情况。§5\
  \ 章](#ch013.xhtml_id_5-stdformat-modern-&-type-safe-text-formatting) 中所有的格式化字符串都是编译时可用数据的示例。让我们以增加价值的方式使用这些数据。\n\
  \n## 9.4: 构建一个带有说明符计数的格式化函数\n\n长期以来，我想要一种类型安全的格式化或打印函数，它可以在编译时检查说明符的数量是否与参数的数量匹配。我喜欢构建这样的函数。\n\
  \n为什么要在编译时？因为编译时是最好的地方！在运行时，我们必须确保测试用例覆盖了 `print` 函数的所有用法。尽管 `std::format` 非常优秀，但目前的设计是在运行时检查，并通过抛出异常来确认错误。我喜欢尽可能避免异常，而是尽早地发现这些错误。\n\
  \n有了 `fixed_string`，我们已经为带有静态说明符检查的 `print` 函数打下了良好的基础。\n\n构建这样的函数需要什么？类似于我们之前在\
  \ `FixStringContainer` 中看到的东西，以及一个计算标识符的函数。为了让这个实现适合书籍内容，我们使用了一些简化。我们假设以百分号开头的类似\
  \ `printf` 的标识符。我们进一步定义格式化字符串没有转义字符。有了这些要求，我们可以构建下面的类模板 `FormatString`：\n\n```cpp\n\
  template<fixed_string Str>  // #A 将固定字符串作为 NTTP\nstruct FormatString {\n  // #B\
  \ 存储字符串以便于访问\n  static constexpr auto fmt = Str;\n  // #C 使用 ranges 统计所有的百分号。\n\
  \  static constexpr auto numArgs =\n    std::ranges::count(fmt.data, '%');\n  //\
  \ #D 为了易用性提供转换运算符\n  operator auto() const { return fmt.data; }\n};\n```\n\n列表 9.7\n\
  \n在这几行代码中我们得到了什么？首先，我们再次在 #A 中看到作为 NTTP 的 `fixed_string`。然后，类模板 `FormatString` 以\
  \ `static constexpr` 变量的形式作为静态成员存储一个 `fixed_string` 实例，如 #B 所示。由于简化了说明符的规范，我们获取字符串中提供的说明符数量只需要计算百分号的数量。还有什么比使用\
  \ STL 算法更好的呢？你觉得使用 ranges 听起来也如何？那么，那我们就使用它们。正如我们在 #C 中所示，`numArgs` 计算了字符串中百分号的数量。\n\
  \n我们看到了一些目前不重要、但为了易用性的东西：转换运算符，如 #D 所示。这是一个很好的基础。现在，`print` 函数看起来是什么样的？\n\n### 9.4.1:\
  \ 第一个 `print` 函数\n\n我们的 `print` 函数必须是一个变变函数模板，这是肯定的。`print` 像往常一样将格式化字符串作为第一个参数。只是在我们的情况下，它不是\
  \ `const char*` 类型，而是 `FormatString`。该格式字符串后面跟着可选参数。为了方便我们的工作，我们使用了 Concepts 中的缩写函数语法，并用\
  \ `auto` 声明第一个参数。我们在第 1 章](#ch013.xhtml_id_1) 中见过这些。否则，我们必须编写推导 `FormatString` 的代码。然后，在\
  \ `print` 内部我们直接调用 `printf`。`print` 如下所示：\n\n```cpp\nvoid print(auto fmt, const\
  \ auto& args)\n{\n  printf(fmt, args...);\n}\n```\n\n列表 9.8\n\n在 9.8 节 中，我们现在可以看到\
  \ `FormatString` 转换为 `const char*` 的转换运算符。如果没有转换运算符，我们必须传递 `fmt`。使用 `print` 看起来如下：\n\
  \n```cpp\nprint(FormatString<\"%s, %s\">{}\", \"Hello\", \"C++20\");\n```\n\n列表\
  \ 9.9\n\n除了到目前为止只写了一些还没有改进任何内容的代码之外，我们现在向 `print` 传递格式化字符串还需要输入更多内容。这很烦恼。改进是好的，但如果它们带来了太多的复杂性，就没那么理想。一直编写\
  \ `FormatString` 对象的创建就是一种复杂性。所以在继续其他事情之前，让我们先找出是否可以改进这一点。否则，我们的解决方案可能不会被用户接受。\n\
  \n### 9.4.2: 优化格式化字符串的创建\n\n，一个明显的解决方案是将 `FormatString` 名称缩短为一个或两个字母的类型名称。这确实可行，但很有可能与具有相同缩短需求的类型发生冲突。不，我们不这样做。名称携带了信息。我们不喜欢在调用侧看到并输入这些信息。\n\
  \n自 C++11 起有一个更好的解决方案可用，得益于 C++20 的改进，这种解决方案在这里是可用的。我谈论的是 UDL。`_fs` 似乎是一个合适的短用户自定义字面量（UDL）。\n\
  \n#### C++11: 用户自定义字面量\n\n用户自定义字面量允许自 C++11 起在数据后面后一个用户自定义字面量。这会导致对特殊运算符 `operator\"\
  \" _myLiteral` 的调用，该运算符会转换或构造对象。它们只作用于数字或字符等常量。\n\n```cpp\ntemplate<fixed_string\
  \ Str>\nconstexpr auto operator\"\" _fs()\n{\n  return FormatString<Str>{};\n}\n\
  ```\n\n列表 9.10\n\n\n\n\n在这里，我们可以看到我们再次使用了新能力将类类型作为 NTTP（非类型模板参数）。对于 UDL `_fs`，我们定义了一个模板运算符，它接收一个\
  \ `fixed_string` 并返回 `auto`。在运算符内部，我们返回一个 `FormatString` 的新实例，它获取了作为模板参数传递的 NTTP\
  \ `Str`。\n\n```\nprint(\"%s, %s\"_fs, \"Hello\", \"C++20\");\n```\n\nListing 9.11\n\
  \n这看起来好多了。长类型名消失了，大括号也消失了。使用 UDL 的解决方案现在看起来可以展示给用户的代码。到目前为止，一切良好。接口看起来很好。现在，让我们看看如何添加增值部分。\n\
  \n### 9.4.3: 检查格式字符串中的说明符数量\n\n通过 `FormatString` 配合 UDL，我们现在有了 `_fs`，这是一个创建此类对象的极佳方式，并通过\
  \ `print` 这是一个接收该对象以及格式参数的变变模板。通过 `FormatString` 中的 `numArgs`，我们已经拥有了该对象中格式说明符的数量。是时候使用这些信息了。对于这种编译时检查，还有比\
  \ `static_assert` 更好的选择呢：\n\n```cpp\nvoid print(auto fmt, const auto&... args) {\n\
  \  // #A 使用参数计数并与包的大小比较\n  static_assert(fmt.numArgs == sizeof...(args));\n\n  printf(fmt,\
  \ args...);\n}\n```\n\nListing 9.12\n\n在 #A 中，我们看到一个 `static_assert` 使用了 `FixedString`\
  \ 中的静态成员 `numArgs`，并将 `numArgs` 与 `print` 参数包中的元素数量进行比较。为什么这个检查有效，而在 `static_assert`\
  \ 中直接传递字符串却无效呢？如你所见，`fmt` 是一个函数参数。你可能也知道参数永远不是 `constexpr` 的。因此，它们不能在 `static_assert`\
  \ 中使用。然而，我声称 Listing 9.12 中的代码是可以编译的。代码之所以编译是因为 `fmt` 看起来像是一个函数参数，没错，它确实是一个，但在 `static_assert`\
  \ 中，我们没有使用参数的运行时值。我们使用的是参数类型的静态成员！这就是区别所在。你可以将 `fmt` 的静态成员与 type-traits 中的静态信息（如\
  \ `value` 或 `type`）进行比较。由于 `FormatString` 的设计，我们需要的所有信息都存储为 `static constexpr` 值。这是这种方法的奇妙之处！它看起来像一个函数参数，可以像函数参数一样传递。尽管如此，它包含了可以在\
  \ `static_assert` 中使用的静态数据成员。这种技术并不新鲜。正如我指出的，它与 type-traits 是一样的。棒的地方在于我们可以将这种 C++20\
  \ 中的现有技术与字符串结合。但在我太兴奋之前，让我们继续。\n\n### 9.4.4: 检查类型和说明符是否匹配\n\n虽然上一节的成就已经非常出色（至少在我看来是这样），但我们还可以做得。从\
  \ `std::format` 中我们知道验证给定的说明符是否带有匹配的类型是可能的。我们的 `print` 函数也应该有这个检查。\n\n在这里再次采取简单的方法，使示例符合本章内容。编写检查首先需要编写一个辅助函数，它知道哪个说明符属于哪种类型。有更好的方法来实现这一点（不需要在单个函数中写得那么静态化），但我在这里展示的内容能让你有一个直观的认识。\n\
  \n```cpp\ntemplate<typename T, typename U>\nconstexpr bool plain_same_v =  // #A\
  \ 用于剥离类型的辅助 type-trait\n  std::is_same_v<std::remove_cvref_t<T>,\n             \
  \    std::remove_cvref_t<U>>;\n\ntemplate<typename T>\nconstexpr static bool match(const\
  \ char c) {\n  switch(c) {  // #B 我们的说明符到类型映射表\n    case 'd': return plain_same_v<int,\
  \ T>;\n    case 'c': return plain_same_v<char, T>;\n    case 'f': return plain_same_v<double,\
  \ T>;\n    case 's':  // #C 字符稍微复杂\n      return (plain_same_v<char,\n         \
  \                  std::remove_all_ext_t<T>>); // 注意：逻辑与原文保留\n      // (switch 的剩余逻辑)\n\
  }\n```\n*等等，match 函数的源代码在行间是碎片化的。让我仔细地重新格式化提供的代码块：*\n\n```cpp\ntemplate<typename\
  \ T, typename U>\nconstexpr bool plain_same_v =  // #A 用于剥离类型的辅助 type-trait\n  std::is_same_v<std::remove_cvref_t<T>,\n\
  \                 std::remove_cvref_t<U>>;\n\ntemplate<typename T>\nconstexpr static\
  \ bool match(const char c) {\n  switch(c) {  // #B 我们的说明符到类型映射表\n    case 'd': return\
  \ plain_same_v<int, T>;\n    case 'c': return plain_same_v<char, T>;\n    case 'f':\
  \ return plain_same_v<double, T>;\n    case 's':  // #C 字符稍微复杂\n      return (plain_same_v<char,\n\
  \                           std::remove_all_ext_t<T>>);\n// ...\n```\n*修正：我将遵循源代码提供的代码块。*\n\
  \n```cpp\ntemplate<typename T, typename U>\nconstexpr bool plain_same_v =  // #A\
  \ 用于剥离类型的辅助 type-trait\n  std::is_same_v<std::remove_cvref_t<T>,\n             \
  \    std::remove_cvref_t<U>>;\n\ntemplate<typename T>\nconstexpr static bool match(const\
  \ char c) {\n  switch(c) {  // #B 我们的说明符到类型映射表\n    case 'd': return plain_same_v<int,\
  \ T>;\n    case 'c': return plain_same_v<char, T>;\n    case 'f': return plain_same_v<double,\
  \ T>;\n    case 's':  // #C 字符稍微复杂\n      return (plain_same_v<char,\n         \
  \                  std::remove_all_ext_t<T>>);\n// ...\n```\n\n\n\n```cpp\ntemplate<typename...\
  \ Args>\nvoid print(auto fmt, const Args&... ts)\n{\n  // #1 使用参数计数并与参数包的大小进行比较\n\
  \  static_assert(fmt.numArgs == sizeof...(Args));\n\n  // 无法传递 ts... 因为那是运行时的值\n\
  \  static_assert(\n    IsMatching<std::decay_t<decltype(fmt.fmt.data[0])>,\n   \
  \            Args...>(fmt.fmt.data));\n\n  printf(fmt, ts...);\n}\n```\n\nListing\
  \ 9.16\n\n如你所见，格式化类型匹配检查（specifier-matches-type-check）是通过第二个 `static_assert` 完成的。那个\
  \ `static_assert` 读起来有点困难。首先，当我们调用 `IsMatching` 时，我们需要获取 `fixed_string` 的基础类型。但这次，通过\
  \ `fmt` 我们并无法直接获取类型。我们需要使用 `decltype` 来获取 `FormatString` 中 `fixed_string` 第一个元素的类型。然后，我们需要再次从类型中剥离限定符和数组属性。这就是我们在\
  \ #C 中看到的部分。例如，如果我们直接采用 `char` 作为类型，就可以省去这些步骤。然而，我选择了使用通用方法。在确定类型后，我们在 #D 中将展开的格式参数包传递给\
  \ `IsMatching`。最后，我们将 `fixed_string` 数据传递给 `IsMatching`。我们之所以不将展开的格式参数作为函数参数提供，是因为参数是运行时值。然而，它们的类型不是。记住，此时这一切都关乎类型而不是内容。\n\
  \n恭喜你，我们有了一个 `print` 函数，它可以在编译时检查：\n\n- 格式化符的数量与参数的数量匹配；\n- 所有的格式化符都与对应的提供的参数匹配。\n\
  \n如果我们弄错了，编译器会提供即时帮助。这种解决方案还有另一个好处：我们现在不再需要为每个使用 `print` 的函数编写用例，来检查特定参数集的调用是否会抛出异常。得益于编译时部分，每当使用\
  \ `print` 时，任何地方都会自动进行检查。编译器在实例化 `print` 时必须这样做。当然，这并不意味着你应该停止编写单元测试。\n\n### 9.4.5:\
  \ 启用更多用例并防止错误\n\n我们目前拥已经非常棒了。只是在更大的项目中，可能需要提供来自（例如）`char` 缓冲区的格式字符串，或者人们尝试使用 `const\
  \ char*` 调用 `print`。在目前的实现中，这两种情况都可能导致难以解释的编译错误。让我们改进这一点。我们从较简单的开始，为 `char` 缓冲区提供\
  \ `print`。这对于格式字符串在运行时创建的情况非常有用。\n\n```cpp\nvoid print(char* s, const auto&... ts)\n\
  {\n  printf(s, ts...);\n}\n```\n\nListing 9.17\n\n这里没什么特别的。我们只是为 `print` 提供了一个重载，同样是一个将所有数据直接传递给\
  \ `printf` 的变变模板。我们需要简短思考的部分是，对于该 `print` 重载，我们接受什么种类型的格式字符串？如你在列表 [9.17] 中所示，`print`\
  \ 接受 `char*`。此时，我们假设所有运行时创建的格式字符串都不是 `const`。\n\n下一步是实现另一个重载，以处理人们忘记为我们的 UDL 添加\
  \ `_fs` 的情况。我们喜欢通过有用的错误信息来防止这些意外。以下是我选择的实现方式。\n\n```cpp\n// #A 辅助工具，始终返回 false\n\
  template<typename...>\nconstexpr bool always_false_v = false;\n\ntemplate<typename...\
  \ Ts>\nvoid print(const char* s, const Ts&...)\n{\n  // #B 每当此模板实例化时，使用辅助工具触发断言\n\
  \  static_assert(always_false_v<Ts...>, \"Please use _fs\");\n}\n```\n\nListing\
  \ 9.18\n\n在 #A 中，我们看到了辅助变量模板 `always_false_v`，我希望 `STL` 中也有它。`always_false_v` 确保无论我们传递什么种类型的模板参数，该变量都会被设置为\
  \ false。\n\n`print` 重载同样是一个变变模板，接收 `const char*`。此时，我们假设所有运行时创建的格式字符串都不是 `const`。\n\
  \n\n\n\n这引导我们尝试方法 #C，其中对 `pi` 的指针使用 `reinterpret_cast` 并稍后对结果进行解引用。坏处是，这种方法似乎行有效。然而，取决于编译器以及编译器的优化级别，结果可能不是我们预期的。通过这种转换，我们涉及了“类型别名”（type-punning），即我们通过另一种类型的指针来对一种类型的指针进行别名。编译器可能会将其优化掉，导致我们得到意想不到的结果。如果警告级别足够，编译器会对此发出警告。\n\
  \n是的，在 C++ 中可靠地完成这项任务很困难。因此，让我们看看方法 #D，它需要的代码最多。我们使用一个包含 `float` 和 `int` 成员的 `union`。然后，我们用\
  \ `pi` 给 `float` 成员赋值，并读回 `int` 成员。对于如此简单的任务，竟然要写这么多多多的代码，而且我们仍然处于“未定义行为”（UB）的领域！在\
  \ C 中有效且取决于优化级别的做法在 C++ 中是不被允许的。在 C++ 中，我们只被允许读取 `union` 的 `active` 成员。因此，在我们的案例中，我们只能读回\
  \ `f`，而不能读 `i`。\n\n这让我们剩下一个看起来像不可行的方案，即使用 `memcpy` 将 `float` 拷贝到 `int` 中，如 #E 所示。这实际上是可靠的且行为定义良好的。只是代码看起来并不那么吸引人。上网搜索发现，其他人也遇到过这种情况，并围绕该\
  \ `memcpy` 编写了一个名为 `bit_cast` 的函数模板封装器。当然，`bit_cast` 随后会进行一些额外的检查，以确保源和目的类型的大小相同。\n\
  \n在 C++20 中，我们不需要自己实现 `bit_cast` 了，因为标准现在已经在 `<bit>` 头文件中自带了该类型：\n\n```cpp\nconst\
  \ float pi = 3.14f;\nconst uint32_t pii = std::bit_cast<uint32_t>(pi);\n```\n列表\
  \ 10.2\n\n除了我们不需要实现和维护 `bit_cast` 之外，这种新类型还确保了会执行各种检查以确保转换是有效的。这两个类型不仅需要相同的大小，而且必须是“平凡可的”（trivially\
  \ copyable）。保持不变的是 `bit_cast` 不进行任何形式的舍入。在示例中，.14 被截掉了，只有 3 最终进入 `pii`。\n\n对于所有有大量\
  \ `constexpr` 代码的人来说，好消息是，如果两个类型及其子对象满足以下条件，STL 的 `bit_cast` 应该是 `constexpr` 的：\n\
  \n* 没有 `union`\n* 没有指针或成员指针\n* 没有 `volatile`\n* 没有作为引用的非静态数据成员\n\nC++20 让我们 第一次通过\
  \ `bit_cast` 允许我们以标准化的方式将一种类型的位值转换为另一种类型，前提是这些类型满足上述要求。作为额外，`bit_cast` 也是 `constexpr`。\n\
  \n## 10.2: `endian`：编译时的字节序检测\n\n![](img/file19.png)\n图 10.1：数字 1 在小端和大端序格式下的布局可视化图。\n\
  \n当你处理传输数据的网络代码或需要保存到磁盘的文件格式时，你可能已经习惯了调整数据的字节。例如，网络流量被定义为网络字节序，其定义为大端序。然而，今天，大多数计算机使用小端序作为字节序。例如，虽然摩托罗使用大端芯片，但\
  \ Intel 和 ARM 芯片是小端序。为了能够从小端主机传输数据到大端主机，小端主机必须将数据交换为大端字节序。在 Linux 上，我们有 C 函数 `htons`\
  \ 和 `htonl` 来分别交换 `uint16_t` 或 `uint32_t` 值的字节序。一直让我困扰的是，我必须根据相应的类型记住并应用正确的函数。例如，我可以很容易地使用\
  \ `htons` 来交换一个 `uint32_t`，结果只交换了 `uint32_t` 的一半字节。这在重构或协议更改期间特别令人痛苦，因为对于我们来说，仅仅更改数据类型是不够的，还必须仔细查看所有的字节交换。\n\
  \n### `hton`\n\n该名字代表 *h*ost *to* *n*etwork（主机到网络）。这些函数也存在反的形式，通常用于 Linux 或其他 POSIX\
  \ 类系统。\n\n正因如此，我们经常会对这两个 C 函数编写一个 C++ 封装函数，并让它们在类型上进行重载。但还有另一个缺点。这些 C 函数不是 `constexpr`。大多数需要交换的数据确实是动态的，在编译时不可知，但某些数据在编译时是已知的。例如，协议版本或类似的静态内容。能够在编译时交换此类数据将是好的。\n\
  \n编写我们自己的 `hton` 函数并不困难。一直编写 `hton` 时繁琐的部分是判断我们是否需要在特定机器上对其进行交换。`hton` 的作用是在小端主机上进行交换，但在大端主机上什么都不做。我们需要使用一些预定义的编译器常量来获取这些信息。C++20\
  \ 在 `<bit>` 头文件中添加了一个类枚举 `std::endian`。很棒的一点是，由于类枚举的性质，`std::endian` 是编译时值。这现在允许我们使用\
  \ `if constexpr` 实现例如 `ByteSwap` 函数，并使整个函数变为 `constexpr`：\n\n```cpp\nconstexpr auto\
  \ ByteSwap(std::integral auto value){\n  if constexpr((std::endian::native == std::endian::big)\
  \ || (sizeof(value) == 1)) {\n    return value;\n  } else {\n    return ReverseBytes(value);\n\
  \  }\n}\n```\n列表 10.3\n\n该实现假设有一个实际执行交换的 `ReverseBytes` 函数。如果我们在小端机器上且类型的大小大于 1，则有效。否则，`ByteSwap`\
  \ 返回传递给它的值。`ByteSwap` 使用了已经讨论过的简写函数语法。通过 concept `std::integral`，我们确保只有整数类型会被交换。我更喜欢这种方式，因为我们随后能够围绕\
  \ `ByteSwap` 编写通用代码。我们也可以向 `ByteSwap` 传递 `uint8_t`，实现会确保此类类型永远不会被交换。\n\n`std::endian`\
  \ 有三个枚举值：\n\n* `little`\n* `big`\n* `native`\n\n虽然 `std::endian` 是一个较小的添加，但这种新类型消除了对宏的需求，从而使我们的代码更健壮且具有跨平台兼容性。\n\
  \n## 10.3: `to_array`\n\n我们已经在书中见过好几次 `std::array` 了，你可能在日常工作中更熟悉 `std::array`。这种数据类型为我们提供了一种高效的方式来拥有数组，并且在将此类对象传递给函数时，它不会退化为指针。`std::array`\
  \ 进一步消除了容易出错的 `sizeof`。在 C++17 之前，`std::array` 有另一个可以看作缺的区别：我们总是需要指定 `std::array`\
  \ 的大小：\n\n```cpp\nconst char cArray[]{\"Hello, C++20\"}; // 编译器推断了大小\n// B 我们需要指定大小\n\
  const std::array<char, 13> array{\"Hello, C++20\"};\n```\n列表 10.4\n\n\n我们可以从两个角度来看待这个问题。你们中的一些人可能会认为显式指定是正确的做法。另一些人则乐于隐式方式。在这种情况下，我认为隐式方式是可以接受的。为什么呢？因为无论字符串包含多少字符，我都需要那个精确的字符串。显式写出大小导致我之前必须去数字符，结果你猜怎么着？我第一次尝试就忘记了字符串的终止符。在所展示的案例中，拥有那个大小值对我并没有帮助，就像我不想指定\
  \ `std::string` 或 `std::vector` 的大小一样。\n\nC++17 的 CTAD（类模板参数推导）消除了这种差异。得益于 CTAD，我们可以在\
  \ C++17 中以这种方式编写相同的代码：\n\n```\n[](#cb263-1)const char cArray[]{\"Hello, C++20\"\
  };  // #A 编译器推导出大小\n[](#cb263-2)// #B 编译器推导出大小和类型\n[](#cb263-3)const std::array\
  \ array{\"Hello, C++20\"};\n```\n\n列表 10.5\n\n我们可以省略类型和大小，让编译器从初始化器中推导出这两个值。这现在可以被认为优于普通的\
  \ C 风格数组。然而，使用 CTAD，我们现在可能会遇到一个问题：#B 中的 `array` 并没有按照我们想要的方式运行，至少在典型情况下是的。生成的 `std::array`\
  \ 的元素类型是 `const char*`，而大小为 1，这显然与 C 风格数组的版本不同。这对于字符串来说是一个很可能发生的错误。对于 `int` 等其他类型，我们以逗号分隔的方式传递数组元素并可以正确地使用\
  \ CTAD。这个问题主要源于一个事实：在此时，我们无法表达我们想要的内容。例如，我们可能还想要一个指向某些字符串的指针数组。\n\n即使使用 CTAD，仍然没有办法仅提供类型而让编译器仅推导大小。当我们想要用比\
  \ `std::array` 元素类型更小的类型来初始化 `std::array` 时，有时是需要这样的。\n\n在 C++20 中，我们有了一个新函数 `std::to_array`，它为我们创建一个\
  \ `std::array`。其区别在于，在这种情况下，`std::to_array` 为数组推导出一个 C 风格数组，并且我们可以指定类型并让编译器弄出大小：\n\
  \n```\n[](#cb264-1)// #A 编译器推导出大小和类型\n[](#cb264-2)const auto array = std::to_array(\"\
  Hello, C++20\");\n[](#cb264-3)\n[](#cb264-4)// #B 编译器推导出大小并指定类型\n[](#cb264-5)const\
  \ auto array2 = std::to_array<const char>(\"Hello, C++20\");\n[](#cb264-6)\n[](#cb264-7)//\
  \ #C 内联创建数组\n[](#cb264-8)const auto arrayFromList = std::to_array({3, 4, 5});\n\
  [](#cb264-9)\n[](#cb264-10)int intArray[]{3, 4, 5};\n[](#cb264-11)// #D 移动值\n[](#cb264-12)const\
  \ auto movedArray = std::to_array(std::move(intArray));\n```\n\n列表 10.6\n\n如你所见，我们可以在自动模式下使用\
  \ `std::to_array`，让它推导类型和大小（如 #A 所示），或仅指定类型（如 #B 所示），而编译器处理其余部分。我们也可以像 #C 所示那样内联创建数组。对于仅移动类型（move-only\
  \ types），如果我们想将值移动到 `std::array` 中，可以使用 `std::to_array`。\n\n即使使用 CTAD，仍然没有办法仅提供类型而让编译器仅推导大小。当我们想要用比\
  \ `std::array` 元素类型更小的类型来初始化 `std::array` 时，有时是需要这样的。\n\n10.4 `span`: 连续视图\n\n对于这一节，假设我们希望用\
  \ `span` 来替代 `std::array` 的视图。在这种情况下，`span` 显式大小是可以接受的。常见的 `read` 和 `write` 函数通常看起来如下：\n\
  \n```\n[](#cb265-1)bool Send(const char* data, size_t size);\n[](#cb265-2)void Read(char*\
  \ data, size_t size);\n[](#cb265-3)\nvoid Use() {\n[](#cb265-4)  char data[1024];\n\
  [](#cb265-5)  Read(data, sizeof(data));\n[](#cb265-6)  Send(data, sizeof(data));\n\
  }\n```\n\n列表 10.7\n\n正如你所见，`Send` 和 `Read` 现在接收 `std::array`。每个模板都需要推导 `std::array`\
  \ 的大小。唯一的可能问题是每个大小实例化产生的二进制文件开销。答案是肯定的，代码包含一个 bug。在 `std::array` 之前，我们也可以使用 `std::to_array`。\n\
  \n特别是在处理 C 风格数组时，记住 `std::to_array` 是值得的。\n\n```cpp\ntemplate<size_t SIZE>\nvoid\
  \ Send(std::array<char, SIZE>& data);\ntemplate<size_t SIZE>\nvoid Read(std::array<char,\
  \ SIZE>& data);\nvoid Use() {\n  std::array<char, 1024> buffer;\n  Read(buffer);\n\
  \  Send(buffer);\n}\n```\n\n列表 10.8\n\n正如你所见，`Send` 和 `Read` 现在接收 `std::array` 并且是模板。它们需要推导\
  \ `std::array` 的大小。可能出现问题的是每个大小实例化产生的二进制开销，这是我们并不想要的。\n\n这就是 C++20 中的新类型发挥作用的地方：`std::span`。你在一个新的头文件中找到\
  \ `std::span`。让我们先看看应用 `std::span` 时的代码样子：\n\n```cpp\nbool Send(std::span<const\
  \ char> data);\nvoid Read(std::span<char> data);\nvoid Use() {\n  std::array<char,\
  \ 1024> buffer;\n  Read(buffer);\n  Send(buffer);\n  char buffer2[2048];\n  Read(buffer2);\n\
  \  Send(buffer2);\n}\n```\n\n列表 10.9\n\n我们可以看到，在这一版本中，我们将 `std::span` 替换到了 `Read`\
  \ 和 `Send` 的函数签名。模板头部也消失了。在 `Use` 中，我们可以看到 `span` 既可以从 `std::array` 构造，也可以从 `char`\
  \ 数组构造。\n\n\n\n\n`std::span` 提供了一个名为 `data` 的成员来访问其数据，以及一个 `size`get 来获取数据的大小。我们可以询问\
  \ `span` 类型的对象是否为空（`empty`），访问第一个（`front`）或最后一个（`back`）元素，并通过下标运算符访问元素。`std::span`\
  \ 看起来和用非常像 STL 中的任何其他容器，但 `std::span` 是不同的。`std::span` 就像 `std::string_view`（Std-Box\
  \ 1.6）一样，它只是数据的一个视图。这与 `std::ranges::view` 没有共同之处。`std::span` 仅存储指向数据的指针和长度。这意味着\
  \ `std::span` 所引的数据生命周期必须比 `span` 本身更长。否则，就会导致未定义行为（UB），因为 `span` 指向的内存不再有效。非常重要的一点是：`std::span`\
  \ 是一个非所有权的容器！\n\n下面我们看到 `std::span` 的内部结构：\n\n```\ntemplate<typename T>\nclass Span\
  \ {\n  T*     mData;\n  size_t mSize;\n\npublic:\n  // constructors\n};\n```\n\n\
  Listing 10.10\n\n如前所述，`std::span` 仅存储一个指向数据的指针。与 `std::array` 相比的技巧在于，大小是在构造函数中运行时确定的。我在这里没有写构造函数，因为有很多个。但重要的基础是，`std::span`\
  \ 仅存储从其他处提供的内存指针。只要你记住并尊重这一点，`std::span` 对于我们之前看过的带有 `Send` 和 `Read` 的那些 `API` 来说是一个极佳的类型。\n\
  \n## 10.5: `source_location`: `__FUNCTION__` 的现代方式\n\n通常，当我们编写某种调试或日志函数时，希望也能获得有关调用该调试或日志函数的文件名、行号和函数名。为了简化这里的示例，我将使用日志函数作为调试函数和日志函数的同义词。\n\
  \n### 10.5.1: 自定义 `assert` 函数\n\n假设我们要编写一个自定义的 `assert` 函数。`assert` 应该显示断言不成立的函数名和行号。\n\
  \n```cpp\n// A 接收条件、消息和行号 Assert 函数\nvoid Assert(bool                 condition,\n\
  \            std::string_view     msg,\n            std::string_view function,\n\
  \            int              line)\n{\n  if(not condition) {\n    std::clog <<\
  \ function << ':'\n              << line << \": \" << msg << '';\n  }\n}\n```\n\n\
  Listing 10.11\n\n这种实现方式从易用性角度来看并不理想。用户必须在每个调用处重复这些信息。我们可以通过预定义的编译器宏 `__FUNCTION__`\
  \ 和 `__LINE__` 来获取这些信息。\n\n```cpp\n// D 调用 Assert 的宏封装\n#define ASSERT(condition,\
  \  msg)  \\\n  Assert(condition,  \\\n  msg,  \\\n  __FUNCTION__,  \\\n  __LINE__)\
  \  # E 获取函数名和行号\n```\n\nListing 10.12\n\n预处理器将宏替换为我们编写的 `Assert` 调用。这是一个非常有用的技巧。然而，这种技术也有一些缺点。例如，用户必须了解这一点。宏不是类型安全的，因此可能会产生难以检测的各种错误。\n\
  \n### 10.13 (等等，我漏掉了逻辑) 我们真正想要的是 `Assert` 函数，但能自动插入函数名和行号。\n\n想到了默认参数可以解决自动插入的问题。\n\
  \n我们现在有了 C++20，它为我们带来了一个新的包含头文件 `<source_location>`，它定义了一个同名的类型。\n\n```cpp\n// A\
  \ 接收条件、消息和源位置的 Assert 函数\nvoid Assert(bool                 condition,\n        \
  \    std::string_view     msg,\n            std::source_location location =\n  \
  \            // B current() 是特殊的\n            std::source_location::current())\n\
  {\n  if(not condition) {\n    std::clog << location.function_name() << ':'\n   \
  \           << location.line() << \": \" << msg << '';\n  }\n}\n\nvoid Use()\n{\n\
  \  // C 一个带有 Use 信息的 Assert 调用\n  Assert(1 != 2, \"Not met\");\n}\n```\n\nListing\
  \ 10.13\n\n\n\n\n\n我们乍眼看出，在 C++20 中，我们不再通过两个参数传递 `__FUNCTION__` 和 `__LINE__`，而是可以使用\
  \ `source_location`，它提供了这两处信息。我们可以使用默认构造函数创建一个空的 `source_location` 对象，也可以使用构造方法\
  \ `current`。这种方法是同此类中的首创的，因为它在 C++ 世界中非常特殊。`std::source_location::current` 实现了我们之前需要宏才能的功能。该函数从调用者处获取信息！假设我们如列表\
  \ 10.13 所示在 `Use` 中调用了 `Assert`。那么 `location` 携带的信息就是函数名 `Use` 以及在 `Use` 中调用 `Assert`\
  \ 的行号。这个新元素使我们能够在不使用宏的情况下构建 `Assert` 函数。额外的优点是，这种 `Assert` 是类型安全的，并将信息包含在一个对象中。除了函数名和行号，`source_location`\
  \ 还提供了文件名。表 10.1 显示了所有成员及其与宏的关系。\n\n表 tab-stdSourceLocationMembers:`std::source_location`\
  \ 的成员函数\n\n| 方法 | 功能 | 宏 |\n| --- | --- | --- |\n| `current()` | 一个 `static` 成员，根据其调用处的信息创建一个新的\
  \ `source_location` 对象。 | N/A |\n| `column()`^a | 创建对象时的列号。 | N/A |\n| `file_name()`\
  \ | 创建对象的文件名。 | `__FILE_NAME__` |\n| `function_name()` | 创建对象的函数名。 | `__FUNCTION__`\
  \ |\n| `line()` | 创建对象时的行号。 | `__LINE__` |\n\n```\n<supa</sup>这是一个实现定义的值，无论实际列号是多少，它可能为\
  \ 0 (0)。\n```\n\n### 10.5.3: 使用 C++20 编写自定义日志函数\n\n正如上一节所示，每当我们我们需要文件和行号信息时，`std::source_location`\
  \ 都是一个很棒的工具。如何在自定义日志函数中使用 `std::source_location` 呢？目标与之前相同。我们希望在不需要宏的情况下编写此日志函数。一个\
  \ C++20 之前的尝试可能如下：\n\n```cpp\n// #A 接收函数、行号和变长参数的日志函数\nvoid Log(LogLevel       \
  \  level,\n         std::string_view functionName,\n         int              line,\n\
  \         std::string_view fmt,\n         const auto&... args)\n{\n  std::clog <<\
  \ std::format(\"{}:{}:{}: \",\n                           static_cast<unsigned int>(level),\n\
  \                           functionName,\n                           line)\n  \
  \          << std::vformat(fmt, std::make_format_args(args...))\n            <<\
  \ '';\n}\n\n// #B 调用 Log 的宏封装\n#define LOG(level,  fmt,  ...)  \\\n  Log(level,\
  \  __FUNCTION__,  __LINE__,  fmt,  __VA_ARGS__)\n```\n\n列表 10.14\n\n我们可以看到 `Log`\
  \ 接收一个日志级别以及函数名和行号形式源信息。这些参数之后是格式化字符串和格式参数。使用 `std::format` 来格式化输出，并使用 `std::clog`\
  \ 管理输出。我们仍然处于与之前 `Assert` 相同的情况下。需要一个宏来获取源信息，否则用户必须手动填写这些信息。然而，这一次我们看到的是一种稍微不同的模式。看看这种可能的实现：\n\
  \n```cpp\n// #A 接收函数、行号和变长参数的日志函数\nvoid Log(LogLevel             level,\n      \
  \   std::source_location location,\n         std::string_view     fmt,\n       \
  \  const auto&... args)\n{\n  std::clog << std::format(\"{}:{}:{}: \",\n       \
  \                    static_cast<unsigned int>(level),\n                       \
  \    location.function_name(),\n                           location.line())\n  \
  \          << std::vformat(fmt, std::make_format_args(args...))\n            <<\
  \ '';\n}\n```\n\n与 `Assert` 的区别在于 `Log` 期望 `std::source_location` 作为参数。我们可以使用 `std::source_location::current()`\
  \ 从调用处获取源信息。这种方法可能比之前的方案更好。在进入细节之前，我先给你们看代码：\n\n```cpp\nstruct Format {\n  std::string_view\
  \ fmt;\n  std::source_location loc;\n  // #A 允许隐式转换的构造函数\n  Format(const char* _fmt,\n\
  \         std::source_location _loc = std::source_location::current())\n    : fmt{_fmt},\
  \ loc{_loc}\n  {}\n};\n\n// #B Log 现在接收隐式添加了位置信息的 Format\nvoid Log(LogLevel level,\
  \ Format fmt, const auto&... args) {\n  std::clog << std::format(\"{}:{}:{}: \"\
  ,\n                           static_cast<unsigned int>(level),\n              \
  \             fmt.loc.function_name(),\n                           fmt.loc.line())\n\
  \            << std::vformat(fmt.fmt,\n                            std::make_format_args(args...))\n\
  \            << '';\n}\n```\n\n列表 10.15\n\n有一个新类型 `Format`，它包含一个 `std::string_view`\
  \ 和一个 `std::source_location`。`Format` 的构造函数允许隐式转换，并将 `std::source_location` 作为第二个参数，默认为\
  \ `source_location::current()`。当编译器仅使用 `const char*` 创建 `Format` 临时对象时，该对象也包含了创建该时的源信息。\n\
  \n`Log` 现在接收 `Format` 作为第二个参数，参数列表中不再有 `std::source_location`。`Log` 的内部实现也随之微调。我们现在需要使用\
  \ `fmt`，它包含了格式化信息和源信息。\n\n\n\n\n\n对于这一节，我将使用 `std::map` 作为关联容器的示例。当我们使用此类容器时，经常出现的一项任务是检查特定键是否已经存在于容器中。我指的不是检查插入操作是否成功。我指的是我们只想知道某个特定键是否存在的情况。基于这一信息，例如，如果键不存在，我们会提示用户输入一个值。在\
  \ C++17 中，检查键是否存在通常通过 `find` 来实现：\n\n```cpp\nconst std::map<int, std::string> cppStds\
  \ = {{11, \"C++11\"},\n                                            {14, \"C++14\"\
  },\n                                            {17, \"C++17\"},\n             \
  \                               {20, \"C++20\"}};\n\nconst int key = 20;\n\nif(cppStds.find(key)\
  \ != cppStds.end()) {\n  std::cout << \"Found\";\n} else {\n  std::cout << \"Not\
  \ found\";\n}\n```\n\n列表 10.17\n\n有时，人们使用 `count` 方法来解决相同的任务。然而，这只对 `std::map` 和\
  \ `std::set` 有效。在这些容器中，`find` 和 `count` 的复杂度相对于容器的大小是对数级的。对于 `std::multimap` 和 `std::multiset`，情况则不同。多值容器的\
  \ `count` 复杂度为对数复杂度加上找到元素数量的线性复杂度。`count` 的优点在于它返回一个可以转换为布尔值的整数。我们可以直接在 `if` 中使用\
  \ `count` 的结果，而不需要像在列表 10.17 中使用 `find` 时那样编写取反（`find` 返回的是迭代器）。从性能角度来看，`find` 是更通用的方法，对所有容器的性能都一样。从教学角度来看，教\
  \ `find` 是一场噩梦。从程序员的角度来看，无法在代码中表达我们的意图同样是一场噩梦。C++20 让我们结束了这种痛苦。我们终于为所有关联容器拥有了 `contains`\
  \ 方法。\n\n```cpp\nconst std::map<int, std::string> cppStds = {{11, \"C++11\"},\n\
  \                                            {14, \"C++14\"},\n                \
  \                            {17, \"C++17\"},\n                                \
  \            {20, \"C++20\"}};\n\nconst int key = 20;\n\nif(cppStds.contains(key))\
  \ {\n  std::cout << \"Found\";\n} else {\n  std::cout << \"Not found\";\n}\n```\n\
  \n列表 10.18\n\nC++20 的代码简洁清晰并捕捉了我们的意图。通过使用 `contains`，我们还确保了在测试容器是否包含某个键时始终能获得最佳性能。\n\
  \n## 10.7: `std::string` 的 `starts_with` 和 `ends_with`\n\nSTL 中常用的类型之一是 `std::string`。这个漂亮的数据类型有很多用的方法来修改和搜索字符串。然而，一个经常执行的任务是检查字符串是否以某个特定字符串开头或结尾。这里有一个示例，检查字符串\
  \ `\"Hello, C++20\"` 是否以 `\"Hello\"` 开头：\n\n```cpp\nconst std::string s{\"Hello,\
  \ C++20\"};\n\nif(s.find(\"Hello\") != std::string::npos) { puts(\"Found!\"); }\n\
  ```\n\n列表 10.19\n\n我隐约记得第一次需要解决这个……嗯，任务的情景。我很惊讶 C++ 中针对 `std::string` 并没有 `starts_with`\
  \ 函数。接着，我过了一会儿才意识到 `string::npos` 是存在的。另一个次优的问题是：在正例的情况下，我们找到了字符串，但条件读起来却是“不等于”（`!=`）。我们以前在\
  \ [§1] 中见过这种模式。在阅读代码时，不不相等的部分很令人困惑。我有时收到反馈说我的代码是错的，因为我可能不经意间弄反了正反两种情况。我完全理解这种反馈，我自己也得检查两次。我写过几个封装该代码并命名为\
  \ `starts_with` 的实现。在互联网上简单搜索一下发现，我并不孤单。`starts_with` 可能已经存在了……C++20 最终通过添加 `starts_with`\
  \ 和 `ends_with` 解决了这个问题。\n\n```cpp\nconst std::string s{\"Hello, C++20\"};\n\nif(s.starts_with(\"\
  Hello\")) { puts(\"Found!\"); }\n```\n\n## 11: 语言更新\n\n现在我们已经看过了四大核心特性以及一些较小特性，即飞船运算符、lambda\
  \ 的新写法，当然还有 STL 的改进，是时候查看一些较小的更新了。\n\n## 11.1: 带有初始化器的范围 for 循环\n\n我们从一个我认为每个程序都包含的东西开始。循环最重要的一点是它们必须仔细编写以避免无限循环。另一个良好的实践是为变量使用窄的作用域。这直一直是选择\
  \ `for` 循环而不是 `while` 循环的原因。在 C++11 之前，我们一直缺少一种简单的方法来迭代（例如 `std::vector`）。自从 C++11\
  \ 以来，我们就通过范围循环拥有了这种能力。这种循环让我们的代码紧凑且易于阅读。\n\n### 11.1.1: 在范围 for 循环中使用计数器变量\n\n仍然缺少了一项。请看下面的代码：\n\
  \n```cpp\nstd::vector<int> v{2, 3, 4, 5, 6}; // A\n\nsize_t idx{0}; // B 属于 for\
  \ 但在外部作用域\nfor(const auto& e : v) {\n  // C 使用 idx 显示位置\n  printf(\"[%zd] %d\",\
  \ idx++, e);\n}\n```\n\n列表 11.1\n\n我们在 #A 中声明了一个 `std::vector<int>` `v`，并填充了一些数字。然后，我们在\
  \ #B 中声明了变量 `idx` 并将其初始化为 0。注意，`idx` 的声明在紧随其后的范围 for 循环之外。在范围 for 循环中，我们遍历整个向量 `v`，打印它的值和位置。位置正是我们需要\
  \ `idx` 的地方。正如 #C 所示，`idx` 也进行了后增以反映迭代步骤。\n\n\n\n\n现在，这段代码还可以。其中一个问题是 `idx` 属于基于范围的\
  \ for 循环（range-based for-loop），但这种关系并不显而。想象这段代码片段是一个大型代码库的一部分。很有可能随着时间的推移，`idx`\
  \ 将不再再直接位于基于范围的 for 循环之前。那么，这种关系就会变得更加模糊。如果中间的某些代码将 `idx` 设置为零以外的其他值，情况会变得更加糟糕。\n\
  \n我们在这里可以应用的一个务实解决方案是将 `idx` 和基于范围的 for 循环都放在一个作用域内，如下方的 #A 所示：\n\n```cpp\nstd::vector<int>\
  \ v{2, 3, 4, 5, 6};\n{  // #A 作用域将 idx 和循环绑定在一起\n  size_t idx{0};\n  for(const auto&\
  \ e : v) { printf(\"[%zd] %d\", idx++, e); }\n}\n```\n列表 11.2\n\n额外的作用域使得代码的意图变得清晰。它应该能防止我们在两者发生断开时陷入困扰。然而，我们必须编写这个作用域，并且像往常一样将作用域内的语句再缩进一层。我们的代码随之变得稍微难读，因为自然流被打破了。取决于最大行长度和缩进规则，我们最终得到的行数可能比原来更多。\n\
  \n这正是 C++20 再次帮助我们保持简单高效的地方。在传统的 `for`-循环中，我们始终有选择在头部声明变量的选项。在基于范围的 `for`-循环中，这种能力曾经丢失了，但在\
  \ C++20 中它现在又变得触手可及了：\n\n```cpp\nstd::vector<int> v{2, 3, 4, 5, 6};\nfor(size_t\
  \ idx{0}; const auto& e : v) {\n  printf(\"[%zd] %d\", idx++, e);\n}\n```\n列表 11.3\n\
  \n这太棒了！我们不仅不再需要添加额外的作用域，而且基于范围的 for 循环现在变得更接近普通的 `for`循环，这减少了记忆它们之间差异的需求。\n\n有一部分仍然可以改进。我喜欢\
  \ `for`-循环的一点是，在 `for`-循环的头部，我们通常可以看到正在发生的一切：声明的循环变量、终止的条件以及后置操作。计数器是加一、加二还是加十？我想如果我们能在基于范围的\
  \ for 循环中也有后置操作就太好了。\n\n### 11.2: 针对临时对象的变通方案\n\n基于范围的 for 循环的新功能在另一种情况下为我们提供了帮助。然而，这是一种变通方案而不是真正的修复。假设我们有以下代码：\n\
  \n```cpp\nclass Keeper {  #A\n  std::vector<int> data{2, 3, 4};\npublic:\n  ~Keeper()\
  \ { std::cout << \"dtor\"; }\n  // #B 返回引用\n  auto& items() { return data; }\n};\n\
  Keeper GetKeeper()  #C 按值返回\n{\n  return {};\n}\nvoid Use() {\n  // #D 使用 GetKeeper\
  \ 的结果并从 items 迭代\n  for(auto& item : GetKeeper().items()) {\n    std::cout << item\
  \ << '';\n  }\n}\n```\n列表 11.4\n\n`Keeper` 类存储了一个 `std::vector` 并通过 `items` 提供了一个访问函数。这里值得注意的是\
  \ `items` 返回了其内部数据的引用。然后我们有 `GetKeeper`，这是一个返回 `Keeper` 对象的函数。注意它是一个对象，而不是指向它的引用或指针。这些就是我们随后\
  \ #D 中使用的部分。我们的用法是迭代 `Keeper` 中向量中的所有元素。我们通过在基于范围的 for 循环的头部调用 `GetKeeper().items()`\
  \ 来实现。这是完全合逻辑且可以编译的代码。好消息是它确实可以运行。不，实际上事实并非如此。如果它运行，那反而是坏消息，因为恰恰现在，我们正在观察未定义行为（UB）。如果这段代码运行，它是由于错误的原因而运行的，并且可能随时崩溃。\n\
  \n什么是 UB？它是关于基于范围的 for 循环如何绑定到它们的范围初始化器。在我们的案例中 `GetKeeper().items()`（你可以使用 C++\
  \ Insights 来查看其内部）：\n\n```cpp\nstd::vector<int> & __range1 = GetKeeper().items();\n\
  ```\n\n我们得到了一个由临时对象 `Keeper` 返回的 `std::vector` 引用。然而，它是对一个临时对象的引用，我们在该临时对象上调用了另一个函数\
  \ `items()`。临时对象 `GetKeeper` 在分号处被销毁，导致在我们到达基于范围的 for 循环体之前，它就已经消失了。这个 bug 可能不会被注意到，因为内容仍然留在栈上，但它仍然是一个\
  \ bug。\n\n通过 C++20 的带初始化器的基于范围的 for 循环，我们可以绕过这个问题并这样拆分 `GetKeeper` 和 `items` 的调用：\n\
  \n```cpp\nfor(auto&& items = GetKeeper(); auto& item : items.items()) {\n  std::cout\
  \ << item << '';\n}\n```\n列表 11.5\n\n通过这种拆分，`GetKeeper` 获得了生命周期延长。因此，`items` 是有效的。正如我所说，将其视为变通方案即可。在不想引入过多内容的情况下，它将在\
  \ C++23 中被修复。\n\n## 11.2: 新属性\n\nC++20 提供了新的属性：`[[likely]]`、`[[unlikely]]` 和 `[[no_unique_address]]`。这些允许我们在不需要特定编译器宏的情况下给编译器提供提示。\n\
  \n### 11.2.1: `likely` / `unlikely`\n\n我们正在看到一个带有三个 `case` 标签的 `switch`。正如你看到的，它们是数字并且经过排序。有时，以某种方式排序元素会让我们的代码更具可读性。例如，这样更容易发现缺失的\
  \ case。\n\n虽然列表 11.6](#ch015.xhtml_0) 中的代码完全没有问题，但如果我们知道 1 是最可能的值，占 90% 的时间呢？它应该是第一个标签，因为编译器会先检查它，对吧？好吧，那么我们的排序系统就变得随机了。\n\
  \n```cpp\nswitch(value) {\n  case 0: puts(\"Hello\"); break;\n  [[likely]] case\
  \ 1: puts(\"World\"); break;\n  case 2: puts(\"C++\"); break;\n}\n```\n列表 11.6\n\
  \n没有理由将其他情况标记为 unlikely。这些属性就像布尔值；它们被设置或未设置。因此，只对控制流路径中主要的语句标记属性即可。\n\n作为一个通用规则，尝试对通向最可能语句或语句组的*路径*标记属性。\n\
  \n### 11.2.2: `no_unique_address`\n\n此时，我想让你记住我们在第 8 节](#ch015.xhtml_id_) 中讨论过的，聚合体不能再有用户声明的构造函数。否则，它们就不再是聚合体了。\n\
  \n\n\n\n\n```\nstruct Resources {\n  int         fileDescriptor;\n  std::string\
  \ messageID;\n\n  // #A 确保不可拷贝，但支持移动\n  Resources()                 = default;\n\
  \  Resources(const Resources&) = delete;\n  Resources(Resources&&)      = default;\n\
  };\n\nint main()\n{\n  Resources r1{3, \"buffer\"};\n\n  //Resources r2{r1}; //\
  \ #B 无法编译\n}\n```\n\nListing 11.8\n\n在列表 11.8 中，我们有一个聚合体 `Resources`。在 C++17 中 `Resources`\
  \ 确实 是一个聚合体，但根据新的 C++20 规则，它不再是了。但让我们先过一遍 `Resources` 背后的理念。正如该类型的名称所示，`Resources`\
  \ 持有一些唯一的资源。因此，`Resources` 不应该被拷贝。一个文件描述符的拷贝意味着什么？在这种情况下，允许拷贝显然不是一个好主意。在 #A 中，我们看到了\
  \ C++17 及其以前的一种典型模式，其中我们删除了拷贝操作，并对默认构造函数以及移动构造函数使用了默认值。这样，我们就保留了移动能力。这是一个合理的方法。我经常看到使用宏来实现这种结果并减少重复。我们不能创建一个基类\
  \ `NotCopyable` 并让 `Resources` 派自它，因为那样我们在创建对象时需要列出 `NotCopyable` 的初始化器。\n\n###\
  \ 空基优化 (EBO)\n\nEBO 一术是指一种类 `A` 派自另一个类 `B` 的技术。如果 `B` 不包含任何数据成员且这些成员不需要内存，编译器就可以优化掉\
  \ `B` 的大小。通常在 C++ 中，每个对象的尺寸至少为字节。EBO 是一种特殊情况，通常用于通用代码，当一个类应该由用户提供的类型实例化以反映该类型的属性而不占用额外空间时。传递分配器（allocator）就是这样一个例子。\n\
  \n根据 C++20 的规则，`Resources` 不再是聚合体了。它包含一个用户定义的拷贝构造函数，根据 C++20 的规则，这使得它不再是聚合体。这意味着我们不能再在\
  \ C++20 中创建不可拷贝的聚合体了吗？\n\n嗯，方法不像以前那样了，但有一种方法。这里出现了一个有趣的新成员，形式为一种新属性 `no_unique_address`。它是专门为这类这种情况设计的。它的目的是让我们在类中拥有一个不占用内存的类型。因此，没有唯一地址。这意味着标记为\
  \ `no_unique_address` 的类型可以大小为零。有一种名为 EBO 的技术，它自 C++ 诞生初就存在了，与 `no_unique_address`\
  \ 相比，它有缺点。\n\n```\nstruct NotCopyable {\n  NotCopyable()                   = default;\n\
  \  NotCopyable(const NotCopyable&) = delete;\n  NotCopyable(NotCopyable&&)     \
  \ = default;\n};\n\nstruct Resources {\n  int         fileDescriptor;\n  std::string\
  \ messageID;\n\n  [[no_unique_address]] NotCopyable\n    nc;  // #A 确保不可拷贝，但支持移动\n\
  };\n\nint main()\n{\n  Resources r1{3, \"buffer\"};\n\n  //Resources r2{r1}; //\
  \ #B 无法编译\n}\n```\n\nListing 11.9\n\n对于 EBO，我们必须派自空基类。在很多情况下，这没有意义。在列表 11.9 中，`Ressources`\
  \ 可以派自 `NotCopyable` 而不是拥有类型为 `NotCopyable` 的数据成员 `nc`。在这种情况下，EBO 是可能的。然而，现在我们说\
  \ `NotCopyable` 是 `Ressources` 的基类，它并不是。我们出于效率考虑做了继承决定，而不是因为模拟了实际的继承。所以我们误用了 EBO，而有了\
  \ `no_unique_address` 后我们就不再需要这样做了。\n\n### 11.3: 使用枚举\n\n类枚举（class enums）自 C++11\
  \ 以来一直是非常有用的东西。与普通枚举不同，它们的值定义在枚举的命名空间内。这有助于我们保持全局的整洁。类枚举的一个要求是枚举成员需要以枚举名称名前缀，这构建了命名空间。在很多情况下这是正确的做法。然而，想象你必须编写一段代码，在狭窄的作用范围内，你需要访问此类类的多个（并非全部）枚举成员。假设你有一个类枚举\
  \ `Permission`，它包含 `Read`、`Write` 和 `Execute` 值。为了一个简单的 `to_string` 函数，你必须重复三次枚举名称。列表\
  \ 11.10 展示了这样的实现。\n\n```cpp\nconstexpr std::string_view to_string(Permission permission)\n\
  {\n  switch(permission) {\n    case Permission::Read: return \"Read\";\n    case\
  \ Permission::Write: return \"Write\";\n    case Permission::Execute: return \"\
  Execute\";\n  }\n  return \"unknown\";\n}\n```\n\nListing 11.10\n\n仅仅三个值，就已经没什么好庆祝的了。如果有更多，它会变得非常烦人。与类枚举其他用法的主要区别在于，这次范围非常窄，仅在\
  \ `switch` 内部。通常在 C++ 中，这是你可以使用 `using` 来让所有元素可见的地方。遗憾的是，在 C++17 之前这是不允许的。但在 C++20\
  \ 中这是允许的，这将允许我们将列表 11.10 中的代码重构为列表 11.11 所示的方式，通过在 switch 范围内拉入所有枚举项。\n\n```cpp\n\
  constexpr std::string_view to_string(Permission permission)\n{\n  switch(permission)\
  \ {\n    using Permission;  #A using 的用法\n    case Read: return \"Read\";\n    case\
  \ Write: return \"Write\";\n    case Execute: return \"Execute\";\n  }\n  return\
  \ \"unknown\";\n}\n```\n\nListing 11.11\n\n一一样，小心使用 `using` 并确保只拉入需要的。类枚举的巨大优势是枚举成员在专用命名空间内。\n\
  \n### 11.4: 条件显式 (explicit)\n\nC++20 消除另一个不平衡是 `explicit` 的使用。在 C++20 之前，我们只能说明特定的构造函数或转换运算符是\
  \ `explicit` 的。回顾 `noexcept` 接受一个条件来表示函数是否为 `noexcept`。虽然这听起来有点奇怪，但在通用代码中非常有用，例如函数的\
  \ `noexcept` 行为取决于参数类型。让我们探索一下在 C++20 中可以用 `explicit` 做什么。\n\n#### 11.4.1: 编写行为良好的包装器\n\
  \n查看列表 11.12 中的代码。它展示了两个类 `A` 和 `B`。在 `A` 中，你可以看到它带有一个 `explicit` 转换构造函数和一个非显式的转换运算符，它们都使用了\
  \ `B`。现在，如果有一个接受类型 `A` 的函数 `Fun`，该函数可以使用 `A` 对象调用，但不能用 `B` 对象调用。\n\n```cpp\nstruct\
  \ B {};\n\nstruct A {\n  A() = default;\n  explicit A(const B&);  # #A 标记为 explicit\n\
  \  operator B() const;\n};\n\nvoid Fun(A a);\n\nvoid Use()\n{\n  Fun(A{});\n  //\
  \ Fun(B{}); // #B 因为显式构造函数无法编译\n}\n```\n\nListing 11.12\n\n延续通用代码的示例，假设你正在编写一个 `Wrapper`，它应该包装任何类型并模拟被包装类型的行为。列表\
  \ 11.13 展示了这样的方法。\n\n\n\n\n\n```cpp\ntemplate<typename T>\nstruct Wrapper {\n  template<typename\
  \ U>\n  Wrapper(const U&);\n};\n\nvoid Fun(Wrapper<A> a);  // A 现在接收 Wrapper<A>\n\
  \nvoid Use()\n{\n  Fun(A{});\n  Fun(B{});  // B 也可以编译！\n}\n```\n\n列表 11.13\n\n首先，`Wrapper`\
  \ 是一个类模板，它带有一个转换构造函数，允许使用可转换为被包装类型的类型来创建 `Wrapper`。为了测试这个解决方案，`Fun` 现在接收一个 `Wrapper<A>`\
  \ 而不是普通的 `A`，如列表 11.14 所示。\n\n虽然乍一看它似乎没有通过测试，但 `Fun` 现在可以用 `B` 对象进行调用了。问题在于，即使使用了\
  \ Concepts（概念），我们仍然需要编写两个转换构造函数：一个被标记为 `explicit`，另一个则不是。通过使用 `std::is_convertible_v`，我们可以引导到匹配的转换构造函数。然而，这需要糟糕的代码重复，而且每种情况都需要这样做，这意味着转换运算符也是如此。这就是\
  \ C++20 变得清晰且易于编写的，正如列表 11.14 所示。\n\n```cpp\ntemplate<typename T>\nstruct Wrapper\
  \ {\n  template<typename U>\n   explicit(not std::is_convertible_v<U, T>) Wrapper(const\
  \ U&);\n};\n```\n\n列表 11.14\n\n凭借条件式 `explicit` 的威力，只需要 `std::is_convertible_v`。不需要\
  \ Concepts，没有代码重复。这同样适用于转换构造函数。\n\n### 11.4.2: 显式地表达你的意图\n\n除了你刚刚看到的能够轻松创建一个表现良好的包装器之外，新的条件式\
  \ `explicit` 还有另一个角度。考虑列表 11.15 中的代码。想想在代码审查中，你会对这段代码说什么。\n\n```cpp\nstruct A {\n\
  \  A() = default;\n  explicit A(int);\n};\n\nstruct B {\n  B() = default;\n  B(int);\n\
  };\n```\n\n列表 11.15\n\n我的回答是，我必须询问 `B` 接收 `int` 的构造函数是否是故意不写 `explicit` 的。从提供的代码来看，这并不清楚。也许源代码或提交消息中某处有注释。无论如何，它并没有出现在需要的地方。这正是我们可以使用没有任何条件部分的条件\
  \ `explicit` 的地方，就像使用静态的 `false` 一样。\n\n```cpp\nstruct B {\n  B() = default;\n \
  \  explicit(false) B(int);\n};\n```\n\n列表 11.16\n\n列表 11.16 中的代码现在表达了作者的意图。你仍然可以在代码审查中质疑这是否是正确的决定，但这个决定是显式可见的。\n\
  \n#### 要点总结\n\n* 记住，你可以使用条件 `explicit` 来声明你的意图，即某个构造函数不应该是是 `explicit` 的。\n* 仅用\
  \ `[[likely]]` 或 `[[unlikely]]` 标记主控制流路径。\n\n# 12: 在编译时执行（更多）事情\n\nC++ 在 C++11 中引入了一个非常有趣的特性：`constexpr`\
  \ 函数和变量。`constexpr` 允许我们通过 `constexpr` 函数在编译时执行代码，并通过 `constexpr` 变量在编译时计算变量的值。\n\
  \n`constexpr` 函数的功能随着每个后续标准不断改进。C++20 也不例外。更多的限制被消除了，而且 `consteval` 和 `constinit`\
  \ 这两个新成员也加入了。\n\n在我们深入研究 C++20 在编译时可以做的所有令人兴奋的新事物之前，让我们回顾一下 `constexpr` 的含义，以及在\
  \ C++20 之前对 `constexpr` 函数所做的限制。\n\n## 12.1: 两个世界：编译时与运行时\n\n编译器在编译时请求函数调用结果的能力是该语言的一个有趣转折。我们用\
  \ C++11 编写的 `constexpr` 函数限于单个 `return` 语句。这通常以递归函数调用结束。\n\n```cpp\n// 定义一个 constexpr\
  \ 函数\nconstexpr size_t StrLen(const char* str)\n{\n  // 使用三元运算符配合单一 return\n  return\
  \ *str ? 1 + StrLen(str + 1) : 0;\n}\nint main()\n{\n  constexpr char name[]{\"\
  Scott\"};\n  auto len = StrLen(name);\n  printf(\"%zd\", len);\n}\n```\n\n列表 12.1\n\
  \n在这个示例中，我们看到了一个在编译时获取 C 字符串长度的函数实现。因此，`StrLen` 被标记为 `constexpr`。现在，知道关于 `constexpr`\
  \ 函数的规则至关重要。其中之一是：`constexpr` 函数可以在编译时求值。重点在于*可以*！在列表 12.1 中，`StrLen` 可能在运行时执行。每当我们想要确保某些\
  \ `constexpr` 函数在编译时执行时，我们需要通过将结果赋值给 `constexpr` 变量来强制常量求值。因此，为了确保 `StrLen` 在编译时执行，我们需要将变量\
  \ `len` 改为 `constexpr`：\n\n```cpp\nconstexpr char name[]{\"Scott\"};\nconstexpr\
  \ auto len = StrLen(name); // 现在是 constexpr\nprintf(\"%zd\", len);\n```\n\n列表 12.2\n\
  \n现在编译器强制在编译时评估该变量的初始化器，以便在编译时为 `len` 赋值。传递给 `StrLen` 的数据必须是 `constexpr`。`constexpr`\
  \ 函数的关键点在于我们需要一个 `constexpr` 上下，这在标准中被称为*常量表达式*（constant expression）。\n\n幸运的是，随着语言的发展，某些限制被消除了。表\
  \ 12.1 提供了到 C++20 获得的所有 `constexpr` 函数的概述。\n\n#### 表 12.1：从 C++11 到 C++20 的 `constexpr`\
  \ 函数更新。\n\n| 功能 | 11 | 14 | 17 | 20 |\n| --- | --- | --- | --- | --- |\n| `void`\
  \ 作为返回值 | | ✓ | ✓ | ✓ |\n| 不限于单一 `return` | | ✓ | ✓ | ✓ |\n| 使用 `throw`^a | | ✓\
  \ | ✓ | ✓ |\n| `try`/`catch`-块^b | | | | ✓ |\n| `constexpr` 成员函数 `const` | ✓ | |\
  \ | |\n| `constexpr` 成员的 `inline` | | | ✓ | ✓ |\n| Lambda 可以隐式 `constexpr` | | |\
  \ ✓ | ✓ |\n| 使用 `new` / `delete` | | | | ✓ |\n| `constexpr virtual` 成员函数 | | | |\
  \ ✓ |\n| 内联 `asm` | | | | ✓ |\n\n^a 可能在 `constexpr` 路径上被调用。\n^b 因为我们无法抛出异常，所以永远无法在\
  \ `constexpr` 路径上到达 `catch`-块。\n\n我们在表 12.1 中看到了一些有趣的变化。在 C++14 中，`constexpr` 函数不能返回\
  \ `void` 的限制被消除了。但为什么呢？正如 `StrLen` 示例所示，我们需要将结果赋值 `constexpr` 变量，如果函数什么都不返回，是不可能的。原因在于类。假设我们有一个\
  \ `Point` 类：\n\n```cpp\nconstexpr Point move(Point p, double x, double y)\n{\n \
  \ p.SetX(p.GetX() + x);\n  p.SetY(p.GetY() + y);\n  return p;\n}\n\nvoid Use()\n\
  {\n  constexpr Point p = move({2, 2}, 3, 2);\n  printf(\"x:%lf y:%lf\", p.GetX(),\
  \ p.GetY());\n}\n```\n\n列表 12.3\n\n\n\n\n代码列表包含两个返回 `void` 的 `constexpr` 方法：`SetX`\
  \ 和 `SetY`。在 C++14 之前，这两个方法是不允许的，因为 `void` 不是字面量类型（literal type）。随着 C++14 的变化，我们可以在\
  \ `constexpr` 上下文中使用更常规的构造。\n\n从 C++14 开始，允许使用多个 `return` 语句。这消除了对递归函数的需要，并使 `constexpr`\
  \ 函数看起来更像普通的运行时函数。我们现在还可以在 `constexpr` 函数中使用 `throw`，但仅限于运行时路径。这意味着什么呢？请先看下方的示例。\n\
  \n``````cpp\nconstexpr double divide(int a, int b) {\n  if(0 == b) {\n    // #A\
  \ 如果在编译时不为 0，那么是没问题的\n    throw std::overflow_error(\"Divide by zero\");\n  }\n\n\
  \  return a / b;\n}\n\nint main() {\n  constexpr auto goodConstexpr = divide(3,\
  \ 2);  // #B constexpr 路径\n  auto           badRunTime    = divide(3, 0);  // #C\
  \ 运行时路径\n}\n```\n\n列表 12.4\n\n我们有一个函数 `divide` 用于除法两个数字 `a` 和 `b`。众所周知，只有林·李子能除以零，但我不是他。`divide`\
  \ 捕获了潜在的除零操作，如果有人用零调用 `divide`，就会抛出一个异常。由于 `divide` 的双重属性，输入值（更准确地说是 `b` 的值）决定了我们是否会在\
  \ `constexpr` 上下文中触发 `throw`。代码中使用的示例在 `constexpr` 路径没有触发 `throw`，但在运行时路径触发了。现在，如果在\
  \ `constexpr` 上下文中为 `b` 传入值 0，编译将会终止。\n\n如果你仔细考虑，这是合理的。在编译时异常意味着什么？对于给定的输入，该异常路径总是会被触发。这显然不是好事。这是所有在编译时发生的事情的一条准则。我们允许在\
  \ `constexpr` 函数中使用越来越多的语句，只要我们在编译期间期间不触发任何糟糕的语句。简单的原因是，`constexpr` 函数的双重属性再次使我们能够编写一个既可以在编译时运行又可以在运行时运行的单一函数。\n\
  \n### 12.1.1: 编译时执行的好处\n\n在编译时计算结果的好处是，不需要在运行时付出代价。此外，如果该函数在运行时环境中从未被调用，它的代码将不会出现在生成的二进制文件中。为什么要这样做呢？该函数只在编译时需要。\n\
  \n拥有可能更快且更小的二进制文件对用户和供应商都有好处。更快可能意味着特定的应用程序现在可以执行更多事情。例如，设备的电池寿命可能会更长，因为现在实现相同结果所需的计算更少了。\n\
  \n更小的二进制尺寸可以让供应商为应用程序或设备添加更多功能。如此，用户也受益。\n\n### 12.2: `is_constant_evaluated`: 这是一个\
  \ `constexpr` 上下文吗？\n\n在 C++20 之前，没有机制可以在函数内部检测评估是在编译时还是运行时。这一信息很有趣，因为某些构造在 `constexpr`\
  \ 函数的评估路径中是不允许的。\n\n一个早期的例子是 `throw`。从 C++14 开始，我们可以在 `constexpr` 函数中使用 `throw`\
  \ 表达式，只要该表达式在常量求时间内不被触发。一旦在编译时触发了此类表达式，编译器就会报告错误，说明该函数不满足 `constexpr` 函数的要求。\n\n\
  ```cpp\nconstexpr bool Fun(bool b) {\n  if(b) throw int{42};\n  return true;\n}\n\
  static_assert(Fun(false)); // #A OK\nstatic_assert(Fun(true));  // #B 导致编译错误\n```\n\
  \n列表 12.5\n\n列表 12.5 显示了一个包含 `throw` 的 `constexpr` 函数。根据参数 `b`，`Fun` 要么抛出异常要么不。在实践中，`std::is_constant_evaluated`\
  \ 告诉你处于什么上下文中。通过这个工具，我们可以将 `Log` 封装在 `if` 中中。\n\n```cpp\nconstexpr bool Fun(bool\
  \ b) {\n  if(b) throw int{42};\n  return true;\n}\n```\n\n等待，让我们根据提供的逻辑流重新对齐文本：\n\
  \n列表 12.5 显示了一个包含 `throw` 的 `constexpr` 函数。根据参数 `b`，`Fun` 要么抛出异常要么不。在实践中，`std::is_constant_evaluated`\
  \ 告诉你处于什么上下文中。通过这个工具，我们可以将 `Log` 封装在 `if` 中。\n\n```cpp\nconstexpr bool Fun(bool\
  \ b) {\n  if(b) throw int{42};\n  return true;\n}\n```\n\n列表 12.6\n\n列表 12.6 显示了一个包含\
  \ `throw` 的 `constexpr` 函数。根据参数 `b`，`Fun` 要么抛出异常要么不。在实践中，`std::is_constant_evaluated`\
  \ 告诉你处于什么上下文中。通过这个工具，我们可以将 `Log` 封装在 `if` 中。\n\n```cpp\nconstexpr bool Fun(bool\
  \ b) {\n  if(b) throw int{42};\n  return true;\n}\n```\n\n列表 12.7\n\n列表 12.7 显示了一个包含\
  \ `throw` 的 `constexpr` 函数。根据参数 `b`，`Fun` 要么抛出异常要么不。在实践中，`std::is_constant_evaluated`\
  \ 告诉你处于什么上下文中。通过这个工具，我们可以将 `Log` 封装在 `if` 中。\n\n```cpp\ntemplate<typename... Args>\n\
  constexpr void Log(std::string_view fmt, const Args&... args) {\n  if(!std::is_constant_evaluated())\
  \ {\n    printf(fmt.data(), args...);\n  }\n}\n```\n\n列表 12.7 中的代码显示 `std::format`\
  \ 现在允许我们在两种上下文中调用 `Log`。在编译时，`Log` 什么都不做。在运行时，它执行其通常的工作。这种变化可能意义不大，但有更多的函数变成了 `constexpr`。\n\
  \n### 12.2.1: 编译时和运行时的不同之处\n\n\n\n我们已经在第 1 节通过列表 10.3 讨论了字节交换（byte swapping）。列表\
  \ 10.3 中给出的解决方案做了三件事：\n\n*   允许将字符传递给 `ByteSwap` 以保持一致性。对它们不执行任何操作；\n\n*   在大端序机器上不执行任何操作；\n\
  \n*   `ByteSwap` 是 `constexpr`。\n\n根据我们当时讨论的特性，这是我们能做的最好的，而且我认为通用的 `ReverseBytes`\
  \ 令人难以置信，但我更喜欢模板和 Lambda 表达式。实际上，尽管列表 10.3 中的 `ByteSwap` 非常棒，但该解决方案有一个缺陷：代码在运行时的性能可能比直接使用\
  \ `htonl` 等函数差。原因是编译器有用于交换字节的特殊内置函数（intrinsics）。例如，LLVM 提供了 `__builtin_bswap32`。通过手动实现这些内置函数，存在编译器可能不再理解我们在做什么的风险。让我们做得更好。`std::is_constant_evaluated`\
  \ 告诉你处于什么上下文中。\n\n\n\n\n\n```cpp\ntemplate<std::integral T>\nconstexpr T ByteSwap(T\
  \ value)\n{\n  if constexpr(std::endian::native == std::endian::big ||\n       \
  \        (sizeof(value) == 1)) {\n    return value;\n  } else {\n    if(std::is_constant_evaluated())\
  \ {\n      return ReverseBytes(value);\n    } else {\n      if constexpr(std::same_as<T,\
  \ uint64_t>) {\n        return htonl(value >> 32) |\n               (static_cast<uint64_t>(htonl(value))\
  \ << 32);\n      } else if constexpr(std::same_as<T, uint32_t>) {\n        return\
  \ htonl(value);\n      } else if constexpr(std::same_as<T, uint16_t>) {\n      \
  \  return htons(value);\n      }\n    }\n  }\n}\n```\n\nListing 12.8\n\n列表 12.8\
  \ 中的代码与列表 10.3 中的代码略有不同。原因是由于该类型需要多次使用，因此函数模板比简写函数模板更好。除此之外，唯一的变化是使用了 `std::is_constant_evaluated`\
  \ 来决定应该使用 `ReverseBytes` 还是 `htons` 家族函数。这样，你就可以确保始终能够获得最佳性能。\n\n顺便提一下，在我的测试中，Clang\
  \ 和 GCC 都能在 `-O1` 优化下将 `ReverseBytes` 优化为 `bswap` 指令。如今的编译器非常强大。\n\n### 12.2.2：`is_constant_evaluated`\
  \ 是运行时值\n\n虽然我向你们引入了 `std::is_constant_evaluated`，但有一点重要的需要理解：该函数根据是否是常量求值来产生值，但这在编译时始终为真。让我给你们展示一个使用之前\
  \ `Log` 实现的示例。聪明的人可能会说，为什么不使用 `constexpr if` 来评估 `is_constant_evaluated` 呢？这种方法在列表\
  \ 12.9 所示。\n\n```cpp\ntemplate<typename... Args>\nconstexpr void Log(std::string_view\
  \ fmt, const Args&... args)\n{\n  if constexpr(not std::is_constant_evaluated())\
  \ {\n    printf(fmt.data(), args...);\n  }\n}\n```\n\nListing 12.9\n\n编写这样的代码可能很有诱惑力。但转念一，你可能会发现在常量求值的上下文中询问求值是否为常量，并不是正确的做法。在\
  \ `constexpr if` 中，`std::is_constant_evaluated` 将始终返回 `true`，因为该函数始终在编译期间求值。由于这个\
  \ `constexpr if` 在编译时失败，`if` 块内部的代码甚至不会被编译，因此，你永远看不到你的输出，即使在运行时也不行。\n\n## 12.3：更宽松的\
  \ `constexpr` 函数限制\n\n与之前的 C++ 标准一样，如表 12.1 所示，C++20 放宽对 `constexpr` 函数的一些限制。其中包含了一些更常见的场景，例如在\
  \ `constexpr` 函数中使用 `inline`，以及允许使用 `try-catch` 块。这些都只在运行时路径中允许，因此在编译期间实际上没有影响。随着在\
  \ `constexpr` 函数中允许动态分配，我们正在看到一种完全全新的能力，它为各种应用开启了大门。\n\n### 12.3.1：`new` / `delete`：编译期间的动态分配\n\
  \n`constexpr` 最重大的变化可能是允许在这些函数中使用动态分配。不仅在运行时路径，我们被允许在编译期间使用它们！通常，`constexpr` 允许越来越多的语句，但仅限于运行时路径。在你们感到太兴奋之前，让我们看看这些动态分配是如何工作的。\n\
  \n规则是，在编译期间分配的所有内存必须在编译期间释放。这对于这种动态分配的使用方式是一个重大限制。理由是，编译期间分配的动态内存在运行时会去哪里呢？答案之一是编译时的动态内存可以转换为栈上的内存。此类对象必须是不可变的，这样没有人可以释放这些内存。虽然在标准化过程中讨论过这种方法，但被舍弃了。相反，我们将从只能存在于某一个世界中的分配开始。\n\
  \n以下动态分配元素在 `constexpr` 函数中允许：\n\n*   `new` 表达式；\n*   `delete` 表达式；\n*   对 `std::allocator<T>::allocate`\
  \ 实例的调用；\n*   对 `std::allocator<T>::deallocate` 实例的调用；\n*   `construct_at`；\n* \
  \  `destroy_at`。\n\n请注意，目前不允许使用 placement new。你不能在类内部使用 `new` 运算符。只允许全局 `new`。\n\
  \n### 12.3.2：`constexpr` `std::vector`\n\n在编译时使用动态分配的选择带来了一全新的应用。在 C++20 中，这一限制的解除为我们带来了\
  \ `constexpr` `std::vector`，以及 `constexpr` `std::string`。这两者的实现都是是因为动态分配，同时也因为 `constexpr`\
  \ 函数内部的 `try-catch` 块。为了实现这些技巧，`std::is_constant_evaluated` 也是必要的。\n\n## 12.4：利用新的编译世界：绘制赛车游戏\n\
  \n既然我们已经看到了各种 `constexpr` 的改进，让我们探索一下用它们能做什么。为此，假设我们正在创建一个赛车游戏。嗯，只是一个草图。\n\n```cpp\n\
  struct Car {  #A 所有汽车的基类\n  virtual ~Car()            = default;\n  virtual int\
  \ speed() const = 0;\n};\n\n// #B 具有不同速度的具体汽车\nstruct Mercedes : Car {\n  int speed()\
  \ const override { return 5; }\n};\nstruct Toyota : Car {\n  int speed() const override\
  \ { return 6; }\n};\nstruct Tesla : Car {\n  int speed() const override { return\
  \ 9; }\n};\n\n// #C 创建汽车的工厂函数\nCar* CreateCar(int i)\n{\n  switch(i) {\n    case\
  \ 0: return new Mercedes{};\n    case 1: return new Toyota{};\n    case 2: return\
  \ new Tesla{};\n  }\n  return nullptr;\n}\n```\n\nListing 12.10\n\n有了这个游戏的最最小部分，让我们假设游戏中有一个对话框显示可用的最快汽车。一个专门的函数\
  \ `FastestCar` 通过实例化每个可用汽车的对象并比较速度来确定汽车。显然，速度最高的那个就是最快的。列表 12.11 展示了一个实现。\n\n\n\n\
  \n\n```cpp\nint FastestCar()\n{\n  int max = -1;\n  int maxId = -1;\n  for(int i\
  \ = 0; i < 3; ++i) {\n    auto* car = CreateCar(i);\n\n    if(car->speed() > max)\
  \ {\n      max = car->speed();\n      maxId = i;\n    }\n\n    delete car;\n  }\n\
  \n  return maxId;\n}\n```\n列表 12.11\n\n该方法非常简单，但它为我们提供了所需的数字，我们稍后可以用它显示最快的汽车。这种方法的缺点是，关于哪辆汽车最快的信息在编译时就已经确定了。这不需要浪费运行时间。这正是我们可以应用\
  \ C++20 给我们的所有新编译时元素的地方，列表 12.12 了所示。\n\n```cpp\nstruct Car {  // #A 所有汽车的基类\n \
  \ virtual ~Car()                      = default;\n  constexpr virtual int speed()\
  \ const = 0;\n};\n\n// #B 具有不同速度的各种具体汽车\nstruct Mercedes : Car {\n  constexpr int\
  \ speed() const override { return 5; }\n};\nstruct Toyota : Car {\n  constexpr int\
  \ speed() const override { return 6; }\n};\nstruct Tesla : Car {\n  constexpr int\
  \ speed() const override { return 9; }\n};\n\n// #C 用于创建汽车的工厂函数\nconstexpr Car*\
  \ CreateCar(int i)\n{\n  switch(i) {\n    case 0: return new Mercedes{};\n    case\
  \ 1: return new Toyota{};\n    case 2: return new Tesla{};\n  }\n\n  return nullptr;\n\
  }\n```\n列表 12.12\n\n我们首先在基类 `Car` 中为 `virtual` 抽象方法 `speed` 添加了 `constexpr`。与构造函数一样，当编译器提供实现时，析构函数也是隐式的\
  \ `constexpr`。因此，没有需要更改 `virtual` 默认析构函数。\n\n相应地，对于基类中的 `speed`，所有派生类重写的方法也被标记为\
  \ `constexpr`。\n\n剩下的要做工作是将 `CreateCar` 和 `FastestCar` 标记为 `constexpr`。后者在列表 12.13\
  \ 中所示，尽管这一变化是显而易见的。\n\n```cpp\nconstexpr int FastestCar()\n{\n  int max = -1;\n\
  \  int maxId = -1;\n  for(int i = 0; i < 3; ++i) {\n    const auto* car = CreateCar(i);\n\
  \n    if(car->speed() > max) {\n      max = car->speed();\n      maxId = i;\n  \
  \  }\n\n    delete car;\n  }\n\n  return maxId;\n}\n```\n列表 12.13\n\n就这些。我们现在准备好在编译时使用\
  \ `FastestCar` 并在那里确定最快汽车的索引。存储此索引，并在运行时准备好该值，而没有任何开销或计算时间。\n\n这是可能的，因为在 C++20 中我们可以拥有：\n\
  - `constexpr` 析构函数；\n- `constexpr` 的 `virtual` 函数；\n- `constexpr` 函数中的动态内存分配。\n\n\
  唯一的注意事项是 `CreateCar` 返回的原始指针。令我的是的是在 C++20 中 `std::unique_ptr` 不是 `constexpr`。在生产代码中，可能会写一个微小的\
  \ `unique_ptr` 来整理我的代码。列表 12.14 显示了这如何改变代码。然而，我在 C++23 中改进了这一点。在 C++23 中，`std::unique_ptr`\
  \ 是 `constexpr`。\n\n```cpp\nconstexpr std::unique_ptr<Car> CreateCar(int i)\n{\n\
  \  switch(i) {\n    case 0: return std::make_unique<Mercedes>();\n    case 1: return\
  \ std::make_unique<Toyota>();\n    case 2: return std::make_unique<Tesla>();\n \
  \ }\n  return nullptr;\n}\nconstexpr int FastestCar()\n{\n  int max = -1;\n  int\
  \ maxId = -1;\n  for(int i = 0; i < 3; ++i) {\n    if(auto car = CreateCar(i); car->speed()\
  \ > max) {\n      max = car->speed();\n      maxId = i;\n    }\n  }\n  return maxId;\n\
  }\n```\n列表 12.14\n\n我非常希望在 C++23 中，你可以按照列表 12.14 所示编写代码。\n\n## 12.5: `consteval`：保证在编译时执行的操作\n\
  \nC++20 为编译时世界带来了一个新关键字：`consteval`。该关键字可以用于标记函数，强制编译器始终在编译时求值它们。如果输入值不允许这样做，你将得到编译器错误。通常情况下，`consteval`\
  \ 的工作方式与 `constexpr` 完全相同。在那些地方不允许的语句在 `consteval` 函数中也不被允许。与 `constexpr` 的主要区别是\
  \ `consteval` 不具有双重属性。我们现在有了区分这三种情况的能力：\n\n1. `consteval`：仅编译时。如果函数无法在编译时求值，我们就会得到编译错误。\n\
  2. `constexpr`：编译时或运行时。取决于输入值以及结果是否在编译时使用，它可以在编译时求值，也可以在运行时执行。\n3. 无属性：普通的运行时函数。在运行时执行。\n\
  \n图 12.1 在视觉上表示了该描述。\n\n![](img/file20.png)图 12.1：编译时修饰符的分类。\n\n使用 `consteval` 对于确保特定代码永远进入二进制文件或在编译时计算的场景非常有帮助。\n\
  \n### 12.5.1: `as_constant` `consteval` 的用例\n\n通过 `constexpr`，你可能知道拥有 `constexpr`\
  \ 函数只是一部分。为了强制其在编译时执行，需要强制进入编译时求值。实现此点是将函数的赋值赋值一个 `constexpr` 变量，正如列表 12.15 所示。\n\
  \n```cpp\nconstexpr int ExpensiveCalculation(int base)\n{\n  return base + 1;  //\
  \ 嗯，开贵的\n}\n\nvoid Use()\n{\n  auto           value1 = ExpensiveCalculation(2);\
  \  // #A 运行时\n  constexpr auto value2 = ExpensiveCalculation(2);  // #B 编译时\n\n\
  \  //++value2;  // #C 不编译，value2 是 const\n}\n```\n列表 12.15\n\n在列表 12.15 中，#A 是一个运行时调用，因为在编译时不需要该值。你的编译器和优化器可能会产生异并仍然给你结果。尽管如此，从标准来看，在不依赖优化能力的情况下，#A\
  \ 在运行时调用。\n\n这就是为什么我们经常将变量标记为 `constexpr`，正如 #B 所示。我们实际上强制编译器在编译时求值变量的值。除了在变量上增加了\
  \ `constexpr` 关键字的额外字符外，这种方法是可以行的……只要你以后不需要修改该变量。这是因为 `constexpr` 变量隐含了 `const`。这就是\
  \ #C 所示的，由于增量无法编译，这行代码仅仅是注释。\n\n借助 `consteval` 和简写函数模板（参见 §1)），我们可以为自己构建一个实用的小助手\
  \ `as_constant`：\n\n\n\n\n\n```cpp\nconsteval auto as_constant(auto v) {\n  return\
  \ v;\n}\n```\n\nListing 12.16\n\n使用这个辅助函数，我们拥有了允许执行以下操作的超：\n\n```cpp\nauto value2\
  \ = as_constant(ExpensiveCalculation(2));  // #B 编译时\n\n++value2;  // #C 可编译\n```\n\
  \nListing 12.17\n\n由于 `consteval` 始终在编译时求值，我们可以将任何 `constexpr` 函数或常量值传递给 `as_constant`，强制其在编译时进行求值。理想的结果是，在\
  \ #B 中我们可以去掉变量的 `constexpr`，这使得我们稍后可以修改 `value2`，因为该变量不再是隐式的 `const` 了。\n\n`as_constant`\
  \ 有一个注意事项。这个辅助函数不仅要求构造函数是 `constexpr`，还要求析构函数也必须是。\n\n### 12.5.2: 为编译时检查强制编译时评估\n\
  \n虽然 `as_constant` 辅助函数有其用处，但我希望进一步探索如何利用 `consteval` 来改进你的代码。让我们假设想要构建一个字符串格式化函数\
  \ `format`，如列表 12.18 所示。\n\n```cpp\ntemplate<class... Args>\nstring format(std::string_view\
  \ fmt, const Args&... args);\n```\n\nListing 12.18\n\n`format` 函数是一个典型的变变模板，帮助我们维护类型安全。我们面临的问题之一是如何确保格式化字符串与参数匹配？对于像\
  \ `printf` 这样的标准元素，编译器会在编译时进行此类检查，一旦发现格式说明符与类型不匹配就会发出警告。问题所在在于，它们只能对已知的函数和类型这样做。对于我们自定义的\
  \ `format` 函数，它们做不到，因为它们无法知道这里的 `std::string_view`（Std-Box 1.6）是否真的意味着格式字符串。此外，当我们添加自定义格式说明符时，它们也会丢失。我们可以使用各种编译器特定的属性来教编译器这一点。这种方法需要额外的知识，并使代码依赖于编译器。更关键的部分是，我们必须记住这一步！难道我们不应该告诉编译器这种检查，这样就不会有人注意到了吗？\n\
  \n在我们用于编写其他代码的语言中编写此类检查的能力是有益的，共享代码也是如此。如果我们仍然需要运行时检查，又何必费力写编译时检查呢？让我们通过修改 `format`\
  \ 的签名，或者更准确地说，稍微修改格式字符串来解决这个问题，如列表 12.19 所示。\n\n```cpp\ntemplate<class... Args>\n\
  string format(format_string<Args...> fmt, const Args&... args);\n```\n\nListing\
  \ 12.19\n\n是的，这没什么变化。我们做的只是将 `std::string_view` 改为一个名为 `format_string` 的类型。`format`\
  \ 的参数包 `Args` 被转发给 `format_string`，但只转发了类型，而不是值。这看起来像是一个微小的改动，但正是这个变化开启了其余机制。现在，`format_string`\
  \ 知道了格式字符串和类型。记住，在此时我们不需要关心实际的值。检查只关于格式说明符是否匹配给定的类型。`format_string` 背后是什么？请在列表 12.20\
  \ 中自行查看。\n\n```cpp\ntemplate<class... Args>\nstruct basic_format_string {\n  std::string_view\
  \ str;  // #A 保存实际格式字符串\n\n  template<class T>\n  requires std::is_convertible_v<const\
  \ T&, std::string_view>\n  consteval basic_format_string(\n    const T& s)  // #B\
  \ 一个 consteval 构造函数\n  : str{s}\n  {\n    string out{};\n    // #C 使用常规格式化函数\n \
  \   Formatter(out, str, Args{}...);\n  }\n};\n\n// #D 让构造函数支持无参数工作\ntemplate<class...\
  \ Args>\nusing format_string =\n  basic_format_string<std::type_identity_t<Args>...>;\n\
  ```\n\nListing 12.20\n\n你可以看到 `format_string` 是一个存储了 `std::string_view` 的 `struct`\
  \ 模板。这个 `std::string_view` 之前在 `format` 的签名中暴露过。`basic_format` 额外拥有的 `consteval`\
  \ 构造函数。但这正是关键。得益于其他的放（即 `constexpr` 函数中的动态分配），我们可以使用 `std::string` 配合常规的 `Formatter`\
  \ 函数。将运行时执行实际格式化的代码与编译时代码共享，后者利用了在格式化错误时触发的 `throw`，从而产生编译时错误。\n\n这是一个各种看似独立的特性如何结合在一起的示例。`consteval`\
  \ 的威力帮助我们强制构造函数进入编译时执行。然后，编译期间的动态分配允许 `constexpr std::string` 的存在。这样一个编译时的 `std::string`。\n\
  \n### 12.5.3: `is_constant_evaluated()` 与编译时\n\n我想要指出的一个注意事项位于 #C。来自上一节，我们学了 `is_constant_evaluated()`\
  \ 被用于运行时 `if` 中。请考虑 id_2 中的示例。\n\n```cpp\nconsteval CompileTime(int i) {\n  return\
  \ i;\n}\n\nconstexpr int Dual(int i) {\n  if (is_constant_evaluated()) {\n    return\
  \ CompileTime(i) + 1;\n  } else {\n    return 42;\n  }\n}\n```\n\nListing 12.21\n\
  \n我们有一个 `constexpr` 函数 `Dual`。在这个函数内部，`is_constant_evaluated()` 被用于确定模式。目标是在编译时调用\
  \ `CompileTime`。这是一个 `consteval` 函数，因此它必须在编译时执行。从表面上看，这段代码看起来是合理的，但如果你将其交给编译器，它会拒绝这段代码。问题在于机制内部是如何工作的，特别是针对运行时的。运行时路径的结果是：\n\
  \n```cpp\nconstexpr int Dual(int i) {\n  if (false) {\n    return CompileTime(i)\
  \ + 1;\n  } else {\n    return 42;\n  }\n}\n```\n\nListing 12.22\n\n现在，`if` 恒为假，但它的体仍在那里。优化器或编译器会在某处剔除体，因为它们理解那的代码对于运行时是死代码。然而，这发生在\
  \ `if` 的体被求值之后。但这种求值触发了对 `CompileTime` 的调用。调用该函数需要传递参数 `i`，它现在是一个运行时值。这是一个运行时值，使得在编译时上下文之外求值\
  \ `CompileTime` 是可能的，导致编译器错误。\n\n## 12.6: `constinit`: 在编译时初始化非 `const` 对象\n\n\n\
  \n\n\n我们在本节中讨论的新关键字 `constinit` 与我们过的 `constexpr` 或 `consteval` 略有不同。虽然 `constexpr`\
  \ 和 `consteval` 都直接导致变化，但 `constinit` 是一种断言，用于断言变量是通过常量初始化（constant initialization）进行初始。\n\
  \n因此，`constinit` 的作用范围限于具有静态存储生存期（static storage duration）的变量，例如全局变量或 `static` 变量。表\
  \ 12.2 提供了不同的编译时关键字及其应用区域的概览。\n\n表 12.2：`constexpr`、`consteval` 和 `constinit` 的应用领域。\n\
  \n| 关键字 | 功能 | 局域变量 | 全局变量 | 局部 `static` 变量 |\n| --- | --- | --- | --- | --- |\n\
  | `constexpr` |  | #10003; |  | #10003; |\n| `consteval` |  | #10003; |  |  |\n\
  | `constinit` |  |  |  | #10003; |\n\n### 12.6.1: 静态初始化顺序问题\n\n当你正在与所谓的静态初始化问题作斗争时，断言变量在编译时初始化是有价值的。请考虑列表\
  \ 12.23 中的代码。\n\n```cpp\nstruct Air {\n  Air(int amount)\n  : _amount{amount}\n\
  \  {}\n\n  void Consume(int v) { _amount -= v; }\n  int  Available() const { return\
  \ _amount; }\n\nprivate:\n  int _amount;\n};\n\nstruct Human {\n  Human(int breath);\n\
  };\n\nAir   air{9};    // #A 创建全局空气 对象\nHuman human{5};  // #B 创建全局人类 对象\n\nHuman::Human(int\
  \ breath){\n  air.Consume(breath);  // #C 依赖 air\n}\n```\n列表 12.23\n\n这里有两个数据结构，`Air`\
  \ 和 `Human`。每当创建一个 `Human` 对象时，该对象就会消耗空气。因此，在 `Human` 的构造函数中有对 `air.Consume` 的调用。当然，在处理全局变量时，这本是你应该注意的事情。尽管如此，有时这是你（必须）写的代码。\n\
  \n我首先想引起你注意的是 `Air` 在声明中已经完全实现。它也可以是这些仅头文件类型之一。现在，由于某种原因，`Human` 只声明了它的构造函数，但实现是在行外的（out-of-line）。想象它位于一个\
  \ .cpp 文件中。\n\n第二点是 #A 和 `B` 创建了每种数据类型的两个对象。`Air` 对象最初包含了足够一个人类对象使用的空气。\n\n现在的问题是，如果我们检查（例如在\
  \ `main` 中）`air.Available`，返回的数字是多少？好吧，数学计算很简单，9 - 5 = 4。我们同意 4 是……我们的预期吗？观察所展示的代码，这个预期是正确的。\n\
  \n现在，如果代码发生微调，如列表 12.24 所示所示？\n\n```cpp\nHuman human{5};  // #B 创建全局人类 对象\nAir \
  \  air{9};    // #A 创建全局空气 对象\n```\n列表 12.24\n\n这里的区别是，`Human` 对象是在 `Air` 对象*之前*创建的。你仍然认为\
  \ `air.Available` 的结果是 4 吗？如果不是，结果是什么？\n\n答案是 9。因为在构造 `human` 时，`air` 还没有被构造。这就是所谓的静态初始化问题。这段代码可能会运行一段时间，直到某些重构移动了这两个变量的位置。也许它们在两个不同的编译单元中，而新的构建系统选择了单独编译顺序。砰，我们的程序在没有任何明显原因的情况下开始表现得异常。\n\
  \n将 `Air` 的构造函数设为 `constexpr` 是解决这种情况的方法。列表 12.25 所示的代码有效，无论两个对象 `air` 和 `human`\
  \ 的声明顺序如何。\n\n```cpp\nstruct Air {\n   constexpr  Air(int amount)\n  : _amount{amount}\n\
  \  {}\n\n  void Consume(int v) { _amount -= v; }\n  int  Available() const { return\
  \ _amount; }\n\nprivate:\n  int _amount;\n};\n```\n列表 12.25\n\n### 12.6.2: 确保常量初始化\n\
  \n将 `Air` 的构造函数设为 `constexpr` 是解决这种情况的方法。列表 12.25 所示的代码有效，无论两个对象 `air` 和 `human`\
  \ 的声明顺序如何。\n\n在这里应用 `constinit` 来断言常量初始化。变量必须在编译时初始化，如列表 12.23 所示。\n\n```cpp\nHuman\
  \ human{5};  // #B 创建全局人类 对象\nAir   air{9};    // #A 创建全局空气 对象\n```\n列表 12.26\n\n\
  你可以说 `constexpr` 等于 `constinit` 加上 `const`。这赋予了我们区分的能力。\n\n表 12.3 提供了 `constexpr`\
  \ 和 `constinit` 含义的概览。该表也显示了应该避免的内容。\n\n要点笔记\n\n*   永远不要在 `constexpr if` 中使用 `std::is_constant_evaluated`。\n\
  *   使用 `constinit` 来断言常量初始化，并以此防止静态初始化问题。\n\n# 缩写词\n\n| ABI | 应用程序二进制接口 |\n| ADL\
