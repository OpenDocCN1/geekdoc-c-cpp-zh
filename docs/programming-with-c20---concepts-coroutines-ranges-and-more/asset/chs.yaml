  \ 打印)\n\n# 第 1 章：概念：强类型泛型代码的谓词\n\n模板自 C++ 诞生初期就一直存在。最近的标准更新添加了一些新功能，例如变长模板。模板使得泛型编程（Generic\
  \ Programming, GP）成为，其思想是抽象具体的算法以获取泛型算法。随后可以将它们与不同的类型结合使用，产生各种软件，而无需为每种类型提供专门的算法。泛型编程或模板元编程（TMP）是强大的工具。例如，标准模板库（STL）就大量使用了它们。\n\
  \n然而，模板代码一直有点……怎么说呢，很笨拙。当我们写泛型函数时，只需要写一次函数；然后它就可以应用于各种不同的类型。遗憾的是，当对不支持类型使用模板时，要发现任何错误都需要对编译器的错误信息有深入的理解。面对此类编译器错误信息，我们需要的只是一个未为类型定义的\
  \ `operator<`。问题在于，我们没有办法指定要求来防止误用，同时给出清晰的错误信息。\n\n## Concepts vs concepts vs `concepts`\n\
  \n本章包含一个额外的挑战。我们在本章中将讨论的语言特性被称为 Concepts（概念）。我们也可以自己定义一个概念，并且有一个 `concept` 关键字。当我指代该特性本身时，它的首字母是大写的，即\
  \ Concepts。当我指代单个概念定义时，使用小写版本，而代码字体版本的 `concept` 则指代该关键字。\n\n## 1.1：Concepts 之前的编程\n\
  \n让我们考虑一个简单的泛型 `Add` 函数。该函数应该能够相加传递给它的任意数量的值并返回结果。如下所示：\n\n```cpp\nconst int x =\
  \ Add(2,3,4,5);\nconst int y = Add(2,3);\nconst int z = Add(2, 3.0); // #A 这不应该编译\n\
  ```\n\n虽然 `Add` 的前两次调用 `x` 和 `y` 是没问题的，但第三次调用应该导致编译错误。在 #A 中，我们看到的是隐式转换，即由于 `3.0`\
  \ 导致的从 `int` 到 `double` 的提升。隐式转换可能是一好事，但在这种情况下，我倾向于显式化而不是丢失精度的风险。在这里 `Add` 应该只接受相同数据类型的任意数量的值。\n\
  \n为了让实现更具挑战性，假设我们不想在 `Add` 中使用 `static_assert` 来检查所有参数是否为相同类型。我们希望能够为 `Add` 提供一个重载选项，用以处理某些整数提升的情况。\n\
  \n我们从一个 C++1 的实现开始，以观察 Concepts 的威力。对于 `Add` 的实现，我们显然需要变长函数模板以及几个辅助函数。我在这里提供的实现需要两个辅助函数：`are_same_v`\
  \ 和 `first_arg_t`。你可以在列表 [1.1] 中看到实现。\n\n```cpp\ntemplate<typename T, typename...\
  \ Ts>\nconstexpr inline bool are_same_v =\n  std::conjunction_v<std::is_same<T,\
  \ Ts>...>;\n\ntemplate<typename T, typename...>\nstruct first_arg {\n  using type\
  \ = T;\n};\n\ntemplate<typename... Args>\nusing first_arg_t = typename first_arg<Args...>::type;\n\
  ```\n\n列表 1.1\n\n`are_same_v` 是一个 C++14 变量模板（Std-Box [1.2]），它的任务是在类型 trait `std::is_same`\
  \ 和 `std::conjunction_v` 的帮助下，确保传递给 `are_same_v` 的参数包中的所有类型相同。为此，变量模板使用了常用的技巧：从包中拆分第一个参数，并将所有其他参数与第一个参数进行比较。\n\
  \n### C++14：变量模板\n\n变量模板是 C++14 引入的。它们允许我们定义一个模板类型的变量。这一特性允许我们拥有像 π 这样的泛型常量：\n\n\
  ```cpp\ntemplate<typename T>\nconstexpr T pi(3.14);\n```\n\n列表 1.2\n\n另一个用例是让 TMP\
  \ 更具可读性。在 C++14 之前，每当我们有一个想要访问的带有值的类型 trait 时，我们需要这样做：`std::is_same<T, int>::value`。诚然地说，`::value`\
  \ 部分并不吸引人。变量模板允许将 `::value` 的值存储在变量中。\n\n```cpp\ntemplate<typename T, typename U>\n\
  constexpr bool is_same_v = std::is_same<T, int>::value;\n```\n\n列表 1.3\n\n`are_same_v`\
  \ 是一个 C++14 变量模板，它的任务是在类型 trait `std::is_same` 和 `std::conjunction_v` 的帮助下，确保传递给\
  \ `are_same_v` 的参数包中的所有类型相同。为此，变量模板使用了常用的技巧：从包中拆分第一个参数，并将所有其他参数与第一个参数进行比较。\n\n太棒了，现在我们有了辅助函数，让我们来实现\
  \ `Add`。[1.4]。\n\n```cpp\ntemplate<typename... Args>\nstd::enable_if_t<are_same_v<Args...>,\
  \ first_arg_t<Args...>>\nAdd(const Args& args) noexcept\n{\n  return (... + args);\n\
  }\n```\n\n列表 1.4\n\n在这个实现中，正如承诺，`Add` 是一个变长函数模板，我们从模板头部就能很快发现。如果向下看两行，我们可以看到函数的名称\
  \ `Add` 以及它接收 `const Args&`。`Add` 的主体揭示了我们使用 C++17 的折叠表达式（Std-Box [1.3]）应用于包的所有元素。\n\
  \n### C++17：折叠表达式\n\n在 C++17 之前，每当我们有一个参数包时，我们需要递归调用接收包的函数并拆分第一个参数。通过这种方式，我们可以遍历参数包。C++17\
  \ 允许我们将操作应用于包的所有元素。例如，`int result = (... + args);` 将 + 操作应用于所有元素。假设包包含三个对象，这个示例将产生\
  \ `int result = arg0 + arg1 + arg2;`。这比递归版本要短得多。后者需要在某个地方终止。而折叠表达式，这是由编译器自动完成的。\n\
  \n关于折叠表达式需要理解的一点是，只有当包展开带有括号并有一个像 + 这样的运算符时，它才是折叠表达式。\n\n到目前，我希望这些都是理解的。我强烈反对的部分（尽管那是我自己的代码）是带有\
  \ `enable_if_t` 的那行。是的，它是最先进的 `enable_if`，因为有了 `_t`，我们不需要在前面加上 `typename`。然而，这一行代码非常难以阅读和理解。取决于你对\
  \ C++ 的了解，它可能很容易，但请记得你刚学习 C++ 的日子。理解这一行代码需要学习很多东西。\n\n\n\n\n第一部分，或者说参数，是条件。在这里，我们传递了\
  \ `are_same_v`。如果该条件为真，下一个参数 `first_arg_t` 就会被启用。这接着它变成了 `Add` 的返回类型。对吧，你最初也漏掉了返回类型吧？如果条件为假，那么整个表达式将无法被实例化。我们将这里所使用的技术称为“替换失败不是错误”（SFINAE），而这个版本的\
  \ `Add` 并不是用于编译器的查找。结果是，我们可能会得到长达数页错误信息，编译器在其中告知我们它尝试过的 `Add` 的每一个重载。\n\n另一个细微的点是，在这种情况下，`enable_if`\
  \ 的作用与仅仅启用或禁用某些功能略有不同。它告诉我们该函数的要求。然而，`enable_if` 这个名字并没有提供太多线索。\n\n所有这些原因都是人们可能觉得模板极其难以处理的原因。但是，是的，我知道那些留下来的人已经适应了所有的缺点。\n\
  \n现在是时候看看在 C++20 中情况会发生什么变化了。\n\n## 1.2：开始使用概念（Concepts）\n\n回到最初的示例，我们忽略那些辅助函数，因为它们保持不变。列表\
  \ 1.5 展示了 `Add` 的 C++20 实现。\n\n```cpp\ntemplate<typename... Args> \n// #A 使用 are_same_v\
  \ 的 requires 句确保所有 Args 都是相同类型。\nrequires are_same_v<Args...> \nauto Add(Args&&...\
  \ args) noexcept\n{\n  return (... + args);\n}\n```\n列表 1.5\n\n在这里，我们可以看到 `Add`\
  \ 仍然是一个变变函数模板，这可能不是最大的惊喜。让我们再次跳过两行，进入 `Add` 的定义。首先映入眼帘的是返回类型。我选择了 `auto`。但重要的是，返回类型确实在那里了！函数签名的其余部分以及函数体都没有改变。我将这个返回类型视为第一个胜利。在此之前，`enable_if`\
  \ 盖了返回类型。\n\n最大的改进是带有 `requires` 的那行。这不正是这里真正发生的事情吗？这个函数 `Add` 要求 `are_same_v` 为真。仅此而已。我觉得这非常易读。意图被清晰地表达出来，没有模糊任何内容，也不需要奇怪的技巧。好吧，也许我们必须查一下\
  \ `are_same_v` 是做什么的，但我接受这一点。\n\n我们正在查看列表 1.5 中概念的构建块之一，即 requires 句（requires-clause）。\n\
  \n## 1.3：概念的应用领域\n\n在讨论如何创建概念之前，让我们先看看可以在哪里应用它们。图 1.1 列出了模板声明中所有我们可以应用概念的地方。\n\n\
  我们在 `C1` 中看到一个制约类型-类型（constraint-type）。在此处，我们只能使用概念。在模板头部，我们可以使用约束类型来代替 `class`\
  \ 或 `typename`，以便尽早声明该模板接收一个由编译器推导的类型，但该类型必须满足某些要求。\n\n下一个选项是 `C2`，使用 requires 句。我们已经在列表\
  \ 1.5 的 `Add` 示例中应用了它。在 requires 句中，我们可以使用概念或类型属性（type-traits）。`requires` 之后的表达式必须在编译时返回一个布尔值。如果该值为真，则要求（多个要求）被满足。\n\
  \n`C3` 和 `C4` 两个地方是相似的。它们都应用于限制它们的占位符类型。我们也可以使用概念来约束 `auto` 变量，我们稍后会看到。约束占位符类型仅适用于概念。不允许使用类型属性。在\
  \ `C4` 中，我们看到了你可能已经从 C++14 的泛型 lambda、Std-Box 1.8 中熟悉的 `auto` 作为参数类型。从 C++20 开始，它们不再限于泛型\
  \ lambda。\n\n最后，我们有尾随 requires 句（trailing requires-clause）。这与 requires 句类似。可以使用概念或类型属性，并可以使用布尔逻辑将它们组合。表\
  \ 1.1 提供了关于何时使用何种约束形式的指导。\n\n![](img/file0.png)图 1.1：我们可以约束模板或模板参数的不同位置。表 1.1：何时使用何种约束形式\n\
  \n| | 类型 | 使用时机 |\n| --- | --- | --- |\n| `C1` | 类型-类型 | 当你已经知道模板类型参数具有某些约束时使用它。例如，并不是所有类型都是允许的。在图\
  \ 1.1 中，类型被限制为浮点类型。 |\n| `C2` | requires 句 | 当你需要为模板参数添加约束时使用它。 |\n| `C5` | 尾随 requires\
  \ 句 | 用于类方法，根据模板参数对其进行约束。 |\n\n## 1.4：requires 表达式（requires-expression）\n\n我们已经见过了\
  \ requires 句的两种形式。现在是时候再次查看我们的 `Add` 示例，看看如何借助概念进行改进。目前的 `Add` 实现只限制了类型。让我们称之为 `Add`\
  \ 的 #A。\n\n*   **A**: `Add` 可以荒谬地只用一个参数调用。这是一个有趣的且经常被忽略的要求。\n*   **B**: `Args` 中使用的类型必须支持\
  \ `+` 操作。这是一个非常微妙的要求，一旦我们违反它，它会严厉地警告我们。\n*   **C**: `Add` 要求至少有两个参数。其他情况都是性能浪费。\n\
  *   **D**: 运算符 `+` 应该是 `noexcept`，因为 `Add` 本身是 `noexcept`。列表 1.5 之前的版本总是标记为 `noexcept`。为什么？因为它主要是在加数字，我不想在像\
  \ 3 + 4 这样的代码周围放一个 try-catch 块。由于 `Add` 是泛型函数，在 C17 之前编写异常安全性的检查是一个有趣的练习。\n*   **E**:\
  \ 运算符 `+` 的返回类型应与 `Args` 的类型匹配。如果类型 `T` 的 `operator+` 返回类型 `U`，将是令人的。有时这种行为有很好的理由，但在\
  \ `Add` 的情况下似乎并不合理。让我们也限制这一点。\n\n在标准上方实现所有这些要求为我们提供了 requires 表达式。图 1.2 展示了 requires\
  \ 表达式的样貌。\n\n![](img/file1.png)图 1.2：requires 表达式的组成部分。\n\n我把它读作 `requires` 类型的构造函数。你也可以将其视为一个没有返回类型的函数。在始终相同的名称\
  \ `requires` 之后，我们有一个可选的参数列表。像普通函数一样，这个参数列表可以为空也可以包含条目。重要的是，requires 表达式仅在编译时用于评估它带来的不同要求。它永远不会进入我们的二进制文件。\n\
  \n\n\n我们可以在 `requires-expression` 的参数列表中定义的参数可以是任何可用类型，例如 `int`、`char`、`std::string`\
  \ 或像 `MyClass` 这样的自定义类。由于 `requires-expression` 总是用于某种模板上下文，我们也可以引用模板参数，如图 1.2 中的\
  \ `T` 和 `U` 所示。\n\n在这些类型的限定符方面，我们拥有完全的自由。我们可以说 `requires-expression` 接受 `const T&`\
  \ 或 `const T*`。嗯，我们甚至可以开始进入“东西方 `const`”的争论。构建这些参数有助于我们稍后在 `requires-expression`\
  \ 的体中引用它们，我们将在 §1 中看到。\n\n`requires-expression` 的后续部分是体，就像函数一样。这个体本身带有一个要求。它必须包含至少一个要求。\n\
  \n## requires-clause 与 requires-expression 的区别\n\n一个 `requires-clause`（`C2`、`C5`）是一个布尔表达式。`requires-expression`\
  \ 则复杂得多。就像我们从 `noexcept` 中了解的那样。我们可以说一个函数是 `noexcept`，但也可以查询一个函数是否 `noexcept`。\n\
  \n我们可以将 `requires-clause` 视为评估布尔表达式的 `if`，而 `requires-expression` 则返回这样的布尔值。\n\n\
  ## 1.5: requires-expression 中的要求种类\n\n`requires-expression` 的体可以使用四种不同的要求：\n\n*\
  \   简单要求 (SR)\n*   嵌套要求 (NR)\n*   复合要求 (CR)\n*   类型要求 (TR)\n\n括号中的字母对用于在后续代码示例中的参考。\n\
  \n我们将使用 `Add` 来探索前三种要求，以及我们在 §1 中建立的要求。类型要求对于 `Add` 来说没有意义。它将在将在不使用 `Add` 的情况下进行解释。\n\
  \n### 1.5.1: 简单要求\n\n顾如名，简单要求检查一个简单的问题，即某个语句是否有效。对于 `Add` 示例，列表 1.6 描述了一个简单要求，用于检查\
  \ `Add` 体中使用的折叠表达式是否有效。\n\n```cpp\nrequires(Args... args) {\n  (... + args);  //\
  \ #C SR: args provides +\n}\n```\n列表 1.6\n\n此检查确保传递给 `Add` 的类型提供了 `operator+`。我们只需要检查我们的第一个要求\
  \ #C。\n\n### 1.5.2: 嵌套要求\n\n成功检查要求 #C 后，我们进入了下一个要求：嵌套要求。通过这种类型的要求，我们可以实现要求 #A 和\
  \ `B`，如列表 1.7 所示。嵌套要求可以嵌套所有其他类型类型。你可以将其视为在 `requires-expression` 内部启动一个新的 `requires-clause`\
  \ 的方法。\n\n```cpp\nrequires(Args... args) {\n  (... + args);                  //\
  \ #C SR: args provides +\n  requires are_same_v<Args...>;  // #A NR: All types are\
  \ the same\n  requires sizeof...(Args) > 1;  // #B NR: Pack contains at least two\
  \ elements\n}\n```\n列表 1.7\n\n嵌套要求评估表达式的返回值。在 #B 的情况下，嵌套要求确保参数包中至少有两个元素。每个嵌套要求前面的\
  \ `requires` 是至关重要的。如果没有这个 `requires`，我们所看到的就是一个简单要求。尽管简单要求很棒，但在此时它是错误的工具。在 #B 的情况下，无论参数包中有多少个元素，简单要求将始终返回\
  \ `true`。只有前面的 `requires` 使得它成为一个嵌套要求。这是一个你不应该掉入的陷阱。\n\n一个重要的备注是，我们在选定在 `requires-expression`\
  \ 的可选参数列表中定义的所有参数应该只作为未求值的的操作数出现。这意味着这些可选本地参数可以在 `sizeof` 或 `decltype` 表达式中使用。尽管如此，我们不能将它们传递例如传递给\
  \ `constexpr` 函数，因为即使在这种情况下，它们也会被求值。\n\n### 1.5.3: 复合要求\n\n函数 `Add` 的最后两个要求可以使用复合要求来检查。我们可以通过复合要求检查两件事：表达式的返回类型以及该表达式的\
  \ `noexcept` 属性。列表 1.8 显示了 `Add` 的要求 #D 和 #E 的复合要求。\n\n```cpp\nrequires(Args...\
  \ args) {\n  (... + args);                  // #C SR: args provides +\n  requires\
  \ are_same_v<Args...>;  // #A NR: All types are the same\n  requires sizeof...(Args)\
  \ > 1;  // #B NR: Pack contains at least two elements\n}\n```\n（注：输入文本中的列表 1.8 具有高度重复，为了可读性对代码块进行了清理，同时保持了所描述的逻辑。）\n\
  \n\n\n\n好的，到这里，我们创建了一个 `requires` 表达式，它检查了我们在 §1 中为 `Add` 建立的所有要求。接下来，让我们如何将这个 `requires`\
  \ 表达式附加到函数 `Add` 上。\n\n### 1.5.4: 类型要求\n\n类型要求是 `requires` 表达式中可以拥有的最后一种要求的变体。这种要求断言某个特定类型是有效的。列表\
  \ 1.9 定义了一个名为 `containerTypes` 的概念，用于检查给定的类型 `T` 是否提供了 C++ STL 分配容器通常提供的所有类型。\n\n\
  ```\n[](#cb11-1)template<typename T>\n[](#cb11-2)concept containerTypes = requires(T\
  \ t)\n[](#cb11-3){  // #A 测试 T 中的各种类型\n[](#cb11-4)  typename T::value_type;\n[](#cb11-5)\
  \  typename T::size_type;\n[](#cb11-6)  typename T::allocator_type;\n[](#cb11-7)\
  \  typename T::iterator;\n[](#cb11-8)  typename T::const_iterator;\n[](#cb11-9)};\n\
  ```\n\n列表 1.9\n\n在这里你可以看到，类型要求总是以 `typename` 开头。如果我们省略 `typename`，它就变回简单的要求。\n\n\
  ### 1.6: 特设约束 (Ad hoc constraints)\n\n最简单的形式是将 §1 构建的 `requires` 表达式附加到 `Add` 的\
  \ `requires` 子句中，如列表 1.10 所示。\n\n```\n[](#cb12-1)template<typename... Args> \n[](#cb12-2)requires\
  \ LSTGB requires(Args... args)\n[](#cb12-3){\n[](#cb12-4)  (... + args); \n[](#cb12-5)\
  \  requires are_same_v<Args...>; \n[](#cb12-6)  requires sizeof...(Args) > 1;\n\
  [](#cb12-7)  { (... + args) } noexcept -> same_as<first_arg_t<Args...>>;\n[](#cb12-8)}LSTGE\n\
  [](#cb12-9)auto Add(Args&&... args) noexcept\n[](#cb12-10){\n[](#cb12-11)  return\
  \ (... + args);\n[](#cb12-12)}\n```\n\n列表 1.10\n\n灰色部分是我们在 §1 中开发的代码，即 `requires`\
  \ 表达式。你可以看到 `requires` 表达式的第一行（以 `requires` 开头）前面有一个 `requires`。所以我们看到的是 `requires\
  \ requires`。我们在这里看的是所谓的“特设约束”（ad hoc constraint）。第一个 `requires` 引入了图 1.1 中的 `requires`\
  \ 子句 `C2`，而第二个启动了 `requires` 表达式。当然，我们也可以将 `requires` 表达式附加到尾随的 `requires` 子句上，即图\
  \ 1.1 中的 `C5`。\n\n虽然特设约束很方便，但它是代码异味（code-smell）的第一个信号。我们刚刚花了一些时间开发 `requires` 表达式，但我们做的只能在一个地方使用它。是的，我假设复制粘贴是不可能的。`Add`\
  \ 的 `requires` 表达式可能是仅适用于 `Add` 的特殊内容。在这种情况下，在特设约束中使用它是可以的，但对于大多数要求来说并非如此。在使用特设约束之前，请务必三思。\n\
  \n我们该如何做得更好？你注意到我还没有向你展示概念（Concepts）吗？目前只是概念的构建块和应用领域。现在我们已经有了 `requires` 表达式，让我们开始用它创建一个概念。\n\
  \n### 1.7: 定义概念\n\n我们继续使用 `Add` 并使用 §1 中来自 `requires` 表达式来构建我们的第一个概念。图 1.3 释了概念的组成部分。\n\
  \n![](img/file2.png)图 1.3：概念的元素。\n\n概念总是以模板头（template-head）开始。这是因为概念是泛型代码中的谓词，这使得它们成为模板。概念的模板头具有与其他任何函数模板或类模板相同的权限和限制。我们可以使用类型和\
  \ NTTP（非类型模板参数）、`class` 或 `typename`，或者一个概念来声明模板类型参数。\n\n在模板头之后，图 1.3 显示了新关键字 `concept`。它启动了概念并告诉编译器这是概念的定义，而不是（例如变量模板）。\n\
  \n当然，概念必须有一个名称。我选择了 `MyConcept`，是的，我知道这是一个很棒的名字。在概念名称之后，我们看到了等号，后面跟着要求。我们将这些要求分配给我们的概念\
  \ `MyConcept`。如你所见，这些要求可以使用布尔代数组合在一起。图 1.3。\n\n### 1.8: 测试要求\n\n到为止，我们查看了不同类型的要求、如何应用它们，以及它们如何放入\
  \ `requires` 子句或概念中。现在是时候讨论验证我们的要求了。正如我之前说的，未来我们将花费大量时间开发概念，因此我们应该像测试普通代码一样测试它们。\n\
  \n测试概念的好处在于我们已经具备了所有要素。记住，概念只存在于编译期。我们有 `static_assert` 在编译期进行检查，因此不需要寻找框架。\n\n\
  我们继续使用 `Add` 或者更好的，创建的概念。类型必须是 `Addable`（或者当然，无效）以测试各种组合。我倾向于创建一个模拟不同类型的存根（stub）。存根如列表\
  \ 1.12//A 创建所需属性的类根\n[](#cb14-2)template<bool nexcept, bool operatorPlus, bool validReturnType>\n\
  [](#cb14-3)struct Stub {\n[](#cb14-4)    //B 可以启用受控的 noexcept 运算符\n[](#cb14-5) \
  \ Stub& operator+(const Stub& rhs) noexcept(nexcept) \n[](#cb14-6)      requires(operatorPlus\
  \ && validReturnType)\n[](#cb14-7)  { return *this; }\n[](#cb14-8)\n[](#cb14-9)\
  \  //C 无效返回类型的运算符\n[](#cb14-10)  int operator+(const Stub& rhs) noexcept(nexcept)\
  \ \n[](#cb14-11)      requires(operatorPlus && not validReturnType)\n[](#cb14-12)\
  \  { return {}; }\n[](#cb14-13)};\n[](#cb14-14)\n[](#cb14-15)//D 从类模板创建不同的存根\n[](#cb14-16)using\
  \ NoAdd               = Stub<true, false, true>;\n[](#cb14-17)using ValidClass \
  \         = Stub<true, true, true>;\n[](#cb14-18)using NotNoexcept         = Stub<false,\
  \ true, true>;\n[](#cb14-19)using DifferentReturnType = Stub<true, true, false>;\n\
  ```\n\n列表 1.12\n\n\n\n\n\n在这里，`Stub` 是一个带有三个 NTTP（非类型模板参数）#A 的类模板。第一个参数 `nexcept`\
  \ 控制 `Stub` 中 `operator+` 的实现是否标记为 `noexcept`。第二个参数 `operatorPlus` 使用 `Stub` 中 `operator+`\
  \ 的尾随 `requires` 子句来启用或禁用该运算符。最后，`validReturnType` 决定了 `operator+` 的返回类型是 `Stub`（由此，根据我们对\
  \ `Addable` 的要求，它是有效的）还是 `int`。对 `int` 的选择是任意的，只需要一个与 `Stub`不同的类型即可。\n\n在列表 1.12\
  \ 底部 #D 处，你可以看到通过为 `Stub` 的不同参数组合使用别名，提供了更具意义的用法。例如，我无法轻易想起 `Stub<true, false, true>`\
  \ 的作用是什么。尽管如此，我能理解 `ValidClass` 意味着该类型应该被 `Addable` 接受。\n\n好了，就这些这些了，至少在 Mock 的部分。有了这些，我们就拥有了开始编写测试所需的一切，如列表\
  \ 1.13 所示。\n\n```\n\n[](#cb15-1)// #A 断言不允许混合类型\n[](#cb15-2)static_assert(not Addable<int,\
  \ double>);\n[](#cb15-3)\n[](#cb15-4)// #B 断言 Add 至少与两个参数使用\n[](#cb15-5)static_assert(not\
  \ Addable<int>);\n[](#cb15-6)\n[](#cb15-7)// #C 断言类型具有 operator+\n[](#cb15-8)static_assert(Addable<int,\
  \ int>);\n[](#cb15-9)static_assert(Addable<ValidClass, ValidClass>);\n[](#cb15-10)static_assert(not\
  \ Addable<NoAdd, NoAdd>);\n[](#cb15-11)\n[](#cb15-12)// #D 断言 operator+ 是 noexcept\n\
  [](#cb15-13)static_assert(not Addable<NotNoexcept, NotNoexcept>);\n[](#cb15-14)\n\
  [](#cb15-15)// #E 断言 operator+ 返回相同类型\n[](#cb15-16)static_assert(\n[](#cb15-17)\
  \  not Addable<DifferentReturnType, DifferentReturnType>);\n```\n\n列表 1.13\n\n在这里，`static_assert`\
  \ 被用于测试 `Addable` 各种有效和无效类型的组合。太棒了，不是吗？全在我们喜爱的语言中，完全没有宏，完全没有任何外部测试框架。\n\n## 1.9:\
  \ 使用 `auto` 作为泛型参数的简写函数模板\n\n我们已经见过在函数模板中使用概念（concept）来约束模板参数三个地方。C++20 为泛型编程（GP）看起来更像普通编程打开了大门。我们可以在所谓的“简写函数模板”语法中使用概念。这种语法没有模板头，使得函数非常简洁。相反，我们声明一个看起来像普通函数的结构，将概念作为参数类型并配合\
  \ `auto` 使用。\n\n### 1.9.1: 这种构造的作用是什么？\n\n在后台，编译器为我们创建了一个函数模板。每个概念参数都变成一个独立的模板参数，并将相关的概念作为约束应用到上面。这使得这种语法成为编写函数模板的简写。简写函数模板语法让函数模板不再那么可怕，并且看起来更像普通编程。此类函数签名中的\
  \ `auto` 表明我们看的是一个模板。\n\n简写函数模板语法可以更简洁。约束概念是可选的。我们确实可以声明一个只有 `auto` 参数的函数。通过这种方式，C++20\
  \ 允许我们非常全面地创建函数模板。\n\n### 1.9.2: 示例用例：要求参数类型为可调用的（invocable）\n\n简写语法结合概念，使能够编写更少但更精确的代码。假设在一个系统中，某些操作在执行之前必须获取锁。例如，多个进程尝试向文件系统写入数据的多个系统操作。由于必须维护控制结构，一次只有一个进程可以写入，因此这种写操作通常由互斥锁或自旋锁锁定。得益于\
  \ C++11 的 lambda，我们可以写一个接受 lambda 作为参数的 `DoLocked` 函数模板。在函数体内部，`DoLocked` 首先使用 `std::lock_guard`\
  \ 获取全局互斥锁 `globalOsMutex`，并在离开范围后释放锁。然后在下一行，lambda 本身被执行，且已安全锁定，而不需要每个用户都知道使用哪种互斥锁。此外，范围是有限的，得益于\
  \ `std::lock_guard`，互斥锁会自动释放。死锁应该不再会发生。\n\n```\n[](#cb16-1)template<typename T>\n\
  [](#cb16-2)void DoLocked(T&& f)\n[](#cb16-3){\n[](#cb16-4)  std::lock_guard lck{globalOsMutex};\n\
  [](#cb16-5)\n[](#cb16-6)  f();\n[](#cb16-7)}\n```\n\n列表 1.14\n\n我在很多地方以不同的变体使用了这种模式，但我一直不喜欢其中一点。你能猜到吗？正确，`typename\
  \ T` 对用户来说并不直观。\n\n```\n[](#cb17-1)void DoLocked(auto&& f)\n[](#cb17-2){\n[](#cb17-3)\
  \  std::lock_guard lck{globalOsMutex};\n[](#cb17-4)\n[](#cb17-5)  f();\n[](#cb17-6)}\n\
  ```\n\n列表 1.15\n\n我在很多地方以不同的变体使用了这种模式，但我一直不喜欢其中一点。你能猜到吗？正确，`typename T` 对用户来说并不直观。\n\
  \n## 1.10: 在概念中使用 `constexpr` 函数\n\n当提到概念时，人们会想到 `constexpr` 函数，问题是，我们是否可以使用它们，或者更好的是将其作为结果的一部分？答案是肯定的，但前提是函数没有使用技巧。听起来很复杂对吧？列表\
  \ 1.16 提供了一个示例。\n\n```\n[](#cb18-1)// #A 带有默认参数的辅助函数\n[](#cb18-2)constexpr auto\
  \ GetSize(const auto& t = {})\n[](#cb18-3){\n[](#cb18-4)  return t.size(); #B 调用容器的\
  \ size 函数\n[](#cb18-5)}\n[](#cb18-6)\n[](#cb18-7)// #C 使用 T.size 的概念\n[](#cb18-8)template<typename\
  \ T, size_t N>\n[](#cb18-9)concept SizeCheck = (GetSize<T>() == N);\n[](#cb18-10)\n\
  [](#cb18-11)// #D 使用 SizeCheck 的函数\n[](#cb18-12)void SendOnePing(const SizeCheck<1>\
  \ auto& cont);\n```\n\n列表 1.16\n\n在 #A 中，我们看到了 `constexpr` 函数模板，或者准确地说，是一个简写函数模板。它接受单个参数，并假设其类型是可默认构造的。在函数体内，`GetSize`\
  \ 调用 `t.size()` #B。默认参数在这里是关键。但让我们先看看全貌。\n\n在 #C 的 `SizeCheck` 中，我们看到一个使用 `GetSize`\
  \ 并将其结果与 `N` 比较的概念。那里我们看到了两个有趣的地方。首先，`SizeCheck` 是一个接受类型和一个非类型模板参数（NTTP）的概念。顺序也是重要的，正如我们稍后看到的。在它的要求中，`SizeCheck`\
  \ 调用了 `GetSize`，并显式地使用 `T`（概念的类型参数）对其实例化。\n\n\n\n\n\n# D 展示了一个示例用法。函数 `SendOnePing`\
  \ 使用 `SizeCheck` 并将 `1` 作为 `NTTP`，以确保传递的任何容器的大小恰好为 `1`。我希望 `SendOnePing` 作为一个简短的函数模板，并不是这里最有趣的部分，而是调用\
  \ `SizeCheck` 的方式。编译器足够智能，可以推出函数的参数类型并将其作为第一个参数传递给概念 `SizeCheck`。第二个参数由我们显式指定。很酷，对吧？\n\
  \n列表 1.17 显示 `SendOnePing` 可以用一个大小为 1 的 `int` 类型 `std::array` 调用。该概念不允许任何其他大小。\n\
  \n```\n[](#cb19-1)std::array<int, 1> a{};\n[](#cb19-2)\n[](#cb19-3)SendOnePing(a);\n\
  ```\n列表 1.17\n\n我们必须采用的技巧是让概念的 `T` 成为概念内部使用的 `constexpr` 函数的一部分。我们不能使用\n\n```\n\
  [](#cb20-1)requires(T t) { requires t.size() == N; };\n```\n\n因为 `t` 被求值了，而 requires\
  \ 表达式的参数必须是非求值的。因此，我们使用了带有默认函数参数的跳板跳转（trampoline jump）。\n\n总结一下，我们可以在概念或嵌套要求中调用并使用\
  \ `constexpr` 函数的结果。然而，我们不能将参数从 requires 表达式传递给 `constexpr` 函数。\n\n## 1.11: 概念（Concepts）与受限的\
  \ `auto` 类型\n\n多年来，我们一些人一直在为形式如 `auto x = something;` 的占位符变量而苦恼。我经常听到的反对使用 `auto`\
  \ 代替具体类型的理由之一是，使用这种语法时，如果没有合适的集成开发环境（IDE），很难知道变量的类型。我同意这一点。在这个时候，有些人会告诉我们和其他使用一个合适的\
  \ IDE，问题就解决了。然而，根据我的经验，这并不能完全解决问题。以代码审查为例，它们通常发生在显示差异的浏览器或其他 diff 工具中，倾向于不提供上下文。尽管如此，使用\
  \ `auto` 变量也有很好的理由。它们帮助我们确定正确的类型，防止隐式转换或精度损失。Herb Sutter 多年前曾展示 [[1]](#ch018.xhtml_ref-SutterGotW-94-Solutio)，在很多情况下，我们可以将类型放在右侧，并以此留下线索。让我们来看一个\
  \ `auto` 使代码正确的示例。\n\n### 1.11.1: 受限的 `auto` 变量\n\n假设我们有一个 `std::vector` `v`，其中填充了几个元素。在某个时刻，我们需要知道这个向量中有多少个元素。获取此信息很容易。我们对\
  \ `v` 调用 `size()`。通常，生成的代码看起来像这样。\n\n```\n[](#cb21-1)auto      v    = std::vector<int>{3,\
  \ 4, 5};\n[](#cb21-2)const int size = v.size();  // #A int 是错误的类型\n```\n列表 1.18\n\
  \n这个示例使用 `int` 来存储大小。代码可以编译，并且在很多情况下运行正常。尽管如此，代码是不正确的。`std::vector` 的 `size` 函数并不返回\
  \ `int`。`size` 函数通常返回 `size_t`，但这不是保证的。正如此，vector 中有一个 `size_type` 定义，告诉我们正确的类型。这些细节很重要，特别是当你的代码运行在使用不同编译器和标准库的不同目标时。代码的版本是使用\
  \ `size_type` 而不是 `int`。要访问它，我们需要写出 vector，包括它的参数，这使得语句很长且可能对初学者不利。\n\n```\n[](#cb22-1)auto\
  \ v = std::vector<int>{3, 4, 5};\n[](#cb22-2)\n[](#cb22-3)// #A 使用正确的类型\n[](#cb22-4)const\
  \ std::vector<int>::size_type size = v.size();\n```\n列表 1.19\n\n到目前的替代方案是使用 `auto`，如下所示，由此让编译器推导类型并保持代码编写和阅读的简短。现在，代码在功能上更具可读性，但知道类型变得更难了。推导类型可能不是浮点类型，但只有在了解\
  \ STL 的情况下你才能确定。\n\n```\n[](#cb23-1)auto       v    = std::vector<int>{3, 4, 5};\n\
  [](#cb23-2)const auto size = v.size();  // #A 让编译器推导类型\n```\n列表 1.20\n\n这就是概念可以帮助我们兼顾两者的优点。想想我们通常在这些地方需要知道什么。不一定是精确的类型，而是该类型提供我们的接口。我们期望（接下来的代码可能要求）类型是某种整数类型。你还记得简短的函数模板语法吗？那里我们可以在\
  \ `auto` 前加上一个概念来约束参数的类型。我们可以对 `auto` 做相同的事情。\n\n```\n[](#cb24-1)auto       v  \
  \  = std::vector<int>{3, 4, 5};\n[](#cb24-2)const auto size = v.size();  // #A 限制\n\
  ```\n列表 1.21\n\n### 1.11.2: 受限的 `auto` 返回类型\n\n与其作为要求子句、尾随要求或约束类型应用概念，我们可以在函数模板中结合\
  \ `constexpr if` 使用 `SupportsValidation`，并且在方法存在时对 `T` 调用 `validate`。\n\n## 1.12:\
  \ 概念的力量：用 `requires` 代替 `enable_if`\n\n概念不仅仅是 SFINAE 和 `enable_if` 的语法替代品。概念扩大了应用领域。\n\
  \n### 1.12.1: 基于 `requires` 调用方法\n\n使用概念检查对象是否具有某个函数变得非常容易。结合 `constexpr if`，可以根据条件调用该函数。这是一个通过网络发送数据的函数模板。某些对象可能有一个验证函数进行一致性检查。其他对象（可能是简单的类型）不需要这样的函数，因此不提供。在概念出现之前，它们会提供一个空实现。从运行效率和二进制大小来看，这并不重要，感谢先进的优化器。然而，对于开发者来说，这意味着编写和阅读这些垃圾代码。多年来我们维护这些函数只是为了……什么。解决方案是使用\
  \ C++11、尾随返回类型中的 `decltype` 以及逗号运算符测试方法的存在。这些编写这些需要大量的模板代码，并且需要对所有元素及其组合有深入的理解。有了\
  \ C++20，我们可以定义一个包含简单要求的概念，命名为 `SupportsValidation`，然后就搞定了。\n\n```\n[](#cb25-1)template<typename\
  \ T>\n[](#cb25-2)concept SupportsValidation = requires(T t)\n[](#cb25-3){\n[](#cb25-4)\
  \  t.validate();\n[](#cb25-5)};\n```\n列表 1.22C++17: `constexpr if`\n\n这种 `if` 语句在编译时评估。只有一个分支会被保留。另一个根据条件在编译时被丢弃。例如，条件需要是类型特征的编译时常量或\
  \ `constexpr` 函数。\n\n\n\n\n\n```cpp\ntemplate<typename T>\nvoid Send(const T& data)\n\
  {\n  if constexpr(SupportsValidation<T>) { data.validate(); }\n\n  // actual code\
  \ sending the data\n}\n\nclass ComplexType {\npublic:\n  void validate() const;\n\
  };\n\nclass SimpleType {};\n```\n\nListing 1.23\n\n这允许我们提供不包含哑函数和代码的类型。通过这种方式，它们变得简洁且具有移植性。\n\
  \n### 1.12.2: 条件拷贝操作\n\n当我们创建任何包装器时，类似于 C++17 中的 `std::optional`（Std-Box 1.5），该包装器的行为应该像\
  \ `std::optional` 中封装的对象一样。一个 `wrapper<T>` 的行为应该像 `T`。标准规定，如果 `T` 是可拷贝构造的，则 `std::optional`\
  \ 应该有一个拷贝构造函数；如果 `T` 是平凡可析构的，则它应该有一个平凡的析构函数。这是合理的。如果 `T` 不可拷贝，那么像 `optional` 这样的包装器如何拷贝它的内容呢？即使你找到了实现方法，问题是，为什么这种包装器的行为应该有所不同呢？让我们只取第一个要求，并尝试使用\
  \ C++17 实现它：`optional` 当且仅当 `T` 是可拷贝构造时，才具有拷贝构造函数。这个任务相当简单。甚至有 `std::is_copy_constructible`\
  \ 和 `std::is_default_destructible` 等类型特性来完成这项工作。\n\n我们创建一个类模板，带有一个单模板参数 `T` 用于 `optional`\
  \ 封装的类型。存储值的一种方法是在对齐缓冲区中使用位置新内存（placement new）。由于这不应该是 `optional` 的完整实现，让我们先忽略对\
  \ `T` 值的存储。无论其封装类型的属性如何，`optional` 都是默认构造的。否则，`optional` 就不是“可选”的，因为它总是需要一个值。对于受限的拷贝构造函数，我们需要应用\
  \ `enable_if` 并检查 `T` 是否可拷贝构造，以及传递给拷贝构造函数的参数类型是否为 `optional`。由于这种方法的模板版本，这是我们必须进行的额外检查。生成的代码长度比解释它所需的文字还要短。\n\
  \n```cpp\ntemplate<typename T>\nclass optional {\npublic:\n  optional() = default;\n\
  \n  template<\n    typename U,\n    typename = std::enable_if_t<std::is_same_v<U,\
  \ optional> and\n                                std::is_copy_constructible_v<T>\n\
  \                               >>\n  optional(const U&);\n\nprivate:\n  storage_t<T>\
  \ value;\n};\n```\n\nListing 1.24\n\n之后，我们可以尝试我们这个闪亮的、诚然是简化版的实现。我们创建一个名为 `NotCopyable`\
  \ 的结构体。在该结构体中，我们将拷贝构造函数和拷贝赋值运算符都设置为删除（deleted）。到目前，我们只看了拷贝构造函数，但没关系。拷贝赋值运算符的行为相同。通过\
  \ `NotCopyable`，我们可以测试我们的实现。一个快速测试是创建 `optional<NotCopyable>` 对象，并尝试拷贝构造第二个对象，将第一个作为参数传递。\n\
  \n```cpp\n// #A 一个删除了拷贝操作的结构体\nstruct NotCopyable {\n  NotCopyable(const NotCopyable&)\
  \ = delete;\n  NotCopyable& operator=(const NotCopyable&) = delete;\n};\n\noptional<NotCopyable>\
  \ a{};\noptional<NotCopyable> b = a;  // #B 这应该失败\n```\n\nListing 1.25\n\n太棒了！代码编译通过了！噢等等，这不符合预期，不是吗？我们犯错了吗？是的，遗憾的是，这是一个很容易犯的错误。标准明确规定了什么是拷贝构造函数以及它的样子。拷贝构造函数绝不是模板。它完全遵循\
  \ `T(const T&)` 语法，仅此而已。现在的问题是，我们做了什么，或者具体地说，我们创建了什么？我们创建了一个转换构造函数。从另一个角度看代码，预期的拷贝构造函数接收一个\
  \ `U`。编译器无法知道该构造函数的实例化对于 `T` 之外的每个类型都会失败。\n\n```cpp\nstruct NotCopyable {\n  NotCopyable(const\
  \ NotCopyable&) = delete;\n  NotCopyable& operator=(const NotCopyable&) = delete;\n\
  };\n\ntemplate<typename T>\nclass optional : public std::conditional_t<copyable,\
  \ copyable, NotCopyable>\n{\npublic:\n  optional() = default;\n};\n```\n\nListing\
  \ 1.26\n\n```cpp\ntemplate<typename T>\nclass optional {\npublic:\n  optional()\
  \ = default;\n\n  optional(const optional&) requires std::is_copy_constructible_v<T>;\n\
  };\n```\n\nListing 1.27C++17: `std::optional`\n\n通过 `std::optional`，我们观察一种具有两种状态的类型。它可以包含一个值，也可以不包含。在无法在函数返回值中预留专用值来表示该值无法计算的情况下，这是一个巨大的胜利。诸如\
  \ `value_or` 或 `has_value` 等各种访问函数使其变得简洁而方便。每当你有一个可能不产生有效结果的函数时（例如外围设备不可用），`std::optional`\
  \ 不选择。\n\n### 1.12.3: 条件析构函数\n\n`optional` 的第二个要求是析构函数。为了尽可能提高效率，只有当类型是非平凡可析构时，才存在析构函数。否则，析构函数应该是默认的，使得这个\
  \ `optional` 实例保持平凡可析构。这只是复制封装类型行为的另一种变体。通常，条件析构函数与我们之前讨论的条件拷贝操作非常相似。有一个重要的区别。编译器从根本不允许我们创建模板析构函数。这避免了我们像之前那样的犯错误，即通过将拷贝构造函数模板化而未能禁用它。无论如何，C++17\
  \ 版本看起来与条件拷贝操作相似，只是多了一些额外的代码。\n\n\n\n\n好消息是，我们也可以在析构函数上使用尾随 `requires` 子句。尽管这个消息很好听，但像\
  \ `optional` 这种样的条件析构函数又有些不同。对于拷贝操作，只需启用或禁用它们即可。析构函数的情况则不同。在这里，如果包装的类型是平凡析构的（trivially\
  \ destructible），则析构函数应该采用默认；但如果 `T` 不是平凡析构的，我们需要一个析构函数来为 `optional` 的内部存储调用 `T`\
  \ 的析构函数。\n\n```cpp\n[](#cb31-1)template<typename T>\n[](#cb31-2)class optional {\n\
  [](#cb31-3)public:\n[](#cb31-4)  optional() = default;\n[](#cb31-5)  // 这里省略了真实的构造函数，因为它\n\
  [](#cb31-6)  // 并不重要\n[](#cb31-7)\n[](#cb31-8)  ~optional() requires(not std::is_trivially_destructible_v<T>)\n\
  [](#cb31-9)  {\n[](#cb31-10)    if(has_value) { value.as()->~T(); }\n[](#cb31-11)\
  \  }\n[](#cb31-12)\n[](#cb31-13)  ~optional() = default;\n[](#cb31-14)\n[](#cb31-15)\
  \  optional(\n[](#cb31-16)    const optional&) requires std::is_copy_constructible_v<T>\n\
  [](#cb31-17)  = default;\n[](#cb31-18)\n[](#cb31-19)private:\n[](#cb31-20)  storage_t<T>\
  \ value;\n[](#cb31-21)  bool         has_value{};\n[](#cb31-22)};\n```\nListing\
  \ 1.28\n\n### 1.12.4: 条件方法\n\n我们目前为止看到的拷贝操作和析构函数的处理适用于所有方法，包括默认构造函数在内的特殊成员，只要我们有一个类模板即可。\n\
  \n## 1.13: 概念排序\n\n我们偶尔会遇到这种情况，即我们需要知道编译器选择了哪个函数或方法，而编译器需要一种方式来做出该决定。我们在上一个列表中已经看到过这种情况。在最终解决方案中，两个析构函数中只有一个是受约束的，即在非平凡析构类型下激活的那一个。默认析构函数是不受约束的。那么，编译器是如何决定选择哪一个的呢？规则是：在重载集合中进行匹配的查找从约束最强的函数开始，逐步向下找到约束最弱的函数。没有约束的函数也被视为约束最弱的函数。在\
  \ `optional` 示例中，我们也可以为默认析构函数添加一个限制，要求它仅在平凡析构的类型上激活。我的建议是不要这样做。不要编写反向的 `requires`\
  \ 子句！应用最小约束原则。\n\n![](img/file3.png)\n图 1.4: 编译器从最约束到最小约束评估可能的受约束重载函数。\n\n在当前的 `optional`\
  \ 示例中，对于我们和编译器来说，确定约束最小和最约束的析构函数非常容易。如果情况变得更复杂呢？例如，有时类型由于是共享的，不会在析构函数中释放数据。一个例子是\
  \ Microsoft Windows 中的类 COM 对象。这样一个类的草图如下：\n\n```cpp\n[](#cb32-1)struct COMLike\
  \ {\n[](#cb32-2)  ~COMLike() {}    // #A 使其不可默认析构\n[](#cb32-3)  void Release();\
  \  // #B 释放所有数据\n[](#cb32-4)\n[](#cb32-5)  // 一些数据字段\n[](#cb32-6)};\n```\nListing\
  \ 1.29\n\n现在，我们假设 `optional` 对于具有 `Release` 方法的类型有不同的行为。在析构函数中，如果类型具有此类方法，`optional`\
  \ 应该调用 `Release`。对于没有 `Release` 方法的类型，则适用之前的行为。假设 `optional` 中的类型不是平凡析构的。在这种情况下，会在\
  \ `optional` 的析构函数中调用该类型的析构函数。否则，提供默认的默认析构函数。\n\n用于检测类型是否具有 `Release` 方法的概念 `HasRelease`，根据我们目前的知识，可以快速编写：\n\
  \n```cpp\n[](#cb33-1)template<typename T>\n[](#cb33-2)concept HasRelease = requires(T\
  \ t)\n[](#cb33-3){\n[](#cb33-4)  t.Release();\n[](#cb33-5)};\n```\nListing 1.30\n\
  \n接下来，我们为 `optional` 添加一个新的析构函数，它的 `requires` 子句使用了新的 `HasRelease` 概念，加上限制析构函数为非平凡析构类型的检查。在这个析构函数中，当\
  \ `optional` 析构时包含值时，我们调用 `Release`。\n\n```cpp\n[](#cb34-1)// #A 仅当非平凡析构时\n[](#cb34-2)~optional()\
  \ requires(not std::is_trivially_destructible_v<T>)\n[](#cb34-3){\n```\n\n\n\n```\n\
  [](#cb36-1)// #A 仅当非平凡析构的时\n[](#cb36-2)~optional() requires NotTriviallyDestructible<T>;\n\
  [](#cb36-3)\n[](#cb36-4)// #B 如果非平凡析构且具有 Release 方法\n[](#cb36-5)~optional() requires\
  \ NotTriviallyDestructible<T> and\n[](#cb36-6)  HasRelease<T>;\n[](#cb36-7)\n[](#cb36-8)//\
  \ #C 原始且具有 Release 方法\n[](#cb36-9)~optional() requires HasRelease<T>\n[](#cb36-10){\n\
  [](#cb36-11)  if(has_value) { value.as()->Release(); }\n[](#cb36-12)}\n[](#cb36-13)\n\
  [](#cb36-14)~optional() = default;\n```\n\n列表 1.33\n\n总而言来说，优先使用命名的概念（named concepts），而不是临时的约束（ad\
  \ hoc constraints）或类型特征（type-traits）。如果你希望从基于概念的复杂方法重载中受益于概念包含（concept subsumption），这一点尤为重要。\n\
  \n### 1.13.1: 包含规则细节\n\n有了目前为止的规则，我们已经准备就绪。尽管如此，我们有时仍需要更多细节。概念的包含规则可能会非常复杂。之前，我们得出结论：在\
  \ `requires` 子句中优先使用命名的概念，而不是其他任何东西。现在，让我们深入细节。考虑我们之前为变长参数 `add` 示例开发的 `AreSame`\
  \ 概念。这次，我们将概念简化为 `IsSame`，仅比较两个类型。\n\n为了说明，我们创建了另一个概念 `AlwaysTrue`，其值被设置为 `true`。这个概念的唯一目的是拥有第二个与\
  \ `IsSame` 不同的概念。我们重用之前的 `add` 函数并将其限制为两个模板参数。我们使用该函数并创建了两个方法。它们都称为 `add`，具有相同的参数和模板头部。仅由于\
  \ `AlwaysTrue` 概念的存在，其中一个比另一个具有更多的约束，而之前同时也具有 `IsSame` 概念。\n\n```\n[](#cb37-1)template<typename\
  \ V, typename W>\n[](#cb37-2)concept IsSame = std::is_same_v<V, W>;\n[](#cb37-3)\n\
  [](#cb37-4)template<typename T>\n[](#cb37-5)concept AlwaysTrue = true;\n[](#cb37-6)\n\
  [](#cb37-7)template<typename T, typename U>\n[](#cb37-8)requires IsSame<T, U>\n\
  [](#cb37-9)auto add(const T& t, const U& u)\n[](#cb37-10){\n[](#cb37-11)  return\
  \ t + u;\n[](#cb37-12)}\n[](#cb37-13)\n[](#cb37-14)template<typename T, typename\
  \ U>\n[](#cb37-15)requires IsSame<T, U> and AlwaysTrue<T>\n[](#cb37-16)auto add(const\
  \ T& t, const U& u)\n[](#cb37-17){\n[](#cb37-18)  return t + u;\n[](#cb37-19)}\n\
  ```\n\n列表 1.34\n\n该代码随后使用两个变量 `a` 和 `b` 调用，它们的类型均为 `int`。此时，值本身并不重要。重点在于“包含”，它关乎类型而不是值。\n\
  \n```\n[](#cb38-1)int a = 1;\n[](#cb38-2)int b = 2;\n[](#cb38-3)\nconst auto res\
  \ = add(a, b);\n```\n\n列表 1.35\n\n如所示，该代码目前可以编译并产生正确的结果。选择第二个 `add` 函数是因为它是约束更多的那一个。到目前为止，这与我们之前看到的\
  \ `optional` 的多个析构函数相同。如果交换第一个 `add` 函数的 `IsSame` 约束中交换 `T` 和 `U` 会怎样？`IsSame` 仍然会产生\
  \ `true`，因为所有参数都是 `int` 类型。两个函数都只使用概念，可能会出什么问题呢？\n\n```\n[](#cb39-1)template<typename\
  \ T, typename U>\n[](#cb39-2)// #A 参数交换了 T, U 对应 U, T\n[](#cb39-3)requires IsSame<U,\
  \ T>\n[](#cb39-4)auto add(const T& t, const U& u)\n[](#cb39-5){\n[](#cb39-6)  return\
  \ t + u;\n[](#cb39-7)}\n[](#cb39-8)\n[](#cb39-9)template<typename T, typename U>\n\
  [](#cb39-10)// #B 参数保持不变\n[](#cb39-11)requires IsSame<T, U> and AlwaysTrue<T>\n\
  [](#cb39-12)auto add(const T& t, const U& u)\n[](#cb39-13){\n[](#cb39-14)  return\
  \ t + u;\n[](#cb39-15)}\n```\n\n\n\n\n```cpp\ntemplate<typename T, typename U>\n\
  // #A 使用 not 取反 IsSame\nrequires(not IsSame<T, U>) auto add(const T& t, const U&\
  \ u) {\n  return t + u;\n}\n\ntemplate<typename T, typename U>\n// #B 使用 not 取反\
  \ IsSame\nrequires((not IsSame<T, U>)and AlwaysTrue<T>) auto add(\n  const T& t,\n\
  \  const U& u) {\n  return t + u;\n}\n```\n\n**Listing 1.38**\n\n为了保持的完整性，这里是 `add`\
  \ 函数以及调用它时的参数：\n\n```cpp\nint a = 1;\ndouble b = 2;\n\n// #C 对 add 的调用再次产生义\n//\
  \ const auto res = add(a, b);\n```\n\n**Listing 1.39**\n\n根据列表 [1.39] 所示的代码以及应用于它的参数，我们从编译器处得到了以下错误信息：\n\
  \n```cpp\nerror: call to 'add' is ambiguous\n  const auto res = add(a, b);\n   \
  \                ^~~\nnote: candidate function [with T = int, U = double]\n  auto\
  \ add(const T& t, const U& u)\n       ^\nnote: candidate function [with T = int,\
  \ U = double]\n  and AlwaysTrue<T> auto add(const T& t, const U& u)\n          \
  \              ^\nnote: similar constraint expressions not considered equivalent;\n\
  \    constraint expressions cannot be considered equivalent unless\n    they originate\
  \ from the same concept\nrequires (not IsSame<T,\n          ^~~~~~~~~~~~~\nnote:\
  \ similar constraint expression here\nrequires (not IsSame<T, U>)\n          ^~~~~~~~~~~~~~~~\n\
  1 error generated.\n```\n\n我们现在做了什么？我们使用了之前的辅助概念；我们甚至没有交换参数，所以这个辅助概念是没必要的。我们使用了概念，因此包含关系（subsumption）理应适用。正如你在最后一部分看到的，是的，参数是\
  \ `int` 和 `double`，这是两个不同的类型，所以它们应该可以通过编译，并且之前一样，第二个 `add` 函数是约束最强的，至少从我的观点来看是这样。然而，编译器并不认。编译器不同意是因为\
  \ `(not IsSame<T, U>)`。一旦对概念应用 `not` 或 `!`，操作数就变成了表达式的一部分。在这个语境下，一个表达式可以被视为源位置。两个概念只有当它们源自相同的编写源码（位置）时才是相等的。通过添加\
  \ `not` 并使整个部分成为一个表达式，两个取反的 `IsSame` 在编译器看来是不同的概念。\n\n这里的一个指导原则是对于概念要保持积极性，并尽量避免对它们进行取反。对于那些好奇的人，这就是为什么我在\
  \ `optional` 示例中选择 `NotTriviallyDestructible` 而不是 `not TriviallyDestructible` 的原因。\n\
  \n## 1.14: 改进的错误信息\n\n到目前，我们已经学习了如何编写和应用概念。通过这些，我们也看到了它们在编写泛型代码时带带来的改进。我经常指出，概念也会影响函数模板或类模板的使用。使用具名概念代替\
  \ `typename`，接口会变得更加鲜明。概念的另一个隐含目标是改进当你为模板提供无效参数时，从你喜爱的编译器处收到的错误信息。为了说明，让我们考虑一个函数模板\
  \ `PrintSorted`。这个函数正如其名称所暗示的那样。`PrintSorted` 一个容器作为参数并对容器中的值进行排序。该函数通过 STL 算法 `std::sort`\
  \ 实现。之后，`PrintSorted` 打印容器的每个元素。通常，一个非常直接的函数 `PrintSorted` 是一个模板，因为该函数应该适用于任何容器。\n\
  \n此外，我们还有另一个函数 `sortedVector`，它声明了一个带有若干值的 `std::vector<int>`。该函数随后调用了前面的函数 `PrintSorted`。总而言之，只有几行代码。\n\
  \n```cpp\ntemplate<typename T>\nvoid PrintSorted(T c)  // #A 通过拷贝以便排序\n{\n  std::sort(c.begin(),\
  \ c.end());\n\n  for(const auto& e : c) { std::cout << e << ' '; }\n\n  std::cout\
  \ << '';\n}\n\nvoid sortedVector()\n{\n  std::vector<int> v{3, 2};\n  PrintSorted(v);\n\
  }\n```\n\n**Listing 1.40**\n\n（注：Listing 1.40 提供的文本是片段化的；上述内容根据提供的上下文重建了逻辑流。）\n\n\
  \n\n\n我们中的有些人已经习惯了这种错误，并能够快速理解问题所在。我已经揭示了，`std::list` 并不满足 `random_access_iterator`\
  \ 概念。嗯，我们在错误中看到了很多 `iterator...`。问题是，概念（concepts）在这里有帮助吗？\n\n标准库带有一个 `random_access_iterator`\
  \ 概念。我们可以使用它并替换 `PrintSorted` 中的 `typename`。单此此就让该函数对用户来说更加清晰，但我之前已经提到过。\n\n```cpp\n\
  template<random_access_iterator T>\nvoid PrintSorted(T c)\n{\n  std::sort(c.begin(),\
  \ c.end());\n\n  for(const auto& e : c) { std::cout << e << ' '; }\n\n  std::cout\
  \ << '';\n}\n\nvoid sortedVector()\n{\n  std::vector<int> v{30, 4, 22, 5};\n\n \
  \ PrintSorted(v);\n}\n```\n\nListing 1.42\n\n通过这样做并保持其他一切不变，错误输出减少到了 26 行（请注意书籍的格式不同），指出有一个错误。\n\
  \n```cpp\n<source>:22:3: error: no matching function for call to\n   'PrintSorted\n\
  \  PrintSorted(v);\n  ^~~~~~~~~~~\n<source>:9:6: note: candidate template ignored:\
