  \ // 头头\n    dataElemDeleted = list->currentitem->data;\n    free(list->currentitem);\n\
  \    // 更新指针\n    list->previtem = list->currentitem = list->p;\n    // 返回被删除的元素数据\n\
  \    return dataElemDeleted;\n}\n\nvoid *getFirst(tllse *ready)\n{\n    // 返回就绪中的第一个元素的数据指针\n\
