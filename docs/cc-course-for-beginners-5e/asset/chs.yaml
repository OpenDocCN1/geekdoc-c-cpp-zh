  \ StartRecord(record *reg)\n{\n*(reg->reference) = 0;\nreg->price = 0.0;\n}\n\n\
  int exists(char *filename)\n{\nFILE *pf = NULL;\nint exist = 0; // 不存在\n// 文件是否存在？\n\
