  \n标识符 `name` 指向一个二维字符数组。该数组的行是一个字符字符串（一维字符数组），而 C/C++ 库提供了 `gets` 函数来从一维数组中读取数据。通过这种方式，读取一行（一个字符链）时，我们只需要使用一个索引。这不适用于数值数组。由于\
  \ C/C++ 库没有提供完整读取整行的函数，因此二维数组在逻辑上是可行的。\n\n继续对上一个程序的分析，数据输入会在输入文件结束标记（EOF）或输入了所有名称后将结束。\n\
  \n同样地，一旦数据输入完成，程序会询问你是否想要显示数组的内容。在这种情况下，通过 `getchar` 获取答案。\n\n我观察了判断语句：\n\n```c\n\
  answer = tolower(getchar());\n```\n\n等同于：\n\n```c\nanswer = getchar(); // 读取一个字符\n\
  answer = tolower(response); // 将其转换为小写\n```\n\n### 复制数组\n\nC 库不包含将一个数组复制到另一个数组的函数，字符数组或字符字符串除外，它们包含了：`strcpy`。因此，为了将一个数组复制到另一个数组，我们必须在其他计划中添加相应的代码。\n\
  \n作为一个示例，我们将编写一个程序，读取一个指定类型的二维数组 `a`，将数组 `a` 复制到另一个特征相同的数组 `c`，并按行可视化矩阵 `c`。\n\n\
  读取和写入数组我们在之前的程序中已经做过了。将一个数组传递到另一个是一个相似的过程。因此，将二维矩阵 `a` 复制到特征相同的矩阵 `c` 中，可以按照以下形状进行：\n\
  \n```c\nfor (row = 0; row < ROWS; row++)\n{\n    for (cabbage = 0; cabbage < COLS;\
  \ cabbage++) c[row][col] = a[row][col];\n}\n```\n\n这是完整的程序示例以供后续。\n\n```c\n/*******************\
  \ 将矩阵复制到另一个地方*****************/\n/*  copy_arrays.c\n*/\n#include <stdio.h>\n#define\
  \ ROWS 3\n#define COLS 3\n\nmain()\n{\n    float a[ROWS][COLS], c[ROWS][COLS];\n\
  \    int row = 0, cabbage = 0;\n    // 读取矩阵读取数据\n    for (row = 0; row < ROWS; row++)\n\
  \    {\n        for (cabbage = 0; cabbage < COLS; cabbage++)\n        {\n      \
  \      printf(\"a[%d][%d] = \", row, cabbage);\n            scanf(\"%f\", &a[row][col]);\n\
  \        }\n    }\n    // 将矩阵复制到 c\n    for (row = 0; row < ROWS; row++)\n    {\n\
  \        for (cabbage = 0; cabbage < COLS; cabbage++) c[row][col] = a[row][col];\n\
  \    }\n    // 从矩阵 c 写入数据 (row = 0; row < ROWS; row++)\n    {\n        // 写入一行\n\
  \        for (cabbage = 0; cabbage < COLS; cabbage++) printf(\"%10g\", c[row][col]);\n\
  \        printf(\"\\n\");  // 行后续\n    }\n}\n```\n\n执行程序：\n```\nto[0][0] = 1\na[0][1]\
  \ = two\na[0][2] = 3\nto[1][0] = 4\nto[1][1] = 5\nto[1][2] = 6\na[2][0] = 7\nto[2][1]\
  \ = 8\nto[2][2] = 9\n1 2 3\n4 5 6\n7 8 9\n```\n\n正如我们之前所说，C 库提供了一个复制字符数组的函数。同样，我们可以编写一个函数将一个数组复制到另一个数组，并修改上面的程序，使用此函数来实现复制操作。\n\
  \n将一个数组复制到另一个数组的函数必须有两个参数：目标矩阵和源矩阵。根据此，函数可能是这样的：\n\n```c\nvoid CopyArray(float destination[][COLS],\
  \ float origin[][COLS])\n{\n    int row = 0, cabbage = 0;\n    for (row = 0; row\
  \ < ROWS; row++)\n    {\n        for (col = 0; col < COLS++) destination[row][col]\
  \ = origin[row][col];\n    }\n}\n```\n\n在谈到一维数组时，我们提到当在函数中作为形式参数声明数组时，可以省略大小。同样的理论也适用于多维数组，但仅限于第一维度（因为在多维数组中，第一维度是元素本身为数组数组的大小），这也是我们在\
  \ `CopyArray` 函数中所做的。完整的程序示例以供后续。\n\n```c\n/******************* 复制数组*****************/\n\
  /*  copy_arrays.c\n*/\n#include <stdio.h>\n#define ROWS 3\n#define COLS 3\nvoid\
  \ CopyArray(float destination[][COLS], float origin[][COLS]);\n\nmain()\n{\n   \
  \ float a[ROWS][COLS], c[ROWS][COLS];\n    int row = 0, cabbage = 0;\n    // 读取矩阵读取数据\n\
  \    for (row = 0; row < ROWS; row++)\n    {\n        for (cabbage = 0; cabbage\
  \ < COLS; cabbage++)\n        {\n            printf(\"a[%d][%d] = \", row, cabbage);\n\
  \            scanf(\"%f\", &a[row][col]);\n        }\n    }\n    // 将矩阵复制到 c\n \
  \   CopyArray(c, a);\n    // 从矩阵 c 写入数据 (row = 0; row < ROWS; row++)\n    {\n  \
  \      // 写入一行\n        for (cabbage = 0; cabbage < COLS; cabbage++) printf(\"%10g\"\
  , c[row][col]);\n        printf(\"\\n\");  // 行后续\n    }\n}\n\nvoid CopyArray(float\
  \ destination[][COLS], float origin[][COLS])\n{\n    int row = 0, cabbage = 0;\n\
  \    for (row = 0; row < ROWS; row++)\n    {\n        for (col = 0; col < COLS++)\
  \ destination[row][col] = origin[row][col];\n    }\n}\n```\n\n### 字节块操作\n\n上一个节执行的\
  \ `CopiarMat` 函数的缺点是不自治的，因为它依赖于 `ROWS` 和 `COLS` 常量。让我们深入学习一下指针，我们将学习如何解决这个问题。然而，如果我们使用\
  \ C/C++ 库的 `memcpy` 函数，现在有一个直接的解决方案将块理解为一组连续的字节。下面的示例首先使用 `memset` 函数将矩阵 `a` 和 `c`\
  \ 初始化为 0；然后使用 `memcpy` 将矩阵复制到矩阵；最后使用 `memcmp` 逐字节比较内容是否相同。\n\n```c\n/*******************\
  \ 将矩阵复制到另一个地方*****************/\n/*  memxxx.c\n*/\n#include <stdio.h>\n#include\
  \ <string.h>\n#define ROWS 3\n#define COLS 3\n\nmain()\n{\n    float a[ROWS][COLS],\
  \ c[ROWS][COLS];\n    int row = 0, cabbage = 0;\n    // 读取矩阵读取数据\n    for (row =\
  \ 0; row < ROWS; row++)\n    {\n        for (cabbage = 0; cabbage < COLS; cabbage++)\n\
  \        {\n            printf(\"a[%d][%d] = \", row, cabbage);\n            scanf(\"\
  %f\", &a[row][col]);\n        }\n    }\n    // 初始化 c 为 0\n    memset(c, 0, sizeof(c));\n\
  \    // 将 复制到 c\n    memcpy(c, a, sizeof(a));\n    // 比较并输出\n    if (memcmp(a, c,\
  \ sizeof(a)) == 0) printf(\"数组 a 和 c 包含相同的数据\\n\");\n    else\n    printf(\"数组 a\
  \ 和 c 不包含相同的数据\\n\");\n}\n```\n\n## 结构体\n\n我们到为止使用的所有变量都允许我们存储一个数据且类型单一，除了存储了多个数据但都是相同类型的数组外。结构体的目的是将一个或多个（通常是不同类型的）变量组合在同一个名称下，以便于处理。\n\
  \n\n\n\n\n![](img/image18583.jpeg)[](Images/image18584.jpeg)[](Images/image18585.jpeg)[](Images/image18586.jpeg)[](Images/image18587.jpeg)结构的一个典型示例是一个文件，存储与个人相关的数据，如`Name`、`Surnames`、`address`等。其他编译器提供的`c`，建筑类型它们是记录记录。\n\
  \n![](img/image18588.jpeg)\n\n这些数据中的本身也可以是结构。例如，出生日期可能是一个包含`day`、`month`和`year`数据的结构。\n\
  \n## 创建结构\n\n要创建一个结构，你必须定义一个新的数据类型并声明一个该类型的变量。`struct` 类型的声明包含了组成它的元素以及这些元素的类型。结构中的每个元素接收一个成员名称（如果我们谈论的是记录，则称为字段）。语法如下：\n\
  \n```c\nstructure structure_type\n{\n    type member_1 ;\n    type member_2 ;\n\
  \    // ...\n    type member_n ;\n} [ 变量列表 ];\n```\n\n`struct` 关键字告诉编译器正在定义一个结构。`structure;\
  \ struct_type` 是命名新定义类型的标识符；每个成员可以是基本类型（`char`、`int`、`float`等），也可以是类型派生类型：`matrix`、`pointer`、`Union`、`structure`或`function`。例如：\n\
  \n```c\nstructure tfile /* 定义结构 tfile 的语句 */\n{\n    char name[40];\n    char address[40];\n\
  \    long phone;\n};\n```\n\n结构成员的声明不能包含限定符。存储类参数如`extern`、`static`、`auto`或`register`不能从这里开始。\n\
  \n```c\nstructure tfile /* 定义结构 tfile 的语句 */\n```\n\n![](img/image18589.jpeg){\n\
  ```c\nchar address[40];\n```\n}\n```c\n};\n```c\n```\n\nC 语言中的结构只能包含对应于变量定义的成员。相反，C++\
  \ 允许结构包含成员，甚至是函数定义的成员。\n\n## 从结构类型定义变量\n\n使用这种新类型的规则与预定义的类型（如`float`、`int`或`char`等）相同。也就是说，在定义结构类型后，可以从该类型声明变量。因此：\n\
  \n```c\nstructure structure_type [ 变量 [, 变量 ]...];\n```\n\n例如，以下代码定义了上一个示例中定义的`struct\
  \ tfile`类型的变量`var1`和`var2`；因此，`var1`和`var2`是具有`name`、`address`和`phone`成员的数据结构。\n\
  \n```c\nstructure tfile var1, var2;\n```\n\n我注意到在定义`var1`和`var2`时指定了`structure`单词，但逻辑上似乎可以写：\n\
  \n```c\ntfile var1, var2;\n```\n\n这在 ANSI C 中是不可能的，但在 C++ 中是允许的。然而，使用`typedef`（正如接下来的所示），我们可以获得前面的形式。例如：\n\
  \n```c\nstructure file\n{\n    char name[40];\n    char address[40];\n    long phone;\n\
  };\n\ntypedef structure file ttab;\ntfile var1, var2;\n```\n\n`typedef` 语句之前声明了结构`tab`的同义词`tfile`。也可以通过以下形状实现：\n\
  \n```c\ntypedef structure file\n{\n    char name[40];\n    char address[40];\n \
  \   long phone;\n} ttab;\n```\n\n```c\ntypedef structure\n{\n    char name[40];\n\
  \    char address[40];\n    long phone;\n} ttab;\n```\n\n结构`var1`和`var2`的定义也可以紧接在新类型的声明之后，如下例所示，尽管这并不是惯做法：\n\
  \n```c\nstructure tfile\n{\n    char name[40];\n    char address[40];\n    long\
  \ phone;\n} var1, var2;\n```\n\n你也可以像下面所示定义`var1`和`var2`；继续；即不留存新声明类型的记录，这种形式是不建议的，因为以后我们无法从该类型定义其他变量。\n\
  \n```c\nstructure\n{\n    char name[40];\n    char address[40];\n    long phone;\n\
  } var1, var2;\n```\n\n## 访问结构的成员\n\nC 语言中的结构只能包含对应于变量定义的成员。相反，C++ 允许结构包含成员，甚至是函数定义的成员。\n\
  \n访问结构的成员。结构的成员使用点`.`。例如，代码中的第一条语句将值 2323 赋值给`var1`的成员，第二条从`var2`中读取（例如）：\n\n```c\n\
  var1.phone = 2323;\n```\n\n最后，可以说结构的成员是按字节顺序存储的，顺序与它们声明的顺序相同。见下图：\n\n![](img/image18592.jpeg)\n\
  \n## 结构的操作\n\n结构结构的变量允许以下操作：\n\n*   在定义时初始化它：\n```c\nstructure file person = { \"\
  Francisco\", \"Santander 1\", 232323, 25, 8, 1982 };\n```\n\n*   通过运算符`&`获取其方向：\n\
  ```c\nstructure file *pperson = &person;\n```\n\n*   访问其一个成员：\n```c\nlong phone\
  \ = person.phone;\n```\n\n\n\n\n\n```c\nanother_person = person;\n```\n\n当一个结构体赋值给另一个结构体时，所有的成员都会被一个一个地复制。目标结构体中的源结构体成员，无论其类型是哪一种；也就是说，我知道这是复制了整个结构体。\n\
  \n例如，下面的程序定义了类型为 `tfi-key` 的 `person` 结构体，并将通过键盘输入的数据分配给它的每个成员。兄弟们，将 `person` 结构体复制到相同类型的\
  \ `other_person` 结构体中，并在屏幕上显示最后一个结构体中存储的数据。\n\n```c\n/**********  结构体操作 *******/\n\
  \n/*  structures.c\n*/\n\n#include <stdio.h>\n\ntypedef structure\n{\nint day, month,\
  \ year;\n} tdate;\n\ntypedef structure\n{\nchar name[40]; char address[40]; long\
  \ phone;\ntdate date_of_birth;\n} ttab;\n\nmain()\n{\ntfile person, another_person;\n\
  // 输入数据  printf(\"Name: \"); gets(person.name);\n\nprintf(\"Address: \"); gets(person.address);\
  \ printf(\"Phone: \"); scanf(\"%ld\", &person.phone); printf(\"Date from birth:\\\
  n\"); printf(\"  Day:             \");\n\nscanf(\"%d\", &person.date_of_birth.day);\
  \ printf(\"  Month: \");\n\nscanf(\"%d\", &person.date_of_birth.month); printf(\"\
  \  Year: \");\n\nscanf(\"%d\", &person.date_of_birth.year);\n\n// 复制结构体到另一个 another_person\
  \ = person;\n// 打印新结构体中的数据 printf(\"\\n\\n\");\n\nprintf(\"Name: %s\\n\", other_person.name);\
  \ printf(\"Address: %s\\n\", another_person.address); printf(\"Phone: %ld\\n\",\
  \ another_person.phone); printf(\"Date from birth:\\n\");\n\nprintf(\"  Day: %d\\\
  n\", another_person.date_of_birth.day); printf(\"  Month:             %d\\n\", another_person.date_of_birth.month);\
  \ printf(\"  Year: %d\\n\", another_person.date_of_birth.year);\n}\n```\n\n程序执行：\n\
  Name: Xavier\nAddress: Paseo from Pereda 10, Santander Telephone: 942232323\nDate\
  \ from birth: Day: 12\nMonth: 7\nYear: 1987\nName: Xavier\nAddress: Paseo from Pereda\
  \ 10, Santander Telephone: 942232323\nDate from birth: Day: 12\nMonth: 7\nYear:\
  \ 1987\n\n### 结构体数组\n\n当矩阵的元素来自某种结构体类型时，该矩阵被称为结构体矩阵或记录矩阵。这是一种非常有用且强大的构造，它允许我们处理块状数据，在很多情况下，我知道这对应于对象，通常对应普通生命周期中的对象。\n\
  \n要定义一个结构体数组，你必须先声明一个结构体类型。该结构体与矩阵中元素的类型匹配。例如：\n\n```c\ntypedef structure\n{\nchar\
  \ name[60]; float note;\n} ttab;\n```\n\n然后，我以类似的方式定义矩阵，如下面的示例所示：\n\n```c\ntfile\
  \ student[100];\n```\n\n这个示例定义了一个名为 `student` 的结构体数组，包含 100 个元素（`student[0], student[1],\
  \ ..., student[i], ..., student[99]`），每个元素都是一个拥有 `name` 和 `note` 数据成员的结构体。要访问矩阵中元素\
  \ `i` 的姓名和分数，我们将使用以下符号：\n\n```\nstudent[i].name\nstudent[i].note\n```\n\n![](img/image18593.jpeg)note\
  \ name\n`student[i-1]`\n`student[i]`\n`student[i+1]`\n\n例如，为了应用目前为止解释的内容，我们将执行要求：读取一个学生列表以及特定课程对应的成绩；结果将是及格和不及格学生的百分比。继续执行程序的步骤如下：\n\
  \n* 声明结构体类型并定义结构体数组，此外定义任何其他必要的变量。\n* 设置一个循环读取并在矩阵中存储每个学生的姓名和分数。\n* 设置一个循环遍历数组的所有元素，并统计及格（分数大于或等于\
  \ 5）和不及格（其余）。\n\n```c\nfor (i = 0; i < no; i++)\nif (student[i].note >= 5)\nelse\n\
  suspended++;\n```\n\n* 写入及格和不及格的百分比。\n\n完整的程序如下面的继续示例所示。\n\n```c\n/********** 计算及格和不及格的百分比\
  \ *******/\n\n/*  matrix_of_st.c\n*/\n\n#include <stdio.h>\n#define NA 100 // 学生最大数量\n\
  \ntypedef structure\n{\nchar name[60]; float note;\n} ttab;\n\nmain()\n{\nstatic\
  \ tfile student[NA]; // 结构体或记录矩阵\nint n = 0, i = 0, approved = 0, suspended = 0;\n\
  char *finish = NULL; // 数据输入\nprintf(\"Enter data. \");\nscanf(\"%d\", &n);\nwhile\
  \ (n < NA)\n{\nprintf(\"Name: \");\ngets(student[n].name);\nprintf(\"Note: \");\n\
  scanf(\"%f\", &student[n].note);\nn++;\n}\nfor (i = 0; i < n; i++)\n{\nif (student[i].note\
  \ >= 5)\n    approved++;\nelse\n    suspended++;\n}\nprintf(\"\\n\\n\");\nprintf(\"\
  Approved: %.2f%%\\n\", (float)approved/n*100);\nprintf(\"Suspended: %.2f%%\\n\"\
  , (float)suspended/n*100);\n}\n```\n\n程序执行：\nEnter data: 3\nName: Xavier\nNote:\
  \ 8.5\nName: Maria\nNote: 4.0\nName: Jose\nNote: 9.0\n\nApproved: 66.67%\nSuspended:\
  \ 33.33%\n\n### 联合体 (JOINTS)\n\n联合体是一个由多个成员共享的存储区域，通常是不同的类型。这允许你使用同一内存处理不同类型的数据。联合体的声明与结构体的声明形式相同，只是使用了关键字\
  \ `union` 而不是 `struct`。因此，适用于结构体的所有内容都适用于联合体，但联合体的成员并不各自拥有独立的存储空间，而是共享一个大小等于最大成员字节数的空间。\n\
  \n```\nUnion union_type\n{\n/* 成员语句 */\n};\n```\n\n其中 `union_type` 是定义新类型的标识符。定义了联合体类型后，可以声明该类型的类型或多个变量，语法如下：\n\
  \n```c\nUnion union_type [ variable [, variable ]...];\n```\n\n要访问联合体中的确定成员，使用以下符号：\n\
  \n`union_variable.member`\n\n下面的示例说明了上述内容。它是一个类型为 `times` 的变量 `var1`，它可以存储字符链、整数或浮点数，但一次只能存储一条信息，而不是同时存储三者；换句话说，var1\
  \ 存储的数据可以根据字符字符串、整数或浮点数进行处理，取决于使用哪个成员来访问它。\n\n```c\nUnion times\n{\nchar cms[12];\n\
  int names;\nfloat temperature;\n};\n\nUnion times var1;\n```\n\n\n\n\n在下图中可以观察到，对应\
  \ `var1` 的成员并没有各自拥有独立的存储空间，而是共享一个大小等于最长成员字节数的空间，在本例中是 `cmes`（12 字节）。该空间允许存储一个包含\
  \ `'\\0` 在内的 `12` 个字符的字符串、整数或单精度浮点数。\n\n![](img/image18594.jpeg)`var1`\n\n`cms`\
  \ 或 `numbers` 或 `temperature`\n\n如果 `var1` 是结构体（struct）而不是联合体（union），如图所示，将需要 `12+4+4`\
  \ 字节的内存空间（假设 `int` 占用 `4` 字节）。\n\n![](img/image18595.jpeg)`cms` `nms` `temperature`\n\
  \n简而言之，在联合体中，所有成员共享相同的空间。每当给同一个成员或不同成员赋值时，所存储的值就会被覆盖。例如，你认为以下程序会产生什么结果？\n\n```c\n\
  #include  <stdio.h>  typedef  Union\n\n{\n\nint  to; int  b;\n\n}  tunion;\n\nmain()\n\
  \n{\n\ntunion  var1;  var1.a  =  10;\n\nvar1.b = 100;  printf(\"%d  \",  var1.a);\n\
  \nprintf(\"%d  \",  var1.b);\n\n}\n```\n\n这个示例定义了一个联合体 `var1`，其成员 `a` 和 `b` 共享四个字节的类型内存空间（假设\
  \ `int` 占用四个字节）。执行过程如下：\n\n1. 赋值语句 `var1.a = 10` 在公共空间上存储值 `10`。\n2. 赋值语句 `var1.b\
  \ = 100` 在公共空间上存储值 `100`，覆盖了之前的数据。\n\n根据上述陈述，我所知道的程序运行结果将是：\n\n```\n100 100\n```\n\
  \n这种解决方案并不意味着存在两个数据。存在的是通过两个成员访问的同一个数据（在本例中为相同类型）。基于此，另一个程序的运行结果怎样的？\n\n```c\n#include\
  \  <stdio.h>  typedef  Union\n\n{\n\nfloat  to; int  b;\n\n}  tunion;\n\nmain()\n\
  \n{\n\ntunion  var1;\n\nvar1.a = 10.5;  printf(\"%g\\n\",  var1.a);\n\nprintf(\"\
  %d\\n\",  var1.b);\n\n}\n```\n\n执行程序：\n\n```\n10.5\n1093140480\n```\n\n在这个示例中，联合体同样有两个成员：一个\
  \ `float` 类型成员和一个 `int` 类型成员，因此共享的内存空间为四个字节。在该内存空间上，执行语句 `var1.a = 10.5` 后，存储了以下二进制形式表示的值：\n\
  \n```\n01000001001010000000000000000000\n```\n\n由于两个成员都是四个字节长，从 `float` 类型的 `var1.a`\
  \ 访问并显示将返回 `10.5`，但从 `int` 类型的 `var1.b` 访问并显示将导致 `1093140480`。如果你手动按照 `float` 和\
  \ `int` 的正确格式视角进行转换，将能够验证这些结果。\n\n### 结构体变量\n\n联合体的一种应用是可以定义一组变量成员的数据结构。也就是说，这种结构允许根据程序的需要使用某些成员或其他成员。为此，它的任何成员都必须是一个联合体。\n\
  \n例如，假设我们想设计一个标记来存储图书馆中与书籍或科学期刊相关的数据。对于每本书或杂志，将包含以下信息：\n\n1. 参考编号。\n2. 资质。\n3. 作者姓名。\n\
  4. 出版社。\n5. 出版分类（书籍或杂志）。\n6. 版本号（仅限书籍）。\n7. 出版日期（仅书籍）。\n8. 杂志名称（仅期刊）。\n\n显然，每张卡片始终包含成员\
  \ 1, 2, 3, 4 和 5，以及更多：如果是书籍，则包含成员 6 和 7；如果是杂志，则包含成员 8。这种分离关系产生了一个包含两个成员的联合体：一个包含成员\
  \ 6 和 7 的结构 `ra` 以及成员 8。让我们看看：\n\n```c\nstructure book\n{\n  unsigned edition; unsigned\
  \ year;\n};\n\nUnion book_magazine\n{\n  structure book books; char revname[30];\n\
  };\n```\n\n根据上述陈述，文件的设计将保持如下形式：\n\n```c\nstructure file\n{\n  unsigned refnum; char\
  \ title[30]; char editorial[25];\nint publication_class;\n};\n```\n\n类型为 `book_magazine`\
  \ 的 `lr` 了一个结构体变量。该变量将包含 `edition` 或 `year`。上面的结构可以写为：\n\n```c\nstructure file\n\
  {\n  unsigned refnum; char title[30]; char editorial[25];\nint publication_class;\n\
  };\n\nUnion book_magazine\n{\n  structure\n{\n  unsigned edition; unsigned year;\n\
  \  } books;\nchar revname[30];\n};\n```\n\n\n\n\n```c\nprintf(\"Book  or  magazine\
  \  (0  =  book,  1  =  magazine)  \");  scanf(\"%d\",  &class);  fflush(stdin);\n\
  \n}\n\nwhile  (class  !=  0  &&  class  !=  1);  if  (class  ==  book)\n\n{\n\n\
  bibli[k].book_magazine  =  book;  printf(\"Edit \");\n\nscanf(\"%u\", &bibli[k].lr.books.edition);\
