  \    list->previtem = list->p;\n    list->currentitem = list->p;\n    // 位于目标元素的位置。\n\
  \    while (list->currentitem != NULL && (compare(and, list->currentitem->data)\
  \ > 0)\n    {\n        list->previtem = list->currentitem;\n        list->currentitem\
  \ = list->currentitem->next;\n    }\n    return !r; // 1=找到, 0=未找到\n}\n\nvoid adddir(void\
  \ *and, tllseo *ready)\n{\n    // 根据 and 提供的键按升序\n    // 添加元素。\n    Element *q =\
  \ newItem(); // 创建元素\n    q->data = and;\n    q->next = NULL;\n    // 如果 p 指向的就绪为空，则\n\
  \    // 添加第一个元素\n    if (emptyList(list))\n    {\n        list->p = list->currentitem\
  \ = list->previtem = q;\n        return;\n    }\n    // 如果就绪不为空，查找元素\n    // 所在的插入点。\n\
  \    search(and, ready);\n    // 两种情况：\n    // 1) 在就绪的开头插入\n    // 2) 在前一个元素之后插入\n\
  \    if (list->currentitem == list->p)\n    {\n        q->next = list->p;\n    \
  \    list->p = list->currentitem = q;\n    }\n    else\n    {\n        q->next =\
  \ list->currentitem;\n        list->previtem->next = q;\n        list->currentitem\
  \ = q;\n    }\n}\n\nvoid *delete(void *and, tllseo *ready)\n{\n    // 从列表中删除一个元素。\n\
  \    void *dataElemDeleted = NULL;\n    // 如果列表为空，返回空。\n    if (emptyList(list))\
  \ return NULL;\n    // 如果就绪不为空，查找该\n    // 元素的元素。\n    if (search(and, ready) ==\
  \ 0) return NULL; // 未找到\n    // 两种情况：\n    // 1) 删除就绪中的第一个元素\n    // 2) 删除下一个元素\n\
  \    if (list->currentitem == list->p)\n    {\n        list->previtem = list->p\
  \ = list->p->next;\n    }\n    else\n    {\n        list->previtem->next = list->currentitem->next;\n\
  \    }\n    // 删除\n    dataElemDeleted = list->currentitem->data;\n    free(list->currentitem);\n\
  \    // 更新指针\n    if (list->p == NULL) // 只有一个元素\n        startList(list);\n   \
  \ else\n        list->currentitem = list->previtem->next;\n    // 返回被删除的元素数据\n \
  \   return dataElemDeleted;\n}\n\nvoid *deleteFirst(tllseo *ready)\n{\n    void\
  \ *dataElemDeleted = NULL;\n    // 如果就绪为空，返回空。\n    if (emptyList(list)) return\
