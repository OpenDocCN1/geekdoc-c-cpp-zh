  \ 函数读取数据 `day`、`month` 和 `year`，并调用 `ValidData` 函数确保输入的数据是有效且对应正确日期的。\n\n`DataEntry`\
  \ 函数反过来调用 `LeapYear` 函数来验证该年份是否为闰年。\n\n`WriteDate` 函数调用 `DayWeek` 函数根据日期计算所引入日期对应的星期，并将结果可视化。\n\
