  \ `string2` 字符集的字符长度。\n\n```c\n/* strspn.c */\n#include <stdio.h>\n#include <string.h>\n\
  \nmain(void)\n{\n    char chain[] = \"abcdefg\";\n    int pos;\n    pos = strspn(chain,\
