  \n![](img/image18771.jpeg)数据区域\n\n3. 它将显示值列表，通过逐字符调用 `get` 函数返回列表的元素之一。`get` 函数返回一个通用指针，在我们的案例中它指向\
  \ `double`。\n\n4. 它将通过调用 `clearAll` 函数清除列表。请注意，该函数只释放为元素分配的内存，而不是每个元素所引的数据。\n\n\
  ```c\nmain()\n{\n    int i = 0;\n    // 定义一个就绪空链：Element *llse = NULL, *q = NULL;\n\
  \    // 读取数据并将其添加到就绪双向表中；\n    printf(\"输入数据。以 eof 结束。\\n\");  printf(\"Value double:\
  \ \");\n    while (scanf(\"%lf\", &n) != EOF)\n    {\n        adddirToBeginning(n,\
  \ &llse);  printf(\"Value double: \");\n    }\n}\n```\n\n\n\n\n\n`anyadir` 在位置 `i`\
  \ 插入一个元素（第一个位置是 0）。它有三个参数：位置 `i`、指向要添加对象的指针以及列表。如果操作执行成功则返回 1，否则返回 0。如果索引 `i` 超出范围则是。\n\
  \n```c\nint adddir(int i, void *and, tllse *ready);\n```\n\n`anyadirToBeginning`\
  \ 在开头添加一个元素。它有两个参数：指向要添加对象的指针和列表。返回 1 或 0，与 `add` 的结果相同。\n\n```c\nint anyaddToBeginning(void\
  \ *and, tllse *ready);\n```\n\n`anyadirToEnd` 在末尾添加一个元素。它有两个参数：指向要添加对象的指针和列表。返回\
  \ 1 或 0，与 `add` 的结果相同。\n\n```c\nint anyaddToEnd(void *and, tllse *ready);\n```\n\
  \n`delete` 删除位置 `i` 处的元素。它有两个参数：要删除对象的的位置 `i` 和列表。返回指向被删除元素数据区域的指针，如果列表为空或索引 `i`\
  \ 超出范围则返回 `NULL`。\n\n```c\nvoid *delete(int i, tllse *ready);\n```\n\n`deleteFirst`\
  \ 删除第一个元素。返回的结果与 `delete` 相同。\n\n```c\nvoid *deleteFirst(tllse *ready);\n```\n\n\
  `deleteLast` 删除最后一个元素。返回的结果与 `delete` 相同。\n\n```c\nvoid *deleteLast(tllse *ready);\n\
  ```\n\n`get` 返回位置 `i` 处元素的数据指针，或者如果 ready 为空或索引超出范围则返回 `NULL`。它有两个参数：位置 `i` 和列表。\n\
  \n```c\nvoid *get(int i, tllse ready);\n```\n\n`getFirst` 返回第一个元素数据的指针，或者如果列表为空则返回\
  \ `NULL`。\n\n```c\nvoid *getFirst(tllse ready);\n```\n\n`getLast` 返回最后一个元素数据的指针，或者如果列表为空则返回\
  \ `NULL`。\n\n```c\nvoid *getLast(tllse ready);\n```\n\n![](img/image18779.jpeg)\n\
  \n我们将实现的接口函数将对 `pllse` 和 `numberOfElements` 参数进行操作。`pllse` 参数是一个指针，当列表为空时它为 `NULL`，当不为空时，它始终指向第一个元素，而\
  \ `numberOfElements` 是列表中拥有的元素数量。这建议定义一个 `tllse` 类型的结构来组合这些参数：\n\n```c\ntypedef\
  \ structure\n{\n    Element *plse; // 永远指向第一个元素\n    int numberOfElements; // ready\
