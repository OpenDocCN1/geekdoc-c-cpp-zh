  ### 嵌套循环\n\n当一个 `while` 语句包含在另一个 `while` 语句内部时（通常情况下在一个语句内部包含另一个 `while`、`do` 或\
  \ `for` 语句），我们就处于嵌套循环的情况。例如：\n\n```c\n#include <stdio.h> main()\n{\n    int i =\
  \ 1, j = 1;\n\n    while (i <= 3) // 当 i 小于或等于 3 时\n    {\n        printf(\"For\
  \ i = %d: \", i);\n        while (j <= 4)  // 当 j 小于或等于 4 时\n        {\n       \
  \     printf(\"j = %d, \", j);\n            j++; // j 增加 1\n        }\n        printf(\"\
  \\n\"); // 换到新行\n        i++; // i 增加 1\n        j = 1; // 将 j 初始化为 1\n    }\n}\n\
  ```\n\n运行 East Program 我得到以下结果：\n\n| For | i | = | 1: | j | = | 1, | j | = | two,\
  \ | j | = | 3, | j | = | 4, |\n| For | i | = | two: | j | = | 1, | j | = | two,\
  \ | j | = | 3, | j | = | 4, |\n| For | i | = | 3: | j | = | 1, | j | = | two, |\
  \ j | = | 3, | j | = | 4, |\n\n此结果显示外层循环执行了三次，因此每一个循环内层循环依次执行四次。这就是嵌套循环执行的方式：对于外层循环的每次迭代，内层循环运行直到完成其所有的迭代。\n\
  \n`while` 语句在内部结束，我们换到新行，将 `i` 的值增加一个单位，并重新开始 `j` 的值为 1。\n\n作为上述应用，我们将编写一个打印 z 数的程序，包含\
