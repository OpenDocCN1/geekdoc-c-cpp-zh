  \ 0 && i <= bd.nregs)\n{\n// 将指针指向记录 i\nfseek(bd.fes, i * bd.tamreg, SEEK_SET);\n\
  // 用新信息覆盖记录\nfwrite(&reg, bd.tamreg, 1, bd.fes);\nif (!ferror(bd.fes)) return 1;\n\
  printf(\"写入文件时出错\\n\");\n}\nelse\nprintf(\"记录编号超出范围\\n\"); return 0;\n}\n\nvoid\
  \ AnyadirRecord(record reg, database *db)\n{\n// 在文件末尾添加一条记录并增加\n// 记录数量\nif (WriteRecord(bd->nregs,\
  \ reg, *db)) bd->nregs++;\n}\n\nrecord ReadRecord(int i, database bd)\n{\nregister\
  \ reg; StartRecord(&reg);\nif (i >= 0 && i < bd.nregs)\n{\n// 将指针指向记录 i\nfseek(bd.fes,\
  \ i * bd.tamreg, SEEK_SET);\n// 读取与记录对应的信息\nfread(&reg, bd.tamreg, 1, bd.fes);\n\
  }\nelse\nprintf(\"记录编号超出范围\\n\");\n// 返回对应的记录\nreturn reg;\n}\n\nint FindRecord(char\
  \ *str, int nreg, database bd)\n{\n// 通过引用中的子字符串查找记录\n// 以确定一条记录。如果找到了，\n// 返回记录编号，如果没有找到的记录则返回\
  \ -1\nint reg_i = 0;\nrecord reg;\nif (str == NULL) return -1;\nif (nreg < 0) nreg\
  \ = 0;\nfor (reg_i = 0; reg_i < nreg; reg_i++)\n{\n// 获取记录\nreg = ReadRegistry(reg_i,\
  \ bd);\n// 引用包含 str 吗？\nif (strstr(reg.reference, str))\nreturn reg_i; // 返回记录编号\n\
  }\nreturn -1; // 搜索失败\n}\n\nint DeleteRecord(char *ref, database *bd)\n{\nint reg_i\
  \ = 0;\nrecord reg;\n// 查找引用并标记对应的记录\n// 以便移除它\nfor (reg_i = 0; reg_i < bd->nregs;\
  \ reg_i++)\n{\n// 获取记录\nreg = ReadRegistry(reg_i, bd);\n// 引用匹配吗？\nif (strcmp(reg.reference,\
  \ ref) == 0)\n{\n// 用“delete”标记记录\nstrcpy(reg.reference, \"delete\");\n// 写入记录\n\
  WriteRecord(reg_i, reg, *bd);\nbd->regsDeleted = 1;\nreturn 1;\n}\n}\nreturn 0;\n\
  }\n\nvoid StartDatabase(record *bd)\n{\n*(bd->FileName) = 0;\nbd->fes = NULL;\n\
  bd->nregs = 0;\nbd->tamreg = sizeof(record);\nbd->regsDeleted = 0;\n}\n\nint UpdateDatabase(database\
  \ *bd);\nvoid CloseDatabase(database *bd)\n{\nif (bd->regsDeleted)\n{\nbd->regsDeleted\
  \ = 0;\nUpdateDatabase(db);\n}\nif (bd->fes) fclose(bd->fes); // 关闭文件\nbd->fes =\
  \ NULL;\nbd->nregs = 0; // 记录数量\n}\n\nint UpdateDatabase(database *bd)\n{\nint reg_i\
  \ = 0;\nregister reg;\ndatabase bdtemp;\nStartDatabase(&bdtemp);\n// 创建临时文件。\nbdtemp.fes\
  \ = tmpfile();\nif (bdtemp.fes == NULL)\n{\nprintf(\"错误：无法创建临时文件\\n\");\nreturn\
  \ 0;\n}\n// 复制当前文件中的记录\n// 那些未被标记为“delete”的\nfor (reg_i = 0; reg_i < bd->nregs;\
  \ reg_i++)\n{\n// 获取记录\nreg = ReadRegistry(reg_i, *bd);\nif (strcmp(reg.reference,\
  \ \"delete\") == 0) continue;\nAnyadirRegistry(reg, &bdtemp);\n}\n// 将临时记录复制到当前文件\n\
  // 为此，我们创建一个新的文件\nCloseDatabase(db);\nif ((bd->fes = fopen(db->FileName, \"w+b\"\
  )) == NULL)\n{\nprintf(\"错误：无法创建文件\\n\");\nreturn 0;\n}\nrewind(bdtemp.fes); //\
