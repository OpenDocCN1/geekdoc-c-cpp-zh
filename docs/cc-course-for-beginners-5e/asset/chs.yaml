  \ - Ed. BRANCH\n版本 3 - 年份 2007\n按 <回车> 继续\n// ...\n\n我注意到已经将 `tfile` 类型声明为全局级别，以便在\
  \ `Program` 程序中需要的地方任何函数中使用它。\n\n### 位域字段 (FIELDS FROM BITS)\n\n结构体成员（非来自 `Union`\
  \ 联合体）也可以是位域，位域被理解为在一个可寻址单元地址内的一组相邻的位集合，通常是一个 `int`。声明位域的语法如下：\n\n`类型 [ 标识符 ] :\
  \ 大小`\n\n大小指定了字段对应的位数，并且必须是一个非负整数常量，不能超过物理机器的物理尺寸；即 `int` 的大小。类型必须是整型。与 ANSI C 参考将位域的类型限制为\
  \ `int` 或 `unsigned int` 不同，C++ 允许位域为任何整型类型；例如 `char`、`short`、`int`、`long`，有符号或无符号，或列出的类型。我不知道允许位域数组、位域指针或返回位域的函数。字段标识符是可选的；未标识的字段作为填充。\n\
  \n位域的分配取决于硬件；也就是说，位是从最高位到最低位分配或反之，如下面的示例所示，取决于所使用的机器。下面的示例澄清了上述内容。\n\n```c\n/***********************\
  \ 位域***********************/\n/* bit_fields.c\n*/\n#include <stdio.h>\n\nstructure\
  \ word // 32 位的字: 0 到 31\n\n{\nunsigned car_ascii : 7; // 位 0 到 6  unsigned parity_bit\
  \ : 1; // 位 7  unsigned operation             : 5;  // 位 8 到 12\nunsigned :18; \
  \ // 位 13 到 30  填充  unsigned bit_sign : 1;  // 位 31\n};\n\nmain() // 函数\n{\nstructure\
  \ word cb = {'C', 1, 0x1E};\nprintf(\"bit fields: %x\\n\", cb);printf(\"bit sign\
  \ : %x\\n\", cb.bit_sign);printf(\"operation : %x\\n\", cb.operation);printf(\"\
  bit parity: %x\\n\", cb.bit_parity);printf(\"character %c\\n\", cb.car_ascii, cb.car_ascii);\n\
  }\n```\n\n程序运行：\n位域: 1ec\n位符号 : 0 操作 : 1e 奇偶 : 1 字符 : 43\n内存中的分配情况如下：\n31 30 29\
  \ 28 27 26 25 24 23 22 二十一 二 19 18 17 16 十五 14 13 十二 十一 9 8 7 6 5 4 3 二 1 0\n| |\
  \ | | | | | | | | | | | | | | | | | | | | | | |\n\n位域的分配取决于硬件；也就是说，位是从最高位到最低位分配或反之，如下面的示例所示，取决于所使用的机器。下面的示例澄清了上述内容。\n\
  \n```c\n/*********************** 位域***********************/\n/* bit_fields.c\n*/\n\
  #include <stdio.h>\n\nstructure word // 32 位的字: 0 到 31\n\n{\nunsigned car_ascii\
  \ : 7; // 位 0 到 6  unsigned parity_bit : 1; // 位 7  unsigned operation         \
  \    : 5;  // 位 8 到 12\nunsigned :18;  // 位 13 到 30  填充  unsigned bit_sign : 1;\
  \  // 位 31\n};\n\nmain() // 函数\n{\nstructure word cb = {'C', 1, 0x1E};\nprintf(\"\
  bit fields: %x\\n\", cb);printf(\"bit sign : %x\\n\", cb.bit_sign);printf(\"operation\
  \ : %x\\n\", cb.operation);printf(\"bit parity: %x\\n\", cb.bit_parity);printf(\"\
  character %c\\n\", cb.car_ascii, cb.car_ascii);\n}\n```\n\n程序运行：\n位域: 1ec\n位符号 :\
  \ 0 操作 : 1e 奇偶 : 1 字符 : 43\n内存中的分配情况如下：\n31 30 29 28 27 26 25 24 23 22 二十一 二 19\
  \ 18 17 16 十五 14 13 十二 十一 9 8 7 6 5 4 3 二 1 0\n| | | | | | | | | | | | | | | | |\
  \ | | | | | | | | | |\n\n位域的分配取决于硬件；也就是说，位是从最高位到最低位分配或反之，如下面的示例所示，取决于所使用的机器。下面的示例澄清了上述内容。\n\
  \n```c\n/*********************** 位域***********************/\n/* bit_fields.c\n*/\n\
  #include <stdio.h>\n\nstructure word // 32 位的字: 0 到 31\n\n{\nunsigned car_ascii\
  \ : 7; // 位 0 到 6  unsigned parity_bit : 1; // 位 7  unsigned operation         \
  \    : 5;  // 位 8 到 12\nunsigned :18;  // 位 13 到 30  填充  unsigned bit_sign : 1;\
  \  // 位 31\n};\n\nmain() // 函数\n{\nstructure word cb = {'C', 1, 0x1E};\nprintf(\"\
  bit fields: %x\\n\", cb);printf(\"bit sign : %x\\n\", cb.bit_sign);printf(\"operation\
  \ : %x\\n\", cb.operation);printf(\"bit parity: %x\\n\", cb.bit_parity);printf(\"\
  character %c\\n\", cb.car_ascii, cb.car_ascii);\n}\n```\n\n程序运行：\n位域: 1ec\n位符号 :\
  \ 0 操作 : 1e 奇偶 : 1 字符 : 43\n内存中的分配情况如下：\n31 30 29 28 27 26 25 24 23 22 二十一 二 19\
  \ 18 17 16 十五 14 13 十二 十一 9 8 7 6 5 4 3 二 1 0\n| | | | | | | | | | | | | | | | |\
  \ | | | | | | | | | | |\n\n位域的分配取决于硬件；也就是说，位是从最高位到最低位分配或反之，如下面的示例所示，取决于所使用的机器。下面的示例澄清了上述内容。\n\
  \n```c\n/*********************** 位域***********************/\n/* bit_fields.c\n*/\n\
  #include < .h>\n\n  word // // 32 位的字: 0 到 31\n\n{\nunsigned car_ascii : 7; // 位\
  \ 0 到 6  unsigned parity_bit : 1; // 位 7  unsigned operation              : 5; \
  \ // 位 8 到 12\n\n :18;\n\n\n   \n```\n\n使用位域来节省空间是幼稚的，并且会导致额外的执行时间。在许多机器上，一个字节或字是可访问的最小内存单元，不需要额外的处理时间。相反，提取位域会产生额外的指令。因此，这说明位域应该在需要的问题中使用；例如当我们需要一组分组的标志位（到一个整数）时。\n\
  \n作为一种应用，我们将创建一个程序，从键盘输入一个字符，并产生如所示的反射字符。该解决方案类似于所示：\n输入字符：TO\nTO 的 ASCII 值为 41h；二进制为：01000001\n\
  反射字符：he\nhe 的 ASCII 值为 82h；二进制为：10000010\n\n程序的结构将由以下函数组成：\n1. `main` 函数，将调用 `display`\
  \ 函数来显示输入的字符和反射字符，并以上述方式（十六进制和二进制）进行展示，并调用 `ReflectByte` 函数来反转位的顺序（位 0 将变成位 7，位\
  \ 1 将变成位 6，位 2 将变成位 5，等等）。\n2. `present` 函数，原型如下：\n`void present(unsigned char c);`\n\
  该函数接收要展示的字符作为参数，并以十六进制和二进制的形式进行展示。\n3. `ReflectByte` 函数，原型如下：\n`unsigned char ReflectByte(Union\
  \ byte b);`\n该函数接收一个联合体 `byte` 作为参数，该联合体允许将无符号 `char` 类型的字符位到位，并返回反射后的字节结果。\n\n\
  ```c\nUnion byte {\nunsigned char byte;\nstructure {\nunsigned char b0 : 1; unsigned\
  \ char b1 : 1; unsigned char b2 : 1; unsigned char b3 : 1; unsigned char b4 : 1;\
  \ unsigned char b5 : 1; unsigned char b6 : 1; unsigned char b7 : 1;\n} bits;\n};\n\
  ```\n\n我所完整的程序示例如下：\n\n********************** 反射字节 *******************/\n\n\n\n\n\
  \n```c\n/*  reflect.c\n*/\n\n#include <stdio.h>\n\nUnion byte\n{\n  unsigned char\
  \ byte;\n  structure\n  {\n    unsigned char b0 : 1;\n    unsigned char b1 : 1;\n\
  \    unsigned char b2 : 1;\n    unsigned char b3 : 1;\n    unsigned char b4 : 1;\n\
  \    unsigned char b5 : 1;\n    unsigned char b6 : 1;\n    unsigned char b7 : 1;\n\
  \  } bits;\n};\n\nvoid present(unsigned char c);\n\nunsigned char ReflectByte(Union\
  \ byte b);\n\nmain()\n{\n  Union byte b;\n  printf(\"Enter a character: \");\n \
  \ b.byte = getchar();\n  submit(b.byte);\n  b.byte = ReflectByte(b);\n  printf(\"\
  Character reflected: %c\\n\", b.byte);\n  submit(b.byte);\n}\n\nvoid present(unsigned\
  \ char c)\n{\n  int i = 0;\n  printf(\"The value ASCII from %c is %X; on binary:\
  \ \", c, c);\n  for (i = 7; i >= 0; i--)\n    printf(\"%d\", (c & (1 << i)) ? 1\
  \ : 0);\n  printf(\"\\n\");\n}\n\nunsigned char ReflectByte(Union byte b)\n{\n \
  \ Union byte c;\n  c.bits.b0 = b.bits.b7;\n  c.bits.b1 = b.bits.b6;\n  c.bits.b2\
  \ = b.bits.b5;\n  c.bits.b3 = b.bits.b4;\n  c.bits.b4 = b.bits.b3;\n  c.bits.b5\
  \ = b.bits.b2;\n  c.bits.b6 = b.bits.b1;\n  c.bits.b7 = b.bits.b0;\n  return (c.byte);\n\
  }\n```\n\n是的，请记住条件运算符的工作原理，你将知道该操作：\n\n`(c & (1 << i)) ? 1 : 0`\n\n返回什么结果：在这种情况下，如果表达式\
  \ `(c & (1 << i))` 为真（非零值），则返回 1；如果表达式为假（值为 0），则返回 0。表达式 `1 << i` 将 `1` (0...01)\
  \ 向左移动 `i` 次。该目标是以二进制形式显示 `c`。`for` 循环的执行过程如下所示：\n\n| i | `c & (1 << i) =` | `(c\
  \ & (1 << i)) ? 1 : 0` |\n| :--- | :--- | :--- |\n| 7 | 01000001 & 10000000 = 00000000\
  \ | 0 |\n| 6 | 01000001 & 01000000 = 01000000 | 1 |\n| 5 | 01000001 & 00100000 =\
  \ 00000000 | 0 |\n| 4 | 01000001 & 00010000 = 00000000 | 0 |\n| 3 | 01000001 & 00001000\
  \ = 00000000 | 0 |\n| 2 | 01000001 & 00000100 = 00000000 | 0 |\n| 1 | 01000001 &\
  \ 00000010 = 00000000 | 0 |\n| 0 | 01000001 & 00000001 = 00000001 | 1 |\n\n### 训练题解答\n\
  \n1. 编写一个程序，读取并存储键盘输入的值。读取完成后，寻找这些值中的最大值和最小值并打印出来。\n\n该问题的解决方案可以如下：\n\n*   我们定义一个矩阵来存储输入的数值，以及程序中所需的其他变量。\n\
  \n```c\nfloat data[NMAX]; // 数据的矩阵\nfloat max, min; // 最大值和最小值\nint nElements =\
  \ 0; // 矩阵读取的元素个数\nint i = 0; // 索引\n```\n\n*   继续读取数值直到结束。\n\n```c\nprintf(\"data[%d]\
  \ = \", i);\nwhile (i < NMAX && scanf(\"%f\", &data[i]) != EOF)\n{\n  i++;\n  printf(\"\
  data[%d]= \", i);\n}\n```\n\n*   读取完所有数值后，我们计算最大值和最小值。初始假设第一个值既是最大值也是最小值（假设值相等）。然后我们将这些每个值与列表中的其他值进行比较：如果它比当前值大，则成为新的最大值；如果它比当前值小，则成为新的最小值。\n\
  \n```c\nmax = min = data[0];\nfor (i = 0; i < nElements; i++)\n{\n  if (data[i]\
  \ > max) max = data[i];\n  if (data[i] < min) min = data[i];\n}\n```\n\n*   最后，输出结果。\n\
  \n```c\nprintf(\"Value maximum: %g, value minimum: %g\\n\", max, min);\n```\n\n\
  完整的程序示例：\n\n```c\n/************* 最大值最小值************/\nmax.c\n#include <stdio.h>\n\
  #define NMAX 100 // 矩阵元素个数\nmain()\n{\n  float data[NMAX]; // 数据矩阵\n  float max,\
  \ min; // 最大值和最小值\n  int nElements = 0; // 读取的元素个数\n  int i = 0; // 索引\n  // 输入数据\n\
  \  printf(\"Enter data. For Finalize Introduce the EOF\\n\");\n  printf(\"data[%d]\
  \ = \", i);\n  while (i < NMAX && scanf(\"%f\", &data[i]) != EOF)\n  {\n    i++;\n\
  \    printf(\"data[%d]= \", i);\n  }\n  // 寻找最大值和最小值\n  nElements = i;\n  if (nElements\
  \ > 0)\n  {\n    max = min = data[0];\n    for (i = 0; i < nElements; i++)\n   \
  \ {\n      if (data[i] > max) max = data[i];\n      if (data[i] < min) min = data[i];\n\
  \    }\n    // 输出结果\n    printf(\"Value maximum: %g, value minimum: %g\\n\", max,\
  \ min);\n  }\n  else\n    printf(\"Not there data.\\n\");\n}\n```\n\n程序执行：\n\nEnter\
  \ data. For Finalize Introduce the EOF\n\n| data[i] | |\n| :--- | :--- |\n| data[0]\
  \ | 87 |\n| data[1] | Five |\n| data[2] | 68 |\n| data[3] | 1 |\n| data[4] | |\n\
  | data[5] | 90 |\n| data[6] | 7 |\n| data[7] | 52 |\n| data[8] | Z |\n\nValue maximum:\
  \ 90, value minimum: 1\n\n2. 编写一个程序，输出键盘输入的文本中每个相邻字母出现的频率。不区分大小写。结果将以表格形式呈现：\n\n\
  | | a | b | c | d | ... | f | z |\n|---|---|---|---|---|---|---|---|\n| a | 0 |\
  \ 4 | 0 | 2 | | 0 | 1 |\n| b | 8 | 0 | 0 | 3 | 1 | 0 | |\n| c | | | | | | | |\n\
  | d | | | | | | | |\n| e | | | | | | | |\n| f | | | | | | | |\n| ... | |\n\n例如，上面的表格显示字母对\
  \ ab 出现了四次。结果表格考虑了所有可能的字母对，从 aa 到 zz。\n\n文本“hello how are you”中的相邻字母对有：`ho`、`ol`、`la`、`a\
  \ `（空格不计入，因为不在'a'-'z'范围内）等。\n\n为了解决这个问题，根据上述思路，我们需要一个二维整数矩阵。每个元素将作为对应字母对的计数器。因此，数组的所有元素必须初始化为\
  \ 0。\n\n```c\n#define DIM ('z' - 'a' + 1) // 表格行列\nint table[DIM][DIM]; // 计数表\n\
  ```\n\n为了使解决方案简单，我们将应用在本章前面介绍过的关联数组概念；即要计数的字母对将是矩阵元素的索引。查看上面的表格，可以看到 aa 的计数是矩阵的\
  \ (0,0) 元素。这涉及到从索引变量 `carant` 中减去常量，`carant` 将包含对中的第一个字符，`char` 为另一个字符。\n\n`(carant\
  \ >= 'a' && carant <= 'z') && (char >= 'a' && char <= 'z') table[carant - 'a'][char\
  \ - 'a']++`\n\n```c\n/**** 文本相邻字母频率表************/\ncouples.c\n#include <stdio.h>\n\
  #include <ctype.h>\n\n#define DIM ('z' - 'a' + 1) // 表格行列\nvoid main()\n{\n  static\
