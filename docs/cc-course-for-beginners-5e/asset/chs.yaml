  \ 的程序，允许我们在一个或多个文本文件中搜索单词。结果将为每个文件显示其文件名、行号以及该文件中包含搜索单词的每一行的内容。\n\n程序 `grep` 应当包含以下函数：\n\
  \na) `FindString`：用于在另一个字符串中搜索一个字符串。该函数的原型为：`int FindString(char *string1, char\
  \ *string2);`。如果 `string2` 在 `string1` 中，则返回 1；否则返回 0。\n\nb) `SearchInFile`：用于在文本文件中搜索字符串，并打印包含该字符串的行号和行内容。该函数的原型为：`void\
  \ SearchInFile(char *filename, char *chain)`。\n\nc) `main`：使用上述函数，允许在一个或多个文件中搜索单词。应用程序的调用格式为：`grep\
  \ word file_1 file_2 ... file_n` 完成。\n\n```c\n********** 从文件中查找链 ******\n/* grep.c\
  \ */\n#include <stdio.h>\n#include <stdlib.h>\n#include <string.h>\n\nint FindString(char\
  \ *string1, char *string2)\n{\n    // string1 中是否包含 chain2?\n    if (strstr(string1,\
  \ string2))\n        return 1; // 找到\n    else\n        return 0; // 未找到\n}\n\n\
  void SearchInFile(char *filename, char *chain)\n{\n    FILE *pf;\n    char line[256];\n\
  \    int noline = 0;\n    // 打开 filename\n    if ((pf = fopen(filename, \"r\"))\
  \ == NULL)\n    {\n        perror(filename);\n        return;\n    }\n    // 在 pf\
  \ 中查找链\n    while (fgets(line, sizeof(line), pf) != NULL)\n    {\n        noline++;\n\
  \        if (FindString(line, chain))\n            printf(\"%s[%d]: %s\", filename,\
  \ noline, line);\n    }\n    fclose(pf);\n}\n\nmain(int argc, char *argv[])\n{\n\
  \    int i;\n    // 检查参数数量\n    if (argc < 3)\n    {\n        printf(\"Syntax: %s\
  \ f1 f2 ... fn\\n\", argv[0]);\n        exit(-1);\n    }\n    // 为每个文件调用 SearchInFile\n\
  \    for (i = 2; i < argc; i++)\n        SearchInFile(argv[i], argv[1]);\n}\n```\n\
