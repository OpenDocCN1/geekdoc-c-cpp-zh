  \ = a[i]`。\n\n访问矩阵 `p` 的元素可以使用指针表示法或使用索引法，就像我们使用 `.` 一样。例如，为了给数组 `p` 所引的整数赋值并然后显示它们，我们可以写下下面的代码：\n\
