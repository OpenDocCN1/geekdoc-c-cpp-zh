  \ + %.2fj, %.2lf - %.2fj\\n\", re, im, re, im);`\n\n解决此问题的方案如下：\n\n```c\n/* 解决方程程序\n\
  * solve.c\n*/\n#include <stdio.h>\n#include <math.h>\n\nvoid main()\n{\n    double\
  \ a, b, c;\n    printf(\"Coefficients, b and c from the equation: \");\n    scanf(\"\
  %lf %lf %lf\", &a, &b, &c);\n\n    if (a == 0 && b == 0) {\n        printf(\"The\
  \ equation is degenerate\\n\");\n    } else if (a == 0) {\n        printf(\"The\
