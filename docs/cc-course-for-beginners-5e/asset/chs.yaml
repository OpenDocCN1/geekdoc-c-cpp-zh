  \ 中的应用程序（`main` 函数等）。\n\n### 完美平衡二叉树\n\n如果二叉树中每个节点的左子树节点数与右子树节点数之差最多为一个，则该树是完美平衡的。\n\
  \n![](img/image18823.jpeg)![](img/image18824.jpeg)![](img/image18825.jpeg)[](Images/image18826.jpeg)n=1![](img/image18827.jpeg)\n\
  \n完美平衡的树\n\n例如，考虑构建一个完美平衡树的问题，其中 `n` 个节点的值为 `void *` 类型的指针，这将允许稍后在每种情况下访问我们需要的数据类型对象。\n\
  \n可以通过在读取节点时将它们均匀地分布在每个节点的左侧和右侧来完成。该过程是递归的。以下是执行这种分配的最佳方法。对于给定的 `n` 个节点，其中 `ni`（左侧节点数）和\
  \ `nd`（右侧节点数）：\n\n1. 使用一个节点作为根节点。\n2. 生成具有 `nd` 个节点的左子树。\n3. 生成具有 `ni` 个节点的右子树。\n\
  \n树中的每个节点包含以下内容：\n\n```c\ntypedef struct\n{\n    int numberOfNodes; // 节点\n    Data\
  \ *data; // 数据\n    struct Node *left; // 左侧\n    struct Node *right; // 右侧\n} Node;\n\
  ```\n\n在 C 中，我们可以通过设计一个接口来实现构建完美平衡二叉树的过程，该接口提供了创建树的每个节点以及根节点所需的函数。以下是函数总结：\n\n![](img/image1849.jpeg)\n\
  \n完美平衡树接口（根节点）\n\n`error` 在资源不足时显示消息。\n\n![](img/image1828.jpeg)\n\n`newNode` 为\
  \ `Node` 类型对象分配内存。返回指向分配内存的指针。如果发生错误，则调用 `error`。\n\n`buildTree` 是一个允许构建完美平衡二叉树的函数。它有一个\
  \ `int` 类型的参数，对应树的节点数量。返回根节点的指针。\n\n`getNode` 通过位置在树中查找给定节点。它有两个参数：索引 0, 1, 2...（根据中序遍历访问顺序，我们认为第一个位置是\
  \ 0），你想要访问的节点以及树的根。返回节点数据区域的指针，如果树为空或索引越界，则返回 `NULL`。\n\n`search` 通过内容在树中查找给定节点。它有三个参数：指向你想在树中定位的数据的\
  \ `void *` 指针、树的根以及一个通过引用传递的整数（初始为开始搜索的位置，根据中序遍历顺序，我们认为第一个位置是 0），最后是找到的节点的位置。返回找到的节点的数据区域的指针，如果树为空或没有找到所求数据的节点，则返回\
  \ `NULL`。\n\n`inorder` 是使用中序遍历遍历二叉树的递归函数。无返回值。\n\n`deleteTree` 是一个递归函数，允许释放树中每个节点分配的内存，按照给的形式进行。它不释放每个节点数据区域分配的内存，该任务由使用此接口的应用程序负责。\n\
  \n`readData` 是必须由用户在应用程序定义的函数。其作用是允许读取被树节点引用的数据。返回指向数据区域的指针。\n\n\n\n\n## compare\
  \ 函数\n`compare` 函数必须由用户在应用程序中定义。它使用此接口来指定你想对树的两个节点执行的比较类型。它必须返回一个整数，表示检查的结果（如果 `node1<node2`、`node1==node2`\
  \ 或 `node1>node2`，则分别返回 -1、0 或 1）。该函数由 `insert`、`delete` 和 `search` 函数调用。\n\n```c\n\
  int compare(void *data1, void *data2);\n```\n\n## process 函数\n`process` 函数必须由用户在应用程序中定义。它使用此接口来指定你想对访问的节点执行的操作。它由函数\
  \ `inorder` 调用。\n\n```c\nvoid process(void *data);\n```\n\n## releasemem 函数\n`freemem`\
  \ 函数必须由用户在应用程序中定义。它使用此接口来释放分配的内存。例如不需要存储数据。它被函数 `deleteTree` 调用。\n\n```c\nvoid freemem(void\
  \ *data);\n```\n\n![](img/image1882.jpeg)\n\n## 接口 aba\n继续，以下是对应于接口 `aba` 的代码：`tree\
  \ binary balanced`。\n\n```c\n//////////////////////////////////////////////////\
  \ ///////////////\n\n// 接口 aba: 二叉平衡树。为了使用\n// 由接口提供的函数，我们将在\n// 应用程序中定义对这些函数的使用：\n\
  // readData, compare, process 和 set me free\n\n// 打印错误消息并终止程序\nvoid error()\n{\n\
  \    printf(\"Insufficient memory\\n\"); \n    exit(1);\n}\n\n// 创建新元素\nNode *newNode()\n\
  {\n    Node *q = (Node *)malloc(sizeof(Node)); \n    if (!q) error();\n    return\
  \ q;\n}\n\nNode *buildTree(int n)\n{\n    // 从 n 个节点构建一棵完美平衡的树。\n    // 我知道数据存储在节点上的顺序根据\n\
  \    // 它们按照“无序”形状被访问的顺序。\n    Node *node = NULL;\n    int neither = 0, na = 0;\
  \ \n    if (n == 0)\n        return NULL;\n    else\n    {\n        neither = n\
  \ / two; // 左子树节点数 \n        nd = n-ni-1; // 右子树节点数 \n        node = newNode();\n\
  \        node->numberOfNodes = no;\n        node->left = buildTree(ni); \n     \
  \   node->data = readData();\n        node->right = buildTree(nd); \n        return\
  \ node;\n    }\n}\n\nvoid *getNode(int node_i, Node *root)\n{\n    // 此函数允许返回节点\
  \ i 的数据。\n    // 我知道节点被编号 (0, 1, two, ...) 是根据\n    // 它们按照“无序”形状被访问的顺序。\n    int\
  \ neither = 0, na = 0, n = root->numberOfNodes;\n    if (root == NULL || node_i\
  \ < 0 || node_i > n) \n        return NULL;\n    neither = n / two; // 左子树节点数 \n\
  \    nd = n-ni-1; // 右子树节点数 \n    if (node_i == neither)\n        return root->data;\
  \ // 当前节点（根子树） \n    else if (node_i < neither)\n        // 左子树\n        return\
  \ getNode(node_i, root->left); \n    else\n        // 右子树；调整东子树上的索引\n        //\
  \ 减去左子树节点和当前节点\n        return getNode(node_i - neither - 1, root->right);\n   \
  \ return NULL;\n}\n\nvoid *search(void *data, Node *root, int *post)\n{\n    //\
  \ 在树上查找确定节点。调用 findNode\n    // 确保初始值 beef 值为 NULL。 \n    int i = 0; // 初始节点\n \
  \   void *beef = NULL;\n    findNode(data, root, &beef, pos, &i); \n    return beef;\n\
  }\n\nvoid findNode(void *data, Node *root, void **beef, int *post, int *i)\n{\n\
  \    // search 函数允许访问确定节点。\n    // 是的，由 \"data\" 指定的数据我知道位于\n    // \"root\" 指向的树上，从位置\
  \ *post 开始，\n    // \"search for\" 在 *beef 上返回一个指向这些数据的指针；\n    // 否则，返回 NULL。\n\
  \    // 我知道节点被编号 (0, 1, two, ...) 是根据\n    // 它们按照“无序”形状被访问的顺序。\n    // *i 是处理中节点的位置。\n\
  \    // *post 返回找到节点的位置。 \n    Node *current = root;\n    if (current != NULL &&\
  \ *beef == NULL)\n    {\n        findNode(data, current->left, beef, pos, i); \n\
  \        if (*res == NULL && (*pos)-- <= 0)\n        {\n            // 上一个 if 中出现的第一个条件是\n\
  \            // 对于什么是必要的\n        }\n    }\n}\n\nvoid inorder(Node *root)\n{\n \
  \   // 中序遍历的实现\n}\n\nvoid deleteTree(Node **root)\n{\n    // 树删除的实现\n}\n```\n\n\n\
  \n搜索功能允许访问某些数据，它从根节点开始遍历树，并从任何节点开始搜索。树 `bol` 按照中序形式进行遍历。为了方便接口用户操作，我们在其上添加了一个 `findNode`\
  \ 函数，该函数由 `find` 调用；通过这种方式，可以确保指向被搜索数据的指针（`findNode` 的第三个参数）初始等于 `NULL`，正如该函数中所描述的条件所示。第四个参数表示我们想要执行搜索的节点位置（无论树是否从根节点重新运行）；通过这种方式，即使其键值搜索重复，你也可以搜索该节点。第五个参数允许存储当前节点的位置；从其形状我知，它可以返回找到的节点的位置。\n\
  \n```c\nvoid findNode(void *data, Node *root, void **beef, int *post, int *i);\n\
  ```\n\n`findNode` 函数是递归的，并且五个参数。让我们分析最后三个参数，看看为什么它们是通过引用传递的：第三个，是为了向调用函数返回一个指向数据区域的指针；第四个，是为了能够返回这些数据所在节点的位置；第五个，以便所有正在运行的函数执行可以更新正在处理的当前节点的位置。也就是说，最后一个参数定义为这样是为了拥有一个可以被不同的执行会话共享的存储区域。`findNode`\
  \ 的进行中（将其想象成一个递归函数，每次对自身的调用都会生成该函数的新执行）。如果使用函数的局部变量，显然我们无法实现具有 `i` 的函数（因为它是函数局部的，其值不能被任何正在执行的执行修改）。相反，静态变量而不是局部变量可以被所有正在执行的执行修改，但在搜索结束和在开始下一个搜索之前将其设置为\
  \ 0，这会使代码变得复杂。前者的复制也适用于 `pos`。\n\n### 使用 abe 接口\n\n为了利用用于构建和处理完美平衡二叉树的接口所提供的支持，我们将在应用程序中定义这些函数：`readData`、`compare`、`process`\
  \ 和 `freemem`。这些函数的定义取决于将成为树的一部分的数据对象的类型。\n\n例如，让我们在一个构建一个完美平衡的二叉树，其中每个节点都指向一个 `Data`\
  \ 类型的对象（该类型在本章之前已经使用过）。记住，这种类型的每个对象封装了一个学生的姓名和他正在学习的某门课程的成绩。根据此，`readData` 函数将获取名称和成绩，从它们构造一个\
  \ `Data` 类型的结构，并返回该结构的指针以插入到树中。`compare`、`process` 和 `freemem` 函数将定义与为搜索二叉树设计的接口中相同的内容。\n\
  \n正如所出的，这些函数可以写成：\n\n```c\n// 读取将作为树节点引用的数据。\nvoid *readData()\n{\n    char name[50];\
  \ double note;\n    Data *student = NULL;\n    printf(\"name: \"); gets(name); printf(\"\
  note: \");\n    scanf(\"%lf\", &note); fflush(stdin);\n    // 创建一个 Data 类型的对象\n\
  \    student = (Data *)malloc(sizeof(Data)); if (!student) error();\n    strcpy(student->name,\
  \ name); student->note = note;\n    return (void *)student;\n}\n\n// 允许比较两个节点的数据。\n\
  int compare(void *data1, void *data2)\n{\n    char *name1 = ((Data*)data1)->name;\n\
  \    char *name2 = ((Data*)data2)->name;\n    return strcmp(name1, name2);\n}\n\n\
  // 允许显示访问节点的数据。\nvoid process(void *data)\n{\n    Data *student = (Data*)data;\n\
  \    printf(\"%s %g\\n\", student->name, student->grade);\n}\n\n// 释放访问节点的数据区域内存。\n\
  void freemem(void *data)\n{\n    free((Data*)data);\n}\n```\n\n////////////////////////////////////////////////\
  \ ///////////////\n\n最后，我们将编写 `TreeBinE.c` 应用程序，使用上述函数、操作和接口，创建一个完美平衡的二叉树，其中每个节点指向一个\
  \ `Data` 类型的结构。总结来说，此应用程序将执行以下操作：\n\n1. 定义一个初始化为 `NULL` 的指针 `root`，指向树的根。\n2. 调用\
  \ `build-Tree` 函数从 `n` 个节点构建平衡树。\n3. 显示树上的数据。\n4. 从树中获取节点。\n5. 在树中搜索所有出现项。\n6. 最后，释放内存。\n\
  \n```c\ntypedef struct\n{\n    char name[50];\n    double note;\n} Data;\n\n////////////////////////////////////////////////\
  \ ///////////////\n\n// 定义函数：readData, compare, process\n// 和 freemem，根据\n// interface_abe.h\
  \ 上的指定。\n\nvoid showTree(Node *root)\n{\n    inorder(root);\n}\n\nint main()\n{\n\
  \    Node *root = NULL;\n    Data *student = NULL, *alumSearched;\n    int numberOfNodes\
  \ = 0, pos = 0;\n\n    printf(\"Number of nodes: \");\n    scanf(\"%d\", &numberOfNodes);\
  \ fflush(stdin);\n    root = buildTree(numberOfNodes);\n\n    if (root == NULL)\
  \ return 0;\n\n    printf(\"\\nTree:\\n\");\n    showTree(root);\n\n    printf(\"\
  Node (0,1,2,...): \");\n    scanf(\"%d\", &pos); fflush(stdin);\n    student = getNode(pos,\
  \ root);\n\n    if (student == NULL) {\n        printf(\"搜索失败\\n\");\n    } else\
  \ {\n        printf(\"Student %s, note is %g\\n\", student->name, student->grade);\n\
  \    }\n\n    printf(\"查找树上所有的出现项。\\n\");\n    student = readData();\n    alumSearched\
  \ = search(student, root, &pos);\n    while (alumSearched != NULL) {\n        printf(\"\
  Node %2d, note is %g\\n\", pos, alumSearched->note);\n        pos++;\n        alumSearched\
  \ = search(student, root, &pos);\n    }\n\n    free(student);\n    deleteTree(&root);\n\
  \n    return 0;\n}\n```\n\n在随书的光盘中，在 `cap11\\treeBinE` 文件夹中，你可以找到该程序及其使用的接口。所有代码分为四个文件：`interface_abe.c`\
  \ 中的 abe 接口函数、`interface_abe.h` 中的 abe 接口函数原型、`node.h` 中的 Node 类型以及 `TreeBinE.c`\
  \ 中的应用程序（main 函数等）。\n\n### 训练解决\n\n1. 使一个应用程序，允许创建一个支持任何类型升序排列的线性列表。该列表将由 `tllseo`\
  \ 类型的结构定义（_list _linear _s 实现且链接或有序）：\n\n```c\ntypedef struct {\n    Element *p\
  \ = NULL; // 指向头节点\n    Element *ElemPrevious = NULL; // 前一个元素\n    Element *currentitem\
  \ = NULL; // 当前元素\n} tllseo;\n\n并且每个元素由 Element 类型的结构准备：\n\ntypedef struct s\n{\n\
  \    void *data; // 数据区域\n    struct s *following; // 指向后续元素的指针\n} Element;\n```\n\
  \n\n\n\n列表的 `elementCurrent` 成员将指向最后一个访问的元素，`elemPrevious` 指向当前元素的前一个元素，但当前元素是第一个元素除外，此时两个指针都将指向该元素。处理此类型就绪状态的接口包含以下函数：\n\
  \n```c\n// 显示错误消息并终止程序\nvoid error();\n\n// 创建一个新元素\nElement *newItem();\n\n// 启动就绪\n\
  void startList(tllseo *ready);\n\n// 表示就绪是否为空\nint emptyList(tllseo *ready);\n\n\
  // 下面函数应在使用此接口的应用程序中定义，\n// 它允许你根据每个时刻所需的属性\n// 比较就绪中的两个元素。\nint compare(void *data1,\
  \ void *data2);\n\n// 根据键值按升序添加元素\nvoid adddir(void *and, tllseo *ready);\n\n//\
  \ 在列表中查找元素\nint search(void *and, tllseo *ready);\n\n// 从就绪删除指定的元素\nvoid *delete(void\
  \ *and, tllseo *ready);\n\n// 删除就绪中的第一个元素\nvoid *deleteFirst(tllseo *ready);\n\n\
  // 获取就绪中的第一个元素\nvoid *getFirst(tllse *ready);\n\n// 获取当前元素的下一个元素\nvoid *getNext(tllseo\
  \ *ready);\n```\n\n`emptyList` 函数在列表为空时返回非零值，否则返回 `0`。\n\n`startList` 函数将值 `NULL`（空列表）赋值给\
  \ `tllseo` 类型结构体的各个元素。\n\n`compare` 函数必须在使用此接口的应用程序中定义，以便允许你根据每个时刻所需的属性来比较列表中的两个元素。\n\
  \n`adddir` 函数根据从数据区域选择的键值，按升序向列表中插入元素。为了找到插入点，它将调用 `find` 函数。插入将发生在 `prevElem` 和\
  \ `currentElem` 指向的元素之间。它有两个参数：一个指向要添加数据的 `void *` 类型指针和一个列表句柄指针。它不返回任何值。\n\n`find`\
  \ 函数定位元素在列表中的插入点，并在 `currentitem` 中存储指向目标元素的指针（如果存在）或指向下一个元素的指针（如果不存在），并在 `prevElem`\
  \ 中存储指向上一个元素的指针。它有两个参数：一个指向用于查找项数据的 `void *` 类型指针和一个列表句柄。返回一个整数，如果搜索的元素不在列表中则返回\
  \ `0`，反之返回非 `0`。\n\n`delete` 函数从列表中删除一个元素。要找到它，请调用 `find` 函数。它有两个参数：一个指向要删除元素数据的\
  \ `void *` 类型指针和一个列表句柄。返回被删除元素数据区域的指针，或者如果列表为空则返回 `NULL`。\n\n`deleteFirst` 函数删除列表中的第一个项。返回被删除元素的数据区域指针，或者如果就绪为空则返回\
  \ `NULL`。\n\n`getFirst` 函数返回元素数据区域的指针。如果列表为空则返回 `NULL`。\n\n`getNext` 函数返回元素数据区域的指针。返回当前元素的下一个，或者如果列表为空则返回\
  \ `NULL`。\n\n根据陈述，`llseo` 接口如下所示：\n\n```c\n// 处理 llseo 的接口 ///////////////////////////////\n\
  //\n\n// 显示错误消息并终止程序\nvoid error()\n{\n    printf(\"Insufficient memory\\n\"); exit(1);\n\
  }\n\n// 创建一个新元素\nElement *newItem()\n{\n    Element *q = (Element *)malloc(sizeof(Element));\n\
  \    if (!q) error();\n    return q;\n}\n\n// 启动就绪\nvoid startList(tllseo *ready)\n\
  {\n    list->p = list->currentitem = list->previtem = NULL;\n}\n\n// 表示就绪是否为空\n\
  int emptyList(tllseo *ready)\n{\n    return list->p == NULL;\n}\n\nint search(void\
  \ *and, tllseo *ready)\n{\n    int r = 0;\n    // 在就绪状态中查找查找元素的插入点。\n    // 该函数在\
