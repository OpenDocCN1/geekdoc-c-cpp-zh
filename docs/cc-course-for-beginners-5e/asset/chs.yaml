  [](Images/image18603.jpeg)\n[](Images/image18604.jpeg)\n\n#### 第 7 章\n# 指针\n\n###\
  \ 指针的创建\n\n\n\n\n\n我们注意到 `*` 是一个用于指向 `int` 类型对象的助记符，因此它可以出现在任何与整体变量相同的地方。也就是说，如果\
  \ `pint` 指向整数 `a`，那么 `*pint` 就可以出现在任何你可以让它到达的地方。例如，在下表中，这两列是等价的：\n\n| #include <stdio.h>\
  \ | #include <stdio.h> |\n| :--- | :--- |\n| main() | main() |\n| { | { |\n| int\
  \ to = 0; | int to = 0, *paint = &to; |\n| to = 10; | *paint = 10; |\n| to = to\
  \ - 3; | *paint = *paint - 3; |\n| printf(\"%d\\n\", to); | printf(\"%d\\n\", *pint);\
  \ |\n| } | } |\n\n假设已经定义了变量 `to`，那么定义：\n\n```c\nint *paint = &to;\n```\n\n等价于：\n\
  \n```c\nint *pint; int *paint = &to;\n```\n\n结论是，`*paint` 是存储在 `paint` 中存储的内存地址上的整体。这种推理适用于任何复杂的语句。另一个例子：\n\
  \n```c\n#include <stdio.h>\n#include <math.h> // 使用 sqrt 需要包含\nmain()\n{\n    double\
  \ *p = NULL, d = 0, x = 100; p = &x;\n    d = sqrt(x) + *p; printf(\"%g\\n\", *p);\
  \ // 打印 x 的当前值\n}\n```\n\n上面的例子说明了在表达式中它们出现的地方，`sqrt(x)` 和 `*p` 都代表 `double` 类型的值；也就是说，它们的行为与\
  \ `double` 类型的变量相同。\n\n指针所需的内存空间是指定机器地址所需的字节数，通常它们是 4 字节。\n\n一个正确初始化的指针始终指向特定类型的对象。未初始化的指针未知指向哪里。\n\
  \n### 运算符\n\n到目前为止我们看到的示例表明，在指针操作中，经常涉及地址操作符（`&`）和间接运算符（`*`）。\n\n一元运算符 `&` 返回其操作数的地址，而一元运算符\
  \ `*` 将其操作数解释为地址并并返回其内容（更多细节请见第二章）。例如：\n\n```c\n/* pointers.c */\n#include <stdio.h>\n\
  main()\n{\n    // 接下来的两行声明了变量整体 to，\n    // 指针 p 和 q 是整数，以及变量实 b。\n    int to =\
  \ 10, *p, *q;\n    double b = 0.0;\n    q = &to; // 将 to 的地址赋值给变量 q；\n    // 指向整体\
  \ to\n    b = *q; // 将 to 的值赋值给 b\n    *p = twenty; // 错误：赋值到 p 指向哪里？\n    printf(\"\
  At address %X is the data %g\\n\", q, b); \n    printf(\"In the address %X is the\
  \ fact %d\\n\", p, *p);\n}\n```\n\n在理论上，我们执行此程序时预期的结果与以下结果类似：\n\n在地址 12FF7C 处是 10\n\
  在地址 12FF78 处是 twenty\n\n但在实践中，当我们执行它时会发生错误，因为我们在使用一个指针 p 而不知道它指向哪里。我们知道 `q` 指向变量\
  \ `a`；换句话说，`q` 包含一个有效地址，但我们不能对 `p` 说同样，因为它还没有初始化，因此它的值对我们是未知的（可能包含垃圾值）；它可能是系统占用的地址。然后它尝试的操作将用值\
  \ 20 覆盖该地址的内容，这会导致严重问题。也许我会更清楚地像这样定义变量：\n\n```c\nint to = 10, b = 0, *p = NULL,\
  \ *q = NULL;\n// ...\n*p = twenty;\n```\n\n错误将像以前一样发生，但现在很清楚 `p` 存储的是地址 0，该地址由于被系统保留而无法写入。这就是主题。\n\
  \n### 指向对象类型的重要性\n\nC 如何知道要从一个地址给变量分配多少字节？例如，请看接下来的程序：\n\n```c\n#include <stdio.h>\n\
  main()\n{\n    int to = 10, *q = NULL; double b = 0.0;\n    q = &to; // 指向整体 to\n\
  \    b = *q; // 将 to 的值转换为 double 后赋值给 b\n    printf(\"In the address %X is the\
  \ fact %g\\n\", q, b);\n}\n```\n\n你会注意到在语句 `b = *q` 中，`b` 是 double 类型而 `q` 指向一个\
  \ int。问题是：C 如何知道为 `b` 分配多少字节？答案是 C 参考了指针声明时的对象类型，并分配了相应的字节数（四个而不是八）。\n\n同样，从上面可以推出，如果给指针赋值一个与其必须指向的对象不同类型的地址，那么对相同类型进行的操作将产生意外结果。例如：\n\
  \n```c\n#include <stdio.h>\nmain()\n{\n    double to = 10, b = 0; // 整体 double\n\
  \    int *p = NULL; // 指针 int\n    p = &to;\n    b = *p;\n    printf(\"b = %g\\\
  n\", b);\n}\n```\n\n编译此程序时，语句 `p = &to` 会产生警告，因为类型不匹配，`p` 指向 double，而实际上它们是 int。\n\
  \n### 指针操作\n\n对于指针类型的变量，除了 `&`、`*` 运算符和赋值运算符外，算术运算符 `+` 和 `-` 也可以使用。\n\n### 指针赋值\n\
  \nC 语言允许将一个指针赋值给另一个指针。例如：\n\n```c\n#include <stdio.h>\nmain()\n{\n    int to = 10,\
  \ *p, *q;\n    p = &to;\n    q = p; // 将 p 的地址赋值给 q\n    printf(\"In the address\
  \ %X is the value %d\\n\", q, *q);\n}\n```\n\n执行程序\n\n在地址 12FF7C 处是值 10\n\n然后运行赋值\
  \ `q = p` 后，`p` 和 `q` 指向内存中的同一个位置。对于整体来说，`*p` 和 `*q` 是相同的；说是 10。\n\n### 算术操作\n\n\
  对于指针，我知道你可以加或减一个整体。指针算术与普通算术的区别在于，这里的单位等同于指针类型的对象；也就是说，加 1 意味着指针将指向下一个对象。这里取决于指针的类型，加上此时所指向的对象。例如，假设\
  \ `p` 和 `q` 是指向同一个矩阵 `x` 元素的指针变量：\n\n```c\nint x[100];\nint *p, *q; // 声明 p 和 q\
  \ 为整数指针\np = &x[3]; // p 指向 x[3]\nq = &x[0]; // q 指向 x[0]\n```\n\n操作 `p + n`（其中\
  \ `n` 是整数）将指针在当前目标之后推进 `n` 个整数。例如：\n\n```c\np = p + 3; // 让 p 推进三个整数；现在指向 x[6]\n\
  ```\n\n\n\n\n同样，在执行上述操作 `p = p + 3` 之后，操作 `p - q` 将结果为 6（`int` 类型元素）。\n\n操作 `p -\
  \ n`（其中 `n` 是一个整数）也是有效的；从 `p` 指向的 `x[6]` 开始，以下操作的结果如注释所示：\n\n```c\np = p - 3; //\
  \ 让 p 向后回退三个整数；现在指向 x[3]\n```\n\n是的，`p` 指向 `x[3]`，`p++` 让 `p` 指向 `x[4]`，从该状态开始，`p--`\
  \ 让 `p` 再次指向 `x[3]`：\n\n```c\np++; // 让 p 指向下一个整数；指向 x[4]\np--; // 让 p 指向上一个整数；指向\
  \ x[3]\n```\n\n不，我知道它允许对指针进行加法、乘法、除法或旋转，而且我知道允许加上实数。单运算符 `*` 和 `&` 的优先级高于算术运算符 `+`\
  \ 和 `–`，且与 `++` 和 `--` 优先级相同。\n\n让我们继续看一些指针操作的示例。我们定义了矩阵 `x` 和两个指向整数类型的指针 `pa` 和\
  \ `bp`。\n\n```c\nint x[100], b, *pa, *bp;\n// ...\nx[50] = 10;\npa = &x[50];\nb\
  \ = *pa + 1; // 整数 *pa 加上 1 的和的结果\n// 我知道赋值给 b；例如 b = x[50] + 1\nb = *(pa + 1);\
  \ // pa 指向的下一个整数，\n// 赋值给 b；即 b = x[51]\nbp = &x[10]; // 我给 bp 分配了 x[10] 的地址\n*bp\
  \ = 0; // 元素 x[10] 被设为 0\n*bp += two; // 我知道 x[10] 增加了两个\n(*bp)--; // 我知道 x[10]\
  \ 减少了一个单位\nx[0] = *pb--; // 我向 x[0] 分配了来自 x[10] 和 bp 的值\n// 恰好指向上一个整数（指向 x[9]）\n\
  ```\n\n### 指针的比较\n\n当你比较两个指针时，你实际上是在比较两个整数，因为地址对应于一个整数值。这种操作是有意义的，前提是两个指针都指向同一个矩阵中的元素。例如：\n\
  \n```c\nint n = 10, *p = NULL, *q = NULL, x[100];\n// ...\np = &x[99];\nwhat = &x[0];\n\
  // ...\nif (q + n <= p) q += no;\nif (q != NULL && what <= p) // NULL 是一个常量，q++;\
  \ // 只要指针为空\n```\n\n第一个 `if` 语句表示，如果地址 `q+n` 小于或等于 `p`，则指针 `q` 将移动 `n` 个元素。第二个 `if`\
  \ 语句指明，如果它指定的地址 `no` 为空且小于或等于 `p` 指定的 `what`，则 `q` 将指向数组的下一个元素。\n\n### 通用指针\n\n\
  指向任何类型对象的指针都可以转换为 `void *` 类型。因此，类型 `void *` 的指针接收来自通用指针的 `Name`。例如：\n\n```c\nvoid\
  \ fnx(void *, int); main()\n{\n    int x[100], *q = x; // 我声明了什么，我知道你分配了地址 x\n \
  \   //（矩阵的名称是从矩阵开始的地址）\n    // ...\n    fnx(q, 10); // 示例\n}\n```\n\n指向任何类型对象的指针都可以转换为\
