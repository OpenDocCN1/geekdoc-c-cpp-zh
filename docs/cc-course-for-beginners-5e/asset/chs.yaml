  \ 编写程序 `01.c` 和 `02.c`。\n\n#### 输入与输出\n\n![Images/image1806.jpg]\n\n当程序执行时，基本上有三件事发生：输入、输出和内存。\n\
  \n![Images/image1807.jpg]\n\n输出不会从内存中删除数据；它只是将它们显示在显示器上、写入文件或保存到其中。\n\n```c\nassignment\
  \ = value\n```\n\n\n\n\n流（Stream）是一种数据结构，在程序与信息的源或目的地之间充当中间媒介。也就是说，程序的读取或写入操作将进入流中，而无需关心信息从哪里来或去往哪里，也不关心读取或写入的是什么类型的数据。这种抽象层次使得程序不需要知道设备，也不需要信息的类型（简单地读取或写入字节），这简化了编写程序的难度。\n\
  \n因此，若要让程序从源获取信息，你必须打开一个流；同样地，你可以将信息发送到目的地。在 C/C++ 中，当程序执行时，这些流会自动打开。有两个流：`stdin`（标准输入）是来自源的流，`stdout`（标准输出）是流向目的地的流。\n\
  \n在 C 中，`stdin` 绑定到键盘，`stdout` 绑定到屏幕。这意味着程序从 `stdin` 读取的数据来自键盘，而所有写入 `stdout` 的数据都会显示在屏幕上。\n\
  \n### 格式化输出\n\n`printf` 函数允许你使用指定的格式化字符串向 `stdout` 写入字节（字符）。该函数返回一个整数值，等于写入的字符数。该函数的声明在\
  \ `stdio.h` 中，如下如下：\n\n```c\n#include <stdio.h>\n\nint printf(const char *format\
  \ [ , argument ]...);\n```\n\n兼容性：ANSI、UNIX 和 Windows\n\n格式（Format）指定输出的形式。它是一个字符字符串，由普通字符、转义序列和格式中的说明符组成。格式从左到右读取。\n\
  \n`unsigned int age = 0; float weight = 0;`\n\n![](img/image18511.jpeg) // ...\n\
  \n格式中的说明符\n\n`printf(\" has %or years and weight %g kilograms \\n \", age, weight);`\n\
  \n![](img/image18512.jpeg)![](img/image18513.jpeg)\n\n普通字符、转义序列、`argument` 代表要写入的值或多个值。每个参数必须有格式中对应的说明符，且顺序相同。如果参数多于格式说明符，多余的参数将被忽略。\n\
  \n![](img/image18514.jpeg) `printf(\"Has %or years and weight %g kilos\\n\", age\
  \ , weight );`\n\n当执行上述语句时，普通字符将原样写入，格式说明符将被替换为对应的值。参数列表中的参数和转义序列将产生它们代表的字符或动作。因此，当\
  \ age 等于 20，weight 等于 70.5 时，结果为：\n\n二十岁体重 70.5 公斤\n\n一个格式说明符由以下部分组成：\n\n`%[ flags\
  \ ][ width ][ .precision ][{h|l|L}] type`\n\n格式说明符始终以 `%` 开头。所示每个元素的含义如下：\n\n标志（flags）含义\n\
  \n![](img/image18515.jpeg)\n\n- 将结果在指定的宽度内左对齐。默认是右对齐。\n- `+` 在值的前面加上符号 `+` 或 `-`。默认仅对负值加上符号\
  \ `-`。\n- `0` 用 0 填充值，直到达到指定的最小宽度。\n- ` `（空格）在正数值值前面加上一个空格。如果与 `+` 一起使用则会被忽略。\n\
  - `#` 当与格式说明符 `o`、`x` 或 `X` 使用时，分别在值的前面加上 `0`、`0x` 或 `0X`。\n- 当与格式说明符 `e` 使用时，强制值在所有情况下都包含小数点。\n\
  - 当与格式说明符 `g` `G` 使用时，强制输出值在所有情况下都包含小数点，并避免尾零被截断。\n- 与 `c`、`d`、`i` 或 `u` 无。\n\n\
  ![](img/image18516.jpeg)\n\n- `width`（宽度）输出的最小位置数。如果写入的值占据的位置超过指定，则需要增加宽度。\n- `precision`（精度）含义取决于值的类型。\n\
