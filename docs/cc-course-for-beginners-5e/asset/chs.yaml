  \ 的结果。\n\nd) `main` 函数将读取 `a`、`b`、`n`、`x` 和 `y` 的值。\n\n\n\n\n\n# 通信与流\n\n程序与某些信息的源或目的地之间的通信是通过信息流（英语中称为\
  \ stream）完成的。流本质上是一个在程序与信息源或目的地之间起到中间作用的数据结构。也就是说，程序对流进行读取或写入时，无需关心信息从哪里来或去向何处，也不关心所读或写的数据类型。这种抽象级别使得程序不需要知道设备或信息的类型，让编写读写程序变得更加容易。\n\
  \n![](img/image18711.jpeg)\n![](img/image18712.jpeg)\n\n## 文件操作\n\n因此，程序要从文件中获取信息，你必须打开一个流并读取存储其中的信息。同样，为了让程序向文件发送信息，它必须同时打开流并写入信息。\n\
  \n读取和写入数据的算法大体是相同的：\n\n| 读取 | 写入 |\n| :--- | :--- |\n| 从文件打开流：在读取信息时，执行读取操作，关闭流\
  \ | 打开指向文件的流：在写入信息时，执行写入操作，关闭流 |\n\n## 在 C/C++ 中的实现\n\n在 C/C++ 中，打开流涉及创建一个类型为 `FILE`\
  \ 的数据结构；该类型在 C/C++ 库中定义。因此：\n\n```c\nstructure _iobuf\n{\n    char *_ptr; // 指向缓冲区的位置，下次\
  \ I/O 操作将在此执行。\n    int _cnt; // 计数器，表示缓冲区中剩余待读或待写的字节数。\n    char *_base; // 指向输入缓冲区的指针。\n\
  \    char _flag; // 包含文件访问模式以及访问时可能产生的错误的掩码。\n    char _file; // 文件描述符。\n    int\
  \ _charbuf; // (通常为 0)\n    int _bufsiz; // 缓冲区大小。\n    char *_tmpfname; // (通常为\
  \ NULL)\n};\n\ntypedef structure _iobuf FILE;\n```\n\n该结构定义了一个缓冲区以及在其内移动所需的成员。一个所有函数都从中受益的非常有趣的特性是\
  \ I/O 连接。缓冲区是一块内存，作为 I/O 操作的中间环节。为了理解使用它的原因，请观察下图：\n\n![](img/image18713.jpeg)\n\
  \n之前的图示表明，当程序执行输入语句（请求数据）时，从设备获取的数据可以存储在缓冲区中，其块大小比程序实际读取的块更大（例如，从磁盘读取数据时，传输的最小信息量等同于一个分配单元）。这提高了执行速度，因为当程序下次需要数据时，如果还有更多数据，它将无需等待，因为数据已经在缓冲区中了。\n\
  \n另一方面，当处理输出操作时，数据在缓冲区满之前（或在隐式或显式强制刷新之前）不会被发送到目的地，这减少了对设备的访问次数。物理访问总是远慢于内存访问，从而提高了执行速度。\n\
  \n## 流管理\n\n根据上述，在从文件打开流之前，有必要定义一个类型为 `FILE` 的结构，并在其创建流。一旦流被打开，程序将在该流上执行所有的 I/O\
  \ 操作，通过 `FILE` 结构中的成员 `_file` 保持与文件的连接。\n\n当你完成对流的操作后，必须关闭流。如果流没有被显式关闭，它将在线程结束时自动关闭。但是，建议在完成工作后关闭每个流，以断开它与打开文件之间的连接，从而允许其他应用程序使用该文件。\n\
  \n## 标准流\n\n同样，当 C/C++ 程序开始执行时，它们会自动打开三个与三个设备链接的流。这些流和默认链接的设备如下：\n\n![](img/image18714.jpeg)\n\
  \n| 流 | 设备 | 链接内容 |\n| :--- | :--- | :--- |\n| `stdin` | 标准输入设备（键盘） | |\n| `stdout`\
  \ | 标准输出设备（显示器） | |\n| `stderr` | 标准错误设备（屏幕） | |\n\n![](img/image18715.jpeg)\n![](img/image18716.jpeg)\n\
  \n■ 在 Windows 操作系统应用程序中，除了这三个流，根据机器设置可能还有两个：\n- `stdin`（标准输出）\n- `aux`（串口）\n\n##\
  \ 通用 FILE 结构\n\n`FILE` 结构无论其类型如何，都是以二进制形式存储的字节序列。例如，如果我们用文本编辑器打开 `helloworld.c`，它将显示如下：\n\
  \n```c\n#include <stdio.h>\n#include <stdlib.h>\n\nint main() {\n    printf(\"Hello\
  \ world!\\n\");\n    system(\"pause\");\n    return 0;\n}\n```\n\n虽然文件中的所有信息都是用\
  \ 0 和 1（位——二进制）写入的，但文件的每个字节（每八位）都对应于所使用的字符表（ASCII, ANSI, UNICODE 等）中的一个字符；因此，这些文件被称为文本文件。\n\
  \n\n\n\n\n几乎所有的 Windows 都使用字符代码 ANSI 扩展。这意味着，如果我们使用像 `notepad` 这样的应用程序在文件中写入字符 `á`，该字节将存储在上述文件中为\
  \ `e1`（代码 225）。如果现在，使用同一个应用程序或另一个，我们显示该文件的内容，代码字符 `e1` 将显示出来，如果应用程序以 ANSI 工作（如 `Notepad`、`WordPad`、`Word`、`Visual\
  \ C++` 等），它将显示为 `á`；而如果你使用 ASCII 代码（如 Windows 控制台的情况），它将显示为 `β`。也就是说，某个代码所对应的字符取决于应用程序所使用的代码表。一些例子如下：\n\
  \n| 代码十六进制 | ASCII | ANSI | UNICODE | \n| :--- | :--- | :--- | :--- |\n| 61 | to\
  \ | to | to |\n| e1 | β | to | to |\n| f1 | ± | ñ | ñ |\n\n在 Linux 中，目前使用的是 UTF-8，并且正在逐渐使用\
  \ `UNICODE`（每个字符代码 16 位）。同样，在 Linux 上，以及通用的 UNIX 上，通常 C 语言用于将插入点置于下一行开头的字符 `\\n`\
  \ 是单个字符编码的：`0a` (LF)。根据此，为了让 C 语言编写的程序都能在 Linux 和 Windows 上运行（记住 C 语言最初的设计就是为了用这种语言编写\
  \ UNIX，以便其对其他机器的移植性），Windows 的 C 编译器被编写为将序列 `0d 0a` 上的字符 `\\n` 翻译为向设备写入文本，反之，从 `0d\
  \ 0a` 仅变为 `0a` 以从设备读取文本。\n\n为了理解所说的内容，我们将做一个小例子。你将会看到——正如我们稍后看到的，向文件中写入文本，可以使用 `fprintf`\
  \ 函数（`printf` 的通用版本）。该函数的用法与 `printf` 相同，但它多了一个参数，第一个参数对应于定义要写入文件的流 `stream`。你必须先打开文件（注意\
  \ `fopen` 中的 `you`），并在最后用 `close` 将其关闭。\n\n```c\n// crlf-tc\n#include <stdio.h>\n\
  \nint main ()\n{\n    FILE *pf; // flow\n\n    // 打开文件\n    pf = fopen(\"myfile-t.txt\"\
  , \"w t \"); // w: write, you: file from text\n\n    // 写入文件 fprintf(pf, \"Hello\
  \ world!\\n\");\n    fprintf(pf, \"%d * %d = %d\\n\", 9, 256, 9*256);\n\n    //\
  \ 关闭文件 fclose(pf);\n    return 0;\n}\n```\n\n当你运行这个程序时，将创建一个文件 `myfile-t.txt`，内容包含“\
  \ Hello world!\\n ”加上数字 `9`、`256` 和 `2304`。显示该十六进制文件的内容：\n\n```\n00000000 a1 48\
  \ 6f 6c 61 twenty 6d 75 6e 64 6f twenty-one 0d 0a 39 twenty .Hello world!..9\n00000010\
  \ 2a twenty 32 35 36 twenty 3d twenty 32 23 30 3. 4 0d 0a * 256 = 2304..\n```\n\n\
  注意，文本是以 ASCII 写入的，字符 `\\n` 被编码为 `0d 0a`，数字也都是用 ASCII 编码的，每个数字使用一个字节。\n\n通过在 `fopen`\
  \ 上使用 `b`（二进制文件）代替 `you`（文本文件）来修改程序，并将名称更改为我现在知道应该称呼的 `myfile-b.txt`：\n\n```c\n\
  pf = fopen(\"myfile-b.txt\", \"w b \"); // b = file binary\n```\n\n运行该程序。我知道它将创建文件\
  \ `myfile-b.txt`。显示这个十六进制文件的内容：\n\n```\n00000000 a1 48 6f 6c 61 twenty 6d 75 6e\
  \ 64 6f twenty-one 0a 39 twenty 2a .Hello world!.9 *\n00000010 twenty 32 35 36 twenty\
  \ 3d twenty 32 23 30 3. 4 0 to 256 = 2304.\n```\n\n将此结果与上一个比较，我们发现现在字符 `\\n` 没有被翻译为\
  \ `0d 0a`，而是保留为 UNIX 格式：`0a`。内容的其余部分没有变化；也就是说文本和数字仍然以 ASCII 表示。\n\n另外一个例子，但现在使用\
  \ `fwrite` 函数（我们稍后会学习一下）代替 `fprintf`：\n\n```c\n// binary-bc\n#include <stdio.h>\n\
  int main()\n{\n    int n = 0;\n    char *s = \"Hello world!\\n\";\n    FILE *pf;\
  \ // flow\n    // 打开文件\n    pf = fopen(\"myfile-b.bin\", \"wb\"); // b = file binary\n\
  \    // 写入文件\n    fwrite(s, strlen(s), 1, pf);\n```\n\n\n\n- “`a`” 以追加模式打开文件并在末添加信息。如果文件不存在，则会创建。\n\
  - “`r+`” 以读写混合模式打开文件。该文件必须存在。\n- “`w+`” 以读写混合模式打开文件。如果文件不存在，则会创建；如果文件已存在，则会破坏其内容以重新创建。\n\
  - “`a+`” 以读写追加模式打开文件。如果文件不存在，则会创建。\n\n![](img/image18718.jpeg)\n\n文件一旦打开，R/W 指针（记住，此指针始终指示从哪个位置开始下一次读取或写入）会被自动放置在文件开头，但\
  \ `Add` 模式除外，它被放在文件末尾。\n\n■ 在 Windows 操作系统下使用 C 编译器工作时，必须考虑下述事项；因此，如果你是 UNIX 用户，请跳过这些内容。与\
  \ UNIX 不同，在 Windows 中，文件可以作为文本文件或二进制文件打开。需要两种不同的形式是因为 C 和 Windows 之间存在不兼容性，因为 C\
  \ 最初是为 UNIX 设计的。对于设备文件或文本文件，C 中用于换行的字符 `\\n` 在输出操作中会被翻译两个字符（CR+LF），反之，当从数据输入时，CR+LF\
  \ 组合会被翻译为单个字符 `\\n`（LF）。这意味着在 Windows 上，当 C 程序写入时，会将字符 `\\n` 转换为字符 CR+LF；当 C 从文件读取并发现字符\
  \ CR+LF 时，会将它们翻译为 `\\n`；而当发现 Ctrl+Z 时，它会将其解释为 `EOF`（文件结束符）。这种翻译在让我们移动文件指定数量的字节（使用\
  \ `fseek` 函数）时可能会导致问题。为了避免此类问题，请使用二进制文件，这样就不会发生上述的翻译。\n\n■ 正如前一段所述，所提到的访问形式可以在它们后面添加\
  \ `t` 或 `b` 字符（例如 `rb`、`a+b` 或 `ab`），以指示文件是文本格式还是二进制。该选项不属于 C 语言标准，而是 Microsoft\
  \ C 的扩展。如果没有指定 `t` 或 `b`，则使用存储在全局变量 `_fmode` 中的值。\n\n■ 在 UNIX 上，即使语法上接受 `b` 选项也会被忽略。这允许在\
  \ Windows 中制作的程序移植到 UNIX。\n\n`fopen` 函数返回一个类型为 `FILE` 的结构体指针，该结构提供了数据流支持。空指针表示错误。每当你需要对文件进行读取和/写入数据的操作时，C\
  \ 库的 I/O 函数就会使用此流。因此，在调用函数 `fopen` 之前必须定义一个类型为 `FILE` 的结构体指针。例如：\n\n```c\n#include\
  \ <stdio.h> main()\n\n{\n\nFILE *pf;\npf = fopen(\"data\", \"w\");  // 打开文件 data\n\
  if (pf == NULL)\n{\nprintf(\"Error: the file no I know can open\\n\"); exit(1);\n\
  }\n// ...\n\nfclose(pf);  // 关闭文件\n}\n```\n\n此示例创建了一个由 `pf` 引用数据文件的流。这翻译为我所知的以写入模式打开\
  \ data 文件（如果文件已存在，它会被破坏；如果不存在，则会被创建）。一旦打开，用于读取和写入的函数将通过 `pf` 进行（为了方便起见，我们可以把 `pf`\
  \ 想象成就是文件本身）。\n\n### `freopen`\n\n`freopen` 函数解绑当前与 `pstream` 所指流关联的设备或文件，并将 `pstream`\
  \ 重新分配给 `nomfi` 指定的文件。通常用于将 `stdin`、`stdout` 或 `stderr` 重定向到用户指定的特殊文件。模式参数的描述与 `fopen`\
  \ 函数提供的相同。\n\n```c\n#include <stdio.h>\n\nFILE *freopen(const char *nomfi, char\
  \ *mode, FILE * pflow);\n```\n\n兼容性：ANSI, UNIX 和 Windows\n\n`freopen` 函数返回指向相同数据流的指针，或者如果发生错误则返回空指针，在这种情况下，原始流将保持关闭状态。\n\
  \n以下示例展示了其用法：\n\n```c\n#include <stdio.h>\n\nFILE *freopen(const char *nomfi, char\
  \ *mode, FILE * pflow); // 逻辑占位符\n```\n\n`freopen` 函数返回指向相同数据流的指针，或者如果发生错误则返回空指针，在这种情况下，原始流将保持关闭状态。\n\
  \n以下示例展示了其用法：\n\n```c\n#include <stdio.h>\nmain()\n\n{\n\nFILE *pf;\npf = freopen(\"\
  data\", \"w\", stdout);\nif (pf == NULL)\n{\nprintf(\"Error: the file no I know\
  \ can open\\n\"); exit(1);\n}\nprintf(\"hello\\n\");\nfclose(pf);\n}\n```\n\n此示例将\
  \ `stdout` 重新分配给 `data`。\n\n### `fclose`\n\n`fclose` 函数关闭由 `pf` 引用的流，从而释放文件。\n\n\
  `fclose` 函数关闭由 `pf` 引用的流，从而释放文件。对已关闭文件的任何操作在程序结束时会自动关闭。\n\n`fclose` 函数关闭由 `pf` 引用的流，从而释放文件。\n\
  \n（此处省略重复内容，已根据要求处理）\n\n\n\n\n在之前的示例中，我知道调用函数 `fopen` 来打开文件以进行读取（`r`）；为了读取一个打开文件，该文件必须存在。继续，如果打开数据文件的操作成功发生，它会尝试向其中写入一个字符串，并检查该操作是否正确完成。为了做到这一点，`ferror`\
  \ 函数查询与文件关联的流的成员 `_flag`，在某些情况下，它可以检测到上次写入操作是否发生了错误。`ferror` 函数向控制台发送消息，而 `clearerr`\
  \ 函数则将置为 1 重置为 0 的错误位。我应该这个错误应该是关于我以读取模式打开的文件，而不是为了写入的。是的，如果我们没有进行这种验证，我们将无法意识到这个错误，因为系统主题不会发送任何消息。\n\
  \n### ugly\n\n当创建一个文件时，系统会自动在文件的末尾添加一个文件结束的标记。这样，当在对文件进行读取操作时，如果尝试读取文件结束标记之外的内容，系统会自动将关联流的\
  \ `_flag` 成员的“文件结束”位设置为 1。程序可以通过调用函数 `feof` 来获取此标志位的状态，其原型如下：\n\n```c\n#include\
  \ <stdio.h>\nint feof(FILE * ff );\n```\n\n兼容性：ANSI, UNIX 和 Windows\n\n当我尝试读取并遇到标记\
  \ `eof`（end of file - 文件结束结束）时，函数 `ugly` 会返回一个不同于 0 的值，而不是当我读取最后记录时。在另一种情况下，返回 0。例如：\n\
  \n```c\n// ...\n\n// 在这里读取文件的第一条记录\n\nwhile (!feof(pf)) // 当我还没有到达文件的最后时\n\n{\n\
  \    // ...\n\n    // 在这里读取文件的后续记录\n}\n\nfclose(pf);\n```\n\n上例中的 `while` 循环允许你从引用的文件中读取信息。通过\
  \ `pf` 直到文件末尾。当尝试读取文件之外的内容时，与该文件关联的流的 `_flag` 成员的 `eof` 位设置为 1，`feof` 在下一次被调用时将检测到这种状态。返回一个不同于\
  \ 0 的值，就是循环结束时的做法。\n\n### dog\n\n`perror` 函数向标准输出 `stderr` 写入错误消息，指定的消息后跟一个冒号，然后是系统生成的错误消息，并以\
  \ `\\n` 结束。原型原型：\n\n```c\n#include <stdio.h>\n\nvoid perror(const char * message\
  \ );\n```\n\n兼容性：ANSI, UNIX 和 Windows\n\n下面的示例显示了如何使用此函数。观察它与上面的示例相同，但现在使用 `perror`\
  \ 函数而不是 `printf` 来视觉化错误消息。\n\n```c\n//  perror.c\n\n//\n\n#include <stdio.h>\n#include\
  \ <stdlib.h>\n\nmain()\n{\n    FILE *pf;\n    char *chain = \"This chain never be\
  \ written\";\n    if ((pf = fopen(\"data\", \"r\")) == NULL)\n    {\n        dog(\"\
  data\"); exit(1);\n    }\n    fprintf(pf, \"%s\\n\", chain);\n    if (ferror(pf))\n\
  \    {\n        dog(\"Error to the to write on the file\"); clearerr(pf);\n    }\n\
  \    fclose(pf);\n}\n```\n\ndata 文件不存在，将显示消息：\n`data: No such file or directory`\n\
  \n这些消息存储在哪里？C 库变量 `sys_errlist` 是一个数组，包含按错误编号排序的错误消息。矩阵中的元素数量由系统变量 `sys_nerr` 给出。`perror`\
  \ 函数使用 `errno` 变量的值作为索引在该数组中查找错误消息，因为该变量存储了我知道已经产生的错误编号。\n\n系统变量 `errno`、`sys_errlist`\
  \ 和 `sys_nerr` 声明在头文件 `stdlib.h` 中。然而，如果没有包含此文件，我们可以如下在外部声明它们。你可以在头文件 `errno.h`\
  \ 中看到错误数字。下面的代码将允许你视觉化所有的错误消息。\n\n```c\n//  errno.c\n\n//\n\n#include <stdio.h>\n\
  #include <stdlib.h>\n\n//  external int wrong; // 错误数字\n\n//  external char *sys_errlist[];\
  \ // 错误信息\n\n//  external int sys_nerr; // 错误元素\n\nmain()\n{\n    int i;\n    for\
  \ (i = 0; i < sys_nerr; i++)\n    {\n        printf(\"Error: %d, %s\\n\", i, sys_errlist[i]);\n\
  \    }\n}\n```\n\n### R/W POINTER\n\n当对文件执行 I/O 操作（读/写）时，这些操作中的每一个总是从定义的指针开始。最初，当打开一个文件时，指针指向开头。\n\
  \n可以使用以下方法获取并修改 R 写 指针。\n\n### ftell\n\n此函数允许获取文件中的当前位置。其原型为：\n\n```c\n#include\
  \ <stdio.h>\nlong ftell(FILE * ff );\n```\n\n### fseek\n\n此函数将指针移动到新位置。其原型为：\n\n\
  ```c\n#include <stdio.h>\nint fseek(FILE * pf , long pos , int what );\n```\n\n\
  `fseek` 函数返回 0 表示运行成功，否则返回其他值。例如：\n\n```c\nfseek(pf, 0L, SEEK_END);\n```\n\n此判断将指针置于文件的最后。\n\
  \n### rewind\n\n在 Windows 上，对于作为文本打开的文件，`fseek` 由于 `\\n` 到 CR+LF 的转换可能会产生意外结果。因此，在文本文件上使用\
  \ `fseek` 函数配合偏移量 0（跳转到开头或结尾）或通过 `ftell` 函数从文件开头返回的偏移量是安全的。为了避免此类问题，建议对二进制文件操作。\n\
  \n调用此函数等同于调用指示的 `fseek`，但 `rewind` 会重置错误位并将错误位置为 0。\n\n```c\n#include <stdio.h>\n\
  void rewind(FILE * ff );\n```\n\n### IS CHARACTER TO CHARACTER\n\n可以使用 `fputc` 和\
  \ `fgetc` 函数分别地将数据逐字符地写入文件或设备，或者很好地逐字符地读取。\n\n### fputc\n\n此函数在指针指示的位置向（读/写（你））与\
  \ `pf` 关联的文件或设备上写入一个字符。\n\n\n\n\n\n```c\n#include <stdio.h>\n\nint fputc(int car,\
  \ FILE *ff);\n```\n\n兼容性：ANSI, UNIX 和 Windows\n\n`fputc` 函数返回写入的字符，如果发生错误则返回 `EOF`。然而，由于\
  \ `EOF` 是 `car` 接受的值，因此最好使用函数 `ferror` 来检查是否发生了错误。\n\n例如，以下程序创建了一个名为 `text` 的文件，并将缓冲区数组中存储的字符字符串写入其中。关于如何使用\
  \ `fputc` 函数逐个字符地写入文件：\n\n```c\n/****** 向文件逐个字符地写入数据 *******/\n/*  fputc.c\n*/\n\
  \n#include <stdio.h>\n#include <stdlib.h>\n#include <string.h>\n\nmain() {\n   \
  \ FILE *pf;\n    char buffer[81];\n    int i = 0;\n    // 以写入模式打开文件 \"text\"\n \
  \   if ((pf = fopen(\"text\", \"w\")) == NULL) {\n        printf(\"The file no I\
  \ know can to open\");\n        exit(1);\n    }\n    strcpy(buffer, \"East is a\
  \ text written by fputc!!\\n\");\n    while (!ferror(pf) && buffer[i])\n       \
  \ fputc(buffer[i++], pf);\n    if (ferror(pf))\n        printf(\"Error during the\
  \ writing\");\n    fclose(pf);\n}\n```\n\n注意，每次对文件执行写入操作时，我都会调用 `ferror` 函数来检查是否发生了错误。\n\
  \n### fgetc\n\n此函数从与 `pf` 关联的文件或设备的读/写指针指示的位置读取一个字符，并将读/写位置移动到下一个字符。\n\n```c\n#include\
  \ <stdio.h>\nint fgetc(FILE *ff);\n```\n\n兼容性：ANSI, UNIX 和 Windows\n\n`fgetc` 函数返回读取的字符，如果发生错误或检测到文件结束则返回\
  \ `EOF`。然而，由于 `EOF` 是一个接受的值，请使用函数 `ferror` 或 `feof` 来区分是检测到了文件结束还是发生了错误。\n\n例如，以下程序逐个字符地读取名为\
  \ `text` 的文件中所有信息，并将其存储在名为 `buffer-fer` 的数组中。\n\n```c\n/****** 从文件逐个字符地读取数据 *******/\n\
  /*  fgetc.c\n*/\n\n#include <stdio.h>\n#include <stdlib.h>\n\nmain() {\n    FILE\
  \ *pf = NULL;\n    char buffer[81];\n    int i = 0;\n    // 打开 \"text\" 文件进行读取\n\
  \    if ((pf = fopen(\"text\", \"r\")) == NULL) {\n        printf(\"The file no\
  \ I know can to open\");\n        exit(1);\n    }\n    while (!ferror(pf) && !feof(pf))\n\
  \        buffer[i++] = fgetc(pf);\n    buffer[--i] = '\\0';\n    if (ferror(pf))\n\
  \        printf(\"Error during the reading\");\n    fclose(pf);\n    printf(\"%s\"\
  , buffer);\n}\n```\n\n作为一个应用，我们将编写一个程序 `copy`，将磁盘上的任意文件复制到另一个文件，并显示复制的字符数。涉及的文件将在执行复制程序时作为命令行参数传递。例如，要将\
  \ `file1` 复制到 `file2`，我们将写入：\n\n`copy file1 file2`\n\n此命令将运行 `copy` 程序，该程序会将 `file1`\
  \ 复制到 `file2` 并显示复制的字符数。该过程基本上包括从 `file1` 读取一个字符，将其写入 `file2`，计数器加 1，并重复该过程直到到达数据的末尾。以下是完整的程序示例：\n\
  \n```c\n/********** 从文件复制内容到另一个文件 *******/\n/*  copy.c\n*/\n\n#include <stdio.h>\n\
  #include <stdlib.h>\n\nmain(int argc, char *argv[]) {\n    FILE *off = NULL, *org\
  \ = NULL;\n    int count = 0, car = 0;\n    // 从参数中获取数量\n    // 命令行命令行行\n    if\
  \ (argc != 3) {\n        printf(\"Syntax: copy origin destination\\n\");\n     \
  \   exit(1);\n    }\n    // 以二进制读模式打开 argv[1] 指定的文件\n    // 以二进制写模式打开 argv[2] 指定的文件\n\
  \    if ((org = fopen(argv[1], \"rb\")) == NULL || (off = fopen(argv[2], \"wb\"\
  )) == NULL) {\n        printf(\"The file no I know can to open\");\n        exit(1);\n\
  \    }\n    // 复制\n    while (!ferror(org) && !feof(org)) {\n        car = fgetc(org);\n\
  \        if (car != EOF) {\n            fputc(car, off);\n            count++;\n\
  \        }\n    }\n    if (ferror(org))\n        printf(\"Error during the writing\"\
  );\n    printf(\"Copied %d characters\\n\", count);\n    fclose(org);\n    fclose(off);\n\
  }\n```\n\n### ... (每次对文件执行写入操作时，我都会调用 `ferror` 函数来检查是否发生了错误。)\n\n### fputs\n\n此函数允许将字符字符串写入文件或设备。其原型为：\n\
  \n```c\n#include <stdio.h>\nint fputs(const char *string, FILE *ff);\n```\n\n兼容性：ANSI,\
  \ UNIX 和 Windows\n\n`fputs` 函数将存储在 `string` 中的字符字符串复制到文件或设备。如果成功，则返回一个非负值；否则，返回\
  \ `EOF`。\n\n### fgets\n\n此函数允许从文件或设备读取字符字符串。其原型为：\n\n```c\n#include <stdio.h>\n\
  char *fgets(char *string, int no, FILE *ff);\n```\n\n\n\n\n作为一个应用程序，以下程序将从标准输入读取文本行，并将其存储在一个文件中，文件名也将从键盘输入。为了方便恢复，请确保文件中存储的每个字符串后面都紧跟字符\
  \ '\\n'（如果我们要从 `stdin` 读取，我们使用 `fgets`，这样我们就不需要担心细节了）。最后——程序将可视化所创建的文件内容。\n\n```c\n\
  /***********  字符链的进出口  ***********/\n\n/*  fgets.c\n*/\n\n#include <stdio.h>\n#include\
  \ <stdlib.h>\n#include <string.h>\n#define N 81\n\nmain()\n{\n    FILE *pf = NULL;\n\
  \    char buffer[N], nomfi[13];\n    printf(\"Name the file: \");  fgets(namefi,\
  \ 13, stdin);\n    fflush(stdin);  //移除可能的剩余写入字符\n    if (nomfi[strlen(nomfi)-1]\
  \ == '\\n')\n        nomfi[strlen(nomfi)-1] = 0;  //移除 \\n\n    // 打开文件 nomfi 进行读写操作\n\
  \    if ((pf = fopen(nomfi, \"w+\")) == NULL)\n    {\n        printf(\"The file\
  \ %s no can open.\", nomfi);\n        exit(1);\n    }\n    printf(\"File %s open\\\
  n\", nomfi);\n    printf(\"Enter data. Finalize every line with <Enter>\\n\"); \
  \ printf(\"For end up enter the brand eof\\n\\n\");\n\n    while (fgets(buffer,\
  \ N, stdin) != NULL)\n    {\n        // 将链写入文件并在后面跟上 \\n\n        fputs(buffer,\
  \ mp);\n        if (ferror(pf))\n        {\n            dog(\"Error to the to write\"\
  ); exit(2);\n        }\n    }\n    // 显示文件内容\n    rewind(pf);  //回到文件开头\n    //\
  \ 读取到 '\\n' 或达到 N-1 个字符\n    while (fgets(buffer, N, pf) != NULL)\n    {\n     \
  \   printf(\"%s\", buffer);\n        if (ferror(pf))\n            dog(\"Error during\
  \ the reading\");\n    }\n    fclose(pf);\n}\n```\n\n我们知道，当 `fgets` 函数读过文件结束标志时，它返回值\
  \ `NULL`。另一种检测文件末尾的方法（如下所示）是使用 `feof` 函数。因此，在读取之前，有必要询问是否已经到达了文件的末尾。\n\n```c\nfgets(buffer,\
  \ N, mp);\nwhile (!ferror(pf) && !feof(pf))\n{\n    printf(\"%s\", buffer);\n  \
  \  fgets(buffer, N, mp);\n}\n```\n\n### 格式化进出口\n\n数据可以用格式（Format）写入文件或设备，或者很好地，分别使用\
  \ `fprintf` 函数和 `fscanf` 进行读写。\n\n### fprintf\n\n此函数允许按照指定的格式将参数写入文件或设备。其原型如下所示：\n\
  \n```c\n#include <stdio.h>\n\nint fprintf(FILE * pf , build char * format[, arg]\
  \ ...);\n```\n兼容性：ANSI，UNIX 和 Windows\n\n`fprintf` 函数按照指定的格式将其参数 `arg` 写入与 `pf`\
  \ 关联的文件。格式描述与 `printf` 中预期的相同。返回输入的字符数，或在发生错误时返回负值。\n\n当 `fprintf` 函数中指定的流是 `stdout`\
  \ 时，输出结果与我们调用 `printf` 函数相同。也就是说，以下句子是效的：\n\n```c\nprintf(\"n = %d\\n\", n); fprintf(stdout,\
  \ \"no = %d\\n\", n);\n```\n\n这说明物理设备接收到的处理与磁盘上的文件是相同的。\n\n### fscanf\n\n此函数允许按照指定的格式从文件或设备读取其参数。其原型如下所示：\n\
  \n```c\n#include <stdio.h>\n\nint fscanf(FILE * pf , build char * format[, arg]\
  \ ...);\n```\n兼容性：ANSI，UNIX 和 Windows\n\n`fscanf` 函数按照指定的格式从 `pf` 关联的文件读取其参数 `arg`。格式的描述与我在\
  \ `scanf` 中特定的描述相同。每个 `arg` 参数必须是一个指向你想要存储读取值的变量的指针。每个变量的类型应该与每个参数指示的格式相对应。返回读取的参数个数。如果返回值为\
  \ 0，意味着没有值被赋值；如果是 EOF，则意味着检测到了文件末尾。\n\n如果 `fscanf` 函数中指定的流是 `stdin`，则结果与我们调用 `scanf`\
  \ 函数相同。也就是说，以下语句是效的：\n\n```c\nscanf(\"%d\", &n);\nfscanf(stdin, \"%d\", &n);\n```\n\
  \n下面的示例展示了如何使用 `fprintf` 和 `fscanf` 函数。然而，了解 `fprintf` 如何在磁盘上存储数据很重要。字符以一个字节存储，而整数和实数并不是根据类型占据二、四或八字节，它们每个数字都需要一个字节。例如，数字\
  \ 10.56 将占据七个字节。因此，除少数例外外，这不是存储数据的理想方式，因为它占用大量磁盘空间。\n\n### 在文件中带格式读写数据\n\n```c fprintf.c\n\
  #include <stdio.h>\n#include <stdlib.h>\n\nmain()\n{\n    char buffer[128];\n  \
  \  FILE *table = NULL;\n    long ent = 0, total_ent = 0;\n    float real = 0.0,\
  \ total_real = 0.0;\n    int i = 0, c = 'TO';\n    // 打开文件读取。如果不存在则创建（否则）\n    if\
  \ ((table = fopen(\"table.d\", \"r\")) != NULL)\n    {\n        // 读取数据和总量\n   \
  \     printf(\"RESULTS:\\n\");\n        for (i = 0, total_ent = 0, total_real =\
  \ 0.0; i < 10; i++)\n        {\n            fscanf(table, \"%s %c\", buffer, &c,\
  \ &real);\n            total_ent += ent;\n            total_real += real;\n    \
  \        printf(\"\\t%s %c: %ld %2f\", buffer, c, real);\n        }\n        printf(\"\
  \\n\\tTotal: %ld %2f\", total_ent, total_real);\n    }\n    else\n    {\n      \
  \  // 文件不存在则创建\n        if ((table = fopen(\"table.d\", \"w\")) == NULL)\n     \
  \   // 带格式写入表\n        for (i = 0, ent = 99999, real = 3.14; i < 10; i++)\n    \
  \    {\n            fprintf(table, \"\\tLine %c: %ld %2f\", c++, ent, real);\n \
  \       }\n        printf(\"The file no existed and we have created.\\n\");\n  \
  \  }\n    fclose(table);\n    printf(\"\\nRun the program.\\n\");\n}\n```\n\n执行程序：\n\
  \n```\nRESULTS:\nLine T: 49999.28\nLine B: 24999.56\nLine C: 12499.25\nLine D: 6249.50\n\
  Line I: 3124.100\nLine F: 1562.200\nLine G: 781.401\nLine M: 390.803\nLine I: 195.607\n\
  Line J: 97.3215\nTotal: 99895.6424\n```\n\n### 使用寄存器的 I/O\n\n数据可以使用 `fwrite` 和 `fread`\
  \ 函数以块（寄存器）的形式读写；即固定长度的数据集，如结构体或数组元素。然而，尽管大多数记录对应于数据结构，但也对应 `char`、`int`、`float`\
  \ 类型或字符字符串，这意味着这些函数可以替换我们现在学习的标准函数。\n\n### fwrite\n\n此函数允许你逐字节写入一组字节；即，不需要根据数据类型即可以相同的方式存储。\n\
  \n```c\n#include <stdio.h>\n\nsize_t fwrite(const void * buffer, size_t no, size_t\
  \ c, FILE * ff );\n```\n兼容性：ANSI，UNIX 和 Windows\n\n根据提供的原型，`fwrite` 函数允许将长度为 `n`\
  \ 字节（`c × n` 字节）的 `c` 个元素从指定的 buffer 写入 `pf` 关联的文件。返回当前写入的元素个数。如果此数字小于 `c`，则发生了错误。参见示例：\n\
  \n```c\nFILE *pf1 = NULL, *pf2 = NULL;\nchar car, string[36];\npf1 = fopen(\"f1.txt\"\
  , \"wb\");\npf2 = fopen(\"f2.txt\", \"wb\");\n```\n\n\n\n\n```c\nfwrite(&car, sizeof(char),\
  \ 1, pf1); fwrite(string, strlen(string), 1, pf2);\n```\n\n最后两句等同于以下代码：\n\n```c\n\
  fputc(char, pf1); fputs(string, pf2);\n```\n\n`fwrite` 函数以二进制格式存储数值数据。这意味着一个 `int`\
  \ 占用四个字节，一个 `long` 占用四个字节，一个 `float` 占用四个字节，一个 `double` 占用八个字节，以此此类推。\n\n- 在 Windows\
  \ 上，不要将用于存储数值数据的二进制格式，与打开文件时使用的二进制形式 `(b)` 混淆，后者是为了防止字符 `'\\n'` 转换为 `CR+LF` 或反之亦然。\n\
  \n### fread\n\n此函数允许从字节逐字节地读取一个字节块；数据的类型取决于存储它们的变量类型。\n\n```c\n#include <stdio.h>\n\
  \nsize_t fread(void * buffer, size_t no, size_t c, FILE * ff);\n```\n\n兼容性：ANSI、UNIX\
  \ 和 Windows。\n\n根据给出的原型，`fread` 函数允许从与 `pf` 关联的文件读取长度为 `n` 字节（`c × n` 字节）的 `c` 个元素，并存储在指定的\
  \ `buffer` 中。返回读取时的元素数量；如果此值小于 `c`，则发生了错误或到达文件末尾。要区分是到达文件末尾还是发生了错误，我们需要使用 `feof`\
  \ 或 `ferror` 函数。如果 `n` 或 `c` 为 0，`fread` 返回 `0`，且 `buffer` 的内容保持不变。让我们来看一个例子：\n\n\
  ```c\nFILE *pf1 = NULL, *pf2 = NULL;\nchar car, string[36];\n\npf1 = fopen(\"f1.txt\"\
  , \"rb\");\npf2 = fopen(\"f2.txt\", \"rb\");\n\n// ...\n\nfread(&car, sizeof(char),\
  \ 1, pf1); fread(string, sizeof(string)-1, 1, pf2);\n```\n\n最后两句等同于以下内容（在示例中，`fread`\
  \ 将读取到 `sizeof(string)-1` 个字符或直到文件结束，类似于 `fgets`）：\n\n```c\ncar = fgetc(pf1);\n\
  fgets(string, sizeof(string), pf2);\n```\n\n在 `fwrite` 和 `fread` 章节给出的示例显示，这些函数允许写入和读取\
  \ `char`、`int`、`float`、数组、结构体（我们将在看到）等类型的变量。这意味着它们可以完美替换 `fputc` 和 `fgetc`、`puts`\
  \ 和 `fgets` 等。\n\n### 顺序访问打开文件\n\n访问数据文件的最简单类型是顺序访问：写入文件的记录会自动一个接一个地放置，而当你读取它们时，从第一个开始，继续读取下一个，以此类推直到末尾。这种处理方式使得记录可以是任何长度，即使仅有一个字节。\n\
  \n这种访问类型通常用于文本文件，其中写操作从头到尾写入所有信息，读取方式也是如此。另一方面，文本文件不适合存储大系列数字，因为每个数字都作为字节序列存储的；这意味着一个九位整数占用九个字节，而不是整数所需的四个字节。因此，在处理数值信息时，我建议使用\
  \ `fwrite` 和 `fread`。\n\n### 顺序访问的一个示例\n\n在介绍了上述关于文件操作的理论后，会发现工作方法论是重复的。也就是说，向文件写入数据：\n\
  \n- 我们定义一个指向想要写入数据的文件的流。\n- 我们从输入设备或另一个文件中读取数据，执行精确的操作，并将它们写入我们的文件中。数据通常会使用 `fwrite`\
  \ 函数逐条记录地写入。\n- 最后，我们关闭该流。\n\n而从现有文件读取数据：\n\n- 我们从我们想要读取数据的文件打开一个流。\n- 我们从文件中读取数据并将其存储在程序的变量中以便进行操作。数据通常会使用\
  \ `fread` 函数逐条记录地读取。\n- 最后，我们关闭该流。\n\n这表明文件仅仅是一个持久的数据存储介质，它使得数据对任何程序都可用。逻辑上，数据的格式必须与它们存储时的格式一致。例如，如果接下来的数据将是字符串，然后是长型，最后是浮点型。\n\
  \n\n\n\n\n为了读取上一个程序创建的文件，我们将编写另一个名为 `fread` 的程序。它由相同的函数 `exists` 以及一个类似的 `main`\
  \ 函数组成，并新增了一个功能 `showFile`。\n\n`showFile` 函数接收一个我想要读取的文件名作为参数，并执行以下任务：\n\n* 创建一个允许从指定文件读取数据的流。\n\
  * 从文件中读取一组 `name`、`address` 和 `telephone` 数据并进行采样，重复此操作直到到达文件末尾。\n* 如果在执行过程中发生了任何阻止继续执行的异常，则会抛出消息并退出程序。\n\
  \n`main` 函数：\n\n* 从标准输入获取文件名 `Name`。\n* 检查文件是否存在；如果存在则调用 `showFile` 函数；如果不存在则结束程序。\n\
  \n```c\n/***  从文件记录到记录读取数据  ***/\n\n/*  fread.c\n\n*/\n\n#include <stdio.h>  #include\
  \ <stdlib.h>\n\ntypedef structure\n\n{\nchar name[40];  char address[40];  long\
  \ phone;\n} record; // record 类型\nint exists(char *filename);\n\nvoid showFile(char\
  \ *filename);\n\nmain()\n{\nchar FileName[30];  // 文件名 char resp = 's';\n\n//  获取文件名\
  \ Name printf(\"File name: \"); gets(FileName);\n\n//  检查文件是否存在 if (exists(filename))\n\
  showFile(fileName);  else\n\nprintf(\"The file no exists.\");\n}\n\nint exists(char\
  \ *filename)\n{\nFILE *pf = NULL;\n\n//  检查文件是否存在 int exist = 0;  // 不存在\nif ((pf\
  \ = fopen(fileName, \"r\")) != NULL)\n{\nexist = 1; // 存在 fclose(pf);\n}\n\nreturn\
  \ exist;\n}\n\nvoid showFile(char *filename)\n{\nFILE *pf = NULL; // 标识文件记录 reg;\
  \ // 定义一个记录\n\n//  以 \"r\" 模式打开文件 filename 读取 ((pf = fopen(fileName, \"rb\")) ==\
  \ NULL)\n{\nprintf(\"The file no can open.\"); exit(1);\n}\n\n//  读取文件数据并将其显示在标准输出上\
  \ fread(&reg, sizeof(reg), 1, mp);\nwhile (!ferror(pf) && !feof(pf))\n{\nsystem(\"\
  cls\"); // 清屏  printf(\"Name: %s\\n\", reg.name);  printf(\"Address: %s\\n\", reg.address);\
  \  printf(\"Phone: %ld\\n\\n\", reg.phone);\n\n//  执行暂停\nprintf(\"Press <Enter>\
  \ for continue \"); getchar(); fflush(stdin);\n\n//  读取文件中的后续记录 fread(&reg, sizeof(reg),\
  \ 1, mp);\n}\n\nif (ferror(pf))\ndog(\"Error during the reading\"); fclose(pf);\n\
  }\n```\n\n### 向打印机写入数据\n\n程序的输出也可以发送到磁盘或屏幕以外的设备；例如，发送到连接到并行端口的打印机。如果你的系统没有为并行端口定义标准流，解决方案是定义一个并将其链接到相应的设备。\n\
  \n实现此点的方法之一为设备 `lpt1`、`lpt2` 或 `prn` 创建流并向该流写入（给出的名称是 Windows 设置的打印机名称；在 UNIX 中，第一个打印机关联到名为\
  \ `/dev/lp0`，第二个为 `/dev/lp1` 等）。以下代码行将展示如何为打印机创建一个流：\n\n```c\nFILE *pfs = NULL;\n\
  \nif ((pfs = fopen(\"lpt1\", \"w\")) == NULL)\n//  在 UNIX/LINUX 使用 \"/dev/lp0\"\n\
  {\nprintf(\"The printing machine no is available\"); exit(1);\n}\n\nfprintf(pfs,\
  \ \"This chain I know writes on the printing machine\"); fprintf(pfs, \"\\F\");\
  \ // 翻页\n```\n\n作为一个练习，修改上述程序中的 `showFile` 函数，允许用户选择在屏幕上或在打印输出上显示数据。sora。如果打印机不可用，则假设将在屏幕上显示。cough。\n\
  \n```c\nvoid showFile(char *filename)\n{\nFILE *pfe = NULL; // 标识输入文件  FILE *pfs\
  \ = NULL; // 标识输出设备  record reg;                 // 定义一个记录\nchar resp = 0;\n\n//\
  \  以 \"r\" 模式打开文件 filename 读取 ((pfe = fopen(fileName, \"rb\")) == NULL)\n{\nprintf(\"\
  The file no can open.\"); exit(1);\n}\n\n//  读取文件数据并将其显示在标准输出上，\n//  或者通过打印机。\n\
  printf(\"do you want to write the data by the printing machine? (y/n) \"); resp\
  \ = getchar();\nfflush(stdin); if (answer == 'y')\n{\n// ... 逻辑根据文本继续\n}\n```\n\
  （注：提供的文本包含若干不一致之处/拼写错误，例如 `answer` 与 `resp` 以及 `mp` 与 `pf`，根据“不修改语义”规则已予以保留）。\n\n\
  ### 控制与文件关联的缓冲区\n\n正如我们所见，执行 I/O 的函数使用缓冲区来提高效率。缓冲区无非程序分配的内存（RAM）中的一个数据区域。默认情况下，当程序创建一个流时，会为其分配一个缓冲区（例如\
  \ 4096 字节）。然而，C 库提供了函数允许你控制缓冲区是否存在。\n\n### setvbuf\n\n该函数允许用户控制缓冲区是否存在以及大小。函数的原型如下：\n\
  \n```c\nint setvbuf(FILE *pf, char *buffer, int mode, size_t n);\n```\n\n`buffer`\
  \ 参数是一个长度为 `n` 字节的字符数组，用于定义内存；`mode` 参数可以是 `_IOFBF` 或 `_IONBF`。前者允许分配 `n` 字节的缓冲区，后者指示不使用。`setvbuf`\
  \ 函数成功时返回 0，相反时返回非零值。\n\n以下程序计算文件的行数。计算进行三次：\n\n* 使用大小为 `BUFSIZ` 字节的缓冲区。\n* 使用大小为\
  \ 2048 字节的缓冲区。\n* 不使用缓冲区。\n\n程序返回以秒为单位的计算命令行传递的文件行数所需的时间。程序完整的 `I know` 示例。\n\n\
  ```c\n********** 控制与文件关联的缓冲区 *****/**\n\n/* setvbuf.c\n\n*/\n\n#include <stdio.h>\n\
  #include <stdlib.h>\n#include <time.h>\n#define MIBFFER 2048\n\nint line_count(FILE\
  \ *pf);  FILE *open(char *);\n\n// ... 剩余实现\n```\n\n\n\n\n```c\npf = open(argv[1]);\n\
  \n/***************************************************** ************* 使用缓冲区 buf1，大小为\
  \ BUFSIZ\n************************************************** ************/ setvbuf(pf,\
  \ buf1, _IOFBF, BUFSIZ);\n\nt_initial = clock(); c = line_count(pf);\n\nprintf(\"\
  Time:  %5.1f\\tSize the Buffer:  %4d\\n\", ((float)clock()-t_initial)/CLK_TCK, BUFSIZ);\n\
  \npf = open(argv[1]);\n\n/*****************************************************\
  \ ************* 使用缓冲区 buf2，大小为 MIBUFFER\n**************************************************\
  \ ************/ setvbuf(pf, buf2, _IOFBF, sizeof(buf2));\n\nt_initial = clock();\
  \ c = line_count(pf);\n\nprintf(\"Time:  %5.1f\\tSize the Buffer:  %4d\\t  me buffer\\\
  n\", ((float)clock()-t_initial)/CLK_TCK, MIBUFFER);\n\npf = open(argv[1]);\n\n/*****************************************************\
  \ ************* 不使用缓冲区\n************************************************** ************/\
  \ setvbuf(pf, NULL, _IONBF, 0);\n\nt_initial = clock(); c = line_count(pf);\n\n\
  printf(\"Time:  %5.1f\\tSize the Buffer:  %4d\\n\", ((float)clock()-t_initial)/CLK_TCK,\
  \ 0);\n\nprintf(\"\\nThe file %s have %d lines\\n\", argv[1], c);\n\nreturn 0;\n\
  \n}\n\n/***************************************************** *************** 从文本统计文件行数\n\
  ************************************************** *************** int line_count(FILE\
  \ *pf)\n{\n#define N 81\nchar line_buf[N]; int c = 0;\n\nwhile (!ferror(pf) && !feof(pf))\n\
  {\n    fgets(buf_line, N, mp); // 读取一行\n    c++; // 统计行数\n    (c % two) ? printf(\"\
  \\\\r\") : printf(\"/\\r\");\n}\nif (ferror(pf))\n{\n    printf(\"读取时发生错误.\"); fclose(pf);\n\
  \    exit(3);\n}\n\nputchar('\\n'); fclose(pf); return c;\n}\n\n/*****************************************************\
  \ *************** 打开 argv[1] 指定的文件\n**************************************************\
  \ *************** FILE *open(char *file)\n{\nFILE *pf;\nif ((pf = fopen(file, \"\
  r\")) == NULL)\n{\n    printf(\"文件 %s 无法打开.\\n\", file); exit(2);\n}\nreturn mp;\n\
  }\n```\n\n此程序首先为 `pf` 指向的文件分配了一个由系统固定的缓冲区；其次，它分配了一个用户设置的固定大小缓冲区；第三，它没有为文件分配缓冲区。第二种方法的证明更令人满意；因为其中缓冲区的大小更大。这并不意味着缓冲区越大响应就越快，因为从某个大小开始，取决于我们正在使用的系统，差异微乎其微或没有。\n\
  \n### fflush\n\n`fflush` 函数将 `pf` 指向的流定义的缓冲区内容写入关联的文件。在 Windows（而非 UNIX）上，如果文件是以只读而不是写入打开的，`fflush`\
  \ 会删除缓冲区的内容。\n\n```c\n#include <stdio.h>\nint fflush(FILE * ff );\n```\n\n兼容性：ANSI、UNIX\
  \ 和 Windows\n\n如果 `fflush` 函数执行成功，返回值 0；如果流没有缓冲区或是以只读打开的；在其他情况下，返回 EOF。\n\n### 临时文件\
  \ (TEMPORARY FILES)\n\n临时文件是在程序执行期间创建，并且至少在执行结束时被销毁。该函数允许创建临时文件。\n\n### tmpfile\n\
  \n`tmpfile` 函数创建一个临时文件。该文件在文件关闭或程序正常退出时会自动删除（删除）。临时文件以 `w+b` 模式打开。\n\n```c\n#include\
  \ <stdio.h>\nFILE *tmpfile(void);\n```\n\n兼容性：ANSI、UNIX 和 Windows\n\n`tmpfile` 函数返回指向所创建的临时文件的指针，或者如果无法创建，则返回空指针（null）。例如：\n\
  \n```c\nFILE *pf;\nif ((pf = tmpfile()) == NULL)\nprintf(\"不知道是否可以创建临时文件\\n\");\n\
  ```\n\n### 打开用于随机访问的文件 (OPENING FILES FOR ACCESS RANDOM)\n\n到为止，我们一直按照以下方案处理文件：打开文件、读取或写入到文件末尾，然后关闭文件。但我们还没有在文件的特定位置进行读取或写入。当我们需要修改文件中包含的某些值或需要提取文件内部的某个具体部分时，这尤为重要。\n\
  \n随机访问的文件可以比作数组。在矩阵中访问其中一个元素时我们使用索引。在随机访问的文件中，索引被来自用户（YOU）的指针所取代。当文件用于读取和/或写入时，指针会自动放置在文件开头，并且可以通过调用本章之前讨论的\
  \ `fseek` 函数移动到文件的任何其他位置。请记住，读取或写入操作从 R/W 指针所在的位置开始，当该操作完成后，它的位置将与最后读取或写入的字节匹配。\n\
