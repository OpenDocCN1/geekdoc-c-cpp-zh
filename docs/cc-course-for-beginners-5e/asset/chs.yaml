  \ 时，我们丢弃并增加 `i` 的值一个单位并重新开始。这也是 square root square。\n    `z = (int)sqrt(x + and);\
  \ // z 是一个变量\n    `if (z * z == x + y)` // 平方根是精确的吗？如果 `z` 精确，我们就写入 `z, x, y`。此外，当\
  \ `z` 大于 50 时，我们丢弃并增加 `i` 的值一个单位并重新开始。这也是 square root square。\n\n```c\n/* 勾股定理。\n\
