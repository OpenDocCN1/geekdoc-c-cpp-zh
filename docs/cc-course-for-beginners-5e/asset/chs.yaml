  ```\n\n### 文件的随机访问\n\n文件的随机访问与顺序访问不同，允许在不需要将其复制到另一个文件的情况下对其包含的信息进行排序，这使得应用于数组的方法也可以应用于随机访问的文件。\n\
  \n作为一个示例，让我们写一个接受命令行参数的文件程序，在排序后询问用户是否想要查看该文件。每个记录将包含两个字段：名字和分数。程序的开发将取决于数据的结构以及用于文件排序的字段类型（数字或字母）。程序的结构将包含以下函数（在本章稍后将解释的快速排序方法）：\n\
  \n```\nvoid quicksort(FILE *pf, int n_items);\nvoid swapRecords(FILE *pf, int left,\
  \ int right);\nchar *field(FILE *pf, int n);\nmain(int argc, char *argv[]);\n```\n\
  \n```c\n/* 随机访问文件的快速快速排序方法。 */\n\ntypedef struct {\n    unsigned char name[61];\n\
  \    float note;\n} record;\n```\n\n\n\n\n\n```c\n// 用于对文件排序的函数 qs\nvoid qs(FILE\
  \ *pf, int info, int His p)\n{\n    register left, right; char half[20];\n    left\
  \ = low; right = His p;\n    // 根据我已知的排序方式获取中间半部分，\n    // 即记录半部分\n    strcpy(half,\
  \ field(pf, (int)(left+right)/2));\n    do\n    {\n        while (strcmp(field(pf,\
  \ left), half) < 0 && left < His p) left++;\n        while (strcmp(half, field(pf,\
  \ right)) < 0 && right > inf) right--;\n        if (left <= right)\n        {\n\
  \            swapRecords(pf, left, right);\n            left++;\n            right--;\n\
  \        }\n    }\n    while (left <= right);\n    if (low < right) qs(pf, info,\
  \ right);\n    if (left < His p) qs(pf, left, His p);\n}\n\n// 交换位置 left 和 right\
  \ 的记录\nvoid swapRecords(FILE *pf, int left, int right)\n{\n    int t_reg = sizeof(record);\
  \ // 记录 record x 的大小，并且;\n    fseek(pf, (long)left * t_reg, SEEK_SET); fread(&x,\
  \ t_reg, 1, mp);\n    fseek(pf, (long)right * t_reg, SEEK_SET); fread(&y, t_reg,\
  \ 1, mp);\n    fseek(pf, (long)left * t_reg, SEEK_SET); fwrite(&y, t_reg, 1, mp);\n\
  \    fseek(pf, (long)right * t_reg, SEEK_SET); fwrite(&x, t_reg, 1, mp);\n}\n\n\
  // 读取用于排序的中间字段\nchar *field(FILE *pf, int n)\n{\n    int t_reg = sizeof(record);\
  \ // 记录静态 record reg; // 记录\n    fseek(pf, (long)n * t_reg, SEEK_SET); fread(&reg,\
  \ t_reg, 1, mp);\n    return reg.name;\n}\n```\n\n### 哈希算法 (ALGORITHMS HASH)\n\n\
  哈希算法是搜索方法，它们提供了比其他方法更短的搜索长度和更灵活灵活性，例如要求数组元素必须有序的二分搜索方法。\n\n我们所说的搜索长度，是指在矩阵中查找所需元素时必须进行的访问次数。\n\
  \n这种搜索方法的基本操作除了查找元素外，还允许插入新元素和删除已存在的元素。\n\n### 哈希数组 (Arrays hashes)\n\n具有适用于哈希算法的有效结构的数组被称为哈希数组。这些矩阵使用得最频繁，尤其在需要快速访问数据的过程中。从图上来看，数组具有如下方式：\n\
  \n| 键 (Key) | 内容 (Content) |\n| :--- | :--- |\n| 5040 | |\n| 3721 | |\n| | |\n|\
  \ ... | |\n| | |\n| 6375 | |\n| | |\n\n数组由包含两个成员的元素组织：键（key）和内容（content）。键构成了访问数组的手段。通过应用之前定义的类访问函数\
  \ `fa`，我们得到一个正整数 `i`，对应于元素在矩阵中的位置。\n\n`i = fa(clef)`\n\n已知位置后，就可以访问内容。成员内容可以直接包含信息，也可以包含对信息的引用，当这些信息非常广泛时。这种访问，正如我们所确定的，被称为直接访问。\n\
  \n举个例子，假设访问键对应于国家身份文件（`dni`）的编号，而内容是持有该 ID 的人的对应数据。一个访问函数 `i=fa(dni)`，它使得元素在数组中的位置与\
  \ `dni` 对应，结果是即时的：`i = dni`。这种这样定义的函数有一个缺点，即 `i` 的可能值范围太大，无法使用数组。为了解决这个问题，给定一个长度为\
  \ `L` 的数组，总是可以创建一个访问函数 `fa`，它生成一个在 `0` 到 `L` 之间的值，最常见的是在 `1` 到 `L` 之间。在这种情况下，可能会出现两个或多个键对应于同一个\
  \ `i` 值：\n\n`i = fa(clef 1 ) = fa(clef 2 )`\n\n哈希方法基于这种技术；通过数字 `i` 直接访问数组，并且当发生冲突（两个键产生相同的数字\
  \ `i`）时，会在一个被称为搜索区域的区域查找该元素。\n\n### 哈希方法 (Method hashes)\n\n开放寻址法是最常用的方法之一。访问长度为\
  \ `L` 的数组单元的算法如下：\n\n1. 我知道 `i = fa(key)` 。\n2. ![image18847.jpeg](img/如果矩阵的位置 `i`\
  \ 是空闲，则插入键和内容。如果不是空且键相同，报错：“重复键”。如果不是空且键不同，我们让 `i` 加 1 并重复步骤二。例如，请见下表：)\n\n| 键 (Key)\
  \ | 内容 (Contents) |\n| :--- | :--- |\n| 5040 | 0 |\n| 3721 | 1 |\n| | 2 |\n| 4007\
  \ | 3 |\n| 3900 | 4 |\n\n\n\n\n...，因为键被保留了，而且它允许在发生新冲突时在此位置插入一个新元素。\n\n### 开放哈希接口\n\
  \n作为一项练习，我们在下面编写了一个名为 `open hash` 的接口，它提供了使用哈希数组所需的必要函数——使用 `hash` 方法 `open`，其伪代码我展示了后续逻辑：\n\
  \n```\n<hash function(array, element x)> [Array is zero initialized] i = key module\
  \ number_elements DO WHILE (is elements free)\n  IF (element \"i\" is free) THEN\
  \ copy element x on the position i\n  ELSE\n    IF (key duplicate) THEN error: key\
  \ duplicate\n    ELSE\n      [a collision has occurred] [advance to the following\
  \ element] i = i+1\n      IF (i = number_elements) THEN i = 0\n    ENDIF\n  ENDIF\n\
  ENDDO\nEND <function hash>\n```\n\n我们将要实现的 `open hash` 接口将包含一个带有两个属性的结构体：`hashArray`\
  \ 用于引用哈希数组（一个通用指针数组），以及 `n_items` 用于存储矩阵中元素的数量。\n\n```c\ntypedef structure\n{\n\
  \  void **hashArray;\n  int n_items;\n} tHashArray;\n```\n\nA) 是的，它包含了下表所示的函数：\n\
  \n![](img/image18459.jpeg)\n\n函数含义\n\n![](img/image18863.jpeg)\n\n`error` 当内存不足时，从\
  \ `error` 显示一条消息并终止赋值并在执行过程中中止程序。\n\n```c\nvoid error();\n```\n\n`primeNumber` 函数根据传入的数字作为参数返回一个其最近的质数。每当你使用模块访问函数时，选择一个与矩阵长度接近的质数是非常重要的，目的是让冲突次数尽可能少。\n\
  \n```c\nint primeNumber(int n);\n```\n\n`StartHashArray` 允许创建一个带有指定元素数量的矩阵；是的，事实上，它是合法的，我不知道，假设是\
  \ 101 个元素。元素的初始值值为 `NULL`。\n```c\nStartHashArray(tHashArray *mh, int n_items);\n\
  ```\n\n`fa` 这是一个必须由使用此接口的应用程序定义的函数。定义你想要应用的访问函数。\n\n```c\nint fa(void *arg, tHashArray\
  \ hm);\n```\n\n`compare` 函数必须由使用此接口的应用程序定义，以便允许比较由数组指向的两个数据元素的键。它必须返回一个整数，表示检查的结果（0\
  \ 表示 ==）。\n\n```c\nint compare(void *arg1, void *arg2);\n```\n\n`releasemem` 函数必须由使用此接口的应用程序定义，用于释放分配的内存。没有数据要存储的了。\n\
  \n```c\nvoid fremem(void *arg);\n```\n\n`hashIn` 开放哈希方法，用于向数组添加元素。如果无法添加该项则返回 0，否则返回\
  \ 1。\n\n```c\nint hashIn(void *x, tHashArray hm);\n```\n\n调用 `fa` 和 `compare`。\n\
  \n`hashOut` 开放哈希方法，用于根据确定的键查找元素。如果找到，它返回一个指向相同类型的 `void *` 指针；在另一种情况下返回 `NULL`。\n\
  \n```c\nvoid *hashOut(void *x, tHashArray hm);\n```\n\n调用 `fa` 和 `compare`。\n\n\
  `deleteArrayHash` 函数允许释放分配给哈希矩阵的内存。调用 `freemem` 函数允许应用程序释放分配给每个元素数据区域的内存。\n\n```c\n\
  void deleteHashArray(tHashArray hm);\n```\n\n![](img/image18864.jpeg)\n\n后续，我展示了对应接口定义的代码：\n\
  \n```c\n//////////////////////////////////////////////// ////////////////\n// 开放哈希接口：哈希方法。\n\
  // 为了使用此接口提供的函数，\n// 我们将在应用程序中定义函数：\n// fa（访问函数）和 compare。\n//\n// 显示来自 error 的消息并中止程序\n\
  void error()\n{\n  printf(\"Insufficient memory\\n\"); exit(1);\n}\n\n// 寻找一个与数字接近的质数\n\
  int primeNumber(int n)\n{\n  int cousin = 0;\n  int i, r = (int)sqrt((double)n);\n\
  \  if (n % 2 == 0) n++;\n  while (!cousin)\n  {\n    cousin = 1;\n    for (i = 3;\
  \ i <= r; i += 2) if (n % i == 0) cousin = 0;\n    if (!cousin) n += 2; // 后续奇数\n\
  \  }\n  return cousin;\n}\n\n// 矩阵\nStartHashArray(tHashArray *mh, int n_items)\n\
  {\n  if (n_items < 1)\n    mh->n_items = 101;\n  else\n    mh->n_items = PrimeNumber(n_items);\n\
  \  mh->hashArray = (void **)malloc(mh->n_items * sizeof(void *));\n  if (mh->hashArray\
  \ == NULL) error();\n  memset(mh->hashArray, 0, mh->n_items * sizeof(void *));\n\
  }\n\n// 向矩阵添加元素\nint hashIn(void *x, tHashArray hm)\n{\n  int i; // 索引\n  int count\
  \ = 0; // 计数\n  int inserted = 0; // 插入标记\n  i = fa(x); // 访问\n  while (count <\
  \ hm.n_items)\n  {\n    if (hm.hashArray[i] == NULL) // 如果位置是空的\n    {\n      hm.hashArray[i]\
  \ = x; // 拷贝\n      inserted = 1;\n      break;\n    }\n    else\n    {\n      if\
  \ (compare(x, hm.hashArray[i]) == 0) // [键冲突]\n      {\n        printf(\"error:\
  \ key duplicate\\n\");\n        return 0;\n      }\n      i++; // 进到下一个元素\n    \
  \  if (i == hm.n_items) i = 0;\n    }\n  }\n  return inserted;\n}\n\n// 查找具有键的元素\n\
  void *hashOut(void *x, tHashArray hm)\n{\n  int i; // 索引\n  int count = 0; // 计数\n\
  \  int found = 0; // 找到\n  i = fa(x); // 访问\n  while (!found && count < hm.n_items)\n\
  \  {\n    if (hm.hashArray[i] == NULL) return NULL; // 如果为空\n    if (compare(x,\
  \ hm.hashArray[i]) == 0) // 如果匹配\n    {\n      x = hm.hashArray[i]; // 返回\n    \
  \  found = 1;\n      break;\n    }\n    i++;\n    if (i == hm.n_items) i = 0;\n\
  \  }\n  return x;\n}\n\n// 释放矩阵内存\nvoid deleteHashArray(tHashArray hm)\n{\n  int\
  \ i = 0;\n  for (i = 0; i < hm.n_items; i++)\n    freemem(hm.hashArray[i]);\n  free(hm.hashArray);\n\
  }\n//////////////////////////////////////////////// ////////////////\n```\n\n###\
  \ 哈希数组的示例\n\n正如我们已经指出的，为了使用该接口，我们必须在应用程序中定义 `fa`、`compare` 和 `release` 函数。例如，假设我们要构建一个包含\
  \ `tStudent` 类型元素的哈希数组：\n\n```c\ntypedef structure\n{\n  int license plate;\n  char\
  \ name[50];\n} tStudent;\n```\n\n`tStudent` 元素将使用注册号作为键存储在数组中。根据此，我们定义 `fa`、`compare`\
  \ 和 `release` 函数如下：\n\n```c\n//////////////////////////////////////////////// ////////////////\n\
  // 为了使用此接口，我们在应用程序中定义\n// 函数：fa（访问函数），compare 和释放我。\n//\n// 定义访问函数\nint fa(void\
  \ *arg, tHashArray hm)\n{\n  tStudent *to = (tStudent *)arg;\n  return to->license\
  \ plate % hm.n_items;\n}\n\n// 比较矩阵中的两个元素\nint compare(void *arg1, void *arg2)\n\
  {\n  tStudent *a1 = (tStudent *)arg1;\n  tStudent *a2 = (tStudent *)arg2;\n  if\
  \ (a1->license plate == a2->license plate) return 0;\n  else\n  return 1;\n}\n\n\
  // 释放每个元素的分配内存\nvoid fremem(void *arg)\n{\n  free((tStudent *)arg);\n}\n////////////////////////////////////////////////\
  \ ////////////////\n```\n\n\n\n\n请注意，为了定义模运算（`%`）访问函数，我们需要设置一个数值。这并不意味着键必须是数字（如我们的示例所示），它也可以是字母和数字的混合体。当使用字母数字或纯字母键（例如\
  \ `name`）时，在应用访问函数之前，必须使用适当的算法通过 `hoisting`（提升）将该键转换为数值。\n\n最后，我们将编写一个名为 `apHash`\
  \ 的应用程序，它允许创建一个 `tMatrizHash` 类型的数组，它是哈希数组的封装。为了测试其正确性，我们将编写代码，允许在 `bliss` 矩阵中同时对对象进行添加和搜索。\n\
  \n```c\ntypedef structure\n{\n    int license plate;\n    char name[50];\n} tStudent;\n\
  \n//在此定义 fa（来自访问的函数），compare 和 set me free main()\nmain()\n{\n    // 变量定义\n    int\
  \ n_items = 101; // 根据省略确定的元素数量\n    // 从矩阵哈希定义 tStudent *x = NULL, to = {0, \"\"\
  };\n    tHashMatrix mh = {NULL, 0};\n\n    // 从类型 tHashMatrix 创建结构体\n    // (封装了哈希数组)\n\
  \    printf(\"Number of elements: \");\n    scanf(\"%d\", &n_items);\n    StartHashArray(&mh,\
  \ n_items);\n\n    printf(\"If build a matrix from %d items\\n\", mh.n_items);\n\
  \n    // 引入数据\n    printf(\"Enter data. For Finalize, enrollment = 0\\n\");\n  \
  \  printf(\"registration: \");\n    scanf(\"%d\", &a.registration);\n    fflush(stdin);\n\
  \n    while (a.registration != 0)\n    {\n        printf(\"name: \");\n        gets(a.name);\n\
  \        x = (tStudent *)malloc(sizeof(tStudent));\n        if (x == NULL) error();\n\
  \n        x->registration = a.registration;\n        strcpy(x->name, a.name);\n\
  \        if (!hashIn(x, mh)) free(x);\n\n        printf(\"registration: \");\n \
  \       scanf(\"%d\", &a.registration);\n        fflush(stdin);\n    }\n\n    //\
  \ 查找数据\n    printf(\"Find data. For Finalize, enrollment = 0\\n\");\n    strcpy(a.name,\
  \ \"\");\n\n    printf(\"registration: \");\n    scanf(\"%d\", &a.registration);\n\
  \    while (a.registration != 0)\n    {\n        x = (tStudent *)hashOut(&a, hm);\n\
  \        if (x != NULL)\n            printf(\"name: %s\\n\", x->name);\n       \
  \ else\n            printf(\"Not exist\");\n\n        printf(\"registration: \"\
  );\n        scanf(\"%d\", &a.registration);\n    }\n\n    deleteHashArray(mh);\n\
  }\n```\n\n---\n\n### 训练解答\n\n#### 1. 比较以下二分查找方法的两个版本，并指出哪个更高效。\n\n```c\nint lookupBin1(double\
  \ m[], int no, double i)\n{\n    // 函数 searchBin 返回值所在的位置的结果\n    // 如果值不存在（即我不知道位置），则返回\
  \ -1。\n    int half, info = 0, His p = n - 1;\n    if (n == 0) return -1;\n    do\n\
