  \ (fgets(str, MAX, pfile)) printf(\"%s\", str);\n    }\n\n    if (ferror(pfile))\n\
  \        dog(\"Error during the reading\");\n    fclose(pfile);\n}\n\nvoid mixNatural(FILE\
