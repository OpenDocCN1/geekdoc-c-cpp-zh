  \n### 线性链表的泛型接口\n\n上述实现的接口设计用于操作特定类型元素的列表：`double` 类型的数据。毫无疑问，如果该接口被设计为允许来自任何类型对象的列表，将对用户具有更大的吸引力。这就是接下来要处理的内容。在\
  \ C 语言中，这是通过使用通用指针（`void *`）指向它来实现的。我们称之为数据区域。\n\n我们知道 C 允许你隐式地将指向任何类型对象的指针转换为通用指针；相反，相反意义的转换在\
  \ C 中是允许的，但在 C++ 中不允许，它要求显式完成（请注意第 7 章中拆分的指针泛型）。\n\n根据此，为了让上一节中开发的接口允许任何类型对象的列表，只需要结构\
  \ `Element`（列表每个元素的类型）不再拥有特定数据类型的成员，而是一个类型为 `void *` 的指针类型成员即可。该成员可以指向来自任何类型的任何对象。\n\
  \n```c\ntypedef structure s\n{\n    ![](img/image18769.jpeg)\n    structure s *following;\
  \ // 指向下一个元素的指针\n} Element;\n```\n\n这一修改意味着另外两个变化：函数 `anyadirToBeginning` 的第一个参数现在必须是\
  \ `void *` 类型，并且函数 `get` 现在必须返回一个 `void *` 类型的指针，以便对所访问的元素数据区域进行操作。\n\n```c\n//\
  \ 处理 illse 的接口 ////////////////////////////////\n\n//\n// 显示错误消息并终止程序\nvoid error()\n\
  {\n    printf(\"内存不足\\n\"); exit(1);\n}\n\n// 创建新元素\nElement *newItem()\n{\n   \
  \ Element *q = (Element *)malloc(sizeof(Element));  if (!q) error();\n    return\
  \ q;\n}\n\n// 将元素添加到就绪列表开头\nvoid anyaddToBeginning(void *and, Element **ready)\n\
  {\n    Element *p = *ready;\n    Element *q = newElement();\n    q->data = and;\
  \ // 数据赋值\n    q->next = p;  // 指针重新赋值 p = q;\n    *ready = p;\n}\n\n// 从就绪列表中获取元素\
  \ i\nvoid *get(int i, Element *q)\n{\n    int n = 0;\n    if (q == NULL)\n    {\n\
  \        printf(\" 空列表\\n\"); return NULL;\n    }\n    if (i >= 0)\n    {\n    \
  \    // 定位到元素 i\n        for (n = 0; what != NULL && n < i; n++) what = q->next;\n\
  \        // 返回元素\n        if (q != NULL) return q->data;\n    }\n    // 索引超出范围返回\
  \ NULL;\n}\n\n// 删除就绪列表中的所有元素\nvoid clearAll(Item **ready)\n{\n    Element *p =\
  \ *ready, *q = NULL;\n    // 遍历就绪列表当 (p != NULL)\n    {\n        what = p;\n   \
  \     p = p->next;\n        free(q); //  what 指向的元素\n    }\n    *ready = NULL; //\
  \ 就绪为空\n}\n```\n\n//////////////////////////////////////////////// ////////////////\n\
