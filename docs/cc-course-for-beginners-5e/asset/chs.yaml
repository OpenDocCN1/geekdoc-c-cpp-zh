  一旦我们写好了 `lcse` 接口，我们将编写一个应用程序，以便通过它创建一个循环列表，并测试在其上进行的不同操作。此列表的元素将是之前示例中使用的 `Data`\
  \ 类型对象。该应用程序的代码如下：\n\n```c\ntypedef structure\n{\n    char name[50]; double note;\n\
  } Data;\n```\n\n```c\nvoid showList(tlcse ready)\n{\n// 显示 ready 中的所有元素 int i =\
  \ 0;\nData *student = NULL;\nwhile (i < list.numberOfElements)\n{\n    student =\
  \ (Data *)get(i, ready);\n    printf(\"%s %g\\n\", student->name, student->grade);\n\
  \    i++;\n}\nif (list.numberOfElements == 0) printf(\"empty\\n\");\n}\n```\n\n\
  ```c\nvoid freeMemory(tlcse *ready)\n{\n// 显示 ready 中的所有元素 int i = 0;\nData *student\
  \ = NULL;\nwhile (i < list.numberOfElements)\n{\n    student = (Data *)get(i, ready);\n\
  \    printf(\"%s %g\\n\", student->name, student->grade);\n    i++;\n}\nif (list.numberOfElements\
  \ == 0) printf(\"empty\\n\");\n}\n```\n\n```c\nmain()\n{\n    char name[50]; double\
  \ note;\n    Data *student = NULL;\n    // 初始化列表\n    startStack(&list);\n    //\
  \ 读取数据\n    while (gets(name) != NULL)\n    {\n        printf(\"Note: \");\n   \
  \     scanf(\"%lf\", &note);\n        // 将数据添加到列表\n        anyaddToEnd(name, &list);\n\
  \        // 显示列表\n        printf(\"List:\\n\");\n    }\n}\n```\n\n### 栈 (Stack)\n\
  \n栈是一种线性列表，所有的插入和删除操作都在一端进行。这种结构的例子是一叠盘子。在这里，添加或删除总是从栈顶进行的。这种列表也被称为 LIFO（后进先出）。栈的操作在\
  \ C 等编程语言中分别被称为 push 和 pop。\n\n\n\n\n队列（Queue）是一种线性列表，所有的插入操作都从一端（从列表的尾部）进行，所有的删除操作都从另一端（从头部）进行。例如，银行中的队列。这种列表也被称为\
  \ FIFO 列表（First In First Out - 先入先出）。这种顺序是队列中插入和提取元素的唯一方式。队列不允许随机访问特定元素。请记住从尾部删除元素的操作逻辑。\n\
  \n为了操作队列，我们可以设计一个接口，它派自我们为操作循环列表（`lcse`）设计的接口。根据此定义，队列将由一个类型为 `tcola` 的变量定义，等同于\
  \ `tlcse`：\n\n```c\ntypedef lcse tcola;\n```\n\n并且它包含以下函数：\n\n![](img/image18459.jpeg)\n\
  \n#### 函数含义\n\n![](img/image18802.jpeg)\n\n- `startQueue`: 初始化队列参数：将指向开头的指针置为 `NULL`，并将\
  \ `numberOfElements` 设置为 0。\n```c\nvoid startQueue(tqueue *ready);\n```\n\n- `putEnQueue`:\
  \ 将元素推到队列尾部（所有的插入操作都在列表的尾部完成）。它有两个参数：指向要添加对象的 `void *` 类型指针和列表 `ready`。它没有返回值。\n\
  ```c\nvoid putEnQueue(void *and, tcola *ready);\n```\n\n- `removeFromQueue`: 从队列中移除第一个项，并将其删除（所有的删除操作都在头部完成）。返回取出的元素数据区域的指针，如果队列为空则返回\
  \ `NULL`。\n```c\nvoid *getFromQueue(tqueue *ready);\n```\n\n![](img/image18803.jpeg)\n\
  \n根据上述内容，`lcse` 接口的定义如下：\n\n```c\n//////////////////////////////////////////////////\
  \ ////////////////\n\n// 行：ready 所有的插入都由一个\n// 极端（通过尾部）完成，而所有的删除都\n// 由另一个极端（头部）完成。\n\
  \n//\n\n// 调用 interface_lcse.c 中的函数 addaddToEnd 和 delete\n\n//\n\nvoid startQueue(tqueue\
  \ *ready)\n{\n    startLcse(list);\n}\n\nvoid putEnQueue(void *and, tcola *ready)\n\
  {\n    addAddToEnd(e, ready);\n}\n\nvoid *getFromQueue(tqueue *ready)\n{\n    return\
  \ delete(list);\n}\n\n////////////////////////////////////////////////// ////////////////\n\
  ```\n\n要启动队列，`startQueue` 函数调用 `lcse` 接口中的 `startLcse` 函数；要将参数 `e` 引向元素放入队列，`putEnQueue`\
  \ 调用 `lcse` 接口的 `addadToEnd` 函数；要从队列中移除项，`removeFromQueue` 调用同一接口的 `erase` 函数。\n\
  \n### 示例\n\n以下示例展示了如何使用开发的接口来处理栈和队列。为了实现这一点，它创建了一个包含 `Data` 类型对象的栈和一个队列。为了检查列表是否创建正确，我们在下方展示了：其内容。此外，为了证明当元素从栈或队列中移除时确实被删除了，我们将尝试第二次显示相同的内容；结果将是一个“为空”的消息。\n\
  \n在这个示例中，`showList` 函数使用第二个整数参数 `type` 来区分显示的是栈（0）还是队列（1）。在栈的情况下，它将调用 `getFromStack`\
  \ 函数；在队列的情况下，它将调用 `getFromQueue` 函数。\n\n```c\ntypedef structure\n{\n    char name[50];\
  \ double note;\n} Data;\n\nvoid displayList(void *ready, int type)\n{\n    // 显示\
  \ ready 中的所有元素\n    Data *student = NULL;\n    do\n    {\n        if (type == 0)\
  \ // 栈\n            student = (Data *) popFromStack(list);  else // 队列\n       \
  \     student = (Data *) removeFromQueue(list);\n        if (student)\n        {\n\
  \            printf(\"%s %g\\n\", student->name, student->grade); free(student);\n\
  \        }\n    }\n    while (student != NULL);\n    if (student == NULL && type\
  \ == 0) printf(\"stack empty\\n\");\n    if (student == NULL && type == 1) printf(\"\
  queue empty\\n\");\n}\n\nvoid freeMemory(void *ready)\n{\n    // 移除 ready 中的所有元素\n\
  \    Data *student = NULL;\n    // 删除：永久删除第一个元素\n    student = delete(list);\n \
  \   while (student)\n    {\n        free(student);\n    }\n}\n\nmain()\n{\n    char\
  \ name[50]; double note;\n    Data *student1 = NULL, *student2 = NULL;\n    // 创建两个\
  \ Data 类型对象\n    student1 = (Data *)malloc(sizeof(Data));\n    student2 = (Data\
  \ *)malloc(sizeof(Data));\n    // 为它们赋值\n    strcpy(student1->name, \"Student 1\"\
  ); student1->grade = 18.5;\n    strcpy(student2->name, \"Student 2\"); student2->grade\
  \ = 19.0;\n    // 将它们加入栈和队列\n    pushInStack(student1, stack); pushInStack(student2,\
  \ stack);\n    putInQueue(student1, queue); putInQueue(student2, queue);\n    //\
  \ 显示栈\n    displayList(stack, 0);\n    // 显示队列\n    displayList(queue, 1);\n   \
  \ // 从栈和队列中移除它们\n    popFromStack(stack); removeFromQueue(queue);\n    // 再次显示栈\n\
  \    displayList(stack, 0);\n    // 再次显示队列\n    displayList(queue, 1);\n    // 释放内存\n\
  \    freeMemory(stack);\n    freeMemory(queue);\n}\n```\n\n\n\n\n双向链表的操作通常不会遇到任何问题。然而，当最后一个元素和第一个元素之间存在双向连接时，操纵它们的关系几乎总是容易得多。这种结构被称为**循环双向链表**。为了操作就绪的循环，有必要以某种方式存储一个引用点；例如，使用指向链表最后一个元素的指针。\n\
  \n下一节将展示如何构建和操作循环双向链表。\n\n### 循环双向链表\n\n循环双向链表（`lcd`）是一个对象集合，每个对象都包含数据或指向数据的指针、指向集合中下一个元素的指针，以及指向上一个元素的指针。在图形上，你可以按照以下方式表示它：\n\
  \n![](img/image18804.jpeg)\n\n要构建这样一个列表，我们首先需要定义将作为其部分的对象类型。例如，列表的每个元素可以定义为具有三个成员的数据结构：指向下一个项的指针、指向上一个项的指针，以及指向数据区域的指针。数据区域可以是预定义的类型或用户定义的类型。根据此，列表每个元素的类型可以定义如下：\n\
  \n```c\ntypedef structure s\n{\nvoid *fact; // 数据区域\nstruct s *previous; // 指向上一个元素的指针\
  \ \nstruct s *following; // 指向后续元素的指针\n} Element;\n```\n\n我们可以通过设计一个接口来自动化循环双向链表的实现过程，该接口提供创建列表每个元素所需的函数，并允许访问它们。我们设计的接口以涵盖了这些目标。\n\
  \n#### 操纵 lcd 的接口\n\n我们将实现的接口函数将在参数 `last`、`current`、`numberOfElements` 和 `position`\
  \ 上工作。`last` 参数将是一个指针，当列表为空时它为 `NULL`，不为空时，它始终指向其最后一个元素；`current` 指向最后访问的元素；`numberOfElements`\
  \ 是就绪元素的数量；`position` 表示 `current` 指向的元素的索引。这建议定义一个类型为 `tlcde` 的结构体来组所有这些参数：\n\n\
  ```c\ntypedef structure\n{\nElement *latest; // 始终指向最后一个元素 \nElement *current; //\
  \ 永远指向访问的元素 \nint numberOfElements; // 就绪元素的数量\nint position; // current 指向的元素的索引\n\
  } tlcde;\n```\n\n下表总结了构成你想要实现的接口部分的函数：\n\n![](img/image18459.jpeg)\n\n函数 含义\n\n\
  ![](img/image18805.jpeg)\n\n- `error`: 当内存不足以进行赋值时显示错误消息并在过程中终止程序。\n```c\nvoid error();\n\
  ```\n\n- `newItem`: 为类型为 `Item` 的对象分配内存。返回指向分配内存块的指针。如果出错，调用函数 `bug`。\n```c\nElement\
  \ *newItem();\n```\n\n- `startLcde`: 初始化列表参数：将 `last` 和 `current` 设置为 `NULL`，`numberOfElements`\
  \ 设置为 0，`position` 设置为 –1（空列表）；就绪第一个元素的 `position` 为 0。\n```c\nvoid startLcde(tlcde\
  \ *lcd);\n```\n\n- `insert`: 在 `current` 指向的元素之后添加元素。添加的元素成为当前元素。有两个参数：指向要添加的对象的指针和列表。没有返回值。\n\
  ```c\nvoid insert(void *and, tlcde *lcd);\n```\n\n- `delete`: 删除 `current` 指向的元素。返回被删除对象的数据区域的指针，如果列表为空则返回\
  \ `NULL`。\n```c\nvoid *delete(tlcde *lcd);\n```\n\n- `goToNext`: 将当前位置移动到下一个元素。如果此位置匹配\
  \ `numberOfElements–1`，则留在原地。没有返回值。\n```c\nvoid goToNext(tlcde *lcd);\n```\n\n-\
  \ `goToPrev`: 将当前位置移回上一个元素。如果此位置匹配 0，则留在原地。没有返回值。\n```c\nvoid goToPrev(tlcde *lcd);\n\
  ```\n\n- `goToBeginning`: 将位置 `current` 置为 0。没有返回值。\n```c\nvoid goToBeginning(tlcde\
  \ *lcd);\n```\n\n- `goToEnd`: 将位置 `current` 置为 `numberOfElements–1`（第一个位置是 0）。不返回任何值。\n\
  ```c\nvoid goToEnd(tlcde *lcd);\n```\n\n- `goTo`: 将当前位置移动到索引为 `i` 的元素（第一个元素索引为 0）。有两个参数：位置\
  \ `i` 和列表。如果移动操作成功执行返回 1，如果列表越界则返回 0。\n```c\nint goTo(int i, tlcde *lcd);\n```\n\
  \n- `getCurrent`: 返回 `current` 指向元素的数据区域的指针，如果列表为空则返回 NULL。\n```c\nvoid *getCurrent(tlcde\
  \ *lcd);\n```\n\n- `modify`: 为当前元素设置新数据。有两个参数：指向对象的指针和列表。\n```c\nvoid modify(void\
  \ *pData, tlcde *lcd);\n```\n\n以下代码对应我们描述的函数：\n\n![](img/image18806.jpeg)\n\n```c\n\
  void error()\n{\n// 当内存不足时显示错误消息并在过程中终止程序\nprintf(\"Insufficient memory\\n\");\n\
  exit(1);\n}\n\nElement *newItem()\n{\n// 为类型为 Item 的对象分配内存。返回指向分配内存块的指针。如果出错，调用函数\
  \ bug\nElement *q = (Element*)malloc(sizeof(Element));\nif (!q) error();\nreturn\
  \ q;\n}\n```\n\n![](img/image18807.jpeg)\n```c\n// 创建新元素\n```\n\n![](img/image18808.jpeg)\n\
  ```c\nvoid startLcde(tlcde *lcd)\n{\n// 初始化列表参数\nlcd->last = NULL; lcd->current\
  \ = NULL;\nlcd->numberOfElements = 0;\nlcd->position = -1;\n}\n\nvoid insert(void\
  \ *and, tlcde *lcd)\n{\n// 从 lcd 获取参数\nElement *last = lcd->last;\nElement *current\
  \ = lcd->current;\nint numberOfElements = lcd->numberOfElements;\nint position =\
  \ lcd->position;\n// 向就绪列表添加新元素\nif (latest == NULL)\n{\n// 就绪列表中没有元素\nElement *latest\
  \ = (Element*)malloc(sizeof(Element));\n// 以下行初始化循环双\nlast->previous = latest;\n\
  last->next = latest;\nlast->data = and; // 赋值数据\ncurrent = latest;\nposition = 0;\
  \ // 就绪\n}\nelse\n// 存在就绪列表\n{\nElement *q = (Element*)malloc(sizeof(Element));\n\
  // 在当前元素之后插入新元素\ncurrent->next->previous = q;\nq->next = current->next;\ncurrent->next\
  \ = q;\nq->previous = current;\nq->data = and;\n// 更新参数。\n// 如果元素 current 是最新的，新元素\n\
  // 恰好是当前也是最新的\nif (current == latest)\nlatest = q;\ncurrent = q; // 新元素恰好是当前\n}\n\
  // 完成 else\n// 增加元素数量\nnumberOfElements++;\n// 更新 lcd 中的参数\nlcd->last = latest;\n\
  lcd->current = current;\nlcd->numberOfElements = numberOfElements;\nlcd->position\
  \ = position;\n}\n```\n\n\n\n\n### 树\n\n树是一种由节点集合和分支的连接而成的非线性结构。\n\n在树中，有一个特殊的节点被称为根节点（root）。同样，具有分支的节点被称为分叉节点或分支节点，而没有分支的节点被称为终端节点或叶子节点。\n\
  \n层级 0：根节点\n层级 1：B C 分叉节点\n层级 2：D E F 终端节点\n\n![Tree](img/image18810.jpeg)\n\n从更正式的角度来说，我们将树定义为包含一个或多个节点的有限集合，满足：\n\
  \na) 存在一个特殊的节点作为树的根节点，且\n\nb) 剩余节点被分成 $n > 0$ 个不相交的集合 $A_1, ... , A_n$，每个集合本身又是一棵树，并被称为来自该根节点的子树（subtree）。\n\
  \n\n\n\n显然，给出的定义是递归的；也就是说，我们定义了一个树为树的集合，并通过其形状和适当定义来定义。\n\n根据定义，树中的每个节点都是包含在相同整体中的某个子树的根。\n\
  \n从一个节点发出的分支数量称为该节点的度（degree）。\n\n节点相对于根节点的级别定义为：根节点的层级为 0，任何其他节点的层级等于该节点到根节点的距离。层级的最大值被称为树的深度（depth）或高度（height）。\n\
  \n限制树的意义是有用的，即每个节点的度最多为 2。这样就可以区分一个节点的左子树和右子树了。由此形成的树我称为二叉树（binary trees）。\n\n###\
  \ 二叉树\n\n二叉树是节点的有限集合，由一个根节点和两个二叉子树组成，称为左子树和右子树。\n\n代数表达式由于涉及的运算符是二元运算符（binary），为我们提供了一个二叉树结构的示例。下面的图展示了一个对应于算术表达式的树：\n\
  \n![](img/image18811.jpeg)(to + b *c) / (d - e / F)\n\n代数表达式\n\n二叉树是一种非常有用的数据结构，当：结构的大小未知、需要按顺序访问元素、搜索速度很重要或元素的插入顺序几乎是随机的时候。\n\
  \n简而言之，二叉树是对象（树节点）的集合，每个对象都包含数据或指向数据的指针、指向其左子树的指针以及指向其右子树的指针。如所述，代表节点的数据结构可以如下所示：\n\
  \n```c\n// 二叉树节点节点定义\ntypedef structure s\n\n{\nvoid *data; // 数据区域\nstructure s\
  \ *left; // 左子树的根\nstructure s *right; // 右子树的根\n} Node;\n```\n\n给出的二叉树定义暗示了一种在计算机上表示二叉树的自然方法。`root`\
  \ 将引用树，每个树节点将是`Node`类型的对象。也就是说，二叉树的通用声明可以如下：\n\n```c\nNode *root; // 树的根\n```\n\n\
  如果树为空，`root` 等于 NULL；其他情况下，`root` 是指向树根节点的指针，如之前的结构所示，该节点具有三个属性：一个指向数据的指针和两个指针，一个指向其左子树，另一个指向其右子树。\n\
  \n### 二叉树的遍历形状\n\n查看上面的“代数表达式”图。从 `root` 节点开始，我们遵循什么顺序来评估表示树的表达式？处理树结构有几种算法，而这些算法中通常重复的过程是树遍历（traversing）。这个过程是指系统地检查树的节点，使得每个节点只被访问一次。\n\
  \n基本上有三种方法可以遍历二叉树：前序（preorder）、中序（inorder）和后序（postorder）。使用前序形式时，首先访问根节点，然后是左子树，最后是右子树；相反，如果使用中序形式，先访问左子树，然后是根节点，最后是右子树；而后序形式首先访问左子树，然后是右子树，最后是根节点。\n\
  \nA: root\nI: subtree left\npreorder: R, i, D\ninorder: I, R, D\nD: subtree post-order\
  \ right : i, D, R\n\n![](img/image18812.jpeg)树的遍历形状\n\n显然，给出的定义是递归定义，因为它们引用运行树，使用其中任何一种都涉及遍历其嵌入的子树。遵循相同的定义。\n\
  \n如果将这些定义应用于之前显示的“代数”图中的二叉树，将得到以下解：\n\nPreorder: / + a * bc - d / ef\nInorder: a\
  \ + b * c / d - e / f\nPostorder: to b c * + d and F / - /\n\n前序遍历产生前缀表示法（prefix\
  \ notation）；中序遍历产生常规表示法；后序遍历产生后缀表示法（postfix）或反序表示法。\n\n`preorder`、`inorder` 和 `postorder`\
  \ 的名称来源于它们出现的位置。\n\n![](img/image1813.jpeg)[](Images/image1814.jpeg)1815.jpeg)[](Images/image1816.jpeg)\n\
  \n### 搜索二叉树\n\n二叉搜索树是有序的树；也就是说，每个节点的节点按照以下规则排序：对于每个节点，其左子树的所有键都小于该节点的键，其右子树的所有键都大于该节点。\n\
  \n![](img/image1817.jpeg)\n\n对于这样的树，查找一个节点是否存在是一个非常简单的操作。例如，查看上面的图，定位键 35 是应用搜索；我们进入该节点的左子树继续搜索，如果不是，我们就向右移动直到到达空子树。\n\
  \n在 C 语言中，我们可以通过设计接口来自动化实现二叉搜索树的过程，提供创建每个节点的必要函数，以及允许访问它们。我们设计的接口涵盖了这些目标。\n\n###\
  \ 操作二叉搜索树的接口\n\n我们将实现的接口将通过根参数来引用树的根。当树为空时，根参数为 NULL。下表总结了函数：\n\n![](img/image1818.jpeg)函数含义\n\
  \nerror 当内存不足时显示错误消息并强制终止程序。\n\nvoid error();\n\nnewNode 为 `Node` 类型的对象分配内存。返回分配内存块的指针。如果发生错误，调用函数。\n\
  \nNode *newNode();\n\nfind 在树中查找特定节点。它有两个参数：一个指向数据的 `void *` 类型指针，用于在树中定位节点，以及树的根。返回节点数据区域的指针，如果树为空或不存在这些数据的节点，则返回\
  \ NULL。\n\nvoid *search(void *data, Node *root);\n\ninsert 根据搜索树的定义向树中插入节点。它有两个参数：指向要添加数据的\
  \ `void *` 类型指针以及树的根。返回 0 如果插入操作成功，或者返回值：1 如果根为 NULL 或 2 如果这些数据已存在。\n\nint insert(void\
  \ *data, Node **root);\n\ndelete 从二叉搜索树中删除节点。它有两个参数：一个指向数据的 `void *` 类型指针，用于模拟定位我们想要删除的节点，以及树的根。\n\
  \n\n\n\n\n`tree`。返回被删除节点数据区域的指针。如果树为空或不存在这些数据的节点，则返回 `NULL`。\n\n```c\nvoid *delete(void\
  \ *data, Node **root);\n```\n\n调用 `compare`。\n\n`inorder` 递归函数，使用 `inorder` 序遍历方式遍历二叉树。不返回\
  \ `none` 值。\n\n```c\nvoid inorder(Node *root);\n```\n\n调用 `process`。\n\n`deleteTree`\
  \ 递归函数，允许根据 `give` 形式遍历树并释放为每个节点分配的内存。它不会释放每个节点数据区域分配的内存，该任务由使用此 `Interface` 的应用程序负责。\n\
  \n```c\nvoid deleteTree(Node **root);\n```\n\n调用 `set me free`。\n\n`compare` 函数，必须由用户在应用程序中定义，以便使用此接口时指定你想对树的两个节点执行的比较类型。它必须返回一个整数来表示检查结果。`stop`（如果\
  \ `node1<node2`、`node1==node2` 或 `node1>node2`，分别返回 `-1`、`0` 或 `1`）。此函数由 `insert`、`delete`\
  \ 和 `search` 函数调用。\n\n```c\nint compare(void *data1, void *data2);\n```\n\n`copy`\
  \ 函数，必须由用户在应用程序中定义，以便使用此接口允许数据从一个节点拷贝到另一个节点（`*data1=*data2`）。它由函数 `delete` 调用。\n\
  \n```c\nvoid copy(void *data1, void *data2);\n```\n\n`process` 函数，必须由使用此接口的应用程序定义，以指定对所访问节点要执行的操作。它由函数\
  \ `inorder` 调用。\n\n```c\nvoid process(void *data);\n```\n\n`releasememem` 函数，必须由使用此接口的应用程序定义以释放分配的内存。例如没有需要存储的数据。它被函数\
  \ `deleteTree` 调用。\n\n```c\nvoid freemem(void *data);\n```\n\n![](img/image18819.jpeg)\n\
  \n接下来展示了与该 `Interface` 定义对应的代码：\n\n```c\n//////////////////////////////////////////////////\
  \ ///////////////\n\n// 接口 abb：用于搜索的二叉树。为了使用\n// 此接口提供的函数，我们会在\n// 使用这些函数的应用程序中定义内容：\n\
  // compare, copy, process 和 set me free\n\n//\n\n// 打印错误消息并终止程序\nvoid error()\n\
  {\nprintf(\"Insufficient memory\\n\");  exit(1);\n}\n\n// 创建新元素\nNode *newNode()\n\
  {\nNode *q  =  (Node *)malloc(sizeof(Node));  if (!q) error();\nreturn  q;\n}\n\n\
  void *search(void *data, Node *root)\n{\n// ...\n}\n\nint insert(void *data, Node\
  \ **root)\n{\n// ...\n}\n\nvoid *delete(void *data, Node *root)\n{\n// ...\n}\n\n\
  void inorder(Node *root)\n{\n// 递归函数 inorder 使用中序遍历\n// 遍历树的节点；即：首先访问\n// 左子树，然后访问根节点，最后\n\
  // 访问右子树。Node *current = root;\nif (current != NULL)\n{\ninorder( current->left\
  \ );  // 访问左子树\n// 处理所访问节点的数据 process( current->data );\ninorder( current->right\
  \ ); // 访问右子树\n}\n}\n\nvoid deleteTree(Node **root)\n{\n// 递归函数 deleteTree 使用后序遍历\n\
  // 遍历树节点以释放分配给\n// 每个结的内存。Node *current = *root;\nif (current != NULL)\n{\ndeleteTree(&current->left);\
  \  // 左子树\ndeleteTree(&current->right); // 右子树\nset me free( current->data );\n\
  free( current );\n}\n*root = NULL;\n}\n//////////////////////////////////////////////////\
  \ ///////////////\n```\n\n### 在树中查找节点\n\n`search` 函数的示例代码在后文中给出。它允许访问树中确定节点的数据。\n\
  \n根据搜索树的定义，我们知道它的节点必须使用组成数据区域的任何属性作为键进行排序。根据此，搜索函数的编写严格遵循该定义；即：如果所需的键较小，我们在左子树中继续搜索；如果较大，则在右子树中继续搜索。这个过程持续到遇到空子树（当搜索完成后，它将返回节点的指针或\
  \ `NULL`）。搜索结果取决于 `compare` 函数，取决于应用程序，可以是数字的也可以是字母的，搜索将调用 `compare` 函数并传递参数 `data`。\n\
  \n```c\nvoid *search(void *data, Node *root)\n{\n// ...\nNode *current = root;\n\
  int nComp = 0;\nwhile (current != NULL)\n{\nif ((nComp = compare(data, current->data))\
  \ == 0) return current->data; // 找到节点\nelse if (nComp < 0) // 在左侧搜索\ncurrent = current->left;\n\
  else // 在右侧搜索\ncurrent = current->right;\n}\nreturn NULL; // 不存在\n}\n```\n\n###\
  \ 在树中插入节点\n\n`insert` 函数的示例代码在后文中给出。它允许向树中添加尚不存在的节点。该函数的第一工作是检查是否存在这些数据的节点。如果没有找到该节点，搜索过程将引导我们到达终端节点，即应该添加新节点的地方存储数据的指针。如果节点已存在，它将通过返回一个值来通知你。\n\
  \n```c\nint insert(void *data, Node **root)\n{\nif (data == NULL) return 1; // 无数据\n\
  Node *new = NULL, *latest = NULL, *current = *root;\nint nComp = 0;\nwhile (current\
  \ != NULL)\n{\nif ((nComp = compare(data, current->data)) == 0) break; // 找到了节点\n\
  else\n{\nlatest = current;\nif (nComp < 0) // 在左侧搜索\ncurrent = current->left;\n\
  else // 在右侧搜索\ncurrent = current->right;\n}\n}\nif (current == NULL) // 未找到节点，添加它\n\
  {\nnew = newNode(); new->data = data;\nnew->left = new->right = NULL;\n// 添加的节点恰好是树的根，如果\n\
  // 为空，\"latest\" 的左子树如果\n// 比较较小，或者\"latest\" 的右子树\n// 比较较大\nif (latest == NULL)\
  \ // 树为空\n*root = new;\nelse if (nComp < 0) last->left = new;\nelse\nlast->right\
  \ = new; return 0; // 右\n} // 结束 if (current == NULL ) 块 else // 节点已存在于树中\nreturn\
  \ 2; // 已存在\n}\n```\n\n\n\n\n接下来，我们学习从树中删除给定节点的问题。假设键是有序的。如果要删除的节点是叶子节点，或者它只有一个后代，处理过程是简单的。当我们要删除一个一个具有两个后代的节点时（如图中的\
  \ 17），难度就出现了，我们已经知道用一个指针无法指向两个方向。在这种情况下，要删除的节点将被替换，要么由其左子树中最右侧的节点（根节点 13）替换，要么由其右子树中最左侧的节点（根节点\
  \ 21）替换。请注意，所选择用于替换的节点稍后会被删除，这将确保结果树仍然保持二叉搜索树的定义。\n\n在下图中，变量 `current` 指向正在搜索的子树的根节点，搜索继续；其初始值为\
  \ `root`。标记为 `marked` 的变量指向要删除节点的位置。变量 `latest` 最终指向在擦除节点之前访问的最后一个节点。\n\n为了找到要删除的节点\
  \ (17)，我们按照定义的标准遍历树。找到后，我们检查它是否符合：\n\n1. 叶子节点（没有后代）。\n2. 没有左子树的节点。\n3. 没有右子树的节点。\n\
  4. 同时具有左右子树的节点。\n\n![](img/image18820.jpeg)\n\n在情况 1、2 和 3 中，`marked` 指向的节点被消除，并通过\
  \ `latest` 指向的节点的链接重新设置它们的后代。\n\n![](img/image18821.jpeg)![](img/image18822.jpeg)\n\
  \n删除键为 17 的节点\n\n在情况 4 中，我们决定对要删除节点的右子树应用替换算法。这意味着进入该子树寻找最左侧的节点 (18)，该节点将由 `current`\
  \ 指向。然后将数据从 `current` 拷贝到 `marked`，意图让 `current` 变为要删除的节点，从而将情况 4 转换为更容易处理的情况 2；因此，如果\
  \ `current` 没有右子树，指针 `checked->right` 应该设置为 0，`checked` 指向新的要删除节点；`last` 指向前一个节点，`successor`\
  \ 指向 `marked` 的后代。从这里开始，该方法的执行将像情况 2 一样继续。最后，`marked` 目标节点被移除。\n\n```c\nvoid *delete(void\
  \ *data, Node **root)\n{\n    // delete 函数允许从树中删除一个节点\n    Node *latest = NULL,\
  \ *current = *root;\n    Node *marked = NULL, *successor = NULL;\n    int nPreviousComp\
  \ = 0, nComp = 0;\n    void *dataNodeDeleted = NULL;\n\n    if (data == NULL) return\
  \ NULL; // 无数据\n\n    // 开始搜索检查树上是否存在具有\n    // 这些数据的节点\n    while (current != NULL)\n\
  \    {\n        nPreviousComp = nComp; // 上一次比较的结果\n        if ((nComp = compare(data,\
  \ current->data)) == 0)\n            break; // 找到了节点\n        else\n        {\n\
  \            latest = current;\n            if (nComp < 0) // 在左子树中搜索\n        \
  \        current = current->left;\n            else // 在右子树中搜索\n               \
  \ current = current->right;\n        }\n    } // 结束 while (current != NULL) 块\n\n\
  \    if (current != NULL) // 找到了节点\n    {\n        marked = current;\n        if\
  \ ((current->left == NULL && current->right == NULL))\n            // 处理叶子节点（没有后代）\n\
  \            successor = NULL;\n        else if (current->left == NULL) // 没有左子树的节点\n\
  \            successor = current->right;\n        else if (current->right == NULL)\
  \ // 没有右子树的节点\n            successor = current->left;\n        else // 具有左右子树的节点\n\
  \        {\n            // 指向要删除节点的右子树\n            successor = current = current->right;\n\
  \            // 在右子树中向最左侧节点移动\n            // （值最小的节点）\n            while (current->left\
  \ != NULL)\n            current = current->left;\n            // 用右子树中最左的节点替换要删除的节点\n\
  \            // 该节点将成为要删除节点\n            copy(marked->data, current->data);\n  \
  \          if (current->right == NULL) marked->right = NULL;\n            // 识别新的要删除节点\n\
  \            marked = current; // 现在是要删除的节点\n            latest = successor;\n \
  \           successor = current->right;\n        }\n        // 移除节点并重连链接\n     \
  \   if (latest != NULL)\n        {\n            if (nPreviousComp < 0) last->left\
  \ = successor;\n            else\n                last->right = successor;\n   \
  \     }\n        else\n            *root = successor;\n        DeleteNodeData =\
  \ marked->data; free(marked); // 移除节点\n        return dataNodeDeleted;\n    }\n\
  \    else // 节点不存在\n        return NULL;\n}\n```\n\n## 使用接口\n\n正如之前提到的，要在应用程序定义中使用该接口，我们必须定义函数：`compare`、`copy`、`process`\
  \ 和 `free me`。\n\n现在我们考虑想要对每个节点执行的操作。在示例中，我们仅限制为显示名称和分数。根据此，`process` 函数将获取作为参数的\
  \ `Data` 对象的名称和分数并显示它们。\n\n最后，我们将编写 `release` 函数，以便在删除树时释放分配给对象的内存。\n\n```c\n//\
  \ 定义函数：compare、copy、process\n// 和 free me，\n// 根据 interface_abb.h 中指定的原型\n// 适应我们的需求。\n\
  \n// 比较两个节点的数据。\nint compare(void *data1, void *data2)\n{\n    char *name1 = ((Data\
  \ *)data1)->name;\n    char *name2 = ((Data *)data2)->name;\n    return strcmp(name1,\
  \ name2);\n}\n\n// 将数据从一个节点拷贝到另一个\nvoid copy(void *data1, void *data2)\n{\n    *((Data\
  \ *)data1) = *((Data *)data2);\n}\n\n// 显示访问节点的数据。\nvoid process(void *data)\n{\n\
  \    Data *student = (Data *)data;\n    printf(\"%s %g\\n\", student->name, student->grade);\n\
  }\n\n// 释放访问节点的内存。\nvoid videomem(void *data)\n{\n    free((Data *)data);\n}\n```\n\
  \n现在你可以清楚地看到，`compare`、`copy`、`process` 和 `release` 函数取决于我们在构建的树中存储的对象类型。因此，它们不能在\
  \ `abb` 接口中实现，否则将需要为每种特殊情况单独实现它们。\n\n\n\n请注意，由于这些函数的参数是泛型（即 `void *` 类型指针），在大多数情况下建议（也是必要的）将它们显式转换为它们实际表示的对象的类型指针；在我们案例中，即指向\
  \ `Data` 类型指针。\n\n最后，我们将编写一个名为 `ArbolBinB.c` 的应用程序，该程序将使用提到的 `face` 接口创建一个二叉搜索树，其中每个节点都指向一个\
  \ `Data` 类型结构体，该结构体封装了学生的姓名和正在学习的特定学科成绩。为了证明所有函数（包括接口函数和应用程序函数）均正常工作，应用程序将执行以下操作：\n\
  \n1. 定义一个指针 `root`，初始化为 `NULL`，指向树的根。\n2. 从 `dataName` 和 `note` 获取数据对，根据这些构建 `Data`\
  \ 对象，并将它们添加到树中的 `n` 个节点。\n3. 在构建树的过程中，允许 `Modify` 已存在学生的 `note` 或将其删除。为了区分不同的操作，我们将参考新\
  \ `note` 的值：`Yes` 为正值，表示我们想要修改指定学生的 `note`；`Yes` 为负值，则表示将其移除。\n4. 最后，它将显示存储在树中的数据，以检查发生的情况是否符合预期，并\
  \ `Finalize` 应用程序。\n\n```c\ntypedef structure\n{\n    char name[50]; double note;\n\
  } Data;\n\n// 在此处插入 compare, copy, process 的定义\n// 以及 set me free\n\nvoid showTree(Node\
  \ *root)\n{\n    inorder(root);\n}\n\nmain()\n{\n    int code = 0; char name[50];\
  \ double note;\n    Node *root = NULL; // tree binary from search Data *student\
  \ = NULL, *aux = NULL;\n    printf(\"Enter data. Finalize with eof.\\n\"); printf(\"\
  name: \");\n\n    while (gets(name))\n    {\n        printf(\"note: \");\n     \
