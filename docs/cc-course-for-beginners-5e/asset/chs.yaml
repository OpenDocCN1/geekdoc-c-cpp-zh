  #### 第一章\n\n© FJCeballos/RA-MA\n\n# 程序成长的阶段\n\n![](img/image18418.jpeg)\n\n\n\n\n\
  在本章中，你将学习什么是程序、如何编写程序，以及需要哪些操作让计算机运行它并显示所需的结果。此外，你还将获得关于用于编写程序的编程术语通用知识。接下来，我们将专注于一种特定的编程语言以及本书的目标语言，`C/C++`，介绍它的前身、特征以及要遵循的模式，以便能够更容易地执行程序。\n\
  \n# 什么是程序\n\n你可能在某个时候用过计算机写文档，或者玩过游戏。回想在写文档的那一刻，你必须首先启动一个文字处理程序；如果想玩游戏，你必须做的第一件事就是启动该游戏。所以，文本处理器或游戏，它们都是计算机的程序。\n\
  \n启动一个程序等同于执行它。当我们执行一个程序时，我们只看到它产生的结果（例如屏幕上显示的文字处理示例，即我们写的文本；屏幕上可视化的正在发生的游戏图像），但我们看不到计算机为了获得这些结果而遵循的脚本。那个剧本就是程序。\n\
  \n现在，如果我们编写了一个程序，那么我们就知道它是如何工作的以及它为什么要这样工作。这是看待计算机程序的一种非常不同且奇特的方式，与执行不同程序时获得的经验毫无关系。\n\
  \n现在想一下任何游戏。问题是：如果我们想教教别人怎么玩，我们该做什么？逻辑上，你必须向他解释应该做什么；即你必须遵循的步骤。换句话说，我们提供了关于如何操作的指令。这就是计算机程序所做的事情。程序无非是用计算机能理解的语言给计算机提供的一系列指令，准确地告诉它我们想要让它做什么。如果计算机不理解某些指令，它通常会通过屏幕上显示的消息进行通信。\n\
  \n# 编程术语\n\n程序必须用计算机能理解的语言来编写。从物理角度来看，计算机是一台电子机器。计算机用于表示数据的物理元素（内存、中央处理器等）是二进制的；也就是说，每个元素可以区分两种状态（两个电压电平）。每个状态被称为一个通用位（bit），并用\
  \ `0` 或 `1` 表示。因此，为了表示和处理数值、字母和字母数字组合，使用了位流。计算机用于表示一个字符所使用的信息量被称为字节（byte）；通常一个字节是八位链。\n\
  \n![](img/image18419.jpeg)![](img/image18420.jpeg)![](img/image18421.jpeg)\n\n因此，例如，当程序告诉计算机在显示器上显示消息或在打印机上打印时，执行此动作的相应指令为了被计算机理解，必须以位字符串的形式存储在内存中。这表明使用\
  \ 0 和 1（机器语言）编写程序将非常耗时，并且极易出错。出于易读的原因，他们开发了汇编语言术语。\n\n汇编器语言使用助记代码（mnemonics）来指示硬件（计算机的物理组件）实际要执行的操作。助记代码是一个易于记忆的单词或缩写，代表计算机处理器应该执行的手工作。例如：\n\
  \n```\nMOV ah, 4CH\n```\n\n`MOV` 表示将某些信息从内存位置移动到另一个位置的操作。\n\n![](img/image18422.jpeg)![](img/image18423.jpeg)为了将汇编语言编写的程序翻译成机器语言（二进制代码），我们使用一种称为汇编器（assembler）的程序，我们通过计算机本身执行它。该程序将获取我们用汇编语言编写的程序数据，并生成相同的程序但用机器语言（即计算机理解的语言）编写。\n\
  \n![](img/image18424.jpeg)![](img/image18425.jpeg)![](img/image18426.jpeg)\n\n每个计算机模型根据它所使用的处理器都有它自己的汇编语言。由于由于，我们说这些语言是面向机器的。\n\
  \n今天，面向对象的语言或高级语言被使用得更广泛。这些语言使用易于理解的术语，更接近人类语言。在这种情况下，翻译是由编译器完成的。\n\n例如：\n\n```c\n\
  printf(\"hello\");\n```\n\nC 语言的 `printf` 函数告诉计算机在此时刻显示字符字符串。该方法也是如此的。\n\n```csharp\n\
  Console.WriteLine(\"hello\");\n```\n\n与汇编语言不同，这种级别完全不需要任何关于处理器的知识。\n\n# 编译器\n\n\
  ![](img/image18427.jpeg)![](img/image18428.jpeg)将用高级语言编写的程序翻译成机器语言需要使用一种称为编译器（compiler）的程序。该程序将我们用高级语言编写的程序视为数据，并输出相同的程序但用机器语言编写，这是一个已经可以直接运行的程序。\n\
  \n例如，用 C 语言编写的程序需要 C 编译器才能进行翻译。随后，翻译后的程序可以从计算机上直接执行。相反，翻译用某种语言编写的代码需要编译器。\n\n# 解释器\n\
  \n与编译器不同，解释器不会从源程序生成机器语言编写的程序，而是对程序的每条语句同时执行翻译和执行。例如，用 Basic 语言编写的程序需要 Basic 解释器才能执行。在程序每条语句的执行过程中，翻译是同时发生的。\n\
  \n与编译器不同，解释器在编写时检查程序的每一行，这使得设置程序变得容易。相反，执行速度较慢，因为已经带有了同步翻译。\n\n# 什么是 C？\n\nC 是一种高级编程语言，你可以在其中编写程序。它用于非常多种用途。\n\
  \nC 相对于其他编程语言的一个显著优势是，C 编译器生成的代码在尺寸上经过高度优化，从而带来了更高的执行速度，而缺点是 C 仅在源代码上与平台无关，这意味着每个不同的平台必须提供相应的编译器以获取必须运行的机器代码。\n\
  \n### C 语言的历史\n\n\n\n\nC 是一种通用用途的编程语言。其主要特点是：\n\n*   结构化编程。\n*   表达式简洁。\n*   丰富的运算符和数据类型。\n\
  *   同时支持高层和低层编码。\n*   优势性地取代了汇编语言编程。\n*   自然地利用系统原生函数。\n*   不面向任何特定特殊领域。\n*   生成的代码对象高度优化。\n\
  *   易于学习。\n\nC 语言诞生于 AT&T 贝尔实验室，并与 UNIX 操作系统紧密相关，因为它是在该系统上运行的，而且 UNIX 本身、C 编译器本身以及几乎所有的\
  \ UNIX 程序和工具都是用 C 语言编写的。它们的效率和清晰使得汇编语言在 UNIX 中几乎没有被使用。\n\n这种语言的灵感源于 Ken Thompson\
  \ 在 1970 年编写的 B 语言，其目的是为了重写 UNIX（当时 UNIX 的启动阶段是用汇编语言编写的），以便其在其他机器上的移植性。B 语言是一种演化的与机器无关的语言，灵感来自\
  \ Martin Richard 在 1967 年构思的 BCPL 语言。\n\n1972 年，Dennis Ritchie 接手并修改了 B 语言，创建了 C\
  \ 语言并用该语言重写了 UNIX。C 语言相对于 B 语言提供的新颖之处是数据类型和数据结构的设计。\n\n基本数据类型有 `char`（字符）、`int`（整数）、`float`（单精度浮点数）和\
  \ `double`（双精度浮点数）。后来添加了类型 `short`（长度 ≤ `int` 长度的整数）、`long`（长度 ≥ `int` 长度的整数）、`unsigned`（无符号整数）和\
  \ `enums`（枚举）。C 语言的基础结构类型是 `structures`（结构）、`unions`（union）和 `arrays`（数组）。基本类型可以定义更复杂的派生类型。\n\
  \n控制 C 程序执行流的指令是结构化编程中常见的 `if`、`for`、`while`、`switch-case`，这些包含在其前身 BCPL 中。同样，C\
  \ 允许你处理内存地址、使用函数并支持递归。\n\nC 语言的另一个特点是其丰富的运算符。可以说，对于每种可能的机器码操作几乎都有对应的运算符。另一方面，有一系列可以使用\
  \ C 语言完成的操作，这些操作本身并不包含在编译器中，而是由预处理器在编译之前执行的。最重要的两个是 `#define`（符号替换指令或定义）和 `#include`（包含源文件的指令）。\n\
  \n最后，C 语言被设计为在源代码级别具有高度移植性，并能够编写“不可编程”的内容，与其他语言一样，它也有自己的缺点。例如，它缺乏输入输出指令、处理字符字符串的指令等，这些工作留给了函数库，这不利于移植性的保持。此外，编写程序时的过度自由可能导致错误。这些编程错误在语法上是正确的，无法肉眼察觉。此外，运算符优先级有时会让表达式变成小谜题。无论如何，C\
  \ 已证明自己是一种极其有效且富有表现力的语言。\n\n### C++ 语言\n\nC++ 由 C 编程语言开发而来，除少数例外外，包含了 C。C++ 中包含的这部分内容被称为\
  \ C-，并且可以无问题地编译为 C++。\n\n1980 年，引入了诸如类（源自 Simula 67 的概念）、检查函数参数类型并在必要时进行类型转换等特征；结果产生了一种被称为“带类的\
  \ C”的语言。\n\n1983/84 年，带类的 C 经过重新设计、扩展并再次实现。结果被称为 C++ 语言。主要的扩展包括虚函数、重载函数（同一个标识符可以用于调用不同形式的函数）和重载运算符（同一个运算符可以在不同的语境下具有不同的含义）。在经过进一步的完善后，C++\
  \ 在 1985 年问世。这种语言由 Bjarne Stroustrup（AT&T 贝尔实验室）创建，并在他的一些著作中进行了记录。\n\nC++ 的名称源于\
  \ Rick Mascitti，意味着 C 语言转换的演进特性（“++”是 C 语言中的自增运算符）。\n\n随后，C++ 经过了大量的修订和完善，许多许多新功能的引入，例如多重继承、`static`\
  \ 和 `const` 成员函数、保护成员、泛型数据类型（也称为模板）以及异常处理。此外，还进行了一些小改进。综上所述，C++ 是一种混合语言，它一方面采纳了面向对象编程的所有特征，另一方面在实质上增强了\
  \ C 语言的能力。\n\n### 如何在 C 中实现程序\n\n在本节中，将通过示例介绍执行项目时需要遵循的步骤。下图图性地显示了用户名在开发时需要和应该做的事情。\n\
  \n1. 编辑程序\n2. 编译它\n3. 运行它\n4. 调试它\n\n显然，为了编写程序，你需要一个开发环境。C/C++ 的角色是：一个文本编辑器、C/C++\
  \ 编译器（包括我们将要讨论的部分）和一个调试器。因此，我们计算机的硬盘上必须存储编辑、编译和调试程序所需的工具。例如，假设我们想写一个名为 `salutation.c`（或\
  \ `saludo.cpp`）的程序。我们需要使用的工具（程序）以及产生的文件如下：\n\n| 产生文件 |\n| :--- | :--- |\n| 编辑器 |\
  \ `greeting.c`（或良好的 `greeting.cpp`） |\n| C/C++ 编译器 | `greeting.obj` 或 `greeting.o`，取决于编译器\
  \ |\n| 链接器 | `linker.exe` 或 `a.out`，省略，取决于编译器 |\n| 调试器 | 程序可执行文件 |\n\n上表表明，一旦 `salutation.c`\
  \ 或 `saludo.cpp` 程序编译得到对象文件 `greeting.obj` 或 `greeting.o`，就会与必要的 C 库函数链接，从而生成单个的可执行文件\
  \ `greeting.exe` 或 `a.out`。\n\n\n\n\n\n要编辑一个程序，我们首先将启动将使用的编辑器或文本处理器。如果我们有一个集成开发环境（包含编辑器、编译器和调试器），我们可以使用其自带的文本处理器；如果没有，我们将使用自己的处理器，例如操作系统提供的其中之一（参见附录\
  \ B）。选择在磁盘上保存程序的文件名必须具有 `.c` 或 `.cpp` 扩展名（`.cpp` 是 C++ 使用的扩展名）。\n\n下一步是编写与源程序对应的文本。每条\
  \ C 语言语句都以分号 `;` 结束，每行语法通过按下 `Get` 键（即 `Enter` 或 ``）来结束。\n\n为了练习到目前为止介绍的内容，让我们从创建一个简单的程序开始：一个在\
  \ ludo 中显示健康信息的经典示例。\n\n让我们从编辑与程序对应的 C 源文件开始。选择在磁盘上保存程序的文件名扩展名必须为 `.c` 或 `.cpp`。是的，编译器支持\
  \ C++；例如 `greeting.c`。\n\n一旦编辑器显示，我们将编写与源语法对应的文本。按照我所知道的示例到继续这样写下来：\n\n```c\n/****************\n\
  问候\n****************************/\n#include <stdio.h>\n\nmain()\n{\n    printf(\"\
  Hello world!!!\\n\");\n}\n```\n\n### 编写了什么？\n\n我们对程序的程序的每一行进行简要注释。如果某些术语不清楚，不需要着急，因为它们将在随后的章节中详细介绍。\n\
  \n前两行仅仅是注释。编译器不会计算注释。第三行包含了头文件 `stdio.h`，它包含了输入或输出（I/O）函数所需的声明，在我们的案例中，这些函数出现在 `printf`\
  \ 中。这意味着，作为一个一般规则，在调用函数之前，你必须对其进行声明。以符号 `#` 开头的 C 留字称为编译器指令，它们在调用编译器时由 C 预处理器处理，但在编译之前完成处理。`main`\
  \ 函数写在下面。任何编写的 C 程序都有一个 `main` 函数。注意，函数通过其名称后出现的修饰符 `()` 来区分，其正体以 `{` 开始并以 `}` 结束。`printf`\
  \ 函数属于 C 库，它的任务是在显示器上打印引号中的表达式。紧跟在字符串“Hello world!!!”之后的转义字符序列 `\\n` 告诉计算机，在写入该消息后，将屏幕光标移动到下一行的开头。注意语句以点`..`\
  \ 结束。\n\n编辑后的程序现在内存中。为了使工作具有连续性，必须使用编辑器的响应将编写的程序写入磁盘。非常重要：源程序的名称必须添加扩展名 `.c` 或 `.cpp`，是的，编译器支持\
  \ C++。\n\n### 编译并运行程序\n\n下一步是编译程序；即将源程序翻译成机器语言，并与 C 库中必要的函数链接（这个过程通常是自动完成的），然后获取可执行程序。根据编译器的制造商，编译和链接程序\
  \ `greeting.c` 对应的命令可以是以下任一：\n\n*   在带有 Microsoft 编译器的 Windows 系统上，示例中的 `cl` 命令调用\
  \ C 编译器和链接器来生成可执行文件 `greeting.exe`（参见附录 B 中的 Windows 命令行界面）。\n`cl greeting.c`\n\
  *   在 UNIX 系统上，示例中的 `cc` 命令调用 C 编译器和链接器来生成 `greeting` 可执行文件。如果我们没有添加 `-o greeting`\
  \ 选项，可执行文件默认命名为 `a.out`（参见附录 B 中的 Unix/Linux 命令行界面）。\n`cc greeting.c -o greeting`\n\
  \n由于编写的程序符合编译器的语法和规则，可能会发生编译错误。我们必须修正这些错误，直到获得无错误的编译结果。要运行生成的文件，在命令提示符的下方输入生成文件的名称（在我们的案例中为\
  \ `greeting`），并按回车。例如，对于我们来说，结果将屏幕将显示消息：Hello world!!!\n\n### 函数库\n\n正如我们之前提到的，C\
  \ 缺乏 I/O 指令、处理字符字符串的指令等，因此这些工作留给了编译器提供的函数库。函数是一组执行特定作业的指令集。库是磁盘上的一个单独文件（在 Windows\
  \ 上通常带有 `.lib` 扩展名，在 UNIX 上带有 `.a` 版本），它包含了执行最常见任务的函数，这样我们就不需要自己编写它们。作为一个例子，我们之前看到了\
  \ `printf` 函数。如果这个函数不存在，我们的任务就是编写必要的代码以便在屏幕上可视化显示结果。\n\n要使用库函数，你只需使用其名称调用它，并在括号中传递必要的参数。例如：\n\
  \n```c\nprintf(\"Hello world!!!\\n\");\n```\n\n接下来的图示说明了，在我们程序中调用的库函数对应的代码是由链接器在创建程序可执行文件时添加的。\n\
  \n### 将编写的程序保存到磁盘\n\n\n\n\n执行此过程的最简单有效的方法是使用 `scrubbing grass`。附录 B 介绍了如何使用调试器：Windows\
  \ 下的 Microsoft Visual C++ 和系统 `UNIX` 的 `gdb` 调试器。\n\n## 训练解析\n\n为了练习另一个程序，请编写以下示例并尝试运行。首先从命令行进行，然后使用你偏好的集成开发环境。以下示例展示了两个整数之间的加法、减法、乘法和除法。\n\
  \n打开你集成环境的文字处理器或编辑器，编辑下方所示的程序示例。理解这个示例不会费力，因为这些句子是用你已经熟悉的语法编写的。\n\n```c\n/*******************\
  \ Operations arithmetic ******************/\n\n// aritmeti.c\n\n#include <stdio.h>\
  \ main()\n\n{\n\nint data1, data2, result; data1 = 20;\n\ndata2 = 10;\n\n// Sum\n\
  \nresult = data1 + data2;\nprintf(\"%d + %d = %d\\n\", data1, data2, result);\n\n\
  // Subtraction\n\nresult = data1 - data2;\nprintf(\"%d - %d = %d\\n\", data1, data2,\
  \ result);\n\n// Product\n\nresult = data1 * data2;\nprintf(\"%d * %d = %d\\n\"\
  , data1, data2, result);\n\n// Quotient\n\nresult = data1 / data2;\nprintf(\"%d\
  \ / %d = %d\\n\", data1, data2, result);\n\n}\n```\n\n编辑好程序后，将其保存到磁盘上。记住文件名要具有扩展名\
  \ `c`；例如，`arithmetic.c`。\n\n这个程序做了什么？\n\n观察主函数 `main`，我们看到它声明了三个变量（类型为 `int`）：`data1`、`data2`\
  \ 和 `result`。\n\n`int data1, data2, result;`\n\n接下来将值 20 赋值给变量 `data1`，将值 10 赋值给变量\
  \ `data2`。\n\n`data1 = twenty;`\n`data2 = 10;`\n\n继续，它计算这些值的和，并写入数据和结果。\n\n`result\
  \ = data1 + data2;`\n\n![](img/image18452.jpeg)`printf(\"%d + %d = %d\\n\", data1,\
  \ data2, result);`\n\n`printf` 函数中引号内的表达式表示我们想要在显示器上显示的字符序列，其特殊之处在于，字符 `%d` 告诉编译器下一个字符不是要可视化的普通字符（`d`\
  \ 表示十进制整数值），否则编译器将将其视为格式说明符，该格式说明符将被下文指定的值列表中的对应值替换。根据此，之前的 `printf` 函数将产生以下结果：\n\
  \n`twenty + 10 = 30`\n\n因为此时，`data1` 的值为 20，`data2` 的值为 10，而 `result` 的值为 30。计算差、积和商也遵循了类似的过程。\n\
  \n下一步，我们将编译该程序，当获得没有错误的编译结果时，我们将执行它并验证操作是否符合预期。\n\n## 训练建议\n\n1. 回答以下问题：\n\n1) 位（Bit）象征着：\n\
  a) 一个条件。\nb) 一个事实。\nc) 0 或 1。\nd) 一个字符。\n\n2) 什么是字节（byte）？\na) 一个数字。\nb) 通常是八位的集合。\n\
  c) 一个电子元件。\nd) 一个位。\n\n3) 什么是硬件？\na) 计算机的物理组件。\nb) 程序。\nc) 一个解释器。\nd) 一个编译器。\n\n\
  4) 什么是编译器？\na) 字节的集合。\nb) 一种底层语言。\nc) 一个解释器。\nd) 一个程序翻译器。\n\n5) 什么是 C？\na) 一个程序。\n\
  b) 一个解释器。\nc) 一种高级语言。\nd) 一台电脑。\n\n6) 什么是 UNIX？\na) 一个操作系统。\nb) 一个编译器。\nc) 一个解释器。\n\
  \n7) C 是谁的？\na) Ken Thompson。\nb) Martin Ritchie。\nc) Dennis Ritchie。\nd) Bjarne\
  \ Stroustrup。\n\n8) 什么是 C++？\na) 是。\nb) 不是。\n\n9) 什么是：\na) 它们是。\nb) 它们不同。\n\n10)\
  \ 什么是：\na) 它们是。\nb) 它们是。\n\n\n\n\n多余的空白字符会被编译器忽略。根据某些说明，以下代码的行为与之前完全相同：\n\n```c\n\
  main() {\n    // lines on white spaces on White\n    printf (\"Hello, what such\
  \ you are.\\n\");\n}\n```\n\n![](img/image18454.jpeg) Windows 上的 `Ctrl+Z` 或 UNIX\
  \ 上的 `Ctrl+D` 由编译器处理。它们是文件结束（End Of File）的指示符。\n\n### 特殊字符与标点符号\n\n这组字符有不同的用法；例如，用于指示标识符是函数或数组；指定特定的算术、逻辑或关系操作等。它们如下：\n\
  \n`,` `.` `;` `:` `?` `'` `\"` `(` `)` `[` `]` `{` `}` `<` `!` `|` `/` `\\` `~`\
  \ `+` `#` `%` `&` `^` `*` `-` `=` `>`\n\n### 转义序列\n\n上述任何字符都可以用字符串表示。转义故事。转义序列由字符\
  \ `\\` 后跟一个字母或数字组合组成。它们用于换行、制表符等操作，以及引用不可打印字符。\n\nC 语言预定义了以下转义序列：\n\n![](img/image18456.jpeg)\n\
  \n序列名称：\n\n![](img/image18457.jpeg)\n\n- `\\n`: 跳到下一行的开头。\n- `\\t`: 水平制表符。\n- `\\\
  v`: 垂直制表符（单独用于打印机）。\n- `\\b`: 退格键（back space）。\n- `\\r`: 回车但不换行。\n- `\\f`: 分页符（单独用于打印机）。\n\
  - `\\a`: 警报、哨声。\n- `\\'`: 单引号。\n- `\\\"`: 双引号。\n- `\\\\`: 反斜杠（backslash）。\n- `\\\
  ddd`: 字符 ASCII 码的八进制表示（`d` 是 0 到 7 的数字）。\n- `\\xdd`: 字符 ASCII 码的十六进制表示（`d` 是 0 到\
  \ 9 的数字或 A 到 F 的字母）。\n\n![](img/image18458.jpeg)\n\n我在 `printf` 的调用中看到了转义序列 `\\\
  n` 的示例。\n\n### 数据类型\n\n记得我们在上一节中讨论过的 `aritmeti.c` 程序执行的算术操作。例如，我们执行的操作之一是两个值的之和：\n\
  \n```c\ndatal = twenty;\ndata2 = 10;\nresult = datal + data2;\n```\n\n为了让 C 编译器识别此操作，必须先指定参与操作的每个操作数的类型，从而确定结果的类型。为此，我们将写如下行：\n\
  \n```c\nint datal, data2, result;\ndatal = twenty;\ndata2 = 10;\nresult = datal\
  \ + data2;\n```\n\n上述语句告诉 C 编译器 `datal`、`data2` 和 `result` 是整数类型（`int`）。注意，可以使用逗号分隔的独立列表声明多个具有相同类型的变量。\n\
  \nC 语言中的数据类型可以分类为：基本类型和派生类型。\n\n### 基本类型\n\n我们之所以将它们称为基本类型，是因为编译器是这样定义的。可以分类的七种基本数据类型是：整数类型和实数类型。\n\
  \n整数类型：`char`、`short`、`int`、`long` 和 `enum`。实数类型：`float` 和 `double`。\n\n每个基本类型都有不同的正负值范围。用于声明特定程序变量的数据类型取决于每个变量要存储值的范围和类型，以及它们是整数还是分数。头文件\
  \ `limits.h` 和 `float.h` 规定了每个类型的最大值最小值。\n\n每个整数类型可以用 `signed`（有符号）或 `unsigned`（无符号）关键字进行修饰。有符号修饰的整数是有符号整数；即正负整数值。无符号修饰的整数是无符号整数值，作为正整数值处理。这种修饰产生了以下额外类型：\n\
  \n`signed char`、`unsigned char`、`signed short`、`unsigned short`、`signed int`、`unsigned\
  \ int`、`signed long`、`unsigned long`\n\n如果在没有指定特定整数类型的情况下使用符号修饰符，则假设类型为 `int`。因此，以下语句是等价的：\n\
  \n```c\nsigned x; /* 等同于 */\nsigned int x;\n```\n\n有符号修饰的整数是有符号整数；即正负整数值。无符号修饰的整数是无符号整数值，作为正整数值处理。这种修饰产生了以下额外类型：\n\
  \n`signed char`、`unsigned char`、`signed short`、`unsigned short`、`signed int`、`unsigned\
  \ int`、`signed long`、`unsigned long`\n\n如果在没有指定特定整数类型的情况下使用符号修饰符，则假设类型为 `int`。因此，以下语句是等价的。（注意\
  \ 'a' 和 之间的区别）\n\n```c\nsigned x;\n```\n\n\n\n\n`0` 到 `4294967295`，现在不再需要使用位来表示符号。\n\
  \n通常，可以认为 `int` 的长度微小于或等于 `length` 的长度。\n\n## enum (枚举)\n\n枚举类型的声明仅仅是该类型变量可以取值的值列表。枚举类型的值将用标识符表示，这些标识符将是新类型的常量。例如：\n\
  \n```c\nenum day week\n{\n    Monday, Tuesday, Wednesday, Thursday, Friday, Saturday,\
  \ Sunday\n} today;\n\nenum day week Yesterday;\n```\n\n此示例声明了枚举类型 `week_day` 的两个变量\
  \ `today` 和 `yesterday`。这些变量可以取指定的任何值，从 `Monday` 到 `Sunday`。根据此，`Monday` 的值为 `0`，`Tuesday`\
  \ 的值为 `1`，`wednesday_` 的值为 `2` 等，依此类推。构成组成所列类型的常量值从 `0` 开始，并随着从上到下或从左到右读取声明而递增 1。\n\
  \n### 从枚举创建\n\n创建一个枚举本用于从数据定义一个新类型（命名为类型 `enumerated`），并从该类型声明一个变量。语法如下：\n\n```c\n\
  enum enumerated_type\n{\n    /* 常量标识符 */\n};\n```\n\n其中 `enumerated_type` 是定义新类型的标识符。\n\
  \n然后从所列定义的类型中，可以声明一个或多个该类型的变量，格式如下：\n\n```c\nenum enumerated_type [ variable [,\
  \ variable ]...];\n```\n\n接下来的示例声明了一个名为 `Colour` 的变量，类型为所列的 `colors`，它可以从定义的列表中取任何值。\n\
  \n```c\nenum colors\n{\n    blue, yellow, Red, green, White, black\n};\n\nenum colors\
  \ Colour;\nColour = blue;\n```\n\n正如我们已经过的，枚举常量列表中的每个标识符都有一个关联的值。默认情况下，第一个标识符与值\
  \ `0` 相关，下一个与值 `1` 相关，依此类推。根据此：\n\n`Colour = green;` /* 等于 */ `Colour = 3;`\n\n\
  **注意：** 对于 ANSI C（符合美国国家标准协会规范的 C），枚举类型是一种 `int` 类型。然而，对于 C++，所列类型是一个与之前完全不同的类型。这意味着在\
  \ C++ 中，`int` 类型的值不能直接赋值给枚举变量，而必须进行显式类型转换（参见本章的从表达式到最后的显式类型转换）。例如：\n\n```c\nColour\
  \ = (colors)3; /* 从 int 到 colors 的显式转换 */\n```\n\n列表中的任何标识符都可以通过常量表达式分配初始整数值。后续标识符将取与其相关的值。例如：\n\
  \n```c\nenum colors\n{\n    blue, yellow, Red, green = 0, White, black\n} Colour;\n\
  ```\n\n此示例定义了一个名为 `colors` 的枚举类型并声明了一个变量。与标识符关联的值如下：`blue = 0`、`yellow = 1`、`Red\
  \ = 2`、`green = 0`、`white = 1` 和 `black = 2`。\n\n对于枚举成员，适用以下规则：\n\n*   两个或多个成员可以具有相同的值。\n\
  *   一个标识符在一个类型中重复出现。\n*   遗憾的是，无法直接读取或写入所列类型的值。下面的示例说明了这一细节。\n\n```c\n/* enum.c\
  \ */\n#include <stdio.h>\n\nenum colors\n{\n    blue, yellow, Red, green, White,\
  \ black\n};\n\nmain()\n{\n    enum colors Colour;\n    /* 从键盘输入一个 Colour */\n  \
  \  printf(\"Color: \");\n    scanf(\"%d\", &Colour);\n    /* 显示化输入的 Colour */ \n\
  \    printf(\"%d\\n\", Colour);\n    /* 是的，Colour 是绿色... */\n    if (Colour == green)\
  \ printf(\"hope\\n\");\n}\n```\n\n执行程序：\n```\nColour: 3 [Enter] 3\nhope\n```\n\n\
  你将在稍后的章节中详细了解 `scanf` 函数；现在只需注意该函数允许你将键盘输入的值赋值给指定的变量。当在上面的示例执行 `scanf` 函数时，无法直接将绿色值赋值给颜色变量，而必须分配等价的整数常量\
  \ `3`。同样，`printf` 不会写入 `green`，而是写入 `3`。根据此，他会问：那么，枚举类型是做什么的？枚举类型有助于让高层语言更接近我们的表达方式。正如你稍看到的，表达式“Yes\
  \ the Colour is green, ...”所说的比“Yes the Colour is 3, ...” 更好。\n\n## float (浮点型)\n\
  \n`float` 类型用于声明格式的 32 位浮点数据。IEEE 754 格式（该格式使用 1 位符号，8 位指数和 23 位尾数）。`float` 类型的数据存储精度约为\
  \ 7 位数字的值。要指定常量（字面量值）为 `float` 类型，你必须在值的末尾添加字母 'f' 或 'F'。约为 7 位数字。\n\n## double\
  \ (双精度型)\n\n`double` 类型用于声明格式的 64 位浮点数据。IEEE 754 格式（该格式使用 1 位符号，11 位指数和 52 位尾数）。`double`\
  \ 类型存储精度约为 16 位数字的值。要指定常量（字面量值）为 `double` 类型，你必须在值的末尾添加字母 'd' 或 'D'。\n\n### 示例：数据类型\n\
  \n下面的程序说明了上述概念；定义了 char、int、float 和 double 类型的变量，为每个变量赋值并显示在屏幕上：\n\n```c\n/* types.c\
  \ */\n#include <stdio.h>\n\nmain()\n{\n    /* 定义变量 */\n    char c;\n    int i;\n\
  \    float f;\n    double d;\n\n    /* 为变量赋值 */\n    c = 't';\n    i = 25;\n   \
  \ f = 3.14159F;\n    d = 2.7172;\n\n    /* 在屏幕上显示值 */\n    printf(\"c: %c\\n\",\
  \ c);\n    printf(\"i: %d\\n\", i);\n    printf(\"f: %f\\n\", f);\n    printf(\"\
  d: %f\\n\", d);\n}\n```\n\n执行程序：\n```\nc: t\ni: 25\nf: 3.141590\nd: 2.717200\n```\n\
  \n\n\n\n`%d` 和 `%f` 已被相应变量的值替换。结果显示在连续行上是因为每个表达式末尾有转义序列 `'\\n'`。简而言之，如果你想显示一个 `char`\
  \ 类型的值，`Format` 中的格式说明符是 `%c`；要显示一个 `int` 类型的值，`Format` 中的格式说明符是 `%d`；要显示 `float`\
  \ 或 `double` 类型的值，格式说明符是 `%f`；而要切换到下一行则使用转义序列 `'\\n'`。`printf` 函数还有很多可能性，我将在下一章节中介绍。\n\
  \n### 派生类型\n派生类型由基本类型构建。其中一些是：`structures`（结构）、`unions`（联合）、`arrays`（数组）、`pointers`（指针）和`functions`（函数）。这些类型将在后续章节详细学习。\n\
  \n### 类型的别名\n使用 `typedef` 关键字我们可以声明新的数据类型名称；即另一种类型的别名（无论是基本类型还是派生类型），稍后可以用于声明这些类型的变量。`typedef`\
  \ 的语法如下：\n\n```\ntypedef type_declaration synonym [, synonym ]...;\n```\n\n其中 `type_declaration`\
  \ 是 c 语言中定义的任何类型（基本或派生），`synonym` 是为指定类型选择的新名称 `Name`。\n\n例如，以下语句将新类型 `ulong` 声明为基本类型\
  \ `unsigned long` 的别名：\n\n```c\ntypedef unsigned long ulong;\n```\n\n一旦 `ulong`\
  \ 类型被定义为 `unsigned long` 的别名，就可以用以下两种形式之一声明变量 `ID`：\n\n```c\nunsigned long ID; /*\
  \ 等同于 */ ulong ID;\n```\n\n`typedef` 声明允许对程序进行参数化以避免可移植性问题。如果我们对依赖于类型使用 `typedef`，当程序迁移到另一个安装环境时，你只需要修改这些语句。\n\
  \n以下示例从 `enum colors` 声明了类型 `t_colors`，并定义了该类型的变量 `Colour`：\n\n```c\nenum colors\n\
  {\n    blue, yellow, Red, green, White, black\n};\n\ntypedef enum colors t_colors;\n\
  \nmain()\n{\n    t_colors Colour = blue;\n    // ...\n}\n```\n\n类型 `t_colors` 的语句也可以实现如下所示：\n\
  \n```c\ntypedef enum colors\n{\n    blue, yellow, Red, green, White, black\n} t_colors;\n\
  ```\n\n或者简单地：\n\n```c\ntypedef enum\n{\n    blue, yellow, Red, green, White, black\n\
  } t_colors;\n```\n\n### 字面量\n字面量是来自基本类型值的表达式，或者是字符链（用双引号括起来的字符集）。例如，这些都是字面量：`5`、`3.14`、`'a'`\
  \ 和 `\"hello\"`。实际上，它们是常量值。\n\n如所述，`C` 中的字面量可以是：整数、实数、字符和字符串。\n\n### 整数字面量\n`C`\
  \ 语言允许指定 10、8 和 16 进制的整数字面量。\n\n通常情况下，如果值为正，`+` 号是可选的，而只要值为负，`-` 号就会会存在。整数字面量的类型取决于它的基数、值以及其后缀。指定整数字面量的语法为：\n\
  \n```\n{[+]| -}integer_literal[{L|U|UL}]\n```\n\n如果字面量是十进制且没有后缀，其类型取决于其值可以表示的 `int`\
  \ 类型、`long int` 或 `unsigned long int` 中的哪一个。\n\n如果它是八进制或十六进制且没有后缀，其类型取决于其值可以表示的\
  \ `int`、`unsigned int`、`long int` 或 `unsigned long int` 类型中的第一个。\n\n你也可以通过添加后缀 `L`、`U`\
  \ 或 `UL`（大写或小写）显式指示整数字面量的类型。\n\n如果后缀是 `L`，当值可以在该类型中表示时，类型为 `long`；如果后缀是 `U`，当值可以在该类型中表示时，类型为\
  \ `unsigned int`；如果后缀是 `UL`，其类型为 `unsigned long`。\n\n十进制整数字面量可以有一个或多个 `0` 到 `9`\
  \ 之间的数字，其中四位数字中的第一个不是 `0`。例如：\n\n`4326` 常量整数 `int`\n`1522U` 常量整数 `unsigned int`\n\
  `1000L` 常量整数 `long`\n`325UL` 常量整数 `unsigned long`\n\n八进制整数字面量可以有一个或多个 `0` 到 `7`\
  \ 之间的数字，并以 `0` 开头。\n\n十六进制整数字面量可以有一个或多个 `0` 到 `9` 的数字以及字母 `A` 到 `F`（大写），并以 `0` 开头。\n\
  \n### 实数字面量\n实数字面量由整数部分、小数点和一个分数部分组成。也允许科学计数法，其中 `e` 是 10 进制的符号，可以是正负。\n\n### 字符字面量\n\
  单字符字面量是 `char` 类型。这种字面量由单引号组成。会考虑转义序列。示例示例：\n\n`' '` 空格\n`'x'` 小写字母\n`'\\n'` 换行\n\
  `'\\07'` ASCII\n`'\\x1B'` 转义\n\n单字符的值是字符集中对应的值。\n\n### 字符链字面量\n字符链字面量是双引号内的字符序列（包括转义序列）。例如：\n\
  \n`\"This is a constant from characters\"`\n`\"3.1415926\"`\n`\"Ride Santander\"\
  `\n`\"\"` /* 空链 */\n`\"Language \\\"C/C++\\\"\"` /* 产生 \"C/C++\" */\n\n当字符链太长时，可以使用字符\
  \ `\\` 作为字符延续符。示例所示：\n\n```c\nprintf(\"This chain from characters is too\\\nis long.\\\
  n\");\n```\n\n两个用空格分隔的字符链在编译时会被合并为一个单一链。示例所示：\n\n```c\nprintf(\"First string, \"\
  \ \"second string.\\n\");\n```\n\n\n\n\n标识符是赋予 `Program` 中的类型、字面量、变量、函数和标签的名称。形成标识符的语法如下：\n\
  \n```\n{ letter |_}[{ letter | digit |_}]...\n```\n\n这表示标识符由一个或多个字符组成（参见上文 `Letters`、`Digits`\
  \ 和 `Underscore` 段落），且第一个字符必须是字母或下划线。它们不能以数字开头，也不能包含特殊字符（参见前一节 `Characters` 特殊字符和标点符号`）。\n\
  \n这些字母可以是大写或小写。对于 `C` 而言，大写字母是除相同小写字母以外的字符。例如，它们标识 `Sum`、`sum` 和 `SUM`。它们是不同的。\n\
  \n标识符可以具有任意数量的字符但取决于使用的编译器，只有前 `n` 个字符是有意义的（`ANSI` 外部标识符允许 6 个字符，内部标识符——即函数内部允许\
  \ 31 个；`Microsoft C` 在内部和外部均允许 247 个；等）。这意味着当两个标识符在有效的前 `n` 个字符中至少有一个不同时，它们就是不同的。一些示例如下：\n\
  \n`Sum` `Calculus_Numbers_Primes`\n\n`order` `ViewData`\n\n### 关键字\n\n关键字是具有 `C`\
  \ 编译器特定含义的预定义标识符。因此，用户定义的标识符不能与关键字同名。`C` 语言具有以下关键字：\n\n| `car` | `double` | `int`\
  \ | `structure` |\n| `break` | `else` | `long` | `switch` |\n| `case` | `enum` |\
  \ `register` | `typedef` |\n| `char` | `external` | `return` | `Union` |\n| `build`\
  \ | `float` | `shorts` | `unsigned` |\n| `continue` | `for` | `signed` | `void`\
  \ |\n| `default` | `goto` | `size of` | `volatile` |\n| `do` | `if` | `static` |\
  \ `while` |\n\n关键字必须始终全小写。\n\n### 注释\n\n注释是给任何阅读源代码的人的消息。添加注释更容易理解程序。注释的目的是解释源代码。`C`\
  \ 支持两种类型的注释：\n\n• **传统注释**。传统注释以字符 `/*` 开始，以字符 `*/` 结束。这些注释可以占据一行的空间，但不能嵌套，并且可以出现在允许空格的任何地方。例如：\n\
  \n```c\n/*\n* 程序的执行从 main 函数开始。\n* main 函数可以调用其他函数\n* 由用户名预定义或定义。程序的执行\n* 在 main\
  \ 函数结束时结束。\n*/\n```\n\n• **单行注释**。这种注释以双斜杠（`//`）开始并延伸到行尾。它们被称为 `C++` 风格注释。这意味着 `C`\
  \ 吸并了 `C++` 的一些有趣特性；其中就是这种。下一行是示例：\n\n```c\n// 在此处添加初始化代码\n```\n\n### 符号常量语句\n\n\
  声明一个符号常量意味着告诉 `C` 编译器常量的 `Name` 及其取值。这通常在 `main` 函数使用之前通过提升宏指南 `#define` 完成，其语法如下：\n\
  \n```\n#define NAME VALUE\n```\n\n以下示例声明了实数常量 `PI` 值为 `3.14159`，单字符常量 `NL` 值为 `'\\\
  n'`，以及字符常量 `MESSAGE` 值为 `\"Press a key for continue\\n\"`：\n\n```c\n#define PI 3.14159\n\
  #define NL '\\n'\n#define MESSAGE \"Press a key for continue\\n\"\n```\n\n注意声明后没有分号。这是因为指令不是\
  \ `C` 语句，而是给预处理器的命令。常量的类型是所赋值值的类型。通常用大写字母写一个常量的 `Name`。\n\n### C++ 常量\n\n`C` 编译器合并的\
  \ `C++` 另一个特性是保留的关键字 `const`。使用它我们有了另一种声明常量的方法；只需在常量名前前加上类型后的 `const` 修饰符；如果省略类型，则假设为\
  \ `int`。例如，接下来的行声明了实数常量 `Pi` 值为 `3.14`：\n\n```c\ndouble Pi = 3.14;\n```\n\n一旦常量声明并初始化，其值就不能再修改。因此，在声明它时必须初始化。例如，假设已经声明了常量\
  \ `Pi`，下一个语句将导致错误：\n\n```c\nPi = 3.1416; /* error */\n```\n\n### 为什么要使用常量？\n\n使用常量更容易修改程序。例如，假设一个\
  \ `Program` 使用了 `N` 次值为 `3.14` 的常量。是的，我们必须将此常量定义为 `const double Pi`。\n\n### 变量语句\n\
  \n变量表示存储值的内存空间。与常量不同，变量的值可以在执行过程中改变。要在程序中使用变量，必须首先声明它。变量的声明由 `type`、`identifier`\
  \ 和关联的值组成：\n\n```c\nchar c = '\\n';\nmain() {\n    int i = 0;\n    float f = 0.0;\n\
  \    double d = 0.0;\n}\n```\n\n`type`（基本类型或派生类型）决定了变量可以取的值以及对其进行的操作。在上面的示例中，你可以看到有两个声明变量的地方：任何块之外（块指的是封装在字符\
  \ `{` 和 `}` 包围的语句集），以及语句块内部。\n\n当变量声明位于块内部时，在 `ANSI C` 中该声明必须在块的开头进行，而在 `C++` 可以在任何其他部分、在使用之前实现。在我们的示例中，变量\
  \ `c` 是全局的，变量 `i`、`f` 和 `d` 是局部的。\n\n### 初始化变量\n\n全局变量由 `C` 编译器默认初始化：数值变量为 `0`，字符为\
  \ `'\\0'`。它们也可以隐式初始化，正如我们在之前的示例中对 `c` 所做的那样。局部变量不会被 `C` 编译器初始化。因此，取决于我们是否对其进行初始化；建议初始化，因为正如你可以尝试的，这可以避免意外错误。\n\
  \n### 数值表达式\n\n表达式是由一组运算符连接的操作数，用于指定特定的操作。所有表达式在求值时都会返回一个值。例如：\n\n```\nto + 1\n\
  sum + c\namount * price\nx = 7 * sqrt - b / 2\n```\n\n\n\n当 C 语言需要评估涉及不同类型操作数的表达式时，它首先会为了执行请求的操作，将操作数的值转换为精度较高的操作数的类型（例如，`int`\
  \ 的精度比 `char` 高，`double` 的精度比 `int` 高）。当我知道从一个赋值开始尝试时，例如 `x = ...`，在不丢失信息的情况下，C\
  \ 会将右侧的值转换为左侧变量的类型。否则，C 建议显式地进行转换，我们将在本章末尾进行解释。\n\n### 运算符\n\n运算符是指示数据如何被处理的符号。我知道它们可以分为以下几类：算术运算符、关系运算符、逻辑运算符、一元运算符、位位运算符、赋值运算符、条件运算符以及其他。\n\
  \n## 算术运算符\n\n我们使用算术运算符来执行数学运算。它们如下：\n\n![](img/image18459.jpeg)\n\n运算符 运算\n\n![](img/image18460.jpeg)\n\
  \n- `+` 加法。操作数可以是整数或实数。\n- `–` 减法。操作数可以是整数或实数。\n- `*` 乘法。操作数可以是整数或实数。\n- `/` 除法。操作数可以是整数或实数。如果两个操作数都是整数，则结果为整数。在其他情况下，结果为实数。\n\
  - `%` 取模或整除余数。操作数必须是整数。\n\n![](img/image18461.jpeg)\n\n下面的示例展示了如何使用这些运算符。正如我们已经说过的，注意要先声明变量，然后执行操作。对它们执行所需的操作。\n\
  \n```c\nint to = 10, b = 3, c; float x = 2.0F, and;\n\nand = x + to; // 结果是 float\
  \  12.0\nc = to / b; // 结果是 int  3\n\nc = to % b; // 结果是 int  1\n\nand = to / b;\
  \ // 结果是 int  3.\n\n// 将 转换为 float 以赋值给 and\nc = x / and; // 结果是 float  0.666667.\n\
  \n// 转换为 int 以赋值给 c (c = 0)\n```\n\n当在算术运算中操作数的类型不同时，两者都会转换为最高精度操作数的类型。例如，为了执行加法\
  \ `x+a`，整数 `a` 的值会被转换为 float（`x` 的类型）。`a` 本身没有修改，但它的值被转换为 float 以执行加法。`short` 和\
  \ `char` 类型会自动转换为 `int`。\n\n在赋值中，算术运算得到的结果被隐式或显式地转换为存储该结果的变量的类型。例如，`x/y` 的结果只有整数部分赋值给\
  \ `c`，因为 `c` 的类型是 `int`。这表示实数转换为整数时会截断小数部分。\n\n实数结果会被舍入。注意运算 `x/y`，当 `x` 等于 2 且\
  \ `y` 等于 3 时；结果在 `0.666666` 的第 6 位上是 `7`，因为被舍弃的第一位小数是 `6`。如果舍弃的第一位小数是 `5` 或更高，则保留的最后一位小数加\
  \ 1。\n\n现在你可能很容易计算一个定三角形的面积，例如底为 11.5，高为 3。让我们来看看：\n\n```c\n/* triangle.c\n*/\n\n\
  #include <stdio.h>\n\nmain()\n{\n    double base = 11.5, height = 3.0, area = 0.0;\n\
  \    area = base * height / 2; printf(\"Area = %f\\n\", area);\n}\n```\n\n执行程序：\n\
  \n```\nArea = 17.250000\n```\n\n如果你希望显示非零，使用 `%g` 格式代替 `%f`。我们会看到：\n\n```\nArea\
  \ = 17.25\n```\n\n## 关系运算符\n\n关系运算符允许评估相等和大小。关系运算的结果是布尔值（真 1 或 0）。以下是：\n\n![](img/image1859.jpeg)\n\
  \n运算符 运算\n\n![](img/image1862.jpeg)\n\n- `<` 小于\n- `>` 大于\n- `<=` 小于等于\n- `>=` 大于等于\n\
  - `!=` 不等于\n- `==` 等于\n\n![](img/image1863.jpeg)\n\n操作数必须是基本类型。例如：\n\n```c\nint\
  \ x = 10, and = 0, r = 0;\nr = x == and; // r = 0 (false)\nr = x > and; // r = 1\
  \ (true)\nr = x != and; // r = 0 (false)\n```\n\n在长表达式中，使用括号可以更清晰。例如，`==`、`>` 和\
  \ `!=` 的优先级更高。所以：\n\n```c\nr = (x == and); // r = 0 (false)\nr = (x > y); // r =\
  \ 1 (true)\nr = (x != y); // r = 0 (false)\n```\n\n## 逻辑运算符\n\n逻辑运算（与、或、非）的结果是布尔值（真\
  \ 1 或假 0）。可以使用以下逻辑运算符形成逻辑表达式（见关系运算符）。在 C 语言中，任何非 0 的数值表达式都对应于真值。\n\n![](img/image1859.jpeg)\n\
  \n运算符 运算\n\n![](img/image1864.jpeg)\n\n- `&&` 与。只有当每个操作数都为真时，返回真。如果其中一个为假，则结果为假。如果第一个操作数为假，则不求值第二个操作数。\n\
  - `||` 或。只有当每个操作数都为假时，结果为假。如果其中一个为真，则结果为真。如果第一个操作数为真，则不求值第二个操作数（字符 `|` 的 ASCII 值为\
  \ 124）。\n- `!` 非。如果评估的结果为真，则运算符结果为假，反之亦然。\n\n![](img/image1865.jpeg)\n\n逻辑运算的结果类型为\
  \ `int`。例如：\n\n```c\nint p = 10, q = 0, r = 0;\nr = (p != 0) && (q != 0); // r =\
  \ 0 (false)\nr = (p != 0) || (q > 0); // r = 1 (true)\nr = !r; // 是的 r 是 1，!r 就是\
  \ 0，反之亦然\n```\n\n\n\n在前述语句中出现的括号对于增加清晰度并不是必要的。它们之所以没有必要是因为正如我们稍后将看到的，关系运算符的优先级高于它们之前运行的运算符，因此它们会先执行。\n\
  \n### 一元运算符\n\n一元运算符只作用于一个操作数，如下：`!`、``、`~`、`++` 和 `--`。我们已经见过 `!` 运算符，`++` 和 `--`\
  \ 运算符将在稍后详细讨论。\n\n![](img/image18459.jpeg)\n\n运算符 | 操作\n\n![](img/image18466.jpeg)\n\
  \n`~`: 1 补码（将 0 变为 1，1 变为 0）。字符 `~` 的 ASCII 值为 126。操作数必须是基本类型整数。\n\n`--`: 改变操作数的符号（即\
  \ 2 补码，反说是 1 补码加 1）。操作数可以是基本类型整数或实数。\n\n![](img/image18467.jpeg)\n\n以下示例使用了这些运算符：\n\
  \n```c\nint to = two, b = 0, c = 0;\nc = -to; // 结果 c = -two\nc = ~b; // 结果 c =\
  \ -1\n```\n\n### 位运算符\n\n这些运算符允许对操作数按位执行与（AND）、或（OR）、异或（XOR）和位移操作。操作数必须是整数。\n\n\
  ![](img/image18459.jpeg)\n\n运算符 | 操作\n\n![](img/image18468.jpeg)\n\n`&`: 按位与运算。\n\
  \n`|`: 按位或运算（字符 ASCII 值为 124）。\n\n`^`: 按位异或运算。\n\n`<<`: 左移，右侧用 0 填充。\n\n`>>`: 右移，左侧用符号位填充。\n\
  \n![](img/image18469.jpeg)\n\n操作数必须是基本类型整数。\n\n```c\nint to = 255, r = 0, m = 32;\n\
  r = to & 017; // r=15. 将 to 中除低位 4 位以外的所有位置为 0。\nr = r | m; // r=47. 将 r 中所有 m 中为\
  \ 1 的位置为 1。\nr = to & ~07; // r=248. 将 to 中低位 3 位置为 0。\nr = to >> 7; // r=1. 向右移动\
  \ 7 位。\nr = m << 1; // r=64. 等于 r = m * two\nr = m >> 1; // r=16. 等于 r = m / two\n\
  ```\n\n### 赋值运算符\n\n赋值操作的结果是存储在操作数中的值。在 C 中，逻辑上在赋值完成后，被赋值的值会隐式或显式地转换为左侧操作数的类型（见数据类型之间的转换章节）。我们在这里包含了增和和减运算符，因为这些运算符隐式地对其操作数执行赋值。\n\
  \n![](img/image18459.jpeg)\n\n运算符 | 操作\n\n![](img/image18470.jpeg)\n\n`++`: 增一。\n\
  \n`--`: 减一。\n\n`=`: 简单赋值。\n\n`*=`: 乘赋值。\n\n`/=`: 除赋值。\n\n`%=`: 取模赋值。\n\n`+=`: 加赋值。\n\
  \n`-=`: 减赋值。\n\n`<<=`: 左移赋值。\n\n`>>=`: 右移赋值。\n\n`&=`: 按位与赋值。\n\n`|=`: 按位或赋值。\n\n\
  `^=`: 按位异或赋值。\n\n![](img/image18471.jpeg)\n\n操作数必须是基本类型。以下是这些运算符的一些示例。\n\n```c\n\
  int x = 0, n = 10, i = 1;\nn++; // 将 n 的值加 1。\n++n; // 将 n 的值加 1。\nx = ++n; // 将\
  \ n 加 1 并将结果赋值给 x。\nx = n++; // 等于按顺序执行两个操作：x = n++;\ni += two; // 执行操作 i = i +\
  \ two。\nx *= n - 3; // 执行操作 x = x * (n-3)\nn >>= 1; // 执行操作 n = n >> 1，将内容右移。\n\
  ```\n\n递增运算符根据其作为后缀还是前缀，将其操作数增加一个单位；即 `n++` 和 `++n` 产生相同的结果。现在，当包含递增或递减运算符的表达式赋值给变量时，结果取决于它们的用法。如果作为前缀使用，先执行递增或递减，然后执行赋值（见下表）；如果作为后缀使用，则赋值的值对应于表达式求值。根据上述，评估以下表达式后\
  \ `x` 的值是多少？`x = (to - c++) * (--c - d) / two`\n\n让我们通过以下程序评估此表达式来检查结果。我们观察到在计算\
  \ `x` 的过程中 `b` 的值参与了计算，但没有对受 `++` 和 `--` 前缀影响的变量进行增/减，且结果 `x` 增加到了 30。\n\n```c\n\
  void main() {\n    float x = 0, b = 0, to = fifteen, d = 4;\n    x = (to - c++)\
  \ * (--c - d) / two;\n}\n```\n\n\n\n\n```c\ndouble to = 10.2, b = 20.5, higher =\
  \ 0; higher = (to > b) ? to : b;\n```\n\n### 其他运算符\n\n最后，我们将介绍 `sizeof` 运算符、逗号运算符以及取地址和内容运算符。\n\
  \n#### sizeof 运算符\n\n`sizeof` 运算符返回其操作数以字节为单位的大小。这里说的 `operand` 可以是标识符，也可以是之前定义的变量的类型。例如：\n\
  \n```c\n#include <stdio.h>\nmain()\n{\n    int to = 0, you = 0; you = sizeof(to);\n\
  \    printf(\"The size of the integer 'a' is: %d bytes\\n\", t); \n    printf(\"\
  The size from a whole is: %d bytes\\n\", sizeof(int));\n}\n```\n\n**运行程序：**\n\n\
  ```\nThe size the whole 'to' is: 4 bytes \nThe size from a whole is: 4 bytes\n```\n\
  \n括号是可选的，除非操作数对应于数据类型。`sizeof` 运算符可以应用于任何基本类型或派生类型的数值变量，但不能应用于未指定维度的矩阵、位域或函数。\n\n\
  ### 逗号运算符\n\n逗号用于连接多个操作，这些操作将从左到右执行。逗号最常见的用法是在 `for` 语句中（后文可见）。示例示例：\n\n```c\nhelp\
  \ = v1, v1 = v2, v2 = aux;\nfor (to = 256, b = 1; b < 512; to /= two, b *= two)\
  \ { // ... }\n```\n\n下面的示例是对函数 `fx` 的调用（类似于调用 `printf` 函数的过程）。调用中传递了四个参数，其中第二个 `(b\
  \ = 10, b - 3)` 的值为 7。\n\n```c\nfx(a, (b = 10, b - 3), c, d);\n```\n\n#### 取地址运算符\n\
  \n`&` 运算符（取地址）允许获取其操作数的地址。例如：\n\n```c\nint to = 7; // 变量 'to' 存储值 7 \nprintf(\"\
  address from memory = %d, fact = %d\\n\", &to, to);\n```\n\n上几句的结果类似于下面：\n\n```\n\
  address from memory = 1245048, fact = 7\n```\n\n从图形角度看，结果可以在图中看到。该图表示一个 `n` 字节的内存段。在这个局部段中，我们分析了地址为\
  \ 1245048 的四字节长整数 7。变量 `a` 代表值 7，而 `&a` 是 1245048（`&a`：a 的地址是它所在的内存单元）。\n\n![](img/image18472.jpeg)\
  \ 1245048\n\n该运算符不能应用于字符串位域、结构体或用 `register` 限定符声明的标识符，这些概念我们稍后会看到。\n\n#### 取值运算符\n\
  \n`*`（间接）运算符通过方向（指针）间接访问值。结果是操作数所地址的值；换句话说，指针指向的值。\n\n指针是一个能够存储内存地址的变量，该地址指示指定类型数据（例如整数）的位置。定义指针的语法为：\n\
  \n```\ntype * identifier ;\n```\n\n其中 `type` 是指向的数据的类型，`identifier` 是指针的名字（包含内存地址的变量）。\n\
  \n下面的示例声明了一个指向整数值 `x` 的指针 `px`，然后将此值赋值给整数 `and`。\n\n```c\n#include <stdio.h>\nmain()\n\
  {\n    int *px, x = 7, and = 0; // px 是一个指向数值的指针。\n    px = &x; // 在指针 px 上存储了\n\
  \    //  x 的地址。\n    and = *px; // 在 and 上存储了位于\n    // px 存储的地址的值。\n    printf(\"\
  memory address = %d, data = %d\\n\", &x, x); \n    printf(\"address from memory\
  \ = %d, fact = %d\\n\", px, *px);\n}\n```\n\n**运行程序：**\n\n```\naddress from memory\
  \ = 1245048, fact = 7 \naddress from memory = 1245048, fact = 7\n```\n*(注：原文有重复的执行行，此处保留核心逻辑)*\n\
  \n\n\n\n\n```c\nunsigned char b; int c;\nfloat d; int F;\nF = to + b * c / d;\n\
  ```\n\n在前面的表达式中，先执行乘法，然后是除法，最后是加法。根据此，评估过程将采取如下形式：\n\n1. `b` 被转换为 `int`（它通过了 4）。\n\
  2. `b` 和 `c` 的类型都是 `int`。执行乘法 `*` 并得到一个类型为 `int` 的结果。\n3. 由于 `d` 的类型是 `float`，`b\
  \ * c` 的结果被转换为 `float`（步骤 3）。我执行除法 `/` 并得到一个类型为 `float`的结果。\n4. `a` 被转换为 `float`（步骤\
  \ 3）。执行加法 `+` 并得到一个类似于 `float` 的结果。\n5. `to + b * c / d` 的结果为了赋值给 `f`，将通过截断传递给整体，即移除小数部分。\n\
  \n当 C 编译器需要执行类型转换但无法执行时，它会警告此类事件。在这些情况下，最正常的方法是通过分析显式转换来解决此类实际情况。\n\nC/C++ 允许通过名为\
  \ `cast` 的构造对表达式类型进行显式转换（强制转换），形状如下：\n\n`( type ) expression`\n\n例如，以下程序写了 `i` 等于\
  \ 9 时 `i/2` 的平方根：\n\n```c\n/*  square_root.c */\n#include <stdio.h> // printf 需要\n\
  #include <math.h> // sqrt (root square) 需要\n\nmain()\n{\n    int i = 9; double r\
  \ = 0;\n    r = sqrt(i/2);\n    printf(\"The root square is %g\\n\", r);\n}\n```\n\
  \n执行该程序：\n平方根是二\n\n你可能等待得到的结果是 4.5 的平方根，而不是 4。发生这种情况是因为两个整数的除法（`i/2`）得到了另一个整数。为了得到预期的结果，我们我们需要将\
  \ `i` 转换为 `double` 只为了执行 `i/2` 操作，正如在本节中讨论的，这将强制编译器像处理两个操作数都是 `double` 一样处理 `i/2`\
  \ 操作。为此，我们必须写：\n\n`r = sqrt( (double)i /2);` // 强制从 int 到 double 的转换\n\n现在，是的，我们重新执行程序，我们将得到以下结果：\n\
  平方根是 2.12132\n\n当执行显式转换时，表达式被转换为指定的类型，无论该转换是否被允许；否则，将返回错误。`cast` 构造的正确使用确保了评估的一致性。尝试它，但只要可能，最好避免它，因为它抑制了编译器提供的验证，因此可能导致意外的结果。\n\
  \n在 C++ 中，`cast` 构造也可以这样表达，所以：\n\n`type ( expression )`\n\n语法类似于调用函数，通过它接收了来自函数式记法的名称。根据此约定，之前的示例我们就会写成：\n\
  \n`r = sqrt(double(i)/2);`\n\n函数式记法只能在 C++ 中使用，并且带有简单名称类型。如果不是，使用 `typedef` 给派生类型分配一个简单的名称。例如：\n\
  \n```c\ntypedef int *paint;\n// ...\nint *p = paint (q);\n```\n\n### 总结：\n\n* 参与确定操作的操作的操作数。它们被转换为精度更高的操作数的类型。\n\
  * 在 C 中，实数常数默认是 `double` 类型。\n* 布尔表达式 _ 给出的结果是 1 为真（true），0 为假（false）。\n* 在赋值时，右部分的值被转换为左侧变量的类型，符合以下规则：\n\
  \    * 字符转换为整数，有或无符号扩展均可，取决于安装。通常转换带有符号扩展完成的。\n    * 整数转换为字符，保留最低有效位，即丢弃权重过高的高位。\n\
  \    * 实数转换为整数，截断小数部分。\n    * `double` 变为 `float`，会进行舍入并丢失精度，因为 `double` 值可能无法精确表示。\n\
  * 当一个值作为参数传递给函数时，也会发生转换。这些转换在每个文件的调用处独立执行。\n\n### 练习建议\n\n1. 下列表达式中哪个对应序列？\n   \
  \ a) ESC。\n    b) `\\n`。\n    c) `0x07`。\n    d) `n`。\n2. C 中的基本类型：\n    a) `int`,\
  \ `float` 和 `void`。\n    b) `boolean`, `char`, `short`, `int`, `long`, `float` 和\
  \ `double`。\n    c) `char`, `short`, `int`, `long`, `enum`, `float` 和 `double`。\n\
