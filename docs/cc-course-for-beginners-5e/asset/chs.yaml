  \ `a` 中，是通过乘法和加法实现的。另一方面，正如我们后面看到的，`p` 指向的数组可能长度不同，而在矩阵中，所有的行必须具有相同的长度。\n\n现在假设我们需要将地址\
  \ `p`（指针数组的起始地址）存储另一个变量 `q` 中。我们该如何定义这个变量呢？如果你回答这个问题，你就会得到答案：你指向的是谁？指向 `p`？显然答案是：指向指针矩阵的第一个元素；即\
  \ `p[0]`，它是一个指向 int 的指针。那么 `p` 指向一个指针，该指针又指向一个整数。因此，`q` 必须定义为可以存储一个指向 int 指针的指针。\n\
  \n### 指针的指针\n\n为了指定一个变量是指向指针的指针，使用的语法如下：\n\n`type *varpp;`\n\n其中 `type` 指定了双重间接后指向的对象的类型（可以是任何类型，包括派生类型），而\
  \ `varpp` 是指针变量到指针的标识符。例如：\n\n```c\nint to, *p, **pp;\nto = 10; // 事实\np = &to;\
  \ // 指向事实的指针\npp = &p; // 指向指向事实指针的指针\n```\n\n![](img/image18633.jpeg)![](img/image18634.jpeg)pp\n\
  \n&p\n\n我知道这意味着 `p` 是一个具有间接层的变量；也就是说，通过 `p` 不是直接访问数据，而是访问指示事实位置的地址。通过类似的推理，我们将说\
  \ `pp` 是一个具有两级间接层的变量。\n\n下面的代码解决了之前的例子，但现在使用了声明为指向指针的指针的变量 `q`。使用指向指针 `q` 访问数组 `a`\
  \ 中的项可以像使用 `a` 一样使用索引法或使用指针表示法。使用索引法将是：\n\n```c\n/* Pointer_to_pointer.c */\n#include\
  \ <stdio.h>\nmain()\n{\n    int i, j;\n    int a[5][5]; // 二维矩阵\n    int *p[5];\
  \ // 指针矩阵\n    ![](img/image18635.jpeg)\n    for (i = 0; i < 5; i++) p[i] = a[i];\
  \ // 将 a 的行赋值给 p\n    int **q = p;\n    for (i = 0; i < 5; i++) for (j = 0; j <\
  \ 5; j++)\n        scanf(\"%d\", &q[i][j]);\n    for (i = 0; i < 5; i++)\n    {\n\
  \        for (j = 0; j < 5; j++)\n            printf(\"%7d\", q[i][j]);\n      \
  \  printf(\"\\n\");\n}\n```\n\n### 指向字符链的矩阵\n\n通过类似于对数值指针数组所进行的研究，我们会说指向字符字符串的数组是一个单一数组。其每个元素类型为\
  \ `char *` 或 `unsigned char *`。例如：\n\n```c\nchar *p[5]; // 包含五个元素的 (char *) 类型的矩阵\n\
  char c = 'z'; // 类型为 char 的变量 c\np[0] = &c; // p[0] 指向字符 'z'\nprintf(\"%c\\n\",\
  \ *p[0]); // 输出：z\n```\n\n\n\n\n\n此示例定义了一个包含五个元素的数组 `p`，每个元素都是一个指向字符的指针 (`char *`)，以及一个类型为\
  \ `char` 的变量 `c`，其初始化值为 'z'。然后，我们将 `c` 的地址赋值给 `p[0]` 并写入其内容。同样地，我们可以对矩阵的其余元素继续操作。同样，如果像\
  \ `p[0]` 这样的元素可以指向一个字符，也可以指向一个字符字符串或一维字符数组；在这种情况下，指向的字符将与链中的第一个元素匹配。例如：\n\n```c\n\
  p[0] = \"hello\"; // p[0] 指向链 hello\nprintf(\"%s\\n\", p[0]); // 输出: hello\n```\n\
  \n形如 `p[0] = \"hello\"` 的赋值是将指定字符串的地址分配给指定的数组元素，该元素的类型必须是 `char *`。另一方面 Yes on some\
  \ moment ha thought-out on to write a judgment What\n\n```c\np[1] = 'to';\n```\n\
  \n这样做将会是一个错误，因为你正试图试图将一个 `int` 值（ASCII 字符 a 的值）赋值给类型为 `char *` 的变量，而指针只能被赋予有效地址。\n\
  \n也许，也可以考虑编写以下代码来读取所有的字符链：\n\n```c\n#include <stdio.h>\nmain()\n{\n    int i;\n\
  \    char *p[5]; // 指针组成的矩阵\n    for (i = 0; i < 5; i++)\n        gets(p[i]);\n\
  }\n```\n\n编写上述代码是错误的，因为 `gets` 函数从标准输入读取一个字符字符串并将其存储在指定的字符串中；在我们的案例中，你必须通过指定的地址\
  \ `p[i]` 放置它，但如果数组尚未初始化，这个地址又是哪里？解决方案是在 `p[i]` 中存储一个程序可以使用的内存块地址。例如，假设数组 `p` 的每个元素所指向的对象本身都是一个包含\
  \ 81 个元素的 `char` 类型数组。为了做到这一点，我们可以让指向的对象成为另一个 `char` 类型二维数组 `cad` 的行。稍后我们将学习通过动态创建数组（即在执行期间）来解决这个问题。\n\
  \n```c\nchar str[5][81]; // 字符链矩阵\nchar *p[5]; // 指针数组\nfor (i = 0; i < 5; i++)\n\
  \    p[i] = str[i];\nfor (i = 0; i < 5; i++)\n    gets(p[i]);\n```\n\n![](img/image18648.jpeg)![](img/image18649.jpeg)p\
  \ ch\n\n![](img/image18650.jpeg)str[0]\n\nstr[1]\n\nstr[2]\n\nstr[3]\n\nstr[4]\n\
  \n正如我们在讨论指针数组时解释的，给矩阵 `p` 的元素分配 `ch` 的行 (`p[i] = ch[i]`) 的循环不能由单个赋值 `p = ch` 替换，因为间接层级不同。这清楚表明，字符串数组和指向字符串的指针数组虽然形状相似，但它们并不是同一个。\n\
  \n现在假设我们需要将地址 `p`（指针数组的起始地址）存储在另一个变量 `q` 中。我们该如何定义这个变量呢？根据所学的，我们必须定义它以便存储一个指向 `char`\
  \ 指针的指针，因为 `p` 指向一个指针 `p[0]`，而 `p[0]`  又指向一个 `char`。下面的示例解释了这一点。\n\n```c\n/*  从字符链矩阵写入内容。\n\
  * 指针版本。\n* pointers_to_strings.c\n*/\n\n#include <stdio.h>\n\nmain()\n{\n    int\
  \ i;\n    char str[5][81]; // 字符链矩阵\n    char *p[5]; // 指针矩阵\n    char **q; // 指向指针的指针\n\
  \    for (i = 0; i < 5; i++)\n        p[i] = str[i];\n    q = p;\n    for (i = 0;\
  \ i < 5; i++)\n        gets(q[i]);\n    for (i = 0; i < 5; i++)\n        printf(\"\
  %s\\n\", q[i]);\n}\n```\n\n在在上的练习中，我们可以观察到指针数组的起始地址 `p` 可以存储在一个定义为指向指针的变量 `q` 中，因为两种类型都定义了具有两级间接层的变量。但这并不意味着它们是相同的，事实上它们不是；`p`\
  \ 定义了一个矩阵，而 `q` 没有。让我们来看一个例子。以下程序显示了一个接收整数作为参数并返回字符串指针作为结果的函数。\n\n```c\n#include\
  \ <stdio.h>\n\nmain()\n{\n    unsigned int day, month, year, r;\n    char *m;\n\
  \    printf(\"Enter a date (dd-mm-yyyy): \");\n    do {\n        r = scanf(\"%u-%u-%u\"\
  , &day, &month, &year);\n        if (r != 3) printf(\"format: dd-mm-yyyy\\n\");\n\
  \        fflush(stdin);\n    } while (r != 3);\n\n    m = month_name(month);\n \
  \   printf(\"\\nMonth: %s\\n\", m);\n}\n\nchar *month_name(unsigned int mm)\n{\n\
  \    static char *month[] = {\n        \"January\", \"February\", \"March\", \"\
  April\", \"May\", \"June\",\n        \"July\", \"August\", \"September\", \"October\"\
  , \"November\", \"December\"\n    };\n    return ((mm > 0 && mm <= 12) ? month[mm\
  \ - 1] : month[0]);\n}\n```\n\n\n\n\n\n```c\nint ReadString(char str[][CMAX], char\
  \ *pcad[], int nmc);\nvoid Sort(char *pcad[], int nc);\nvoid display(char *pcad[],\
  \ int nc);\n```\n\n`LeerCadena` 函数接收的参数包括：用于存储字符链的矩阵、指向链的指针矩阵，以及数组可以存储的字符串最大数量。该函数将返回读取的字符串数量，如果参数\
  \ `nmc` 的值无效，则返回 `-1`。对于读取的每个字符串，其地址都将存储在指针数组中。当输入新字符串并仅按下 `<Enter>` 键时，输入结束。根据上述描述，该函数可以写为：\n\
  \n```c\nint ReadString(char str[][CMAX], char *pcad[], int nmc)\n{\n    // nmc =\
  \ 我知道可以读取链的最大数量\n    int length = 0, ncads = 0;\n    if (nmc < 1) return -1; //\
  \ error\n    while ((length = strlen(gets(str[ncads]))) > 0)\n    {\n        //\
  \ 保存从读取的链开始的地址\n        // 在指针矩阵的下一个元素 pcad[ncads++] = str[nstrs];\n        if (ncads\
  \ == nmc) break; // 矩阵 full\n    }\n    return (ncads); // 读取的链数量\n}\n```\n\n当输入新字符串并仅按下\
  \ `<Enter>` 键时，变量 `length` 将变为 `0`，从而结束 `while` 循环。\n\n`Sort` 函数接收的参数包括指向字符串的指针数组、字符数量以及需要排序的字符串数量。该函数在前章节的“已解练习”中已经开发并调用（另参见算法章节中的基于冒泡法的排序算法）。该函数的代码如下：\n\
  \n```c\nvoid Sort(char *pcad[], int nc)\n{\n    char *aux = NULL; // 辅助指针\n    int\
  \ i = 0, s = 1;\n    while ((s == 1) && (--nc > 0))\n    {\n        s = 0; // 无交换\n\
  \        for (i = 1; i <= nc; i++)\n        {\n            if (strcmp(pcad[i-1],\
  \ pcad[i]) > 0)\n            {\n                aux = pcad[i-1]; pcad[i-1] = pcad[i];\
  \ pcad[i] = aux;\n                s = 1; // 交换\n            }\n        }\n    }\n\
  }\n```\n\n注意，`while` 循环在遍历数组比较字符串且没有检测到乱序（初始为 `0` 的变量 `s` 将保持为 `0`）时结束；或者，在最坏的情况下，当所有字符串都已完成完毕时结束，这发生在遍历数组\
  \ `nc–1` 次之后。\n\n`display` 函数接收的参数包括指向字符的指针数组及其元素数量，该数量与字符链的数量一致。该函数可以写为：\n\n```c\n\
  void display(char *pcad[], int nc)\n{\n    // nc = 要可视化的链数量\n    while (--nc >=\
  \ 0)\n    printf(\"%s\\n\", *pcad++);\n}\n```\n\n`main` 函数将使用上述函数来执行描述的过程。以下是完整的程序供参考。\n\
  \n```c\n/**************** 字符链排序 *****************/\n/* ordcads.c\n*/\n\n#include\
  \ <stdio.h>\n#include <stdlib.h>\n#include <string.h>\n\n#define NMAX 25 // 链的最大数量\n\
  #define CMAX 81 // 每个链中字符的最大数量\n\nint ReadString(char str[][CMAX], char *pcad[],\
  \ int nmc);\nvoid Sort(char *pcad[], int nc);\nvoid display(char *pcad[], int nc);\n\
  \nmain()\n{\n    char str[NMAX][CMAX]; // 链矩阵\n    char *pcad[NMAX]; // 链指针矩阵\n\
  \    int ncads = 0; // 读取的链数量\n\n    printf(\"Sort from chains from characters.\\\
  n\");\n    printf(\"Enter the strings to sort.\\n\");\n    printf(\"Press <Enter>\
  \ for exit.\\n\");\n\n    if ((ncads = ReadString(str, pcad, NMAX)) > 0)\n    {\n\
  \        printf(\"Strings read %d\\n\", ncads);\n        printf(\"Sort process.\\\
  n\");\n        Sort(pcad, ncads);\n        display(pcad, ncads);\n    }\n    else\n\
  \        printf(\"Array empty\\n\");\n}\n```\n\n\n\n\n在 ANSI C 中，返回值将隐式转换为用于存储该值的变量类型，但在\
  \ C++ 中，这种转换必须显式进行（参见本章中的 `Importance of the type of the object pointed to`）。因此，为了兼容性，建议始终对存储结果的变量类型进行显式转换。如果内存空间不足，`malloc`\
  \ 函数返回一个 `null pointer`（值 `NULL` 或 `0`），且如果 `nbytes` 参数为 `0`，则分配一个大小为 `0` 的内存块并返回一个有效指针。\n\
  \n例如，以下代码行分配了一个 `100` 字节的连续内存块。正如我们在下面将看到的，这个空间无论大多小，都可以用于定位你需要的数据结构。在每个情况下，`malloc`\
  \ 返回的对应于分配内存的地址存储在一个指针中，该指针的类型将取决于存储在该内存块上的数据类型（在示例中为 `int` 类型的数据）。\n\n```c\n#include\
  \ <stdio.h>\n#include <stdlib.h>\n\nint main()\n{\n    int *p = NULL;  // NULL or\
  \ 0\n    int nbytes = 100;\n\n    p = (int *)malloc(nbytes);\n\n    if (p == NULL)\
  \  // p == 0 is equivalent\n    {\n        printf(\"Insufficient space from memory\\\
  n\");\n        return -1;\n    }\n\n    printf(\"If they have assigned %d bytes\
  \ from memory\\n\", nbytes);\n    // ... return 0;\n}\n```\n\n注意，传递给 `malloc` 的参数是内存块的字节大小，它将被动态分配，该块将通过\
  \ `p` 访问。调用 `malloc` 函数后，有必要验证是否成功执行了请求的内存分配。如果 `malloc` 返回值为 `null pointer`（值 `NULL`\
  \ 或 `0`），则意味着无法执行内存分配，在这种情况下，继续执行程序可能没有意义。\n\n![](img/image18659.jpeg)\n\n## free\n\
  \n`free` 函数允许你释放由 `malloc`、`calloc` 或 `realloc` 函数分配的内存块（后两个我们将在下文中看到），但它不会将指针设置为\
  \ `NULL`。如果引用我们要释放的内存块的指针为空，则 `free` 函数什么都不做。其语法如下：\n\n```c\n#include <stdlib.h>\n\
  \nvoid free(void *vpointer);\n```\n\n**兼容性：ANSI, UNIX 和 Windows**\n\n如果 `free` 释放的内存之前没有通过\
  \ `malloc`、`calloc` 或 `realloc` 分配，我知道它们在程序执行期间可能会产生错误。例如，如果我们给指针分配一个静态数组的地址（静态数组是指在编译期间预留内存空间的数组），那么那块内存空间是无法被释放的。\n\
  \n以下示例是上一个的延续。除了分配内存块外，还使用 `free` 函数来释放它。在内存不再需要时释放已分配的内存是一种良好的编程风格。在 Windows 操作系统中，未释放的内存会产生内存间隙或内存泄漏；也就是说，未释放的内存块在不重启机器的情况下将都是不可用的。\n\
  \n```c\n#include <stdio.h>\n#include <stdlib.h>\n\nint main()\n{\n    int *p = NULL;\n\
  \    int nbytes = 100;\n\n    if ((p = (int *)malloc(nbytes)) == NULL)\n    {\n\
  \        printf(\"Insufficient space from memory\\n\"); exit(-1);\n    }\n\n   \
  \ printf(\"If they have assigned %d bytes from memory\\n\", nbytes);\n    // ...\n\
  \n    free(p); return 0;\n}\n```\n\n现在，我们做了一个小小的变化：内存分配被集成在了 `if` 判断语句的条件中。与之前一样，我知道已经完成了一个强制类型转换，将\
  \ `malloc` 返回的 `void *` 类型转换为 `int *`（目标对象的类型）。此外，作为另一种替代方案，使用了 `exit` 函数代替了 `return`\
  \ 语句。`exit` 函数结束程序；而 `return` 语句将控制权返回给调用它的函数；如果 `return` 语句属于 `main` 函数，程序逻辑结束。\n\
  \n### 重新分配内存块\n\n在某些情况下，我们需要更改之前分配的内存块的大小。为了实现这一点，C 库提供了 `realloc` 函数，其语法如下：\n\n\
  ```c\n#include <stdlib.h>\n\nvoid *realloc(void *pBlomem, size_t nBytes);\n```\n\
  \n**兼容性：ANSI, UNIX 和 Windows**\n\n`pBlomem` 参数是指当前内存块起始位置指针。如果 `pBlomem` 为 `NULL`，该函数的行为与\
  \ `malloc` 相同，并分配一个大小为 `nBytes` 的新块。如果 `pBlomem` 为 `NULL` 且有足够的内存扩展该块，`realloc`\
  \ 返回指向新块的指针。如果内存不足，`realloc` 返回 `NULL` 且原始块保持不变。\n\n以下程序显示了如何执行 `realloc`。\n\n```c\n\
  /**************** Function realloc **********/\n/* realloc.c\n*/\n#include <stdio.h>\n\
  #include <stdlib.h>\n#include <string.h>\n\nint main()\n{\n    int *p = NULL,\n\
  \        *q = NULL;\n    int nbytes = 100;\n\n    if ((p = (int *)malloc(nbytes))\
  \ == NULL)\n    {\n        printf(\"Insufficient space from memory\\n\");\n    \
  \    return -1;\n    }\n\n    printf(\"If they have assigned %d bytes from memory\\\
  n\", nbytes);\n    // ...\n    nbytes = nbytes * two;\n    q = realloc(p, nbytes);\n\
  \    if (q == NULL)\n    {\n        printf(\"The reassignment no ha been possible\\\
  n\");\n        printf(\"If preserves the block original\\n\");\n    }\n    else\n\
  \    {\n        p = q;\n        printf(\"Block reallocated\\n\");\n        printf(\"\
  New size %d bytes\\n\", nbytes);\n    }\n    //\n}\n```\n\n## 动态数组\n\n为止现在我们处理的所有矩阵都是静态的。这要求在编写程序代码时就知道矩阵的维度，并将该维度表示为一个全局常量。例如：\n\
  \n```c\n#define NMAX 100\n\n// ...\n\nint m[NMAX];\n```\n\n现在，使用动态分配内存的技术，我们可以在执行期间决定数组包含多少个元素。这些类型的数组被称为动态数组，因为它们是在程序执行期间创建的。与静态数组一样，动态矩阵的元素可以是任何类型。\n\
  \n为了为动态矩阵动态分配内存，更重要的是函数\n\n\n\n\n`malloc`，C 语言库提供了 `calloc` 函数，其语法如下：\n\n```c\n\
  #include <stdlib.h>\n\nvoid *calloc(size_t nelements, size_t tamelem);\n```\n\n\
  兼容性：ANSI，UNIX 和 Windows\n\n第一个参数 `nelements` 指定了数组中元素的个数。第二个参数 `tamelem` 是每个元素的大小（字节数）。`calloc`\
  \ 函数返回一个指向 `void` 的指针，引用分配的内存空间；如果没有请求大小的内存块，则返回 `NULL`。根据此，代码如下：\n\n```c\nint *p\
  \ = NULL;\n\nif ((p = (int*)malloc(100 * sizeof(int))) == NULL)\n{\n    printf(\"\
  Insufficient space from memory\\n\");\n    return -1;\n}\n```\n\n这等同于其他代码：\n\n```c\n\
  int *p = NULL;\n\nif ((p = (int*)calloc(100, sizeof(int))) == NULL)\n{\n    printf(\"\
  Insufficient space from memory\\n\");\n    return -1;\n}\n```\n\n在上面的示例中，两个版本都请求保留一个内存块。这将是\
  \ `100 * sizeof(int)` 个连续字节，或者说包含 100 个 `int` 类型元素的数组。内存空间将继续由 `p` 引用。\n\n### 动态数值数组\n\
  \n要在程序执行期间创建数组，只需声明一个指向数组元素类型对象的变量，并调用之前学习过的 `malloc`、`calloc` 或 `realloc` 任何一个函数。当数组不再需要时，通过调用\
  \ `free` 函数来释放分配的内存空间。\n\n### 一维动态数组\n\n作为一个示例，我们将创建一个创建 `int` 类型均匀动态维度矩阵的程序。相同类型的元素个数将从键盘获取。\n\
  \n```c\n/*************** Matrix dynamic from a dimension }*/\n/* arraydin01.c */\n\
  \n#include <stdio.h>\n#include <stdlib.h>\n// #include <memory.h> // necessary for\
  \ memset\n\nmain()\n{\n    int *m = NULL;\n    int nBytes = 0, Right = 0, nElements\
  \ = 0, i = 0;\n    do\n    {\n        printf(\"Number from elements from the matrix:\
  \ \");\n        correct = scanf(\"%d\", &nItems);\n        fflush(stdin);\n    }\n\
  \    while (!Right || nElements < 1);\n\n    // Memory block size\n    nBytes =\
  \ nElements * sizeof(int);\n\n    if ((m = (int*)malloc(nBytes)) == NULL)\n    {\n\
  \        printf(\"Insufficient space from memory\\n\");\n        return -1;\n  \
  \  }\n\n    printf(\"If they have assigned %or bytes from memory\\n\", nBytes);\n\
  \    // Start the elements from the matrix to 0 for (i = 0; i < nElements; i++)\n\
  \    m[i] = 0;\n\n    // The elements from the matrix they can as well be stalls\n\
  \    // to 0 So:\n    // memset(m, 0, nBytes);\n    // Operations\n    // ...\n\
  \    free(m);\n    return 0;\n}\n```\n\n我们刚刚展示的示例向用户请求矩阵元素的个数。然后，它检查输入的值以确保它是正确的。尝试一个有效值，然后为数组分配内存；是的，赋值是可能的，我可以用值\
  \ 0 初始化矩阵元素。我知道有两种执行操作的方法：使用循环或使用 `memset` 函数。\n\n需要注意的是，你可以使用数组索引 `m[i]` 来访问其元素，这个概念在本文章稍后的部分已经解释过。同样重要的一点是，当你通过指针激活动态数组的元素时，C\
  \ 会以所指对象的类型为引用，为该对象分配相应数量的字节。在我们讨论的示例中，`m` 是一个指向 `int` 的指针，因此 `m[i]` 访问的是等同于 `int`\
  \ 大小（4 字节）的字节数，位置从地址 `m+i` 开始。\n\n### 二维动态数组\n\n为二维数组分配内存，该过程分为两个部分：\n\n*   为指针数组分配内存，其元素将引用我想要创建的二维矩阵中的每一行（from\
  \ the rows）。\n*   为每一行分配内存。每行的元素个数可以是变量。\n\n从图上我们可以，我们必须构建一个如下的结构：(Images/image1860.jpeg)\
  \ `m` (Images/image1861.jpeg) 行 0 (Images/image1862.jpeg) 行 1 (Images/image1863.jpeg)\
  \ 行二 (Images/image1864.jpeg) 行 3 (Images/image1867.jpeg)... 这种结构与二维数组起相同的作用，但有一个优势，即行的长度可以是任意的。如上所述，为了创建指针数组，我们首先必须定义一个指向指针的指针，因为它的元素将是某种类型的对象。例如，如果我们假设对象将是整数，我们将这样声明指针：\n\
  \n```c\nint **m; // pointer reference the matrix from pointers\n```\n\n下一步是为指针数组分配内存。假设二维矩阵的指针数组是\
  \ `nRows * sizeof(int*)`，这等同于分配一个包含 `nRows` 个 `int*` 类型元素的数组。为二维矩阵从指针分配内存，代码如下：\n\
  \n```c\nm = (int**)malloc(nRows * sizeof(int*));\n```\n\n显然，`m` 是指向 `int` 的指针，因此\
  \ `m[i]` 访问的是等同于 `int` 大小（4 字节）的字节数，位置从地址 `m+i` 开始。为每一行分配内存，代码如下：\n\n```c\nfor (i\
  \ = 0; i < nRows; i++)\n{\n    m[i] = (int*)malloc(nCols * sizeof(int));\n    if\
  \ (m[i] == NULL)\n    {\n        printf(\"Insufficient space from memory\\n\");\n\
  \        return -1;\n    }\n}\n```\n\n我们刚刚展示的示例向用户请求矩阵元素的个数。然后，它检查输入的值以确保它是正确的。尝试一个有效值，然后为数组分配内存；是的，赋值是可能的，我可以用值\
  \ 0 初始化矩阵元素。我知道有两种执行操作的方法：使用循环或使用 `memset` 函数。\n\n需要注意的是，你可以使用数组索引 `m[i]` 来访问其元素，这个概念在本文章稍后的部分已经解释过。同样重要的一点是，当你通过指针激活动态数组的元素时，C\
  \ 会以所指对象的类型为引用，为该对象分配相应数量的字节。在我们讨论的示例中，`m` 是一个指向 `int` 的指针，因此 `m[i]` 访问的是等同于 `int`\
  \ 大小（4 字节）的字节数，位置从地址 `m+i` 开始。\n\n\n\n\n\n注意，为了释放数组占用的内存，接后的过程在逻辑上与创建数组的过程是反的；也就是说，我们首先会查看分配给每一行的内存，然后查看分配给指针矩阵的内存。\n\
  \n### 字符链构建的动态数组\n\n字符串的动态数组是一个元素类型为 `char` 的二维数组。因此，它的构建方式与我们之前通过拆分操作完成的二维数组完全相同。\n\
  \n字符链构建的矩阵是一种典型情况，其中每行的元素数量是可变的，这取决于我在每行上存储的字符数量。据此，我们定义一个矩阵 `Name` 如下：\n\n```c\n\
  char name[ROWS_MAX][COLS_MAX];\n```\n\n字符串 `name[0]`、`name[1]` 等的大小是多少？无论为请求的每个名称读取了多少个字符，所有它们的大小都是相同的：`COLS_MAX`\
  \ 个字符；可以使用 `sizeof` 运算符进行验证。显然，这种处理方法浪费了内存空间，这可以通过使数组 `name` 的每行的大小等于存储该 `Name`\
  \ 的字符数（加上一个用于终止的空字符字符）来避免。\n\n让我们将上述理论应用于以下程序。我们写一个示例，创建一个字符字符串的动态数组，分配相应的字符行（在我们的例子中是名称），按字母升序对它们进行排序，最后显示排序后的字符字符串。程序的结构将由主函数以及以下函数组成：\n\
  \n```c\nint ReadStrings(char **name, unsigned nRows); \nvoid SortStrings(char **Name,\
  \ unsigned rows);\nvoid DisplayStrings(char **Name, unsigned rows);\n```\n\n我们将遵循的解决问题的方法如下：\n\
  \n* 我们定义了一个指向一维数组的指针数组，这些数组将成为假设名称 `List` 的行。\n\n```c\nchar **Name = (char **)malloc(nRows\
  \ * sizeof(char *));\n```\n\n我们没有为每个字符串分配内存，因为我们还不知道它的长度。因此，这个过程将与读取每个字符并行进行。\n\n\
  * 我们读取字符字符串。为了能够读取一个字符串，我们需要定义一个名为 `string` 的字符数组。例如，这将长度为 81 个字符的一维矩阵。\n\n```c\n\
  char string[81];\n```\n\n一旦读取了字符串，我们就知道读取了多少字符；然后我们预留内存来存储该数量的字符，假设将预留内存块地址放在空指针数组\
  \ `name` 的下一个元素，并将 `string` 拷贝到分配的新块中。我们将对每个名称重复此过程。\n\n```c\nf = 0;\nwhile (f <\
  \ nRows && (length = strlen(gets(string))) > 0)\n{\n    // 为字符链分配空间\n    if ((name[f]\
  \ = (char *)malloc(length + 1)) == NULL)\n    {\n        printf(\"可用内存空间不足\\n\"\
  );\n        return -1; // 结束过程\n    }\n    // 将链拷贝到分配的内存空间上\n    strcpy(name[f],\
  \ string);\n    f++;\n}\n```\n\n从图上可以想象所描述的过程对应以下数据结构：\n\n![](img/image18668.jpeg)\n\
  ![](img/image18669.jpeg) 链\n![](img/image18670.jpeg) Name\n![](img/image18671.jpeg)\n\
  ![](img/image18672.jpeg)\n![](img/image18673.jpeg) 行 0\n![](img/image18674.jpeg)\
  \ 行 1\n行二\n...\n\n判断 `name[f] = (char *)malloc(length + 1)` 为每个 `f` 的值分配了 `length\
  \ + 1` 个字符的内存空间（在图中：行 0、行 1、行 2 等），用于拷贝通过 `string` 读取的字符串。记住 `strlen` 函数返回链的字符数。\n\
  \n* 每当读取矩阵时，我们都进行可视化，以检查整个过程是否正常进行。\n\n后续的完整示例。\n\n```c\n/*********** 字符链构建的动态矩阵\
  \ ************/\n/* arraydin03.c */\n\n#include <stdio.h>\n#include <stdlib.h>\n\
  #include <string.h>\n\nint ReadStrings(char **name, int nRows);\nvoid SortStrings(char\
  \ **Name, int rows);\nvoid DisplayStrings(char **Name, int rows);\n\nint main()\n\
  {\n    char **Name = NULL;\n    int nRows = 0;\n    int Right = 0, rows = 0, f =\
  \ 0;\n    do\n    {\n        printf(\"数组的行数: \");\n        scanf(\"%d\", &nRows);\n\
  \        fflush(stdin);\n    } while (!Right || nRows < 1);\n\n    // 为指针矩阵分配内存\n\
  \    if ((Name = (char **)malloc(nRows * sizeof(char *))) == NULL)\n    {\n    \
  \    printf(\"内存不足\\n\");\n        return -1;\n    }\n\n    // 操作\n    rows = ReadStrings(Name,\
  \ nRows);\n    if (rows == -1) return -1;\n    SortStrings(Name, rows);\n    DisplayStrings(Name,\
  \ rows);\n\n    // 释放每一行的内存\n    for (f = 0; f < rows; f++)\n        free(Name[f]);\n\
  \n    // 释放矩阵的内存\n    free(Name);\n    return 0;\n}\n\nint ReadStrings(char **name,\
  \ int nRows)\n{\n    int f = 0, length;\n    char string[81];\n    printf(\"读取字符串。\\\
  n\");\n    while (f < nRows && (length = strlen(gets(string))) > 0)\n    {\n   \
  \     // 为字符链分配空间\n        if ((name[f] = (char *)malloc(length + 1)) == NULL)\n\
  \        {\n            printf(\"可用内存空间不足\\n\");\n            return -1; // 结束过程\n\
  \        }\n        // 将链拷贝到分配的内存上\n        strcpy(name[f], string);\n        f++;\n\
  \    }\n    return f;\n}\n\nvoid SortStrings(char **Name, int rows)\n{\n    char\
  \ *temp;\n    int i, j;\n    for (i = 0; i < rows - 1; i++)\n    {\n        for\
  \ (j = i + 1; j < rows; j++)\n        {\n            if (strcmp(Name[i], Name[j])\
  \ > 0)\n            {\n                temp = Name[i];\n                Name[i]\
  \ = Name[j];\n                Name[j] = temp;\n            }\n        }\n    }\n\
  }\n\nvoid DisplayStrings(char **Name, int rows)\n{\n    int f;\n    for (f = 0;\
  \ f < rows; f++)\n        printf(\"%s\\n\", Name[f]);\n}\n```\n\n执行程序：\n数组的行数: 3\n\
  读取字符串。\n读取链 null。 This is, <Enter>.\nApple\nBanana\nCherry\nApple\nBanana\nCherry\n\
  \n\n\n\n注意 `date` 结构体类型已经在开头声明，在任何函数之前，它的作用是什么。它允许你在任何地方使用它。\n\n另一个重要的细节是理解：声明一个结构体指针的简单并不意味着我们拥有了该结构体；有必要为指针分配一块与结构体大小相同的内存块，用于存储相同类型的数据（这一概念适用于任何类型的对象）。也就是说，以下语句创建了一个指向结构体的指针，而不是结构体本身。\n\
  \n```c\nstructure date *today;\n```\n\n![](img/image18675.jpeg)\n\n这样做的话，运行判断将会报错。为什么呢：\n\
  \n```c\nscanf(\"%u-%u-%u\", &today->dd, &today->mm, &today->yy);\n```\n\n因为 `dd`、`mm`\
  \ 和 `yy` 属于哪个结构体？答案是：无，指针 `today` 没有被分配结构体。如果在声明指针时将其初始化为 `NULL`，那么就没有地方可以存放指向结构体的指针了：\n\
  \n```c\nstructure date *today = NULL;\n```\n\n是的，如果我们执行了如下语句，将会如何：\n\n```c\nstructure\
