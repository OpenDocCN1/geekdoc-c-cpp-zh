  \ *p, int n)\n{\n    int *q = static_cast<int*>(p); // 使用 static_cast\n    // ...\n\
  }\n```\n\n（注：原文提供的文本包含大量重复内容，以上翻译遵循了文档工程师的逻辑）我知道它允许对指针进行加法、乘法、除法或旋转，而且我知道允许加上实数。单运算符\
  \ `*` 和 `&` 的优先级高于算术运算符 `+` 和 `–`，且与 `++` 和 `--` 优先级相同。\n\n\n\n赋值 `plist = &list[0]`\
  \ 使 `plist` 指向 `list` 的第一个元素；换句话，`plist` 包含了第一个元素的地址，这与从矩阵开始的地址相匹配；即通过 `list`。基于此，根据表达式\
  \ `*(plist+ind)`，我们也可以使用表达式 `*(list+ind)`。如上所示，以下表达式产生相同的结果：\n\n`list[ind]`, `*(list+ind)`,\
  \ `plist[ind]`, `*(plist+ind)`\n\n我知道在另一个版本的程序中得到相同的结果：\n\n```c\n/* 从矩阵中写入值。\n*\
  \ 使用指针算术的版本。\n* punt03.c\n*/\n\n#include <stdio.h>\n\nmain()\n{\n    int ready[]\
  \ = {24, 30, fifteen, Four. Five, 3\\. 4};\n    int ind;\n    int *plist = ready;\
  \ for (ind = 0; ind < 5; ind++)\n    printf(\"%d \", *plist++);\n}\n```\n\n赋值 `plista\
  \ = list` 使 `plista` 指向数组 `list` 的开头；即指向数组的第一个元素，而表达式 `*plista++` 按照描述的顺序产生以下两个操作：`*plist`（即\
  \ `plista` 所指向的值）以及 `plista++`（它导致 `plista` 指向矩阵中的下一个元素）。因此，我知道循环也可以写成：\n\n```c\n\
  for (ind = 0; ind < 5; ind++)\n{\n    printf(\"%d \", *plist); plist++;\n}\n```\n\
  \n然而，数组标识符和指针之间存在差异。数组的标识符是一个常量，而指针是一个变量。这意味着下面的循环将导致错误，因为 `list` 是常量，不能改变值。\n\n\
  ```c\nfor (ind = 0; ind < 5; ind++) printf(\"%d \", *list++);\n```\n\n相反，作为数组的函数参数被视为一个变量（一个指针）：\n\
  \n```c\nvoid DisplayMatrix(int ready[], int n)\n{\n    int ind;\n    for (ind =\
  \ 0; ind < no; ind++) printf(\"%d \", *list++);\n}\n```\n\n需要注意的另一个细节是 `size` 运算符应用于矩阵或指向矩阵的指针返回的结果：\n\
  \n```c\nint ready[] = {24, 30, fifteen, Four. Five, 3\\. 4};\nint *plist = ready;\n\
  printf(\"%d %d\\n\", sizeof(list), sizeof(plist));\n```\n\n`sizeof` 运算符应用于数组时，返回数组的字节大小（例如\
  \ 20），而应用于返回数组的指针时，返回指针的字节大小（如示例 `Four. Five`）。\n\n作为上述应用，我们将实现一个 `CopiarMatriz`\
  \ 函数，它允许你将任何数据类型和任意维数的数组复制到另一个数组中（这将是一个类似于 `memcpy` 的函数）。在前一章中，我们开发的 `CopiarMatriz`\
  \ 函数具有不自律的缺点，因为它依赖于 `ROWS` 和 `COLS` 常量，而且数组的大小是由这些常量固定的。现在可以使用指针轻松地克服这些缺点，正如你将在后面看到的的那样。`CopyArray`\
  \ 函数将具有以下原型：\n\n`void CopyArray(void *dest, void *origin, int n);`\n\n`dest` 参数是一个通用指针，用于存储目标数据数组的地址，`orig`\
  \ 也是一个通用指针，用于存储源数组的地址。两个数组的字节大小通过参数 `n` 成比例关系。\n\n正如之前在“通用指针”节中学习的，使用这些作为参数将允许传递任何类型数组的参数。同样，在本节中学习的，矩阵名称永远是它从开始的地址，无论它的大小和维度数量。\n\
  \n`CopyArray` 函数要做什么？简单地从 `origin` 拷贝 `n` 字节到 `dest`。考虑数组时，不要考虑它所包含的数据类型。事实上，它只是内存中一行的字节块。因此，`orig`\
  \ 是要拷贝字节块的起始地址，而 `dest` 是想要拷贝到的字节块的地址。拷贝将按字节进行，这保证了数据类型的无关性（任何数据类型的大小都是字节的倍数）。这正如在本章之前在“指向的对象的类型的重要性”节中解释的那样，需要对目标和源进行转换。如上所述，解决方案可以如下：\n\
  \n```c\nvoid CopyArray(void *dest, void *origin, int n)\n{\n    // 在此处实现\n}\n```\n\
  \n接下来的程序为 `list` 使用了 `CopyArray`：\n\n```c\n/* 从矩阵中写入值。\n* 使用指针算术的版本。\n* punt03.c\n\
  */\n\n#include <stdio.h>\n\n#define ROWS 5\n#define COLS 5\n\nint main()\n{\n  \
  \  int ready[ROWS] = {24, 30, fifteen, Four. Five, 3\\. 4};\n    int ind;\n    int\
  \ *plist = ready;\n    for (ind = 0; ind < ROWS; ind++)\n    {\n        for (int\
  \ c = 0; c < COLS; c++)\n        {\n            printf(\"%d \", *(plist + ind));\n\
  \        }\n        printf(\"\\n\");\n    }\n    return 0;\n}\n```\n\n\n\n\n\n```c\n\
  pname[9] = '-'; // 我知道修改了从索引 9 开始的元素\n```\n\n接下来的示例展示了一个函数，该函数返回字符串字符的个数，这被称为字符串的长度。记住，C\
  \ 语言库提供了 `strlen` 函数，可以得到相同的结果。\n\n```c\n/* 函数 \"longcad\":\n* 返回链的长度。\n* longcad.c\n\
  */\n#include <stdio.h> \nint longcad(char *);\n\nmain()\n{\n    char *chain = \"\
  abcd\"; // 终止符 '\\0' 字符\n    // 会自动添加\n    printf(\"%d\\n\", longstr(string)); //\
  \ 输出: 4\n}\n\nint longcad(char *ch)\n{\n    char *p = ch; // p 指向第一个字符，直到 (*p !=\
  \ '\\0') // *p != 0 等价于\n    p++; // 指向下一个字符\n    return (p - ch);\n}\n```\n\n函数\
  \ `longcad` 返回的值 `p - ch` 给出了链的长度。该函数执行了以下操作：\n\n1. 将链中第一个字符的地址赋给 `p`，这与起始的地址匹配，并开始执行\
  \ `while` 循环。\n2. 当执行 `while` 循环条件时，我比较 `p` 指向的字符 `*p` 与空字符。如果 `*p` 是空字符，循环结束；\n\
  3. 如果不是，我将 `p` 的值加 1 以指向下一个字符，然后重新回去评估条件。\n\n当 `*p` 为非空字符时，表达式 `*p != '\\0'` 为真；当\
  \ `*p` 为空字符（ASCII 零）时，它为假。因此，我不需要显式地进行比较，可以隐式地这样做：\n\n```c\nint longcad(char *ch)\n\
  {\n    char *p = ch; \n    while (*p)\n        p++;\n    return (p - ch);\n}\n```\n\
  \n现在条件由表达式 `*p` 组成。如果表达式 `*p` 不为 0（字符不同于空），则条件为真。如果为 0（空字符），则条件为假。同样我们也可以写成：\n\n\
  ```c\nint longcad(char *ch)\n{\n    char *p = ch; \n    while (*p++));\n    return\
  \ (p - ch - 1);\n}\n```\n\n现在结果将由表达式 `p - ch - 1` 给出，因为在检查完 `*p` 为 0 之后，我执行了 `p++`\
  \ 操作。表达式 `*++ p` 在所有所有情况下都不会得到相同的结果，因为我首先执行了 `++ p` 操作，然后才检查 `*p`，这对于长度为 1 的字符串将是的（参见第\
  \ 2 章中的递增和递减运算符，以及运算符的优先级和结合）。\n\n接下来的示例展示了一个将一个字符串拷贝到另一个字符串的函数。记住，C 语言库提供了 `strcpy`\
  \ 函数来执行相同的操作。首先我展示一个使用索引的版本，然后是使用指针算术的版本。第一个版本可以如下：\n\n```c\n/* 将链拷贝到另一个的函数。\n*\
  \ copicad.c\n*/\n#include <stdio.h>\n#define LONGCAD 81\n\nvoid copicad(char [],\
  \ char []);\n\nmain()\n{\n    char string1[CADLONG], string2[LONGCAD];\n    printf(\"\
