  \n```c\n#include <math.h>\ndouble so(double x);\n```\n兼容性：ANSI, UNIX 和 Windows\n\
  \n### cosh\n`cosh` 函数给出 $x$（$x$ 为弧度）的双曲余弦值。\n\n```c\n#include <math.h>\ndouble cosh(double\
  \ x);\n```\n兼容性：ANSI, UNIX 和 Windows\n\n### sinh\n`sin` 函数给出 $x$（$x$ 为弧度）的双曲正弦值。\n\
  \n```c\n#include <math.h>\ndouble sinh(double x);\n```\n兼容性：ANSI, UNIX 和 Windows\n\
