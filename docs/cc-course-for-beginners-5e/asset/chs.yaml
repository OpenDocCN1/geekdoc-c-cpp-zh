  \ 函数获取的从 1970 年 1 月 1 日 0 小时开始经过的秒数转换为相应的日期和小时（根据本地时区进行小时级修正）。结果存储在在 `time.h` 中定义的类型\
  \ `tm` 的结构体中。\n\n```c\n#include <time.h>\n\nstruct tm *localtime(const time_t *sec);\
  \ own```\n**兼容性：** ANSI、UNIX 和 Windows。\n\n`localtime` 函数返回一个指向包含转换后内容的结构体的指针，或者返回空指针（如果结果无法解释）。该结构体的成员如下：\n\
  \n![](img/image18459.jpeg)\n\n| 字段 | 存储的值 |\n| :--- | :--- |\n| `tm_sec` | 秒 (0\
  \ - 59) |\n| `tm_min` | 分钟 (0 - 59) |\n| `tm_hour` | 小时 (0 - 23) |\n| `tm_mday`\
  \ | 月中的日期 (1 - 31) |\n| `tm_mon` | 月份 (0 - 11；1 月 = 0) |\n| `tm_year` | 年（当前年份减\
  \ 1900） |\n| `tm_wday` | 星期几 (0 - 6；星期日 = 0) |\n\n![](img/image18459.jpeg) `tm_yday`\
  \ | 年中的第几天 (0 - 365；1 月 1 日 = 0)。\n\n下面的示例了如何使用此函数。\n\n```c\n/* localtime.c */\n\
  #include <stdio.h>\n#include <time.h>\n\nmain() {\n    struct tm *fh;\n    time_t\
  \ seconds;\n    time(&seconds);\n    fh = localtime(&seconds);\n    printf(\"%d\
  \ hours, %d minutes\\n\", fh->tm_hour, fh->tm_min);\n}\n```\n\n`localtime` 函数使用\
  \ `static` 类型结构体 `tm` 来执行转换，返回的是该变量的地址。\n\n### 处理内存块的函数\n\nC/C++ 库提供了一组操作内存中连续字节块的函数。下面将讨论最常用的几个。\n\
  \n### memset\n\n`memset` 函数用于初始化内存块。\n\n```c\n#include <string.h>\n\nvoid *memset(void\
  \ * destiny, int b, size_t nbytes);\n```\n**兼容性：** ANSI、UNIX 和 Windows。\n\n参数 `destination`\
  \ 是要初始化的内存块的地址。`b` 是用于填充块中每个字节的值，`nbytes` 是块中要初始化的字节数。例如，以下代码将矩阵初始化为 0：\n\n```c\n\
  double a[10][10];\n// ...\nmemset(a, 0, sizeof(a));\n```\n\n### memcpy\n\n`memcpy`\
  \ 函数将一个内存块拷贝到另一个内存块。\n\n```c\n#include <string.h>\n\nvoid *memcpy(void * destiny,\
  \ build void * origin, size_t nbytes);\n```\n**兼容性：** ANSI、UNIX 和 Windows。\n\n参数\
  \ `destination` 是数据目标内存块的地址。`origin` 是数据源内存块的地址，`nbytes` 是从源拷贝到目的的字节数。例如，以下代码将矩阵拷贝到\
  \ b 中：\n\n```cpp\ndouble to[10][10], b[10][10];\n// ...\nmemcpy(b, to, sizeof(a));\n\
  ```\n\n### memcmp\n\n`memcmp` 函数逐字节地比较两个内存块。\n\n```c\n#include <string.h>\n\nint\
  \ memcmp(void * bm1, build void * bm2, size_t nbytes);\n```\n**兼容性：** ANSI、UNIX\
  \ 和 Windows。\n\n参数 `bm1` 和 `bm2` 是要比较的内存块地址，`nbytes` 是要比较的字节数。该函数返回的结果与 `strcmp`\
  \ 相同。例如，以下代码比较矩阵 a 和 b：\n\n```cpp\ndouble to[10][10], b[10][10];\n// ...\nif (memcmp(a,\
  \ b, sizeof(a)) == 0)\n    printf(\"The arrays are equal\\n\");\nelse\n    printf(\"\
  The arrays are not equal\\n\");\n```\n\n#### 附录 B. 环境开发\n\n![](img/image1875.jpeg)\n\
