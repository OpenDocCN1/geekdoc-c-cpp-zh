  \n# 决策与重复\n\n## If 语句\n例如，在上一章中，当我们计算二次方程的根时，我们看到根据判别式的值，根可能是实数也可能是复数。在这种情况下，程序本身需要根据判别式的值来决定你需要计算的是两个实根还是两个共轭复根。\n\
  \n同样，在很多情况下，我们需要执行某一组语句若干次，直到满足某个条件。例如，在上一章中，我们学习了如何从标准输入读取一个字符。但如果我们想读取的不是一个字符，而是我们在键盘上输入的所有内容，直到检测到文件结束标记，我们就需要使用重复语句。\n\
  \n在本章中，你将学习如何编写代码使程序能够做出，并能够重复运行某些语句块。\n\n### if 判断语句\n`if` 判断允许程序根据表达式的真或假结果来决定执行某个动作或另一个动作。该语句的语法如下：\n\
  \n```c\nif ( condition )\nstatement 1 ; \nelse\nstatement 2 ];\n```\n\n其中 `condition`\
  \ 是一个数值、关系或逻辑表达式，`statement 1` 和 `statement 2` 代表一个简单语句或复合语句。每条语句必须以分号（.）结束。\n\n\
  `if` 判断按照以下形式运行：\n\n1. 它求值 `condition`。\n2. 如果条件的评估结果为真（结果不为 0），将执行 `statement 1`\
  \ 指定的语句。\n3. 如果条件的评估结果为假（结果为 0），且指定了 `else` 子句，则执行 `statement 2` 指定的语句。\n4. 如果条件的评估结果为假且省略了\
  \ `else` 子句，则忽略 `statement 1`。\n5. 在任何情况下，执行都会继续进行后续可执行的判断。\n\n以下是一些简单的示例，供你直观地理解\
  \ `if` 语句是如何使用的：\n\n```c\nif (x) /* 是否等同于 if (x != 0) */ b = a / x;\nb = b + 1;\n\
  ```\n\n在这个例子中，条件是由数值表达式 `x` 设定的。那么，如果表达式为真（`x` 不为 0），将执行 `b = a / x`（替换了通用格式中的 statement\
  \ 1）；如果表达式为假（`x` 等于 0），则不执行。无论何种情况，执行都会继续下一行 `b = b + 1`。让我们来看另一个例子：\n\n```c\nif\
  \ (a < b) c = c + 1;\n// 程序后续行\n```\n\n在另一个例子中，条件是由关系表达式设定的。如果在评估条件时满足 `a` 小于 `b`，则执行语句\
  \ `c = c + 1`。否则，即 `a` 大于或等于 `b`，则继续后续，忽略判断 `c = c + 1`。\n\n在接下来的例子中，条件是由逻辑表达式设定的。如果在评估条件时满足\
  \ `a` 和 `b` 均不为 0，则运行判断 `x = i`。其他情况下，忽略判断 `x = i`，继续执行下一行。\n\n```c\nif (a && b)\
  \ x = i;\n// 程序后续行\n```\n\n在下一个例子中，如果 `a` 等于 `b * 5` 为真，则执行语句 `x = 4` 和 `a = a +\
  \ x`。否则，执行语句 `b = 0`。在两种情况下，执行都会继续进行到程序的下一行。\n\n```c\nif (a == b * 5)\n{\n    x\
  \ = 4;\n    a = a + x;\n}\nelse\n    b = 0;\n// 程序后续行\n```\n\n一个典型的错误是没有使用上一个例子中的条件而使用了以下内容：\n\
  \n```c\nif (a = b * 5)\n// ...\n```\n在上面的代码中，执行了赋值 `a = b * 5`，并将结果用作条件。\n\n## 嵌套\
  \ if 语句\n一个典型的错误是没有使用上一个例子中的条件而使用了以下内容：\n\n```c\nif (a = b * 5)\n// ...\n```\n在上面的代码中，执行了赋值\
  \ `a = b * 5`，并将结果用作条件。\n\n### 嵌套 if\n观察 `if` 语句，产生了一个问题：哪个 `else` 属于哪个 `if`？\n\n\
  ```c\nif ( condition 1 )\n{\n    if ( condition 2 )\n        statement 1 ;\n}\n\
  else\n    statement 2 ;\n```\n\n在上面的示例中，`else` 与第一个 `if` 配对。在评估条件时，它们指示下表：\n\n|\
  \ condition 1 | condition 2 | result |\n|---|---|---|\n| T | T | statement 1 |\n\
  | T | F | - |\n| F | - | statement 2 |\n\n| 等 | - | - |\n\n如果我们想让 `else` 属于第二个 `if`，我们必须正确地嵌套：\n\
  \n```c\nif ( condition 1 )\n{\n    if ( condition 2 )\n        statement 1 ;\n \
  \   else\n        statement 2 ;\n}\n```\n\n在这种情况下，`else` 与第二个 `if` 配对。在评估条件时，它们指示下表：\n\
  \n| condition 1 | condition 2 | result |\n|---|---|---|\n| T | T | statement 1 |\n\
  | T | F | statement 2 |\n| F | - | - |\n\n规则是 `else` 与最近的、且没有 `else` 的 `if` 关联。这被称为“悬空\
  \ else”（dangling else）问题。为了避免歧，最佳实践是使用括号 `{}`。\n\n```c\nif ( condition 1 )\n{\n\
  \    if ( condition 2 )\n        statement 1 ;\n    else\n        statement 2 ;\n\
  }\nelse\n    statement 3 ;\n```\n\n例如，可以观察到下面的程序段，它写入一条消息显示数字 `a` 与另一个数字 `b` 的比较结果（大于、小于或相等）：\n\
  \n```c\nif (a > b)\n    printf(\"%d is higher than %d\\n\", a, b);\nelse if (a <\
  \ b)\n    printf(\"%d is less than %d\\n\", a, b);\nelse\n    printf(\"%d is same\
  \ as %d\\n\", a, b);\n// 继续执行\n```\n\n需要注意的是，一旦在评估设定条件后执行了某个动作，程序的执行将继续到下一行，进入嵌套\
  \ `if ... else` 语句产生的结构。在之前的例子中，如果 `a` 不等于 0，执行将继续到程序的下一行：\n\n```c\nif (a == 0)\n\
  \    if (b != 0)\n        s = s + b;\n    else\n        s = s + to;\n```\n\n\n\n\
  \n\n作为对所阐理论的练习，我们将执行一个应用，找出三个数字 `a`、`b` 和 `c` 中的最小值。处理方法是每个数字仅与另外两个数字比较一次。只需阅读代码以理解我所知道的内容就足够理解接下来的过程。\n\
  \n```c\n/*************** 获取三个数中 a, b 和 c 的最小值 ****************/\n/* minor.c */\n\
  \n#include <stdio.h>\n\nmain()\n{\n    float a, b, c, less;\n    printf(\"Numbers\
  \ abc : \"); scanf(\"%g %g %g\", &a, &b, &c);\n\n    if (a < b)\n        if (a <\
  \ c)\n            less = a;\n        else\n            less = c;\n    else\n   \
  \     if (b < c)\n            less = b;\n        else\n            less = c;\n\n\
  \    printf(\"Less = %g\\n\", less);\n}\n```\n\n运行程序：\nNumbers a b c : 25.84 -3.1\
  \ 18\nLess = -3.1\n\n### else if 结构\n\n下面显示的结构非常常见，并被单独处理。该结构是嵌套 `if` 语句的结果。你的整体格式如下：\n\
  \n```c\nif ( condition 1 )\n    judgment 1;\nelse if ( condition 2 )\n    judgment\
  \ 2;\nelse if ( condition 3 )\n    judgment 3;\n...\nelse\n    judgment n;\n```\n\
  \n该结构的评估过程如下：如果满足 `condition 1`，则执行 `statement 1`；如果不满足，则按顺序检查条件，直到最后一个 `else`，运行与第一个条件为真的\
  \ `else if` 对应的 `judgment`。如果所有条件都为假，则执行与最后一个 `else` 对应的第 `n` 句语句。在任何情况下，它都会从该结构后的第一个可执行语句继续执行。语句\
  \ `1`、`2`、...`n` 可以是简单语句也可以是复合语句。\n\n例如，在某商店购物时，如果我们购买的同种商品数量超过 100 件，他们会给予我们 40%\
  \ 的折扣；25 到 100 件之间为 20%；10 到 24 件之间为 10%；购买少于 10 件则没有折扣。你被计算支付金额。解决方案将采取如下形式：\n\n\
  | 代码文章 | 111 |\n| :--- | :--- |\n| 购买数量 | 100 |\n| 单价 | 100 |\n\n| 商品 | 数量 | 单价\
  \ | 折扣 | 总计 |\n|---|---|---|---|---|\n| 111 | 100 | 100.00 | 二 20% | 8000.00 |\n\
  \n在所给出的示例解决方案中可以看出，由于购买数量在 25 到 100 之间，因此适用的折扣为 20%。\n\n以下问题的解决方案可以采用以下形状：\n\n*\
  \ 首先，我们定义将在计算中使用的变量：\n  `int ar, cc; float wow, dec;`\n* 继续读取数据 `ar`、`DC` 和 `pu`：\n\
  \  `printf(\"Code Article.             \"); scanf(\"%d\", &ar);`\n  `printf(\"Amount\
  \ bought             \"); scanf(\"%d\", &DC);`\n  `printf(\"Price unitary.     \
  \        \"); scanf(\"%f\", &pu);`\n* 知道数据后，我们进行计算并写入结果。这需要先编写示例解决方案所示的头部和读取的数据：\n\
  \n```c\nprintf(\"\\n\\n%10s %10s %10s %10s %10s\\n\\n\", \"Article\", \"Quantity\"\
  , \"P. OR.\", \"Disc.\", \"Total\");\nprintf(\"%10d %10d %10.2f\", ar, DC, pu);\n\
  \nif (DC > 100)\n    printf(\"  %9d%% %10.2f\\n\", 40, DC * pu * 0.6);\nelse if\
  \ (DC >= 25)\n    printf(\"  %9d%% %10.2f\\n\", 20, DC * pu * 0.8);\nelse if (DC\
  \ >= 10)\n    printf(\"  %9d%% %10.2f\\n\", 10, DC * pu * 0.9);\nelse\n    printf(\"\
  \  %10s %10.2f\\n\", \"--\", DC * pu);\n```\n\n可以看出，条件是根据折扣从大到小建立的。作为一个练习，思考或测试一下如果按照折扣从低到高的顺序设置条件会发生什么。完整的程序样本所示。\n\
  \n```c\n/** 根据购买数量计算支付金额的函数 ***/\n/* else_if.c */\n\n#include <stdio.h>\n\nmain()\n\
  {\n    int ar, DC; /* 代码和数量 */\n    float pu; /* 单价 */\n\n    printf(\"Code item\
  \             \");\n    scanf(\"%d\", &ar);\n    printf(\"Amount bought.       \
  \      \");\n    scanf(\"%d\", &DC);\n    printf(\"Price unitary.             \"\
  );\n    scanf(\"%f\", &pu);\n\n    printf(\"\\n\\n%10s %10s %10s %10s %10s\\n\\\
  n\", \"Article\", \"Quantity\", \"P. OR.\", \"Disc.\", \"Total\");\n    printf(\"\
  %10d %10d %10.2f\", ar, DC, pu);\n\n    if (DC > 100)\n        printf(\"  %9d%%\
  \ %10.2f\\n\", 40, DC * pu * 0.6);\n    else if (DC >= 25)\n        printf(\"  %9d%%\
  \ %10.2f\\n\", 20, DC * pu * 0.8);\n    else if (DC >= 10)\n        printf(\"  %9d%%\
  \ %10.2f\\n\", 10, DC * pu * 0.9);\n    else\n        printf(\"  %10s %10.2f\\n\"\
  , \"--\", DC * pu);\n}\n```\n\n### SWITCH 语句\n\n`switch` 语句允许根据表达式的值执行多个操作。语法如下：\n\
  \n```c\nswitch (expression) {\n    case constant1:\n        statement 1;\n    case\
  \ constant2:\n        statement 2;\n    case constant3:\n        statement 3;\n\
  ...\n    default:\n        statement n;\n}\n```\n\n该结构的评估过程如下：`switch` 语句计算括号内的表达式并与每个\
  \ `case` 的常量进行比较。找到匹配项后，执行从相应的 `case` 开始直到遇到 `break` 语句或块结束。如果没有常量匹配表达式的值，则执行 `default`\
  \ 后面的语句（如果指定了该语句）。\n\n在 `switch` 语句中，可以在每个 `case` 块中进行声明，只要使用大括号 `{}` 来界定该块，也可以在\
  \ `switch` 块的开头、第一个 `case` 之前；然而，在后一种情况下初始化（声明）将被忽略。`default` 子可以放置在块的任何位置，不需要在末尾。\n\
  \n为了说明 `switch` 语句，我们将编写一个读取两个整数（月份和年份）表示日期的程序，并按月份输出天数。如下：\n\n引入月份 (##) 和年份 (####):\
  \ 5 2014\n2014 年的 5 月有 31 天\n\n\n\n\n来自 East 问题的解决方案可以如下所示：\n\n* 首次，我们定义计算中将使用的变量。\n\
  \n```c\nint dd = 0, hmm = 0, aa = 0;\n```\n\n* 持续读取月份（mm`）和年份（aa`）。\n\n```c\nprintf(\"\
  Enter month (##) and year (####): \"); scanf(\"%d %d\", &mm, &yy);\n```\n\n* 然后，我们将月份与常量\
  \ 1, 2, ..., 12 进行比较。如果月份是 1, 3, 5, 7, 8, 10 或 12，我们将天数赋值为 31。如果月份是 4, 6, 9 或 11，我们将天数赋值为\
  \ 30。如果月份是 2，我们将检查年份是否为闰年，如果是闰年，则天数赋值为 29；如果不是闰年，则赋值为 28。如果月份不是上述任何值，我们将向用户发送消息，指示该月份无效。我们将使用\
  \ `switch` 语句执行所有这些过程。\n\n```c\nswitch (mm)\n{case 1: case 3: case 5: case 7: case\
  \ 8: case 10: case 12:\ndd = 31; break;\ncase 4: case 6: case 9: eleven:\ndd = 30;\
  \ break;\ncase two:\n// Is the year leap?\nif ((yy % 4 == 0) && (yy % 100 != 0)\
  \ || (yy % 400 == 0))\ndd = 29; else\ndd = 28; break;\ndefault:\nprintf(\"\\nThe\
  \ month no is valid\\n\"); break;\n}\n```\n\n当常量与 `mm` 的值匹配时，将执行后面指定的语句，遵循程序的执行顺序。通过后续\
  \ `case` 子句的块进行执行，除非采取显式操作离开 `switch` 语句的块。这正是判断语句 `break` 到每个块 case 末尾的精确功能。\n\n\
  * 最后，如果月份是有效的，我们就写出请求的结果。\n\n```c\nif (month >= 1 && month <= 12)\nprintf(\"\\nThe\
  \ month %d the year %d have %d days\\n\",mm,yy,dd);\n```\n\n程序完整的已知示例以持续：\n\n```c\n\
  /******* Days corresponding to a month from a year dice ******\n/*  switch.c\n*/\n\
  #include <stdio.h>\n\nmain()\n{\nint dd = 0, hmm = 0, aa = 0;\nprintf(\"Enter month\
  \ (##) and year (####): \"); scanf(\"%d %d\", hmmm, &aa);\nswitch (mm)\n{\ncase\
