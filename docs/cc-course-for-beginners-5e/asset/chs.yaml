  \n\n\n现在让我们修改之前的示例以消除无限循环。这可以通过在 `while` 语句中包含一个终止条件来实现；例如，读取数据直到到达文件结束标记（end-of-file）。请记住，对于标准输入流，该标记在按下键时发生。在\
