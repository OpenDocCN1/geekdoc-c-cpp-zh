  \ 语句\n\n`do`...while` 语句运行一个语句（简单或复合），执行一次或多次，取决于表达式的值。它的语法如下：\n\n```\ndo\nstatement\
  \ ;\nwhile ( condition );\n```\n\n其中 `condition` 是任何数值、关系或逻辑表达式，而 `statement` 是简单语句或复合语句。我注意到\
  \ `do`...`while` 结构以分号结束结束。\n\n`do...while` 语句的执行遵循以下形状：\n\n1. 我运行 `do` 块（简单或复合语句）。\n\
  2. 我评估结束时对应的 `condition` 表达式。\n3. 如果评估结果为 0（假），我知道控制转移到程序中的后续语句。\n4. 如果评估结果不为 0（真），过程从第\
  \ 1 点开始重复。\n\n例如，以下代码强制用户输入一个正值：\n\n```c\ndouble n;\ndo // 运行\n{\n    printf(\"\
  Number: \");\n    scanf(\"%lf\", &n);\n}\nwhile (n < 0); // 当 n 小于 0 时\n```\n\n\
  当我使用 `do...while` 结构，语句至少运行一次，因为条件是最后评估的。相反，当执行 `while` 结构时，语句可能根本没有被执行。\n\n\n\n\
  \n\n```c\nprintf(\"Root  square  approximate:  \");  scanf(\"%lf\", &approx);  printf(\"\
  Error coefficient: \");  scanf(\"%lf\",  &epsilon);\n```\n\n- 然后，我应用 `Newton` 的公式。\n\
  \n```c\ndo\n{\nantaprox  =  approx;\napprox  =  (n/antaprox  +  antaprox)  /  two;\n\
  }\nwhile  (fabs(approx  -  antaprox)  >= epsilon);\n```\n\n第一次应用公式时，变量 `antaprox`\
  \ 包含通过键盘输入的近似平方根的值。后续，`antaprox` 将包含上一次计算的近似值。\n\n- 当上所示 `do ... while` 结构中指定的条件为假时，过程结束。剩下的只需要打印结果。\n\
  \n```c\nprintf(\"The  root  square  from  %.2lf  is  %.2lf\\n\",  no,  approx);\n\
  ```\n\n完整的程序如所示。为了防止输入负数，使用了一个 `do ... while` 结构，当插入的值为负数时，它会根据请求的值进行询问。\n\n```c\n\
  /******  Root  square  from  a  number.  Method  from  Newton  ******/\n\n/*  Doc\n\
  */\n\n#include  <stdio.h> #include  <math.h>\n\nmain()\n{\ndouble  no; //  number\n\
  double  approx; //  approach  to  the  root  square\ndouble  antaprox;  //  previous\
  \  approach  to  the  root  square  double  epsilon;  //  coefficient  from  error\n\
  \ndo\n{\nprintf(\"Number:  \");\nscanf(\"%lf\",  &n);\n}\nwhile  (  n  <  0  );\n\
  \ndo\n{\nprintf(\"Root  square  approximate:  \");  scanf(\"%lf\",  &approx);\n\
  }\nwhile  (  approx  <=  0  );\n\ndo\n{\nprintf(\"Coefficient  from  error:  \"\
  );  scanf(\"%lf\",  &epsilon);\n}\nwhile  (  epsilon  <=  0  );\n\ndo\n{\nantaprox\
  \  =  approx;\napprox  =  (n/antaprox  +  antaprox)  /  two;\n}\nwhile  (fabs(approx\
  \  -  antaprox)  >= epsilon);\n\nprintf(\"The  root  square  from  %.2lf  is  %.2lf\\\
  n\",  no,  approx);\n}\n```\n\n是的，运行 `n` 等于 10 的程序，将得到以下解：\n\nNumber: 10\nRoot square\
  \ approximate: 1  Coefficient from error: 1e-4\nThe root square from 10.00 is 3.16\n\
  \n### 语句判断\n\n`for` 语句允许你重复执行一个简单或复合语句，执行次数次数的。其语法如下：\n\n`for ([ v1=e1  [,  v2=e2\
  \ ]...];[ condition ];[ progression-condition ]) sentence ;`\n\n- `v1`, `v2`, `...`\
  \ 代表控制变量，它们将用表达式 `e1`, `e2`, `...` 中的值进行初始化；\n- `condition` 是一个布尔表达式，虽然我知道可以省略，但我知道它应该是为真；\n\
  - `condition-progress` 是一个或多个用逗号分隔的表达式，其值不断演变，作为完成 `for` 语句执行的条件；\n- `judgment`\
  \ 是一个简单或复合判断。\n\n`for` 语句的执行遵循以下形式：\n\n1. 我初始化变量 `v1`, `v2`, `...`\n2. 我评估 `condition`：\n\
  \   a) 如果结果不是 0（真），则执行语句块。然后，评估产生条件推进的表达式，并且我回到点 2。\n   b) 如果结果是 0（假），则终止 `for`\
  \ 语句的执行。随后控制权转移到程序的后续语句。\n\n例如，以下 `for` 语句打印从 1 到 100 的数字。字面上的意思是：由于 `i` 等于 1，只要\
  \ `i` 小于或等于 100，就将 `i` 递 1，写入 `i` 的值。\n\n```c\nint  i;\nfor  (i  =  1; i  <=  100;\
  \ i++) printf(\"%d  \",  i);\n```\n\n下一个示例打印 7 到 112 之间的 7 的倍数。\n\n```c\nint  k;\n\
  for  (k  =  7; k  <=  112; k  +=  7) printf(\"%d  \",  k);\n```\n\n在下一个示例中，你可以看到逗号作为控制变量以及使条件结束的值演变的表达式的分隔符。\n\
  \n```c\nint  F,  c;\nfor  (F  =  3, c  =  6; F  +c  <  40; F++, c  += two) printf(\"\
  f=%d\\tc=%d\\n\",  F,  c);\n```\n\n另一个打印从 1 到 10 增量为 0.5 的值的示例。\n\n```c\nfloat \
  \ i;\nfor  (i  =  1; i  <=  10; i+=0.5) printf(\"%g\", i);\n```\n\n另一个示例反向打印字母。\n\
  \n```c\nchar  car;\nfor  (car  ='z'; car  >='a'; car--) printf(\"%c\", car);\n```\n\
  \n示例展示了如何退出无限循环。\n\n```c\nfor (;;)\n{\n  break;\n}\n```\n\n\n\n\n\n```c\nz = (int)sqrt(x\
  \ * x + and * and);\n\nif (z > fifty) break; // 退出循环\n\n}\n```\n\n### 语句 continue\n\
  \n`continue` 语句强制继续执行 `while`、`do` 或 `for` 循环中所包含的下一次迭代。它的语法是：\n\n`continue;`\n\n\
  关于示例，请看下面的程序，该程序会打印从 1 到 100 之间所有 5 的倍数的数字。\n\n```c\n#include <stdio.h> main()\n\
  {\n    int no;\n    for (n = 0; n <= 100; n++)\n    {\n        // 如果 n 不是 5 的倍数，则执行下一次迭代\
  \ if (n % 5 != 0) continue;\n        // 打印下一个 5 的倍数 printf(\"%d \", n);\n    }\n\
  }\n```\n\n运行程序，我看到每当我执行带有 `continue` 的判断时，它都会开始为新的 `n` 值启动 `for` 语句块的执行。\n\n###\
  \ 语句 goto\n\n`goto` 语句将控制转移到程序的特定某行，该行通过标签 `a` 标识。它的语法如下：\n\n`goto label ;`\n\n\
  `.`\n`.`\n\n`label : sentence ;`\n\n如果控制转移到的行是一个可执行语句，则执行它。跳过该语句及其后的语句。如果它不是可执行的，则执行将从找到该标签后的第一个可执行判断语句开始。\n\
  \n控制不能转移到我们当前所在的函数体之外。\n\n滥用此语句会导致产生难以解释和难以维护的程序。因此，在结构化编程中，它只在特殊情况下使用。`goto` 语句的功能可以使用\
  \ `if...else`、`do`、`for`、`switch` 或 `while` 语句来实现。\n\n最常用的用法是放弃某些深度嵌套的结构的执行，这是通过\
  \ `break` 语句无法实现的，因为 `break` 仅限制于一层嵌套。\n\n下面的示例展示了如何使用 `goto` 语句，由两个嵌套的 `for` 循环组成。在内层循环中，有一个\
  \ `goto` 语句，当满足指定条件时将会执行。如果执行了 `goto` 语句，控制将转移到标签后的第一个可执行语句。跳出。\n\n```c\n/* goto\
  \ 语句的使用\n* goto.c\n*/\n#include <stdio.h>\n#define K8\n\nmain()\n{\n    int F, c,\
  \ no;\n    printf(\"Value from n: \"); scanf(\"%d\", &n);\n    for (F = 0; F < K;\
  \ f++)\n    {\n        for (c = 0; c <K; c++)\n        {\n            if (f*c >\
  \ n) goto leave;\n        }\n    }\nleave:\n    if (f < K && c < K) printf(\"(%d,\
  \ %d)\\n\", F, c);\n}\n```\n\n运行程序：\nValue from n: twenty (3, 7)\n\n### 训练题解答\n\n\
  1. 编写一个程序，根据方程计算方程根：\n\n![](img/image18551.jpeg) $ax + bx + c = 0$\n\n包含以下情况：\n\n\
  1. 如果 `a` 等于 0 且 `b` 等于 0，我们将打印一条消息说明该方程是退化的。\n2. 如果 `a` 等于 0 且 `b` 不等于 0，则仅存在值为\
  \ `-c / b` 的根。\n3. 在其他所有情况下，我们将使用以下公式：\n\n![](img/image18552.jpeg) $x_i = 2$ 到\n\
  \n表达式 `d = b² – 4ac` 是判别式。\n\n* 如果 `d` 大于或等于 0，则有两个实数根。\n* 如果 `d` 小于 0，则有两个形式为 $x\
  \ + yj, x – yj$ 的复数根。\n\n使用适当的字面量表示要引入的数据，以便得到结果。\n\n解决此问题的方案可以如下所示：\n\n* 首先，我们定义要在程序使用的变量。\n\
  `double to, b, c; // 方程系数`\n`double d; // 判别式`\n`double re, im; // 根的实部和虚部`\n`printf(\"\
  Coefficients, b and c from the equation: \"); scanf(\"%lf %lf %lf\", &to, &b, &c);`\n\
  * 读取系数并进行计算。\n`if (to == 0 && b == 0)`\n`printf(\"The equation is degenerate\\n\"\
  );`\n`else if (to == 0)`\n`printf(\"The only root is: %.2lf\\n\", -c / b);`\n`else\
  \ {`\n`// 计算公式。计算 - b 2 - 4 bc`\n![](img/image18553.jpeg)[](Images/image18554.jpeg)[](Images/image18554.jpeg)[](Images/image18555.jpeg)2\
  \ to 2 to re`\n`re = -b / (two * to);`\n`d = b * b-4 * to * c;`\n`im = sqrt(fabs(d))\
