  }\n```\n\n#### 第十一章\n\n© FJCeballos/RA-MA\n\n# 结构动力学\n\n![](img/image18733.jpeg)\n\
  \n动态结构的主要特征是它们具有改变大小的能力，许多问题都需要这种类型的结构。这一属性明确将它们与静态函数结构（如数组）区分开来。当创建一个矩阵时，其元素数量在创建那一刻是固定的，随后无法逐元素地扩大或缩小，必须保留当前分配的空间；相反，当创建一个动态结构时，这确实是可能的。\n\
  \n因此，无法为动态结构分配固定数量的内存，结果导致编译器无法将显式地址与此类结构的元素关联。解决此问题的常用技术是对单个元素进行动态直接分配，这些元素是在程序执行期间创建的，而不是一次性地为一组确定的元素进行分配。\n\
  \n在处理动态结构工作时，编译器分配一个固定数量的内存来维护动态分配的元素地址信息，而不是为元素本身进行分配。这意味着数据和指向数据的引用之间应该有明确的区别，因此必须使用值是其他数据引用的数据类型。换句话说，我们指的是“指针到”类型的变量。\n\
  \n当我为任意类型的对象动态分配内存时，会返回一个指向所分配内存区域的指针。为了执行此操作，我们在 C 中使用了函数 `malloc`（详见第 7 章“动态内存分配”一节）。\n\
  \n本章引入了构建抽象数据结构的各种算法。在完成本章的示例后，你将能够在应用程序中利用链表、栈、队列和树的威力。\n\n### 线性链\n\n到目前为止，我们处理的是数组，正如我们所知，数组是同类型元素的集合，它们在内存中是连续的；元素数量在创建数组时就已经固定了。如果以后在程序执行期间，我们需要修改其大小以便包含更多或更少的元素，唯一的替代方案就是分配一个所需大小的新内存空间，并将我们希望从原始数组中保留的数据复制到其中。新矩阵将成为当前矩阵，而原始矩阵将被销毁，是的，不再需要了。\n\
  \n显而易见，每当我们需要向元素集合添加或删除元素时，上一段提出的解决方案并不是最合适的；我们显然在考虑某种允许我们向集合中添加或删除单个项的机制。如果我们使用线性链而不是数组来工作，那么这种机制就是可行的。线性链是一个最初为空的任意类型元素集合，它们在内存中并不一定连续，在程序执行期间可以根据预测的需求逐元素地增长或减少。\n\
  \n根据给出的定义，出现了一个问题：如果元素在内存中是不连续的，当我们重新运行列表时，如何从一个元素移动到下一个元素？答案是每个元素必须存储关于下一个或上一个元素（或两者）的信息。根据列表每个元素存储的关于其前驱和/或后继的信息，列表可以分类为：单链表、循环链、双链表和双向循环链。\n\
  \n### 单链线性链\n\n单链线性链是对象（列表元素）的集合，每个对象包含数据或指向数据的指针，以及指向集合中下一个对象（列表项）的整数指针。在图上，你可以这样表示：\n\
  \n![](img/image18734.jpeg)p following\n\nReady linear\n\nNULL\n\n要构建一个线性链，我们首先需要定义将组成它的元素类型。例如，列表的每个元素可以定义为具有两个或多个成员的数据结构，其中一个是指向下一个元素的指针，其余的与数据区域匹配。数据区域可以是预定义类型，也可以是特定的用户定义类型。根据此，列表每个元素的类型可以如下形式定义：\n\
  \n```c\ntypedef struct s\n{\n    // 成员：\n    // 在这里定义数据或指向数据的指针\n    // ...\n  \
  \  struct s *following; // 指向后续元素\n} ElementLse;\n```\n\n可以看出，ElementL 结构将定义一组对应我们要操作的数据成员，此外还有一个名为\
  \ `next` 的特殊成员，允许每个元素指向其后继，从而形成链表。\n\n一旦定义了 ElementLse 结构，元素的内存分配可以如下进行：\n\n```c\n\
  #include <stdio.h>\n#include <stdlib.h>\n\ntypedef struct s\n{\n    // 数据区域\n  \
  \  // ...\n    struct s *following; // 指向后续元素\n} ElementLse;\n\nvoid error()\n{\n\
  \    printf(\"内存不足\\n\");\n    exit(1);\n}\n\nElementLse *newItem() // 创建一个新元素\n\
  {\n    ElementLse *q = (ElementLse *)malloc(sizeof(ElementLse));\n    if (!q) error();\n\
  \    return q;\n}\n\nmain()\n{\n    ElementLse *p = NULL; // 指向元素的指针\n    // 为元素分配内存\
  \ p = newItem();\n    // 一个元素没有后继 p->next = NULL;\n    // 任意操作\n    // 释放元素 p 占用的内存\
  \ free(p); p = NULL;\n}\n```\n\n\n\n\n代码 `ElementLse * p` 定义了一个指向 `ElementLse` 类型对象的指针\
  \ `p`。语句 `p = newItem()` 创建了（为...分配了内存）一个 `ElementLse` 类型的对象，返回指向该新对象的指针（内存地址），并将此指针赋值给变量\
  \ `p`。语句 `p->next = NULL` 将 `p` 所指向的对象的 `next` 成员设置为 `NULL`，从而表示在该元素之后没有其他元素；也就是说，该元素是列表中的最后一个元素。\n\
  \n`NULL` 值（空指针）允许创建有限对象的列表。以此此类推——假设 `p` 指向列表的开头，我们说列表是空的。是的，`p` 等于 `NULL`。例如，执行以下语句：\n\
  \n```c\np = NULL; // 准备好空列表\np = newElement(); // 元素 p\np->next = NULL; // 没有后续元素了\n\
  ```\n\n就得到了一个就绪的元素：\n\n![](img/image18735.jpeg)p\n\n为了向之前的就绪列表添加一个新元素，我们将如下进行操作：\n\
  \n```c\nwhat = newElement(); // 创建一个新元素\nq->next = p; // 设置后续元素的位置\np = q; // p\
  \ 指向就绪列表的开头\n```\n\n其中 `q` 是一个指向 `ElementLse` 类型对象的指针。现在我们有一个包含两个元素的列表。注意，新元素被添加到了就绪列表的开头。\n\
  \n为了清楚地看到，让我们分析一下之前的三个语句。我们从一个由 `p` 指向的包含单个元素的列表开始。语句 `q = newnewItem()` 创建了一个新元素：\n\
  \n![](img/image18736.jpeg)![](img/image18737.jpeg)what p\n\n语句 `q->next = p` 使新创建元素的后继者变为之前创建的元素。注意，现在\
  \ `q->next` 和 `p` 具有相同的值；也就是说，它们具有相同的地址，因此它们指向同一个元素：\n\n![](img/image18738.jpeg)what\n\
  \n最后，通过判断 `p = what` 使 `what` 成为 `p` 新指向的就绪状态；也就是说，对我们来说 `p` 永远是就绪列表的第一个元素。\n\n\
  ![](img/image18739.jpeg)p\n\n现在 `p` 和 `what` 指向同一个元素，即第一个。如果现在执行类似下面的语句，会发生什么？\n\
  \n```c\nwhat = q->next;\n```\n\n`q->next` 是什么？它是 `what` 所指向的元素的 `next` 成员，包含下一个元素所在的内存地址，而该地址由\
  \ `p` 指向。如果将此值赋值给 `q`，那么 `q` 将指向与之前 `q->next` 指向的同一个元素：\n\n![](img/image18740.jpeg)p\n\
  \n结果是 `what` 现在指向了后续元素。我可以在上面的图中看到这一点。这给了我们一个如何逐个元素地处理就绪列表的思路。如果我们再次执行相同的判断：\n\n\
  ```c\nwhat = q->next;\n```\n\n发生了什么？由于 `q->next` 是 `NULL`，所以 `q` 被赋值为 `NULL` 值。结论是，当我们在列表中使用指针从一个元素移动到下一个元素时（在上例的\
  \ `q` 中），当该指针获取到 `NULL` 值时，我们就认为到达了就绪列表的末尾。\n\n### 基础操作\n\n我们可以对列表执行的操作根本上包括以下内容：\n\
  \n1. 在就绪列表中插入一个元素。\n2. 在就绪列表中查找一个元素。\n3. 从就绪列表中删除一个元素。\n4. 遍历就绪列表中的元素。\n5. 删除就绪列表中的所有元素。\n\
  \n从定义开始：\n\n```c\n#include <stdio.h>\n#include <stdlib.h>\n\ntypedef struct s {\n\
  \    int fact; // 数据区域\n    struct s *following; // 指向下一个元素的指针\n} ElementLse;\n\n\
  void error() {\n    printf(\"内存内存不足\\n\");\n    exit(1);\n}\n\nElementLse *newItem()\
  \ {\n    ElementLse *q = (ElementLse *)malloc(sizeof(LseElement));\n    if (!q)\
  \ error();\n    return q;\n}\n\nmain() {\n    ElementLse *p = NULL, *q = NULL, *r\
  \ = NULL;\n    // ...\n}\n```\n\n我们将在接下来的章节中解释如何执行每个基础操作。注意，为了简单起见，我们将处理一个整数列表。\n\
  \n#### 将元素插入就绪列表的开头\n\n假设有一个由 `p` 指向的线性列表。要在列表开头插入元素，首先创建该元素，然后重新分配指针：\n\n```c\n\
  what = newElement();\nq->next = p;\np = q;\n```\n\n操作的顺序至关重要。结果是：\n![](img/image18741.jpeg)\n\
  \n对于此，从一个空列表开始，我们只需要按照需要重复该操作。\n\n```c\n//\nmain() {\n    ElementLse *p = NULL,\
  \ *q = NULL;\n    int n = 0;\n    printf(\"输入数据。\\n\");\n    while (scanf(\"%d\"\
  , &n) != EOF) {\n        q = newElement();\n        q->data = n;\n        q->next\
  \ = p;\n        p = q;\n    }\n}\n```\n注意列表中的元素顺序与到达的顺序相反。\n![](img/image1742.jpeg)\n\
  \n#### 查找元素\n\n假设我们要在列表中查找特定的元素 `x`。搜索是顺序的，直到找到该元素或 `r` 为 `NULL`。注意构成 `while` 循环的表达式：\n\
  \n```c\nr = p;\nprintf(\"查找数据: \");\nscanf(\"%d\", &x);\nwhile (r != NULL && r->data\
  \ != x) {\n    r = r->next;\n}\n```\n我们知道在 `&&`（与）操作中，如果一个表达式为假，其余的表达式就不会执行。因此，当\
  \ `r` 为 `NULL` 时，不会执行 `r->data`，否则会发生错误。\n![](img/image1743.jpeg)\n\n#### 通用元素插入\n\
  \n在列表中由 `r` 指向的元素之后插入元素的方法如下：\n\n```c\nwhat = newElement();\nq->data = x;\nq->next\
  \ = r->next;\nr->next = q;\n```\n![](img/image1744.jpeg)\n![](img/image1745.jpeg)![](img/image1746.jpeg)![](img/image1747.jpeg)what\n\
  ![](img/image1748.jpeg)\n![](img/image1749.jpeg)\n![](img/image1750.jpeg)\n\n####\
  \ 在就绪列表 r 指向的元素之前插入\n\n在 `r` 指向的元素之前插入元素，是通过在 `r` 指向的元素之后插入新元素来实现的，并更改新元素和 `r` 指向元素的值。\n\
  \n```c\nwhat = newElement();\n*q = *r; // 将成员拷贝到另一个元素\nr->data = x; // 插入的值\nq->next\
  \ = q;\n```\n![](img/image1753.jpeg)\nImages/image1756.jpeg)\n\n#### 删除就绪列表中的项\n\
  \n要删除 `r` 指向的元素的后继者，需要执行的操作如下：\n\n```c\nwhat = r->next; // what 指向要删除的元素\nr->next\
  \ = q->next; // 连接之前的元素\n```\n\n\n\n```c\n// 稍后被删除。free(q); // 删除 what 指向的元素\n```\n\
  \n![](img/image18757.jpeg)[](Images/image18758.jpeg)[](Images/image18759.jpeg)\n\
  \n![](img/image18760.jpeg)[](Images/image18761.jpeg)[](Images/image18762.jpeg)[](Images/image18763.jpeg)删除\
  \ `r` 指向元素的后继节点\n\n注意，要访问元素的成员，该元素必须被一个变量指向。因此，我们所做的第一件事是让 `q` 指向要删除的项。\n\n要删除 `r`\
  \ 指向的元素，需要执行的操作如下：\n\n```c\nwhat = r->next;\n```\n\n![](img/image18763.jpeg)*`r\
  \ = *q; // 将成员拷贝到另一个对象的成员中` `free(q); // 将 what 指向的对象释放到垃圾桶（删除）`\n\n![](img/image18764.jpeg)[](Images/image18765.jpeg)\n\
  \n删除 `r` 指向的元素\n\n作为一个练习，请编写一组操作序列，允许你删除列表的最后一个元素。\n\n### 遍历列表\n\n假设我们需要对列表中的所有元素执行操作，列表的第一个元素由\
  \ `p` 指向。例如，打印就绪中每个元素的值。操作序列如下：\n\n```c\nwhat = p; // 保存就绪中第一个元素的指针 \nwhile (q !=\
  \ NULL)\n{\n    printf(\"%d \", q->data);\n    what = q->next;\n}\n```\n\n### 删除列表中的所有元素\n\
  \n删除列表中的所有元素等同于释放分配给列表中每个元素的内存。假设我们要删除一个列表-ta，其第一个元素由 `p` 指向。操作序列如下：\n\n```c\nwhile\
  \ (p != NULL)\n{\n    what = p; // what 指向与 p 相同的元素\n    p = p->next; // p 指向下一个元素\
  \ \n    free(q); // 释放 what 指向的对象\n}\n```\n\n注意，在删除 `q` 指向的元素之前，我们让 `p` 指向下一个元素，否则我们将会丢失列表的其余部分（由\
  \ `q->next` 指向的部分）。我们为什么要丢失列表呢？因为这是访问其相同内容的唯一引用。\n\n### 线性列表的示例\n\n根据上面描述的线性列表基本操作，我们现在将编写一个应用程序，允许我们创建一个简单的单链表（llse），其中每个元素包含两个成员：一个类型为`double`的值和一个指向相同类型元素的指针。\n\
  \n定义列表元素的结构，我们称之为 `Element`，正如我们之前指出的，它如下：\n\n```c\ntypedef structure s\n{\n   \
  \ double fact; // 数据\n    structure s *following; // 指向下一个元素的指针\n} Element;\n```\n\
  \n为了创建和操作线性列表，初步，我们将编写以下函数：`error`、`newElement`、`adddirToBeginning`、`fetchAll` 和\
  \ `deleteAll`。这组函数构成了所谓的接口（interface）：一个对象与另一个对象通信的媒介；例如，我们现在尝试编写的接口将是应用程序以后与线性列表（广义上与数据结构）通信的媒介。为什么要接口？因为它是重用代码的一种方式，假设不同的处理特定类型数据结构的应用程序可以使用相同的接口；显然，是的，我们已经有了它，没有必要为每个应用程序重新写一遍。\n\
  \n![](img/image18766.jpeg)`Interface`\n\n`newItem` 函数将为就绪中的新项分配内存；如果不可能，它将调用 `error`\
  \ 函数进行通知并终止程序。`adddirToBeginning` 函数允许你在列表开头添加新元素，`showAll` 将在屏幕上显示列表中的所有项，`deleteAll`\
  \ 将删除列表中的所有项，并释放为每个项分配的内存。\n\n根据上述，我们在上一段中提到的接口将如下：\n\n```c\n// 处理 illse 的接口 ////////////////////////////////\n\
  //\n// 显示错误消息并终止程序\nvoid error()\n{\n    printf(\"内存不足\\n\");\n    exit(1);\n}\n\
  \n// 创建新元素\nElement *newItem()\n{\n    Element *q = (Element *)malloc(sizeof(Element));\n\
  \    if (!q) error();\n    return q;\n}\n\n// 将元素添加到开头\nvoid adddirToBeginning(double\
  \ no, Element **p)\n{\n    Element *q = newItem();\n    q->data = no;\n    q->next\
  \ = *p;\n    *p = q;\n}\n\n// 显示元素\nvoid showAll(Element *d)\n{\n    Element *q\
  \ = p;\n    while (q != NULL)\n    {\n        printf(\"%g \", q->data);\n      \
  \  q = q->next;\n    }\n}\n\n// 删除所有元素\nvoid deleteAll(Element *d)\n{\n    Element\
  \ *q = p;\n    while (p != NULL)\n    {\n        what = p;\n        p = p->next;\n\
  \        free(q);\n    }\n}\n////////////////////////////////////////////////\n\
  *注意：提供的源码包含了一些严重的 OCR/拷贝痕迹（例如：\"illse\"对应\"list\",\"adddir\"对应\"add\",\"fact\"对应\"\
  data\",\"p\" 未定义）。我已经清理了代码以反映标准的 C 语法，同时保持了提供文本的结构。*\n\n\n\n\n```c\n// 返回元素如果 (q\
  \ != NULL) return q;\n\n}\n\n// 索引超出范围返回 NULL;\n\n}\n```\n\n现在为了在上述应用程序的 `main`\
