  \ temperatures.dat 平均温度 = 13.9286 度 标准差 = 33.0663\n\n### 3. 二进制文件压缩应用\n\n我想编写一个应用程序来压缩和解压缩带有图形信息的二进制文件。\n\
  \n每个图形文件由一组字节组成。每个字节都是 0 到 255 之间的值，它代表图形像素的灰度级。\n\n压缩算法如下：“源文件中每个一个或多个具有相同值的字节序列将用两个字节表示，这种形式的第一个表示原始文件中读取的灰度级，第二个表示序列中的字节总数”。如果序列大于\
  \ 255 字节，则重复使用有必要的双字节表示法。\n\n为了实现该应用程序，我要求：\n\na) 编写一个函数，从图形文件生成压缩后的文件，事实上每个记录的形状如下：\n\
  \n```c\ntypedef structure\n{\n    char pixel;\n    char total_bytes;\n} record;\n\
  ```\n\n该函数的原型为：\n`void compress(FILE *foreign, FILE *fcompressed);`\n其中 `foreign`\
  \ 是引用我们想要压缩的图形文件的流，`fcompressed` 是引用我们将存储大多数压缩数据的文件的流。\n\nb) 编写一个具有以下原型的函数：\n`void\
  \ uncompress(FILE *fcompressed, FILE *destination);`\n此函数将解压 `fcompressed` 中的数据并将其存放在由\
  \ `destination` 引的文件中。\n\nc) 写一个可以用于以下内容的程序：`compress-c` 和 `compress-d`。我了解一个完整的程序示例以供继续。\n\
  \n```c\n************* 压缩/解压文件 ******\n#include <stdio.h>\n#include <stdlib.h>\n\n\
  typedef structure\n{\n    unsigned char pixel;\n    unsigned char total_bytes;\n\
  } record;\n\nvoid compress(FILE *foreign, FILE *fcompressed)\n{\n    unsigned char\
  \ byte = 0, previous byte = 0, total = 0; record;\n    int bytes = sizeof(record);\n\
  \    // 读取字节\n    byte = getc(foreign);\n    while (ferror(foreign) && !feof(foreign))\n\
  \    {\n        overall = 0;\n        previous byte = byte;\n        // 连续重复的字节数\n\
  \        do\n        {\n            total++;\n            byte = getc(foreign);\n\
  \        } while (previous byte == byte && total < 255 && !error(foreign));\n  \
  \      // 写入字节和数量\n        record.pixel = previous byte;\n        record.total_bytes\
  \ = total;\n        fwrite(&record, bytes, 1, fcompressed);\n    }\n    if (ferror(foreign))\n\
  dog(\"读取错误\");\n}\n\nvoid decompress(FILE *fcompressed, FILE *destination)\n{\n\
  \    record;\n    int bytes = sizeof(record);\n    unsigned char i = 0;\n    //\
  \ 读取数据\n    fread(&record, bytes, 1, fcompressed);\n    while (ferror(fcompressed)\
  \ && !feof(fcompressed))\n    {\n        // 解压缩\n        for (i = 0; i < record.total_bytes;\
  \ i++) fputc(record.pixel, destination);\n        fread(&record, bytes, 1, fcompressed);\n\
  \    }\n    if (ferror(fcompressed))\ndog(\"读取错误\");\n}\n\nint main(int argc, char\
  \ *argv[])\n{\n    FILE *foreign = NULL, *fdestination = NULL;\n    if (argc !=\
  \ 4)\n    {\n        printf(\"用法: comp {-c|-d} foreign destination\\n\");\n    \
  \    exit(1);\n    }\n    if ((foreign = fopen(argv[2], \"rb\")) == NULL)\n    {\n\
  \        printf(\"无法打开文件: %s\\n\", argv[2]);\n        exit(1);\n    }\n    if ((fdestination\
  \ = fopen(argv[3], \"wb\")) == NULL)\n    {\n        printf(\"无法打开文件: %s\\n\", argv[3]);\n\
  \        exit(1);\n    }\n    if (argv[1][0] == '-' && argv[1][1] == 'c')\n    \
  \    compress(foreign, fdestination);\n    else if (argv[1][0] == '-' && argv[1][1]\
  \ == 'd')\n        decompress(foreign, fdestination);\n    else\n    printf(\"选项错误\\\
  n\");\n    fclose(foreign);\n    fclose(fdestination);\n    return 0;\n}\n```\n\n\
  ### 4. 数据库程序\n\n编写一个程序，允许你创建一个新文件、打开现有文件、添加、修改或删除记录并查看文件内容。文件名将通过键盘输入。每个文件记录将根据以下结构由引用和价格组成：\n\
  \n```c\n// 定义类型 record\ntypedef structure\n{\n    char reference[20];\n    double\
  \ price;\n} record;\n```\n\n同样，为了让用户可以选择上述的任何操作，程序将在屏幕上显示类似于所示的菜单：\n\n文件名: articles\n\
  1. 打开文件\n2. 添加记录\n3. 修改记录\n4. 删除记录\n5. 查看记录\n6. 退出\n\n选项：\n\n当打开文件且它存在时，将允许用户覆盖它，如果你希望这样做的话。其他选项将执行其标题指定的任务，但查看记录选项将可视化那些引用为指定的一个或包含指定子字符串的记录；当子\
  \ ca-欢迎为 \"*\" 时，将显示所有内容。\n\n每个选项至少必须执行一个函数；退出选项将调用一个函数，通过该过程所需的操作关闭数据库。\n\n\n\n\
  另一方面，一个打开的文件将由以下属性定义：一个存储文件名的字符串、一个指向文件的流、文件中的记录数、每条记录的长度，以及一个指示“我已经删除了某些记录”的成员。让我们这些属性分组在一个结构中：\n\
  \n```c\ntypedef structure\n{\nchar fileName[20];  // 文件名\nFILE *fes; // 指向/来自文件的流\n\
  int nregs; // 记录数量\nint tamreg; // 记录大小（字节）\nint regsDeleted; // 当我知道删除了某些记录时置为\
  \ 1\n} database;\n```\n\n继续之前的示例，操作文件应该允许：启动、检查文件是否存在、插入、获取、搜索和删除记录，以及在需要时更新分析文件。这些工作将由以下函数完成：\n\
  \n*   `Start Registration`（开始注册）。此函数将开始将 `record` 类型结构体的成员初始化为零。\n*   `StartDatabase`（启动数据库）。此函数将把\
  \ `database` 类型结构体的成员初始化为零。\n*   `It exists`（检查存在性）。此函数将根据传入的 `exists` 参数，如果我知道的名为\
  \ `Name` 的文件存在则返回 1，否则返回 0。\n*   `WriteRegistry`（写入记录）。将允许覆盖文件中任意位置的记录。\n*   `Anyadir\
  \ Registry`（添加记录）。将允许在文件末尾添加一条记录。\n*   `ReadLog`（读取日志）。返回文件中请求的记录。\n*   `FindRecord`（查找记录）。它将允许在文件中查找特定的记录。将返回记录的位置（第一条记录为\
  \ 0），如果未找到搜索的记录则返回 -1。\n*   `DeleteRecord`（删除记录）。将允许标记文件中的某条记录已删除。\n*   `UpdateDatabase`（更新数据库）。将允许从文件中物理删除由\
  \ `DeleteRecord` 函数标记的记录。\n*   `CloseDatabase`（关闭数据库）。如果删除了某些记录（`regsDeleted` 成员不为\
  \ 0），将调用 `UpdateDatabase` 函数并关闭文件。\n\n根据上述内容，操作文件或 `database` 的函数定义所示。引入的注释已足够理解代码，而无需提供额外的解释。\n\
  \n////////////////////////////////////////////////// ///////////////\n\n// 处理基础数据的函数定义：\n\
  // 1. 开始一条记录\n// 2. 检查想要处理的文件是否存在？\n// 3. 写入记录\n// 4. 在文件末尾添加记录\n// 5. 读取记录 i\n\
