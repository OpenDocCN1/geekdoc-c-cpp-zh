  \ *strstr(char *string1, char *string2);\n```\n\n兼容性: ANSI, UNIX 和 Windows\n\n函数\
  \ `strstr` 返回指向 `string2` 在 `string1` 中首次出现处的指针；如果在 `string1` 中未找到 `string2`，则返回值\
  \ `NULL`。\n\n### strtok\n\n```c\n#include <string.h>\n\nchar *strtok(char *string1,\
  \ char *string2);\n```\n\n兼容性: ANSI, UNIX 和 Windows\n\n`strtok` 函数允许你从 `string1`\
  \ 中获取根据 `string2` 中指定的分隔符进行划分的元素。\n\n要获取第一个元素，`strtok` 必须将 `string1` 作为第一个参数；而要获取后续项，你必须传入\
  \ `NULL`。每次调用 `strtok` 都会返回指向下一个元素的指针，如果没有更多元素，则返回 `NULL`。\n\n如果一个元素以分隔符结束，它将替换替换为\
  \ `\\0`，并保存下一个字符的指针以供下次调用 `strtok` 使用。你可以在元素与元素之间放置多个分隔符，也可以在每次调用之间更改充当分隔符的字符集。最后，你需要知道此函数会修改其第一个参数，因此必须有一个允许该函数写入的内存空间。例如，对于\
  \ `string1`，以下两种定义中的一种都是有效的：\n\n```c\nchar string1[] = \"A chain from characters\"\
  ;\nchar *string1 = (char *)malloc(nBytes);\nstrcpy(string1, \"A chain from characters\"\
  );\n```\n\n相反，下面的定义是无效的，因为 `string1` 指向不可写入的内存区域（它被视为常量）：\n\n```c\nchar *string1\
  \ = \"A chain from characters\";\n```\n\n接下来的示例将指定的 `chain` 字符链根据空格、逗号和 de 等分隔符定义的元素进行划分。\n\
  \n```c\n/* strtok.c */\n#include <stdio.h>\n#include <string.h>\n\nmain(void)\n\
  {\n    char chain[] = \"This chain, is formed by several words\";\n    char *element;\n\
  \    element = strtok(chain, \" ,\");\n    while (element != NULL)\n    {\n    \
  \    printf(\"%s\\n\", element);\n        element = strtok(NULL, \" ,\");\n    }\n\
  }\n```\n\n执行程序：\n```\nThis chain\nis formed by several words\n```\n\n### strlwr\n\
  \n```c\n#include <string.h>\n\nchar *strlwr(char *chain);\n```\n\n兼容性: Windows\n\
  \n函数 `strlwr` 将 `chain` 中的所有大写字母转换为小写。\n\n结果是小写后的原始 `chain`。\n\n### strupr\n\n```c\n\
  #include <string.h>\n\nchar *strupr(char *chain);\n```\n\n兼容性: Windows\n\n函数 `strupr`\
  \ 将 `chain` 中的所有小写字母转换为大写字母。\n\n结果是大写后的原始 `chain`。\n\n### 数据转换函数\n\n下面显示的 C 语言库函数允许你将字符串转换为数字反之亦然，前提是这种转换是可能的。\n\
  \n### atof\n\n```c\n#include <stdlib.h>\n\ndouble atof(char *chain);\n```\n\n兼容性:\
  \ ANSI, UNIX 和 Windows\n\n`atof` 函数将字符链转换为 `double` 类型的值。\n\n### atoi\n\n```c\n\
  #include <stdlib.h>\n\nint atoi(char *chain);\n```\n\n兼容性: ANSI, UNIX 和 Windows\n\
  \n`atoi` 函数将字符链转换为 `int` 类型的值。\n\n### atol\n\n```c\n#include <stdlib.h>\n\nlong\
  \ atol(char *chain);\n```\n\n兼容性: ANSI, UNIX 和 Windows\n\n`atol` 函数将字符字符串转换为 `long`\
  \ 类型的值。当函数 `atof`、`atoi` 和 `atol` 从变量 `chain` 中获取不被识别为数字部分的字符时，它们会中断转换。\n\n```c\n\
  /* 程序示例：\n* 存储在字符链中的数字可以使用 atof、atoi 和 atol 函数 \n * 转换为数值值\n *\n * atof.c\n */\n\
  #include <stdio.h>\n#include <stdlib.h>\n\nmain(void)\n{\n    char *s = NULL;\n\
  \    double x = 0;\n    int i = 0;\n    long he = 0;\n\n    s = \" -3208.15E-13\"\
  ;\n    x = atof(s);\n    printf(\"atof: %-17s float: %f\\n\", s, x);\n\n    s =\
  \ \"8.7195642337E+20\";\n    x = atof(s);\n    printf(\"atof: %-17s float: %f\\\
  n\", s, x);\n\n    s = \"-89954\";\n    i = atoi(s);\n    printf(\"atoi: %-17s int:\
  \ %d\\n\", s, i);\n\n    s = \"89954\";\n    he = atoll(s);\n    printf(\"atol:\
  \ %-17s long: %ld\\n\", s, he);\n}\n```\n\n执行程序：\n```\natof: -3208.15E-13    float:\
  \ -3208.150000\natof: 8.7195642337E+20 float: 871956423370000000000.000000\natoi:\
  \ -89954           int: -89954\natol: 89954            long: 89954\n```\n\n### sprintf\n\
  \n```c\n#include <stdio.h>\n\nint sprintf(char *buffer, char *format, ...);\n```\n\
  \n兼容性: ANSI, UNIX 和 Windows\n\n`sprintf` 函数按照指定的格式将数据写入 `buffer` 中。它返回写入的字符数。例如：\n\
  \n```c\n/* sprintf.c\n * 使用 sprintf 格式化：\n * String: computer\n * Character: /\n\
  \ * Integer: 40\n * Actual: 1.41214\n */\n#include <stdio.h>\n\nmain(void)\n{\n\
  \    char buffer[200], s[] = \"computer\", c = '/';\n    int i = 40, j;\n    float\
  \ F = 1.41214;\n\n    j = sprintf(buffer, \"String: %s\\n\", s);\n    j += sprintf(buffer\
  \ + j, \"\\tCharacter: %c\\n\", c);\n    j += sprintf(buffer + j, \"\\tInteger:\
  \ %d\\n\", i);\n    j += sprintf(buffer + j, \"\\tActual: %f\\n\", F);\n\n    printf(\"\
  Output:\\n%s\\nNumber from characters = %d\\n\", buffer, j);\n}\n```\n\n执行程序：\n\
  ```\nOutput:\nString: computer\nCharacter: /\nInteger: 40\nActual: 1.412140\nNumber\
  \ from characters = 72\n```\n\n### 字符函数\n\nC 库中的这些函数作用于一个整数并返回字符结果。\n\n### toascii\n\
  \n```c\n#include <ctype.h>\n\nint toascii(int c);\n```\n\n兼容性: UNIX 和 Windows\n\n\
  `toascii` 函数将 `c` 的除低七位以外的所有位置 0。在另一种形式，它将 `c` 转换为 ASCII 字符。\n\n### tolower\n\n\
  ```c\n#include <stdlib.h>\n\nint tolower(int c);\n```\n\n兼容性: ANSI, UNIX 和 Windows\n\
  \n`tolower` 函数将 `c` 转换为小写形式，如果适用。\n\n### toupper\n\n```c\n#include <stdlib.h>\n\n\
  int toupper(int c);\n```\n\n兼容性: ANSI, UNIX 和 Windows\n\n`toupper` 函数将 `c` 转换为大写字母，如果是的话。\n\
  \n```c\n/* tolower.c */\n#include <stdio.h>\n#include <stdlib.h>\n\nmain()\n{\n\
  \    char car;\n    // ... do\n    {\n        printf(\"Do you want to continue?\
  \ y/n \");\n        car = getchar();\n        fflush(stdin);\n    }\n    while (tolower(car)\
  \ != 'n' && tolower(car) != 's');\n    // ...\n}\n```\n\n\n\n\n这些函数的参数类型为 `double`，返回的结果类型也是\
  \ `double`。因此，在许多情况下，我们将使用显式类型版本（强制类型转换）来将参数显式转换为所需的类型。例如，假设 `value` 是一个 `int`，\n\
  \n```c\nto = acos((double)value);\n```\n\n计算值 `value` 的反余弦。可以看出，传递给函数 `acos` 的参数被显式强制转换为了\
  \ `double` 类型。\n\n`math` 库函数可以分为以下几类：\n\n* 三角函数函数。\n* 双曲三角函数。\n* 指数和对数函数。\n* 其他若干。\n\
  \n### acos\n`acos` 函数返回在 0 到 $\\pi$ 范围内的弧度，其余弦值为 $x$。$x$ 的值必须在 -1 到 1 之间；否则你将得到错误（参数超出函数定义域）。\n\
  \n```c\n#include <math.h>\ndouble acos(double x);\n```\n兼容性：ANSI, UNIX 和 Windows\n\
  \n### asin\n`asin` 函数返回在 $-\\pi/2$ 到 $\\pi/2$ 范围内的弧度，其正弦值为 $x$。$x$ 的值应该在 -1 和 1\
  \ 之间；否则会得到错误（参数超出函数域）。\n\n```c\n#include <math.h>\ndouble asin(double x);\n```\n\
  兼容性：ANSI, UNIX 和 Windows\n\n### bind\n`atan` 函数返回在 $-\\pi/2$ 到 $\\pi/2$ 范围内的弧度，其正切值为\
  \ $x$。\n\n```c\n#include <math.h>\ndouble bind(double x);\n```\n兼容性：ANSI, UNIX 和\
  \ Windows\n\n### atan2\n`atan2` 函数返回在 $-\\pi$ 到 $\\pi$ 范围内的弧度，其正切值为 $y/x$。如果两个参数均为\
  \ 0，则返回错误（参数超出函数定义域）。\n\n```c\n#include <math.h>\ndouble atan2(double y, double\
  \ x);\n```\n兼容性：ANSI, UNIX 和 Windows\n\n```c\n/* acos.c */\n#include <stdio.h>\n\
  #include <math.h>\n\nmain()\n{\n    double value = 0;\n    do\n    {\n        printf(\"\
  %lf %lf\\n\", acos(value), atan2(value, 1.0));\n        value += 0.1;\n    }\n \
  \   while (value <= 1.0);\n}\n```\n\n### cos\n`cos` 函数给出 $x$（$x$ 为弧度）的余弦值。\n\n```c\n\
  #include <math.h>\ndouble cos(double x);\n```\n兼容性：ANSI, UNIX 和 Windows\n\n### without\n\
  `without` 函数给出 $x$（$x$ 为弧度）的正弦值。\n\n```c\n#include <math.h>\ndouble without(double\
