  \n### while 判断语句\n\n`while` 判断在运行一个判断（无论是简单的还是复合的，零次或多次），取决于一个条件。其语法是：`while( condition\
  \ ) sentence ;`；其中 `condition` 是任何数值、关系或逻辑表达式，判断是简单的或复合的。`while` 判断的执行过程如下：\n\n\
  1. 我知道评估 `condition`。\n2. 如果评估结果为 0（假），我不知道运行判断，并将控制到下一句。\n3. 如果评估结果不同于 0（真），我知道运行所保持和描述的过程，我从点\
  \ 1 开始重复。例如，以下代码可以包含在任何程序中，但强制要求两种可能的答案：y/n。\n\n```c\n#include <stdio.h> main()\n\
  \nchar car = '\\0';\nprintf(\"You want continue (Yes or no) \"); car = getchar();\n\
  while (car != 's' && car != 'n')\n{\nfflush(stdin);\nprintf(\"You want continue\
  \ (Yes or no) \"); car = getchar();\n}\n```\n\n执行程序 want continue (Yes or no) x\
  \ want continue (Yes or no) n `while` 语句执行 `car` 赋值。注意在执行 `while` 语句之前，`car` 被赋值。\n\
  \n`while` 语句的解释如下：当 `car` 的值不等于 's' 字符或 'n' 字符时，显示“You want continue (Yes or no)”并读取另一个字符。这强制用户输入\
  \ 's' 或 'n' 字符。该示例可以写为：\n\n```c\n#include <stdio.h> main() car = '\\0';\nprintf(\"\
  You want continue (Yes or no) \"); while ((car = getchar()) != 's' && car != 'n')\n\
  {\nfflush(stdin);\nprintf(\"You want continue (Yes or no) \");\n}\n```\n\n此示例与上一个区别在于，现在条件包含了读取变量\
  \ `car`，因为它在括号内首先执行。我知道将 `car` 与 's' 和 'n' 字符进行比较。以下示例显示输入的文本字符串每个字符的 ASCII 码，会导致无限循环，因为条件始终为真（值大于\
  \ 0）。要退出无限循环必须按下 Ctrl+C 键。\n\n```c\n/* Code ASCII from every one from the characters\
  \ from a text\n* while03.c */\n#include <stdio.h>\nmain()\n{\nchar car = 0; // car\
  \ = 空字符 (\\0)\nprintf(\"Enter a chain from text: \"); while(1)\n{\ncar = getchar();\
  \ if (car != '\\n')\nprintf(\"The code ASCII from %c is %d\\n\",car, char); else\n\
  printf(\"Enter a chain from text: \");\n}\n}\n```\n\n接下来我们运行应用程序。我们引入，例如字符串“to”，并观察到以下结果：Enter\
