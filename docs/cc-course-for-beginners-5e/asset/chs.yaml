  \n# 算法\n\n![](img/image18830.jpeg)\n\n在本章中，我们将介绍如何解决程序中非常常见的问题。我们将考虑第一个问题是递归；它是关于一个方法本身就是其解决方案的问题。我们要解决的第二个问题是对象的排序；这种安排非常常见，因此需要解释；它是日常生活的一部分，比如电话指南就是一个有序列表的例子。定位某个电话需要通过某种方法进行搜索；搜索将是我们最后一个解决的问题。\n\
  \n### 递归性\n\n如果一个过程是它的一部分，则说它是递归定义的。递归的典型示例经常出现在数学问题、数据结构和其他许多问题中。\n\n递归是一个极其强大的过程，但它消耗大量的资源，这就是为什么我们需要仔细分析它，以知道何时以及如何应用它。通过这种分析推断出，尽管问题在定义上可能是递归的，但并不永远是最合适的解决方案。\n\
  \n在实际应用中，在开始递归过程之前，必须证明递归的最大级别（即它调用自身的次数）不仅是有限的，而且是非常小的。这是因为每当由于调用执行另一个相同的过程而暂时放弃当前过程时，需要一定量的内存来存储该过程的状态。正在进行中的计算过程有一个条件是存储它，以便在完成新执行的进程后将其找回来，然后你必须重启旧的进程。\n\
  \n从编程语言的角度来说，当一个函数调用它自己时，该函数就是递归的。\n\n一个例子是 Ackermann 函数，它针对每个非负整数值 `m` 和 `n` 定义如下：\n\
  \n`A(0,n) = n+1`\n`A(m,0) = A(m-1,1)` ( m > 0 )\n`A(m,n) = A(m-1,A(m,n-1))` ( m,n\
  \ > 0 )\n\n指定可以帮助我们在应用递归时理出这些麻烦的伪代码如下：\n\n```\n<function A(m,n)>\n  IF (m 等 0) THEN\
  \ 返回结果 n+1\n  ELSE IF (n 等 0) THEN 返回结果 A(m-1,1)\n  ELSE\n  返回结果 A(m-1,A(m,n-1))\
  \  ENDIF\nEND <function A(m,n)>\n```\n\n接下来我们展示一个来自小示例的函数：\n\n```c\n/* ackerman.c\
  \ */\n#include <stdio.h>\nint Ackerman(int m, int n)\n{\n|// | Ackermann 递归函数: ||//\
  \ | A(0,n) = n+1 ||// | A(m,0) = A(m-1,1) (m > 0) ||// | A(m,n) = A(m-1,A(m,n-1))\
  \ (m,n > 0) |\n    if (m == 0)\n        return n+1; else if (n == 0)\n        return\
  \ Ackerman(m-1,1); else\n        return Ackerman(m-1,Ackerman(n-1));\n}\nmain()\n\
  {\n    int m, no, to;\n    printf(\"Calculation from A(m,n)=A(m-1,A(n-1))\\n\");\
  \ printf(\"Values from m and n : \");\n    scanf(\"%d %d\", &m, &n); to=Ackerman(m,n);\n\
  \    printf(\"\\nA(%d,%d) = %d\\n\",m,n);\n```\n\n现在我们给自己提出了解决 Ackerman 函数的问题，但不使用递归。这将要求我们在函数每次调用自己时，保存必要的当前进程，以完成新进程。实现此点的最佳方法是...\n\
  \n\n\n\n\n```c\npelement what = *p; // 电池顶端\nif (q == NULL) {\n    printf(\"\\n\
  \ 栈空\\n\"); exit(2);\n}\nelse {\n    *p.m = q->m, *pn = q->n;\n    *p = q->next;\
  \ free(q);\n}\n```\n\n在 `what` 上的一个过程应用递归解决汉诺塔问题是非常有效的。这个问题由三个垂直柱子 A、B 和 C 以及 `n`\
  \ 个大小不同的盘子组成，最初按从大到小的顺序堆叠在 `TO` 柱上。\n\n![](img/image18831.jpeg)\n\n目标是在遵循以下规则的情况下将盘子从\
  \ A 柱移动到 C ，同时保持它们的顺序：\n\n1. 我知道每次只能移动一个盘子。\n2. 一个盘子不能放在另一个更小的盘子上。\n3. 我知道将使用 B\
  \ 柱作为辅助。\n\n一种可能的解决方案是递归算法，我所知的示例如下：\n\n1. 将 `n–1` 个盘子从 `TO` 柱移动到 `B`。（盘子 `n` 是背景）。\n\
  2. 将盘子 `n` 从 `A` 柱移动到 C，以及\n3. 将 `n–1` 个盘子从 `B` 柱移动到 `C`。\n\n总结框架上的术语，我们得到：\n\n\
  | | 编号 | 盘子 | 起点 | 其他柱子 | 目的地 |\n| :--- | :--- | :--- | :--- | :--- | :--- |\n|\
  \ 初始 | n | TO | B. | C |\n| 1 | n–1 | TO | C | B. |\n| 二 | 1 | TO | B. | C |\n|\
  \ 3 | n–1 | B. | TO | C |\n\n执行从起点到终点移动 `n` 个盘子的函数为：\n\n`move(n_disks, origin, another\
  \ tower, destination);`\n\nEast 程序的伪代码可以如下：\n\n```\n<function move(n_disks, TO,\
  \ B. C)>\n  IF (n_disks is higher what 0) THEN move(n_disks-1, A, C, B) move(disk_n,\
  \ A, B, C) move(n_disks-1, B. TO, c)\nENDIF\nEND <function move>\n```\n\n现在我们作为一个小示例的一部分，展示此问题的对应的函数。结果将是所做的移动和总移动次数。\n\
  \n```c\n/* hanoi.c */\n#include <stdio.h>\nint move(int, char, char, char);\n\n\
  // 汉诺塔主函数 main()\n{\n    int n_disks, movements;\n    printf(\"Number from discs\
  \ : \"); scanf(\"%d\", &n_disks);\n    moves = move(n_disks, 'A', 'B', 'C'); printf(\"\
  \\nmoves made: %d\\n\", movements);\n}\n\n// 从柱移动盘子到另一个柱的函数\nint move(int n_disks,\
  \ char to, char b, char c)\n{\n    static int movements = 0;\n    if (n_disks >\
  \ 0) {\n        move(n_disks-1, to, c, b);\n        printf(\"move disk from %c to\
  \ %c\\n\", to, c); movements++;\n        move(n_disks-1, b, to, c);\n    }\n   \
  \ return movements;\n}\n```\n\n运行之前的应用程序对于 `n_disks = 3`，结果将如下：\nNumber from discs\
  \ : 3 move disk from TO to C move disk from TO to B. move disk from C to B. move\
  \ disk from TO to C move disk from B. to TO move disk from B. to C move disk from\
  \ A to C movements made: 7\n\n我所提出的练习是在是在不使用递归的情况下执行 `move` 函数。\n\n### 数据排序\n\n\
  数据处理中最常见且实用的程序之一是排序。它被认为是按照给定的顺序对一组对象进行重新组织的过程。此过程的目标通常是为了便于搜索属于集合的一个或多个元素。有序数据的示例包括：选修某门课程的学生列表、人口普普查列表、书籍按字母顺序排列的索引、宣传册（bros）、电话簿等。这意味着许多问题以某种方式与排序过程有关。这就是为什么排序是一个值得考虑的问题。无论是数值排序还是字母-数字混合排序，都遵循我们在生活中使用的相同规则。也就是说，数值数据大于其值越大，字符字符串按字母顺序在其他之后更大。我们可以将排序方法分为两类：数组排序（数据存储在内部内存中）和文件排序（数据存储在内存之外的外部；通常在磁盘上）。本节并不尝试详尽分析所有排序方法及其优点（如速度等），而是简单地从实际角度分析数组和文件排序最常用的方法。\n\
  \n### 冒泡排序法\n\n排序数据的方法有很多，但最为人知的方法之一是冒泡排序。让我们接着查看该方法对应的算法，以推导出一个从小到大的列表，假设要排序的数据在一个包含\
  \ `n` 个元素的矩阵中：\n\n1. 我们比较第一个元素和第二个元素，第二个和第三个、第四个等。当比较结果满足时，交换比较元素的值。通过此，我们得到了大于位置\
  \ `n` 的值。\n2. 我们重复第 1 点，现在针对前 `n–1` 个元素。通过此，我们得到了大于位置 `n–1` 的值。\n3. 然后是 `n–2` 个元素。\n\
  4. 排序将完成，通过重复 `n–1` 次。该算法的伪代码如下：\n\n```\n<function sort(array \"to\")\n  IF n >\
  \ 0\n    i = 1\n    DO WHILE (i <= n)\n      IF (a[i-1] > ai) THEN exchange a[i-1]\
  \ with ai\n      i = i+1\n    ENDDO\n    n = n-1\n  ENDDO\nEND <function>\n```\n\
  \n下面的示例包含了对 double 类型数组或指针数组的 sort 函数。\n\n```c\n////////////////////////////////////////////////\n\
  // 通过冒泡方法进行排序。\"order\" 函数展示了两个版本：针对 double 类型的和针对字符串链的。\n\nvoid sort_n(double m[],\
  \ int n_items)\n{\n    // 排序数值 double\n    int i, s = 1;\n    while (s && (--n_items\
  \ > 0)) {\n        s = 0; // 无交换\n        for (i = 1; i <= n_items; i++) {\n   \
  \         if (m[i-1] > m[i]) { // 交换 a[i-1] ai\n                help = m[i-1];\n\
  \                m[i-1] = m[i];\n                m[i] = help;\n                s\
  \ = 1;\n            }\n        }\n    }\n}\n\nvoid sort_to(char *m[], int n_items)\n\
  {\n    // 排序字母 char *\n    int i, s = 1;\n    while (s && (--n_items > 0)) {\n \
  \       s = 0; // 无交换\n        for (i = 1; i <= n_items; i++) {\n            if\
  \ (strcmp(m[i-1], m[i]) > 0) { // 交换 a[i-1] ai\n                // (我通过交换它们的地址)\n\
  \                help = m[i-1];\n                m[i-1] = m[i];\n              \
  \  m[i] = help;\n                s = 1;\n            }\n        }\n    }\n}\n```\n\
  \n////////////////////////////////////////////////\n\n注意 s 在每次迭代之初始等于 0，当两个元素之间发生至少一次交换时，它变为\
  \ 1。如果在一个整个扫描过程中没有发生任何交换，s 将保持等于 0，这意味着已经准备就绪，以此结束该过程。\n\n\n\n\n在冒泡排序法中，最坏情况下会进行\
  \ `(n–1)(n/2)=(n 2–n)/2` 次比较，其中 `n` 是待排序的元素数量。对于最好情况（列表已排序），交换次数为 `0`。中间情况为 `3(n²–n)/4`，即每个无序元素有三次交换。而在最坏情况下，交换次数为\
  \ `3(n²–n)/2`。推导出这些值的数学分析超出了本书的讨论范围。其执行时间是 `n²` 的倍数，并与比较次数和交换次数直接相关。\n\n下面的 `main`\
  \ 函数允许你快速、方便地测试上述两个函数。\n\n```c\nmain()\n{\n    int n_items = 5, i = 0;\n    // 数值矩阵\n\
  \    double m[] = {3,2,1,5,4};\n    // 从字符链指针构的矩阵\n    char *s[] = {\"ccc\",\"bbb\"\
  ,\"aaa\",\"eee\",\"ddd\"};\n    sort_n(m, n_items);\n\n    for (i = 0; i < n_items;\
  \ i++) printf(\"%g \", m[i]);\n    printf(\"\\n\");\n\n    order_to(s, n_items);\n\
  \    for (i = 0; i < n_items; i++) printf(\"%s \", s[i]);\n    printf(\"\\n\");\n\
  }\n```\n\n### 插入法\n\n该排序方法的算法如下：最初，对数组的前两个元素进行排序，然后将第三个元素插入到相对于前两个元素的正确位置，继续将第四个元素插入到相对于前三个元素的正确位置。对于已排序的元素以此类推，直到到达矩阵的最后一个元素。该算法的伪代码如下：\n\
  \n```\n<function insert(包含 \"n\" 个元素的\"array\")>\n    [目标矩阵 z，其元素 s 为 0 , 1 , ...\
  \ , a n-1 ] i = 1\n    DO WHILE (i < n)\n        x = a[i]\n        将 x 插入到 0 和 a[i]\
  \ 之间的正确位置 \n    ENDDO\nEND <insert>\n```\n\n![](img/image18832.jpeg)![](img/image18833.jpeg)![](img/image18834.jpeg)![](img/image18835.jpeg)![](img/image18836.jpeg)![](img/image18837.jpeg)![](img/image18838.jpeg)\n\
  \n下图展示了应用 East 算法处理一组数字列表后的的结果：\n\n| 初始值： | 46 | 54 | 12 | 30 | 84 | 18 | 10 | 77\
  \ |\n| :--- | :--- | :--- | :--- | :--- | :--- | :--- | :--- | :--- |\n| | 46 |\
  \ 54 | 12 | 30 | 84 | 18 | 10 | 77 |\n| | 12 | 46 | 54 | 30 | 84 | 18 | 10 | 77\
  \ |\n| | 12 | 30 | 46 | 54 | 84 | 18 | 10 | 77 |\n| | 12 | 30 | 46 | 54 | 84 | 18\
  \ | 10 | 77 |\n| | 12 | 18 | 30 | 46 | 54 | 84 | 10 | 77 |\n| | 10 | 12 | 18 | 30\
  \ | 46 | 54 | 84 | 77 |\n| 组织后的值： | 10 | 12 | 18 | 30 | 46 | 54 | 77 | 84 |\n\n\
  ![](img/image18839.jpeg)![](img/image18840.jpeg)![](img/image18841.jpeg)\n\n实现 East\
  \ 算法用于数值排序值值列表的函数如下：\n\n```c\nvoid insert(double m[], int n_items)\n{\n    int i,\
  \ k; double x;\n    // 从第二个元素开始\n    for (i = 1; i < n_items; i++)\n    {\n    \
  \    x = m[i]; k = i-1;\n        // 如果 k=-1，说明到达了最左侧。\n        while (k >= 0 &&\
  \ x < m[k])\n        {\n            m[k+1] = m[k]; // 为插入留空位\n            k--;\n\
  \        }\n        m[k+1] = x; // 将 x 插入对应位置\n    }\n}\n```\n\n插入法的分析：\n\n| 情况\
