  \ 库中的一些函数。\nB. 成长环境。\nC. 字符代码。\n\n所有这些都通过大量的示例和已解决的练习记录，答案也附在 CD-ROM 中。显而易见，语言在历史上不断演变。这种演变的产物是\
  \ `C++` 语言，最后是用于开发图形界面应用程序（可视化编程）的大型函数库。因此，本书是三部曲中的第一本，按顺序涵盖了以下方面：使用 `C` 编程和面向 `C++`\
  \ 的编程。\n\n这是第一本，《`C/C++ 编程》。它涵盖了所有与 `C` 相关的结构化编程内容，以及动态数据结构的发展。为什么标题是 `C/C++`？因为\
  \ `C++` 是从 `C` 语言发展而来的，除了例外，它包含了 `C`。包含在 `C++` 中的这部分 `C` 被称为 C-，可以在 `C++` 下无问题地编译。然而，当\
  \ `C++` 用于其预期用途（即执行面向对象的编程任务）时，新的知识是大量的。\n\n前言 第 19 页\n\n![](img/image18417.jpeg)\
  \ 第二本，《`C++ 面向对象编程`》，正如其名，学习面向对象的应用程序开发。如果你的目标是开发视觉应用程序（如基于窗口的应用程序，即 Windows 应用程序），那么了解这项技术是至关重要的。\n\
  \n第三本，《`C++ 百全书`》，包含了前两本的内容，但采用了新的方法，因为在书的所有章节中，仅涉及 `C++` 库。\n\n另一方面，如果你想深入研究包括\
  \ UNIX 系统调用在内的 `C` 应用程序，我推荐 Francisco Márquez 写的《`UNIX 高级编程`》，该书也由 RA-MA 出版社出版。\n\
