  \ `0134` 是字面量：\n    a) 十进制。\n    b) 进制。\n    c) 十六进制。\n5. `17.24` 是字面量：\n    a)\
  \ `char`。\n    b) `int`。\n    c) `float`。\n6. 表达式是：\n    a) 变量。\n    b) 字符。\n  \
  \  c) 整数。\n    d) 值。\n7. 在赋值时，右部分的值被转换为左侧变量的类型，符合以下规则：\n    * 字符转换为整数，有或无符号扩展均可，取决于安装。通常转换带有符号扩展完成。\n\
  \    * 整数转换为字符，保留最低有效位，即丢弃权重过高的高位。\n    * 实数转换为整数，截断小数部分。\n    * `double` 变为 `float`，会进行舍入并丢失精度，因为\
  \ `double` 值可能无法精确表示。\n8. 它定义 `a = 5`, `b = 2` 且 `c = 0` 类型为 `int`。`c > b` 的值是：\n\
  \    a) 3。\n    b) 2。\n    c) 1。\n    d) 0。\n9. 它定义 `a = 5` 和 `b = 0` 类型为 `int`。`b++`\
  \ 的值是：\n    a) 4。\n    b) 0。\n    c) 6。\n    d) 5。\n10. 它定义 `to = 5` 类型为 `int`。`a/(double)2`\
  \ 的结果是：\n    a) 2。\n    b) 2.5。\n    c) 3。\n    d) 0。\n\n\n\n\n\n现在，如果一个程序包含几个函数，你选择从哪一个开始执行呢？执行\
  \ C/C++ 程序的入口点始终是 `main` 函数。因此，每个 C 或 C++ 程序都必须包含一个名为 `main` 的 `main` 函数，如下所示：\n\
  \n```c\nmain()\n{\n    // 在此处编写想要运行的代码\n}\n```\n\n`main` 后面的括号表示该标识符对应于一个函数。这适用于所有函数。在第一行代码的之前和之后，需要写一个开启的左大括号\
  \ - `{` - 这是程序开始执行的地方。然后编写执行所需任务的语句，并以一个关闭右大括号结束 - `}` - 这就是程序执行结束的地方。\n\n## 程序设计\n\
  \n如上所述，任何问题的解决方案都不应该立即考虑对应语言的语句层面，而应该考虑问题本身的自然元素，并以某种方式对其进行抽象，这将为上述函数的开发提供空间。\n\n\
  程序的自顶向下设计实际上在于，通过系统地将问题分解为日益简单的子问题，并应用“分而治之”的原则来找到问题的解决方案。\n\n这种程序开发技术的使用，以及仅使用三种结构——顺序、分支和重复——引导我们进入了所谓的结构化编程。这是开发本书所有示例时所使用的技术。\n\
  \n## 示例：温度转换\n\n为了解释 C 程序的结构，我们将提出一个简单的程序示例，展示摄氏度和华氏度之间的对应表。如下图所示：\n\n- -30 C, -22.00\
  \ F\n- -24 C, -11.20 F\n- ...\n- ...\n- 90 C, 194.00 F\n- 96 C, 204.80 F\n\n摄氏度与华氏度的关系由表达式\
  \ `fahrenheit = 9/5 * degrees centigrade + 32` 给出。将在 -30 到 100 摄氏度的区间内进行计算，增量为 6。\n\
  \n让我们分析这个问题。要问什么？计算 -30 C、-24 C、 ..., n 摄氏度、 ..., 96 C 对应多少华氏度。我们怎么做？对于 `nDegreesCentigrade`\
  \ 的每一个值（从 -30 到 100，增量为 6），都应用一次公式 `Fahrenheit degrees = 9/5 * nDegreesCentigrade\
  \ + 32`。为了清晰地理解这一点，让我们通过例子来思考问题；例如，当要求我们计算某个数 n 的对数时，我们会做什么？使用函数 `log`；如下如下：\n\n\
  ```c\nx = log(n)\n```\n\n同样，如果我们有一个 `convert` 函数来完成将 n 摄氏度转换为华氏度的计算，我们会写道：\n\n```c\n\
  Fahrenheit degrees = convert(nCelsiusDegrees)\n```\n\n![](img/image18479.jpeg) 几乎在没有意识的情况下，我们正将问题分解为更简单的子问题来解决。记住一个\
  \ C 程序必须有一个 `main` 函数，如果必要的话还有其他函数，那么上述语句在图形化上是什么样的？下面的图提供了该问题的答案：\n\n![](img/image18480.jpeg)\
  \ ![](img/image18481.jpeg) ![](img/image18482.jpeg)\n\n类似于我们处理对数函数的方式，在这里，从 `main`\
  \ 函数调用了 `convert` 函数，并将要转换的摄氏度值作为参数传递给它。对数函数返回过去值的对数结果。`convert` 函数返回与传递的摄氏度值对应的华氏度值。剩下的只需要可视化这个结果，并对描述的每个值重复该过程。头脑会想，我知道的所有过程可能都只使用\
  \ `main` 函数就能完成，这是肯定的。但，目的是让你清楚地看到，通常情况下，一个 C/C++ 程序是一组相互调用的函数，以获得所需的结果，而解决问题的简单方法是将其分解为更小的子问题，从而更容易修复；每个子问题将由一个\
  \ C 函数解决。\n\n## 自主函数\n\n另一个重要的细节是，我们写的函数必须是自主的，这样以后在其他程序中就可以顺利地使用它们。当一个函数完全仅取决于它自身的参数时，它是自主的。例如，无论对数函数的理由是什么，当我们调用它时，只需传递我们想要计算对数的值。我们的计算器不需要任何其他先验操作。函数不需要像我们写的那样执行，因为如果在传递参数之外，我们必须对其执行某些外部操作（例如在\
  \ `main` 中为函数的用户名声明确定变量），你就会忘记这个要求，这将成为错误的源头。另一方面，当一个函数是自主的时，我们只需要知道必须传递给它的值以及它返回什么结果；例如\
  \ `convert` 函数。\n\n## 实现\n\n一旦我们分析了问题，就可以编写代码了。现在重要的是学习程序的结构像什么样，而不是为什么要写某一句或某句，这个问题你将在本章及后续章节中学习。这个示例将作为最初编写你自己的程序的模板。\n\
  \n```c\n#include <stdio.h>\n\n/* 函数原型声明 */\nfloat convert(int c);\n\n#define INF\
  \ -30\n#define HIS P 100\n\nint main()\n{\n    int nDegreesCentigrade = 0;\n   \
  \ int increase = 6;\n    float Fahrenheit degrees = 0;\n\n    nDegreesCentigrade\
  \ = INF;\n    while (nDegreesCentigrade <= HIS P)\n    {\n        Fahrenheit degrees\
  \ = convert(nDegreesCentigrade);\n        printf(\"%10d C %10.2f F\\n\", nDegreesCentigrade,\
  \ Fahrenheit degrees);\n        nDegreesCentigrade += increase;\n    }\n    return\
  \ 0;\n}\n\nfloat convert(int c)\n{\n    float gfahr;\n    gfahr = (float)9 / (float)5\
  \ * c + 32;\n    return (gfahr);\n}\n```\n\n\n\n\n在编写 C 函数时，必须在编写第一个语句之前完成其定义和/或声明。相反，C++\
  \ 允许你在任何地方执行语句；也就是说，在我需要它的任何时刻都可以进行。\n\n### 预处理器指南\n\n这些指南的目的是便于程序的开发、编译和维护。指令是以字符\
  \ `#` 开头的，标识符。最常见的指令是包含指令 `#include` 和替换指令 `#define`。这些指南由预处理器（来自 `c`）进行处理，该预处理器是在编译器在翻译程序源代码之前被调用的。稍后，我们将专门用一个章节来详细介绍\
  \ C 预处理器的所有指令。\n\n### 包含指令\n\n通常，当函数在定义之前被调用时，有必要在调用之前包含该函数的原型。例如，观察上一个程序中的 `turn`\
  \ 函数。`turn` 的定义写在 `main` 函数之后，而 `main` 函数调用了 `convert` 函数。由于调用发生在定义之前，因此需要写该被调用函数的原型。这适用于所有函数，包括\
  \ C 库函数，如 `printf`。C 库文件的函数声明位于头文件中（以 `.h` 结尾的普通文件）。这些文件通常位于预定义的包含目录或工作目录中。\n\n\
  如前一节所述，要在第一次调用 C 库函数之前包含其声明，只需包含包含它的头文件即可。这通过以下两种方式之一的 `#include` 指令来完成：\n\n```\n\
  #include <stdio.h>\n#include \"misfuncs.h\"\n```\n\n如果头文件由字符 `< >` 界定，C 预处理器将直接在默认包含目录中查找该文件。如果文件由字符\
  \ `\" \"` 界定，C 预处理器将首先在当前工作目录中查找该文件，如果没有找到，将继续在预定义的包含目录中搜索。在任何情况下，如果找不到文件，它将显示错误。\n\
  \n逻辑上，通过此指令，你可以包含任何包含源代码的文件，无论其扩展名是什么。\n\n### 替换指南\n\n指令 `#define identifier value`\
  \ 告诉编译器程序中 `identifier` 的所有出现处必须替换为 `value`。这项工作是由预处理器完成的。例如：\n\n```c\n#define INF\
  \ -30\n#define SUP 100\n```\n\n当 C 预处理器处理上述示例中的指令时，源程序中 `INF` 和 `SUP` 的所有出现处将被替换为相应的值，这可以继续执行后续操作。\n\
  \n```c\nnDegreesCentigrade = -30;\nwhile (nCelsius Degrees <= 100)\n{\n    // ...\n\
  }\n```\n\n### 定义与语句\n\n声明向程序中引入一个或多个名称。声明是一个定义，除非没有内存分配，这种情况发生在：当函数被声明时、当定义一个新类型时、当声明一个类型的别名时，或者当在某处定义的变量使用了外部\
  \ `external` 修饰符使其变得可访问时（此处定义）。\n\n每个变量都必须在使用之前定义。变量的定义不仅声明了该变量，还为它分配了内存（在定义变量时，编译器会分配必要的字节来存储该类型的值）。此外，变量可以在其定义时初始化：\n\
  \n```c\nint nDegreesCentigrade = 0; \nint increase = 6;\nfloat Fahrenheit degrees\
  \ = 0;\n```\n\n函数定义声明了函数，并包含了函数体。同样：\n\n```c\nfloat convert(int gcent)\n{\n    float\
  \ gfahr;\n    gfahr = (float)9 / (float)5 * gcent + 32; \n    return (gfahr);\n\
  }\n```\n\n变量的声明或定义，以及函数的声明，可以在内部（函数定义内部）或外部（任何函数定义之外）完成。相反，函数的定义始终发生在外部（也就是说，函数不能包含另一个函数）。\n\
  \n### 简单语句\n\n单一语句是 C 程序中最小的可执行单元。语句控制执行的流或顺序。C 语句可以由以下部分组成：关键字（`for`、`while`、`if`\
  \ ... else` 等）、表达式、声明或函数调用。在编写语句时，请记住以下考虑因素：\n\n*   所有简单语句都以分号（`;`）结束。\n*   两个多个语句可以出现在同一行，通过分号隔开，尽管这种处理方式是不建议的，因为违背了阅读代码时所需的清晰度。\n\
  *   空语句由一个分号组成。当我们看到空语句时，就能看到它的用途。\n\n### 复合语句或块\n\n复合语句或块是组括在大括号 `{ }` 之间的简单语句的集合。一个块可以包含其他块。这种类型的示例是：\n\
  \n```c\nFahrenheit degrees = convert(nDegreesCentigrade);\nprintf(\"%d C %.2f F\\\
  n\", nDegreesigrade, Fahrenheit degrees);\nnDegreesigrade += increase;\n```\n\n\
  ### 函数\n\n函数是一个执行特定任务并用名称进行引用的语句块。该块是函数体，名称是函数名。当你编写一个函数时，除了函数体和函数名外，通常还需要指定参数和返回类型。例如：\n\
  \n```c\nfloat convert(int gcent)\n{\n    float gfahr;\n    gfahr = (float)9 / (float)5\
  \ * gcent + 32; \n    return (gfahr);\n}\n```\n\n参数是在函数被调用时传递给函数的值。该值将存储在函数对应的参数上。\n\
  \n### 函数声明\n\n函数的声明（也称为函数原型）不仅指示了函数名称，还指示了它有多少个参数以及参数的类型，以及返回值的类型。其语法为：\n\n`结果-类型\
  \ 函数-名称([ 参数列表 ]);`\n\n函数原型是一个模板，它被用于确保在函数定义之前编写的调用语句是正确的；也就是说，将相应的参数传递给指定的参数，并确保函数以及返回的值被正确处理。\n\
  \n类型和参数数量的检查允许在编译期间检测是否存在某些错误。\n\n例如，以下语句指示了在调用函数 `convert` 时，必须传递一个整数参数，该函数在执行完毕后将返回一个浮点数值。\n\
  \n```c\nfloat convert(int c);\n```\n\n\n\n总之，函数的声明允许在同一个地方知道该函数的特征，但并没有定义其要执行的任务。\n\
  \n函数可以隐式地或显式地声明。声明——**隐式语句**发生在函数被调用且没有通过 `(function prototype)` 进行预先声明时。在这种情况下，C\
  \ 语言默认假设函数原型的结果返回类型为 `int`，并且不检查参数列表。这迫使函数定义中的结果类型必须为 `int`，或者不指定；否则，将返回错误。例如，下面的定义指示该函数默认返回一个\
  \ `int`，所以它允许了隐式语句：\n\n```c\nfunction_x(int p1, float p2, char p3)\n{\n    // 通过省略，该函数返回的数值\n\
  \    // 在被调用时应该是 int 类型。\n}\n```\n\n我们到目前为止使用的 `main` 函数一直被假定是隐式声明的。也许，在解释了这些之后，你会问自己：为什么它不返回值呢（为什么它没有\
  \ return 语句）？仅仅因为没有返回值，程序本身就不包含对该函数的调用。\n\nC++ 不支持函数的隐式声明。因此，为了确保代码的可移植性，建议始终对函数进行显式声明。显式声明指定了函数参数的数量和类型，以及返回值的类型。例如，下面的原型指示\
  \ `function_x` 有三个类型参数 `int`、`float` 和 `char`，并且它应该返回一个 `float` 类型的结果。\n\n```c\n\
  float function_x(int p1, float p2, char p3);\n```\n\n参数列表通常由一组用逗号分隔的标识符及其类型组成。在函数原型的情况下，可以跳过标识符。例如：\n\
  \n```c\nfloat function_x(int, float, char);\n```\n\n另一方面，当指定它们时，它们的作用域限制在语句内；也就是说，它们在其他地方无法访问（它们的存在仅仅是为了使语法更清晰）。\n\
  \n由此可以推推出，在函数语句中使用的标识符和稍后在函数定义中使用的标识符并不一定意味着它们必须具有相同的名称。观察从之前的程序中转换的函数声明和定义的示例：\n\
  \n```c\nfloat convert(int c); /* 函数原型转换为 */\n\n// ...\n\nfloat convert(int gcent)\
  \ /* 函数定义转换为 */\n{\n    // ...\n}\n```\n\n参数的就绪也可以为空。例如：\n\n```c\nfloat function_x();\n\
  ```\n\n然而，在 ANSI C（美国国家标准协会）中，缺少参数表示数量是不确定的，而在 C++ 中这表示没有参数。因此，为了确保程序的可移植性，使用了关键字\
  \ `void`，它在所有情况下都表示没有参数：\n\n```c\nfloat function_x(void);\n```\n\n同样，为了指示函数不返回任何内容，也使用了关键字\
  \ `void`。例如：\n\n```c\nvoid function_x(void)\n```\n\n最后，当调用我们程序中定义的函数时，有必要将其原型添加到\
  \ C 库函数中吗？是的，是有必要的，完全就像任何其他函数一样。但不要担心，这项任务很容易，因为属于 C 标准库的函数声明（如 `printf`）是由头文件或\
  \ `.h` 文件提供的。因此，当程序使用（例如 `printf` 函数时，你会注意到它包含了头文件 `stdio.h`。\n\n```c\n#include\
  \ <stdio.h>\n```\n\n我们如何知道已定义函数的原型在哪个头文件中？因为在指定来自 C 的库函数语法时，我也知道它所声明的头文件。\n\n###\
  \ 函数定义\n\n函数的定义由函数头和封装在大括号之间的函数体组成。\n\n```c\nresult-type function-name ([ parameters\
  \ formal ])\n{\n    statements from variables local ; sentences ;\n    [return [(]\
  \ expression [)]];\n}\n```\n\n在函数体中声明的变量是局部变量，根据定义，它们只在同一个函数内部可访问。\n\n结果的类型指定了函数返回的数据类型。这可以是任何基本类型或派生类型，但不能是数组或函数。是的，如果没有指定，我假设是\
  \ `int`。为了指示不返回任何内容，使用了关键字 `void`。例如，下面的函数不接受参数也不返回任何值：\n\n```c\nvoid message(void)\n\
  {\n    printf(\"计算过程中发生错误\\n\");\n}\n```\n\n函数的结果通过 `return` 语句返回到调用点。`return` 语句的语法如下：\n\
  \n```c\nreturn [(] expression [()];\n```\n\n`return` 语句可以不是最后，也可以出现在函数体的任何位置。\n\n\
  ```c\nint function_x(int p1, float p2, char p3)\n{\n    // ...\n    if (a < 0) return\
  \ 0;\n    // ... return 1;\n}\n```\n\n在前面的示例中，如果 `a < 0`，函数返回 0 并结束执行；如果 `a >= 0`，执行继续并返回\
  \ 1。这就是我们在语句中说的。\n\n### 函数调用\n\n调用函数与执行函数等同。调用可以从另一个函数发出，或者正如我们以后看到的，甚至从自身发出。该调用由函数名后跟一组在括号内并用逗号分隔的参数组成。例如：\n\
  \n```c\n/* 调用 convert 函数 */\nFahrenheit degrees = convert(nDegreesCentigrades);\n\
  ```\n\n参数 `nCentigradeDegrees` 是变量，在逻辑上存储了你想传递给 convert 函数的数据。一旦 convert 函数执行完毕，它返回的结果就会存储在指定的变量\
  \ `Fahrenheit degrees` 中。\n\n#### main 函数\n\n每个 C 程序都有名为 `main` 的函数，且只有一个。该函数是程序的入口点也是出口点。它的定义如下所示：\n\
  \n```c\nint main(int argc, char *argv[])\n{\n    // 函数体\n}\n```\n\n\n\nA) 是的本身，C++\
  \ 允许你指定 `main` 不返回返回值：\n\n```\nvoid main()\n{\n// 函数体\n}\n```\n\n在另一种情况下，在东部案例中，ANSI\
  \ C 编译器会显示一个警告，指示 `main` 没有返回 `int`。\n\n### A 示例\n\n为了澄清上述内容，我们将创建一个包含三个函数的简单程序：`main`、`add`\
  \ 和 `subtract`。`add` 函数将接收两个实数值作为参数并返回它们的和。同样，`subtract` 将返回减法结果。该程序的代码可能如下：\n\n\
  ```c\n#include \"stdio.h\"\n\ndouble add(double, double); double subtract(double,\
  \ double);\n\nmain()\n{\n    double op1 = 225, op2 = 100, result = 0;\n    // 加法\n\
  \    result = add(op1, op2); printf(\"Sum = %g\\n\", result);\n    // 减法\n    result\
  \ = subtract(op1, op2); printf(\"Subtract = %g\\n\", result);\n}\n\ndouble add(double\
  \ x, double and)\n{\n    double z;\n    z = x + and; return z;\n}\n\ndouble subtract(double\
  \ x, double and)\n{\n    double z;\n    z = x - and; return z;\n}\n```\n\n执行程序：\n\
  \nSum = 325\n\n当我们运行上述程序时，执行从 `main` 开始。该函数首先定义了变量 `op1`、`op2` 和 `result`。然后调用 `add`\
  \ 函数并传递了值 `op1` 和 `op2`；第一个值被复制到你的第一个参数 `x`，第二个值被复制到它的第二个参数 `y`。函数 `Add` 根据这些值计算和，存储在它的局部变量\
  \ `z` 中，并返回该结果，从而结束执行。返回值存储在 `main` 的局部变量 `result` 中。随后 `Main` 然后调用 `printf` 函数并显示存储在\
  \ `result` 中的值。最后，重复描述的过程，但现在调用 `subtract` 函数来执行减法。注意在最后这次计算中结果值发生了变化，存储了余数的结果。\n\
  \n### 向函数传递参数\n\n当函数被调用时，调用中的第一个参数传递给函数的第一个参数，第二个参数传递给第二个参数，依此类推。默认情况下，除数组外的所有参数都是按值传递的。这意味着函数接收的是参数值的副本。这假设被调用的处理的是副本，无法改变值来源的变量。\n\
  \n在接下来的示例中，你可以看到函数 `main` 调用函数 `exchange` 并传递了参数 `a` 和 `b`。`exchange` 函数在 `x` 处存储\
  \ `a` 的值，在 `y` 处存储 `b` 的值。这意味着数据 `a` 和 `b` 被复制了。\n\n```c\n/* value.c - 按值传递参数 */\n\
  #include <stdio.h>\n\nvoid swap(int, int); /* 函数原型 */\nmain()\n{\n    int to = twenty,\
  \ b = 30;\n    ![](img/image18492.jpeg)exchange(to, b); /* to 和 b 被按值传递 */ printf(\"\
  a okay %d and b okay %d\\n\", to, b);\n}\n\nvoid exchange(int x, int and)\n{\n \
  \   int z = x; x = and;\n    and = z;\n}\n```\n\n让我们从图形角度来看。假设下图表示我们的程序使用的计算机段内存。当\
  \ `main` 函数的执行开始时，变量 `a` 和 `b` 被定义并分别从 20 和 30 开始。当 `main` 调用函数 `exchange` 时，定义了两个新变量\
  \ `x` 和 `y`，分别用 `to` 和 `b` 的值初始化。结果如下：\n\n![](img/image18493.jpeg)\n\nswap 继续执行。定义了一个新变量\
  \ `z`，初始值为 `x` 的值。接下来，`y` 的值被复制到 `x`，`y` 的值被复制到 `y`（来自 `z`，即最初的 `x`）。从图形上看结果如下：\n\
  \n![](img/image18494.jpeg)\n\n`swap` 函数的参数 `x` 和 `y` 是该函数的局部变量；`z` 也是。这意味着它们仅在函数内部是可以访问的。这意味着局部变量在运行函数时创建，在函数执行结束时销毁。因此，一旦执行流返回\
  \ `main` 函数，因为 `exchange` 已结束，内存状态保持不变。（此处原文中存在重复的句子已去重）。\n\n\n\n\n```c\nand = z;\
  \ /* contents from and = z */ own\n```\n\n![](img/image18497.jpeg)1638250 1638258\n\
  \n| twenty | and |\n| | 1638258 |\n\n当 `swap` 函数结束时，`a` 和 `b` 的值已经交换了。由于 `and` 以及变量\
  \ `z`、`x` 和 `and` 是局部变量，它们会被销毁。\n\n因此，通过引用向函数传递参数是为了让函数间接地访问所传递的变量；这与按值传递参数不同，这样就不会产生数据冗余。\n\
  \n生活中的一个普通例子可以解释这一点。个人 `A` 在 `C` 地中执行了一个程序。随后，他通过电子邮件将一个副本发送给另一个个人 `B` 进行校正。显然，个人\
  \ `B` 在收到的副本上执行的修正操作不会改变 `A` 手有的那一个。\n\n现在，如果不是发送副本，而是 `A` 告诉 `B` 连接到他的机器 `190.125.12.78`，并纠正存储在这个或或那个文件夹中的程序，那么\
  \ `A` 和 `B` 都在同一个程序副本上工作。这就是引用传递参数时发生的情况。\n\n涉及到 `C` 库函数时，你也将遇到这两种情况。例如，假设你想写一个程序，读取两个值到\
  \ `a` 和 `b`，并写出它们的和。解决方案如下：\n\n```c\n/* add.c - Add two values */\n#include <stdio.h>\n\
  \nmain()\n{\n    int a = 0, b = 0, s = 0;\n    printf(\"Values from to and b: \"\
  );\n    scanf(\"%d %d\", &to, &b); /* read from the keyboard to and b */\n    s\
  \ = to + b;\n    printf(\"The sum is %d\\n\", s);\n}\n```\n\n该程序的执行结果可能是这样的：\n\n\
  Values from to and b: 10 20 [Enter] The sum is 30\n\n`scanf` 函数读取键盘输入的值并将其赋值给指定的变量；在示例中，赋值给变量\
  \ `a` 和 `b`。现在注意这些变量，它们是按引用传递而非按值传递，这是符合逻辑的，因为 `a` 和 `b` 是 `main` 的局部变量，它们的值必须通过\
  \ `scanf` 赋值。相比之下，`printf` 函数打印指定表达式的值；在这种情况下，是按值传递的变量 `s`，这同样符合逻辑，因为 `s` 是 `main`\
  \ 的局部变量，它的值不需要被 `printf` 修改，它只是被获取并可视化。\n\n此外，后续我们将详细学习 `printf` 和 `scanf` 函数。\n\
  \n### 由多个文件组成的 C 程序\n\n从我们所看到的，一个 `C` 程序是一组相互调用的函数（称为 `main`）。我们不应该认为整个程序必须写在单个\
  \ `.c` 文件中。事实上，在实践中情况并非如此，因为除了 `.c` 文件之外，还涉及一个或多个头文件（`.h`）。例如，在最近的程序中，`add.c` 和\
  \ `stdio.h` 文件的作用是清晰的，但是，\n\n`C` 库中的函数代码来自哪里？程序 `add` 调用了两个 `C` 库函数 `scanf` 和 `printf`，这两个函数并没有写在\
  \ `sumar.c` 文件中，而是写在另一个独立的文件中，该文件是 `C` 库的一部分，在构建过程中被访问。链接到这些函数对应的代码。同样，我们可以这样做；即我们可以选择将感兴趣的函数写在一个或多个独立文件中，并使用一个或多个头文件进行声明和定义。\n\
  \n源文件可以包含编译器指令、声明和定义的任何组合。但是，一个函数或结构不能拆分在两个源文件之间。另一方面，源文件不需要包含可执行语句；例如，一个源文件可以仅由其他源文件中使用的变量定义组成。\n\
  \n作为上述内容的示例，我们将编写一个 `C` 程序，显示三个给定值中的最大值。为了实现这一点，我们将写一个 `max` 函数语句，返回作为调用参数传递的两个值中的较大者。该函数将被\
  \ `main` 函数调用两次：第一次计算前两个值中的较大值，第二次计算上一次结果与第三个值之间的较大值。所有三个值都将通过键盘输入。相应的代码写写两个文件中：\n\
  \n*   `module01.c` 文件包含 `main` 函数。\n*   `module02.c` 文件包含 `max` 函数。\n\n```c\n/*\
  \ module01.c */\n#include <stdio.h>\n\nmain()\n{\n    int a = 0, b = 0, c = 0, higher\
  \ = 0;\n    printf(\"Values a, b and c: \");\n    scanf(\"%d %d %d\", &a, &b, &c);\n\
  \    higher = max(a, b);\n    higher = max(higher, c);\n    printf(\"Greater = %d\\\
  n\", higher);\n}\n```\n\n```c\n/* module02.c */\n#include <stdio.h>\n\nint max(int\
  \ x, int y)\n{\n    int z = 0;\n    if (x > y)\n        z = x;\n    else\n     \
  \   z = y;\n    return z;\n}\n```\n\n编译由多个文件组成的程序，必须单独编译这些文件，然后将它们链接形成一个单一的可执行文件。例如，使用以下命令：\n\
  \n`cl modulo01.c modulo02.c -o major`\n\n`cc modulo01.c modulo02.c -o major`\n\n\
  ![](img/image18498.jpeg)1638250 1638258 (Note: Simplified)\n\n\n\n\n如果变量在块内部声明，则对该变量的访问仅限于该块以及该声明点之后包含在内的块。在这种情况下，变量将接收\
  \ `local`（局部）或 `automatic`（自动）限定符。\n\n局部变量从其声明点开始到其定义的最终块结束存在并具有值。每当运行该块时，局部变量都会被重新定义；当自身执行结束时，局部变量即消失。因此，局部变量仅在它所属的块内部可访问。\n\
  \n示例展示了变量的作用范围，取决于它们是定义在块内还是块外。在这个示例中，通过对变量范围的解析，我们区分出四个层次：\n\n*   外部层（所有块之外）。在此层级定义的变量从定义点开始直到程序结束都可以都可以访问。\n\
  *   来自 `main` 函数的块层。在此层级定义的变量仅在其自身的 `main` 函数中可以访问，因此在块 1 和块 2 中是可以访问的。\n*   块 1\
  \ 层（复合判断语句）。在此层级定义的变量仅在块 1 内部可以访问，因此在块 2 中可以访问。\n*   块 2 层（复合判断语句）。在此层级定义的变量仅在块\
  \ 2 内部可以访问。\n\n```c\n/*  vars01.c  -全局与局部变量\n\n![](img/image18505.jpeg)*/\n\n#include\
  \  <stdio.h>\n\n/*  从 var1 定义 什么是全局变量  */ int  var1  =  fifty;\n\nmain()\n\n{  /*\
  \  从 main 和程序开始  */\n\nprintf(\"%d\\n\",  var1);  /* 写入 fifty  */\n\n{  /*  开始块\
  \ 1  */\n\n/* 将 var1 和 var2 定义为块 1 和块 2 的局部变量  */\n\nint  var1  =  100,  var2  =\
  \  200;\n\nprintf(\"%d  %d\\n\",  var1,  var2);  /* 写入 100 和 200  */\n\n{  /*  开始块\
  \ 2  */\n\n/*  局部变量 var1 的重定义  */ int  var1  =  0;\n\nprintf(\"%d  %d\\n\",  var1,\
  \  var2);  /* 写入 0 和 200  */\n\n}  /*  结束块 2  */\n\nprintf(\"%d\\n\",  var1);  /*\
  \ 写入 100  */\n\n}  /*  结束块 1  */\n\nprintf(\"%d\\n\",  var1);  /* 写入 fifty  */\n\
  \n}  /*  结束 main 和程序  */\n```\n\n全局变量和局部变量可以具有相同的名称，但它们互不相关，这导致全局变量在同名局部变量的作用域内被屏蔽（nullified）。我所观察的示例展示了在之前的程序中\
  \ `var1` 发生了什么。\n\n在函数声明或函数原型定义的参数列表中声明的参数，其作用范围仅限于声明本身，即函数的定义。例如：\n\n```c\nint\
  \  max(int  x, int  and);  /* max 函数的语句 */\n```\n\n`max` 函数声明中的 `x` 和 `y` 参数被限制在语句本身。由于由于原因，它们可以省略；也就是说，下行代码等同于上方：\n\
  \n```c\nint  max(int, int);  /* max 函数的语句 */\n```\n\n在函数的定义参数列表中声明的形式参数是该函数的局部变量。例如：\n\
  \n```c\nint  max(int  x, int  and)  /* max 函数的定义 */\n\n{\n\nint  z  =  0;\n\nz \
  \ =  (x  >  and)  ? x : and; return  z;\n\n}\n```\n\n函数 `max` 定义中的 `x` 和 `y` 是函数的局部变量；也就是说，`x`\
  \ 和 `y` 在调用函数执行时创建，在函数执行结束时消失。这就是为什么 `x` 和 `y` 仅在自身的函数内部可访问的原因。\n\n### 变量存储类的的启示\n\
  \n默认情况下，所有变量都关联有一个存储存储类。这决定了变量的访问性和存在性。变量的访问性和存在概念可能会受到限定符的影响：\n\n`auto` 和 `register`\
  \ 限定符只能用于局部变量。存储类决定了变量的访问性和存在性。变量的访问性和存在概念可能会受到限定符的影响：\n\n全局变量要么被初始化，要么因为是全局变量而自动被赋值为\
  \ 0。以下由两个源文件 `one.c` 和 `two.c` 组成的示例展示了 `extern` 是可见的。`two.c` 中的 `extern` 声明允许 `two.c`\
  \ 中的函数访问 `one.c` 中的全局变量 `var`。\n\n```c\n/************************************************************\n\
  /* File one.c\n*****************************************************************/\n\
  \n#include <stdio.h>\n\nvoid function_1();\nvoid function_2();\n\nextern int var;\n\
  \nint var = 5;\n\nvoid function_1()\n{\n    var++;\n    printf(\"%d\\n\", var);\n\
  }\n\nmain()\n{\n    function_1();\n    function_2();\n}\n```\n\n```c\n/************************************************************\n\
  /* File two.c\n*****************************************************************/\n\
  \n#include <stdio.h>\n\nvoid function_1();\nvoid function_2();\n\nextern int var;\n\
  \nvoid function_2()\n{\n    var++;\n    printf(\"%d\\n\", var);\n}\n\nmain()\n{\n\
  \    function_1();\n    function_2();\n}\n```\n```\n\n\n\n\n\n### 局部变量的限定符\n\n对于局部变量，我知道它们可以使用四种限定符中的任何一个，或者跳过限定符，在这种情况下它被视为\
  \ `car`（自动或局部）。\n\n声明为 `auto` 的局部变量仅在定义所在的块内可见。这些类型的变量不会自动初始化，因此需要显式地对它们赋值。建议始终对它们进行初始化。\n\
  \n声明为 `static` 的局部变量仅在定义的块内可见；但与自动变量不同，它的生命周期是永久的。它不会在包含它的块执行开始和结束时出现或消失。\n\n声明为\
  \ `static` 的变量只初始化一次，即在 `Program` 开始执行时，并且每次运行包含它的块时都不会重启，而是下一次执行该块时将从该变量在上一次执行结束时的值开始。如果变量没有显式初始化，`C`\
  \ 将其自动初始化为 `0`。\n\n声明为 `register` 的局部变量是对编译器的一种建议，建议尽可能将该变量存储在机器寄存器中，这将产生更短、更快的程序。用于此类变量的可用记录数量取决于机器。如果无法将变量存储在寄存器记录中，我知道它将得到与自动变量相同的处理。这种声明对于\
  \ `int` 类型和指针类型的变量是有效的，取决于记录的大小。\n\n在局部声明为 `extern` 的变量指的是程序任何部分中全局定义的同名变量。在这种情况下，`extern`\
  \ 的目的是为了在没有定义该全局变量函数或模块中访问它。接下来的示例将清楚地说明之前揭示的内容。\n\n```c\n/* vars02.c - 局部变量：存储类的教训\
  \ */\n\n#include <stdio.h> \nvoid function_1();\n\nmain()\n{\n    /* 我认为 var1 定义在其他地方语句\
  \ */\n    extern int var1;\n\n    /* 静态变量 var2：仅在 main 内部可见。其初始值为 0。 */\n    static\
  \ int var2;\n\n    /* 我知道 var3 对应一个记录是可能的 */\n    register int var3 = 0;\n\n   \
  \ /* var4 默认声明为 car（自动） */\n    int var4 = 0;\n\n    var1 += two;\n\n    /* 我知道它们写入的值\
  \ 7, 0, 0, 0 */\n    printf(\"%d %d %d %d\\n\", var1, var2, var3, var4); \n    function_1();\n\
  }\n\nint var1 = 5;\n\nvoid function_1()\n{\n    /* 我知道定义了局部变量 var1 */\n    int var1\
  \ = fifteen;\n\n    /* 静态变量 var2；仅在东块内可见 */\n    static var2 = 5;\n\n    var2 +=\
  \ 5;\n\n    /* 我知道它们写入的值 fifteen, 10 */ \n    printf(\"%d %d\\n\", var1, var2);\n\
  }\n```\n\n在这个示例中，全局变量 `var1` 定义在 `main` 函数之后。因此，为了在 `main` 中访问它，使用了 `extern` 声明。在\
  \ `main` 中声明为 `static` 的变量 `var2` 默认从 `0` 开始。`var3` 的存储类型是 `register`，而 `var4` 是\
  \ `car`。\n\n在 `function_1` 中定义了局部变量 `var1`；此定义隐藏了同名的全局变量，使其在该块内不可访问。声明为 `static`\
  \ 的变量 `var2` 初始化为 `5`。此定义与 `main` 函数中的变量 `var2` 不产生冲突，因为它们都是局部的。接下来，`var2` 加了 `5`。那么下次调用\
  \ `function_1` 时，它将从 `var2` 等于 `10` 开始执行，因为 `static` 局部变量会保留上一次执行中获得的值供下次使用。\n\n\
  ### 函数的限定符\n\n所有函数都是全局的；也就是说，函数不能定义在块内部。\n\n带有 `static` 限定的函数仅在其定义的源文件中可见。相反，如果限定为\
  \ `extern`，则可以在组成 `Program` 的所有源文件中访问。对函数进行 `static` 或 `external` 限定可以在函数原型或函数定义中进行。在默认情况下，函数是\
  \ `extern`。例如，以下语句表明 `function_1` 是 `static` 的。\n\n```c\nstatic void function_l();\n\
