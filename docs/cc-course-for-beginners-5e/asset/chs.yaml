  \ = (Data *)malloc(sizeof(Data)); if (!student) error();\n        strcpy(student->name,\
  \ name); student->note = note;\n        code = insert(student, &root); if (code\
  \ == two) // already exists\n        {\n            // Yes 已存在，我们区分两种情况：\n     \
  \       // 1. note new >= 0; 我们更改了成绩\n            // 2. note new < 0; 我们删除了节点\n\
  \            if (note >= 0)\n            {\n                help = (Data *)find(student,\
  \ root); aux->note = note;\n            }\n            else\n            {\n   \
