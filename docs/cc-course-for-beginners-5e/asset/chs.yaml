  \n### 格式\n\n`printf` 函数从 `stdin` 读取内容，解释它们并存储在内存中。参数通过引用传递。`printf` 函数用于将数据输出到屏幕。`printf`\
  \ 函数用于将数据输出到标准输出。`printf` 函数用于向标准输出打印格式化字符串。`printf` 函数返回打印的字符数。如果发生错误，它返回一个负值。\n\
  \n`printf` 函数也用于格式化字符串。格式字符串可以包含格式说明符，这些说明符由传递给 `printf` 的参数替换。格式说明符包括 `%d`, `%f`,\
  \ `%s`, `%c` 等。\n\n`scanf` 函数用于从标准输入读取。格式字符串可以包含格式说明符，这些说明符由传递给 `scanf` 的参数替换。格式说明符包括\
  \ `%d`, `%f`, `%s`, `%c` 等。`scanf` 函数返回成功读取的项目。如果发生错误，它返回 `EOF`。\n\n`scanf` 函数也用于格式化字符串。格式字符串可以包含格式说明符，这些说明符由传递给\
  \ `scanf` 的参数替换。格式说明符包括 `%d`, `%f`, `%s`, `%c` 等。\n\n`sprintf` 函数用于将格式化字符串写入缓冲区。格式字符串可以包含格式说明符，这些说明符由传递给\
  \ `sprintf` 的参数替换。格式说明符包括 `%d`, `%f`, `%s`, `%c` 等。`sprintf` 函数返回写入的字符数。\n\n`snprintf`\
  \ 函数用于将格式化字符串写入缓冲区，并限制写入的字符数。这可以防止缓冲区溢出。`snprintf` 函数返回实际写入的字符数。\n\n`fprintf` 函数用于将格式化字符串写入文件。格式字符串可以包含格式说明符，这些说明符由传递给\
  \ `fprintf` 的参数替换。格式说明符包括 `%d`, `%f`, `%s`, `%c` 等。`fprintf` 函数返回写入的字符数。\n\n`fprintfn`\
  \ 函数将格式化字符串写入文件，并限制写入的字符数。这可以防止缓冲区溢出。`fprintfn` 函数返回实际写入的字符数。\n\n`vprintf` 函数使用参数列表打印格式化字符串。格式字符串可以包含格式说明符，这些说明符由传递给\
  \ `vprintf` 的参数替换。格式说明符包括 `%d`, `%f`, `%s`, `%c` 等。`vprintf` 函数返回打印的字符数。\n\n`vsnprintf`\
  \ 函数使用参数列表将格式化字符串写入缓冲区，并限制写入的字符数。这可以防止缓冲区溢出。`vsnprintf` 函数返回实际写入的字符数。\n\n`vfprintf`\
  \ 函数使用参数列表将格式化字符串写入文件。格式字符串可以包含格式说明符，这些说明符由传递给 `vfprintf` 的参数替换。格式说明符包括 `%d`, `%f`,\
  \ `%s`, `%c` 等。`vfprintf` 函数返回写入的字符数。\n\n`strtok` 函数将字符串拆分为标记。字符串根据提供的分隔符进行拆分。第一次调用\
  \ `strtok` 取要拆分的字符串，后续调用传递 `NULL` 继续拆分同一个字符串。`strtok` 函数返回第一个标记的指针。\n\n`strstr`\
  \ 函数用于在另一个字符串中查找子字符串的首次出现位置。它返回子字符串起始位置的指针，如果未找到，则返回 `NULL`。\n\n`strchr` 函数用于查找字符串中字符的首次出现位置。它返回该字符的指针，如果未找到，则返回\
  \ `NULL`。\n\n`strrchr` 函数用于查找字符串中字符的最后出现位置。它返回该字符的指针，如果未找到，则返回 `NULL`。\n\n`strcmp`\
  \ 函数用于比较两个字符串。如果字符串相等，返回 0；如果第一个字符串按字典序大于第二个，返回正值；如果第一个字符串按字典序小于第二个，返回负值。\n\n`strncmp`\
  \ 函数用于比较指定长度内的两个字符串。如果字符串相等，返回 0；如果第一个字符串按字典序大于第二个，返回正值；如果第一个字符串按字典序小于第二个，返回负值。\n\
  \n`strcpy` 函数用于将一个字符串拷贝到另一个。它返回目标指针。\n\n`strncpy` 函数用于将一个字符串拷贝到另一个，并限制拷贝的字符数。这可以防止缓冲区溢出。\n\
  \n`strcat` 函数用于拼接字符串。它将第二个字符串附加到第一个字符串后面。它返回拼接字符串的指针。\n\n`strncat` 函数用于拼接两个字符串，并限制拷贝的字符数。这可以防止缓冲区溢出。\n\
  \n`strlen` 函数用于查找字符串的长度。它返回字符串中的字符个数，不包括空终止符。\n\n`malloc` 函数用于在堆上分配一块内存。它返回分配内存的指针，如果分配失败，则返回\
  \ `NULL`。\n\n`calloc` 函数用于在堆上分配多个内存块并将其初始化为零。它返回分配内存的指针，如果分配失败，则返回 `NULL`。\n\n`realloc`\
  \ 函数用于调整之前分配的内存的大小。它返回新调整内存的指针，如果调整失败，则返回 `NULL`。\n\n`free` 函数用于释放之前分配的内存。\n\n`assert`\
  \ 函数用于创建调试断言。如果传递给 `assert` 的表达式为假，程序将带有错误信息终止。\n\n`exit` 函数用于正常终止程序。它接受一个状态码作为参数。\n\
  \n`setjmp` 和 `longjmp` 用于非局部跳转。`setjmp` 保存当前环境，`longjmp` 跳回该环境。\n\n\n\n\n上述示例中的第一个语句在语句的格式规范之间没有包含分隔符。这使得在输入时，数值\
  \ `yes` 必须至少用一个空格隔开以区分彼此，但对于字符 `'z'` 则不如此。如果你在 `z` 之前输入一个空格，变量 `c` 将被赋值为空而不是 `z`。第二个句子将字符\
  \ `\"comma\"`（逗号）作为分隔符，在白色区域没有空格。因此，由于上述原因，我们无法在字符 `z` 之前过滤掉白色区域空格。\n\n当程序调用输入函数（如\
  \ `scanf`）时，该程序的执行会停止，直到我们输入要输入的数据。输入数据并按下回车键。输入的数据不会立即赋值给指定的变量并进行处理；想象一下，如果这样做，我们将没有机会纠正错误数据。实际上，数据存储在与\
  \ `stdin` 关联的缓冲区，并在按下回车键时发送到中央处理器以赋值给变量并进行处理。这些数据按照其写入的方式，显示在显示器上，以便我们看到正在输入的内容。\n\
  \n![](img/image18526.jpeg)![](img/image18527.jpeg)\n\n![](img/image18528.jpeg)如上所述，缓冲区实际的内容是一个字符字符串。为了区分字符串中的不同数据，我们通用的使用字符\
  \ `res`，统称为空白（空格、换行等）。例如，当我想运行一个判断时：\n\n```c\nscanf(\"%d %F %c\", &to, &b, &c);\n\
  ```\n\n我们所做的是对从输入输入字符链的请求做出响应。类似于接下来，通过按下回车键结束：\n\n5 23.4 z [Enter]\n\n空白链也可能引入如下情况：\n\
  \n5 [Enter] 23.4 [Enter] z [Enter]\n\n区别在于，现在分隔符是换行符，而不是白色区域的空格。\n\n按下回车键后，`scanf`\
  \ 的工作是从缓冲区中读取字符并将它们转换为存储它们的变量所需的指定格式。在正常情况下，当遇到分隔符时，变量的赋值就会结束。这一过程对每个指定的变量都会重复。\n\
  \n当所有变量都已赋值，或者读取到的字符与格式指定的输入数据不匹配时，`scanf` 函数的执行结束。例如，对于上述相同的语句，我们引入数据：\n\nfive\
  \ 23.4 z [Enter]\n\n`scanf` 的执行被中断，因为格式 `%d` 期望一个形成整数的有效字符，而 `'c'` 不是。结果是没有赋值，且执行继续到程序的下一语句，变量\
  \ `a`、`b` 和 `c` 此时保持原来的值。是的，我们引入数据：\n\n5 tm 23.4 z [Enter]\n\n`scanf` 的执行被中断，因为格式\
  \ `%f` 期望一个形成实数的有效字符，而 `'t'` 不是。结果是 `a` 等于 5，且 `b` 和 `c` 都没有被赋值。执行继续进程中的下一个语句，变量\
  \ `a`、`b` 和 `c` 保持原来的值。是的，我们引入数据：\n\n5 23.4 z [Enter]\n\n我给变量 `to` 赋值整个 5，给 `b`\
  \ 赋值实数 23，给 `c` 赋值逗号（','）。最终结果将出乎意料，因为这些并不是想要读取的值。\n\n记住 `scanf` 函数会从读取的数据中返回的数量并赋值。是的，我们写了这些句子：\n\
  \n```c\nint to, r; float b; char c;\n// ...\n\nr = scanf(\"%d %F %c\", &to, &b,\
  \ &c);\n```\n\n`r` 的值可能是 0、1、2 或 3。例如：\n\n| 输入 | 返回值 ( r ) |\n| :--- | :--- |\n\
  | 5 23.4 z [Enter] | 3 |\n| five 23.4 z [Enter] | 0 |\n| 5 tm 23.4 z [Enter] | 1\
  \ |\n| 5 23.4 z [Enter] | 3 |\n\n不，我可以写如下的判断：\n\n```c\nscanf(\"Enter the values\
  \ from to, b and c: %d %F %c\", &to, &b, &c);\n```\n\n因为这种处理方式不会显示指定的消息，而是会强制写入字符串\
  \ “ Enter the values from to, b and c: %d %F %c ”。\n\n\n\n```c\nprintf(\"Press \
  \ <Enter>  for  continue  \");  scanf(\"%c\",  &car);\n```\n\n当我知道执行这些句子时，我知道它们将视觉化消息，\n\
  \n按下 `<Enter>` 继续 (`continue`)\n\n并且只要 `scanf` 从缓冲区中没有可读的字符，它就会保持暂停。当我们按下回车键时，我们会向输入缓冲区发送一个换行字符\
  \ `line`，该字符将被 `scanf` 函数读取并赋值给变量 `car`，从而恢复 `Program` 的执行。\n\n### 文件结束符 (CHARACTER\
  \ FINISH FROM FILE)\n\n从应用程序开发者的角度来看，输入或标准输出由 C 语言处理就像处理磁盘上的数据文件一样，但实际上它更像是一个信息的集合。我们在键盘上输入的数据是信息的集合，而我们在显示器上可视化的数据也是信息的集合。\n\
  \n![](img/image18531.jpeg)[](Images/image18532.jpeg)[](Images/image18533.jpeg)[](Images/image18534.jpeg)文件结束\
  \ (end of file)\n\n![](img/image18535.jpeg)[](Images/image18536.jpeg)文件开始 (Beginning\
  \ the file)\n\n每个文件都有开头和结尾。程序如何知道它正在从文件中读取数据、是否已经到达了末尾并且没有更多数据了呢？通过文件结束标记（end-of-file\
  \ mark）。对于磁盘上记录的文件，该标记将写在它的末尾。对于键盘信息，它来自于我们的输入，因此如果我们的程序需要检测文件结束标记，我们必须在完成信息输入时输入它。这通过在\
  \ UNIX 上按下 `Ctrl+D` 键或在 Windows 控制台应用程序上按下 `Ctrl+Z` 来完成\n\n由于文件或设备始终通过流（stream）处理，因此，讨论流的结束等同于讨论文件的结束。因此，从现在起，每当我们对设备或文件执行某种操作时，我们将不加区别地称称为它们或代表它们的流。\n\
  \n记住，当 `scanf` 函数尝试读取文件结束字符时，会返回在 `stdio.h` 文件中定义的 `EOF` 常量。下面的示例是——如果消息“Price:\
  \ ”有响应，则写入“数据输入结束”（End of data entry）消息；否则，将写入输入的的价格。\n\n```c\n/*  eof.c\n*/\n\n\
  #include <stdio.h>\n\nmain()\n{\n\nint r = 0;\nfloat price = 0;\nprintf(\"Price:\
  \  \");\nr = scanf(\"%g\", &price);\n(r == EOF) ? printf(\"End  from  the  entry\
  \  from  data\\n\")\n: printf(\"%g\\n\", price);\n}\n```\n\n在后面的章节中，我们将使用文件结束字符来确定数字输入的结束条件，开头是不定的。\n\
  \n### 字符 \\n\n\n当通过键盘输入数据并按下回车键时，它也会引入字符 `\\n`。在输出时 `\\n` 产生 `CR+LF`（`CR` 是 ASCII\
  \ 13，`LF` 是 ASCII 10），而在输入时它对应于 `LF`；也就是说，C 语言表达式 `'\\n' == 10` 将得到结果 1。\n\n在某些情况下，这个字符\
  \ `\\n` 可能会产生不良影响。通过以下示例来解释这一点，最初，读取一个实数：\n\n```c\n#include <stdio.h> main()\n{\n\
  \nfloat price = 0;\nprintf(\"Price: \"); scanf(\"%g\", &price);\nprintf(\"Price\
  \  =  %g\\n\", price);\n}\n```\n\n当执行上一个程序的 `scanf` 函数时，如果我们输入 1000 并按下回车键，在读取之前，输入缓冲区（与\
  \ `stdin` 关联的缓冲区）中会有以下信息：\n\n| 1 | 0 | 0 | 0 | \\n | | | | | | | | | | | | | |\n\
  \n然后从读取，\n\n| \\n | | | | | | | | | | | | | | | | | | |\n\n字符 `\\n` 不是格式 `%g` 规范的有效字符；因此，这里的读取被中断了。如果随后执行另一个支持字符数据的输入语句，这个多余的字符可能会导致麻烦。例如，为了看到这一细节，我们将修改之前的程序：\n\
  \n```c\n#include <stdio.h> main()\n{\n\nfloat price = 0;\nprintf(\"Price: \"); scanf(\"\
  %g\", &price);\nprintf(\"Price  =  %g\\n\", price);\n}\n```\n\n（注：原文中存在大量重复和损坏内容，译文已提取并整理唯一的逻辑部分。）\n\
  \n\n\n在之前的示例中，变量 `car` 被定义为 `char` 类型而非 `int`。这并没有改变结果，因为正如我们在第 2 章中所说的，`int` 类型的数据在转换为\
  \ `char` 时会保留低位位；也就是说，舍弃多余的高位位。同样，可以观察到，取决于显示 `car` 时使用的格式（`%c` 或 `%d`），结果可以是字符本身，也可以是其\
  \ ASCII 值。在内部，从计算机内存来说，它只是由 0 和 1 组成的（`01100001`）。\n\n假设 `stdin` 缓冲区为空，当在上面的程序调用\
  \ `getchar` 函数时，它的执行将停止，直到我们输入一个字符并按下回车键。读取到的字符将存储在变量 `car` 中。判断引用是否结束的方法等同于其他：\n\
  \n```c\nscanf(\"%c\", &car);\n```\n\n因此，`scanf` 对于字符 `\\n` 和文件结束符的所有规则也适用于 `getchar`。\n\
  \n### 向标准输出写入一个字符\n\n为了向标准输出（`stdout`）写入字符，C 语言提供了 `putchar` 函数。每当执行 `putchar` 函数时，都会向显示器写入一个消息。字符将延续上一次写入的内容。该函数的语法如下：\n\
  \n```c\n#include <stdio.h>\nint putchar(int c);\n```\n\n**兼容性**：ANSI、UNIX 和 Windows\n\
  \n`putchar` 函数返回写入的字符，或者在发生错误时返回 `EOF`。注意，该函数有一个整数类型的参数，用于存储想要写入的字符。例如：\n\n```c\n\
  putchar('\\n'); /* 移动到下一行 */\nputchar(char);  /* 将变量 car 中的字符内容写入显示 */\n```\n\n\
  上述语句等同于：\n\n```c\nprintf(\"\\n\");\nprintf(\"%c\", char);\n```\n\n### getch 和 getche\
  \ 函数\n\n`getch` 函数从键盘读取一个字符，且不在显示器上显示（无回显）；`getche` 函数从键盘读取一个字符并在显示器上显示出来（有回显）。这些函数的语法如下：\n\
  \n```c\n#include <conio.h>\nint _getch(void);\nint _getche(void);\n```\n\n**兼容性**：Windows\n\
  \n这两个函数都从与 `stdin` 关联的缓冲区读取字符。当执行其中一个函数时，执行会停止直到按下某个键。你不需要按下回车。如果按下的键与 ASCII 代码表中的某个字符匹配，则结果是一个字节；例如，键\
  \ `TO` 会产生一个对应于字符 'to' 或 'TO' 的字节。相反，如果按下的键或组合键对应附录中指定的扩展代码表中的某些项，结果将是两个字节。例如，F1\
  \ 会产生两个字节；第一个是 0，第二个是标识该键的代码。对于后一种情况，你必须调用两次函数，因为第二次调用才提供了所需的代码（第二个代码）。\n\n下面的示例演示了当运行\
  \ `getche` 时执行停止，在按下键后继续，且该键将显示在显示器上。\n\n```c\nprintf(\"Press a key for continue\
  \ \");\n_getche();\n```\n\n下面的示例在变量 `byte2` 中存储了你按下的功能键、光标移动键、组合键等的扩展代码（参见下表中的某些示例）。\n\
  \n```c\n/* getch.c - Functions _getch and _getche */\n\n#include <stdio.h>\n#include\
  \ <conio.h>\n\nmain()\n{\n    char byte1, byte2;\n    printf(\"Press the combination\
  \ from keys whose code\\n\" \"extended want know\\n\");\n    byte1 = _getch(); \n\
  \    byte2 = _getch(); \n    printf(\"%d  \\t  %d\\n\", byte1, byte2);\n    printf(\"\
  Press a key for continue \");\n    _getche();\n    printf(\"\\nEnd the program\\\
  n\");\n}\n```\n\n![](img/image18459.jpeg)\n\n| 按下的键 | 结果 |\n| :--- | :--- | :---\
  \ |\n| F1 | 0 | 59 |\n| Alt+A | 0 | 30 |\n| Shift+F10 | 0 | 93 |\n| Ctrl+Home |\
  \ 0 | 119 |\n| 上箭头 | 0 | 72 |\n\n### 清除屏幕\n\n虽然 C 库没有提供专门清理屏幕的函数，但它提供了系统函数，允许你向操作系统发送任何指令；例如，清理屏幕的指令。该函数有一个字符串链类型的参数。语法如下：\n\
  \n```c\n#include <stdlib.h>\nint system(char *command);\n```\n\n**兼容性**：ANSI、UNIX\
  \ 和 Windows\n\n当调用 `system` 函数时，字符串被传递给操作系统。例如，以下语句允许：\n\n```c\nsystem(\"cls\");\n\
  system(\"clear\");\n```\n\n### 解决\n\n1. 编写一个程序，运行 `getche` 时执行停止，按下键后继续，且该键将显示在显示器上。\n\
  \n下面的示例在变量 `byte2` 中存储了按下的功能键、光标移动键、组合键等的扩展代码（参见下表中的示例）。\n\n```c\n/* getch.c - Functions\
  \ _getch and _getche */\n\n#include <stdio.h>\n#include <conio.h>\n\nmain()\n{\n\
  \    char byte1, byte2;\n    printf(\"Press the combination from keys whose code\\\
  n\" \"extended want know\\n\");\n    byte1 = _getch(); \n    byte2 = _getch(); \n\
  \    printf(\"%d  \\t  %d\\n\", byte1, byte2);\n    printf(\"Press a key for continue\
  \ \");\n    _getche();\n    printf(\"\\nEnd the program\\n\");\n}\n```\n\n\n\n![](img/image18541.jpeg)只有当\
  \ `b –4ac` 大于或等于 0 时，解才是真实的。根据目前所学的内容，该问题的解可以按照以下 `ma` 形式展开：\n\n* 首先，我们定义计算所需的变量：\n\
  \n```c\ndouble to, b, c, d, x1, x2;\n```\n\n* 接下来从方程中读取系数 `to`、`b` 和 `c`：\n\n```c\n\
  printf(\"Enter the coefficients to b c: \"); scanf(\"%lf %lf %lf\", &to, &b, &c);\n\
  ```\n\n注意指定的类型是 `%lf`（`double`）。指定类型 `%f` 将导致错误，因为变量已经定义为 `double` 类型。计算机内部创建用于存储\
  \ `float` 的格式与存储 `double` 使用的格式不同。\n\n* ![](img/image18542.jpeg)我们要求计算实根。为了有实根，必须满足\
  \ `b –4ac geqslant 0`；如果不是，根为复共轭根。那么——是的，如果有实根我们就计算；其他情况下，我们退出程序。\n\n要在不执行其他操作的情况下退出函数，C\
  \ 提供了 `return` 语句；要完全离开程序则使用函数 `exit`：\n\n```c\n#include <stdlib.h> void exit(int\
  \ state );\n```\n\n兼容性：ANSI, UNIX 和 Windows\n\n`state` 参数是一个返回给调用执行程序的进程的值。\n\n\
  ```c\nd = b * b- 4 * to *c;\n(d < 0) ? printf(\"The estate They are complex\\n\"\
  ), exit(0) : printf(\"The estate real are:\\n\");\n```\n\n稍后当你学习 `if` 语句时，你将能够用这句话替换三元运算符\
  \ `: ?`。\n\n* 是的，如果有实根，我们就应用公式计算。\n\n```c\nd = sqrt(d);\nx1 = (-b + d) / (two *\
  \ to);\nx2 = (-b - d) / (two * to);\n```\n\n`sqrt` 函数计算参数的平方根。在示例中，它计算了 `d` 的平方根，并将结果以后重新存储在\
  \ `d` 中。\n\n* 最后我们写出得到的结果。\n\n```c\nprintf(\"x1 = %g\\nx2 = %g\\n\", x1, x2);\n\
  ```\n\n程序的完整示例如下：\n\n```c\n/********** 来自二元方程的解 *******/\n\n/* equation.c\n*/\n\
  #include <stdio.h> // scanf 和 printf 需要的\n#include <stdlib.h> // system 需要的\n#include\
  \ <math.h>             // sqrt 需要的\n\nmain()\n{\ndouble to, b, c, d, x1, x2; system(\"\
  cls\");\n/* 输入数据 */\nprintf(\"Enter the coefficients to b c: \"); scanf(\"%lf %lf\
  \ %lf\", &to, &b, &c);\n/* 判断是否为实根 */ d =b *b - 4 * to * c;\n(d < 0) ? printf(\"\
  The estate They are complex\\n\"), exit(0)\n: printf(\"The estate real are:\\n\"\
  );\n/* 计算解 */ d = sqrt(d);\nx1 = (-b + d) / (two * to);\nx2 = (-b - d) / (two *\
