  n');\n  for (F = 'a'; F <= 'z'; F++)\n  {\n    putchar(F);\n    for (c = 'a'; c\
  \ <= 'z'; c++)\n      printf(\"%3d\", table[F - 'a'][c - 'a']);\n    putchar('\\\
  n');\n  }\n}\n```\n\n\n\n\n分析显示频率表的代码，我们观察到第一个 `for` 循环，它显示表头“abc ...”；第一行指定了被计数的字母对中的第二个字符；第一个字符主要出现在表格每行的左侧。然后我们看到两个嵌套的\
