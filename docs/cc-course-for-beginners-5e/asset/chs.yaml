  , ptFunction1);\n}\n\ndouble square(double to)\n{\n    return (to * to);\n}\n\n\
  double pot(double x, double and)\n{\n    return exp(y * log(x));\n}\n```\n\n接下来，我们通过一个更真实的示例来展示，抱歉，我知道他们是如何使用函数指针的。在拆解训练中，完成了第\
