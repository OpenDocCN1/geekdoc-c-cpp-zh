  \ 10 和 20，我们首先引入 10，然后是 20，最后是 +。当操作数被输入时，它们被放入栈中；当运算符被输入时，我们从栈中取出两个操作数，计算结果并将结果放入栈中。后缀表示法的优势是复杂的表达式可以很容易求值而不需要大量的代码。所提示例的计算器使用了后缀表示法。总结来说，程序将执行以下操作：\n\
  \na) 读取一个操作数或运算符，并将其存储在变量 `oper` 中。\nb) 如果是操作数，则将其推入栈；如果是运算符，则从栈中弹出最后两个操作数，执行所述运算符指示的操作，并将结果放入栈中以便使用。为了实现这个应用程序，我们将使用在本章中讨论的\
  \ `stack_queue` 接口，因此在练习中我们简单地只限于使用它们，而不作进一步解释。程序的完整示例如下：\n\n////////////////////////////////////////////////\
  \ ////////////////\n\n//  使用栈模拟一个能够使用后缀表示法执行 +, -,* 和 / 操作的计算器。\n\n//\n\n// calculator.c```c\n\
  #include <stdio.h>\n#include <stdlib.h>\n#include \"queue_stack_interface.h\"\n\n\
  void freeMemory(tstack *battery)\n{\n// 清除栈中的所有元素\ndouble *pdouble = NULL;\n// 删除：永久删除第一个元素\n\
  pdouble = delete(stack);\nwhile (double)\n{\nfree(pdouble); // 清除数据区域\npdouble =\
  \ delete(stack); // 删除元素\n}\n}\n\nvoid *newDouble(double d)\n{\n// 为 double 预留内存\n\
  double *p = (double *)malloc(sizeof(double));\nif (!p) error();\n*p = d;\nreturn\
  \ p;\n}\n\nint getOperands(double operand[], tstack *battery)\n{\n// 从栈顶获取两个操作数\n\
  double *pdouble = NULL;\nif (stack->numberOfElements < 2)\n{\nprintf(\"Error: 需要\
  \ %d 个操作数\\n\", 2 - stack->numberOfElements);\nreturn 0;\n}\npdouble = (double *)\
  \ getFromStack(stack);\noperand[0] = *pdouble;\nfree(pdouble);\npdouble = (double\
  \ *) getFromStack(stack);\noperand[1] = *pdouble;\nfree(pdouble);\nreturn 1;\n}\n\
  \nmain()\n{\n// opera 保存输入的运算符\nchar opera[20];\n// operand 保存两个操作数\ndouble operand[2];\n\
  // 空栈 stack;\nstartStack(&stack);\nprintf(\"操作: + - * /\\n\\n\");\nprintf(\"输入数据：\\\
  n\");\nprintf(\">operand 0 [Enter]\\n\");\nprintf(\">operand 1 [Enter]\\n\");\n\
  printf(\">operator [Enter]\\n\\n\");\nprintf(\"退出按 q\\n\\n\");\ndo\n{\nprintf(\"\
  > \");\ngets(oper); // 读取运算符或操作数\nswitch (oper[0]) // 检查第一个字符\ncase '+':\n    if\
  \ (!getOperands(operand, &stack)) break;\n    printf(\"%g\\n\", operand[0] + operand[1]);\n\
  \    pushInStack(newDouble(operand[0]+operand[1]), &stack);\n    break;\ncase '-':\n\
  \    if (!getOperands(operand, &stack)) break;\n    printf(\"%g\\n\", operand[0]\
  \ - operand[1]);\n    pushInStack(newDouble(operand[0]-operand[1]), &stack);\n \
  \   break;\ncase '*':\n    if (!getOperands(operand, &stack)) break;\n    printf(\"\
  %g\\n\", operand[0] * operand[1]);\n    pushInStack(newDouble(operand[0]*operand[1]),\
  \ &stack);\n    break;\ncase '/':\n    if (!getOperands(operand, &stack)) break;\n\
  \    if (operand[1] == 0)\n    {\n        printf(\"\\n 错误：除以零\");\n        break;\n\
  \    }\n    printf(\"%g\\n\", operand[0] / operand[1]);\n    pushInStack(newDouble(operand[0]/operand[1]),\
  \ &stack);\n    break;\ncase 'q':\n    // 退出\n    break;\ndefault:\n    // 是操作数\n\
  \    pushInStack(newDouble(atof(oper)), &stack);\n}\n}\nwhile (oper[0] != 'q');\n\
  \n// 清空栈\nfreeMemory(&stack);\n}\n```\n\n3. 编写一个应用程序，允许计算文本文件中出现单词的频率。调用程序的格式为：\n\
