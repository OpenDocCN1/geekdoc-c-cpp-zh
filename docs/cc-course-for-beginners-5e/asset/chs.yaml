  \n以下判断为 `c[97]` 赋值值 10，\n\n```c\nc['AC'] = 10;\n```\n\n下面显示的另一个语句在逻辑上执行相同的操作，假设\
  \ `car` 被赋值为字符 `' to '`。\n\n```c\nc[car] = 10;\n```\n\n然后，是的，读取一个字符（从 `' to '` 到\
  \ `' z '`），\n\n```c\ncar = getchar();\n```\n\n接下来我们执行操作，\n\n```c\nc[char]++;\n```\n\
  \n数组 `c` 的哪个元素被加了？答案是等于所读字符对应代码的下标。我们将读取的字符与数组的下标相匹配。因此，每当我们读取一个 `' a '` 时，它就会增加计数器\
  \ `c[97]` 或等同的 `c['a']`；然后我们就得到了一个来自 ' ' 的计数器；类此类，我们对其余字符也这样做。\n\n但是元素 `c[0]` 到\
  \ `c[96]` 呢？正如我们所说的，初始问题将保持未使用的状态（语句说：字符 ' a ' 到 ' z ' 出现的频率）。这虽然没有产生任何负面问题，但可以这样避免：\n\
  \n```c\nc[car - 'a']++;\n```\n\n当 `car` 等于 `' a '` 时，它是元素 `c[0]`，当 `car` 等于 `' z\
  \ '` 时，它是元素 `c[25]`。通过这种方式，我们可以定义一个整数数组，其元素数量等于 ' a ' 到 ' z ' 之间的字符数量（根据 ASCII 表为\
  \ 26 个字符）。第一个元素将是计数器 `' to '`，第二个是来自 `' b '`，以此类推。\n\n计数器是一个初始值为 0 的变量（假设计数从 1 开始），然后在每次出现时增加它。这就是我们想要计数的。\n\
  \n```c\n/* 文本的频率。 */\n#include <stdio.h>\n#define N_CHARS ('z'-'a'+1)\n\n/* \n \
  \  一个数组 c[N_CHARS] 将\n             the the the the the \n*/\n```c\nint main() {\n\
  \    int c[N_CHARS];\n    char car;\n    // ... (代码其余部分)\n}\n```\n\n\n\n\n```c\n\
  char string[10] = \"abcd\"; printf(\"%s\\n\", chain);\n```\n\n此示例定义了一个包含 10 个元素的字符数组\
  \ `string`（`string[0]` 到 `string[9]`），并将第一个元素赋值为字符 'a'，第二个为 'b'，第三个为 'c'，第四个为 'd'，第五个及之后的元素赋值为空字符（ASCII\
  \ 值 0 或转义序列 `\\0`），C 语言以此自动结束所有的字符字符串。因此，`printf` 将输出结果 `chain abcd`。另一个示例：\n\n\
  ```c\nchar chain[] = \"abcd\"; printf(\"%s\\n\", chain);\n```\n\n这个示例与上一个相同，区别在于现在数组\
  \ `chain` 恰好准备了五个元素。接下来的图示了：\n\n| | to | b | c | d | `\\0` | | | | | | | | | | |\n\
  \n### 从字符读取和写入字符串\n\n在第 4 节讨论输入流时，我们看到从标准输入流 `stdin` 中读取字符字符串的方法方法是使用函数 `scanf`\
  \ 配合 `%s` 格式说明。例如，如果我们想从长度 `maxim` 中读取一个 40 个字符的名字，我们应该先定义数组然后读取：\n\n```c\nchar\
  \ name[41]; scanf(\"%s\", name); printf(\"%s\\n\", Name);\n```\n\n在这种情况下，变量 `name`\
  \ 前不需要加 `&` 运算符，因为正如我们之前所说的，数组的标识符是数组的起始地址。在这种情况下，`name` 是从字符链开始的符号地址 `AC`。\n\n\
  现在，如果你运行上述语句并输入如下内容：\n\n```\nFrancisco Javier\n```\n\n当你在查看字符串时发现只输入了 Francisco，请不要惊讶。请记住\
  \ `scanf` 函数读取的数据是以空白符分隔的。为了解决这个问题，`scanf` 支持自定义格式说明，其语法如下所示：\n\n```text\n%[characters]\n\
  ```\n\n该格式说明表示读取字符，直到读入一个不在 `characters` 所指集合中的字符为止。反之，则：\n\n```text\n%[^characters]\n\
  ```\n\n这表示读取字符，直到读到一个在 `characters` 所指集合中的字符为止。例如：\n\n```c\nscanf(\"%[^\\n]\", Name);\n\
  ```\n\n之前的判断将从标准输入读取字符，直到找到字符 `\\n`。对于这种情况，有一个更简单的解决方案，即使用 C 库中的函数 `gets` 或 `fgets`，我们稍后会看到。\n\
  \n此外在第 4 节中，我们看到从流 `stdin` 读取字符的方法方法是使用 `getchar` 函数。因此，读取字符串将涉及反复调用 `getchar` 函数，并将读取的每个字符存储在字符数组的下一个空位置，同时注意用字符\
  \ `'\\0'` 结束字符串。例如：\n\n```c\n/* getchar.c\n*/\n\n#include <stdio.h>\n#define LONG_CAD\
  \ 41\n\nmain()\n{\n    unsigned char string[LONG_CAD];  // 包含 LONG_CAD 个字符的数组\n\
  \    int i = 0, car;\n\n    printf(\"Enter a text: \");\n\n    while ((car = getchar())\
  \ != '\\n' && i < CAD_LENGTH-1)\n    {\n        string[i] = car;\n    }\n    //\
  \ 使用字符 '\\0' 结束字符串\n    string[i] = '\\0';\n    printf(\"Text: %s\\n\", string);\n\
  \    printf(\"Length: %d\\n\", i);\n}\n```\n\n执行程序：\n\nEnter a text: \nText: hello\n\
  Length: 5\n\n等等，输入文本包含了一些乱码字符和重复。我在保持源码提供的 C 代码逻辑的同时，对结构进行了清理。\n\n\n\n\n将函数 `scanf`\
  \ 或 `getchar` 与函数 `gets` 进行比较，可以发现后者提供了一种更方便的读取字符串的方法。它还允许在单行内输入由多个空格分隔的单词组成的字符字符串，且不需要任何来自\
  \ `Format` 类型。\n\n注意，使用 `gets` 函数时无法指定将读取多少个字符，这是极其危险的，因为存储的字符可能会超出所用数组的边界，而如果使用\
  \ `fgets` 代替它，我们就可以避免这种错误（该函数将在文件章节中进行学习）。例如，上面示例中的阴影行允许你读取一个十个字符的字符串，但无法控制读取超过\
  \ 40-1 个字符。解决这个问题的办法是使用 `fgets` 函数，它允许在第二个参数中指定链的最大长度。与 `gets` 不同，该函数不会移除 `\\n`\
  \ 字符。以下代码永远不会包含长度超过 40 个字符（包括终止符 `\\0`）的链：\n\n```c\nchar text[40];\nfgets(text,\
  \ 40, stdin); // 读取直到 39 个字符\n```\n\n### 函数 `puts`\n\n同样，在 `stdout` 上写入字符链的其他方法是使用\
  \ `puts` 函数，其语法如下：\n\n```c\n#include <stdio.h>\n\nint puts(const char *var);\n```\n\
  \n**兼容性**：ANSI, UNIX 和 Windows\n\nC 库函数 `puts` 将字符字符串写入标准输出 `stdout`，并将字符串的终止字符\
  \ `\\0` 替换为字符 `\\n`，这意味着在写入字符串后，它会自动移动到下一行。该函数在运行成功时返回一个正值，在反之的情况下返回值 `EOF`。\n\n\
  例如，以下代码行读取并显示字符字符串 `name`：\n\n```c\nchar name[41];\ngets(name);\nputs(name);\n```\n\
  \n下面显示的另一个示例使用了 `gets` 函数的返回值来视觉化所读取的字符串：\n\n```c\n/* puts.c */\n#include <stdio.h>\n\
  \nmain()\n{\n    char *c = NULL; // 用于存储 gets 返回的值\n    char text[80];\n    printf(\"\
  Enter a line from text:\\n\");\n    c = gets(text);\n    printf(\"\\nThe text inserted\
  \ is:\\n\");\n    puts(text); // 等于: printf(\"%s\\n\", text);\n    puts(\"\\nIf\
  \ writes by second time:\");\n    puts(c);\n}\n```\n\n### 执行程序\n\n```text\nIntroduce\
  \ a line from text: hello\nThe text inserted is:\nhello\nI know writes by second\
  \ time:\nhello\n```（注：示例文本包含一些伪迹，为了语义清晰已对其进行了清理）。\n\n第 4 节讨论了在运行 `scanf` 或 `getchar`\
  \ 后遗留在输入缓冲区中的字符 `\\n` 的影响，如果你随后再次执行其中任何一个函数以读取字符的话。发生的情况是，由于 `\\n` 是这些函数的有效字符，它会被读取，导致用户预期的输入没有被请求。如果在执行\
  \ `gets` 函数时，输入缓冲区中存在字符 `\\n`（因为之前执行了上述任何一个函数），`gets` 也会发生相同的情况。\n\n解决此问题的办法是在调用\
  \ `scanf` 函数或 `getchar` 后清除与 `stdin` 关联的缓冲区。为了这一点，到目前我们分析了 `fflush` 函数。但我们已经在第 4\
  \ 节中提到过，该函数在 `UNIX`/`LINUX` 中对源流没有影响。在许多情况下，解决这个问题的方案可能是使用 `gets` 函数，其唯一目的是让输入缓冲区为空。你可以在下面的练习中通过用\
  \ `gets(string)` 替换 `fflush(stdin)` 来测试这一点。\n\n接下来的示例尝试阐述上一段中介绍的概念。它结合了 `scanf`、`getchar`\
  \ 和 `gets` 函数，以展示清理输入缓冲区的必要性。\n\n```c\n/************* Clean up the buffer associated\
  \ with stdin************/\n/* fflush.c */\n#include <stdio.h>\n\nmain()\n{\n   \
  \ int integer; double real;\n    char answer = 's', string[81];\n    // 引入数字\n \
  \   printf(\"Enter a no. whole and a no. actual:\\n\"); \n    scanf(\"%d %lf\",\
  \ &whole, &real);\n    printf(\"%d + %F = %f\\n\\n\", whole, real, whole + real);\n\
  \    // 清理输入后的缓冲区并用 gets 读取链\n    fflush(stdin); // 或者使用 gets(string)\n    printf(\"\
  Enter chains for gets.\\n\");\n    while (answer == 's' && gets(string))\n    {\n\
  \        printf(\"%s\\n\", string);\n        printf(\"Do you want to continue? (y/n):\
  \ \");\n        answer = getchar();\n    }\n}\n```\n\n\n\n\n```c\nif (str[i] >=\
  \ 'to' && str[i] <= 'z') str[i] = str[i] - after;\n}\n```\n\n### 执行程序\n\n引入一个链：`hello`\
  \ `HELLO`\n\n针对所提出的问题的解决方案并没有考虑到我们语言中的典型字符，例如 `ñ` 或重音元音。这项工作留给读者作为练习。\n\n## C 语言库中的函数\n\
  \nC 语言库提供了大量的函数，允许你对字符字符串执行各种操作，例如将一个字符串复制到另一个字符串、将一个字符串添加到另一个字符串、比较两个字符串等。下面列出了最常用的函数。关于这些和其他函数的详细描述，请参见附录\
  \ A。\n\n![](img/image18459.jpeg)\n\n### C 函数描述\n\n![](img/image18567.jpeg)\n\n|\
  \ 函数 | 描述 |\n| :--- | :--- |\n| `strcpy` | 复制字符串。 |\n| `strcmp` | 比较两个字符串。 |\n|\
  \ `strlen` | 字符串的长度或字符数量。 |\n| `atof` | 将字符串转换为双精度浮点数。 |\n| `atoy` | 将字符串转换为整数。\
  \ |\n| `atole` | 将字符串转换为长整型。 |\n| `sprintf` | 将任何允许格式的值转换为字符串。 |\n| `printf` | 将值转换为字符字符串。\
  \ |\n| `lower` | 将字符转换为小写。 |\n\n| ![](img/image18459.jpeg) |\n| `topper` | 将字符转换为大写字母。\
  \ |\n\n## 矩阵的类型与尺寸\n\n在第二章中，我们看到通过使用 `typedef` 可以为基本类型或其他派生类型声明别名。`matrix` 类型是一个派生类型（例如，用于维数组的\
  \ `int[]`）。因此，你可以这样声明一个数组类型的别名：\n\n```c\ntypedef double t_array_1d[100];\n```\n\n\
  上述行代码定义了一个新类型 `t_matrix_1d`，它定义了一个包含 100 个 `double` 类型元素的单维矩阵。接下来的语句使用该类型定义了一个矩阵\
  \ `m`：\n\n```c\nt_matrix_1d m;\n```\n\n同样，我们看到 `sizeof` 运算符返回其操作数的字节大小。当操作数是一个数组时时，结果是该数组的字节大小。例如，下面这行代码计算了之前定义的矩阵\
  \ `m` 的元素数量：\n\n```c\nprintf(\"Number from elements: %d\\n\", sizeof(m)/sizeof(m[0]));\n\
  ```\n\n或者，也可以写成：\n\n```c\nprintf(\"Number from elements: %d\\n\", sizeof(m)/sizeof(double));\n\
  ```\n\n这里展示的内容可以扩展到我们将要解释的多维数组。\n\n## 多维数组\n\n根据上一章对长度的研究，可以说一维数组的每个元素都是原始类型。那么，如果我们需要存储一年中\
  \ 12 个月每天的平均温度，该如何操作呢？或者，如果我们需要存储某个班的学生名单，又该如何操作呢？简而言之，我们将得出结论：使用一维数组来解决提出的问题会导致访问存储的数据非常困难；例如，回答这类问题：5\
  \ 月 10 日的平均温度是多少？或者，第 25 号学生的名字是谁？如果以表格的形式存储数据将简单得多；对于温度，可以是一个 12 行（月份数）乘以 31 列（最长月份的天数）的表格；对于姓名，则是一个行数等于学生人数、列数等于姓名字符数加上长度的表格。因此，为了方便解决计划中的问题，需要使用二维数组。\n\
  \n多维矩阵，正如其名称所示，是一个两个或多个维度的矩阵。\n\n## 多维数值数组\n\n多个维度数值矩阵的定义遵循以下形状：\n\n```c\ntype array_name\
  \ [ expr-1 ][ expr-2 ]...;\n```\n\n其中 `type` 是整数或实数原始类型。多维矩阵中的元素数量是由 `expr-1`、`expr-2`、`...`\
  \ 给出的维度乘积。例如，下面的行代码创建了一个具有 $2 \\times 3 = 6$ 个 `int` 类型元素的二维矩阵：\n\n```c\nint m[2][3];\n\
