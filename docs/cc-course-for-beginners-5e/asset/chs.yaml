  \ 中的 `Element` 类型；以及 `LinearListSE.c` 中的应用（`main` 函数等）。\n\n### 循环链表\n\n循环链表是一种线性链表，其最后一个元素指向第一个元素。这样，就可以从链表的任何给定点访问链表的任何元素。循环链表上的操作更简单，因为避免了特殊情况。例如，上述\
  \ `llse` 接口的 `anyadir` 函数考虑了两种情况：在链表开头插入和在某个元素之后插入。在循环链表中，这两种情况简化为一种。下图显示了简单循环链表的样子。（Images/image1788.jpeg）\n\
  \n\n\n\n`delete` 删除由 `last->yes-next` 指向的元素。返回被删除的数据区域指针，如果列表为空则返回 `NULL`。\n\n```c\n\
  void *delete(tlcse *ready);\n```\n\n`get` 返回位置 `i` 处的元素，如果列表为空或索引越界，则返回 `NULL`。它有两个参数：要获取的对象的位置\
  \ `i` 和 `ready`。\n\n```c\nvoid *get(int i, tlcse ready);\n```\n\n![](img/image18790.jpeg)\n\
