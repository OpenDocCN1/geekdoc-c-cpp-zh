  \n# 结构化数据类型\n\n源自数据\n\n![](img/image18560.jpeg)\n\n到目前为止，我们在执行的每个程序中只处理过少数几个变量。然而，在很多情况下，我们将不得不处理更大的值集。例如，为了计算\
  \ 8 月份的平均温度，我们需要知道对应每天平均温度的 31 个值。在这种情况下，我们可以使用一个变量逐个输入所有 31 个值，并在另一个变量中累加和。但是，我们引入的值会发生什么？当我们输入第二个值时，第一个将会丢失；当我们输入第三个值时，第二个将会丢失，以此此类推。当我们引入了所有值后，我们可以计算平均值，但每天对应的温度就已经丢失了。我们能做什么来存储所有这些值呢？嗯，我们可以使用\
  \ 31 个不同的变量；但如果有 100 个或更多需要记录的值，会发生什么？除了定义每个变量非常费力之外，代码看起来也会非常庞大。\n\n在本章中，你将学习如何在名为“数组”的数据结构中记录一组相同类型的值。同样，你将学习记录字符串，它们无非是字符集，或者说，正如他所喜欢的，是字符数组。\n\
  \n如果数组是记录一组相同类型值（`int`、`float`、`double`、`char` 等）的方法，那么我们如何存储一组相互相关但类型不同的值呢？例如，存储与人相关的数据，如姓名、地址、电话号码等。我将看到如何从数据结构定义其他类型；例如。\n\
  \n它可以是 `struct person` 类型。以后我们还可以从这种类型的结构创建矩阵，这就是我们将学习的后续内容。\n\n## 数组简介\n\n矩阵是一个同质结构，由多个元素组成，所有元素类型相同，并且在内存中连续存储。可以通过数组变量名后跟一个或多个括在括号内的下标直接访问每个元素。\n\
  \n![](img/image18561.jpeg)矩阵 `m`\n\n通常，矩阵的表示通过变量下标或下标完成，并可以有一个或多个维度（下标）。一维数组也称为列表，二维数组称为矩阵。\n\
  \n从数学角度来看，在很多情况下，我们需要使用下标变量，例如：\n\n```\nv = [ v0 , v1 , v2 ,,..., v i ,..., v n\
  \ ]\n```\n\n在下标的情况下，或者很好\n\n```\n( m00 m01 m02\n... m0 j\n... m0 n )\nm = ( m10\
  \ m11 m12 m1j m1n )\n( ... ... ... ... ... ... ...  )\n```\n\n![](img/image18562.jpeg)\n\
  ```\n( i 0\ni 1\ni 2\n...\n...\n)\nto i n )\n```\n\n如果使用了两个下标。这种表示也可以用于使用我们刚刚定义的数组的编程语言中，这就是我们将学习的内容。\n\
  \n例如，假设我们有一个名为 `m` 的整数一维数组，包含 10 个元素。这些项目将按照形状标识：\n\n![](img/image18563.jpeg)矩阵\
  \ `m`\n\n```\n| | m[0] | m[1] | m[2] | m[3] | m[4] | m[5] | m[6] | m[7] | m[8] |\
  \ m[9] |\n```\n\n注意下标是连续的整数，且第一个下标是 0。下标可以是任何正整数表达式。\n\n同样，二维矩阵由带有两个下标（行、列）的变量表示；三维矩阵由带有三个下标的变量表示，以此此类推。矩阵的维度最大或在编译器限制范围内的最大元素数量取决于可用内存。\n\
  \n然后，数组根据其维度可以分为一维和多维；根据其内容可以分为数值型、字符型、结构型和指针型。稍后我将详细研究其中的这一切。\n\n## 数值一维数组\n\n\
  与其他变量一样，在使用数组之前你必须定义它。数组的定义是数组的名称、元素的数量和元素的类型。例如，数组的 `name`、`size`、`type`。\n\n###\
  \ 定义数组\n\n数组的定义是数组的名称、元素的数量和元素的类型。例如，数组的 `name`、`size`、`type`。\n\n```\nint m[10];\n\
  float temperature[31];\nint steel[25];\n```\n\n第一行创建一个包含 10 个 `int` 类型元素的数组。第二行创建一个包含\
  \ 31 个 `float` 元素的数组。第三行创建一个包含 25 个 `int` 元素的数组。\n\n## 使用一维数组\n\n为了练习目前介绍的理论，我们将编写一个程序，为包含\
  \ `N_ITEMS` 的一维数组 `m` 分配数据，然后作为对工作的验证，写出该矩阵的内容。解决方案将类似于：\n\n\n\n\n该数组有 10 个元素。从矩阵中引入这些值。\n\
  \n| m[0] | = | 1 |\n| m[1] | = | two |\n| m[2] | = | 3 |\n| ... | | | |\n\n1 2 3\
  \ ...\n\n结束过程。\n\n首先，我们定义常量 `N_ELEMENTS` 来确定矩阵中元素的数量：\n\n```c\n#define N_ELEMENTS\
  \ 10;\n```\n\n然后，我们创建一个具有该数量元素的矩阵 `m`，并定义下标 `i` 来访问该矩阵中的元素。\n\n```c\nint m[N_ELEMENTS];\
  \ // 创建矩阵 m\nint i = 0; // 下标\n```\n\n接下来的步骤是将键盘输入的值赋值给矩阵的每一个元素。\n\n```c\nfor (i\
  \ = 0; i < N_ELEMENTS; i++)\n{\n    printf(\"m[%d] = \", i);\n    scanf(\"%d\",\
  \ &m[i]);\n}\n```\n\n读取矩阵后，我们将其可视化以检查任务是否完成。\n\n```c\nfor (i = 0; i < N_ELEMENTS;\
  \ i++)\n    printf(\"%d \", m[i]);\n```\n\n以下是完整的程序示例：\n\n```c\n/************* 创建一个一维矩阵\
  \ *************/\n/* matrix01.c\n*/\n#include <stdio.h>\n#define N_ELEMENTS 10 //\
  \ 矩阵元素数量\n\nmain()\n{\n    int m[N_ELEMENTS]; // 创建矩阵 m\n    int i = 0; // 下标\n\
  \    printf(\"输入数组的值。\\n\");\n    // 输入数据\n    for (i = 0; i < N_ELEMENTS; i++)\n\
  \    {\n        printf(\"m[%d] = \", i);\n        scanf(\"%d\", &m[i]);\n    }\n\
  \    // 输出数据 printf(\"\\n\\n\");\n    for (i = 0; i < N_ELEMENTS; i++)\n       \
  \ printf(\"%d \", m[i]); \n    printf(\"\\n\\n 结束过程。\\n\");\n}\n```\n\n之前的练习教会了我们如何读取和写入数组。接下来的步骤是学习如何处理存储在矩阵中的值。例如，我们想写一个程序，读取给定课程每个学生的平均成绩，将其存储在数组中，并输出该课程的平均分。\n\
  \n正如我们在上一个程序中所做的那样，我们首先创建一个具有最大元素数量的矩阵。然后通过键盘请求实际人数，该人数应匹配学生人数，且在任何情况下都不会大于最大值或小于\
  \ 1。在这种情况下，有趣的是数组类型为 `float`，这样它的元素就可以存储小数。我们还会定义一个索引 `i` 来访问数组元素，并定义一个变量 `sum`\
  \ 用来存储所有成绩的总和。\n\n```c\n#define N_STUDENTS 100; // 学生最大人数\nfloat notes[N_STUDENTS];\
  \ // 成绩矩阵\nint i = 0; // 索引\nint no students = 0; // 学生实际人数\nfloat sum = 0; // 所有分数的总和\n\
  \ndo\n{\n    printf(\"学生人数: \"); scanf(\"%d\", &nstudents);\n}\nwhile (nstudents\
  \ < 1 || no students > N_STUDENTS);\n```\n\n接下来的步骤是将键盘引入的成绩存储在矩阵中。\n\n```c\nfor\
  \ (i = 0; i < no students; i++)\n{\n    printf(\"学生编号 %3d, 成绩: \", i+1); scanf(\"\
  %f\", &notes[i]);\n}\n```\n\n最后，将所有分数相加并显示平均分。总和将存储在变量 `sum` 中。这种使用的变量被称为“累加器”。重要的是，它的初始值必须为\
  \ 0。\n\n```c\nfor (i = 0; i < no students; i++) sum += notes[i];\nprintf(\"\\n\\\
  n 课程平均分: %5.2f\\n\", sum / no students);\n```\n\n以下是完整的程序示例：\n\n```c\n/********************\
  \ 课程平均分 *********************/\n/* notes.c\n*/\n#include <stdio.h>\n#define N_STUDENTS\
  \ 100 // 学生最大人数\n\nmain()\n{\n    float notes[N_STUDENTS]; // 学生最大人数\n    int i\
  \ = 0; // 索引\n    int no students = 0; // 学生实际人数\n    float sum = 0; // 所有分数的总和\n\
  \n    do\n    {\n        printf(\"学生人数: \"); scanf(\"%d\", &nstudents);\n    }\n\
  \    while (nstudents < 1 || no students > N_STUDENTS);\n\n    // 输入数据\n    for\
  \ (i = 0; i < no students; i++)\n    {\n        printf(\"学生编号 %3d, 成绩: \", i+1);\
  \ scanf(\"%f\", &notes[i]);\n    }\n\n    // 输出数据 printf(\"\\n\\n\")\n    for (i\
  \ = 0; i < no students; i++)\n        sum += notes[i]; \n    printf(\"\\n\\n 课程平均分:\
  \ %5.2f\\n\", sum / no students);\n}\n```\n\n\n\n有两个问题：什么被复制到了 `m`？是否创建了矩阵的副本？不，没有创建副本。当参数是一个数组时，传递的是该数组的地址；即该数组物理占用的内存块的起始位置。该地址由\
  \ `array` 名称提供。这意味着 C 语言总是通过引用传递数组。\n\n基于以上内容，`DisplayMatrix`get 矩阵 `x` 知道什么？嗯，知道起始地址\
  \ `m` 以及它的元素个数 `n`；那么，在这个函数中的 `m[i]` 和 `main` 函数中的 `x[i]`，它们是同一个元素吗？是的，因为这两个函数都从相同的内存位置开始工作，并且针对相同数量的元素。这意味着如果\
  \ `ArrayDisplay` 修改了数组，这些修改也会影响 `main`。可以用什么练习来检查这一点。\n\n### 关联数组\n\n在关联数组中，对元素的访问是通过值而不是位置完成的（例如，数组\
  \ `daysMonth[13]`，它在索引 1 的元素中存储第 1 月的天数，在索引 2 中存储第 2 月的天数，以此类推——记住；我们忽略索引为 0 的元素）。在这些情况下，如果我们利用这种巧合，解决问题的方案将变得更容易。例如，让我们写一个程序，统计键盘输入的文本中每个字母出现的次数，然后打印结果。为了使示例简单化，我们假设文本只包含英语字母表中的小写字母（既没有重音字母，也没有\
  \ `ll` 或 `ñ`）。解决方案可以如下所示：\n\n引入 `text`。\n\n对于 `Finalize` 引入标记 `EOF`\n\n更常用的数组：是一维数组和二维数组\n\
  \n[Ctrl][z]\n\n![](img/image18564.jpeg) 这里的 `b` `c` `d` 和 `F` `g` `h` `i` `j` `k`\
  \ `he` `m` `n` 或 `p` `what` `r` `s` `you` 或 `v` `w` `x` 和 `z`\n\n9 1 1 3 5 0 0 0\
  \ 9 0 0 6 4 6 3 0 0 1 十 两个 二 0 0 0 1 1\n\n在开始麻烦之前，我们先分析一下将在程序中用到的一些操作。例如，表达式：\n\n\
  `'z' - 'to' + 1`\n\n返回 26。记住每个字符都有一个关联的整数值（ASCII 码），这是机器内部用于处理它的值。A) 是的，例如，`' z\
  \ '` 关联的是 122，`' to '` 是 97，等。根据此，上一个表达式的求值是：`122 – 97 + 1 = 26`。\n\n同样的原因，是的，我们执行语句，\n\
