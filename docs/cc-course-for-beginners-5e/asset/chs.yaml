  \ 菜单或按下 `Ctrl+F5` 键。\n\n### 向草稿添加文件\n\n我们要向空项目或现有项目添加 `.c` 文件。如何做到？一旦项目打开，只需运行命令\
  \ `Project > Add Existing Element` 并选择我们想要添加的文件。\n\n### 调试应用程序\n\n调试应用程序意味着逐步执行它，无论其方向（按语句还是按函数），以观察执行期间遵循的流程，以及发生的中间结果，目的是检测产生最终错误结果的异常产生位置。\n\
  \n有两个设置，我可以在下面的图中观察到，在编译应用程序设置下：`release` 和 `Debug`：\n\n![](img/image18886.gif)\n\
  \n第一个允许获得在代码和速度上优化的程序可执行文件，第二个是带有调试应用程序所需的额外代码程序可执行文件。因此，要使用 Visual C++ 开发环境的调试器调试应用程序，必须在开始生成之前激活\
  \ `Win32 Debug` 设置。要做到这一点，从 `generate...` 菜单中运行 `Administrator` 命令并选择该设置。\n\n在 `Win32\
  \ Debug` 配置下构建应用程序后，如果需要，可以对其进行调试。要这样做，通过指令运行命令 `Debug > Step By Step` 并使用 `Debug`\
  \ 菜单命令或相应的工具栏按钮（要了解每个按钮的含义，将鼠标指针悬停在每个按钮上）。\n\n![](img/image18887.gif)\n\n总结来说，调试应用程序的可用命令如下：\n\
  \n* `Start` 或 `F5`。以调试模式从应用程序开始开始执行，直到找到断点。\n* `Alternate` 断点或 `F9`。停止调试。\n* `Stop`\
  \ 调试或 `F5`。停止进程。\n* `Step by step` 逐语句执行或 `F11`。\n* `Step by step` 退出或 `F10`。当调用由用户定义的函数时。\n\
  * `Quick Watch` 或 `Ctrl+Alt+Q`。显示下方的变量的值。\n\n要单步运行应用程序，请选择命令 `Start without debugging`\
  \ (`Ctrl+F5`)。\n\n调试工具栏，你还有其他可以通过执行命令显示的的工具栏。\n\n### 命令行窗口中的界面\n\n组成 C 应用程序的文件可以使用任何\
  \ ASCII 文本编辑器编写；例如，记事本。一旦编辑并保存了组成应用程序的所有文件，下一步是编译并链接它们以获得相应的可执行文件。\n\n在此之前，为了让操作系统找到\
  \ `cl` 工具，文件头文件（include 指令）以及在命令行调用时所需的动态库和静态库，必须在工作环境（我们正在工作的控制台上）中定义以下变量：\n\n\
  `set path=%path%; 来自 .exe 和 .dll 文件的路径`\n\n`set include= 来自 .h 文件的路径`\n\n`set lib=\
  \ 来自 .lib 文件的路径`\n\n```bash\ncl file01.c [file02 [file03 ...]\n```\n\n\n\n\n一旦设置了这些变量，你就可以调用\
  \ C 编译器和链接器了。下图展示了编译 `greeting.c` 的过程指南示例：\n\n![](img/image18888.gif)\n\n注意，我们首先运行了\
  \ `vcvars32.bat` 来设置环境变量文件，然后切换到了应用程序目录（`cd`）。接下来，我们查看了该目录下的 `.c` 文件（`dir`），最后调用了\
  \ C 编译器（`cl`）。生成的结果是 `greeting.exe`。要运行该文件，在命令行中输入 `greeting` 并按回车。结果将显示消息 `Hello\
  \ World!!!`。\n\n## UNIX/LINUX 上的命令行界面\n\n在 UNIX/LINUX 下创建的 C 应用程序所组成的文件可以是任何对应的文件。它们可以使用该系统提供的任何\
  \ ASCII 文本编辑器进行编写。一旦编辑并保存了组成应用程序的所有 `.c` 或 `.cpp` 文件，下一步就是对它们进行编译和链接，以获取生成可执行文件。执行这些操作的命令如下：\n\
  \n```\nDC file01.c [file02 [file03] ...] -or executable_file\n```\n\n在 UNIX/LINUX\
  \ 情况下，当从命令行调用时，操作系统寻找 `cc` 工具、`.h` 头文件和库的路径已经在作业环境中定义好了。\n\n下图展示了编译 `greeting.c`\
  \ 所遵循的流程示例：\n\n![](img/image18889.gif)\n\n注意，我们首先切换到了应用程序目录（`cd`），然后查看了该目录的内容（`ls\
  \ -l`），最后调用了 C 编译器（`cc`）。生成的可执行文件是由 `-o` 选项指定的，在示例中为 `greeting`，或者在省略时默认为 `a.out`。\n\
  \n要运行示例应用程序，在命令行中输入 `greeting` 并按回车。结果将是消息 `Hello world!!!`。如果在执行此操作时，由于系统找不到指定的文件导致我无法执行，你必须将当前工作目录的路径添加到环境变量\
  \ `PATH` 中。操作如下：\n\n```bash\nPATH=$PATH:.\n```\n\n`$PATH` 表达式表示环境变量 `PATH` 的当前值。路径之间用冒号分隔。当前目录由点字符\
  \ `.` 表示。\n\n## Unix/Linux 下的 gdb 调试器\n\n当我打算调试在 UNIX 下编写的 C 程序时，在编译时我应该指定 `-g`\
  \ 选项。此选项指示编译器在目标文件中包含供调试器使用的额外信息。例如：\n\n```bash\nDC -g prog01.c -or prog01\n```\n\
  \n此命令将编译并链接源文件 `prog01.c`。结果是一个带有调试器调试信息的可执行文件 `prog01`。\n\n当编译程序时使用了调试其所需的必要选项后，我们将调用\
  \ `gdb` 继续调试。语法如下：\n\n```bash\ngdb executable-file\n```\n\n下面的示例调用了 UNIX 下的调试器 `gdb`，它将可执行文件\
  \ `prog01` 加载到内存中进行调试：\n\n```bash\ngdb prog01\n```\n\n一旦我调用了调试器，可以在命令行中运行如下的命令：\n\
  \n*   `break [ file: ] function`：在指定文件的指定函数处设置断点。例如，以下命令在 `write` 函数处设置一个断点。\n \
  \   ```bash\n    break write\n    ```\n*   `break [ file: ] line`：在指定的行上设置断点。例如，以下命令在第\
  \ 10 行设置一个停止点。\n    ```bash\n    b 10\n    ```\n*   `delete breakpoint`：删除指定的断点。例如，以下命令删除第\
  \ 1 个（第一个）停止点。\n    ```bash\n    d 1\n    ```\n*   `run [ arguments ]`：开始执行我们要调试的应用程序。当发现断点或应用程序结束时，执行停止。例如：\n\
  \    ```bash\n    run\n    ```\n*   `print expression`：显示变量或表达式的值。例如，以下命令可视化变量 `total`\
  \ 的值。\n    ```bash\n    p total\n    ```\n*   `next`：执行下一行。如果该行匹配到用户定义的函数调用，我将不会进入函数内部进行调试。例如：\n\
  \    ```bash\n    n\n    ```\n*   `continue`：继续执行应用程序的执行。例如：\n    ```bash\n    c\n\
  \    ```\n*   `step`：执行下一行。如果该行匹配到用户定义的函数调用，我将进入函数内部进行调试。例如：\n    ```bash\n    s\n\
  \    ```\n*   `list`：可视化源代码。例如：\n    ```bash\n    he\n    ```\n*   `bt`：可视化当前调用栈中的调用情况（已工作函数的调用）。\n\
  *   `help [ order ]`：请求指定命令的帮助。\n*   `quit`：结束调试作业。\n\n## 从函数创建库\n\nVisual C++ 提供了\
  \ Win32 静态库（Static Library）项目类型，允许你创建一个函数库（扩展名为 `.lib` 的文件），类似于 C 语言提供的库。这将允许我们将所有函数组合在一个文件中，并像使用\
  \ C 函数一样使用它们。按照以下步骤操作：\n\n1.  运行 Visual C++。\n2.  选择 `Archive > New > Project`。\n\
  3.  选择 Win32 项目类型和控制台模板。在 Name 框中输入项目名称，在 Location 框中选择要创建的目录。在示例中，我们将项目命名为 `Hash`。点击\
  \ OK 按钮。\n4.  在此窗口中选择静态库，不要选择预编译头，点击完成。\n5.  我们现在有一个空项目。运行 `Project > Add Items`\
  \ 命令，添加包含要包含在库中的函数（`.lib`）的文件，以及编译每个函数代码所需的头文件。在我们的示例中，如图所示，我们将添加包含函数的 `hash.c`\
  \ 和头文件 `hash.h`。\n    ![](img/image1890.gif)\n6.  最后，运行 `generate > Generate...`\
  \ 来编译项目并生成 `.lib` 文件。在我们的示例中，生成的文件为 `hash.lib`，包含了 `hash.c` 中的功能。\n\n\n\n\n\n![](img/image18893.jpeg)\n\
  \n代码表是字符集，其中每个字符都被分配了一个数字用于其内部表示。某些语言如 `Java` 使用 `UNICODE` 来存储和处理字符串，而其他语言如 `C`\
  \ 则使用 `ANSI` 或 `ASCII`。\n\n在 Windows 中 ANSI 字符的使用\n\n`ANSI`（美国国家标准学会）是个人计算机广泛使用的字符标准。由于\
  \ `ANSI` 标准仅使用一个字节表示一个字符，因此最多只能表示 `256` 个字符。虽然它适用于英语，但不能完全接受许多其他语言。要输入键盘上没有的 `ANSI`\
  \ 字符：\n\n1. 在下页的表中找到你所需的 `ANSI` 字符示例，并查看其数字代码。\n2. 按下数字锁定（`number Lock`）激活键盘数字键。\n\
  3. 按住 `Alt` 键，并使用数字小键盘连续按数字与字符代码对应的数字按键。\n\n例如，在 Windows 环境下输入字符 ``，按住 `Alt` 键的同时在数字小键盘上输入\
  \ `0177`（见下页的代码表）。\n\n### ANSI 字符的操作\n\n![](img/image18894.gif)\n\n### ASCII 字符的使用\n\
  \n在 MS-DOS 和 Windows 环境之外，使用 `ASCII` 字符集。要输入键盘上没有的 `ASCII` 字符：\n\n1. 在代码表中查找与活动表匹配的字符。使用命令\
  \ `chcp` 查看活动的是哪种代码表。\n2. 按住 `Alt` 键，并使用键盘数字键按下你想要的字符对应的三位数字。\n\n例如，如果你正在使用 `850`\
  \ 代码表，要写字符 `ter `，按住 `Alt` 键的同时在数字小键盘上输入 `227`（见下页的代码表）。\n\n### ASCII 字符的操作\n\n\
