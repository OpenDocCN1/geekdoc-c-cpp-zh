  \ a[4]\n\n将矩阵 `p` 的行赋值给 `a` 元素的循环（通过 `p[i] = a[i]`），难道不能被一个单一的赋值 `p = a` 替换吗？不能，因为它们的间接层级是不同的；换句话说，`p`\
  \ 和 `a` 的类型不相等，也不允许它们之间进行任何类型转换。让我们来看下：\n\n| p 的类型 | int * [5] | (指向 int 的包含五个元素的指针的矩阵)\
