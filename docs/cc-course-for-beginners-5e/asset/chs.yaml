  \ `numCustomers`: 现有客户数量。\n\n**返回值：** 无。\n\n---\n\n# 第 8 章：高级函数\n\n在之前的章节中，我们学习了什么是程序、如何编写程序，以及如何让计算机执行它并显示结果；我们学习了元素；分析了\
  \ C 程序的结构；学习了如何从键盘读取数据并在显示器上可视化结果；我们学习了结构体；处理了数组并学习了如何使用指针。\n\n同样，在第 3 章中，引入了独立于\
  \ C 程序的函数概念。从那时，我们知道每个 C 程序除了 `main` 函数（程序的入口和出口点）外，其他函数在需要时通过传递参数进行相互通信。这一切，我们一直在应用为止所学的章节。\n\
  \n因此，在本章中，我们将关注特定问题，即如何通过将数组、结构体作为参数传递给函数来研究可能的问题，以及返回这些类型的数据。我们还将涵盖通过命令行传递参数以及函数指针。\n\
  \n### 向函数传递矩阵参数\n考虑到数组分配内存的时刻，如果是由编译器进行分配，我们称之为静态的；如果是在程序执行期间使用 `malloc`、`calloc`\
  \ 或 `realloc` 进行分配，则称之为动态的。记住，静态矩阵名称是一个常量，动态引用则如此。\n\n### 静态数组\n我们已经多次提到，数组名称是该矩阵的起始地址，我们也看到当把数组传递给函数时，函数调用中指定的参数仅是数组名称。这意味着传递的参数是矩阵的地址，因此，函数定义中的参数必须是相同类型的数组，在调用后将用该地址初始化。这就是为什么说矩阵总是按引用传递的。如果按值传递，将复制其元素，这会导致资源的开销和浪费。\n\
  \n因此，当数组传递给函数时，函数知道的是该数组在内存中的位置。通过这种方式，调用者和被调用者工作在同一个内存空间；在同一个矩阵上。其中任何一个对矩阵所做的更改，另一个都能看到。例如，在第\
  \ 6 章中我们实现了如下函数：\n\n```c\nmain() // 主函数\n{\n    static tfile library[N];  // 结构体矩阵\n\
  \    int n = 0; // 当前数组元素数量\n    system(\"cls\");\n    printf(\"输入数据。\\n\");\n \
  \   n = read(library, N); \n    system(\"cls\");\n    printf(\"书籍列表\\n\");\n   \
  \ write(library, n);\n}\n\nint read(tfile bible[], int NMAX)\n{\n    // ...\n}\n\
  \nvoid write(tfile bible[], int n)\n{\n    // ...\n}\n```\n\n在此示例中，`read` 函数和 `write`\
  \ 函数的第一个参数是一维数组。记住，当将一维数组作为函数参数时，不需要指定其维度，只因为矩阵已经存在，唯一需要的是声明一个该类型的变量，如示例中的 `ttab[]`，用于存储其地址。如果数组是多维的，则不需要指定第一维，但其余维度必须指定，如下所示；原理是相同的，由于矩阵存在，所有需要的是一个该类型的变量，如示例中的\
  \ `float[][COLS]`，用于存储相同的地址。\n\n```c\n// ... main()\n{\n    static float a[ROWS][COLS],\
  \ c[ROWS][COLS]; \n    int row = 0, cabbage = 0;\n    // 为矩阵读取数据\n    for (row =\
  \ 0; row < ROWS; row++)\n    {\n        for (cabbage = 0; cabbage < COLS; cabbage++)\n\
  \        {\n            printf(\"a[%d][%d] = \", row, cabbage);\n            scanf(\"\
  %f\", &a[row][col]);\n        }\n    }\n    // 将矩阵拷贝到 c\n    CopyArray(c, a);\n\
  }\n// ...\nvoid CopyArray(float destination[][COLS], float origin[][COLS])\n{\n\
  \    // ...\n}\n```\n\n在另一个示例中（同样在第 6 章开发），`CopyArray` 函数的两个参数都是二维数组。问题在于，指定第二维度使得函数依赖于该外部值，这意味着当我们在其他程序中使用此函数时，需要声明该常量。这可以通过包含函数原型和常量定义的头文件来解决。\n\
  \n\n\n\n另一方面，如果数组名称代表的是某一层间接的地址，我们是否可以将该地址存储在一个具有相同间接层接的指针中呢？可以，只要指针定义得恰当。对于一维矩阵，由于数组名指向该数组的第一个元素，因此定义一个指向元素类型的指针就足够。例如，观察\
  \ `read` 函数的 `bibli` 参数，它之前被声明为数组，现在被声明为指针；在两种情况下其行为是相同的。\n\n```c\nint read(ttoken\
  \ *bible, int NMAX)\n{\n    // ...\n}\n```\n\n另一方面，我们不能对 `CopyArray` 执行完全相同的操作，因为正如我们在上一章中所学习到的，二维矩阵的名称也定义了一个间接层级，但它不是指向元素，而是指向一行。根据函数\
  \ `CopyCouldArray`，其写法应该是这样的：\n\n```c\nvoid CopyArray(float (*destination)[COLS],\
  \ float (*source)[COLS])\n{\n    int row = 0, cabbage = 0;\n    for (row = 0; row\
  \ < ROWS; row++)\n    {\n        for (cabbage = 0; cabbage < COLS; cabbage++)\n\
  \        {\n            destination[row][col] = source[row][col]; // error\n   \
  \     }\n    }\n}\n```\n\n然而，如果我们将索引访问替换为通过矩阵地址的指针运算计算出的每个元素的偏移量进行访问，问题也解决了。下面的示例演示了这种处理方法：\n\
  \n```c\nvoid CopyArray(float *destination, float *origin)\n{\n    int row = 0, cabbage\
  \ = 0;\n    for (row = 0; row < ROWS; row++)\n    {\n        for (cabbage = 0; cabbage\
  \ < COLS; cabbage++)\n        {\n            *(destination + (row*COLS) + cabbage)\
  \ = *(origin + (row*COLS) + cabbage);\n        }\n    }\n}\n```\n\n## 动态数组\n\n动态数组由一个指针类型的变量引用，其间接层级数与矩阵的维度相同。因此，将动态数组作为参数传递给函数，只需要确保对应形式的形式参数是相同类型的指针即可。例如，以下程序根据维度创建了一个动态矩阵，然后调用一个函数对其进行可视化。注意用于引用矩阵的指针具有一个间接层级，而函数\
  \ `Visualize` 定义了一个相同类型的参数。\n\n```c\n// pointers1.c\n//\n#include <stdio.h>\n#include\
  \ <stdlib.h>\n#include <memory.h>\n\nvoid display(double *, int);\nmain()\n{\n \
  \   int elements = 6; // 矩阵元素数量\n    // 动态地创建一个一维矩阵\n    double *m = (double *)malloc(elements\
  \ * sizeof(double));\n    if (m == NULL)\n    {\n        printf(\"Insufficient memory\\\
  n\");\n        return -1;\n    }\n    // 使用零初始化数组 memset(m, 0, elements * sizeof(double));\n\
  \    // ...\n    // 可视化矩阵 display(m, elements);\n    free(m);\n    return 0;\n}\n\
  \nvoid display(double *x, int elements)\n{\n    int i = 0;\n    for (i = 0; i <\
  \ elements; i++) printf(\"%5g\", x[i]);\n    printf(\"\\n\");\n}\n```\n\n如果矩阵是二维的，处理以的方法的方法。例如，以下程序创建了一个二维动态数组，然后调用一个函数进行显示。注意用于引用数组的指针具有两个间接层级，且函数\
  \ `Visualize` 定义了相同类型的参数。\n\n```c\n// pointers2.c\n//\n#include <stdio.h>\n#include\
  \ <stdlib.h>\n#include <memory.h>\n\nvoid display(double **, int, int);\nmain()\n\
  {\n    int rows = two, cols = 3; // 矩阵的数和列数\n    int F = 0;\n    // 动态地创建一个二维矩阵\n\
  \    // 由指向每一行的指针组成的矩阵\n    double **m = (double **)malloc(rows * sizeof(double\
  \ *));\n    if (m == NULL)\n    {\n        printf(\"Insufficient memory\\n\");\n\
  \        return -1;\n    }\n    // 使用零初始化矩阵指针 memset(m, 0, rows * sizeof(double\
  \ *));\n    // 为每一行分配内存\n    for (F = 0; F < rows; F++)\n    {\n        m[F] = (double\
  \ *)malloc(cols * sizeof(double));\n        if (m[F] == NULL)\n        {\n     \
  \       printf(\"Insufficient memory\\n\");\n            return -1;\n        }\n\
  \        memset(m[F], 0, cols * sizeof(double));\n        for (C = 0; C < cols;\
  \ C++)\n        {\n            printf(\"%5g\", m[F][C]);\n        }\n        printf(\"\
  \\n\");\n    }\n    display(m, rows, cols);\n    for (F = 0; F < rows; F++)\n  \
  \  {\n        free(m[F]);\n    }\n    free(m);\n}\n```\n*(注：原文中的代码包含大量的 OCR 错误和碎片化逻辑；我已清理结构，以反映文中所描述的逻辑。)*\n\
  \n\n\n\n# 矩阵的操作\n\n```c\n// ...\n\n// 显示数组\ndisplay(m, rows, cols);\n\n// 释放分配给矩阵的内存\n\
  ReleaseMem2D(m, rows);\n\nreturn 0;\n\n}\n\nvoid AssignMem2D(double ***x, int rows,\
  \ int cols)\n{\n    double **p = NULL; // 指向内存中预留块的地址\n    int F = 0;\n\n    //\
  \ 创建一个动态二维矩阵\n    // 矩阵由指向每行每个元素的指针数组组成\n    p = (double **)malloc(rows * sizeof(double\
  \ *));\n    if (p == NULL) return;\n\n    // 用零初始化矩阵的指针数组\n    memset(p, 0, rows\
  \ * sizeof(double *));\n\n    // 为每一行分配内存\n    for (F = 0; F < rows; f++)\n    {\n\
  \        p[f] = (double *)malloc(cols * sizeof(double));\n        if (p[f] == NULL)\n\
  \        {\n            ReleaseMem2D(p, rows);\n            *x = NULL;\n       \
  \     return;\n        }\n        // 用零初始化行\n        memset(p[f], 0, cols * sizeof(double));\n\
  \    }\n    *x = p; // 将矩阵的地址保存到参数中\n    // 通过引用传递给函数。\n    // *x 的类型为 double **，与\
  \ p 的类型相同。\n}\n\nvoid FreeMem2D(double **x, int rows)\n{\n    int F = 0;\n    //\
  \ 释放分配给矩阵的内存\n    for (F = 0; F < rows; f++)\n    {\n        free(x[f]);\n    }\n\
  \    free(x);\n}\n\nvoid display(double **x, int rows, int cols)\n{\n    int F =\
  \ 0, c = 0;\n    for (F = 0; F < rows; f++)\n    {\n        for (c = 0; c < cols;\
  \ c++) printf(\"%5g\", x[f][c]);\n        printf(\"\\n\");\n    }\n}\n```\n\n现在，当\
  \ `main` 调用 `AssignMem2D` 函数时，你如何传递参数 `m` 呢？显然是通过引用传递，因为调用执行时执行了操作 `x = &m`。因此，`AssignMem2D`\
  \ 现在可以访问 `m`，因为你已经知道了它的地址。也就是说，当 `AssignMem2D` 想要修改 `m` 时，将通过表达式 `*x` 实现（地址 `x`\
  \ 的内容是 `m`，而 `x` 的值是 `m` 的方向）。\n\n可以看出，`AssignMem2D` 定义了一个与 `*x` 类型相同的指针 `p`，因此与\
  \ `m` 类型也相同，用于存储为数组预留的内存块的地址。这避免了在函数的其余部分直接使用 `*x`，从而使代码解释更易读。因此，该函数的最后语句必须是 `*x\
  \ = p`，其实际执行的操作正是将 `p` 保存到 `m` 中。\n\n与 `AssignMem2D` 函数不同，`ReleaseMem2D` 和 `Display`\
  \ 是通过通过传递 `m` 的值来调用的，这是完全正确的，因为——这些函数不需要修改地址 `m`。现在，如果这些函数中的执行任何操作，例如操作 `x[0][0]\
  \ = -1`，元素 `m[0][0]` 会以相同的方式被修改吗？显然会，因为 `x` 和 `m` 指向同一个矩阵。\n\n结论是，当指针按值传递给函数时，逻辑上你操作的是目标数据。它们是通过引用传递的，因为传递给函数的是该数据的地址；而当指针通过引用传递给函数时，目标数据也是通过引用传递的。\n\
  \n### 将结构体传递给函数\n\n结构体可以像任何其他变量一样按值或按引用传递给函数（在上一章中我们已经介绍过这个主题）。当我们按值传递结构体时，代表结构体的当前参数被复制到对应的形式参数中，产生该结构体的副本。因此，即使修改了形式参数的任何成员，这些更改也不会影响相应的当前参数。是的，如果我们通过引用获取结构体，函数接收到该结构体所在的位置。因此，知道了它的地址，修改其内容是可行的。\n\
  \n作为一个示例，我们将制作之前程序的另一个版本，该版本使用定义矩阵的结构体；即，该结构体包含三个成员：一个用于存储数组的起始地址，一个用于存储行数，另一个用于列数。\n\
  \n```c\ntypedef structure {\n    double **p; // 矩阵的地址\n    int rows; // 行数\n   \
  \ int cols; // 列数\n} matrix2D;\n```\n\n假设我们为程序版本采取的方法示意图如下：\n\n```c\nmain() {\n\
  \    matrix2D m = {NULL, 2, 3}; // 结构体 m\n    AssignMem2D(&m);\n    display(m);\n\
  \    ReleaseMem2D(m);\n}\n\nvoid AssignMem2D(matrix2D *x) {\n    x->p = (double\
  \ **)malloc(x->rows * sizeof(double *));\n    // ...\n}\n\nvoid ReleaseMem2D(matrix2D\
  \ x) {\n    // ...\n}\n\nvoid Display(matrix2D x) {\n    // ...\n}\n```\n\n让我们分析这个版本的程序。当\
  \ `main` 调用 `AssignMem2D` 时，如何传递参数 `m`？通过按值传递，因为调用执行时执行了操作 `x = &m`。因此，`AssignMem2D`\
  \ 现在可以访问 `m`，因为你知道它的地址。也就是说，当 `AssignMem2D` 想要修改 `m` 时，将通过表达式 `*x` 实现。\n\n可以看出，`AssignMem2D`\
  \ 定义了一个与 `*x` 类型相同的指针 `p`，因此与 `m` 类型也相同，用于存储为数组预留的内存块的地址。这避免了在函数的其余部分直接使用 `*x`，从而使代码解释更易读。因此，该函数的最后语句必须是\
  \ `*x = p`，其实际执行的是 `p` 保存到 `m` 中。\n\n与 `AssignMem2D` 函数不同，`ReleaseMem2D` 和 `Display`\
  \ 是通过传递 `m` 的值来调用的，这是完全正确的，因为——这些函数不需要修改地址 `m`。现在，如果这些函数中的执行任何操作，例如操作 `x[0][0] =\
  \ -1`，元素 `m[0][0]` 会以相同的方式被修改吗？显然会，因为 `x` 和 `m` 指向同一个矩阵。\n\n结论是，当指针按值传递给函数时，逻辑上你操作的是目标数据。它们是通过引用传递的，因为传递给函数的是该数据的地址；而当指针通过引用传递给函数时，目标数据也是通过引用传递的。\n\
  \n\n\n\n请注意，当 `main` 调用 `AssignMem2D` 函数时，它是通过引用传递参数 `m` 的（`x = &m`）。因此，`AssignMem2D`\
  \ 现在可以操作 `m` 的成员，因为你已经知道了它们的地址。当 `AssignMem2D` 想要访问 `m` 的成员 `p` 时，它将通过表达式 `x->p`\
  \ 或另一个等效表达式 `(*x).p` 来完成（`x` 的内容是 `m`，而 `x` 是指向 `m` 的指针）。\n\n相反，`FreeMem2D` 和 `Display`\
  \ 函数是通过按值传递 `m` 来调用的，这是完全正确的，因为这些函数都不需要修改 `m` 的成员。现在，如果运行这些函数中的任何一个，例如执行 `xp[0][0]\
  \ = -1` 这样的操作，元素 `mp[0][0]` 是否也会相同的方式被修改？显然是会的，因为 `xp` 和 `mp` 指向同一个矩阵，由于 `x` 是 `m`\
  \ 的拷贝。根据此，添加如下所示函数是完全正确的，允许用户从键盘为数组数据赋值：\n\n```\nvoid AssignData(tmatrix2D x)\n\
  {\n    int F = 0, c = 0;\n    for (F = 0; F < x.rows; f++)\n    {\n        for (c\
  \ = 0; c < x.cols; c++)\n        {\n            printf(\"item[%d][%d] = \", F, c);\n\
  \            scanf(\"%lf\", &x.p[f][c]);\n        }\n        printf(\"\\n\");\n\
  \    }\n}\n```\n\n请注意，当 `main` 调用 `AssignData` 函数时，它是按值传递参数 `m` 的（`x = m`）。因此，`AssignData`\
  \ 将无法修改 `m` 的成员，因为你不知道它们的地址；但你将能够修改矩阵中的元素，因为 `XP` 和 `PM` 指向同一个矩阵，而 `x` 已经是 `me`\
  \ 的拷贝。换句话说，结构体 `m` 是按值传递的（传递的是它的拷贝），但 `p` 指向的数组是通过引用传递的（它的指针被复制到了 `xp` 中）。\n\n###\
  \ 函数返回的数据\n\n\n\n函数可以返回原始类型或派生类型的任何值，例如接受一个数组（非动态）或一个函数。当函数返回一个值时，它实际返回的是该值的拷贝，该值通常存储在一个相同类型的变量中。因此，它可以返回整数、结构体、指针等，但不能返回数组，因为如果这些是按引用传递的，它们也将按引用返回；这意味着函数将返回它的起始地址，而不是元素的拷贝；在上述之后，你可能会想，如果它返回的是起始地址，我们不能用它来访问你的数据吗？不，因为从逻辑上说，我们尝试返回的数组将被定义为其局部的数据结构，因此在函数结束时它会被销毁。每当我们返回任何局部变量的地址并意图通过它来访问后续存储的值时，都会发生同样的错误。\n\
  \n根据上述解释，函数应当返回：\n\n*   数据的拷贝。\n*   动态分配的用于存储数据的内存块的地址。\n*   静态声明变量的地址。\n\n### 返回数据的拷贝\n\
  \n我们将执行上一个程序的另一个版本。与之前的版本相比，在这一版本中，我们只修改 `AssignMem2D` 函数以适应以下原型：\n\n`tmatrix2D*\
  \ AssignMem2D(int, int);`\n\n我们注意到现在 `AssignMem2D` 有两个参数（矩阵的行数和列数），并且它返回一个类型为 `tmatrix2D`\
  \ 的结构体。根据此，`main` 函数和 `AssignMem2D` 函数将被修改，如下所示：\n\n```\nmain()\n{\n    int rows\
  \ = 2, cols = 3; tmatrix2D m; //结构体 m\n    // 创建动态二维矩阵\n    m = AssignMem2D(rows,\
  \ cols); if (mp == NULL)\n    {\n        printf(\"Insufficient memory\\n\"); return\
  \ -1;\n    }\n    // 对矩阵进行操作\n    // ...\n    // 可视化矩阵 display(m);\n    // 释放分配给矩阵的内存\
  \ ReleaseMem2D(m);\n    return 0;\n}\n\ntmatrix2D* AssignMem2D(int rows, int cols)\n\
  {\n    tmatrix2D x = {NULL, rows, cols}; int F = 0;\n    // 创建动态二维矩阵\n    // 矩阵从指向每一行的指针开始\n\
  \    XP = (double **)malloc(rows * sizeof(double *)); if ( xp == NULL ) return x;\n\
  \    // 从零开始初始化指针 memset(xp, 0, rows * sizeof(double *));\n    // 为每一行分配内存 (F =\
  \ 0; F < x.rows; f++)\n    {\n        xp[f] = (double *)malloc(cols * sizeof(double));\
  \ if(xp[f] == NULL)\n        {\n            ReleaseMem2D(x);\n            XP = NULL;\
  \ return x;\n        }\n        // 将行置零 memset(xp[f], 0, cols * sizeof(double));\n\
  \    }\n    return x;\n}\n```\n\n可以看到，现在 `AssignMem2D` 函数定义了一个类型为 `tmatrix2D` 的局部变量\
  \ `x`，并为它的成员分配相应的值；也就是说，一个 p 内存块，它是无效的。\n\n如果为类型 `tmatrix2D` 的变量动态分配内存并返回其地址，那么上述错误就可以修正。当变量不再需要时忘记释放该块内存。通过这种新方法，`main`\
  \ 函数和 `AssignMem2D` 函数将保持如下：\n\n```\nmain()\n{\n    int rows = 2, cols = 3; tmatrix2D*\
  \ m = NULL; // 指向结构体 tmatrixD 的指针\n    // 创建动态二维矩阵\n    m = AssignMem2D(rows, cols);\
  \ if (m == NULL)\n    {\n        printf(\"Insufficient memory\\n\"); return -1;\n\
  \    }\n    // 对矩阵进行操作\n    // ...\n    // 可视化矩阵 display(*m);\n    // 释放分配给矩阵的内存\
  \ ReleaseMem2D(*m);\n    // 释放分配给结构体的内存\n    free(m); return 0;\n}\n\ntmatrix2D*\
  \ AssignMem2D(int rows, int cols)\n{\n    int F = 0;\n    tmatrix2D* x = (tmatrix2D*)malloc(sizeof(tmatrix2D));\
  \ if (x == NULL) return NULL;\n    x->p = NULL; x->rows = rows; x->cols = cols;\n\
  \    // 创建动态二维矩阵\n    // 矩阵从指向每一行的指针开始\n    XP = (double **)malloc(rows * sizeof(double\
  \ *));\n    // ...\n    return x;\n}\n```\n\n\n\n\n```c\nx->p = (double **)malloc(rows\
  \ * sizeof(double *)); if (x->p == NULL) return NULL;\n\n// Start the matrix from\
  \ pointers with zeros\nmemset(x->p, 0, rows * sizeof(double *));\n\n// To assign\
  \ memory to every row\nfor (F = 0; F < x->rows; f++)\n{\n    x->p[f] = (double *)malloc(cols\
  \ * sizeof(double));\n    if (x->p[f] == NULL)\n    {\n        FreeMem2D(*x); x->p\
  \ = NULL;\n        return NULL;\n    }\n    // Start the row with zeros\n    memset(x->p[f],\
  \ 0, cols * sizeof(double));\n}\n\nreturn x;\n```\n\n函数 `AssignMem2D` 现在返回一个指向结构\
  \ `x` 的指针，该结构是一个动态创建的二维数组，该函数执行后，`main` 函数将其存储在 `m` 中。但当 `x` 被销毁时，`m` 将指向哪里？在函数执行完毕之后？答案是同一个结构，即指向\
  \ `x` 的 `tmatrix2D`。在这种情况下，销毁 `x` 意味着释放该指针类型变量所占用的四个字节，而不释放所指向的内存块；这由 `main` 函数在程序结束时通过调用\
  \ `free` 函数来处理。\n\n### 返回静态声明变量的地址\n\n使用最新版本 `AssignMem2D` 的用户只需根据函数名称和原型就能推断出，该函数的作用是为具有\
  \ `rows` 行 `cols` 列的数组动态分配内存，这也很清楚地表明，当不再需要该数组时，必须释放该内存。另一方面，仅通过查看原型，无法判断该函数是否也使用了\
  \ `tmatrix2D` 类型的动态数据结构。具体来说，这类信息应该出现在函数的文档中。无论如何，很显然，这可能成为错误的根源，因为如果没有释放该内存，就会发生内存泄漏。为了克服这一缺点，我们可以让函数返回一个声明为\
  \ `static` 的 `tmatrix2D` 类型变量的地址，因为这类变量在整个程序的执行过程中一直存在。这种机制与 C 库中的 `localtime` 函数使用的相同（请参附录\
  \ TO）。\n\n应用上一段所述的理论，`main` 函数和 `AssignMem2D` 函数将如下：\n\n```c\nmain()\n{\n    int\
  \ rows = 2, cols = 3;\n    tmatrix2D *m = NULL; // 结构 m\n    // 创建一个动态二维矩阵\n   \
  \ m = AssignMem2D(rows, cols); if (m == NULL)\n    {\n        printf(\"Insufficient\
  \ memory\\n\"); return -1;\n    }\n    // 矩阵操作\n    // ...\n    // 可视化矩阵\n    display(*m);\n\
  \    // 释放分配给矩阵的内存\n    ReleaseMem2D(*m);\n    return 0;\n}\n```\n\n```c\ntmatrix2D\
  \ *AssignMem2D(int rows, int cols)\n{\n    static tmatrix2D x; int F = 0;\n    XP\
  \ = NULL; x.rows = rows; x.cols = cols;\n    // 创建一个动态二维矩阵\n    // 从每一行的每个指针创建矩阵\n\
  \    XP = (double **)malloc(rows * sizeof(double *)); if (XP == NULL) return NULL;\n\
  \    // 从零指针开始矩阵矩阵\n    memset(xp, 0, rows * sizeof(double *));\n    // 为每一行分配内存\n\
  \    for (F = 0; F < x.rows; f++)\n    {\n        xp[f] = (double *)malloc(cols\
  \ * sizeof(double)); if (xp[f] == NULL)\n        {\n            ReleaseMem2D(x);\n\
  \            xp = NULL; return NULL;\n        }\n        // 从零开始行 \n        memset(xp[f],\
  \ 0, cols * sizeof(double));\n    }\n    return &x;\n}\n```\n\n现在，函数 `AssignMem2D`\
  \ 返回声明为 `static` 的 `tmatrix2D` 类型结构 `x` 的地址，该函数执行后 `main` 将将其存储在 `m` 中。在这种情况下，当程序结束时，`main`\
  \ 函数不需要释放任何内容，加上分配给矩阵的内存。\n\n### 命令中的参数\n\n很多时候当我们从操作系统调用程序时，需要在程序名称后面编写一个或多个参数。`main`\
  \ 后面用空格隔开。例如，`ls` 和 `-l` 是命令行上的选项。同样，...（此处原文存在乱码，已略）\n\n\n\n\n\n```c\n// 在这里编写我所知道的在...运行时的代码\n\
  \n// 当我知道参数 -n 发生时，执行 \nprintf(\" -n\\n\");\n\n}\n\n}\n\n// 适用于所有情况的通用代码返回 0;\n\n\
  }\n```\n\n运行此程序并按照上述方式调用它，将得到以下结果：\n\n参数：\n\n- `-l`\n- `-n`\n\n### 输入与输出的重定向\n\n\
  输入重定向意味着可以从标准输入以外的介质获取数据；例如，从磁盘上的文件。假设我们有一个名为 `redir.c` 的程序，它从标准输入接收数据，以下命令将执行 `redir`\
  \ 程序并从名为 `fdata.ent` 的文件中获取数据：\n\n```\nredeem < fdatos.ent\n```\n\n同样，输出重定向意味着将程序产生的结果发送到标准输出以外的设备；例如，到磁盘上的文件。以\
  \ `redir.c` 程序为例，以下命令将执行程序 `redeem`并将结果写入名为 `fdata.out` 的文件：\n\n```\nredeem > fdata.salt\n\
  ```\n\n注意，该程序是从命令行运行的。要重定向输入，使用 `<` 符号；要重定向输出，使用使用 `>`。也可以同时重定向输入和输出。例如：\n\n```\n\
  redeem < fdatos.ent > fdata.salt\n```\n\n作为上述应用，我们将编写一个程序，读取一组数字并根据通过命令行传递的参数以不同的格式将它们写入。也就是说，如果程序名为\
  \ `ma redir.c`，执行 `redeem` 将显示不带加号的数字集，而执行 `redeem -l` 将显示数字集，并在每个数字后根据其是偶数还是奇数输出“is\
  \ even”或“is odd”的消息。例如：\n\n| 24 | is | pair |\n| 3. 4. 5 | is | odd |\n| 7... |\
  \ is... | odd |\n\n以下是完整的重定向示例代码：\n\n```c\n/**************** 输入/输出重定向 ***************/\n\
  /*  redir.c \n*/\n\n#include <stdio.h>\nint main (int argc, char *argv[])\n{\n \
  \   int n;\n\n    while (scanf(\"%d\", &n) != EOF)\n    {\n        printf(\"%6d\"\
  , n);\n        if (argc > 1 && argv[1][0] == '-' && argv[1][1] == 'l')\n       \
  \     printf((n%2) ? \" is odd\" : \" is pair\");\n        printf(\"\\n\");\n  \
  \  }\n    return 0;\n}\n```\n\n通过键盘输入数据从命令行运行此程序所获得的结果与以下两种情况类似：\n\n```text\nredir\
  \ [Enter]\n24 3 4 5 7 41 89 -72 5 [Enter]\n24\n3 4 5\n7\n41\n89\n-72\n5 [Ctrl+Z]\n\
  ```\n\n```text\nredeem -l [Enter]\n24 3 4 5 7 41 89 -72 5 [Enter]\n24 is pair\n\
  3 4 5 is odd\n7 is odd\n41 is odd\n89 is odd\n-72 is pair\n5 is odd [Ctrl+Z]\n```\n\
  \n如果没有输入 `-l` 参数，值将直接显示；如果输入了该参数，则显示值，并根据数字是偶数还是奇数跟随“is even”或“is odd”。\n\n此外，我们可以编辑一个\
  \ `fdatos.ent` 文件，其中包含如下数据：\n\n```\n24 3 4 5 7 41 89 -72 5\n```\n\n并按照以下方式调用程序 `redeem`：\n\
  \n```\nredeem [-l] < fdatos.ent\nredeem [-l] > fdata.salt\nredeem [-l] < fdatos.ent\
  \ > fdata.salt\n```\n\n`-l` 参数（可以跟在重定向符号之后，也可以在行尾指定）。第一条命令从 `fdatos.ent` 读取数据并显示结果；第二条命令从键盘读取数据并将结果写入\
  \ `fdata.sal`；第三条命令从 `fdatos.ent` 读取数据并将结果写入 `fdata.out`。\n\n### 递归函数\n\n如果一个函数调用自身，则称为递归函数。每当函数被调用时，栈上都会添加一个新的帧来存储局部变量。注意，静态变量只在第一次调用时初始化一次。\n\
  \n\n\n\ntype (* p_identif )();\n\n其中 `type` 是函数返回值的类型，`p_identif` 是来自 `type` 指针的变量名。该变量将存储从函数\
  \ `Start` 开始的地址，由函数自身的 `Name` 定义。例如：\n\n```c\ndouble (*pfn)();\n```\n\n表示 `pfn`\
  \ 是一个指向返回 `double` 类型值的函数的指针。注意声明中标识符周围的括号；它们是至关重要的。如果不加括号，含义将发生完全的改变。让我们来看：\n\n\
  ```c\ndouble *pfn();\n```\n\n表示 `pfn` 是一个函数，它返回一个指向 `double` 类型值的指针。\n\n继续分析 `pfn`\
  \ 的声明，我们知道被指向的函数必须返回 `double` 类型的值，但它具有什么参数呢？答案是：可以是任何数量和类型的参数，因为在 C 语言中，缺少参数表示接受任何数量和类型的参数；相反，如果我们在括号内编写\
  \ `void`，则意味着没有参数（在 C++ 中，这两种形式——空括号或带有 `void` 的括号——含义是相同的：即无参数的函数）。\n\n作为一个示例，假设程序中定义了两个函数，其原型如下：\n\
  \n```c\ndouble square(double);\ndouble pot(double, double);\n```\n\n如所述，这些函数中的任何一个都可以赋值给\
  \ `pfn`，如下所示：\n\n```c\npfn = square;\npfn = pot;\n```\n\n最后，要调用 `pfn` 指向的函数，你可以使用以下两种方式中的任何一种：\n\
  \n```c\n(*pfn)( arguments );\npfn( arguments );\n```\n\n正如所解释的，定义的 `pfn`，可以用于不同的函数，无论其参数的数量和类型如何。不可能的是使用此指针调用一个结果类型与声明该指针时指定的类型不同的函数。例如，如果这样声明\
  \ `pot` 函数：\n\n```c\nint pot(int, int);\n```\n\n那么赋值 `pfn = pot` 将导致错误，因为指针表示一个返回\
  \ `double` 的函数，而 `pot` 是一个返回 `int` 的函数。\n\n同样，也可以为特定类型的函数定义指针。例如，对于具有 `double` 类型参数且返回\
  \ `double` 类型值的函数，语句如下：\n\n```c\ndouble (*pfn)(double);\n```\n\n在这种情况下，将 `square`\
  \ 函数赋值给 `pfn` 是正确的，但不能将函数 `pot` 赋值，因为它有两个参数。\n\n操作指向函数的一维指针数组也可能很有趣。这提供了使用索引来选择函数的可能性。例如：\n\
