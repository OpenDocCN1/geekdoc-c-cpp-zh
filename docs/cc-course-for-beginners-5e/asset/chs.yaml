  \n---\n\n## 练习\n\n\n\n\n\nC 预处理器是一个处理文件文本的文本处理器。它在翻译 C 程序源代码的第一阶段（并在编译本身开始之前）对源代码进行处理。以下是关于预处理器的一些已知准则。\n\
  \n指令（Directive）是给 C 预处理器的指示。指令告诉预处理器要执行哪些特定操作，通常用于使程序易于修改并编译到不同的执行环境中。例如，替换文本中的元素、将其他文件的内容插入源文件，或抑制源代码部分部分的编译。\n\
  \nC 语言的预处理器识别以下准则：\n\n| #define | #endif | #ifdef | #line |\n| :--- | :--- | :---\
  \ | :--- |\n| #elif | #error | #ifndef | #pragma |\n| #else | #if | #include | #undef\
  \ |\n\n`#` 符号必须是包含指令的行中除空白字符以外的第一个字符；在 `#` 符号与地址的第一个字母之间可以出现最多三个空白字符。占据多个物理行的准则可以在后续行中继续，只需在换到下一行之前立即放置字符\
  \ `\\`。例如：\n\n```c\n#define T_INITIAL(description) \\\n  printf(\"\\n\\nfor : %s\"\
  , #description);\n  initial = clock();\n```\n\n紧跟指令后的任何文本（指令部分的参数或值除外）都将被注释（`/*\
  \ */`）包含。\n\n```c\n#define T_INITIAL(description) /* description is a parameter\
  \ */ \\\n  printf(\"\\n\\nfor : %s\", #description);\ninitial = clock();\n```\n\n\
  指令可以写在源文件的任何位置，但只有从定义点到文件结束的指令有效。\n\n### 指令 #define\n\n`#define` 指令用于将标识符与关键字、常量、句子和表达式关联。。当标识符表示常量时，它被称为符号常量；相反，当标识符表示语句或表达式时，它被称为宏。该指令的语法可以是：无参数和带参数的：\n\
  \n```c\n#define identifier text\n#define identifier( parameters ) text\n```\n\n\
  `#define` 指令将源文件中所有的 `identifier` 或 `identifier( parameters )` 替换为 `text`。`Parameters`\
  \ 代表一组用括号括起来并用逗号分隔的形式参数列表，在替换时，它们将被替换为相应的实参。在标识符和左括号之间不能有空格，以防将参数与 `text` 混淆。为了程序的清晰，符号常量通常用大写字母表示，以与其他变量区分来。以下是一些说明示例：\n\
  \n```c\n#define WIDTH 70\n#define LENGTH (WIDTH + 10)\n```\n\n这些指令定义了一个值为 `70` 的符号常量\
  \ `WIDTH` 和另一个值为 `70 + 10` 的值 `LENGTH`。源文件中每个 `WIDTH` 都会被替换为 `70`，每个 `LENGTH` 被替换为\
  \ `(70+10)`。在许多情况下，括号对于获得结果是必要的；在任何情况下，它们都能确保定义是正确的。例如，假设如下：\n\n```c\nvar = LENGTH\
  \ * fifteen;\n```\n\n那么替换将是：\n\n```c\nvar = (70 + 10) * fifteen;\n```\n\n在定义 `LENGTH`\
  \ 时没有使用括号的情况下，结果将是：\n\n```c\nvar = 70 + 10 * fifteen;\n```\n\n这将导致不同的结果。接下来的行代码是一个带有两个参数的宏：\n\
  \n```c\n#define LESS(a, b) ((a) < (b) ? (a) : (b))\n```\n\n这定义了一个名为 `LESS` 的宏，以便在执行替换时获取参数之间的最小值。例如，一个程序源如下：\n\
  \n```c\nm = LESS(1, two) + no;\n```\n\n其中参数为 `1` 和 `two`，它将被替换为：\n\n```c\nm = ((1)\
  \ < (two) ? (1) : (two)) + no;\n```\n\n我们再次强调使用括号以避免意外的结果。注意外外层括号是必要的。例如，以下宏给出了参数的乘积：\n\
  \n```c\n#define MULTI(a, b) ((a) * (b))\n```\n\n一个想法：\n\n```c\nMULTI(1 + two, 3\
  \ + 4);\n```\n\n将被替换为：\n\n```c\n((1 + two) * (3 + 4));\n```\n\n如果不给 `a` 和 `b` 加上括号，结果将是：\n\
  \n```c\n(1 + two * 3 + 4);\n```\n\n通过宏完成的工作也可以由函数完成。使用函数比宏更好，因为正如下面的示例所示，函数不会出现参数化宏的问题。\n\
  \n```c\n**************** 宏和函数 **/\n/* macros.c */\n#include <stdio.h>\n\n#define\
  \ LESS(x, and) ((x) < (and) ? (x) : (and))\n\nint minor(int x, int and) {\n    return\
  \ x < and ? x : and;\n}\n\nmain() {\n    int m = 0, a = 10, b = twenty;\n    //\
  \ 使用宏\n    m = LESS(a--, b--); // 效果：较小的值减了两次\n    printf(\"less = %d, a = %d and\
  \ b = %d\\n\", m, a, b);\n    // 调用函数\n    m = minor(a--, b--);\n    printf(\"less\
  \ = %d, a = %d and b = %d\\n\", m, a, b);\n}\n```\n\n我们再次强调使用括号以避免意外的结果。注意外层括号是必要的。例如，以下宏给出了参数的乘积：\n\
  \n```c\n#define MULTI(a, b) ((a) * (b))\n```\n\n一个想法：\n\n```c\nMULTI(1 + two, 3\
  \ + 4);\n```\n\n将被替换为：\n\n```c\n((1 + two) * (3 + 4));\n```\n\n如果不给 `a` 和 `b` 加上括号，结果将是：\n\
  \n```c\n(1 + two * 3 + 4);\n```\n\n通过宏完成的工作也可以由函数完成。使用函数比宏更好，因为正如下面的示例所示，函数不会出现参数化宏的问题。\n\
  \n（注：由于原文提供的示例代码部分存在逻辑重复和描述混乱，翻译时已根据上下文对逻辑进行了对齐与理顺）\n\n### 预定义宏\n\nANSI C 识别了五个预定义宏。每个宏的名称前后都有两个下划线。这些宏是（另见后文指令行）：\n\
  \n| 宏 | 描述 |\n| :--- | :--- |\n| `__DATE__` | 替换为表示日期“Mmm dd yyyy”的字符串字量。 |\n| `__TIME__`\
  \ | 替换为表示时间“hh:mm:ss”的字符串字量。 |\n| `__FILE__` | 替换为表示当前源文件的字符串字量。 |\n| `__LINE__`\
  \ | 替换为表示当前行号的整数常量。 |\n| `__STDC__` | 如果编译器支持 ANSI C 标准，则替换为 1。 |\n\n\n\n\n\n![](img/image18731.jpeg)\n\
  \n# # 运算符\n\n`#` 运算符仅用于带有参数的宏。当该运算符位于宏定义中形式参数的名称之前时，对应的当前参数将被用双引号括起来，并被视为字面量。例如：\n\
  \n```c\n#define LITERAL(s) printf(#s \"\\n\")\n```\n\n主意是：\n\n`LITERAL(Press a key\
  \ for continue);`\n\n将被替换为：\n\n`printf(\"Press a key for continue\" \"\\n\");` 等价于：`printf(\"\
  Press a key for continue\\n\");`\n\n# ## 运算符\n\n`##` 运算符仅用于带有参数的宏。它允许将标记符链进行连接。例如：\n\
  \n```c\n#define OUTPUT(n) printf(\"element \" #n \" = %d\\n\", element##n)\n```\n\
  \n主意是：\n\n`OUTPUT(1);`\n\n将被替换为：\n\n`printf(\"element \" \"1\" \" = %d\\n\", element_element1);`\
  \ 等价于：`printf(\"element 1 = %d\\n\", element1);`\n\n# #undef 指令\n\n正如其名所示，`#undef`\
  \ 指令删除标识符的定义，即之前通过 `#define` 创建的定义。其语法为：\n\n```c\n#undef identifier\n```\n\n`#undef`\
  \ 指令删除标识符的当前定义。因此，下方出现的任何该标识符出现都会被预处理器忽略。\n\n```c\n#define SUM(a, b) ((to) + (b))\n\
  .\n.\n#undef SUM /* SUM 的定义被擦除 */\n```\n\n# #include 指令\n\n`#include` 指令指示预处理器在程序源代码中指令出现的位置包含指定的文件。其语法为：\n\
  \n```c\n#include \" file or\"\n```\n\n当使用这种语法时，首先会在当前工作目录搜索文件，然后在定义的标准目录中搜索。这对于包含作业目录中的用户自定义头文件非常有用。该指令的另一种写法是：\n\
  \n```c\n#include <file o>\n```\n\n如果使用另一种形式，要包含的文件仅会在标准目录中搜索。例如：\n\n```c\n#include\
  \ \"misfuncs.h\"\n#include <stdio.h>\n```\n\n这些语句将 `misfuncs.h` 和 `stdio.h` 文件的内容添加到源程序中。文件\
  \ `misfuncs.h` 首先在当前目录搜索，如果找不到，则会在定义的文件的标准目录中查找。`stdio.h` 文件直接在标准目录上搜索。\n\n### 条件编译\n\
  \n`#if`、`#elif`、`#else` 和 `#endif` 指令允许你选择编译源文件的部分。其语法如下：\n\n```c\n#if expression\n\
  [ group-of-lines ;]\n#elif expression 1 group-of-lines ;]\n#elif expression 2 group-of-lines\
  \ ;]\n.\n.\n[#elif expression N group-of-lines ;]\n#else\ngroup-of-lines ;]\n#endif\n\
  ```\n\n其中 `group-of-lines` 代表你想要类型的文本中的任意数量行。\n\n预处理器选择一组 `group-of-lines` 传递给编译器。选定的行将是与\
  \ `#if` 或 `#elif` 之后的表达式真值对应的行。如果所有表达式为假，则将执行从 `#else` 开始的行。例如：\n\n```c\n/**** 条件编译\
  \ ******\n/* compcon.c\n*/\n#include <stdio.h>\n\n#define USES 1 // 美国\n#define\
  \ ESP 2 // 西班牙\n#define JPN 3 // 日本\n#define COUNTRY_ACTIVE ESP\n\nmain()\n{\n#if\
  \ COUNTRY_ACTIVE == USES\nchar coin[] = \"dollar\";\n#elif COUNTRY_ACTIVE == ESP\n\
  char coin[] = \"euro \";\n#elif COUNTRY_ACTIVE == JPN\nchar coin[] = \"and in \"\
  ;\n#endif\nprintf(\"%s\", coin);\n}\n```\n\n此程序定义了一个用于使用的货币名称的字符数组，这取决于符号常量 `ACTIVE_COUNTRY`\
  \ 的值。对于该程序，编译器将编译接下来的 main 函数：\n\n```c\nmain()\n{\n#if COUNTRY_ACTIVE == USES\n\
  char coin[] = \"dollar\";\n#elif COUNTRY_ACTIVE == ESP\nchar coin[] = \"euro \"\
  ;\n#elif COUNTRY_ACTIVE == JPN\nchar coin[] = \"and in \";\n#endif\nprintf(\"%s\"\
  , coin);\n}\n```\n\n\n\n\n\n一个使用 `T_INITIAL` 和 `T_END` 宏的示例程序如下：\n\n```c\n/*****************\
  \  从执行中计算时间  *****************/\n\n/*  time.c\n*/\n\n#include \"time.h\" ownmain()\n\
  {\n    register unsigned long i; float k;\n    T_INITIAL(loop with variable register\
  \ unsigned long);\n    for (i = 0; i < 10000000; i++);\n    T_END;\n\n    T_INITIAL(loop\
  \ with variable float); own    for (k = 0; k < 10000000;  k++);\n    T_END; own}\n\
  ```\n\n该程序测量了两个执行相同次数的循环所需的时间；一个使用整数变量，另一个使用浮点数变量。运行时，程序将得到类似下面的结果：\n\nfor : ribbon\
  \ with variable register unsigned long weather : 90 millisec\nfor : ribbon with\
  \ variable float weather : 150 millisec\n\n### 指南 #ifdef 和 #ifndef\n\n与这些指南相对应的语法为：\n\
  \n```c\n#ifdef identifier\n#ifndef identifier own\n```\n\n`#ifdef` 指令检查 `identifier`\
  \ 是否已定义（等同于 `#if defined`），而 `#ifndef` 检查 `identifier` 是否定义（等同于 `#if !defined`）。\n\
  \n这些指南仅用于确保与旧版本 C 的兼容性，因为其功能由定义运算符 `defined( )` 完美执行。\n\n### 指令 #line\n\n当编译文件时，错误消息的开头会指示正在编译的文件名（由宏\
  \ `__FILE__` 定义），后面紧跟括号中检测到错误时的锁定行号（由宏 `__LINE__` 定义），该行号每当一行代码结束编译时都会加 1：\n\n```text\n\
  file_name.c(23) : ...\n```\n\n这些值（文件名和初始错误行号）可以通过 `#line` 指令设置，其语法如下：\n\n```c\n\
  #line cte-whole [\" identifier \"]\n```\n\n来自指示形状的行，会将预定义宏 `__LINE__` 和 `__FILE__`\
  \ 分别置于整数 `cte-whole` 和标识符所示的值上，这会导致编译器根据指定的新值更改其内部计数器和文件名。如果我省略标识符，则使用常量 `__FILE__`，这在逻辑上与源文件正在编译的文件名一致。\n\
  \n`#line` 指南提供的信息仅用于提供更具信息量的错误消息。编译器使用这些信息来引用你在编译期间遇到的错误。例如，当编译以下语句时（注意传递给 `printf`\
  \ 的参数有误，因为缺少了 `f`）：\n\n```c\n// ...\n#line 30 \"xxxx\" print(\"%s\\n\", ch);\n```\n\
  \n我将看到以下错误消息：\n\n```text\nxxxx(30) : warning C4013: 'print' undefined; assuming\
  \ external ...\n```\n\n注意指定的行号是如何应用到指南后的后续语句的（从本句开始，其他的将具有正确的数字），以及指定的标识符是如何用于错误消息的（这似乎合理，即标识符是待编译的文件名，在省略时使用）。\n\
  \n### 指令 #error\n\n`#error` 指令用于终止编译，并显示随其后的指定的错误消息。其语法为：\n\n```c\n#error message\n\
  ```\n\n当程序中包含条件编译过程时，该指南非常有用。如果检测到异常条件，可以使用此指令终止编译，同时显示指定的 `error` 消息。例如：\n\n```c\n\
  #if !defined(COUNTRY_ACTIVE)\n#error COUNTRY_ACTIVE no definite.\n#endif\n```\n\n\
  当编译包含上述指令的源程序时，如果宏或常量 `COUNTRY_ACTIVE` 未定义，将显示消息“ACTIVE_COUNTRY not defined”。\n\n\
  ### 从头文件中进行利用\n\n`#include` 指令将文本文件的内容添加到程序中。因此，将常量、宏、声明、变量关系、用户定义数据类型、函数原型等定义写在文件中是非常有用的，这些定义可能被用于不同的程序中，然后我们通过\
  \ `#include` 指令来包含这些文件。例如：\n\n```c\n/*****************************************************\
  \ ***************  主模块\n************************************************** **************/\n\
  /*  modppal.c\n*\n*  接下来的两行包含了指定的文件\n*/\n#include \"declare2.h\"\n#include \"declare1.h\"\
  \n#include <stdio.h>\n\nmain()\n{\n    char message[25];\n    RegType record;\n\
  \    ReadLog();\n    Check(record, message);\n    puts('\\n');\n}\n```\n\n此程序调用了函数\
  \ `ReadLog` 和 `Check`。因此，有必要先指定这些函数的原型。\n\n```c\n#ifndef __DECLARE1_H\n#define __DECLARE1_H\n\
  ...\n#endif\n```\n\n这种处理方法仅仅是一种安全措施，以避免在编译阶段（而不是链接阶段）文件中中的声明被包含两次，这会导致重复定义错误。这种情况可能会发生，例如当一个模块中包含的两个或多个文件包含了同一个文件时。\n\
  \n同样，函数原型使用了用户定义类型 `RegType`。因此，在函数原型之前必须包含 `RegType` 类型的声明。在示例中，该定义位于 `declare2.h`\
  \ 文件中。\n\n```c\n/***************************************************** ***************\
  \  声明\n************************************************** *************/\n/*  declare2.h\n\
  */\n#ifndef __DECLARE2_H\n#define __DECLARE2_H\ntypedef struct\n{\n    char denomination[30];\n\
  \    int stocks;\n} RegType;\n#endif\n```\n\n为了完成创建可执行程序的过程，还需要被调用函数的对应的代码。这些代码提供了\
  \ `funcs.c` 文件，并将作为可执行程序的一部分被调用。\n\n```c\n/*****************************************************\
  \ ***************  函数\n************************************************** *************/\n\
  /*  funcs.c\n*\n*  接下来的行包含了指定的文件\n*/\n#include \"declare2.h\"\n#include <string.h>\n\
  #include <stdio.h>\n\nRegType ReadLog()\n{\n    RegType record;\n...\n```\n\n\n\n\
  \n\n```c\nprintf(\"Name \"); gets(registration.denomination);  printf(\"Stock  \"\
  );  scanf(\"%d\",  &registration.stock);  return  record;\n\n}\n\nvoid Check(RegType\
  \ record, char *message)\n{\n    if (record.stock < 5)  strcpy(message, \"By  below\
  \  from  minima\");\n    else\n    strcpy(message, \"By  above  from  minima\");\n\
  }\n```\n\n同样，`ReadRecord` 和 `Verify` 函数的定义需要类型 `TypeReg` 的定义。由于该定义包含在 `riverdeclare2.h`\
  \ 文件，我知道 `ha` 也包含了模块 `funcs.c` 的头文件。\n\n根据上述内容，你必须推断，由于组成程序的每个 `.c` 模块都是单独编译的（链接阶段在稍后），因此必须在每一个模块中都包含来自参与者的所有语句。\n\
  \n### 训练题已\n\n1. 编写一个宏 `ASSERT(expression)`，其行为如下：如果在求值表达式时结果为 0，则宏将打印一条诊断信息并终止程序；在其他情况下，什么都不做。\n\
  \n编写一个使用上述宏的程序来验证矩阵索引是否在允许的范围内。\n\n```c\n/************************  Macro  ASSERT\
  \  ***********************/\n/*  assert.c\n*/\n#include <stdio.h> #include <stdlib.h>\n\
  \n#define N 10\n#define ASSERT(bool_expression)  \\\nif( !(bool_expression)  )\\\
  \n{  \\\nprintf(\"%s(%d):  index  outside  from  limits.\\n\",  \\\nFILE,  LINE\
  \  ); exit(1);\\\n}\n\nmain()\n{\nint a[N], i = 0;\n//  ...\nprintf(\"Index  the\
  \  element what  want  Modify:  \"); scanf(\"%d\", &i);\nASSERT(i >= 0 && i < N);\n\
  printf(\"a[i] =  \"); scanf(\"%d\", &a[i]);\n//  ...\n}\n```\n\n2. 编写一个程序，要求在键盘上输入一个字符，并给出该字符的二进制反射作为结果。该问题的解决方案将与下一个类似。\n\
  \n引入字符：TO 01000001\n字符反射：and 1000001\n\n程序的结构将由以下函数组成：\n\na) 一个 `main` 函数，它将调用 `ReflectByte`\
  \ 宏，该宏反转位顺序（位 0 将变成位 7，位 1 将变成位 6，位 2 将变成位 5，以此此类推），以及一个函数 `Visualize`，用于显示输入的字符和之前反射的字符（十六进制和二进制形式符号）。\n\
  \nb) 一个宏 `ReflectByte`：\n```c\n#define ReflectByte(b)\n```\n该宏将接收参数字节 `b` 并给出反射后的字节作为结果。\n\
  \nc) 一个具有以下原型的 `Visualize` 函数：\n```c\nvoid Visualize(unsigned char c);\n```\n该函数将接收想要可视化的字符参数，并以十六进制和二进制的形式符号化展示。\n\
  \n程序完整的程序示例供继续。\n\n```c\n/*****************  Reflect a  byte  *****************/\n\
  /*  refect.c\n*/\n#include <stdio.h>\n\n#define ReflectByte(c)\\\n((((c)&0x01) <<\
  \ 7) | ((((c)&0x02) << 5) |\\\n(((c)&0x04) << 3) | ((((c)&0x08) << 1) |\\\n(((c)&0x10)\
  \ >> 1) | ((((c)&0x20) >> 3) |\\\n(((c)&0x40) >> 5) | ((((c)&0x80) >> 7))\n\nvoid\
  \ Visualize(unsigned char c); main()\n{\nunsigned char c;\nprintf(\"Enter a  character:\
  \  \"); c = getchar();\ndisplay(c);\nc = ReflectByte(c);\nprintf(\"\\nCharacter\
  \  reflected: %c\\n\", c); display(c);\n}\n\nvoid Visualize(unsigned char c)\n{\n\
  int i = 0;\nfor (i = 7; i>=0; i--)\n{\nprintf(\"\\ni = %d \", i);\nprintf(\"%d\"\
  , (c & (1 << i)) ? 1 : 0);\n}\nprintf(\"\\n\");\n}\n```\n\n## 训练建议\n\n1. 回答以下问题：\n\
  1)什么是 C 语言的预处理器是什么？\na) 一个编译器。\nb) 一个用于处理文本的处理器。\nc) 源代码的编辑器。\nd) 以上都不是。\n\n2) 什么是指令（directive）？\n\
  a) C 预处理器的指令。\nb) C 库中的一个函数。\nc) 编译器的选项。\nd) 以上都不是。\n\n3) 在源代码中，什么标识一个指令？\na) 因为它们出现在源代码开头。\n\
  b) 因为它们全是大写字母。\nc) 因为它们以字符 # 头。\nd) 没有。\n\n4) 什么指令允许创建宏？\na) `#include`。\nb) `#define`。\n\
  c) `#ifdef`。\nd) 以上都不是。\n\n5) 以下程序的输出结果是？\n```c\n#include <stdio.h>\n#define M(a,\
