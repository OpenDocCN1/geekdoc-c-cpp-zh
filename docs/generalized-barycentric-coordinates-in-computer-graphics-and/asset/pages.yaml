    Figure 9.1 A regular triangulation (left), once deformed (right), becomes a combinatorially
    regular triangulation that is not regular itself. (Image taken from [237].)


    Definition 9.3 (Primal-dual triangulation (PDT)). A pair $(T, K)$ is said to form
    a $d$-dimensional primal-dual triangulation if $T$ is a triangulation in $\mathbb{R}^d$
    and $K$ is a compatible dual complex of $T$. If every edge $[\boldsymbol{x}_p,
    \boldsymbol{x}_q]$ and its dual $C_{i_p} \cap C_{i_q}$ are orthogonal to each
    other, then the pair $(T, K)$ is said to form an *orthogonal primal-dual triangulation*.


    # 9.3 A CHARACTERIZATION THEOREM


    Let us consider a set of points $X$ in $\mathbb{R}^d$. For any set of weights
    $\boldsymbol{\omega}$, the power diagram of $(X, \boldsymbol{\omega})$ and the
    corresponding dual regular triangulation form a PDT of the convex hull of $X$.
    In other words, any regular triangulation admits a compatible dual complex and
    can be part of a PDT. Moreover, in [274] we showed that for simply connected domains,
    any triangulation that admits a compatible dual complex is indeed regular up to
    a perturbation. For a more formal statement we need the following definitions.


    # 9.3.1 Combinatorially regular triangulations (CRT)


    Definition 9.4 (Combinatorial equivalence). Two triangulations $T$ and $T''$ are
    *combinatorially equivalent* if there exists a labeling that associates to each
    point $\boldsymbol{x}_i$ in $T$ a point $\boldsymbol{x}''_i$ in $T''$ so that
    the connectivity between the $\boldsymbol{x}_i$''s induced by $T$ matches the
    connectivity between the $\boldsymbol{x}''_i$''s induced by $T''$.


    Definition 9.5 (Combinatorially regular triangulations (CRT)). A triangulation
    $T$ of a $d$-dimensional point set $X$ is called a *combinatorially regular triangulation*
    if there exists a $d$-dimensional point set $X''$ admitting a regular triangulation
    $T''$, such that $T$ and $T''$ are combinatorially equivalent.


    These CRT triangulations have been introduced in [237] under the name of *weakly*
    regular triangulations, since a displacement of their vertices suffices to make
    them regular. Figure 9.1 shows an example of a combinatorially regular triangulation
    that is not regular itself.'
