    ```


    Here \(A_{ij}\) denotes the combined area of the two triangles incident to edge
    \((i, j)\) and \(A_i\) is the combined area of all triangles incident to vertex
    \(i\). The corresponding weakly defined Laplacian \(L\) is the *stiffness matrix*
    with entries


    ```

    \(L_{ij} = \begin{cases} -\frac{1}{2}(\cot \alpha_{ij} + \cot \beta_{ij}), & \text{if
    } i \sim j, \\ -\sum_{j \sim i} L_{ij}, & \text{if } i = j, \\ 0, & \text{otherwise,}
    \end{cases}\)

