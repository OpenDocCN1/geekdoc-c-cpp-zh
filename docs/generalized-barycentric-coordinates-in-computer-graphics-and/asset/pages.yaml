    # 12.3.2 Displacement space on polyhedra in 3D


    Let $P \in \mathbb{R}^3$ be a polyhedron whose boundary consists of planar polygonal
    faces in its undeformed configuration with its $n$ vertices located at $\boldsymbol{v}_1,
    \dots, \boldsymbol{v}_n$. As in the 2D case, one can define generalized barycentric
    coordinates $\phi_1^{(1)}, \dots, \phi_n^{(1)}$ as the basis for a linear polyhedral
    finite element space on $P$ using vertex degrees of freedom.


    This chapter considers the Wachspress coordinates, as defined in [413] and analyzed
    in [147], which are valid for simple polyhedra. This means that the collection
    of faces that include $\boldsymbol{v}_i$ for each $i = 1, \dots, n$ consists of
    exactly three faces. As before, we denote by $\mathcal{V}_i(P) = \text{span}\{\phi_i^{(1)},
    \dots, \phi_n^{(1)}\}$ the finite element space on $P$, which by linear precision
    of the Wachspress coordinates includes $\mathcal{P}_1(P)$. We remark that the
    gradient correction scheme described later in this chapter is applicable to other
    types of coordinates on linear and quadratic polyhedrons as well, though certain
    aspects of its implementation and performance in numerical simulations require
    a separate examination.


