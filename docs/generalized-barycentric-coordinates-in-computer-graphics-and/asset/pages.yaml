  md: 'Then, the LME basis functions can be expressed at any point $x \in P$ as


    $$

    \phi_i(x) = \frac{1}{Z(x, \lambda^*(x))} \exp \left[ -\beta_i \|x - v_i\|^2 +
    \lambda^*(x) \cdot (x - v_i) \right]. \quad (13.9)

    $$


    This expression is not fully explicit because to compute $\lambda^*(x)$ an unconstrained
    optimization must be solved: the minimization of the strictly convex function
    $\log Z(x, \lambda)$. It can be observed that the functions can be viewed as the
    product of a Gaussian function around vertex $v_i$, a normalizing factor ($Z$)
    so that all functions add up to one, and an exponential factor that depends on
    the Lagrange multiplier $\lambda^*$ enforcing the linear reproduction condition.
    Examination of (13.9) shows that, strictly speaking, these basis functions have
    global support. However, due to the fast decay of the Gaussian function, for all
    practical purposes they can be considered as compactly supported. Furthermore,
    the sum in calculation of $Z$ in (13.8) effectively involves only a handful of
    terms corresponding to vertices in the neighborhood of $x$, which makes the evaluation
    of the basis functions efficient.


    We emphasize the dependence of $\lambda^*$ on position to highlight the fact that
    at each evaluation point, an unconstrained nonlinear optimization problem must
    be solved. This problem, however, is only $d$-dimensional, has a unique solution,
    and can be efficiently solved numerically using Newton''s method. See [15, 279,
    335] for mathematical and computational details, as well as for the explicit expressions
    to compute first and second spatial derivatives of the basis functions, and see
    [177] for the calculation of the gradients of the basis functions on the boundary
    of $P$.


