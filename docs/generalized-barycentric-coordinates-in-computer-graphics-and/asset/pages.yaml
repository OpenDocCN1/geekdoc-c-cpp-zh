    vector fields on \(P\) such that the utilized quadrature makes sense. The corrected
    gradient


    ```

    \(\nabla_{P,k}v = [(\nabla_{P,k}v)_x, (\nabla_{P,k}v)_y]^T \text{ in 2D}\)

    \(\nabla_{P,k}v = [(\nabla_{P,k}v)_x, (\nabla_{P,k}v)_y, (\nabla_{P,k}v)_z]^T
