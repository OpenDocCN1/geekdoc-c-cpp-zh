- pgno: 134
  md: 'holomorphic. In addition, products and compositions of holomorphic functions
    are also holomorphic, and the quotient of two holomorphic functions is holomorphic
    as long as the denominator does not vanish.


    If a complex function \(f(x+iy) = u(x,iy) + iv(x,iy)\) is holomorphic, then the
    real and imaginary parts, \(u\) and \(v\), have first partial derivatives with
    respect to \(x\) and \(y\) that satisfy the Cauchy–Riemann equations


    ```

    \(\frac{\partial u}{\partial x} = \frac{\partial v}{\partial y}, \quad \frac{\partial
    u}{\partial y} = -\frac{\partial v}{\partial x}.\)

    ```


    The converse is also true under very mild assumptions; that is, if the partial
    derivatives of \(f\) are continuous and satisfy the Cauchy–Riemann equations,
    then \(f\) is holomorphic. Treating \(f\) as a planar map, we can express the
    Jacobian of \(f\) as


    ```

    \(J_f = \begin{pmatrix} \frac{\partial u}{\partial x} & \frac{\partial u}{\partial
    y} \\ \frac{\partial v}{\partial x} & \frac{\partial v}{\partial y} \end{pmatrix}
    = \begin{pmatrix} \frac{\partial u}{\partial x} & -\frac{\partial v}{\partial
    x} \\ \frac{\partial v}{\partial x} & \frac{\partial u}{\partial x} \end{pmatrix}
    = \begin{pmatrix} a & -b \\ b & a \end{pmatrix},\)

    ```


    where the second equality is due to the Cauchy–Riemann equations. The first complex
    derivative of a holomorphic function with respect to \(z\) is often denoted by
    \(f''\) and satisfies \(f'' = a + ib\). As can be seen above, the Jacobian matrix
    of a holomorphic function (when treated as a planar map) has the structure of
    a similarity matrix. Its determinant is given by \(\det(J_f) = a^2 + b^2\) and
    is always nonnegative; hence, holomorphic maps cannot reverse orientation. If
    a holomorphic map \(f\) has nonvanishing derivative \(f''(z) \neq 0\) (which is
    equivalent to \(\det(J_f) > 0\)) for every \(z \in \Omega\), then the map \(f\)
    is called a *conformal map*. For conformal maps, the Jacobian above can be expressed
    as


    ```

    \(J_f = r \begin{pmatrix} \cos \theta & -\sin \theta \\ \sin \theta & \cos \theta
    \end{pmatrix}, \quad (7.3)\)

    ```


    where \(r = |f''| = \sqrt{a^2+b^2} = \sqrt{\det(J_f)}\) is the modulus (length)
    of the complex derivative and \(\theta = \text{Arg } f''\) is its complex argument,
    that is, the angle between the complex number viewed as a vector and the positive
    real axis. Equation (7.3) provides a geometric interpretation for conformal maps
