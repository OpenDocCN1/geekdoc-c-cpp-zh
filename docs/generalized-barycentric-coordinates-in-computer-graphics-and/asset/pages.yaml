  md: '# *Existence of PDTs in 2D.*


    The 2D case is rather simple, due to the following result, which is mainly based
    on a classical theorem of Steinitz [368] and also mentioned in [237, 274].


    **Proposition 9.6.** Any 2-dimensional triangulation is combinatorially regular.


    Therefore, every 2D triangulation $T$ can be part of a PDT pair $(T, K)$. However,
    in higher dimensions ($d \ge 3$), the situation is rather different [274].


    **Proposition 9.7.** For $d \ge 3$, there exist $d$-dimensional triangulations
    that do not admit any compatible dual complex.


    This is equivalent to the fact that there exist triangulations that are not combinatorially
    regular. The simplest non-combinatorially regular examples are the Brucker sphere
    and the Barnette sphere [141].


    # 9.3.2 Equivalence between PDT and CRT


    As shown in [274], combinatorially regular triangulations are the *only* triangulations
    that admit compatible dual complexes. The proof revolves around a theorem due
    to Aurenhammer.


    Every simple cell complex in $\mathbb{R}^d, d \ge 3$, is dual to a regular triangulation.


    This theorem was proved in [18] through an iterative construction, which is valid
    in any dimension $d \ge 3$. In [274], we used this theorem to prove the following
    theorem, which surprisingly implies that in higher dimensions there are triangulations
    that do not admit a dual complex.


    **Theorem 9.8** (PDT characterization). A $d$-dimensional triangulation $T$ admits
    a compatible (not necessarily orthogonal) dual complex if and only if $T$ is combinatorially
    regular.


    # 9.3.3 Parametrization of primal-dual triangulations


    We established that for simply connected domains, the space of primal-dual triangulations
    covers all dual complexes in $d \ge 3$. It also covers all 2D triangulations,
    but only combinatorially regular triangulations in $d \ge 3$. The proof of Theorem
    9.8 leads naturally to a parametrization of all triangulations that admit a compatible
    dual complex [274].


    **Definition 9.9.** A parameterized primal-dual triangulation is a primal-dual
    triangulation parameterized by a set of triplets $(\mathbf{x}_i, \omega_i, \mathbf{v}_i)$,
    where $\mathbf{x}_i$ is the *position* in $\mathbb{R}^d$ of the $i$-th node, $\omega_i$
    is a real number called the *weight* of $\mathbf{x}_i$, and $\mathbf{v}_i$ is
    a $d$-dimensional vector called the *displacement vector* of $\mathbf{x}_i$. The
    triangulation associated with the triplets $(\mathbf{x}_i, \omega_i, \mathbf{v}_i)$
    is defined such that its dual complex $K$ is the power diagram of weighted points
    $(\mathbf{p}_i, \omega_i)$, where $\mathbf{p}_i = \mathbf{x}_i + \mathbf{v}_i$.'
