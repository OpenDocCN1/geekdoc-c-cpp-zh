    # ## 8.2.3 Degree elevation


    Even though Loop and DeRose [257] mention degree elevation for S-patches, the
    authors provide no explicit formula. However, degree elevation is not difficult
    to derive. Let \(f_\ell\) be the values of the control points for an S-patch function
    of degree \(|\ell| = m\) and \(f_j\) be control points of the same S-patch function
    of degree \(|j| = m + 1\). Then,


    ```

    \(\left( \sum_{|\ell|=m} B_\ell^m(\boldsymbol{x}) f_\ell \right) \left( \sum_{i=1}^n
    \phi_i(\boldsymbol{x}) \right) = \sum_{|j|=m+1} B_j^{m+1}(\boldsymbol{x}) \hat{f}_j.
    \quad (8.6)\)

    ```


    Note that the basis functions of various degrees are related to each other via


    ```

    \(B_j^{m+1}(\boldsymbol{x}) = B_{j-r_i}^m(\boldsymbol{x}) \frac{m+1}{j_i} \phi_i(\boldsymbol{x})
    \quad (8.7)\)

    ```


    for \(j_i > 0\). Expanding the left-hand side of (8.6) and using (8.7) yields
    the formula for the \(m+1\) degree control points \(\hat{f}_j\),


    ```

    \(\hat{f}_j = \sum_{j_i > 0} \frac{j_i}{m+1} f_{j-r_i}.\)

    ```'
