  md: '![](img/4913dd83a2a14bc205a0a92cce102c82_303_0.png)


    Figure 15.1 Vertex (left), edge (middle), and interior (right) polygonal basis
    functions for \(k=2\) on a square element. See color insert.


    **Remark 15.1.** Using a Neumann-type boundary condition in the local definition
    (15.3) leads to a different class of virtual element spaces, known as the *non-conforming
    virtual elements* [21, 82]. In this setting, the formal definition in (15.4) must
    be changed, since non-conforming functions can be discontinuous over \(\Omega\)
    and, consequently, are not in \(H^1(\Omega) \cap C^0(\overline{\Omega})\). However,
    we will not pursue this method any further here.


    # 15.2.4 The natural basis


    An intuitive choice of basis for the general local space \(V_P^k\) is to use the
    degrees of freedom of the data that define the Dirichlet problem on each element
    \(P\). This yields the set of basis functions


    ```

    \(\psi = \left\{ \{ \psi_{v_i} \}_{i=1}^n, \{ \psi_{e,\alpha} \}_{\alpha=1}^{\mathcal{N}_e}
    \text{ for each } e \in \mathcal{E}_P, \{ \psi_{P,\alpha} \}_{\alpha=1}^{\mathcal{N}_P}
    \right\},\)

    ```


    where each function is the formal solution of an independent problem associated
    with a vertex, edge, or the interior of \(P\). Figure 15.1 shows an example of
    these basis functions for \(k=2\) on a square element. From the definition of
    the VE spaces, we may note that \(k=2\) is the lowest order case for which edge
    and interior basis functions are present. Indeed, for \(k=1\) we only have vertex
    basis functions, which are also the same for every \(k>1\). Here, \(n\) still
    denotes the number of vertices of \(P\), and


    ```

    \(\mathcal{N}_e := \dim(\mathbb{P}_{k-2}(e)) = k-1;\quad \mathcal{N}_P := \dim(\mathbb{P}_{k-2}(P))
    = k(k-1)/2.\)

    ```


    The basis functions are defined as follows:


    # **Vertex basis functions** \(\psi_{\mathbf{v}_i}\)


    For every vertex \(\mathbf{v}_i\), we define the function \(\psi_{\mathbf{v}_i}
    \in V_P^k\) as the unique solution of the following Poisson problem:


    ```

    \(\left\{ \begin{array}{ll} -\Delta \psi_{\mathbf{v}_i} = 0 & \text{in } P, \\
    \psi_{\mathbf{v}_i}(\mathbf{v}_j) = \delta_{ij} & \text{for } i,j=1,\dots,n, \\
    \psi_{\mathbf{v}_i}|_e \in \mathbb{P}_1(e) & \forall e \in \bar{\mathcal{E}}_P.
    \end{array} \right. \quad (15.5)\)

    ```'
