    # 3.4.2 Generalized potentials for polygons


    When the domain boundary \(\partial \Omega\) is approximated by a polygon in 2D,
    then the potential \(\Phi_p(\mathbf{x})\) at a point \(\mathbf{x}\) is obtained
    by computing the contribution of each edge of the polygon and summing these contributions.


    In the 2D case, given a point \(\mathbf{x}\), an edge \([\mathbf{v}_i, \mathbf{v}_{i+1}]\),
    and the angle \(\alpha\) between the vectors \(\mathbf{v}_i - \mathbf{x}\) and
    \(\mathbf{v}_{i+1} - \mathbf{x}\), we need to express the distance \(\rho(\theta)\)
    between \(\mathbf{x}\) and the point \(\mathbf{y} \in [\mathbf{v}_i, \mathbf{v}_{i+1}]\),
    where \(\theta\) is the angle between \(\mathbf{v}_i - \mathbf{x}\) and \(\mathbf{y}
    - \mathbf{x}\). Let \(r_i = \|\mathbf{x} - \mathbf{v}_i\|\) and \(r_{i+1} = \|\mathbf{x}
    - \mathbf{v}_{i+1}\|\) (see Figure 3.8). The area of the triangle \([\mathbf{x},
    \mathbf{v}_i, \mathbf{v}_{i+1}]\) is equal to the sum of the triangles \([\mathbf{x},
    \mathbf{v}_i, \mathbf{y}]\) and \([\mathbf{x}, \mathbf{y}, \mathbf{v}_{i+1}]\).


    \(r_i r_{i+1} \sin \alpha = r_i \rho(\theta) \sin \theta + r_{i+1} \rho(\theta)
    \sin(\alpha - \theta),\)


    giving


    \(\rho(\theta) = \frac{r_i r_{i+1} \sin \alpha}{r_i \sin \theta + r_{i+1} \sin(\alpha
    - \theta)}.\)'
