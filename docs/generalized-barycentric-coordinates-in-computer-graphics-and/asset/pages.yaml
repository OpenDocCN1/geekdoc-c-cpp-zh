    at the vertices. Afterwards, we solve 1D Laplace problems on the edges with the
    given data at the vertices as boundary-values, which is equivalent to connecting
    the values by a linear function. Next, 2D Laplace problems are solved on each
    polygonal face with the previously defined data on the edges as boundary-values.
    And finally, the data on the faces is used as Dirichlet data for 3D Laplace problems
    in the element. Thus, we have a hierarchical construction of the basis functions
    starting from the definition at the vertices and going over the edges to the faces
    and finally to the elements. In the case of a polyhedral element \(P\) with triangular
    faces, the two strategies result in the same basis functions. If we have polygonal
    faces, however, the hierarchical strategy has fewer basis functions compared to
    the original one in general.


