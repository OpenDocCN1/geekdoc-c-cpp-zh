    # ## 11.5.1 Fracture methodology


    One approach for regularizing the pervasive fracture problem is to only allow
    fracture surfaces to form at the inter-element faces of a finite element mesh
    as shown in Figure 11.12. At the inception of material softening leading to fracture,
    the connectivity of the mesh is modified to reflect a new surface, and a cohesive
    traction with a softening behavior is dynamically inserted. The cohesive traction
    is of the extrinsic form, as opposed to an intrinsic traction-separation relation
    that is a priori seeded throughout the face network of the finite element mesh
    [303]. The restriction of only allowing new surfaces to form at inter-element
    faces provides a necessary regularization of the resulting domain and surface
    topologies to obtain a robust simulation. This approach to modeling pervasive
    fracture processes has been used by several researchers [46, 239, 299, 300, 339,
    340]. Instead of inserting new fracture surfaces at the start of material softening,
    one could also use gradient damage or phase field computational methodologies
    [64, 277, 278, 331] to model the physics of material softening and then change
    mesh connectivity when the load-carrying capacity of the material has decreased
    below a certain threshold.


    This technique for modeling fracture typically results in a type of mesh-dependency
    in the crack paths. The use of a random mesh with no preferred orientation restores,
    in a weak sense, simulation objectivity within this class of fracture methods.
    A certain type of random mesh advocated by the author is the random close-packed
    (RCP) Voronoi mesh [46]. This type of mesh is described in more detail in the
    following subsection. The RCP Voronoi mesh provides a random face network for
    representing fracture surfaces. The polyhedral cells of the RCP Voronoi mesh are
    formulated as finite elements. The broader question of what type of mesh is optimal
    for this fracture methodology is an area of active research [302, 304, 325].


    Within this computational approach for modeling pervasive fracture, there are
    a number of possibilities for controlling fracture initiation and growth. For
    example, at one extreme new fracture surfaces can be restricted to nucleate only
    at an existing fracture tip. At the other extreme new fracture surfaces can be
    allowed to nucleate at any element face. For quasi-static applications, the approach
    of only allowing new fractures to form from existing fracture surfaces seems more
    realistic. However, this restriction may be overly restrictive by not allowing
    new fracture surfaces to form in front of or near an existing fracture. Allowing
    fractures surfaces to form in front of or near an existing fracture would help
    ameliorate the artificial toughness induced by constraining crack growth to predefined
    surfaces. In effect, a damage band is formed around the crack front, in analogy
    to subscale damage mechanisms'
