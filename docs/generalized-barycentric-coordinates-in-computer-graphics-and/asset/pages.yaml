    To summarize, applying Gauss-Seidel relaxation to Tutte''s equation simply means
    iteratively moving each interior vertex to the weighted barycenter of its neighbors.
    This method is very simple to implement, and gives results in a reasonable time
    for small meshes (with a few thousand elements). If larger meshes need to be processed,
    then one can consider using more efficient iterative methods such as the bi-conjugate
    gradient method, as suggested in [143]. If memory consumption is not an issue,
    sparse direct solvers such as SuperLU [246] can be an even more efficient alternative.
    See also the chapter on numerical aspects in [66].


    # 6.6 CHOOSING THE WEIGHTS


    Depending on the application, it is often desired to create a parameterization
    that minimizes deformations between the 2D parametric space and the 3D surface.
    Using uniform weights \( w_{ij} = 1/|N_i| \), where \( |N_i| \) denotes the number
    of neighbors of vertex \( v_i \), the obtained parameterization is valid, but
    can be highly distorted. Figure 6.10 (left) displays the deformations by painting
    a regular grid in the 2D parametric space and transforming it onto the 3D surface.


    One can use instead as weights \( w_{ij} \) the mean value coordinates [144, 200],
    which take into account the geometry of the input surface and are positive as
    required by Tutte''s theorem (see Section 1.2.3). Note that to satisfy the requirements
    of Tutte''s theorem, they need to be normalized as in (1.12). The resulting parameterization
    is displayed in Figure 6.10 (right).


