    # ## 2.2 DECONSTRUCTING THE A PRIORI ERROR ESTIMATE


    The typical *a priori* error analysis of a finite element method begins with a
    characterization of the partial differential equation to be solved as an equation
    between a coercive, continuous bilinear form on \(V \times V\) and a bounded linear
    operator \(L\) on \(V\), where \(V\) is the function space from which \(u\) is
    sought [70, 369]. We fix the common setting of \(V = H_0^1(\Omega)\), the space
    of \(H^1\) functions on domain \(\Omega\), with zero boundary conditions on \(\partial\Omega\).
    Cea’s lemma then asserts the existence of a constant \(C_C\) such that


    ```

    \(\|u - u_h\|_{H^1(\Omega)} \le C_C \min_{v_h \in V_h} \|u - v_h\|_{H^1(\Omega)}.\)
    (2.1)

    ```


    Here, \(u \in V\) is the unknown continuous solution to the problem, \(u_h\) is
    the approximation to \(u\) computed by the finite element method, and \(V_h\)
    is a finite-dimensional subspace of \(V\) from which \(u_h\) is sought. Hence,
    (2.1) establishes that the error between \(u_h\) and \(u\) is within a constant
    multiple of the best possible error when looking for a solution in \(V_h\).


    The next step in the analysis is to bound the error in the particular case of
    \(v_h := Iu\), where \(I: V \to V_h\) is an interpolation operator. A subtle but
    crucial point is that \(I\) takes as input the entire unknown function \(u\) to
    produce \(Iu\) and thus'
