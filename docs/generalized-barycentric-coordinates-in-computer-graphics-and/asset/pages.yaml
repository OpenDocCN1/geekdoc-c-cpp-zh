    # Transfinite complex barycentric coordinates


    The derivation of holomorphic complex barycentric coordinates can be obtained
    through the generalization of the concept of complex barycentric coordinates to
    the transfinite case. The polygonal region is substituted by an arbitrary domain
    $\Omega$ bounded by a simple contour $\partial \Omega$ with arbitrary shape. Real
    transfinite barycentric coordinates are discussed in detail in Chapter 3. Here
    we focus on the complex counterpart.


    To this end, we use the notion of a kernel function $\phi: \partial \Omega \times
    \Omega \rightarrow \mathbb{C}$. Loosely speaking, the continuous contour can be
    viewed as a polygon on an infinite number of vertices, and the complex kernel
    $\phi(w, z)$ is viewed as an analogue for the $i$-th coordinate where $w$, a boundary
    point, substitutes the $i$-th vertex. Analogously to (7.1) and (7.2) in the discrete
    polygonal case, we say that $\phi(w, z)$ is a *complex barycentric kernel*, if
    the properties


    \int_{\partial \Omega} \phi(w, z) \, dw = 1, \quad (7.4)


    \int_{\partial \Omega} \phi(w, z) w \, dw = z \quad (7.5)


    hold for every point $z \in \Omega$. Then, a *transfinite complex barycentric
    map* is a complex-valued function $f: \Omega \rightarrow \mathbb{C}$ of the form


    f(z) = \int_{\partial \Omega} \phi(w, z) f(w) \, dw, \quad (7.6)


    where the differential $dw$ in the contour integrals in (7.4), (7.5), and (7.6)
    is complex.


    Somewhat surprisingly, there is a fairly simple choice for a kernel $\phi(w, z)$
    that satisfies (7.4) and (7.5), which is called the Cauchy kernel [36]


    \phi_C(w, z) = \frac{1}{2\pi i} \frac{1}{w - z}.


    To see why this is true, let us recall Cauchy’s integral formula, which is one
    of the most fundamental statements in complex analysis. The statement asserts
    that the value of a holomorphic function $h: \Omega \rightarrow \mathbb{C}$ at
    a point $z \in \Omega$, is fully determined by its values on the boundary, and
    can be expressed explicitly by evaluating the contour integral,


    h(z) = \frac{1}{2\pi i} \int_{\partial \Omega} \frac{h(w)}{w - z} \, dw. \quad
    (7.7)'
