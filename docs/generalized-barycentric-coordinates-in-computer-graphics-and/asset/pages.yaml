    # 2.1 INTRODUCTION


    In this work, we present both practical computational evidence and theoretical
    mathematical analyses for a variety of circumstances in which generalized barycentric
    interpolation will predictably succeed. Our primary proxy for the success of interpolation
    is a sharp upper bound on $||

    abla\phi_i||_\infty$, the maximum gradient of a generalized barycentric coordinate
    function, in terms of the relative positioning of the vertices $\{v_1, ..., v_n\}$
    of the polygon or polyhedron $P$ on which $\phi_i$ is defined. In computer graphics
    applications, control of gradients is essential to avoid visual artifacts. In
    computational mechanics applications, the gradient of the solution to a partial
    differential equation is often a quantity of interest in itself; in Poisson’s
    equation, for instance, the gradient of the solution contributes to the energy
    norm (i.e., the $H^1$-norm) that is used to measure error. Further, we seek the
