    \(\alpha = d\mu + d^* \nu + h,\)


    known as the \(Hodge\) decomposition (or Hodge–Helmholtz decomposition), where
    \(\mu\) is a \((k-1)\)-form, \(\nu\) is a \((k+1)\)-form, and \(h\) is a harmonic
    \(k\)-form. This decomposition is unique and orthogonal with respect to the \(L^2\)
    inner product on \(k\)-forms,


    \(0 = \langle d\mu, d^* \nu \rangle_k = \langle h, d\mu \rangle_k = \langle h,
    d^* \nu \rangle_k,\)


    which immediately follows from the fact that \(d \circ d = 0\) and the fact that
    harmonic forms satisfy \(dh = d^* h = 0\). The Hodge decomposition can be thought
    of as a (formal) application of the well-known fact from linear algebra that the
    orthogonal complement of the kernel of a linear operator is equal to the range
    of its adjoint (transpose) operator.


    By duality between vector fields and 1-forms, the Hodge decomposition for 1-forms
    carries over to a corresponding decomposition for vector fields into curl-free
    and divergence-free components, which has applications for fluid mechanics [13]
    and Maxwell’s equations for electromagnetism [155].


    Geometrically, the Hodge decomposition establishes relations between the Laplacian
    and global properties of manifolds. Indeed, the linear space of harmonic \(k\)-forms
    is finite-dimensional for compact manifolds and isomorphic to \(H^k(M; \mathbb{R})\),
    the \(k\)-th cohomology of \(M\). As an application of this fact, consider a compact
    orientable surface without boundary. Then the dimension of the space of harmonic
    1-forms is equal to twice the genus of the surface; that is, this dimension is
    zero for the 2-sphere, two for the two-dimensional torus, four for a genus-two
    surface (pretzel) and so on. Hence the Laplacian provides global information about
    the topology of the underlying space.


    For a thorough treatment of Hodge decompositions, including the case of manifolds
    with boundary, we refer to [351].'
