    # 5.1.1 Basic properties


    The Laplacian has many intriguing properties. For the remainder of this exposition,
    consider an open and bounded domain \(\Omega \subset \mathbb{R}^n\) and the \(L^2\)
    inner product


    ```

    \((f, g) = \int_\Omega fg\)

    ```


    on the linear space of square-integrable functions on \(\Omega\). Let \(u, v:
    \Omega \to \mathbb{R}\) be two (sufficiently smooth) functions that vanish on
    the boundary of \(\Omega\). Then the Laplacian \(\Delta\) is a _symmetric_ (or,
    to be precise, a formally self-adjoint) linear operator with respect to this inner
    product, since integration by parts yields


    ```

    (Sym) \((u, \Delta v) = \int_\Omega \nabla u \cdot \nabla v = (\Delta u, v).\)

    ```


    Here \(\nabla\) denotes the standard gradient operator and \(\nabla u \cdot \nabla
    v\) denotes the standard inner product between vectors in \(\mathbb{R}^n\). The
    choice of using a minus sign in the definition of the Laplacian makes this operator
    positive semidefinite, since


    ```

    (PSD) \((u, \Delta u) = \int_\Omega \nabla u \cdot \nabla u \ge 0.\)

    ```


    If one considers only functions that vanish on the boundary of \(\Omega\), (Psd)
    implies that the only functions that lie in the kernel of the Laplacian (\(\Delta
    u = 0\)) are those functions that vanish on the entire domain. Moreover, properties
    (Sym) and (Psd) imply that the Laplacian can be diagonalized and its eigenvalues
    are nonnegative,


    ```

    \(\Delta u = \lambda u \Rightarrow \lambda \ge 0.\)

