  md: 'Various polytopal element methods have recently appeared in the literature
    on numerical methods for partial differential equations that can accommodate polygonal
    and polyhedral meshes without the use of generalized barycentric coordinates.
    These include mimetic methods, virtual elements (see Chapter 15), weak Galerkin
    methods, gradient schemes, and many more that are beyond the scope of discussion
    in this chapter. All these approaches still require assumptions on shape quality
    of the mesh elements in order to carry out their desired error analyses. The typical
    assumption is that each mesh element is “star-shaped with respect to a ball,”
    that is, there exists a $d$-ball $B_\rho \subset P$ of radius $r(B_\rho)$ such
    that the convex hull of $\{x\} \cup B$ is a subset of $P$ [70]. Then, on a sequence
    of meshes, it is assumed that diam$(P)/r(B_\rho)$ is bounded above uniformly.
    Since $r(B_\rho) \le r(P)$, this assumption is stronger than a bound on the aspect
    ratio as in $\mathbf{p}_{\text{ar}}$. Since many of those methods are, in effect,
    using harmonic coordinates for their error analysis, it seems likely that their
    assumptions could be weakened accordingly.


    Shape regularity conditions for polygonal and polyhedral meshes have also been
    considered recently by Mu, Wang, and Wang in the context of discontinuous Galerkin
    methods [288]. They provide four shape regularity conditions, denoted A1–A4, which
    bear many similarities to the metrics presented here. Condition A1 ensures that
    mesh elements have a good quality decomposition into simplices, which is related
    to our findings for harmonic coordinates; this is discussed further in Section
    2.5 and [163]. Condition A2 requires the existence of one “large” edge per element,
    but this is later recast as condition A2”, which is exactly the same as a bound
    on the aspect ratio. Condition A3 allows a more general interpretation of how
    two polygons or polyhedra may meet in a mesh and A4 ensures that the ratio of
    diameters of adjacent mesh elements is bounded above; that is, the mesh is “graded”
    reasonably well.


