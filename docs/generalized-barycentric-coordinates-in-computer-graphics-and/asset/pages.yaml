- pgno: 194
  md: 'THE STUDY of masonry structures has fascinated architects, geometers, and engineers
    since antiquity. Artifacts like the Pantheon in Rome and Gothic cathedrals, which
    have stood for centuries without the benefit of modern mechanical engineering
    and materials science research, stand testament to the power and elegance of masonry
    construction techniques. This chapter sketches how the mechanics of masonry structures,
    and smooth and discrete geometry, are inseparably entwined, beginning with a historical
    overview of how stable structures were designed, covering some fundamental theory,
    and then surveying recent works in computer graphics on computational design and
    analysis of masonry structures. Weight functions defining generalized barycentric
    coordinates appear as a key component of this analysis, where they represent the
    force flowing through the structure.


    # 10.1 INTRODUCTION AND HISTORICAL OVERVIEW


    To study whether an arch or dome stands or falls is to study geometry. This is
    the key insight underlying *equilibrium analysis* or limit analysis, whose principles
    have been exploited for centuries by architects seeking to understand the mechanics
    of masonry structures.


    # 10.1.1 What is a masonry structure?


    Masonry structures are man-made structures composed of unreinforced concrete,
    brick, or stone, such as cathedrals, domes, and vaults. In particular, we consider
    *freeform masonry structures*, which though assembled of volumetric blocks, have
    a thin dimension (so that they resemble a surface). Figure 10.1 (left) shows an
    example of freeform masonry.


    ![](img/4913dd83a2a14bc205a0a92cce102c82_194_0.png)


    Figure 10.1. Left: A freeform masonry structure, composed of rigid, unreinforced
    blocks. (Image courtesy of Mathias Höbinger, used by permission.) Middle: The
    thrust network that certifies that this masonry structure is *stable* under its
    own weight. Each edge radius is proportional to the magnitude of compressive force
    carried by the edge. Right: An arch in 2D, with the self-load, and the thrust
    line certifying its stability, both illustrated. See color insert.'
