    # 12.5.1 Gradient correction for scalar problems


    Given an element \(P\), the basic idea of the gradient correction scheme is to
    correct the gradient of functions in the local space \(\mathcal{V}_k(P)\) with
    minimal perturbations that result in the satisfaction of a discrete divergence
    theorem. For scalar problems, the *corrected* gradient of \(v \in \mathcal{V}_k(P)\),
    henceforth denoted by \(\nabla_{P,k}v\), is taken to be a vector field over \(P\)
    that solves the optimization problem


    ```

    \(\min_{\xi} \oint_P \|\xi - \nabla v\|^2 dx,\)

