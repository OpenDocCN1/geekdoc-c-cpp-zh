  md: 'map $\xi^*: \mathbb{R}^2 \to \mathbb{R}^2$ as the function mapping every point
    on $z$ to the point$^\dagger$ on $s$ with identical tangent plane,


    [\nabla z](x, y) = [\nabla s](\xi^*(x, y)).


    From this relative Gauss map we can define a relative shape operator $d\xi^*(x,
    y) = [\mathbf{H}_z(x, y)][\mathbf{H}_s(\xi^*(x, y))]^{-1}$, and mean and Gaussian
    curvatures of $z$ relative to $s$ by $\frac{1}{2} \text{tr}(d\xi^*)$ and $\det(d\xi^*)$.


    The isotropic dual polar dual $z^*$ of a surface $z(x, y)$ is formed by mapping


    $[x, y, z(x, y)] \mapsto [z_x(x, y), z_y(x, y), -z + xz_x(x, y) + yz_y(x, y)];
    \quad (10.5)$


    notice that (a) this mapping is an involution when $z$ is strictly convex; (b)
    it maps planes to points; and (c) it maps points with parallel tangent plane to
    points that are vertically offset, that is, are coincident when projected onto
    the $xy$-plane [310]. See Figure 10.5 for an example of a surface and its dual.
    The Gauss map, expressed on the dual surfaces $z^*$ and $s^*$, is thus simply
    the identity: it maps points on $z^*$ to points on $s^*$ with identical $(x, y)$
    coordinates. Dual relative curvatures thus have the particularly simple formulas


    $K_z^{z^*} = \frac{\det(\mathbf{H}_z)}{\det(\mathbf{H}_s)},$


    $H_z^{z^*} = \frac{1}{2} \text{tr}([\mathbf{H}_z]^{-1}[\mathbf{H}_s]).$


    Of special note is the Maxwell hyperboloid $h(x, y) = \frac{1}{2}(x^2 + y^2)$,
    whose dual is simply a reflection about the $xy$-plane, and for which $K_h^{z^*}
    = \det(\mathbf{H}_z)$; curvatures relative to $h$ arise naturally in isotropic
    geometry, where the hyperboloid plays the role of the canonical unit sphere [310].


    # 10.2.4 Curvature interpretation of equilibrium


    As suggested by the above notation, the Airy stress function $s(x, y)$ of a surface
    in equilibrium can be interpreted as a height field defining a convex surface.
    This yields a *geometric* characterization of equilibrium in terms of the dual
    relative curvatures of the surface $z$ and its Airy stress potential $s$; to see
    this, note that $J^T[\mathbf{H}_s]J = \det(\mathbf{H}_s)[\mathbf{H}_z]^{-1}$;
    therefore


    $H_z^{z^*} = \frac{1}{2\det(\mathbf{H}_s)} \text{tr}(J^T[\mathbf{H}_s]J[\mathbf{H}_z])
    = \frac{1}{2\det(\mathbf{H}_s)} \nabla \cdot J^T[\mathbf{H}_s]J\nabla z$


    and the surface $M$ is in equilibrium if and only if there exists a convex surface
    $s(x, y)$, defined on the same top view $\tilde{M}$ as $z$, with


    $2K_s^{y^*} H_z^{z^*} = F \sqrt{\det g} \quad (10.6)$


    at every interior point of $\bar{M}$, and $[\mathbf{H}_s]J\mathbf{n} = 0$ on the
    free boundary [405].'
