    # 4.1.2 Arbitrary polygons


    For any choice of barycentric coordinates, it is possible to construct a source
    and a target polygon such that the barycentric mapping is not bijective [208].
    In order to construct such a counterexample, let us consider the barycentric mapping
    between a square and a deformed square, as shown in Figure 4.3.


    Because we only move \(v_i^0\), we know that \(v_i^1 - v_i^0 = 0\) for \(i = 1,
    2, 4\), and we can rewrite the mapping \(f\), evaluated at the origin, as,


    \(f(\mathbf{0}) = \sum_{i=1}^4 \phi_i(\mathbf{0})(v_i^1 - v_i^0 + v_i^0) = \sum_{i=1}^4
    \phi_i(\mathbf{0})(v_i^1 - v_i^0) = \phi_3(\mathbf{0})(v_3^1 - v_3^0) = \phi_3(\mathbf{0})(v_3^1
    + v_1^0),\)


    where we exploit the fact that \(v_3^0 = -v_1^0\) in the last step.


    We first assume that \(\phi_3(\mathbf{0}) > 0.5\) and show that there exists a
    choice of \(v_3^1\) such that \(f(\mathbf{0}) = v_1^1\), which contradicts the
    bijectivity of the mapping. To this end,


    ![](img/4913dd83a2a14bc205a0a92cce102c82_85_1.png)


    Figure 4.3 Source and target polygon for the construction of a non-bijective barycentric
    mapping.'
