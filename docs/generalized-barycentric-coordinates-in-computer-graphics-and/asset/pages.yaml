    a drum?* [220], that is, whether the entire geometry can be inferred from the
    spectrum alone, has a negative answer: There exist isospectral but non-isometric
    manifolds [169, 383].


    # 5.3 DISCRETE LAPLACIANS


    Discrete Laplacians can be defined on simplicial manifolds or, more generally,
    on graphs. We treat the case of graphs first and discuss simplicial manifolds
    further below.


    # 5.3.1 Laplacians on graphs


    Consider an undirected graph \(\Gamma = (V, E)\) with vertex set \(V\) and edge
    set \(E\). For simplicity, we only consider finite graphs here. Suppose that every
    edge \(e \in E\) between vertices \(i \in V\) and \(j \in V\) carries a real-valued
    weight \(\omega_e = \omega_{ij} = \omega_{ji} \in \mathbb{R}\). We discuss below
    how weights can be chosen; suppose for now that such a choice has been made. A
    discrete Laplacian acting on a function \(u: V \to \mathbb{R}\) is defined as


    ```

    \((Lu)_i = \sum_{j \sim i} \omega_{ij}(u_i - u_j), \quad (5.1)\)

    ```


    where the sum ranges over all vertices \(j\) that are connected by an edge with
    vertex \(i\). * This allows for representing the linear operator \(L\) as a matrix
    by


    ```

    \(L_{ij} = \begin{cases} -\omega_{ij}, & \text{if there is an edge between } i
    \text{ and } j, \\ \sum_{k \sim i} \omega_{ik}, & \text{if } i = j, \\ 0, & \text{otherwise.}
    \end{cases}\)

    ```


    The matrix \(L\) is called the discrete Laplace matrix. This definition may seem
    to come a bit out of the blue. In order to see how it relates to smooth Laplacians,
    consider again the smooth case and the quantity


    ```

    \(E_D[u] = \frac{1}{2} \int_\Omega \|\nabla u\|^2,\)

    ```'
