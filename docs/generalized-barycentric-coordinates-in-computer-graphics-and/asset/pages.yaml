  md: '# 14.1 INTRODUCTION


    In this chapter, we study a continuous-Galerkin finite element formulation on
    polygonal and polyhedral meshes, which is applied to boundary-value problems.
    The approach was proposed in [107] and established in a sequence of papers [195,
    196, 329, 330, 420, 421, 423]. First, the general situation is described in the
    introduction, and afterwards the Poisson problem is considered as a simple model
    problem to explain the approach.


    Let \(\Omega \subset \mathbb{R}^d, d=2,3\) be a bounded polygonal or polyhedral
    domain with Lipschitz boundary \(\partial \Omega = \Gamma_D \cup \Gamma_N\), which
    is split into a Dirichlet and a Neumann part that are denoted by \(\Gamma_D\)
    and \(\Gamma_N\), respectively. We seek to find the function \(u : \Omega \to
    \mathbb{R}\) that solves the following second-order convection-diffusion-reaction
    boundary-value problem:


    \(Lu = -\text{div}(A\nabla u) + b \cdot \nabla u + cu = f \quad \text{in } \Omega,\)

    \(u = g_D \quad \text{on } \Gamma_D,\)

    \(\frac{\partial u}{\partial n} = g_N \quad \text{on } \Gamma_N,\)


    where \(n\) denotes the outward unit normal vector to \(\Omega\). \(A \in \mathbb{R}^{d
    \times d}, b \in \mathbb{R}^d, c \in \mathbb{R}\) are some coefficients, \(f\)
    is a source term, and \(g_D, g_N\) are boundary data. We assume that the operator
    \(L\) is elliptic and the boundary-value problem has a unique solution. This is
    guaranteed by the usual assumptions on the coefficients and the data.


    To obtain an approximation of the unknown solution \(u\), the domain \(\Omega\)
    is discretized by non-overlapping polygonal or polyhedral elements and a finite
    element formulation is applied. The idea of the BEM-based FEM is to use a Trefftz-like
    approximation space. Its basis functions are defined to fulfill certain local
    boundary-value problems related to the differential operator \(L\) on each element
    \(P\). In these local problems, the coefficients of \(L\) are chosen to be constant.
    The global continuity of the basis functions is ensured by prescribing the boundary
    data on \(\partial P\). Due to the special choice of basis functions, it is possible
    to restate the finite element formulation such that only integrals over \(\partial
    P\) appear in the finite element matrix and we do not have to evaluate the basis
    functions explicitly in the interior of \(P\). However, this procedure involves
    boundary integral operators, which are treated by means of the BEM in the realization.


    All these steps are treated more precisely in the following sections. To simplify
    the presentation, we restrict ourselves to \(L = -\Delta\) and zero Dirichlet
    data on \(\Gamma_D\) with \(|\Gamma_D| > 0\). Thus, we consider the problem


    \(-\Delta u = f \quad \text{in } \Omega, \quad u = 0 \quad \text{on } \Gamma_D,
    \quad \frac{\partial u}{\partial n} = g_N \quad \text{on } \Gamma_N. \quad (14.1)\)


    The well-known variational formulation reads: find \(u \in V\) such that


    \(b(u, v) = (f, v)_{L_2(\Omega)} + (g_N, v)_{L_2(\Gamma_N)} \quad \forall v \in
    V, \quad (14.2)\)


    where


    \(b(u, v) = \int_\Omega \nabla u \cdot \nabla v \, dx \quad \text{and} \quad V
    = \{v \in H^1(\Omega) : v = 0 \text{ on } \Gamma_D\}.\)'
