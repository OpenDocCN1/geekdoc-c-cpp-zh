    # 11.1 INTRODUCTION


    The analysis of stress and strain in a mechanical part or structure is critically
    important to the overall engineering design and development process. The finite
    element method has revolutionized analysis in solid mechanics by enabling the
    computer analysis of geometrically complex, nonlinear structures subjected to
    general loading conditions. Additionally, the finite element method can incorporate
    general material constitutive models, interface models, and constraints, making
    it an extremely versatile engineering analysis tool [41]. The main requirement
    of the finite element method is that an approximate partition, or mesh, of the
    domain be created first, as shown in Figure 11.1. This partition of the domain
    typically consists of standard finite element shapes, such as the hexahedron and
    tetrahedron, as shown in Figures 11.2(a) and 11.2(b), respectively. Once the finite
    element mesh is created, analyzing the response of the structure to applied loads
    can be obtained using standard computational techniques, starting with the weak
    form of the governing field equations of solid mechanics [41]. Figure 11.3 shows
    the stress field (von Mises) resulting from the application of torsional tractions
    to the I-beam shown in Figure 11.1. This type of structural analysis is now an
    indispensable tool in engineering practice.'
