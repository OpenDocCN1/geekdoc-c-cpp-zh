    and polyhedral finite elements using the gradient correction scheme. In particular,
    we consider a boundary-value problem as shown in Figure 12.6(a), where a rectangular
    block of dimensions \(1 \times 1 \times \pi\) is bent into a semi-circular shape.
    The corresponding analytical displacement solution \(\mathbf{u}\) is given by


    ```

    $$u_x = -1 + (1+x)\cos(z) - x, \quad u_y = 0, \quad u_z = (1+x)\sin(z) - z,$$

    ```'
