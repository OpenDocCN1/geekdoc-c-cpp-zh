    # 10.4.6 Block layouts from stable surfaces


    Once a thrust network in equilibrium has been found, a masonry structure can be
    constructed around it that is guaranteed to be stable by the safe theorem, as
    discussed in Section 10.3.2. However, a practical issue remains: blocks arranged
    directly by dualing the thrust network tend to lie in long “chains” or “strips”
    that easily come apart under weathering or horizontal load. Panozzo et al. [301]
    developed a post-processing algorithm that remeshes the thrust network into blocks
    that are rectangular and staggered, much as is seen in a regular brick wall. The
    algorithm first remeshes the surface into a quadrilateral mesh. If the quad mesh
    has no singularities, one can find a staggered block pattern by simply deleting
    every other “vertical” edge. Generally speaking, a nontrivial freeform surface
    has complex geometry with several singularities present after remeshing, so edges
    are instead removed by solving a 2-coloring problem, which guarantees that blocks
    are staggered and are composed of at most two quads (see Figure 10.8, right).


    # 10.5 CONCLUSION AND OPEN PROBLEMS


    Although computational analysis and form-finding of stable freeform masonry structures
    is by now a thoroughly studied topic, there remain several open questions that
    have not been addressed by any previous work. Answering them will require significantly
    expanding our understanding of the mathematics of stable masonry, and its connections
    to discrete and smooth geometry.'
