    # 11.5.2 Random Voronoi meshes


    Voronoi tessellations, or tilings, have a rich history in mathematics and science
    and have a number of interesting properties [295]. Given a finite set of points
    \(x_i\) (sites), the Voronoi tessellation is defined as the collection of regions,
    or cells, \(V_i\) where


    ```

    \(V_i = \bigcap_{i \neq j} \{x \in \Omega \mid d(x_i, x) < d(x_j, x)\}.\) (11.8)

    ```


    Here, \(\Omega\) represents the given domain, and the function \(d(x, y)\) is
    the Euclidean metric (distance) between the two points \(x\) and \(y\). Each spatial
    point belonging to the Voronoi cell \(V_i\) is closer to site \(i\) than all other
    sites \(j \neq i\). Each Voronoi cell is the intersection of a collection of half-spaces,
    and therefore forms a convex polyhedron. An example of a two-dimensional Voronoi
    cell is shown in Figure 11.13(b). An example of a three-dimensional Voronoi tessellation
    is shown in Figure 11.13(c).


    While the Voronoi tessellation can be formed from any finite set of points, a
    special structure arises from the close packing of equi-sized hard spheres [431].
    A classic experiment of dropping hard spheres into a relatively large container
    produces a structure known as random close packed (RCP). The face-centered cubic
    (FCC) structure possesses an optimal packing factor of 0.740, whereas the RCP
    structure exhibits a maximum packing factor of 0.637. An example of a two-dimensional
    random close-packing is shown in Figure 11.13(a). The statistical geometry aspects
    of RCP structures and their associated Voronoi diagrams have been studied'
