    The concept of natural neighbors (see Section 1.2.12) is also used for the definition
    of so-called *Laplace coordinates* [34, 103, 370], which are given by the weight
    functions


    ```

    $$w_i = \begin{cases} \frac{s_i}{r_i}, & \text{if } i \in I_x, \\ 0, & \text{otherwise,}
    \end{cases} \quad i = 1, \dots, n,$$

    ```


    where $s_i$ is the length of the edge of $C_x$ that is contained in $C_i$, $r_i
