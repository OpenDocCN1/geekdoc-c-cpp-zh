  md: 'the degrees of freedom of the space. Using this basis, any function \( v \in
    V_P^1 \) can be represented as:


    ```

    \( v(\boldsymbol{x}) = \sum_{i=1}^n v(\boldsymbol{v}_i) \phi_i(\boldsymbol{x})
    \quad \forall \boldsymbol{x} \in P. \quad (15.1) \)

    ```


    In particular, using (15.1) with \( v=1,x,y \) we obtain the decompositions:


    ```

    \( \sum_{i=1}^n \phi_i = 1, \quad \sum_{i=1}^n x_i \phi_i = x, \quad \sum_{i=1}^n
    y_i \phi_i = y, \quad (15.2) \)

    ```


    where \( x_i \) and \( y_i \) are the \( x \) and \( y \) coordinates of the vertex
    \( \boldsymbol{v}_i \), respectively. The first identity in (15.2) is the *partition
    of unity* property of barycentric coordinates, and together with the other identities
    expresses the *linear completeness* of \( V_P^1 \).


    The global functional space is constructed from the local spaces as


    ```

    \( V_h^k = \left\{ v \in H^1(\Omega) \cap C^0(\overline{\Omega}) : v_{|P} \in
    V_P^1 \right\}, \)

    ```


    and as global degrees of freedom we can take the values of the functions at the
    vertices of the mesh, thus ensuring the continuity property of the ambient space.


    While (in this case) the virtual element and harmonic GBC discrete spaces are
    identical, the crucial difference between the method lies in how these functions
    are used. In particular, the virtual element method is designed in such a way
    that the local PDE problems, which define the space, *never have to be solved*
    because the method does not require evaluating the basis functions (cf. Section
    15.3).


    # 15.2.3 Generalization to arbitrary order discrete spaces


    The virtual element technology provides a generalization of the local harmonic
    GBC spaces to include the space of polynomials of arbitrary degree \( k \). Extensions
    to arbitrary global regularity that is more than just \( C^0(\Omega) \) are also
    possible [33]. These extra polynomials can be used to improve the accuracy and
    convergence rate of the method, just like within the standard finite element method.


    The general order local discrete space \( V_P^k \) is constructed on the element
    \( P \) for any integer \( k \ge 1 \) as solutions of local Poisson problems with
    a polynomial right-hand side and continuous piecewise Dirichlet boundary data,
    such that


    ```

    \( V_P^k := \left\{ v_h \in H^1(P) : \begin{array}{l} \Delta v_h \in \mathbb{P}_{k-2}(P),
    \\ v_{|e} \in \mathbb{P}_k(e) \text{ for each edge } e \text{ of } P, \\ v_{h|\partial
    P} \in C^0(\partial P) \end{array} \right\}, \quad (15.3) \)

    ```


