    We finally report on a method that uses LME approximants to represent domains
    with complex geometry and smooth boundaries. As described up to now, the natural
    domain where the LME approximants are defined is the convex hull of P. For subsets
    of P, the approximants do not satisfy the weak delta-Kronecker on the boundary.
    However, there is an increasing awareness of the importance of geometric fidelity
    in engineering calculations [205]. In fact, it is quite natural to blend maximum-entropy
    approximations with any other convex approximation scheme, such as such as approximation
    methods used in computer graphics. It is sufficient to consider an optimization
    program such as that in (13.7), in which some of the barycentric coordinates are
    taken as data (the known convex scheme) and the rest are the unknowns of the problem
    [334]. For instance, in Figure 13.4(c) one layer of tensor product B-spline basis
    functions extruded from a B-spline boundary representation was blended with LME
    functions.


    # 13.5 APPLICATIONS


    The LME approximants and their extensions have been adopted as trial and test
    functions in Galerkin methods to solve various PDEs, including linear and nonlinear
    elasticity [15, 334, 335, 336], incompressible solids [296], and fluid flow problems
    [243, 292, 306]. In these problems, which often exhibit smooth solutions, LME
    approximations provide highly accurate numerical approximations with relatively
    coarse sets of points, as compared to standard C^0 finite elements. Furthermore,
    the meshfree basis functions can accommodate very large grid distortions in Lagrangian
    large deformation simulations [243, 306]. However, some applications truly benefit
    from the smoothness of the LME approximants for general unstructured sets of points.
    We next outline two examples: the numerical approximation of high-order PDEs and
    the approximation of manifolds defined by scattered sets of points.


    # 13.5.1 High-order partial differential equations


    Many physical phenomena of interest in science and engineering are modeled using
    higher-order PDEs. For instance, the Kirchhoff-Love equations of thin shells are
    fourth-order PDEs. Similarly, many problems involving evolving discontinuities
    can be modeled using phase-field models, where the discontinuity is smeared out
    and tracked by a field governed by a PDE. In many cases, such a PDE is of fourth
    order, including models for crack propagation [64], crystal growth [396], or the
    mechanics of fluid membranes [128]. The numerical treatment of such problems with
    C^0 finite elements is cumbersome and involves independently interpolating the
    field and its gradient [129]. In contrast, a Galerkin approach is straightforward
    if smooth basis functions are used. LMEs are not only smooth, but also easily
    amenable to adaptive methods and have monotonicity properties that help them accurately
    describe the sharp variations characteristic of phase-field solutions. See Figure
    13.5 for an illustration of LME approximants applied to a phase-field model'
