    every point \(z \in \Omega\). Complex differentiability is a strong condition
    implying that \(f\) is infinitely differentiable. Furthermore, holomorphic functions
    are integrable (on a simply connected domain) an infinite number of times, and
    these derivatives and anti-derivatives are all holomorphic as well. Holomorphic
    functions form a linear space, hence sums of holomorphic functions and multiplications
    of a holomorphic function with a complex scalar are'
