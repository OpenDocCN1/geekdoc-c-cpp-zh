  md: '![](img/4913dd83a2a14bc205a0a92cce102c82_132_0.png)


    Figure 7.1 Notation used for complex barycentric maps. Left: the source polygon
    $P$. Note that $B_i(z) = z_i - z$ are functions of $z$, while the edge vectors
    $e_i = z_{i+1} - z_i$ are independent of $z$. Right: the target polygon $\hat{P}$
    as well as the image of a complex holomorphic barycentric map $f : \Omega \to
    \mathbb{C}$. Note that $f(z)$ does not interpolate the target polygon.


    A complex barycentric map is a planar map expressed as a complex-valued function
    $f : \Omega \to \mathbb{C}$ with


    ```

    $f(z) = \sum_{i=1}^n \phi_i(z)f_i,$

    ```


    where $f_i \in \mathbb{C}$ are some complex coefficients. Similarly to the real
    case, Property (7.1) is called the _constant precision_ property (or sometimes
    denoted as the partition of unity property). It requires that the real parts of
    the coordinates sum to 1, and in addition, that their imaginary parts sum to 0.
    Algebraically, it implies that if $g$ is a _complex_ constant function over $\Omega$,
    and $f_i = g(z_i)$, then $f(z) = g(z)$. In other words, $f$ reproduces complex
    constant functions from their vertex values. Geometrically, (7.1) means that the
    barycentric map is invariant to translations applied to the cage vertices. Property
    (7.2) is called the _linear precision_ property. Algebraically, it implies that
    $f$ reproduces _complex_ linear functions over $\Omega$ from their vertex values.
    In particular, it reproduces the (linear) identity function $g(z) = z$, and hence
    it is sometimes referred to as the identity reproduction property. Together, Properties
    (7.1) and (7.2) imply that $f$ reproduces complex affine functions, that is, functions
    $\psi : \mathbb{C} \to \mathbb{C}$ of the form $\psi(z) = \alpha z + \beta$, where
    $\alpha, \beta \in \mathbb{C}$ are complex constants. However, it is important
    to note that unlike real barycentric maps, complex barycentric maps do not, in
    general, reproduce planar affine maps, that is, maps $g : \mathbb{R}^2 \to \mathbb{R}^2$
    of the form $g(\mathbf{x}) = \mathbf{Ax} + \mathbf{b}$, where $\mathbf{A}$ is
    a $2 \times 2$ real matrix and $\mathbf{x}, \mathbf{b} \in \mathbb{R}^2$ are real
    vectors (see Figure 7.2). While this may be initially perceived as a limitation,
    for the particular application of planar shape deformation, it is mostly an advantage.
    The matrix $\mathbf{A}$ encodes rotation, isotropic scale, and shear, whereas
    in the complex case, the multiplication $\alpha z$ is equivalent to a multiplication
    of $\mathbf{x}$ by a similarity matrix $\begin{pmatrix} \alpha_x & -\alpha_y \\
    \alpha_y & \alpha_x \end{pmatrix}$, where $\alpha = \alpha_x + i\alpha_y$. In
    other words, complex barycentric maps reproduce similarity transformations (translation,
    rotation, and isotropic scale) but do not reproduce, in general, anisotropic scale
    and shears, which lead to distortion of angles.'
