  md: '# # Mesh Parameterization


    **Bruno Lévy**


    Inria Nancy Grand Est, Villers-lès-Nancy, France


    # ## CONTENTS


    +   6.1 Introduction .................................................... 97

    +   6.2 Applications of mesh parameterization ....................... 98

    +   6.3 Notions of topology ........................................... 100

    +   6.4 Tutte''s barycentric mapping theorem ......................... 102

    +   6.5 Solving the linear systems .................................. 106

    +   6.6 Choosing the weights ........................................ 108


    THIS CHAPTER introduces mesh parameterization, an application of generalized barycentric
    coordinates. By “unfolding” a surface onto a 2D space, mesh parameterization has
    many possible applications, such as texture mapping. In this chapter we present
    some basic notions of topology that characterize the class of surfaces that admit
    a parameterization. Then we focus on the specific case of a topological disk with
    its boundary mapped to a convex polygon. In this setting, Tutte’s barycentric
    mapping theorem not only gives sufficient conditions, but also a practical algorithm
    to compute a parameterization. We outline the main argument of the simple and
    elegant proof of Tutte’s theorem by Gortler, Gotsman, and Thurston [172]. It is
    remarkable that their proof solely uses basic topological notions together with
    a counting argument. Finally, we mention the importance of the weights in the
    quality of the result, and demonstrate how mean value coordinates can be used
    to reduce the distortions.


    # ### 6.1 INTRODUCTION


    Before diving into the formal definition, we first give an intuitive explanation
    of what a mesh parameterization is. Intuitively, given a triangulated mesh (see
    Figure 6.1, left), a parameterization “unfolds” the mesh in 2D (see Figure 6.1,
    right). Such an “unfolding” is an interesting representation that can be considered
    as a “map” of the 3D object, and that can be exploited by several applications.'
