  md: '4. Given external loads, the Poisson equation (10.7) is solved to determine
    the heights \( z \) of the network vertices.


    The user can explore the space of possible forms by interactively changing the
    top view, reciprocal diagram, and / or applied external loads.


    # 10.3.2 Thrust networks as block networks


    The safe theorem certifies that if a block network contains a thrust network in
    equilibrium within its volume, then the block network is itself stable. This relationship
    can be reversed: once a thrust network in equilibrium has been constructed, a
    masonry structure can be designed enclosing the thrust network, which is stable
    by the safe theorem. There are two subtleties with this approach in practice:
    first, the loads on the structure must be the same as those that were imposed
    on the thrust network (although scaling all of the loads by a constant factor
    is allowed, since the equilibrium equations (10.1) are scale-invariant, a fact
    exploited since ancient times to analyze full-sized masonry structures using scale
    models). Second, masonry blocks have only finite coefficients of friction and
    resistance to sliding, so the orientation of the block interfaces cannot be entirely
    neglected.


    Nevertheless, every thrust network \( G \) in equilibrium corresponds to some
    set of blocks in frictionless equilibrium [356]. First, compute an *intrinsic*
    Voronoi diagram on \( G \) (so that the cell corresponding to vertex \( \mathbf{v}_i
    \) is piecewise-affine and contains pieces of all faces adjacent to \( \mathbf{v}_i
    \)). Each cell can be “fattened” by normal extrusion to give a network of blocks
    that completely enclose the thrust network, with block interfaces perpendicular
    to the dual edges of the thrust network. Each block can now be modified (by adding
    or removing material, while keeping it in contact with all of its neighbors) so
    that its total mass equals the load \( F_i \) imposed on the thrust network, and
    so that its centroid is at \( \mathbf{v}_i \).


    The thrust network and external loads can then be interpreted as a network of
    contact and external forces, respectively, acting on each block’s centroid; equilibrium
    of the thrust network guarantees balance of forces and moments for each block,
    and thus that the block network is stable [425].


    # 10.3.3 Discrete Airy stress potential


    In the smooth setting, we were able to characterize equilibrium in terms of a
    scalar Airy stress potential over the top view; so far, in the discrete setting,
    we have edge weights, or equivalently reciprocal diagrams, or equivalently perfect
    Laplace–Beltrami operators. We now discretize the Airy stress potential [405],
    and show how it ties to the other characterizations described above.


    Given a top view \( G \), we call a polygonal 2-complex \( S \) in \( \mathbb{R}^3
    \) a *discrete Airy stress surface* with respect to \( G \) if:


    +   • the top view \( \bar{S} \) of \( S \) (formed by projecting all vertices
    of \( S \) into the plane) is identical to \( \bar{G} \);


    +   • the faces of \( S \) are planar;'
