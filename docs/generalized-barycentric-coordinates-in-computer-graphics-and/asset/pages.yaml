    # 8.2.2 Evaluation


    Similar to Bézier curves, one possible method for evaluating an S-patch is simply
    to multiply the control points by the corresponding basis functions from (8.4)
    evaluated at the point in question. However, there also exists a de Casteljau-like
    algorithm that utilizes the hierarchical relationship between the control points.
    Given an evaluation point \(\boldsymbol{x}\), we compute the value of the barycentric
    basis functions \(\phi_i(\boldsymbol{x})\) at the evaluation point using the polytope
    \(P\). Now, we proceed in a recursive fashion. Let \(f_j\) be the control points
    at level \(k - 1\) where \(|j| = k - 1\) and let \(f_\ell\) with \(|\ell| = m\)
    be the initial control points. Then, we compute the \(f_j\) for all \(|j| = k
    - 1\)


    ```

    f_j = \sum_{i=1}^n \phi_i(\boldsymbol{x}) f_j + f_j^n

    ```'
