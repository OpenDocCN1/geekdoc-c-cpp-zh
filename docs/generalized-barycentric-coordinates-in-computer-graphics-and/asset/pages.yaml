- pgno: 310
  md: '(H2) the diffusion tensor \( K : \Omega \to \mathbb{R}^{d \times d} \) is a
    \( d \times d \) bounded, measurable, and symmetric tensor. Moreover, we assume
    that \( K \) is strongly elliptic, i.e., there exist two positive constants \(
    C_* \) and \( C^* \) such that, for almost every \( \boldsymbol{x} \in \Omega
    \),


    \( C_* \|\boldsymbol{\xi}\|^2 \leqslant \boldsymbol{K}(\boldsymbol{x})\boldsymbol{\xi}
    \leqslant C^* \|\boldsymbol{\xi}\|^2 \quad \forall \boldsymbol{\xi} \in \mathbb{R}^d,\)


    where \( \|\boldsymbol{\xi}\|^2 = \boldsymbol{\xi} \cdot \boldsymbol{\xi} \) is
    the square of the Euclidean 2-norm of \( \boldsymbol{\xi} \);


    (H3) the two functions \( f \) and \( g \) belong to \( L^2(\Omega) \) and \(
    H^{\frac{1}{2}}(\partial\Omega) \), respectively.


    The variational form of the problem (15.14)-(15.15) reads:


    find \( u \in H_g^1(\Omega) \) such that


    \( \mathcal{A}(u, v) := \int_\Omega K \nabla u \cdot \nabla v \, dV = \int_\Omega
    f v \, dV \quad \forall v \in H_0^1(\Omega), \quad (15.16) \)


    where


    \( H_g^1(\Omega) := \{ u \in H^1(\Omega) \mid u|_{\partial\Omega} = g \}.\)


    The existence of a unique weak solution to (15.16) follows from the continuity
    and coercivity of the bilinear form \( \mathcal{A}(\cdot, \cdot) \) under Assumptions
    (H1)-(H3).


    # 15.3.2 Overview of the conforming VEM


    In the conforming virtual element method we approximate the symmetric, bilinear
    form \( \mathcal{A}(\cdot, \cdot) \) with the symmetric bilinear form \( \mathcal{A}_h(\cdot,
    \cdot) \) that can be *exactly* computed without having to evaluate the functions
    of the virtual space. Moreover, \( \mathcal{A}_h(\cdot, \cdot) \) should exactly
    evaluate \( \mathcal{A}(\cdot, \cdot) \) when at least one of its entries is a
    polynomial of degree \( k \geqslant 1 \). This property is called *polynomial
    consistency* and can be stated as:


    \( \mathcal{A}_h(v, p) = \mathcal{A}(v, p),\)


    which holds for any \( v \in V_h \) and piecewise \( k \)-degree polynomial function
    \( p \) defined on \( \Omega_h \). The polynomial consistency property determines
    the accuracy of the method. Beyond this, we merely require \( \mathcal{A}_h(\cdot,
    \cdot) \) to be *stable* with respect to \( \mathcal{A}(\cdot, \cdot) \) when
    the trial and test functions are non-polynomial. The right-hand side of (15.16)
    is also discretized through a similar process. Finally, the Dirichlet boundary
    conditions of the original problem are imposed in the virtual element formulation
    by defining \( V_{h,g}^k \) as the affine subspace of \( V_h^k \) whose functions
    interpolate the boundary condition \( g \) on \( \partial\Omega \). In a practical
    implementation, the boundary conditions on the virtual functions of \( V_h^k \)
    are imposed by restricting their degrees of freedom associated with the vertices,
    and edges lying on \( \partial\Omega \), to coincide with vertex values and boundary
    moments of \( g \).


    The virtual element approximation to (15.16) reads: find \( u_h \in V_{h,0}^k
    \) such that:


    \( \mathcal{A}_h(u_h, v_h) = (f, v_h)_h \quad \forall v_h \in V_{h,0}^k. \quad
    (15.17) \)'
