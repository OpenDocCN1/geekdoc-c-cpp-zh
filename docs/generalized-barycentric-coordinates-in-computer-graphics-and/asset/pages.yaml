- pgno: 27
  md: 'for \( i \in \{1, \dots, n\} \) and \( k \in \mathbb{Z} \). Note that all the
    coordinates in this section, except for Hermite and complex, are generalized barycentric
    coordinates in the sense of Definition 1.1.


    The earliest generalizations of barycentric coordinates in 2D were closed-form
    constructions and restricted to convex polygons. In this setting, the key objective
    is finding smooth and positive weights \( w_i \), which satisfy (1.11). It is
    then known [149] that the normalized weights \( \phi_i \) in (1.12) are well-defined
    generalized barycentric coordinates with respect to \( P \) and satisfy all properties
    in (1.10). However, most of these constructions lead to negative weights \( w_i
    \) at certain points inside non-convex polygons. Even worse, the denominator \(
    W \) may vanish, so that the \( \phi_i \) are not necessarily well-defined for
    all \( x \in P \). So far, no closed-form construction of positive weights for
    arbitrary non-convex polygons is known, and even if it exists, the resulting coordinates
    would not be more than \( C^\alpha \) at concave corners [10]. We discuss different
    closed-form coordinates in Sections 1.2.1–1.2.7.


    It was later realized that \( \phi_i \) can also be obtained numerically as the
    solution of an optimization problem subject to the constraints given by the required
    properties of the coordinates. This optimization problem can either be global
    or local, and we present different kinds of such computational coordinates in
    Sections 1.2.8–1.2.10.


    If the points \( v_i \) are not given as vertices of a polygon, but rather as
    scattered points, Definition 1.1 and properties (1.10b) and (1.10d) still make
    sense. In this setting, we can define generalized barycentric coordinates \( \phi_i
    \) with respect to the set \( \Pi = \{v_1, \dots, v_n\} \in \mathbb{R}^2 \) of
    \( n \ge 3 \) scattered points, and we review three different constructions in
    Sections 1.2.11–1.2.13.


    We also give a short overview of coordinates that generalize Definition 1.1 in
    some other way. In particular, we briefly discuss Hermite and complex coordinates
    in Sections 1.2.14 and 1.2.15.


    # ## 1.2.1 Wachspress coordinates


    Wachspress [407] was one of the first who suggested a generalization of barycentric
    coordinates to a polygon with \( n > 3 \) vertices. Later, Meyer et al. [275]
    propose a simple local formulation of these *Wachspress coordinates*, which is
    given by the normalization (1.12) of the weight functions


    \( w_i = \frac{\cot \gamma_{i-1} + \cot \beta_i}{r_i^2}, \quad i = 1, \dots, n,
    \)


    where \( \gamma_{i-1} \) and \( \beta_i \) are the angles shown in Figure 1.2
    and \( r_i = \|v_i - x\| \). These coordinates are rational functions with numerator
    and denominator of degrees at most \( n-2 \) and \( n-3 \), respectively, which
    are the minimal possible degrees [412].


    For strictly convex polygons, it is clear that all \( w_i(x) > 0 \) for any \(
    x \in P \), so that Wachspress coordinates are well-defined and satisfy all properties
    in (1.10). They are also affine invariant. For non-convex polygons, the coordinates
    are not well-defined at some points in the polygon’s interior, because the denominator
    \( W \) vanishes, but they can be generalized to weakly convex polygons [264].'
