    ```

    \(\oint_P p \cdot \xi \, dx = -\oint_P \nabla v \cdot p \, dx + \oint_{\partial
    P} v(p \cdot n) \, ds \quad \forall p \in [\mathcal{P}_{k-1}(P)]^d.\)

    (12.8)

    ```


