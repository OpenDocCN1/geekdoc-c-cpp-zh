    mesh for the next cycle in the loop. For the refinement of an element \(P\), we
    bisect \(P\) through its barycenter \(\bar{\boldsymbol{x}}\) orthogonal to its
    characteristic direction, see Figure 14.3, that is given by the eigenvector that
    corresponds to the largest eigenvalue of the matrix


