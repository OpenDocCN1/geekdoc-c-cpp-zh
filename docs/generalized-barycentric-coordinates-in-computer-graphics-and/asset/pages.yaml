    # 15.2 VIRTUAL ELEMENT SPACES AND GBC


    # 15.2.1 Generalities


    Let $\Omega$ be an open polygonal domain in $\mathbb{R}^2$, partitioned by a finite
    mesh $\Omega_h$ consisting of *simple polygonal elements*. By “simple,” we mean
    that the boundary $\partial P$ of each polygonal mesh element $P$ is not self-intersecting
    and consists of a uniformly bounded number of straight line segments. We further
    assume that the intersection of any two distinct elements of $\Omega_h$ is either
    empty, a collection of mesh vertices, or a collection of mesh edges. In particular,
    neighboring elements are permitted to share multiple (possibly coplanar) edges.
    We denote the set of all edges of the element $P$ by $\mathcal{E}_P$. We also
    introduce the notation $\mathbb{P}_k(P)$ to denote the space of physical-frame
    polynomials of total degree $\le k$ on the element $P$.


    # 15.2.2 Lowest order discrete space


    The lowest order local virtual element function space on the mesh element $P$
    coincides with the space of harmonic generalized barycentric coordinates on $P$,
    and consists of functions satisfying the following properties:


    +   * they are harmonic on $P$,

    +   * they are linear on each edge,

    +   * the space $\mathbb{P}_1(P)$ of linear polynomials on $P$ is included as
    a subspace.


    Specifically, this space is defined such that


    ```

    V_P^1 := \left\{ v_h \in H^1(P) : \Delta v_h = 0 \text{ in } P, \right.

    \left. v|_e \in \mathbb{P}_1(e) \text{ for each edge } e \text{ of } \partial
    P, \right.

    \left. v_h|_{\partial P} \in C^0(\partial P) \right\},

    ```


    and we can define a natural Lagrangian basis for this space as the set of functions
    $\{\phi_j\}_{j=1}^n$, such that $\phi_i(\mathbf{v}_j) = \delta_{ij}$ for each
    vertex $\mathbf{v}_j$ of $P$. This definition ensures that these basis functions
    are linearly independent, and provides us with a natural way to identify $V_P^1$
    with the space $\mathbb{R}^n$ by associating a vector of $n$ numbers with the
    values of a function at the $n$ vertices of $P$. These values will be referred
    to as'
