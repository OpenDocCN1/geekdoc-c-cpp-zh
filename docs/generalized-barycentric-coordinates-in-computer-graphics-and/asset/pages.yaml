  md: 'For \( f \in L_2(\Omega) \) and \( g_N \in L_2(\Gamma_N) \), problem (14.2)
    admits a unique solution according to the Lax-Milgram Lemma, since the bilinear
    form \( b(\cdot, \cdot) \) is bounded and coercive on \( V \). To obtain a discrete
    finite element solution we replace \( V \) in (14.2) by a finite-dimensional conforming
    subspace \( V_h \subset V \) that is spanned by some basis functions, i.e., \(
    V_h = \text{span}\{\boldsymbol{\varphi}_1, \dots, \boldsymbol{\varphi}_m\} \).
    The ansatz \( u_h = \sum_{i=1}^m u_i \boldsymbol{\varphi}_i \) yields the finite
    element system of linear equations


    \(\boldsymbol{K}\boldsymbol{u} = \boldsymbol{f} \quad \text{for} \quad \boldsymbol{u}
    = (u_1, ..., u_m) \in \mathbb{R}^m, \quad (14.3)\)


    where


    \(\boldsymbol{K} = (b(\boldsymbol{\varphi}_j, \boldsymbol{\varphi}_i))_{i,j=1}^m
    \in \mathbb{R}^{m \times m}, \quad \boldsymbol{f} = ((f, \boldsymbol{\varphi}_i)_{L_2(\Omega)}
