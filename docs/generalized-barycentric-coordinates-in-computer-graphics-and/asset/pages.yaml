  md: 'The orthogonality condition (3.8) can be verified by simple integration by
    parts,


    ```

    \(\int_0^{2\pi} \omega(x, \theta)e^{il\theta} d\theta = \int_0^{2\pi} \left( \frac{\partial^2}{\partial
    z^2} p + p \right) e^{il\theta} d\theta = \int_0^{2\pi} p(x, \theta) \left( \frac{\partial^2}{\partial
    \theta^2} e^{il\theta} + e^{il\theta} \right) d\theta = 0.\)

    ```


    Representation (3.9) has an interesting geometric interpretation. Given a curve
    \(\Sigma\) and a point \(x\), the geometry of \(\Sigma\) is determined by its
    support function \(p(x, \theta)\), the signed distance from \(x\) to the tangents
    of \(\Sigma\). The support function satisfies the second-order differential equation


    ```

    \(P''''_\theta + p = R(\theta) \equiv 1/k(\theta),\)

    ```


    where \(k(\theta)\) is the curvature of \(\Sigma\) and \(R(\theta)\) is the radius
    of curvature of \(\Sigma\). See, for example, [345] for details.


    Now we can interpret (3.9) as follows. Each \(x \in \Omega\) defines a closed
    curve \(\Sigma_x\) with radius of curvature \(R = \omega(x, \theta)\). The orthogonality
    condition (3.8) then corresponds to


    ```

    \(\int_0^{2\pi} n R d\theta \equiv \int_{\Sigma_x} n dl = 0,\)

    ```


    where \(n = (\cos \theta, \sin \theta)\) is the outer unit normal of \(\Sigma_x\)
    and \(l\) denotes the arc-length parametrization of \(\Sigma_x\). For example,
    \(\Sigma_x\) is a unit circle for the 2D transfinite mean value coordinates and
    it is a unit sphere in \(\mathbb{R}^3\) for the three-dimensional transfinite
    mean value coordinates.


    If \(\Omega\) is not convex, then a ray emitted from \(x \in \Omega\) may intersect
    \(\partial \Omega\) in multiple points (see Figure 3.1, right). One way to cope
    with this situation is proposed in [200] and consists of using alternating signs
    for intersection points. For instance, the example shown in the right image of
    Figure 3.1 leads to


    ```

