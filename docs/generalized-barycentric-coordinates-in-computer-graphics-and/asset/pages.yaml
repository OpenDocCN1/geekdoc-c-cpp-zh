    only $C^0$ along the boundary of their support. Interestingly, for polygons, whose
    vertices are all lie on a circle, Sibson, Laplace, Wachspress, and discrete harmonic
    coordinates are all identical [375]. A simple computational algorithm for Laplace
    coordinates can be found in [371] and further details in [377].


