    # 1.2.10 Local coordinates


    Zhang et al. [433] propose to minimize the sum of total variations of the coordinate
    functions \(\phi_i\),


    \(\min_{\Phi} \sum_{i=1}^n \int_P \|\nabla \phi_i\|,\)


    subject to the constraints given by (1.8), (1.9), (1.10a), (1.10b), and (1.10e),
    where the total variation of \(\phi_i\) is the \(L_1\)-norm of \(\|\nabla \phi_i\|\)
    in \(P\). The solution of this convex minimization problem gives the so-called
    _local coordinates_, which are at least \(C^0\). The name stems from the fact
    that the numerically computed function values are very close to zero in a large
    part of \(P\). The exact support of these coordinates, however, is not known.


    # 1.2.11 Affine coordinates


    Among all generalized barycentric coordinates with respect to a scattered set
    of points \(\Pi\), Waldron [408] suggests considering those with minimal \(L_2\)-norm,
    which are uniquely defined as the _affine_ functions


    \(\phi_i(\boldsymbol{x}) = (\boldsymbol{x} - \boldsymbol{c}) \cdot ((VV^*)^{-1}(\boldsymbol{v}_i
    - \boldsymbol{c}))^T + \frac{1}{n}, \quad i = 1, \dots, n,\)


    where \(\boldsymbol{c} = \frac{1}{n} \sum_{i=1}^n \boldsymbol{v}_i\) is the barycenter
    of \(\Pi\), \(V = (\boldsymbol{v}_1 - \boldsymbol{c}, \dots, \boldsymbol{v}_n
    - \boldsymbol{c})\) is a \(2 \times n\) matrix, and \(V^*\) is the adjoint of
    \(V\). These coordinates are non-negative inside a convex region that contains
    \(\boldsymbol{c}\), and they are equal to \(\frac{1}{n}\) at \(\boldsymbol{c}\).
    They are smooth and well-defined everywhere in the plane, but, in general, the
    Lagrange property (1.10b) holds only in the case \(n=3\) (see Section 1.1.1).


