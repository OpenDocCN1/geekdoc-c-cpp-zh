  md: 'where \( f(y_i) \) are data sampled from a piecewise-linear function \( f \)
    given along the polygon''s boundary, \( \rho_i = \|\boldsymbol{x} - \boldsymbol{y}_i\|\),
    and \( \varepsilon_i \in \{-1, 0, 1\}\) with \( \varepsilon_i = -1 \) if the ray
    from \( \boldsymbol{x} \) to \( \boldsymbol{y}_i \) approaches \( \boldsymbol{y}_i
    \) from the outside of \( P \), \( \varepsilon_i = 0 \) if it is tangent to \(
    \partial P \) at \( \boldsymbol{y}_i \), or \( \varepsilon_i = 1 \) if it approaches
    \( \boldsymbol{y}_i \) from the inside of \( P \). These coordinates satisfy properties
    (1.10b) and (1.10c), but they can be negative inside non-convex polygons. Manson
    et al. [266] extend (1.16) and present *positive Gordon-Wixom coordinates* inside
    any simple polygon, which are as smooth as the boundary. The analytic expressions
    of these coordinates are rather lengthy, and we refer the reader to [266, Section
    3.2].


    # 1.2.8 Harmonic coordinates


    As observed in [149], one way of acquiring generalized barycentric coordinates
    with respect to any simple polygon is by solving the Laplace equation


    \(\Delta \phi = 0\) (1.17)


    given by a set of piecewise linear boundary conditions \( \boldsymbol{g} = [g_1,
    \dots, g_n]: \partial P \to \mathbb{R}^n \) such that every \( g_i \) has the
    Lagrange property (1.10b). These so-called *harmonic coordinates* satisfy all
    properties in (1.10).


    The classical way [215] to approximate these coordinates is by discretizing (1.17)
    over the space of piecewise linear functions with respect to a triangulation of
    \( P \). Alternatively, harmonic coordinates can also be approximated using the
    boundary element method [342], the complex variable boundary method [417], and
    the method of fundamental solutions [269].


    # 1.2.9 Maximum entropy coordinates


    Arroyo and Ortiz [15] and Sukumar [372] show independently that generalized barycentric
    coordinates can be obtained as the solution of a constrained optimization problem
    based on the principle of maximum entropy [211]. These *maximum entropy coordinates*
    are non-negative, but the Lagrange property (1.10b) holds only for strictly convex
    polygons. It was later realized in [380] that, using prior distributions [212,
    230, 357], the constrained optimization can be modified to be


    \(\max_{\phi(\boldsymbol{x}) \in \mathbb{R}_+^n} -\sum_{i=1}^n \phi_i(\boldsymbol{x})
