  md: 'not have a boundary). When applied to an oriented edge, the boundary operator
    returns the difference between the edge’s vertices. Likewise, \(\partial\) applied
    to an oriented 2-cell \(\sigma\) returns the sum of oriented edges of \(\sigma\)
    (with the orientation induced by that of \(\sigma\)). Since the boundary of a
    boundary is empty (\(\partial \circ \partial = 0\)) one has \(\delta \circ \delta
    = 0\), just like in the smooth case. Notice that the definition of \(\delta\)
    does not require the notion of inner products.


    In order to define the discrete codifferential \(\delta^*\) one additionally requires
    an inner product \((\cdot, \cdot)_k\) on the linear space of \(k\)-forms for each
    \(k\). Below we discuss the construction of such inner products. Given a fixed
    choice of inner products on discrete \(k\)-forms, the codifferential is defined
    by requiring that


    \((\delta \alpha, \beta)_{k+1} = (\alpha, \delta^* \beta)_k\)


    for all \(k\)-forms \(\alpha\) and all \((k+1)\)-forms \(\beta\), and the discrete
    *strongly defined* Laplacian acting on \(k\)-forms takes the form


    \(\mathrm{L} = \delta \delta^* + \delta^* \delta.\) (5.2)


    This perspective is that of *discrete exterior calculus* (DEC) [109, 118], where—by
    slight abuse of notation—inner products are referred to as “discrete Hodge stars.”


    Strongly defined Laplacians are self-adjoint with respect to the inner products
    \((\cdot, \cdot)_k\) on discrete \(k\)-forms, since


    \(((\mathrm{L}\alpha, \beta)_k = (\delta \alpha, \delta \beta)_{k+1} + (\delta^*
    \alpha, \delta^* \beta)_{k-1} = (\alpha, \mathrm{L}\beta)_k.\)


    Moreover, strongly defined Laplacians are always positive semidefinite (PSd),
    since


    \(((\mathrm{L}\alpha, \alpha)_k = (\delta \alpha, \delta \alpha)_{k+1} + (\delta^*
    \alpha, \delta^* \alpha)_{k-1} \ge 0.\)


    In particular, a discrete \(k\)-form is harmonic (\(\mathrm{L}\alpha = 0\)) if
    and only if \(\delta \alpha = \delta^* \alpha = 0\), just like in the smooth setting.


    # 5.3.4 Strongly and weakly defined Laplacians


    Every strongly defined Laplacian acting on 0-forms has a weakly defined cousin
    \(L\) acting on discrete functions \(u\). The weak version is obtained by requiring
    that at every vertex \(i\) the resulting function \(Lu\) is equal to


    \(((Lu)_i = (Lu, 1_i)_0 = (\delta^* \delta u, 1_i)_0 = (\delta u, \delta 1_i)_1,\)


    where \(1_i\) is the indicator function of vertex \(i\). In particular, let \(M_0\)
    and \(M_1\) be the symmetric positive definite matrices that encode the inner
    products between 0-forms and 1-forms, respectively,


    \((u, v)_0 = u^T M_0 v \quad \text{and} \quad (\alpha, \beta)_1 = \alpha^T M_1
    \beta.\)


    Then the weakly and strongly defined Laplacians satisfy, respectively,


    \(L = \delta^T M_1 \delta \quad \text{and} \quad \mathbb{L} = M_0^{-1} L.\)'
