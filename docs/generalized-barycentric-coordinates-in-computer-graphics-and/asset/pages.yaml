    # 4.2 BIJECTIVE BARYCENTRIC MAPPING


    Let us denote the *partial derivatives* of the barycentric mapping $f = (f_1,
    f_2)$ in (4.1) at $\mathbf{x} = (x_1, x_2) \in \hat{\Omega}^0$ by $\partial_k
    f(\mathbf{x}) = \partial f / \partial x_k, k = 1, 2$, and the *gradients* of its
    two components $f_i$ by $\nabla f_i = (\partial_1 f_i, \partial_2 f_i)$.


    Since we consider only source and target polygons without self-intersections and
    assume that the barycentric coordinates $\phi_i$ are at least continuously differentiable,
    a sufficient condition for the injectivity of $f$ is that its Jacobian determinant


    $J_f = \begin{vmatrix} \partial_1 f_1 & \partial_2 f_1 \\ \partial_1 f_2 & \partial_2
    f_2 \end{vmatrix}$


    is strictly positive in $\hat{\Omega}^0$ [272]. As it follows from (4.1) that
    a barycentric mapping between identical source and target polygons is the identity
    with $J_f(\mathbf{x}) = 1$ for all $\mathbf{x} \in \hat{\Omega}^0$, it is reasonable
    to expect that a small perturbation of the target vertices keeps $J_f$ positive
    and the mapping bijective, as shown in Figure 4.4.


