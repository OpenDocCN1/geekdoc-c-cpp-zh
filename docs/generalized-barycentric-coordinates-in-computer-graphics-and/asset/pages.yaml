    # 5.3.5 Hodge decomposition


    Given a choice of inner products for $k$-forms on simplicial manifolds, one always
    obtains a discrete Hodge decomposition. Indeed, for every discrete $k$-form $\alpha$
    one has


    $\alpha = \delta \mu + \delta^* \nu + h,$


    where $\mu$ is a $(k-1)$-form, $\nu$ is a $(k+1)$-form and $h$ is a harmonic $k$-form
    ($\mathbb{L}h = 0$). As in the smooth case, not only is this decomposition unique,
    it is also orthogonal with respect to the inner products on $k$-forms,


    $0 = (\delta \mu, \delta^* \nu)_k = (h, \delta \mu)_k = (h, \delta^* \nu)_k,$


    which immediately follows from $\delta \circ \delta = 0$ and the fact that harmonic
    forms satisfy $\delta h = \delta^* h = 0$.


    Akin to the smooth case, the Hodge decomposition establishes relations to global
    properties of simplicial manifolds, since the linear space of harmonic $k$-forms
    is isomorphic to the $k$-th simplicial cohomology of the simplicial manifold $M$.
    Again, as an application of this fact, consider a compact simplicial surface without
    a boundary. Then the dimension of the space of harmonic 1-forms is equal to twice
    the genus of the surface—independent of the concrete choice of inner products
    on $k$-forms.


