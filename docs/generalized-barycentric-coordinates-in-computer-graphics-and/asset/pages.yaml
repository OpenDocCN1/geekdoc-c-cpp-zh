    \ v_h),$$\n\nwith $\\Pi_{k-1}^\\nabla$ and $\\Pi_k^\\nabla$ defined as in Section\
    \ 15.2.5. Here, $\\overline{\\kappa}_P$ is a constant approximation of $K$ on\
    \ $P$, as for example, its cell average or its value at the barycenter of the\
    \ cell, and $S_P: V_h^k \\times V_h^k \\to \\mathbb{R}$ is the bilinear form\n\
    \n$$S_P(u_h, v_h) := \\sum_{r=1}^n \\text{dof}_r(u_h) \\text{dof}_r(v_h),$$\n\n\
    where, for $w_h \\in V_h^k$, we use $\\text{dof}_r(u_h)$ to denote the value of\
    \ the $r$-th degree of freedom of $w_h$ with respect to some arbitrary but fixed\
    \ ordering of the local degrees of freedom. This bilinear form is just the Euclidean\
    \ inner product on the space $\\mathbb{R}^n$ of vectors of degrees of freedom.\
    \ The right-hand side is discretized as\n\n$$(f, v_h)_h := \\sum_{P \\in \\Omega_h}\
    \ \\int_P f \\Pi_{k-2}^0 v_h \\, dV.$$\n\n**Remark 15.4.** This approximation\
    \ is sub-optimal in the $L^2$-norm for $k=1, 2$. However, for these cases it is\
    \ possible to construct alternative approximations of the right-hand side, which\
    \ makes the method optimal.\n\nUnder fairly general mesh assumptions [82], it\
    \ may be shown that there exists a constant $C$ independent of $h$ and $P$ such\
    \ that\n\n$$C^{-1} \\mathcal{A}^P(v_h, v_h) \\le \\mathcal{A}_h^P(v_h, v_h) \\\
    le C \\mathcal{A}^P(v_h, v_h)$$\n\nfor all $v_h \\in V_h^k$, which provides the\
    \ *stability* of the method and ensures the existence of a unique discrete solution.\
    \ Moreover, only the first term of $\\mathcal{A}_h^P(\\cdot, \\cdot)$ will be\
    \ non-zero when either $u_h$ or $v_h$ is a polynomial, and when both are polynomials\
    \ the bilinear form will exactly evaluate $\\mathcal{A}^P(\\cdot, \\cdot)$. \n\
    \nAll terms can be evaluated using only the degrees of freedom and the ability\
    \ to evaluate and integrate polynomials. Implementation details can be found in\
    \ [28, 386]. In particular, no pointwise evaluation of the virtual functions other\
    \ than the polynomial subspace is ever required. Given the virtual nature of the\
    \ method, the numerical solution is known in the form of its degrees of freedom,\
    \ i.e., nodal values and moments, from which a global continuous solution is obtained\
    \ by interpolation."
