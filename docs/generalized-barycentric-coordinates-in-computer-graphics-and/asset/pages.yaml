    # 14.4.2 Convection-adapted basis functions in 3D


    In the following, we depart from the model Laplace equation and discuss the convection-diffusion
    equation


    $Lu = -\varepsilon \Delta u + b \cdot \nabla u = 0$ (14.15)


    on a bounded polyhedral domain $\Omega \subset \mathbb{R}^3$ with constant $\varepsilon
    > 0, b \in \mathbb{R}^3, b \neq 0$, and some boundary conditions. As already mentioned
    in the introduction, the basis functions $\phi_i$ are now constructed for the
    differential operator $L$. The lowest order basis functions fulfil $L\phi_i =
    0$ instead of $-\Delta \phi_i = 0$ in each polyhedral element. While piecewise
    linear functions are recovered on triangular and tetrahedral meshes for the Laplace
    operator, we now build-in some non-linear features of the differential operator
    $L$ into the functions $\phi_i$.


    The original version of the BEM-based FEM is applied in [197] to (14.15) on a
    fixed tetrahedral mesh in 3D. Thus, the basis functions $\phi_i$ are relied on
    the surface triangles of the tetrahedral elements and fulfil the differential
    equation (14.15) inside the elements. The case $\varepsilon \to 0$ is numerically
    analyzed. Standard methods without additional stabilization run into oscillations
    for small $\varepsilon$, since the equation degenerates to a first-order problem.
    The original BEM-based FEM formulation without explicit stabilization, however,
    shows less oscillations due to the built-in features. The hierarchical construction
    described in the previous subsection even improves this effect. In this case the
    basis functions $\phi_i$ fulfil certain projected convection-diffusion equations
    on the edges and faces of the tetrahedra, see Figure 14.7 and replace $-\Delta$
    by $L$. The results presented in [199] are even promising when compared to a streamline
    upwind/Petrov-Galerkin (SUPG) finite element method, which has explicit stabilization
    to treat the convection-dominated case.'
