    for polyhedra with triangular faces. For example, given the signed angle $\alpha_{i,j}$
    formed by $\mathbf{v}_i - \mathbf{x}$ and $\mathbf{v}_j - \mathbf{x}$, the choices


    $$c_{i,j} = 2 - \left( \frac{\|\mathbf{v}_i - \mathbf{x}\|}{\|\mathbf{v}_j - \mathbf{x}\|}
