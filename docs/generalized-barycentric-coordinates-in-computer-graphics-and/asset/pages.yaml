    # 11.6 SUMMARY AND OUTLOOK


    In this chapter, we discussed several applications of polyhedral finite elements
    in solid mechanics. These included rapid meshing of geometrically complex structures
    and pervasive-fracture modeling using random close-packed Voronoi meshes. Each
    of these applications requires a finite element formulation that can handle non-convex
    polyhedra and polyhedra with warped faces. A displacement-based finite element
    formulation based on the use of harmonic shape functions, a type of generalized
    barycentric coordinate, was reviewed for use in these applications.


    With continuing research into polyhedral meshing tools and finite element formulations,
    the use of polyhedral finite elements is expected to become commonplace'
