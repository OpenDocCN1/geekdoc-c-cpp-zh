  md: '![](img/4913dd83a2a14bc205a0a92cce102c82_197_0.png)


    Figure 10.3. Left: A thrust network, inspired by the shape of the top of the Liliuum
    tower, and its top view. Middle: The top view admits a reciprocal diagram, certifying
    horizontal equilibrium. Right: The discrete Airy stress surface S corresponding
    to this reciprocal diagram.


    While existence of a thrust network within a masonry structure is sufficient to
    guarantee the structure''s stability, the thrust line does not necessarily encode
    the true forces flowing through the structure: many possible thrust networks can
    exist within a masonry volume, and any one of these certifies the structure''s
    stability. Consider for instance a four-legged stool: the stool stands with any
    one of its legs removed, and the true force flowing through the four legs cannot
    be determined by examining the geometry of the stool alone. In practice such static
    indeterminacy is commonplace.


    # 10.1.4 Maxwell''s reciprocal diagrams


    Given a graph G and vertex loads Fi, when do there exist edge weights that place
    the thrust network in equilibrium? To address this question, we begin by making
    the additional assumption about the structure that the external loads are purely
    vertical, that is, parallel to the z axis (this is reasonable, since the self-weight
    of the structure usually dominates most other external loads such as those due
    to wind, etc.). We can thus write Fi = Fi ẑ for scalar loads Fi. It will also
    be useful to project the vertices vi of G into the xy-plane, to yield a top view
    G̃ with vertices ũi, to which we associate heights zi (see Figure 10.3). The equilibrium
    equations (10.1) then split into the pair


    ```

    0 = \(\sum_{j \sim i} w_{ij}(\vec{u}_j - \vec{u}_i)\) (10.2)


    \(-F_i = \sum_{j \sim i} w_{ij}(z_j - z_i)\) (10.3)

    ```


    of horizontal and vertical equilibrium equations for each interior or free boundary
    vertex i. Notice that only the vertical equations involve the loads or heights
    of the vertices of G; existence of weights that satisfy the horizontal equations
    is purely'
