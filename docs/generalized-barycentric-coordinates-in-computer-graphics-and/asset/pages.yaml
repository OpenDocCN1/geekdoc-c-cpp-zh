    of barycentric coordinates have been developed since then (see Chapter 1). The
    majority of these constructions are not limited to a particular dimension for
    the domain and do not require convex domains. While any of these constructions
    can be used to create S-patches, we utilize mean value coordinates [144, 150,
    200, 217] here in these examples.


