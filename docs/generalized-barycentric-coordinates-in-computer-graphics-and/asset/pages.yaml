- pgno: 269
  md: 'where the last constraint encodes the additional information about the system.
    The solution to this constrained optimization problem is \(p_1 = 0.103, p_2 =
    0.123, p_3 = 0.146, p_4 = 0.174, p_5 = 0.207, \text{and } p_6 = 0.247\), showing
    that the higher expected value for \(f\) biases the probabilities towards faces
    with a higher numerical value.


    Going back to the problem of inferring the generalized barycentric coordinates,
    it is now clear that application of Jaynes''s principle of maximum entropy leads
    to an optimization program at each point \(\boldsymbol{x} \in P\) and is given
    by


    ```

    \(\max_{\phi_1, \dots, \phi_n} - \sum_{i=1}^n \phi_i \log \phi_i\)

    \(\text{subject to } \phi_i \ge 0, \sum_{i=1}^n \phi_i = 1, \sum_{i=1}^n \phi_i
    \boldsymbol{v}_i = \boldsymbol{x},\)

    (13.5)

    ```


    where the dependence on \(\boldsymbol{x}\) only enters through the last vectorial
    constraint. The solution to the program is the value of the barycentric coordinates
    selected by entropy maximization at \(\boldsymbol{x}\), \(\phi_i(\boldsymbol{x}),
    i = 1, 2, \dots, n\). Because the entropy function is strictly concave, this program
    has a unique solution if and only if it is feasible, that is, whenever \(\boldsymbol{x}
    \in \bar{P}\) [67]. This method, reviewed in Section 1.2.9, was introduced in
    [372] to generate basis functions for polygons.


    Figure 13.2 shows the basis functions defined by entropy maximization for a set
    of vertices that not only defines a polygon, but also samples its interior and
    its faces. It can be observed that in agreement with the general results for convex
    approximation schemes mentioned earlier, the basis function associated to the
    extreme vertex \(\boldsymbol{v}_1\) is 1 at \(\boldsymbol{v}_1\), and therefore
    all other basis functions are zero at this point. Also in agreement with the general
    results, the basis function of the interior vertex \(\boldsymbol{v}_3\) vanishes
    on the boundary of \(P\), and the basis function \(\phi_2\) does not satisfy the
    Kronecker-delta property because \(\boldsymbol{v}_2\) is on the boundary but is
    not an extreme point. Yet this set of basis functions presents a significant disadvantage
    when used to approximate functions in general, or solutions of PDEs in particular:
    the basis functions are completely nonlocal. The most dramatic case is that of
    basis functions of interior nodes, such as \(\phi_3\), which spread through the
    entire domain and are as uniform as allowed by the convex structure of the optimization
    program. This is not a desirable feature to approximate functions over \(P\) because
    with such a basis it is not possible to define a localized feature, say around
    vertex \(\boldsymbol{v}_i\), and correlate this feature with the nodal value \(u_i\)
    in (13.1). Besides the lack of local resolution, such a global set of basis functions
    leads to a dense stiffness matrix when used in a Galerkin method to approximate
    partial differential equations [204].


    This discussion suggests that in defining the generalized coordinates by mere
    entropy maximization, we have been “too unbiased.” We have ignored the fundamental
    requirement of locality, by which the approximation in (13.1) at a given point
    \(\boldsymbol{x}\) should more strongly depend on coefficients \(\boldsymbol{u}_i\)
    associated to vertices close to \(\boldsymbol{x}\). Local basis functions should
    concentrate their “mass” in the vicinity of their associate vertex, where their
    value should be closer to 1 than, for instance, \(\phi_3\) in Figure 13.2.'
