- pgno: 195
  md: 'Following Heyman [189], we make the following assumptions about the masonry
    structures we consider:


    +   1. The material has effectively infinite compressive strength (reasonable
    since the yield stress of stone far exceeds the working stress in practical structures).


    +   2. In contrast, the structure has no tensile strength: mortar may be present
    at block interfaces, but this mortar is weak and cracks readily due to settling
    and weathering, so that it cannot be assumed to have any structural strength.


    +   3. Failure of the structure by sliding is impossible (prevented either by
    the orientation of the block interfaces, or the presence of sufficient friction).
    Failure can occur only due to hinging apart of the structure.


    The assumptions about compressive and tensile strength are critical ingredients
    in the geometric analysis of masonry, since they remove concerns about material
    failure: when a network of blocks crumbles, it is not due to buckling or crumbling
    of the blocks, but rather, due to geometric failure of the arrangements of the
    blocks alone. We thus need make no further assumptions about the composition,
    density, size, or other physical characteristics of the blocks.


    # 10.1.2 Heyman''s safe theorem


    Heyman, building on the ideas of Kooharian [226], applied limit theorems from
    the theory of plasticity to formulate the safe theorem of 2D masonry structures*
    for masonry structures:


    > If a line of thrust can be found which is in equilibrium with the external loads
    and lies wholly within the masonry, then the structure is safe.


    A thrust line is a geometric representation of the forces flowing through the
    masonry structure. More specifically, consider a network of rigid blocks (see
    Figure 10.1, right). To each block i we associate an external load Fi ∈ R2; typically
    this load is the block''s self-weight and so is parallel to the direction of gravity.
    We also classify blocks as anchored boundary blocks if they are planted into the
    ground, and thus can support arbitrary loads from arbitrary directions, and free
    boundary blocks or interior blocks if they must be supported.


    A thrust line is a graph G dual to the block network (so that to each block i
    corresponds a vertex vi of G), and an associated set of weights wij > 0 on the
    edges of G (with wij = wji), so that the weighted sum of all edge vectors coming
    in to an interior or free boundary vertex vi exactly balances the external load:


    ```

    Fi = sum_{j > i} wij(vi - vj), (10.1)

    ```


    where the sum is over all vertices j incident to i.'
