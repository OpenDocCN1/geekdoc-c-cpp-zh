- pgno: 131
  md: 'determines the vertex positions, and the map is implicitly assumed to be linear
    along the polygon edges. Notwithstanding, fixing the entire boundary can be overly
    restrictive. It requires more than a bare minimum input from the user and can
    lead to less visually pleasing deformations, where the underlying map f has excessive
    map distortion. One way to alleviate this is to use less restricting constraints
    and to allow the algorithm to deduce the missing degrees of freedom automatically
    by solving a variational problem (Section 7.3). For example, the user can prescribe
    the behavior of the map f on a sparse set of interior points rather than on the
    entire boundary (Section 7.3.2).


    Another requirement is that the underlying algorithms need to be relatively efficient
    to compute. This allows the users to explore the space of valuable deformations
    interactively and to reach their envisioned artistic design by trial and error.
    Interactivity and simplicity of the user interface also allow novice users to
    use the application. As we will see, many of the involved computations can be
    done in a preprocessing step, leaving a marginal amount of computation to be done
    in run-time during interaction with the system. Moreover, the deformation can
    often be computed in parallel, utilizing the graphics hardware, where the computation
    time is of the same order of magnitude as the rendering time itself (Section 7.5).


    Working with the special case of maps from R^2 to R^2 allows us to use an alternative
    representation by identifying R^2 with the complex plane C. Points x = (x, y)
    ∈ R^2 are identified with complex numbers z ∈ C by z = x + iy. The map f becomes
    a complex-valued function of a single complex variable f : Ω → C. Utilizing complex
    notation often leads to simplified expressions and allows us to rely on powerful
    mathematical results from the rich theory of complex analysis. This is particularly
    apparent when the underlying complex functions are holomorphic (complex analytic)
    and/or harmonic, which are of particular value in shape deformation due to their
    smoothness and other mathematical properties.


    # 7.2 COMPLEX BARYCENTRIC COORDINATES


    Let z1, ..., zn ∈ C be the vertices of a simple polygon P (not necessarily convex)
    in counterclockwise orientation (see Figure 7.1). We sometimes refer to P as the
    cage, as it encapsulates the part of the plane that we would like to deform. The
    interior of P is treated as an open domain denoted by Ω. A set of complex-valued
    functions φi, Ω → C, i = 1, ..., n are called complex barycentric coordinates
    [415] if they satisfy the complex analogue of the Properties (1.8) and (1.9) in
    Definition 1.1,


    \sum_{i=1}^n \phi_i(z) = 1, (7.1)

    \sum_{i=1}^n \phi_i(z)z_i = z (7.2)


    for all points z ∈ Ω.'
