    # 2.7 EXTENSIONS AND FUTURE DIRECTIONS


    The results from this chapter focus on interpolation error estimates for generalized
    barycentric coordinates in the context of linear finite element methods on polygonal
    and polyhedral meshes for scalar-valued elliptic partial differential equations.
    In [320], we have shown how to construct basis functions for quadratic order finite
    elements on polygons by taking linear combinations of pairwise products of generalized
    barycentric coordinates. The gradients of such functions have terms of the form
    \(\phi_i \nabla \phi_j\), and thus our estimates on \(\|\nabla \phi_j\|\) remain
    a crucial ingredient in error estimates for such higher order methods.


    In [165], we have shown how to construct basis functions for linear order, vector-valued,
    \(H(\text{curl})\)- and \(H(\text{div})\)-conforming elements on polygons and
    polyhedra. Our construction uses generalized barycentric functions and their gradients
    in forms like \(\phi_i \nabla \phi_j - \phi_j \nabla \phi_i\), mimicking the approach
    of Whitney functions for barycentric coordinates on simplices. Again, the bounds
    on \(\|\nabla \phi_j\|\) explained in this chapter are necessary in the error
    analysis of such methods.


    At the beginning of this chapter we raised the question of whether a change in
    mesh or an alternative selection of generalized barycentric coordinate type could
    fix a simulation code that would otherwise crash. The answer is certainly yes,
    both approaches can improve numerical methods for interpolation. In particular,
    the Wachspress, discrete harmonic, and maximum entropy coordinates with the uniform'
