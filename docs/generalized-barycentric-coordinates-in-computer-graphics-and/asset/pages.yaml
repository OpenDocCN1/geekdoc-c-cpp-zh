    # 1.3 3D COORDINATES


    We now focus on the 3D case and consider a polyhedron $P$ with $n$ vertices $v_1,
    \dots, v_n$ and $m$ faces $f_1, \dots, f_m$. We present explicit formulations
    for some generalized barycentric coordinates in this setting, which are direct
    extensions of the corresponding 2D constructions. Since the properties of these
    coordinates carry over from 2D to 3D, we do not mention them explicitly.


    # 1.3.1 Wachspress coordinates


    Wachspress coordinates can be generalized to convex polyhedra in which all vertices
    have exactly three incident faces [407, 411, 413], and to arbitrary convex polyhedra
    using the concept of polar duals [218]. The polar dual of a bounded convex polyhedron
    that contains the origin is itself a convex polyhedron of the form $P_d = \{ y
    \in \mathbb{R}^3 \mid y \cdot z \le 1 \forall z \in P \}$. Since each vertex $v_i$
    of $P$ has a dual polygonal pyramid $\Delta_i$ in $P_d$ (see Figure 1.9 for a
    2D example), translating $P$ such that $x$ is at the origin and letting


    ```

    $w_i = \text{Vol}[\Delta_i], \quad i=1, \dots, n$

    ```


    leads to 3D Wachspress coordinates after the normalization in (1.12). Note that
    the constructions in [411, 413] also extend to higher dimensions.'
