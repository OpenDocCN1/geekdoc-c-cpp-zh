    Consider a body in its stress-free, undeformed configuration that occupies an
    open domain \(\Omega \subset \mathbb{R}^d\) with boundary \(\partial \Omega\).
    On its boundary, it is subjected to a prescribed displacement field \(u^0\) on
    \(\Gamma^u\) and traction \(t\) (per unit undeformed surface) on \(\Gamma^t\),
    such that \(\Gamma^u \cup \Gamma^t = \partial \Omega\) and \(\Gamma^u \cap \Gamma^t
    = \varnothing\). The body is also assumed to be subjected to a body-force \(f\)
    (per unit undeformed volume) in \(\Omega\). A stored-energy function \(W\) is
    used to characterize the constitutive behavior of the body, which is assumed to
    be an objective function of the deformation gradient \(F\). In terms of \(W\),
    the first Piola-Kirchhoff stress tensor \(P\) at each material point \(x \in \Omega\)
    is thus given by the following relation:


    \(P(x) = \frac{\partial W}{\partial F}(x, F),\)


    which is used as the stress measure of choice in this chapter.


    # 12.2.1 Displacement-based formulation


    The well-known principle of minimum potential energy asserts that the equilibrium
    displacement field \(u\) minimizes the potential energy \(\Pi\) among all displacement
    fields that are kinematically admissible:


    \(\Pi(u) = \min_{v \in \mathcal{K}} \Pi(v),\quad (12.1)\)


    with


    \(\Pi(v) = \int_{\Omega} W(x, F(v)) \, dx - \int_{\Omega} f \cdot v \, dx - \int_{\Gamma^t}
    t \cdot v \, ds.\quad (12.2)\)


    In the above expression, \(\mathcal{K}\) stands for a sufficiently large set of
    displacements such that \(v = v^0\) on \(\Gamma^e\).


    The weak form of the Euler-Lagrange equations associated with the variational
