    A common method for generating the RCP points is based on a variant of a Poisson
    process and is known as random sequential adsorption, or maximal Poisson sampling
    (MPS). In this approach, points are randomly and sequentially placed in a domain
    with a constraint on minimum distance between points [60]. The constraint on distance
    between points is enforced by merely discarding those new points that violate
    the constraint. The seeding process stops when the maximum packing threshold is
    reached within tolerance. This approach to generating the RCP seeding can be inefficient,
    and does not have a quantifiable stopping time. Recently, a very efficient MPS
    method has been proposed with a finite stopping time [135].


    In practice, the Voronoi tessellation can contain numerous relatively small edges
    that are inappropriate for finite element analysis, in particular for explicit-dynamics
    time integration. The Voronoi mesh can be regularized for finite element computation
    by simply deleting those edges whose size is below a relative tolerance. In three
    dimensions, this edge-collapse operation will produce non-planar faces, and may
    give tangled polyhedra if the regularization is too aggressive.


