    coordinates. Before entering the heart of the matter, to motivate the subject,
    we present several applications of mesh parameterization. We suppose for now that
    the (u_i, v_i) coordinates are already given, how to compute them will be explained
    later.


    # 6.2 APPLICATIONS OF MESH PARAMETERIZATION


    Texture mapping, that is, “wrapping” images around 3D objects, is one of the main
    applications of mesh parameterization (see Figure 6.2). Texture mapping uses a
    one-to-one correspondence between the 3D mesh and a 2D domain (referred to as
    a parametric space). It is possible to define such a correspondence by linearly
    interpolating the (u_i, v_i) coordinates associated with each vertex of the triangulation.
    Suppose you want to know the 3D point that corresponds to a given point u = (u,
    v) in parameter space. If the point u corresponds to one of the vertices u_i =
    (u_i, v_i), then it is mapped to p_i = (x_i, y_i, z_i). If the point u is arbitrary,
