- pgno: 29
  md: 'and (1.10c). Moreover, mean value coordinates are positive inside any quadrilateral,
    similarity invariant, and smooth, except at the vertices of $P$, where they are
    only $C^0$.


    To derive positive mean value coordinates for non-convex polygons, Lipman et al.
    [251] use the transfinite description of mean value coordinates [217] and restrict
    the integration to the part of $\partial P$ that is visible from $x$. These coordinates
    can be efficiently evaluated by exploiting the GPU, but they are only $C^0$ along
    certain lines inside the polygon.


    # 1.2.4 Complete family of coordinates


    Floater et al. [149] show that for arbitrary real functions $c_i : P \to \mathbb{R}$,
    the weights


    ```

    $w_i = \frac{c_{i-1}A_i - c_i B_i + c_{i+1}A_{i-1}}{A_{i-1}A_i}, \quad i = 1,
    \dots, n, \quad (1.14)$

    ```


    with the signed areas $A_i$ and $B_i$ shown in Figure 1.2, satisfy property (1.11).
    Therefore, the task of finding generalized barycentric coordinates simplifies
    to finding functions $c_i$ such that the weights in (1.14) are positive, or, if
    not, at least sum up to a non-vanishing denominator $W$, without our having to
    worry about properties (1.8) and (1.9), which are satisfied by construction, and
    the resulting coordinates are as smooth as the functions $c_i$. Moreover, any
    set of generalized barycentric coordinates can be expressed in terms of the weights
    in (1.14) with the proper choice of $c_i$.


    An interesting special case of this complete family of coordinates is given by
    $c_i = \|v_i - x\|^p$ for any $p \in \mathbb{R}$. In this case, the choices of
    $p=0, p=1,$ and $p=2$ give Wachspress, mean value, and discrete harmonic coordinates,
    respectively. Surprisingly, the only coordinates for this choice of $c_i$, which
    are non-negative for any convex polygon, are Wachspress and mean value coordinates
    [149]. For any $p$, the coordinates are similarity invariant, and a simple geometric
    interpretation can be found in [232, Appendix A].


    An alternative geometric construction for general weight functions $w_i$, which
    satisfy (1.8) and (1.9) and are non-negative by construction, is based on power
    diagrams [78]. However, the resulting power coordinates are not necessarily smooth.


    # 1.2.5 Metric coordinates


    Malsch et al. [265, 375] construct the so-called *metric coordinates*, which are
    given by the weight functions


    ```

    $w_i = \frac{A_{i-2}}{C_{i-1}q_i - 2q_{i-1}} - \frac{B_i}{C_i q_i - q_i} + \frac{A_{i+1}}{C_{i+1}q_i
    q_{i+1}}, \quad i = 1, \dots, n,$

    ```


    where $A_i, B_i,$ and $C_i$ are the areas shown in Figure 1.2, and


    ```

    $q_i = r_i + r_{i+1} - e_i$

    ```


    with $r_i = \|v_i - x\|$ and $e_i = \|v_{i+1} - v_i\|$. The functions $q_i$ are
    non-negative everywhere in the plane, which guarantees a non-vanishing denominator
    $W$ for all'
