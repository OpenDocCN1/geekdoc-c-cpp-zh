    the boundary data. While all holomorphic barycentric coordinates are non-interpolating,
    almost all real barycentric maps are interpolating. It is interesting then to
    explore new types of complex barycentric coordinates that are interpolating, yet
    not purely real. These are obviously not holomorphic.


    Sufficient conditions for interpolation of complex barycentric coordinates are
    discussed in [416]. Loosely speaking, each weight function \(\gamma_i\) should
    approach infinity on its corresponding edge (including its endpoints) while being
    finite elsewhere. This ensures that the limit of the normalized weight \(\gamma_i\)
    is 1 when approaching a point on the open (i.e., excluding the endpoints) i-th
    edge from within the domain, while all other weights \(\gamma_j, j \neq i\) approach
    zero. Hence, the barycentric map \(f = \sum_{i=1}^n S_i \gamma_i\) maps the open
    i-th edge as \(S_i\). For the exact sufficient conditions, as well as the conditions
    to interpolate the vertices, see [416, Section 3.1].


