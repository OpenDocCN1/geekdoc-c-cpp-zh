- pgno: 300
  md: 'THIS CHAPTER establishes a connection between the harmonic generalized barycentric
    coordinates (GBCs) and the lowest order virtual element method, resulting from
    the fact that the discrete function space is the same for both methods. This connection
    allows us to look at the high order virtual element spaces as a further generalization
    of the harmonic GBC in both two and three spatial dimensions. We also discuss
    how the virtual element methodology can be used to compute approximate solutions
    to PDEs without requiring any evaluation of functions in the local discrete spaces,
    which are implicitly defined through local boundary-value problems.


    # 15.1 INTRODUCTION


    The virtual element method (VEM) was originally introduced in [27] as a variational
    reformulation of the arbitrary order mimetic finite difference method [31, 71];
    see also [32] and the review paper [253]. The VEM is a generalization of the finite
    element method (FEM), offering great flexibility in utilizing meshes with (almost)
    arbitrary polygonal elements, and the possibility of constructing discrete spaces
    incorporating an arbitrary degree of inter-element continuity [33].


    The discrete space used by the lowest order conforming virtual element method
    on each polygonal mesh element is simply the space of harmonic GBC. The functions
    in this space are implicitly defined through local Dirichlet problems. These problems
    must be solved before they can be used in the standard harmonic GBC method [215].
    However, the virtual element method is formulated in such a way that these local
    problems do *not* have to be solved. Instead, projections of the functions onto
    a subspace of polynomials are computed, which do not rely on evaluating the local
    functions, and these projections are employed in the method.


    The virtual element method also provides generalizations of the harmonic GBC of
    arbitrary order, in the sense that they contain a subspace of polynomials of specified
    degree. These spaces still define the functions implicitly through local Dirichlet
    problems, but by carefully choosing the set of functions taken as the basis of
    the space, the virtual element method can still be computed without ever having
    to solve (or even approximate) the local problems. Indeed, the method only requires
    the knowledge of a polynomial subspace of the local finite element space to provide
    stable and accurate computational methods. This is accomplished by separating
    the contributions of the polynomial subspace from that of the complementary non-polynomial
    virtual subspace through the introduction of suitable projection operators that
    can be computed using only the VEM degrees of freedom. The polynomial *consistency*
    terms, responsible for the convergence properties of the method, are computed
    accurately. The remaining terms are only required to ensure the *stability* of
    the method, and hence they can be roughly estimated from the degrees of freedom.


    We present here a link between a *natural* basis of the local discrete space,
    associated with a parametrization of the data of the local Dirichlet problems,
    and the *virtual* basis that is used in practice. This construction also addresses
    the commonly'
  merge: -1
