    # 3.3.4 Modified Gordon-Wixon for polyharmonic interpolation


    Earlier we noted that


    ```

    \frac{1}{\pi} \int_0^{2\pi} \frac{\partial^2}{\partial \theta^2} d\theta = \frac{1}{\pi}
    \int_0^{2\pi} \left( \cos \theta \frac{\partial}{\partial x_1} + \sin \theta \frac{\partial}{\partial
    x_2} \right)^2 d\theta = \Delta.

    ```


    Together with (3.27), this suggests that similar formulas can be obtained for
    the poly-Laplacian. Indeed, direct computations yield


    ```

    \frac{8}{5\pi} \int_0^{2\pi} \frac{\partial^6 u}{\partial e_\theta^6} d\theta
    = \Delta^3 u

    ```


    and more generally


    ```

    c_n \int_0^{2\pi} \frac{\partial^{2n} u}{\partial e_\theta^{2n}} d\theta = \Delta^n
    u, \quad \text{where} \quad c_n = 1 \bigg/ \int_0^{2\pi} (\cos \theta)^{2n} d\theta.
    \qquad (3.29)

    ```


    For example, \(c_1 = 1/\pi\), \(c_2 = 4/(3\pi)\), and \(c_3 = 8/(5\pi)\).


    In order to get a modified Gordon-Wixon scheme for polyharmonic interpolation,
    we then need to compute an approximation of \(\partial^{2n}u/\partial e_\theta^{2n}\)
    in terms of \(u(x), u(y_1), u(y_2), \dots, \partial^{n-1}u(y_1)/\partial e_\theta^{n-1},
    \partial^{n-1}u(y_2)/\partial e_\theta^{n-1}\).


    If \(\rho_1\) and \(\rho_2\) are small, then an approximation of the \((2n)\)-th
    order directional derivative of \(u(x)\) in the direction of \(e_\theta\) can
