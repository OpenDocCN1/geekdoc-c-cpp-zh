  md: 'An idealized material model useful for demonstrating large deformation behavior
    of a finite element formulation is the isotropic neo-Hookean model. For this material
    model the potential energy is of the form [63]


    ```

    $$W(\boldsymbol{F}) = \frac{\mu}{2} \boldsymbol{C} : \boldsymbol{I} - \mu \log
    J + \frac{\lambda}{2} (\log J)^2,$$ (11.2)

    ```


    where \(\mu\) and \(\lambda\) are material constants, and \(J^2 = \det \boldsymbol{C}\).
    Substituting (11.2) into (11.1) results in the following constitutive relationship
    between the first Piola–Kirchhoff stress \(\boldsymbol{P}\) and the deformation
    gradient \(\boldsymbol{F}\),


    ```

    $$\boldsymbol{P} = [\mu(\boldsymbol{F}\boldsymbol{F}^T - \boldsymbol{I}) + \lambda(\log
    J)\boldsymbol{I}]\boldsymbol{F}^{-T}.$$ (11.3)

    ```


    This material model is used in the simulation results shown in Figure 11.6. In
    the small deformation limit, (11.3) becomes the standard linear elasticity equation
    with \(\mu\) and \(\lambda\) the shear modulus and the Lamé parameter, respectively.
    Hyperelastic formulations also exist for large-deformation plasticity [139], where
    now the stress tensor is a function of the entire history of deformation.


    Finally, the governing equilibrium equations (conservation of linear momentum)
    are required. In Section 11.3, generalized barycentric coordinates are used to
    form the finite element shape functions directly in the initial configuration
    of the domain. Additionally, the weak form of the equilibrium equations will be
    integrated in the reference configuration. Therefore, a *total*-Lagrangian formulation
    of the governing equations is appropriate (as opposed to *updated*-Lagrangian).
    The conservation of linear momentum is then given by [41]


    ```

    $$\frac{\partial \boldsymbol{P}}{\partial \boldsymbol{X}} \cdot \boldsymbol{I}
    + \rho_0 \boldsymbol{b} = \rho_0 \ddot{\boldsymbol{u}}$$ (11.4)

    ```


    with displacement boundary conditions


    ```

    $$\boldsymbol{u} = \bar{\boldsymbol{u}} \text{ on } \Gamma_u$$ (11.5)

    ```


    and traction boundary conditions


    ```

    $$\boldsymbol{P} \cdot \boldsymbol{N} = \boldsymbol{t}_0 \text{ on } \Gamma_t,$$
    (11.6)

    ```


    where \(\rho_0\) is the initial density, \(\boldsymbol{b}\) is the body force
    vector per unit mass, \(\ddot{\boldsymbol{u}}\) is the acceleration vector, \(\boldsymbol{N}\)
    is the outward unit normal on \(\Gamma_0\), \(\boldsymbol{t}_0\) is the traction
    vector per unit initial area, and \(\Gamma_u \cup \Gamma_t = \Gamma_0\) and \(\Gamma_u
    \cap \Gamma_t = \emptyset\).


