  md: '# 7.4.3 Variational conformal maps


    The simple strategy of constructing a conformal map from \( l \) can be extended
    by using a variational approach, designing a numerical optimization in which the
    real and imaginary parts of \( l_i \) in (7.24) are variables. We can add, for
    example, equality constraints on the real and/or imaginary parts of \( l(r_j)
    \) at some user-defined points \( r_j \) at which the user can precisely control
    the amount of scale and/or rotation induced by the map. Such constraints are linear
    in the variables and can be easily enforced. In fact, in the continuous case,
    it is possible to prescribe the scale or the rotation (but not both) on the *entire*
    boundary (of a simply connected domain). In [417], the rotation is fully prescribed
    on the boundary and a linear system is solved to recover \( l \). Furthermore,
    the method of [241] can be used to enforce additional *inequality* constraints
    that bound the isometric distortion (recall Section 7.2.1),


    \(\tau(w) = |\ln |f''(w)||.\)


    The goal is to bound the distortion at a point \( y_j \) by some positive user-defined
    constant \( \Gamma \). This constraint can be expressed as


    ```

    \(\tau(y_j) \le \Gamma \Leftrightarrow\)

    \(-\Gamma \le \ln |f''(y_j)| \le \Gamma \Leftrightarrow\)

    \(-\Gamma \le \text{Re}(\log(f(y_j))) \le \Gamma \Leftrightarrow\)

    \(-\Gamma \le \text{Re}(l(y_j)) \le \Gamma,\)

    ```


    where it is easy to see that the last row corresponds to two inequalities that
    are *linear* in our variables. Such inequalities are convex and can be enforced
    efficiently in practice using convex programming [67]. Furthermore, since \(\text{Re}(l(z))\)
    is the real part of a holomorphic function, it is harmonic, therefore its minimum
    and maximum are attained on the boundary. Hence, bounding the isometric distortion
    of a conformal map on the boundary implies a global bound throughout the entire
    domain, which guarantees that the conformal map in hand is of high quality. Bounding
    the distortion on the boundary is still challenging since there are still an infinite
    number of boundary points. However, due to the smoothness of the basis functions,
    this can be accomplished by forcing a bound on a finite dense set of boundary
    samples \( y_j \) [95].


    The approach presented in this section for computing conformal maps is simple
    to implement and fairly efficient. Nevertheless, it does not allow for prescription
    of positional constraints (P2P handles) since the positions are highly nonlinear
    expressions in the \( l_i \) variables. A sophisticated approach based on non-convex
    programming was introduced in [95]. This method is order of magnitudes slower
    compared to the ones presented here, but it produces remarkable results and can
    still run at interactive rates.'
