  md: 'As an immediate corollary of Proposition 7.4, we have that if the \(\gamma_i\)
    have nonvanishing sum, then the homogeneous coordinates \(w_i\) of (7.16) also
    have nonvanishing sum.


    We have basically shown that for any set of arbitrary complex weight functions
    \(\gamma_i\) with nonvanishing sum, there is a corresponding set of complex barycentric
    coordinates. Constructing barycentric coordinates from the weight functions is
    straightforward. Simply plug the \(\gamma_i\) weight functions into (7.16) to
    obtain the homogeneous coordinates \(w_i\) (Proposition 7.3) and normalize (Proposition
    7.2) by either \(\sum_{i=1}^n w_i\) or \(\sum_{i=1}^n \gamma_i\) to obtain complex
    barycentric coordinates \(\phi_i\). Hence, we simplified the task of constructing
    complex barycentric coordinates to the task of finding arbitrary weight functions
    with nonvanishing sum. Moreover, the above construction covers the entire space
    of complex barycentric coordinates in the sense that for any complex barycentric
    coordinates \(\phi_i\) there exist (not necessarily unique) weights \(\gamma_i\)
    that result in \(\phi_i\) if the above construction is applied. The proof is done
    by choosing \(\gamma_i\) arbitrarily and recursively computing all other \(\gamma_i\)
    using (7.16) [415].


    We now provide an alternative interpretation for the weight functions \(\gamma_i\).
    Any set of complex-valued weight functions \(\gamma_i\) with a nonvanishing sum
    everywhere inside the domain corresponds to the complex barycentric map [416]


    ```

    \(f(z) = \sum_{i=1}^n S_i(z)\gamma_i(z), \quad (7.17)\)

    ```


    where \(S_i\) are the unique similarity transformations that map the edges of
    the source cage to the edges of the target cage (recall (7.9) for their expression)
    and \(\bar{\gamma}_i = \gamma_i / \sum_{j=1}^n \gamma_j\) are the normalized weights.
    The converse is also true. That is, any complex barycentric map can be expressed
    as a (normalized) blending of edge-to-edge similarity transformations. In particular,
    it is easy to verify that the choice of \(\gamma_i = \text{Log}(\frac{B_{i+1}}{B_i})\)
    leads to Cauchy''s coordinates. This alternative viewpoint is somewhat more intuitive
    geometrically than (7.16). It emphasizes that the weight functions can be associated
    with the edges and is useful for deriving custom-made barycentric coordinates
    (Section 7.2.3). Moreover, it allows us to extend the concept of barycentric maps
    in two possible ways. First, we can use (7.17) for an arbitrary collection of
    segments that do not necessarily form a closed polygon, allowing us to define
    "partial" cages or to augment a given cage with additional interior segments for
    extra user control. The second possible extension is to substitute the similarity
    transformations \(S_i\) in (7.17) with more general edge-to-edge affine transformations
    \(A_i\),


    ```

    \(f(z) = \sum_{i=1}^n A_i(z)\gamma_i(z).\)

    ```


    Note that such planar maps cannot in general be expressed as real or complex barycentric
    maps. However, their evaluation is straightforward and as computationally efficient
    as the evaluation of barycentric maps, since the weights \(\bar{\gamma}_i\) can
    be computed and stored in a preprocessing step.'
