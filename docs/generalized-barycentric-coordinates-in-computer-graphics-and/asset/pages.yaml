    \(= \|u - p_u\|_{H^1(P)}^2 + \|I(u - p_u)\|_{H^1(P)}^2\) by (2.11),

    \(\le \|u - p_u\|_{H^1(P)}^2 + C_{BI}^2 \|u - p_u\|_{H^2(P)}^2\) by (2.9),

