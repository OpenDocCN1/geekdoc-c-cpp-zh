    where the error indicators are defined by


    ```

    \eta_P^2 = h_P^2 \|f + \Delta u_h\|_{L_2(P)}^2 + \sum_{i=1}^n h_{[v_i, v_{i+1}]}
    \|R_{P,i}\|_{L_2([v_i, v_{i+1}])}^2.

    ```


    The constant c > 0 only depends on the regularity parameters of the mesh and the
    approximation order k.


    The error in the energy norm decreases at least as fast as the error estimator
    $\eta_R$ according to the previous theorem. In order to have a good estimator,
    which can be used efficiently to estimate the true error, it is important that
    the error does not decrease faster than $\eta_R$. This behavior is shown in the
    next theorem, where the error indicators $\eta_P$ are bounded in terms of the
    error plus some data oscillations. For the lower bound, the estimate involves
    the neighborhood $\omega_P$ of the element $P$. This patch of elements is given
    by $\bar{\omega}_P = \bigcup \{P'' : P'' \in \mathcal{T}_h, P \cap P'' \neq \emptyset\}$.


    # Theorem 14.3 (Efficiency).


    Under the assumptions of Theorem 14.2, the residual-based error indicator is efficient,
    i.e.,


    ```

    \eta_P \le c \left( \|\nabla(u - u_h)\|_{L_2(\omega_P)}^2 + h_P^2 \|f - \bar{f}\|_{L_2(\omega_P)}^2
    + \sum_{\substack{i=1, \dots, n, \\ [v_i, v_{i+1}] \subset \Gamma_D}} h_{[v_i,
    v_{i+1}]} \|g_N - \bar{g}_N\|_{L_2([v_i, v_{i+1}])}^2 \right)

    ```


    where $\bar{f}$ and $\bar{g}_N$ are piecewise polynomial approximations of the
    data $f$ and $g_N$, respectively. The constant c > 0 only depends on the regularity
    parameters of the mesh and the approximation order k.


    The terms $\|f - \bar{f}\|_{L_2(\omega_P)}$ and $\|g_N - \bar{g}_N\|_{L_2([v_i,
    v_{i+1}])}$ are often called data oscillations. They are usually of higher order.


