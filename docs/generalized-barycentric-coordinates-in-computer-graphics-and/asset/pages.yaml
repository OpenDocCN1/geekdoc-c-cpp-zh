    on discrete \(k\)-forms (\(k\)-cochains) by


    ```

    \((\alpha, \beta)_k = \int_M g(W\alpha, W\beta)\text{vol}_g,\)

    ```


    where (in our case) \(g\) denotes a piecewise Euclidean metric on the simplicial
    manifold. From the perspective of the *Finite Element Method* (FEM), Whitney''s
    construction is a special case of constructing stable finite elements; see [12].


    For triangle meshes the resulting strongly defined Laplacian acting on 0-forms
    (functions) is given by


    ```

    \(\mathbb{L} = \mathbb{M}_0^{-1} L,\)

    ```


    where \(\mathbb{M}_0\) is the *mass matrix* given by


    ```

    \((\mathbb{M}_0)_{ij} = \begin{cases} \frac{A_{ij}}{12}, & \text{if } i \sim j,
