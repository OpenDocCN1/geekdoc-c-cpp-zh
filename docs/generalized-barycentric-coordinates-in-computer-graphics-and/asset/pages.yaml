  md: '# 5.2.3 The spectrum


    One cannot speak about the Laplacian without discussing its spectrum. On a compact
    orientable manifold without a boundary, it follows from the inequality


    $$(\Delta u, u)_0 = (du, du)_1 \ge 0$$


    that the spectrum is nonnegative and that the only functions in the kernel of
    the Laplacian are constant functions. Thus zero is a trivial eigenvalue of the
    Laplacian with a one-dimensional space of eigenfunctions. The next (non-trivial)
    eigenvalue \(\lambda_1 > 0\) is much more interesting. By the min-max principle,
    this eigenvalue satisfies


    $$

    \lambda_1 = \min_{(u,1)_0=0} \frac{(du, du)_1}{(u, u)_0},

    $$


    where one takes the minimum over all functions that are \(L^2\)-orthogonal to
    the constants. Higher eigenvalues can be obtained by successively applying the
    min-max principle to the orthogonal complements of the eigenspaces of lower eigenvalues.


    The first non-trivial eigenvalue already tells a great deal about the geometry
    of the underlying Riemannian manifold. As an example, consider Cheeger''s isoperimetric
    constant


    $$

    \lambda_C = \inf_N \left\{ \frac{\text{vol}_{n-1}(N)}{\min(\text{vol}_n(M_1),
    \text{vol}_n(M_2))} \right\},

    $$


    where \(N\) runs over all compact codimension-1 submanifolds that partition \(M\)
    into two disjoint open sets \(M_1\) and \(M_2\) with \(N = \partial M_1 = \partial
    M_2\). Intuitively, the optimal \(N\) for which \(\lambda_C\) is attained partitions
    \(M\) into two sets that have maximal volume and minimal perimeter. As an example,
    suppose that \(M\) has the shape of the surface of a smooth dumbbell. Then \(N\)
    is a curve going around the axis of the dumbbell at the location where the dumbbell
    is thinnest.


    A relation of Cheeger''s constant to the first non-trivial eigenvalue of the Laplacian
    is provided by the Cheeger inequalities


    $$

    \frac{\lambda_C^2}{4} \le \lambda_1 \le c(K\lambda_C + \lambda_C^2),

    $$


    where the constant \(c\) only depends on dimension and \(K \ge 0\) provides a
    lower bound on the Ricci curvature of \(M\) in the sense that \(\text{Ric}(M,g)
    \ge -K^2(n-1)\); see [79, 89]. Recall that for surfaces, Ricci curvature and Gauß
    curvature coincide. The first non-trivial eigenvalue of the Laplacian is thus
    related to the metric problem of minimal cuts—thus providing a relation between
    an analytical quantity (the first eigenvalue) and a purely geometric quantity
    (the Cheeger constant). Intuitively, if \(\lambda_1\) is small, then \(M\) must
    have a small bottleneck; vice-versa, if \(\lambda_1\) is large, then \(M\) is
    somewhat thick.


    Equipped with the full set of eigenfunctions \(\{\varphi_i\}\) of the Laplace-Beltrami
    operator, one can perform Fourier analysis on manifolds by decomposing any square-integrable
    function \(u\) into its modes,


    $$

    u = \sum_i (u, \varphi_i)_0 \varphi_i,

    $$'
