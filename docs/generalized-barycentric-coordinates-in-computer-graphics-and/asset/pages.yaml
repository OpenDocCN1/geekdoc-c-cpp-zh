    $$x''(t) = \sum_{i=1}^n \phi_i(x(t), t)\psi''_i(t),$$

    ```


    which is a first-order differential equation in $x(t)$ of the form


    ```

    $$x''(t) = F(t, x(t)).$$

    ```


    with initial condition $x(0) = x^0$.


    If the barycentric coordinates $\phi_i$ are Lipschitz-continuous, then $F$ is
    Lipschitz-continuous, too, which is a sufficient condition for the existence of
    a local unique solution, according to the Picard-Lindelöf Theorem [250, 308].
    The solution of the differential equation is also a global solution, since $x(t)$
    stays inside all intermediate polygons. This is the case because the mapping is
    bijective and edges are mapped to edges.


    In order to show that $g^{-1} = f$, we consider, for any point $x^t = x(1) \in
