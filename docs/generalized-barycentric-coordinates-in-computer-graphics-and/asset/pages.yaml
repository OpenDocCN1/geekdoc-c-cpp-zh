    # 4.3.1 Limit of composite barycentric mappings


    The idea of uniform composite barycentric mappings leads to the interesting question
    of the behavior in the limit. To this end, we consider the *infinite composite
    barycentric mapping* $f_\infty = \lim_{m \to \infty} f_{r_m}$ and its backward
    mapping $g_\infty : \Omega'' \to \Omega^0$. Figure 4.10 shows the result of mapping
    a star with a uniform composite mapping $f_{r_m}$ composed with its backward mapping
    $g_{r_m} : \Omega^1 \to \Omega^0$ with the same number of steps. Computing the
    maximum distance $\|x - g_{r_m}(f_{r_m}(x))\|$ for one million random points $x
    \in \Omega^0$ indicates that this distance converges to zero and so $g_{r_m} =
    f_{r_m}^{-1}$ as $m \to \infty$. Consequently, the inverse of an infinite barycentric
    mapping is likely to be a infinite barycentric mapping itself, which is not the
    case for standard barycentric mappings.


    This observation can be proven by considering the difference between two successive
    steps and taking its limit [145]. For any point $x^0 \in \Omega^0$ we evaluate
    the first step $f_0$ of the composite mapping $f$,


    ```

    $$x^{t_1} = f_0(x^0) = \sum_{i=1}^n \phi_i^{t_0}(x^0) \psi_i(t_1).$$

    ```


    Because of the linear reproduction property,


    ```

    $$x^0 = \sum_{i=1}^n \alpha_i^0 \phi_i^{t_0}(x^0) \psi_i(t_0),$$

    ```


    ![](img/4913dd83a2a14bc205a0a92cce102c82_90_0.png)


    Figure 4.10 Composing the mapping $f_{r_m}$ and the backward mapping $g_{r_m}$
    converges to the identity as the number of uniform steps $m$ increases.'
