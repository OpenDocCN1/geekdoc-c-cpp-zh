- pgno: 15
  md: '# Preface


    Interpolating given discrete data with continuous functions in one or more variables
    is a fundamental problem in diverse fields of sciences and engineering. Barycentric
    coordinates, which were introduced by Möbius [282] in 1827, still provide perhaps
    the most convenient way to linearly interpolate data prescribed at the vertices
    of a d-dimensional simplex. Barycentric interpolation is widely used in computer
    graphics, whereas such interpolating (basis) functions are also adopted as trial
    and test approximations in finite element and boundary element methods. Starting
    with the seminal work published by Wachspress [407] in 1975, the ideas of barycentric
    coordinates and barycentric interpolation have been extended in recent years to
    arbitrary polygons in the plane and general polytopes in higher dimensions, which
    in turn has led to novel solutions in applications like mesh parametrization,
    image warping, mesh deformation, and finite element and boundary element methods.
    This book summarizes the latest developments and applications of generalized barycentric
    coordinates in computer graphics and computational mechanics.


    The advent of mean value coordinates [144] in 2003 was a turning point in the
    sustained interest and further development of generalized barycentric coordinates.
    This construction generated renewed attention to Wachspress coordinates, and led
    to many new pathways in geometry (polygonal mesh) processing and polygonal finite
    element computations. Realizing this trend, we co-organized (together with Gautam
    Dasgupta and Eitan Grinspun) a workshop in 2012 that was supported by the U.S.
    National Science Foundation, on Barycentric Coordinates in Geometry Processing
    and Finite/Boundary Element Methods, which was held at Columbia University in
    New York. There was broad participation at the workshop from both communities
    to foster synergy between the two fields. This book is envisioned as the second
    step in the partnership of researchers from computer graphics and computational
    mechanics. We are hopeful that the contents of this book will be beneficial to
    both the uninitiated undergraduate or graduate student as well as the experienced
    researcher who is well-versed in generalized barycentric coordinates.


    This book is divided into three sections: Section I (Chapters 1–5) is on the theoretical
    foundations of generalized barycentric coordinates; and Sections II (Chapters
    6–10) and III (Chapters 11–15) are on its applications in computer graphics and
    computational mechanics, respectively. There exist many distinct constructions
    for generalized barycentric coordinates; an overview with comparisons and contrasts
    of known generalized barycentric coordinates is presented in Chapter 1.


    * A revised and extended version of this book [406] was published in 2016.'
  merge: -1
  img_proc: true
- pgno: 16
  md: 'The mathematical theory of simplicial finite elements is well-established;
    however, for polygons in 2D and polyhedra in 3D, the relationship between the
    shape of the polytope and the interpolation properties on them are not yet fully
    understood. Theoretical interpolation estimates for these coordinates, with supportive
    numerical experiments, are presented in Chapter 2. Besides interpolation within
    polygonal domains, realizing continuous linearly precise interpolants over smooth
    domains— with so-called transfinite barycentric coordinates (Chapter 3)—is also
    of broad interest. In many computer graphics applications, bijective mappings
    between simple polytopes are needed, and one route to achieve this is through
    composite bijective mappings, which are discussed in Chapter 4. The smooth and
    discrete Laplacian on manifolds has a rich history in mathematical theory and
    numerical computations. The preservation of the properties of the continuous operator
    on discrete grids is desirable, which forms the foundation for many numerical
    discretizations that are based on discrete exterior calculus and mimetic schemes.
    A primer on the Laplacian is provided in Chapter 5.


    Applications of generalized barycentric coordinates in computer graphics and geometry
    processing are covered in Section II. One of the fundamental concepts in computer
    graphics for enhancing the visual quality of a rendered triangle mesh is texture
    mapping. This requires us to first compute a suitable mesh parameterization of
    the 3D mesh over a 2D domain, which can be done efficiently using generalized
    barycentric coordinates (Chapter 6). Complex barycentric coordinates naturally
    arise from the identification of R^2 with the complex plane C and provide a convenient
    framework for deforming planar shapes and images intuitively by enclosing the
    region of interest with a polygonal cage and moving the cage vertices (Chapter
    7). An alternative approach to shape deformation is given by S-patches (Chapter
    8), which generalize the idea of parametric Bézier surfaces from triangular and
    quadrilateral to arbitrary polygonal domains and can be extended to arbitrary
    dimensions. Generalized barycentric coordinates further play a key role in the
    representation of primal-dual triangulations, with applications in mesh optimization
    and finite element methods (Chapter 9), and in the computational design and analysis
    of self-supporting masonry structures (Chapter 10).


    New and emerging polyhedral formulations and their applications to second- and
    fourth-order elliptic partial differential equations (PDEs) are emphasized in
    Section III. In solid mechanics, use of polyhedral finite element formulation
    is appealing for pervasive fracture and fragmentation simulations (Chapter 11)
    and to realize extremely large deformations in numerical simulations (Chapter
    12). For such applications, simulations on polyhedral meshes can outperform existing
    tetrahedral finite element simulation capabilities. For scattered sets of points
    in R^d, there exist meshfree generalized barycentric coordinates known as maximum-entropy
    coordinates. The essentials on their construction with applications in solid mechanics
    and biomechanical simulations are presented in Chapter 13. In recent years, new
    computational methods on polygonal and polyhedral meshes have been developed that
    do not require the explicit computation of the basis functions in the interior
    of the polytope: among these, a boundary element method that uses PDE-aware (Trefftz-based)
    basis functions (Chapter 14) and the virtual element method (Chapter 15),'
  merge: -1
  img_proc: true
- pgno: 17
  md: 'which provides a variational foundation for mimetic finite-difference schemes,
    are prominent.


    A few words on the notation adopted in this book. To ensure uniformity and to
    facilitate understanding, we use common notation for the most frequently used
    concepts related to generalized barycentric coordinates that appear in computer
    graphics and computational mechanics. Throughout the book, \(\Omega\) is a general
    bounded domain in \(\mathbb{R}^d\), with \(\partial\Omega\) its boundary and \(\overline{\Omega}\)
    its closure. When \(\Omega\) is specifically a bounded polytope in \(\mathbb{R}^d\),
    we use \(P\) for the open set, and the vertices of \(P\) are \(\boldsymbol{v}_1,
    \dots, \boldsymbol{v}_n\). A generic point in \(P\) is denoted by \(\boldsymbol{x}\),
    and the \(i\)-th generalized barycentric coordinate is \(\phi_i: P \to \mathbb{R}\).
    In general, we follow the convention of using boldface for vector quantities,
    to distinguish them from scalar quantities; for example, \(\boldsymbol{x} = (x_1,
    \dots, x_d) \in \mathbb{R}^d\).


    Our thanks go to Rick Adams at CRC Press for initiating this book project and
    to Jessica Vega and Marcus Fontaine at CRC Press for their assistance during various
    stages of the publishing process. Most importantly, we are very grateful to all
    contributors, for their time and effort in preparing the chapters with diligence
    and in a timely manner. Their contributions have shaped this book.


    Kai Hormann

    Lugano, Switzerland


    N. Sukumar

    Davis, CA, USA'
