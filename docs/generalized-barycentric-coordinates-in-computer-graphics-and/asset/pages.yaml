- pgno: 24
  md: 'BARYCENTRIC COORDINATES are commonly used in computer graphics and computational
    mechanics to represent a point inside a simplex as an affine combination of the
    simplex'' vertices. We show how they can be generalized to arbitrary polytopes
    and present the most known constructions of these generalized barycentric coordinates
    in 2D and 3D.


    # 1.1 INTRODUCTION


    It was known since the days of the *Peripatetic School* and usually attributed
    to *Archimedes* (c.287 BC-c. 212 BC) [116] that a lever \((v_1, v_2)\) with two
    weights \(w_1\) and \(w_2\) attached to its ends is balanced when a fulcrum is
    placed at the point \(x \in [v_1, v_2]\) such that


    ```

    \(w_1 l_1 = w_2 l_2,\) (1.1)

    ```


    where \(l_1 = x - v_1\) and \(l_2 = v_2 - x\) (see Figure 1.1). Equation (1.1)
    is called the *law of the lever* and the point of balance \(x\) is called the
    *center of mass* of this lever or its *barycenter* (from Ancient Greek \(\beta\alpha\rho\upsilon\varsigma\)
    = "weight" and \(\kappa\acute{\epsilon}\nu\tau\rho\omicron\nu\) = "center"). The
    weights \(w_1\) and \(w_2\) are often called *homogeneous*, because multiplying
    them with a common non-zero scalar \(\alpha\) does not change the equation. Rearranging
    terms, (1.1) can be written in the form


    ```

    \(w_1(v_1 - x) + w_2(v_2 - x) = 0\) (1.2)

    ```


    and further as


    ```

    \(w_1 v_1 + w_2 v_2 = Wx, \quad W = w_1 + w_2.\)

    ```


    Choosing the scalar \(\alpha = \frac{1}{W}\), we can define the normalized weights
    \(\phi_1 = \alpha w_1\) and \(\phi_2 = \alpha w_2\) and write the barycenter \(x\)
    as an affine combination of the ends of the lever with these weights,


    ```

    \(\phi_1 + \phi_2 = 1,\) (1.3)

    ```


    ```

    \(\phi_1 v_1 + \phi_2 v_2 = x.\) (1.4)

    ```


    The normalized weights \(\phi_1\) and \(\phi_2\) are called the *barycentric coordinates*
    of the point \(x\) with respect to the segment \([v_1, v_2]\).


    While the problem above is about finding the barycenter \(x\) for the given weights,
    it is also interesting to study the opposite problem. Given the end points \(v_1\)
    and \(v_2\)


    ![](img/4913dd83a2a14bc205a0a92cce102c82_24_0.png)


    Figure 1.1 Law of the lever.'
  merge: -1
  img_proc: true
- pgno: 25
  md: 'of an arbitrary segment and some point $x$ along this segment, how do we find
    the barycentric coordinates $\phi_1$ and $\phi_2$ of $x$ with respect to this
    segment? It turns out that they are uniquely determined by (1.3) and (1.4) as
    ratios of lengths,


    ```

    \(\phi_1 = \frac{l_2}{l}, \quad \phi_2 = \frac{l_1}{l},\)

    ```


    where $l = l_1 + l_2 = v_2 - v_1$ is the length of the segment.


    # 1.1.1 Barycentric coordinates for simplices


    In 1827, the German mathematician August Ferdinand Möbius (1790–1868) [282] considered
    the problem of finding barycentric coordinates with respect to an arbitrary $d$-simplex
    in $d \in \mathbb{N}$ dimensions. For example, a 1-simplex is a line segment in
    1D, a 2-simplex is a triangle in 2D, and a 3-simplex is a tetrahedron in 3D.


    Given a non-degenerate $d$-simplex $\Delta$ with $d+1$ vertices $\boldsymbol{v}_1,
    \dots, \boldsymbol{v}_{d+1} \in \mathbb{R}^d$, we search for $d+1$ functions $\boldsymbol{\phi}
    = [\phi_1, \dots, \phi_{d+1}] : \Delta \to \mathbb{R}^{d+1}$, which satisfy the
    *partition of unity property*


    ```

    \(\sum_{i=1}^{d+1} \phi_i(\boldsymbol{x}) = 1 \quad \forall \boldsymbol{x} \in
    \Delta \quad (1.5)\)

    ```


    and the *linear reproduction property*


    ```

    \(\sum_{i=1}^{d+1} \phi_i(\boldsymbol{x})\boldsymbol{v}_i = \boldsymbol{x} \quad
    \forall \boldsymbol{x} \in \Delta. \quad (1.6)\)

    ```


    The functions $\phi_1, \dots, \phi_{d+1}$ are called *barycentric coordinates*
    with respect to $\Delta$. Analogously to the one-dimensional case in the previous
    section, it turns out that these barycentric coordinates are uniquely determined
    by (1.5) and (1.6), and Möbius shows that they are ratios of volumes,


    ```

    \(\phi_i(\boldsymbol{x}) = \frac{V_i(\boldsymbol{x})}{V}, \quad i = 1, \dots,
    d+1, \quad (1.7)\)

    ```


    where $V_i(\boldsymbol{x}) = \text{Vol}[\boldsymbol{v}_1, \dots, \boldsymbol{v}_{i-1},
    \boldsymbol{x}, \boldsymbol{v}_{i+1}, \dots, \boldsymbol{v}_{d+1}]$ are the volumes
    of the corresponding $d$-simplices and $V = V_1(\boldsymbol{x}) + \cdots + V_{d+1}(\boldsymbol{x})
    = \text{Vol}[\boldsymbol{v}_1, \dots, \boldsymbol{v}_{d+1}]$ is the volume of
    $\Delta$ and does not depend on $\boldsymbol{x}$.


    # 1.1.2 Generalized barycentric coordinates


    To the best of our knowledge, Kalman [221] was the first to propose a generalization
    of barycentric coordinates to convex polyhedra, and in recent years there has
    been a growing interest in the problem of finding barycentric coordinates with
    respect to arbitrary polytopes. Throughout this book, we consider a non-degenerate
    polytope $P$ with $n \ge d+1$ vertices $\boldsymbol{v}_1, \dots, \boldsymbol{v}_n
    \in \mathbb{R}^d$, which is viewed as an open set. We denote the boundary of this
    polytope by $\partial P$ and its closure by $\bar{P}$.'
