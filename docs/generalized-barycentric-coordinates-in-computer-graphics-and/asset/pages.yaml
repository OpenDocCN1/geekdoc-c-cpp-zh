- pgno: 198
  md: 'a property of the geometry of the top view. Notice that (10.2) are precisely
    those defining homogeneous weights of generalized barycentric coordinates (1.11)
    satisfying linear precision [149] for $\bar{\mathbf{v}}_i$ with respect to the
    polygon $P$ that is composed of $\bar{\mathbf{v}}_i$''s one-ring. The extra symmetry
    condition $w_{ij} = w_{ji}$ on weights in overlapping one-rings reflects the fact
    that forces exerted by both ends of a beam must be equal and opposite (Newton''s
    third law). Vertical equilibrium then requires that barycentric interpolation
    of the one-ring''s vertical heights differ from $z_i$ by an amount $F_i/W$ depending
    on the load at vertex $i$.


    A polygonal complex $G^*$ in the plane is called a *reciprocal (dual) diagram*
    of the top view $G$ if it is a dual complex of $G$, and every edge of $G^*$ is
    orthogonal to its dual edge on $G$ (see Figure 10.3).¹ Reciprocal diagrams and
    their relationship to static equilibrium have been studied extensively, starting
    with James Maxwell [270], who observed the following fact.


    **Theorem 10.1.** *Given a top view* $\bar{G}$*, edge weights* $w_{ij}$ *exist
    satisfying horizontal equilibrium* (10.2) *if* $\bar{G}$ *possesses a reciprocal
    diagram, and only if every simply connected subcomplex of* $\bar{G}$ *possesses
    a reciprocal diagram.*


    Indeed, observe that if weights exist satisfying (10.2), the edges surrounding
    a vertex $\bar{\mathbf{v}}_i$ can be scaled by $w_{ij}$ and rotated by ninety
    degrees to form a dual face (sometimes called the *force polygon*) on the reciprocal
    diagram, and similarly, given a dual face, edge weights can be computed by taking
    edge length ratios.


    For simplicity of exposition, in what follows we assume that a global reciprocal
    diagram can always be constructed from edge weights; the fact that the reciprocal
    diagram can only be pieced together locally when $\bar{G}$ has higher genus is
    not important in practice.


    Finally, notice that the compression-only constraint $w_{ij} \ge 0$ has a natural
    geometric analogue on the reciprocal diagram: none of the dual edges in $G^*$
    may be inverted.


    # 10.2 SMOOTH THEORY


    Before we continue analyzing the stability of thrust networks, we take a detour
    to study the properties of the *continuum limit* of a surface-like masonry structure
    made of infinitesimally small blocks, so that the geometry of the masonry structure
    can be represented as a smooth surface $M$ embedded in $\mathbb{R}^3$. In this
    setting, external load magnitude (we again assume loads are only vertical) is
    represented by a scalar density function $F : M \to \mathbb{R}$ on the surface,
    and static equilibrium of $M$ under these loads can be characterized using the
    classical theory of elasticity [178]. To simplify the analysis we will assume
    that $M$ has no overhangs, that is, it is a graph over the plane, though such
    overhangs do occur in some practical masonry structures (such as the oculus in
    the dome of the Pantheon).'
