  md: '![](img/4913dd83a2a14bc205a0a92cce102c82_207_0.png)


    Figure 10.7. Left: The initial, unstable thrust network $M$ and its top view.
    Middle: Several iterations of alternating optimizations bring the network to equilibrium.
    Right: The Airy stress surface $S$ certifying stability. Since $M$ is not simply
    connected, $S$ exists only locally; it was cut to reduce its genus for visualization.


    +   1. Begin iteration $k = 0$ with a guess $M_k = M$ for the stable thrust network.

    +   2. Estimate the loads $\boldsymbol{F}_i$ on the vertices of $M_k$.

    +   3. Fix $M_k$ and solve for weights $w_{ij}$ that minimize the force residuals;
    see (10.9).

    +   4. Fix $w_{ij}$ and improve the positions of the vertices $M_k$ to yield a
    new thrust network $M_{k+1}$ closer to equilibrium.

    +   5. Repeat from Step 1 until convergence.


    Recomputing the loads at every iteration is required since the load typically
    depends on the surface areas of the faces of $M_k$, which change in every iteration.
    In Step 4, the new thrust network $M_{k+1}$ can be computed from $M_k$ by solving
    a least squares problem with one objective term penalizing the force residual,
    and a second penalizing displacements of the vertices of $M_{k+1}$ away from their
    positions in $M_k$; Vouga et al. suggest penalizing motion in the direction normal
    to $M_k$ more severely than tangential sliding, since only the former affects
    the aesthetics of the final masonry structure.


    The above algorithm, though simple and effective in practice (see Figure 10.7),
    has several limitations. First, it is not guaranteed to terminate; although both
    Steps 3 and 4 are guaranteed to strictly decrease the force residual, Step 2 can
    increase it. In practice, termination is not issue when reasonable boundary conditions
    and loads are imposed. Second, the optimization modifies $M$ by displacing its
    vertices, but does not consider improving equilibrium by remeshing $M$ or performing
    other combinatorial edits. Third, the algorithm does not consider changing the
    boundary conditions (for instance, adding a supported pillar at the interior of
    an unstable region of the network) even though such operations are quite natural
    to human architects. Finally, the constrained optimization in Step 3 can be a
    performance bottleneck and a source of numerical instability: many solutions might
    exist to (10.9), some of which could have edge weights with extremely large or
    extremely small magnitudes.'
