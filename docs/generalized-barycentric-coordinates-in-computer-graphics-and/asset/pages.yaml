  md: '# **Definition 15.3.** The degrees of freedom of a function \( v \in V_P^k,
    k \ge 1 \), illustrated in Figure 15.2, are:


    +   - the value of \( v \) at the vertices of \( P \);

    +   - for \( k > 1 \),

    +     - the moments of \( v \) up to order \( k-2 \) on each edge \( e \in \mathcal{E}_P
    \):

    +     - the moments of \( v \) up to order \( k-2 \) inside the element \( P \):


    ```

    \frac{1}{|e|} \int_e v m_\alpha dS \quad \forall m_\alpha \in \mathcal{M}_{k-2}(e);
    (15.8)

    ```


    ```

    \frac{1}{|P|} \int_P v m_\alpha dS \quad \forall m_\alpha \in \mathcal{M}_{k-2}(P).
    (15.9)

    ```


    where \(\mathcal{M}_k(P)\) and \(\mathcal{M}_k(e)\) are the sets of scaled monomials
    of degree \( k \), forming a basis of \(\mathbb{P}_k(P)\) and \(\mathbb{P}_k(e)\),
    respectively, and defined such that


    ```

    \mathcal{M}_k(P) = \bigcup_{\ell \le k} \mathcal{M}_k^\ell(P), \text{ with } \mathcal{M}_k^\ell(P)
    := \left\{ \left( \frac{\boldsymbol{x} - \boldsymbol{x}_P}{h_P} \right)^{\boldsymbol{s}},
    |\boldsymbol{s}| = \ell \right\},

    ```


    where \(\boldsymbol{s} = (s_1, s_2)\) is a 2-index with the usual notation \(|\boldsymbol{s}|
    = s_1 + s_2\) and \(\boldsymbol{x}^{\boldsymbol{s}} = x_1^{s_1} x_2^{s_2}\). The
    scaled monomials \(\mathcal{M}_k(e)\) are similarly defined on scaling back to
    the previous definition to one spatial dimension.


    The basis with respect to these degrees of freedom will be denoted by


    ```

    \boldsymbol{\phi} = \left\{ \{ \phi_{v,i}^v \}_{i=1}^n, \{ \phi_{e,\alpha}^e \}_{\alpha=1}^{k-1}
    \text{ for each } e \in \mathcal{E}_P, \{ \phi_{P,\alpha}^P \}_{\alpha=1}^{N_P}
    \right\},

    ```


    associated with the vertex, edge, and internal degrees of freedom, respectively.
    While the vertex basis functions coincide with those of the natural basis in the
    lowest order case \( k=1 \), this will not be true for \( k > 1 \) since these
    basis functions may no longer be linear on each edge.


    This choice of degrees of freedom is particularly useful because it allows us
    to compute several different projections of functions in \( V_P^k \) onto the
    polynomial subspace \(\mathbb{P}_k(P)\) directly from the degrees of freedom of
    the function, requiring knowledge only of the polynomial subspace. These projectors
    are crucial for the method presented in Section 15.3.


    For instance, we can compute the \( H^1(P)\)-orthogonal projector \(\Pi_k^\nabla
    : V_P^k \to \mathbb{P}_k(P)\), defined for \( v \in V_P^k \) to be such that


    ```

    \begin{cases} \int (v - \Pi_k^\nabla v), \nabla p = 0 & \forall p \in \mathbb{P}_k(P),
    \\ \int_{\partial P} v - \Pi_k^\nabla v \, dS = 0 \end{cases}

    ```


    where \((\cdot, \cdot)_P\) denotes the \( L^2(P) \) inner product. Integrating
    by parts, this can be rewritten as


    ```

    (\nabla \Pi_k^\nabla v, \nabla p)_P = \int_{\partial P} \boldsymbol{vn} \cdot
    \nabla p \, dS - (v, \Delta p)_P,

    ```'
