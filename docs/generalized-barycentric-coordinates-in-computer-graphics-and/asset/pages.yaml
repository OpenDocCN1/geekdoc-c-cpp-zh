  md: 'The importance of this relation is that it measures equilibrium purely in terms
    of the geometry of two height fields z and s; we will see that this relationship
    can be directly ported to the discrete setting, where these two surfaces become
    piecewise-affine meshes. And the discretization reconnects with the reciprocal
    diagrams of Maxwell and Gaudi.


    # 10.3 DISCRETE THEORY


    We now turn to the vertical discrete equilibrium equation (10.3). This equation
    takes the very familiar form of a discrete Laplace–Beltrami operator; we can rewrite
    it as


    -F_i/A_i = \frac{1}{A_i^*} \sum_{j \sim i} w_{ij}(z_j - z_i) = (L_w z)_i, \quad
    (10.7)


    where A_i is the dual Voronoi area* of v_i (the area of the region in the plane
    nearer to v_i than to any other vertex of G) and L_w denotes the discrete Laplace-Beltrami
    operator with w_ij taking the place of the usual cotangent weights (see Section
    1.2.2). Horizontal equilibrium with L_w v = 0 corresponds to the linear precision
    property (see Section 1.1.2); together with the compression-only constraint w_ij
    \ge 0, horizontal equilibrium guarantees that this so-called stress Laplacian
    L_w is a perfect discrete Laplace-Beltrami operator, in the sense of satisfying
    the four properties discussed in Section 5.3.7, as originally investigated by
    Wardetzky et al. [410]. We thus have yet another characterization of equilibrium:
    a thrust network is in equilibrium under loads F_i if and only if there exists
    a perfect Laplace-Beltrami operator L_w on G, such that the heights satisfy the
    Poisson equation (10.7) (with Neumann boundary conditions at the free boundaries,
    and Dirichlet at the anchored boundaries). The right-hand side F_i/A_i can be
    interpreted as a load density (with respect to area on the top view) that will
    be applied to the masonry structure.


    # 10.3.1 Thrust network analysis


    Philippe Block, in his seminal work on Thrust Network Analysis [52, 54], exploited
    the above observations to formulate an algorithm for designing equilibrium thrust
    networks. The form-finding proceeds in four steps:


    +   1. First, a top view \(\bar{G}\) is constructed in the silhouette of the desired
    form.

    +   2. Next, a reciprocal diagram is found for \(\bar{G}\). For regular quadrilateral
    grids, this can be done in a marching fashion. As discussed below, a reciprocal
    diagram is rarely unique, and later work [53, 273] explored the large space of
    possible diagrams to increase design flexibility.

    +   3. Edge weights w_ij are extracted from the reciprocal diagram.'
