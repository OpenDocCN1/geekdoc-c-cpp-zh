  md: '# 12.8 APPLICATION TO THE STUDY OF FILLED ELASTOMERS


    Experiments have demonstrated that typical filled elastomers contain stiff "interphases"
    or layers of stiff "bound rubber" around their inclusions [236]. The presence
    of such interphasial regions can significantly affect the macroscopic response
    of the filled elastomer when the fillers are submicron in size [175, 260]. In
    this section, the nonlinear elastic response of an incompressible elastomer reinforced
    with a random, isotropic distribution of circular rigid particles, bounded through
    finite-size interphases, is studied by means of polygonal finite elements. We
    aim at demonstrating the ability of polygonal finite elements to model the complex
    behavior of nonlinear elastic materials with extremely large localized deformations.
    Throughout this section, we consider each particle to be infinitely rigid and
    model them with the variational formulation proposed by Chi et al. [98]. This
    variational formulation treats the presence of each particle as a set of kinematic
    constraints on the displacement DOFs.


    We approximate the truly random and isotropic distribution of particles by the
    periodic repetition of a unit cell in the e1 and e2 directions. The unit cell
    contains a total of 50 monodisperse rigid particles at an area fraction of cp
    = 25%. Each particle is bounded to the matrix by an interphase that is ten times
    stiffer than the matrix and whose thickness is assumed to be 20% of the radius
    of the particle, resulting in a total area fraction of cI = 11%. The mixed F-formulation
    is employed in this example and polygonal meshes with both linear and quadratic
    mixed elements are considered as shown in Figure 12.11(c) and (d). For comparison
    purposes, a finite element mesh with the commonly used 6-node hybrid quadratic
    triangular elements (termed CPE6MH) is included, as depicted in Figure 12.11(b).
    In order to make a fair comparison, all the meshes are generated such that they
    have a similar number of nodes in the matrix phase.


    In the following study, we consider periodic boundary conditions [100, 260] for
    two loading conditions: (i) pure shear with average deformation gradient <F> =
    lambda e1 (circle) + lambda^-1 e2 (circle) and (ii) simple shear with <F> = I
    + gamma e1 (circle) e2 where lambda >= 1 and gamma >= 0 denote the applied stretch
    and amount of shear, respectively. We remark that the periodicity in the pressure
    field cannot in general be enforced when employing mixed finite elements. At any
    rate, even when we use the T-H mixed elements where the pressure field is continuous,
    as shown in [100], the enforcement of periodic pressure boundary conditions only
    exerts a negligible influence on the solution. Moreover, the discontinuities of
    shear moduli between the matrix, interphase, and inclusions generate a discontinuous
    pressure field, which, in general, cannot be captured by mixed elements with continuous
    approximations for the pressure field, i.e., T-H elements. However, [100] has
    shown that using T-H elements (with minor levels of discontinuities (e.g., mu_i
    = 10 mu_m) between the matrix and interphase) can still produce sufficiently accurate
    solutions, provided that the stiff inclusions are treated independently using
    the rigid-body constraint formulation by Chi et al. [98].'
