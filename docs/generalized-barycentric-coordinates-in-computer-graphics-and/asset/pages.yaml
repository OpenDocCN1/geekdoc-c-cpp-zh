    A curious fact concerning the connection between discrete Laplacian and the underlying
    geometry is *Rippa’s theorem* [326]: The Delaunay triangulation of a fixed point
    set in $\mathbb{R}^n$ minimizes the Dirichlet energy of any piecewise linear function
