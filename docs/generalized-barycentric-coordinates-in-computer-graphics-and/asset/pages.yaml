- pgno: 212
  md: '# 10.5.1 Sensitivity analysis of masonry structures


    In the above we assumed that the loads are known (either prescribed, or specified
    as a function of the surface area of the masonry structure). We know multiple
    characterizations of when the structure is stable under these known loads. However,
    will the structure remain standing if the loads change (as can easily happen during,
    for instance, a snowstorm, wind storm, or earthquake)? Can bounds be proven guaranteeing
    that the structure remains standing, if the loads do not change by more than some
    tolerance? How must the structure be modified to improve its resilience to additional
    loads?


    The main challenge to addressing changes in load is that there is no simple relationship
    between the loads and the internal forces (or the \(w_{ij}\)), thanks to static
    indeterminacy. Instead, if the structure can bear additional load, it usually
    can do so in infinitely many ways. A more complete understanding of the space
    of possible stresses that can bear a given load, and how that space changes as
    the loads change, remains elusive.


    # 10.5.2 Progressive stable structures


    The analysis presented in this chapter only applies to complete masonry structures.
    Of course, these must still be built one brick at a time, and the stability of
    the final structure does not in any way speak to the stability of the structure
    in a partial state (consider that an arch is unstable up until the keystone is
    placed). When can a masonry structure be built progressively, so that at every
    point the structure is stable? Can a design be modified to eliminate, or at least
    mitigate, the need for scaffolding or formwork? Some work in a similar vein [121]
    has looked at supporting blocks from above using chains attached to fixed vertical
    anchors, and where to place the anchors to minimize the number of chains that
    must be added or removed.'
