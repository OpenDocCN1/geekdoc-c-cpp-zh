    # 5.3.7 Discrete versus smooth Laplacians


    Structural properties of discrete Laplacians play an important role for computations;
    for example, when solving the Poisson problem


    ```

    \(\mathbb{L}u = f\)

    ```


    for a given right-hand side \(f\) and an unknown function \(u\) with Dirichlet
    boundary conditions. For solving this problem, one often prefers to work with
    the weak formulation of the problem (\(Lu = M_0 f\)) instead of the strong one
    (\(Lu = f\)) since the weakly defined cousins of strongly defined Laplacians satisfy
    properties (Sym) and (PSP), which allows for efficient linear solvers for this
    problem.


    We now turn to the question of which properties are desirable for discrete Laplacians
    on top of (Sym) and (PSD) and if it is furthermore possible to recover *all* properties
    of smooth Laplacians in the discrete case. We follow [410], on which this section
    is largely based.


    Smooth Laplacians are differential operators that act *locally*. Locality can
    be represented in the discrete case by working with (weakly) defined discrete
    Laplacians based on edge weights:


    > (Loc) vertices \(i\) and \(j\) do not share an edge \(\Rightarrow \omega_{ij}
    = 0\).


    This property reflects locality of action by ensuring that if vertices \(i\) and
    \(j\) are not connected by an edge, then changing the function value \(u_j\) at
    a vertex \(j\) does not alter the value \((Lu)_i\) at vertex \(i\). Property (Loc)
    results in sparse matrices, which can be treated efficiently in computations.


