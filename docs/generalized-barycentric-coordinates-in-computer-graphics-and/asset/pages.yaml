    Soft organic materials are of great engineering interest, but challenging to model
    with standard finite elements. The challenges arise primarily because their non-linear
    elastic response is characterized by non-convex stored-energy functions, they
    are incompressible or nearly incompressible, and oftentimes possess complex microstructures.
    Recently, polygonal finite elements have been found to possess several advantages
    over standard finite elements when studying the mechanics of such materials under
    finite deformations. This chapter summarizes a new approach, using polygonal and
    polyhedral elements in nonlinear elasticity problems involving extremely large
    and heterogeneous deformations. We present both displacement-based and two-field
    mixed variational principles for finite elasticity, together with the corresponding
    lower- and higher-order polygonal and polyhedral finite element approximations.
    We also utilize a gradient correction scheme that adds minimal perturbations to
    the gradient field at the element level in order to restore polynomial consistency
    and recover (expected) optimal convergence rates when the weak form integrals
    are evaluated using quadrature rules. With the gradient correction scheme, optimal
    convergence of the numerical solutions for displacement-based and mixed formulations
    with both lower- and higher-order displacement interpolants is confirmed by numerical
    studies of several boundary-value problems in finite elasticity. For demonstration
    purposes, we deploy the proposed polygonal discretization to study the nonlinear
    elastic response of rubber filled with random distributions of rigid particles
    considering interphalangeal effects. These physically motivated examples illustrate
    the potential of polygonal finite elements to simulate the nonlinear elastic response
    of soft organic materials with complex microstructures under finite deformations.


    # 12.1 INTRODUCTION


    Many organic materials are characterized by their ability to undergo large reversible
    deformations in response to a variety of stimuli, including mechanical forces,
    electric and magnetic fields, and temperature changes. While they have long been
    utilized in numerous engineering applications, modern advances in material science
    have demonstrated that soft organic materials, such as electro- and magneto-active
    elastomers, gels, and shape-memory polymers, hold tremendous potential to enable
    new technologies, and in particular, the new generation of sensors and actuators.
    From a mechanical perspective, although most of these materials can be approximated
    “simply” as nonlinear elastic, they more often than not contain highly hetero-'
  merge: -1
  img_proc: true
- pgno: 235
  md: 'neous, complex microstructures. The heterogeneity of the microstructures makes
    the underlying local deformations inherently complex.


    Computational microscopic studies of nonlinear elastic materials, especially those
    with complex microstructures, help in gaining a quantitative understanding of
    the complex behavior of these materials. These studies are also essential in guiding
    the optimization of nonlinear elastic materials, so that they can enable new technological
    applications. It has long been recognized that standard finite elements, especially
    simplicial (triangular and tetrahedral) finite elements, are inadequate in simulating
    processes involving realistic, large deformations—an example is shown in Figure
    12.1. By contrast, recent studies have demonstrated that polygonal elements possess
    significant potential in the study of nonlinear elastic materials under finite
    deformations. First, these elements are well-suited to model complex microstructures
    (e.g., particulate microstructures and microstructures involving different length
    scales) and to seamlessly incorporate periodic boundary conditions. Secondly,
    polygonal elements are found to be more tolerant to large localized deformations
    and to produce more accurate results in bending and shear than standard finite
    elements. With mixed formulations, lower-order mixed polygonal elements are also
    shown to be numerically stable on Voronoi-type meshes without the need for any
    additional stabilization terms. Likewise, numerical stability of the polygonal
    finite elements is also demonstrated in topology optimization [160, 389, 392]
    and in fluid mechanics [394] problems.


    One major challenge in the polygonal finite method is accurate numerical integration
    of the weak-form integrals. The finite element space for polygonal elements contains
    non-polynomial (e.g., rational) functions, and therefore, the use of existing
    quadrature schemes, typically designed for integration of polynomial functions,
    leads to non-vanishing consistency errors [268, 388] and consequently, sub-optimal
    or even non-convergent finite element solutions under mesh refinement. In practice,
    using a sufficiently large number of integration points can lower the consistency
    error for linear polygonal elements in two dimensions. A triangulation scheme
    with three integration points per triangle is shown to be sufficiently accurate
    for practical problems and mesh sizes [99, 388]. However, for higher-order polygonal
    elements, the number of integration points for such a scheme can become prohibitively
    large [100]. This is also the case for polyhedral elements in three dimensions
    [268, 393]. In practical applications, as the number of elements increases, the
    associated computational cost for a polygonal discretization can become exorbitant.


