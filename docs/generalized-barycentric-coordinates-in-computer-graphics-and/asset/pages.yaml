  md: '# 12.3 POLYGONAL AND POLYHEDRAL APPROXIMATIONS


    This section discusses the displacement and pressure spaces for the polygonal
    and polyhedral finite element approximations. In 2D, we present the constructions
    of conforming finite-dimensional displacement and pressure spaces, for both linear
    and quadratic polygonal finite elements. In 3D, we present the construction of
    linear displacement finite element space on convex polyhedra.


    # 12.3.1 Displacement space on polygons in 2D


    Let us begin in the 2D setting and consider a general polygon P with n edges and
    vertices, v1, ..., vn, in the undeformed configuration. We use generalized barycentric
    coordinates as the basis for a linear polygonal finite element space on P, denoted
    by V1(P), with degrees of freedom associated with the vertices of P.


    Quite a few barycentric coordinates can be found in the literature [15, 34, 149,
    193, 215, 265, 275, 372] (see Chapter 1 for details), among which the mean value
    coordinates [144] are adopted in this chapter. The mean value coordinates, denoted
    by phi_1^(1), ..., phi_n^(1), can be constructed on arbitrary polygons. Contour
    plots of the mean value coordinates defined on non-convex polygons are shown in
    Figure 12.2(a).


    A second-order space on P, denoted as V2(P), can be constructed using pairwise
    products of the generalized barycentric coordinates [380]. V2(P) is a 2n-dimensional
    space having the degrees of freedom at each vertex of P, as well as at the mid-point
    of each edge. Its interpolants phi_i^(2) ... phi_2n^(2) are expressed as:


    ```

    \phi_i^{(1)}(\boldsymbol{x}) = \sum_{j=1}^n \sum_{l=1}^n c_{jl}^i \phi_j^{(1)}(\boldsymbol{x})
    \phi_l^{(1)}(\boldsymbol{x}),

    ```


    where \phi_j^{(1)} are the mean value coordinates. The coefficients c_{jl}^i are
    computed such


    ![](img/4913dd83a2a14bc205a0a92cce102c82_239_0.png)


    Figure 12.2 (a) Contour plot of a mean value basis \phi_i^{(1)} over a concave
    polygon. (b) Contour plot of quadratic basis \phi_i^{(2)} over a concave polygon
    associated with a vertex. (c) Contour plot of quadratic basis \phi_i^{(2)} over
    a concave polygon associated with a mid-side node. See color insert.'
