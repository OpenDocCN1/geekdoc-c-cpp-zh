  md: '![](img/4913dd83a2a14bc205a0a92cce102c82_82_0.png)


    Figure 3.8 Notation used to define the generalized mean value potential induced
    by the edge \([v_i, v_{i+1}]\).


    The potential \(\Phi_p(\boldsymbol{x})\) for the edge \([\boldsymbol{v}_i, \boldsymbol{v}_{i+1}]\)
    is then given by


    ```

    \(\Phi_p(\boldsymbol{x}) = \int_0^\alpha \frac{d\theta}{\rho(\theta)^p} = \frac{1}{(r_i
    r_{i+1} \sin \alpha)^p} \int_0^\alpha (r_i \sin \theta + r_{i+1} \sin(\alpha -
    \theta))^p d\theta.\)

    ```


    For a given value of \(p\) the integral can be computed symbolically. In particular,
    when \(p\) is odd, it can be expressed as a polynomial of degree \(p\) of the
    variable \(t = \tan(\alpha/2)\). The first expressions for \(p = 1, 3\) are given
    by


    ```

    \(\Phi_1(\boldsymbol{x}) = \left( \frac{1}{r_i} + \frac{1}{r_{i+1}} \right) t,
    \quad \Phi_3(\boldsymbol{x}) = \frac{1}{3} \left( \frac{1}{r_i^3} + \frac{1}{r_{i+1}^3}
    \right) t + \frac{1}{6} \left( \frac{1}{r_i} + \frac{1}{r_{i+1}} \right)^3 t(1+t^2).\)

    ```


    The expression for \(\Phi_1(\boldsymbol{x})\) corresponds to the expression for
    the mean value weight in [144, 200]. For even \(p\), the resulting expressions
    are no longer simple anymore, except for the case \(p = 0\), which corresponds
    to the angle \(\alpha\). The interested reader can find further details in [40].


    In the 3D case we need to compute the contribution of the potential induced by
    a triangle \([\boldsymbol{v}_i, \boldsymbol{v}_j, \boldsymbol{v}_k]\) at \(\boldsymbol{x}\).
    The case \(p = 0\) corresponds to the solid angle at which the triangle \([\boldsymbol{v}_i,
    \boldsymbol{v}_j, \boldsymbol{v}_k]\) is seen from \(\boldsymbol{x}\). The case
    \(p = 1\) corresponds to the mean value weight for which an expression is given
    in [217]. For other values of \(p\), a closed form expression for the potential
    \(\Phi_p(\boldsymbol{x})\) induced by one triangle can be obtained as a particular
    case of the expressions for singular potential integrals derived in [85].'
