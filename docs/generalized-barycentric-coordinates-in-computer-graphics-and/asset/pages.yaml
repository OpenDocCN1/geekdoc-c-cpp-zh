  md: 'I N THIS CHAPTER we study properties of transfinite barycentric interpolation
    schemes, which can be considered as continuous counterparts of generalized barycentric
    coordinates and are currently a subject of intensive research due to their fascinating
    mathematical properties and numerous applications in computational mechanics [170,
    344], computer graphics [247, 248], and geometric modeling [93, 145, 227, 413]
    (see also references therein).


    We start from a general construction of transfinite barycentric coordinates, which
    is obtained as a simple and natural generalization of Floater’s mean value coordinates
    [144, 217], and investigate the properties of the continuous analogues of three-point
    coordinates [149]. We discuss the Gordon-Wixom interpolation approach [171] and
    consider its generalizations and modifications [37, 38]. Finally we introduce
    generalized mean value potentials and demonstrate how they can be used for distance
    function approximation purposes [40].


    # 3.1 INTRODUCTION


    While traditional generalized barycentric coordinates interpolate function values
    given at the vertices of a polygon or polyhedron, transfinite barycentric interpolation
    is based on smooth domains. Transfinite barycentric interpolation schemes establish
    bridges between barycentric coordinates and methods used to interpolate continuous
    data [38, 77, 93, 133, 151, 153, 171]. In addition, studying continuous versions
    of generalized barycentric coordinates helps us to achieve a better understanding
    of their discrete counterparts [37, 93, 248, 346, 413].


    Similar to the discrete case (see Section 1.1.2), let us consider a convex domain
    $\Omega$ in $\mathbb{R}^d$ and a smooth function $\phi(x, y)$, $x \in \Omega$
    and $y \in \partial \Omega$, satisfying the two properties


    Partition of unity: $\int_{\partial \Omega} \phi(x, y) \, ds_y = 1, \quad (3.1)$

    Linear precision: $\int_{\partial \Omega} y \, \phi(x, y) \, ds_y = x, \quad (3.2)$


