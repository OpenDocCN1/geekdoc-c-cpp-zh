  md: '# 12.5.2 Gradient correction for vectorial problems


    The gradient correction scheme defined in the preceding subsection for scalar
    problems can be readily extended to vectorial problems. For a vector field $\mathbf{v}
    = [v_x, v_y]^T$ (or $\mathbf{v} = [v_x, v_y, v_z]^T$ in 3D) $\in [\mathcal{V}_k(P)]^d$,
    the gradient correction scheme takes the form


    $\nabla_{P,k} \otimes \mathbf{v} = \begin{bmatrix} (\nabla_{P,k} v_x)^T \ (\nabla_{P,k}
    v_y)^T \end{bmatrix} \text{ in 2D}, \quad \nabla_{P,k} \otimes \mathbf{v} = \begin{bmatrix}
    (\nabla_{P,k} v_x)^T \ (\nabla_{P,k} v_y)^T \ (\nabla_{P,k} v_z)^T \end{bmatrix}
    \text{ in 3D}.$


    Similar to the scalar case, the corrected gradient satisfies the discrete divergence
    theorem,


    $\int_P \mathbf{p} : \nabla_{P,k} \otimes \mathbf{v} \, d\mathbf{x} = \int_{\partial
    P} (\mathbf{p} \cdot \mathbf{n}) \cdot \mathbf{v} \, ds - \oint_P \mathbf{v} \cdot
    (\nabla \cdot \mathbf{p}) \, d\mathbf{x} \quad \forall \mathbf{p} \in [\mathcal{P}_{k-1}(P)]^{d
    \times d},$


    and, moreover, for any sufficiently smooth second-order tensorial field $\boldsymbol{\psi}$,
    the element-level consistency error satisfies


    $\oint_P \boldsymbol{\psi} : \nabla_{P,k} \otimes \mathbf{v} \, d\mathbf{x} -
    \int_P \boldsymbol{\psi} : \nabla \mathbf{v} \, d\mathbf{x} = O(h_P^k) \|\nabla
    \mathbf{v}\|_{L^2(P)^{d \times d}}.$


    In the computational implementation of 2D problems, let us assume the set of basis
    functions $\{\boldsymbol{\phi}_1^{(k)}, \dots, \boldsymbol{\phi}_{2n\mathcal{V}}^{(k)}\}$
    of $[\mathcal{V}_k(P)]^2$ are of the form


    $\boldsymbol{\phi}_{2i-1} = [\phi_i^{(k)}, 0]^T, \quad \boldsymbol{\phi}_{2i}
    = [0, \phi_i^{(k)}]^T$


    for $i=1, \dots, n\mathcal{V}$, and where $n\mathcal{V}$ is the dimension of the
    space $\mathcal{V}_k(P)$. The correction scheme for vectorial problems in practice
    amounts to correcting each basis function as follows:


    $\nabla_{P,k} \otimes \boldsymbol{\phi}_{2i-1}^{(k)} = \begin{bmatrix} (\nabla_{P,k}
    \phi_i^{(k)})^T \ \mathbf{0} \end{bmatrix}, \quad \nabla_{P,k} \otimes \boldsymbol{\phi}_{2i}^{(k)}
    = \begin{bmatrix} \mathbf{0} \ (\nabla_{P,k} \phi_i^{(k)})^T \end{bmatrix}$


    for $i=1, \dots, n\mathcal{V}$, and where $\nabla_{P,k} \boldsymbol{\phi}_i^{(k)}$
    is the computed corrected gradient of the shape function according to the procedure
    outlined for the scalar problem.


    Similarly, let us assume the set of basis functions for $\{\boldsymbol{\phi}_1^{(k)},
    \dots, \boldsymbol{\phi}_{3n\mathcal{V}}^{(k)}\}$ of the 3D space $[\mathcal{V}_k(P)]^3$
    are of the form


    $\boldsymbol{\phi}_{3i-2}^{(k)} = [\phi_i^{(k)}, 0, 0]^T, \quad \boldsymbol{\phi}_{3i-1}^{(k)}
    = [0, \phi_i^{(k)}, 0]^T, \quad \text{and} \quad \boldsymbol{\phi}_{3i}^{(k)}
    = [0, 0, \phi_i^{(k)}]^T$


    for $i=1, \dots, n\mathcal{V}$. The gradient correction scheme for 3D vectorial
    problems corrects each basis function as


    $\nabla_{P,k} \otimes \boldsymbol{\phi}_{3i-2}^{(k)} = \begin{bmatrix} (\nabla_{P,k}
    \phi_i^{(k)})^T \ \mathbf{0} \ \mathbf{0} \end{bmatrix}, \quad \nabla_{P,k} \otimes
    \boldsymbol{\phi}_{3i-1}^{(k)} = \begin{bmatrix} \mathbf{0} \ (\nabla_{P,k} \phi_i^{(k)})^T
    \ \mathbf{0} \end{bmatrix}, \quad \nabla_{P,k} \otimes \boldsymbol{\phi}_{3i}^{(k)}
    = \begin{bmatrix} \mathbf{0} \ \mathbf{0} \ (\nabla_{P,k} \phi_i^{(k)})^T \end{bmatrix}
    \quad (i=1, \dots, n\mathcal{V}).$'
