  md: 'Mimicking harmonic interpolation thus leads to the modification of the Gordon–Wixom
    scheme (3.18)


    ```

    u(\boldsymbol{x}) = \int_0^{2\pi} \left[ \left( \frac{u(\boldsymbol{y}_1)}{\rho_1}
    + \frac{u(\boldsymbol{y}_2)}{\rho_2} \right) \bigg/ \left[ \frac{1}{\rho_1} +
    \frac{1}{\rho_2} \right] \right] \frac{d\theta}{\rho_1 \rho_2} \bigg/ \int_0^{2\pi}
    \frac{d\theta}{\rho_1 \rho_2}, \quad (3.22)

    ```


    which was obtained in [38]. In some sense, (3.22) resembles the transfinite mean
    value interpolation scheme (3.4).


    The modified Gordon-Wixom interpolation scheme (3.22) is also pseudo-harmonic.
    Indeed, if \(\Omega\) is a circle, then \(\rho_{1,2}\) in (3.22) does not depend
    on the integration variable \(\theta\) and (3.22) reduces to (3.18), which is
    pseudo-harmonic. The modified Gordon-Wixom scheme also has linear precision.


    Both (3.18) and (3.22) can be considered as particular cases of weighted mean
    value transfinite interpolation (3.7). Indeed, both can be rewritten as


    ```

    u(\boldsymbol{x}) = \int_0^{2\pi} \left[ \left( \frac{u(\boldsymbol{y}_1)}{\rho_1}
    + \frac{u(\boldsymbol{y}_2)}{\rho_2} \right) \bigg/ \left[ \frac{1}{\rho_1} +
    \frac{1}{\rho_2} \right] \right] \bar{\omega}(\boldsymbol{x}, \theta) d\theta
    \bigg/ \int_0^{2\pi} \bar{\omega}(\boldsymbol{x}, \theta) d\theta, \quad (3.23)

    ```


    where the weighting functions \(\bar{\omega}(\boldsymbol{x}, \theta)\) in (3.23)
    and \(\omega(\boldsymbol{x}, \theta)\) in (3.7) are related by


    ```

    \bar{\omega}(\boldsymbol{x}, \theta) = (1/\rho_1 + 1/\rho_2)\omega(\boldsymbol{x},
    \theta).

    ```


    Setting \(\bar{\omega}(\boldsymbol{x}, \theta) = (1/\rho_1 + 1/\rho_2)\) in (3.23)
    corresponds to the transfinite mean value interpolation scheme (3.4), choosing
    \(\bar{\omega}(\boldsymbol{x}, \theta) = 1\) yields the Gordon–Wixom scheme (3.18),
    and \(\bar{\omega}(\boldsymbol{x}, \theta) = 1/(\rho_1 \rho_2)\) gives the modified
    Gordon-Wixom scheme (3.22).


    In practice (3.22) demonstrates a higher quality of interpolation compared with
    (3.18). In our numerical experiments (3.18) and (3.22) are evaluated using the
    composite trapezoidal rule (typically 100 equispaced directions are used). For
    non-convex domains, the ray \((\boldsymbol{x}, \boldsymbol{y})\) defined by the
    unit vector \(\boldsymbol{e}_\theta\) can intersect the boundary at more than
    one point. For the two opposite directions \(\boldsymbol{e}_\theta\) and \(-\boldsymbol{e}_\theta\)
    we consider the intersections \(\boldsymbol{y}_1\) and \(\boldsymbol{y}_2\) that
    are closest to \(\boldsymbol{x}\), respectively. Figure 3.6 compares the approximations
    obtained with the Gordon-Wixom scheme (3.18) and its modification (3.22) for a
    harmonic function \(x^3 - 3xy^2\) in a geometrically complex domain. The absolute
    errors between the given function and its interpolations is used to illustrate
    the advantages of (3.22) over (3.18).


    # 3.3.2 Hermite-type Gordon–Wixom interpolation


    Gordon and Wixom extended their scheme in [171] to handle Hermite-type interpolation.
    Replacing linear interpolation with cubic interpolation of \((u(\boldsymbol{y}_1),
    u''(\boldsymbol{y}_1))\) and \((u(\boldsymbol{y}_2), u''(\boldsymbol{y}_2))\)
    gives


    ```

    u(\boldsymbol{x}, \theta) = \frac{(3\rho_1 + \rho_2)\rho_2^2}{(\rho_1 + \rho_2)^3}
    u(\boldsymbol{y}_1) + \frac{(\rho_1 + 3\rho_2)\rho_1^2}{(\rho_1 + \rho_2)^3} u(\boldsymbol{y}_2)
    - \frac{\rho_1 \rho_2^2}{(\rho_1 + \rho_2)^2} \frac{\partial u}{\partial \boldsymbol{e}_\theta}(\boldsymbol{y}_1)
    + \frac{\rho_1^2 \rho_2}{(\rho_1 + \rho_2)^2} \frac{\partial u}{\partial \boldsymbol{e}_\theta}(\boldsymbol{y}_2).
    \quad (3.24)

    ```'
