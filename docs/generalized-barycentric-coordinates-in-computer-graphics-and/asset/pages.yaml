    ```

    \( B_j^{m+1}(x) = \frac{m+1-j}{m+1} \phi_0(x) B_j^m(x) = \frac{m+1}{j} \phi_1(x)
    B_{j-1}^m(x). \)

    ```


    Therefore, we can elevate the degree of a Bézier curve by simply multiplying a
    degree \( m \) Bézier curve by \( (\phi_0(x) + \phi_1(x)) \), so that


    ```

    \( F(x) = \left( \sum_{j=0}^m B_j^m(x) f_j \right) (\phi_0(x) + \phi_1(x)) \\

