    # 1.2.6 Poisson coordinates


    Taking inspiration from the derivation of mean value coordinates, Li et al. [247]
    derive Poisson coordinates from the Poisson integral formula for a harmonic function
    \( u: P \rightarrow \mathbb{R} \), which states that for any disc \( B = B(r)
    \subset P \) of radius \( r > 0 \), centered at the origin, with boundary \( \partial
    B \) and any point \( \boldsymbol{x} \in B \),


    ```

    \( u(\boldsymbol{x}) = \frac{1}{2\pi r} \int_{y \in \partial B} \frac{r^2 - \|\boldsymbol{x}\|^2}{\|\boldsymbol{x}
    - \boldsymbol{y}\|^2} u(\boldsymbol{y}) d\boldsymbol{y}.\) (1.15)

    ```


    Poisson coordinates extend mean value coordinates, because the circumferential
    mean value theorem (1.13) is a special case of (1.15) when \( \boldsymbol{x} \)
    is at the center of \( B \). They are well-defined for any simple polygon \( P
    \) and possess the same properties as mean value coordinates. Moreover, following
    a specific construction, Poisson coordinates are proved to be pseudo-harmonic,
    that is, they reproduce harmonic functions on \( n \)-dimensional balls (see [94]
    for more details on pseudo-harmonic coordinates). The closed-form expressions
    of the Poisson weights \( w_i \) are rather lengthy and can be found in [247,
    Section 4.1].


    # 1.2.7 Gordon–Wixom coordinates


    Consider a line \( L \) through \( \boldsymbol{x} \in P \) along some direction
    at a given angle \( \theta \) with respect to a fixed axis, which intersects \(
    \partial P \) at the points \( \boldsymbol{y}_1, \dots, \boldsymbol{y}_m \) (see
    Figure 1.3). Summing over all \( m \) intersections, Belyaev et al. [37, 38] extended
    Gordon–Wixom coordinates [171] from convex to arbitrary simple polygons and show
    that they can be obtained as basis functions from the transfinite interpolant
    (see Chapter 3 for more details)


    ```

    \( f(\boldsymbol{x}) = \frac{1}{2\pi} \int_0^{2\pi} \left( \sum_{i=1}^m \frac{\varepsilon_i
    f(\boldsymbol{y}_i)}{\rho_i} \right) / \left( \sum_{i=1}^m \frac{\varepsilon_i}{\rho_i}
    \right) d\theta,\) (1.16)

    ```'
