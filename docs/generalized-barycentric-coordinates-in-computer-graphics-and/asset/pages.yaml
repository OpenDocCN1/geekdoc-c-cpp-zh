- pgno: 26
  md: '# **Definition 1.1.** Given the polytope $P$, the $n$ functions $\phi = [\phi_1,
    \dots, \phi_n]: \bar{P} \to \mathbb{R}^n$ are called *generalized barycentric
    coordinates* if they satisfy the *partition of unity property*


    ```

    \(\sum_{i=1}^n \phi_i(\boldsymbol{x}) = 1 \quad \forall \boldsymbol{x} \in \bar{P}\)
    (1.8)

    ```


    and the *linear reproduction property*


    ```

    \(\sum_{i=1}^n \phi_i(\boldsymbol{x})\boldsymbol{v}_i = \boldsymbol{x} \quad \forall
    \boldsymbol{x} \in \bar{P}.\) (1.9)

    ```


    For \(n = d + 1\), the only functions that satisfy the properties in Definition
    1.1 are the \(\phi_i\) in (1.7). For \(n > d + 1\), however, the \(\phi_i\) are
    no longer uniquely determined, which is the reason for the existence of the different
    constructions of generalized barycentric coordinates that we review in the remainder
    of this chapter.


    In addition to the defining properties (1.8) and (1.9), it is often desirable
    for the functions \(\phi_i\) to have a few extra properties,


    +   - *Non-negativity*: \(\phi_i(\boldsymbol{x}) \ge 0\) for any \(\boldsymbol{x}
    \in \bar{P}\); (1.10a)

    +   - *Lagrange property*: \(\phi_i(\boldsymbol{v}_j) = \delta_{ij}\), where \(\delta_{ij}\)
    is the Kronecker delta; (1.10b)

    +   - *Linearity on the boundary*: \(\phi_i\) is linear on each facet of \(P\);
    (1.10c)

    +   - *Smoothness*: \(\phi_i \in C^\infty\). (1.10d)


    We remark that all these properties are satisfied in the case \(n = d + 1\) for
    the linear functions \(\phi_i\) in (1.7).


    In general, there are two types of generalized barycentric coordinates. On the
    one hand, there are coordinates with a closed form. Analogously to (1.2), the
    closed-form definition is often based on certain *weight functions* \(\boldsymbol{w}
    = [w_1, \dots, w_n]: P \to \mathbb{R}^n\), which satisfy


    ```

    \(\sum_{i=1}^n w_i(\boldsymbol{x})(\boldsymbol{v}_i - \boldsymbol{x}) = \boldsymbol{0}
    \quad \forall \boldsymbol{x} \in P.\) (1.11)

    ```


    These weight functions are also called *homogeneous coordinates*, because normalizing
    them gives the generalized barycentric coordinates


    ```

    \(\phi_i(\boldsymbol{x}) = \frac{w_i(\boldsymbol{x})}{W(\boldsymbol{x})}, \quad
    W(\boldsymbol{x}) = \sum_{j=1}^n w_j(\boldsymbol{x}), \quad i = 1, \dots, n.\)
    (1.12)

    ```


    On the other hand, there are computational coordinates that can only be obtained
    numerically, for example, by solving an optimization problem.


    # 1.2 2D COORDINATES


    We first focus on the 2D case and consider a simple polygon \(P\). Without loss
    of generality, we assume the vertices \(\boldsymbol{v}_i\) of this polygon to
    be given in a counter-clockwise direction and we treat the vertex indices cyclically,
    that is, \(\boldsymbol{v}_{i+k_n} = \boldsymbol{v}_i\)'
