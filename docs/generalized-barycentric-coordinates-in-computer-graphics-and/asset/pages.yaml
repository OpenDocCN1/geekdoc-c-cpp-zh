- pgno: 307
  md: 'where \(\boldsymbol{n}\) denotes the unit vector normal to \(\partial P\).
    The terms on the right-hand side of the above equation can be expressed through
    the degrees of freedom of \(v\). The first term can be computed exactly because
    \(\boldsymbol{n} \cdot \nabla p\) is a polynomial of degree \(k-1\) on each edge
    of \(P\), while \(\Delta p\) is a polynomial of degree \(k-2\) inside \(P\), so
    the first and the second terms are simply a sum of, respectively, the edge and
    internal degrees of freedom of \(v\). Clearly, however, this projection would
    not be so straightforward to compute using the natural basis of Section 15.2.4.
    Expanding \(\Pi_k^\nabla v\) in the basis of \(\mathbb{P}_k(P)\) and varying \(p\)
    over the basis of \(\mathbb{P}_k(P)\), it is clear that this provides a linear
    system of equations that can be solved for the coefficients of \(\Pi_k^\nabla
    v\).


    Similarly, we can compute the \(L^2(P)\)-orthogonal projection of the gradient
    onto polynomials, defined such that


    ```

    \((\nabla v - \Pi_{k-1}^0 \nabla v, p)_P = 0 \quad \forall p \in (\mathbb{P}_{k-1}(P))^2,\)

    ```


    where \((\mathbb{P}_{k-1}(P))^2\) denotes the space of vector-valued polynomials
    of degree \(k-1\). This projection is computed in a similar way, by integrating
    by parts to find that


    ```

    \((\Pi_{k-1}^0 \nabla v, p)_P = \int_{\partial P} v \boldsymbol{n} \cdot p \,
    dS - (v, \nabla \cdot p)_P,\)

    ```


    and observing that the terms on the right hand are exactly computable as before.


    # 15.2.6 A link between the bases


    We now establish a correspondence between the natural basis \(\boldsymbol{\psi}\)
    of Section 15.2.4 and the virtual basis \(\boldsymbol{\phi}\) of Section 15.2.5.
    To this end, we define a linear transformation that maps the \(\psi\) basis to
    the \(\phi\) basis:


    ```

    \(\phi_{P,\alpha} = \sum_{1 \le \gamma \le N_P} C_{P,\gamma}^{P,\alpha} \psi_{P,\gamma}
    \quad 1 \le \alpha \le N_P,\) (15.10)

    ```


    ```

    \(\phi_{e,\alpha} = \sum_{1 \le \gamma \le N_P} C_{P,\gamma}^{e,\alpha} \psi_{P,\gamma}
    + \sum_{1 \le \epsilon \le k-1, \epsilon \le \gamma \le k-1} C_{\epsilon,\gamma}^{e,\alpha}
    \psi_{\epsilon,\gamma} \quad \forall e \in \mathcal{E}_P, 1 \le \alpha \le k-1,\)
    (15.11)

    ```


    ```

    \(\phi_{v_i} = \sum_{1 \le \gamma \le N_P} C_{P,\gamma}^{v_i} \psi_{P,\gamma}
    + \sum_{1 \le \epsilon \le k-1, \epsilon \le \gamma \le k-1} C_{\epsilon,\gamma}^{v_i}
    \psi_{\epsilon,\gamma} + \psi_{v_i} \quad 1 \le i \le n.\) (15.12)

    ```


    The system (15.10)-(15.12) may then be solved for the "C" coefficients in the
    three consecutive steps explained in the following paragraphs. Note the reverse
    order of this construction: we first solve for the interior basis functions \(\phi_{P,\alpha}\),
    then for the edge basis functions \(\phi_{e,\alpha}\), and finally for the vertex
    basis functions \(\phi_{v_i}\). This derivation can also be seen as an alternative
    constructive proof of the unisolvency of the degrees of freedom of Definition
    15.3.'
