    # 7.4.2 Shape interpolation


    Planar shape interpolation is a classical problem in computer graphics. It is
    important for creating animation sequences and for exploring shape spaces. A naive
    and widely used interpolation approach is to linearly blend the input maps. If
    f^1(z) and f^2(z) are conformal, then f^t(z) = (1-t)f^1(z) + t f^2(z), for t ∈
    [0, 1] is holomorphic but is not, in general, conformal. However, generating conformal
    maps based on the logarithm of the derivative (see Section 7.4.1) also leads to
    a natural way for interpolating two or more conformal maps. The idea is to linearly
    blend the log derivatives rather than the maps themselves, and then to reconstruct
    the map (which is conformal by construction). For brevity, let us consider the
    most common case where we want to blend a given conformal map f with the identity
    map. Since the logarithm of the derivative of the identity map is 0 we have l''(z)
    = t l(z), where l(z) is the log derivative of f(z). Blending l linearly leads
    to natural visually pleasing results, since rotations (the imaginary part of l)
    are blended linearly. Figure 7.8 shows such a result where we computed l using
    the simple technique described in Section 7.4.1. Then we reconstructed the conformal
    map as before and repeated the reconstruction process with 0.5 l(z) as input.'
