  md: 'consistency, using the gradient correction scheme by Talischi et al. [393]
    requires the quadrature schemes that are adopted to respect certain minimal accuracy
    requirements, which are expressed in terms of their polynomial precision. In this
    section, we state these requirements for volumetric and surface quadrature rules
    on a general element $P$ and proceed to introduce the numerical quadrature schemes
    that are used.


    Given a polygonal or polyhedral finite element $P$, we denote by $\oint_P$, the
    evaluation of the volume (area) integral $\int_P$ using quadrature. Similarly,
    we use $\oint_{\partial P}$ to denote the numerical evaluation of surface (line)
    integral $\int_{\partial P}$. Throughout, we shall assume that the order $k$ of
    the finite element space $\mathcal{V}_k(P)$ is fixed.


    In the gradient correction scheme by Talischi et al. [393], the volumetric quadrature
    $\oint_P$ is assumed to be exact when the integrand is a polynomial field of order
    $2k-2$. This means that the quadrature can exactly integrate constant fields when
    $k=1$ and rational fields when $k=2$. This requirement guarantees that the integrals,


    ```

    $$\int_P \boldsymbol{p} \cdot \nabla q \, d\boldsymbol{x}, \quad \int_P q \nabla
    \cdot \boldsymbol{p} \, d\boldsymbol{x},$$

    ```


    are exact when $\boldsymbol{p} \in [\mathcal{P}_{k-1}(P)]^d$ and $q \in \mathcal{P}_k(P)$.
    Additionally, an implicit assumption is made on the volume quadrature rule that
    it is sufficiently rich to eliminate the appearance of spurious elemental zero-energy
    modes that can compromise the stability of the resulting discretization scheme.
    For instance, for $k=1$, a one-point rule consisting of an integration point at
    the centroid of $E$, with the volume $|P|$ being the weight, satisfies the above
    precision requirement, but leads to spurious zero-energy modes.


    On the other hand, the boundary quadrature $\oint_{\partial P}$ is required to
    integrate polynomial fields of order $2k-1$ on each edge/face of the element.
    Therefore, 1-point ($k=1$) and 2-point ($k=2$) quadrature suffices for piecewise
    linear and cubic fields, respectively. This requirement ensures that integrals
    of the form


    ```

    $$\int_{\partial P} q (\boldsymbol{p} \cdot \boldsymbol{n}) ds$$

    ```


