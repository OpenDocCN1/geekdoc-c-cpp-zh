    for all discrete \(k\)-forms \(\alpha\) and all \(k\)-cells \(\sigma\). For details
    we refer to [426]. The Whitney map \(W\) is a chain map—it commutes with the differential
    (\(dW = W\delta\)) and thus factors to cohomology.


