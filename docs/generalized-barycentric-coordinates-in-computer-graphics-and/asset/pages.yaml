    # ## 3.4 GENERALIZED MEAN VALUE POTENTIALS AND DISTANCE FUNCTION APPROXIMATIONS


    In this section we study properties of generalized mean value potentials, which
    are generalizations of the normalization function for the transfinite mean value
    coordinates; that is, the denominator in (3.4). We show that these generalized
    mean value potentials deliver accurate approximations of the distance function
    \(\text{dist}(x, \partial\Omega)\) near \(\partial\Omega\) and can be seen as
    smooth distance functions. Efficient computation of smooth distance functions
    is important for a number of applications, including pattern recognition [435],
    computational mechanics [157], medical imaging [338], and computational fluid
    dynamics [332, 399].


    # ### 3.4.1 Generalized mean value potentials for smooth domains


    Floater et al. [77, 133] observed some remarkable properties of the mean value
    normalization function


    \(\Phi(x) = \int_{S_x} \frac{d\theta}{\|x - y\|},\)


    which is the denominator in (3.4). In particular, for \(\Psi(x) = 1/\Phi(x)\),
    they show that


    \(\Psi(y) = 0 \text{ and } \frac{\partial \Psi(y)}{\partial n_y} = \frac{1}{V_{d-1}}
    \quad \forall y \in \partial\Omega, \quad (3.30)\)


    where \(n_y\) is the outer unit normal for the boundary of \(\Omega \subset \mathbb{R}^d\)
    at \(y \in \partial\Omega\) and \(V_{d-1}\) is the volume of the unit ball in
    \(\mathbb{R}^{d-1}\) (\(V_1 = 2\) and \(V_2 = \pi\)). In view of (3.30), the function
    \(V_{d-1}\Psi(x)\) delivers an accurate approximation of the distance function
    \(\text{dist}(x, \partial\Omega)\) near \(\partial\Omega\).'
