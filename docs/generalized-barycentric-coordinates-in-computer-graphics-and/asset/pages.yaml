- pgno: 185
  md: 'Also, in the definition of a triangulation of \(X\), we do not require _all_
    the points of \(X\) to be used as vertices; a point \(\mathbf{x}_i \in X\) is
    called _hidden_ if it is not used in the triangulation.


    # Dual cell complexes


    Two cell complexes \(K\) and \(K''\) in \(\mathbb{R}^d\) are said to be dual to
    one another if there exists a duality map \(*\) from \(K\) to \(K''\) that associates
    any cell \(\sigma\) in \(K\) of dimension \(i\) (\(0 \le i \le d\)) to a cell
    \(*\sigma\) in \(K''\) of dimension \(d-i\) for all \(0 \le i, j \le d\), \(\sigma_i
    \subset \sigma_j \leftrightarrow *\sigma_j \supset *\sigma_i\).


    # 9.2.1 Some classical examples


    # Power diagrams and weighted Delaunay triangulations


    For a given point \(\mathbf{p} \in \mathbb{R}^d\) and a scalar \(\omega \in \mathbb{R}\),
    the power distance from any point \(\mathbf{x} \in \mathbb{R}^d\) to the so-called
    weighted point \((\mathbf{p}, \omega)\) is defined by an additive modification
    of the Euclidean metric as \(\|\mathbf{x} - \mathbf{p}\|^2 - \omega\) (also called
    _Laguerre distance_).


    In terms of the power distance, the bisector separating any pair of weighted points
    \((\mathbf{p}, \omega_p)\) and \((\mathbf{q}, \omega_q)\) is a hyper-plane with
    points \(\mathbf{x}\) satisfying \(\|\mathbf{x} - \mathbf{p}\|^2 - \omega_p =
    \|\mathbf{x} - \mathbf{q}\|^2 - \omega_q\). Therefore, the difference of weights
    acts as a shift of the bisector towards the smaller weight. This leads to the
    definition of a generalized Voronoi diagram called _power diagram_. Let \((\mathbf{X},
    \boldsymbol{\omega}) = \{(\mathbf{x}_i, \omega_i)\}_{i \in I}\) be a weighted
    point set in \(\mathbb{R}^d\). To each \(\mathbf{x}_i\) we associate its weighted
    Voronoi region


    \(V(\mathbf{x}_i, \omega_i) = \{ \mathbf{x} \in \mathbb{R}^d : \|\mathbf{x} -
    \mathbf{x}_i\|^2 - \omega_i \le \|\mathbf{x} - \mathbf{x}_j\|^2 - \omega_j \forall
    j \}.\)


    Note that drastic differences between weights may induce empty power cells and
    thereby isolate sites with no neighbors. We denote sites associated with zero
    volume cells as hidden sites [20]. Also, when the weights are all equal, the power
    diagram coincides with the Euclidean Voronoi diagram of \(X\). While many other
    generalizations of Voronoi diagrams exist, they do not form straight-edge and
    convex polytopes and are thus not relevant here.


    The dual of the power diagram of \((\mathbf{X}, \boldsymbol{\omega})\) is the
    weighted Delaunay triangulation of \((\mathbf{X}, \boldsymbol{\omega})\). This
    triangulation contains a \(k\)-simplex with vertices \(\mathbf{x}_{i_0}, \mathbf{x}_{i_1},
    \dots, \mathbf{x}_{i_k}\) in \(X\), if and only if \(V(\mathbf{x}_{i_0}, \omega_{i_0})
    \cap \dots \cap V(\mathbf{x}_{i_k}, \omega_{i_k}) \neq \emptyset, \forall k \ge
    0\).


    # Regular triangulations


    Note that for a simply connected domain (that is, the convex hull of \(X \subset
    \mathbb{R}^d\)), the weighted Delaunay triangulation coincides with the so-called
    regular triangulation that is defined as the projection of the lower hull of the
    lifted point set \(F(X)\), for some lifting \(F\) of \(X\) to \(\mathbb{R}^{d+1}\).
    As it is shown in [113], this equivalence is no longer true for domains with non-trivial
    topology.'
