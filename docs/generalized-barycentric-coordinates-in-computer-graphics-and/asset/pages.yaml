  md: 'This property can be used for Hermite interpolation purposes as in [77, 133].
    More generally, the distance function property also plays an important role in
    computer graphics, visualization, and modeling. For example, it is used as a parameter
    for material modeling in [51], for the animation of shapes in [106], and in level-set
    methods [297]. See also [214] and the references therein for further applications
    in computer graphics and visualization.


    It seems natural to consider the $L^p$ generalizations of $\Phi(\boldsymbol{x})$
    and $\Psi(\boldsymbol{x})$. Following [39, 40], let us consider


    \(\Phi_p(\boldsymbol{x}) = \int_{S_n} \frac{d\theta}{\|\boldsymbol{x} - \boldsymbol{y}\|^p}
    \quad \text{and} \quad \Psi_p(\boldsymbol{x}) = 1/\Phi_p(\boldsymbol{x}) \quad
    (3.31)\)


    with \(p > 0\). Below, for the sake of simplicity, we deal with the two-dimensional
    version of (3.31). A similar study of the generalized mean value potential \(\Phi_p(\boldsymbol{x})\)
    in the 3D case can be found in [39].


    In the 2D case, \(\Phi_p(\boldsymbol{x})\) can be written as


    \(\Phi_p(\boldsymbol{x}) = \int_{0}^{2\pi} \frac{d\theta}{\rho(\theta)^p}\)


    where, as before, \(\theta\) is the angle between the vector \(\boldsymbol{y}
    - \boldsymbol{x}\) and a fixed direction and \(\rho(\theta) = \|\boldsymbol{x}
    - \boldsymbol{y}\|\). The generalized mean value potential \(\Phi_p(\boldsymbol{x})\)
    satisfies some interesting properties, including [40, Proposition 3].


    \(\Delta \Phi_p(\boldsymbol{x}) = p(p+2)\Phi_{p+2}(\boldsymbol{x}). \quad (3.32)\)


    It is clear that \(\Phi_p(\boldsymbol{x}) > 0\) and \(\Phi_p(\boldsymbol{x}) \rightarrow
    \infty\) as \(\boldsymbol{x}\) approaches \(\partial \Omega\). Further, (3.32)
    implies that \(\Phi_p(\boldsymbol{x})\) has no local maxima inside \(\Omega\),
    because otherwise \(\Delta \Phi_p > 0\) at a local maximum and (3.32) cannot be
    satisfied. Hence, \(\Psi_p(\boldsymbol{x})\) is positive inside \(\Omega\), vanishes
    on \(\partial \Omega\), and has no local minima inside \(\Omega\). Below we study
    the asymptotic properties of \(\Phi_p(\boldsymbol{x})\) near \(\partial \Omega\)
    (or, equivalently, the asymptotic properties of \(\Psi_p(\boldsymbol{x})\) near
    \(\partial \Omega\)) and show that, after a proper constant rescaling, \(\Psi_p(\boldsymbol{x})\)
    delivers an accurate approximation of \(\text{dist}(\boldsymbol{x}, \partial \Omega)\)
    near \(\partial \Omega\).


    Let \(\boldsymbol{x}\) be near \(\partial \Omega\) and denote by \(h = \text{dist}(\boldsymbol{x},
    \partial \Omega)\) the distance from \(\boldsymbol{x}\) to \(\partial \Omega\).
    We keep following [39] and now show that in the planar case (\(d=2\)) for \(p
    > 1\) we have


    \(\Phi_p(\boldsymbol{x}) = \int_{0}^{2\pi} \frac{d\theta}{\rho(\theta)^p} = \frac{c_p}{h^p}
    + k \frac{c_{p-2}}{2h^{p-2}} + O\left(\frac{1}{h^{p-2}}\right) \quad (3.33)\)


    with


    \(c_p = \int_{-\pi/2}^{\pi/2} \cos^p \theta \, d\theta,\)


    where \(k\) is the curvature of \(\partial \Omega\) at \(\boldsymbol{y} \in \partial
    \Omega\). The case \(p=1\), which corresponds to the mean value normalization
    function, yields


    \(\Phi_1(\boldsymbol{x}) \sim \frac{2}{h} + \frac{k}{2} \ln \frac{1}{h} + O(1)
    \quad \text{as} \quad h \rightarrow 0, \quad (3.34)\)


    which is an extension of one of the main results in [133].'
