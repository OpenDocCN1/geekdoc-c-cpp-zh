  md: '# # Multi-Sided Patches via Barycentric Coordinates


    Scott Schaefer


    Texas A&M University, College Station, USA


    # ## CONTENTS


    +   - 8.1 Introduction ........................ 136

    +     - 8.1.1 Bézier form of curves ............. 136

    +     - 8.1.2 Evaluation ........................ 137

    +     - 8.1.3 Degree elevation .................. 137

    +   - 8.2 Multisided Bézier patches in higher dimensions ... 138

    +     - 8.2.1 Indexing for S-patches ............ 139

    +     - 8.2.2 Evaluation ........................ 141

    +     - 8.2.3 Degree elevation .................. 142

    +   - 8.3 Applications ........................ 143

    +     - 8.3.1 Surface patches ................. 143

    +     - 8.3.2 Spatial deformation ............. 144


    CHAPTER 1 introduced several constructions of barycentric coordinates as well
    as their properties. In this chapter, we explore the deep connection between barycentric
    coordinates and higher order parametric representations of curves, surfaces, and
    volumes in arbitrary dimension. In the case of curves, these curves are known
    as Bézier curves, which are used in applications from font representations to
    controlling animations. The extension to convex surface patches, called S-patches
    [257], is more recent. As originally proposed, S-patches were parametric, multi-sided
    surface patches restricted to convex domains. However, these restrictions were
    more of a function of the limited set of generalized barycentric coordinates,
    namely Wachspress coordinates, available at that time. Today we have generalized
    barycentric coordinate functions that do not require convexity and extend to arbitrary
    dimension. Hence, we will investigate S-patches within their full generality,
    afforded by modern barycentric coordinates with generalized domains and in arbitrary
    dimension.'
