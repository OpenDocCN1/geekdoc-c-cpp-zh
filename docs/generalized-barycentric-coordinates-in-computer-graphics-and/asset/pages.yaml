- pgno: 184
  md: 'its dual (cell) elements. Both types of element are crucial to a variety of
    numerical techniques. A growing trend in numerical simulation is the simultaneous
    use of primal and dual meshes: Petrov-Galerkin finite element/finite volume methods
    [24, 271, 298] and methods based on exterior calculus [65, 119, 176] use the ability
    to store quantities on both primal and dual elements to enforce (co)homological
    relationships, which for instance appear in Hodge theory. The choice of the dual,
    defined by the location of the dual vertices, is however not specified a priori.
    The barycentric dual, for which barycenters are used instead of circumcenters,
    is used for certain finite volume computations, but it fails to satisfy both the
    orthogonality and the convexity conditions on general triangulations. A very common
    dual to a triangulation in R^d is the cell complex that uses the circumcenters
    of each d-simplex as dual vertices. It corresponds to the Voronoi diagram in the
    case of Delaunay triangulations [137, 313]. The circumcentric Delaunay-Voronoi
    duality has been extensively used in diverse fields. Building on a number of results
    in algebraic and computational geometry, a more general primal-dual pair of complexes
    can be defined [274], as we briefly describe in the first sections of this chapter.
    A barycentric representation of primal-dual triangulations is then presented as
    a parameterization of this space of generalized triangulations.


    Classical methods, such as *centroidal Voronoi tessellations* [127], lead to "good"
    simply connected domain dual elements, while *optimal Delaunay triangulations*
    [9] optimize the shape of primal elements. Nowadays, recent numerical methods
    on meshes can benefit from optimizations over both primal and dual complexes.
    At the end of this chapter, we present a unifying approach to mesh quality [289],
    which is based on the placement of primal *and* orthogonal dual elements with
    respect to each other, for instance, to make orthogonal barycentric duals.


    # 9.2 GENERALIZED PRIMAL-DUAL TRIANGULATIONS


    We start by recalling important notions on this topic. More detailed definitions
    can be found in [289] and [274].


    # Complex and triangulation


    A cell complex in R^d is a set K of convex polyhedra (called cells) satisfying
    two conditions:


    +   1. Every face of a cell in K is also a cell in K.

    +   2. If C and C'' are cells in K, their intersection is either empty or a common
    face of both.


    A simplicial complex is a cell complex whose cells are all simplices.


    For a set of points {x_i}_{i=1,...,|X|} in R^d, a triangulation of X is a simplicial
    complex K for which each vertex of K is in X, and the union of all the cells of
    K is the convex hull of X. Note that the triangulations we consider usually come
    from a point set and hence partition a simply connected domain in R^d (corresponding
    to the convex hull of the point set).'
