    # ## 7.4 CONFORMAL MAPS


    A common mistake is to identify holomorphic functions with planar conformal maps.
    While a planar conformal map can be expressed as a holomorphic function, the converse
    is not always true. A holomorphic function \( f : \Omega \rightarrow \mathbb{C}
    \) is conformal only if its first complex derivative \( f'' \) is nonvanishing
    everywhere in the domain. If \( f \) is holomorphic and \( f''(z_0) = 0 \) for
    a point \( z_0 \in \Omega \), then angles between intersecting curves at \( z_0
    \) are not preserved. Furthermore, the isometric distortion induced by the map
    is infinite at the singular point \( z_0 \), and high in its vicinity. The turning
    number of the image of the boundary curve increases, and the map is not locally
    injective at \( z_0 \). For planar shape deformation, we are mostly interested
    in locally injective maps with low distortion and artifacts like these should
    be avoided.


    # ### 7.4.1 Log derivative construction


    As we saw in the previous sections, generating holomorphic maps is quite simple,
    but unfortunately, conformal maps do not form a linear subspace and are harder
    to control. If \( f \) is Cauchy''s barycentric map represented as \( f(z) = \sum_{i=1}^n
    C_i(z)f_i \), the additional condition \( |f''(z_0)| > 0 \) that guarantees that
    \( f \) is conformal at \( z_0 \) is a non-convex constraint. Non-convex constraints
    pose a great challenge for numerical optimization and cannot be enforced efficiently
    in general. We can address this difficulty by parameterizing the space of conformal
    maps, by using alternative variables. On a simply connected domain \( \Omega \in
    \mathbb{C} \), there is a one-to-one correspondence between the space of conformal
    maps and the space of holomorphic maps [241, 417]. If \( f \) is conformal, it
    is also holomorphic. The derivative of a holomorphic map is holomorphic, meaning
    that if \( f \) is conformal, then \( l(z) = \log(f''(z)) \) is holomorphic. With
    this observation in hand, we represent our conformal map based on the holomorphic
    function \( l \). No special'
