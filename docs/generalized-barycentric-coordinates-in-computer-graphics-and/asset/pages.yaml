    # 11.5 FRAGMENTATION MODELING


    The modeling of failure and fracture of a solid body is one of the major challenges
    in theoretical and computational solid mechanics. The extent of fracturing in
    a solid body is termed pervasive when a number of cracks nucleate, propagate,
    branch, and coalesce. The highly nonlinear, multiscale problem of pervasive fracture
    is challenging to simulate. The simulation of pervasive fracture is further complicated
    by the extensive self-contact that can accompany the generation of new crack surfaces,
    especially during fragmentation.


    Several computational fracture methods strive to model unrestricted fracture growth
    in a continuum using an explicit representation of the fracture surfaces, e.g.,
    explicit meshing [290], extended finite element method [374], and embedded discontinuities
    [213]. However, the goal of unrestricted fracture growth quickly becomes computationally
    infeasible when considering pervasive fracture growth processes in which multiple
    fractures nucleate, branch, and intersect. Figure 11.11 gives three examples of
    unrestricted fracture processes in a continuum. Figure 11.11(a) shows two fractures
    initiating from a surface and approaching each other at an arbitrarily small angle.
    Figure 11.11(b) shows one fracture initiating from a surface with arbitrary branching,
    self-intersection, and initiation away from the surface. Figure 11.11(c) shows
    three fractures initiating from a surface, then intersecting and forming an arbitrarily
    small fragment. In order to enable robust simulations of pervasive fracture processes,
    the allowable fracture paths must be restricted to some degree. This may be thought
    of as regularizing the pervasive fracture problem. One approach to this regularization
    is to a priori discretize the space of all possible fracture paths with constraints
    on minimum fragment size, bifurcation locations, etc.'
