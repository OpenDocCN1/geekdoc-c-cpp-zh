- pgno: 196
  md: '![](img/4913dd83a2a14bc205a0a92cce102c82_196_0.png)


    Figure 10.2 Hanging nets and weights used by Gaudí to design the form of the Sagrada
    Familia church in Barcelona. (Image courtesy of Flickr user ralmonline alm and
    reproduced under the CC-BY-2.0 license; colors have been converted to grayscale
    and white-balanced.)


    Intuitively, the thrust line can be interpreted as a network of infinitesimal
    beams connected by pin joints at the vertices of G, with the weighted length of
    the edges \(w_{ij}/\|v_j - v_i\|\) the magnitude of the compression force within
    each beam. The safe theorem guarantees that if such a beam network exists that
    is in equilibrium under the external loads acting on a masonry structure, and
    the beam network is contained entirely within the volume of the structure, then
    the structure itself is stable. This ability of the safe theorem to reduce the
    problem of determining stability by one dimension has made thrust line analysis
    tremendously valuable as a practical technique for analyzing masonry arches, vaults,
    and domes [190, 203].


    # 10.1.3 Gaudí and hanging nets


    Although analyses of domes and vaults have been performed by considering thrust
    lines in 2D cross-sections, the safe theorem also applies to three-dimensional
    block structures, with (10.1) unchanged, with vertices of G (now a thrust network)
    and load vectors elements of \(\mathbb{R}^3\).


    The thrust network can again be viewed as a network of beams connected by pin
    joints, and under equilibrium when subject to the external load. This analogy
    has been exploited by architects and engineers like Frei Otto, Heinz Isler, and
    Antoni Gaudí, who used hanging chain and membrane models to find architectural
    forms [228]. Gaudí’s masterpiece, the Sagrada Familia, for instance, was designed
    using hanging nets and weights (see Figure 10.2). Notice that the thrust network
    equilibrium equations (10.1) when negated, describe the equilibrium of networks
    of string under tension; the shape of the hanging net, when turned upside down,
    thus yields a masonry structure that is stable by the safe theorem. This observation
    dates back at least as far as Hooke (who published in his famous anagram the observation
    that “as it hangs in a continuous flexible form, so it will stand contiguously
    rigid when inverted,” and who used hanging nets and weights to design the dome
    of St Paul’s Cathedral [210]).'
