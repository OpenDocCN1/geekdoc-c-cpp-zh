    \( J_f(\boldsymbol{x}) = \left| \begin{matrix} 1 + \partial_i\phi_i(\boldsymbol{x})u_{i,1}
    & \partial_j\phi_i(\boldsymbol{x})u_{i,1} \\ \partial_i\phi_i(\boldsymbol{x})u_{i,2}
    & 1 + \partial_2\phi_i(\boldsymbol{x})u_{i,2} \end{matrix} \right| = 1 + \nabla\phi_i(\boldsymbol{x})
    \cdot \boldsymbol{u} . \)

