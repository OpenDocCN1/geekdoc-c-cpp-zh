  md: '# Barycentric Mappings*


    Teseo Schneider


    Università della Svizzera italiana, Lugano, Switzerland


    # CONTENTS


    +   4.1 Introduction .................................... 64

    +   4.1.1 Convex polygons ............................... 64

    +   4.1.2 Arbitrary polygons ............................ 65

    +   4.2 Bijective barycentric mapping ................... 66

    +   4.2.1 Perturbed target polygons ..................... 66

    +   4.3 Bijective composite barycentric mapping ......... 68

    +   4.3.1 Limit of composite barycentric mappings ....... 70

    +   4.4 Extensions ...................................... 71

    +   4.4.1 Closed planar curves .......................... 71

    +   4.4.2 Polyhedra ..................................... 73

    +   4.5 Practical considerations ........................ 75

    +   4.5.1 Choosing the coordinates ...................... 75

    +   4.5.2 Choosing the vertex paths ..................... 75


    BARYCENTRIC MAPPINGS allow us to naturally warp a source polygon to a corresponding
    target polygon, or, more generally, to create mappings between closed curves or
    polyhedra. Unfortunately, bijectivity of such barycentric mappings can only be
    guaranteed for the special case of warping between convex polygons. In fact, for
    any barycentric coordinates, it is always possible to construct a pair of polygons
    such that the barycentric mapping is not bijective. However, if the two polygons
    are sufficiently close, the mapping is close to the identity and hence bijective.
    This fact suggests "splitting" it into several intermediate mappings and creating
    a composite barycentric mapping, which is guaranteed to be bijective between arbitrary
    polygons, polyhedra, or closed planar curves.'
  merge: -1
  img_proc: true
- pgno: 84
  md: '![](img/4913dd83a2a14bc205a0a92cce102c82_84_0.png)


    Figure 4.1 Example of a barycentric mapping based on different barycentric coordinates.
    For the discrete harmonic mapping we only show the image of the interior of \(\Omega^0\).


    # 4.1 INTRODUCTION


    A barycentric mapping between a source polygon \(\Omega^0 \subset \mathbb{R}^2\)
    with \(n \ge 3\) source vertices \(v_i^0, i = 1, \dots, n\), ordered anticlockwise,
    and a target polygon \(\Omega^1 \subset \mathbb{R}^2\) with the same number of
    target vertices \(v_i^1\), is a mapping


    \(f: \Omega^0 \to \Omega^1, \quad f(x) = \sum_{i=1}^n \phi_i(x) v_i^1, \quad (4.1)\)


    where the functions \(\phi_i: \Omega^0 \to \mathbb{R}, i = 1, \dots, n\) are barycentric
    coordinates with respect to \(\Omega^0\) (see Chapter 1). Since \(f\) depends
    on the particular choice of coordinates, we denote the mapping \(f\) with the
    name of the coordinate generating it. For instance, a Wachspress mapping is a
    barycentric mapping based on Wachspress coordinates.


    Because of the Lagrange property (1.10b), it is clear that \(f(v_i^0) = v_i^1\).
    Moreover, if a point \(x = (1 - \mu) v_i^0 + \mu v_{i+1}^0\) lies on the edge
    \([v_i^0, v_{i+1}^0]\), the only non-zero coordinates are \(\phi_i(x) = 1 - \mu\)
    and \(\phi_{i+1}(x) = \mu\), hence the mapping is \(f(x) = (1 - \mu) v_i^1 + \mu
    v_{i+1}^1\), which means that it is linear along the edges, too. Finally, the
    mapping \(f\) is always surjective, because the coordinates \(\phi_i\) are continuous,
    which implies that \(f\) is continuous on \(\Omega^0\), and edges are mapped to
    edges.


    Figure 4.1 shows an example of a barycentric mapping for different coordinates.
    We see that the mapping is linear along the edges, regardless of the choice of
    coordinates, and that it is not bijective; that is, the grid folds over in concave
    regions.


    # 4.1.1 Convex polygons


    Barycentric mappings between convex polygons are guaranteed to be bijective only
    for the special case of Wachspress mappings [152]. Figure 4.2 shows an extreme
    example of a barycentric mapping between two convex polygons. In the close-up
    we'
