  md: '# Weighted circumcenters


    For any simplex \(\sigma\) of the weighted Delaunay triangulation, let \(\mathbf{c}(\sigma)\)
    denote the *weighted circumcenter* of \(\sigma\), that is, the unique intersection
    of (the mutually orthogonal affine spaces supporting) the primal simplex \(\sigma^k\)
    and its weighted dual \(*\sigma^k\). The positions of weighted circumcenters can
    be computed explicitly from the positions of vertices and the weights of the corresponding
    simplex [289, Equation 7].


    Of particular importance are the weighted circumcenters of the \(d\)-simplices
    for a mesh \(\mathcal{T}\) in \(\mathbb{R}^d\); these form the vertices of its
    dual complex \(\mathcal{D}\). Any point in the affine space supporting a \(d\)-simplex
    \(\sigma\) can be the weighted circumcenter of \(\sigma\) for a choice of weights
    on the corresponding vertices. As we will see, this can be seen as a parameterization
    of the space of dual complexes.


    # Computation


    Algorithms to construct power diagrams make use of the same strategies as in the
    case of Voronoi diagrams, where the Euclidean distances are replaced by power
    distances. Therefore, the worst time complexity to generate a power diagram with
    \(n\) weighted points is \(O(n \log n)\) in \(\mathbb{R}^2\) and \(O(n^{\lceil
    \frac{d}{2} \rceil})\) in \(\mathbb{R}^d\). Efficient implementations of these
    algorithms, such as in the CGAL library [86], have reported that the complexity
    bound is typically reached in cases of coplanar sites, while the general case
    performs close to linear in the number of sites.


    # 9.2.2 Primal-dual triangulations (PDT)


    # Compatible dual complexes of triangulations


    We now show that the notion of mesh duality can be extended, so that the dual
    complex is defined geometrically and independently from the triangulation—while
    the combinatorial compatibility between the triangulation and its dual is maintained.


    **Definition 9.1** (Simple cell complex). A cell complex \(K\) in \(\mathbb{R}^d\)
    is called *simple* if every vertex of \(K\) is incident to \(d+1\) edges. \(K\)
    is called *labeled* if every \(d\)-dimensional cell of \(K\) is assigned a unique
    label; in this case, we write \(K = \{C_1, \dots, C_n\}\), where \(n\) is the
    number of \(d\)-dimensional cells of \(K\), and \(C_i\) is the \(i\)-the \(d\)-dimensional
    cell.


    **Definition 9.2** (Compatible dual complex). Let \(T\) be a triangulation of
    a set \(X = \{x_1, \dots, x_n\}\) of points in \(\mathbb{R}^d\) and let \(K =
    \{C_1, \dots, C_n\}\) be a labeled simple cell complex, that is, there is a one-to-one
    correspondence between \(x_p\) and \(C_{i_p}\). We then call \(K\) a *compatible
    dual complex* of \(T\) if, for every pair of points \(x_p\) and \(x_q\) that are
    connected in \(T\), the cells \(C_{i_p}\) and \(C_{i_q}\) share a face.


    This compatibility between \(K\) and \(T\) is purely combinatorial, that is, it
    simply states that the connectivity between points induced by \(K\) coincides
    with the one induced by \(T\). Notice that the cell \(C_i\) associated to the
    point \(x_p\) does not necessarily contain \(x_p\) in its interior. Moreover,
    the edge \([x_p, x_q]\) and its dual \(C_{i_p} \cap C_{i_q}\) are not necessarily
    *orthogonal* to each other, unlike most conventional geometric dual structures.
    Consequently, we can generalize the notion of mesh duality.'
