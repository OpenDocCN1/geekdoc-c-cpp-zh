    # 13.4 FURTHER EXTENSIONS


    We summarize next extensions to the meshfree and convex basis functions generated
    by the LME optimization program. An obvious question is whether these approximants
    can be extended to higher-order, that is, if in addition to exactly reproducing
    affine functions due to (13.2), they can be designed to exactly reproduce higher-order
    polynomials. This would lead to a higher rate of convergence when approximating
    PDEs. Focusing in 1D for simplicity, a naive extension would be to maximize the
    LME objective function subject to


    ```

    \(\sum_{i=1}^n \phi_i = 1, \quad \sum_{i=1}^n \phi_i v_i = x, \quad \sum_{i=1}^n
    \phi_i v_i^2 = x^2, \quad (13.10)\)

    ```


    which are a set of conditions met, for instance, by quadratic finite element spaces.
    However, as identified in [15], conditions in (13.10) together with the non-negativity
    constraint \(\phi_i \ge 0\) are infeasible for almost all points in \(P\). This
    may seem contradictory at first sight, since there are examples of non-negative
    approximants that can reproduce quadratic and higher-order functions, notably
    B-splines. One option is to give up non-negativity and consider a notion of entropy
    for signed probability distributions, which however destroys the convex structure
    of the approximation scheme, does not produce generalized barycentric coordinates,
    and can lead to wiggly basis functions [62, 373]. Insisting on non-negativity,
    the apparent contradiction referred to above is resolved by noting that for the
    second-order consistency condition to hold, the coefficients that multiply the
    generalized barycentric coordinates do not need to be \(v_i^2\). By designing
    appropriate coefficients, it is possible to restore feasibility, and thus define
    second-order maximum entropy approximations in multiple dimensions [111, 336],
    see Figure 13.4(a). The construction of feasible constraints for higher-order
    reproducing conditions, however, is an open question.


