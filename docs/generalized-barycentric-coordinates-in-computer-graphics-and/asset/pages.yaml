  md: 'As an example, consider again Cheeger''s isoperimetric constant. In order to
    define this constant in the discrete setting, consider a partitioning of \(\Gamma\)
    into two disjoint subgraphs \(\Gamma_1\) and \(\bar{\Gamma}_1\) such that the
    vertex set \(V\) of \(\Gamma\) is the disjoint union of the vertex sets \(V_1\)
    of \(\Gamma_1\) and \(\bar{V}_1\) of \(\bar{\Gamma}_1\). Here a subgraph of \(\Gamma\)
    denotes a graph whose vertex set is a subset of the vertex set of \(\Gamma\) such
    that two vertices in the subgraph are connected by an edge if and only if they
    are connected by an edge in \(\Gamma\). For positive edge weights, the discrete
    Cheeger constant (sometimes called *conductance* of a weighted graph) is defined
    as


    ```

    \(\lambda_C = \min \left\{ \frac{\text{vol}(\Gamma_1, \bar{\Gamma}_1)}{\min(\text{vol}(\Gamma_1),
    \text{vol}(\bar{\Gamma}_1))} \right\},\)

    ```


    where


    ```

    \(\text{vol}(\Gamma_1, \bar{\Gamma}_1) = \sum_{i \in V_1, j \notin V_1} \omega_{ij}
    \quad \text{and} \quad \text{vol}(\Gamma_1) = \sum_{i \in V_1} \omega_{ii},\)

    ```


    and similarly for \(\text{vol}(\bar{\Gamma}_1)\). Here, \(\omega_{ii} := L_{ii}\).
    Notice that for the case of the graph Laplacian, \(\text{vol}(\Gamma_1, \bar{\Gamma}_1)\)
    equals the number of edges with one vertex in \(\Gamma_1\) and another vertex
    in its complement.\(^1\)


    Similar to the smooth case, one then obtains the Cheeger inequalities


    ```

    \(\frac{\lambda_C^2}{2} \le \tilde{\lambda}_1 \le 2\lambda_C,\)

    ```


    where \(\tilde{\lambda}_1\) is the first nontrivial eigenvalue of the rescaled
    Laplace matrix


    ```

    \(\tilde{L} = SLS,\)

    ```


    where \(S\) is a diagonal matrix with \(S_{ii} = 1/\sqrt{\omega_{ii}}\). This
    rescaling is necessary since \(\lambda_C\) is invariant under a uniform rescaling
    of edge weights (and so is \(\tilde{L}\)), whereas \(L\) scales linearly with
    the edge weights. A proof of the discrete Cheeger inequalities for the case of
    the graph Laplacians (\(\omega_{ij} = 1\)) can be found in [104]; the proof for
    arbitrary positive edge weights is nearly identical.


    The Cheeger constant—and alongside, the corresponding partitioning of \(\Gamma\)
    into the two disjoint subgraphs \(\Gamma_1\) and \(\bar{\Gamma}_1\)—has applications
    in graph clustering, since the edges connecting \(\Gamma_1\) and \(\bar{\Gamma}_1\)
    tend to “cut” the graph along its bottleneck [222].


    Any discrete Laplacian (having positive edge weights or not) that satisfies (SYM)
    and (PSD) can be used for Fourier analysis on graphs. Indeed, let \(\{\varphi_i\}\)
    be the eigenfunctions of \(L\), chosen such that \(\varphi_i^T \varphi_j = \delta_{ij}\).
    Then one has


    ```

    \(u = \sum_i (u^T \varphi_i) \varphi_i,\)

    ```


    just like in the smooth setting. This decomposition of discrete functions on graphs'
