    Another way to describe the triangle quality is illustrated in Figure 2.2. The
    three triangles shown on the left have a modest aspect ratio, a single small angle,
    and a single large angle, respectively. Recall that the *aspect ratio* of a triangle
    is the ratio of its longest edge to the radius of its smallest inscribed circle.
    A bound on the aspect ratio is equivalent to a bound on the smallest angle in
    the triangle, hence any class of triangles with bounded aspect ratio is some class
    of the form of t_min. Further, arbitrarily large angles only occur in conjunction
    with very small angles, hence, as a subclass of diameter 1 triangles, any class
    of type t_min is contained in a class of type t_max. The converse is false: each
    class of type t_max includes some triangles with arbitrarily small angles, which
    is not contained in any class of type t_min.


