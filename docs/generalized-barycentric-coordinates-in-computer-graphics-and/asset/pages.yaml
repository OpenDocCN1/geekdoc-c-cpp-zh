- pgno: 191
  md: 'Hodge-optimized triangulations (HOT) were introduced, as a family of well-shaped
    primal-dual pairs of complexes designed for fast and accurate computations in
    computer graphics. Other existing work most commonly employs barycentric or circumcentric
    duals. While barycentric duals guarantee that the dual of each simplex lies within
    the simplex, circumcentric duals are often preferred due to the induced orthogonality
    between primal and dual complexes. This new approach instead promotes the use
    of weighted duals (power diagrams) and allows for much greater flexibility in
    the location of dual vertices while keeping primal-dual orthogonality. This provides
    an invaluable extension to the usual choices of duals by only adding one additional
    scalar per primal vertex. Furthermore, in that work, we introduce a family of
    functionals on pairs of complexes that we derive from bounds on the errors induced
    by diagonal Hodge stars, commonly used in discrete computations. The minimizers
    of these functionals, called HOT meshes, are shown to be generalizations of centroidal
    Voronoi tessellations and optimal Delaunay triangulations, and to provide increased
    accuracy and flexibility for a variety of computational purposes [289].


    Following this framework, minor changes can be accommodated seamlessly in existing
    mesh optimization codes in order to allow for much greater flexibility. Weights
    can be, for instance, optimized (with fixed connectivity or not) to locally “displace”
    dual vertices onto an immersed boundary [26] through a least-squares fit. Vertices
    can be optimized as well, for instance, in applications requiring local or global
    remeshing to maintain good numerical analysis.


    To some extent, this approach can even help to deal with situations where the
    primal triangulation is given and cannot safely be altered. For instance, moving
    vertices and/or changing the connectivity of a triangle mesh in R^3 is potentially
    harmful, as it affects the surface shape. Still, the ability to optimize weights
    to drive the selection of the dual mesh is very useful. We can easily optimize
    primal-dual triangulations (meshes) by minimizing a functional (energy) with respect
    to the weights. The connectivity is kept intact, regardless of the weights—only
    the position and shape of the compatible dual is optimized.


    As is shown in [289], even an optimized Delaunay triangulation with exceptionally
    high-quality tetrahedra can be made significantly better centered (with dual vertices
    closer to the inside of their associated primal simplex), using a simple weight
    optimization by this method (see Figure 9.3).'
