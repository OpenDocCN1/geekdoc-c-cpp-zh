    # 14.4.1 Hierarchical construction for 3D problems


    In several publications on the BEM-based FEM, the approach is applied to three-dimensional
    problems. For simplicity we restrict ourselves to the first order method ($k=1$)
    in the following. The construction of basis functions is straightforward, as soon
    as it is assumed that the faces of the polyhedral elements are triangles. In the
    original approach, the basis functions are defined analogously to the two-dimensional
    case. For each vertex $\boldsymbol{v}_i$, we have a function $\phi_i$ such that
    $\phi_i(\boldsymbol{v}_j) = \delta_{ij}$, it is linear on the triangular faces,
    and $\phi_i$ is harmonic inside the polyhedral element. Furthermore, a three-dimensional
    version of the boundary element method is available. Here, the boundary integral
    operators only differ in their kernel function and, of course, in the integration,
    which is done over two-dimensional surfaces of the polyhedra instead of one-dimensional
    boundaries of the polygons. In the treatment of the resulting boundary integral
    equation, in order to approximate the Neumann trace, the Sobolev spaces $H^{1/2}(\partial
    P)$ and $H^{-1/2}(\partial P)$ are discretized by continuous and piecewise linear
    polynomial functions over the surface triangles and by piecewise constant functions,
    respectively. All considerations on the assembling of the finite element matrix
    in 2D transfer to the 3D case.


    What can be done in the case of general polyhedral elements with polygonal faces?
    A simple and practical idea is to triangulate the surface $\partial P$ of the
    polyhedral element $P$ first and then apply the strategy described above. However,
    this introduces additional (artificial) vertices to the polyhedral element, which
    lead to additional degrees of freedom in the finite element computation. An alternative
    approach has been proposed in [330] that is applicable on general polygonal faces.


    In order to motivate the construction in 3D, we analyze once more the first-order
    basis functions $\phi_i$ for $i=1, \dots, n$ in 2D, or equivalently the harmonic
    coordinates from Section 1.2.8. These functions fulfill $\phi_i(\boldsymbol{v}_j)
    = \delta_{ij}$, are linear on the one-dimensional edges, and are harmonic inside
    the two-dimensional polygonal element. We observe that the second derivative of
    a linear function vanishes. Consequently, if we parametrize the edges linearly
    and treat $\phi_i$ as a function of one variable along the edge, we see that $\phi_i''''
    = 0$. Therefore, the linear function $\phi_i$ is harmonic in 1D on the edge and
    can be interpreted as the solution of a Laplace problem with boundary data that
    is correspondingly 0 and 1. From this viewpoint, it is clear how to proceed for
    the construction in 3D. Let $\Delta_1$ and $\Delta_2$ denote the one- and two-dimensional
    Laplace operators in the linear parameter spaces of an edge and face, respectively,
    and let $\Delta_3$ be the usual Laplace operator in three dimensions.'
