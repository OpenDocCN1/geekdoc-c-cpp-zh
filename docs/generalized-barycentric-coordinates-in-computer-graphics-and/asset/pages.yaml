    # 6.4 TUTTE’S BARYCENTRIC MAPPING THEOREM


    We now focus on Tutte’s barycentric mapping theorem [400], which not only characterizes
    a family of mesh parameterizations, but can also be used as a computational algorithm
    to create a parameterization [143]. In simple form, this theorem may be stated
    as follows.


    **Theorem 6.1.** Consider a 3-connected mesh that is a topological disk and with
    vertices in 2D. If the boundary vertices are positioned on a (not necessarily
    strictly) convex polygon, and if each interior vertex is a convex combination
    of its neighbors, then there is no intersection between the edges and each face
    is strictly convex.


    A mesh is 3-connected if it remains connected after removing any two vertices
    (and their incident edges). This condition is required to avoid some degeneracies
    (collapsed triangles) that occur, for instance, if a long interior edge connects
    two vertices on the boundary.


    More formally, each interior vertex is a linear combination of its neighbors,
    if


    ```

    \(\sum_{j \in N_i} w_{ij} u_j = u_i, \quad i = 1, \dots, (n_v - n_{bv}),\)

    \(\sum_{j \in N_i} w_{ij} v_j = v_i, \quad i = 1, \dots, (n_v - n_{bv}),\)

    \(u_i = b_i^u, \quad i = (n_v - n_{bv} + 1), \dots, n_v,\)

    \(v_i = b_i^v, \quad i = (n_v - n_{bv} + 1), \dots, n_v,\)

    (6.1)

    ```'
