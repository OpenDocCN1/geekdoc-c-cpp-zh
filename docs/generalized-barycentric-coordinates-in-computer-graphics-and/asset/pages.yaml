    to follow a simpler approach suggested in [251] and consider only the first intersections:
    \(u(y_1)/\|x - y_1\|\) instead of \(u(y)/\|x - y\|\) in (3.5). For example, we
    use such a simplification in our numerical experiments with the so-called Gordon-Wixom
    coordinates and their extensions (see Section 3.3 and Figure 3.4).


