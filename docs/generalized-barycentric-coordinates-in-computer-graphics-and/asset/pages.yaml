  md: '# ## 2.5.4 Mean value coordinates


    The analysis of mean value coordinates follows the same lines as that of Wachspress
    coordinates: we bound the \(L^\infty\) norm of the gradients of the individual
    coordinates as in (2.7), which is sufficient to imply the interpolation error
    estimate. The key differences are a new expression for the weights used to construct
    the coordinates and the fact that it is no longer necessary to exclude interior
    angles close to \(180^\circ\). A proof of the following result is given in [319,
    Theorem 1].


    **Lemma 2.13.** The inequality in _(2.7)_ holds uniformly for the mean value coordinates
    on \(\mathcal{P}_{\text{ex}} \cap \mathcal{P}_{\text{in}} \cap \mathcal{P}_{\text{edge}}\).


    Mean value coordinates are constructed from weights of the form,


    ```

    \(\displaystyle w_i(\boldsymbol{x}) = \frac{\tan(\frac{\gamma_i(\boldsymbol{x})}{2})
    + \tan(\frac{\gamma_{i-1}(\boldsymbol{x})}{2})}{\|\boldsymbol{v}_i - \boldsymbol{x}\|},\)

    ```


    where the angles \(\gamma_i(\boldsymbol{x})\) are depicted in the bottom left
    image of Figure 2.3. The subsequent analysis in [319] hinges on the observation
    that these weights get large if either \(\boldsymbol{x}\) is very close to a vertex
    of the polygon or if \(\boldsymbol{x}\) is near one of the edges of the polygon.
    In the latter case, one of the angles \(\gamma_i\) is near \(180^\circ\), causing
    the associated tangent term to be large. The analysis is divided into a number
    of cases, depending on which of these terms is nearly degenerate. The bottom right
    image in Figure 2.3 shows a polygon subdivided into different regions where these
    different cases apply. Lemma 2.7 helps to simplify this classification by ensuring
    that a vertex can only be near a limited number of polygon edges and vertices.
    Since the coordinates involve normalization of the weight functions, large weight
    functions do not prevent bounds on the coordinates and their gradients. In order
    to bound the gradient in each case, these large terms are shown to be offset by
    larger terms in the denominator. The analysis requires the convexity of the polygon
    to ensure all possible cases are covered; the non-convex case has not yet been
    considered.


    # ## 2.6 INTERPOLATION ERROR ESTIMATES ON POLYHEDRA AND POLYTOPES


    Moving from polygons to polyhedra and general polytopes, the challenge of quantifying
    shape quality becomes significantly more complex. Metrics involving polygonal
    interior angles (i.e., \(\rho_{\text{mina}}\) and \(\rho_{\text{maxa}}\)) are
    essential in two-dimensional analysis, but do not have natural extensions to higher
    dimensions; dihedral angles are perhaps the closest analogue. Moreover, there
    are fewer definitions of generalized barycentric coordinates in higher dimensions,
    due in part to the fact that the restriction of such coordinates to a possibly
    non-simplicial boundary facet should produce a lower dimensional generalized barycentric
    coordinate in some pre-determined fashion. For simplicity, some constructions
    (e.g., mean value coordinates) restrict their definitions to polytopes with simplicial
    boundary faces, although others (e.g., harmonic'
