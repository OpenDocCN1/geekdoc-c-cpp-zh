    applied to k-th order polynomials, i.e.,


    ```

    \(\nabla_{P,k}q = \nabla q \quad \forall q \in \mathcal{P}_k(P).\) (12.11)

    ```


    This property of the correction scheme plays an important role in ensuring that
    the resulting discretizations are polynomially consistent and satisfy the patch
    test.


    To aid in better understanding (12.11), we consider the case with linear space
    \(\mathcal{V}_1(P)\), where an explicit expression for the corrected gradient
    can be readily obtained. Let \(\boldsymbol{p} \in [\mathcal{P}_0(P)]^d\) and \(v
    \in \mathcal{V}_1(P)\). We arrive at the following expression for the corrected
    gradient:


    ```

    \(\nabla_{P,1}v = \nabla v + \frac{1}{|P|} \left( \oint_{\partial P} v \boldsymbol{n}
    ds - \int_P \nabla v d\boldsymbol{x} \right),\)

    ```


    which is similar to the corrected strain operator in the meshfree literature [296].
    We can see from this expression that the perturbation is a constant field proportional
    to the error in satisfying the identity \(\int_P \nabla v d\boldsymbol{x} = \oint_{\partial
    P} v \boldsymbol{n} ds\) by the volumetric and surface quadrature schemes. This
    implies that if \(v \in \mathcal{P}_1(P)\), then there is no correction to its
    gradient, i.e., \(\nabla_{P,1}v = \nabla v\). Additionally, in the 2D case, recall
    that the variation of \(v\) on \(\partial P\) is piecewise linear, and the boundary
    gradient is exact. In this case, \(\oint_{\partial P} v \boldsymbol{n} ds = \oint_{\partial
    P} v \boldsymbol{n} ds = \int_P \nabla v d\boldsymbol{x}\), and subsequently


    ```

    \(\nabla_{P,1}v = \nabla v + \frac{1}{|P|} \left( \int_P \nabla v d\boldsymbol{x}
    - \oint_P \nabla v d\boldsymbol{x} \right).\) (12.12)

    ```


    The perturbation is simply the difference between the volume average of \(\nabla
    v\) and its approximations through the quadrature. An immediate observation from
    (12.12) is that


    ```

    \(\oint_P \nabla_{P,1} v dx = \int_P \nabla v dx.\)

    ```


    This shows that the corrected gradient \(\nabla_{P,1}v\) under the action of the
    quadrature behaves like \(\nabla v\) under exact integration.


    Generally, it is expected from the definition of the correction that


    ```

    \(\oint_P \psi \cdot \nabla_{P,K} v dx - \int_P \psi \cdot \nabla v dx = O(h_P^k)
    ||\nabla v||_{L^2(P)^d}\)

    ```


    for \(v \in \mathcal{V}_k(P)\) when \(\psi\) is a sufficiently smooth vector field.
    Here, \(h_P\) is the diameter of element \(P\).'
