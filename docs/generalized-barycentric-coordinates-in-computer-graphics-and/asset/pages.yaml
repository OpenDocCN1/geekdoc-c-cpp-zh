  md: 'This chapter is organized as follows. The governing equations of solid mechanics
    are reviewed in Section 11.2. Section 11.3 provides an overview of a finite element
    formulation based on harmonic shape functions. Several approaches of rapid meshing/analysis
    are discussed in Section 11.4. The use of polyhedral elements in modeling fracture
    and fragmentation is discussed in Section 11.5. A summary of this chapter and
    an outlook are provided in Section 11.6.


    # 11.2 GOVERNING EQUATIONS OF SOLID MECHANICS


    In this section, the governing equations of solid mechanics are briefly reviewed.
    Consider the motion of a body $\mathcal{B}$ with interior domain $\Omega$ and
    boundary $\Gamma$ subjected to a body force $\boldsymbol{b}$ and applied surface
    tractions $\boldsymbol{t}$. A Lagrangian description of the motion of $\mathcal{B}$
    is used. The initial configuration of the body is denoted by $\Omega_0$ with boundary
    $\Gamma_0$. In the initial configuration, the position vector of a material point
    is denoted by $\boldsymbol{X}$. In the deformed configuration, the position of
    a material point is denoted by $\boldsymbol{x}$. The displacement vector $\boldsymbol{u}$
    is given by $\boldsymbol{u} = \boldsymbol{x} - \boldsymbol{X}$. The (material)
    derivative of the current position $\boldsymbol{x}$ with respect to the original
    position $\boldsymbol{X}$ is given by $\partial \boldsymbol{x} / \partial \boldsymbol{X}$.
    This vector derivative is called the deformation gradient, denoted by $\boldsymbol{F}$,
    and in terms of the displacement is given by


    \(\boldsymbol{F} = \frac{\partial \boldsymbol{u}}{\partial \boldsymbol{X}} + \boldsymbol{I},\)


    where $\boldsymbol{I}$ is the identity tensor. From the deformation gradient,
    one can define measures of strain, for example, engineering strain, logarithmic
    strain, Lagrangian strain, and Eulerian strain [63]. The Lagrangian strain tensor
    $\boldsymbol{E}$ is defined as


    \(\boldsymbol{E} := \frac{1}{2}(\boldsymbol{C} - \boldsymbol{I}),\)


    where


    \(\boldsymbol{C} := \boldsymbol{F}^T \boldsymbol{F}\)


    is the right Cauchy–Green tensor.


    In order to describe the kinetics of the material, one needs to derive measures
    of stress and the constitutive relations between stress and strain. In the context
    of hyperelasticity, one posits a potential energy function $W$ of the strain tensor,


    $W = W(\boldsymbol{E}).$


    Certain restrictions are placed on $W$ to obtain a constitutive model that is
    independent of the observer (objectivity) and to obtain a stable material. The
    first Piola–Kirchhoff stress tensor $\boldsymbol{P}$ is defined to be work conjugate
    to the derivative of $W$ with respect to the deformation gradient $\boldsymbol{F}$,


    \(\boldsymbol{P} = \frac{\partial W}{\partial \boldsymbol{F}}\) (11.1)


    so that


    $dW = \boldsymbol{P} : d\boldsymbol{F}.$'
