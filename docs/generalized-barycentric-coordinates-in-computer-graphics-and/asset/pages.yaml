    & 1 + \sum_i \partial_2\phi_i(\boldsymbol{x})u_{i,2} \end{matrix} \right| = 1
    + \sum_i \nabla\phi(\boldsymbol{x}) \cdot \boldsymbol{u}_i + \sum_i \sum_j \partial_i\phi_i(\boldsymbol{x})\partial_j\phi_j(\boldsymbol{x})(\boldsymbol{u}_i
    \times \boldsymbol{u}_j) , \)

    ```


    where \( \boldsymbol{u}_i = (u_{i,1}, u_{i,2}) \) and the sums range from 1 to
    \( n \). Therefore,


    ```

    \( J_f(\boldsymbol{x}) \ge 1 - Md - M^2d^2 \)

