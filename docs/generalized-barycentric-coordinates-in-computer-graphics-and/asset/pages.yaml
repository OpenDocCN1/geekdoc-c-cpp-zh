- pgno: 304
  md: '**Remark 15.2.** We could have equivalently formulated the edge-wise boundary
    conditions by assuming that \(\psi_{b|e}\) is a harmonic function with respect
    to a specific local coordinate frame on \(e\). In this way we have the following
    recursive construction: starting from the vertex values, we set the boundary data
    as the edge-wise harmonic lifting on each edge of \(\partial P\) and then we define
    \(\psi_{b_v}\) as the harmonic lifting in \(P\) of such a boundary function.


    These vertex basis functions coincide with those considered in Section 15.2.2,
    although for \(k > 1\) they are included alongside the extra edge and interior
    polygonal basis functions. In this sense, this natural basis can be seen as an
    augmentation of the standard basis of the harmonic GBC space.


    # *Edge basis functions* \(\psi_{e,\alpha}\)


    If \(k > 1\), for every edge \(e \in \mathcal{E}_P\), let \(\{q_{e,\alpha}\}_{\alpha=1}^{\mathcal{N}_e}\)
    be a basis for the polynomial space \(\mathbb{P}_k(e)/\mathbb{P}_1(e)\) such that
    each \(q_{e,\alpha}\) is zero at the end points of \(e\). For every index \(\alpha
    = 1, \dots, \mathcal{N}_e\), the function \(\psi_{e,\alpha} \in V_P^k\) is the
    solution of


    ```

    \begin{cases}

    -\Delta \psi_{e,\alpha} = 0 & \text{in } P, \\

    \psi_{e,\alpha}|_{\partial P} = \begin{cases} q_{e,\alpha} & \text{on } e, \\
    0 & \text{otherwise.} \end{cases}

    \end{cases}

    ```


    The crucial point is that the edge basis functions \(q_{e,\alpha}\) together with
    the linear polynomials defining the vertex basis functions (15.5) form a basis
    for \(\mathbb{P}_k(e)\), meaning that with these two sets of basis functions we
    have parametrized all of the possible choices of Dirichlet data for the local
    problems defining the space.


    # *Interior basis functions* \(\psi_{P,\alpha}\)


    Let \(\{q_{P,\alpha}\}_{\alpha=1}^{\mathcal{N}_P}\) be a basis for the polynomial
    space \(\mathbb{P}_{k-2}(P)\). For every index \(\alpha = 1, \dots, \mathcal{N}_P\),
    we define \(\psi_{P,\alpha} \in V_P^k\) to be the solution of


    ```

    \begin{cases}

    -\Delta \psi_{P,\alpha} = q_{P,\alpha} & \text{in } P, \\

    \psi_{P,\alpha}|_{\partial P} = 0 & \text{in } \partial P.

    \end{cases}

    ```


    Taken together, the functions \(\psi_{P,\alpha}, \psi_{e,\alpha}\), and \(\psi_{b_v}\)
    are linearly independent and represent a basis for \(V_P^k\). By counting them
    we conclude that the size of \(V_P^k\) is given by


    ```

    \dim(V_P^k) = n + n(k-1) + \mathcal{N}_P.

    ```


    As mentioned above, the vertex and edge basis functions fully determine the behavior
    of the functions of \(V_P^k\) on \(\partial P\), because the interior polygonal
    basis functions \(\psi_{P,\alpha}\) satisfy zero Dirichlet boundary conditions.'
