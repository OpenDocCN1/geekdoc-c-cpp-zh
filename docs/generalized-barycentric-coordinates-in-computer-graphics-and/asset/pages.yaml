- pgno: 265
  md: '# # Maximum-Entropy Meshfree Coordinates in Computational Mechanics


    Marino Arroyo


    Universitat Politècnica de Catalunya, Barcelona, Spain


    # ## CONTENTS


    +   - 13.1 Introduction ........................ 230

    +   - 13.2 Selecting barycentric coordinates through entropy maximization ....
    231

    +   - 13.3 Introducing locality: local maximum-entropy approximants ... 234

    +   - 13.4 Further extensions ... 238

    +   - 13.5 Applications ... 240

    +     - 13.5.1 High-order partial differential equations ... 240

    +     - 13.5.2 Manifold approximation ... 241

    +   - 13.6 Outlook ... 243


    CONVENTIONAL BARYCENTRIC COORDINATES are defined relative to vertices defining
    the boundary of a polytope. Here, we develop barycentric coordinates relative
    to a cloud of vertices sampling not only the boundary, but also the interior of
    a region in R^d, with the objective of using these barycentric coordinates as
    basis functions to approximate partial differential equations or parametrize surfaces.
    We show that entropy maximization provides a rational way to define smooth barycentric
    coordinates, but for the resulting basis functions to be localized, and hence
    lead to sparse matrices in computational mechanics, entropy maximization needs
    to be biased by a suitable notion of locality. The basis functions that result
    from this approach are smooth, reproduce polynomials, are localized around their
    corresponding vertex, and their definition does not rely on an underlying mesh
    or grid but rather on less structured neighborhood relations between vertices.
    Thus, they can be viewed as meshfree basis functions [159, 245, 380].'
  merge: -1
  img_proc: true
- pgno: 266
  md: 'The theory and practical evaluation behind these basis functions is reviewed
    next, and selected applications in computational mechanics are presented.


    # 13.1 INTRODUCTION


    A standard approach to numerically representing a function $u$ over a domain $\Omega
    \subset \mathbb{R}^d$ is to expand it in terms of a finite set of basis functions,
    that is


    $u^h(\boldsymbol{x}) = \sum_{i=1}^n \phi_i(\boldsymbol{x}) u_i, \quad (13.1)$


    where $\phi_i : \Omega \to \mathbb{R}$ is the $i$-th basis function and $u_i$
    its corresponding coefficient. Such a representation is the basis of Galerkin
    methods to solve partial differential equations (PDEs), see [204]. Here, rather
    than choosing a *priori* the set of basis functions, such as piecewise polynomials
    defined over a mesh, we initially leave their definition open, and then motivate
    and make explicit the specific choices leading to maximum-entropy meshfree basis
    functions.


    To show convergence of numerical solutions obtained by a Galerkin method to the
    exact solution, the basis functions need to satisfy the so-called reproducibility
    conditions. These conditions ensure that polynomials up to degree $p$ are exactly
    represented by the basis functions. For second-order PDEs such as the heat equation
    and the most common systems arising in fluid and solid mechanics, consistency
    conditions up to $p=1$ are required at all points $\boldsymbol{x} \in \Omega$,
    namely


    $\sum_{i=1}^n \phi_i(\boldsymbol{x}) = 1, \quad (13.2a)$


    $\sum_{i=1}^n \phi_i(\boldsymbol{x}) \boldsymbol{v}_i = \boldsymbol{x}, \quad
    (13.2b)$


    for some vector coefficients $\boldsymbol{v}_i \in \mathbb{R}^d$. If these conditions
    are met, then any affine function $w(\boldsymbol{x}) = \boldsymbol{a} \cdot \boldsymbol{x}
    + b$, where $\boldsymbol{a}$ is a vector in $\mathbb{R}^d$ and $\cdot$ denotes
    the scalar product, can be exactly represented in $\Omega$ as $w(\boldsymbol{x})
    = \sum_{i=1}^n \phi_i(\boldsymbol{x})(\boldsymbol{a} \cdot \boldsymbol{v}_i +
    b)$.


    Interpreting the coefficients $\boldsymbol{v}_i$ as the coordinates of points
    or vertices, we can naturally associate each basis function to a vertex, and view
    the set of vertices $V = \{\boldsymbol{v}_1, \boldsymbol{v}_2, \dots, \boldsymbol{v}_n\}$
    as points sampling the domain $\Omega$. With this interpretation, we only need
    to require the basis functions to be non-negative,


    $\phi_i(\boldsymbol{x}) \ge 0 \quad \forall \boldsymbol{x} \in \Omega, \ i = 1,
    2, \dots, n \quad (13.3)$


    and recall (13.2) to realize that the functions $\phi_i(\boldsymbol{x}), \ i =
    1, 2, \dots, n$ define a set of generalized barycentric coordinates relative to
    $V$. A difference with respect to previous chapters is that now we allow for interior
    vertices to the domain, and for multiple vertices along a face of the domain.'
  merge: -1
  img_proc: true
- pgno: 267
  md: '![](img/4913dd83a2a14bc205a0a92cce102c82_267_0.png)


    Figure 13.1 Set of vertices V in two dimensions, along with the convex hull P.
    See color insert.


    Because generalized barycentric coordinates at x are coefficients of a convex
    combination of the vertices resulting in x, see (13.2b), it immediately follows
    that such basis functions can only be defined in the convex hull of V, and therefore
    Omega subset conv V. Furthermore, exploiting elementary facts of convex geometry,
    it is possible to characterize the behavior of convex approximation schemes of
    V, that is, barycentric coordinates defined in the vertex set V, on the boundary
    of the polytope P = conv V [15]. In particular, it can be shown that if F denotes
    a face of P in the sense of convex geometry (in R^d 0-dimensional faces are extreme
    points, 1-dimensional faces are edges, and 2-dimensional faces are proper faces)
    and v_i not in F, then the corresponding basis function phi_i vanishes on F [15].


    Immediate consequences of this fact are that: (1) basis functions of interior
    vertices (see Figure 13.1) vanish on the boundary of P, (2) basis functions of
    extreme points v_i of P satisfy the Kronecker-delta property, phi_i(v_j) = delta_ij,
    and (3) on a given face F (in Figure 13.1), only the basis functions of vertices
    lying on F are non-zero in F. As a result of (3), if we denote by I_F the set
    of indices of nodes lying on F, then (13.2a,13.2b) become sum_{i in I_F} phi_i(x)
    = 1 and sum_{i in I_F} phi_i(x) v_i = x for all x in F, that is, the basis functions
    of nodes on a face maintain the full approximation properties on that face. Furthermore,
    (3) also implies that the basis functions on a face can be defined without reference
    to information in the higher-dimensional ambient space. These properties can be
    referred to as a weak Kronecker-delta property, which facilitate the imposition
    of boundary conditions in the numerical approximation of PDEs.


    # 13.2 SELECTING BARYCENTRIC COORDINATES THROUGH ENTROPY MAXIMIZATION


    On examining (13.2a) and (13.3), it is clear that for each point x in P, the barycentric
    coordinates {phi_1(x), phi_2(x), ..., phi_n(x)} can be viewed as a discrete probability
    distribution for n events. Defining the barycentric coordinates then becomes a
    problem of statistical inference. In the absence of additional information and
    if one tries to avoid any bias, Laplace''s principle of insufficient reason would
    suggest selecting'
  merge: -1
  img_proc: true
- pgno: 268
  md: '\(\phi_i(\boldsymbol{x}) = 1/n\) for \(i = 1, \dots, n\). Yet we do have additional
    information, since (13.2b) states that the average of the vertex positions is
    \(\boldsymbol{x}\). How can we incorporate this piece of information, while making
    a choice of the probabilities (barycentric coordinates) as unbiased as possible?


    One classical answer to this question in information theory is Jaynes''s principle
    of maximum entropy [211]. Let us first introduce the information entropy associated
    to a finite probability distribution by considering a coin toss. In this case,
    there are two events (heads or tails) that for a perfectly balanced coin have
    equal probabilities, \(p_1 = p_2 = 1/2\). Instead, we could conceive an extremely
    unbalanced coin with probabilities \(p_1 = 0.99, p_2 = 0.01\). A fundamental question
    in information theory is how to quantify the uncertainty of a probability distribution,
    or in other words, how to quantify the amount of information gained by realizing
    a coin toss. It is obvious that the balanced coin leads to a much more uncertain
    outcome, whereas, for the unbalanced one, we will learn very little by throwing
    it since we know that the outcome will most likely be heads. It can be shown that
    a canonical measure of uncertainty or information is given by the Shannon entropy
    function,


    ```

    \(H(p_1, p_2, \dots, p_n) = - \sum_{i=1}^n p_i \log p_i, \quad (13.4)\)

    ```


    where the function \(x \log x\) is extended by continuity at zero, i.e., \(0 \log
    0 = 0\). See [223] for a detailed motivation of this measure of information and
    its properties. By evaluating Shannon entropy on the previous two probability
    distributions, we find that the first coin is about 12 times more uncertain than
    the second one. In fact, it can be shown that the function in (13.4) is strictly
    concave with a maximum at the uniform distribution \(p_i = 1/n, i = 1, 2, \dots,
    n\). This last fact shows that maximizing the entropy is consistent with Laplace''s
    principle of insufficient reason.


    Let us now introduce Jaynes''s principle using another simple example, that of
    a dice with six faces, \(A_1, A_2, \dots, A_6\). Consider the random function
    that assigns to a given face its numerical value, \(f(A_i) = i\). For a perfectly
    balanced dice, the average of \(f\) is \(\sum_{i=1}^6 i/6 = 7/2\). Suppose, however,
    that an accurate sample mean is computed for this quantity after a large number
    of trials, giving a result of 4. Clearly, this new piece of information is inconsistent
    with the uniform probabilities that we expect for a perfectly balanced dice. We
    would like to incorporate this information in the inference of the probabilities
    \(p_1, p_2, \dots, p_6\) associated to each face of the dice, but clearly it is
    not sufficient to uniquely determine these probabilities. Jaynes''s recipe is
    to consider the most uncertain probability distribution, that is, the one that
    maximizes entropy, while being consistent with the known partial information [211].
    Mathematically, this statement can be formulated as an optimization program with
    constraints


    ```

    max \(- \sum_{i=1}^6 p_i \log p_i\)

    subject to \(p_i \ge 0, \sum_{i=1}^6 p_i = 1, \sum_{i=1}^6 i p_i = 4,\)

    ```'
