  md: '# ## 7.1 INTRODUCTION


    Interactive shape deformation is a fundamental problem in computer graphics and
    geometry processing. It is essential for designing and modeling variations of
    shapes and for generating believable animation sequences. In this chapter, we
    focus on the special case of planar shape deformation, for which the domain \(\Omega\)
    to be deformed is an open and connected subset of the plane. For simplicity, we
    assume that the domain is bounded by a simple polygon \(P\). The codomain is again
    a subset of the plane, where in some scenarios (as in Chapter 4), the user explicitly
    dictates its shape (e.g., to be a polygon as well), while in other scenarios,
    more freedom is allowed, and the shape freely evolves. More formally, our goal
    is to compute a map (a vector function) \(f(\boldsymbol{x}): \Omega \rightarrow
    \mathbb{R}^2\) that maps points in the domain to points in the domain to points
    in the codomain, such that \(f\) satisfies some boundary constraints while having
    certain desirable properties. Some properties, such as smoothness of \(f\), are
    easier to attain, whereas other properties, such as local injectivity, are more
    challenging to guarantee. The complete list of desired properties will be revealed
    as the discussion of this chapter evolves. However, we briefly mention and motivate
    below the most important properties and requirements.


    The domain \(\Omega\) is equipped with a colored texture and we are interested
    in visualizing the map \(f\) by rendering a high quality image of the codomain.
    The algorithms that we consider for computing the underlying map \(f\) are indifferent
    to the choice of such texture. These algorithms are solely based on geometric
    considerations; however, for the result to be valuable from the graphics application
    standpoint, some requirements have to be added. A high quality result should preserve
    the fine details of the underlying texture. Hence, smoothness of the map is often
    required. Luckily, this is relatively easy to obtain when working with barycentric
    coordinates as it is implied by the smoothness of the coordinates themselves.
    In addition to smoothness, we often desire that the amount of metric distortion
    induced by the map is as low as possible. We consider both the conformal and the
    isometric distortion, where conformal distortion refers to the amount by which
    angles between arbitrary intersecting curves are altered under the action of the
    map, and isometric distortion refers to the amount of change in the length of
    arbitrary curves. A map is said to be conformal if it has zero conformal distortion
    everywhere. The Jacobian matrix \(J_f\) of a conformal map is a similarity transformation,
    allowing only rotations with isotropic scale, but it can have arbitrarily high
    isometric distortion. Ideally, a map should be isometric, with a Jacobian that
    is restricted to be a rotation (without scale). Unfortunately, unlike the space
    of conformal maps, the space of isometries in \(\mathbb{R}^2\) is fairly restricted
    and contains only rigid motions (a global rotation and translation) and reflections.
    Hence, we can only hope for maps that are close to isometry, having a low amount
    of isometric and conformal distortion.


    In order to control the end result, a user interface is provided, where some boundary
    conditions for the map \(f\) can be prescribed. For example, the user can prescribe
    the shape of the entire target boundary. Since the target boundary is a curve
    with an infinite number of degrees of freedom, a common choice in practice is
    to assume that the image of the map is bounded by a polygon. The user only'
