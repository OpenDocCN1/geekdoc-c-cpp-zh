    # 15.2.5 A convenient basis


    While the basis introduced in the previous section provides an intuitive splitting
    of the discrete space, using it in practice for solving PDEs requires (approximately)
    solving the associated Dirichlet problem for each basis function in order to evaluate
    the bilinear form of the global problem. Instead, we now describe an alternative
    basis for the virtual element spaces introduced in the previous section. With
    this new basis, we can gain access to partial information about the functions
    in \( V_h^k \) without needing to evaluate them directly, and hence without having
    to solve the local boundary-value problems. From the degrees of freedom, we will
    be able to compute local polynomial projections on each mesh element. In the context
    of the discretization of PDEs, these piecewise-polynomial projections can then
    be used to build a discrete bilinear form in such a way that the functions of
    \( V_h^k \) never have to be evaluated. Hence, this basis provides us with a method
    of using the generalized harmonic function spaces in such a way that we never
    need to even approximately solve the local boundary value problems.


    For the special case of \( k = 1 \), we will still take the standard vertex basis
    functions familiar from harmonic GBC. However, we still construct the discrete
    bilinear form in a virtual way that avoids ever having to evaluate the basis functions
    inside the element, and therefore avoids solving the local Dirichlet problems.


    The basis for the general order space, on the other hand, is constructed differently
    from the _natural_ basis. Instead of parametrizing the data of the local Dirichlet
    problems, we directly parametrize the functions in the space through their values
    at the vertices of the element, their moments on each edge, and their moments
    inside the element. Although not particularly intuitive, this choice of degrees
    of freedom is shown to be unisolvent for the space in [27] using formal arguments.
    In Section 15.2.6 we show a correspondence between this basis and the natural
    basis of the previous section, which can be seen as a constructive unisolvence
    proof.


    Specifically, the basis is chosen to be the Lagrangian basis with respect to the
    degrees of freedom, and is illustrated in Figure 15.2:'
