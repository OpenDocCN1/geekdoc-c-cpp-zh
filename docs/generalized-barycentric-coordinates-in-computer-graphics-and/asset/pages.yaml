  md: 'Another important desideratum is convergence: In the limit of refinement of
    simplicial manifolds that approximate a smooth manifold, one seeks to approximate
    the smooth Laplacian by a sequence of discrete ones. For applications this is
    important in terms of obtaining discrete operators that are as mesh independent
    as possible—re-meshing a given shape should not result in a drastically different
    Laplacian.


    A closely related concept to convergence is consistency. A sequence of discrete
    Laplacians $(\Delta_n)_{n \in \mathbb{N}}$ is called consistent if $\Delta_n u
    \to \Delta u$ for all appropriately chosen functions $u$. For example, it can
    be shown that Laplacians on point clouds, such as those considered in [35] are
    consistent; see [122].


    Convergence is more difficult to show than consistency since it additionally requires
    that the solutions $u_n$ to the Poisson problems $\Delta_n u_n = f$ converge (in
    an appropriate norm) to the solution $u$ of $\Delta u = f$. Discussing convergence
    in detail is beyond the scope of this short survey. Roughly speaking, Laplacians
    on simplicial manifolds converge to their smooth counterparts (in an appropriate
    operator norm) if the inner products on discrete $k$-forms used for defining simplicial
    Laplacians converge to the inner products on smooth $k$-forms. In this case, one
    obtains convergence of solutions to the Poisson problem, convergence of the components
    of the Hodge decomposition, convergence of eigenvalues and eigenfunctions [124,
    134, 191, 409, 427], and (using different techniques) convergence of Cheeger cuts
    [398].'
