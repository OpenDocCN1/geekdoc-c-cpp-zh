    Pooran Memari


    LIX, CNRS, École Polytechnique, Université Paris Saclay, Palaiseau, France


    # ## CONTENTS


    +   9.1 Introduction .................................................... 147

    +   9.2 Generalized primal-dual triangulations ........................ 148

