    +   - p_ar — The aspect ratio is bounded: diam(P) / r(P) <= gamma*.

    +   - p_nv — The number of vertices is bounded: n < n*.

    +   - p_edge — The ratio of diameter to the shortest edge is bounded: diam(P)
    / |e_i| < c*.'
