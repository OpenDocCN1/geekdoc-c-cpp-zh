- pgno: 312
  md: '# ## 15.4 CONNECTION WITH OTHER METHODS


    In recent years, there has been a growing interest in numerical methods for PDEs
    on general polygonal and polynomial meshes. We refer, for example, to the mimetic
    finite difference (MFD) method [32, 253], composite finite elements (CFEs) in
    both their conforming [184] and discontinuous Galerkin (dG) [11] version related
    to the agglomeration dG method [25], hp-dG [80], HDG [105], weak Galerkin methods
    [287], Hybrid high-order (HHO) methods [123], polygonal finite element method
    [378], BEM-based FEM [421], extended finite element method [158], and gradient
    scheme [126], to mention just a few. In this section, we discuss methods in the
    above list that are related to the VEM. In particular, PFEM and BEM-based FEM
    are based on similar discretizations spaces. The VEM approach can also be viewed
    as a variational analogue of the MFD method.


    # ## 15.4.1 Polygonal and polyhedral finite element method


    Assuming that we know how to compute the basis functions at any point of \( P
    \), a finite element formulation is readily available for polygonal and polyhedral
    elements. For the lowest-order case (i.e., for \( k=1 \)), such a method coincides
    with an instance of the PFEM method. For a more detailed discussion, see, for
    instance, the review in [268, 378]. For \( k > 1 \), the calculation of the integrals
    of the stiffness matrix and the right-hand side would be very expensive, which
    would render this approach to be non-competitive with other methods, and in particular,
    with the VEM. A different strategy based on approximating the Poisson problems
    that provide the basis functions can be devised by reformulating such problems
    as boundary element problems [421]. More details are discussed in Section 15.4.3.


    # ## 15.4.2 Nodal MFD method


    In this section, we compare the formulation of the conforming VEM to that of the
    mimetic finite difference method [32, 253] for the model problem presented in
    Section 15.3.1. For simplicity of exposition we assume that the diffusion tensor
    \( K \) is piecewise constant on \( \Omega_h \) and denote its restriction to
    \( P \) by \( K_P \). The major difference between the two formulations is that
    the MFD method follows a discrete approach like that of finite volumes, whereas
    the VEM relies on a continuous variational formulation like that of the finite
    element method. In fact, the conforming VEM is a variational reformulation of
    the nodal MFD method proposed in [31, 71] and the two families of schemes are
    equivalent up to the stability term.


    To ease the notation at the price of a minor inconsistency, we will use the symbols
    \( \mathcal{A}_h \) and \( \mathcal{A}_h^P \) to denote the global and local discrete
    operators provided by the MFD method. We will also continue referring to them
    as "_bilinear forms_" although these operators are matrices that act directly
    on the degrees of freedom through a matrix-vector product. Moreover, in this section
    \( u_h, v_h \) represent both continuous functions and the associated "_grid functions_,"
    whose values are associated with geometric objects such as vertices, edges, faces,
    and cells. We represent \( u_h \) and \( v_h \) as the'
  merge: -1
  img_proc: true
- pgno: 313
  md: '$N_{\text{dofs}}$-sized column vectors $U_h$ and $V_h$, respectively, where
    $N_{\text{dofs}}$ is the total number of degrees of freedom.


    Just like in the VEM approach, the global bilinear form $\mathcal{A}_h$ is assembled
    as the sum of local contributions $\mathcal{A}_h^P(u_h, v_h)$. The elemental bilinear
    form $\mathcal{A}_h^P(\cdot, \cdot)$ is now built to explicitly satisfy the two
    following conditions:


    +   • (S1) Polynomial Consistency: for any $p \in \mathbb{P}_k(P)$ and any grid
    function $u_h$, it holds that


    $\mathcal{A}_h^P(u_h, p) = \mathcal{A}(u_h, p). \quad (15.18)$


    +   • (S2) Stability: there exist two constants $\alpha^* > \alpha_* > 0$ independent
    of the mesh, such that for any $u_h$ it holds that


    $\alpha_* \mathcal{A}(u_h, u_h) \le \mathcal{A}_h^P(u_h, u_h) \le \alpha^* \mathcal{A}(u_h,
    u_h). \quad (15.19)$


    The conditions (S1)-(S2) are also satisfied in the VEM. However, these conditions
    are an explicit part of the MFD construction process, whereas in the VEM they
    are the consequence of the formulation of the method.


    The action of the mimetic bilinear form on the degrees of freedom of $u_h$ and
    $v_h$ is expressed by


    $\mathcal{A}_h^P(v_h, u_h) = V_h^T \mathbf{A}^P U_h,$


    where $\mathbf{A}^P$ is a positive semidefinite matrix. After an integration by
    parts, the polynomial consistency condition (15.18) can be restated as


    $$U_h^T \mathbf{A}^P N_\alpha = \int_P \nabla u_h \cdot K_P \nabla m_\alpha \,
    dV$$

    $$= - \int_P u_h \, \text{div}(K_P \nabla m_\alpha) \, dV + \sum_{e \in \mathcal{E}_P}
    \int_e u_h \, \mathbf{n}_e \cdot K_P \nabla m_\alpha \, dS$$

    $$= U_h^T R_\alpha, \quad (15.20)$$


    where $m_\alpha$ is a scaled monomial of $\mathcal{M}_k(P)$, $N_\alpha$ the column
    vector of its degrees of freedom, and $R_\alpha$ the corresponding column vector
    of coefficients determined by (15.20). Assembling all column vectors $N_\alpha$
    and $R_\alpha$ into the column-partitioned matrices $\mathbf{N} = (N_\alpha)$
    and $\mathbf{R} = (R_\alpha)$ and noting that $U_h$ is arbitrary, we can rewrite
    the consistency conditions (15.20) to matrix form as


    $\mathbf{A}^P \mathbf{N} = \mathbf{R}. \quad (15.21)$


    On a general $d$-dimensional polytope, (15.21) provides an underdetermined linear
    system that has a non-unique solution. A possible solution to (15.21) is:


    $\mathbf{A}_{\text{cons}}^P := \mathbf{R}(\mathbf{R}^T \mathbf{N})^\dagger \mathbf{R}^T,
    \quad (15.22)$'
  merge: -1
  img_proc: true
- pgno: 314
  md: 'where \((\mathbf{R}^T \mathbf{N})^\dagger\) denotes the pseudo-inverse of \((\mathbf{R}^T
    \mathbf{N})\) (note that matrix \(\mathbf{R}^T \mathbf{N}\) is the stiffness matrix
    of the scaled monomials \(\mathcal{M}_k(P)\) and thus is singular).


    Matrix \(\mathbf{A}^P_{cons}\) as defined by (15.22) does not satisfy the stability
    condition (15.19) due to an enlarged kernel. Hence a stability term has to be
    added, which is given by


    \(\mathbf{A}^P_{stab} := \mathbf{N}_\perp \mathbf{S} \mathbf{N}_\perp^T,\)


    where \(\mathbf{S}\) is a symmetric, positive definite matrix, and the columns
    of \(\mathbf{N}_\perp\) are orthogonal to the columns of \(\mathbf{N}\) and such
    that the span of \(\mathbf{N}\) and \(\mathbf{N}_\perp\) is \(\mathbb{R}^{n_{dof}}\).
    From the orthogonality \(\mathbf{N}_\perp^T \mathbf{N} = 0\) it follows that \(\mathbf{A}^P_{stab}
    \mathbf{N} = 0\). Thus, for any choice of \(\mathbf{S}\), the combined matrix


    \(\mathbf{A}^P = \mathbf{A}^P_{cons} + \mathbf{A}^P_{stab}\)


    still satisfies the consistency condition (15.21). The stability condition is
    satisfied by taking \(\mathbf{S}\) to be spectrally equivalent to the non-zero
    part of \(\mathbf{A}^P_{cons}\). A particularly simple but rather effective choice
    for \(\mathbf{S}\) is the scalar matrix \(\text{tr}(\mathbf{A}^P_{cons})|P|I\),
    where \(\text{tr}(\mathbf{A}^P_{cons})\) is the trace of matrix \(\mathbf{A}^P_{cons}\).


    The choice of \(\mathbf{S}\) can be optimized for a particular set of criteria
    [183]. This optimization process is dubbed “mimetic adaptation” or “m-adaptation”
    and can lead to certain improvements of the scheme such as attaining a discrete
    form of maximum/minimum principles [254] or reducing the numerical dispersion
    for wave problems by several orders of magnitude on structured meshes [59, 182].


    # 15.4.3 BEM-based FEM


    A direct evaluation of the basis functions of \(V_k^P\) for \(k > 1\) would require
    the approximation of the variational problems that define them on \(P\). A few
    attempts have been made along this direction by meshing each element and solving
    the Poisson problems through a local finite element approximation. However, such
    a direct approach is prohibitive for its complexity and the related computational
    costs. An interesting alternative is found in the BEM-based FEM first introduced
    in [107] and reported in Chapter 14. We also refer to [421] for the two-dimensional
    case and [330] for the three-dimensional case.


    In the two-dimensional case, the set of basis functions considered by the BEM-based
    FEM is precisely the one in Section 15.2.4 for all polynomial degrees, cf. Chapter
    14. Therefore, the evaluation of the basis functions can be dealt with by re-writing
    the Poisson boundary-value problems (15.5), (15.6), and (15.7) as boundary element
    problems for the conormal derivative defined on the elemental boundary. This latter
    problem is then solved by a standard finite element method, whence the coining
    of the method as BEM-based FEM. Computational costs and complexity are reduced
    since the approximation is one-dimensional. Indeed, although the boundary element
    formulation leads to full matrices, these are really small as no additional finer
    discretization of the boundary is needed.


    Here we summarize how the local bases (associated with each vertex, edge, or face)
    of Section 15.2.4 can be approximated using the BEM approach and their use within
    the BEM-based FEM. The problem for an interior basis can always be'
  merge: -1
  img_proc: true
- pgno: 315
  md: 'treated by transforming it into a problem with homogeneous right-hand-side
    and non-homogeneous boundary data (cf. [421]).


    Therefore, we only need to consider the case of a vertex or edge basis function,
    which solves a problem such as:


    ```

    \begin{cases} -\Delta \phi = 0 & \text{in } P, \\ \phi_{\partial P} = g, \end{cases}
    \quad (15.23)

    ```


    where \( g \in C(\partial P) \) is polynomial on each edge.


    Let \( \gamma_0^P \phi \) and \( \gamma_1^P \phi = \boldsymbol{n}_P \cdot \gamma_0^P
    \nabla \phi \) denote, respectively, the trace and the Neumann trace of \( \phi
    \). It is well known that the solution operator for (15.23) can be seen as a map
    of the trace into the Neumann trace (Dirichlet-to-Neumann or Steklov-Poincaré
    operator). Formally,


    ```

    \gamma_1^P \boldsymbol{\phi} = \boldsymbol{S}_P \gamma_0^P \boldsymbol{\phi}.
    \quad (15.24)

    ```


    The Steklov-Poincaré operator is obtained by considering the representation formula
    for the solution of (15.23):


    ```

    \phi(x) = \int_{\partial P} U^*(x,y)\gamma_1^P \phi(y) ds_y - \int_{\partial P}
    \gamma_{1,y}^P U^*(x,y) \gamma_0^P \phi(y) ds_y \quad (15.25)

    ```


    for \( x \in P \), where \( U^*(x,y) := -\frac{1}{2\pi} \ln |x-y| \) is the fundamental
    solution of the negative Laplacian in two dimensions. Taking the trace of the
    above yields the following problem for \( \gamma_1^P \phi \):


    ```

    \boldsymbol{V}_P \gamma_1^P \phi = (\frac{1}{2}\boldsymbol{I} + \boldsymbol{K}_P)
    \gamma_0^P \phi, \quad (15.26)

    ```


    where \( \boldsymbol{V}_P \) and \( \boldsymbol{K}_P \) are the single-layer and
    double-layer potential operators and \( \boldsymbol{I} \) is the identity operator,
    from which (15.24) is derived; see Chapter 14 or [367] for details. The BEM now
    consists of: (1) discretizing problem (15.26) with the use of finite element methods
    to compute numerical approximations \( \gamma_1^P \phi \), and (2) evaluating
    the approximation \( \widehat{\phi} \) inside \( P \) by the representation formula
    (15.25). A guide on fast numerical approaches to boundary integral equations is
    given in [328].


    Now, suppose we seek the numerical solution of problem (15.16). Here we assume
    that the diffusion coefficient is a piecewise constant scalar, say \( \kappa \).
    Then the BEM-based FEM operates as follows. First, following the approach described
    above, compute on each \( P \in \Omega_h \) a numerical approximation to each
    basis function in (15.5), (15.6), and (15.7). Second, solve the discrete problem
    (15.17) with


    ```

    \mathcal{A}_h(u_h, v_h) = \sum_{P \in \Omega_h} \mathcal{A}_h^P(u_h, v_h) = \sum_{P
    \in \Omega_h} \int_{\partial P} \widehat{\gamma_1^P u_h} \gamma_0^P v_h ds - \int_P
    \Delta u_h \widehat{v_h} dV

    (f, v_h)_h = \sum_{P \in \Omega_h} \int_P f \widehat{v_h} dV.

    ```


    The advantage of this approach is that no element-wise sub-meshing is required,
    although some form of volumetric quadrature is still needed in order to compute
    the volumetric terms in the previous equations.'
