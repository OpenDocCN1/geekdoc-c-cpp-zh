    # 6.3 NOTIONS OF TOPOLOGY


    Clearly, not all surfaces admit a parametrization. For instance, a sphere cannot
    be mapped to the plane without cutting it or poking a hole (see Figure 6.4, left).
    Therefore, it is a necessary condition that the surface has a boundary. However,
    it is not a sufficient condition. Consider the surface in Figure 6.4 (right):
    due to the handle, it is impossible to unfold it to 2D without intersections.
    Therefore, it is necessary to be able to determine whether a given mesh has a
    handle or not. The number of handles of a surface is referred to as its genus.
    A sphere (see Figure 6.5 A,B), has genus 0, a torus (see Figure 6.5 C), has genus
    1, a double torus (see Figure 6.5 E), has genus 2.


    The genus (denoted by g in what follows) is a global property of surfaces that
    is at first sign non-trivial to determine. Fortunately, for a closed connected
    surface, it can be deduced from the Euler–Poincaré characteristic $\chi$, another
    quantity that is very easy to compute, given by $\chi = n_v - n_e + n_f$, where
    $n_v$ denotes the number of vertices, $n_e$ the number of edges, and $n_f$ the
    number of facets. Both the Euler–Poincaré characteristic and the genus are topological
    invariants that depend neither on the shape of the surface nor on the way it is
    decomposed into polygons. For instance, consider the sphere in Figure 6.5 (A),
    decomposed into 8 vertices, 12 edges, and 6 facets in a cube-like manner. Its
    Euler–Poincaré characteristic is $\chi = 8 - 12 + 6 = 2$. Considering now the
    tetrahedron-like decomposition of the sphere in Figure 6.5 (B), one gets $\chi
    = 4 - 6 + 4 = 2$ again. Whatever the considered decomposition of the sphere, one
    always gets $\chi = 2$. Let us take a look now at the torus (see Figure 6.5 C),
    decomposed as shown in Figure 6.5 (D). It has 16 vertices, 32 edges, and 16 faces,
    thus $\chi = 16 - 32 + 16 = 0$.


    Now we would like to know the Euler–Poincaré characteristic of a double torus
    (see Figure 6.5 E), that is, a surface of genus g = 2. One possibility would be
    to “mesh” the double torus and count the number of elements. Another more interesting
    method is to analyze how the Euler–Poincaré characteristic $\chi$ changes when
    one creates a handle, as shown in Figure 6.6. The operation creates a change $\Delta
    n_v$ of the number of vertices and changes $\Delta n_e$, $\Delta n_f$ of the number
    of edges and faces, respectively. In turn, $\chi$ becomes $\chi + \Delta\chi$,
    where $\Delta\chi = \Delta n_v - \Delta n_e + \Delta n_f$. In the


