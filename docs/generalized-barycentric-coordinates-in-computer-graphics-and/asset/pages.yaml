    # 14.3.1 Adaptive FEM strategy


    The adaptive BEM-based FEM successively refines elements that contribute most
    to the error. This strategy proceeds in a loop over four steps:


    +   **SOLVE** The boundary-value problem (14.1) is approximated by means of the
    BEM-based FEM on the current polygonal mesh using the approximation space \(V_h^k\).


    +   **ESTIMATE** An error estimator \(\eta_R\) as well as the element-wise error
    indicators \(\eta_P\) (see Section 14.3.2) are computed on the discretization
    \(\mathcal{T}_h\).


    +   **MARK** A minimal subset \(\mathcal{M}_h \subset \mathcal{T}_h\) of all elements
    are marked according to Dörfler strategy [125] such that


    ```

