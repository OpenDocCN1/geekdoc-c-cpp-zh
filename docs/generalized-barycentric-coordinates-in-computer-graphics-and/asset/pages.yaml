  md: 'and maximum entropy coordinates) are defined without restriction. The interpolation
    error has been analyzed under some strong geometric restrictions for harmonic
    and Wachspress coordinates, as discussed below.


    # 2.6.1 Harmonic coordinates in 3D and higher


    Based on the very general theory of elliptic partial differential equations, much
    of the analysis of harmonic coordinates applies to arbitrary dimensions. Only
    two key differences impact the final conclusions and statement of our results
    from the polygonal setting: the circumradius is no longer a good measure of simplex
    quality and the Sobolev embedding theorem allows more kinds of discontinuous functions
    in higher dimensions. We discuss each in turn.


    Tetrahedra known as “slivers,” defined by four vertices lying near a common circle,
    provide a simple example of the challenges of interpolation error analysis in
    three dimensions and higher. Slivers have a modest circumradius relative to their
    diameter but have a poor aspect ratio and exhibit large errors in linear interpolation.
    Accordingly, the 3D analogue of the constrained Delaunay triangulation, which
    minimizes large circumaradii, cannot be expected to control interpolation on par
    with harmonic coordinates.


    Broadly speaking, the Sobolev embedding theorem describes which Sobolev spaces
    admit discontinuous functions and which contain only continuous ones. Two critical
    parameters in this regard are the spatial dimension, d, and the exponent used
    in integration, p. Discontinuous functions are admitted in the associated Sobolev
    space W^{1,p}(Ω) when d > p, and, as d increases with p fixed, more functions
    are included in the space.


    What do these facts imply about harmonic coordinates? While harmonic coordinates
    can still be estimated by comparison to triangulation coordinates via a valid
    tetrahedralization of the domain, there is not a clear procedure for identifying
    the “best” tetrahedralization. Further, while it is true in d = 2 that the presence
    of a vertex near a non-incident edge of the polygon causes poor interpolation,
    analogous configurations in 3D still allow good interpolation errors. The shape
    quality metric of bounded aspect ratio can and is used to control the interpolation
    error, despite the fact that this is an overly restrictive geometric assumption.
    A sharp metric for harmonic coordinates in 3D is still unknown.


    # 2.6.2 Wachspress coordinates in 3D and higher


    One of the few types of generalized barycentric coordinates on polyhedra that
    is both relatively simple to implement and amenable to error analysis is the generalization
    of Wachspress coordinates by Warren et al. [411, 413]. Floater et al. [147] provide
    MATLAB® code for the computation of these coordinates on generic convex polyhedra
    and derive an interpolation error bound over a subclass of simple, convex polyhedra.


