    show that the spectrum of the cotan Laplacian obtains its minimum on a Delaunay
    triangulation in the sense that the $i$-th eigenvalue of the cotan Laplacian of
    any triangulation of a fixed point set in the plane is bounded below by the $i$-th
    eigenvalue resulting from the cotan Laplacian associated with the Delaunay triangulation
    of the given point set.


    # 5.3.3 Laplacians on simplicial manifolds


    Recall that in the smooth case, Laplacians acting on $k$-forms take the form


    ```

    $\Delta = dd^* + d^*d.$

    ```


    In order to mimic this construction in the discrete setting, one requires a bit
    more structure than just an arbitrary graph. To this end, consider a simplicial
    manifold, such as a triangulated surface. We keep referring to this manifold as
    $M$. As in the smooth case, for simplicity, suppose that $M$ is orientable and
    has no boundary.


    Simplicial manifolds allow for a natural definition of discrete $k$-forms as duals
    of $k$-cells. Indeed, every 0-form is a function defined on vertices, a 1-form
    $\alpha$ is dual to edges, that is, $\alpha(e)$ is a real number for any oriented
    1-cell (oriented edge), a 2-form is dual to oriented 2-cells, and so forth. In
    the sequel, let the linear space of discrete $k$-forms (better known as simplicial
    cochains) be denoted by $\mathcal{C}^k$.


    As in the smooth case, the discrete differential $\delta$ (better known as the
    coboundary operator) maps discrete $k$-forms to discrete $(k+1)$-forms, $\delta:
    \mathcal{C}^k \to \mathcal{C}^{k+1}$. Again as in the smooth case, the discrete
    differential can be defined by *postulating* Stokes’s formula: Let $\alpha$ be
    a discrete $k$-form. Then one requires that


    ```

    $\delta \alpha(\sigma) = \alpha(\partial \sigma)$

    ```


    for all $(k+1)$-cells $\sigma$, where $\partial$ denotes the simplicial boundary
    operator. The simplicial boundary operator, when applied to a vertex returns zero
    (since vertices do'
