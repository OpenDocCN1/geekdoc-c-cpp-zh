    # 13.6 OUTLOOK


    In summary, the principle of maximum entropy is a conceptually appealing and computationally
    practical approach to defining generalized barycentric coordinates for clouds
    of points. The resulting barycentric coordinates can be viewed as mesh-free basis
    functions and used in computational mechanics, exploiting their smoothness and
    the relative ease of implementing adaptive strategies. The fact that these basis
    functions are barycentric coordinates makes it easier to impose boundary conditions,
    but also provides a natural framework to couple maximum entropy basis functions
    with multivariate spline techniques. We have demonstrated this by blending maximum
    entropy approximations to B-spline boundary representations, but another attractive
    idea is using such blending to resolve the issues associated with irregular vertices
    in spline patches [263]. Open issues include the systematic formulation of feasible
    higher-order consistency conditions in multiple dimensions (see the discussion
    following (13.10)), and the accurate and efficient numerical quadrature of the
    integrals appearing in Galerkin methods, which involve products of derivatives
    of the non-polynomial LME basis functions. Finally, the applicability of the LME
    approach in higher (greater than three) space dimensions has not yet been exploited
    in applications.'
