    + O(1) \\ &= \frac{1}{2Rh} \int_{-\pi/2}^{\pi/2} \left( \sqrt{R^2 \cos^2 \theta
    - 2Rh \sin^2 \theta + R \cos \theta} \right) d\theta + O(1) \quad \text{as } h
    \to 0. \end{aligned}\)


    Further,


    \(\begin{aligned} \int_{-\pi/2}^{\pi/2} \sqrt{R^2 \cos^2 \theta - 2Rh \sin^2 \theta}
    \, d\theta &= 2R\mathcal{E}\left(1 + \frac{2h}{R}\right), \\ \Phi_1(\mathbf{x})
    &\sim \frac{2}{h} - \frac{1}{2R} \ln \frac{1}{h} + O(1) \quad \text{as } h \to
