  md: '![](img/4913dd83a2a14bc205a0a92cce102c82_199_0.png)


    Figure 10.4 Balance of forces on a small patch.


    # 10.2.1 Equilibrium equations


    Consider a point \(\boldsymbol{x}\) on \(M\), and \(\Omega\) a small neighborhood
    of \(\boldsymbol{x}\). As above, we project \(\Omega\) onto the \(xy\)-plane to
    yield a _top view_ \(\Omega \subset \mathbb{R}^2\), and parameterize \(\Omega\)
    by a height function \(z: \Omega \to \mathbb{R}\). The embedding of the patch
    is then given by \(\boldsymbol{r}(x,y) = (x,y,z(x,y))\) and the induced metric
    on \(\Omega\) is \(\mathsf{g} = I d\boldsymbol{x} \otimes d\boldsymbol{x}\).


    Internal forces acting through a boundary of \(\Omega\) are characterized by the
    stress tensor \(\boldsymbol{\sigma}: \Omega \to GL(2;\mathbb{R})\); for a tangent
    vector \(\boldsymbol{v}\) at a point on the top view, \(\boldsymbol{\sigma}\boldsymbol{v}\)
    measures the internal force that would result from making a small cut in \(\Omega\)
    in the tangent direction perpendicular to \(d\boldsymbol{v}\). Balance of forces
    on \(\Omega\) means that the internal forces integrated along \(\partial\Omega\)
    must exactly cancel the total external load on \(\Omega\) (see Figure 10.4), \(\int_\Omega
    F\hat{z} dA = \int_{\partial\Omega} d\boldsymbol{r}\sigma\mathsf{g}^{-1}\hat{n}
    ds,\)


    where \(dA = \sqrt{\det \mathsf{g}} dx dy\) is the area element on \(\Omega\),
    \(\hat{n}\) is the outward-pointing unit normal (with respect to the metric \(\mathsf{g}\))
    on the boundary \(\partial\Omega\), and \(ds\) is the differential on \(\partial\Omega\).
    Applying Stokes''s theorem and contracting \(\Omega\) to a point yields the pointwise
    equilibrium condition \(F\hat{z}\sqrt{\det \mathsf{g}} = \nabla \cdot [(\sqrt{\det
    \mathsf{g}})\mathsf{g}^{-1}\sigma\nabla \mathsf{r}],\)


    where the divergence operator \(\nabla \cdot\) is understood to act on matrices
    by producing a vector whose entries are the divergences of the columns of the
    matrix. Equilibrium conditions also exist on the free boundaries: the traction
    on these boundaries must be zero, that is, \(\sigma\mathsf{g}^{-1}\hat{n} = 0\),
    where \(\hat{n}\) is the boundary normal on \(\partial M\).


    Since the stress tensor is self-adjoint with respect to \(\mathsf{g}\), \(\boldsymbol{S}
    = (\sqrt{\det \mathsf{g}})\mathsf{g}^{-1}\boldsymbol{\sigma}\) is a symmetric
    matrix; the fact that \(M\) supports only compressive, and not tensile, internal
    forces becomes the constraint that \(\boldsymbol{S}\) is positive semidefinite.
    Therefore \(M\) is in static equilibrium if there exists a section of matrices
    \(\boldsymbol{S} \succeq 0\) over \(\Omega\) with \(F\hat{z}\sqrt{\det \mathsf{g}}
    = \nabla \cdot [\boldsymbol{S}\nabla \mathsf{r}] \quad (10.4)\)


    at every point on the interior of \(\Omega\).'
