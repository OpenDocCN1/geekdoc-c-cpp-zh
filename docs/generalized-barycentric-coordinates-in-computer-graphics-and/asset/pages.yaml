  md: 'circumradius of the triangle [225, 317]. Thus, while a bound on the circumradius
    implies a bound on the maximum angle and vice versa, the former has a more direct
    connection to the interpolation error.


    While a class of type t_max is sufficient for the interpolation analysis outlined
    in Section 2.2, it is not strictly necessary for the convergence of finite element
    methods, as demonstrated in [185]. However, the examples of convergent finite
    element methods on meshes with arbitrarily large angles employ shape function
    spaces that contain subspaces corresponding to shape-regular meshes. Thus, some
    form of shape regularity still appears to underlie successful finite element methods.


    These ideas have been generalized to tetrahedra and higher-dimensional simplices
    [7, 209, 231, 318]. On tetrahedra, the most widely known and used shape quality
    metric is aspect ratio, which on polyhedra is the ratio of the diameter of the
    element to the radius of the smallest inscribed sphere. Error analysis based on
    aspect ratio is straightforward to carry out, but is overly restrictive on the
    geometry, in the same way that a bound on the aspect ratio on triangles excludes
    permissible single-small-angle triangles. While a bound on the circumradius is
    closely tied to the interpolation error on triangles, the same is not true on
    tetrahedra due to the possibility of slivers. Slivers are very flat tetrahedra
    with evenly spaced vertices near a common circle such that the circumradius is
    modest. A metric called coplanarity [318] balances a weakened aspect ratio bound
    with an exclusion of sliver tetrahedra; it measures how far the edges of a tetrahedron
    lie to a common plane, thereby allowing narrow elements without allowing slivers.


    # 2.4 SHAPE QUALITY METRICS FOR POLYGONS AND POLYHEDRA


    For the class of diameter 1 triangles, we have just discussed how many common
    shape quality metrics are effectively equivalent. For the class of diameter 1
    polygons, however, these equivalences do not hold and the relations among metrics
    are more subtle. For example, a polygon can have high aspect ratio without any
    small interior angles or can have a modest aspect ratio with interior angles near
    180°. Some illustrative examples are shown in Figure 2.2.


    To analyze the polygonal setting, let P denote a generic polygon of diameter 1
    with edges {e_i}_{i=1}^n, vertices {v_i}_{i=1}^n, interior angles {alpha_i}_{i=1}^n,
