    # 7.3 VARIATIONAL BARYCENTRIC COORDINATES


    So far we have constructed complex barycentric coordinates with a closed-form
    expression. Such coordinates are efficient to compute, simple to implement, and
    have high numerical accuracy. We now introduce other types of coordinates that
    possess additional properties that are highly desirable in the context of planar
    shape deformation. These coordinates, unfortunately, do not possess a closed-form
    expression and are approximated numerically. While their derivation is more involved,
    the additional computational effort can be performed in a preprocessing step.
    Once the computation of the coordinates is completed, in runtime, the evaluation
    of the barycentric map is as efficient as any other barycentric map. This new
    type of coordinate obeys some variational principles and is considered optimal
    with respect to such principles. Such coordinates are obtained through the solution
    of a numerical optimization problem.


    # 7.3.1 Point-based barycentric maps


