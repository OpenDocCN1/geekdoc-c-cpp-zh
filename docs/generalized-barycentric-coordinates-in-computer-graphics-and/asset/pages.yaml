- pgno: 172
  md: '# 8.1 INTRODUCTION


    # 8.1.1 Bézier form of curves


    To begin, we consider one of the simplest instantiations of barycentric coordinates.
    Consider the domain defined by the interval [0, 1]. This interval yields barycentric
    coordinate functions


    ```

    \phi_0(x) = (1 - x),

    \phi_1(x) = x,

    (8.1)

    ```


    which reproduce constant and linear functions,


    ```

    \phi_0(x) + \phi_1(x) = 1,

    0 \cdot \phi_0(x) + 1 \cdot \phi_1(x) = x.

    ```


    If we examine the terms of the binomial expansion of \((\phi_0(x) + \phi_1(x))^m\),
    we obtain functions of the form


    ```

    B_j^m(x) = \binom{m}{j} (1 - x)^{m-j} x^j,

    (8.2)

    ```


    where \(m\) is the degree of the functions \(B_j^m(x)\). These functions are special
    functions called Bernstein basis functions. Associating these functions with control
    points \(f_j\) yields a Bézier curve


    ```

    F(x) = \sum_{j=0}^m B_j^m(x) f_j.

    ```


    Note that \(F(x)\) trivially reproduces constant functions due to the fact that
    \(\phi_0\) and \(\phi_1\) form a partition of unity. For example, if \(f_j = c\),
    then


    ```

    c = \sum_{j=0}^m B_j^m(x)c = c((1 - x) + x)^m.

    ```


    In addition, \(F(x)\) can also reproduce all polynomial functions up to degree
    \(m\). This last property follows directly from the linear reproduction property
    of barycentric coordinates. In particular, to reproduce a function \(x^k\) where
    \(k \le m\), there exists coefficients \(f_j\) such that


    ```

    F(x) = (\phi_0(x) + \phi_1(x))^{m-k} (0 \cdot \phi_0(x) + 1 \cdot \phi_1(x))^k
    = 1^{m-k} x^k = x^k,

    ```


    where the coefficients \(f_j\) are given by collecting the coefficients of \(B_j^m(x)\)
    in the polynomial expansion above. For example, to reproduce the function \(x\),
    the coefficients are given by \(f_j = j/m\). Such properties also follow directly
    from the theory of blossoming and polar forms [316], which is beyond the scope
    of this chapter.


    In addition, the barycentric coordinate functions \(\phi_i\) also impart a number
    of useful geometric properties on the resulting Bézier curves. For example, Bézier
    curves interpolate their end points due to the Lagrange property of barycentric
    coordinates. Bézier curves also fall within the convex hull of their control points
    over the interval \([0, 1]\) since \(0 \le \phi_i(x) \le 1\) for all \(x \in [0,
    1]\). The curves are also affinely'
