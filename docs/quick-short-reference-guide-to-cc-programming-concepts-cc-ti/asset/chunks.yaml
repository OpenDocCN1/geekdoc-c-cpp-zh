    internally by the compiler as which would be the most optimized way of execution
    in terms of time and space.


    Also, any function defined within a class (without adding the word “inline”) is
    by default inline request to the compiler for that particular function.


    Inline function will not work in below cases:


    1.  With Loop/switch/goto


    2.  For function not returning values, if return statement exist


    3.  Function containing static variables


    4.  With recursive functions


    # 24 C++ Namespace


    A namespace is a container for identifiers. A namespace is a declarative region
    that provides a scope to the identifiers (the names of types, functions, variables,
    etc.) inside it. Namespaces are used to organize code into logical groups and
    to prevent name collisions that can occur especially when your code base includes
    multiple libraries.


    A namespace is designed to overcome this difficulty and is used as additional
    information to differentiate similar functions, classes, variables etc. with the
    same name available in different libraries. Using namespace, you can define the
    context in which names are defined. In essence, a namespace defines a scope.


    # 25 C++ Classes & Objects


    The classes are the most important feature of C++ that leads to Object Oriented
    programming. Class is a user defined data type, which holds its own data members
    and member functions, which can be accessed and used by creating instance of that
    class.


    The variables inside class definition are called as data members and the functions
    are called member functions.


    For example: Class of birds, all birds can fly and they all have wings and beaks.
    So here flying is a behavior and wings and beaks are part of their characteristics.
    And there are many different birds in this class with different names but they
    all possess this behavior and characteristics.


    Similarly, class is just a blue print, which declares and defines characteristics
    and behavior, namely data members and member functions respectively. And all objects
    of this class will share these characteristics and behavior.


    An object is a member or an "instance" of a class. An object has a state in which
    all of its properties have values that you either explicitly define or that are
    defined by default settings. 


    # 26 C++ Inheritance


    Inheritance is the capability of one class to acquire properties and characteristics
    from another class. The class whose properties are inherited by other class is
    called the Parent or Base or Super class. And, the class which inherits properties
    of other class is called Child or Derived or Sub class.


    Inheritance makes the code reusable. When we inherit an existing class, all its
    methods and fields become available in the new class, hence code is reused.


    Inheritance Visibility Mode:


    Public Inheritance: This is the most used inheritance mode. In this the protected
    member of super class becomes protected members of sub class and public becomes
    public.


    Private Inheritance: In private mode, the protected and public members of super
    class become private members of derived class.


     Protected Inheritance: In protected mode, the public and protected members of
    Super class becomes protected members of Sub class.


    |  | Derived Class | Derived Class | Derived Class |


    | Base Class | Public Mode | Private Mode | Protected Mode |


    | Private | Not Inherited | Not Inherited | Not Inherited |


    | Protected | Protected | Private | Protected |


    | Public | Public | Private | Protected |


    In C++, There are five different types of Inheritance:


    Single Inheritance: In this type of inheritance one derived class inherits from
    only one base class. It is the simplest form of Inheritance.


    Multiple Inheritance: In this type of inheritance a single derived class may inherit
    from two or more than two base classes.


    Hierarchical Inheritance: In this type of inheritance, multiple derived classes
    inherits from a single base class.


    Multilevel Inheritance: In this type of inheritance the derived class inherits
    from a class, which in turn inherits from some other class. The Super class for
    one, is sub class for the other.


    Hybrid (Virtual) Inheritance: Hybrid Inheritance is combination of Hierarchical
    and Multilevel Inheritance.


    # 27 C++ Constructors


    Constructors are special class functions which performs initialization of every
    object. The Compiler calls the Constructor whenever an object is created. The
    name of constructor will be same as the name of the class, and constructors never
    have return type. Constructors can be defined either inside the class definition
    or outside class definition using class name and scope resolution “::” operator.


    In C++, There are three different types of Constructors:


    Default Constructor: Default constructor is the constructor which doesn''t take
    any argument. It has no parameter.


    Parameterized Constructor: These are the constructors with parameter. Using this
    Constructor you can provide different values to data members of different objects,
    by passing the appropriate values as argument.


    Copy Constructor: These are special type of Constructors which takes an object
    as argument, and is used to copy values of data members of one object into other
    object.


    Characteristics of Constructor:


    *   They are to be declared under public section


    *   They are invoked automatically once objects are created.


    *   They do not have any return types, not even return type “void”.


    *   Like other C++ function, they can have default arguments.


    *   Constructor cannot be virtual.


    *   We cannot refer to their addresses.


    *   An object with constructor/destructor can’t be used as member of any function.


    *   They make implicit class to the operators new and delete when memory allocation
    I s required.


