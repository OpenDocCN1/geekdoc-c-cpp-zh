    37. [37 C++ Points]\n\n# 1 C++ OOP (Object-oriented programming)\nObject-oriented\
    \ programming (`OOP`) refers to a programming paradigm based on the concept of\
    \ \"objects\", which can contain data (attributes) and code (methods). The goal\
    \ of `OOP` is to model real-world entities.\n\nBasic concepts of `OOP` are:\n\
    * Objects: An instance of a class.\n* Class: A blueprint for creating objects.\n\
    * Encapsulation: Grouping data and methods and restricting direct access to some\
    \ of the object's components.\n* Abstraction: Hiding complex implementation details\
    \ and showing only necessary features.\n* Inheritance: A mechanism where one class\
    \ acquires the properties of another.\n* Polymorphism: The ability of different\
    \ objects to be treated as instances of a common base class.\n* Function Overloading:\
    \ Multiple functions with the same name but different parameters.\n* Operator\
    \ Overloading: Defining new meanings for built-in operators.\n* Exception Handling:\
    \ A mechanism to handle runtime errors.\n* Late Binding: The process of resolving\
    \ function calls at runtime.\n* References: Using an alias for another variable.\n\
    \n# 2 C++ Advantages\n* `C++` is portable, efficient, and fast.\n* `C++` is rich\
    \ in inheritance, abstraction, and encapsulation.\n* `C++` allows for exception\
    \ handling and function overloading.\n* `C++` is used for a wide range of applications,\
    \ from GUI to 3D graphics.\n\n# 3 C++ Program\n```cpp\n#include <iostream>\n\n\
    using namespace std;\n\n// main() is where execution begins.\nint main() {\n \
    \   cout << \"Hello World\"; // prints Hello World\n    return 0;\n}\n```\n\n\
    # 4 C++ Tokens\nA `token` is the smallest element of a `C++` program that is meaningful\
    \ to the compiler. The `C++` parser recognizes these kinds of `tokens`: identifiers,\
    \ keywords, literals, operators, punctuators, and other separators. A stream of\
    \ these `tokens` makes up a translation unit.\n\n* Keywords: Predefined, reserved\
    \ words used in programming that have a special meaning. `Keywords` are part of\
    \ the syntax and cannot be used as an `identifier`. Example: `if`, `while`, `int`.\n\
    * Identifier: Used for any variable, function, data definition, etc. In the programming\
    \ language `C++`, an `identifier` is a combination of alphanumeric characters,\
    \ the first being a letter of the alphabet or an underline, and the remaining\
    \ being any letter of the alphabet, any numeric digit, or the underline.\n* Constant:\
    \ Treated just like regular variables except that their values cannot be modified\
    \ after their definition. Constants can be any numeric, string or char value.\
    \ Example: `123`, `23`, `\"c++\"`, `'j'` or `'k'` or `'l'`.\n* Operator: A symbol\
    \ that tells the compiler to perform specific mathematical or logical manipulations.\
    \ `C++` is rich in built-in `operators` and provides the following types of `operators`:\
    \ Arithmetic operator, logical operator and relational operator.\n\nExample:\n\
    * `cin`: Similar to `scanf()` in C.\n* `cout`: Similar to `printf()` in C.\n\n\
    ```cpp\ncin >> a;\ncout << a;\n```\n"
