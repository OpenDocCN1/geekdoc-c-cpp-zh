    \ C++ 条件语句]\n21. [21C++ 函数:]\n22. [22 C++ 数组:]\n23. [23C++ 内联函数]\n24. [24C++ 命名空间]\n\
    25. [25C++ 类与对象]\n26. [26C++ 继承]\n27. [27C++ 构造函数]\n28. [28C++ 析构函数]\n29. [29C++\
    \ 函数重载]\n30. [30C++ 运算符重载]\n31. [31C++ 抽象]\n32. [32C++ 封装]\n33. [33C++ 多态]\n34.\
    \ [34C++ 异常处理]\n35. [35C++ 晚绑定]\n36. [36C++ 引用]\n37. [37C++ 概念]\n\n# 1 C++ OOP（面向对象型编程）\n\
    面向对象编程（`OOP`）是一种基于“对象”概念的编程范式，包含数据（属性）和代码（方法）。\n\n`OOP` 的基本概念包括：\n* 对象：类的实例。\n\
    * 类：创建对象的蓝图。\n* 封装：将数据和方法组合在一起并限制直接访问。\n* 抽象：隐藏复杂的实现细节，仅显示必要的功能。\n* 继承：一个类获取另一个类属性的机制。\n\
    * 多态：不同对象被视为共同基类实例的能力。\n* 函数重载：同名但参数不同的函数。\n* 运算符重载：为内置运算符定义新含义。\n* 异常处理：处理运行时错误的机制。\n\
    * 晚绑定：在运行时解析函数调用的过程。\n* 引用：作为另一个变量的别名。\n\n# 2 C++ 优点\n* `C++` 具有可移植性、高效且快速。\n\
    * `C++` 在继承、抽象和封装方面非常丰富。\n* `C++` 允许异常处理和函数重载。\n* `C++` 用于广泛的应用，从 GUI 到 3D 图形。\n\
    \n# 3 C++ 程序\n```cpp\n#include <iostream>\n\nusing namespace std;\n\n// main()\
    \ 是执行开始的地方\nint main() {\n    cout << \"Hello World\"; // 打印 Hello World\n   \
    \ return 0;\n}\n```\n\n# 4 C++ 标记符\n`token` 是 `C++` 程序中编译器有意义的最小元素。`C++` 解析器识别以下类型的\
    \ `token`：标识符、关键字、字面量、运算符、标点符号和其他分隔符。`token` 的流构成了编译单元。\n\n* 关键字：编程中预定义的保留字，具有特殊含义。`关键字`\
    \ 是语法的一部分，不能作为标识符使用。\n* 标识符：用于任何变量、函数、数据定义等。在 `C++` 编程语言中，标识符是字母数字字符的组合，第一个可以是字母或下划线，其余可以是任何字母、数字或下划线。\n\
    * 常：处理方式与普通变量相似，但在定义后值不能修改。常量可以是任何数值、字符串或字符值。例如：`123`、`23`、`\"c++\"`、`'j'` 或 `'k'`\
    \ 或 `'l'`。\n* 运算符：告诉编译器执行特定数学或逻辑操作的符号。`C++` 拥有内置运算符，并提供了以下类型的 `运算符`：算术运算符、逻辑运算符和关系运算符。\n\
    \n示例：\n* `cin`：类似于 语言中的 `scanf()`。\n* `cout`：类似于 语言中的 `printf()`。\n\n```cpp\n\
    cin >> a;\ncout << a;\n```\n"
- fmt: "\nStandardization is very important at the time of coding. Everybody should\
    \ follow defined coding standards to increase the readability of their code. A\
    \ complex code with proper coding standards makes the code easy to understand\
    \ for the programmer. A proper standardized code also helps the entire project\
    \ to go-smooth. Using proper comments, following naming convention, proper documentation\
    \ of the code make the entire code simple, readable and self-explanatory. Programmers\
    \ can go into and easily find out what is going on inside the code and new people\
    \ can also get up to code easily.\n\nNow the question is whether standardize code\
    \ is directly related to project success? No. It is not directly linked to project\
    \ success but surely it helps a lot to make the whole project a successful one.\n\
    \n# 6 C++ Comments\n\nUse of comments is also very much helpful to understand\
    \ coding. Comments are the part of source code but they are disregarded by the\
    \ Compiler. The programmer can use them to include short explanations or observations\
    \ within the source code itself to make his/her code more readable.\n\nC++ allows\
    \ two ways of inserting comments:\n\n```cpp\n// Single line comments\n\n/* Multiple\
    \ line comment\n     Or Block comments */\n```\n\nUse comments before starting\
    \ a `Class`, a file, a method. This type of comments gives the description about\
    \ what the particular class, method is doing? It also mentions the purpose of\
    \ the `Class` and gives other description.\n\n# 7 C++ Identifiers\n\nA C++ identifier\
    \ is a name used to identify a `variable`, `function`, `class`, `module`, or any\
    \ other user-defined item. An identifier starts with a letter `A` to `Z` or `a`\
    \ to `z` or an underscore (`_`) followed by zero or more letters, underscores,\
    \ and digits (`0` to `9`). C++ does not allow punctuation characters such as `@`,\
    \ `$`, and `%` within identifiers.\n\n# 8 C++ Keywords\n\nKeywords are predefined,\
    \ reserved words used in programming that have a special meaning. `Keywords` are\
    \ part of the syntax and they cannot be used as an `identifier`. Example: `if`,\
    \ `while`, `int` etc.\n\n# 9 C++ Whitespace\n\nWhitespace is the term used in\
    \ C++ to describe blanks, tabs, newline characters and comments. Whitespace separates\
    \ one part of a statement from another and enables the compiler to identify where\
    \ one element in a statement, such as `int`, ends and the next element begins.\n\
    \n# 10 C++ NULL Statement\n\nAny line of code not ending with semicolon is called\
    \ a null statement in C++ because compiler does not recognize it as some executable\
    \ line of code.\n\nHence, it is very important to put semicolon at the end of\
    \ each line of code in C++.\n\n# 11 C++ Data Types\n\nClassifications of C++ Data\
    \ Types:\n\n- Basic data type: Such as `int`, `float`, `char`, `long`, `double`,\
    \ `long double`, etc. are basic inherent data types of C++\n- User-defined data\
    \ type: Structure & `Classes` and `Enum`\n- Derived data types: Arrays, `Functions`,\
    \ `Pointers` etc.\n\n# 12 C++ Variables\n\nA variable provides the named storage\
    \ that our programs can manipulate.\n\nExample: `Int i, j, k;`\n\nThe line `int\
    \ i, j, k;` both declares and defines the variables `i`, `j` and `k`; which instructs\
    \ the compiler to create variables named `i`, `j` and `k` of type `int`.\n\n#\
    \ 13 C++ Local Vs Global Variables\n\nVariables that are declared inside a function\
    \ or block are local variables. They can be used only by statements that are inside\
    \ that function or block of code.\n\nGlobal variables are defined outside of all\
    \ the functions, usually on top of the program. The global variables will hold\
    \ their value throughout the life-time of your program.\n\n# 14 C++ literals\n\
    \nA `literal` is some data that's presented directly in the code, rather than\
    \ indirectly through a variable or function call. Constants refer to fixed values\
    \ that the program may not alter and they are called `literals`.\n\n# 15 C++ Operators\n\
    \nAn `operator` is a symbol that tells the compiler to perform specific mathematical\
    \ or logical manipulations. `C++` is rich in built-in `operators` and provides\
    \ the following types of `operators`:\n\n- Arithmetic operator: Addition `+`,\
    \ Subtraction `-`, Multiplication `*`, Division `/`, Modulus `%`, Assignment `=`,\
    \ Increment `++`, Decrement `--`\n- Logical operator: AND `&&`, OR `||`, NOT `!`\n\
    - Relational operator: less than `<`, greater than `>`, equal to `==`, not equal\
    \ to `!=`, greater than or equal to `>=`, less than or equal to `<=`\n- Bitwise\
    \ operator: bitwise and `&`, bitwise or `|`, bitwise negate `~`, left shift `<<`,\
    \ right shift `>>`\n- Other operators: scope resolution `::`, indirection operator\
    \ `->`, `new` and `delete`, line feed operator `endl`, set width `setw(n)`, `n=`\
    \ number of spaces to be set\n\n# 16 C++ Modifiers\n\nA modifier is used to alter\
    \ the meaning of the base type so that it more precisely fits the needs of various\
    \ situations. There are four kinds of modifiers: `Signed`, `Unsigned`, `Short`\
    \ and `Long`.\n\nThe modifiers can be combined. For example, you can use `signed`\
    \ or `unsigned` with `long` or `short` modifiers. The correct use of modifiers\
    \ can reduce the memory usage. So if we know that our variable can never be negative\
    \ then to save memory we should use `unsigned` modifiers. And we should use `short`\
    \ modifier if we know the range of variable will be below 32,767.\n\n# 17 C++\
    \ Storage Classes\n\nStorage classes are used to manage the lifetime and scope\
    \ of the variables. A variable can have only one storage class. There are 4 types\
    \ of the storage classes:\n\n- Automatic: By default C++ uses automatic storage.\
    \ The scope of an automatic variable is within the block where it is declared.\n\
    - Static: The `static` storage can be used when you want to keep the value of\
    \ local variable during the life of the program. The `static` variable once created\
    \ will retain the value even if you exit the code block and enter it again.\n\
    - Register: The `register` storage is used if you want faster access to the variable.\
    \ The variable will get stored in the CPU register instead of RAM (memory). The\
    \ other properties of register storage are same as automatic storage, except the\
    \ location, where the variable is stored.\n- External: The external storage is\
    \ used when you want to access a global variable/object which is defined in file.\
    \ We use `extern` to specify the compiler that the current object is defined somewhere\
    \ else and not in current file.\n\n# 18 C++ Loops\n\nA loop statement allows us\
    \ to execute a statement or group of statements multiple times. C++ programming\
    \ language provides the following types of loop to handle looping requirements:\n\
    \n- `WHILE` Loop: Repeats a statement or group of statements while a given condition\
    \ is true. It tests the condition before executing the loop body.\n- `FOR` Loop:\
    \ Executes a sequence of statements multiple times and abbreviates the code that\
    \ manages the loop variable.\n- `Do..WHILE` Loop: Like a while statement, except\
    \ that it tests the condition at the end of the loop body.\n- Nested Loops: You\
    \ can use one or more loop inside another while, for or Do..While loop.\n\n# 19\
    \ C++ Loop Control Statement\n\nLoop control statements change execution from\
    \ its normal sequence. C++ supports the following control statements:\n\n- `BREAK`\
    \ Statement: Terminates the `loop` or `switch` statement and transfers execution\
    \ to the statement immediately following the loop or switch.\n- `CONTINUE` Statement:\
    \ Causes the loop to skip the remainder of its body and immediately retest its\
    \ condition prior to iterating.\n- `GOTO` Statement: Transfers control to the\
    \ labeled statement. Though it is not advised to use `GOTO` statement in your\
    \ program.\n\n# 20 C++ Conditional Statement\n\nConditional statement decide what\
    \ statements to be executed and what statements should not be executed depending\
    \ upon the specific condition.\n\nC++ provided following Conditional statements:\n\
    \n- `IF` Statement: Based on a condition, `IF` statement allows us to control\
    \ a program whether to execute specific statement or not. Condition can be true\
    \ or false.\n- `IF..ELSE` Statement: This means that when `IF` condition is true\
    \ then the statements within it will be executed, and when `IF` condition is false\
    \ then statements within `ELSE` condition will be executed.\n"
  raw: 'Standardization is very important at the time of coding. Everybody should
    follow defined coding standards to increase the readability of their code. A complex
    code with proper coding standards makes the code easy to understand for the programmer.
    A proper standardized code also helps the entire project to go-smooth. Using proper
    comments, following naming convention, proper documentation of the code make the
    entire code simple, readable and self-explanatory. Programmers can go into and
    easily find out what is going on inside the code and new people can also get up
    to code easily.


    Now the question is whether standardize code is directly related to project success?
    No. It is not directly linked to project success but surely it helps a lot to
    make the whole project a successful one.


    # 6 C++ Comments


    Use of comments is also very much helpful to understand coding. Comments are the
    part of source code but they are disregarded by the Compiler. The programmer can
    use them to include short explanations or observations within the source code
    itself to make his/her code more readable.


    C++ allows two ways of inserting comments:


    // Single line comments


    /* Multiple line comment


         Or Block comments */


    Use comments before starting a Class, a file, a method. This type of comments
    gives the description about what the particular class, method is doing? It also
    mentions the purpose of the Class and gives other description.


    # 7 C++ Identifiers


    A C++ identifier is a name used to identify a variable, function, class, module,
    or any other user-defined item. An identifier starts with a letter A to Z or a
    to z or an underscore (_) followed by zero or more letters, underscores, and digits
    (0 to 9). C++ does not allow punctuation characters such as @, $, and % within
    identifiers.


    # 8 C++ Keywords


    Keywords are predefined, reserved words used in programming that have a special
    meaning. Keywords are part of the syntax and they cannot be used as an identifier. 
    Example: if, while, int etc.


    # 9 C++ Whitespace


    Whitespace is the term used in C++ to describe blanks, tabs, newline characters
    and comments. Whitespace separates one part of a statement from another and enables
    the compiler to identify where one element in a statement, such as int, ends and
    the next element begins.


    # 10 C++ NULL Statement


    Any line of code not ending with semicolon is called a null statement in C++ because
    compiler does not recognize it as some executable line of code.


    Hence, it is very important to put semicolon at the end of each line of code in
    C++.


    # 11 C++ Data Types


    Classifications of C++ Data Types:


    *   Basic data type: Such as int, float, char, long, double, long double, etc.
    are basic inherent data types of C++


    *   User-defined data type: Structure & Classes and Enum


    *   Derived data types: Arrays, Functions, Pointers etc.


    # 12 C++ Variables


    A variable provides the named storage that our programs can manipulate. 


    Example: Int i, j, k;


    The line int i, j, k; both declares and defines the variables i, j and k; which
    instructs the compiler to create variables named i, j and k of type int.


    # 13 C++ Local Vs Global Variables


    Variables that are declared inside a function or block are local variables. They
    can be used only by statements that are inside that function or block of code. 


    Global variables are defined outside of all the functions, usually on top of the
    program. The global variables will hold their value throughout the life-time of
    your program.


    # 14 C++ literals 


    A literal is some data that''s presented directly in the code, rather than indirectly
    through a variable or function call. Constants refer to fixed values that the
    program may not alter and they are called literals.


    # 15 C++ Operators


    An operator is a symbol that tells the compiler to perform specific mathematical
    or logical manipulations. C++ is rich in built-in operators and provides the following
    types of operators:


    Arithmetic operator: Addition +, Subtraction -, Multiplication *, Division /,
    Modulus %, Assignment =, Increment ++, Decrement --


    Logical operator: AND &&, OR ||, NOT!


    Relational operator: less than <, greater than >, equal to ==, not equal to !=
    ,greater than or equal to >= , less than or equal to<=


    Bitwise operator: bitwise and & ,bitwise or |,bitwise negate ~, left shift <<,
    right shift >>


    Other operators:  scope resolution::, indirection operator ->, new and delete,
    line feed operator endl, set width setw(n), n= number of spaces to be set


    # 16 C++ Modifiers


    A modifier is used to alter the meaning of the base type so that it more precisely
    fits the needs of various situations. There are four kinds of modifiers: Signed,
    Unsigned, Short and Long.


    The modifiers can be combined. For example, you can use signed or unsigned with long
    or short modifiers. The correct use of modifiers can reduce the memory usage.
    So if we know that our variable can never be negative then to save memory we should
    use unsigned modifiers. And we should use short modifier if we know the range
    of variable will be below 32,767.


    # 17 C++ Storage Classes


    Storage classes are used to manage the lifetime and scope of the variables. A
    variable can have only one storage class. There are 4 types of the storage classes:


    Automatic: By default C++ uses automatic storage. The scope of an automatic variable
    is within the block where it is declared. 


    Static: The static storage can be used when you want to keep the value of local
    variable during the whole life of the program. The static variable once created
    will retain the value even if you exit the code block and enter it again. 


    Register: The register storage is used if you want faster access to the variable.
    The variable will get stored in the CPU register instead of RAM (memory). The
    other properties of the register storage are same as of automatic storage, except
    the location, where the variable is stored. 


    External: The external storage is used when you want to access a global variable/object
    which is defined in another file. We use extern to specify the compiler that the
    current object is defined somewhere else in other file and not in current file.


    # 18 C++ Loops


    A loop statement allows us to execute a statement or group of statements multiple
    times.  C++ programming language provides the following types of loop to handle
    looping requirements:


    WHILE Loop: Repeats a statement or group of statements while a given condition
    is true. It tests the condition before executing the loop body.


    FOR Loop:  Executes a sequence of statements multiple times and abbreviates the
    code that manages the loop variable.


    Do..WHILE Loop: Like a while statement, except that it tests the condition at
    the end of the loop body.


    Nested Loops: You can use one or more loop inside any another while, for or Do..While
    loop.


    # 19 C++ Loop Control Statement


    Loop control statements change execution from its normal sequence. 


    C++ supports the following control statements:


    BREAK Statement: Terminates the loop or switch statement and transfers execution
    to the statement immediately following the loop or switch.


    CONTINUE Statement: Causes the loop to skip the remainder of its body and immediately
    retest its condition prior to reiterating.


    GOTO Statement: Transfers control to the labeled statement. Though it is not advised
    to use GOTO statement in your program.


    # 20 C++ Conditional Statement


    Conditional statement decide what statements to be executed and what statements
    should not be executed depending upon the specific condition


    C++ provided following Conditional statements:


    IF Statement: Based on a condition, IF statement allows us to control a program
    whether to execute specific statement or not. Condition can be true or false.


    IF..ELSE Statement: This means that when IF condition is true then the statements
    within it will be executed, and when IF condition is false then statements within
    ELSE condition will be executed.'
