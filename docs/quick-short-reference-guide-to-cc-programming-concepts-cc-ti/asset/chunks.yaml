    # 1 C++ OOP (Object-oriented programming)


    Object-oriented programming (OOP) refers to a type of computer programming (software
    design) in which programmers define not only the data type of a data structure,
    but also the types of operations (functions) that can be applied to the data structure.


    C++ is an object oriented programming language. C++ is a case sensitive programming  language.
    The goal of object oriented programming is as follows:


    *   Clearer


    *   More reliable


    *   Easy maintenance of program


    Basic concepts of OOP are:


    Objects


    *   Is an instance of class


    *   Program objects should be chosen such that they match closely with the real
    world objects.


    *   When a program is executed, the objects interact by sending messages to one
    another.


    Class


    *   Class is a collection of objects of similar type.


    *   Class is used to combine the data and operations of a structure into a single
    entity.


    *   Once a class has been defined, any number of object can be created.


    Data Encapsulation


    *   Encapsulation is the mechanism that binds together code and the data it manipulates
    and keep both safe from outside interference and misuse.


    *   It groups all pieces of an object into one neat package.


    Data Abstraction


    *   Data abstraction is taking only the essential features without including all
    the background information


    Polymorphism


    *   “One interface multiple methods”. It is nothing but the ability to take more
    than one forms depending upon the arguments passed to a function.


     Inheritance


    *   Inheritance is a process by which objects of one class acquire the properties
    of objects of another class.


    *   The derived class inherits all the properties of the base class and has the
    properties of its own.


    Dynamic binding


    *   This is also called lazy initialization or runtime binding or late binding.


    *   At runtime only, it would be decided, which derived class method is called.


    # 2 C++ Advantages


    *   C++ is a highly portable language and is often the language of choice for
    multi-device, multi-platform app development.


    *   C++ is an object-oriented programming language and includes classes, inheritance,
    polymorphism, data abstraction and encapsulation.


    *   C++ has a rich function library.


    *   C++ allows exception handling, and function overloading which are not possible
    in C.


    *   C++ is a powerful, efficient and fast language. It finds a wide range of applications
    – from GUI applications to 3D graphics for games to real-time mathematical simulations.


    # 3 C++ Program


    C++ program, can be defined as a collection of objects that communicate via invoking
    each other''s methods


    #include <iostream>


    using namespace std;


    // main() is where program execution begins.


    int main() {


    cout << "Hello World"; // prints Hello World


    return 0;


    }


    Here, “iostream.h” is the library used in C++ for all program execution. This
    indulges utilities like data input streaming, data output streaming…


    There are two important objects of iostream class which are meant for the purpose.


    *   cin//similar to printf() in C


    *   cout //similar to scanf() in C


    For example:


    Say if a person wants to enter some value of a variable into the program, this
    could be done by the statement:


    cin>>a;


    Similarly, if a person wants to print some value on the screen, this could be
    done by the statement:


    cout<<a;


    Return 0; terminates main ( ) function and causes it to return the value 0 to
    the calling process.


    In C++, the semicolon is a statement terminator.


    # 4 C++ Tokens


    A token is the smallest element of a C++ program that is meaningful to the compiler.
    The C++ parser recognizes these kinds of tokens: identifiers, keywords, literals,
    operators, punctuators, and other separators. A stream of these tokens makes up
    a translation unit.


    Keyword: Keywords are predefined, reserved words used in programming that have
    a special meaning. Keywords are part of the syntax and they cannot be used as
    an identifier.  Example: if, while, int etc.


    Identifier: An identifier is used for any variable, function, data definition,
    etc. In the programming language C++, an identifier is a combination of alphanumeric
    characters, the first being a letter of the alphabet or an underline, and the
    remaining being any letter of the alphabet, any numeric digit, or the underline.


    Constant: constants are treated just like regular variables except that their
    values cannot be modified after their definition. Constants can be any numeric,
    string or char value. Example: 123, 23, “c++”, ‘j’ or ‘k’ or ‘l’ etc.


    String: String composed of words separated by whitespace.


    Operator: An operator is a symbol that tells the compiler to perform specific
    mathematical or logical manipulations. C++ is rich in built-in operators and provides
    the following types of operators: Arithmetic operator, logical operator and relational
    operator.


