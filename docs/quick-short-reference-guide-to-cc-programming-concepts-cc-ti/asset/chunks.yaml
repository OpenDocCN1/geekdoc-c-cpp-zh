    # C++ 引用和指针之间的一些重要区别


    引用在声明时必须初始化。因此，引用不能为 `NULL`。


    一旦引用被声明并初始化，就不可能再让该引用变量指向另一个对象。


    指针可以指向任何地方（`NULL`），但引用始终引用某个对象。


    我们不能像操作指针那样获取引用的地址。


    你不能像操作指针那样进行引用算术。


    ## 引用变量和引用参数


    引用本质上是一个隐式指针。


    引用可以用于：作为函数参数、作为函数的返回值，或作为独立的引用使用。


    默认情况下，`C++` 使用按值传递（call-by-value），但它提供了两种方法来实现按引用传递（call-by-reference）参数传递。首先，你可以显式地传递参数的指针。其次，你可以使用引用参数。


    当你创建一个独立引用时，你创建的只是对象变量的另一个名称。所有独立引用都必须在创建时初始化。


    基类引用可以指向派生类的对象。


    ### 引用的限制


    - 你不能引用另一个引用（我们无法获取引用的地址）

    - 无法创建引用数组，也无法创建指向引用的指针，或引用位域。

    - 引用变量一旦声明必须初始化，除非它是类的成员、函数参数或返回值。

    - 禁止空引用


    # # 37 C++ 重要要点


    1. `C++` 是一种区分大小写的编程语言。

    2. 在 `C++` 中，分号是语句的终止符。

    3. `C++` 支持单行注释和多行注释。任何注释内部的任何可用字符都会被 `C++` 编译器忽略。

    4. 任何不以分号结尾的代码行在 `C++` 中都被称为空语句（null statement）。

    5. `endl` 关键字用于在每行之后插入换行符。

    6. 全局变量在整个程序生命周期内将保持其值。

    7. 所有四个修饰符都可以应用于 `int` 类型。

    8. `char` 类型允许 `signed`（有符号）和 `unsigned`（无符号）修饰符。

    9. `double` 类型可以配合 `long` 修饰符使用。

    10. 修饰符可以组合。例如，你可以在 `long` 或 `short` 修饰符配合使用 `signed` 或 `unsigned`。

    11. 变量在使用之前必须声明。通常首选在程序开始时声明它们。

    12. 常量是指程序可能更改的固定值，它们被称为字面量（`literals`）。

    13. 类定义内部变量被称为数据成员，函数被称为成员函数。

    14. 类的成员函数可以在类内部定义，也可以在类外部定义。

    15. `C++` 中的类类似于 C 语言中的结构体，唯一的区别是类默认是私有（private）访问控制，而结构体默认为公共（public）。

    16. 面向对象编程（OOPS）的所有特性都围绕着 `C++` 中的类展开。继承、封装、抽象等。

    17. 类对象持有数据成员的独立副本。我们可以根据需要创建任意数量的类对象。

    18. 对象是类的实例，它持有类中声明的数据变量，并且成员函数在这些类对象上工作。

    19. 对象使用特殊的类函数构造函数（`Constructors`）进行初始化。

    20. 每当对象离开其作用域时，就会调用另一个特殊的类成员函数析构函数（`Destructor`），以释放对象保留的内存。

    21. 类定义以关键字 `class` 开头，后跟类名；类体由一对大括号包围。

    22. 类成员可以定义为公共（public）、私有（private）或保护（protected）。默认情况下成员被假设为私有。

    23. 类对象的公共数据成员可以使用直接成员访问运算符 `.` 进行访问。

    24. 私有和保护成员不能直接使用直接成员访问运算符 `->` 访问。

    25. 类构造函数是类中的特殊函数，在创建类的新对象时被调用。

    26. 析构函数也是一种特殊函数，在创建的对象删除时被调用。

    27. 拷贝构造函数是一种通过使用之前创建的同类对象初始化对象来创建对象的构造函数。

    28. 每个对象都有一个特殊的指针 `this` 指向对象本身。

    29. 指向类的方法与指向结构体的指针完全相同。事实上，类实际上只是一个带有函数的结构体。

    30. 类的数据成员和函数成员都可以声明为 `static`（静态）。

    31. 成员函数是指在类定义内部有声明并在类数据成员上工作的函数。

    32. 成员函数的定义可以在类定义内部，也可以在外部。

    33. `friend`（友元）函数允许完全访问类的私有和保护成员。

    34. 对于内联函数（inline function），编译器尝试在函数体内部展开代码以代替函数调用。

    35. 继承使得代码可重用。当我们继承一个现有的类时，它所有的方法和字段在新类中都变得可用，因此代码被重用了。

    36. 类中 `Private`（私有）之外的所有成员都是可继承的。

    37. 继承的目的是：代码重用、方法重写、`Virtual`（虚）的使用。

    38. 我们可以使用 `BREAK` 和 `GOTO` 等控制语句打破无限循环。

    39. 数组的大小是固定的。

    40. 数组元素在内存中连续分配。

    41. 数组元素通过索引访问。

    42. 抽象将代码分离为接口和实现。因此在设计组件时，你必须保持接口与实现独立，这样如果你更改底层实现，接口将保持完好。

    43. 除非确实需要暴露它们，否则将类成员默认设为私有是良好的封装示例。

    44. 晚绑定也称为动态绑定或运行时绑定。

    45. 如果内联函数包含任何循环（s）、`switch`、`GOTO` 或静态变量，则可能不起。

    46. `static` 成员函数不能是 `virtual`（虚）。

    47. `this` 关键字是存在于非静态函数体中的局部变量。

    48. `this` 指向当前类对象。

    49. `this` 关键字不需要声明，在函数定义中很少被显式引用。

    50. 函数重写停止继承。

    51. 纯虚函数是指在基类中没有定义的虚函数。

    52. 抽象类是包含至少一个纯虚函数的类。

    53. 我们不能创建抽象类的对象。

    54. 我们可以创建抽象类的指针和引用。

    55. 如果 `TRY` 块中没有发生异常，则 `CATCH` 块永远不会执行。

    56. 函数或整个类都可以声明为另一个类的友元。

    57. 指针是指非连续内存位置的简单引用。它存储其他变量的地址并指向其值。

    58. 我们可以使用 `typedef` 来定义某些长变量类型的类型。


