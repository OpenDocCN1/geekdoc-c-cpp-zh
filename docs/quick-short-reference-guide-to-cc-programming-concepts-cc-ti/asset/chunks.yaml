    Destructor is a special class function which destroys the object as soon as the
    scope of object ends. The destructor is called automatically by the compiler when
    the object goes out of scope.


    The syntax for destructor is same as that for the constructor, the class name
    is used for the name of destructor, with a tilde `~` sign as prefix to it. Destructors
    will never have any arguments.


    ### Characteristics of Destructor


    - A destructor never any arguments. so we cannot overload destructors.

    - They do not have return types, not even `void`.

    - A destructor will be invoked implicitly by the complier upon exit from the program
    to clean up storage that is no longer accessible.

    - Destructor can be `virtual` but `Constructor` cannot be `virtual`.


    # 29 C++ Function Overloading


    If any class have multiple functions with same names but different parameters
    then they are said to be overloaded.


    Function overloading is usually used to enhance the readability of the program.
    If you have to perform one single operation but with different number or types
    of arguments, then you can simply overload the function.


    Function can be overloaded either by changing number of Arguments or by having
    different types of argument.


    # 30 C++ Operator Overloading


    Operator overloading—less commonly known as `operator` ad hoc polymorphism—is
    a specific case of polymorphism, where different `operators` have different implementations
    depending on their arguments. `Operator overloading` is generally defined by the
    language, the programmer, or both.


    For example `+` operator can be overloaded to perform addition on various data
    types, like for `Integer`, `String` (concatenation) etc.


    ### Rules for overloading operators


    1. Only existing operators can be overloaded.

    2. The overload operator must have at least on operand that is of user defined
    type. New operators cannot be created.

    3. We cannot change basic meaning of any operator i.e we cannot use `+` for subtraction.

    4. Overload operators follow the syntax rules of original operators. They can’t
    be overridden.

    5. `Sizeof`, `.` (membership operator), `*` (pointer to member operator), `::`
    (scope resolution operator), `?:` (conditional operator) can’t be overloaded.

    6. `=` (assignment operator), `()` (function call operator), `[]` (subscripting
    operator), `->` (class member access operator) can’t be overloaded using friend
    functions.


    # 31 C++ Abstraction


    Data abstraction provides only essential information to the outside world and
    hiding their background details. Abstraction is one of the main concepts of the
    Object Oriented Programming. A class represents an “entity” that can communicate
    with other classes or functions. But, class can hide information about its data
    and behavior. It can be done by using `private` data members and functions. Class
    should provide access to only necessary information which is useful outside the
    class and we should hide its internal representation.


    A class communicates with the outer world by using `public` data member functions.
    These member functions are often called `interface` of a class. When you design
    a class, you should separate the `implementation` of a class with its interface.
    This will give you a possibility to easily change the behavior of the class without
    changing the interface code.


    Data abstraction increases the effectiveness of programs. For example: If you
    have a car and car gets start by putting the key. There is no need to understand
    how fuel comes from the tank inside the engine of a car and how it catches fire
    using a spark plug and how wheels rotate after combustion of fuel inside engine.
    All these details are abstracted from you when you drive a car. Because of these
    abstractions you can effectively drive a car because only essential information
    are visible to you that make you drive easily.


    # 32 C++ Encapsulation


    Encapsulation is the idea of hiding the details of how things are implemented
    without exposing full interface to the user. This allows the user to use the item
    without worrying about how it is implemented.


    In Object Oriented Programming, encapsulation represents binding data and functions
    into one container. This container hides the details of the data and the way functions
    process data.


    # 33 C++ Polymorphism


    The word polymorphism means having multiple forms of one thing. In Object Oriented
    Programming, polymorphism represents possibility to have multiple implementations
    of the same functions. The most interesting concepts of polymorphism are related
    to Inheritance. A pointer of base class can be used as pointer of derived class.


    # 34 C++ Exception Handling


    During the process of coding, the user may come across some errors which may be
    syntactically correct but may still give an undesired output. Such errors are
    which occur only when a specific condition is true are known as Exceptions.


    There are mainly two types of Exceptions:


    1. `Synchronous`: The simplest example of such an exception is ‘Divide by Zero’
    error. When a number is divided by zero it results in an undefined error (Exception)
    which is not handled by the compiler and rather needs to be taken care of by the
    Developer.

    2. `Asynchronous`: These types of exceptions cannot be controlled by the developer,
    such as Interrupts.


    In C++ exceptions are handled using the `try-catch` block. The basic idea behind
    this block is that:


    - First, the code to be executed is put in the `TRY` block.

    - Second, if an exception occurs then it is `THROWN`.

    - Finally, the exception thrown is caught by the `CATCH` block and handled appropriately.


    NOTE: if no exception occurs in the `TRY` block then the `CATCH` block is never
    executed.


    - When any exception object is generated and thrown, that exception is caught
    by corresponding `catch` statement, which processes the exception.

    - We can write more than one `catch` statement associated with a `try`.

    - Which `catch` statement to be invoked is to be determined by exception type.

    - When an exception is caught, argument variable will receive its value.

    - Any type of data could be possible caught.

    - If no exception occurs in the `TRY` block then none of `catch` gets executed.

    - `Throw` generates the exception class object.

    - If that exception has to be caught, then `throw` must be executed either from
    within a `try`, or from any called function within the `try` block (directly or
    indirectly).

    - If your code is generating an exception for which there is no applicable `catch`
    statement, an abnormal program termination may occur.

    - The `terminate()` function is called whenever the exception handling subsystem
    fails to find a matching `catch` statement.

    - It is also called if your program attempts to re throw an exception when no
    exception was originally thrown.

    - Throwing an unhandled exception causes the standard library function `terminate()`
    to be invoked.

    - A `try` block can be used inside a function.

    - We can write more than one `catch` associated with `try`. However, each `catch`
    must be defined to catch a different type of exception.


    # 35 C++ Late Binding


    Late binding is also known as Dynamic Binding or Runtime Binding.


    Sometimes compiler can’t know which function will be called till program is executed
    (runtime). This is known as late binding.


    `Binding` is the process which is used by the compiler to convert identifiers
    (such as variable and function names) into machine language addresses.


    It is a mechanism in which the method called by an object gets associated by name
    in runtime. Late binding happens when `virtual` keyword is used in member function
    declaration.


