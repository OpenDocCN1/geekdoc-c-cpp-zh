    # 21 C++ 函数


    为了使代码更具可读性，将要完成的任务分解为较小的模块或子程序。每个模块被称为一个 `function`（函数）。`function` 是执行某些操作的语句组/块。每个
    C++ 程序都至少有一个函数，即 `main()`。


    当程序调用函数时，程序的控制权会转移到被调用的函数。要调用函数，你只需要传递所需的参数连同函数名。可以使用三种方法调用函数：按值传递、按引用传递和按指针传递。


    ### 函数的优点

    - 将程序划分为函数（即逻辑块）将使代码变得清晰且易于理解。

    - 函数是可重用的，即你可以调用函数来多次执行相同的代码行，而无需重新编写它们。

    - 单个函数易于维护，即如果代码发生任何修改，你只需要修改该函数，而不需要改变程序的结构。


    # 22 C++ 数组


    数组是相同类型变量的集合。数组的大小是固定的。数组的元素在内存中连续分配。数组元素通过索引访问。简单来说，数组是连续存储并通过索引访问的相似对象的固定集合。


    # 23 C++ 内联函数


    在函数定义之前添加前缀“inline”是请求编译器将该函数设为内联；即在实际调用函数时，在生成可执行文件时，该行会被替换为函数定义本身。


    这是因为在执行过程中将小函数放入栈中和从栈中出的开销相对要大得多。因此，编译器会检查是否可以进行优化，并据此将函数内联。


    记住：`inline` 不是给编译器的命令，而是一个请求。


    编译器可能会执行或可能不执行内联函数，这实际上是由编译器内部决定的，即从时间和空间角度考虑最优化的执行方式。


    此外，在类内部定义的任何函数（不添加“inline”单词）默认都是向编译器提出的该特定函数的内联请求。


    内联函数在以下情况下将不起作用：

    1. 配合 `Loop`/`switch`/`goto` 使用

    2. 对于不返回值的函数，如果存在 `return` 语句

    3. 包含静态变量的函数

    4. 递归函数


    # 24 C++ 命名空间


    `namespace`（命名空间）是标识符的容器。`namespace`是一个声明区域，为其内部的标识符（类型、函数、变量等的名称）提供作用域。`Namespaces`
    用于将代码组织成逻辑组并防止命名冲突，特别是当你的代码库包含多个库时。


    `namespace` 的设计是为了克服这种困难，并用作额外信息，以区分不同库中具有相同名的相似函数、类、变量等。使用 `namespace`，你可以定义名称定义的上下文。从本质上说，`namespace`
    定义了一个域。


    # 25 C++ 类与对象


    类（Classes）是 C++ 中最重要的特征，它导致了面向对象的编程。`Class`（类）是一种用户定义的数据类型，它持有自己的数据成员和成员函数，可以通过创建该类的实例来访问和使用。


    类定义内部的变量被称为数据成员，函数被称为成员函数。


    例如：鸟的 `Class`，所有的鸟都会飞，而且它们都拥有翅膀和喙。在这里，飞行是一种行为，而翅膀和喙是它们特征的一部分。这个类中有许多不同的鸟，名称也不同，但它们都拥有这种行为和特征。


    同样，`class` 只是一个蓝图，它声明并定义特征和行为，即数据成员和成员函数。该类的所有对象将共享这些特征和行为。


    `object`（对象）是 `class` 的成员或“实例”。`object` 有一个状态，其中所有属性的值要么是你显式定义的，要么是由默认设置定义的的。


    # 26 C++ 继承


    继承是指一个类从另一个类获取属性和特征的能力。被其他类属性的类被称为 `Parent`（父类）、`Base`（基类）或 `Super`（超类）。继承其他类属性的类被称为
    `Child`（子类）、`Derived`（派生类）或 `Sub` 类。


    继承使得代码可重用。当我们继承一个现有类时，它所有的方法和字段在新类中都可用，因此代码被重用了。


    ### 继承可见性模式

    - **公有继承**：这是最常用的继承模式。在这种情况下，父类的 `protected` 成员变为子类的 `protected` 成员，`public` 变为
    `public`。

    - **私有继承**：在私有模式下，父类的 `protected` 和 `public` 成员变为派生类的 `private` 成员。

    - **保护性继承**：在保护模式下，父类的 `public` 和 `protected` 成员变为子类的 `protected` 成员。


    | | 基类 | 公有模式 | 私有模式 | 保护模式 |

    | :--- | :--- | :--- | :--- | :--- |

    | **私有** | 不继承 | 不继承 | 不继承 | 不继承 |

    | **保护** | 保护 | 私有 | 保护 |

    | **公有** | 公有 | 私有 | 保护 |


    在 C++ 中有五种继承类型：

    - **单继承**：在这种继承类型中，一个派生类只继承自一个基类。这是最简单的形式。

    - **多重继承**：在这种继承类型中，一个派生类可以继承自两个或多个基类。

    - **层级继承**：在这种继承类型中，多个派生类继承自同一个基类。

    - **多级继承**：在这种继承类型中，派生类继承自一个类，而该类又继承自另一个类。一个类的父类是另一个类的子类。

    - **混合继承（虚继承）**：混合继承是层级继承和多级继承的结合。


    # 27 C++ 构造函数


    构造函数是执行每个对象化的特殊类函数。当创建对象时，编译器调用构造函数。构造函数的名称与类名相同，且构造函数没有返回值。构造函数可以在类定义内部定义，也可以使用类名作用域解析运算符
    `::` 在类外定义。


    在 C++ 中有三种构造函数：

    - **默认构造函数**：不接受任何参数的构造函数。它没有参数。

    - **参数构造函数**：带有参数的构造函数。使用这种构造函数，可以通过传递适当的值为不同对象的数据成员提供不同的值。

    - **拷贝构造函数**：以对象为参数的构造构造函数用于将一个对象的数据成员的值拷贝到另一个对象。


