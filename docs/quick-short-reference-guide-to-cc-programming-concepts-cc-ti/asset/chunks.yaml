  trans: "\n\n在编码时，标准化非常重要。每个人都应该遵循定义的编码标准，以提高代码的可读性。具有适当编码标准的复杂代码会让程序员更容易理解代码。良好的标准化代码也有助于整个项目的顺利进行。使用适当的注释、遵循命名规范以及对代码进行适当的文档处理使得整个代码变得简单易读且自解释其义。程序员可以进入代码并轻松找到其内部正在发生什么，新人员也可以轻松上手。\n\
    \n现在问题是，标准化代码是否与项目的成功直接相关？不是的。它没有直接决定项目的成功，但无疑对让整个项目取得成功有很大帮助。\n\n# 6 C++ 注释\n\
    \n使用注释对于理解编码非常有帮助。注释是源代码的一部分，但它们会被编译器忽略。程序员可以使用它们在源代码中包含简短的解释或观察，以使他们的代码更具可读性。\n\
    \nC++ 允许两种插入注释的方式：\n\n```cpp\n// 单行注释\n\n/* 多行注释\n     或 块注释 */\n```\n\n在开始一个\
    \ `Class`、文件或方法之前使用注释。这种注释描述了特定的类或方法的作用是什么？它还提到了 `Class` 的目的并提供了其他描述。\n\n# 7 C++\
    \ 标识符\n\nC++ 标识符是用于标识 `variable`、`function`、`class`、`module` 或任何用户定义项目的名称。标识符以字母\
    \ `A` 到 `Z` 或 `a` 到 `z` 或下划线 (`_`）开头，跟随零或多个字母、下划线和数字 (`0` 到 `9`）。C++ 不允许在标识符中使用\
    \ `@`、`$` 和 `%` 等标点符号。\n\n# 8 C++ 关键字\n\n关键字是编程中预定义的保留字，具有特殊含义。`Keywords` 是语法的一部分，不能作为\
    \ `identifier`。例如：`if`、`while`、`int` 等。\n\n# 9 C++ 空格\n\n空白是 C++ 中用于描述空格、制表符、换行符和注释的术语。空白将语句的一部分与其他分开，并允许编译器识别语句中的一个元素（如\
    \ `int`）何时结束，下一个元素何时开始。\n\n# 10 C++ 空语句\n\nC++ 中任何不以分号结尾的代码行都被称为空语句，因为编译器不将其识别为某些可执行代码行。\n\
    \n因此，在 C++ 的每行代码末尾加上分号是非常重要的。\n\n# 11 C++ 数据类型\n\nC++ 数据类型的分类：\n\n- 基本数据类型：如 `int`、`float`、`char`、`long`、`double`、`long\
    \ double` 等是 C++ 的基本固有数据类型\n- 用户定义数据类型：结构 (Structure)、`Classes` 和枚举 (Enum)\n-\
    \ 派生数据类型：数组 (Arrays)、函数 (Functions)、指针 (Pointers) 等\n\n# 12 C++ 变量\n\n程序可以操作的命名存储。\n\
    \n示例：`Int i, j, k;`\n\n`int i, j, k;` 这一行既声明又定义了变量 `i`、`j` 和 `k`；指示编译器创建类型为 `int`\
    \ 的名为 `i`、`j` 和 `k` 的变量。\n\n# 13 C++ 局部与全局变量\n\n在函数或块内部定义的变量是局部变量。它们只能由该函数或代码块内部的语句使用。\n\
    \n全局变量定义所有函数之外，通常位于程序的顶部。全局变量在程序的整个生命周期内保持其值。\n\n# 14 C++ 字面量\n\n`literal` 是直接在代码中呈现的数据，而不是通过变量或函数调用间接呈现。常量指的是程序可能更改的固定值，它们被称为\
    \ `literals`。\n\n# 15 C++ 运算符\n\n`operator` 是一个告诉编译器执行特定数学或逻辑操作的符号。`C++` 拥有丰富的内置\
    \ `operators` 并提供了以下类型的运算符：\n\n- 算术运算符：加法 `+`、减法 `-`、乘法 `*`、除法 `/`、取模 `%`、赋值 `=`、自增\
    \ `++`、自减 `--`\n- 逻辑运算符：与 `&&`、或 `||`、非 `!`\n- 关系运算符：小于 `<`、大于 `>`、等于 `==`、不等于\
    \ `!=`、大于等于 `>=`、小于等于 `<=`\n- 位运算符：位与 `&`、位或 `|`、位取反 `~`、左移 `<<`、右移 `>>`\n- 其他运算符：作用域解析\
    \ `::`、间接运算符 `->`、`new` 和 `delete`、换行符 `endl`、设置宽度 `setw(n)`、`n=` 设置的空格数\n\n#\
    \ 16 C++ 修饰符\n\n修饰符用于更改基本类型的含义以便更精确地适应各种情况的需求。修饰符有四种：`Signed`、`Unsigned`、`Short`\
    \ 和 `Long`。\n\n修饰符可以组合。例如，你可以将 `signed` 或 `unsigned` 配合修饰符使用。正确使用修饰符可以减少内存占用。如果我们知道变量永远不会为负，为了节省内存，我们应该使用\
    \ `unsigned` 修饰符。如果我们知道变量的范围低于 32,767，我们应该使用 `short` 修饰符。\n\n# 17 C++ 存储类\n\n\
    存储类用于管理变量的生命周期作用域。变量只能有一个存储类。存储类有四种：\n\n- 自动 (Automatic)：C++ 默认使用自动存储。自动变量的作用域在其定义的块内。\n\
    - 静态 (Static)：当你想在程序运行期间保留局部变量的值时，可以使用 `static` 存储。`static` 变量一旦创建，即使退出代码块并再次进入也会保留该值。\n\
    - 寄存器 (Register)：如果你想更快地访问变量，使用 `register` 存储。变量将存储在 CPU 寄存器而不是 RAM（内存）中。寄存器存储的其他属性与自动存储相同，位置例外。\n\
    - 外部 (External)：当你想访问文件中定义的全局变量/对象时，使用外部存储。我们使用 `extern` 告知编译器当前对象定义在其他地方而不是当前文件中。\n\
    \n# 18 C++ 循环\n\n循环语句允许我们多次执行语句或一组语句。C++ 编程语言提供了以下类型的循环来处理循环需求：\n\n- `WHILE` 循环：当给定条件为真时重复语句或一组语句。它在执行循环体之前测试条件。\n\
    - `FOR` 循环：多次执行语句序列并缩短了管理循环变量的代码。\n- `Do..WHILE` 循环：类似于 while 语句，只是在循环体末尾测试条件。\n\
    - 嵌套循环：你可以在另一个 while、for 或 Do..While 循环中使用一个或多个循环。\n\n# 19 C++ 循环控制语句\n\n循环控制语句改变其正常执行顺序。C++\
    \ 支持以下控制语句：\n\n- `BREAK` 语句：终止 `loop` 或 `switch` 语句并将执行转移到紧随循环或 switch 之后的语句。\n\
    - `CONTINUE` 语句：导致循环跳过其剩余部分并在迭代之前重新测试条件。\n- `GOTO` 语句：跳转到标记语句。尽管不建议在程序中使用 `GOTO`\
    \ 语句。\n\n# 20 C++ 条件语句\n\n条件语句根据特定条件决定执行哪些语句以及不执行哪些语句。\n\nC++ 提供了以下条件语句：\n\n-\
    \ `IF` 语句：根据条件，`IF` 语句允许我们控制程序是否执行特定语句。条件可以为真或假。\n- `IF..ELSE` 语句：这意味着当 `IF` 条件为真时执行其内部的语句，而当\
    \ `IF` 条件为假时执行 `ELSE` 条件内部的语句。\n\n"
- fmt: '

    # SWITCH Statement

    A `switch` statement allows a variable to be tested for equality against a list
    of values.


    # 21 C++ Functions


    In order to make the code more readable, complete task to be performed is broken
    down in to small modules or sub-routines. Each of the modules is called a `function`.
    A `function` is a group/block of statements that perform some operations. Every
    C++ program has at least one function, which is `main()`.


    When a program calls a function, program control is transferred to the called
    function. To call a function, you simply need to pass the required parameters
    along with function name. Three methods can be used to call a function: Call by
    Value, Call by reference and Call by Pointer.


    ### Advantages of Function

    - Dividing the program into functions (i.e. logical blocks) will make the code
    clear and easy to understand.

    - Functions are reusable i.e. you can call a function to execute same lines of
    code multiple times without re-writing it.

    - Individual functions are easy to maintain i.e. In case of any modification in
    the code you can modify only the function without changing the structure of the
    program.


    # 22 C++ Arrays


    An array as a collection of variables of the same type. Arrays are fixed in size.
    Elements of an array will be allocated contiguously in memory. Elements of an
    array are accessed by an index. In simple words, an array is a fixed collection
    of similar objects stored contiguously and accessed by an index.


    # 23 C++ Inline Function


    Adding a prefix “inline” before a function definition is a request to the compiler
    to make the function inline; i.e. When the function is actually called, the line
    is replaced by the function definition itself while making executable file.


    This is because the overhead of putting the small functions in stack and popping
    while executing is comparatively more. So, compiler checks if optimization could
    be done and accordingly makes the function inline.


    Remember: `inline` is not a command to the compiler, just a request.


    The compiler may or may not execute the function as inline which is actually decided
    internally by the compiler as which would be the most optimized way of execution
    in terms of time and space.


    Also, any function defined within a class (without adding the word “inline”) is
    by default inline request to the compiler for that particular function.


    Inline function will not work in below cases:

    1. With `Loop`/`switch`/`goto`

    2. For function not returning values, if `return` statement exist

    3. Function containing static variables

    4. With recursive functions


    # 24 C++ Namespace


    A `namespace` is a container for identifiers. A `namespace` is a declarative region
    that provides a scope to the identifiers (the names of types, functions, variables,
    etc.) inside it. `Namespaces` are used to organize code into logical groups and
    to prevent name collisions that can occur especially when your code base includes
    multiple libraries.


    A `namespace` is designed to overcome this difficulty and is used as additional
    information to differentiate similar functions, classes, variables etc. with the
    same name available in different libraries. Using `namespace`, you can define
    the context in which names are defined. In essence, a `namespace` defines a scope.


    # 25 C++ Classes & Objects


    The classes are the most important feature of C++ that leads to Object Oriented
    programming. `Class` is a user defined data type, which holds its own data members
    and member functions, which can be accessed and used by creating instance of that
    class.


    The variables inside class definition are called as data members and the functions
    are called member functions.


    For example: `Class` of birds, all birds can fly and they all have wings and beaks.
    So here flying is a behavior and wings and beaks are part of their characteristics.
    And there are many different birds in this class with different names but they
    all possess this behavior and characteristics.


    Similarly, `class` is just a blue print, which declares and defines characteristics
    and behavior, namely data members and member functions respectively. And all objects
    of this class will share these characteristics and behavior.


    An `object` is a member or an "instance" of a `class`. An `object` has a state
    in which all of its properties have values that you either explicitly define or
    that are defined by default settings.


    # 26 C++ Inheritance


    Inheritance is the capability of one class to acquire properties and characteristics
    from another class. The class whose properties are inherited by other class is
    called the `Parent` or `Base` or `Super` class. And, the class which inherits
    properties of other class is called the `Child` or `Derived` or `Sub` class.


    Inheritance makes the code reusable. When we inherit an existing class, all its
    methods and fields become available in the new class, hence code is reused.


    ### Inheritance Visibility Mode

    - **Public Inheritance**: This is the most used inheritance mode. In this the
    `protected` member of super class becomes `protected` members of sub class and
    `public` becomes `public`.

    - **Private Inheritance**: In private mode, the `protected` and `public` members
    of super class become `private` members of derived class.

    - **Protected Inheritance**: In protected mode, the `public` and `protected` members
    of Super class becomes `protected` members of Sub class.


    | | Base Class | Public Mode | Private Mode | Protected Mode |

    | :--- | :--- | :--- | :--- |

    | **Private** | Not Inherited | Not Inherited | Not Inherited |

    | **Protected** | Protected | Private | Protected |

    | **Public** | Public | Private | Protected |


    In C++, there are five different types of Inheritance:

    - **Single Inheritance**: In this type of inheritance one derived class inherits
    from only one base class. It is the simplest form of Inheritance.

    - **Multiple Inheritance**: In this type of inheritance a single derived class
    may inherit from two or more than two base classes.

    - **Hierarchical Inheritance**: In this type of inheritance, multiple derived
    classes inherits from a single base class.

    - **Multilevel Inheritance**: In this type of inheritance the derived class inherits
    from a class, which in turn inherits from some other class. The Super class for
    one, is sub class for the other.

    - **Hybrid (Virtual) Inheritance**: Hybrid Inheritance is combination of Hierarchical
    and Multilevel Inheritance.


    # 27 C++ Constructors


    Constructors are special class functions which performs initialization of every
    object. The Compiler calls the Constructor whenever an object is created. The
    name of constructor will be same as the name of the class, and constructors never
    have return type. Constructors can be defined either inside the class definition
    or outside class definition using class name and scope resolution `::` operator.


    In C++, there are three different types of Constructors:

    - **Default Constructor**: Default constructor is the constructor which doesn''t
    take any argument. It has no parameter.

    - **Parameterized Constructor**: These are the constructors with parameter. Using
    this Constructor you can provide different values to data members of different
    objects, by passing the appropriate values as argument.

    - **Copy Constructor**: These are special type of Constructors which takes an
    object as argument, and is used to copy values of data members of one object into
    other object.


    ### Characteristics of Constructor:

    - They are to be declared under `public` section

    - They are invoked automatically once objects are created.

    - They do not have any return types, not even return type `void`.

    - Like other C++ function, they can have default arguments.

    - Constructor cannot be `virtual`.

    - We cannot refer to their addresses.

    - An object with constructor/destructor can’t be used as member of any function.

    - They make implicit class to the operators `new` and `delete` when memory allocation
    is required.


