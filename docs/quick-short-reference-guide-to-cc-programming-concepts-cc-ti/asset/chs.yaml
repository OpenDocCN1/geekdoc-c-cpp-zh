- "# C/C++ 编程概念快速上手指南：C/C++ 技巧与概念：所有 C/C++ 开发者和程序员的实用读物\n\n\n\n![](img/cover.jpeg)\n\
  \n\n\n# 1 C++ OOP（面向对象型编程）\n面向对象编程（`OOP`）是一种基于“对象”概念的编程范式，包含数据（属性）和代码（方法）。\n\n`OOP`\
  \ 的基本概念包括：\n* 对象：类的实例。\n* 类：创建对象的蓝图。\n* 封装：将数据和方法组合在一起并限制直接访问。\n* 抽象：隐藏复杂的实现细节，仅显示必要的功能。\n\
  * 继承：一个类获取另一个类属性的机制。\n* 多态：不同对象被视为共同基类实例的能力。\n* 函数重载：同名但参数不同的函数。\n* 运算符重载：为内置运算符定义新含义。\n\
  * 异常处理：处理运行时错误的机制。\n* 晚绑定：在运行时解析函数调用的过程。\n* 引用：作为另一个变量的别名。\n\n# 2 C++ 优点\n* `C++`\
  \ 具有可移植性、高效且快速。\n* `C++` 在继承、抽象和封装方面非常丰富。\n* `C++` 允许异常处理和函数重载。\n* `C++` 用于广泛的应用，从\
  \ GUI 到 3D 图形。\n\n# 3 C++ 程序\n```cpp\n#include <iostream>\n\nusing namespace std;\n\
  \n// main() 是执行开始的地方\nint main() {\n    cout << \"Hello World\"; // 打印 Hello World\n\
  \    return 0;\n}\n```\n\n# 4 C++ 标记符\n`token` 是 `C++` 程序中编译器有意义的最小元素。`C++` 解析器识别以下类型的\
  \ `token`：标识符、关键字、字面量、运算符、标点符号和其他分隔符。`token` 的流构成了编译单元。\n\n* 关键字：编程中预定义的保留字，具有特殊含义。`关键字`\
  \ 是语法的一部分，不能作为标识符使用。\n* 标识符：用于任何变量、函数、数据定义等。在 `C++` 编程语言中，标识符是字母数字字符的组合，第一个可以是字母或下划线，其余可以是任何字母、数字或下划线。\n\
  * 常：处理方式与普通变量相似，但在定义后值不能修改。常量可以是任何数值、字符串或字符值。例如：`123`、`23`、`\"c++\"`、`'j'` 或 `'k'`\
  \ 或 `'l'`。\n* 运算符：告诉编译器执行特定数学或逻辑操作的符号。`C++` 拥有内置运算符，并提供了以下类型的 `运算符`：算术运算符、逻辑运算符和关系运算符。\n\
  \n示例：\n* `cin`：类似于 语言中的 `scanf()`。\n* `cout`：类似于 语言中的 `printf()`。\n\n```cpp\ncin\
  \ >> a;\ncout << a;\n```\n\n\n\n\n在编码时，标准化非常重要。每个人都应该遵循定义的编码标准，以提高代码的可读性。具有适当编码标准的复杂代码会让程序员更容易理解代码。良好的标准化代码也有助于整个项目的顺利进行。使用适当的注释、遵循命名规范以及对代码进行适当的文档处理使得整个代码变得简单易读且自解释其义。程序员可以进入代码并轻松找到其内部正在发生什么，新人员也可以轻松上手。\n\
  \n现在问题是，标准化代码是否与项目的成功直接相关？不是的。它没有直接决定项目的成功，但无疑对让整个项目取得成功有很大帮助。\n\n# 6 C++ 注释\n\n\
  使用注释对于理解编码非常有帮助。注释是源代码的一部分，但它们会被编译器忽略。程序员可以使用它们在源代码中包含简短的解释或观察，以使他们的代码更具可读性。\n\n\
  C++ 允许两种插入注释的方式：\n\n```cpp\n// 单行注释\n\n/* 多行注释\n     或 块注释 */\n```\n\n在开始一个 `Class`、文件或方法之前使用注释。这种注释描述了特定的类或方法的作用是什么？它还提到了\
  \ `Class` 的目的并提供了其他描述。\n\n# 7 C++ 标识符\n\nC++ 标识符是用于标识 `variable`、`function`、`class`、`module`\
  \ 或任何用户定义项目的名称。标识符以字母 `A` 到 `Z` 或 `a` 到 `z` 或下划线 (`_`）开头，跟随零或多个字母、下划线和数字 (`0` 到\
  \ `9`）。C++ 不允许在标识符中使用 `@`、`$` 和 `%` 等标点符号。\n\n# 8 C++ 关键字\n\n关键字是编程中预定义的保留字，具有特殊含义。`Keywords`\
  \ 是语法的一部分，不能作为 `identifier`。例如：`if`、`while`、`int` 等。\n\n# 9 C++ 空格\n\n空白是 C++ 中用于描述空格、制表符、换行符和注释的术语。空白将语句的一部分与其他分开，并允许编译器识别语句中的一个元素（如\
  \ `int`）何时结束，下一个元素何时开始。\n\n# 10 C++ 空语句\n\nC++ 中任何不以分号结尾的代码行都被称为空语句，因为编译器不将其识别为某些可执行代码行。\n\
  \n因此，在 C++ 的每行代码末尾加上分号是非常重要的。\n\n# 11 C++ 数据类型\n\nC++ 数据类型的分类：\n\n- 基本数据类型：如 `int`、`float`、`char`、`long`、`double`、`long\
  \ double` 等是 C++ 的基本固有数据类型\n- 用户定义数据类型：结构 (Structure)、`Classes` 和枚举 (Enum)\n- 派生数据类型：数组\
  \ (Arrays)、函数 (Functions)、指针 (Pointers) 等\n\n# 12 C++ 变量\n\n程序可以操作的命名存储。\n\n示例：`Int\
  \ i, j, k;`\n\n`int i, j, k;` 这一行既声明又定义了变量 `i`、`j` 和 `k`；指示编译器创建类型为 `int` 的名为 `i`、`j`\
  \ 和 `k` 的变量。\n\n# 13 C++ 局部与全局变量\n\n在函数或块内部定义的变量是局部变量。它们只能由该函数或代码块内部的语句使用。\n\n全局变量定义所有函数之外，通常位于程序的顶部。全局变量在程序的整个生命周期内保持其值。\n\
  \n# 14 C++ 字面量\n\n`literal` 是直接在代码中呈现的数据，而不是通过变量或函数调用间接呈现。常量指的是程序可能更改的固定值，它们被称为\
  \ `literals`。\n\n# 15 C++ 运算符\n\n`operator` 是一个告诉编译器执行特定数学或逻辑操作的符号。`C++` 拥有丰富的内置\
  \ `operators` 并提供了以下类型的运算符：\n\n- 算术运算符：加法 `+`、减法 `-`、乘法 `*`、除法 `/`、取模 `%`、赋值 `=`、自增\
  \ `++`、自减 `--`\n- 逻辑运算符：与 `&&`、或 `||`、非 `!`\n- 关系运算符：小于 `<`、大于 `>`、等于 `==`、不等于 `!=`、大于等于\
  \ `>=`、小于等于 `<=`\n- 位运算符：位与 `&`、位或 `|`、位取反 `~`、左移 `<<`、右移 `>>`\n- 其他运算符：作用域解析 `::`、间接运算符\
  \ `->`、`new` 和 `delete`、换行符 `endl`、设置宽度 `setw(n)`、`n=` 设置的空格数\n\n# 16 C++ 修饰符\n\n\
  修饰符用于更改基本类型的含义以便更精确地适应各种情况的需求。修饰符有四种：`Signed`、`Unsigned`、`Short` 和 `Long`。\n\n修饰符可以组合。例如，你可以将\
  \ `signed` 或 `unsigned` 配合修饰符使用。正确使用修饰符可以减少内存占用。如果我们知道变量永远不会为负，为了节省内存，我们应该使用 `unsigned`\
  \ 修饰符。如果我们知道变量的范围低于 32,767，我们应该使用 `short` 修饰符。\n\n# 17 C++ 存储类\n\n存储类用于管理变量的生命周期作用域。变量只能有一个存储类。存储类有四种：\n\
  \n- 自动 (Automatic)：C++ 默认使用自动存储。自动变量的作用域在其定义的块内。\n- 静态 (Static)：当你想在程序运行期间保留局部变量的值时，可以使用\
  \ `static` 存储。`static` 变量一旦创建，即使退出代码块并再次进入也会保留该值。\n- 寄存器 (Register)：如果你想更快地访问变量，使用\
  \ `register` 存储。变量将存储在 CPU 寄存器而不是 RAM（内存）中。寄存器存储的其他属性与自动存储相同，位置例外。\n- 外部 (External)：当你想访问文件中定义的全局变量/对象时，使用外部存储。我们使用\
  \ `extern` 告知编译器当前对象定义在其他地方而不是当前文件中。\n\n# 18 C++ 循环\n\n循环语句允许我们多次执行语句或一组语句。C++ 编程语言提供了以下类型的循环来处理循环需求：\n\
  \n- `WHILE` 循环：当给定条件为真时重复语句或一组语句。它在执行循环体之前测试条件。\n- `FOR` 循环：多次执行语句序列并缩短了管理循环变量的代码。\n\
  - `Do..WHILE` 循环：类似于 while 语句，只是在循环体末尾测试条件。\n- 嵌套循环：你可以在另一个 while、for 或 Do..While\
  \ 循环中使用一个或多个循环。\n\n# 19 C++ 循环控制语句\n\n循环控制语句改变其正常执行顺序。C++ 支持以下控制语句：\n\n- `BREAK`\
  \ 语句：终止 `loop` 或 `switch` 语句并将执行转移到紧随循环或 switch 之后的语句。\n- `CONTINUE` 语句：导致循环跳过其剩余部分并在迭代之前重新测试条件。\n\
  - `GOTO` 语句：跳转到标记语句。尽管不建议在程序中使用 `GOTO` 语句。\n\n# 20 C++ 条件语句\n\n条件语句根据特定条件决定执行哪些语句以及不执行哪些语句。\n\
  \nC++ 提供了以下条件语句：\n\n- `IF` 语句：根据条件，`IF` 语句允许我们控制程序是否执行特定语句。条件可以为真或假。\n- `IF..ELSE`\
  \ 语句：这意味着当 `IF` 条件为真时执行其内部的语句，而当 `IF` 条件为假时执行 `ELSE` 条件内部的语句。\n\n\n\n\n\n## switch\
  \ 语句\n`switch` 语句允许对变量与一组值进行等值性测试。\n\n# 21 C++ 函数\n\n为了使代码更具可读性，将要完成的任务分解为较小的模块或子程序。每个模块被称为一个\
  \ `function`（函数）。`function` 是执行某些操作的语句组/块。每个 C++ 程序都至少有一个函数，即 `main()`。\n\n当程序调用函数时，程序的控制权会转移到被调用的函数。要调用函数，你只需要传递所需的参数连同函数名。可以使用三种方法调用函数：按值传递、按引用传递和按指针传递。\n\
  \n## 函数的优点\n- 将程序划分为函数（即逻辑块）将使代码变得清晰且易于理解。\n- 函数是可重用的，即你可以调用函数来多次执行相同的代码行，而无需重新编写它们。\n\
  - 单个函数易于维护，即如果代码发生任何修改，你只需要修改该函数，而不需要改变程序的结构。\n\n# 22 C++ 数组\n\n数组是相同类型变量的集合。数组的大小是固定的。数组的元素在内存中连续分配。数组元素通过索引访问。简单来说，数组是连续存储并通过索引访问的相似对象的固定集合。\n\
  \n# 23 C++ 内联函数\n\n在函数定义之前添加前缀“inline”是请求编译器将该函数设为内联；即在实际调用函数时，在生成可执行文件时，该行会被替换为函数定义本身。\n\
  \n这是因为在执行过程中将小函数放入栈中和从栈中出的开销相对要大得多。因此，编译器会检查是否可以进行优化，并据此将函数内联。\n\n记住：`inline` 不是给编译器的命令，而是一个请求。\n\
  \n编译器可能会执行或可能不执行内联函数，这实际上是由编译器内部决定的，即从时间和空间角度考虑最优化的执行方式。\n\n此外，在类内部定义的任何函数（不添加“inline”单词）默认都是向编译器提出的该特定函数的内联请求。\n\
  \n内联函数在以下情况下将不起作用：\n1. 配合 `Loop`/`switch`/`goto` 使用\n2. 对于不返回值的函数，如果存在 `return`\
  \ 语句\n3. 包含静态变量的函数\n4. 递归函数\n\n# 24 C++ 命名空间\n\n`namespace`（命名空间）是标识符的容器。`namespace`是一个声明区域，为其内部的标识符（类型、函数、变量等的名称）提供作用域。`Namespaces`\
  \ 用于将代码组织成逻辑组并防止命名冲突，特别是当你的代码库包含多个库时。\n\n`namespace` 的设计是为了克服这种困难，并用作额外信息，以区分不同库中具有相同名的相似函数、类、变量等。使用\
  \ `namespace`，你可以定义名称定义的上下文。从本质上说，`namespace` 定义了一个域。\n\n# 25 C++ 类与对象\n\n类（Classes）是\
  \ C++ 中最重要的特征，它导致了面向对象的编程。`Class`（类）是一种用户定义的数据类型，它持有自己的数据成员和成员函数，可以通过创建该类的实例来访问和使用。\n\
  \n类定义内部的变量被称为数据成员，函数被称为成员函数。\n\n例如：鸟的 `Class`，所有的鸟都会飞，而且它们都拥有翅膀和喙。在这里，飞行是一种行为，而翅膀和喙是它们特征的一部分。这个类中有许多不同的鸟，名称也不同，但它们都拥有这种行为和特征。\n\
  \n同样，`class` 只是一个蓝图，它声明并定义特征和行为，即数据成员和成员函数。该类的所有对象将共享这些特征和行为。\n\n`object`（对象）是 `class`\
  \ 的成员或“实例”。`object` 有一个状态，其中所有属性的值要么是你显式定义的，要么是由默认设置定义的的。\n\n# 26 C++ 继承\n\n继承是指一个类从另一个类获取属性和特征的能力。被其他类属性的类被称为\
  \ `Parent`（父类）、`Base`（基类）或 `Super`（超类）。继承其他类属性的类被称为 `Child`（子类）、`Derived`（派生类）或\
  \ `Sub` 类。\n\n继承使得代码可重用。当我们继承一个现有类时，它所有的方法和字段在新类中都可用，因此代码被重用了。\n\n## 继承可见性模式\n-\
  \ **公有继承**：这是最常用的继承模式。在这种情况下，父类的 `protected` 成员变为子类的 `protected` 成员，`public` 变为\
  \ `public`。\n- **私有继承**：在私有模式下，父类的 `protected` 和 `public` 成员变为派生类的 `private` 成员。\n\
  - **保护性继承**：在保护模式下，父类的 `public` 和 `protected` 成员变为子类的 `protected` 成员。\n\n| | 基类\
  \ | 公有模式 | 私有模式 | 保护模式 |\n| :--- | :--- | :--- | :--- | :--- |\n| **私有** | 不继承 |\
  \ 不继承 | 不继承 | 不继承 |\n| **保护** | 保护 | 私有 | 保护 |\n| **公有** | 公有 | 私有 | 保护 |\n\n在 C++\
  \ 中有五种继承类型：\n- **单继承**：在这种继承类型中，一个派生类只继承自一个基类。这是最简单的形式。\n- **多重继承**：在这种继承类型中，一个派生类可以继承自两个或多个基类。\n\
  - **层级继承**：在这种继承类型中，多个派生类继承自同一个基类。\n- **多级继承**：在这种继承类型中，派生类继承自一个类，而该类又继承自另一个类。一个类的父类是另一个类的子类。\n\
  - **混合继承（虚继承）**：混合继承是层级继承和多级继承的结合。\n\n# 27 C++ 构造函数\n\n构造函数是执行每个对象化的特殊类函数。当创建对象时，编译器调用构造函数。构造函数的名称与类名相同，且构造函数没有返回值。构造函数可以在类定义内部定义，也可以使用类名作用域解析运算符\
  \ `::` 在类外定义。\n\n在 C++ 中有三种构造函数：\n- **默认构造函数**：不接受任何参数的构造函数。它没有参数。\n- **参数构造函数**：带有参数的构造函数。使用这种构造函数，可以通过传递适当的值为不同对象的数据成员提供不同的值。\n\
  - **拷贝构造函数**：以对象为参数的构造构造函数用于将一个对象的数据成员的值拷贝到另一个对象。\n\n# 28 C++ 析构函数\n\n\n\n\n析构函数是一种特殊的类函数，它在对象的作用域结束时立即销毁对象。当对象超出作用域时，编译器会自动调用析构函数。\n\
  \n析构函数的语法与构造函数相同，使用类名作为析构函数的名称，并在前面加上波浪号 `~`。析构函数永远不会有任何参数。\n\n## 析构函数的特点\n\n- 析构函数没有任何参数，因此我们不能对重载析构函数。\n\
  - 它们没有返回值，即使是 `void` 也不行。\n- 程序退出时，编译器会隐式地调用析构函数以清理不再可访问的存储。\n- 析构函数可以是 `virtual`（虚函数），但`Constructor（构造函数）不能是虚函数。\n\
  \n# 29 C++ 函数重载\n\n如果一个类有多个同名但参数不同的函数，则它们被称为重载。\n\n函数重载通常用于增强程序的可读性。如果你需要执行同一个单一操作，但使用的参数数量或类型不同，那么你就可以简单地重载该函数。\n\
  \n可以通过改变参数的数量或使用不同类型的参数来重载函数。\n\n# 30 C++ 运算符重载\n\n运算符重载——也少为人知的 `operator` 临时多态——是多态的一种特殊情况，其中不同的\
  \ `operators` 根据其参数有不同的实现。`运算符重载`通常由语言、程序员或两者共同定义。\n\n例如，`+` 运算符可以重载以对各种数据类型执行加法操作，比如对于\
  \ `Integer（整数）`、`String（字符串）`等。\n\n## 运算符重载规则\n\n1. 只有现有的运算符可以重载。\n2. 重载运算符必须至少有一个操作数是自定义类型。不能创建新的运算符。\n\
  3. 我们不能改变任何运算符的原始含义，即我们不能用 `+` 用于减法。\n4. 重载运算符遵循原始运算符的语法规则。它们不能被重写。\n5. `Sizeof`、`.`（成员运算符）、`*`（成员指针运算符）、`::`（作用域解析运算符）、`?:`（条件运算符）不能被重载。\n\
  6. `=`（赋值运算符）、`()`（函数调用运算符）、`[]`（下标运算符）、`->`（类成员访问运算符）不能通过友元函数进行重载。\n\n# 31 C++\
  \ 抽象\n\n数据抽象仅向外部世界提供基本信息并隐藏其背景细节。抽象是面向对象编程的主要概念之一。类代表一个可以与其他类或函数通信的“实体”。但类可以隐藏关于其数据和行为的信息。这可以通过使用\
  \ `private` 数据成员和函数来实现。类应该只提供对类外有用的必要信息的访问，我们应该隐藏它的内部表示。\n\n类通过使用 `public` 数据成员函数与外部世界通信。这些成员函数通常被称为类的\
  \ `interface（接口）`。当你设计一个类时，你应该将类的 `implementation（实现）` 与它的接口分开。这将让你有可能在不更改接口代码的情况下轻松更改类的行为。\n\
  \n数据抽象提高了程序的有效性。例如：如果你有一辆汽车，通过插入钥匙即可启动。你不需要理解燃料是如何从汽车内部油箱进入引擎的，如何通过火花塞点燃，以及燃料在引擎内燃烧后车轮是如何旋转的。当你开车时，所有这些细节都对你抽象了。正因为这些抽象，你可以有效地开车，因为对你可见的只有那些让你开车变得轻松的必要信息。\n\
  \n# 32 C++ 封装\n\n封装是一种隐藏事物实现细节的想法，而不向用户暴露完整的接口。这允许用户使用该项物品而不必担心它是如何实现的。\n\n在面向对象编程中，封装代表将数据和函数绑定到一个容器中。这个容器隐藏了数据的细节以及函数处理数据的方式。\n\
  \n# 33 C++ 多态\n\n多态是隐藏事物实现细节的想法，而不向用户暴露完整的接口。多态代表具有相同接口的多个实现。在面向对象编程中，多态代表同一个事物具有多种形式。多态最有趣的概念与继承有关。\n\
  \n# 34 C++ 异常处理\n\n在编码过程中，用户可能会遇到语法上正确但可能产生非预期输出的错误。只有当特定条件为真时才会发生的错误才被称为异常。\n\n\
  异常主要有两种类型：\n\n1. `Synchronous（同步异常）`：这种异常最简单的例子是除以零。当数字除以零时产生的错误不是由编译器处理，而是需要开发者来处理。\n\
  2. `Asynchronous（异步异常）`：这些异常无法由开发者控制，例如中断。\n\nC++ 使用 `try-catch` 块来处理异常。该块的基本思想是：\n\
  \n- 首先，将要执行的代码放在 `TRY` 块中。\n- 其次，如果发生异常，它会被 `THROWN（抛出）`。\n- 最后，抛出的异常会被 `CATCH`\
  \ 块捕获并适当处理。\n\n注意：如果 `TRY` 块没有发生异常，则不会执行 `CATCH`。\n\n- 当任何异常对象生成并抛出时，它会被相应的 `catch`\
  \ 语句捕获。\n- 我们可以为一个 `try` 编写多个 `catch` 语句。\n- 当异常被捕获时，参数变量将接收其值。\n- 任何类型的数据都可能被捕获。\n\
  - 如果 `TRY` 块没有发生异常，没有任何 `catch` 会执行。\n- `Throw` 生成异常类对象。\n- 如果异常必须被捕获，那么 `throw`\
  \ 必须在 `try` 内部或 `try` 内部调用的任何函数中执行。\n- 如果你的代码生成的异常没有适用的 `catch` 语句，可能会导致程序异常终止。\n\
  - 当程序尝试重新抛出一个最初没有抛出的异常时，标准库函数 `terminate()` 会被调用。\n- 每当异常处理系统未能找到匹配的 `catch` 语句，就会调用\
  \ `terminate()` 函数。\n- `try` 块可以在函数内部使用。\n- 我们可以为一个 `try` 关联多个 `catch` 语句。但是，每个\
  \ `catch` 必须定义以捕获不同类型的异常。\n\n\n\n\n# C++ 引用和指针之间的一些重要区别\n\n引用在声明时必须初始化。因此，引用不能为\
  \ `NULL`。\n\n一旦引用被声明并初始化，就不可能再让该引用变量指向另一个对象。\n\n指针可以指向任何地方（`NULL`），但引用始终引用某个对象。\n\
  \n我们不能像操作指针那样获取引用的地址。\n\n你不能像操作指针那样进行引用算术。\n\n## 引用变量和引用参数\n\n引用本质上是一个隐式指针。\n\n\
  引用可以用于：作为函数参数、作为函数的返回值，或作为独立的引用使用。\n\n默认情况下，`C++` 使用按值传递（call-by-value），但它提供了两种方法来实现按引用传递（call-by-reference）参数传递。首先，你可以显式地传递参数的指针。其次，你可以使用引用参数。\n\
  \n当你创建一个独立引用时，你创建的只是对象变量的另一个名称。所有独立引用都必须在创建时初始化。\n\n基类引用可以指向派生类的对象。\n\n### 引用的限制\n\
  \n- 你不能引用另一个引用（我们无法获取引用的地址）\n- 无法创建引用数组，也无法创建指向引用的指针，或引用位域。\n- 引用变量一旦声明必须初始化，除非它是类的成员、函数参数或返回值。\n\
  - 禁止空引用\n\n# # 37 C++ 重要要点\n\n1. `C++` 是一种区分大小写的编程语言。\n2. 在 `C++` 中，分号是语句的终止符。\n\
  3. `C++` 支持单行注释和多行注释。任何注释内部的任何可用字符都会被 `C++` 编译器忽略。\n4. 任何不以分号结尾的代码行在 `C++` 中都被称为空语句（null\
  \ statement）。\n5. `endl` 关键字用于在每行之后插入换行符。\n6. 全局变量在整个程序生命周期内将保持其值。\n7. 所有四个修饰符都可以应用于\
  \ `int` 类型。\n8. `char` 类型允许 `signed`（有符号）和 `unsigned`（无符号）修饰符。\n9. `double` 类型可以配合\
  \ `long` 修饰符使用。\n10. 修饰符可以组合。例如，你可以在 `long` 或 `short` 修饰符配合使用 `signed` 或 `unsigned`。\n\
  11. 变量在使用之前必须声明。通常首选在程序开始时声明它们。\n12. 常量是指程序可能更改的固定值，它们被称为字面量（`literals`）。\n13. 类定义内部变量被称为数据成员，函数被称为成员函数。\n\
  14. 类的成员函数可以在类内部定义，也可以在类外部定义。\n15. `C++` 中的类类似于 C 语言中的结构体，唯一的区别是类默认是私有（private）访问控制，而结构体默认为公共（public）。\n\
  16. 面向对象编程（OOPS）的所有特性都围绕着 `C++` 中的类展开。继承、封装、抽象等。\n17. 类对象持有数据成员的独立副本。我们可以根据需要创建任意数量的类对象。\n\
  18. 对象是类的实例，它持有类中声明的数据变量，并且成员函数在这些类对象上工作。\n19. 对象使用特殊的类函数构造函数（`Constructors`）进行初始化。\n\
  20. 每当对象离开其作用域时，就会调用另一个特殊的类成员函数析构函数（`Destructor`），以释放对象保留的内存。\n21. 类定义以关键字 `class`\
  \ 开头，后跟类名；类体由一对大括号包围。\n22. 类成员可以定义为公共（public）、私有（private）或保护（protected）。默认情况下成员被假设为私有。\n\
  23. 类对象的公共数据成员可以使用直接成员访问运算符 `.` 进行访问。\n24. 私有和保护成员不能直接使用直接成员访问运算符 `->` 访问。\n25.\
  \ 类构造函数是类中的特殊函数，在创建类的新对象时被调用。\n26. 析构函数也是一种特殊函数，在创建的对象删除时被调用。\n27. 拷贝构造函数是一种通过使用之前创建的同类对象初始化对象来创建对象的构造函数。\n\
  28. 每个对象都有一个特殊的指针 `this` 指向对象本身。\n29. 指向类的方法与指向结构体的指针完全相同。事实上，类实际上只是一个带有函数的结构体。\n\
  30. 类的数据成员和函数成员都可以声明为 `static`（静态）。\n31. 成员函数是指在类定义内部有声明并在类数据成员上工作的函数。\n32. 成员函数的定义可以在类定义内部，也可以在外部。\n\
  33. `friend`（友元）函数允许完全访问类的私有和保护成员。\n34. 对于内联函数（inline function），编译器尝试在函数体内部展开代码以代替函数调用。\n\
  35. 继承使得代码可重用。当我们继承一个现有的类时，它所有的方法和字段在新类中都变得可用，因此代码被重用了。\n36. 类中 `Private`（私有）之外的所有成员都是可继承的。\n\
  37. 继承的目的是：代码重用、方法重写、`Virtual`（虚）的使用。\n38. 我们可以使用 `BREAK` 和 `GOTO` 等控制语句打破无限循环。\n\
  39. 数组的大小是固定的。\n40. 数组元素在内存中连续分配。\n41. 数组元素通过索引访问。\n42. 抽象将代码分离为接口和实现。因此在设计组件时，你必须保持接口与实现独立，这样如果你更改底层实现，接口将保持完好。\n\
  43. 除非确实需要暴露它们，否则将类成员默认设为私有是良好的封装示例。\n44. 晚绑定也称为动态绑定或运行时绑定。\n45. 如果内联函数包含任何循环（s）、`switch`、`GOTO`\
  \ 或静态变量，则可能不起。\n46. `static` 成员函数不能是 `virtual`（虚）。\n47. `this` 关键字是存在于非静态函数体中的局部变量。\n\
  48. `this` 指向当前类对象。\n49. `this` 关键字不需要声明，在函数定义中很少被显式引用。\n50. 函数重写停止继承。\n51. 纯虚函数是指在基类中没有定义的虚函数。\n\
  52. 抽象类是包含至少一个纯虚函数的类。\n53. 我们不能创建抽象类的对象。\n54. 我们可以创建抽象类的指针和引用。\n55. 如果 `TRY` 块中没有发生异常，则\
  \ `CATCH` 块永远不会执行。\n56. 函数或整个类都可以声明为另一个类的友元。\n57. 指针是指非连续内存位置的简单引用。它存储其他变量的地址并指向其值。\n\
  58. 我们可以使用 `typedef` 来定义某些长变量类型的类型。\n\n"
