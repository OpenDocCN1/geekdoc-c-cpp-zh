- pgno: 302
  md: 'a formal concept that captures that intuitive concept. That''s how his mind
    worked. It might also be a little complicated. (laughter)


    Q: What about set theory? Did he have any comments on set theory?


    S: I don''t recall. I mean, I tried to get him interested in AD, but he wouldn''t
    listen. I understood his objections to AD, but I thought I could say something
    that he might find of interest. But he would not tolerate.


    Q: Not even Projective Determinacy?


    S: I tried to work up from there, say Borel, since for Borel it''s true. I mean,
    I had a pep talk prepared. He said AD is obviously false; for it falsifies the
    Axiom of Choice which is obviously true. He even made a nasty remark which is
    unusual for him. He said: I suppose something is interesting in seeing what a
    man can do with one hand tied behind his back. I mean, that was how the study
    of AD was to him. I think he was hasty there. I think there is something to talk
    about even if you believe AD is false, because it might be true in a very restricted
    setting. It might be true in L(R) or it may be true for the projective sets, or
    something. I mean, there is something fruitful there, you are not wasting your
    time even if AD is false, even if AD is dramatically false. There is something
    going on there.


    Q: But he never believed that V = L, right? I guess he only saw L as a tool.


    S: Oh, I teased him about that. I teased him because if you go back far enough,
    he thought V = L might be true; and it might be the completion of ZF – this completed
    it and in other words, it settled every reasonable problem in set theory and so
    on. Then some time passed, he seemed to say that Continuum Hypothesis was false.
    It''s just definitely false. He said so in a paper.


    So he tried to settle the matter. He tried to find the right cardinal. He seemed
    to think it''s $\aleph_2$, because he spent lots of time trying to show that the
    continuum was $\aleph_2$, and he even developed some false proofs. But what he
    was calling a proof was not from ZF. He knew ZF couldn''t do it. So he tried to
    write down some axioms about the real numbers, just true statements about real
    numbers which he found intuitively appealing, and these kept changing over time.
    But every once a while he would use that trying to prove the continuum was $\aleph_2$,
    and he would succeed. Then he would find a mistake. So then more time passed.
    Now it''s near the end of his life. Now he told me he thought the continuum was
    $\aleph_1$.


    I said – I was teasing him and said – I thought you''ve said it''s equal to $\aleph_2$.
    So he looked at me and said, I was missed. (laughter). Apparently the people that
    told him all those examples, weird examples that you derive from Continuum Hypothesis
    misled him. So in the end, he tried to prove it with new axioms that were plausible.
    So for most of his life he is working on $\aleph_2$.


    Q: Thank you very much for spending time here.


    S: Oh, I enjoyed the conversation very much. Thanks for your patience.'
