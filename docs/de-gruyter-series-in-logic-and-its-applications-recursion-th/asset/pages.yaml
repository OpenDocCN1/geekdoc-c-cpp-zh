  md: 'Now let \(\varphi\) be a formula such that \((L[\mathbf{g}], \in) \models (L[\langle
    g_0, g_1 \rangle], \in) \models (\langle \mathscr{D}, \le \rangle \equiv \varphi(\mathbf{g}_0))^\wedge\).
    Then there is a condition \((p_0, p_1) \in 2^{<\omega} \times 2^{<\omega}\) such
    that \([p_0] = [p_1]\), \((p_0, p_1) < (\mathbf{g}_0, \mathbf{g}_1)\) and \((p_0,
    p_1) \Vdash (\langle \mathscr{D}, \le \rangle \equiv \varphi(\mathbf{g}_0))^\wedge\).
    Obviously there is an automorphism \(\tau : \mathbb{C} \times \mathbb{C} \to \mathbb{C}
    \times \mathbb{C}\) so that \(\tau((p_0, p_1)) = (p_1, p_0)\) and \(\tau(\mathbf{g}_0)
    = \mathbf{g}_1\). By Proposition 6.1.17, \((p_1, p_0) \Vdash (\langle \mathscr{D},
    \le \rangle \equiv \varphi(\mathbf{g}_1))^\wedge\). Then \((L[\langle \mathbf{g}_1,
    \mathbf{g}_0 \rangle], \in) \models (\langle \mathscr{D}, \le \rangle \equiv \varphi(\mathbf{g}_1))^\wedge\).
    However, \(L[\langle \mathbf{g}_1, \mathbf{g}_0 \rangle] = L[\langle \mathbf{g}_0,
    \mathbf{g}_1 \rangle] = L[\mathbf{g}]\) and thus \((L[\mathbf{g}], \in) \models
    (\langle \mathscr{D}, \le \rangle \equiv \varphi(\mathbf{g}_1))^\wedge\). Hence
    \((\mathscr{D}, \le)\) is not homogeneous.


    # 9.5 Some general independence results


    For a general reference on the subject of Turing degrees, see Lerman [82]. Let
    \(\mathcal{L}(\le)\) be the language of partial ordering. \(\mathcal{L}(\le)\)
    is a set definable in the language of set theory. Furthermore, both \((\mathscr{D},
    \le)\) and the relation "\((\mathscr{D}, \le) \models \varphi\)" may be viewed
    as definable sets in the language of set theory. We code each formula \(\varphi\)
    in \(\mathcal{L}(\le)\) by a number "\(\ulcorner \varphi \urcorner\)".


    Let


    \(\text{Th}_{\exists_1}(\mathscr{D}, \le) = \{ \ulcorner \varphi \urcorner \mid
    \varphi \text{ is a } \Sigma_2\text{-sentence in } \mathcal{L}(\le) \wedge (\mathscr{D},
    \le) \models \varphi \}\).


    Lerman and Shore [131] proved:


    # Theorem 9.5.1. The set \(\text{Th}_{\exists_1}(\mathscr{D}, \le)\) is recursive.


    Hence the set \(\text{Th}_{\exists_1}(\mathscr{D}, \le)\) is definable by a \(\Sigma^0_1\)-formula
    \(\psi_0\) and a \(\Pi^0_1\)-formula \(\psi_1\). It follows that for any \(\Sigma_2\)-sentence
    \(\varphi\),


    \(\text{ZFC} \vdash (\mathscr{D}, \le) \models \varphi \leftrightarrow \psi_0(\ulcorner
    \varphi \urcorner)\)


    and


    \(\text{ZFC} \vdash (\mathscr{D}, \le) \models \neg \varphi \leftrightarrow \neg
    \psi_1(\ulcorner \varphi \urcorner)\).


    Since for any \(\Sigma^0_1\)-formula \(\psi(u)\) and natural number \(n\),


    \(\text{ZFC} \vdash \psi(n) \leftrightarrow (\omega, \le, +, \cdot, 0, 1) \models
    \psi(n)\),


    (see [145]), for any \(\Sigma_2\)-sentence \(\varphi\) either


    \(\text{ZFC} \vdash (\mathscr{D}, \le) \models \varphi\)


    or


    \(\text{ZFC} \vdash (\mathscr{D}, \le) \models \neg \varphi\).


    Hence we have the following conclusion.


    # Corollary 9.5.2. For any \(\Sigma_2\)-sentence \(\varphi\) in \(\mathcal{L}(\le)\),
    either "\((\mathscr{D}, \le) \models \varphi\)" or "\((\mathscr{D}, \le) \models
    \neg \varphi\)" is provable in ZFC.


    Clearly the set \(\text{Pr} = \{ \ulcorner \varphi \urcorner \mid \text{ZFC} \vdash
    (\mathscr{D}, \le) \models \varphi \}\) is r.e. The complexity of the theory of
    the Turing degrees was established by Simpson [139]:'
