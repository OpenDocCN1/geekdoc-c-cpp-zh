  md: 'Since \(2^{<\omega}\) is countable, the following implies that cardinals are
    preserved under a Cohen extension:


    # Proposition 6.2.2. Cohen forcing satisfies property (K).


    Given a Cohen generic set \(G\), the set \(g = \bigcup_{p \in G} \check{p}\) is
    called a Cohen real. The next two results are proved in [78].


    # Proposition 6.2.3. Suppose that \(g = g_1 \times g_2\). Then \(g\) is a Cohen
    real over \(M\) if and only if \(g_1\) is a Cohen real over \(M\) and \(g_2\)
    is a Cohen real over \(M[g_1]\).


    # Proposition 6.2.4. Suppose \(\kappa \ge \omega\) and \(S \in M\). Let \(\mathbb{P}\)
    be a notion of product Cohen forcing of length \(\kappa\) and let \(G\) be generic.
    Then for any \(A \subseteq S\) in \(M[G]\), there is an \(\alpha \le \min[\kappa,
    |S|^M]\) such that \(A \in M[G \cap \mathbb{P}_{<\alpha}]\) where \(\mathbb{P}_{<\alpha}
    = \Pi_{\gamma < \alpha} 2^{<\omega}\).


    # 6.2.2 Random forcing


    Random forcing was introduced by Solovay [150] to construct a model of ZF + DC
    in which every set of reals is Lebesgue measurable.


    # Definition 6.2.5. Let \(\mu\) denote the Lebesgue measure. Random forcing \(\mathbb{R}
    = (\mathbf{T}, \le)\) is a notion of forcing where


    +   - every \(T \in \mathbf{T}\) is a subtree of \(2^{<\omega}\) such that \(\mu([T])
    > 0\);

    +   - \(T_1 \le T_2\) if and only if \(T_1 \subseteq T_2\).


    # Proposition 6.2.6. Random forcing satisfies c.c.c.


    Proof. Suppose that there is an uncountable antichain \(\{T_\alpha\}_{\alpha <
    \omega_1}\). Then for \(\alpha \neq \beta < \omega_1\), \(\mu([T_\alpha] \cap
    [T_\beta]) = 0\). Let \(S_\alpha = [T_\alpha] \setminus \bigcup_{\beta < \alpha}
    [T_\beta]\). Then \(\{S_\alpha\}_{\alpha < \omega_1}\) is an uncountable sequence
    of pairwise disjoint Borel sets with \(\mu(S_\alpha) > 0\) for each \(\alpha <
    \omega_1\). Let \(n\) be such that the set \(R_n = \{S_\alpha \mid \mu(S_\alpha)
    > \frac{1}{n}\}\) is uncountable. Then \(1 = \mu(2^\omega) \ge \mu(\bigcup_{S
    \in R_n} S_\alpha) = \infty\), a contradiction.


    A real \(x\) is random if it is \(\mathbb{R}\)-generic.


    # 6.2.3 Collapsing cardinals


    Let \(\kappa\) be a cardinal. There is a notion of forcing that collapses all
    cardinals below \(\kappa\) while preserving \(\kappa\): Let \(\mathbb{P}(\kappa)
    = (\kappa^{<\omega}, \le)\) and for \(p, q \in \kappa^{<\omega}\), define \(q
    \le p\) if and only if \(q \supseteq p\). Then \(\mathbb{P}(\kappa)\) satisfies
    \(\kappa^+\)-c.c. Moreover, for any generic filter \(G\), the function \(g = \bigcup_{p
    \in G} p\) maps \(\omega\) onto \(\kappa\). Thus we have


    # Proposition 6.2.7. Suppose that \(\kappa \ge \omega_1\) is a cardinal. Then


    +   (i) \(\mathbb{P}(\kappa)\) satisfies \(\kappa^+\)-c.c.;

    +   (ii) If \(G\) is generic, then \(\kappa^+ = (\omega_1)^{M[G]}\).'
