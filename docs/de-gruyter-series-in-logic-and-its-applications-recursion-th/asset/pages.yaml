  md: 'Theorem 12.1.13 has an interesting consequence. By the Low Basis Theorem (Exercise
    1.5.3), there is a real x which is 2-DNR and x'' ≡_T 0''. By Proposition 12.1.5,
    there is a nonempty Π^0_1 set which contains only Martin-Löf random reals. Then
    there is a Martin-Löf random real z ≤_T x since every 2-DNR real Turing computes
    a member of any given nonempty Π^0_1-set. By Theorem 12.1.13, there is no random
    real Turing equivalent to x. Thus we have the following:


    # **Theorem 12.1.14 (Kučera [76]).** The collection of Turing degrees of Martin-Löf
    random reals is not upward closed.


    On the other hand, the Turing degrees of Martin-Löf random reals may be downward
    closed, as implied by the following.


    # **Theorem 12.1.15 (Demuth [20]).** Any y >_T 0 that is truth-table reducible
    to a Martin-Löf random real is Turing equivalent to a Martin-Löf random real.


    Clearly every real Turing reducible to any recursively dominated x is tt-reducible
    to x. Hence the collection of Turing degrees of Martin-Löf random reals is downward
    closed for random reals that are recursively dominated. The following result gives
    another piece of evidence for the randomness thesis.


    # **Theorem 12.1.16 (Miller and Yu [103]).** For any z, if x ≤_T y are Martin-Löf
    random and y is z-Martin-Löf random, then so is x.


    # 12.1.7 Exercises


    +   **Exercise 12.1.1.** Prove that there is no universal Kurtz test.


    +   **Exercise 12.1.2 (Schnorr [127]).** Prove that there is no universal Schnorr
    test.


    +   **Exercise 12.1.3 (Downey, Nies, Weber and Yu [23]).** Prove that there is
    no universal generalized Martin-Löf test.


    +   **Exercise 12.1.4 (Merkle et al. [99], Yu [170], and Kjos-Hanssen).** Prove
    that van Lambalgen''s Theorem fails for Schnorr randomness.


    # 12.2 Randomness via complexity theory


    Intuitively, a random real is not predicated by any partial information about
    itself, and no information about its content is compressible. This is the basis
    for defining randomness in terms of complexity.'
