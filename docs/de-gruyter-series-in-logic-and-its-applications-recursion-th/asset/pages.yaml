    is dense for each n. If g is P-generic meeting each $\mathscr{D}_i$ and $\mathscr{D}^n$,
    then g is $I_1^1$-random and $g \in \bigcap_{n<\omega} U_n^P$. In other words,
    g is not $I_1^1(x)$-ML random and hence not $I_1^1(x)$-random.


    By the proof of Theorem 14.6.15, for any x if every $\Pi^1_1$-random real is $I_1^1(x)$-ML
    random, then x must be hyperarithmetic.


    # Corollary 14.6.16. A real x is low for strongly $\Pi^1_1$-ML random if and only
    if it is hyperarithmetic.


    Proof. Obviously every hyperarithmetic real is low for strongly $\Pi^1_1$-ML random.
    Now suppose that x is low for strongly $\Pi^1_1$-ML random. Then every $\Pi^1_1$-random
    real is strongly $I_1^1(x)$-ML random and so $I_1^1(x)$-ML random. So x must be
