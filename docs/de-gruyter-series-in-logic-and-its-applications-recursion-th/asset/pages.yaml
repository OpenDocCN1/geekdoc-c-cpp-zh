    Exercise 11.2.3 (Harrington). Prove that for any recursive ordinal $\beta < \omega_1^{CK}$,
    there are two $\Pi^1_1$-singletons $x$ and $y$ in $2^\omega$ such that $x^{(\beta)}
    \not\ge_T y$ and $y^{(\beta)} \not\ge_T x$.


    Exercise 11.2.4 (Harrington). Prove that there is a transitive model $N$ of KP
    such that $N \models \text{“Not every } \Delta^1_1\text{-real is hyperarithmetic”}$.


