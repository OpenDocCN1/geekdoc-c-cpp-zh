  md: '# # 5.4 Characterizing countable admissible ordinals


    By relativizing the proof of Corollary 3.6.7, one can show that $\omega_1^x$ is
    a countable admissible ordinal for any $x$. The converse was proved by Sacks [122]:
    every countable admissible ordinal $\alpha > \omega$ is $\omega_1^x$ for some
    $x$. His proof produces in addition an $x$ such that no $y <_h x$ satisfies $\omega_1^y
    = \alpha$. We prove a weaker result, that $\alpha = \omega_1^x$ for some $x$,
    using a notion of forcing introduced by Steel [158]. Let $\alpha$ be a countable
    admissible ordinal greater than $\omega$ for the rest of the section.


    # ## 5.4.1 Generalized ramified analytical hierarchy


    Let $\mathfrak{L}(\alpha, x)$ be a language consisting of the following:


    +   - number variables: $i, j, k, m, n, \dots$

    +   - numerals: $0, \bar{1}, \bar{2}, \dots$

    +   - constants: $x, y, \dots$

    +   - ranked set variables: $x^\gamma, y^\gamma, \dots$ where $\gamma < \alpha$

    +   - unranked set variables: $x, y, \dots$

    +   - operations and relation: $+, \cdot, (\text{times}), / (\text{successor})$
    and $\in$.


    Formulas are defined by induction. The set of number-theoretic terms is the set
    of terms closed under $+, \cdot$ over numerals and number variables. Atomic formulas
    are formulas of the form $t = s$ and $t \in x$, where $t$ and $s$ are number-theoretic
    terms. The other formulas are generated in the usual way. A formula is *ranked*
    if all of its set variables are ranked. A ranked formula $\varphi$ has rank at
    most $\gamma$ if


    +   - for any $\beta$, if $x^\beta$ is a free variable occurring in $\varphi$,
    then $\beta \le \gamma$;

    +   - for any $\beta$, if $x^\beta$ is a bound variable occurring in $\varphi$,
    then $\beta < \gamma$.


    By $\Sigma$-induction on $L_\alpha$, we have


    +   - the set of formulas is $\Sigma_1$ in $L_\alpha$;

    +   - the set $\{(\gamma, \varphi) \mid \varphi \text{ is a ranked formula of
    rank at most } \gamma\}$ is $\Delta_1$ in $L_\alpha$.


    Given $x$, one now defines the structure $\mathfrak{A}(\alpha, x) = \bigcup_{\beta
    < \alpha} \mathfrak{A}(\beta, x)$, where $x$ interprets the symbol $\dot{x}$ as
    a countable union of collations of reals. During the construction, a ranked variable
    $x^\gamma$ is to be interpreted as a real in $\bigcup_{\beta < \gamma} \mathfrak{A}(\beta,
    x)$. The satisfaction relation $\bigcup_{\beta < \gamma} \mathfrak{A}(\beta, x)
    \models \varphi$, for a ranked formula $\varphi$ with rank at most $\gamma$, is
    well defined. $\mathfrak{A}(\alpha, x)$ is constructed by induction on ordinals
    less than $\alpha$:


    +   - $\gamma = 0$: $\mathfrak{A}(\gamma, x) = t(\gamma) \cup \omega$.

    +   - $\gamma > 0$: Suppose $\mathfrak{A}(\beta, x)$ is defined for all $\beta
    < \gamma$. For a ranked formula $\varphi(n)$ with rank at most $\gamma$ and $n$
    as the only free variable, let


    ```

    $i \in z_\varphi \Leftrightarrow \bigcup_{\beta < \gamma} \mathfrak{A}(\beta,
    x) \models \varphi(i).$

    ```'
