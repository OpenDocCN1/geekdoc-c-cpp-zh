    **Exercise 4.2.3.** _Prove Theorem_ 4.1.2 _from Theorem_ 4.2.1_._


    # ## 4.3 Characterizing thin \(\Pi^1_1\)-sets


    A set is _thin_ if it contains no perfect subset. There is a beautiful characterization
    of \(\Pi^1_1\)-thin sets in terms of constructibility.


    # ### 4.3.1 The largest thin \(\Pi^1_1\)-set


    Let \(\mathbb{C} = \{x \mid x \in L_{\omega_1}\}\).


    **Lemma 4.3.1.** \(\mathbb{C}\) _is a thin_ \(\Pi^1_1\)_-set._


    _Proof._ \(x \in L_{\omega_1}\) if and only if \((L_{\omega_1}[x], \in) \models
    (\exists \beta)(x \in L_\beta)\). By Theorem 3.3.2 and Corollary 3.7.2, C is \(\Pi^1_1\).'
