    \ following conclusion.\n\n# **Corollary 12.2.13 (Miller and Yu [103]).** Suppose\
    \ that $x, y, z$ are Martin-Löf random. If $x \\le_K y$ or $x \\le_K y$ and $x$\
    \ is $z$-Martin-Löf random, then so is $y$.\n\nIt is not known whether strong\
    \ Martin-Löf randomness is $\\le_K$-upward closed. By Theorem 12.11.0, Corollary\
    \ 12.2.13 says that higher complexity entails stronger randomness in a set. However,\
    \ the following two results hint at a more subtle picture.\n\n# **Theorem 12.2.14\
