    \rightarrow \Phi_e(n, m, y) \neq 0)\). We have the following effective version
    of Spector''s \(\Sigma^1_1\) boundedness principle.


    # Theorem 1.5.5 (Sacks). There is a recursive function \(\hat{g}\) such that


    \((\forall n)(x_n \subseteq \mathbb{O} \rightarrow \hat{g}(n) \in \mathbb{O} \wedge
    x_n \subseteq \mathbb{O}_{\hat{g}(n)})\),


    where \(\mathbb{O}_{\hat{g}(n)} = \{m \in \mathbb{O} \mid |m| < |\hat{g}(n)|\}\).


    Proof. Since the set \(\{m \mid m \notin \Pi^1_1\}\) is in \(\Pi^1_1\), there
    is a recursive function \(h\) such that \(m \in x_n \leftrightarrow h(m, n) \notin
    \mathbb{O}\). Let \(p\) be the function in Corollary 1.5.4. Define a recursive
    function \(f\) such that \(W_{f(n)} = \{p(h(m, n), m) \mid m \in \omega\}\). If
    \(x_n \subseteq \mathbb{O}\), then \(W_{f(n)} \subseteq \mathbb{O}\). Let \(\hat{g}(n)
    = 20^{\overline{f(n)}}\) where \(\overline{g}\) is the function in Lemma 1.3.5.
    By Lemma 1.3.5, \(X_n \subseteq \mathbb{O} \implies \hat{g}(n) \in \mathbb{O}\).
    If \(\hat{g}(n) \in \mathbb{O}\), then by Lemma 1.3.5 again, \(W_{f(n)} \subseteq
    \mathbb{O}\). But \(h(m, n) \in \mathbb{O}\) for all \(m \in x_n\). Then by Corollary
    1.5.4, \(m \in \mathbb{O}\) for all \(m \in x_n\) and hence \(x_n \subseteq \mathbb{O}\).
    Moreover, if \(x_n \subseteq \mathbb{O}\), then \(m \in x_n \implies h(m, n) \notin
    \mathbb{O} \implies |m| \le |p(h(m, n), m)|\).


    By Theorem 1.5.1, every \(\Pi^1_1\)-set is many-one reducible to \(\mathbb{O}\).
    Hence we may view \(\mathbb{O}\) as providing the stages for enumerating a \(\Pi^1_1\)-set
