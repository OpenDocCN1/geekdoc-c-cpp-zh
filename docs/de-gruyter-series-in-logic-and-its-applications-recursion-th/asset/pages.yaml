    \(B_n = \{x \mid (\exists y \in L_{r_n}[x])R(x, y)\}.\)


    Then \(B_n \subseteq A\) is \(\Delta_1^1\) and \(\mu(B_n) > p > \mu(A) - 2^{-n}\).
    The other part of the proposition follows from the above. \(\square\)'
