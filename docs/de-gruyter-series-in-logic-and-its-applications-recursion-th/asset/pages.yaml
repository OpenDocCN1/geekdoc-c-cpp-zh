    Definition 3.3.9. Given a structure $\mathfrak{M}$, a $\Sigma_n$-Skolem function
    for $\aleph$ is a $\Sigma_n(\aleph)$-definable function $h : \omega \times M \to
    M$ with parameter $p \in M$ such that for any $A \subseteq M$ which is $\Sigma_n$-definable
    over $\aleph$ with parameters $p, x \in M$, there is an $i \in \omega$ satisfying
    $h(i, x) \in A$.


