  md: '# 10 Rigidity and biinterpretability of hyperdegrees


    Let $(\mathscr{P}_h, \le)$ denote the structure of hyperdegrees under the partial
    ordering $\le$ for hyperarithmetic reducibility. As for the Turing degrees $(\mathscr{P},
    \le_T)$, the hyperdegrees form an upper semilattice under the join operator $\cup$,
    where if the hyperdegrees of $x$ and $y$ are respectively $\mathbf{a}$ and $\mathbf{b}$,
    then $x \oplus y$ has hyperdegree $\mathbf{a} \cup \mathbf{b}$. Note that $\cup$
    may be defined in terms of $\le$. A map of $\mathscr{P}$ or $\mathscr{P}_h$ into
    itself is an *automorphism* if it is a bijection and preserves $\le$. A major
    open problem in recursion theory asks whether the identity map is the only automorphism
    for the Turing degrees, i.e. whether the Turing degrees are *rigid*. Slaman and
    Woodin ([141] and [144]) used a sophisticated metamathematical argument to prove
    a number of remarkable results about $(\mathscr{P}, \le_T)$, including the theorem
    that there are at most countably many nontrivial automorphisms for the structure
    (indeed the degrees $\ge \mathbf{0}''$ are invariant under any automorphism),
    and that the hyperdegrees are rigid. In this chapter, we present a more “elementary”
    proof of the latter due to Shore [133]. The biinterpretability of $(\mathscr{P}_h,
    \le)$ with second order arithmetic follows as an application of rigidity (see
    § 10.3).


