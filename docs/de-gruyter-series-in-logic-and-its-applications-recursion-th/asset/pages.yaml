  md: '# **Theorem 8.2.4.** $(\omega_1)^L = \omega_1$ if and only if the $\Pi^1_1$-inductive
    principle $\mathfrak{I}$ holds.


    Proof. The "if" direction is immediate: Choose P(x, y) to express x <=_T y. Then
    P is cofinally progressive. Let A be a \Pi^1_1-set satisfying I for P, of <_1-height
    \omega_1. Then (\omega_1)^L = \omega_1.


    For the other direction, suppose P is \Pi^1_1 and cofinally progressive. Then
    for any pair of reals x, z \in L, the set U_{x,z} = {y | y >=_T z >= P(x, y)}
    is a nonempty \Pi^1_1(x, z)-set. By Theorem 4.12, there is a y \in U_{x,z} \cap
    L. By Theorem 4.1.2 again, (L, \in) \models P is cofinally progressive.


    By Theorem 8.2.3, there is a \Pi^1_1-set A such that (A)^L witnesses the correctness
    of the inductive principle I in L.


    Since (\omega_1)^L = \omega_1, \mathfrak{I} (I) is true in V. Since the statement
    "x \in L^A_{\omega_1}" is \Pi^1_1 and (L, \in) \models (\forall x)(x \in A \to
    x \in L^A_{\omega_1}),


    by the Shoenfield Absoluteness Lemma (Corollary 4.2.9), (V, \in) \models (\forall
    x)(x \in A \to x \in L^A_{\omega_1}). Hence A \subset L.


    Let y \in A. Since A \subseteq L, y \in L. Then there exists an x \in L^A_{\omega_1}
    such that (L, \in) \models x codes the set {z | z \in A \wedge z <_L y} \wedge
    P(x, y).


    Since A \subset L, x codes the set {z | z \in A \wedge z <_L y}. Since the relation
    P is \Pi^1_1 and x, y \in L, by the Shoenfield Absoluteness Lemma (Corollary 4.2.9)
    again, P(x, y) holds. Hence (ii) follows.


    One may relativize the \Pi^1_1-inductive principle \mathfrak{I} to admit real
    parameters and obtain its boldface version \underline{\mathfrak{I}}. Then Theorem
    8.2.4 may be generalized to state: Boldface \Pi^1_1-inductive principle \underline{\mathfrak{I}}
    fails if and only if there is no real x such that (\omega_1)^{L[x]} = \omega_1.
