  md: '# # 4 The theory of \(\Pi^1_1\)-sets


    \(\Pi^1_1\)-sets of reals are endowed with rich structural properties, including
    those that are best understood from the perspective of the constructible universe
    \(L\). In this chapter a deeper analysis of such sets is presented to elucidate
    this point.


    # ## 4.1 A \(\Pi^1_1\)-basis theorem


    # ### 4.1.1 Tree presentations for \(\Pi^1_1\)-sets


    Recall that given a \(\Pi^1_1\)-set \(A \subseteq 2^\omega\), there is a recursive
    predicate \(P \subseteq 2^{<\omega} \times \omega^\omega\) such that \(x \in A\)
    if and only if \((\forall f)(\exists n)-P(x \mid n \mid f \mid n)\). In other
    words, \(x \in A\) if and only if the \(x\)-recursive tree \(T_x = \{\sigma \mid
    (\forall \tau)(\tau \subseteq \sigma \rightarrow P(x \mid |\tau|, \tau))\}\) is
    wellfounded under the Kleene-Brouwer ordering. Then there is a function \(p_x
    : T_x \rightarrow \omega_1^\omega\) with \(p_x \in L_{\omega_1^x}[x]\) such that
    \(p_x\) is order preserving underlying the Kleene-Brouwer ordering.


    Now let \(T \subseteq 2^{<\omega} \times \omega_1^{<\omega}\) be a set so that
    \((\sigma, p) \in T\) if and only if \(p\) is an order- preserving finite function
    from \(\{\tau \mid \tau \subseteq [\sigma]^{|\sigma|}\} \wedge (\forall \tau'')(
    \tau'' \subseteq \tau \rightarrow P(\sigma \mid [\tau''], \tau''))\) to \(\omega_1\).
    Define \((\sigma'', p'') \geqslant (\sigma, p)\) if and only if \(\sigma'' \supseteq
    \sigma\) and \(p''\) extends \(p\). Then \(T\) is a tree under \(>\). Thus \(x
    \in A\) if and only if there is an \(f : T_x \rightarrow \omega_1\) such that
    \((x, f)\) is an infinite path in \(T\), and this holds if and only if there is
    an \(f : T_x \rightarrow \omega_1\) with \(f \in L_{\omega_1^x}[x]\) such that
    \((x, f)\) is an infinite path in \(T\).


    The advantage with a tree presentation is that the companion path of \(x\) exists
    in \(L_{\omega_1^x}[x]\).


    +   Given \((\sigma, p), (\sigma'', p'') \in 2^{<\omega} \times \omega_1^{<\omega}\),
    we say that \((\sigma'', p'') \prec_l (\sigma, p)\) if

    +   - either \((\sigma'', p'') \prec (\sigma, p)\), or

    +   - there is an \(i\) such that \(\sigma''(i) < \sigma(i)\) and for all \(j
    < i\), \(\sigma''(j) = \sigma(j)\), or

    +   - there is a \(v \in \omega^{<\omega}\) such that \(p''(v) < p(v)\) and for
    all \(v'' \prec_{KB} v\), \(v \in \text{Dom}(o) \Rightarrow p''(v'') = p(v'')\).


    An infinite path \((x, f)\) in \(T\) is the *leftmost path* if there is no infinite
    path in \(\{(\sigma, p) \mid (\sigma, p) \prec_l (x \mid [n], f \mid \text{Dom}(p))\}\).


    **Lemma 4.1.1.** Suppose that \((x, f)\) is the leftmost path of \(T\). Then \(f
    \in L_{\omega_1^x}[x]\).


    **Proof.** Suppose that \((x, f)\) is the leftmost path of \(T\). Then \(f\) is
    the unique order- preserving function from the \(x\)-recursive tree \(T_x = \{\sigma
    \mid P(x \mid |\sigma|, o)\}\) onto an initial segment of \(\omega_1^x\). Since
    \(L_{\omega_1^x}[x]\) is admissible, by the \(\Sigma\)-induction Theorem (3.18),
    we have \(f \in L_{\omega_1^x}[x]\).'
