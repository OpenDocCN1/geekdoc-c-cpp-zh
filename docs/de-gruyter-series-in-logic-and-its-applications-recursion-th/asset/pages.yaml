  md: 'By the proof of Corollary 4.2.7, we have the following characterization of
    \(\Delta^1_2\)-reals.


    **Corollary 4.2.8.** _A real x is_ \(\Delta^1_2\) _if and only if x is recursive
    in a_ \(\Pi^1_1\)_-singleton. Hence the set of_ \(\Delta^1_2\)_-reals is_ \(\Sigma^1_2\)_._


    **Corollary 4.2.9** (Shoenfield [129])**.** (i) _If_ \(A \subseteq 2^\omega\)
    _is nonempty and_ \(\Sigma^1_2\)_, then there is an_ \(x \in A \cap L\) _recursive
    in a_ \(\Pi^1_1\)_-singleton._

    (ii) _Every_ \(\Delta^1_2\)_-real is constructible._


    _Proof._ (i) If \(A \subseteq 2^\omega\) is a nonempty \(\Sigma^1_2\)-set, then
    there is a \(\Pi^1_1\)-set \(B \subseteq 2^\omega \times 2^\omega\) such that
    \(x \in A\) if and only if there exists a _y_ such that _B_(_x_, _y_). By Proposition
    4.2.25, there is a \(\Pi^1_1\)-singleton _B_(_x_<sub>0</sub>, _y_<sub>0</sub>).
    By Corollary 4.1.3, \((x_0, y_0) \in L\). Thus \(x_0 \in A\) is a constructible
    real recursive in the \(\Pi^1_1\)-singleton \(x_0 \oplus y_0\).

    (ii) Immediate from (i), since every \(\Delta^1_2\)-real is a \(\Sigma^1_2\)-singleton.
    \(\square\)


    Corollary 4.2.9 (i) is known in the literature as the _Shoenfield Absoluteness
    Lemma_. There are many applications of this in set theory. For example, given
