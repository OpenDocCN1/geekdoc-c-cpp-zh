    i)(\Phi_e^{H_n}(\langle m, i \rangle) = o\})) \le 2^{-m}) \to (\exists m)(\forall
    i)(x \not\prec \Phi_e^{H_n}(\langle m, i \rangle))).$

    ```


    By Proposition 14.2.2, $A$ is precisely the set of $\Delta^1_1$-random reals.
    Since $A$ does not contain a hyperarithmetic member, by Theorem 13.13.13, it is
    not $\Delta^1_1$.


    # 14.2.2 $\Pi^1_1$-Martin-Löf randomness


    A sequence of open sets $\{U_n\}_{n<\omega}$ is a Martin-Löf test (ML test) if
    $\mu(U_n) < 2^{-n}$ for all $n$. Given a class $\Gamma$ of sets of reals (e.g.,
    $\Pi^1_1$), $\{U_n\}_{n<\omega}$ is a $\Gamma$-ML test if $\{(n, \sigma) \mid
    \sigma \in 2^{<\omega} \wedge [\sigma] \in U_n\} \in \Gamma$.


    Definition 14.2.4. Let $\Gamma$ be a class of sets of reals. Then $x$ is $\Gamma$-ML
    random if $x \notin \bigcap_{n<\omega} U_n$ for any $\Gamma$ ML test $\{U_n\}_{n<\omega}$.


    Proposition 14.2.5 (Jorhth and Nies [51]). There is a universal $\Pi^1_1$-ML test
    $\{U_n\}_{n<\omega}$, i.e., for every $\Pi^1_1$-ML test $\{V_n\}_{n<\omega} \bigcap_{n<\omega}
    V_n \subseteq \bigcap_{n<\omega} U_n$.'
