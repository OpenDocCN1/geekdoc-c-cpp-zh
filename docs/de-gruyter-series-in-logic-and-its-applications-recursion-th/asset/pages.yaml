  md: 'The following fact is immediate.


    **Lemma 9.3.2.** Assume ZF. There exist \(x_0\) and \(x_1\) of minimal degree
    such that \(\theta'''' \equiv_T x_0 \oplus x_1 \equiv_T x_0'''' \equiv_T x_1''''\).


    **Lemma 9.3.3.** Assume ZF. There is a maximal chain \(\mathbf{0} = c_0 < c_1
    < \dots < c_\omega = \mathbf{0}''''\) in \(\langle \mathbf{0}, \mathbf{0}'' \rangle\).


    **Proof.** Fix an enumeration \(\langle d_n : n \in \omega \rangle\) of degrees
    below \(\mathbf{0}''''\). Let \(c_0 = \mathbf{0}\).


    Suppose that \(c_n\) is defined with \(c_n'''' = \mathbf{0}''''\). Relativize
    Lemma 9.3.2 to obtain degrees \(x_0\) and \(x_1\) minimal over \(c_n\) such that
    \(x_0 \oplus x_1 = c_n'''' = \mathbf{0}'''' = x_0'''' = x_1''''\). If \(d_n <
    \mathbf{0}''''\) then there is an \(i < 2\) with \(x_i \not\le d_n\), and let
    \(c_{n+1} = x_i\). If \(d_n = \mathbf{0}''''\), let \(c_{n+1} = x_0\).


    Finally let \(c_\omega = \mathbf{0}''''\).


    **Theorem 9.3.4** (Wang, Wu and Yu [168])**.** Assume ZFC. Then CH holds if and
    only if there is a cofinal maximal chain in \(\mathscr{P}\) of order type \(\omega_1\).


    **Proof.** (\(\Rightarrow\)) Assume CH and let \(\langle d_\alpha \mid \alpha
    < \omega_1 \rangle\) be an enumeration of the Turing degrees.


    We construct inductively a sequence \(\{C_\alpha\}_{\alpha < \omega_1}\) of chains
    such that


    +   (1) For each \(\beta < \alpha\) there is a \(c \in C_\alpha\) with \(c \ge
    d_\beta\);

    +   (2) \(C_\alpha\) has order type \(\alpha + \omega\) if \(\alpha = 0\) or is
    a successor ordinal;

    +   (3) \(C_\alpha\) has order type \(\alpha \times \omega\) if it is a limit
    ordinal, and

    +   (4) \(C_\beta \subset C_\alpha\) if \(\beta < \alpha\).


    Let \(C_0 = \{\mathbf{0}\}\). Suppose that \(\alpha = \beta + 1\) and \(C_\beta\)
    is defined. Given \(d_\beta\), we apply Lemma 8.3.1 to obtain a minimal cover
    \(a\) of \(C_\beta\) with \(a'''' \ge d_\beta\). Relativizing Lemma 9.3.3 yields
    a maximal chain \(\mathbf{a} = \mathbf{a}_0 < \mathbf{a}_1 < \dots < \mathbf{a}_\omega
    = \mathbf{a}''''\) in \([\mathbf{a}, \mathbf{a}'''']\). Let \(C_\alpha = C_\beta
    \cup \{\mathbf{a}_\gamma : \gamma \le \omega\}\). For \(\alpha\) a limit ordinal,
    let \(C_\alpha = \bigcup_{\gamma < \alpha} C_\gamma\). Let \(C = \bigcup_{\alpha
    < \omega_1} C_\alpha\). It is straightforward to verify that the order type of
    \(C\) is \(\omega_1\), \(C\) is a maximal chain, and that for each \(\alpha <
    \omega_1\) \((\alpha \times \omega + \omega + 1)\)-th element of \(C\) bounds
    \(d_\alpha\).


    (\(\Leftarrow\)) Since every degree bounds at most countably many degrees, CH
    follows immediately if there is a maximal chain as described.


    # ## 9.3.2 CH without AC


    To continue our tour of the ordering of Turing degrees, we recall some set-theoretic
    facts. CH is the statement that there is no set \(X\) with \(|\omega| < |X| <
    |2^\omega|\), where "\(|X| \le |Y|\)" means the existence of a surjective map
    from \(Y\) onto \(X\). Hence ZF + CH does not obviously imply the existence of
    a well-ordering of reals. The same is true of GCH with regard to AC. It turns
    out that there is a link between these two hypotheses.


    **Theorem 9.3.5** (Sierpinski [136])**.** ZF + GCH \(\to\) AC.


    A question along this line is whether Theorem 9.3.5 holds level by level. For
    example, does CH imply the existence of a well-ordering of \(2^\omega\)?'
