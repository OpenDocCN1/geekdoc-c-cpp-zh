    Proposition 14.2.2. Suppose that $A$ is a $\Delta^1_1$-nullset. There is a $\Delta^1_1$-set
    $V \subseteq \omega \times 2^{<\omega}$ such that $(\forall n)(\nu(V_n) = 2^{-n})$
    and $A \subseteq \bigcap_{n<\omega} V_n$, where $V_n = \{\sigma \mid (n, \sigma)
