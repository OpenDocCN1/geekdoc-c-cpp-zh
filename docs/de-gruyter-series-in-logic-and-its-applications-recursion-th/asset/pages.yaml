  md: 'Using \( q^{-1} \circ g_1 \), starting with \( \sigma_0 = \emptyset \), hyperarithmetically
    in x construct a sequence \( \sigma_0 < \sigma_1 < \cdots \) of strings such that
    for each n,

    - \( P_{g(n)} \neq \emptyset \) and

    - \( \sigma_{n+1} = \sigma_n \cup \{q^{-1}(g_1(\sigma_n))\} \).


    Hence \( \cap_{n<\omega} P_{g(n)} \neq \emptyset \) and for any \( z \in \cap_{n<\omega}
    P_{g(n)} \), the real \( y = \bigcup_{n<\omega} \sigma_n \) is a subset of z.


    # **Corollary 14.6.5.** If x is not \( \Delta^1_1 \)-semiretraceable, then x is
    not low for \( \Delta^1_1 \)-Kurtz randomness.


    Proof. Suppose that x is not \( \Delta^1_1 \)-semitraceable. Let T be a \( \Sigma^1_1
    \)-tree so that \( \mu([T]) > 0 \) and [T] contains only \( \Pi^1_1 \)-ML random
    reals. Then by Lemma 14.6.4, there is a \( z \in [T] \) and a \( y \le_T x \)
    such that z is a member of the \( \Delta^1_1(x) \)-closed nullset \( \{r \mid
    y \le_T r\} \). Hence x is not low for \( \Delta^1_1 \)-Kurtz randomness.


    This leads us to the following theorem.


    # **Theorem 14.6.6** (Kjos-Hanssen, Nies, Stephan and Yu [68]). For any \( x \in
    2^\omega \), the following are equivalent:


    +   (i) x is low for \( \Delta^1_1 \)-Kurtz tests;

    +   (ii) x is low for \( \Delta^1_1 \)-Kurtz randomness;

    +   (iii) x is \( \Delta^1_1 \)-dominated and \( \Delta^1_1 \)-semiretraceable.


    It is not known if there exists a nonhyperarithmetical real which is low for \(
    \Pi^1_1 \)-Kurtz randomness. However, we can prove the following set inclusion.


    # **Proposition 14.6.7** (Kjos-Hanssen, Nies, Stephan and Yu [68]). If x is low
    for \( \Pi^1_1 \)-Kurtz randomness, then x is low for \( \Delta^1_1 \)-Kurtz randomness.


    Proof. Assume that x is low for \( \Pi^1_1 \)-Kurtz randomness, y is \( \Delta^1_1
    \)-Kurtz random and there is a \( \Delta^1_1(x) \)-closed nullset A with \( y
    \in A \). By Proposition 14.1.2, the set


    \[

    B = \bigcup \{[C] \mid C \text{ is a } \Delta^1_1\text{-closed nullset}\}

    \]


    is a \( \Pi^1_1 \)-nullset. Then A \\ B is \( \Sigma^1_1(x) \). Since y is \(
    \Delta^1_1 \)-Kurtz random, \( y \notin B \). Hence \( y \in A \\ B \) and so
    \( A \\ B \) is \( \Sigma^1_1(x) \) and nonempty. Thus there is a \( z \in A \\
    B \) with \( \omega_1^x = \omega_1^z = \omega_1^y \). Since \( z \notin B \),
    z is \( \Delta^1_1 \)-Kurtz random. By Proposition 14.1.4, z is \( \Pi^1_1 \)-Kurtz
    random. This contradicts the fact that x is low for \( \Pi^1_1 \)-Kurtz randomness.


    # **14.6.2 Lowness for** \( \Delta^1_1 \)**-randomness**


    # **Theorem 14.6.8.** The following are equivalent for a real x.


    +   (i) x is \( \Delta^1_1 \)-traceable;

    +   (ii) Every \( \Delta^1_1(x) \)-nullset is contained in a \( \Delta^1_1 \)-nullset;'
