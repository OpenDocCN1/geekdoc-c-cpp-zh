  md: 'Stage 0. Let \(\sigma_0\) and \(\tau_0\) be the first splitting node of \(T\)
    extending its root, i.e. a splitting node of \(T\) such that every node in \(T\)
    extends either \(\sigma_0\) or \(\tau_0\). Let \(h_x(0)\) be the least \(i\) such
    that \(T_i \models [z^\frown \sigma] \cap [T]\), and let \(h_y(0)\) be the least
    \(j\) such that \(g_j \models [\tau_0] \cap T\).


    Stage \(n + 1\). Assume by induction hypothesis that \(\sigma_n\) and \(\tau_n\)
    are splitting nodes in \(T\), and that \(\sigma_n \zwnj z^n(n)\) and \(\tau_n
    \zwnj h_n(n)\).


    Substage (a). Define \(j_0\) to be the least index \(j\) so that \(g_j \in [\sigma_n
    \zwnj (1 - z(n))] \cap [T]\) is not eventually constant. Let \(m_0\) be the least
    \(m > |\tau_n|\) so that \(g_i \models m_i \# g_b \models m\) for every \(i <
    j_0\). Let \(m_1\) be the least \(m > m_0\) such that \(g_{h_n(n)} \models m\)
    is a splitting node in \(T\). Let \(t'' = g_{h_n(n)} \models m_i \models (1 -
    g_{h_n(n)}(m_i))\). Then \(g_i \models m_i \# g_{j_0} \models m\) for \(i < j_0\)
    and node \(m_1\) is the least \(m\) such that \(t'' \models m \# g_{h_n(n)}(m)\).


    Substage (b). Let \(j_1\) be the least \(j\) such that \(g_j \in [t''] \cap [T]\).
    Let \(m_2\) be the least \(m\) such that for any \(i < j_1\), \(g_i \models m
    \# g_{j_1} \models m\). Since \(g_{j_0}\) is not eventually constant, we may choose
    \(m_3\) to be the least \(m > m_2\) such that \(g_{j_0} \models m\) is a splitting
    node in \(T\) and \(g_{j_0} > g_{j_0} \models m_i \zwnj (n + 1)\). Then \(g_i
    \models m_i \# g_{j_1} \models m_3\) for \(i < j_1\). Let \(\sigma_{n+1} = g_{j_0}
    \models m_3\), \(\tau_{n+1} = g_{j_1} \models m_3\), \(h_x(n + 1) = j_0\) and
    \(h_y(n + 1) = j_1\).


    Let \(x = \bigcup_{n < \omega} \sigma_n\) and \(y = \bigcup_{n < \omega} \tau_n\).
    This completes the construction.


    The construction ensures that for every \(n\), \(h_x(n + 1)\) is the least \(i\)
    such that \(g_i \models m_i = x \models m_1\) where \(m_1\) is the least \(m\)
    satisfying \(y(m) \neq g_{h_n(n)}(m)\). Also, \(h_y(n + 1)\) is the least \(i\)
    such that \(g_i \models m_3 = y \models m_3\) where \(m_3\) is the least \(m\)
    such that \(x(m) \neq g_{h_n(n+1)}(m)\). Hence \(h_x \leq_T y \leq_T x \oplus
    y \oplus (\exists_{i < \omega} g_i)\), giving \(z \leq_T x \oplus y \oplus (\exists_{i
    < \omega} g_i)\).


