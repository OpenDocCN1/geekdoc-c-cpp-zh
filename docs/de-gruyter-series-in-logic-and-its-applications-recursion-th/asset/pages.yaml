  md: '# 14.2.3 Separating \(\Pi^1_1\)-Martin-Löf randomness from \(\Delta^1_1\)-randomness


    Define a notion of forcing \(\mathbf{D} = \langle \mathbf{D}, \le \rangle\) as
    follows:


