    Thus for every $n$ there is an $m \in [g(n), g(g(n))$ such that $f(m) = p(m)$.
    Let $g''(0) = g(0)$, and $g''(n + 1) = g(g''(n))$ for all $n < \omega$. Define
    a $\Pi^1_1(x)$-relation $S(n, m)$ such that $S(n, m)$ if and only if $m \in [g''(n),
    g''(n + 1))$ and $p(m) = f(m)$. Uniformizing $S$, we obtain a $\Delta^1_1(x)$-function
    $g''''$.


    Let $H = \{h(m, k) \mid k \in (\exists n)(g''''(n) = m \land f(m) = k)\}$. Then
    $H$ is $\Delta^1_1(x)$ and since $\omega_1^x = \omega_1^{ck,x}$, $H \subseteq
    O_n$ for some $n \in O$. Since $O_n$ is $\Delta^1_1$, we may define a $\Delta^1_1$-function
    $\bar{f}$ by setting $\bar{f}(i) = j$ if $h(i, j) \in O_n$ and $\bar{f}(i) = 1$
    otherwise. Then there are infinitely many $i$ such that $f(i) = \bar{f}(i)$.


    The following clarifies the relationship between traceability and semitraceability.


    # Proposition 13.3.11 (Kjos-Hanssen, Nies, Stephan and Yu [68]). Every $\Delta^1_1$-traceable
    real is $\Delta^1_1$-dominated and $\Delta^1_1$-semidominated.


    Proof. Clearly every $\Delta^1_1$-traceable real is $\Delta^1_1$-dominated. Let
    $x$ be a $\Delta^1_1$-traceable real and let $f$ be a $\Delta^1_1(x)$-function.
