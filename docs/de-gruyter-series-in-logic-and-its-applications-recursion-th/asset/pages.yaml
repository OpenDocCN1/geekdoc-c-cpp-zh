    # 10.3 Biinterpretability


    Biinterpretability in the Turing degrees says essentially that a relation on \(\mathscr{D}\)
    is definable if and only if it is definable in second order arithmetic.


    While the biinterpretability of \((\mathscr{D}, \le)\) has yet to be established,
    we show in this section that it holds for the hyperdegrees.


