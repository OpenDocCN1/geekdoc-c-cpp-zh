    \urcorner \mid \forall \varphi(\varphi \in T \rightarrow \ulcorner M \urcorner
    \vDash \varphi)\}\) is \(\Delta_1^1\).


    For example, \(\{\ulcorner M \urcorner \mid \ulcorner M \urcorner \vDash \text{KP}
    + \text{"V = L"}\}\) is \(\Delta_1^1\) (where for simplicity we make no distinction
    between KP+V = L" and the corresponding sentences interpreted in \(\ulcorner M
