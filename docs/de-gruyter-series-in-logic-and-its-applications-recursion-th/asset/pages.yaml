    Theorem, which implies that induction over H-sets is degree-theoretic invariant.


    # **Theorem 2.3.1** (Spector [153]). There is a recursive function h such that


    $n, m \in O \land |n| \le |m| \implies H_n = \Phi_{h(n,m)}^{H_m}$.


    Proof. We prove this by induction on the well-ordering $<_O^2$:


    $(n_1, m_1) < (n_2, m_2) \Rightarrow |n_1| < |n_2| \lor (|n_1| = |n_2| \land |m_1|
    < |m_2|)$.


    There are four cases to consider.


    +   (1) $n = 1$. Set $h(1, m) = c_1$ so that $\Phi_{c_1}^x = H_1 = \emptyset$
    for all x.

    +   (2) $n = 2^{|x|} \land n = 2^i$. Fix a recursive function g so that for any
    e, x and y, $x = \Phi_e^y$ implies $x'' = \Phi^{g(e)}$. Set $h(n, m) = g(h(i,
    j))$.

    +   (3) $n = 3 \cdot 5^k$. Set $h(n, m) = c_3$ so that $\Phi_{c_3}^{H_m}$ is the
    characteristic function of $\{(i, j) \mid i \in H_m^{(h(\phi(i),0),m)}\}$.

    +   (4) $n = 2^a \land m = 3 \cdot 5^i$. This is the most difficult case. By Lemma
    2.2.4, we may $H_m$-recursively search for an i such that $n \in O_{\phi(i,0)}$
    and $O_{\phi(i,0)} = \Phi_{g(h(\phi(i),0))}^{H_m}$. By Lemma 2.1.2, there is a
    recursive function f so that $H_{2^{\phi(i,0)}} = \Phi_{f(2^{\phi(i,0)},m)}^{H_m}$.
    By induction, $H_n = \Phi_{h(n, 2^{\phi(i,0)})}^{H_m}$. Then there exists a $c_4$
    with $H_n = \Phi_{h(n, 2^{\phi(i,0)})}^{H_m} = \Phi_{c_4}^{H_m}$. Set $h(n, m)
    = c_4$.


    Note that these cases can be identified recursively. Hence h is a recursive function.


    Thus we have the following uniqueness theorem.


    # **Corollary 2.3.2** (Spector). If $n, m \in O$, then $|n| = |m|$ implies $H_n
    \equiv_T H_m$.


