    \omega \times 2^{<\omega} \rightarrow \mathbf{F}$. Using $F$, a hyperarithmetic
    family $\langle P_\sigma \mid \sigma \in 2^{<\omega} \rangle$ may be defined by
    recursion on $\sigma$.'
