    \le_h x\) such that \(U\) is \(\Delta^1_1(y)\). Let \(\Phi\) be a Turing reduction
    so that the domain of \(\Phi^y\) is \(U\). Write \(U''\) for the domain of \(\Phi^x\)
    for any \(z\). Note that \(U = U''\).


    Define a \(\Delta^1_1(x)\) function \(\hat{f}\) by: \(\hat{f}(n)\) is the shortest
    string \(\sigma < y\) with \(\mu(U''[\sigma]) > 1 - 2^{-n}\). By the hypothesis
    of the theorem, there is an increasing \(\Delta^1_1\)-function \(g\) and a \(\Delta^1_1\)-function
    \(f\) such that for every \(n\), there is an \(m \in [g(n), g(n+1)]\) with \(f(m)
    = f(m)\). Without loss of generality, we may assume that \(\mu(U''[f(m)]) > 1
    - 2^{-m}\) for every \(m\).


    Define a \(\Delta^1_1\)-open set \(V\) such that \(\sigma \in V\) if and only
    if there exists an \(n\) such that \([\sigma] \subseteq \bigcap_{g(n) \le m \le
    g(n+1)} U''[f(m)]\). By the property of \(f\) and \(g\), \(V \subseteq U'' = U\).
