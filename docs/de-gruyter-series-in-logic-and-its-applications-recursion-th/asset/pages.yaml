    gamma <= beta, I) on ordinals beta <= alpha with support I by induction on beta.


    Definition 6.1.12. For beta = 0, P_0 = (P_0, Q_0, 0, I) satisfies


    +   - Q_0 is a notion of forcing;

    +   - p in P_0 if and only if p is a function such that Dom(p) = {0} and p(0)
    in Q_0.


    For beta = xi + 1, a forcing condition p in P_beta is a partial function whose
    domain belongs to I so that


    +   - p | xi = ((eta, r) | xi < eta ^ lambda p(r) = r) in P_xi;

    +   - Q_beta is a P_xi-name;

    +   - if beta in Dom(p), then p | xi ^ p(beta) in Q_beta.


    If q in P_beta, define p <=_beta q if p | xi <= q | xi and p | xi ^ p(beta) <=
    q(beta).


    If P_beta is a limit ordinal, then a forcing condition p in P_beta is a partial
    function whose domain belongs to I so that


    +   - for every xi < beta, p | xi = ((eta, r) | xi < eta ^ lambda p(r) = r) in
    P_xi;

    +   - {xi < beta | Dom(p) in I}.


    If q in P_beta, define p <=_beta q if and only if p | xi <= q | xi for every xi
    < beta.


