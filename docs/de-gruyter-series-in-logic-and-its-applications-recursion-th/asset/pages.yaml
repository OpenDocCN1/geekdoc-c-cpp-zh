  md: '# # 5 Recursion-theoretic forcing


    Although historically Cohen introduced forcing for set-theoretic considerations,
    the method was adapted to study problems in recursion theory soon after by Feferman
    [25] (indeed, one detects a hint of Cohen forcing in the theorems of Post and
    Kleene on the structure of the Turing degrees proved in the 1950s). Here we study
    three classic examples of forcing (due to Cohen, Sacks and Steel respectively)
    and their applications in recursion theory. It turns out that the ramified analytical
    hierarchy provides an ideal platform for this purpose.


    # ## 5.1 Ramified analytical hierarchy


    # ### 5.1.1 The structure $\mathfrak{A}(\omega_1^{CK}, x)$


    The ramified analytical hierarchy was introduced by Kleene [72] and forcing constructions
    over it goes back to Cohen [18] and continued in Feferman [25]. It may be viewed
    as an analog of the constructible hierarchy defined in the language of second
    order arithmetic, for the study of hyperarithmetic theory.


    +   The language for the hierarchy, denoted $\mathscr{L}(\omega_1^{CK}, x)$, consists
    of the following:

    +   - number variables: $i, j, k, m, n, \dots$

    +   - numerals: $0, 1, 2, \dots$

    +   - set constants: $\dot{x}, \dot{y}, \dots$

    +   - ranked set variables: $x^\beta, y^\beta, \dots$ for $\beta < \omega_1^{CK}$

    +   - unranked set variables: $x, y, \dots$

    +   - function and relation symbols: $+, \dots$ (times), $''$ (successor) and
    $\epsilon$.


    Formulas in this language are defined by induction in the usual way. As one might
    expect, the presence of ranked set variables implies that there is no recursive
    coding of $\mathscr{L}(\omega_1^{CK}, x)$. Instead, coding is carried out in the
    countable admissible set $L_{\omega_1^{CK}}$. First choose a $\Pi^1_1$-path $\mathsf{O}_1$
    through $\mathsf{O}$ which exists according to Theorem 2.6.4. Code the ranked
    set variable $x^\beta$ by the number $(2, n)$ where $n \in \mathsf{O}_1$ and $|n|
    = \beta$. Other symbols are coded recursively. With this, formulas are coded in
    $L_{\omega_1^{CK}}$. A formula is *ranked* if all of its set variables are ranked.
    A ranked formula $\varphi$ has rank at most $\beta$ if


    +   - for any $\gamma_i$ if $x^i$ is a free variable occurring in $\varphi$, then
    $\gamma \le \beta$;

    +   - for any $\gamma_i$ if $x^i$ is a bounded variable occurring in $\varphi$,
    then $\gamma < \beta$.


    Note that


    +   - the set of Gödel number of formulas is $\Pi^1_1$;

    +   - the set of Gödel numbers of ranked formulas of rank at most $\beta$ is r.e.
    uniformly in the unique notation for $\beta$ in $\mathsf{O}_1$.'
