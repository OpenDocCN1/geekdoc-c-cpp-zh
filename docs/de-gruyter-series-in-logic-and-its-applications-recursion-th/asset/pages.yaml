    = \{ \sigma \mid (n, \sigma) \in U \}\). Assume \(\lim_{n \to \infty} \mu(U_n)
    = 0\) and let


    \(\mathscr{D}_U = \{ P \mid P \in \mathbf{D} \wedge P \cap (\bigcap_{n < \omega}
    U_n) = \emptyset \}.\)


    # Lemma 14.2.8. \(\mathscr{D}_U\) is dense.


    Proof. Let \(P \in \mathbf{D}\). There is an \(n\) such that \(\mu(U_n) < \mu(P)/2\).
    Now the complement \(P_0 = 2^\omega \setminus U_n\) has measure greater than or
    equal to \(1 - \mu(P)/2\). Then \(P_0 \cap P\) is a \(\Delta^1_1\)-closed set
    and has measure greater than or equal to \(\mu(P)/2\). Thus \(P_0 \cap P \in \mathbf{D}\).


    For any \(\Pi^1_1\)-set \(G\), let \(\mathscr{D}_G = \{ P \mid P \in \mathbf{D}
    \wedge P \cap G = \emptyset \}\).


    # Lemma 14.2.9. If \(G\) is a \(\Pi^1_1\)-set consisting only of \(\Delta^1_1\)-random
    reals, then \(\mathscr{D}_G\) is dense in \(\mathbf{D}\).


    Proof. Let \(P \in \mathbf{D}\). Then there is a hyperarithmetic \(x\) such that
    \(P\) is \(P_0^x(x)\). Without loss of generality, we may assume that for any
    \(\sigma\), if \([\sigma] \cap P \neq \emptyset\), then \(\mu([\sigma] \cap P)
    > 0\) (since we may assume that \(P\) contains only 1-\(x\)-random reals). By
    Theorem 13.11.13, there is a hyperarithmetic \(z\) in \(P\). Hence \(z \notin
    G\). Since \(G\) is closed, there is an \(n\) such that \([z \nmid n] \cap G =
    \emptyset\). Let \(Q = [z \nmid n] \cap P\). Then \(Q \in \mathscr{D}_G\).


    # Theorem 14.2.10 (Chong, Nies and Yu [12]). \(\Pi^1_1\)-ML randomness \(< \Delta^1_1\)-randomness.


    Proof. By Proposition 14.2.2, \(\Pi^1_1\)-ML randomness \(\subseteq \Delta^1_1\)-randomness.
    By Proposition 14.2.5, let \(\{U_n\}_{n < \omega}\) be a universal \(\Pi^1_1\)-ML
    test. For \(n < \omega\), let


    \(\mathscr{D}_{U_n} = \{ P \mid P \in \mathbf{D} \wedge P \subseteq U_n \}.\)


    By Lemma 14.2.9, \(\mathscr{D}_{U_n}\) is dense. By Lemma 14.2.8, there is a \(\Delta^1_1\)-random
    \(x\) such that for any \(n\), there is a \(P \in \mathscr{D}_{U_n}\) with \(x
    \in P\). Hence \(x \in \bigcap_{n < \omega} U_n\), i.e. \(x\) is not \(\Pi^1_1\)-ML
    random.


    We remark that \(\mathbf{D}\) is an analog of random forcing \(\mathbf{R}\) discussed
    in §6.2.2. However, \(\mathbf{R}\) is c.c.c. and so preserves all cardinals while
    \(\mathbf{D}\) is not c.c.c. in \(L_{\omega_1^{CK}}\). By the proof of Theorem
    14.2.10 and Corollary 14.3.2 below, any \(\mathbf{D}\)-generic \(x\) collapses
    \(\omega_1^{CK}\) and hence does not preserve admissible ordinals.'
