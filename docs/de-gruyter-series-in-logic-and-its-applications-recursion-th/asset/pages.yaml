  md: '# ## 1.1.5 Relativization


    As in classical recursion theory, all the results above may be relativized to
    a real \( x \). We use boldface symbols with tilde \( \Sigma_n^0, \Pi_n^0, \Delta_n^0,
    \Sigma_n^1, \Pi_n^1 \) and \( \Delta_n^1 \) to denote the corresponding sets (of
    numbers or reals) relativized to a real. A set is _projective_ if it belongs to
    \( \Pi_n^1 \) for some \( n \).


    # ## 1.1.6 Exercises


    **Exercise 1.1.1.** _Prove that a set_ \( P \subseteq 2^\omega \) _is_ \( \Delta_1^0
    \) _if and only if it is defined by a recursive predicate._


    **Exercise 1.1.2.** _Prove that there is a_ \( \Pi_1^0 \)_-total function which
    is not_ \( \Delta_1^0 \)_._


    **Exercise 1.1.3.** _Prove that every closed uncountable set_ \( P \subseteq \omega^\omega
    \) _can be decomposed into the union of a countable set and a perfect set._


    **Exercise 1.1.4.** _Prove that every uncountable set_ \( P \subseteq \omega^\omega
    \) _can be decomposed into the union of a countable set and a set without isolated
    members._


    **Exercise 1.1.5.** _Prove that_ \( \emptyset^{(\omega)} \in 2^\omega \) _is a_
    \( \Pi_2^0 \)_-singleton but not a_ \( \Pi_1^0(x) \)_-singleton for any_ \( x
    \not\geq_T \emptyset^{(\omega)} \)_._


    # ## 1.2 Ordinal notations


    A key goal in descriptive set theory is to investigate properties of real numbers
    and sets of real numbers within the system ZFC. However, many statements about
    complexity classes above the \( \Pi_1^1 \)-level are independent of ZFC. Hence
    it is natural to study in greater depth properties of \( \Pi_1^1 \)-sets. Higher
    recursion theory provides an ideal platform as well as powerful tools for this
    purpose. In this section, we introduce the notion of a recursive ordinal and an
    ordinal notation which is at the heart of analysis of \( \Pi_1^1 \)-sets. The
    recursive ordinals allow one to carry out effective transfinite induction over
    the ordinal \( \omega_1^{CK} \) similar to what is done over \( \omega_1 \) for
    transfinite induction.


    # ## 1.2.1 Kleene''s O


    Let \( \langle . \rangle : \omega \times \omega \to \omega \) be a recursive bijection.
    Define an arithmetical set \( P \subseteq 2^\omega \) such that \( x \in P \)
    if and only if \( x \) satisfies the following conditions:


    +   - (i) \( (1, 2) \in x \);

    +   - (ii) \( (\forall m)(\forall n)((m, n) \in x \to \langle n, 2^n \rangle \in
    x) \);

    +   - (iii) \( (\forall e)((\forall n)(\Phi_e(n) \downarrow \land (\forall n)(\Phi_e(n),
    \Phi_e(n+1)) \in x) \to (\forall n)((\Phi_e(n), 3 \cdot 5^e \in x)) \);

    +   - (iv) \( (\forall n)(\forall m)(\forall k)((n, m) \in x \land (m, k) \in
    x \to \langle n, k \rangle \in x) \).'
