    a $\Sigma_0$-formula such that $h_\alpha(i, \gamma, p) = x$ if and only if $(J_\alpha,
    \in) \models (\exists y)\varphi(i, \gamma, p, x, y)$. Then by the proof of Proposition
    3.3.11, there is a total $\Sigma_1$-function $h''(i, \gamma_1, \gamma_2) = \begin{cases}
    x & (J_\alpha, \in) \models (\exists n \in \omega)(\exists y \in J_\omega \cup
    S^{(\alpha)}(J_\rho))\varphi(i, \gamma_1, p, \gamma_2, y), \\ 0 & \text{Otherwise.}
    \end{cases}$ Let $h(\gamma) = h''(f_1(\gamma))$ for $\gamma < \omega\alpha$.


