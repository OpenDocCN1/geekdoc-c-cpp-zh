    \ \\cup \\cdots \\cup \\mathbf{y}_n \\in U$ and $\\mathbf{x}_i \\cup \\mathbf{y}_i\
    \ = \\mathbf{z}_i$. Hence $R$ restricted to the hyperdegrees below $\\mathbf{a}$\
    \ is definable, completing the proof of Theorem 10.3.1.\n\n# 10.3.2 Coding an\
    \ expanded standard model of PA\n\nConsider the standard model $\\langle \\omega,\
    \ x, <, +, \\cdot, 0, 1 \rangle$ of Peano arithmetic expanded by a unary predicate\
    \ $x$. We may represent it as a relation on degrees. Let $\\langle \\mathbf{d}_n\
    \ \rangle_{n < \\omega}$ be a countable sequence of hyperdegrees. We interpret\
    \ $\\mathbf{d}_n$ as the number $n$ and define arithmetical relations and functions\
    \ on finite subsets of $\\langle \\mathbf{d}_n \rangle_{n < \\omega}$ in the obvious\
    \ way. From these one may define a countable relation $R^*$ on $\\langle \\mathbf{d}_n\
    \ \rangle_{n < \\omega}$ turning it into (a copy of) the standard model of arithmetic\
    \ with a unary predicate representing the real $x$. By Theorem 10.3.1, there is\
    \ a finite sequence of degrees $\bar{\\mathbf{p}}$ and a formula $\\varphi$ in\
    \ the language of partial ordering which together define $R^*$. Fix the formula\
    \ $\\varphi$ throughout this section. Note that not every $\bar{\\mathbf{p}}$\
    \ together with $\\varphi$ necessarily code a standard model of arithmetic.\n\n\
    **Definition 10.3.4.** Given a finite sequence $\bar{\\mathbf{p}}$ of hyperdegrees\
    \ and a real $x$, we say that $\bar{\\mathbf{p}}$ codes a standard model with\
    \ $x$ (as a second order element) if $\bar{\\mathbf{p}}$ and $\\varphi$ together\
    \ define a relation $R^* = (R_\\omega, R_<, R_+, R_\\cdot, R_0, R_1)$ which represents\
    \ the standard model of arithmetic $\\mathcal{M} = \\langle \\omega, x, <, +,\
    \ \\cdot, 0, 1 \rangle$.\n\nIf one removes the unary predicate $x$, then $\bar{\\\
    mathbf{p}}$ codes a standard model if $\bar{\\mathbf{p}}$ and $\\varphi$ define\
    \ a relation $R = (R_\\omega, R_<, R_+, R_\\cdot, R_0, R_1)$ which represents\
    \ $\\mathcal{M} = \\langle \\omega, <, +, \\cdot, 0, 1 \rangle$. Then the relation\
    \ \"$\bar{\\mathbf{p}}$ and $\\varphi$ code a standard model\" is definable in\
    \ $(\\mathscr{P}_n, \\le)$. To see this, we make the following observations:\n\
    \n+   - (i) The model $\\mathcal{M}$ represented by $R$ satisfies the system of\
    \ Robinson arithmetic $Q$. Since $Q$ is a finite collection of axioms, it can\
    \ be expressed in one sentence;\n+   - (ii) $\\mathcal{M}$ is wellfounded. In\
    \ other words, there is no infinite descending $R_<$-sequence. By Theorem 10.3.1,\
    \ there is a formula $\\psi(\bar{U}, \\mathbf{v})$ so that $\\mathcal{M}$ is wellfounded\
    \ if and only if for any finite sequence $\bar{\\mathbf{q}}$, the set $\\{ \\\
    mathbf{d} \\mid (\\mathscr{P}_n, \\le) \\vDash \\psi(\bar{\\mathbf{q}}, \\mathbf{d})\
    \ \\}$ is not an infinite descending $R_<$-sequence.\n\nThus the statement that\
    \ $\bar{\\mathbf{p}}$ and $\\varphi$ code a standard model is definable.\n\n#\
