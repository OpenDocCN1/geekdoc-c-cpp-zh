    **Definition 6.1.11.** Given a condition \(p \in \mathbf{P}\) and a formula \(\varphi(\tau_0,
    \dots, \tau_n)\) with \(\tau_0, \dots, \tau_n \in M^\mathbf{P}\), we say that
    \(p\) *forces* \(\varphi(\tau_0, \dots, \tau_n)\), or \(p \Vdash \varphi(\tau_0,
    \dots, \tau_n)\), if and only if for any generic set \(G\) with \(p \in G\), \(\langle
    M[G], \in \rangle \models \varphi(\text{val}(\tau_0, G), \dots, \text{val}(\tau_n,
    G))\).


    **Theorem 6.1.2.** (i) The class \(\langle p, \varphi, (\tau_0, \dots, \tau_n)
    \rangle \mid p \Vdash \varphi(\tau_0, \dots, \tau_n)\rangle\) is definable in
    \(\mathfrak{M}\); (ii) for every generic \(G\) and formula \(\varphi(\tau_0, \dots,
    \tau_n)\) with \(\tau_0, \dots, \tau_n \in M^\mathbf{P}\), \(\langle M[G], \in
    \rangle \models \varphi(\text{val}(\tau_0, G), \dots, \text{val}(\tau_n, G)) \Leftrightarrow
    (\exists p \in G)(p \Vdash \varphi(\tau_0, \dots, \tau_n))\).


    Theorem 6.1.2 is not surprising when taken together with the definition of \(\Vdash\)
    in §5.2 (see [78]). The following facts about the forcing relation are standard.


    **Proposition 6.1.3.** For any formula \(\varphi\), condition \(p\) and \(\mathbf{P}\)-names
    \(\tau_0, \dots, \tau_n\), (i) \(q \le p \land p \Vdash \varphi \implies q \Vdash
    \varphi\); (ii) \(p \Vdash \varphi \land \psi\) if and only if \(p \Vdash \varphi\)
    and \(p \Vdash \psi\); (iii) \(p \Vdash \neg \varphi\) if and only if \((\forall
    q \le p) q \not\Vdash \varphi\); (iv) the set \(\{p \mid p \Vdash \neg \varphi
    \lor p \Vdash \varphi\}\) is dense; (v) \(p \Vdash (\exists x)\varphi(x)\) if
    and only if the set \(\{q \mid q \le p \text{ and } \exists \tau (q \Vdash \varphi(\tau))\}\)
    is dense; (vi) \(p \Vdash (\exists x)\varphi(x)\) if and only if there is a \(\mathbf{P}\)-name
    \(\tau \in M^\mathbf{P}\) such that \(p \Vdash \varphi(\tau)\).


    # 6.1.2 \(\kappa\)-chain condition and Martin''s Axiom


    Given a partial ordering \(\mathbf{P} = (\mathbf{P}, \le)\), a set \(A \subseteq
    \mathbf{P}\) is an *antichain* if for \(p \neq q\) in \(A\), there is no \(r\)
    satisfying \(r \le p\) and \(r \le q\). \(\mathbf{P}\) has the \(\kappa\)-*chain
    condition*, or \(\kappa\)-c.c., if in \(\mathfrak{M}\) every antichain of \(\mathbf{P}\)
    has cardinality less than \(\kappa\). In particular, \(\omega_1\)-c.c. is known
    as the countable chain condition, or c.c.c. A chain condition restricts the possible
    values of a function in a generic extension. In fact, chain conditions are used
    as basic tools for the preservation of cardinals in a generic extension. For example,
    if \(\mathbf{P} = (\mathbf{P}, \le)\) satisfies c.c.c. and \(f : \omega \to (\omega_1)^{\mathbf{M}}\)
    is a function in \(\mathbf{M}[G]\) for some generic \(G\), then for every \(n
    < \omega\), the set \(A_n = \{(\alpha, \omega_1)^{\mathbf{M}} \mid (\exists p)(p
    \Vdash f(\check{n}) = \check{\alpha})\} \in \mathbf{M}\) is countable in \(\mathfrak{M}\)
    so that \(\bigcup_n A_n \in \mathbf{M}\) is also countable in \(\mathfrak{M}\).
    Thus \(\mathbf{P}\) does not collapse \((\omega_1)^{\mathbf{M}}\).


    **Lemma 6.1.14.** If \(\mathbf{P}\) *has the* \(\kappa\)*-chain condition*, then
    for any generic set \(G\), \((\kappa)^{\mathbf{M}} = (\kappa)^{\mathbf{M}[G]}\).


    **Definition 6.1.5** (Martin''s Axiom [90]). Let \(\kappa\) be a cardinal. \(\text{MA}_\kappa\)
    states that for any c.c.c. partial ordering \(\mathbf{P} = (\mathbf{P}, \le)\)
    and any \(\kappa\)-sequence of dense sets \(\{D_\alpha\}_{\alpha < \kappa}\),
    there is a filter \(G \subseteq \mathbf{P}\) that meets every \(D_\alpha\). We
    use \(\text{MA}\) to denote \((\forall \kappa < 2^{\aleph_0})\text{MA}_\kappa\).'
