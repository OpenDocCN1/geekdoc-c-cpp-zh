    # ## 2.7 Codes for sets


    In § 2.2.3, a method of coding \(\Delta^1_1\)-sets was introduced. However, the
    method does not provide an effective way of tracking the construction of \(\Delta^1_1\)-sets.
    Here we discuss the method of hyperarithmetic coding which serves as a useful
    tool for performing inductive analysis of \(\Delta^1_1\) sets of reals.


    # ## 2.7.1 Borel codes


    *Throughout this section, fix an effective enumeration* \(\{\sigma_i\}_{i < \omega}\)
    *of* \(\omega^{<\omega}\)*.*


    For each \(x \in 2^\omega\), define \((x)_n = \{m \mid 2^n \cdot 3^m \in x\}\).
    Define a sequence \(\{\Sigma_\beta\}_{\beta < \omega_1}\) of sets of reals as
    follows:


    +   \(\beta = 0\): Let \(\Sigma_0 = \{x \in 2^\omega \mid 0\}\).


    +   \(\beta > 0\): Let \(T_\beta = \{x \in 2^\omega \mid \Sigma_0 \setminus \{x\}
    (\forall n)(\exists \beta < \beta)(\beta(x)_n \in \Sigma_\beta)\}\).


    Let BC = \(\bigcup_{\beta < \omega_1} \Sigma_\beta\) be the set of Borel codes.
    For each \(x \in\) BC, define \(A_x\) to be:


    \(x \in \Sigma_0; A_x = \bigcup_{(i) < 0} \{ \sigma_i \}\).


    \(\beta > 0\) and \(x \in \beta P_x\): \(A_x = \bigcup_n (a^{\omega \setminus
    A_{(x)_n}})\).


    If \(\sigma\) is the empty string, let \((y)_\sigma = y\). For each \(\sigma \in
    \omega^{<\omega}\), define


    \((y)_\sigma = (\dots ((y)_{\sigma(1)})_{\sigma(2)}) \dots )_{\sigma(|\sigma|)}\).


    Given a real \(y\), we define a tree \(T'' \le_T y\) over \(\omega^{<\omega}\)
    as follows:


    \(\emptyset \in T'';\)


    For any \(\sigma \in T''\), if \((y)_\sigma \in \Sigma_0\) then \(\sigma\) will
    have no extension in \(T''\). Otherwise, \(\sigma^\frown n \in T''\) for every
    \(n\).'
