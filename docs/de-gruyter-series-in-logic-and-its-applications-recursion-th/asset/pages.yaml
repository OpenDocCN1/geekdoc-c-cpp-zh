    # 9.1.3 Exercises


    **Exercise 9.1.1.** Prove that there is a partial ordering \(\langle 2^{<\omega},
    \le_P \rangle\) into which every locally countable partial ordering of size not
    greater than \(2^{\aleph_0}\) is embeddable.


