    # 3.6 Coding structures


    The method of coding a language or a structure by a set of natural numbers was
    introduced by Gödel in the proof of the Incompleteness Theorem. Coding is widely
    used today in mathematical logic. In this section, we will not discuss the formalism
    of coding. Instead, we present a general description of how the method works.


    # 3.6.1 Coding a language


    Given a countable language \(\mathscr{L}\), there are many ways of coding it by
    a set of numbers. What we want is a "nice" coding scheme. In many cases, one may
    code a language \(\mathscr{L}\) by a recursive set \(\mathscr{L}'' \subseteq \omega\).
    A language that may be thus coded is called a recursive language. For example,
    both the first order language of arithmetic and the language of Zermelo–Fraenkel
    set theory are recursive. Moreover, in a recursive language, the set of well-formed
    formulas and the set of sentences are recursive. We may effectively associate
    each formula \(\varphi\) with its Gödel number \(\ulcorner \varphi \urcorner\).
    We say that a theory \(T\) is recursive if its corresponding set of Gödel numbers
    \(T'' = \{ \ulcorner \varphi \urcorner | \varphi \in T \}\) is recursive. The
    theories considered in this book, such as KP, ZFC, are recursive. Under coding
    with Gödel numbers, a proof sequence is identified with a finite sequence of numbers,
    and may therefore be considered as a finite subset of \(\omega\). Moreover,'
