  md: '# 14.3 \(\Pi^1_1\)-randomness


    # 14.3.1 The largest \(\Pi^1_1\)-nullset


    The notion of \(\Pi^1_1\)-randomness was introduced in Hjorth and Nies [51] and
    is unique to the study of higher randomness. There is no analog of this notion
    in the subject of classical randomness theory.


    **Theorem 14.3.1** (Kechris [64]; Stern [161]; Hjorth and Nies [51]). _There is
    a largest_ \(\Pi^1_1\)_-nullset._


    _Proof._ Define


    \(\mathcal{P} = \{(\ulcorner \varphi \urcorner, x) \mid \varphi \text{ is a ranked
    formula} \land \Omega(\mathfrak{A}_1^{\text{CK}}, x) \vDash \varphi(x) \land \mu(\{x
    \mid \Omega(\mathfrak{A}_1^{\text{CK}}, x) \vDash \neg \varphi(x)\}) \ge 1\}\)


    and


    \(\Omega_{\ulcorner \varphi \urcorner} = \{x \mid (\ulcorner \varphi \urcorner,
    x) \in \mathcal{P}\}.\)


    Define


    \(\Omega = \bigcup_{n < \omega} \bigcup_n \Omega_n \cup \{x \mid \omega_1^x >
    \omega_1^{\text{CK}}\}.\)


    We show that \(\Omega\) is the largest \(\Pi^1_1\)-nullset. By Theorem 13.11.1,
    \(\Omega\) is \(\Pi^1_1\). Moreover, \(\mu(\Omega_n) = 0\) for all \(n < \omega\).
    By Theorem 13.1.4, \(\mu(\Omega) = 0\).


    If \(A\) is a \(\Pi^1_1\)-nullset, then, by Corollary 3.74, there is an arithmetic
    formula \(\varphi(x, z)\) such that if \(\omega_1^x = \omega_1^{\text{CK}}\),
    then \(x \in A \Leftrightarrow \mathfrak{A}(\omega_1^x, x) \vDash (\exists y)\varphi(x,
    y)\). Hence if \(\omega_1^x = \omega_1^{\text{CK}}\), then \(x \in A \Leftrightarrow
    \mathfrak{A}(\omega_1^{\text{CK}}, x) \vDash (\exists y)\beta(\varphi, y^\beta)\)
    for some \(\beta < \omega_1^{\text{CK}}\). Since \(A\) is null, we have


    \(A \cap \{z \mid \omega_1^z = \omega_1^{\text{CK}}\} \subseteq \bigcup_{\beta
    < \omega_1^{\text{CK}}} \Omega_{\ulcorner (\exists y)\beta(\varphi, y^\beta) \urcorner}.\)


    Thus \(A \subseteq \Omega\).


    # **Corollary 14.3.2.** _For any_ \(x \in 2^\omega\)_, the following are equivalent:_


    +   (i) \(x\) is \(\Pi^1_1\)-random;

    +   (ii) \(x\) is strongly \(\Pi^1_1\)-ML random and \(\omega_1^x = \omega_1^{\text{CK}}\);

    +   (iii) \(x\) is \(\Pi^1_1\)-ML random and \(\omega_1^x = \omega_1^{\text{CK}}\).

    +   (iv) \(x\) is \(\Delta^1_1\)-random and \(\omega_1^x = \omega_1^{\text{CK}}\).


    _Proof._ Suppose that \(x\) is \(\Pi^1_1\)-random. Since \(\{z \mid \omega_1^z
    > \omega_1^{\text{CK}}\}\) is a \(\Pi^1_1\)-nullset, we have \(\omega_1^x = \omega_1^{\text{CK}}\)
    and hence (i) \(\Rightarrow\) (ii) \(\Rightarrow\) (iii).


    By Theorem 14.2.10, (iii) implies (iv). We now show (iv) \(\Rightarrow\) (i).
    By the proof of Theorem 4.31, if \(\omega_1^x = \omega_1^{\text{CK}}\) and \(x
    \in \Omega\), then \(x \in \Omega_n\) for some \(n\). Since \(\Omega_n\) is a
    \(\Delta^1_1\)-nullset, if \(\omega_1^x = \omega_1^{\text{CK}}\) and \(x\) is
    \(\Delta^1_1\)-random, then it is \(\Pi^1_1\)-random.


    The equivalence between (i) and (iv) was also obtained by Stern [161].'
