    a real $x \in B$ such that $x \not\le_h 0$. Furthermore, $x \not\le_h 0$ since
    $\omega_1^x = \omega_1^{CK}$. $\square$


    It should be pointed out that Spector''s original proof of Theorem 2.5.5 was quite
    different from the one given above. His proof involved a measure-theoretic argument
    and was nonconstructive. That idea will be explored in Chapter 14 on higher randomness.


    # ## 2.5.3 Kreisel''s Basis Theorem


    **Theorem 2.5.6** (Kreisel [35]). If $x$ is nonhyperarithmetic and $A \subseteq
    \omega^\omega$ is a nonempty $\Sigma^1_1$-set, then there is a $y \in A$ such
    that $x \not\le_h y$.


    Proof. Suppose that $x$ is nonhyperarithmetic and $A \subseteq \omega^\omega$
    is a nonempty $\Sigma^1_1$-set. By Gandy''s Basis Theorem 2.5.3, the set $B =
    \{z | \omega_1^z = \omega_1^{CK} \land z \in A\}$ is a nonempty $\Sigma^1_1$-set.
    For each pair $(e, n)$ with $n \in \omega$, let


    $P_{(e,n)} = \{z | (\exists i)(\Phi_e^{\tilde{H}_i}(i) \downarrow \lor \Phi_e^{\tilde{H}_i}(i)
    \downarrow \neq x(i))\}.$


    We claim that for any nonempty $\Sigma^1_1$-set $C$, there is a nonempty $\Sigma^1_1$-set
    $Q_{(e,n)} \subseteq C \cap P_{(e,n)}$. There are three cases to consider.


    +   (1) There exist $z \in C$ and $i \in \omega$ such that $\Phi_e^{\tilde{H}_i}(i)
    \uparrow$. Then let $Q_{(e,n)} = \{z | (\Phi_e^{\tilde{H}_i}(i) \uparrow \land
    z \in C)\}$.


    +   (2) Not Case (1) but there exist $z_0, z_1 \in C$ and $i \in \omega$ such
    that $\Phi_e^{\tilde{H}_{z_0}}(i) \uparrow \neq \Phi_e^{\tilde{H}_{z_1}}(i)$.
    Then there is a $k \le 1$ such that $\Phi_e^{\tilde{H}_k}(i) \neq x(i)$. Let $Q_{(e,n)}
    = \{z | (\Phi_e^{\tilde{H}_z}(i) = \Phi_e^{\tilde{H}_k}(i) \land z \in C)\}$.


    +   (3) Neither (1) nor (2). Then the $\Sigma^1_1$-set $\{u | (\exists 2i)(\forall
    z \in C \land u(i) = \Phi_e^{\tilde{H}_z}(i))\}$ contains exactly one real which
    must be hyperarithmetic. Let $Q_{(e,n)} = C$.


    By Proposition 1.1.12, there is a $y \in B \cap \bigcap_{n < \omega} P_{(e,n)}$.
    By the definition of $P_{(e,n)}$, $x \neq \Phi_e^{\tilde{H}_y}$. Note that $\omega_1^y
    = \omega_1^{CK}$. Hence by Theorem 2.3.3, we conclude $x \not\le_h y$. $\square$


    Theorem 2.5.6 says that the cone of sets hyperarithmetically above one that is
    non-hyperarithmetic does not contain a nonempty $\Sigma^1_1$-subset. In particular,
    no cone above a nonhyperarithmetic set is $\Sigma^1_1$. From the model-theoretic
    point of view, the argument used in the proof of the theorem is a type-omitting
    argument. This will be used again later to construct nonstandard models for characterizing
    hyperarithmetic sets via the constructible hierarchy $L$.'
