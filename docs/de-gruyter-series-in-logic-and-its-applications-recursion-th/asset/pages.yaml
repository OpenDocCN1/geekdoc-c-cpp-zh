    \( \dot{\sigma} \). Let \( y \in A \) so that \( y \ge_T \dot{\tau} \). Then \(
    \dot{\sigma} * y = y \oplus x \) for some \( x \le_T y \). Hence \( \dot{\sigma}
    * y \notin B \).


