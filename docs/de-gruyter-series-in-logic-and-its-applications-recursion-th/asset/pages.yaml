  md: 'given by Harrington (unpublished). The following is a stronger version which
    is used to study higher randomness theory.


    **Theorem 13.2.1** (Chong and Yu [14]). Let \(A_0\) and \(A_1\) be uncountable
    \(\Sigma^1_1\)-sets. For any \(z \ge_h \emptyset\), there exist \(x_0 \in A_0\)
    and \(x_1 \in A_1\) such that \(x_0 \oplus x_1 \equiv_h z\).


    **Proof.** Fix a real \(z \ge_h \emptyset\) and two uncountable \(\Sigma^1_1\)-sets
    \(A_0\) and \(A_1\). Then there are two recursive trees \(T_0, T_1 \subseteq 2^{<\omega}
    \times \omega^{<\omega}\) such that for \(i \le 1\), \(A_i = \{x \mid [\exists
    f](n \in [n, f] \in T_i)\}\). We may assume that neither \(\alpha_0\) nor \(\alpha_1\)
    contains a hyperarithmetic real. Also assume that if \((\sigma, \tau) \in T_i,
    i \le 1\), then \(|\sigma| = |\text{Dom}(\tau)|\). Let \(T_2 \subseteq \omega^{<\omega}\)
    be recursive so that \([T_2]\) is uncountable and does not contain a hyperarithmetic
    infinite path. Let \(f_0\) be the leftmost path in \(T_2\). Then \(f_0 \oplus_h
    \emptyset\).


    For \(s=1\), let \([T_1] = (x_i, f_i) \mid \forall n [n \notin n \in T_i])\).
    Our plan is to define \(x_i \in A_i\) such that \(z \equiv_h x_0 \oplus x_1\).
    To this end, a procedure of coding \(z\) and \(f_0\) into \(x_0\) and decoding
    them from \(x_0 \oplus x_1\) will be introduced. Construction of \(x_i\) will
    be carried out in \(\omega^x[x]\) on the recursive tree \(T_i\), hence hyperarithmetically
    in \(z\) (since \(z \ge_h \emptyset\)). Since \(A_i\) is \(\Sigma^1_1\), \(x_{i-1}\)
    will also code in the function \(f_i\) which is the leftmost path in the second
    component of \([T_i]\) serving as a witness to \(x_i\) being in \(A_i\), (i.e.
    \((x_i, f_i) \in [T_i]\) and for any \(i\), if \((x_i, f_i) \in [T_i]\) and \(f_i
    \neq f_j\), then the least \(n\) where \(f_i(n) \neq f(n)\) satisfies \(f_i(n)
    < f(n)\)). Since \(A_i\) has no hyperarithmetic member, for any \((\sigma, \tau)
    \in T_i\), if \(\sigma \prec \tau\) and \(\tau \prec f\) for some \((x, f) \in
    [T_i]\), then there exist incompatible extensions \(\sigma''\) and \(\sigma''''\)
    of \(\sigma\), and (possibly compatible) extensions \(\tau'', \tau''''\) of \(\tau\),
    so that \((\sigma'', \tau'')\) and \((\sigma'''', \tau'''')\) both have extensions
    in \([T_j]\). This "splitting property" of \([A_i]\) allows the coding of \(z,
    f_i\) and \(f_0\) in \(x_0\) and the coding of \(f_0\) in \(x_1\). More specifically,
    the branch to be selected by \(x_0\) at a splitting node when \(z(s)\) is to be
    coded (at stage \(s+1\) of the construction) will follow the value of \(z(s)\),
    so that a "left turn" is taken if \(z(s) = 0\) and a right turn is taken if \(z(s)
    = 1\). The coding at stage \(s+1\) of \(\tau_{1,s}\), which denotes the initial
    segment of \(f_1\) defined at the end of stage \(s\), is accomplished by taking
    \(\tau_{1,s}(t)\)-many consecutive left turns at splitting nodes, for each \(t
    \in \text{Dom}(\tau_{1,s})\). The coding of \(f_0(s)\) at stage \(s+1\) of the
    construction is carried out by taking left turns at \(f_0(s)\)-many consecutive
    splitting nodes.


    For the purpose of decoding, one has to delineate different types of action taken
    during the coding phase. Since \(\tau_{1,s}\) is a finite function, the end of
    coding the value \(\tau_{1,s}(t)\) and the beginning of coding the value \(\tau_{1,s}(t+1)\),
    for \(t < |\text{Dom}(\tau_{1,s})|\), is separated by a right turn at the splitting
    node between the two codings (of course since the construction is executed stage
    by stage, one may assume that at the beginning of stage \(s+1\), the coding of
    \(\tau_{1,s-1}\) is already completed. This means that at stage \(s+1\), one only
    needs to code the values \(\tau_{1,s}(t)\) for \(t \in \text{Dom}(\tau_{1,s})
    \setminus \text{Dom}(\tau_{1,s-1})\)). A "right turn" is chosen at the next splitting
    node to signify the end of coding \(\tau_{1,s}\), and the beginning of the coding
    of \(f_0(s)\). Finally, a right turn is taken at the next splitting stage after
    coding \(f_0(s)\) to mark the end of the coding action for \(x_0\) at stage \(s+1\).
    This initial segment of \(x_0\) coded at stage \(s+1\) is denoted \(\sigma_{0,s+1}\).
    Then \(\sigma_{0,s+1} \prec f_0\) is a finite string in \(\omega^{<\omega}\) such
    that \(|\text{Dom}(\tau_{0,s+1})| = |\sigma_{0,s+1}|\). \(\tau_{0,s+1}\) extends
    \(\tau_{0,s}\), and is the leftmost such string. The coding of the initial segment
    \(\tau_{0,s+1}\) of \(f_0\) in \(x_1\) at stage \(s+1\), denoted \(\sigma_{1,s+1}\),
    proceeds'
