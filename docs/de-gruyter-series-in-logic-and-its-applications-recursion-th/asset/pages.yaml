  md: 'A real \( x \) is *recursively dominated* if every function \( f \le_T x \)
    is dominated by a recursive function. The following result gives a characterization
    of strong Martin-Löf randomness for recursively dominated reals.


    **Proposition 12.1.8 (Yu).** If \( x \) is recursively dominated, then \( x \)
    is strongly Martin-Löf random if and only if it is Kurtz random.


    Next is a characterization of Martin-Löf randomness in terms of Schnorr randomness.


    **Theorem 12.1.9 (Nies, Terwijn and Stephan [112]).** For any real \( x \),

    (i) if \( x \) is Schnorr random and \( x'' \not\ge_T 0'''' \), then \( x \) is
    Martin-Löf random;

    (ii) if \( x'' \ge_T 0'''' \), then there is a Schnorr random real \( y \equiv_T
    x \) such that \( y \) is not Martin-Löf random.


    # 12.1.6 The computational power of random reals


    The following theorem says that random reals may have very strong computational
    power:


    **Theorem 12.1.10 (Kučera [76]).** *For any real* \( x \ge_T 0'' \)*, there is
    a Martin-Löf random real* \( z \equiv_T x \).


    Rather unexpectedly, strong Martin-Löf randomness does not yield the same conclusion:


    **Theorem 12.1.11 (Downey, Nies, Weber, Yu [23] and Hirschfeldt, Miller).** *A
    real* \( x \) *is strongly Martin-Löf random if and only if* \( x \) *is Martin-Löf
    random and Turing computes no nonrecursive* \( \Delta_2^0 \)*-real.*


    In algorithmic randomness theory, there is a thesis which states that *more randomness
    means less computational power*. Although a random real \( x \) contains much
    information, the information may be computationally useless in the sense that
    it cannot be used to predicate any set except the set \( x \) itself. There is
    much evidence in the literature to support this thesis. We give some examples.


    **Definition 12.1.12.** Let \( h \) be a function. A real \( x \) is \( h \)-diagonally
    nonrecursive, abbreviated \( h \)-DNR, if there is a function \( f \le_T x \)
    such that \( f(e) \neq \Phi_e(e) \) and \( f(e) < h(e) \) for every \( e < \omega
    \). We say that \( x \) is DNR if there is a function \( f \le_T x \) such that
    \( f(e) \neq \Phi_e(e) \) for \( e < \omega \).


    The next theorem implies that no incomplete Martin-Löf random real is 2-DNR.


    **Theorem 12.1.13 (Stephan).** *Suppose that* \( x \in 2^\omega \) *is Martin-Löf
    random. Then* \( x \) *is* 2*-DNR if and only if* \( x \ge_T 0'' \).'
