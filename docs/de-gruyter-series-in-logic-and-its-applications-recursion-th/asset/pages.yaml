    an infinite set of \(l\)''s contained in \(a_k\). Since \(a_k\) is recursive in
    each of its infinite subsets, this set computes \(a_k\).


    Thus \(x \ge_h a_k\), proving the lemma.


    One may now convert an arbitrary countable relation on the degrees into an antichain
    so that the original relation is definable from the antichain using parameters.


