    changing the value of \(q_i^m\) at the point \(i\) to agree with that of \(r_1^i\),
    \(s_2(0) \mid [q_1^m]^2 = q_2^m\) and \(s_5(0) = q_5^m\), and then extending it
    to decide the value of \(\varphi_{x \oplus g_i}(m)\). Then extend the domains
    of \(q_1^m, q_2^m\) and \(r_1^m, r_2^m\) to that of \(s_1(0)\) so that the new
    points in these domains agree with \(s_1(0)\) in their values. Call the resulting
    conditions \(q^m(0)\) and \(r^m(0)\). Either \(s_1(0)\) and \(q_1^m(0)\) disagree
    at exactly one point, \(s_2(0) = q_2^m(0)\), and \(s(0)\) and \(q^m(0)\) force
    incompatible values for \(\varphi_{x \oplus g_i}(m)\), or \(s(0)\) and \(r^m(0)\)
    force incompatible values and have fewer points of disagreement between them than
    that between \(q^m\) and \(r^m\). For \(q_i^m\) and \(r_i^m\), we carry out the
    same construction. By induction, one defines successively \(s(0), s(1), \dots\)
    and concludes that there is a \(j\) so that \(s(j)\) and \(s(j+1)\) with exactly
    one point of disagreement in the first two components forcing incompatible values
    for \(\varphi_{x \oplus g_i}(m)\).


    Thus we may assume that \(q^m\) and \(r^m\) differ exactly at one point \((k,
    l)\) so that \(q_1^m((k, l)) \neq r_1^m((k, l))\). If either \(k > p_3\) or \(l
    \notin a_k\), then let \(s = (s_1^m, r_2^m, q_3 + r_3)\). Then \(s \le p\). This
