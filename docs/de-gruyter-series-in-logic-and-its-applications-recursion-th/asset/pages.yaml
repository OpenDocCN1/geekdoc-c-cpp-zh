  md: 'HF can be redefined by induction as follows:


    ```

    HF(0) = 0,

    HF(n + 1) = {a | a ⊆ HF(n)},

    HF = ∪_{n<ω} HF(n).

    ```


    Thus HF = V_ω. We leave the following theorem as an exercise.


    # Theorem 3.2.4. HF is the smallest admissible set.


    (HF, ε) is the first natural example of an admissible set we encounter. There
    is a natural and standard way of identifying n as a natural number (in arithmetic)
    and n as a finite ordinal (in set theory). We will follow the convention of identifying
    these two objects. The following theorem highlights an important connection between
    recursion theory and admissibility theory, and explains the reason for introducing
    admissible sets in the study of generalized recursion theory.


    # Theorem 3.2.5. Let S be a relation on the natural numbers. Then S is r.e. if
    and only if S is Σ1 over (HF, ε).


    Proof. It is sufficient to assume that S is infinite. The class of r.e. relations
    is the class of relations which are Σ1-definable over (ω, +, ·, 0, 1, <) in the
    language of first order arithmetic. Thus for the "only if" part, it is sufficient
    to show that if S ⊆ ω is Σ1 over (ω, +, ·, 0, 1, <), then it is Σ1 over (HF, ε)
    in the language of set theory. It is obvious that the set of ordinals in HF, i.e.
    ω, is Δ1-definable over (HF, ε). Now it is routine to show that if S is defined
    by an open formula φ involving +, ·, then it is defined over (HF, ε) by a Δ1-formula
    φ* in the language of set theory. Also "u < v" is definable over (HF, ε) by "u
    ∈ v". Hence any open formula defining S involving +, ·, < is definable by a corresponding
    Δ1-formula over (HF, ε) in the language of set theory.


    For S defined by a bounded formula φ in the language of set theory (∃i < n) ψ
    where ψ is open, let φ* be (∃u ∈ n) ψ*(u), where ψ* is the Δ1-formula corresponding
    to ψ (note that the "n" in φ* denotes the finite ordinal n). Define φ* for φ of
    the form (∀i < n) ψ and ψ open, in the obvious way. By induction on the complexity
    of formulas, any S ⊆ ω defined by a bounded formula in the language of first order
    arithmetic has a corresponding definition via a Δ1-formula in the language of
    set theory over (HF, ε).


    Now assume that S = (m|(3i)ψ(i, m)) where ψ is a bounded formula in arithmetic.
    By induction, let ψ* be Δ1 such that (ω, +, ·, 0, 1, <) ⊨ ψ(n, m) if and only
    if (HF, ε) ⊨ ψ*(n, m). Then n ∈ S if and only if


    ```

    (HF, ε) ⊨ (3u)(u is an ordinal ∧ ψ*(u, m)).

    ```


    Hence S is Σ1 over (HF, ε).'
