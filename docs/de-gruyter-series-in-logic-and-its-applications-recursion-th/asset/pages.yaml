    +   (iv) Every \( \Pi_1^1\)-ML random real is \( \Delta_1^1(x)\)-random.


    Proof. (i) \(\Rightarrow\) (ii): Assume that \( x \) is \( \Delta_1^1\)-traceable.
    Let \( S \) be a \( \Delta_1^1(x)\)-nullset. By Proposition 14.2.2 relativized
    to \( x \), there is a \( \Delta_1^1(x)\)-ML test \( (U_n)_{n \in \omega} \) such
    that \( \mu(U_n) = 2^{-n} \) for each \( n \) and \( S \subseteq \bigcap U_n \).
    Let \( (S_e)_{e \in \omega} \) be a recursive enumeration of all finite subsets
    of \( 2^{<\omega} \). There is a function \( f \le_S x \) such that \( (S_{f(n,s)})_s
    = U_{n,s} \) satisfies \( U_{n,s} \subseteq U_{n,s+1} \), \( U_n = \bigcup_{s
    < \omega} U_{n,s} \), and \( \mu(U_{n,s}) > 2^{-n}(1 - 2^{-s}) \). Let \( T =
    (T_e)_{e \in \omega} \) be a \( \Delta_1^1\)-trace for \( f \). We may choose
    \( T \) such that in addition \( |T_e| \le e \) for each \( e > 0 \).


    We now define a subtrace \( V_n \) via \( \hat{T} \) of \( T \), i.e., \( \hat{T}_{(n,s)}
    \subseteq T_{(n,s)} \) for each \( n, s \). The objective is to define open sets
    \( V_n \), via \( \hat{T} \) (in a way to be specified) small enough to give us
    a \( \Delta_1^1\)-nullset \( \mathcal{V} = \bigcap_{n < \omega} V_n \), yet large
    enough as to keep all "relevant" reals out of \( T_{(n,s)} - \hat{T}_{(n,s)} \),
    so that \( \bigcap_{n < \omega} U_n \subseteq \mathcal{V} \).


    Let \( \hat{T}_{(n,s)} \) be the set of \( e \in T_{(n,s)} \) such that \( 2^{-n}(1
    - 2^{-s}) \le \mu([S_e]) \le 2^{-n} \) and \( [S_e] \subseteq [S_d] \) for some
    \( d \in \hat{T}_{(n,s-1)} \) (where \( \hat{T}_{(n,-1)} = \omega \)). Note that
    \( f((n,s)) \in \hat{T}_{(n,s)} \). Let \( V_n = \bigcup \{ [S_e] \mid e \in \hat{T}_{(n,s)},
    s \in \omega \} \).


    Then \( \mu(V_n) \le 2^{-n} \lceil T_{(n,0)} \rceil + \sum_{s < \omega} 2^{-2-n}
    \lceil T_{(n,s)} \rceil \). Since \( \lceil T_{(n,s)} \rceil \le \lceil T_{(n,s)}
    \rceil \le \langle n,s \rangle \) for \( (n,s) \neq 0 \), and \( (n,s) \) has
    only polynomial growth in \( n \) and \( s \), it is clear that \( \lim_n \sum_{s
    < \omega} 2^{-2-n} \lceil T_{(n,s)} \rceil = 0 \), and hence \( \lim_n \mu(V_n)
    = 0 \). Then \( \mathcal{V} = \bigcap_n V_n \) is a \( \Delta_1^1\)-nullset and
    \( \bigcap U_n \subseteq \mathcal{V} \).


    (ii) \(\Rightarrow\) (iii) and (iii) \(\Rightarrow\) (iv) are immediate.


    (iv) \(\Rightarrow\) (i). The proof is identical to the proof in [67]. We leave
    it to the reader.


    By Theorem 13.3.18, lowness for \( \Delta_1^1\)-randomness is different from that
    for \( \Delta_1^1\)-Kurtz randomness.


    # 14.6.3 Lowness for \( \Pi_1^1\)-ML randomness


    # Theorem 14.6.9 (Hjorth and Nies [51]). Every real low for \( \Pi_1^1\)-ML randomness
    is hyperarithmetic.


    Proof. We give a sketch. Suppose that \( x \) is low for \( \Pi_1^1\)-ML randomness.
    Then it is not difficult to verify that \( \omega_1^x = \omega_1^{CK} \) and that
    there is a \( \Pi_1^1(x)\)-ML random \( y \ge_T x \). In fact, one may use a \(
    \Pi_1^1\)-version of Turing reduction, termed \( \le_{fin-h} \) and introduced
    in [51], to argue that \( x \le_{fin-h} y \). In other words, there is a consistent
    \( \Pi_1^1\)-partial map \( \Phi : 2^{<\omega} \to 2^{<\omega} \) such that \(
    x = \bigcup_{n < \omega} \Phi(Y \upharpoonright n) \). Applying the method in
    [48] it can be shown that \( x \) is \( K_{HJ} \)-trivial, where \( K_{HJ} \)
    is an analog of Kolmogorov complexity in the \( \Pi_1^1\)-setting. It follows
    as in [51] that every \( K_{HJ} \)-trivial real is either hyperarithmetic or is
    hyperarithmetically equivalent to \( 0^\triangledown \). Since \( \omega_1^x =
    \omega_1^{CK} \), \( x \) has to be hyperarithmetic.'
