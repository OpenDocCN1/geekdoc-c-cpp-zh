    # 2.5 Some basis theorems and their applications


    # 2.5.1 Gandy''s Basis Theorem


    A set of reals \( A \) is a *basis* for a collection of sets \(\mathbf{P}\) of
    reals if for any nonempty \( P \in \mathbf{P} \), \( P \cap A \neq \emptyset \).
    Basis theorems are very important in recursion theory. They are used against another
    things to pin down the complexity of predicates. For example, let \(\{T_i\}_{i
    \in \omega}\) be an effective enumeration of recursive trees in \( 2^{<\omega}
    \). The index set \( N = \{i \mid T_i \text{ contains an infinite path}\} \) appears
    to be \(\Sigma_1^1\). But one can show that every recursive tree in \( 2^{<\omega}
    \) containing an infinite path must contain an infinite path recursive in \( \emptyset''
    \) (see Exercise 1.5.3). So \( N \) is an arithmetical set.


    **Lemma 2.5.1.** Suppose that \( T \subseteq \omega^{<\omega} \) is a recursive
    tree with an infinite path. There is an infinite path \( x \in [T] \) recursive
    in \( \emptyset \).'
