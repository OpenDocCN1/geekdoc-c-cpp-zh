  md: 'One of the most basic theorems in classical recursion theory is the Friedberg-Mučnik
    Theorem ([28] and [109]) which asserts the existence of two incomparable r.e.
    Turing degrees. Since $\Pi^1_1$-sets are seen as analogs of r.e. sets in the higher
    setting, the following result shows that there is a fundamental difference between
    the two notions of reducibility.


    **Theorem 2.4.4 (Specter [153]).** If $x, y \in \Pi^1_1$ and $y \notin \text{HYP}$,
    then $x \le_h y$.


    Proof. We show that $\mathcal{O} \le_h y$. By Theorem 1.5.1, there is a recursive
    function $f$ such that $n \in \mathcal{O} \Leftrightarrow f(n) \in \mathcal{O}$.
    Since $y \notin \text{HYP}$, by Lemma 2.2.4, $\sup(|f(n)|_y \in y)$ is $\omega_1^{CK}$.
    Then

    $n \in \mathcal{O} \Leftrightarrow (\exists m)(m \in y \land n \in \mathcal{O}_{f(m)})$

    and

    $n \notin \mathcal{O} \Leftrightarrow (\forall m)(m \in y \rightarrow n \notin
    \mathcal{O}_{f(m)})$.

    By Lemma 2.2.3, $\mathcal{O} \le_h y$.


    **Remark 2.4.5.** Theorem 2.4.4 prompted Kreisel to suggest that $h$-reduction
    was not the “correct” notion of reducibility for higher recursion theory. This
    led to the introduction of the notion of metarecursive reducibility in metarecursion
    theory. It is shown in Sacks [118] that there exist two $\Pi^1_1$-sets with incomparable
    metadegrees.


    There is a tight link between $\omega_1^x$ and the $h$-degree of $x$, as illustrated
    in the following proposition:


    **Proposition 2.4.6 (Specter [153]).** $x \le_h y \implies \omega_1^x \le \omega_1^y$.


    Proof. Since $x \le_h y$, every $x$-recursive well-ordering relation $R \le \omega^2$
    is $\Delta^1_1$ in $y$. By relativizing Proposition 1.5.6 to $y$, $R$ has order
    type $< \omega_1^y$. Hence $\omega_1^x \le \omega_1^y$.


    The converse of Proposition 2.4.6 does not hold in general. However, there is
    an important partial result which characterizes $\omega_1^{CK}$.


    **Theorem 2.4.7 (Sacks).** $\omega_1^x > \omega_1^{CK}$ if and only if $x \ge_h
    \mathcal{O}$.


    We decompose the proof into two lemmas, with the following left as an exercise:


    **Lemma 2.4.8 (Sacks).** Suppose $x \le_T y$. Then there is a recursive function
    $f$ such that (i) $(\forall n)(\forall m)(n <_O m \rightarrow f(n) < f(m))$, (ii)
    $(\forall n)(n \in \mathcal{O}^x \rightarrow |n|_x = |f(n)|_y)$.


    **Lemma 2.4.9 (Specter [153]).** (i) $\mathcal{O}^x \le_h y \implies \omega_1^x
    < \omega_1^y$. (ii) $\omega_1^x < \omega_1^y \land x \le_h y \implies \mathcal{O}^x
    \le_h y$.


    Proof. (i) $<_O$ is $\Pi^1_1(x)$ and hence is recursive in $\mathcal{O}^x$. Thus
    by Proposition 2.4.6, $\omega_1^x < \omega_1^{\mathcal{O}^x} \le \omega_1^y$.'
