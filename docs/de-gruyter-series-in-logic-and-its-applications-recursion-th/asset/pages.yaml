  md: '# 12 Review of classical algorithmic randomness


    We assume familiarity with the classical theory of algorithmic randomness and
    give a review of the subject in this chapter. For details see [111] and [24].


    # 12.1 Randomness via measure theory


    Intuitively, a random real should pass every feasible statistical test. This is
    the motivation for using measure theory to define randomness. In the language
    of measure theory, a test is associated with a null set. The following is a summary
    of the key notions of measure theoretic-randomness.


    # 12.1.1 Kurtz and Schnorr randomness


    The notion of (now called) Kurtz randomness was introduced in Kurtz [79].


    **Definition 12.1.1.** (i) A set \(A \subseteq 2^\omega\) is a *Kurtz test* if
    it is \(\Pi^0_1\) and \(\mu(A) = 0\); (ii) a real \(x\) is *Kurtz random* if \(x
    \notin A\) for every Kurtz test \(A\).


    **Definition 12.1.2** (Schnorr [125] and [127]). (i) A sequence of open sets \(\{U_n\}_{n<\omega}\)
    is a *Schnorr test* if \(\{(n, \sigma) \mid \sigma \in U_n\}\) is r.e. and \(\mu(U_n)
    = 2^{-n}\) for every \(n < \omega\); (ii) a real \(x\) is *Schnorr random* if
    \(x \notin \bigcap_{n<\omega} U_n\) for every Schnorr test \(\{U_n\}_{n<\omega}\).


    **Proposition 12.1.3** (Terwijn and Zambella [163]). A real \(x\) is Schnorr random
    if and only if \(x \notin \bigcap_{n<\omega} V_n\) for every sequence of open
    sets \(\{V_n\}_{n<\omega}\) such that \(\{(n, \sigma) \mid \sigma \in V_n\}\)
    is r.e. and \(\mu(V_n) = 2^{-f(n)}\) for some recursive function \(f\).


    # 12.1.2 Martin-Löf randomness


    The notions of Kurtz and Schnorr randomness both turn out to be somewhat restrictive
    and unsatisfactory. The next notion, due to Martin-Löf, is perhaps the most widely
    studied to-date.


    **Definition 12.1.4** (Martin-Löf [96]). (i) A sequence of open sets \(\{U_n\}_{n<\omega}\)
    is a *Martin-Löf test* if \(\{(n, \sigma) \mid \sigma \in U_n\}\) is r.e. and
    \(\mu(U_n) < 2^{-n}\) for every \(n < \omega\); (ii) a real \(x\) is *Martin-Löf
    random* if \(x \notin \bigcap_{n<\omega} U_n\) for every Martin-Löf test \(\{U_n\}_{n<\omega}\).


    The next result says that Martin-Löf randomness is decided by a single test.'
