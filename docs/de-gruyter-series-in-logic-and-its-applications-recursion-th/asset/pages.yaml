    predicate \( B(x, z) \) such that \( x \in A \Leftrightarrow (\exists z \in O^\times)
    x B(x, z) \). If \( x \in A \), choose \( n \in O^\times \) so that \( |n|_x \)
    is minimal and \( B(x, \phi_{n_1}^H) \) holds for some \( e \). Let \( p(x) \)
    as follows:


