    Theorem 3.7.3 says that if we consider $\Pi_1^1$-sets to be r.e. sets, then hyperarithmetic
    reals are analogs of finite sets. In particular, there are infinite sets of natural
    numbers which are “finite”. This is a departure from the classical notion where
    infinite sets are never “finite”.


    As mentioned in § 3.7.1, the Gandy–Specter Theorem presents an effective – hence
    recursion-theoretic – way to enumerate members of a $\Pi_1^1$-set. The enumeration
    is carried out in $L_{\omega_1^x}$ through ordinals less than $\omega_1^{CK}$.


    The situation is more problematic with $\Pi_1^1$-sets of reals. Corollary 3.7.2
    says that a set $A \subseteq 2^\omega$ is $\Pi_1^1$ if and only if there is a
    $\Sigma_1^1$-formula $\varphi(u)$ such that $x \in A \leftrightarrow (L_{\omega_1^x}[x],
    \in) \models \varphi(x)$ (rather than $(L_{\omega_1}, \in) \models \varphi(x)$).
