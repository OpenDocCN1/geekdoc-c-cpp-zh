    # 13.3 Hyperarithmetic computation


    In this section, we discuss some notions concerning effective bounding in the
    context of hyperarithmetic theory. The results will be applied to study higher
    randomness.


    # 13.3.1 Hyperarithmetic domination


    Definition 13.3.1. A real \(x\) is \(\Delta^1_1\)-dominated if for any function
    \(f : \omega \to \omega\) with \(f \le_T x\), there is a hyperarithmetic \(g\)
    such that \((\forall n)(g(n) > f(n))\)(\text{written as } g > f\)).


    The first item to note is that there is an abundance of \(\Delta^1_1\)-dominated
    reals.


    Theorem 13.3.2 (Chong, Nies and Yu [12]). \(\mu(\{x \mid x \text{ is } \Delta^1_1\text{-dominated}\})
    = 1\).


    Proof. We prove that for any random number \(p\), \(\mu(\{x \mid x \text{ is }
    \Delta^1_1\text{-dominated}\}) \ge p\).


    This is achieved with the use of a fusion argument.


    First we show that for any \(e\), rational \(r\), notation \(n \in \mathcal{O}\)
    and \(\Delta^1_1\)-set \(A\) where \(p + r < \mu(A)\), there is a hyperarithmetic
    function \(f\) such that \(\mu(\{x \mid x \in A \wedge \Phi_e^{B_k} \text{ is
    total} \to \Phi_e^{B_k} < f\}) > p + \frac{r}{2}\).


    Note that the set \(\{(x, i, m) \mid \Phi_e^{B_k}(i) \downarrow \to \Phi_e^{B_k}(i)
    < m\}\) is \(\Delta^1_1\). Since \(A\) is \(\Delta^1_1\), Proposition 13.1.6 implies
    that the set \(C = \{(i, m, k) \in \omega^3 \mid \mu(\{x \mid x \in A \wedge (\Phi_e^{B_k}(i)
    \downarrow \to \Phi_e^{B_k}(i) < m)\}) > \mu(A) - \frac{r}{2^{k+2}}\}\)


    is \(\Delta^1_1\). Note that for each \(k\), there is an \(m\) such that \((k,
    m, k) \in C\). Hence there is a \(\Delta^1_1\) total function \(f\) such that
    for all \(k\), \((k, f(k), k) \in C\). Define \(B_k = \{x \mid x \in A \wedge
    (\Phi_e^{B_k}(k) \downarrow \to \Phi_e^{B_k}(k) < f(k))\}\).


    Then the set \(\{(k, x) \mid x \in B_k\}\) is \(\Delta^1_1\). Moreover, for every
    \(k\), \(B_k \subseteq A\) and \(\mu(B_k) > \mu(A) - \frac{r}{2^{k+2}}\). Hence
    \(B = \cap_k B_k\) is \(\Delta^1_1\) and \(\mu(B) \ge \mu(A) - \sum_{k \ge 0}
    \mu(A - B_k) \ge p + r - \sum_{k \ge 0} \frac{r}{2^{k+2}} = p + \frac{r}{2}\).'
