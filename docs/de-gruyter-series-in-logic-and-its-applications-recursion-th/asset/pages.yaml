  md: 'Proof. (i) Let $A = \{r \mid r \text{ codes a well-ordering of } \omega \land
    x \in L_{|r|}\}$, where $|r|$ denotes the order type of $r$ as a well-ordering.
    Then $A$ is $\Delta^1_2(x)$. Let $r \in A$. Since $x$ is not $\Delta^1_2$ we must
    have $|r| > \delta^1_2$. Hence $\delta^1_2 > \delta^1_2$.


    (ii) If $V = L$, then by Proposition 4.4.2, $\le_L$ is a $\Delta^1_2$ well-ordering
    of the reals. Suppose that $x \le_L y$. Then by the proof of (i), there is a $\Delta^1_2(y)$-real
    $r$ coding a well-ordering of $\omega$ such that $y \in L_{|r|}$ and so $x \in
    L_{|r|}$. Then $x \in L_{\omega_1^x}$ and hence $x \le_H y \le_A y$. Thus $x \le_A
    y$. So $\le_A$ is a well-ordering of $\Delta^1_2$-degrees and its order type is
    $\omega_1$. If $x <_A y$, then by the same argument as that in (i) but relativized
    to $y$, we have $\delta^{1,x}_2 < \delta^{1,y}_2$.


    Proposition 4.4.6 indicates that while $L$ is an appropriate ground model for
    hyperarithmetic theory, it is less so for a $\Delta^1_2$-theory as the well-ordering
    of the $\le_A$ relation makes the structure of the corresponding degrees relatively
    simple and hence less interesting.


    # 4.4.1 Exercises


    +   Exercise 4.4.1 (Solovay [149] and Mansfield [87]). Prove that every $\Sigma^1_2$-set
    of reals containing a nonconstructible real has a perfect subset.


    +   Exercise 4.4.2. $2^\omega \cap L$ is the largest countable $\Sigma^1_2$-set
    of reals if and only if $(\omega_1)^{1,x} < \omega_1$.


    +   Exercise 4.4.3. If $\omega_1 = (\omega_1)^{1,x}$, then there is no largest
    countable $\Sigma^1_2$-set of reals.


    +   Exercise 4.4.4. Prove that there is a real $x$ and a nonempty $\Pi^1_2$-set
    $P \subseteq 2^\omega$ such that $\delta^{1,x}_2 > \delta^1_2$ but there is no
    real $z \in P$ such that $z \le_{\Delta^1_2} x$.


    +   Exercise 4.4.5. Suppose that $\mathcal{L}$ is a countable language and $T$
    is a consistent theory of $\mathcal{L}$. Then $T$ has, up to elementary equivalence,
    either $\le \aleph_0$ or $2^{\aleph_0}$-many countable models.'
