    # Theorem 1.4.4 (Kleene [71], Markwald [89]). An ordinal is recursive if and only
    if it is constructive.


    Proof. Suppose $R$ is a recursive well-ordering with $|R| = \beta$. By Lemma 1.4.2,
    there is a constructive ordinal $\gamma \ge \beta$. Hence $\beta$ is constructive.
    Conversely, if $\beta$ is constructive, then by Theorem 1.3.4, there is a partial
    recursive well-ordering $R$ with $|R| = \beta$. By Lemma 1.4.3, $\beta$ is recursive.


