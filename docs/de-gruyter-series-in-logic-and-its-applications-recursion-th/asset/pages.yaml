    \ for each $\\Pi^1_1$-set $P$, there is a recursive function $f$ such that $x\
    \ \\in P$ if and only if $f(x) \\in \text{WO}_1$.\n\nLet $\\{R_e\\}_{e<\\omega}$\
    \ be an effective enumeration of recursively enumerable (r.e.) binary relations.\
    \ Then the set\n\n$\text{WF}_0 = \\{e \\mid R_e \text{ is wellfounded}\\}$\n\n\
    is $\\Pi^1_1$. Let $x \\subseteq \\omega$ be a $\\Pi^1_1$-set and $T \\subseteq\
    \ \\omega^{<\\omega} \times \\omega$ be a recursive tree such that $n \\in x$\
    \ if and only if $(\\forall y)(\\exists m)[y \nmid m, n] \notin T$. Clearly there\
    \ is a recursive function $f$ such that for any $n, T_n = \\{\\sigma \\mid (\\\
    sigma, n) \\in T\\} = R_{f(n)}$. Then $n \\in x$ if and only if $R_{f(n)}$ is\
    \ a wellfounded binary relation. In other words, $x$ is many-one reducible to\
    \ $\text{WF}_0$. By the same argument above, every $\\Pi^1_1$-set of numbers is\
    \ many-one reducible to the $\\Pi^1_1$-set $\text{WO}_0 = \\{e \\mid R_e \text{\
    \ is a well-ordering}\\}$.\n\nNote that the ordinal height of $\text{WF}_1$ may\
    \ be as high as $\\omega_1$. An interesting question is the ordinal height of\
    \ $\text{WF}_0$. In other words, what is the least ordinal which is not the ordinal\
    \ of a wellfounded recursive tree? We shall see that this ordinal, denoted $\\\
    omega_1^{\text{CK}}$, is a countable ordinal.\n\nThe following proposition provides\
    \ an interesting connection between $\\Sigma^1_1$-sets of reals and $\\Pi^1_1$-subsets\
    \ of $\\omega$.\n\n# Proposition 1.1.15 (Specter [153]). Suppose $P$ is a $\\\
