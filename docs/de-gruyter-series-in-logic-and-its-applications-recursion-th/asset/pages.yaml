  md: 'Proof. If \(0^\sharp\) does not exist, then by Lemmas 8.4.4 and 8.4.5, both
    \(F^*\) and \(\tilde{F}^*\) are cofinal. Let \(P(x, y)\) be an arithmetical predicate
    defined as


    \(x \in \tilde{F}^* \leftrightarrow (\forall y)P(x, y)\).


    # Claim 1. If \(x \le_T y\) are such that \(x \in F^*\) and \(y \in \tilde{F}^*\),
    then \(O^x \le_h y\).


    Proof. As \(y \notin F^*\), there are \(a < \omega_1^x\) and \(a \le \omega\)
    with \(a \in L_{a_1^x}[L_{a+1}(y)]\). Then \(a \notin L_{a+1}[x]\) and \(\omega_1^x
    \le a < \omega_1^y\). As \(x \le_T y\), \(O^x <_h y\).


    By Claim 1, if \(x \le_T y\) are such that \(x \in F^*\) and \(y \in \tilde{F}^*\),
    then \(O^{O^x} \le_T O^y\).


    +   (1) \((y)_0 = 0^{O^x} \land x \in F^* \text{ or } (y)_0 = 1^{O^{O^x}} \land
    (\exists v \le_T y)(y)_0 \neg P(x, v)\),

    +   (2) \((y)_1 = O^x\),

    +   (3) \(\Phi_e^x\) is partial \(\Rightarrow (y)_{e+2} = 0\),

    +   (4) \(u = \Phi_e^x\) is total \(\Rightarrow\)

    +   (i) \((y)_0(0) = 0 \land (\exists v \le_T (y)_1)\neg P(u, v) \land (y)_{e+2}
    = 1^{O^{0^{y(e_i)}}}\) where \(i\) is the least index so that \(O^{y(e_i)} = O^{0^{y(e_i)}}\),
    or

    +   (ii) \((y)_0(0) = 1 \land (\exists v \le_T (y)_1)\neg P(u, v) \land (y)_{e+2}
    = 0^{O^{O^x}}\), or

    +   (iii) \((\forall v \le_T (y)_1)P(u, v) \land (y)_{e+2} = 0^{O^{O^x}}\).


    It is straightforward to verify that \(G\) is \(\Pi^1_1\).


    # Claim 2. If \(x \in F^*\) then \(G(x) \equiv_T O^{O^{O^x}}\).


    Proof. Clearly \(x \in F^* \Rightarrow O^{O^{O^x}} \le_T G(x)\) and \((G(x))_0
    \oplus (G(x))_1 \le_T O^{O^{O^x}}\). Given \(e < \omega\), \(O^{O^{O^x}}\) can
    uniformly decide whether \(\Phi_e^x\) is total. Suppose that \(\Phi_e^x\) is total.
    To calculate \((G(x))_{e+2}(n)\) we need to check clauses (4 ii, 4 iii) above.
    Now the predicate \((\forall v \le_T (y)_1)P(u, v)\) is \(\Delta_1^1(O^x)\), and
    hence recursive in \(O^{O^x}\). Once this predicate is decided, \(O^{O^{O^x}}\)
    will be able to complete the calculation with the use of two recursive functions
    \(f, g\) such that \(u = \Phi_e^x \Rightarrow O^{O^x} = \Phi_{f(e)}^{O^{O^{O^x}}}\)
    and \(u = \Phi_e^w \Rightarrow O^{O^{O^w}} = \Phi_{g(e)}^{O^{O^{O^x}}}\).


    # Claim 3. If \(x \in \tilde{F}^*\) then \(G(x) \equiv_T O^{O^x}\).


    Proof. This is similar to the proof of Claim 2, except for the final step in the
    calculation of \(((G(x))_{e+2}(n))\). Now \(O^{O^x}\) can decide whether (4 i)
    or (4 iii) holds, as in the above claim. If (4 iii) holds, then the calculation
    is again similar to the above. Suppose that (4 i) holds. Then \(u \in F^*\). By
    Claim 1, \(O^x \le_h x\) and thus \(O^{O^x} \le_T O^x = (G(x))_1\). Now the index
    \(i\) prescribed in (4) may be found uniformly via a \(\Pi_1^1(O^x)\) procedure.
    Hence \(O^{O^x}\) computes \((G(x))_{e+2}(n)\) uniformly.


    It follows from the last two claims that \(G\) is degree invariant. Moreover,
    \(G\) preserves \(\le_T\) by Claim 1.


    To show that \(G\) is uniformly order preserving, let \(h\) be a recursive function
    such that \((\forall x, y, e)(x = \Phi_e^y \Rightarrow O^x = \Phi_{h(e)}^{O^y})\).
    In addition, let \(s\) be another recursive function'
