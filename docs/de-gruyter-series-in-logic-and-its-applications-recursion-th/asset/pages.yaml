    # Theorem 3.7.11 (Sierpinski [135]). Every \(\Sigma^1_2\)-set of reals is a union
    of \(\omega_1\)-many Borel sets.


    Proof. Suppose that \(A \subseteq 2^\omega\) is \(\Sigma^1_2\). Then there is
    a \(\Pi^1_1\)-set \(B \subseteq \omega^\omega\) such that \(x \in A\) if and only
    if \((\exists f \in \omega^\omega) B(f, x)\). By (i) of Lemma 3.7.9, there is
    an \(\omega_1\)-sequence of Borel sets \(\{B_\alpha\}_{\alpha<\omega_1}\) such
    that \(\bigcup_{\alpha<\omega_1} B_\alpha = B\). Then \(C_\alpha = \{x \mid (\exists
    f \in \omega^\omega) B_\alpha(f, x)\}\) is \(\Sigma^1_1\) for each \(\alpha <
    \omega_1\). Clearly \(A = \bigcup_{\alpha<\omega_1} C_\alpha\). By relativizing
    (ii) of Lemma 3.7.9, each \(C_\alpha\) is a union of \(\omega_1\)-many Borel sets.
    Thus \(A\) is a union of \(\omega_1\)-many Borel sets.


    # Corollary 3.7.12. Every \(\Sigma^1_2\)-set of reals of cardinality greater than
    \(\aleph_1\) has a perfect subset.


    Proof. By Theorem 3.7.11, every \(\Sigma^1_2\)-set \(A\) of reals is the union
    of \(\aleph_1\)-many Borel sets. If \(A\) has cardinality greater than \(\aleph_1\),
    then one of these Borel sets is uncountable and so has a perfect subset.


