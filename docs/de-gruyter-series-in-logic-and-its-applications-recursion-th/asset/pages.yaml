    set of reals whose degrees belong to $\mathscr{A}$. Is it true that if every set
    of Turing degrees is measurable, then $\omega_1$ is inaccessible in L?


    # A.3 Higher randomness theory


    **Question A.3.1.** Is every $\Pi^1_1$-random real strongly $\Pi^1_1$-ML random?


    By Corollary 14.34, Question A.3.1 can be reduced to the question of the existence
    of a strongly $\Pi^1_1$-ML random $x \ge_h 0$.


    It is not known if there is a nonhyperarithmetic real which is not $\Pi^1_1$-random
    cuppable, though we know that lowness for $\Pi^1_1$-randomness coincides with
    hyperarithmeticity.


    In Chapter 14, the study of algorithmic randomness was generalized to the $\Pi^1_1$-level.
    It was also shown that one would not obtain a satisfactory theory by generalizing
    notions of randomness to the $\Sigma^1_2$-level under the assumption $V = L$.
    Indeed under this assumption, any generalization of randomness notions to the
    analytical hierarchy beyond $\Pi^1_1$ would result in a theory that is essentially
    trivial. The key reason is the existence of a $A_3$ well-ordering of $2^\omega$
    within $L$. Hence one requires the other set-theoretic axioms for a viable theory
    of algorithmic randomness at higher levels of the analytical hierarchy. There
    is a “regularity” phenomenon in descriptive set theory where all $\Pi^1_{2n+1}$
    and $\Sigma^1_{2n}$ sets are considered analogs of r.e. sets under PD. We are
    interested in seeing whether this applies to the theory of higher randomness.


    **Question A.3.2.** Can one extend higher randomness theory to the entire analytical
    hierarchy under certain large cardinal assumptions?


    Kehris, Martin and Solovay [65] extended higher arithmethetic theory to Q-theory
    under PD. One may then introduce the theory of higher randomness in Q-theory.
    However, the modern development of descriptive set theory has embarked on a route
    somewhat different from that taken previously. Before the 1980s, most descriptive
    set-theoretic results were obtained using ingenious constructions, such as those
    associated with games and AD. Today, large cardinals and inner model theory feature
    prominently in the investigation of descriptive set theory. Even results that
    may appear to be “straightforward generalizations” of their low level counterparts
    were established this way. As recursion theory is grounded on the premise of effective
    computability, one is interested in having a “nice L-like model” to perform recursion-theoretic
    constructions as those in L. In such a model, the study of higher randomness can
    be reasonably carried out.'
