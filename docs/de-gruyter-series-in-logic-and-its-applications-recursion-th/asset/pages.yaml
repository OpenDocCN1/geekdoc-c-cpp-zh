  md: '# A Open problems


    # A.1 Hyperarithmetic theory


    We first list a question which has remained open for almost 40 years.


    **Question A.1.1** (Sacks [122]). *Does every countable set of hyperdegrees have
    a minimal upper bound?*


    The next question concerns a version of the Posner–Robinson Theorem in the hyperarithmetic
    setting.


    **Question A.1.2.** Let \( x \notin \text{HYP} \) and let \( A \subseteq 2^\omega
    \) be \( \Sigma^1_1 \) and uncountable. Is there a \( y \in A \) such that \(
    x \oplus y \ge_h \emptyset \)?


    # A.2 Set-theoretic problems in recursion theory


    The most important problem in this area is probably Martin''s Conjecture (6.6.9).
    We also have the following conjecture.


    **Conjecture A.2.1.** Assume ZF + AD + \( V = L(\mathbb{R}) \). Then Martin''s
    Conjecture is true for order-preserving functions.


    **Question A.2.2** (Sacks [117]). Is every locally countable partial ordering
    \( (2^\omega, \le_P) \) embeddable into \( (\mathscr{D}, \le) \)?


    The following is motivated by Theorem 9.3.8.


    **Question A.2.3.** Is it true, under ZF + DC, that the existence of a cofinal
    maximal chain of Turing degrees of order type \( \omega_1 \) implies the existence
    of a well-ordering of the reals?


    More mysterious is perhaps the structure of antichains of Turing degrees.


    **Question A.2.4.** Is there a \( \Sigma^1_1 \)-maximal antichain of Turing degrees?


    While a number of examples in recursion theory independent of ZF were presented
    in Chapter 9, it is not known if there is a "natural" first order sentence \(
    \varphi \) in the language of partial ordering such that "\( (\mathscr{D}, \le)
    \vDash \varphi \)" is independent of ZF.


    **Question A.2.5.** Is there a natural first order sentence \( \varphi \) in the
    language of partial ordering such that "\( (\mathscr{D}, \le) \vDash \varphi \)"
    is independent of ZF?


    In [128], it is proved that if every set of reals is measurable, then \( \omega_1
    \) is inaccessible in \( L \).'
