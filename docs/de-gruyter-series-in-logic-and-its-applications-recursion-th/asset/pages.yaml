  md: '# Proposition 4.4.4. $\delta = \delta^1_2$.


    Proof. If $\alpha < \delta$, then there is a $\Pi^1_1$-singleton $x \in L_\delta
    \setminus L_\alpha$. Since $x \in L_{\omega_1^x}$ and $\omega_1^x$ is a $\Pi^1_1(x)$
    well-ordering, $\alpha < \omega_1^x < \delta^1_2$. Hence $\delta \le \delta^1_2$.


    If $\alpha < \delta^1_2$, then there is a $\Delta^1_2$ well-ordering relation
    $R \subseteq \omega \times \omega$ of order type $\alpha$. Then there exist arithmetical
    relations $S, T \subseteq (\omega^\omega)^2 \times \omega^2$ such that


    $R(n, m) \Leftrightarrow (\exists f)(\forall g)S(f, g, n, m)$, and

    \(\neg R(n, m) \Leftrightarrow (\exists f)(\forall g)T(f, g, n, m)\).


    Define $\Pi^1_1$-sets


    $R_0 = \{\langle h, (n, m) \rangle \mid h(0) = 0 \land (\exists f)(\forall g)(S(f,
    g, n, m) \land (\forall n)(f(n) = h(n+1)))\}$.


    and


    $R_1 = \{\langle h, (n, m) \rangle \mid h(0) = 1 \land (\exists f)(\forall g)(T(f,
    g, n, m) \land (\forall n)(f(n) = h(n+1)))\}$.


    By the $\Pi^1_1$-Uniformization Theorem (4.2.1), the two relations may be unified
    by partial $\Pi^1_1$-functions $p_{R_0}$ and $p_{R_1} : \omega \to \omega^\omega$.
    Let $p = p_{R_0} \cup p_{R_1}$. Then $p$ is a total $\Pi^1_1$-function and may
    be viewed as a $\Pi^1_1$-singleton. Then $R$ is arithmetical in $p$ and hence
    $\alpha < \omega_1^p < \delta$. Thus $\delta^1_2 = \delta$.


    This gives a finer version of the Spector–Gandy Theorem for $\Sigma^1_2$-sets:


    # Proposition 4.4.5. A real $x$ is $\Sigma^1_2$ if and only if $x$ is $\Sigma_1$-definable
    over $\langle L_{\delta^1_2}, \in \rangle$.


    Proof. Suppose that $x$ is $\Sigma^1_2$. Then there is a $\Sigma_0$-formula $\varphi(n,
    y)$ such that

    \(n \in x \Leftrightarrow (\exists y)(\langle L_{\delta^1_2}[y], \in \rangle \vDash
    \exists \varphi(n, s, y))\).

    By Corollary 4.2.9 and Proposition 4.4.4, we have

    \(n \in x \Leftrightarrow \langle L_{\delta^1_2}, \in \rangle \vDash (\exists
    s)(\exists y)[s \in L_{\omega_1^y}[y] \land \varphi(n, s, y)]\).

    Assume $\langle L_{\delta^1_2}, \in \rangle \vDash (\exists s)(\exists y)[s \in
    L_{\omega_1^y}[y] \land \varphi(n, s, y)]$ and fix such a real $y$. Then $\langle
    L_{\omega_1^y}[y], \in \rangle \vDash (\exists s)\varphi(n, s, y)$. Hence $n \in
    x$. Thus $x$ is $\Sigma_1$-definable over $\langle L_{\delta^1_2}, \in \rangle$.

    Conversely, suppose that $x$ is $\Sigma_1$-definable over $\langle L_{\delta^1_2},
    \in \rangle$ via the formula $\varphi(n)$. By Proposition 4.4.4, we have $n \in
    x$ if and only if there exists a $z \in L_{\omega_1^x}$ such that $\langle L_{\omega_1^x},
    \in \rangle \vDash \varphi(n)$. Thus $x$ is $\Sigma^1_2$.


    It is possible to relativize "$\Delta^1_2$-ness" in the obvious way and define
    the relation "$x$ is $\Delta^1_2$" in $y^x$ and thereby introduce the notion of
    a $\Delta^1_2$-degree. Let $\delta^{1,x}_2$ be the supremum of all well-orderings
    of $\omega$ that are $\Delta^1_2$ in $x$. The following result says in a strong
    way that Post''s problem has a negative solution for the $\Delta^1_2$-degrees.


    # Proposition 4.4.6.


    +   (i) If $x$ is constructible and not $\Delta^1_1$, then $\delta^{1,x}_2 > \delta^1_2$.

    +   (ii) Assume $V = L$. Then $\le_{\Delta^1_2}$ is a well-ordering of the $\Delta^1_2$-degrees
    and its order type is $\omega_1$. Moreover, if $x <_{\Delta^1_2} y$, then $\delta^{1,x}_2
    < \delta^{1,y}_2$.'
