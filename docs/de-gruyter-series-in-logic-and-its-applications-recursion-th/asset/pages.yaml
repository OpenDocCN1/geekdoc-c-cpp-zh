    # 13.1.3 A measure-theoretic basis theorem


    In measure theory, every measurable set of reals is approximated by closed sets.
    There is an effective version of this in hyperarithmetic theory.


    +   Lemma 13.1.10. There is a \(\Pi^1_1\)-function \(f : \omega \times \omega
    \to \omega\) such that for any Gödel number \(n\) of a ranked formula,

    +   (i) \(f(n, m)\) is the Gödel number of a ranked formula whose only free variable
    is \(x\);

