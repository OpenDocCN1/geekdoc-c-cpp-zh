  md: 'Thus \(O_1^s \subseteq O\) is a \(\Pi_1^1\)-path through \(O\), yielding the
    following theorem.


    # **THEOREM 2.6.4** (Feferman and Spector [26]). There is a \(\Pi_1^1\)-set \(O_1
    \subseteq O\) such that \(<_O\) restricted to \(O_1\) is a well-ordering of order
    type \(\omega_1^{CK}\).


    The proof of Theorem 2.6.4 is essentially model-theoretic. A purely recursion-theoretic
    proof can be found in Sacks [123]. The results in this section may also be uniformly
    relativized. Namely, there is a \(\Sigma_1^1\)-set \(\{ (x, O^{x+*}) \mid x \in
    2^\omega \}\) such that for each x, \(O^{x+*}\) is a proper end extension of \(O^x\)
    (a nonstandard \(O^x\)).


    # ## 2.6.3 A regular path through O


    Despite the apparent complexity of the partial ordering on O, there is a \(\Pi_1^1\)-path
    through it in which every proper initial segment is recursive. This indicates
    that there exists certain regularity hidden within \(<_O\).


    # **THEOREM 2.6.5** (Jockusch [56]). There is set \(O \subseteq O\) such that


    +   - \(<_O\) (Definition 1.2.1) is a well-ordering of order type \(\omega_1^{CK}\)
    on O;

    +   - O is \(<_O\)-downward closed, and

    +   - for any \(n \in O\), \(\{ m \mid m <_O n \}\) is recursive.


    Proof. First, observe that by the Padding Lemma in classical recursion theory,
    we may assume that


    ```

    \((\forall m \in O)(\forall n \in O)(n +_O m > \max\{m, n\}).\)

    ```


    By the s-m-n Theorem, there is a recursive function \(g_0\) such that for every
    m,


    ```

    \(\varphi_{g_0(e, m, 0)} = \varphi_e(\varphi_m(0)) \land (\forall n)(\varphi_{g_0(e,
    m)(n+1)} = \varphi_{g_0(e, m)}(n) +_O \varphi_e(\varphi_m(n+1)).\)

    ```


    Define a recursive function \(h_0\) as follows:


    ```

    \(\varphi_{h_0(e)}(n) = \left\{ \begin{array}{ll} 1 & n = 1, \\ 2^{\varphi_e(k)}
    & n = 2^k, \\ 3 \cdot 5^{\varphi_e(k)} & n = 3 \cdot 5^k, \\ \uparrow & \text{Otherwise.}
    \end{array} \right.\)

    ```


    By the Recursion Theorem, there is a constant c such that \(\varphi_{h_0(c)} =
    \varphi_c\). Then \(\varphi_c\) is total on O. Note that \(\varphi_c(1) = 1\),
    \(\varphi_c(2^n) = 2^{\varphi_c(n)}\), and if \(n = 3 \cdot 5^k\), then \(\varphi_c(n)
    = 3 \cdot 5^w\) where \(\varphi_w(n) = \varphi_c(\varphi_c(n))\) and \(\varphi_w(j+1)
    = \varphi_w(j) +_O \varphi_c(\varphi_c(j+1))\). \(\varphi_c\) follows the format
    set in (i)-(iv) of § 1.2.1 with the additional property that for \(n = 3 \cdot
    5^k\), \(\varphi_c(n)\) gives an index w of a recursive function that is recursively
    defined from \(\varphi_c\). Thus intuitively one may view this as a version of
    O on the range of \(\varphi_c\). Let \(i \in O^* \setminus O\). We claim that
    the set


    ```

    \(O = \{ m \mid (\exists n \in O)(m <_O \cdot \varphi_c(n) \land n <_{O^*} i)
    \}\)

    ```


    is as required. We first leave it as an exercise to verify that'
