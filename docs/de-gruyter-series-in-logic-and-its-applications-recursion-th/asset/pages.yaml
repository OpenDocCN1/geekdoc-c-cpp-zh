  md: 'It can be proved that every measurable cardinal is inaccessible (see [53]).
    Existence of a measurable cardinal is a very strong large cardinal assumption.
    Although it is a major notion in set theory, none of the results proved in this
    book requires this assumption.


    # 6.4.3 0#


    Compared to a measurable cardinal, 0# is a relatively small large cardinal. Nevertheless,
    it plays a significant role in the study of definability. According to Slaman
    (Gödel Lecture, 2001), “0# is the recursion theorist’s passport to set theory”.
    In a rather striking way, the definition of 0# is more involved than those of
    the large cardinals considered thus far.


    Definition 6.4.6. Assume that


    +   (i) for any pair of uncountable cardinals \(\eta < \kappa\), \((L_\eta, \in)
    \prec (L_\kappa, \in)\);


    +   (ii) there is a unique closed and unbounded class \(I\) of ordinals containing
    all uncountable cardinals such that for any cardinal \(\kappa > \omega\),


    +   (a) \(|I \cap \kappa| = \kappa\);


    +   (b) for any \(\psi(v_0, \dots, v_k)\), any two increasing sequences \(\gamma_0^0
    < \dots < \gamma_k^0\) and \(\gamma_1^1 < \dots < \gamma_k^1\) in \(I \cap \kappa\),
    we have \((L_\kappa, \in) \vDash \psi(\gamma_0^0, \dots, \gamma_k^0) \Leftrightarrow
    (L_\kappa, \in) \vDash \psi(\gamma_1^1, \dots, \gamma_k^1)\);


    +   (c) every element \(a \in L_\kappa\) is definable in \((L_\kappa, \in)\) with
    parameters in \(I \cap \kappa\).


    Then \(n \in 0^\#\) if and only if \(n\) is the Gödel number of a formula \(\varphi\)
    such that \((L_{\aleph_\omega}, \in) \vDash \varphi(\aleph_1, \dots, \aleph_{m+1})\).


    The term \(0^\#\) was introduced by Solovay. Gaifman [32] proved that the existence
    of \(0^\#\) follows from the existence of a measurable cardinal. Silver [137]
    derived the same conclusion assuming the existence of a Ramsey cardinal, known
    to be weaker than that of a measurable cardinal. Solovay [148] proved that \(0^\#\)
    is a nonconstructible \(\Delta_2^1\)-set of integers. Since every \(\Delta_2^1\)-real
    belongs to \(L\) (Corollary 4.2.9 (iii)), this gives \(\Delta_2^1\) as the optimal
    bound for constructibility of reals under a large cardinal assumption.


    Though the definition of \(0^\#\) appears to be undefinable in the language of
    set theory, it can be reformulated model-theoretically. This enabled Silver to
    prove that \(0^\#\) is a \(\Pi_2^1\)-singleton and hence \(\Delta_2^1\), \(0^\#\)
    may well be the weakest large cardinal axiom that is incompatible with \(V = L\).


    Proposition 6.4.7. If \(0^\#\) exists, then every constructible real is recursive
    in \(0^\#\). Hence there are only countably many constructible reals.


    Proof. Suppose that \(0^\#\) exists and \(x\) is constructible. Since \(x \in
    L_{\omega_1}\), by Definition 6.4.6 (ii) there is a formula \(\varphi_v(v, u_1,
    \dots, u_m)\) and an increasing sequence \(i_1, \dots, i_m\) in \(I \cap L_{\omega_1}\)
    such that for any \(n < \omega\), \(n \in x\) if and only if \((L_{\omega_1},
    \in) \vDash \varphi_x(n, i_1, \dots, i_m)\).'
