    is a $\Delta^1_1$-function $f : \omega \to \Sigma_1 \cap \text{HYP}$ such that
    for every $n < \omega$,


    +   - $\mu(A(f(n)) < 2^{-n}$, and

    +   - $A \subseteq A_{f(n)}$


    Then $A_{f(n)} = [U_n]$ for some $\Delta^1_1$-set $U_n \subseteq 2^{<\omega}$.
    It now suffices to show that $\{U_n\}_{n<\omega}$ may be expanded to a $\Delta^1_1$-collection
    $\{V_n\}_{n<\omega}$ such that $U_n \subseteq V_n$ and $\mu(V_n) = 2^{-n}$. Since
    the set $U = \{(n, \sigma) \mid \sigma \in U_n\}$ is $\Delta^1_1$, there is an
    $m \in \Theta$ such that $U \le_T H_m$. Note that the set $\{(x, e, p) \in 2^\omega
    \times \omega \times \mathbf{Q} \mid \mu(\{o\} \mid (\exists i)(\Phi_e^i(i) =
    o\})) > p\}$ is r.e. Then by a standard technique in classical randomness theory
    relativized to $H_{2^m}$, there is a $V \subseteq \omega \times 2^{<\omega}$ recursive
    in $H_{2^m}$ such that for every $n$, $\mu(V_n) = 2^{-n}$ and $U_n \subseteq V_n$.
    Then $A \subseteq \bigcap_{n<\omega} V_n$.


    By Proposition 14.2.2, $\Delta^1_1$-randomness may be viewed as a higher analog
    of Schnorr randomness.


    Proposition 14.2.3 (Martin-Löf [97]). The set of $\Delta^1_1$-random reals is
    $\Sigma^1_1$ but not $\Delta^1_1$.


