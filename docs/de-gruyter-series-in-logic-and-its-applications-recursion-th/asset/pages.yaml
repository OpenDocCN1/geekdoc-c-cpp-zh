- pgno: 15
  md: 'There is an obvious generalization of the above to allow parameters in \(\omega^\omega\),
    yielding the class of \(\Sigma^0_n\)-predicates relative to a real or a finite
    set of reals.


    # Definition 1.1.4.


    +   (i) A predicate \(P^0(y, m)\) is \(\Sigma^1_1(\alpha)\) if there is a partial
    recursive predicate \(R(A, y, m)\) such that for all \(y\) and \(m\), \(P^0(y,
    m) \leftrightarrow R(\alpha, y, m)\).

    +   (ii) \(P^0(y, m)\) is \(\Pi^0_n(\alpha)\) if \(\neg P^0(y, m)\) is \(\Sigma^0_n(\alpha)\).

    +   (iii) \(P^0(y, m)\) is \(\Sigma^0_n(\alpha)\) if there is a \(\Pi^0_n(\alpha)\)-predicate
    \(R^0(y, m, k)\) such that \(P^0(y, m)\) if \((\exists k)R^0(y, m, k)\).

    +   (iv) \(P^0(y, m)\) is \(\Delta^0_n(\alpha)\) if it is \(\Sigma^0_{n+1}(\alpha)\)
    and \(\Pi^0_{n+1}(\alpha)\).


    Given a collection of predicates \(\Gamma\), we say that a set \(a \subseteq \omega\)
    (resp. \(P^* \subseteq \omega^\omega\)) is a \(\Gamma\)-set, or a member of \(\Gamma\),
    if \(m \in a \leftrightarrow P(0, m)\) (resp. \(x \in P^* \leftrightarrow P(x,
    0)\)) for some predicate \(P(x, m) \in \Gamma\). For each \(n < \omega\), let
    \(\Sigma^0_n\), \(\Pi^0_n\) and \(\Delta^0_n\) denote respectively the class of
    \(\Sigma^0_n\), \(\Pi^0_n\) and \(\Delta^0_n\)-predicates. The following lemma
    is well known. A proof may be found in [53].


    # Lemma 1.1.5.


    +   (i) Let \(n < \omega\). There is a \(\Sigma^0_n\)-set \(U \subseteq \omega^\omega
    \times \omega^\omega\) such that for each \(P \in \Sigma^0_n\), \(P = \{x \mid
    (x, y) \in U\}\) for some \(y\).

    +   (ii) For each \(n\), \(\Sigma^0_n \subset \Delta^0_{n+1} \subset \Sigma^0_{n+1}\)
    and \(\Pi^0_n \subset \Delta^0_{n+1} \subset \Pi^0_{n+1}\).


    In classical recursion theory, a set \(a \subseteq \omega\) is \(\Sigma^0_1\),
    if and only if \(a\) is \(\Sigma^0_1(\emptyset'')\). However, it is not generally
    true for sets of reals. For example, the set \(\{\emptyset^{(\omega)}\}\) is \(\Sigma^0_3\)
    but is not \(\Sigma^0_1(x)\) (as a singleton) for any \(x \in \omega^\omega\)
    (see Exercise 1.1.5).


    # 1.1.2 Analytical predicates


    # Definition 1.1.6.


    +   (i) A predicate \(P(x, m)\) is \(\Sigma^1_1\) if it is \(\Sigma^1_1\);

    +   (ii) A predicate \(P(x, m)\) is \(\Pi^0_n\) if \(\neg P(x, m)\) is \(\Sigma^0_n\);

    +   (iii) A predicate \(P(x, m)\) is \(\Sigma^0_{n+1}\) if there is a \(\Pi^0_n\)-predicate
    \(R(x, y, m) \in \omega^\omega \times \omega^\omega \times \omega\) such that
    \(P(x, m)\) if and only if \((\exists y)R(x, y, m)\).

    +   (iv) A predicate \(P(x, m)\) is \(\Delta^0_1\) if it is both \(\Pi^0_1\) and
    \(\Sigma^0_1\).

    +   (v) A predicate \(P\) is *analytical* if \(P \in \Sigma^1_n\) for some \(n\).


    As in Lemma 1.1.5, we have the following facts which are straightforward to verify.


    # Lemma 1.1.7.


    +   (i) Let \(n < \omega\). There is a \(\Sigma^1_n\)-set \(U \subseteq \omega^\omega
    \times \omega^\omega\) such that for each \(P \in \Sigma^1_n\), \(P = \{x \mid
    (x, y) \in U\}\) for some \(y\).

    +   (ii) For each \(n\), \(\Sigma^1_n \subset \Delta^1_{n+1} \subset \Sigma^1_{n+1}\)
    and \(\Pi^1_n \subset \Delta^1_{n+1} \subset \Pi^1_{n+1}\).

    +   (iii) Every arithmetical set is \(\Delta^1_1\).'
