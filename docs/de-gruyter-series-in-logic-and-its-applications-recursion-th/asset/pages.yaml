  md: 'or zeal as it deserves. We view this as rather unfortunate since in it one
    sees a beautiful illustration of the unity of mathematical logic, where ideas
    and tools from set theory and model theory are fruitfully applied to study problems
    about computability. It was a tempting proposition to write another book (following
    Sack''s *Higher Recursion Theory* [123]) to exhibit this interplay. Recent advances
    in the study of the global theory of Turing and hyperdegrees, and the emergence
    of higher randomness as a subject of investigation, provided the impetus for us
    to turn the idea into reality. It is hoped that the reader would agree, at the
    end of it, that the enterprise of generalizing recursion theory that began more
    than half a century ago has been mathematically rewarding, and that the subject
    is both attractive and highly challenging, with many deep and elegant theorems.


    This book consists of four main parts. The first six chapters constitute Part
    I and develop the fundamental theory of $\Pi^1_1$-sets and fine structure theory
    of the constructible universe, the ramified analytical hierarchy, and set theory.
    They lay the groundwork for the rest of the book. Part II focuses on the structure
    of Turing degrees. Here we discuss classification of the jump operator in relation
    to Martin''s conjecture and the construction of $\Pi^1_1$-sets, as well as degree-theoretic
    independence results. We turn our attention to hyperdegrees in Part III. In particular,
    we prove the rigidity of the structure of the hyperdegrees and its biinterpretability
    with second order arithmetic. We also include a chapter on basis/antibasis theorems
    as well as perfect subsets in $L$. Part IV is devoted to the study of higher randomness,
    a subject which is naturally linked to the topics covered in the first three parts.
    Exercises are sprinkled throughout the chapters. Many of them are intended to
    supplement the topics covered. The most challenging ones are labelled with a *.


    The book ends with an interview with Gerald Sacks (in Appendix B) conducted in
    2009. We think that it is fitting to conclude the book with a tribute to one whose
    work has arguably substantially shaped the development of recursion theory, both
    classical and higher, in the last century.


    A word about prerequisites: While this book attempts to cover as much background
    material as possible, it is not intended to be encyclopedic. The reader is assumed
    to be familiar with basic logic and set theory, including classical recursion
    theory, basic set theory (including forcing) and algorithmic randomness. A number
    of the results are used in proofs, sometimes without explicit mention. In line
    with our preference and taste, some of the proofs of theorems in set theory presented
    are discernibly recursion-theoretic in flavor. These proofs are not necessarily
    the simplest. Our aim is to offer the reader a different perspective to these
    theorems by highlighting the effective content that is not immediately apparent.
    Hopefully these provide additional insights to the ideas that went behind the
    proofs.


    The materials in the first two chapters closely follow Sack''s *Higher Recursion
    Theory* [123]. Mansfield and Weitkamp''s monograph *Recursive Aspects of Descriptive
    Set Theory* [88] was also one of our key references. Of course one should not
    fail to mention Hartley Rogers''s classic *Theory of Recursive Functions and Effective
    Computabil-*'
