  md: 'Recall that \( P \subseteq \omega^\omega \) is perfect if it is a closed set
    with no isolated point. The next theorem shows that every uncountable \( \Sigma^1_1
    \)-set of reals has what may be described as the perfect set property.


    # Theorem 11.10 (Suslin [162]). If \( P \) is \( \Sigma^1_1 \) and uncountable,
    then it contains a perfect subset.


    Proof. Suppose \( P(x) \) is \( \Sigma^1_1 \) (for simplicity assume that there
    is no number variable defining \( P \)). We give two proofs of Theorem 1.11.0.
    One is set-theoretic while the other is recursion-theoretic.


    Set-theoretic proof. By Proposition 11.9, there is a recursive tree \( T \subseteq
    \omega^{<\omega} \times \omega^{<\omega} \) such that \( x \in P \) if and only
    if \( (\exists y)(\forall n)[x \mid y, n) \in T \). Let \( T'' \) be a subtree
    of \( T \) such that


    \( (\sigma, \tau) \in T'' \iff \{x > \sigma \mid (\exists y > \tau)(\forall n)(\langle
    x \mid y, n \rangle \in T)\} > \aleph_0 \).


    Define


    \( Q = \{x \mid (\exists y)(\forall n)(\langle x \mid y, n \rangle \in T''\} \).


    Since \( P \) is uncountable, \( Q \) is not empty. Obviously \( Q \subseteq P
    \). Note that if \( (\sigma, \tau) \in T'' \) then there exist \( k \) and \(
    k'' \) such that \( (\sigma \mid k, \tau \mid k'') \in T'' \). We show that \(
    Q \) contains a perfect set. By induction on \( n \), build a perfect tree \(
    S_0 \) and a tree \( S_1 \) with the following properties:


    +   (i) \( S_1 \subseteq T'' \);

    +   (ii) let \( [S_0] \) denote the set of infinite paths in \( S_0 \). Then \(
    [S_0] \) is contained in \( \{x \mid (\exists y)(\forall n)(\langle x \mid y,
    n \rangle \in S_1\}\);

    +   (iii) \( (\forall(\sigma, \tau) \in S_1)(\{x > \sigma \mid (\exists y > \tau)(\forall
    n)(\langle x \mid y, n \rangle \in T)\} > \aleph_0) \).


    We begin with setting \( S_0 \) and \( S_1 \) to be empty at level 0. Suppose
    we are at level \( n+1 \). Let \( \sigma \in S_0 \) be defined at level \( n \)
    with \( |\sigma| = n \). By induction, there is a \( \tau \) such that \( (\sigma,
    \tau) \in S_1 \) was defined at level \( n \) and \( Q_{\sigma, \tau} = \{x >
    \sigma \mid (\exists y > \tau)(\forall n)(\langle x \mid y, n \rangle \in T)\}
    \) is uncountable.


    # Claim. There exist incompatible extensions \( \sigma_0, \sigma_1 \) of \( \sigma
    \) such that \( Q_{\sigma_0, \tau} \) and \( Q_{\sigma_1, \tau} \) are both uncountable.


    If the Claim is false, then there is a unique \( x > \sigma \) such that if \(
    \sigma'' > \sigma \) is incompatible with \( x \), then \( Q_{\sigma'', \tau}
    \) is countable. But this would imply that \( Q_{\sigma, \tau} = \{x\} \cup \bigcup_{\sigma''
    > \sigma, \sigma'' \neq x} Q_{\sigma'', \tau} \) is countable, which is a contradiction.


    Fix \( (\sigma_0, \sigma_1) \) as in the Claim. Then there exist \( \tau_0, \tau_1
    > \tau \) such that \( |\{x > \sigma_i \mid (\exists y > \tau_i)(\forall n)(\langle
    x \mid y, n \rangle \in T)\}| > \aleph_0 \) for \( i = 0, 1 \). Put \( \sigma_0
    \) and \( \sigma_1 \) into \( S_0 \) and \( (\sigma_i, \tau_i) \), for \( i =
    0, 1 \), into \( S_1 \). This procedure is carried out for every \( \sigma \in
    S_0 \). Clearly \( S_0 \) is a perfect tree and for each \( x \) there is a \(
    y \) such that \( (\forall n)(\langle x \mid y, n \rangle \in S_1 \). Since \(
    S_1 \subseteq T'' \subseteq T \), \( [S_0] \subseteq Q \subseteq P \).'
