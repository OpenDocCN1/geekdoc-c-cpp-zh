    **Theorem 6.6.1** (Blass [7]). Suppose that \( A \) is \( \Pi^1_1 \). If I has
    a winning strategy for \( G_A \), then I has a winning strategy recursive in \(
    O \); if \( \Pi^1_1 \) II has a winning strategy for \( G_A \), the II has a hyperarithmetic
    winning strategy.


    **Proof.** Since \( A \) is \( \Pi^1_1 \), there is a recursive tree \( T \subseteq
    \omega^{<\omega} \) such that \( A = [T] \). Suppose that I has a winning strategy.
    Then the set


    \( B = \{\hat{\sigma} \mid (\forall i)(\forall \sigma \in \omega^i)((\hat{\sigma}
    \text{ is a play at step } i \text{ by I following } \hat{\sigma}) \to (\exists
    x)(\sigma > \wedge x \in A))\} \)


    is a nonempty \( \Sigma^1_1 \)-set. By Gandy''s Basis Theorem (2.5.3), there is
    a \( \hat{\sigma}_0 \le_T O \) in B. Obviously \( \hat{\sigma}_0 \) is a winning
    strategy for player I.


    Now suppose that I has no winning strategy. Let \( n \in \omega^* \setminus 0
    \). Then \( \Omega^1_n = \{m \mid m \le_{\sigma^*} n\} \) is an r.e. set with
    an initial segment of order type \( \sigma^1_{CK} \) under the r.e. linear ordering
    relation \( <_{\sigma^*} \). Define an arithmetical set C of functions from \(
    \omega^{<\omega} \) into \( \Omega^1_n \) as follows: \( f \in C \) if and only
    if for any \( \sigma \),

    (i) If \( |\sigma| \le |T| \), then \( f(\sigma) \) is undefined;

    (ii) if \( |\sigma| \cap |T| = \emptyset \), then \( f(\sigma) = 1 \);

    (iii) suppose that \( \sigma \) satisfies neither (i) nor (ii). (a) If \( |\sigma|
    \) is even, then \( f(\sigma) = 2^i \) if \( i = \sup\{k \mid k = f(\sigma^i)\}
    \) exists where sup is in the sense of \( <_{\sigma^*} \); otherwise, \( f(\sigma)
    \) is undefined. (b) If \( |\sigma| \) is odd, then \( f(\sigma) = 2^i \) if \(
    i = \inf\{k \mid k = f(\sigma^m)\} \) exists where inf is in the sense of \( <_{\sigma^*}
    \); otherwise, \( f(\sigma) \) is undefined.


    Since \( \Omega \cap O^1_\alpha \) is the largest well-ordered segment of \( \Omega^1_n
    \), for any \( f \in C \) and \( \sigma \), if \( f(\sigma) \) is defined then
