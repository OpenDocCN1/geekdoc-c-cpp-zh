  md: 'If \(\pi\) is a permutation of \(\omega_1\), let \(\text{spt}(\pi) = \{ \alpha
    < \omega_1 \mid \pi(\alpha) \neq \alpha \}\). Let \(H_0\) be the set of all permutations
    \(\pi\) of \(\omega_1\) with \(|\text{spt}(\pi)| < \omega\), and set


    \(H = \{ \pi \in H_0 \mid (\forall \alpha < \omega_1)(\pi(\alpha) < \alpha + \omega)
    \}.\)


    For each \(\pi \in H\), let \(\hat{\pi}\) be the permutation of \(L^{\aleph_1}\)
    induced by \(\pi\). Let \(B\) be the set of \(\mathbf{P}_{\aleph_1}\)-names of
    reals, and define


    \(\hat{A} = \{ (\tau, p) \in B \times \mathbf{P}_{\aleph_1} \mid (\exists \alpha
    \in E_1)(p \Vdash (\tau =_\mathbb{T} \tau_\alpha)) \}.\)


    **Lemma 9.3.14.** If \(\pi \in H\) and \(y \in E_1\) then \(\vdash_\mathbb{T}
    \tau_y = \hat{\pi}(\tau_y)\).


    **Proof.** Note that the canonical name \(\dot{y}\) of \(y\) is invariant under
    \(\pi\), and \(R_\gamma\) is definable in \(y\) as \(L\) is the minimal inner
    model. Then for any \(\mathbf{P}_{\aleph_1}\)-generic \(G\), \(\tau_y^G\) and
    \(\hat{\pi}(\tau_y)^G\) differ at most finitely many columns. The lemma follows
    immediately.


    **Corollary 9.3.15.** If \(\pi \in H\), then \(\emptyset \Vdash \hat{A} = \hat{\pi}(\hat{A})\).


    Hence the permutations in \(H\) are sufficient to show


    \(N \Vdash \text{``There is no well-ordering of } 2^\omega\text{''''}.\)


    By Proposition 9.3.7, \(N \Vdash \neg \text{CH}\) and this completes the proof
    of Theorem 9.3.8.


    # 9.3.4 Exercises


    +   **Exercise 9.3.1.** Prove Lemma 9.3.2.


    +   **Exercise 9.3.2** (Kunen). Prove that if there is a well-ordering of the
    Turing degrees, then there is a well-ordering of \(2^\omega\).


    +   **Exercise 9.3.3** (Wang, Wu and Yu [168]). Prove that in the proof of Theorem
    9.3.8, we may assume \(\mathbb{M} \Vdash \text{ZFC} + \text{CH} + \omega_1 = (\omega_1)^L\).


    +   **Exercise 9.3.4.** Prove that there is a model \(\mathbb{M}\) of ZF in which
    no set of reals has exactly one representative from each Turing degree, and in
    which there is a thin set \(A\) where \(2^\omega \setminus A\) is also thin.


    # 9.4 \(\omega\)-homogeneity of the Turing degrees


    **Definition 9.4.1.** \(\langle \mathscr{D}, \le \rangle\) is \(\omega\)-homogeneous
    if for any two \(n+1\)-tuples \((\mathbf{a}_0, \dots, \mathbf{a}_n)\) and \((\mathbf{b}_0,
    \dots, \mathbf{b}_n)\) in \(\mathscr{D}\), if \(\langle \mathscr{D}, \le, \mathbf{a}_0,
    \dots, \mathbf{a}_n \rangle \equiv \langle \mathscr{D}, \le, \mathbf{b}_0, \dots,
    \mathbf{b}_n \rangle\) then there is an automorphism \(\pi : \mathscr{D} \to \mathscr{D}\)
    such that \(\pi(\mathbf{a}_i) = \pi(\mathbf{b}_i)\) for each \(i \le n\).


    Slaman and Woodin [144] showed:


    **Theorem 9.4.2.** The \(\omega\)-homogeneity of \(\langle \mathscr{D}, \le \rangle\)
    is independent of ZFC.'
