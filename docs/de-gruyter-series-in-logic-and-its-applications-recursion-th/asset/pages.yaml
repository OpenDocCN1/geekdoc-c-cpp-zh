  md: '# 1.2.3 Exercise


    Exercise 1.2.1. Complete the proof of Proposition 1.2.5.


    # 1.3 Effective transfinite induction


    # 1.3.1 Recursion theorem


    The motivation for introducing recursive ordinals is to perform effective transfinite
    induction. We make it precise in this section, by first recalling the following
    theorem famously known as the Recursion Theorem (also called the Kleene Fixed
    Point Theorem).


    Theorem 1.3.1 (Kleene). Suppose f : ω → ω is recursive. Then Φf(e) = Φe for some
    e.


    Proof. By the s-m-n Theorem, there is a recursive function g such that Φg(e) =
    Φφf(e) for each e. Let i’ be the index of the recursive function f ◦ g. Then Φi(g(i))
    = Φφ(i) = Φg(i).


    The Recursion Theorem is a powerful tool in the study of effective computability
    in classical recursion theory. In higher recursion theory, it is used for effective
    transfinite induction. The following proposition is the first illustration of
    such an application.


    Proposition 1.3.2 (Sacks [123]). Let <_R be an ordering relation on ω with a minimal
    element. Suppose f is a recursive function such that for all e ∈ ω: (i) For each
    n in the field of <_R, Φe(n) is defined whenever Φf(i)(m) is defined for all m
    <_R n; (ii) Φe(e) is defined on every minimal element of <_R. Then there is an
    index i such that Φi = Φf(i) and Φi is defined on every wellfounded initial segment
    of R.


    Proof. By Theorem 1.3.1, there is an i such that Φi = Φf(i). By (i), if n is an
    <_R-minimal element, then Φi(n) is defined. By an easy induction and an application
    of (ii), Φi is defined on every wellfounded initial segment of R.


    In particular, if R is wellfounded then Φi is defined on the field of R. Note
    that no assumption is made on the complexity of R in Proposition 1.3.2. As long
    as the recursive function f exists, we may find such an index i. In general, some
    nice properties concerning R are required to guarantee the existence of f.


    Intuitively, Φe is a “one-step effective induction” operator over Φe. For effective
    transfinite induction, one needs the assumption that Φe itself is produced by
    f through another function Φe′, i.e. Φe = Φf(e′). The Recursion Theorem says that
    this is possible. We shall see many applications of Proposition 1.3.2 to effective
    transfinite'
