    are $\Pi^1_1(y)$ by Lemma 2.2.1.


    Now $x \in \text{HYP}^y \leftrightarrow (\exists n)(\exists e)(n \in O^\vee \land
    x = \Phi^{H^y}_e) \leftrightarrow (\exists n)(\exists e)(\forall m)(\forall z)(n
