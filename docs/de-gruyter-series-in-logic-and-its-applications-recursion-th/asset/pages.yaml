  md: 'Let rk be a function such that


    rk(∅) = 0, and


    rk(x) = sup{rk(y) + 1 | y ∈ x}.


    By Theorem 3.1.8, rk is a Σ-function from sets to ordinals. For any set x, rk(x)
    is called the rank of x. The rank function is a convenient tool to use when performing
    transfinite induction.


    # ## 3.1.3 The collapsing lemma


    A set x is transitive in z if y ⊆ z ⊆ x for all y ∈ x. A set x is transitive if
    z = x, i.e. y ⊆ x for all y ∈ x. Using Theorem 3.1.8, we define a Σ-operation
    C_x(y) as follows:


    C_x(∅) = ∅;


    C_x(a) = (C_x(y) | y ∈ a ∩ x).


    It is easy to verify that C_b(b) is transitive for all b. Moreover if a ⊆ b and
    a is transitive, then C_b(x) = x for all x ∈ a. Define c_b = {(x, C_b(x)) | x
    ∈ b}. One may view c_b as a map from b onto the transitive set C_b(b). In general,
    c_b is not injective.


    A set a is extensional if for all b_1, b_2 ∈ a, (∀x ∈ a)(x ∈ b_1 ↔ x ∈ b_2) →
    b_1 = b_2). In other words, a is extensional if each set in a is determined by
    its membership in a. Obviously any transitive set is extensional. The following
    theorem says that any extensional set is isomorphic to a transitive set.


    # **Theorem 3.1.12 (Mostowski [108]).** If a is extensional then c_a is a bijection
    between a and C_a(a). Furthermore, for all x, y ∈ a, x ∈ y ↔ C_a(x) ∈ C_a(y).


    **Proof.** Obviously c_a is a surjective map from a to C_a(a) and x ∈ y implies
    c_a(x) ∈ c_a(y). We show that for all x, y ∈ a, c_a(x) ∈ c_a(y) implies x ∈ y.
    Then by the extensionality of a, c_a is injective.


    Suppose there is a y_0 ∈ a such that for all y ∈ a with rk(y) < rk(y_0) and x
    ∈ a, x ∈ y ↔ c_a(x) ∈ c_a(y) but there is an x_0 ∈ a such that x_0 ∉ y_0 and c_a(x_0)
    ∈ c_a(y_0). Since c_a(x_0) ∈ c_a(y_0), there is z ∈ a∩y_0 such that c_a(x_0) =
    c_a(z) = c_a(y_0). Then rk(z) < rk(y_0). However, this implies x_0 = z ∈ y_0,
    a contradiction.


    # ## 3.1.4 Definability


    Denote by M the domain of a structure M.


    # **Definition 3.1.13.** Let F be a set of formulas in L.


    +   (i) Given a structure M and A ⊆ M, we say that A is F-definable in M if there
    is a formula φ(u, v_0, ..., v_n) ∈ F and a finite sequence a_0, ..., a_n in M
    such that x ∈ A if and only if M ⊨ φ(x, a_0, ..., a_n);'
