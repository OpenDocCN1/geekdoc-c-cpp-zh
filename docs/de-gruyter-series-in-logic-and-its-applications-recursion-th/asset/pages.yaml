    # ## 3.5 \(\omega\)-models


    **Definition 3.5.1.** A structure \(\mathfrak{M}\) is an \(\omega\)-model if \(\omega^\mathfrak{M}
    = \omega\).


    \(\omega\)-models are widely used in recursion theory and descriptive set theory.
    A major point of interest in an \(\omega\)-model is its standard part.


    **Definition 3.5.2.** Let \(\mathfrak{M} = \langle M, E \rangle\) be a structure
    and \(M_1 \subseteq M\). Then \(M_1\) is \(E\)-closed if for every \(x \in M_1\),
    \(yEx\) and \(y \in M\) implies \(y \in M_1\). The standard part of \(\mathfrak{M}\)
    is the maximal \(E\)-closed wellfounded subset of \(M\).


    Obviously if \(M_1 \subseteq M\) is \(E\)-closed, then for any \(\Sigma_0\)-formula
    \(\varphi(v)\) and \(x \in M_1\), \(\langle M, E \rangle \models \varphi(x)\)
    if and only if \(\langle M_1, E \rangle \models \varphi(x)\).


    **Lemma 3.5.3.** Suppose that \(\mathfrak{M} \models \text{KP}\). Then \(x\) belongs
    to the standard part of \(M\) if and only if \(\text{rk}(x)\), the rank of \(x\),
    belongs to the standard part of \(\mathfrak{M}\).


    **Proof.** Since \(\mathfrak{M} \models \text{KP}\), by the \(\Sigma\)-induction
