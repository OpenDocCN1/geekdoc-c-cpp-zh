    # 7.3.3 Further generalizations


    Another generalization of the Posner–Robinson Theorem (7.3.1) into the transfinite
    is as follows:


    **Theorem 7.3.7** (Shore and Slaman [134]). For any recursive ordinal \(\beta\),
    if \(x \not\le_T 0^{(\beta)}\) for \(\gamma < \beta\), \(\gamma < \beta\), then
    there is a \(g\) such that \(x \oplus g \equiv_T g^{(\beta)}\).


    Theorem 7.3.7 is proved by a forcing argument (Kumabe–Slaman forcing) different
    from Cohen forcing, and is used to show the definability of the complete Turing
    degree \(0''\) (see Exercise 7.3.3). On the other hand, it is possible to extend
    Theorem 7.3.7 beyond recursive ordinals. This was shown by Woodin using a set-theoretic
    argument:


    **Theorem 7.3.8** (Woodin [169]). If \(z\) is not hyperarithmetic, then there
    is a \(g\) such that \(z \oplus g \equiv_T 0^{(\delta)}\).


