    A_{i,f(i,l),n})$ is a $\Delta^1_1$-nullset. Since g is $\Pi^1_1$-ML-random, $g
    \in C_i$. Then for any j, there is an l such that $g \in A_{i,l,f(i,l),n}$. Thus
    $\mathfrak{A}(\omega_1^{CK}, g) \models (\forall k)(\exists^{III}(m))(\varphi_i(k,
    y^{III}) \lor \neg \varphi_i(k, y^{III}))$ and so $\mathfrak{A}(\omega_1^{CK},
    g) \models \Delta^1_1$-comprehension.


    # Theorem 14.6.15 (Greenberg and Monin). Every low for $\Pi^1_1$-random real is
    hyperarithmetic.


    Proof. Suppose that x is not hyperarithmetic. By Theorem 14.6.9, x is not low
    for $\Pi^1_1$-ML randomness. Let $\{U_n\}_{n<\omega}$ be a universal $I_1^1(x)$-ML
    test. We claim that for any n and $P \in \mathbf{P}$, $U_n^P \cap P \neq \emptyset$.
    Otherwise, $P \cap U_n^P = \emptyset$ for some n. Then every real $z \in P$ is
    $I_1^1(x)$-ML random. However, for any $\Pi^1_1$-ML random y, by Proposition 14.2.7,
    there is a $z \in P$ such that $y =^* z$. Hence y is also $I_1^1(x)$-ML random.
    In other words, x is low for $I_1^1$-ML random, a contradiction.


    Since P contains only $I_1^1$-ML random reals, $P \cap U_n^P \neq \emptyset$ implies
    that there is a condition $Q \subseteq P \cap U_n^P$.


