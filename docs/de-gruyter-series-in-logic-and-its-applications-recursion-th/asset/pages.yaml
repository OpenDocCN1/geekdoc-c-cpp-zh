    # Definition 6.6.4.


    +   - \( A \in \omega^\omega \) is cofinal if for every \( x \) there is a \(
    y \in A \) such that \( y \ge_T x \).

    +   - A tree \( T \in \omega^{<\omega} \) is pointed if \( T \) is perfect and
    for any \( x \in [T] \), \( x \ge_T T \).

    +   - A pointed tree \( T \) is uniformly pointed if there exists an \( e \) such
    that for any \( x \in [T] \), \( T = \Phi^e_x \).


    # Proposition 6.6.5 (Martin [91]).


    ZF + DC + AD implies that every cofinal set of reals has a uniformly pointed subtree.


    # Proof.


    Suppose that \( A \subseteq \omega^\omega \) is cofinal. Let \( B \subseteq \omega^\omega
    \) be such that \( z = x \oplus y \in B \) if and only if either


    +   - \( x \notin_T y \); or

    +   - \( x \le_T y \) and \( y \notin A \).


