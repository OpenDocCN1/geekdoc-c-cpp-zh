  md: 'Proof. Suppose that \( F \) is uniformly degree invariant and not increasing
    on a cone. Then the set \(\{x \mid F(x) \not\ge_T x\}\) is cofinal in the Turing
    degrees. By Proposition 6.6.5, there is a pointed tree \( T \) such that \( F
    \) is uniformly degree invariant on \( T \) via a function \(\iota : \omega \to
    \omega\) and \( F(x) \not\ge_T x\) for any \( x \in [T] \).


    Given \( x \), let \( x^\iota(i) = 2(x_i + 1)\) for \( i < \omega \). Let \( A
    \subseteq \omega^\omega \) be such that \( x = x_0 \oplus x_1 \in A \) if and
    only if either \( x_1^\iota \not\ge_T 2^\omega \) or


    +   - \( x_0^\iota \in 2^\omega \);

    +   - \( x_0(i) = \langle e, n \rangle\) for some \( e, n < \omega \);

    +   - either \( x_0 \not\le_T x_1 \) or \( F(x_0^\iota)(n) = 0 \leftrightarrow
    x_1(x_1(0)) \neq 0 \) and

    +   - \( x_0^\iota \in [T] \wedge \Phi_e^{x_0^\iota} = x_1 \).


    Consider a two person game \(\mathcal{G}_A\) played by I and II, choosing numbers
    alternately as usual. By AD, either I or II has a winning strategy for \(\mathcal{G}_A\).
    Suppose that I has a winning strategy \(\delta\). We show that \( x \le_T F(x)
    \) on the cone above \( T \oplus \delta \), which will give a contradiction.


    Let \( z_0 \ge_T T \oplus \delta \) and \( x_1^m = m \frown z_0 \) for \( m <
    \omega \). Let \( x_0^m \) be the real in \( [T] \) played by I in response to
    II playing \( x_1^m \), i.e. \(\delta(x_1^m) = \langle e_0, n_0 \rangle \frown
    x_0^m \), where \(\langle e_0, n_0 \rangle\) codes the pair of numbers \( e_0,
    n_0 \) and \(\delta(0) = \langle e_0, n_0 \rangle\) is the first move dictated
    by \(\delta\). Since I wins, \( x^m = x_0^m \oplus x_1^m \in A \) for every \(
    m \). As \( x_1^m \ge_T \delta \), we have \( x_1^m \ge_T x_0^m \). Then for every
    \( m \),


    \( F(x_0^m)^+(n_0) = 0 \leftrightarrow x_1^m(m) = 1. \)


    Since \(\Phi_{e_0}^{(x_0^m)^+} = x_1^m\) and \( x_1^m = m \frown z_0 \), there
    is an \( i \) such that \(\Phi_i^{(x_0^m)^+} = (x^{m+1})^+\) for every \( m \).
    Similarly, there is a \( j \) such that \(\Phi_j^{(x_0^m)^+} = (x_0^m)^+\) for
    every \( m \). Hence \( (x_0^m)^+ \equiv_T (x_0^{m+1})^+\) via \(\langle i, j
    \rangle\), and so \( F((x_0^m)^+) \equiv_T F((x_0^{m+1})^+)\) via \( t(i, j) =
    \langle i'', j'' \rangle \). Since \( F \) is degree invariant and \( z_0 \equiv_T
    x_0^m \equiv_T (x_0^m)^+ \), we have \(\Phi_{e_0}^{(x_0^m)} = F((x_0^m)^+)\) for
    some \( k \). Let \( l_m = F((x_0^m)^+)(n_0) \). Note that \( F((x_0^m)^+) = \Phi_k^{F(z_0)}
    \) and \( F((x_0^{m+1})^+) = \Phi_k^{F((x_0^m)^+)} \). So \(\{l_m\}_{m \in \omega}\)
    is \( F(z_0) \)-recursive. Note that \( z_0(m) = x_1^{m+1}(m+1) = 1 - l_{m+1}
    \). Thus \( z_0 \le_T F(z_0) \), a contradiction.


    Hence II has a winning strategy \(\tilde{\tau}\). We show that \( F(x) <_T x \)
    on the cone above \( T \oplus \tilde{\tau} \). Fix a real \( x_0 \in [T] \) so
    that \( x_0 \ge_T T \oplus \tilde{\tau} \). By the Recursion Theorem relativized
    to \( x_0 \), there is an \( e_0 \) such that \(\tilde{\tau}((e_0, n)^\frown x_0)(m)
    = \Phi_{e_0}^{e_0}(\langle n, m \rangle)\) for every \( n, m \). For each \( n
    \), let \( x_1^n = \tilde{\tau}((e_0, n)^\frown x_0) \). Since II wins, it must
    be the case that \( x_0 \le_T x_1^n \) and \( F(x_0^n)(n) = x_1^n(x_1^n(0)) \).
    Then


    \( F(x_0^n)(n) = x_1^n(x_1^n(0)) = \Phi_{e_0}^{e_0}(\langle n, x_0^n(e_0(n, 0))
    \rangle) \)


    and so \( F(x_0) \le_T x_0 \). Since \( F \) is degree invariant, we conclude
    that \( F(x) <_T x \) on a cone.


    By Lemma 7.1.4, fix \( x_0 \) such that \( F(x) <_T x \) on the cone \(\{x \mid
    x \ge_T x_0\}\). Then there is an \( e_0 \) such that the set \( C = \{x \mid
    \Phi_{e_0}^x = F(x) \wedge x \ge_T x_0\}\) is cofinal. By Proposition 6.6.5, there
    is a perfect tree \( T_0 \) and a number \( i \) such that \( [T_0] \subseteq
    C \) and \( T_0 = \Phi_i^x \) for every \( x \in [T_0] \).'
