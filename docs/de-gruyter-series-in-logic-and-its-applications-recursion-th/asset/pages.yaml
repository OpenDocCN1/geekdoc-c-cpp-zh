    $B = \{T \in 2^{<\omega} \mid T \text{ is a perfect tree in which every infinite
    path belongs to } \mathcal{C}\}.$


    Then $B$ is a $\Pi^1_1$-set. By Theorem 4.1.2, there is a $T \in B$ with $T \in
    L_\omega$. By relativizing the Gandy Basis Theorem (2.5.3) to $T$, there is a
    real $x \in [T] \subseteq \mathcal{C}$ such that $x \not\le_h T$ and $\omega_1^x
    \le \omega_1^{x \oplus T} = \omega_1^T$. Hence $x \notin L_\omega$, a contradiction.


