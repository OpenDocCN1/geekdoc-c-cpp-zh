    each real $x$, one has to work within $L_{\omega_1^x}[x]$ to search for a solution
    to the $\Sigma_1^1$-formula $\varphi(u)$. This lack of uniformity is an issue
    when one wishes to choose the $x$’enumerated at the least stage” satisfying $\varphi$.
