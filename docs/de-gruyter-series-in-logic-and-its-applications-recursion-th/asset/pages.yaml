  md: 'We now show that no nonhyperarithmetic real is low for \(\Pi^0_1\)-random.
    Let \(\mathbb{P} = \langle \mathbf{P}, \le \rangle\) be a notion of forcing, where


    \(\mathbf{P} = \{P \mid P \text{ is nonempty and } \Sigma_1^1\text{-closed containing
    only } \Pi_1^1\text{-ML random reals}\}\).


    For \(P, Q \in \mathbf{P}\), define \(P \le Q\) if and only if \(P \subseteq Q\).
    Note that \(\mu(P) > 0\) for each \(P\).


    Let \(((\varphi_i, \psi_i))_{i < \omega}\) be a recursive enumeration of arithmetical
    formulas. For each \(i\), let


    \(A_i = \{x \mid \exists l (\mathcal{A}_1^{\text{CK}, x}, x) = (\forall k)(\exists
    y)(\varphi_i(k, y) \lor \neg \psi_i(k, y))\}\).


    Define an approximation of \(A_i\) at \(j\) as


    \(A_{i,j} = \{x \mid \exists l (\mathcal{A}_1^{\text{CK}, x}, x) = (\forall k
    \le j)(\exists y)(\varphi_i(k, y) \lor \neg \psi_i(k, y))\}\)


    and for \(n \in \mathcal{O}\), set


    \(A_{i,j,n} = \{x \mid \exists l (\mathcal{A}_1^{\text{CK}, x}, x) = (\forall
    k \le j)(\exists y^{|n|})(\varphi_i(k, y^{|n|}) \lor \neg \psi_i(k, y^{|n|}))\}\).


    Suppose \(x \in A_i\). Then for each \(j\), there is an \(n\) such that \(x \in
    A_{i,j,n}\). Uniformly for each \(j < \omega\) and \(n \in \mathcal{O}\), apply
    a "dual form" of Lemma 13.1.10 obtained by replacing \(m, n\) there respectively
    with \(l\) and the Gödel number of "\((\forall k < j)(\exists y^{|n|})(\varphi_i(k,
    y^{|n|}) \lor \neg \psi_i(k, y^{|n|}))\)". We then have a \(\Pi_1^1\)-function
    \(p_i : \omega^2 \times \mathcal{O} \to \omega\) such that for \(j, l < \omega\)
    and \(n \in \mathcal{O}\),


    \(U_{i,j,l,n} = \{x \mid \exists l (\mathcal{A}_1^{\text{CK}, x}, x) = \neg p_i(j,
    l, n)\}\)


    is a \(A_1^l\)-open cover of \(A_{i,j,n}\), with \(\mu(U_{i,j,l,n} \setminus A_{i,j,n})
    < 2^{-j-n-1}\). Then \(U_{i,j,l} = \bigcup_{n \in \mathcal{O}} U_{i,j,l,n}\) is
    a \(\Pi_1^1\)-open set. Note that \(A_{i,j} \subseteq U_{i,j,l}\) and


    \(\mu(U_{i,j,l} \setminus A_{i,j}) < \sum_{n < \omega} 2^{-j-n-1} \le 2^{-j-l+1}\).


    Let \(G_i \supseteq A_i\) be the \(\Pi_1^1\)-set defined as \(\bigcap_{l,j} U_{i,j,l}\).
    Let


    \(\mathcal{D}_1 = \{P \in \mathbb{P} \mid P \subseteq G_i \lor P \cap G_i = \emptyset\}\).


    # Lemma 14.6.13. \(\mathcal{D}_1\) is dense for each \(i\).


    Proof. Let \(P\) be a condition. There are two cases to consider:


    Case 1. \(\mu(P \setminus G_i) > 0\). Then there is a \(k\) such that \(\mu(P
    \cap \bigcap_{(j,b) \le k} U_{i,j,l}) > 0\). Let \(Q = P \cap \bigcap_{(j,b) \le
    k} U_{i,j,l}\). Then \(Q \in \mathcal{D}_1 \cap \mathbf{P}\).


    Case 2. \(\mu(P \setminus G_i) = 0\). By Lemma 13.1.10, there exists a \(\Sigma_1^1\)-closed
