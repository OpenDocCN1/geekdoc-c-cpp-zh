    procedure for “enumerating” a $\Pi_1^1$-set of reals is to “enumerate” the $H^x$-sets
    in order to compute a witness $z$. Here we face a problem similar to that for
    version one, in that there is no uniform way to execute this procedure. We give
    below an example to illustrate how such a difficulty may be addressed.


    # Definition 3.7.5. A norm on a set $A \subseteq 2^\omega$ is a function $\varphi
    : A \to \alpha$ for some ordinal $\alpha$.


    Norms are among the most important objects in descriptive set theory. A norm on
    a set $A$ acts as an “enumerating function” for $A$.'
