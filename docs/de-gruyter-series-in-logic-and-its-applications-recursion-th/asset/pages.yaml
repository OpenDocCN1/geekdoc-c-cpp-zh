    omega \to \\omega$ such that for any $n, n \\in \\ulcorner \\varphi \\urcorner\
    \ \\langle \\mathscr{D}, \\le \rangle \\vDash \\varphi$ if and only if $f(n) \\\
    in \\ulcorner \\varphi \\urcorner \\langle \\omega, 2^\\omega, +, \\cdot, \\subseteq\
