  md: '**Theorem 3.3.4.** Let $\mathcal{M}$ be a transitive model of KP. Then for
    each $\beta < o(M)$, $L_\beta \in M$ and $(L_\beta)^\mathcal{M} = L_\beta$.


    **Proof.** By Theorem 3.3.2, the formula “$x = L_\beta$” is $\Delta_1$-definable
    over $\mathcal{M}$. By the absoluteness of $\Delta_0$-formulas, $L_\beta \in M$
    and $(L_\beta)^\mathcal{M} = L_\beta$.


    **Corollary 3.3.5.** Suppose $\mathcal{M}$ is transitive, admissible and $\mathcal{M}
    \models \text{“V = L”}$. Then $M = L_a$ where $a = o(\mathcal{M})$.


    **Theorem 3.3.6.** $a$ is admissible if and only if $(L_a, \in)$ is admissible.


    **Proof.** If $(L_a, \in)$ is admissible, then $a$ is admissible.


    If $a = o(\mathcal{M})$ for some admissible $\mathcal{M}$, then $(L_\beta)^\mathcal{M}
    = L_\beta$ for each $\beta < a$ by Theorem 3.3.4. Hence it suffices to show that
    $L_a = \bigcup_{\beta < a}(L_\beta)^\mathcal{M}$ is admissible. We verify that
    $\Delta_0$-collection holds in $L_a$ and leave the verification of other properties
    to the reader.


    Suppose that $(L_a, \in) \models (\forall x \in a)(\exists y)\varphi(x, y)$. By
    the absoluteness of $\Delta_0$-formulas, for each $x \in a$, there is a (least)
    $\beta < a$ such that


    $\mathcal{M} \models (\exists y \in \mathcal{E}) \varphi(x, y).$


    Then Theorem 3.3.2 and Theorem 3.1.6 on $\Sigma$-collection imply that there is
    an $a_0 < a$ such that $a \in L_{a_0}$, and


    $\mathcal{M} \models (\forall x \in a)(\exists \beta < a_0)(\exists y \in L_\beta)\varphi(x,
    y).$


    The absoluteness of $\Delta_1$-formulas now gives


    $(L_a, \in) \models (\forall x \in a)(\exists y)\varphi(x, y).$


    Then if $y \in (L_a, \in) \models (\exists x \in a)\varphi(x, y)) \in L_{a_0+1}$
    and is contained in $L_a$.


    Obviously if $a = \omega$, then $L_a = \text{HF}$. Hence $L_a$ is the smallest
    admissible set (cf. Theorem 3.2.4). Note that if $a > \omega$ is admissible, then
    $\omega a = a$.


    A fundamental property of $L$ is the following known as condensation:


    **Theorem 3.3.7.** Suppose that $\beta > 0$ and $(X, \in) \prec_{\Sigma_1} (J_\beta,
    \in)$. Then $(X, \in) \cong (J_\gamma, \in)$ for some $\gamma \le \beta$. Moreover
    $\pi(x) \supseteq x$ for every $x \in X$.


    **Proof.** Suppose $(X, \in) \prec_{\Sigma_1} (J_\beta, \in)$. Then $(X, \in)$
    is wellfounded and satisfies the extensionality axiom. By Theorem 3.1.12, there
    is a transitive set $M$ such that


    $\pi : (X, \in) \cong (M, \in).$


