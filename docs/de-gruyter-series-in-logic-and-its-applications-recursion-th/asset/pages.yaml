  md: '# ## 14.3.2 Domination and \(\Pi^1_1\)-randomness


    # **Lemma 14.3.3.** If \(x\) is \(\Pi^1_1\)-random, then it is \(\Delta^1_1\)-dominated.


    Proof. By the proof of Theorem 13.3.2, for each \(e \in \omega\) and \(n \in \omega\),
    the set \(A_{e,n} = \{x \mid (\exists f \in HYP)(\Phi_e^{f(x)} \text{ is total}
    \rightarrow \Phi_e^{f(x)} < f)\}\) has measure 1. Note that \(A_{e,n} \in \Pi^1_1\).
    By Corollary 13.11.1, there is a \(\Delta^1_1\)-set \(\hat{A}_{e,n} \subseteq
    A_{e,n}\) such that \(\mu(A_{e,n}) = 1\). Hence if \(x\) is \(\Pi^1_1\)-random,
    then \(x \in \hat{A}_{e,n}\). By Corollary 14.3.2, \(\omega_1^{CK} = \omega_1^x\).
    Thus if \(g \le_T x\), then \(g = \Phi_e^{f(x)}\) for some \(e\) and \(n \in \omega\),
    proving the lemma.


    # **Proposition 14.3.4** (Kjos-Hanssen, Nies, Stephan and Yu [68]). For any \(x
    \in 2^\omega\), the following are equivalent:


    +   (i) \(x\) is \(\Pi^1_1\)-random;

    +   (ii) \(x\) is strongly \(\Pi^1_1\)-ML random and \(\Delta^1_1\)-dominated;

    +   (iii) \(x\) is \(\Pi^1_1\)-ML random and \(\Delta^1_1\)-dominated;

    +   (iv) \(x\) is \(\Delta^1_1\)-random and \(\Delta^1_1\)-dominated;

    +   (v) \(x\) is \(\Pi^1_1\)-Kurtz random and \(\Delta^1_1\)-dominated.

    +   (vi) \(x\) is \(\Delta^1_1\)-Kurtz random and \(\Delta^1_1\)-dominated.


    Proof. By Corollary 14.3.2 and Lemma 14.3.3, we have (i) \(\Rightarrow\) (ii)
    \(\Rightarrow\) (iii) \(\Rightarrow\) (iv) \(\Rightarrow\) (v) \(\Rightarrow\)
    (vi).


    To prove (vi) \(\Rightarrow\) (i), it is sufficient to prove (vi) \(\Rightarrow\)
    (iv) according to Corollary 14.3.2. Suppose \(x\) is \(\Delta^1_1\)-dominated
    and \(\Delta^1_1\)-Kurtz random. Let \((U_n)_{n < \omega}\) be a \(\Delta^1_1\)
    ML test. Then there is a recursive function \(f : \omega \times 2^{<\omega} \rightarrow
    \omega\) such that for any pair \((n, \sigma)\), \(\sigma \in U_n\) if and only
    if \(f(n, \sigma) \in \omega\). Since \(x\) is \(\Delta^1_1\)-dominated, \(\omega_1^x
    = \omega_1^{CK}\). Define a \(\Pi^1_1(x)\) relation \(R \subseteq \omega \times
    \omega\) such that


    \(R(n, m) \equiv (\exists \sigma)(m \equiv \sigma \wedge f(n, \sigma) \in O_m
    \wedge \sigma \prec x),\)


    where \(O_m = \{i \in \omega \mid i < |m|\}\). By the \(\Pi^1_1\)-Uniformization
    Theorem (4.2.1), there is a partial function \(p\) uniformizing \(R\). Since \(x
    \in \cap_n U_n\), \(p\) is a total function and so \(\Delta^1_1(x)\). Since \(\omega_1^x
    = \omega_1^{CK}\), there is an \(m_0 \in \omega\) such that \(p(n) \in O_{m_0}\)
    for every \(n\). Define a \(\Delta^1_1\)-Martin-Löf test \((\hat{U}_n)_{n < \omega}\)
    so that \(\sigma \in \hat{U}_n\) if and only if \(f(n, \sigma) \in O_{m_0}\).
    Then \(x \in \cap_n \hat{U}_n\). Let


    \(\hat{f}(n) = \min\{l \mid (\exists \sigma \in 2^{<\omega})(\sigma \in \hat{U}_n
    \wedge x \prec [\sigma])\}\)


    be a \(\Delta^1_1(x)\)-function. Then there is a \(\Delta^1_1\)-function \(f\)
    dominating \(\hat{f}\). For \(n < \omega\), define


    \(V_n = \{\sigma \mid \sigma \in 2^{\le f(n)} \wedge \sigma \in \hat{U}_n\}.\)


    Then \(P = \cap_{n \in \omega} V_n\) is a \(\Delta^1_1\)-closed set and \(x \in
    P\). Hence \(x\) is not \(\Delta^1_1\)-Kurtz random, a contradiction.'
