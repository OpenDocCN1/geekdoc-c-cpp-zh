  md: '# 6.4 Large cardinals


    Despite a fairly comprehensive set of axioms for a theory of sets, a considerable
    number of important mathematical problems are known to be independent of ZF. Additional
    assumptions have been introduced to study such problems, and among the assumptions
    are those involving the notion of a large cardinal. We discuss some of them here.


    # 6.4.1 Inaccessible cardinals


    # Definition 6.4.1.


    +   - A cardinal \(\kappa\) is *inaccessible* if \(\kappa\) is regular and for
    every cardinal \(\nu < \kappa, 2^\nu < \kappa\);

    +   - A cardinal \(\kappa\) is *weakly inaccessible* if \(\kappa\) is a regular
    limit cardinal.


    We only consider \(\kappa > \omega\) here. The assumption that there is an inaccessible
    cardinal is the weakest large cardinal axiom. If \(\kappa\) is inaccessible, then
    ZFC \(\vdash\) "(\(V_\kappa, \in\)) \(\vDash\) ZFC". In other words, ZFC + (\(\exists
    \kappa\)(\(\kappa\) is inaccessible) implies that ZFC is consistent. By Gödel''s
    second Incompleteness Theorem, ZFC + "ZFC is consistent" does not imply the consistency
    of "ZFC + (\(\exists \kappa\)(\(\kappa\) is inaccessible)". This means that one
    is not able to construct a model of "ZFC + (\(\exists \kappa\)(\(\kappa\) is inaccessible)"
    by assuming that there is a model of ZFC.


    At first sight, the notion of an inaccessible cardinal appears to be disconnected
    from the structure of the set of reals. Rather surprisingly, the two are closely
    linked, as illustrated by the following example.


    **Proposition 6.4.2** (Solovay [149]). If there is no uncountable \(\Pi^1_1\)-thin
    set, then \(\omega_1\) is inaccessible in \(L\).


    **Proof.** Clearly \(\omega_1\) is regular in \(L\). Since \((L, \epsilon) \vDash\)
    GCH, it is sufficient to show that \(\omega_1\) is a limit cardinal in \(L\).


    Suppose not. Then there is a countable ordinal \(\gamma < \omega_1\) such that
    \((L, \epsilon) \vDash \omega_1 = \gamma^+ = [2^\gamma]\). Since \(\gamma\) is
    countable, there is an \(x\) which computes a well-ordering of \(\omega\) of order
    type \(\gamma\). Then \((L[x], \epsilon) \vDash 2^\omega = \omega_1\). Relativizing
    the proof of Corollary 4.3.6 to \(x\), we have \(\{z \mid z \in L_{\omega_1^{CK}}[x]\}\)
    to be an uncountable \(\Pi^1_1(x)\)-thin set, a contradiction.


    Proposition 6.4.2 is concerned with the classical topic in descriptive set theory
    of existence of perfect subsets of an uncountable definable set of reals. It says
    that to require all \(\Pi^1_1\)-sets to be "well-behaved", one would have to appeal
    at least to the existence of an inaccessible cardinal. This situation may be viewed
    from the perspective of reverse mathematics, a program which investigates set
    existence axioms that are necessary and sufficient to prove theorems in "ordinary
    mathematics". In the present context, one is interested in set-theoretic axioms
    that are necessary and sufficient to establish the consistency of a statement
    in descriptive set theory, relative to the consistency of ZF or ZFC. More precisely,
    given such a statement \(\varphi\) in descriptive set'
