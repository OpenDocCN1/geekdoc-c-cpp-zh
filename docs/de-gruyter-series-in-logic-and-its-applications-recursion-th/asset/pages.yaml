- pgno: 16
  md: 'More basic facts about analytical sets may be found in Jech [53]. For \(\sigma
    \in \omega^{<\omega}\), let \([\sigma]\) denote the set of functions in \(\omega^\omega\)
    which extend \(\sigma\). We say that a function \(f : \omega^\omega \to \omega^\omega\)
    is in the class \(\Gamma\) if \((x, \sigma) \in \omega^\omega \times \omega^{<\omega}
    \mid x \in f^{-1}([\sigma]) \in \Gamma\). Note that every \(\Sigma_1^1\)-function
    is continuous.


    The following proposition is immediate.


    # Proposition 1.1.8.


    +   (i) If \(f : \omega \to \omega\) is total, then \(f \in \Sigma_2^0 \leftrightarrow
    f \in \Delta_2^0\).

    +   (ii) A function \(f : \omega^\omega \to \omega^\omega\) is \(\Sigma_1^1\)
    if and only if its graph \(G'' = \{(x, y) \mid f(x) = y\}\) is \(\Sigma_1^1\);
    if \(f\) is \(\Pi_1^1\) then \(G'' \in \Pi_1^1\); if \(f\) is \(\Delta_1^1\) then
    \(G'' \in \Delta_1^1\).

    +   (iii) If \(f\) is total, then \(G''\) is \(\Delta_1^1\) if and only if \(f\)
    is \(\Delta_1^1\).

    +   (iv) If \(f : \omega^\omega \to \omega^\omega\) is total, then \(f \in \Sigma_1^1
    \leftrightarrow f \in \Delta_1^1\).


    Proof. (i) is obvious. For (ii), note that \((x, y) \in G''\) if and only if \((\forall
    n)(\forall \sigma \prec x \in f^{-1}([\sigma]))\). Hence if \(f\) is \(\Sigma_1^1\)
    (resp. \(\Pi_1^1\)) then \(G''\) is \(\Sigma_1^1\) (resp. \(\Pi_1^1\)). Moreover,
    if \(G''\) is \(\Sigma_1^1\), then \(x \in f^{-1}([\sigma])\) if and only if \((\exists
    y)(\forall \sigma \prec x, (y) \in G'')\). So \(f\) is \(\Sigma_1^1\) if and only
    if its graph \(G'' = \{(x, y) \mid f(x) = y\}\) is \(\Sigma_2^1\).

    (iii). If \(f\) is total, then \(x \in f^{-1}([\sigma])\) if and only if \((\forall
    y)(\forall \tau \prec x \in f^{-1}([\tau]))\).

    (iv). If \(f\) is total, then \(x \in f^{-1}([\sigma])\) if and only if \((\forall
    y)(\forall \sigma \prec x, y) \in G''\). So if \(G''\) is \(\Sigma_n^1\), then
    \(f\) is \(\Pi_n^1\). By (iii), \(f\) is \(\Delta_n^1\).


    Given \(\sigma_i\) and \(\sigma''_i\) in \(\omega^{<\omega}\), where \(i \le n\),
    we say that \((\sigma''_0, \dots, \sigma''_n)\) is a substring of \((\sigma_0,
    \dots, \sigma_n)\) if \(\sigma''_i \subseteq \sigma_i\) for each \(i\). A tree
    \(T \subseteq \omega^{<\omega} \times \dots \times \omega^{<\omega}\) (\(n\)-fold
    product) is assumed to have the property that if \((\sigma_0, \dots, \sigma_n)
    \in T\) then all of its substrings are in \(T\). For our purpose, all trees grow
    downwards with root at the top. The following tree representation theorem provides
    a useful picture of \(\Sigma_1^1\)-sets of reals.


    # Proposition 1.1.9.


    A predicate \(P(x, m)\) is \(\Sigma_1^1\) if and only if there is a recursive
    sequence of recursive trees \(\{T_m\}_{m < \omega}\) such that \(T_m \subseteq
    \omega^{<\omega} \times \omega^{<\omega}\) and


    \(P(x, m) \Leftrightarrow (\exists y)(\forall n)(\langle x \mid n, y \mid n \rangle
    \in T_m).\)


    Proof. A predicate \(P(x, m)\) is \(\Sigma_1^1\) if and only if there is a partial
    recursive function \(\Phi(\sigma, \tau, m)\) which satisfies properties (i)—(iii)
    of Definition 11.1, so that \(P(x, m) \Leftrightarrow (\exists y)(\forall k)(\Phi(x
    \mid k, y \mid k, m) \downarrow \to \Phi(x \mid k, y \mid k, m) \neq 0)\). At
    stage \(\max\{|\sigma|, |\tau|\}\), put \((\sigma, \tau)\) in \(T_m\) if and only
    if \(\Phi(\sigma, \tau, m) \downarrow\) or \(\Phi(\sigma, \tau, m) \neq 0\). We
    leave it to the reader to verify that \(\{T_m\}_{m \in \omega}\) satisfies the
    requirement.


    # 1.1.3 \(\Sigma_1^1\)-sets of reals


    A set of reals is \(\Sigma_1^1\) if there is a \(\Sigma_1^1\)-predicate \(P\)
    (possibly with a number parameter \(m\)) such that \(P(x, m)\) holds if and only
    if \(x\) belongs to the set. A set of reals is \(\Pi_1^1\) if its complement is
    \(\Sigma_1^1\). Both \(\Sigma_1^1\) and \(\Pi_1^1\)-sets of reals play significant
    roles in higher recursion theory. In this section, we introduce some basic facts
    about these sets.'
