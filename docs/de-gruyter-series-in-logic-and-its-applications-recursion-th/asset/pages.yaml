    Note that more was proved in the theorem above. Recall (see § 1.5.1) that there
    is a \( \Pi^1_1 \)-set \( A \subseteq \omega \times \omega^\omega \) such that
    every \( \Sigma^1_1 \)-set \( B \) is of the form \( B = \neg A_n = \{x \mid (n,
    x) \notin A\} \) for some \( n \). These \( n \)’s are called \( \Sigma^1_1 \)-codes.
    Then Theorem 2.7.2 may be strengthened to: There is a recursive function \( f
    : \omega \times \omega \to \omega^\omega \) such that if \( m, n \) are \( \Sigma^1_1
    \)-codes and \( (2^\omega \setminus A_n) \cap (2^\omega \setminus A_m) = \emptyset
    \), then \( f(n, m) \in \text{BC} \cap \Delta^1_1 \), \( (2^\omega \setminus A_{f(n,m)})
    \cap (2^\omega \setminus A_n) = \emptyset \), and \( (2^\omega \setminus A_m)
    \subseteq (2^\omega \setminus A_{f(n,m)}) \). This is an effective separation
    theorem which is a central result in effective descriptive set theory. We will
    discuss related facts in the sequel.


    **Remark 2.7.3.** One may wonder how recursive codes are able to code the same
    sets as those coded hyperarithmetically. The answer is that there is a trade-off
    in the number of induction steps used. For example, a hyperarithmetic open set
    can be coded by a hyperarithmetic code in one step but any recursive code for
    it will be in some \( \Sigma_\beta \) where \( \beta \) is a possibly large recursive
    ordinal.


    We say that \( A \le \omega^\omega \) is \( \Sigma^1_1(\text{HYP}) \) if \( A
    = A_x \) for some hyperarithmetic \( x \in \Sigma_\beta \). Louveau [85], using
    Gandy forcing, proved the following result.


    **Theorem 2.7.4** (Louveau [85]). If \( A, B \) are \( \Sigma^1_1 \) and separated
    by \( A_x \) for some \( x \in \Sigma_\beta \), then \( A \) is separable from
    \( B \) by \( A_y \) for some \( y \in \Sigma_\beta \cap \Delta^1_1 \). Hence
    if \( A \) is \( \Delta^1_1 \) and \( \Sigma_\beta \), then \( A \) is \( \Sigma_\beta(\text{HYP})
