    P \}$, define a $\Pi_1^1$-relation $\mathcal{R}$ by


    \(\mathcal{R}(R, i, \sigma, P) \leftrightarrow (\sigma R \wedge P \subseteq R
    \wedge P \Vdash \varphi_i \wedge P \Vdash [\sigma] = \{ \tau \mid \tau < \sigma
    \} \wedge \log |\sigma| - 1 \text{ is the } i\text{-th fully splitting level of
    } R).\)


