  md: 'Proof. Assume \((\forall x \in a)(\varphi(x) \leftrightarrow \psi(x))\). Then
    \((\forall x \in a)(\varphi(x) \lor \neg \psi(x))\). Note that the formula \(\varphi(x)
    \lor \neg \psi(x)\) is \(\Sigma\). By Theorem 3.1.5, there is a set \(c\) such
    that \((\forall x \in a)(\varphi(x) \lor \neg \psi(x) \text{ if and only if }
    (\forall x \in a)\varphi^{(c)}(x) \lor \neg \psi^{(c)}(x))\). Define \(b = \{y
    \mid y \in a \land \varphi^{(c)}(y)\}\). By \(\Delta_0\)-separation, such a \(b\)
    exists.


    If \(y \in b\), then \(y \in a \land \varphi^{(c)}(y)\) and so \(y \in a \land
    \varphi(y)\) since \(\varphi(y)\) is \(\Sigma\). If \(y \in a \land \varphi(y)\),
    then \(y \in a \land \psi(y)\) and so \(y \in a \land \psi^{(c)}(y)\) since \(\psi\)
    is \(\Pi\).


    # 3.1.2 Definition by \(\Sigma\)-recursion


    As seen in Chapters 1 and 2, definition by recursion using effective transfinite
    induction is a powerful tool in second order arithmetic. We now study definition
    by recursion in the setting of admissible set theory. This may be viewed as a
    generalization of recursion over \(\omega^{CK}\).


    Recall that a set \(x\) is transitive if \((\forall y)(\forall z)(y \in x \land
    z \in y \rightarrow z \in x)\). Note that the formula "\(x\) is transitive" is
    \(\Delta_0\).


    A function \(f\) is \(\Sigma\) if there is a \(\Sigma\)-formula \(\varphi\) such
    that \(f(x) = y \leftrightarrow KP \vdash \varphi(x, y)\). By Theorem 3.1.5, \(f\)
    is defined by a \(\Sigma_1\)-formula. It is not difficult to see that if \(f\)
    is \(\Sigma\), then for any set \(u\), \(KP \vdash (\exists y)(v = f \upharpoonright
    u)\), where \(f \upharpoonright u = \{(x, y) \mid f(x) = y \land x \in u)\}\).


    # Theorem 3.1.8.


    Let \(G\) be an \(n+2\)-ary \(\Sigma\)-function. There is an \(n+1\)-ary \(\Sigma\)-function
    \(F\) such that


    ```

    KP \vdash F(y, x_1, \dots, x_n) = G(y, x_1, \dots, x_n, \langle z, F, x_1, \dots,
    x_n \rangle \mid z \in y!).

    ```


    Proof. Assume \(n = 0\) for simplicity. Let \(P(f)\) be the sentence:


    ```

    f \text{ is a function } \land \text{Dom}(f) \text{ is transitive } \land

    (\forall y \in \text{Dom}(f))(y = G(y, \langle z, f(z) \rangle \mid z \in y!)).

    ```


    Note that \(P(f)\) is a \(\Sigma\)-formula. Define


    ```

    Q(y, z) = (\exists f)(P(f) \land f(y) = z),

    ```


    and


    ```

    F(y) = z \Leftrightarrow Q(y, z).

    ```


    It suffices to show that


    ```

    KP \vdash F \text{ is a function } \land (\forall y)(\exists z)Q(y, z).

    ```


    We show that KP \(\vdash (\forall y)(\exists z)Q(y, z)\). The other conjunct may
    be proved using a similar argument. Suppose KP does not prove \((\forall y)(\exists
    z)Q(x, y, z)\). Then there is a model \(\mathcal{M} = \langle M, \in \rangle\)
    of KP such that \(\mathcal{M} \models (\exists y)(\forall z)\neg Q(x, y, z)\).
    By the Axiom of Foundation, choose \(y\) such that


    ```

    \mathcal{M} \models (\forall z)\neg Q(y, z) \land (\forall y'' \in y)(\exists
    z)Q(y'', z).

    ```'
