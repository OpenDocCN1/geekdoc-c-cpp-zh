    The next theorem is in Jech [53].


    # Theorem 6.1.11.


    +   (i) Let gamma >= 0 be an ordinal and assume that for each alpha < gamma, P_alpha
    has property (K). Then the product forcing P = Pi_{alpha < gamma} P_alpha with
    finite support has property (K);

