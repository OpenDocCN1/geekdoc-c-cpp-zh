  md: '# **Lemma 9.1.8** (Baumgartner [5]). If G is P-generic over M = (M, ε), then
    every countable set of ordinals in M[G] is countable in M.


    **Proof.** The proof is a fusion argument similar to that of Theorem 6.2.11 and
    is left to the reader.


    Since M ⊆ GCH and P = (P, ≤) is a notion of product forcing with countable support,
    we have |P| ≤ (ℵ₁)^M. Thus P satisfies (ℵ₂)^M-c.c. Together with Lemma 9.1.8,
    we have:


    # **Lemma 9.1.9.** P preserves cardinals.


    # **Lemma 9.1.10.** For any real x ∈ M and countable ordinal β, there is a countable
    α > β such that x ≤_T G_α


    **Proof.** We show that for any x ∈ M and β < (ω₁)^M, the set D_{x,β} = {q ∈ P
    | q ⊩ (∃α > β)(x ≤_T G_α)} is dense. Given p ∈ P, there is a countable α > β such
    that p(α) = undefined. Choose any such ordinal a and let q ≤ p such that q(γ)
    = p(γ) for γ ≠ α and q(α) = {ε ∈ 2^<ω | ∀n < |α|(n is even → α(n) = x(n))}. Then
    q(α) is a pointed tree in which every infinite path Turing computes x. Hence q
    ∈ D_{x,β}.


    For any countable ordinal α ∈ M, let R_α ≅ ω × ω be a well-ordering of ω × ω in
    M of order type α. Let |n|_{R_α} denote the order type of R_α restricted to the
    set of numbers less than n under R_α. Define Φ_{p,β}(Ġ_p β < α = ((n, m) | Ġ_p(m)
    = 1 ∧ n ∧ α | n|_{R_α} = β).


    # **Lemma 9.1.11** (Baumgartner [5]). For every real x ∈ M[G] \ M, there is a
    countable ordinal a such that x ≤_T Φ_{p,β}(Ġ_p β < α. Hence M[G] ⊨ CH.


    **Proof.** The proof is again a fusion argument similar to that of Theorem 6.2.11.


    Now let X ⊇ G be a set of reals whose Turing degrees are maximally independent
    in M[G]. We call such an X a maximally independent set.


    The next step is to destroy GCH by adding reals to M[G] but keeping X as a maximally
    independent set. Let Q̇ = (Q̇, ≤̇) ∈ M be a P-name such that for any p ∈ P,


    p ⊩ "Q̇ is a product Sacks forcing of length ω̇₂ with countable support"


    and


    p ⊩ (∀q)(q ∈ Q̇ ∧ q(α̇) is defined → ω̇₁ < α̇ < ω̇₂).


    Hence P * Q̇ is a two step iterated forcing. By Theorem 6.1.11 and the assumption
    that M[G] ⊨ CH for any P-generic set G, we have the following lemma.


    # **Lemma 9.1.12.** For any p ∈ P, p ⊩ Q̇ is ℵ₂-c.c.


    # **Lemma 9.1.13.** P * Q̇ preserves cardinals.


    **Proof.** By Lemma 9.1.9, it is sufficient to prove that for any P-generic set
    G over M, M[G] ⊨ Q preserves cardinals.'
