    \( |A_n| \le 2 \cdot 2^{-h_{n+1}} \).

    ```


    In other words,


    ```

    \( \mu(B_n = \bigcup \{[\sigma] \mid \sigma \ge \sigma_s \wedge \sigma \notin
    A_n\}) \ge 2^{-l_1} \cdot (1 - 2^{-h_{n+1} + l_{n+1}}) \).

