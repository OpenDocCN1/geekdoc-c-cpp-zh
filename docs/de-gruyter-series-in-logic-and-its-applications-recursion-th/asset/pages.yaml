    # 7.4 Classifying order-preserving functions on \(2^\omega\)


    We say that \(f : 2^\omega \to \omega_1\) is degree invariant if \(x \equiv_T
    y\) implies \(f(x) = f(y)\).


    **Lemma 7.4.1.** Suppose that \(f : 2^\omega \to \omega_1\) is degree invariant
