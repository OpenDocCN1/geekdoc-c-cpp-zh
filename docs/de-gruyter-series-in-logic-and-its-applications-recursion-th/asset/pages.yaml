    y, t)\), then either no real \(t \in L_{\omega_1^{X,y}}\) codes X or \(y \in L_{\omega_1^{(t,y)}}\).


    Since \(L_{\omega_1^{X,z}}[X, z] = L_{\omega_1^{X,z}} \prec_L\) is uniformly \(\Delta_1\)
    in \(L_{\omega_1^{X,z}}[X, z]\). Moreover, (4) implies that (5) is \(\Sigma_1\)
    in \(L_{\omega_1^{X,z}}[X, z]\). We show that \(F(\alpha, X)\) is defined for
