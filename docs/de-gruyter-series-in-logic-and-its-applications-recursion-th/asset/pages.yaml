  md: '# # B An interview with Gerald E. Sacks


    Chi Tat Chong and Yue Yang¹


    Gerald E. Sacks is Emeritus Professor of Mathematical Logic at Harvard University.
    He received his PhD degree in 1961 from Cornell University and taught at Cornell
    until 1967 when he took up an appointment at MIT. He was on the faculty of Harvard
    and MIT from 1972 and retired from MIT in 2006 and from Harvard in 2012. Professor
    Sack''s work in recursion theory has had a profound influence on the development
    of the subject over the past 50 years. This interview was conducted in June 2009
    at the Graduate Center of the City University of New York.


    **Question:** Thanks for granting this interview. We thought it would be a good
    idea to spend some time talking and hearing from you about your work and views
    on recursion theory and logic in general. They will be an inspiration to students
    of logic and an important source of information to professional logicians as well
    as historians of the subject. We think people would be interested to get a sense
    of the development of major topics and ideas in recursion theory from your perspective.
    Such an account would be very illuminating.


    **Sacks:** I find that hard to believe but I am willing to try.

    *(laughter)*


    **Q:** I think it is good for us, for the purpose of this interview, to start
    at the beginning. I understand that you come from Brooklyn.

    **S:** Brooklyn, New York. Yes.


    **Q:** You went to a place called Brooklyn Technical High School. Did you already
    decide then that you wanted to be a mathematician?

    **S:** No. No. I was interested in math when I was around 10 or 11. But my interest
    faded when I became 12 or 13. I think what I noticed was that girls were not interested
    in math, or boys who talked about math all the time. But they were interested
    in literature and art. So my interest shifted. *(laughter)* I became less interested
    in math and more interested in literature, poetry and arts, that sort of thing.


    **Q:** But when you went to college, did you then ...

    **S:** When I went to college, I thought I was going to be an engineer, I have
    no idea why. That would have been a terrible mistake. But fortunately before I
    finished engineering I went to the army. In the army I was for three years, I
    became interested in math again. Someone gave me a copy of *Introduction to Metamathematics*
    by S. C. Kleene ...


    **Q:** A mathematician, I presume, who gave it to you?

    **S:** Yes, yes and I started reading it and I thought it was very interesting.'
