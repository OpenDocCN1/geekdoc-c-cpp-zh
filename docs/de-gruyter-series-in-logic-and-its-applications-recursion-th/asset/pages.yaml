    # 6.3 A cardinality characterization of \(\Pi^1_1\)-sets


    In this section, we present an application of Martin’s Axiom to the characterization
    of \(\Pi^1_1\)-sets due to Martin and Solovay [90].


    # 6.3.1 Almost disjoint forcing


    **Definition 6.3.1.** A set \( A \subseteq 2^\omega \) of reals is *almost disjoint*
    if for any \( x \in A \), \( |x| = \infty \) and for any \( x \neq y \in A \),
    \( x \cap y \) is finite.


    The following notion of forcing was introduced by Silver.


    **Definition 6.3.2.** Given an index set \( I \), an almost disjoint set \( A
    = \{x_i\}_{i \in I} \) and \( X \subset I \), \(\mathbb{P} = (\mathbb{P}, \le)\)
    is an *almost disjoint forcing* corresponding to \( A \) and \( X \) if every
    \( p \in \mathbb{P} \) is a partial function from \( \omega \) to 2 such that

    - \( (\forall i \in X)(|\text{Dom}(p) \cap x_i| < \infty) \); and

    - \( |\{n \in p(n) = 1\}| < \infty \).

    We write \( p \le q \) if \( p \supseteq q \).


    **Lemma 6.3.3.** Given an almost disjoint set \( A = \{x_i\}_{i \in I} \) on an
    index set \( I \) and \( X \subset I \), the almost disjoint forcing corresponding
    to \( A \) and \( X \) is c.c.c.


    **Proof.** Given two conditions \( p \) and \( q \), \( p \) is incompatible with
    \( q \) if and only if \(\{n \mid p(n) = 1\} \neq \{n \mid q(n) = 1\}\). Since
    there are only countably many finite subset of \( \omega \), the lemma is immediate.
    \(\square\)'
