    for each i in I. Then the product forcing Pi_{i in I} P_i with countable support
    satisfies kappa^+-c.c.


    # 6.1.5 Iterated forcing


    Product forcing is less amenable to fine tuning the construction of a model. The
    notion of iterated forcing, introduced by Solovay and Tennenbaum [147], offers
    more “flexibility” in this respect. Given an ordinal alpha, let I subset P(alpha)
