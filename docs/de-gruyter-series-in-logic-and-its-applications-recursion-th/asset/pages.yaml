  md: '# 2.1.2 $\Pi^0_2$-singletons


    Let x be the unique real satisfying a predicate in the class $\Gamma$. Then x
    is said to be a $\Gamma$-singleton. We have seen that every $\Sigma^1_1$-singleton
    is $\Delta^1_1$ and $\emptyset$ is a $\Pi^1_1$-singleton. In this section we will
    show that every H-set is a $\Pi^0_2$-singleton.


    # Lemma 2.1.3. If x is a $\Pi^0_2$-singleton, then x'' and any $y \equiv_T x$
    is a $\Pi^0_2$ singleton.


    Proof. Let x be a $\Pi^0_2$-singleton for the predicate R. Note that the set $\{y
    \mid R(\Phi^y_e)\}$ is $\Pi^0_2$ for each e. Let e$_0$ be an index such that $\Phi^{y}_{e_0}
    = y$ for all y. Then the predicate Q(y) $\Leftrightarrow$ R($\Phi^{e_0}_y$) $\wedge$
    ($\forall e$)(e $\in$ y $\rightarrow$ ($\exists s$)($\exists \sigma$)($\sigma$
    < y $\wedge$ $\Phi^{e_0}_{e_0}[s](e)[s] \downarrow$)) is $\Pi^0_2$. Note that
    x'' is the unique y such that Q(y) holds. If x = $\Phi^{e_0}_y$ and y = $\Phi^{e_0}_x$
    then the predicate S(y) $\Leftrightarrow$ R($\Phi^{y}_{e_0}$) $\wedge$ ($\forall
    e$)(e $\in$ y $\rightarrow$ ($\exists s$)($\exists \sigma$)($\sigma$ < y $\wedge$
    $\Phi^{e_0}_{e_0}[s](e)[s] \downarrow$ = 1)) is $\Pi^0_2$ and witnesses the uniqueness
    of y.


    # Theorem 2.1.4. There exists a $\Pi^0_2$-predicate H such that for all reals
    y and $n \in O^y$, $(\exists x)(H(x,n,y)) \wedge H(n,H^y_n,n)$.


    Hence every $H^y$-set is a $\Pi^0_2(y)$-singleton.


    Proof. By the Recursion Theorem, we may assume that there exists a $\Pi^0_2$-predicate
    H(n, x, y) such that for each $m'' < \omega$, $m \in O^y$, $(H(m'', H^m_n, x))$
    is defined and $H^m_n$ is the unique real satisfying $H(m'', y, x)$. If $m = 2
    \cdot 5^k$ for some k, then define $H(m, H^m_n, x)$ if and only if $(H^m_n)''
    = H^m_n \wedge H(m'', H^m_n, x)$. If $m = 3 \cdot 5^k$ for some k, then define
    $H(m, H^m_n, x)$ if and only if $(\forall n)(H(k,n,x))$.


    We remark that the condition $\Pi^0_2$ in Theorem 2.1.4 cannot be replaced by
    $\Sigma^0_2$. It is not difficult to show that every $\Sigma^0_2$-singleton in
    $2^\omega$ is recursive. On the other hand, every $\Pi^0_2$-singleton in $2^\omega$
    is Turing equivalent to a $\Pi^0_1$-singleton in $\omega^\omega$.


    # Proposition 2.1.15. If $x \in 2^\omega$ is a $\Pi^0_2$-singleton, then there
    is a $\Pi^0_1$-singleton $T \subseteq \omega^\omega$ whose unique member y is
    Turing equivalent to x.


    Proof. Suppose that $x \in 2^\omega$ is a $\Pi^0_2$ singleton. Then there is a
    recursive predicate R(n, $\sigma$) such that x is the unique real z satisfying
    $(\forall n)(\exists m)(R(n, z \mid m))$. We may assume that $(\forall n)(\forall
    \sigma)(R(n, \sigma) \rightarrow |\sigma| \ge n)$. Let T be the set of y''s such
    that


    +   - If y(n) = $\sigma$ then R(n, $\sigma$);


    +   - ($\forall \tau < y(n)$)($\neg$R(n, $\tau$)), and


    +   - ($\forall k \le n$)(y(k) $\le$ y(n) $\vee$ y(n) $\le$ y(k)).


    Then T is a $\Pi^0_1$ set. Furthermore, if $y \in T$ then for each n, y(n) is
    the shortest initial segment $\sigma$ of x satisfying R(n, $\sigma$). Hence if
    $y \in T$, then $\bigcup_{n \in \omega} y(n) = x$. It follows that y is the unique
    real in T. Clearly $y \equiv_T x$.'
