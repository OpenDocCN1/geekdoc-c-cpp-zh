    2.14. Thus the set $\{(x, y) \mid x \in \text{HYP}^y\}$ is $\Pi^1_1$.


    For each $n \in O^\vee$, define $O^\vee_n = \{m \mid m \in O^\vee \land |m| <
    |n|\}$.


    Lemma 2.2.3. The following predicates are $\Pi^1_1$: (i) $n \in O^\vee \land m
    \in O^\vee_n$. (ii) $n \in O^\vee \land m \notin O^\vee_n$.'
