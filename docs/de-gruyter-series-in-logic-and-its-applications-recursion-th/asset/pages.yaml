  md: '# ## 4.1.2 A constructible basis theorem


    Theorem 4.1.2 (Gupasari [42]). If \( A \subseteq 2^\omega \) is a nonempty \(
    \Pi^1_1 \)-set, then there is an \( x \in A \) such that \( x \in L_{\omega_1^x}
    \).


    Proof. Let T be the tree presentation for A and (x, f) its leftmost path. We claim
    that \( x \in L_{\omega_1^x} \). By Lemma 4.1.1, \( f \in L_{\omega_1^x}[x] \).
    Hence there is an ordinal \( \alpha_0 < \omega_1^x \) such that Rang(f) = \( \alpha_0
    \). We define tree \( T^{\alpha_0} \) by replacing \( \omega_1 \) with \( \alpha_0
    \) in T everywhere. Obviously \( T^{\alpha_0} \in L_{\omega_1}[x] \) for some
    \( \gamma_0 < \omega_1^x \) and (x, f) is an infinite path in \( T^{\alpha_0}
    \). Moreover, for any \( (\sigma, p) < (x \upharpoonright |\sigma|, f \upharpoonright
    \text{Dom}(p)) \), there is no infinite path in \( T^{\alpha_0}_{(\sigma, p)}
    = (\{\sigma'', \tau'' \in T^{\alpha_0} \mid (\sigma'', p'') > (\sigma, p)\} \).
    Otherwise, any such infinite path would also be in T and to the left of (x, f),
    which contradicts the choice of (x, f) in T. Then for any \( (\sigma, p) < (x
    \upharpoonright |\sigma|, f \upharpoonright \text{Dom}(p)) \), there exist ordinals
    \( \alpha_{(\sigma, p)} < \omega_1^x \), \( \beta_{(\sigma, p)} < \alpha_{(\sigma,
    p)} \) and a function \( g_{(\sigma, p)} \in L_{\alpha_{(\sigma, p)}} \) such
    that \( g_{(\sigma, p)} \) is an order-preserving function from \( T^{\alpha_0}_{(\sigma,
    p)} \) to \( \beta_{(\sigma, p)} \). Moreover, the function from \( (\sigma, p)
    < (x \upharpoonright |\sigma|, f \upharpoonright \text{Dom}(p)) \) to \( \alpha_{(\sigma,
    p)} < \omega_1^x \) is \( \Sigma_1 \) in \( L_{\omega_1^x}[x] \). Since the set
    \( \{(\sigma, p), T^{\alpha_0}_{(\sigma, p)} \mid (\sigma, p) < (x \upharpoonright
    |\sigma|, f \upharpoonright \text{Dom}(p))\} \) is an element of \( L_{\omega_1^x}[x]
    \), there is a \( \gamma < \omega_1^x \) that bounds any \( \alpha_{(\sigma, p)}
    \) where \( (\sigma, p) < (x \upharpoonright |\sigma|, f \upharpoonright \text{Dom}(p))
    \). We may assume that \( \gamma > \alpha_0 \). Now working in \( L_\gamma \),
    we define an infinite path as follows: \( (o_0, p_0) = 0 \). \( (i_{i+1}, p_{i+1})
    > (o_i, p_i) \) in \( T^{\alpha_0} \) is of length i + 1 so that (1) for all \(
    (\sigma, p) < (o_{i+1}, p_{i+1}) \) not extending \( (o_{i+1}, p_{i+1}) \), there
    is an order-preserving function \( g_{(\sigma, p)} \in L_\gamma \) from \( T^{\alpha_0}_{(\sigma,
    p)} \) into an ordinal \( \beta_{(\sigma, p)} < \gamma \), and (2) there is no
    order-preserving function \( g \in L_\gamma \) from \( T^{\alpha_0}_{(o_{i+1},
    p_{i+1})} \) into any ordinal \( \beta < \gamma \). By the assumption of \( \gamma
    \), we have \( \bigcup_{i < \omega} (o_i, p_i) = (x, f) \). Clearly the sequence
    \( \{(i_i, o_i, p_i)\}_{i < \omega} \) is an element of \( L_{\gamma + \omega}
    \). Hence \( (x, f) \in L_{\gamma + \omega} \subseteq L_{\omega_1^x} \), and so
    \( x \in L_{\omega_1^x} \).


    We have as an immediate consequence of Theorem 4.1.2,


    Corollary 4.1.3. If x is a \( \Pi^1_1 \)-singleton, then \( x \in L_{\omega_1^x}
    \).


    # ## 4.1.3 Exercises


    Exercise 4.1.1. Use Theorem 4.1.2 to prove Proposition 4.2.5.


    Exercise 4.1.2. Prove that there is a nonconstructible real if and only if there
    is a nonempty \( \Pi^1_1 \)-set which does not contain a constructible real.'
