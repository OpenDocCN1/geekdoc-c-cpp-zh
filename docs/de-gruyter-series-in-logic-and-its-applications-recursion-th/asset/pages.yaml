  md: '# 6 Set theory


    This chapter reviews results in set theory that have recursion-theoretic applications.
    Some of these will be stated without proof for future reference.


    # 6.1 Set-theoretic forcing


    The technique of forcing was discussed in the context of recursion theory in Chapter
    5. The original version of the method as presented in Cohen [18] was very similar
    to that developed in § 5.2. Here we follow the approach of unramified forcing
    introduced by Shoenfield [130] (see Kunen [78] for an excellent exposition of
    the subject).


    # 6.1.1 Forcing and genericity


    Let M = (M, ∈) be a countable transitive model of ZFC and let P = (P, ≤) be a
    partial ordering in M. An element p ∈ P is called a condition. Given two conditions
    p, q ∈ P, we say that q is stronger than if p ≤ q. D ⊆ P is dense if for any p
    ∈ P, there is a q ∈ D such that q ≤ p.


    A filter F ⊆ P is a nonempty set such that


    +   - (vp)(Vq)(q ≤ p ∈ Q → p ∈ F);

    +   - (vp)(Vq)((∃)r ∈ F ∧ q ≤ r → r ∈ F ∧ r ≤ p ∧ r ≤ q).


    A generic set G ⊆ P is a filter that meets every dense set. In general, a generic
    set does not belong to M except for very special partial orderings. If G ∉ M,
    then there is a model M[G] = (M[G], ∈) of ZFC such that M ∪ {G} ⊆ M[G] and o(M)
    = o(M[G]). This is defined as follows.


    First, a P-name in M is defined by induction:


    +   - ∅ is a P-name;

    +   - if τ ⊆ the set of P-names × P, then τ is a P-name.


    We use M^P to denote the class of P-names. Note that M^P ⊂ M and is not a member
    of M. Suppose G is generic. Define val(τ, G) by induction:


    +   - if τ is not a P-name, then val(τ, G) = τ;

    +   - otherwise, val(τ, G) = {val(σ, G) | (σ, p) ∈ τ ∧ p ∈ G}.


    Let


    ```

    M[G] = {val(τ, G) | τ ∈ M}.

    ```


    Thus every element x ∈ M[G] has a corresponding P-name. We use ẋ to denote the
    P-name of x. We use ȧ to denote ⟨⟨ḃ, p⟩ | b ∈ a ∧ p ∈ P⟩ for any a ∈ M by induction'
