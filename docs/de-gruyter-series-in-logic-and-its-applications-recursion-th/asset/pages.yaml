  md: '# Define


    ```

    J_0[A] = \emptyset,\nJ_{\beta+1}[A] = \omega^\omega(J_\beta[A]),\nJ_\lambda[A]
    = \bigcup_{\beta<\lambda} J_\beta[A], \text{ if } \lambda \text{ is a limit ordinal.}\nJ[A]
    = \bigcup_\beta J_\beta[A]

    ```


    If \( A = \emptyset \), then we write \( J \) for \( J[A] \). Intuitively and
    according to Jensen [55], \( J_{\beta+1} \) is the result of “stretching” the
    collection of the definable subsets of \( J_\beta \) upwards by \( \omega \)-levels
    in rank without adding new sets. The proof of the following proposition may be
    found in [22].


    # Proposition 3.3.3. For all \(\beta\),


    +   - \( J_\beta[A] \) is transitive.\n- There is a \(\Sigma_1\)-formula \(\varphi(u,
    w)\) such that for any two ordinals \( v < \beta \), \( (J_\beta, \in) \models
    \varphi(v, x) \) if and only if \( x = J_v \);\n- There is a \(\Sigma_1\)-formula
    \(\varphi_\prec(u, v)\) such that\n  (i) for any \(\beta\), \(\varphi_\prec(u,
    v)\) defines a well-ordering \( <_J \) on \( J_\beta \);\n  (ii) for any \( v
    > \beta \), if \( y \in J_\beta \) and \( J_v, \in) \models \varphi_\prec(x, y)
    \), then \( x \in J_\beta \) and \( (J_\beta, \in) \models \varphi_\prec(x, y)
    \).\n- Theorem 3.3.2 remains true for \( J_\beta \);\n- \( J_{\beta+1}[A] \cap
    \mathscr{P}(J_\beta[A]) = \text{Def}^\omega(J_\beta[A]) \).\n- \( L_\beta[A] \subseteq
    J_\beta[A] \subseteq L_{\omega\beta} \).\n- \( J_\beta[A] = L_\beta[A] \) if and
    only if \( \alpha\beta = \beta \).\n- \( L[A] = \bigcup_\beta J_\beta[A] \);\n-
    Theorem 3.3.2 remains valid for \( J \).


    The Gödel operators provide an algorithmic approach to the construction of \(
    L \). It reveals the “black box” hidden within the reference to definability.
    Based on Proposition 3.3.3, we may think of \( L \) as being obtained by an effective
    transfine induction over the class of ordinals, analogous to the way hyperarithmetic
    sets are defined over \( \omega_1^{\text{CK}} \). This connection is useful as
    it suggests initial segments of \( L \) as models of computation in the general
    setting.


    # 3.3.2 Condensation and Skolemization


    If one works within a structure \( \mathfrak{M} \) and performs the stage-by-stage
    construction of \( L \), then one arrives at the same \( L_\beta \) for each \(
    \beta \in M \) if \( \mathfrak{M} \) satisfies a sufficiently strong condition
    such as admissibility. The following theorem formalizes this idea. Let \( (L_\beta)^\mathfrak{M}
    \) denote the \( L_\beta \) constructed in \( \mathfrak{M} \).'
