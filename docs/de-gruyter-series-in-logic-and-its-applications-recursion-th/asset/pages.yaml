- pgno: 6
  md: '# Preface


    > ... logic is about definability.

    > - Gerald E. Sacks [124]


    The above quote underlines the authors’ view that recursion theory is anchored
    on the notion of definability. Although classically the theory began with Turing’s
    conception of effective computability (of various types of objects), it soon took
    on a much broader perspective. A fundamental theorem states that a set of natural
    numbers is computable if and only if it is \(\Delta^1_1\)-definable in first order
    arithmetic. This sets the stage for a general study of sets of natural numbers
    and their syntactic classes.


    The view on definability does not conflict with the fact that computation is the
    heart of recursion theory. Indeed a definability problem naturally translates
    into one about (possibly relativized) computation and vice versa. Kleene’s characterization
    of the \(\Delta^1_1\)-sets of numbers as precisely those that are hyperarithmetic,
    and the corresponding theorem of Spector and Gandy that these are all the reals
    in \(L_{\omega_1^{CK}}\), is a case in point. Once the syntax (the language of
    first and second order arithmetic) and the structure in which to interpret members
    of \(\omega\) and its subsets are specified, definability naturally takes its
    place. Tools and construction techniques have been introduced to study problems
    concerning computability for syntactic classes over \(\omega\), \(2^\omega\) and
    even the power set of \(2^\omega\) or \(\omega^\omega\). Post’s problem for the
    recursively enumerable sets, the Gandy basis theorem for \(\Sigma^1_1\)-sets of
    reals, characterization of \(\Delta^1_1\)-sets in terms of hyperarithmetic, the
    definability of the jump operator, are immediate examples. Indeed it is hard to
    find a problem in the area that has little to do with definability. The title
    of this book is chosen to reflect this point.


    The idea of writing a book in recursion theory, focusing on the computational
    aspects of the set of reals and its subsets, evolved over a period of time. The
    subject was established by Kleene who introduced the notion of hyperarithmetic
    hierarchy relative to a real and its associated ordinals. It grew in the hands
    of Spector, Gandy, Kreisel and Sacks. These were major developments in what one
    now calls higher recursion theory. The theory was a subject of intensive study
    for almost thirty years beginning in the 1950s, but seemed to lose momentum in
    the 1980s. In an interview reproduced in the Appendix, Sacks remarked: “I tended
    over the years to keep predicting the immediate end of recursion theory, but I
    have been wrong every time.” Despite the rather pessimistic pronouncement by one
    of the founders of the field, recursion theory is alive and well. However, higher
    recursion theory in the grand tradition of the pioneers received only occasional
    attention since, even though a number of highly significant contributions to the
    subject, such as Slaman and Woodin’s theorem on the rigidity of the hyperdegrees,
    were made towards the end of the last century, and many interesting as well as
    challenging problems remain. Indeed Sacks himself bade farewell to higher recursion
    theory in 1998. Today the subject is not pursued with as much vigor'
