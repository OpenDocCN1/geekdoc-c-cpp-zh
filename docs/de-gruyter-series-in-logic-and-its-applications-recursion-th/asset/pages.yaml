    \land \varphi_x(v, N_1, \dots, N_m)).$$


    Clearly the set $\{(\exists v)(\varphi_n(v) \land \varphi_x(v, u_1, \dots, u_m))
    \mid n < \omega\}$ is recursive and


    $$n \in x \Leftrightarrow \ulcorner (\exists v)(\varphi_n(v) \land \varphi_x(v,
    u_1, \dots, u_m)) \urcorner \in 0^\sharp.$$


    Thus $x \le_T 0^\sharp$.


    Proposition 6.4.7 implies that $0^\sharp$ has extremely high computational power.
    Recursion-theoretically, one may view $0^\sharp$ as the "jump" of $\emptyset$
    under the #-operator.


