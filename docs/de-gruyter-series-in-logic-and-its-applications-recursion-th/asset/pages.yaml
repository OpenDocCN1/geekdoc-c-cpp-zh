    (i) For each \(i \in I\), \(D_{0,i} = \{p \in \mathbf{P} \mid x_i \subseteq \text{Dom}(p)\}\)
    is dense. (ii) For each \(i \in X\) and \(i \in \omega\), \(D_{1,i} = \{p \in
    \mathbf{P} \mid |\{n \in x_i \mid p(n) = 1\}| > i\}\) is dense.


    **Proof.** (i) is obvious. To see (ii), given any condition \(p\), we have \(|\text{Dom}(p)
    \cap x_i| < \infty\). Then simply extend \(p\) to a condition \(q\) such that
    \(|\{n \in x_i \mid q(n) = 1\}| > i\).


    # **Theorem 6.3.5.**


    If \(G\) is a generic set meeting all \(D_{0,i}\)’s and \(D_{1,i}\)’s for all
    \(i \in I\), then the generic set \(g = \bigcup_{p \in G} p\) is a real such that
    for any \(i \in I, x \in X\) and only if \(g \cap x_i\) is infinite.


    **Proof.** Let \(G\) be a generic meeting all \(D_{0,i}\)’s and \(D_{1,i}\)’s
    for all \(i \in I\). If \(i \in X\), then by (ii) of Lemma 6.3.4, \(x_i \cap g\)
    is infinite. If \(i \notin X\), then by (i) of Lemma 6.3.4, \(x_i \subseteq \text{Dom}(p)\)
    for some \(p \in G\). But \(|\{n \mid p(n) = 1\}| < \infty\), and so \(x_i \cap
    g\) is finite.


    Hence almost disjoint forcing produces a real \(g\) which codes a large set \(X\)
    via an almost disjoint set \(A\).


