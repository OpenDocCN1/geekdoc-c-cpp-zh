  md: '# 2 Hyperarithmetic theory


    In this chapter, we introduce the hyperarithmetical hierarchy and prove that the
    class of hyperarithmetic sets is precisely that of the \(\Delta^1_1\)-sets. Hence
    the hyperarithmetic hierarchy provides the right framework for analyzing \(\Delta^1_1\)-sets
    and \(\Pi^1_1\)-sets. This equivalence also allows one to perform transfinite
    induction over \(\Delta^1_1\)-sets.


    # 2.1 H-sets and \(\Pi^0_2\)-singletons


    # 2.1.1 H-sets


    # Definition 2.1.1.


    +   - The sequence \(\{H_n\}_{n \in O}\) is defined by transfinite induction over
    \(O\) as follows.


    ```

    H_1 = \emptyset,

    H_{2^n} = (H_n)'', \text{the Turing jump of } H_n

    H_{3 \cdot 5^e} = \{\langle m, i \rangle \mid m \in H_{|e|_O(i)}\}.

    ```


    +   - A member of \(\{H_n\}_{n \in O}\) is called an H-set. A real \(y\) is hyperarithmetic
    if \(y \le_T H_n\) for some \(n \in O\). We use HYP to denote the collection of
    all hyperarithmetic sets.


    +   - Similarly, for any real \(x\), the set \(H_n^x\) is defined for all \(n
    \in O^x\):


    ```

    H_1 = x,

    H_{2^n} = (H_n^x)'',

    H_{3 \cdot 5^e} = \{\langle m, i \rangle \mid m \in H_{|e|_O^x(i)}\}.

    ```


    Clearly \(n <_O m\) implies \(H_n <_T H_m\). In fact,


    # Lemma 2.1.2 (Kleene). There is a recursive function \(f\) such that for all
    \(m, n <_O m\) implies \(H_n = \Phi^0_{f(n,m)}\).


    Proof. Let \(e_0\) be an index such that \(x = \Phi^{e_0}_x\) and let \(p, q\)
    be recursive functions such that \(x = \Phi^{e_0}_x \wedge y = \Phi^{e_0}_m\)
    implies \(x = \Phi^{p(n,m)}_x\) and \(\Phi^{q(m)}(x) = m\) where \(\langle m,
    n \rangle \in x\). Fix a function \(g\) as in (i) of Theorem 1.3.4.


    Define \(f\) by induction on \(<_O\). By the Recursion Theorem, we may assume
    that if \(n <_O m\) then \(H_n = \Phi^{f(n,m)}_{f(n,m'')}\) for all \(m'' <_O
    m\). If \(m = 2^{m''}\) for some \(m'' \in O\), then \(\Phi^{f(n,m)}_{f(n,m)}
    = \Phi^{f(n,m'')}_{f(n,m'')}\). If \(m = 3 \cdot 5^e\) for some \(i\), then a
    recursive search for a pair \(\langle m'', k \rangle\) such that \(m'' = \Phi_1(k)\)
    and \(n \in W^{g(m'')}\) allows one to define \(\Phi^{H_n}_{f(n,m)} = \Phi^{H_{n''}}_{f(n,m'')}\).


    Lemma 2.1.2 remains valid for relativized H-sets. Thus there is a recursive function
    \(f\) such that for all \(x\), if \(n <_{O^x} m\) then \(H^x_n = \).'
