    # 14.1.2 Base of a cone of Kurtz random reals


    From the proof of Theorem 14.1.3, one sees that every hyperdegree above that of
    \( \mathcal{O} \) contains a \( A_1^1 \)-Kurtz random real. This fails for \(
    \Pi_1^1 \)-Kurtz randomness. We say that a hyperdegree \( \mathbf{a} \) is a *base
    of a cone for T-Kurtz randomness* if for every hyperdegree \( \mathbf{b} \ge \mathbf{a}
    \), \( \mathbf{b} \) contains a \( T \)-Kurtz random real.


    The hyperdegree of \( \mathcal{O} \) is a base of a cone for \( A_1^1 \)-Kurtz
    randomness as proved in Theorem 14.1.3. Not every nonzero hyperdegree is a base
    of a cone for \( A_1^1 \)-Kurtz randomness (see Lemma 14.6.1). Does there exist
    a base of a cone for \( \Pi_1^1 \)-Kurtz randomness? If so, such a base, say \(
    \mathbf{b} \), is not hyperarithmetically reducible to a \( \Pi_1^1 \)-singleton.
    This means that a hyperdegree which serves as a base must be fairly complicated.


    **Lemma 14.1.5.** For any reals \( x \) and \( z \ge_T x'' \), there is an \(
    x \)-Kurtz-random real \( y \equiv_T z \).


