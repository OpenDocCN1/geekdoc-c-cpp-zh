    # Corollary 13.11.1.


    If \(A\) is \(\Pi_1^1\) and \(\mu(A) = r\) where \(r\) is hyperarithmetic, then
    there is a \(\Delta_1^1\)-set \(B \subseteq A\) such that \(\mu(B) = \mu(A)\).


