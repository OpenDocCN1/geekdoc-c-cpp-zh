  md: '# 3.3.1 The constructible universe


    Expand the language of set theory \(\mathscr{L}\) with a unary relation symbol
    \(\dot{A}\) and denote it as \(\mathscr{L}^{\dot{A}}\).


    **Definition 3.3.1.** Let \(A\) be a set. Given a set \(X\), we say that \(Y\)
    is *definable relative to \(A\) over the structure* \((X, \in, A \cap X)\), written
    \(Y \in Def^A(X)\), if there is a formula \(\varphi(\mathbf{v})\) in \(\mathscr{L}^{\dot{A}}\)
    such that upon interpreting \(\dot{A}\) to be \(A \cap X\), we have \(Y = \{y
    \mid (X, \in, A \cap X) \models \varphi(y)\}\).


    By recursion on ordinals, define


    \(L_0[A] = 0,\)

    \(L_{\beta+1}[A] = Def^A(L_\beta[A]),\)

    \(L_\lambda[A] = \bigcup_{\beta<\lambda} L_\beta[A], \text{if } \lambda \text{
    is a limit ordinal.}\)


    Define \(L[A] = \bigcup_\beta L_\beta[A]\), and \(L = L[\emptyset]\). Obviously
    \(L[A]\) is a proper class.


    If \(x \in L[A]\), then \(x\) is said to be \(A\)-constructible. In particular,
    \(x\) is constructible if \(A = 0\). The construction of \(L\) is uniformly \(\Sigma_1\)-definable
    over any admissible structure \(\mathcal{M}\), in the sense of the following theorem
    whose proof we omit. It involves a tedious coding device that is \(\Sigma_1\)-definable
    by appealing to Theorem 3.1.8. For details, see [22].


    **Theorem 3.3.2.** There exists a \(\Sigma_1\)-formula \(\varphi(u, v)\) such
    that for any admissible structure \(\mathcal{M}\) and ordinal \(\beta \in M\),
    \(\mathcal{M} \models \varphi(\beta, x)\) if and only if \(x = L_\beta\). Moreover,
    \(L_\beta\) is the unique set such that \(\mathcal{M} \models \varphi(\beta, x)\).
    Hence \(L_\beta\) is uniformly \(\Delta_1\)-definable over \(\mathcal{M}\).


    There is a recursion-theoretic way of generating \(L\) via the following set of
    primitive recursive operators introduced by Gödel:


    +   (i) \(F_0(x, y) = \{x, y\}.\)

    +   (ii) \(F_1(x, y) = x \setminus y.\)

    +   (iii) \(F_2(x, y) = x \times y = \{x, y\}.\)

    +   (iv) \(F_3(x, y) = \{(u, z, v) \mid z \in x \wedge (u, v) \in y\}.\)

    +   (v) \(F_4(x, y) = \{(u, v, z) \mid z \in x \wedge (u, v) \in y\}.\)

    +   (vi) \(F_5(x, y) = \bigcup x.\)

    +   (vii) \(F_6(x, y) = \{y \mid \exists z(z, y) \in x\}.\)

    +   (viii) \(F_7(x, y) = \in \cap x \times x.\)

    +   (ix) \(F_8(x, y) = \{z_1 \mid \exists z_0((z_0, z_1) \in x \wedge z_0 \in
    y)\}.\)

    +   (x) \(F_9(x) = A \cap x.\)


    Let


    \(\mathcal{S}^A(U) = U \cup \{U\} \cup \bigcup_{i \le 9} \{z \mid (\exists x \in
    U \cup \{U\})(\exists y \in U \cup \{U\})(z = F_i(x, y))\}\)


    and


    \(\mathcal{R}^A(U) = \bigcup_{n < \omega} (\mathcal{S}^A)^n(U).\)'
