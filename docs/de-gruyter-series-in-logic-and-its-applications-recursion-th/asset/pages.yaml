    # **Proposition 14.2.7.** Suppose that \(T \subseteq 2^{<\omega}\) is a \(\Sigma^1_1\)-tree
    with \(\mu([T]) > 0\). Then for any \(\Pi^1_1\)-ML random \(x\), there is a \(z
