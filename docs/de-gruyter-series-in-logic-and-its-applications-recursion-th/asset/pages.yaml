  md: '\(\Sigma\)-formulas are analogs of recursively enumerable predicates in classical
    recursion theory. Note that there is a difference between a \(\Sigma_1\)-formula
    and a \(\Sigma\)-formula. A \(\Sigma_1\)-formula is a \(\Sigma\)-formula but not
    necessarily conversely.


    # Definition 3.1.4. The theory KP consists of the universal closure of the following
    formulas:


    +   - Extensionality: \((\forall x)((\forall y)((y \in u \leftrightarrow x \in
    u) \rightarrow x = y))\).

    +   - Foundation: \((\exists x)\varphi(x) \rightarrow (\exists x)(\varphi(x) \land
    (\forall y \in x)\neg\varphi(y))\), for all formulas \(\varphi\) in which \(y\)
    does not occur free.

    +   - Pair: \((\forall x)(\forall y)(\exists z) x \in z \land y \in z)\).

    +   - Union: \((\forall x)(\exists y)(\forall u \in x)(\forall v \in u) v \in
    y)\).

    +   - \(\Delta_0\)-separation: \((\forall x)(\exists y)(\forall u)(u \in y \leftrightarrow
    u \in x \land \varphi(u))\), for all \(\Delta_0\)-formulas \(\varphi\) in which
    \(u\) does not occur free.

    +   - \(\Delta_0\)-collection: \((\forall x)(\forall u \in x)(\exists v)\varphi(u,
    v) \rightarrow (\exists y)(\forall u \in x)(\exists v \in y)\varphi(u, v))\),
    for all \(\Delta_0\)-formulas \(\varphi\) in which \(y\) does not occur free.


    Given a formula \(\varphi\), we write \(\varphi^{(w)}\) for the formula obtained
    upon replacing each unbounded quantifier in \(\varphi\) with a bounded quantifier
    restricted to \(w\). Specifically, replace \(\exists u\) with \(\exists u \in
    w\) and \(\forall u\) with \(\forall u \in w\). Clearly if \(\varphi\) is \(\Sigma\),
    then \(\exists w \varphi^{(w)}\) is \(\Sigma\). Under KP, each \(\Sigma\)-formula
    is equivalent to a \(\Sigma_1\)-formula, as given by the following theorem which
    is proved by induction on the complexity of formulas. We leave it as an exercise.


    # Theorem 3.1.5 (The \(\Sigma\)-reflection principle). Let \(\varphi\) be a \(\Sigma\)-formula.
    Then


    \(\text{KP} \vdash \varphi \rightarrow (\exists w) \varphi^{(w)}\).


    Hence the theorem asserts under KP the existence of a \(\Delta_0\)-definable set
    for a given \(\Sigma\)-formula. In fact, it says more:


    # Theorem 3.1.6 (The \(\Sigma\)-collection principle). Let \(\varphi\) be a \(\Sigma\)-formula
    and let \(a\) be a set, Then


    \(\text{KP} \vdash (\forall x \in a)(\exists y) \varphi(x, y) \rightarrow (\exists
    w)((\forall x \in a)(\exists y \in w) \varphi(x, y) \land (\forall y \in w)(\exists
    x \in a) \varphi(x, y)).\)


    Proof. Assume that \((\forall x \in a)(\exists y) \varphi(x, y)\). Then the formula
    \((\forall x \in a)(\exists y) \varphi(x, y)\) is \(\Sigma\). By Theorem 3.1.5,
    there is a set \(c\) such that \((\forall x \in a)(\exists y \in c) \varphi^{(c)}(x,
    y)\). Define \(b = \{y \mid (\exists x \in a) \varphi^{(c)}(x, y)\}\). By \(\Delta_0\)-separation,
    such a \(b\) exists. It is straightforward to verify that \(\varphi^{(c)}(x, y)\)
    implies \(\varphi(x, y)\), since \(\varphi(x, y)\) is \(\Sigma\). Hence \((\forall
    y \in b)(\exists x \in a) \varphi(x, y)\). Since \((\forall x \in a)(\exists y
    \in c) \varphi^{(c)}(x, y)\), we have in fact \((\forall x \in a)(\exists y) \varphi^{(c)}(x,
    y)\). It follows that \((\forall x \in a)(\exists y \in b) \varphi^{(c)}(x, y)\).


    # Theorem 3.1.7 (The \(\Delta\)-separation principle). Let \(a\) be a set. For
    any \(\Sigma\)-formula \(\varphi(x)\) and \(\Pi\)-formula \(\psi(x)\),


    \(\text{KP} \vdash (\forall x \in a)(\varphi(x) \leftrightarrow \psi(x)) \rightarrow
    (\exists w)(\forall x)(x \in w \leftrightarrow x \in a \land \varphi(x)).\)'
