- pgno: 304
  md: '# # C Notations and symbols


    +   - A real x is a member of \(2^\omega\) or \(\omega^\omega\). A string is a
    member of either \(2^{<\omega}\) or \(\omega^{<\omega}\). Strings are denoted
    \(\sigma, \tau\) etc.

    +   - If x is a real, then \(x \restriction n\) is a finite string \(\sigma\)
    of length \(n\) such that for all \(i < n\), \(\sigma(i) = x(i)\).

    +   - If \(\sigma\) is a finite string, then \(|\sigma|\) is its length.

    +   - \(x > \sigma\) means \(x \restriction \sigma = \sigma\).

    +   - \([\sigma] = \{x \mid x \in \omega^\omega \land x > \sigma\}\).

    +   - If f is a function, then Dom(f) denotes the domain of f, and Rang(f) its
    range. Dom(\(\sigma\)) and Rang(\(\sigma\)) carry the obvious meaning where \(\sigma\)
    is considered as a finite function.

    +   - If T is a tree, then \([T] = \{x \mid x \in \omega^\omega \land (\forall
    n)(x \restriction n \in T)\}\).

    +   - Given a set A, \(\mathscr{P}(A) = \{B \mid B \subseteq A\}\) is the power
    set of A.

    +   - \(\le_T\) denotes Turing reduction.

    +   - \(x''\) is the Turing jump of x.

    +   - \(x \oplus y\) is the real z such that \(z(2n) = x(n)\) and \(z(2n + 1)
    = y(n)\).

    +   - \((\cdot, \cdot)\) is a recursion bijection from \(\omega^2\) to \(\omega\).

    +   - For any n and \(x \in 2^\omega\), \(x^{[n]} = \{m \mid \langle n, m \rangle
    \in x\}\).

    +   - If A is a set, then \(\mathscr{P}(A)\) denotes the power set of A.

    +   - \(A \subseteq 2^\omega\) or \(\omega^\omega\) is \(\Pi^0_1\) or \(\Pi^0_1\)
    (resp. \(\Sigma^0_1\) or \(\Sigma^0_1\)) if it is \(\Pi^0_1\) or \(\Pi^0_1\) (resp.
    \(\Sigma^0_1\) or \(\Sigma^0_1\)) definable with real number parameters.

    +   - Given a partial ordering \((\mathbf{P}, \le)\), \(p \perp q\) means p and
    q are incomparable, i.e. \(p \nleq q\) and \(q \nleq p\).'
