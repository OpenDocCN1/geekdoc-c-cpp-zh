  md: 'Now for $n < \omega$ and $a < \omega_1$, let


    ```

    $p_n(a) = \bigcup_{a \in 2^n} p_a(a)$

    ```


    and


    ```

    $p_\omega = \bigcap_{n < \omega} p_n$

    ```


    Suppose that $p_\omega \in G$. Then for any n and m < n, there is a $a_m \in 2^n$
    such that if $a_m < \omega_1$, then $G_{a_m} \in [p_{a_m}(a_m)]$. Define $\tau
    \in 2^\omega$ so that $\tau(m) = \sigma_m(m)$ for $m \le n$. By (2), for each
    such m, $p_\tau(a_m) = p_{a_m}(a_m)$, and for each $\sigma \in 2^n$ and every
    other a, $p_\tau(a) = p_\sigma(a)$. Thus $G_a \in [p_\tau(a)]$ whenever $p_\tau(a)$
    is defined. Hence $p_\tau \in G$. We have the following lemma.


    # Lemma 9.1.16. If $p_\omega \in G$, then for each n there is a $\sigma \in 2^n$
    such that $p_\sigma \in G$.


    If $a \ge \omega_1$, let $\dot{q}_a$ be a name so that


    ```

    $q_a(a) = \bigcup_{\sigma \in 2^n \wedge p_\sigma \in G} q_\sigma(a)$

    ```


    By Lemma 9.1.16, $\dot{q}_n$ is well defined. For $a > \omega_1$, let $\dot{q}_a$
    be a name such that


    ```

    $q_a(a) = \bigcap_{n < \omega} q_n(a)$

    ```


    # Lemma 9.1.17. $(p_\omega, q_\omega) \Vdash (\forall \alpha)(p_G \in \dot{G}
    \leftrightarrow v_G = \dot{x} \Vdash [v_G])$.


    Proof. By (1), $(p_\omega, q_\omega) \Vdash (\forall \alpha)(p_G \in \dot{G} \rightarrow
    v_G = \dot{x} \Vdash [v_G])$ for any generic set $(G, H)$ with $(p_\omega, q_\omega)
    \in (G, H)$ and $x \Vdash [v_G] = v_G$. By Lemma 9.1.16, there is a $\tau \in
    2^{[\alpha]}$ such that $p_\tau \in G$. By (2), $\sigma(m) = \tau(m)$ for any
    m with $a_m < \omega_1$. By (2) again, $p_\sigma = p_\tau \in G$.


    Obviously $(p_\omega, q_\omega) \le (p_0, q_0)$. In fact, for any $(p''_0, q''_0)
    \le (p_0, q_0)$, there is such a sequence below $(p_0, q''_0)$. Hence there is
    a $(p_\omega, q_\omega)$ such that $(p_\omega, q_\omega) \in (G, H)$. Now for
    any $a < \omega_1$, let $z_a = ((p_\omega, a), v_0) \in \dot{G} \in 2^\omega$".
    Then $z_a$ may be viewed as a real in M. By Lemma 9.1.17, $G_a \subseteq z_a \cap
    a$, proving Lemma 9.1.15.


    Next is the construction of the sequences satisfying (1)-(4), of which meeting
    condition (2) is the key. We need a technical lemma.


    # Lemma 9.1.18. If $(p, q) \le (p_0, q_0)$, then there exist an n and a condition
    $(p'', q'') \le (p, q)$ such that for any $(p'''', q'''') \le (p'', q'')$, $(p'''',
    q'''') \Vdash \dot{x}(n) = i$ for $i \le 2$.


    Proof. Suppose not. Then there is a $(p_1, q_1) \le (p_0, q_0)$ such that for
    any n and $(p'', q'') \le (p_1, q_1)$, there exist a $(p'''', q'''') \le (p'',
    q'')$ and an $i_n \le 2$ satisfying $(p'''', q'''') \Vdash \dot{x}(n) = i_n$.
    Then the set


    ```

    $D_n = \{p \mid p \not\perp p_1 \vee (\exists i)(p \le p_1 \wedge (p, \dot{q}_1)
    \Vdash \dot{x}(n) = i_n)\}$

    ```


    is an element of M and is dense in P. Fix a generic set $(G'', H'')$ such that
    $p_1 \in G''$. Then $val(\dot{x}, (G'', H''))(n) = i_n$ if and only if there exists
    a $p \in D_n \cap G''$ such that $(p, \dot{q}_1) \Vdash \dot{x}(n) = i_n$. Thus
    $val(\dot{x}, (G'', H'')) \in M[G'']$, a contradiction.'
