    an initial segment of \( \{m \mid m <_{O^\times} n_1\} \).


    Clause (3) is \( \Pi_1^1 \) since the isomorphism (if there is one) must be hyperarithmetic
    in \( x \oplus y \).


    By relativizing the results in §2.6, there is a \( \Sigma_1^1 \)-set \( \{(x,
    O^{+,*}) \mid x \in 2^\omega\} \subseteq 2^\omega \times \omega \) so that \(
    <_{O^\times} \) is a binary relation on \( O^{+,*} \) with the following properties:


    +   (i) \( O^\times \subseteq O^{+,*} \);

    +   (ii) \( <_{O^\times} \) is the restriction of \( <_{O^\times} \) to \( O^\times
    \);

    +   (iii) for any \( n, n \in O^\times \) if and only if \( <_{O^\times} \) restricted
    to \( \{m \mid m <_{O^\times} n\} \) is a well-ordering.


