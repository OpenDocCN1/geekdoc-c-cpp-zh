    # Theorem 6.3.7 (Martin and Solovay [90]).


    Assume \( \text{MA}_{\aleph_1} \). Then \( (\omega_1)^{[L[x]]} = \omega_1 \) for
    some \( x \in 2^\omega \) if and only if every subset of \( 2^\omega \) with cardinality
    \( \aleph_1 \) is \( \Pi_1^1 \).


    # Proof.


    Suppose that \( (\omega_1)^{[L[x]]} < \omega_1 \) for all \( x \in 2^\omega \).
    Let \( A = \{x_\alpha\}_{\alpha < \omega_1} \) be a maximal chain of Turing degrees.
    Then \( A \) has cardinality \( \aleph_1 \) and contains no perfect subset. It
    follows that for any real \( x \), \( A \) must contain a real not constructible
    in \( L[x] \). If \( A \) is \( \Pi_1^1(x_0) \) for some \( x_0 \), then by Lemma
    4.3.2, \( A \) contains a perfect subset which is a contradiction.


    Conversely suppose that \( (\omega_1)^{[L[x]]} = \omega_1 \) for some \( x \in
    2^\omega \). By Lemma 6.3.6, every subset of \( 2^\omega \) of cardinality \(
    \aleph_1 \) is \( \Pi_1^1 \).


