  md: 'Hence there are again many reals that are low for Schnorr randomness.


    # ## 12.3.4 Lowness for Martin-Löf randomness


    **Definition 12.3.4.** Let \(\Gamma\) be a notion of randomness. A real \(x\)
    is a _base_ for \(\Gamma\) if there is a \(\Gamma^*\)-random \(y\) such that \(x
    \le_T y\).


    The following result is one of the deepest in algorithmic randomness theory.


    **Theorem 12.3.5** (Nies [110] and Hirschfeldt, Nies, Stephan [48])**.** _For
    any_ \(x\)_, the following are equivalent:_

    (i) _\(x\) is K-trivial;_

    (ii) _\(x\) is a base for Martin-Löf randomness;_

    (iii) \((\exists c)(\forall n)(K(n) \le K^c(n) + c)\)_;_

    (iv) _\(x\) is low for Martin-Löf tests;_

    (v) _\(x\) is low for Martin-Löf randomness._


    The concept of a randomness base is particularly important in the proof of Theorem
    12.3.5. Note that one may view Martin-Löf randomness to be the weakest notion
    of randomness as it has only countably many bases (see [27]). Following the characterization
    in Theorem 12.3.5, Nies introduced a new reduction relation \(\le_{LR}\):


    **Definition 12.3.6.** \(x \le_{LR} y\) if every \(y\)-Martin-Löf random real
    is \(x\)-Martin-Löf random.


    Hence by Theorem 12.3.5, \(x \le_{LR} 0\) if and only if \(x\) is \(K\)-trivial.
    This relation is expressed in terms of Kolmogorov complexity as follows:


    **Theorem 12.3.7** (Kjos-Hanssen, Miller, Solomon [66])**.** \(x \le_{LR} y\)
    _if and only if_

    \((\exists c)(\forall n)(K^y(n) \le K^x(n) + c)\)_._


    Combining Corollary 12.2.13 with van Lambalgen''s Theorem (12.1.7) offers additional
    evidence for the randomness thesis:


    **Proposition 12.3.8.** _For any two Martin-Löf random reals_ \(x\) _and_ \(y\)_,_
    \(x \le_K y\) _implies_ \(y \le_{LR} x\)_._


    # ## 12.3.5 Lowness for strong Martin-Löf randomness


    **Theorem 12.3.9** (Downey et al. [23], Nies [111], and Kjos-Hanssen et al. [66])**.**
    _For any_ \(x\)_, the following are equivalent:_

    (i) _\(x\) is K-trivial;_

    (ii) _\(x\) is low for strong Martin-Löf test;_

    (iii) _\(x\) is low for strong Martin-Löf randomness._'
