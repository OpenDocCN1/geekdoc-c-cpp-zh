  md: 'Let \( f : \omega \to \omega^3 \) be a recursive bijection such that if \(
    f(n) = (n_0, n_1, n_2) \) and \( n > 0 \), then \( n > n_0 \). The construction
    of the sequences proceeds as follows:


    Stage 0. Let \(\langle p_0, q_0 \rangle = \langle p_0, q_0 \rangle\) and \( v_0
    = 0 \). Let \(\{\gamma_i\}_{i < \omega}\) be an enumeration of the countable set


    \(\{ \alpha < \omega_2 \mid p_0(\alpha) \text{ is defined } \lor p_0 \Vdash \text{``}q_0(\alpha)
    \text{ is defined''''} \}\).


    Let \(\beta_{0(i,j)} = \gamma_i\) for \( i, j < \omega \). Each \(\gamma_i\) occurs
    infinitely many times on the list to ensure that it is diagonalized infinitely
    often.


    Stage \( n + 1 \). We decompose this into \( 2^n + 1 \) many substages.


    At substage \( j \le 2^n \), define \(\{v''_\sigma\}_{\sigma \in 2^{n+1}}\) and
    \(\{(p''_\sigma, q''_\sigma)\}_{\sigma \in 2^{n+1}}\) such that \( p''_{\sigma^\frown
    0}(\alpha) = p''_{\sigma^\frown 1}(\alpha) \) for each \( \alpha \notin \beta[n]
    \) and \( \sigma \in 2^n \).


    For \( \sigma \in 2^n \) and \( i < 2 \), let \( v''_{\sigma^\frown i} = v''_\sigma
    \). If \( \beta[n] < \omega_1 \), then


