    \ \\langle \\mathscr{D}, \\le \rangle \\vDash \\varphi \\urcorner$. This leads\
    \ to the following conclusion.\n\n# **Corollary 9.5.4.** For any $\\mathsf{M}\
    \ \\vDash \\mathsf{ZFC}$, there is a sentence $\\varphi$ such that $\\ulcorner\
    \ \\varphi \\urcorner \\in \\ulcorner \\psi \\urcorner \\vdash \\mathsf{M} \\\
    vDash \\ulcorner \\langle \\mathscr{D}, \\le \rangle \\vDash \\psi \\urcorner\
    \ \\vdash \\mathsf{Pr}$.\n\nLet $\\mathsf{M} \\vDash \\mathsf{ZFC}$ and $\\varphi$\
    \ be as above. Since $\\mathsf{ZFC} \nvdash \\ulcorner \\langle \\mathscr{D},\
    \ \\le \rangle \\vDash \\varphi \\urcorner$, there exists a model $\\mathsf{N}\
    \ \\vDash \\mathsf{ZFC}$ such that $\\mathsf{N} \\vDash \\ulcorner \\langle \\\
    mathscr{D}, \\le \rangle \\vDash \neg \\varphi \\urcorner$. Hence the statement\
    \ $\\ulcorner \\langle \\mathscr{D}, \\le \rangle \\vDash \\varphi \\urcorner$\
    \ is independent of ZFC. This argument implies the existence of a sentence $\\\
    varphi$ not provable in ZFC, but does not provide any information about $\\varphi$.\
    \ The following offers more information: By Corollary 4.4.1, the statement “every\
    \ real is constructible” is $\\Pi_2^1$. Hence there is a sentence $\\varphi$ in\
