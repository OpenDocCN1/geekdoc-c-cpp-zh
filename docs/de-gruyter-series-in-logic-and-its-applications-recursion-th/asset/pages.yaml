    S: I met him, I guess in the Fall of ''61. In other words, my visit to the Institute
    was under his auspices. One has to apply, even though there is money provided
    by the National Science Foundation, and they have to accept you as a temporary
    member. Obviously it''s up to him (Gödel).


    Q: So he was your host at the Institute?

    S: Yes, but of course, I was afraid of him and never sought him out, essentially
    never spoke with him. But at another year in the Institute – I think it was 1974/75
    – when we had a lot of contact, maybe we met once a month.


    Q: Was he still interested in mathematics at that time?

    S: Oh yes. I remember asking him one day what he thought the outstanding problems
    were in logic and he gave me a short list right there in person. One of them was
    the P ≠ NP problem.


    Q: He was aware of that?

    S: Yes, he was one of the very first, if not the first to draw attention to that
    problem. He wrote a letter to John von Neumann when von Neumann was on his deathbed,
    and he got a reply. Von Neumann said, roughly speaking, this is a very interesting
    problem, I would like to think about it sometime. (laughter)


    This correspondence, I think, was shown to me by Martin Davis. That''s a long
    time ago. Von Neumann died in the ''50s. Another problem which is not entirely
    hopeless is consistency of analysis – proof of the consistency of analysis. There
    are many ways to interpret that. So you could try to find an ordinal which does
    it. The ordinal bears the same relation to analysis that ε₀ bears to formal number
    theory. What is the ordinal? And there are people who ... well, I have met one
    person who thought this was doable, Michael Rathjen. But he also seemed to think
    it might be insane to pursue it, because it is so complicated. In other words,
    the description of the ordinal would be book length. But it would be possible
    to give a sort of a clear description of that ordinal and then demonstrate it''s
    the correct one.


    And Gödel had one more problem: Look, what''s now called computable functions
    – he called them general recursive functions, total functions – there is an intuition
    that this one is more complicated than that one. Find the corresponding formal
    concept.


    Q: Not in terms of definability?

    S: No. Find the true hierarchy of the complexity of computable functions. Of course,
    no one has managed to do this and I think lots of people think it can be done.
    It seemed to him people readily said this was more complicated than that one,
    so there is evidence that the intuitive concept exists. And if that exists, there''s
    got to be'
  merge: -1
