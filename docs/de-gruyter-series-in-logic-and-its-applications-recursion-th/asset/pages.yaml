    # 6.6.4 Turing determinacy


    # **Definition 6.6.6.**


    +   - Turing determinacy (TD) states that any set of Turing degrees either contains
    or is disjoint from a cone.


    +   - If \(\Gamma\) is a class of sets of Turing degrees, then \(\Gamma\)-Turing
    determinacy states that every set in \(\Gamma\) either contains or is disjoint
    from a cone.


    Turing determinacy plays a significant role in descriptive set theory, as shown
    by the following theorems which are stated without proof:


    # **Theorem 6.6.7** (Harrington [45]). ZFC+\(\Sigma_1^1\)-determinacy is consistent
    if and only if ZFC+\(\Sigma_1^1\)-Turing determinacy is consistent.


    # **Theorem 6.6.8** (Woodin).


    +   (i) For any \(n \ge 2\), ZFC + \(\Sigma_n^1\)-determinacy is consistent if
    and only if ZFC + \(\Sigma_n^1\)-Turing determinacy is consistent.


    +   (ii) ZF + DC + AD is consistent if and only if ZF + DC + TD is consistent.


    # 6.6.5 Martin''s conjecture


    A function \(F : 2^\omega \to 2^\omega\) is degree invariant on a cone (of reals)
    \(C = \{ x \mid x \ge_T z \}\) for some \(z\) if any \(x, y \ge_T z\) in \(C\)
    of the same Turing degree satisfy \(F(x) \equiv_T F(y)\). \(F\) is increasing
    on a cone if \(F(x) \ge_T x\) for \(x \in C\). If \(F\) and \(G\) are degree invariant
    on a cone, write \(F \le_M G\) if \(F(x) \le_T G(x)\) for all \(x \in C\). Martin
    made the following conjecture.


    # **Conjecture 6.6.9.** Assume ZF + AD + DC.'
