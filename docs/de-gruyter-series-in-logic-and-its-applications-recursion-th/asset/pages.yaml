    Proof. By Lemma 8.3.3, P is a cofinally progressive relation. Note that (2c) is
    equivalent to


    ```

    \(L_{u^{[\kappa,n]}}(x, y) \models (\exists \beta)((y)_0 \in L_\beta \land (\forall
    z \in L_\beta)(z <_L (y)_0 \rightarrow (\exists n)((x)_n \ge_T y \lor y \succ_T
    (x)_n))).\)

    ```


    Thus P is \(\Pi^1_1\). Hence by Theorem 8.2.4, there is a \(\Pi^1_1\) set A with
    the prescribed properties. Using (3ii), we show by induction on \(<_L\) that A
    is an antichain.


