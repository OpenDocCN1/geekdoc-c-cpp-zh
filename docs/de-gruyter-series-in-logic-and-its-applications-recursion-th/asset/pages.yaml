    \(P(x, y)\) holds.


    Let \(\mathbb{C} = \{y \mid y \in L_{\omega_1^y}\}\).


    **Lemma 8.2.2.** Assume \((2^\omega)^L = 2^\omega\). If P is \(\Pi^1_1\) and cofinally
