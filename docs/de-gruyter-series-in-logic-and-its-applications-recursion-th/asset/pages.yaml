  md: "# **Definition 10.3.5.** The degree structure $(\\mathscr{P}_h, \\le)$ is *biinterpretable*\
    \ with second order arithmetic if $R^*$ is definable in $(\\mathscr{P}_h, \\le)$.\n\
    \nThe intuition is as follows: It is immediate that $(\\mathscr{P}_h, \\le)$ can\
    \ be “interpreted” in the standard model of second order arithmetic $\\mathcal{M}\
    \ = (\\omega, \\mathscr{P}(\\omega), <, +, \\cdot, 0, 1, \\in)$. In other words,\
    \ any $(\\mathscr{P}_h, \\le)$-definable relation is definable in $\\mathcal{M}$.\
    \ The converse is not obvious. Slaman and Woodin [144] showed that the biinterpretability\
    \ of $(\\mathscr{P}_h, \\le)$ would enable one to interpret $\\mathcal{M}$ in\
    \ $(\\mathscr{P}_h, \\le)$. In other words, any $\\mathcal{M}$-definable degree\
    \ relation is definable in $(\\mathscr{P}_h, \\le)$. This is the content of the\
    \ following theorem. We say that a set of hyperdegrees is analytical if it is\
    \ the set of hyperdegrees of an analytical set.\n\n# **Proposition 10.3.6.** *If*\
    \ $(\\mathscr{P}_h, \\le)$ *is biinterpretable with second order arithmetic, then\
    \ every analytical set of hyperdegrees is definable in* $(\\mathscr{P}_h, \\le)$.\n\
    \n**Proof.** Suppose that $A$ is analytical. Let $\tilde{A} = \\{ \\mathbf{x}\
    \ \\in |\\exists \\mathbf{x} \\in A \\mathbf{x} \\in \\mathbf{x} \\} \\}$. We\
    \ show that $\tilde{A}$ is definable in $(\\mathscr{P}_h, \\le)$. Let $\\psi$\
    \ be a formula in the language of second order arithmetic such that\n\\( x \\\
    in A \\Leftrightarrow (\\omega, \\mathscr{P}(\\omega), <, +, \\cdot, 0, 1, \\\
    in) \\models \\psi(x) \\).\n\nSince quantifying over countable sets of hyperdegrees\
    \ can be expressed in $(\\mathscr{P}_h, \\le)$ through the codes, the second order\
    \ quantifiers over $\\omega$ are also interpretable in $(\\mathscr{P}_h, \\le)$\
    \ via first order quantifiers over codes of subsets of $\\omega$. Then $\\mathbf{x}\
    \ \\in A$ if and only if there is a finite sequence $\tilde{\\mathbf{p}}$ such\
    \ that $R^*(\\tilde{\\mathbf{p}}, \\mathbf{x})$ and $\\psi(x)$ is satisfied in\
    \ the model with $\\mathbf{x}$ coded by $\\tilde{\\mathbf{p}}$ and $\\omega$.\n\
    \nThus $\\tilde{A}$ is definable in $(\\mathscr{P}_h, \\le)$.\n\nThe rigidity\
    \ of the hyperdegrees proved in Theorem 10.2.4 allows one to show the biinterpretability\
    \ of this structure with second order arithmetic:\n\n# **Theorem 10.3.7** (Slaman\
    \ and Woodin [141], Shore [133]). *The structure* $(\\mathscr{P}_h, \\le)$ *is\
    \ bi-interpretable with second order arithmetic.*\n\n**Proof.** Let $\\psi(\\\
    tilde{\\mathbf{p}}, \\mathbf{x})$ be defined as follows:\n\n+   - $\\tilde{\\\
    mathbf{p}}$ codes a real $\\mathbf{x}$;\n+   - For any coded real $y \\le_\\alpha\
    \ x$, there exist degrees $\\mathbf{y}_0, \\mathbf{y}_1 > \\mathbf{x}$ such\n\
    +   - $\\mathbf{y}_0 \\cap \\mathbf{y}_1 = \\mathbf{x}$, and\n+   - $e_\\gamma$\
    \ can be embedded into both $[\\mathbf{x}, \\mathbf{y}_0]$ and $[\\mathbf{x},\
    \ \\mathbf{y}_1]$ with least element $\\mathbf{x}$.\n\nBy Theorem 10.3.1, $\\\
    psi$ may be viewed as a first order formula in the language of partial ordering\
    \ for $\\langle \\mathscr{P}_h, \\le \\rangle$. If $R^*(\\tilde{\\mathbf{p}},\
    \ \\mathbf{x})$ holds, then by Lemma 10.2.3 $\\langle \\mathscr{P}_h, \\le \\\
    rangle \\models \\psi(\\tilde{\\mathbf{p}}, \\mathbf{x})$.\n\nIf $\\langle \\\
    mathscr{P}_h, \\le \\rangle \\cong \\langle \\psi(\\mathbf{p}), \\in \\rangle$\
    \ then by Lemma 10.2.3, the real $x$ stated must have hyperdegree $\\mathbf{x}$.\
    \ So $R^*(\\tilde{\\mathbf{p}}, \\mathbf{x})$ is true.\n\nIn summary, the structure\
    \ $(\\mathscr{P}_h, \\le)$ is biinterpretable with second order arithmetic."
