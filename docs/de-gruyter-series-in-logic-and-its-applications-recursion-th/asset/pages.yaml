    \( \{U_n^s\}_{n < \omega} \). We construct an increasing sequence \( \{\sigma_s\}_{1
    \le s < \omega} \) of strings as follows.


    +   Let \( \sigma_0 = 0 \).


    +   Stage \( s + 1 \). Let \( l_0 = 0, l_1 = |\sigma_s| \), and \( l_{n+1} = 2^{l_n}
    \) for \( n > 1 \). For each such \( n \), let


