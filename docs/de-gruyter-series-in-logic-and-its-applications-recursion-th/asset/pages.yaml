    # ## 8.4.2 The consistency strength of \( \Pi^1_1 \)-Martin''s conjecture


    Given that the results in Chapter 7 are established under AD which is essentially
    a large cardinal assumption, one would expect a direct connection between Martin''s
    conjecture and large cardinals. The first level for such an investigation is clearly
    \( \Pi^1_1 \). We prove that if \( \Pi^1_1 \)-Martin''s conjecture is true, then
    \( 0^\sharp \) exists.\(^2\) Define the Friedman set \( F^* \) as

    \( F^* = \{x \mid (\forall a < \omega_1^x)(\forall a \subseteq a)(a \in L_{a^+_1}
    \rightarrow a \in L_{a+1}[x]) \} \)


    It is not difficult to see that \( F^* \) is \( \Sigma^1_1 \).


    **Lemma 8.4.4.** \( F^* \) is cofinal in the Turing degrees.


    Proof. For any real \( z \), let

    \( F(z) = \{x \oplus z \mid (\forall a < \omega_1^x)(\forall a \subseteq a)(a
    \in L_{a^+_1} \rightarrow a \in L_{a+1}[x \oplus z]) \} \).

    Then \( F(z) \) is \( \Sigma^1_1(z) \) and nonempty. By Gandy''s Basis Theorem
    (2.5.3) relativized to \( z \), there is a \( x \) such that \( a_1^{x \oplus
    z} = a_1^z \) and \( x \oplus z \in F(z) \). Then \( x \not\geq_T z \in F \).


    We will use the following result due to Harrington. A sketch of the proof is given
    in Exercises 8.4.3 to 8.4.8.


    **Lemma 8.4.5** (Harrington [45]). If \( 0^\sharp \) does not exist, then \( \tilde{F}
    = 2^\omega \setminus F \) is cofinal in the Turing degrees.


    **Theorem 8.4.6** (Chong, Wang and Yu [13]). If there is no uniformly order-preserving
