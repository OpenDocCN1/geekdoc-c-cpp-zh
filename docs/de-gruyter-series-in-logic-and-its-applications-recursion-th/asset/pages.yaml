    # 3.6.2 Coding a structure


    Given a recursive language \(\mathscr{L}\), one may associate with it a recursive
    set \(\dot{\mathscr{L}}\) and code a countable structure in \(\mathscr{L}\) by
    the set of natural numbers \(\omega\) with relations in \(\dot{\mathscr{L}}\)
    defined over \(\omega\), so that the resulting structure is isomorphic to the
    original structure. If \(\mathfrak{M} = (M, R_0, \dots, R_n)\) is countable, a
    coding \(\ulcorner M \urcorner = (\omega, \dot{R}_0, \dots, \dot{R}_n)\) of \(\mathfrak{M}\)
    is a structure such that \(\mathfrak{M} \cong \dot{\mathfrak{M}}\). If all the
    relations \(R_0, \dots, R_n\) are recursive, then the structure \(\ulcorner M
    \urcorner\) is said to be recursive. However, very few structures are recursive.


    Let \(\mathscr{L}\) be a recursive language and \(\mathfrak{M}\) a structure coded
    by \(\ulcorner \mathfrak{M} \urcorner\). For a formula \(\dot{\varphi}(u)\) in
    \(\dot{\mathscr{L}}\) corresponding to the formula \(\varphi(u)\) in \(\mathscr{L}\),
    we may compute the complexity of the set of the set \(A = \{m \in \omega \mid
    \ulcorner m \urcorner \vDash \dot{\varphi}(m)\}\). The procedure to calculate
    the complexity goes as follows: Recursively decode \(\dot{\varphi}(u)\) to obtain
    the formula \(\varphi(u)\). Then the complexity of \(A\) is the complexity of
    \(\varphi(u)\). For example, suppose \(\mathscr{L}\) is the language of set theory
    and \(\dot{\varphi}(u)\) corresponds to the formula \(\varphi(w): (\forall u)(\forall
    v)(u \in v \land v \in w \rightarrow u \in w)\) ("$w$ is transitive"). Then the
    set


    \(\{m \mid (\omega, \dot{\in}) \vDash (\forall i)(\forall j)(i \dot{\in} j \land
    j \dot{\in} m \rightarrow i \dot{\in} m)\}\)


    is \(\Pi_1(\dot{\in})\).


    In general, given a language \(\mathscr{L}\) with relation symbols \(R_0, \dots,
    R_n\), a structure and a formula \(\varphi \in \mathscr{L}\), the set \(\{m \in
    \omega \mid \ulcorner M \urcorner \vDash \varphi(m)\}\) is arithmetical in \(\dot{R}_0
    \oplus \cdots \oplus \dot{R}_n\). Moreover, this coding is uniform. Hence if \(\{\varphi_i\}_{i
    < \omega}\) is recursive, then the set \(\{(i, m) \mid \ulcorner M \urcorner \vDash
    \dot{\varphi}_i(m)\}\) is Turing computable in \((\dot{R}_0 \oplus \cdots \oplus
    \dot{R}_n)^{(\omega)}\) via an algorithm with index \(e\). In particular, there
    is an \(e\) such that if \(\{\varphi_i\}_{i < \omega}\) is a recursive set of
    sentences, then \(\ulcorner M \urcorner \vDash \dot{\varphi}_i\) if and only if
    \(\dot{\varphi}_e^{(R_0 \oplus \cdots \oplus R_n)^{(i)}}(i) = 1\). As a consequence,
    we have the following:


