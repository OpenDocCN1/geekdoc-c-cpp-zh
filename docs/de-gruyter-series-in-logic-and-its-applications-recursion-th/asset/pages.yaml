    # **Lemma 6.3.6.**


    Assume \(\text{MA}_{\aleph_1}\) and suppose that \((\omega_1)^{1[x]} = \omega_1\)
    for some \(x \in 2^\omega\). If \(B \subseteq 2^\omega\) has cardinality \(\aleph_1\),
    then \(B\) is \(\Pi^1_1\).


