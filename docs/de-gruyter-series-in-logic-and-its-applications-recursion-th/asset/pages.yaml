    Define \( \sigma_0 = x \mid 1 \) and \( \tau_0 = y \mid 1 \). Note that \( G_0
    = \{x > \sigma_0 \mid (\exists y > \tau_0)(\forall n)(\langle x \mid n, y \mid
    n \rangle \in T) \} \) is a nonempty \( \Sigma^1_1 \)-set. Assume by induction
    that for all \( i'' \le i \), a pair \( (\sigma_{i''}, \tau_{i''}) \in T \) and
