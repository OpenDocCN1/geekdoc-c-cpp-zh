    - **2. 函数名：** 现在我们可以处理函数名。完成后，你将能够为函数指定名称和参数。你还会得到所谓的函数签名。\n- **3. 参数：** 参数将仅作为一种占位符来处理。当你准备好调用某个函数时，只需将值赋给其中一个实参。这个值将被称为实参或实际参数。然后，参数列表可以指代发送给函数的实参的顺序、数量和类型。在少数情况下，可以完全使用不带这些参数的函数。\n\
    - **4. 函数体：** 最后，让我们看看函数体。它将包含一组适当的语句，告诉我们该函数能够做什么。既然说到这里，我们不妨也过一遍并处理所谓的函数重载。这意味着\
    \ C++ 语言将使我们能够在同一作用域内为一个函数名或某个运算符指定两个或更多定义。\n\n根据我们是对函数名还是运算符这样做，这将被称为运算符重载或函数重载。\n\
    \n重载声明只是与先前的声明同名且处于同一作用域内的声明。例外情况是，我们这里的两个声明都将具有不同的实参，并且彼此具有不同的定义和实现。当我们调用某个重载运算符或函数时，编译器将能够查看所有定义，并决定哪一个最适合使用。它通过比较用于调用该运算符或函数的各类实参来做到这一点，并且还可以处理定义中声明的参数类型。这是编译器必须处理的一个大型过程。好消息是，只要我们正确设置软件，每次都能看到正确的结果。\n\
    \n重载解析是识别最合适的重载函数的过程。如前所述，即使在同一作用域内，我们也可以为同一个函数提供多个定义。我们的函数定义必须在彼此之间有所不同，要么在于某个参数列表中所含参数的类型，要么在于参数的数量。请记住，如果唯一区别是返回类型，则不允许重载函数声明。\n\
    \n尽管一开始可能看起来很难，但使用这种函数重载其实相当简单。\n\n下面是一个很好的代码示例，我们可以用它来实现这一点；其中 `print()` 函数用于帮助我们打印出所有各种形式的数据。\n\
    \n```cpp\n#include <iostream>\nusing namespace std;\n\nclass printData {\n   public:\n\
    \      void print(int i) {\n         cout << \"Printing int: \" << i << endl;\n\
    \      }\n      void print(double f) {\n         cout << \"Printing float: \"\
    \ << f << endl;\n      }\n      void print(char* c) {\n         cout << \"Printing\
    \ character: \" << c << endl;\n      }\n};\n\nint main(void) {\n   printData pd;\n\
    \n   // Call print to print integer\n   pd.print(5);\n\n   // Call print to print\
    \ float\n   pd.print(500.263);\n\n   // Call print to print character\n   pd.print(\"\
    Hello C++\");\n\n   return 0;\n}\n```\n\n当我们完成编译并能够正确运行它时，它将根据我们提供给它的数据类型为我们提供一些结果。在处理\
    \ C++ 中的运算符重载时，我们可以使用类似的过程。我们可以继续重载或重写 C++ 语言中的若干内置运算符。\n\n因此，如果应用程序愿意，将允许其将运算符用于某些用户定义类型。为简单起见，重载运算符将是具有唯一名称的函数。通常，这将包含“operator”一词，后跟与你要在此指定的运算符相对应的符号。\n\
    \n你试图重载的运算符，与你正在使用的任何其他函数一样，将同时带有返回类型和参数列表。\n\n## 如何处理异常\n\n使用 C++ 语言所能完成的事情中，有一件很酷的事：它被设计用来管理异常之类的情况。这稍微困难一些，但你会对我们可与之配合使用的各种代码感到惊讶。\n\
    \n按照我们在此的定义，异常是当你准备运行程序时会出现的问题，表明程序将无法正确运行。\n\n当我们研究 C++ 中的异常时，我们会发现，这是对代码中不常见场景的响应，而这种场景通常会在我们执行并运行程序时出现。我们在代码和程序中最常看到的异常形式是有人试图除以零。异常将是代码中一个有价值的组成部分，因为它们将协助我们转移程序某一部分中存在的部分控制权，并确保将其转移到其他部分之一。\n\
    \nC++ 异常处理将基于一些核心关键字，即 try、throw 和 catch。让我们看看这些术语的含义，以便更好地理解它们为何重要以及我们可以用它们做什么：\n\
    \n- **1. throw：** 这些关键字中的第一个将被称为 throw。当问题发生时，软件将抛出异常。当我们使用 throw 关键字时，这将自动发生。\n\
    - **2. catch：** 程序将能够借助异常处理器检测到某个异常，这将允许程序自行处理一些问题。如果你使用 catch 关键字，则需要一些时间告知应用程序你希望它捕获该异常。\n\
    - **3. try：** 当我们准备使用 try 关键字时，我们会这样做，以帮助我们找到并识别将触发特定异常的代码块。\n\n如果你使用此关键字，它将至少包含一个\
    \ catch 块，以确保其正常工作。\n\n然后，我们将假设你当前的代码块可能抛出异常，并且某个方法将能够使用 catch 和 try 关键字的组合来捕获该异常。然后，这些内容将被包含在代码中，使其能够捕获异常并为你处理。这并不保证一定会发生异常，但如果可能发生，加入这些内容将确保代码继续按应有的方式运行。正如我们所看到的，许多不同的部分将汇集在一起，帮助我们构建\
    \ C++ 代码的基本语法。在此过程中，你可以根据需要尽可能多地使用这些部分，以确保编码正常工作，尽管你开始时的一些基础代码可能只需要其中一两个部分即可正常运行。学习这些基础知识以及如何正确编写程序，将在我们学习本手册以及进一步使用这门编程语言的过程中产生重大影响。\n"
