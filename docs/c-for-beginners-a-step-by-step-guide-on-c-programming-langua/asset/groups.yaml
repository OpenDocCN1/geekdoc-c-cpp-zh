    \ function. This will be a function from a base class that may be defined with\
    \ the \"virtual\" keyword, as we\n\non Amazon\n"
  mdcn: "\n\n## 继承类型\n\n既然说到这里，让我们更仔细地看看我们可以处理的继承类型。当我们首先尝试从某个基类派生一个类时，基类可以通过私有继承、保护继承或公有继承来继承。\n\
    \n我们之前讨论过的访问说明符，将用于指定你所使用的继承类型。现在你会看到，虽然私有继承或保护继承是可行的，但我们处理它们并不常见。只需注意，沿途可能会遇到一些难以处理的挑战。\n\
    \n公有继承是我们在这里最可能使用的技术。尽管公有选项将是我们最常处理的，但我们必须考虑在处理各种形式的继承时所适用的一些规则。\n\n在处理这一继承时我们必须记住的几条准则如下：\n\
    \n- **公有继承：** 当我们从公有基类派生新类时，基类（或原始类）中包含的公有成员会成为派生类的公有成员。我们基类中包含的保护成员随后会成为我们由此创建的某些派生类的保护成员。\n\
    \    - 我们会发现，基类中存在的私有成员永远不能直接从派生类访问。\n\n我们可以从这里访问它们。要做到这一点，我们只需调用基类的保护成员和公有成员。\n\
    \n- **保护继承：** 第二个选项是保护继承，我们可以处理它。当我们希望从保护基类派生新类时，基类的保护成员和公有成员将成为我们想要使用的派生类的保护成员。\n\
    - **私有继承：** 我们要看的最后一种继承是私有继承。当我们尝试从私有基类派生新类时，基类的保护成员和公有成员都会被转移到派生类中，但它们会被转换为一些私有成员。如我们所见，它们每一个都会与其他成员不同。\n\
    \n正是因为这个原因，我们必须谨慎对待我们将要使用的继承类型。如果你使用不同形式的继承，成员并不总是会按你希望的方式运作。检查你处于哪种情况，并确保它被设置为适当的类型，以便它按你希望的方式运作。\n\
    \n## 实现多重继承\n\n管理多重继承的概念，是我们考察 C++ 语言中可以执行的某些继承时要看的最后一项内容。这种语言中的一个类可以穿过并从多个类继承成员。我们可以用于这一点的扩展语法如下：\n\
    \n```cpp\nclass derived-class : access baseA, access baseB\n```\n\n我们可以检查这一点，并引入任意多个基类，但一定要只使用所需的那些，否则最终会变得一团糟。我们之前讨论过的适用于访问的限制，也同样适用于过程的这一阶段。其中访问权限为\
    \ private、protected 或 public 之一，并且为每个基类提供，它们也用逗号分隔，使用我们之前讨论过的相同语法。\n\n了解这些不同继承如何运作的一个好方法，同样是亲自试验它们。看看下面的代码，了解我们如何创建其中一种继承，或者至少基于几个不同的基类创建一个新的派生类：\n\
    \n```cpp\n#include <iostream>\nusing namespace std;\n// Base class Shape\nclass\
    \ Shape {\npublic:\n    void setWidth(int w) {\n        width = w;\n    }\n  \
    \  void setHeight(int h) {\n        height = h;\n    }\nprotected:\n    int width;\n\
    \    int height;\n};\n// Base class PaintCost\nclass PaintCost {\npublic:\n  \
    \  int getCost(int area) {\n        return area * 70;\n    }\n};\n// Derived class\n\
    class Rectangle: public Shape, public PaintCost {\npublic:\n    int getArea()\
    \ {\n        return (width * height);\n    }\n};\nint main(void) {\n    Rectangle\
    \ Rect;\n    int area;\n    Rect.setWidth(5);\n    Rect.setHeight(7);\n    area\
    \ = Rect.getArea();\n    // Print the area of the object.\n```\n\n它将用于激活该函数。\n\
    \n考虑以下示例，以理解所有这些多态在我们的代码中应如何运作。以下示例演示了如何从另外两个类生成一个基类：\n\n```cpp\n#include <iostream>\n\
    using namespace std;\nclass Shape {\nprotected:\n    int width, height;\npublic:\n\
    \    Shape( int a = 0, int b = 0){\n        width = a;\n        height = b;\n\
    \    }\n    int area() {\n        cout << \"Parent class area :\" << endl;\n \
    \       return 0;\n    }\n};\nclass Rectangle: public Shape {\npublic:\n    Rectangle(\
    \ int a = 0, int b = 0):Shape(a, b) { }\n    int area () {\n        cout << \"\
    Rectangle class area :\" << endl;\n        return (width * height);\n    }\n};\n\
    class Triangle: public Shape {\npublic:\n    Triangle( int a = 0, int b = 0):Shape(a,\
    \ b) { }\n    int area () {\n        cout << \"Triangle class area :\" << endl;\n\
    \        return (width * height / 2);\n    }\n};\n// Main function for the program\n\
    int main() {\n    Shape *shape;\n    Rectangle rec(10,7);\n    Triangle tri(10,5);\n\
    \    // store the address of Rectangle\n    shape = &rec;\n    // call rectangle\
    \ area.\n    shape->area();\n    // store the address of Triangle\n    shape =\
    \ &tri;\n    // call triangle area.\n    shape->area();\n    return 0;\n}\n```\n\
    \n当你完成编译上述代码并给它一些运行时间后，你应该会在那里看到父类面积的结果。然而，两部分都会保持空白。\n\n编译器会把对 area 函数的调用设置为基类中声明的版本，从而导致这种错误输出。这被称为函数调用的静态链接或静态解析。这对我们意味着，函数调用会在我们甚至开始使用软件之前就被修正。由于\
    \ area() 函数在程序编译期间就被确定，这也可能被称为早期绑定。然而，我们现在必须走另一条路，并对软件做一些小改动。在这种情况下，我们将在 Shape\
    \ 类中 area() 方法定义之前使用 virtual 关键字。\n\n这段代码将如下所示：\n\n```cpp\nclass Shape {\nprotected:\n\
    \    int width, height;\npublic:\n    Shape( int a = 0, int b = 0) {\n       \
    \ width = a;\n        height = b;\n    }\n    virtual int area() {\n        cout\
    \ << \"Parent class area :\" << endl;\n        return 0;\n    }\n};\n```\n\n一旦我们做出这个小改动、编译并再次运行代码，它将在过程中给我们略有不同的结果。相反，我们将获得\
    \ Triangle 类的面积和 Rectangle 类的面积。\n\n编译器将不再查看指针的类型，而是查看指针的内容。因为我们的 rec 和 tri 对象的地址将保存在\
    \ *shape 中，所以这里将调用我们函数的相应部分。如你所见，我们将要使用的每个子类都会有不同的 area 函数实现。我们通常能够以这种方式处理多态。你也可以创建多个具有相同函数名甚至相同参数的类，但要使这可行，你需要使用不同的实现。我们在这里还能做的另一件事是使用虚函数。这将是一个来自基类的函数，可以用\
    \ \"virtual\" 关键字定义，正如我们\n\n在亚马逊上\n\n"
