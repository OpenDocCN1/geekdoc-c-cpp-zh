    \n## 继承中的访问控制\n\n接下来要考虑的主题是访问控制与继承。\n\n派生类可以访问基类中除私有部分以外的所有内容。这意味着，基类中不应向派生类的所有成员函数开放的成员，应在基类中声明为私有。继续学习时你会发现，派生类可以继承基类的所有方法。\n\
