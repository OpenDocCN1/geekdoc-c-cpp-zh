    \n变量不会自行执行任何操作，它只会占用计算机 RAM 中的空间，用于我们在这里尝试完成的所有工作。\n\n你有责任给出必要的值，以便内存也能保存内容。与某个变量关联的值会存储在内存中与你的变量相同的位置。如果你愿意，还可以更进一步，在应用程序中给同一个变量赋多个值。只要格式正确，你可以给同一个变量添加任意多个这样的值。不过，我们应该尽量把每个变量对应的值数量保持在较低水平，比如一到两个，以便让代码尽可能容易处理。我们只需要使用等号，就能给你的某个变量赋予新值。\n\
    \n它的作用是通知编译器：当代码执行时，你的变量，或者说你在计算机内存中一直保留的那块空间，将属于那个确切的值。当程序运行期间稍后调用该变量时，它将返回你想要的值。\n\
    \n如你所见，C++ 中的变量并不难理解，但学会如何做到这一点至关重要，这样才能保证你的代码正常工作，并确保代码执行时，你想在代码中使用的所有值都会出现。\n\
    \n你可能会在很多场合希望引入能在 C++ 中运行的变量。它们在确保你能够真正在代码中存储所有想要的数据方面将非常重要。\n\n在这里，把一切设置好并准备就绪将至关重要，因此确保我们花时间以适当的方式处理变量，对于在此过程中看到我们想要的结果也同样至关重要。\n\
    \n## 第5章\n\n## 循环与数组\n\n现在该更深入地了解一些我们在编写 C++ 程序时可能会用到的编码内容了。当我们使用数组和循环进行操作时，确实可以编写出一些奇妙而多样的程序；因此，理解最佳做法以便按需要把这一切都掌控好，是至关重要的。\n\
    \n在本章中，我们将进一步了解在构建自己的 C++ 代码时可能会用到的两种流程，包括数组和循环，以及它们意味着什么、我们可以在代码中用它们做什么。\n\n\
    ```cpp\nfor (int i = 0; i < arr.size(); ++i) {\n    // Use if we explicitly need\
    \ the value of i\n    cout << i << \":\\t\" << arr[i] << endl;\n}\nfor (int element\
    \ : arr) {\n    // Modifying element will not affect the array\n    cout << element\
    \ << endl;\n}\nfor (int &element : arr) {\n    // Modifying element will affect\
    \ the array\n    cout << element << endl;\n}\n```\n\n### 数组\n\n数组是我们要看的第一个内容。数组是\
    \ C++ 中可用的数据结构之一，它允许我们存储本质上类型相同、固定大小也相同的项。它们本质上是我们希望处理的那种变量的集合。\n\n不过，与其逐一使用某些单独的变量来完成任务，你需要处理单个数组，比如一个整数数组。要让这些数组发挥作用，你需要使用\
    \ 0 到 99 的整数，然后就可以通过数组的索引访问每一个元素。不过，处理不只是与数字有关的数组也是可行的。\n\n如果愿意，我们也可以使用同时用于字符和单词的数组。数组将与我们之前讨论过的一些变量类似，因为它们表示计算机内存中的位置。不过，它们会比变量所能提供的更加连续。第一个元素被称为最低元素，最后一个元素被称为最高元素。在处理这些数组时，你确实有几种不同的选择。你可以逐一初始化它们，也可以使用单条语句来处理。\n\
    \n下面是一个很好的示例，说明如何实现这一点：\n\n```cpp\ndouble arr[5] = {1000.0, 2.0, 3.4, 17.0, 50.0};\n\
    ```\n\n我们在括号中填入的数字绝不应超过要使用的元素数量。\n\n这意味着，如果你像上面那样在括号中填入 5，然后向其中放入六个数字\n\nwhile\
    \ 循环是我们这里要看的第一个循环。while 循环是一种只要满足你指定的要求，就会继续我们的循环并重复相应行的选项。程序每次运行该循环时，都会读取信息，然后测试该条件。如果循环检测到条件已满足，它就会继续。如果循环到达条件不再成立的程度，它就会停止，并且如果你的程序还有更多内容，就会转到下一段代码。考虑到这一点，while\
    \ 循环处理起来将轻而易举。要创建一个基本的 while 循环，只需要几行代码。我们可以用来操作 while 循环的语法如下：\n\n```cpp\nwhile\
    \ (condition) {\n    statement(s);\n}\n```\n\n### for 循环\n\n现在该继续介绍我们可以使用的第二种循环形式，即“for\
    \ 循环”。\n\n这种 for 循环只有在首先确保条件满足之后，才会重复自身。我们上面创建的 while 循环会先循环一遍，然后测试条件。\n\n循环会先测试条件，然后循环继续。这意味着，根据提供给计算机或软件的输入，程序可能会测试条件、判定其为假，而“for\
    \ 循环”在程序中甚至一次都不会发生。如果你编写的程序要求循环至少发生一次，那么 while 循环就是正确选择。\n\n如果它不那么关键，或者如果条件不满足时循环不运行、代码也没问题，那么\
    \ for 循环可能是个不错的选择。如果你正在处理一个程序，并决定“for 循环”对你来说是最佳选择，那么你需要继续编写一些代码来实现它。它与我们之前执行的\
    \ while 循环类似，所以总体上会更容易管理。\n\n必须使用以下代码来让“for 循环”正确运行：\n\n```cpp\nfor (initialization;\
    \ condition; increment) {\n    statement(s);\n}\n```\n\n### do-while 循环\n\n第三种循环形式很独特，它在\
    \ C++ 语言中运行良好，但在你沿途可能处理的其他一些编码语言中并没有那么广泛的文档记载。使用它会非常有趣，所以我们会在这里花些时间看看它。\n\ndo-while\
    \ 循环略有不同，但你会看到它与正在处理的 while 语句有一些相似之处。不过，它的不同之处在于，它能够等到语句结束时才检查条件，而不是从一开始就检查。这使它在你要构建的软件中表现得有些不同。\n\
    \n我们可以用来写出 do-while 循环的语法如下：\n\n```cpp\ndo {\n    statement(s);\n} while (condition);\n\
    ```\n\n### 嵌套循环\n\n嵌套循环是列表中我们需要在这里关注的下一项。\n\n这些会比我们这里做过的一些先前循环稍微复杂一些，但它们会很有帮助，能帮助我们在短时间内完成很多事情。\n\
    \n嵌套循环发生在一个循环运行在另一个循环内部时，并且这两个循环会同时继续运行，直到它们的条件都得到满足，此时它们\n"
