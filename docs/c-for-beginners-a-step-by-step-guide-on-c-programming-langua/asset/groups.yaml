    \ C++ 程序中。有些运算符会频繁使用，例如在处理变量并为其赋值时使用的等号。\n\n还有一些上述运算符并不常用，在编程水平提高不少之前，你可能不太会用到它们。\n\
    \n不过，大多数时候你会使用的赋值运算符是等号。它允许我们为要处理的变量赋予正确的值，但有时我们也会使用其他赋值运算符来帮助推进代码的编写。\n\n## 关系运算符\n\
    \n关系运算符是我们接下来需要了解的内容。\n\n它们与我们之前讨论的一些其他选项略有不同，但可以帮助我们检查沿途需要处理的其他一些情况。\n\n关系运算符包括以下几种：\n\
    \n- **(==)：**用于判断两个操作数是否相等的运算符。\n\n  如果它们相等，则条件成立。\n\n- **(>)：**用于比较操作数值的运算符。\n\
    \n  如果左侧操作数大于右侧操作数，则条件为真。\n\n如果输入满足你提供的要求，就会返回相应的结果。还有一些条件语句可以包含一系列备选回复，并根据用户提供的信息选择最合适的回复。我们还可以使用第三种形式的条件语句，以菜单形式列出用户可以选择的所有选项，然后根据用户的选择返回相应结果。这些只是我们可以通过决策控制语句完成的部分任务。考虑到这一点，下面让我们来了解使用这些条件表达式时有哪些选择。\n\
    \n## Switch 语句及其用法\n\n我们首先要讨论的条件语句称为 switch 语句。它们很有用，因为可以帮助我们检查变量是否相等，并将变量与代码中设置的\
    \ case 值进行比较。要验证的变量会与多个情形进行比较，以确定是否匹配。这比乍看起来要简单，让我们来看看 switch 语句可以使用的语法：\n\n```cpp\n\
    switch (expression) {\n    case constant-expression:\n        statement(s);\n\
    \        break; // 可选\n    case constant-expression:\n        statement(s);\n\
    \        break; // 可选\n    // 可以包含任意数量的 case 语句\n    default:\n        statement(s);\n\
    }\n```\n\n使用 switch 语句时，我们必须遵循一些规则，以确保它们在代码中正常运行。首先，switch 语句中的表达式必须是整数类型或枚举类型。此外，它也可以是具有转换函数的类的成员。好在\
    \ C++ 语言对上述语法中可以添加的 case 语句数量没有限制，因此你可以根据代码需要，让 switch 语句变长或变短。需要记住的重要一点是，所有值的后面都必须加上冒号，代码才能正常运行。变量找到与自身相等的值后，会继续执行，直到遇到\
    \ break 语句。找到 break 语句后，switch 就会停止执行，程序控制流也会继续进入代码的下一部分。如果不需要，可以不在每个 case 中都添加\
    \ break 语句。如果忘记添加或决定不添加，控制流就会继续执行下一部分。\n\n# 第 8 章\n\n## 继承\n\n![](img/07ace230f2e8f42cdd9a921c63a03aa7_37_0.png)\n\
    \n接下来我们要讨论继承。继承比本手册中的一些其他内容更复杂一些，但现在你已经准备好迎接挑战，真正学习更难的内容。了解继承后，我们就能看到之前讨论过的面向对象编程语言（OOP）的许多优点，并能够重用我们想要使用的代码片段。继承是面向对象编程中最重要的概念之一。它使我们能够根据另一个类的定义来创建一个类。这很有用，因为它让我们更容易构建和管理想要开发的应用程序。继承还有助于重用代码功能，从而比以往更快地完成实现。程序员不必每次创建类时都重新编写数据成员和函数成员，而可以指定新类继承代码中已有类的成员。这比在编写代码时一遍又一遍地重新定义成员和函数方便得多。我们工作的基础类，或已有的类，称为基类。我们尝试构建的新类称为派生类，它会从基类中获取信息、数据或函数。继承概念体现了“是一个”（is\
    \ a）关系。例如，哺乳动物是一种动物；狗是哺乳动物，因此狗也是一种动物。这能简化我们处理问题的方法，同时帮助我们清楚地了解接下来要做的事情。\n\n```cpp\n\
    void setHeight(int h) {\n    height = h;\n}\n\nprotected:\nint width;\nint height;\n\
