  md: '# # C++''s Brief History


    ![](img/07ace230f2e8f42cdd9a921c63a03aa7_6_0.png)


    The next thing we need to look at is some of the histories that come with C++.
    Because it was one of the original coding languages, this will be a coding language
    with a long and illustrious history. It began before anything was understood about
    computer programming in the first place, and long before individuals considered
    doing this for a job. Consider the year 1979, when activities like telephone hacking
    were becoming popular. That is how far back we must go to understand the origins
    of this coding language.


    And you''ll see that there aren''t many other programming languages that are still
    in use that can be traced back this far.


    Bjarne Stroustrup was working on his doctoral thesis at the time, and he chose
    to use the Simula programming language. This is one of the earliest programming
    languages used in the computer era. However, it was very sluggish and riddled
    with errors.


    Stroustrup devised the concept of C with Classes. A much quicker programming language
    than Simula. C with classes evolved into Cfront, which accelerated the process
    of designing a language.


    Cfront, on the other hand, was left in the dust when C++ arrived, since it had
    compilers in the language, making it far simpler and quicker to use than any other
    project language at the time.


    Since then, there have been annotated reference manuals and language modifications
    to make it better, quicker, and simpler to use. C++ for Dummies is a popular introduction
    to the language.


    C++ is one of the most popular coding languages available today. This language
    is going to be the best to use for a lot of industries, so rather than of spending
    the time and effort to create a new language to use, they opt to use C++ and then
    modify it to some of the various sections and projects they want to undertake
    because of its adaptability.


