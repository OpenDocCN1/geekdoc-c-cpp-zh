  md: '**4. Body of function:** Finally, let''s have a look at the function body.
    This will have a decent collection of statements that will inform us what the
    function is capable of doing. While we''re here, we may as well go through this
    and deal with something called function overloading. This implies that the C++
    language will enable us to assign two or more definitions to the name of a function
    or one of our operators inside the same score.


    Depending on which one we do this too, this will be termed as operator overloading
    or function overloading.


    An overloaded declaration is just one that is declared with the same name as the
    previous declaration, as long as they are in the same scope. The exception to
    this is that both of the declarations we have here will be from distinct arguments
    and will have different definitions and implementations from one another. When
    we call one of the overloaded operators or functions, the compiler will be able
    to look at all of the definitions and decide which one is the best to utilize.
    It does this by comparing the various kinds of arguments used to invoke the operator
    or function, and it can also operate with the types of parameters stated in the
    definitions. This is a large procedure that the compiler will have to deal with.
    The good news is that we will be able to see the correct results each time, as
    long as we set up the software correctly.


    Overload resolution is the process of identifying the most suitable function that
    has been overloaded. As previously stated, we may go through and have many definitions
    for the same function even though we are using the same scope. Our function definitions
    must vary from one another, either in terms of the type or the number of parameters
    present in one of our lists of arguments. Remember that overloading the declaration
    of our function is not permitted if the only difference is the return type.


    Even though it may seem to be tough at first, working with this overloading of
    functions is rather simple.


    A nice example of the code that we can use to make this happen is seen below,
    where the print() function is used to assist us to print out all of the various
    forms of data.


    ```

    ```

    #include iostream> from the namespace std; class void printData public: void print
    (int i) cout

    "Printing int: " I endl; void print (double f) cout "Printing float: " f endl;
    void print(char* c) cout

    "Printing character: " c endl; int main(void) printData pd; / Call print to print
    integer pd.print(5);

    / Call print to print float pd.print(500.263); / Call print to print character
    pd.print(500.263);

    return 0; pd.print("Hello C++");

    ```

    ```


