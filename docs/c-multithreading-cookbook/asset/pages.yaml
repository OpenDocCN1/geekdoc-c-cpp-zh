    \ the thread to read or write in the same time as another thread performing a\
    \ read or write operation. We assumed that two of our three threads have to read,\
    \ the third one has to write certain data. You could assume that after reading,\
    \ the thread has to signal the main application or some other handler with the\
    \ data, to continue processing. The same stands for the thread that has to write-it\
    \ would obtain data from some handler and perform the necessary operation. For\
    \ thread synchronization, we were using a critical section object. A detailed\
    \ explanation of a critical section object will be presented in Chapter 5, Managing\
    \ Threads.\n\n# There's more...\n\nAs we said, there was another, easier way to\
    \ synchronize threads while they operate over the MySQL database. With today's\
    \ MySQLDBMS, we can achieve this using table locking. To give a hint to the user,\
    \ we will demonstrate one way of performing query from two threads but at the\
    \ same time to retain synchronized read and write operations, without interference\
    \ from one another.\n\n+   1. Read thread:\n   lock table TABLE_NAME read;\n \
    \  select something from TABLE_NAME;\n   unlock tables;\n\n+   2. Write thread:\n\
    \   lock table TABLE_NAME write;\n   insert into TABLE_NAME values( _ );"
