- pgno: 323
  md: '# 7

    Understanding Concurrent Code Design


    In this chapter, we will cover the following topics:


    +   * How to design parallel applications

    * Understanding parallelism in code design

    * Turning on to a parallel approach

    * Improving the performance factors


    # Introduction


    Even though synchronization and time are significant factors in developing parallel
    applications, adding concurrency to programs brings many additional concerns.


    Parallel programming can be a sword with two edges: you can do great things with
    it, such as scaling a program to be executed over up-to-date modern multicore
    processors. Furthermore, parallelism presents great software capabilities you
    can develop a responsive and rich user interface in GUI applications. However,
    you must still be aware of the fact that if parallelism is used incorrectly, it
    can cause serious performance issues.


    Poorly designed parallel programs have worse performance compared to sequential
    programs because of the overhead that occurs on the CPU while it reschedules the
    threads for execution, fetches the memory blocks, sets the signaled state on a
    synchronization object, maintains protection, and so on.'
  merge: -1
  img_proc: true
- pgno: 324
  md: '# Understanding Concurrent Code Design


    In this chapter, we will explain the parallel approach when creating applications,
    but before

    do, first, we need to remind the user about sequential execution.


    The sequential programming approach is very important to the life cycle of the
    application,

    because the algorithm that the program will must determine the exact steps that
    the

    application (thread) must execute. Even in parallel applications, it is very important
    that you

    choose the correct sequential approach, as much optimized as possible, and then
    move on

    to parallelization.


    Here, we will try to find solutions on how to avoid such situations as well as
    the examples,

    which demonstrate the correct usage of parallelism.


    # How to design parallel applications


    In order to prevent problematic situations, we need to first identify the possible
    scenarios.

    We divide problems related to concurrency into two major categories:


    +   - Correctness problems: These can cause a program to produce incorrect results

    - Liveness problems: These can cause a program to stop producing results completely


    Correctness problems are very hard to discover because of the nature of the concurrency\itself.
    Since each thread takes a different execution path, these situations can occur
    at any

    point of time without the programmer realizing that the program''s output is incorrect,
    and

    some went wrong. In the worst case, we can run such a program many times with
    the

    correct results before a scenario occurs where, for example, different parameters
    can lead

    to a situation that produce incorrect results.


    One of these scenarios could be a Data Race—where the relation between the program
    state

    and the control flow must not be violated, or else your application will produce
    an incorrect

    result. Let''s review the following situation:


    ```

    int iValue = 5;

    int iaValue = iValue;

    ...

    int ibValue = iValue;

    ```


    If more than one thread is accessing a shared object, iValue, we must add some
    kind of

    currency safety, such as exclusive access or data synchronization, in order to
    prevent

    unwanted unsafe scenarios and, at the same time, incorrect results as well.


    In these situations, we must properly decide what we need to synchronize and what
    are the

    most preferable objects or techniques for this task.'
