  md: "# How it works...\n\nWe are presenting event usage and we've removed posting\
    \ messages to the main window message queue. There is an advantage to this. We're\
    \ independent of whether or not the application has a window. However, there is\
    \ a down side. As the working thread fires an event (like a routine), all manipulation\
    \ with UI elements, such as changing the value of the progress bar or label text,\
    \ must be done by invoking a proper method. We intentionally created an example\
    \ like this only to point out the cross-thread operations. This is very important\
    \ to understand before doing anything asynchronously in .NET, which involves UI\
    \ controls manipulation. Let's review the code. The MyForm constructor is invoked\
    \ in a way that the first six lines of code are creating new instances of events\
    \ and delegates. We've declared delegates to base attributes instead of locally-declared\
    \ variables because more than one method will use them. We've added a static void\
    \ that will be called on the EndTask EventHandler. And finally, inside the StartAddress\
    \ method, instead of using the PostMessage API, we are raising an event to the\
    \ user if they want to continue. So, by following a slightly different approach,\
    \ we're using EAP in the way, which the .NET framework provides.\n\n# There's\
    \ more...\n\nIn order to understand the built EAP, we'll give an example of the\
    \ WebClient::DownloadDataAsync method:\n\n```\nString szUrl = \"http://cplplus.expert.its.me/testfile.txt\"\
    ;\nWebClient* client = gcnew WebClient();\nclient->DownloadDataCompleted += \n\
    gnew DownloadDataCompletedEventHandler(\n&MyForm::AsyncDownloadDataCompleted);\n\
    client->DownloadDataAsync(gcnew Uri(szUrl));\n\nstatic void AsyncDownloadDataCompleted(Object*\
    \ sender,\nDownloadDataCompletedEventArgs* e)\n{\n    String szResult;\nSystem::Text::Encoding*\
    \ enc = System::Text::Encoding::UTF8;\nszResult = enc->GetString(e->Result);\n\
    \nif (e->Error == nullptr\n&& String::IsNullOrEmpty(szResult))\n{\n    System::IO::File::WriteAllText(\n\
    L\"C:\\\\testfile.txt\", szResult);\nMessageBox::Show(\"L Download commplete.\"\
    );\n}\n}\n```"
