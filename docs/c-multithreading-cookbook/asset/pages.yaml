- pgno: 151
  md: '# Chapter 3


    The automatic reset event always releases only one thread at each signal before
    resetting. It could be useful for a program where the main thread prepares for
    other working threads. Each time a new set of data is ready, the main thread sets
    the event and the working threads are released. Other threads remain waiting in
    a queue to get a new task.


    In addition to setting and resetting, the event can be pulsed. A pulse sets a
    signal for a very short time and then turns it off. When you pulse a manual reset
    event, we allow all the threads that are waiting to continue, and then the event
    is reset. Pulsing an automatic event allows only one thread that is waiting to
    pass, and resets the event. If no thread is waiting, neither will pass. Setting
    an automatic event, on the other hand, will cause the event to leave its signal
    while a thread is waiting. As soon as one thread passes, the event resets.


    The following are the routines for event usage. To create or open an event object,
    you can use CreateEvent or CreateEventEx:


    ```

    HANDLE WINAPI CreateEvent(

    SECURITY_ATTRIBUTES lpEventAttributes,

    BOOL                bManualReset,

    BOOL                bInitialState,

    LPCTSTR            szName,

    );

    HANDLE WINAPI CreateEventEx(

    SECURITY_ATTRIBUTES lpEventAttributes,

    LPCTSTR            szName,

    DWORD               dwFlags,

    DWORD               dwDesiredAccess

    );

    ```


    For the CreateEvent API, you can set the security attributes or leave it for the
    default values. The bManualReset parameter is set to TRUE, ResetEvent must be
    used to set the state to nonsignaled. The bInitialState sets the state of an event.
    If the value is set to TRUE, the object is set to the signaled state immediately.
    The event must be supplied.


    On the other hand, CreateEventEx pretty much the same way, only its terminology
    is different. Apart from the attributes, which are the same, you need to supply
    the name and value for dwFlags, which have defined macros for the initial set
    and manual reset event types: CREATE_EVENT_INITIAL_SET and CREATE_EVENT_MANUAL_RESET.
    The only real difference is that dwDesiredAccess can set the access mask for the
    event object. For a complete list of Synchronization Object Security and Access
    Rights, refer to MSDN http://msdn.microsoft.com/en-us/windows/desktop/ms68660%28v=vs.859.aspx.


    ![](img/412b0f5bbb36adcce2ddd2d5b7416516_151_0.png)'
