- pgno: 382
  md: '# Advanced Thread Management


    In the CThreadPool class, we include an additional header file called Wct.h. We
    also add the Advapi32 library in order to use the API that related to the thread-wait
    chains, which we''ll explain below. The CThreadPool class has four attributes:
    a handle to the hProblemSolver thread that will occasionally check for potential
    problems; the hEvent handle to manually reset the exit, used for alerting the
    problem solver to exit; the threadlist pointer to the list of items; and dwMaxCount
    for the maximum number of threads that can be managed by it. The class implements
    two constructors: the first where the thread count is set by default using the
    number of machine processors that the pool can instantiate. The second constructor
    takes one argument--the actual number of threads that the pool can manage. Both
    constructors implement the InitializePool method that creates the message queue
    for the dispatcher, also create an event, a problem solver, and a new list of
    threads. In the destructor, we first set the event to the signaled state and wait
    for MAX_WAIT_TIME for the problem solver to safe exit. If the time has passed
    without thread completion, we close both handles and wait for the RemoveAll method
    to finish the execution of the thread properly. Finally we clear theMessage queue.


    The Count method returns the count of the items in the list. The RemoveThread
    method searches for the thread specified by dwThreadId and if found, removes it.
    The WaitAll method creates an array of threads that will be used in the WaitForMultipleObjects
    API specifying TRUS for the BOOL bWait parameter in order to wait for all threads
    to finish their tasks. After WaitForMultipleObjects returns the list using the
    RemoveAll method for each thread. The MaxCount method returns a reference to the
    dwMaxCount attribute in order to get or set its value. Again, the pool size can
    be increased or decreased if necessary. The ReleaseThread method searches for
    the thread specified by the dwThreadId parameter and if found, terminates the
    thread.


    The RequestThread method is used for obtaining free thread. If the number of threads
    is not reached, the method creates a new item and inserts it into the list. If
    the maximum number of threads is reached, RequestThread iterates through the entire
    list and queries the code for each. If all threads are still active, the dispatcher
    blocks using the GetMessage until an available worker thread posts the message.
    We then search for the thread using the passed thread ID and if found, we remove
    it and create a new thread with the start address provided by the user. The ProblemSolver
    method is used as a monitoring thread for the thread pool.


    As shown in the following diagram, it that the problem solver is another thread
    executing in parallel:


    ![](img/412b0f5bbb36adcce2ddd2d5b7416516_382_0.png)


    368'
