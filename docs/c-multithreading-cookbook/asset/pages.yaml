  md: "# Event-based Asynchronous Pattern\n\nMicrosoft .NET provides Event-based Asynchronous\
    \ Pattern (EAP), which offers multithreading capability without the need for a\
    \ programmer to explicitly create or start a thread or task. Such classes are\
    \ BackgroundWorker or WebClient. We'll focus on BackgroundWorker later in detail.\
    \ Now, we simply point out the features of WebClient and will expand our factorial\
    \ example to use an event instead of posting messages.\n\nThe managed WebClient\
    \ class, among others, provides methods for downloading data in synchronous and\
    \ asynchronous execution. Our interest is in asynchronous methods.\n\n```\n[HostProtectionAttribute(SecurityAction::LinkDemand,\
    \ ExternalThreading\\n=true)]\npublic: void DownloadDataAsync(Uri address )\n\
    public: void DownloadDataAsync(Uri address, Object^ userToken)\npublic: event\
    \ DownloadDataCompletedEventHandler^ DownloadDataCompleted\n{\n\tvoid add (DownloadDataCompletedEventHandler^\
    \ value);\n\tvoid remove (DownloadDataCompletedEventHandler^ value);\n}\n```\n\
    \nThe idea behind the asynchronous approach is that these methods create a new\
    \ thread to execute the download, while the developer needs to register event\
    \ notifications, or in other words, it must provide a method that will be called\
    \ on completion of the operation.\n\nWe'll do something similar with our factorial\
    \ example. We'll create an event that will fire when the calculation is over in\
    \ order to ask the user whether they want to repeat the operation. Earlier, we've\
    \ accomplished this by posting messages to the main thread window message queue,\
    \ but it is not always possible to do that. What if we create a console application?\
    \ We would not have a window there and can't use the window message queue. That's\
    \ why it's important to understand the mechanism of the event detail.\n\n# Getting\
    \ ready\n\nMake sure Visual Studio is up and running.\n\n# How to do it...\n\n\
    Now, let's create our program and explain its structure. Perform the following\
    \ steps:\n\n+   1. Create a new C++ CLR project application named CLRAApplication."
