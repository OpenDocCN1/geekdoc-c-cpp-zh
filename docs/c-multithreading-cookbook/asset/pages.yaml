  md: '# Chapter 6


    Adding safety to your application usually means surrounding all exclusive access
    with locks, but at the same time, you should be aware of the fact that exclusion
    means waiting between threads, which results in spending a lot of time, and could
    potentially lead to a deadlock. Once, a proper application design is needed before
    you actually start coding anything. Furthermore, in Chapter 7, Understanding Concurrent
    Code Design, we will thoroughly explain how to properly think and design an application
    in a way that you avoid all potentially dangerous situations and known problems
    with respect to the task itself.


    # Signaling with event wait handles


    In the Understanding .NET synchronization recipes, we used an unsafe way to access
    the bContinue shared object, and we used the Sleep method to release the processor
    for one second waiting for the user to make a choice between continuing and exiting
    the application. Later, in the Locking and avoiding deadlocks recipe, we improved
    our application to be thread-safe -by adding locks to ensure exclusive access—again
    with the Sleep method inside the loop. The Microsoft .NET framework provides signaling
    objects that are most similar to Event, which we have explained in the previous
    chapters. Those are the AutoResetEvent, ManualResetEvent,ManualResetSlim, CountDownEvent,
    Barrier, and Wait Pulse methods.


    We choose to use ManualResetSlim in our example due to its extremely small overhead
    -around 40 nanoseconds. We will now remove the Lock class and the shared object—it''s
    no longer needed. When the working thread completes the calculation for the first
    time, it will notify the main thread of the completion of the operation and will
    call the ManualResetSlim:Wait method to suspend execution. Later, if the user
    chooses to continue the calculation, we''ll simply set the event object, which
    will signal the thread to continue execution.


    # Getting ready


    Make sure Visual Studio is up and running.


