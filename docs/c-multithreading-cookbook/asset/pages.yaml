- pgno: 60
  md: '# The Concepts of Process and Thread


    Operating systems over the years have evolved to a sequential conceptual model
    (sequential processes) where all the runnable software on the computer, including
    the operating system, is represented as a set of sequential processes. A process
    is an instance of an executing program. Each process has its own virtual address
    space and a thread of control. Thread is the basic unit for which Scheduler (operating
    system) allocates processor time. We can think of a system as a collection of
    processes running in a quasi-parallel environment. Rapid switching between processes
    (programs), back and forth, is called multitasking.


    # Processes and threads


    In the following figure, we see a single CPU multitasking system with four programs
    scheduled for execution:


    ![](img/412b0f5bbb36adcce2ddd2d5b7416516_60_0.png)


    In the following figure, we have a multicore CPU multitasking system with four
    executing processes, each one with its own control flow and each one running independently
    of the other ones:


    ![](img/412b0f5bbb36adcce2ddd2d5b7416516_60_1.png)


    In the following figure, we see that over a time interval, processes have made
    progress, but at any instant of time, only one process can run on one CPU core:'
