  md: '# Managing Threads


    # How it works...


    The CThread class is an abstract class with a virtual member function, Run. It''s
    not meant to be used as is; it must be derived first. We will explain it thoroughly.
    First, we will declare the CClock for synchronized execution when needed. Implementation
    follows in the CThread.cpp file. In the CLock constructor, we will try to create
    a mutex, or pass an existing one. If a mutex is created, the thread that it creates
    is passed as the parameter of a call to the CreateMutex API. A thread that has
    a mutex ownership must request it by calling the WaitForEach function. If it is
    held by another thread, the thread will be blocked, and will wait until the mutex
    is released. After the operation is completed, CLock is released and its destructor
    is called. In the CClock destructor, a mutex is released and the handler is closed.


    For the CThread class, we have defined the following seven macros for the thread
    states and methods:


    +   - STATE_RUNNING: This sets the running flag. It means that the thread is running.

    - STATE_READY: This sets the ready flag. It means that the thread is joining the
    caller.

    - STATE_BLOCKED: This sets the blocked flag. It means that the thread is suspended.

    - STATE_ALIVE: This sets the alive flag. It means that the thread is created.

    - STATE_ASYNC: This sets the async flag. It means that the thread will perform
    execution concurrently—in other words, the caller will not block until the thread
    returns.

    - STATE_SYNC: This sets the sync flag. It means that the thread will not perform
    the execution concurrently—in other words, the caller will block until the thread
    returns.

    - STATE_CONTINUOUS: This sets the forever flag. It means that the thread will
    have to do some continuous work that will never stop, or at least until the process
    exit.


    The CThread constructor implementation is simple enough; we only need to set the
    attribute''s value to zero. The Create method creates the actual thread. The first
    argument, lpParameter, must be provided and will later be passed to the thread,
    StartAddress, where it will begin execution. The second parameter, dwAsyncState,
    represents the thread execution method. The parameter is, by default, passed with
    the STATE_ASYNC value, but the user can change it to STATE_SYNC, STATE_CONTINUOUS,
    or both if necessary. If STATE_SYNC is set, the CLock object is used. The third
    parameter dwCreationFlag sets the thread state to zero by default. This means
    that the thread will start its execution immediately after creation. It is possible
    to create a thread in a suspended state by providing the STATE_BLOCKED flag, which
    is equivalent to CREATE_SUSPENDED, the STATE_CONTINUOUS flag if the STATE_CONTINUOUS
    is set, the event object is created, or if it already exists, the event object
    is opened. This flag is for stopping the thread that has run some continuous task
    in a normal manner, without terminating it on process exit.


