  md: "# Thread Synchronization and Concurrent Operations\n\n# How it works...\n\n\
    In the file main.h we have defined the QueueElement structure in order to load\
    \ each group\nof coordinates to the queue easily. In main.cpp, we have declared\
    \ a few global variables:\nsFilePath for the file that the user will select; szResult\
    \ represents the mutex for displaying messages upon\ncalculation; queue for the\
    \ actual queue; and szMutex for synchronization. At the application entry point\
    \ (WinMain), we initialize and create the window,\n the hLabel control, which\
    \ we will use for displaying the messages about user interaction;\nh hResult control,\
    \ which threads will use for displaying the calculation results; the hStart control,\
    \ which the user\n use in order to select the file; and the hProgress control,\
    \ which the application will use to display\nthe calculation progress.\n\nBefore\
    \ the main thread enters the loop, it will create a mutex object. When the user\n\
    licks on Browse, we will display the Open dialog box for the user to choose the\
    \ actual\nWhen the user clicks the Start button, we will check if the file was\
    \ previously selected.\nIf so, we will read one line at a time and initialize\
    \ the QueueElement object.\nThe QueueElement object expects coordinates, and provides\
    \ the handles to the progress\ncontrol and the result control. These handles will\
    \ be used by the threads in order to display\nthe calculation and the result properly.\n\
    \nAs we said many times before, proper application design leads to getting adequate\
    \ results\nand reduces the possibility of errors and bugs. The first question\
    \ that we need to take care of\nof how many threads can we start? The next question\
    \ would be what areas of the code do we\need to protect from simultaneous access?\
    \ Or for what statements do we need to acquire\nexclusive access? The answer to\
    \ first question would be: if we have less concurrent tasks to\nexecute than there\
    \ are tasks. However, the user can provide a file with an unlimited number of\
    \ lines with coordinates.\nIf more than the number of available processors are\
    \ provided, the system won't perform\nso well, and our application won't have\
    \ the best performance. So when we load all the objects\nto the queue, we will\
    \ limit the number of threads in a way not to exceed the available number of processors.\
    \ Then,\nas shown in the following code:\n\n```\nSYSTEM_Info sysInfo;\nGetSysInfo(&sysInfo);\n\
    \nfor (DWORD dwIndex = 0; dwIndex < sysInfo.NumberOfProcessors;\ndIndex++)\n{\n\
    \    HANDLE hThread = CreateThread(NULL, 0, (LPTHREAD_START_ROUTINE)\nStartAddress,\
    \ &queue, 0, NULL);\n    SetThreadIdealProcessor(hThread, dwIndex);\n```\n\n186"
