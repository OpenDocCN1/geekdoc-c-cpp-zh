- pgno: 406
  md: '# Appendix


    Now, you can compile and run the test DriverApp. Note that if you''re using a
    64-bit operating system, starting a digitally-unsigned driver is not possible,
    until you make changes to Advanced Boot Options; Vista and the later versions
    of Windows support the F8 Advanced Boot Option, that is, Disable Driver Signature
    Enforcement, which disables the load-time signature enforcement for a kernel-mode
    driver for the current session system. This does not persist across system restarts
    (from MSDN). For more information on this, http://microsoft.com/en-us/library/windows/hardware/ff57565(v=vs.85).aspx.


    # Using the DebugView application


    In order to display the output from the driver, you''ll need to use the DebugView
    application. Perform the following operations:


    +   1. Open your web browser and navigate to http://technet.microsoft.com/en-us/internals/bb96647.aspx.
    Download the DebugView ZIP file and extract it to a folder. Run the DebugView
    application and, from the menu, select Capture. Add a tick to Capture Kernel or
    press Ctrl + K.


    ![](img/412b0f5bbb36adcce2ddd2d5b7416516_406_0.png)


    +   2. Now, if you run your KernelDriver project, you will see the output from
    the driver, using DebugView.


