    By creating a separate thread, we are dividing the execution or operation that
    we need to perform on separate entities, which may (or not) be executed concurrently.
    We intentionally mentioned may or may not, we can run a separate thread asynchronously
    without blocking the caller (creator), or synchronously when the caller is blocked
    (waiting) for the calling thread to complete operation (we often say return).
    Each time we need to perform a concurrent task, we may need to split the execution
    in order to execute these independent operations concurrently. We can achieve
    this by creating a separate thread.


    With any other task, threads are not meant to run forever. When a thread is created,
    its StartAddress must be provided. Start is a pointer to the user-defined routine
    where the thread will start its execution. When the routine terminates. The StartAddress
    example is as follows:


    ```

    DWORD WINAPI StartAddress(

    LPVOID Parameter

    );

    ```


    A thread can be terminated by force, using Win32 APIs TermThread. This is not
    the correct way to terminate a thread, and should be used only when it''s absolutely
    necessary. This is because the operating system will not release the resources
    used by the thread properly.


    When a thread is terminated, the resources held by the thread are released and
    the thread''s exit code is set. The thread object is signaled due to its termination,
    and the process is terminated if it was the only thread in the process.


    By forcefully terminating the thread, we may run into problems such as not freeing
    the memory stack, or not cleaning up the resources, and not informing the attached
    DLLs. The handles held by the thread are also not closed.


    There are many situations when threads need to cooperate with each other. For
    example, if thread A needs some output data from thread B (user or similar), we
    say that thread A needs to wait for thread B. When thread A needs to wait for
    thread B, we say that thread B needs to join thread A. This term is used when
    one execution can continue until another completes.


    # Processes versus threads


    It is very important to decide when to use processes and when to use threads.
    One thing that we must be aware of is that a process must have a file loaded from
    a disk, We must understand that a process is the complete entity which needs to
    be prepared and properly used. One more thing about a process is that its creation
    utilizes a lot of system resources, so you should use processes only when you
    need them.'
