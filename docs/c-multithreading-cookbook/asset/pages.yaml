- pgno: 325
  md: "Another scenario could be Inconsistent Synchronization, where it is not enough\
    \ to secure the object using some kind of protection. Hence, it is imperative\
    \ to use the same kind of protection for all objects that will access the object.\
    \ In the following code, pay attention to the funcA and funcB methods where a\
    \ lock is declared with a different synchronization object:\n\n```\nclass Clock\
    \ {\n  public:\n    Clock( TCHAR* szMutexName);\n    ~Clock();\n  private:\n \
    \   HANDLE hMutex;\n};\nClock::Clock( TCHAR* szMutexName ) {\n  hMutex = CreateMutex(NULL,\
    \ FALSE, szMutexName);\n  WaitForSingleObject(hMutex, INFINITE);\n}\nClock::~Clock()\
    \ {\n  ReleaseMutex(hMutex);\n  CloseHandle(hMutex);\n}\n\nint iValue = 5;\nvoid\
    \ funcA( void ) {\n  Clock* lock = new Clock(TEXT(\"*tmp_lock_01_\\*\"));\n  ++iValue;\n\
    \  delete lock;\n}\n\nvoid funcB( void ) {\n  Clock* lock = new Clock(TEXT(\"\
    *tmp_lock_02_\\*\"));\n  ++iValue;\n  delete lock;\n}\n```\n\nIn a situation like\
    \ the one shown here, when the method is called from different threads, we get\
    \ incorrect results due to an inconsistent protection mechanism. There are so-called\
    \ benign situations, where separate threads will only perform the read operation\
    \ on a shared object, which is potentially dangerous."
