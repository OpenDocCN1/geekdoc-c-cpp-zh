- pgno: 313
  md: '# How it works...


    Implementation of the Lock class remains the same, while the MyForm class introduces
    new methods: SetWait and SetPulse. These methods are declared protected in order
    to allow other programmers who may create a derivation from the MyForm class to
    expand its behavior. As we said before, a programmer must enclose the Wait and
    Pulse statements with locks. At a private scope, the MyForm class with the itonlyHandle
    attribute. This attribute will be used as a synchronization object for the Monitor
    methods. The catch is that we''ve used the Control::BeginInvoke to asynchronously
    invoke the TaskCompleted routine. This is required for the following reason: if
    we had invoked (synchronously) the TaskCompleted method from the working thread,
    we would need to create delegates for all statements inside TaskCompleted that
    manipulates the UI created by the main thread. This would cause a exception by
    invoking TaskCompleted asynchronously, we are avoiding all coding and giving control
    to the main thread. In order to wait until the user provides an answer for task
    continuation, we will use the Monitor::Wait. The working thread then enters a
    suspended state, and no processor time is spent. So, the control has been given
    to the main thread; now it is to ask the user whether they want to continue; if
    the answer is "Yes", then we will call Monitor::Pulse in order to change the working
    thread''s state to signaled. In this way, the working thread can continue execution
    and repeat the process.


    # There''s more...


    Monitor::Wait and Monitor::Pulse, in combination with locks, are providing excellent
    performance, and the code itself is much smaller. The same features that ResetEvent
    (Auto or Manual) or Semaphore provides can be achieved with these routines. If
    you are aware that Pulse takes around 100 nanoseconds for execution despite knowing
    400 nanoseconds is taken by the Set method to signal an event handler, then you
    should consider using Pulse whenever possible.


    # The Barrier class


    Among the synchronization classes for task coordination, an excellent feature
    of .NET is the Barrier class. Even though locking is an excellent mechanism, you
    will almost certainly find yourself in a situation where very complex tasks issue
    another mechanism that you would need to solve successfully. The Barrier class
    enables you to temporarily stop (pause) execution of a task or a collection of
    tasks at a certain point in the application and continue when all tasks reach
    that point. For synchronization, this feature is important in order for a series
    of multiple tasks to be executed in parallel steps.


    ![](img/412b0f5bbb36adcce2ddd2d5b7416516_313_0.png)'
