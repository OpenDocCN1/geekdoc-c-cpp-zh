- pgno: 351
  md: '# How it works...


    First, let''s explain the CSchwefel derived class. We must implement both, constructor
    and destructor, and the virtual method, Evaluate. The constructor as well as deconstructor
    implementation is straightforward. Now, let''s see the Evaluate method''s implementation.
    First, we''ll obtain the current system time. Then, by the CSwefelMT class, we''ll
    instantiate the thread-local storage objects that we''ll use for the private and
    well as shared objects. Note that we must strictly follow the concurrency logic.
    All the attributes that are accessed in parallel must be protected at all times.
    So ds, dscore, and dbest must be protected from concurrent access. We will also
    use the local variable, isize, in order to allocate the array size only once,
    placing the i < Size statement in the parallel loop would be ineffective and bring
    inconsistent access to the shared object.


    Now, we''ll use the OpenMP #pragma omp parallel, firstprivate(min) and firstprivate(best).
    The omp parallel directive instructs the compiler to define a parallel construct
    (region), where the code will be executed by multiple threads in parallel. The
    firstprivate clause specifies that each thread should have its own instance of
    a variable, and that the variable should be initialized with the value of the
    variable because it exists before the parallel construct (MSDN). It is the intention
    to make the min and best scores on its own portion of the array. In that way,
    we will ensure that there is no unprotected access to any shared class attribute,
    in our case dmin or dbest.


    The next statement is #pragma omp for reduction(+: sum) reduction(+: score) followed
    by the for loop. The #pragma omp [parallel] for directive clauses the work done
    in a for loop parallel to be divided among the threads (from MSDN). The reduction(operation,
    variable) clause specifies of a reduction operation at the end of the parallel
    region. This means that under the hood, the compiler will use the variable specified
    in the reduction clause as it is private for each thread specified in the reduction
    clause, but at the end of the parallel region, will (with mutual exclusion) perform
    the necessary reduction-in our case, sum. whereas the parallel loop is executing,
    thread will work independently. At the end of the for loop, before exiting the
    loop, all the values that are private to the threads will be added into one. In
    this manner, parallelism is properly enabled as all the threads'' private work
    will calculate its own portion of the array sum without interfering with another.
    At the end of the loop, all the threads'' sum results will be added into one value.
    All we have to do now is to set the class attributes. One more about the nowait
    clause: it specifies to the compiler that if the thread has finished the work
    in the loop, it doesn''t have to wait until other threads finish the same loop.
    You can think of nowait as a specification that has no barrier that the threads
    will hit and wait until all the others reach that point.'
  merge: -1
  img_proc: true
