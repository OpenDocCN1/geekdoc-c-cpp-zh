  md: "# Managing Threads\n\nYou can set the security attributes or leave it empty\
    \ for the default values. The initial count is set to determine the initial signed\
    \ state of the semaphore. If it is zero, its state is nonsignaled. It also must\
    \ be smaller than the lMaximumCount value. The maximum count represents the number\
    \ of objects (threads) that can hold ownership at the same time. The semaphore\
    \ name must be supplied.\n\nIt is possible to open an existing semaphore using\
    \ OpenSemaphore:\n\n```\nHANDLE WINAPI OpenSemaphore (\n    DWORD       dwDesiredAccess,\n\
    \    BOOL        bInheritHandle,\n    LPCTSTR     szName\n);\n```\n\nIf a semaphore\
    \ does not exist, the runtime fails and returns NULL. After the thread finishes\
    \ its work, it must release the semaphore in order to be decremented, so that\
    \ other threads can create. The ReleaseSemaphore API is used:\n\n```\nBOOL WINAPI\
    \ ReleaseSemaphore (\n    HANDLE  hSemaphore,\n    LONG    lReleaseCount,\n  \
    \  LONG    lpPreviousCount\n);\n```\n\nIt has three arguments. The first one is\
    \ the handle to the semaphore, which was previously returned by CreateSemaphore\
    \ or OpenSemaphore. The second one how many objects the semaphore needs to decrement.\
    \ Well, usually one, the thread that releases it needs to decrement it. In a situation\
    \ where a thread takes the semaphore and then creates another thread that will\
    \ also request for the semaphore, and the thread creator finishes its task before\
    \ the thread that was created, the newly created thread won't know that it will\
    \ be forcibly terminated, so the thread it created can terminate the child thread\
    \ and decrement the semaphore for.\n\n# Synchronization object – event\n\nThe\
    \ event is an object that creates when it needs some kind of mechanism for alerting\
    \ the thread when some action occurs. In its simplest–the manual reset event the\
    \ object sets its signal on and off as the two commands SetEvent (signal on) and\
    \ ResetEvent (signal off). When the signal is turned on, all the threads that\
    \ are waiting for the event will receive it. When the signal is switched off,\
    \ all the threads that are waiting for an event are blocked. Unlike a mutex and\
    \ semaphore, events change their state only when a thread explicitly sets or resets\
    \ it.\n\nFor example, the manual reset event can be used to allow certain threads\
    \ to run only when the program is not painting its window, or only after the user\
    \ enters certain information.\n\n![](img/412b0f5bbb36adcce2ddd2d5b7416516_150_0.png)"
  merge: -1
