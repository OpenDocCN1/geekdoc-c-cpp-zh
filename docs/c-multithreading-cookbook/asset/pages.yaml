  md: "# Threads in the .NET Framework\n\n# How it works...\n\nWe achieved the same\
    \ thing, this time safely, using .NET's integrated features method and the BackgroundWorker\
    \ property SupportsCancellation. It is not always possible to implement the described\
    \ mechanism, especially in situations where you have full control over execution,\
    \ and thread cancellation must be performed instantly. In such a case, you could\
    \ use a bool variable (or other type) to mimic the described property, surrounded\
    \ with a Lock object, to ensure exclusive access.\n\nLet's review the code. We\
    \ added FormClosingEventHandler to handle the form closing event, and we've set\
    \ the BackgroundWorker Cancellation to true. Inside StartAddress, we've added\
    \ the following statement:\n\n```\nif (worker->CancellationPending)\n{\n    return;\n\
    }\n```\n\nThis will cancel the thread execution in an orderly fashion, if.\n\n\
    # There's more...\n\nLet's review the Task class at the end. A very good and new\
    \ feature that the .NET Task object is the Continue method. When the task ends,\
    \ you can immediately prepare it for another task using continuation, to continue\
    \ the method.\n\n![](img/412b0f5bbb36adcce2ddd2d5b7416516_304_0.png)"
