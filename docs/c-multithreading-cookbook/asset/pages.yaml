  md: 'The newly loaded thread executes some part of the time, which is called a quantum.
    The system maintains a counter that measures the current time. For each clock
    the system decrements the counter by a certain value. When the counter reaches
    zero, the dispatcher performs context switching, and sets up the next thread for
    execution.


    # Using mutex


    One of the Windows synchronization objects is mutex. We use mutex when we want
    to acquire exclusive access to some shared object. We also use mutex when we want
    to protect some part of the code, to be executed by one thread at a time.


    In our example, we will ask the user to provide a text file with six integer coordinates
    on each line in order to calculate a system of two linear equations:


    ```

    $$\begin{cases}ax_x+b_y=c_1\ax_x+b_y=c_2\end{cases}$

    ```


    We use the CQueue class, previously implemented in Chapter 1, Introduction to
    C++ Concepts and Features. Our task is to load all the values from the file, and
    then each group of coordinates will be added to the queue. When each group is
    loaded, we will start some number of threads to calculate concurrently. Important
    decisions to make here are how many threads we start, and what areas of code we
    should protect and synchronize.


