- pgno: 274
  md: 'Threads in the .NET Framework


    # How it works...


    First, we will add a new Lock class. The idea behind the Lock object is to prevent
    a shared object from being accessed by more than one instance of time. For purpose,
    we will use the Monitor object, which resides in the System::Threading namespace,
    and its Enter and Exit methods. To be able to use Monitor::Enter and Monitor::Exit,
    you must supply a pointer to System::Object in order to prevent the shared object
    from being accessed at the same time by two or more threads. We''ll instantiate
    a pointer to the Lock object before accessing the shared object and delete the
    Lock object right after accessing the shared object. This is due to the fact that
    the Monitor::Exit call is performed on the Lock destructor. In this way, we can
    safely set the value of bContinue or read it, without worrying whether the two
    threads access at the same time and perform unpredictable results.


    # There''s more...


    Let''s discuss deadlock. A deadlock is a situation where one or more threads are
    waiting for exclusive access to some object that is held by the thread that is
    suspended or unable to proceed for some reason. A deadlock can appear in a case
    where thread A is waiting for thread B, while thread B is waiting for thread A.
    An illustration is given in the following figure:


    ![](img/412b0f5bbb36adcce2ddd2d5b7416516_274_0.png)


    Deadlocks can appear in many situations where exclusive access is present. For
    example, we''ve added exclusive access to our example in a way that, when the
    main thread wants to set the value of bContinue, the working thread can''t read
    it, or when the working thread wants to read its value, the main thread can''t
    write. What if we suspend the working thread just after it has a lock on the bContinue
    object? We would encounter a deadlock because the main thread will be blocked
    until the thread continues, but the working thread can''t continue because it
    is suspended. There are many algorithms on how to detect, avoid, and successfully
    deal with deadlocks, but this is not the topic here. Deadlock detection and resolving
    will be implemented and explained in detail in Chapter 8, Advanced Thread Management.
    Our intention is to inform the developer about possible scenarios, while thorough
    research should be performed on the deadlock theory using well-documented materials
    in the operating system area.'
