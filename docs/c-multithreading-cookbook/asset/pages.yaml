- pgno: 182
  md: '# Thread Synchronization and Concurrent Operations


    By the end of the chapter, we will use and compare all previously explained synchronization
    techniques in order to conclude what we have learned so far.


    # Pseudoparallelism


    As we said before, modern processors have more than one physical core, and parallel
    processing is its native feature. What about older ones? Is it possible to create
    parallel execution in a single core environment?


    Let''s give a simple example; we need to calculate a certain mathematical equation.
    We will calculate the sum that will be implemented as loop with x iterations.
    In every iteration, certain expressions are calculated.


    When we create a program, where one thread will execute a certain task, the calculation
    time for the task execution is finite. Now let''s assume that it is t. If we split
    the execution between two threads, the first thread will calculate the first half
    of the sum of the iterations and the second thread will calculate the other half
    of the sum of the iterations, we will get faster execution and the approximate
    time to t/2


    Well, on a single processor, the answer is no, because the operating system schedules
    both threads for execution, but there is no hardware to support such executions.
    Since there is only one core, only one thread can be executed on the CPU at any
    instant of time.


    It is important to understand that creating threads not always provide benefit.
    If we split some task into eight threads and try to execute the program on a single
    core CPU? division of the task will only slow the process because unnecessary
    thread creation occurs, and separate executions will only waste time. If we add
    synchronization to such a program, we will waste a lot of time waiting between
    threads when only one thread can run.


    Pseudoparallelism is a very important operating system feature. It gives you an
    illusion that all tasks (programs) are executed in parallel. For example, while
    you use Microsoft Word, you can play Winamp, print a file, and hunt DVD at the
    same. Either on multiple cores, all tasks are divided into separate threads, which
    are scheduled by the operating system for execution. Switching quickly among threads,
    creates an illusion that all these threads are executed concurrently.


    # Understanding process and thread priority


    To be able to work with threads, you need to know more than just how to create
    or terminate a thread. It requires that threads interact effectively, which demands
    proper time control. Control has two forms: priority and synchronization. Priority
    controls how often a thread gets the CPU for execution, while synchronization
    controls competition for shared resources, and gives the sequence where threads
    must perform tasks in a specific order.


    168'
