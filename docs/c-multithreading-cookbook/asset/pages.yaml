  md: '# # Thread Synchronization

    and Concurrent Operations


    In this chapter, we will cover the following topics:


    +   - Pseudoparallelism

    - Process and thread priority

    - The Windows dispatcher object and scheduling

    - Using mutex

    - Using semaphore

    - Using events

    - Using critical section

    - Using pipes


    # Introduction


    In order to understand concurrent execution on different processors, we need to
    distinguish hardware parallelism and pseudoparallelism. Modern processors have
    more than one physical core for processing and these cores can process and compute
    in parallel, while older processors have only one core for processing and it is
    not always possible to get proper parallel execution.


    Furthermore, we will take a short look at Windows scheduling priority, which is
    necessary when we need to perform tasks with different priorities.'
  merge: -1
