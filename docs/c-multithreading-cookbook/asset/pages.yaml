  md: "# Introduction to C++ Concepts and Features\n\nThe CreateWindow API creates\
    \ an overlapped, pop-up, or child window. It specifies the window class, window\
    \ title, window style, and (optionally) the initial position and size of the window.\
    \ The function also specifies the window's parent or owner, if any, the window's\
    \ menu, as shown in the following code:\n\n```\nHWND hWnd = CreateWindow(wndEx.pszClassName,\
    \ TEXT(\"GUI Project\"),\nWS_OVERLAPPEDWINDOW, 200, 200, 400, 300, HWND_DESKTOP,NULL,\
    \ hThis, 0);\n```\n\n```\nif (!hWnd)\n{\n    return -1;\n}\n```\n\nThe UpdateWindow\
    \ function updates the client area of the specified window by sending a WM_PAINT\
    \ message if the window's update region is not empty. The function sends a WM_PAINT\
    \ message directly to the window procedure of the specified window bypassing the\
    \ message queue. The usage is shown in the following code:\n\n```\nUpdateWindow(hWnd);\n\
    ```\n\nThe following code sets the specified window's state:\n\n```\nShowWindow(hWnd,\
    \ iCmdShow);\n```\n\nNow, we need the instance of the MSG structure that represents\
    \ the window message.\n\n```\nMSG msg = { 0 };\n```\n\nHere, we need the message\
    \ loop. Windows-based applications are event driven. They do not make explicit\
    \ function calls (such as C runtime library) to obtain input. Instead, they wait\
    \ for the system to pass input to them. The system passes all input for an application\
    \ to the various windows in the application. Each window has a function, called\
    \ a window procedure, which the system calls whenever it has input for the window.\
    \ The GetMessage API retrieves a message from the calling thread's message queue,\
    \ as shown in the following code:\n\n```\nwhile ( GetMessage(&msg, NULL, NULL,\
    \ NULL ) )\n{\n    // Translates virtual-key messages into character messages.\n\
    \    TranslateMessage(&msg);\n    // Dispatches a message to a window procedure.\n\
    \    DispatchMessage(&msg);\n}\n```\n\n32"
