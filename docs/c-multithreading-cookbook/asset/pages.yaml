- pgno: 147
  md: '# Win32 synchronization objects and techniques


    In order for the threads to be executed, they must be scheduled for execution.
    In order for them to be executed without interfering with each other, they must
    be synchronized.


    Suppose that one thread executes a brush and creates several threads that share
    the same brush and draw with it. The first thread must not destroy the brush until
    other threads have finished drawing. Or, for example, one thread accepts input
    from the user and writes to a file, while another reads from the file and processes
    the text. The thread that can''t read if a thread that is writing is file. Both
    situations require a mean of coordination among several threads.


    One solution would to create a global Boolean variable, bDone, which one thread
    uses to signal another thread. The thread that would set bDone to TRUE, while
    the thread that needs to execute a loop until the indicator bDone changed. Such
    a mechanism would work but the thread that executes consumes a lot of CPU time.
    Instead, the Windows operating system provides a number of synchronization objects
    as follows:


    +   - The mutex object (mutual exclusion) works as a narrow gate where it can
    take only one thread at a time

    - The semaphore object works as a gateway where certain number of threads can
    pass at one instance of time

    - The event object that broadcasts a public signal, which any thread that listens
    can receive (hear)

    - The critical section object works just like a mutex but only within a single
    process


    All of these objects are system objects created by the Object Manager. Although
    each synchronization object coordinates with the various interactions, they all
    work in the same way. The thread that wants to execute a coordinated operation
    waits for an answer from one of these objects only when it receives it. The dispatcher
    removes the objects from a queue, which are in the wait state, to avoid wasting
    CPU time. When the signal arrives, the dispatcher allows the thread to continue.


    Even the unrelated processes can share mutex, semaphores, and events. Processes
    can coordinate with the shared object''s activities as threads. There are three
    mechanisms for distribution. One is inheritance, when a process creates another
    and the new process gets a copy of the parent identification codes. Only these
    identification codes, which are marked to be inherited when they are created,
    will be passed (inherited).


    ![](img/412b0f5bbb36adcce2ddd2d5b7416516_147_0.png)'
