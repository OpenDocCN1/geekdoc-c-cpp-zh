  md: '# There''s more...


    File mapping operates with content on the disk and view. View in memory is faster
    to read/write from than to use the hard drive disk. Using file mapping is a good
    practice when we want to use shared objects between processes for simple purposes.
    When we supply -1 for the first argument in a call to Win32 API


    ```

    CreateFileMapping( HANDLE ), -1, NULL, PAGE_READWRITE, 0,

    sizeof( COMMUNICATIONOBJECT ), COMMUNICATION_OBJECT_NAME );

