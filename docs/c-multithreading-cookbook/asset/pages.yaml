- pgno: 314
  md: 'Threads in the .NET Framework


    When an application creates a Barrier object, it is to specify the number of tasks
    in set that will be synchronized. This value can observed as a task counter that
    is internally maintained inside the Barrier object. This value can be incremented
    using the Barrier::AddParticipant method, or decremented using the Barrier::RemoveParticipant
    method. When the task reaches the synchronization point, it calls the Barrier::SignalAndWait
    method, which decrements the counter inside the Barrier object. If this counter
    is greater than zero, the thread is suspended. Only when the counter reaches zero
    (no more threads to wait), all tasks that wait will be released, and only then
    will they continue execution.


    The Barrier object provides the ParticipantCount property, which returns the number
    of tasks that need to be synchronized, along with the number of tasks needed for
    a SignalAwait call to be made before the barrier is reached, and the suspended
    tasks continue execution. You can also provide the postPhaseAction method as argument
    of the Barrier constructor, which will be called when all tasks reach the barrier.
    The Barrier object is passed as a parameter into this method. Barrier is not enabled,
    and tasks are not resumed until this method returns.


    Our following example will calculate a mathematical formula, and plot its graph
    in order to show synchronization using the Barrier object.


