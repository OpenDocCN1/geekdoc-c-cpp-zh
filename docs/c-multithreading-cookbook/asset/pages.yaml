- pgno: 156
  md: '# Message Passing


    Every application that has a UI must have some form of a window. Top-level windows
    must implement top-level window handlers or window procedures, which will handle
    application events (messages), for example, button click, window paint, and others.


    To be able to process messages for the window, an application must implement the
    event handler that the OS will call each time an event is raised. If you remember
    that every application must have its primary thread, then you can use the primary
    thread to process messages from other threads. In other words, you can use the
    window procedure from the main application to receive messages from other threads
    to communicate with each other.


    There are other ways to pass a message to the thread, such as the PostMessage
    API, but the thread to which the message is posted must have created a message
    queue. We will explain this approach too, later in this chapter. However, using
    the window message queue is easier, in cases when your application has a UI.


    This chapter will explain in detail how to use message passing for various tasks,
    especially for synchronization between threads.


    # Explaining the Message Passing Interface


    In order to explain message passing in detail we will discuss the button click.
    Like any other control, it belongs to some top-level window, whose procedure is
    called when a button click event is raised as response to the mouse button press.


    The following example will demonstrate the basic usage of message handling, responsible
    for the mouse move and button-click.


