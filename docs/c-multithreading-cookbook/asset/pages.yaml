    As you can see in the preceding screenshot, a new process (Notepad) has been started.


    # How it works...


    The CreateProcess function is used to create a new process and its primary thread.
    The new process runs in the security context of the calling process.


    The operating system assigns the process identifier to the process. The identifier
    is valid until the process terminates. It is used to identify the process, or
    for some APIs, such as the OpenProcess function, it is used to obtain a handle
    to the process. A thread identifier is also assigned to the initial thread in
    the process. It can be specified in the OpenThread function to open a handle to
    the thread. The identifier is valid until the thread terminates and can be used
    to uniquely identify the thread within the system. These identifiers are returned
    in the PROCESS_INFORMATION structure.'
