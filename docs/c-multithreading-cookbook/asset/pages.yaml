    # How it works..


    We have created five processes to mimic five philosophers. Each philosopher (process)
    has to think and eat. If a philosopher needs to eat, they must ask for the left
    fork and, if it is available, they ask for right fork. If both forks are available,
    it is possible to eat; if not, the philosopher leaves the fork (if obtained) and
    waits for their next turn. We set the eating time at 1 second.


    PhilosDinner is our main app. By creating file mapping, we are able to communicate
    with other processes. It''s important to synchronize processes by creating a Semaphore
    object. As we said earlier, using mutex would allow us to make only one philosopher
    dinner at one instance of time. It would work, but it wouldn''t be optimized enough.
    If we need two forks for each philosopher to eat, then we can have FLOOR/NUMBER_OF_PHILOPHERS/2
    eating simultaneously. That''s why we would set a maximum of two objects that
    can pass semaphore at one instance of time, as shown in the following code:


    ```

    HANDLE hSemaphore = CreateSemaphore(NULL,

    int ( PHILOSHER_COUNT / 2 ),

    int ( PHILOSHER_COUNT / 2 ), szSemaphoreName);

    ```


    What is important for us to know that semaphore can initially have a certain number
    of objects that can pass, but this can be increased with the third parameter of
    the CreateSemaphore API. In our example, we won''t need this feature.


    After initializing the semaphore, the processes are created, and the application
    can enter its message loop. Let''s review the other part of the application—Philosopher
    application. It is a console application and because we need no interface, we
    will hide its main window (in this case, console) as shown in the following code:


    ```

    HWND hConsole = GetConsoleWindow();

    ShowWindow(hConsole, SW_HIDE );

    ```


