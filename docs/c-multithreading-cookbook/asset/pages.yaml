- pgno: 183
  md: 'When one thread finishes, the scheduler looks for the next thread that will
    be executed. While selecting the next thread, the threads with higher priority
    have an advantage. Some activities such as response to power loss are always executed
    with higher priority. Elements that perform system interrupts have a higher priority
    than user processes. The bottom line is that every process has a priority list,
    and thread base priority comes from the owning process.


    As''ve seen before, thread object attributes include the base and dynamic priority.
    When we use commands for changing priority, we can only change the base priority.
    Still, it is not possible to change the thread priority by more than two levels,
    even if two levels above or two levels below. That is because the thread can''t
    be more important than its parent process. Through the process the thread can''t
    change its priority by more than two steps, the system can. The system allows
    some kind of improvement—dynamic priority—to the threads that need to be executed.
    When the thread performs some action in the application window as a key stroke
    or a mouse click, the system always increases the owning priority. When the thread
    that waits for data from hard drive gets the data, the system increases the priority
    for that thread too. These temporary priority improvements, when added to base
    priority, form the dynamic priority. The dispatcher, or the element responsible
    for scheduling, the base and dynamic priority are shown in the following figure:


