  md: '# Understanding Concurrent Code Design


    After the parallel loop has finished, we''ll add another parallel construct: #pragma
    omp critical. It specifies to the compiler that the statements under the construct
    must be executed with exclusive access to any object inside. Each thread has its
    own minimum and best score. We must perform the comparison and assignment on each
    thread sequentially due to the synchronized access. After the end of the root
    parallel construct, we''ll make the necessary assignments to dsum and dscore and
    obtain the system time again to be able to calculate the elapsed time.


