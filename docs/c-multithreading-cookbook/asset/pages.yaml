    \ by decrementing it by:\n\n```\nWaitForSingleObject( hSemaphore, INFINITE );\n\
    ReleaseSemaphore( hSemaphore, 1, NULL );\n```\n\n# There's more...\n\nAgain, the\
    \ most important part was to properly select the synchronization spots as well\
    \ as proper synchronization object selection. We've intentionally selected semaphore\
    \ in order to demonstrate to the user that the first solution isnt always the\
    \ only solution. Fortunately, Windows provides a variety of synchronization objects,\
    \ and developers should be aware of each one of them in order to select the most\
    \ appropriate one in their development.\n\n![](img/412b0f5bbb36adcce2ddd2d5b7416516_210_0.png)"
