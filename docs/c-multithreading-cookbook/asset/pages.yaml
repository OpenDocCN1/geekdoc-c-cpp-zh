    # Implementing threads in user space


    There are two ways to implement a thread''s package: in the user space and in
    the kernel. The choice is moderately controversial and a hybrid implementation,
    where it is also possible to use a combination of kernel and user thread.


    We will now describe these methods, along with their advantages and disadvantages.
    The first method is to put the threads package entirely in the user space. The
    kernel knows nothing about them. As far as the kernel is concerned, it is managing
    ordinary, single-threaded processes. The first and most obvious advantage is that
    a user-level package can be implemented on an operating system that does not support
    threads.


    Traditional operating systems used to fall into this category, and even now, still
    do. With this approach, threads are implemented by a library. All of these implementations
    have the same general structure. The threads run on top of a runtime system, which
    is a collection of procedures that manage threads. We have seen a few of these
    already (CreateThread, TerminateThread, and others), but, there are more.


    The following example will demonstrate thread usage in user space. We want to
    copy large files. We don''t want to read it entirely first and write it after
    that. No, it would be more optimized to read it by piece, at the same time writing
    whatever piece was previously read. This scenario demonstrates the Producer-Consumer
    problem, mentioned earlier in the Interprocess Communication recipe.


    # Getting ready


    Make sure Visual Studio is up and running.'
