    6000)->Start(params1);\n\n        CParameters* params2 = new CParameters(b, a,\
    \ 50);\n        pool->RequestThread(CBankAccount::Transfer)->Start(params2);\n\
    \n        pool->WaitAll();\n        delete pool;\n    }\n\n    #ifdef _DEBUG\n\
    \    return system(\"pause\");\n    #endif\n    return 0;\n}\n```\n\n# How it\
    \ works.\n\nLet's explain header files. In main.h, we have included necessary\
    \ Windows headers. We\nalso define two macros: MSG_ENDTASK used for posting the\
    \ message about a completed task\nfrom the worker to the dispatcher and MAX_WAIT_TIME\
    \ in order the thread not to wait too\nlong for its context thread. The maximum\
