- pgno: 81
  md: 'One improvement that has no deadlock and no starvation is to protect the five
    statements that follow the call to think by a mutex. Before starting to acquire
    forks, a philosopher would ask for a mutex. As we said earlier, mutex stands for
    mutual exclusion or the ability to provide exclusive access to some object. After
    replacing the forks, he would release the mutex. From a theoretical viewpoint,
    this approach is adequate. From a practical one, it has a performance issue: only
    one philosopher can eat at any instant of time. With five forks available, we
    should be able to allow two philosophers to eat at the same time.


    The complete solution is given in the following example.


