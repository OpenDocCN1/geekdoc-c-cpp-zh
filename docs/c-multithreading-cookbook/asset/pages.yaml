- pgno: 170
  md: '# Using the thread message queue


    As we said earlier, we can send a message to the thread without creating the window
    (UI). In our previous example, we were simply using the message queue created
    for the thread because it owns a window. Here, we will explain the ability to
    pass messages without using the window message queue.


    Due to the simplicity of the example, we will send a message to the thread each
    time the user clicks on a button.


    An analogy to such task would be if we wanted to create an application that will
    display information about the weather forecast, we will have two threads: one
    is responsible for physical devices such pressure meter, wind speed meter, and
    similar, while the other thread needs to wait for the data collected from the
    first thread. After it obtains the data, it can process it and display it to the
    user.


    # Getting ready


    Make sure that Visual Studio is up and running.


    # How to do it...


    Now, let''s create our program and explain its structure. Perform the following
    steps:


    +   1. Create a new C++ Windows application named threadMPI.

    2. Open Solution Explorer and right-click on Header files. Add an adding header
    file CQueue.h from the Chapter 1, Introduction to C++ Concepts and Features.

    3. Open Solution Explorer and right-click on Source file. Add a new source file
    named threadMPI.cpp.

    4. Add the following code to it:


    ```

    #include <windows.h>

    #include <windows.h>

    #include <char.h>

    #include "CQueue.h"

    #include <cmctlrl.h>


    #pragma comment ( lib, "comctl32.lib" )

    ```'
