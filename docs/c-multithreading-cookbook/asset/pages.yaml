    # Linked list, queue, and stack examples


    The following example demonstrates the OOP usage of a linked list that can contain
    any generic type T. The idea behind this is to show inheritance usage as a model
    for the relation that "B is a kind of A".


    A linear list is of strictly linear arranged of elements in which the first element
    links to the second, the second element to the third, and so on. Basic operations
    with a linked list are insert (PUT) and obtain (GET). A queue is a linear list
    where the elements are arranged in order so that what enters a queue gets first
    out, in words, FIFO—First In First Out. Therefore, when you get an element, it
    is obtained from the top of the list, and you put a new element at the bottom
    of the list. A stack is a linear list where the elements are arranged in the reverse
    order of how they were inserted. The element is placed at the top of the list,
    and it is obtained from the top of the list, or LIFO—Last In First Out.


    A list is an arranged collection of elements. Each list has methods that can set
    element value, obtain an element from the list, or simply peek an element. A list
    can be used to store any type of objects. For specializations of list, queue,
    and stack, it is defined exactly what elements must be inserted or obtained from.
    So, a list as a general object will be a base class.


    You should be aware that a list designed in such a manner can be implemented as
    a static or dynamic structure. In other words, it can be implemented as an array
    of elements or as a structure of elements linked by pointers to the next (or previous
    or both) element. Implementation using pointers is mostly used in practice and
    will be shown here.


    The list, in the following example, will be implemented as a collection of pointers
    that point to the original objects that are placed in the list using its methods.
    So, the original objects will not be copied to the list, which enables polymorphism
    for list elements. Semantics, as such, requires additional attention and careful
    design.


    34'
