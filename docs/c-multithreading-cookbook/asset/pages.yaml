- pgno: 80
  md: '# The Concepts of Process and Thread


    In 1965, Dijkstra proposed and solved a synchronization problem that he called
    the dining philosophers’ problem. The problem is quite simply as follows: five
    philosophers are seated around a circular table. Each philosopher has a plate
    of spaghetti. The spaghetti is so slippery that a philosopher needs two forks
    to eat it. Between each pair of plates is one fork. The layout of the table is
    illustrated in the following figure:


    ![](img/412b0f5bbb36adcce2ddd2d5b7416516_80_0.png)


    An assumption is that the life of a philosopher consists of alternate periods
    of eating and thinking. When a philosopher gets hungry, he tries to acquire the
    left and right forks, one at a time, in either order. If he is successful in acquiring
    two forks, he eats for a while, then puts down the forks, and continues to think.
    The key question is: can you write a program for each philosopher that does what
    it is to do and never get stuck?


    We could wait until the specified fork is available and never seize it. Unfortunately,
    the obvious solution is wrong. Suppose that all five philosophers take their left
    forks simultaneously. None will be able to take their right forks, and there will
    be a deadlock.


    We could modify the program so that, after taking the left fork, the program checks
    to see the right fork is available. If it is not, the philosopher puts down the
    left one, waits for some time, and then repeats the whole process. This proposal
    fails, although for a different reason. With a little bit of bad luck, the philosophers
    could start the algorithm simultaneously, picking up their left forks, seeing
    that their right forks were not available, putting down their left forks, waiting,
    and picking up their left forks again simultaneously, and so on. A situation like
    this in which all the programs continue to run indefinitely but fail to make any
    progress is called starvation.'
