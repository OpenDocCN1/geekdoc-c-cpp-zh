  md: "```\nWorker^ bckWorker = ( Worker^ ) e->Argument;\nInt64 iResult = 1;\nfor\
    \ (int iIndex = 1; iIndex <= Worker::N; iIndex++)\n{\niResult *= iIndex;\nbckWorker->ReportProgress(\
