  md: '![](img/412b0f5bbb36adcce2ddd2d5b7416516_91_0.png)


    When multithreaded process is run on a single CPU system, the threads take turns
    running. By switching between multiple processes, the system gives the illusion
    of parallelism. Multithreading works the same way. With three threads in a process,
    the threads appear to run in parallel, each one on a CPU, with one-third the time
    that the CPU has scheduled for its process (approximately, because CPU time depends
    on OS, scheduling algorithm and more). On a multiprocessing system, the situation
    is similar, only that each CPU core executes threads in same manner as described
    here. The good side is that with more cores, more threads can run in parallel,
    giving us the power of native hardware parallelism and multithreaded execution.


