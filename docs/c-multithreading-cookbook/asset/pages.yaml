- pgno: 327
  md: "# Chapter 7\n\nThe preceding code can lead to issues. Can you see it? The situation\
    \ is that we have protected the critical region around the assignment statement.\
    \ We must take care about the execution flow all the way! What if we execute this\
    \ portion of code in parallel? It could lead to the following situation: thread\
    \ A enters the Pop method and executes the node == NULL statement and gets FALSE.\
    \ It then continues, and the operating system suddenly selects another thread\
    \ for execution. Now, thread B enters the Pop method and executes node == NULL\
    \ statement and gets FALSE. Again, the OS selects thread A for execution and it\
    \ continues from where it left off, it will acquire a lock and remove the node.\n\
    \nThis is a bad situation because the OS selects thread B the next, it will continue\
    \ from where it left off, and proceed to acquire the lock and access the non-existing\
    \ object. This will most likely lead to the crashing! It can be illustrated as\
    \ follows:\n\n| Thread A | Thread B |\n| --- | --- |\n| List* next = next | List*\
    \ node = next |\n| next == NULL | next == NULL |\n| Clock* lock = new Clock(T(\"\
    tmp_lock_\\\n\nThe first column (T) is the time required to execute the statement\
    \ on the CPU. The first column consists of the Thread A statements followed by\
    \ the Thread B column with its statements. Even if we've included protection,\
    \ it is not designed correctly. A proper way of solving such a problem would be\
    \ to simply protect both statements as follows:\n\n```\ntemplate class<T>\nclass\
    \ List<T> {\npublic:\n    List() : next( 0 ), value( 0 ) {}\n    T Pop( void );\n\
