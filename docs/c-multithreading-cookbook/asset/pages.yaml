    # Introduction


    The central concept in all operating systems is the process or abstraction of
    an executing program. Most modern operating systems can do more than one operation
    at a time. For example, if the user is typing in a Word document, the computer
    can print the document, read from the hard disc buffer, play music, and so on.
    In multitasking operating systems, the central processing unit (from now on, CPU)
    makes a fast switch between programs, executing each program for only a few milliseconds.


    While on a single processor system, strictly speaking, only one process can be
    executed by the processor in one unit of time—the operating system creates an
    impression that more than one process is running simultaneously by switching between
    them extremely quickly. This is called pseudoparallelism in contrast to hardware-supported
    native parallelism in multiprocessor systems.'
  merge: -1
  img_proc: true
- pgno: 22
  md: '# Introduction to C++ Concepts and Features


    Multithreading is a very important concept for today''s modern operating systems.
    It allows more than one thread of execution, which is very important for parallel
    tasks as well as for user-friendly application behavior.


    In traditional operating systems, every process has its own address space and
    one thread of execution—often called the primary thread or main thread. Usually,
    more than one thread in the same address space of a single process is needed,
    executing in a quasi-parallel context and acting like separated processes, with
    the exception of a common address space.


    > Pseudoparallelism is an OS feature executed over a single-processor environment.
    The quasi-parallel address space count is a Windows OS feature. When executed
    over a multiprocessor system, Windows provides every process with a so-called
    virtual address space, which is much larger than real physical address space,
    and hence it is a quasi-parallel context.


    A very important concept in all operating systems is the thread. A thread object
    maintains a program counter that takes care of what instruction is executed the
    next thread gets the processor time. It also has registers, which save the current
    values of variables that are manipulating, stack where data related function calls
    and parameters are stored, and so on. Even though threads are executed in the
    context of the process, there is a big difference between processes and threads.
    The process is greedy, wanting all resources for itself; threads are more "friendly",
    they cooperate and communicate with each other and share resources as processor
    time, memory, and shared variables.


    # Creating a C++ project


    All our examples will require Visual Studio IDE. We will now show you how to properly
    set up an IDE. We''ll also point out specific settings that will impact multithreaded
    applications.


    # Getting ready


    Make sure Visual Studio (VS) is up and running.


    # How to do it...


    Run Visual Studio and select a new project on the Start page. A new window with
    multiple options will appear. Under Templates on the left side, select C++ and
    expand the C++ node. You''ll see the CLR, General, Test, and Win32 options. Then,
    perform the following steps:


    +   1. Select Win32. You''ll see two options in the middle row: Win32 console
    application and Win32 project.'
