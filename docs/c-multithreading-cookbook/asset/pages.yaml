- pgno: 347
  md: 'Slowdown usually indicates that the case. the sequential approach will have
    better performances, but that may not always be the case. It could also mean that
    the parallel code wasn''t designed well or there were too many unnecessary synchronization
    points. It could also point to some implementation mistake. In theory, such an
    algorithm itself could be transformed into a parallel one, but there is another
    question: can the hardware support such an execution? If you test it on four CPUs
    and you get respectable results and then try to execute it on one you find that
    the application''s execution is much slower, for example, using the sequential
    algorithm executing on a single CPU core. All these factors should be checked
    before you, decide on what to choose and how your application should benefit from
    it. There are two significant factors that you should think about:


    +   - How can the application do more work in less time?

    - How can the application use more resources without affecting the rest of the
