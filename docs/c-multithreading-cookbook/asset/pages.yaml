  img_proc: true
- pgno: 149
  md: "It is possible to open an existing mutex using OpenMutex:\n\n```\nHANDLE WINAPI\
    \ OpenMutex(\n    DWORD dwDesiredAccess,\n    BOOL  bInheritHandle,\n    LPCTSTR\
    \ szName\n);\n```\n\nIf the mutex does not exist, the routine fails and returns\
    \ ERROR_FILE_NOT_FOUND.\nAfter the thread finishes its work, it must release the\
    \ mutex in order for other threads to get it. The ReleaseMutex API is used:\n\n\
    ```\nBOOL WINAPI ReleaseMutex(\n    HANDLE hMutex\n);\n```\n\nIt has one argument--handle\
    \ to mutex, which was previously returned by CreateMutex or OpenMutex.\n\n# Synchronization\
    \ object - semaphore\n\nIn such a situation, the semaphore object would be a great\
    \ choice, because we would set its maximum value to be the number of logical cores\
    \ on the machine. While the number of threads does not exceed the number of cores,\
    \ they can work concurrently, optimized for the maximum result. When the number\
    \ of threads exceeds the number of cores, some of the threads will be suspended\
    \ and will wait for another thread to complete.\n\nWhile only one thread at a\
    \ time can get the mutex, the semaphore remains signaled until its acquisition\
    \ number reaches the maximum number of objects that can hold the ownership of\
    \ the semaphore. If a thread tries to wait for the semaphore, it will be suspended\
    \ until another thread does not release it.\n\nThe following are the routines\
    \ for semaphore usage. To create or open an existing semaphore object, you can\
    \ use CreateSemaphore:\n\n```\nHANDLE WINAPI CreateSemaphore(\n    LPSECURITY_ATTRIBUTES\
    \ lpSemaphoreAttributes,\n    LONG lInitialCount,\n    LONG lMaximumCount,\n \
    \   LPCTSTR szName\n);\n```"
