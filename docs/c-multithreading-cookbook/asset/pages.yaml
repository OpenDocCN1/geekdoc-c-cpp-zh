  md: "```\nThread::MemoryBarrier( );\nMessageBox::Show( Convert::ToString( iValue\
    \ ) );\n}\n}\n```\n\nThis is called full fence, and it takes around 10 nanoseconds\
    \ for the execution of this memory protection.\n\nThere is another feature that\
    \ the C++ compiler provides: the volatile keyword. The use of the volatile keyword\
    \ instructs the compiler to create an acquire fence for each read operation on\
    \ a volatile memory location, and a release fence for each write operation on\
    \ a memory location that is declared as volatile. The acquire fence prevents read/write\
    \ operations to be moved above the fence, and the release fence prevents read/write\
    \ operations to be moved below the fence. Implementation using a volatile memory\
    \ location could be as follows:\n\n```\nref class TestClass\npublic:\nTestClass()\
    \ \n{\nbState = false;\niValue = 0;\n}\nstatic void SetMethod() \n{\niValue =\
    \ 5;\nbState = true;\n}\nstatic void GetMethod() \n{\nif (bState)\n{\nMessageBox::Show(\
    \ Convert::ToString( iValue ) );\n}\n}\nprivate:\nstatic volatile bool bState;\n\
    static int iValue;\n};\n```\n\nUsing volatile memory objects or so-called half\
    \ fences is much faster due to even more space for runtime optimization."
