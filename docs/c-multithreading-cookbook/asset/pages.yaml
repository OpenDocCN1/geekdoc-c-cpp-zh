- pgno: 385
  md: '# Using remote threading


    So far, we were focusing on situations where we had total control of all application
    parts and the execution itself. In practice, this is far from the truth. In many
    situations, you would have to continue where some other developer stopped or you
    would have to use completed parts or external applications where changing the
    code is not possible. Even in such a situation, sometimes there is a need to change
    application behavior, which we will explain later.


    When we are unable to change the code, we could use remote threading. Remote threading
    is a feature presented by the Windows operating system, starting from XP OS, and
    maintained in all newer versions. A remote thread is a thread like any other,
    with the difference being that the remote thread does not execute under the process
    context but in the address space of the remote process. It is an excellent feature
    with the earlier described scenarios.


    There are few ways in which you can start a remote thread: using the CreateRemoteThread
    API, the SetWindowHook API, or the undocumented NtCreateThread API.


    We''ll focus on the CreateRemoteThread API. In our example, we will assume that
    Windows calculator is some external application we can''t change, and yet we have
    to alter its main window title (for some reason). Even though we could change
    the title of the calculator window from our application without using a remote
    thread, we chose this scenario for the simplicity of example.


    # Getting ready


    Make sure Visual Studio is up and running.


    # How to do it...


    Now, let''s create our program and explain its structure. Perform the following
    steps:


    +   - Create a new empty C++ application named RemoteThreading.

    - Open Windows Explorer and navigate to your solution folder. Create a new text
    file named common.txt. Change its extension to .h.

    - Open Solution Explorer and right-click on the RemoteThreading solution. Select
    the Adding Item option and add common.h. Open common.h. Copy and paste the following
    code:


    ```

    #include <windows.h>

    #include <tchar.h>


    #define MAPPING_NAME T("__comm_61524_map__")

    ```'
