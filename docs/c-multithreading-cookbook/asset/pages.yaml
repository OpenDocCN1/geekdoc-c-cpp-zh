  md: "# Locking and avoiding deadlocks\n\nIn our previous example, we had the bContinue\
    \ variable that both threads were accessing without any restrictions on which\
    \ thread can read or write in it. Well, That's usually bottleneck and should be\
    \ avoided. The Microsoft .NET framework provides us with mechanisms to avoid situations\
    \ like that with very little difficulty.\n\nOur following example will implement\
    \ another class, Lock, similar to the one we used in Chapter 3, Managing Threads.\
    \ The Lock will help us to stop one thread from reading while the other is writing\
    \ and vice versa. Unlike the C# language, which provides the lock operator, C++\
    \ doesn't. That's why we will implement our own lock using the Monitor object\
    \ to lock the execution and wait while the other thread accesses the shared object.\n\
    \n# Getting ready\n\nMake sure Visual Studio is up and running.\n\n# How to do\
