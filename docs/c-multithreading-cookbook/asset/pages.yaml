  md: '# Customizing the thread pool dispatcher


    In our previous example, we had to create the thread pool in order to manage certain
    tasks—fund transfer from one bank account to another. Our goal was to use enough
    system resources, not too much. At the same time, we had to take care of busy
    and available threads and maintain synchronization. Our following example will
    expand the thread pool making it a lot smarter and have the ability to solve possible
    problems that could occur during execution.


    Instead of iterating through the thread list and waiting for some thread to complete
    execution, we''ll use message passing in order to select the first thread that
    completes its task and notify for the thread, we''ll add another layer of abstraction
    in order to have more control over task execution. Instead of simply executing
    a user-defined function as a start address


    In the following diagram, we''ve illustrated the idea behind the new approach:


    ![](img/412b0f5bbb36adcce2ddd2d5b7416516_368_0.png)'
