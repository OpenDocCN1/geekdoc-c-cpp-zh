- pgno: 70
  md: '# The Concepts of Process and Thread


    The following can happen when Process 5 reads p_free and stores the value, 6,
    in a local variable called f_slot. Then, a clock interrupt occurs, so it switches
    to Process 6. **Process 6 also reads p_free**, and also gets a 7. It stores p_free
    its local variable f_slot. At this instant, both processes think that the next
    index is 16. Process 6 continues to run. It stores the handles of the files at
    index 16 and updates p_free to be 17. The system then puts Process 6 to sleep.
    Now, Process 5 runs again, starting from the place it left off. If it at f_slot,
    finds an 16 there, and writes its handle to the file, replacing the handle that
    Process 6 put there. Then, it computes f_slot + 1, which is 17, and sets p_free
    to 17. The buffer is now internally consistent, so the process will not notice
    anything, but Process 6 will never receive an output.


    **Process 6 will run for an infinite period of time**, waiting for an output that
    will never occur. Situations when two or more entities are reading or writing
    some shared data and the final result depends on which runs first; these are called
    **race conditions**.


    How to avoid race conditions? Most of the solutions involve shared memory, files,
    and everything is shared at the same time. In other words, need **mutual exclusion**
    or a mechanism that will provide exclusive access to a shared object, whether
    it is a shared variable or file, or any other object. The difficulty can occur
    when Process 6 starts inside its **critical section** or **critical region**.
    We need to ensure that no two processes get in their critical sections at the
    same time to avoid race condition. Even though race condition is avoided, this
    approach may not be efficient when having parallel processes, which are intended
    to cooperate correctly and efficiently. If we intend to use shared data, we must
    take care of the following conditions:


    +   - No two processes may be simultaneous inside their critical regions

    - No assumptions may be made about the speed or number of CPUs

    - No process running outside its critical region may block other processes

    - No process should have to wait to enter its critical region


    What we described earlier is shown in the following figure. **Process A** enters
    its critical section at time **T1**. In some time, **T2 (Process B)** attempts
    to enter its critical section but fails because another process is already in
    its critical section, and we allow only one process at a time in the critical
    section. **Process B** must be temporarily suspended until time **T3 when Process
    A leaves its critical section**, allowing Process B to enter immediately. Eventually,
    **Process B** leaves at (**T4**), and we are back to the beginning where no process
    is in its critical section.


