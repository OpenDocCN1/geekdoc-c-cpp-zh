- pgno: 220
  md: '# Thread Synchronization and Concurrent Operations


    # How it works...


    Just before, we are using a mutex object for synchronization. Only this time we
    are adding an event in order to be signal to the thread that some action has occurred.
    That action is simple: the user wants to use the application. However, this will
    give the wider picture of how to use the event object in a multithreaded environment--very
    important for its future development.


    So, before the main thread enters the message loop, we will create an event. At
    the beginning of the StartAddress thread, we will call WaitForObject with a wait
    of 10 milliseconds, to give the thread space to query the object signaled state:
    if it is signaled, the thread must exit; if not, it will continue execution.


    # There''s more...


    Events are very important for a multithreaded environment. Besides synchronization,
    objects that take care of exclusive access are always required to have some signaling
    technique that the threads will use to communicate about actions that occurred.
    Our example showed basic event usage, while it is left to the user to use and
    explore the demonstrated techniques further.


    # Using critical section


    Another Windows synchronization object is critical section. Critical section behaves
    the same manner as mutex. However, it can be used only in a single process context,
    as opposed to mutex, which can be shared among multiple processes. However, a
    critical section object is allocated faster by the system, with much smaller overhead.


    Our following example will use the same task as before, this time, we will use
    critical section instead of mutex. We can use critical section here because our
    entire application executes in a single process context.


    # Getting ready


    Make sure Visual Studio is up and running.


    # How to do it...


    Now let''s create our program and explain its structure.


    +   Create new empty C++ Windows application named concurrent_operations4.

    Open Solution Explorer and right-click on Header file. Add an existing header
    file, used in Chapter 1, Introduction to C++ Concepts and Features, named Cqueue.'
