  md: '# Threads in the .NET Framework


    When you use a framework, answers to these questions depend on the framework itself.
    Microsoft provides a Thread class as well as a Task class and a collection of
    auxiliary types that reside in the System::Threading namespace.


    The Task class represents abstraction of concurrent operations. CLR implements
    the Thread object and schedules them for execution using the ThreadPool class.
    Multithreaded design can be performed using the Thread class, which resides in
    the System::Threading namespace. For Windows 8 and the Windows store application,
    the Task class is not available. You should use the Task class because it provides
    powerful abstraction of multithasking, and if you design an application that creates
    a specific (but finite) number of threads, your application won''t be scalable.
    In other words, if the number of threads exceeds the number of cores, you could
    get stuck with unresponsive behavior. CLR helps you implement concurrent tasks
    in the best way with respect to the number of cores. When your application creates
    a Task object, an actual task is added to the working queue. When a thread becomes
    available, the task is removed from the queue and the available thread executes.
    The ThreadPool class implements several optimization techniques and uses an algorithm
    for the work-stealing strategy for better thread scheduling.


    Work-stealing is a feature of the scheduling algorithm, where problems are analyzed
    and then the execution (for solving the problem) is performed. Considering the
    number of quantums and the calling depth, it is easy to solve, then it is directly
    solved. If the problem is considered complex, it is split into smaller parts using
    already-created, available threads from other CPU cores, for task solving. Later,
    the subresults are merged into the final result. The idea is to use (steal) available
    threads, of course, possible.


    ![](img/412b0f5bbb36adcce2ddd2d5b7416516_250_0.png)


    Now, we will create our first application using Visual Studio, before 2012 and
    2013, the C++ Windows Forms template included. Newer versions that were released
    in 2012 and 2013 don''t have the templates, but you can achieve everything with
    a little effort. Our first example will create a simple application, which will
    calculate the factorial (the product of all positive integers less than or equal
    to n) with n number of iterations, where the working thread will calculate while
    the main thread will update the progress baronly to demonstrate the basic CLR
    program and explain a very important feature: cross-thread operations.


    # Getting ready


    Make sure Visual Studio is up and running.'
