- pgno: 162
  md: '# Message Passing


    We need to implement a message queue, where the threads perform calculation store
    their messages. These threads (producers) are performing the calculations faster
    than the draw thread (consumer), which is processing the messages taken from the
    queue. Each time the producer finishes its task, it places a message in the queue,
    which is later processed by the consumer.


    # Getting ready


    Make sure that Visual Studio is up and running.


    # How to do it...


    Now, let''s create our program and explain its structure. Perform the following
    steps:


    +   1. Create a new C++ Win32 empty project application named queue_MPI.

    2. Open Solution Explorer and right-click on Header files. Add an existing header
    file Cqueue.h from Chapter 1, Introduction to C++ Concepts and Features.

    3. Open Solution Explorer and right-click on Source files. Add a new source file
    named queue_MPI.cpp. Add the following code to it:


    ```

    #include <windows.h>

