    user whether it should continue or not. In this way, we would need to use the
    Sleep method as the most primitive way of spinning with a 1-second sleep interval,
    in order to not wait too much processor time. In order to communicate between
    the main thread and the working thread, we will use the PostMessage API, as the
    most primitive way, but enough for now, because we will explain other communication
    techniques later.


