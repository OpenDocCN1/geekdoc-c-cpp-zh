    paradigms can be used making programs in C++. Even though C++ is an object-oriented
    language, you can make programs with a structural approach. Usually, a program
    contains one or more functions because every program must have a main routine;
    so we can place all our code into the main function. However, in that way, any
    large program will be very hard to read. Then, we will have to split the code
    in certain program units that we call functions. Let''s give an example of a program
    that needs to calculate the sum of two numbers in the following sections.


