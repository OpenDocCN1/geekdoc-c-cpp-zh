  md: "# Chapter 1\n\nWhen we close the application or send some command that signals\
    \ it to exit, the system releases an application message queue. This means that\
    \ our application will have no more messages, and it will end the while loop.\
    \ The DestroyWindow API destroys the specified window. The function sends the\
    \ WM_DESTROY and WM_NCDESTROY messages to the window to deactivate and remove\
    \ the keyboard focus from it. The function also destroys the window's memory,\
    \ flushes the thread queue, destroys timers, removes clipboard ownership, and\
    \ clears the clipboard viewer (if the window is at the top of the viewer chain).\n\
    \n```\nDestroyWindow( hWnd );\n```\n\nThe function also unregisters a window class,\
    \ freeing the memory required for the class.\n\n```\nUnregisterClass( wndEx, lpClassName,\
    \ hInst );\n```\n\nThe function returns a exit code or a last code from the application\
    \ message queue, as shown in the following code:\n\n```\nreturn (int) msg.wParam;\n\
    ```\n\nNow, we need to implement a window procedure or an application main event\
    \ handler. For our first example, we will create a simple WndProc with only the\
    \ functionality of handling mandatory values. The window procedure returns four\
    \ parameters: the hWnd represents the window identifier, the uMsg unsigned integer\
    \ represents a window message code, the wParam unsigned 64-bit long integer to\
    \ pass application-defined data, and the lParam signed 64-bit long integer to\
    \ pass application-defined data.\n\n```\nLRESULT CALLBACK WndProc( HWND hWnd,\
    \ UINT uMsg, WPARAM wParam, LPARAM lParam )\n{\n```\n\nMessages are handled by\
    \ their message code. For example, we need to handle default messages (in this\
    \ case, WM_CLOSE), which the system sends when the application is closing. Then,\
    \ we will call the PostQuitMessage API to free system resources and safely close\
    \ the application, using the following code:\n\n```\nswitch ( uMsg )\n{\n    case\
    \ WM_CLOSE:\n{\n        PostQuitMessage( 0 );\n        break;\n}\n    default:\n\
    ```\n\n![](img/412b0f5bbb36adcce2ddd2d5b7416516_47_0.png)"
