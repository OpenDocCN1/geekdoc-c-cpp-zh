    # # How it works...


    The code is pretty much the same here, but we chose the Task in order to run the
    threads in the background, because when the user chooses not to continue, the
    application will exit and the working needs to exit forcibly. We could also choose
    the Thread object with the IsBackground property. As we want to use the PostMessage
    API, need to include the User32 library, as shown in the following code:


    ```

    #pragma comment (lib, "User32.lib")

    ```


    When we are not using the framework, the User32 (among others) library is, by
    default, included, while mscorlib.dll is included. This happens when we are using
    a framework. The mscorlib.dll library is included by default when User32 isn''t.
    Now, we will define the END_TASK message in order to allow communicate between
    threads. We will expand our class and add the WndProc overridden method to process
    messages for the window. Once again, we are using the window message queue in
    order to signal the main thread. We must add another delegate that will invoke
    the GetHandle method and obtain the window handle that the working thread needs
    to post the message. We''ve also changed the StartAddress method so that the thread
    now executes an infinite loop with sleeping periods of 1 so that we do not waste
    too much processor time. After each calculation is completed, we will signal the
    main thread to ask the user whether the application will continue or not. If not,
    we will post the WM_CLOSE message and terminate the thread (our Task object) and
    exit the application. However, if the user chooses to continue, we will perform
    calculations again.


    # # There''s more...


    Even though we''ve accomplished the given task, we were using primitive techniques
    for both operations. We''ve used PostMessage to signal the main thread, and the
    Sleep method to spin the thread while waiting for an answer from the user. Further
    on, we will show the .NET features that will help us to achieve this with integrated
    (OR built-in) objects and techniques.


