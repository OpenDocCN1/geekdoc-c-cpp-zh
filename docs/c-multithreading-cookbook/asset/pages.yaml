  md: '# Using event


    The event synchronization object works as a signal for alerting the thread in
    a certain manner. It can be used to start or stop an execution, or when a user
    input is performed, and so on.


    We will use the same example as an event in our previous topics, with improvement
    to application

    having as an event that signals the threads that the user wants to abort the

    execution and end the program. In this way, we will make our application even
    more user

    riendly and more responsive to user input.


