    \ the other process able to continue execution. Let's go back to the IPCDemo project.\
    \ We defined the tagCOMMUNICATIONOBJECT structure for communication between objects\
    \ through file mapping.\n\nFile mapping is the association of file contents with\
    \ a portion of the virtual address space of a process. The system creates a file\
    \ mapping object (also known as a section object) to maintain this association.\
    \ A file view is the portion of virtual address space that a process uses to access\
    \ the file. File mapping allows the process to use random I/O and sequential I/O.\
    \ It also allows the process to work efficiently with a large data file, such\
    \ as a database, without having to map the whole file into memory. Multiple processes\
    \ can also use memory-mapped files to share data. You can find more on MSDN (http://msdn.microsoft.com/en-us/library/windows/desktop/a366b832-vs.85%29.aspx).\n\
    \nIPCDemo creates the file mapping before it runs workers. That's why we could\
    \ ask for file mapping from worker process without checking if it is created.\
