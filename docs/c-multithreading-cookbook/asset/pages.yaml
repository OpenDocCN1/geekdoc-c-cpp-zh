- pgno: 275
  md: "# Thread safety and types of the .NET framework\n\nWhat is thread safety? It\
    \ is the ability to perform exclusive access without interfering with separate\
    \ threads. Why is this important when we are using .NET? This is because of the\
    \ .NET internal implementation of certain types and operations—which are designed\
    \ to be thread-safe by Microsoft itself. A good practice is to develop in the\
    \ same manner and avoid problems from designing the application to the coding\
    \ itself.\n\nIn .NET, all static members are thread-safe while instance members\
    \ are not. For example, if two threads want to enumerate a certain List collection\
    \ concurrently, they will both get different enumerator objects. It is okay if\
    \ you do not modify collection values inside enumeration. However, if some change\
    \ during enumeration is needed, we would have to use locks.\n\nLet's review by\
    \ showing the code that will enumerate the list and is thread-safe:\n\n```\nList<int>\
    \ list = gcnew List<int>();\n\nfor (int iValue = 0; iValue < 5; iValue++)\n{\n\
    \    list->Add(iValue);\n}\n```\n\n```\narray<Object>>* _t1Params = gcnew array<Object^>(2)\n\
    { list, List<Task^> _t1 };\nTask^ _t1 = gcnew Task(Action<Object^>>(\n(&EnumerableList),\
    \ _t1Params );\nt1->Start();\n```\n\n```\narray<Object>>* _t2Params = gcnew array<Object^>(2)\n\
