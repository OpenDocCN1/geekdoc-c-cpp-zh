    \ code is pretty much the same, with differences in the synchronization object\
    \ used. Using critical section demands a slightly different approach, because\
    \ its handle cannot be inherited by a child process. What's important for us is\
    \ that the critical section object allows only one thread to perform exclusive\
    \ access, the same as mutex, only faster.\n\n# There's more...\n\nSelection between\
    \ mutex and critical section must be performed carefully. Even though the main\
    \ difference resides in accessing synchronization objects between processes and\
    \ system speed in providing an appropriate action and overhead for creation and\
    \ manipulation, the user should always try to predict all possible scenarios (use\
    \ cases) for the application choosing the proper synchronization object and technique.\n\
    \n# Using pipes\n\nWhen we are explaining synchronization, it is absolutely necessary\
    \ to give an example with processes. Unlike working in single address space, as\
