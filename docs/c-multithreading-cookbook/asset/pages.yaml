- pgno: 326
  md: "# Understanding Concurrent Code Design\n\nAnother scenario is called Composite\
    \ Actions, where a constant tradeoff between single-threaded performance (due\
    \ to more locks) and parallel (without locks) execution is made. In other words,\
    \ proper decision on what are the statements or areas of code to protect is critical.\n\
    \nImagine a situation using a simple linked list, and we remove the head node.\
    \ When we mention the tradeoff, when we remove the list's head node, we'd have\
    \ two critical regions. If first, when the query head node equals zero (0), that\
    \ is, node = NULL, and then on the assignment of a new node, none = node->next.\
    \ If we protect a lot of statements, the fewer protected statements, the more\
    \ concurrency we can achieve.\n\nAssume that our list has only one node. We'll\
    \ use the CClock class from the previous example for an exclusive access. The\
    \ code is as follows:\n\n```\ntemplate class<T>\nclass CList<T> {\\public:\n \
    \   CList() : next( 0 ), value( 0 ) {}\n    T Pop( void );\nprivate:\n    CList*\
    \ next;\n    T* value;\n};\nt\ntemplate class<T>\nT* CList::Pop( void ) {\n  \
    \  CList* node = next;\n    if (node == NULL) {\n        return 0;\n    }\n\n\
    \    CClock* lock = new CClock(_T(\"_tmp_lock_\"));\n    next = node->next;\n\
    \    delete lock;\n\n    return node->value;\n}\n```"
