  md: '# How it works...


    The previous example is a very simple one. The idea was to show a big difference
    between the processes and the creation of threads. To create and use a thread,
    we need to implement and supply a routine within the same code segment (it can
    be implemented in a separate segment or even in DLL). However, managing threads
    in parallel is a complex task. Process and usage is concurrent by definition.
    We could make it synchronous—waiting for a primary thread of process—yet again
    it is performed on thread level process.


    We''ll use another opportunity to point out the biggest difference between processes
    and threads. When we are using processes, a good thing is that the process is
    an entire entity, along with address space, object contexts, file handles, and
    a lot more. However, the down side is it''s greedy—it wants all the resources
    for itself. Communication between processes is harder to implement as you cannot
    use addresses (pointers) from one process to another, since addresses are private.


    In the following figure, we see three processes loaded into the physical memory,
    which are either ready for executing or executing on the CPU:


    ![](img/412b0f5bbb36adcce2ddd2d5b7416516_123_0.png)


    With more work for process communication and synchronization—a thread is the most
    obvious choice. Compared to processes, threads are friendlier—if properly managed
    and synchronized, they can provide parallelism and much faster execution. The
    advantage for threads is that all the process resources belong to the common address
    space. Handles, pointers, and objects are all available along with a much smaller
    system overhead in transfers from RAM to CPU.'
