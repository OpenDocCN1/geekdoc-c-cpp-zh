  img_proc: true
- pgno: 357
  md: 'We will follow this pattern when designing the ThreadPool class. We''ll use
    a list of threads that will be available for dispatching. In other words, the
    application will ask for a worker from the pool instead of creating threads. The
    pool manager—Dispatcher—will manage and schedule workers upon a request from an
    application.


    The Dispatcher is responsible for resource management, alerts and notifications,
    correct synchronization, and problem solving. It is important to use system resources
    so that the application can execute well in parallel, but at the same time, take
    care not to overload the system too much. Also, an alert mechanism is required
    in order for workers to be notified when some event occurs, such as in a situation
    where the user has some input or as a result of I/O operation in the background.


    Because of concurrent execution, synchronization is required between worker items.
    Features such as thread local storage must be used to save/whatever is necessary
    for successful task execution. Another very important feature is problem solving.
    In a potential problem occur as a result of a random situation. Even though the
    application looks properly designed, situations with a deadlock could occur as
    explained in Chapter 7, Understanding Concurrent Code Design. When designing a
    thread pool, where exclusive access will be shared protection mechanism should
    be carefully planned. Yet, if a situation with a deadlock suddenly occurs the
    Dispatcher must have some ability to resolve the problematic situation and ensure
    normal execution of tasks.


    Our following example will implement the thread pool and use it to transfer funds
    between two bank accounts.


