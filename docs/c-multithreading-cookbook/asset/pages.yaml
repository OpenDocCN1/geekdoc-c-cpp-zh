  md: '# About the Author


    Miloš Ljumović was born on July 26 in Podgorica, the capital of Montenegro in
    Europe, where he attended elementary and high school. He also went to music school
    to play the guitar. He studied Computer Science in the Faculty of Natural Science
    and Mathematics, Montenegro University. The following year he showed interest
    in operating systems, which he majored in, finished his Master''s degree in December
    2009, along with friend Danilo started his company, Montenegro with a highly qualified
    team to provide high-tech IT solutions. So, many skilled developers joined them,
    and from this collaboration, many applications and system software, web applications,
    and database systems have arisen. His clients were not only the Government of
    Montenegro, but also some domestic companies; MeNet; also developed video recognition
    software, along with pictures and other digital media types. He also developed
    many fascinating websites and other web applications. The list of customers is
    up to be incorporated here.


    After working for a few months as an international consultant, he worked with
    an American company in a project involving large e-commerce businesses and data
    scraping from the Internet. All this was the spark to his new company, EXPERT.ITS.ME,
    in the beginning of July. Development provides consulting services and helps small
    businesses in the IT sector to manage problems while inspiring them to be and
    think big. He is a member of the Committee of National Chamber (ICT) of Montenegro
    and MENSA. He likes programming in C/C++/C when he is skilled in HTML, PHP, SQL,
    and more while going towards his dream of owning his own operating system.


    In his time, he plays tennis, dives, hunts, or plays chess. He favors brainstorming
