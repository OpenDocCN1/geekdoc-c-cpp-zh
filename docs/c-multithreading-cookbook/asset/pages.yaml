- pgno: 175
  md: '# How it works...


    As in our previous example, every time we want to use custom messages, we need
    to define them first. We will define the following two messages:


    +   - T_MESSAGE to notify the thread to start its specific task

    - T_ENDTASK to notify the thread that the application is closing, and it needs
    to return immediately


    As the message queue for the new thread is not created, due to fact that the thread
    does not own a window, we need to create it manually. First, we create an event
    from the thread that will send messages-producer. The event won''t be set until
    the newly created thread creates a message queue. We associate the thread with
    the window so that, later, we''ll be able to use it from the window which we''ll
    use for a simple button-clicking handler.


    Now, we wait for the thread to create a message queue. By calling the PeekMessage
    API in the following manner, we forcing the system to create the message queue:


    ```

    PeekMessage(msg, NULL, WM_USER, WM_USER, PM_NOREMORE);

    ```


    After the message queue is created, we can set the event by calling the SetEvent
    API and close its handle. The thread then enters its message loop. Subsequent
    calls to GetMessage will block the thread until the message is received. When
    our thread receives a message, it examines the message identifier and displays
    a message box. In case of T_MESSAGE, it displays a message; else, it returns in
    the case of the T_ENDTASK message.


    # There''s more...


    We''ve mentioned producer and consumer many times here. Our goal was to point
    out the widespread occurrence of consumer/producer problems in everyday tasks.
    Once again, a smart design of the application is more than half the work we do.
    Remember to perform the application design very carefully, because it is the most
    important step.


    # Communicating through the pipe object


    Besides message passing, Windows offers other ways to communicate and share data
    between processes and threads. One of these ways is use the pipe object. Pipe
    is the object in memory that processes use for their communication. The process
    that creates a pipe is the pipe server. A process that connects to a pipe is a
    pipe client. One process writes information to the pipe, and then another process
    reads the information from the pipe.


    We will implement a small client-server example. One process will be a server;
    another one will be a client. The server will run for an infinite period of time.
    We will use the pipe object for process communication. Every time the client connects,
    the server needs to accept the connection and send a welcome message, while the
    client needs to receive the server''s welcome message and make a request to the
    server again by sending a simple message.'
