    \nAfter the return type (int), you will notice the WINAPI macro. It represents\
    \ a calling convention.\nWINAPI or stdcall a stack will call the clean. WinMain\
    \ is the name and must have four parameters in a given order. The first parameter,\
    \ hThis, is a handle to the current instance of the application. The second parameter,\
    \ hPrev, is a handle to the previous instance of the application. If you refer\
    \ to the MSDN documentation (http://microsoft.com/en-us/library/windows/ms33559%28-vs.85),\
    \ you'll notice that the hPrev parameter is always NULL, so I guess that this\
    \ has been left for compatibility with previous versions of window operating systems,\
    \ as it can't have values in current trendy. The third parameter is szCmdLine\
    \ or the command line for the application, the program name. The final parameter\
    \ controls how the window is to be.\n\nIt can have one or more values combining\
    \ bit values with the OR (()) operator (more information on MSDN).\nWe will use\
    \ the UNREFERENCED_PARAMETER macro to tell the compiler that we will not use parameters\
    \ so that we can do additional optimization. Using the following code:\n\n```\n\
