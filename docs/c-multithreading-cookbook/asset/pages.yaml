  md: "# Signaling with Wait and Pulse\n\nIn one of our examples, we've used the Lock\
    \ class whose implementation uses Monitor::Enter and Monitor::Exit. Another feature\
    \ of the Monitor object is very important: Monitor::Wait and Monitor::Pulse (and\
    \ the PulseAll methods). These methods also make EAP constructs. Their ability\
    \ to wait until a signal is received from another thread makes them excellent\
    \ for usage. One of the most important features is that they prevent switching,\
    \ because of which no processor thread is active. The only constraint is that\
    \ they must be enclosed with locks (Monitor::Enter and Monitor::Exit). Once again,\
    \ we're introducing the Lock class in order to gain exclusive access to shared\
    \ objects.\n\nOur following example will show you how to use the static Wait and\
    \ Pulse methods as a technique to synchronize threads.\n\n# Getting ready\n\n\
    Make sure Visual Studio is up and running.\n\n# How to do it...\n\nLet's create\
    \ our program and explain its structure. Perform the following steps:\n\n+   1.\
    \ Create a C++ CLR empty project application CLRAApplication10.\n2. Open Solution\
    \ Explorer and right-click on Source files. Add a new source file named main.\
    \ Open main.cpp.\n\n```\n#include <Windows.h>\n#include <tchar.h>\n#include \"\
    MyForm.h\"\n\nusing namespace System::Windows::Forms;\nusing namespace System::Threading;\n\
    using namespace CLRAApplication10;\n\n[ThreadAttribute]\nint APIENTRY tWinMain(INSTANCE\
    \ hThis, INSTANCE hPrev, LPTSTR szCommandLine, int iCmdShow)\n{\n    Application::EnableVisualStyles();\n\
    \    Application::SetCompatibleTextRenderingDefault(false);\n    Application::Run(new\
    \ MyForm());\n\n    return 0;\n}\n```\n\n294"
