- pgno: 43
  md: 'An event handler is a function that the operating system calls each time the
    control sends some kind of message, such as I have been pressed in the case of
    buttons or I received a character in the case of a textbox.


    Event handlers are very important. Timers are events that trigger after a certain
    portion of time has elapsed. When you press a key on the keyboard, the operating
    system raises a ''key is pressed'' event, and so on.


    Event handlers are very important for you. The majority of applications have windows
    or forms. Every window needs its event handler, which will be called each time
    some event occurs in its space. For example, if you create a window with a few
    buttons and textboxes, you must have a window procedure associated with that in
    order to handle events.


    The Windows operating system provides such a mechanism in the form of a window
    procedure, usually called WndProc (but you can name it as you like). This procedure
    is called by the operating system each time event specific to that window occurs.
    In the following example, we will create our first Windows application, where
    we will have a window and explain the usage of a window procedure.


    # Getting ready


    Make sure Visual Studio is up and running.


    # How to do it...


    Perform the following steps:


    +   1. Create a new empty Win32 C++ project. Name it GUIProject, and then click
    on OK. Now, right-click on the source files and navigate to Add | New item in
    Solution Explorer. Now call it main, and then click on Add.

    2. Now, let''s create the code. First, we will add a header that we need, as shown:

    #include <windows.h>


    The .h header is needed for the majority of APIs that are responsible for visual
    features such as windows, controls, enumerations, and styles. Before we create
    an application entry point, we have to declare a window procedure prototype so
    that we can use it in the window structure, as shown in the following code:


    ```

    LRESULT CALLBACK WndProc(HWND hWnd, UINT uMsg, WPARAM wParam, LPARAM lParam);

    ```'
