    file, used in Chapter 1, Introduction to C++ Concepts and Features, named CQueue.h.

    3. Open Solution Explorer and right-click on Header file. Add a new header file
    named main. Open main.h.

    4. Add the following code:

    #pragma once

    #include <windows.h>

    #include <commctrl.h>

    #include <tchar.h>

    #include <psapi.h>

    #include <strsafe.h>'
