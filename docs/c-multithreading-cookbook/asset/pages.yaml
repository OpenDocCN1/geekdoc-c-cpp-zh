- pgno: 248
  md: '# Threads in the .NET Framework


    Our goal is to have a closer look at one of the most powerful frameworks today—the
    Microsoft .NET framework. The Microsoft .NET framework provides excellent programming
    tools such as UI forms, templates, predefined controls, code, SQL Server development
    tools, with multiple programming languages, such as C#, F#, and Visual Basic.
    We will focus on the Common Language Runtime (CLR); C++ language, also known as
    C++/CLI, where CLI stands for Common Language Infrastructure, which is a standard
    part of the framework.


    Since the .NET framework is very large and complex—we will focus on explaining
    the multithreaded approach and synchronization of objects and techniques.


    # Managed versus unmanaged code


    You can think of a framework as a set of routines and objects that helps you create
    an application more easily and with rich content, to a variety of predefined controls
    and UI objects. When you code, at the end, you need to compile it. After compilation,
    you often get a compiled (.exe), a dynamic library (.dll), a kernel driver (.sys),
    and so on. Compiled file (or more files) contains the machine language (code)
    that consists of zeros and ones and is not readable by humans. This, by definition,
    is called unmanaged code. So, native C++ (the code that we were coding so far)
    is compiled directly into the machine language and we call it unmanaged code.
    Unlike managed code, it is fast and executed directly on Hardware Abstraction
    Layer (HAL), which provides direct interaction with the machine hardware and low-level
    execution.


    > The HAL refers to a layer of software that deals directly with your computer
    hardware. The HAL operates at a level between the hardware and the Windows executive
    services, applications and device drivers need not be aware of any hardware-specific
    information. It hides hardware-dependent details such as IO interfaces, interrupt
    controllers, and multiprocessor communication mechanisms. Applications and device
    drivers are no longer allowed to deal with the hardware directly and must make
    calls to the HAL routines to determine hardware-specific information (MSDN).


    On the other hand, unmanaged code is a bit different. It is executed over common
    language runtime, or in other layers that reside between the machine hardware
    and your application. The code you write is not compiled directly into the machine
    language. It is compiled into an intermediate language, MSIL or Microsoft Intermediate
    Language. This gives your code advantages and disadvantages.


    Let''s review the advantages. Managed code, after it is compiled into MSIL, is
    checked for various errors, as static type checking (which is not performed on
    native code compilation) and runtime checking. It offers a garbage collector,
    or the ability to free unused dynamic memory allocated by the application and
    so on. We already said that the framework provides rich programming tools, which
    we summarize everything, there are lots of advantages to using the .NET framework.


    ![](img/412b0f5bbb36adcce2ddd2d5b7416516_248_0.png)'
  merge: -1
  img_proc: true
- pgno: 249
  md: '# Chapter 6


    However, there are disadvantages too. The application developed using any framework,
    such as .NET or Java Runtime Environment (JRE), is much slower than an application
    developed using native code. This happens because managed code is executed over
    a CLR layer, which is then executed on the machine hardware. When you use a framework,
    it is easier to develop the application, but you will never have complete control
    over the application''s execution, along with its interaction with the machine
    itself. The best you can do is what the framework provides you with.


    To conclude, you should need a native approach whenever you need fast execution
    and/or complete over the application execution, while the framework should be
    whenever you need an application that targets UI and simpler development. Over
    the years, Microsoft has done an excellent job with the .NET framework, but it
    will never be able to provide everything you can do with the native approach.
    That''s why we are focusing on managed code in one chapter, and that of the chapters
    are covered with a native approach.


    Note that everything you can do with frameworks you can achieve with a native
    approach. You would need more time and more effort—but it is double. You can''t
    do everything with a managed approach, not even a part of what you can do with
    native code. To explain this better, let''s examine two scenarios. First, we need
    to create software that will control nuclear power plants. The second task is
    to create software that will use a cluster to render DVDs. The first task should
    be developed using native C++ (or the assembly language) to provide extremely
    fast and precise execution. This is because, and you would agree with me, nuclear
    energy is so sensitive thing to be taken lately. On the other hand, DVD software
    should look good (so that you can sell it), and the execution time doesn''t need
    to be in micro or nanoseconds. It is enough to be user friendly and work correctly,
    so we could use .NET to develop faster and with lesser effort.


    # How threading works in .NET


    An application that is executed on a CPU with more than one core should benefit
    from concurrent execution, with many concurrent tasks as there are logical cores
    to execute on. On course, there are many questions that need to be taken care
    of when we want to execute parallel tasks:


    +   - How to divide a set of tasks so that each of them is executed in a multicore
    environment?

    - How to ensure that the number of concurrent tasks doesn''t exceed the number
    of CPU cores?

    - If some task is stopped, such as when you wait for I/O, how to discover this
    and make the CPU execute something else waiting for I/O completion?

    - How to find out when one or more parallel operations are completed?


