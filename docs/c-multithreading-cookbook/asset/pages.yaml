    # Solving classical IPC problems


    Inter process communication is very important. Its implementation, on the other
    hand, is very complex. Operating system designers (and developers) may face various
    problems. Here, we will explain some of the most common problems.


    # The dining philosophers problem


    The definition for the dining philosophers'' problem was taken from Andrew Tanenbaum''s
    book, Modern Operating Systems Third Edition. The authors'' solution provided
    for this book is genuine.'
