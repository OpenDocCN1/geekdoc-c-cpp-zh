  md: 'The application then needs to obtain its index (philosopher name):


    ```

    int iIndex = int _tcstol( argv[ 0 ], NULL, 10 );

    ```


    After that, the philosopher has to obtain a handle to the file mapping object
    and enter the loop. In the loop, the philosopher waits for their turn by requesting
    the pass-through semaphore object. When the philosopher gets a semaphore post,
    it can obtain both forks. Then, it sends a message to update the main user interface
    with the following SendMessage API:


    ```

    SendMessage( pCommObject->hWnd, WM_INVALIDATE, 0, 0 );

    ```


    When all work is done, it can release the semaphore object and continue execution.


    # See also...


    There are other classical IPC problems such as ''Sleeping barber'' and ''Producer–Consumer
    problem''. Producer–Consumer problem will be solved later in the chapter.


    # Implementation of the thread model


    We can say the process is an object whose task is to group related resources together.
    Every process has an address space with a representation, as shown in the following.


    ![](img/412b0f5bbb36adcce2ddd2d5b7416516_89_0.png)


    This so-called process image must be loaded in the physical memory on initialization
    of CreateProcess. All resources such as file handles, information about child
    processes, pending alarms, signaling handlers, and so on are stored. They can
    be managed more easily by grouping them together in the form of a process.'
