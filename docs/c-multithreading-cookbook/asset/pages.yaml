  md: '# The Concepts of Process and Thread


    # How it works...


    We created a U pretty much similar to the Philosophers Dinner example. Routines
    myRegisterClass, InitInstance and WndProc are pretty much the same. We added FileDlg
    to ask the user the file path to read from and the file path to write to. We started
    two threads in order to read and write, respectively.


    Scheduling in operating systems is complex and a large challenge. As a result
    of either the scheduling algorithm or hardware interrupts, we could never know
    when the thread would be scheduled for execution on the CPU next: This means that
    the thread could be scheduled for execution before the thread reads. This situation
    would bring an exception, because the thread that needs to write nothing to write.


    That''s why we added an if condition in the write operation, as shown in the following
    code:


    ```

    if (dwBytesWritten < dwBytesRead)

    WriteFile(hFile, pCharTemp, sizeof(TCHAR) * BLOCK_SIZE,

    &dwFileSize, NULL);

    dwBytesWritten += dwBytesSize;

    SendMessage( hProcess, WM_STEPIT, 0, 0 );

    ```


    After a thread hits a mutex, it can perform a write operation. However, there
    is a possibility that it was scheduled before the thread that is reading, and
    the buffer might be empty. Every time the thread read gets something, it adds
    the number of bytes to read to a dwBytesRed variable, and if the thread that needs
    to write has written less bytes than read, it can write. If not, it will skip
    writing in this cycle and simply release mutex for the other thread.


    # There''s more...


    The producer-consumer problem is also known as the bounded-buffer problem. Two
    processes share a common, fixed-size buffer. One of them, the producer, puts information
    into the buffer, and the other one, the consumer, takes it out. It is also possible
    to generalize the problem to n producers and n consumers, but we only consider
    the case of one producer and one consumer because this assumption simplifies the
    solution. Trouble arises when the producer wants to put a new item in the buffer,
    but it is already full. The solution is for the producer to go to sleep, and to
    be awakened when the consumer has removed one or more items. Similarly, if the
    consumer wants empty it sleeps until the producer puts something in the buffer
    and wakes it up. This approach seems simple enough, but it leads to the same kind
    of race conditions as we saw earlier with the spooler directory. It is left to
    the reader to try similar situations using the knowledge obtained here.


