- pgno: 393
  md: '# Chapter 8


    Now, let''s explain the main application. The RemoteLoadLibrary method is used
    to create a remote thread inside the target process. First, we need to obtain
    the address of the LoadLibrary API (LoadLibraryA-multibyte version used for this
    example). This API will be used as a remote thread start with a dll name specified
    as a parameter to load. In this, we will load the specified dll into the target
    process and perform our execution inside it. After we''ve obtained the address
    of LoadLibrary, we must allocate virtual memory, using the VirtualAlloc API; insert
    target process in order to write the dll name inside. Pay attention that specifying
    the address of an array of characters in the current process is not useful in
    the target process.


    We write the dll into the target process, mapping the address of the characters
    valid inside the target process. After allocating virtual memory, we use the WriteProcessMemory
    API to perform the operation. If the operation is successful, we create a remote
    thread using the CreateRemoteThread API. We must provide the target process handle
    with correct privileges. We didn not pay attention to handle privileges because
    our application creates the target process, creating the returned handle with
    all possible threads that we would need.


    In situations where we could not create a target process, we would have to open
    an existing process, specifying the PROCESS ALL access flag as a first parameter
    for the OpenProcess API. Only the handle returned with such privileges can be
    used for the CreateRemoteThread API. After successful creation of a remote thread,
    we use the WaitForSingleObject API to wait for thread creation and return. The
    RemoteFreeLibrary method is used to start a remote thread task will be to run
    FreeLibrary with the dll passed as a parameter. In that way, a remote thread will
    unload the specified dll with the handle passed.


    Inside the application process, first, we must set the path to the compiled dll.
    This is important because the remote thread inside the target process will try
    to load the dll from the given path. This path must be absolute for successful
    loading. Next, we create a file mapping that we use to communicate with the dll.
    This is important because when we want to unload the library, we must provide
    a handle to the dll to the FreeLibrary API. A handle to the loaded dll inside
    the target process is known only after successful loading. That''s why we''re
    writing to the file mapping from the target process after the dll is attached.
    We create an event that we''ll use the dll to signal the main application that
    it is written to the file mapping and the dll can be unloaded. Then we''ll start
    the calculator using the CreateProcess API. If a process is created we wait for
    its initialization specifying 0.5 second in the WaitSingleObject API. Then we
    try to create a remote thread and wait for an event object. After the event is
    set to the signaled state, we can unload the library using RemoteFreeLibrary and
    close all used handles.'
  merge: -1
  img_proc: true
