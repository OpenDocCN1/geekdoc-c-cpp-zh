- pgno: 153
  md: "# Synchronization object – critical section\n\nA critical section performs\
    \ the same function as a mutex, except that a critical section can't be shared.\
    \ It is visible only within a single process. Both the critical section and the\
    \ mutex allow only one thread to own it, but critical section works much faster\
    \ and with less overhead.\n\nThe routines that operate with critical sections\
    \ do not use the same terminology as the ones that work with a mutex, but they\
    \ do mostly the same thing.\n\nUnlike other objects that have been waiting for\
    \ one of the wait functions, the critical section object works in different way.\
    \ The critical section object enters its unsignaled state.\n\nAfter it is released,\
    \ the critical section object enters its signaled state.\n\nIn order to use the\
    \ critical section, first we need to declare it:\n\n```\nCRITICAL_SECTION cs;\n\
    ```\n\nAfter that, we need to initialize it:\n\n```\nvoid WINAPI InitializeCriticalSection(\n\
    \    LPCITICAL_SECTION lpCriticalSection\n);\n```\n\nThen, we can use it by asking\
    \ a thread to enter the critical region by calling the EnterCriticalSection or\
    \ TryEnterCriticalSection API:\n\n```\nvoid WINAPI EnterCriticalSection(\n   \
    \ LPCITICAL_SECTION lpCriticalSection\n);\nBOOL TryEnterCriticalSection(\n   \
    \ LPCITICAL_SECTION lpCriticalSection\n);\n```\n\nAfter the thread finishes its\
    \ task, it must leave the critical region by calling the LeaveCriticalSection\
    \ API:\n\n```\nvoid WINAPI LeaveCriticalSection(\n    LPCITICAL_SECTION lpCriticalSection\n\
    );\n```\n\nAfter that, it needs to free the resources by calling the DeleteCriticalSection\
    \ API:\n\n```\nvoid WINAPI DeleteCriticalSection(\n    LPCITICAL_SECTION lpCriticalSection\n\
    );\n```"
