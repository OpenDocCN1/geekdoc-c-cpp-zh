  md: 'The meaning of the operators can be defined even for user-defined types, such
    as CComplex in the previous example. It is very hard, as you saw, because it is
    more meaningful to write c = c1 + c2, where, c1, and c2 are complex numbers, to
    write c = ComplexAdd( c1, c2 ).


    The user must implement the operator functions or overload them for the compiler
    in order to know how to deal with user-specific types. The compiler knows how
    to do with primitive types, as adding two integers, but imagine matrices m1 and
    m2 and the expression matrix m = m1 + m2. Well, if do not define the CMatrix operator
    + (const CMatrix& m1, const CMatrix& m2) function, the compiler won''t know what
    to do because it doesn''t know how to add matrices.


    Overriding a method is a feature that allows a derived class to provide a specific
    implementation of a method that is already provided in the base class. Take a
    look at the WhoAmI method from the previous example. Its output will be as follows:


    +   - I am a person

    - I am a worker

    - I am a student


    Even though a method from each class has the same name, it is a different method
    and a different functionality. We can say that the WhoAmI method is overridden
    in the CPerson class.


    # There''s more...


    Overriding is an excellent feature in OOP and C++, polymorphism is even better.
    Let''s review the following example.


    # Understanding polymorphism


    Polymorphism is a feature where an object executes an operation in the way that
    it is implemented in the derived class that it belongs to, even if we access it
    through a pointer or a reference of the base class. Polymorphism is a feature
    that allows an object to take many forms.


    # Getting ready


    Make sure Visual Studio is up and running.


    # How to do it...


    Perform the following steps:


    +   1. Create a new default console application. Name it PolymorphismTest.'
