- pgno: 135
  md: '# Chapter 3


    The Join method sets the STATE_READY flag and wait for the thread object to become
    signaled, until the dwWaitInterval expires. The dwWaitInterval parameter is set
    to INFINITE by default.


    The Suspend and Resume methods suspend and resume the thread respectively. The
    STATE_BLOCKED flag is set in Suspend and in Resume. The thread class has the lpUserData
    attribute assigned for the future user-specific data to be set if necessary. The
    SetUserData and Get methods set and get the user data respectively. The GetAsyncState
    method returns the object asynchronous response.


    The GetState and SetState methods get and set the dwState value or object state
    respectively. It is meant for additional object state change.


    The Alert method changes the event''s state to signaled. It is meant for a situation
    WHERE STATE_CONTINUOUS is used. If a thread is meant to run a continuous task,
    there has to be some mechanism to stop the thread in a normal manner. So when
    we have one or more threads running continuously, we only have to call Alert from
    one instance. It will alert all the threads to stop continuous work and return.


    As the class member functions (methods) have a first implicit argument (not shown)
    this, we must declare the StartAddress method as static. However, we can pass
    the object address (the this pointer) to the StartAddress method and make it behave
    a non-static method using the pure virtual function, Run.


    The GetId and GetHandle methods return a unique thread identifier and a thread
    handle respectively. The methods are implemented as inline routines.


    # There''s more...


    We were following the object-oriented approach very precisely in the previous
    thread implementation due to code reuse and simplicity of programming. The following
    topic will demonstrate the use of CThread with very little difficulty.


    # Implementing threads without synchronization


    In a lot of situations, parallel tasks need to occur depending on each other.
    Such situations could have happened in an application with more user-interface
    dialogs. For example, on a primary application window, there is a list view with
    customers shown. On another application window (or application tab), there is
    a list view with products shown. When we start such an application, it would be
    foolish to load the customers first and then the products. We can start two threads,
    each responsible for loading the object from the database (the first thread would
    load the customers, and the other would load the products).


