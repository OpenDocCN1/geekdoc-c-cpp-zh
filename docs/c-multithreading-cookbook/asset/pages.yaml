    ```\n\nprivate:\n  static const int N = 25;\n  // additional fields\n\nThe use\
    \ be as follows:\n\n```\nWorker^ worker = gcnew Worker();\nworker->RunWorkerAsync(\
    \ worker );\n```\n\n# # Interrupting, aborting, and safe canceling the thread\
    \ execution\n\nSome tasks require ways to forcibly interrupt the execution of\
    \ the thread. In our previous examples, we've used the Task and BackgroundWorker\
    \ objects due to their background operations and the ability to be forcibly closed\
    \ on exiting the application. Now, let's explain the .NET features that target\
    \ normal thread interruption and safe cancellation. Each blocking method will\
    \ block the thread forever unless some blocking condition is met or the timeout\
    \ is not set. However, sometimes, you need to cancel thread execution and may\
    \ continue the execution of the application without allowing the thread to continue.\
    \ In other situations, you need to cancel the thread, for example, user input.\
    \ The methods for ending a thread are Interrupt and Thread::Abort.\n\nWhen you\
    \ call Interrupt, the thread's execution continues until it is blocked the next\
    \ time, at which point a ThreadInterruptedException is thrown, while calling an\
    \ interrupt on a blocked thread terminates it and again throws ThreadInterruptedException.\
    \ The Abort method has an effect on non-blocked threads, you should almost always\
    \ use Abort instead of Interrupt. When you use the Abort method, a similar exception\
    \ is thrown: ThreadAbortException. The Abort and Interrupt methods are not considered\
    \ safe. This is because if you have an unmanaged code execution inside the thread\
    \ routine, when you use Abort, the execution will continue as far as the next\
    \ managed code statement is executed. On the other hand, Interrupt won't affect\
    \ execution until the thread is blocked."
