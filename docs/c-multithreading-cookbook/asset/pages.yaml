  md: '# How it works...


    Let''s explain the header files first. In the main.h file, we include the necessary
    Windows headers. Then we create the CBankAccount class in CBankAccount.h. We''ll
    use this class as an abstraction of a bank account object. We implement two helper
    classes too: Clock and CParameters. The Clock class implements a simple locking
    mechanism providing exclusive access from the Lock object The CParameters class
    is used for parameter passing to the working thread.


    The CBankAccount class implements the bank account object. It has the uID attribute
    used for the account ID, dBalance used for the fund account, and sLock used for
    the lock name. It has two constructors: the first where you can set only the balance,
    while the lock name will be generated by the LockName method; the second where
    both balance and lock name. It has two static methods: NewId and Transfer. The
    NewId method is used for generating a thread ID while Transfer is used for transferring
    actual funds from one account to another. The Lock method can be used for obtaining
    the current lock name from any account. The Transfer method tries to acquire a
    lock on the first account called fromAccount. When account is acquired, it tries
    to acquire another lock—this time on an account called toAccount. When both accounts
    are locked, adding the requested amount to toAccount. If the transfer has been
    done successfully, the method returns i while for an unsuccessful transfer—in
    a situation where the balance is less than the requested amount—the method returns.


    Furthermore, in CThread.h, we implement the CThread class. The CThread object
    will be used in the thread pool as an abstraction of the working object. It has
    the lpThreadStart attribute used for the thread start address, hThread used for
    thread handle, dwThread used for thread ID, and dwExitCode used for thread exit
    code. It implements one where the exit code is set to zero when lpThreadStart
    points to actual start address constructor by user. In default, we''ll query if
    the thread is still alive using the StillAlive method and if call the TerminateThread
    API and close the thread handle. The Start method creates the thread and (if provided)
    passes a parameter to its start address. As mentioned before, the StillAlive method
    compares the STILL_ACTIVE macro with the ExitStatus return value, and returns
    a Boolean value. The Handle and ThreadId methods return a handle to the thread
    and thread ID respectively. The ExitStatus method calls the GetExitThread API
    to obtain its exit code or'
