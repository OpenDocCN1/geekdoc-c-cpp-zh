  md: '# How it works...


    When we call the CreateWindow Or CreateEx function, the system sends a WM_CREATE
    message to the window message queue before the function returns. The procedure
    of the window receives a message only after the window is created and also before
    the window becomes visible. That''s why we need to create an event before a call
    to CreateWindow.


    WhenWindowProcedure receives a WM_CREATE message, we will set the main thread
    priority to NORMAL (which is default) and then we''ll create another thread, responsible
    for drawing. After that thread is created, we will associate its identifier into
    the window for user-specific data that belongs to the window using the following
    code:


    ```

    SetWindowLongPtr(hwnd, GWLP_USERDATA, (LONG_PTR)dwThreadId);

    ```


    Then main thread waits in order for a newly created thread to start execution,
    and after that its handle can be called. Now, let''s examine the StartAddress
    routine. The main window handle is passed as an argument, so we need to cast the
    LPVOID to the thread type. We will set the thread priority to one step below NORMAL
    (THREAD_PRIORITY_BELOW_NORMAL) because it is necessary that the main thread has
    at least one higher priority than the drawing thread. Let''s explain this: suppose
    a user expects an application to be responsive at all. In this example, our working
    thread has a very simple job to execute: it draws rectangles, with a 0.1 second
    pause between each 10 rectangles. In another situation, where the drawing thread
    should call a Fourier series with large number of iterations, the application
    won''t be responsive if the thread has lower or equal priority than the main thread.
    This happens because the dispatcher selects the next thread for execution, based
    on its priority and scheduling algorithm. If the main thread has more priority
    and the application won''t be responsive to the user input immediately. It will
    still process the user input, but after the working thread gets it time into CPU,
    which will result in slow application behavior. After setting its priority, the
    thread enters an infinite loop where it draws rectangles until the user closes
    the application.


    > A Fourier series is a representation of a periodic function usually presented
    as an infinite sum of sines and cosines. It has many applications in graphics,
    speech recognition, handwriting, and so on.


    Let''s focus on the DrawProc drawing routine. After calling the rand function
    to reseed the random generator, we need to obtain a context to draw. Then we will
    take coordinates, which are within the boundaries of the application window and
    a random color to draw an actual rectangle. The GetNextSeed routine sets the seed
    value to the current timestamp, when called for the first time, as static variables
    are initialized only once, and after that, we''ll simply increment its value by
    ensuring a unique value time.


