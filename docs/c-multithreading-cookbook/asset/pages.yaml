- pgno: 61
  md: '# Chapter 2


    | | | | |

    |---|---|---|---|n| Process | D | | |

    | | C | | |

    | | B | | |

    | | A | | |



    As we said earlier, in any traditional operating system, each process has an address
    space and a single thread of control. We have many situations where multiple threads
    are executing in the address space of a process, running in a quasi-parallel context
    as they were separate processes. The main reason to have the threads is that in
    many applications, multiple operations are executed at once. Some of these operations
    may wait (block) for some time. By decomposing an application into multiple threads
    in a quasi-parallel context, the programming model becomes simpler. By adding
    threads, the operating system provides us with a new feature: the ability for
    threads to share an address space and all of its data among themselves is essential
    for concurrent execution.


    # # Explaining the process model


    Traditional operating systems must provide a way to create and terminate processes.
    There are four principal events that cause processes to be created; they are as
    follows:


    +   - System initialization

    - Execution of a process-creation system call by a running process

    - A user request to create a new process

    - Initiation of a batch job


    After the operating system has been started, several processes are created. Some
    of these are foreground processes. They are processes that interact with users
    (humans) and perform work for them. Others are background processes that are not
    associated with any particular user but, instead have specific functions. For
    example, one background process may be designed to accept incoming e-mails; it
    might sleep most of the day but suddenly come to life when an e-mail arrives.
    Background processes usually handle activities such as e-mails, printing, and
    so on.


    In Windows, a Win32 function call, CreateProcess, handles both process creation
    and loading process context. You can find more about CreateProcess on MSDN (http://msdn.microsoft.com/en-us/library/windows/desktop/ms682425%28v=vs.85%29.aspx),
    but we will demonstrate basic process creation and synchronization in the following
    example.'
