  Rob Napier 是一位树木屋建造者、徒步者和一位自豪的父亲。他从 2005 年开始为 Mac 开发程序，并在第一个 SDK 发布时开始接触 iPhone\
  \ 开发，曾参与过如《The Daily》PandoraBoy 和 Cisco Mobile 等产品的开发。他是 Stack Overflow 的主要贡献者，并维护着\
  \ Cocoaphony 博客 ([cocoaphony.com](http://cocoaphony.com))）。\n\nMugunth Kumar 是一位居住新加坡的独立\
  \ iOS 开发者。他于 2009 年毕业，拥有新加坡南洋理工大学的硕士学位，主修信息系统。他在博客（[blog.mugunthkumar.com](http://blog.mugunthkumar.com)）上撰写关于移动开发、软件易用性和\
  \ iOS 相关的教程。在从事 iOS 开发之前，他曾在世界 500 强公司通用电气（GE）和霍尼韦（Honeywell）担任 Windows 和 `.NET`\
  \ 平台的软件顾问。他感兴趣的核心领域包括编程方法论（面向对象和函数式）、移动开发和易用性工程。如果他不写代码，他可能会出现在某个异域，捕捉大自然的风景风光。\n\
  \n# 关于技术编辑\n\nMithilesh Kumar 是一位软件工程师，对用户界面设计、互联网协议和虚拟世界充满热情。他喜欢为 iOS 和 Mac OS\
  \ X 平台构建并构建应用程序。他在为具有语音、视频、即时消息、在线状态和语音信箱功能的电话客户端开发 UI 和核心组件方面拥有丰富经验。\n\nMithilesh\
  \ 毕业于弗吉尼亚理工大学，获得计算机科学硕士学位，重点研究方向为人机交互。在读研期间，他在用户界面、计算机图形和网络协议领域合著了多篇研究论文。\n\n# 作者致谢\n\
  \nRob 感谢他的家人放弃了许多晚上，那些晚上他待在地下室写作、编写黑客或因各种原因没能上楼。Mugunth 感谢他的父母和朋友在写本书期间的支持。感谢 Wiley\
  \ 让这本书成为可能。过程非常顺利，特别是得益于 Sara Shlaer 的持续指导。感谢 Mithilesh Kumar 确保了我们说的话都是真实的，感谢 Tom\
  \ Dinse 确保了内容通俗易懂。感谢 Chris Katsaropoulos 最初联系我们并启动了该项目。感谢 Apple 的工程师在开发论坛上解答了所有仍在保密协议（NDA）下的问题，感谢分享了如此多的整个\
  \ iOS 开发者社区。特别感谢 Steve Jobs 为我们创造了可以以此建立事业的“玩具”。\n\n\nApple 的发布历史一直在以用户为中心和以开发者为中心之间交替。iOS\
  \ 5 的好消息是它完全是为了开发者设计的。仅仅是自动引用计数（`ARC`）的加入就值得开发者进行升级。通过这一举，Apple 消除了 iOS 应用崩溃的首要原因，同时让代码更容易编写、运行更快。迁移到\
  \ `ARC` 是你为应用程序所能做的最好的事情。它是自自动释放池（autorelease pool）以来最重要的 Objective-C 特性。\n\n但 iOS\
  \ 5 还为开发者增加了许多功能。从 iCloud 到自动数据保护，操作系统现在处理了更多难题，让开发者能够专注于制作最棒的 App。\n\n对开发者来说最明显的是新的\
  \ `Xcode`。它有些变得更好了，有些只是不同了，而有些会让你抓狂。不过，它是现在的新游戏规则，每个人都需要适应它。本书将帮助你理解它。\n\n如果你准备好迎接\
  \ Apple 的最新发布并将你的应用程序推向极限，这本书将带你实现目标。\n\n## 本书适合读者\n\n这不是一本入门级书籍。市上有许多书可以教你 Objective-C\
  \ 并带你一步步学习 Interface Builder。这不是那样的书。本书假设你已经有一定的 iOS 经验。也许你是自学成才，也许你上过课。你可能已经写过至少一个应用程序的大部分功能，即使你还没有提交它。如果你准备好超越基础，学习作者们从编写真实应用程序的实践经验中学到的最佳实践和秘密，那么这本书就适合你。\n\
  \n这本书也不仅仅是一份配谱列表。这里有大量的示例代码，但重点在于学习如何设计、编码和维护出色的 iOS 应用。书中很大一部分内容是关于“为什么”而不仅仅“如何做”。你对设计模式和编写可重用代码的了解将与语法和新框架的知识一样多。\n\
  \n所有示例都使用 `Xcode 4`。如果你还不熟悉 `Xcode 4`，不要担心。第 2 章专门用于带你进入状态。\n\n## 本书涵盖内容\n\niOS\
  \ 平台始终向前发展，本书也是如此。这里的大多数示例都需要 `iOS 5`。所有示例都使用了自动引用计数（`ARC`）。除极少数几个地方外，本书将不涵盖向后兼容。如果你已经发布代码足够久而需要向后兼容，你可能知道如何处理它。本书关于如何使用所有可用功能来编写最好的应用程序。\n\
  \n本书专注于 `iPhone 4` 和 `iPad 2`。这里的大多数主题适用于原始 `iPad`、iPod touch、`iPhone 3GS` 和 Apple\
  \ TV。在写作时，`iPhone 5` 和 `iPad 3` 尚未发布，但这里的一切都应该适用于它们。第 12 章专门处理平台之间的差异。\n\n# 本书的结构\n\
  \niOS 拥有一套极其丰富的工具，从 `UIKit` 等高层框架到像 `Core Text` 这样底层的工具。通常，实现一个目标有方法。作为开发者，你如何为任务选择合适的工具？\n\
  \n本书将日常工具与特殊用途工具分开，帮助你选择正确的解决方案。你将学习每个框架为什么存在，它们之间如何联系，以及何时选择其中一个而不是另一个。然后你将学习如何充分利用每个框架来解决其类型的问题。\n\
  \n本书分为四个部分，从最常用的工具到最强大的工具：\n\n### 第一部分：新特性？\n\n\n第 1 章：全新功能 —— iOS 增加了许多新功能，在这里你对可用功能有一个快速概述。\n\
  \n第 2 章：熟悉 Xcode 4 —— Apple 最近重新设计了 Xcode 界面，这可能需要时间适应。这一章将向你如何利用它。\n\n### 第二部分：充分利用日常工具\n\
  \n作为 iOS 开发者，你遇到过各种常用工具，从通知到表格视图到动画层。但你充分利用它们的潜力了吗？在这一部分，你将从资深开发者那里学习 Cocoa 开发的最佳实践。\n\
  \n第 3 章：日常 Objective-C 如果你准备好在 Objective-C 上提升一个水平，本章将向你介绍经验丰富的开发者每天使用的改进应用程序设计、维护和重用性的工具。\n\
  \n第 4 章：松手握：Cocoa 设计模式 —— Cocoa 依赖于许多常见且一致的设计模式。你将学习这些模式，以便像 Apple 一样解决问题。\n\n第\
  \ 5 章：正确使用表格视图 —— 表视图可能是 iOS 中最复杂且常用的 UI 元素。它们在设计上简单优雅，但对于不理解工作原理的开发者来说却很困惑。你将学习如何正确使用它们，并解决诸如无限滚动等特殊问题。\n\
  \n\n\n\n\n## 第 6 章：更好的绘制\n自定义绘制对许多新开发者来说令人生畏，但它是构建美观且快速的用户界面的关键部分。你将发现从 `UIKit`\
  \ 到 `Core Graphics` 的可用绘制选项，以及如何优化它们，使其在保持快速的同时呈现最佳效果。\n\n## 第 7 章：像洋葱一样的层：Core\
  \ Animation\niOS 设备拥有不可惊叹的动画设施。凭借强大的 GPU 和高度优化的 `Core Animation`，你可以构建引人注目、精彩且直观的界面。在本章中，你将超越基础，学习动画的秘密。\n\
  \n# 第 8 章：对付那些讨厌的错误\n你尝试编写完美的代码，但有时还是会出错。应用程序对意外情况的反应方式决定了普通应用与卓越应用的区别。你将学习错误处理的常见模式、如何记录日志，以及如何让你的代码对意外情况更具韧性。\n\
  \n# 第三部分：工作所需的正确工具\n有些工具几乎出现在每个应用程序中，而有些工具你只需要偶尔使用。在本节中，你将学习那些更具专业性的工具和技术。\n\n##\
  \ 第 9 章：控制多任务\n多任务是许多应用程序的重要部分，你将学习如何在应用程序运行以及处于后台时同时处理多件事。\n\n## 第 10 章：给疲者的 REST\n\
  基于 REST 的服务是现代应用程序的支柱，你将学习如何在 iOS 中最好地实现它们。\n\n今天，用户安全和隐私至关重要，你将学习如何使用 `keychain`、`certificates`\
  \ 和加密保护你的应用程序和用户数据免受攻击。\n\n## 第 12 章：在多个 iPlatforms 和 iDevices 上运行\n随着 iPod touch、`iPhone`、`iPad`、Apple\
  \ TV 以及不断涌出的新版本，iOS 的格局每年变得更加复杂。仅仅“编写一次，到处运行”是不够的。你需要你的应用程序在任何地方都处于最佳状态。你将学习如何使应用适配硬件，并充分利用每个平台。\n\
  \n## 第 13 章：国际化与本地化\n虽然你现在可能只想关注单一市场，但你可以做一些小事，为明天向全球市场的过渡提供便利。在不中断今天开发的情况下，以后节省金钱并避免烦恼。\n\
  \n## 第 14 章：通过应用内购买超越销售\n应用内购买（In App Purchases）对许多开发者来说仍然是一个未开发的市场。用户喜欢附加内容，开发者也喜欢额外收入。你将学习在你的应用程序中实现这一重要功能的最佳方法。\n\
  \n# 第四部分：推向极限\n这一部分是本书的核心。你已经学习了基础，学习了日常操作。现在，使用可用的最先进工具来推向极限。你将学习深度 iOS 的奥秘。\n\n\
  # 第 15 章：Cocoa 最大的技巧：键值观察 (KVO)\nApple 许多最强大的框架都依赖 `KVO` 来实现性能和灵活性。你将学习如何利用 `KVO`\
  \ 的灵活性和速度，以及使其如此透明的诀窍。\n\n# 第 16 章：与众不同：Blocks 和函数式编程\n许多开发者仍在吸收 `Objective-C` 添加的\
  \ `blocks`。它们对于与 Apple 框架的交互非常有价值，但也开启了思考你程序的新方式。拥抱新风格，并在你的下一个项目中最大化其收益。\n\n## 第\
  \ 17 章：离线运行\n\n# 第 18 章：花哨的文本布局\n从 `UIKit` 到 `Core Text`，iOS 充满了显示文本的方法。在 iOS 中显示富文本没有完美的解决方案，因此学习权衡非常重要，这样你就能选择正确的方案并正确地它。\n\
  \n## 第 19 章：构建（核心）基础\n当你想要 iOS 上最强大的框架时，你会想要像 `Core Graphics`、`Core Animation` 和\
  \ `Core Text` 这样的 `Core` 框架。所有这些都依赖于 `Core Foundation`。在本章中，你将学习如何处理 `Core Foundation`\
  \ 数据类型，以便利用 iOS 提供的一切。\n\n## 第 20 章：深度 Objective-C\n当你准备好揭开 `Objective-C` 真正工作原理的面纱时，这一章适合你。你将学习如何直接使用\
  \ `Objective-C runtime` 来动态修改类和方法。你还学习了 `Objective-C` 方法调用是如何分发到 `C` 函数调用的，以及你如何控制系统以惊人的方式扩展你的程序。\n\
  \n你可以跳读本书以以关注你最需要的话题。每一章都是独立的，但那些需要 `Core Foundation` 数据对象的除外（特别是 `Core Graphics`、`Core\
  \ Animation` 和 `Core Text`）。这些章节会在你需要相关信息时引导你查阅第 19 章“构建（核心）基础”。\n\n## 使用本书所需的条件\n\
  书中的所有示例都是在 `Mac OS X 10.7` 和 `iOS 5` 上使用 `Xcode 4.2` 开发的。你需要 Apple 开发者账户来访问大多数工具和文档，并且需要许可证可以在\
  \ iOS 设备上运行应用程序。访问 `http://developer.apple.com/programs/ios` 进行注册。\n\n书中的大多数示例将在\
  \ `Xcode 4.2` 自带的 `iOS Simulator` 中运行。你可以在没有 Apple 开发者许可证的情况下使用 `iOS Simulator`。\n\
  \n`Xcode 4.2` 在 `Mac OS X 10.6` 和 `10.7` 之间很少，因此所有示例都适用于 10.6。\n\n## 查找 Apple 文档\n\
  Apple 在其网站和 `Xcode` 提供了丰富的文档。URL 经常变化且通常很长。本书通过标题而非 URL 来引用 Apple 文档。要在 `Xcode`\
  \ 中查找文档，按下 `Cmd-Option-?` 或点击 `Help → Documentation and API Reference`。在 `Documentation\
  \ Organizer` 中，点击搜索图标，输入文档名称，然后从搜索结果中选择文档。参见图 1 关于搜索 Coding for Cocoa 的示例。\n\n![97811961321-unin01.eps](img/97811961321_fmt.jpeg)\n\
  \n图 1 搜索 Coding for Cocoa\n\n要在 Apple 开发者站点查找文档，请访问 `apple.com`，点击 `Member Center`\
  \ 并登录。选择 `iOS Dev Center`，并在 `Search Developer` 框中输入文档标题。\n\n在线文档与 `Xcode` 文档通常相同。可能会收到\
  \ iOS 和 Mac 的结果。确保选择 iOS 版本。许多 iOS 文档是 Mac 版本的副本，有时包含 iOS 上不可用的函数调用或常量。本书将指导你哪些功能可用。\n\
  ## 源代码\n在学习书中的示例时，你可以选择手动输入所有代码，或使用随书提供的源代码文件。书中使用的所有源代码均可在 `www.wrox.com/go/ptl/ios5programming`\
  \ 下载。例如，你可以在线第 18 章文件夹、`SimpleLayout` 项目以及 `CoreTextLabel.m` 文件中找到以下示例代码：\n\n```objc\n\
  CoreTextLabel.m (SimpleLayout)\n\n- (id)initWithFrame:(CGRect)frame {\n  if ((self\
  \ = [super initWithFrame:frame])) {\n    CGAffineTransform\n    transform = CGAffineTransformMakeScale(1,\
  \ -1);\n    CGAffineTransformTranslate(transform,\n                          0,\
  \ -self.bounds.size.height);\n    self.transform = transform;\n    self.backgroundColor\
  \ = [UIColor whiteColor];\n  }\n  return self;\n}\n```\n\n\n\n书中展示的一些代码片段并不完整，其目的是帮助你理解该章节。对于这些情况，你应该参考网站上提供的文件以获取完整的源代码。\n\
  \n# 第一部分：新特性有哪些？\n\n## 第 1 章 全新内容\n\n## 第 2 章 熟悉 Xcode 4\n\n# 第 1 章 全新内容\n\n2007\
  \ 年，已故的史夫·乔布斯在 Macworld 大上宣布，运行在 iPhone 上的软件至少领先竞争对手五年。自最初发布以来，苹果每年都对操作系统进行迭代，甚至将\
  \ iPad 和 Apple TV 这两个新设备加入到运行该系统的产品列表中。由于该操作系统被定制用于运行除 iPhone 以外的更多设备，它被重新命名为 iOS。今天，它已经有近\
  \ 5 年的历史了，而 iOS 5 无疑是 iOS 自发布发布以来最大的更新，可能让该软件再次领先竞争对手五年。\n本书是关于基于 iOS 5 编程的。这本书面向中、高级\
  \ iOS 开发者，与大多数书籍不同，它涵盖了 iOS 开发的高级主题。你学习的不仅仅是框架和 iOS SDK 中提供的功能，而是学习如何充分利用这些功能来帮助将你的\
  \ App 提升到下一个水平。本章简要描述了书中详细介绍的新特性，并告诉你在哪些章节中讨论了它们。\n\n### iOS 的历史\n\n第二个版本 `iPhone\
  \ OS 2` 是第一个拥有公共 SDK 的。从那时起，随着操作系统的每次发布，苹果都引入了多项主要功能和许多细小的 API 变化。本节简要介绍了 iOS 的历史。本章的其他部分提供了\
  \ iOS 5 新内容的概述。\n\n`iPhone OS 3` 将 Core Data 从 Mac 引入了 iPhone。其他新增包括 Apple 推送服务（Push\
  \ Notification Service）、外部配件包（External Accessory Kit）、通过 `StoreKit.framework` 进行应用内购买、应用内邮件页、允许开发者在\
  \ App 中嵌入 Google Maps 的 `MapKit.framework`、对 iPod 库的只读访问以及钥匙串数据共享。OS 3.1 增加了视频编辑器支持，这是一个小更新。`iPhone\
  \ OS 3.2` 增加了 Core Text、手势识别器、文件共享和 PDF 生成支持，这是另一个小（却意义重大）更新。OS 3.2 还增加了一个全新的产品\
  \ iPad，支持开发在 iPad 上运行的 App，以及运行在 iPad (3.2) 和 iPhone (3.1.3) 上的通用 App。3.2 仅限 iPad，不在\
  \ iPhone 或 iPod touch 设备上运行。\n\n`iPhone OS 4`（重命名为 `iOS 4`）引入了期待已久的多任务支持、本地通知、日历只读访问（Event\
  \ Kit 框架，`EventKit.framework`）、blocks、GCD、应用内消息编辑器（SMS）以及 Retina 显示支持。此版本仅限 iPhone，不支持为\
  \ iPad 开发 App。小更新 `iOS 4.2` 统一了 iPhone 和 iPad 的操作系统。\n\n## 新特性\n\niOS 5 引入了几个重要特性，如\
  \ iCloud、自动引用计数（ARC）、Storyboards、内置 Twitter 框架以及其他若干细微功能。接下来的几节将向你介绍 iOS 5 中新增的关键特性以及详细讨论它们的章节，并且我将在那里提供关于如何将你的\
  \ App 提升到下一个水平的指导。\n\n### iCloud\n\niCloud 是苹果提供的一种全新云服务。iCloud 与竞争的类似产品不同之处在于它更像是一个云服务，而不是云存储。开发者一直使用第三方服务来在多个设备间同步数据。Dropbox\
  \ 是这些服务中最流行的；然而，即使是 Dropbox API 版本 0（本文编写时的最新版本），也不支持冲突处理，这对于数据完整性至关重要。虽然 Dropbox\
  \ 有冲突解决机制，但它并没有通过 API 暴露给开发者。相反，iCloud 支持文件存储，并在 iOS 5 SDK 中内置了冲突解决机制。\n\niCloud\
  \ 还支持在云端存储键值数据，这对于需要同步设置和其他类似数据的 App 来说已经足够。\n\niCloud 不仅仅是云端硬盘。将 iCloud 视为恰好支持数据存储的云服务。\n\
  \niOS 5 增加了几个新的 API 来添加 iCloud 支持：\n\n- `UIDocument`（与其 Mac 上的兄弟 `NSDocument` 非常相似）\n\
  - `UIManagedDocument`，用于管理你的 Core Data \n\niCloud 将在第 17 章详细介绍。\n\n### LLVM 3.0\
  \ 编译器\n\nLLVM（低级虚拟机）是一个部分由苹果资助的新型编译器项目。虽然在技术上不属于 iOS 5 的一部分，但开发者应该具备 LLVM 中可用新功能的知识。改进的自动补全和更快的编译只是\
  \ LLVM 新特性的的一部分。在第 2 章中，你将学习 LLVM 的特性以及 LLVM 如何增强 Xcode 4 的功能。\n\n### 自动引用计数\n\n\
  iOS 5 的另一个重要特性是自动引用计数（ARC）。它是由新的 LLVM 编译器提供的编译器级特性。这意味着你可以在不将最低 SDK 支持提高到 iOS 5\
  \ 的情况下使用它。ARC 可用于目标为 iOS 4 及更高版本的 App，Xcode 4.2 还提供了使用 `Convert to Objective-C ARC`\
  \ 工具将你的代码迁移到使用 ARC 的支持。随着新的 LLVM 编译器逐渐成为主流，ARC 将取代目前的 `retain/release` 内存管理。\n\n\
  自动引用计数并不像 Mac OS X 从 10.5（猎豹座）版本开始提供的垃圾回收。垃圾回收是自动内存管理。这意味着开发者不再需要为每个 `retain` 语句编写匹配的\
  \ `release`。编译器会自动为你插入它们。\n\nARC 添加了两个新的生命周期限定符——`strong` 和 `weak`，它还施加了新规则，例如你不能再对任何对象调用\
  \ `release` 或 `retain`。这也适用于自定义的 `dealloc` 方法。使用 ARC 时，你的自定义 `dealloc` 方法应该只释放资源（文件或端口），而不是实例变量。\n\
  \nARC 将在第 3 章详细介绍。\n\n### Storyboards——画出你的流程\n\nStoryboards 是设计用户界面的新方法。在 iOS 5\
  \ 之前，你使用 Interface Builder nib 文件逐个定义视图器的 UI。通过 Storyboards，你可以在一个文件中定义 App 的完整\
  \ UI 流程，包括不同视图控制器之间的交互。\n\n你可以使用 Storyboards 定义你 App 中所有的视图控制器。你不需要创建多个 Storyboards，也不必担心性能。Interface\
  \ Builder 构建工具会自动将你的 storyboard 文件拆分并在运行时单独加载，而不会影响性能。\n\n在 iOS 5 上，story 替换了 `MainWindow.xib`\
  \ nib 文件（以及可能的其他视图控制器的 nib 文件）。Xcode 4.2 中的新项目模板有助于创建 storyboard。你也可以向旧项目添加 storyboard，并可以通过向\
  \ `Info.plist` 文件添加条目将其设置为主 storyboard。\n\nStoryboard 与 ARC 不同是 iOS 5 特有的功能，使用 storyboard\
  \ 意味着你需要将最低系统提高到 iOS 5。\n\n你将在第 5 章中学习更多关于 storyboard 的知识。\n\n### UIKit 自定义——外观代理\n\
  \n\n\n\nApple（甚至微软）一直反对 UI 自定义，或称为主题化。它们的理由是主题化会让使用户难以理解用户界面。相比之下，Web 在这一领域引发了巨大的革命，这也影响了最新版本的\
  \ iOS。从 iOS 5 开始，一些像 `Reminders`（备忘录）这样的原生应用获得了丰富的自定义支持。在 iOS 5 中，`UIKit` 元素的大多数属性都可以自定义。这包括\
  \ `backgroundColor`、`tintColor` 等许多属性。如果 `UIView` 子类实现了 `UIAppearance` 协议，则支持此类自定义。该协议还允许基于包含的视图进行自定义。例如，当你的自定义视图位于导航栏内时，你可以设置不同的色调。\n\
  \n第 5 章涵盖了 UI 自定义。\n\n## Twitter 框架与 Accounts 框架\niOS 5 将 Twitter 体验直接集成到操作系统中。这意味着从你的应用发送推文就像使用内置邮件表发送电子邮件一样简单。该框架还为你处理了身份验证，这意味着你不再需要自己进行\
  \ `oAuth/xAuth` 认证。iOS 5 上的 Twitter 框架与 `Accounts` 框架集成以提供账户认证。截至本文撰写时，Twitter 是\
  \ iOS 5 上原生支持的唯一第三方身份验证系统。但通过观察 Twitter 框架和 `Accounts` 框架的解耦设计，未来可能会引入额外的服务。虽然使用这些框架有一些优势，但它仍然是\
  \ iOS 5 特有的功能，这意味着使用它要求你将应用限制在运行 iOS 5 及更高版本的设备上。此外，当你通过 iOS 发送推文时，你将无法自定义发送者（通过文本）。因此，你的推文将以“via\
  \ iOS”的形式发送。（参见图 1-1.）\n\n![9781119961321-fg0101.eps](img/9781119961321-fg0101_fmt.jpeg)\n\
  \n© Twitter 2011\n\n图 1-1 来自 Twitter.com 的截图，显示了“via”文本\n\n当你在 Twitter 上创建一个应用程序时，你可以为它命名，这样当你使用该应用的凭据发布推文时，它的名称就会出现在“via”文本中。iOS\
  \ 5 内置的 `Twitter.framework` 不允许设置此文本，因此如果你考虑使用 Twitter 来增加品牌的影响力，你可能需要在品牌建设与开发便利性之间进行评估。\n\
  \n使用新的 `Twitter.Framework` 为你的应用添加 Twitter 体验就像发送内置邮件一样简单。这与应用邮件在一点上不同：`Twitter.Framework`\
  \ 的 `TWTweetComposeViewController` 提供的是 `completionHandler` 而代理回调。第 16 章展示了该功能的实际示例。\n\
  \n## 其他新功能\n\n除了前面的章节讨论的“大”功能外，iOS 5 还增加了许多其他功能，包括对杂志类应用的专用支持、原生图像处理库、AirPlay 镜像支持以及添加到\
  \ `UIKit.framework` 中的新控件。\n\n### Newsstand Kit\n\n报纸或杂志应用可以使用 `NewsstandKit.framework`\
  \ 来分发数字内容。虽然在 iOS 4 上技术上可以实现类似的功能，但 iOS 5 引入了多个新 API，以便最新版本的内容可以在后台下载。此外，它还允许出版者为杂志提供封面图像（正面），而不是图标。使用此框架开发的应用将出现在\
  \ Newsstand（报刊）应用中，并显示封面而不是应用图标。\n\n### 用于图像处理的 Core Image\n\n相机应用可以使用 Core Image\
  \ 中的功能应用图像处理滤镜。`CIImage` 和 `CIFilter` 类增加了基础的图像编辑功能，如裁剪、旋转（仿射变换）和颜色反转，以及高级功能，如伽马校正、白点调整、假色、深褐色色调、温度和色调校正等，这些功能在任何入门图像编辑器中都会存在。iOS\
  \ 5 的这项功能对于与 Instagram 或 Camera+ 等竞争的相机增强应用将极其有用。iPhone 摄像头已经是 Flickr 上最流行的相机了，该框架将使其更上一层。\n\
  \n### 用于特征检测的 Core Image\n\nCore Image 还有另一个重要元素：特征检测。在 WWDC 2011 上，Apple 展示了 Photo\
  \ Booth 的一项功能，它可以跟踪脸部位置并在头部装饰环绕飞翔的小鸟。通过 Core Image，你只需花费极少的编程工作即可添加此类功能。`CIDetector`\
  \ 类有一个方便的 `featuresInImage:` 方法，可以返回在给定图像中检测到的 `CIFeature` 对象列表。\n\nCore Image 将第\
  \ 6 章中讨论。\n\n### 其他细微改进\n\niOS 5 增加了许多其他细微改进，如 AirPlay 视频支持、镜像（如果你正在显示保护内容，你的应用可以禁用镜像）；更好的文档支持；数据保护的改进（第\
  \ 11 章）；新控件 `UIStepper`；像 App Store 密码提示一样为 `UIAlertView` 添加密码输入字段的能力；用于创建类似 iBooks\
  \ 翻页效果的 `UIPageViewController` 等。所有这些主要和次要改进共同使得 iOS 5 成为自诞生以来最大的改进。\n\n### 总结\n\
  \niOS 的采用率一直遥遥对手。几年前，当 iPhone OS 3.0 发布时，iPod touch 的采用率受到一定限制，因为升级费用为 10 美元。然而，Apple\
  \ 很快将其免费，采用率随上升。同样，当 Apple 发布 iOS 4 时，采用率最初很慢，是因为旧手机（如 iPhone 3G 和初代 iPhone 以及同类的\
  \ iPod touch）存在性能问题。某些功能（主要是多任务处理）在旧设备上也不可用。尽管如此，最新的 iOS 通常在两个月内就会被 90% 以上的设备采用。\n\
  \n由于以下原因，iOS 5 的采用率应该是有史以来最快的。首先，更新对所有设备都是免费的，不像 iPhone OS 3.0。其次，与 iOS 4 不同，iOS\
  \ 5 不会使旧设备（iPhone 3GS）运行变慢。最后，对于终端用户来说，更整洁的通知、iTunes Wi-Fi 同步和 iMessage 是加速 iOS\
  \ 5 的杀手级功能。\n这一切意味着你应该尽快开始使用每一个 iOS 5 功能，让你的应用展现出所有的异彩。光是 iCloud 和 UIKit 自定义等功能就足以成为你将应用更新到\
  \ iOS 5 的理由了。话虽如此，接下来的章节将开启你的 iOS 5 之旅。\n\n### 延伸阅读\n\nApple 文档\n\n以下文档可以在 iOS Developer\
  \ Library 或通过 Xcode 文档和 API 参考获取：\n\niCloud\n\niOS 5 的新特性\n\nTwitter 框架\n\nAccounts\
  \ 框架\n\n其他资源\n\n如何使用 API 检测文件冲突 - Dropbox 论坛 `http://forums.dropbox.com/topic.php?id=40492`\n\
  \n\n\n\nXcode 4 的特性不仅仅停留在表面——它们还伴随着编译器级别的巨大变化。`LLVM` 编译器是 Xcode 背后的新大脑。苹果在最初版本的\
  \ Xcode 中将 `LLVM-GCC` 为默认编译器。从 Xcode 4.0 开始以及与 iOS 5 同期发布的版本（Xcode 4.2），`LLVM 3.0`\
  \ 成为默认编译器；它使用 `Clang` 作为前端。使用 `Clang` 代替 `GCC` 作为前端有许多优势，Xcode 4 的许多新功能也因这一变化而引入。由于苹果正在从\
  \ `GCC` 迁移到 `LLVM`，你应该了解如何利用新编译器的力量来提高编码和调试速度，以及如何使用 IDE 来提高工作效率。`LLVM` 编译器最重要的特性是通过\
  \ `Clang` 前端提供更好、更快的编译，并提供了更好的代码补全支持。\n\n本章涵盖了 IDE 的重要特性、`LLVM` 编译器提供的新功能、内置的集成版本控制系统、Schemes（Xcode\
  \ 4 新增）、编写可读且可注释的项目配置文件，最后是新 Xcode 4 组织器（Organizer）的功能。\n\n## 认识新用户界面\n\n\n本节涵盖了\
  \ Xcode 4 的六个重要变化。第一个重要变化是新的导航器（Navigators）。通过点击图 2-1 中突出显示的按钮，可以访问七个导航器。也可以通过快捷键\
  \ `Cmd-1` 到 `Cmd-7` 访问。\n\n![9781119961321-fg0201.eps](img/9781119961321-fg0201_fmt.jpeg)\n\
  \n图 2-1 Xcode 导航器项目\n\n可以从 Xcode 的视图（View）菜单项访问相同的导航器，如图 2-2 所示。\n\n![9781119961321-fg0202.eps](img/9781119961321-fg0202_fmt.jpeg)\n\
  \n图 2-2 从菜单栏访问新的导航器\n\n导航器区域中的第一个视图是项目导航器（Project Navigator）。以前，这里是组（Groups）和文件（Files）列表。在在组和文件列表中，你可以添加框架并编辑目标属性。然而，在\
  \ Xcode 4 中，此功能移动到了项目和构建设置编辑器视图。Xcode 4 工作区窗格现在可以编辑比 Objective-C 或属性列表（plist）文件更多类型的文件，而项目和构建设置编辑器恰好就是其中一个编辑器。你可以通过从项目导航器选择项目文件来访问构建设置编辑器。图\
  \ 2-3 显示了 Xcode 4 项目导航器。\n\n![9781119961321-fg0203.tif](img/9781119961321-fg0203_fmt.jpeg)\n\
  \n图 2-3 Xcode 项目导航器视图\n\n后续导航器是符号（Symbol）、搜索（Search）、问题（Issue）、调试（Debug）、断点（Breakpoint）和日志（Log）。你将在本章稍后详细查看它们。\n\
  \n## 标签编辑器\n\n第二个主要变化是新的标签编辑器。与前身不同，Xcode 4 支持在同一个窗口内打开多个标签。这意味着你花费更少的时间寻找显示源文件的窗口。图\
  \ 2-4 显示了 Xcode 4 标签编辑器的运行。\n\n![9781119961321-fg0204.eps](img/9781119961321-fg0204_fmt.jpeg)\n\
  \n图 2-4 显示多个已打开标签的 Xcode 4 窗口\n\nXcode 4 中的标签编辑器行为与 Eclipse、Visual Studio 或 TextMate\
  \ 中的标签编辑器不同。将 Xcode 4 的标签视为虚拟工作区而非仅仅的文件编辑器。在标签之间切换时，导航器窗格的文件选择和搜索标准会被保留。我建议打开三四个标签，每个标签显示一组相关的文件。例如，你可以用一个标签显示你的模型类，用另一个标签显示视图控制器，第三个标签用于\
  \ Interface Builder 文件，可能如果你使用 Core Data，还可以用第四个标签显示 Core Data 相关文件。使用标签让工作区适应你的思维过程或工作流。要去处理\
  \ Core Data 文件了？切换到 Core Data 标签。要去处理 Interface Builder？切换到 Interface Builder 标签。\n\
  \n## 快捷键绑定\n\n第三个主要变化是快捷键绑定。Xcode 4 更改了大部分键盘快捷键，这意味着你必须重新学习那些快速快捷键。三个常用的调试快捷键更改为\
  \ `F6`（单步）、`F7`（单入）和 `F8`（跳出）。另一个更改的常用快捷键是切换头文件和源代码对应项。Xcode 3 使用 `Cmd-Opt-Up Arrow`；Xcode\
  \ 4 使用 `Cmd-Ctrl-Up Arrow`。构建并运行（Build and Run）的快捷键以前是 `Cmd-Return`，现在是 `Cmd-R`。\n\
  \n## 项目设置编辑器\n第四个主要变化是新的项目设置编辑器。在 Xcode 3 中，你通常通过在组和文件列表中 Cmd-点击目标并选择编辑（Edit）来编辑项目设置。这已完全重构并移动到项目设置编辑器中。项目设置编辑器还允许你编辑构建设置和其他常用功能，如\
  \ `NSZombieEnabled` 和 `GuardMalloc`。此外，向产品添加附加框架和传递命令行参数现在都是项目编辑器中此构建设置面板的一部分。\n\
  \n## 集成版本控制\n\n第五个主要变化是支持的版本控制系统。Xcode 3 支持 Subversion (SVN)、Perforce 和并发版本系统 (CVS)\
  \ 对源代码进行版本控制。Xcode 4 删除了对 Perforce 和 CVS 的支持并添加了 Git。在本章后面，你将学习如何充分利用你的版本控制系统。\n\
  \n## 工作区（Workspaces）\n\n第六个主要变化是在项目中增加了工作区。在 Xcode 3 中，你应用程序的顶层是项目。在 Xcode 4 中，你可以创建一个工作区并在其中添加多个项目。例如，如果你正在编写一个\
  \ Mac + iOS 应用，你可以共享大量的代码。与其手动复制粘贴代码，你可以将通用代码提取到单独的静态库项目中并将其添加到工作区。工作区的主要优势是隐式依赖关系。这意味着当你构建\
  \ Mac 应用（或 iOS 应用）时，Xcode 4 会自动检测到它依赖你的静态库项目并优先构建它，而无需你显式请求它这样做。\n\n## 全能窗口\n\n\
  与 Xcode 3 不同，Xcode 4 是像 Eclipse 或 Visual Studio 那样的单窗口 IDE。你在项目中使用的每个文件都可以打开，无需使用\
  \ Mac 的 Exposé 进行“切换”。在 Lion 的全屏编辑模式下，你会喜欢这种单窗口 IDE，并发现自己花费更少的时间来切换或搜索窗口。\n\n正如你在本章早些时候看到的，IDE\
  \ 由一组导航器、一个工作区域和一个工具区域组成。有七个导航器取代了“组和文件”视图的功能。\n\n\n\n工作区域（Workspace area）是你可以编辑文件的地方，这些可以是源代码、plist\
  \ 文件，甚至是 Interface Builder (IB) 文件。这里有三种不同的编辑器：用于编辑文件的标准编辑器（Standard editor）、用于编辑标准编辑器中当前文件相关文件的辅助编辑器（Assistant\
  \ editor），以及显示文件版本历史的各种编辑器（Versions editor）。\n\n工具区域（Utility area）类似于大多数其他应用程序中常见的“检查器”面板（Inspector\
  \ pane）。工具区域下方是库（library），你可以从那里将用户界面元素拖入你的 IB 文件中，或将代码片段拖入你的源代码中。让我们仔细查看一下 Xcode\
  \ 4 中提供的不同导航器（navigators）。\n\n# 导航导航器\n\nXcode 4 内置了七个导航器面板。这些功能在 Xcode 3 中也存在（在组和文件视图中），但在\
  \ Xcode 4 中以更有意义的方式呈现出来。\n\n在 Xcode 3 中，曾经有一个视图——“组和文件”视图——你几乎可以在那里完成所有工作。你可以在同一个视图中选择要编辑的文件、编辑项目设置、添加框架、访问断点和调试日志等许多操作。Xcode\
  \ 4 将这些操作分为了七个不同的导航器。\n\n所有导航器都有一个过滤器和范围框（如图 2-5 所示），可以使用 `Cmd-Opt-J` 访问。此快捷键会将焦点置于导航器下方的过滤器和范围框，你可以从那里搜索项目文件。该键盘快捷键适用于所有导航器，例如，如果你在符号导航器（symbol\
  \ navigator）中，可以使用它来快速过滤符号。过滤器框可能会有额外的按钮来限制范围，有时（如在调试导航器中），它可能会被一个看起来不同但提供相同功能的\
  \ UI 界面取代。\n\n你可以按下快捷键 `Cmd-Opt-J` 快速跳转到过滤器和范围框。\n\n导航器在 UI 上提供了清晰的职责分离。例如，有专门的断点导航器、专门的问题（issues）导航器，以及另一个日志（logs）导航器。虽然切换到这些新的、独立的导航器可能有些困难，但一旦你习惯了，你就会感激它们。\n\
  \n某些功能，如创建智能组（smart groups）的能力被弃用了，可能是因为很少有人使用它们。然而，如果你在 Xcode 3 中有一个使用智能组的项目，在\
  \ Xcode 4 中打开并保存它并不会从项目文件中删除它们。因此，当你再次在 Xcode 3 中打开项目时，仍然会看到你的智能组。\n\n## 项目导航器\n\
  \n项目导航器等同于 Xcode 3 中的“组和文件”视图。正如其名，项目导航器帮助你定位源代码文件、框架和目标（targets）。与 Xcode 3 类似，项目导航器也作为源码控制\
  \ UI。这意味着当你向项目导航器添加文件时，它们会被自动添加到你的源码控制中（如果你使用了该功能），并且项目导航器还会根据文件的源码控制状态更新 UI。\n\
  ![9781119961321-fg0205.eps](img/9781119961321-fg0205_fmt.jpeg)\n\n图 2-5 显示搜索和范围栏的\
  \ Xcode 导航器\n\n## 符号导航器\n\n你可以使用快捷键 `Cmd-2` 跳到符号导航器。符号导航器可以让你轻松定位项目中的特定符号或类。LLVM\
  \ 编译器的 Clang 前端与 Xcode 4 良好集成，使得浏览项目中的符号变得更快。\n\n## 搜索导航器\n\n搜索导航器的的功能与 Xcode 3\
  \ 的“查找和替换”功能完全相同。你可以使用传统的快捷键 `Cmd-Shift-F` 或导航器快捷键 `Cmd-3` 访问此导航器。\n\n## 问题导航器\n\
  \n当你构建项目时，编译器警告、错误消息或分析器警告出现在问题导航器上。Xcode 4 的问题导航器中没有构建日志信息，不像 Xcode 3 对应的调试视图。在\
  \ Xcode 4 中，构建日志被移动到名为日志导航器（log navigator）的独立导航器，它按时间顺序维护每个构建日志。你可以使用导航器快捷键 `Cmd-4`\
  \ 访问它。\n\n## 调试导航器\n\nXcode 3 中通过按下 `Cmd-Shift-Y` 访问的调试面板等同于 Xcode 4 的调试导航器。你可以使用导航器快捷键\
  \ `Cmd-5` 在 Xcode 4 中访问调试导航器。最重要的新增是范围滑块（scope slider）。与其他导航器中存在的过滤器和范围搜索框不同，调试导航器使用范围滑块。拖动范围滑块可以自定义你的范围偏好。\n\
  \n## 断点导航器\n\n第六个导航器是断点导航器。在 Xcode 3 中，它是在一个单独窗口中管理的。这里很巧妙的改进是可以快速添加符号断点或异常断点。你可以使用快捷键\
  \ `Cmd-6` 访问断点导航器。\n\n断点导航器一个值得注意的功能是可以与同事共享你的断点。在断点导航器中，`Cmd-Click` 项目文件并点击“共享断点”（Share\
  \ Breakpoints）。\n\n## 日志导航器\n\n在 Xcode 3 中，日志可以配置为每次构建都清空，或继续添加到当前项目日志中。在 Xcode\
  \ 4 中，情况不再如此。通过日志导航器，每次构建都有自己的日志条目，你甚至可以搜索几个构建前的日志中的条目。你可以使用快捷键 `Cmd-7` 访问日志导航器。\n\
  \n# 来自你的助手的帮助\n\nXcode 4 有三个主编辑器，它们类似于其他竞争性 IDE 中的多窗口文档编辑。增强 Xcode 4 标准编辑器的两个编辑器是辅助编辑器和版本编辑器。辅助编辑器最棒的一点是当你打开它时，它能智能地识别与你当前工作最相关的文件。\n\
  \n例如，当你编辑 Core Data 模型时，它会打开相应的 Core Data 模型文件。同样，当你编辑 Interface Builder 文件时，它会打开相应的头文件。\n\
  \n像在头文件中添加 `IBAction` 声明并返回 Interface Builder 将其连接这种常见操作，可以通过辅助编辑器在同一个窗口内轻松完成。\n\
  \n## 集成 Interface Builder\n在 Xcode 4 之前，Interface Builder 是一个独立的应用程序，程序员可能犯的最常见错误是未能正确同步\
  \ Interface Builder 和 Xcode。例如，忘记保存 Interface Builder 的连接会导致应用程序在运行时崩溃。此外，编写 iOS\
  \ 应用需要两个应用程序这一点本身就让来自 Eclipse 或 Visual Studio 背景的开发者感到困惑。由于 Xcode 4 将 Interface\
  \ Builder 直接集成到主 IDE 中，现在同步你的用户界面和控制器代码变得非常容易。\n\n### Interface Builder 面板\n\nXcode\
  \ 3 的 Interface Builder 通常有多个浮动窗口。最少情况下你拥有主文档窗口、库面板、检查器以及实际的用户界面视图。在 Xcode 4 中，库和检查器被带到了工具区域。文档窗口固定在左侧。图\
  \ 2-6 显示了在 Xcode 4 中打开的经典 Interface Builder 文件。\n\n![9781119961321-fg0206.tif](img/9781119961321-fg0206_fmt.jpeg)\n\
  \n图 2-6 Xcode 4 Interface Builder\n\n左侧面板现在包含 Interface Builder 文件中的对象。工具区域显示所选对象的属性。\n\
  \n当你开启辅助编辑器时，Xcode 4 会自动为你打开正确的头文件。\n\n使用辅助编辑器和集成 Interface Builder 生成代码\n\n\n\n\
  \n\nXcode 4 集成 Interface Builder 添加的最重要功能是能够直接从 IB 生成属性（`IBOutlet`）或事件处理（`IBAction`）代码。当辅助编辑器（Assistant\
  \ editor）打开时，你只需要 command-click 并拖拽对象到头文件来生成属性，或者从工具区域（Utility area）command-click\
  \ 并拖拽事件到头文件来生成 `IBActions`。如果你的拖放目标有效，Xcode 会显示一个插入标记并将代码直接添加进去。不需要任何连接。一切都已为你就就。\n\
  \n# LLVM 编译器 3.0：与大脑的邂逅\n\nXcode 3 及之前的版本与 Eclipse 或 Visual Studio 等竞争 IDE 相比，并不那么“智能”。主要原因在于\
  \ Xcode 3 使用 `GCC` 作为编译器。虽然 `GCC` 是一个很优秀的编译器，但它与 IDE 之间的互操作性不高。编译器通常有一个前端，用于将源代码转换为中间表示并展开预处理器宏定义。它还拥有后端，用于生成代码并对其进行优化。`GCC`\
  \ 编译器本质上是一个后端编译器，这意味着当你提供源代码给它时，它会为你生成编译后的二进制文件。它的主要目的是用于编译代码而非解析代码。本质上，这意味着 Apple\
  \ 必须编写自己版本的解析器来协助你进行调试。`GCC` 是 `GPL` 的，因此在不更改 Xcode 许可证为 `GPL` 的情况下，Apple 版本的解析器无法使用相同的\
  \ `GCC` 代码。由于 Apple 的解析器和 `GCC` 源自不同的代码库，因此编译器“认为”的内容与 Xcode“认为”的内容之间始终存在差异。\n\n\
  ## Clang 前端\n\n为了缓解这个问题，Apple 正在缓慢切换到 `LLVM` 编译器。随着 Xcode 4.2 和 iOS 5 发布，默认编译器变成了\
  \ `LLVM`  3.0。尽管 `LLVM` 在代码生成方面没有 `GCC` 那么“高效”，但它更加模块化且可扩展。在编译时间方面，`LLVM` 的速度快了两倍以上（从而提高了你的工作效率）。`LLVM`\
  \ 开发了许多前端，其中之一就是 `Clang`，它得到了 Apple 的大量资助（`Clang` 代表 C 语言）。`Clang` 支持增量编译，这意味着 IDE\
  \ 实际上可以在你输入代码时编译代码，并向你显示几乎瞬时的编译错误。当你开始使用 Xcode 4 时，你会发现非常有用。\n\n一个清晰的例子是，当你输入 `@synthesize`\
  \ 后，Xcode 3 会建议几乎每一个索引后的符号，而 Xcode 4 只显示对应头文件中属性的建议。此外，`Clang` 的模块化使其易于支持代码重构以及“范围内全部编辑”（Edit\
  \ All in Scope）等功能。\n\n\nLLVM 与 IDE 更紧密的集成也有助于 Xcode 4 在编译器遇到错误时提供关于开发者必须做什么建议。这个功能被称为\
  \ Fix-it。\n\n图 2-7 显示了删除右方括号以匹配左括号数量的建议。\n\n![9781119961321-fg0207.tif](img/9781119961321-fg0207_fmt.jpeg)\n\
  \n图 2-7 Xcode 4 的 Fix-it 演示\n\n# 在这里管理版本\n\nXcode 4 的另一个有趣功能新增是集成的 Git 版本控制系统。Git\
  \ 是由 Linus Torvalds（没错，就是 Linux 内核背后的那）编写的分布式版本控制系统，主要用于维护 Linux 内核存储库。分布式特性、速度、可靠性、廉价的分支以及轻松进行非线性软件开发的能力鼓励了更多用户采用\
  \ Git。\n\n## 集成 Git 版本控制系统\n\nGit 主要是一个命令行系统，类似于大多数其他 Unix/Linux 系统。别担心，Xcode 4\
  \ 内置了对 Git 的支持，项目导航器（project navigator）甚至会显示文件的提交状态。然而，决定使用 Git 而非其他版本控制系统不应仅基于此。我主张在你的下一个\
  \ iOS App 中使用 Git 的主要原因是它廉价的分支和对非线性开发的支持。\n\n## 版本编辑器 (Versions Editor)\n\n版本编辑器是\
  \ Xcode 4 中提供的第三种编辑器。（在本章前面提到，另外两种编辑器类型是标准编辑器和辅助编辑器。）当你想要可视化分析文件两个版本之间的差异时，集成的版本编辑器就派用场。如果你的项目使用\
  \ Git（或 `SVN`），你可以将文件与存储库中之前的修订版本进行比较。版本编辑器允许你通过类似于经典 Time Machine 界面的时间轴来选择文件的任何旧版本。随着\
  \ OS X Lion 的发布，Apple 可能会考虑为 Xcode 添加本地版本支持，这样你不仅可以比较存储库中的版本，还可以比较文件的本地版本。\n\n##\
  \ Git 最佳实践\n\nApple 的 App Store 是一个围墙花园，如果你是一个活跃的开发者，Apple 可能至少拒绝过你一次。想象一个产品开发过程，假设有十个功能。在这十个功能中，你为\
  \ 1.0 版本开发了四个，为 1.5 版本开发了另外两个，剩下的四个留给 2.0 版本。你已经提交了 1.0 版本，并正在开发第第五和第六个功能。开发几周后，你收到了\
  \ Apple 的回复，说你的 App 被拒绝了。假设第三个功能违反了 Apple 的某些策略，在当前状态下是不允许的。在传统的版本控制系统（SCM）中，你需要检出旧代码，进行修复，并将修复提交给\
  \ Apple。然后你回到已添加第五和第六个功能的代码中，将这些修复合并进来。虽然 SVN 和其他源码控制系统提供分支功能，但它们使用起来相当困难，随着项目规模增大，分支会变成一项昂贵的操作（无论时间还是磁盘空间）。在\
  \ Git 中，这种合并、分支和并行开发非常容易，这主要是因为 Git 存储更改集的方式。\n\n想要更深入地了解 Git，我推荐阅读《Pro Git》或《Version\
  \ Control With Git》（详情参见章节末尾的“延伸阅读”部分）。本书让你深入理解 Git 如何工作；第二本书则帮助你开始使用并在项目中充分利用 Git。\n\
  \n我建议你在下一个 iOS App 中使用 Git 时遵循以下步骤：\n\n1. 让你的主分支反映 App Store 上可用版本的最新代码。\n2. 对于你正在开发的每个新版本，创建一个分支。\n\
  3. 对于实现的每个主要功能，从版本分支创建一个分支。\n4. 每当你向 App Store 提交 App 时，将你的分支合并到主分支。\n5. 可选在 App\
  \ 批准后为你的主分支打标签（tag）。\n\n当你遵循这些步骤时，你可以在几分钟内轻松修复特定版本的 Bug 和问题，并将更改合并到你正在工作的最新分支中。\n\
  \n例如，如果 Apple 拒绝了你的 App，你只需要检出主分支，进行修复，重新提交到 App Store，检出你当前的工作分支，并将主分支中做的更改合并到该分支。有了\
  \ Git，非线性开发变得非常简单。尝试使用它吧。你不会后悔的。\n\n\n\n\n\nXcode 4 中最强大但也最让人困惑的新增是方案（Schemes）。在\
  \ Xcode 3 中，有一个构建配置选择组合框，你可以在运行应用之前指定活跃的配置；活跃的目标；活跃的可执行文件；活跃的架构（指令集）；以及目标设备。即使是默认选项集，其组合数量也非常惊人，对于复杂的项目设置，为正确的目标或设备以及指令集选择正确的可执行文件变得具有挑战性。此外，Xcode\
  \ 3 甚至允许为特定目标选择错误的活跃可执行文件。Xcode 4 引入方案是为了帮助轻松处理这些问题。方案是一个结合上述所有设置的单一实体。方案是构建产品的一组指令。产品可以是（在大多数情况下是）一组具有其自身构建配置的目标集合。你也可以为这些目标使用现有的\
  \ `xcconfig` 文件。你将在在本章后面的部分学习这一点。\n\n## 为什么需要方案？\n\n以前每次想构建东西时都要选择四个不同的选项，这让你很难每次都做对。有时，你可能会构建并提交了调试\
  \ 版本的 App 到 App Store，或者尝试调试 App 的发布配置，结果发现断点没有被触发。有了方案后，你只需要选择你的方案，其他所有选项都会自动应用。当你为了调试构建产品时，你显然不希望剥离调试语句。另一方面，当你为\
  \ App Store 构建时，你几乎总是希望优化构建性能并剥离调试语句。这对于 Ad Hoc 部署也是如此。等一下！不止于此。这些方案还可以通过提交到仓库在同事之间共享。\n\
  \n## 将方案视为实现你的意图\n\n通过方案，你可以通过选择符合你意图的方案自动为目标选择正确的配置。也就是说，如果你的意图是“我想调试这个产品”，就选择\
  \ Run 方案。如果你的意图是“我想将此产品提交到 AppStore/Adhoc 发布”，就选择 Archive 方案。\n\n通过方案，你根据意图选择一个选项。你所有其他设置都会自动应用。通过一些微调，你可以自定义创建方案时应用的设置。你将在下一节学习这些。\n\
  \n## 创建方案\n\n创建方案最简单的方法是让 Xcode 4 自动为你创建一个。当你在 Xcode 4 中打开在 Xcode 3 中创建的项目时，它会自动创建一个默认方案。每个方案都有自己独特的设置面板，允许你自定义或微调默认方案设置。以下列表介绍了方案中的操作。\n\
  \n- **Run**—Run 操作使用调试构建配置构建包含的目标。在此项操作的设置面板上，你可以更改想要使用的调试器（`GDB` 或 `LLDB`）以及构建配置，默认为\
  \ Debug。Run 操作的设置面板是你为应用指定命令行参数、提供默认数据或为应用提供模拟位置数据（使用 `GPX` 文件）的地方。你还可以在此处启用与诊断相关的参数，如启用\
  \ Zombies 或 Guard Malloc（从 Xcode 4.1 及更高版本开始）。\n更进一步，你可以复制方案并在每个方案上尝试不同的调试器（和/或设置）。\n\
  \n- **Test**—Test 操作运行你的测试目标。在设置面板上，你可以自定义应该执行哪些测试。方案与 `OCUnit` Objective-C 测试框架完全集成，编写的测试将显示在设置面板上。测试失败显示在\
  \ Issue 和 Log 导航器中而不是控制台中，这意味着导航到导致测试用例失败的正确方法现在变得了。\n通过复制此方案，你可以创建两个测试方案：一个测试你的模型类，另一个测试（例如）你的辅助方法。\n\
  \n- **Profile**—Profile 操作构建你的目标并将其附加到 Instruments。当你选择此项时，Instruments 会自动启动并向你显示可用工具列表。你可以编辑方案自动启动\
  \ Time Profiler 工具或 Leaks 工具（或任何其他）。\n你可以复制 profile 方案，这样你就有两个方案：一个启动 Leaks，另一个启动\
  \ Time Profiler。\n\n- **Analyze**—Analyze 操作在你的代码上运行 `Clang` 静态分析器并警告你潜在的内存泄漏。除了用于此方案的构建配置外，这里没有太多可以自定义的。\n\
  \n- **Archive**—Archive 操作用于制作 `xcarchive` 文件（或 `ipa` 文件），用于提交到 App Store。Archive\
  \ 会自动出现在 Xcode organizer 中，你可以从那里验证/提交到 App Store。有了专用 Archive 方案，你不再需要像在 Xcode\
  \ 3 中那样为产品创建 Ad Hoc 构建配置或“App Store”构建配置。这些特定的发布配置在大多数情况下与发布配置的区别仅在于签名证书。由于签名发生在后期，你可以使用发布配置对应用进行归档。提交到\
  \ App Store 或进行 Ad Hoc 分发的签名通过 Xcode organizer 完成。\n\n## 共享你的方案\n\n\n![9781119961321-fg0208.eps](img/9781119961321-fg0208_fmt.jpeg)\n\
  \n图 2-8 共享方案\n\n当你勾选 Shared 选项时，方案会被复制到 `xcshareddata` 目录。将此目录添加到仓库，你就可以与同事共享方案。\n\
  \n相比 Xcode 3 使用配置的方法，方案实际上是自定义环境更好的方法。尝试一下，你会喜欢的。\n\n## 你注释的构建配置\n\n在大多数项目中，你可能依赖\
  \ Xcode 的设置面板来编辑/更改构建设置。但此设置面板有一个主要缺点：你无法对项目配置中所做的特定更改进行注释。Xcode（3 和 4）通过使用 `xcconfig`\
  \ 文件提供了实现此点的简单方法。\n\n### 创建 xcconfig 文件\n\n`xcconfig` 文件是包含目标构建配置的纯文本文件。从向项目添加 Debug\
  \ 配置文件开始。你可以从新文件向导 Other 部分的模板中选择它。图 2-9 说明了这一点。\n\n![9781119961321-fg0209.eps](img/9781119961321-fg0209_fmt.jpeg)\n\
  \n图 2-9 添加新配置文件\n\n将文件命名为 `debug.xcconfig`。现在打开构建设置面板并选择 Basic 和 Levels。将这些构建设置复制到你刚刚创建的配置文件。你可以选择一行并使用\
  \ `Cmd-C` 复制，然后粘贴到配置文件。\n\n对于 Release 配置，在另一个文件 `release.xcconfig` 中重复这些步骤。一旦创建了基础配置，你可以在构建设置编辑器中将所有设置设置为默认值。\n\
  \n现在，你需要告诉 Xcode 使用此构建配置文件而不是指定的构建设置。为此，选择项目，然后在项目设置编辑器中再次选择项目。在 Info 面板中展开配置部分并选择你的配置文件。\n\
  \n\n\n\n就是这样。你现在已经创建了一个可读且可注释的构建配置文件，你可以通过 SCM（版本控制系统）将其与同事共享。准备好对其进行重构了吗？\n\n#\
  \ 重构构建配置文件\n\n当你创建构建配置文件时，你可能注意到调试（debug）和发布（release）配置中都出现了许多相同的设置。你可以通过创建一个 `shared.xcconfig`\
  \ 文件并将这些设置复制到其中，来轻松地避免重复。一旦完成 `shared.xcconfig` 文件的工作，请从 `debug.xcconfig` 和 `release.xcconfig`\
  \ 文件中删除这些条目。现在使用 `include` 语句将 `shared.xcconfig` 的条目添加到这两个文件中：\n\n```\n#include\
  \ “shared.xcconfig”\n\n这将自动将所有共享设置导入到那两个配置文件中。现在当你运行应用时，一切都应该可以正常工作。你甚至可以将此添加到你创建的每一个新项目中，甚至添加到\
  \ Xcode 的新项目模板中。\n\n# Xcode 4 Organizer（组织器）\n\nXcode 4 Organizer 是一个与 Xcode 相关的非编程特定任务的一站式解决方案。通过\
  \ Organizer，你可以管理项目仓库、执行 SCM 操作，并管理你的应用归档、描述文件（provisioning profiles）以及设备。按下 `Cmd-Shift-2`\
  \ 或点击 Xcode 4 工具栏最右侧的按钮打开 Organizer 窗口。你将主要使用 Xcode 4 Organizer 来访问应用归档、将应用提交到 App\
  \ Store 以及管理你的设备和描述文件。Xcode 4 还有一个名为“自动设备配置”（Automatic Device Provisioning）的新功能，将在下一节讨论。\n\
  \nXcode 4 Organizer 的第一个标签页显示当前加载的设备和描述文件列表。Xcode 4 提供了一种简单的方法来导出此列表并导入到新机器上。如果你想将开发者设置迁移到另一台电脑，这里是你寻找的地方。\n\
  \n# 自动设备配置\n\n在 Devices（设备）标签页的描述文件列表中，你可以看到页脚附近有一个名为“自动设备配置”的复选框。启用后，Xcode 4 可以从你的\
  \ iOS 开发者计划门户下载并安装开发者证书和分发证书。Xcode 4 还可以自动创建通配符描述文件（带有隐式 App ID/Implicit App ID），该配置文件可用于不需要显式\
  \ App ID（Explicit App ID）的应用程序。\n\n具有以下任何功能的应用——推送通知（Push Notification）、Game Center、iCloud\
  \ 或应用内购买（In App Purchases）不能使用隐式 App ID，因此无法依赖 Xcode 的自动设备配置。\n\n# 查看崩溃日志和控制台 NSLog\
  \ 语句\n\nDevices 标签页显示了至少连接到你开发机的设备列表。通过点击展开三角形展开设备，你将看到该设备的设备日志（Device logs）和截图。当设备连接时，你将看到额外的条目，如控制台日志（Console\
  \ logs）、安装在设备上的描述文件以及已配置的应用程序列表。（包括你通过 Xcode 运行的应用或通过 Ad Hoc 分发安装的应用。）\n\n# 查看应用的沙盒数据\n\
  \n在 Xcode 4 中（从 Xcode 4.2 开始），你可以查看、删除或向设备内的沙盒添加文件。这使得在设备上进行调试变得更容易。要访问设备的沙盒，从左窗格中选择连接的设备，从列表中选择\
  \ Applications（应用程序），然后选择你想查看沙盒的应用程序。在这里删除或添加文件，或将它们本地复制到你的计算机上。\n\n# 管理仓库\n\nXcode\
  \ 4 会将你打开的任何项目的仓库添加到 Repositories（仓库）标签页中。对于大多数用途，仓库部分是 Git（或 SVN）GUI 访问的一个很好的替代方案。\n\
  \n如果你是一个“Unix 风格”的人，并倾向于使用命令行，我建议你远离任何 GUI 工具，仅将它们用于查看差异（diffs）。我推荐的一个快速、轻量级工具是\
  \ GitX。它有一个命令行工具可以“管道”（pipe）Git diff 输出并向你显示视觉化差异。我的工作流一直是这样的：\n\n```\ngit diff\
  \ | gitx\n```\n\n# 访问应用归档\n\n你可以从 Xcode 4 Organizer 访问你的应用归档，并在那里验证或提交应用。在上一节中，你已经看到如何使用\
  \ archive scheme 存档应用程序。此归档可以通过 Xcode 4 的 Archives 标签页访问。\n# 查看 Objective-C 和 SDK\
  \ 文档\n\nOrganizer 还让访问 SDK 文档变得简单。Organizer 的 Documentation 标签页显示已安装的文档集（docsets）。大多数情况下，它们是最新的\
  \ iOS SDK、最新的 Mac OS X SDK 以及当前的 Xcode 库。\n\n### 总结\n\nXcode 4 IDE 相比 Xcode 3 有巨大的改进。虽然它现在还没有\
  \ Xcode 3 那么稳定，但你应该开始使用并习惯它。某些功能如新的快捷键、方案（schemes）和集成 Interface Builder 起初看起来不同且令人困惑，但当你习惯后，你会开始欣赏它们，特别是它们为你节省的时间。Apple\
  \ 已经停止支持 Xcode 3，而 Storyboard 和 ARC 迁移工具等新功能仅在 Xcode 4 中可用。尽快开始使用最新强大的 IDE 是有意义的。\n\
  \n# 更多阅读\n\n### Apple 文档\n\n以下文档可以在 iOS 开发者库 [`developer.apple.com](http://developer.apple.com/)\
  \ 或通过 Xcode 文档和 API 参考获取\n\n* Apple Developer: Debugging with Xcode 4\n* Apple Developer:\
  \ Orientation to Xcode 4\n* Apple Developer: Designing User Interfaces with Xcode\
  \ 4\n\n### WWDC 视频\n\n以下会议视频可在 `developer.apple.com` 上获取。\n\n* Session 307: Moving\
  \ to the Apple LLVM Compiler\n* Session 316: LLVM Technologies in Depth\n* WWDC\
  \ 2011 Session 313: Mastering Schemes with Xcode\n\n\n\n你首先将学习关键的 Cocoa 命名规范，这将提高你代码的可读性。接下来，你将接触\
  \ iOS 5 最令人兴奋的新特性之一：自动引用计数（ARC）。它将改变你开发应用程序的方式，并大幅减少 bug 和崩溃。然后，你将学习如何更好地使用属性（properties）和访问器（accessors）来管理对象中的数据。最后，你将学习分类（categories）、扩展（extensions）和协议（protocols），这些在\
  \ Cocoa 中都被广泛使用。\n\n到本章结束，你应该非常熟悉 Objective-C 最重要的语言特性，并确信自己正在使用经验丰富的 Cocoa 开发者的最佳实践。\n\
  \n### 命名规范\n\n在整个 iOS 中，命名规范极其重要。如果你理解如何正确读取这些命名，整个 iOS SDK 中的方法和函数名称将告诉你许多关于它们应该如何被调用以及它们的作用的信息。一旦你习惯了这些命名规范，你通常可以猜出一个类或方法的名称，这使得查找相关文档变得容易得多。本节涉及了一些最重要的命名规范规则，以及那些给具有其他语言经验的开发者带来困扰的规则。\n\
  \n关于 Cocoa 命名规范的最佳信息来源是 Apple 的《Cocoa 编码指南》，你可以在 [`developer.apple.com`](http://developer.apple.com/)\
  \ 上找到。\n\n\n一个好名称最重要的属性是清晰。方法的名称应该清楚表示它们接受和返回什么类型。例如，这个方法非常令人困惑：\n\n```objc\n- (void)add;\
  \  // 令人困惑\n```\n\n它看起来 `add` 应该接收一个参数，但并没有。它是要添加某个默认对象吗？\n\n是的，所以这样的名称要清晰得多：\n\n\
  ```objc\n- (void)addEmptyRecord;\n- (void)addRecord:(Record *)record;\n```\n\n现在清楚\
  \ `addRecord:` 接受一个 `Record` 了。如果存在任何混淆的可能性，对象的类型应该与名称匹配。例如，这是一个常见的错误：\n\n```objc\n\
  - (void)setURL:(NSString *)URL;  // 错误\n```\n\n它是错误的，因为名为 `setURL:` 的方法应该接受一个 `NSURL`，而不是\
  \ `NSString`。如果你需要一个字符串，那么你应该添加某种指示来明确这一点：\n\n```objc\n- (void)setURLString:(NSString\
  \ *)string;\n- (void)setURL:(NSURL *)URL;\n```\n\n这条规则不应被过度应用。只要你的系统中没有可能误导读者的 `Name`\
  \ 类，那么拥有一个名为 `name` 的属性比拥有 `nameString` 的要好。\n\n清晰的命名也意味着在大多数情况下你应该避免使用缩写。使用 `backgroundColor`\
  \ 而不是 `bgcolor`，使用 `stringValue` 而不是 `to_str`。使用缩写是有例外的，特别是对于那些通过缩写最广为人知的事物。例如，`URL`\
  \ 比 `uniformResourceLocator` 更好。判断缩写是否合适的一种简单方法是大声读出该名称。你说“source”而不是“src”。但大多数人说“URL”时，要么读作“u-ar-el”，要么读作“earl”。在说话时没人会说“uniform\
  \ resource locator”，所以你在代码中也不应该这样做。Cocoa 因为历史原因使用了几个缩写，如 `alloc`、`init`、`rect` 和\
  \ `pboard`，这些是被接受的。随着新框架的发布，Apple 通常已经在逐渐弃用这些缩写。\n\n程序中有几种类型的变量：实例变量（ivars）、静态变量、自动（栈）变量等。如果你不知道自己正在看哪种变量，理解代码将变得非常困难。命名规范应该让变量的意图变得清晰。在与不同团队以不同风格编写代码后，我的建议如下：\n\
  \n\n```objc\nstatic MYThing *sSharedInstance;\n```\n\n- 常量在 Cocoa 中的命名方式与 Core Foundation\
  \ 中不同。在 Core Foundation 中，常量以 `k` 为前缀。在 Cocoa 中则不是。在我看来，文件本地（静态）常量通常应该以 `k` 为前缀，但这里没有硬性规定。以下是文件常量和公共常量的示例：\n\
  \n```objc\nstatic const NSUInteger kMaximumNumberOfRows = 3;\nNSString * const MYSomethingHappenedNotification\
  \ = @\"SomethingHappened\";\n```\n\n- 方法参数通常以冠词（如 a、an 或 the）前缀。后者较少，有时暗示一个特别重要或唯一的对象。以这种方式为参数加前缀有助于避免与局部变量和\
  \ `ivars` 混淆。这对于避免无意中修改它们非常有帮助。\n\n- 实例变量（ivars）以下划线结尾或以 `m` 为前缀。我避免使用下划线前缀，因为 Apple\
  \ 保留了前下划线，我偶尔会与父类的实例变量冲突。此外，键值编码（KVC）会自动检索以下划线开头的实例变量。以一种不明显的方式破坏了封装，且不提供警告。为了避免这一点，我使用另一种命名规范（尾下划线，基于\
  \ Google 的方法）。\n\n- 类应该始终以大字母开头。方法和变量应该始终以小字母开头。所有类和方法都应该使用驼峰法——绝不用下划线——来分隔单词。\n\
  \nCocoa 和 Core Foundation 的命名规范略有不同，但基本方法相同。关于 Core Foundation 命名的更多信息，请参见第 19 章。\n\
  \nCocoa 命名与内存管理紧密结合。随着 ARC 的加入，这不再那么关键，但在处理非 ARC 代码时这很重要。命名规范非常简单，正如《内存管理编程指南》（[developer.apple.com`](http://developer.apple.com/))中的摘录所示：\n\
  \n如果你使用以 `alloc` 或 `new` 开头或包含 `copy` 的方法（例如 `alloc`、`newObject` 或 `mutableCopy`）创建对象，或者向它发送\
  \ `retain` 消息，你就拥有该对象的所有权。你负责使用 `release` 或 `autorelease` 放弃你拥有的对象的所有权。在任何其他时候接收对象，不能释放它。\n\
  \n即使在 ARC 代码中，也要意识到这种命名规范，并避免使用 `alloc`、`new`、`copy`、`retain` 和 `release` 表示传统含义之外任何含义。\n\
  \n### 自动引用计数\n\niOS 5 最强大的新增之一是 ARC。ARC 大极减少了 Cocoa 开发中最常见的程序员错误：`retain` 和 `release`\
  \ 的不匹配。ARC 并没有消除 `retain` 和 `release`，它只是在大多数时候让它们变成了编译器问题而非开发者问题。在大多数情况下，这是一个巨大的胜利，但重要的是理解\
  \ `retain` 和 `release` 仍在发生。ARC 等同于垃圾收集。考虑以下代码，它为一个 ivar 分配值：\n\n```objc\n@property\
  \ (strong, nonatomic) NSString *title;\n\n...\n@synthesize title = title_;\n...\n\
  title_ = [NSString stringWithFormat:@\"Title\"];\n```\n\n\n\n在没有 ARC 的情况下，上述代码中的\
  \ `title_` 没有被保留。赋值给它的 `NSString` 是自动释放（autoreleased）的，因此它将在运行循环结束时消失，当下一次有人访问 `title_`\
  \ 时，程序将会崩溃。这种错误非常常见，而且非常难以调试。此外，如果 `title_` 之前有值，那么由于旧值没有被释放，该旧值已经泄漏了。\n\n使用 ARC，编译器会自动插入额外的代码来实现等同于的操作：\n\
  \n```objc\nid oldTitle = title_;\ntitle_ = [NSString stringWithFormat:@”Title”];\n\
  [title_ retain];\n[oldTitle release];\n```\n\n`release` 和 `retain` 的调用仍然会发生，因此会有微小的开销，并且在\
  \ `release` 期间可能会调用 `dealloc`。但通常情况下，这使得代码的行为符合程序员的意图，而不会创建额外的垃圾回收步骤。内存回收得比垃圾回收更快，而且决策是在编译时而不是运行时做出的，这通常会提高整体性能。与其他编译器优化一样，编译器可以以多种方式优化内存管理，而这些方式对于程序员手动操作是不切行的。ARC\
  \ 生成的内存管理通常比等效的手写内存管理快得多。\n\n但这并不是垃圾回收。特别是，它无法像雪豹系统（Snow Leopard）的垃圾回收那样处理引用（retain）循环。例如，图\
  \ 3-1 中的对象图显示了 Object A 和 Object B 之间的引用循环：\n\n![9781119961321-fg0301.eps](img/9781119961321-fg0301_fmt.jpeg)\n\
  \n图 3-1 引用循环\n\n如果从“外部对象”到“Object A”的链接断开，那么在雪豹垃圾回收下，Object A 和 Object B 都会被销，因为它们已经脱离了程序。在\
  \ ARC 下，Object A 和 Object B 不会被销，因为每个对象的引用计数仍然大于零。因此在 iOS 中，你需要跟踪自己的强引用关系以避免引用循环。\n\
  \n属性关系有两种主要形式：`strong` 和 `weak`，它们映射到以前 `retain` 和 `assign`。只要对对象有强引用，它就会继续存在。这与\
  \ C++ 中的 `shared_ptr` 几乎相同，只是管理引用计数的代码是由编译器注入的，而不是在运行时通过运算符重载确定的。\n\nObjective-C\
  \ 一直存在引用循环问题，但在实践中它们并不经常出现。在过去任何你会使用 `assign` 属性的地方，在 ARC 下只需使用 `weak` 属性即可。大多数引用循环是由代理（delegates）引起的，`delegate`\
  \ 属性几乎应该总是 `weak` 的。弱引用的优点是，当引用的对象被销毁时会自动设置为 `nil`。这是对 `assign` 属性的重大改进，因为后者可能会指向已释放的内存。\n\
  \n在 ARC 之前，合成属性（synthesized properties）的默认存储类是 `assign`。在 ARC 下，合成属性没有默认存储类。你必须在\
  \ `@property` 行中提供一个。\n\n对于大多数代码，切换到 ARC 有两个主要的重大变化：\n\n- 不要使用 `retain`、`release`\
  \ 或 `autorelease`。你直接删除它们即可。ARC 会处理好一切。\n- 如果你的 `dealloc` 只释放成员变量（ivars），那么你就不需要\
  \ `dealloc`。这将自动为你完成，而且在任何情况下你都不能调用 `release`。如果你仍然需要 `dealloc` 来执行其他操作（例如移除 KVO\
  \ 观察），不要调用 `[super dealloc]`。这最后一个变化很令人惊讶，但如果你忘记了，编译器会给你报错。\n如前所述，ARC 不是垃圾回收。它是一项编译器特性，在代码的适当位置注入对\
  \ `retain` 和 `release` 的调用。这意味着只要所有代码都使用正确的命名规范，它就可以与现有的手动内存管理代码完全兼容。例如，如果你调用一个名为\
  \ `copySomething` 的方法，ARC 将期望该方法的返回值具有 +1 的引用计数。如果需要，它将插入一个平衡的 `release`。对于 ARC\
  \ 来说，这个 +1 引用计数是由 `copySomething` 内部的 ARC 代码创建的，还是由 `copySomething` 内部的手动内存管理创建的并不重要。\n\
  \n如果你违反了 Cocoa 的命名规范，这就会失效。例如，如果你有一个方法返回自动释放的字符串作为版权声明，并将该方法命名为 `copyRight`，那么 ARC\
  \ 的行为取决于调用方代码和被调用方代码是否都用 ARC 编译。\n\nARC 看到 `copyRight` 这个名字，发现它以 `copy` 开头，因此假设它返回一个具有\
  \ +1 引用计数的对象。如果 `copyRight` 用 ARC 编译，且调用代码也是用 ARC 编译的，一切仍将正常工作。ARC 会因为这个名字在 `copyRight`\
  \ 中注入一个额外的 `retain`，并在调用代码中注入一个额外的 `release`。效率可能会低一点，但代码既不会崩溃也不会泄漏。\n\n然而，如果调用代码是用\
  \ ARC 编译的，但 `copyRight` 不是，那么调用代码将注入一个额外的 `release`，代码将会崩溃。如果调用代码没有用 ARC 编译，但 `copyRight`\
  \ 是的，那么 ARC 将注入一个额外的 `retain`，代码将会泄漏。\n\n解决此问题的最佳方案是遵循 Cocoa 的命名规范。在这个示例中，你可以将此方法命名为\
  \ `copyright`，从而完全避免这个问题。ARC 根据方法中完整的驼峰命名法单词来确定内存管理规则。\n\n如果无法重命名方法，你可以在方法声明中添加属性\
  \ `NS_RETURNS_RETAINED` 或 `NS_RETURNS_NOT_RETAINED`，以告诉编译器使用哪种内存管理规则。这些属性定义在 `NSObjCRuntime.h`\
  \ 中。\n\nARC 对你的代码引入了四项限制，以便它可以正确为你添加 retain 和 release 调用：\n\n- 禁止调用 `retain`、`release`\
  \ 或 `autorelease`。这通常是最容易的一条规则。直接删除它们即可。这也意味着你不能重写这些方法，但你几乎不应该这样做。如果你是为了重写这些方法来实现单例模式，请参阅第\
  \ 4 章了解如何在不重写这些方法的情况下正确实现它。\n- C 结构体中不能有对象指针。这种情况很少出现，但如果你在 C 结构体中存储了对象，你需要将其存储在对象中，或者需要将其强制转换为\
  \ `void*`（关于转换为 `void*` 的更多信息请参见下一条规则）。C 结构体可以通过调用 `free` 随时销毁，这会干扰对存储其中的对象的自动跟踪。\n\
  - 在没有桥接转换（bridging cast）的情况下，禁止 `id` 和 `void*` 之间进行转换。这主要影响 Core Foundation 代码。请参阅第\
  \ 19 章关于桥接转换以及如何在 ARC 中使用它们的完整细节。\n- 禁止使用 `NSAutoreleasePool`。与其手动创建自动释放池，不如将任何想要拥有独立池的代码封装在\
  \ `@autoreleasepool{}` 块中。如果你有特殊代码来控制何时释放池，那几乎是不必要的。`@autoreleasepool` 比 `NSAutoreleasePool`\
  \ 快 20 倍。\n\n大多数代码对这些规则没有问题。Xcode 的 `Edit>Refactor` 菜单下有一个新工具叫做 `Convert to Objective-C\
  \ ARC...`。它会为你完成大部分工作。ARC 可能是 Objective-C 自自动释放池出现以来最大的进展。如果可能，你应该将代码转换为 ARC。如果你不能全部转换，请尽可能多转换。它比手动内存管理更快、Bug\
  \ 更少且更容易编写。从今天开始切换到 ARC 吧。\n\n\n\nObjective-C 2.0 引入了一些有趣的变化。其中一个关键改进是非脆弱性的 `ivars`（成员变量）。这允许类在添加\
  \ `ivars` 时无需重新编译其子类。这一特性主要影响的是像 Apple 这样的框架开发者，而不是应用开发者，但它也有一些实用的副作用。最流行用的是合成属性（synthesized\
  \ properties）。\n\n很少有人意识到，合成属性可以生成它们自己的 `ivar`。例如：MyClass.h\n```objc\n@interface\
  \ MyClass : NSObject\n@property (copy) NSString *string;\n@end\n```\n\nMyClass.m\n\
  ```objc\n@implementation MyClass\n@synthesize string=string_;\n@end\n```\n`ivar`\
  \ `string_` 是自动生成的，尽管它没有被列在头文件中。更有趣的是，你可以将属性声明放在私有扩展（private extension）或 `@implementation`\
  \ 块中，从而创建一个完全私有化的属性。（你不能为在分类（category）中定义的属性合成 `ivar`。请参阅本章节后面的“分类与扩展”以获取更多关于差异的信息。）\n\
  \n在你的代码中，我鼓励你要么在接口（interface）中声明所有的 `ivars`，要么合成所有的 `ivars`。不要让一些在接口中声明，另一些却没声明。\n\
  \n我的建议是完全切换到属性和完全合成的 `ivars`。将公共属性放在头文件中，将私有属性放在 `.m` 文件的扩展中。一个完整的示例可能像这样：\n\nMyClass.h\n\
  ```objc\n@interface MyClass : NSObject\n@property (readwrite, weak) id delegate;\n\
  @property (readonly, strong) NSString *readonlyString;\n@end\n```\n\nMyClass.m\n\
  ```objc\n@interface MyClass () // 私有方法\n@property (readwrite, strong) NSString *readonlyString;\n\
  @property (readwrite, strong) NSString *privateString;\n@end\n\n@implementation\
  \ MyClass\n@synthesize delegate=delegate_;\n@synthesize readonlyString=readonlyString_;\n\
  @synthesize privateString=privateString_;\n@end\n```\n\n注意 `readonlyString` 如何在类扩展中被重新定义为\
  \ `readwrite`。这允许你创建一个私有的 setter（设置方法）。\n\n## 属性属性\n\n当我们讨论属性时，也应该考虑应用到属性上的属性。让我们逐个考虑每个类别。\n\
  \n- **原子性 — `nonatomic`**。没有 `atomic` 属性。任何未声明为 `nonatomic` 的都是原子的。这是一个很容易被误解的属性。它的目的是让设置和获取属性是线程安全的。这并不意味着底层对象是线程安全的。例如，如果你声明一个名为\
  \ `stuff` 的 `NSMutableArray` 属性为原子性，那么 `self.stuff` 是线程安全的，`self.stuff=otherStuff`\
  \ 也是线程安全的。但通过 `objectAtIndex:` 访问数组不是线程安全的。你需要额外的锁来处理这一点。`atomic` 属性的实现类似于此：\n\n\
  ```objc\n[_propertyLock lock];\nid result = [[value retain] autorelease];\n[_propertyLock\
  \ unlock];\n```\n\n`retain/autorelease` 模式确保了对象在调用者的 `autorelease` 池排空之前不会被销毁。这保护了调用者免受其他线程在访问期间释放对象。管理锁以及调用\
  \ `retain` 和 `autorelease` 可能是开销的（尽管在 ARC 下原子属性要廉廉得多）。如果你永远不会从另一个线程访问此属性，或者你本身就需要更复杂的锁机制，那么这种原子性就是浪费的。事实证明，大多数情况下都是如此，你通常都想使用\
  \ `nonatomic`。在这种原子性有用的极少数情况下，遗憾的是没有方法可以特别标出来，因为没有 `atomic` 属性。在这些情况下，添加注释是有帮助的，可以明确说明你是有意让该属性变为原子的。\n\
  \nARC 为原子属性提供了显著的性能优势，关于 `nonatomic` 的最佳实践可能会在未来发生变化。\n\n- **可写性 — `readwrite`,\
  \ `readonly`**。这些应该是自言易懂的。如果属性是 `readonly` 的，那么只有 getter（get 方法）可用。如果它是 `readwrite`\
  \ 的，那么 setter 和 getter 都可用。没有 `writeonly` 属性。\n\n- **Setter 语义 — `weak`, `strong`,\
  \ `copy`**。这些应该显而易见，但有些事情需要考虑。首先，你通常应该对 `NSString` 和 `NSArray` 等不可变类使用 `copy`。你的属性类可能存在一个可变子类。例如，如果你有一个\
  \ `NSString` 属性，可能会接收传入一个 `NSMutableString`。如果发生这种情况，且你只持有值的引用（`strong`），那么你的属性可能会在调用者对其变异时在你不知情的情况下发生变化。这通常不是你想要的，所以你会注意到大多数\
  \ `NSString` 属性都使用 `copy` 语义。对于 `NSArray` 等集合通常也是如此。拷贝不可变类通常非常廉价，因为它们几乎总是可以用 `retain`\
  \ 实现。\n\n## 属性最佳实践\n\n属性应该代表对象的状态。Getter 不应该有外部可见的副作用（它们可能有内部副作用，如缓存，但这些对调用者来说应该是不可见的）。通常，它们的调用应该是高效的，并且绝对不应该阻塞。\n\
  \n## 私有 Ivars\n\n虽然我倾向于对一切都使用属性，但有些人更倾向于使用 `ivars`，特别是私有变量。在 iOS 5 中，你可以这样在 `@implementation`\
  \ 块中声明 `ivars`：\n\n```objc\n@implementation Something{\n  NSString *name;\n}\n```\n\
  \n这种语法将私有的 `ivar` 移出了公共头文件，这有利于封装，并保持了头文件的易读性。ARC 会自动保留和释放 `ivars`，就像处理其他变量一样。默认存储类型是\
  \ `strong`，但你可以像这样创建弱 `ivars`：\n\n```objc\n@implementation Something{\n  __weak\
  \ NSString *name;\n}\n```\n\n## 访问器 (Accessors)\n\n避免直接访问 `ivars`。相反，请使用访问器。我稍后会讨论一些例外，但先讨论为什么要使用访问器。\n\
  \n在 ARC 出现之前，常见的 iOS 错误之一就是没有使用访问器。开发者无法正确保留和释放它们的 `ivars`。由于 ARC 自动管理保留和释放，某些开发者可能认为这个规则不再重要，但使用访问器还有其他原因。\n\
  \n- **键值观察 (KVO)**：使用访问器最关键的原因是属性是可以观察的。如果你不使用访问器，那么每次修改属性时都需要调用 `willChangeValueForKey:`\
  \ 和 `didChangeValueForKey:`。使用访问器会在需要时自动调用这些方法。\n\n\n- **锁**：如果你为了管理多线程代码而在属性中引入锁，直接访问\
  \ `ivar` 将破坏这一点并可能导致程序崩溃。\n\n- **一致性**：有人可能会认为，你应该只在知道由于上述原因需要它们时才使用访问器，但这会让代码变得非常难以维护。让每一次直接访问\
  \ `ivar` 变得变得可疑并经过解释，比让你不断记住哪些 `ivars` 需要访问器而哪些不需要要好得多。这使得代码更容易进行审计、审查和维护。访问器（特别是合成访问器）在\
  \ Objective-C 中经过高度优化，它们的开销是值得的。\n\n尽管如此，在某些情况下，你不应该使用访问器：\n\n\n\n\n\n### 访问器内部\n\
  显然，你不能在访问器内部使用它本身。通常，你也不应该在 `setter` 内部使用 `get` 访问器（这在某些模式下可能会导致无限循环）。访问器可以访问自己的成员变量\
  \ `ivar`。\n\n### Dealloc\nARC 极大地减少了对 `dealloc` 的需求，但它仍然有时。最好不要在 `dealloc` 内部调用外部对象。该对象可能处于不一致的状态，而且对于观察者来说，接收多个属性正在更改的通知可能会令人困惑，因为实际上的意思是整个对象正在被销毁。\n\
  \n### 初始化\n与 `dealloc` 类似，对象在初始化期间可能处于不一致的状态，你通常不应该在此期间发送通知或产生其他副作用。这也是初始化如 `NSMutableArray`\
  \ 等只读变量的常见位置。这避免了为了初始化变量而特意将属性声明为 `readwrite`。\n\n访问器在 Objective-C 中经过了高度优化，并为可维护性和灵活性提供了重要特性。作为一个一般原则，你应该通过访问器来引用所有属性，即使是你自己的属性。\n\
  \n## 分类与扩展（Categories and Extensions）\n分类（Categories）允许你在运行时向现有类添加方法。任何类，即使是 Apple\
  \ 提供的 Cocoa 类，都可以通过分类进行扩展，这些新方法将对该类的所有实例可用。这种方法继承自 Smalltalk，与 C# 中的扩展方法（extension\
  \ methods）有些相似。\n\n分类的设计目的是将大型类拆分为更易于管理的部分，因此得此名。如果你查看大型 Foundation 类，你会发现它们有时被拆分成几部分。例如，`NSArray`\
  \ 包含了在 `NSArray.h` 中定义的 `NSExtendedArray`、`NSArrayCreation` 和 `NSDeprecated` 分类，以及在\
  \ `NSPathUtilities.h` 中定义的 `NSArrayPathExtensions` 分类。大部分这些拆分是为了便于在多个文件中实现，但某些分类（如\
  \ `NSString` 上的 `UIStringDrawing` 分类）是为了允许在运行时加载不同的代码。在 Mac 上，AppKit 加载了 `NSStringDrawing`\
  \ 分类；在 iOS 上，UIKit 加载了 `UIStringDrawing` 分类。这提供了一种比 `#ifdef` 更优雅的代码拆分方式。在每个平台上，你只需编译相应的实现文件（`.m`），该功能即可可用。\n\
  \n在 Objective-C 2.0 之前，`@protocol` 定义不能包含可选方法。开发者使用分类作为“非正式协议”。编译器知道分类中定义的方法，但如果未实现这些方法它不会生成警告。这使得协议的所有方法都变成了可选的。我将在本章稍后的“正式协议与非正式协议”中进一步讨论这一点，但对于\
  \ iOS，我不建议这样使用分类。。正式协议现在已直接支持可选方法。\n\n由于编译器不会检查你是否已经实现了分类中的方法，因此仅使用分类来拆分大型类是有权衡的。如果一个实现文件变得过于庞大，通常意味着你需要重构你的类以使其更具针对性，而不是通过定义分类来拆分它。但如果你的类作用域正确，你可能会发现使用分类来拆分代码是方便的。另一方面，使用分类会将方法分散到不同的文件中，这可能会引起困惑，因此请根据你的判断来使用。\n\
  \n### 分类的声明\n分类的声明非常直观。它看起来像类接口声明，但在括号中带有分类名：\n\n```objc\n@interface NSMutableString\
  \ (Capitalize)\n\n- (void)capitalize;\n@end\n```\n\n`Capitalize` 是分类名，但它没有被用于任何地方。注意，这里没有声明\
  \ `ivar`。分类不能声明 `ivar`，也不能合成属性（这两者是同一回事）。你将在本章稍后的部分看到如何添加分类数据。\n\n`Capitalize` 分类并不要求\
  \ `capitalize` 必须在任何地方实现。如果没有实现且调用者尝试调用它，它将抛出异常。编译器在这里没有提供任何保护。如果你确实实现了它，按照惯例，它看起来如下：\n\
  \n```objc\n@implementation NSMutableString (Capitalize)\n\n- (void)capitalize {\n\
  \  [self setString:[self capitalizedString]];\n}\n\n@end\n```\n\n我说“按照惯例”，是因为并没有要求这必须定义在分类实现中，也不要求分类实现的名称与分类接口的名称相同。然而，如果你提供了一个名为\
  \ `Capitalize` 的 `@implementation` 块，那么它必须实现名为 `Capitalize` 的 `@interface` 块中的所有方法。在类名后添加括号和分类名允许你在另一个编译单元（`.m`\
  \ 文件）中继续添加方法。你可以在主 `implementation` 块中实现分类方法，可以在该类的具名分类 `implementation` 块中实现，也可以完全不实现它们。\n\
  \n技术上，分类可以重写方法，但这是危险且不建议的。如果两个分类实现了相同的方法，那么将使用哪一个是未定义的。如果一个类后来由于维护原因被拆分为分类，你的重写可能会变成未定义行为，这是一种极其难以追踪的\
  \ bug。此外，使用此功能会使代码难以理解。分类重写也没有提供调用原始方法的方法。我不建议使用分类来重写现有方法，调试除外。即使是为了调试，我更倾向于使用方法交换（swizzling），这将在\
  \ 20 章中介绍。\n\n分类的一个非常好的用法是为现有类提供工具方法。在这样做时，我建议使用原始类名加上扩展名来命名头文件和实现文件。例如，你可以在 `NSDate`\
  \ 上创建一个简单的 `MyExtensions` 分类：\n\n**NSDate+MYExtensions.h**\n```objc\n@interface\
  \ NSDate (MYExtensions)\n\n- (NSTimeInterval)timeIntervalUntilNow;\n\n@end\n```\n\
  \n**NSDate+MYExtensions.m**\n```objc\n@implementation NSDate (MYExtensions)\n\n\
  - (NSTimeInterval)timeIntervalUntilNow {\n  return [self timeIntervalSinceNow];\n\
  \n@end\n```\n\n只有几个工具方法，将它们合并到一个命名为 `MYExtensions`（或你用于代码的任何前缀）的分类中是方便的。这使得将你喜爱的扩展放入每个项目中变得容易。当然，这会导致代码膨胀，所以在向“工具”分类中放入过多内容要小心。Objective-C\
  \ 像 C 或 C++ 那样能有效地执行死代码消除。\n\n如果你有一组相关的方法，特别是一组可能用不到的集合，将它们拆分到自己的分类是一个好主意。查看 UIKit\
  \ 中的 `UIStringDrawing.h` 是一个很好的例子。\n\n### +load\n分类在运行时附加到类上。定义分类的库可能是动态加载的，因此分类可能在很晚才被添加。Objective-C\
  \ 提供了一个名为 `+load` 的钩子（hook），你可以在分类首次被附加时运行该钩子。（虽然在 iOS 中你无法编写自己的动态库，但系统框架是动态加载并包含分类的。）像\
  \ `+initialize` 一样，你可以使用它来实现分类特定的设置，例如初始化静态变量。\n\n\n\n\n希望你已经准备好问那个显而易见的问题了：“如果分类不能使用\
  \ `+initialize` 是因为它们可能会与其他分类冲突，那么如果多个分类都实现了 `+load` 会怎样呢？”事实证明，这是 Objective-C 运行时极少数真正神奇的部分之一。`+load`\
  \ 方法在运行时经过了特例处理，因此每个分类都可以实现它，并且所有的实现都会被执行。执行顺序是不保证的，而且你不应该尝试手动调用 `+load`。\n\n无论分类是静态加载还是动态加载，`+load`\
  \ 都会被调用。它在分类被添加到运行时时调用，这通常发生在程序启动时（在 `main` 函数执行之前），但也可能在晚得多的时候。\n\n类可以有自己的 `+load`\
  \ 方法（未在分类中定义），这些方法会在类被添加到运行时时调用。除非你正在动态添加类，否则这种用法很少用。\n\n你不需要在 `+load` 中像在 `+initialize`\
  \ 中那样采取防止被多次运行的保护措施。`+load` 消息只会发送给那些实际上实现了它的类，因此你不会像在 `+initialize` 中那样意外接收到来自子类的调用。每个\
  \ `+load` 都会被准确调用一次。你不应该调用 `[super load]`。\n\n## 使用关联引用处理分类数据\n\n虽然分类不能创建新的实例变量（ivar），但它们可以采取最好的替代方案：创建关联引用。关联引用允许你将键值数据附加到任意对象上。\n\
  \n考虑一个 `Person` 类的情况。你想使用分类来添加一个名为 `emailAddress` 的新属性。也许你在其他程序中使用 `Person` 类，有时拥有一个邮箱地址是有意义的，而有时则没有，因此分类是一个避免在不需要时产生额外开销的良好解决方案。或者你并不拥有\
  \ `Person` 类的所有权，维护者不会为你添加该属性。无论如何，你该如何解决这个问题呢？首先，为了参考，请看 `Person` 类：\n\n```objc\n\
  @interface Person : NSObject\n@property (readwrite, copy) NSString *name;\n@end\n\
  \n@implementation Person\n@synthesize name=name_;\n@end\n```\n现在你可以在分类中使用关联引用来添加一个新属性\
  \ `emailAddress`：\n\n```objc\n#import <objc/runtime.h>\n\n@interface Person (EmailAddress)\n\
  @property (readwrite, copy) NSString *emailAddress;\n@end\n\n@implementation Person\
  \ (EmailAddress)\nstatic char emailAddressKey;\n- (NSString *)emailAddress {\n \
  \ return objc_getAssociatedObject(self, &emailAddressKey);\n}\n- (void)setEmailAddress:(NSString\
  \ *)emailAddress {\n  objc_setAssociatedObject(self, &emailAddressKey,\n       \
  \                     emailAddress,\n                            OBJC_ASSOCIATION_COPY);\n\
  }\n@end\n```\n\n注意，关联引用是基于键的内存地址而非其取值的。`emailAddressKey` 中存储了什么并不重要；它只需要有一个唯一的地址。这就是为什么通常使用一个未赋值的\
  \ `static char` 作为键。\n\n关联引用具有良好的内存管理，会根据传递给 `objc_setAssociatedObject` 的参数正确处理\
  \ copy、assign 或 retain 语义。当相关对象被释放时，关联引用也会正确释放。\n\n关联引用是将相关对象附加到警报面板或控件的极佳方法。例如，你可以像下面的代码所示为警报面板附加一个“表示对象”。这段代码可以在本章的示例代码中找到。\n\
  \nViewController.m (AssocRef)\n\n```objc\nid interestingObject = ...;\nUIAlertView\
  \ *alert = [[UIAlertView alloc]\n                     initWithTitle:@”Alert” message:nil\n\
  \                     delegate:self\n                     otherButtonTitles:nil];\n\
  objc_setAssociatedObject(alert, &kRepresentedObject,\n                         \
  \ interestingObject,\n                          OBJC_ASSOCIATION_COPY);\nif (representedObject\
  \ = objc_getAssociatedObject(alert, &kRepresentedObject)) {\n  alertLabel.text =\
  \ representedObject;\n}\n```\n\n\n\n协议（Protocols）是 Objective-C 的重要部分，在 Objective-C\
  \ 2.0 中，正式协议已变得常见。在 Objective-C 1.0 中，协议方法没有 `@optional` 标签，因此所有方法都是强制性的。这在实际中并不很有用。通常你希望协议的部分或全部内容是可选的。因为在\
  \ Objective-C 1.0 中无法实现这一点，开发者通常使用“非正式协议”（informal protocols），你有时仍然会遇到这些协议。\n\n\
  非正式协议是 `NSObject` 上的一个分类（category）。分类告诉编译器存在某个方法，但并不要求实现该方法。这种技术允许开发者记录接口并防止编译器警告，同时表明\
  \ `NSObject` 的任何子类都可以实现这些方法。这并不是定义接口的好方法，但在 Objective-C 1.0 中，它是最好的选择。\n\n随着 Objective-C\
  \ 2.0 的出现，正式协议可以声明可选方法，Mac 上的许多非正式协议正在迁移到正式协议。幸运的是，iOS 一直使用 Objective-C 2.0，因此正式协议是常态。\n\
  \n大多数开发者都熟悉如何声明一个类实现了某个正式协议。你只需要在父类后的角括号中包含协议即可：\n\n```objc\n@interface MyAppDelegate\
  \ : NSObject <UIApplicationDelegate, UITableViewDatasource>\n```\n\n声明协议同样简单：\n\n\
  ```objc\n@protocol UITableViewDataSource <NSObject>\n@required\n- (NSInteger)tableView:(UITableView\
  \ *)tableView\nnumberOfRowsInSection:(NSInteger)section;\n- (UITableViewCell *)tableView:(UITableView\
  \ *)tableView\n  cellForRowAtIndexPath:(NSIndexPath *)indexPath;\n@optional\n- (NSInteger)numberOfSectionsInTableView:(UITableView\
  \ *)tv;\n- (NSString *)tableView:(UITableView *)tableView\ntitleForHeaderInSection:(NSInteger)section;\n\
  ...\n```\n\n\n`NSObject` 被拆分为类和协议。这主要是为了支持 `NSProxy`，它继承了协议但不是类。\n\n对于代理协议（delegate\
  \ protocols），发送消息的对象（delegating object）始终是第一个参数。这很重要，因为它允许单个代理管理多个发送消息的对象。例如，一个控制器可以作为多个\
  \ `UIAlertView` 实例的代理。注意当存在除代理对象以外的其他参数时，命名惯例上的细微差别。如果没有其他参数，类名放在最后（`numberOfSectionsInTableView:`）。如果有其他参数，类名则作为其自身的参数放在前面（`tableView:numberOfRowsInSection:`）。\n\
  \n一旦你创建了协议，你通常需要一个属性来持有它。该属性的典型类型是 `id<Protocol>`：\n\n```objc\n@property(nonatomic,\
  \ weak) id<MyDelegate> delegate;\n```\n\n这意味着“任何符合 `MyDelegate` 协议的对象”。可以同时声明一个特定的类和一个协议，并且可以在类型中声明多个协议：\n\
  \n```objc\n@property(nonatomic, weak) MyClass* <MyDelegate, UITableViewDelegate>\
  \ delegate;\n```\n\n这表示 `delegate` 必须是 `MyClass` 的子类，并且必须同时符合 `<MyDelegate>` 和 `<UITableViewDelegate>`\
  \ 协议。\n\n在许多情况下，协议是子类化的极替代方案。单个对象可以符合多个协议，而不会遭受多重继承的问题（如在 C++ 中发现的问题）。如果你正在考虑抽象类，协议通常是更好的选择。协议在设计良好的\
  \ Cocoa 应用中非常常见。\n\n### 总结\n\n良好的 Objective-C 很大程度上是基于“惯例”而非由编译器强制的。本章涵盖了你每天都会使用的几种重要技术，以使你的程序提升到新水平。遵循\
  \ Cocoa 的命名规范将极大提高代码的可靠性和可维护性，并免费提供键值编码（KVC）和观察（KVO）。正确使用属性将使内存管理变得简单，特别是引入 ARC\
  \ 之后。良好地分类和协议将使你的代码易于理解和扩展。\n\n### 延伸阅读\n\n**Apple 文档**\n\n以下文档可以在 iOS 开发者库 [`developer.apple.com`](http://developer.apple.com/)\
  \ 中或通过 Xcode 文档和 API 参考获取。\n\n**Cocoa 编码指南**\n\n**其他资源**\nGallagher, Matt, “Method\
  \ names in Objective-C,” Cocoa With Love. [`cocoawithlove.com/2009/06/method-names-in-objective-c.html`](http://cocoawithlove.com/2009/06/method-names-in-objective-c.html)\n\
  \nStevenson, Scott, “Cocoa Style for Objective-C,” CocoaDevCentral. [`cocoadevcentral.com/articles/000082.php`](http://cocoadevcentral.com/articles/000082.php)\n\
  \n\n如果你像大多数 iOS 开发者一样，Objective-C 并不是你的第一语言。你可能有其他面向对象语言的背景，如 `Java`、`C++` 或 `C#`。你可能用\
  \ C 语言做过开发。这些语言中没有真正让你准备好如何用 Objective-C 的方式思考。\n\n最初是 Simula，而 Simula 有两个孩子：来自贝尔实验室的\
  \ `C++` 和来自 Xerox PARC 的 Smalltalk。从 `C++` 衍生了 `Java`，它试图让事情变得更简单。微软编写了 `Java.NET`\
  \ 并称之为 `C#`。今天，大多数开发者都接受过 Simula 分支的训练。它的模式包括泛型编程、静态类型、通过子类进行自定义、方法调用和强对象所有权。\n\n\
  Objective-C 和 Cocoa 来自 Smalltalk 的分支。NeXT 开发了一个名为 `NeXTSTEP` 的框架。它用 Objective-C\
  \ 编写，并实现了许多 Smalltalk 模式。当 Apple 将 `NeXTSTEP` 引入 Mac 时，它将其命名为 Cocoa，尽管 `NS` 前缀一直保留至今。Cocoa\
  \ 拥有非常不同的模式，这有时会给新开发者带来困扰。常见的 Cocoa 模式包括协议、动态类型、通过代理进行自定义、消息传递和共享对象所有权。\n\n### 理解模型-视图-控制器\
  \ (MVC)\n\nSmalltalk 和 Cocoa 中最重要的模式被称为模型-视图-控制器（MVC）。这是一种在程序内部分配职责的方法。模型类（Model）负责表示信息。视图类（View）负责与用户交互。控制器类（Controller）负责协调模型和视图之间。\n\
  \nSmalltalk 和 Cocoa 实现 MVC 的方式存在细微差异。本章仅讨论 Cocoa 如何使用 MVC。\n\n#### 使用模型类\n\n\n\n\
  \n\n# 模型类\n\n良好的模型类以一种独立于表现的方式封装一段数据。一个良好模型类的经典示例是 `Person`。一个 `Person` 可能有一个名称、地址、出生日期和图像。`Person`\
  \ 类或相关的模型类会封装从数据源存储和检索相关信息的操作，但不具备任何显示或编辑功能。同一个 `Person` 类应该能够在 iPhone、iPad、Mac\
  \ 或命令行程序上易于复用。模型类应该只引用其他模型类。它们永远不应该引用视图或控制器。模型类可能持有一个恰好是控制器的代理（delegate），但它应该使用协议（protocol）来实现这一点，这样它就不需要引用特定的控制器类。\n\
  \n模型类的名称通常是简单的名词，如 `Person`、`Dog` 和 `Record`。你通常会包含一个两个或三个字母的前缀来标识它们属于你的代码并防止冲突，例如\
  \ `RNPerson`。\n\n模型类可以是可变的，也可以是不可变的。不可变类一旦创建就无法更改。`NSString` 就是一个很好的例子。像 `NSMutableString`\
  \ 这样的可变类在创建后可以更改。在这种语境下，“更改”仅指对象外部可见的变化。内部数据结构（如缓存）的变化并不重要。\n\n不可变对象有很多优点。它们可以节省时间和内存。不可变对象可以通过调用\
  \ `retain` 来实现 `copy`。因为对象不可能更改，所以你不需要创建一个真正的副本。不可变对象天生是线程安全的，不需要锁，这使得它们在多线程代码中的访问更快、更安全。因为所有配置都在初始化时完成，因此要确保对象始终处于一致状态要容易得多。除非有将其变为可变的理由，否则你应该使用不可变模型类。\n\
  \n模型类通常是系统中最可测试和最可复用的类。设计好它们是提高代码整体质量的最佳方法之一。从历史上看，Apple 的示例代码并没有包含设计良好的模型类。这困扰了新开发者，他们认为控制器（更糟糕的是视图）理应该持有数据。Apple\
  \ 较新的示例代码已经有所改进，示例项目 `TheElements` 包含了良好的模型类示例。查看 `AtomicElement` 和 `PeriodicElements`。（参见本章末尾的“进一步阅读”部分。）\n\
  \n# 使用视图类\n\n视图类负责与用户界面交互。它们展示信息并接受用户事件。（这是与 Smalltalk MVC 最大的区别，在 Smalltalk MVC\
  \ 中，控制器类负责用户事件。）视图类不应该引用控制器类。与模型类一样，视图类可能持有一个恰好是控制器的代理，但它们不应该直接引用控制器类。它们也不应该引用其他视图，除了它们的直接父视图和子视图。视图可以引用模型类，但通常只引用它们正在展示的特定模型对象。例如，一个\
  \ `PersonView` 对象可能会显示单个 `Person` 对象。不引用自定义模型对象的视图对象更易于复用。例如，`UITableViewCell` 具有高度的可复用性，因为它只显示字符串和图像。在视图对象中，可复用性和易用性有时存在权衡，找到合适的平衡是你的架构的重要部分。根据我的经验，处理特定模型类的专门视图（specialized\
  \ views）对于应用程序编写者通常非常有用。框架开发者（如 `UIKit` 团队）则需要强调可复用性。\n\n特定模型的视图类名称通常会在模型类后面加上 `View`，例如\
  \ `PersonView` 或 `RecordView`。只有当视图是 `UIView` 的子类时，你才应该这样做。某些视图类有特殊的名称。可复用的视图通常被称为单元格（cells），例如\
  \ iOS 上的 `UITableViewCell` 或 Mac 上的 `NSCell`。轻量级、硬件优化的视图类通常被称为层（layers），例如 `CALayer`\
  \ 或 `CGLayer`。无论它们是否是 `UIView` 或 `NSView` 的子类，它们仍然是 MVC 视图类。\n\n视图负责接收用户的事件，但不负责处理它们。当用户触摸视图时，视图可能会通过通知代理它已被触摸来响应，但它不应该执行逻辑或修改其他视图。例如，按下删除按钮应该只是告诉代理删除按钮已被按下。它不应该告诉模型类删除数据，也不应该告诉表格视图从屏幕上移除数据。这些功能是控制器的职责。\n\
  \n\n在模型和视图之间是控制器，它们实现了大部分应用程序特定的逻辑。大多数控制器在模型类和视图类之间进行协调。例如 `UITableViewController`\
  \ 协调数据模型和 `UITableView`。\n\n某些控制器在模型对象之间或视图对象之间进行协调。这些名称通常以 `Manager` 结尾，例如 `CALayoutManager`\
  \ 和 `CTFontManager`。管理器是单例是常见的。\n\n控制器通常是程序中最不可复用的部分，这就是为什么不让视图和模型类直接引用它们至关重要。即使是控制器也应该避免直接引用其他控制器。在这种语境下，“直接”意味着引用特定的类。引用控制器实现的协议是可以的。例如，`UITableView`\
  \ 引用了 `<UITableViewDelegate>`，但不应该引用 `MyTableViewController`。\n\n一个常见的错误是允许许多对象直接引用应用程序代理（application\
  \ delegate）。例如，你可能想要访问一个全局对象。一种常见但错误的解决方案是将此全局对象作为属性添加到应用程序代理上，并按如下所示访问它：\n\n```objc\n\
  // 不要这样做\nMyAppDelegate *appDelegate =\n  (MyAppDelegate*)[[UIApplication sharedApplication]\
  \ delegate];\nSomething *something = [appDelegate something];\n// 不要这样做\n```\n\n\
  使用这种模式的代码非常难复用。它依赖于 `MyAppDelegate`，而这很难被移动到其他有自己应用程序代理的程序中。访问全局对象的更好方法是单例模式（-（-）-模式（Singleton\
  \ pattern），将在本章稍后部分讨论。\n\n模型-视图-控制器模式在提高代码复用方面非常有效。将其正确应用于你的程序，可以帮助它们融入 Cocoa 框架并简化开发。\n\
  \n# 理解代理和数据源\n\n代理（delegate）是一个辅助对象，用于管理另一个对象的行为。例如，`UITableView` 需要知道每行应该有多高。`UITableView`\
  \ 有一个 `rowHeight` 属性，但这对于解决所有问题。如果第一行应该比其他行高呢？Apple 可能会为该情况添加 `firstRowHeight` 属性。然后它可能会添加\
  \ `lastRowHeight` 和 `evenRowHeight` 属性。`UITableView` 将变得复杂得多，而且仍然局限于 Apple 专门为其设计的用途。\n\
  \n相反，`UITableView` 接收一个代理，该代理可以是符合 `<UITableViewDelegate>` 协议的任何对象类。每当 `UITableView`\
  \ 准备绘制某行时，它都会询问其代理该行有多高。这允许你为行高实现任意逻辑。它可以基于该行的数据、用户配置选项或任何适用于你的应用程序的其它标准。代理模式（Delegation）使自定义变得极其灵活。\n\
  \n\n\n\n\n某些对象拥有一种特殊的代理，称为数据源（data source）。`UITableView` 有一个名为 `<UITableViewDataSource>`\
  \ 的数据源协议。通常，代理（delegate）负责外观和行为，而数据源负责要显示的数据。这种职责分工的方式在某些情况下非常有用，但在大多数时候，代理和数据源是同一个对象。这个对象通常是控制器（controller）。例如，`UITableViewController`\
  \ 同时遵循了 `<UITableViewDelegate>` 和 `<UITableViewDataSource>`。\n\n作为一条通用规则，对象不会持有它们的代理。如果你创建一个带有\
  \ `delegate` 属性的类，它几乎总是应该被声明为 `weak`。在大多数情况下，一个对象的代理也是它的控制器，而控制器几乎总是持有原始对象。如果对象持有了它的代理，就会产生引用循环（retain\
  \ loop）并导致内存泄漏。这条规则也有例外。例如，`NSURLConnection` 会持有其代理，但仅在连接加载期间是如此。之后，`NSURLConnection`\
  \ 会释放其代理，从而避免永久的引用循环。\n\n代理通常是观察者（参见本章后半部分的“如何使用观察者模式”）。对象拥有与它们的通知平行的代理方法是很常见的。例如，`UIApplication`\
  \ 向其代理发送 `applicationWillTerminate:`。它还会发布通知 `UIApplicationWillTerminateNotification`。\n\
  \n\n### 使用命令模式\n\n命令模式将请求封装成一个对象。与其直接调用方法，不如将方法调用封装成一个对象并进行分发，可能在稍后执行。这可以提供极大的灵活性，并允许请求被队列、重定向、记录和序列化。它还通过存储命令的反向操作来支持撤销操作。Cocoa\
  \ 使用目标-动作（target-action）和 `NSInvocation` 实现命令模式。在本节中，你将学习如何使用 `NSInvocation` 创建更复杂的分发对象，例如蹦板（trampolines）。\n\
  \n## 使用目标-动作\n\nCocoa 中命令模式简单的形式被称为目标-动作。这不是命令模式的完整实现，因为它没有将请求封装到单独的对象中，但它允许类似的灵活性。\n\
  \n`UIControl` 是目标-动作的一个极佳示例。你通过调用 `addTarget:action:forControlEvents:` 来配置 `UIControl`。这建立了一个目标（target，接收消息的对象）、一个动作（action，要发送的消息）以及一组触发消息的事件。动作选择器（action\
  \ selector）必须符合特定的签名。在 `UIControl` 的情况下，签名必须是以下形式之一：\n\n```objectivec\n- (void)action;\n\
  - (void)action:(id)sender;\n- (void)action:(id)sender forEvent:(UIEvent *)event;\n\
  ```\n\n`UIControl` 然后可以这样分发它的 `action`：\n\n```objectivec\n[target performSelector:action\n\
  \             withObject:self\n             withObject:event];\n```\n\n由于 Objective-C\
  \ 消息传递的工作机制，这种 `performSelector:...` 的用法无论 `action` 带有一个、两个还是零参数都是有效的。（有关 Objective-C\
  \ 消息传递实现的细节，请参见第 20 章。）\n\n目标-动作在 Objective-C 中非常常见。控件、定时器、工具栏、手势识别器、`IBAction`、通知以及\
  \ Cocoa 的其他部分都依赖这种模式。\n\n目标-动作与代理相似。主要区别在于在目标-动作中选择器是可配置的，而在代理中选择器是由协议定义的。让单个对象成为多个\
  \ `NSTimer` 对象的目标，比成为多个 `UITableView` 对象的代理容易得多。要监听多个 `NSTimer` 对象，你只需要用不同的动作来配置它们：\n\
  \n```objectivec\n[NSTimer scheduledTimerWithTimeInterval:1 target:self\n       \
  \      selector:@selector(firstTimerFired:) ...];\n[NSTimer scheduledTimerWithTimeInterval:1\
  \ target:self\n             selector:@selector(secondTimerFired:) ...];\n```\n\n\
  要监听多个表格视图，你需要检查是哪个表格视图发送了请求：\n```objectivec\n- (NSInteger)numberOfSectionsInTableView:(UITableView*)tv\
  \ {\n  if (tv == self.tableView1) {\n    return [self.dataset1 count];\n  }\n  else\
  \ if (tv == self.tableView2) {\n    return [self.dataset2 count];\n  }\n  else {\n\
  \    NSAssert(NO, @\"Bad tv: %@\", tv);\n    return 0;\n  }\n}\n```\n\n每个代理方法都必须包含这段\
  \ `if` 逻辑，这可能会变得很繁琐。由于这个原因，类的多个实例通常不共享同一个代理。另一方面，代理允许你在编译时验证所需的方法是否已实现。编译器无法验证 `NSTimer`\
  \ 的目标是否实现了给定的动作。\n\n虽然编译器无法确定目标是否实现了某个动作，但你可以通过开启未声明警告（`GCC_WARN_UNDECLARED_SELECTOR`,\
  \ `-Wundeclared-selector`）检查简单的拼写错误。如果 `@selector(...)` 表达式引用了未知的选择器，将生成一个警告。\n\n\
  ## 使用方法签名和调用\n\n`NSInvocation` 是命令模式的传统实现。它将目标、选择器、方法签名和所有参数打包成一个对象，该对象可以存储并在稍后调用。当调用\
  \ 被调用时，它将发送消息，Objective-C 运行时将找到正确的方法实现。\n\n方法实现（`IMP`）是一个指向 C 函数的函数指针，具有如下签名：\n\
  \n```c\nid function(id self, SEL _cmd, ...)\n```\n\n每个方法实现都接受两个参数：`self` 和 `_cmd`。第一个参数是你熟悉的\
  \ `self` 指针。第二个参数 `_cmd` 是发送给该对象的选择器。这是语言中的一个保留符号，访问方式与 `self` 完全相同。有关如何处理方法实现的更多细节，请参见第\
  \ 20 章。\n\n虽然 `IMP` 类型定义暗示每个 Objective-C 方法都返回 `id`，但显然许多 Objective-C 方法返回整数或浮点数等其他类型，许多\
  \ Objective-C 方法完全不返回任何内容。实际的返回类型由下面讨论的消息签名定义，而不是 `IMP` 类型定义。\n\n\n\n\n`NSInvocation`\
  \ 包含一个目标（target）和一个选择器（selector）。正如在“使用目标-动作”章节中所讨论的，目标是接收消息的对象，而选择器是要待发送的消息。选择器大致上是方法的名称。我之所以用“大致”，是因为选择器并不非要完全映射到方法。选择器只是一个名称，例如\
  \ `initWithBytes:length:encoding:`。选择器没有绑定到任何特定的类、任何特定的返回值或参数类型。它甚至不特定地是类选择器还是实例选择器。你可以将选择器视为一个字符串。因此\
  \ -`[NSString length]` 和 -`[NSData length]` 具有相同的选择器，尽管它们映射到不同的方法实现。\n\n\n```\n\
  NSMethodSignature *sig =\n    [NSMethodSignature signatureWithObjCTypes:”@@:*”];\n\
  ```\n\n这是 `–[NSString initWithUTF8String:]` 的签名。第一个字符（`@`）表示返回值是一个 `id`。对于消息传递系统来说，所有的\
  \ Objective-C 对象都是相同的。它无法区分 `NSString` 和 `NSArray`。接下来的两个字符（`@:`）表示该方法接受一个 `id`\
  \ 和一个 `SEL`。如上所述，每个 Objective-C 方法都将这两个作为其前两个参数。它们被隐式地作为 `self` 和 `_cmd` 传递。最后，最后一个字符（`*`）表示第一个“真实”参数是一个字符字符串（`char*`）。\n\
  \n如果你直接处理类型编码（type encoding），可以使用 `@encode(type)` 来获取表示该类型的字符串，而不是硬编码字母。例如，`@encode(id)`\
  \ 是字符串“`@`”。\n\n你不应该经常调用 `signatureWithObjCTypes:`。我在这里使用它仅仅是为了展示手动构建方法签名是可行的。你通常获取方法签名的方法是向类或实例请求。在在此之前，你需要考虑该方法是实例方法还是类方法。方法\
  \ `–init` 是实例方法，并以开头的连字符（`-`）标记。方法 `+alloc` 是类方法，并以开头的加号（`+`）标记。你可以使用 `methodSignatureForSelector:`\
  \ 从实例请求实例方法签名，从类请求类方法签名。如果你想从类获取实例方法签名，则使用 `instanceMethodSignatureForSelector:`。以下示例演示了针对\
  \ `+alloc` 和 `–init` 的操作。\n\n```\nSEL initSEL = @selector(init);\nSEL allocSEL =\
  \ @selector(alloc);\nNSMethodSignature *initSig, *allocSig;\n\n// 从实例获取实例方法签名\n\
  initSig = [[NSString alloc] methodSignatureForSelector:initSEL];\n\n// 从类获取实例方法签名\n\
  initSig = [NSString\n            instanceMethodSignatureForSelector:initSEL];\n\n\
  // 从类获取类方法签名\nallocSig = [NSString\n            methodSignatureForSelector:allocSEL];\n\
  ```\n\n如果你比较 `initSig` 和 `allocSig`，你会发现它们相同的。它们都不接受额外的参数（除了 `self` 和 `_cmd` 之外），并返回一个\
  \ `id`。这对于消息签名来说就是全部了。\n\n现在你已经有了选择器和签名，可以将它们与目标和参数值结合，构造出一个 `NSInvocation`。`NSInvocation`\
  \ 封装了传递消息所需的所有内容。以下是创建消息 `[set addObject:stuff]` 的调用并执行它的方法：\n\n```\nNSMutableSet\
  \ *set = [NSMutableSet set];\nNSString *stuff = @”Stuff”;\nNSMethodSignature *sig\
  \ =\n    [set methodSignatureForSelector:selector];\nNSInvocation *invocation =\n\
  \    [NSInvocation invocationWithMethodSignature:sig];\n[invocation setTarget:set];\n\
  [invocation setSelector:selector];\n\n// 将第一个参数放在索引 2 。\n[invocation setArgument:&stuff\
  \ atIndex:2];\n[invocation invoke];\n```\n\n注意，第一个参数被放在索引 2。如上所述，索引 0 是目标（`self`），索引\
  \ 1 是选择器（`_cmd`）。`NSInvocation` 会自动设置这些。另外注意，你必须传递给它的指针。\n\n### 使用蹦床（Trampolines）\n\
  \n蹦床（trampoline）将消息从一个对象“弹”到另一个对象。这允许代理对象将消息移动到另一个、缓存结果、合并消息或进行任何中间处理。\n\n在这个示例中，你创建了一个名为\
  \ `ObserverManager` 的蹦床。发送到该蹦床的任何消息都将转发给响应它的已注册观察者。这提供了类似于 `NSNotification` 的功能，但如果有许多观察者，这种方法更容易使用。\n\
  \n以下是 `ObserverManager` 的公共接口：\n\n**ObserverManager.h (蹦床)**\n```objc\n#import <objc/runtime.h>\n\
  \n@interface ObserverManager: NSObject\n\n- (id)initWithProtocol:(Protocol *)protocol\
  \ observers:(NSSet *)observers;\n- (void)addObserver:(id)observer;\n- (void)removeObserver:(id)observer;\n\
  \n@end\n```\n\n\n这是 `ObserverManager` 的骨架实现，不包含蹦床部分。一切应该是显而易见的。\n\n**ObserverManager.m\
  \ (蹦床)**\n```objc\n@interface ObserverManager()\n@property (nonatomic, readonly,\
  \ strong) NSMutableSet *observers;\n@property (nonatomic, readonly, strong) Protocol\
  \ *protocol;\n@end\n\n@implementation ObserverManager\n@synthesize observers = observers_;\n\
  @synthesize protocol = protocol_;\n\n- (id)initWithProtocol:(Protocol *)protocol\
  \ observers:(NSSet *)observers {\n    if ((self = [super init])) {\n        protocol_\
  \ = protocol;\n        observers_ = [NSMutableSet setWithSet:observers];\n    }\n\
  \    return self;\n}\n@end\n```\n\n\n\n\n```objectivec\n  return self;\n}\n\n- (void)addObserver:(id)observer\
  \ {\n  NSAssert([observer conformsToProtocol:self.protocol],\n              @\"\
  Observer must conform to protocol.\");\n  [self.observers addObject:observer];\n\
  }\n\n- (void)removeObserver:(id)observer {\n}\n\n@end\n```\n\n现在你重写了 `methodSignatureForSelector:`。Objective-C\
  \ 消息分发器使用此方法为未知的选择器（selectors）构建 `NSInvocation`。你重写它来返回在 `protocol` 中定义的方法签名，并使用了\
  \ `protocol_getMethodDescription`。你需要从协议而非观察者中获取方法签名，因为该方法可能是可选的，而观察者可能没有实现它。\n\n\
  ```objectivec\n- (NSMethodSignature *)methodSignatureForSelector:(SEL)sel\n{\n \
  \ // 检查蹦板（trampoline）本身\n  NSMethodSignature *\n  result = [super methodSignatureForSelector:sel];\n\
  \  if (result) {\n    return result;\n  }\n  // 查找必需方法\n  struct objc_method_description\
  \ desc =\n              protocol_getMethodDescription(self.protocol,\nsel, YES,\
  \ YES);\n  if (desc.name == NULL) {\n    // 没找到。可能是可选的\n    desc = protocol_getMethodDescription(self.protocol,\n\
  sel, NO, YES);\n  }\n  if (desc.name == NULL) {\n    // 未找到。抛出 NSInvalidArgumentException\n\
  \    [self doesNotRecognizeSelector: sel];\n    return nil;\n  }\n  return [NSMethodSignature\n\
  \                            signatureWithObjCTypes:desc.types];\n}\n```\n\n最后，你重写了\
  \ `forwardInvocation:` 将调用（invocation）转发给响应该选择器的观察者：\n\n```objectivec\n  SEL selector\
  \ = [invocation selector];\n  for (id responder in self.observers) {\n    if ([responder\
  \ respondsToSelector:selector]) {\n      [invocation setTarget:responder];\n   \
  \   [invocation invoke];\n    }\n  }\n}\n```\n\n要使用这个蹦板，你需要创建一个实例，设置观察者，然后像下面的代码所示向它发送消息。持有蹦板的变量通常应该是\
  \ `id` 类型，这样你可以向它发送任何消息而不会产生编译器警告。\n\n```objectivec\n  @protocol MyProtocol <NSObject>\n\
  \  - (void)doSomething;\n  @end\n\n  ...\n\n  id observerManager = [[RNObserverManager\
  \ alloc]\n                           initWithProtocol:@protocol(MyProtocol)\n  \
  \                         observers:observers];\n  [observerManager doSomething];\n\
  ```\n\n这种行为与发布通知（notification）类似。你可以使用这种技术来解决各种问题。例如，你可以创建一个代理蹦板，将所有消息转发到主线程，如下所示：\n\
  \n### RNMainThreadTrampoline.h (观察者蹦板)\n\n```objectivec\n@interface RNMainThreadTrampoline\
  \ : NSObject\n@property (nonatomic, readwrite, strong) id target;\n- (id)initWithTarget:(id)aTarget;\n\
  @end\n```\n\n\n```objectivec\n@implementation RNMainThreadTrampoline\n@synthesize\
  \ target = target_;\n- (id)initWithTarget:(id)aTarget {\n  if ((self = [super init]))\
  \ {\n    target_ = aTarget;\n  }\n  return self;\n}\n- (NSMethodSignature *)methodSignatureForSelector:(SEL)sel\n\
  {\n  return [self.target methodSignatureForSelector:sel];\n}\n- (void)forwardInvocation:(NSInvocation\
  \ *)invocation {\n  [invocation setTarget:self.target];\n  [invocation retainArguments];\n\
  \  [invocation performSelectorOnMainThread:@selector(invoke)\n                 \
  \         withObject:nil\n                        waitUntilDone:NO];\n}\n@end\n\
  ```\n\n`forwardInvocation:` 可以透明地合并消息、添加日志、将消息转发到其他机器，并执行各种功能。请参阅第 20 章获取更多讨论，包括如何耦合\
  \ `NSProxy`。\n\n### 使用撤销（Undo）\n\n命令模式是撤销的核心。通过在栈中存储命令对象（`NSInvocation`），你可以提供撤销（undo）和重做（redo）功能。在执行用户能够撤销的操作之前，你将其它的逆操作传递给\
  \ `NSUndoManager`。实现此点的方便方法是使用 `prepareWithInvocationTarget:`。例如：\n\n```objectivec\n\
  - (void)setString:(NSString *)aString {\n  // 确保发生了变化\n  if (!aString isEqualToString:string_])\
  \ {\n    // 将撤销操作发送给蹦板\n    [[self.undoManager prepareWithInvocationTarget:self]\n\
  \                             setString:string_];\n    string_ = aString;\n  }\n\
  }\n```\n\n当你调用 `prepareWithInvocationTarget:` 时，撤销管理器返回一个你可以向其发送任意消息的蹦板。这些消息被转换为\
  \ `NSInvocation` 对象并存储在栈中。当用户想要撤销某个操作时，撤销管理器只需调用栈上的最后一个命令。命令模式贯穿 Cocoa 框架，是你架构中非常有用的工具。它帮助将分发与请求分离，提高了代码的可用性和灵活性。\n\
  \n### 观察者模式工作\n\n观察者模式允许对象通知许多观察者其状态的变化，而不需要被观察对象对观察者有特殊的了解。观察者模式在 Cocoa 中有很多形式，包括\
  \ `NSNotification`、代理观察（delegate observations）和键值观察（KVO）。它鼓励对象之间的松耦合，使得组件更具重用性和健壮性。\n\
  \n代理观察在“理解代理”中有所讨论。KVO 在第 15 章有详细介绍。\n\n大多数 Cocoa 开发者都接触过 `NSNotification`。它通过允许一个对象由字符串名称定义的事件被通知，来实现松耦合。这种方式比\
  \ KVO 更容易实现和理解。这里有一个如何良好使用它的示例。\n\n#### Poster.h\n\n```objectivec\n//为通知定义字符串常量\n\
  extern NSString * const PosterDidSomethingNotification;\n```\n\n#### Poster.m\n\n\
  ```objectivec\n  NSString * const PosterDidSomethingNotification = @\"PosterDidNotification\"\
  ;\n\n  ...\n\n  // 将 poster 作为对象发布通知\n  [[NotificationCenter defaultCenter]\n  \
  \ postNotificationName:PosterDidSomethingNotification\n   object:self];\n```\n\n\
  #### Observer.m\n```objectivec\n// 导入 Poster.h 获取字符串常量\n#import \"Poster.h\"\n\n\
  \  ...\n\n  // 注册接收通知\n  [[NotificationCenter defaultCenter] addObserver:self\n\
  \    selector:@selector(posterDidSomething:)\n        name:PosterDidSomethingNotification\n\
  \      object:nil];\n\n  ...\n\n- (void) posterDidSomething:(NSNotification *)note\
  \ {\n  // 在此处处理通知\n}\n\n- (void)dealloc {\n  // 始终移除你的观察\n  [[NotificationCenter\
  \ defaultCenter]\n    removeObserver:self];\n  [super dealloc];\n}\n```\n\n注意名称\
  \ `PosterDidSomethingNotification`。它以 poster 的类开头，这始终应该是 `object` 的类。然后它遵循“will”或“did”模式。这与代理方法非常相似，而且是有意的。结尾的\
  \ `Notification` 是通知名称的传统写法，用于与其他键或路径等字符串常量区分开。\n\n此示例使用字符串常量作为通知名称。这对于避免拼写错误至关重要。通知字符串常量传统上不像某些常量那样以\
  \ `k` 开头。我建议字符串常量的值与其名称匹配，如示例所示。这样当你在调试日志中看到值时，可以明显看出使用的是哪个常量。\n\n在声明字符串常量时，`const`\
  \ 的位置非常重要。这种声明是正确的：\n\n```objectivec\nextern NSString * const RNFooDidCompleteNotification;\n\
  ```\n\n\n\n此声明是错误的：\n\n```objc\nextern const NSString * RNFooDidCompleteNotification;\n\
  ```\n\n前者是一个指向不可变字符串的常量指针。后者是一个指向不可变字符串的可变指针。`NSString` 始终是不可变的，因为它是一个不可变类。因此，`NSString\
  \ * const` 是有用的，而 `const NSString *` 是没用的。如果你从右到左阅读这个声明，会更容易记住：“一个指向 `NSString`\
  \ 的 `const` 指针。”\n\n正如我之前提到的，通知名称的开头应该总是 `object` 的类。在这种情况下，它是 `Poster`。这几乎总是 `self`（发布通知的对象实例）。为了保持一致性，通知应该始终包含一个\
  \ `object`，即使它是一个单例也是如此。\n\n观察者应该仔细考虑是观察某个特定的对象还是 `nil`（所有具有给定名称的通知，无论 `object`\
  \ 的值如何）。观察特定的对象可以让代码更整洁，并确保观察者不会收到来自其未感知的实例的通知。一个今天只有一个实例的类，明天可能会有额外的实例。\n\n如果你观察一个特定的实例，通常它应该是你在\
  \ `ivar` 中 `retain` 的东西。观察某个东西并不会 `retain` 它，你正在观察的对象可能会被释放。这不会导致崩溃；你只是不再接收来自该对象的通知了。但这种做法很粗率，并且可能表明你的设计存在缺陷。它还使用了通知表中不必要的槽位，对性能不利。\n\
  \n虽然观察一个会被释放的对象不会导致崩溃，但通知一个已释放的观察者会导致崩溃。这就是为什么如果你的对象的任何部分调用了 `addObserver:...`，你应该始终在\
  \ `dealloc` 中调用 `removeObserver:`。养成这个习惯。这是使用通知的代码中最常见且可以预防的崩溃原因之一。\n\n使用相同的参数多次调用\
  \ `addObserver:selector:name:object:` 会导致你收到多次回调。这几乎不是你想要的。通常，最好的办法是在 `init` 中开始观察通知并在\
  \ `dealloc` 中停止。但如果你想观察来自某个属性的通知，而该属性可能会发生呢？这个示例展示了如何编写 `setPoster:`，以便为 `poster`\
  \ 属性正确地添加和移除观察：\n\n```objc\n- (void)setPoster:(Poster *)aPoster {\n    NSNotificationCenter\
  \ *nc = [NSNotificationCenter defaultCenter];\n    if (poster_ != nil) {\n     \
  \   // 移除旧值的所有观察\n        [nc removeObserver:self name:kPosterDidChangeNotification\
  \ object:poster_];\n    }\n    poster_ = aPoster;\n    if (poster_ != nil) {\n \
  \       // 添加观察\n        [nc addObserver:self selector:@selector(posterDidChange)\
  \ name:kPosterDidChangeNotification object:poster_];\n    }\n}\n```\n\n在观察对象时，`nil`\
  \ 的检查是非常重要的。传递 `object: nil` 意味着“任何对象”。观察特定的对象可以让代码更整洁，并确保观察者不会收到来自其未感知的实例的通知。一个今天只有一个实例的类，明天可能会有额外的实例。\n\
  \n如果你观察一个特定的实例，通常它应该是你在 `ivar` 中 `retain` 的东西。观察某个东西并不会 `retain` 它，你正在观察的对象可能会被释放。这不会导致崩溃；你只是不再接收来自该对象的通知了。但这种做法很粗率，并且可能表明你的设计存在缺陷。它还使用了通知表中不必要的槽位，对性能不利。\n\
  虽然观察一个会被释放的对象不会导致崩溃，但通知一个已释放的观察者会导致崩溃。这就是为什么如果你的对象的任何部分调用了 `addObserver:...`，你应该始终在\
  \ `dealloc` 中调用 `removeObserver:`。养成这个习惯。这是使用通知的代码中最常见且可以预防的崩溃原因之一。\n\n使用相同的参数多次调用\
  \ `addObserver:selector:name:object:` 会导致你收到多次回调。这几乎不是你想要的。通常，最好的办法是在 `init` 中开始观察通知并在\
  \ `dealloc` 中停止。但如果你想观察来自某个属性的通知，而该属性可能会发生呢？这个示例展示了如何编写 `setPoster:`，以便为 `poster`\
  \ 属性正确地添加和移除观察：\n\n```objc\n- (void)setPoster:(Poster *)aPoster {\n    NSNotificationCenter\
  \ *nc = [NSNotificationCenter defaultCenter];\n    if (poster_ != nil) {\n     \
  \   // 移除旧值的所有观察\n        [nc removeObserver:self name:kPosterDidChangeNotification\
  \ object:poster_];\n    }\n    poster_ = aPoster;\n    if (poster_ != nil) {\n \
  \       // 添加观察\n        [nc addObserver:self selector:@selector(posterDidChange)\
  \ name:kPosterDidChangeNotification object:poster_];\n    }\n}\n```\n\n观察对象时，`nil`\
  \ 的检查是非常重要的。传递 `object: nil` 意味着“任何对象”。观察特定的对象可以让代码更整洁，并确保观察者不会收到来自其未感知的实例的通知。一个今天只有一个实例的类，明天可能会有额外的实例。\n\
  \n\n\n如果你正在创建一个透明且严格的单例（strict singleton），请确保它是一个实现细节，而不是调用者必须知晓的内容。例如，该类应该是不可变的。如果调用者使用\
  \ `+alloc` 请求了不同的实例，那么对其中一个实例的修改影响了另一个，将会非常令人困惑。\n\n在大多数情况下，你应该使用共享单例（shared singleton）而不是严格单例。共享单例只是一个可以通过类方法轻松获取的特定实例。它通常存储在静态变量中。实现这一点有很多方法，但我推荐使用这种模式，利用\
  \ `+initialize`：\n\n```objectivec\n  static Singleton *sSingleton;\n\n  @implementation\
  \ Singleton\n  + (void)initialize {\n    NSAssert(self == [Singleton class],\n \
  \             @\"Singleton is not designed to be subclassed.\");\n    sSingleton\
  \ = [Singleton new];\n  }\n  + (Singleton *)sharedSingleton {\n  }\n  @end\n```\n\
  \n这种方法易编写、快速且线程安全。其他方法通过在 `+sharedSingleton` 中添加 `@synchronize` 来实现线程安全，但每次调用 `+sharedSingleton`\
  \ 都会带来显著的性能代价。`+initialize` 每个类只会被自动调用一次，因此它从本质上是线程安全的。\n\n可以子类 `Singleton`，但通常没有必要，所以我倾向于禁止它，而不是包含允许子类化所需的需要的额外复杂度。在大多数情况下，自定义单例的最佳方法是使用本章前面“理解代理和数据源”中描述的策略模式。与其子类，不如将可变逻辑放入一个单独的对象中，并将其作为代理（delegate）分配给单例。如果调用者没有提供代理，你可以提供一个默认的代理对象。这是一个对象（单例）应该保留其代理的稀有情况。这种方法的一个主要优势是，替换代理会立即改变单例对所有用户的行为，即使他们已经将单例存储在自己的实例成员变量（ivars）中。\n\
  \n如果你能在 `+initialize` 中确定正确的子类，那么子类的大多数问题就可以消除。例如，你可以做出类似这样的编译时决策：\n\n```objectivec\n\
  \  + (void)initialize {\n    if (self == [Singleton class]) {\n#if DEBUG\n     \
  \   sSingleton = [SingletonDebug new];\n#else\n        sSingleton = [SingletonRelease\
  \ new];\n#endif\n    }\n  }\n```\n\n你可以做出类似的运行时决策，例如检查 iOS 版本或你是否在 iPhone 或 iPad\
  \ 上。在这些情况下，子类化 `Singleton` 是没有问题的，因为因为它只能被设置一次。\n\n如果你确实需要在运行时更改单例实例，可以提供一个 `+setSharedSingleton:`\
  \ 方法：\n\n```objectivec\n  + (void)initialize {\n    if (self == [Singleton class])\
  \ {\n        sSingleton = [Singleton new];\n    }\n  }\n  + (Singleton *)sharedSingleton\
  \ {\n    return sSingleton;\n  }\n  + (void)setSharedSingleton:(Singleton *)aSingleton\
  \ {\n  }\n```\n\n这种方法的问题在于，当你调用 `setSharedSingleton:` 时，其他对象可能已经有了指向之前对象的指针。之前的代码也不完全是线程安全的。\n\
  \n虽然共享单例是是方法，但有时你确实需要一个严格的单例。例如，你可能有一个管理到服务器连接的单例，而服务器协议可能禁止来自同一设备同时建立多个连接。作为一般原则，你应该首先尝试重新设计协议以消除这种限制，但在某些情况下这是不实际的，严格执行的单例是最佳方法。\n\
  \n在大多数情况下，实现此点的最佳方法是作为共享单例，但像这里将对 `init` 的调用视为带有 `NSAssert` 的编程错误：\n\n```objectivec\n\
  \  - (id)init {\n    // 禁止调用 init 或 +new\n    NSAssert(NO, @\"Cannot create instance\
  \ of Singleton\");\n    // 你可以在这里返回 nil 或 [self initSingleton]，\n    // 取决于你倾向于如何失败。\n\
  \    return nil;\n  }\n  // 真正的初始化方法\n  - (id)initSingleton {\n    self = [super\
  \ init];\n    if ((self = [super init])) {\n      // 初始化代码\n    }\n    return self;\n\
  \  }\n  + (void)initialize {\n    NSAssert(self == [Singleton class],\n        \
  \      @\"Singleton is not designed to be subclassed.\");\n    sSingleton = [[Singleton\
  \ alloc] initSingleton];\n  }\n```\n\n这种方法的优点是它防止了调用者在被禁止的情况下认为他们正在创建多个实例。框架应该避免静默修复编程错误，这只会让\
  \ bug 难以追踪。\n\n正如“理解模型-视图-控制器”中讨论的，开发者经常使用应用 delegate 来存储像这样的全局变量：\n\n```objectivec\n\
  \  MyAppDelegate *appDelegate =\n      (MyAppDelegate*)[[UIApplication sharedApplication]\
  \ delegate];\n  Something *something = [appDelegate something];\n  // 不要这样做\n```\n\
  \n在几乎所有情况下，使用如下所示的 `Something` 单例来实现它会更好：\n\n```objectivec\n  Something *something\
  \ = [Something sharedSomething];\n```\n\n这样，当你将 `Something` 类拷贝到另一个项目时，它是自包含的。你不需要连同它一起提取应用\
  \ delegate 的片段。如果应用 delegate 正在存储配置信息，最好将其移动到 `NSUserDefaults` 或单例 `Configuration`\
  \ 对象中。\n\n单例模式是设计良好的 Cocoa 应用中最常见的模式之一。不要过度使用它。如果一个对象只在少数地方使用，只需将其传递给需要它的对象即可。但对于具有整个应用程序范围的对象，它是维护松散耦合和提高代码重用性的非常好的方法。\n\
  \n### 总结\n\n本章探讨了 Cocoa 中最流行的模式，特别是策略、观察者、命令和单例模式。你学习了几种模式如何结合以促进 Cocoa 的核心架构：模型-视图-控制器。Cocoa\
  \ 使用关注于松散耦合和代码重用的设计模式。理解这些模式将帮助你预测 Apple 框架的结构，并提高你的代码与 iOS 的集成。Apple 在 iOS 中使用的模式已经非常成熟，并且多年来在业界和学术界经过研究和完善。正确地应用这些模式将提高你程序的质量和重用性。\n\
  \n### 延伸阅读\n\n### Apple 文档\n\n以下文档可以在 [`developer.apple.com`](http://developer.apple.com/)\
  \ 上的 iOS Developer Library 或通过 Xcode 文档和 API 参考中获取。\n\n- “Cocoa Design Patterns,”Cocoa\
  \ Fundamentals Guide。这整篇文档对于理解 Cocoa 都有价值，但“Cocoa Design Patterns”部分侧重于 Cocoa 如何应用这些成熟的软件模式。\n\
  - The Elements (Sample Code)。从历史上来看，Apple 的示例代码并没有展示出良好的设计或编码实践。重点通常是展示特定功能如何工作，示例代码通常忽略了\
  \ Apple 的建议和通用最佳实践。Apple 似乎已经改变了其示例代码的方法，一些最近的示例设计且编写良好。The Elements 是开发者可以用来构建自己项目的一个良好示例。\n\
  - Notification Programming Guide。解释了使用 `NSNotification` 实现的观察者模式。\n- Undo Architecture。解释了如何使用命令模式使用\
  \ `NSUndoManager`。\n\n### 其他资源\n\n\n\n\nGamma, Erich et al. 《Design Patterns: Elements\
  \ of Reusable Object-Oriented Software》 (Addison-Wesley Professional, 1994. ISBN:\
  \ 978-0201633610) 这本书是著名设计模式的汇，通过 C++ 和 Smalltalk 的代码示例用实用的术语进行了解释。它应该是每位开发者库中的必备书籍。Erich\
  \ Gamma 和他的合著者们并没有发明这些模式，《设计模式》并非所有模式的详尽列表。这本书试图分类作者发现在开发者中常用的模式，并提供一个框架，让开发者可以将已知的解决方案应用于他们独特的问题。\n\
